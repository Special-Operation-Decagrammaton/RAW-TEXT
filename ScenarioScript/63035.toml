[translation]
63035-1 = "제3화;나팔 부는 천사"
63035-4 = "큭……!"
63035-5 = "[ns] \"사오리!\""
63035-6 = "사오리 언니!"
63035-7 = "괜찮아. 조금 긁힌 정도야."
63035-8 = "……누가 봐도 안 그렇지만, 리더가 그렇다면야……."
63035-9 = "그런데, 이거 진짜 어쩌지? 물론 지금까지 '저런 거' 상대로 이긴 적이 없긴 한데……."
63035-10 = "이번은 정말로, 차원이 완전 다른 수준인데……?"
63035-14 = "어……? 나팔 소리? 이게 네가 말하던 그 나팔 소리야?!"
63035-15 = "그래! 이거야! 그, 그런데……. 하늘이 뭔가 엄청나게 어두워졌는데……?"
63035-17 = "조금 전까지는 낮이었는데?!"
63035-18 = "무슨 일이…… 일어나고 있는 거지……?"
63035-25 = "갑자기 밤이 된 거야, 지금……?"
63035-26 = "나, 나 이거 알아! 경전에서 읽은 적 있어……!"
63035-27 = "<해 삼분의 일과 달 삼분의 일과 별들의 삼분의 일이 어두워지니,>"
63035-28 = "<낮 삼분의 일은 비췸이 없고 밤도 그러하더라>......!"
63035-34 = "나팔 소리…… 나팔 소리다……."
63035-35 = "이걸로 여섯 번째……!"
63035-36 = "그런데 이상하지 않아? 왜 또 들리는 거지?"
63035-37 = "그, 그러게? 이러면 일곱 번의 나팔소리가 아니라, 무슨 열네 번의 나팔소리가 되겠는데……?"
63035-41 = "가, 갑자기 밤이 된 것처럼 어두워졌는데요오……? 무슨 일이 일어나는 거죠……?"
63035-42 = "스바루! 그만둬라! 무슨 생각이냐! 네게 무슨 일이 일어난 거지?!"
63035-46 = "……당연한 이야기지만, 안 들리는 것 같은데. 리더."
63035-47 = "……."
63035-48 = "서, 선배……!"
63035-49 = "스바루, 선배!!!"
63035-54 = "……."
63035-55 = "………어째, 서……?"
63035-56 = "어디에 있다가…… 여기에……?"
63035-58 = "어디에 있다가, 라니. 이 아이는 쭉, 여기에 있었어."
63035-59 = "이 자리에, 우리와 함께."
63035-60 = "왜 너는 보지 못 했냐고? 그건……."
63035-61 = "당신이 이 아이를 보려 하지 않았기 때문이야."
63035-62 = "그렇지, 스바루?"
63035-63 = "아니, 지금은 '현상'이 되어 버린, 나팔 부는 천사라고 해야 할까?"
63035-64 = "아츠코? 뭔가, 알고 있는 건가?"
63035-65 = "지금까지는 추측 정도였는데. 이제 거의 확실해진 것 같아."
63035-66 = "걱정하지 마, 모두. 차근차근 이야기해 줄게."
63035-67 = "그리고 상황이 이렇게 되었으니까 말해 두는 건데."
63035-68 = "당신만 '아리우스'인 것은 아니야. 스바루."
63035-70 = "다음화;로열 블러드"
