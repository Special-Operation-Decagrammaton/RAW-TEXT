[translation]
1004705-1 = "실은, 반짝임이 있던 곳은"
1004705-2 = "(치세가 갑작스럽게 보내온 모모톡 내용에 당황하기도 잠시,)"
1004705-3 = "(혹시 무슨 일이 있는 건가 싶어, 치세가 묵고 있는 숙소를 방문했다.)"
1004705-10 = "응……? 선생님……?"
1004705-11 = "[s] \"아, 치세. 아까 보내준 모모톡 내용 말인데…….\""
1004705-12 = "앗, 안 돼."
1004705-13 = "가까이 오면 안-돼. 선생님~"
1004705-14 = "[s] \"으, 응……? 왜 그래? 치세.\""
1004705-15 = "나한테 가까이 오면-"
1004705-16 = "선생님도 저주를 받아서 불행해져 버려……"
1004705-17 = "[s] \"……저주? 불행?\""
1004705-21 = "[ns] \"………….\""
1004705-23 = "[ns] 치세에게 다가간다."
1004705-31 = "[ns] 치세에게 좀 더 다가간다."
1004705-37 = "아, 안 돼-"
1004705-38 = "[s] 치세에게 다가가 부드럽게 팔을 붙잡는다."
1004705-44 = "아…… 선생님……?"
1004705-45 = "[s1] \"말해줘. 치세. 무슨 일이 있었던 거야?\"\n[s2] \"만약 곤란한 일이 있다면 돕고 싶어. 그게 내가 해야 할 일이니까.\""
1004705-48 = "하지만……."
1004705-49 = "[s] \"……말해줄 때까지, 계속 이 자리에서 기다릴 거니까.\""
1004705-53 = "응, 알았어."
1004705-54 = "선생님- 그게 있지-"
1004705-56 = "(그리하여 치세로부터 대체 어떻게 된 건지, 사건의 전말을 들을 수 있었다.)"
1004705-58 = "오늘 아침, 반짝임을 찾으려고~"
1004705-59 = "바다를 여기저기 돌아다녔는데-"
1004705-60 = "[s] \"그러던 도중에, 바닷가에서 편지가 든 병을 발견했다고?\""
1004705-61 = "응. 이거-"
1004705-66 = "(치세가 주저하면서 보여준 건 유리병과 원래 그 안에 들어 있었다던 한 통의 편지였다.)"
1004705-67 = "(치세에게 받아든 편지의 내용물을 확인해본 결과, 편지에 적힌 내용은 다음과 같았다.)"
1004705-68 = "[ns] \"<이 편지는 트리니티에서 시작되었으며……>\""
1004705-69 = "(<편지를 받은 사람은 즉시 같은 내용의 편지를 3일 안에 다른 7명의 사람에게 똑같이 보내야만 합니다.>)"
1004705-70 = "(<만약 3일 안에 해당 지시를 따르지 않으면, 저주를 받아 끔찍하게 불행해지고야 말 것입니다.>)"
1004705-71 = "(<그러니 부디 잘 생각하시길 바랍니다.>)"
1004705-72 = "(<당신의 행운을 빕니다. 굿 럭.>)"
1004705-74 = "(그 내용인즉슨 이 편지의 정체는…….)"
1004705-75 = "[s] \"……요즘 세상에, 행운의 편지?!\""
1004705-76 = "선생님- 어떡하지-?"
1004705-77 = "이대로 있다간 3일 뒤에 저주가- 그래서 불행이-"
1004705-78 = "[s] \"아니 잠깐, 치세, 이 편지는 가짜, 그러니까 거짓말이야.\""
1004705-79 = "응~? 가짜……? 거짓말……?"
1004705-83 = "(고개를 갸웃거리는 치세에게 이 편지가 <행운의 편지>라고 부르는 물건이며)"
1004705-84 = "(악의를 가진 누군가가 친 일종의 장난이라고, 그러니 믿을 필요가 없다고 설명하자.)"
1004705-85 = "이게 가짜라면- 왜 이런 걸 만드는 거야~?"
1004705-86 = "(너무나도 당연한 의문이 돌아왔다.)"
1004705-87 = "[s] \"……응?\""
1004705-88 = "남에게 불행이 찾아온다고 말이 거짓말이라면-"
1004705-89 = "왜 일부러 그런 말을, 아무 의미도 없는 장난을 치는 거야?"
1004705-90 = "응-? 어째서야-? 선생님~?"
1004705-91 = "[s3] \"그게…… 아무 의미 없이 이런 일을 한다고 할까.\"\n[s4] \"세상엔 순전히 장난을 치려고 이런 걸 만드는 사람도 있다고 할까…….\""
1004705-94 = "……이상해-"
1004705-95 = "하지만 만약, 정말로 장난이 아니라-"
1004705-96 = "진짜로 저주가 오면 어떡해?"
1004705-97 = "그러면…… 나랑 같이 있는 선생님도-"
1004705-98 = "저주 때문에 불행해지면-"
1004705-99 = "……그건 싫은데-"
1004705-100 = "안 돼. 선생님~"
1004705-101 = "불행 때문에 내가 없어지더라도."
1004705-102 = "선생님만이라도 나 대신 전차가 되어줘-"
1004705-103 = "[s] \"아니아니, 그건 엄청 난이도 높은 부탁인데?!\""
1004705-105 = "(그 뒤로 훌쩍이기 시작한 치세를 보며 어떻게 하면 좋을지)"
1004705-106 = "(고민하던 것도 잠시.)"
1004705-108 = "[ns] \"좋아, 그럼 이렇게 하자. 치세.\""
1004705-109 = "………응?"
1004705-110 = "[s] \"불행이 찾아온다는 그때까지, 앞으로 3일간 치세와 함께 있어 줄게.\""
1004705-111 = "하지만, 그러면 선생님도-"
1004705-112 = "[s5] \"치세가 위험에 처했다면, 당연히 가만두고 볼 생각 없어.\"\n[s6] \"그러니 저주가 가짜라는 걸 증명하기 위해, 그때까지 함께 있는 거야. 어때?\""
1004705-115 = "증명할 때까지- 선생님과 같이-"
1004705-119 = "……으응."
1004705-120 = "……알았어."
1004705-121 = "(싱긋)"
1004705-123 = "(그렇게 되어, 본의 아니게 이 여름 바다에서 치세와 둘이서 3일의 시간을 함께 보내게 되었다.)"
1004705-141 = "(하루는 함께 온종일 여름 바다의 모래사장을 산책하며 돌아다니거나.)"
1004705-159 = "(또 하루는 바다의 집에서 함께 아이스크림이나 빙수를 나눠 먹으며 시간을 보내거나-)"
1004705-181 = "(또 하루는 바닷가를 걷던 중, 갑자기 시비를 걸어오는 불량배들과 유탄 쏘기 대결을 펼친다거나-)"
1004705-188 = "(함께 숙소로 돌아와…… 그날 하루 있었던 일에 대해 자그마하게 담소를 나누거나.)"
1004705-190 = "(그런 식으로 치세와 함께 시간을 보낸 끝에)"
1004705-191 = "(마침내 편지를 주운 날로부터 3일째가 되는 날이 찾아왔다.)"
1004705-196 = "[ns] \"현재 시각 오후 11시 53분……. 드디어 오늘이네.\""
1004705-197 = "응…… 오늘이 3일째 되는 날-"
1004705-198 = "……선생님. 나-"
1004705-199 = "[s] \"괜찮아. 치세. 내가 있으니까.\""
1004705-203 = "………응."
1004705-204 = "(시계는 천천히 예정된 시간을 향해 달려가기 시작했다.)"
1004705-213 = "(그리고.)"
1004705-218 = "선생님, 시간이-"
1004705-226 = "(예상했던 대로 자정이 지나고도 약 5분이 흐를 때까지, 주변엔 아무런 일도 일어나지 않았다.)"
1004705-230 = "아무런 일도, 안 일어나……?"
1004705-231 = "[s] \"응, 치세. 행운의 편지라는 건 결국 이런 법이거든.\""
1004705-232 = "응…… 그런 거구나……."
1004705-233 = "[s] \"그럼 시간도 늦었으니, 난 이만 돌아가 볼게.\""
1004705-234 = "아, 선생님……. 잠깐-"
1004705-239 = "[ns] \"응? 치세? 왜 그래?\""
1004705-240 = "그게- 그러니까-"
1004705-246 = "뭐, 뭐야?!"
1004705-247 = "가, 갑자기 정전?!"
1004705-253 = "[ns] \"설마, 이건 편지의……?!\""
1004705-255 = "[ns] \"치세! 위험하니까. 내 손을 꽉 잡아!\""
1004705-256 = "어라……?"
1004705-265 = "(………………선생님의 얼굴, 가까워.)"
1004705-266 = "(아…… 이거…….)"
1004705-270 = "……반짝임."
1004705-281 = "휴우. 깜짝 놀랐네."
1004705-282 = "그러게. 대체 뭐였던 거지?"
1004705-284 = "[ns] \"아무래도 잠깐 트러블이 있었나 봐. 이제는 괜찮은 거 같은데…….\""
1004705-285 = "선생님- 무거-워."
1004705-286 = "[s] \"앗, 미, 미안! 치세!\""
1004705-290 = "[ns7] \"경황이 없는 중에 갑작스럽게 행동해서 미안해. 치세.\"\n[ns8] \"혹시 어디 다치지는 않았어? 괜찮아?\""
1004705-293 = "응, 괜찮아."
1004705-294 = "…………."
1004705-295 = "그보다 선생님- 반짝임, 있었어-"
1004705-296 = "[s] \"반짝임? 아, 방금 전등이 깜빡거리기는 했지.\""
1004705-297 = "으응- 그게 아냐. 선생님."
1004705-298 = "이제까지 내가 찾고 있던 반짝임이…… 눈앞에 확- 하고 다가와서."
1004705-299 = "아……."
1004705-300 = "그런 거구나."
1004705-301 = "반짝임은, 다른 곳, 멀리 있는 게 아니라……"
1004705-302 = "[s] \"응?\""
1004705-303 = "행운의 편지…… 선생님 말대로, 거짓말이었지만-"
1004705-304 = "또 이름처럼- 거짓말이 아니었던 거네~♪"
1004705-305 = "[s] \"……으응? 무슨 뜻이야? 치세\""
1004705-306 = "후훗~"
1004705-307 = "선생님한텐 비밀-이야-"
1004705-309 = "(그렇게 전부를 이해할 수는 없었지만.)"
1004705-313 = "(어쩐지 기분이 좋아진 것 같은 치세와 함께 아침이 찾아올 때까지 이야기를 나누며 밤을 지새웠다.)"
