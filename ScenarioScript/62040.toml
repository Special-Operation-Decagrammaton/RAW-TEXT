[translation]
62040-1 = "제4화;화가 있으리로다."
62040-5 = "[ns] \"미네!!!\""
62040-6 = "다, 단장님!"
62040-7 = "단장님! 으애앵~!"
62040-8 = "하나에 쨩? 우선 기도 확보부터요! 다행히 호흡에는 큰 이상이 없네요!"
62040-9 = "알겠어요, 선배! 그리고 목과 허리의 옷을 느슨하게 하고……. 들것 가져올게요!"
62040-10 = "네! 부탁해요!"
62040-15 = "지금…… 들었어?"
62040-16 = "들었어! 분명 구호기사단이라고……!"
62040-21 = "그러면 우리를 도운 게, 트리니티라는 소리야?"
62040-22 = "지금 쓰러진 저 단장이라는 사람…… 나 본 적 있어! 그때…… '마담'이 아리우스에서 모습을 감췄던 날……!"
62040-23 = "어땠는데? 나 그때 너랑 같이 없었는데……."
62040-24 = "그게……."
62040-39 = "지금부터 제가 만들어내는 부상자들을, 빠르게 구호해서 치료하도록 하세요."
62040-42 = "히, 히익……! 히이이익……!!!"
62040-43 = "왜, 왜 그래. 갑자기?!"
62040-48 = "[log]화[/log]"
62040-52 = "[log]화[/log]"
62040-56 = "[log]화[/log]"
62040-59 = "[log]화가 있으리로다.[/log]"
62040-63 = "[log]이 외에도 세 천사의 불 나팔소리를 인함이로다.[/log]"
62040-65 = "!!!"
62040-66 = "!!!"
62040-68 = "지금…… 뭐였지?"
62040-69 = "하늘에서, 엄청나게 큰 목소리가……!"
62040-71 = "화가 있으리로다……?"
62040-72 = "이 외에도 세 천사의 불 나팔소리를 인함이로다……???"
62040-78 = "!!!!!"
62040-83 = "설마…… 그거야?"
62040-84 = "그럴 리가! 그건 그냥 <계시록>의……!"
62040-86 = "하지만 <계시록>이잖아? 우리 아리우스가, 가장……."
62040-87 = "그게 정말 그거라면, 그리고 그것이 지금 여기에서 이루어지고 있다면……!"
62040-92 = "틀림, 없어."
62040-93 = "<계시록의 천사>야. 그리고 그게 맞다면……."
62040-94 = "세상의 끝이, 다가오기 시작한 거야……!"
62040-96 = "[ns1] \"지금 도대체…… 뭐지?\"\n[ns2] \"너희들, 뭔가 아는 거 있어……?\""
62040-99 = "……."
62040-100 = "……."
62040-101 = "이건, 어쩌면……!"
62040-102 = "그럴 리 없어. 하지만……."
62040-103 = "[s] \"아츠코?\""
62040-104 = "……."
62040-105 = "미안해, 선생님. 우리로서도 지금은 짐작밖에 할 수 없어."
62040-106 = "그보다 일단은, 구호기사단 분들을…… 안전한 곳으로 옮겨야 하지 않을까?"
62040-107 = "[s] \"……! 세리나! 미네는 괜찮아?\""
62040-111 = "네, 선생님! 생명에 지장은 없어요! 하지만……."
62040-112 = "서, 선배? 선생님……?"
62040-119 = "[ns] \"스쿼드!\""
62040-121 = "……! 알겠다, 선생. 미사키! 길을 열겠다!"
62040-122 = "칫."
62040-124 = "죄, 죄송하지만…… 비켜, 주시겠어요……?"
62040-130 = "선배……?"
62040-135 = "……."
62040-136 = "모두, 길을 비켜 드리세요."
62040-137 = "적어도, 지금은요."
62040-143 = "알겠습니다. 선배."
62040-150 = "[ns] \"모두, 고마워.\""
62040-151 = "천만에. 오히려 선생을 도울 수 있어서 다행이었다."
62040-152 = "응. 구호기사단 분들도."
62040-154 = "가, 감사합니다……."
62040-155 = "정말로 큰일 나는 줄 알았어요……."
62040-159 = "[ns] \"그리고 세나도.\""
62040-162 = "아닙니다. 응급 상황이 발생했다면, 일단 현장으로 출동하는 것이 원칙이니까요."
62040-163 = "구호기사단 분들과는 예전에도 협력한 바 있었고, 문제는 없습니다."
62040-167 = "다만, 이분……."
62040-168 = "세나 씨……."
62040-170 = "……."
62040-171 = "[s] \"왜 그래, 세나……?\""
62040-172 = "음. 어떻게 말씀을 드려야 할까요."
62040-173 = "일단, 바이탈에 문제는 없습니다. 그것만은 확실합니다."
62040-174 = "신고 시점으로부터 가늠하자면, 의식이 돌아오지 않는 시간이 다소 깁니다만, 아직은 상정 범위 안입니다. 그러나……."
62040-175 = "……."
62040-176 = "선생님. 이것은 저의 직감 같은 것입니다."
62040-177 = "나름대로 현장 경험이 있는 자로서 가지게 된…… 일종의, 빅데이터의 총합이라고 생각해 주시면 될 것 같습니다."
62040-178 = "느낌이, 그다지 좋지 않습니다."
62040-180 = "……!"
62040-181 = "다, 단장님! 으, 으애앵……."
62040-182 = "구체적으로 말씀이십니까? 죄송합니다. 저 역시 그 부분을 확실하게 말씀드리기는 어려울 것 같습니다."
62040-183 = "하지만 역시……."
62040-184 = "미네 씨가 눈을 뜨는 과정이, 그렇게 쉽지만은 않을 거라는 예감이, 강하게 들고 있습니다."
62040-185 = "……일단은, 계속해서 바이탈을 유지시키며 대증 대응을 할게요. 그러니……."
62040-186 = "네. 알겠습니다. 구호기사단 본관 앞까지 운송해 드리죠."
62040-187 = "하, 하지만 그건 아무래도 조금 위험하지 않을까요……?"
62040-188 = "이전에도 있었던 일이니, 어떻게든 될 겁니다. 그러면–"
62040-193 = "선생…… 님?"
62040-194 = "!"
62040-196 = "!!!"
62040-197 = "단장님! 정신이 드세요?!?!"
62040-203 = "……죄송합니다, 하나에. 조금 머리가 울리는군요. 잠시만……."
62040-204 = "네, 네에! 앗차……!"
62040-205 = "이, 이 정도면…… 될까요……?"
62040-207 = "네. 배려 감사합니다. 그리고 세나 씨?"
62040-208 = "말씀하시지요."
62040-209 = "저 역시, 저의 직감입니다만, 제가 오래는 깨어 있지 못할 것 같군요. 폐를 끼치게 될 것 같습니다. 감사합니다."
62040-210 = "……그렇습니까."
62040-211 = "선생님. 빠르게 부탁드리고 싶은 것이 있습니다."
62040-212 = "[s] \"……뭐든 이야기해 줘.\""
62040-213 = "후후. 네."
62040-214 = "우선, 감사합니다. 선생님의 말씀이 아니셨다면, 저는 아마 '먹혀버린' 채, 돌아오지 못했을지도 모릅니다."
62040-215 = "그러니 선생님. 이 아이들…… 아리우스 학생들의 '일상'을, 지켜 주시겠습니까?"
62040-216 = "……!"
62040-217 = "갑작스러운 부탁인 줄은 알고 있습니다. 죄송합니다. 그래도 그렇게 해 주셨으면 합니다."
62040-218 = "……저조차도, 어느 사이엔가 잊어버리고 말았으니까요."
62040-219 = "아침에 일어나고, 옷을 갈아입고, 수업을 듣고 동아리 활동을 하고, 다시 자신의 방으로 돌아오는……."
62040-220 = "그런 아무렇지도 않은 것들이, 누군가에게는 결코 그렇지 않으며."
62040-221 = "어떤 식으로든 '반복될 수 있는 생활을 유지한다'는 것이, 사실은 모든 기적의 집합체였다는 사실을요."
62040-224 = "네? 아리우스로 가 달라고 하셨습니까?"
62040-229 = "그렇습니다. 그곳에서……."
62040-230 = "……."
62040-231 = "아리우스 학생들에게 시험공부를 가르치고 계실, 선생님을 도와주셨으면 합니다."
62040-232 = "아리우스 학생들이, 시험이요? 무슨 뜻이십니까?"
62040-233 = "말 그대로의 의미입니다. 저는 안전상의 이유로, 선생님께서 직접 아리우스로 가시는 것을 말리고 싶었습니다만……."
62040-234 = "선생님께서는, 그런 분이 아니시지요. 그곳이 어디든, 설사 우리들의 경전에 나오는 지옥과 같은 곳이라고 해도."
62040-235 = "거기에 학생이 있다면, 아무 고민 없이 그곳으로 향하실 분이니까요."
62040-236 = "그것은 그렇습니다. 그렇다면 나기사 님께서 구호기사단에 맡기고 싶은 것은, 선생님의 안전입니까?"
62040-237 = "아뇨. 그런 것이 아닙니다. 물론 그것도 중요한 부분이겠습니다만, 무엇보다."
62040-242 = "아리우스에 필요한, '구호'를 부탁드리고 싶습니다."
62040-243 = "……."
62040-244 = "그것이 무엇을 의미하는지, 충분히 아실 분이라고 생각하고 있습니다."
62040-246 = "네. 미네 단장님은 저의 이런 화법을 그다지 좋아하지 않으시겠지요."
62040-247 = "나아가, 저에 대해서 그다지 좋은 감정을 가지고 있지 않으실 수도 있을 것입니다."
62040-248 = "그 모든 것을 감내하고 인정한 다음의 자리에서."
62040-249 = "티파티가 구호기사단에게 내리는 지시가 아닌."
62040-250 = "키리후지 나기사가, 아오모리 미네 씨에게 드리는 부탁입니다."
62040-251 = "아리우스 역시, 분명, 구호가 필요한 장소일 테니까요."
62040-252 = "……시각에 따라서는, 트리니티가 감히 아리우스에게, 그런 것을 베풀 자격이 되지 않는다고 볼 여지도 있을 것입니다."
62040-253 = "그렇습니다. 그리고 아오모리 미네 씨는, 그럼에도 불구하고 구호의 뜻을 펼치기 위해 나아갈 분이라는 것도요."
62040-254 = "……."
62040-255 = "저는 나기사 님에 대해서는, 그렇게 싫은 감정을 갖고 있지 않습니다."
62040-260 = "애초에 어떤 의미로, 구호기사단은, 티파티의 책임과 자리가 부담스러웠기 때문에."
62040-261 = "그 자리에서 스스로 내려오기를 선택했다고 볼 수도 있으니까요."
62040-262 = "네. 그렇기에 한편으로는, 감사하는 마음마저 가지고 있습니다."
62040-263 = "그렇지만…… 나기사 님의 그 화법은, 여전히 약간이나마 부담으로밖에 다가오지 않는군요."
62040-265 = "……죄송합니다."
62040-266 = "이해했습니다."
62040-270 = "그렇다면 저는 이 순간부터, 그저 '구호가 필요하다는 직감'을 따라, 아리우스로 향하겠습니다."
62040-273 = "선생님께서 만들어낸 것은, 이곳의 학생들이 간신히 맛볼 수 있었던 일상이었을 겁니다."
62040-274 = "수업이라는 것을 경험하고, 공부라는 것을 하고, 어떻게 보면 인생에 그다지 중요해 보이지 않는 것을 진지하게 고민해 보고……."
62040-275 = "그렇게, 매일같이 이어지는 일과, 를……."
62040-276 = "……."
62040-277 = "부탁, 드립니다."
62040-278 = "그것을, 지켜, 주십시오."
62040-279 = "[s] \"……그래. 그렇게 할게.\""
62040-280 = "감사, 합니다."
62040-287 = "단장님. 단장니임……."
62040-288 = "……다시, 정신을 잃으셨어요."
62040-289 = "……."
62040-290 = "일시적으로나마 의식을 되찾았다는 것은, 좋은 신호입니다."
62040-291 = "아니면 그 정도로 미네 씨의 정신력이 강인하다는 증거이거나요."
62040-295 = "그러면, 선생님. 이만 서두르도록 하겠습니다."
62040-296 = "부디, 몸조심하십시오."
62040-304 = "가, 가 버렸네요……."
62040-305 = "……."
62040-306 = "……."
62040-307 = "미네 씨. 괜찮을까……."
62040-308 = "[s] \"……나는, 세나를 믿어.\""
62040-309 = "……그렇구나. 응."
62040-310 = "[s] \"그러니까, 아츠코. 이야기해 줄 수 있어?\""
62040-314 = "나와…… 아리우스가, 그 소리에 대해서 알고 있는 것 말이야?"
62040-315 = "어떻게 보면, 대단한 것은 아니야. 적어도 이름만이라면 말이지."
62040-316 = "그건 어쩌면, <계시록의 천사>라고 불리는 것일 거야. 이것도 아직은 추측일 뿐이지만."
62040-317 = "그런데, 만에 하나 정말로 그게 <계시록의 천사>라면……. 의미하는 것은 하나밖에 없어."
62040-318 = "……그래."
62040-322 = "'세상의 끝'의, 시작이다."
62040-324 = "다음화;아리우스 바실리카"
