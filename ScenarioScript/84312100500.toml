[translation]
84312100500-5 = "실례합니다, 게임개발부 여러분."
84312100500-6 = "마지막 날이고 해서, 인사를 좀 드리러……"
84312100500-10 = "……? 여러분?"
84312100500-16 = "대체 어디로 간 거야, 내 컨트롤러-!!"
84312100500-17 = "왜 잃어버린 본인이 화를 내는 거야, 애초에 언니 컨트롤러도 아니잖아."
84312100500-18 = "우리 컨트롤러-!!"
84312100500-20 = "두, 두 사람 모두 우선 진정하고……"
84312100500-22 = "(……컨트롤러?)"
84312100500-26 = "무슨 일 있으신가요?"
84312100500-33 = "……아앗!! 도적! 왕도적님!!"
84312100500-34 = "언제 들어오신 거죠!? 전혀 느끼지 못했습니다. 아무 소리도 들리지 않았습니다! 이번에도 굉장한 은신 능력입니다!!"
84312100500-36 = "……감사합니다."
84312100500-37 = "어라, 트리니티의 높으신 분…… 여긴 어쩐 일로 오셨어요?"
84312100500-38 = "아, 방금 저희 이야기는 신경 쓰지 말아 주세요. 그냥 언니가 컨트롤러 하나를 잃어버려서, 게임을 못하고 있던 것뿐이니까요."
84312100500-39 = "잃어버린 게 아닐 거야, 이건 도난이야! 도난이라고! 외부인이 훔쳐 간 게 분명해!!"
84312100500-40 = "사건이다!! 잠입 공작 사건이야!!"
84312100500-41 = "말이 되는 소리를 해, 언니……"
84312100500-42 = "……"
84312100500-43 = "우, 우선 주변을 다시 한번 찾아보죠. 의외로 가까운 곳에 있는 걸 눈치 못 채고 있을 확률도 있으니까요."
84312100500-45 = "보물찾기……! 아니, 도적이니까 탐색!!"
84312100500-46 = "탐색 퀘스트입니다!!"
84312100500-53 = "응?"
