[translation]
221070-1 = "第7話;落ち着かない待ち時間"
221070-4 = "オデュッセイア船内医務室"
221070-8 = "……腰椎捻挫ですね。"
221070-9 = "重症ではないので、数日安静にしていれば良くなるでしょう。"
221070-10 = "[s1] \"すぐ処置してくれてありがとう……。\"\n[s2] \"……サナエ、だったよね。\""
221070-13 = "はい。オデュッセイアで医師をしている[ruby=ふなもり]船守[/ruby]サナエです。"
221070-14 = "主な業務は船内の消毒および衛生検査、安全検査。そして――"
221070-15 = "トライデントの馬鹿どもの治療です。よろしくお願いします。"
221070-16 = "ちょ、ちょっと待ってください！#nそんな言い方したらトライデントが、安全規則も守れない、#n毎日怪我してばっかりみたいに聞こえるじゃないですか！"
221070-17 = "……違うんですか？"
221070-18 = "否定はできませんが……。"
221070-19 = "で、でも～トライデントの生徒はだいたい丈夫ですし～？#n医務室に担ぎ込まれることなんてそ～そ～ないと思うんですけど……。"
221070-20 = "まあ、自主的にはほとんど来ませんからね。"
221070-21 = "それに比べて先生は、その……。"
221070-22 = "だいぶ……ひ弱ですね。"
221070-23 = "銃弾すら耐えられないとは聞いていましたが、#nそれはそれとして、ここまで腰の筋肉が張り詰めている方を見るのは久しぶりです。"
221070-24 = "[s3] \"最近、書類仕事に追われてて……。\"\n[s4] \"姿勢が相当悪くなってたみたい。\""
221070-27 = "ストレッチは筋損傷の予防になるんですよ。"
221070-28 = "定期的なストレッチと……適度な休憩をおすすめします。"
221070-29 = "はぁ……。"
221070-30 = "[s] \"微塵も期待してないね……？\""
221070-31 = "この船で患者を見ていれば、誰だってすぐ諦めがつきますよ。"
221070-32 = "それでも、久々にトライデント以外の患者が来て気分転換にはなりました。"
221070-33 = "すみません、先生……私のせいでまた……。"
221070-34 = "[s] \"気にしないで。私の不注意でもあったし。\""
221070-35 = "そう言っていただけるなら幸いですが……。"
221070-36 = "その、幸いついでに……あ～、えっと、厚かましいお願いなのは重々承知なんですが……。"
221070-37 = "この件……副部長にはど～か内密にしていただけませんか？"
221070-38 = "残念ですが、トオル副部長にはすでに報告が上がっていると思いますよ。"
221070-39 = "先に始末書を書いておいた方が、時間の節約になるのでは？"
221070-40 = "ぐあぁ……。"
221070-46 = "サミー、あんたのせいよ！#nあんたが転ぶから……！"
221070-47 = "にゃっ、にゃおん、にゃおん、んにゃぁ……。"
221070-48 = "スミカ。サミーをあまり揺さぶらないでください。"
221070-49 = "ただでさえ血圧が高くて眩暈がひどいと思いますので。#n揺らしたら悪化するかもしれません。"
221070-50 = "えっ。"
221070-54 = "にゃん。"
221070-56 = "[ns] \"サミーの状態、思ったより悪いの？\""
221070-57 = "……年齢を考えれば、よく動けている方ですよ。"
221070-58 = "それでも、潮風の強い船上の環境は猫にとって有害ですから。"
221070-59 = "いつ悪化してもおかしくない状況です。"
221070-60 = "[s] \"サナエは、サミーを陸に下ろすべきだと思う？\""
221070-61 = "……さあ。#n大事なのはサミーの意思じゃないですか？"
221070-62 = "にゃおん。"
221070-63 = "当の本人はどこ吹く風ですが。"
221070-64 = "結局、サミーを下ろすかどうかと論じること自体が、#n生徒の[ruby=エゴ]自己満足[/ruby]に過ぎないと思いますよ。"
221070-65 = "でも……サミーはずっと船の上で生きてきたんです！"
221070-66 = "陸に下ろして元気にならなかったら……#n慣れない場所で最期を迎えることになったら……！"
221070-67 = "それは感情論に過ぎません。"
221070-68 = "猫の気持ちを勝手に推し量り、学園内で派閥分かれだなんて。#nこれほど非効率なこともないでしょう。"
221070-69 = "はぁ……。"
221070-70 = "誰かが代わりに決めてくれればいいのに……。"
221070-71 = "も、もちろん……私も部長や副部長が命じるなら従いますけど……。"
221070-72 = "話は聞かせていただきました。"
221070-75 = "う、う、うわっ！？れ、れ、連邦生徒会長！？"
221070-76 = "い、いつの間に……。"
221070-77 = "すみません。重いお話のようでしたので、混ざるタイミングを伺っていました。"
221070-82 = "怪我をされたと聞きましたが――"
221070-83 = "腰の具合はいかがですか？"
221070-84 = "[s] \"もう連邦生徒会に報告が届いてるの！？\""
221070-85 = "ふふ、まさか。"
221070-90 = "たまたまオデュッセイアに公務がありまして。#n外で生徒が話しているのを小耳に挟んだだけです。"
221070-91 = "まだ動きづらいとは思いますが……#nちょうど良い機会ですし、少しご同行をお願いしてもよろしいですか？"
221070-92 = "[s5] \"それは構わないけど……。\"\n[s6] \"どこに行くの？\""
221070-95 = "アイランドの様子を見に行きませんか？"
221070-97 = "そろそろ、困っている頃合いでしょうから。"
221070-99 = "次回;第三の選択肢"
