[translation]
221070-1 = "제7화;불편한 기다림"
221070-4 = "오디세이아 선내 의무실"
221070-8 = "……급성 요추 염좌군요."
221070-9 = "심각한 상태는 아니니, 며칠 간 냉찜질을 하시면 상태가 호전될 겁니다."
221070-10 = "[s1] \"바로 조치해 줘서 고마워……\"\n[s2] \"……사나에라고 했던가?\""
221070-13 = "네. 오디세이아에서 선의 역할을 하고 있는 후나모리 사나에입니다."
221070-14 = "주 업무는 선내의 소독 및 위생 검사, 안전 검사. 그리고……"
221070-15 = "……트라이던트의 바보들을 치료하는 것입니다. 잘 부탁드립니다."
221070-16 = "잠깐, 잠깐만요! 그렇게 말씀하시면 트라이던트가 허구한 날 안전수칙도 못 지켜서 다치기 일수인 바보들의 모임처럼 들리잖아요!"
221070-17 = "……아닌가요?"
221070-18 = "완전히 아니라고는 할 수 없지만……"
221070-19 = "그래도 트라이던트의 학생들은 대체로 튼튼하니까, 의무실에 실려오는 일은 거의 없다고 생각하는데요……"
221070-20 = "뭐, 단순한 폭발 사고로는 내원조차 하지 않으니까요."
221070-21 = "그에 비해서 선생님께서는 꽤……"
221070-22 = "……유약하시군요."
221070-23 = "총알조차 이겨내지 못하신다고 듣긴 했습니다만. 이렇게 허리 근육이 잔뜩 긴장해 있는 사람은 오랜만에 보는 것 같습니다."
221070-24 = "[s3] \"최근에 서류 작업에 몰두하느라……\"\n[s4] \"자세가 꽤 나빠진 모양이네.\""
221070-27 = "활동 반경이 제한 된 선내에서도 스트레칭은 근육 손상을 방지하는 데 큰 도움이 됩니다."
221070-28 = "규칙적인 스트레칭과…… 충분한 휴식을 추천 드립니다."
221070-29 = "하아……"
221070-30 = "[s] \"기대조차 안 하는 표정인데……\""
221070-31 = "이 배에서 환자를 돌보다 보면 누구나 금방 체념하게 되지 않을까요."
221070-32 = "그래도 간만에 트라이던트 이외의 환자를 보아서 기분 전환은 되었습니다."
221070-33 = "죄송합니다, 선생님. 저 때문에 또……"
221070-34 = "[s] \"괜찮아. 내 실수도 있는 걸.\""
221070-35 = "그렇게 생각하신다면 다행입니다만."
221070-36 = "……그게, 또 폐를 끼치고도 드리기엔 염치없는 말이긴 하지만……"
221070-37 = "부부장님께는 이 일, 비밀로 해주지 않으시겠습니까?"
221070-38 = "유감이지만 토오루 부부장에게는 이미 상황 보고가 올라갔을 겁니다."
221070-39 = "미리 시말서를 써두는 편이 시간 절약에 도움이 되지 않을까요?"
221070-40 = "끄앙……"
221070-46 = "새미, 너 때문이잖아! 네가 또 거기서 넘어지는 바람에―"
221070-47 = "냐아아아―"
221070-48 = "새미를 너무 흔들지 마세요, 스미카."
221070-49 = "안 그래도 혈압이 높아서 어지럼증이 심할 텐데, 흔들면 상태가 악화될 수도 있습니다."
221070-50 = "앗."
221070-54 = "냥."
221070-56 = "[ns] \"새미의 상태가 생각보다 나쁜 거야?\""
221070-57 = "……오히려 나이와 환경에 비하면 건강하다고 말하는 편이 옳겠죠."
221070-58 = "관절에 문제가 생길 정도로 나이가 든 데다가, 습기와 소금이 곳곳에 서려 있는 선상의 환경은 고양이에게 해로우니까요."
221070-59 = "솔직히 말씀드리자면 지금 바로 상태가 악화되더라도 이상하지 않은 상황입니다."
221070-60 = "[s] \"사나에는 새미를 육지에 내려야 한다고 생각해?\""
221070-61 = "……글쎄요. 굳이 따지자면 새미의 의견이 중요하겠죠."
221070-62 = "냐옹."
221070-63 = "본인은 큰 의견이 없는 것 같지만."
221070-64 = "결국 고양이를 내릴지 말지도 논하는 것도 학생들의 자기 만족에 불과하다고 생각해요."
221070-65 = "하지만 새미는 평생을 배 위에서 살아왔잖아요!"
221070-66 = "만약 육지에 내려 주었는데 건강이 회복되지 않는다면…… 낯설고 익숙지 않은 환경에서 마지막을 보내야 한다면……"
221070-67 = "그건 감성적인 결론일 뿐이에요."
221070-68 = "무슨 생각을 하는지도 모르는 고양이의 기분을 추측하느라, 모든 학원이 반으로 갈라져 갑론을박을 벌이다니. 이런 비효율적인 일도 없죠."
221070-69 = "하아……"
221070-70 = "누군가 대신 결정해 주면 좋을 텐데……"
221070-71 = "무, 물론…… 저도 부장님이나 부부장님이 명하면 따르겠지만……"
221070-72 = "말씀은 들었습니다."
221070-75 = "우, 우, 우왓?! 초, 초, 총학생회장님?!!"
221070-76 = "어, 언제 여기까지 방문을……"
221070-77 = "죄송합니다. 무거운 이야기를 하시는 것 같아서 잠시 기다리고 있었습니다만……"
221070-82 = "[USERNAME] 선생님, 다치셨다고 들어서 병문안을 왔습니다."
221070-83 = "허리의 상태는 괜찮으신지요?"
221070-84 = "[s] \"그새 총학생회까지 내 소문이 닿은 거야?!\""
221070-85 = "후후, 농담입니다."
221070-90 = "사실 공무 때문에 오디세이아 학원에 들렸던 참에 선생님의 이야기를 들어서 찾아 온 것 뿐이랍니다."
221070-91 = "아직은 거동이 불편하시겠지만, 마침 잠깐 동행을 부탁드려도 괜찮을까요?"
221070-92 = "[s5] \"같이 가는데 문제는 없지만……\"\n[s6] \"어디에 가려고?\""
221070-95 = "지금부터 아일랜드의 상황을 보러 갈까 합니다."
221070-97 = "슬슬 곤란해질 때가 되었다 싶어서."
221070-99 = "다음화;불가해한 결정"
