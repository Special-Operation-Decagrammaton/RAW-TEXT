[translation]
1002406-1 = "마지막 포인트"
1002406-2 = "(건물 앞으로 나가니, 문 앞까지 도착해 있던 시로코의 모습이 보였다.)"
1002406-3 = "안녕, 선생님."
1002406-4 = "마침 나도 이제 막 도착한 참인데, 타이밍이 잘 맞았네."
1002406-5 = "[s1] \"응? 시로코?\"\n[s2] \"벌써 다 완주한 거야?\""
1002406-6 = "응. 그 뒤부터는 한 번에 들어오는 포장도로가 있었으니까."
1002406-7 = "응. 그 뒤부터는 한 번에 들어오는 포장도로가 있었으니까."
1002406-8 = "경사도 없는 길들이라 속력을 좀 내서 달렸어. 시원한 바람도 더 느낄 생각으로."
1002406-9 = "……아. 하지만 아직 완주는 아니야."
1002406-10 = "이곳은 마지막 포인트. 완주는 아비도스까지 돌아가는 거니까."
1002406-11 = "[s3] \"마지막 포인트?\"\n[s4] \"아비도스까지?\""
1002406-12 = "응. 아비도스까지. 그런 의미에서 선생님에게 인사를 하러 온 거야."
1002406-13 = "응. 아비도스까지. 그런 의미에서 선생님에게 인사를 하러 온 거야."
1002406-14 = "……응? 그냥 아비도스로 불렀어도 됐던 거 아니냐고?"
1002406-15 = "으음……. 그치만 지금까지 계속 불러냈으니까, 마지막은 내가 찾아가려고 했던 건데……."
1002406-16 = "아비도스에 도착한 뒤에도 다시 연락할까?"
1002406-17 = "응? 괜찮다고……? 그럼……."
1002406-18 = "[s5] \"지금부터 같이 가면 되지.\"\n[s6] \"가는 길에 일주 이야기를 좀 들어볼까.\""
1002406-19 = "……어어……."
1002406-20 = "……어어……."
1002406-21 = "으음……. 선생님. 알겠지만 여기서부터 아비도스까지는 꽤 멀어. 선생님이 힘들 텐데……."
1002406-22 = "뒷좌석이 있는 자전거였다면 태워줄 수 있었겠지만, 이건 1인용 사이클이고……."
1002406-23 = "……."
1002406-24 = "……아냐. 천천히 가면 될 것 같아. 속력은 내가 맞추면 되니까."
1002406-25 = "그럼 선생님. 출발할 테니 느긋하게 따라와."
1002406-26 = "힘들지 않게, 천천히 갈 테니."
1002406-27 = "[s] 시로코를 따라 걷는다."
1002406-30 = "(이후 걸음걸이 속도에 맞춰, 천천히 자전거를 끄는 시로코와 함께 아비도스까지 향했다.)"
1002406-31 = "(가는 동안 시로코는 라이딩 동안 보았던 것들에 대해 쭉 이야기했다.)"
1002406-32 = "(평소보다는 꽤 수다쟁이가 돼 있었다.)"
1002406-44 = "(……시로코가 말했던 대로, 샬레에서 아비도스까지 도보로 가는 데에는 시간이 꽤 걸렸다.)"
1002406-45 = "(정문 앞까지만 해도 오후였는데, 운동장으로 들어와 채비를 하는 사이 저녁 시간이 되었다.)"
1002406-48 = "……응. 이걸로 끝."
1002406-49 = "키보토스 롱 라이딩, 성공이야. 선생님."
1002406-50 = "자축 플래카드라든가……. 그런 것들도 생각했었지만……."
1002406-51 = "[s] \"완주 축하해. 시로코.\""
1002406-52 = "……응."
1002406-53 = "고마워. 선생님."
1002406-54 = "선생님이 도와줬으니까 성공할 수 있었다고 생각해."
1002406-55 = "해안 도로에서도…… 산에서도……. 다리에서도……."
1002406-56 = "강기슭에서도……. 도심에서도……."
1002406-57 = "항상 선생님이 있었으니까……."
1002406-61 = "항상 선생님이랑……?"
1002406-62 = "[s] \"……?\""
1002406-63 = "……으, 으으응. 아니야. 아무 것도……."
1002406-64 = "그냥……. 음……."
1002406-65 = "생각해 보니, 꽤 많은 지역에서, 선생님을 만났네."
1002406-66 = "……역시."
1002406-71 = "하길 잘했어. 라이딩."
1002406-72 = "……대성공이야."
