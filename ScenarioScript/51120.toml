[translation]
51120-1 = "제12화;키류 키쿄, 그리고 계승전 1"
51120-3 = "(다음 날.)"
51120-8 = "선-생니임-!!"
51120-9 = "후후! 좋은 아침이어요!"
51120-10 = "[s] \"안녕, 유카리. 좋은 아침이야. 오늘은 어때?\""
51120-11 = "어떻냐고 묻는 말씀은. 저 유카리의 건강일까요? 아니면 의욕?"
51120-12 = "후후후……"
51120-13 = "어느 쪽이든 지금의 전 모든 게 최고의 상태랍니다!"
51120-14 = "자, 이럴 게 아니라. 오늘은 무척이나 중요한 날이니까요!"
51120-15 = "이번에야말로 키쿄 선배를 만나, 백화요란 계승전의 보증인이 되어 달라 부탁하면………"
51120-17 = "네! 그것으로 모든 미션은 올 컴~프리투!"
51120-18 = "저 유카리의 백화요란 전설이 시작되는 것이어요!"
51120-19 = "[s] \"근데 키쿄는 어떤 사람이야?\""
51120-20 = "후후후. 과연 선생님이시로군요! 사전 정보 파악을 위한 빈틈없는 질문! 잘 물어봐주셨사와요."
51120-21 = "키쿄 선배에 대해 이야기하자면…… 단적으로 말해 무척이나 이지적이고 논리적이며, 또한 합리적이신 분이랍니다!"
51120-22 = "그게 어떤 느낌이냐면……."
51120-26 = "유카리. 예전에 말했었지."
51120-27 = "네, 넷……! 꿀꺽……."
51120-31 = "아이스크림은 하루에 한 개만 허락한다고. 까먹진 않았겠지?"
51120-32 = "무, 물론 기억하고 있사와요! 하지만 키쿄 선배……!"
51120-33 = "아니, 변명은 듣지 않겠어. 규칙도 규칙이지만, 그 이전에 잠들기 직전에 당류를 섭취하는 건 건강에 매우 좋지 않아."
51120-37 = "그리고 또, 너 먹고 나서 양치는 제대로 하고 있는 거겠지?"
51120-38 = "무, 무, 무, 무, 물론이어요!"
51120-39 = "오늘은 귀찮으니까, 가그~을만 해야지. 네, 그거라면 양치를 한 거나 다름이 없사와요! 같은 생각은 결코……!"
51120-44 = "좋았어, 오늘부터 매일 양치 검사를 하겠어."
51120-45 = "네엣?!"
51120-47 = "……라는 일이 있었을 정도였사와요!"
51120-48 = "그런 분이시니, 도움을 받을 수 있을 것이어요."
51120-51 = "[ns] \"다른 건 몰라도 유카리가 신뢰하고 있다는 건 알겠어.\""
51120-52 = "후후……"
51120-53 = "네! 그럼 이러고 있을 게 아니라."
51120-57 = "자, 얼른 가시죠!"
51120-64 = "키쿄 선배, 저 유카리가 찾아왔답니다!"
51120-69 = "지금 들어가겠사와요!"
51120-75 = "백화요란 동아리 부실"
51120-81 = "어, 어랏? 서, 선생님?!"
51120-83 = "…………?"
51120-84 = "[s] \"시즈코? 시즈코가 왜 여기에…….\""
51120-85 = "유카리?"
51120-86 = "네! 키쿄 선배! 오랜만에 뵈어요!"
51120-87 = "아…… 응. 그래. 오랜만이네. 너는 여전히 변함없이 활기차구나."
51120-88 = "그렇다고는 해도…… 하필 오늘, 그것도 지금 같은 타이밍이라니. 참으로 얄궂다고나 할까."
51120-89 = "아니면…… 운명, 이라는 게 있다는 걸까?"
51120-90 = "……?"
51120-91 = "유카리, 너와 이야기를 나누기 전에 잠깐 이쪽에 선객이 있어서 말이야."
51120-92 = "선객……."
51120-94 = "[ns] \"맞아, 시즈코는 어쩐 일로 찾아온 거야?\""
51120-95 = "아, 그건 말이죠."
51120-96 = "흠흠. 다른 게 아니라, 이번에 모두와 함께 힘을 합쳐 <백귀야행 등불 축제>를 재현하게 되었답니다!"
51120-97 = "아, 이미 알고 계셨다고요? 엄청 고생하고 있는 것 같아, 응원하고 있다?"
51120-98 = "에헤헷~~"
51120-99 = "선생님께서 그렇게 말씀해 주신 것만으로도 저 시즈코는요~~~"
51120-103 = "……가 아니라! 엄청 기쁜 말이지만, 기뻐하고만 있을 순 없죠!"
51120-104 = "어쨌거나! 바로 그 축제의 클라이맥스에서 <카데노코지의 무녀님>의 도움을 받고 싶다고 생각했거든요."
51120-105 = "[s] \"카데노코지의 무녀, 님……?\""
51120-107 = "……아."
51120-109 = "카데노코지── 대대로 백귀야행 연합학원에서 이루어지는 제의나 제사, 행사 등에서 중요한 역할을 담당해 온 유서 깊은 가문."
51120-110 = "그 특별함은 굳이 입에 담을 필요도 없겠지. 가지고 있는 상징성이 커다란 가문이야."
51120-111 = "바로 그 말씀대로예요!"
51120-112 = "실제로 20년 전에 폐지된 축제에서도 축제의 핵심 역할. 클라이맥스를 맡았던 것이 바로 카데노코지 가문이었거든요."
51120-113 = "남겨진 기록에 따르면, 20년 전에는 미처 제의가 성사되지 못한 채로 결국 축제가 흐지부지되었다는 모양이라."
51120-114 = "이번 축제에서는 바로 그걸 만회하고자, 마찬가지로 카데노코지의 무녀님에게 제의를 부탁드리고자 연락을 드렸는데."
51120-115 = "아직 그쪽으로부터는 아무런 답장도 듣지 못했거든요! 직접 자택으로 찾아뵈었더니 부재중이라는 말만 들었구!"
51120-116 = "[s] \"즉 시즈코가 백화요란을 찾아온 이유는…….\""
51120-117 = "네, 이대로 기다리기만 해서는 아무런 결과도 나오지 않겠다 싶어서……. 저, 시즈코!"
51120-118 = "바로 그 카데노코지의 무녀 역을 맡고 있는 아가씨가 계신다는 백화요란에 직접 찾아온 거랍니다!"
51120-120 = "들었지? 카데노코지 유카리 양."
51120-121 = "앗, 그렇다는 건 선생님 옆에 계신 분이 설마 카데노코지 양이신가요?!"
51120-122 = "마침 잘됐네요! 부디 저희 마츠리부와 함께……!"
51120-128 = "저…… 소녀는………"
51120-132 = "……꿀꺽."
51120-137 = "죄송하여요. 마츠리부의 부장님. 소녀 유카리는 도와드릴 수 없사와요."
51120-138 = "……네엣?!"
51120-139 = "어, 어째서인가요?"
51120-143 = "저는……"
51120-144 = "백화요란으로서 있고 싶으니까."
51120-145 = "이곳에 있고 싶어서, 소녀는 키쿄 선배를 찾아왔사와요."
51120-147 = "……무슨 소리야?"
51120-148 = "키쿄 선배. 저는 나구사 선배에게 <계승전>을 신청할 생각이어요."
51120-159 = "들었사와요. 키쿄 선배. 바로 엊그제 <해산령>을 내린 것에 대해서."
51120-160 = "…………"
51120-161 = "그건 분명 착오가 분명한 것이지요? 저도 모두가 잘못 알고 있는 것이라 생각했사와요!"
51120-165 = "유카리."
51120-166 = "그러므로 그런 잘못된 이야기가 더욱 퍼지기 전에 먼저!"
51120-168 = "이 소녀 유카리가…… <계승전>을 통해 모든 걸 바로잡도록 하겠사와요!"
51120-170 = "……그래서 음양부에 다녀왔고, 나를 찾아왔다. 이거구나."
51120-171 = "네! 그래서 말이지만 키쿄 선배. 부디 선배께서 <계승전>의 보증인이 되어 주시지 않겠나요?"
51120-172 = "그걸 통해 저 유카리가 백화요란을 원래대로 되돌리겠사와요!"
51120-178 = "오랫동안 부실에 모습을 비추지 않던 네가 갑작스레 찾아온 이유."
51120-179 = "<해산령>이 있고 난 뒤에, 유카리 너라면 반드시 움직이리라 생각하긴 했지만……."
51120-180 = "거기에서 <계승전>으로 이어지는 건…… 실로 너답다고 할까. 나조차도 예상을 못 했다고 할까."
51120-181 = "과연, 이유는…… 알았어."
51120-182 = "……!"
51120-183 = "그렇다면 선배……!"
51120-185 = "응. 그런 거라면 당연히──"
51120-186 = "일언지하에 거절하겠어."
51120-191 = "어, 어라? 그런 흐름인가요……?!"
51120-192 = "[s] \"………어?\""
51120-194 = "어, 어, 어째서인가요?! 키쿄 선배?!"
51120-195 = "선배는…… 여전히 백화요란을 지키고 계셨으니까. 당연히…… 당연히 저 유카리의 의견에……!"
51120-196 = "동의할 줄 알았다?"
51120-197 = "그렇다면 말할게."
51120-202 = "그딴 착각을 하고 있었다니. 실로 오만하구나. 카데노코지 양."
51120-203 = "……!!"
51120-205 = "나도 나구사 선배에 대한 소식은 접해서 알고 있었어. 그 사람이 지금 어느 장소에서 모습을 드러냈고, 어떠한 행동을 하여 음양부와 접촉을 했는지."
51120-206 = "하지만 결론은 하나야."
51120-207 = "그 인간은 앞으로도 백화요란으로 돌아오지 않아."
51120-208 = "아니…… 한 번은 돌아왔다고 해야 할까."
51120-209 = "아야메 부장으로부터 받은 부장의 <자격>을 직접 반납하기 위해 이곳 백화요란까지 찾아온 적이 있었으니까."
51120-223 = "[ns] (렌게가 말했던 반납은, 그런 이야기였구나.)"
51120-224 = "나구사 선배가…… <자격>을 반납…… 하려고……… 그, 그럴 리가……."
51120-225 = "선배는……"
51120-226 = "……렌게는, 아마 널 생각해서 여기까지 말해주지 않았던 거겠지."
51120-227 = "하지만 나는 그런 배려 따윈 하지 않아. 명백한 사실은 전해야만 하는 것이니까."
51120-228 = "나는 우리를 버린 사람을 더는 백화요란이라고 생각하지 않아."
51120-229 = "하지만……!"
51120-230 = "하지만, 그래도……!"
51120-231 = "그래, 어디 네 말대로 <계승전>을 한다고 치자."
51120-232 = "나구사 선배를 쓰러트려 정당하게 부장의 자리를 이어받겠다니. 놀라운 마음씨야. 멋진 계획이라고 칭찬해 줄게."
51120-233 = "하지만 거기엔 너도 알고, 나도 알고, 모두가 아는 맹점이 있어."
51120-234 = "……!"
51120-238 = "애당초 카데노코지 유카리 양."
51120-239 = "네가 나구사 선배를 이길 수 있을 리가 없잖아?"
51120-245 = "그녀는 강해."
51120-246 = "너보다도 훨씬."
51120-248 = "아-니어요. 아뇨. 아니요!"
51120-249 = "저 소녀 유카리는! 쓰러트릴 수 있사와요!"
51120-250 = "소녀는……!"
51120-251 = "백화요란의 엘리~트……이니까!"
51120-253 = "나조차도 이겨본 적 없는 네가? 감히?"
51120-254 = "그, 그런 건 직접 해보지 않으면……!"
51120-258 = "조, 좋아요! 그럼 여기서 저의 실력을 증명하겠사와요! 키쿄 선배!"
51120-259 = "선배에게…… 연습전을 신청할 테니……! 제가 자격이 된다는 걸 증명……!"
51120-261 = "아니."
51120-267 = "정녕 계속해서 그런 허무맹랑한 이야기를 계속할 셈이라면."
51120-271 = "나에게 「계승전」을 신청해."
51120-276 = "……………네?"
51120-277 = "설마 잊었다고 말하진 않겠지."
51120-278 = "백화요란의 정의는, 힘으로 결정된다는 걸."
51120-279 = "내 의견을 박살 내고 굽히게 만들고 스스로를 인정하게 만들고자 한다면── 날 쓰러트려."
51120-280 = "………!!"
51120-281 = "[s] \"잠깐. 둘 다 일단 진정하고…….\""
51120-283 = "아, 아으…… 저어…… 선생님."
51120-284 = "호, 혹시……. 제가 엄청 곤란한 타이밍에 찾아와 버린 걸까요?!"
51120-289 = "알겠, 사와요……."
51120-294 = "그렇다면 저 유카리, 키쿄 선배에게 계승전을 신청하겠사와요!"
51120-309 = "도전자 카데노코지의 계승전을 수락하고, 여기에 선언한다"
51120-310 = "대장전이 아닌 <작전참모>의 직을 건 이번 계승전은 <샬레의 [USERNAME] 선생님>을 참관인으로, 그리고 여기에 더해 본래라면 또 한 명의 보증인이 필요하겠지만……"
51120-311 = "이번만을 특례로 계승전을 치르는 서로의 합의가 있는 것을 감안."
51120-312 = "따라서 백화요란의 부원인 카데노코지 유카리, 그리고 키류 키쿄. 이 두사람을 상호 간의 보증인으로 삼아 계승전을 실시한다."
51120-313 = "불만은?"
51120-320 = "없사와요."
51120-328 = "그럼, 계승전을 시작하겠어."
