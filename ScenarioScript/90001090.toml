[translation]
90001090-1 = "제9화;전술적 승리"
90001090-2 = "[ns] \"해냈다!!!\""
90001090-6 = "화산 활동은요?!"
90001090-10 = "적어도 땅울림은 크게 감소했습니다. 용암의 분출도 줄어들었고요."
90001090-11 = "화산 쪽은 괜찮을 거야. 안정세에 들어섰어. 그보다, 호크마는……?"
90001090-15 = "마, 말도 안 돼요……! 아무리 완전한 상태가 아니었다고 해도, 호크마 쨩이 패배하다니……!"
90001090-16 = "잠깐만. 이거 뭐야? 이미 허용치의 자원은 전부 충족이 된 상황이었던 거야?!"
90001090-17 = "……그래서 그랬던 거군요. 적을 상대하거나 물리치는 것보다, 확보한 자원을 전송하고 보호하는 것을 우선했으니까……."
90001090-21 = "그것 참, 그런 거였다면 그런 거였다고 말 좀 해 주지."
90001090-22 = "호, 호크마 쨩은 부끄럼쟁이니까요. 에헷. 에헤헷."
90001090-23 = "그러면 여기에서는 호크마를 물러나게 할까. 어차피 전략적인 목표는 달성한 셈이니까."
90001090-29 = "[ns] \"호크마가…….\""
90001090-30 = "네. 물러났군요. 저 방향은 빙해 쪽이네요."
90001090-31 = "그렇지만, 뭐라고 해야 할지. 설마 제2형태가 있었다니……."
90001090-32 = "과연, 이곳으로 이어지는 구덩이 같은 흔적들은, 말 그대로 괴수의 발자국이었던 것이로군요."
90001090-33 = "[s] \"맞아! 거대 변신 괴수였어!!!\""
90001090-34 = "……선생님? 뭔가 묘하게 신이 난 것처럼 보이는데?"
90001090-35 = "[s1] \"하지만 거대 변신 괴수잖아?!\"\n[s2] \"그걸 싫어하는 사람은, 분명 세상에 없을 거라고?!\""
90001090-42 = "훗훗후. 그래도 뭘 좀 아는 사람이 한 명은 있었군요. 그게 저 이상한 선생님이어서 문제였지만."
90001090-43 = "에헤헤. 그래도, 호크마 쨩의 진가를 알아보는 분이 계셔서 다행이에요."
90001090-44 = "지금은 적을 칭찬할 때가 아니잖아……?"
90001090-46 = "다 좋습니다만. 그거, 저희들이 물리쳤지요."
90001090-51 = "윽……! 좋아. 지금은 실컷 그렇게 생각해 두라고. 하지만 이것만은 알아 둬. 우리가 물러나 준 거야! 그 반대가 아니라!"
90001090-52 = "히이잉……."
90001090-53 = "기, 기죽지 마. 아인! 괜찮아! 아인은 충분히 잘했으니까!"
90001090-54 = "여기에서는 이 정도로만 해 두지요. 이겼다고 생각하고 있겠죠? 좋아요. 그 기분을 마음껏 즐겨 두세요."
90001090-55 = "하지만 이것만은 말해 두죠. 전술에서의 승리가, 반드시 전략에서의 승리를 의미하지는 않는답니다?"
90001090-61 = "[ns] \"가 버렸나…….\""
90001090-62 = "아쉬워하시는군요, 선생님."
90001090-63 = "물론 저로서도 저 아이들과의 대화를 조금이라도 더 길게 끌어."
90001090-64 = "사소한 단서라도 좋으니 더 많은 것을 얻었으면 하는 마음이 있습니다만……."
90001090-65 = "[s3] \"확실히, 지금은 너무 단서가 부족하지.\"\n[s4] \"변신 괴수 이야기, 더 하고 싶었는데…….\""
90001090-66 = "네. 그렇지요. 적대하는 상대와의 대화야말로."
90001090-67 = "그 적대성을 어떻게든 할 수만 있다면, 가장 많은 것을 얻어낼 수 있는 방법인데 말이지요."
90001090-68 = "아쉬운 일이지만, 그건 우리가 어떻게든 해 봐야 하지 않을까?"
90001090-69 = "일단 급한 불은 끄기도 했고. 불이라고 하니까 더 더워졌어. 나 먼저 올라갈래."
90001090-70 = "네, 네에……."
90001090-71 = "그, 그 쪽이셨나요?"
90001090-72 = "그렇지만 저 역시 변신 전투 메이드입니다. 선생님."
90001090-73 = "선생님은 변신 괴수도 좋지만, 좀 더 저에게 관심을 기울여 주셔야 합니다."
90001090-74 = "(어쩐지 토키가…… 조금 변한 것 같은 느낌이 드는데……?)"
90001090-79 = "일단은 모두 돌아가죠. 저희도 타격이 없었던 것은 아니에요."
90001090-80 = "동감이야. 잠시 숨을 고르고 정비할 틈은 필요해."
90001090-81 = "응…… 무엇보다 게부라도 그렇지만, 호크마 역시 명확하게 쓰러트렸다는 느낌은 없었지. 연전으로 소모도 심했고."
90001090-82 = "그렇지만 저는 할 수 있습니다. 누구보다 완벽한 메이드이기에."
90001090-87 = "안 돼. 그만둬, 토키. 그대로는 어떻게 봐도 무리야. 일단 아비 에슈흐를 해제해."
90001090-95 = "……알겠습니다. 리오 님."
90001090-98 = "모두, 수고 많으셨습니다."
90001090-99 = "약간은 살 것 같지만……. 부장. 에어컨 조금만 더 강하게 틀면 안 돼?"
90001090-100 = "조금 봐주세요, 에이미. 저 슬슬 추워지기 시작했거든요?"
90001090-101 = "그러면 부장이 그 노란색 방한 장비 입으면 되잖아."
90001090-102 = "방한 장비를 입고 에어컨을 최대로 가동시키다니, 이 무슨 에너지 낭비인가요. 그거야말로 비효율의 극치 아닌가요?!"
90001090-103 = "그렇지 않아, 부장. 온도 문제로 작전 수행원의 잠재력을 100% 발휘하지 못하게 하는 것이야말로 비효율적이야."
90001090-104 = "에너지는 보충이 가능하고, 기계는 정비와 교체가 가능하지만, 인간의 신체는 보통 그렇지 못하단 말이야."
90001090-106 = "최고 속력으로 이 화산 지대를 벗어나도록 하겠습니다. 그것으로 두 분 모두 타협할 수 있는 도달점을 찾을 수 있게 되겠죠."
90001090-107 = "[s] \"좋은 판단이야, 토키. 나이스.\""
90001090-108 = "천만의 말씀입니다. 피스, 피스."
90001090-109 = "피, 피스……?"
90001090-110 = "그렇습니다. 히마리 부장께 가르침을 받은 것이지요."
90001090-111 = "그렇답니다~ 당신의 토키는 이렇게 성장하고 바뀌었답니다~"
90001090-112 = "이것도 저것도 모두 이 밀레니엄의 멘토이자 초천재병약청초계미소녀 덕분이라고 해야겠지만요."
90001090-113 = "어떻게 할 거야, 리오 회장. 부장이 또 의기양양해졌잖아."
90001090-115 = "아, 아니. 나는……."
90001090-116 = "[s5] \"히마리의 말을 번역하자면, 이렇게 만나서 반갑고.\"\n[s6] \"지금까지 도와줘서 고맙다는 뜻이야.\""
90001090-119 = "진짜 아니거든요? 그런 생각 한 적 없거든요?"
90001090-120 = "……뭐, 여러모로 도움을 받은 건 부정할 수 없는 사실이지만요."
90001090-121 = "고마워요, 리오. 덕분에 살았어요."
90001090-122 = "……그래."
90001090-126 = "현재 툰드라 지대 상공을 비행 중입니다. 기류는 안정되어 있습니다만, 만일의 사태에는 항상 주의해 주십시오."
90001090-127 = "데카그라마톤의 잔여 병력이나 시설은…… 이제 보이지 않는 것 같네."
90001090-128 = "병력이니 시설이니 하니까 생각난 게 있네요. 그것들의 샘플을 조금 챙겨 왔답니다."
90001090-129 = "……그런 건 또 언제 챙긴 거야, 부장. 속성에 다람쥐 같은 거라도 추가할 셈이야?"
90001090-130 = "어머나. 다람쥐라니 귀여워서 좋네요."
90001090-131 = "…………내가 간만에 단어 선택을 잘못한 것 같아. 미안해, 선생님."
90001090-132 = "[s] \"거기에서 나에게 사과하면, 내가 뭐가 되니…….\""
90001090-133 = "잘 모르겠지만, 어째서인지 이번만큼은 에이미가 잘못한 것 같군요. 동의드립니다."
90001090-134 = "(뭐라고 말을 꺼내면 어색해질 것 같으니까, 가만히 있어야지…….)"
90001090-140 = "[ns] \"그, 그보다 샘플이라니, 무슨 말이야?\""
90001090-141 = "말 그대로랍니다. 호크마, 자원 채취 시설, 그것들을 지키고 있는 것처럼 보였던 데카그라마톤의 병력들……."
90001090-142 = "하나같이 분석해 볼 가치가 있어 보이는 대상들이었죠."
90001090-143 = "무엇보다 군수공장인 헤세드가 없는데, 이만큼의 병력과 시설을 운용하고 있었던 것은 수상한 점이기도 하고요."
90001090-144 = "그렇지만 그러려면 우선 헬기를 어딘가에 착륙시켜야 할 것 같습니다만."
90001090-145 = "알았어. 이왕 갈 거면 시원한 곳으로 가자."
90001090-146 = "에이미에게 시원한 곳이라면, 저에게는 가혹한 곳이 될 것 같은데요……?"
90001090-147 = "그렇지만, 헬기 엔진의 과열 문제도 해결하기는 해야 하잖아."
90001090-148 = "……어쩔 수 없겠네요. 이번은 제가 참도록 하죠."
90001090-153 = "벌써부터 그럴 필요는 없을 것 같다고 생각하는데, 부장……."
90001090-155 = "다음화;이름 없는 신들의 유산"
