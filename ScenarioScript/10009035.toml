[translation]
10009035-2 = "[ns] \"또 탈출이라니?! 이게 대체 어떻게 된 거야?!\""
10009035-3 = "설마……. 점심 사식으로 넣어줬던 오야코동을 이용해 수갑을 풀어냈을 줄이야."
10009035-4 = "재액의 여우란 이름은, 역시 허명이 아니었던 거네요."
10009035-5 = "[s] \"아니아니, 의미를 모르겠는데.\""
10009035-6 = "그래도 걱정 마. 다음번엔 이런 일이 일어나지 않도록, 저녁 메뉴는 메밀소바로 하기로 했으니까!"
10009035-7 = "[s] \"메밀소바면 괜찮은 거야?!\""
10009035-8 = "하여간! 응! 걱정 마!"
10009035-9 = "이번엔 충분히 주의를 기울일 테니까."
10009035-10 = "이런 실패를 거듭하면서 보안이 강화되고, 발키리 경찰학교의 경비 또한 나날이 진화하는 거네요! 새롭게 배웠습니다!"
10009035-11 = "그럼 협조 감사했어. 선생!"
10009035-12 = "실례하겠습니다!"
10009035-13 = "[s] \"으, 으음…….\""
10009035-18 = "그럼 저희도 업무를 재개하도록 하죠."
10009035-19 = "[s] (이대로 정말 괜찮은 걸까?)"
