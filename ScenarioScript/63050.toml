[translation]
63050-1 = "제5화;하모니카 2"
63050-3 = "선배가 떨어트린 것 같아서, 주워 왔어요……."
63050-7 = "아, 저기, 그러니까 꼭 지금 해 달라는 건 아니에요!"
63050-8 = "지금은 여러모로 어려울 것 같네요, 네! 저도 그 정도 눈치는 있으니까요!"
63050-9 = "하지만, 언젠가, 다시 한번……."
63050-10 = "그때처럼, 선배의 연주를, 듣고 싶어요……."
63050-11 = "아, 아아……."
63050-12 = "(이런 결과에 도달하고 싶지 않았어.)"
63050-13 = "(책임으로부터 눈을 돌려서는 안 된다.)"
63050-14 = "(그건 너무나 당연한 일일 텐데.)"
63050-19 = "사라졌는데?!"
63050-20 = "선배!"
63050-21 = "쫓아가야 해. 일단 아리우스 분교 바깥으로는 나갈 수 없을 거야."
63050-29 = "[ns] \"여보세요? 무슨 일이니?\""
63050-30 = "선생님? 여기, 세 번째 천사가 나타났는데요!"
63050-31 = "으아아…… 뭐라고 설명드려야 하지…… 일단 세 번째 천사가 나타난 순간, 그 전의 두 천사는 사라졌어요!"
63050-32 = "마치 세 번째 천사에게 흡수되는 것처럼 보이기도 했는데…… 어쨌든요!"
63050-33 = "그리고 그 세 번째 천사 안쪽에, 뭔가 사람처럼 생긴 게 보였다 말았다 하는데……."
63050-34 = "믿으실지 모르겠지만…… 꼭 스바루 선배처럼 생겼어요!"
63050-35 = "선생!"
63050-36 = "[ns] \"그래! 확실하네!\""
63050-40 = "[ns] \"모두 고마워! 무슨 일이 다시 생기면 또 연락해 줘!\""
63050-41 = "네!"
63050-47 = "(…….)"
63050-49 = "(여기에서 보는 하늘은, 이렇게 흐리기만 한데.)"
63050-50 = "(조금 전, 사오리의 기억에서는…….)"
63050-53 = "그런가."
63050-54 = "사오리."
63050-55 = "네가 본 하늘은, 이런 광경이었던 건가."
63050-57 = "(아리우스의 풍경은, 언제나 마찬가지였다.)"
63050-58 = "(거기에서 살아가고 있는 우리도, 역시나 그러했다.)"
63050-60 = "(퇴적지. 그러니까 모든 것이 흘러들어와 쌓인 채, 잊힌 지역.)"
63050-61 = "(아리우스는 분명, 그런 곳이었겠지.)"
63050-62 = "(그런 곳이 아니었다고 해도, 어느 사이엔가 그렇게 되어 있었던 것이겠지.)"
63050-64 = "(세상은 아리우스를 격리했고, 마침내 잊는 것을 선택했다.)"
63050-65 = "(아니, 그것조차도 관대한 평가인지도 모른다.)"
63050-66 = "(어차피 세상이란, 거추장스럽거나 방해되는 것들을, 아무도 모르는 사이에 먼지처럼 떨어 없애고.)"
63050-67 = "(누구도 생각하지 못하는 방향으로, 성큼성큼 걸어가는 녀석이니까.)"
63050-69 = "(그렇지만 누가 잊힌 자들을 마지막까지 기억하고 보듬어 줄까.)"
63050-70 = "(누가, 그 들리지 않는 목소리를 대신해, 중얼거림을 남겨 줄 수 있을까.)"
63050-72 = "맞다! 하모니카 불어 줘요, 선배! 하모니카!"
63050-73 = "이런 폐허에서, 혼자 감상에 젖은 척 하모니카를 연주하는 건……."
63050-74 = "아무래도 조금, 낡은 감성이 아닐까, 하는 생각이 들어서……."
63050-78 = "저기, 저도……"
63050-82 = "[log=스바루]그만 해 주세요.[/log]"
63050-85 = "오랜만에 돌아온 김에"
63050-89 = "[log=스바루]……부탁, 이에요. 그만 해 주세요.[-][/log]"
63050-93 = "선배의 연주, 듣고 싶은데요……?"
63050-97 = "[log=스바루]!!![-][/log]"
63050-101 = "[log=스바루]!?!?[-][/log]"
63050-108 = "후회해?"
63050-109 = "아츠, 코……."
63050-110 = "괜찮아. 우리도 그랬어."
63050-111 = "하지만, 아리우스는."
63050-112 = "……트리니티가 아리우스에게 해 왔던 일들은……!"
63050-113 = "그래. 그렇지. 그건 분명 짚고 넘어가야지."
63050-114 = "그렇지만 말이야."
63050-115 = "그것 때문에 지금 선배가 이렇게 괴로워하는 건, 선배 자신에게 있어서도 조금 억울한 일이 아닐까?"
63050-116 = "혹시 이 말 기억해?"
63050-117 = "<가시 돋친 채찍에 뒷발질하기가, 네게 고생이니라.>"
63050-118 = "……!"
63050-119 = "같이 해 보자."
63050-120 = "혼자서 너무 많은 것을 짊어지려 하지 말고."
63050-121 = "이제, 와서?"
63050-122 = "응. 이제 와서라도."
63050-123 = "솔직하게 이야기하면, 선생님은 분명 도와주실 테니까."
63050-124 = "……."
63050-125 = "아, 그러는 사이에 우리는 조금 교정국에 다녀오게 될지도 모르니까, 그 부분은 잘 부탁할게?"
63050-126 = "……."
63050-127 = "아니…… 아니야. 그럴 수는 없어."
63050-128 = "그럴 수는, 없어요."
63050-129 = "저는."
63050-130 = "우리는."
63050-131 = "아리우스는 아직, 납득할 수 없습니다."
63050-132 = "당신이 이야기했던 것과 같이, 이 땅은 이미 '그러한 장소'로 변하고 말았으니까요."
63050-133 = "어떤 단죄도 심판도 이루어지지 않은 채, 모든 것을 묻어 둔 채로 흘러가게 둘 수는 없습니다."
63050-134 = "그것은 먼저 이 땅에서 사라져 간, 모든 자들을 위한 일이 아닙니다!"
63050-135 = "그걸 생각하지 말자는 게 아닌데……."
63050-136 = "이미 스스로에게 먹혀 버렸구나. 이래서는 어떤 목소리도 들리지 않겠네."
63050-137 = "괜찮아. 우리도 한때 그랬는걸. 그리고 이럴 때 어떻게 해야 하는지, 아리우스는 잘 알고 있지."
63050-138 = "……?"
63050-139 = "자."
63050-140 = "아리우스의 방식으로, 조금 이야기를 나눠 볼까?"
63050-143 = "아츠코? 괜찮나? 갑자기 기도하는 것 같은 자세를 하길래……."
63050-144 = "응. 괜찮아. 잠시…… '통화'를 하고 왔어."
63050-146 = "통화……?"
63050-147 = "자, 잘 모르겠지만…… 그런 거겠죠……?"
63050-148 = "응. 그런 거야."
63050-149 = "그러면 선생님."
63050-150 = "[s] \"응?\""
63050-151 = "지금 자기만의 꿈에서 깨어나지 못하고 있는 선배를, 같이 깨워 줄래?"
63050-152 = "조금, 아리우스다운 방법으로 말이야."
63050-153 = "[s] \"내가 뭘 하면 될까?\""
63050-154 = "언제나 선생님이 해 왔던 일을, 해 주면 될 거야."
63050-155 = "마이아도, 도와줄 수 있겠니?"
63050-159 = "……네. 알겠어요."
63050-160 = "선배와 선생님을 위해서라면요!"
