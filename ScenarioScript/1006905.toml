[translation]
1006905-1 = "손님맞이는 힘든 법이야."
1006905-2 = "현무상회"
1006905-3 = "(루미의 말대로, 산해경의 업무가 끝난 뒤 현무상회에 들렀다.)"
1006905-7 = "와 줘서 고마워, 선생님."
1006905-8 = "주문은 어떻게 하겠어?"
1006905-9 = "[s] \"오늘의 메뉴나 주방장 추천 메뉴로!\""
1006905-10 = "호오. 그렇게 나오겠다는 거군?"
1006905-11 = "오늘의 메뉴는 준비되어 있지만, 여기에서는 주방장 메뉴를 추천하지."
1006905-12 = "주방장 메뉴는 원래 없는 거지만, 지금 막 내가 떠올린 메뉴가 있거든."
1006905-13 = "[s] \"오, 오늘은 '시식'이 아닌 거지?\""
1006905-14 = "아하하하. 걱정하지 마, 오늘은 기대해도 돼."
1006905-18 = "이게 뭐야, 대체! 주방장 나오라고 해!"
1006905-20 = "[ns] \"무슨 일이지?!\""
1006905-21 = "잠시…… 봐야겠군. 손님의 클레임이네."
1006905-27 = "이거 보라고! 음식에서 머리카락이 나왔잖아!"
1006905-28 = "현무상회가 유명하다고 해서 와 봤는데, 최소한의 품질 관리도 안 되는 곳이었던 거야?"
1006905-29 = "무슨 소리야! 그럴 리가 없어! 우리가 얼마나 꼼꼼히 체크하는데!"
1006905-30 = "뭐라고? 그럴 리가 없다고? 그럼 이 머리카락은 뭔데? 눈이 있으면 똑똑히 보라고!"
1006905-32 = "아니면 이런 것도 볼 눈이 없어서 음식을 그따위로 만드는 건가?!"
1006905-33 = "……말이 너무 심한 것 아냐?"
1006905-35 = "어? 뭐야, 협박하는 거야? 식당을 찾아 와 준 사람에게 감히?!"
1006905-36 = "자, 자. 잠시만."
1006905-37 = "주방장이자 총책임자로서, 진심으로 사과드립니다. 죄송합니다. 손님."
1006905-39 = "사죄의 뜻으로, 음식값은 받지 않겠습니다. 다시는 이런 일이 일어나지 않도록 주의하겠습니다."
1006905-40 = "제 얼굴을 봐서라도, 화를 조금이나마 풀어 주시지 않으시겠습니까?"
1006905-42 = "흐, 흥! 나름 마음이 느껴지기는 하는구만. 오늘은 이만 돌아가 주지."
1006905-47 = "회장님, 너무 무르신 것 아닙니까?! 현무상회에서 그런 위생 실수가 나올 리 없잖아요!"
1006905-48 = "후우. 뭐, 그래. 알아. 우리 직원들이 어떤지는 내가 제일 잘 알지."
1006905-49 = "억울한 마음은 이해하지만, 접객의 제1원칙은 다른 손님들이 식사를 하는 동안 불편하지 않도록 하는 거야."
1006905-50 = "그 점을 잊지 않도록 해."
1006905-51 = "예. 회장님. 알겠습니다."
1006905-55 = "[ns] (그 손님…… 뭔가 수상한 듯한, 어딘가에서 본 기억이 있는 듯한……)"
1006905-57 = "(조심스럽게 현무상회를 나와, 손님의 뒤를 따라가 보기로 했다.)"
1006905-62 = "흐흐흐……"
1006905-63 = "오늘도 이렇게 공짜로 점심을 해결했군."
1006905-64 = "언제 해도 효과적이란 말이야, 이 방법은."
1006905-69 = "[ns] \"잠깐, 기다려.\""
1006905-70 = "엉? 뭐야, 당신은?"
1006905-71 = "[s1] \"발키리 생활안전국의 사건 기록부에서 본 기억이 있어.\"\n[s2] \"음식에 이물질을 넣어, 무전 취식을 하는 상습범이 있다고.\""
1006905-74 = "무, 무슨 소릴 하는 거야? 당신이 그런 걸 어떻게 알아?"
1006905-75 = "애초에 일반인이 어떻게 그런 걸 볼 수 있다고……?"
1006905-76 = "잠깐! 당신 혹시…… 그건가? 소문으로만 듣던, 샬레의 '선생님'……?"
1006905-77 = "[s] \"일단은 그런 몸인데.\""
1006905-78 = "큭……!"
1006905-79 = "하, 하지만! 그래서 그러면 어쩔 건데?! 당신 혼자서 뭘 할 수 있다고! 헹!"
1006905-81 = "확실히 선생님 혼자서는 어쩔 수 없을지도 모르지만, 내가 있다면 이야기가 달라지겠지."
1006905-82 = "누, 누구냐?!"
1006905-86 = "안녕하십니까…… 손님. 금방 다시 뵙는군."
1006905-87 = "너, 너는……!"
1006905-88 = "그래 봤자 이제 와서 뭘 어쩌겠다는 거냐! 계산은 이미 끝났을 텐데?"
1006905-89 = "뭐, 그건 그래. 애초에 수상쩍은 게 한두 개가 아니었지만……"
1006905-90 = "일단 식당 주인으로서, 클레임을 걸어오는 손님을 그냥 돌려보낼 수밖에 없었지."
1006905-91 = "하지만 그건 그때, 거기에서의 이야기."
1006905-95 = "뭘 하려는 거야?! 가, 가까이 오지 마!"
1006905-97 = "허나 거절한다!"
1006905-98 = "당신은 세 가지 잘못을 저질렀어."
1006905-99 = "우선 학생으로서, 선생님을 무시하는 행위를 그냥 두고 볼 수 없었지."
1006905-100 = "두 번째로, 내 소중한 후배들을 모욕한 것 역시, 선배로서 용서할 수 없는 행위였고."
1006905-101 = "마지막으로, 내 주방장으로서의 자존심을 걸고, 우리 식당의 위생 문제를 모욕한 것도 참을 수 없는 일이었지."
1006905-103 = "으아아아아아아!"
1006905-108 = "(루미의 시원한 펀치가, 무전취식객을 시원하게 날려버렸다!)"
1006905-110 = "후우……고마워. 선생님. 조금 시원해졌네."
1006905-111 = "선생님이 저 무전취식객을 붙잡아 주지 않았으면, 아무것도 되지 않았을 거야."
1006905-112 = "[s3] \"뭘, 이런 일 가지고.\"\n[s4] \"발키리 학원에는 지금 연락해 뒀으니까, 금방 도착할 거야.\""
1006905-115 = "하하하. 참 빈틈이 없군. 선생님은."
1006905-116 = "그러면 감사의 뜻으로……"
1006905-117 = "[s5] \"아니, 아니. 마음만 받을게. \"\n[s6] \"이제 정말 샬레로 돌아가 봐야 해서.\""
1006905-120 = "응. 그 정도는 알고 있어."
1006905-121 = "그러니까 샬레로 배달시켜 줄게. 점심도 중간에 방해를 받아 버렸으니까, 디저트는 서비스로 준비해 주겠어."
1006905-122 = "[s] \"루미는 남을 챙겨 먹이는 걸 좋아하는구나……\""
1006905-123 = "좋아한다고 할까, 버릇 같은 거지."
1006905-124 = "아무래도 주방장이니까 말이야. 하하하."
