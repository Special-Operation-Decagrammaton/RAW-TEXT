[translation]
1503-1 = "Trouble & Trackers 3"
1503-2 = "베리타스 해커 휴게실"
1503-4 = "코드 인젝션으로 인한 악성 코드 감염 확인. 백도어가 설치되었습니다."
1503-5 = "아, 그리고 방금 또 다른 해킹 시도가……"
1503-7 = "도와줘, 하레 선배! 어떻게 좀 해줘~!"
1503-8 = "나는 만능 고양이 로봇이 아니거든? 어떻게 좀 해달라고 해도……."
1503-9 = "하지만 이대로는 학생기록부를 수정하기는커녕 우리 쪽 컴퓨터까지 탈취당하고 만다고!"
1503-10 = "내 실력으로는 도저히 무리야. 제발 도와줘~!"
1503-14 = "(한숨) 하는 수 없지. 방어 코드를 짜는 건 내 전문 분야가 아니지만 조금만 만져볼까……."
1503-19 = "패킷을 위조해서 잘못된 경로로 진입하도록 유도하면…… 어라? 벌써 막혔다고?"
1503-23 = "그럼 공격이 예상되는 폴더에 논리 폭탄을 심어서 과부하를 유도하면…… 이것도 벌써?"
1503-28 = "으으음, 곤란하네. 내 능력으로도 이건 어려울지도……."
1503-29 = "마, 말도 안 돼. 그 하레 선배가 해킹으로 고전하고 있다고?"
1503-30 = "이쪽의 행동을 예상하기라도 한 것처럼 모든 경우의 수에 실시간으로 대응하고 있어."
1503-31 = "이런 실력자가 베리타스 이외에도 또 있었다니 믿기 어려운걸."
1503-32 = "하레. 접속이 지연된 탓에 점차 트래픽이 늘어나고 있습니다."
1503-33 = "더 이상 시간을 끌었다가는 이쪽의 정체가 세미나에 들킬 위험도 있습니다."
1503-34 = "그 말이 맞아. 마키, 이번은 아쉽지만 학생기록부의 데이터를 수정하는 건 포기하자."
1503-36 = "우우…… 아쉽지만 어쩔 수 없지. 세미나에 불려가 잔소리를 듣는 건 싫으니까."
1503-37 = "접속 종료. 하레 선배도 드론을 철수시켜줘."
1503-38 = "<SYSTEM> 로그 삭제 중…… 시스템을 종료합니다."
1503-40 = "(사건 당일 저녁.)"
1503-44 = "나 왔어—."
1503-45 = "오랜만이야, 선배……."
1503-46 = "어라? 무슨 일 있었어? 왜 이렇게 다들 축 늘어져 있는 거야?"
1503-47 = "스스로의 한계를 새삼 다시 느꼈다고 해야 할까……."
1503-48 = "세상은 넓고 실력자는 많습니다……."
1503-50 = "오전에 해킹을 하던 도중에 익명의 해커로부터 역습을 당하고 말았거든."
1503-51 = "하레 선배까지 나섰는데 순식간에 당해버렸어. 설마 베리타스 밖에 그런 실력자가 있었을 줄이야……."
1503-52 = "정말? 하레까지 손을 쓰지 못한 실력자라니, 그거 대단한데……."
1503-53 = "그나저나 익명의 해커라고 하니 떠올랐는데, 나도 아까 학생기록부의 서버를 점검하던 중에 엄청난 녀석과 마주쳤었어."
1503-54 = "어째서인지 집요하게 신체검사 기록만 빼돌리려 하는 해커였는데, 어찌나 대응 속도가 빠르던지. 하마터면 나도 당해버릴 뻔했지 뭐야."
1503-55 = "응? 학생기록부의 서버?"
1503-56 = "그럼 설마 우리가 아까 싸운 상대는……."
1503-57 = "부부장이었다는 말입니까?"
1503-59 = "……뭐? 설마, 아까 학생기록부를 해킹해서 그 난리를 피운 해커들이 너희였어?"
1503-60 = "어쩐지 수법이 낯이 익다 싶더니만……."
1503-61 = "저희는 처음부터 승산 없는 싸움을 하고 있었군요."
1503-62 = "얼굴도 모르는 익명의 해커에게 졌다면 분했겠지만, 상대가 베리타스의 부부장이라면 어쩔 수 없지."
1503-63 = "마, 맞아! 우리 베리타스를 능가하는 유능한 해커가 없다는 게 증명되어서 다행이야!"
1503-65 = "괜찮지 않거든! 너희들은 남의 개인정보를 무어라고 생각하는 거야?"
1503-69 = "이 기회에 해커 윤리에 관해서 단단히 교육해 둘 테니, 다들 각오해!"
1503-70 = "으앙, 한 번만 용서해줘, 선배!"
1503-72 = "밀레니엄 교사 내 복도"
1503-73 = "(사건으로부터 며칠이 지난 후…….)"
1503-77 = "저 학생이 그 소문의……?"
1503-78 = "맞아. 저번 신체검사에서 몸무게가 100kg이나 나왔다는 그 유우카 회계야."
1503-79 = "겉보기에는 그렇게 살이 찐 것처럼 보이지 않는데…… 무슨 특수한 장비라도 착용하고 있는 걸까?"
1503-80 = "어쩌면 마른 이미지를 몸 위에 홀로그램으로 투사하고 있을지도 몰라!"
1503-81 = "아니라니까! 그런 쓸데없는 장비를 개발할 시간이 있으면 운동을 했겠지!"
1503-82 = "전에 SNS에 올라온 정보는 가짜 정보라고 바로 공지를 했는데도! 어째서 갈수록 소문이 커져가는 거야?"
1503-87 = "아아, 정말—! 범인이 누구인지 잡히기만 해봐!!"
1503-88 = "Trouble & Trackers"
