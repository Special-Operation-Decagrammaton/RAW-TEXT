[translation]
51060-1 = "제6화;다음으로 향해야 할 곳은"
51060-4 = "(사전에 필요한 수속을 마친 뒤, 그대로 유카리를 따라, 우리들은 백귀야행의 거리로 나오게 되었다.)"
51060-9 = "흐응, 흥흥~♪"
51060-10 = "[s] \"그럼 지금부터 필요한 건…….\""
51060-14 = "(계승전이 성립되기 위해 필요한 조건은 두 가지. <계승전>이 공평한 잣대로 이루어진 의식임을 입증해 줄 <참관인> 1명과……)"
51060-15 = "[ns] (정당성을 보증해 줄 백화요란의 부원, 이라고 했었지.)"
51060-16 = "음양부…… 아니, 샤알-레의 선생님까지 협조해 주시는 이상. 여기서부터는 오로지 쾌진격뿐!"
51060-17 = "힘차게 전진! 그리고 직진뿐이와요!"
51060-18 = "[s] \"유카리, 백화요란은 어떤 동아리야?\""
51060-19 = "네……?"
51060-20 = "어떤 동아리……라니요?"
51060-21 = "[s1] \"아니, 계승전을 하기 전에 적어도 백화요란이 어떤 동아리인지.\"\n[s2] \"좀 더 자세히 알아 둘 필요가 있지 않을까. 해서.\""
51060-24 = "아……."
51060-25 = "…………."
51060-26 = "[s] \"아, 물론 말하기 싫다면 억지로는…….\""
51060-31 = "후후훗! 아뇨! 백화요란에 대해 궁금하시다면 저 유카리! 기꺼이 전력을 다해 설명해 드리겠사와요!"
51060-41 = "백화요란…… 그 정식명칭은 백화요란 분쟁조정위원회."
51060-42 = "제 입으로 말하기는 살짝 부끄럽지만 백귀야행 연합학원 내에서도 우수한 학생들을 선발하여 뽑는, 그야말로 엘리~트 중의 엘리~트 동아리여요!"
51060-44 = "그 역사는 과거 백귀야행 연합학원이 아직 연합이 아닌 시절까지 거슬러 올라가야 할 만큼 굉장히 유서 깊은 동아리로……."
51060-45 = "주된 활동은 백귀야행 연합 내에서 발생하는 각 학원의 분파 내지 동아리 간의 갈등 및 분쟁을 중간에서 중재하고 조정해 주는 역할이어요."
51060-46 = "[s] \"다른 학원의 선도부 같은 역할……이란 거구나.\""
51060-49 = "네, 필요하다면 문제아를 체포하고 계도하는 역할을, 대대로 <대 예언자>로부터 보장받은 것도 사실이긴 하지만."
51060-50 = "그래도 저희가 가장 중요하게 여기는 건 처벌이나 계도가 아닌 <중재>여요."
51060-51 = "연합에서의 갈등이란, 누군가가 잘못하고, 한쪽이 나쁘기만 해서 발생하는 게 아닌 것."
51060-52 = "백화요란은 그 중심에 서서 각자의 말과 생각을. 서로가 납득할 수 있는 방향으로 중재하는 것을 목표로 하고 있사와요."
51060-53 = "그것이 저희의 역할이랍니다."
51060-54 = "[s] \"……그건 고생이겠네.\""
51060-55 = "물론 고생하는 부분도 많지만, 반대로 이러한 방식을 고수하기에 해결할 수 있는 문제도 많은 것이어요."
51060-56 = "저 유카리는 이러한 백화요란의 방식이 무척이나 자랑스럽사와요!"
51060-57 = "[s] \"유카리는 백화요란을 무척 좋아하는구나.\""
51060-58 = "네!"
51060-59 = "그도 그럴게."
51060-60 = "백화요란은……… 오롯이 제가 동경하던 것이었으니까."
51060-72 = "거기! 멈추시와요!"
51060-77 = "아앙? 넌 또 뭐야? 꼬맹이."
51060-78 = "괜히 울기 전에 가던 길 가지?"
51060-80 = "지금 당신들이 하는 행위!"
51060-81 = "그것은 올바르지 않으니! 멈추라고 말했사와요!"
51060-83 = "뭐가 어째?"
51060-85 = "우린 그냥 여기서 제공하는 금붕어 낚시 뜰채가 믿음직스럽지 못하니, 우리가 직접 만들어 온 슈퍼울트라최강파이널뜰채로 낚시를 하겠다고 말한 것뿐이라고."
51060-86 = "바로 그게 횡포라는 것이어요!"
51060-88 = "잔말 말고 딱 보니까 아직 중학생 같은데. 괜히 아픈 꼴 보고 싶지 않으면……."
51060-93 = "에잇!!"
51060-102 = "커억?! 이, 이 자식이?!"
51060-104 = "약자를 괴롭히고! 멋대로 축제를 휘젓는 건 저 유카리가! 두고 보지 않을 것이어요!"
51060-110 = "그래. 어디 그렇게나 원한다면……"
51060-111 = "감히 주제도 모르고 덤벼든 걸 후회하게 만들어 주마!"
51060-115 = "포위해!"
51060-132 = "읏……!"
51060-153 = "누, 누구냐?!"
51060-160 = "다친 데는 없니?"
51060-165 = "아……… 그……. 네……."
51060-167 = "그래. 다행이네."
51060-169 = "가, 갑자기 총질이라니! 네 녀석 무슨 짓을……!"
51060-170 = "우리가 누군지 알고 감히……!"
51060-171 = "잘 알고 있어. 축제 때만 되면 어김없이 자연발생 하는 문제아들이잖아."
51060-172 = "감히……라고 말하는 건 내가 하고 싶은 말이야."
51060-181 = "히이익! 단 한 발로 깔끔하게 침묵시키는 이 무시무시한 실력……"
51060-182 = "거기다 저 백색의 머리카락과 물빛 하오리라면……. 서, 설마……!"
51060-191 = "도, 도, 도망쳐! 백화요란이다! 백화요란이 떴어!"
51060-196 = "으리야아압! 도망칠 수 있을까 보냐! 이미 우린 상인회로부터 신고를 받고 출동했다고!"
51060-197 = "전원 밤새 설교를 들을 준비나 하라고!"
51060-198 = "쓸데없는 소리는 그쯤 해 둬."
51060-202 = "이대로 쫓을 거야."
51060-203 = "알았어! 그럼 가볼까! 나구사 선배! 뒤는 맡길게!"
51060-208 = "아, 저기…… 저……."
51060-210 = "불의를 앞에 두고도 물러서지 않고 맞서는 당당한 기개."
51060-215 = "무척이나 멋졌어."
51060-216 = "……!"
51060-217 = "여기서부턴 우리, 백화요란에게 맡겨. 후배님. 그럼."
51060-225 = "네, 생전 처음으로 다른 누구도 아닌 소녀, 저 자신이 동경하고 바란 장소……."
51060-226 = "저 또한 미래엔 나구사 선배처럼……."
51060-230 = "흠흠! 어쨌거나 그래서 더욱! 저 유카리는 작금의 백화요란을 내버려 둘 수 없는 것이어요!"
51060-231 = "다시 그때의 모습으로 돌아가기 위해……."
51060-232 = "백화요란을 원래의 모습으로 되돌리기 위해."
51060-233 = "저 백화요란의 엘리~트! 유카리의 손으로! <계승전>을 승리로 이끌어 <부장의 자격>을 쟁취하겠사와요!"
51060-234 = "[s3] \"그러고 보니 부장의 증거니, 자격이니 하는 말을 했었지.\"\n[s4] \"자격이라는 건 구체적으로 뭘 말하는 거야? 보증서…… 같은 건가?\""
51060-237 = "앗, 과연! 날카로운 질문이시어요!"
51060-238 = "흠흠. 백화요란의 부장에겐 대대로 <대 예언자>로부터 받아 계승되어 온 자격의 증거라는 것이 존재하고 있사와요."
51060-239 = "그 <자격의 증거>를 가진 사람이야말로 명실상부 백화요란의 부장이라고 할 수 있다고 할지……."
51060-240 = "계승전이란 그 <자격의 증거>를 계승하는 행사……라고 들은 기억이 있사와요!"
51060-241 = "……네, 아마도!"
51060-242 = "[s] \"거기서 아마도…… 라고 말해도 괜찮은 거야……?!\""
51060-243 = "그, 그것이…… 소녀가 백화요란에 들어온 뒤로 이제까지 한 번도 계승전을 볼 기회가 없었기에……"
51060-244 = "아, 그래도 <자격의 증거>가 어떠한 물건인지, 어떤 생김새를 가졌는지는 백화요란 홍보 홈페이지에서 볼 수 있을 테니까……."
51060-248 = "(과연 홍보 홈페이지도 있던 것인가. 하고 감탄하는 것도 잠시.)"
51060-252 = "자격의 증거는, 바로 이것이어요!"
51060-257 = "[ns] \"이건……. 총……?\""
51060-258 = "네, 말씀하신 대로 총이어요."
51060-259 = "대 예언자 쿠즈노하로부터 전달받았으며, 대대로 백화요란의 부장만이 손에 쥘 자격을 가진다는 전설의……."
51060-260 = "말 그대로 <귀신을 사냥하는 전설의 마총> 이어요!"
51060-261 = "[s5] \"귀신을 사냥……? 응?\"\n[s6] \"전설의, 마총……?\""
51060-264 = "후후, 당황하시는군요. 소녀도 이해할 수 있사와요."
51060-265 = "다름이 아니라 저희 백화요란 내에서 전해져 내려오는 <백화요란의 부장이라면 쿠즈노하 님과 만날 수 있다.>라는 소문과 함께 쌍벽을 이루는 이야기로서……"
51060-266 = "<백화요란의 부장쯤이 되면 귀신도 잡고 유령도 잡는 퇴마사로서 활약한다는 모양!>이라는 이야기는, 아는 사람만 아는 매우 극비리에 전해져 내려오는 소문이니까!"
51060-267 = "[s] \"……그쯤 되면 그냥 도시전설…… 같은 거 아냐?\""
51060-271 = "무, 무슨 그런 말씀을……!"
51060-272 = "백화요란의 부장에게만 대대로 내려오는 퇴마의 마총이라니, 이렇게나 가슴이 뛰는 이야기를 두고 그런 냉정한 말씀이시라니! 너무 하시어요!"
51060-273 = "[s] \"으, 으응…….\""
51060-274 = "뭐어, 그렇다고는 해도 결국 소문은 어디까지나 소문…… 풍문에 불과한 이야기이므로 사실 여부는 알 수 없사와요."
51060-275 = "단지, 소녀도…… 계승전에서 이겨, 마총을 얻을 수 있다면……."
51060-276 = "……수업이 끝난 뒤 집으로 향하는 그 으슥한 밤길을, 더는 무서워할 필요 없을 것이어요!"
51060-277 = "[s] \"과연, 목표로서는 훌륭하네.\""
51060-281 = "[ns7] \"그래서 말인데. 참관인은 내가 담당한다고 치고.\"\n[ns8] \"보증을 해줄 백화요란의 부원은 어떻게 할 셈이야?\""
51060-284 = "제게 있어 <계승전>을 도와줄 가능성이 있는 간부급 부원이라고 한다면……."
51060-289 = "마침 의지할 수 있는 선배 두 분이 있사와요."
51060-290 = "백화요란의 돌격대장을 맡고 있는 <렌게> 선배와 조용한 참모라고 불리던 <키쿄> 선배여요."
51060-292 = "두 분은 나구사 선배가 떠나가서 돌아오지 않았을 때, 누구보다 가장 크게 화를 냈던 분들이어요."
51060-293 = "분명 나구사 선배의 소식을 알리면 저 유카리의 계승전 계획을 발 벗고 도와주실 게 분명……!"
51060-295 = "그렇게만 된다면 계승전을 치르고 승리!"
51060-296 = "백화요란의 모든 문제도 해결되면서 전~부 만사 옥-케이여요!"
51060-297 = "[s] \"으음, 그럼 그 두 사람은 어디로 가면 만날 수 있어?\""
51060-298 = "으음, 키쿄 선배라면 백화요란의 조정실로 가면 찾아뵐 수 있을 테지만……."
51060-299 = "여기서 가장 가까운 건 렌게 선배의 집일 터이니 우선은 그쪽으로 먼저 찾아가도록 하지요!"
51060-303 = "자, 이쪽이와요!"
51060-305 = "백귀야행의 주택가"
51060-308 = "자자, 이곳 대로를 쭉 올라가서 왼쪽으로 꺾으면 바로 렌게 선배의 집이 있을 것이어요!"
51060-311 = "이곳이어요. 이곳이 렌게 선배의 자택……."
51060-312 = "자, 그럼 바로 문을 두드리고……"
51060-317 = "실례합니다. 렌게 선배! 유카리가 찾아왔사와요!"
51060-321 = "[ns] \"…………반응이 없는걸.\""
51060-322 = "어, 어라……? 그, 그럴 리가……."
51060-329 = "[ns] \"잠깐, 유카리. 문 앞에 뭔가 쪽지 같은 게 붙어 있는데?\""
51060-330 = "쪽지……말이어요?"
51060-334 = "이건 어디 내용이……."
51060-335 = "흐음. 흐음. 흠흠."
51060-340 = "……………………네?"
51060-341 = "[s] \"뭐라고 적혀 있길래 그래?\""
51060-342 = "저…… 그게, 그러니까……."
51060-349 = "(유카리가 당혹스러운 표정으로 건네준 쪽지에는 이런 내용이 적혀 있었다.)"
51060-352 = "<만약 볼 일이 있어 내게 찾아온 녀석이 있다면.>"
51060-353 = "<이대로 나를 찾는 건 포기해.>"
51060-357 = "[log=렌게 실루엣]<나는 나만의 청춘을 되찾기 위해 여행을 떠날 테니까!>[/log]"
51060-361 = "[ns] \"………………청춘?\""
51060-363 = "다음화;청춘(?)에 매진하는 소녀 1"
