[translation]
1006405-1 = "감주와 고양이"
1006405-2 = "(다음 날 아침, 사찰의 경내에서 카요코를 기다리고 있노라니……)"
1006405-3 = "어라, 선생. 먼저 와서 밖에서 기다리고 있었던 거야?"
1006405-4 = "오늘은 날씨도 쌀쌀한데 실내에서 기다리지 않고……"
1006405-5 = "[s] \"괜찮아. 오래 기다리지도 않았거든.\""
1006405-10 = "하지만 이렇게나 손이 차가운데……"
1006405-11 = "빨리 들어가서 몸을 덥혀야겠어."
1006405-12 = "뭔가 이 근처에서 따듯한 음료를 팔고 있지 않으려나."
1006405-13 = "달콤한 감주 한 잔, 어떠신가요?"
1006405-14 = "방금 막 끓여서 따끈따끈하니 식기 전에 한 잔씩 받아 가세요~"
1006405-15 = "신년이라서 그런지 경내에서 감주를 나누어 주고 있네."
1006405-16 = "선생, 부적을 사러 가기 전에 먼저 감주로 몸을 데우는 건 어때?"
1006405-17 = "[s] \"좋아.\""
1006405-18 = "여기. 감주 두 잔 부탁할게."
1006405-22 = "[ns1] \"하아, 따듯해……\"\n[ns2] \"몸속까지 따듯해지는 것 같아……\""
1006405-23 = "후후, 그리운 맛이네."
1006405-24 = "후후, 그리운 맛이네."
1006405-25 = "그러고 보면 이렇게 걱정 없이 감주를 마시러 온 건 처음인 것 같아."
1006405-26 = "[s] \"예전에 무슨 일이라도 있었어?\""
1006405-27 = "그게, 감주도 일단은 발효 음료니까. 미량이지만 알코올 성분이 섞여 있잖아?"
1006405-28 = "때문에 술이 약한 학생들이 가끔씩 감주를 마시고 엉망진창으로 취해서 난리를 부리는 경우가 종종 있었거든."
1006405-29 = "그래서 매년 감주를 마실 때는 주변에 취하는 학생이 없는지 걱정하느라 맛을 제대로 즐기지 못했었는데……"
1006405-30 = "선생과 함께라면 그런 걱정을 할 필요는 없겠지. 어른이니까."
1006405-31 = "[s] \"카요코는 감주 때문에 취한 적은 없었어?\""
1006405-32 = "그야 당연하지. 거의 음료수나 다름없는 이런 음료로 취할 리가 없잖아?"
1006405-33 = "뭐, 물론 여러 잔을 연달아 마시면 어떻게 될지는 모르겠지만……"
1006405-34 = "달고 맛있는 감주이긴 하지만, 나는 이미 이 한 잔으로 충분히 몸을 덥혔으니까."
1006405-35 = "자, 그럼 몸도 덥혔으니 슬슬……"
1006405-39 = "아……"
1006405-40 = "선생. 미안하지만 잠시 여기서 기다려 줄 수 있을까?"
1006405-41 = "잠깐 신경 쓰이는 게 있어서……"
1006405-42 = "[s] \"응, 편하게 다녀와.\""
1006405-43 = "그럼, 잠깐 실례할게."
1006405-48 = "(하지만 10분이 넘도록 카요코는 돌아오지 않았다……)"
1006405-50 = "[ns] 카요코가 향한 곳으로 따라간다."
1006405-53 = "옳지, 옳지. 그래. 착한 아이구나? 후후……"
1006405-54 = "이곳 경내에서 사는 아이니? 사람의 손에 꽤나 익숙한 것 같네."
1006405-58 = "그래. 냥, 냥~ 귀여운 목소리로 우는구나."
1006405-62 = "냥냥~ 냥냥~ 폭신폭신, 냥냥~ ♪"
1006405-63 = "[s3] \"뭔가 즐거워 보이네.\"\n[s4] \"고양이들과 놀아주고 있었던 거야?\""
1006405-64 = "서, 선생……?! 어느 틈에 여기에……?"
1006405-65 = "서, 선생……?! 어느 틈에 여기에……?"
1006405-66 = "돌아오지 않아서 걱정되어 찾아왔다고……? 미, 미안…… 고양이들과 놀아주다 보니 정신이 팔려서……"
1006405-67 = "그보다…… 음…… 그게……"
1006405-68 = "…………봤어?"
1006405-69 = "[s] \"………응.\""
1006405-70 = "그러니까 그렇게 귀여운 목소리를 흉내 낸 건 본의가 아니라……"
1006405-71 = "아니, 본의이긴 하지만…… 아무도 보지 않을 거라고 생각해서……"
1006405-75 = "……감주 탓이야."
1006405-76 = "아까 마신 감주 때문에…… 취해서 판단력이 흐려진 게 분명해……"
1006405-77 = "다음부터 감주는 절대로 마시지 않을 테니까……!"
1006405-79 = "(……이후, 부끄러워하는 카요코를 달래준 뒤 부적을 사러 갔다.)"
