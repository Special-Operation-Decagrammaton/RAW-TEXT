[translation]
10034130-1 = "5일 전: 데덴찌"
10034130-3 = "음……. 제대로 치고 있는 건지 알 수가 없네. 묘하게 어긋나는 것 같기도 하고."
10034130-4 = "소리로 어느 정도 맞추긴 하지만, 어쩌면 자세 같은 게 틀리고 있을지도……."
10034130-6 = "일단은 조를 나눠서, 서로 자세나 움직임을 좀 봐주는 건 어때."
10034130-7 = "자기가 자기를 보는 건 어렵잖아. 거울로 본다 해도 칠 때는 집중할 테니 여유가 없고."
10034130-8 = "웬일로 그럴싸한 말을 하네, 그럼 일단 팀 나누는 건 데덴찌로 할까?"
10034130-14 = "……?"
10034130-15 = "데덴……찌……?"
10034130-16 = "데덴찌……?"
10034130-20 = "……아."
10034130-24 = "……풉."
10034130-25 = "풉……푸학! 푸핫……! 데덴……큽……! 데덴찤……! 크학!!"
10034130-27 = "……저렇게 웃는 거 처음 보는데."
10034130-28 = "나도……."
10034130-30 = "아윽……!!"
10034130-31 = "하아, 하아…… 하아…… 아 숨쉬기 힘들어……. 하아, 하아……. 미안, 미안."
10034130-32 = "세상에 데덴찌라니, 지금이 몇 년도지? 상상도 못 한 발상이잖아. 진심으로 감탄했다, 야."
10034130-33 = "아……아으……아으윽……!!"
10034130-34 = "나, 나는 귀엽다고 생각하니까! 요시미 쨩의 아이디어……!"
10034130-35 = "자, 그럼 진행하자. \"21세기의 데덴찌\"."
10034130-36 = "크아아악……!!"
10034130-38 = "자~! 데덴찌 간다, 데덴찌! 덴덴덴덴……."
10034130-39 = "아아아아아아아아아-!!!"
10034130-41 = "데덴~찌!!"
