[translation]
2000106-1 = "나와 선생님의 관계?"
2000106-2 = "밀레니엄 옥상"
2000106-4 = "후우……"
2000106-6 = "아. 선생님 왔어?"
2000106-7 = "무슨 일이냐고? 으음. 어떻게 말해야 할까."
2000106-8 = "실은 친구와 다퉜다."
2000106-9 = "[s1] \"친구는 지금 어느 병원에 있어?\"\n[s2] \"…………대체 무슨 일이야.\""
2000106-10 = "……부실에 잘 있어."
2000106-11 = "사소한 말다툼이랄까."
2000106-12 = "오해 하지 마. 서로 드잡이질을 한 건 아니니까."
2000106-13 = "보통 우린 점심을 밖에서 사온 뒤, 부실에서 함께 먹는 편이었어."
2000106-14 = "근데 나는…… 좀 부끄럽지만, 최근 다이어트에 신경 쓰고 있거든."
2000106-15 = "얼마전 메이드복을 벗고 간만에 교복을 입었는데 여기저기가 꽉 끼더라고……"
2000106-16 = "반대로 친구는 다이어트에 별로 관심이 없고"
2000106-17 = "느닷없이 피자를 먹자고 하더라고."
2000106-18 = "거기에 디저트로 초코케이크까지 사오자는 거야."
2000106-19 = "딱히 음식을 가리는 건 아니니 친구의 말대로 해주는 경우가 많았지만"
2000106-20 = "오늘의 나는 속도 안 좋고 샐러드가 먹고 싶었어……"
2000106-21 = "[s] \"따로 먹으면 되잖아.\""
2000106-22 = "말도 안 되는 소리 하지 마. 선생님."
2000106-23 = "여자애들끼리 밥을 따로 먹는다는 건 '내 편이 아니다'라는 증거나 다름없어."
2000106-24 = "[s3] \"아니…… 그 정도는…… 좀.\"\n[s4] \"그게 싸울만한 일인가?\""
2000106-25 = "그래. 나도 알아."
2000106-26 = "그래. 나도 알아."
2000106-27 = "이렇게 서로 간에 의견 차이는, 서로에 대한 존중만으로 해결할 수 있겠지."
2000106-28 = "하지만 나는 지금까지 대부분 친구의 요구나 바람에 맞춰줬고"
2000106-29 = "그럼 가끔은 내 말을 들어줄 수도 있는 거잖아?"
2000106-30 = "그게 공평한 거 아니야?"
2000106-31 = "[s5] \"친구 사이에 필요한 건 공평이 아니야.\"\n[s6] \"네 말이 맞아. 친구가 잘못했어.\"\n[s7] \"네 말은 틀려. 카린 네가 잘못한 거야……\""
2000106-32 = "……"
2000106-33 = "후."
2000106-34 = "후후."
2000106-35 = "맞는 말이야."
2000106-36 = "조금 낡은 말이지만, 맞는 말이지. 이해했다."
2000106-37 = "그래. 친구 사이에 필요한 건 우정이니까."
2000106-38 = "……"
2000106-39 = "후우."
2000106-40 = "선생님, 위로해 주려고 마음에도 없는 말을 해줘서 고마워."
2000106-41 = "그렇게 말해주니, 나도 잘못한 것이 있다고 생각이 들어."
2000106-42 = "함께 먹는다는 사실이 중요한 거지, 무엇을 먹느냐가 중요한지는 다른 문제니까."
2000106-43 = "……"
2000106-44 = "그럴까."
2000106-45 = "선생님, 진실하게 말해줘서 고마워."
2000106-46 = "그래. 때로는 마음에도 없는 위로보다……"
2000106-47 = "나를 한 걸음 더 성장시키는 건, 선생님다운 그런 모습일지도 모르겠군."
2000106-48 = "역시…… 이렇게 고민을 함께 이야기 할 수 있는 사람이 있다는 건 기쁜 일인가 보다."
2000106-49 = "친구에게 사과해야겠지."
2000106-50 = "고마워 선생님. 덕분에 머리와 마음이 가벼워졌어."
2000106-51 = "피자라도 사서 돌아가야지. 아 그래. 초콜릿 케이크도."
2000106-52 = "그리고……"
2000106-53 = "아무리 생각해도, 선생님이랑은 친구가 될 수 없을 것 같군……"
2000106-54 = "이, 이상한 말 아니니까 오해하지 마!"
2000106-55 = "에, 그러니까 친구가 아니라……."
2000106-56 = "주인님이잖아……?"
2000106-57 = "후훗. 농담이다."
2000106-58 = "고마워 선생님. 그럼 먼저 실례할게."
2000106-61 = "……나중에 봐."
