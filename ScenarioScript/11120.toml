[translation]
11120-2 = "제12화;블랙마켓으로 2"
11120-3 = "유흥가"
11120-4 = "……이 정도면 따돌린 것 같아요."
11120-5 = "음……. #n여기를 꽤 위험한 곳으로 평가하나 보네."
11120-6 = "네? 다, 당연하죠. #n총학생회의 통제가 닿지 않는 곳 중에 하나니까요……."
11120-7 = "블랙 마켓의 규모만 해도 학원 몇 개 급으로, 절대 무시할 수 있는 수준이 아니고……."
11120-8 = "특히 다양한 <기업>들이 이곳에서 불법적인 일들로 이권 다툼을 벌이고 있는 걸로 알고 있어요."
11120-9 = "심지어 블랙 마켓에서만 통용되는 은행과 치안 기관이 있을 정도니……."
11120-10 = "은행이랑 경찰……?! #n그, 그거 당연히 허락되지 않은 불법 단체지?!"
11120-11 = "네……. 그렇죠."
11120-12 = " 스케일이 장난 아니네요……."
11120-13 = "특히 그 중에서도 치안 기관은 무조건 피하는 게 상책이라…… #n소란을 피우면 일단 몸을 숨겨야 해요……."
11120-14 = "흐음~ 히후미 쨩은 생각보다 여기 많이 알고 있네?"
11120-15 = "어? 그런가요? 위험한 곳이라 준비를 많이 해 왔다고 생각했지만……."
11120-16 = "좋아, 결정~"
11120-17 = "……?"
11120-18 = "우리가 히후미 쨩을 구해줬으니까, 우리가 여기서 원하는 걸 구할 때까지 함께 하는 걸로~♪"
11120-19 = "어? 네?"
11120-20 = "와아-☆ 좋은 아이디어예요!"
11120-21 = "그렇군. 납치인가."
11120-22 = "네?!"
11120-23 = "납치가 아니라 안내를 해달라는 거잖아. #n저기, 히후미 씨가 괜찮다면 말이지."
11120-24 = "아, 아우우……. 제가 도움이 될 진 모르겠지만……. #n아비도스 여러분들께 신세진 것도 있으니 당연히 괜찮아요."
11120-25 = "좋아, 그럼 잠깐이지만 우리랑 동행이야."
11120-27 = "(따르르르르릉---)"
11120-29 = "(따르르르르르르르릉----------)"
11120-31 = "뭐해, 아루 쨩. 전화 안 받아?"
11120-32 = "……."
11120-33 = "표정이 어두운데……. 설마 클라이언트인가……."
11120-34 = "우와, 엄청 부담되겠다. 실패를 보고해야 하잖아."
11120-35 = "아루 님……."
11120-36 = "……크윽."
11120-38 = "(철컥)"
11120-39 = "네…… 흥신소입니다."
11120-42 = "……."
11120-43 = "흠. 이건 흥미롭군."
11120-44 = "연습은 잘 봤다. #n그래서, 실전은 언제 시작할 예정이지?"
11120-47 = "……으, 으어? 그게 실전이었는데……."
11120-48 = "아, 아뇨. 아무 것도 아닙니다. 무, 물론 실전은 곧…… 이라는 느낌으로……#n아, 아니 일주일 내에…… 넵."
11120-49 = "!?"
11120-50 = "!!"
11120-51 = "후후후. 네. 그렇습니다. #n……맡겨주십시오."
11120-53 = "(철컥)"
11120-54 = "저 녀석들의 데이터 자체는 틀린 것이 없었을 텐데."
11120-55 = "계산이 잘못됐나? 허나 그 힘은 분명……."
11120-56 = "……. 곤란해보이시는군요."
11120-57 = "……."
11120-58 = "아니, 곤란한 건 아니다. 그저 계산에 조금 오류가 났을 뿐. #n아비도스 녀석들이 데이터보다 훨씬 더 강했던 것뿐이지."
11120-59 = "……"
11120-60 = "……데이터에 하자는 없습니다."
11120-61 = "……?"
11120-62 = "이건 그냥 아비도스의 학생들이 더 강해져버렸다, 라고 해석해야겠죠."
11120-63 = "무슨 소릴……."
11120-64 = "저 아비도스에 어떤 변수가 생겼는지 확인해봐야겠군요."
11120-65 = "실례."
11120-68 = "……."
11120-70 = "(철컥)"
11120-71 = "……하아."
11120-72 = "헬쑥해졌어, 아루 쨩."
11120-73 = "무슨 소리를 한 거야, 사장……. 설마 또 싸우겠다는 거야?"
11120-74 = "……저 클라이언트는 나도 자세히는 모르지만 엄청 거물이란 말야. #n……이 의뢰를 실패할 순 없어."
11120-75 = "……."
11120-76 = "그치만 아비도스 녀석들 생각보다 강했단 말야. #n게다가 그 <샬레>가 함께 있으니 우리들만으로는 무리야."
11120-77 = "그리고 이미 전재산을 다 써버렸잖아. 뭘로 싸우게?"
11120-78 = "제, 제가 용역 알바라도 뛰고 올까요?"
11120-79 = "그 일당으로 용역을 구하려면 우리 모두 1년은 일해야 해……."
11120-80 = "괜히 이런 비싼 사무실을 임대해서 쓸데없는 돈이 나가고 있잖아……."
11120-81 = "시, 시끄러! 제대로 된 사업체라면 사무실은 기본으로 있어야지! #n그래야 의뢰도 잘 들어온단 말야!"
11120-82 = "맞아. 난 저번처럼 공원에 텐트치고 지내도 상관없는데-?"
11120-83 = "시끄러! 모두 시끄러!! 조용히 해!"
11120-84 = "……."
11120-85 = "……대출을 받는다."
11120-86 = "뭐? 아루 쨩 신용불량이잖아."
11120-87 = "아냐!! 현상수배 때문에 계좌가 동결된 거 뿐이라고!"
11120-88 = "그랬던가? #n……아, 맞아. 선도부 녀석들이 그랬었지."
11120-89 = "젠장, 선도부 녀석들…… 설마 이렇게까지 지독하게 괴롭힐 줄은."
11120-90 = "중앙 은행도 가봤자 문전박대일 걸."
11120-91 = "시끄러!! 다 방법이 있다고!"
11120-92 = "……."
11120-93 = "두고보자, 아비도스 녀석들. 이걸로 끝나지 않을 거라고 내가 얘기했었지?"
11120-94 = "흥신소의 임무는 이제부터라고."
11120-96 = "……."
11120-97 = "헤에. 무슨 속셈이지."
11120-99 = "다음화;출동! 수영복 복면단 1"
