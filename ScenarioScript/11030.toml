[translation]
11030-1 = "제3화;어른의 힘, 굉장해!"
11030-2 = "아비도스 폐교대책위원회 부실"
11030-3 = "이야~ 설마 이기다니. 헬멧단 녀석들이 꽤 작정하고 몰려왔는데 말이지."
11030-4 = "설마 이기다니, 가 아니잖아요. 호시노 선배……. #n이기지 않으면 학교가 불량배들 소굴이 되어버리잖아요……."
11030-5 = "선생님의 지휘가 빛을 발했어. 우리끼리 싸울 때와는 전혀 다른 결과야."
11030-6 = "이것이 어른의 힘인가……. #n가공할 자원과 장비, 지원까지. 어른이란 굉장하네."
11030-7 = "그동안 외로웠구나, 시로코 쨩. #n이제 집나간 아빠가 돌아왔으니 이 엄마는 이제 마음껏 잠 잘 수 있겠어."
11030-8 = "아니, 멀쩡한 선생님을 이상하게 만들지 말라고! 불쌍하잖아! #n그리고 부장은 원래 마음껏 자러 다녔잖아!"
11030-9 = "불쌍해요, 불쌍해요."
11030-10 = " 아하하…… 어쩐지 늦었지만 다시 인사드릴게요, 선생님."
11030-11 = "저희가 바로 아비도스 대책위원회입니다."
11030-12 = "저는 위원회의 서기와 오퍼레이트를 맡고있는 1학년 아야네……."
11030-13 = "마찬가지로 1학년 세리카이고,"
11030-14 = "안녕."
11030-15 = "2학년 노노미 선배, 시로코 선배."
11030-16 = "안녕하세요, 선생님~"
11030-17 = "내가 제일 먼저 만났었지."
11030-18 = "……아니. 특별함을 과시하려는 의도는 아니지만."
11030-19 = "그리고 위원회 부장이자"
11030-20 = "3학년인 호시노 선배."
11030-21 = "이야~ 반가워, 선생."
11030-22 = "보시다시피 저희 학교는 지금 위기 상황이라……. #n<샬레>에 지원을 요청했었고, 선생님이 와주셔서 위기를 넘길 수 있었어요."
11030-23 = "선생님이 없었다면 저런 불량배들에게 학교를 뺏길 뻔했어요. #n정말 뭐라고 감사를 드려야 할지……."
11030-24 = "[s] 대책위원회가 뭔지 묻는다."
11030-25 = "네. 설명드리겠습니다. 대책위원회는…… 아비도스 학교를 되살리기 위해 모인 동아리입니다."
11030-26 = "응응! 전교생이 모여 있는 교내 유일한 동아리예요!! #n전교생이라고 해 봤자 저희 5명이 전부지만."
11030-27 = "다른 학생들은 전학가버렸거나, 학교를 그만두고 마을을 떠나버렸어."
11030-28 = "학교가 이 모양이니 학원도시의 시민들도 거의 대부분 떠나버렸고, #n카타카타 헬멧단 같은 3류 불량배들이 학교를 습격하는 지경에 이르렀지."
11030-29 = "우리로는 학교를 지키기 벅찬 상태야. 학생으로서 부끄러운 일이지……."
11030-30 = "<샬레>에서 지원이 나오지 않았다면…… 이번엔 진짜 큰일날 뻔했어요."
11030-31 = "맞아. 보급도 다 떨어져서 이제 망했다 싶었는데 딱 좋은 타이밍에 나타나줬어, 선생."
11030-32 = "응응! 이제 헬멧단에 신경을 안써도 되잖아요. 어른의 힘 굉장해-☆"
11030-33 = "하지만 저 녀석들은 또 공격해 올거야."
11030-34 = "아아. 그건 그래. 끈질긴 놈들이니까……."
11030-35 = "언제까지 이런 소모적인 전투를 계속해야 하는지…… #n신경써야 할 건 헬멧단 말고도 많은데……."
11030-38 = "그러니까 말이지. 나한테 계획이 있어."
11030-39 = "뭐?! 호시노 선배한테 계획이?!"
11030-40 = "거짓말……?!"
11030-41 = "이야~ 그런 반응은 아무리 나라도 상처받는다고. 가끔이지만 나도 할 땐 한다고."
11030-42 = "……그래서, 계획이 뭐야?"
11030-43 = "헬멧단 녀석들은 며칠 뒤면 다시 우리를 습격할 거란 말이지. #n끝없이 반복되고 있는 상황이니까."
11030-45 = "이런 타이밍에 헬멧단 녀석들의 전초기지를 습격해서 부숴버리는 거야. #n병력이 제일 취약한 타이밍이 막 후퇴한 바로 지금이거든."
11030-46 = "지, 지금요?"
11030-47 = "그래. 모처럼 선생이 있으니 보급이나 다른 귀찮은 부분이 해결되거든."
11030-48 = "그렇네. 헬멧단의 전초기지라면 여기서 30km 안에 있고, 지금 당장 출발한다고 해도 문제는 없을 거고."
11030-49 = "좋은 생각 같아요. 설마 지금 우리가 역습을 감행할 거라고는 생각도 못했을 거고."
11030-50 = "그, 그건 그렇지만……. 선생님의 의견은 어떠신가요?"
11030-51 = "[s] 동의한다."
11030-54 = "좋아, 선생님도 찬성했으니 기세를 몰아 달려가자고."
11030-55 = "쇠뿔도 단김에 뽑아야지."
11030-56 = "네~ 그럼 출발!"
11030-58 = "카타카타 헬멧단의 아지트로 알려져 있는 지구에 진입했습니다."
11030-59 = "반경 15km 내에 카타카타 헬멧단의 신호가 다수 감지됩니다."
11030-60 = "적들도 아마 우리가 왔다는 걸 눈치챘을 거예요. #n여기서부터는 실력행사입니다!"
