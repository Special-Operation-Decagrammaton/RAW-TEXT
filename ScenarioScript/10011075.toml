[translation]
10011075-7 = "응! 깔끔하게 통과야! 축하해!"
10011075-8 = "하아하아…… 끄, 끝난 건가아아……"
10011075-9 = "으음. 그럼 지금 결과를 보고하고 와야지. 잠깐- 다녀올게-!"
10011075-13 = "[ns] \"이것으로 일단락, 이려나?\""
10011075-15 = "여, 여러부우운~! 괘, 괜찮으신가요?!"
10011075-16 = "아앗! 주군! 그리고 부장! 무사하신가요?!"
10011075-17 = "츠쿠요, 이즈나……!"
10011075-18 = "가, 갑자기 두 분이 안으로 사라지셔서…… 그 뒤를 이즈나 쨩이랑 어떻게든 쫓으려고 하다가…… 그게……."
10011075-19 = "저 이즈나! 잔뜩 헤매다가, 이대로 영영 못 나가는 줄 알았는데……! 그때! 츠쿠요 공이 해결법을 알아낸 거 있죠!"
10011075-20 = "부, 부장님이 빌려주셨던 만화책에서…… 봤던 저택인 게 떠, 떠올라서……."
10011075-21 = "미리 부장님의 추천으로 보길, 자, 잘했네요! 에헤헷!"
10011075-22 = "아…… 응, 그, 그래?"
10011075-23 = "[s] \"그나저나 이로하는……?\""
10011075-25 = "아! 맞다. 이로하 공은 분명 중간까지 함께 오고 있었는데……"
10011075-26 = "어느 순간 갑자기 보이질 않으셔서, 일단 저희끼리라도 먼저, 나, 나오게 되었는데……."
10011075-27 = "여, 역시 돌아가서 다, 다시 찾아볼, 까요?"
10011075-28 = "……아니, 역시 지금은 그럴 시간이 없을 거 같아."
10011075-32 = "저기, 츠쿠요, 이즈나. 나 두 사람에게 말해둘 게 있는데……"
10011075-34 = "네, 네엣……?"
10011075-41 = "[ns] \"응? 이건……\""
10011075-42 = "후우, 다행히 일이 더 커지기 전에 늦지 않게 따라잡을 수 있었군요."
10011075-43 = "[s] \"카호?\""
10011075-44 = "독단으로 일을 진행한 것에 대해 한 소리 하고 싶은 것도 있습니다만."
10011075-45 = "우선 여러분의 추격전…… 아니, 공연 진행은 여기서 멈춰 주시길 바랍니다."
