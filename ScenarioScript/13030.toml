[translation]
13030-1 = "제3화;하이랜더 철도 학원"
13030-2 = "파햐햐하핫-! 좋은데?"
13030-3 = "시끄러-워-"
13030-4 = "아니아니, 시원시원해서 좋은 쪽이지. 상태는 어때?"
13030-5 = "네, 철로를 막고 있던 바위는 발파 완료했습니다. 파묻혀 있던 협궤 노선도 찾았구요! 사업서에 나와 있는 대로예요!"
13030-6 = "그럼 시범 운행 해볼까요? 기차도 수리를 막 끝낸 참입니다! 이제 바로 달릴 수 있어요~!"
13030-7 = "좋아, 공사는 빠를수록 좋지. 시험 운행 해보자고. 저쪽에 망실된 노선까지 쭉 이어나가는 거야~"
13030-8 = "넵~ 맡겨주십시오."
13030-14 = "우오- 움직인다-"
13030-15 = "파햐햐햐핫- 좋아, 이걸로 납기일을 일주일은 당길 수 있겠어!"
13030-16 = "그, 그런데 CCC 간부님들…… 이, 이거 괜찮은 건가요?"
13030-17 = "응?"
13030-18 = "뭐-가아-?"
13030-20 = "여, 여기는…… 다른 자치구잖아요……?"
13030-22 = "그렇지?"
13030-23 = "그런-데-?"
13030-25 = "네?! 그런 데가 아니잖아요……?"
13030-26 = "여기 자치구가 어딘지는 모르겠지만…… 허락을 받지도 않고 이렇게 공사를 시작하면 사유재산 침해라던가, 무단 침입이라던가……"
13030-27 = "이, 이대로라면 자치구와 무력 충돌이 벌어질지도……."
13030-28 = "아아- 그건- 괜찮을-지도-?"
13030-29 = "파햐핫- 맞아, 그 부분은 걱정하지 마. 이제 이 <사막횡단철도>는 우리 소유가 되었으니까."
13030-30 = "네?!"
13030-31 = "응- 제대로 확인했어- 아비도스 사막횡단철도 DLB 채권의 51% 이상 확보-"
13030-32 = "이제 이 철도는 우리 CCC의 소유라는 거지. 뭐어, 정확히는 조금 다른가? 여하튼 그러니까 괜찮아."
13030-33 = "그, 그래도 공사를 하려면 양해 각서라던가 시공 협약서라던가 그런 게 선행되어야……."
13030-34 = "갸아아-! 귀찮다고, 그런 거!!"
13030-35 = "그런 걸 일일이 챙기면 공사 납기를 맞출 수 없단 말이야? 우리 같은 사람에겐 시간이 곧 돈이라고."
13030-37 = "응- 공사는 빨리빨리- 행정은 적당히- 그게 우리 모토야-"
13030-38 = "엄청 문제가 많은 발언으로 들리지만, CCC에서 그렇게 판단하셨다면…… 문제는 없다고 이해하겠습니다."
13030-39 = "어, 없는 거 맞죠……?"
13030-40 = "아마도-?"
13030-41 = "없어, 없어. 햐햐햣-!"
13030-42 = "뭐야, 너희들은!!"
13030-50 = "앗- 들켰다-"
13030-51 = "빠르네~"
13030-53 = "있잖아요!! 문제……!!"
13030-54 = "지금 뭐 하고 있는 거죠? 이곳은 아비도스 자치구입니다! <하이랜더 철도 학원> 여러분!"
13030-56 = "흐응~"
13030-58 = "저희 대책위원회의 허락 없이는 아비도스 자치구에서 어떤 행정 활동도 불가능해요! 그 정도는 상식이라고요!"
13030-59 = "그런 걸 모르는 건 게헨나 정도라고 생각했는데…… 어째서 이렇게나 상식을 모르는 학원이 많은 거죠, 이 키보토스에는……!"
13030-60 = "상식이 통하는 사회는 대체 어디에 있는 거예요?!!"
13030-61 = "지, 진정해. 아야네 쨩……."
13030-63 = "어- 쟤 화났나- 봐-"
13030-64 = "그러게……."
13030-65 = "[s] \"하이랜더 학원이 여기서 무슨 볼일이 있는 거야?\""
13030-66 = "……. 누구?"
13030-67 = "어른……?"
13030-68 = "저, 저분은 서, 선생님이에요! 샬레의 선생님!"
13030-69 = "선-생-?"
13030-70 = "샬레?"
13030-71 = "드, 들은 적 있어요!! 학원들끼리 분쟁이 생기거나 뭔가 문제가 생기면 해결한다는 명목으로 파괴를 일삼고 다니는 사람이에요!!"
13030-72 = "[s] \"………….\""
13030-73 = "저번엔 저희 학원의 열차 하나를 통째로 날려버리기도 했다고도 들었어요! 어쨌든 무서운 사람이라구요!"
13030-74 = "온갖 무시무시한 소문을 몰고 다니는 어른이라고요! 저번에는 알몸으로……."
13030-75 = "[s1] \"아니, 그 정도는 아니라고 생각하는데…….\"\n[s2] \"악의적인 소문입니다…… 네.\""
13030-78 = "……무슨 일들을 저지르고 다닌 거야, 선생은."
13030-79 = "응. 과연 선생님."
13030-80 = "선배는 자랑스럽다는 듯이 끄덕이지 마……."
13030-85 = "이유야 어쨌든, 이곳은 저희의 자치구예요. 지금 하고 있는 일을 당장 그만둬주세요!"
13030-86 = "만약 담보의 소유권을 주장하더라도, 먼저 저희와 협의를 하는 것이 순서라고요!"
13030-88 = "어쩌-지-? 노조미?"
13030-89 = "어쩌긴. 늘 하던 대로 해야지. 히카리."
13030-94 = "……네? 지금 뭘……?"
13030-99 = "우, 우왓-?! 위험하잖아!"
13030-101 = "늘 하던 대로 대충대충 무마하고 나중에 사무관들한테 뒤처리를 부탁하는 거지-! 퍄햐햐햐햐하---!"
13030-102 = "굿- 아이디어-"
13030-106 = "이건…… 사막횡단철도……?! 움직이고 있어요……?"
13030-107 = "하이랜더학원, 기차에 탑승했습니다! 도망칠 생각인 것 같아요!"
13030-108 = "어쩌지, 선배들?"
13030-109 = "쫓는다."
13030-110 = "과연, 기차를 고치고 있었던 건가. 이유는 나중에 들으면 돼. 쫓아야지."
13030-111 = "네…… 이런 식으로 멋대로 아비도스에서 일을 벌이는 걸 보고만 있으면 안돼요. 그 이유와 목적…… 제대로 설명을 듣지 않으면 안 돼요!"
13030-113 = "네! 선생님! 지휘를 부탁드립니다!"
13030-114 = "[s3] \"뭐, 이렇게 될 것 같았어…….\"\n[s4] \"가자, 대책위원회!\""
