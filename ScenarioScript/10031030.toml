[translation]
10031030-1 = "제3화;의장님의 요구"
10031030-14 = "으으으음! 역시 안되네! 선도부원만으로도 엄청나게 빡센데! 여전히 무진장 강해! 히나 선도부장!"
10031030-15 = "(부들부들부들부들………)"
10031030-22 = "어, 어쩌지! 반장!"
10031030-23 = "으음~ 부장은 부장대로 큰일 난 모양이고, 이럴 때 뭘 하면 좋을지 말해줄 사람도 없으니……."
10031030-24 = "응! 다들 후퇴야~! 이대로 줄행랑이다앗~!"
10031030-25 = "모두 만남은 30분 뒤! 온천개발부의 아지트에서!"
10031030-32 = "……! 아코, 쫓을 거야."
10031030-36 = "네! 부장ㄴ……!"
10031030-38 = "잠까아아아아아안!!"
10031030-40 = "뭐, 뭔가요?! 마코토 의장!"
10031030-42 = "가기 전에 주변을 둘러보아라! 너희들이 무슨 짓을 저질렀는지……!"
10031030-53 = "[ns] \"의사당 내부가, 조금 전 일로 무너진 모양이야…….\""
10031030-56 = "그래서요?"
10031030-57 = "그래서요…… 라니!"
10031030-58 = "이게 다 너희, 선도부가 날뛴 탓에 준공식을 하기도 전에 전부 무너져 버린 거잖나!"
10031030-59 = "이를 어떻게 책임질 거냐!"
10031030-60 = "무슨 소린가요? 책임 전가도 정도가 있다구요?!"
10031030-61 = "애당초 전부 당신이 온천개발부에 온천 개발을 발주한다는…… 지금 다시 봐도 이해가 안 가는 일을 저질러서 그런 거잖아요?"
10031030-62 = "그래서 뭐?"
10031030-63 = "네……?"
10031030-64 = "그건 이미 지나간 일이다!"
10031030-65 = "[s] \"……우와아.\""
10031030-66 = "어쨌거나 선도부가 날뛴 덕분에, 여기 샬레의 선생이 자리를 빛내줄 예정이었던 준공식 자체가 무산이 된 참이다!"
10031030-71 = "그러니 뭐가 됐든 간에 책임을 져 줘야겠어……! 선도부……"
10031030-72 = "아니! 선도부장! 소라사키 히나!"
10031030-73 = "너도 한 조직의 리더라면…… 이 책임을 모른 척하지는 않겠지!"
10031030-74 = "아뇨……! 부장님! 저런 헛소리 따윈 들을 필요 없어요!"
10031030-75 = "[s] \"마코토, 아무리 그래도 역시 그건 좀………\""
10031030-78 = "……좋아. 그래서 뭘 어떻게 해줬으면 좋겠는데?"
10031030-79 = "부장님?!"
10031030-83 = "[ns] \"히나……?\""
10031030-84 = "……어? 그렇게 쉽게……?"
10031030-85 = "물론 내가 원해서 행사를 방해한 건 아니지만, 실제로 우리 선도부의 작전 활동으로 인해 피해가 생긴 건 사실이니까."
10031030-86 = "더군다나 그것이 선생님의 업무까지 방해하게 된 것이라면…… 나름의 책임감도 느끼고 있어."
10031030-87 = "그러니 좋아. 마코토 의장. 내가 뭘 하면 되겠어?"
10031030-88 = "으, 으으음. 그건……."
10031030-90 = "(히나 녀석…… 평소와 다르게 고분고분히 이쪽의 요구를 수용하다니…… 왜 그런지 이유는 모르겠지만……!)"
10031030-91 = "(그래도 이건 좋은 기회다……! 이 몸과 선도부의 상하관계를 보여줄 기회!)"
10031030-92 = "(이 기회를 어떻게 활용해야…… 선도부의 코를 납작하게 만들고, 이 마코토 님의 위엄을 바로 세울 수 있을 것인가……!)"
10031030-93 = "(그러고 보니 이번 게헨나 파티에서 메인이 되는 이벤트는 분명 피아노 연주──였을 터.)"
10031030-94 = "(키키킷! 그렇다면…………!)"
10031030-96 = "크큭…… 크크크큭……… 크크크크큭!!!!"
10031030-97 = "[s] \"뭔가, 지금의 마코토…… 속으로 엄청난 음모를 꾸미는 느낌인데.\""
10031030-99 = "부, 부장님! 그런 약속을 함부로 했다간 큰일이 날지도 모른다구요?!"
10031030-100 = "아니. 아코. 이미 결정한 일이야."
10031030-101 = "하, 하지만……!"
10031030-107 = "……선생님에게 폐를 끼치긴 싫으니까."
10031030-108 = "[s] \"히, 히나……!\""
10031030-109 = "으읏……!"
10031030-110 = "크크크큭! 결정했다!"
10031030-111 = "당신…… 얼토당토않은 걸 이야기했다간……!"
10031030-112 = "아아, 그거라면 걱정할 필요 없다. 이 몸도 바보는 아니야. 제안도 어디까지나 현실적인 요구를 할 뿐이니까."
10031030-113 = "현실적인 요구?"
10031030-114 = "그렇다. 소라사키 히나…… 너는 이번 기회에 이 마코토 님이 준비한 게헨나 파티의 준비를 돕도록 하여라!"
10031030-115 = "역시나 당신들. 게헨나 파티를 준비하고 있단 건 들었지만."
10031030-116 = "히나 부장님까지 끌어들이려 하다니, 예년보다 더 음흉한 걸 계획하고 있는 거 아닌가요?"
10031030-117 = "하! 근거 없는 음해 따윈 그만두시지. 아마우 아코. 단순히 예년보다 더욱 풍성한 파티를 열고자 할 뿐이다."
10031030-118 = "무엇보다 이번엔 여기 선생이 우리를 돕고 있을 정도니 말이야! 캬하하하!"
10031030-119 = "……! 선생님도?"
10031030-120 = "[s] \"으응, 어쩌다 보니…….\""
10031030-121 = "그래. 돕다마다! 게다가 그뿐이랴! 선생은 이번 게헨나 특별 파티를 무척 기대하고 있기까지 한 참이다! 무려 이 마코토 님의 파티니까 말이야!"
10031030-122 = "선생님이 기대하는 파티……."
10031030-123 = "[s] \"물론 파티에 대해서라면 기대……를 안 하는 건 아니지만, 으음…….\""
10031030-124 = "그런 파티를 자칫 망칠뻔한 만큼, 선도부장은 벌충을 해줘야겠어!"
10031030-125 = "벌충……이라니, 구체적으로 무엇을?"
10031030-132 = "(예전에 만마전의 첩보를 통해 손에 넣은 정보를 지금 바로 활용할 때다……!)"
10031030-133 = "선도부장 소라사키 히나!"
10031030-134 = "네 녀석은 이번 <게헨나 특별 파티>에서 특별히……! 개막 피아노 공연을 맡아줘야겠다!"
10031030-135 = "………네?"
10031030-136 = "피아노, 공연……?"
10031030-137 = "크크큭! 그래! 공연이다!"
10031030-138 = "(정보로 들은 적이 있지! 선도부장은 수영을 할 줄 모르고…… 또한 피아노를 칠 줄도 모른다고!)"
10031030-143 = "부장님의 피아노…… 공연……! 피아노, 연주……!"
10031030-144 = "분명 그런 거라면 저도 촬영을…… 이, 아니라! 꼭 들어보고 싶습니다마는!"
10031030-145 = "그치만…… 그래도……! 그런 억지는 역시……!"
10031030-146 = "자! 한 번 입 밖에 꺼낸 이상, 여기까지 와서 거절한다거나 하면서 도망칠 리는 없겠지! 히나!"
10031030-147 = "…………"
10031030-148 = "[s] \"히나, 너무 무리해서 맡을 필요는 없어.\""
10031030-149 = "……선생님."
10031030-150 = "그 배려심은 고마워. 하지만 이미 약속했어."
10031030-151 = "내가 피해를 끼친 건 사실이고…… 더구나 이번 게헨나 파티를 선생님도 기대하고 있는 것이라면……."
10031030-152 = "나도…… 게헨나의 선도부장으로서…… 저기, 그……."
10031030-153 = "선생님의 기대에……. 부응하고 싶으니까……. 그러니."
10031030-154 = "알았어. 마코토 의장. 당신의 그 요구, 받아들이겠어."
10031030-155 = "지, 진짜로?!"
10031030-156 = "흠흠……!"
10031030-157 = "아니! 당연히 그래야지! 응! 한 번 입 밖에 낸 말을 물리지 않는 것이, 선도부장! 네 녀석이니까!"
10031030-158 = "그럼 OK 한 것으로 알고 이쪽도 나름대로 준비를 해놓도록 하지!"
10031030-163 = "그래. 그럼 우선은 도망간 온천개발부를 쫓겠어."
10031030-164 = "내버려두면 끝까지 말썽을 일으키는 녀석들이니까. 서둘러 그쪽 업무를 끝내고 난 다음엔, 얼른 피아노 연습을……."
10031030-165 = "아코, 가자."
10031030-171 = "아, 저기…… 부, 부장님?!"
10031030-177 = "……정말로 떠맡을 줄이야."
10031030-178 = "…………크흣."
10031030-179 = "크흐흣. 크크큭. 키키키키킷!"
10031030-180 = "이거…… 좋은 구경을 할 수 있겠군……!"
10031030-181 = "자기 입으로 허락해 버린 이상…… 섣불리 도망갈 수 있을 거로 생각하지 마라! 선도부장 소라사키 히나……!"
10031030-184 = "[ns] \"………정말 괜찮은 건가.\""
