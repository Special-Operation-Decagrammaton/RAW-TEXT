[translation]
32160-1 = "제16화;격전"
32160-2 = "별관 합숙소"
32160-4 = "이쪽입니다! 타깃을 데리고 이 건물로 들어가는 것을 확인했습니다!"
32160-5 = "이 건물인가…… 여기에 진지를 구축해둔 건가. 시라스 아즈사."
32160-6 = "안쪽으로 통하는 입구는 두 개뿐입니다! 그 중 하나는 바리케이드로 막혀 있습니다."
32160-7 = "열려 있는 입구는 하나뿐……. 머리를 썼군. 저쪽은 함정이다. 막힌 바리케이드를 폭발물로 해체하고 진입한다!"
32160-8 = "소란을 피우게 되는 건데, 괜찮을까요?"
32160-9 = "그래. <스쿼드>에서 연락이 왔다. 곧 지원군들이 트리니티 자치구로 진입할 거야."
32160-10 = "이제 이 임무는 요인 암살이 아니라 트리니티와의 전쟁이라고 상정해야 한다. 그 전에 타깃을 회수해야 해!"
32160-12 = "간다!"
32160-21 = "돌입한다!"
32160-23 = "그래, 여기로 올 줄 알았어."
32160-25 = "트, 트랩?!"
32160-29 = "크아아아아악?!"
32160-30 = "크윽! 무시하고 진입해! 퇴로는 없고 우리가 수적으로 우위야!"
32160-33 = "으아아아아악-! 이쪽에도……!"
32160-36 = "으아아아, 크, 클레이모어?!"
32160-39 = "비닐봉지가 아니라 IED……?! 꺄아아아악!!"
32160-47 = "……후우. 여기까지다. 시라스 아즈사."
32160-48 = "……."
32160-49 = "……. 꽤 많이 줄었네요, 아즈사 쨩."
32160-50 = "음."
32160-51 = "막다른 길이군. 타겟은 어디에 있나?"
32160-52 = "이 건물 어딘가에 숨겨뒀어."
32160-53 = "다른 팀들이 이 건물을 포위하려고 오고 있다. 도망칠 생각은 안 하는 게 좋을 거야."
32160-54 = "……. 증원인가. 몇 명이지?"
32160-55 = "몇 명이 아니다. 몇 부대냐고 물어야 할 거다."
32160-56 = "……더이상 은밀한 작전은 아닌가보군. <스쿼드>는 오지 않았나 보네."
32160-57 = "그들은 다른 임무가 있어서 말야."
32160-58 = "그럼 됐어."
32160-62 = "얕은 수를! 그쪽엔 퇴로가 없는 체육관이라는 건 이미 파악하고 있다!"
32160-63 = "더 이상의 부비트랩은 없어! 쫓아라!"
32160-68 = "……!! 매복인가? 과연……."
32160-69 = "여기가 너희가 선택한 전장이냐?"
32160-70 = "고작 4명으로 우리들에게서 몇 분이나 버틸 수 있다고 생각하는 거냐! 퇴로도 없는 이곳에서!"
32160-72 = "아우우……."
32160-73 = "……."
32160-74 = "맞아. 퇴로는 없어. 너희는 도망치지 못해."
32160-75 = "응, 이제 여기가 마지막 단계. 후후후♡"
32160-76 = "[s] \"기다리고 있었어.\""
32160-78 = "!!"
32160-80 = "보충수업부의 담임이자…… <샬레>의 고문인 선생님의 전술 지휘 수업♡"
32160-81 = "섬멸전을 시작한다."
32160-85 = "[ns] \"보충수업부, 가자!\""
