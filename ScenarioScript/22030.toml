[translation]
22030-1 = "제3화;~아리스, 모험을 시작합니다!~"
22030-2 = "(그 뒤로는 게임개발부 멤버들과 함께 신작 게임에 넣을 수 있을 법한 아이디어에 관해 이야기를 나누기 시작했다.)"
22030-3 = "앞서 말했던 것처럼 우리가 준비하는 차기작의 뼈대는 다음과 같아."
22030-8 = "<퀘스트를 수주하고 낚시와 농사를 즐기면서 캐릭터를 육성하는 힐링 계열의 던전공략 RPG>……."
22030-9 = "그런 장르의 게임이라면 가장 중요한 건 역시 핵심이 되는 던전이지!"
22030-10 = "응……. 던전의 기믹을 어떻게 만드느냐에 따라, 게임의 내용도 천차만별로 바뀔 테니까……."
22030-11 = "정해진 규격의 던전을 공략하는 것으로 할지…… 아니면 로그라이크 장르를 섞어 꾸밀지……라거나."
22030-12 = "아리스는 기왕이면 로그라이크가 좋습니다."
22030-15 = "[ns] \"아리스는 로그라이크 게임 장르를 좋아해?\""
22030-16 = "네! 매번 던전의 구조가 달라질 때마다, 이번엔 또 어떤 몬스터를 만날 수 있을까. 새롭게 어떤 레어 장비를 얻을 수 있을까. 두근두근했으니까요."
22030-17 = "특히 저번에 모두가 힘을 합쳐 만들었던 로그라이크 게임에선 선생님의 이름으로 유니크 아이템을 만들었습니다."
22030-18 = "[s] \"……응?\""
22030-19 = "이름하여 <선생님의 칭찬 스티커>입니다."
22030-20 = "게임에서 그 아이템을 얻을 때마다 아리스는 무척 기뻤습니다. <선생님의 칭찬 스티커>를 얻기만 해도 아리스의 캐릭터가 무척이나 강해졌으니까요!"
22030-21 = "[s] \"……그, 그래? 게임에 넣어주다니, 물론 영광이긴 한데!\""
22030-22 = "앗, 그, 그, 그건! 약간의 양념이라고 할까."
22030-23 = "게임을 좀 더 이, 익스…… 익스……"
22030-24 = "익스트림 했으면 좋겠다는 느낌으로 만든 거라!"
22030-25 = "익사이팅이겠지. 언니."
22030-27 = "다음에 만드는 게임에서도 아리스는 선생님이 좀 더 많이 나왔으면 좋겠습니다!"
22030-28 = "[s] \"아리스의 말은 기쁘지만, 아이템보다는 최소한 파티 멤버로 좀……!\""
22030-29 = "그, 그런 것보다! 만약 로그라이크 던전을 만든다고 하면 형태는 어떻게 할까?"
22030-30 = "지하 유적의 형태……라거나? 던전하면 가장 기본이 되는 형태니까."
22030-31 = "으음~ 너무 평범하지 않나~?"
22030-32 = "기왕 만들 거면 좀 더 이렇게 특별하고, 굉장한 것이었으면 좋겠는데……."
22030-34 = "아니면 탑의 형태로 올라가는 건 어때?"
22030-35 = "계단을 한 층 한 층 오를 때마다 난이도가 오르는 형식이면 좀 더 직관적일 거 같기도 하고……."
22030-36 = "그건 의외성이 없어! 계단이라니 너무 안이해!"
22030-37 = "말로만 그러지 말고, 그럼 언니의 아이디어는 뭔데?"
22030-38 = "지하 유적…… 거기다 탑…… 계단으로 이동하는 것보다는……"
22030-39 = "엘리베이터! 엘리베이터는 어때?"
22030-41 = "엘리베이터를 타고 지하 유적을 내려가는 거야?"
22030-42 = "그러고 보면 예전에 아리스가 했던 게임 중에 비슷한 게임이 있었습니다."
22030-54 = "스파이가 되어, 아파트의 엘리베이터를 타고 내려가면서 적들을 쓰러트리는 게임이었습니다."
22030-55 = "아, 응, 레트로 게임 중에서도…… 제법 인기가 많은 게임이었지."
22030-56 = "으음~ 언니의 아이디어치고는 무난한……"
22030-58 = "아니! 그것만으로는 부족해! 완전 부족하다구! 의외성이 없어!"
22030-59 = "응……?"
22030-60 = "시대는 보다 화려한 비주얼을! 그리고 반전을 필요로 하고 있어!"
22030-61 = "그러니 지하유적을 내려가는 게 아니라, 여기선 반대로 탑을 올라가는 거야! 엘리베이터를 타고!"
22030-62 = "탑?"
22030-67 = "뿐만 아니라……. 쭉쭉 올라가다가……"
22030-73 = "마지막 옥상에 이르러서는 화려하게 폭발하는 거야!"
22030-74 = "그야말로 스펙타클하게!"
22030-76 = "잠깐, 그래서 던전 공략은 어떻게 하는 건데?"
22030-77 = "일단은 화려한 비주얼부터 신경을 써야……"
22030-78 = "꼭 언니는 그렇게 말하더라!"
22030-80 = "우왓?! 미, 미도리……?"
22030-81 = "저번에도 비슷한 말을 했었잖아."
22030-82 = "'이 던전의 굉장함을 표현하기 위해선 몬스터와 던전 함정 등등 마구마구 그릴 필요가 있어!' 같은 말을 하는 바람에 모두 하루 종일 어두컴컴한 던전 내부만 그리기도 했었고!"
22030-83 = "윽! 그, 그건!"
22030-84 = "아! 그거라면 아리스도 잔뜩 그렸습니다! 여러 가지를 그릴 수 있어서 재미있었습니다!"
22030-85 = "선생님. 보여드릴까요? 아리스가 그린 그림."
22030-86 = "참고로 아리스의 자신작은…… 던전 최강의 파수꾼 <선생님 가디언>!"
22030-87 = "항상 아리스들을 이끌어주는 선생님의 이미지에서 이름을 따왔습니다!"
22030-88 = "[s] \"묘하게 보고 싶기도 하고, 아닌 거 같기도 하고!\""
22030-89 = "모두 다 함께 던전을 세세하게 그렸던 건 어, 어디까지나…… 필요에 따른, 선택……으로."
22030-90 = "물론 그리는 거 자체를 가지고 뭐라고 하는 게 아니야."
22030-91 = "문제는 다 같이 그렇게 힘들게 그렸는데…… 정작 게임에서는 그 리소스를 거의 안 썼다는 게 문제였지."
22030-92 = "정말 쓸데없는 짓을 시키기는……. 일단은 구현 가능한 선에서 고민을 해야 하는 거 아냐?"
22030-93 = "하, 하지만! 그래서는 저 너머의 지평선이! 한계의 극복이!!"
22030-102 = "[ns] \"저기, 일단 둘 다 진정을 하고…….\""
22030-103 = "아! 맞다! 이럴 게 아니라……"
22030-104 = "선생님의 의견은 어때?!"
22030-105 = "네! 이럴 때야말로 선생님의 의견이 필요해요! 어느 쪽이 정답이라고 생각하시나요?"
22030-106 = "[s] \"저기, 처음에 부른 이유랑 조금 달라지지 않았어……?\""
22030-108 = "역시 화려한 게 좋지?!"
22030-109 = "하지만 그 전에 현실과의 타협이 우선이지요?"
22030-112 = "네?! 선생님!"
22030-116 = "[ns] (어느 쪽을 고르더라도 배드엔딩의 플래그가 설 것 같은 느낌이……)"
22030-118 = "자, 잠깐! 모두 스톱!"
22030-119 = "그 이상은 선생님이 곤란해하시니까……!"
22030-121 = "아……"
22030-122 = "미, 미안……."
22030-123 = "이대로 결론이 나지 않는 논쟁을 계속해봐야, 폐를 끼칠 뿐이니까."
22030-124 = "응. 여기에선 게임개발부 대대로 내려오는 방식으로 결정해야 한다고 생각해."
22030-126 = "과연! 유즈! 그거로군요!"
22030-127 = "[s] \"대대로 내려오는 방식이라니……?\""
22030-128 = "네. 가끔…… 아니, 그……"
22030-129 = "생각보다 자주……. 서로의 의견이 평행선을 달릴 때가 있어서."
22030-130 = "[s] \"잠깐 단어를 고민해서 바꿀 정도로 자주 있구나……\""
22030-131 = "서로의 의견이 납득이 되지 않을 때라면, 특별히 승부를 해서 패자가 승자의 의견을 따르기로 했거든요."
22030-132 = "[s] \"게임개발부, 생각보다 와일드했구나!\""
22030-133 = "……좋아, 유즈가 그렇게 말한다면야……."
22030-134 = "승부! 받아주겠어!"
22030-135 = "미도리! 울어도 봐주지 않을 거니까!"
22030-136 = "그건 내가 하고 싶은 말이야! 언니!"
22030-137 = "[s1] \"하, 하지만 승부라고 해도 대체 무얼 하려고!\"\n[s2] \"의도는 알겠지만, 그래도 싸우는 건 좋지 않다고 생……\""
22030-144 = "여기에선 <후루젤리 대전>밖에 없어!"
22030-146 = "[s] \"……아, 게임으로 승부한다는 이야기였구나.\""
22030-148 = "네, 게임개발부니까."
22030-150 = "자! 여기선 물러서기 없기야! 미도리!"
22030-151 = "흥! 언니야말로!"
22030-160 = "(그렇게 모모이와 미도리가 게임 대전을 시작한 사이…….)"
22030-162 = "모모이, 미도리. 두 사람 모두 게임을 시작해버렸습니다."
22030-163 = "으음. 그럼 아리스는 지금부터 뭘 하면 좋을까요?"
22030-164 = "아리스 쨩은 그…… 주변에서 혹시 새로운 아이디어가 없을지 찾아봐 줄래?"
22030-165 = "선생님과 돌아다니다 보면, 의외로 특별한 영감을 얻을 수 있을지도 모르니까."
22030-166 = "[s] \"그야말로 게임개발부 부장의 관록이 묻어나오는 이야기…….\""
22030-167 = "네? 아, 그, 그, 그런 것까진 아니라고 생각하지만요……!"
22030-168 = "앗! 그렇군요! 더 재미있는 게임을 만들기 위해…… 주어진 퀘스트……"
22030-169 = "네! 알겠습니다 유즈!"
22030-170 = "뽜밤뽜밤! 아리스는 퀘스트를 수주했습니다!"
22030-171 = "아이디어를 모으기 위해! 아리스와 함께 모험을 떠나는 겁니다! 선생님!"
22030-178 = "(우선은 먼저 아리스와 함께 밀레니엄의 캠퍼스로 나오게 되었다.)"
22030-179 = "뽜밤뽜밤! 아리스와 선생님 파티는 마을 밖으로 나오게 되었습니다!"
22030-180 = "지금부터 선생님과 견습용사 아리스의 모험이 시작되는 겁니다!"
22030-181 = "[s] \"응? 아리스, 이번엔 견습용사부터 시작인 거야?\""
22030-182 = "네! 이번엔 아리스도 선생님도 레벨 1의 견습용사부터 시작입니다!"
22030-183 = "지난번에 모험을 했을 땐, 몇 번 전설의 용사부터 시작하기도 했었지만……"
22030-184 = "그때 모모이가 이렇게 말했습니다."
22030-185 = "[s] \"모모이가?\""
22030-186 = "네. 전설의 용사로 모험을 시작해버리면 레벨 1의 스네일부터 잡는 모험은 역시 좀 이상하지 않아? 라고요."
22030-187 = "그럼 아예 모험이 시작되는 마을 주변에 전설의 드래곤을 배치해보자! 라고 했다가,"
22030-188 = "미도리와 유즈가 그러면 게임 진행이 안 된다고 열심히 말렸습니다."
22030-191 = "그런 종류의 게임은 굉장히 팔기 어렵고……?"
22030-192 = "팔더라도 소비자가 한정된 장르……? 의 게임이 될 수 있으니 꼭 조심해야 한다고 말이죠!"
22030-193 = "[s] \"과연 어른의 사정 같은 이야기로구나……!\""
22030-196 = "모두가 했던 말을 아리스가 전부 이해한 건 아니지만……"
22030-197 = "그래도 오늘은 모처럼 선생님과 함께하는 모험인 만큼 레벨 1부터 시작하는 겁니다."
22030-198 = "차근차근 몬스터를 잡고 퀘스트를 해결하고! 레벨업을 해서 전설의 용사를 목표로 하죠! 선생님!"
22030-199 = "[s] \"응.\""
22030-200 = "흐음! 하지만 이렇게 선생님과 모험을 시작하게 되었으니, 아리스는 고민입니다."
22030-201 = "지금부터 유즈의 퀘스트를 클리어하려면 어떻게 해야……."
22030-202 = "[s] \"그럼 일단 전진할까?\""
22030-203 = "네?"
22030-204 = "[s] \"아리스가 말했었지. 용사의 모험은 우선 전진에서 시작되는 법이라고.\""
22030-205 = "……!"
22030-206 = "네! 만남도! 배틀도! 레벨업과 퀘스트 클리어도! 시작은 전진부터!"
22030-207 = "선생님도 용사 파티의 일원으로서 훌륭한 지식을 갖고 있군요!"
22030-208 = "[s] \"이것도 전부 아리스에게서 배운 거지만 말이야.\""
22030-209 = "네! 그럼 선생님! 앞으로! 전진입니다!"
22030-211 = "(그렇게 아리스와 함께하는 모험이 시작되었다.)"
22030-213 = "다음화;~아리스와 인도받는 자들~ 1"
