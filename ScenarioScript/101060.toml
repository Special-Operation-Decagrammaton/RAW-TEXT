[translation]
101060-1 = "제6화;전조"
101060-7 = "린 쨩~ 린 쨩~"
101060-8 = "누가 린 쨩입니까. 그런 표현은 삼가주십시오, 회장님."
101060-9 = "어라…… 그, 그치만 린 쨩은 린 쨩인걸. 어…… 그럼 뭐라고 불러야 하지……?"
101060-10 = "나, 나나가미 님……?"
101060-11 = "……."
101060-12 = "린 씨? 린 님? 린 귀하……?"
101060-13 = "……그냥 마음대로 부르십시오."
101060-14 = "어차피 저를 그렇게 부르는 건 회장님뿐이니까. 뭐든 상관없겠죠."
101060-15 = "응! 린 쨩~ 린 쨩. 헤헤~"
101060-16 = "……어라? 어라라? 린 쨩 방금 웃은 거야?"
101060-17 = "……아닙니다."
101060-18 = "아닌데? 내가 확실히 봤는데?"
101060-19 = "……그럴 리가 없지 않습니까."
101060-20 = "그런가? 아닌데……."
101060-21 = "……."
101060-22 = "……진짜 아닙니다."
101060-24 = "린 선배……."
101060-25 = "……!!"
101060-26 = "총학생회실"
101060-27 = "선배…… 피곤하시죠. 며칠째 숙소에 들어가지도 못하셨는데……."
101060-28 = "아유무……. 내가 잠깐…… 졸았나 보군요."
101060-29 = "죄송해요. 그치만 꼭 확인이 필요한 게 있어서……. 그, 급한 사항이라……."
101060-30 = "……네. 괜찮습니다. 가시죠."
101060-36 = "이야, 린 선배. 아유무 선배. 늦게까지 고생이네."
101060-37 = "모모카."
101060-38 = "모모카 쨩……. 얼른 그걸……."
101060-39 = "그래. 이쪽이야."
101060-45 = "이건……?"
101060-46 = "2시간 전에 탐지된 데이터야."
101060-49 = "키보토스 전역에 초고위급 에너지를 띠는 질량체가 그것도 6개가 관측되었어."
101060-50 = "……."
101060-51 = "어디 보자…… 아비도스 사막, D.U. 근교의 버려진 유원지, 밀레니엄 외곽의 폐쇄지, 트리니티와 게헨나 사이의 접견 지역, 밀레니엄 근교의 신도시, ……그리고 생텀 타워 정중앙."
101060-53 = "생텀 타워 정중앙이라면……."
101060-54 = "그래, 우리 바로 위란 말이지."
101060-55 = "저도 그래서 외부 카메라로 영상을 확인해봤지만…… 아무것도 확인할 수 없었어요."
101060-56 = "응. 평소와 다를 것 없는 생텀 타워였어."
101060-57 = "……."
101060-58 = "다른 지역도 마찬가지야."
101060-59 = "처음엔 초강력 태풍이라도 오나 싶었거든? 그런데 말이 안 되잖아. 태풍이 질량이 있을 리도 없고."
101060-60 = "데이터는 관측되는데 실존하지는 않는다……라."
101060-61 = "아하하하- 그럼 남은 결론은 하나. 기계 고장인가 보지!"
101060-62 = "모모카 쨩……."
101060-63 = "……."
101060-64 = "실제로 가보는 수밖엔 없겠군요."
101060-65 = "응? 린 선배 방금 뭐라고……."
101060-66 = "뭐? 저 자치구에 직접 가본다고? 관측 드론으로 이미 확인해봤지만 아무것도 없었다구."
101060-67 = "각 자치구에서 이상 보고가 들어온 것도 없고."
101060-71 = "지금 당장 각 자치구의 학생회 대표들을 소집합니다."
101060-72 = "……!?"
101060-73 = "뭐?"
101060-74 = "현재 총학생회가 저 문제에 대응할 여력은 없으니, 각 자치구와 공조해서 해당 지역의 분석에 들어가겠습니다."
101060-75 = "총학생회장 대행의 권한으로 긴급 프로토콜을 발동, 키보토스 비상대책위원회를 발족하겠습니다."
101060-76 = "비대위까지……? 이, 이렇게까지 해야 할 일이 맞아? 그냥 단순한 기계 고장일지도 모르잖아?"
101060-77 = "그런 거라면 다행입니다. 단순한 해프닝으로 끝내면 되니까."
101060-78 = "하지만 그 전모가 밝혀지기 전까진 전력을 다해 대응해야 합니다."
101060-79 = "트리니티, 게헨나, 밀레니엄, 아비도스……뿐만 아니라, 연락이 닿는 모든 자치구의 학원 책임자를 이곳에 소환합니다."
101060-80 = "……."
101060-81 = "우와아…… 망했다……. 이건 일주일짜리 철야 각인데."
101060-83 = "린 선배……! 괘, 괜찮을까요?"
101060-87 = "그…… 요즘…… 린 선배가 대행의 권한을 너무 많이 남용하고 있다는 이야기가…… 여기저기서 흘러나오고 있어요……."
101060-88 = "이 정도 이슈라면 린 선배의 입지가 위험해질 수도 있어요……. 특히 이번 이슈는 방위실의 권한을 침해하는 걸로 해석될 수 있어서……."
101060-89 = "아, 물론 총학생회장의 대행으로서는 적법한 게 맞지만…… 그치만 재무실에서는……."
101060-90 = "……사사건건 문제를 제기하겠지."
101060-93 = "아, 재, 재무실장님……."
101060-94 = "오키 아오이."
101060-95 = "수석행정관."
101060-97 = "……이크, 난 바쁜 일이 떠올라서 실례."
101060-105 = "(소근소근) 모모카 쨩…… 도망치면 안 돼요."
101060-106 = "(소근소근) 우, 우와아 이거 놔, 아유무 선배! 여기 있으면 질식사해버릴 거야!"
101060-109 = "언제부터 통괄실의 행정관이 방위실의 권한까지 침해하기 시작한 거지?"
101060-110 = "아오이. 이건……."
101060-111 = "설명은 됐어. 나도 이 정보는 확인했어."
101060-112 = "키보토스에 정체를 알 수 없는 이상 현상 발생."
101060-113 = "징후도, 실제 피해도 아무것도 없지만 그럼에도 위협이 없다는 걸 입증하기 전까지는 모든 수단과 방법을 동원해 최고 수준으로 대응. ……그 결정에 이견은 없어."
101060-114 = "……결정한 게 총학생회장이었다면 말이지."
101060-115 = "……."
101060-116 = "하지만 당신은 총학생회장이 아니야. 수석행정관. 대행 완장을 찬다고 해서 당신이 그 사람이 되는 건 아니니까."
101060-117 = "생텀 타워의 행정 제어권도 잃고, 거기에 SRT 학원의 폐쇄 결정. <샬레>라는 정체불명의 조직의 인가까지."
101060-118 = "게다가 지금 이건 뭐지? 그 <샬레>의 예언? 멸망의 예지몽? 그런 이상한 말에 휘둘리기까지 하고."
101060-119 = "아무리 대행이라고 해도, 지금은 납득할 수 있는 선을 넘었어."
101060-120 = "아오이. 내가 마음에 안 들겠지만……."
101060-121 = "……나는 지금 개인적인 감정 때문에 이러는 건 아냐."
101060-122 = "난 예전부터 당신의 능력을 높이 평가해왔어. 그건 총학생회장도 마찬가지였고. 당신이 대단한 사람인 건 누구보다 잘 알고 있어."
101060-123 = "하지만 그렇다고 해서 당신이 총학생회장 같은 초인이 될 수 있는 건 아냐."
101060-124 = "당신이 대행이 된 건 그저 통괄실의 수석행정관이었기 때문이지, 개인의 역량이나 자격을 인정받았기 때문이 아니야. 그건 그저 행정적인 절차였을 뿐."
101060-125 = "이 사실은 그 완장을 차고 있는 한 끝까지 당신을 따라다니게 될 거야. 그걸 염두에 두고 결정하도록 해. [ruby=.]대[/ruby][ruby=.]행[/ruby]."
101060-126 = "……."
101060-127 = "그럼에도 당신이 비대위를 개최하려면 방위실의 권한을 침해할 만한 근거와 논리…… 당위성…… 그런 게 필요할 거야."
101060-128 = "최소한 나를 설득할 수 있을 정도는 준비해 둬야 할 거야."
101060-129 = "만약 그렇지 못하다면…… 나는……."
101060-130 = "……당신을 총학생회장이 행방불명된 틈을 타 자신의 권력을 공고히 하려는 기회주의자로 보게 될 테니까."
101060-131 = "……."
101060-132 = "그 말, 참고하도록 하죠."
101060-133 = "그래…… 그럼."
101060-138 = "……그리고 좀 자도록 해."
101060-139 = "예전보다 선배 피부가 많이 상했어."
101060-145 = "……."
101060-146 = "푸하아-"
101060-147 = "하아…… 하아…… 하아……숨 막혀 죽는 줄 알았어……."
101060-148 = "린 선배……."
101060-149 = "아유무. 비대위를 준비하세요."
101060-153 = "……!!"
101060-154 = "……."
101060-159 = "이런, 린 행정관……."
101060-160 = "방위실장……."
101060-161 = "미안해요, 재무실장의 목소리가 워낙 커서 본의 아니게 엿듣는 꼴이 되어버렸네요."
101060-162 = "……비대위 건은 죄송하게 됐어요. 양해를 부탁드리겠습니다."
101060-163 = "괜찮아요. 그건 대행의 마땅한 권한이니까. 저는 이해해요."
101060-164 = "……."
101060-165 = "그것 참. 행정관은 열심히 하려고 하는 것뿐인데…… 총학생회장의 빈자리를 채우는 게 쉬운 일도 아닌데 말이죠. 재무실장도 이렇게까지 몰아세울 필요는 없는데."
101060-166 = "하지만 당신의 권위를 의심하는 사람들이 아직 여전히 많으니…… 이 일을 어쩐다……."
101060-167 = "……그래요. 비대위에는 샬레를 불러서 합석시키는 건 어떤가요?"
101060-168 = "샬레를……?"
101060-169 = "네. 샬레의 선생님이 동석하고 있으면 학원의 대표들을 설득하는데 도움이 될지도 몰라요."
101060-170 = "소문에 의하면 각 자치구 여기저기서 샬레의 활약상이 들려오더군요. 심지어 경찰학교 일부 학생들의 불법 행위까지 밝혀내기도 했던데. 그야말로 만능수사 동아리."
101060-171 = "선생님이 동행한다면 행정관의 걱정도 덜 수 있을 거예요."
101060-172 = "……네. 조언 감사해요. 그 편이 낫겠네요. 어차피 샬레와의 공조가 필요할 거고."
101060-173 = "……. 그럼 선생님을 여기 부르는 건 제가 할게요."
101060-174 = "샬레 건물에서 여기까지 이동할 때 경호도 필요할 거고…… 그건 발키리에 부탁해두면 되려나."
101060-175 = "네. 도움 감사합니다. 카야. 그쪽은 부탁드릴게요."
101060-176 = "뭘요. 이렇게 어려운 시기에 서로 도와야죠. 행정관."
101060-177 = "그럼."
101060-182 = "……."
101060-187 = "……네. 준비하세요."
101060-189 = "다음화;비상대책위원회 소집"
