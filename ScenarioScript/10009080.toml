[translation]
10009080-1 = "후일담;해피 발렌타인……?"
10009080-3 = "안녕하세요. 구호기사단입니다. 발렌타인 데이를 맞이하여 초콜릿을 나눠드리고 있어요."
10009080-4 = "평범한 초콜릿이지만, 받아 주세요! 모두 해피 발렌타인 되세요!"
10009080-5 = "발렌타인 데이에 초콜릿이라니, 전 처음 받아 봐요……."
10009080-6 = "고마워요, 구호기사단. 늘 수고가 많네요."
10009080-8 = "사랑을 원하는 분들에게 행복을 전하는 것도 구호의 한 방법이 아닐까, 하는 마음에서 시작한 활동입니다만."
10009080-9 = "많은 분들이 기뻐하시는 것을 보니 저도 기뻐지는군요."
10009080-13 = "아하하…… 하나에 쨩이 생각해낸 멋진 아이디어였지요."
10009080-14 = "어떤 의미에서 이것이야말로 발렌타인 데이에 구호기사단이 베풀 수 있는 '구호'인지도 몰라요!"
10009080-15 = "확실히, '구호'란 보다 널리 사람을 이롭게 하기 위한 것."
10009080-16 = "감사드립니다. 세리나, 하나에. 이 영광스러운 순간에 저를 깨우쳐 주시다니."
10009080-17 = "처, 천만에요! 저는 그저, 이왕 하는 봉사활동이라면 최선을 다해서, 즐겁게 하자는 마음에……"
10009080-18 = "그리고 초콜릿은 뭘 해도 맛있으니까요!"
10009080-20 = "감사합니다, 감사합니다…… 아껴서 잘 먹을게요. 아니, 가보로 보관해 둘까요?"
10009080-21 = "오히려 내가 뭘 해 주고 싶은데…… 그렇구만. 잠시 시간이 남으니 나도 자원봉사를 하도록 하겠어."
10009080-23 = "그, 그렇게까지는 하지 않으셔도 되는데…… 고맙습니다."
10009080-24 = "감사합니다. 구호의 정신이 언제나 함께하시길."
10009080-25 = "어떡하죠? 이런 모습들을 보고 있으면……"
10009080-29 = "기뻐서 가슴이 터질 것 같아요!"
10009080-35 = "꺄아아악?! 폭발이?!"
10009080-36 = "저, 저 때문인가요?! 제가 가슴이 터질 것 같다고 한 것 때문에?!"
10009080-37 = "그건 아닐 것 같습니다만!"
10009080-39 = "긴급 속보입니다! 조금 전 교정국으로 문제아를 호송 중이던 차량이 폭발!"
10009080-40 = "동시에 다수의 문제아 집단이 난동을 부리고 있다는 소식입니다!"
10009080-42 = "뭔지는 모르겠지만 시끌벅적해졌구만……!"
10009080-43 = "그러게. 발키리의 참새들도 뭔가 정신없는 것 같고."
10009080-44 = "좋아! 오늘은 축제다! 파티라고!"
10009080-45 = "다 불러 모아! 오늘은 신나게 놀아 보는 거다!"
10009080-50 = "무, 무슨 일이 일어나는 거지요?"
10009080-51 = "사방에 놀란 사람들이 도망치고 있고…… 그 틈을 타서 신이 난 문제아들이 쏟아져 나오고……"
10009080-52 = "이거야말로…… 여기야말로 지옥?!"
10009080-53 = "도, 도와주세요! 누구라도 좋으니까!"
10009080-55 = "뭐, 뭔가 엄청난 일이 일어나고 있는 것 같은 느낌이……!"
10009080-56 = "어떡하죠, 선배?!"
10009080-57 = "일단 우리의 업무는 구호예요. 주위에 구호가 필요한 분들이 없는지부터 살피는 게……"
10009080-58 = "잘 말해 주었습니다. 세리나."
10009080-59 = "다, 단장님?"
10009080-60 = "구호란 널리 사람을 이롭게 하는 것."
10009080-61 = "그런 의미에서, 길을 엇나가려는 자들을 바로잡는 것 역시, 넓은 의미에서의 '구호'라 할 수도 있겠지요."
10009080-62 = "저는 지금부터, 저 불량배들에게 우리의 '구호'를 전달하겠습니다!"
10009080-63 = "단장님?!"
10009080-64 = "가겠습니다! 구호가 필요한 곳에 구호를!"
