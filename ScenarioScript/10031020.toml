[translation]
10031020-1 = "제2화;첫 준비"
10031020-2 = "(본격적으로 만마전의 게헨나 파티 준비를 도와주기로 한 첫날, 마코토로부터 연락이 도착했다.)"
10031020-7 = "크크큭. 저번에도 말한 적이 있지만 이번 <게헨나 특별 파티> 개최를 기념해, 새롭게 우리 만마전의 신 의사당을 짓게 되었다."
10031020-8 = "그래서 말인데, 그 신 의사당의 준공식에 선생을 초대하고자 한다만, 부디 참석하여 자리를 빛내주지 않겠나?"
10031020-9 = "[s] \"응, 알았어. 갈게.\""
10031020-10 = "키키킷. 그럼 기다리고 있겠다."
10031020-17 = "크크큭………"
10031020-18 = "키키키키키키키키킥!!!"
10031020-19 = "이것으로 [USERNAME] 선생의 협력은 얻어냈다."
10031020-20 = "이건 단지 준비만을 위한 협력 요청이 아니야…… 현장에서 선생에게 도움받는 장면을, 치아키를 통해 촬영하도록 지시해서…… 우리 만마전을 위한 선동용 다큐멘터리를 만든다면……."
10031020-21 = "크크큭. 해당 영상을 키보토스 전역에 송출하는 것으로 우리 만마전이 어떤 형태로든 샬레의 권력과 밀접 접촉하고 있단 사실을 만천하에 알릴 수 있겠지……!"
10031020-22 = "그 방법만 취할 수 있다면…… 판데모니움 소사이어티의 영향력을 확대하는 것도 얼마든지……!"
10031020-27 = "[ns] \"저기, 마코토. 아직 통화 중인 상태인데.\""
10031020-28 = "아…………"
10031020-29 = "이…… 이건…… 아니, 아니다. 선생. 그게 그러니까."
10031020-30 = "[s] \"촬영이라면 정중하게 거절해 둘게.\""
10031020-31 = "이, 이 몸의 계획이………!"
10031020-32 = "크으으으읏……! 어, 어, 어, 어쩔 수 없지……"
10031020-33 = "혀, 현장에서 기다리고 있겠다!"
10031020-54 = "[ns] \"다들 엄청 바쁜 분위기네.\""
10031020-57 = "키키킷. 그만큼 이번 파티는 중요한 의미를 가지고 있기 때문이지."
10031020-58 = "[s] \"아, 마코토.\""
10031020-59 = "만마전에 찾아온 것을 환영한다. 선생."
10031020-60 = "뭐, 약속을 했다고는 하나 저번의 제안 이후, 이렇게나 흔쾌히 만마전에 협력해 줄 줄이야……. 다시 한번 감사를 표하도록 하지. 키킷."
10031020-61 = "[s1] \"응, 그거라면 약속했으니까.\"\n[s2] \"물론 이후에 촬영은 하지 않을 거지만 말이야.\""
10031020-64 = "읏……! 그, 그건……!"
10031020-65 = "…………어, 어쨌거나 중요한 건 과거가 아닌 미래!"
10031020-66 = "지나간 시간을 되새기기보다 앞으로 펼쳐질 창대하고 장대한 우리의 미래에 대해 이야기를 나누는 것이 바람직하겠지. 그렇게 생각하지 않나. 선생!"
10031020-67 = "[s] (아, 말 돌렸네.)"
10031020-71 = "[ns] \"근데 신 의사당 준공식이라는 건…… 의사당을 새로 지었단 거지?\""
10031020-72 = "그래. 이번 <게헨나 특별 파티>를 준비하는 김에……"
10031020-73 = "기왕이면 좀 더 평소 필요하다고 생각했던 시설을 더욱 확충하고 늘릴 필요가 있다고 생각했기 때문이지."
10031020-74 = "참고로 이번 파티가 열리는 파티장도 의사당 내부에 새로 들어설 예정이다. 크크큭……."
10031020-75 = "[s] \"과연, 그래서 이런 타이밍에 준공식을…….\""
10031020-76 = "물론 확충된 시설은 그뿐만이 아니다!"
10031020-77 = "그 밖에도 PC방이나 코인세탁소, 도서관, 편의점, 오락실 등등……! 기왕 만드는 김에 선도부 녀석들이 듣기만 해도 배 아파할 만한 시설이란 시설은 전부 지을 예정이야!"
10031020-78 = "추후 우리 만마전 신 의사당은, 그 자체만으로도 게헨나에 있어 새로운 문화공간의 아이콘으로 떠오르게 될 테지!"
10031020-79 = "[s] \"그건 의사당이라기보다는, 그냥 복합쇼핑몰 아냐……?\""
10031020-80 = "키키킥! 특히나 이 몸께서 가장 추천하는 장소는…… 이번에 새로 만든 것 중에서도 가장 많은 예산이 들어간 특별 시설……."
10031020-81 = "그래. <특제 온천 시설>이다! 만마전을 칭송할 뭇 게헨나 학생들을 위해 특별히 의사당 뒤편에 건설 발주를 넣어둔 참이지!"
10031020-82 = "[s] \"그야말로 규모가 남다르구나.\""
10031020-83 = "키시시싯! 그렇다! 그만큼 이 마코토 님께선, 이번 신 의사당 준공에 사활을 걸고 이로하나 치아키, 사츠키. 그리고 이부키와 함께 전력으로 달려온 게야!"
10031020-84 = "시간이 지나, 이를 알게 된 선도부 녀석들이 깜짝 놀라 입이 떡 벌어지는 표정이 벌써부터 머릿속에 그려지는 군……! 키키키키키킥!!!"
10031020-85 = "[s] \"저기, 혹시나 해서 그런데. 참고로 온천 발주는 누구에게……?\""
10031020-86 = "응? 그야 당연히……"
10031020-87 = "게헨나의 온천개발부다마는?"
10031020-91 = "[ns] \"…………아.\""
10031020-94 = "가, 갑자기 무슨 일이냐?!"
10031020-98 = "크, 큰일입니다! 의장님……! 다름이 아니라……"
10031020-99 = "온천 때문에 그 녀석들이……!"
10031020-100 = "그 녀석……?"
10031020-107 = "뭣……?!"
10031020-119 = "너, 너희들은……!"
10031020-121 = "안녕안녕~! 온천개발부의 등장이야~!"
10031020-122 = "오? 어쩐지 익숙한 얼굴이 있다 했더니. 선생님까지 같이 있었잖아."
10031020-123 = "만마전의 의장과 선생님이라니, 이거 참 신선한 조합인걸."
10031020-124 = "[s] \"어…… 안녕, 메구. 카스미.\""
10031020-125 = "응응~ 안녕! 선생님!"
10031020-126 = "뭐, 예상치 못한 만남에 멋진 안부 인사를 나누는 것도 나쁘진 않지마는."
10031020-127 = "그건 그렇다 치고. 이번에 우리에게 온천개발을 의뢰한 의뢰주가…… 마코토 의장, 당신이지?"
10031020-129 = "그건 그렇다만…… 왜 온천 개발이 아니라, 준공식이 열리는 의사당 앞에 찾아와서 횡포를 부리는 게냐."
10031020-130 = "애당초 온천 개발 지역은 이곳이 아니잖아. 지금 이게 무슨 짓인 거냐. 온천개발부."
10031020-131 = "아, 그거 말인데."
10031020-132 = "물론 처음에 의뢰받았던 내용은 신 의사당의 뒤편에 새롭게 온천 시설을 짓는 거였지만……."
10031020-133 = "무려 놀랍게도……! 신 의사당 뒤편이 아니라, 바로 이 앞에! 이 만마전의 주차장에서!"
10031020-134 = "더우우우욱 더 진한 온천 수맥의 기운이 느껴졌단 말이지!"
10031020-135 = "[s] \"저기…… 참고로 근거는?\""
10031020-136 = "이야~ 선생님. 새삼스레 그런 걸 묻는 거야?"
10031020-137 = "그야 내 감인 게 당연하잖아!"
10031020-139 = "그래서 부장하고 우리 애들하고 여러 가지로 이야기를 나누지…………는 않았지만 말이야! 부장의 말을 들으니 팟-하고 감이 온 거 있지!"
10031020-140 = "원래 의뢰받은 계획대로 개발하는 것보단…… 바로 이곳을 개발하자고 말이야!"
10031020-141 = "아니아니아니! 이곳에선 곧 준공식이 열릴 참이다마는?!"
10031020-142 = "아. 그래……?"
10031020-143 = "근데 그건 우리랑 관계없는 이야기잖아? 모처럼 우리는 댁한테 멋진 온천을 개발해달라고 의뢰를 받았으니까."
10031020-144 = "그럼 그 기대에 부응해서, 우리가 할 수 있는 가자아아앙! 멋진 온천을 개발하는 게 당연하잖아?"
10031020-145 = "아, 주차장을 파헤쳐 달란 부탁은 하지 않았다고? 에이, 신경 쓰지 마~"
10031020-146 = "와핫핫핫핫! 막상 온천이 나오면 마코토 의장도 좋아할 테니까! 나만 믿어! 난 온천에 대해선 전문가거든!"
10031020-147 = "[s] \"……어쩐지 이럴 것 같았어.\""
10031020-148 = "자아! 전원! 돌격! 부수고 파내고…… 또 파헤치자! 온천 개발의 시간이다!"
10031020-154 = "카스미 부장 말을 따라! 앞으로~!"
10031020-160 = "크으으읏! 이, 이대로 이 마코토 님의 준공식을 방해하도록 내버려둘 성싶으냐! 보고만 있지 않겠다!"
10031020-161 = "전원! 막아라!"
10031020-179 = "[ns] \"자, 잠깐…… 다들 일단 진정을 하고………\""
10031020-185 = "온천을 파면 다들 진정하게 될 거야!"
10031020-186 = "응응! 온천은 마음의 양식? 안식? 일식을 가져다주니까~!"
10031020-191 = "크, 크으으읏!! 어, 어쩌다가 이런 상황이……! 이 몸이 무엇을 잘못했길래……! 어디서부터 잘못되었단 말이냐!"
10031020-192 = "[s] \"……그건, 온천개발부에 의뢰를 한 시점부터가 아닐까……?\""
10031020-198 = "와핫핫핫핫핫!!! 온천 개발이다! 폭파다! 전부 밀어버려서 게헨나의 모든 학생에게 1인 1온천을……!"
10031020-203 = " ………………………………………."
10031020-211 = "[ns] \"바, 방금 그건……!\""
10031020-217 = "마침 이곳에서 소란이 일어났다는 신고를 듣고 왔습니다만……."
10031020-218 = "지금…… 이건 대체 무슨 상황이야?"
10031020-219 = "[s] \"히나랑 아코……!\""
10031020-220 = "……선생님?"
10031020-221 = "엇?! 선생님이 왜 이런 곳에……?"
10031020-223 = "이이잇! 히나……! 오늘은 우리 만마전의 신 의사당 준공식 이벤트가 있는 날이다……!"
10031020-224 = "그런 날 이곳을 찾아오다니…… 설마, 네 녀석…… 이 마코토 님을 방해하러 온 거냐……!"
10031020-225 = "[s] \"누가 봐도 도와주러 온 거지 않아……?\""
10031020-226 = "에이잇! 선도부장의 도움 따위 필요 없다!"
10031020-227 = "저 녀석의 도움을 받게 되느니 차라리 의사당의 주차장에 온천이 생기는 일쯤은……!"
10031020-228 = "생기는 일쯤은…… 감수…… 가, 감수……."
10031020-229 = "아니…… 역시 감수할 수는 없다마는……!"
10031020-230 = "[s] \"역시 거기까지 감수할 수는 없는 거구나…….\""
10031020-235 = "저희도 딱히 만마전을 돕고 싶어서 찾아온 건 아니거든요?!"
10031020-236 = "우리는 어디까지나 온천개발부가 날뛰고 있다는 신고를 듣고 왔을 뿐이니까."
10031020-242 = "늘 있는 트러블이라고는 생각합니다만…… 만마전을 도와야 한다는 게 또 속이 쓰리긴 하지만……!"
10031020-243 = "우선 이 상황을 정리하도록 하겠어. 선생님, 불만 있어?"
10031020-244 = "[s] \"없습니다.\""
10031020-245 = "그래."
10031020-249 = "선도부원! 전원 준비하세요!"
10031020-252 = "넵……!"
10031020-257 = "게헨나의 선도부장을 비롯해 선도부 전원! 임전태세에 들어갔어!"
10031020-259 = "우와앗~! 엄청나게 위험해!"
10031020-263 = "히, 히, 히에에에엑!!!"
10031020-268 = "앗! 거기다 카스미 부장이 패닉 상태에 들어갔어!"
10031020-269 = "카스미 부장, 선도부장을 엄청 무서워하니까!"
10031020-270 = "긴급사태다아아~!! 모두 일단 응전이야!!"
10031020-276 = "!!"
