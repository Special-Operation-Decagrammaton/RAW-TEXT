[translation]
10012065-1 = "제6화;한여름 밤의 꿈"
10012065-5 = "으응. 영차……."
10012065-6 = "휴. 이걸로 마지막 박스도 옮겼어요."
10012065-7 = "이쪽도 대충 끝났어. 선생님 쪽은?"
10012065-8 = "[s1] \"나도 다 옮겼어.\"\n[s2] \"아이고 허리야.\""
10012065-9 = "좋아. 거기 두면 나머진 내가 알아서 할게."
10012065-10 = "전혀 아파하는 얼굴이 아니잖아……."
10012065-11 = "그런데 정말 괜찮을까요? 저희 아까 전까지만 해도 줄곧 정비와 청소만 했는데."
10012065-12 = "갑자기 짐을 모두 해변으로 빼고 바비큐 파티라니……."
10012065-14 = "오히려 그렇기 때문이라구, 아야네 쨩~."
10012065-15 = "우리도 좀 쉬어야지~. 언제까지 보수작업만 하고 있을 순 없잖아. 안 그래?"
10012065-16 = "이왕 바다에 왔으니 다 같이 단체사진도 한번 찍고 말이죠☆ 놀 땐 확실히 놀아야!"
10012065-18 = "……선배들 아까 전엔 보수하는 과정도 휴양의 일부니 어쩌니 하지 않았던가."
10012065-20 = "아하하하……."
10012065-21 = "지난 이야기는 넘어가자고-."
10012065-22 = "어차피 남은 일이라고 해봐야 돌아가서 헬기를 수리하는 것 정도뿐이잖아? 그건 내일의 일이야, 내일의 일."
10012065-23 = "준비과정은 이걸로 끝!"
10012065-24 = "지금부터는 우리들의 시간이니까요!"
10012065-29 = "……헬기……."
10012065-30 = "걱정할 거 없어요. 아야네 쨩."
10012065-31 = "내일 모두 같이 갈 거니까요. 필요한 부품은 모두 넘치도록 있는 걸 봤잖아요?"
10012065-32 = "응. 고치는 시간은 짧게 잡아도 하루를 다 써야 할 테니, 한 번에 할 거면 내일 아침부터 하는 게 맞아."
10012065-33 = "게다가 시야가 어두운 곳에서의 정비는 위험하니까. 내일을 위해 지금은 충분한 휴식을 해야 할 때야."
10012065-34 = "응응! 이것도 다 필요한 일이라는 거죠!"
10012065-35 = "노노미 선배……. 시로코 선배……."
10012065-37 = "……그러고 보니 그 이상한 녀석들……. 그 뒤로 계속 안 보이지 않아?"
10012065-38 = "정말로 경비 시스템 때문인가? 이 섬 전체를 스캔한다고 했었으니까……."
10012065-39 = "어쩌면 섬 밖으로 완전히 쫓겨난 걸 수도……."
10012065-40 = "엄청난 수였으니까요."
10012065-42 = "본인들도 뭔가 타고 온 게 있었을 테니, 그걸 타고 돌아간 거 아닐까."
10012065-43 = "으음. 의도한 건 아니지만 조금 심한 짓을 해 버린 걸지도……."
10012065-44 = "뭐? 그건 또 무슨 소리야? 먼저 우릴 쫓아내려 했던 건 그쪽이잖아!?"
10012065-45 = "진짜 하나같이 너무 착해들 빠졌어. 이 정도는 정당한 거야! 우린 우리의 휴양지를 지킨 것뿐이라고!"
10012065-46 = "……응. 그리고 선생님도 지켰어."
10012065-47 = "그렇지! 그리고 선생님도 지켰……!"
10012065-48 = "다는 건 지금 상관없잖아!?"
10012065-49 = "아무튼 짐 다 옮겼으면 펴기나 하라고!! 나 먼저 준비하러 간다!!"
10012065-53 = "아하하……. 그럼 저도 세리카 쨩을 도우러 이만……."
10012065-57 = "……으헤. 정말이지 귀엽구만, 귀여워."
10012065-58 = "[s] \"그럼 우리도 시작해 볼까.\""
10012065-63 = "……그럴까."
10012065-138 = "(즐겁게 시간을 보내다 보니 어느덧 늦은 밤이 되었다.)"
10012065-139 = "(피곤함에 잠든 대책위원회 부원들을 두고, 밤공기를 맞으며 한 바퀴 산책을 돌았다.)"
10012065-140 = "(…….)"
10012065-141 = "여기 계셨군요, 선생님."
10012065-142 = "[s] \"……?\""
10012065-143 = "……쨔안☆ 노노미의 등장! 이에요."
10012065-144 = "잠깐 안 보이시기에 어디로 가셨나 했더니……. 뭐 하고 계셨나요?"
10012065-145 = "[s3] \"더워서 바람도 쐴 겸 나왔지.\"\n[s4] \"여기가 제일 시원하니까.\""
10012065-146 = "그렇군요. 음음. 그럼 저도……."
10012065-147 = "그렇군요. 음음. 그럼 저도……."
10012065-153 = "[ns5] \"……노노미?\"\n[ns6] \"갑자기 옆에 앉았다!?\""
10012065-154 = "후훗. 저도 쉬러 왔으니까요~."
10012065-155 = "후훗. 저도 쉬러 왔으니까요~."
10012065-156 = "아니면 열대야 때문에 잠을 못 잤다……라고 해도 좋고요."
10012065-157 = "다른 부원들은 다들 어찌나 열심히 놀았는지, 지금은 반쯤 녹초가 돼서 누워 있거든요."
10012065-158 = "시로코 쨩도, 세리카 쨩도, 아야네 쨩도……."
10012065-159 = "그리고 또……."
10012065-160 = "[s7] \"……노노미?\"\n[s8] \"뭔가 할 말이 있는 거야?\""
10012065-161 = "으으응. 딱히 대단한 이야기는 아니에요."
10012065-162 = "으으응. 딱히 대단한 이야기는 아니에요."
10012065-166 = "그냥 다들……. 이렇게까지 다 잊고 즐겁게 노는 건 처음이다 싶었어서요."
10012065-167 = "선생님께서도 아시겠지만, 저희는 늘 학교에 대한 생각으로 가득 차 있었잖아요?"
10012065-168 = "물론 그게 나쁘다는 건 아니지만……."
10012065-169 = "……가끔은 이런 대리만족도 나쁘지는 않다는 거지. 돌아가면 또 그 고생길이니까 말이야."
10012065-170 = "……어라. 호시노 선배?"
10012065-178 = "무슨 이야기들을 그렇게 재밌게 하고 있을까? 두 사람이서만."
10012065-179 = "주무시고 계신 게 아니었나요? 분명 아까 전까지는 고래 튜브 위에서……."
10012065-180 = "응. 잘 자고 있었지. 그러니까 이제 일어난 거고~."
10012065-181 = "아니면 나도 열대야 때문에 깼다……라고 해둘까?"
10012065-182 = "아하하하……. 낮에도 잘 잔 선배에게는 어울리지 않는 변명일지도……."
10012065-187 = "분위기 좋네~. 이 아저씨, 이런 거 싫어하지 않아. 모처럼 느긋하니 여유도 넘치고 말이지."
10012065-188 = "선배는 언제나 느긋하잖아요? 추락하는 헬기안에서도 잘 정도로☆"
10012065-189 = "으응~? 노노미 쨩? 그렇게 나오는 거야?"
10012065-190 = "뭐야, 뭐야? 애들 없는 곳이라고 막 던지는 거야? 아니면 여름밤의 바다라서 그런 거야?"
10012065-191 = "으으음~. 글쎄요……."
10012065-192 = "우선 후자 쪽으로 해 둘까요? 그편이 여러모로 좋을 거 같네요."
10012065-193 = "슬프구나. 우리 섬세하고 귀여운 후배들이 어쩌다가 이런 사람으로 자라났을까."
10012065-195 = "그치만 '섬세하고 귀여운' 건 피차일반인걸요?"
10012065-196 = "바비큐 파티를 할 때에도……. 평소답지 않게 잘 도와주셨던 선배처럼 말이죠."
10012065-201 = "정말이지 무섭다, 무서워! 여름 바다! 내 귀여운 후배도 나도, 이렇게 만들어 버리다니!"
10012065-202 = "……그러네. 나도 모르게 이것저것 정신없이 돕고 있었어. 왜였을까? 분위기에 취해서?"
10012065-203 = "아니면 그 도구들이……."
10012065-207 = "원래는 아비도스 사막축제 때 쓰려고 준비했던 것들이라서?"
10012065-209 = "……선배……."
10012065-210 = "……거 봐."
10012065-211 = "노노미 쨩이 그런 얼굴을 지으니까, 내가 이런 이야기를 안 하는 거야."
10012065-212 = "시로코 쨩도, 아야네 쨩도, 세리카 쨩도 마찬가지지."
10012065-213 = "우리 귀여운 후배들은 쓸데없는 고민 같은 걸 안 했으면 좋겠거든. 지금만으로도 충분히 잘해주고 있다고."
10012065-214 = "……그런데 지금은 하셨네요."
10012065-215 = "그야 지금이니까. ……한여름 밤의 바다니까 말이야."
10012065-216 = "그러니 노노미 쨩도……. 알겠지? 그 표정은 여기서만 짓고 끝내는 거야. 약속?"
10012065-220 = "……네. 좋아요. 약속☆"
10012065-221 = "……음……."
10012065-222 = "그럼 말이 나온 김에, 이왕 오늘뿐인 기회니 조금 더 이어볼까요?"
10012065-223 = "'여기서만'이니까 말이죠."
10012065-224 = "으헤……. 더 하는 거야? 아저씨 슬슬 부담스러운데. 그만 하면 안 될까?"
10012065-225 = "안 돼요. 이 자리가 언제 다시 올지 알 수 없잖아요?"
10012065-226 = "그쵸? 선생님."
10012065-227 = "[s9] \"흥미진진한걸.\"\n[s10] \"뭐, 한여름 밤의 바다니까.\""
10012065-228 = "으으~. 선생!! 오늘은 계속 날 배신하는군……!"
10012065-229 = "으으~. 선생!! 오늘은 계속 날 배신하는군……!"
10012065-235 = "(이후 두 사람과 늦은 새벽까지 대화하다 그대로 잠들었다.)"
