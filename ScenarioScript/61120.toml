61120-380 = "우리는……."
61120-382 = "네. 하지만 세계의 어떤 곳은, 결코 그렇지 않죠."
61120-383 = "그리고 물론 그 아이들이, 그런 부분까지 세세하게 신경 쓸 수는 없을 겁니다."
61120-384 = "동정심을 내비치고, 가엾게 여길 수는 있겠죠. 하지만 그것도, 어떻게 보면 결국 자기만족입니다."
61120-385 = "……만일, 현세에 지옥이 이미 강림해 있다면."
61120-386 = "그 아이들은 지옥으로부터 눈을 돌리고 도망치려 할까요, 아니면 지옥과 맞서 싸우려 할까요."
61120-387 = "그리고."
61120-388 = "자기들이 그 지옥의 역사를 만든 장본인이라는 사실을, 언제까지 외면하려 할까요."
61120-389 = "어, 어어?! 선배, 괜찮으세요……?"
61120-390 = "지금, 표정이……!?"
