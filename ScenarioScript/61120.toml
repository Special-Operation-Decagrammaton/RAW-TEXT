[translation]
61120-1 = "12화;현장학습 2"
61120-3 = "선배, 여기예요! 저기 나무에……."
61120-8 = "으앙~ 내 고양이~ 으아앙~"
61120-9 = "미이이이……."
61120-14 = "나무 위에 아기 고양이가……?"
61120-15 = "그렇군요. 호기심에 올라갔다가, 내려오지 못하게 된 거네요."
61120-16 = "후후. 실제로 이런 광경을 보는 건, 저도 처음이군요."
61120-17 = "어떻게 하죠……? 저도 어떻게든 도와주려고 했는데, 잘 안돼서……."
61120-18 = "……."
61120-19 = "제게 방법이 하나 있어요. 여기에서는 아리우스식으로 해결하도록 하죠."
61120-20 = "잠시! 비켜 주세요!"
61120-24 = "냐아아악?!"
61120-25 = "와아아악?!?!"
61120-29 = "저, 저 학생, 뭐 하는 거야?!"
61120-30 = "아기 고양이가 올라간 가지에, 총을 쐈어!"
61120-34 = "샤아아앗!!!"
61120-37 = "아…… 고양이가 버티지 못하고 뛰어내렸어요!"
61120-42 = "잡았습니다. 이제 괜찮아요."
61120-45 = "자, 여기 고양이가……."
61120-46 = "히끅……."
61120-47 = "우애애애애앵~"
61120-48 = "어, 어어……?"
61120-49 = "하마터면 큰일 날 뻔했잖아요!"
61120-50 = "고양이가 만에 하나 다치거나, 더 큰 일이 났으면 어떻게 하려고 그랬나요! 학생!"
61120-51 = "그, 그렇지만……."
61120-52 = "한번 겁을 먹은 생물은, 좀처럼 움직이려 하지 않는 법이고……."
61120-53 = "그럴 때는 오히려 더 많이 공포를 줘서, 행동을 강제하는 편이……."
61120-54 = "도대체 어느 학원이길래, 그런 교육을……!"
61120-56 = "응? 그러고 보니 저 교표, 설마……?"
61120-57 = "확실해! 아리우스야……!"
61120-58 = "아리우스? 아…… 그 에덴 조약이던가 뭔가 하던 때에 소란스러웠던 애들?"
61120-59 = "그런 문제아들이, 이런 곳에 버젓이……?"
61120-64 = "……이래서 못 배운 아이들은……."
61120-65 = "저 아이들도 문제가 있지만, 키보토스의 교육에도 문제가 있는 게 아닐까……."
61120-66 = "학원 도시라고 세워진 곳이, 정작 학생들의 교육에 소홀하고 말이야……."
61120-67 = "하지만 다른 학원은 그렇게까지 큰 문제가 없잖아?"
61120-68 = "애초에 멀쩡한 학원에서 그 정도로 사고를 치려고 했겠냐고."
61120-69 = "그것도 그래. 키보토스에서 폭발 사고는 기껏해야 경범죄 취급이지만, 악의를 가지고 일을 저질렀다는 건 완전히 다른 문제지……."
61120-73 = "……."
61120-74 = "자, 우리 애기. 너무 저 사람들에게 가까이 가면 안 돼요."
61120-75 = "왜요……?"
61120-76 = "엄마 말 들으렴. 착하지?"
61120-77 = "알았어요……."
61120-83 = "으, 으으……."
61120-84 = "아아아아아……!"
61120-85 = "왜, 왜 그러나요?!"
61120-89 = "5일을 일했으니, 급여를 달라고?"
61120-91 = "그렇다면 너 학적이 없는 거나 마찬가지구만?"
61120-93 = "꺼져라. 의뢰를 받지 않겠다면, 너 따위와 더 이상 말을 섞고 싶지도 않아."
61120-95 = "[log]바깥에서라면[/log]"
61120-97 = "[log]무언가가 달라질 줄 알았어.[/log]"
61120-101 = "[log]도망친 곳에 낙원은 없다.[/log]"
61120-104 = "[log]그렇지만 꿈을 꾸고 싶었다.[/log]"
61120-107 = "[log]희망이라는 게 있다는 걸…… [wa:500]나도[/log]"
61120-110 = "정신 차려요!"
61120-114 = "선, 배……?"
61120-115 = "뭔가, 기억나네요."
61120-116 = "그날도 이랬던 것 같은데 말이죠."
61120-117 = "선배……."
61120-118 = "일단 일어나죠. 마이아."
61120-119 = "계속 이렇게 있으면."
61120-120 = "……"
61120-121 = "사람들이, 우리를 더 이상하게 볼 테니까요."
61120-122 = "선배, 저는."
61120-123 = "네. 알고 있어요. 이제 안전합니다."
61120-124 = "괜찮아요. 다 괜찮을 거예요."
61120-125 = "……"
61120-126 = "그렇지만, 잠시나마 저까지도 짧은 꿈을 꿀 뻔했네요."
61120-127 = "안되는데 말이죠. 반성해야겠어요. 저라도 언제나 정신을 제대로 차리고 있어야 하는데."
61120-129 = "[log]\"그렇게 될 수 있다면, [wa:500]정말 좋을 거야.\"[/log]"
61120-135 = "이것 참. 샬레의 선생님, 역시 만만한 분이 아니네요."
61120-136 = "네……? 선생님이, 왜요?"
61120-137 = "아닙니다. 아무것도 아니에요."
61120-138 = "선생님은 나쁘지 않은……."
61120-139 = "어떻게 보면, 좋은 어른이겠죠."
61120-140 = "하지만 모든 어른이 그럴 거라는 법은 없고, 모든 세상이 그럴 거라는 법도 없을 테니까요."
61120-141 = "선배……? 무슨 일, 있나요……?"
61120-142 = "아무 일도 없었어요."
61120-143 = "고양이는 어쨌든 무사히 내려왔고, 자기 주인에게 돌아갔잖아요."
61120-144 = "그러니까 이걸로 충분한 것 아닐까요?"
61120-145 = "그렇, 겠죠……?"
61120-146 = "네. 우리도 이만 돌아가죠."
61120-147 = "사람들이 또 몰려오기 전에요."
61120-150 = "홍차다, 홍차~"
61120-151 = "예전에는 그냥 따듯한 물이었는데…… 이제는 아니게 됐지……."
61120-152 = "모두 스바루 선배 덕분이야……."
61120-153 = "그래도 이런 곳에서 마시는 것도, 느낌이 다르네."
61120-154 = "오오…… 다들 바쁘게 지나가는데, 그걸 그냥 지켜보고 있는 이 기분……."
61120-155 = "좋구나!"
61120-160 = "후우……."
61120-161 = "[s] \"……? 왜 그래? 뭔가 안색이 안 좋은데?\""
61120-162 = "네, 네?! 아뇨. 아무것도 아니에요. 네!"
61120-163 = "[s] \"그러니……? 하지만–\""
61120-164 = "안녕하십니까. 선생님. 이런 곳에서 뵙는군요."
61120-166 = "그런데 이 학생분들은……?"
61120-172 = "안녕하세요, 선생님! 그리고 아직 이름을 모르는 여러분!"
61120-174 = "으, 으에에?!"
61120-175 = "아, 안녕…… 하세, 요……?"
61120-180 = "[ns] \"아닛? 자경단! 하라는 공부는 안 하고!\""
61120-181 = "아, 아닙니다! 열심히 하고 있어요! 순찰도 같이하는 것뿐이에요!"
61120-182 = "학업도 거리의 질서 수호도, 어느 쪽 하나 소홀히 해서는 안 되니까요!"
61120-183 = "어라……? 저 이런 말, 언젠가 했던가요……?"
61120-184 = "네. 했답니다, 레이사 씨."
61120-185 = "그렇군요! 다행이에요!"
61120-186 = "(뭐가 다행인지는 잘 모르겠지만요…….)"
61120-187 = "그보다 이분들은 누구신가요?"
61120-189 = "저, 저희는……."
61120-190 = "그러니까, 그게……."
61120-194 = "저희 역시, 선생님의 학생들입니다."
61120-196 = "네? 그렇지만 그건, 우리도 마찬가지인데요……?"
61120-197 = "……."
61120-198 = "아리우스 분들이군요. 그렇지요?"
61120-200 = "!!!"
61120-201 = "……."
61120-203 = "아리우스, 요……?"
61120-205 = "아, 네! 기억났습니다! 그런 일이 있었다는걸, 듣기는 했어요!"
61120-206 = "후후후. 그러고 보니 그때에도, 저 자경단의 에이스, 모두의 아이돌, 이 우자와 레이사가……!"
61120-207 = "네, 네에. 그런 일이 있었지요."
61120-208 = "아리우스 분들에 대해, 최대한 조심해서 요점만 이야기했습니다만…… 괜찮았을까요, 선생님?"
61120-209 = "[s] \"고마워. 정말 최고였어, 스즈미.\""
61120-210 = "네. 감사합니다."
61120-217 = "(트리니티에서는, 그 일과 아리우스를 그렇게 보고 있었군요.)"
61120-218 = "(……사람은 대부분, 자기 자신에게 유리한 방향으로 사태를 해석하는 법……. 그렇다고는 해도.)"
61120-219 = "(후후…….)"
61120-224 = "어쨌든 선생님도, 여러분도 잘 즐기고 계시는 것 같아, 다행입니다."
61120-225 = "네? 학생이라면 이런 게 당연한 것 아닌가요, 스즈미 씨?"
61120-227 = "……."
61120-229 = "어라……? 제가 뭔가 이상한 말을 했나요……? 그렇다면 사과드리겠습니다!"
61120-230 = "아뇨. 괜찮습니다. '당신들의 관점'에서 이건, '우리들의 문제'일 테니까요."
61120-231 = "……."
61120-232 = "그보다, 자경단이라고 하셨죠? 아무런 보상이 없는데도…… 이렇게 '순찰'을 하고 있는 건가요?"
61120-233 = "그렇습니다! 이른바 손이 닿지 않는 곳에서의 정의, 라는 겁니다!"
61120-234 = "레, 레이사 씨……?"
61120-235 = "그거 대단하네요."
61120-236 = "약간, 한가해 보이기도 하지만요."
61120-237 = "네! 트리니티라든가 아리우스라든가, 저는 솔직히 잘 모르겠습니다!"
61120-238 = "그냥 저희가 이렇게 하고 싶으니까, 하고 있을 뿐이죠."
61120-239 = "……."
61120-240 = "그러니…… 여기에서도 역시, 저희들 멋대로 여러분을 돕고 싶습니다!"
61120-241 = "네……?"
61120-242 = "어떻, 게요……?"
61120-243 = "이런 식으로요!"
61120-245 = "이것도 보실래요? 그때 스케반 분들이 길에 함정을 파고, 통행료를 갈취하려고 해서……."
61120-246 = "제가 스케반 분들을 함정에 머리부터 집어넣은 사진입니다!"
61120-250 = "우와……. 사람이 거꾸로 파묻혔다가 꺼내지면, 이런 모습이 되는구나……."
61120-251 = "완전 웃겨! 아하하하!"
61120-252 = "그리고 말이죠……. 이 사진은요–!"
61120-257 = "빠르게 친해지셨네요. 다행입니다."
61120-258 = "레이사 씨는 조금 과도하게 활달한 부분이 있습니다만……."
61120-259 = "그 점이, 오히려 여기에서는 도움이 된 것 같군요."
61120-260 = "……."
61120-261 = "……."
61120-262 = "어라, 여러분은……?"
61120-263 = "저나 레이사 씨가 무언가…… 결례를 저질렀다면……"
61120-268 = "읏……."
61120-269 = "[s1] \"괜찮아, 스즈미. 괜찮아.\"\n[s2] \"모두가 그렇게 쉽게 친해지기는, 어려운 법이지.\""
61120-272 = "그건 그렇겠습니다만……."
61120-273 = "역시, 마냥 마음이 편하지만은 않네요."
61120-279 = "괜찮나요, 여러분? 어떤 분들은 벌써, 저 레이사 씨라는 분과 이야기를 잘 나누고 있는 것 같은데요."
61120-280 = "선배, 저희는……."
61120-281 = "뭔가, 좀처럼……."
61120-282 = "……."
61120-284 = "안녕하세요! 우자와 레이사입니다! 성함이…… 스바루 씨라고 하셨죠?"
61120-286 = "……."
61120-290 = "네. 그렇습니다. 정식으로 인사드려야겠네요. 안녕하세요, 레이사 씨. 그리고 스즈미 씨."
61120-291 = "그, 죄송합니다. 저희 자경단이 만일 실례를 했다면……."
61120-292 = "아닙니다. 실례라니요."
61120-293 = "……오히려 어떤 의미로는, 이 자리에 실례를 범하고 있는 것은 우리들일지도 모르는 일이고요."
61120-294 = "네? 저는 잘 모르겠는데요? 오히려 여러분을 만날 수 있어서 정말 좋습니다!"
61120-295 = "……."
61120-296 = "말씀만이라도, 기분이 좋아지네요."
61120-297 = "마치 살다 보면, 모든 게 잘 풀리지 않을까, 하는 대답을 들은 기분이에요."
61120-298 = "저도 그렇게 생각합니다! 세상에는 사랑도 있고, 평화도 있으니까요!"
61120-299 = "……."
61120-300 = "그냥 한번 여쭤보는 건데요. 분명 사랑도 있고 평화도 있겠습니다만."
61120-301 = "그 모든 게 잘 안되면, 어떻게 해야 할까요?"
61120-302 = "네……?"
61120-306 = "[ns] \"…….\""
61120-308 = "갑자기 왜 그런 무시무시한 이야기를 하느냐고요? 음…… 그냥요?"
61120-309 = "화제를 꺼내는 데에, 딱히 특별한 이유 같은 건 없는 거잖아요?"
61120-313 = "[ns3] \"스즈미가 한번 이야기해 줄래?\"\n[ns4] \"자경단의 입장으로서 말이야.\""
61120-316 = "제가…… 말입니까? 으음……."
61120-317 = "알겠습니다, 선생님. 최선을 다해 보겠습니다."
61120-318 = "스바루 씨. 저희도 항상, 만사가 잘 풀릴 거라고 확신하면서 살아가는 것은 아닙니다."
61120-319 = "당연하게도 무언가가 잘될 때보다, 그렇지 않을 때가 더 많겠죠. 그건 어떤 의미로는, 어쩔 수 없는 것일 겁니다."
61120-320 = "그렇지만 그렇다고 해도, 그저 믿을 뿐입니다."
61120-321 = "저희는, 그런 이상을 품고 살아가니까요."
61120-322 = "……이상, 이군요."
61120-323 = "네."
61120-324 = "물론 지금 당장 여기에서 그 이상이 이루어지기는 어렵겠지만……."
61120-325 = "그래도 거기에 한 발짝이라도 더 다가갈 수 있다면, 그것으로 충분한 것이 아닐까, 생각합니다."
61120-326 = "조금씩 나아가다 보면 언젠가는, 우리 모두 그 자리에 다다를 가능성이 약간이라도 더 올라갈 테니까요."
61120-327 = "그렇기에 정의는, 그 자체로 보상입니다. 거기에 다른 보수나 대가 같은 것은…… 아직은, 필요하지 않다고 생각합니다."
61120-328 = "맞습니다! 그런 거죠! 역시 스즈미 씨네요!"
61120-329 = "하하. 그렇군요. 많은 도움이 되었습니다."
61120-333 = "(정말로 낙관주의적이군요. 좋은 일이죠. 일반적으로는요.)"
61120-334 = "(낙관주의는, 그렇게 생각하는 것이 가능한 환경에서나 자라날 수 있다는 사실만 제외하면요.)"
61120-340 = "저, 선배……?"
61120-341 = "네?"
61120-342 = "아하…… 네. 알겠습니다."
61120-343 = "선생님. 잠시만 실례하겠습니다. 자경단 여러분도요."
61120-344 = "저와 이 아이들만 잠시, 따로 이야기 좀 하고 올게요."
61120-345 = "[s] \"응? 으, 응. 그래…….\""
61120-353 = "무슨 일인가요?"
61120-354 = "……라고 물어볼 수도 있지만, 짐작은 가네요."
61120-355 = "버티기 힘들었나요?"
61120-356 = "……네."
61120-357 = "이것도 어떻게 보면, '수업'의 영향일지도 모르겠어요……."
61120-358 = "수업이요? 그건 무슨 의미죠?"
61120-359 = "지금 저 자경단이라는 학생들과 친해진 아이들, 보통 수업에 흥미를 보이던 아이들이거든요."
61120-360 = "하지만 저희는……."
61120-361 = "머리로는 알 것 같은데, 왠지 모르게……."
61120-362 = "저런 이야기를 듣고 있으면, 어째서인지 화가 나서……."
61120-363 = "……전부, 저희가 못된 아이들이기 때문이겠지요……."
61120-364 = "아뇨. 그렇지 않아요."
61120-368 = "어떻게 보면 그건 당연하기까지 한 일이에요. 적어도 저는 그렇게 생각합니다."
61120-369 = "그 아이들이 상상도 못 할 세계를, 우리는 살아왔으니까요."
61120-370 = "선배……!"
61120-371 = "결국 모든 것이 다 잘될 거라고 믿는 것은, 쉬운 일입니다."
61120-372 = "세상에는 죄가 없고, 지금 당장 구부러진 것이, 언젠가는 모두 곧게 펼쳐질 것이라고 믿는 것 역시요."
61120-373 = "……그리고 제가 아는 한, 쉬운 일은 보통, 그렇게까지 잘 들어맞지 않는 경우가 대부분입니다."
61120-374 = "알고 있나요? 요즘의 부자는, 선하다고 하더군요."
61120-375 = "성격도 좋고, 착하고, 순하기까지 하다고요."
61120-376 = "그리고 그 이유는 보통…… 그 사람들에게 부족한 것이 없기 때문이죠."
61120-377 = "그 사람들의 눈에 비치는 세계는, 평화롭고 아름다울 테니까요."
