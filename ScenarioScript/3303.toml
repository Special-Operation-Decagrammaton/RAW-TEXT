[translation]
3303-1 = "멀리 휘두르며 3"
3303-2 = "게헨나 자치구 2군 스타디움"
3303-4 = "생각보다……"
3303-5 = "경기장에 사람이 많지 않은 것 같군요."
3303-6 = "네. 오늘 경기는 월요일 경기인 데다가 신입 선수들이 주로 출전하는 2군 리그의 경기니까요."
3303-7 = "갑자기 스미레 선배가 야구 경기를 보러 가자고 해서 이곳으로 오긴 했지만……"
3303-8 = "……그래도 모처럼 경기장에 오니 기분이 좋네요."
3303-9 = "특히 2군 리그의 경기는 쾌적한 관람 분위기와 선수진과 가까운 관중석 거리가 특징이거든요."
3303-10 = "그래서 일부러 2군 시합만 찾아다니는 야구팬들도 꽤 있답니다."
3303-11 = "……그렇군요."
3303-12 = "그나저나 손에 들고 계신 그 음식은……"
3303-13 = "……네? 핫도그인데요?"
3303-14 = "레이 양, 엄격한 식습관을 강요할 생각은 없습니다만, 지방이 풍부한 가공식품은 소화를 방해해 트레이닝의 효과를 크게 떨어트릴 수 있습니다."
3303-15 = "혹시라도 배가 고프시다면 최소한 탄수화물과 단백질이 적절하게 포함된 프로틴 바를 드시는 편이—"
3303-16 = "하지만 모처럼 게헨나 자치구의 스타디움에 왔는데, 이 특제 불지옥 핫도그를 먹지 않을 수는 없잖아요?!"
3303-17 = "불지옥 핫도그요……?"
3303-18 = "네. 대부분의 야구장에서는 경기를 관람하면서 식사를 해결할 수 있도록 간단한 간식이나 음료수를 팔고 있거든요."
3303-19 = "대부분은 평범한 스낵이나 청량음료뿐이지만, 일부 스타디움에서는 홈 팀의 특색을 살린 명물 음식도 취급하고 있어서……"
3303-20 = "게헨나 자치구의 야구장에서는 매콤한 특제 소시지를 넣은 불지옥 핫도그를 팔고 있는데, 이게 또 별미라고요."
3303-21 = "각 학원의 스타디움마다 취급하는 음식이 조금씩 다르기 때문에, 이 식도락을 찾아다니는 것도 야구 관람의 또 다른 묘미죠!"
3303-23 = "뭐…… 핫도그 한 개 정도면 넘어갈 수 있겠지만……"
3303-24 = "아, 핫도그에 칠리소스를 안 뿌렸네."
3303-28 = "그래도 소시지 자체에 시즈닝이 충분히 되어 있어서 그냥 먹어도 제법 매콤하네요."
3303-29 = "핫도그를 한 입 베어 물고, 진저에일로 입을 씻어내면……"
3303-34 = "크으…… 바로 이거야!"
3303-36 = "아, 선배도 원하시는 음식이 있으면 주문하세요! 모처럼이니 제가 한턱 내겠습니다."
3303-37 = "그럼 저는…… 무염 닭가슴살 샐러드를."
3303-38 = "야구장에서 그런 건강한 음식을 팔 리가 없잖아요?"
3303-44 = "……경기가 시작된 모양이군요."
3303-45 = "그러고 보니 게헨나 선수들이 뛰는 경기를 직접 보는 건 처음인데, 게헨나 야구부는 강한 편인가요?"
3303-46 = "글쎄요. 학원의 명성에 비하면 약체인 편입니다만……"
3303-47 = "선수들의 피지컬 자체는 나쁘지 않지만 팀워크가 좋지 못해서 협동 플레이가 부실한지라."
3303-48 = "물론 약체에 2군 팀이라고는 해도 밀레니엄 야구부보다는 훨씬 강하지만요……"
3303-49 = "그래도 모처럼 직관을 하러 왔으니, 소속은 잠시 잊고 열심히 응원에 집중해야죠!"
3303-53 = "가자, 게헨나! 날려버려!"
3303-57 = "타석에 들어선 게헨나의 2번 타자. 직구로 들어온 공을…… 쳤습니다!"
3303-58 = "좌중간 외야에 떨어진 안타! 1루를 거쳐 2루로 달려갑니다만……"
3303-59 = "……욕심이 과했던 탓일까요? 아웃 되고 맙니다!"
3303-60 = "크으, 멋진 2루타를 칠 기회였는데…… 아쉽네요."
3303-61 = "수비수의 손이 닿기 전에 베이스를 밟아야 한다면……"
3303-62 = "베이스 위에 서 있는 2루수를 스크류 스핀 슬라이딩으로 걷어차면 안 되는 겁니까?"
3303-63 = "당연히 안 되죠!"
3303-65 = "(이후, 레이의 열띤 응원에도 불구하고 게헨나 야구부는 경기에서 아쉽게 패배하고 말았다……)"
3303-68 = "……아쉬운 경기네요. 마지막에 상대 선수가 슈퍼 세이브만 하지 않았더라도 이길 수 있었을 텐데."
3303-69 = "저 역시도 그렇게 생각합니다."
3303-70 = "제가 주자였더라면 숄더 차지로 수비수를 제치고 진루를 했을 텐데요."
3303-71 = "게헨나의 타자는 좀 더 삼각근을 단련하는 게 좋을 것 같습니다."
3303-72 = "선배, 진짜 야구 규칙 제대로 이해하고 있긴 한 건가요……?"
3303-73 = "여하튼 오랜만에 다른 사람과 함께 스포츠 경기를 관람하러 오니 좋군요."
3303-74 = "피트니스 클럽에서 묵묵히 근육을 단련하는 것도 좋지만, 직접 몸을 부딪치며 훈련의 성과를 증명하는 스포츠를 보고 나면 트레이닝에 대한 의욕도 한결 더 높아지니까요."
3303-75 = "정말…… 선배는 트레이닝밖에 모르는 것 같네요."
3303-76 = "그래서…… 레이 양."
3303-77 = "마지막으로 본 홈런의 풍경은 떠올랐나요?"
3303-83 = "……네."
3303-84 = "그날의 스타디움도 오늘의 경기처럼 관중은 많지 않았지요."
3303-86 = "누군가는 맛있는 음식을 찾아, 누군가는 좋아하는 선수의 사진을 찍기 위해, 누군가는 새로운 유망주를 발굴하기 위해. 모두가 각기 다른 이유로 경기장을 찾아왔지만……"
3303-87 = "홈런이 터지는 그 순간만큼은 모두가 숨죽여 타자를 주시하고 있었어요."
3303-89 = "담장을 향해 뻗어가던 공의 궤적도 아름다웠지만, 아무런 방해도 없이 고고하게 그라운드를 도는 타자의 모습이…… 멋지다고 생각했어요."
3303-90 = "그런데 참, 이상하지요. 정작 매일 홈런을 이야기하면서 그 광경을 까맣게 잊고 있었다니."
3303-92 = "운동에서 목표를 설정하는 것은 중요하지요."
3303-93 = "체중을 몇 kg 감량한다든가, 멋진 근육질 몸매를 만든다든가 하는 목적이 없다면 운동은 단순한 고통의 연속일 뿐이니까요."
3303-94 = "하지만 그 목표를 이루는 데 급급해서 과정을 놓치면 그 목표의 가치도 퇴색되게 됩니다."
3303-95 = "체중을 감량하려는 사람이 단순히 체중계의 기록을 바꾸고자 하는 게 아닌 것처럼, 레이 양도 그저 공을 멀리 날리고 싶어서 야구부에 들어온 건 아닐 테니까요."
3303-96 = "야구의 즐거움이 여러 가지 요인에서 오는 것처럼, 트레이닝의 즐거움도 여러 가지 방식이 존재한답니다."
3303-97 = "그러니 오늘의 트레이닝을 피하지 말고, 홈런을 향한 여정이라 생각하며 즐겨보는 건 어떨까요."
3303-98 = "레이 양. 저와 함께 트레이닝을 계속하시겠어요?"
3303-103 = "……네, 선배!"
3303-107 = "밀레니엄 피트니스 클럽"
3303-110 = "……그래도 이건 아니라고요!"
3303-112 = "무슨 문제라도 있으신가요, 레이 양?"
3303-113 = "도대체 뭔가요, 이 족쇄 같은 기계 장치는!"
3303-114 = "아, 이번에 제가 새로 구입한 스쿼트 머신을 시험해 보고 계셨군요."
3303-115 = "이 스쿼트 머신으로 말씀드리자면, 엔지니어부에 특별히 발주하여 만든 시제품으로 세트를 완료할 때까지 다리가 빠지지 않도록 고정하는 장치가 포함되어 있습니다."
3303-116 = "덕분에 의지가 약한 회원님도 끝까지 트레이닝을 지속할 수 있고, 구속 장치가 자연스럽게 자세를 교정해 주기 때문에 올바른 자세로 스쿼트를 지속할 수 있게 만들어주지요!"
3303-117 = "원할 때 운동을 그만둘 수 없다면 그냥 고문 기구잖아요?!"
3303-118 = "게다가 타율을 높일 수 있는 훈련이라고 했으면서…… 하체를 단련하는 게 타율과 무슨 상관이 있는데요!"
3303-119 = "공을 던지고 배트를 휘두를 때도 하체 근육은 중요한 역할을 합니다."
3303-120 = "공에 체중을 싣기 위해서는 관절을 고정하는 코어 근육이 받쳐줘야 하는 만큼, 불균형한 근육 트레이닝은 쉽게 부상으로 이어질 수 있으니까요."
3303-121 = "말이 나온 김에 오늘은 하체 단련 위주로 트레이닝 코스를 짜 볼까요?"
3303-134 = "자, 지금 하고 있는 스쿼트가 끝나면 바로 이어서 런지를 하도록 하죠!"
3303-139 = "진짜……"
3303-140 = "다음 시즌이 시작되고 나면 절대로 안 돌아올 거야—!"
3303-141 = "멀리 휘두르며"
