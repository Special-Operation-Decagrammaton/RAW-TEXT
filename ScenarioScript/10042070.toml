[translation]
10042070-1 = "제7화;LAST GIRL STANDING"
10042070-4 = "주리 씨?!"
10042070-9 = "안 됩니다. 치나츠. 분명 같이 휘말려서 빨려 들어가는 전개입니다."
10042070-10 = "생각해 보면 분명히 그렇기는 합니다만……!"
10042070-11 = "므압-! 마아압-!!!"
10042070-12 = "……저렇게 되지는 말아야 하지 않겠습니까."
10042070-13 = "그것도 틀린 말씀은 아니긴 한데요……."
10042070-32 = "여기야!"
10042070-36 = "그래…… 네가 봐야 할 곳은 여기라고!"
10042070-37 = "자! 나를 봐!! 그리고 이 이상 날뛰고 싶다면……!!!"
10042070-39 = "나를 뭉개고 지나가야 할 거야!!!"
10042070-43 = "……멈췄어……!?"
10042070-44 = "[ns] \"이것은……!\""
10042070-45 = "포격의 타이밍을 잡기 위해 자처한 희생……."
10042070-46 = "이것은 진심으로 흥미로운 일이로군요. 팝콘이라도 가져올까요?"
10042070-47 = "어떻게 그렇게 감동적일 수 있는 장면을, 가장 차갑게 표현할 수가 있는 거야……?"
10042070-51 = "……!! 주리가……!!"
10042070-52 = "주리 씨……!!"
10042070-53 = "……(우적우적)."
10042070-59 = "선생님, 됐어요!"
10042070-61 = "[ns1] \"주리를 잡느라 멈췄다……!\"\n[ns2] \"지금이야! 발포해야 해!\""
10042070-64 = "하, 하지만 포격 권한을 가지고 있는 사람이……!"
10042070-65 = "선임행정관의 입이 촉수에 묶여 막혀 있네요. 거기에 지금은 기절한 상태 같으니……."
10042070-66 = "그 권한의 인계라도 일어나지 않는 한, 포대는 침묵한 채로 남아 있을 수밖에 없을 것 같습니다."
10042070-67 = "그게 말이 돼!? 너도 선도부잖아!? 대신 명령하면 안 되는 거야!?"
10042070-68 = "그게……. 저도 마음은 굴뚝같지만……."
10042070-69 = "모르셨군요. 원래 군대와 병원은 답답해야 돌아가는 곳입니다."
10042070-70 = "그걸 말이라고 하면 안 되지 않을까?!?!"
10042070-71 = "상황은 들었어."
10042070-72 = "아코가 갑자기 일을 벌였다기에, 무슨 일인가 했더니……."
10042070-73 = "[ns] \"이 목소리는!\""
10042070-75 = "지금, 아코에게 부여되었던 포격 부대의 운용 및 사격통제권한을 샬레의 선생에게 인계한다."
10042070-76 = "동원 부대는 모두 작전이 끝날 때까지 선생의 지시를 따르도록. ……이상."
10042070-77 = "[s3] \"히나!\"\n[s4] \"나이스 타이밍……!!\""
10042070-84 = "시간이 별로 많지 않은 것으로 보이네. 그러면, 선생."
10042070-85 = "현장의 지휘를 부탁할게."
10042070-86 = "……아, 그리고."
10042070-87 = "도움이 될 사람을, 하나 깨워서 보내 뒀어."
10042070-88 = "도움이 될 사람……?"
10042070-89 = "그건, 혹시!"
10042070-95 = "복귀했다!!!"
10042070-96 = "이번에는 방심하지 않아……. 빚은 확실히 갚아 주겠어!"
10042070-97 = "과연, 복선의 회수라는 것입니까."
10042070-98 = "네. 정말로 모두가 모였군요."
10042070-99 = "그러면 부탁드립니다. 선생님."
10042070-103 = "[ns] \"준비된 사수로부터–\""
10042070-105 = "[ns] \"–발사!!!\""
10042070-116 = "거대 팬케이크의 움직임이 명백하게 잦아들었습니다."
10042070-117 = "그렇지만 일종의 '마무리'가 필요해 보이는 시점이기는 하군요."
10042070-118 = "네. 포병의 지원 사격 후 일제 돌격은, 매우 정석적인 전술이기도 합니다."
10042070-119 = "[s5] \"그래. 알았어.\"\n[s6] \"이 전쟁을, 끝내러 가자.\""
