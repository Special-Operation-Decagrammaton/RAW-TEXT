[translation]
90002025-2 = "해냈다!"
90002025-3 = "정말이야…… 물러가기 시작했어!"
90002025-4 = "더 몰려오는 기색도…… 지금은, 없네요……. 휴우……."
90002025-6 = "감사합니다, 에이미! 에이미가 아니었다면 엄청나게 힘들었을 겁니다!"
90002025-7 = "아냐. 이런 현장 일은 익숙하기도 하고. 무엇보다……."
90002025-8 = "나를 여기에 배치한 선생님의 판단이, 더 주효한 것이었겠지."
90002025-12 = "선생? 들려? 지금 막 엔진의 긴급 복구를 완료했어."
90002025-13 = "저도 있습니다. 신속하게 칭찬 부탁드리겠습니다."
90002025-14 = "[s] \"리오도 토키도, 수고 많았어!\""
90002025-15 = "감사합니다. 역시 좋은 일을 하면 기분이 좋군요."
90002025-17 = "네. 확인했습니다. 현재 수송선의 기능은 어디까지 회복된 상황인가요, 케이?"
90002025-18 = "일단 비행은 가능할 거예요. 여기에서 추가 손상을 입는다면 이야기가 달라지겠지만……."
90002025-25 = "선생님! 히마리 선배! 케이! 아리스입니다. 모두 무사합니다!"
90002025-26 = "고생 많았어요. 게임개발부 여러분. 그리고 에이미."
90002025-27 = "말이 나온 김에 말인데요. 우리를 습격해 온 데카그라마톤의 신규 병력의 잔해를, 회수할 수 있겠나요?"
90002025-28 = "응. 이번에는 가능해 보여. 얼마나 필요해? 한 스무 개?"
90002025-29 = "……그렇게 많이 가져왔다가는 우리 수납공간도 부족해질걸요……."
90002025-31 = "선외 카메라, 재기동 가능합니다. 화면 송출할게요."
90002025-37 = "이건……."
90002025-38 = "……."
90002025-39 = "[s] \"…….\""
90002025-41 = "[ns] \"저기가, 강철대륙인가…….\""
90002025-44 = "다음화;출격"
