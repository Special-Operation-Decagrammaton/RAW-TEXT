[translation]
10023095-2 = "이쪽입니다!"
10023095-3 = "헉, 헉……! 어쩌다 이런 일이 된 것인지……!"
10023095-12 = "평안하신지요. 좋은 밤이네요."
10023095-13 = "드디어 나타난 것이냐…… 자애의 괴도!"
10023095-14 = "어머나, 그렇게 경어까지 버리며 격하게 환영해 주셔도, 곤란하답니다?"
10023095-15 = "설마 진짜로 <시계왕의 왕관>을 노리고 있었을 줄은……!"
10023095-16 = "그 정도는 예상하고 있지 않았나요?"
10023095-17 = "시끄러워! 이건 내 것이다…… 정당한 대가를 치르지 않는 한, 누구에게도 넘겨주지 않아!"
10023095-18 = "아뇨. 그 왕관은 당신 것이 아니에요. 언제가 될지는 알 수 없지만, 모두의 것이죠."
10023095-19 = "당신처럼 취향이랄 것도 없는 졸부의 손에는 1초라도 들려 있기 아까운 예술품이기도 하고요."
10023095-20 = "네 녀석의 궤변은 이제 질렸다! 쳇…… C&C 녀석들, 소문만 무성했지 아무것도 아니었군."
10023095-21 = "그 C&C에게도 정확한 사실을 알려 주지 않았으면서, 어떻게 제대로 된 경호를 받을 수 있을 거라고 생각했는지 신기하네요."
10023095-22 = "애초에 그 학생들이 정말 C&C인지 어떤지도 제대로 알아보지 않았던 것 같지만요."
10023095-23 = "뭐라고? 무슨 뜻이냐?"
10023095-24 = "아뇨, 아뇨. 장물 거래와 경매로 여기까지 온 분에게, 자기 자신 이외의 다른 것은 애초에 관심의 대상이 아니었겠지요."
10023095-31 = "으아앗?!"
10023095-35 = "모두, 지금이야!"
10023095-36 = "왕관을 확보해야 해, 언니!"
10023095-38 = "그, 그렇게 내버려 둘 것 같나!"
10023095-39 = "경비대!"
10023095-45 = "전력으로 대응합니다."
10023095-47 = "빛이여!"
10023095-58 = "왕관……! 왕관은 내 것이다……!"
10023095-65 = "응? 여기에 웬 상자가……"
10023095-66 = "서, 설마?!"
10023095-71 = "더 이상…… 도망칠 곳은 없어요. 메이타로 씨……"
10023095-72 = "왕관을…… 건네주세요. 그러면 아무도 다치지 않을 거예요……"
10023095-73 = "웃기지 마라! 나는 절대로 굴복하지 않을 거다!"
10023095-74 = "…… 어쩔 수 없네요……"
10023095-75 = "지금이에요."
10023095-83 = "허, 헉?!"
10023095-84 = "처음부터 이렇게 했으면 빨랐을 텐데 말이에요."
10023095-85 = "최소한…… 설득 비슷한 것이라도, 해 보고 싶었으니까요……"
10023095-98 = "<시계왕의 왕관>…… 무사히 회수했습니다……"
10023095-99 = "다행이야……"
10023095-101 = "뽜밤뽜밤! 동료들과 모두 힘을 합쳐 보물을 되찾았습니다!"
10023095-102 = "장물의 추적과 회수, 확실하게 달성했습니다. 이것으로 제 서브 미션도 무사히 완료되었군요."
10023095-104 = "C&C 녀석들……! 자애의 괴도와 아예 한편이 된 것인가! 부끄러움도 모르는 놈들 같으니!"
10023095-106 = "그건 어떨까요. 정말로 부끄러움을 모르는 것은."
10023095-107 = "C&C에게 의뢰를 한다는 명목하에, 이런 식으로 음모를 꾸며 사람을 속이려고 들다니……."
10023095-108 = "저 아스마 토키가 당신을 구속하겠습니다."
10023095-109 = "우, 웃기지 마!"
10023095-110 = "여기서 잡힐 것 같으냐!!"
10023095-114 = "앗, 도망쳤어!"
10023095-115 = "바로 쫓도록 하겠습니다."
10023095-120 = "후후, 네, 그럼 토키 씨 대신 이건 제가 감사히 받아 가도록 하지요."
10023095-124 = "콜록, 콜록! 기침이 나올 정도로 짙은 연막이…… 앞이 보이지 않아……!"
10023095-125 = "여기서 연막을 터트렸다는 건 설마……?!"
10023095-126 = "유, 유즈 쨩! 왕관 조심해!"
10023095-128 = "으, 응……! 꼭 쥐고 있으니까……!"
10023095-130 = "글쎄요. 그게 과연 왕관일까요?"
10023095-131 = "어, 어……?"
10023095-136 = "이건……"
10023095-137 = "놋쇠 뭉치잖아!"
10023095-138 = "……?! 어느새……!"
10023095-144 = "수고하셨어요. 여러분."
10023095-145 = "<시계왕의 왕관>. 확실히 받아 갑니다."
