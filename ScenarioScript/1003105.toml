[translation]
1003105-1 = "당신과 함께 첫걸음을"
1003105-2 = "(아루의 연락을 받고 약속 장소로 향한다.)"
1003105-6 = "(새해 첫날 아침의 거리는, 평소보다 더욱 조용하고 깨끗했다.)"
1003105-8 = "(평소보다도 더욱 투명한 풍경.)"
1003105-9 = "(그래서일까. 여느 때보다 싸늘한 냉기가 피부를 찔러온다.)"
1003105-12 = "(이른 아침. 코끝과 뺨이 빨개질 정도로 추운 날씨.)"
1003105-14 = "(옷 속을 파고드는 냉기에, 얼마나 종종걸음으로 걸고 있었을까.)"
1003105-15 = "(마침내 약속 시간에 맞춰 도착한 새해맞이 행사장에서……)"
1003105-20 = "늦었잖아. 선생님."
1003105-21 = "[s] \"앗, 미안해. 그건 그렇고…….\""
1003105-22 = "흐응? 뭐야, 선생님의 그 얼빠진 표정."
1003105-23 = "후후훗, 뭔가 하고 싶은 말이라도 있는 것처럼 말이야."
1003105-25 = "(힐끔)"
1003105-26 = "…………(힐끔)"
1003105-27 = "[s1] \"그게, 아루 저번에 미처 말하지 못했지만…….\"\n[s2] \"역시, 그 옷차림새…….\""
1003105-28 = "으으음, 자, 잠깐!"
1003105-29 = "으으음, 자, 잠깐!"
1003105-32 = "(바, 방금 그 침묵은 뭐야. 괘, 괜히 가슴이 떨리잖아! 으응, 아, 아냐! 취소! 아직, 아직이야!)"
1003105-33 = "(아, 아직 충분히 마음의 준비가 되지 않았으니까. 이건 다음에! 다음에 하는 걸로!)"
1003105-36 = "그, 그 이야기는 좀 있다 나중에 하자. 그보다 급한 게 있으니까."
1003105-37 = "[s] \"급한 거?\""
1003105-38 = "이렇게 이른 아침부터 선생님을 부른 이유가……."
1003105-39 = "오늘 여기에서 선생님과 같이 새해 인사를 하고 싶었어."
1003105-40 = "여기가 그렇게 영험한 곳이래. 밑져야 본전이긴 하지만……, 선생님. 어울려줄래?"
1003105-41 = "[s] \"그래.\""
1003105-42 = "응, 그럼 가자, 선생님!"
1003105-45 = "[wa:200]― 후후, [wa:1500]걷는 게 느리잖아. [wa:1450]선생님."
1003105-47 = "― 응? [wa:1050]내가 빠르다고? [wa:2800]그런 게 아니야."
1003105-50 = "― 뭐, [wa:1000]언제 어디서나 [wa:1350]약속에 늦지 않으려고"
1003105-52 = "― 평소부터 신경 쓰고 있을 뿐이니까. [wa:2700]사장으로서."
1003105-55 = "[wa:750]― 일찍 일어나는 새가 [wa:600]벌레를 잡는다……."
1003105-58 = "[wa:150]― 올해 흥신소는,"
1003105-60 = "[wa:100]― 작년 이상으로 [wa:600]기민하게, [wa:650]적극적으로 움직일 거야."
1003105-63 = "[wa:200]― 물론, [wa:850]선생님도 함께야."
1003105-66 = "― 우리 흥신소의 활동은,"
1003105-68 = "― 이제 동업자인 [wa:800]선생님 없이 한다는 건 [wa:1450]말이 되지 않으니까."
1003105-71 = "[wa:800]― 그렇게 함께 [wa:750]일하는 시간이,"
1003105-73 = "― 앞으로도 쭉, [wa:1850]계속 이어졌으면 좋겠네."
1003105-76 = "― ……어, [wa:750]어디까지나 [wa:700]업무! [wa:750]업무 쪽의 이야기니까!"
1003105-79 = "[wa:150]― (아, [wa:900]안 돼. [wa:1500]지금 [wa:550]내가 무슨 말을 하고 있는 건지,"
1003105-81 = "― 스스로도 [wa:400]잘 모르겠어……!)"
1003105-88 = "오늘 이렇게 아침부터 나와줘서 고마워. 선생님."
1003105-89 = "날이 제법 추웠는데, 어때. 괜찮아?"
1003105-90 = "[s] \"응, 괜찮아.\""
1003105-91 = "아, 그래……."
1003105-92 = "그, 그럼 볼일도 전부 끝났겠다. 자, 어, 어서 돌아갈까? 아하하……."
1003105-93 = "[s] \"아루.\""
1003105-94 = "으, 응? 왜, 선생님?"
1003105-95 = "[s3] \"그 옷, 굉장히 잘 어울려.\"\n[s4] \"오늘의 아루, 굉장히 예뻐.\""
1003105-96 = "……!"
1003105-97 = "……!"
1003105-101 = "후후훗. 당연하지. 누가 뭐라 해도 나는 흥신소 68의 리더니까."
1003105-107 = "칭찬, 고마워. 선생님."
