[translation]
10023100-1 = "제10화;주목해 주세요. 중요한 부분입니다."
10023100-3 = "……처음부터 이럴 생각이었군요."
10023100-4 = "어머나. 우리는 서로 각자의 가치를 추구했을 뿐이에요."
10023100-5 = "그것이 당신에게는 미션이었고, 저에게는 이 <시계왕의 왕관>을 비롯한, 예술품들이자 미학이었던 것뿐이었죠."
10023100-6 = "평소에도 이런 식입니까?"
10023100-7 = "이런 식이라는 건 어떤 의미죠?"
10023100-8 = "목적을 위해서라면 수단과 방법을 가리지 않는 것? 필요하다면 동맹과 배신을 손바닥 뒤집듯이 쉽게 반복하는 것?"
10023100-9 = "그도 아니면 자신이 믿는 바를 위해 다른 모든 것을 포기하는 것?"
10023100-10 = "……"
10023100-11 = "굳이 대답을 원하신다면, 말씀드리기로 하죠."
10023100-12 = "그 전부예요."
10023100-14 = "이해할 수 없군요."
10023100-15 = "어머나. 기대하지도 않았어요."
10023100-16 = "저를 이해할 수 있을 거라고 말했던 자들이 몇몇 있었지만, 마지막에는 모두 똑같은 말을 남기고 떠나갔죠."
10023100-17 = "이해할 수 없다. 용서할 수 없다. 너는 괴물이다……"
10023100-18 = "당신들도 마찬가지겠죠. 거기 계신 선생님도요."
10023100-19 = "다른 해결 방법도, 충분히 있을 수 있다고 생각합니다만."
10023100-20 = "그러면 하나 묻죠. 왕관을 제가 가져가지 않는다고 가정하고, 그 후에 왕관은 어떻게 되는 걸까요?"
10023100-21 = "메이타로의 신변이 확실히 구속되고, 혐의가 입증될 때까지는…… 발키리의 압류품 보관소에 남겨지게 되겠지요."
10023100-22 = "그렇군요. 공유되어야 할 예술품이, 그런 곳에서 먼지를 뒤집어쓰며 남겨지게 된다는 이야기이지요?"
10023100-24 = "……그러고나면 분명히, 박물관 같은 곳에서 한정적으로 공개되지 않을까 하는데?"
10023100-26 = "그렇겠지요. 그 예술품의 진정한 가치도 알아보지 못하는 이들의 손에 의해, 공개되고 아니고가 결정되는 식으로 관리되겠지요."
10023100-27 = "무슨 말을 하고 싶은 겁니까, 자애의 괴도?"
10023100-28 = "어느 쪽도, 옳지 않다는 이야기예요."
10023100-37 = "안 됩니다!"
10023100-38 = "아리스들이 퀘스트를 클리어하기 위해서는 그 왕관이 필요합니다!"
10023100-40 = "후후, 아쉽지만 그건 곤란해요."
10023100-41 = "모두를 위한 예술품이 있어야 할 곳에 자리하는가…… 그것만이 저의 관심사이니까요."
10023100-42 = "……협상은…… 결렬인가요……?"
10023100-43 = "짧은 동맹이었지만, 즐거웠어요."
10023100-44 = "이런 식으로 끝을 내고 싶지는 않았습니다만."
10023100-45 = "그건 저도 마찬가지예요."
10023100-46 = "하지만 질척거리는 것은 제 취향이 아니어서요."
10023100-47 = "깔끔하고, 화려하고, 아름답게. 여태까지 그래왔듯, 앞으로도 계속."
