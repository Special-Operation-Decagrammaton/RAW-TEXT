[translation]
70014040-1 = "เส้นทางอันสับสนของหมอยา 4"
70014040-2 = "ค่าคุ้มครองงั้นเหรอ...? คุ้มครองอะไรกัน! ปกติพวกเธอเคยทำอะไรบ้าง!"
70014040-3 = "ถ้าพวกฉันไม่คอยลาดตระเวนละก็ บ้านของยายคงถูกขโมยของหมดไปนานแล้ว"
70014040-4 = "งั้นก็ให้มันขโมยไปเลย! จะโดนพวกเธอรีดไถหรือโดนพวกโจรปล้นแบบไหนมันก็ไม่ต่างกันหรอก!"
70014040-5 = "เราคงพูดกันไม่รู้เรื่องแล้วละ หรือว่าเป็นเพราะเรื่องนั้น? คิดว่าพอรับยัยไคอะไรนั่นเข้าบ้าน แล้วจะมากล้าหือกับพวกฉันงั้นเหรอ?"
70014040-6 = "เรื่องนี้ไม่เกี่ยวกับเด็กคนนั้นนะ!"
70014040-7 = "ไม่รู้เรื่องโลกภายนอกจริงๆ สินะ! นี่ อยากรู้เรื่องน่าสนใจสักอย่างมั้ย? ยัย 'ชินทานิ ไค' นั่นน่ะ..."
70014040-8 = "ตอนอยู่ข้างนอกนั่น ยัยนั่นคือตัวปัญหาที่ไม่มีใครรับมือไหว แถมยังเป็นหนึ่งในกลุ่มอาชญากรตัวฉกาจ#nที่เรียกว่า 'เจ็ดอาชญากร' ด้วย!"
70014040-9 = "ได้ยินมาว่าทำเอาโรงเรียนที่ชื่อซานไห่จิงปั่นป่วนไปถึงรากฐานเลยนี่?"
70014040-10 = "แถมตอนบุกโรงเรียนนั้น ยังจ้างคนจากตลาดมืดแห่งนี้ไปตั้งเยอะด้วย?"
70014040-11 = "จริงๆ แล้ว ในที่แบบนี้เรื่องพวกอย่างนั้นก็คงไม่ได้ถือเป็นข้อด่างพร้อยใหญ่อะไร เอาเป็นว่าก็ตามนั้นแหละ!"
70014040-12 = "...!"
70014040-13 = "แล้วก็นะ ไหนๆ ก็พูดมาถึงเรื่องนี้แล้ว จะบอกเพิ่มอีกอย่างก็แล้วกัน…"
70014040-14 = "ยัยไคนั่นน่ะ เห็นว่ารักษายายให้ดีขึ้นเหมือนตอนนี้ได้มาตั้งนานแล้วด้วย!"
70014040-15 = "..."
70014040-16 = "โอ้... พวกนั้นก็รู้เรื่องนี้ด้วยสินะ"
70014040-17 = "ยัยนั่นน่ะ เรื่องอื่นฉันไม่รู้หรอก แต่ฝีมือการรักษาน่ะไม่เป็นสองรองใครเลย!"
70014040-18 = "แล้วทำไมถึงปล่อยยายให้อยู่ในสภาพนี้มาจนถึงป่านนี้น่ะเหรอ? ของมันก็แน่อยู่แล้ว..."
70014040-19 = "ก็เพราะจะรอจังหวะที่ยายจะยกบ้านให้ยังไงล่ะ!"
70014040-20 = "ในตลาดมืดน่ะ ไม่มีอะไรปิดบังไว้ได้หรอก! ยายก็รู้ดีไม่ใช่เหรอ!"
70014040-21 = "ทุกอย่างเป็นแค่เรื่องของเวลาเท่านั้น สุดท้ายก็ต้องรู้กันหมดอยู่ดี!"
70014040-22 = "แถมวันนี้พวกฉันยังโดนยัยไคเล่นงานมาด้วย..."
70014040-23 = ""
70014040-25 = ""
70014040-27 = "ดูท่ายายคงต้องรับเคราะห์แทน ให้พวกฉันได้ระบายความแค้นหน่อยแล้ว! ฮ่าฮ่าฮ่า!"
70014040-29 = ""
70014040-31 = "...!!!!!"
70014040-32 = ""
70014040-33 = "[ns] \"ต้องห้ามพวกนั้น!\""
70014040-34 = "..."
70014040-35 = "[s] \"ไค...?\""
70014040-36 = ""
70014040-39 = ""
70014040-40 = "ยัยเด็กพวกนี้..."
70014040-41 = "เรื่องแค่นั้นน่ะ ฉันรู้อยู่ตั้งนานแล้ว"
70014040-42 = ""
70014040-44 = ""
70014040-45 = "วะ... ว่าไงนะ?!?!"
70014040-46 = "...?"
70014040-47 = "รู้หรือเปล่าว่าฉันอยู่ที่นี่มานานแค่ไหนแล้วน่ะ...?"
70014040-48 = "ฉันเห็นผู้คนมาตั้งมากมาย และรู้ดีว่าในจำนวนนั้นมีสักกี่คนที่ถูกหลอก หรือคิดจะหลอกคนอื่น"
70014040-49 = "พวกตัวแสบเอ๋ย เรื่องแค่นั้นน่ะ ต่อให้ไม่บอกฉันก็ดูออกตั้งแต่แรกอยู่แล้ว"
70014040-50 = "ตะ... แต่ว่า ทำไมกันล่ะ...?"
70014040-51 = "ถามว่าทำไมฉันถึงยอมให้เด็กคนนั้นอยู่ที่นี่ แถมยังคิดจะยกบ้านให้ด้วยงั้นเหรอ?"
70014040-52 = "ก็เพราะแค่นั้นก็เพียงพอแล้วยังไงล่ะ"
70014040-53 = "ไม่ว่าไคจะเป็นเด็กแบบไหน หรือจะถูกมองว่ายังไงในโลกภายนอก สำหรับฉันแล้วจะเป็นยังไงก็ช่าง ก็อย่างที่พวกเธอพูดนั่นแหละ"
70014040-54 = "เด็กคนนั้นเคยอยู่ที่นี่ ถึงจะไม่นาน แต่ก็เคยอาศัยอยู่ในบ้านของฉัน แค่นั้นก็พอแล้ว จะให้ฉันหวังอะไรไปมากกว่านั้นอีกล่ะ"
70014040-55 = "บ้านที่มีคนอยู่สองคน ย่อมดีกว่าบ้านที่มีคนอยู่เพียงคนเดียวไม่ใช่เหรอ? ถ้าตัวบ้านเองมีความคิด ก็คงคิดแบบนั้นเหมือนกัน"
70014040-56 = "เพราะงั้นก็ปล่อยให้ฉันทำความสะอาดต่อจนเสร็จทีเถอะ!"
70014040-57 = "ก่อนจะยกบ้านหลังนี้ให้เด็กคนนั้นน่ะ!"
70014040-58 = ""
70014040-60 = ""
70014040-61 = "อะ... อะไรกัน! อุตส่าห์ตัดสินใจบอกความจริงให้รู้แท้ๆ!"
70014040-62 = "ใช่! คิดว่ากำลังขึ้นเสียงข่มขู่ใครอยู่น่ะ! ทำความสะอาดงั้นเหรอ? เรื่องแค่นั้นจะสำคัญอะไรนักหนา!"
70014040-63 = "แบบนี้คงคุยกันไม่รู้เรื่องแล้ว! พวกฉันก็อยากจบเรื่องดีๆ อยู่หรอก! แต่ยายเป็นคนทำทุกอย่างพังเองนะ!"
70014040-65 = "เฮ้! ทุกคนออกมา! ทางนี้!"
