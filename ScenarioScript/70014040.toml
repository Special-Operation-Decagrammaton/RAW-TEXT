70014040-47 = "...Do you know how long I've lived here?"
70014040-48 = "How many people I've seen, how many tricksters and marks? Deception is a way of life in the Market."
70014040-49 = "I didn't need you to tell me anything. I knew the whole time."
70014040-50 = "B-But, why—?"
70014040-51 = "Why was I going to give that girl my house?"
70014040-52 = "Because she was already enough."
70014040-53 = "No matter what kind of person Kai was or is, or what people say about her, none of that matters to me."
70014040-54 = "That child was here and kept me company. That's enough. What more could I ask for?"
70014040-55 = "Wouldn't a home with two people be better than a house with only one? If my walls could talk, they'd agree. I'm sure of it."
70014040-56 = "So, leave me be so I can finish my cleaning! I need to tidy up!"
70014040-57 = "...All before I leave this house to that girl!"
