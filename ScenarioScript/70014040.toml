70014040-158 = ""
70014040-159 = "จะเรียกว่ายังไงดี"
70014040-160 = "ฉันรู้สึกไม่ค่อยคุ้นเคยกับตัวเองอยู่นิดหน่อย..."
70014040-161 = "[s] \"เพราะช่วยยายคนนั้นไว้น่ะเหรอ?\""
70014040-162 = "...!"
70014040-163 = "เรื่องแบบนี้ ต่อให้พยายามหลอกครูก็คงไม่มีประโยชน์สินะ..."
70014040-164 = "แต่ฉันไม่ได้ตั้งใจจะช่วยยายแก่หรือทำความดีอะไรเป็นพิเศษหรอก"
70014040-165 = "ฉันแค่ทำตามใจตัวเอง และผลลัพธ์ก็ออกมาเป็นแบบนี้เท่านั้น"
70014040-166 = "ใช่... เหมือนที่ฉันทำมาตลอดทั้งวันนี้"
70014040-167 = "[s] \"แค่นั้นก็พอแล้ว\""
70014040-168 = "ว่าอะไรนะ...?"
70014040-169 = "[s] \"ก็คนเราไม่จำเป็นต้องเป็นคนดีเสมอไป ถึงจะทำเรื่องดีๆ ได้นี่นา\""
70014040-170 = "ดูเหมือนครูจะยิ่งพูดเรื่องที่เข้าใจยากขึ้นเรื่อยๆ นะ...?"
70014040-171 = "[s1] \"แต่หลายครั้งความดีก็เกิดขึ้นจากความบังเอิญหรือแรงกระตุ้นชั่ววูบ\"\n[s2] \"บ่อยครั้งทำไปทำมา ก็กลายเป็นว่าเราทำเรื่องดีๆ ไปแล้วเหมือนกัน\""
70014040-174 = "ถึงจะเป็นเพียงผลลัพธ์ที่ไม่ได้เกิดจากความตั้งใจ แต่ถ้าฉันยังทำอย่างเมื่อกี้นี้ได้... แค่นั้นก็พอแล้วงั้นเหรอ?"
