70014040-149 = "หืม? อื้ม ใช่แล้วละ"
70014040-150 = "[s] \"ไม่เป็นไรใช่มั้ย?\""
70014040-151 = "พูดอะไรแปลกๆ นะ ครู... หรือว่าสายตามีปัญหาไปแล้ว?"
70014040-152 = "คำถามนั้นน่ะ ไปถามเจ้าพวกที่ยังนอนระเกะระกะอยู่ข้างนอกตอนนี้น่าจะเหมาะกว่านะ"
