70014040-131 = "ไม่เป็นไรใช่มั้ย ไค?"
70014040-132 = "คำถามนั้นน่ะ ฉันควรเป็นฝ่ายถามมากกว่าไม่ใช่เหรอ...?"
70014040-133 = "ฮุฮุฮุ... เรื่องแค่นี้เอง เห็นอย่างนี้ฉันก็เป็น 'ผู้รอดชีวิต' ที่อยู่ที่นี่มาจนถึงตอนนี้นะ"
70014040-135 = "(บทสนทนาระหว่างไคกับหญิงชราค่อยๆ ดำเนินไป บ้างเหมือนจะขาดช่วง แต่ก็ยังต่อเนื่องดุจสายน้ำ#nที่ไหลเอื่อย)"
70014040-136 = "(สิ่งที่คุณครูพอจะทำได้มีเพียงคอยขานรับหรือส่งเสียงเสริมเป็นระยะๆ เท่านั้น...)"
70014040-138 = "อืม มืดค่ำป่านนี้แล้วเหรอ... เริ่มเพลียซะแล้วสิ"
70014040-139 = "ถ้ายังมีเรื่องจะคุยกันต่อ คนแก่คนนี้ขอตัวก่อนก็แล้วกันนะ"
