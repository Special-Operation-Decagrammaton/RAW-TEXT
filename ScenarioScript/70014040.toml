[translation]
70014040-1 = "The Apothecary Wanderings 4"
70014040-2 = "\"Protection fees,\" you say...? What \"protection\" do you provide?! What good have you lot ever done?"
70014040-3 = "If we didn't patrol the area, your house woulda been robbed a long time ago!"
70014040-4 = "Fine by me! It's a dump! If I can choose between getting robbed by you or by thieves, I'll take my chances!"
70014040-5 = "Are you hard of hearing, lady? You think you're tough because you have that skunk-stripe stray...Kai, or whatever her name is, as a roommate?"
70014040-6 = "This has nothing to do with her!"
70014040-7 = "Then you really are clueless! Hey, want to hear something interesting? About that Shintani Kai..."
70014040-8 = "She's not from around here. She's one of the Seven Prisoners, the worst of the worst! Specializes in, uh...medicines, chemical warfare, the like..."
70014040-9 = "They say she wrecked Shanhaijing and got arrested."
70014040-10 = "When she stormed the academy, she hired a load of mercs from the Black Market. So, yeah, we've heard of her."
70014040-11 = "And we ain't scared of her. But at least WE know the truth."
70014040-12 = "...!"
70014040-13 = "Ya know, since we're on the subject... Listen up, birdie."
70014040-14 = "Kai could have cured you the whole time!"
70014040-15 = "..."
70014040-16 = "Huh... So you knew, too..."
70014040-17 = "The girl's some kind of prodigy. She's some kind of apothecary!"
70014040-18 = "So, why did she leave you in your sorry state for so long? Think, lady..."
70014040-19 = "It's because she was biding her time until you'd give up, croak, and give her an inheritance! Like your hovel of a house."
70014040-20 = "There's no keepin' secrets in the Black Market! You know how this'll end."
70014040-21 = "It's just a matter of time. Everything gets shared eventually!"
70014040-22 = "Ya know, Kai actually caused us some trouble today, now that I think of it."
70014040-23 = ""
70014040-25 = ""
70014040-27 = "And since we can't find her, I guess we'll have to take it out on you! Hahaha!"
