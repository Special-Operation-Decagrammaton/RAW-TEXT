[translation]
70014040-1 = "藥師的徬徨（４）"
70014040-2 = "保護費……？#n也不想想你們平時做了什麼，居然敢說什麼保護費！"
70014040-3 = "要不是有我們巡邏，你的屋子早就被偷個精光了吧？"
70014040-4 = "不如乾脆讓他們偷算了！#n反正被你們勒索跟被小偷偷走，根本沒什麼兩樣！"
70014040-5 = "你這個人真的很難溝通耶。#n難不成是收留了那個叫誡還是什麼的傢伙，就覺得自己有靠山了？"
70014040-6 = "這件事跟那孩子無關！"
70014040-7 = "你真的是不懂社會的險惡耶！#n不如告訴你一件有趣的事吧？那個叫申谷誡的傢伙啊……"
70014040-8 = "在外頭可是個不受管教的問題人物，還是被稱作七罪人的兇惡罪犯之一呢！"
70014040-9 = "聽說他曾經把一所叫山海經的學園搞了個天翻地覆哦？"
70014040-10 = "而且他進攻那所學園的時候，好像還從我們這個黑市雇了一大票人過去呢！"
70014040-11 = "雖然那在我們這裡也算不上什麼污點，總之就是有那麼一回事啦！"
70014040-12 = "……！"
70014040-13 = "既然都說到這裡了，我就再多告訴你一件事吧……"
70014040-14 = "聽說誡那傢伙，好像老早就能把你治成現在這樣了哦！"
70014040-15 = "……"
70014040-16 = "哦……連那些傢伙也知道了嗎。"
70014040-17 = "那傢伙別的不好說，至少醫術似乎是真材實料的！"
70014040-18 = "至於為什麼直到現在都把你放著不管，那當然是因為……"
70014040-19 = "在等著你把房子讓給他嘛！"
70014040-20 = "黑市可是沒有任何祕密的！你應該也很清楚吧！"
70014040-21 = "一切都只是時間的問題，消息遲早會傳出去的！"
70014040-22 = "而且我們今天可是被那個誡給修理了一頓……"
70014040-23 = ""
70014040-25 = ""
70014040-27 = "看來這筆帳也得由你來還了啊！哈哈哈！"
70014040-29 = ""
70014040-31 = "……！！！！！！"
70014040-32 = ""
70014040-33 = "[ns] 「得阻止他們才行！」"
70014040-34 = "……"
70014040-35 = "[s] 「誡……？」"
70014040-36 = ""
70014040-39 = ""
70014040-40 = "……你們這些臭小子。"
70014040-41 = "那種事我早就知道了。"
70014040-42 = ""
70014040-44 = ""
70014040-45 = "什，什麼！？！？"
70014040-46 = "……？"
70014040-47 = "……你們知道我在這裡住了多久嗎？"
70014040-48 = "一直以來見過了多少人，其中又有多少人受騙或打算騙人。"
70014040-49 = "那種事用不著你們這些臭小子特意說出來，我打從一開始就心裡有數了。"
70014040-50 = "那，那你到底為什麼要……？"
70014040-51 = "為什麼要留下那孩子，甚至連房子都打算讓給他嗎？"
70014040-52 = "因為光是那樣就已經足夠了。"
70014040-53 = "誡是個怎樣的孩子、在外面受到什麼對待，對我來說都無所謂。"
70014040-54 = "那孩子確實待在這裡，也曾短暫地住在我家──這樣就足夠了。#n除此之外我別無所求。"
70014040-55 = "跟只有一個人的家相比，還是有兩個人的家更好。#n假如房子有意識的話，肯定也會這麼認為。"
70014040-56 = "所以，就讓我把打掃做完吧！"
70014040-57 = "在把這間房子讓給那孩子之前！"
70014040-58 = ""
70014040-60 = ""
70014040-61 = "什，什麼啊！虧我們好心讓你認清現實！"
70014040-62 = "就是說啊！竟然敢在我們面前大聲嚷嚷，甚至還威脅我們！#n打掃？那種事有什麼了不起的！"
70014040-63 = "看來這下是談不攏了！#n我們本來也想好聲好氣地解決，是你自己把事情搞砸的！"
70014040-65 = "喂！大夥都出來！在這裡！"
70014040-66 = ""
70014040-68 = ""
70014040-69 = ""
70014040-70 = ""
70014040-71 = ""
70014040-72 = ""
70014040-73 = ""
70014040-74 = ""
70014040-75 = "……真教人心煩。"
70014040-76 = "[s] 「誡……？」"
70014040-77 = "我實在看不順眼。"
70014040-78 = "……"
70014040-79 = "滿口說著讓不讓房子的老人也好。"
70014040-80 = "那群不知天高地厚、像初生之犢般吵吵嚷嚷的蠢貨也罷。一切的一切。"
70014040-81 = "別插手，老師。這是警告。"
70014040-82 = ""
70014040-84 = ""
70014040-85 = "……放心，我會避免發生老師擔心的事。"
70014040-86 = "至少不會讓他們的性命有什麼大礙的。"
70014040-92 = "你，你是！？是誡！誡在這裡！！！"
70014040-93 = "呼，呼吸好困難……！"
70014040-94 = "好癢……全身都癢得受不了……！嗚咿咿咿咿！！！"
70014040-95 = ""
70014040-99 = "啊哈！啊哈哈哈哈！住手！快住手！#n吸了奇怪的氣體之後就癢到受不──"
70014040-100 = "幻覺……？這是，幻覺嗎……？#n離，離我遠一點！那……那不是……！那不是我幹的！！！！！"
70014040-105 = "是雨……是雨……下起雨了……！#n天上，天上明明掛著那樣的月亮……"
70014040-106 = "啊，啊啊……身體，身體好像要融化了……！#n我的手臂、我的腿、我的頭髮！！！"
70014040-107 = "呵嘻，嘻嘻嘻，呵嘻呼嘻嘻嘻嘻嘻嘻！！！！！"
70014040-110 = ""
70014040-111 = "[ns] 「現，現在到底是……？」"
70014040-112 = "怎麼了，老師？#n就像你見到的一樣……"
70014040-113 = "……"
70014040-114 = "大家表面上不都平安無事嗎？"
70014040-115 = "[s] 「是這樣沒錯，可是……！」"
70014040-116 = "不必擔心。"
70014040-117 = "只要不是萬不得已，我基本上不會做出無法挽回的事的。"
70014040-118 = "誡……？"
70014040-119 = "……！"
70014040-120 = "……"
70014040-121 = "進去吧。天色已經很晚了。"
70014040-122 = ""
70014040-124 = ""
70014040-125 = "……嗯。就這麼辦吧。"
70014040-126 = ""
70014040-128 = ""
70014040-131 = "你沒事吧，誡？"
70014040-132 = "……這句話應該由我來問比較自然吧？"
70014040-133 = "呵呵呵……這點小事不算什麼。#n之後看到還留在這種地方的老骨頭，就把他們當作「倖存者」看待吧。"
70014040-135 = "（誡與老人的對話，彷彿隨時都會中斷卻又連綿不絕的河水一般緩慢流淌）"
70014040-136 = "（我所能做的，頂多就是偶爾附和答腔而已……）"
70014040-138 = "唔嗯，已經這麼晚了嗎……實在有點累了。"
70014040-139 = "你們如果還沒聊完，我這老人家就先去休息了。"
70014040-140 = "可別太晚睡啊？"
70014040-141 = "……我知道。"
70014040-142 = ""
70014040-144 = ""
70014040-145 = "（老人一瘸一拐地走進了房間深處）"
70014040-146 = "（……沒過多久，便傳來了打鼾聲）"
70014040-147 = "……"
70014040-148 = "[s] 「果然是位好長輩呢。」"
70014040-149 = "嗯？嗯……是啊。"
70014040-150 = "[s] 「你還好嗎？」"
70014040-151 = "……你這話可真奇怪啊，老師。#n難不成是視力出了什麼問題嗎？"
70014040-152 = "那句話應該拿去問候現在還癱在外面的那些傢伙比較合理。"
70014040-153 = "[s] 「我只是覺得你的表情看起來有點複雜。」"
70014040-154 = "……！"
70014040-155 = "……"
70014040-156 = ""
70014040-158 = ""
70014040-159 = "該怎麼說呢……"
70014040-160 = "我對自己感到有點……有點陌生。"
70014040-161 = "[s] 「是因為幫助了那位老人嗎？」"
70014040-162 = "……！"
70014040-163 = "……看來想在這種事情上欺騙老師也只是白費工夫吧。"
70014040-164 = "不過我並沒有特意想幫助老人，或者想做什麼好事。"
70014040-165 = "我只是隨心所欲地行動，而結果恰好變成了那樣而已。"
70014040-166 = "……沒錯。就像我今天一整天的所作所為一樣。"
70014040-167 = "[s] 「那樣就夠了。」"
70014040-168 = "你說什麼……？"
70014040-169 = "[s] 「人未必得要善良才會做出好事。」"
70014040-170 = "你說的話好像越來越難以理解了……？"
70014040-171 = "[s1] 「有不少善行都是出於偶然或衝動。」\n[s2] 「人有時候就是會不經意地做出好事。」"
70014040-174 = "意思是即便只是結果使然，只要能展現出剛才那樣的一面……就可以了嗎？"
70014040-175 = "[s] 「至少現在是如此。」"
70014040-176 = "……！"
