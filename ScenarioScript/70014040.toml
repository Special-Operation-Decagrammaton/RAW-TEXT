70014040-1 = "#title;약사의 방황길 4"
70014040-2 = "3;아픈 노인 참새정;00;보호비라고……? 보호는 무슨 보호! 평소 너희들이 하는 게 뭐가 있다고!\n#3;a\n#3;em;[빠직]"
70014040-3 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00;우리가 순찰 안 돌면, 댁 집은 진작에 다 도둑맞았을걸?"
70014040-4 = "3;아픈 노인 참새정;00;차라리 그렇게 해라! 너희들에게 뜯기나 도둑 녀석들에게 뜯기나 마찬가지야!\n#1;hide\n#5;hide"
70014040-5 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 B;이거 말이 안 통하네. 혹시 그거야? 그 카이인가 뭔가 하는 녀석을 집에 들였다고 위세 부리는 거야?\n#3;em;[한숨]\n#3;h"
70014040-6 = "3;아픈 노인 참새정;00;그 아이와는 상관없는 일이다!\n#3;em;[!]\n#1;hide\n#5;hide"
70014040-7 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 C;정말 세상 물정 모르는구만! 이봐, 한 가지 재미있는 사실 알려 줄까? 그 신타니 카이라는 녀석 말인데…….\n#5;h"
70014040-8 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00;바깥에서는 손도 못 쓸 문제아라서, 일곱 죄수라고 불리는 흉악범 중 하나라고!\n#1;em;[재잘]"
70014040-9 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 B;00;듣기로는 산해경이란 학원을 완전히 뿌리부터 뒤집어 놓았다던데?\n#3;h"
70014040-10 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 C;거기에 그 학원에 쳐들어갈 때, 여기 블랙마켓에서 사람을 왕창 고용해 가기도 했다지?\n#5;em;[음표]\n#5;h"
70014040-11 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00;사실 여기에서 그런 게 뭐 큰 흠집이나 되나 싶지만, 아무튼 그렇다고!"
70014040-12 = "3;아픈 노인 참새정;00;……!\n#1;hide\n#5;hide\n#3;em;[!]"
70014040-13 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 B;그리고 말이지, 이왕 말이 나온 김에 또 하나 덧붙이자면 말이야…….\n#3;h"
70014040-14 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 B;카이 녀석, 진작에 댁을 지금처럼 낫게 할 수 있었다는 모양이더라고!\n#3;h\n#3;em;[재잘]"
70014040-15 = "3;아픈 노인 참새정;00;…….\n#3;em;[…]\n#1;hide\n#5;hide"
70014040-16 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;카이;호오……. 저 녀석들도 알고 있었던 건가.\n#fontsize;50"
70014040-17 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 C;그자식, 다른 건 몰라도 의술 하나만은 확실한 모양이더라고!\n#5;h\n#4;hide"
70014040-18 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00\n#na;블랙마켓 갱단원 C;그런데 왜 댁을 지금까지 이대로 내버려뒀느냐고? 그거야 당연히…….\n#5;h\n#5;em;[…]"
70014040-19 = "5;블랙마켓 갱단원 C;00\n3;블랙마켓 갱단원 B;00\n1;블랙마켓 갱단원 A;00;댁이 자기에게 집을 넘겨줄 순간만 기다리고 있었기 때문이지!\n#1;em;[재잘]"
