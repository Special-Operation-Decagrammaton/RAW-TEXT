70014040-79 = "ทั้งยายแก่ที่เอ่ยปากพูดเรื่องว่าจะยกหรือไม่ยกบ้านให้"
70014040-80 = "ทั้งเจ้าพวกโง่ที่เอะอะโวยวายไม่รู้ประสีประสา ไม่รู้จักที่ต่ำที่สูง ราวกับลูกวัวไม่รู้จักกลัวเสือ ทุกอย่าง... ทั้งหมดนั่นเลย"
70014040-81 = "อย่าเข้ามายุ่งเลย ครู ฉันขอเตือนไว้ก่อน"
70014040-82 = ""
70014040-84 = ""
70014040-85 = "เอาเป็นว่า... ฉันจะไม่ทำให้เกิดเรื่องที่ครูกังวลก็แล้วกัน"
70014040-86 = "อย่างน้อยก็จะไม่ให้เป็นอันตรายร้ายแรงถึงชีวิตแหละนะ"
70014040-92 = "เธอ... เธอคือ?! ไคนี่นา! ไคอยู่ตรงนี้!!!"
70014040-93 = "หะ... หายใจไม่ออก...!"
70014040-94 = "คัน... คันไปทั้งตัวเลย...! โอ๊ยยยยย!!!"
70014040-95 = ""
70014040-99 = "ฮะฮ่า! อะฮะฮะฮะฮ่า! พอได้แล้ว! พอเถอะ! พอสูดแก๊สประหลาดเข้าไป ก็ยิ่งคัน..."
70014040-100 = "ภาพหลอน...? นี่คือภาพหลอนเหรอ...? ปะ... ไปให้พ้นนะ! ฉัน... ฉันน่ะ...! นั่นไม่ใช่ฉันนะ!!!!!"
70014040-105 = "ฝน... ฝน... กำลังตก...! ทั้งที่บนฟ้า บนฟ้ายังมีดวงจันทร์ลอยเด่นอยู่แท้ๆ..."
70014040-106 = "อะ... อ่า... มะ... เหมือนว่าร่างกายกำลังละลาย...! แขนฉัน ขาฉัน เส้นผมของฉัน!!!"
70014040-107 = "ฮุฮิ... ฮิฮิฮิ... ฮิฮิฮุฮิฮิฮิฮิฮิ!!!!!"
