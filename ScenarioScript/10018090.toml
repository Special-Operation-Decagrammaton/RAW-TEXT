[translation]
10018090-1 = "제9화;어쩌겠어요. 여기까지 왔는데."
10018090-3 = "후우……"
10018090-4 = "[s] \"괜찮아, 후우카?\""
10018090-8 = "아, 선생님."
10018090-9 = "네. 괜찮아요. 아직 할 일이 많은걸요."
10018090-10 = "[s1] \"너무 무리하는 것도 좋지 않아 보여.\"\n[s2] \"이쯤에서 조금 쉬는 게 어떨까?\""
10018090-15 = "죄송합니다."
10018090-19 = "그러면 약간만…… 바람이라도 쐬고 올게요."
10018090-24 = "……"
10018090-25 = "[s] \"후우카가 부담을 느끼고 있는 것 같지?\""
10018090-26 = "저는 아직 아무 말씀도 드리지 않았습니다만……"
10018090-27 = "[s] \"하지만 하루나는 후우카를 쭉 지켜보고 있었잖아?\""
10018090-31 = "선생님께는 아무것도 숨길 수가 없군요."
10018090-32 = "명백하게, 저 상황은 한계입니다."
10018090-33 = "하지만 무엇 때문에 한계에 부딪힌 것인지, 그걸 알 수가 없네요."
10018090-34 = "[s] \"하루나는 무엇을 하고 싶어?\""
10018090-35 = "……거기서 저의 의사를 물어 오실 줄이야."
10018090-36 = "언제나 의표를 찌르고 들어오는 분이시군요."
10018090-40 = "저는…… 지고 싶지 않아요. 져서는 안 된다고 생각합니다."
10018090-41 = "미식을 위해서만이 아니에요. 참새정에는 많은 사람들의 염원이 걸려 있습니다."
10018090-42 = "하지만 이 대결에서 이기기 위해 필요한 것은…… 저의 힘이 아니죠."
10018090-43 = "저는 그 사실이 분합니다."
10018090-44 = "[s] \"하지만 하루나가 할 수 있는 일이 남아 있지 않을까?\""
10018090-45 = "그런 게 있을까요?"
10018090-46 = "[s] \"나는 있다고 생각해.\""
10018090-54 = "……가르침을 주시겠어요?"
10018090-55 = "[ns] \"그건……\""
10018090-61 = "호, 혹시 후우카 선배에게 무슨 일이 일어났는지 아시는 분 계세요?"
10018090-63 = "선배가 조금 전 스쿠터를 타고 게헨나 쪽으로 가버렸어요!"
10018090-66 = "그렇군요. 바람을 쐬러 가신 거군요. 휴."
10018090-67 = "[s] \"후우카가 어디로 갔는지, 혹시 짐작 가는 데라도 있어?\""
10018090-71 = "네…… 저라면 알 것 같아요."
10018090-75 = "정말로…… 여기에 후우카 씨가 있을까요?"
10018090-76 = "[s] \"난 주리를 믿어.\""
10018090-77 = "그건 저 역시 마찬가지입니다만……"
10018090-78 = "마음을 풀 장소가 언제나 일하는 급양부 옥상이라니."
10018090-83 = "……정말 저기에 있군요. 놀랍네요."
10018090-84 = "[s] \"자, 그러면 이제부터는 하루나의 시간이네.\""
10018090-88 = "무, 무슨 말씀이시죠, 선생님? 이런 일에는 선생님이 더 제격인 게 아닌가요?"
10018090-89 = "[s] \"지금은 하루나가 나서야 할 때라고 생각해.\""
10018090-93 = "……이유를, 여쭤봐도 될까요."
10018090-94 = "[ns] \"어떤 의미에서, 후우카를 나보다 더 잘 이해하고 있는 건,\""
10018090-96 = "[ns] \"하루나라고 생각하니까.\""
10018090-97 = "예의상 말씀해 주시는 것이라면 감사드립니다."
10018090-98 = "하지만 역시 모든 일에는 적임자가 있기 마련 아닐까요?"
10018090-99 = "예? 바로 그렇기 때문이라고요?"
10018090-100 = "……"
10018090-101 = "……알겠습니다."
10018090-102 = "선생님께서 정 그렇게 말씀하신다면……"
10018090-107 = "……뭔가 묘하게 소란스럽더라니."
10018090-108 = "실례하겠어요."
10018090-109 = "어떻게 잘 알고 왔네. 주리가 알려 준 거지?"
10018090-110 = "그 말대로입니다. 폐가 되었나요?"
10018090-111 = "일이라면 걱정하지 마. 금방 돌아갈 거야."
10018090-112 = "조금만…… 이렇게 있다가."
10018090-113 = "옥상을 좋아하는 모양이죠?"
10018090-114 = "글쎄…… 보통 급양부 일은 바쁘니까, 특별히 멀리 갈 데가 없어서."
10018090-115 = "쉬고 싶을 때는 여기로 오곤 했어. 그러다 보니 이 옥상이 가장 편한 곳이 된 거고."
10018090-116 = "머리가 복잡한가요?"
10018090-117 = "아니라고 하면 거짓말이겠지?"
10018090-118 = "무엇과 싸워야 하는 걸까…… 그런 생각이 들어서."
10018090-119 = "그거야 당연히, 사람들을 속이고 미식의 길을 어지럽히는 냐오푸드지요."
10018090-120 = "나, 구르메 헬멧단이랑 하루나가 나눈 이야기, 들었어."
10018090-124 = "……아카리 씨인가요?"
10018090-125 = "응."
10018090-126 = "그렇다면 이미 다 알고 있겠군요."
10018090-127 = "우리가 이기면, 냐오푸드에서 일하는 사람들은 일자리를 잃게 될까?"
10018090-128 = "……그럴 가능성도 0은 아니겠죠."
10018090-129 = "냐오푸드가 참새정에 더 이상의 간섭을 하지 않게 된다면,"
10018090-130 = "참새정을 구심점으로 한 다른 사람들도 자신의 가게를 포기하지 않게 될 것이고."
10018090-131 = "그 결과가 냐오푸드의 유통망을 좁히는 방향으로 이어진다면……"
10018090-132 = "긴축이라는 이름으로, 용역의 제공을 줄일 수도 있을 테니까요."
10018090-133 = "응…… 대충, 그런 것들이 신경이 쓰여서."
10018090-134 = "그리고 상인들 중에서는, 냐오푸드 편을 들고 싶어 하는 분들도 분명히 계셨어."
10018090-135 = "우리에게 괜한 분란을 일으킨다고 눈치를 주는 분도 계셨고."
10018090-136 = "있는 그대로가 좋은 사람들도 있기 마련이죠."
10018090-137 = "저는 거기에 변화를 일으키는 쪽을 선호하지만요."
10018090-138 = "하루나의 변화는 가끔 부담스러울 때가 있지만."
10018090-139 = "어머나. 그런가요?"
10018090-140 = "난 그저 참새정을 돕고 싶었을 뿐인데."
10018090-141 = "어쩌다 이렇게까지 일이 커지게 된 걸까."
10018090-142 = "지금 가장 신경 쓰이는 게 뭐죠?"
10018090-143 = "내가 최선을 다한 결과로, 무언가를 잃을 사람들."
10018090-144 = "난 누군가가 괴로워하는 게 싫어. 그래서 급양부에 들어온 거고."
10018090-148 = "……우리에 대해서는 어떻게 생각하죠?"
10018090-149 = "너희들도 마찬가지잖아? 내게 있어선 전부…… 식당을 찾아오는, 돌봐 줘야 할 학생들이지."
10018090-150 = "구르메 헬멧단도 지금에 와서는 그 비슷한 것이 되었다는 말이군요."
10018090-151 = "이상하지? 우리를 방해하는 사람들인데도."
10018090-156 = "후우카 씨."
10018090-158 = "응?"
10018090-160 = "모든 일에 희생은 따라와요. 미식이라고 해서 예외는 아니죠. 우리가 주저하면 할수록, 훌륭한 가게는 점점 사라져 버릴 거예요."
10018090-161 = "그걸 그저, 손가락을 물고 지켜보기만 할 수는 없어요. 그래서 우리는 싸우고 있는 것 아닌가요?"
10018090-162 = "……그렇, 지."
10018090-163 = "냐오푸드에서는 어차피 우리를 봐 줄 생각이 없어요."
10018090-167 = "저쪽은 수단을 가리지 않고 우리를 없애 버리려 하고 있습니다."
10018090-168 = "냐오푸드는 이 승부에서 진다고 해도 그다지 잃을 것이 없어요."
10018090-169 = "긴축은, 일어날 수도 있지만, 일어나지 않을 수도 있죠. 적어도 가능성의 영역이에요."
10018090-172 = "하지만 참새정의 주인분은 모든 것을 잃을 거예요."
10018090-173 = "그건 확실합니다. 가능성이라는 단어를 쓸 수도 없어요."
10018090-174 = "그건…… 그렇겠네."
10018090-177 = "그리고 피해를 보는 것은 참새정 주인뿐만이 아니에요."
10018090-178 = "저는 상가 거리 사람들도 잠정적인 피해자가 될 거라고 봅니다."
10018090-179 = "어째서?"
10018090-185 = "진정한 미식을 맛볼 권리를 잃어버리게 되는 셈이니까요."
10018090-191 = "……후훗."
10018090-192 = "왜, 왜 웃는 거죠?!"
10018090-193 = "아니, 뭔가 엄청나게 하루나다운 대답이어서."
10018090-194 = "크흠."
10018090-195 = "아무튼, 전 미식에 있어서만큼은 진심입니다. 한 치도 물러설 생각은 없어요."
10018090-196 = "그리고 당신도 마찬가지예요. 후우카 씨."
10018090-197 = "나……?"
10018090-198 = "전 당신을 알아요. 당신은 진짜 실력을 보인 적이 거의 없죠."
10018090-199 = "그럴 기회도, 상황도 주어지지 않았으니까요."
10018090-201 = "지금이야말로 기회입니다. 당신의 진짜 실력을 내 보일 기회요."
10018090-203 = "그렇구나."
10018090-204 = "하루나가 그렇게까지 진심이라면, 나도 힘내야겠네."
10018090-205 = "어쩌겠어요. 여기까지 왔는데."
10018090-206 = "그래. 누군가 덕분에."
10018090-211 = "그러면, 가 볼까?"
10018090-212 = "선생님도 거기 계시죠?"
10018090-213 = "[s] \"들켰나?\""
10018090-215 = "왠지 그럴 것 같았거든요."
10018090-220 = "계란에 가츠오다시를 섞고……"
10018090-224 = "간장과 미림에 설탕…… 그리고 곱게 간 생선살……"
10018090-225 = "청어알은 건지셨나요?"
10018090-226 = "네. 잘 말리고 있어요. 다음은 방어와 도미를 구워서……"
10018090-227 = "새우가 잘 삶아졌네요."
10018090-232 = "이건 이대로 건조시키기로 하고……"
10018090-236 = "선배! 당근 다 썰었어요!"
10018090-237 = "고마워!"
10018090-238 = "아 참, 토란을 깜빡하고 있었네……"
10018090-244 = "후훗. 보기 좋은 광경이군요."
10018090-245 = "주인분과 급양부가 힘을 합쳐 오세치를 만들고, 미식연구회는 그것을 보조한다……"
10018090-247 = "맛보기를 한다는 이유로 먹는 게 전부지만요★"
10018090-248 = "이것도 일은 일이야. 맛보기가 끝나면 식재료도 날라야 한다구."
10018090-249 = "뭔가 행복해~ 매일이 오늘 같았으면!"
10018090-259 = "뭇후후후. 오세치 생산 공정에 대한 보고를 듣고 싶다."
10018090-260 = "뭐…… 순조롭습니다. 삶기 구역, 절임 구역, 구이 구역, 모두 제대로 돌아가고 있습죠."
10018090-261 = "대량 생산! 대량 소비! 컨베이어 벨트!"
10018090-262 = "이런 공정일수록 냐오모토의 식품 공장이 빛을 발할 터!"
10018090-264 = "자, 모두 일해라! 일이 있고 나서야 삶이 있는 법이다!"
10018090-269 = "이미 다들 추가근무 중입니다만……"
