[translation]
1600402-1 = "임협학생"
1600402-2 = "……!! 앗! 선생ㄴ…… 아니 두목!!"
1600402-3 = "어 그, 그러니까…… 자세가 어떻게 하더라…… 잠시만요!"
1600402-4 = "이렇게 다리를 벌리고 서서…… 영차."
1600402-6 = "무릎에 손을 얹은 뒤에 허리를 숙여서…… 좋아. 좋아! 이 자세입니다."
1600402-7 = "……후우."
1600402-9 = "오셨습니까, 두모옥-!! 불초 피나, 인사 올립니다아아!!"
1600402-10 = "[s1] \"뭔가 잘 못 된 거 같은데……\"\n[s2] \"그런 건 어디서 배웠니……?\""
1600402-11 = "네? 왜요? 설마 어…… 어색한가요?"
1600402-12 = "네? 왜요? 설마 어…… 어색한가요?"
1600402-13 = "그럴 리가 없는데…… 분명히 <임협냥전기>에서 나온 대로 똑같이 따라 한 것 같은데……"
1600402-14 = "네? 그게 뭐냐고요? 흐흥~. 궁금해하실 줄 알았습니다."
1600402-15 = "그럼 이걸 봐주세요!! 쨔잔-!!"
1600402-16 = "[s] \"……임협 영화 BD?\""
1600402-17 = "혹시 보신 적 있나요!? 이게 진짜 대박 작품입니다만!?"
1600402-18 = "여기서 나오는 주인공이 하는 말투가 그러니까……"
1600402-19 = "……네? 보신 적 없다고요? 그보다 뭔가 미묘하게 다른 작품인 것 같다고요?"
1600402-20 = "……그런가……?"
1600402-21 = "에이! 뭐, 사소한 부분들은 넘어가도록 하죠! 어차피 이거 말고도 많으니까요!"
1600402-22 = "아무튼 그런 관계로! 저희 마츠리운영관리파에 온 것을 환영합니다, 두목!!"
1600402-23 = "……네? 두목이라는 명칭은 하지 않는 게 좋을 거 같다고요? 그냥 선생님이 더 좋으시다고요?"
1600402-24 = "조직명도 그냥 평범하게 관리'부'면 된다고요?"
1600402-25 = "그게 그러니까 으음……"
1600402-26 = "흐으음~~. 아냐. 여기서는 두목…… 아니, 선생님의 말에 토를 다는 게 이상합니다!"
1600402-27 = "넵!! 그러죠! 어차피 이쪽 세계에선, 선생님이 희다고 하면 검은 것도 하얀 것이니까요!"
1600402-28 = "……오오…… 방금은 진짜 비슷했던 것 같네요. 후후."
1600402-29 = "……네?"
1600402-30 = "그러니까 지금 이게…… 역할극 같은 거냐고요?"
1600402-31 = "……"
1600402-32 = "그, 그런 거 아닙니다! 진짜입니다!! 저, 저는 정말로 이곳의 임협이 되기 위해……!"
1600402-33 = "그러니까…… 그걸 위해……! 어…… 으음……"
1600402-34 = "……으음……"
1600402-35 = "……에헤헤. 그렇게 정곡으로 찌르고 들어오시니 오히려 회피할 말이 없습니다."
1600402-36 = "맞아요. 영화 보고 따라한 거예요…… 아직은 따라하기도 급급해서 어설픈 부분도 많습니다."
1600402-37 = "에? 왜 그런 짓을 하냐고요? 당연한 거 아닌가요!?"
1600402-38 = "그야 물론 멋진 임협이 되기 위해서입니다!! 임협은 최고로 멋있으니까요!!"
1600402-39 = "[s] \"……임협이 된다고……?\""
1600402-40 = "아~! 정말로! 매일매일! 영화들을 돌려보면서 잠 못 이루는 밤들을 보내왔다고요!!"
1600402-41 = "백귀야행으로 오면! 이런 분위기 속에서 지낼 수 있을 거야! 저는 그렇게 믿고 있습니다!!"
1600402-42 = "조직원의 의리, 끊어지지 않는 인연……! 비극적인 결말과 소중한 이들을 위한 희생……!!"
1600402-43 = "최고예요! 최고로 낭만적이잖아요!! 그것 만을 위해 여기로 온 것입니다, 저는!!"
1600402-44 = "그렇죠!? 이해해 주시겠죠? 선생님께서도 무슨 느낌인지 알아주실 거죠!?"
1600402-45 = "……에?"
1600402-46 = "뭔가 다른 것과 착각하고 있는 거 같다고요? 임협에 대해서?"
1600402-47 = "그, 그런가? 뭐지? 아직도 빠뜨린 영화가 있나? 분명 추천받은 건 다 봤는데……"
1600402-48 = "엣…… 임협이 무슨 뜻이지 아냐고요? 으으음. 그, 그야……!"
1600402-49 = "남들이 하기 싫어하지만 해야 하는 일을 하는 사람들……?"
1600402-50 = "'인의'와 '신의'에 따라 움직이는…… 어…… 아닌가요……?"
1600402-51 = "[s3] \"뜻 자체는 얼추 맞는데……\"\n[s4] \"뭔가 잘 못 알고 있는 것 같은데……\""
1600402-52 = "으음…… 이상하다. 분명 본 영화마다 하나같이 그렇다고 말을 했는데……"
1600402-53 = "으음…… 이상하다. 분명 본 영화마다 하나같이 그렇다고 말을 했는데……"
1600402-54 = "인의과 신의을 따라 사람들을 돌아봐 주는……!? 아앗!"
1600402-55 = "저기 혼자서 무거운 짐을 들고 가시는 할머니가!"
1600402-56 = "할머니! 피나가 도와드릴 게요! 아이, 신경 쓰지 마세요! 영차……!"
1600402-57 = "……"
1600402-59 = "아하하. 다녀왔습니다. 갑자기 도울 일이 좀 생겼……"
1600402-60 = "아앗! 이번에는 저기서 울고 있는 아이가!! 잠시 달래 주고 오겠습니다!"
1600402-61 = "휴우…… 이번에야말로 다녀왔……"
1600402-63 = "아앗! 저기 길 잃은 다른 학교 학생이……!"
1600402-65 = "저기엔 또 밥 굶는 강아지가……!!"
1600402-66 = "[s] \"……\""
1600402-69 = "……"
1600402-70 = "……휴우! 다 됐습니다."
1600402-71 = "죄, 죄송해요. 선생님. 저런 걸 보면 가만히 있질 못하는 성격이라……"
1600402-72 = "그, 그런데 저희 무슨 이야기를 하고 있었죠? 어……"
1600402-73 = "아. 맞다. 임협! 임협이 무슨 뜻인지 알고 있냐는 이야기를……"
1600402-74 = "……네? 괜찮으시다고요? 그치만 아직 대답을 못 드렸는데?"
1600402-75 = "에? 이미 잘 보셨다고요? 피나의 임협……?"
1600402-76 = "으음 그건 또 무슨 말씀이신지…… 으음…… 피나 이야기인데 피나가 모르겠습니다……"
1600402-77 = "……그래도 뭐! 잘은 모르겠지만 선생님이 그렇다고 하시면 그러신 거겠죠!! 에헤헤!"
1600402-78 = "뭔가 아직 시작도 안 했는데 벌써부터 인정받은 느낌이라 기분이 좋아졌습니다!"
1600402-79 = "그럼 앞으로도 피나의 임협, 지켜봐 주세요! 선생님!"
1600402-81 = "(피나는 그렇게 말하며 계속해서 들뜬 듯 이야기를 이어나갔다.)"
1600402-82 = "(그리고 그 와중에도 곤란한 사람이 생겨날 때마다 '인의'라는 이름으로 그들을 도와주었다.)"
