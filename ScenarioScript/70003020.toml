[translation]
70003020-1 = "하이랜더 운행 일지 2"
70003020-3 = "어이, 저쪽 칸에서 싸움이야!!"
70003020-4 = "그래? 여기도 마찬가진데!!"
70003020-5 = "하핫, 역시 내선 순환이야! 심심할라치면 사건이 터지는구만!!"
70003020-7 = "열차 기관실"
70003020-8 = "으, 으아……"
70003020-9 = "동시에 전 객실에서 사건이 발생할 줄이야……"
70003020-10 = "용케 오전에는 조용하더라니……"
70003020-11 = "젠장, 어떻게 된 게 하루도 잠잠할 날이 없어!"
70003020-12 = "이 상황, 우리만으로는 대응이 어려운데……"
70003020-13 = "어, 어떻게 하죠……?"
70003020-14 = "일단 진압 병력이 필요하니까 지원을 부르는 게……"
70003020-15 = "……"
70003020-16 = "아, 알겠습니다. CCC에 지원을 요청해 보겠습니다."
70003020-22 = "엥? 내선순환 HL9000호?"
70003020-23 = "무슨- 일이야-?"
70003020-25 = "그, 그게……!"
70003020-26 = "지금 모든 객차에서 소란이 발생했는데요……!!"
70003020-27 = "그, 내부 하이랜더 승무원만으로는 수습이 불가능할 것 같아서요!"
70003020-28 = "혹시 병력 지원이 가능할지……!! 현재 위치는……!"
70003020-30 = "지금은- 지원 못가-"
70003020-31 = "우리도 좀 문제가 생겨서, 즉시 병력 지원은 힘들 것 같아."
70003020-33 = "예?! 그럼 어, 어떻게 할까요??"
70003020-35 = "일단 무리하지 말고~ 하이랜더 승무원 보호를 우선으로 하고 있어."
70003020-36 = "최대한 빨리 병력 보낼 테니까-"
70003020-38 = "으, 으으……! 예! 알겠어요……!"
70003020-45 = "그, 일단은…… 그냥 가만히 있어야겠지?"
70003020-46 = "아무래도…… 상부의 명령이니까……"
70003020-47 = "이렇게 된 이상 다음 정거장에서 지원이 올 때까지 운행을 정지하는 것도……"
70003020-48 = "으응…… 열차가 멈추면 승객들도 적당히 내리지 않을까……"
70003020-52 = "……"
70003020-53 = "그렇게 해야 할까요……?"
70003020-54 = "별수 없지. 우리 셋만으로는 역부족이잖아."
70003020-55 = "뭐…… 불가항력이라고 생각해."
70003020-56 = "차량에 피해가 가도, 어떻게든 차고지에만 도착하면 수리할 수 있고."
70003020-60 = "정말…… 그게 최선일까요?"
70003020-62 = "으응?"
70003020-64 = "지금 이대로라면 우리가 열심히 지켜온 정시 운행도, 안내방송도, 안전 수칙 준수도……"
70003020-65 = "모두…… 모두 의미 없는 일이 되고 말아요."
70003020-66 = "하이랜더 철도학원의 학생으로서, 이 열차를 멋지게 운행해서 승객들을 안전하게 목적지까지 나르는 것이 우리가 할 일이잖아요."
70003020-68 = "그, 그렇지만……! 우리가 지금 뭘 할 수 있다는 거야?"
70003020-69 = "지금 그 안전하게 날라야 할 승객들이 난동을 부리고 있다고!!"
70003020-70 = "그거예요!"
70003020-74 = "우리의 의무는 열차와 승객을 보호하고 운행하는 것."
70003020-75 = "하지만!! 지금 객차 내에서 소란을 부리는 저 사람들을!!"
70003020-77 = "승객이라 볼 수 있을까요?!"
70003020-81 = "어? 그, 그건……"
70003020-83 = "다른 승객들에게 피해를 끼치고, 무임승차, 폭력 사태, 불법영업까지!"
70003020-84 = "저들을 배제해서, 다른 선한 승객들을 지키는 것이 우리의 의무가 아닐까요?!"
70003020-85 = "지, 진심이야……?"
70003020-86 = "생각해 보세요! 저들만 없으면 정상 운행이 가능하다구요?"
70003020-87 = "마, 만약 그렇게 한다고 해도 어떻게……? 결국은 힘이 있어야 하는데……"
70003020-88 = "있어요! [ruby=무기]힘[/ruby]이라면!!"
70003020-89 = "총 없는 사람은 없잖아요?"
70003020-90 = "우, 우리가 직접 싸우자고?"
70003020-91 = "일개 하이랜더 승무원인 우리가?!"
70003020-92 = "못할 거 있나요? 이 열차를 책임지는 건 우린데요."
70003020-97 = "그래."
70003020-98 = "까짓거, 한번 해보자고."
70003020-100 = "7호 차량"
70003020-101 = "대체 키보토스가 어찌 되려고 이렇게 버릇없는 애들이 나다니는 게야?!"
70003020-102 = "아, 진짜…… 아까부터 대체 왜 저러는 거야……"
70003020-104 = "어!!! 세상이 그렇게 녹록하지가 않아!! 나 때는!!!"
70003020-109 = "어흑!"
70003020-118 = "7호 차량, 정상화 완료."
70003020-119 = "좋아, 이동."
70003020-124 = "……??"
70003020-125 = "뭐, 뭐지……? 지금……?"
70003020-127 = "3호 차량"
70003020-128 = "으하핫! 이대로면 이번 달 최고 매출도 꿈은 아니구만~!"
70003020-129 = "나도 이제 곧 사파이어 등급이…… 후후……"
70003020-130 = "기다려 줘, 부장! 조금만 더 모으면 동아리를 부활시킬 수……!!"
70003020-136 = "께흑!"
70003020-143 = "불법 판매 품목들은 모두 압수합니다."
70003020-144 = "맡겨줘. 하나도 놓치지 않을 테니."
70003020-146 = "8호 차량"
70003020-147 = "당신! 내가 누군지 알아?? 어?!"
70003020-148 = "누군지는 모르겠고!! 너 몇 살이야? 어?!"
70003020-149 = "내 전화 한 통이면 어? 당신은 그냥……"
70003020-150 = "해봐! 해봐!!"
70003020-157 = "히잉!"
70003020-158 = "하앙!"
70003020-165 = "……"
70003020-166 = "……금세 조용해졌네."
70003020-167 = "……그러게."
70003020-168 = "평소 같았다면, 이 사람들 전부 어르고 달래느라 진땀을 흘렸을 텐데……"
70003020-169 = "대부분 곱게 내리지도 않으니까, 계속 사과하면서 부탁했었지……"
70003020-170 = "우리는 아무 잘못도 하지 않았는데 말야……"
70003020-174 = "우리…… 앞으로도 이러면 되는 거 아닐까요?"
70003020-175 = "그러게 말이야. 이렇게 쉽고 간편한 방법이 있는데."
70003020-176 = "왜 지금까지 그렇게 애를 먹었던 거지?"
70003020-177 = "총은 정말……"
70003020-178 = "대단하네요……!!!"
70003020-179 = "아아! 멋진 해결 수단!!"
70003020-180 = "이대로 이 열차를 완전히 접수하자고!!"
70003020-182 = "……"
70003020-183 = "스, 승객을 쐈어……"
70003020-184 = "나도 봤어……"
70003020-188 = "스, 승무원들이 미쳤다-!!"
70003020-197 = "……"
70003020-198 = "상황이 해결됐다는 말을 듣고 보러왔는데……"
70003020-199 = "여기 무슨 일이 있었던 거야?"
70003020-200 = "보시는 것처럼 상황 모두 해결되었습니다!!"
70003020-201 = "아주 좋은 수단이 있었죠!!"
70003020-202 = "네! 차내 비축된 화기와 폭발물을 효율적으로 활용했습니다!"
70003020-204 = "저, 저 사람들이에요! 저 하이랜더 승무원들이 승객을 쐈어요!!"
70003020-208 = "이, 이래도 되는 건가요?! 승객을 보호해야 할 사람들이……!!"
70003020-213 = "응- 괜찮아-"
70003020-214 = "네? 뭐가 괜찮은……"
70003020-215 = "그러니까- 능동 방어야-"
70003020-219 = "당하기 전에 먼저 해치우는 거야- 문제없어-"
70003020-220 = "……예?"
70003020-223 = "크으, 다들 다시 봤어!! 할 때는 하잖아?!"
70003020-224 = "응- 앞으로도 이렇게만 해-"
70003020-225 = "파햐햐햐! 모두 이달의 우수 학생으로 선정!!"
70003020-227 = "해, 해냈어요……!!"
70003020-228 = "어이, 진짜냐!! 살다 보니 이런 날도 오는구나!"
70003020-229 = "역시! 화약에 답이 있다는 옛말이 틀리지 않았어!"
70003020-230 = "다들, 앞으로도 우리의 의무를 잊지 말자구요!"
70003020-231 = "그럼 여기서 저희의 브이로그를 종료하겠습니다! 하이랜더 철도학원, 많이 사랑해 주세요!!"
70003020-236 = "다음부터는 버스 타야지……"
70003020-237 = "하이랜더 운행 일지"
