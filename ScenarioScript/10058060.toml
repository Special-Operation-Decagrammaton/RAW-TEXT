[translation]
10058060-1 = "제6화;도망치면 셋, 참가하면 하나"
10058060-3 = "그…… 질문이 많기는 한데……."
10058060-4 = "정말 궁금한 게 많지만요……."
10058060-7 = "뿌하아-!!"
10058060-8 = "물에 설탕이라도 탔어?! 너무 달고 시원해!!"
10058060-9 = "사, 살았어요……. 태워주셔서 감사합니다!"
10058060-10 = "뭐부터 질문을……. 해야 할까요……."
10058060-11 = "뭔가 묻고 싶은 게 있으신 모양이군요!"
10058060-12 = "그럴 줄 알고 부장님이 여기 탱크에 미리 질문과 답변을 써 두셨습니다!"
10058060-13 = "경기 전날까지 질문을 엄청 많이 받았어서……."
10058060-16 = "어디 보자……."
10058060-17 = "'1번. 네. 탱크입니다. 경기 주최 측에서 포랑 몸통이 있으니 전차라고 합니다. 저도 납득은 안 갑니다.'"
10058060-18 = "'2번. 게헨나 컵 주제로 개그 영상 찍으려고 박스로 만들었는데……. 장난으로 쓴 참가 신청서를 실수로 내버려서 본선까지 와버렸습니다.'"
10058060-19 = "다들 죄송해요……. 정말로 참가하는 건 줄 알고 보내버렸어요. 히잉……."
10058060-20 = "신경 쓰지 마! 기왕 참가한 거 도망치지 않고 맞서 싸우자고 한 건 나였으니까!"
10058060-21 = "아, 그렇군요……."
10058060-22 = "엄청 힘들어 보이시는데 어째서 교……."
10058060-23 = "그건 아마 7번이 답일 거야. 으윽, 너무 피곤해서 졸아버릴 뻔했어."
10058060-24 = "'7번. 원래는 번갈아 가면서 교대하려고 했는데 주최 측에서 그러면 경기 중 부품 구조변경이라고 해서 여태껏 이러고 있습니다.'"
10058060-25 = "아……. 부품 판정이구나."
10058060-26 = "포탑을 조금이라도 가볍게 하기 위해서 헬륨도 마셔봤는데 소용없었습니다!"
10058060-27 = "접근의 방향성은 틀리지 않았네."
10058060-28 = "아차! 그러고 보니, 자기소개를 안 했다! 닌자의 기본인데!"
10058060-29 = "도-모, 처음 뵙겠습니다. 적 전차=공. 소생은 백귀야행 인법연구부 부장, 미치루라고 하오."
10058060-30 = "오, 오노 츠쿠요입니다. 인법연구부의 부원입니다! 오, 오우……!"
10058060-31 = "쿠다 이즈나입니다! 인법연구부 부원 겸 포탑을 맡고 있습니다! 닌……."
10058060-32 = "아앗! 포탑다워야 합니다!"
10058060-33 = "펑펑!!"
10058060-34 = "뭐, 뭐야?! 전차답게 행동해야 하나?!"
10058060-35 = "부, 부웅부웅!"
10058060-36 = "부웅부웅-"
10058060-37 = "우리도 해야 하는 거야?!"
10058060-38 = "당연히 아니겠지! 우린 부품도 아니잖아!"
10058060-39 = "우리는 붉은겨울에서 온 183호 특별반이야. 이 짤랑짤랑 시끄러운 녀석은 안나, 나는 에리나."
10058060-40 = "누가 짤랑짤랑 시끄럽다는 거야! 훈장이 없어서 부럽다고 솔직하게 말하시지?"
10058060-41 = "응, 응. 그래요~ 그리고, 운전석에는 라나."
10058060-42 = "부웅부웅-"
10058060-43 = "저, 저기……. 다시 한번, 태워주셔서 감사합니다."
10058060-44 = "경쟁팀인데도, 도와줘서 고마워!"
10058060-45 = "별거 아니에요! 전차를 타면 다 동료잖아요!"
10058060-46 = "어디까지 모셔드리면 될까요?"
10058060-47 = "언덕 위까지만 올려주면 돼! 경사가 너무 심해서 도저히 못 올라갈 것 같아……. 우냐아……."
10058060-48 = "그래도, 나머지는 우리 힘으로 끝까지 해내 볼 테니까!"
10058060-49 = "괜찮겠어? 위험하기도 하고, 많이 힘들 텐데."
10058060-50 = "조금 더 쉬었다가 출발하는 게 어떨까요?"
10058060-51 = "마음은 고맙지만, 닌자는 정처 없이 떠돌며 필요 이상으로 의지하지 않는 법!"
10058060-52 = "끄, 끝까지 힘내보고 싶어요. 기왕 이렇게 됐으니까요……!"
10058060-53 = "이즈나도 동감입니다!"
10058060-54 = "그런데, 우리가 할 말은 아니지만 183호 공들의 전차는 무척 특이하네!"
10058060-55 = "이런 전차는 엄청 비싸지 않아?"
10058060-56 = "저희도 용돈 모아서 박스테이프 아주 많이 샀습니다!"
10058060-57 = "그게…… 직접 폐품으로 만든 거라서 재료비도 들지 않았어요."
10058060-58 = "대단해! 폐품으로 전차를 만들었다고?! 우리는 인법도구 만드는 게 고작인데!"
10058060-59 = "……아까부터 궁금했는데, '인법'이란 건 뭔가요?"
10058060-60 = "우냐앗?! 인법이 뭔지 몰라?"
10058060-61 = "인법이란 말이지! 그러니까!"
10058060-62 = "어……. 이게 아주 복잡한 건데……. 그러니까……."
10058060-63 = "숨어서 몰래 정탐하기도 하고, 샤샤샥! 하고 나타나는 겁니다!"
10058060-64 = "그래! 그것도 맞네!"
10058060-65 = "숨어서 정탐하고, 갑자기 나타난다?"
10058060-66 = "아~ 확실하게 이해됐어!"
10058060-67 = "백귀야행의 사무국 분들이군요 (이구나) !"
10058060-68 = "사무국, 이요?"
10058060-69 = "아마 맞을 거야!"
10058060-70 = "잘 모르겠지만…… 비슷한 게 있다면, 그게 맞을 겁니다!"
10058060-73 = "다시 한번, 도와주셔서 감사합니다!"
10058060-74 = "이 은혜, 결코 잊지 않을게!"
10058060-75 = "덕분에 다시 힘낼 수 있게 됐어요……!"
10058060-77 = "응원할게요! 꼭 완주하세요!"
10058060-78 = "다치지 말고!"
10058060-79 = "작별입니다. 멋진 전차여."
10058060-81 = "가자!"
10058060-82 = "네, 네엡!"
10058060-83 = "펑펑!!"
10058060-86 = "……우리도, 꽤 노력했다고 생각했거든."
10058060-87 = "전차도 만들고, 예선도 어찌저찌 통과하고."
10058060-88 = "그런데 저분들은, 골판지 전차로도 여기까지 왔어."
10058060-89 = "멋있다, 정말로……! 저 투지, 본받고 싶어."
10058060-90 = "포기하지 않는 전차, 멋있어."
10058060-91 = "……."
10058060-92 = "에리나? 뭐야, 무슨 생각 해?"
10058060-95 = "아, 아니야. 아무 생각 안 했어. 출발이나 하자."
10058060-96 = "라나, 출발하자. 세 번째 표적으로!"
10058060-97 = "지금 가면 안 될 것 같은데."
10058060-98 = "언덕 밑에. 난전 중이야."
10058060-99 = "으아, 역시 늦었나 봐-"
10058060-101 = "아비도스팀, 호루스 1호"
10058060-104 = "빗나갔어! 아야네 쨩, 잠깐만 이대로 직진만 해줘!"
10058060-105 = "지, 직진-!"
10058060-106 = "장전 완료예요-"
10058060-109 = "들려? 파우스트. 일명 아지타니 히후미."
10058060-110 = "수영복 전차단의 이름은 양보하지 않을 거야."
10058060-111 = "시로코 선배!! 무전기로 도발하면 어떡해!"
10058060-112 = "쏜다!"
10058060-113 = "주퇴거리 확보-"
10058060-120 = "보충수업부팀, 크루세이더 쨩"
10058060-122 = "꺄악!! 마, 맞았어!!"
10058060-123 = "탈출!! 탈출해야 해!!"
10058060-124 = "어머, 히후미 대장 지시 없이는 도망가면 안 돼요!"
10058060-125 = "안심하세요, 제대로 에어백도 있으니까요♡"
10058060-130 = "사형-!! 수영복 입고 그런 짓 하지 마!!"
10058060-131 = "그렇지만, 에어컨이 고장 나서 전차 안이 더운걸요?"
10058060-132 = "혹시, 수영복도 너무 덥다든지?"
10058060-137 = "아아, 진짜아-! 붙지 마!! 나가!!"
10058060-141 = "아하하……. 그냥 포탄이 튕겨 나간 거예요, 코하루 쨩."
10058060-142 = "아즈사 쨩, 표적 왼쪽에 조준해 줄래요? 신호 보내면 바로 우회전할 거예요."
10058060-143 = "알았어, 파우스트."
10058060-144 = "그, 그런 거 외우지 말구요!"
10058060-145 = "멋진 울림이었어. 히후미에게 어울려."
10058060-146 = "한가하게 뭔 소리를 하는 거야! 집중해, 집중!"
10058060-147 = "아즈사 쨩, 신호 줄게요. 삼, 둘……."
10058060-148 = "……하나, 발포!"
10058060-152 = "포신 끝에 직격했어. 한 발 더 쏠까, 히후미."
10058060-153 = "괜찮아요! 당분간 무력화만 하면 되니까요."
10058060-156 = "저, 저기! 들리시나요! 아비도스 여러분! 다친 곳 없으세요?"
10058060-159 = "네! 괜찮아요! 모두 무사합……."
10058060-160 = "파우스트, 아직 끝나지 않았어. 끝까지 승부야."
10058060-161 = "다, 다들 다치지 않으셔서 다행이네요. 아하하……."
10058060-163 = "선배!! 아직 아야네 쨩이 말하고 있잖아!"
10058060-164 = "무전기 수화기 이리 내! 압수야, 압수!"
10058060-165 = "포신 끝부분이 휘었는데, 이대로 발포할 수는 없겠네요……. 그럼……."
10058060-169 = "승부야, 파우스트!"
10058060-174 = "시로코 쨩, 전차보다 더 빠르네요☆"
10058060-175 = "감탄할 때가 아니잖아! 선배 빨리! 이 틈에 뭐라도 하자구!!"
10058060-178 = "뭐야 저 사람?! 아까부터 자꾸 이상한 사람 부르고 있고,"
10058060-181 = "그보다, 엄청 빨라서 총알도 다 피하잖아!"
10058060-182 = "저렇게 내려서 싸워도 되는 거야?! 전차 대회인데?"
10058060-183 = "규정집에 없는 내용은 뭘 해도 실격 사유가 아니라고 하네요."
10058060-184 = "그리고…… 같은 팀의 귀를 깨무는 것도 딱히 실격 사유는 아니더라구요?"
10058060-188 = "히, 히야앙……."
10058060-189 = "뭐 하는 거야!!!!"
10058060-190 = "에헷, 약간 물만두 같아 보여서, 요♡"
10058060-191 = "죽어 그냥!!!"
10058060-196 = "어, 어디 갔지?! 아까까지 조준경에 보였었는데?!"
10058060-206 = "어디에 간 거지? 대체……."
10058060-211 = "꺄아악!!!!!"
10058060-213 = "놓치지 않아."
10058060-214 = "나와서 모두 승부하는 거……."
10058060-217 = "으악!! 미안!! 시로코 선배!!"
10058060-218 = "으헤- 세리카 쨩, 선배에게 쌓인 게 많은 거야?"
10058060-219 = "그러니까-! 끝이 망가졌다고 포신을 잘라내니까 이렇잖아! 일부러 맞힌 게 아니라고!!"
10058060-220 = "시로코 선배, 괜찮으실까요?!"
10058060-224 = "일단 엄지손가락을 치켜들고 있어! 괜찮다는 뜻인가 봐!"
10058060-225 = "그런데, 시로코 쨩 어딜 보고 있는 걸까요……? 전혀 다른 곳을 보고 미소 짓고 있는데……."
10058060-226 = "저번에 학교 뒤뜰 감나무에서 떨어졌을 때가 생각나네-"
10058060-227 = "일단 지금 위기는 벗어나야지! 다음 탄 장전!!!"
10058060-229 = "하아…… 하아…… 간 떨어지는 줄 알았잖아!"
10058060-230 = "저쪽, 아직도 싸우려고 하고 있어! 분명 아까 격파한 거 아니었어?"
10058060-231 = "전사의 굴하지 않는 투지. 마음에 들어."
10058060-232 = "감탄하지 말고! 빨리 다음!"
10058060-233 = "으음, 이대로 가다간 끝이 없을 거예요."
10058060-234 = "승부는 끝까지 해 보겠지만, 아무래도 무승부인 것 같아요."
10058060-235 = "어머, 히후미 쨩. 저희가 유리한 거 아닌가요?"
10058060-236 = "으음, 저분들은 포신을 잘라내서 짧아졌다 보니 포구초속이 떨어졌어요. 빗나간 것도 그래서일 테고요."
10058060-237 = "그러면 속도에 상관없이 관통력이 일정한 화학에너지 탄을 써야 하는데, 처음부터 날아오고 튕겨 나갈 때 소리가 전부 철갑탄 같았어요."
10058060-238 = "초, 초구포속?"
10058060-239 = "그렇네요. 탄도학적으로 설명 가능한 거죠."
10058060-240 = "그렇다면 관통력이 현저하게 떨어졌겠네."
10058060-241 = "네, 아마 지금쯤……."
10058060-244 = "꺄악?!"
10058060-245 = "역시, 저쪽 분들의 포로는 저희를 뚫을 수 없네요."
10058060-246 = "소리만으로 탄종을 구별하다니. 전차의 여전사다워, 히후미."
10058060-247 = "아, 아하하…… 그냥 취미인걸요! 어디까지나……."
10058060-248 = "아, 아아- 완전히 이해? 했어! 어쨌건 우리가 이긴다는 거지?!"
10058060-249 = "아니, 우리는 원래부터 저쪽을 관통할 수 없어서 기동 불능으로 만들고 도망치려고 했어."
10058060-250 = "즉, 무승부라는 거야. 아무리 서로 달려들어도 시간의 낭비."
10058060-251 = "그럴 거예요. 차라리 무승부로 서로에게 양해를 구하고 각자 갈 길을 가야 할지도 모르겠어요."
10058060-252 = "(히후미는 전차에 타면 평소하고 약간 사람이 달라지는 것 같아…….)"
10058060-253 = "무전이 작동하는지도 모르겠으니, 직접 말씀드려야겠네요."
10058060-257 = "저, 저기요오-! 아비도스 여러분들-!"
10058060-259 = "히후미 씨가 몸을 내밀고 손수건을 흔들고 계세요!"
10058060-260 = "그런데 무슨 옷이죠……? 수영복? 아닌가……?"
10058060-261 = "왜 저런 옷인지는 모르겠지만, 역시 이 이상은 무의미하지~ 히후미 쨩도 아는 모양이네."
10058060-262 = "왜? 아직 둘 다 멀쩡하잖아?"
10058060-263 = "그 이유는 말이지-"
10058060-264 = "하암-"
10058060-267 = "……음냐."
10058060-268 = "말을 끝까지 해!!!! 중간에 잠들지 마!!"
10058060-269 = "아마…… 일종의 협상타임 아닐까요? 시로코 쨩도 데려와야 하니까 좋다고 생각해요."
