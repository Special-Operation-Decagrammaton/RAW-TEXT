[translation]
10058060-1 = "第6話;逃げれば3、参加すれば1"
10058060-3 = "あの、えっと……聞きたいことは山ほどあるんだけど……。"
10058060-4 = "何から聞けばいいのか……。"
10058060-7 = "ぷはあーっ！！"
10058060-8 = "すっごく甘くておいしいね！このお水、お砂糖でも入ってる？"
10058060-9 = "た、助かりました……乗せていただき、ありがとうございます！"
10058060-10 = "えっと、何から聞けばいいかしら……。"
10058060-11 = "何やら、私たちに聞きたいことがあるご様子！"
10058060-12 = "こんなこともあろうかと、部長が質問と回答を書いてくれています！"
10058060-13 = "レース前日までに、散々あれこれ聞かれたからね……。"
10058060-16 = "えっと……。"
10058060-17 = "「1番。はい、戦車です。砲と車体があるということで、#n運営に戦車だと認められました。私も納得はしていません。」"
10058060-18 = "「2番。ゲヘナカップをテーマにネタ動画を撮ろうと段ボールで作ったのですが……#nふざけて書いた参加申込書を誤って出してしまい、本戦まで来てしまいました。」"
10058060-19 = "すみません、すみません……#n本当に参加するものだと思って出しちゃいました……。"
10058060-20 = "気にしないで！参加するなら逃げずに戦おうって言ったのは、私だからさ！"
10058060-21 = "あ、そうなんですね……。"
10058060-22 = "すごく大変そうですけど、どうして交替し……。"
10058060-23 = "その答えは7番。うぅ……疲れ果てて眠くなってきた……。"
10058060-24 = "「7番。元々交替しながら進む予定でしたが、#n運営からレース中の部品構成の変更に当たると言われたので、#nそれからずっとこの状態です。」"
10058060-25 = "あ～、部品判定なんだぁ。"
10058060-26 = "砲塔を少しでも軽くするためにヘリウムガスも吸ったのですが、#n効果はありませんでした！"
10058060-27 = "アプローチの方向性は間違ってないんだけどね。"
10058060-28 = "ああっ！そういえば、まだ自己紹介をしてなかった！忍者の基本なのに！"
10058060-29 = "ドーモ、お初にお目にかかります、敵戦車殿。#n小生、百鬼夜行連合学院忍術研究部部長、ミチルと申す。"
10058060-30 = "お、[ruby=おおの]大野[/ruby]ツクヨです。忍術研究部の部員です！"
10058060-31 = "[ruby=くだ]久田[/ruby]イズナです！#n忍術研究部部員で砲塔を担当しています！ニン……。"
10058060-32 = "あっ！砲塔らしくやらないと！"
10058060-33 = "パンパン！！"
10058060-34 = "え！？そんなルールあったの！？"
10058060-35 = "ぶ、ブーンブーン！"
10058060-36 = "ブーンブーン。"
10058060-37 = "私たちもやるの！？"
10058060-38 = "んなワケないでしょ！私たちは部品じゃないんだから！"
10058060-39 = "えーっと、こっちも自己紹介しておくね。#n私たちはレッドウィンター連邦学園の183号特別クラス。#nこのガチャガチャうるさいのはアンナ、私はエリナ。"
10058060-40 = "誰がガチャガチャうるさいよ！#nやっぱり、私ばっかり勲章持ってるからって僻んでるんでしょ！"
10058060-41 = "うんうん、そだねー。それで、運転席にいるのはラナ。"
10058060-42 = "ブーンブーン。"
10058060-43 = "あ、あの……改めて、乗せていただきありがとうございます。"
10058060-44 = "敵同士なのに、助けてくれてありがとう！"
10058060-45 = "いいんですよ！戦車に乗れば、みんな仲間です！"
10058060-46 = "どこまで送ればいいですか？"
10058060-47 = "丘の上まで連れっててもらえれば……#n坂がきつくて、とてもじゃないけど登れなさそうでさ……。"
10058060-48 = "でも、残りは私たちの力でやり遂げてみせる！"
10058060-49 = "ホントに大丈夫？危ないし、すっごく大変だと思うけど。"
10058060-50 = "もう少し休んでから出発してもいいんじゃないですか？"
10058060-51 = "気持ちはありがたいけど、忍者とは一処にとどまらず、むやみに頼らないもの！"
10058060-52 = "こ、ここまで来たら……最後まで頑張ってみたいんです……！"
10058060-53 = "イズナも同じ思いです！"
10058060-54 = "にしても……183号殿の戦車はすごく不思議な形だねぇ！#n私たちが言うことじゃないけど。"
10058060-55 = "こういうの、高いんでしょ？"
10058060-56 = "私たちもお小遣いを貯めて、テープをたっくさん買いました！"
10058060-57 = "実は……廃品で作ったものだから、材料費はかかっていないんです。"
10058060-58 = "すごい！廃品から戦車を作ったの！？私たちは忍術の道具がやっとなのに！"
10058060-59 = "……さっきから気になっていたんですけど、「忍術」って何ですか？"
10058060-60 = "うにゃあっ！？忍術を知らないの？"
10058060-61 = "忍術というのは！つまり！"
10058060-62 = "えっと……すごく複雑なもので……。"
10058060-63 = "隠れて偵察したり、シュババババッ！と現れたりするんです！"
10058060-64 = "そうそう！そのとおり！"
10058060-65 = "隠れて偵察して、突然現れる？"
10058060-66 = "あ～、分かった分かった！"
10058060-67 = "百鬼夜行の事務局の人たちってことか（ね）！"
10058060-68 = "事務局、ですか？"
10058060-69 = "たぶんそれ！"
10058060-70 = "よく分かりませんが……似たようなものがあるなら、そうだと思います！"
10058060-73 = "改めて、助けていただきありがとうございます！"
10058060-74 = "この恩は、決して忘れないよ！"
10058060-75 = "おかげさまで、また頑張れます……！"
10058060-77 = "絶対に完走してくださいね！応援してますから！"
10058060-78 = "ケガしないでね～！"
10058060-79 = "お別れです。かっこいい戦車よ。"
10058060-81 = "行くよ！"
10058060-82 = "は、はいっ！"
10058060-83 = "パンパン！！"
10058060-86 = "……私たちは、すごく頑張ってきたと思ってた。"
10058060-87 = "戦車も作って、予選も何とか通過して。"
10058060-88 = "けどあの人たちは、段ボール戦車でここまで来たのね。"
10058060-89 = "なんてかっこいいの……！私もあの不屈の闘志を見習わなきゃ。"
10058060-90 = "諦めない戦車、かっこいい。"
10058060-91 = "……。"
10058060-92 = "エリナ？考え込んでどうしたの？"
10058060-95 = "う、ううん。何もない。それよか、早く出発しよ。"
10058060-96 = "ラナ、3つ目の的に向かおう！"
10058060-97 = "今はダメ。"
10058060-98 = "丘の下、乱戦になってる。"
10058060-99 = "うわ～、やっぱり遅かったか～"
10058060-101 = "アビドスチーム・ホルス1号"
10058060-104 = "外れた！アヤネちゃん、このまままっすぐに進んで！"
10058060-105 = "ちょ、直進ー！"
10058060-106 = "装填完了～"
10058060-109 = "聞こえる？ファウスト。別名、[ruby=あじたに]阿慈谷[/ruby]ヒフミ。"
10058060-110 = "水着戦車団の名は譲らないから。"
10058060-111 = "シロコ先輩！！無線で挑発してどうするの！"
10058060-112 = "撃つわよ！"
10058060-113 = "駐退距離、確保～"
10058060-120 = "補習授業部チーム・クルセイダーちゃん"
10058060-122 = "ひゃあっ！！やられた！！"
10058060-123 = "だ、脱出しなきゃ！！"
10058060-124 = "あら、ヒフミ隊長の指示もないのに敵前逃亡はダメですよ。"
10058060-125 = "安心してください、ちゃんとエアバッグもありますから♡"
10058060-130 = "死刑っ！！水着姿でそんなことしないで！！"
10058060-131 = "戦車内のエアコンが故障しているので、水着姿なのは仕方がありません。"
10058060-132 = "もしかして、水着でもまだ暑いですか？"
10058060-137 = "ああもう！！近づかないで！！出ていって！！"
10058060-141 = "あはは……砲弾は装甲で弾かれたので大丈夫ですよ、コハルちゃん。"
10058060-142 = "アズサちゃん、標的の左側を狙ってくれますか？#n合図を送ったらすぐに右折します。"
10058060-143 = "分かった、ファウスト。"
10058060-144 = "そ、そんなこと覚えなくていいですよ！"
10058060-145 = "響きがかっこよくて。ヒフミにぴったり。"
10058060-146 = "なにのんきなこと言ってるの！集中してっ！"
10058060-147 = "アズサちゃん、いきますよ。3、2……。"
10058060-148 = "……1、発射！"
10058060-152 = "砲身の先に直撃。もう一発いこう、ヒフミ。"
10058060-153 = "いえ、その必要はありません。しばらくの間、無力化できればいいので。"
10058060-156 = "アビドスのみなさん、聞こえますか！おケガはないですか？"
10058060-159 = "はい、大丈夫です！全員無事で……。"
10058060-160 = "ファウスト、まだ終わってない。行くとこまで行こう。"
10058060-161 = "あはは……みなさんがご無事で良かったです。"
10058060-163 = "先輩！！まだアヤネちゃんが話してるでしょ！"
10058060-164 = "無線機をこっちに渡しなさい！没収よ、没収！"
10058060-165 = "砲身の先端が曲がっているので、もう砲撃は無理ですね……それでは……。"
10058060-169 = "ファウスト！いざ尋常に勝負！"
10058060-174 = "シロコちゃん、戦車より速いですね☆"
10058060-175 = "感心してる場合じゃないでしょ！先輩、早く！この隙に何とかするわよ！"
10058060-178 = "何あの人！？さっきから誰かの名前を呼んで――"
10058060-181 = "というか、速っ！銃弾も全部避けてるじゃん！"
10058060-182 = "戦車を降りて戦ってもいいの！？戦車レースなのに？"
10058060-183 = "競技規則にないことは、何をしても失格事由にならないようです。"
10058060-184 = "それと……同じチームの人の耳を噛むことも、失格事由にはならないんですよ？"
10058060-188 = "ひ、ひやあぁん……。"
10058060-189 = "って、何してるのよ！！"
10058060-190 = "えへへっ。なんだか水餃子みたいに見えて、つい♡"
10058060-191 = "変態！死刑っ！！！"
10058060-196 = "あ、あれ！？あの人は！？さっきまで照準器で見えてたのに！！"
10058060-206 = "どこに行ったの……？"
10058060-211 = "きゃあぁっ！！"
10058060-213 = "逃がさない。"
10058060-214 = "出てきて、みんなで勝負しよう……。"
10058060-217 = "うわあっ！！ごめん！！シロコ先輩！！"
10058060-218 = "うへ～セリカちゃん、先輩にそんなに不満溜まってたの？"
10058060-219 = "やられた砲身の先端を切り落としたら、こうなっちゃったの！#nわざとじゃないから！！"
10058060-220 = "シロコ先輩、大丈夫ですか！？"
10058060-224 = "親指を立ててる！大丈夫みたい！"
10058060-225 = "ところで、シロコちゃんはどこを見ているんでしょうか……？#n明後日の方向を見て笑っていますが……。"
10058060-226 = "学校の裏庭にある柿の木から落ちた時のことを思い出すね～"
10058060-227 = "ひとまずこのピンチを切り抜けないと！次弾装填！！"
10058060-229 = "はぁ……はぁ……心臓が止まるかと思った！"
10058060-230 = "どうするの！？あっち、まだ戦おうとしてるけど！撃破したんじゃないの！？"
10058060-231 = "決して屈しない闘志、気に入った。"
10058060-232 = "感心してる場合じゃないでしょ！"
10058060-233 = "えっと……このまま戦っても、いつまでも終わらないと思います。"
10058060-234 = "お互いすべての弾を撃ち尽くしても、決着はつかないでしょう。"
10058060-235 = "本当ですか？私たちの方が有利だと思ったんですが。"
10058060-236 = "あちらは砲身が短くなって、[ruby=・]砲[/ruby][ruby=・]口[/ruby][ruby=・]速[/ruby][ruby=・]度[/ruby]が落ちました。#n外れたのもそのせいです。"
10058060-237 = "それなら速度に関係なく貫通力が一定している化学エネルギー弾を使うべきですが、#n装甲に弾かれた時の音がAP弾のそれでした。"
10058060-238 = "ほ、[ruby=・]砲[/ruby][ruby=・]速[/ruby][ruby=・]口[/ruby][ruby=・]度[/ruby]？"
10058060-239 = "なるほど。いわゆる弾道学のお話ですね。"
10058060-240 = "なら貫通力が著しく落ちているだろう。"
10058060-241 = "おそらく、今ごろ……。"
10058060-244 = "ひゃぁっ！？"
10058060-245 = "やはり、あちらの砲撃では私たちの装甲を突破することはできませんね。"
10058060-246 = "音だけで弾の種類を判別できるなんて、ヒフミは戦士みたいだな。"
10058060-247 = "あ、あはは……あくまで趣味程度ですが……。"
10058060-248 = "ああもう！つまりは、私たちが勝つってことでしょ！？"
10058060-249 = "いや、そうじゃない。#nこっちも向こうの装甲を貫通できないから、走行不能にして逃げる計画だった。"
10058060-250 = "つまり、引き分け。いくら撃ち合っても時間の無駄ということだ。"
10058060-251 = "そうですね。引き分けで手を打つのが最善かもしれません。"
10058060-252 = "（ヒフミは戦車に乗ると、ちょっと人が変わる気が……）"
10058060-253 = "今の状態で無線が使えるか分からないので、直接話をしてきます。"
10058060-257 = "あ、あの！アビドスのみなさ～ん！"
10058060-259 = "ヒフミさんが体を乗り出してハンカチを振っています！"
10058060-260 = "でも服装が……これ、水着……ですか……？"
10058060-261 = "なんであんな格好なのかは分からないけど……やっぱりこれ以上は無意味だよね～。#nヒフミちゃんも分かってるみたい。"
10058060-262 = "どうして？まだピンピンしてるでしょ？"
10058060-263 = "だって――"
10058060-264 = "ふあぁ――"
10058060-267 = "…………ふにゃ。"
10058060-268 = "途中で寝ないで、最後までちゃんと言いなさいよ！！"
10058060-269 = "これは……交渉の要求、でしょうか？#nシロコちゃんも連れてこないといけないので、こちらとしてはありがたいですが。"
10058060-270 = "シロコ先輩、大丈夫かな……？さっきから穏やかな表情で花占いしてるけど……。"
10058060-271 = "それでは、シロコ先輩と合流しつつ、休戦を提案しに行きましょうか。"
10058060-276 = "失礼します！"
10058060-277 = "ひとまず休戦ってことにし――"
10058060-280 = "ふにゃ……うあっ！？"
10058060-281 = "全員しっかり掴まって！！砲弾が飛んでくる！！"
10058060-282 = "ええっ！？"
10058060-283 = "ドッカーン！！"
10058060-284 = "距離8500メートル、敵戦車1両撃破！"
10058060-285 = "第二目標、クルセイダー！煙幕展開後に離脱！見失いました！"
10058060-286 = "ふむ、なかなかの速さだ。#nやはりトリニティの「[ruby=ティターニア]妖精女王[/ruby]」を先に捕まえるべきだったかな。"
10058060-287 = "終わったのか、トモエ？"
10058060-290 = "いえ、書記長。"
10058060-291 = "これは始まりです。"
10058060-294 = "何なの、アレ！？"
10058060-295 = "みなさん、大丈夫ですか？アビドスの方たちが突然爆発しましたが……。"
10058060-296 = "私は大丈夫。#n南東7000メートルの高地から砲撃されたみたいだ。"
10058060-297 = "ここでしばらく止まりましょう。#n草で隠れて、私たちの位置は分からないはずです。"
10058060-298 = "でもこの位置は圧倒的に不利だ。#n敵が隙を見せない限りここから一歩も動けない。"
10058060-299 = "そうですね、アズサちゃん。#n煙幕を張っても位置を予測して撃ってきたので、逃げるのは無理でしょうね。"
10058060-300 = "望遠鏡でしばらく観察します。#n音と威力を考えると、撃っているのはおそらく56口径100ミリのHE弾でしょう。#n使う人は珍しいですが。"
10058060-301 = "どうしてそんなこと知ってるの……？"
10058060-302 = "あはは、たまたま知ってただけですよ。#n……あ！例の戦車、あっち側に撃ち始めましたよ！えっと、あそこは……。"
10058060-303 = "ヒフミ？"
10058060-304 = "……！"
