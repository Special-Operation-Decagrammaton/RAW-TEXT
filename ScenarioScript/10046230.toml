[translation]
10046230-3 = "서, 선배!"
10046230-4 = "어라, 코하루? 여기는 무슨 일임까?"
10046230-5 = "도와주러 왔어요! 저도 엄연히 정의실현부니까요!"
10046230-6 = "음. 그렇지만, 코하루는 아마 지금 소속이……."
10046230-10 = "…………."
10046230-11 = "뭐, 그러면 부탁해 볼까요?"
10046230-12 = "저, 정말요?!"
10046230-13 = "물론이죠. 코하루처럼 훌륭한 후배가 지원해 준다면 저도 든든하지 말임다."
10046230-14 = "이치카 선배하고, 첫 합동 작전……!"
10046230-15 = "저 진짜, 진짜로 열심히 할게요!"
10046230-16 = "네, 의지하고 있지 말임다."
10046230-21 = "해, 해냈다!"
10046230-22 = "여기서 선배님께 멋진 활약을 보여주고, 당당하게 정의실현부로 복귀하는 거야!"
10046230-28 = "…………."
10046230-29 = "아니, 코하루가 보충수업 받는 것은 성적 때문이니까, 시험을 잘 봐야 하지 않나……?"
10046230-30 = "뭐, 모처럼 신났는데 분위기 깨는 것도 그렇네."
