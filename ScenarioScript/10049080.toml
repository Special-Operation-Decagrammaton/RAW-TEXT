[translation]
10049080-1 = "제8화;헬멧단에게 물어봐!"
10049080-2 = "으아앙 잘못했어!!!"
10049080-3 = "사, 살려줘!! 대장 약점 다 말할 테니까아!!!"
10049080-4 = "대장은 손아귀 힘이 약해서 잼 뚜껑을 못 따요!!"
10049080-5 = "아! 그리고! 2층 침대 위층이 무서워서 못 잔다구!"
10049080-6 = "야!!!!"
10049080-14 = "오-!"
10049080-15 = "휴……."
10049080-16 = "차 배터리가 있어서 다행입니다."
10049080-17 = "전력이 끊어진 창고라서 배터리로 전등을 켜야 하네요."
10049080-18 = "……그런데, 아까 무슨 이야기를 한 거죠?"
10049080-19 = "[s1] \"2층 침대가 무섭대.\"\n[s2] \"잼 뚜껑을 못 연대.\""
10049080-22 = "아, 진짜!! 선생!!!"
10049080-23 = "그럴 수도 있지요."
10049080-24 = "일단, 하나씩 정리하고 싶은데……."
10049080-25 = "먼저 시미코 씨, 그 옷차림은……?"
10049080-26 = "앗, 네! 마법소녀 헤비캘리버의 악의 간부, '에라'인데요."
10049080-27 = "그건…… 딱 봐도 그래 보입니다만……."
10049080-28 = "그동안 어디 계셨던 건가요?"
10049080-29 = "어…… 두 분이 제게 부탁드린 건 악의 간부잖아요?"
10049080-30 = "네? 그렇죠……?"
10049080-31 = "악의 간부가 마법소녀하고 처음부터 같이 다니면…… 이상하지 않나요?"
10049080-33 = "논리적으로 맞긴 합니다, 스즈미 씨!"
10049080-34 = "[ns] \"생각해보니 그렇긴 하지!\""
10049080-36 = "……."
10049080-37 = "그래도, 기습의 효과가 있어서 다행이었다고 생각합니다……."
10049080-38 = "시미코 씨, 가장 필요한 때에 잘 오셨어요."
10049080-42 = "다음은, 코마카제 라브 씨."
10049080-43 = "아까부터 물어보려고 했습니다만……."
10049080-44 = "몇 가지 물어보겠습니다."
10049080-45 = "이 놀이공원에서 무엇을 꾸미고 계셨던 건가요?"
10049080-46 = "뭐? 그게 대체 뭔 소리야?"
10049080-48 = "여러분들이 구 도서관 뒤에서 사흘 전에 이야기하시는 걸 들었어요!"
10049080-49 = "분명, '놀이공원이 박살 나고, 사람들이 다친다'고 하셨어요!"
10049080-50 = "수류탄도 저렇게 잔뜩 들고 다니면서요!"
10049080-52 = "켁, 그걸 네가 듣고 있었어?"
10049080-53 = "그러게 그런 이야기는 모모톡으로 하는 게 좋댔잖아!"
10049080-55 = "너희들 그게 뭔 소리야?"
10049080-56 = "놀이공원을 박살 내고 사람들을 다치게 할 생각이었어?"
10049080-57 = "내가 너희들한테 그런 걸 가르쳤냐!!"
10049080-59 = "아, 아니에요 대장!! 우리가 뭐 하러 그래요?!"
10049080-60 = "박살 내고 다치게 할 폭탄이나 힘이 있으면 철거 아르바이트라도 했겠죠!"
10049080-61 = "그런 것도 밥 잘 먹어야 하는 건데!"
10049080-63 = "그러면? 쟤들이 무슨 이야기를 하는 거야?"
10049080-65 = "기억은 전혀 안 나는데, '그 녀석'에 대해 말한 거 아니에요?"
10049080-66 = "그 녀석이 저항하고 도망치면 싸우느라 그럴 것 같다고 말한 것 같기도 하고……."
10049080-68 = "잠깐, 잠깐만요. '그 녀석'은 뭐죠?"
10049080-69 = "천천히, 하나씩 설명해 주십시오."
10049080-71 = "말해주면 이제 우리 좀 그만 귀찮게 할 거냐? 앙?"
10049080-72 = "물론입니다. 나쁜 일을 하시는 게 아니라면 말이죠."
10049080-74 = "[ns] \"스즈미의 말은 나도 보증할게.\""
10049080-75 = "쳇, 선생까지 끼어들고……."
10049080-76 = "알았어, 알았어. 하아……."
10049080-77 = "우리는 지금 단속반 비슷한 일을 하고 있어."
10049080-78 = "헬멧단이 단속을요? 그럴 권한이 있나요?"
10049080-79 = "왜, 안 되냐? 좋은 일 하는 건데 권한이 필요해?"
10049080-83 = "좋은 게 좋은 거잖아. 우리도 돈만 잘 벌리면 멀쩡한 일이 더 좋지."
10049080-84 = "발키리도 선도부도, 정의실현부도 귀찮게 안 굴 테니까."
10049080-85 = "아무튼…… 요새 이상한 짝퉁 물건들이 나돌고 있단 말이지."
10049080-86 = "그걸 유통하는 녀석을 잡아오면 피해 회사에서 포상금을 준다는 거야."
10049080-87 = "그래서 정보를 전해 듣고 잡아서 한몫 챙기려고 했지."
10049080-89 = "가짜…… 물건이요?"
10049080-90 = "그래, 저 수류탄 같은 것들 말이야."
10049080-91 = "뭐 별 요상한 소리를 하더라구. 게르마늄 수류탄이라는 둥, 안전핀이 삼각형이라서 트라이앵글 포스가 건강에 도움이 된다는 둥……."
10049080-92 = "그 이외에 잡스러운, 싸구려 불량품도 팔아치우지."
10049080-93 = "바람 새는 풍선이라든지, 부실한 짝퉁 팝콘 통이라든지."
10049080-94 = "저기 있는 수류탄하고 팝콘 통은 몰래 압수했는데, 정작 파는 녀석을 못 찾고 있어."
10049080-95 = "놀이공원이 보통 넓어야 말이지, 결국 놓치겠네. 쯧."
10049080-96 = "바람 새는 풍선…… 부실한 팝콘 통……?"
10049080-98 = "이 풍선, 아까 샀는데 벌써 바람이 다 빠져버렸어!"
10049080-99 = "팝콘 통 뚜껑이 떨어졌어! 우애앵-"
10049080-100 = "우애애앵-"
10049080-101 = "이거 바꿔주세요! 바꿔줘-!"
10049080-109 = "왜 밧줄을 풀어주는 거야? 집에 보내주게?"
10049080-110 = "……일단, 라브 씨. 그리고 헬멧단 일행분들."
10049080-111 = "저의 큰 오해로, 여러분을 방해하게 되어 죄송합니다."
10049080-113 = "뭐? 하! 남의 일을 방해하고 사과 하나로 끝날-"
10049080-118 = "진심으로, 죄송합니다."
10049080-122 = "에, 에엥?! ……그, 그래?"
10049080-123 = "뭐, 뭐어……. 누구라도 착각할 수는 있잖아?"
10049080-124 = "제대로 사과받았으니까, 그러면 됐어! 이 문제는 이걸로 끝이야!"
10049080-126 = "저도 죄송합니다. 오해를 해버렸네요……."
10049080-127 = "저, 사과를……! 어떻게 해야……!"
10049080-129 = "됐다니까!!!"
10049080-130 = "사정은 알았습니다. 라브 씨."
10049080-131 = "지금 말씀하신 일, 저희가 도와드려도 괜찮을까요?"
10049080-132 = "엥?! 갑자기 왜? 뭔가 속셈이라도 있는 거 아니지?"
10049080-133 = "라브 씨의 일을 방해한 것에 대해, 행동으로 사죄드리고 싶은 것뿐입니다."
10049080-134 = "라브 씨가 생각하기에는, 그 사람들은 정의롭지 못한가요?"
10049080-135 = "내가 말하기도 뭣하지만, 썩 좋은 녀석들이라곤 말 못 하지."
10049080-136 = "그 사람들이, 선량한 사람들에게 피해를 준 것도 맞는 거지요?"
10049080-137 = "그런 사기를 당하면, 나라고 해도 되게 화날 것 같은데?"
10049080-138 = "알겠습니다."
10049080-139 = "제가 위치를 알고 있습니다. 거기서 멀리 가지는 않았을 겁니다."
10049080-140 = "자경단이 돕겠습니다."
10049080-142 = "……!"
10049080-143 = "준비됐습니다!"
10049080-144 = "그러면 도서부도, 최선을 다해서 돕도록 하겠습니다!"
10049080-146 = "[ns3] \"나도 준비됐어!\"\n[ns4] \"'샬레의 달리는 선생님'도 준비됐어!\""
10049080-150 = "킥. 그래, 공짜로 도와준다는데 거절하는 게 바보겠지."
10049080-151 = "녀석들, 수가 얼마나 될지도 모르니깐."
10049080-155 = "너희들, 자경단하고 도서부였어?!"
