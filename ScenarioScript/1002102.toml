[translation]
1002102-1 = "보호 대상"
1002102-2 = "(아무래도 가르쳐주지 않으면 안 될 것 같아 위치를 알려주었다.)"
1002102-3 = "(잠시 후, 저 멀리서 종종걸음으로 다가오는 아즈사의 모습이 보였다.)"
1002102-7 = "여기 있었구나, 선생님. 예상대로 무방비한 취약지점에 앉아 있었네."
1002102-8 = "갑자기 무슨 말이냐고? 말했잖아. 여긴 너무 위험하다고."
1002102-9 = "이렇게 탁 트인 장소, 엄폐할 곳도 방호할 곳도 없는 곳은 전술상 좋지 않아."
1002102-10 = "……응? 왜 해변에 와서까지 그런 걸 신경 쓰야 하는 거냐고?"
1002102-11 = "선생님은 너무 낙관적인 게 문제야. 적습이라는 건 원래 예기치 못한 데에서 오는 거라고."
1002102-12 = "이런 곳이야말로 전술적으로 공격당하기 가장 적합한 곳이라고."
1002102-13 = "조금 전만 해도…… 앗……!!"
1002102-14 = "선생님, 숙여!!"
1002102-17 = "[ns] \"……!?\""
1002102-19 = "……"
1002102-20 = "……후."
1002102-21 = "그냥 관광객이었나. 이젠 괜찮아. 다시 일어나도 좋아."
1002102-22 = "[s1] \"너무 긴장하지 않아도 될 거 같은데.\"\n[s2] \"왠지 긴장하고 있는 건 아즈사 쪽 같은데.\""
1002102-23 = "또, 또 그런 소릴……"
1002102-24 = "또, 또 그런 소릴……"
1002102-25 = "방금 전만 해도 정말 그들이 적의를 가지고 있었다면 위험했을 거야."
1002102-26 = "선생님이 무슨 말을 하는지는 알아. 하지만 만에 하나라는 것은 항상 위험한 법이니까."
1002102-27 = "그런 걸 안 챙기면, 나중에 당했을 때는 이미 되돌릴 수 없게 된다고."
1002102-28 = "역시 안 되겠어. 어서 장소를 옮기자. 내가 보다 안전한 장소를 찾아볼 테니까."
1002102-29 = "응? 여기 있고 싶다고?"
1002102-30 = "선생님…… 그렇게 이야기를 했는데도……"
1002102-31 = "……으으음……"
1002102-32 = "[s] \"……아즈사?\""
1002102-33 = "하아…… 알았어. 보호 대상의 의견을 존중하는 것도 필요한 일이지."
1002102-34 = "……하지만 대신 지금부터 내가 하는 말에 따라줘야 해."
1002102-35 = "우선 이곳을 안전하게 만들테니까 조금만 기다려. 다른 곳으로 가면 안 돼."
1002102-36 = "[s] \"안전하게 만든다고?\""
1002102-37 = "응. 최소한의 안전장치는 있어야 하니까. 오래 걸리진 않을 거야."
1002102-39 = "(스윽-.)"
1002102-40 = "[s] \"갑자기 삽을 들었어!?\""
1002102-41 = "물론. 진지를 만들어야 하니까."
1002102-42 = "걱정 마. 익숙하니까 금방 할 수 있어. 마침 땅도 파기 편한 모래고."
1002102-44 = "(뭐라 말릴 새도 없이, 아즈사는 숙련된 몸놀림으로 모래를 파 내려가기 시작했다.)"
1002102-46 = "음. 어설프긴 하지만 우선은 이 정도일까. 어느 정도 모양새는 갖춘 것 같아."
1002102-47 = "[s3] \"벌써 다 했다고!?\"\n[s4] \"그 짧은 시간에!?\""
1002102-48 = "이 정도는 이골이 나도록 해 온 일이야. 칭찬받는 게 기쁜 일도 아니고."
1002102-49 = "이 정도는 이골이 나도록 해 온 일이야. 칭찬받는 게 기쁜 일도 아니고."
1002102-50 = "그렇지만 지금은 이게 선생님을 지키는 데에 도움이 되네. 역시 세상 일은 모르는 걸까."
1002102-51 = "자, 선생님. 이리로 들어오도록 해."
1002102-54 = "(아즈사의 옆으로 들어가 앉았다.)"
1002102-55 = "(아즈사의 말대로, 모래이긴 하지만 꽤 아늑하고 깊게 파여 있어 작은 부스 같았다.)"
1002102-56 = "……후우…… 이걸로 안심……"
1002102-57 = "음? 왜 그래, 선생님?"
1002102-58 = "……응? 뭐라고?"
1002102-59 = "역시 긴장하고 있는 건 내 쪽이었냐고……?"
1002102-60 = "여기선 좀 더 편하게 있어도 된다고?"
1002102-61 = "그, 그게 무슨 말도 안 되는……!"
1002102-62 = "몇 번이나 이야기 했잖아. 이건 전부 선생님의 안전을 위해서라고 말이야."
1002102-63 = "나는 전혀 긴장하지 않았어. 그저 사주경계에 철저한 것뿐이야. 오해하지 마."
1002102-64 = "굳이 선생님한테 이렇게 찾아온 것도……"
1002102-65 = "……뭐, 뭐야 그 얼굴……"
1002102-66 = "왜 그렇게 보는 거야……?"
1002102-67 = "[s5] \"긴장 푸는 데는 당분이 좋대. 뭐 먹을래?\"\n[s6] \"긴장될 땐 언제든 지금처럼 찾아와도 돼.\""
1002102-68 = "오, 오…… 좋은 생각이야. 그럼 나는……"
1002102-69 = "……?"
1002102-70 = "저, 정말……? 괜찮은 거야, 선생님?"
1002102-71 = "그럼 계속……"
1002102-72 = "……아."
1002102-73 = "……~~!!!!"
1002102-76 = "(새빨간 얼굴의 아즈사가 쏜 총성이 허공으로 울려 퍼졌다.)"
1002102-77 = "(……당연히 주변 가게주인들이 몰려와서 주의를 주셨다. 아즈사와 함께 사과 드렸다.)"
