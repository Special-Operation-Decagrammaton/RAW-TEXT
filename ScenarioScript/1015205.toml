[translation]
1015205-1 = "カルペ・ディエム"
1015205-2 = "（仕事を片付け、ツムギが平和を広めている公園へと向かった）"
1015205-3 = ""
1015205-8 = "ひれ伏せェェェ！！暴徒どもォォォォ！！"
1015205-9 = "ラブ・アンド・ピース！ラブ・アンド・ピーーース！！"
1015205-10 = ""
1015205-13 = "[ns] \"今日も平和だなあ。\""
1015205-14 = "（リズムに合わせて頭を振りながら、ツムギのライブを見守った）"
1015205-15 = "（しばらくして……）"
1015205-17 = ""
1015205-18 = "ふふっ、やはりライブ後の甘いものは格別ですね。"
1015205-19 = "このメレンゲクッキーは、私のお気に入りなんです。"
1015205-20 = "チョコの飾りが目と口のようになっていて、愛らしいオバケに見えませんか？"
1015205-21 = ""
1015205-23 = ""
1015205-24 = ""
1015205-25 = "食感も「ぽわぽわ」していて、とても美味しいんです。"
1015205-26 = "[s] \"「ぽわぽわ」ってどんな感じ？\""
1015205-27 = "それを口で説明するのは、無粋というものです。"
1015205-28 = ""
1015205-30 = ""
1015205-31 = "是非、ご自身で確かめてみてください。"
1015205-32 = "[s] \"それなら、一口だけ……。\""
1015205-33 = ""
1015205-36 = ""
1015205-37 = "[ns] \"これが、ぽわぽわ……。\""
1015205-39 = "[ns] \"ツムギは言葉の選び方も「特別」だね。\""
1015205-40 = "……「も」ということは、他にも「特別」だと思うところがあるのでしょうか？"
1015205-41 = "差し支えなければ、詳しくお聞かせください。"
1015205-42 = "もちろん、「言葉の選び方」以外で。"
1015205-43 = "[s] \"演奏が上手いところ。\""
1015205-44 = "そうでしょうか？"
1015205-45 = "お恥ずかしい話、私の演奏はそれほど特別ではありません。"
1015205-46 = "私より優れている人は、周りにいくらでもいます。"
1015205-47 = "[s] \"歌が上手いところ。\""
1015205-48 = "それに関しても、私よりお上手な方はたくさんいらっしゃいますよ。"
1015205-49 = "客観的に見て……私は平均より少し上、といったところでしょうか。"
1015205-50 = "[s] \"博識なところ！\""
1015205-51 = "私はただ、比喩表現を使うのが好きなだけで……。"
1015205-52 = "博識、とは少し違う気がします。"
1015205-53 = "[s] \"そんな子が、銃のギターでデスメタルをやってる！\""
1015205-54 = "あ……。"
1015205-55 = "ふふっ。たしかに、そこは「特別」かもしれませんね。"
1015205-56 = "[s] \"自分でも「特別」だと思ってたんだね。\""
1015205-57 = "ふふ……。"
1015205-58 = "私の好きな童話に、動物の音楽隊のお話があります。"
1015205-59 = "居場所を失った動物たちが、音楽隊に入るべく旅に出る物語ですが――"
1015205-60 = "動物たちは……結局目標を達成できずに終わります。"
1015205-61 = "でも、悲しんだりはしませんでした。"
1015205-62 = "目標に届かなくても……新しく見つけた安らぎの住処が、とても気に入ったからです。"
1015205-63 = "そうして、動物たちはいつまでも幸せに暮らしました。"
1015205-64 = "……。"
1015205-65 = "なぜ、この物語を好きなのかというと――"
1015205-66 = "私も見つけたからです。"
1015205-67 = "私だけの、理想郷を。"
1015205-68 = "もしかすると、それこそが先生のおっしゃる「特別な私」なのかもしれませんね。"
1015205-69 = "[s] \"それって……。\""
1015205-70 = "しーっ。そこまでですよ。"
1015205-71 = "何はともあれ、私は今の自分にとても満足しています。"
1015205-72 = "ある時は一人で、ある時はバンドのみんなで音楽を奏でて……。"
1015205-73 = "ある時は寮のみんなとオカルトを研究し、#nまたある時は、専攻の仲間たちと語り合い……。"
1015205-75 = "1日24時間では足りないくらい、充実した毎日を送っています。"
1015205-76 = "過ぎ去った日々を懐かしく思うこともありますが……。"
1015205-77 = "「現在」も、いずれは過去になるもの。"
1015205-78 = "いつの日か、今この瞬間を愛おしく思う日が訪れるでしょう。"
1015205-79 = ""
1015205-80 = ""
1015205-81 = "ですから、後悔がないように「今」を生きなければいけません。"
1015205-82 = "そんな「今」の連続の先に……幸せな未来が待っていると、私は信じています。"
1015205-83 = "――まさに「[ruby=カルペ・ディエム]この瞬間を生きる[/ruby]」ですね。"
1015205-84 = "[s] \"それが、ツムギの求める「芸術」なんだね。\""
1015205-85 = "ええ。"
1015205-86 = "[s1] \"なら、これからも傍で支えるよ。\"\n[s2] \"ツムギが自由に、後悔ない日々を過ごせるようにね。\""
1015205-89 = "まあ……！"
1015205-90 = "ふふっ……ロマンチックなお言葉ですね。"
1015205-91 = "先生の中で、私はよほど「特別」な生徒だったのですね。"
1015205-92 = "お気持ちは嬉しいのですが――"
1015205-93 = "先生の「ご要望」には、まだお応えできません。"
1015205-94 = "[s] \"ご要望って何！？！？\""
1015205-95 = "さあ？何でしょうね。"
1015205-96 = "少なくとも、バニーガールの格好が含まれていることだけは分かります。"
1015205-97 = "[s] \"そんな想像してないから……！\""
1015205-98 = "ふふ、そうでしょうか？"
1015205-99 = "それにしても、先生と過ごす時間は楽しいですね。"
1015205-100 = "ご存知でしたか？先生を見ていると、色々なメロディが頭に浮かんでくるんです。"
1015205-101 = "今はまだ、小さな音の断片なので……お聴かせすることは出来ませんが……。"
1015205-102 = "いつか、きちんとした形でお届けできたらと思います。"
1015205-103 = "先生のためだけに創った、私だけの曲を。"
1015205-104 = "[s] \"ジャンルは？デスメタルかな？\""
1015205-105 = "それは……その時までのお楽しみ、ということで。"
1015205-107 = "（ツムギがどんな曲を作ってくれるのか楽しみにしながら――）"
1015205-108 = "（二人でゆっくり、スイーツを味わった）"
