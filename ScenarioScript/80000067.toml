[translation]
80000067-1 = "신경 쓰면 지는 것들"
80000067-2 = "(네루의 연락을 받고 밀레니엄 캠퍼스로 나와 기다리고 있었다.)"
80000067-3 = "여어! 선생! 여기야, 여기!"
80000067-4 = "[s1] \"……네루?\"\n[s2] 소리가 난 쪽으로 돌아본다."
80000067-8 = "하하! 뭐야, 선생. 생각보다 일찍 나와 있었잖아? 미안하게 시리."
80000067-9 = "……응? 무슨 일이냐고? 어……. 아니. 갑자기 그렇게 물어보면 좀 무안해지는데."
80000067-10 = "별로 그리 대단한 일은 아니라고. 혹시 뭔가를 기대하고 온 거라면 내가 미안해지잖아."
80000067-11 = "난 그냥 이것 때문에 부른 거라서……."
80000067-15 = "아냐, 아냐. 그래도 선생이라면 분명 좋아할 거야. 굉장한 걸로 골라왔으니까 말이지."
80000067-16 = "……자! 봐봐! 이거야!"
80000067-21 = "[ns3] \"이, 이건……?\"\n[ns4] \"이건 또 엄청난 모양새의 물건이…….\""
80000067-22 = "하하하하! 놀랐어? 놀랐지? 어때!"
80000067-23 = "하하하하! 놀랐어? 놀랐지? 어때!"
80000067-24 = "멋지지? 솔직히 굉장하지 않아? 찾느라 꽤 고생했다고! 어딜 가도 다 밋밋하고 재미없는 것들밖에 없어서……."
80000067-25 = "……응? 이게 뭐냐고?"
80000067-26 = "아하하하! 선생! 모르는 거야? 아니면 잊고 있었던 거야? 오늘은 발렌타인 데이잖아!"
80000067-27 = "선생도 참 정신없이 사네. 뭐, 그래도 걱정 마, 이런 건 서운하지 않게 내가 딱딱 챙겨 줄 테니."
80000067-28 = "……엉? 그런 뜻이 아니라고? 초콜릿의 디자인? ……디자인이 왜?"
80000067-29 = "음……. 역시 좀 더 큰 걸로 가져올 걸 그랬나? 이 정도로는 밋밋한가?"
80000067-30 = "아니면 아예 용 모양으로 조각된걸……."
80000067-31 = "……뭐?"
80000067-32 = "발렌타인 데이의 의미를 알고 있냐고? ……글쎄?"
80000067-33 = "초콜릿 주는 날 아냐? 이게 아닌가? ……혹시 뭐 잘못됐어?"
80000067-34 = "[s5] \"……아니. 역시 신경 쓰지 마.\"\n[s6] \"뭐, 이건 이것대로 훌륭하네.\""
80000067-35 = "하하하!! 그래. 바로 그거야. 사소한 건 신경 쓰지 말자고."
80000067-36 = "하하하!! 그래. 바로 그거야. 사소한 건 신경 쓰지 말자고."
80000067-37 = "자, 자. 그것보다. 빨리 열어봐."
80000067-38 = "사실 아까부터 무슨 맛인지 계속 궁금했다고. 같이 먹어봐도 괜찮지?"
80000067-39 = "[s7] \"발렌타인 초코를……?\"\n[s8] \"이걸 다시 뺏는다고……?\""
80000067-40 = "……뭐야? 표정이 왜 그래?"
80000067-41 = "……뭐야? 표정이 왜 그래?"
80000067-42 = "설마 안 된다고 할 셈이야? 에이, 쩨쩨하게 왜 그래? 내가 사 온 거잖아!"
80000067-46 = "그러지 말고 같이 먹자고~. 자, 자. 여기 와서 앉아!"
80000067-47 = "[s] \"…….\""
80000067-49 = "(……이후 네루와 나란히 앉아 네루가 사 온 초콜릿을 나눠 먹었다.)"
80000067-50 = "(모양새에 집중한 초콜릿이라 그런지, 솔직히 맛은 평범했다.)"
