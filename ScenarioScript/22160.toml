[translation]
22160-1 = "제16화;체크메이트 선언"
22160-17 = "…………"
22160-21 = "토키에게 일임한 에리두의 재배치 권한을 통한 C&C의 격리 조치."
22160-23 = "C&C라는 최대의 전력을 무력화시킨다면 그 이후에 남은 건 선생님뿐……."
22160-25 = "제아무리 샬레의 선생이라 할지라도 종국엔 이해하고 받아들일 수밖에 없을 거야."
22160-26 = "……무엇이 옳고 그른지."
22160-30 = "무엇이 <합리적인 판단>인지 말이야."
22160-31 = "체크메이트야."
22160-35 = "음음, 과연……. 그렇군요. 리오."
22160-36 = "당신이 짜 맞춘 주도면밀한 계획. 목적을 이루기 위해 취한 과감한 수단."
22160-37 = "그건 분명 어떤 의미로는 <합리적>일지도 몰라요."
22160-38 = "히마리……."
22160-39 = "하지만 역시나 저는 당신의 그런 독선에는 찬동할 수 없어요."
22160-40 = "………………그래."
22160-41 = "리오, 한 가지 충고해 두도록 할게요."
22160-42 = "당신은 확실히 우수해요."
22160-43 = "잘도 멋대로 밀레니엄의 자금을 횡령해서 이런 도시를 만들었네요~ 라며 감탄도 하고 있다고 할지."
22160-44 = "와, 뻔뻔해라. 라고 놀라기도 한다고 할지."
22160-45 = "……무슨 의미야?"
22160-46 = "당신은……. 자신이 옳다고 믿는 게 있으면 뒤를 돌아보는 일 따윈 없이 밀고 나가기를 주저하지 않지요."
22160-47 = "그건 당신의 커다란 강점이자……."
22160-48 = "동시에 커다란 약점이기도 해요."
22160-49 = "약점이라니, 내게 그런 건……."
22160-50 = "리오, 당신은 자신이 품은 고민을 후배들에게 말한 적이 있나요?"
22160-51 = "……."
22160-52 = "약점이란 건 거창한 걸 말하는 게 아니에요."
22160-53 = "너무 우수한 까닭에, 남과 보폭을 맞출 생각도, 기다릴 생각조차 않는 당신의 바로 그런 점이야말로."
22160-54 = "당신의 커다란 약점이랍니다."
22160-60 = "폭발음?! 그럴 리가……."
22160-61 = "진짜는, 지금부터랍니다."
22160-62 = "히마리, 잠ㄲ……!"
22160-67 = "……이런 상황에서 외부의 습격?"
22160-68 = "그럴 리가."
22160-69 = "사전에 <위협>이 될 수 있는 세력은 전부 마크했어."
22160-70 = "그런데 대체 누가……."
22160-73 = "이쪽이야. 히마리 부장."
22160-74 = "후후, 설마 에이미…… 당신이 저를 구하러 올 줄은……."
22160-75 = "이것은 리오를 향한 배신이 될 텐데, 정말 괜찮은 건가요?"
22160-76 = "으음~ 글쎄?"
22160-77 = "\"내가 리오를 만나러 간 뒤, 24시간이 지나도 돌아오지 않으면 냉장고에 있는 푸딩은 먹어도 좋아요.\"라고 부장이 말했잖아."
22160-78 = "하지만 역시 그런 건 같이 먹는 편이 좋겠네~ 하고 생각했을 뿐이야."
22160-79 = "그런가요……."
22160-80 = "역시 후배는 두고 볼 일이네요. 후후후~"
22160-81 = "뭐, 덕분에 아까 전에 봤던 리오의 표정. 엄청 재미있었답니다. 만족했어요."
22160-82 = "……대체 누가 악취미라는 건지."
22160-83 = "어머, 악취미가 아니라. 천재병약미소녀해커의 고상한 취미라고 해주시겠어요?"
22160-84 = "하지만 그렇다고 해도 부장…… 상황이 안 좋긴 마찬가지 아냐?"
22160-85 = "이대로라면 모두 당해버릴 거야. 우리가 가세한다고 해도 될지, 안 될지……."
22160-86 = "아, 그거라면 괜찮아요."
22160-87 = "어? 뭔가 상황을 타개할 비장의 방법이라도 있어?"
22160-88 = "네, 물론이랍니다."
22160-89 = "에이미가 이렇게 저를 구하러 와준 것처럼."
22160-90 = "제겐 의지할 수 있는 후배들이 잔뜩 있거든요."
22160-92 = "……?"
22160-94 = "베리타스 부실"
22160-95 = "우와앗! 이거, 어떡하면 좋아?! 완전히 통신이 먹통인데?!"
22160-100 = "……안 되겠어. 네트워크가 완전히 침묵했어."
22160-101 = "이래서야 손쓸 방도는 전혀……"
22160-102 = "어쩌면 좋지…… 생각해야 해. 어떻게 하면 이 상황을……"
22160-103 = "C&C는 물론, 선생님까지 당하게 생겼습니다."
22160-104 = "……칫, 상대의 대비책을 얕봤어."
22160-105 = "처음부터 우회로든, 아니면 우리가 직접 현장으로 향하든. 재밍에 대한 대책은 확실하게 준비할 필요가 있었을 텐데……."
22160-106 = "……우리만으로는…… 여기까지인 걸까요?"
22160-107 = "그런 건 싫어! 아리스 쨩은……! 지금 이러고 있는 동안에도……!"
22160-109 = "……뭔가, 방법이……"
22160-112 = "……"
22160-114 = "잠깐. 마키, 코타마 선배."
22160-115 = "왜 그래?! 하레 선배?!"
22160-116 = "모니터에…… 문자열이……."
22160-117 = "…………………………"
22160-119 = "……………………………………………"
22160-121 = "이건……."
22160-122 = "………………………………………………………………………………<Optimus Mirror System>"
22160-125 = "<거울> 기동."
22160-129 = "……어?"
22160-140 = "무자비한 화력입니다!"
22160-141 = "……이대로는 정말 전부 전멸해버릴지도."
22160-142 = "위험한 순간이로군."
22160-143 = "[ns] \"그러니까 어쩐지 다들 엄청 침착하다니까?!\""
22160-147 = "우와아앙! 이, 이번엔 확실히 이쪽을 노리고 있는데?!"
22160-148 = "[s] \"모두들! 조심……!\""
22160-155 = "아방가르드군의 움직임이……"
22160-156 = "갑자기 느려졌, 어?"
22160-164 = "하아…… 늦지 않았네."
22160-165 = "모두, 아직 무사한 거지?"
22160-166 = "[s] \"………치히로!\""
22160-168 = "다음화;역전의 발판"
