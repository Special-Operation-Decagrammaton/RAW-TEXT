[translation]
12020-1 = "제2화;게헨나의 선도부장"
12020-2 = "게헨나의 선도부장이라면…… 소라사키 히나."
12020-3 = "모습도 알려진 정보와 일치해요. 정말 본인인가봐요."
12020-4 = "하지만 게헨나 선도부장이라면…… 실제 게헨나의 무력 서열 1위……. 그 정도의 인물까지 여기에……."
12020-6 = "……."
12020-7 = "그, 그러니까…… 불량 학생들을…… 잡으러……."
12020-8 = "흥신소 68? 어디에 있지? 지금은 샬레와 대치하고 있는 걸로 보이는데."
12020-9 = "네? 흥신소라면 분명……."
12020-12 = "(휘이이잉-)"
12020-13 = "어, 언제 도망친 거죠?! 바, 방금 전까지 여기 있었는데……."
12020-14 = "……."
12020-15 = "그, 그러니까…… 제, 제가 전부 설명하겠습니다…… 부장님."
12020-16 = "……."
12020-17 = "아니, 이제 됐어. 대충 알 것 같으니까."
12020-18 = "말하자면 게헨나의 불안요소의 확인 및 제거. 그런 정치의 일환이었겠지."
12020-19 = "……."
12020-20 = "하지만 아코. 우리는 선도부다. 학생회가 아니야."
12020-21 = "샬레, 티파티…… 총학생회장…… 그런 [ruby=판데모니움 소사이어티]건 <만마전>의 [/ruby]너구리들에게나 맡기면 그만이야."
12020-22 = "자세한 이야기는 돌아가서 하지. 통신을 끊고 선도부실에서 자숙하고 있어라. 아코."
12020-23 = "……네."
12020-26 = "……."
12020-28 = "……."
12020-29 = "……."
12020-30 = "……."
12020-31 = "……."
12020-32 = "[s] \"………….\""
12020-33 = "그럼 다시 해볼까."
12020-35 = "자, 잠깐만요! 게헨나의 선도부장이라면 키보토스에서도 그 상대를 찾기 힘들 정도의 강자 중의 강자예요!"
12020-36 = "여기서는 성급하게 움직이지 말고 일단 교섭해야 해요! 왜 이렇게 싸움을 좋아하는 거예요, 다들!"
12020-37 = "……으, 으음."
12020-39 = "이쪽은 아비도스 대책위원회입니다. 게헨나의 선도부장님."
12020-40 = "이 상황에 대해서는 이해하고 계신가요?!"
12020-41 = "……."
12020-42 = "물론."
12020-43 = "사전 통보 없는 타 자치구 근방의 무단 병력 운용 및 타 학원생들과의 충돌이 발생했지."
12020-44 = "……하지만 어찌됐든 선도부의 공무를 가로막은 것 또한 사실이다. 아비도스."
12020-45 = "……?!"
12020-46 = "그래."
12020-47 = "그래서?"
12020-48 = "저희의 입장은 달라지지 않아요."
12020-49 = "잠깐만요…… 흥신소도 없는 상태에다 저쪽 병력 숫자는 달라지지 않았고…… 우린 선생님 밖에 없고……. 다른 사람들을 말리기도 힘들고……."
12020-50 = "이럴 때 호시노 선배가 있었으면……."
12020-51 = "……호시노?"
12020-52 = "……?"
12020-53 = "아비도스의 호시노……라면…… 타카나시 호시노……?"
12020-54 = "네?"
12020-55 = "으헤~ 이건 또 무슨 일인 걸까나. 완전 난리가 났네."
12020-60 = "!!"
12020-61 = "응?!"
12020-62 = "호, 호시노 선배?!"
12020-64 = "미안, 미안. 잠깐 낮잠을 자다가 말야. 조금 늦어버렸지 뭐야."
12020-65 = "……."
12020-67 = "뭐하다 이제 온 거야! 엄청 난리가 났었다고! 게헨나 녀석들이……."
12020-68 = "하지만 우리가 전부 해치웠지."
12020-69 = "전부 해치운 건 아니지만……."
12020-71 = "게헨나의 선도부……라는 걸까나~ 흥신소를 쫓아서 여기까지 온 거야?"
12020-72 = "……."
12020-73 = "좋아. 사정은 모르지만 대책위원회는 이걸로 풀파티라구. 다시 한번 해볼까? 선도부 쨩?"
12020-74 = "……."
12020-75 = "……1학년 때랑은 많이 달라졌군. 다른 사람인 줄 알았어."
12020-76 = "응? ……이 아저씨를 알아?"
12020-77 = "정보부에 있었을 때 각 자치구의 요주의 학생들을 어느정도는 파악해두었었지."
12020-78 = "특히 타카나시 호시노……. 너는 잊을 수가 없지. 그 사건 이후로 아비도스를 떠난 줄 알았는데."
12020-79 = "……."
12020-80 = "……그렇군. 그런 건가. ……그래서 샬레가……."
12020-81 = "……."
12020-82 = "뭐. 됐다. 나도 여기에 싸우러 온 건 아니니까."
12020-84 = "……이오리. 치나츠."
12020-86 = "으, 응. 부장."
12020-87 = "……네."
12020-92 = "병력을 수습해라. 돌아간다."
12020-93 = "응?!"
12020-94 = "돌아간다고요?!"
12020-100 = "(꾸벅)"
12020-101 = "어라-?"
12020-102 = "허, 허리를 굽혔어요?!"
12020-103 = "사전에 통보되지 않은 병력 운용. 그리고 타 자치구에서 소란을 피운 것."
12020-104 = "이 일에 대해서 게헨나 선도부장 소라사키 히나는 아비도스의 대책위원회에게 공식적으로 사과드립니다."
12020-105 = "!"
12020-106 = "?!"
12020-107 = "!!"
12020-108 = "지금 이후 게헨나의 선도부가 이곳에 무단으로 침입하는 일은 없을 것입니다. 부디 너그럽게 용서해주시길."
12020-111 = "부장님……."
12020-112 = "자, 잠깐만 부장! 교칙 위반자들…… 흥신소는 어쩌고?"
12020-113 = "(찌릿-)"
12020-114 = "아, 아으……."
12020-115 = "돌아가자."
12020-118 = "……."
12020-120 = "(휘이이이잉--)"
12020-121 = "선도부 전 병력…… 전속력으로 아비도스 외곽으로 사라졌어요……."
12020-122 = "저런 대규모 병력을 저렇게 일사분란하게…… 선도부장이라는 존재는 저런 것이군요."
12020-123 = "아쉽네. 강적들과 싸울 수 있는 기회였는데."
12020-124 = "시로코 선배는 무슨 어딘가의 전투 민족 같은 거야……. 뭐, 물론 시비를 걸면 피하진 않겠지만."
12020-125 = "으헤. 이 아저씨는 지금 상황이 도통 뭐가 뭔지 모르겠는걸. 무슨 일이 있었던 거야."
12020-126 = "그러게요…… 왜 온 걸까요, 저 선도부장님은?"
12020-127 = "모르겠는 건 우리도 마찬가지라구요! 대체 어디 있다가 온 거예요, 선배는!"
12020-129 = "미안, 미안."
12020-130 = "하아……. 뭔가…… 계속 일이 커져가는 느낌이에요."
12020-131 = "정신없고…… 정리도 잘 안돼요."
12020-132 = "아야네 쨩……."
12020-133 = "그래요. 오늘 너무 많은 일이 있어서……. 더는 무리하면 안될 거 같아요. 저희도 휴식이 필요해요."
12020-134 = "네. 일단 오늘은 해산하고 내일 학교에서 상황정리를 하시죠."
12020-135 = "……음. 그래, 아야네 쨩 말대로야. 오늘은 이만 해산. 내일 일찍 동아리실에서 만나자고."
12020-136 = "네."
12020-137 = "알겠어. 나도 좀 씻고 싶고……."
12020-141 = "……선생님."
12020-142 = "선도부장이 떠나기 전에 선생님한테 무슨 말을 했었던 거 같은데……."
12020-143 = "무슨 얘기였어?"
12020-146 = "하아……."
12020-147 = "이오리, 괜찮아요?"
12020-148 = "샷건으로 패닝 당하고 이리저리 구르고……. 아코 쨩한텐 혼나고 부장한텐 노려봐지고……. 오늘 일진이 사나워."
12020-149 = "……그러네요."
12020-150 = "저기…… 불쌍한 강아지 보듯 쳐다보지 말아줄래……?"
12020-151 = "동병상련이에요. 이오리."
12020-152 = "……그래."
12020-157 = "……. 샬레의 선생."
12020-158 = "[s] \"날 불렀어?\""
12020-159 = "그래. 잠깐 당신에게 할 말이 있어."
12020-160 = "이건 당신에게 말해두는 게 좋을 것 같아서."
12020-161 = "[s] \"무슨 말인데?\""
12020-162 = "……카이저 코퍼레이션이라고 알고 있어?"
12020-163 = "[s1] \"……잘 알고 있어.\"\n[s2] \"……대충은.\""
12020-164 = "……그런가."
12020-165 = "……그런가."
12020-166 = "……."
12020-167 = "이건 아직 판데모니움도, 티파티도 모르고 있는 정보이지만."
12020-168 = "……당신에겐 알려줘야 할 것 같다는 생각이 들었어."
12020-169 = "……."
12020-171 = "아비도스의 버려진 사막……. 거기에 카이저 코퍼레이션이 무슨 짓을 벌이고 있는 것 같아."
12020-172 = "[s3] \"아비도스의 사막에…….\"\n[s4] \"카이저 코퍼레이션이……?\""
12020-173 = "그래. 사실 폐교 예정인 아비도스에게도 알려줄 의리는 없는 정보이지만."
12020-174 = "그래. 사실 폐교 예정인 아비도스에게도 알려줄 의리는 없는 정보이지만."
12020-175 = "……그럼."
12020-176 = "다음에 또 보지. [USERNAME] 선생."
12020-179 = "……."
12020-180 = "[s] \"모두가 모여 있을 때 얘기해줄게.\""
12020-181 = "……응. 알겠어. 선생님."
12020-182 = "그럼 돌아가자."
12020-184 = "다음화;안녕, 흥신소 68"
