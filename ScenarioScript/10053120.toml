10053120-37 = "ทั้งรถบัสที่ปรากฏขึ้นมาในที่ที่ไม่ควรอยู่ รูปปั้นหินที่ขยับเองได้โดยลำพัง และตู้โทรศัพท์สาธารณะ#nที่มีสายโทรเข้าในตอนกลางคืน..."
