[translation]
10053120-1 = "後日談;anonymous who？"
10053120-3 = "原來如此……"
10053120-4 = "不愧是 [USERNAME] 老師。"
10053120-5 = "收穫比預期的還多呢。"
10053120-6 = "只要分析這些數據的話……就能更進一步……"
10053120-13 = "部長，怎麼不開燈？這樣眼睛會變差的。"
10053120-14 = "哎呀，英美？怎麼不敲門就進來，太沒規矩了。"
10053120-15 = "所以你又在看什麼奇怪的東西？"
10053120-16 = "那種說法並不成立，英美。請避免使用讓人誤以為我平時在看奇怪東西的措辭好嗎？"
10053120-17 = "不對吧，你確實經常看啊，外星人啦，UFO啦……"
10053120-18 = "這次是……哇……槌之子，真是過時的東西。"
10053120-19 = "英美，我想澄清一點，外星人、UFO和槌之子都不是奇怪的東西，而是未被證明的東西。"
10053120-20 = "如果認為未被證明的東西就不存在，那我們能發現什麼新東西呢？"
10053120-21 = "雖然是有點道理……但從部長嘴裡聽到就有點……"
10053120-22 = "你從剛才開始對我是不是有點刻薄！？#n我是像小王子的玫瑰花一樣，需要被呵護的存在耶！？"
10053120-23 = "那朵玫瑰是在宇宙正中央好好活著的超級玫瑰吧。"
10053120-24 = "總之，看在我們的關係上剛才的無禮就當作沒發生過吧。#n而且你來得正好，我正要找你呢。"
10053120-25 = "嗯？找我？超現象特務部的活動不是正式結束了嗎？"
10053120-26 = "在那之前，能看看這些數據嗎？"
10053120-32 = "……？"
10053120-33 = "這些數據是……？"
10053120-34 = "不知道。"
10053120-35 = "回答得真乾脆。"
10053120-36 = "畢竟實際上什麼都還沒有查明。"
10053120-37 = "「出現在不該出現的地方的巴士」、「會自己移動的石像」、#n「半夜打來的公共電話」……"
10053120-38 = "都是些用傳統常識和理論無法解釋的超自然現象。"
10053120-39 = "確實是「特異現象」呢……"
10053120-46 = "呵呵……如何呢，英美？"
10053120-47 = "不覺得我們還有事情要做嗎？"
