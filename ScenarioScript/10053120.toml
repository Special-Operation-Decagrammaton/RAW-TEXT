[translation]
10053120-1 = "後日談;anonymous who？"
10053120-3 = "原來如此……"
10053120-4 = "不愧是[USERNAME]老師。"
10053120-5 = "收穫比預期中還多呢。"
10053120-6 = "只要分析這些數據……就能進一步地……"
10053120-13 = "部長，怎麼不開燈呢？視力會變差的哦。"
10053120-14 = "哎呀，英美？#n沒有先敲門就進來，這樣有失禮節哦。"
10053120-15 = "話說，你又在看什麼奇怪的東西了嗎？"
10053120-16 = "那種說法並不成立哦，英美。#n能請你避免使用那種「會讓人誤以為我總是在看奇怪東西」的說法嗎？"
10053120-17 = "哪有，你明明就很常看啊？#n比如外星人啦，或者UFO之類的……"
10053120-18 = "這次是……哇，居然是槌之子。這也太過時了吧。"
10053120-19 = "英美，有件事我先跟你說清楚。#n外星人、UFO和槌之子都不是奇怪的東西，只是還沒有被證明而已。"
10053120-20 = "如果把還沒被證明的東西都視為不存在的話，我們又怎麼能發現新的事物呢？"
10053120-21 = "雖然是有點道理……不過從部長嘴裡聽到就有點……"
10053120-22 = "你從剛才開始是不是就對我有點太刻薄了！？#n我是像小王子的玫瑰花一樣，需要被呵護的存在耶！？"
10053120-23 = "那朵玫瑰，可是能在宇宙正中央好好活著的超級玫瑰耶。"
10053120-24 = "念在我們交情的份上，剛才的無禮我就當作沒發生過吧。#n而且你來得正好。我正打算請你過來呢。"
10053120-25 = "嗯？找我？特異現象搜查部的活動，不是已經正式結束了嗎？"
10053120-26 = "在那之前，可以先請你看看這些數據嗎？"
10053120-32 = "……？"
10053120-33 = "這些數據是……？"
10053120-34 = "不知道。"
10053120-35 = "回答得還真乾脆。"
10053120-36 = "因為實際上，什麼都還沒有查明。"
10053120-37 = "「在不該出現的地方出現的巴士」、「會自己移動的石像」、#n「半夜打來的公共電話」……"
10053120-38 = "都是無法用以往的常識和理論解釋的超自然現象。"
10053120-39 = "確實是「特異現象」呢……"
10053120-46 = "呵呵……怎麼樣呀，英美？"
10053120-47 = "不覺得我們還有事情要做嗎？"
