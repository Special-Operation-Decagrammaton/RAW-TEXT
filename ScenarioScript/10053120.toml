10053120-13 = "หัวหน้า ทำไมถึงปิดไฟทำอะไรอยู่ล่ะ? เดี๋ยวก็เสียสายตาหรอก"
10053120-14 = "ตายจริง เอมิ? เข้ามาโดยไม่เคาะประตูถือว่าเสียมารยาทนะคะ"
10053120-15 = "อะไรน่ะ กำลังดูอะไรแปลกๆ อีกแล้วเหรอ?"
10053120-16 = "ใช้คำพูดไม่สมเหตุสมผลเลยนะคะ เอมิ ช่วยงดการใช้คำพูดที่อาจทำให้คนอื่นเข้าใจผิด#nว่าปกติฉันชอบเปิดอะไรแปลกๆ ดูได้มั้ยคะ?"
10053120-17 = "แต่ก็ดูเยอะเลยไม่ใช่เหรอ? ทั้งพวกมนุษย์ต่างดาวหรือ UFO อะไรนั่น..."
10053120-18 = "ส่วนครั้งนี้ก็... ว้าว สึจิโนโกะสินะ แต่มันล้าสมัยไปแล้วไม่ใช่เหรอ?"
10053120-19 = "เอมิ ฉันอยากชี้แจงส่วนนี้ให้ชัดเจนค่ะ ทั้งมนุษย์ต่างดาว UFO และสึจิโนโกะไม่ใช่เรื่องแปลก แต่แค่เป็นสิ่งที่ยังไม่ได้รับการพิสูจน์ก็เท่านั้นค่ะ"
10053120-20 = "ถ้าเราปักใจเชื่อว่าสิ่งที่ไม่ได้รับการพิสูจน์นั้นไม่มีอยู่จริง แล้วเราจะค้นพบอะไรใหม่ๆ ได้เหรอคะ?"
10053120-21 = "มันก็จริงอยู่หรอก... แต่พอได้ฟังคำแบบนี้จากหัวหน้า มันก็..."
10053120-22 = "คะ?! ตั้งแต่เมื่อกี้แล้วนะ ดูจะพูดจาใจร้ายกับฉันไปหน่อยแล้วมั้ยคะ?! ฉันคือคนที่ต้องการการโอบกอด เหมือนกับดอกกุหลาบของเจ้าชายน้อยเชียวนะคะ?"
10053120-23 = "กุหลาบที่ว่าเป็น 'ซูเปอร์กุหลาบ' ที่รอดชีวิตกลางอวกาศได้สบายๆ ไม่ใช่เหรอ?"
10053120-24 = "เอาเป็นว่า... เพื่อรักษาความสัมพันธ์ของเรา ฉันจะไม่ถือสาที่มาเสียมารยาทก็แล้วกันค่ะ แล้วก็... มาได้จังหวะเลยค่ะ ฉันกำลังจะเรียกหาอยู่พอดีเลย"
10053120-25 = "หืม? เรียกฉันทำไม? ชมรมปรากฏการณ์ลี้ลับหยุดการทำกิจกรรมอย่างเป็นทางการไปแล้วไม่ใช่เหรอ?"
10053120-26 = "ช่วยดูข้อมูลนี้ก่อนได้มั้ยคะ?"
