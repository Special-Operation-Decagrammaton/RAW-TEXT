[translation]
10053120-1 = "후일담;anonymous who?"
10053120-3 = "과연."
10053120-4 = "역시나 [USERNAME] 선생님."
10053120-5 = "기대한 것보다 더 많은 수확이 모였군요."
10053120-6 = "이 데이터를 분석하면…… 한층 더……."
10053120-13 = "부장, 불 꺼놓고 뭐해? 그러다 눈 나빠진다."
10053120-14 = "어머, 에이미? 노크도 없이, 실례잖아요."
10053120-15 = "뭐야, 또 이상한 거 보고 있어?"
10053120-16 = "그 표현은 성립하지 않잖아요, 에이미. 제가 평소에는 이상한 것을 보고 있다는 오해가 생길 법한 어휘는 삼가 주실래요?"
10053120-17 = "아니, 엄청 보잖아. 외계인이라든지, UFO라든지……."
10053120-18 = "이번에는…… 우와, 츠치노코라니. 진짜 한물간 거잖아."
10053120-19 = "에이미, 이 부분을 명확히 해두고 싶네요. 외계인이나 UFO, 그리고 츠치노코는 이상한 게 아니라, 증명되지 않은 것이랍니다."
10053120-20 = "증명되지 않은 것은 존재하지 않는다고 간주한다면, 저희는 어떤 새로운 것을 발견할 수 있을까요?"
10053120-21 = "정론이기는 한데…… 그걸 부장한테 들으니까 좀……."
10053120-22 = "네?! 아까부터 저한테 조금 신랄하지 않아요?! 저는 어린 왕자의 장미꽃처럼, 보듬어줘야 하는 존재라고요?"
10053120-23 = "그 장미, 우주 한복판에서 멀쩡히 살아가는 슈퍼 장미잖아."
10053120-24 = "아무튼, 저희 사이를 봐서, 조금 전까지의 무례는 없던 걸로 해줄게요. 그리고, 마침 잘 왔어요. 안 그래도 부르려던 참이었거든요."
10053120-25 = "응? 나를? 왜? 초현상특무부 활동은 공식적으로 종료된 거 아니었어?"
10053120-26 = "그전에, 이 데이터들을 봐주시겠어요?"
10053120-32 = "……?"
10053120-33 = "……뭐야, 이 데이터는?"
10053120-34 = "모릅니다."
10053120-35 = "되게 딱 잘라 말하네."
10053120-36 = "실제로 규명된 것이 아무것도 없으니까요."
10053120-37 = "<있어서는 안 되는 곳에 나타난 버스>, <홀로 움직이는 석상>, <한밤 중 전화가 걸려오는 공중전화>……."
10053120-38 = "종래의 상식과 이론으로는 설명할 수 없는 초자연적 현상."
10053120-39 = "……그야말로, <초현상>이네."
10053120-46 = "……후후. 어때요, 에이미?"
10053120-47 = "우리에게는 아직 할 일이 남아 있는 것 같네요?"
