[translation]
901010400230-6 = ""
901010400230-7 = "นี่คือ FOX 1 รายงานความคืบหน้าด้วย FOX 2"
901010400230-8 = "FOX 2 รับทราบ เป้าหมายดูระแวงกันมาก ฉันก็เลยพยายามสร้างความสัมพันธ์ที่ดีก่อนเป็นอันดับแรก"
901010400230-9 = "ฉันลองถามเรื่อง <ปูในถังเหล็ก> แบบพูดลอยๆ ดู แต่ทุกคนทำเหมือนเพิ่งเคยได้ยินเป็นครั้งแรกเลย"
901010400230-10 = "พวกเขาแกล้งทำเป็นไม่รู้หรือเปล่า?"
901010400230-11 = "ถึงอาจจะมีคนโกหกอยู่บ้าง... แต่คนส่วนใหญ่ที่ทำงานในท่าเรือดูจะคิดว่าการเอาปูใส่ถังเหล็กเป็น#nเรื่องไร้สาระนะ"
901010400230-12 = "ถ้าจุดประสงค์คือทำให้ผู้คนทั่วไปในท่าเรือหวาดกลัว ก็น่าจะใช้วิธีข่มขู่ที่ดูสมจริงกว่านี้ไม่ใช่เหรอ?"
901010400230-13 = "มันก็จริงอยู่หรอกนะ คนที่รู้ดีว่าการเอาปูใส่ถังจะทำให้ปูตาย คงไม่เป็นคนปล่อยตำนานเมืองอย่าง <ปูถังเหล็ก> หรอก"
901010400230-15 = "ถ้างั้น วันนี้จะยุติการสืบสวนแค่นี้เหรอ? "
901010400230-16 = "อืม... เรายังพอมีเวลาเหลือ ฉันว่าเราไปย่านการค้าแล้วลองสอบถามผู้คนเพิ่มเติมกันดีมั้ย?"
901010400230-18 = "FOX 3 เห็นด้วย วันนี้ลมเย็นดี น่าจะทำงานต่อได้อีกหน่อย"
901010400230-19 = "FOX 4 ก็ไม่มีข้อโต้แย้ง ฉันจะตรวจรอบๆ ท่าเรือต่อ ว่ามีคนน่าสงสัยหรือเปล่า"
901010400230-21 = "เข้าใจแล้ว FOX 2 ย้ายไปที่จุดชาร์ลีแล้วปฏิบัติการต่อเลย"
901010400230-22 = "FOX 2 รับทราบ"
