[translation]
10000040-1 = "제4화;수행부의 괴짜들"
10000040-4 = "치잇! 이렇게나 쓰러트렸는데도 아직 끝도 없이 몰려들어선……!"
10000040-5 = "여기에 피나라도 있었으면……!"
10000040-7 = "잠까아아안! 악행도 거기까지다! 길거리 망량즈……!"
10000040-9 = "누, 누구냐?!"
10000040-11 = "우리가 누구냐고 물어보신다면 대답해드리는 게 인지상정!"
10000040-14 = "(두둥!)"
10000040-16 = "차앗! 샤샤샤샥!"
10000040-17 = "보다 화려하게!"
10000040-18 = "후아아암……. 보다 가련? 하게?"
10000040-19 = "보, 보다 아름답게에……. 마, 맞죠?"
10000040-20 = "후후후! 이렇게 어여쁜 소녀 셋이 모여 하나!"
10000040-21 = "이름하야 거리의 평화를 지키는 수행부……!"
10000040-22 = "여기에 등장!"
10000040-23 = "오-우-"
10000040-24 = "오, 오우. 예, 예요……."
10000040-25 = "흐-흥! 등장 연출, 완벽했어! 그치?! 츠바키 선배! (으쓱)"
10000040-26 = "후아암, 그으~래?"
10000040-27 = "저……. 카에데 쨩. 전부, 쳐다보고 있는데요……."
10000040-29 = "……봤죠? 괴짜들이라고."
10000040-30 = "……."
10000040-31 = "핫?! 아니, 아니지! 너, 너희들은 누구냐!"
10000040-32 = "우리는 보다 멋진 레이디가 되기 위해 수행하는 수행부!"
10000040-33 = "뭐어~ 주로 카에데 생각일 뿐이지만~?"
10000040-34 = "나는 딱히 그런 수행 안 하고 있구. 자는 거면 충분하고."
10000040-35 = "흐아암. 여기서 자도 돼?"
10000040-36 = "망량즈와 대치한 이 순간에도 변함없이 평소 태도를 고수하는 츠바키 선배, 멋져……! 가 아니라!"
10000040-37 = "아앗, 안돼. 츠바키 선배! 여기서 자면……!"
10000040-38 = "아하하……. 으응, 어쨌거나 목표가 있다는 건 좋은 거니까요?"
10000040-39 = "응! 맞아! 미모리 선배! 멋진 레이디 수행을 비롯해, 겸사겸사 거리의 치안도 지키는 거야!"
10000040-40 = "그런고로 지금이 바로 우리 수행부가 나설 차례!"
10000040-41 = "차앗! 길거리 망량즈! 각오해랏!"
10000040-42 = "그래~ 각오~해~"
10000040-43 = "네! 그, 그럼 가, 각오하세요!"
10000040-46 = "크어어억! 더, 더 강해졌잖아. 저 녀석들!"
10000040-47 = "헤-헹! 전부 소용 없다구! 우리 쪽엔 선생님이 있으니까!"
10000040-48 = "체엣! 대체 뭐냐고! 샬레라는 건!"
10000040-49 = "이즈나! 그 바보 닌자는 아직이야?!"
10000040-50 = "그게……."
10000040-52 = "이즈나류 인법! 사방팔방 연기뭉게뭉게의 술!"
10000040-55 = "가, 갑자기 폭발?!"
10000040-56 = "우왓?! 깜짝 놀라버렸다!"
10000040-57 = "우웅. 근데, 선생님은……?"
10000040-58 = "어머?! 선생님?!"
10000040-60 = "좋았어! 폭발로 어수선해진 지금이다! 전부 총공격!"
10000040-62 = "저, 이즈나, 예고한 대로 다시 여기에 찾아왔습니다!"
10000040-63 = "[s] \"쿨럭쿨럭! 이즈나……?!\""
10000040-64 = "이즈나, 돌아가서 깨달았어요!"
10000040-65 = "비록 선생님께서 제 꿈을 인정해준, 멋진! 아니 멋진 나쁜 어른이지만!"
10000040-66 = "이렇게 적으로 마주치게 된 이상……. 선생님을 쓰러트려서 설득해야만 한다고!"
10000040-67 = "그것이 이즈나가 걷는 닌자의 길! 닌자의 숙명이라는 걸요!"
10000040-68 = "[s] \"……뭔가 이상하지 않아, 그거?\""
10000040-69 = "자아, 각오하세요! 선생님!"
10000040-70 = "지금부터 선생님의 샬레를, 저 이즈나가 쓰러트리겠습니다앗!"
10000040-71 = "이야아압!!"
