[translation]
10039025-2 = "자~! 모두들 정말로 고생 많았어요~! 덕분에 무사히 두 사람을 데려왔네요!"
10039025-3 = "응. 누구도 다치지 않은 훌륭하고 깔끔한 포획 작전이었어."
10039025-4 = "세리카 쨩이나 아야네 쨩을 상대로 포획이라는 단어를 쓸 줄은 몰랐지만 말이지."
10039025-6 = "어쩐지 저희 대책위원회 멤버들은 한 명씩 돌아가며 모두 포획 이벤트를 하는 느낌이……."
10039025-7 = "[s1] \"그 논리대로라면 남은 건…….\"\n[s2] \"으음, 확실히. 듣고 보니…….\""
10039025-13 = "……?"
10039025-14 = "으, 으응……? 선생님? 무슨 뜻이시죠……?"
10039025-15 = "……아. 그냥 혼잣말이셨다고요? 그, 그렇군요……."
10039025-16 = "아무튼 그렇게 돼서~!"
10039025-17 = "두 사람~. 밖에서 그만 부끄러워하고, 이제 그만 들어오세요~!"
10039025-18 = "아, 알았다고……! 알았으니까 들어가면 되잖아!"
10039025-19 = "으, 으으……! 흐으으……!"
10039025-20 = "지, 진짜 딴소리하기만 해 봐! 가만 안 둘 테니까……!!"
10039025-21 = "그, 그럼……."
10039025-32 = "[ns3] \"……!?!?\"\n[ns4] \"……헉.\"\n[ns5] \"……와.\""
10039025-37 = "…………!"
10039025-38 = "……와……."
10039025-39 = "[ns6] \"……?\"\n[ns7] \"……마리……?\""
10039025-43 = "조, 조용히 해! 아무 말 하지 마. 아무 말 하지 말라고!!"
10039025-44 = "으흑흑……. 이런 복장을……. 이런 옷이라니, 이제 결혼은 다 한 게……."
10039025-46 = "응응! 역시나에요! 정말 기대대로의 모습이에요!"
10039025-47 = "고생해서 디자인 의뢰하고 계속 컨펌한 보람이 있었어요……. 흑흑. 너무 기쁘네요."
10039025-49 = "딸자식 키운 엄마 같은 표정 짓지 말라고!!"
10039025-50 = "배, 배꼽이…… 배가……!"
10039025-51 = "……!? 으, 으으!? 서, 선생님……!?!?"
10039025-52 = "뭐, 뭐!? 선생님!? 선생님이 왜 여기에……!?!?"
10039025-57 = "진짜잖아!!! 뭐야!! 이게 어떻게 된 거야!!!"
10039025-58 = "어쩐지 갑자기 선배들 움직임이 달라졌다 싶더라니……!"
10039025-59 = "[s8] \"정말 예뻐. 진짜야, 장난 아니야.\"\n[s9] \"굉장하잖아. 두 사람. 아니, 진짜로.\""
10039025-62 = "흐으으으으~~~!!!! 이제는, 이제는 진짜로 끝……!!"
10039025-63 = "가, 갑자기 그런 입에 발린 소리를 해도……!!"
10039025-64 = "아, 아니에요! 절대 그렇지 않아요! 두 분 정말 엄청나게 예쁘신걸요!!"
10039025-65 = "선생님뿐만 아니라 저도 보자마자 감탄했어요! 따라 해 보고 싶을 정도로……!!"
10039025-66 = "으, 으음……!? 선생님? 이 사람은……."
10039025-70 = "……시스터후드의 시스터 님? 어째서 시스터 님이 여기에……."
10039025-71 = "……뭐?"
10039025-72 = "우리한테 아이돌에 대해 배우러 왔다고……? 이건 또 무슨……."
10039025-76 = "하, 하긴 선생님이면 몰라도……. 다른 사람도 아니고, 트리니티의 시스터 님이 거짓말을 할 것 같지는 않으려나……."
10039025-80 = "[ns10] \"……? 반응 차이 무엇이지?\"\n[ns11] \"왜 내 말은 안 믿고 마리 말은…….\""
10039025-83 = "……응?"
10039025-84 = "그건 당연하잖아!? 선생님은 맨날 좋은 말 해주는 게 습관인 사람인데!!"
10039025-86 = "아하하……."
10039025-87 = "아아~. 그건 그렇지. 이건 선생이 잘못 했구만."
10039025-88 = "[s12] \"흑흑, 난 언제나 진심이었는데…….\"\n[s13] \"항상 진심이라고! 라이브도 꼭 응원할게!\""
10039025-94 = "……!! 아, 아니. 갑자기 그렇게 말해도……."
10039025-95 = "서, 선생님……."
10039025-99 = "……세, 세리카 쨩. 그……. 저기……."
10039025-100 = "갑자기 이런 말 하면 세리카 쨩, 이상하게 생각할 수도 있겠지만……."
10039025-101 = "뭐, 뭐! 그렇게까지 말하면 어쩔 수 없네! 일단은 약속이니까! 약속은 지켜야지, 그래."
10039025-102 = "절대 다른 뜻은 없으니까 말이야! 그저 약속을 지키는 것뿐이니까!! 그렇지, 아야네?"
10039025-103 = "마, 맞아요! 절대로 하고 싶다거나 보여주고 싶다거나 그런 거 아니니까요! 그러기로 정해서 어쩔 수 없이 하는 거예요!"
10039025-104 = "아시겠죠, 선생님? 그리고……. 선배님들?"
10039025-105 = "으헤, 정말이지 쉽구만. 쉬워~."
10039025-106 = "호시노 선배는 조용히 해!!"
10039025-108 = "응. 물론이지. 훌륭한 다짐이야. 나도 제대로 도울 테니까."
10039025-109 = "좋네요~. 음……. 여기서는 저도 그냥 그런 걸로 해 둘까요~☆"
10039025-110 = "후후……."
10039025-111 = "도와줘서 정말 고맙습니다, 선생님. 그리고 마리 씨!"
10039025-112 = "그러고 보니 아이돌 준비에 대해 알고 싶다고 하셨었죠? 답례라기엔 뭐 하지만……."
10039025-113 = "우선 저희가 의상을 발주하고 컨펌한 곳과, 방법에 대해서 알려 드릴게요!"
10039025-115 = "(이후 노노미에게 아이돌 의상을 제작하는 과정과 제작소 등의 정보를 상세히 전해 들었다.)"
10039025-125 = "- 의상 클리어 -"
