[translation]
102185-4 = "대충 다 정리한 것 같네요."
102185-5 = "저, 저기…… 도와주셔서 감사합니다……."
102185-6 = "흥, 감사는 나보단 이부키에게 해라."
102185-8 = "이부키 공! 고맙습니다! 저희를 도우러 와주신 건가요?"
102185-9 = "응. 언니들이 다치는 건 싫으니까, 마코토 선배에게 지켜봐달라고 부탁했었어."
102185-10 = "그치만, 닌자들의 중요한 임무인데…… 이부키가 멋대로 방해한 건 아닐까…… 걱정했어……."
102185-12 = "네? 아, 아니에요! 이부키 쨩! 더, 덕분에 모두 다, 다치지 않을 수 있었으니까요!"
102185-13 = "이부키 공 덕분에 위기를 넘길 수 있었습니다!"
102185-14 = "맞아. 순간 진짜, 인법연구부! 절체절명 위기의 순간?! 인 줄 알고 식은땀이 흘렀을 정도니까. 나이스 타이밍이었다구! 이부키!"
102185-15 = "진짜? 헤헤헤. ……응, 다행이다."
102185-16 = "그치만…… 여기서 닌자 언니들의 임무를 더 방해하면 안 된다고 생각해."
102185-17 = "그러니까 이부키는 멀리서 응원하고 있을 테니까, 파이팅이야! 언니들!"
102185-18 = "응, 이부키의 응원, 확실하게 받았으니까!"
102185-19 = "네! 힘내겠습니다! 닌닌!"
102185-20 = "파, 파이팅……."
102185-25 = "닌자로 이어진 인연……이라는 건가요."
102185-26 = "……."
102185-27 = "……그럼 이걸로 끝인가요? 뭔가 저, 하고 싶은 말이 엄청 많은 기분인데요……."
102185-28 = "마코토 선배, 이로하 선배! 이부키 부탁을 들어줘서 고마워!"
102185-29 = "맨날 이부키가 떼만 써서 미안해……."
102185-30 = "하아, 아니에요. 이부키가 좋다면……"
102185-31 = "뭐, 이런 것도 나쁘지 않나 싶기도 하네요……."
102185-32 = "좋아, 게헨나로 복귀한다, 가자. 이로하."
102185-33 = "네. 돌아가죠."
102185-35 = "다음화;자치구 방어 작전 - D.U. 시라토리구"
