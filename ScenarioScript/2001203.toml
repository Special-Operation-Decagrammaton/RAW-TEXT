[translation]
2001203-1 = "응급상황"
2001203-5 = "게헨나 광장"
2001203-7 = "(일정을 위해 어지러운 몸을 이끌며 게헨나에 도착했다.)"
2001203-8 = "(광장에 도착하자마자 기다리고 있던 세나를 발견했다.)"
2001203-9 = "……안녕하세요, 선생님. 기다리고 있었습니다."
2001203-11 = "[s] \"……?\""
2001203-13 = "[ns1] \"……세나?\"\n[ns2] \"미리 나와 있었던 거야?\""
2001203-14 = "네. 선생님의 상태를 정확하게 확인하기 위해서입니다."
2001203-15 = "네. 선생님의 상태를 정확하게 확인하기 위해서입니다."
2001203-16 = "기본적으로 저희 응급의학부는 외과 분야를 다루는 곳이기 때문에, 시체……."
2001203-17 = "……아니, 부상자에 한해서만 활동하는 곳이지만."
2001203-18 = "선생님께서 일정 도중에 쓰러지시면, 그 순간 '부상자'가 되실 테니까요."
2001203-19 = "……그런데 지금 보니 생각보다 상태가 꽤 심각하시군요."
2001203-20 = "그런 몸으로 일정을 강행하시는 건 역시 무리라고 판단됩니다만……. 일정 연기는 힘드신가요?"
2001203-24 = "……. 흠. 그렇군요. 꼭 오늘……."
2001203-25 = "알겠습니다. 다른 사람도 아닌 선생님의 일이니, 여러 고려 끝에 결정하신 일이겠지요."
2001203-26 = "그럼 그 대신, 오늘 하루는 제가 곁에서 동행하도록 하겠습니다."
2001203-27 = "……네?"
2001203-28 = "뭔가 비서 같은 것……이냐고요?"
2001203-29 = "……다릅니다. 어디까지나 부상자 발생에 대해 대비를 하는 것일 뿐."
2001203-30 = "그렇지만 그렇게 이해하시는 게 편하시면, 그렇게 이해해 주셔도 좋습니다."
2001203-31 = "오늘 하루는 메디컬 케어 이외에도, 선생님께 부하가 갈 수 있는 모든 일에 대해 대응할 예정이니까요."
2001203-32 = "……네?"
2001203-33 = "그렇게 말해주니 기쁘다……라고요?"
2001203-34 = "……."
2001203-35 = "[s3] \"……세나?\"\n[s4] \"어……. 혹시 제가 무슨 실수라도……?\""
2001203-36 = "……후. 선생님."
2001203-37 = "……후. 선생님."
2001203-38 = "선생님께서는 지금도 충분히 부상자로 취급되어도 이상하지 않으신 상태입니다."
2001203-39 = "오히려 정책 대로였다면 선생님의 의사와 관계없이 지금 바로 부실로 강제 이송했을 것입니다."
2001203-40 = "다른 분도 아닌 선생님의 일정이며, 선생님의 판단이시기에 극히 예외적인 상황임을 감안해 주셨으면 합니다."
2001203-41 = "[s5] \"……네. 죄송합니다.\"\n[s6] \"명심하겠습니다…….\""
2001203-42 = "……."
2001203-43 = "……."
2001203-44 = "그럼, 어디부터 들르면 되는 것입니까?"
2001203-45 = "일정에 대해 알려주시면, 길 안내도 할 겸 앞장서도록 하겠습니다."
2001203-47 = "(일정에 대해 알려주자 세나는 곧바로 앞장서서 나아가기 시작했다.)"
2001203-48 = "(본인이 말했던 대로, 단순히 몸 상태뿐만이 아니라 정리와 중재, 자료 조사까지 옆에서 모두 도와주었다.)"
2001203-49 = "(하루종일 걸릴 거라고 생각했던 일들이 불과 반나절 만에 모두 끝나버렸다.)"
2001203-51 = "……수고하셨습니다. 선생님. 다행히 큰 문제는 발생하지 않았군요."
2001203-52 = "언제 쓰러지시나 했는데……. 보기보다 훨씬 더 강인한 집중력을 가지고 계십니다."
2001203-53 = "일정 면에서도, 선생님의 건강 면에서도."
2001203-54 = "[s7] \"고마워. 세나 덕분이야.\"\n[s8] \"혼자서는 이렇게 할 수 없었을 거야.\""
2001203-55 = "……아닙니다. 전 그저 옆에서 거들었을 뿐인 걸요."
2001203-56 = "……아닙니다. 전 그저 옆에서 거들었을 뿐인 걸요."
2001203-57 = "게다가 이곳 일정이 끝난 것일 뿐, 아직 선생님의 상태가 회복되신 것은 아니지 않습니까."
2001203-58 = "어서 돌아가서 휴식을 취하셔야……."
2001203-61 = "……응?"
2001203-62 = "선생님? ……왜 그러시죠?"
2001203-63 = "[s9] \"아아, 미안. 조금 어지러워서.\"\n[s10] \"일이 다 끝나서 긴장이 풀렸나 봐.\""
2001203-68 = "……하아."
2001203-69 = "역시 그러시군요."
2001203-70 = "말씀드렸듯이 다 끝난 게 아닙니다, 선생님. 아직 선생님께선 밖에 나와 계신 상황이니까요."
2001203-71 = "샬레로 돌아가시는 것까지 동행하겠습니다. 거기까지가 오늘의 '일정'."
2001203-72 = "만약 도중에 쓰러지시면……"
2001203-77 = "……그 길로 응급의학부로 모셔갈 테니 그렇게 알아주시기 바랍니다."
2001203-78 = "무슨 의미인지 아시겠습니까?"
2001203-79 = "[s11] \"……네.\"\n[s12] \"……시체!\""
2001203-84 = "……."
2001203-89 = "그럼 다시 앞장서겠습니다."
2001203-94 = "(이후 집중해서 의식을 부여잡은 채, 세나를 따라 샬레까지 무사히 도착했다.)"
2001203-95 = "(도착하자마자 기절하듯 자리에 누웠는데, 정신을 차리고 보니 담요와 물수건이 덮여 있었다.)"
