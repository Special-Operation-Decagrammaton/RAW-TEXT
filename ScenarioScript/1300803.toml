[translation]
1300803-1 = "하드한 밤샘 알바"
1300803-2 = "(약속한 시간인데도 세리카가 나타나지 않는다.)"
1300803-5 = "하아…… 하아."
1300803-6 = "[s] \"늦었네, 세리카.\""
1300803-7 = "이건…… 어쩔 수…… 라멘집 일이 늦게 끝나서……."
1300803-8 = "[s] \"알바는 원래 약속 시간보다 조금 일찍 나오는 거 아니었어?\""
1300803-9 = "……아, 무, 물론 그렇긴 하지만…… #n시, 시끄러! 조금 밖에 안늦었으니까……."
1300803-10 = "……."
1300803-11 = "……느, 늦었으니까 빨리 와, 선생님!"
1300803-14 = "(세리카와 함께 빌딩 야간 경비 알바를 하였다.)"
1300803-15 = "(하루종일 빌딩 입구를 지키는 지루한 일이었다.)"
1300803-17 = "하아…… 지쳤어."
1300803-18 = "금요일에는 이런 하드한 밤샘 알바가 좋긴 한데…… 휴일이 없어지는 단점이 있어서 좀 아쉬워."
1300803-19 = "그런데 괜찮아, 선생님? 나야 뭐 그렇다고 해도 선생님은 휴일에 할 일이 있는 거 아냐?"
1300803-20 = "아니면 역시 한가한 거구나?"
1300803-21 = "[s1] \"밤샘 알바인줄 몰랐어.\"\n[s2] \"휴일엔 집 밖에 안나가니까 괜찮아.\""
1300803-22 = "……어라."
1300803-23 = "내가 말 안했던가……."
1300803-24 = "미, 미안……."
1300803-25 = "아하하하. 휴일에 집에 있는 타입? 나는 이리저리 다니는 게 편하지만."
1300803-26 = "하아…… 빨리 집에가서 씻고 싶어."
1300803-27 = "선생님, 오늘도 고생했어."
1300803-28 = "그럼 다음에 봐. 안녕~"
1300803-31 = "(받은 돈은 대책위원회에 기부하는 걸로 했다.)"
