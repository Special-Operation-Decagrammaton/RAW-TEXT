[translation]
1011805-1 = "의외의 장소"
1011805-3 = "(평소처럼 지하철을 타러 가던 길.)"
1011805-6 = "[ns] \"엥?\""
1011805-8 = "어! 뭐야? 선생님이다!"
1011805-9 = "파햐햐~ 여기서 만나다니!"
1011805-10 = "[ns1] \"안녕, 노조미.\"\n[ns2] \"여기엔 무슨 일이야?\""
1011805-13 = "당연히 지하철 타러 왔지."
1011805-14 = "선생님도 이거 타는 거야?"
1011805-15 = "잘됐다, 같이 타고 가자."
1011805-17 = "럭키! 착석~!"
1011805-18 = "선생님~ 여기 앉아!"
1011805-26 = "[ns3] \"지하철에서 만나서 놀랐어.\"\n[ns4] \"원래 자주 타는 편이야?\""
1011805-29 = "파햐햐, 열차 노선이 안 깔린 곳도 있다 보니 종종 이용하는 편이지."
1011805-30 = "열차랑 비슷하기도 하고. 꽤 좋아한다고? 지하철."
1011805-31 = "[s] \"아무래도 비슷한 느낌이지.\""
1011805-32 = "사람도 많이 태울 수 있고, 시간표가 있을 만큼 정시성도 좋고."
1011805-33 = "개방감이 있어서 멀미도 안 생긴다고."
1011805-34 = "파햐햐, 장점 중 대부분은 열차랑 비슷하네!"
1011805-35 = "뭐, 열차와는 다르게 좀 더 작고 번잡하고 금방금방 멈추긴 하지만."
1011805-36 = "아무래도 철도가 더 낫지! 안 그래?"
1011805-37 = "[s5] \"하지만 지금처럼 노선이 없는 곳도 있잖아.\"\n[s6] \"그럴 때는 지하철이나 버스에 꽤 신세 지고 있지.\""
1011805-40 = "흐응~ 뭐 그럴 수도 있지."
1011805-41 = "어딜 가느냐에 따라 열차보다 더 유용할 수도 있긴 해."
1011805-42 = "기회가 되면 나중에 지하철도 한 번 운행해 보고 싶네."
1011805-43 = "[s] \"배 같은 건 어때?\""
1011805-44 = "배? 배는 안 타봐서 모르겠지만 멀미가 엄청 심하다는 말은 들었는데."
1011805-45 = "아무래도 내 취향은 아닐 듯!"
1011805-46 = "배도 클수록 멀미를 안 한다고? 헤에, 선생님은 이런저런 거 많이 타봤구나?"
1011805-47 = "파햐햐! 그래, 그래. 언젠가는 나도 탈 일이 있을지도 모르겠네."
1011805-48 = "그치만 배보다는 해상 열차 쪽이 더 멋지지 않아?"
1011805-49 = "[s7] \"바다 위를 달리는 건가!\"\n[s8] \"가능하다면 멋지겠는데.\""
1011805-52 = "이런저런 철도 노선들, 열심히 깔다 보면 언젠가는 되지 않겠어? 파햐햐!"
1011805-54 = "(그렇게 노조미와 이동 수단에 대한 이야기를 한참 동안 하다가……)"
1011805-58 = "(내릴 곳을 지나치고 말았다……)"
