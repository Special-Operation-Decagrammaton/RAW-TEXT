[translation]
1010603-1 = "또 다른 나"
1010603-2 = "(사쿠라코의 연락을 받고 정해준 장소로 나갔다.)"
1010603-5 = "……아. 오셨군요, 선생님."
1010603-9 = "[ns1] \"……사쿠라코?\"\n[ns2] \"이번엔 평상시의 복장이구나…….\""
1010603-12 = "네. 그렇습니다. ……그리고 선생님을 기다리고 있었답니다."
1010603-13 = "오늘 있었던 저의 어떤 경험……에 대해 공유해 드리고, 또한 상담받기 위해서요."
1010603-14 = "무슨 경험이냐고요? 음……. 그게……."
1010603-18 = "……선생님."
1010603-19 = "평소의 저는, 항상 주변 모든 사람들을 의식하며, 행동거지 하나하나에 신경을 쓰고 있습니다."
1010603-20 = "하지만 그것들은 딱히 저의 천성이라기보다……. 모두 필요에 의한 행동이었죠."
1010603-21 = "전부 저의 위치와 지위, 속한 조직과 다른 사람들에게 누가 되지 않기 위한 것들."
1010603-22 = "사소한 일이나 개인적인 일로 나갈 때조차 평상시라면 시스터 복장을 착용해야 하고, 그러면 그에 맞는 행동을 보여야 합니다."
1010603-23 = "사람의 직위는, 옷 위에 얹는 것이니까요."
1010603-24 = "그런데 오늘 연습을 마치고, 돌아오는 길에……. 그러니까 아이돌 복장인 상태였지요."
1010603-25 = "그 길에 저는, 신입생 자매님들과 마주치고 말았습니다."
1010603-26 = "……그리고 평소처럼 인사를 건넸습니다."
1010603-31 = "[ns3] \"……???? 음? 그래서?\"\n[ns4] \"거기에 무슨 문제가 있는 거야……?\""
1010603-34 = "그……. 그게……."
1010603-35 = "그분들은 아직 행사에 대한 소식을 못 들으신 건지, 아직 보신 적이 없으셨던 건지,"
1010603-36 = "아이돌 복장의 저를 전혀 저라고 알아보지 못하셔서……."
1010603-37 = "그……."
1010603-38 = "시스터후드랑 관계없는, 새로 사귄 친우라고 오해하신 채 이야기가 진행돼 버렸습니다."
1010603-39 = "해명하려고 이름도 말씀드렸지만, 분위기 속에 하던 말이 잘려서 '사쿠라코'가 아니라 '사쿠라'로 들으셨고……."
1010603-40 = "그 상태로 노래방에서 3시간 정도 함께 노래를……."
1010603-41 = "[s5] \"……아?\"\n[s6] \"어, 어……. 음…….\""
1010603-44 = "도, 도중에 몇 번이나 사실을 말씀드리려 했었습니다! 번번히 실패하긴 했지만요!! 그 분위기가……. 타이밍이……!!"
1010603-48 = "덧붙여서 결정적으로, 아마도 당시의 복장이 그래서 그랬던 건지……."
1010603-49 = "그 당시의 저는 뭔가 제가 아닌 듯한 언행이기도 했습니다. 아마 오해에도 그게 주요했겠죠."
1010603-50 = "그렇게 헤어지는 순간까지도 \"사쿠라 쨩\"이라고 부르시며 배웅을 받았습니다만……."
1010603-51 = "어떻게 하면 좋을까요……? 이미 연락처 교환까지 따로 해버렸습니다……."
1010603-52 = "일반적으로 저희는 업무상 관계가 없는 연락처는 공유가 이루어지지 않기에, 연락처를 받고도 저라는 걸 모르시는 듯합니다."
1010603-53 = "다음 약속에 대한 안내까지 받아버렸는데……. 이렇게……."
1010603-59 = "\"사쿠라 쨩! 일요일 점심 1시야! 잊으면 안 돼!!\""
1010603-61 = "\"다음에는 다른 애들도 온다고 했거든! 사쿠라 쨩의 노래가 필수라고!!\""
1010603-63 = "\"믿고 있다고, 사쿠라 쨩-!!\""
1010603-68 = "[ns7] \"……인기 많네, 사쿠라 쨩.\"\n[ns8] \"이것이 다른 세계선의 우타즈미 씨…….\""
1010603-71 = "크, 크윽……."
1010603-72 = "아무튼 뭔가 의도와는 달리 자매님들을 속이게 된 이 상황을 해결하고 싶습니다만,"
1010603-73 = "그렇다고 갑자기 정체를 밝히면 자매님들에게 상심이나 상처가 돼 버리진 않을지 걱정이 됩니다."
1010603-74 = "애초에 복장이 바뀌었다고 해서, 그런 실수를 해 버린 것이 저의 실책이겠으나……."
1010603-75 = "……네?"
1010603-76 = "……? 선생님……? 그게 무슨……."
1010603-77 = "별로 상관없다……고요……?"
1010603-78 = "그냥 사실대로 이야기하면 된다고요……? 그, 그렇지만, 그랬다간 기존의 제가……!"
1010603-79 = "[s9] \"기존의 사쿠라코가 어때서?\"\n[s10] \"지금껏 해 온 노력이라면 문제없을 거야.\""
1010603-82 = "그, 그런……. 그렇게 편한 말로 말씀하셔도……. 이건 그런 문제가……."
1010603-83 = "다른 자매님들이 저를 어떻게 생각하시는지는 이미 몇 번이나……."
1010603-87 = "……음……. 선생님……."
1010603-88 = "정말……."
1010603-89 = "정말로……. 괜찮을까요? 그렇게 말씀드려도……?"
1010603-90 = "솔직한 저의 마음으로는……. 네. 내심……. 저 또한 숨기고 싶지는……. 않습니다. 사실대로 말씀드리고 싶지요."
1010603-91 = "……네, 그렇군요."
1010603-92 = "생각해 보면……. 확실히 말씀대로 평소와는 조금 다른 상황이기는 한 것 같습니다."
1010603-93 = "평상시의 저는, 항상 화제의 일부가 말씀드릴 수 없는 비밀이나, 내부 사정과 엮여 있었지만,"
1010603-94 = "이번 일은 온전히 저라는 사람 개인에 대한 것."
1010603-95 = "솔직하게 사실대로 말씀드린다 해도, 성당이나 시스터후드에 누가 될 일은 없겠지요."
1010603-96 = "[s11] \"오히려 그게 정공법이라 생각해.\"\n[s12] \"솔직해도 되는 부분이야, 여기는.\""
1010603-99 = "그, 그럼……. 정말로, 선생님 말씀대로……."
1010603-100 = "후우, 후우……."
1010603-106 = "답장, 보냈습니다. 약속한 장소로 나가서, 당시의 상황에 대해, 사과와 함께 솔직하게 말씀드리겠습니다."
1010603-107 = "……후후."
1010603-108 = "뭔가 떨리네요. 이런 걸로 떨어본 게 얼마 만인지……."
1010603-109 = "감사합니다, 선생님. 어쩌면 저에게 필요한 건 지혜가 아니라 용기였을 지도 모르겠네요."
1010603-110 = "선생님께서 밀어주신 덕분에, 이런 마음도 가질 수 있게 된 것 같습니다."
1010603-111 = "일이 어떻게 되든……. 감사드립니다."
1010603-112 = "그럼 나머지는……."
1010603-113 = "주말 저녁에, 결과가 다 나오고 나서 말씀드리겠습니다."
1010603-115 = "(이후 떨려 하는 사쿠라코를 다독여준 후, 샬레로 돌아왔다.)"
