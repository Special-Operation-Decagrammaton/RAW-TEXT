[translation]
1010706-1 = "서기의 탐구생활"
1010706-5 = "안녕하세요~!"
1010706-6 = "[s] \"안녕, 치아키.\""
1010706-7 = "선생님, 오늘 컨디션은 어떠신가요?"
1010706-8 = "어제 잠은 잘 주무셨나요? 어디 아픈 데는 없으시죠?"
1010706-9 = "[s1] \"으응, 괜찮은데…….\"\n[s2] \"갑자기 건강 얘기?\""
1010706-12 = "헤헤, 실은~"
1010706-13 = "<주간 만마전> 특집 기사 때문인데요오~"
1010706-14 = "사실은, 선생님의 도움이 꼭 필요한 거라!"
1010706-15 = "[s] \"도움? 설마 또 디저트 카페?\""
1010706-19 = "[ns] \"또 디저트로 배 채우는 건 자신 없을지도.\""
1010706-20 = "아하핫! 아니에요!"
1010706-21 = "실은, 다음 <주간 만마전> 특집 기사의 헤드라인을 생각해 봤는데 말이죠~!"
1010706-22 = "바로, <현장 르포! 샬레 잠입 작전!>이거든요!"
1010706-23 = "[s] \"샬레…… 잠입…… 작전?\""
1010706-24 = "헤헤, 그렇습니다!"
1010706-25 = "항간의 화제가 되고 있는 샬레의 [USERNAME] 선생님!"
1010706-26 = "선생님이 보내는 하루를, 샬레에서 밀착 취재한다!"
1010706-27 = "어떤가요? 제목만 생각해도 읽고 싶어지지 않나요~?"
1010706-28 = "[s] \"으으음…….\""
1010706-29 = "아, 물론 오늘은 당번 활동으로 온 거기도 하고, 기자 윤리라는 게 있잖아요?"
1010706-30 = "선생님의 동의 없이는 하지 않습니다!"
1010706-31 = "그때는 다른 특종을 찾아보면 되는 일이니까, 부담 갖지 말고 고려해 주세요!"
1010706-32 = "[s] \"아니, 취재하는 건 괜찮은데 말야.\""
1010706-33 = "정말요? 감사합니다!"
1010706-34 = "그럼, 다른 문제라도 있으신가요?"
1010706-35 = "[s] \"문제라기보다는…….\""
1010706-37 = "[ns3] \"나를 취재해 봤자, 별로 재미없을 텐데?\"\n[ns4] \"그냥 매일 똑같은 업무를 할 뿐이니까…….\""
1010706-41 = "그런 거라면 걱정마세요~! 제가 누군데요!"
1010706-42 = "대 게헨나 학원 학생회, 만마전의 서기이자 <주간 만마전>의 기자 겸 편집자 겸 발행인, 모토미야 치아키!"
1010706-43 = "어떤 곳이든 기삿거리가 될 만한 건 있는 법이니까요!"
1010706-44 = "[s] \"으음…… 그럼 내가 뭐라도 하는 게 좋을까?\""
1010706-45 = "아뇨, 아뇨! 선생님은 그냥 평소와 같이 생활해 주시면 돼요!"
1010706-46 = "기삿거리를 찾는 건 제 일이니까!"
1010706-47 = "그리고, 오히려 자연스러운 모습에서 더 흥미로운 장면들이 나오는 법이랍니다!"
1010706-48 = "[s] \"뭐어, 그렇다면야…….\""
1010706-49 = "넵! 그럼 취재, 허락해 주시는 거죠?"
1010706-50 = "그럼, 샬레 곳곳을 사진 찍는 것부터 시작하고 싶은데요~?"
1010706-51 = "[s] \"응, 얼마든지.\""
1010706-52 = "감사합니다~!"
1010706-54 = "(취재에 나선 치아키를 내버려두고, 급한 업무를 시작했다.)"
1010706-63 = "오호, 샬레의 의자는 이런 브랜드였군요~ 제 눈을 피할 순 없답니다!"
1010706-64 = "물론 이 정도로 기삿거리는 되지 않겠지만요……."
1010706-65 = "핫! 그렇다면 혹시 소파 밑에 재밌는 물건이 있을지도?"
1010706-71 = "으음…… 먼지뿐이네요……."
1010706-72 = "앗, 이쪽에 있는 건 게임패드?! 선생님 게임 취향을 알 수 있을지도!"
1010706-73 = "네? 전에 당번으로 왔던 학생이 놓고 간 거라고요? 그렇군요……."
1010706-74 = "으음, 마땅히 재미있는 기삿거리가……."
1010706-75 = "[s] \"그러게, 재미없을 거라고 했잖아…….\""
1010706-76 = "하, 하지만 포기하지 않습니다!"
1010706-78 = "(얼마 후…….)"
1010706-80 = "업무 중에 죄송한데요오……."
1010706-81 = "선생님, 원래 그렇게 하루 종일 업무만 하시나요……?"
1010706-82 = "[s] \"오늘은 유독 마감이 급한 업무가 많아서.\""
1010706-83 = "으으…… 이대로면 특집 기사가 평소만도 못한 퀄리티로……."
1010706-84 = "여, 역시 다른 주제로 바꿔야 할지도……?"
1010706-85 = "기자의 촉을 한껏 곤두세워서!"
1010706-86 = "다시 한번 특종을 탐색하겠습니다……!"
1010706-89 = "(몇 시간 뒤…….)"
1010706-93 = "[ns] \"으으음…….\""
1010706-100 = "[wa:800]― [log=치아키]아하핫! [wa:1070]셔터 [wa:360]찬스, [wa:600]잡았습니다! [/log]"
1010706-103 = "[wa:460]― [log=치아키]선생님의 졸던 표정! [wa:1860]다음 호 표지 [wa:820]감이라구요~![/log]"
1010706-106 = "[wa:550]― [log=치아키]이걸로 [wa:520]<주간 만마전> [wa:880]특집호도 [wa:710]준비 만전![/log]"
1010706-109 = "[wa:400]― [log=치아키]역시 이 치아키, [wa:1640]이번에도 특종을 [wa:590]잡아냈네요~![/log]"
1010706-112 = "[ns] \"책상 밑까지 잠입하다니 집요해!\""
1010706-114 = "[wa:240]― [log=치아키]후후! [wa:980]서기의 행동력을 [wa:1180]얕보면 안 되거든요! [/log]"
1010706-117 = "[wa:400]― [log=치아키]그렇지![wa:760] 이 기세로 [wa:870]선생님의 [wa:770]비밀까지 파헤쳐 볼까요……?[/log]"
1010706-119 = "[wa:800]― [log=치아키]양말에 난 구멍의 비밀, [wa:1990]같은……![/log]"
1010706-122 = "[wa:270]― [log=치아키]엣?![wa:560] 짓궂은 아이는 [wa:650]'책상 아래에 가두는 형'에 처한다고요……?![/log]"
1010706-125 = "[wa:900]― [log=치아키]죄,[wa:450] 죄송합니다~![wa:1670] 나가게 해주세요~![/log]"
1010706-128 = "으에엑…… 잠입 취재도 할 게 못 되네요."
1010706-129 = "하마터면 책상 밑에 갇힐 뻔했어요……."
1010706-130 = "[s] \"내 조는 얼굴, 진짜 신문에 실을 생각이야?\""
1010706-131 = "후후, 물론, 그럴 생각 만만이었습니다만~"
1010706-132 = "……."
1010706-133 = "다른 걸로 쓰려고요~!"
1010706-134 = "제가 <주간 만마전>을 만드는 게 즐거운 만큼, 읽는 분들도 즐거웠으면 하거든요! 선생님도 거기 포함이구요!"
1010706-135 = "그러니까 표지 사진은, 다른 걸로 할게요!"
1010706-136 = "후후, 대신 같이 찾아주시면 안 될까요?"
1010706-137 = "선생님이랑 같이라면 더 괜찮은 사진을 찍을 수 있을 것 같은데요~?"
1010706-138 = "[s] \"좋아, 잠도 깰 겸, 같이 기삿거리를 찾아보자.\""
1010706-139 = "얏호~ 감사합니다!"
1010706-141 = "(이후, 치아키와 함께 샬레 이곳저곳을 다니며 기삿거리를 찾아보았다.)"
