[translation]
101100-1 = "제10화;충돌 2"
101100-4 = "린 선배의 문책결의안…… 우와…… 이거 일이 커지는데……."
101100-5 = "그, 그런…… 린 선배는 동시에 총학생회장님의 대행이기도 해요……!! 린 선배의 행정 권한이 정지되면……."
101100-6 = "총학생회는 마비되겠죠. 아오이. 총학생회장이 실종된 직후처럼요."
101100-7 = "……당신의 폭주를 막기 위해서야!!"
101100-8 = "최소한 샬레의 선생님이나 방위실장을 찾아낼 때까지만이라도 이렇게 하지 않으면 안 돼."
101100-9 = "……."
101100-10 = "……자세한 건 내일 아침에 다시 얘기해. 모든 실장들을 소환할 테니까."
101100-11 = "가서 쉬어. 린 선배. 내일은 힘든 하루가 될 테니까."
101100-12 = "……."
101100-13 = "다른 행정관들도 들었으면 하던 걸 멈추고 움직여!"
101100-14 = "으, 네, 넵!"
101100-15 = "가, 가자……."
101100-21 = "모모카, 아유무. 너희도 여기서 떠나도록 해. 이건 행정 명령이야!"
101100-22 = "……그, 그런……."
101100-23 = "으…… 저, 저기……."
101100-24 = "……괜찮습니다. 그렇게 하세요. 두 사람은 저 때문에 고생이 많았으니까……."
101100-25 = "으, 으…… 그, 그럼…… 내일 일찍 나올 테니까…… 선배……."
101100-26 = "하아…… 이것 참……. 불편한 공기네……."
101100-32 = "내일…… 얘기하시죠. 아오이."
101100-33 = "……."
101100-51 = "……?! 무, 무슨……!!"
101100-57 = "이거 생각보다 일이 쉽게 풀리는군. 텅 비어 있는 총학생회라니."
101100-58 = "최악의 경우에는 그 '여우들'과 충돌할 것까지 상정했었는데. 뭐, 그렇다고 해도 결과는 달라지지 않았겠지만."
101100-59 = "여기 있는 거라곤 행정관 한 명뿐, 이라는 건가."
101100-60 = "……!! 당신들은……!! 카이저 코퍼레이션……?!"
101100-61 = "……하지만 그 한 명이 수석행정관이라니."
101100-62 = "그리고 허튼 짓 해봐야 소용없다. 모든 통신망과 경보장치는 전부 처리했으니까."
101100-63 = "……!!!"
101100-64 = "지금부터 총학생회의 모든 권한은 우리 카이저 코퍼레이션이 인계한다."
101100-65 = "생텀 타워 쪽은 어떤가?"
101100-66 = "(치익) 컨트롤 확보했습니다!"
101100-67 = "좋다. 프레지던트를 연결하도록."
101100-71 = "(치익) 아아- 좋아. 이쪽에서 연결된 걸 확인했네. 어…… 그런데 시간이 좀 걸릴 거 같은데."
101100-72 = "우선 D.U.에 계엄령을 선언하지."
101100-73 = "지금부터 D.U.를 오가는 모든 통신과 교통, 물류, 전산은 셧다운된다. 동시에 모든 행정 기관들은 정지된다."
101100-74 = "외부에서는 이 D.U. 내부에서 무슨 일이 벌어지는지 알 수 없을 거다. 그 사이에……."
101100-75 = "카이저 코퍼레이션…… 무슨 짓을 꾸미고 있는 거죠?"
101100-76 = "생텀 타워를 장악하려고 하네."
101100-77 = "……!!"
101100-78 = "왜냐고? 초고대 병기가 손에 들어왔거든. 그래서 생텀 타워의 힘이 필요해졌다네. 뭐, 자세한 설명은 생략하지."
101100-79 = "이제 키보토스는 카이저 코퍼레이션의 지배하에 놓이는 걸세. 게마트리아도, 총학생회도 아닌 바로 우리가 학원 도시의 주인이 되는 거야."
101100-80 = "……!!"
101100-82 = "다행이지 않나? 학원 도시보다는 기업 도시가 더 어감이 좋으니까. 크훗훗훗."
101100-86 = "[ns] \"카이저 코퍼레이션이…….\""
101100-87 = "총학생회는 해산되어 소식이 끊겼고, 위원장들은 뿔뿔이 흩어졌습니다……. 지금 생텀 타워 내부의 사정은 아무도 알지 못하는 상태입니다……."
101100-88 = "으, 으으…… 이런 상황에 출동도 하지 못한다니…… 너무 답답해요……."
101100-89 = "하아…… 이런 귀찮은 일에 휘말리는 건 딱 질색인데 말이지……."
101100-90 = "응? 이봐, 여기 문이 열려 있는데?"
101100-91 = "뭐지? 수색해보자!"
101100-92 = "히익…… PMC 녀석들이 이쪽으로 오고 있어. 이동해야 해."
101100-93 = "어, 어서 가시죠! 모두들!"
101100-94 = "……크윽."
101100-95 = "[ns] \"칸나, 상처가 심해 보여…….\""
101100-98 = "……저는 여기까지입니다. 선생님."
101100-99 = "[ns] \"뭐……?!\""
101100-100 = "네?! 무, 무슨 말을……!!"
101100-101 = "무슨 소리야?!"
101100-103 = "후후…… 여기는 변한 게 없군요……. 신입생 수련회 때 봤던 모습 그대로네요……."
101100-104 = "그때는 저도 정의로운 경찰을 꿈꿨었는데……. 지금 변해 버린 건 저뿐인가 봅니다."
101100-105 = "생활안전국의 귀관들에게는…… 신세를 졌다."
101100-106 = "칸나 국장님……."
101100-107 = "뭐, 뭐야. 갑자기 이런 분위기는 조금 무서운데……."
101100-108 = "선생님. 이 건물을 빠져나가서 조금만 더 가면 D.U. 외부로 향하는 고속 철도역이 나옵니다. [ruby=.]코[/ruby][ruby=.]우[/ruby][ruby=.]사[/ruby][ruby=.]기[/ruby] [ruby=.]공[/ruby][ruby=.]원[/ruby] 근방이라 선생님도 아는 지형일 겁니다. 그리고……."
101100-109 = "……아, 깜빡하고 있었습니다. 선생님의 소지품입니다."
101100-110 = "태블릿 PC와 휴대폰도 챙겨 가십시오."
101100-115 = "[ns] \"싯딤의 상자가…… 이걸 어떻게?!\""
101100-116 = "……발키리 내부의 극비 정보를 수집해서…… 선생님이 갇혀 있는 위치와…… 이 물건의 위치를 알 수 있었습니다……."
101100-117 = "카이저 그룹은 저를 자신들과 결탁한 부패한 경찰로 알고 있어서…… 의심을 피할 수 있었습니다. 자…… 어서 받으시지요……."
101100-118 = "[ns] 싯딤의 상자를 받는다."
101100-121 = "지금…… 카이저 코퍼레이션은 총학생회를 습격해 생텀 타워의 행정 제어권을 탈취했습니다……."
101100-122 = "이걸 그대로 두면 이 도시는 걷잡을 수 없는 혼란 속으로 치달을 겁니다……."
101100-123 = "이것이 바로 현실과 타협한 부패한 경찰인 제가 할 수 있는 최선의 저항이었습니다……. 선생님께서 깨우쳐주지 않았더라면…… 아직도 용기를 내지 못했을 겁니다."
101100-124 = "선생님. 모든 발키리들이 저같이 부패한 건 아닙니다."
101100-125 = "아직도 옳다고 믿는 것을 위해 싸우는 사람이……. 훨씬…… 더…… 많을 겁니다. 여기 이 두 사람처럼……."
101100-126 = "……."
101100-127 = "……."
101100-132 = "[ns1] \"아니, 칸나는 훌륭한 경찰이야.\"\n[ns2] \"결국 포기하지 않고 신념에 따라 행동한 거잖아?\""
101100-135 = "……."
101100-136 = "[s3] \"그리고 이게 있다면 괜찮아.\"\n[s4] \"이제 어떻게든 될 거야.\""
101100-139 = "……네?"
101100-140 = "선생님……?"
101100-141 = "응? 그 태블릿이 중요한 거야?"
101100-146 = "[ns5] \"……우리는 원한다. 일곱 개의 통곡을.\"\n[ns6] \"……우리는 기억한다. 예리코의 화두話頭를.\""
101100-154 = "선생님!!! 으아아아아앙-!!"
101100-155 = "무사하셨군요!! 걱정했다구요, 엄청 놀랬다구요! 갑자기 전원이 꺼져버려서……!!"
101100-156 = "게다가 지금 큰일이……! 엄청 큰일이……!!"
101100-157 = "[s7] \"응. 알고 있어.\"\n[s8] \"무사해서 다행이야. 아로나.\""
101100-160 = "후에엥- 네에…… 저는 괜찮아요……. 선생님……."
101100-163 = "[ns] \"자, 그럼 다시 지휘를 시작해볼까.\""
101100-165 = "다음화;탈출 1"
