[translation]
90001250-1 = "제25화;예측할 수 없었던 것"
90001250-2 = "왜 저 둘이 여기에 있는 건가요–?!?!"
90001250-3 = "우, 우선 말이지? 이게 확실한지부터 확인해 보자고!"
90001250-4 = "하, 한쪽은 모르겠지만…… 다른 한쪽은, 확실해요……!"
90001250-10 = "실화야……?"
90001250-11 = "<이름없는 신들의 왕녀>, AL-1S……. 저 사람들에게는 '아리스' 라고 불리고 있는 것 같지만요."
90001250-12 = "저, 저기…… <이름없는 신들의 왕녀>라는 이름은, 조금, 위험…… 하게 들리니까요……?"
90001250-13 = "아, 그렇네요. 미안해요, 아인."
90001250-15 = "그렇지만, 아무리 봐도……? 맞지?"
90001250-16 = "그, 그그그, 그렇지만 어째서……. 그동안, 알아차리지 못 했을…… 까요?"
90001250-17 = "사, 사이바 모모이도, 사이바 미도리도, 하나오카 유즈도…… 전부, 전부 파악하고 있었는데……?"
90001250-19 = "추측이지만, 아마도 이것 때문이 아닐까 하네요."
90001250-26 = "……이거, 그거 맞겠지? 정황상 하는 이야기이긴 한데."
90001250-27 = "……아마도요?"
90001250-28 = "<이름없는 신들의 열쇠>……."
90001250-29 = "무슨 일이 있었는지, 생긴 건 저렇지만 말이야."
90001250-30 = "아마도 최근에 재조립된 것 같네요. 그런데…… 진짜, 누구 센스일까요……."
90001250-32 = "이, 이이이이이, 이건 조금……! 용서가 안 되는 수준이에요……!"
90001250-33 = "저걸 만든 게 누구인지는 모르지만, 저 몸의 구성 성분이 된 금속과 다른 재료들에게 사과해 주세요!!!"
90001250-34 = "진정해, 아인. 다 이해하겠는데, 진정해……."
90001250-36 = "저 둘이 저기에 있었던 거라면……."
90001250-44 = "……그 상황을 돌파한 것도, 이해는 할 수 있겠네요."
90001250-45 = "그렇지만, 어떻게 지금까지 우리에게 관측되지 않았던 거지……?"
90001250-46 = "저 열쇠 때문이, 아닐…… 까요?"
90001250-47 = "저, 저 왕녀는 자, 자신의 존재 의의를…… 스스로 버린 것으로…… 아는데요."
90001250-61 = "분명히 그랬었죠. 그리고 그 말은, 저 왕녀가 '금지된 힘'을 온전히 활용할 방법을 모른다는 뜻이기도 할 거고요."
90001250-62 = "그렇지만 그 방법을 기억하고 있는 열쇠가 있다면, 이야기가 달라질 거야."
90001250-63 = "그리고 그렇기 때문에 저 열쇠가, 금지된 힘의 활용 방법을 기억하고 있다는 것이 확실하다는 결론을 내릴 수 있겠지."
90001250-65 = "그, 그렇네요……. 힘의 활용 방법을 기억하지 못하고 있었다면…… 우리들의 탐지로부터, 벗어날 수도 없었을 테니까요……."
90001250-66 = "……작전, 다시 짜야 할까요?"
90001250-67 = "그건…… 필수겠지?"
90001250-68 = "다, 당장 무엇부터 해야 할까요……?"
90001250-74 = "아인? 소프? 오르? 티페레트에게서 도움 요청이 왔어요. 의견을 받겠다고 하네요."
90001250-75 = "네, 네에?! 티페 쨩이요……?"
90001250-76 = "조금, 머리 아프네. 이거. 기본적으로는 현장의 판단을 중시하고 싶기는 한데……."
90001250-77 = "아뇨. 이건 그런 것이 아닐 거예요. 방법 정도야 티페레트도 이미 생각해 뒀겠죠."
90001250-78 = "그건 무슨 뜻인가요……?"
90001250-79 = "……! 설마?!"
90001250-80 = "네, 뭐. 그런 거죠."
90001250-81 = "지금의 티페레트에게 필요한 것은, 일종의 허가…… 아뇨, '결정'과 '격려'일 거예요."
90001250-83 = "[ns] \"드디어 터널을 다 지난 모양이야.\""
90001250-84 = "네…… 그리고 이 장소에는 여기저기 이끼가 껴 있는 것 같네요."
90001250-85 = "뭔가…… 풀 향기 같은 것이 나서, 좋네요……."
90001250-89 = "역시 완벽하게 관리되는 것은 조금 무리였던 듯하네요."
90001250-90 = "이렇게 외부 습기와 식생이 들어오면, 종자를 보관하는 환경으로는 그다지 좋지 않을 텐데 말이죠."
90001250-91 = "아니면…… 그 정도의 변수는 애초에 상정하고 있었다는 것일 수도 있지."
90001250-93 = "닫혀 있는 문이 또 하나 있는데? 저기가 그 중요하다는 종자 보관실일까?"
90001250-94 = "일단 가 보면 알 수 있겠죠. 그 전에, 잠시 휴식하는 것이 어떠실까요."
90001250-95 = "찬성! 슬슬 다리도 아파지려고 하니까."
90001250-97 = "아리스, 알고 있습니다! 최종 보스 직전의 세이브 포인트인 거군요!"
90001250-102 = "(이끼를 적당히 치우고, 자리를 마련했다.)"
90001250-105 = "(지친 탓인지, 게임개발부 아이들은 조금씩 졸기 시작했다.)"
90001250-109 = "……."
90001250-110 = "[ns] \"왜 그래, 케이? 이끼를 그렇게 바라보고.\""
90001250-111 = "네? 아, 아뇨. 그냥, 그저……."
90001250-112 = "……."
90001250-113 = "정말 뜬금없는 말인데요. 생명이란 건, 뭘까요."
90001250-114 = "어머나. 갑자기 무슨 일이죠, 케이?"
90001250-115 = "아뇨, 그냥."
90001250-116 = "이렇게 가혹한 환경에서, 이렇게 통제된 시설에, 어떻게든 아득바득 들어와서 자라고 있는 것을 보니까 말이에요."
90001250-117 = "이끼 말이야?"
90001250-118 = "그래요. 이끼 자체는 원시적인 식물이고, 대충 4억 년 전부터 등장했겠지만."
90001250-119 = "그런 사실들과는 별개로, 뭔가, 생명이란 이렇게나 불완전한 것인데, 하는 생각이 들어서요."
90001250-120 = "부서지기 쉽고, 자기중심적이고, 예측이 되지 않는 것이 생명이죠."
90001250-122 = "그건 말하자면 제멋대로라는 뜻인 거군요?"
90001250-123 = "……뭐, 그런 거겠죠."
90001250-124 = "좋은 부분을 말해 주었어요, 케이. 생명의 핵심은 바로 그 제멋대로라는 부분에 있는 것이니까요."
90001250-125 = "가령 직감에 의존한 무작위 난수라는 거, 논리 회로는 만들지 못하잖아요?"
90001250-126 = "………쳇."
90001250-128 = "[ns] \"그건 무슨 뜻이야, 히마리?\""
90001250-129 = "생각보다 난수는 어려운 개념이죠. 사실 컴퓨터는 난수를 만들 수 없답니다."
90001250-130 = "흔히 보는 '랜덤'은, 사실 정말은 임의의 값이 아니에요."
90001250-131 = "그렇지. 특정한 방법으로 계산하거나, 몇 밀리초 단위로 시시각각 변하는 값을 초깃값으로 잡은 다음."
90001250-132 = "여러 계산 과정을 거쳐, 사람이 볼 때에 마치 임의의 값인 것처럼 보이게 하는 것이니까. 이걸 의사난수라고 해."
90001250-133 = "진짜 난수를 생성하려면, 외부로부터 입력을 받아야 해."
90001250-134 = "보통, 사람이 난수를 입력하는 대신, 자연의 무작위성을 측정해서 난수로 변환하는 방식을 주로 사용하죠."
90001250-135 = "[s] \"그렇구나……?\""
90001250-136 = "그리고 저는 바로 그 확률과 우연, 비선형성이야말로 생명의 가능성일 수 있지 않을까, 하고 생각한답니다?"
90001250-137 = "바로 그 제멋대로라는 부분, 말이죠."
90001250-138 = "……그래서 근본적으로 통제가 안 되잖습니까. 예측도 안 되고요. 저는 그게 싫단 말이에요."
90001250-139 = "그렇지만 말이죠? 우리가 모든 것을 통제하고 예측했다면, 케이는 되살아날 수 없었을 텐데요?"
90001250-140 = "이야기가 왜 그렇게 되는 건가요."
90001250-141 = "가령 케이는 자신을 결정적으로 위협할 수 있는 변수를, '그저 그렇게 하고 싶다'는 이유만으로 남겨둘 수 있나요?"
90001250-142 = "그런 건 당연히 없애 버려야……."
90001250-146 = "아."
90001250-147 = "네. 그런 것이죠. 생명은 불확실하고 제멋대로이지만……."
90001250-148 = "오히려 그렇기에, 선택할 수 있는 가능성의 폭을 넓혀 갈 수 있는 법이죠."
90001250-149 = "그렇게 생명은 자각하지도 못하는 사이에, 그 스스로 유전적 다양성을 늘려 가는 것이고요."
90001250-150 = "……그리고 그건, 결과적으로 생명 그 자체에게 더 많은 기회를 남겨 줄 테고."
90001250-151 = "모든 걸 계산하고 예측하는 것이, 오히려 생존 가능성을 낮출 수도 있다는 건가요?"
90001250-152 = "네. 시각에 따라서는 그렇지 않을까요?"
90001250-153 = "애초에 모든 걸 계산하고 예측한다는 것이 가능할까 싶기도 하고요. 양자 터널이라든가, 이것저것 있잖아요?"
90001250-155 = "……."
90001250-156 = "그건 미시 영역인데요……."
90001250-157 = "하지만 엄연히 존재하는 영역이기도 하죠."
90001250-158 = "그리고, 보세요. 그런 계산적인 논의를 빼더라도…… 이 이끼들은, 그저 여기에 있는 것만으로 충분히 귀엽고 기특하지 않나요?"
90001250-159 = "……."
90001250-160 = "마치 케이가, 씨앗에는 그 하나하나마다 식물 한 포기, 한 그루의 가능성이 숨어 있다고 이야기한 것처럼 말이죠."
90001250-161 = "………그 말 하지 말 걸 그랬네요……."
90001250-162 = "[ns1] \"잘 모르겠지만, 하나는 알았어!\"\n[ns2] \"케이 쨩은 부끄럼쟁이라는 사실 말이지!\""
90001250-165 = "그, 그만 좀 놀리라구요!"
90001250-167 = "우선, 대전제를 생각하자."
90001250-168 = "저들은 생명체이고, 우리는 아니야. 그리고 티페레트 역시 마찬가지지."
90001250-169 = "모든 생명체에게는 한계가 있어. 그건 자명한 사실이야."
90001250-170 = "그러니까, 그 한계를 공략하는 거야!"
90001250-171 = "어, 어떻게요……?"
90001250-172 = "가령 말이지……!"
90001250-174 = "……호오."
90001250-175 = "그, 그그그그그, 그건 조금……!"
90001250-176 = "하지만, 분명 효과적이잖아. 안 그래?"
90001250-177 = "그그그, 그렇기는, 한데요……!"
90001250-178 = "그리고, 그 방법을 쓰더라도, 저 열쇠는 멀쩡할 텐데요……?"
90001250-179 = "뭐, 열쇠 혼자서는 뭘 못 할 거라고 생각하지만요."
90001250-180 = "거기에, 거기에 저 왕녀도 멀쩡할 가능성이 있는데요……?"
90001250-182 = "……완전히 멀쩡하지는 않을 거야. 저 왕녀는 그런 존재니까."
90001250-183 = "평소에 비하면…… 우리들의 표현으로는, 출력이 떨어질 수도 있겠지만."
90001250-184 = "그래도 그 정도면 어떻게 되지 않을까요? 전 찬성입니다."
90001250-186 = "어, 언니는, 언니는…… 어떻게 생각, 하세요……?"
90001250-190 = "……."
90001250-191 = "아인. 소프. 오르. 저는 필요악이라는 개념이, 생명에게는 때로 있어야 한다고 봐요."
90001250-192 = "가령 저 세계에는 천적이라는 것이 있다고, 들어서 알고 있습니다."
90001250-193 = "언뜻 보기에는, 먹히는 쪽이 일방적으로 당할 뿐이지만."
90001250-194 = "천적이라는 개념이 없으면 시스템은 유지되지 않는다고요."
90001250-196 = "아, 그거! 나 알아! 사슴만 많고 늑대가 없으면, 그 땅은 결국 죽은 땅이 된다고 하지!"
90001250-197 = "소프는 참 그런 건 자세하단 말이죠……."
90001250-198 = "왜. 뭐. 왜. 그러면 안 되냐."
90001250-199 = "안 되는 건 아닌데 말입니다. 그건 제가 생명체를 싫어하는 이유이기도 해서요."
90001250-200 = "그 존립에 반드시 모순을 내포하는 시스템이라니, 취향이 아니란 말이죠……."
90001250-201 = "끄응……."
90001250-203 = "그러니 아인. 소프. 오르. 결정되었으면, 티페레트에게도 그렇게 전하도록 하죠."
90001250-204 = "사실 티페레트도 객체적인 판단은 이미 완료했을 것이고, 다른 노드들의 판단을 참고하고 싶은 것일 테니까요."
90001250-205 = "어라. 듣고 보니 왠지 그거, 책임 분담처럼 들리기도 하는데요? 이거 이거 이거, 티페레트도 제법 영리하네요!"
90001250-206 = "그걸 꼭 꼬아서 그렇게 해석하냐……."
90001250-207 = "저, 저는, 좋아요. 우리가…… 티페 쨩을, 도울 수 있다는, 거잖아요……?"
90001250-209 = "그래요. 적어도 그분의 이름 아래에서."
90001250-213 = "우리는 이미, 하나인 것이니까요."
90001250-215 = "다음화;감추어져 있었던 것"
