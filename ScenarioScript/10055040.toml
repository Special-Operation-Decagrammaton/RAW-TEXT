[translation]
10055040-1 = "第4話;Geisterschiff"
10055040-2 = ""
10055040-3 = "……也就是說，那艘巨大的船是突然伴隨著霧氣出現的？"
10055040-4 = "簡直就是傳聞中的幽靈船呢。"
10055040-5 = "要是平常，我早就開心地大喊「靈異特輯！簡直是大獨家！」了……"
10055040-6 = "話說這艘船還真老舊，簡直就像只會出現在書本或博物館裡的東西一樣。"
10055040-7 = ""
10055040-9 = ""
10055040-10 = ""
10055040-11 = "伊吹知道這是什麼！是蓋倫帆船。"
10055040-12 = "蓋倫帆船？啊，我好像聽過！記得是靠划槳前進的船對吧？"
10055040-13 = "不對哦！那種船叫做槳帆船！是更古老的軍艦！"
10055040-14 = "哎呀～想裝懂結果搞錯了嗎？好丟臉哦，啊哈哈。"
10055040-15 = "這也沒辦法。畢竟無論槳帆船還是蓋倫帆船，現在都已經完全消失了。"
10055040-16 = "完全消失了……？可是……"
10055040-17 = "沒錯，那是本來不可能存在，如今也不會在奇普托斯任何一片海域航行的船隻。"
10055040-18 = "而那樣的船，現在就出現在我們面前。"
10055040-19 = "那簡直就像……"
10055040-20 = ""
10055040-22 = ""
10055040-23 = ""
10055040-24 = "……原來如此，這傢伙就是幽靈船傳說的真面目啊。"
10055040-25 = ""
10055040-27 = ""
10055040-28 = "好，決定了。"
10055040-29 = "奪下那艘船，回到陸地上吧。"
10055040-30 = ""
10055040-32 = ""
10055040-33 = "……什麼？"
10055040-34 = "等，等一下！真琴醬！你是認真的嗎！？"
10055040-35 = "嗯？有什麼問題嗎？"
10055040-36 = "那可是幽靈船，幽靈船耶！要是真的有幽靈該怎麼辦！"
10055040-37 = "沒想到皐月也會說出這麼離譜的話。怎麼可能會有幽靈那種東西。"
10055040-38 = "那麼大的船，應該需要不少船員才能運作。#n而且船都被撞到了，再怎麼樣也會出來看看情況吧。"
10055040-39 = "既然到現在都沒有任何人出來，就代表那只是艘被遺棄的廢船。#n所謂幽靈船的傳聞，八成也只是有人看到廢棄的船隻隨口亂傳的而已。"
10055040-40 = "哇，真琴前輩居然一臉正經地說出了超級合乎常理的話！"
10055040-41 = "還有。"
10055040-42 = "要是真的會怕，不跟來也無所謂。"
10055040-43 = "……咦？"
10055040-44 = "就是字面上的意思。如果想留在船上就隨你們高興。"
10055040-45 = "想跟來的人就跟在本大人後面。就由我真琴大人來帶路吧。"
10055040-46 = ""
10055040-48 = ""
10055040-49 = "啊！真琴前輩！一個人太危險了啦！"
10055040-50 = ""
10055040-52 = ""
10055040-53 = "…………"
10055040-54 = "真琴醬有點怪怪的。"
10055040-55 = "是嗎？不是跟平常一樣嗎？#n任性妄為，既蠻橫又不講理……"
10055040-56 = "不對。我不是那個意思。"
10055040-57 = "真琴醬跟我一樣，非常討厭會痛的事和可怕的東西。#n所以他絕對、絕對不會自己先跑進那種看起來很危險的地方。"
10055040-58 = "啊，確實是這樣呢。要是平常的話，他應該會叫我去看看吧。"
10055040-59 = "……總覺得很不對勁。"
10055040-60 = "自從幽靈船出現之後，真琴醬就好像有點變了。"
10055040-61 = "難道那艘船會對人的精神造成影響嗎……？"
10055040-62 = ""
10055040-64 = ""
10055040-65 = ""
10055040-66 = "伊吹也要去！"
10055040-67 = "咦？可是那裡很危險。"
10055040-68 = "伊吹知道哦！我們其實是在漂游……漂流？對吧？"
10055040-69 = "所以伊呂波前輩才會那麼生真琴前輩的氣。"
10055040-70 = "伊吹，你怎麼會知道……"
10055040-71 = "可是，伊吹也想幫上大家的忙！"
10055040-72 = "因為伊吹也是萬魔殿的正式成員！"
10055040-73 = ""
10055040-75 = ""
10055040-76 = ""
10055040-77 = "伊吹……"
10055040-78 = "……我知道了。#n不過，請你千萬不要離開我身邊哦。"
10055040-79 = "什麼！？連你們也要去！？"
10055040-80 = "嗯，算是吧。畢竟我還是很擔心千秋。"
10055040-81 = "等一下！那不就只剩我一個人留在船上了嗎！？"
10055040-82 = "大概會是那樣吧？我覺得留一個人下來守船也不錯。"
10055040-83 = "嗚嗚……！"
10055040-84 = ""
10055040-86 = ""
10055040-87 = "…………"
10055040-88 = "不，我是說真的。你不用勉強跟過來也沒關係。"
10055040-89 = "等一下！我正在想啦！"
10055040-90 = ""
10055040-92 = ""
10055040-93 = "……我也要去。"
10055040-94 = "咦？真的嗎？你不要緊嗎？"
10055040-95 = "在這種狀況下怎麼可能一個人待著啊！#n一般人才不會那樣！正常人絕對不會一個人留下來！"
10055040-96 = "我倒是覺得也沒那麼誇張啦……"
10055040-97 = "皐月前輩！跟伊吹手牽手吧～"
10055040-98 = ""
10055040-100 = ""
10055040-101 = ""
10055040-102 = ""
10055040-103 = "只要一直緊緊牽著手，就一點都不可怕了！"
10055040-104 = "伊吹醬……"
10055040-105 = ""
10055040-107 = ""
10055040-108 = "呼……好，好吧。我做好心理準備了。#n無論幽靈還是什麼東西，儘管放馬過來吧！"
10055040-109 = "就說了不會來啦。怎麼可能會有幽靈嘛。"
10055040-110 = "……"
10055040-116 = ""
10055040-117 = ""
10055040-118 = ""
10055040-119 = "……結果還是過來了呢。"
10055040-120 = "真琴前輩人呢……"
10055040-121 = ""
10055040-125 = ""
10055040-126 = "是突襲！？大家快退後！"
10055040-127 = "……什麼嘛，原來是你們啊。"
10055040-128 = ""
10055040-130 = ""
10055040-132 = ""
10055040-133 = "真琴前輩……？"
10055040-134 = "剛才的槍擊是……？"
10055040-135 = "嗯，是本大人。"
10055040-136 = "剛才還以為是幽靈出現了呢……"
10055040-137 = "……？你剛剛不是說不相信幽靈那種東西嗎……？"
10055040-138 = "啊，伊呂波醬！你跟過來了啊！"
10055040-139 = ""
10055040-141 = ""
10055040-142 = "嗯，總之就變成這樣了。"
10055040-143 = "不過既然你在旁邊，好歹也阻止一下吧。#n我和皐月前輩就算了，老師和伊吹可是真的會有危險耶。"
10055040-144 = "啊哈哈，抱歉……可是他連阻止的機會都不給，二話不說就開槍了。"
10055040-145 = "……？這麼說來，我好像是第一次看到真琴前輩開槍的樣子……？"
10055040-146 = "所以這裡沒有任何人嗎？真的安全吧？"
10055040-147 = "嗯，錯不了。"
10055040-148 = "都鬧出這麼大的動靜了，卻沒有任何人出現。"
10055040-149 = "也就是說，這艘船上根本沒有任何人……"
10055040-150 = ""
10055040-153 = ""
10055040-154 = ""
10055040-155 = ""
10055040-156 = ""
10055040-157 = ""
10055040-158 = "啊啊……"
10055040-159 = ""
10055040-161 = ""
10055040-162 = ""
10055040-163 = "皐月前輩！請振作一點！"
10055040-164 = "難道真的是幽靈海盜！？"
10055040-165 = "沒想到真的會出現……不過本大人也早有準備！"
10055040-166 = "伊呂波，用「那個」！把「那個」準備好！"
10055040-167 = "雖然不知道你在說什麼，但正在漂流的我們什麼都沒有好嗎！？"
10055040-168 = ""
10055040-172 = "哇啊啊！他們甚至開槍了耶！"
10055040-173 = "幽靈怎麼會開槍……不對，現在不是計較這種事的時候！"
10055040-174 = "大家快撤回原本的船上吧！"
10055040-175 = ""
10055040-178 = ""
10055040-179 = ""
10055040-180 = ""
10055040-181 = ""
10055040-182 = "前輩！後面也有幽靈大姐姐們！"
10055040-183 = "咦！？什麼時候出現的！？"
10055040-184 = ""
10055040-186 = ""
10055040-187 = "唔，唔嗯？怎麼回事？我好像在夢裡看到了非常可怕的東西……"
10055040-188 = ""
10055040-190 = ""
10055040-191 = "……這不是夢啊！？"
10055040-192 = ""
10055040-194 = ""
10055040-196 = "啊啊！這下陷入無限迴圈了！"
10055040-197 = "千秋！扶好皐月！往裡面逃！伊吹到本大人這邊來！"
10055040-198 = "是的！！！請振作一點，皐月前輩！！！"
