[translation]
10055040-1 = "ตอนที่ 4;เรือผี"
10055040-2 = ""
10055040-3 = "สรุปก็คือ... จู่ๆ เรือใหญ่ลำนั้นก็โผล่มาพร้อมกับหมอกงั้นเหรอ?"
10055040-4 = "เป็นเรือผีตามข่าวลือจริงๆ ด้วยสินะคะ"
10055040-5 = "ถ้าเป็นปกติฉันคงดีใจว่าได้สกู๊ปข่าวเรื่องลี้ลับแล้ว คงได้ข่าวใหญ่สุดๆ..."
10055040-6 = "ถึงอย่างนั้นก็เถอะ ดูเป็นเรือเก่าที่น่าจะเห็นได้แค่ในหนังสือหรือพิพิธภัณฑ์เท่านั้นเลยนะ"
10055040-7 = ""
10055040-9 = ""
10055040-10 = ""
10055040-11 = "อิบูกิรู้ว่าคืออะไร เรือแกลเลียนไงล่ะ"
10055040-12 = "เรือแกลเลียน? อ่า เหมือนจะเคยได้ยินมาค่ะ! ถ้าจำไม่ผิดคือเรือที่ใช้พายด้วยใช่มั้ยคะ?"
10055040-13 = "หืม ไม่ใช่นะ! นั่นเรือแกลลีย์ต่างหาก! มันเป็นเรือรบที่เก่ากว่านั้นอีกนะ!"
10055040-14 = "อ๊ะ~ ฉันเข้าใจผิดไปเองสินะคะ? น่าอายจัง ฮะฮะฮ่า"
10055040-15 = "ช่วยไม่ได้นี่ ทั้งเรือแกลลีย์และเรือแกลเลียน ตอนนี้ก็ไม่มีให้เห็นแล้วนี่นะ"
10055040-16 = "ไม่มีให้เห็นแล้วเหรอคะ? แต่ว่า..."
10055040-17 = "ใช่ เรือที่ไม่ควรจะมีอยู่และไม่ควรจะแล่นอยู่ในทะเลแห่งไหนของคิโวทอสอีกแล้ว..."
10055040-18 = "กลับมาโผล่อยู่ต่อหน้าพวกเราตอนนี้ไงล่ะ"
10055040-19 = "แบบนั้นมันก็เหมือนกับ..."
10055040-20 = ""
10055040-22 = ""
10055040-23 = ""
10055040-24 = "อย่างนี้นี่เอง นี่คือความจริงเบื้องหลังตำนานเรือผีสินะ..."
10055040-25 = ""
10055040-27 = ""
10055040-28 = "ดีละ เราตัดสินใจแล้ว"
10055040-29 = "เราจะยึดเรือลำนั้นใช้กลับไปที่ชายฝั่ง"
10055040-30 = ""
10055040-32 = ""
10055040-33 = "หา...?"
10055040-34 = "ดะ... เดี๋ยวก่อนสิ มาโคโตะจัง! จะทำแบบนั้นจริงๆ เหรอ?"
10055040-35 = "หืม? มีปัญหาอะไรงั้นเหรอ?"
10055040-36 = "นั่นมันเรือผีเลยนะ เรือผี! ถ้ามีผีอยู่จริงๆ จะทำยังไงล่ะ!"
10055040-37 = "ซัตสึกิก็พูดอะไรแปลกๆ กับเขาเหมือนกันสินะ ผีจะไปมีอยู่จริงได้ยังไงกันเล่า"
10055040-38 = "เรือใหญ่ขนาดนั้นคงต้องใช้ลูกเรือไม่น้อยเลยละ แล้วถ้ามีอะไรชนเรือเข้า ก็น่าจะมีใครออกมาดูบ้างแล้ว"
10055040-39 = "จนถึงตอนนี้ยังไม่มีใครออกมา ก็แสดงว่าเป็นแค่เรือที่ถูกทิ้งไว้ ข่าวลือเรื่องเรือผีก็คงเป็นคนเห็นเรือร้าง#nแล้วพูดกันไปเองนั่นละ"
10055040-40 = "ว้าว รุ่นพี่มาโคโตะทำหน้าจริงจังแล้วพูดอะไรที่มีเหตุผลสุดๆ...!"
10055040-41 = "แล้วอีกอย่าง"
10055040-42 = "ถ้ารู้สึกไม่ดีก็ไม่ต้องตามมาก็ได้"
10055040-43 = "คะ...?"
10055040-44 = "ก็ตามที่พูด ถ้าอยากอยู่บนเรือต่อก็อยู่ไปเถอะ"
10055040-45 = "ส่วนใครจะตามเรามาก็ตามมา เราจะนำหน้าเอง"
10055040-46 = ""
10055040-48 = ""
10055040-49 = "อ๊ะ! รุ่นพี่มาโคโตะ! ไปคนเดียวมันอันตรายนะคะ!"
10055040-50 = ""
10055040-52 = ""
10055040-53 = "........."
10055040-54 = "มาโคโตะจังแปลกๆ ไปนะ"
10055040-55 = "เหรอคะ? ก็ดูปกติดีไม่ใช่เหรอคะ? เอาแต่ใจ ไม่ยอมฟังใคร..."
10055040-56 = "ไม่ใช่ ฉันไม่ได้หมายถึงเรื่องนั้น"
10055040-57 = "มาโคโตะจังเกลียดทั้งความเจ็บปวดและเรื่องน่ากลัวเหมือนฉัน เพราะงั้นไม่มีทางที่จะอาสาเข้าไปในที่ที่#nดูอันตรายแบบนั้นก่อนเป็นคนแรกแน่ๆ ไม่มีทางเด็ดขาดเลย"
10055040-58 = "อ่า ก็จริงค่ะ ถ้าเป็นปกติคงสั่งให้ฉันเข้าไปดูแล้ว"
10055040-59 = "สังหรณ์ใจไม่ดีเลย..."
10055040-60 = "ตั้งแต่เรือผีโผล่มา มาโคโตะจังก็ดูเปลี่ยนไปนิดหน่อย"
10055040-61 = "อย่าบอกนะว่าเรือลำนั้นส่งผลอะไรต่อจิตใจเธอน่ะ...?"
10055040-62 = ""
10055040-64 = ""
10055040-65 = ""
10055040-66 = "อิบูกิก็จะไปด้วย!"
10055040-67 = "คะ? มันอันตรายนะคะ"
10055040-68 = "อิบูกิรู้นะ จริงๆ แล้วพวกเรากำลังลอยเค้ง... ลอยเคว้งอยู่กลางทะเลใช่มั้ย?"
10055040-69 = "รุ่นพี่อิโรฮะถึงได้โกรธรุ่นพี่มาโคโตะขนาดนั้น"
10055040-70 = "อิบูกิ รู้ได้ยังไงกัน..."
10055040-71 = "อิบูกิก็อยากช่วยทุกคนเหมือนกันนะ!"
10055040-72 = "อิบูกิก็เป็นสมาชิกแพนเดโมเนียม โซไซตี้เหมือนกันนี่นา!"
