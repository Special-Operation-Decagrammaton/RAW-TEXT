[translation]
10055040-1 = "제4화;가이스터쉬프"
10055040-3 = "……정리하자면, 저 커다란 배가 갑자기 물안개를 몰고 나타났다?"
10055040-4 = "그야말로, 소문의 유령선, 그 자체네요."
10055040-5 = "평소라면 심령특집! 그야말로 대특종! 이라고 기뻐했겠지만……."
10055040-6 = "그렇다 쳐도, 책이나 박물관 정도에서나 볼 법한 낡은 배로군."
10055040-11 = "이부키, 뭔지 알아. 갤리온이야."
10055040-12 = "갤리온? 아, 들어본 거 같아요! 분명, 노를 저어서 가는 배였던가요?"
10055040-13 = "으응, 달라! 그건 갤리! 더 오래된 군함이야!"
10055040-14 = "아차~ 아는 척하다가 틀렸나요? 엄청 부끄럽네요, 아하하."
10055040-15 = "어쩔 수 없지. 갤리도, 갤리온도, 지금은 완전히 사라진 물건이니까."
10055040-16 = "완전히 사라졌다? 하지만……."
10055040-17 = "그래, 원래는 있을 리 없는, 더는 키보토스 어느 바다에서도 항해하고 있지 않을 선박."
10055040-18 = "그런 배가 지금 우리 앞에 나타난 거야."
10055040-19 = "……그건, 꼭……."
10055040-24 = "……과연, 이 녀석이 유령선 전설의 실체라는 건가."
10055040-28 = "좋아, 정했다."
10055040-29 = "저 배를 탈취해서 육지로 돌아간다."
10055040-33 = "……하?"
10055040-34 = "자, 잠깐만! 마코토 쨩! 진짜로 할 거야?"
10055040-35 = "응? 뭔가 문제라도?"
10055040-36 = "유령선이라니까, 유령선! 진짜로, 유령이 있으면 어떻게 해!"
10055040-37 = "사츠키도 꽤 엉뚱한 소리를 다 하는군. 유령 같은 게 있을 리가 없잖나."
10055040-38 = "저만한 배라면 운용에 적잖은 선원이 필요하겠지. 그리고 누구라도 배에 뭔가 부딪혔다면 나와볼 테고."
10055040-39 = "지금까지 아무도 나오지 않은 걸 보면, 그냥 버려진 폐선이라는 뜻이다. 유령선 소문이란 것도 어차피, 버려진 배를 보고 멋대로 떠들어댄 거겠지."
10055040-40 = "우왓, 마코토 선배가 정색하면서 엄청나게 상식적인 발언을!"
10055040-41 = "그리고."
10055040-42 = "정 불안하면 따라오지 않아도 상관없다."
10055040-43 = "……네?"
10055040-44 = "말 그대로다. 배에 남아 있고 싶다면 그렇게 해라."
10055040-45 = "대신 뒤따를 사람은 이 몸을 따라오도록. 내가 앞장서겠다."
10055040-49 = "앗! 마코토 선배! 혼자는 위험해요!"
10055040-53 = "…………."
10055040-54 = "마코토 쨩, 이상해."
10055040-55 = "그래요? 평소랑 똑같지 않아요? 제멋대로에, 막무가내에……."
10055040-56 = "틀려. 그런 얘기가 아니야."
10055040-57 = "마코토 쨩은 나랑 똑같이 아프고 무서운 걸 정말 싫어해. 그러니까 저런 위험해 보이는 장소에는 절대, 절대로 먼저 들어가지 않을 거야."
10055040-58 = "아, 확실히 그러네요. 평소 같았으면, 저한테 가보라고 했겠죠."
10055040-59 = "……꺼림칙해."
10055040-60 = "유령선이 나타나고 나서 마코토 쨩이 뭔가 달라졌어."
10055040-61 = "설마, 저 배가 정신에 무슨 영향을……?"
10055040-66 = "이부키도 갈래!"
10055040-67 = "네? 하지만, 위험해요."
10055040-68 = "이부키, 알고 있어. 우리들 사실은 표유…… 표류? 하고 있는 거지?"
10055040-69 = "그래서 이로하 선배도, 마코토 선배한테 잔뜩 화가 난 거고."
10055040-70 = "이부키, 어떻게 그걸……."
10055040-71 = "그치만, 이부키도 모두에게 도움이 되고 싶어!"
10055040-72 = "이부키도 어엿한 만마전의 일원인걸!"
10055040-77 = "이부키……."
10055040-78 = "……알겠어요. 대신 저한테서 떨어지지 마세요."
10055040-79 = "뭐?! 너희까지 갈 거야?!"
10055040-80 = "아, 네, 뭐. 저는 아무래도 치아키가 걱정되어서요."
10055040-81 = "잠깐! 그러면 나 혼자 배에 남는 거잖아?!"
10055040-82 = "아마도 그렇겠죠? 한 사람 정도는 배를 지키고 있는 것도 좋다고 생각해요."
10055040-83 = "……으으!"
10055040-87 = "………."
10055040-88 = "아니, 진짜로요. 무리해서 따라오지 않으셔도 괜찮아요."
10055040-89 = "잠깐만! 생각 중이니까!"
10055040-93 = "……나도 가."
10055040-94 = "네? 진짜로요? 괜찮아요?"
10055040-95 = "이런 상황에 혼자 있을 수 있을 리가 없잖아! 보통 사람이라면 안 그래! 제정신이라면 절대 혼자 안 남아 있어!"
10055040-96 = "그 정도는 아니라 생각하는데요……."
10055040-97 = "사츠키 선배! 이부키랑 손잡자!"
10055040-103 = "같이 손 꼬옥 붙잡고 가면 하나도 안 무서울 거야!"
10055040-104 = "이부키 쨩……."
10055040-108 = "후우…… 조, 좋아. 난 준비됐어. 유령이든 뭐든 올 테면 오라지!"
10055040-109 = "아니, 안 온다고요. 유령이 있을 리 없잖아요."
10055040-110 = "……."
10055040-119 = "……결국, 건너왔네요."
10055040-120 = "마코토 선배는……."
10055040-126 = "기습?! 다들 물러서세요!"
10055040-127 = "……뭐야, 너희였냐."
10055040-133 = "마코토 선배……?"
10055040-134 = "조금 전 총격은……?"
10055040-135 = "아, 그래. 나다."
10055040-136 = "난 또 유령이 나타난 줄 알고……."
10055040-137 = "……? 분명 유령 같은 건 안 믿는다고……?"
10055040-138 = "앗, 이로하 쨩! 따라왔구나!"
10055040-142 = "아, 네. 뭐, 그렇게 됐네요."
10055040-143 = "그나저나 옆에서 좀 말려주지 그랬어요. 저나 사츠키 선배는 그렇다 치더라도, 선생님이나 이부키는 진짜로 위험하다고요."
10055040-144 = "아하하, 미안…… 그치만, 말릴 틈도 없이 다짜고짜 쏴버려서."
10055040-145 = "……? 그러고 보니, 마코토 선배가 총을 쏘는 모습은 처음 보는 것 같기도……?"
10055040-146 = "그러면, 아무도 없는 거야? 안전한 거 맞지?"
10055040-147 = "음, 틀림없다."
10055040-148 = "이렇게까지 소란을 피웠는데, 아무도 나타나지 않았다."
10055040-149 = "그 말은, 이 배에는 아무도……."
10055040-158 = "아아……."
10055040-163 = "사츠키 선배! 정신 차리세요!"
10055040-164 = "정말로 유령 해적이란 말인가?!"
10055040-165 = "진짜 나타날 줄은…… 하지만 이쪽도 대비가 되어 있지!"
10055040-166 = "이로하, <그것>이다! <그것>을 준비해라!"
10055040-167 = "뭘 말하는지 몰라도, 적어도 표류 중인 우리한테는 아무것도 없거든요?!"
10055040-172 = "우와앗! 총까지 쏘기 시작했어요!"
10055040-173 = "뭔 유령이 총을……. 아니, 그런 걸 따질 때가 아니네요!"
10055040-174 = "다들 원래 배로 퇴각하죠!"
10055040-182 = "선배! 뒤에도 유령 언니들이 있어!"
10055040-183 = "네?! 어느 틈에?!"
10055040-187 = "으, 으응? 어떻게 된 거지? 분명 꿈에서 엄청 무서운 걸 본 듯한……."
10055040-191 = "……꿈이 아니잖아?!"
10055040-196 = "아앗! 무한 루프 돌입이에요!"
10055040-197 = "치아키! 사츠키를 부축해라! 안쪽으로 도망친다! 이부키는 내 쪽으로!"
10055040-198 = "네엡!!! 정신 차리세요, 사츠키 선배!!!"
10055040-212 = "[ns1] \"……? 우지끈?\"\n[ns2] \"아, 망했…….\""
10055040-215 = "앗, 바닥이 무너져서…… 선생님! 사츠키 선배!"
10055040-220 = "괜찮아요! 제가 잡았……!"
10055040-221 = "아아아! 역시 혼자서는 무리일지도……!"
10055040-228 = "(……그렇게 우리는 무너진 바닥 아래로 떨어지고 말았다.)"
