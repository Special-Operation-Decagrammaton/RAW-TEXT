10055040-78 = "เข้าใจแล้วค่ะ... แต่ห้ามอยู่ห่างจากฉันนะคะ"
10055040-79 = "อะไรนะ?! พวกเธอก็จะไปด้วยเหรอ?!"
10055040-80 = "อ่า ค่ะ อืม... ฉันเป็นห่วงจิอากิน่ะค่ะ"
10055040-81 = "เดี๋ยวสิ! งั้นแบบนี้ฉันก็ต้องอยู่บนเรือคนเดียวไม่ใช่เหรอ?!"
10055040-82 = "ก็คงอย่างนั้นค่ะ ฉันคิดว่าให้มีสักคนอยู่เฝ้าเรือก็ดีเหมือนกันนะคะ"
