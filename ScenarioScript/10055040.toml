10055040-141 = ""
10055040-142 = "อ่า ค่ะ... ก็อย่างที่เห็นนั่นแหละค่ะ"
10055040-143 = "ว่าแต่ว่าอยู่ด้วยกันก็น่าจะช่วยห้ามหน่อยสิคะ ฉันกับรุ่นพี่ซัตสึกิน่ะไม่เท่าไรหรอก แต่คุณครูกับอิบูกิอาจเป็นอันตรายได้นะคะ"
10055040-144 = "อะฮะฮ่า ขอโทษนะ... แต่จู่ๆ รุ่นพี่ก็ยิงเฉยเลย ฉันเลยห้ามไม่ทันน่ะ"
10055040-145 = "...? จะว่าไปแล้ว เหมือนเพิ่งเคยเห็นรุ่นพี่มาโคโตะยิงปืนเป็นครั้งแรกเลยนะ...?"
10055040-146 = "แสดงว่าไม่มีใครอยู่เหรอ? ปลอดภัยแน่นะ?"
10055040-147 = "อืม ไม่ผิดแน่"
10055040-148 = "พวกเราส่งเสียงเอะอะกันขนาดนี้แล้ว ยังไม่มีใครโผล่หน้ามาเลย"
