[translation]
10055040-1 = "第4話;ガイスターシップ"
10055040-2 = ""
10055040-3 = "……つまり、あの大きな船が霧と共に現れたと？"
10055040-4 = "まさに噂の幽霊船……ですね。"
10055040-5 = "いつもなら心霊特集！まさに特ダネ！と喜んでるところですが……。"
10055040-6 = "博物館にありそうなくらい古いな。"
10055040-7 = ""
10055040-9 = ""
10055040-10 = ""
10055040-11 = "イブキ、これ知ってる！ガレオン船だよね。"
10055040-12 = "ガレオン？あ、聞いたことあります！#nたしかオールを漕いで動かす船ですよね？"
10055040-13 = "ううん、それはガレー船！もっと古い船だよ！"
10055040-14 = "あちゃー間違えちゃったか……#nお恥ずかしや、あはは。"
10055040-15 = "ガレーもガレオン船も、今となっては消えてしまったものね。"
10055040-16 = "消えてしまった……？#nでも……。"
10055040-17 = "そう。本来存在するはずのない、キヴォトス中のどこの海にもない船舶。"
10055040-18 = "その船が私たちの前に現れた、ということよ。"
10055040-19 = "それってまるで……。"
10055040-20 = ""
10055040-22 = ""
10055040-23 = ""
10055040-24 = "……なるほど。これが幽霊船伝説の正体か。"
10055040-25 = ""
10055040-27 = ""
10055040-28 = "よし、決めた。"
10055040-29 = "あれを奪って陸へ戻る。"
10055040-30 = ""
10055040-32 = ""
10055040-33 = "……は？"
10055040-34 = "ちょ、ちょっとマコトちゃん！本気！？"
10055040-35 = "ん？何か問題でも？"
10055040-36 = "幽霊船よ？幽霊船！本当に幽霊がいたらどうするのよ！"
10055040-37 = "おかしなことを言うな？#n幽霊なんて居るわけがないだろう。"
10055040-38 = "あれ程の船なら船員もそれなりにいるはずだ。#nそして船に異常を感じたなら表に出てくるだろう。"
10055040-39 = "しかし未だに誰も出てこない……ということは、捨てられた船なのだろう。#n幽霊船の噂だって、どうせ寂れた船を見て、好き勝手言っているだけにすぎん。"
10055040-40 = "うわ、マコト先輩が真顔で常識人的な発言を！？"
10055040-41 = "それに――"
10055040-42 = "不安なら無理についてこなくとも良い。"
10055040-43 = "……え？"
10055040-44 = "言葉通りの意味だ。船に居たければ好きにするがいい。"
10055040-45 = "こちらに来たい者だけ私の後に続け。#nこのマコト様が先導してやろう。"
10055040-46 = ""
10055040-48 = ""
10055040-49 = "あっ、マコト先輩！一人じゃ危ないですよ！"
10055040-50 = ""
10055040-52 = ""
10055040-53 = "…………。"
10055040-54 = "マコトちゃん、変ね。"
10055040-55 = "そうですか？いつもと同じだと思いますけど。#n自分勝手で、強引で……。"
10055040-56 = "違う。そういう話じゃないわ。"
10055040-57 = "マコトちゃんと私は結構似ているの。痛いことと、怖いものが大嫌いで……。#nだから、あんな危ない場所に自分から入りに行くことなんて絶対にしない。"
10055040-58 = "そうですね……いつもなら私に行けって言いそうなのに。"
10055040-59 = "……なんだか嫌な感じ。"
10055040-60 = "幽霊船が現れて、マコトちゃんの雰囲気がおかしくなった。"
10055040-61 = "まさかあの船は、精神に影響を与えて……？"
10055040-62 = ""
10055040-64 = ""
10055040-65 = ""
10055040-66 = "イブキもいくー！"
10055040-67 = "えっ……？でも、危険です。"
10055040-68 = "イブキ知ってるよ！#n私たち、実は漂遊……？漂流、してるんだよね？"
10055040-69 = "それでイロハ先輩もマコト先輩とケンカしてて……。"
10055040-70 = "イブキどうしてそれを……。"
10055040-71 = "イブキもみんなの役に立ちたい！"
10055040-72 = "イブキも万魔殿の一員、だからね！"
10055040-73 = ""
10055040-75 = ""
10055040-76 = ""
10055040-77 = "イブキ……。"
10055040-78 = "……分かりました。その代わり、私のそばから絶対に離れないでくださいね。"
10055040-79 = "ええっ！？あなた達も行くの！？"
10055040-80 = "ええ、まあ……やっぱり、チアキが心配なので。"
10055040-81 = "ちょっと！それじゃあ私一人きりじゃない！？"
10055040-82 = "そうなりますね？#nまあ、一人くらいは船を守ってもいいかなと。"
10055040-83 = "うう……！"
10055040-84 = ""
10055040-86 = ""
10055040-87 = "…………。"
10055040-88 = "いや本当に。無理してついてこなくて大丈夫ですから。"
10055040-89 = "待って頂戴！今考えてるから！"
10055040-90 = ""
10055040-92 = ""
10055040-93 = "……私も行く。"
10055040-94 = "えっ本当に？大丈夫ですか？"
10055040-95 = "こんな状況で一人でいられるわけないじゃない！#n普通の人ならそうよ！まともな人間ならそうなの！"
10055040-96 = "そこまでではないかと……。"
10055040-97 = "サツキ先輩！イブキと手繋ご～"
