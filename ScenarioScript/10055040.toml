10055040-108 = "ฮู่ว... ดะ... ได้สิ ฉันพร้อมแล้วละ จะผีหรืออะไรก็มาได้เลย!"
10055040-109 = "เดี๋ยวสิคะ มันไม่มีอะไรโผล่มาหรอกค่ะ ผีจะไปมีอยู่จริงได้ยังไงคะ"
