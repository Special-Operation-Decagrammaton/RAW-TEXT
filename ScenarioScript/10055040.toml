10055040-94 = "คะ? พูดจริงเหรอคะ? ไม่เป็นไรแน่นะคะ?"
10055040-95 = "จะให้รออยู่คนเดียวในสถานการณ์แบบนี้ได้ยังไง! คนปกติเขาไม่ทำกันหรอก! ถ้าสติยังดีอยู่ใครจะยอม#nอยู่ที่นี่คนเดียวล่ะ!"
