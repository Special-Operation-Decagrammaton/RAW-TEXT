[translation]
10015075-1 = "에필로그;대운동회의 아침"
10015075-7 = "으으…… 으으으……"
10015075-8 = "그 로봇은 안 돼…… 대운동회에 대전차 미사일을 쏘는 종목은 없단 말이야……"
10015075-9 = "비싸게 대여해 온 차량이…… 다른 학교로부터의 피해보상 청구가……"
10015075-11 = "이대로 가면 모두 파산이야……!"
10015075-16 = "어, 어라? 꿈이었나……?"
10015075-17 = "후우…… 다행이다. 정말 끔찍한 악몽이었어……"
10015075-18 = "하기야, 아무리 키보토스에 이상한 학생들이 많다지만 대회장에서 무턱대고 대전차 미사일을 폭죽처럼 쏘는 이상한 학생은 없겠지……"
10015075-19 = "그나저나 밖이 왜 이렇게 밝은 거지? 지금 시간이……"
10015075-20 = "오전 7시?!!"
10015075-21 = "망했다! 아직 대운동회 준비가 잔뜩 남아 있는데……!"
10015075-22 = "우선 체육복 환복부터…… 아니, 발송이 급한 공문부터……!"
10015075-32 = "미, 미안. 노아! 나도 모르게 어느새 잠들어 버려서……!"
10015075-33 = "쉬잇—"
10015075-34 = "……으, 으응?"
10015075-35 = "조금만 목소리를 줄여주세요. 유우카 쨩. 모두 방금 잠이 든 참이거든요."
10015075-36 = "어, 어……."
10015075-39 = "헤헤…… 이번 대운동회에서도…… 세상을 여러 색깔로 잔뜩 칠하는 거야……"
10015075-40 = "우으…… 아무리 선생님의 부탁이라도…… 수영복 기반의 치어리더 의상은…… 곤란해……"
10015075-41 = "흠냐…… 대운동회의 역사에 대해 설명해 드리자면…… 오디세이아 해양학교의 학생들이 선상에서 체력 단련을 위해 개최한 체육제가 시초로……"
10015075-42 = "……에너지 드링크…… 더 많은 에너지 드링크가 필요해……"
10015075-44 = "후후, 어제 다들 늦게까지 일하느라 피곤하셨던 모양이네요."
10015075-45 = "다들…… 여기서 무얼 하고 있었던 거야?"
10015075-50 = "여기, 비품 재고 현황 목록과 관련교에 요청하여 받은 엔트리입니다. 베리타스 여러분이 정리를 도와주셨어요."
10015075-51 = "베리타스가 세미나의 일을 도와주었다고……? 그게 무슨 소리야?"
10015075-52 = "그리고 도난당한 체육 기자재와 파손된 시설의 복구도 끝났고……"
10015075-53 = "응원 로봇은…… 상태가 다소 좋진 않지만, 그 부분은 이해해주세요."
10015075-55 = "수리 비용의 정산과 청구까지 끝났다고……?"
10015075-56 = "잠깐. 그보다 이건 원래 내가 해야 할 일이었는데—"
10015075-57 = "하암…… 저도 밤을 새워서 그런지 조금 피곤하네요."
10015075-58 = "저도 잠시 눈을 붙이고 올 테니, 뒷일은 부탁드리겠습니다."
10015075-60 = "자, 잠깐 기다려. 노아!"
10015075-68 = "[ns] \"잠은 잘 잤어, 유우카?\""
10015075-69 = "아…… [USERNAME] 선생님."
10015075-70 = "죄송합니다. 해야 할 일을 잔뜩 쌓아 놓은 채 잠이나 자고 있었다니……"
10015075-71 = "무책임한 모습을 보였네요. 면목 없습니다……"
10015075-72 = "[s1] \"괜찮아. 신경 쓰지 마.\"\n[s2] \"피로는 어떻게 좀 풀렸어?\""
10015075-75 = "네. 오랜만에 방해받지 않고 푹 자서 그런지, 전에 없이 개운한 느낌이긴 한데요……"
10015075-76 = "다른 학생들이 밤새워 제 일을 대신 처리하는 동안, 저는 나태하게 잠이나 자고 있었다고 생각하니 부담감에 속이 쓰리네요……."
10015075-77 = "정말이지…… 이렇게까지 무리를 할 거였다면 왜 진작 날 깨우지 않았던 거야?"
10015075-78 = "이렇게 지친 상태라면 축제도 제대로 즐기지 못할 텐데……"
10015075-79 = "[s] \"그건 다들 같은 생각을 하고 있어서 그런 게 아닐까?\""
10015075-80 = "네?"
10015075-81 = "[s3] \"모처럼의 대운동회니까.\"\n[s4] \"다들 가장 고생했던 유우카가 축제를 즐기길 바랐던 걸 거야.\""
10015075-87 = "그렇게 신경 써 주지 않더라도 알아서 잘 즐겼을 텐데……"
10015075-89 = "……라고는 말하지 못하겠네요."
10015075-94 = "네. 분명 그 많은 일을 혼자 처리했었더라면, 저는 축제를 즐기기는커녕 개회식이 끝나자마자 지쳐 잠이 들었을 테니까요."
10015075-95 = "……이번에는 모두에게 빚을 졌네요."
10015075-97 = "하지만 아직 마음을 놓을 수는 없어요."
10015075-98 = "대운동회가 끝날 때까지 자잘한 사건 사고는 계속 일어날 테니까요."
10015075-99 = "이번 대운동회를 주관하는 학교의 임원으로서, 모두가 즐길 수 있는 대운동회가 되도록 계속 노력하겠습니다!"
10015075-100 = "[s5] \"좋은 생각이야.\"\n[s6] \"하지만 너무 무리는 하지 말고.\""
10015075-103 = "……그렇게 말씀하시는 선생님이야말로 무리하고 계신 게 아닌가요?"
10015075-104 = "정황을 보아하니, 선생님께서도 밤새 학생들을 도와주시느라 제대로 잠도 못 주무신 것 같은데……"
10015075-105 = "잠깐이라도 좋으니, 개회식이 시작하기 전에 선생님도 주무시고 오세요."
10015075-110 = "그…… 아까 제가 말한 '모두'에는 선생님도 포함되니까……"
10015075-111 = "꼭 약속해 주셔야 해요……?"
10015075-123 = "(그 후, 대운동회 준비는 순조롭게 진행되어 무사히 개회식에 이르게 되었다.)"
10015075-124 = "(뒤늦게 경기에 추가 종목이 생긴 걸 알게 된 일부 학생들이 소란을 일으키기도 했지만……)"
10015075-130 = "잠시 후, 대운동회 선서를 낭독할 선수 대표의 입장이 있겠습니다……"
10015075-132 = "이번 황륜대제의 선수 대표는, 아비도스 고등학교의 '오쿠소라 아야네' 선수와……"
10015075-139 = "트리니티 종합학원의 '우라와 하나코' 선수입니다."
10015075-147 = "(……뒤이어 대운동회에서 벌어진 소란들에 비하면 사소한 사건이었다.)"
