[translation]
1002220-1 = "아직도 소중히 여기는 것"
1002220-2 = "(그리하여 기쁜 마음으로 한달음에 히나가 기다리고 있는 바닷가를 찾아갔다.)"
1002220-7 = "[ns] \"히나! 나 왔어!\""
1002220-8 = "아, 선생님……."
1002220-9 = "아무래도 너무 갑작스러운 부탁인 것 같아 과연 괜찮을까, 조금 걱정했었는데……."
1002220-13 = "……이렇게 흔쾌히 나와줘서 고마워. 선생님."
1002220-14 = "[s] \"히나의 부탁이잖아. 당연히 기쁜 마음으로 달려왔다구!\""
1002220-15 = "아……."
1002220-16 = "……그렇구나. 선생님은 기쁜 마음으로 여기까지……."
1002220-17 = "……후훗."
1002220-18 = "[s1] \"수영이라면 빠삭하니까! 맡겨만 줘! 전력으로 임하겠습니다!\"\n[s2] \"수영에 대해선 잘 모르지만, 히나를 위해서라면 전력을 다할게!\""
1002220-19 = "그렇게 말해주니 무척 믿음직한걸."
1002220-20 = "그, 그래……?"
1002220-21 = "[s3] \"히나와 함께 배워간다는 마음가짐으로 노력할 테니까!\""
1002220-22 = "아……. 으, 으응."
1002220-23 = "선생님이 이렇게나 열정을 보여준다면 나도 지고 있을 수만은 없겠지."
1002220-24 = "일단 배우기 시작하면 선생님의 시간을 오래 빼앗지 않도록, 나도 열심히 노력할게."
1002220-28 = "이래 봬도 무언가를 배울 때 숙달하는 시간이 빠른 것 정도가, 내가 가진 몇 안 되는 장점 중 하나니까."
1002220-29 = "그럼 이러고 있을 게 아니라 얼른 바로……."
1002220-33 = "[ns] \"앗, 그건 곤란해!\""
1002220-34 = "응……? 곤란하다니……?"
1002220-35 = "[s4] \"오히려 금방 숙달하지 말고! 시간을 마음껏 빼앗아줘!\"\n[s5] \"진득하니 시간을 들이지 않으면, 마스터하기 어려울 테니까!\""
1002220-38 = "아니, 하지만 오늘처럼 귀중한 휴일에…… 같이 놀기 위해 만난 것도 아니고."
1002220-39 = "나 같은 애랑 교육으로 하루를 낭비하는 건 역시 시간이 아깝……."
1002220-40 = "[s] \"전혀 그렇지 않아! 히나랑 휴일을 함께할 수 있다니, 오히려 환영이니까!\""
1002220-41 = "……오히려 둘만의 오붓한 시간이야말로 바, 바, 바라던 바……라고?"
1002220-42 = "의심이 되면 이 자리에서 증명할 자신도 있다니……"
1002220-43 = "자, 잠깐! 나, 남들 눈에 띄니까. 역시 그, 그런 건 참아줘. 선생님."
1002220-44 = "……나 참, 당신이란 사람은 정말……."
1002220-45 = "……"
1002220-46 = "……푸훗."
1002220-47 = "그런 점이…… 역시나 당신답네."
1002220-48 = "알았어. 선생님. 그럼 오늘 하루 잘 부탁해."
1002220-49 = "[s] \"좋았어! 맡겨주시길!\""
1002220-50 = "그럼……."
1002220-57 = "가, 갑자기 무슨 짓입니까?!"
1002220-58 = "다, 다짜고짜 총을 쏘다니! 왜 이런 짓을 하는 거예요?!"
1002220-62 = "왜 이런 짓을 하냐고? 당연한 걸 묻는구만!"
1002220-63 = "우리는 말이지! 이 뜨거운 한여름! 알콩달콩한 녀석들을 보면 좀이 쑤셔서 견딜 수가 없단 말이다!"
1002220-64 = "난동을 부려주마!"
1002220-65 = "구체적으로는 알콩달콩한 모습을 보여주면서 염장을 지르는 녀석들에게 마음껏 훼방을 놔줄 테다!"
1002220-66 = "그런 제멋대로인 이유로?!"
1002220-71 = "[ns] \"히나, 저기……!\""
1002220-73 = "……선생님, 잠깐만 기다려 줘."
1002220-74 = "금방 끝내고 돌아올 테니까."
1002220-77 = "[ns] \"앗, 히나!\""
1002220-81 = "앙? 넌 뭐야?"
1002220-82 = "이 작은 체구에 은발 머리…… 잠깐, 이 녀석 설마?!"
1002220-86 = "우, 우와아아앗?!"
1002220-87 = "그, 그 유명한 게헨나의 선도부장이 왜 여기에?! 으아악?!"
1002220-94 = "(그렇게 소동을 일으키는 문제아들을, 히나는 그야말로 무자비하게 격퇴하였다.)"
1002220-97 = "가, 감사합니다! 도와주신 덕분에 아무 일도 없었어요!"
1002220-98 = "이걸 어떻게 감사 인사를 드려야 할지!"
1002220-99 = "……아니, 해야 할 일을 했을 뿐이니까."
1002220-101 = "(연신 감사 인사를 표하는 사람들을 돌려보낸 직후에.)"
1002220-106 = "[ns] \"고생했어. 히나.\""
1002220-108 = "아냐, 정말 별것도 아닌 일이었는 걸."
1002220-109 = "여름만 되면 괜한 혈기를 주체하지 못하고 날뛰는 애들은, 우리 학원에서도 몇 번이나 보아왔으니까."
1002220-110 = "이 정도는 늘 있는 일이라고 할지……."
1002220-111 = "[s] \"역시 게헨나의 선도부장!\""
1002220-112 = "나 참, 그런 게 아니래도……"
1002220-117 = "[ns] \"응? 히나, 방금 그 소리는…….\""
1002220-118 = "아. 튜브가…… 구멍이 난 모양이야."
1002220-119 = "[s] \"히나가 늘 가지고 다니던 그거……? 멀쩡한 튜브가 갑자기 왜…….\""
1002220-120 = "아무래도…… 아까 문제아들이랑 싸울 때, 총알이 스쳤나 봐."
1002220-121 = "내 판단미스야."
1002220-122 = "수영복 차림으로 문제아들과 싸울 땐 좀 더 주의할 필요가 있었을 텐데……."
1002220-123 = "이제까지 당연하다는 듯이 사용해 온 선도부 비품이라, 당연히 이번에도 문제없을 거라고 멋대로 방심해 버린 탓이야."
1002220-124 = "[s] \"그럼 히나 탓이 아니잖아.\""
1002220-125 = "아니, 선생님……."
1002220-126 = "망가진 건, 결국 내가 험하게 다뤘기 때문이니까."
1002220-127 = "어쩔 수 없지…… 이미 망가져 버린 건……."
1002220-128 = "…………"
1002220-129 = "[s] \"그럼 고치러 갈까?\""
1002220-130 = "고치러 간다니…… 튜브를?"
1002220-131 = "그건…… 어려워."
1002220-132 = "이래 봬도 이 튜브. 선도부 비품이라 특수소재로 만들어진 물건이거든."
1002220-133 = "학원으로 돌아가서 정비과에 찾아가지 않는 한 쉽게 고칠 수는 없을 거야."
1002220-134 = "……하필이면 선생님이 수영을 가르쳐준다고 한 타이밍에 이런 일이라니."
1002220-135 = "나란 애도 참…… 늘, 이런 식이라니까."
1002220-136 = "…………"
1002220-137 = "……차라리 잘된 걸지도 몰라."
1002220-138 = "[s] \"히나?\""
1002220-139 = "어렸을 때부터 써온 물건이긴 하지만, 마냥 언제까지고 평생 쓸 수는 없는 법이고."
1002220-140 = "나도……. 수영을 배우기 위해서라면 튜브는 졸업을 해야한다……라고 생각하고 있었어."
1002220-141 = "조금 아쉽긴 하지만…… 졸업, 해야겠지."
1002220-142 = "……응, 튜브가 없더라도 괜찮아."
1002220-143 = "그편이 수영 연습을 하는데 더 효율적, 일 테고……."
1002220-144 = "…………."
1002220-145 = "자, 선생님. 그럼 이 튜브는 버리고 같이 연습을 하러……."
1002220-146 = "[s] \"물론 수영 연습은 튜브 없이도 할 수 있어.\""
1002220-147 = "……응?"
1002220-148 = "[s] \"그리고 히나 말대로 언젠가는 졸업할 필요도 있을 거야.\""
1002220-149 = "선생님……?"
1002220-150 = "[s] \"하지만 그렇다고 반드시 그게 지금일 필요는 없잖아?\""
1002220-151 = "……! 그건……."
1002220-152 = "그렇다고는 해도……."
1002220-153 = "[s6] \"무엇보다 아직 보지 못했는걸! 히나와 함께 수영 연습을 하던 도중…….\"\n[s7] \"튜브 위에 앉아, 어쩔 줄 몰라 하는 히나의 귀여운 모습을 말이야!\""
1002220-156 = "서, 선생님?! 갑자기 무슨 소리를 하는 거야……?!"
1002220-157 = "진심으로 그런 말을 하는 거라면……… 나도 진심으로 화를 낼 거니까."
1002220-158 = "[ns] \"그, 그러니까! 방법을 찾아 보기도 전에 포기하진 말자는 이야기!\""
1002220-160 = "[ns] \"뭣보다 히나의 튜브. 어렸을 때부터 사용해 온…… 소중한 물건이잖아?\""
1002220-161 = "선생님……"
1002220-162 = "……하아. 차암."
1002220-163 = "당신은 늘 언제나 그런 식이네."
1002220-164 = "선생님이 그렇게까지 말해준다면……… 알았어."
1002220-165 = "[s8] \"좋아! 일단 주변을 둘러볼까? \"\n[s9] \"전력을 다해 고치는 거야!\""
1002220-169 = "(그렇게 히나를 설득한 끝에, 우리는 함께 튜브를 고칠 수 있는 곳을 찾아다니기 시작했다.)"
1002220-196 = "이거라면 제가 고칠 수 있구먼유."
1002220-197 = "……정말?"
1002220-198 = "게헨나의 신소재로 만들어진 물건이라니, 오히려 의욕이 불타는구먼유!"
1002220-199 = "그럼……."
1002220-200 = "[s] \"부디! 잘 부탁드립니다!\""
1002220-208 = "(그렇게 튜브의 수리를 무사히 마칠 수가 있었다.)"
1002220-213 = "이것으로 끝이구먼유!"
1002220-214 = "[s] \"감사합니다!\""
1002220-215 = "고, 고마워……."
1002220-216 = "아뇨! 저야말로 새롭게 배웠습니다요! 그럼!"
1002220-222 = "[ns] \"휴우, 히나! 다행이네!"
1002220-223 = "아, 응, 그러게. 정말로…… 여기서 바로 고친 거구나……."
1002220-224 = "꼼짝없이 망가졌으니 어쩔 수 없다고 생각했는데……."
1002220-225 = "……고마워. 선생님."
1002220-226 = "[s] \"별말씀을.\""
1002220-230 = "하지만…… 튜브를 고치러 돌아다니는 사이에 벌써 시간이 이렇게……."
1002220-231 = "………오늘 어울려 줘서 고마웠어. 선생님."
1002220-232 = "직접 불러낸 주제에 이런 말을 하긴 좀 그렇지만, 시간도 늦었으니 이만……."
1002220-233 = "[s] \"아니, 히나. 아직 끝나지 않았어.\""
1002220-234 = "……어?"
1002220-235 = "[s10] \"약속했지?\"\n[s11] \"튜브를 고치는 것도, 수영 수업을 하는 것도 전부 전력을 다하겠다고.\""
1002220-240 = "[ns12] \"그러니 시간은 좀 늦었을지 모르지만……\"\n[ns13] \"수영 수업을 해도 괜찮을까?\""
1002220-241 = "아……."
1002220-242 = "아……."
1002220-243 = "당신은 여전히…… 나를 위해……."
1002220-249 = "응."
1002220-250 = "당신만 괜찮다면 얼마든지……."
1002220-255 = "나도 전력을 다해, 언제까지고 당신에게 배울 테니까."
1002220-260 = "(그 후 밤이 무르익고 달이 저편으로 기울 때까지 히나와 바닷가에서 수영을 함께 했다.)"
