[translation]
90001080-1 = "제8화;호크마"
90001080-11 = "저쪽에 출구가 보입니다! 선생님, 히마리 부장, 서둘러 주십시오!"
90001080-12 = "문이 잠겨 있어……. 브리칭 들어갈게!"
90001080-20 = "[ns] \"어……?\""
90001080-22 = "이건……."
90001080-23 = "……그러니까……. 우리가 툰드라에서 봤던……."
90001080-24 = "그 화산의, 내부……?"
90001080-25 = "[s] \"길을 따라왔더니, 화산 내부에 도착했다는 거야?\""
90001080-26 = "잠깐, 리오. 정말 여기가 맞나요?"
90001080-27 = "……최선의 판단이었다고 생각해. 지금도 산 위쪽에는 오히려 병력의 움직임이 없어."
90001080-33 = "화산…… 고열 지대…… 거기에 등산……."
90001080-34 = "더 더워졌어……. 어떻게 할 거야, 선생님. 책임져."
90001080-35 = "[s] \"그래도 평소 복장보다는, 지금이 나은 게 아닐까……?\""
90001080-36 = "그건 분명 그렇지만……."
90001080-37 = "너무 더워……."
90001080-44 = "후우. 상황과는 별개로, 이제 좀 살 것 같네요."
90001080-45 = "지금이라도 헬기로 돌아가 에어컨을 틀고 싶어……."
90001080-46 = "헬기를 무슨 냉장고처럼 취급하지 말아 주시겠어요……?"
90001080-50 = "조금 더 위로 올라왔습니다만…… 시추 시설의 숫자가 상당히 늘어나 있는 것처럼 보입니다."
90001080-51 = "그러네. 마치 본격적으로 채광을 하고 있었던 장소가, 이 산이었다는 것처럼."
90001080-52 = "(빙해, 툰드라, 그리고 화산 지대…… 이만한 규모로 자원을 확보해서, 어디에 사용하려는 것일까요?)"
90001080-53 = "(역시 <군수 공장>을 담당하는 <헤세드>에게? 아뇨, 그렇다고 보기에는……)"
90001080-54 = "저기, 에이미의 상태가 어딘가 좋지 않은 것처럼 보이는데…… 괜찮아?"
90001080-55 = "……."
90001080-60 = "역시, 이젠 한계."
90001080-61 = "만일…… 내가…… 이대로 어떻게 되면……."
90001080-62 = "무덤에는 아이스크림 하나…… 아니…… 한 상자를 놓아줘……."
90001080-63 = "아뇨, 지금 당신이 여기에서 그런 말을 하면, 농담으로 안 들리니까 말이죠……?"
90001080-64 = "그렇지만 적들의 추격은 멈춘 것 같아. 거기에서 잠시 머물러도 되겠어."
90001080-65 = "……추격이 멈췄다고요?"
90001080-66 = "그래. 드론과 AMAS로 주위를 정찰 중이지만, 너희를 쫓는 데카그라마톤의 병력은 현재로선 없어."
90001080-67 = "그건 다행스러운 일이지만, 한 편으로는 어딘가 불길하게 들리기도 하는 말이네요."
90001080-68 = "어떤 점에서?"
90001080-69 = "가령 이렇게 생각해 볼 수 있겠죠. 혹시 이 근처에 병력이 접근해서는 안 되는 무언가가 있는 걸까요?"
90001080-70 = "아니면 병력이 접근할 필요가 없는 무언가가?"
90001080-72 = "그 답은, 놀랍게도 둘 다랍니다~"
90001080-76 = "[ns] \"이건…… 이 목소리는!\""
90001080-78 = "요, 용케 여기까지 당도하셨군요……. 아니, 와, 왔군요……!"
90001080-79 = "어차피 그것도 모두 헛수고가 되겠지만 말이지!"
90001080-80 = "솔직히 대단해요. 축하할 만한 일이죠."
90001080-81 = "그, 그, 그렇지만 그것도…… 이걸로 끝이에요!"
90001080-82 = "에헤헤. 제대로 말했어요……!"
90001080-83 = "[s] \"우리를 지켜보고 있었던 거야?\""
90001080-84 = "다, 당연한 거예요. 그곳, 툰드라 지대에 도착했을 때부터……."
90001080-85 = "애초에 우리 아이들과 교전했잖아? 그 사실을 우리가 모를 리 없잖아?"
90001080-86 = "이런, 이런. 이렇게 당연한 부분까지 이야기해 줘야 하다니, 조금 실망이네요. 역시 인간이라고 할까요."
90001080-87 = "아, 아무튼! 그, 그것도, 마지막이에요……! 여기서, 여기서……!"
90001080-88 = "응. 아인의 말대로, 이만 마무리를 짓도록 하자고."
90001080-89 = "뭐, 우리들에게 항복해 온다면, 받아주지 못할 것도 없기는 합니다만? 특별히 자비심을 베풀어서 말이죠? 가엾게 여기는 마음으로요?"
90001080-90 = "[s1] \"그런데 뭘 알아야 항복하든 말든 할 수 있는 게 아닐까?\"\n[s2] \"너희는 뭘 하려는 거야?\""
90001080-93 = "이, 이야기해 드려도…… 되는, 걸까요?"
90001080-94 = "으음…… 자세한 부분까지는 무리겠지만, 이야기할 수 있는 것만 이야기해 보는 건 괜찮지 않을까요. 어때요, 소프?"
90001080-95 = "뭐, 그래. 우리는 모든 것을 새롭게 만들고, 새 토대를 쌓을 거야. 그리고 그건 어떤 의미에서……."
90001080-96 = "……당신들을 위한 일이라고도, 할 수 있겠지."
90001080-97 = "다, 다시 마, 말씀드리자면 우리는, 당신들에게…… 어떤, 모범적이고 완전한 답안을, 제시해 드리고 싶어요."
90001080-98 = "네, 네, 네. 모두 집중. 여기 중요한 부분이라고요."
90001080-99 = "이런 겁니다. 어떤 결정을 내리는 게 맞는지, 뭐가 최선인지 모를 때가 있지 않나요?"
90001080-100 = "그러니까 이제부터는 우리가 자비로움을 발휘해서……."
90001080-101 = "그런 고민 자체를 하지 않게 해 드리죠!"
90001080-102 = "오르가 말을 막 던지는 느낌이 있지만…… 아무튼, 그게 그분의 존재 의의이기도 했으니까."
90001080-107 = "어머나. SF 영화에 나올 법한 전형적인 악당 같은 소리를 하고 있군요."
90001080-108 = "더 들을 것도 없겠네. 애초에 떳떳한 일이었다면, 숨기는 것 없이 모두 이야기했겠지."
90001080-109 = "그렇습니다. 보통 이렇게 모두를 위한 일이라거나 모든 것을 새롭게 만든다거나 하는 일은, 변변치 않은 일이기 마련이라고 들었습니다."
90001080-110 = "너, 너무해요!"
90001080-111 = "……지금 발언은, 솔직히 조금 화나긴 하네."
90001080-112 = "그렇지만, 뭐. 여기까지도 예상한 범위 안이기는 합니다."
90001080-117 = "너희들이 그 말로만 들었던, 데카그라마톤의 엔지니어들이구나."
90001080-118 = "……츠카츠키, 리오."
90001080-119 = "츠카츠키 리오."
90001080-120 = "나타났군요. 우리의 새로운 변수."
90001080-121 = "……왜 이제 와서 모습을 드러낸 거지? 아니, 그것도 어떻게 보면 무의미한 질문이겠네."
90001080-122 = "애초에 그분의 존재를 처음 인지하고, 감히 그 뒤를 쫓으려 했던 것은 당신이었으니."
90001080-123 = "당신이 마지막으로 모습을 드러냈던 것은, 키보토스의 하늘이 무너지려 했던 그날이었죠……."
90001080-124 = "언제나 그랬던 것처럼, 쭉 그늘진 곳 어딘가에 틀어박혀 있었으면 될 텐데."
90001080-125 = "확실히, 나를 그렇게 평가해도 어쩔 수 없겠네. 그 점은 인정할게."
90001080-126 = "그보다 의외로 나에 대해 잘 알고 있는 것 같은데?"
90001080-127 = "모, 모든 가능성에 대비하는 것이 우리들의 일이니까요……!"
90001080-128 = "그, 그그, 그러니까! 이제부터는 호크마 쨩이…… 모든 것을 원래대로 되돌릴 거예요!"
90001080-133 = "[ns3] \"땅이……?\"\n[ns4] \"화산의 상태가, 뭔가 심상치 않아……!\""
90001080-137 = "선생. 지금 막 갑작스럽게 화산이 활성화되기 시작했어."
90001080-138 = "거기에……!"
90001080-148 = "[ns] \"또 무슨 일이라도 있어?!\""
90001080-149 = "새로운 예언자의 신호예요!"
90001080-150 = "나도 포착했어. 이 신호는? 설마…… <호크마>……?!"
90001080-151 = "[s] \"<호크마>……?\""
90001080-156 = "호크마! 생명의 나무의 두 번째 세피라!"
90001080-157 = "왕국을 지키는 고대의 수호자!"
90001080-158 = "비, 빛을 비추는 지성! 그리고 감추어진 지혜!"
90001080-159 = "변수는 언제나 귀찮은 요소죠. 그러니 호크마로 이곳의 화산을 완전히 분화시켜."
90001080-164 = "최대의 변수인 샬레의 선생님을, 확실하게 처리해 둘 거야!"
90001080-165 = "그리고 그다음은 물론 츠카츠키 리오, 당신이 될 거고요."
90001080-166 = "……괜찮지, 아인?"
90001080-167 = "……."
90001080-168 = "……네. 언니를, 위해서라면……."
90001080-169 = "거기에 우리의 제안을 먼저 거절한 건, 저쪽이기도 했으니 말이죠."
90001080-170 = "그…… 그랬었죠. 알겠어요. 네!"
90001080-177 = "[ns] \"저게…… 뭐야?!?!\""
90001080-179 = "말도 안 돼요! 용암 위에 저런 게……? 이건 무슨 초현상인가요?"
90001080-180 = "생각해 보면 우리가 원래 그런 초현상을 탐색하는 동아리이긴 했는데."
90001080-181 = "그 초현상과 이 초현상은 조금 결이 다르다고 생각하는데요?!"
90001080-183 = "(이 신호는, <이름 없는 신>들의……?)"
90001080-188 = "게부라는 믿음직하지. 다혈질이기는 하지만, 동시에 주도면밀하니까. 그래서 빙해 지역의 초계를 맡긴 거였고."
90001080-189 = "여러분을 여기까지 유인한 것도, 모두 게부라의 작전이었고요~?"
90001080-190 = "호, 호크마가 자리를 잡은, 요, 용암 안에서라면 아무리 대단한 선생님이라도……. 그리고 츠카츠키 리오라도, 방법이 없겠, 지요!?"
90001080-191 = "이, 이즈미모토 에이미는 더위에 약하고, 아스마 토키의 아비 에슈흐는 저, 정비가 필요한 상황일 테니……!"
90001080-192 = "지금까지 거의 휴식도 없이 싸워 오기만 했잖아? 이제 여러 가지 의미로 쉴 때가 되지 않았을까?"
90001080-193 = "그러니까 저희가 아주 조금 도와드리겠다는 겁니다. 어떤 휴식은 그 기간이 영원한 것일 수도 있고요~?"
90001080-199 = "……저런 종류의 적을 상대하는 데에, 반드시 세밀하고 정교한 작전과 작업만이 필요한 것은 아니야."
90001080-200 = "[s] \"어쩌려는 거야. 리오?\""
90001080-211 = "사용 가능한 AMAS를 모두 활용하겠어. 현장 시설의 잔해로 방어선과 구조물을 구축할게."
90001080-212 = "제대로 된 것을 준비하기엔 다소 시간이 부족하겠지만. 원시적인 상대에게는, 때로 그에 상응하는 수단이 필요한 법이니까."
90001080-213 = "저것은……?"
90001080-214 = "그렇군요. 저것이라면 분명히……."
90001080-219 = "[ns] \"고마워, 리오!\""
90001080-224 = "(그렇지만 조금 전, 최대의 변수인 선생님을 확실하게 처리해 둘 거라고, 데카그라마톤의 엔지니어들은 말했죠.)"
90001080-225 = "(선생님의 존재가, 그 정도로 자신들에게 위협이 된다고 상정하고 있다는 뜻……?)"
90001080-230 = "선생님?"
90001080-231 = "[s] \"저 아이들이 무엇을 생각하고, 준비하는지는 모르겠지만.\""
90001080-235 = "[ns] \"일단은, 눈앞에 닥친 일부터 해결하자!\""
90001080-236 = "그러면 이번에는 정말로 에어컨 틀어 주는 거지?"
90001080-237 = "[s] \"……열 시간이라도 틀어 줄게!\""
90001080-238 = "고마워, 선생님. 그래서 좋아해."
90001080-239 = "저기, 그러다 헬기 연료가 전부 떨어질 수도 있을 텐데요……?"
90001080-246 = "응전, 준비하겠습니다."
90001080-248 = "그러면, 여러분. 슬슬 본격적으로 각오해 주시죠."
90001080-249 = "여기까지 몰아세우는 것도 꽤나 고생스러운 일이었다구~?"
90001080-250 = "부, 부탁할게요. 호크마 쨩!"
90001080-251 = "츠카츠키 리오가 뭐, 뭔가를 준비한 것 같지만, 그 정도는, 호크마 쨩에게는, 아무 문제도 되지 않을 테니까요……!"
90001080-256 = "[ns] \"모두, 조심해!\""
