10056040-73 = "[s] \"따개비?\""
10056040-74 = "3;아미;00;네. 따개비 유생은 바다 속을 부유하다 배의 바닥에 붙어 성장하는데……"
10056040-75 = "3;아미;20;다 자란 따개비는 배를 부식시키고, 항해를 방해하기 때문에 주기적으로 청소해 주어야 하거든요."
10056040-76 = "3;아미;04;게다가 지금처럼 배가 움직이지 않을 때는 더욱 따개비가 자주 달라붙는지라.\n#3;stiff"
