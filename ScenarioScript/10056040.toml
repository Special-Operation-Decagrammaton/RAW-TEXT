10056040-1 = "#title;제4화;따개비와 폭탄"
10056040-3 = "#na;코코로;서, 설마 저희가 할 일이라는게……"
10056040-4 = "#na;코코로;선저 청소였나요?!\n#zmc;instant;0,0;2000\n#fontsize;80\n#bgshake"
10056040-5 = "3;코코로;04\n#3;a"
10056040-6 = "#place;오디세이아 정박지"
10056040-7 = "[ns1] \"응. 아일랜드에서 배의 청소를 부탁하고 싶다고 해서.\"\n[ns2] \"배바닥을 청소하는 건 다이빙부만 가능한 일이라던데.\""
10056040-10 = "3;코코로;10;일단은 잠수를 해야 하니, 틀린 말은 아니지만요……"
10056040-11 = "3;코코로;06;우으, 우으으…… 선저 청소는 싫은데……\n#3;stiff\n#3;em;[세로선]"
10056040-12 = "[s] \"……뭔가 내가 곤란한 부탁을 했으려나?\""
10056040-13 = "3;코코로;11;……아뇨. 곤란한 일은 아니에요."
10056040-14 = "3;코코로;12;다만 배 바닥은 지독한 냄새가 나고 청소도 힘들어서 꺼리고 있었던 것뿐이라.\n#3;m2"
10056040-15 = "3;코코로;10;……빚을 진 이상 일을 가릴 때가 아니지만요.\n#fontsize;50\n#3;stiff"
10056040-16 = "#st;[0,0];instant;1;"
10056040-18 = "3;코코로;07\n#3;em;[한숨]\n#wait;1500"
10056040-19 = "3;코코로;01;다들 각오는 되었겠지?\n#3;m3"
10056040-20 = "3;코코로;02;작업에서 제일 중요한 건 첫째도 안전, 둘째도 안전이니까…… 무조건 2인 1조로 잠수하고 수시로 납 벨트의 상태를 확인할 것!\n#3;jump"
10056040-21 = "3;코코로;05;육상과 연락할 수 있는 수단은 무조건 두 가지 이상으로 준비하고, 신호 부이가 제대로 팽창하는지도 미리 확인해야 하고, 탱크 잔압은 5분 간격으로 계속 확인하고…… 아, 그리고 수초나 라이프 라인에 걸렸을 때를 대비해 다이빙 나이프도 꼭 챙겨서—"
10056040-22 = "#st;[0,0];instant;1;"
10056040-24 = "3;코코로;05\n#3;d\n#wait;1000"
10056040-25 = "5;코토네;01\n1;사유리;01\n3;마키나;01\n#1;h\n#3;h\n#5;h\n#1;a\n#3;a\n#5;a\n#wait;1000"
10056040-26 = "5;코토네;01\n1;사유리;01\n3;마키나;03;걱정 마, 부장. 우리가 이런 일 한 두 번 하는 것도 아니고.\n#3;hophop\n#3;em;[재잘]"
10056040-27 = "5;코토네;02;평소처럼 나와 부장이, 마키나와 사유리가 버디를 짜면 될 것 같네."
10056040-28 = "1;사유리;21;수중 작업 때 장갑을 끼면 손이 둔해져서 싫은데……\n#1;em;[속상함]"
10056040-29 = "1;사유리;14;부장, 나는 맨 손으로 작업하면 안 돼?"
10056040-30 = "3;코코로;04;안 돼! 선저에 날카로운 부분이 얼마나 많은데!\n#1;hide\n#5;hide\n#3;closeup\n#fontsize;80"
10056040-31 = "3;코코로;05;자칫 작업 중에 손이라도 베여서 세균 감염이 된다면, 단순히 아물지 않는 것을 넘어 패혈증으로 발전해서 고열에 시달리다가 장기 손상으로 이어질 수도—\n#3;closeup\n#3;stiff"
10056040-32 = "5;코토네;10\n1;사유리;13\n3;마키나;04\n#1;h\n#3;h\n#5;h\n#1;a\n#3;a\n#5;a"
