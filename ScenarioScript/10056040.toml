10056040-39 = "3;아미;00\n#3;a\n#wait;1000"
10056040-40 = "3;아미;02;……갑자기 필요한 선저 작업이 없는지 문의를 해오셨을 때는 무슨 생각이신가 싶었습니다만.\n#3;em;…"
10056040-41 = "3;아미;08;역시 예상한대로 다이빙부의 재무 현황에는 큰 문제가 있었군요."
10056040-42 = "3;아미;07;특별한 수입원이 없다는 사실은 파악하고 있었지만, 설마 장비의 유지 보수를 위해 빚까지 내고 있었을 줄이야……\n#3;em;[한숨]"
10056040-43 = "3;아미;23;계속 방치했더라면 다이빙부는 물론이고, 오디세이아 학원 입장에서도 곤란한 상황이 발생할 뻔 했습니다."
10056040-44 = "3;아미;01;조속히 조치해 주셔서 감사합니다.\n#3;greeting"
10056040-45 = "[s3] \"아냐. 어려운 일도 아니었는 걸.\"\n[s4] \"아미도 다이빙부의 일자리를 바로 알선해줘서 고마워.\""
10056040-48 = "3;아미;02;아뇨. 저희야 말로 부탁드리고 싶던 참이었습니다.\n#3;em;[반응]"
10056040-49 = "3;아미;00;오디세이아의 대부분 학생들이 선상 활동을 주로 하는 지라 자주 간과되지만, 바다와 접해 있는 배의 바닥— 선저야 말로, 배가 가라앉지 않도록 보호해 주는 가장 중요한 부위니까요.\n#3;m4"
10056040-50 = "3;아미;23;선저 정비를 수시로 하지 않으면 사고가 날 가능성도 높기에, 오디세이아 학원에서는 주기적으로 배를 건선거에 들여 정비를 하고 있습니다만……"
10056040-51 = "3;아미;00;배를 선거에 넣고 빼는 데에는 시간이 오래 걸리거든요."
10056040-52 = "3;아미;01;하지만 다이빙부의 도움이 있다면 배를 건선거에 넣지 않고도 쉽게 바닥을 확인할 수 있으니, 큰 도움이 될 겁니다.\n#3;m3"
10056040-55 = "3;코토네;01\n#3;a\n#3;greeting\n#wait;1000"
10056040-56 = "3;코토네;02;……작업 30분 경과."
10056040-57 = "3;코코로;01;이만하면 충분한가."
10056040-58 = "3;코코로;00;좋아. 지금부터 약 1시간 정도 휴식할게.\n#3;em;[음표]"
