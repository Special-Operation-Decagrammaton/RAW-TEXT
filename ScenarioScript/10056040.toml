10056040-67 = "2;사유리;21;정어리 비린내랑 따개비 비린내는 다르거든.\n#2;hophop"
10056040-68 = "2;사유리;21\n4;마키나;02\n1;코코로;03;수고했어. 다음 번에는 나와 코토네가 들어갈게.\n#1;ar\n#2;m3\n#4;m5"
