[translation]
10056040-1 = "제4화;따개비와 폭탄"
10056040-3 = "서, 설마 저희가 할 일이라는게……"
10056040-4 = "선저 청소였나요?!"
10056040-6 = "오디세이아 정박지"
10056040-7 = "[ns1] \"응. 아일랜드에서 배의 청소를 부탁하고 싶다고 해서.\"\n[ns2] \"배바닥을 청소하는 건 다이빙부만 가능한 일이라던데.\""
10056040-10 = "일단은 잠수를 해야 하니, 틀린 말은 아니지만요……"
10056040-11 = "우으, 우으으…… 선저 청소는 싫은데……"
10056040-12 = "[s] \"……뭔가 내가 곤란한 부탁을 했으려나?\""
10056040-13 = "……아뇨. 곤란한 일은 아니에요."
10056040-14 = "다만 배 바닥은 지독한 냄새가 나고 청소도 힘들어서 꺼리고 있었던 것뿐이라."
10056040-15 = "……빚을 진 이상 일을 가릴 때가 아니지만요."
10056040-19 = "다들 각오는 되었겠지?"
10056040-20 = "작업에서 제일 중요한 건 첫째도 안전, 둘째도 안전이니까…… 무조건 2인 1조로 잠수하고 수시로 납 벨트의 상태를 확인할 것!"
10056040-21 = "육상과 연락할 수 있는 수단은 무조건 두 가지 이상으로 준비하고, 신호 부이가 제대로 팽창하는지도 미리 확인해야 하고, 탱크 잔압은 5분 간격으로 계속 확인하고…… 아, 그리고 수초나 라이프 라인에 걸렸을 때를 대비해 다이빙 나이프도 꼭 챙겨서—"
10056040-26 = "걱정 마, 부장. 우리가 이런 일 한 두 번 하는 것도 아니고."
10056040-27 = "평소처럼 나와 부장이, 마키나와 사유리가 버디를 짜면 될 것 같네."
10056040-28 = "수중 작업 때 장갑을 끼면 손이 둔해져서 싫은데……"
10056040-29 = "부장, 나는 맨 손으로 작업하면 안 돼?"
10056040-30 = "안 돼! 선저에 날카로운 부분이 얼마나 많은데!"
10056040-31 = "자칫 작업 중에 손이라도 베여서 세균 감염이 된다면, 단순히 아물지 않는 것을 넘어 패혈증으로 발전해서 고열에 시달리다가 장기 손상으로 이어질 수도—"
10056040-40 = "……갑자기 필요한 선저 작업이 없는지 문의를 해오셨을 때는 무슨 생각이신가 싶었습니다만."
10056040-41 = "역시 예상한대로 다이빙부의 재무 현황에는 큰 문제가 있었군요."
10056040-42 = "특별한 수입원이 없다는 사실은 파악하고 있었지만, 설마 장비의 유지 보수를 위해 빚까지 내고 있었을 줄이야……"
10056040-43 = "계속 방치했더라면 다이빙부는 물론이고, 오디세이아 학원 입장에서도 곤란한 상황이 발생할 뻔 했습니다."
10056040-44 = "조속히 조치해 주셔서 감사합니다."
10056040-45 = "[s3] \"아냐. 어려운 일도 아니었는 걸.\"\n[s4] \"아미도 다이빙부의 일자리를 바로 알선해줘서 고마워.\""
10056040-48 = "아뇨. 저희야 말로 부탁드리고 싶던 참이었습니다."
10056040-49 = "오디세이아의 대부분 학생들이 선상 활동을 주로 하는 지라 자주 간과되지만, 바다와 접해 있는 배의 바닥— 선저야 말로, 배가 가라앉지 않도록 보호해 주는 가장 중요한 부위니까요."
10056040-50 = "선저 정비를 수시로 하지 않으면 사고가 날 가능성도 높기에, 오디세이아 학원에서는 주기적으로 배를 건선거에 들여 정비를 하고 있습니다만……"
10056040-51 = "배를 선거에 넣고 빼는 데에는 시간이 오래 걸리거든요."
10056040-52 = "하지만 다이빙부의 도움이 있다면 배를 건선거에 넣지 않고도 쉽게 바닥을 확인할 수 있으니, 큰 도움이 될 겁니다."
10056040-56 = "……작업 30분 경과."
10056040-57 = "이만하면 충분한가."
10056040-58 = "좋아. 지금부터 약 1시간 정도 휴식할게."
10056040-65 = "비린내~"
10056040-66 = "사유리, 비린내 좋아하는 거 아니었어? 정어리 아이스크림을 입에 달고 살기에 비린내를 못 맡나 했는데."
10056040-67 = "정어리 비린내랑 따개비 비린내는 다르거든."
10056040-68 = "수고했어. 다음 번에는 나와 코토네가 들어갈게."
10056040-69 = "벌써 지쳤어……"
10056040-71 = "[ns] \"그나저나 다들 배 밑에서 무얼 닦아내는 거야?\""
10056040-72 = "지금 선저 표면에서 긁어내고 있는 것은 따개비입니다."
10056040-73 = "[s] \"따개비?\""
10056040-74 = "네. 따개비 유생은 바다 속을 부유하다 배의 바닥에 붙어 성장하는데……"
10056040-75 = "다 자란 따개비는 배를 부식시키고, 항해를 방해하기 때문에 주기적으로 청소해 주어야 하거든요."
10056040-76 = "게다가 지금처럼 배가 움직이지 않을 때는 더욱 따개비가 자주 달라붙는지라."
10056040-77 = "[s] \"곤란한 일이네.\""
10056040-78 = "네, 정말로 곤란하기 짝이 없습니다."
10056040-80 = "저기, 마키나."
10056040-81 = "이 따개비…… 수중 그라인더로 한 번에 날려버리면 안 돼?"
10056040-82 = "부장이 끌 이외에 다른 장비는 쓰지 말라고 했잖아?"
10056040-83 = "하지만 끌이랑 그라인더는 원리도 다르지 않잖아?"
10056040-84 = "무선 그라인더라 감전 위험도 없어."
10056040-85 = "으음……"
10056040-86 = "뭐, 문제없겠지. 효율성을 추구하는 것도 작업의 일환이니까."
10056040-87 = "그럼 사유리. 거기 있는 그라인더 좀 이리 가져다 줘."
10056040-88 = "오케이~"
10056040-90 = "[ns] \"따개비를 먹을 수는 없나?\""
10056040-91 = "글쎄요. 돌에 붙은 따개비라면 몰라도 배에 붙은 따개비는 독성이 있어서 먹지 않는 게 좋다고 들었습니다만."
10056040-92 = "애초에 개펄을 잔뜩 머금어서 냄새도 고약하니……"
10056040-93 = "배에 붙은 따개비를 좋아하는 건 해적 밖에 없지 않을까요?"
10056040-94 = "[s] \"해적?\""
10056040-95 = "네. 일전에 들은 소문에 의하면, 중세의 해적은 배 바닥에 붙은 따개비를 사용해서 죄수를 고문했다고 합니다."
10056040-96 = "<조수의 교룡>도 비슷한 방법으로 사람을 협박한다고—"
10056040-100 = "아. 실례를."
10056040-101 = "[s5] \"그 전부터 궁금했던 건데……\"\n[s6] \"조수의 교룡이 누구야?\""
10056040-107 = "……말씀드리기 부끄럽습니다만, 저희 학원에도 문제아는 존재하는 바."
10056040-108 = "수년 전. 저희 학원에서 교화가 불가능하다고 판단되어, 발키리 경찰학교의 교정국으로 인계한 학생이 있습니다."
10056040-109 = "바람 한 점 없는 잔잔한 바다에서도 파도를 마음대로 타고 다녀 <조수의 교룡>이라고 불리었지만, 행동거지에 치명적인 문제가 하나 있었지요."
10056040-110 = "[s] \"어떤 문제였는데?\""
10056040-111 = "그녀는 다른 학생들을 꾀어, 스스로를 용궁의—"
10056040-117 = "쾅!"
10056040-118 = "[ns7] \"바, 방금 무슨 일이야?\"\n[ns8] \"뭔가 폭발했어……?\""
10056040-122 = "부장, 큰일이야!"
10056040-123 = "다, 다들 괜찮아?! 무슨 일이야!"
10056040-127 = "따개비가 폭발했어—"
10056040-128 = "따, 따개비가 폭발했다고……?"
10056040-129 = "작업 중에 다른 도구 쓴 거 아니야?"
10056040-130 = "음, 그게 그러니까……"
10056040-131 = "끌로 제거하는 데에는 한계가 있어서 수중 그라인더를……"
10056040-132 = "……마키나."
10056040-133 = "하, 하지만 따개비가 폭발한 건 사실이라고!"
10056040-137 = "트라이던트, 지금 바로 제7 부두로 손상통제팀을 보내주세요."
10056040-138 = "네, 함선 하부구역에 천공이 발생했습니다. 손상은 경미합니다만……"
10056040-139 = "기재태세를 Z 태세로 전환. 모든 해치 및 도어를 차단합니다."
10056040-149 = "망했다……."
