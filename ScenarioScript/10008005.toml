[translation]
10008005-1 = "프롤로그;흥신소의 평범한 연말"
10008005-6 = "자자, 모두 집중해!"
10008005-7 = "공지사항이 있으니까."
10008005-14 = "모두 알다시피 어느덧 벌써, 새로운 해가 찾아왔어."
10008005-15 = "아~ 벌써 그렇게 됐네~ 시간도 참 빠르다니까."
10008005-16 = "후후후……. 돌아보면 작년에도 정말 많은 일들이 있었지?"
10008005-17 = "기쁜 일과 괴로운 일, 또 슬픈 일과 안타까운 일도 잔뜩……."
10008005-18 = "아루 쨩, 생각해보면 괴로운 일만 있었던 거 같은데?"
10008005-19 = "……."
10008005-20 = "어, 어쨌거나! 중요한 건 흥신소가 그러한 역경을 무사히 뛰어넘어 새로운 한 해를 맞이하게 되었다는 사실이야!"
10008005-21 = "그러니 그걸 기념해서 지금부터 우리는 특별한 장소를 찾아갈 거야."
10008005-22 = "트, 특별한 장소요?"
10008005-23 = "이렇게 차려입고 새벽에 모이라고 한 걸 보면, 뭐, 새해맞이 행사 때문이겠지."
10008005-25 = "후후. 예리하군, 카요코 과장. 하지만 그것만 있는 건 아니란 말씀."
10008005-27 = "우리가 가는 곳은 평범한 곳이 아니야. 무려 '소원을 빌면 이루어진다' 로 유명한 곳이거든."
10008005-28 = "소, 소원을 빌면 이루어지……는 곳인가요?"
10008005-30 = "아, 그거~ 요즘 SNS에서 한창 핫하기로 유명한 그 행사장 말하는 거지?"
10008005-31 = "SNS에서 유명하다니 대놓고 수상하잖아……."
10008005-32 = "그냥 미신 아냐? 아니면 단순한 상술이거나."
10008005-33 = "뭐~ 아루 쨩은 은근 그런 거 좋아하니까~?"
10008005-34 = "뭐? 나도 따, 딱히 믿거나 하는 건 아니거든?! 거기 가는 건 좀 더 다른 목적이 있다고?!"
10008005-35 = "다른 목적?"
10008005-36 = "훗. 그래."
10008005-37 = "비밀이지만, 우리 흥신소 68이 좀 더 번창하기 위해서 반드시 필요한 일이라는 것만 알아둬."
10008005-38 = "……점점 더 수상한 느낌밖에 안 드는데."
10008005-39 = "또 혼자서 이상한 계획을 짜고 있어, 아루 쨩……."
10008005-40 = "에이잇! 자세한 건 됐어!"
10008005-41 = "그보다 내가 말한 건 다들 준비했겠지?"
10008005-43 = "뭐, 해놨지~? 거액의 현금을 준비하라고 했잖아?"
10008005-44 = "사장의 명령이니까. 일단은."
10008005-45 = "저, 저도 준비했어요! 아루 님!"
10008005-47 = "후후후, 그래."
10008005-48 = "나의 목적을 이루기엔 반드시 필요한 거니까, 잊어버리지 말고 잘 간수하고 있으라고."
10008005-54 = "……설마? 사장……?"
10008005-55 = "……아루 쨩, 설마 이 현금으로 사업 번창 소원을 빌겠다는 계획……?"
10008005-56 = "그, 그렇군요!! 소원을 빌면 이루어지는 곳이니까, 엄청난 금액의 새전을 넣어서 그만큼 더 큰 사업번창을 노리시는 거군요!?"
10008005-58 = "뭐?! 아, 아니야! 그런 게 아냐!! 날 뭘로 생각하는 거야!!"
10008005-60 = "휴…… 난 또……."
10008005-61 = "하아……."
10008005-63 = "핵심은! 그 행사장에 엄청나게 많은 암흑가의 거물들이 참석한다는 거야!!"
10008005-64 = "거, 거물들요?"
10008005-65 = "그래. 폭력 조직들이나, 불법을 일삼는 집단, 검은돈을 유통시키는 회사까지! 어마어마한 악당들이 한곳에 모이는 거야. 새해맞이 행사를 핑계로!"
10008005-66 = "과연 그런 녀석들이 거기에 모여서 사이좋게 새해 덕담이나 나눌 거 같아?"
10008005-67 = "노노! 전혀! 네버! 절대 그럴 리가 없지! 거기 모인 거물들의 진짜 목적은 분석이야!"
10008005-68 = "분석……?"
10008005-69 = "이번에 서로가 새전은 얼마나 했고, 각자 걸치고 있는 옷은 얼마나 비싼 거며……. 갖은 정보를 통해 서로를 평가하고 분석하는 각축장이 열리는 거지!"
10008005-70 = "그걸 통해 서로의 세력을 파악하고 데이터를 축적해, 앞으로 일 년간의 계획을 세우는 거야!"
10008005-71 = "저 녀석……. 저 정도의 새전을 하다니. 올해는 주의해야겠군……. 같은 식으로!"
10008005-73 = "헤에. 그렇다는 건 결국……."
10008005-74 = "사장이 이렇게 비싼 기모노까지 빌리고 새전으로 거액의 현금까지 준비하라고 한 건……."
10008005-75 = "그래! 이건 그 녀석들에게 우리 흥신소의 존재감을 각인시킬 기회라는 거야!!"
10008005-76 = "아아……. 응."
10008005-77 = "이, 이해했어요! 정말 멋진 계획이에요. 아루 님! 이런 계획은 아루 님밖에 생각하지 못할 거예요!"
10008005-78 = "아니, 결국 거기서 허세를 떨겠다는 얘기잖아, 사장……."
10008005-79 = "허, 허세가 아니라 이미지 메이킹이라고!!"
10008005-80 = "게다가! 마지막엔 거액의 현금을 새전함에 쿨하게 집어넣는 거지."
10008005-81 = "이런 푼돈 따위, 우리에겐 얼마든지 있거든. 하는 느낌으로!"
10008005-83 = "푸, 푼돈 따위……!!"
10008005-84 = "아하하하, 그래! 난 찬성!"
10008005-85 = "하아……."
10008005-87 = "좋아, 내 비전은 다 이해했을 거라고 믿고."
10008005-88 = "그럼 각오를 되새겨서……. 말했지만 이건 평범한 새해맞이 행사가 아니야."
10008005-89 = "말하자면 흥신소 68의 명운을 건 전쟁. 전투에 돌입하듯 새해맞이 행사장에 가서, 우리의 멋진 모습을 경쟁자들에게 각인시키는 임무인 거야!"
10008005-92 = "네, 넵! 명심하겠습니다!"
10008005-93 = "흐응~,"
10008005-94 = "응! 재밌을 거 같애. 얼른 가자!"
10008005-95 = "뭐. 새해의 소원 정도는 겸사겸사 빌어 두는 것도 괜찮겠지……."
10008005-97 = "그럼, 흥신소 68, 사업 번창의 꿈을 안고……."
10008005-98 = "새해맞이 행사장으로 출발!"
