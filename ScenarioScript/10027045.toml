[translation]
10027045-1 = "제4화;비밀 회합"
10027045-8 = "붉은겨울 산길"
10027045-9 = "헉, 헉……! 도대체 뭐야?! 곰에 토끼에 드론까지……! 어디에서 튀어나와 공격해 대는 거야?!"
10027045-14 = "[ns1] \"산 넘고~ 눈 건너~ 구석진 곳으로~\"\n[ns2] \"도대체~ 언제까지 가야 할까~\""
10027045-17 = "……노래가 나올 수 있는 여유가 부럽기까지 하네. 선생."
10027045-18 = "응? 손이 얼어붙을 것 같아서 노래라도 부르지 않으면 견딜 수 없을 것 같다고?"
10027045-19 = "말을 하지 그랬어. 자, 여기 손난로."
10027045-30 = "아니, 고마워할 필요는 없어…… 붉은겨울에서 살아남으려면 방한용품은 필수니까……"
10027045-31 = "하아. 그나마 아예 산속 깊은 곳으로 들어가지 않는 건 다행이지만, 뭐 이렇게 구석진 곳에서 모인다는 거지?"
10027045-32 = "이럴 정성과 열정이 있다면 차라리 우리 <지식해방전선>에……."
10027045-39 = "메루 선배, 신간 구했어요!"
10027045-40 = "그거 신간이라고 쓰고 구판이라고 읽는 무언가 아냐?"
10027045-41 = "개, 객관적으로 보면 그럴지도 모르겠지만요! 어쨌든 우리들에게는 신간 아닐까요?"
10027045-42 = "……어차피 처음 본다는 점에서는 마찬가지일 테니까요……."
10027045-43 = "뭐, 뭐. 그렇게 풀 죽지 말자고. 새로운 지식의 유입은, 어쨌든 마음을 풍요롭게 해 줄 테니까."
10027045-48 = "……"
10027045-49 = "아냐, 됐어. 아니야. 지금 한 말은 잊어 줘."
10027045-55 = "동인회장"
10027045-57 = "[ns] \"도착한 건가?\""
10027045-58 = "그런 것 같아. 그건 그렇고……"
10027045-62 = "말도 안 돼. 진짜로 이런 곳에서…… 이런 모임이 있다니……"
10027045-63 = "매대가 제법 많네. 책이 쭉 쌓여 있고……"
10027045-64 = "[s] \"다들 조용히 책을 보거나 사고파는 분위기네.\""
10027045-65 = "그러게……. 그런데 나 이 분위기, 어디에서 무지 자주 본 것 같은데……?"
10027045-69 = "[ns] \"아, 메루. 여기 봐. 이거 혹시……?\""
10027045-70 = "응? 뭔가 발견했어? 잠깐만…… 이거?"
10027045-75 = "<루나 The Last>?! 그렇다면 이게 혹시……?!"
10027045-76 = "[s] \"여기, 이 책은 'Sample'이라고 쓰여 있어.\""
10027045-77 = "아, 그래. 그건 말 그대로 샘플 본이겠네."
10027045-78 = "아…… 봐주시는 건가요? 가, 감사합니다! 여기, 편히 보세요!"
10027045-79 = "(응……? 오히려 책을 판매하는 쪽에서 감사 인사를 한다고? 나 이런 광경도 무지 익숙한데……?!)"
10027045-83 = "이, 일단! 이거 한번 읽어 보자고, 선생. 어쩌면 이게…… 우리가 그렇게 찾던 <루나>의 마지막 권일 수도 있으니까……!"
10027045-93 = "[ns] \"아아…… 이 선생님. 간만에 좋은 내용을 봤어……\""
10027045-95 = "[ns3] \"두 루나가 힘을 합쳐,\"\n[ns4] \"100만 파워로 최후의 적과 싸우는 광경은……\""
10027045-98 = "아니아니아니, 잠깐! 그거 어딘가 이상하지 않았어?!"
10027045-99 = "<루나>는 분명 약간 순정 계열의, 모미지의 말을 빌리자면, 인생과 펑크와 밴드와 영화…… 하여튼 그런 쪽 내용이잖아?! 왜 갑자기 합체와 싸움과 열혈과 최후의 클라이맥스로 급발진하는 건데?!"
10027045-100 = "[s] \"하지만 좋은 이야기였다고!\""
10027045-101 = "화, 확실히 이야기의 짜임새나 컷의 구성이나 그런 부분에서 인상적이긴 했는데!"
10027045-102 = "그래도…… 그게 <루나>의 마지막 내용이라는 건, 어딘가 좀 아니지 않아? 뭔가 핀트라던가 연결성이라던가 이것저것 왕창 비틀려 있지 않았어?"
10027045-103 = "[s5] \"어라? 여기 또 다른 <루나>가 있어.\"\n[s6] \"이번은…… <피날레 오브 루나>?\""
10027045-110 = "(<루나>의 마지막 권이…… 하나가 아니었다?!)"
10027045-111 = "(그렇다는 것은, 설마……?)"
10027045-117 = "이, 일단 여기도 샘플 본이 있으니까, 한번 보자고!"
10027045-129 = "[ns] \"크흑…… 두 루나가 결국 헤어지고 각자의 길을 간다니……\""
10027045-130 = "아니아니아니, 잠깐! 그거 어딘가 이상하지 않았어?"
10027045-131 = "물론 이번에는 분명히 인생과 펑크와 밴드와 영화…… 뭐 그런 내용이긴 했는데! 그래도 <루나>는 결국 두 명이 서로를 인정하고 받아들이며 화해할 수 있을 거라는 복선을 치밀하게 깔아 두었잖아?!"
10027045-132 = "그 모든 복선을 한 번에 날려 버리고, 이렇게 급작스러운 이별 엔딩이라고?!"
10027045-133 = "[s] \"하지만 애절한 이야기였는데?!\""
10027045-134 = "물론 감정선의 조절이라든가 구도라든가 그런 부분이 뛰어났다는 건 알겠는데!"
10027045-135 = "그래도 그게 <루나>의 마지막 내용이라는 건……. 모르겠어."
10027045-139 = "[ns7] \"다시 다른<루나>가 있는 것 같아.\"\n[ns8] \"<루나리스> 라는 제목인데……?\""
10027045-146 = "(각 매대에 전시된 <루나> 마지막 권이…… 모두 다른 건가?)"
10027045-147 = "(설마, 그것만은 아니라고 생각하고 싶지만, 아무리 생각해도 이거, 결론은 그거 하나밖에 없는 것 같은데……!)"
10027045-151 = "앗, 선생! 먼저 샘플 본 펼치지 마! 같이 보자고!"
10027045-164 = "[ns] \"아아…… 두 루나의 행방은 아무도 모르게 되었지만……\""
10027045-165 = "……남은 우리들의 삶은 이제부터다, 엔딩이라고……?"
10027045-166 = "아니아니아니, 적어도 난 납득 못 해! 확실하게 마무리를 지어 달라고! 뭔데 갑자기 아예 완전 다른 내용으로 비틀어서 전개하는 거야! 갑자기 아주 긴 시간이 지나 있고, 후일담의 후일담의 후일담…… 같은 내용들뿐이잖아!"
10027045-167 = "[s] \"하지만 정말 잘 그린 그림이었는데?!\""
10027045-168 = "물론 그림 실력이 뛰어나다는 건 알겠어! 특히 몇몇 컷은 고전 예술을 오마쥬한 게 아닌가 하는 생각이 들 정도였고!"
10027045-169 = "그렇지만 만화라는 건 그림이 예쁘다고 전부인 게 아니잖아? 특히 작품의 마무리라는 건 더더욱 그렇잖아?"
10027045-170 = "정작 가장 궁금한 내용은 쏙 빼 버리고, 자기가 그리고 싶은 에필로그만 그린 거나 마찬가지 아냐!"
10027045-171 = "[s] \"봐, 메루. 저기에도 <루나>가…….\""
10027045-172 = "아니, 됐어. 선생. 이제 알았어. 이 장소가 무엇인지, 여기에 있는 <루나>들이 어떤 것들인지."
10027045-178 = "한 번 보고 가세요! 특전 일러스트도 드립니다!"
10027045-179 = "이번에 신간을 출고했는데…… 한 번 보시겠어요?"
10027045-180 = "<G. 루나> 신간 판매는 1인당 1권입니다! 차례를 지켜주세요!"
10027045-184 = "……."
10027045-185 = "이곳은 동인 판매회야. 그것도 평범한 동인 판매회가 아니라. <루나> 온리전 같은 거지."
10027045-186 = "[s] \"네. 메루 씨가 무슨 말을 하는지 하나도 모르겠습니다.\""
10027045-187 = "그러니까 말이지……."
10027045-196 = "[ns9] \"그런가……! 여기는 <루나>의 팬들이.\"\n[ns10] \"자기가 상상한 <루나>의 마지막 내용을 그려서 판매하는 곳인가!\""
10027045-199 = "그런 거지. 여기 있는 것은 모두 <루나>의 마지막 권 동인지들인 거야."
10027045-200 = "상상을 초월하는 전개도, 복선을 무시하는 전개도, 갑자기 에필로그의 에필로그만을 그려도 받아들여지는 것은…… 그 모두가 '동인'이기 때문이고."
10027045-201 = "[s] \"팬 각자가 그려낸, <루나>의 마지막 권들이라는 거구나.\""
10027045-202 = "응, 그래서 어느 것 하나 똑같은 내용이 없는 거야. 각자의 해석이 다르게 적용되고 있는 거니까."
10027045-203 = "……개중에는 해석이 아니라 욕망을 주로 투영한 것도 있는 듯하지만……."
10027045-204 = "[s] \"그렇지만 욕망은 창작의 원동력이기도 하잖아?\""
10027045-205 = "윽. 왜 이럴 때만 날카로운 거야. 선생."
10027045-206 = "응? 서툴러도, 능숙해도 한 가지는 모두에게서 확실하게 전해졌다고?"
10027045-207 = "여기 모인 팬들이, <루나>에 대해 갖고 있는 애정……?"
10027045-208 = "하지만 왜? 다들 <루나>의 마지막 권을 그리는…… 이런 행사를 하고 있는 거지?"
10027045-209 = "……."
10027045-216 = "결국 여기까지 왔군요. 메루리 씨."
10027045-221 = "어……?"
