[translation]
10014045-5 = "기세등등하게 덤볐던 것치고는 의외로 별거 없네. 이 레이사라는 사람……."
10014045-6 = "바닥에 뻗어버렸는데, 벌써 기절한 거야?"
10014045-7 = "그, 그야 이쪽은 네 명인 데다……. 선생님이 계시니까……."
10014045-8 = "나, 참. 대체 이게 무슨 일인지……."
10014045-9 = "역시 훌륭하군, 누구도 우릴 막을 수 없다! 이제 이 기세로 주변을 점거하는 거야!"
10014045-10 = "카스……"
10014045-11 = "카스파……"
10014045-12 = "……카스팔루그."
10014045-14 = "아, 아니. 역시 거기까지는 아닐 거라고 생각하지만……."
10014045-18 = "……제발……."
10014045-19 = "제발 좀 그만해라, 진짜……."
10014045-20 = "[s1] \"다들 카즈사를 이해하고 싶어하는 거야.\"\n[s2] \"어설프긴 하지만, 모양새보단 의도를 봐줘.\""
10014045-21 = "하아……. 또 그런 식으로 얼렁뚱땅……."
10014045-22 = "하아……. 또 그런 식으로 얼렁뚱땅……."
10014045-26 = "……아냐. 더는 못 참아."
10014045-27 = "선생님한테는 미안하지만, 뭐가 어쨌든 더는 그냥 있을 수 없어. 할 말은 해야겠어."
10014045-28 = "……너희들."
10014045-29 = "제발 부탁이니, 이렇게 바보 같은 짓 좀 하지 마."
10014045-35 = "가뜩이나 저기 누워 있는 바보 때문에 힘든데, 너희까지 이렇게 나오면 나 진짜 힘들어져."
10014045-36 = "……!"
10014045-37 = "……?!"
10014045-38 = "카, 카즈사 쨩! 그, 그런 게 아니야! 우리는 그저……!"
10014045-39 = "얽히게 하고 싶지 않은 거라면 이미 늦었어."
10014045-40 = "우리는 한배를 타기로 마음 먹었……."
10014045-41 = "아이, 진짜! 그만 좀 해라, 그만 좀! 우선 이야기를 듣고! 변명은 나중에 해도 되잖아!!"
10014045-42 = "……네."
10014045-46 = "하아……. 고맙다, 요시미. 살다 보니 너한테 감사를 하는 날도 다 오네."
10014045-47 = "나도 왜 이런 짓을 벌였는지는 대충 알겠는데, 의도는 고맙지만 그만해 줬으면 좋겠어."
10014045-48 = "고맙다는 마음은 진심이야. 하지만 사실……. 딱히 좋은 일도 아니잖아."
10014045-49 = "신경 쓰지 않으면 그냥 없었던 일로 할 수 있는 걸, 굳이 끄집어내서 이럴 필요는 없다고 생각해."
10014045-50 = "그, 그건……."
10014045-51 = "……응. 차라리 잘 됐어. 어차피 어디서 들은 게 있는 모양이니 이 기회에 확실히 말해둘게."
10014045-52 = "나한텐 전부 잊고 싶은 일들이야. 그때의 일들도, 그 때 사람들도 전부 다 말이야."
10014045-53 = "갑자기 분위기 잡아서 미안하지만, 전처럼 그냥 모르는 것처럼 지내 줬으면 해. 나도 그럴 테니까."
10014045-54 = "게다가 저 녀석도……."
10014045-55 = "……아니다. 지금은 좀 피곤해서……. 자세한 건 다음에 다시 이야기하자."
10014045-56 = "그럼……. 먼저 간다."
10014045-60 = "……카즈사 쨩……."
10014045-61 = "……으음……."
10014045-62 = "……."
10014045-66 = "……?"
10014045-67 = "아. 일어났다."
10014045-73 = "…………."
10014045-74 = "……아니……. 일어난 게 아니라……."
10014045-75 = "[s] \"……깨어 있었구나.\""
10014045-76 = "……이런."
10014045-77 = "들은 건가. 좀 전 말들 전부……. 좀 곤란하네."
10014045-78 = "으, 응? 그게 무슨 말이야 나츠 쨩……?"
10014045-82 = "…………."
10014045-89 = "어……. 어라……?"
10014045-90 = "저기……. 잠깐만요……?"
10014045-96 = "……아이리."
10014045-97 = "……?"
10014045-98 = "……응. 지금은……."
10014045-100 = "……혼자 놔두는 게 좋을 거 같네."
