[translation]
84305300100-9 = "네, 네루 씨……?!"
84305300100-10 = "……칫, 손님이 있었네."
84305300100-11 = "손님……이라고요?"
84305300100-16 = "아이고, 이거 참 반갑습니다. 여러분! 덕분에 정~말 큰 수고를 덜었어요!"
84305300100-23 = "여기가 그 위대한 <빅 시스터 룸>인가요? 이야~, 듣던 대로 정말 굉장하네요! 문외한이 봐도 대단한 곳이라는 건 바로 알겠어요!"
84305300100-24 = "밀레니엄의 모든 곳……아니 그 이상을 감시하고 조작하는…… '보이지 않는 손'이자 '신의 눈'과도 같다는 곳!"
84305300100-25 = "굉~장히 힘들었단 말이죠, 여기. 얼마나 꽁꽁 숨겨 놨는지……! 알아서 찾아내려니 무슨 짓을 해도 도저히 찾을 수가 없어서 말이에요."
84305300100-26 = "그래도 이렇게, 여러분의 적극적인 '협조' 덕분에 찾아내게 됐군요! 이걸 또 어떻게 감사를 드려야 할지 모르겠습니다!"
84305300100-27 = "협조……? 찾아내……? 무슨 소리야?"
84305300100-28 = "직접 찾아낼 수 없었다니……"
84305300100-32 = "……!! 과연."
84305300100-33 = "전부 이걸 위해서였군요. 지금까지의 그 소동들……전부."
84305300100-34 = "오, 눈치가 빠르시네요. 좋아요! 그러면 길게 설명할 필요 없겠죠?"
84305300100-35 = "……??? 무슨 소리야? 뭘 위해서라고?"
84305300100-36 = "당했습니다. 모두 함정이었어요."
84305300100-37 = "지금까지 저희가 엑스포에서 보았던 수많은 사건들. 딱히 목적도 없어 보이면서 단순히 '망치기 위해' 하는 것처럼 보였던 일들."
84305300100-41 = "사실 전부다……. 저희 스스로 이곳에 오게 하기 위해서였던 거네요."
84305300100-43 = "……!!!"
84305300100-45 = "뭐, 뭐? 그러니까 지금……."
84305300100-46 = "네. 저희가 여기를 저희 발로 찾아온 게, 처음부터 저들이 바라던 목표였단 뜻이죠."
84305300100-47 = "그리고 그 목표란 방금 전 스스로 말했듯…… 이곳, 정확히는 이곳에 있는 리오의 시스템…… <빅 시스터 알고리즘>."
84305300100-48 = "대체 뭐 하는 분인지는…… 아직 알 수 없지만요."
84305300100-53 = "아, 소개가 늦었지요? 죄송합니다, 하하. 정신이 없어서 그만!"
84305300100-54 = "제 이름은…… <미라이>라고 합니다. 밀레니엄의 전 <유사과학부> 부장이지요."
84305300100-59 = "유사과학부……?"
84305300100-60 = "미라이……?"
84305300100-62 = "네, 그리고 지금 두 분이 통화 너머로 대화 중이신……"
84305300100-63 = "학생회장 <츠카츠키 리오> 씨와는 질긴 악연을 가지고 있고 말이지요."
84305300100-68 = "……뭐?"
84305300100-69 = "리오 씨와……?"
84305300100-71 = "……!?"
84305300100-72 = "후후후……. 설마 이제 와서 모른다는 말은 하지 않으시겠지요? 리오 회장님."
84305300100-73 = "당신의 손으로 없애버린……. 우리 유사과학부와 제 이름을."
84305300100-74 = "우리는 이날만을 기다렸습니다."
84305300100-75 = "밀레니엄을 장악하고 우리의 이름에 먹칠을 하고, 우리의 사업을 방해한 당신에게 복수할 이날을……."
84305300100-79 = "……."
84305300100-80 = "……."
84305300100-81 = "……."
84305300100-85 = "아니, 모르는데. 전혀 기억이 나지 않아."
84305300100-89 = "……? 네?"
84305300100-90 = "난 당신이 누군지 몰라. 당신에게 악의를 가진 적도 없고, 사업을 방해하려 움직인 적도 없어. 뭔가 오해가 있는 거 같네."
84305300100-94 = "그, 그게 무슨 말이죠!? 모르다니요! 뭘 모른다는 거예요!! 우리는 동아리의 존속을 두고 치열하게 싸웠잖아요!!"
84305300100-95 = "당신이 우리 동아리의 예산을 전부 압류했잖아요! 우리 프로젝트를 모두 무산시켰잖아요!!"
84305300100-96 = "내가……? 어떤 프로젝트였지?"
84305300100-97 = "정말 몰라서 묻는 건가요!? 제 입으로 직접 들려드려야 하는 건가요!?"
84305300100-102 = "<물은 알고 있다> 프로젝트도, <피라미드 파워>도, <전자파 방지 스티커>도 당신이 모두 막았잖아!!"
84305300100-110 = "당신 몰래 밖으로 빼돌려서 부비를 충당한 거라고는 <게르마늄 팔찌> 정도밖에 남지 않았다고. 우린 당신 때문에 파산한 거라고요!!"
84305300100-112 = "무슨…… 파워? 뭐 방지?"
84305300100-113 = "과연……. 그런 '유사 과학'이었군요. 그럴싸한 과학 이론을 이용해 모르는 사람들에게 이익을 취하는 사업……."
84305300100-114 = "……?? 사기잖아."
84305300100-115 = "네, 사기죠."
84305300100-117 = "사기라니!! \"아직\" 검증되지 않은 영역의 과학일 뿐이라고요!! 이래서 보수적인 과학도들이란……!!"
84305300100-118 = "지금 당신들의 그런 답답함에도 제 안의 물 분자들이 화가 나 일그러지기 시작했다고요!! 알고 있어요!?"
84305300100-119 = "뭐라는 거냐, 저 녀석."
84305300100-120 = "일단 왜 리오가 저분들의 활동을 중단시켰는지는 알겠네요."
84305300100-121 = "……과연. 이해했어. 그러고 보니 전에 그런 정책을 편 적이 있었지."
84305300100-122 = "오해가 있었다면 사과하도록 할게. 하지만 미라이. 당신의 말에는 어폐가 있어."
84305300100-126 = "뭐요? ……어폐?"
84305300100-127 = "우선 '검증되지 않은 것'은 아직 과학이 아니야. 연구비나 개발비가 필요하다면, 그것이 가능하다는 이론적 설득을 우선 가져와야 해."
84305300100-128 = "그리고 과학의 연구를 위해서도 아닌, 그것을 외부로 반출해 이익을 취하기 위한 '사업'에 동아리 활동비를 지급할 수는 없어."
84305300100-129 = "우리는 과학을 연구하는 학교지 사업체가 아니니까."
84305300100-131 = "……확실히."
84305300100-132 = "……맞는 말이네."
84305300100-134 = "크윽, 또 그런 소리를……!! 당신은 정말 그때랑 변한게 하나도 없군요!!"
84305300100-135 = "알겠습니다. 괜찮아요! 대화가 통하지 않는 사람이라는 건 전부터 알고 있던 거니까요!"
84305300100-136 = "저희는 그저 이 <빅 시스터 알고리즘>을 가져가, 제값을 쳐주는 곳에 팔기만 하면 그만이에요!"
84305300100-137 = "아니, 그건 허가할 수 없어. 이건 외부로 반출되기에 너무 위험한 물건이니까."
84305300100-138 = "애초에 오늘 이곳으로 온 것도, 폐기의 목적을 겸하고 있는 상황이야."
84305300100-139 = "하……! 꽤나 여유만만이시네요? 언제까지 그런 태도로 굴 수 있는지 궁금해지는군요!"
84305300100-141 = "그쪽이야말로 꽤나 여유만만하잖아. 지금 상대가 누군지 알고 하는 말이야?"
84305300100-142 = "고작 그 정도의 병력을 끌고 와 놓고……"
84305300100-146 = "설마 나랑 해보겠다는 건가?"
84305300100-147 = "……!! 크, 큭. 미카모 네루……."
84305300100-151 = "후후, 하지만 당신에 대한 방편도 다 마련해 두었죠. 저희가 바보처럼 당신과 정면승부라도 할 줄 알았습니까?"
84305300100-152 = "뭐?"
84305300100-156 = "……쨘!"
84305300100-157 = "보이십니까? 이 버튼은 지금 엑스포 회장 곳곳에 퍼져 있는 저희 쪽 사람들에게, 동시에 신호를 보낼 수 있는 통신기입니다."
84305300100-158 = "이걸로 제가 한마디만 하면, 지금 당장이라도 밀레니엄 엑스포는 엉망진창!! 모처럼의 교류회인데, 트리니티와의 관계도 끝장나겠죠?"
84305300100-159 = "……!!!"
84305300100-160 = "협박인가요. 철두철미하군요."
84305300100-161 = "후후, 이제야 좀 상황이 이해가 가십니까? 하지만 걱정 마십시오. 여러분이 쓸데없는 짓만 안 하면, 이걸 켤 일은 없을 테니까요."
84305300100-162 = "자~. 그럼 거기서 가만히 계세요. 알고리즘이 있는 하드웨어를 뜯어 가려면 몇 분 정도 걸릴 거거든요."
84305300100-163 = "대체 왜 이런 짓을……."
84305300100-164 = "아니, 애초에 어떻게 이곳의 존재를 안 거지……? 빅 시스터 룸은 나 외엔 아는 이가 없었을 텐데……."
84305300100-165 = "후후, 이것도 다~ 장사 수완이라는 거죠. 스폰서가 있었거든요."
84305300100-169 = "스폰서……? 대체 누가……."
84305300100-171 = "리오. 이대로는……."
84305300100-172 = "……응. 방법이 없어."
84305300100-179 = "……하."
84305300100-180 = "보자보자 하니 더 이상은 못 봐주겠네."
84305300100-185 = "네루……?"
84305300100-191 = "응? 얼레?"
84305300100-196 = "뭐, 뭐죠!? 왜 이쪽으로 오시는 거죠!?"
84305300100-200 = "어~!! 가만히!! 가만히 있으세요!! 진짜 합니다? 진짜 한다고요??"
84305300100-204 = "하, 못 믿으시는 모양이군요? 제가 진짜 통화를 켜 봐야 정신을 차리시는 걸까요?"
84305300100-206 = "해 봐."
84305300100-210 = "네?"
84305300100-216 = "아니, 그냥 하라고. 그 통신인지 신호인지 그거."
84305300100-217 = "네루……!!"
84305300100-218 = "네루, 그건……!!"
84305300100-220 = "지, 진짜 합니다!? 진짜 할 거예요!! 후회하지 말라고요!!"
84305300100-222 = "해, 그냥. 시간 끌지 말고 빨리해."
84305300100-228 = "네루!!"
84305300100-229 = "……!?"
84305300100-232 = "(어째서……? 홧김에?)"
84305300100-233 = "(아니, 미카모 네루는 정작 중요한 순간에는 그런 실책을 저지를 사람이 아니에요.)"
84305300100-234 = "(그렇다면…… 설마, 이건!)"
84305300100-237 = "하, 하……!! 조, 좋아요! 어디 소원대로 해 드리죠!! 각오하시라고요!!"
84305300100-241 = "여보세요? 저입니다! 들리시나요? 지금 다 준비됐죠?"
84305300100-242 = "지금 당장……."
84305300100-246 = "……?? 어라?"
84305300100-248 = "뭐죠, 이 반응……? 왜 이렇게 소리가 지직거리지……?"
84305300100-253 = "……받고 있다……!"
84305300100-259 = "공격받고 있어! 기습당했다!! 잠복 중이던 모든 곳에서 적의 기습이……!!!"
84305300100-260 = "……?"
84305300100-261 = "……뭐라고요?"
84305300100-265 = "C&C다……! C&C가 왔다!!"
84305300100-266 = "C&C……?"
84305300100-267 = "그, 그럴 리가요!? 미카모 네루는 분명 여기……!"
84305300100-269 = "나머지가! 나머지가 전부……!"
84305300100-270 = "함정이다, 전부 함정이야!"
84305300100-273 = "함정……? 나머지가 모두?"
84305300100-274 = "이, 이건 대체……."
84305300100-278 = "설마……."
84305300100-279 = "……네루!"
84305300100-280 = "미카모 네루, 당신은 처음부터……."
84305300100-285 = "아니, 뭐……."
84305300100-286 = "……그렇게 됐어."
84305300100-287 = "나는 누구들과는 달리, 그렇게 꽉 막힌 사람이 아니라서 말이지."
84305300100-288 = "이렇게 큰 일을 벌이는데……."
84305300100-289 = "……선생한테 귀띔 정도도 안 해 놓을 순 없잖아."
84305300100-294 = "……!!"
84305300100-295 = "그런……! 그럼 방금 전 저 대처도……!"
84305300100-296 = "모두 선생님께서 지휘……해주고 계시다는 겁니까."
84305300100-297 = "대체……"
84305300100-298 = "대체 언제부터……?"
84305300100-300 = "네가 여기 와서 부탁했을 때부터지. 엑스포 개최 준비가 한창일 때였던가, 아마?"
84305300100-301 = "2주도 더 전이잖아!"
84305300100-302 = "아, 오해하지는 마. 다른 녀석들한테 말한 건 아니니까 말이야. 그 정도는 선생이 알아서 잘 얼버무리겠지."
84305300100-306 = "……!"
84305300100-307 = "선생님…… 그렇군요. 그래서 그때…… 나기사와 말할 때에도 제 편을……."
84305300100-308 = "그때부터 이미……. 전부 다 생각하고……."
84305300100-310 = "무슨 이야기죠?! 무슨 이야기들을 하고 계신 거죠!?"
84305300100-311 = "아아, 신경 쓸 거 없어. 네가 알 건 그냥……."
84305300100-316 = "……이제 넌 죽었다는 것 정도니까."
