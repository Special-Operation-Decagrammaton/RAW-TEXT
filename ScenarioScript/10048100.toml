[translation]
10048100-1 = "제10화;시험의 결과"
10048100-2 = "와일드헌트 정문"
10048100-3 = "(다음 날, 아침.)"
10048100-4 = "어이구, 사람들이 많네."
10048100-5 = "역시 <베로니카 특별전>…… 그런데 몇 시에 개장이지?"
10048100-6 = "도록도 봐, 이 그림도 전시된대!"
10048100-7 = "어? 이거 나 미술 교과서에서 본 적 있는데!"
10048100-11 = "(웅성웅성…….)"
10048100-17 = "(……예술이 무엇인지도 모르면서 다들 잘도 떠드는군.)"
10048100-18 = "(눈앞에 위작을 두고도 그것이 위작인 줄도 모를 자들…….)"
10048100-19 = "(……옛날 생각이 나는군.)"
10048100-21 = "(내가 심혈을 기울여 그린 나의 오리지널 그림은 그리도 비난하던 평론가들…….)"
10048100-22 = "(하지만 그들 모두 내가 대충 그린 유명 작품의 위작에는 속아 넘어가서 입에 침이 마르도록 찬탄했었지.)"
10048100-23 = "(그 누구도 그림 그 자체를 보지 않았어.)"
10048100-24 = "(그 그림의 배후에 깔린 허울 좋은 유명세만 볼 뿐.)"
10048100-25 = "(사람들에게는, 예술의 진면목을 통찰할 안목이 처음부터 없었던 거야.)"
10048100-27 = "[log=시민 동물6 의뢰인]그렇기에 사람들에겐 자격이 없어.[/log]"
10048100-31 = "[log=시민 동물6 의뢰인]진품의 위대한 아우라를 감상할 자격이 없단 말이다……![/log]"
10048100-34 = "(그렇기에 나는, 세상의 위대한 진품들을 하나하나 위작으로 바꿔 나갈 것이다.)"
10048100-35 = "(무지한 이들의 눈과 입에 오르내리는 것은, 위대한 작품들의 입장에서는 수치스러운 일일 테니까.)"
10048100-36 = "(……그나저나 어젯밤에 특수교역부에게 연락이 왔었지.)"
10048100-37 = "(의뢰를 완료했다고.)"
10048100-38 = "(……후후, 좋아. 이제부터 시작이다.)"
10048100-39 = "(다들 그 얼빠진 표정으로, 나의 조악한 위작이나 감상하라고.)"
10048100-40 = "(당신들의 수준에는 그 정도면 충분할 테니까……!)"
10048100-42 = "자! 이제 개장합니다! 이쪽 입구로 줄 서 주세요!"
10048100-43 = "미리 표를 꺼내 두세요!"
10048100-44 = "후후, 드디어 시간이 됐군."
10048100-45 = "가볼까……!"
10048100-50 = "베로니카 특별전 전시회장"
10048100-51 = "(웅성웅성……)"
10048100-55 = "뭐야? 전시가 왜 저렇게 되어 있어?"
10048100-56 = "응……? 왜 똑같은 그림이 두 개나……?"
10048100-58 = "저거 근데…… 유명한 그림 아니야?"
10048100-59 = "뭐지? 일부러 저렇게 걸어 놓은 건가?"
10048100-64 = "뭐야? 왜 이렇게 앞에서 웅성거려?"
10048100-65 = "다들 움직이지도 않고……."
10048100-66 = "대체 무슨 일이야?"
10048100-67 = "이봐요, 거기 앞에 좀 비켜……."
10048100-72 = "뭐, 뭐야……?!"
10048100-77 = "똑같은 그림 두 개가 한 벽에 걸려 있다고……?!"
10048100-78 = "이게 대체 어떻게 된 일이야……!"
10048100-80 = "[log]어젯밤…….[/log]"
10048100-82 = "와일드헌트 공터"
10048100-83 = "……괴도님은 사람들을 믿지 않으시죠?"
10048100-84 = "사람들에겐 위작과 진품을 구별할 능력도, 예술적 안목도 없다고 생각하시고요."
10048100-85 = "맞으시죠?"
10048100-86 = "그렇습니다."
10048100-87 = "그럼 제가 하나 물어볼게요."
10048100-88 = "괴도님의 그 생각을, 시험해 보신 적 있으신가요?"
10048100-89 = "시험이요?"
10048100-90 = "예. 사람들이 정말로 무지한지, 시험을 해 보자고요."
10048100-91 = "……미학적으로 흥미로운 소리군요."
10048100-92 = "좋아요, 어떻게 시험할 생각인지?"
10048100-97 = "……<누가 자줏빛과 푸른빛을 귀여워하랴>의 진품과 위작을, 한 공간에 동시에 전시하는 거예요."
10048100-98 = "……!"
10048100-99 = "관람객들이 처음에는 혼란스러워할 거예요."
10048100-100 = "하지만 얼마 안 가 인파는 둘로 갈라지겠죠."
10048100-101 = "누군가는 진품 앞으로, 누군가는 위작 앞으로……."
10048100-102 = "만약 사람들에게 예술적 안목이 내재해 있다면, 진품 앞으로 더 많이 몰려들 거예요."
10048100-103 = "아니라면, 인파는 균등하게 반씩 나눠질 거고요."
10048100-104 = "……호오."
10048100-105 = "만약 진품 앞으로 더 많은 사람들이 모여든다면, 괴도님께선 그림을 훔칠 이유가 없어지겠죠."
10048100-106 = "사람들이 자신들의 예술적 안목을 스스로 증명한 셈이 되니까요."
10048100-107 = "후후, 그렇군요."
10048100-108 = "좋습니다. 그렇게 된다면, 저는 이 그림을 훔치는 것만큼은 포기하도록 하죠."
10048100-109 = "……하지만, 만약 그렇지 않다면요?"
10048100-110 = "반대로 제 생각이 맞다는 것이 밝혀지면, 그쪽은 저에게 무엇을 해 주실 거죠?"
10048100-111 = "……."
10048100-112 = "……나중에 한 번 일을 도와드릴게요."
10048100-113 = "특수교역부의 이름으로."
10048100-114 = "미요미요미요미요, 이거 너무 도박 아니야?!"
10048100-115 = "만약 우리 생각대로 사람들이 안 움직이면 어쩌려고?!"
10048100-116 = "……눈 뜬 채로 진품을 훔쳐 가는 걸 보는 것보단 낫잖아요."
10048100-120 = "좋아요. 수락하죠."
10048100-121 = "이 또한 제법 미학적 흥미가 동하는 일이니까요."
10048100-122 = "두 그림을 걸어 두는 작업은 제가 하도록 하겠습니다."
10048100-123 = "……고맙습니다."
10048100-124 = "자, 그럼 이제 정말로 헤어질 시간이군요."
10048100-125 = "언젠가, 또 다른 모습으로 다시 만나길, 미요 양."
10048100-126 = "……그리고 선생님도요."
10048100-127 = "[s] \"잘 가, 괴도님.\""
10048100-128 = "괴도 쨩, 잘 가!!"
10048100-129 = "후후, 그럼 이만."
10048100-135 = "미요! 진품 쪽으로 사람들이 몰려들고 있어……!"
10048100-136 = "우리가 이겼다고!"
10048100-137 = "……."
10048100-138 = "다, 다행이, 다……."
10048100-143 = "미요?!"
10048100-144 = "미요 쨩?!"
10048100-150 = "확실히…… 이쪽이 분위기가 좀 다른데?"
10048100-151 = "분명 똑같은 그림인데, 어쩐지 느낌이 달라."
10048100-153 = "……나도 이쪽이 좀 더 마음에 드는걸."
10048100-154 = "나도 나도."
10048100-159 = "……."
10048100-160 = "(어째서……!)"
10048100-161 = "(어째서 다들 진품 앞으로 몰려드는 거지?!)"
10048100-162 = "(저 무지한 인간들이, 어떻게 진짜를 알아보는 거야……!)"
10048100-163 = "(아니 그 이전에, 특수교역부 이놈들, 분명 의뢰를 완수했다고 했는데……!)"
10048100-164 = "안녕하십니까."
10048100-170 = "무, 무슨 일이시죠?"
10048100-171 = "<누가 자줏빛과 푸른빛을 귀여워하랴>의 위작 제작 혐의로 체포하겠습니다."
10048100-172 = "뭐, 뭐라고요?!"
10048100-173 = "자세한 이야기는 가서 하시죠."
10048100-174 = "다만 저희는 발키리가 아니라서 묵비권은 존중해 드리지 않는 점, 양해 바랍니다."
10048100-175 = "아, 아니야! 내가 아니야!"
10048100-176 = "이건 특수교역부! 그래! 특수교역부 그놈들이 벌인 짓이라고!"
10048100-177 = "특수교역부 라고요……?"
10048100-178 = "후후, 뭘 모르시는군요."
10048100-179 = "……?"
10048100-183 = "와일드헌트에, 그런 조직은 존재하지 않습니다."
10048100-190 = "끌고 가."
10048100-195 = "아니야! 안 돼! 나에게는 사명이, 무지한 인간들로부터 예술을 지켜야 할 사명이……!"
10048100-209 = "이번에는 제가 져 버렸군요, 후배님들."
10048100-210 = "……하지만 다음 승부 때에는 봐주지 않을 거랍니다."
10048100-211 = "아시겠죠, 선생님?"
10048100-212 = "[s] \"……아직 괴도를 그만둘 생각은 없는 거구나.\""
10048100-213 = "흐음? 괴도라니요? 저는 잘 모르겠군요, 선생님."
10048100-214 = "저는 그저 위작 제작꾼을 체포하고, 특수교역부라는 동아리의 존재를 감춰준……."
10048100-215 = "……그런 일개 사감대원일 뿐이라서요."
10048100-216 = "[s1] \"그러니까 여기에서는…….\"\n[s2]\"사감대원과 선생님으로만 남자는 거야?\""
10048100-219 = "네, 그런 셈이죠."
10048100-220 = "예? 언젠가 정말로 선을 넘으면, 선생님으로서 두고 볼 수 없을지도 모른다고요?"
10048100-221 = "……."
10048100-222 = "괜찮습니다. 선생님에게라면, 뭐, 오히려……."
10048100-223 = "선생님께서 저를 뒤쫓는 것도, 그 자체로 오히려 하나의 미학이 아닐까, 합니다……."
10048100-224 = "괴도는…… 자기를 붙잡아줄 탐정을 기다리는 법이니까……."
10048100-225 = "[s] \"응? 괴도는…… 뭐라고?\""
10048100-226 = "아, 아아, 아니에요."
10048100-227 = "그나저나, 오늘은 추가적인 업무가 더 배정되어 있는데……."
10048100-228 = "[s] \"추가적인 업무……?\""
10048100-229 = "그…… 서, 선생님의 전시회 가이드를 해드리는…… 그러니까 도슨트 업무인데……."
10048100-230 = "해당 업무에 협조를 부, 부탁드려도 될까요?"
10048100-231 = "[s] \"그래, 그러면 잘 부탁할게.\""
10048100-232 = "후, 후후, 그럼……."
10048100-237 = "먼저 <누가 자줏빛과 푸른빛을 귀여워하랴>, 이 작품부터 보실까요?"
