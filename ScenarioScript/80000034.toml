[translation]
80000034-1 = "주저하지만 전하고 싶은"
80000034-2 = "(발렌타인 데이 당일, 일과도 전부 끝났을 때 즈음. 히나로부터 호출이 들어왔다.)"
80000034-3 = "[ns] \"분명 이 근처 어디에서 만나자고 했는데.\""
80000034-7 = "아, 안녕……. 선생."
80000034-8 = "[s] \"히나!\""
80000034-9 = "자, 잠깐! 목소리가 너무 커, 선생……!"
80000034-10 = "순찰이 끝나고 잠깐 짬을 내 나온 거라, 만약 이걸 남에게 들켰다간, 그……. 조금 시끄러워질 수도 있어."
80000034-11 = "그렇게 되면 또 선생에게 폐를 끼치게 될 거야."
80000034-12 = "[s1] \"나는 괜찮은데.\"\n[s2] \"오히려 히나라면 잔뜩 폐를 끼쳐주는 게 좋은데.\""
80000034-13 = "아니, 으음, 정말 당신이란 사람은……."
80000034-14 = "아니, 으음, 정말 당신이란 사람은……."
80000034-15 = "……이런 말을 해도 소용없겠지."
80000034-16 = "그래도 갑자기 부른 건데도, 이렇게 늦지 않게 나와줘서……."
80000034-17 = "그게……."
80000034-18 = "……고마워."
80000034-19 = "[s] \"으음, 히나 말대로 남에게 들키면 곤란해진다니까 일단…….\""
80000034-25 = "자, 잠깐. 서, 선생……?!"
80000034-26 = "[s3] \"(소근소근) 히나 쨩, 그래서 무슨 일이야?\"\n[s4] \"(소근소근) 남들에게 비밀로 몰래 부르다니.\""
80000034-27 = "조용히 해달라고는 했지만, 그, 그렇게나 가까이 붙어서 귀, 귓속말을……!"
80000034-28 = "조용히 해달라고는 했지만, 그, 그렇게나 가까이 붙어서 귀, 귓속말을……!"
80000034-29 = "자, 잠깐!"
80000034-30 = "[s] \"……응?\""
80000034-31 = "그, 후우. 하아. 조금, 지, 진정해. 선생."
80000034-32 = "아니……, 진정해야 할 건, 나인가?"
80000034-33 = "하, 하여간! 내가 오늘 선생을 부른 이유는 이거 때문이야."
80000034-38 = "[ns] \"어라, 이거…….\""
80000034-39 = "그, 오늘은 발렌타인 데이니까. 기념으로 한 번, 직접……. 만들어본 거야."
80000034-40 = "모양새가 볼품없는 건"
80000034-41 = "그게……. 몇 번이나 실패한 까닭에……."
80000034-42 = "응……. 그래서 겉모습은 나처럼 못나기만 하지만."
80000034-43 = "그래도…… 아마 맛은 초콜릿의 형태"
80000034-44 = "……일 거라고 생각하니까."
80000034-45 = "혹시 괜찮다면 선생이 받아줬으면 해서……."
80000034-46 = "[s] \"히, 히, 히나 쨩의 수제 초콜릿이다! 우와아!!\""
80000034-47 = "서, 선생?! 가, 갑자기 왜 그렇게 흥분을……."
80000034-48 = "[s] \"히나 쨩의 수제 초콜릿이라니! 평생 가보로 간직할게!\""
80000034-49 = "아니! 음식이니까! 가보로 간직해도 곤란하다고……?"
80000034-50 = "……하아, 나 참. 정말……."
80000034-51 = "풋……."
80000034-52 = "응, 선생은 이런 사람이었지. 나도 참, 뭘 그렇게 겁먹고 있었던 걸까……."
80000034-53 = "후후, 고마워. 선생. 부디 맛있게 먹어주길 바라."
80000034-54 = "나름 그게, 여, 열심히 만들었으니까……."
80000034-55 = "[s] \"응, 고마워! 히나!\""
80000034-56 = "……진짜로 먹어야 해? 가보로 간직하진 말고……."
80000034-57 = "[s] \"선처하겠습니다.\""
80000034-58 = "저기, 그게 선처할 문제인 거야……?"
80000034-59 = "선생만 좋다면야 뭐, 상관은 없지만……."
80000034-60 = "……후후."
