[translation]
10049075-2 = "마스코트를 공격한다니, 제정신이야 너희들?!"
10049075-4 = "그, 그게 말이죠 대장. 마스코트라서 오히려 두들겨 맞는 게 맞아요."
10049075-5 = "저 무섭게 생긴 녀석은 적이라서요, 으악!!"
10049075-11 = "그게 아니라!! 저 마법소녀 녀석들!!"
10049075-12 = "은근슬쩍 공격하고 있잖아!"
10049075-17 = "으갸악!!"
10049075-19 = "테르밋 화이트! 스타낙 쨩에게 힐링 마법을 더 주는 겁니다!"
10049075-20 = "아, 알겠습니다!"
10049075-27 = "뭔 힐링 마법이야!! 예광탄하고 소이탄이잖아!!"
10049075-28 = "스타낙 쨩, 힘내세요! 힐링 슬러그탄을 전부 다 쏴드리겠습니다!"
10049075-29 = "힘내라 스타낙 쨩!!"
10049075-36 = "이, 이 자식들 같은 편인 척하면서 교묘하게 공격하잖아!!"
10049075-38 = "이 불경한 자가!!"
10049075-39 = "받아라! 힐링 드래곤 브레스!"
10049075-45 = "흐갸악……!"
10049075-50 = "스타낙 쨩이 쓰러졌어!!"
10049075-51 = "그치만, 스타낙 쨩은 맷집이 좋으니까 금방 일어나겠지-"
10049075-52 = "맞아! 원래 매번 두들겨 맞고 회복하는 게 일상이니까!"
10049075-54 = "그런…… 마스코트가…… 어딨…… 어……."
10049075-59 = "매지컬 큐어 로프로 잘 묶고……."
10049075-63 = "매지컬 큐어 테이프로 입도 막았습니다!"
10049075-64 = "에라! 스타낙 쨩의 복수는 반드시 다시 해주겠어요!"
10049075-65 = "스타낙 쨩을 치료하고 다시 돌아오겠습니다!"
10049075-69 = "[ns5] \"자~ 쉬는 시간입니다!\"\n[ns6] (시미코도 같이 모이자!)"
10049075-75 = "너, 너희들 뭐 하는 거야?"
10049075-76 = "옷은 별 괴상한 걸 입어놓고, 우리는 이렇게 꽁꽁 묶어놓고."
10049075-85 = "손에 그건 뭐야, 자동차 배터리?!"
10049075-86 = "으아앙 대장!! 고문하려나 봐요!!"
10049075-87 = "말할 것도 없는데 고문?!"
10049075-88 = "어, 어이!! 잠깐만!!!"
10049075-93 = "흐갸아아악!!!"
