[translation]
84310100400-10 = "아, 안녕하세요. 실례가 되지 않는다면…… 상황을 좀 여쭤봐도 괜찮을까요?"
84310100400-14 = "음? 아! 안녕하세요! 트레이닝 때문에 오셨나요?"
84310100400-15 = "트레이닝……? 운동 중이셨던 건가요?"
84310100400-16 = "(역시 처벌 같은 건 아니었던 모양이네요. 괜한 오지랖이었나 봐요.)"
84310100400-17 = "지금 이곳에 계신 분들과 즐거운 트레이닝을 하고 있답니다. 건강한 몸에 건강한 정신이 깃드는 법!"
84310100400-18 = "보세요, 상쾌해하고 계신 저분들의 얼굴을!"
84310100400-23 = "이게 어떻게 상쾌한 얼굴이야!!!"
84310100400-24 = "……랄까, 애초에 우린 헬멧 쓰고 있어서 얼굴도 안 보이잖아, 막 갖다 붙이지 말라고!!!"
84310100400-26 = "(……상쾌?)"
84310100400-27 = "그나저나 정말 죄송합니다만, 지금은 트레이닝을 할 수 있는 자리가 모두 차 있어서요. 곧바로 하시기에는 상황이 조금……"
84310100400-28 = "아, 아뇨. 괜찮습니다. 저는 그저 약간의 견학만 하러 왔을 뿐이라……"
84310100400-33 = "……!! 방금 들었어?"
84310100400-34 = "물론이지!! 자리!? 자리라고!? ……지금 자리가 없어서 못 한다고 했어!?"
84310100400-35 = "그럴 수는 없지! 이 거지같……"
84310100400-42 = "……즐겁고 상쾌한 운동, 우리만 한다는 건 너무 이기적이잖아! 안 그래!?"
84310100400-43 = "맞아, 맞아! 비켜줄 테니 너도 조금만 체험해 보라고! 영원히 다다를 수 없는 10이라는 숫자에!!!"
84310100400-48 = "……에."
84310100400-53 = "(뭐죠, 이 감각? 이 오한……. 절대로 엮여선 안 될 것 같은……)"
84310100400-54 = "(이건…… 마치…… 그래요.)"
84310100400-55 = "(……생존본능!!)"
84310100400-63 = "여러분……! 뉴 페이스의 회원분을 맞기 위해 구태여 그런 양보까지……!!"
84310100400-64 = "정말 감동적이군요. 이 또한 트레이닝으로 인한 긍정적 마음과 엔도르핀 분비의 효과겠지요."
84310100400-65 = "그렇게 돼서, 방금 이제 막 자리가 생긴 것 같군요. 새로 오신 회원님!!"
84310100400-66 = "자, 이제 이쪽으로 오셔서 저와 함께 트레이닝의 세계로……!"
84310100400-70 = "……어라?"
84310100400-74 = "……어디 가셨죠?"
