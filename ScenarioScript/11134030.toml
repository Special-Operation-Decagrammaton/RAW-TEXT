[translation]
11134030-1 = "센스;벼락치기 작전 1"
11134030-2 = "생각보다 꽤 효과가 있는 거 같은데 말이지."
11134030-3 = "……응? 무슨 효과……?"
11134030-4 = "아아……. 연주에 앞서 이론 공부부터 하자고 했던 거?"
11134030-5 = "음……. 확실히 나도 체감이 되는 거 같은데."
11134030-6 = "모름지기 훌륭한 장수란 문무를 겸비해야 하는 법. 경지에 이르기 위해서는 하나만 노릴 수 없다는 건가."
11134030-7 = "……그래서. 갑자기 그 이야기를 꺼내는 이유는?"
11134030-9 = "아니, 뭐. 달리 이유가 있겠어?"
11134030-10 = "이왕 이렇게 된 거, 아예 우리가 쓸 것 같은 범주의 이론은 처음부터 다 보고 들어가는 게 어떨까 해서."
11134030-11 = "과연. 매번 오가는 것보다, 한쪽을 마스터하고 넘어가는 게 효율적이라는 거지."
11134030-12 = "뭐……. 뭔가 말만 들으면 꽤 그럴싸하긴 한데……."
11134030-13 = "근데 진짜 괜찮겠어? 뭔가 도중에 지루해서 잘 것 같다는 느낌이……."
11134030-14 = "너처럼?"
11134030-15 = "너도 똑같잖아!!"
11134030-16 = "우리처럼?"
11134030-17 = "맞……는 말인데 뭔가 열 받네!!"
11134030-18 = "아하하……."
11134030-19 = "그, 그럼 일단 그렇게 해볼까? 나는 악보랑 책들 좀 챙겨올게."
11134030-20 = "좋아. 우린 그때까지 자리를 만들도록 하지."
11134030-21 = "……\"벼락치기 작전\", 시작이다!!"
