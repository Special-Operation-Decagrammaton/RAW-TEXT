[translation]
80000141-1 = "완벽했을지도 모를 계획"
80000141-2 = "[ns] \"어서 와, 케이 쨩!\""
80000141-3 = "하아……."
80000141-4 = "[s1] \"첫 인사가 한숨이라니…….\"\n[s2] \"하지만 그런 케이 쨩도 선생님은 완전 OK란다!\""
80000141-9 = "아, 제발 좀."
80000141-10 = "……."
80000141-11 = "물론 오겠다고 한 건 제가 맞긴 한데요. 그래도 말이죠."
80000141-12 = "……."
80000141-13 = "뭐, 됐어요. 빨리 용건이나 해결하고 가 버릴 거니까요."
80000141-14 = "자요. 받아요."
80000141-20 = "[ns]\"이것은……?!\""
80000141-21 = "오다 주웠어요."
80000141-22 = "여기 오는 길에, 왠지 생각나서 말이죠."
80000141-23 = "뭘 기대하신 거예요? 정성이 가득 들어간 수제 초콜릿? 마음이 듬뿍 담긴 고급 초콜릿?"
80000141-24 = "그럴 리가요! 선생님에게는 이 정도 시판 초콜릿이 딱 어울리니까 말이죠!"
80000141-26 = "(그런 것도 완전 좋다며 호들갑을 떨려다가.)"
80000141-27 = "(……다시 한번, 초콜릿을 관찰해 보았다.)"
80000141-29 = "[ns]\"흐음……?\""
80000141-30 = "왜, 왜 그래요? 그냥 시판 초콜릿이잖아요. 감사하게 먹기나 하시죠!"
80000141-31 = "[ns]\"흐음…….\""
80000141-33 = "[ns3](포장이 미묘하게…… 공장제 같지 않다…….)\n[ns4](초콜릿 크기가…… 살짝 들쭉날쭉해 보인다…….)\n[ns5](카카오 향이…… 유난히 진하다…….)"
80000141-39 = "(초콜릿을…… 먹는다!)"
80000141-43 = "크, 크흠……. 어, 어때요?"
80000141-44 = "[s] \"고마워, 케이 쨩.\""
80000141-45 = "네? 뭐가…… 요?"
80000141-46 = "[ns6]\"케이 쨩의 수제 초콜릿, 잘 먹었어.\"\n[ns7]\"참 짜더라.\""
80000141-49 = "네……?"
80000141-50 = "……!?!?!!!!!"
80000141-51 = "네????!!!!!"
80000141-57 = "(케이는 그대로 소파에 엎어져, 쿠션 사이로 머리를 숨겼다.)"
80000141-58 = "(그것참, 그렇게 타조처럼 행동해도 말이지.)"
80000141-68 = "악—!!! 악—!!! 아아아아악—!!!!!"
80000141-69 = "바보같이! 맛만 봤어도 알 수 있었을 텐데! 아아아아아악—!!!!!"
80000141-70 = "죽어! 죽으라고, 이 멍청이! 계획은, 계획은 완벽했는데—!!!!!"
80000141-72 = "[ns]\"내가 같이 안 죽어 줘도 될까?\""
80000141-73 = "좀 닥쳐요, 이 망할 선생아!!!!!"
80000141-80 = "(케이가(이) 쿠션을 힘껏 던졌다!)"
80000141-86 = "(선생님은(는) 어렵지 않게 받아냈다!)"
80000141-93 = "내놔요."
80000141-94 = "[s]\"싫어~ 케이 쨩이 준 케이 쨩의 수제 초코~\""
80000141-95 = "내놓으라고요! 나중에 제대로 된 거 줄 테니까!!!"
80000141-96 = "네? 그것도 좋지만, 이것도 버릴 수 없다고요?"
80000141-97 = "……이거야말로 세상에 하나밖에 없을 제 소금 초콜릿이니까……?"
80000141-101 = "!!!"
80000141-102 = "으그이이이이이이이익!!!!!"
80000141-109 = "(어떻게든 케이를 피해 도망 다니면서…… 초콜릿을 하나 더 먹었다!)"
80000141-111 = "[ns]\"음. 역시 이 케이 쨩의 수제 초콜릿.\""
80000141-112 = "네, 네에……?"
80000141-113 = "[s]\"짜구나.\""
80000141-114 = "이번에야말로 선생님을 죽이고!!!"
80000141-115 = "[s]\"그 대사 왔다아아아아!!!!!\""
80000141-116 = "저도!!! 죽겠어요오오오오오!!!!!"
80000141-129 = "말 걸지 마요."
80000141-130 = "네? 그래도 이 초콜릿, 분명 요긴하게 쓸데가 있을 거라고요?"
80000141-131 = "……."
80000141-132 = "어떤 때요?"
80000141-133 = "달콤한 것과 같이 먹으면, 단맛과 짠맛을 번갈아 가며 느낄 수 있을 테니 무한히 먹을 수 있다……?"
80000141-134 = "아니면 무더운 날에 급히 전해질과 에너지를 충전해야 할 때, 염분과 카카오 성분을 같이 섭취하면 더 힘이 날 거다……?"
80000141-135 = "……."
80000141-136 = "그걸 지금 위로라고 하고 있습니까, 이 인간아!!!"
80000141-137 = "……."
80000141-141 = "아뇨……. 제가 바보였으니까요. 이 일은……."
80000141-142 = "아아아아…… 진짜! 소금인지 설탕인지 맛만 봤어도……!!!"
80000141-143 = "[s]\"괜찮아, 케이.\""
80000141-144 = "네……?"
80000141-145 = "[s]\"정말 괜찮아. 진심으로 기뻤어.\""
80000141-150 = "……알면, 됐어요."
80000141-151 = "……헤헤."
80000141-153 = "(그 뒤로 아껴 두었던 달콤한 과자를 가져와서, 같이 먹었다.)"
80000141-154 = "(예상대로 단맛과 짠맛이 잘 어울려, 정말로 맛있었다.)"
80000141-160 = "(케이는 왠지 화가 나 있는 것처럼 보이기도 했지만.)"
80000141-166 = "(……정말은 그게 아니라는 걸, 어렵지 않게 알 수 있었다.)"
