[translation]
70016010-1 = "용궁으로 가는 길 1"
70016010-4 = "발키리 교정국에서의 대규모 탈주 사건에 관하여 자세한 소식이 들어왔습니다."
70016010-5 = "총학생회장의 실종 이래 혼란스러운 정국을 틈타 교정국에서 일곱 죄수가 탈주하였음이 조금 전 총학생회 성명을 통해 공식으로 확인되었습니다."
70016010-6 = "발키리 경찰학교에서는 전역에 갑호비상을 발령, 탈주자의 도주 경로를 원천 차단하기로-"
70016010-10 = "역시, 큰일을 벌이고 나면 이런 게 불편하네요."
70016010-11 = "이 시간대의 클래식 음악이 참 좋았는데, 속보 때문에 정규방송이 중지되니 말이죠."
70016010-16 = "……지금, 발키리 교…… 국에서 성명…… 현장……."
70016010-17 = "호오, 예정대로의 전파 음영지역이군요. 여기서 해산하도록 하죠."
70016010-25 = "후우, 갑갑했는데 이제야 좀 낫군요."
70016010-26 = "산소가 너무 많아서 강제로 유산소가 될까봐 걱정이지만, 역시 담장 너머가 좋아요."
70016010-27 = "앞으로 계획은 있나요?"
70016010-28 = "네에, 물론이죠. 오랜 친구들부터 만나러 가볼 생각이랍니다."
70016010-29 = "밀고한 덕분에 옥고로 근손실을 겪었으니, 헬멧단 분들의 몸으로 랫풀다운이라도 해보려고 한답니다."
70016010-30 = "출소 후 계획은 중요하죠. 즐거운 여정이 되시길."
70016010-35 = "……세간에서는 이럴 때 감사 인사를 한다고 하는 것 같다만."
70016010-36 = "아뇨. 그만두시죠. 당신에게 그런 부분을 요구하거나 기대하지 않으니까요."
70016010-37 = "큭큭큭……. 이해가 빠른 것은 좋은 일이지."
70016010-38 = "당신은 이제부터 뭘 할 생각이죠."
70016010-39 = "흐음……. 그렇군. 생각해 둔 것은 몇 가지 있었다만."
70016010-40 = "해묵은 은원을 청산하는 것이야말로, 마땅한 '인간'의 '도리'가 아닐까 하는데."
70016010-41 = "……당신이 세상의 도덕적 규칙에 대해 이야기할 때에는, 다른 사람에게 그 규칙을 적용해야 할 때뿐이긴 하죠."
70016010-42 = "그 대상이 누구인지도 짐작이 가지만……."
70016010-43 = "아뇨. 이 이상은 필요 이상의 참견이겠네요."
70016010-44 = "잘 알고 있군."
70016010-45 = "네. 부디 즐거운 청산 되시길."
70016010-49 = "그러면……."
70016010-53 = "흐음, 당신은 왜 그대로 있는 거죠?"
70016010-54 = "어서 나오시는 게 좋을 거예요. 차에 설치해 둔 소이탄이 곧 터질 거라서요."
70016010-58 = "여기 말고 좀 더 바다와 가까운 곳은 없느냐? 이곳은 여에게는 낯선 장소인지라……."
70016010-59 = "저는 컨설턴트고, 가끔씩 심부름꾼까지는 합니다만 택시 기사였던 기억은 없어서요."
70016010-60 = "이미 추적되고 있는 차를 이 이상 몰고 다니는 건 힘들단 말이죠."
70016010-61 = "그, 그럼 여는 어쩌란 말이냐? 이곳이 어딘지도 모르고, 여비도 없는데……."
70016010-62 = "키보토스의 대양을 공포에 떨게 한 <조수의 교룡>님 이시잖아요? 그 정도는 알아서 해내실 수 있을 거라고 생각하는데."
70016010-63 = "초 단위로 돌아가는 계획에서 더 이상 여유가 있지는 않으니, 이만 실례하지요."
70016010-64 = "으읏……."
70016010-70 = "아 참, 교정국에서 거울 정도는 보고 살았죠?"
70016010-71 = "이래저래 눈에 띄는 모습이기도 하고, 지금 발키리에서 열심히 찾아다니고 있으니 정체는 잘 숨기시길."
70016010-72 = "다음에 뵙죠. 절 찾을 필요는 없어요. 빚을 갚고 싶다면, 빚을 받고 싶을 때 제가 먼저 찾아갈 테니."
70016010-78 = "정체……."
70016010-82 = "바다는 도대체 어느 방향이란 말이냐……"
70016010-92 = "……사라졌나."
70016010-93 = "항구를 찾아야 하는데, 이곳은 밝아서 길잡이 별을 찾기도 어렵고……."
70016010-94 = "바람도…… 건물 사이로 엉켜서 방향을 읽을 수 없어……."
70016010-95 = "역시 육지는 싫단 말이다. 바다, 바다, 바다!"
70016010-96 = "바다가 짐을 기다리는 데 이곳에서 시간을 허비할 수는—!"
70016010-102 = "자아, 나왔습니다-! 돈코츠 라멘, 마늘 잔뜩!"
70016010-106 = "(끄응…….)"
70016010-107 = "(육지의 음식 주제에 냄새는 좋단 말이지. 역시 식사는 하고 탈옥할 걸 그랬나……)"
70016010-108 = "(몹시 원한다만……. 허나 내탕금이…….)"
70016010-112 = "(아니지, 바다에서는 여에게 모두가 음식을 바쳐왔지 않은가! 신경 쓸 것 없겠지!)"
70016010-113 = "이보거라—! 게 누구 없—"
70016010-120 = "하아, 입맛 없어……. 안 그래도 정신없는데 이젠 탈옥이나 하고 자빠졌어들……."
70016010-121 = "그래도 식사는 하셔야죠, 코노카 씨. 계속 대기하다가 이제 첫 끼 아니심까."
70016010-122 = "코노카 '씨'?! 아쭈, 이 자식이 강등됐다고 아주 친구먹지?! 응?"
70016010-123 = "케, 케엑!! 자, 장난임다!! 아악!! 폭력 반대!!"
70016010-125 = "이 언니가 강등된 게 웃기면, 넌 2계급 특진시켜줄게 짜샤!!!"
70016010-131 = "겨, 경찰불러어-!! 으갸악-!"
70016010-135 = "(바, 발키리……!)"
70016010-136 = "(저들이 육지의 트라이던트 같은 존재라고 했었나, 도망쳐야 해!!)"
70016010-141 = "응? 누가 부르지 않았나?"
70016010-142 = "대체 어떤 겁 없는 사람이 이걸 보고 불렀겠어요?"
70016010-143 = "에휴, 밥이나 먹자. 며칠 내내 잠을 못 잤더니 귀가 이상한가 봐……."
70016010-144 = "힘내십쇼 전 부국장님, 강등 하루이틀 일도 아니잖습니까."
70016010-148 = "놀리는 게 화난다고 임마, 놀리는 게!"
70016010-161 = "여기를 가도 경찰, 저기를 가도 경찰……"
70016010-162 = "도대체 저 발키리라는 녀석들은 어째서 이렇게 많은 거야? 부두의 갯강구 만큼이나 온갖 곳에 득실거리잖아!"
70016010-163 = "차라리 갯강구는 바닷 냄새라도 나지, 천박한 흙내음을 풍기는 녀석들에게 붙잡힐 수는 없지."
70016010-164 = "아무래도 두 발로 걸어 바다로 가는 건 어려워 보이는데……"
70016010-168 = "……아, 그래!"
70016010-169 = "교정국 TV의 드라마에서 차를 공짜로 탈 수 있는 방법이 있다고 했어. 분명히……."
70016010-170 = "고속도로에 서서 엄지를 올리고, 팔을 뻗고!"
70016010-171 = "음…… 한 팔만 내미는 거였나? 두 팔을 다 들어야 하나?"
70016010-178 = "앗, 왔다!"
70016010-179 = "좋아. 어이, 거기 달려가는 천박한 미물이어. 이 몸을 모실 영광을 누리게 해 주마!"
70016010-180 = "거기에 멈춰서서 머리를 조아리면—"
70016010-185 = "응……?!"
70016010-186 = "역시, 두 팔 다 들어야 하는 거였나?"
70016010-196 = "으으…… 팔 아파아아……."
70016010-203 = "자, 잠깐……!"
70016010-209 = "으으, 이젠 목도 말라. 배도 고프고……."
70016010-215 = "멈췄다!!"
70016010-222 = "히치하이크하게? 어디까지 가—"
70016010-227 = "이 무엄한 것! 여를 움직이게 만들다니, 버릇이 없구나!"
70016010-228 = "뭐, 뭐어?"
70016010-229 = "용왕이 부르는 데, 정위치에 정박하지 않고 먼 발치에서 오라가라 하다니. 여기가 바다였다면 널빤지 걷기형이로다!"
70016010-230 = "용왕……? 바다……?"
70016010-231 = "뭐야. 괴상한 옷차림인데, 어디 먼 학원에서 오기라도 한 거야?"
70016010-232 = "이제야 알아보는구나? 친히 알려주지, 이 몸은 조수의 교—"
70016010-237 = "아참, 교정국에서 거울 정도는 보고 살았죠?"
70016010-238 = "이래저래 눈에 띄는 모습이기도 하고, 지금 발키리에서 열심히 찾아다니고 있으니 정체는 잘 숨기시길."
70016010-244 = "교……."
70016010-245 = "교?"
70016010-246 = "교육을 받고 있는 평범한 학생이다만."
70016010-247 = "……."
70016010-248 = "별 이상한 학생 다 보겠네, 차에서 떨어져!"
70016010-253 = "으으……."
70016010-259 = "자, 잠깐 기다려어어!!"
70016010-263 = "큰일 날 뻔했네……. 정체를 숨겨야 하는데 나도 모르게 버릇대로……"
70016010-264 = "다음에는 조심해야겠어. 여기까지 와서 다시 교정국으로 돌아갈 수는 없으니까."
70016010-265 = "최대한 말을 아끼며…… 조심조심……."
70016010-270 = "온다!"
70016010-276 = "히치하이킹이야?"
70016010-277 = "(함부로 말하면 여를 의심할지도 모르니 최대한 정체를 숨기는 게 좋겠군.)"
70016010-278 = "(수상하지 않게, 말을 아끼며……)"
70016010-279 = "후, 후, 후……"
70016010-280 = "글쎄, 어떨까……?"
70016010-281 = "엥?"
70016010-282 = "어디에 가려고 하는 거 아니야? 엄지 들고 차 세웠잖아?"
70016010-283 = "그, 그러니까 여는 말하지 않을 테니 맞춰보거라!"
70016010-284 = "뭐야, 장난치려고 세운 거야? 바빠 죽겠는데 진짜!"
70016010-291 = "아, 아앗……."
70016010-303 = "저기요? 손님?"
70016010-307 = "아? 으응……?"
70016010-308 = "안 타시나요? 이게 오늘 마지막 버스인데요."
70016010-309 = "그게, 그러니까……."
70016010-310 = "이런 품위 없는 바지선 같은 교통수단을 이 몸이 이용할 리가 없잖아!"
70016010-311 = "뭐…… 물론 공짜로 태워주겠다고 간청한다면 한 번 쯤은 고려해볼 수도 있지만—"
70016010-315 = "……."
70016010-316 = "네에, 네에. 일 끝나기 전에 별꼴을 다 보네."
70016010-323 = "우으으…… 이래서 육지는 싫어……"
70016010-324 = "바람도 파도도 없고…… 무얼 하려고 해도 돈이 필요하니까……"
70016010-327 = "바다로 돌아가고 싶어……"
70016010-336 = "쿠울……."
70016010-342 = "으앗?!"
70016010-343 = "아가씨, 괜찮아요? 어디 아파요?"
70016010-344 = "왜 길가에서 그러고 있어요? 얼마나 이러고 있던 거예요?"
70016010-345 = "노, 놀랐잖아! 여를 놀라게 하다니, 무엄한—"
70016010-350 = "……바다? 여기서 바다 냄새가 나."
70016010-351 = "혹시 이 차, 바다로 가는 것이냐?"
70016010-352 = "바다냄새? 아아, 아까 생선 상자를 실어서 그런가."
70016010-353 = "바다 쪽으로 가기는 하는데, 조금 돌아서 가는데요."
70016010-354 = "카네사키 항구 쪽인데, 괜찮으면 그쪽으로 태워다 줘요?"
70016010-358 = "좋다, 좋아! 바다라면 어디든지!"
70016010-365 = "영차……"
70016010-366 = "그럼 출ㅎ…… 출발!"
70016010-367 = "(바다라면 어디든지, 라니.)"
70016010-368 = "(뭐. 말 못 할 고민이라도 있는 건가. 청춘이구만-)"
70016010-369 = "네, 네. 출발합니다."
70016010-370 = "바다까지는 시간이 좀 걸릴테니까, 쉬고 있어요."
70016010-371 = "물론! 얼마든지 기다릴 수 있다! 빠르면 더 좋겠지만!"
