[translation]
10016160-1 = "후일담;실행위원회 편"
10016160-6 = "하아…… 따듯한 차를 마시니 몸이 조금은 풀리는 것 같네."
10016160-7 = "하루의 피로가 이 한 잔에 모두 씻겨 내려가는 느낌이 들어……"
10016160-8 = "이건 정말…… 맛있는 홍차네요. 이렇게 이국적이고 달콤한 향이 가미된 홍차는 처음 마셔 보는 것 같아요."
10016160-9 = "게다가 물의 온도도 과하거나 미지근하지 않아서, 떫은맛 없이 좋은 향만 잘 우러난 것 같네요."
10016160-10 = "제가 전에 차를 달였을 때는 이 정도로 풍부한 향이 나지 않았었는데…… 정말 대단하세요, 하스미 씨."
10016160-14 = "후후, 티파티에서 좋은 홍차를 보내 주신 덕분이지요."
10016160-15 = "찻잎은 충분하니 혹시 더 마시고 싶으신 분은 제게 말씀해 주세요."
10016160-19 = "어머, 찻잔이 비었군요. 한 잔 더 드릴까요?"
10016160-20 = "네, 부탁드립니다."
10016160-29 = "……트리니티 정의실현부의 부부장님은 차를 우리는 일에는 엄격하시다고 들었었는데, 그 소문이 사실이었나 보네요."
10016160-30 = "사람의 손으로 내린 차가 이렇게 정교하고 세련된 맛을 갖추고 있을 거라고는 생각지 못했어요."
10016160-31 = "귀한 경험을 하게 해 주셔서 감사합니다."
10016160-32 = "제가 우린 차가 마음에 드셨다니 오히려 제가 더 기쁘네요."
10016160-36 = "그…… 우시오 노아 씨, 맞으시지요……?"
10016160-37 = "지나가면서 몇 번 마주친 기억은 있는데, 어쩐지 실행위원회 사무실에서는 처음 뵙는 것 같아서요."
10016160-38 = "네, 그러고 보니 정식으로 인사드리는 건 처음이네요. 유우카 쨩에게 이야기는 자주 들었답니다."
10016160-39 = "저는 이번 <황륜대제>에서 현장 관리 업무를 주로 했기 때문에, 사무 업무를 주로 보신 하스미 씨와는 접점이 거의 없었던 모양이에요."
10016160-40 = "그랬었군요. 인사가 늦어져서 실례했습니다."
10016160-41 = "하스미 씨, 이번 대회에서는 마지막 계주를 제외하고는 경기에 일절 참여하지 않으셨지요?"
10016160-43 = "사격이나 공 던지기처럼 하스미 씨의 장기를 살릴 수 있는 대회도 제법 있었는데……"
10016160-44 = "어째서 경기에 참여하시지 않으셨던 건가요?"
10016160-45 = "그건……"
10016160-46 = "솔직하게 말씀드리자면, 축제의 안전을 책임지는 사람으로서 분위기에 젖어 즐거워하는 것은 도를 벗어난 행동이라고 생각했기 때문입니다."
10016160-47 = "제가 축제를 즐기는 만큼, 누군가가 희생을 하는 건 아닐까 걱정되어 일부러 눈을 돌린 채 의무에만 몰두하려 했지요."
10016160-48 = "……결과적으로는 그러지 못했지만요."
10016160-49 = "저도 이번 황륜대제를 준비하면서 그런 건의를 자주 들었답니다."
10016160-50 = "다른 사람의 행복이 나에게 불행을 가져다주는 것만 같다고."
10016160-51 = "모두가 함께 즐기며 만들어 가는 모두의 축제라는 건, 허상에 불과하다고."
10016160-52 = "하지만 세상의 모든 사건은, 노력 여하에 따라 언제든 일어날 수 있는 법이니까요."
10016160-54 = "유우카 쨩은 합리적이지 않다며 자주 불평하곤 하지만…… 저는 이 불합리를 정말로 정말로 좋아한답니다."
10016160-55 = "……."
10016160-56 = "하스미 씨는 어떠셨나요. 이 불합리한 축제가 충분히 즐거우셨나요?"
10016160-57 = "네. 정말로 즐거운 축제였답니다."
10016160-58 = "후후, 그렇게 말씀해 주시니 밤새워 <황륜대제>를 준비한 보람이 있네요."
10016160-59 = "이렇게 다른 학원의 학생들과 차를 나누어 마시며 하루를 마무리하는 것도 나쁘지 않군요."
10016160-61 = "꼭 이런 축제가 아니더라도 종종 이런 자리를 만들어야겠어요."
10016160-65 = "그런데 하스미 씨, 이런 말을 알고 계시나요?"
10016160-67 = "……끝날 때까지는 끝난 게 아니라고."
10016160-68 = "……네? 그게 무슨 말씀인가요?"
10016160-69 = "아까도 말씀드렸지만…… 세상의 모든 사건은, 노력 여하에 따라 언제든 일어날 수 있는 법."
10016160-70 = "혹시 또 모르잖아요? 기운 넘치는 일부 학생들이 <후야제>에서 예상치 못한 방법으로 사고를 저지를지도……"
10016160-71 = "물론 오늘 하루 종일 벌어진 일을 떠올려 보면, 우려하시는 바도 이해가 됩니다만."
10016160-72 = "그래도 각 학원의 학생회 임원들이 모여 있는 장소에서 섣불리 소동을 일으키는 바보가 있을 리가—"
10016160-77 = "하스미 님, 큰일입니다!"
10016160-78 = "게헨나의 일부 학생들이 <후야제>의 캠프파이어에서 바비큐를 하겠다며 안전 요원들과 실랑이를 벌이고 있습니다!"
10016160-79 = "게다가 일부 학생들이 불꽃의 색이 마음에 들지 않는다며 모닥불에 금속 가루를 던져 넣으려 하고 있어서……"
10016160-80 = "………."
10016160-81 = "어머나…… 큰일이네요."
10016160-82 = "지금 연락이 되는 정의실현부 부원들을 당장 불러주세요."
10016160-83 = "그리고 애슬레틱 스타디움 내에 설치된 소화 설비도 바로 쓸 수 있도록 준비 부탁드립니다."
10016160-84 = "……게헨나의 선임행정관은 어디에 갔죠?"
10016160-85 = "저, 그게…… 아코 행정관은 히나 부장을 찾아야 한다며 아까 전부터 자리를 비워서……"
10016160-86 = "게다가 경기장의 소화 시설은 온천 개발에 쓴다며 게헨나의 어느 동아리가 모두 끌고 가서 지금은 사용할 수 없는데요……"
10016160-87 = "…………."
10016160-92 = "큰일이야! 게헨나의 급식 시설에서 도망친 괴생명체가 군중 사이에 섞여 들었나 봐!"
10016160-93 = "우와— 팬케이크가 살아서 날아다닌다!"
10016160-98 = "절대로……"
10016160-99 = "절대로 용서 못 합니다, 게헨나——!"
