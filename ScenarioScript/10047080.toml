[translation]
10047080-1 = "제8화;접선"
10047080-2 = "그러니까…… 사감대 기숙사를 가로질러 마법진을 그려야 한다는 거네요."
10047080-3 = "맞아……. 리스크가 크지."
10047080-4 = "후후, 예상치 못한 곳에서 갑자기 찾아온 시련. 그것을 이겨내는 것도 주인공의 역할이겠죠."
10047080-5 = "포기할 때는 포기할 줄 아는 것도 주인공이라고!"
10047080-6 = "뉴후후. 안타깝지만, 제 마도서에 <포기>라는 단어는 없습니다."
10047080-7 = "사감대 쪽을 마지막에 하면 어떻게든 될 것 같긴 한데……."
10047080-8 = "위험한 순간이 되면…… 내가 미끼가 될게."
10047080-9 = "까마귀와 고양이들이 도와주면…… 어떻게든 될 거야."
10047080-11 = "카노에 선배……!"
10047080-15 = "마스터. 이렇게 진행해도 괜찮을까요?"
10047080-16 = "[s1] \"응. 그게 모두의 꿈과 연결되어 있다면.\"\n[s2] \"나도 어떻게든 도와줄게.\""
10047080-19 = "역시 당신은 주인공의 곁을 지키는 감초이자, 모두의 마스코트 같은 존재."
10047080-20 = "제가 사람을 제대로 본 것 같네요."
10047080-21 = "[s] \"일단 말해두지만, 위험한 재료로 마법진을 그리는 건 금지야.\""
10047080-22 = "뉴후후, 물론이죠! 저도 그렇게 무모하진 않습니다!"
10047080-23 = "폭발시키면 더 완벽할 것 같다는 생각은 있지만……."
10047080-24 = "선배……."
10047080-25 = "아하핫! 농담입니다, 농담! 정말로요!"
10047080-26 = "그럼 마스터의 말씀처럼 안전한 재료를 사용하는 방향으로 계획을 잡아보죠."
10047080-27 = "와일드헌트 학원에 새겨진 고대의 마법진을 부활시켜 모두의 꿈을 이루는 작전!"
10047080-28 = "작전명, <발푸르기스의 밤>입니다……!"
10047080-29 = "으으, 결국 또 이렇게 되는 건가……."
10047080-31 = "그런데 재료는 어떻게 하죠? 학원 전체에 마법진을 그리려면 뭐가 됐든 재료가 상당히 많이 필요할 텐데……."
10047080-32 = "학교 내부에서 구했다간 사감대에게 꼬리가 밟힐지도 몰라요."
10047080-33 = "사고 친지 얼마 안 되기도 했고, #n수상한 짓을 한다면 바로 찍힐 거예요……."
10047080-34 = "그건 걱정 마. 안전하게 물건을 구할 방법을…… 알고 있으니까……."
10047080-35 = "[s] \"어떤 방법인데?\""
10047080-36 = "선생에겐 비밀……."
10047080-37 = "왜냐면…… 그게 더 재미있을 것 같으니까. 히히."
10047080-38 = "아무튼 위험한 재료는 없을 테니 안심해."
10047080-39 = "그럼…… 작전일에 다시 보자고, 선생."
10047080-40 = "보름달이 뜨는 날 밤."
10047080-41 = "발푸르기스의 밤에."
10047080-42 = "히히…… 이히히힛……!"
10047080-43 = "[ns] \"그, 그래. 작전일에 다시 보자.\""
10047080-45 = "(오늘은 일단 샬레로 돌아가자.)"
10047080-48 = "(다음 날.)"
10047080-53 = "날이 밝았군……."
10047080-54 = "그럼…… <접선>을 시작해 볼까……."
10047080-55 = "접선이요?"
10047080-56 = "오컬연의 회장은 너니까 슬슬 알아두는 게 좋겠지……."
10047080-57 = "따라와, 에리 쨩…… 새로운 세계를 보여줄게……."
10047080-67 = "여기서 누군가를 만나는 건가요?"
10047080-68 = "쉬잇…… 오고 있어."
10047080-75 = "정지. 움직이면 쏜다……."
10047080-76 = "어…… 네?!"
10047080-77 = "고통은 지나가지만……."
10047080-82 = "아, 아름다움은 계속되는 법이죠."
10047080-83 = "……."
10047080-84 = "저는 삶에서 결정적인 순간을 찾으려 해요."
10047080-85 = "삶의 모든 순간이…… 결정적인 순간이야……."
10047080-86 = "오오, 뭔가 마력이 넘치는 대화네요!"
10047080-87 = "흐우우우……."
10047080-88 = "여기서 암구호를 아는 분을 만나다니. 왜 하필 저에게……?"
10047080-89 = "서둘러서 부탁하고 싶은 게 있거든."
10047080-93 = "알겠습니다. 일단 조용한 곳으로……."
10047080-96 = "……이곳이라면 당분간 아무도 오지 않을 거예요."
10047080-97 = "그래서…… 저에게 부탁하고 싶은 게 뭐죠?"
10047080-98 = "이 쪽지에 적은 것들을 지정한 곳에 <파종>해줘."
10047080-99 = "희망 일자는…… 이번 보름달이 뜨기 전까지야."
10047080-108 = "이걸…… 이렇게 많이요? 어디에 쓰려고요?"
10047080-109 = "히히…… 조만간 알게 될 거야."
10047080-110 = "위험한 일에 쓰는 건 아니죠?"
10047080-111 = "그럴 리가."
10047080-112 = "믿고 해달라고. 보수는 선입금해 줄 테니까……."
10047080-117 = "흐우우우……. 알겠어요. 구해 드릴게요."
10047080-118 = "그럼…… 잘 부탁해, 미요 쨩. 히히……."
10047080-119 = "아, 성함이 미요 씨였군요! 반갑습니다! 저는 시라오 에리! 에리라고 불러주세요!"
10047080-120 = "아…… 네. 반가워요."
10047080-121 = "미요 씨는 비밀 거래를 주로 하는 분이신가 보네요?"
10047080-122 = "어쩌다 보니요……."
10047080-123 = "……하아, 진짜 이번까지만 하고 관둬야지."
10047080-124 = "그럼 의뢰는 수락했으니 저는 이만……."
10047080-129 = "말은 저렇게 하지만 실력은 확실한 친구야……."
10047080-130 = "우리 학원에 정상 루트로는 들어올 수 없는…… 정말 다양한 물품을 입수해 주지."
10047080-131 = "사감대의 감시를 어떻게 뚫는 거죠? 공간이동 마법이라도 사용하는 건가요?"
10047080-132 = "어쩌면 그럴지도……."
10047080-133 = "히히, 일단 볼일은 끝났으니 돌아가서 보고 하자고……."
10047080-135 = "(잠시 후…….)"
10047080-140 = "자, 이걸로 재료 수급이 끝났으니 남은 건 실전뿐이군요."
10047080-141 = "실행일은…… 보름달이 뜨는 날 밤. 앞으로 얼마 남지 않았어……."
10047080-145 = "역시 레나 쨩은 내키지 않는 건가요?"
10047080-146 = "……나도 웬만하면 어울려주고 싶은데 말이야. 이번 거는 너무 위험해."
10047080-147 = "저번엔 무사히 풀려났지만 계속 교칙을 어기면 성적에 영향을 받는다고."
10047080-148 = "다들 그만하면 안 돼? 굳이 이런 거 하지 않아도 재미있는 건 많잖아?"
10047080-149 = "레나 쨩의 마음도 이해하지만, 진짜 고대의 마법진이 발견되었어요.#n무려 소원이 이루어진다는 마법진이요!"
10047080-150 = "그렇다면 직접 확인해 보는 것이 오컬트를 연구하는 사람의 자세라 생각해요!"
10047080-151 = "단순히 액막이로 만들어졌다면?"
10047080-152 = "과거의 예술이란 그런 작풍의 것도 많았다고 수업에서 말했었잖아?"
10047080-153 = "그렇다면…… 마법이 발동될 리 없어."
10047080-154 = "모두가 고생만 하고 또 반성실에 갇히게 될 거야."
10047080-155 = "정말…… 그래도 할 생각이야?"
10047080-159 = "레나 쨩은…… 등반가가 왜 등산을 한다고 생각해……?"
10047080-160 = "그건…… 그곳에 산이 있기 때문이야……."
10047080-161 = "나도 마찬가지야. 내가 오컬트를 연구하는 건……. 그곳에 오컬트가 있기 때문이지."
10047080-162 = "저도 레나 쨩처럼 이번 일이 위험하다고는 생각해요."
10047080-163 = "하지만…… 만약 실패한다 해도 해보고 싶어요. 무려 소원이 이루어지는 마법이잖아요?"
10047080-164 = "모두의 꿈을 이룰 수 있는 방법이 있을지도 몰라요!"
10047080-165 = "예술이란 끝없는 도전이 있었기에 지금처럼 발전할 수 있었던 것."
10047080-166 = "저는 이번 일도, 그러한 도전 중 하나라고 생각해요."
10047080-167 = "물론 모든 도전이 성공하는 건 아닙니다. 엉망진창 실패할 때도 있겠죠."
10047080-168 = "하지만 아직 해보지 않았잖아요?"
10047080-169 = "그러니 저는 망설임 없이 무대에 오를 거랍니다. 노력이 깃든 무대엔 반짝임이 있다는 걸 알기에."
10047080-170 = "그리고 혹시 아나요? 진짜로 우리의 소원이 이루어질지."
10047080-175 = "하아, 역시 다들 그렇게 나오네."
10047080-176 = "그렇다면 나도 말해둘게."
10047080-177 = "……난 선배들이 싫지 않아. 여러 사건에 휘말리긴 했어도, 어울리면 적당히 재미있었어."
10047080-178 = "하지만 아무리 생각해도 이번 일은 내키지 않아."
10047080-179 = "……애초에 난 오컬트 같은 거 믿지 않는걸."
10047080-183 = "그러니까…… 난 이번 일에서 빠지겠어."
