[translation]
1601103-1 = "레몬 벌꿀 절임"
1601103-2 = "(하스미가 기다리고 있다던 장소는 조리실이었다.)"
1601103-6 = "와 주셔서 감사합니다, 선생님. 이쪽입니다."
1601103-13 = "[ns1] \"……하스미? 그 저지…….\"\n[ns2] \"마음에 들었던 모양이네, 그 상태…….\""
1601103-16 = "음? 그게 무슨 말씀이신지……."
1601103-17 = "……네? 혼잣말이셨다고요?"
1601103-18 = "아아……. 네."
1601103-19 = "아. 이거 말씀이신가요?"
1601103-23 = "대단한 것은 아니고, <레몬 벌꿀 절임>입니다. 그러잖아도 이것 때문에 연락드렸던 것이라……."
1601103-24 = "본래 저희 정의실현부 부원들을 위해서 만들고 있었습니다만, 역시 선생님께도 한 병 드리고 싶다는 생각이 들었습니다."
1601103-25 = "사양하실 필요는 없어요. 양은 넉넉하니까요."
1601103-26 = "아마도 내일은 온종일 바쁘셔서 따로 챙기실 시간은 없으실 것 같은데, 괜한 부담만 아니시라면……."
1601103-27 = "[s3] \"부담이라니 당치도 않지.\"\n[s4] \"고마워. 잘 먹을게.\""
1601103-30 = "다행이군요."
1601103-31 = "받아 주셔서 기쁩니다. 그럼 이쪽 병으로……."
1601103-36 = "……네?"
1601103-37 = "매니저……같은 역할이냐고요? 누가……."
1601103-38 = "……아. 저 말씀이십니까?"
1601103-39 = "음. 약간은 그런 일도 겸하고 있긴 합니다만……."
1601103-43 = "……아……."
1601103-44 = "[s5] \"……하스미?\"\n[s6] (불길한 기척이……!!)"
1601103-47 = "……그……. 혹시……."
1601103-51 = "……혹시 그래 보이나요? 아니 역시 좀 그런 느낌인가요?"
1601103-52 = "선생님께서도 그렇게 보이시나요!? 학생보다는 보호자랄까……."
1601103-53 = "학부모랄까……!! 그런 쪽의……!?"
1601103-54 = "[s7] \"하, 하스미. 우선 진정하고……!\"\n[s8] \"그, 그런 이야기가 아니야!!\""
1601103-57 = "아, 아니었나요?"
1601103-58 = "그렇군요. 죄송합니다……. 저도 모르게 당황해서 그만."
1601103-59 = "후……."
1601103-60 = "또 선생님 앞에서 이런 실수를 하고 마는군요. 이러면 안 된다고 생각하면서도 계속 의식하게 됩니다."
1601103-61 = "이왕이면 항상 좋은 모습을 보여드리고 싶은데……."
1601103-62 = "후…………."
1601103-63 = "……네?"
1601103-64 = "매니저 이야기는 그런 의미가 아니셨다고요? 그러면……."
1601103-65 = "[s9] \"그런 것도 하스미의 매력이라고 생각하니까.\"\n[s10] \"오히려 하스미가 챙겨줄 학생들이 부러운걸.\""
1601103-70 = "그, 그게 무슨 말씀이신지……. 당치도 않습니다. 딱히 대단한 것도 아닌걸요."
1601103-71 = "선생님께서도 필요하시다면 언제든지 이런 것 정도는 제가……."
1601103-72 = "……아."
1601103-73 = "아, 아니 그런 의미가 아니었습니다."
1601103-74 = "그러니까 제 말은, 그게……."
1601103-75 = "[s11] \"오, 그럼 가끔 부탁해볼까?\"\n[s12] \"나야 늘 환영이지. 고마워, 하스미.\""
1601103-80 = "……선생님……."
1601103-81 = "정말이지 못 당하겠군요. 일부러 그런 말씀까지 해주시고……."
1601103-82 = "평소 같았다면 굳이 그런 말씀 해주지 않으셔도 된다고 정중히 거절했겠습니다만……."
1601103-83 = "지금은 왠지 그러고 싶지 않은 기분이네요."
1601103-84 = "이왕 선생님께서 그리 말씀해주신 거니, 이번에는 그 기회를 잡아보도록 할까요."
1601103-85 = "그럼 가끔 이런 걸 들고 찾아뵈어도, 내치지 않으실 거라는 의미로 기억해 두겠습니다."
1601103-86 = "……후후."
1601103-87 = "[s13] \"어째 평소보다 텐션이 좀 높네.\"\n[s14] \"제복이 아니라 편한 복장이라서 그런 건가?\""
1601103-88 = "그렇게 보이실 수도 있겠군요. 후후……."
1601103-89 = "아니요. 옷과는 관계없는 이야기지요."
1601103-90 = "……이건 선생님이 잘못하신 거니까요."
1601103-91 = "아무튼 그렇게 알고 있도록 하겠습니다."
1601103-92 = "감사합니다. 늘 그렇듯 또 챙겨 주셔서, 그리고……."
1601103-98 = "……이렇게 제가 챙겨 드릴 기회를 주셔서."
1601103-100 = "(이후 하스미와 함께 남은 레몬 벌꿀 절임들을 모두 만들어 담았다.)"
1601103-101 = "(정의실현부 모두에게 주기 위해서인지 엄청난 양이었지만, 하스미는 작업 내내 늘 즐거운 분위기였다.)"
