[translation]
1009702-1 = "Explosive Hazards"
1009702-2 = "(모에의 연락을 받고 그녀가 가르쳐 준 장소로 나가보았다.)"
1009702-3 = "(해변의 그늘진 천막 아래에서 지루한 듯 하품을 하는 모에의 모습이 보였다……)"
1009702-7 = "하아암……"
1009702-8 = "아, 선생님. 와줬구나!"
1009702-9 = "할 일도 없어서 심심하던 차라…… 선생님이 오길 기다리고 있었어. 후후."
1009702-10 = "자, 여기 앉아서 나랑 수다나 떨자구."
1009702-11 = "[s] \"다른 RABBIT 소대원들은?\""
1009702-12 = "다른 소대원들은 작전 때문에 조금 멀리 나갔어."
1009702-13 = "나는 관제나 후방 지원 업무 때문에 이렇게 통신 장비 앞에 앉아서 기다리고 있지만……"
1009702-14 = "요즈음은 RABBIT 소대도 꽤 노련해져서, 오퍼레이터가 할 일도 크게 없단 말이지."
1009702-15 = "지원 업무라 해도 가만히 자리에 앉아서 연락을 기다리는 게 대부분인지라."
1009702-16 = "[s] \"……그래서 말동무로 나를 불러낸 거구나.\""
1009702-17 = "정답!"
1009702-18 = "지루하다고는 해도 언제 연락이 올지 모르니 자리를 비울 수도 없고, 시간 때우기 좋은 소일거리도 없었던 지라……"
1009702-19 = "마침 근처에 선생님이 있는 것 같아서 불러내 봤어."
1009702-20 = "[s1] \"말동무를 하는 것뿐이라면 괜찮지만……\"\n[s2] \"나도 재미있는 이야깃거리는 딱히 생각나지 않는데.\""
1009702-23 = "에이, 선생님이 직접 왔는데 재미있는 이야깃거리가 따로 뭐가 필요하겠어."
1009702-24 = "최근에 새로 신경 쓰이는 학생이 생겼다든가—"
1009702-25 = "[s] (뭔가 걸스 토크 같은 주제네……)"
1009702-26 = "아니면 신경 쓰이는 새로운 폭약이 생겼다든가! 하아, 하아……"
1009702-27 = "[s] (……역시 착각이었나?)"
1009702-35 = "어라, 발키리의 해경 학생들이잖아? 이른 시간부터 부지런하기도 해라……"
1009702-36 = "그러고 보니 발키리 경찰학교의 제식 수영복은 꽤 노출도가 높은 비키니 형태네."
1009702-37 = "원래부터 발키리의 제복은 예쁜 것으로 유명했지만, 제식 수영복에도 저렇게 공이 많이 들어갔을 줄이야……"
1009702-38 = "[s] \"응, 그렇네.\""
1009702-42 = "쿠히히히……"
1009702-43 = "선생님, 방금 시선이 음흉했는데."
1009702-44 = "곁눈질로 발키리의 학생들을 쳐다보고 있었지?"
1009702-45 = "[s3] \"쳐다보지…… 않았는데요?\"\n[s4] \"……차, 착각입니다만?\""
1009702-48 = "에이, 부정할 필요 없어. 노출도가 높은 수영복에 눈길이 가는 건 자연스러운 현상이니까."
1009702-49 = "왜, 노출도가 높은 의상을 보면 '파괴력이 높다'고들 말하잖아?"
1009702-50 = "거대한 폭발을 목도하면 눈을 뗄 수 없는 것처럼, 노출도가 높은 비키니에 시선이 가는 건 자연스러운 생리현상이지."
1009702-51 = "……그렇게 생각하면 비키니를 좋아하는 대부분의 사람들은 내심 폭발을 동경하고 있는 걸지도. 후후, 후후후……"
1009702-52 = "[s] \"그건 다소 과한 궤변이라고 생각하지만……\""
1009702-56 = "[ns] \"그렇게 말하는 걸 보니 모에도 비키니를 좋아하는 거야?\""
1009702-57 = "그야 물론이지!"
1009702-58 = "노출도가 높은 수영복은 보는 것만으로도 아슬아슬한 파멸이 느껴지니까."
1009702-59 = "수영이란 온몸을 사용하는 전신 운동. 특히나 저항이 큰 물속에서 팔다리를 움직이다 보면 아찔한 상황이 발생할 때가 종종 있지."
1009702-60 = "그런데 걷는 것만으로도 앞뒤가 신경 쓰이는 짧은 천 조각으로 몸을 가린 채 수영을 한다니……"
1009702-61 = "목적과 모순되는 그 불합리함이…… 언제 발생할지 모르는 파멸적인 상황이……!"
1009702-62 = "상상하는 것만으로도 참을 수가 없어! 하아, 하아……"
1009702-63 = "[s] \"이, 일단 진정해……\""
1009702-67 = "[ns5] \"하지만 그래서 요새는 비키니 위에 겉옷을 걸치기도 하잖아?\"\n[ns6] \"모에도 상의 위에 후드를 걸치고 있고.\""
1009702-70 = "아, 그건 말이지……"
1009702-71 = "사실, 내가 일부러 후드를 입고 온 건 안에 '위험한 것'을 숨기고 있기 때문이야."
1009702-72 = "단순한 비키니와는 비교도 할 수 없을 정도의 파괴력을 지닌 존재가……"
1009702-73 = "[s7] \"비키니보다 훨씬 파괴력이 강한 존재라면……\"\n[s8] \"……서, 설마?\""
1009702-76 = "후후, 아마 선생님이 상상하고 있는 그게 맞을 거야."
1009702-77 = "내가 이 후드를 벗는 것만으로도 사람들이 비명을 지르고, 경악하고, 일대에 혼란이 일어나겠지……"
1009702-78 = "아아…… 아아아…… 벌써 상상만 했는데도 몸이 오싹오싹해……"
1009702-79 = "어, 어쩌지. 선생님? 파멸적인 미래를 상상했더니 심장이 두근거리고, 이 후드 안의 '위험한 것'을 사람들에게 보여주고 싶어서 참을 수가 없어!"
1009702-80 = "[s9] \"잠깐, 기다려!\"\n[s10] \"도대체 안에 무얼 입고 있는 거야?\""
1009702-83 = "크히히…… 그렇게 말하니 더욱 보여주고 싶어졌는걸……"
1009702-84 = "두 눈으로 똑똑히 봐. 비키니보다 훨씬 강력한 파괴력의……"
1009702-90 = "C형 복합 폭발 물질이야!"
1009702-94 = "[ns] \"………뭐?\""
1009702-96 = "안 그래도 어제 다른 소대원들 몰래 신형 플라스틱 폭약을 구입했거든."
1009702-97 = "이 귀여워 보이는 쿼터 파운드 블록만 하더라도 전차 한 대는 가볍게 날려버릴 수 있을 정도의 화력을 지니고 있다고. 후후……"
1009702-98 = "물론 다른 소대원들이 보면 잔소리를 할 것 같아서 이렇게 옷 속에 숨겨 두었는데—"
1009702-99 = "어때, 선생님. 보는 것만으로도 숨이 가빠질 정도의 파멸적인 광경이지 않아?"
1009702-100 = "후줄근해 보이는 겉옷 속에 이렇게 흉악한 물건이 숨겨져 있다는 사실을 모두가 알게 된다면…… 분명 파멸적인 반응이 돌아오겠지? 하아, 하아……"
1009702-101 = "[s] \"……모에.\""
1009702-102 = "응? 왜 그래, 선생님?"
1009702-107 = "가, 갑자기 그렇게 무서운 얼굴로……"
1009702-108 = "[s] \"폭탄은 위험하니 압수입니다.\""
1009702-109 = "어째서~?!"
1009702-111 = "(이후 폭탄을 압수하고, 모에에게 폭발물의 취급에 대해 엄중히 주의를 주었다.)"
1009702-112 = "(……그리고 야외에서 함부로 겉옷을 걷어 올리는 행위에 대해서도 단단히 주의를 주었다.)"
