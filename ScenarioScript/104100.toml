[translation]
104100-1 = "제10화;에필로그 2"
104100-3 = "다들 파이팅이에요……!"
104100-4 = "끄응…… 하, 하나도 모르겠어……. 전혀……."
104100-5 = "후후후…… 모두들 이번에 활약한다고 시험공부를 전혀 못 했으니까요."
104100-6 = "응. 아는 문제가 단 하나도 없어. 하지만 그럼에도……."
104100-7 = "아니, 그건 헛된 게 맞거든? 최선을 다해봤자 소용없잖아! 주관식인데……."
104100-8 = "……응."
104100-9 = "후후후♡ 그러네요. 이걸로 보충수업부는 또 연장이네요."
104100-10 = "아우우……."
104100-12 = "그럼, 조심해서 가, 삿 쨩."
104100-13 = "하, 하지만……."
104100-14 = "쓸데없는 소리 하지 마. 자아찾기를 도중에 그만두는 게 어디 있어?"
104100-15 = "헤헤헤…… 네 맞아요. 도중에 포기하면 안 되니까요."
104100-16 = "……."
104100-17 = "괜찮아. 아직 해야 할 일들도 많고, 보고 싶은 것도 많이 있잖아. 삿 쨩은."
104100-21 = "우리는 이제 삿 쨩이 보살펴야 하는 아이들이 아니니까. 다녀와."
104100-22 = "……알겠어."
104100-28 = "(삐삑-) 고용주. 나다."
104100-29 = "헬멧단!! 빨리 이쪽으로 집결하지 못해?!"
104100-30 = "그놈들, 그놈들을 치러 갈 거다!! 이번에 펑크냈으니까 56시간은 무급 노동해 줘야겠어!!"
104100-31 = "뭐?! 56시간이나……?!"
104100-32 = "그래! 그놈들이다! 흥신소 놈들이 지금 여기를…… 크, 크아아악?!"
104100-33 = "뭐, 뭐야, 저건?! 빠, 빨리 여기로 와줘!! 저놈들을 처치해 준다면 최저시급은 고려해 주겠어!!"
104100-34 = "나한테서 계속 일을 받고 싶다면 서둘러!! 으, 크아악?!"
104100-35 = "……알겠다. 지금 가지."
104100-39 = "그럼, 모두들."
104100-40 = "……바쁘네. 좋겠어."
104100-41 = "조, 종종 연락주세요, 리더……."
104100-42 = "잘 다녀와, 삿 쨩."
104100-43 = "응."
104100-45 = "……."
104100-49 = "……몸조심해. 리더."
104100-51 = "이야, 세리카 쨩. 여기 한그릇 더 줘."
104100-52 = "뭐, 또?"
104100-53 = "응응~ 고생한 시로코 쨩에게 잔뜩 먹여두지 않으면 안 되니까요."
104100-54 = "배부른데……."
104100-56 = "아냐! 시로코 쨩. 더 먹을 수 있어. 어쩐지 아저씨는 이번에 살이 좀 빠진 기분이 들거든? 그러니까 더 고생한 시로코 쨩은 더 든든하게 먹어두지 않으면 안 돼."
104100-57 = "아, 아하하……."
104100-58 = "다 좋은데 말야…… 이거 라멘값은 있어? 아니, 노노미 선배 카드 말고!"
104100-59 = "없는데. 세리카 쨩 시급에서 제하면 되지 않을까나~"
104100-60 = "뭐?! 무슨 말도 안 되는 소릴 하는 거야!!"
104100-61 = "자아, 자아. 한 그릇 더 달라고. 마스터."
104100-66 = "그래. 이번에 다들 고생했으니 이건 내가 쏘지."
104100-67 = "모두에게 특제 점보 라멘 한 그릇씩!!"
104100-68 = "뭐, 마, 마스터?! 그러면 오늘 적자잖아?!"
104100-69 = "이야~ 역시 통이 크다니까. 마스터는."
104100-70 = "와아~ 잘 먹겠습니다! 물론 돈은 낼 거지만요."
104100-72 = "아니, 신경 쓰지 마. 이럴 때일수록 잘 먹어야지."
104100-76 = "아하하…… 그럼 감사히 먹겠습니다."
104100-77 = "으, 으음……."
104100-78 = "세리카 쨩도 잠시 여기 앉아서 같이 먹자고~ 세리카 쨩이 없으면 이 아저씨, 쓸쓸해져 버려."
104100-79 = "무슨 이상한 소리하고 있어! 나 아직 근무 중이라고!"
104100-80 = "괜찮아. 세리카 씨. 어차피 오늘은 한가하니까."
104100-81 = "……뭐, 그, 그럴까? 모처럼이니까. 하, 한 번쯤은 뭐……."
104100-82 = "응응, 세리카 쨩. 여기 앉아요."
104100-83 = "내 옆도 비어 있어."
104100-87 = "이야~ 세리카 쨩, 어디에 앉을 거야? 시로코 쨩 옆이야, 노노미 쨩 옆이야?"
104100-88 = "이 선택지, 사실은 엄청 중요한 분기점이 될지도 몰라. 신중하게 선택해야 해!!"
104100-93 = "아, 아저씨의 무릎 위에 앉는 선택지는 없었다구~?"
104100-94 = "시끄러, 이번엔 이런 거야. 호시노 선배가 고통받는 선택지!"
104100-95 = "너, 너무해……. 아저씨의 허리도 생각해 주지 않으면……."
104100-96 = "아하하…… 그, 그럼 저도 호시노 선배 옆으로……."
104100-97 = "와아~☆ 그럼 저는 호시노 선배 앞으로 붙을게요."
104100-98 = "나는 뒤."
104100-99 = "뒤? 앞?! 뭐, 뭐지? 살려줘, 아저씨가 무서운 여고생들에게 포위당해 버렸어……."
104100-100 = "이대로라면…… 으아아아~"
104100-103 = "자아. 돌아왔어요! 프라나 쨩."
104100-104 = "이제부터 프라나 쨩이 머물 집이에요!"
104100-105 = "으, 으음. 네."
104100-106 = "그럼……. 앞으로 잘 부탁드립니다. 아로나 선배."
104100-107 = "아뇨. 프라나 쨩. 여기서는, 그 대사잖아요!"
104100-108 = "……그 대사입니까?"
104100-109 = "네!! 맞아요! 여기서는 그 대사예요! 잘 아시잖아요!"
104100-110 = "……꼭 해야 하나요?"
104100-111 = "(지긋이-----)"
104100-112 = "……네."
104100-118 = "자아, 어서 와요. 프라나 쨩."
104100-123 = "……다녀왔습니다. 아로나 선배."
104100-128 = "수고하셨습니다…… 린 선배."
104100-129 = "수고하셨어요. 조정실장."
104100-130 = "……네. 저, 저기……."
104100-131 = "……아뇨. 아유무. 제 재신임 투표가 마무리되기 전까지는…… 조용히 지내야만 합니다. 아유무에게 또 피해를 끼칠 수는 없습니다."
104100-132 = "또…… 라니. 그런……."
104100-134 = "이야, 너무하잖아? 린 선배. 우주까지 같이 갔다 온 사이인데."
104100-135 = "……. 모모카."
104100-136 = "뭐어, 이번에도 도망치려고 했지만…… 이렇게 된 이상 또 린 선배의 뒤를 돌봐주지 않으면 안 되겠지."
104100-137 = "하하…… 네. 저도 동감이에요……."
104100-138 = "……아유무. 모모카. 생각해 보니까 말해두지 않았네요."
104100-143 = "……저와 함께 해주셔서 감사했습니다."
104100-144 = "리, 린 선배?!"
104100-145 = "우우와아……? 선배한테 정중하게 직각 인사를 받았어?!"
104100-146 = "이건 불길한 징조야…… 분명 무슨 문제가…… 재난이 닥치게 될 거야……."
104100-147 = "모, 모모카 쨩……."
104100-149 = "……그리고 계속 신세를 지게 되겠네요. 앞으로도 잘 부탁드립니다."
104100-150 = "……네! 저야말로 잘 부탁드려요."
104100-151 = "아아. 뭐. 별수 없지……. 잘 부탁해……."
104100-153 = "아, 맞아. 린 선배에게 편지가 하나 도착했던데요."
104100-154 = "……편지요?"
104100-155 = "네. 선배의 책상 위에 올려놨어요."
104100-156 = "발신인이 적혀 있지 않아서…… 혹시 몰라서 확인했지만 그냥 평범한 편지였고요. 아, 안에 내용은 보지 않았어요."
104100-157 = "……네. 알겠습니다. 확인해 보겠습니다."
104100-159 = "냐하하. 선생님, 오랜만이에요."
104100-160 = "[s] \"니야!\""
104100-161 = "이야, 샬레의 대활약, 정말 눈물 없이는 보지 못하는 장면들이었죠. 감탄에 또 감탄을 금치 못했습니다!"
104100-162 = "[s] \"고마워. 니야도 고생 많았어.\""
104100-163 = "그래서 말이지만……. 선생님……."
104100-164 = "이건…… 꽤 저에게는 재미…… 아니, 중요한 부분입니다만."
104100-165 = "[s] \"응. 뭔데?\""
104100-166 = "……알몸으로 들판을 달려갔다는 소문이 사실인가요……?"
104100-170 = "[ns1] \"………………………………………………….\"\n[ns2] \"아니, 그거 사실이 아니야. 진짜 아니야. 오해야.\""
104100-173 = "……어라~ 이상하네요. 정확히는……. 벌거벗은 몸으로 먼지와 재를 뒤집어쓴 채, 한 손에는 태블릿 PC를 들고는 환한 미소를 띠고선 학생들이 모여있는 곳으로 달려갔다…는 여러 증언들이……."
104100-174 = "[s] \"……………………………………….\""
104100-175 = "……음음. 네. 이건 선생님의 품위를 위해서 더 이상은 파고들지 않는 게 좋겠네요. 냐하핫."
104100-176 = "[s] \"……그걸 물어보려고 연락한 거야?\""
104100-177 = "음음. 아니요. 사실은 인법연구부가 가져온 소식이 있기에 참고 차."
104100-178 = "아, 참고로 그 아이들은 모두 무사히 돌아왔답니다."
104100-179 = "일단, 백화요란의 부부장을 만난 것까진 확인했습니다……만, 쿠즈노하라는 존재가 실존하는지까지는 확인하지 못했달까……."
104100-180 = "자칭 본인을 쿠즈노하라고 주장하는 사람의 편지를 받아왔다고 하더군요."
104100-181 = "그것도…… 다름 아닌 직접적으로 <샬레>의 선생님을 향해 보냈다고 하는 물건을요. 그것이 진실인가. 하는 부분은 차치해두고."
104100-182 = "내용은 저도 보지 못했습니다만, 필요로 하실 듯하여 전문을 보내두었어요."
104100-183 = "[s] \"고마워. 니야.\""
104100-184 = "냐하하. 응, 도움이 되었으면 좋겠네요."
104100-185 = "그럼 다음에 백귀야행 자치구에도 한 번 들러주세요. 곧 재미있는 축제가 열릴 예정이라."
104100-191 = "[ns] (니야가 보내온 편지 전문을 읽는다.)"
104100-194 = "흐음, 나를 찾았다고 했지, [USERNAME] 선생. ……아니, 찾을 예정이라고 해야할까."
104100-195 = "어쨌거나 결론부터 말하자면……"
104100-196 = "색채로 완전히 반전된 존재를 원래대로 되돌릴 수 있는 방법 같은 건 이 세상엔 존재하지 않아."
104100-197 = "그건 죽은 사람을 되살리지 못하는 것과 마찬가지로 당연한 이 세상의 법칙이라네."
104100-198 = "허나……. 그럼에도 불구하고 누군가를 구하고 싶은 것이라면……"
104100-203 = "……나를 찾아주게나. 선생."
104100-208 = "……이건가 보네요."
104100-210 = "누가 보냈는지는 적혀있지 않고……."
104100-211 = "안의 내용은……."
104100-215 = "\"린 쨩에게.\""
104100-216 = "……. 이, 이건."
104100-217 = "이 글씨는……."
104100-218 = "……."
104100-222 = "총학생회장……?"
