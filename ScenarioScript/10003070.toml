[translation]
10003070-1 = "제7화;다 끝난 거 아니었어?!"
10003070-2 = "하계 합숙 훈련 지휘통제실"
10003070-4 = "아아, 들리시나요? 대기하고 있는 각 팀은 응답바랍니다."
10003070-5 = "'팀 알파, 스탠바이 했습니다.'"
10003070-6 = "'팀 베타, 위치에 도착했습니다.'"
10003070-7 = "'팀 감마, 포지셔닝 석세스. 명령만 내려주십쇼.'"
10003070-8 = "네. 대기인원 전부 올 그린. 현장 요원은 어떤가요?"
10003070-10 = "여기는 코드네임S. 현장에 도착했다."
10003070-11 = "여기는 코드네임H 마찬가지로 도착했습니다."
10003070-12 = "네, 통신 양호함. 전부 확인했습니다. 그럼 지금부터 다시 이번 작전의 개요를 설명 드리겠습니다."
10003070-13 = "저희 선도부의 하계 합숙 훈련은 오늘 오후 4시를 기해 종료. 복귀가 예정 되어있습니다."
10003070-14 = "부장님께 전달 드린 오늘의 일정은, 오후에 있을 전체 사격 훈련뿐."
10003070-15 = "다만 그 훈련을 실행하기 전, 부장님께선 짬을 내어 해변에서 수영 연습을 하고자 하셨습니다."
10003070-16 = "그 말인 즉……. 부장님 또한 이 시간을 휴가로 생각해주시기 시작하셨다는 증거!"
10003070-17 = "그렇다면 저희의 임무는 간단합니다. 부장님의 휴가를 마지막까지 전력으로 서포트하는 것!"
10003070-19 = "구체적으로는 혹시라도 있을지 모를 해변의 위험요소를 배제하고, 해변을 통제하는 것으로, 부장님이 휴가를 즐기실 수 있는 무대를 세팅하는 겁니다!"
10003070-20 = "아무리 생각해도, 이거 폭거 아냐……?"
10003070-21 = "그나마 지난번의 소동으로 손님들이 없어서 다행이네요……."
10003070-22 = "잔말은 됐습니다! 명심하세요. 거기서 가장 중요한 역할을 맡은 건, 누가 뭐라해도 선생님이시라는 걸요!"
10003070-23 = "[s] \"으음…… 명심하고 있습니다…….\""
10003070-24 = "부장님에게 직접 수영을 가르쳐드린다는 어마어마한 중책!"
10003070-25 = "솔직히 마음 같아선 어째서 선생님 같은 분이?! 왜 제가 가르쳐드릴 수 없는 거죠?! 아아! 부장님을 대신해서 훈련을 지휘해야만 하는 역할이 너무 괴로워!"
10003070-26 = "-라고 생각한 참입니다만. 이것도 전부 부장님을 위해서라면……. 눈물을 삼킨 채로 참고 또 참아서, 그 역할은 선생님께 일임하겠으니……."
10003070-29 = "부디! 잘 부탁드립니다! 실수는 절대로 안 돼요!"
10003070-30 = "[s] \"그, 그래.\""
10003070-31 = "우와아, 아코 쨩, 엄청 의욕적이네……."
10003070-32 = "그나저나 조금 놀랐어. 천하의 그 부장이 수영을 할 줄 몰랐다니, 어떤 일이든 척척 해내던 사람이 말이야."
10003070-33 = "그만큼 평소에 여유가 없었다는 반증 아닐까요?"
10003070-34 = "자자, 모두 잡담은 그만! 임무에 집중하도록 하죠!"
10003070-35 = "지금 막 부장님이 수영 준비를 마치고 방에서 나가셨습니다! 모두, 맡은 위치에서 준비를……!!"
10003070-39 = "해변. 별다른 이상은 보이지 않음."
10003070-40 = "해변의 외곽 주변도 성공적으로 통제 중입니다. 문제는 없어 보이니, 이대로 목표물에게 접근. 작전 진행 부탁드립니다. 선생님."
10003070-41 = "[s] \"라져! 맡겨만 줘!\""
10003070-42 = "뭐, 이대로만 가면 별일 없이 마무리가 될 것 같은데……."
10003070-43 = "이오리, 저번에도 그랬지만. 이오리의 입은 화근이니까 조심하라고 제가 몇 번이나……"
10003070-44 = "에이, 아무리 그래도 삼세번은……."
10003070-47 = "어……?"
10003070-48 = "(한숨)"
10003070-49 = "……자, 잠깐만요! 말도 안 돼. 왜 하필 이런 타이밍에…… 아니, 이건……."
10003070-50 = "가, 갑자기 무슨 일이야. 아코 쨩?!"
10003070-51 = "……아코 행정관?"
10003070-53 = "정보부로부터 들어온 정보입니다!"
10003070-54 = "현재 호텔 뒤편에 있는 슬럼가에 엉망진창 스케반과 첨벙첨벙 헬멧단이 집결 중!"
10003070-55 = "그 규모는……. 이미 2개 대대 병력 이상입니다!"
10003070-56 = "갑자기 무슨……. 그 둘이 어째서 함께 집결하고 있는 거죠?!"
10003070-57 = "……지금 막 그들로부터 통신입니다! 지금 화면에 띄우겠습니다!"
10003070-60 = "우리가 왜 집결했느냐고?! 그야……!"
10003070-61 = "케헤헤헤!! 우리가 동맹을 맺었기 때문이지!!"
10003070-62 = "마침 우리에게 좋은 정보가 들려와서 말야."
10003070-63 = "무슨 정보일까? 궁금해? 궁금하지? 뻔한 이야기야! 그쪽에 선도부장이 없다는 정보다!!"
10003070-64 = "이러면 이야기가 달라지지! 선도부장이 없다면 전혀 쫄 필요도, 이유도 없다. 이거지!"
10003070-65 = "선도부장이 없는 선도부는 오합지졸! 결투를 방해한 네놈들부터 없애주마! 선전포고다!"
10003070-66 = "쿠헤헤헷! 우릴 방해한 걸 후회하게 만들어주마!"
10003070-70 = "뭐라는 거야!! 이 엑스트라놈들이!!!"
10003070-71 = "(진심으로 화내기 시작했어요…….)"
10003070-72 = "……으으. 각개격파도 힘들었는데 저놈들이 연합하면 이거…… 막을 수 있는 거야?"
10003070-73 = "막아야 합니다! 안되면 되게 하는 겁니다!"
10003070-74 = "아니……. 이젠 정말 저희만으로는 무리…… 부장님께 보고를 해야……."
10003070-75 = "불허합니다!"
10003070-76 = "모처럼 부장님이 간신히 휴가라는 걸 인식하기 시작했는데! 여기까지 와서 다 망칠 수는 없어요!"
10003070-77 = "그럼 선도부 본대의 지원 요청이라도……."
10003070-78 = "될 리가 없잖아요! 부장님이 알게 될 수도 있다구요!"
10003070-79 = "합숙 훈련에 모인 병력으로 어떻게든 해야 합니다!!"
10003070-80 = "그거 완전 무리한 억지……."
10003070-81 = "아뇨! 억지가 아닙니다. 이건 해내야만 하는 일이에요!"
10003070-82 = "아직 시간은 저희의 편이에요. 제가 작전을 생각하겠습니다…… 적이 온전히 진형을 갖추기 전에……."
10003070-83 = "보고드립니다!! 호텔 근처에 소수의 별동대들이 접근하고 있습니다!"
10003070-84 = "네?! 누구죠?!"
10003070-85 = "그 병력을 이끌고 있는 자들은……. 정체불명의 자루를 잔뜩 들고 있습니다."
10003070-86 = "거리가 멀어 육안으로 식별하는 건 힘들지만, 요철이 잔뜩 있는…… 원통형의 무언가로 보입니다!"
10003070-87 = "설마, 소문으로만 듣던 개조형 파인애플 수류탄!? 대체 어디서 그런 과격한 물건을……?!"
10003070-88 = "아뇨……! 육안 식별 완료……!! 저건……! 옥수수입니다!"
10003070-89 = "……네?"
10003070-91 = "축제다아-! 옥수수! 옥수수! 구운 것도 좋고, 삶은 것도 좋아!!"
10003070-92 = "후후후☆ 이제야 축제같은 느낌이 드네요."
10003070-93 = "간장도 좋고 버터도 좋지만 역시 딸기잼 토핑이 최고지? 그치?"
10003070-94 = "먹을 생각만 하지 말고 팔 생각을 하라고!! 게다가 딸기잼은 뭐야!! 옥수수에 그딴 거 바르지 말라고!!"
10003070-95 = "후후후. 이제 흥이 살아나는군요."
10003070-96 = "축제의 옥수수의 맛은 인파와 비례한다. 이 가설을 증명할 수 있는 절호의 기회겠군요."
10003070-99 = "자아, 좀 더 시끌벅적한 축제를!! 그 너머에 있는 고고한 미식의 길을!!"
10003070-100 = "무슨 말인지는 잘 모르겠지만 와장창☆ 인 거죠. 좋아해요, 그런 거."
10003070-102 = "……."
10003070-103 = "……."
10003070-104 = "여…… 영문을 모르겠어……."
10003070-105 = "보고드립니다!! 또 다른 병력이 슬럼가에 집결!!"
10003070-106 = "네?! 또 뭔가요?! 헬멧단? 불량배? 미식연구회? 아니, 나올 녀석들은 다 나왔잖아요!!"
10003070-107 = "아, 아닙니다. 전혀 새로운 집단입니다……! 지금 화면에 띄우겠습니다!"
10003070-110 = "안녕~ 친구들! 오늘도 개발하기 좋은 날이지?"
10003070-111 = "응, 온천개발부야."
10003070-112 = "오, 온천개발부?!"
10003070-113 = "카스미 부장이 그쪽 바다 지하에 마침 해저 화산이 있다는 소리를 들어서 말야."
10003070-114 = "해양심층수로 온천을 만들자, 뭐 그런 어쩌고 플랜을 세워버렸지 뭐야. 아하하하. 난 바보라서 무슨 소린진 잘 모르겠지만."
10003070-115 = "결론은 그쪽으로 가서 싹 밀어버릴 거라는 거야."
10003070-116 = "숲을 태우고, 건물을 철거하고, 바다를 끓인다!! 이것이 바로 개발지상주의!!"
10003070-117 = "아, 온천이 세워지면 무료 입욕권 한장씩 줄게!"
10003070-118 = "그럼 안녕~♪ 조금 이따가 봐!"
10003070-122 = "온천개발부원 약 200여 명이 집결 중! 철거용 중장비들도 잔뜩 가져왔습니다! 불도저, 포크레인, 탱크까지……!"
10003070-123 = "보고입니다! 슬럼가에 병력이 점점 더 증가! 뿔뿔이 흩어졌던 잔당들이 계속해서 모여들고 있습니다!"
10003070-124 = "학생들뿐만 아니라, 오토마타, 전차, 헬기까지 관측됩니다!"
10003070-125 = "어쩐지 다른 지역의 문제아들도 몰려들고 있습니다! 전망 좋은 곳에서…… 돗자리를 펴고 완전 관람 모드!!"
10003070-126 = "아, 아앗! 서로 좋은 자리를 차지하겠다고 전투를 벌이기 시작했습니다!!"
10003070-127 = "미식연구회, 대로 한복판에 오, 옥수수 노점을 만들기 시작했습니다!"
10003070-128 = "온천개발부, 불도저랑 탱크와 포크레인을 가지고 전진 중! 어쩐지 미식연구회의 노점과 싸우기 시작했습니다!"
10003070-129 = "불량배와 헬멧단! 드디어 해변에서 첫 전투를……!!"
10003070-139 = "……."
10003070-140 = "……."
10003070-141 = "아코 행정관!! 어, 어떻게 해야……."
10003070-142 = "아코 행정관?! 사태를 해결할 수 있는 냉정한 판단을……!"
10003070-143 = "……우."
10003070-144 = "……우?"
10003070-145 = "우와아아앙……! 이걸 저보고 어쩌란 건가요?!"
10003070-146 = "한쪽을 막으려고 하면 또 한쪽에서 물이 새고, 그쪽을 막으면 또 다른 쪽이 박살이 나버리다니!"
10003070-147 = "아코 쨩…… 진정하고……."
10003070-148 = "지금 진정하게 생겼어요!!"
10003070-149 = "그래도 방법을 찾으면……."
10003070-150 = "방법!! 방법!! 저걸 무슨 수로 해결해요!!"
10003070-151 = "아니, 대체 게헨나에서 제일 조용한 해변 아니었나요?! 게헨나에서 가장 핫한 플레이스잖아요! 완전 뜨겁잖아요!"
10003070-152 = "말하자면 모루와 망치 사이에 낀 꼴인 거지."
10003070-153 = "네! 맞아요. 부장님. 역시 정확하세요!"
10003070-154 = "……그러네요. 이 상황을 타개할 수 있는 전략은 농성이 아닙니다. 이것을 포위망으로 해석한다면……."
10003070-155 = "미식연구회, 헬멧단, 불량배, 온천부. 전부 급조된 연합이야. 연계도, 지휘체계도 없다고 봐야지."
10003070-156 = "네. 저쪽의 약점은 연계가 불안전한 것. 정밀한 전술 운용으로 포위망 사이를 파고들면……. 즉, 이것의 파훼법은 전격전!"
10003070-157 = "맞아. 이 호텔을 중심으로 동심원을 그린다고 생각하면 돼. 거기가 우리의 진격 라인이 되는 거지."
10003070-158 = "과연……!! 역시 부장님이세요! 단번에 해답을 찾았어요!"
10003070-159 = "이걸로 부장님 몰래 작전을……."
10003070-160 = "부장님의 휴가를……."
10003070-161 = "……."
10003070-162 = "……."
10003070-165 = "……."
10003070-168 = "……휴가를……."
10003070-169 = "……."
10003070-170 = "후에훙?!!"
10003070-173 = "[ns1] \"히, 히나…… 언제 여기에…….\"\n[ns2] (해변에서 만나기로 한 약속, 잊고 있었다……!!)"
10003070-174 = "……."
10003070-175 = "……."
10003070-176 = "아코."
10003070-177 = "아, 으, 네, 네에……."
10003070-178 = "하계 합숙 훈련이 어쩌다 이렇게 되었는지, 그 문책은 나중으로 미루겠어."
10003070-181 = "전원 전투준비."
10003070-182 = "지금부터 단숨에 해결한다."
10003070-183 = "으, 응!"
10003070-184 = "네!"
