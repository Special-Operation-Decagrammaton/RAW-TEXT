[translation]
83302300300-6 = "앗! 히나 선배!"
83302300300-7 = "이부키? 이런 데서 만나다니 의외네."
83302300300-8 = "그게 말이야~! 아까! 엄청난 게 선도부 근처 공원에 나타났다고 해서 말야~!"
83302300300-9 = "그게 또 엄청나게 큰 팬케이크라는 거 있지~!"
83302300300-10 = "이부키도 팬케이크 좋아하니까! 궁금해서 보러 왔어!"
83302300300-11 = "……엄청나게 큰 팬케이크……라는 건, 역시……"
83302300300-12 = "엄청나게 큰 팬케이크……"
83302300300-13 = "그런 팬케이크랑 산책할 수 있으면 이부키는 엄청 행복할 거 같아~"
