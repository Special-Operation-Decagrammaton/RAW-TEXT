[translation]
1005603-1 = "정말로 준비한 선물"
1005603-6 = "(눈이 내리는 날이었다.)"
1005603-10 = "샬레 집무실"
1005603-14 = "(일을 끝내고 빈둥거리려던 순간, 익숙한 느낌이 들었다.)"
1005603-18 = "[ns] \"세리나?\""
1005603-19 = "(부스럭부스럭)"
1005603-24 = "[ns] \"세리나……?\""
1005603-25 = "여, 여기 세리나 같은 사람 없어요!"
1005603-29 = "[ns1] \"그렇구나, 여기에 없는 세리나 같은 사람.\"\n[ns2] \"그런데 여기에 없는 세리나 같은 사람은 무슨 일이야?\""
1005603-40 = "우우……"
1005603-41 = "너무 놀리지 말아 주세요……"
1005603-42 = "[s] \"미안, 미안.\""
1005603-43 = "모처럼, 단단히 마음먹고 찾아뵈러 온 건데……"
1005603-44 = "언제든 편하게 오면 된다구요? 하지만 이번만큼은 그럴 수 없었어요……"
1005603-45 = "그때 주신 목도리의 보답도 제대로 해 드리지 못한 걸요……"
1005603-46 = "[s] \"아니, 그 목도리라면 편하게 그냥 써도 되니까.\""
1005603-47 = "안 돼요! 모, 모처럼 선생님께서 주신 건데요."
1005603-48 = "선생님이 괜찮다고 하셔도…… 제가 그럴 수 없단 말이에요……"
1005603-49 = "그러니까 그 보답! 확실히 할 수 있도록 허락해 주세요!"
1005603-50 = "(세리나의 기세에 밀려, 그렇게 해 달라고 이쪽에서 부탁하게 되었다……)"
1005603-53 = "흥~ 흐흥~"
1005603-54 = "그리하여, 제가 준비한 선물은!"
1005603-55 = "[s] \"선물은~?\""
1005603-56 = "바로! 구호기사단 종합 건강 세트랍니다!"
1005603-57 = "구급상자, 구급약, 물수건, 파스, 영양제까지!"
1005603-58 = "언제, 어느 때라도 모든 사태에 대처할 수 있도록 준비한 선물이에요!"
1005603-59 = "[s] \"뭔가…… 본격적이네……\""
1005603-60 = "당연하죠. 이것도 다 선생님을 위한 일인걸요."
1005603-61 = "선생님께서 평소에 너무 몸을 안 돌보시니까……"
1005603-62 = "전 그저 선생님께서 건강하시기만 하면 되는데요……"
1005603-63 = "[s] \"앞으로는 조심하겠습니다……\""
1005603-64 = "네! 잘 말해 주셨어요! 그러면 이제 여기에 누워 주세요."
1005603-65 = "[s] \"네……??\""
1005603-66 = "어째서냐구요? 그야 이 구호기사단 종합 건강 세트를 완성하기 위해서죠."
1005603-67 = "이 세트는 세리나 특제 지압 마사지가 있어야 비로소 완전해지거든요."
1005603-68 = "자, 어서 누워 주세요. 필요하다면 상의도 벗어 주시고요."
1005603-69 = "빨리요! 이러다 응급 처치의 시간을 맞추지 못하게 되어 버릴 수도 있어요!"
1005603-70 = "모든 처방과 치료는 골든 타임이 중요하다고요!"
1005603-71 = "(세리나의 압박에 이기지 못하고, 결국 소파에 엎드려 누웠다……)"
1005603-73 = "자, 그러면 지압 시작할게요."
1005603-81 = "여긴 어떠세요?"
1005603-82 = "아우, 많이 뭉쳤네요. 평소에 스트레칭도 조금씩 해 주세요."
1005603-88 = "아프시다고요? 지압이 잘 되고 있다는 증거랍니다. 조금만 참으세요."
1005603-89 = "어때요, 시원하시죠? 시원한데 고통스럽다고요? 고통은 사라지고 시원함만 남을 거예요."
1005603-90 = "자, 자. 조금만 참으세요. 금방 끝나요! 여기랑 여기, 그리고 저기만 눌러 주면……"
1005603-91 = "환자분! 아니, 선생님! 어깨 움직이지 마세요!"
1005603-92 = "(그 뒤로 고통에 몸부림치며(?) 세리나 특제 지압 마사지를 받았다……)"
1005603-93 = "(세리나는 어딘가 신이 난 듯이 보였다……)"
1005603-95 = "어떠세요, 선생님? 조금 괜찮으세요?"
1005603-96 = "[s] \"엄청 많이 시원해졌어.\""
1005603-97 = "다행이에요. 앞으로도 몸이 굳거나 피곤하면, 절 불러 주세요."
1005603-98 = "꼭이에요?"
1005603-99 = "[s] \"그렇지만, 세리나가 이렇게까지 준비해 줬는데 아무것도 못 해 줘서 미안한걸.\""
1005603-100 = "그런 건 아무래도 좋으니 무리하지만 말아 주세요……"
1005603-101 = "선생님께서 곤란해하시는 일이면, 제 일이기도 하니까요."
