[translation]
1008803-1 = "분위기에 맞는 옷"
1008803-4 = "(카요코와 약속한 시간에 흥신소 사무실을 찾아갔다.)"
1008803-8 = "……아. 왔구나, 선생."
1008803-9 = "열려 있어. 들어와."
1008803-10 = "[ns1] \"실례합니다~.\"\n[ns2] 문을 열고 안으로 들어간다."
1008803-17 = "기다리고 있었어."
1008803-18 = "이런 시간에 들르다니, 별일이네."
1008803-22 = "……다른 멤버들?"
1008803-23 = "지금은 없어. 다들 나름대로 할 일이 있어서……."
1008803-24 = "선생이 온다니까 아쉬워하긴 하더라. 괜찮다면 다들 있을 때에도 들러 줘."
1008803-25 = "그럼 인사는 이쯤 하고……."
1008803-29 = "찾으러 온 게 있다고 했었지? 마침 우리 쪽에서 찾아 둔 게 있었으니까. 도움이 됐으면 좋겠네."
1008803-30 = "조금만 기다려. 찾아줄 테니까."
1008803-34 = "으음. 분명 이쯤이었는데."
1008803-38 = "이건 서류철이고……. 이건 총알이고……."
1008803-39 = "그리고……."
1008803-43 = "[ns3] \"어라. 카요코, 그 박스는…….\"\n[ns4] \"저번 의뢰 때 입었던 드레스네.\""
1008803-46 = "……응?"
1008803-47 = "아아. 이거……."
1008803-48 = "뭐……. 평소에 입을 옷도 아니고 입는다 해도 다 흥신소 의뢰일 테니까,"
1008803-49 = "사실상 여기 옷이라고 생각해서 넣어뒀어."
1008803-50 = "[s5] \"먼지가 쌓여 있는데.\"\n[s6] \"방치하기엔 아까운 거 아냐?\""
1008803-53 = "그런가? 딱히 그런 생각을 해 본 적은 없는데……."
1008803-54 = "그다지 나한테 어울리는 느낌도 아니라고 생각하고……."
1008803-58 = "……그렇지 않다고? 잘 어울려……?"
1008803-62 = "……뭐……."
1008803-63 = "선생, 일단 빈말이라도 칭찬은 칭찬이니 고맙다고 해 둘게."
1008803-64 = "하지만 그런 이야기는 굳이 해주지 않아도 좋아."
1008803-65 = "내가 어떻게 생겼는지는 누구보다 스스로 잘 알고 있으니까."
1008803-66 = "……빈말이 아니라고? 정말로 그렇게 생각한다고……?"
1008803-69 = "정말이지 사람 좋은 타입이라니까."
1008803-70 = "알았어. 알았으니까 이 이야기는 여기까지만. 선생도 해야 할 일이 있어서 온 거잖아."
1008803-74 = "거기 앉아서 조금만 더 기다려. 금방 찾아 줄 테니."
1008803-81 = "(이후 머지않아 카요코는 필요한 자료를 찾아 주었다.)"
1008803-85 = "겨우 찾았다."
1008803-89 = "여기 있어, 선생. 도움이 됐으면 좋겠네."
1008803-90 = "감사 인사는 됐어. 선생에겐 평소에도 도움을 많이 받고 있으니, 이건 그걸로 대신……."
1008803-94 = "……뭐?"
1008803-95 = "고생했으니 저녁에 밥이라도 사 주겠다고?"
1008803-99 = "……저기."
1008803-100 = "바로 직전에 '그럴 필요 없다'고 말하고 있었는데, 나."
1008803-101 = "[s7] \"내가 마음 편하려면 어쩔 수 없어.\"\n[s8] \"어른이란 그런 생물이란다, 카요코.\""
1008803-106 = "……하아."
1008803-107 = "앞으로 그 변명은 너무 자주 쓰지 않았으면 좋겠네."
1008803-108 = "뭐, 그래도……. 어쩔 수 없지. 선생이 그렇게 이야기하면 내가 거절하기도 어렵고……."
1008803-109 = "알았어. 그럼 고맙게 받도록 할게."
1008803-110 = "그럼 오늘은 일단 돌아가고, 시간 되면 말해줘. 찾아갈 테니까."
1008803-116 = "……그럼 그때 봐, 선생."
1008803-119 = "(이후 카요코에게서 받은 자료를 들고 샬레로 돌아가, 남은 업무를 마무리했다.)"
1008803-123 = "(따로 식당을 예약해, 카요코에게 날짜와 장소를 알려주었다.)"
1008803-133 = "(근방에서 소문난 파스타집이 있다기에, 겸사겸사 찾아가 자리를 잡았다.)"
1008803-138 = "……나도 꽤 일찍 나온 건데. 더 먼저 와있었네, 선생."
1008803-145 = "[ns9] \"……아, 카요코.\"\n[ns10] \"어서 와. 카요…….\""
1008803-150 = "[ns11] \"……카요코?!\"\n[ns12] \"드레스…… 입고 왔네?\""
1008803-153 = "역시 놀라네. 그럴 거라고 생각하긴 했지만."
1008803-154 = "방치하기엔 아깝다고 한 건 선생이었잖아. 마침 식당 분위기도 어울리는 것 같고……."
1008803-155 = "이런 때 아니면 언제 입을까 싶어서."
1008803-156 = "……아니면 역시……. 그때엔 그냥 한번 해본 말이라던가?"
1008803-157 = "[s13] \"아니, 절대 그런 건 아니야.\"\n[s14] \"오히려 너무 잘 어울려서 놀랐다……!\""
1008803-160 = "……후후. 농담이야."
1008803-161 = "모처럼 선생이 사주는 식사인데, 대충 오고 싶지 않았다는 것 정도로 해두자."
1008803-168 = "그럼……."
1008803-169 = "……고마워. 선생, 잘 먹을게."
