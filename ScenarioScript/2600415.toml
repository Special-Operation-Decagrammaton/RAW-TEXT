2600415-57 = "3;시미코;00\n#3;a\n#3;closeup\n#wait;1500"
2600415-58 = "3;시미코;03;자아, 계속 편하게 앉고 눈을 감아주세요.\n#3;greeting\n#3;closeup"
2600415-59 = "3;시미코;01;선생님 옆에 기대서, 주무실 때까지 책 읽어드릴게요.\n#3;closeup"
2600415-60 = "3;시미코;02;사양은 사양할게요. 아시겠죠?\n#3;closeup"
