[translation]
2600415-1 = "#title;습관과 시간"
2600415-2 = "3;시미코;02\n#3;em;…\n#3;a\n#wait;2500"
2600415-3 = "3;시미코;99;선생님, 역시……."
2600415-4 = "3;시미코;04;엄청 지쳐보이세요.\n#3;em;[땀]"
2600415-5 = "[s1] \"힘든 모습을 보여주면 안 되는데……!\"\n[s2] \"무심코 솔직하게 말해버렸어…….\""
2600415-8 = "3;시미코;00;괜찮아요, 잘 말씀하셨어요. 착하다 착해-"
2600415-9 = "3;시미코;03;솔직하게 말씀해주셔서 아주 기뻐요, 어서 푹 쉬어주세요!\n#3;em;[반짝]"
2600415-10 = "#st;[0,0];instant;1;"
2600415-12 = "3;시미코;00\n#3;m2\n#wait;1300"
2600415-13 = "3;시미코;03;자아, 쉬기 편하시게 자리도 전부 세팅해뒀답니다?\n#3;greeting"
2600415-14 = "[s] \"고마워 시미코, 조금 쉬면 괜찮아질 거야.\""
2600415-15 = "#st;[0,0];instant;1;"
2600415-17 = "3;시미코;02\n#3;em;[반응]\n#3;h\n#wait;1200"
2600415-18 = "3;시미코;06;앗, 잠시만요! 손님용 방석이 터져있었네요. 이런…….\n#3;stiff"
2600415-19 = "3;시미코;00;으앗, 이건 제대로 꿰매줘야 할 것 같은데…….\n#3;m3"
2600415-20 = "[s] \"그래도 푹신할 것 같으니 괜찮지 않을까?\""
2600415-21 = "3;시미코;06;안 돼요! 독서도 휴식도 완벽한 자리를 갖추는 건 중요하다구요?\n#3;hophop"
2600415-22 = "3;시미코;99;지금 수선할 수는 없으니까, 일단 이거라도……!"
2600415-23 = "#st;[0,0];instant;1;"
2600415-25 = "3;시미코;00\n#3;m5\n#wait;1200"
2600415-26 = "3;시미코;00\n#3;h\n#wait;1200"
2600415-27 = "3;시미코;03;일단 제 방석을 드릴게요! 잠시만 기다려주세요! 편하게 세팅해 드릴게요.\n#3;em;[반응]"
2600415-28 = "3;시미코;02;자아, 다시 준비됐어요, 밤새 앉아 있으셔도 편하실 거예요!\n#3;greeting"
2600415-29 = "[s3] \"으앗…… 따듯하고 너무 편해……!!\"\n[s4] \"구름같다아…….\""
2600415-32 = "3;시미코;03;후훗, 준비한 보람이 있었네요.\n#3;m3"
2600415-33 = "3;시미코;00;사실, 휴식 세팅을 새로 시도해봤어요. 최근에 읽은 해부학 책에 따르면 이 자세가 제일 효과적인 자세라고 하더라구요."
2600415-34 = "3;시미코;02;그건 그렇고……."
2600415-35 = "3;시미코;01;다행이에요. 제 쿠션에 만족하신 것 같네요."
2600415-36 = "3;시미코;03;오래 써서 조금 낡고, 여기저기 꿰매서 보기는 볼품없지만요…….\n#3;em;[///]\n#3;stiff"
2600415-37 = "[s] \"볼품없다니, 어허! 애착이 느껴져서 좋아!\""
2600415-38 = "#st;[0,0];instant;1;"
2600415-40 = "3;시미코;02\n#3;em;…\n#3;h\n#wait;2500"
2600415-41 = "3;시미코;03;후훗, 감사해요."
2600415-42 = "3;시미코;00;한번 마음에 든 물건은, 완전히 망가질 때까지 쓰는 편이거든요."
2600415-43 = "3;시미코;99;솜도 딱 알맞게 폭신하고, 천도 너무 부드럽지고, 거칠지도 않아서 마음에 들었답니다."
2600415-44 = "3;시미코;02;다른 방석은 익숙하지 않다 보니, 재봉이 터져도 다시 꿰매서 관리했어요."
2600415-45 = "3;시미코;01;그리고, 오래 쓰다 보면 솜이 눌려서 편안한 자세에 맞게 모양이 잡히거든요."
2600415-46 = "3;시미코;03;그러니까, 습관과 시간이 깃들었다고 할 수 있어요.\n#3;em;[반짝]\n#3;greeting"
2600415-47 = "3;시미코;02;그래서 허리에 받쳐도, 끌어안고 있어도 아주 편하실 거예요."
2600415-48 = "3;시미코;01;자아! 설명은 여기까지! 모쪼록 푹 쉬어주세요.\n#3;jump"
2600415-49 = "[s5] \"시미코의 방석, 뺏어버려서 미안한걸.\"\n[s6] \"방석 없이 맨 바닥에 앉아도 괜찮겠니?\""
2600415-52 = "3;시미코;02;걱정 마세요, 선생님.\n#3;em;[반응]"
2600415-53 = "3;시미코;01;선생님이 더 푹 쉬실 수 있게, 하나 더 해드릴 게 있거든요."
2600415-54 = "#st;[0,0];instant;1;"
