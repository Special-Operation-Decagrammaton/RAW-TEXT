[translation]
10016060-1 = "제6화;협력 1"
10016060-4 = "하아, 하아…… 이쪽 구역에는 없는 것 같군요."
10016060-5 = "마시로, 혹시 다른 구역에서 비품을 운반하는 학생들을 발견하진 못했나요?"
10016060-6 = "네. 현재 조명탑 위에서 경기장 주변을 살펴보는 중입니다만, 비품을 운반하는 수상한 학생들의 모습은 보이지 않는 것 같습니다."
10016060-7 = "경기장 곳곳에 있는 부원들에게 목격 증언을 모아달라고 했지만, 저마다의 목격 진술이 혼재되어서……"
10016060-8 = "현재는 문제의 학생들이 어디로 갔는지 확인하지 못했습니다."
10016060-9 = "[s] \"키리노, 혹시 그 학생들의 인상을 기억하고 있어?\""
10016060-11 = "인상착의 말씀이시군요! 에, 그러니까……"
10016060-12 = "짧게 자른 단발에 체육복을 입고 있었고…… 운동화를 신고 있었던 것 같은 느낌이……"
10016060-13 = "아아— 역시 이 정도의 인상으로는 찾기 어렵겠어. 이 주변의 학생들은 다 비슷한 차림을 하고 있는 걸."
10016060-14 = "워낙 평범한 인상이었던 데다가, 수상하지 않다고 생각해서 그냥 기억에서 흘려버렸거든."
10016060-15 = "우으…… 죄송합니다. 본관이 좀 더 주의 깊게 얼굴을 살폈어야 했는데……"
10016060-19 = "아닙니다. 그 학생들의 존재를 보고해주신 것만으로도 큰 도움이 되었는걸요."
10016060-24 = "(……하지만 지금은 손이 부족한 게 아쉽군요.)"
10016060-25 = "(이곳이 트리니티였더라면 사람을 풀어서라도 금방 찾아냈을 텐데……)"
10016060-26 = "……무슨 문제라도 있으신가요?"
10016060-27 = "이 목소리는……"
10016060-34 = "게헨나와 트리니티, 밀레니엄의 임원들이 함께 나타나다니…… 뭔가 묘한 조합이네."
10016060-35 = "묘, 묘한 조합이라니! 사람을 멋대로 엮어서 한 세트처럼 말하지 말아 줄래?!"
10016060-36 = "저도 당신과 엮이고 싶은 마음은 없거든요? 이런 요괴녀와 동류 취급당하는 건 사양이에요."
10016060-37 = "누가 요괴녀라는 거야?!"
10016060-38 = "하하…… 여러분, 싸우지 말아 주세요."
10016060-40 = "세 분은 어쩐 일로 함께……?"
10016060-41 = "그게 구호소에서 돌아오는 길에 기진맥진한 채 벤치에 사이좋게 누워 있는 두 분을 발견해서……"
10016060-42 = "휴식과 기력의 회복을 겸해 시원한 음료라도 마시러 카페로 가던 중이었답니다."
10016060-43 = "그보다 하스미 씨. 얼굴이 어두우신데, 무슨 문제라도 있으신가요?"
10016060-44 = "아뇨, 대단한 일은 아닙니다."
10016060-45 = "여기 계신 발키리 경찰학교의 여러분이 경기에 쓰이는 비품을 임의로 옮기는 학생들을 보았다고 하셔서요."
10016060-46 = "짐작이긴 하지만 혹시라도 누군가가 나쁜 마음을 먹고 경기에 쓰이는 비품에 손을 대고 있는 게 아닌가 해서……"
10016060-48 = "뭐? 엄청나게 큰일이잖아!"
10016060-49 = "그, 그런가요?"
10016060-50 = "경기에 쓰이는 비품이 모두 얼마짜리인데! 그걸 누가 훔쳐 가기라도 했다면 재정적 손해가……"
10016060-51 = "게다가 이번 대운동회의 비품은 밀레니엄의 기술이 집약되어 있으니, 나쁜 일에 쓰일 가능성도 배제할 수 없겠군요."
10016060-52 = "지난달, 게헨나의 불량 학생들이 밀레니엄에서 무단 반출된 청소 로봇에 화염방사기를 달아 교내에서 난동을 부린 적이 있었습니다."
10016060-53 = "단순한 청소 로봇만으로도 선도부 1개 중대가 괴멸될 정도의 엄청난 피해가 발생했는데, 밀레니엄의 기술이 집약된 경기 비품을 악용한다면 어떤 문제를 일으킬지 알 수 없습니다."
10016060-54 = "……그 청소 로봇, 아마 화염방사기는 처음부터 달려 있었던 것 같지만……"
10016060-55 = "여하튼 시간이 없으니 어서 대응하도록 하죠."
10016060-56 = "유우카 씨. 밀레니엄의 모든 비품에는 전자 태그가 붙어 있죠?"
10016060-57 = "경기가 끝난 이후에도 반납되지 않은 비품의 목록과 해당 비품이 사용된 경기의 종료 시각을 확인해주세요."
10016060-58 = "저는 주요 시설의 출입 기록을 확인하여 해당 시간대에 트랙에 접근한 학생의 명단을 정리하겠습니다."
10016060-59 = "그, 그렇게 지시하지 않아도 이미 찾고 있거든?"
10016060-65 = "……수상하군요."
10016060-66 = "게헨나의 학생이 무슨 속셈으로 저희를 돕는 거죠?"
10016060-67 = "하아……?"
10016060-68 = "트리니티의 학생을 도우려고 이런 귀찮은 일을 자처한 게 아니거든요?"
10016060-69 = "일단은 저도 황륜대제의 실행위원. 사건이 불거져 혹시라도 게헨나 학원의 운영에 지장이 생기지 않도록 제 일을 처리하는 것뿐입니다."
10016060-70 = "혹여라도 사건을 일으킨 학생이 게헨나 출신이라, 저희 측에 쓸데없는 비용이 청구되면 귀찮아지니까요."
10016060-71 = "그건 당신도 마찬가지 아닌가요?"
10016060-72 = "……일단은 그 말을 믿도록 하죠."
10016060-74 = "그럼 저희는 이 주변에서 수상한 학생을 본 적 없는지, 관람객들을 상대로 탐문을 하겠습니다."
10016060-75 = "마리 씨, 함께 부탁드리겠습니다."
10016060-76 = "네, 넵!"
10016060-80 = "……그러니까 비품 상자를 든 학생이 지하 출입구 방향으로 향하는 걸 보셨다고요?"
10016060-81 = "그렇다니까. 쇳덩이가 가득 든 상자를 끙끙거리면서 운반하면서도 도움은 한사코 거절해서 이상하다고 생각했었지."
10016060-82 = "다칠까 봐 걱정되어서 계속 어디로 향하는지 보고 있었으니까 틀림없어."
10016060-83 = "경기가 끝난 뒤에 반환되지 않은 비품의 수량과 목록을 정리했어."
10016060-84 = "투포환 경기에 사용된 포환 상자와 개인 장애물 달리기 경주에 사용된 허들 등……"
10016060-85 = "해당 경기가 진행된 후에 선수가 아닌데도 경기장에 출입한 학생들은 다음과 같네요."
10016060-86 = "키리노 씨, 이 중 낯이 익은 얼굴이 있나요?"
10016060-87 = "앗, 이 사람이에요! 아까 비품을 옮기고 있던 사람이 바로 이 학생이었어요!"
10016060-89 = "증거를 종합하면, 이 사진 속에 있는 학생이 경기장의 지하 출입구에 비품을 몰래 옮겨두고 있는 모양이군요."
10016060-90 = "……애슬레틱 스타디움의 지하 출입구?"
10016060-91 = "거기는 공간이 협소해서 지금은 쓰이지 않는 출입구일 텐데, 어째서 그런 곳에 비품을 쌓아 두려는 거지?"
10016060-92 = "그건 범인을 잡아서 확인해보면 알 수 있겠죠."
10016060-93 = "자, 귀찮은 일이 터지기 전에 어서 이동하자고요."
10016060-95 = "황륜대제…… 2년마다 돌아오는 키보토스에서 가장 뜨거운 스포츠의 제전."
10016060-96 = "모든 미디어가 주목하는 이 제전에서 활약하는 것만으로도 학원의 역사에 길이 남을 영웅이 될 수도 있고, 후학들의 심상에 길이 남을 메시지를 남길 수도 있지."
10016060-97 = "그 말인, 즉……"
10016060-101 = "이곳에서 시위를 벌인다면 그 파급력 또한 엄청날 거야!"
10016060-102 = "하지만 보스. 이곳 애슬레틱 스타디움에는 각 학원의 선도부는 물론이고 발키리 경찰학교의 학생들까지 있는데……"
10016060-103 = "평소처럼 시위를 벌인다면 실행위원회에 의해 금방 진압되지 않을까요?"
10016060-104 = "음, 그건 걱정하지 않아도 좋아. 크로노스 스쿨의 카메라가 우리를 주목하고 있다면 실행위원회도 무작정 밀어붙이지는 못할 테니까."
10016060-105 = "게다가 이렇게 스타디움의 지하 출입구에 자리를 잡은 이상, 경기장에 문제가 생길 수도 있으니 폭탄 같은 거친 수단을 쓰지도 못하겠지."
10016060-106 = "그럼 상대는 우리의 바리케이드를 뚫지 못하고 협상을 시도할 거야!"
10016060-107 = "역시 보스. 훌륭한 계책이시군요!"
10016060-108 = "그럼 이 기세를 밀어붙여, 우리의 오랜 염원이었던 주 3일 노동 정책을—"
10016060-110 = "……겨우 그런 이유로 이 비싼 비품들을 바리케이드로 썼단 말이야?"
10016060-112 = "시, 실행위원들이 어느 틈에……?!"
10016060-113 = "우리가 여기에 있다는 걸 어떻게 알아차린 거지?"
10016060-115 = "선수도 아닌 학생들이 계속 경기장에서 비품을 모으고 있었으니 당연히 눈에 띌 수밖에요."
10016060-116 = "게다가 황륜대제의 비품은 보통 로봇이 옮기는데, 사람이 직접 옮기고 있으니 더욱 눈에 자주 보였고……"
10016060-117 = "그, 그런 맹점이 있었을 줄이야……"
10016060-118 = "그보다 뭔가요, 주 3일 노동은?"
10016060-119 = "주 4일 노동이라면 몰라도, 주 3일은 쉬는 날이 일하는 날보다 많은 거 아닌가요?"
10016060-120 = "시, 시끄러워! 세상에 쉬는 것보다 일하는 걸 좋아하는 사람이 몇이나 된다고!"
10016060-121 = "학생들을 위한 총학생회라면 공용 교칙으로 1주일에 4일의 휴일은 보장해주어야 하는 거 아냐?"
10016060-122 = "[s] \"맞아!\""
10016060-123 = "선생님, 이상한 궤변에 맞장구치지 마세요. 어른이시잖아요?"
10016060-124 = "크흠…… 여하튼 교칙을 위반한 채 <황륜대제>의 진행을 저해하려는 행위는 용납할 수 없어."
10016060-125 = "지금이라도 비품을 돌려놓고 순순히 물러선다면 책임을 묻지 않겠지만, 비품에 무슨 문제라도 생긴다면 수리비를 모조리 청구할 테니까!"
10016060-126 = "그런 협박에 우리가 겁을 먹을 줄 알고?"
10016060-127 = "혹여라도 상대가 강경하게 나올 때를 대비해서 이쪽도 대응 수단을 준비했지……"
10016060-133 = "비품을 가져오는 길에 경기장 밖에 주차되어 있던 전차도 함께 가져왔으니까!"
10016060-134 = "[s1] \"전차……?\"\n[s2] \"어, 그건 아마 전차가 아니라—\""
10016060-135 = "응? 이게 전차가 아니면 뭔데?"
10016060-136 = "응? 이게 전차가 아니면 뭔데?"
10016060-137 = "무한궤도와 철갑, 그리고 기관포가 달린 물건이 전차 이외에 또 있어?"
10016060-138 = "[s3] (듣고 보니 맞는 말이군.)\n[s4] (부인할 수 없다.)"
10016060-139 = "게다가 우리는 방금 막 튼튼한 바리케이드를 완성한 참이었거든?"
10016060-140 = "게다가 우리는 방금 막 튼튼한 바리케이드를 완성한 참이었거든?"
10016060-141 = "철골과 목조로 쌓아 올린 이 견고한 바리케이드는, 게헨나 선도부와 트리니티 정의실현부가 손을 잡고 쳐들어오지 않는 이상—"
10016060-147 = "……더 하실 말씀이라도?"
10016060-149 = "보, 보스…… 어쩌죠? 선도부와 정의실현부와 세미나가 함께 있는데요?"
10016060-150 = "거, 겁먹지 마! 그래도 우리에게는 전차가 있으니까!"
10016060-151 = "학생회 임원들이 그 상대라도 수는 많지 않아. 화력으로 밀어붙이면 승산이 있어!"
10016060-152 = "그럼……"
10016060-153 = "가라, <부르주아 크래셔>!"
10016060-154 = "[s] \"응원 로봇에 또 새로운 이름이 붙었어…….\""
