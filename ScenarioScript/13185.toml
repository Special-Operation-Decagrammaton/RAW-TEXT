[translation]
13185-3 = "중앙역 구청사 동쪽 지역"
13185-6 = "(치익) E구역 클리어."
13185-8 = "중앙역 구청사 남쪽 개활지"
13185-10 = "(치익) 확인. S구역도 클리어다."
13185-12 = "중앙역 구청사 북쪽 접근로"
13185-14 = "(치익) N구역 클리어. W구역 보고하라."
13185-15 = "응답하라."
13185-19 = "제너럴. 응답하십시오. 제너럴?"
13185-29 = "크, 크으윽……."
13185-36 = "으음, 대체 뭐였지. 이 녀석들은……."
13185-46 = "살-았어-"
13185-47 = "그러게. 위기일발이었는데. 파햐햐핫-!"
13185-49 = "으음."
13185-50 = "이 녀석들 긴장감이 거의 없잖아……."
13185-51 = "도, 도와주셔서 감사합니다……. 아비도스 여러분들……."
13185-52 = "괜찮으세요?"
13185-53 = "지금 PMC가 <사모펀드>를 습격하고 있는 것 같은데……. 무슨 일이 일어나고 있는지……."
13185-55 = "그러게 말야! 오히려 우리가 묻고 싶다고! 지금 무슨 일이 벌어지고 있는 거야?"
13185-56 = "여러분들은 뭔가 알고 계신 게 없으신가요?"
13185-57 = "글쎄. 어제부터 스오우 감독관이 연락이 안 되는 거 정도? 뭔가 싸움이 시작된다? 이런 얘기를 들었던 거 같기도 한데…… 뭐였지?"
13185-58 = "잠결에 들어서- 까먹었-어-"
13185-59 = "뭐, 어쨌든. 감독관이 없으면 공사를 빨리 끝낼 수 있으니까 그건 또 이득이거든? 퍄햐햣, 그치, 그게 제일 중요하지!"
13185-60 = "왕이-득-"
13185-62 = "어쨌든 지금 상황이 이상하게 돌아가니까…… 여러분들은 일단 공사는 접고 몸을 피하시는 게 좋을 것 같아요."
13185-63 = "드, 들으셨죠? 간부님들? 빨리 이 저주받은 아비도스 땅에서 도망쳐야 해요!"
13185-64 = "아니…… 그 정도는 아닌데……."
13185-66 = "어쨌든 우리는 경고했어?"
13185-68 = "[ns] \"중앙역 구청사로 빨리 가자. 노노미가 걱정돼.\""
13185-69 = "네. 카이저PMC는 네프티스나 사모펀드와는 또 다른 목적을 가지고 있는 것 같으니……."
13185-70 = "지금부터는 총회가 열리는 건물로 직진하겠습니다!"
13185-71 = "응. 빨리 가자. 호시노 선배도 거기로 향했을 거야."
13185-73 = "다음화;채권단 총회"
