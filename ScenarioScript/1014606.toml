[translation]
1014606-1 = "完美議長的夏天"
1014606-2 = ""
1014606-3 = ""
1014606-4 = ""
1014606-6 = "現在的表情很好！"
1014606-7 = "下巴要不要再抬高一點？胸部往內收！"
1014606-8 = ""
1014606-10 = ""
1014606-11 = "沒錯，很完美哦！"
1014606-12 = ""
1014606-13 = ""
1014606-14 = ""
1014606-15 = ""
1014606-17 = ""
1014606-18 = "（抵達現場時，拍攝已經進行得如火如荼）"
1014606-19 = ""
1014606-20 = ""
1014606-22 = "啊！請問是夏萊的老師嗎？"
1014606-23 = "聽說有貴賓要來訪，沒想到竟然是老師～"
1014606-24 = "哎呀，久仰大名！能招待您是我的榮幸！"
1014606-25 = "不過，真的很厲害吧？"
1014606-26 = "啊，我是說真琴同學……不對，是真琴議長。"
1014606-27 = ""
1014606-29 = ""
1014606-30 = ""
1014606-32 = "那是連現役模特兒都很難駕馭的版型，他竟然能穿得那麼自然。"
1014606-33 = "高挑的身材、體態，還有臉蛋……完全沒有缺點呢！"
1014606-34 = ""
1014606-36 = ""
1014606-37 = "而且最厲害的，是那副落落大方的模樣！"
1014606-38 = "面對這麼多燈光和相機還能那麼有自信，我認為這已經屬於才能的範疇了。"
1014606-39 = ""
1014606-40 = ""
1014606-42 = ""
1014606-43 = "明明是塊好璞玉，卻不打算走職業路線……！"
1014606-44 = "老師能不能想辦法好好說服他呢？"
1014606-45 = "[s1] 「我會問問看的。」\n[s2] 「不過學生本人的意願才是最重要的。」"
1014606-48 = "哎呀，您肯這麼說，我就很感激了！"
1014606-49 = ""
1014606-51 = ""
1014606-53 = ""
1014606-54 = "不愧是專家的分析呢。"
1014606-55 = "確實，要是真琴大人以模特兒身分出道，就算要稱霸模特兒界也不是夢想吧！"
1014606-56 = "是嗎……？"
1014606-57 = "我對時尚方面不太懂。"
1014606-58 = "[s3] 「咦，你是！？」\n[s4] 「上次跟真琴吵架的……！？」"
1014606-61 = "啊哈哈，老師還記得啊。"
1014606-62 = "要忘掉才比較難吧？"
1014606-63 = "風紀委員單槍匹馬闖進萬魔殿的部室，搞不好是會寫入格黑娜歷史的大事件耶？"
1014606-64 = "是嗎？我們委員長不是動不動就掀桌殺出來嗎？"
1014606-65 = "那是你們風紀委員長比較奇怪啦……"
1014606-66 = ""
1014606-67 = "[ns5] 「你們兩個……」\n[ns6] 「……看起來感情很好耶？」"
1014606-70 = "不知不覺就變成這樣了。"
1014606-71 = "其實啊，就在那件事的隔天……"
1014606-73 = ""
1014606-75 = ""
1014606-76 = ""
1014606-77 = ""
1014606-78 = ""
1014606-80 = "他突然跑來教室，我還嚇了一跳呢……"
1014606-81 = "不過實際聊過之後，我發現他其實不像我想的那麼壞。"
1014606-82 = "就在我還在為上次的事耿耿於懷的時候……"
1014606-83 = "「說想說的話有什麼錯！！」"
1014606-84 = "……還被反過來這樣鼓勵了呢。"
1014606-85 = "[s7] 「啊，我完全可以想像……」\n[s8] 「確實很有真琴的風格。」"
1014606-88 = "對吧？大家也都是這麼說的。"
1014606-89 = "就這樣彼此和好之後，不知不覺在萬魔殿也交到了朋友。"
1014606-90 = "所以休假的日子偶爾會碰面，或者像這樣幫點忙之類的。#n畢竟風紀委員會和萬魔殿都很忙碌嘛。"
1014606-91 = "啊，這件事絕對要對委員長和首席行政官保密哦……"
1014606-93 = "（之後的拍攝也完全不需要插手，進行得十分順利）"
1014606-94 = "（然後，所有拍攝結束後……）"
1014606-95 = ""
1014606-99 = "辛苦了～！"
1014606-101 = ""
1014606-102 = "啊，老師。你來了嗎？"
1014606-103 = "既然來了怎麼不跟我說一聲呢。"
1014606-104 = "[s9] 「那樣會打擾拍攝……」\n[s10] 「真琴也相當專注。」"
1014606-107 = "嘰嘻嘻！不需要那種多餘的體貼。"
1014606-108 = "對現在的本大人來說，迎接老師是比什麼都優先的任務。"
1014606-109 = "要是你來了卻沒及時通知，本大人反而會錯過重要的事呢！"
1014606-110 = "……話說回來，今天的拍攝如何？"
1014606-111 = "[s11] 「你非常熟練呢？」\n[s12] 「看起來不需要我幫忙。」"
1014606-114 = "嗯？啊啊。原來如此，你誤會了啊。"
1014606-115 = "本大人並不是需要老師幫忙才叫你來的。"
1014606-116 = "不如說正好相反。"
1014606-117 = "之前，老師拒絕了本大人的提案吧。"
1014606-118 = "在那之後，我一直在思考到底是哪裡出了問題……"
1014606-119 = "拒絕本大人這種事，根本不可能發生。"
1014606-120 = "如果拒絕了，那一定是因為還不夠了解我真琴大人有多麼偉大、多麼完美吧。"
1014606-121 = "也就是說，我得出的結論是老師還不夠了解我。"
1014606-122 = "……像今天這樣，要本大人維持完美又美麗的模樣並不難。"
1014606-123 = "然而老師是否能夠了解，又是另一回事。"
1014606-124 = "所以，你要一直待在我身邊。"
1014606-125 = "這麼一來，老師總有一天自然會成為本大人的人吧。"
1014606-126 = "[s13] 「我會盡力而為……」\n[s14] 「雖然要一直待著有點難……」"
1014606-129 = "現在這樣就夠了。"
1014606-130 = ""
1014606-132 = ""
1014606-133 = "……"
1014606-134 = "那，那麼，我再問一次。"
1014606-135 = "……今，今天的拍攝如何？"
1014606-137 = "（之後和真琴一起回到萬魔殿部室欣賞照片）"
1014606-138 = "（每一張都非常美麗）"
