[translation]
1014606-1 = "완벽한 의장님의 여름"
1014606-6 = "지금 표정 좋습니다!"
1014606-7 = "조금 더 턱을 들어보실까요? 가슴은 집어넣고요!"
1014606-11 = "네, 완벽합니다!"
1014606-18 = "(현장에 도착했을 때, 이미 촬영이 한창 진행 중이었다.)"
1014606-22 = "아! 혹시 샬레의 선생님 되십니까?"
1014606-23 = "귀빈이 내방하신다 들었는데, 그게 선생님이실 줄이야~"
1014606-24 = "이야, 이야기는 많이 들었습니다! 모시게 되어 영광입니다!"
1014606-25 = "그나저나 대단하지 않습니까?"
1014606-26 = "아, 마코토 학생, 아니, 마코토 의장님 말입니다."
1014606-32 = "현역 모델도 소화하기 힘든 핏인데, 저렇게 자연스럽게 소화하다니."
1014606-33 = "장신과 스타일, 얼굴까지…… 빠지는 부분이 없네요!"
1014606-37 = "그리고 무엇보다 대단한 것은, 저 당당한 모습!"
1014606-38 = "수많은 조명과 카메라를 앞에 두고 저런 자신감은 재능의 영역이라 보거든요."
1014606-43 = "정말 좋은 원석인데, 프로 지망이 아니라니……!"
1014606-44 = "어떻게 선생님이 잘 설득해 주실 수 없나요?"
1014606-45 = "[s1] \"물어는 보겠습니다만.\"\n[s2] \"학생의 자율이 무엇보다 중요합니다.\""
1014606-48 = "아휴, 말씀만 해주셔도 감사하죠!"
1014606-54 = "역시 전문가다운 분석이네요."
1014606-55 = "확실히 마코토 님이 모델로 데뷔하신다면, 모델계를 평정하는 것도 꿈은 아니겠죠!"
1014606-56 = "그런가……?"
1014606-57 = "나는 패션 쪽은 잘 몰라서."
1014606-58 = "[s3] \"어라, 너는?!\"\n[s4] \"저번에 마코토랑 싸웠던……?!\""
1014606-61 = "아하하, 기억하고 계시네요."
1014606-62 = "까먹기가 더 힘들지 않겠어요?"
1014606-63 = "선도부원이 단신으로 만마전 부실에 침범하다니, 자칫하면 게헨나 역사에 남을 대사건이었다고요?"
1014606-64 = "그래? 우리 부장은 툭하면 엎고 나오는 거 같던데?"
1014606-65 = "그건 당신네 선도부장이 이상한 거죠……."
1014606-67 = "[ns5] \"……? 둘이…….\"\n[ns6] \"……되게 친해 보이네?\""
1014606-70 = "어쩌다 보니, 그렇게 됐네요."
1014606-71 = "사실은 말이죠. 그 다음날……."
1014606-80 = "갑자기 교실로 찾아왔을 때는 놀랐지만……."
1014606-81 = "막상 대화를 해보니까 생각처럼 막 나쁜 사람은 아니어서요."
1014606-82 = "오히려 저번 일로 신경 쓰고 있으니까……."
1014606-83 = "할말을 하는 게 뭐가 잘못이냣!!"
1014606-84 = "……하고는 오히려 격려해 주지 뭐예요."
1014606-85 = "[s7] \"아, 엄청 알 거 같아…….\"\n[s8] \"확실히 마코토답네.\""
1014606-88 = "그쵸? 다들 그렇게 말하더라고요."
1014606-89 = "그렇게 서로 화해하고, 어쩌다 보니 만마전에 친구도 생겨서요."
1014606-90 = "그래서 비번 날에 가끔씩 만나서 이렇게 도와주고 있어요. 선도부도, 만마전도 워낙 바빠서 말이죠."
1014606-91 = "아, 이건 부장님과 선임행정관님께 절대 비밀입니다……."
1014606-93 = "(이후로도 촬영은 손댈 것도 없이 원활하게 진행되어 갔다.)"
1014606-94 = "(그리고 모든 촬영이 끝나고…….)"
1014606-99 = "수고하셨습니다~!"
1014606-102 = "아, 선생. 와 있었나?"
1014606-103 = "왔다면 왔다고 말을 했으면 좋았을 텐데."
1014606-104 = "[s9] \"그러면 촬영에 방해가 되니까…….\"\n[s10] \"마코토도 꽤 집중하고 있었고.\""
1014606-107 = "키시싯! 불필요한 배려다"
1014606-108 = "지금 이 몸에게, 선생을 맞이하는 것은 무엇보다 우선시되는 과업이다."
1014606-109 = "오히려 왔다고 제때 알려주지 않으면, 이 몸은 중요한 것을 놓치게 되는 셈이니 가지지 말도록!"
1014606-110 = "……그보다 오늘 촬영은 어땠나?"
1014606-111 = "[s11] \"대단히 능숙하던데?\"\n[s12] \"내 도움은 필요 없어 보이던데.\""
1014606-114 = "응? 아아. 과연, 착각하고 있군."
1014606-115 = "이 몸은 선생에게서 무언가 조력을 바라고 부른 것이 아니다."
1014606-116 = "오히려 그 반대다."
1014606-117 = "일전에, 선생은 이 몸의 제안을 거절했었지."
1014606-118 = "그 뒤로, 줄곧 무엇이 문제였는지 고민해 보았다만……."
1014606-119 = "이 몸을 거절하는 것은 있을 수 없는 일이다."
1014606-120 = "만약 거절한다면, 그것은 이 마코토 님이 얼마나 위대하고, 완벽한지 충분히 알지 못하기 때문이겠지."
1014606-121 = "즉, 선생은 아직 나에 대해서 잘 모른다는 것이 결론이다."
1014606-122 = "……오늘처럼, 이 몸이 완벽하고 아름다운 모습을 유지하는 것은 어렵지 않다."
1014606-123 = "하지만, 그걸 선생이 아는 것은 별개의 일이지."
1014606-124 = "그러니, 항상 내 곁에 있어라."
1014606-125 = "그러면 언젠가 자연스럽게 선생은 이 몸의 것이 되겠지."
1014606-126 = "[s13] \"선처하겠습니다…….\"\n[s14] \"항상은 어렵겠지만…….\""
1014606-129 = "지금은, 그걸로 족하다."
1014606-133 = "……."
1014606-134 = "그, 그래서, 다시 묻지만."
1014606-135 = "……오, 오늘 촬영은 어땠나?"
1014606-137 = "(그후 마코토와 함께 만마전 부실로 돌아가 사진을 감상했다.)"
1014606-138 = "(무엇도 대단히 아름다운 사진뿐이었다.)"
