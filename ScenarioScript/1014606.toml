[translation]
1014606-1 = "ฤดูร้อนของท่านประธานผู้สมบูรณ์แบบ"
1014606-2 = ""
1014606-3 = ""
1014606-4 = ""
1014606-6 = "สีหน้าตอนนี้ดีมากเลยครับ!"
1014606-7 = "ลองเชิดคางขึ้นอีกนิดได้มั้ยครับ? แล้วก็เก็บอกเข้ามาหน่อยครับ!"
1014606-8 = ""
1014606-10 = ""
1014606-11 = "ครับ สมบูรณ์แบบครับ!"
1014606-12 = ""
1014606-13 = ""
1014606-14 = ""
1014606-15 = ""
1014606-17 = ""
1014606-18 = "(ตอนที่ไปถึง การถ่ายทำก็กำลังดำเนินไปอย่างคึกคักแล้ว)"
1014606-19 = ""
1014606-20 = ""
1014606-22 = "อ๊ะ! ไม่ทราบว่าใช่คุณครูของชาเล่ต์หรือเปล่า?"
1014606-23 = "ได้ยินว่าจะมีแขกผู้มีเกียรติมาเยือน ไม่นึกเลยนะครับว่าจะเป็นคุณครู~"
1014606-24 = "ผมได้ยินเรื่องราวของคุณครูมาเยอะเลย! เป็นเกียรติอย่างยิ่งเลยครับที่ได้ต้อนรับ!"
1014606-25 = "ว่าแต่ สุดยอดไปเลยใช่มั้ยล่ะครับ?"
1014606-26 = "อ๋อ หมายถึงมาโคโตะ ไม่สิ ท่านประธานมาโคโตะน่ะครับ"
1014606-27 = ""
1014606-29 = ""
1014606-30 = ""
1014606-32 = "นี่เป็นทรงชุดที่แม้แต่นางแบบมืออาชีพยังใส่ให้ดูดีได้ยาก แต่กลับใส่ออกมาได้อย่างเป็นธรรมชาติเลย"
1014606-33 = "ทั้งส่วนสูง สัดส่วน ไปจนถึงหน้าตา... ไม่มีจุดไหนด้อยเลยครับ!"
1014606-34 = ""
1014606-36 = ""
1014606-37 = "และที่สุดยอดที่สุดก็คือ ท่าทางที่มั่นใจแบบนั้น!"
1014606-38 = "อยู่ต่อหน้าไฟและกล้องมากมาย แต่ก็ยังมั่นใจได้ขนาดนั้น ถือว่าเป็นพรสวรรค์เลยละครับ"
1014606-39 = ""
1014606-40 = ""
1014606-42 = ""
1014606-43 = "เป็นเพชรเม็ดงามที่ยังไม่เจียระไนแท้ๆ แต่กลับไม่อยากเป็นมืออาชีพเสียอย่างนั้น...!"
1014606-44 = "คุณครูช่วยเกลี้ยกล่อมให้หน่อยได้มั้ยครับ?"
1014606-45 = "[s1] \"ให้ลองถามให้ก็ได้หรอกนะ แต่ว่า...\"\n[s2] \"ให้ตัวนักเรียนเป็นคนตัดสินใจดีกว่า\""
1014606-48 = "โอ๊ย แค่บอกว่าจะช่วยถามให้ ก็ขอบคุณมากแล้วครับ!"
1014606-49 = ""
1014606-51 = ""
1014606-53 = ""
1014606-54 = "สมกับเป็นการวิเคราะห์ของมืออาชีพจริงๆ ค่ะ"
1014606-55 = "ถ้าท่านมาโคโตะเดบิวต์เป็นนางแบบจริงๆ การครองวงการนางแบบก็คงไม่ใช่แค่ความฝันแน่ๆ ค่ะ!"
1014606-56 = "งั้นเหรอ...?"
1014606-57 = "ฉันไม่ค่อยรู้เรื่องแฟชั่นน่ะ"
1014606-58 = "[s3] \"อ้าว คณะกรรมการวินัยจากคราวก่อน?!\"\n[s4] \"นักเรียนที่มีเรื่องกับมาโคโตะคราวก่อนนี่นา...?!\""
1014606-61 = "อะฮะฮ่า ยังจำได้สินะคะ"
1014606-62 = "จะให้ลืมน่าจะยากกว่าอีกไม่ใช่เหรอคะ?"
1014606-63 = "ตอนนั้นสมาชิกคณะกรรมการวินัยบุกเดี่ยวเข้ามาในห้องชมรมแพนเดโมเนียม โซไซตี้ ถ้าเกิดอะไรขึ้น#nคงกลายเป็นเหตุการณ์ใหญ่ที่จารึกในประวัติศาสตร์เกเฮนน่าเลยนะคะ"
1014606-64 = "งั้นเหรอ? แต่ประธานของพวกเราดูเหมือนจะบุกเข้าไปพังนู่นนี่แล้วกลับออกมาอยู่บ่อยๆ นี่นา?"
1014606-65 = "นั่นเป็นเพราะประธานกรรมการวินัยของคุณเป็นคนแปลกเองต่างหากค่ะ..."
1014606-66 = ""
1014606-67 = "[ns5] \"สองคนนี้ เป็นเพื่อนกันแล้วเหรอ...?\"\n[ns6] \"ทั้งคู่ดูสนิทกันมากเลยนะ...?\""
1014606-70 = "ไปๆ มาๆ ก็เป็นแบบนั้นไปแล้วค่ะ"
1014606-71 = "ที่จริงแล้ว วันต่อมา..."
1014606-73 = ""
1014606-75 = ""
1014606-76 = ""
1014606-77 = ""
1014606-78 = ""
1014606-80 = "ตอนที่จู่ๆ ก็มาหาที่ห้องเรียน ฉันก็ตกใจอยู่หรอกค่ะ..."
1014606-81 = "แต่พอได้คุยกันจริงๆ ก็ไม่ได้เป็นคนแย่อย่างที่คิดค่ะ"
1014606-82 = "พอเห็นว่าฉันยังคิดมากเรื่องคราวก่อนอยู่..."
1014606-83 = "การพูดสิ่งที่ควรพูดมันผิดตรงไหนกันเล่า!!"
1014606-84 = "กลายเป็นว่ามาพูดแบบนั้นใส่ แต่ก็มาให้กำลังใจกันซะงั้นค่ะ..."
1014606-85 = "[s7] \"อ่า ครูเข้าใจสุดๆ เลย...\"\n[s8] \"สมเป็นมาโคโตะจริงๆ\""
1014606-88 = "ใช่มั้ยล่ะคะ? ใครๆ ก็พูดแบบนั้นกันค่ะ"
1014606-89 = "แล้วพวกเราก็คืนดีกัน ทำไปทำมาฉันก็มีเพื่อนใหม่ในแพนเดโมเนียม โซไซตี้ด้วยค่ะ"
1014606-90 = "เราก็เลยนัดเจอกันบ้างเป็นครั้งคราวในวันหยุดเวร แล้วมาช่วยกันแบบนี้ละค่ะ ก็ทั้งคณะกรรมการวินัย#nและแพนเดโมเนียม โซไซตี้ต่างก็ยุ่งมากนี่คะ"
1014606-91 = "อ๊ะ เรื่องนี้ห้ามบอกท่านประธานกับเจ้าหน้าที่อาวุโสเด็ดขาดเลยนะคะ..."
1014606-93 = "(หลังจากนั้น การถ่ายทำก็ดำเนินไปอย่างราบรื่นโดยไม่ต้องแก้ไขอะไรเลย)"
1014606-94 = "(และเมื่อการถ่ายทำทั้งหมดจบลง...)"
1014606-95 = ""
1014606-99 = "ขอบคุณที่ทำงานหนักนะครับ~!"
1014606-101 = ""
1014606-102 = "อ้าว ครู มาอยู่ที่นี่แล้วเหรอ?"
1014606-103 = "ถ้ามาแล้วก็น่าจะบอกกันสักหน่อยสิ"
1014606-104 = "[s9] \"ครูกลัวว่าถ้าบอก จะรบกวนการถ่ายทำน่ะ...\"\n[s10] \"พอดีครูเห็นมาโคโตะกำลังมีสมาธิอยู่น่ะ\""
1014606-107 = "คิกคิกคิก! ไม่เห็นต้องเกรงใจเราขนาดนั้นเลย"
1014606-108 = "สำหรับเราในตอนนี้ การต้อนรับครูคือภารกิจที่ต้องมาก่อนสิ่งใด"
1014606-109 = "กลับกัน ถ้าไม่บอกให้รู้ทันทีว่ามาแล้ว ก็เท่ากับว่าเราพลาดสิ่งสำคัญไป เพราะงั้นก็อย่าทำแบบนี้อีกล่ะ!"
1014606-110 = "ว่าแต่... การถ่ายทำวันนี้เป็นยังไงบ้าง?"
1014606-111 = "[s11] \"ดูคล่องแคล่วมากเลย ครูไม่ต้องช่วยก็ยังได้\"\n[s12] \"ทำได้ดีเลย ไม่จำเป็นต้องให้ครูช่วยเลยละ\""
1014606-114 = "หืม? อ้อ อย่างนี้นี่เอง เข้าใจผิดอยู่สินะ"
1014606-115 = "เราไม่ได้เรียกครูมาเพราะหวังให้ช่วยเหลืออะไรหรอก"
1014606-116 = "กลับกันเสียด้วยซ้ำ"
1014606-117 = "ก่อนหน้านี้ ครูเคยปฏิเสธข้อเสนอของเราไป"
1014606-118 = "หลังจากนั้นเราก็ครุ่นคิดมาตลอดว่าปัญหาอยู่ที่ตรงไหน..."
1014606-119 = "แต่การปฏิเสธเรานั้นเป็นเรื่องที่ไม่ควรเกิดขึ้นได้"
1014606-120 = "ถ้าปฏิเสธ นั่นคงเป็นเพราะครูยังไม่รู้ดีพอว่าท่านมาโคโตะผู้นี้ยิ่งใหญ่และสมบูรณ์แบบแค่ไหน"
1014606-121 = "สรุปก็คือ ครูยังไม่รู้จักเราดีพอนั่นเอง"
1014606-122 = "อย่างวันนี้ การที่เราจะคงโฉมอันสมบูรณ์แบบและงดงามไว้นั้นไม่ใช่เรื่องยาก..."
1014606-123 = "แต่การที่ครูจะรู้เรื่องนั้นเป็นอีกเรื่องหนึ่ง"
1014606-124 = "เพราะงั้น จงอยู่ข้างกายเราเสมอเสียล่ะ"
1014606-125 = "แล้วสักวันหนึ่ง ครูก็จะกลายเป็นของเราไปเองอย่างเป็นธรรมชาติ"
1014606-126 = "[s13] \"ครูจะเก็บไปพิจารณาดูนะ...\"\n[s14] \"แต่ให้อยู่ข้างกายตลอดเวลาน่าจะยากอยู่นะ...\""
1014606-129 = "สำหรับตอนนี้ แค่นั้นก็เพียงพอแล้วละ"
1014606-130 = ""
1014606-132 = ""
1014606-133 = "..."
1014606-134 = "ถะ... ถ้างั้น ขอถามอีกครั้งก็แล้วกัน"
1014606-135 = "กะ... การถ่ายทำวันนี้เป็นยังไงบ้าง?"
1014606-137 = "(หลังจากนั้น คุณครูกับมาโคโตะก็กลับไปที่ห้องชมรมแพนเดโมเนียม โซไซตี้แล้วดูรูปถ่ายด้วยกัน)"
1014606-138 = "(ทุกรูปล้วนงดงามเป็นอย่างยิ่ง)"
