[translation]
10059030-1 = "第3話;ブラックマーケット調査"
10059030-2 = "（次の日）"
10059030-8 = "ここ……かな？"
10059030-9 = "書記官が言っていたブラックマーケットは。"
10059030-10 = "……隊長。#nブラックマーケットはこうも簡単に来られる場所なんですか？"
10059030-11 = "もっと人目につかない所に隠れているものだとばかり。"
10059030-13 = "普通の生徒が、モモフレンズのグッズを探しに来るらしいよ。"
10059030-14 = "スケバンから身を守れるだけの力は持っているんだろうけど。"
10059030-15 = "それにしても……こんな場所を最初に作ったのは誰なんだろう。"
10059030-16 = "一度、ゆっくりお話してみたいな。"
10059030-17 = "それは私も気になりますね。無法地帯の元祖はどこの誰なんだか。"
10059030-21 = "ふふっ、皆さんやる気に満ちていて何よりです。"
10059030-22 = "さっそく調査を始めましょうか。"
10059030-23 = "可能な限り多くの芸術品を回収し、学院へ持ち帰るのです。"
10059030-24 = "り、寮監隊の皆さん……どうか、よろしくお願いします……。"
10059030-25 = "当のウララ様には、あまり覇気を感じませんが……。"
10059030-26 = "こ、こういう場所はどうにも慣れなくて……。"
10059030-27 = "優しすぎるところはウララ副会長の長所であり短所ですね。#nもう少し自信をお持ちなさい。"
10059030-28 = "ふむ……ウララ様。#nこう叫んでみるのはいかがでしょう。"
10059030-32 = "貴様らァ！！全員まとめてかかってこい――っ！！"
10059030-33 = "えぇっ……！？"
10059030-34 = "さあ、ウララ様も。#nマナミ様のお言葉通り、まずは自信を持つことですよ。"
10059030-39 = "き、ききき、きさまらぁ～！#nぜ、ぜぜ、全員まとめて……かかって……かかって、きて、ください……！"
10059030-42 = "ふふっ、その意気です。"
10059030-48 = "[ns] \"みんな、向こうから誰か来るよ？\""
10059030-51 = "何だ？ワイルドハントの優等生どもじゃねぇか。"
10059030-52 = "おい、てめぇら！人のシマで何してやがる！？"
10059030-53 = "目障りなんだよ、痛い目見る前にとっとと失せな……！！"
10059030-54 = "あら。初手から活きのいい獲物が餌にかかりましたね。"
10059030-55 = "わ、わたくしは餌だったのですか……！？"
10059030-56 = "てめぇら……うちらを前にして、ふざけてんのか！？"
10059030-57 = "舐めた真似したツケ、きっちり払わせてやる……！"
10059030-58 = "さて。代償を払うのはどちらでしょうね。"
10059030-59 = "サヨ寮監隊長。"
10059030-64 = "私の出番だね。"
10059030-65 = "準備はいい？"
10059030-69 = "な、何だよ……？"
10059030-70 = "こいつ、圧が急に――！"
10059030-71 = "それじゃあ……。"
10059030-72 = "みんなで楽しく「お話」しようか。"
