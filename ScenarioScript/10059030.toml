[translation]
10059030-1 = "제3화;블랙마켓 조사"
10059030-2 = "(다음 날.)"
10059030-8 = "으음, 여기구나?"
10059030-9 = "서기관이 말한, 예술품을 취급하는 블랙마켓이."
10059030-10 = "……대장. 블랙마켓이라는 곳이 이렇게 쉽게 올 수 있는 곳이었습니까?"
10059030-11 = "좀 더 은밀한 곳에 숨어 있어야 하는 거 아니야?"
10059030-13 = "일반 학생이 모모프렌즈 굿즈를 구하러 올 정도로 말이야."
10059030-14 = "물론 불량배들에게서 자신을 지킬 힘 정도는 있어야겠지."
10059030-15 = "대체 누가 이런 곳을 만들었을까. 만나서 대화를 나눠보고 싶네."
10059030-16 = "궁금한 게 너무 많아."
10059030-17 = "그건 저도 궁금하네요. 대체 어떤 녀석이 불법의 시초였을까."
10059030-21 = "후후, 다들 의욕적인 모습이 보기 좋군요."
10059030-22 = "자, 어서 조사를 시작하도록 하죠."
10059030-23 = "가능하면 많은 예술품을 회수해 학원으로 가져가는 거예요."
10059030-24 = "사, 사감대 여러분…… 들으셨죠? 모두 힘내 주세요……."
10059030-25 = "정작 우라라 님은 별로 힘이 나지 않으시는 눈치입니다만……."
10059030-26 = "이, 이런 곳은 왠지 익숙하지 않아서……."
10059030-27 = "너무 순한 것이 우라라 부회장의 흠입니다. 조금 더 자신감을 가지세요."
10059030-28 = "그렇다면…… 우라라 님. 이렇게 외쳐보는 건 어떨까요?"
10059030-32 = "다 덤벼 짜식들아!!"
10059030-33 = "……?!"
10059030-34 = "자. 해보는 겁니다. 마나미 님의 말씀처럼 자신감을 가지는 거예요."
10059030-39 = "다, 다 다 덤비세요……! 짜식들아……!!"
10059030-42 = "후후, 좋습니다. 바로 그 기세입니다."
10059030-48 = "[ns] \"다들, 저쪽에서 누군가가 오는데?\""
10059030-51 = "뭐야? 와일드헌트의 범생이들이잖아?"
10059030-52 = "어이! 네놈들! 우리 구역에서 뭐 하는 거야?!"
10059030-53 = "재수 없으니까 좋은 말로 할 때 꺼져……!!"
10059030-54 = "이런. 시작부터 상대가 미끼를 물었군요."
10059030-55 = "저, 저는 미끼였던 건가요……?!"
10059030-56 = "이 자식들, 지금 우리 앞에서 장난치고 있어?!"
10059030-57 = "우릴 무시한 대가를 치르게 해주마……!"
10059030-58 = "글쎄요? 대가를 치르는 건 누구일지."
10059030-59 = "사요 사감대장."
10059030-64 = "이제 내 차례구나?"
10059030-65 = "다들 준비는 됐니?"
10059030-69 = "뭐, 뭐야 저 녀석……?"
10059030-70 = "부, 분위기가……!"
10059030-71 = "자, 그럼……"
10059030-72 = "즐거운 <대화>의 시간이야."
