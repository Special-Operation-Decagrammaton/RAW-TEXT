[translation]
211050-1 = "제5화;게헨나를 위대하게……?"
211050-5 = "[ns] \"헉, 헉…… 마유미, 엄청 빠르구나…….\""
211050-6 = "아, 회장이 벌써 행동을 시작했네. 학생들이 꽤 모였는데."
211050-9 = "하지만, 지금의 게헨나는 어때?"
211050-10 = "그야말로 혼란 그 자체!"
211050-11 = "구심점이라고는 없이, 산발적으로 소모적인 행동만 가득할 뿐!!"
211050-16 = "그게 재밌는 건데?"
211050-17 = "구심점이 왜 필요해?"
211050-18 = "게헨나를 다시 위대하게 만들기 위해서지!"
211050-19 = "게헨나가 왜 위대해져야 하는데?"
211050-20 = "게헨나가 위대했던 적이 있어?"
211050-21 = "물론! 있어!"
211050-22 = "그리고 '위대하다'라는 말을 너무 거창하게 생각하지 마."
211050-23 = "내가 말하는 위대함이란 건, 어려운 역사나 따분한 도덕에서 찾아볼 수 있는 게 아냐."
211050-24 = "위대하다는 말은 즉, 강하다는 말과 동일해!!"
211050-29 = "우리 충분히 강하지 않나?"
211050-30 = "맞지. 키보토스 3대 학원인데."
211050-31 = "정말 그걸로 괜찮다고 생각하는 거야? 우리가 키보토스에서 가장 강했던 때가 분명히 있었는데, 다른 학원이랑 어깨를 나란히 하는 걸로 만족해?"
211050-32 = "그, 그렇게는 생각 안 해봤는데……."
211050-33 = "그렇다면 게헨나가 예전보다 약해진 이유는 뭘까?"
211050-34 = "바로, 우리가 한마음으로 뭉치지 못했기 때문이야!"
211050-35 = "다들 지금처럼 아무렇게나 사고 치는 것만으로 만족하고 있겠지만, 생각해 봐."
211050-36 = "우리가 하나로 뭉쳐서 키보토스 최강이 되는 모습을!"
211050-37 = "더 많은 예산! 더 많은 탄약! 그리고 어떤 학교의 눈치를 볼 필요도 없지!"
211050-38 = "그 누구의 눈치도 보지 않을 수 있는 강력한 힘! 우리가 위대해진다는 건, 바로 그런 것들을 우리 손으로 쟁취한다는 뜻이라고!"
211050-42 = "지금도 눈치는 안 보고 있는데……."
211050-43 = "뭐, 말은 그럴듯하지만 너무 거창한 거 아냐?"
211050-47 = "그래서 뭘 어떻게 위대하게 만들 건데?"
211050-48 = "맞아. 응원만 한다고 되는 게 아니잖아."
211050-49 = "그건……"
211050-54 = "쇼코!!"
211050-55 = "[s] \"생각 안 해둔 거냐!\""
211050-60 = "말씀드렸다시피 저희 회장은 디테일에 약하기에. 여기서는 제가 나설 때지요."
211050-61 = "게헨나재흥위원회의 서기, 이가라시 쇼코입니다. 지금부터는 제가 설명드리죠."
211050-62 = "오옷……."
211050-63 = "일단, 위대함도 첫걸음부터. 쉬운 것부터 시작해 봅시다."
211050-64 = "간단하게 지금의 게헨나에서 일어나는 일들을 예로 들어볼까요."
211050-68 = "당장 오늘 아침만 하더라도 여러분 중 누군가 발사한 로켓 런처로 농구장의 한쪽 골대가 파손됐고, 점심시간에는 동아리 본관에서 터진 크레모아로 교문 경계 철학부 탄약고에 유폭이 발생해서 동아리실 전체가 박살 났습니다."
211050-69 = "아, 맞아. 그거 진짜 웃겼는데."
211050-70 = "보통 그런 경우, 어떤 일이 발생하지요?"
211050-71 = "어…… 선도부 출동?"
211050-72 = "일을 저지른 학생은 반성실에서 하루 종일 갇혀 있다가 풀려나거나 하고."
211050-73 = "벌점이라거나, 반성문이라거나……"
211050-74 = "으, 둘 다 지긋지긋해."
211050-75 = "맞습니다. 선도부는 교칙을 준수하지 않는 이들을 처벌하는 단체지요."
211050-76 = "공공장소에서 발생하는 소란, 난동, 총기 난사, 교내 폭발물 설치 등이 모두 해당됩니다."
211050-77 = "그건 그냥 평범한 건데, 선도부는 너무 빡빡하다니까."
211050-81 = "그런데 만약, 일련의 행동들을 선도부가 방해하지 않는다면 어떨까요?"
211050-82 = "뭐? 그럴 리가 없는데?"
211050-83 = "어떻게?"
211050-84 = "선도부가 싫어하는 행동들을 합법적으로 만들면 됩니다."
211050-85 = "예를 들어볼까요?"
211050-86 = "만약, 그런 소란들을 허가받은 장소에서만 실행한다면?"
211050-87 = "응? 그게 무슨 말이야?"
211050-88 = "새로 산 탄약을 시험하고 싶다거나, 갑자기 수류탄을 던지고 싶어졌다거나 할 때 찾아갈 수 있는 곳이 있다면 어떨까요?"
211050-89 = "선도부의 눈치도 보지 않고, 마음대로 뭔가를 할 수 있는 공간 말입니다."
211050-90 = "오?"
211050-91 = "좋긴 한데……."
211050-92 = "근데 그런 건 생각날 때 해야 제맛인데."
211050-93 = "맞아. 그냥 하고 싶을 때 하면 되잖아. 굳이 그런 곳까지 찾아갈 필요 있어?"
211050-94 = "그게 핵심이죠. 작은 귀찮음으로 더 큰 귀찮음을 피하는 겁니다."
211050-95 = "잠깐을 못 참아서 선도부 지하감옥에 끌려가 하루 종일 벽만 보고 앉아 있고 싶나요?"
211050-96 = "으으…… 그건 싫지만……"
211050-101 = "후후, 역시 쇼코야. 섬세하게 조곤조곤 설득하고 있네."
211050-105 = "아, 나 방금 좋은 생각이 났어!"
211050-106 = "뭔데?"
211050-107 = "우리가 만든 공간을 이용하면, 이용 횟수와 시간에 비례해 '마일리지'를 적립해 주는 거야! 어때?"
211050-108 = "마일리지……?"
211050-109 = "응! 식당이나 가게에서 종종 마일리지를 쌓아주잖아? 그거랑 똑같아!"
211050-110 = "학생들이 그 공간을 이용할수록 마일리지를 쌓아서, 그거 가지고 이런저런 거 살 수도 있고! 막 무슨 무슨 혜택도 있고!"
211050-111 = "일이 커지는데. 그거 우리가 관리할 수 있으려나?"
211050-112 = "……"
211050-113 = "쇼코!!"
211050-114 = "[s] \"또 이거냐!\""
211050-115 = "확실히…… 학생 개개인에 대응하는 마일리지 개념이라면, 통제의 목적이 더 강해집니다."
211050-116 = "인적 사항이 필요하니, 학생들의 개인 정보를 수집하는 데에도 유리할 테고요."
211050-120 = "개인 정보는 왜?"
211050-121 = "어쨌든, 마일리지 제도는 괜찮은 것 같습니다. 한번 생각해 볼만할지도요."
211050-122 = "그치? 나도 마일리지 때문에 안 가도 될 가게 가기도 하니까! 효과 있을 거야!"
211050-123 = "나야 뭐, 만든다고 하면 찬성인데. 나쁠 거 없으니까."
211050-124 = "이왕 하는 김에, 게헨나 자치구 내에서 그 마일리지를 활용할 수 있도록 상점들과 가맹을 맺어버리죠."
211050-125 = "우와! 그런 것도 가능해?"
211050-126 = "여기 계신 분이 누군지 잊으셨습니까?"
211050-127 = "아!! 맞네! 선생님이 있잖아?"
211050-128 = "[s] \"네? 저요?\""
211050-129 = "도와준다고 하지 않으셨습니까, 선생님."
211050-130 = "선생님의 도움을 간절히 원하는 학생들이 여기 있습니다. 모른 척하지는 않으시겠지요."
211050-131 = "별거 아니야, 선생님! 난 잘 모르지만, 명의라든가 빌려줄 수 있어?"
211050-132 = "보증을 서준다든가, 담보를 내어준다든가!"
211050-136 = "걱정 마. 내 명예를 걸고 최선을 다해 도울 테니까."
211050-137 = "-라고 선생님은 생각했습니다."
211050-138 = "[s1] \"명예를 건 적은 없는데요!\"\n[s2] \"아무튼, 함께 살펴보도록 하자.\""
211050-141 = "선생님, 역시 믿음직하네~"
211050-146 = "샬레의 선생님까지 도와준다고?"
211050-147 = "그럼 신뢰할 수 있다는 거잖아."
211050-148 = "정리하자면……"
211050-149 = "너희가 말한 장소를 이용하면 선도부에 끌려가지도 않고, 오히려 마일리지가 쌓인다는 거야?"
211050-150 = "바로 그거지! 리스크는 줄이고, 리턴은 높인다!!"
211050-151 = "그거, 혹시 지금도 이용 가능해? 나 아까부터 손이 근질근질하거든."
211050-152 = "물론! 말 나온 김에 바로 출발하자!"
211050-156 = "우왓, 좋았어! 신난다~!"
211050-160 = "나도! 나도 가볼래!"
211050-168 = "생각보다 반응이 좋잖아!"
211050-169 = "선생님도 함께 가시죠. 보여드리고 싶기도 하고요."
211050-170 = "[s] \"좋아. 나도 궁금했거든.\""
211050-171 = "자, 그럼 이쪽으로……"
211050-177 = "오! 꽤 잘 만들어놨잖아?"
211050-178 = "표적지도 있고, 건물도 있어! 마음껏 쏠 수 있겠는데!"
211050-179 = "지금 바로 해도 돼? 응? 응?"
211050-180 = "그전에, 학생증을 보여주실 수 있을까요?"
211050-181 = "학생증……?"
211050-182 = "그런 게 있었나? 넌 있어?"
211050-183 = "아니. 어딨는지도 모르겠는데. 그게 꼭 필요해?"
211050-184 = "……."
211050-185 = "역시 아무도 신경 쓰지 않을 것 같긴 했습니다만, 그럼 이쪽에 학년과 이름을 적어주십시오."
211050-186 = "그 정도는 알지!"
211050-192 = "쇼코, 학년이랑 이름은 왜?"
211050-193 = "이걸 알아야 마일리지 관리가 될 테니까요. 아직 어떤 식으로 구축할지는 미지수지만."
211050-194 = "또 이렇게 데이터화 해두면 어떤 학생이 우리 시설을 이용했는지, 어떤 시간에 얼마나 많은 학생들이 사용하는지 등을 알 수 있을 테니 관리하기 용이하겠죠."
211050-195 = "향후 조직이 커졌을 경우에도 이런 것들을 자산으로 활용할 수 있을 겁니다."
211050-196 = "오!! 그러네. 나는 전혀 생각 못 했어."
211050-197 = "역시 꼼꼼하네~"
211050-198 = "[s] \"쇼코는 머리가 좋구나.\""
211050-199 = "게헨나의 미래를 짊어진 몸이니까요."
211050-200 = "이름이랑 다 적었어! 그럼 이제 맘대로 써도 되지?"
211050-201 = "헤헷, 신난다!"
211050-205 = "둘 다 3학년…… 네, 좋군요."
211050-217 = "와하핫! 나 이렇게 시원하게 쏴보는 거 오랜만이야!"
211050-218 = "나도나도! 수류탄도 던져볼까? 저기 드럼통을 먼저 터뜨리는 사람이 이기는 거야!"
211050-224 = "다들 좋아하는데!"
211050-225 = "열심히 꾸며놓은 보람이 있네. 대부분의 학생들한테도 잘 먹힐 것 같고. 야핫!"
211050-226 = "무언가를 쏘고, 부수고, 파괴하는 행위…… 게헨나에서는 억눌린 본능을 효율적으로 연소시키는 스트레스 해소법이죠."
211050-227 = "그러니, 우리는 앞으로도 이들이 본능을 쏟아부을 수 있는 장소를 제공해주면 됩니다."
211050-228 = "[s] \"다 좋은데……\""
211050-232 = "[ns] \"이거 허가는 받은 거지?\""
211050-234 = "아니?"
211050-235 = "[s] \"아니야?!\""
211050-236 = "일단 저질러놓고, 나중에 수습하는 게 더 쉽다고 생각했습니다."
211050-237 = "[s3] \"나랑 비슷한 발상이긴 한데……!\"\n[s4] \"그래도 이런 건 정식으로 처리하는 게 좋지 않을까!\""
211050-240 = "맞아! 사실 선생님에게 도움을 요청한 이유도 그거야!"
211050-241 = "뭔가 기세 좋게 시작은 했는데, 이제 와서 허가를 요청하자니 좀 켕기는 부분도 있고 해서!"
211050-242 = "그런데 방금 선생님이 말한 것처럼, 선도부나 만마전도 알고 있어야 여기서의 활동을 제지받지 않을 거 아냐?"
211050-243 = "특정 장소에서 난동 부리는 걸로 보일지도 모르잖아!#n이걸 정식 활동으로 만들어 버리면 문제없겠지?"
211050-244 = "그러니까……"
211050-245 = "같이 가서 말해주면 안 될까? 선생님?"
211050-246 = "[s] 알겠다고 대답한다."
211050-247 = "선생님, 아까부터 엄청 흔쾌하잖아! 곤란해하지도 않고."
211050-248 = "[s] \"아니, 곤란한 건 맞거든!\""
211050-249 = "야핫! 그런데도 그렇게 시원하게 대답한 거야?"
211050-253 = "학생을 돕는 게 선생님의 본분이니까?"
211050-254 = "……"
211050-255 = "흐응~ 왜 다들 선생님을 의지하는지 알 것 같네."
211050-256 = "아무튼, 이제부터 같이 가서 설득하는 거니까. 선생님, 부탁해?"
211050-257 = "쇼코가 계획을 생각해 뒀을 테니까 괜찮을 거야. 야핫!"
211050-258 = "세부 내용은 맡겨주셔도 좋습니다."
211050-259 = "그리고 너무 걱정 마십시오. 실패한다 해도 선생님의 명예가 실추될 뿐이니까요."
211050-260 = "[s] \"내 명예라는 건 뭘까…….\""
211050-264 = "자, 얼른얼른! 움직이자고!"
211050-266 = "다음화;협상"
