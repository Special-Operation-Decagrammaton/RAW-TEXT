[translation]
211050-1 = "第5話;讓格黑娜偉大……？"
211050-4 = ""
211050-5 = "[ns] 「哈啊，哈啊……真由美，跑得好快啊……」"
211050-6 = "啊，委員長已經開始了。聚集了不少學生呢。"
211050-9 = "可是，現在的格黑娜又是什麼樣子？"
211050-10 = "簡直就是一團混亂！"
211050-11 = "沒有核心，到處都是零零散散、毫無意義的行為！！"
211050-12 = ""
211050-14 = ""
211050-15 = ""
211050-16 = "那樣才有趣啊？"
211050-17 = "為什麼一定要有核心？"
211050-18 = "是為了讓格黑娜再次偉大啊！"
211050-19 = "格黑娜為什麼要變得偉大？"
211050-20 = "格黑娜有偉大過嗎？"
211050-21 = "當然！有過！"
211050-22 = "還有，不要把「偉大」想得太誇張。"
211050-23 = "我所說的偉大，不是那種在艱深的歷史或無聊的道德裡才找得到的東西。"
211050-24 = "所謂偉大，就等於強大！！"
211050-25 = ""
211050-27 = ""
211050-28 = ""
211050-29 = "我們不是已經夠強了嗎？"
211050-30 = "對啊。我們可是奇普托斯3大學園之一耶。"
211050-31 = "你們真的覺得那樣就好了嗎？#n我們明明曾經是奇普托斯最強的，卻要滿足於跟其他學園平起平坐？"
211050-32 = "我，我倒是沒那樣想過……"
211050-33 = "那麼，格黑娜變得比以前弱的原因是什麼呢？"
211050-34 = "就是因為我們沒能團結一心！"
211050-35 = "大家或許覺得像現在這樣隨便惹事就夠了，不過想像一下吧。"
211050-36 = "我們團結一致，成為奇普托斯最強的模樣！"
211050-37 = "更多的預算！更多的彈藥！而且也不需要看任何學園的臉色！"
211050-38 = "不必看任何人臉色的強大力量！#n所謂變得偉大，就是要靠自己的雙手把這些東西爭取過來！"
211050-39 = ""
211050-42 = "我們現在也沒在看誰的臉色啊……"
211050-43 = "聽起來是很像一回事，但不會太誇張了嗎？"
211050-44 = ""
211050-46 = ""
211050-47 = "所以到底要怎麼讓格黑娜偉大？"
211050-48 = "沒錯。光是喊口號也不會有用吧。"
211050-49 = "那是……"
211050-50 = ""
211050-52 = ""
211050-53 = ""
211050-54 = "翔子！！"
211050-55 = "[s] 「你根本沒想好嘛！」"
211050-56 = ""
211050-58 = ""
211050-59 = ""
211050-60 = "如同我之前說過的，我們委員長不擅長處理細節。這時候就輪到我出場了。"
211050-61 = "我是格黑娜再興委員會的書記，五十嵐翔子。接下來由我來說明。"
211050-62 = "哦哦……"
211050-63 = "偉大也得一步一步來。我們先從簡單的事情著手吧。"
211050-64 = "就拿現在格黑娜發生的事情來舉例吧。"
211050-65 = ""
211050-67 = ""
211050-68 = "光是今天早上，就有在場某人發射的火箭筒打壞了籃球場的一邊籃框，#n午餐時間社團大樓引爆的闊刀地雷，又讓學園境界哲學部的彈藥庫發生殉爆，#n整間部室都被炸得粉碎。"
211050-69 = "啊，對耶。那個超好笑的。"
211050-70 = "通常這種情況下，會發生什麼事呢？"
211050-71 = "呃……風紀委員會出動？"
211050-72 = "闖禍的學生會被關在反省室一整天，然後才被放出來之類的。"
211050-73 = "扣分啊，寫悔過書啊……"
211050-74 = "嗚，兩個都煩死了。"
211050-75 = "沒錯。風紀委員會就是懲罰違反校規者的團體。"
211050-76 = "在公共場所引發的騷動、鬧事、亂開槍、在校內設置爆裂物等等，全都包含在內。"
211050-77 = "那些都很普通啊，風紀委員會實在太死板了。"
211050-78 = ""
211050-80 = ""
211050-81 = "不過，要是風紀委員會不來妨礙這些行為會怎麼樣呢？"
211050-82 = "什麼？不可能吧？"
211050-83 = "要怎麼做？"
211050-84 = "只要讓風紀委員會討厭的行為變得合法就行了。"
211050-85 = "我來舉個例子吧。"
211050-86 = "如果只在獲得許可的場所搞那些騷動呢？"
211050-87 = "嗯？那是什麼意思？"
211050-88 = "想試試新買的彈藥，或是突然想丟手榴彈的時候，#n如果有個地方可以去，會怎麼樣呢？"
211050-89 = "我說的是不必看風紀委員會臉色，可以隨心所欲做些什麼的空間。"
211050-90 = "哦？"
211050-91 = "是不錯啦……"
211050-92 = "不過那種事要想到的時候做才有意思啊。"
211050-93 = "對啊。想做的時候做就好了吧。有必要特地跑到那種地方去嗎？"
211050-94 = "這就是重點。用小小的麻煩來避免更大的麻煩。"
211050-95 = "難道你想因為一時忍不住，被抓進風紀委員會的地下牢房，一整天坐著面壁嗎？"
211050-96 = "嗚嗚……我確實不喜歡那樣……"
211050-97 = ""
211050-99 = ""
211050-100 = ""
211050-101 = "呵呵，不愧是翔子。說服得既細膩又有條理呢。"
211050-102 = ""
211050-104 = ""
211050-105 = "啊，我剛剛想到一個好主意！"
211050-106 = "什麼？"
211050-107 = "只要使用我們打造的空間，就能依使用次數和時間累積「點數」！怎麼樣？"
211050-108 = "點數……？"
211050-109 = "嗯！餐廳或商店不是常常會幫你累積點數嗎？就跟那個一樣！"
211050-110 = "學生們越常使用那個空間就能累積越多點數，可以用點數買各種東西！#n還會有什麼什麼優惠！"
211050-111 = "事情越搞越大了。那個我們管理得來嗎？"
211050-112 = "……"
211050-113 = "翔子！！"
211050-114 = "[s] 「又來了！」"
211050-115 = "確實……如果是對應每位學生的點數概念，管制的目的就會更強。"
211050-116 = "而且因為需要個人資料，要收集學生的個人資訊也會比較方便。"
211050-117 = ""
211050-119 = ""
211050-120 = "要個人資訊做什麼？"
211050-121 = "總之，點數制度似乎不錯。或許值得考慮看看。"
211050-122 = "對吧？我也會為了點數去本來不用去的店！一定會有效果的！"
211050-123 = "我嘛，要做的話是贊成啦。反正也沒什麼壞處。"
211050-124 = "既然要做，乾脆跟格黑娜自治區內的商店簽訂加盟，讓點數可以在那裡使用吧。"
211050-125 = "哇！連那種事都辦得到嗎？"
211050-126 = "你忘了在這裡的這位是誰了嗎？"
211050-127 = "啊！！對耶！我們有老師在嘛！"
211050-128 = "[s] 「咦？我嗎？」"
211050-129 = "您不是說要幫忙嗎，老師。"
211050-130 = "這裡有殷切需要老師幫助的學生們。您不會假裝沒看到吧。"
211050-131 = "沒什麼大不了的啦，老師！#n雖然我不太懂，可以借用一下名義之類的嗎？"
211050-132 = "比如擔任保證人，或者提供擔保品之類的！"
211050-133 = ""
211050-135 = ""
211050-136 = "別擔心。我會賭上我的名譽，盡全力幫忙的。"
211050-137 = "──老師是這麼想的。"
211050-138 = "[s1] 「我可沒賭上什麼名譽！」\n[s2] 「總之，我們一起試看看吧。」"
211050-141 = "老師果然很可靠呢～"
211050-142 = ""
211050-144 = ""
211050-145 = ""
211050-146 = "連夏萊的老師都在幫忙？"
211050-147 = "那不就代表可以信任嗎。"
211050-148 = "所以總結來說……"
211050-149 = "意思是使用你們說的場所就不會被風紀委員會抓走，反而還能累積點數嗎？"
211050-150 = "就是這樣！降低風險，提高報酬！！"
211050-151 = "那個，現在也能使用嗎？#n我的手從剛才就癢得不得了。"
211050-152 = "當然！擇日不如撞日，馬上出發吧！"
211050-153 = ""
211050-155 = ""
211050-156 = "哇，太好了！好興奮～！"
211050-157 = ""
211050-159 = ""
211050-160 = "我也是！我也要去看看！"
211050-161 = ""
211050-163 = ""
211050-165 = ""
211050-166 = ""
211050-167 = ""
211050-168 = "反應比想像中還好嘛！"
211050-169 = "老師也一起去吧。我也想讓您看看。"
211050-170 = "[s] 「好啊。我也很好奇。」"
211050-171 = "那麼，請往這邊……"
211050-176 = ""
211050-177 = "哦！做得還挺不錯的嘛？"
211050-178 = "有靶紙，也有建築物！可以盡情射擊了！"
211050-179 = "現在就可以開打了嗎？嗯？嗯？"
211050-180 = "在那之前，可以讓我看一下學生證嗎？"
211050-181 = "學生證……？"
211050-182 = "有那種東西嗎？你有嗎？"
211050-183 = "沒有。我連它在哪都不知道。一定要有嗎？"
211050-184 = "……"
211050-185 = "雖然早就料到大概沒人會在意，那就請在這裡寫下年級和名字吧。"
211050-186 = "這點我還知道！"
211050-187 = ""
211050-189 = ""
211050-191 = ""
211050-192 = "翔子，為什麼要年級和名字？"
211050-193 = "有這些才能管理點數。雖然具體要怎麼建構還是未知數就是了。"
211050-194 = "而且像這樣做成資料的話，就能知道哪些學生使用過我們的設施、#n什麼時段有多少學生使用等等，管理起來應該會比較容易。"
211050-195 = "等以後組織壯大了，這些也能當作資產來運用。"
211050-196 = "哦！！說的也是，我完全沒想到。"
211050-197 = "果然很細心呢～"
211050-198 = "[s] 「翔子的頭腦真好呢。」"
211050-199 = "畢竟我肩負著格黑娜的未來。"
211050-200 = "名字什麼的都寫好了！那現在可以隨便用了吧？"
211050-201 = "嘿嘿，好興奮！"
211050-202 = ""
211050-204 = ""
211050-205 = "兩個人都是3年級……嗯，很好。"
211050-206 = ""
211050-208 = ""
211050-209 = ""
211050-217 = "哇哈哈！好久沒這麼痛快地開槍了！"
211050-218 = "我也要我也要！要不要也丟丟看手榴彈？#n誰先把那邊的汽油桶炸掉誰就贏！"
211050-219 = ""
211050-220 = ""
211050-224 = "大家都很開心呢！"
211050-225 = "用心布置果然值得。大部分的學生應該都會買單吧。呀哈！"
211050-226 = "射擊、破壞、摧毀的行為……#n在格黑娜，這是能有效燃燒被壓抑本能的紓壓方法。"
211050-227 = "所以，我們今後只要繼續提供能讓這些人傾注本能的場所就行了。"
211050-228 = "[s] 「這樣雖然挺好的……」"
211050-229 = ""
211050-231 = ""
211050-232 = "[ns] 「話說，這個有取得許可吧？」"
211050-233 = ""
211050-234 = "沒有啊？"
211050-235 = "[s] 「沒有嗎！？」"
211050-236 = "我認為先做了再說，事後再收拾會比較容易。"
211050-237 = "[s3] 「雖然跟我的想法很像……！」\n[s4] 「但這種事還是正式處理比較好吧！」"
211050-240 = "沒錯！其實我們找老師幫忙的原因也是這個！"
211050-241 = "雖然氣勢十足地開始了，但現在才去申請許可，總覺得有點心虛！"
211050-242 = "不過就像老師剛才說的……#n要讓風紀委員會和萬魔殿也知道，這裡的活動才不會被制止吧？"
211050-243 = "說不定會被看成是在特定場所鬧事啊！#n只要把這個變成正式活動就沒問題了吧？"
211050-244 = "所以……"
211050-245 = "老師，可以跟我們一起去幫忙說說看嗎？"
211050-246 = "[s] 回答知道了"
211050-247 = "老師，你從剛才就答應得超爽快耶！好像一點也不為難的樣子。"
211050-248 = "[s] 「不，我確實很為難啊！」"
211050-249 = "呀哈！就算這樣還是答應得那麼爽快？"
211050-250 = ""
211050-252 = ""
211050-253 = "因為幫助學生是老師的本分？"
211050-254 = "……"
211050-255 = "哼嗯～我好像明白為什麼大家都依賴老師了。"
211050-256 = "總之，接下來要一起去說服他們了。#n老師，拜託你囉？"
211050-257 = "翔子醬應該已經想好計畫了，不會有問題的啦。呀哈！"
211050-258 = "細節部分就交給我吧。"
211050-259 = "還有請不用太擔心。就算失敗了，也只是老師的名譽掃地而已。"
211050-260 = "[s] 「我的名譽到底算什麼啊……」"
211050-261 = ""
211050-263 = ""
211050-264 = "來，快點快點！動起來吧！"
211050-266 = "下一話;協商"
