[translation]
211050-1 = "ตอนที่ 5;ทำให้เกเฮนน่ายิ่งใหญ่...?"
211050-4 = ""
211050-5 = "[ns] \"แฮ่ก... แฮ่ก... มายูมิ เร็วมากเลยนะ...\""
211050-6 = "อ๊ะ หัวหน้าเริ่มลงมือไปแล้วนี่ นักเรียนมากันเยอะเลย"
211050-9 = "แล้วเกเฮนน่าในตอนนี้ล่ะเป็นยังไง?"
211050-10 = "เรียกได้ว่าเป็นความโกลาหลโดยแท้!"
211050-11 = "ไม่มีศูนย์รวมใจ มีแต่การกระทำที่กระจัดกระจายและสูญเปล่าเท่านั้น!!"
211050-12 = ""
211050-14 = ""
211050-15 = ""
211050-16 = "ก็แบบนั้นแหละที่มันสนุกไง?"
211050-17 = "จะต้องมีศูนย์รวมใจไปทำไมกันล่ะ?"
211050-18 = "ก็เพื่อทำให้เกเฮนน่ายิ่งใหญ่อีกครั้งไง!"
211050-19 = "แล้วทำไมเกเฮนน่าต้องยิ่งใหญ่ขึ้นด้วยล่ะ?"
211050-20 = "เกเฮนน่าเคยยิ่งใหญ่ด้วยเหรอ?"
211050-21 = "แน่นอน! เคยสิ!"
211050-22 = "แล้วก็อย่าคิดว่าคำว่า 'ยิ่งใหญ่' มันใหญ่โตอะไรขนาดนั้น"
211050-23 = "ความยิ่งใหญ่ที่ฉันพูดถึงกันอยู่น่ะ ไม่ใช่สิ่งที่จะหาได้จากประวัติศาสตร์อันซับซ้อน#nหรือศีลธรรมแสนน่าเบื่อหรอก"
211050-24 = "คำว่า 'ยิ่งใหญ่' ก็มีความหมายเดียวกับคำว่า 'แข็งแกร่ง' นั่นแหละ!!"
211050-25 = ""
211050-27 = ""
211050-28 = ""
211050-29 = "พวกเราก็แข็งแกร่งพอแล้วไม่ใช่เหรอ?"
211050-30 = "ใช่ เราก็เป็นหนึ่งในสามสถาบันการศึกษาขนาดใหญ่ของคิโวทอสแล้วนี่"
211050-31 = "คิดว่าแค่นั้นก็พอแล้วจริงๆ เหรอ? ทั้งที่พวกเราเคยแข็งแกร่งที่สุดในคิโวทอสแท้ๆ จะพอใจแค่ทัดเทียมกับโรงเรียนอื่นงั้นเหรอ?"
211050-32 = "มะ... ไม่เคยคิดแบบนั้นมาก่อนเลย..."
211050-33 = "ถ้างั้น เหตุผลที่เกเฮนน่าอ่อนแอลงกว่าเมื่อก่อนคืออะไรกัน?"
211050-34 = "ก็เพราะพวกเรารวมใจเป็นหนึ่งเดียวกันไม่ได้ยังไงล่ะ!"
211050-35 = "ทุกคนอาจจะพอใจกับการก่อเรื่องไปเรื่อยเปื่อยแบบตอนนี้ แต่ลองคิดดูสิ"
211050-36 = "ภาพพวกเราที่รวมเป็นหนึ่งเดียว แล้วกลายเป็นผู้แข็งแกร่งที่สุดในคิโวทอส!"
211050-37 = "งบประมาณมากขึ้น! กระสุนมากขึ้น! แล้วก็ไม่ต้องเกรงใจโรงเรียนไหนทั้งนั้น!"
211050-38 = "อำนาจอันแข็งแกร่งที่ทำให้พวกเราไม่ต้องคอยเกรงใจใครหน้าไหน! การที่พวกเรากลายเป็นผู้ยิ่งใหญ่ ก็คือการช่วงชิงสิ่งเหล่านั้นมาด้วยมือของพวกเราเองยังไงล่ะ!"
211050-39 = ""
211050-42 = "ตอนนี้ก็ไม่ได้เกรงใจใครอยู่แล้วนี่..."
211050-43 = "เอ่อ ฟังดูดีอยู่นะ แต่มันใหญ่โตเกินไปหรือเปล่า?"
211050-44 = ""
211050-46 = ""
211050-47 = "แล้วคิดจะทำให้อะไรยิ่งใหญ่ขึ้นด้วยวิธีไหนกันแน่?"
211050-48 = "ใช่ แค่พูดอย่างเดียว มันไม่สำเร็จหรอกนะ"
211050-49 = "เรื่องนั้นน่ะ..."
211050-50 = ""
211050-52 = ""
211050-53 = ""
211050-54 = "โชโกะ!!"
211050-55 = "[s] \"ยังไม่ได้คิดไว้ก่อนเหรอ!\""
211050-56 = ""
211050-58 = ""
211050-59 = ""
211050-60 = "อย่างที่บอกไปค่ะ หัวหน้าของเราอ่อนเรื่องรายละเอียด ตรงนี้ถึงเวลาที่ฉันต้องออกโรงแล้วค่ะ"
211050-61 = "ฉันคืออิการาชิ โชโกะ เลขาคณะกรรมการฟื้นฟูเกเฮนน่าค่ะ จากนี้ไปฉันจะอธิบายเองค่ะ"
211050-62 = "โอ้ว..."
211050-63 = "ก่อนอื่นเลย ความยิ่งใหญ่ก็เริ่มจากก้าวแรก มาเริ่มจากเรื่องง่ายๆ กันค่ะ"
211050-64 = "ลองยกตัวอย่างง่ายๆ จากเหตุการณ์ที่เกิดขึ้นในเกเฮนน่าตอนนี้กันนะคะ"
211050-65 = ""
211050-67 = ""
211050-68 = "แค่เมื่อเช้าวันนี้ หนึ่งในพวกคุณก็ใช้เครื่องยิงจรวดจนทำให้แป้นบาสฝั่งหนึ่งในสนามเสียหาย#nส่วนช่วงพักกลางวัน ระเบิดเคลย์มอร์ที่ระเบิดขึ้นในอาคารชมรมส่วนกลางก็ทำให้โรงเก็บกระสุนของ#nชมรมปรัชญาเขตแดนประตูโรงเรียนเกิดระเบิดต่อเนื่อง จนห้องชมรมทั้งห้องพังยับเยินค่ะ"
211050-69 = "อ๋อ ใช่ อันนั้นฮาสุดๆ ไปเลย"
211050-70 = "ปกติกรณีแบบนั้น จะเกิดอะไรขึ้นคะ?"
211050-71 = "เอ่อ... คณะกรรมการวินัยออกปฏิบัติการเหรอ?"
211050-72 = "นักเรียนที่ก่อเรื่องจะโดนขังในห้องสำนึกผิดทั้งวันแล้วค่อยปล่อยออกมา"
211050-73 = "ไม่ก็โดนเก็บคะแนนลงโทษ หรือไม่ก็ต้องเขียนเรียงความสำนึกผิด..."
211050-74 = "อึก เอียนทั้งสองอย่างเลย"
211050-75 = "ถูกต้องค่ะ คณะกรรมการวินัยคือกลุ่มที่ลงโทษคนที่ไม่ปฏิบัติตามกฎของโรงเรียน"
211050-76 = "ทั้งการก่อความวุ่นวายในที่สาธารณะ การอาละวาด การกราดยิง การวางระเบิดในโรงเรียน ล้วนเข้าข่ายทั้งหมดค่ะ"
211050-77 = "นั่นมันเรื่องธรรมดาๆ แท้ๆ คณะกรรมการวินัยเข้มงวดเกินต่างหาก"
211050-78 = ""
211050-80 = ""
211050-81 = "แต่ถ้าสมมติว่า คณะกรรมการวินัยไม่มาขัดขวางการกระทำเหล่านั้นล่ะคะ?"
211050-82 = "หา? เป็นไปไม่ได้หรอก"
211050-83 = "ได้ไงกัน?"
211050-84 = "แค่ทำให้การกระทำที่คณะกรรมการวินัยไม่ชอบกลายเป็นเรื่องถูกกฎก็พอค่ะ"
211050-85 = "ขอยกตัวอย่างนะคะ"
211050-86 = "ถ้าความวุ่นวายพวกนั้น ทำได้เฉพาะในสถานที่ที่ได้รับอนุญาตล่ะคะ?"
211050-87 = "หืม? หมายความว่าไงน่ะ?"
211050-88 = "ถ้ามีที่ที่ไปได้เวลาอยากลองกระสุนที่เพิ่งซื้อมา หรือจู่ๆ อยากขว้างระเบิดมือขึ้นมา?"
211050-89 = "สถานที่ที่ทำอะไรได้ตามใจ โดยไม่ต้องเกรงใจคณะกรรมการวินัยน่ะค่ะ"
211050-90 = "โอ้?"
211050-91 = "ก็ดีอยู่หรอกนะ แต่ว่า..."
211050-92 = "เรื่องแบบนั้นน่ะ ต้องทำตอนนึกขึ้นมาได้ถึงจะสะใจนี่นา"
211050-93 = "ใช่ ก็แค่ทำตอนที่อยากทำก็ได้นี่ จำเป็นต้องดั้นด้นไปถึงที่แบบนั้นด้วยเหรอ?"
211050-94 = "นั่นละค่ะคือประเด็น ยอมลำบากเล็กๆ น้อยๆ เพื่อหลีกเลี่ยงความยุ่งยากที่ใหญ่กว่า"
211050-95 = "จะอดทนรอสักครู่ไม่ได้ จนต้องถูกลากไปขังคุกใต้ดินของคณะกรรมการวินัย แล้วนั่งจ้องกำแพงอยู่ทั้งวันจริงๆ เหรอคะ?"
211050-96 = "อึก... แบบนั้นก็ไม่อยากหรอก..."
211050-97 = ""
211050-99 = ""
211050-100 = ""
211050-101 = "ฮุฮุ สมกับเป็นโชโกะจริงๆ ค่อยๆ พูดโน้มน้าวอย่างนุ่มนวลเชียวนะ"
211050-102 = ""
211050-104 = ""
211050-105 = "อ๊ะ ฉันเพิ่งนึกไอเดียดีๆ ขึ้นมาได้!"
211050-106 = "อะไรเหรอ?"
211050-107 = "ถ้ามาใช้พื้นที่ที่พวกเราสร้างไว้ ก็จะสะสม 'ไมล์' ให้ตามจำนวนครั้งและระยะเวลาที่ใช้งาน! เป็นไง?"
211050-108 = "ไมล์...?"
211050-109 = "อื้ม! ร้านอาหารหรือร้านค้าก็มีระบบไมล์ให้สะสมบ่อยๆ ไม่ใช่เหรอ? เราก็ทำแบบนั้นเลยไง!"
211050-110 = "ยิ่งนักเรียนใช้พื้นที่นั้นมากเท่าไร ก็ยิ่งสะสมไมล์ได้มากขึ้น แล้วเอาไมล์นั้นไปซื้อของโน่นนี่ได้ด้วย! แถมยังมีสิทธิพิเศษสารพัดอย่างอีก!"
211050-111 = "เรื่องชักจะใหญ่ขึ้นแล้วสิ พวกเราจะบริหารจัดการไหวมั้ยนะ?"
211050-112 = "..."
211050-113 = "โชโกะ!!"
211050-114 = "[s] \"อีกแล้วเหรอเนี่ย!\""
211050-115 = "จริงด้วย... ถ้าเป็นระบบไมล์ที่ผูกกับนักเรียนเป็นรายบุคคลละก็ นัยแฝงด้านการควบคุมก็จะยิ่งเด่นชัด#nขึ้นค่ะ"
211050-116 = "ทั้งยังต้องใช้ข้อมูลประจำตัว จึงเอื้อต่อการรวบรวมข้อมูลส่วนบุคคลของนักเรียนด้วยค่ะ"
211050-117 = ""
211050-119 = ""
211050-120 = "จะเอาข้อมูลส่วนตัวไปทำไมล่ะ?"
211050-121 = "ฉันว่าระบบไมล์ก็ดูเข้าท่าดีค่ะ น่าจะลองเอาไปพิจารณาดูนะคะ"
211050-122 = "ใช่มั้ยล่ะ? ขนาดฉันยังไปร้านที่ปกติไม่จำเป็นต้องไปเพื่อสะสมไมล์เลย! ต้องได้ผลแน่!"
211050-123 = "ส่วนฉันก็... ถ้าจะทำก็เห็นด้วยนะ ก็ไม่เห็นว่าจะเสียหายตรงไหน"
211050-124 = "ไหนๆ ก็จะทำแล้ว ก็จับมือเป็นพันธมิตรกับร้านค้าต่างๆ เพื่อให้ใช้ไมล์นั้นได้ภายในเขตปกครองตนเอง#nเกเฮนน่ากันเถอะค่ะ"
211050-125 = "ว้าว! ทำแบบนั้นได้ด้วยเหรอ?"
211050-126 = "ลืมไปแล้วเหรอคะว่าคนที่อยู่ตรงนี้คือใคร?"
211050-127 = "อ๊ะ!! จริงด้วย! พวกเรามีคุณครูอยู่นี่!"
211050-128 = "[s] \"หืม? ครูเหรอ?\""
211050-129 = "บอกไว้ว่าจะช่วยไม่ใช่เหรอคะ คุณครู"
211050-130 = "นักเรียนที่ต้องการความช่วยเหลือจากคุณครูอย่างสุดหัวใจอยู่ตรงนี้ค่ะ คงไม่ทำเป็นไม่รู้ไม่ชี้หรอก#nใช่มั้ยคะ?"
211050-131 = "ไม่ใช่เรื่องใหญ่อะไรหรอก คุณครู! ฉันเองก็ไม่ค่อยรู้เรื่องเท่าไร แต่ให้พวกเรายืมชื่อหน่อยได้มั้ย?"
211050-132 = "อย่างช่วยค้ำประกัน หรือมอบหลักประกันให้อะไรแบบนั้น! "
211050-133 = ""
211050-135 = ""
211050-136 = "ไม่ต้องห่วงนะ ครูจะเอาเกียรติเป็นเดิมพันและช่วยอย่างเต็มที่เอง"
211050-137 = "คุณครูคิดแบบนั้นนี่คะ"
211050-138 = "[s1] \"ไม่ได้จะเอาเกียรติเป็นเดิมพันสักหน่อย!\"\n[s2] \"เอาเป็นว่า มาลองดูไปด้วยกันเถอะ\""
211050-141 = "คุณครูนี่พึ่งพาได้จริงๆ นะ~"
211050-142 = ""
211050-144 = ""
211050-145 = ""
211050-146 = "คุณครูของชาเล่ต์ก็มาช่วยด้วยเหรอ?"
211050-147 = "งั้นก็เชื่อถือได้น่ะสิ"
211050-148 = "สรุปก็คือ..."
211050-149 = "ถ้าใช้สถานที่ที่พวกเธอพูดถึง ก็จะไม่ถูกคณะกรรมการวินัยลากตัวไป แถมยังได้สะสมไมล์ด้วยงั้นเหรอ?"
211050-150 = "ใช่เลย! ลดความเสี่ยง เพิ่มผลตอบแทน!!"
211050-151 = "ว่าแต่เข้าไปใช้พื้นที่นั้นตอนนี้เลยได้มั้ย? ฉันคันไม้คันมือมาตั้งแต่เมื่อกี้แล้ว"
211050-152 = "แน่นอน! ในเมื่อพูดถึงแล้วก็ออกเดินทางกันเลย!"
211050-153 = ""
211050-155 = ""
211050-156 = "ว้าว ดีเลย! ตื่นเต้นจัง~!"
211050-157 = ""
211050-159 = ""
211050-160 = "ฉันด้วย! ฉันก็จะไปด้วย!"
211050-161 = ""
211050-163 = ""
211050-165 = ""
211050-166 = ""
211050-167 = ""
211050-168 = "เสียงตอบรับดีกว่าที่คิดนะเนี่ย!"
211050-169 = "คุณครูก็ไปด้วยกันเถอะค่ะ ฉันอยากให้คุณครูดูด้วยเหมือนกัน"
211050-170 = "[s] \"ได้สิ ครูก็สงสัยอยู่พอดี\""
211050-171 = "เอาละ งั้นเชิญทางนี้ค่ะ..."
211050-176 = ""
211050-177 = "โอ้! ทำไว้ดีใช้ได้เลยนี่?"
211050-178 = "มีทั้งเป้ายิง ทั้งอาคาร! แบบนี้ก็ยิงได้เต็มที่เลย!"
211050-179 = "ขอลองใช้งานตอนนี้เลยได้มั้ย? นะ? นะ?"
211050-180 = "ก่อนอื่น ขอดูบัตรนักเรียนหน่อยได้มั้ยคะ?"
211050-181 = "บัตรนักเรียนเหรอ...?"
211050-182 = "มีของแบบนั้นด้วยเหรอ? เธอมีหรือเปล่า?"
211050-183 = "ไม่มีหรอก ไม่รู้ด้วยซ้ำว่าอยู่ไหน จำเป็นต้องมีด้วยเหรอ?"
211050-184 = "..."
211050-185 = "ฉันก็คิดอยู่ว่าคงไม่มีใครใส่ใจเรื่องนี้ ถ้างั้นก็เขียนชั้นปีกับชื่อไว้ตรงนี้นะคะ"
211050-186 = "ข้อมูลแค่นั้นน่ะจำได้อยู่แล้ว!"
211050-187 = ""
211050-189 = ""
211050-191 = ""
