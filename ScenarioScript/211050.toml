[translation]
211050-1 = "第5話;ゲヘナを偉大に……？"
211050-5 = "[ns] \"はぁ、はぁ……マユミ、足速いんだね……。\""
211050-6 = "あ、もう始めてる。生徒も集まってきてるね。"
211050-9 = "――でも、今のゲヘナってどう？"
211050-10 = "まさにカオス！"
211050-11 = "みんなバラバラで好き勝手やってばっかり！！"
211050-16 = "そのほうが楽しくない？"
211050-17 = "なんでダメなの？"
211050-18 = "ゲヘナをもう一度偉大にするためだよ！"
211050-19 = "ならなくてよくない？"
211050-20 = "偉大だったことなんてある？"
211050-21 = "もちろん！ある！"
211050-22 = "「偉大」を大げさに考えないで。"
211050-23 = "私が言いたいのは、難しい歴史の勉強とか退屈な道徳の話じゃない。"
211050-24 = "偉大とは――強いってこと！！"
211050-29 = "もう十分強いよね？"
211050-30 = "キヴォトス三大学園の1つなんだし。"
211050-31 = "三大校なんて、他の学園と並べられてて満足なの？#n昔、ゲヘナはキヴォトスで最強だったんだよ！"
211050-32 = "そこまで考えたことなかったけど……。"
211050-33 = "ゲヘナはどうして弱くなったと思う？"
211050-34 = "それは、私たちが一つにまとまれてないから！"
211050-35 = "……想像してみて。"
211050-36 = "私たちが一つにまとまって、キヴォトス最強になった姿を！"
211050-37 = "もっとたくさんの予算と弾薬！他のどの学園にも気を遣わなくていい！"
211050-38 = "誰の顔色も窺わなくていい圧倒的な力！#n「偉大になる」っていうのは、それを自分たちの手で勝ち取るって意味！"
211050-42 = "別に今でもあんま気にしてなくない？"
211050-43 = "ちょっと大げさだよね。"
211050-47 = "で、どうやって偉大にするの？"
211050-48 = "そうそう。言うだけじゃ変わるわけないし。"
211050-49 = "それは……。"
211050-54 = "ショウコ！！"
211050-55 = "[s] \"ノープラン！\""
211050-60 = "マユミ委員長は細かいことが不得手なので。適材適所です。"
211050-61 = "ゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコです。#nここからの話は私から。"
211050-62 = "おっ……？"
211050-63 = "「偉大さ」だって1歩ずつ。まずは簡単なところから始めましょう。"
211050-64 = "ゲヘナで起きていることを例に挙げます。"
211050-68 = "誰かが撃ったロケットランチャーで、バスケットコートのゴールが破損。#n学園境界哲学部の弾薬庫が爆発し、部室棟が全壊。#nどちらも今日の出来事です。"
211050-69 = "あー、あれね。マジ笑った。"
211050-70 = "通常、そういう場合はどうなりますか？"
211050-71 = "えっと……風紀委員会が来るよね？"
211050-72 = "反省室に閉じ込められて……。"
211050-73 = "減点とか、反省文とか……。"
211050-74 = "うぅ……考えたくもない……。"
211050-75 = "その通り。風紀委員会は、規則違反者を罰する組織です。"
211050-76 = "公共の場の騒乱、暴動、銃撃、爆発物の設置――すべて対象です。"
211050-77 = "いつもいつも、頭カタすぎるんだよ。"
211050-81 = "では……もしも風紀委員会が手を出してこなくなったら？"
211050-82 = "は？"
211050-83 = "そんなのありえないでしょ。"
211050-84 = "規則違反が問題なのであれば、その行為を「合法」にすればいいのです。"
211050-85 = "また例を挙げましょう。"
211050-86 = "「暴れるのを許可された場所」で行うとしたら？"
211050-87 = "どゆこと？"
211050-88 = "弾薬を試したくなったり、手榴弾が投げたくなったりした時に行ける場所があったら？"
211050-89 = "しかもそこは、風紀委員会の目を気にする必要がない。"
211050-90 = "お？"
211050-91 = "悪くなさそうだけど……。"
211050-92 = "そういうのって思いついた時にやるのがいいんじゃん。"
211050-93 = "そうそう。わざわざ行くのはなぁ。"
211050-94 = "そこが核心です。ちょっとした手間で、もっと大きな面倒を避ける。"
211050-95 = "風紀委員会の地下牢で1日中座っていたいですか？"
211050-96 = "それは嫌だけど……。"
211050-101 = "さっすがショウコ！こういうのホント上手だよね。"
211050-105 = "ひらめいた！"
211050-106 = "なに？"
211050-107 = "場所を使ってくれたら、回数と時間に応じてポイントが貯まるようにするの！どう？"
211050-108 = "ポイント……？"
211050-109 = "食堂とかお店で貯められるやつあるでしょ？あれと同じ！"
211050-110 = "使えば使うほど貯まって、色んな物に交換できたり、なんか特典が付いたり！"
211050-111 = "……それ、うちらで管理できる？"
211050-112 = "……。"
211050-113 = "ショウコ！！"
211050-114 = "[s] \"ノープラン！\""
211050-115 = "ポイントを各生徒に紐づけるなら、個人情報が必要になる……#nつまり、体よく収集できて都合がいい……。"
211050-116 = "統制としての意味合いも強くなりますね。"
211050-120 = "個人情報なんて何に使うの？"
211050-121 = "……制度は悪くありません。一考の価値はあるでしょう。"
211050-122 = "私もポイント欲しさにお店行ったりするし！絶対効果あるって！"
211050-123 = "まあ、やるならいいんじゃない？損するような話でもないし。"
211050-124 = "せっかくなら自治区内のお店と提携して、ポイントを使えるようにしましょう。"
211050-125 = "そんなことまでできるの！？"
211050-126 = "ここにいらっしゃる方をお忘れですか？"
211050-127 = "そっか！先生がいるじゃん！"
211050-128 = "[s] \"え、私？\""
211050-129 = "手伝ってくださるんですよね？"
211050-130 = "先生の助けを欲している生徒がここにいます。#n見て見ぬふりをなさるおつもりですか？"
211050-131 = "だいじょぶだいじょぶ！よく分かんないけど……名義を貸してもらったり？"
211050-132 = "保証人になってもらうとか、担保出してもらうとか！"
211050-136 = "心配するな。私の名誉にかけて最善を尽くそう。"
211050-137 = "――と、先生は考えました。"
211050-138 = "[s1] \"名誉をかけた覚えはないんだけど！\"\n[s2] \"でも、一緒にやってみよっか。\""
211050-141 = "やっぱ頼りになる～"
211050-146 = "シャーレの先生も手伝ってるの？"
211050-147 = "じゃあ信じていいってことだよね。"
211050-148 = "んー、つまり……？"
211050-149 = "暴れ放題で、風紀委員会が来なくて、ポイントも貯まるってこと？"
211050-150 = "その通り！リスクを減らして、リターンは増やす！！"
211050-151 = "面白そうだね。#nそこって今からでも使えるの？"
211050-152 = "もちろん！気になる人はついて来て！"
211050-156 = "最高じゃん！テンション上がってきた～！"
211050-160 = "ま、行くだけ行ってみよっかな！"
211050-168 = "思ったより反応いいね！"
211050-169 = "先生もご一緒にどうですか？現場をお見せしたいですし。"
211050-170 = "[s] \"私も気になってたんだ。\""
211050-171 = "では、こちらへ……。"
211050-177 = "へー、思ったよりちゃんとしてるじゃん？"
211050-178 = "標的も建物もある！狙いがいあるね。"
211050-179 = "ね、ね、撃っていい？もう撃っていい？"
211050-180 = "その前に、学生証を見せてもらえますか？"
211050-181 = "なんで……？"
211050-182 = "ってか、そんなのあったっけ。#n持ってる？"
211050-183 = "え、分かんない。無いとダメ？"
211050-184 = "……。"
211050-185 = "想定内ではありますが……では、こちらに学年と名前を書いてください。"
211050-186 = "おっけー！"
211050-192 = "そんなの聞いて何に使うの？"
211050-193 = "ポイント管理のためです。どう構築するかは未定ですが。"
211050-194 = "それにデータ化しておけば、どの生徒が施設を利用したか、どの時間帯にどれだけ利用されたかも管理しやすくなります。"
211050-195 = "将来的に組織が大きくなったときにも、そのまま資産として活かせるでしょう。"
211050-196 = "たしかに！全然そこまで考えてなかった……。"
211050-197 = "やっぱ抜け目ないね～"
211050-198 = "[s] \"ショウコは賢いね。\""
211050-199 = "ゲヘナの未来を背負っていますから。"
211050-200 = "はい、書いたよ！もういいよね？"
211050-201 = "楽しみ～！"
211050-205 = "2人とも3年生で、お名前は……はい、問題ありません。"
211050-217 = "あははっ！こんなに撃つの久しぶり！"
211050-218 = "ね！手榴弾も投げてみようよ！あのドラム缶、先に爆破した方が勝ちね！"
211050-224 = "みんな喜んでる！"
211050-225 = "作り込んだ甲斐があったね。刺さる生徒は多いんじゃない？"
211050-226 = "撃つ、壊す、破壊する。#n抑圧された本能を解放するストレス発散法ですから。"
211050-227 = "需要と供給を正しくおさえれば良いわけです。"
211050-228 = "[s] \"全部いい感じなんだけどさ……。\""
211050-232 = "[ns] \"これ、許可取ってるよね？\""
211050-234 = "いや？"
211050-235 = "[s] \"取ってないの！？\""
211050-236 = "既成事実にしてしまうのが楽だと思いました。"
211050-237 = "[s3] \"私もよくやるけど……！\"\n[s4] \"でもこういうのは手順を踏んだほうが……。\""
211050-240 = "だから先生が必要なんだよ！"
211050-241 = "いざ始めたはいいけど、今さら許可取りに行くの、ちょっと気まずくて。"
211050-242 = "でも、集まって暴れてる問題児だと思われたらマズいでしょ？#nここの活動を止められたら意味ないし……。"
211050-243 = "だったら、正式な活動にしちゃえば問題なし！"
211050-244 = "だから、その……。"
211050-245 = "先生もついてきて……！"
211050-246 = "[s] \"いいよ。\""
211050-247 = "……毎回即答だけど、後で困らない？"
211050-248 = "[s] \"え、背中の冷や汗すっごいよ。\""
211050-249 = "やはっ！それでも即答しちゃうんだ。"
211050-253 = "生徒を助けるのが先生の本分だから？"
211050-254 = "……。"
211050-255 = "ふ～ん、みんなが頼るわけだねぇ。"
211050-256 = "説得がんばろー！"
211050-257 = "ショウコちゃんが立ててくれる計画、頼りにしてるよ。"
211050-258 = "細かい段取りはお任せください。"
211050-259 = "たとえ失敗しても、傷つくのは先生の名誉だけですし。"
211050-260 = "[s] \"私の名誉って何なんだろうね……。\""
211050-264 = "ほら、ハリーハリー！レッツゴー！"
211050-266 = "次回;交渉"
