211050-61 = "Hello all, I am Igarashi Shouko, Secretary of the Gehenna Heritage League. I'll take it from here."
211050-62 = "Oh...?"
211050-63 = "Every glorious journey begins with a single step. So, let's start small."
211050-64 = "You desire relevance and realism. Let's discuss today."
211050-65 = ""
211050-67 = ""
211050-68 = "This morning, a rocket launcher destroyed a basketball hoop. By lunch, a rogue claymore detonated, triggering a chain explosion when it hit the Philosophy Club's ammunition storage. They're still discussing what it all means."
211050-69 = "Ah, right. That was hilarious."
211050-70 = "What, or WHO, usually follows in these situations?"
211050-71 = "Uhm... The Prefect Team comes out?"
211050-72 = "And the responsible student gets locked up to \"self-reflect\" for the rest of the day."
211050-73 = "Then there's demerits, apology letters..."
211050-74 = "Ugh. They're both such a pain."
211050-75 = "That's right. The Prefect Team is responsible for punishing those who don't abide by the school rules."
211050-76 = "Verboten activities include disturbances, violence, shootings, and the planting of explosives on public-facing school grounds."
211050-77 = "Those are just part of life, you know. The Prefect Team is way too strict."
211050-78 = ""
