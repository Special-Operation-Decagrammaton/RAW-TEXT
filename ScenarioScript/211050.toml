211050-31 = "We used to be number ONE in Kivotos. No one else could be on the podium, and no one else could compete!"
211050-32 = "I-I never thought about that..."
211050-33 = "So, my friends, my sisters, WHY did our Gehenna grow weak?"
211050-34 = "It's because we failed to unite! As one! One Gehenna! One flag! Gehenna first!"
