[translation]
84312100100-5 = "……그동안 고생 많았어, 유리조노 세이아."
84312100100-6 = "덕분에 밀레니엄 엑스포도 큰 탈 없이 끝날 수 있었어. 너와 네루의 공이 커."
84312100100-7 = "아…… 그러고 보니 오늘이 마지막 날이네요. 더 이상 밤중에 잠입하거나 하는 일은 없겠군요."
84312100100-8 = "……뭐랄까, 역시……"
84312100100-9 = "조금 섭섭하기도 하네요."
84312100100-13 = "앙? 뭔 소리야? 언제라도 자다 깰 수 있는 이런 일, 빨리 끝나 버리는 게 속 편하지."
84312100100-14 = "아무튼 그럼 이제 돌아가는 건가? 우리가 이야기하는 것도 지금이 끝이네?"
84312100100-15 = "그렇다고 할 수 있지. 더 이상 일어날 일은 없고, 나도 이제는 돌아가야 하니까."
84312100100-16 = "지금 바로요……? 아직 엑스포가 완전히 끝나지는 않았는데?"
84312100100-17 = "실질적으로는 끝난 것이나 다름없으니까. 오늘 행사가 끝나면 곧바로 폐장이고, 트리니티 학생들도 돌아가지."
84312100100-18 = "누군가 일을 꾸미고 있었다면 어제까지였지만…… 시연장과 캠퍼스 내에는 더 이상 아무것도 없다는 걸 확인했거든."
84312100100-19 = "(확인했다……? 없다고 판단했다……가 아니라?)"
84312100100-20 = "그리고 무엇보다 두 사람이……"
84312100100-25 = "두 사람이 지금까지 그렇게나 노력했으니까. 더 이상 시연장 안에 수상한 움직임은 없다고 판단했어."
84312100100-27 = "리오……"
84312100100-29 = "웬일이냐? 너답지 않게 그렇게 예쁜 말도 다 하고. 우리 애 다 컸네?"
84312100100-30 = "……? 갑자기 무슨 이야기지? 너와 나는 같은 나이야, 네루."
84312100100-34 = "아~ 아직 덜 컸네~."
84312100100-35 = "아무튼 그럼 나도 슬슬 돌아가 볼까. 선생한테도 어떻게 잘 끝났다고 보고해야 하고."
84312100100-36 = "이후로도 계속 선생에게 상황을 공유하고 있던 거야?"
84312100100-37 = "……? 당연하지. 왜, 문제 있냐?"
84312100100-38 = "아니, 없어."
84312100100-39 = "네가 학교 챙기러 온 건 좋은 일이지만, 그래도 선생은 선생이야. 학생들 사이에서 이런저런 일이 벌어지는데, 누군가는 말해 줘야지."
84312100100-40 = "말한다고 뭐 사사건건 간섭하거나 귀찮게 구는 것도 아니잖아?"
84312100100-41 = "당장 세이아도 선생이 눈감아 주고 있으니 우리랑 이 짓 하고 있는 거고."
84312100100-43 = "하긴 그랬었죠. 그러면 선생님은 지금의 상황도 다 알고 계시겠군요."
84312100100-44 = "……돌아가기 전에 따로 말씀도 좀 드려야겠네요, 이것저것."
84312100100-45 = "짐을 정리하는 데에는 조금 시간이 걸릴 거야. 무슨 일이 있진 않겠지만…… 그 사이에라도 무슨 일이 생기면 연락해 줘."
84312100100-46 = "그리고 이건 내 개인적인 부탁이지만, 선생에게 나에 대해서 너무 자세한 이야기는……"
84312100100-47 = "그 부분이라면 괜찮아요. 선생님 또한, 리오와의 이야기는 직접 나중에 할 기회가 있을 거라 하셨으니까요."
84312100100-48 = "오히려 신경 쓰이는 쪽이라면…… 음……"
84312100100-49 = "……? 신경 쓰이는 쪽?"
84312100100-54 = "뭐야, 뭐가 또 있는 거야?"
84312100100-55 = "아뇨. 아직 확실히 말씀드릴 수는 없어요. 그냥 기우일 수도 있고요."
84312100100-56 = "……어차피 다른 분들께 인사도 드려야 하니, 캠퍼스를 한 번 돌아보고 올게요."
84312100100-57 = "혹시라도 좋으니…… 그때까지만이라도 기다려 줄 수 있을까요, 리오?"
84312100100-61 = "……? 괜찮지만……"
84312100100-62 = "후후, 그러면 다녀오겠습니다."
84312100100-63 = "따라가 줄까?"
84312100100-64 = "아니요, 괜찮아요. 리오가 말했던 대로 수상한 부분들은 모두 체크했고……"
84312100100-65 = "괜찮을 거 같아요. 아마도."
