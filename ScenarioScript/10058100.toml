[translation]
10058100-1 = "제10화;183호, 해체합니다!"
10058100-2 = "콜록, 콜록!"
10058100-3 = "화산재, 더 짙어졌네……."
10058100-4 = "지붕은 없지만, 그래도 안에 웅크려 있기라도 하자."
10058100-5 = "콜록, 이러면 조금이라도 잘 보일 줄 알았는데……."
10058100-6 = "괜찮아?"
10058100-7 = "콜록, 콜록! 괜찮아. 라나는 괜찮니?"
10058100-8 = "……라나?"
10058100-9 = "훌쩍……."
10058100-10 = "라나?! 무슨 일이야? 많이 아프니?"
10058100-11 = "그게 아니야."
10058100-12 = "우승하는 생각을 했어."
10058100-13 = "벌써 신난 거야? 아하하!"
10058100-14 = "그게 아니야."
10058100-15 = "우승하면 이제 안나하고 에리나하고 헤어지잖아."
10058100-16 = "친구랑 헤어지는 건 싫어."
10058100-17 = "엥?"
10058100-18 = "설마, 우승해서 우리가 사면받으면, 못 만날 거라고 생각해서야?"
10058100-19 = "에리나하고 안나, 183호가 해체되는 걸 바라잖아."
10058100-20 = "아이쿠, 우리 라나! 이렇게 귀여운 구석이 있었네!"
10058100-21 = "라나, 183호가 특별반에서 해제되어도 우리는 계속 친구야!"
10058100-22 = "물론이지! 쟤하고 절교해도 라나하고는 친구 할 거니까!"
10058100-23 = "내가 할 소리거든?!"
10058100-24 = "그럼 계속 친구, 인 거지?"
10058100-25 = "그럼! 183호 특별반은 해체하고, 183호 연구소로 만들어달라고 하자구!"
10058100-26 = "그러면 특별반하고 똑같잖아, 바보냐 진짜!"
10058100-29 = "슬슬 이쯤에서 마주칠 것 같-"
10058100-33 = "……은데……."
10058100-34 = "어, 어라……?"
10058100-35 = "원래 여기에 이만한 환기구가 있었던가……?"
10058100-36 = "만들 때는 몰랐는…… 데……? 하, 하하……."
10058100-39 = "맞았다!!!!"
10058100-40 = "라나!! 전속력 우회전!! 피해!!!!"
10058100-45 = "장전 완료!"
10058100-46 = "호오, 전차 철판이 너무 얇군요."
10058100-47 = "역시 철갑유탄은 피해 없이 그냥 뚫고 지나가 버리네요. 차체를 노려야겠어요."
10058100-48 = "포수. 다음에는 조준점 삼각형의 위 꼭짓점으로 겨냥해요. 삼각형 가운데에 넣지 말고요."
10058100-49 = "알겠습니다!"
10058100-50 = "조종수. 기어 4단으로 변속. 1시 방향으로 계속 전진. 액셀 페달 최대로."
10058100-51 = "네, 넵!"
10058100-52 = "조잡한 설계라 생각했는데, 오히려 저런 식으로 허를 찌르는군요."
10058100-53 = "적이 보이는 대로 묻지 말고 사격해도 좋아요."
10058100-54 = "알아서 중지시킬 테니까요. 자, 조준 좋으면 쏴."
10058100-55 = "네, 포미 확보!! 조준 좋으면 쏴!"
10058100-56 = "쏩니다!!"
10058100-63 = "바로 옆에 떨어졌어!!!"
10058100-64 = "라, 라나아!! 조금만 더 천천히!! 멀미할 것 같아, 으에엑!!!"
10058100-65 = "포탄을 운전 실력으로 피하는 건 대단하긴 한데!! 우, 우웁……."
10058100-66 = "두 번 다시 백미러에 비치지 않게 해주지."
10058100-67 = "그냥 도망간다는 소리 아니야?!"
10058100-68 = "일단 숨어!! 포탑이 없으니까 후퇴하면서 공격할 수는 없다고!!"
10058100-69 = "앞의 화산재 구름 쪽으로 가자!!!"
10058100-71 = "칫……!"
10058100-72 = "차장님, 화산재 구름이 몰려와서 놓쳤습니다!"
10058100-73 = "시야가 100미터도 안 나오는군요."
10058100-74 = "포수, 32도. 화산재가 느리게 흐르는 부분에 준비되는 대로 사격."
10058100-75 = "쏩니다!"
10058100-79 = "히이익!! 또 맞을 뻔했어!"
10058100-80 = "정신 차려!! 포탄이 지나가면서 화산재를 흩어놨잖아."
10058100-81 = "지금이 기회야, 적이 보인다고!!"
10058100-82 = "라나, 정지! 에리나, 적 12시. 철갑탄!"
10058100-83 = "장전 끝! 쏴!!!"
10058100-89 = "맞았어! 제대로 맞았어!!"
10058100-90 = "확실히 정가운데에 맞았다!! 좋았어!!!"
10058100-91 = "……."
10058100-92 = "꽉 잡아!!!"
10058100-95 = "뭐?!"
10058100-99 = "맞을 뻔했다……."
10058100-100 = "뭐야?! 왜 멀쩡한 건데?!!"
10058100-101 = "이게 뭐야아아아!!! 반칙 아니야?!"
10058100-103 = "쳇, 쪼그만 게 빠르기는……."
10058100-104 = "피해 상황 보고하세요."
10058100-105 = "차체 전면에 맞았습니다만, 관통되지 않았습니다. 탄종은 철갑탄 같습니다."
10058100-106 = "토라마루의 가장 단단한 부분을 때려봤자죠."
10058100-107 = "포수, 보고하세요."
10058100-108 = "놓쳤습니다, 다시 화산재 속으로 사라졌어요."
10058100-109 = "음."
10058100-110 = "차량 정지. 기어 중립. 최저 회전수. 현 위치 대기."
10058100-111 = "상대방의 소리를 듣고 찾아보죠."
10058100-113 = "맞서 싸워달라구요. 도망치지 말고."
10058100-114 = "소원대로, 확실하게 상대해 드릴 테니까요."
10058100-116 = "콜록, 콜록……."
10058100-117 = "에리나, 괜찮아?"
10058100-118 = "괜찮아, 콜록. 괜찮으니까……."
10058100-119 = "라나, 엔진은 어때?"
10058100-120 = "필터에 화산재가 껴서 시동 꺼졌어."
10058100-121 = "일단 필터 털고, 흡기구에 안나 스타킹을 씌웠으니까 당분간은 견딜 거야."
10058100-122 = "히잉, 좋은 일 있을 때만 신던 스타킹인데. 아까운 건 어쩔 수 없네."
10058100-123 = "콜록, 괜찮아. 넌 스타킹 신어도 다리 굵어 보이거든."
10058100-124 = "귀찮은데 그냥 다리에 페인트칠하고 다녀도 될걸? 콜록, 하하하……."
10058100-125 = "……아직 입은 살았구나?"
10058100-126 = "(화산재가 너무 심해서 이 이상으로 길게 시간을 끌 수는 없어.)"
10058100-127 = "더워……."
10058100-128 = "(얘들도, 강아지호도 이제 한계니까…….)"
10058100-130 = "그만, 하자."
10058100-131 = "이 이상 해봤자, 위험하기만 할 거야."
10058100-133 = "(포기, 하고 싶지 않은데…….)"
10058100-134 = "이제 포탄도 한 발 남았어. 고속철갑탄인 건 다행이지만……."
10058100-135 = "토라마루를 앞에서 뚫는 건 무리야. 그렇다고 절대 옆이나 뒤를 보여주진 않아."
10058100-136 = "괜히 1등이 아닌가 봐. 포탑이 있는데도 우리처럼 계속 정측면만 보여주려고 하고 있어."
10058100-137 = "우리가 안 보일 텐데, 꼭 보이는 것 같이 쏘고 있어."
10058100-138 = "화산재, 꼭 눈보라 같네. 엄청나게 더운 것만 빼면 말야. 콜록, 콜록!"
10058100-139 = "……."
10058100-141 = "콜록, 콜록!"
10058100-143 = "콜록……."
10058100-146 = "!!"
10058100-147 = "소리……."
10058100-148 = "……이거면, 될지도."
10058100-149 = "안나?"
10058100-150 = "가설, 검증해 보자!"
10058100-151 = "한 방, 먹여보자구!!"
10058100-156 = "소리, 멈췄군요. 도망친 걸까요."
10058100-157 = "천천히 이탈해 보죠. 기어 2단. 저 rpm으로 조용하게……."
10058100-158 = "응?"
10058100-164 = "저건……."
10058100-167 = "이런, 사격 중지를 잊었어……!"
10058100-168 = "함정이에요!!! 사격 금-"
10058100-169 = "사격!"
