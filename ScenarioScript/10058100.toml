[translation]
10058100-1 = "第10話;183号、解散します！"
10058100-2 = "ゴホッ、ゴホッ！"
10058100-3 = "火山灰、さらにひどくなってきたわね……。"
10058100-4 = "中で小さく丸まっておきましょうか。"
10058100-5 = "ゴホッ、これなら少しはちゃんと見えると思ったんだけどなぁ……。"
10058100-6 = "大丈夫？"
10058100-7 = "ゴホッ、ゴホッ！大丈夫。ラナは？"
10058100-8 = "……ラナ？"
10058100-9 = "ふと……。"
10058100-10 = "ラナ！？どうしたの？どこか痛い？"
10058100-11 = "そうじゃない。"
10058100-12 = "優勝することを考えてた。"
10058100-13 = "今からウキウキしちゃってんの？あはは！"
10058100-14 = "そうじゃない。"
10058100-15 = "優勝したら、アンナとエリナとはお別れになる。"
10058100-16 = "友達とお別れするのは嫌。"
10058100-17 = "えっ？"
10058100-18 = "優勝して恩赦をもらったら、もう会えないと思ってたの？"
10058100-19 = "エリナとアンナは、183号の解散を望んでいるでしょ？"
10058100-20 = "もぉ、ラナってば！めっちゃ可愛い～！"
10058100-21 = "ラナ。183号が特別クラスから解放されても、私たちはずっと友達よ！"
10058100-22 = "もっちろん！アンナと絶交してもラナとは友達だから！"
10058100-23 = "こっちのセリフなんだけど！？"
10058100-24 = "それじゃ、ずっと友達なんだね？"
10058100-25 = "そうよ！183号特別クラスは解散して、#n「183号研究所」を作ってほしいって言いましょう！"
10058100-26 = "それじゃ特別クラスと同じでしょ～！もぉ！"
10058100-29 = "……そろそろこの辺で会いそうな気が――"
10058100-33 = "――したんだけど……。"
10058100-34 = "あ、あれ……？"
10058100-35 = "こんな換気口あったっけ……？"
10058100-36 = "作ってるときは気付かなかった……なぁ……。は、はは……。"
10058100-39 = "しまった！！！"
10058100-40 = "ラナ！！右に急旋回！！早く！！"
10058100-45 = "装填完了！"
10058100-46 = "なるほど、思っていたよりも装甲が薄いですね。"
10058100-47 = "APHE弾では、貫通してしまい致命的なダメージにはなりません。#nやはり車体を狙わなくては。"
10058100-48 = "砲手。次は照準器の三角形の頂点に狙いを定めてください。#n真ん中ではありません。"
10058100-49 = "了解です！"
10058100-50 = "操縦手。ギアを4速にして、1時方向へ前進。アクセル全開。"
10058100-51 = "は、はいっ！"
10058100-52 = "雑な設計かと思いましたが、意表を突かれましたね。"
10058100-53 = "敵が見えたら、合図を待たず撃って構いません。"
10058100-54 = "中止の時はすぐに言いますので。"
10058100-55 = "はい！砲尾確保！狙いを定めて、よし！"
10058100-56 = "撃ちます！！"
10058100-63 = "すぐ横に落ちたわ！！"
10058100-64 = "ら、ラナぁ！！もうちょっとゆっくり運転して！！吐きそう、うえぇっ！！"
10058100-65 = "砲弾をかわすなんてすごいけど！！う、うぅっ……！！"
10058100-66 = "二度とバックミラーに映らないようにしてやる。"
10058100-67 = "それって、ただ逃げるってこと！？"
10058100-68 = "とにかく隠れて！！砲塔がないから、後退しながら攻撃はできないんだよ！"
10058100-69 = "そうだ！前の火山灰雲に突っ込もう！"
10058100-71 = "ちっ……！"
10058100-72 = "戦車長！敵戦車、火山灰雲に遮られ見失いました！"
10058100-73 = "これでは、100メートル先も見えませんね……。"
10058100-74 = "砲手。32度、火山灰がゆっくり流れている方向へ……発射。"
10058100-75 = "撃ちます！"
10058100-79 = "ひぃっ！！また当たりそうになった！！"
10058100-80 = "しっかりして！！今の砲弾が火山灰を吹き飛ばしたよ！"
10058100-81 = "敵が見えるチャンス！"
10058100-82 = "ラナ、停止！エリナ！敵12時の方向、AP弾！"
10058100-83 = "装填完了！発射っ！！"
10058100-89 = "やった！！当たった！！"
10058100-90 = "いえ～いっ！ど真ん中～っ！"
10058100-91 = "……。"
10058100-92 = "しっかり掴まって！！"
10058100-95 = "え！？"
10058100-99 = "ひいぃ……当たるかと思ったぁ……。"
10058100-100 = "どういうこと！？向こうの戦車、何ともないみたいだけど！？"
10058100-101 = "あんなのあり！？反則でしょ！？"
10058100-103 = "ちっ、すばしっこいな……。"
10058100-104 = "被害状況を報告してください。"
10058100-105 = "車体前面に弾が当たりましたが、貫通はしていません。弾は恐らくAP弾かと。"
10058100-106 = "前面は虎丸の一番装甲が固い部分。痛くもかゆくもありません。"
10058100-107 = "砲手、報告してください。"
10058100-108 = "すみません。また火山灰の中に逃げられて見失いました。"
10058100-109 = "ふむ。"
10058100-110 = "車両停止。ギアをニュートラルにして、現在の位置で待機。"
10058100-111 = "向こうの音を聞いて探しましょう。"
10058100-113 = "逃げてないで、真っ向勝負しにきてください。"
10058100-114 = "お望みどおり、ちゃんと相手になってあげますから。"
10058100-116 = "ゴホッ、ゴホッ……。"
10058100-117 = "エリナ、大丈夫？"
10058100-118 = "うん、ゴホッ。大丈夫だから……。"
10058100-119 = "ラナ、エンジンはどう？"
10058100-120 = "フィルターに火山灰が詰まって止まった。"
10058100-121 = "フィルターを外して、代わりにアンナのストッキングを張っておいたから……#n当分は持つと思う。"
10058100-122 = "ひぃん……良いことがあるたびに履いていたのに……まあ、仕方ないか。"
10058100-123 = "ゴホッ、大丈夫だよ。どうせアンナはストッキングを履いても脚太いから。"
10058100-124 = "いっそ、足にペンキでも塗っとくほうがいいかも？ゴホッ、ははは……。"
10058100-125 = "……そんなこと言う元気があるなら、まだ大丈夫そうね。"
10058100-126 = "（火山灰がひどすぎる。これ以上の時間稼ぎは無理か……）"
10058100-127 = "暑い……。"
10058100-128 = "（みんなも、子犬号も……もう限界ね……）"
10058100-130 = "もう、やめよう。"
10058100-131 = "これ以上は危ないだけだよ。"
10058100-133 = "（諦めたく、ない……）"
10058100-134 = "砲弾もあと、高速徹甲弾が一発……。"
10058100-135 = "正面からの突破は無理。でも側面や後面を取らせてくれる相手じゃない。"
10058100-136 = "伊達に絶対王者と呼ばれてないわね。#nあっちには砲塔があるのに、必ず正面から向かってきているし。"
10058100-137 = "私たちのことは見えていないはずなのに、見えているかのように撃ってくる。"
10058100-138 = "火山灰が舞ってて吹雪みたいだね。#nものすご～くあついことを除いたら……ゴホッ、ゴホッ！"
10058100-139 = "……。"
10058100-141 = "ゴホッ、ゴホッ！"
10058100-143 = "ゴホッ……。"
10058100-146 = "！！"
10058100-147 = "音……。"
10058100-148 = "……これなら、いけるかも。"
10058100-149 = "アンナ？"
10058100-150 = "仮説は検証しないと！"
10058100-151 = "一泡、吹かせてやりましょう！！"
10058100-156 = "音が聞こえなくなりましたね。逃げたのでしょうか。"
10058100-157 = "ゆっくり離れましょう。ギアを2速にして、静かに……。"
10058100-158 = "あ――"
10058100-164 = "あれは……。"
10058100-167 = "射撃中止を言い忘れてました……！"
10058100-168 = "罠です！！！射撃中――"
10058100-169 = "撃ちます！"
