[translation]
2001905-1 = "Case 3. 공부할 시간이군요?"
2001905-3 = "(업무의 산에서 스스로를 해방시키기 위해, 시내를 걷고 있었다.)"
2001905-4 = "(그 순간.)"
2001905-8 = "안녕하세요, 주인님!"
2001905-12 = "[ns] \"아, 아카네?!\""
2001905-13 = "네! 주인님의 아카네에요."
2001905-14 = "주인님과 우연히 만나기 위해, 이 자리에서 쭉 기다리고 있었답니다."
2001905-15 = "[s] \"이 자리에서…… 우연히?\""
2001905-16 = "네. 우연히."
2001905-17 = "보통 그런 걸 우연이라고 말하지는 않는다구요?"
2001905-18 = "글쎄요? 전 우연이라고 생각하는데요?"
2001905-19 = "주인님이 이 거리를 지나갈 걸 어떻게 알고 있었냐구요?"
2001905-20 = "그 정도야 밀레니엄의……"
2001905-21 = "아뇨, 운명입니다."
2001905-22 = "아, 주인님의 보안 수준은 샬레에서 일단 책임지고 있다고요?"
2001905-23 = "그래서 베리타스에게 부탁해 위성 영상을 종합해서……"
2001905-27 = "아뇨. 멋진 우연도 있구나 싶어서요."
2001905-33 = "이렇게 만나 뵐 수 있게 된 것도 정말 기적이네요."
2001905-34 = "오늘은 어떻게 봉사해 드릴까요, 주인님?"
2001905-35 = "[s] \"설마 여기까지 바니걸 복장으로 온 거야?!\""
2001905-36 = "뭔가 잘못됐나요?"
2001905-37 = "바니걸이라고 해도, 봉사를 위한 복장일 뿐인데요."
2001905-42 = "(주위의 시선이 몹시 따갑다.)"
2001905-50 = "(황급히 아카네의 손을 끌고 카페로 피신했다.)"
2001905-57 = "와……"
2001905-58 = "[s] \"맙소사, 여긴……?\""
2001905-59 = "바니걸 카페군요! 이런 컨셉의 카페가 있다니!"
2001905-60 = "아아, 그렇군요. 주인님의 깊으신 뜻도 모르고 전……"
2001905-61 = "오해라고요? 그렇게 겸손하지 않으셔도 돼요."
2001905-62 = "후훗…… 그렇게 쑥스러워하실 필요 없어요."
2001905-63 = "저는 주인님이 누구보다 자상하신 분이라는 걸 잘 알고 있으니까요."
2001905-67 = "주문하시겠습니까? 주인님, 아가씨."
2001905-68 = "어라…… 여기에서는 저도 아가씨가 되는군요."
2001905-69 = "재미있네요. 저는 이미 모시는 주인님이 있는 몸인데."
2001905-70 = "가게에 있는 동안뿐이라고는 하지만, 저에게는 소중한 주인님이...."
2001905-74 = "주인님, 왜 그러세요?"
2001905-75 = "피곤하신 거 같으니 제가 대신 주문할게요."
2001905-76 = "우선은……"
2001905-81 = "과연. 바니걸이란 저렇게 행동하는군요."
2001905-85 = "서있을 때 바른 자세를 유지하면서, 접시의 소리를 내지 않도록 하고……"
2001905-86 = "흠, 흠."
2001905-90 = "과연, 바니걸이란 그저 입고 있는 것이 전부가 아니라."
2001905-91 = "동작과 주위 환경, 봉사, 모든 것이 조화롭게 녹아 들어야,"
2001905-92 = "비로소 바니걸이라고 할 수 있는 거군요!"
2001905-96 = "오늘은 많은 참고가 되었어요."
2001905-97 = "감사합니다. 주인님."
2001905-98 = "주인님이 이런 분야에도 조예가 깊을 줄은 미처 몰랐어요."
2001905-99 = "저도 보다 완벽한 봉사를 향해, 정진하겠습니다."
2001905-105 = "역시 주인님은 대단한 분이세요!"
2001905-106 = "[s1] \"아하하하……\"\n[s2] \"완전한 오해이십니다, 아카네 양……\""
2001905-110 = "(아카네는 끝까지 오해(?)를 풀어주지 않았다…….)"
