[translation]
2003805-1 = "간판 소녀"
2003805-2 = "맛있는 식당을 소개해 주시는 것으로도 모자라, 사 주시기까지 한다니……."
2003805-3 = "이렇게 선생님께 대접받기만 하면, 나중에 빚이 너무 많이 쌓이는 것 아닐까요?"
2003805-4 = "[s1] \"그걸 빚이라고 생각해 버리면 내가 오히려 부담스러워.\"\n[s2] \"아직은 산해경에 대해서는 토모에보단 내가 잘 아니까!\""
2003805-7 = "그렇군요?"
2003805-8 = "그렇다면 여기에서는, 솔직하게 선생님의 호의를 받아들이도록 하죠. 감사합니다. 선생님."
2003805-9 = "실례합니다. 메뉴판 좀 주시겠어요?"
2003805-14 = "네……. 감사합니다. 여기 있습니다."
2003805-15 = "……?"
2003805-19 = "(사장님의 기색이…… 어딘가 심상치 않네요?)"
2003805-20 = "(목소리에 기운이 없고, 얼굴이 어딘가 어두워 보여요.)"
2003805-21 = "(그러고 보니, 점심시간인데도 식당 안에 묘하게 사람이 없기도 하고……?)"
2003805-25 = "[ns] \"토모에는 뭐로 할래?\""
2003805-29 = "아, 네. 그러면 저는요……."
2003805-34 = "[ns] \"우아. 배부르다.\""
2003805-35 = "정말 맛있게 드시던데요, 선생님?"
2003805-36 = "그러는 저도 말수가 줄어들지 않았냐고요?"
2003805-37 = "우후후. 그만큼 맛있는 식사였다는 뜻도 되지 않을까요?"
2003805-38 = "[s] \"그러면…… 계산 부탁합니다. 잘 먹었습니다.\""
2003805-39 = "맛있게 드셨나요? 그렇다면 다행입니다……."
2003805-40 = "조금 전부터 느낀 것입니다만……."
2003805-41 = "무슨 걱정이라도 있으신가요. 사장님?"
2003805-42 = "네? 아닙니다, 아닙니다. 걱정은요. 손님분들께서 맛있게 드셨다면 그것으로 충분합니다."
2003805-43 = "그런 것 치고는 활기가 너무 없으시네요. 이따금 한숨도 내쉬시고 말이죠."
2003805-44 = "……."
2003805-45 = "사실은…… 요즘 여러모로 가게 운영에 문제가 생겨서 말이지요……."
2003805-46 = "원인이라도 있을까요?"
2003805-47 = "말하자면, 이런 겁니다. 지금도 TV에서 방송이 나오고 있군요……."
2003805-49 = "오늘도~ 건강 채널입니다! 알고 계시나요, 시청자 여러분?"
2003805-50 = "맛있게 밥을 먹었는데, 이럴 수가! 갑자기 심장이 뛰고 노곤해지거나, 속이 쓰리고 기분이 불쾌해지는 경우, 없으셨는지요!"
2003805-51 = "저희 건강 채널에서는! 그 이유가 무엇일까 심층 취재를 해 보았는데요!"
2003805-52 = "세상에 이런 일이! 중화요리가 그 원인일 수 있다는 연구 결과가 나왔습니다!"
2003805-53 = "심지어 이 현상의 이름도 이미 붙여져 있었는데요! 바로 '중화요리 증후군' 이라고 합니다!"
2003805-54 = "이 증후군의 원인은, 다량의 소금과 돼지기름, 조미료와 향신료를 사용하는 중화요리의 조리법에서 유래될 수 있다고도 하는데요!"
2003805-55 = "이건 어디까지나 가설에 지나지 않지만! 중화요리를 먹는 것만으로도 혈관에 기름이 쌓이고, 피로가 풀리지 않게 되고, 근육통이 생겨나며."
2003805-56 = "나아가 가정이 무너지고, 사회가 무너지고, 사회가 황폐화되고! 이러한 현실 속에서–"
2003805-61 = "……에잉. 꺼 버려야지……."
2003805-62 = "죄송합니다. 손님. 좋지 않은 모습을 보여드린 것 같군요."
2003805-63 = "최근 저렇게, 건강 코너에서, 중화요리는 몸에 좋지 않다고 선전하는 바람에 말이죠……."
2003805-64 = "손님도 크게 줄었고, 매출도 감소하고 있는 데다, 거리에 드나드는 사람 자체가 적어져 모든 가게들이 힘들어하고 있다고요……."
2003805-65 = "[s] \"……거리 모습을 확인해 볼까?\""
2003805-67 = "정말이네요. 오가는 사람의 숫자가 거의 없어요."
2003805-68 = "점심 시간과 저녁 시간이야말로 가장 열심히 식당이 영업해야 하는 때일 텐데……."
2003805-69 = "……."
2003805-70 = "결심했습니다, 선생님."
2003805-71 = "[s] \"뭐, 뭘?!\""
2003805-72 = "가능한 한 다른 학원의 일에는 간섭하지 않으려 했습니다만……."
2003805-73 = "산해경에 있는 동안 계속해서 맛있는 중화요리를 대접받았는데."
2003805-74 = "그걸 그냥 모른 척한다는 것도, 어딘가 신경이 쓰이는 일이니까요."
2003805-75 = "그래서 무엇을 하려는 생각이냐고요?"
2003805-76 = "일단은…… 그렇군요. 광장으로 자리를 옮기실까요?"
2003805-78 = "[ns3] \"광장까지 오기는 했는데…….\"\n[ns4] \"구체적으로, 뭘 하려는 거야. 토모에?\""
2003805-81 = "우후후. 그것은 말이죠."
2003805-82 = "시가 연설이랍니다. 선생님!"
2003805-83 = "[s] \"시가 연설이라면……?!\""
2003805-84 = "네. 사람이 오가는 광장 한가운데에서 '진실'을 이야기한다면."
2003805-85 = "보다 많은 사람이 귀를 기울여 줄 테고, 중화요리에 대한 '소문' 역시…… 사라지겠지요."
2003805-86 = "그러면 지금부터, 중화요리에 대한 연설을 시작하겠습니다!"
2003805-92 = "(토모에가 광장 한가운데에서 연설을 하기 시작했다.)"
2003805-94 = "산해경의 학생 여러분, 좋은 오후입니다. 식사는 잘하셨는지요?"
2003805-95 = "저는 오늘 이 자리에서 여러분께 알려지지 않은 한 가지 진실에 대해 고하고자 합니다."
2003805-96 = "최근 중화요리가 몸에 좋지 않다는 소문이 퍼지고 있는 모양이더군요."
2003805-97 = "갑자기 심장이 뛰고 노곤해지거나, 속이 쓰리고 기분이 불쾌해진다거나……"
2003805-98 = "정말이지, 모두가 일고의 가치도 없는 헛소문뿐입니다!"
2003805-103 = "어…… 그렇지만 돼지기름이 몸에 좋지 않은 것은, 사실이지 않을까요?"
2003805-104 = "돼지기름은 혈관을 막는다고도 하고……."
2003805-106 = "그렇습니다. 바로 그 돼지기름에 대한 오해부터, 우리는 차근차근히 풀어 나가야 할 것입니다!"
2003805-107 = "우선 돼지기름은 비타민 B와 미네랄의 좋은 공급원으로, 양고기나 쇠고기 지방보다 포화 지방이 적고 불포화 지수가 높아 혈관 건강에 좋습니다!"
2003805-108 = "무엇보다 돼지기름은 맛있습니다! 버터의 약 3분의 1 정도로 현저히 적은 콜레스테롤을 함유하고 있기 때문에, 훌륭한 버터 대체품이 될 수도 있고요!"
2003805-109 = "월병 역시 돼지기름으로 만들지 않습니까? 저희 붉은겨울에서는 돼지 비계를 소금에 절여, 빵 사이에 끼워 먹기도 합니다. 추운 날씨를 버티기 위한 소중한 식품이죠!"
2003805-110 = "이렇게 장점밖에 없는 돼지기름을, 다른 어떤 요리보다도 마음껏 사용하는 중화요리가 건강에 나쁘다고 하는 것은, 그야말로 완전한 오해이자 음해로–"
2003805-112 = "(……그렇게 토모에는, 돼지기름이 나쁘지 않은 이유, 나아가 중화요리가 건강을 해치지 않는 이유에 대해 능숙하게 설명을 이어갔다.)"
2003805-114 = "……그렇기 때문에 중화요리가 건강에 나쁘다는 것은, 자기들만 이 좋은 중화요리를 독점하려는 저 간악한 건강 채널의 사악한 음모인 것입니다!"
2003805-115 = "여러분, 어느 쪽이십니까? 진실만을 이야기하는 저의 말입니까, 아니면 사람을 속이는 것으로 이득을 취하는 건강 채널의 찌라시입니까!"
2003805-120 = "화, 확실히……. 그렇다면 중화요리는 건강에 나쁜 것이 아니라, 오히려 건강에 좋은 요리가 아니었을까?"
2003805-121 = "그러게? 그 좋다는 돼지기름도 듬뿍 사용했을 것이고……."
2003805-122 = "무엇보다 우리가 지금까지 가장 많이 먹어 온 게 그거잖아?"
2003805-123 = "그러네! 그래서 문제가 생겼다면 진작에 생겼겠지!"
2003805-124 = "오랜만에 중화요리 거리, 가 볼래?"
2003805-125 = "좋아! 간만에 실컷 먹는 거다?"
2003805-131 = "[ns5] \"모두 한 몸이 된 것처럼…….\"\n[ns6] \"중화요리 거리로 달려가 버렸어……!\""
2003805-135 = "우후후. 제 화술도 아직 녹슬지 않은 모양이네요."
2003805-136 = "[s] \"하지만 중화요리가 몸에 좋다는, 또 다른 오해가 생긴 것 아닐까?\""
2003805-137 = "뭐어."
2003805-138 = "거짓말을 또 다른 거짓말로 덧씌우는 건 프로파간다의 기본이니까요?"
2003805-140 = "(그 뒤로 중화요리 거리는, 그동안의 손해를 전부 회복하고도 남을 만큼의 매출을 올렸고…….)"
2003805-141 = "(소문은 점점 퍼져나가, 키보토스에는 한동안 소소한 중화요리 붐이 일었다고 한다…….)"
