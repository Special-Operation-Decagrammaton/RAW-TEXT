[translation]
41100-1 = "제10화;무소유와 야키니쿠 도시락"
41100-11 = "……드디어 정신을 차리신 모양이군요."
41100-17 = "동지들의 접대가 서툴러, 혹시 몸에 무슨 문제라도 생기신 게 아닌지 걱정했습니다."
41100-19 = "저희도 키보토스 밖에서 오신 분을 모시는 건 처음이라서요."
41100-20 = "[s] \"……당신은?\""
41100-21 = "인사가 늦었군요. 제 이름은 데카르트."
41100-22 = "이곳의 조직— <소유하지 않고도 확실한 행복을 찾는 모임>, 줄여 <소확행>을 이끌고 있는 리더입니다."
41100-23 = "[s1] \"소유하지 않고……?\"\n[s2] \"소확행……?\""
41100-24 = "이런, 이런. 저희의 이름을 처음 들어보셨습니까?"
41100-25 = "이런, 이런. 저희의 이름을 처음 들어보셨습니까?"
41100-26 = "청빈한 삶을 추구하는 자라면 누구나 한 번쯤은 들어본 이름일 텐데, 선생님께서는 청빈과는 거리가 먼 삶을 살아오셨나 보군요."
41100-27 = "하긴, 그럴 거라고 이미 예상하고 있었습니다."
41100-28 = "당신은 부하들을 시켜 남의 음식을 강탈하기나 하는 탐욕스러운 인간이니까요!"
41100-29 = "[s] \"무슨 말인지 모르겠는데…….\""
41100-30 = "시치미 떼지 마십시오! 저와 동지들이 이 눈으로 똑똑히 당신과 토끼 귀를 단 그 학생들이 이야기를 나누는 광경을 보았으니까요!"
41100-31 = "[s3] \"토끼 귀를 단 학생이라면……\"\n[s4] \"RABBIT 소대를 말하는 거야?\""
41100-32 = "당신이 그 학생들을 무어라 부르고 있는지는 관심 없습니다."
41100-33 = "당신이 그 학생들을 무어라 부르고 있는지는 관심 없습니다."
41100-34 = "저희에게 당신들은 그저 구도를 방해하는 탐욕스러운 방해자일 뿐이니까요."
41100-35 = "[s] \"우리가 무얼 방해했는데?\""
41100-36 = "……혹자들은 저희를 이렇게 부르곤 하죠."
41100-37 = "<사회의 거머리>, <니트>, <거지>, <어째서 일하지 않는 거야-> 라고……."
41100-38 = "하지만 그것은 실제와 다릅니다. 저희는 일하지 않는 것이 아닙니다……"
41100-39 = "저희는 무소유를 실천하고 있을 뿐입니다!"
41100-40 = "[s] \"무소유……?\""
41100-41 = "키보토스의 사람들은 너무나도 많은 것을 소유하려 하고 있습니다."
41100-42 = "새로 나온 전차나, 값비싼 소총, 미사일을 막아주는 아늑한 벙커 등등……"
41100-43 = "하지만 이 소유에 대한 욕망은 아무리 채워도 마르지 않고 계속 불어나, 결국은 삶을 피폐하게 만들고 맙니다."
41100-44 = "진정한 행복이란 소유가 아닌 무소유에서 비롯되는 법……"
41100-45 = "생존에 필요한 것을 제외한 모든 것을 내려놓고 무위자연의 삶을 유지해야 진정한 행복에 도달할 수 있는 것입니다."
41100-46 = "그래서 저희는 일하지 않고, 소유하지 않고, 이런 낡은 건물 아래에서 무소유의 삶을 이어 나가기로 했습니다."
41100-50 = "그런데 어느 날, 이곳에 불청객이 찾아왔습니다."
41100-51 = "토끼 귀를 달고 값비싼 장비로 무장한 그 학생들은 자신들의 아지트에 먹고 남을 정도의 폐기 도시락을 쌓아 놨음에도 불구하고 탐욕스럽게 새로운 도시락을 앗으려 했습니다."
41100-52 = "그들이 지나간 자리에는 숙주 도시락조차 남아있지 않았습니다……"
41100-53 = "안 그래도 야키니쿠 도시락은 폐기가 잘 안 되는 고급 도시락인데…… 그런 사치품을 혼자 독점하려 하다니……"
41100-54 = "이는 최소한의 상도덕을 무시한 몰상식한 행위가 아닙니까?!"
41100-55 = "[s] \"사치품에는 관심이 없다며……?\""
41100-56 = "그, 그건 그렇지만……."
41100-57 = "여하튼! RABBIT 소대인지 토끼 소대인지 모를 그 학생들의 폭거를 두고만 볼 수는 없습니다!"
41100-58 = "보아하니 당신이 그들의 리더처럼 보이던데…… 이 자리에서 약속해주시겠습니까?"
41100-59 = "앞으로 이 일대의 야키니쿠 도시락은 우리 <소확행>의 소유라는 것을 말이지요!"
41100-60 = "[s5] \"그 아이들은 내 부하가 아니야.\"\n[s6] \"그 아이들은 내 학생일 뿐이야.\""
41100-61 = "부하든 학생이든, 선생이라면 당신의 말을 들을 게 아닙니까?"
41100-62 = "부하든 학생이든, 선생이라면 당신의 말을 들을 게 아닙니까?"
41100-63 = "……어째서 그런 표정을 지으시는 거죠? 당신은 당신의 학생들도 제대로 다루지 못하는 겁니까?"
41100-64 = "쳇…… 하는 수 없지."
41100-68 = "그 자리에 얌전히 계시지요. 저희가 당신의 휴대폰으로 대신 교섭을 시도하겠습니다."
41100-69 = "[s] \"소용없는 일일 텐데…….\""
41100-73 = "주소록에 RABBIT 소대가……"
41100-74 = "아, 여기에 있군."
41100-81 = "……무슨 일이시지요, 선생님? 저희는 식사 준비로 바쁩니다만."
41100-82 = "아, 당신이 <RABBIT 소대>의 리더입니까?"
41100-83 = "저희는 진정한 행복을 구도하는 도시의 수도자, <소유하지 않고도 확실한 행복을 찾는 모임>, 줄여서 <소확행>의—"
41100-87 = "……끄, 끊었어?"
41100-88 = "[s] \"보이스 피싱으로 오해한 거 아닐까?\""
41100-89 = "으읏…… 이래서 진리를 깨우치지 못한 범인들은……"
41100-96 = "여, 여러분? 뭔가 장난 전화라고 오해하신 모양입니다만……."
41100-97 = "당신들의 선생님은 저희가 붙잡고 있습니다. 저희의 요구를 순순히 따르지 않으면 지금부터 선생님께 잔혹한 일을……"
41100-98 = "아, 그래. 알아서 즐겁게들 놀고 계셔."
41100-103 = "……또 끊었어?!"
41100-104 = "당신 뭐야. 진짜 선생 맞아? 어째서 학생들이 이렇게 조금도 걱정을 하지 않는 건데?!"
41100-105 = "[s] \"거기에는 복잡한 사정이 있어서…….\""
41100-106 = "젠장, 모처럼 샬레의 선생님을 인질로 비싼 도시락을 잔뜩 뜯어낼 기회라고 생각했는데……."
41100-107 = "이렇게 된 이상 다른 방법을 찾아야……."
41100-108 = "[s] \"내가 대신 전화를 해도 괜찮을까?\""
41100-109 = "당신이 직접 말입니까?"
41100-110 = "……상관은 없지만, 혹시라도 경찰에 신고할 작정이시라면 포기하시는 게 좋을 겁니다."
41100-111 = "저희 소확행의 동지들은 어지간한 경찰들보다 수준 높은 무기로 무장하고 있으니까요!"
41100-112 = "[s] RABBIT 소대에 직접 전화를 건다."
41100-121 = "으으…… 뭔데, 선생님. 나는 어젯밤 늦게까지 작업을 하느라 피곤하다고."
41100-122 = "계속 이상한 장난을 칠 거라면……."
41100-123 = "[s] \"여기에 버려진 최고급 와규 도시락이 있어.\""
41100-129 = "하! 그렇게 자신만만해하더니, 이게 뭡니까?"
41100-130 = "이번에도 또 전화를 끊지 않았습니까!"
41100-131 = "쳇, 이렇게 된 이상 다른 학생을 협박해서 먹을만한 걸 뜯어내야……."
41100-142 = "SRT다! 모두 물러서!"
41100-144 = "사키, 지금 저희는 SRT의 공무를 수행 중인 게 아니니 일단 신분은 숨기는 게……."
41100-145 = "그, 그보다 진짜 여기에 최고급 와규 도시락이 있는 게 맞아?"
41100-146 = "최고급 와규가 들어간 도시락은 SRT 학원에 있을 때도 먹어본 적이 없는데……."
41100-148 = "샬레의 선생님이 그렇게 말했으니까, 틀림없어."
41100-149 = "선생님의 번호를 역추적해서 휴대 전화의 위치를 파악했으니까 분명 아직도 그 근처에 있을 거야!"
41100-150 = "[s] \"엄청나게 빨리 도착했네…….\""
41100-152 = "아, 선생님이다."
41100-153 = "선생님, 여기에 최고급 와규 도시락이 있다는 게 정말 사실이야?"
41100-154 = "신속한 수거는 폐기 도시락의 생명과도 직결되는 중대 사안."
41100-155 = "유통기한이 이미 지난 폐기 도시락은 매초가 지날 때마다 가치가 급속도로 떨어지지요."
41100-156 = "그래서 이곳에 와규 도시락이 있다는 말을 듣고 달려왔습니다만……."
41100-157 = "[s] \"그게, 그러니까…….\""
41100-159 = "하하하! 저희의 계획에 완벽히 속으셨군요."
41100-160 = "인간의 욕망이 도달할 수 있는 끝은 존재하지 않는 허상과도 같은 법……"
41100-161 = "탐욕에서 빠져나오지 못한 인간만이 그 허상에 홀려, 끝내 파멸에 발을 딛곤 하지요."
41100-162 = "그 말은…… 여기에 최고급 와규 도시락이 없다는 거야?"
41100-163 = "물론입니다. 애초에 판매되는 곳도 거의 없는 최고급 와규 도시락이 폐기로 나올 리가 없잖습니까."
41100-164 = "부디 이번 기회에 교훈을 얻어 무소유의 즐거움을 깨달으시길 바라겠습니다."
41100-166 = "자, 동지들. 이 욕망에 찬 아귀들에게 본때를 보여줍시다!"
41100-176 = "우앗, 이 녀석들 뭐야? 다 떨어진 옷을 입고 있는 주제에 무기는 최신식으로 무장하고 있어!"
41100-177 = "포, 포위됐어……."
41100-179 = "여러분, 잠시만 기다려주세요."
41100-180 = "적을 좁은 곳으로 유인하여 각개격파하면 피해 없이 상대를—"
41100-181 = "뭐, 아무리 무기가 좋아도 결국은 잔챙이일 뿐이잖아?"
41100-182 = "아무리 대단한 무기로 무장하고 있다 하더라도 우리 SRT에 비할 바가 못 되지!"
41100-183 = "2층에 있는 저격수라면…… 처리할 수 있을 것 같아."
41100-184 = "미야코, 전방에 위치한 적은 나와 미유가 처리할 테니까 뒤를 부탁해! 그래도 괜찮지?"
41100-186 = "……알겠습니다. 그럼 교전은 여러분의 재량에 맡기겠습니다."
41100-187 = "제가 신호와 함께 섬광탄을 사용할 테니, 소대원 여러분은 그때를 노려 산개해주세요."
41100-188 = "그럼 바로……"
41100-190 = "돌입합니다!"
