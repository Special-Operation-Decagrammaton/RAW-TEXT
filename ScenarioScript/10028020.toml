[translation]
10028020-1 = "제2화;분명 별일 아니었는데"
10028020-7 = "하아, 하아……. 하아……."
10028020-8 = "뛰, 뛰느라 숨이……. 잠시만요……."
10028020-13 = "그, 그래도 어떻게든 타긴 탔네요. 하하……."
10028020-20 = "서, 선생님……? 괜찮으심까!? 너무 갑작스레 뛰어서 다치시기라도……!"
10028020-21 = "[s1] \"시, 신경 쓰지 마. 괜찮아…….\"\n[s2] \"운동을 좀 더 해야겠어……. 헉헉…….\""
10028020-24 = "다, 다행이네요……."
10028020-25 = "으음. 어쩌다가 일이 이렇게……. 편하게 모셔 오도록 도와드리라고 했는데……."
10028020-29 = "죄송합니다. 시작부터 사고를 쳐 버렸습니다……."
10028020-30 = "……괜찮으시다고요? 그렇게 말씀해 주시면 저야 감사할 따름이지만……."
10028020-31 = "뭔가 그래도 첫 단추부터 조금 잘 못 잠근 것 같아 아쉽네요."
10028020-32 = "대체 어디서부터 일 처리가 꼬인 건지. 으으……."
10028020-36 = "그, 그래도 다르게 말하면, 덕분에 가방을 잃어버리지 않은 거니까요!"
10028020-37 = "안 그랬으면 이대로 잃어버릴 뻔했잖아요? 그렇죠?"
10028020-38 = "[s3] \"그럼, 그럼. 사소한 일이지.\"\n[s4] \"이 정도는 일상다반사야, 원래.\""
10028020-41 = "그, 그렇죠! 아하하하! 에이, 뭐. 별일 아님다, 이 정도는~."
10028020-42 = "가방이야 화물칸에서 찾으면 그만이고~ 찾은 뒤에는 다음 역에 내려서 트리니티행 기차로 환승하면 되고~"
10028020-43 = "아직 시간은 널널 하니까요~ 오늘 안에만 가면 되고~."
10028020-47 = "물론 하필이면 하고 많은 학원들 중 게헨나 행 기차라는 게 좀 그렇지만, 그래도~"
10028020-52 = "…………?"
10028020-53 = "뭐야, 저 녀석? 저 녀석 트리니티 녀석 아냐? 왜 트리니티가 여기에……."
10028020-54 = "아니, 잠깐만. 팔에 저 완장……. 저거 정의실현부지? 맞지?"
10028020-55 = "어째서 게헨나도 아니고 트리니티 쪽 참새 녀석이 게헨나 행 열차에……?"
10028020-70 = "……어……."
10028020-71 = "음……. 그……. 뭔가, 지금 분위기가 좀……."
10028020-72 = "환영받지 못하는 것 같은 느낌이……."
10028020-73 = "[s5] \"아무래도 직책 간의 상성이…….\"\n[s6] \"역시나 학교 간 분위기가…….\""
10028020-76 = "어이, 거기! 왜들 소란이야! 또 무슨 일인데!?"
10028020-80 = "하여간 게헨나 녀석들! 한 번을 그냥 넘어가는 법이 없지! 어!?"
10028020-84 = "……응? 뭐지?"
10028020-85 = "당신 뭐야? 트리니티잖아? 어쩌다가 트리니티가 이 열차에 탄 거지? 이건 게헨나 행이라고!"
10028020-89 = "……아니. 뭐, 자세한 건 내 알 바가 아니지. 일단 표나 보여줘 봐, 표. 빨리."
10028020-90 = "네, 네? 표, 표요? 아니. 그…… 저희는……."
10028020-91 = "……엉? 뭐야. 표가 없다고?"
10028020-92 = "그럼 그쪽 어른은?"
10028020-93 = "둘 다 없다고? 아니, 뭐 이런 장난하는 것도 아니고……."
10028020-94 = "아하하……. 저기, 잠시만 기다려 주세요. 우선 저희 이야기를……."
10028020-95 = "이야기는 무슨 이야기? ……아니면 뭐, 또 역시 그런 건가?"
10028020-96 = "어차피 게헨나 행 열차고……. 난장판이고……."
10028020-97 = "……?"
10028020-98 = "……예?"
10028020-99 = "관리도 안 되는 놈들이고……. 승무원 놈들은 허수아비고……!!"
10028020-100 = "아니, 그……."
10028020-101 = "그런 식이니까 대충 무임승차해도 모를 거라는……?"
10028020-102 = "그런 게 아니고……. 잠시만 저희 이야기를……."
10028020-103 = "그런……? 뜻인가, 또……? 역시 그런 건가……!?"
10028020-104 = "아니, 저흰 아직 아무……."
10028020-105 = "아무리……. 아무리……!!"
10028020-106 = "아무리 이 열차가 무법천지라고 해도 그렇지, 이젠 대놓고 무임승차까지 하겠다고!?"
10028020-107 = "아무 말도……. 안 했는데……요……."
10028020-108 = "더는 참을 수 없어!! 지긋지긋해!! 이젠 트리니티 놈들까지 우릴 개판 취급해!?!?"
10028020-109 = "삐익-! 삐이이이이익-!! 집하아아압-!!"
10028020-110 = "무임승차범 2인조 발견! 대응 매뉴얼 C타입으로 대응한다!!"
10028020-113 = "뭐!? 무임승차범!? 이 자식들이 또……!"
10028020-114 = "더는 못 참아! 문답무용이다!! 무임승차범은 전부 잡아 처 넣는다!!"
10028020-115 = "집하아아압-!!"
10028020-120 = "음……."
10028020-121 = "……으음……."
10028020-122 = "이상하다……. 뭐지……."
10028020-123 = "분명……."
10028020-128 = "분명 별일 아니었는데……."
