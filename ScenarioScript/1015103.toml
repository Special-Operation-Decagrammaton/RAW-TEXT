[translation]
1015103-1 = "#title;천재와 검증을"
1015103-3 = "#na;(안나를 돕기 위해 183호에 방문했다.)"
1015103-5 = "#place;183호 특별반"
1015103-7 = "3;안나;02;선생님, 정말 아무한테도 이야기 안 하셨죠?\n#3;em;[?]\n#3;a"
1015103-8 = "3;안나;25;이건 엄청난 대발견이어서, 모두에게 극비로 해야 해요!"
1015103-9 = "[s1] \"응! 아무에게도 말 안 했어!\"\n[s2] \"뭔가 특허를 낼 만한 발견이야?\""
1015103-12 = "3;안나;02;특허요? 어차피 183호에서 발견하고 발명하는 건 학교에 귀속되어서 그건 상관없어요.\n#3;em;[반응]"
1015103-13 = "3;안나;21;괜히 특허 낸다고 했다가 서류 처리만 복잡해지고요, 아하하…….\n#3;stiff"
1015103-14 = "3;안나;24;하지만, 엄청 대단한 발견인 건 맞아요! 붉은겨울은 물론 키보토스 전역의 모두에게 큰 도움이 될 거예요!"
1015103-15 = "3;안나;25;그러면…… 짜잔! 바로 이거예요!\n#3;em;[반짝]\n#3;greeting"
1015103-16 = "#st;[0,0];instant;1;"
1015103-19 = "[ns3] (칙칙한 색의 곤죽 같은 게 든 통이다.)\n[ns4] \"어, 으응! 엄청 멋있네!\""
1015103-22 = "3;안나;02;으응? 이게 멋있어요? 아직 이건 원재료 상태인데?\n#3;em;[?]"
1015103-23 = "3;안나;24;역시 선생님은 눈썰미가 좋으시군요! 보는 것만으로도 느끼시다니!\n#3;stiff"
1015103-24 = "3;안나;25;이건 새로 개발한 신소재, '안나크리트'예요!\n#3;em;[음표]"
1015103-25 = "3;안나;15;엄청 단단하고 원하는 대로 모양을 만들 수 있고, 무엇보다 가격이 엄청나게 싸다는 게 장점이죠!\n#3;jump"
1015103-26 = "3;안나;03;말하자면, 값싼 콘크리트인 거죠."
1015103-27 = "[s] \"대단한데?! 천재 안나가 더 알려줘!\""
1015103-28 = "3;안나;15;에, 엣헴! 그러면 사양하지 않고 말씀드릴게요!\n#3;em;[반응]"
1015103-29 = "3;안나;03;이거, 톱밥이랑 폐지에서 나온 펄프를 잘게 갈아서 물하고 섞은 거예요. 이걸 얼리면 아주 단단해져요.\n#3;m2"
1015103-30 = "3;안나;34;열전도율이 낮아서 상온에서도 잘 안 녹고요…… 녹는 속도가 증발보다 느려서 물바다가 되지도 않아요."
1015103-31 = "3;안나;25;설령 녹더라도 다시 물을 뿌려주고 얼리면 원래의 강도가 돌아오니까 유지보수도 쉬워요."
1015103-32 = "3;안나;31;안에서 펄프가 단단하게 잡아주니까 얼음과 달리 취성이 줄어들고 인성이 크게 증가하죠! 이걸로 고층 건물을 만들어도, 심지어 포탄으로 쏴도 끄떡없어요!\n#3;em;[반짝]\n#3;m3"
1015103-33 = "3;안나;03;앞서 말씀드렸지만, 재료는 어차피 버릴 톱밥하고 폐지, 그리고 물밖에 없으니까 공짜나 마찬가지! 거기에 붉은겨울은 항상 추우니까 반영구적인 재료라고 봐도 무방해요."
1015103-34 = "3;안나;25;이런저런 생각을 하다가 갑자기 떠올라서 실험해 봤는데, 다행히 가설대로 잘 만들어졌어요! \n#3;greeting"
1015103-35 = "[s] \"어떤 게 신경 쓰였는데?\""
1015103-36 = "3;안나;24;앗, 그건요! 붉은겨울의 공훈보건병원이 증축해야 하는데, 예산이 부족해서 지지부진했거든요.\n#3;em;[반응]"
1015103-37 = "3;안나;03;사무국에서도 나름 신경 썼지만, 너무 추운 날씨에는 콘크리트 양생을 하기도 힘들다는 문제도 있었고요. 그래서, 뭔가 과학자로서 도움을 줄 수 없을까 생각했어요."
1015103-38 = "3;안나;34;이 값싸고 튼튼한 재료를 이용하면, 원래 예산의 10분의 1, 공기는 5분의 1로 단축할 수 있을 거예요. 새 병원이 만들어지면 모두 행복해하겠죠! 에헤헤-"
1015103-39 = "3;안나;25;어때요? 대단하죠? 멋있죠? 천재 같죠?\n#3;em;[?]"
1015103-40 = "[s] \"멋져! 이거라면 특별반에서 사면될 수도 있겠네!\""
1015103-41 = "3;안나;02;네?\n#3;stiff"
1015103-42 = "3;안나;24;앗, 맞다! 그럴지도 모르겠네요! 그건 까먹고 있었어요! 다들 좋아하는 상상만 하다 보니……!\n#3;em;[///]"
1015103-43 = "3;안나;25;그렇네요! 모두가 행복할 수 있다면, 분명 인정받을 수 있겠죠!"
1015103-44 = "3;안나;99;그렇다면, 더더욱 보고하기 전에 테스트해 봐야겠네요."
1015103-45 = "3;안나;03;엄청난 대발견이라서, 기왕이면 선생님과 함께 테스트해보고 싶었어요."
1015103-46 = "3;안나;24;그러면 당장 시작해 볼까요! 엄청 놀라실 거예요!\n#3;em;[반짝]\n#3;hophop"
1015103-47 = "3;안나;25;강아지호 준비해 둘게요!\n#3;m2"
1015103-48 = "#st;[0,0];instant;1;"
1015103-50 = "3;안나;25\n#3;dl\n#wait;1500"
1015103-53 = "3;통신안나;03\n#3;a\n#wait;1200"
1015103-54 = "3;통신안나;24;선생님! 준비되셨죠!"
1015103-55 = "3;통신안나;03;강아지호 겉에 뿌린 '안나크리트'는 다 얼었나요?"
1015103-56 = "[s] \"응! 두껍게 잘 얼었네!\""
1015103-57 = "3;통신안나;25;좋아요! 준비 완료!\n#3;em;[음표]"
1015103-58 = "3;통신안나;03;그러면, 옆에 있는 버튼을 눌러보세요! 강아지호를 향하게 해둔 대포가 발사될 거니까, 소리에 놀라지 마셔요!"
1015103-59 = "[s] \"어…… 이게 안전할까?\""
1015103-60 = "3;통신안나;02;왜요? 맨몸으로 Flak 41을 맞는다면 요양이라도 해야겠지만, 탱크 안이기도 하고 76mm 정도면 아무 문제 없을 거예요!\n#3;em;[?]"
1015103-61 = "3;통신안나;03;그러면 바로 해보죠! 걱정 말고, 걱정 말고!"
1015103-62 = "3;통신안나;31;조준 좋으면- 쏴!\n#3;em;[음표]\n#3;jump"
1015103-64 = "[ns5] \"우, 우오오오오오!!\"\n[ns6] (침착하게 버튼을 누른다)"
1015103-65 = "#st;[0,0];instant;1;"
1015103-66 = "#st;[0,0];instant;1;"
1015103-70 = "[ns] \"아, 안나……?! 괜찮아?\""
1015103-72 = "3;통신안나;02\n#3;a\n#wait;1200"
1015103-73 = "3;통신안나;24;네! 괜찮아요!"
1015103-74 = "3;통신안나;02;혹시 소리가 끊겼나요? 기뻐서 엄청 소리 질렀더니 마이크가 커트했나 보네요!\n#3;em;[?]"
1015103-75 = "3;통신안나;03;강아지호는 아무 이상 없어요! 안쪽에 전혀 손상도 없고, '안나크리트'도 안 떨어져 나갔어요!"
1015103-76 = "3;통신안나;24;예상된 강도보다 최소 5배는 더 튼튼했네요! 대성공!! \n#3;em;[반짝]\n#3;hophop"
1015103-77 = "3;통신안나;25;이 정도 두께라면, 상온에서는 녹는 데 2년, 붉은겨울 외부 기온으로는 사실상 반영구일 거예요!"
1015103-78 = "3;통신안나;31;그렇지! 뭔가 성공하고 나서, 점프하면서 하이파이브 하는 거 해보고 싶었어요!\n#3;em;[반응]"
1015103-79 = "3;통신안나;03;얼른 나갈게요! 읏차!"
1015103-80 = "#st;[0,0];instant;1;"
1015103-84 = "3;통신안나;02\n#3;em;[?]\n#3;h\n#wait;1000"
1015103-85 = "3;통신안나;18;엥? 문이 이렇게 무거웠나?"
1015103-86 = "#st;[0,0];instant;1;"
1015103-90 = "3;통신안나;04;어……? 잠금장치도 풀려있는데? 밖에서 뭐가 막는 것도 아닌데 대체 왜 안 열리는…….\n#3;stiff"
1015103-91 = "#st;[0,0];instant;1;"
1015103-93 = "3;통신안나;28\n#3;em;[?!]\n#3;shake\n#wait;1000"
1015103-94 = "3;통신안나;06;앗."
1015103-95 = "[s] \"'안나크리트'가 막아버린 거야?!\""
1015103-96 = "3;통신안나;04;그, 그렇다면……. 상온에서 녹는 데 2년은 걸리니까……?\n#3;em;[땀]"
1015103-97 = "3;통신안나;06;강아지호에 2년 동안 갇혀있어야 한다고…… 요……?"
1015103-98 = "3;통신안나;09;나, 나 어떡해? 우, 우아앙…….\n#3;stiff"
1015103-99 = "3;통신안나;10;으아앙- 선생니임-!!\n#3;em;[속상함]"
1015103-100 = "[s] \"진정해!! 선생님이 꼭 구해줄게!!\""
1015103-101 = "3;통신안나;12;으아앙-!!\n#3;hophop\n#3;closeup\n#fontsize;100"
1015103-103 = "#na;안나크리트는 대포 여러 발을 쏴도 꿈쩍도 하지 않았다."
1015103-104 = "#na;다행히, 진정한 안나가 휴대용 용접기로 전차 바닥을 뚫고 탈출할 수 있었다."
1015103-105 = "#st;[0,0];instant;1;"
1015103-108 = "#na;놀란 안나를 한참 동안 달래주었다."
