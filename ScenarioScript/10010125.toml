[translation]
10010125-1 = "제12화;뿌린 대로 거두리라 2"
10010125-6 = "……."
10010125-11 = "[ns] \"…….\""
10010125-19 = "……저기……. 선생님……."
10010125-20 = "그……. 이런 말 해봐야 딱히 대안이 있는 것도 아니긴 하지만……."
10010125-21 = "그래도……. 역시 뭐라도 해야 하는 거 아닐까요……."
10010125-22 = "……네?"
10010125-23 = "걱정 되냐고요……? 그, 그건……. 그러니까……."
10010125-24 = "……그야……."
10010125-28 = "……네. 걱정되네요. ……희한하게도 말이에요."
10010125-29 = "오늘 처음 보는 사람이고……. 뭘 안다고 이런 소리 하는지 저도 스스로 우습긴 하지만……."
10010125-30 = "아무튼……. 그냥 그런 느낌이에요. 잘 설명은 안 되고……."
10010125-31 = "뭐, 사실 걱정이 된다고 해도……. 어차피 제가 할 수 있는 건……. 이 정도가 끝이지만요."
10010125-37 = "……완성이에요. 경전 복원본."
10010125-38 = "평소였다면 넘겨주지 않고 제가 이 원본으로 바로 읽어버렸겠지만……."
10010125-39 = "오늘은 기분이 아니네요."
10010125-40 = "그러니 그냥 이건 넘겨드릴게요……. 선생님께서 나중에 전달해 주세요."
10010125-41 = "……만약……."
10010125-45 = "만약 제가 좀 더 밖에서 나다닐 수 있는 타입의 사람이었다면……."
10010125-46 = "그랬다면, 뭔가 좀 더 빨리 끝내거나……. 결과가 바뀔 수 있었을까요……?"
10010125-47 = "아니, 뭐. 물론 제 탓이라거나……. 당연히 그런 이야기는 아니에요."
10010125-48 = "사실 따지고 보면 제 일도 아니고……. 전 어디까지나 도와주는 역이었고……"
10010125-49 = "이렇게 한 것만 해도, 저는 솔직히 제가 할 건 다 했다고 생각하지만……."
10010125-50 = "……그래도."
10010125-51 = "그래도 만약……. 제가 그…… 케이크 하나……. 그거라도 달라고 하지 않았다면……. 그냥 바로 시작했다면……."
10010125-53 = "아니면 물이끼 아교……. 그냥 이 건물의 창 하나만 뜯어서 바로 썼다면……."
10010125-54 = "정성약……. 평소에 조금만 아껴 써서 미리 남겨 뒀더라면……."
10010125-55 = "그냥 그런……. 아쉬움이 남는 정도의 이야기지만……."
10010125-57 = "……음……. 저도 제가 왜 이런 소릴 하고 있는지 모르겠네요."
10010125-58 = "이렇게 말하니까 괜히 하나라도 더 챙겨주려는 사람처럼 보이네. 난 그런 사람도 아닌데……."
10010125-59 = "그냥 잊어주세요……."
10010125-60 = "[s] \"…….\""
10010125-64 = "[ns1] \"……디저트?\"\n[ns2] \"……물이끼 아교?\"\n[ns3] \"……정성약?\""
10010125-65 = "……? 선생님……?"
10010125-66 = "……? 선생님……?"
10010125-67 = "……? 선생님……?"
10010125-90 = "……어……. 선생님……. 그……."
10010125-91 = "기본적으로……. 여기 내에서는……. 전화 통화는……. 금지인데……."
10010125-92 = "……? 선생님……?"
10010125-93 = "어, 어디로 거시는 건가요?"
10010125-94 = "……네? 잠시만 양해요……?"
10010125-97 = "……통화하실 곳이 많을 것 같다고요?"
10010125-103 = "……거의 다 왔다……. 저기로군요……."
10010125-104 = "어라……. 벌써 시간이……. 그렇군요. 슬슬 시작할 시간이네요……."
10010125-105 = "그래도 늦지 않아서 다행이에요……. 이제 가서 사실대로 말씀을 드리고……."
10010125-107 = "거기, 잠깐. 멈추세요."
10010125-108 = "……??"
10010125-109 = "누구시죠? 여긴 지금 중요한 행사가 시작될 예정입니다. 소속과 이름을 밝혀주세요."
10010125-110 = "……어라. 그 복장……. 시스터후드 쪽분이시군요."
10010125-111 = "아……. 안녕하세요. 복장을 보니 정의실현부의……."
10010125-112 = "네. 정의실현부의 마시로라고 합니다."
10010125-113 = "주변의 다른 정의실현부 부원분들과 함께, 오늘 이 행사의 경비 담당으로 와 있습니다."
10010125-114 = "그런데……. 시스터후드의 시스터님께서 여긴 어떤 일로……?"
10010125-115 = " 참석 예정이신 시스터님께선 이미 다 행사장 안에 들어가신 것으로 알고 있습니다만……."
10010125-116 = "아하하……. 네, 맞아요……. 저는 그……. 참석 인원은 아니라서……."
10010125-117 = "그렇군요……."
10010125-118 = "죄송합니다만, 아시다시피 아무리 시스터님이시라도 참석 인원 명단에 있는 분이 아니시면 들어가실 수 없습니다."
10010125-119 = "경비를 서고 있는 저희 정의실현부조차 안으로는 들어가지 못할 정도의 보안 규정이니까요."
10010125-120 = "잘은 몰라도 경전과 관련된……. 아주 중대한 기밀 사안이라고 들었거든요."
10010125-122 = "그, 그렇죠. 네……. 알고 있어요."
10010125-123 = "그치만 꼭……. 제가 직접 말씀드려야 할 일이 있어서요……."
10010125-125 = "……네? 꼭 말씀드려야 할 일……?"
10010125-126 = "그게 무슨 일이죠? 중요하신 사안이면, 제가 담당자분께 전달해 드리도록 하겠습니다."
10010125-127 = "……아……. 그렇군요. 네. 그걸로도 충분할 거 같아요……."
10010125-128 = "그러니까……. 그……."
10010125-129 = "그……?"
10010125-130 = "거기 있는……. 오늘 이제 공개할 그 경전……."
10010125-131 = "경전……?"
10010125-132 = "그……. 그걸……. 제가……. 으……."
10010125-133 = "으흐……으흑흑……. 흐응……."
10010125-134 = "시, 시스터님!? 갑자기 왜 우시는 건가요? 괜찮으신가요, 시스터님!?"
10010125-135 = "제가……. 훌쩍. 그…… 사실 그 경전을……!"
10010125-136 = "경전을……!!"
10010125-138 = "우리는 아무리 쓰러져도 일어나는 롤리폴리단이다!! 알아들었냐!!"
10010125-139 = "롤리폴리 흐흥……해서……!"
10010125-143 = "……? 예?"
10010125-145 = "……네?"
10010125-146 = "롤리폴리요?"
10010125-147 = "저, 적습! 적습이다!!"
10010125-156 = "……적습이요!? 이렇게 아무런 전조도 없이?!"
10010125-157 = "병력의 수는!? 예상 목표는!?"
10010125-158 = "모, 모르겠습니다! 어두운 곳에서 견제 사격과 도주를 반복하고 있습니다!"
10010125-159 = "무, 무슨……! 이럴 수가, 감히 저희 정의실현부가 있는 곳에서 이런 만행을……!!"
10010125-161 = "……????"
10010125-162 = "죄송합니다, 시스터님. 조금만 기다려 주세요. 이야기는 잠시 후에 다시 듣겠습니다."
10010125-164 = "적이 산개해 대처가 어렵습니다! 병력 충원 바랍니다! 병력 충원 바람!"
10010125-166 = "네! 마시로, 지금 갑니다!! 가시죠!"
10010125-167 = "네, 네!!"
10010125-171 = "……어……."
10010125-173 = "……어라?"
