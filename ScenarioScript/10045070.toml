[translation]
10045070-1 = "제7화;백화요란 vs 백화요란"
10045070-2 = "고마워, 유카리. 덕분에 우리가 이길 수 있었어."
10045070-3 = "별말씀을요! 소녀는 그저 백화요란의 길을 떠올렸을 뿐. 모두 선배 덕분이어요!"
10045070-4 = "그렇게 말해주니 고맙네."
10045070-7 = "(사람은 서로 도우며 살아가는 법.)"
10045070-8 = "(혼자서 전부 짊어질 필요도, 자신의 약함을 부끄럽다고 생각할 필요도 없어.)"
10045070-12 = "(……그렇지, 아야메?)"
10045070-15 = "유카리. 다음 경기는 렌게와 키쿄야. 이길 자신 있어?"
10045070-16 = "두 분의 강함은 소녀가 가장 잘 알고 있사와요!"
10045070-17 = "하지만, 저희의 팀워~크도 지지 않는다구요!"
10045070-18 = "승부에 집착하지 않고, 최선을 다하는 것이어요!"
10045070-19 = "응, 유카리다워."
10045070-20 = "다음 경기에서는…… 이 오른손도 자유롭게 사용할 수 있을 거야."
10045070-21 = "후회가 남지 않는 최고의 경기를 펼치자."
10045070-22 = "후후후, 물론이어요!"
10045070-24 = "키쿄. 작전을 짜자."
10045070-25 = "지금까진 어떻게든 이길 수 있었지만, 지금의 상대는 이야기가 달라."
10045070-26 = "그래서 좋은 생각이라도?"
10045070-27 = "없는데? 그건 네가 짜야지. 작전참모잖아"
10045070-28 = "하아. 그래. 그렇게 대답할 줄 알았어."
10045070-29 = "……."
10045070-30 = "일단, 내 예상이 맞다면 나구사 선배와 유카리는 정면 승부를 걸어올 거야."
10045070-31 = "우리의 약점을 공략해 온다거나, 예상 밖의 트릭을 사용한다거나 하진 않겠지. 왜냐하면……."
10045070-32 = "그거야말로 키쿄가 가장 피하고 싶은 싸움 방식이니까."
10045070-33 = "그래. 기책의 진수는 기습. #n정면에서 기세로 밀어붙이면, 어쩔 수 없이 불리해."
10045070-34 = "그렇다면 우리가 할 수 있는 것도 한 가지뿐."
10045070-35 = "정면승부로군."
10045070-36 = "기발한 작전에 큰 의미가 없다면……."
10045070-37 = "조금이라도 팀워크가 잘 맞는 팀. 조금이라도 정신력이 높은 팀이 승리하게 될 거야."
10045070-38 = "오? 그러면 우리가 유리하겠네!"
10045070-39 = "……그렇게 생각하는 이유는?"
10045070-41 = "우리는 어렸을 때부터 함께 했었으니까. 팀워크는 우리가 더 좋지 않을까?"
10045070-42 = "렌게……."
10045070-43 = "너랑 내가 같은 편이 되는 거야. 이긴다구."
10045070-44 = "……."
10045070-45 = "넌 정말로……."
10045070-46 = "알겠어. 작전을 생각해 볼게."
10045070-47 = "우리 둘만의 효율적인 작전을."
10045070-48 = "좋았어! 그렇게 가자!"
10045070-50 = "잠시 후……."
10045070-52 = "눈물과 드라마가 있는 패자부활전도 드디어 결승전!"
10045070-53 = "[ns] \"과연 추가 진출자는 누가 될 것인가!\""
10045070-58 = "스승님은 누가 이길 거라 생각하고 있을까?"
10045070-59 = "쓸데없는 생각하지 마."
10045070-60 = "상대에게 집중해."
10045070-61 = "좋은 표정이야. 기운 차렸나 보네."
10045070-66 = "키쿄, 렌게. 모두 눈빛이 달라졌네."
10045070-67 = "각오를 굳힌 건 저희도 마찬가지어요!"
10045070-68 = "모두에게 보여드리는 거예요."
10045070-69 = "백화요란의 이름이 부끄럽지 않은…… 진검승부를!"
10045070-71 = "자! 그럼 경기를 시작하겠습니다!!"
10045070-75 = "[ns] \"선공을 가져간 건 나구사 팀이야!\""
10045070-79 = "나구사 선수의 스파이크 서브……! 과연 받아낼 수 있을까요!"
10045070-80 = "렌게! 부탁해!"
10045070-81 = "맡겨 달라고……!"
10045070-87 = "[ns] \"받아냈다?!\""
10045070-88 = "내가 이어갈게! 0식으로!"
10045070-89 = "좋아!"
10045070-90 = "0식? 무슨 뜻이죠?!"
10045070-95 = "차앗……!!"
10045070-100 = "……!!"
10045070-101 = "아앗, 키쿄 선수의 정확한 토스에 이은, 렌게 선수의 시간차 공격! #n나구사 선수, 걸려버렸습니다!"
10045070-103 = "당했다……!"
10045070-105 = "그럼 여기서는 소녀가……!"
10045070-110 = "꺄흥……!!"
10045070-112 = "이걸 받는다고……?!"
10045070-113 = "역시 유카리! 내 후배답네……!"
10045070-115 = "그대로 넘겨주겠어……!"
10045070-121 = "이번엔 내가……!"
10045070-122 = "부탁한다고!"
10045070-127 = "크읏……!"
10045070-128 = "나이스 리시브! 다음은 청춘 S다!"
10045070-129 = "처, 청춘……."
10045070-134 = "부끄러워?!"
10045070-135 = "처, 청춘S!!"
10045070-141 = "날카로운 스파이크가 직격! 막을 수 있을 것인가……?!"
10045070-143 = "……!!"
10045070-144 = "앗!!"
10045070-148 = "득점! 득점입니다!"
10045070-149 = "[ns] \"정확히 빈 곳에 꽂히는 나이스 스파이크였어!\""
10045070-150 = "키쿄…… 망설임은 사라졌어?"
10045070-151 = "……솔직해지기로 했거든."
10045070-152 = "부족한 나라도 믿고 응원해 주는 사람들이 곁에 있다는 걸 새삼 깨달았으니까."
10045070-153 = "[ruby=모두]백화요란[/ruby] 덕분이야."
10045070-154 = "그래. 이제야 백화요란의 작전참모답네."
10045070-156 = "아아, 이것이야말로 소녀가 꿈꾸던 단합대회! 여름의 청춘 로오~망스!"
10045070-157 = "하지만 승부는 승부. 봐주진 않을 거야."
10045070-158 = "이쪽이야 말로."
10045070-159 = "지금까지 아껴왔던 오른손의 힘을 한계까지 개방하겠어."
10045070-160 = "그러니까 그런 말은 묘하게 중2병 같다고……."
10045070-161 = "뭔가 중요한 이야길 하는 듯합니다만……."
10045070-162 = "어딘가 선수 여러분의 얼굴이 밝아진 것 같습니다!"
10045070-164 = "(열띤 접전은 듀스까지 이어지고…….)"
10045070-165 = "(어느덧 스코어 보드는 20대20을 표시하고 있었다.)"
10045070-175 = "아앗……! 득점! 득점입니다……!"
10045070-179 = "치열한 접전 끝에 매치 포인트를 가져간 팀은 바로……!!"
