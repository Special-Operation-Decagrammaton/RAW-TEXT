[translation]
1007005-1 = "비 내리는 날의 느와르"
1007005-3 = "(산해경에서의 행정 업무를 끝마치고, 돌아가는 길이었다.)"
1007005-6 = "[ns] \"어라, 하늘이……?\""
1007005-8 = "(쏴아아아아-!)"
1007005-12 = "[ns] \"우왓, 소나기가!\""
1007005-13 = "우산이 필요해 보이는군, 선생님?"
1007005-14 = "[s] \"미나!\""
1007005-19 = "[ns] \"비가 올 줄 알고 있었어?\""
1007005-20 = "훗…… 비가 올 때면, 옛 상처가 쑤셔서 말이지."
1007005-21 = "[s] (……무슨 소리인지 모르겠지만, 가만히 있도록 하자……)"
1007005-26 = "그러면, 갈까. 바래다주도록 하지. 선생님."
1007005-34 = "(그렇게, 미나와 함께 비 오는 산해경의 거리를 걸었다.)"
1007005-35 = "(미나의 기색은 어딘가…… 즐거워 보이기까지 했다.)"
1007005-36 = "[s1] \"혹시나 해서 물어보는 건데.\"\n[s2] \"미나는 비 오는 날을 좋아해?\""
1007005-39 = "음?"
1007005-40 = "그렇군…… 어느 쪽이냐고 한다면."
1007005-43 = "[wa:1400]― [log=미나]그래…… [wa:1700]비 오는 날의 [wa:600]경치는 좋아해.[/log]"
1007005-45 = "― [log=미나]여러 가지가 [wa:1000]심플하게 [wa:300]보이지.[/log]"
1007005-48 = "[wa:1600]― [log=미나]백과 [wa:600]흑.[/log]"
1007005-50 = "[wa:250]― [log=미나]느와르의 [wa:400]세계.[/log]"
1007005-53 = "[wa:800]― [log=미나]이 세계는,[/log]"
1007005-55 = "[wa:100]― [log=미나]지나치리만치 눈부실 정도의 광채로 이루어져 있지.[/log]"
1007005-58 = "[wa:900]― [log=미나]하지만, [wa:1100]사람들은 [wa:800]그 사실을 [wa:600]깨닫지 못해……[/log]"
1007005-60 = "[wa:200]― [log=미나]나라고 해서 [wa:600]예외는 아니지만.[/log]"
1007005-63 = "[wa:800]― [log=미나]하지만 느와르의 세계는 [wa:1900]그렇지 않아.[/log]"
1007005-65 = "[wa:200]― [log=미나]적어도 [wa:1300]명쾌하지.[/log]"
1007005-68 = "[wa:1400]― [log=미나]다만…… [wa:1200]그렇군.[/log]"
1007005-70 = "[wa:600]― [log=미나]적어도 [wa:700]우산만큼은…… [wa:2100]길을 잃지 않도록,[/log]"
1007005-73 = "[wa:700]― [log=미나]밝은색의 우산이 좋겠어.[/log]"
1007005-78 = "[ns3] \"확실히, 밝은색 우산 하나 정도는,\"\n[ns4] \"마련해 두면 편하긴 하겠네.\""
1007005-81 = "그렇지? 키사키 문주처럼 말이야."
1007005-82 = "[s] \"키사키가?\""
1007005-83 = "내가 현룡문에 들어가기로 한 건, 거기에 문주가 있었기 때문이야."
1007005-84 = "돈이나 명예 같은 건 아무래도 좋아. 그런 건 사라져 버리는 허상일 뿐이지."
1007005-85 = "하지만 문주의 하드보일드는…… 진짜라고!"
1007005-86 = "사람을 자연스레 무릎 꿇게 만드는 카리스마! 그러면서도 모두의 의견을 듣는 포용력!"
1007005-87 = "그런데도 품 안에 쏙 들어갈 것 같은 작은 체구! 최고 아니야?"
1007005-88 = "나뿐만이 아니라, 현룡문 부원들 대부분은 문주를 보고 모여 있는 거라고!"
1007005-92 = "[ns] (현룡문은 키사키의 팬클럽 같은 거였나……)"
1007005-93 = "크흠. 지금은 쿨하지 못했군. 실례했어."
1007005-94 = "아무튼, 인생에는 밝은색 우산이 필요해."
1007005-95 = "[s] \"그래. 비 오는 날도.\""
1007005-96 = "……뭘 좀 아는군. 선생님."
1007005-97 = "선생님과 이야기하다 보면, 가끔 신기해."
1007005-98 = "생각하지 않았던 부분까지 이야기하게 되고, 하지 못했던 말도 꺼내게 된단 말이야."
1007005-102 = "응……? 뭐 하는 거야, 선생님?! 왜 갑자기 우산을……?"
1007005-103 = "[s5] \"사실은 말이지. 나도 비 맞는 느낌이 좋거든.\"\n[s6] \"그러니까 비를 맞으며 춤을 추겠어. 노래를 부르면서.\""
1007005-106 = "……"
1007005-107 = "아, 그래."
1007005-108 = "이거, 옛날 영화에서 본 적이 있어."
1007005-109 = "뭐야, 선생님. 정말이지 제법 여러 가지를 알고 있잖아."
1007005-110 = "그래…… 정말 좋은 날이네."
1007005-111 = "탭 댄스 추기 좋은 날……!"
1007005-112 = "하하하. 아하하하하……!"
1007005-117 = "(미나는 환하게 웃으며 내게 달려왔다.)"
1007005-118 = "(쏟아지는 빗속에서, 우리는 그대로 한참이나 춤을 췄다.)"
