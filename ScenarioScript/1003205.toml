[translation]
1003205-1 = "격렬하게 둘이서 하네츠키!"
1003205-3 = "(무츠키의 부름에 못 이겨, 결국 하네츠키를 하기 위해 밖으로 나왔다.)"
1003205-4 = "뭐야~ 선생님, 내 승부를 피하지 않고 호기롭게 나타나다니."
1003205-5 = "그만큼 승부에 자신이 있다는 걸까~?"
1003205-6 = "[s] \"그렇다기보다…… 뭐, 무츠키가 부른 거니까.\""
1003205-7 = "아……. 그래? 흐응. 그런 거구나~ 내가 불러서……."
1003205-8 = "……하지만 선생님. 섣부르게 승부를 받아들인 걸 후회해도 나는 모른다구?"
1003205-9 = "이래 봬도 나, 하네츠키엔 엄청 자신 있으니까!"
1003205-10 = "이번 새해 기념 복주머니에서 손에 넣은, 이 특제 <최강의 하네츠키>라면!"
1003205-11 = "쿠흐흣! 선생님이 엉엉 울게 만들어줄 수도 있으니까……!"
1003205-12 = "[s1] \"<최강의 하네츠키>……?\"\n[s2] \"뭔가 특수한 기능 같은 게 있나……?\""
1003205-13 = "아핫~ 듣고 놀라지 말라구~?"
1003205-14 = "아핫~ 듣고 놀라지 말라구~?"
1003205-15 = "이 하네츠키에겐 특별한 기능이 있어. 그 기능은 무려……."
1003205-16 = "게임에서 진 패자는 승자의 말을 들어야 한다는 기능이야!"
1003205-17 = "[s] \"그냥 무츠키 양만의 독자 룰인 게……?\""
1003205-18 = "헤에~ 그런 건 아무래도 좋잖아~! 자! 선생님이 그렇게 여유를 부릴 수 있는 것도 지금뿐이란 말씀!"
1003205-19 = "선생님! 자! 승부야!"
1003205-20 = "[s] \"여유를 부린 적은 없지만……. 좋아! 그 승부! 받아주마!\""
1003205-23 = "(그렇게 무츠키와 뜨거운 하네츠키 배틀이 시작되었다!)"
1003205-24 = "그럼 나부터 시작할게."
1003205-28 = "이얍!"
1003205-32 = "(무츠키가 쥔 채는 공을 치지도 못하고 허공을 갈랐다.)"
1003205-36 = "[ns] \"…………어.\""
1003205-37 = "아핫~ 방금 건 연습이야! 진짜는 지금부터니까!"
1003205-38 = "다음엔 진심으로 갈게! 선생님!"
1003205-39 = "이얍!"
1003205-43 = "(또다시 무츠키의 채는 공을 치지 못한 채, 허공을 갈랐다.)"
1003205-47 = "[ns] \"무츠키, 이거…….\""
1003205-48 = "……아, 아니! 잠깐만! 한 번 더!"
1003205-49 = "이얍!"
1003205-53 = "(또다시 무츠키의 채는 공을 치지 못한 채- 이하 생략)"
1003205-57 = "…………."
1003205-58 = "아하핫~! 응~! 선생님……. 제법이잖아~!"
1003205-59 = "설마 이런 비장의 수를 숨겨두고 있었을 줄이야. 과연 그래서 여유가 넘쳤던 거구나."
1003205-60 = "이래서야 천하의 무츠키 쨩이라도 한 방 먹을 수밖에 없겠네! 응! 그런 거구나!"
1003205-61 = "[s] \"아무것도 안했지만 말이야.\""
1003205-62 = "흐응~ 장난감 가게에서 최강의 하네츠키라고 해서 사 왔지만, 아아~ 이거 불량품인가 보네."
1003205-63 = "아핫~ 그럼 어쩔 수 없지. 오늘 놀이는 없던 걸로……."
1003205-67 = "[ns3] \"무츠키. 룰은 룰이니까. 낙서 타임이야.\"\n[ns4] \"아니면 무츠키의 룰에 따라 패자는 승자의…….\""
1003205-68 = "아, 자, 잠깐! 선생님?"
1003205-69 = "아, 자, 잠깐! 선생님?"
1003205-70 = "타임! 타임이야! 승부는 아직 나지 않았어!"
1003205-71 = "응! 그래! 단숨에 끝나버리면 재미가 없으니까!"
1003205-72 = "모처럼 새해에 하네츠키를 하러 나왔으니 좀 더 많이 대결해서 승패를 겨뤄야 한다!"
1003205-73 = "……그렇게 생각하는데! 어때~ 선생님? 응? 선생님도 동의하지……? 으응~?"
1003205-74 = "[s] \"그야말로 무츠키다운 횡포…….\""
1003205-75 = "자! 다시! 다시 하는 거야! 흐흥~ 뭐, 첫 번째 정도는 내줄 수 있지만. 승부는 이제 막 시작된 거니까!"
1003205-76 = "다음번부터는 무자비하게 할 거니까! 선생님! 진짜진짜 각오하라구~!"
1003205-77 = "[s] \"좋아, 그 제멋대로의 승부! 까짓것 받아주마!\""
1003205-79 = "(그 뒤로도 무츠키와 하네츠키의 경기를 몇 번 치렀지만 그럴 때마다.)"
1003205-80 = "앗, 또, 또 안 맞았어!"
1003205-82 = "아앗~! 방금 분 바람 때문에 또 빗나가 버렸어!"
1003205-84 = "뭐야~ 어째서 선생님이 친 공은 하늘에서 방향을 바꾸는 건데~! 혹시 필살기 같은 걸 쓰는 거야~?"
1003205-87 = " (비기너스 럭인지, 아니면 단순히 운이 따랐던 것인지. 놀랍게도……)"
1003205-88 = " (무츠키와 벌인 경기 12번 중, 12번을 전부 승리했다.)"
1003205-91 = "말~도~안~돼~! 어째서 선생님! 그렇게나 강한 거야?!"
1003205-92 = "하네츠키 도구에, 뭔가 장치라도 되어있는 거 아냐? 선생님! 나 몰래 뭔가 한 거지?!"
1003205-93 = "[s] \"아니, 그럴 리가.\""
1003205-94 = "아아~ 이래선 선생님의 얼굴을 전부 먹물로 칠하려던 내 계획은 어떡하냐구~!"
1003205-95 = "으으으읏……!"
1003205-96 = "으음……. 음……."
1003205-100 = "아. 차라리 이렇게 되면……."
1003205-101 = "[s] (뭔가 불길한 느낌이 드는데…….)"
1003205-102 = "좋아! 한 번 더! 선생님. 한 번 더야! 다음번엔, 정말로 선생님이 분하다고 이게 말이 되냐고~ 잔뜩 우는소리를 하게 만들어줄 거니까!"
1003205-103 = "자, 선생님 선공이야. 이번엔 정말 각오해?"
1003205-104 = "진심을 낸 나, 정말 무서우니까~!"
1003205-105 = "[s] \"네네, 뭐, 그럼 어디…….\""
1003205-109 = "아핫~! 빈틈이다~!"
1003205-110 = "[s] \"무, 무츠키?! 저기요?!\""
1003205-111 = "선생님의 빈틈을 노려서……."
1003205-112 = "목덜미에 깨물기 공격이야~"
1003205-113 = "냐-암."
1003205-119 = "아하핫! 이번엔 선생님, 당황해서 공을 놓쳤네~"
1003205-120 = "후후, 선생님, 역시 여기가 민감하구나~ 얼굴이 새빨개졌어~!"
1003205-121 = "뭐어, 아쉽게 되었지만, 공을 놓쳤으니 이번엔 선생님의 패배인 거지?"
1003205-122 = "[s] \"잠깐! 방금 건 하네츠키적으로 룰아웃이니까!\""
1003205-123 = "후후~ 패자는 말이 없는 법~이라잖아?"
1003205-124 = "자아, 얍~!"
1003205-127 = "[wa:150]― 아핫~ [wa:700]아쉽게 되었네, [wa:1050]내 승리야~ [wa:1150]선생님!"
1003205-130 = "[wa:100]― 쿠후훗,"
1003205-132 = "― 마지막까지 [wa:500]필사적이었던 건 [wa:300]칭찬해주겠지만…."
1003205-135 = "― 승부의 세계란 [wa:800]냉정한 법이니까."
1003205-137 = "― 어쩔 수 없지? [wa:1350]쿠훗♪"
1003205-140 = "[wa:200]― 자, [wa:1100]뭘 그려볼까나~?"
1003205-142 = "― 동그라미? [wa:650]가위? [wa:850]아니면 다른 게 좋아?"
1003205-145 = "― 지금이라면 [wa:300]선생님의 취향,"
1003205-147 = "― 뭐든지 [wa:350]맞춰줄 수 있다고?"
1003205-150 = "[wa:100]― 앗, [wa:850]그치만 생각이 바뀌었어."
1003205-152 = "― 평범한 걸로는 [wa:750]살짝 부족하니까……."
1003205-155 = "― 이대로 얼굴에 [wa:1600]잔뜩 [wa:350]칠해버려야지!"
1003205-158 = "이것으로 낙서 완료! 그 결과는……."
1003205-164 = "푸흡, 아핫, 아하하핫! 선생님의 얼굴, 엄청난 상황이 되어버렸네! 푸흐흣, 아~ 웃겨!!"
1003205-165 = "[s] \"다, 다음이다! 다음번엔 역전해주겠어!\""
1003205-166 = "으응~? 아니, 아닌걸. 내가 이겼으니. 오늘 경기는 이것으로 종료야!"
1003205-167 = "[s] \"앗! 치사해!\""
1003205-168 = "어라아~? 치사하다니."
1003205-169 = "뭐, 원한다면 아까와 같은 공격. 계속해줄 수 있는데?"
1003205-170 = "아니면 뭐야, 선생님은 계속 그런 걸 당하고 싶다는 이야기?"
1003205-171 = "[s] \"아니, 그건…….\""
1003205-172 = "아하하핫! 농담이야! 부끄러워하는 선생님도 귀엽네! 쿠흐흣!"
1003205-173 = "그래도 오늘 놀이는 이걸로 끝! 재미있었으니까. 난 만족했어!"
1003205-174 = "지금부터는 승자로서 승자의 권리를 행사할 거니까! 물론 선생님에게 거부권은 없어!"
1003205-175 = "[s] \"승자의 권리라니?\""
1003205-176 = "그건 바로……."
1003205-182 = "얼굴이 엉망이 된 선생님과 같이 산책하는 거야!"
1003205-186 = "자, 선생님, 가자!"
1003205-188 = "(그렇게 해맑게 웃는 무츠키의 손을 잡고 행사장의 근처를 산책했다.)"
1003205-189 = "(대체 얼굴이 어떤 상황인지는 알 길이 없었지만, 즐겁게 웃는 무츠키와 걷고 있는 와중에 주변 사람들에게 무진장 주목받았다.......)"
