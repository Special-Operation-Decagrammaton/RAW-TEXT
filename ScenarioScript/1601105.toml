[translation]
1601105-1 = "자기관리"
1601105-3 = "(대운동회 당일. 아직 점심시간이 되기 전.)"
1601105-4 = "(벤치 한쪽에서 싸 온 도시락을 부스럭거리던 하스미를 발견했다.)"
1601105-8 = "[ns1] \"하스미?\"\n[ns2] \"어라. 혼자 먹는 거야?\""
1601105-13 = "……음?"
1601105-14 = "아. 선생님……. 이런 곳에서 또 뵙는군요."
1601105-15 = "네. 아무래도 진행하는 역할을 겸하고 있다 보니, 막상 점심시간에는 다른 학생들을 안내해 줘야 하니까요."
1601105-16 = "아마 그 와중에 시간을 따로 내는 건 어려울 것 같아서, 이렇게 미리 해결하려고 했습니다만……."
1601105-20 = "……선생님? 왜 그렇게 빤히 보시는지……."
1601105-21 = "……네?"
1601105-22 = "아, 이거 말씀이신가요."
1601105-26 = "보시다시피 고구마와 삶은 계란, 토마토입니다."
1601105-27 = "으음……."
1601105-28 = "역시 조금 전에 보내 드린 모모톡 때문에 마음에 걸리시는 모양이군요. 죄송합니다. 제가 또 괜한 짓을……."
1601105-29 = "[s3] \"이런 날인데도 다이어트 식단인 거야?\"\n[s4] \"힘들 것 같은데……. 괜찮아? 이런 걸로?\""
1601105-32 = "괜찮냐고 물으신다면 물론 열량 상으로는 그렇게 큰 문제가 없습니다."
1601105-33 = "오히려 이런 날이니 평소보다 더 효과적인 다이어트가 될 거라는 기대도 어느 정도는 하고 있고요."
1601105-34 = "다만……."
1601105-35 = "[s] \"다만……?\""
1601105-42 = "으으, 배고프다. 조금만 있으면 점심시간이네!"
1601105-43 = "빨리 고기 먹고 싶다, 고기!!"
1601105-44 = "너 진짜 고기 좋아한다."
1601105-45 = "나는 이런 날이라서 파르페 같은 걸로 잔뜩 챙겨왔는데."
1601105-46 = "웬 파르페? 뭐, 뭐야 그 양은!? 너 그러다 살찐다!?"
1601105-47 = "무슨 소리야?"
1601105-48 = "이렇게 뛰는 날인데! 이런 날이야말로 이런 거 먹으라고 있는 날이잖아!"
1601105-49 = "그럼 더 고기 아냐?"
1601105-50 = "아니라니까! 파르페라고!!"
1601105-51 = "고기!!"
1601105-52 = "파르페!!"
1601105-56 = "고기고기고기고기고기고기!!"
1601105-57 = "파르페파르페파르페파르페!!"
1601105-62 = "…………."
1601105-63 = "[s5] \"과연. 그런 의미였군. 날이 날이니까…….\"\n[s6] \"평소보다 여기저기서 유혹이 많이 들어오는구나.\""
1601105-66 = "물론 주변 상황이 어떻든 이건 저 스스로와의 싸움이고, 이런 걸로 흔들린다는 것 자체가 부끄러운 일입니다만……."
1601105-67 = "아무래도 아직 많이 부족한 모양입니다. 부끄럽네요. 면목 없습니다."
1601105-68 = "……네? 그러고 보니 저번에 만들었던 레몬 벌꿀 절임은 어디 있냐고요?"
1601105-69 = "아아. 그것들은 모두 다른 정의실현부 부원들을 위한 것이었습니다. 저는 먹을 생각이 없었어요."
1601105-70 = "아시다시피 벌꿀은 열량이 굉장히 많기 때문에, 그런 걸 먹어버리면 지금 제가 이러고 있는 의미가……."
1601105-71 = "[ns] \"…….\""
1601105-78 = "[ns7] 받았던 레몬 벌꿀 절임을 건네준다.\n[ns8] \"그럼 조금만 같이 먹도록 할까?\""
1601105-83 = "……!? 서, 선생님!? 그, 그게 무슨 말씀……."
1601105-84 = "……네? 하나를 나눠 먹는 거면, 조금이니까 괜찮을지도 모른다고요?"
1601105-85 = "그, 그야 그럴 수도 있지만……. 이건 선생님을 위해 드린 것인데……."
1601105-86 = "아니, 그보다도 이미 조금 드시던 걸……!"
1601105-87 = "……아. 아뇨, 결코 싫다는 의미로 드린 말씀은 아닙니다만……! 그, 그게……."
1601105-88 = "역시 뭐랄까, 이건 결국 그……. 어떻게 보면……. 마치……!"
1601105-92 = "……하아."
1601105-93 = "아닙니다. 또 저도 모르게 혼자서 이상한 생각을 한 것 같군요."
1601105-94 = "선생님의 순수한 호의에 쓸데없는 생각을 덧붙이다니……."
1601105-95 = "감사합니다. 그럼 다른 분도 아닌 선생님의 권유시니, 조금만 먹도록 하겠습니다."
1601105-96 = "아주 조금만……."
1601105-105 = "[ns9] \"……하스미?\"\n[ns10] \"뭔가 반응이…….\""
1601105-108 = "……음……."
1601105-113 = "……으으음……!"
1601105-114 = "퍽퍽하고 신 것들만 먹다가 이렇게 달콤한 게 갑자기 들어오니 입안이 찌릿하네요……!"
1601105-115 = "이 감각, 정말 오랜만에 느껴보는 이 미각……."
1601105-120 = "더는 참을 수 없어요……!!"
1601105-128 = "[ns11] \"……하, 하스미? 그걸로 괜찮은 거야?\"\n[ns12] \"하스미. 잠깐만. 그거 그래도 다 먹으면 양이 꽤……!\""
1601105-139 = "……후우우우-. 정말이지…… 이제야 좀 살 것 같습니다……."
1601105-140 = "저도 모르게 다 먹어 버렸습니다만……."
1601105-144 = "………………."
1601105-145 = "……어라……."
1601105-146 = "……서, 선생님? 그러니까……. 어……. 이건……."
1601105-147 = "그, 그게…………."
1601105-151 = "……죄송합니다…………."
1601105-153 = "(좋은 게 좋은 거라며 하스미를 달래 준 뒤, 자리를 빠져나왔다.)"
