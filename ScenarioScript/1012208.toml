[translation]
1012208-1 = "언젠가의 나에게"
1012208-2 = "[ns] \"이쪽이라고 했지……\""
1012208-4 = "선생님~ 여기야!"
1012208-5 = "아하하, 와줘서 고마워."
1012208-6 = "선생님에게 보여주고 싶은 장소가 있어서……"
1012208-7 = "[s] \"미카가 보여주고 싶은 장소라. 궁금한데.\""
1012208-8 = "응! 그런데 조금 걸어야 해."
1012208-9 = "여기서는 살~짝 거리가 있어서……"
1012208-10 = "밤 산책 좋아하니까 괜찮다고?"
1012208-11 = "헤헤, 다행이네."
1012208-12 = "그럼……"
1012208-17 = "조금, 걸을까?"
1012208-19 = "(그렇게 미카와 함께 밤의 해변을 산책했다.)"
1012208-22 = "아, 그러고 보니……"
1012208-23 = "……"
1012208-24 = "선생님, 미안해."
1012208-25 = "[s] \"응?\""
1012208-26 = "그, 갑자기 잠들어서 선생님이 업어서 데려다줬던 때……"
1012208-27 = "[s1] \"아아…… 괜찮아. 엄청 힘들었지만.\"\n[s2] \"아아…… 괜찮아. 깃털처럼 가벼웠거든.\""
1012208-28 = "저, 정말??"
1012208-29 = "무, 무거웠나…… 조금 충격받았을지도……"
1012208-30 = "장난…… 이라고?"
1012208-31 = "우우!! 너무해! 나 진짜 심각해질 뻔했거든?!"
1012208-32 = "……무, 물론 내가 잘못한 건 맞지만……"
1012208-33 = "으, 응??"
1012208-34 = "그, 그래? 가벼웠다면 다행이지만……"
1012208-35 = "아, 아니…… 다행은 다행인데……"
1012208-36 = "……아무튼 미안. 그러면 안 됐는데……"
1012208-37 = "또 선생님에게 폐를 끼쳤네."
1012208-38 = "이제 어른 흉내 안 낸다고 약속하면 괜찮다고?"
1012208-39 = "……네에…… 그런 거 이제 안 할게요."
1012208-40 = "억지로 그러지 않아도……"
1012208-41 = "솔직하게 이야기하면 된다는 거 알았으니까. 응."
1012208-42 = "[ns] \"그때의 고민들은 좀 풀렸을까?\""
1012208-44 = "풀렸…… 다고 할 수 있나? 어……"
1012208-45 = "일단 나 나름대로 생각은 많이 해봤는데……"
1012208-49 = "도착했어, 선생님."
1012208-50 = "바로 요 앞이니까."
1012208-51 = "여기여기……!"
1012208-57 = "[ns] \"아름다워……!!\""
1012208-58 = "응, 그치!!"
1012208-59 = "생각 정리할 겸 걷다가 발견한 곳이야!"
1012208-60 = "뭔가 마음이 탁 트이는 기분~"
1012208-61 = "후후, 그래서 선생님에게도 보여주고 싶었어."
1012208-62 = "자, 자! 이쪽으로 와서 앉아. 선생님."
1012208-70 = "평화롭다아……"
1012208-71 = "이러고 있으니까, 왠지 고민도 날아가는 것 같은……"
1012208-72 = "아……"
1012208-73 = "서, 선생님! 저기……!!"
1012208-74 = "[ns] \"저건……?!\""
1012208-79 = "와아…… 유성이 엄청나게……"
1012208-80 = "……예쁘다…… 너무너무 예쁘다……"
1012208-81 = "[ns] \"고마워, 미카.\""
1012208-82 = "응??"
1012208-83 = "[ns3] \"미카가 데려와 준 덕분에,\"\n[ns4] \"이런 멋진 광경을 볼 수 있었으니까.\""
1012208-86 = "……"
1012208-89 = "[wa:860]― [log=미카 수영복]저기, 선생님.[wa:450] [/log]"
1012208-91 = "― [log=미카 수영복]나…… [wa:2580]이런 광경을 [wa:950]선생님과 [wa:600]볼 수 있어서 [wa:1820]다행이야.[/log]"
1012208-94 = "[wa:2060]― [log=미카 수영복]걱정거리도……[/log]"
1012208-96 = "― [log=미카 수영복]앞으로의 고민도……[/log]"
1012208-99 = "― [log=미카 수영복]불안함도…… [wa:2170]아직은, 남아 있어.[wa:1470] [/log]"
1012208-102 = "[wa:550]― [log=미카 수영복]그래도……[/log]"
1012208-104 = "― [log=미카 수영복]이렇게 별이 가득한 하늘을 보고 있으면,[wa:730] [/log]"
1012208-107 = "― [log=미카 수영복]……전부, [wa:1590]사소한 게 [wa:680]아닐까 [wa:1850]하고.[/log]"
1012208-109 = "― [log=미카 수영복]그런 생각이 들어.[/log]"
1012208-112 = "[wa:920]― [log=미카 수영복]선생님, [wa:1320]말해 줬었지.[wa:40] [/log]"
1012208-115 = "― [log=미카 수영복]지금의 [wa:1770]이 순간이, [wa:3520]앞으로도 [wa:1000]계[wa:1070]속…… [/log]"
1012208-117 = "― [log=미카 수영복]나를 지탱해 줄 거라고. [wa:2030]응. [/log]"
1012208-120 = "[wa:530]― [log=미카 수영복]그러니까……[/log]"
1012208-122 = "― [log=미카 수영복]나도, [wa:2890]행복해질 거야.[/log]"
1012208-126 = "……"
1012208-127 = "마, 말해버렸다아……"
1012208-128 = "[ns] \"미카는 행복해질 거야.\""
1012208-132 = "[ns] \"그렇게 믿어.\""
1012208-133 = "그, 그런……"
1012208-134 = "정말…… 그런 부끄러운 이야기를 아무렇지도 하는 게 어른인 건지……"
1012208-139 = "고마워, 선생님."
1012208-140 = "나, 행복해질래. 응."
1012208-141 = "그러니까…… 선생님도 도와줄 거지……?"
1012208-142 = "[s5] \"응, 물론이지.\"\n[s6] \"계속, 옆에서 지켜볼 테니까.\""
1012208-145 = "아하하, 또 진지한 얼굴로 그렇게 말하고~☆"
1012208-146 = "……"
1012208-150 = "엉뚱하고, 때론 바보 같고, 다정한 선생님."
1012208-154 = "그럼, 하고 싶은 말도 어느 정도는 했구……"
1012208-159 = "계속 여기 있다간, 나쁜 아이가 될 것 같으니까……"
1012208-160 = "그전에 돌아갈까☆"
1012208-164 = "[ns] \"응? 무슨 말이야……?\""
1012208-165 = "아하하, 얼른 가자! 선생님~!"
1012208-167 = "(미카와 함께 해변가를 걸어 돌아왔다.)"
1012208-173 = "(돌아오는 길 내내 웃고 떠들던 미카는,)"
1012208-174 = "(이미 조금은 행복해 보였다.)"
