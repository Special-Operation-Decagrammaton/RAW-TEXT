[translation]
10031005-1 = "프롤로그;대면"
10031005-2 = "……크큭. 크크큭."
10031005-4 = "만마전 집무실"
10031005-6 = "크크크큭. 키키키킷………"
10031005-10 = "키키키킷! 환영한다! 샬레의 선생이여! 우리 만마전에 잘 와주었다!"
10031005-11 = "[s] \"아, 응. <때가 되었으니 만마전에서 기다리고 있겠다>라는 연락을 받았으니까.\""
10031005-15 = "[ns] \"근데 정작 때가 되었다니, 무슨 소리인지 모르겠어서…….\""
10031005-16 = "키시싯. 그래. 이해하고 있다."
10031005-17 = "이 몸의 연락을 받고 난 뒤, 선생은 잠시 고민했겠지."
10031005-18 = "결국 이러한 날이 오고야 만 것인가. 혹시 전달받은 모모톡의 표면적인 메시지 외에도…… 그 안에 숨겨진 의미가 있는 건 아닐까? 거기에 내가 미처 파악하지 못한 속내가 있는 건 아닐까……?"
10031005-19 = "그렇다면 이대로 안일하게 만마전으로 발을 움직이기 전에 충분히 고민을 해봐야 하는 것이 아닐까? 등등."
10031005-20 = "[s] \"아니, 딱히 그런 생각을 했던 건…….\""
10031005-21 = "암, 그럴 수 있지. 나 마코토 님은 거기까지도 충분히 이해하고 있다!"
10031005-22 = "뭇 조직의 우두머리로서, 특히나 샬레라는 이름을 그 어깨에 짊어지고 있는 자로서 신중을 기하는 바로 그 모습……! 이 몸은 싫어하지 않아."
10031005-23 = "키키키킥! 아니, 오히려 합격점이라 할 수 있겠지!"
10031005-24 = "그만큼 오늘 이루어지는 우리의 만남이 가져올 여파는 갑작스럽고 충격적이며── 또한 극적일 테니까!"
10031005-25 = "[s3] \"저…… 감사합니다……?\"\n[s4] \"저기 마코토, 여전히 무슨 소리인지 도통………\""
10031005-28 = "그래! 여기까지 온 이상 무엇을 숨기랴!"
10031005-29 = "오늘 이 몸이 선생을 이 자리로 부른 것은…… 저번에 제안한 것에 대한 대답을 듣고자 부른 것이다!"
10031005-30 = "키키킷! 과연 선생은 이 몸의 매력적인 권유에 대해, 어떠한 답을 들려줄 생ㄱ………!"
10031005-31 = "마코토 선배~ 이부키. 등에 올라갈래~"
10031005-32 = "아아, 그래. 이부키. 잠시 기다려라."
10031005-39 = "[ns] \"………….\""
10031005-40 = "………흠? 어디까지 이야기했었지?"
10031005-41 = "네~ 저! 저! 저~ 저요~! 선배가 저번에 했던 매력적인 제안에 대한 대답을 듣고자 한다. 까지 말했습니다~"
10031005-42 = "아, 그래. 맞아. 나이스 어시스트다. 치아키."
10031005-43 = "옙~"
10031005-44 = "흠흠. 다시 본론으로 돌아와서……."
10031005-45 = "그래서 선생이여! 이제 슬슬 그 제안에 대한 대답을. 선생, 본인의 입으로 듣고자 한다!"
10031005-46 = "영차. 영차."
10031005-51 = "[ns5] \"마코토가 제안해 준 건에 대한 대답……?\"\n[ns6] (그간 만마전에서 들어온 요청이 많아서 그런지, 뭘 말하는 건지 모르겠는데.)"
10031005-54 = "아아. 그런가. 선생의 그 표정."
10031005-55 = "제아무리 대답을 듣고자 하여 불렀다고는 하나, 얼굴을 마주하자마자 다짜고짜 본론부터 요구하다니……."
10031005-56 = "이것은 역시 상호 간의 예의에 어긋나는 것이 아닌가? 라고 되묻고 싶어 하는 표정이군."
10031005-57 = "[s] \"으응……?\""
10031005-58 = "아니요. 마코토 선배."
10031005-59 = "제가 보기엔 마코토 선배가 멋대로 흐름을 타고 떠드는 걸 보고 그냥 어리둥절하신 느낌인데요."
10031005-60 = "이런이런. 이로하. 뭘 모르는구나."
10031005-61 = "키키킷. 선생의 저 눈을 보아라. 저것은 리더의 눈. 누군가의 머리 위에 서는 자의 시선이다."
10031005-62 = "저런 눈동자를 가진 자가, 그런 어리숙한 생각 따위를 품고 있으려고."
10031005-63 = "이 하누마 마코토 님은, 만마전의 리더로서 이미 꿰뚫어 보았단 말이다! 저 뜨거운 시선이 품고 있는 의미를 말이다!"
10031005-64 = "……그렇다고 하네요. 선생님."
10031005-65 = "[s] \"으응, 이로하. 그냥 그런 걸로…….\""
10031005-66 = "네네, 알겠습니다. 하아……."
10031005-68 = "키키킷!"
10031005-69 = "물론! 선생의 그런 마음 정도야 이 몸도 이해하고 있다마다!"
10031005-70 = "그러니 이 마코토 님도 나름대로 절차와 의식, 관습과 관례, 순서라는 것을 존중하는 마음으로……."
10031005-71 = "이 자리에서 새롭게 다시금 그대에게 제안하도록 하마."
10031005-72 = "자아, [USERNAME] 선생이여……!"
10031005-76 = "우리 만마전과…… 나아가 이 마코토 님과 손을 잡지 않겠나!"
10031005-77 = "영차…… 이렇게 해서, 영차……"
10031005-83 = "[ns] \"………아, 뭔가 했더니 그쪽 이야기였구나.\""
10031005-84 = "네네, 그럴 줄 알았지만요."
10031005-85 = "와, 샬레와의 공동작업! 선생님이랑 편을 먹는다니! 좋네요! 그거!"
10031005-86 = "크크큭! 새삼스레 말할 필요도 없겠지만. 우리 만마전은 강대하다!"
10031005-87 = "그런 만마전이 선생이라는 전력을 얻게 된다면, 그야말로 천군만마를 얻는 것이나 다름없을 터!"
10031005-88 = "우리가 함께 손을 잡기만 한다면……! 이 키보토스 전체를 손에 넣는다는…… 그 누구도 해내지 못한 위업을 달성하는 것도 충분히 가능할 테지!"
10031005-89 = "키키킷! 그렇게 되면 내 선생에게 약속하겠다………"
10031005-90 = "우리가 함께 키보토스를 손에 넣은 바로 그날……!"
10031005-91 = "이 하누마 마코토 님께서는 샬레의 선생, 그대에게 이 키보토스의 절반을……!"
10031005-92 = "절반을……."
10031005-93 = "절……"
10031005-94 = "…………음."
10031005-95 = "……아니, 기세로 말해버렸지만, 절반이라고 하면 역시 너무 많지 않……나? 아무리 구두로만 이야기하는 약속일지라도, 역시 그전에 차분히 검토해 볼 필요가……."
10031005-96 = "그, 그래……! 완전히 절반까지는 아니더라도! 적어도 반올림하면 한없이 절반에 가깝지 않을까? 하는 정도만큼의 키보토스를 샬레에 건네주마……!"
10031005-97 = "자, 선생이여! 이 위대한 마코토 님의 제안이 어떠한가!"
10031005-101 = "[ns] \"어…….\""
10031005-103 = "…………"
10031005-105 = "영차~"
10031005-107 = "아하하핫! 처음엔 기세를 타고 호기롭게 절반을 주마! 라고 하려고 했다가, 다시 생각해 보니 조금 아까운 생각이 든 나머지, 말을 빙빙 돌리면서 확언은 피하는 그 모습!"
10031005-108 = "역시 마코토 선배답네요! 그치? 이로하 쨩?"
10031005-109 = "……지적하는 것도 부끄러우니까. 굳이 태클 걸지 않고 있던 거라구요. 치아키."
10031005-111 = "에이이잇! 시끄럽다! 거기! 지방 방송은 중단하도록!"
10031005-112 = "그보다도 선생, 대답을………"
10031005-113 = "영! 차! 마코토 선배~ 이부키! 등에 다 올라왔어~!"
10031005-114 = "아구구~ 응~ 이부키! 장해라~!"
10031005-115 = "와아~! 마코토 선배가 뭐라고 떠들건 말건, 등반가로서 선배의 등허리를 정복한 이부키 쨩! 역시나 그 귀여움은 오늘도 백만 볼트!"
10031005-116 = "이건 반드시 기록해야만 한다고 저, 모토미야 치아키! 만마전의 서기로서 책임감이 불을 뿜기 시작……!"
10031005-117 = "자자! 마코토 선배도! 이부키도 치-즈!"
10031005-118 = "치~즈~"
10031005-119 = "크크큭. 치즈다……."
10031005-125 = "치아키. 그 사진, 이따가 저도 뽑아주세요."
10031005-126 = "이로하 쨩의 부탁이라면 물론이지~!"
10031005-127 = "키키키킷. 그래서 [USERNAME] 선생. 대답은……?"
10031005-128 = "[s7] \"모처럼 제안해 준 건 고마운데 말이야…….\"\n[s8] \"미안, 아쉽지만 거절해 둘게.\""
10031005-134 = "뭣……이……?"
10031005-135 = "어, 어째서냐…… 선생. 이 마코토 님의 제안만큼이나…… 매력적인 기회는 또 달리 없을 터인데!"
10031005-136 = "뭔가 피치 못할 사정이라도 있는 것인가? 아니면 무언가 조건에서 부족한 점이라도──"
10031005-137 = "아하하핫! 역시 절반 준다고 했다가 말을 바꿔서 그런 거 아닐까요?"
10031005-138 = "여, 역시 그런가………!"
10031005-139 = "아니, 그렇진 않을 거로 생각하는데요."
10031005-140 = "하지만 이로하! 그게 아니라면 대체 무슨 이유 때문에……."
10031005-141 = "[s] \"응, 오늘은 샬레 대청소가 있는 날이거든. 덕분에 여유가 없어. 미안.\""
10031005-143 = "와~ 마코토 선배~ 높다~!"
10031005-144 = "………(생글생글)"
10031005-145 = "…………"
10031005-146 = "………………."
10031005-147 = "그럼 어쩔 수 없겠군."
10031005-148 = "예정이 있는 사람에게 이쪽의 요구를 무리하게 밀어붙일 수는 없지. 오늘은 일단 넘어가기로 할까."
10031005-149 = "어, 마코토 선배는 정말 그걸로 납득하는 건가요?!"
10031005-150 = "응? 무슨 소리를 하는 게냐. 이로하."
10031005-151 = "키킷. 이쪽의 요구를 일방적으로 밀어붙이기만 해서야, 단순한 폭군에 지나지 않는 법."
10031005-152 = "그러니 참된 리더란 융통성 있게, 당사자의 여건과 의지도 존중하고 중히 여기는 법이다."
10031005-153 = "그 상대가 선도부만 아니라면 말이지……!"
10031005-154 = "중요한 것이니, 기억해 두도록. 이로하. 키키킷."
10031005-155 = "아…… 네……."
10031005-156 = "아하핫! 마코토 선배답네~! 응! 사진으로 찍어둘까!"
10031005-166 = "흥. 말을 빙빙 돌려가면서까지 회유하려고 들다니, 딱히 의미 없지 않아?"
10031005-170 = "다들 잊고 있는 모양인데. 진심으로 샬레의 선생을 아군으로 만들고 싶다면, 가장 확실한 방법이 여기에 있잖아?"
10031005-171 = "뭣, 사츠키…… 설마……! 네 녀석……!"
10031005-172 = "그래, 맞아. 마코토 쨩. 번거로운 수단을 쓸 필요 없이 내가 이끄는 NK울트라 프로젝트의 힘을 사용한다면……."
10031005-173 = "샬레의 선생을 설득하고 자시고 할 것도 없이 단숨에 이쪽의 편으로 만들 수 있으니까!"
10031005-174 = "후후후! 선생! 이걸 보도록 해!"
10031005-179 = "자아, 빠져든다…… 당신은 지금부터 점점 만마전에게 충성하고 싶은 마음이 강해진다~"
10031005-180 = "동시에 얼마 전에 만마전 근처에 생긴 디저트 가게에서 푸딩을 사 오고 싶어진다~~"
10031005-184 = "[ns] \"어, 으으음…… 그, 그런 느낌이 드는 것 같기도……?\""
10031005-188 = "후후, 봐봐. 효과가 있지?!"
10031005-189 = "사츠키 선배~ 이부키도 할래~"
10031005-190 = "동전을 들고~ 흔들흔들~ 선생님은 점점…… 이부키랑 놀아주고 싶어집니다~!"
10031005-191 = "어머, 이부키 쨩. 능숙한걸?"
10031005-192 = "장래에 우리 NK울트라 프로젝트를 이끌어 나갈 기대주로서의 가능성이 엿보이는 멋진 동작이야!"
10031005-193 = "아, 멍하니 있을 게 아니라, 치아키!"
10031005-195 = "네엡~! 셔터 찬스! 만마전의 서기로서 놓칠 수 없습니다요~!"
10031005-209 = "……보다시피 만마전은 대충 이런 느낌이거든요."
10031005-210 = "어째…… 막상 선생님이 보고 계시니……. 창피하네요."
10031005-211 = "[s] \"그래? 나는 평화롭고 좋은 것 같은데.\""
10031005-212 = "평화……인가요."
10031005-213 = "뭐, 확실히 평화롭긴 하네요……."
