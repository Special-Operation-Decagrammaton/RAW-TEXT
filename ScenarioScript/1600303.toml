[translation]
1600303-1 = "눈이 멀 정도로 빛나게"
1600303-2 = "오셨군요, 선생님. 여깁니다. 스즈미입니다."
1600303-3 = "목적지를 말씀해주십시오. 에스코트해 드리겠습니다."
1600303-5 = "……음음. 그렇군요. 알겠습니다."
1600303-6 = "꽤 거리가 있는 곳이로군요. 하지만 걱정 마십시오. 제가 책임지고 안전하게……"
1600303-7 = "……!"
1600303-8 = "[s] \"……스즈미?\""
1600303-9 = "위험합니다, 선생님! 어서 이쪽으로!! 차 뒤로 엄폐하십시오!"
1600303-10 = "전방 섬광탄!!"
1600303-12 = "……펑! 삐이이이이잉-!!"
1600303-13 = "꺄아아악-! 가, 갑자기 뭐야!? 눈이……! 눈앞이 안보여!"
1600303-14 = "정신없어! 으으, 어지러워……!"
1600303-15 = "대, 대체 무슨 일이야 이게!?"
1600303-16 = "이 틈입니다. 어서 자릴 피하시죠! 이쪽으로!!"
1600303-19 = "……후우. 일단은 위험지역은 벗어났군요."
1600303-20 = "설마 대낮부터 그런 식으로 선생님을 노리다니…… 대범하기 짝이 없습니다."
1600303-21 = "네? 일반 학생들이지 않았냐고요? 그건 안이한 발상입니다. 선생님."
1600303-22 = "아까 학생들이 휴대폰을 가슴 높이로 드는 것을 보지 못하셨습니까?"
1600303-23 = "분명 선생님의 사진을 찍어 상부에 보고하려던 행동이었을 것입니다."
1600303-24 = "[s1] \"그렇게 보이진 않았는데……\"\n[s2] \"그게 정말이야?\""
1600303-25 = "물론 확실하진 않지만, 가능성은 충분하죠."
1600303-26 = "물론 확실하진 않지만, 가능성은 충분하죠."
1600303-27 = "선생님이 좋은 분이시라는 건 알고 있지만, 그래도 전술시엔 뭐든 의심해봐야 하는 법."
1600303-28 = "지금 저는 선생님을 에스코트하며 목적지까지 가는 작전 중이니까요."
1600303-30 = "……!! 아닛, 저기 또 수상한 움직임을 보이는 인물이!"
1600303-31 = "섬광탄 투척!!"
1600303-33 = "파앙! 삐이이이이이-!!"
1600303-34 = "으억!! 깜짝이야!!"
1600303-35 = "이게 뭐야!! 눈앞이 아른거려!!"
1600303-36 = "역시 사람이 많은 곳은 위험하군요! 계속해서 이동해야 할 것 같습니다!"
1600303-37 = "따라오시죠, 이쪽으로!"
1600303-40 = "하아, 하아……"
1600303-41 = "괜찮으십니까, 선생님? 여기라면 괜찮습니다."
1600303-42 = "인적도 적고…… 누가 있더라도 감시하기 편하겠지요."
1600303-43 = "혹 있더라도 제압하기 수월하고 말입니다."
1600303-44 = "……네? 그렇게까지 하지는 않아도 될 것 같으시다고요?"
1600303-45 = "안 됩니다, 선생님. 저는 오늘 선생님을 에스코트 해드리기로 했으니까요."
1600303-46 = "선생님께 무슨 일이 생기다면 그건 전적으로 저의 책임…… 한 치도 용납할 수 없습니다."
1600303-47 = "그, 그런데 갑자기 왜 그런 말을……?"
1600303-48 = "혹시 제 행동이 조금 부담스러우셨습니까?"
1600303-49 = "[s3] \"마음은 고맙지만 긴장하지 마.\"\n[s4] \"편하게 생각해줘. 같이 산책한다는 정도로.\""
1600303-50 = "그, 그렇게 말씀하시니 사실 되려 더 긴장이 되는데……"
1600303-51 = "그, 그렇게 말씀하시니 사실 되려 더 긴장이 되는데……"
1600303-52 = "……하지만 감사합니다. 네. 저도 조금은 경계수위를 조절해보겠습니다."
1600303-53 = "이 길로 쭉 나가면 금방 도착할 테니, 가시죠. 선생님."
1600303-55 = "[s] (스즈미를 따라간다.)"
1600303-58 = "……도착입니다. 다행히 그간 정말로 아무 일도 없었군요."
1600303-59 = "선생님 말씀대로, 오늘은 제가 좀 더 긴장했던 것 같습니다."
1600303-60 = "……으음. 혹시 괜한 에스코트였던 걸까요? 오히려 저 때문에 더 오래 걸리신 듯한……"
1600303-61 = "네? 어느 정도 예상하신 일이라고요? 그럼 어째서 굳이……?"
1600303-62 = "……? 그냥 오는 길을 같이 걷고 싶어서……?"
1600303-63 = "그, 그런……! 이러시면 곤란합니다, 선생님! 자경단은 데이트 상대 같은 게 아닙니다!"
1600303-64 = "무, 물론 아니! 그렇다고 부르지 말아 달라는 건 아니지만……!"
1600303-65 = "처음부터 그렇게 말해 주셨으면 저도 마음가짐부터 다르게……!"
1600303-66 = "아, 아니 그게 아니고! 아무튼 안 됩니다. 이런 방식은!"
1600303-67 = "……"
1600303-68 = "……다시."
1600303-69 = "나중에 다시 요청해주시길 부탁드립니다. 선생님."
1600303-70 = "보호가 필요한 에스코트가 아니라면, 그냥 동행이라면 그 땐 저도 다르게 할 테니……"
1600303-71 = "그 때는…… 지금보단 좀 더 잘 할 수 있을 것입니다. 잘해보겠습니다."
1600303-72 = "……네. 알겠습니다."
1600303-73 = "그럼…… 그렇게 알고 있겠습니다……!"
1600303-76 = "(그렇게 날 내버려둔 채, 스즈미는 재빨리 어딘가로 사라져버렸다.)"
1600303-77 = "(뛰는 모습은 전에도 봤던 것처럼 조금 어색해 보였다.)"
