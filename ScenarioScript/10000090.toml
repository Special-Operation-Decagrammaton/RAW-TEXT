[translation]
10000090-1 = "제9화;[ruby=닌자]소녀[/ruby]의 꿈"
10000090-2 = "(백귀야행 상점가의 상인회장 냥텐마루의 무지막지한 계획은 실패로 돌아갔다.)"
10000090-3 = "(망량즈들은 냥텐마루가 항복하자마자 기다렸다는 듯이 도망쳐버렸다.)"
10000090-4 = "(그리고 지금)"
10000090-6 = "크윽, 끄, 끈질긴 놈들!"
10000090-8 = "후아암. 사건은 일단락되었어도 문제아는 아직 잔뜩 남아있으니까~"
10000090-9 = "불만을 품고 해코지하기 전에, 일단 먼저 순찰 활동이야! 츠바키 선배! 미모리 선배!"
10000090-10 = "으응, 축제의 마지막을 위해서, 모두 힘내요!"
