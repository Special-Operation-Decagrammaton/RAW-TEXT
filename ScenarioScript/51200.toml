[translation]
51200-1 = "제20화;화조풍월의 괴담가 2"
51200-5 = "……깜짝이야."
51200-6 = "난데없이 사람에게 총을 쏘다니 예의가 없지 않나요? 깜짝 놀랐잖아요. 소용은 없지만."
51200-7 = "한창 좋을 때에…… 갑자기 무슨 짓인가요?"
51200-8 = "샬레의 선생님과 당신. 당신들에게 양식미 따윈 없나요?"
51200-9 = "[s] \"……이유는 간단해. 소동을 일으킨 장본인이 눈앞에 있잖아.\""
51200-10 = "그럼 그걸 해결하기 위해 힘을 낼 뿐, 이란 거야."
51200-11 = "선생님과 함께 우리 수행부는 거리의 평화를 지키고 있으니까."
51200-12 = "네! 이유야 어찌 되었든 간에, 당신을 이대로 내버려 두지 않겠어요."
51200-13 = "선배들의 말이 맞아!"
51200-14 = "우리 수행부가 전력으로 말릴 거야!"
51200-19 = "수행부………"
51200-20 = "당신들………"
51200-22 = "……겨우 그딴 이유로 방해를 하다니."
51200-23 = "조금만 더 있었으면 딱 좋게 무르익었을 텐데."
51200-24 = "정말 여흥이고 뭐고, 극적인 이야기 따윈 전혀 신경 쓰지도 않고 무시하는 행태. 마음에 안 들……."
51200-35 = "……그러니까 소용없다니까요?"
51200-36 = "이번엔 당신인가요. 백화요란의 고양이."
51200-38 = "수행부의 말이 맞아. 중요한 건 소동을 수습하는 것. 백화요란으로서 그 점을 잊으면 안 돼."
51200-39 = "……그것이 눈을 의심케 만드는 이매망량일지라도."
51200-40 = "렌게. 정신 똑바로 차려."
51200-41 = "……아, 알고 있어!"
51200-42 = "거기다 나구사 선배……는."
51200-47 = "………읏."
51200-49 = "……그래서 저 녀석이 지금 벌어지는 모든 일의 흑막이란 거지?"
51200-50 = "확실히 변변찮은 일을 저지를 것처럼 보이는 꼬락서니이긴 하지만."
51200-51 = "뭐야~ 너무 그렇게 말할 것까진 없지 않나요~?"
51200-52 = "선생님……. 저 녀석을 향한 공격 말인데."
51200-53 = "[s] \"응. 그대로 통과해 버렸어. 마치 수면을 쏜 것처럼…….\""
51200-54 = "맞~~아요. 소용없다구요."
51200-55 = "제가 가진 [ruby=괴서]이노모노노케로쿠[/ruby] 앞에선 그 무엇도, 그 누구라도 <백물어>는 물론 저에겐 상처를 입힐 수 없는걸요?"
51200-56 = "말 그대로 아야메가 있는 게 아니라면."
51200-57 = "아, 하지만 아쉬워서 이를 어째. 여기에 있는 건 울보에 얼간이, 반푼이에 불과한 나구사 쨩뿐이네요?"
51200-59 = "………."
51200-61 = "그래?"
51200-62 = "꼬락서니만큼이나 비겁한 치트를 쓰고 있단 거네."
51200-63 = "또또또 그런 나쁜 말을~~!"
51200-64 = "하…… 네, 뭐. 좋아요. 어디 멋대로 지껄여 보세요."
51200-65 = "하지만 당신들이 제아무리 아무렇지 않은 척해도……."
51200-66 = "이야기는 시작되었어요. 이미 제가 원하는 대로 <무대>와 <배역>은 마련되었고……."
51200-67 = "저만의 <백물어>는 차근차근. 착실히 종국을 향해 달려가고 있으니까."
51200-68 = "[s1] \"………슈로, 화조풍월부의 진짜 목적이 뭐야?\"\n[s2] \"넌, 뭘 노리고 이런 소동을 일으키는 거야?\""
51200-71 = "아하핫, 이제 와서 그런 걸 묻는 건가요?"
51200-72 = "하지만, 네, 좋아요. 답할 필요 따윈 없지만. 그래도 답변해 드릴게요."
51200-77 = "모든 것은── <풍류>를 위해."
51200-78 = "화조풍월부의 괴담가로서 저만의 <백물어>를 만들기 위해."
51200-80 = "그런 알 수 없는 이유로 저런 괴물들을 불러냈다고?"
51200-81 = "……생각보다 한가한가 봐? 너희 화조풍월부는."
51200-89 = "아핫."
51200-90 = "아하하핫!"
51200-96 = "아하하하하핫!"
51200-97 = "뭐……. 뭐야? 왜 그렇게……."
51200-103 = "멍청하긴."
51200-104 = "정말로 그렇게 생각하시나요?"
51200-105 = "단지 괴물을 부리고. 거리를 불태우고. 당신들 앞에 나선 것만으로도 나의 <백물어>가 만들어지는 거라고?"
51200-106 = "그런 천진난만한 착각을 하다니…… 그런 멍청한 오해를 하다니."
51200-108 = "저의 <백물어>는 훨씬 더 오래…… 그래요. 예로부터 시작된 이야기였어요."
51200-109 = "당신들은 전혀 모르겠죠. 짐작조차 하지 못하겠죠."
51200-110 = "여기까지 오는데, 그저 하나의 풍문이면 충분했단 사실을."
51200-111 = "[s] \"……풍문?\""
51200-113 = "풍문이란 어디서 들었는지는 기억나지 않아도, 끝내 뇌리에 진득이 달라붙어 있기 마련."
51200-114 = "필요한 것은 그러한 단 한 가지. 풍문과 소문."
51200-115 = "예컨대……… 넌지시 <계승전을 알려주는 것>으로 천진한 아가씨를 충동질하고."
51200-116 = "[s] \"………!\""
51200-117 = "딱 하나, <청춘을 즐기는 쪽이 좋지 않겠냐>는 너스레로, 멍청한 계집을 움직이고."
51200-119 = "………어?"
51200-121 = "또또~, 또또또! 한 가지."
51200-122 = "<후배를 위하는 일이라면 돌려보내는 쪽이 좋지 않겠냐>는 이야기를 통해, 제 잘난 줄 아는 계집을 후배와 싸우도록 만들었지요."
51200-127 = "[ns] \"……설마.\""
51200-129 = "게다가, 이미 알고 계시지요? 이 모든 일이 가능했던 건 전부."
51200-133 = "샬레의 선생님. 당신이 찾아와 줬기에 가능했다는 걸."
51200-134 = "당신이 찾아온 이유, 짐작이 가시나요?"
51200-142 = "[ns] \"………음양부에 도착한 화조풍월부의 편지.\""
51200-143 = "아핫. 아하핫."
51200-144 = "[s] \"설마…… 처음부터 전부…….\""
51200-145 = "각자가 최선이라고 생각한 것을 위해 움직이지만."
51200-146 = "결국 그렇게 움직인 끝에 도달하는 곳은 모든 것이 어그러지고 망가지고 부서지고야 마는 결과."
51200-147 = "멍청하게도 최선이라 생각한 것이 가장 최악인 줄은 꿈에도 모른 채."
51200-148 = "아아, 안타깝네요."
51200-149 = "정말로 안타까워요. 이 얼마나…… 멍청하고 멋진 이야기인지!"
51200-150 = "아하하핫! 고마워요. 멍청한 여러분."
51200-151 = "당신들이 이렇게나 어리석었던 덕분에, 마침내 20년 전의 괴담을 다시 재현할 무대가 만들어졌으니까."
51200-164 = "또 놈들이야……!"
51200-165 = "카에데 쨩! 곁에서 떨어지지 마세요!"
51200-166 = "으, 응……!"
51200-181 = "소용없어. 소용없다구요. 이미 <첫 단추>는 꿰어졌어요."
51200-182 = "우리들의 풍류는 이제 막 시작되었을 뿐. 고대하는 클라이맥스는 이제부터 시작이랍니다."
51200-183 = "여러분이 있는 힘껏 노력해 주신 덕분에, 마침내 저곳엔…… 제가 만들어 나가는 이야기의 주역이 되기에 딱 알맞은 멋진 배역이 만들어졌으니까."
51200-184 = "여러분도 잘 아는 분이, 이번 이야기의 주역이 되어줄 테니까."
51200-188 = "유카리……?"
51200-189 = "뭐어?!"
51200-190 = "이힛. 역시 그 정도의 눈치는 있어 주셔야죠."
51200-193 = "네, 맞아요. 당신들이 열심히 노력해 준 덕분에, 그 누구보다 커다란 상처를 안고서, 그 무엇보다 커다란 절망을 끌어안게 된 소녀."
51200-194 = "그것도 20년 전의 무대를 재현하기 위한, 원치 않은 저주에 휘감긴 그대."
51200-196 = "아아…… 그녀라면…… 그 아이라면…… 정말로 멋진…… 풍류가……"
51200-197 = "굉장한 백물어가 되어줄 테지요."
51200-202 = "또…… 아야메 때처럼…… 너희는……"
51200-203 = "[s] (아야메 때……처럼?)"
51200-208 = "그럼, 이만."
51200-212 = "[ns] \"……!! 다들! 슈로를……!\""
51200-221 = "무의미해."
51200-226 = "한 번 굴러가기 시작한 이 이야기는, 이제 더는 그 누구도 막을 수 없으니까."
