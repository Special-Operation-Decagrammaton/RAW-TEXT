[translation]
1009202-1 = "미적 감각"
1009202-2 = "(요시미의 연락을 받고, 약속 시간에 맞춰 쇼핑몰을 찾아갔다.)"
1009202-8 = "코디는 중대 사안이니까. 선생님도 장난치지 말고 봐줘."
1009202-9 = "이상한 동물 옷이라든가 비키니 수영복 같은 거 고르면 가만 안 둘 거야, 알았지?"
1009202-10 = "[s1] \"오……. 혹시 도발하는 거야?\"\n[s2] \"그런 말 하면 괜히 하고 싶어지는데.\""
1009202-13 = "아니라니까! 미리 말 안 했으면 또 은근슬쩍 그런 거 가지고 왔을 거 아냐!!"
1009202-14 = "……에휴. 애초에 트집 잡을 걸 준 내가 잘못이지, 그래."
1009202-18 = "고르는 건 내가 할 테니까, 옆에서 의견이나 줘. 그 편이 안전하겠어."
1009202-23 = "우선 재킷부터 고를 테니까 말이야."
1009202-24 = "그다음은……. 보자……."
1009202-29 = "컨셉을 맞추는 거니 치마랑 신발도 웬만하면 맞추자. 같은 형태에서 색 베리에이션만 주는 게 예쁠 거야."
1009202-30 = "티……는 일단 임의로 맞춰 두고, 밴드 마크가 나오면 마크를 박을까 하는데……."
1009202-31 = "그리고 또……. 음……. 액세서리들이랑……."
1009202-35 = "……음? 뭐라고?"
1009202-36 = "……어느새 미적 감각이 늘었냐고?"
1009202-37 = "후후후. 그야……."
1009202-42 = "잠깐, 선생님. 방금 그건 무슨 이야기야?"
1009202-43 = "……'어느새 늘었다'니, 그럼 그전에는 영 별로였다는 이야기?"
1009202-44 = "잘 들어, 선생님. 내 미적 감각은 항상 이 상태였어. 한 번도 나빴던 적이 없다고."
1009202-45 = "손재주가 좀 부족했던 적이 있긴 하지만 이거랑 그거랑 아무 상관 없잖아?"
1009202-46 = "애초에 우리 쪽에서도 '디자인'을 제대로 신경 쓰는 녀석이라곤 나밖에 없기도 하고."
1009202-47 = "……음? 뭐라고?"
1009202-48 = "그러고 보니 다른 애들은 왜 안 불렀냐고? 그건……."
1009202-49 = "……음……. 그게……."
1009202-50 = "[ns3] \"미안. 혹시 눈치 없는 질문이었을까?\"\n[ns4] \"대답하기 곤란하면 넘어가도 되는데.\""
1009202-56 = "진짜!! 내가 콱 그냥 이 인간을~!!"
1009202-57 = "아오~!! 진짜 왜 그 소리 안 하냐 했다!! 아주 그냥 한 번을 그냥 안 넘어가지!? 한 번을!!"
1009202-58 = "진짜 그런 거 아니라고!! 아니, 아예 아니라곤 안 하겠지만 큰 이유는 그게 아니라고!!"
1009202-62 = "진짜 이유는……. 그……."
1009202-66 = "……하아아."
1009202-67 = "[s5] \"갑자기 한숨!?\"\n[s6] \"땅 꺼지겠다, 땅 꺼지겠어.\""
1009202-72 = "선생님……. 진짜 아무것도 모르는구나."
1009202-73 = "안 부른 게 아니야, 부르면 안 되는 거라고. 그 녀석들은."
1009202-74 = "디자인……. 다른 녀석들에게 맡겼다간 정말……."
1009202-75 = "끔찍한 결과를 맞이해야 할 걸……?"
1009202-76 = "무슨 이야기냐고? 직접적으로 바로 말해 줘?"
1009202-77 = "선생님도 딱히……."
1009202-81 = "<4차원 패션>이나 <민트&화이트 도배 패션>이나 <스케반 센스 패션>이 보고 싶은 건 아니지 않아?"
1009202-85 = "[ns7] \"………….\"\n[ns8] \"……아하…….\""
1009202-88 = "[ns9] \"그런 느낌이군……. 이해했다…….\"\n[ns10] \"본인들이 들으면 슬퍼하겠는데.\""
1009202-91 = "슬퍼해도 어쩔 수 없어. 애초에 본인들한테도 내가 다 직접 말하고 나오지 말라 한 거야."
1009202-92 = "그러니까 선생님만이라도 좀 제대로 같이 봐 달라고 하는 거고 말이지."
1009202-96 = "아무튼 사족은 거기까지. 좀 더 세트를 맞춰 보자면……."
1009202-107 = "흠……."
1009202-108 = "……슬슬 됐나? 이 정도면……?"
1009202-109 = "[s11] \"대략적인 구색은 맞춰졌을지도?\"\n[s12] \"한 번 전체적으로 맞춰보는 게 어때?\""
1009202-112 = "……음. 그런가?"
1009202-113 = "하긴, 뭐 다른 애들 걸 맞춘다고는 해도 기본적으로 내 것과 큰 차이는 없을 테니까."
1009202-117 = "그럼 어디 한 번……."
1009202-118 = "여기서 조금만 기다려. 금방 갈아입고 올게."
1009202-127 = "……음."
1009202-128 = "대충 이런 느낌인가……."
1009202-129 = "어……. 어때? 좀……. 뭐랄까……."
1009202-130 = "이…… 이쁜 거…… 같아?"
1009202-131 = "혹시나 해서 하는 말인데, 이상한 소리 할 거 같으면 그냥 입 다물고 있고."
1009202-132 = "[ns13] \"순수하게 귀여운데.\"\n[ns14] \"왜 자꾸 그런 걱정을 하는 거야?\""
1009202-133 = "그, 그래? 그러면 다행이지만……."
1009202-137 = "몰라서 묻는 건 아니겠지……?"
1009202-138 = "뭔가 좀 큰 거 같기도 하지만……. 뭐, 이런 건 원래 그런 맛으로 입는 거기도 하니까."
1009202-143 = "……음……."
1009202-144 = "좋아. 이걸로 갈까. 이거라면 훌륭하겠어. 같은 계통으로 색만 바꿔서 좀 더 구해볼까……."
1009202-145 = "생각해 보니 4세트면 양이 꽤 되겠네, 이거. 들고 가기 어렵겠는걸."
1009202-150 = "……응? 선생님, 방금 뭐라고 했어?"
1009202-151 = "들어준다고? ……이 짐들?"
1009202-152 = "[s15] \"애초에 그러려고 왔는걸.\"\n[s16] \"이것 또한 어른이 할 일이지.\""
1009202-155 = "어, 어어……?"
1009202-156 = "그, 그런가……? 그, 그건 전혀 생각 안 하고 있었는데……?"
1009202-157 = "그치만 무거울 텐데……."
1009202-162 = "[ns17] 바구니를 들어준다.\n[ns18] \"가자~ 계산대로~.\""
1009202-167 = "어, 서, 선생님!"
1009202-171 = "선생님 기다려……! 같이 가……!!"
1009202-176 = "(이후 계산도 대신해 주고, 짐도 모두 옮겨 주었다.)"
