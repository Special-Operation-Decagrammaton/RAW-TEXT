901010800230-8 = ""
901010800230-10 = ""
901010800230-11 = "這是……"
901010800230-12 = ""
901010800230-14 = ""
901010800230-15 = "呵呵，看來是抽中頭獎了呢。"
901010800230-16 = ""
901010800230-18 = ""
901010800230-19 = "這裡是FOX2。#n我在出口方向的裝卸區發現了一些有趣的資料。"
901010800230-20 = "其中一份是在這間倉庫工作的組織成員名單，#n另一份是記錄了組織分派資金流向的收支帳簿。"
901010800230-21 = ""
901010800230-23 = ""
901010800230-24 = "要掌握組織的目的，沒有比收支帳簿更有價值的資料了。"
901010800230-25 = "做得好，FOX2。#n立刻把獲取的資料複製並傳送回來。"
901010800230-26 = "收到。很快就可以完成了。"
901010800230-27 = "FOX2。收支帳簿裡有沒有異常的記錄？例如可疑的交易明細之類的。"
901010800230-28 = "唔嗯……好像沒有特別異常的部分……"
901010800230-29 = "如果要說有什麼令人在意的地方……就是最近的支出看起來被縮減了吧。"
901010800230-30 = "發給組織成員的點心換成了便宜的仙貝，這一季也沒有購入原本定期採購的彈藥。"
901010800230-31 = "是突然資金不足了嗎？"
901010800230-32 = "不，整體的持有資金反而比往年增加了。"
901010800230-33 = "會不會有什麼需要花費大筆資金的計畫？"
901010800230-34 = "然而卻大量採購了根本沒打算吃的螃蟹……#n總覺得不太對勁……"
901010800230-35 = ""
901010800230-37 = ""
901010800230-39 = ""
901010800230-40 = "這裡是FOX3。"
901010800230-41 = "FOX2。剛才還在後門交談的兩名組織成員，Tango3和Tango4從指定位置消失了。"
901010800230-42 = "他們可能正在返回辦公室，你最好快點離開那裡。"
901010800230-43 = "可是資料還沒──"
901010800230-44 = ""
901010800230-46 = ""
901010800230-47 = "FOX2。有人正在朝你的方向移動，提高警戒。"
901010800230-48 = "……！"
901010800230-49 = ""
901010800230-56 = ""
901010800230-57 = "奇怪？辦公室的門怎麼會開著？"
901010800230-58 = ""
901010800230-62 = ""
901010800230-63 = "什麼人！"
901010800230-64 = ""
901010800230-66 = ""
901010800230-70 = ""
901010800230-71 = "您好，我是FOX EATS！"
901010800230-72 = "……FOX EATS？"
901010800230-73 = "啊，Capo。之前不是跟您提過嗎？#n最近這一帶有個很有名的外送服務。"
901010800230-74 = "應該就是那個FOX EATS的外送員。"
901010800230-75 = "你覺得我現在是在問這個嗎？#n我想知道的是外人為什麼會在我們的辦公室裡！"
901010800230-76 = "你這傢伙是誰？是別的家族派來的間諜嗎！？"
901010800230-78 = "啊，那個，該怎麼說呢……"
901010800230-79 = ""
901010800230-81 = ""
901010800230-82 = "不好意思～我是來送餐的，但是入口沒有看到任何人。"
901010800230-83 = "想說把可能會壞掉的食物就這麼放著也不太好，結果找著找著就跑到這裡來了。"
901010800230-84 = "你說的是真的嗎？看守正門的傢伙就這麼放你進來了？"
901010800230-85 = "是的。正門一個人都沒有哦？"
901010800230-86 = "嘖，又跑去哪裡偷懶了。#n那些傢伙要是被我抓到，一定要好好教訓一頓。"
901010800230-87 = "所以，是誰訂了什麼？"
901010800230-88 = "我看看……是2人份的豆皮壽司！"
901010800230-89 = "我想大概是訂來當作宵夜的吧？#n豆皮壽司就算在深夜吃也相對沒有負擔，當作宵夜再適合不過了。"
901010800230-90 = "有誰訂了豆皮壽司嗎？"
901010800230-92 = "我也不太清楚，總之我先問問看……"
901010800230-94 = "好吧。食物先放這裡，你可以走了。"
901010800230-95 = "要是敢再擅自闖進倉庫，我可不會輕易放過你！"
901010800230-96 = "好的！祝您用餐愉快！"
