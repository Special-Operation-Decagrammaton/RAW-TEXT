901010800230-11 = "นี่มัน..."
901010800230-12 = ""
901010800230-14 = ""
901010800230-15 = "ฮุฮุ ดูเหมือนจะเจอข้อมูลเด็ดแล้วละ"
901010800230-16 = ""
901010800230-18 = ""
901010800230-19 = "FOX 2 รายงาน ฉันพบข้อมูลที่น่าสนใจหลายอย่างตรงลานขนถ่ายสินค้าฝั่งทางออก"
901010800230-20 = "อย่างแรกคือรายชื่อสมาชิกองค์กรที่ทำงานอยู่ในโกดังนี้ ส่วนอีกอย่างคือบันทึกรายรับรายจ่ายที่บันทึก#nกระแสเงินของสาขานี้เอาไว้"
901010800230-21 = ""
901010800230-23 = ""
901010800230-24 = "ไม่มีข้อมูลไหนเหมาะกับการดูเป้าหมายขององค์กรไปกว่าบัญชีรายรับรายจ่ายแล้วละ"
901010800230-25 = "ทำได้ดีมาก FOX 2 คัดลอกข้อมูลที่ได้มาแล้วส่งมาเลย"
901010800230-26 = "รับทราบ เดี๋ยวเดียวก็เสร็จแล้ว"
901010800230-27 = "FOX 2 ในบันทึกรายรับรายจ่ายมีอะไรผิดปกติหรือเปล่า? อย่างรายการธุรกรรมที่น่าสงสัย อะไรทำนองนี้"
901010800230-28 = "อืม ก็ไม่เห็นมีอะไรสะดุดตาเป็นพิเศษนะ..."
901010800230-29 = "แต่ถ้าจะมีเรื่องที่น่าสนใจก็คือ ช่วงหลังมานี้เหมือนกำลังลดรายจ่ายโดยรวมเลย"
901010800230-30 = "แม้แต่ของว่างที่แจกสมาชิกก็เปลี่ยนเป็นเซ็มเบราคาถูก และกระสุนที่ซื้อเป็นประจำก็ไม่ได้ซื้อใน#nไตรมาสนี้ด้วย"
901010800230-31 = "หรือจู่ๆ เงินก็ขาดมือขึ้นมา?"
901010800230-32 = "ไม่น่านะ เงินทุนที่ถืออยู่โดยรวมกลับเพิ่มขึ้นกว่าปกติด้วยซ้ำ"
901010800230-33 = "หรือกำลังจะมีเรื่องที่ต้องใช้เงินก้อนใหญ่?"
901010800230-34 = "ถ้าอยู่ในสถานการณ์นั้น แต่กลับซื้อปูที่ไม่ได้จะกินมาตั้งเยอะ ฉันว่ามันดูไม่ชอบมาพากลนะ..."
901010800230-35 = ""
901010800230-37 = ""
901010800230-39 = ""
901010800230-40 = "นี่คือ FOX 3"
901010800230-41 = "FOX 2 แทงโก้ 3 กับ แทงโก้ 4 ที่เมื่อกี้ยังคุยกันอยู่แถวประตูหลังหายไปจากจุดที่กำหนดแล้ว"
901010800230-42 = "พวกนั้นอาจกลับไปที่สำนักงานแล้วก็ได้ รีบออกมาจากตรงนั้นดีกว่า"
901010800230-43 = "แต่ฉันยังคัดลอกข้อมูลไม่เสร็จเลย..."
901010800230-44 = ""
901010800230-46 = ""
901010800230-47 = "FOX 2 มีคนกำลังมุ่งหน้าไปทางนั้น เตรียมตัวให้พร้อม"
901010800230-48 = "...!"
901010800230-49 = ""
901010800230-56 = ""
901010800230-57 = "เอ๋ ประตูสำนักงานเปิดอยู่นี่นา?"
901010800230-58 = ""
901010800230-62 = ""
901010800230-63 = "นั่นใครน่ะ!"
901010800230-64 = ""
901010800230-66 = ""
901010800230-70 = ""
901010800230-71 = "สวัสดีค่ะ ฉันมาจาก FOX EATS ค่ะ!"
901010800230-72 = "FOX EATS เหรอ...?"
901010800230-73 = "อ๊ะ คาโป ฉันเคยบอกไปก่อนหน้านี้แล้วไงคะ ที่ว่าช่วงนี้มีบริการส่งอาหารที่กำลังเป็นกระแสแถวนี้น่ะ"
901010800230-74 = "เด็กคนนี้ดูเหมือนจะเป็นพนักงานส่งอาหารของ FOX EATS นะคะ"
901010800230-75 = "คิดว่าฉันถามเรื่องนั้นอยู่หรือไง? ที่ฉันอยากรู้ก็คือ ทำไมคนนอกถึงมาอยู่ในสำนักงานของพวกเรา#nต่างหากล่ะ!"
901010800230-76 = "เธอเป็นใคร? เป็นสายลับที่แฟมิลี่อื่นส่งมาหรือเปล่า?!"
901010800230-78 = "อ่า... คือว่า..."
901010800230-79 = ""
901010800230-81 = ""
901010800230-82 = "ขอโทษทีค่ะ~ ฉันมาส่งอาหาร แต่ไม่มีใครอยู่ที่ทางเข้าเลยค่ะ"
901010800230-83 = "ฉันไม่อยากวางอาหารไว้แล้วปล่อยให้มันเย็นชืด ก็เลยเดินหาคนไปเรื่อยๆ จนมาถึงที่นี่ค่ะ"
901010800230-84 = "จริงเหรอ? พวกที่เฝ้าประตูหน้าปล่อยเธอเข้ามาเฉยๆ งั้นเหรอ?"
901010800230-85 = "ค่ะ ตรงประตูหน้าไม่มีใครอยู่เลยนะคะ"
901010800230-86 = "ชิ! คงแอบอู้งานอยู่ที่ไหนอีกแล้วละสิท่า ถ้าจับได้จะเล่นงานให้หนักเลย"
901010800230-87 = "แล้วใครสั่งอะไรไว้ล่ะ?"
901010800230-88 = "ขอเช็กก่อนนะคะ อาหารที่สั่งคือ... ซูชิเต้าหู้หวาน 2 ที่ค่ะ"
901010800230-89 = "น่าจะสั่งไว้เป็นมื้อดึกนะคะ ถ้าเป็นซูชิเต้าหู้หวาน ถึงกินดึกๆ ก็ไม่หนักท้อง เหมาะเป็นมื้อดึกที่สุดแล้วค่ะ"
901010800230-90 = "มีใครสั่งซูชิเต้าหู้หวานไว้มั้ย?"
901010800230-92 = "ไม่แน่ใจเหมือนกันค่ะ แต่เดี๋ยวลองถามให้นะคะ..."
901010800230-94 = "ก็ได้ วางอาหารไว้ตรงนี้แล้วกลับไปได้แล้ว"
901010800230-95 = "แต่ถ้าคราวหน้าเข้ามาในโกดังเองอีกละก็ ฉันไม่ปรานีแน่!"
901010800230-96 = "เข้าใจแล้วค่ะ ทานให้อร่อยนะคะ!"
