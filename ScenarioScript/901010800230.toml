[translation]
901010800230-11 = "이건……"
901010800230-15 = "후후, 아무래도 당첨 제비를 뽑은 모양이네."
901010800230-19 = "여기는 FOX 2. 출구 쪽 하역장에서 흥미로운 데이터를 몇 가지 발견했어."
901010800230-20 = "하나는 이 창고에서 일하는 조직원의 명단이고, 또 다른 하나는 지부의 자금 흐름을 기록해 둔 매출 내역이야."
901010800230-24 = "조직의 목적을 파악하기에 매출 장부만 한 자료도 없지."
901010800230-25 = "잘했다, FOX 2. 확보한 데이터를 복사한 뒤 이쪽으로 전송하도록."
901010800230-26 = "알겠어. 금방 끝나."
901010800230-27 = "FOX 2. 매출 내역에 특이한 기록은 없어? 수상한 거래 내역이라든가."
901010800230-28 = "글쎄. 특별히 눈에 띄는 부분은 없는 것 같은데……"
901010800230-29 = "하나 신경 쓰이는 부분이라면, 최근 지출을 전반적으로 억제하고 있는 것처럼 보여."
901010800230-30 = "조직원들에게 지급하는 간식도 저렴한 센베이로 바꾸었고, 정기적으로 구입하던 탄환 구매도 이번 분기에는 진행하지 않았어."
901010800230-31 = "돈이 갑자기 궁해진 거 아냐?"
901010800230-32 = "아니, 전반적인 보유금은 오히려 평년에 비해 늘었어."
901010800230-33 = "뭔가 크게 돈을 쓸 일이 예정되어 있는 걸까?"
901010800230-34 = "그런 주제에 먹지도 않을 게는 잔뜩 구매하다니. 어쩐지 뒤가 구린걸—"
901010800230-40 = "여기는 FOX 3."
901010800230-41 = "FOX 2. 방금 전까지 후문 쪽에서 대화를 나누던 조직원 두 사람, 탱고 3와 탱고 4가 지정된 위치에서 사라졌어."
901010800230-42 = "사무실로 돌아갔을지도 모르니, 빨리 그 자리에서 벗어나는 게 좋을 것 같아."
901010800230-43 = "하지만 아직 데이터 복사가 다 안 끝났는데—"
901010800230-47 = "FOX 2. 그쪽으로 누군가 움직이고 있다. 대비해."
901010800230-48 = "……!"
901010800230-57 = "어라, 사무실 문이 열려 있잖아?"
901010800230-63 = "웬 녀석이냐!"
901010800230-71 = "안녕하세요, FOX EATS입니다!"
901010800230-72 = "……FOX EATS?"
901010800230-73 = "아, 카포. 전에 말했잖아요. 요새 이 근방에 소문난 배달 서비스가 있다고."
901010800230-74 = "그 FOX EATS의 배달부인 모양인데요."
901010800230-75 = "내가 지금 그걸 묻는 것 같아? 내가 궁금한 건, 외부인이 왜 우리 사무실에 있느냐고!"
901010800230-76 = "뭔데, 너는? 다른 패밀리에서 보낸 스파이냐?!"
901010800230-78 = "아, 그게 그러니까……"
901010800230-82 = "죄송합니다~ 식사 배달을 왔는데 입구에 아무도 안 계셔서요."
901010800230-83 = "상해 버릴지도 모르는 음식을 그냥 두고 가기도 그래서, 사람을 찾다 보니 여기까지 와 버렸네요."
901010800230-84 = "그게 정말이야? 정문에서 경비 서는 녀석들이 널 그냥 보내줬다고?"
901010800230-85 = "네. 정문에는 아무도 없었는걸요?"
901010800230-86 = "쳇, 또 어디서 게으름을 피우고 있었나. 걸리면 단단히 혼을 내줘야지."
901010800230-87 = "그래서, 누가 뭘 주문했는데?"
901010800230-88 = "어디 보자…… 유부초밥 2인분입니다!"
901010800230-89 = "아마 야식으로 주문하신 모양이네요. 유부초밥이라면 늦은 밤에 먹어도 부담이 덜하니, 야식으로는 이만한 음식도 없죠."
901010800230-90 = "누구 유부초밥 시킨 사람 있어?"
901010800230-92 = "글쎄요. 일단 물어보긴 하겠습니다만……"
901010800230-94 = "알겠어. 음식은 일단 여기 두고 돌아가."
901010800230-95 = "하지만 다시 한 번 멋대로 창고에 들어오면 국물도 없을 줄 알아!"
901010800230-96 = "알겠습니다. 맛있게 드세요!"
