[translation]
10036005-1 = "프롤로그"
10036005-4 = "어디 갔지? 분명 여기 있었는데!"
10036005-5 = "치잇, 쥐새끼 같은 녀석……!"
10036005-11 = "저기다! 쏴!"
10036005-17 = "어디 갔지?"
10036005-26 = "크어억……."
10036005-31 = "……끝인가."
10036005-35 = "목표했던 물건은 받아 가도록 하지."
10036005-39 = "여기, 의뢰했던 정보 단말이다."
10036005-40 = "오오……! 그래! 바로 이거야! 이렇게 손에 넣게 되다니!"
10036005-41 = "프리랜서라고 해서 크게 기대하지 않았는데, 만족스러운 결과야. 후후."
10036005-42 = "비결이 뭐지?"
10036005-43 = "비결이라 말할 것은 딱히 없다."
10036005-48 = "단지 임무에 대해 철저히 조사하고 학습한다는 원칙을 지켰을 뿐."
10036005-49 = "적의 위치, 시설의 구조, 그리고 상대 조직 내부의 알력싸움과 계급도까지 파악한다면 어렵지 않게 임무를 완수할 수 있지."
10036005-50 = "오오, 그렇군……!"
10036005-51 = "잡담은 여기까지. 그럼, 계약한 의뢰 완수금을 받도록 하지."
10036005-52 = "아, 물론 줘야지! 자, 여기 있다."
10036005-56 = "하나, 둘, 셋…… 음, 확실히 받았다."
10036005-57 = "하지만……."
10036005-59 = "응? 뭐 문제라도? 난 계약서에 적힌 그대로 줬는데."
10036005-60 = "아, 아니, 의뢰 대금에 문제가 있다는 건 아니다. 다만……"
10036005-65 = "(장비와 총탄 값, 고정 지출을 빼면 상당히 적은 금액…… 식비를 줄인다고 해도 대략 일주일 정도 버틸 수 있을까…….)"
10036005-66 = "(조금 더 벌이가 좋은 의뢰를 찾아볼 필요가 있을지도…….)"
10036005-70 = "뭐야, 표정이 안 좋군. 보아하니 돈이 더 필요한 모양이지?"
10036005-71 = "수고비를 얹어주지는 못하지만, 새로운 일감은 소개해 줄 수 있는데."
10036005-72 = "그게 정말인가?"
10036005-73 = "그래, 일 처리가 깔끔한 걸 보니 믿고 맡길 수 있을 것 같아서 말하는 거야. 관심 있어?"
10036005-74 = "……부탁하지. 지금은 돈이 필요하다."
10036005-75 = "좋아, 그럼 잘 들어."
10036005-76 = "곧 <헬멧단 총연합회>가 열릴 예정이야."
10036005-77 = "……<총연합회>?"
10036005-78 = "그래, 간부인 내가 말하기도 그렇지만, 지금까지 헬멧단은 잔챙이나 다름없는 점조직이었지."
10036005-79 = "하지만 이제부터는 달라. 조직력을 강화하고, 하나의 집단으로서 힘을 키울 예정이다."
10036005-80 = "최근 위험한 녀석들이 교정국에서 탈옥하는 바람에 불안 요소도 생겼고……."
10036005-81 = "크흠, 이야기가 조금 헛나갔지만, 다시 돌아와서."
10036005-82 = "아무튼 <총연합회>는 모든 헬멧단 지부가 참여하는 대대적인 친목 행사……쉽게 말하자면 축제라고 할 수 있지."
10036005-84 = "축제라…… 그런 곳에서 내가 할 일이 있나?"
10036005-85 = "그야 물론이지."
10036005-86 = "이번 축제를 위해 블랙마켓에서 가장 유명한 DJ를 섭외했는데 말야, 그 녀석의 보조 겸 경호원이 필요해."
10036005-87 = "이번 일 처리도 깔끔하니, 믿고 맡겨도 괜찮을 것 같아서 제안하는 건데 말야."
10036005-88 = "어때? 관심 있어? 시급도 꽤나 잘 쳐줄 텐데."
10036005-89 = "경호 임무라…… 지키는 것은 익숙하지 않지만……."
10036005-90 = "아니, 내 처지에 일을 가려 받을 수는 없겠지."
10036005-91 = "좋아, 수락하겠다. 시간과 장소를 말해라."
10036005-92 = "좋아, 잘 생각했어. 시간은 사흘 뒤, 장소는……<무법자 해변>이야."
10036005-96 = "……해변, 이라고?"
