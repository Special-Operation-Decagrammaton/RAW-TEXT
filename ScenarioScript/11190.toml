[translation]
11190-2 = "제19화;용서 못 해, 네놈들!"
11190-3 = "파괴된 아비도스 시내"
11190-4 = "(뭉게뭉게-)"
11190-6 = "(콜록 콜록) 우와 건물이 흔적도 없이 사라졌어."
11190-7 = "(쿨럭, 쿨럭) 이건 대체……."
11190-8 = "(빙글빙글)"
11190-10 = "콜록, 콜록. 으, 으아아……."
11190-13 = "(뭐, 뭐야 이거?! 무슨 일이 터진 거야?!)"
11190-14 = "……진짜야? 정말로 날려버린 거야, 아루 쨩?"
11190-15 = "으, 으응?"
11190-16 = "마음이 약해진다는 이유로 우리한테 친절하게 대해준 라멘집을 날려버린 거야? #n굉장한데-!"
11190-17 = "이래서야 진짜 피도 눈물도 없는 대악당이잖아! #n시시한 피라미는 절대로 못하는 악행이잖아! 완전 나쁜놈이잖아!"
11190-18 = "에, 으? ……어?"
11190-19 = "이게 바로 하드보일드 무법자!! 굉장해, 아루 쨩! 다시 봤어!"
11190-20 = "아, 으아……? ……아, 아하하하! 다, 당연하지! #n인정에 얽매이지 않고 돈만 받으면 무엇이든지 OK! 그게 우리 모토니까!!"
11190-21 = "그 말, 잘 들었어!!"
11190-25 = "네놈들……!! 봐줬더니 결국 이렇게까지 해줬다 이거지?!"
11190-26 = "……."
11190-27 = "……."
11190-28 = "시바 마스터의 신변을 확보했습니다! 가벼운 상처라서 근처 쉘터로 안내했습니다!"
11190-29 = "……좋아. 그럼 마음껏 날뛰어도 된다는 얘기네?"
11190-30 = "용서 못 해, 네놈들. 절대 용서할 수 없어……!!"
11190-32 = "?!"
11190-33 = "에헤- 호랑이도 제말하면 온다더니."
11190-34 = "……우리가 원한 타이밍은 아니지만 뭐, 언젠가는 결판을 내야 하는 상대이긴 하니."
11190-35 = "미리 계약해 뒀던 용역들을 이쪽으로 부르겠다."
11190-37 = "……."
11190-38 = "……그, 그래!! 이제 내가 어떤 사람인지 잘 알겠지, 아비도스 녀석들?"
11190-39 = "이제 제대로 결판을 내는 거야!! 어디 한 번 덤벼보시지!"
11190-40 = "(철컥) 네. 제가 다 쓸어버릴게요, 아루 사장님."
11190-43 = "각오는 되었겠지?!"
11190-44 = "(철컥)"
11190-45 = "혼날 준비하세요-!"
11190-49 = "이쪽이야말로!! 진정한 무법자가 뭔지 보여주겠어!!"
