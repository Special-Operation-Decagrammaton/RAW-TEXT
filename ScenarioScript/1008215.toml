[translation]
1008215-1 = "청춘의 하얀 리본"
1008215-2 = "(약속 시간에 맞춰 상점가에 나왔다.)"
1008215-8 = "오, 비슷한 타이밍에 왔네."
1008215-9 = "역시 스승님이야!"
1008215-10 = "그럼 오늘은 여기를 천천히 보면서 돌아다녀 볼까."
1008215-14 = "오, 이거 좋네."
1008215-19 = "이것 봐, 이 횻토코 가면……"
1008215-20 = "……스승님이 하면 웃길 것 같아."
1008215-26 = "아하핫! 이상한 얼굴!"
1008215-27 = "여기 이 보자기도 둘러봐."
1008215-31 = "아하하하핫……!"
1008215-32 = "이거 당장 사야겠다. 주인아저씨!"
1008215-33 = "감사요! 커플 할인은 없지만, 봉투는 서비스로 드릴게요!"
1008215-34 = "커, 커플?! 어, 그게……."
1008215-35 = "[s1] \"스승과 제자라…….\"\n[s2] \"금단의 사랑이네.\""
1008215-38 = "그, 그런 거 아니잖아!"
1008215-39 = "그리고 웃긴 가면 쓰고 이상한 농담 하지 말라고!"
1008215-40 = "[s3] \"후후후, 렌게는 뭐 필요한 거 없어?\"\n[s4] \"나도 선물을 하고 싶은데 말이야. 후후후.\""
1008215-43 = "아, 알았으니까 그렇게 이상하게 웃으면서 말하지 마!"
1008215-44 = "……농담 한번 해본 건데 다들 반응이 활기차네요."
1008215-45 = "아아, 청춘이구나."
1008215-49 = "[ns] \"그러고 보니……\""
1008215-51 = "[ns5] \"렌게는 하얀 리본을 좋아하는 것 같은데.\"\n[ns6] \"다른 색도 하거나 해?\""
1008215-54 = "리본……?"
1008215-55 = "아, 이거."
1008215-56 = "[s] \"뭔가 청춘의 사연이 있는 건가 해서.\""
1008215-57 = "사연이라기보다는…… 으으음……."
1008215-58 = "……뭐, 스승님에겐 말해도 되겠지."
1008215-59 = "내가 좋아하는 어떤 청춘 소설이 있거든."
1008215-60 = "그 소설의 주인공이 이런 하얀 리본을 하고 있어."
1008215-61 = "평범해 보이지만, 그 주인공에겐 정말로 특별한 리본이야."
1008215-62 = "청춘 스토리와 깊게 이어져 있거든."
1008215-63 = "그걸 읽으면서 좋다…… 라고 생각하다가, 나도 따라 해 봤던 것뿐이야."
1008215-64 = "[s] \"그럼 비슷한 디자인의 리본을 골라야겠네.\""
1008215-65 = "후후, 사연 잘 들었습니다!"
1008215-66 = "그 디자인의 리본이라면 이쪽에 많으니 골라 보세요!"
1008215-67 = "당신도 듣고 있던 거냐고!"
1008215-72 = "[ns] \"좋아. 결정했어!\""
1008215-75 = "정말로 사주는 거야?"
1008215-76 = "으으, 하지만 이걸 스승님에게 받는다는 건……!"
1008215-77 = "[s] \"다른 디자인이 좋아?\""
1008215-78 = "아, 아니야! 받으면 엄청 기쁘긴 한데……!"
1008215-79 = "으, 으으음……."
1008215-80 = "좋다고 하니 빨리 사주시죠."
1008215-81 = "아아아악……!"
1008215-82 = "아, 알겠어. 일단 받을게. 이건…… 특별한 거니까……."
1008215-83 = "[s] \"그 청춘 소설의 주인공만큼?\""
1008215-84 = "모, 몰라! 그러니까 이 이야기는 여기서 그만!"
1008215-90 = "쇼, 쇼핑은 이걸로 충분히 한 것 같으니까 오늘 청춘 활동은 여기까지만 하자!"
1008215-94 = "그럼 나중에 또 보자고! 선물 고마웠어!"
1008215-98 = "[ns] \"……생각보다 너무 부끄러워하는데?\""
1008215-99 = "혹시 저 아이가 말하던 청춘 소설이 어떤 내용인지 알고 계십니까?"
1008215-103 = "흠, 모르시는 모양이군요."
1008215-104 = "전 여기서 장사를 오래 하다 보니 비슷한 이야기를 몇 번 들어서 알고 있습니다만."
1008215-105 = "사실 저 하얀 리본은 말이죠……."
1008215-107 = "(이후 상인에게 청춘 소설 속 리본의 이야기를 들었다…….)"
1008215-109 = "으으, 받았어."
1008215-110 = "받아버렸어……."
1008215-114 = "주인공이 선물 받았던 리본을……."
1008215-118 = "연인에게 처음으로 선물 받았던 리본을……!"
1008215-119 = "어, 어쩌지? 이럴 의도는 없었는데 왜 스승님은……."
1008215-120 = "혹시 소설 내용을 알고 계셨던 건 아닐까?"
1008215-121 = "아니면 평소처럼 장난이나 호의?"
1008215-122 = "하지만, 혹시……."
1008215-127 = "으아아, 모르겠다! 왜 이런 일이 갑자기……!"
1008215-131 = "[ns] \"렌게, 들어가도 될까?\""
1008215-133 = "괘, 괜찮긴 한데……."
1008215-137 = "[ns] \"역시 안에 있었네?\""
1008215-138 = "스, 스승님? 여기는 무슨 일로?"
1008215-139 = "[s] \"그 리본, 소설의 전개대로라면 이 이후에…….\""
1008215-140 = "스승님?!"
1008215-141 = "역시, 알고 있었어?"
1008215-142 = "[s7] \"후후후, 무슨 소리야?\"\n[s8] \"잘 모르겠는데? 후후후.\""
1008215-145 = "역시 다 알고 있잖아!"
1008215-146 = "[s] \"……하지만, 소설의 씬을 재현하는 것도, 청춘 활동이지 않을까 해서.\""
1008215-147 = "……!!"
1008215-148 = "그, 그렇긴 해……!"
1008215-149 = "으, 으으! 시, 싫진 않은데……!"
1008215-150 = "다, 달아줬으면 좋겠어. 스승님이 원한다면."
1008215-151 = "그러니까 더 이상 놀리는 건 금지! 알겠지?"
1008215-158 = "(이후 렌게에게 리본을 달아주며 둘만의 청춘을 즐겼다.)"
