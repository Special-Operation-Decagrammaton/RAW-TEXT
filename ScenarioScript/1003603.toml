[translation]
1003603-1 = "과유불급"
1003603-2 = "트리니티 성당 내부"
1003603-3 = "(성당으로 도착하니, 들어가자마자 걱정스러운 표정을 한 시스터후드 학생들이 눈에 들어왔다.)"
1003603-4 = "으음……. 히나타 자매님, 전혀 말씀을 안 들어주고 계시는데……."
1003603-5 = "저러다 큰일이라도 나면 어쩌시려고……. 정말 걱정입니다."
1003603-6 = "[s1] (……말을 안 듣는다고?)\n[s2] (큰일이라도 나면……?)"
1003603-7 = "……어라. 선생님?"
1003603-8 = "……어라. 선생님?"
1003603-9 = "아, 안녕하세요. 선생님……. 성당에는 어쩐 일로……?"
1003603-10 = "호, 혹시……. 아니, 역시 제가 보내 드린 그 메시지 때문에……?"
1003603-11 = "……으, 으으……."
1003603-12 = "[s3] \"……괜찮아? 상태가 안 좋아 보이는데?\"\n[s4] \"온몸에서 식은 땀이 나고 있잖아. 몸살 아냐?\""
1003603-13 = "아, 그……. 그게……. 음……."
1003603-14 = "아, 그……. 그게……. 음……."
1003603-15 = "벼, 별거 아니에요! 그냥 감기 기운이 조금 있는 거겠지요……."
1003603-16 = "감기 정도야 누구나 걸리는 거고……. 결코 못 움직일 정도는 아니라서……."
1003603-17 = "이, 이런 정도는……. 전 정말로 괜찮으니 신경 쓰지 마시고……. 아하하……."
1003603-18 = "[s5] \"일단 장소를 옮기자, 히나타.\"\n[s6] \"여기선 선생님 말 듣고 따라와 줘.\""
1003603-19 = "네, 네……?"
1003603-20 = "네, 네……?"
1003603-21 = "아, 아아……. 음……. 그……."
1003603-22 = "……네……."
1003603-28 = "……저기……. 선생님……?"
1003603-29 = "그……. 어디까지 가시는 건가요……? 여긴 구석이라 이제 아무도 없는데……."
1003603-30 = "……네?"
1003603-31 = "일부러 여기로 오신 거라고요?"
1003603-32 = "……조금은 앉아서 쉬라고요?"
1003603-33 = "으, 으음……. 그, 그렇군요. 결국 선생님께서도 제게 쉬라는 말씀을 하시러……."
1003603-34 = "저……. 그렇지만……. 아직 오늘 해야 할 일들이 남아 있는데……."
1003603-35 = "이대로 시간만 보내면, 자매님들이나 다른 분들께 폐가 될 텐데……."
1003603-36 = "[s7] \"폐가 아니야. 걱정하고 있는 거야.\"\n[s8] \"남은 일은 나도 다른 분들 도와서 대신해 줄 테니까.\""
1003603-37 = "그, 그런……! 그건 결국 제 일을 넘기는 것뿐이잖아요……!"
1003603-38 = "그, 그런……! 그건 결국 제 일을 넘기는 것뿐이잖아요……!"
1003603-39 = "저, 저는 다른 분들 일을 대신해 드리지 못하는데……. 이렇게 늘 도움만 받고……."
1003603-40 = "그럼 저는 결국……."
1003603-41 = "[s] \"……그렇지 않아. 오히려 반대지.\""
1003603-42 = "……?"
1003603-43 = "……그, 그게 무슨……."
1003603-44 = "[s] \"다들 평소 히나타에게 의지하는 거야.\""
1003603-45 = "……어……."
1003603-46 = "……저, 정말……."
1003603-47 = "정말……일까요? 정말 그런 걸까요……?"
1003603-48 = "사실 다른 분들도 늘 제게 그렇게 말해 주시고는 있지만……. 역시 실감이 안 나서……."
1003603-49 = "……선생님께서 해 주신 말씀……. 사실이라면 정말 기쁠 거 같아요."
1003603-50 = "스스로도 정말 그렇게 생각할 수 있다면……."
1003603-51 = "……아니."
1003603-52 = "……죄송해요. 그게 맞는 거겠죠."
1003603-53 = "다른 분도 아닌……. 선생님께서 해 주신 말씀이시니까요."
1003603-54 = "아하하하……."
1003603-55 = "……뭔가……. 마음이 편해지네요."
1003603-58 = "[wa:5550]― ……저기, [wa:1450]죄송했습니다. [wa:1300]선생님."
1003603-60 = "― 뭔가……. [wa:1480]폐를 끼치게 되어버려서……. [wa:170]"
1003603-63 = "[wa:1250]― 별 일 아니라고만, [wa:1550]생각하고 있었던 터라……."
1003603-65 = "― 튼튼한 몸이 자랑이었는데, [wa:3000]면목 없습니다……."
1003603-68 = "[wa:1650]― 말씀하신 대로, [wa:1950]좀 [wa:1300]쉬도록 할게요.[wa:10]"
1003603-71 = "― 그래서 [wa:1200]저기, [wa:2050]잠시동안……."
1003603-73 = "― 같이 있어 주시겠어요?"
1003603-76 = "[wa:8600]― 그런 편이, [wa:1800]마음도 더 편안하고……"
1003603-79 = "[wa:1600]― 네. [wa:1600]감사합니다. [wa:200]"
1003603-81 = "― ……선생님께선 [wa:1650]상냥하시군요."
1003603-84 = "덕분에 마음이 놓이는 거 같아요."
1003603-85 = "……알겠습니다. 오늘은 그만 돌아가서 쉬도록 할게요."
1003603-86 = "지금 이 상태로는 얼굴도 너무 달아올라 있고……. 땀도 나고……. 역시 무리인 거 같아요."
1003603-87 = "푹 쉬고 얼른 평소 같은 상태가 돼야……."
1003603-88 = "선생님 말씀대로, 다른 분들께 더 의지가 될 수 있을 테니까요."
1003603-90 = "(이후 히나타와 함께 성당을 빠져나왔다.)"
1003603-91 = "(……그리고 히나타의 상태 때문인지 또 주변에서 이상한 시선들이 느껴져, 계속 혼자 변명하는 말들을 내뱉어야 했다.)"
