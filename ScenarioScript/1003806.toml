[translation]
1003806-1 = "SRT, 강하합니다!"
1003806-4 = "조금 위험할지도 모르는 임무인데…… #n정말로 괜찮으신가요, 선생님?"
1003806-5 = "네? 저번처럼 또 엉뚱한 건물을 습격할까 걱정이 되신다고요?"
1003806-6 = "그, 그 때는 정보가 정제되지 않은 탓도 있었고……"
1003806-7 = "무엇보다 선생님이 수상한 책을 갖고 계셨기 때문에……!"
1003806-8 = "……그래도 정말 괜찮으시겠어요?"
1003806-9 = "[s] \"미야코와 함께라면 괜찮아.\""
1003806-10 = "선생님과 함께……"
1003806-11 = "그렇네요. 분명 저희 둘이 함께 있으면 아무 문제도 없을 거에요."
1003806-12 = "자, 그럼 이동할까요?"
1003806-15 = "[wa:400]― 예뻐라…"
1003806-18 = "― 야경이 너무 아름다워서"
1003806-20 = "[wa:100]― 하마터면 목적을 [wa:800]잊어버릴 뻔했네요."
1003806-23 = "[wa:200]― 후후,"
1003806-25 = "― 작전 중의 [wa:900]방심은 [wa:1000]금물입니다만…."
1003806-28 = "[wa:300]― 아, 저…"
1003806-30 = "― 갑작스럽지만, [wa:1300]선생님…"
1003806-33 = "― 그러니까… [wa:2800]언제나 함께해 주셔서"
1003806-35 = "[wa:100]― 감사합니다."
1003806-38 = "[wa:200]― 선생님이 [wa:500]계시지 않았더라면"
1003806-41 = "― 저도, [wa:800]RABBIT 소대도"
1003806-43 = "― 이만큼 성장하지 못했을 거예요. [wa:1300]"
1003806-46 = "― 그러니 다음에, [wa:1600]괜찮으시다면 [wa:1100]꼭……"
1003806-49 = "[wa:400]― 어라…? [wa:1200]연락이…"
1003806-51 = "― 그렇군요… [wa:1300]앞으로 500m 지점에…"
1003806-54 = "[wa:100]― 네, [wa:1100]곧 돌입 준비하라는 [wa:1450]연락이네요."
1003806-56 = "― 선생님, [wa:800]레펠 링과 [wa:600]하네스를 착용해주세요."
1003806-59 = "[wa:300]― 네? [wa:1100]사용법을 모르신다고요…? [wa:1560]"
1003806-61 = "― 그, [wa:900]그렇군요…"
1003806-64 = "[wa:400]― 괜찮습니다. [wa:1700]그럼 [wa:1000]여기서 기다려 주세요."
1003806-66 = "― 금방 마치고 [wa:650]돌아오겠습니다."
1003806-69 = "― 돌아와서 다시 선생님과 함께,"
1003806-71 = "― 천천히 [wa:600]이 야경을 보고 싶어요."
1003806-74 = "(그리고 미야코는 멋지게 레펠을 타고 건물로 내려갔다.)"
1003806-78 = "(잠시 후, 임무를 무사히 수행하고 돌아온 미야코와 함께 샬레로 복귀했다.)"
