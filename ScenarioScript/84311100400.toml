[translation]
84311100400-5 = "고생했어. 그리고 미안해."
84311100400-6 = "경보를 포함해 그 이후의 상황들은 나조차도 전혀 예상하지 못했던 부분이야. 조금 더 면밀이 파악을 했어야 하는데……"
84311100400-7 = "다시 한번 정말로 미안해. 내가 두 사람을 위험에 빠뜨렸어."
84311100400-8 = "사과하실 일은 아니라고 생각해요. 오히려 지금까지가 너무 완벽했던 거고, 보통의 잠입은 이런 느낌일 테니까요."
84311100400-9 = "……? 뭐야, 왜 내가 할 말을 네가 해? 그리고 그걸 어떻게 알았어?"
84311100400-10 = "짧긴 하지만, 저도 이번 일들을 하며 예외적인 상황들을 몇 번 봐 왔으니까요."
84311100400-15 = "……야."
84311100400-16 = "……너 혹시 C&C에 올 생각 있어?"
84311100400-21 = "네루……! 상대는 트리니티의 티파티 수장들 중 하나야! 그런 말은 학교 간의 문제로 이어질 수도……!"
84311100400-23 = "아뇨, 아뇨. 전혀 그런 일로 이어지진 않습니다. 순수한 칭찬으로 듣고 감사드릴게요, 네루."
84311100400-24 = "여기서는 그만큼 저를 좋게 봐주셨다는 의미로만 알고, 순수하게 기뻐하도록 하겠습니다."
84311100400-25 = "실제로 그런 의미기도 하고요. 진짜로 오라는 건 아니니까요."
84311100400-26 = "뭐, 그렇지. 여기서 그 말을 진짜 오라고 이해하는 바보는 리오 정도뿐일 테니."
84311100400-28 = "…………."
84311100400-29 = "시연장의 경비가 강화된 건 아무래도 세미나의 작전이었던 것 같다."
84311100400-30 = "아무래도 베리타스…… 혹은 초현상 특무부까지 연계돼 감시 시스템을 강화했던 것으로 보이는군."
84311100400-34 = "리오……? 말투가 조금 변했는데요."
84311100400-35 = "삐쳐서 그래, 신경 쓰지 마."
84311100400-37 = "아니, 난 삐치지 않았다. 그런 유치하고 얄팍한 화법으로 나를 자극하려 해도 소용없어."
84311100400-42 = "삐쳤네요."
84311100400-43 = "삐쳤다니까."
84311100400-45 = "아니라고 했어."
84311100400-50 = "……아니라고."
84311100400-53 = "(이후 잔뜩 삐쳐 있던 리오를 잘 달래주고, 사이 좋게 헤어졌다.)"
