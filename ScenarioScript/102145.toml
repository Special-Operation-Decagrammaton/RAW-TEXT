[translation]
102145-3 = "코하루!"
102145-6 = "코하루 씨! 괜찮으신가요?"
102145-8 = "하, 하스미 선배……, 마시로……."
102145-10 = "됐어! 살았어! 정의실현부야!"
102145-11 = "도와주러 오셨군요! 저 마녀가……!"
102145-15 = "……미카 님."
102145-16 = "응, 코하루는 괜찮아. 조금 다치긴 했지만……."
102145-17 = "……."
102145-18 = "……. 뭐야, 딱히 난 아무 짓도 안 했다구? 이번에는. 응."
102145-19 = "네. 마, 맞아요……. 하스미 선배…… 저기…… 저분은…… 절 구해준 거니까……."
102145-20 = "가시죠, 코하루 씨."
102145-21 = "으, 으응……."
102145-22 = "잘 가, 코하루 쨩."
102145-25 = "……. 도와주셔서 감사합니다. 미카 님."
102145-26 = "어라, 감사 인사를 받을 줄은 몰랐는데……."
102145-27 = "……네, 하지만 누구나 마땅한 행동에 대해 감사를 받을 권리가 있으니까요."
102145-28 = "……뭐, 그러네."
102145-29 = "그럼 아직 다른 해야 할 일이 많으니까, 난 이만 가볼게."
102145-30 = "그럼 다음에 또 봐, 하스미 쨩."
102145-34 = "……."
102145-36 = "다음화;제4 성소 공략 - 카타콤 내부 바실리카"
