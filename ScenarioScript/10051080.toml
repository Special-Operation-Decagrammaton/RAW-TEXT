[translation]
10051080-1 = "제8화;각자의 자리에서"
10051080-2 = "화보 촬영장"
10051080-4 = "(흐에에…… 이게 얼마 만의 쉬는 시간이죠…….)"
10051080-5 = "(힘들어요…….)"
10051080-6 = "(대체 화보 촬영은 언제 끝나는 걸까요…….)"
10051080-7 = "(조명들은 피부가 따가울 정도로 강하고…… 신발은 예쁘긴 하지만 계속 신고 있으면 발이 너무 아프고…….)"
10051080-8 = "(무엇보다 이 화장…… 너무 두꺼워서 피부가 답답해요…….)"
10051080-9 = "(저…… 대체 언제쯤 돌아갈 수 있을까요……?)"
10051080-17 = "오호, 잘하고 있나?"
10051080-18 = "네?!"
10051080-19 = "그래, 잘하고 있다니 다행이군."
10051080-20 = "네? 아니, 그, 잘하고 있는 게 맞나요?"
10051080-21 = "그냥 하라는 대로 하는 것뿐이긴 한데……."
10051080-22 = "따라오고 있다면 잘하고 있는 것이다."
10051080-23 = "따라오고 있다면……."
10051080-24 = "저, 저기, 그런데……."
10051080-25 = "음?"
10051080-26 = "저…… 인제 그만 돌아가면 안 될까요?"
10051080-27 = "돌아간다고? 어디로 말이지?"
10051080-28 = "그 닌자부인가 뭔가 하는 곳으로 말인가?"
10051080-29 = "예, 인법연구부요……."
10051080-30 = "즉, 원래 있던 곳으로 돌아가고 싶다, 라고 말하는 것이군."
10051080-31 = "그럼 내가 한번 물어보지. 자네는 거기서 무엇이었지?"
10051080-32 = "예……?"
10051080-33 = "그곳에서 자네는 어떤 존재였지? 어떤 쓸모가 있었지? 그 조직에 무엇을 줄 수 있었지?"
10051080-34 = "예?! 그, 그건……."
10051080-38 = "봐라. 이건 오늘 너를 찍은 사진들이다."
10051080-39 = "……!"
10051080-40 = "어떠냐? 미적 감각이 전혀 없는 사람이라도 이 사진들을 보면 똑같이 답할 것이다."
10051080-41 = "아름답다, 라고."
10051080-42 = "……."
10051080-43 = "츠쿠요, 너는 우리에게 있어 최고의 모델이다."
10051080-44 = "그리고 그게 네가 여기에 있어야 하는 이유다. 너의 진정한 가치는, 이곳에서 가장 빛나니까."
10051080-48 = "……이 옷의 진정한 가치를 끌어내어 줄 수 있는 곳으로 옮겨 놓을 뿐이다!"
10051080-51 = "진정한…… 가치……."
10051080-52 = "물론 선택은 너의 자유다. 그저 편안하기만 한 곳에 있을 것인지, 가장 가치 있을 수 있는 곳에 있을 것인지."
10051080-53 = "그, 그건……."
10051080-54 = "그리고 말인데, 사실 이미 너를 메인으로 세울 패션쇼도 기획 중이다."
10051080-55 = "예?!"
10051080-56 = "장소는 다시 한번 백귀야행 자치구. 그곳에서 새해를 기념하는 패션쇼를 개최할 예정이다."
10051080-57 = "그, 그, 그런데 그런 큰 행사에 저를 내보내신다고요?!"
10051080-58 = "물론이다. 너보다 더 적절한 모델은 없어."
10051080-59 = "아무튼 들은 것으로 알고, 일을 진행하도록 하지."
10051080-63 = "저, 저기, 그, 저……!"
10051080-70 = "디자이너님, 식사 도착했습니다."
10051080-71 = "뭐야, 이제야 온 거야? 왜 이렇게 늦었어?"
10051080-72 = "죄송합니다. 배달부가 오는 길에 망량즈의 습격을 받아서……."
10051080-73 = "하여튼 이 불량 학생들……"
10051080-74 = "그런데 요즘 유독 나한테 오는 배달이 습격을 많이 받는 것 같지 않나?"
10051080-75 = "예, 확실히 좀 그런 느낌이 있긴 한데……."
10051080-76 = "뭐 됐어. 내가 과민반응을 하는 것일 수도 있지."
10051080-77 = "아무튼, 주문한 메뉴가 어떻게 되지?"
10051080-78 = "라멘과 볶음밥, 그리고 교자입니다."
10051080-79 = "좋군. 고생을 했으면 배에 기름칠해 줘야지. 가자고."
10051080-85 = "아, 자네 식사는 따로 옆방에 차려뒀어."
10051080-86 = "예……?"
10051080-87 = "뭘 그렇게 놀라나? 자네도 이제 모델이니, 식단에 신경을 쓰는 것은 당연한 일."
10051080-88 = "제로 칼로리 곤약국수와 샐러드를 준비해 두었으니 그걸 먹도록. 우리 따라오지 말고."
10051080-89 = "예?! 조금 전에는 따라오고 있다면 잘하는 거라면서요?!"
10051080-90 = "당연히 이것까지 따라오라는 건 아니었지!"
10051080-91 = "그럼 즐거운 식사 되게나."
10051080-92 = "아 매니저, 그래서 무슨 라멘이라고?"
10051080-93 = "늘 드시던 대로 준비했습니다. 면은 가늘게, 비계 토핑은 빼고, 국물은 맵지 않게요."
10051080-94 = "훌륭하군."
10051080-95 = "자, 잠깐만요?!"
10051080-100 = "촬영장 옆방"
10051080-101 = "으우우……."
10051080-102 = "너무해요…… 저녁 식사로 곤약국수와 샐러드가 끝이라니……."
10051080-103 = "자기들은 라멘에 볶음밥에 교자까지 얹어서 먹으면서……."
10051080-104 = "거기다 압수해 간 폰은 돌려주지도 않고……."
10051080-105 = "……."
10051080-106 = "라멘…… 먹고 싶다……."
10051080-107 = "부장님이랑…… 이즈나 쨩이랑……. 선생님이랑……."
10051080-108 = "면은 극태면으로, 돼지비계도 추가하고, 마지막엔 고추기름도 둘러서…… 헤헤."
10051080-109 = "닌자에게 라멘이란 그런 거니까……."
10051080-110 = "……."
10051080-116 = "모델…… 그리고 닌자……."
10051080-117 = "그런데 정말로 나한테는…… 닌자보다 모델이 더 어울리는 걸까?"
10051080-118 = "모델의 길을 택하는 쪽이 더 가치 있는 사람이 되는 일일까?"
10051080-119 = "……나는 정말로, 인법연구부에서 아무런 가치도 없던 존재였던 걸까?"
10051080-121 = "흐우우…… 모르겠어……."
10051080-122 = "누가…… 답을 좀 알려주세요……."
10051080-124 = "백귀야행 모처의 라멘집"
10051080-126 = "(몇 시간 뒤 촬영이 끝나고 미치루, 이즈나와 함께 라멘집으로 갔다.)"
10051080-130 = "스으읍…… 이 실로 그윽한 돈코츠의 냄새……."
10051080-131 = "역시, 촬영 후에는 라멘을 먹어 줘야지."
10051080-132 = "이즈나도 그렇게 생각합니다!"
10051080-133 = "[s] \"오늘은 내가 살 테니까, 다들 마음 편하게 먹어.\""
10051080-134 = "후후, 선생 공이 그렇게까지 말한다면 평소보다 살짝 더 사치를 부려볼까!"
10051080-135 = "여기! 주문!"
10051080-136 = "예! 어떻게 주문하시겠습니까?"
10051080-137 = "응, 라멘 네 그릇이랑, 교자도 한 접시."
10051080-138 = "그리고 라멘의 옵션은……"
10051080-139 = "면은 극태면으로, 돼지비계 토핑 추가, 그리고 고추기름 둘러서. 맞으시죠?"
10051080-140 = "헉?! 그걸 어떻게?!"
10051080-141 = "하하! 우리 닌자분들은 올 때마다 그렇게 드시지 않았습니까!"
10051080-142 = "그리고 저번에 그 진상 손님들 쫓아준 것에 대한 감사로, 아예 그 구성을 <닌자 정식>이라는 신메뉴로 출시해 버렸죠!"
10051080-143 = "앞으로 주문할 때는 편하게 <닌자 정식>으로 주문해 달라고요!"
10051080-145 = "헉……!"
10051080-146 = "드디어 세상이 닌자를 알아주기 시작한 건가……!"
10051080-147 = "그런데, 늘 같이 오던 다른 한 분은 늦게 오시는 건가요? 보이질 않으시네요?"
10051080-148 = "엥? 그게 무슨……."
10051080-149 = "아 맞다, 지금 츠쿠요는 없지……!"
10051080-150 = "라멘 네 그릇은 세 그릇으로 바꿔 주세요!"
10051080-152 = "예! 주문받았습니다!"
10051080-157 = "어쩐지 자연스럽게 츠쿠요 것까지 시켜 버렸네."
10051080-158 = "이즈나도 이상함을 못 알아챘습니다……."
10051080-159 = "보고 싶다, 츠쿠요……."
10051080-160 = "그러고 보니 부장, 안 그래도 아까 말하려고 했습니다만……."
10051080-161 = "이거 보셨습니까?"
10051080-162 = "뭔데?"
10051080-163 = "몇 분 전에 츠쿠요 공의 화보 촬영 영상이 올라왔습니다!"
10051080-164 = "……!"
10051080-165 = "어디 어디? 같이 보자!"
10051080-166 = "예!"
10051080-171 = "(그렇게 미치루, 이즈나와 함께 한참 동안 츠쿠요의 화보 촬영 영상을 보았다.)"
10051080-173 = "……."
10051080-174 = "이야…… 츠쿠요한테 이런 과감한 모습이 있었을 줄이야."
10051080-175 = "그런데 잠깐만, 이 영상 조회수가……."
10051080-179 = "잠깐만, 이 정도의 조회수가 달성이 가능한 거였어?!"
10051080-180 = "내가 숫자 잘못 센 거 아니지?"
10051080-181 = "올라온 지 몇 분 되지도 않았는데 이 정도의 조회수라고?!"
10051080-182 = "……저희 채널 총 조회수보다 츠쿠요의 이 영상 한 편 조회수가 더 높습니다, 부장."
10051080-183 = "……."
10051080-184 = "정말로 다른 세상의 일 같아요, 부장……."
10051080-185 = "다른 세상, 이라니……."
10051080-192 = "……."
10051080-193 = "저기, 이즈나 쨩."
10051080-194 = "네 부장?"
10051080-195 = "츠쿠요는…… 돌아올 생각이…… 없겠지?"
10051080-196 = "네?!"
10051080-197 = "자, 오래 기다리셨습니다!"
10051080-198 = "그럼 맛있게 드십시오!"
10051080-202 = "드디어 나왔군, <닌자 정식>……."
10051080-203 = "저기, 부장 조금 전에 분명……."
10051080-204 = "자, 일단 먹자! 내가 말한 건 너무 신경 쓰지 말고!"
10051080-206 = "잘 먹을게, 선생 공!"
10051080-207 = "자, 잘 먹겠습니다, 주군!"
10051080-209 = "(그렇게, 이날은 평범하게 라멘을 먹고 헤어졌다.)"
10051080-210 = "(그런데 며칠 뒤…….)"
10051080-217 = "주군, 주군!"
10051080-218 = "[s] \"무슨 일이야, 이즈나?\""
10051080-219 = "그…… 그……"
10051080-220 = "부장이 이상합니다……!"
