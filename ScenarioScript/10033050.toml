[translation]
10033050-1 = "제5화;꽃구경도 식사 후에"
10033050-2 = "마음껏 즐기고 만끽하다 보니 어느덧 이런 시간……."
10033050-3 = "그렇지요! 아무리 멋진 일이 기다리고 있다 해도, 배가 고파서는 아무것도 할 수 없는 법이죠."
10033050-4 = "그래서 저희는 백귀야행의 전통이 담긴 이 식당으로, 게헨나 여러분을 모셨답니다!"
10033050-6 = "부디 이 식당에서, 백귀야행의 정취와 매력, 그리고 미식을 한껏 즐기셨으면 합니다!"
10033050-11 = "후후후……."
10033050-12 = "미식이라……. 그렇군요. 간과할 수 없는 표현을, 지금 저희는 들은 것 같습니다."
10033050-13 = "[ns] \"하루나?!\""
10033050-14 = "하루나!?"
10033050-15 = "물론 이 식당의 음식에 흠잡을 곳이 없다는 것은 인정합니다."
10033050-16 = "하지만 정해진 곳에서 정해진 음식만을 먹는 것을, 진정한 미식이라고 할 수 있을까요?"
10033050-17 = "미식은 아름다운 것, 나아가 탐구할 가치가 있는 것, 우리가 마땅히 도전해야 할 것이 아닐까요?"
10033050-18 = "[s] \"무슨 말을 하고 싶은 거야, 하루나?!\""
10033050-19 = "즉, 모처럼 백귀야행까지 왔는데 이것저것 맛있는 것을 더 먹어 봐야 하지 않겠느냐는 이야기죠★"
10033050-20 = "완전 찬성! 나도 갈래!"
10033050-24 = "뭐, 이렇게 된 이상 어쩔 수 없으려나."
10033050-29 = "쟤들 또 저러네……."
10033050-30 = "그런데 왠지 재미있어 보이지 않아?"
10033050-31 = "어떡할래. 따라갈래?"
10033050-32 = "그러지, 뭐!"
10033050-37 = "잠시만요, 여러분! 그렇게 무턱대고 나가시면 일정이…… 순서가……!"
10033050-38 = "어, 어어어, 어떡하죠. 선생님?!"
10033050-39 = "[s] \"일단, 따라가자!\""
10033050-42 = "으흠. 간장의 맛이 매우 진한 닭꼬치군요. 거기에 살짝 풍겨 나오는 생강의 향이 풍미를 한층 더해 주네요."
10033050-43 = "와! 안에 몬쟈야키가 들어간 만쥬야! 이런 건 처음 먹어 봐! 여기엔 무슨 소스가 어울릴까……. 역시 와사비와 칠리소스일까?"
10033050-44 = "아, 이 오징어구이는 양이 제법 되네요. 만족스러워요. 한 마리를 통째로 쓴 것도 마음에 들지만, 무엇보다 대왕오징어를 쓴 게 합격점이네요."
10033050-45 = "아하……? 열 마리를 5분 안에 완식하면 무료라고요? 그런 멋진 소식이★"
10033050-46 = "주먹밥과 튀김을 한 자리에 올려서, 튀김덮밥을 먹는 느낌으로 즐기라고……? 알 것 같기도 모를 것 같기도……."
10033050-47 = "그러면 우선 튀김부터 먹어 볼까?"
10033050-51 = "……우와앗?!"
10033050-52 = "좋습니다. 이 구역의 노점은 대충 전부 제패한 것 같군요."
10033050-53 = "그러면, 여러분. 다음 코너의 노점으로 가 보도록 하죠!"
10033050-54 = "찬성!"
10033050-61 = "웅……. 찾았네……. 선생님, 여기야……."
10033050-62 = "[s] \"고마워, 츠바키! 다들, 이쪽으로!\""
10033050-63 = "헉, 헉……! 저분들은 도대체 뭐죠?"
10033050-64 = "엄청난 속도입니다! 저희가 따라가는 것보다 더 빠르게, 모든 노점을 정복할 기세입니다!"
10033050-66 = "우와앙–! 나만 두고 가지 마–!"
10033050-67 = "선생님, 이러다 또 놓치고 말겠어요! 빨리 움직이죠!"
10033050-71 = "다음번 목표로 삼은 노점 구역에 도착했습니다만……."
10033050-72 = "이 구역의 음식들은…… 뭐라고 해야 할까요. 맛이 참…… 개성적이군요?"
10033050-73 = "특히 이 엄청나게 매운 닭꼬치라든가, 단맛은커녕 시고 떫은맛밖에는 느껴지지 않는 사과 사탕이라든가……."
10033050-74 = "응! 난 그래서 마음에 드는걸? 이렇게 독특한 맛, 다른 곳에서는 좀처럼 먹지 못하니까!"
10033050-75 = "(뭐라고? 이게…… 마음에 든다고? 그렇다면……!)"
10033050-76 = "자, 자아! 이번에 준비한 음식은! 매실장아찌 액기스를 한층 더 열 배나 더 농축시킨! 슈퍼 매실장아찌 소스를 바른 주먹밥입니다!"
10033050-81 = "와! 머리가 찡하고 울릴 정도로 강렬하게 새콤한 맛이네! 마음에 들어!"
10033050-85 = "(이럴 수가……! 그렇다면 이건 어떠냐!)"
10033050-86 = "자, 자! 드세요! 쿠사야 잼을 듬뿍 바른 토스트입니다!"
10033050-90 = "생선 특유의 냄새와 새큼한 냄새가 뒤섞여…… 그것을 잼으로 한층 더 농축시켰네!"
10033050-91 = "꼭 스프레드 같아! 맛있어!"
10033050-92 = "하우카르틀 소바!"
10033050-93 = "응, 응!"
10033050-94 = "삭힌 청어 라멘!"
10033050-95 = "감칠맛이 독특해!"
10033050-97 = "……해삼 타코야키 바닐라 파르페!"
10033050-98 = "그만! 그건 판매가 허가되지 않은 음식이잖아요! 방금 확인했다고요!"
10033050-100 = "칫……!"
10033050-104 = "아뇨. 그렇지 않습니다."
10033050-105 = "네?!"
10033050-106 = "설사 허가되지 않은 음식이라고 해도…… 현장에서의 새로운 만남으로, 완전히 새로운 음식과 만나는 것 또한, 수학여행 현지에서의 여흥이자 미식 여행!"
10033050-107 = "그것을 방해하겠다면, 저희 미식연구회, 가만히 두고 보지 않겠습니다!"
10033050-108 = "옳소! 엄청나게 맛있었다구!"
10033050-109 = "그걸 맛있게 먹을 수 있는 건 너 정도야!"
10033050-110 = "뭐, 관광지에서 우연히 마주하는 난동이라는 거군요★ 이것도 제법 취향이에요."
10033050-112 = "아니, 안 되거든?! 애초에 허가받지 않은 음식을 판다는 것 자체가 말이지!"
10033050-113 = "그런가요. 아쉽습니다. 후우카 씨. 당신이라면 분명 저희 미식연구회를 이해해 줄 것이라고 생각했는데 말이지요."
10033050-114 = "이해할 수 있는 게 있고, 아닌 게 있어!"
