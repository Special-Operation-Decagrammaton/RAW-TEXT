[translation]
10050080-1 = "제8화;고서관 전쟁"
10050080-2 = "[ns] \"어? 정의실현부 학생들이, 여길 어떻게?!\""
10050080-3 = "거기까지는 모르겠고, 결국 어디선가 꼬리를 잡혔나 봐!"
10050080-4 = "선생님 말대로, 정의실현부 아이들이랑 같이 다니고 있었는데……."
10050080-13 = "……그래서, 일단 선생님한테 전화해 본 거야……."
10050080-14 = "[s] \"고마워, 코하루! 역시 코하루 최고!\""
10050080-15 = "그, 그래? 에헤헤……."
10050080-16 = "아니, 좋아하고 있을 때가 아니지! 이제 어떡하지, 선생님?"
10050080-17 = "응? 시미코 씨에게도 연락을……? 그, 그렇네! 도서부 일이기도 하니까! 알았어, 선생님!"
10050080-22 = "빨리…… 빨리……!"
10050080-26 = "안녕하세요. 코하루 씨. 무슨 일인가요?"
10050080-27 = "큰일 났어, 시미코 씨!"
10050080-28 = "네……?"
10050080-30 = "진짜 큰일 났네요!!!"
10050080-31 = "그러니까 말했잖아!"
10050080-32 = "아뇨, 이건 코하루 씨가 상상하는 그런 수준이 아니에요!"
10050080-33 = "……에?"
10050080-34 = "설명할 시간이 없어요. 어쨌든, 저는 최대한 빠르게 고서관으로 향할 테니……."
10050080-35 = "코하루 씨는 일단 몸을 피해 주세요."
10050080-36 = "정의실현부 분들은 우이 선배랑 상극 그 자체니까요!"
10050080-37 = "어? 나는 왜……?"
10050080-38 = "……코하루 씨가 고서관으로 가게 되면, 이른바 고래 싸움에 새우 등 터지는 격이 될 거예요……."
10050080-40 = "거기에 최악의 경우, 밀고자 취급까지 받을 수 있어요!"
10050080-41 = "아셨죠? 모든 것이 마무리될 때까지, 가능한 한 이 사건으로부터 떨어져 주세요!"
10050080-45 = "고래 싸움에 새우 등……. 밀고자……. 응…… 틀린 말은 아니겠지만……."
10050080-46 = "……."
10050080-47 = "……아니야. 그래도, 가야 해."
10050080-48 = "왜냐하면, 그게 옳은 일이니까."
10050080-57 = "선생님……? 표정이 왜 그러시죠……?"
10050080-58 = "[s] \"우이! 여기 있었구나! 잘 들어. 지금부터–\""
10050080-62 = "……또 뭐야. 정말이지……."
10050080-63 = "잠시만요……. 선생님. 누구인지 모르겠지만…… 한마디 해 주고 올게요……."
10050080-64 = "[s] \"아, 아니. 그게 아니라–\""
10050080-65 = "계신가요, 코제키 우이 부장님? 정의실현부의 마시로입니다."
10050080-66 = "정의…… 실현부? 어째서……."
10050080-67 = "안녕하세요, 우이 부장님. 오래간만에 인사드립니다."
10050080-68 = "……왜 왔어요?"
10050080-69 = "네, 다름이 아니라……."
10050080-70 = "여기에 수상한, 비인가 서적이 입고되었다는 첩보를 입수했기 때문입니다!"
10050080-71 = "비인가 서적……?"
10050080-72 = "……그래서요?"
10050080-77 = "네! 그런 이유로……. 지금부터 고서관을 '전수조사'하고자 하니, 협조 부탁드립니다!"
10050080-82 = "……뭐?"
10050080-83 = "전수조사? 갑자기 무슨 전수조사……??"
10050080-84 = "아니, 잠깐만. 가만있어 봐. 지금 뭘……. 한다고?"
10050080-85 = "전수…… 조사?"
10050080-86 = "그러니까 지금…… 여기……."
10050080-87 = "고서관을?"
10050080-88 = "네, 그렇습니다!"
10050080-89 = "그러니까 지금……."
10050080-90 = "데려가겠다……고? 이 아이들을? 전부?"
10050080-91 = "……네?"
10050080-92 = "네, 뭐. 필요하다면, 그럴 수도 있을 거 같습니다."
10050080-93 = "어쩌면 비슷한 말이 되겠네요. 그런데…… 왜 그러시죠?"
10050080-97 = "그런 연유로, 협조를 부탁드립니다!"
10050080-98 = "마음에 걸리는 것 없이, 모든 일에 당당하게 정의롭다면, 숨길 것은 아무것도 없지 않–"
10050080-99 = "헛소리 집어치워–!!!"
10050080-103 = "이것들이 보자 보자 하니까! 뭐가 어째? 우리 아이들을 데려가겠다고!? 여기가 어딘 줄 알아!?"
10050080-104 = "너희들 똑똑히 들어!!"
10050080-105 = "여기 있는 책…… 우리 아이들한테 손가락 하나라도 대면, 한 권마다 너희들의 손목을……!!"
10050080-106 = "아, 안 됩니다! 방금 그 말씀은, 정의실현부의 집행을 물리적으로 막으시겠다는 협박……!"
10050080-107 = "그건 옳지 않습니다! 용납될 수 없–"
10050080-108 = "누가 할 소리인데!?! 어차피 너희들 뒤에 티파티가 있는 거 다 알고 있어!"
10050080-109 = "티파티…… 권위에 찌들어 은폐와 음모밖에 모르는 것들……!"
10050080-110 = "알겠어! 이제는 서적 조사를 핑계로, 이 고서관까지 자기들 세력권으로 편입하겠다는 거겠네! 내 말 맞지?"
10050080-111 = "……예, 예? 아, 아뇨! 절대 그런 의미가……!"
10050080-112 = "저기요! 이쪽은 지금 공무를 수행하는 중이란 말이에요!!!"
10050080-113 = "맞아, 맞아! 계속 그렇게 나오시면 힘으로라도……!!!"
10050080-125 = "모두 잘 들어. 그리고 돌아가서 똑똑히 전해……."
10050080-126 = "여기 있는 아이들은 내 허락 없이 한 페이지도 밖으로 나갈 수 없어. 내가 있는 한 그 꼴은 못 본다고."
10050080-127 = "바꿔 말해서, 정 그렇게 하고 싶으면."
10050080-128 = "……내 시체를 넘어서 가야 할 거야."
10050080-133 = "……알겠습니다."
10050080-134 = "우이 부장님께 협조의 의사가 전혀 없다는 것만은 확실하게 알 것 같습니다."
10050080-135 = "동시에, 티파티의 명령과 정의실현부에 대한, 코제키 우이 부장님의 적의 및 위협 행위가 명백해졌다고 판단되기에."
10050080-136 = "지금부터 정의실현부는, 불가피한 정의 집행에 들어가겠습니다."
10050080-137 = "아, 그래? 그러면 그렇게 해야지."
10050080-138 = "……이거 [ruby=・]오[/ruby][ruby=・]랜[/ruby][ruby=・]만[/ruby][ruby=・]이[/ruby][ruby=・]네[/ruby]. 어디, 한번 해 보자고."
10050080-149 = "……갑니다!!"
10050080-154 = "[ns] \"그만둬어어어어어!\""
10050080-155 = "멈추세요!!!"
10050080-156 = "시미코?"
10050080-157 = "선생님?"
10050080-158 = "여러분! 여기에는 많은 오해가 있어요! 차근차근 서로 이야기하면 알 수 있을 거예요!"
10050080-159 = "그, 그런가요……?"
10050080-164 = "선생님? 시미코 씨? 모두 괜찮아?!"
10050080-165 = "어? 코하루 씨? 코하루 씨가 여기에 왜……?"
10050080-166 = "제가 안 오는 게 좋을 거라고 말씀드렸던 것 같은데요……?"
10050080-167 = "그, 그치만……. 그러면 안 되는 거잖아! 아닌 건 아닌 거야!"
10050080-168 = "아니, 대체 얼마나 더 몰려오는 거야. 이게 무슨 시장통도 아니고……!"
10050080-169 = "그리고 시미코! 너도 역시 그쪽이었던 거야?"
10050080-170 = "내통자가 있을지도 모른다고 생각했지만, 그게 너였어?!?! 세상에 믿을 사람 하나 없다더니–"
10050080-179 = "끄아악–!! 시, 시미코……!!"
10050080-180 = "선배!! 그새를 못 참고 벌써!! 그리고 뭐라고요? 내통자요? 남의 사정도 모르고서는……!"
10050080-181 = "무엇보다 다짜고짜 사람들을 쏘면 안 되잖아요, 상식이잖아요!! [ruby=・]또[/ruby] 몇 명이나 보내려고……!!"
10050080-182 = "아, 아니……! 나는 그저……!!"
10050080-183 = "문답 무용!!"
10050080-192 = "끄아아아악-!!"
10050080-194 = "어…… 음……."
10050080-195 = "분위기가 상당히 어수선해졌습니다만, 정의실현부의 목적은 아직 달성되지 않았습니다."
10050080-196 = "저희는 비인가 도서를 추적해야 합니다. 그리고 그 도서는 이곳에 있을 가능성이 크다는 결론을 내렸습니다."
10050080-197 = "인가되지 않은 서적이 트리니티에 유통되는 것은, 근본적으로 두고 볼 수 없는 일이니……."
10050080-198 = "네, 저도 그 말에는 동의해요. 여러분의 행동을 막으려는 게 아닙니다."
10050080-199 = "그렇지만 그 말은 거꾸로 이야기해서–"
10050080-205 = "모두, 죄송합니다."
10050080-206 = "수, 숨어 있으라고 했을 텐데?! 요……?"
10050080-207 = "네, 그렇게 말씀해 주셨지만……. 역시, 그건 아니라고 생각해요. 따지고 보면, 모두 저희 때문에 이렇게 된 것이니까요."
10050080-208 = "저희를 도와주시는 건 너무나도 감사하지만, 아무리 그래도 저희 때문에 같은 학교 학우분끼리 싸움이 일어나는 건 원하지 않아요."
10050080-209 = "자, 부장님도 어서 나오세요. 제대로 말씀드려야죠."
10050080-210 = "아~아 적당히 잘 들어왔던 것처럼, 적당히 잘 빠져나가서, 아무 일도 없었던 것으로 하고 싶었는데 어쩔 수 없네요."
10050080-211 = "……부장님?"
10050080-212 = "정말 죄송합니다……."
10050080-213 = "안녕하세요, 트리니티 여러분. 저희는 붉은겨울에서 온, 출판부라고 합니다."
10050080-214 = "출판?"
10050080-215 = "부?"
10050080-216 = "그렇습니다. 우선 왜 이런 일이 일어났는지, 그리고 왜 이런 일을 벌이게 되었는지를 말씀드려야 하겠지요."
10050080-217 = "사실, 저희는–"
10050080-219 = "어…… 그러니까…… 제가, 일단 이야기를 간추려 보겠습니다."
10050080-220 = "결국 출판부 여러분은, 굶어 죽어 가고 있는 지식해방전선 학생분들을 돕기 위해."
10050080-221 = "새로운 서적 판로를 찾으러 트리니티까지 오셨다는 말씀이신…… 건가요?"
10050080-222 = "뭐…… 딱히 그 애들을 돕는다기보다는, 그 뭐냐, 돈을–"
10050080-223 = "부장님?"
10050080-224 = "죄송합니다……."
10050080-225 = "그렇지만 뭐라고 할까요. 어떤 의미에서는……."
10050080-226 = "우리 붉은겨울에서 만들어진 문화 매체를, 더 많은 사람에게 소개할 수 있으면 어떨까 하는 마음도 있었죠."
10050080-227 = "그 책, 붉은겨울에서는 반쯤 닳고 닳은 패턴이라 수요가 없기도 했었고."
10050080-228 = "그리고 다행스럽게도, 적지 않은 트리니티 학생분들이 좋아해 주셨던 것 같고요."
10050080-229 = "그건…… 확실히 그랬습니다만……."
10050080-230 = "그 때문에 저희 정의실현부가, 도서부와의 합동 작전으로 해당 서적들의 추적을 개시할 수밖에 없던 것이었지요……."
10050080-231 = "설마, 우리 트리니티 학생분들이 붉은겨울의 도서부 여러분을 돕고 있었다니……."
10050080-232 = "이래서야 수사가 난항에 난항을 겪었던 것도, 당연한 일이었겠네요……."
10050080-233 = "그런 일이…… 있었어, 시미코……?"
10050080-234 = "네, 부장님. 그러니까 제발 바깥소식에도 좀 신경을 써 주세요."
10050080-235 = "이 일도 원래, 제가 아니라 부장님께서 하셔야 했던 일이었다고요?"
10050080-236 = "그, 그그그, 그만둬……. 그건 나에게 너무, 가혹한 일이야……."
10050080-237 = "아무튼, 저는 문화는 계속 순환해야 한다고 생각해요."
10050080-238 = "고여서 정체된 문화는, 결국 그 집단을 나아가지 못하게 하는 폐단이 되기 마련이죠."
10050080-239 = "돈도 별로 안 되기도 하고요."
10050080-240 = "물론 저희가 처음부터 그렇게 거창한 뜻을 가지고 트리니티까지 온 것은 아니지만."
10050080-241 = "좋아해 주시는 트리니티 학생분들의 모습을 보면서, 많은 생각을 하게 되더군요."
10050080-242 = "어? 정말로 그러셨던 건가요, 부장님?"
10050080-243 = "흐음…… 이렇게 대답하도록 하죠. 어떤 것은 이야기하지 않는 것으로, 비로소 완성에 다가가기 마련이라고요."
10050080-244 = "윽, 그 말을 이렇게 돌려주시다니……!"
10050080-245 = "겉치레로 부장을 하고 있는 것은 아니랍니다? 힛. 힛. 히."
10050080-247 = "하지만, 역시 비인가라는 부분은 여전히 남아 있습니다만……."
10050080-251 = "[ns] \"그거, 도서부가 인가하면 되지 않을까?\""
10050080-252 = "도서부 여러분이요……?"
10050080-253 = "네. 결국 트리니티에서 유통되는 모든 책에 대해 책임질 의무는, 도서부에 있죠."
10050080-254 = "만일 출판부 분들이 가져온 이 책들이, 도서부의 정식 인가를 받는다면, 더 이상 비인가 도서가 아니게 되기도 할 거고요."
10050080-255 = "물론 트리니티의 형편에 맞게 다소의 수위 조율은 필요할 것으로 보이지만요."
10050080-256 = "역시, 이 정도로도 강했던 거구만요……."
10050080-257 = "어렴풋이 느끼고는 있었어요……."
10050080-262 = "[ns] \"그렇게 절차를 지키는 것도, '정의'가 아닐까?\""
10050080-263 = "그런 해석도 가능하군요! 많은 공부가 되었습니다!"
10050080-264 = "정의가 무너진 것 같은 자리에서도, 과정을 거치는 것으로 새 정의를 세울 수 있다……."
10050080-265 = "역시 선생님이십니다! 감사합니다!"
10050080-266 = "[s] \"어, 응……. 그래. 그런 걸로 하자.\""
10050080-267 = "그러고 보니, 부장님이 보시기엔 어떠셨나요? 이번 책."
10050080-268 = "어어? 왜, 왜 나에게……."
10050080-269 = "이미 다 읽어 보셨을 것 아니에요. 맞죠?"
10050080-270 = "어떻게, 안 거야……."
10050080-271 = "후후. 제가 부장님과 얼마나 많이 일해 왔다고 생각하시나요."
10050080-272 = "못 숨기겠다니까……."
10050080-273 = "하아…… 뭐어, 좋은 책이었습니다. 적어도 제가 보기에는요."
10050080-274 = "출판부 분들도, 진심인 부분이 있다는 것도 알았고……. 책을 만든 분들도, 열의를 가지고 만들었다는 것이 느껴졌으니까요……."
