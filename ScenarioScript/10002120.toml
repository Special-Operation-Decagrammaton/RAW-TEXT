[translation]
10002120-1 = "제12화;불꽃놀이"
10002120-2 = "(우여곡절은 많았지만 어떻게든 5개의 리스트를 완수한 뒤, 노을 진 하늘을 바라보았다.)"
10002120-3 = "(마지막으로 남은 '불꽃놀이'는 해가 진 뒤에야 할 수 있는 것이라, 약간의 여유를 느끼고 있었다.)"
10002120-5 = "벌써 시간이 이렇게 됐군요."
10002120-6 = "마지막으로 남은 임무인 불꽃놀이는 해가 져야 할 수 있으니, 당장은 여유가 있겠네요."
10002120-7 = "[s] \"히후미와 아즈사는 폭죽 사러 갔다고 했지.\""
10002120-8 = "네. 어째서인지 먼저들 나서시더군요. 원래는 저와 츠루기 선배가 가려고 했는데……"
10002120-9 = "……키킥! 키키킥! 케헤!!"
10002120-10 = "음. 선배도 기대하고 있는 걸까요? 잘 모르겠지만요."
10002120-11 = "덕분에 이렇게 쉴 수 있게 됐으니, 두 분께는 감사해야겠죠."
10002120-12 = "다 끝내면 돌아가서 하스미 선배에게 보고 하고, 사진도 보여드리고……"
10002120-13 = "다행히 이번 일도 별 탈 없이 완수하게 되는군요. 선생님께서 도와 주신 덕분입니다."
10002120-14 = "[s1] \"마시로는 즐겁지 않았어?\"\n[s2] \"정말 '임무'만으로 괜찮은 거야?\""
10002120-15 = "네? 그야 물론 저는 덤으로 끼어서 온 몸이지만……."
10002120-16 = "네? 그야 물론 저는 덤으로 끼어서 온 몸이지만……."
10002120-17 = "분위기에 휩쓸려 같이 재미 있게 논 거 같은 느낌이라……."
10002120-18 = "으음…… 언제나 정의를 향한 마음을 잊어선 안되는데 조금 헤이해져 있었던 걸까요……."
10002120-19 = "반성해야 하겠군요."
10002120-20 = "그러고 보니 히후미 씨 일행이 조금 늦네요. 마중을 가봐야겠습니다."
10002120-26 = "[ns3] \"츠루기는 어땠어?\"\n[ns4] \"즐거웠니?\""
10002120-27 = "……!!"
10002120-28 = "……!!"
10002120-29 = "저, 저 말씀이십니까? 저, 저는……!"
10002120-30 = "저는…… 그……"
10002120-31 = "사, 사실…… 사실 잘은 모르겠습니다…… 이게 맞는지……"
10002120-32 = "뭔가…… 생각했던 거랑 조금씩 다른 거 같기도 하고……"
10002120-33 = "마, 맞는 거 같기도…… 하고……."
10002120-34 = "[s5] \"맞고 틀리고의 문제가 아니라고 생각해.\"\n[s6] \"츠루기가 느낀 대로가 아닐까.\""
10002120-35 = "그, 그렇군요…… 뭔가 여전히 잘 모르겠지만…… 그런 거군요……"
10002120-36 = "그, 그렇군요…… 뭔가 여전히 잘 모르겠지만…… 그런 거군요……"
10002120-37 = "역시 그래도, 평소에 책에서 보던 해변과는 많이 다르기도 했고…… 음……"
10002120-38 = "역시…… 역시 저의 생각에는……"
10002120-39 = "……그……"
10002120-40 = "……좋……"
10002120-42 = "다녀왔습니다아아~~!"
10002120-43 = "……!?"
10002120-49 = "다녀왔어요, 여러분! 가게가 멀지 않은 곳에 하나 있어서, 우선 되는 만큼 사 왔어요……"
10002120-50 = "타격 능력이 미미한 폭발물이긴 하지만 일단은 지시한 대로 구해 왔다."
10002120-51 = "사실 내 입장에선 전술적 효과에 비해 너무 비싸서 비효율적으로 보이는데……"
10002120-52 = "아즈사 쨩…… 폭죽이니까요……. 전술 효과가 있으면 그게 더 곤란하다고요……."
10002120-53 = "혹시 몰라서 폭죽 이외에도 쓸만한 폭발물을 몇 개 더 구해왔으니, 유사시엔 이걸로 대처하면 된다."
10002120-54 = "그러니까 유사시라는 게 있으면 안 된다니까요…… 아우우……"
10002120-56 = "……으응?"
10002120-57 = "죄송해요. 혹시 뭔가 말씀하시는 중이셨나요……?"
10002120-58 = "……그……"
10002120-60 = "……키킥! 크히……!?"
10002120-62 = "으, 으아아 죄송해요오오 뭔진 모르지만 불편하셨다면 죄송해요오……!"
10002120-63 = "[s] \"…….\""
10002120-65 = "(이후 어영부영 시간이 흘러, 해가 완전히 저물어갔다.)"
10002120-68 = "(해가 수평선 너머로 사라지자, 주변이 생각보다 훨씬 더 빨리 어두워졌다.)"
10002120-69 = "(가게들도 하나 둘 문을 닫았고, 해변엔 파도소리만이 가득해졌다.)"
10002120-70 = "조용하네요…… 뭔가 바람도 조금 부는 것 같고…… 우리들 뿐인가요?"
10002120-71 = "아니. 오면서 확인했는데 반대쪽 마을엔 아직 불량배들이 남아 있다. 뭘 하는지는 모르겠지만……"
10002120-72 = "그런가요. 거리는 꽤 멀지만…… 만일을 대비해서 먼저 공격할까요?"
10002120-73 = "싸, 싸움은 안 걸어도 되지 않을까요……!? 아직 아무 일도 안 일어났는데……!"
10002120-74 = "으음. 어려운 문제네요."
10002120-75 = "하지만 상대는 불량배들입니다. 반드시 뭔가 일을 벌일 것 같지 않습니까?"
10002120-76 = "[s7] \"아닐 지도 몰라.\"\n[s8] \"우리처럼 불꽃놀이를 하려는 걸지도.\""
10002120-78 = "불꽃놀이를요? 불량배들이……?"
10002120-80 = "불꽃놀이를요? 불량배들이……?"
10002120-81 = "불가능한 이야기는 아니야. 아까 전 가게에서 우리가 폭발물 가게에서 폭죽을 구입할 때, 녀석들도 있었다."
10002120-82 = "내가 지켜본 정황상, 다른 변수가 없다면 그녀석들도 폭죽을 샀을 가능성이 높아."
10002120-83 = "물론 그래도 만일의 변수를 없애자고 한다면 나는 찬성이지만……"
10002120-84 = "그, 그렇게까지는 하지 않아도 될 거라 생각해요……"
10002120-85 = "……이렇게 말할 거 같아서 말이야. 일단은 경계만 하는 것으로."
10002120-86 = "으음. 알겠습니다. 그렇게까지 말씀하신다면야 저도 굳이……"
10002120-96 = "……폭죽이네요……"
10002120-97 = "불꽃놀이로군요."
10002120-98 = "불량배들 쪽 방향이야. 정말로 폭죽이었군."
10002120-101 = "……반짝반짝……"
10002120-105 = "……!?!?"
10002120-112 = "(……퍼어어엉!!)"
10002120-113 = "아직입니다. 아직 이정도로는 부족합니다! 아즈사 씨! 저쪽의 저 폭죽에 지지 않을 더 큰 불꽃을!"
10002120-114 = "물론이지. 지지 않아. 우리 쪽이 더 강한 화력을 보유하고 있다."
10002120-115 = "하우우우!! 왜들 이러시는 거예요……"
10002120-116 = "왜 불량배 분들이랑 폭죽 경쟁을 하는 거예요오오오!?"
10002120-120 = "저, 저쪽에서도 뭔가 의식적으로 더 많은 폭죽을 쏘아 올리는 것 같은 느낌이……!!"
10002120-121 = "하우우우!! 서, 선생니이임~~!!"
10002120-122 = "[s] \"……\""
10002120-124 = "군비 경쟁인가. 나쁘지 않지."
10002120-125 = "토탈 워가 뭔지 보여주겠어."
10002120-126 = "이, 이러다간 애써 사 온 폭죽들이 금세……!!"
10002120-127 = "(……콰아아아아아앙-!!)"
10002120-128 = "……?"
10002120-129 = "……!!"
10002120-130 = "……아"
10002120-131 = "저건 네이팜이네요."
10002120-132 = "확실히, 네이팜이라면 시중에서 파는 평범한 폭죽과는 비교도 할 수 없이 강하고 밝지. 저걸 폭죽으로 만든 건가?"
10002120-133 = "이미 폭죽이 아닌데요……"
10002120-134 = "칫, 한 방 먹었나. 저격수, 우리에게 준비된 네이팜은?"
10002120-135 = "없습니다……"
10002120-137 = "앗, 저기 또 한 발의 네이팜이……!"
10002120-139 = "……음?"
10002120-140 = "뭔가…… 불발탄일까요? 폭발 타이밍이 한참 지났는데도 안 터지고 계속 날아가는……"
10002120-141 = "……어."
10002120-142 = "어어……?"
10002120-143 = "……아."
10002120-144 = "이쪽으로 온다."
10002120-148 = "(콰아아아아아앙-!!)"
10002120-149 = "……폭격이었나."
