[translation]
10054060-1 = "第6話;驚人的登場"
10054060-4 = "那麼老師……"
10054060-5 = ""
10054060-7 = ""
10054060-8 = "我是小旬唷！"
10054060-9 = ""
10054060-11 = ""
10054060-12 = "我是妃妃！"
10054060-13 = "你好呀，老師！好久不見了呢！"
10054060-14 = "[s] 「是啊……好久不見……」"
10054060-15 = "哇～！"
10054060-16 = "咦？老師你怎麼了？肚子痛嗎？"
10054060-17 = "難道是因為今天泡在冷水裡太久了嗎……妃妃好擔心。"
10054060-18 = "[s] 「老師……沒事的……完全沒有問題……」"
10054060-19 = "雖然今天已經很晚了，所以恐怕沒辦法……"
10054060-20 = "可是我還是想和老師一起玩！"
10054060-21 = "妃妃也是！妃妃也是！"
10054060-22 = "[s] 「我會努力看看的……」"
10054060-23 = "老師最棒了！"
10054060-25 = "那個……老師？"
10054060-26 = "！？"
10054060-27 = "！？"
10054060-28 = ""
10054060-30 = ""
10054060-31 = ""
10054060-32 = "現在方便耽誤一點時間嗎……？"
10054060-33 = ""
10054060-35 = ""
10054060-36 = "……咦？你們……"
10054060-37 = "你們怎麼會在這裡！？！？"
10054060-38 = "那，那個……"
10054060-39 = "就，就是……！"
10054060-40 = "[s1] 「我，我剛才收到旬的聯絡！」\n[s2] 「他請我再多照顧兩個梅花園的孩子！」"
10054060-43 = "咦？為了看看這裡適不適合讓梅花園的孩子們來郊遊，所以才把他們送來這裡？"
10054060-44 = "感覺很可疑耶……#n如果是這樣的話，旬姐姐應該會先告訴我才對……"
10054060-45 = "而且平常好像很少看到你們呢？#n雖然有可能是因為班級不同啦……"
10054060-46 = "！？！？！？"
10054060-47 = "因，因為是突然決定的！#n梅花園的其他教官們也說，既然難得有機會就……"
10054060-48 = "哼嗯……？"
10054060-49 = "老，老師？對吧？是這樣吧？妃妃……沒有說錯吧……？"
10054060-50 = "[s] 「嗯，嗯！沒錯！就是這樣！」"
10054060-51 = "對啊！說是有老師在就一定沒問題。"
10054060-52 = "哼～嗯……？"
10054060-53 = "而，而且！可靠的心菜教官也在這裡……"
10054060-54 = "教官們還說，有什麼事一定要找心菜教官商量呢！"
10054060-55 = "心菜教官！？"
10054060-56 = "其他教官姐姐們，居然對我這麼……？"
10054060-57 = "咳哼。那當然！放心交給心菜教官吧！#n這裡真的是個很棒的溪谷，儘管放心玩！"
10054060-58 = "不過不可以到水太深的地方去哦？"
10054060-59 = "好～！"
10054060-60 = "不過旬姐姐，居然連這種小事都不先跟我說一聲……"
10054060-61 = "之後可得跟他要至少三個巴根達斯冰淇淋才行！"
10054060-62 = "（心，心菜醬變精明了呢……）"
10054060-64 = "情況我明白了，我會轉告其他姐姐們的。"
10054060-65 = "還有在這裡不可以叫我教官，要叫我心菜姐姐哦！"
10054060-66 = "好！心菜姐姐！"
10054060-67 = "心，心菜姐姐……"
10054060-68 = "耶嘿，耶嘿嘿……"
10054060-69 = ""
10054060-71 = ""
10054060-72 = "不過老師，這些孩子要睡在哪裡呢？"
10054060-73 = "咦？這，這個嘛……"
10054060-74 = ""
10054060-75 = "[ns3] 「啊，關於那個！旬和妃姬說會親自照顧他們！」\n[ns4] 「說是不想太麻煩大家！」"
10054060-78 = "沒，沒錯！就是這麼決定的！"
10054060-79 = "雖然妃妃也想和其他姐姐們一起玩就是了～"
10054060-80 = "旬姐姐和妃姬姐姐嗎？可是……"
10054060-81 = "咦？"
10054060-82 = ""
10054060-84 = ""
10054060-85 = ""
10054060-86 = "等等，也就是說……姐姐要代替我照顧這些孩子嗎？"
10054060-87 = "這樣說不定還挺幸運的呢？嘿嘿。#n畢竟我想在這裡忘掉一切，好好玩一場嘛。"
10054060-88 = ""
10054060-90 = ""
10054060-91 = ""
10054060-92 = ""
10054060-93 = "（心菜醬……你的內心話都說出口了哦……？）"
10054060-94 = ""
10054060-96 = ""
10054060-97 = ""
10054060-98 = "[ns] 「話說回來，你找我有什麼事嗎？」"
10054060-99 = "咦？"
10054060-100 = "！！！"
10054060-101 = "那，那個……我……"
10054060-102 = "……"
10054060-103 = "我，我現在已經是個出色的淑女了吧？沒錯！連其他教官姐姐們都認可我了呢！"
10054060-104 = "所，所以說……那個……"
10054060-105 = "想，想說既然身為淑女！要不要拜託老師來個夜間護送！之類的……"
10054060-106 = "！"
10054060-107 = "嗚嗚嗚……說出口了……"
10054060-108 = "[ns] 「這樣啊？那要不要一起去夜間散步呢？」"
10054060-109 = "可，可以嗎！？"
10054060-110 = ""
10054060-112 = ""
10054060-113 = "……"
10054060-114 = "算了，還是下次再去吧。#n現在請先多關心一下新來的孩子們。"
10054060-115 = "（哦……）"
10054060-116 = "（心菜醬真了不起呢）"
10054060-117 = ""
10054060-118 = "[ns] 「突然變得好想和心菜醬去散步哦～」"
10054060-119 = "真，真的嗎！？"
10054060-120 = "嘿嘿……"
10054060-121 = "好，不可以反悔哦？"
10054060-122 = ""
10054060-124 = ""
10054060-125 = ""
10054060-126 = "到時候要兩個人單獨去哦！說好了哦？"
10054060-127 = ""
10054060-129 = ""
10054060-130 = ""
10054060-131 = ""
10054060-132 = ""
10054060-133 = "那麼老師！這些孩子就拜託老師和旬姐姐多多關照了！"
10054060-134 = ""
10054060-136 = ""
10054060-137 = "呼……"
10054060-138 = "[s] 「呼……」"
10054060-139 = "謝謝你，老師！居然可以在小孩子面前那麼熟練地說謊，好厲害！"
10054060-140 = "沒錯沒錯！看來妃妃還有很多需要學習的地方呢！"
10054060-141 = "[s] 「你們這些小傢伙，竟敢捉弄大人～！」"
10054060-142 = "呀啊～"
10054060-143 = "哇啊～"
10054060-144 = ""
10054060-146 = ""
10054060-147 = ""
10054060-148 = "那我們要去睡覺了！"
10054060-149 = "呼啊……可能是因為身體變成小孩子的關係，已經想睡了……"
10054060-150 = "晚安，老師！"
10054060-155 = "事情我已經聽說了，老師。#n既然如此……我們就先做好我們該做的事吧。"
10054060-156 = "是啊。只要在商店街四處看看，進行各項調查就行了。"
10054060-157 = "那我們趕快出發吧，老師！#n畢竟現在這已經變成了關乎山海經與梅花園孩子們的事了！"
10054060-159 = "（於是和三人一起出發前往了商店街）"
10054060-161 = ""
10054060-162 = "那麼，吾等也動身吧。"
10054060-163 = "好的，門主大人。"
10054060-165 = "這裡有沒有特別有趣的東西？唔嗯……"
10054060-166 = "首先沿著河流往上走，有一段水流適度湍急的地方，可以在那裡搭橡皮艇體驗泛舟。"
10054060-167 = "因為完全無法預料下一秒會發生什麼，應該會相當有趣才對。#n當然相對地也需要注意安全，以免發生意外就是了……"
10054060-168 = "啊，雖然這是常識，不過只要有下一點雨就不能靠近那裡哦。"
10054060-169 = "都市裡來的人啊，總是不明白溪水暴漲的速度有多驚人呢。"
10054060-170 = "……像這樣聊著這些話題，感覺真不錯啊。#n彷彿真的有種在接待普通觀光客的感覺……"
10054060-171 = "這，這樣啊……不過要怎麼到上游去呢？"
10054060-172 = "如果想悠閒欣賞風景可以坐纜車，想快點上去的話也可以搭接駁巴士。"
10054060-173 = "不過……纜車現在恐怕沒辦法使用呢……"
10054060-174 = "……"
10054060-175 = "……"
10054060-177 = "這就是通往那些孩子所居之處的纜車嗎。"
10054060-178 = "唔呣……儘管別有一番風情，還是令人感覺設施有些老舊呢。"
10054060-179 = "根據瑠美同學的投資報告，過去已持續要求針對老舊的基礎設施進行整修與汰換……#n看來計畫進展得不太順利呢。"
10054060-180 = "說來也是，畢竟那筆資金仍未受到妥善運用啊。"
10054060-182 = "這裡的岩石容易被水侵蝕，那些受侵蝕的部分全都順著河流被沖走了。"
10054060-183 = "聽說最後留下來的部分，形成了那座外型奇特的山。很壯觀吧？"
10054060-184 = "可能也是因為這樣……導致這裡地下水的石灰質含量相當高。"
10054060-185 = "啊，雖然有人說石灰水對身體不好，不過實際上並不是這樣的。"
10054060-186 = "因為具有殺菌效果，在衛生層面反而有好處。#n真要說的話，喝冰水對身體的負擔還比較大呢。"
10054060-187 = "原來如此，這麼一說確實有道理。"
10054060-188 = "對吧？不過……缺點就是水的味道確實差了一些。"
10054060-189 = "總之，這裡畢竟是個少了山水景色，人們就幾乎不會特地來的地方。"
10054060-190 = "所以我個人果然還是最推薦搭乘竹筏遊河。#n尤其晨霧瀰漫時的景色堪稱一絕啊。"
10054060-191 = "那真是令人期待呢！"
10054060-192 = "可惜要是霧太濃可能會沒辦法開船，所以就只能碰碰運氣了。"
10054060-193 = "這，這樣啊……"
10054060-195 = ""
10054060-196 = "看來並不是直接通往旅館呢……"
10054060-197 = "不過既然有告示牌，再走五分鐘左右應該就會到了。"
10054060-198 = "將這視為散步倒也不錯……然而還是有點意外呢。"
10054060-199 = "考慮到雛鳥組那群孩子們的性情，本以為會連忍受這點路程的耐心都沒有呢。"
10054060-200 = "……畢竟孩子們總是令人難以捉摸啊。"
10054060-201 = "是啊，在各種意義上都是如此。"
10054060-203 = "這個米粉真好吃呢！配方是什麼呢……？#n我能吃出來的有豬肉、花生、醃菜……"
10054060-204 = "哈哈，哪能這麼輕易把做生意的本錢告訴你呢！#n不過我光是熬高湯就用了超過二十種香料，這點倒是可以透露一下啦！"
10054060-205 = "說的也是。做生意總是得有一兩樣屬於自己的獨門絕活呢。"
10054060-206 = "年紀輕輕就懂得生財之道了啊，真了不起。#n不過可別只顧著追求眼前的利益，導致失去了更重要的東西啊。"
10054060-207 = "是啊……做生意本來就該兼顧利益與人心才行。"
10054060-211 = "哦？就是這裡嗎。"
10054060-212 = "是的，真的馬上就到了呢。#n那麼……"
10054060-213 = "唔呣。"
10054060-214 = "你好！請問有人在嗎？"
10054060-215 = "我們聽說這裡有很了不起的人物，所以特地前來拜訪！"
10054060-216 = ""
10054060-218 = ""
10054060-222 = ""
10054060-223 = ""
10054060-224 = ""
10054060-225 = "唔嗯……你們是誰啊？"
