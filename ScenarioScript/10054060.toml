10054060-168 = "อ้อ เรื่องนี้ไม่ต้องบอกก็คงรู้ ถ้าฝนตกแม้แต่นิดเดียว ก็ห้ามไปเด็ดขาดเลยนะ "
10054060-169 = "คนเมืองน่ะไม่ค่อยรู้หรอกว่าน้ำในหุบเขาเพิ่มระดับเร็วแค่ไหน"
10054060-170 = "พอได้พูดเรื่องแบบนี้แล้วก็ดีเหมือนกันนะ รู้สึกเหมือนกำลังต้อนรับนักท่องเที่ยวทั่วไปจริงๆ เลย..."
10054060-171 = "อะ... อืม ว่าแต่จะขึ้นไปถึงต้นน้ำได้ยังไง?"
10054060-172 = "ถ้าอยากค่อยๆ ชมวิวก็นั่งเคเบิลคาร์ แต่ถ้าอยากขึ้นไปเร็วๆ ก็มีรถบัสรับส่ง"
