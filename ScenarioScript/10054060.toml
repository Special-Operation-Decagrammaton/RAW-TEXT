[translation]
10054060-1 = "6화;놀랄 만한 등장"
10054060-4 = "그러면, 선생님……."
10054060-8 = "슈에링이랍니다!"
10054060-12 = "키키예요!"
10054060-13 = "안녕하세요, 선생님! 오랜만에 뵈네요!"
10054060-14 = "[s] \"…………그래……. 정말, 그렇구나…….\""
10054060-15 = "와~아!"
10054060-16 = "어라? 왜 그러세요, 선생님? 속이 쓰리다는 표정이세요."
10054060-17 = "역시 오늘 너무 오랫동안 차가운 물속에 들어가 있어서 그런 걸까요……. 키키, 걱정이에요."
10054060-18 = "[s] \"선생님은…… 괜찮단다……. 아무렇지도 않아…….\""
10054060-19 = "벌써 밤이 깊어서, 오늘은 어렵겠지만……."
10054060-20 = "저도 꼭 선생님이랑 같이 놀고 싶어요!"
10054060-21 = "키키도요, 키키도요!"
10054060-22 = "[s] \"노력해 볼게…….\""
10054060-23 = "선생님 최고!"
10054060-25 = "저, 선생님?"
10054060-26 = "?!"
10054060-27 = "!?"
10054060-32 = "지금, 잠시 시간 괜찮으세요……?"
10054060-36 = "……어라? 너희들……."
10054060-37 = "너희들이 왜 여기에 있는 거야?!?!"
10054060-38 = "그, 그게요!"
10054060-39 = "그러니까, 그러니까……!"
10054060-40 = "[s1] \"슈, 슌한테 연락을 받았는데 말이지!\"\n[s2] \"매화원 아이들 두 명을 더 부탁한대!\""
10054060-43 = "네? 나중에 매화원 아이들이 여기로 소풍을 와도 좋을지, 미리 알아보게 하려고 얘들을 여기로 보냈다고요?"
10054060-44 = "수상한데요……. 그 정도의 일이라면, 슌 언니가 저에게도 분명 먼저 말을 해 주었을 텐데……."
10054060-45 = "그리고 너희들, 평소에 어째 좀처럼 보이지가 않았단 말이지? 그건 옆 반 아이들이라 그럴 수도 있긴 한데……."
10054060-46 = "???!!!"
10054060-47 = "가, 갑자기 결정된 일이었거든요! 매화원의 다른 교관 분들이, 이왕 이렇게 된 거……. 그래서……."
10054060-48 = "흐음……?"
10054060-49 = "서, 선생님? 맞죠? 맞죠? 키키는…… 잘못한 거 없죠……?"
10054060-50 = "[s] \"으, 응! 맞아! 그랬어!\""
10054060-51 = "그래요! 선생님이 계시니까 분명 괜찮을 거라고 하셨어요."
10054060-52 = "흐으음……?"
10054060-53 = "그, 그리고요! 거기에 믿음직한 코코나 교관님까지 같이 있을 테니까……."
10054060-54 = "무슨 일이 있으면 꼭 코코나 교관님께 상담하라고도 말씀하셨어요!"
10054060-55 = "코코나 교관님?!"
10054060-56 = "다른 교관 언니들이, 나를 그렇게……?"
10054060-57 = "크흠. 당연하지! 이 코코나 교관님만 믿으라구! 여기는 정말 좋은 계곡이니까, 마음껏 놀아도 돼!"
10054060-58 = "그래도 너무 깊은 물에는 들어가면 안 된다?"
10054060-59 = "네~에!"
10054060-60 = "그렇지만 슌 언니, 이 정도 일을 나한테도 말을 안 해 주다니……."
10054060-61 = "이걸로 나중에 바겐다즈 아이스크림 세 개는 받아내야지!"
10054060-62 = "(코, 코코나 쨩이 조금 영악해졌네요…….)"
10054060-64 = "사정은 알았어. 다른 언니들한테도 전해 둘게."
10054060-65 = "그리고 여기에서는 교관이라고 부르면 안 돼. 코코나 언니라고 부르도록!"
10054060-66 = "네! 코코나 언니!"
10054060-67 = "코, 코코나 언니……."
10054060-68 = "헤헤. 에헤헤……."
10054060-72 = "그런데, 선생님. 이 아이들은 어디에서 자게 되나요?"
10054060-73 = "네? 그게, 그러니까……."
10054060-75 = "[ns3] \"아, 그거 말인데! 슌과 키사키가 따로 돌봐 준대!\"\n[ns4] \"다른 모두에게 너무 폐를 끼치기는 싫다고!\""
10054060-78 = "네, 맞아요! 그렇게 하기로 했어요!"
10054060-79 = "키키는 다른 언니들이랑도 놀고 싶었지만요~"
10054060-80 = "슌 언니와 키사키 언니가요? 그렇지만……."
10054060-81 = "어라?"
10054060-86 = "가만있자, 그러면 언니가 나 대신 아이들을 봐 준다는 소리잖아?"
10054060-87 = "이건 조금 운이 좋을지도? 헤헤. 여기에서는 다 잊고 놀고 싶으니까."
10054060-93 = "(코코나 쨩……. 속마음이 들리고 있답니다……?)"
10054060-98 = "[ns] \"그런데 무슨 일이었어?\""
10054060-99 = "네?"
10054060-100 = "!!!"
10054060-101 = "그, 그게……. 그러니까……."
10054060-102 = "……."
10054060-103 = "저, 저는 이제 어엿한 레이디잖아요? 맞아요! 다른 교관 언니들도 인정해 주셨을 정도로요!"
10054060-104 = "그, 그러니까…… 그러니까……."
10054060-105 = "레, 레이디답게! 선생님께 밤의 에스코트라도 부탁할까! 하고, 요……."
10054060-106 = "!"
10054060-107 = "으우우……. 말해 버렸어……."
10054060-108 = "[ns] \"그래? 그러면 같이 밤 산책이라도 갈까?\""
10054060-109 = "저, 정말요?!"
10054060-113 = "……."
10054060-114 = "아뇨. 역시 다음에 가요. 지금은 새로 온 아이들에게 신경을 써 주세요."
10054060-115 = "(호오…….)"
10054060-116 = "(대견하네요. 코코나 쨩.)"
10054060-118 = "[ns] \"갑자기 코코나 쨩이랑 산책하러 가고 싶어졌는데~\""
10054060-119 = "저, 정말요?!"
10054060-120 = "헤헤……."
10054060-121 = "좋아요. 약속하신 거예요?"
10054060-126 = "그때는 둘이서만 가요. 꼭이에요?"
10054060-133 = "그러면, 선생님! 슌 언니와 같이 아이들, 잘 부탁드릴게요!"
10054060-137 = "휴……."
10054060-138 = "[s] \"휴…….\""
10054060-139 = "감사해요, 선생님! 아이 앞에서 능숙한 거짓말, 대단했어요!"
10054060-140 = "맞아요, 맞아요! 키키도 아직 배울 점이 많은 것 같아요!"
10054060-141 = "[s] \"요 녀석들이, 어른을 놀리고 말이야~!\""
10054060-142 = "꺄아~"
10054060-143 = "와아~"
10054060-148 = "그러면 저희는 자러 가 볼게요!"
10054060-149 = "후아암……. 어린아이의 몸이라 그런지, 벌써 졸려요……."
10054060-150 = "안녕히 주무세요, 선생님!"
10054060-155 = "이야기는 들었어, 선생님. 그러면 우리는…… 우선 우리 할 일을 하면 되겠네."
10054060-156 = "그래. 상점 거리를 둘러보며, 제반 조사를 실시하면 된다."
10054060-157 = "그러면 어서 가죠, 선생님! 이제는 산해경과…… 매화원 아이들을 위한 일이 되어 버린 셈이니까요!"
10054060-159 = "(그렇게 셋과 함께 상점 거리로 출발했다.)"
10054060-162 = "그러면, 우리도 시작하도록 할까."
10054060-163 = "네, 문주님."
10054060-165 = "여기에서 특별히 재미있는 것 말인가? 흐음……."
10054060-166 = "우선 강 상류까지 올라가면 물살이 적당히 빠른 곳이 있는데, 거기에서 고무보트를 타고 래프팅을 할 수 있지."
10054060-167 = "꽤 재미있을 거야. 한 치 앞도 예상이 안 되거든. 물론 그만큼 사고 조심도 해야 하지만……."
10054060-168 = "아, 당연한 이야기이지만 비가 조금이라도 내릴 때는 가면 안 돼."
10054060-169 = "거 도시 사람들은 계곡이 얼마나 빠르게 차오르는지, 잘 모른단 말이지."
10054060-170 = "……이런 이야기를 하고 있으려니, 좋구만. 정말로 보통 관광 손님을 맞이하는 느낌이야……."
10054060-171 = "으, 으음. 그런데 상류까지는 어떻게 올라가지?"
10054060-172 = "천천히 경치를 보고 싶다면 케이블카를 타면 되고, 빨리 올라가고 싶다면 간이 버스도 있단다."
10054060-173 = "……하지만 케이블카는 지금, 조금 쓰기 어려울지도 모르겠구나……."
10054060-174 = "……."
10054060-175 = "……."
10054060-177 = "이것이 그 병아리파 아이들의 호텔로 이어지는 케이블카인가."
10054060-178 = "흐음……. 이 또한 운치가 있기는 하다만, 역시 시설이 좀 낡았다는 생각이 드는구나."
10054060-179 = "네. 루미 씨의 투자 보고서에 따르면, 낡은 기반 시설들의 보수와 교체를 요구하고 있었지만…… 잘 되고 있지 않은 것 같네요."
10054060-180 = "뭐어, 애초에 투자금을 아직 제대로 사용하지도 못하고 있다 하였으니."
10054060-182 = "여기 바위는 물에 녹기 쉬워서, 물에 녹는 부분은 전부 강으로 흘러나가 버리고."
10054060-183 = "남은 부분만 저런 모습의 산이 된 것이라고 하더라고. 대단하지?"
10054060-184 = "그래서 그런지…… 사실, 지하수에 석회질 성분이 적지 않은 편이기도 해."
10054060-185 = "아, 석회수가 몸에 나쁘다는 말도 있지만, 별로 그런 것은 아니야."
10054060-186 = "살균 효과가 있어 위생적으로 좋은 부분도 있어. 오히려 찬물이 더 몸에 안 좋을걸?"
10054060-187 = "아하. 그건 확실히 그럴 것 같네."
10054060-188 = "그렇지? 하지만 역시…… 물맛이 좀 좋지 않은 편이라는 게 단점이기는 하지."
10054060-189 = "어쨌든 여기는 강과 산이 없으면, 사람들이 찾아올 이유가 거의 없어지는 곳이기도 하니까."
10054060-190 = "나는 역시 대나무 배 투어를 추천하겠어. 이게 또, 아침 안개가 꼈을 때 경치가 엄청나거든."
10054060-191 = "그거 정말 기대되네요!"
10054060-192 = "하지만 안개가 너무 짙게 깔리면 배를 못 띄울 수도 있으니, 복불복이라고 해야겠구나."
10054060-193 = "그, 그렇군요……."
10054060-196 = "곧바로 호텔로 이어지는 것은 아니었던 모양이군."
10054060-197 = "하지만 표지판이 있었으니까, 5분 정도만 걸으면 될 것 같네요."
10054060-198 = "산책을 겸한다고 생각하면 좋은 일이겠지만, 약간 의외이긴 하구나."
10054060-199 = "그 병아리파라는 아이들의 성정을 생각한다면, 이 정도를 참아낼 인내심조차 없었을 듯한데 말이다."
10054060-200 = "……아이들은, 예측할 수 없으니까요."
10054060-201 = "네. 정말로, 많은 의미에서요."
10054060-203 = "이 쌀국수 정말 맛있네요! 비법이…… 뭐죠? 우선 돼지고기와 땅콩, 절인 야채는 확실히 알겠고……."
10054060-204 = "하하. 그렇게 쉽게 장사 밑천을 드러내 줄 수는 없지! 일단 육수를 낼 때 20가지가 넘는 향신료가 들어간다는 것만 말해 주겠어!"
10054060-205 = "그건 그렇습니다. 장사를 하려면 자기만 할 수 있는 것을 하나씩 쥐고 있어야 하는 법이죠."
10054060-206 = "학생이 벌써부터 이문(利文)을 볼 줄 아는구만. 대단해. 하지만 너무 눈앞에 보이는 것만 쫓다가, 큰 것을 잃으면 안 돼."
10054060-207 = "그렇죠……. 장사는 이익과 사람, 모두를 얻어야 하는 법이니까요."
10054060-211 = "호오. 이곳인가."
10054060-212 = "네. 정말로 얼마 걸리지 않았네요. 그러면……."
10054060-213 = "음."
10054060-214 = "안녕하세요! 혹시 누구 없으신가요?"
10054060-215 = "여기, 대단한 분들이 있다는 소식을 듣고 찾아왔어요!"
10054060-225 = "어라? 너희들, 누구야?"
