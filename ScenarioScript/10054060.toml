10054060-201 = "ใช่ค่ะ ในหลายๆ แง่เลยค่ะ"
10054060-203 = "ก๋วยเตี๋ยวนี่อร่อยจริงๆ เลยค่ะ! เคล็ดลับ... คืออะไรเหรอคะ? อย่างแรกเลย ที่รู้แน่ๆ ก็คือมีหมู ถั่วลิสง แล้วก็ผักดอง..."
10054060-204 = "ฮ่าฮ่า จะเผยเคล็ดลับทำมาหากินให้ง่ายๆ ไม่ได้หรอกนะ! บอกได้แค่ว่าตอนทำน้ำซุป ฉันใส่เครื่องเทศมากกว่า 20 ชนิดเลยละ!"
10054060-205 = "ก็จริงนะคะ ถ้าจะค้าขาย ก็ต้องเก็บทีเด็ดเคล็ดลับของตัวเองไว้สักอย่างเป็นธรรมดาค่ะ"
10054060-206 = "เป็นนักเรียนแท้ๆ แต่รู้จักหากำไรเสียแล้วนะ เก่งกันมากจริงๆ แต่จะมัวไล่ตามแค่ผลประโยชน์ตรงหน้า จนเสียสิ่งที่สำคัญกว่าไปไม่ได้นะ"
10054060-207 = "นั่นสินะคะ... เพราะหลักของการค้าขายคือต้องได้มาทั้งกำไรและใจคนยังไงล่ะคะ"
10054060-211 = "โอ้ ที่นี่เองหรือ?"
10054060-212 = "ใช่ค่ะ ใช้เวลาไม่นานจริงๆ ด้วยค่ะ ถ้างั้นก็..."
10054060-213 = "อื้อ"
10054060-214 = "สวัสดีค่ะ! มีใครอยู่มั้ยคะ?"
10054060-215 = "ได้ข่าวว่าที่นี่มีคนเก่งๆ อยู่ ฉันก็เลยมาหาค่ะ!"
