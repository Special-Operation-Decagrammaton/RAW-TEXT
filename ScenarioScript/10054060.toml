10054060-174 = "..."
10054060-175 = "..."
10054060-177 = "นี่คือเคเบิลคาร์ที่เชื่อมไปยังโรงแรมของเด็กๆ แก๊งลูกเจี๊ยบอย่างนั้นหรือ?"
10054060-178 = "ฮืม... มันก็มีเสน่ห์อยู่หรอก แต่ดูเหมือนสิ่งอำนวยความสะดวกจะเก่าไปสักหน่อยจริงๆ"
10054060-179 = "ใช่ค่ะ ตามรายงานการลงทุนของคุณรูมิ มีการร้องขอให้ซ่อมแซมและเปลี่ยนโครงสร้างพื้นฐานที่#nเสื่อมสภาพแล้ว แต่... ดูเหมือนจะดำเนินการได้ไม่ดีนักค่ะ"
10054060-180 = "ก็อย่างว่า ในเมื่อพวกนั้นบอกว่ายังนำเงินลงทุนมาใช้ได้ไม่เต็มที่ตั้งแต่แรกอยู่แล้ว"
10054060-182 = "หินแถวนี้ถูกน้ำกัดเซาะได้ง่าย ส่วนที่ถูกน้ำกัดเซาะก็ไหลลงแม่น้ำไปจนหมด"
10054060-183 = "เหลือเพียงส่วนที่ไม่ได้ถูกน้ำกัดเซาะจนกลายเป็นภูเขารูปร่างแบบนั้น น่าทึ่งไปเลยใช่มั้ยล่ะ?"
10054060-184 = "อาจเป็นเพราะอย่างนั้นก็ได้นะ... ที่จริงน้ำใต้ดินแถวนี้ก็เลยมีแร่หินปูนปนอยู่ไม่น้อยเลยละ"
10054060-185 = "อ้อ ถึงจะมีคนบอกว่าน้ำที่มีหินปูนไม่ดีต่อร่างกาย แต่จริงๆ แล้วก็ไม่ได้เป็นอย่างนั้นหรอก "
10054060-186 = "มันมีฤทธิ์ฆ่าเชื้อ เลยมีข้อดีในแง่สุขอนามัยอยู่เหมือนกันนะ น้ำเย็นต่างหากล่ะที่น่าจะไม่ดีต่อร่างกาย#nมากกว่า?"
10054060-187 = "อ้อ ดูท่าจะเป็นอย่างนั้นจริงๆ นะ"
10054060-188 = "ใช่มั้ยล่ะ? แต่ก็อย่างว่า... รสชาติของน้ำไม่ค่อยดีนัก ถือเป็นข้อเสียอยู่เหมือนกัน"
10054060-189 = "แต่ถ้าที่นี่ไม่มีทั้งแม่น้ำและภูเขา ก็คงแทบไม่มีอะไรดึงดูดให้ผู้คนมาเที่ยวแล้วละ"
