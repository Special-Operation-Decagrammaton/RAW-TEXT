10054060-197 = "แต่ฉันเห็นมีป้ายบอกทางอยู่ เดินเข้าไปประมาณ 5 นาทีก็น่าจะถึงค่ะ"
10054060-198 = "ถ้าคิดเสียว่าได้เดินเล่นไปในตัวก็คงเป็นเรื่องดี แต่ก็ผิดคาดอยู่นิดหน่อยนะ"
