10054060-157 = "To protect both Shanhaijing and the Plum Blossom Garden children, we'll get the job done, no matter what!"
10054060-159 = "So I made my way over to the shopping street with the three eager investigators."
10054060-161 = ""
10054060-162 = "It's high time we uphold our end of the bargain."
10054060-163 = "Yes, Madam. "
10054060-165 = "What is there to do around here?"
10054060-166 = "You'll catch a fast enough current to go rafting further up the river."
10054060-167 = "As long as you're careful to avoid accidents, it's a pretty thrilling experience."
10054060-168 = "Ah! But don't go up there if it's raining, okay? "
10054060-169 = "It goes without saying for the locals, but city folk don't realize how fast the water rises in the valley—And how fast the currents can get."
10054060-170 = "I think I'm going to cry. I haven't had the opportunity to have a normal conversation like this in so long..."
10054060-171 = "A-Ahem. What's the best way to get up the river?"
10054060-172 = "The cable car has nice views, but will take a little longer. There's a bus that runs regularly if you'd prefer a more direct route."
10054060-173 = "...Well, that might be your only option. Using the cable cars right now is a bit..."
10054060-174 = "..."
10054060-175 = "..."
10054060-177 = "So this cable car leads to the hotel the Peep Syndicate is residing in..."
10054060-178 = "While it holds a charm of its own, the structure itself is rather dated."
10054060-179 = "Rumi's investment report mentioned that maintenance and renovation requests have fallen on deaf ears so far."
10054060-180 = "Yes, it appears funds have not been allocated as they should be."
10054060-182 = "The water here erodes away at the rocks, and those rocks are eventually washed away into the river."
10054060-183 = "Years and years of this natural process created the valley and mountain you see here today."
10054060-184 = "That's also why the lime content in the groundwater here is higher than average."
10054060-185 = "Some people dismiss it as \"hard water,\" but it's actually not as bad for your health as you might think. "
10054060-186 = "The lime gives it a natural sterilizing effect, which is good for your hygiene and overall health!"
10054060-187 = "I can't disagree with that."
10054060-188 = "Exactly! Although, it does affect the taste of the water, I'll give them that."
10054060-189 = "But the mountains and rivers that created the limestone water are the entire allure of this area!"
10054060-190 = "If you have a chance, you should aim to get up early enough to take the bamboo boat tour while the morning fog is still lifting."
10054060-191 = "That sounds exciting!"
10054060-192 = "Not too early, though! The boat paddlers won't go out if the fog is thick."
10054060-193 = "I-I see..."
10054060-195 = ""
10054060-196 = "So the cable car does not connect directly to the hotel's front doorstep."
10054060-197 = "According to that sign, it's about a five minute walk from here."
10054060-198 = "Hm. I wouldn't have expected that."
10054060-199 = "From my initial impression of the Peep Syndicate children, I'd classified them as the type to regard a short walk as an unwanted inconvenience."
10054060-200 = "...If there's one thing I've learned, it's that children can be unpredictable at best."
10054060-201 = "Yes. In many ways."
10054060-203 = "You have to tell me the secret to your rice noodle soup! I can taste the pork, peanuts, and pickled vegetables...but there's something else I can't place..."
10054060-204 = "Now, now, you can't expect me to just go around blabbing my trade secrets! What I can tell you is that over 20 different spices go into my broth!"
10054060-205 = "Fine, fine. As a fellow restauranteur, I can't say anything in protest to that."
10054060-206 = "You're a sharp gal! We all need that one unique thing if we want to make a profit. But what'll really keep you in business is making sure you never lose sight of why you started in the first place."
10054060-207 = "That's right... Businesses are about more than profit... They're about the people who make your business too."
10054060-211 = "Hm. So this is their home base."
10054060-212 = "It was an easier walk than expected."
10054060-213 = "Hm."
