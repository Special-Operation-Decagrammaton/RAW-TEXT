10054060-53 = "ละ... แล้วก็! เพราะมีผู้ฝึกสอนโคโคน่าที่น่าเชื่อถืออยู่ด้วย... "
10054060-54 = "แล้วก็ยังบอกด้วยว่าถ้าเกิดเรื่องอะไรขึ้น ก็ให้ไปปรึกษาผู้ฝึกสอนโคโคน่าค่ะ!"
