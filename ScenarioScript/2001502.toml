[translation]
2001502-1 = "수행부의 마스코트!"
2001502-2 = "최근 들어 우리 수행부를 가리켜 이상하다고 말하는 사람이 늘어난 거 같아!"
2001502-3 = "하지만 그건 오해야! 전혀 그렇지 않은데 말이야! 그치, 선생님?!"
2001502-4 = "[s1] \"당연하지!\"\n[s2] \"……으, 으음, 그, 그렇지?\""
2001502-5 = "바로 알아주다니! 역시 선생님이야! 좋아해!"
2001502-6 = "[s3] \"그렇게 말해주니 기쁘네.\""
2001502-7 = "에헤헷! 하여간~! 그래서 말인데~!"
2001502-8 = "으응~? 뭐야~? 선생님. 반응이 약한데? 지~그~시~"
2001502-9 = "[s4] \"아, 응! 전혀 이상하지 않다고 생각해! 물론이지!\""
2001502-10 = "흐음~! 뭐! 그럼 됐어!"
2001502-11 = "하여간 그래서 말인데~!"
2001502-12 = "수행부가 이상하다고 말하는 사람들한테, 아무리 그게 오해라고 말해도- 역시 말로만 해서는 진심이 전달되지 않는 법이잖아?"
2001502-13 = "사람은 보통 믿고 싶은 것만 믿는 법이니까 말이야!"
2001502-14 = "진정으로 서로의 진심을 이해하기 위해선……. 거기엔 반드시 영혼이 불타오를 만큼의 뜨거운 배틀이 있어야 하는 법이니까!"
2001502-15 = "지난주에 방송했던 무시퀸에서 그랬어!"
2001502-16 = "[s5] \"알고 보니 애니메이션의 이야기?!\"\n[s6] \"카에데, 그건 좀 다르지 않을까?!\""
2001502-17 = "어? 다른 거야? 으음~ 뭔가 어렵네~"
2001502-18 = "어? 다른 거야? 으음~ 뭔가 어렵네~"
2001502-19 = "하여간 그래서 오해를 바로잡을 좋은 방법이 없을까. 나, 고민하고 고민하고 또 고민했거든?"
2001502-20 = "그러다가 어제 츠바키 선배랑 미모리 선배랑 같이 저녁밥을 먹고 있을 때, 삐빗! 하고 엄청난 방법이 떠올랐지. 뭐야!"
2001502-21 = "저기, 그게 뭐라고 생각해? 선생님? 응응? 물어봐 줘!"
2001502-22 = "[s] \"신경 쓰이는걸, 무슨 방법이야?\""
2001502-23 = "후후후! 네네! 선생님! 나요나요! 방법이 있습니다앗! 그게 뭐냐면 말이야~!"
2001502-24 = "선생님도 알다시피 내가 또 엄청나게 귀엽고 똑똑하고, 또 귀여운……! 수행부의 마스코트잖아?"
2001502-25 = "그런 내가 직접- 수행부가 이상하지 않다고 홍보하는 거야!"
2001502-26 = "일명 마스코트 카에데 쨩! 혼신의 홍보 작전 개시 대작전!"
2001502-27 = "어때? 어떻게 생각해? 선생님? 이건 분명 성공할 거 같지 않아?!"
2001502-28 = "[s7] \"작전인지, 대작전인지, 어느 쪽인지는 잘은 모르겠지만…….\"\n[s8] \"그야말로 어마어마한 자신감……!\""
2001502-29 = "그런 의미에서 이제부터 선생님과 나는 영혼의 파트너로 결정이야!"
2001502-30 = "그런 의미에서 이제부터 선생님과 나는 영혼의 파트너로 결정이야!"
2001502-31 = "그러니 지금부터 같이 수행부 작전에 어울려 줘! 음~! 어울려줄 거지?!"
2001502-32 = "[s] \"응.\""
2001502-33 = "에헤헷! 그럼 출발~!"
2001502-35 = "(그리하여 카에데와 함께 수행부 홍보 작전이라는 걸 시작하게 되었다.)"
2001502-36 = "우선 수행부가 날마다 어떤 일을 하는지, 얼마나 도움이 되는지. 그걸 보여주는 게 좋다고 생각해! 평소보다 이렇게, 화려하게! 멋있게!"
2001502-37 = "그런 의미에서 가장 먼저 해볼 건 쓰레기 청소야!"
2001502-38 = "[s] \"오, 마을의 도움이 되는 활동이구나.\""
2001502-39 = "맞아! 이런 식으로 집게를 가지고 돌아다니다가-"
2001502-40 = "앗! 쓰레기 발견!"
2001502-45 = "이렇게 쓰레기를 주우면 끝! 간단하지?"
2001502-46 = "하지만……. 방심하면 안 돼. 선생님. 키보토스의 거리에는 어떤 쓰레기가 있을지 몰라. 예를 들면 저쪽 골목의 구석에는……."
2001502-47 = "아앗?!"
2001502-48 = "[s] \"무슨 일이야?! 카에데?!\""
2001502-49 = "이것 봐! 선생님! 여기 잔뜩 버려져 있는 거!"
2001502-50 = "[s] \"……이건 게임 카드들……?\""
2001502-51 = "응! 무시퀸의 카드들이야! 자세히 보니까……. 이제는 정규 게임에서 사용하는 게 금지된 옛날 카드들인가 봐!"
2001502-52 = "더는 쓸 수 없다고 해도 함부로 버리다니! 너무해!"
2001502-53 = "[s] \"그러게, 필요 없다고 해서 길바닥에 이렇게나 왕창 버리다니…….\""
2001502-54 = "카드와 쌓은 유대감은 어쩌고! 카드의 정령들이 화를 낼 거야!"
2001502-55 = "[s] \"그쪽의 이야기구나!\""
2001502-56 = "아! 그리고 저쪽에 또 쓰레기가……!"
2001502-59 = "(그렇게 한동안 카에데와 함께 열성적으로 미화 활동을 계속했다.)"
2001502-64 = "휴우. 이걸로 쓰레기도 제법 많이 모았네!"
2001502-68 = "어때, 선생님. 이걸로 다른 사람들도 수행부를 다시 보게 됐을까?!"
2001502-69 = "[s9] \"벌써?! 아니, 홍보라는 건 그렇게 쉬운 게 아니니까!\"\n[s10] \"당장 결과가 나오기보단, 꾸준히 하는 게 중요하다고 생각해.\""
2001502-70 = "그런 거야?!"
2001502-71 = "그런 거야?!"
2001502-72 = "으으음~~ 홍보란 거……. 생각보다 어려운 거구나."
2001502-73 = "응! 하지만 실망하지 않아! 아직 대작전은 계속되고 있으니까 말이야!"
2001502-74 = "그럼 다음엔 뭘 하면 좋을까……."
2001502-75 = "(카에데와 함께 다음 활동을 고민하며 잠시 머리를 맞대고 있을 무렵)"
2001502-76 = "이번엔 내가 그네에 탈래!"
2001502-77 = "뭐야~! 겨우 그것만 밀어주고 타겠다는 거야? 난 아까 엄청 많이 밀어줬는데!"
2001502-78 = "그래도 이번엔 내 순서잖아!"
2001502-79 = "아앗!! 거기! 너희들! 왜 싸우는 거야!!"
2001502-80 = "응? 수행부의 언니?"
2001502-81 = "있지있지! 언니! 들어봐! 순서대로 그네를 타기로 했는데, 동생이……!"
2001502-82 = "아냐! 제대로 순서 지키고 있는걸!"
2001502-83 = "스토옵! 그네 순번 때문에 싸우다니, 그러면 안 돼! 자매끼리 친하게 지내야지!"
2001502-84 = "자, 서로 사과하자!"
2001502-85 = "으, 으응……."
2001502-86 = "미, 미안해……."
2001502-87 = "[s] \"카에데, 굉장해!\""
2001502-88 = "이 정도는 가뿐하다구! 평소에 자주 같이 놀고 있으니까!"
2001502-89 = "[s] \"친구였구나! 어쩐지!\""
2001502-90 = "으음- 하지만 싸우고 난 다음에 바로 다시 친하게 놀려면 어떻게 해야……."
2001502-91 = "아! 나! 좋은 생각이 났어!"
2001502-95 = "다들, 이거 줄게!"
2001502-96 = "이게 뭐야?"
2001502-97 = "카드?"
2001502-98 = "응! 아까 주웠던 건데, 정규 게임에선 쓸 수 없지만. 이걸 가지고 놀면 그네 순번으로 싸울 필요 없어!"
2001502-99 = "그럼 내가 규칙을 설명해줄 테니까-"
2001502-100 = "크흠흠! 아, 목마르다."
2001502-101 = "[s] \"아, 그럼 잠깐 다 같이 마실 음료수를 사 올게.\""
2001502-102 = "앗, 정말?! 고마워! 선생님!"
2001502-104 = "(그리하여 놀이터 바깥쪽에 있는 자판기로 향할 때였다.)"
2001502-105 = "놀이터에 있는 저 아이…… 수행부의 아이로군요."
2001502-106 = "수행부라, 아, 그 이상한 아이들 말이군요."
2001502-107 = "[s] (응……? 아, 여기서도 이런 이야기가…….)"
2001502-108 = "후후……. 아이들과 저렇게나 열심히 놀아주다니, 조금 이상한 면이 있기는 해도 역시 좋은 아이들이죠."
2001502-109 = "네, 평소에도 길거리에서 백귀야행 자치구를 위해 노력해주는 모습을 종종 보곤 하니까요."
2001502-110 = "[s] (과연, 그런 이야기였구나…….)"
2001502-114 = "어머나? 무슨 소란일까?"
2001502-116 = "자! 다들 잘 봐! 무시퀸 게임을 할 땐, 이런 포즈를 취하는 게 좋아!"
2001502-117 = "적에게 공격하면서 이 포즈를 취하면 강해진 기분이 들거든!"
2001502-118 = "오오오!!"
2001502-119 = "다 같이 하는 거야! 무시퀸~~~!"
2001502-120 = "어택!"
2001502-121 = "무시퀸~~~!"
2001502-122 = "어택!"
2001502-124 = "역시나…… 조금은……. 이상하지만요……."
2001502-125 = "그러게 말이에요……."
2001502-128 = "앗! 선생님! 왔어? 봐봐! 어느새 이렇게 잔뜩 모여서! 다들 무시퀸을 좋아해 주고 있어!"
2001502-129 = "언니! 무시퀸 언니!"
2001502-130 = "굉장해! 언니!"
2001502-131 = "그냥 언니가 아니야! 무시퀸! 스승!"
2001502-132 = "무시퀸 스승! 스승님이다!"
2001502-133 = "엣-헴! 응! 이걸로 수행부 홍보 활동에 좀 더 한 걸음 다가간 거 아닐까?! 그치?! 선생님?!"
2001502-134 = "[s] \"으, 응, 그래…….\""
2001502-135 = "(아이들의 열광적인 지지 속에서, 오해가 더 깊어졌다는 말은 차마 전할 수 없었다.)"
2001502-136 = "에헤헤헷!"
