[translation]
31110-1 = "제11화;대청소!"
31110-2 = "자아, 그럼 이제부터 건물 주변에 무성한 잡초들부터 정리하는 거예요!"
31110-3 = "햇볕이 따가우니까, 열사병에 주의하면서……."
31110-8 = "네~"
31110-9 = "잡초 뽑기…… 이 정도야 뭐……."
31110-10 = "이해했어. 진지 주변에 적들이 은신할 수 있는 포인트는 제거해두는 것이 좋겠지."
31110-15 = "건물 주변을 정리하고 나면 건물 안쪽부터 하나씩 청소해 가는 거예요!"
31110-16 = "자, 시작합니다!"
31110-20 = "별관 주변의 잡초를 뽑고, 방치된 잡동사니를 정리했다."
31110-22 = "생활관 복도"
31110-23 = "이 복도는 먼저 빗자루로 먼지를 쓸어낸 뒤에, 대걸레로 닦아냅니다."
31110-24 = "먼지가 제일 많이 쌓이는 곳이니까 여러 번 반복해서 깨끗하게 만드는 거예요!"
31110-25 = "음. 문제없어."
31110-26 = "그다음에는 저희가 사용할 샤워실과 화장실, 세탁실을 정리해주시면 돼요."
31110-27 = "이해했어. 맡겨줘."
31110-30 = "생활관 복도를 깨끗하게 쓸고 닦았고,"
31110-31 = "앞으로 사용할 시설들을 청소하고 정비했다."
31110-33 = "별관 중앙 로비"
31110-34 = "콜록, 콜록…… 여기 먼지가 엄청 많아……."
31110-35 = "그러네요. 중앙 로비엔 가구들이 많아서…… 쌓인 먼지를 제대로 털어내지 않으면……."
31110-36 = "그 정도는 나도 알아! 정의실현부에서 많이 해 봤으니까!"
31110-37 = "먼지털이부터 사용한 뒤에 물걸레로 닦아내면 돼! 먼지가 많이 날 테니까 마스크는 필수고!"
31110-38 = "네, 그럼 맡길게요, 코하루 쨩!"
31110-41 = "(중앙 로비의 먼지를 털어내고, 가구를 구석구석 깨끗하게 닦아내었다.)"
31110-43 = "여기는……."
31110-44 = "아, 히후미 쨩. 여기는 제가 정리할게요."
31110-45 = "저희가 사용할 방이니까 특히 신경쓰지 않으면 안 되겠죠."
31110-46 = "침구류는 지금 빨아서 널어두면 오후까진 모두 마를 거고, 침대 매트리스도 낡은 건 다른 방의 안쓰는 것과 교체를 해두고……."
31110-47 = "무엇보다 자는 곳이니까 환기도 중요하죠."
31110-48 = "네, 그럼 맡길게요, 하나코 쨩."
31110-49 = "우후후. 네♡"
31110-53 = "별관 교실"
31110-56 = "별관 체육관"
31110-59 = "간이 주방 겸 식당"
31110-62 = "[ns] \"대충 끝인가…….\""
31110-63 = "응. 끝이야~ 완전 깔끔해졌어. 아하하, 상쾌하네."
31110-64 = "음…… 확실히."
31110-65 = "네, 이 정도면……. 다들 수고하셨습니다!"
31110-69 = "어머? 히후미 쨩? 아직 정리하지 못한 곳이 남았잖아요?"
31110-70 = "네? 어, 어디죠?"
31110-71 = "우후후. 야외 수영장이요."
31110-72 = "야, 야외수영장……?"
31110-75 = "여기는……."
31110-76 = "과연. 너무 넓어서 엄두를 못 냈었지. 하지만 보충수업에 수영 평가는 없을 텐데."
31110-77 = "마, 맞아! 여긴 우리가 앞으로도 쓸 일도 없잖아! 이걸 굳이 청소해야 해?"
31110-81 = "어머? 쓸일이 없어도 야외 수영장에 물이 채워져 있느냐 없느냐는 매우 중요해요."
31110-82 = "생각해보세요. 수영장에 물이 가득 채워져서 빛나고 있는 합숙실. 그리고 거기서 뛰어놀고 있는 여학생들……."
31110-87 = "그것만으로도 우리 모두의 기분이 좋아질 것 같지 않나요?"
31110-88 = "무, 무슨 소리야?! 하나도 모르겠어, 영문을 모르겠어!"
31110-89 = "확실히…… 이렇게 방치되어서 메말라버린 풀장을 보고 있으면 어쩐지 쓸쓸한 기분이……."
31110-90 = "한때 여기에도 물이 가득 차 있던 시기가 있었겠지. 즐거운 웃음소리가 울려 퍼진 적도 있었을 거야."
31110-91 = "하지만 결국은 이런 결말을 맞이할 수밖에 없는 거야. vanitas vanitatum. 그게 이 세계의 진실이니까."
31110-95 = "아우우……?"
31110-96 = "[ruby=vanitas vanitatum]헛되고 헛되도다[/ruby]…… 그러네요, 그런 고대의 금언이 있었죠……."
31110-97 = "……."
31110-98 = "응. 아즈사 쨩. 히후미 쨩. 코하루 쨩!"
31110-103 = "우리, 물놀이를 해요!"
31110-104 = "네?! 아, 아우……. 무, 물놀이요?!"
31110-105 = "네! 맞아요! 수영장을 깨끗이 청소하고 물을 채워서, 다같이 뛰어드는 거예요!"
31110-106 = "내일부터 우리는 공부해야 하잖아요? 말하자면 오늘이 마지막으로 쉴 수 있는 날이라는 거잖아요?"
31110-107 = "다같이 신나게 놀아두지 않으면, 분명 도중에 지쳐버릴지도 몰라요!"
31110-108 = "자아, 자아! 얼른 젖어도 상관없는 수영복을 입고 오세요! 지금부터 수영장 청소예요!"
31110-109 = "응. 이해했어. 모든 것이 헛될지라도 바로 오늘 최선을 다하지 않으면 안 돼."
31110-110 = "수영복인가? 확실히 챙겨 왔어. 문제없다."
31110-115 = "네? 아즈사 쨩……? 수영복을 가지러 간 거예요?! 아, 아우우……."
31110-116 = "자아, 자아! 히후미 쨩도! 코하루 쨩도 얼른 수영복…… 아니, 젖어도 문제없는 옷으로!"
31110-117 = "[s] \"하나코 눈이 무서워…….\""
31110-118 = "그치만 확실히 여기만 청소하지 않는 것도 신경 쓰이고……. 저도 갈아입고 올게요!"
31110-119 = "……?! 그, 그런 거야?! 보충수업과는 아무 상관없잖아…… 으으……."
31110-120 = "후후, 자아, 코하루 쨩?♡"
31110-127 = "아, 알았어! 알겠으니까!!"
31110-129 = "……."
31110-130 = "……."
31110-131 = "……."
31110-135 = "와아, 다들 젖어도 문제없는 복장이네요♡"
31110-136 = "응. 문제없어."
31110-137 = "아하하……. 학교 수영복이지만……. 역시 수영장 청소에는 이게 정석이랄까……."
31110-138 = "우후후♡ 좋아요. 그럼 다 함께 청소를 시작해볼까요?"
31110-142 = "잠깐잠깐잠깐!!"
31110-143 = "네? 뭐죠, 코하루 쨩?"
31110-144 = "그런데 왜 혼자만 교복이야?! 젖어도 상관없는 옷이라며!!"
31110-145 = "그 말 그대로인데요?"
31110-146 = "무슨 소리야! 왜 교복인데?! 어째서 이번엔 수영복이 아닌 거야?!"
31110-147 = "음…… 이건 미학의 문제인데요. 코하루 쨩."
31110-148 = "미학……?"
31110-149 = "수영복과 교복, 어느 쪽이 젖었을 때 더 기분 좋을까요?"
31110-150 = "그, 그런 걸 내가 알 리가 없잖아! 그리고 어째서 기준이 기분 좋음인 거야?! 누구의 기분인데?!"
31110-151 = "후후후. 농담이에요, 사실 안에 입고 있어요. 용돈으로 산 비키니 수영복이지만."
31110-152 = "응……? 그, 그런거면……."
31110-153 = "학원에서는 지정된 수영복을 입어야 하지만 이정도는 봐줄 수 없을까요?"
31110-154 = "학원 수영복은 좀 전에 세탁기에 넣어버려서……. 이것밖에 없거든요."
31110-155 = "아, 아니……. 딱히…… 그, 그 정도는…… 뭐……. 사, 상관없긴 한데……."
31110-157 = "우후후, 자아, 그럼 다들 준비되셨나요?"
31110-158 = "청소 시작합니다!"
31110-171 = "와아아- 이것 보세요! 무지개예요!"
31110-172 = "우와앗?! 자, 잠깐만요? 차가워요, 하나코 쨩!"
31110-173 = "우후후, 그렇죠? 트리니티 근처 호수에서 끌어온 거니까, 마셔도 될 정도로 깨끗한 물이에요!"
31110-174 = "으으……. 어째서 이렇게……."
31110-175 = "이쪽은 다 마무리되어 간다. 금방 끝내주겠어."
31110-177 = "(다같이 청소를 끝내고, 수영장에 물을 채워넣기 시작했다.)"
31110-178 = "(하지만 수영장에 들어갈 수 있을 정도로 물이 채워진 건 늦은 밤 무렵이었다.)"
31110-180 = "다음화;합숙의 첫날 밤"
