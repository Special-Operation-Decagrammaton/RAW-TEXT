[translation]
70015010-1 = "伊吹離家出走事件（１）"
70015010-2 = "萬魔殿．辦公室"
70015010-3 = ""
70015010-4 = "討厭～～～～！！！"
70015010-5 = "真琴前輩，最討厭你了！！"
70015010-6 = ""
70015010-8 = ""
70015010-9 = ""
70015010-10 = ""
70015010-11 = ""
70015010-12 = "伊吹～～～！！"
70015010-13 = ""
70015010-15 = ""
70015010-16 = ""
70015010-17 = "啊啊，又闖禍了呢。"
70015010-18 = "那是失誤，是失誤啦！"
70015010-19 = "你這傢伙，伊呂波！#n為什麼不在布丁上寫名字！"
70015010-20 = "要是寫了，你就會專挑我的搶來吃吧。"
70015010-21 = "當然！我又沒瘋，怎麼可能搶伊吹的布丁來吃！"
70015010-22 = "所以我的就無所謂嗎！#n搶別人的東西吃本來就不對啊！！"
70015010-23 = "可惡～！本大人居然又犯下這種錯誤！！"
70015010-24 = ""
70015010-26 = ""
70015010-27 = ""
70015010-28 = "伊吹醬一轉眼就不知道跑到哪去了。#n我本來還想追上去安慰他呢。"
70015010-29 = "看來這次會鬧上好一陣子，沒問題嗎？真琴醬。"
70015010-30 = "唔……"
70015010-31 = "伊吹醬一個人不要緊嗎？"
70015010-32 = "只要在格黑娜學園裡，應該不會出什麼事吧。#n畢竟沒有學生不認識伊吹嘛。"
70015010-33 = "話是這樣說沒錯啦！"
70015010-34 = ""
70015010-36 = ""
70015010-37 = ""
70015010-38 = ""
70015010-39 = ""
70015010-40 = "伊，伊吹……原諒我吧……"
70015010-41 = "完全是一副失魂落魄的表情呢……"
70015010-42 = "不過我們還是先去伊吹醬可能會去的地方找找看吧！#n他一個人待著的話會更難過的。"
70015010-43 = "說，說的也是。#n伊吹，你在哪裡～"
70015010-44 = "說不定就在附近。#n像是兒童遊戲室，或是伊呂波醬的祕密基地之類的。"
70015010-45 = "得趕快找到他才行。"
70015010-47 = "（花了好一段時間把附近全都找了一遍，但……）"
70015010-49 = ""
70015010-50 = ""
70015010-52 = ""
70015010-53 = "伊吹～！！"
70015010-54 = ""
70015010-56 = ""
70015010-58 = "伊吹～～～！！"
70015010-60 = ""
70015010-61 = ""
70015010-62 = ""
70015010-63 = "伊吹～～～～！！！"
70015010-65 = "（還是沒能找到伊吹……）"
70015010-67 = "咯呵呵，今天運氣真好呢～"
70015010-68 = "才不是運氣，是實力！"
70015010-69 = "好啦好啦，就當作是那樣吧。"
70015010-70 = ""
70015010-72 = ""
70015010-73 = "最近接到了很多不錯的委託。#n一定是我們的能力漸漸廣為人知了吧。"
70015010-74 = "耶，耶嘿嘿……亞瑠大人可是世界上最帥氣的法外之徒……"
70015010-75 = "今天遙香社員的表現特別出色呢。#n以後也要繼續保持哦！"
70015010-76 = "這，這種稱讚我實在擔當不起……"
70015010-77 = "謝謝您謝謝您謝謝您……！"
70015010-78 = ""
70015010-80 = ""
70015010-81 = "多虧這樣，這個月的荷包寬裕了不少呢！"
70015010-82 = "沒錯。事務所的房租也總算又繳得出來了。"
70015010-83 = "啊啊～我們以前露宿的那個地方不太會吹到風，位置其實挺不錯的呢。"
70015010-84 = "別懷念那種地方啦！#n要胸懷大志才行！"
70015010-85 = "咯呵呵，那就像這次委託人的事務所那樣，#n換成每人都有個人房的市中心頂級豪宅如何？辦得到嗎？"
70015010-86 = "（咕嘟……）"
70015010-87 = "哦呵呵！那，那種程度輕輕鬆鬆……應，應該吧？Maybe！"
70015010-89 = ""
70015010-90 = ""
70015010-91 = "那個孩子是……？"
70015010-93 = ""
70015010-94 = "哼！"
70015010-95 = "最討厭了。真琴前輩是大騙子。"
70015010-96 = "明明說好再也不吃伊吹的布丁了。"
70015010-97 = "真琴前輩是笨蛋。#n笨蛋，大笨蛋。"
70015010-98 = "……"
70015010-99 = "嗚嗚……對不起罵了你，真琴前輩……"
70015010-100 = ""
70015010-102 = ""
70015010-103 = "才不是！又吃掉伊吹的布丁，本來就是不對的！"
70015010-104 = "……"
70015010-105 = "嗚嗚。"
70015010-106 = ""
70015010-108 = ""
70015010-109 = "話說，這裡是哪裡呢？"
70015010-110 = "剛才太生氣，走著走著就跑到這裡來了……"
70015010-111 = "嗚嗚……"
70015010-113 = ""
70015010-114 = "課長，都說要走了，你在看什麼看得那麼專心？"
70015010-115 = "啊，那邊……"
70015010-116 = "嗯？有個小孩呢。#n是迷路的孩子嗎？"
70015010-117 = "呵呵，迷路的孩子就要幫他找到監護人才行！"
70015010-118 = ""
70015010-120 = ""
70015010-121 = "啊，社長……那孩子是……"
70015010-122 = "唔嗯。話都沒聽完就走掉了。"
70015010-123 = "為什麼伊吹會在這種地方？"
70015010-125 = ""
70015010-126 = ""
70015010-127 = "你好～！小妹妹！"
70015010-128 = "啊，你好。漂亮的姐姐。"
70015010-129 = "漂，漂亮……"
70015010-130 = "哦呵呵呵！你還挺有眼光的嘛？呵呵，很好。"
70015010-131 = "就由姐姐負責送你回去吧！"
70015010-132 = "嗯？你知道伊吹是從哪裡來的嗎？"
70015010-133 = "接下來才要……"
70015010-134 = ""
70015010-136 = ""
70015010-137 = "咦……你，該不會……"
70015010-138 = ""
70015010-140 = ""
70015010-141 = "等，等一下。你，你是……"
70015010-142 = "萬，萬，萬魔殿！？"
70015010-143 = "哇啊～！姐姐，你真的知道耶！"
70015010-144 = ""
70015010-146 = ""
70015010-147 = ""
70015010-148 = ""
70015010-149 = "萬魔殿～～～～！？"
70015010-150 = "難怪覺得在哪裡看過，原來是萬魔殿的孩子！"
70015010-151 = "怎麼辦？這下該怎麼辦？"
70015010-152 = ""
70015010-154 = ""
70015010-155 = "哼，那又怎樣？"
70015010-156 = "只要帶他到格黑娜學園附近，他自己就會找路回去了吧。#n又不是一兩歲的小孩。"
70015010-157 = ""
70015010-159 = ""
70015010-160 = ""
70015010-161 = "不行。這孩子現在一定非常孤單又不安。我們得幫他才行。"
70015010-162 = ""
70015010-164 = ""
70015010-165 = ""
70015010-166 = "說什麼傻話！我們明明說好不再跟格黑娜扯上關係了。"
70015010-167 = "而且還是統治格黑娜的萬魔殿的孩子！#n誰知道會發生什麼事？"
70015010-168 = ""
70015010-170 = ""
70015010-171 = ""
70015010-172 = "你應該也很清楚，孩子一個人走散時有多辛苦、多難過吧？#n陪在他身邊吧。"
70015010-173 = ""
70015010-175 = ""
70015010-176 = ""
70015010-177 = "嗚，嗚啊……"
70015010-178 = ""
70015010-180 = ""
70015010-181 = ""
70015010-182 = ""
70015010-183 = "姐姐，你還好嗎？#n突然一直流汗……有哪裡痛嗎？"
70015010-184 = "（這孩子……明明自己一個人應該很不安，卻反過來握住了我的手……）"
70015010-185 = ""
70015010-187 = ""
70015010-188 = ""
70015010-189 = "好，跟著姐姐走就對了！#n我會把你送回萬魔殿的！"
70015010-190 = ""
70015010-192 = ""
70015010-193 = "社長，你在說什麼？#n要去萬魔殿？"
70015010-194 = "……嗯！這就是我該做的事！"
70015010-195 = "我大概知道你為什麼會這麼想……不過先等一下，社長。"
70015010-196 = "看見迷途的羔羊，就要引導他走向正確的地方，這才是冷酷硬派的惡黨該有的態度！"
70015010-197 = "雖然做好事是沒錯，但這真的算惡黨的態度嗎！？#n總之你先等等……"
70015010-198 = "不要！伊吹才不要回去！"
70015010-199 = ""
70015010-201 = ""
70015010-202 = ""
70015010-203 = "真琴前輩把伊吹的布丁吃掉了！"
70015010-204 = "伊吹在氣消之前都不會回去的！哼！！"
70015010-205 = ""
70015010-207 = ""
70015010-208 = ""
70015010-209 = ""
70015010-210 = "這，這樣啊……？"
70015010-211 = "這，這下怎麼辦……？"
