[translation]
70015010-1 = "이부키 가출사건 1"
70015010-2 = "만마전 집무실"
70015010-4 = "싫어~~~~!!!"
70015010-5 = "마코토 선배, 미워!!"
70015010-12 = "이부키이이이!!"
70015010-17 = "아아, 또 저지르셨네요."
70015010-18 = "실수다, 실수라고!"
70015010-19 = "네 이 녀석, 이로하! 어째서 푸딩에 이름을 써놓지 않았던 거냐!"
70015010-20 = "그럼 제 것만 골라서 뺏어드실 거잖아요."
70015010-21 = "당연하지! 내가 미쳤다고 이부키의 푸딩을 빼앗아 먹겠느냐!"
70015010-22 = "그럼 제 꺼는 괜찮냐고요! 뺏어먹는 게 잘못이잖아요!!"
70015010-23 = "제에엔장! 이 몸이 또 이런 실수를!!"
70015010-28 = "이부키 쨩, 그새 어딘가로 사라졌어. 따라가서 달래주려고 했는데."
70015010-29 = "아무래도 이번에는 꽤 오래 갈 것 같은데, 괜찮겠어? 마코토 쨩."
70015010-30 = "크윽……."
70015010-31 = "이부키가 혼자 있어도 괜찮을까요?"
70015010-32 = "게헨나 학원 안에서야 별 일 없겠지. 이부키를 모르는 학생은 없잖아?"
70015010-33 = "그렇긴 하지만요!"
70015010-40 = "이, 이부키…… 용서해다오……."
70015010-41 = "정말 넋이 나간 표정이네요……."
70015010-42 = "그래도 이부키 쨩이 갈 만한 곳 위주로 한 번 찾아보죠! 혼자 있으면 더 슬플 거예요."
70015010-43 = "그, 그래야겠다. 이부키, 어디 있니~"
70015010-44 = "아마 근처에 있지 않을까. 놀이방이라든지, 이로하 쨩의 아지트라든지."
70015010-45 = "아무튼 얼른 찾아야겠네요."
70015010-47 = "(한동안 근처를 모두 찾아보았지만……)"
70015010-53 = "이부키~!!"
70015010-58 = "이부키이이이~~~!!"
70015010-63 = "이부키이이이이이이~~~~!!!"
70015010-65 = "(이부키를 찾을 수는 없었다…….)"
70015010-67 = "쿠후후, 오늘은 운이 좋은 날이네~"
70015010-68 = "운이 아냐, 실력이라고!"
70015010-69 = "그래, 그래. 그런 걸로 하자구."
70015010-73 = "최근 괜찮은 의뢰가 많이 들어오고 있어. 우리의 유능함이 점점 널리 알려지고 있는 거겠지."
70015010-74 = "헤, 헤헤…… 아루 님은 세상에서 가장 멋진 해결사니까요……."
70015010-75 = "오늘 하루카 사원의 활약이 특히 돋보였지. 앞으로도 이런 식으로만 부탁해!"
70015010-76 = "그, 그런 과한 칭찬을……"
70015010-77 = "감사합니다감사합니다감사합니다……!"
70015010-81 = "덕분에 이번 달은 지갑에 꽤나 여유가 생겼네!"
70015010-82 = "맞아. 덕분에 사무실 임대료도 다시 낼 수 있었고."
70015010-83 = "아아~ 우리 노숙하던 자리, 바람도 덜 들어오고 꽤 좋은 포지션이었는데."
70015010-84 = "그런 걸 그리워하지 말란 말이야! 포부를 크게 가져야지!"
70015010-85 = "쿠후후, 그렇다면 이번 의뢰인의 사무실처럼 개인실이 하나씩 딸린 도심지의 최고급 펜트하우스는 어때? 가능하려나?"
70015010-86 = "(꿀꺽…….)"
70015010-87 = "오호홋! 그, 그정도는 가뿐하…… 하, 할지도? 메이비!"
70015010-91 = "……저 아이는……?"
70015010-94 = "……흥!"
70015010-95 = "미워. 거짓말쟁이 마코토 선배."
70015010-96 = "다시는 이부키의 푸딩 먹지 않겠다고 해놓고."
70015010-97 = "마코토 선배는 바보야. 바보, 말미잘."
70015010-98 = "……."
70015010-99 = "우우…… 욕해서 미안해요, 마코토 선배……."
70015010-103 = "……아니야! 또 이부키의 푸딩을 먹은 건 분명 잘못이야!"
70015010-104 = "……."
70015010-105 = "히잉."
70015010-109 = "그런데 여기는 어디일까?"
70015010-110 = "화가 나서 걷다가 보니 여기까지 와버렸는데……."
70015010-111 = "우우……."
70015010-114 = "과장, 가자니까 뭘 그렇게 보고 있어?"
70015010-115 = "아, 저기……."
70015010-116 = "응? 아이가 있네. 미아인가?"
70015010-117 = "후후, 길을 잃은 아이는 보호자를 찾아줘야지!"
70015010-121 = "앗, 사장…… 그 아이는……."
70015010-122 = "으음. 안 듣고 가버렸네."
70015010-123 = "……어째서 이부키가 이곳에 있는 거지?"
70015010-127 = "안녕~! 꼬마 아가씨!"
70015010-128 = "아, 안녕하세요. 예쁜 언니."
70015010-129 = "예, 예쁜……."
70015010-130 = "오호호홋! 너, 보는 눈이 있구나? 후후, 좋았어."
70015010-131 = "이 언니가 책임지고 너를 데려다줄게!"
70015010-132 = "응? 이부키가 어디서 왔는지 알아?"
70015010-133 = "그건 이제부터……"
70015010-137 = "어…… 너, 혹시……."
70015010-141 = "자, 잠깐. 너, 너……"
70015010-142 = "마, 마, 만마전?!"
70015010-143 = "와아~! 언니, 정말 알고 있었구나!"
70015010-149 = "만마전~~~~?!?!"
70015010-150 = "어디서 많이 봤다 했더니 만마전의 아이였어!"
70015010-151 = "어쩌지? 이를 어쩌지?"
70015010-155 = "흥, 그게 뭐 어떻다고?"
70015010-156 = "그냥 게헨나 학원 주변에 데려다 주면 알아서 찾아가겠지. 한 두 살 먹은 어린애도 아니고."
70015010-161 = "아니야. 지금 이 아이는 매우 외롭고 불안한 상태일 거야. 우리가 도와줘야 해."
70015010-166 = "무슨 소리! 게헨나와는 더 이상 엮이지 않기로 했잖아."
70015010-167 = "그것도 게헨나를 지배하는 만마전 소속의 아이라고! 무슨 일이 일어날 줄 알고?"
70015010-172 = "혼자 떨어진 아이가 얼마나 힘들고 슬픈지는 너도 알고 있잖아? 옆에 있어줘."
70015010-177 = "으, 으아……."
70015010-183 = "언니, 괜찮아? 갑자기 땀을 흘리고…… 아파?"
70015010-184 = "(이 아이…… 혼자서 불안했을 텐데, 오히려 내 손을 잡아주고 있어…….)"
70015010-189 = "좋아, 언니만 따라와! 너를 만마전에 데려다 줄게!"
70015010-193 = "사장, 무슨 말이야? 만마전으로 간다고?"
70015010-194 = "……응! 그게 내가 해야 할 일이야!"
70015010-195 = "왜 그런 생각을 했는지는 알겠지만…… 일단 잠깐만, 사장."
70015010-196 = "길 잃은 어린 양을 보았다면, 올바른 곳으로 인도하는 것이 하드보일드한 악당의 자세!"
70015010-197 = "아니, 좋은 일이긴 한데 악당의 자세인가?! 싶기도 하고…… 아무튼 기다려 봐……"
70015010-198 = "아니야! 이부키는 돌아가지 않을 거야!"
70015010-203 = "마코토 선배가 이부키의 푸딩, 먹어버렸어!"
70015010-204 = "이부키는 화가 풀릴 때까지 돌아가지 않을 거야! 흐응!!"
70015010-210 = "……그, 그래……?"
70015010-211 = "어, 어쩐다……?"
