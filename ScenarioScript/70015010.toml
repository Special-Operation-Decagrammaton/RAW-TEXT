70015010-19 = "นี่ ยัยอิโรฮะ! ทำไมถึงไม่เขียนชื่อไว้บนพุดดิ้งกันล่ะ!"
70015010-20 = "ถ้าเขียนไว้ รุ่นพี่ก็จะเลือกแย่งกินเฉพาะของฉันน่ะสิคะ"
70015010-21 = "ก็ใช่น่ะสิ! เราไม่ได้บ้าระห่ำพอที่จะแย่งพุดดิ้งของอิบูกิมากินหรอกนะ!"
