[translation]
70015010-1 = "イブキ家出事件（１）"
70015010-2 = "万魔殿・執務室"
70015010-4 = "うわーん！！"
70015010-5 = "マコト先輩なんてもう知らない！！！"
70015010-12 = "イブキィー！"
70015010-17 = "はぁ……またですか。"
70015010-18 = "またとはなんだ！またとは！"
70015010-19 = "イロハ！なぜプリンに名前を書いていない！？"
70015010-20 = "いや、書いたら私のを食べるじゃないですか。"
70015010-21 = "当たり前だ！イブキのを食べるわけにはいかんからな！"
70015010-22 = "誰のでもダメです！自分で買ってきてください。"
70015010-23 = "くっ……！このマコト様が同じ過ちを繰り返すとは……！"
70015010-28 = "どうするの？イブキちゃん、どこかへ行っちゃったわよ。"
70015010-29 = "あの様子を見る限り、今回は長引きそうね。"
70015010-30 = "くっ……。"
70015010-31 = "イブキちゃん、一人で大丈夫でしょうか？"
70015010-32 = "学園内にいる限りは大丈夫だと思うけど……。"
70015010-33 = "そ、そうですよね！"
70015010-40 = "い、イブキ……許してくれ……。"
70015010-41 = "抜け殻のようになってますね……。"
70015010-42 = "イブキちゃんが行きそうな場所を探してみましょう！#nきっと寂しい思いをしているはずです！"
70015010-43 = "あ、ああ！イブキィー！どこにいるー！"
70015010-44 = "そんなに遠くへは行っていないと思うけど……。#nキッズスペースや、イロハのアジト辺りにいるんじゃないかしら？"
70015010-45 = "そうですね、早いところ見つけてあげましょう。"
70015010-47 = "（マコトたちは辺りをしらみ潰しに探したが……）"
70015010-53 = "イブキィー！"
70015010-58 = "イブキィーー！！"
70015010-63 = "イブキィーーー！！！"
70015010-65 = "（イブキは見つからなかった……）"
70015010-67 = "くふふっ、今日は運が良かったね～"
70015010-68 = "う、運じゃないわ！実力よ！"
70015010-69 = "そうだね～、そういうことにしとこっか！"
70015010-73 = "最近は実入りのいい仕事がたくさん入ってきているのよ！#nふふっ、とうとう私たちが世間に認められたんだわ！"
70015010-74 = "えへへ……アル様は世界一のアウトローですから……。"
70015010-75 = "あ、ありがとう……！でも、今日はハルカが大活躍だったじゃない！#nその調子でこれからもよろしくね！"
70015010-76 = "そ、そんな、身に余るお言葉……！"
70015010-77 = "ありがとうございます、ありがとうございます、ありがとうございます……！"
70015010-81 = "おかげで今月は余裕ありそうだよね♪"
70015010-82 = "ええ。事務所の家賃もバッチリよ！"
70015010-83 = "前に野宿してたところも好きだったけどね。#n風もあんまり当たらなかったし。"
70015010-84 = "あ、あれは忘れていいの！目標はもっと高く持たないと！"
70015010-85 = "そう？なら今度の依頼主の事務所みたいに……。#n都心の個室付き最高級ペントハウスにするのはどう？"
70015010-86 = "（ゴクリ……）"
70015010-87 = "え、ええ！いいわ！そのくらい余裕よ！……多分。"
70015010-91 = "あれ？あの子……。"
70015010-94 = "……むぅ。"
70015010-95 = "マコト先輩の嘘つき。"
70015010-96 = "もうイブキのプリン食べないって約束したのに。"
70015010-97 = "マコト先輩のバカ。"
70015010-98 = "……。"
70015010-99 = "うぅ……いじわる言ってごめんなさい……。"
70015010-103 = "……ううん！イブキのプリンを食べたマコト先輩が悪いんだもん！"
70015010-104 = "……。"
70015010-105 = "ひぐっ。"
70015010-109 = "あれ？ここ、どこだろう……。"
70015010-110 = "知らないところだ。"
70015010-111 = "うぅ……。"
70015010-114 = "カヨコ？何を見てるの？"
70015010-115 = "えっと、あそこに……。"
70015010-116 = "あら、小さい子ね。一人かしら。"
70015010-117 = "迷子なら保護者を探してあげないと！"
70015010-121 = "社長……あの子は――"
70015010-122 = "行っちゃった。"
70015010-123 = "……なんでイブキがこんなところに？"
70015010-127 = "こんにちは、かわいいお嬢ちゃん。どうしたのかしら？"
70015010-128 = "……あ、こんにちは。綺麗なおねえちゃん。"
70015010-129 = "き、綺麗……。"
70015010-130 = "こ、この子見る目あるじゃない！気に入ったわ！"
70015010-131 = "安心してね。お姉ちゃんがちゃんと元いたところに連れていってあげるから。"
70015010-132 = "おねえちゃん、イブキがどこから来たのか知ってるの？"
70015010-133 = "それはこれから……。"
70015010-137 = "待って、あなた……。"
70015010-141 = "もしかして……。"
70015010-142 = "[ruby=パンデモニウム・ソサエティー]万魔殿！？[/ruby]"
70015010-143 = "うん、そうだよ！"
70015010-149 = "万魔殿！？！？"
70015010-150 = "どこかで見たことあると思ったけど……あそこの子だったなんて……。"
70015010-151 = "ど、どうしましょう……？"
70015010-155 = "どうするも何も、できるだけ関わらない方が良いに決まってるじゃない。"
70015010-156 = "ゲヘナ学園の近くまで連れて行ったら、勝手に帰るわよ。"
70015010-161 = "ダメよ！この子は今一人で不安になっているはず。私たちが助けないと！"
70015010-166 = "バカなこと言わないで！ゲヘナとはもう関わらないって決めたでしょ！"
70015010-167 = "しかも、よりにもよってあの万魔殿と！一体なにが起こるか……。"
70015010-172 = "子どもが一人の時どれだけ心細いか、あなたは知っているでしょう？#nそばにいてあげないとダメよ。"
70015010-177 = "う、うーん……。"
70015010-183 = "おねえちゃん、すごい汗だよ？どこか痛いの？"
70015010-184 = "（この子……一人で不安なはずなのに、私のことを気にかけて……）"
70015010-189 = "いいわ……あなたを、万魔殿まで送ってあげる！"
70015010-193 = "……アルちゃん、本気で万魔殿に行くつもり？"
70015010-194 = "……ええ！だって、私がやるべきことだもの！"
70015010-195 = "そう思った経緯は大体予想がつくけど……一度落ち着いて、社長。"
70015010-196 = "ハードボイルドなアウトローたるもの……迷える子羊を見たら、正しく導かないと！"
70015010-197 = "ハードボイルドかどうかはともかく、アウトローではないと思うけど……。"
70015010-198 = "やだ！帰らない！"
70015010-203 = "マコト先輩がイブキのプリン食べちゃったんだもん！"
70015010-204 = "だからもう帰らない！"
70015010-210 = "……そ、そう……？"
70015010-211 = "ど、どうするのよ……これ……。"
