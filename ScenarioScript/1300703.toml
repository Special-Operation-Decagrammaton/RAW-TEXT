[translation]
1300703-1 = "가짜 음식"
1300703-2 = "게헨나 학원 식당"
1300703-3 = "늦었잖아, 선생님!"
1300703-4 = "모처럼 내가 귀한 음식을 준비해 왔는데, 10분이나 늦다니! 죽어 마땅하다구!"
1300703-5 = "아니지, 죽어버리면 모처럼 준비한 음식을 먹을 수 없으니까……"
1300703-6 = "이번 한 번만 용서해주는 거야! 다음엔 늦으면 안 돼!"
1300703-7 = "[s] \"그나저나 고급 해산물이라니?\""
1300703-8 = "물론 진짜 해산물을 준비한 건 아니야. 고급 해산물은 엄청나게 비싸니까."
1300703-9 = "대신 내가 오늘 준비한 요리는…… 바로 혀를 속이는 요리야!"
1300703-10 = "[s] \"혀를 속이는 요리?\""
1300703-11 = "응, 사람의 혀는 워낙 예민한 기관이니까. #n가끔 여러가지 음식을 함께 먹을 때 새로운 맛을 느끼기도 하잖아?"
1300703-12 = "인터넷에서 보았는데, 이 방법을 이용하면 싸구려 재료를 섞어서 고급 해산물의 맛을 낼 수도 있대."
1300703-13 = "이름하야…… 가짜 성게알!"
1300703-14 = "[s] \"이건…… 편의점 푸딩과 간장이잖아?\""
1300703-15 = "응, 내가 본 정보에 따르면 푸딩에 간장을 뿌려 먹으면 성게알 맛이 난대."
1300703-16 = "어떤 원리인지는 모르겠지만…… 평범하게 시도되지 않는 조합인만큼 신기한 맛이 날 거야!"
1300703-17 = "자, 선생님부터 먹어 봐!"
1300703-18 = "[s] 간장에 버무린 푸딩을 한 입 먹는다."
1300703-19 = "어때? 정말 성게알 맛이 나?"
1300703-20 = "[s] \"………잘 모르겠어.\""
1300703-21 = "이상하다. 분명 성게알 맛이 난다고 했는데……. (하읍)"
1300703-22 = "…………."
1300703-23 = "짜고…… 달고…… 이상해……."
1300703-24 = "이게 뭐야! 이 맛의 어디가 성게알이랑 비슷한 건데? 하나도 안 똑같잖아!"
1300703-25 = "으으…… 가짜 정보에 속은 걸까."
1300703-26 = "하, 하지만 괜찮아! 아직 시험해 볼 레시피는 잔뜩 남아있거든!"
1300703-27 = "다음은 이거야!"
1300703-28 = "[s] \"……아보카도?\""
1300703-29 = "응, 같은 원리로 아보카도 위에 간장을 뿌려 먹으면 참치회 맛이 난대!"
1300703-30 = "아보카도도, 참치회도 똑같이 기름진 음식이니 분명 이번에는 제대로 된 맛이 나겠지?"
1300703-32 = "자 그럼…… 잘 먹겠습니다!"
1300703-34 = "………속았어."
1300703-35 = "완전히 속았어! 이게 다 뭐야! #n제대로 된 맛이 나는 음식이 하나도 없잖아!"
1300703-36 = "참치회 맛이 난다는 아보카도와 간장의 조합도, 연어알 맛이 난다는 귤과 간장의 조합도…… 모두 괴상한 맛 밖에 안 나!"
1300703-37 = "이런 건 이즈미가 아니고서야 아무도 좋아하지 않을 거라고!"
1300703-38 = "으으, 저렴한 가격으로 비싼 해산물을 잔뜩 맛볼 수 있을 줄 알고 기대했는데……."
1300703-39 = "응? 이 재료를 살 돈이면 진짜 해산물을 구입할 수 있지 않느냐고?"
1300703-40 = "어디보자…… 푸딩 세트에 간장이랑, 아보카도, 그리고 귤까지……."
1300703-42 = "정말이네! 회전 초밥집에서 한 끼 식사를 할 수 있는 수준의 금액이잖아?"
1300703-43 = "또 속았어! 역시 인터넷에는 거짓 정보 뿐이야! 으앙~!"
