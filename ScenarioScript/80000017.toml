[translation]
80000017-1 = "달콤한 야근"
80000017-2 = "샬레 건물 입구"
80000017-9 = "하아…… 드디어 서버 점검이 끝났네……."
80000017-10 = "분명 의뢰받은 내용은 단순한 정기 점검 업무뿐이었는데. 날짜가 바뀌자마자 갑자기 엄청난 양의 메일이 쏟아지기 시작해서……."
80000017-11 = "과부하가 일어나지 않도록 계속 대응하느라, 하루종일 서버실에서 나갈 수가 없었어……."
80000017-12 = "[s] \"밤늦게까지 정말 수고 많았어.\""
80000017-16 = "아니야. 해커에게 이 시간대는 오히려 이른 저녁에 가깝지."
80000017-17 = "……다만 몸이 피로하다는 사실은 부인할 수 없겠네."
80000017-18 = "선생님, 괜찮다면 커피 한 잔만 사주지 않을래?"
80000017-19 = "자판기에서 파는 캔 커피라도 괜찮으니까, 빨리 카페인을 보충하고 싶어……."
80000017-24 = "[ns] 치히로에게 캔 커피를 건넨다."
80000017-30 = "……하, 카페인이 들어가니 조금은 살 것 같네."
80000017-31 = "그나저나 어째서 오늘따라 갑자기 선생님에게 대량의 메일이 쏟아진 거지?"
80000017-32 = "게다가 철야를 하고 나오니 뭔가 거리의 풍경도 바뀐 것 같고……."
80000017-33 = "……<발렌타인 데이>, 기념행사?"
80000017-34 = "아아, 오늘이 발렌타인 데이였구나."
80000017-35 = "그래서 샬레에 디도스 공격이 연상될 정도의 무수한 러브레터가 쏟아진 건가……."
80000017-36 = "……헤에. 인기 많구나, 선생님."
80000017-37 = "[s] \"……미안해.\""
80000017-38 = "아니야. 선생님의 잘못도 아닌걸."
80000017-39 = "그나저나 이를 어쩌지? 나는 하루종일 서버를 점검하느라 선생님에게 줄 초콜릿을 준비하지 못했는데."
80000017-40 = "지금 문을 연 상점도 거의 없을 테고……."
80000017-41 = "음, 어쩔 수 없으려나."
80000017-48 = "자, 선생님. 받아."
80000017-49 = "[s] \"……이건?\""
80000017-50 = "내가 주는 발렌타인 초콜릿이야. 받아주었으면 좋겠어."
80000017-51 = "엄밀히 말하면 '초콜릿'도 아니지만…… 그렇다고 해서 설마 거절하지는 않겠지?"
80000017-52 = "난 이 초콜릿 음료수, 꽤 좋아해."
80000017-53 = "한밤중에 당분과 카페인이 동시에 끌릴 때 고를 수 있는, 몇 안 되는 선택지거든."
80000017-54 = "언제나 그 자리에서 조용하게 자신의 존재감을 드러내는 녀석……."
80000017-58 = "그러니까, 이게 내가 줄 수 있는 진심이야."
80000017-59 = "즐거운 발렌타인 데이가 되었으면 좋겠네."
