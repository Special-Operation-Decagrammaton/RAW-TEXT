[translation]
2300006-1 = "잠깐의 데이트"
2300006-2 = "샬레 집무실"
2300006-4 = "(미뤄왔던 서류 업무들이 집무실 책상을 뒤덮었다.)"
2300006-5 = "(아무래도…… 당분간은 업무에만 집중해야 할 것 같다.)"
2300006-6 = "띵동~"
2300006-7 = "[ns] \"응? 모모톡인가?\""
2300006-11 = "[ns] \"지금은 일을 우선하자.\""
2300006-15 = "(이후로도 몇번 모모톡 알림이 울렸지만, 애써 무시하고 일에 집중했다.)"
2300006-17 = "(다음 날)"
2300006-18 = "(밤을 새우고도 점심이 조금 지나서야 쌓여있던 서류철들을 모조리 치울 수 있었다.)"
2300006-22 = "(잠을 잘까 했지만, 커피를 많이 마신 탓인지 잠이 오지 않는다.)"
2300006-23 = "(고민 끝에 잠깐 산책을 다녀오기로 했다.)"
2300006-26 = "(샬레 주변의 한적한 산책로를 따라, 익숙한 얼굴이 눈에 보였다.)"
2300006-28 = "[s] \"아이리?\""
2300006-29 = "앗, 선생님?"
2300006-30 = "와아! 선생님. 오랜만이에요!"
2300006-31 = "어디 가시는 길이세요?"
2300006-32 = "네? 산책하러 나오셨다고요?"
2300006-33 = "그럼 지금은 바쁘신 건 아니죠?"
2300006-34 = "와아, 다행이다. 정말 보고 싶었어요! 선생님. 헤헷."
2300006-35 = "[s1] \"아이리는 잘 지냈어?\"\n[s2] \"걱정시켜서 미안.\""
2300006-36 = "그럼요, 선생님."
2300006-37 = "언제나처럼 즐겁게 지내고 있어요."
2300006-38 = "아, 아뇨. 그렇지 않아요."
2300006-39 = "제가 너무 신이 났었나봐요. 에헤헤……."
2300006-40 = "선생님은 요새 별일 없으세요? 많이 바쁘시죠?"
2300006-41 = "저도 얼마 전까지 시험을 준비하느라 직접 찾아 뵙기도 어려웠거든요."
2300006-42 = "네? 저는 여기서 뭘 하고 있느냐고요?"
2300006-43 = "아까도 말씀드렸지만, 이제 막 시험 기간이 끝난 참이라서요."
2300006-44 = "오랜만에 산책을 하고 싶어서 잠깐 길을 따라 걷고 있었어요."
2300006-45 = "……."
2300006-46 = "아, 이럴 줄 알았으면……."
2300006-47 = "네?"
2300006-48 = "아, 아뇨. 아무래도 오늘 만남은 예상치 못했던 거라……."
2300006-49 = "지금 딱히 준비해둔 디저트가 없어서요."
2300006-50 = "이 주변엔 카페도 없을 텐데……."
2300006-51 = "(시무룩해하는 아이리에게 괜찮다고 말했지만, 아무래도 신경이 계속 쓰이는 모양이다.)"
2300006-52 = "[s] \"음? 저기에 아이스크림 트럭이?\""
2300006-53 = "네? 아이스크림 트럭요?"
2300006-54 = "와아, 오랜만에 보네요."
2300006-55 = "어릴 적에는 자주 먹었었는데요."
2300006-56 = "응? 선생님?"
2300006-59 = "아, 어라……?"
2300006-63 = "(아이리의 손을 붙잡고 아이스크림 트럭으로 함께 갔다.)"
2300006-64 = "자, 여기. 주문하신 아이스크림입니다."
2300006-66 = "(아이리와 함께 아이스크림을 들고, 강변 길에 잠시 쉬어 가기로 했다.)"
2300006-69 = "[wa:1000]― 제 것도 사주셔서[wa:2500] 감사해요. [wa:1600]선생님.[wa:2500]"
2300006-70 = "― 다, [wa:400]달콤해서 맛있네요!"
2300006-73 = "[wa:1500]― 카페가 아닌 [wa:1000]밖에서 먹는 아이스크림은 [wa:2300]정말 [wa:700]오랜만이네요.[wa:3000]"
2300006-74 = "― 그것도 [wa:1500]선생님과 함께라니. [wa:3300]헤헷."
2300006-77 = "[ns3] \"미안, 아이리.\"\n[ns4] \"제대로 된 디저트를 사주지 못했네.\""
2300006-80 = "[wa:500]― 아, [wa:500]아니에요. [wa:500]정말 [wa:1000]괜찮아요.[wa:2500]"
2300006-81 = "[wa:300]― 되려 [wa:800]그립고, [wa:900]기쁜 느낌인 걸요."
2300006-84 = "[wa:1500]― 즐겁고, [wa:2500]그리고…….[wa:3500]"
2300006-85 = "― 뭐라고 해야 할까…… [wa:2500]주변에 사람도 적고…….[wa:3500]"
2300006-87 = "― 굉장히, [wa:2000]두근두근 거린다고[wa:1000] 해야 할까…….[wa:3500]"
2300006-89 = "[wa:500]― 아, [wa:500]아, [wa:800]아니에요![wa:3000]"
2300006-90 = "― 방금 제가 한 말은 [wa:700]잊어주세요![wa:3000]"
2300006-92 = "― 하하, [wa:1000]하하하하……."
2300006-95 = "[wa:3000]― 고마워요, [wa:1500]선생님.[wa:1800]"
2300006-96 = "― 오늘은 선생님 덕분에 [wa:2200]정말 [wa:1500]행복한 하루가 된 것 같아요."
2300006-99 = "(이후, 노을이 질 때 까지 아이리와 함께 강변 길에서 즐거운 대화를 이어 나갔다.)"
