[translation]
61050-1 = "제5화;최후의 만찬(?)"
61050-3 = "그 스폰서가…… 그 키리후지 나기사……?"
61050-4 = "이게 뭐야! 이런 건 정말 못 들었어!!!"
61050-5 = "우아앙~! 끝났어요! 망했어요! 이제 우리 모두 트리니티로 끌려가서 손톱을 뽑는 고문을 당하게 되겠죠!"
61050-9 = "저기, 그런 건 더 이상……."
61050-10 = "더 이상이라고 했겠다? 그럼 역시 했다는 거네! 물론 그것도 아리우스 외경에 기록되어 있었지만!"
61050-23 = "서, 선생……?"
61050-24 = "선생님?"
61050-26 = "[ns1] \"모두 진정해~\"\n[ns2] \"나도 나기사도, 다른 마음은 없으니까~\""
61050-30 = "설득력이 없다고!"
61050-31 = "우아아아앙~!"
61050-33 = "크흠. 그러면 다시 인사드리겠습니다. 평안하셨는지요. 아리우스 스쿼드 여러분."
61050-34 = "현재 티파티의 호스트를 담당하고 있는, 키리후지 나기사입니다."
61050-35 = "안녕, 나기사 씨. 아리우스 스쿼드의 하카리 아츠코야. 먼저 이렇게 인사해 줘서, 고마워."
61050-36 = "네. 잘 부탁드리겠습니다."
61050-40 = "이마시노 미사키."
61050-41 = "츠, 츠치나가 히요리…… 입니다. 헤. 헤헤……."
61050-42 = "……조마에 사오리다."
61050-43 = "적어도 나에 대해서는, 이미 잘 알고 있겠지."
61050-45 = "네. 사오리 씨뿐만 아니라, 여러분에 대해서도, 적어도 서류상으로는 모두 알고 있습니다."
61050-46 = "물론 여러분 역시, 과거의 저에 대해서는 잘 알고 계실 테고요."
61050-47 = "……말속에 뼈가 있네. 지금."
61050-48 = "히, 히에에에……."
61050-49 = "미사키. 그만. 아직 우리는 서로 이야기를 할 수 있는 상황이잖아? 그러니까 조금만…… 알겠지? 사오리도 마찬가지."
61050-51 = "……알았어."
61050-52 = "주의하도록 하지."
61050-54 = "그러면, 여러분. 마침 이렇게 다 같이 모이신 김에, 우선 안으로 들어가실까요?"
61050-55 = "네, 네에……? 크루즈, 안으로요……?"
61050-56 = "네. 이 크루즈는 제가 오늘 하루 전세를 내었으니, 다른 누군가의 시선은 걱정하지 않으셔도 될 거예요."
61050-58 = "?!"
61050-59 = "!?"
61050-60 = "……."
61050-61 = "[ns3] \"크루즈를…… 하루 전세 냈다고……?!\"\n[ns4] \"너, 너무 무리한 거 아냐!?\""
61050-64 = "네? 아뇨. 특별히 크루즈를 항해시키는 것도 아니고, 시설과 공간을 정박시킨 채 빌리는 것 정도인걸요."
61050-65 = "이 정도는 통상 지출 범위 안이랍니다. 가시죠."
61050-69 = "무서워……. 무서워요…… 어른보다도 더 무서워요……. 차라리 이게 다 꿈이었으면 좋겠어요……."
61050-70 = "……여러 가지로, 차원이 다르긴 하구나……."
61050-71 = "이, 이럴 때는, 어떻게 하면 좋은 걸까……."
61050-73 = "[ns] \"일단은…… 호의……? 를, 받아들이자……?\""
61050-75 = "응. 그러면 나기사 씨를 따라가자."
61050-76 = "나는 침착한 것 같아서 그나마 안심이 된다고?"
61050-77 = "후훗. 선생님까지 당황하고 있는 걸 보니까, 정말로 뜻밖의 상황 그 자체라는 생각이 들어서."
61050-78 = "모든 게 예상 밖이라면, 그냥 상황의 흐름을 따라가는 게 좋지 않을까?"
61050-79 = "[ns] \"지금만큼은 아츠코를 본받아야겠네…….\""
61050-83 = "우, 우와아……."
61050-84 = "시장하지 않으신가요? 이 선내 레스토랑은 '메뉴판이 없는 레스토랑'이니, 무엇이든 마음 가는 대로 주문해 주세요."
61050-86 = "……? 메뉴판이 없으면, 영업하기 힘든 거 아냐? 무슨 뜻이지……?"
61050-87 = "[ns5] \"아니야, 미사키…… 이건…….\"\n[ns6] \"어떤 메뉴라도 가능하다는…… 자신감의 표현인 거야!\""
61050-90 = "그, 그런 건가……?! 그런 게 가능하다고……?"
61050-91 = "……무슨 최후의 만찬이라도 먹여 주겠다는 거야? 이거 참……."
61050-93 = "아, 아뇨. 최후의 만찬이라뇨. 그런 의도는……."
61050-94 = "나기사 씨? 미안해. 아무래도 우리는 이런 곳에 그렇게 익숙하지는 않거든."
61050-95 = "그러니까 여기에서는 나기사 씨에게 부탁하도록 할게. 괜찮지?"
61050-96 = "네. 물론입니다. 아츠코 씨. 그러면, 마스터? 괜찮으실까요?"
61050-101 = "알겠습니다. 나기사 아가씨. 무엇이든 말씀만 해 주십시오."
61050-102 = "그러면–"
61050-104 = "(잠시 후, 생전 처음 보는 코스 요리가…… 차례차례 나오기 시작했다.)"
61050-110 = "(나기사는 익숙하다는 듯 요리를 즐겼지만, 우리들은 생소한 나머지, 맛도 잘 느껴지지 않을 지경이었다.)"
61050-111 = "(……한 명은 빼고.)"
61050-115 = "마히허요…… 마히허요……!"
61050-116 = "히, 히요리? 먹으면서 말하면, 예의에 어긋나니까……?"
61050-117 = "우물우물, 꿀꺽……! 죄, 죄송합니다……! 그렇지만 너무 맛있어요……. 이런 건 처음 먹어 봐요!"
61050-118 = "네. 많이 드세요. 저도 기분이 좋네요."
61050-120 = "식사는 어떠셨나요, 여러분?"
61050-121 = "[s] \"엄청났어…….\""
61050-122 = "……잘 먹었습니다. 정말로."
61050-123 = "응……. 이런 걸 우리만 먹어도 되나, 싶을 정도로……."
61050-127 = "호, 혹시 조금 포장해 가거나 할 수 없을까요……?"
61050-128 = "조금은 이해가 가지만, 여기에서는 참자. 히요리."
61050-129 = "우우우……. 네에……."
61050-131 = "그러면 소화 겸 '티 타임'이라도 함께, 어떠신가요?"
61050-132 = "제가 즐기는, <트와일라잇> 사의 브랜드랍니다. 좋은 찻잎이지요."
61050-133 = "차를 내올까요, 아가씨?"
61050-134 = "아니요. 여기에서는 제가 직접 끓여 드리도록 하겠습니다. 모두, 잠시만 기다려 주시겠어요?"
61050-136 = "(나기사는 능숙한 솜씨로 홍차를 끓였다.)"
61050-141 = "(향긋한 홍차 향이 가득 퍼졌다.)"
61050-143 = "자, 다 되었답니다. 변변찮은 것입니다만, 어서 드시죠."
61050-147 = "헤. 헤헤……. 따듯하고 좋네요……. 예전 아리우스에서, '워터 타임'이 생각나요……."
61050-148 = "……그래. 그런 것도 있었지."
61050-150 = "워터, 타임이요……?"
61050-152 = "정기적으로 있었던 것은 아니었지만, 훈련 우수자에게 따듯한 물을 한 컵씩 주고는 했어."
61050-153 = "마침 시간도…… 딱 이 시간 정도였던 것 같네."
61050-155 = "[ns] (따듯한 물……?)"
61050-156 = "그때는 물이 식을 때까지 아껴 마시곤 했어요……."
61050-157 = "신기하죠? 그냥 데운 물이었을 뿐이지만…… 그때는 그 물이 무엇보다 맛있었어요……."
61050-158 = "아! 물론 나기사…… 씨……? 나기사 님……? 의 차가 더 맛있어요!"
61050-160 = "편하게 불러 주셔도 된답니다. 히요리 씨."
61050-161 = "무엇보다 선생님께 이 자리의 합석을 부탁드린 것은, 저였으니까요."
61050-162 = "……그 말은, 당신이 선생님에게 이 일에 대해서 먼저 연락했다는 뜻?"
61050-163 = "……."
61050-164 = "어떻게? 선생님과 몰래 이야기를 나눴던 것은, 아리우스 출신의 편입생 두 명뿐이었을 텐데."
61050-166 = "[ns] \"그게 말이야! 그러니까!\""
61050-167 = "아뇨, 선생님. 이건 제가 직접 말씀드려야 한다고 생각해요."
61050-168 = "적어도 저는, 그렇게 하기 위해 이 자리를 부탁드린 것이니까요."
61050-169 = "우선 말씀드려야 할 것은, 네. 이런 것이겠군요."
61050-170 = "트리니티의 정보부는, 우수합니다."
61050-171 = "……그런가. 그 아이들이 선생님과 만난 시점에서, 이미 보고가 들어갔겠네."
61050-172 = "그리고 그 말은 아리우스 편입생의…… 모두에게, 감시가 붙어 있을 것이라는 말이 될 거고."
61050-173 = "그것은……."
61050-174 = "[ns7] \"여기에서는 선생님이 나설 시간이로군.\"\n[ns8] \"배턴 터치가 좀 빠른 것 같기는 한데, 아무튼.\""
61050-177 = "서, 선생님?"
61050-178 = "[s9] \"괜찮아, 나기사. 이런 건 자기 입으로 이야기하면 역효과니까.\"\n[s10] \"어차피 내게도 알려 줬고, 나도 확인한 내용이기도 하고.\""
61050-181 = "……부탁드리겠습니다."
61050-186 = "[ns11] \"편입생들을 트리니티 학생들이 1대1로 담당하고 있는 것은 맞아.\"\n[ns12] \"감시가 아니라, 적응을 위한 도우미 역할이지만.\""
61050-189 = "[ns13] \"그 도우미 학생들에게 나와 만났다는 걸 알린 것도.\"\n[ns14] \"편입생 아이들이 직접 한 것이었고.\""
61050-192 = "……그 말을 어디까지 우리가 믿어야 한다고 생각해?"
61050-193 = "물론 아리우스 여러분들이 트리니티를…… 그것도 티파티인 저를 쉽사리 믿지 못한다는 것은 이해하고 있습니다. 하지만……."
61050-195 = "[ns] \"응. 적어도 선생님인 나를, 믿어 주지 않을래?\""
61050-197 = "……."
61050-198 = "저, 전 믿어요오……. 선생님이니까요……."
61050-199 = "히요리……."
61050-200 = "하, 하지만 선생님은 여러모로 우리를 도와주셨고……."
61050-201 = "지금도 사실, 하려고만 하시면 당장, 발키리라든가 다른 곳이라든가, 아무튼 여기저기 연락해서……."
61050-202 = "지금이라도 우리를, 교정국이나 더 무서운 곳에 집어넣어 버리실 수도 있을 거고……."
61050-203 = "헉……?! 설마, 그런 것이었나요!? 선생님께서 지금까지 우리에게 잘해 주신 건, 이 순간을 위해서……?"
61050-204 = "우아아앙~! 이제 틀렸어요! 끝이에요! 망한 거예요! 역시 인생은 고통뿐이었던 거네요! 그러니까 이 홍차라도 다 마시고 갈래요!"
61050-211 = "저…… 선생님? 이건……."
61050-212 = "[s15] \"괜찮아……. 이래야 우리 히요리지…….\"\n[s16] \"그리고 안심해도 된단다…….\""
61050-215 = "그, 그런가요……."
61050-216 = "네? 이런 일에 너무 신경 쓰지 말고, 결심한 일을 해 달라고요?"
61050-217 = "……."
61050-218 = "네. 그렇지요. 알겠습니다. 그렇게 하지 않으면…… 모두에게 비밀로 하고, 이 자리에 나온 이유가 없겠지요."
61050-219 = "여러분. 제가 그저 개인적인 자격으로 이 자리에 왔다는 어설픈 변명은, 하지 않겠습니다."
61050-220 = "학생회장이란 것은 그런 자리니까요. 무엇을 해도 해석의 여지가 필요하고, 어떤 말을 해도 진의를 요구받기 마련이죠."
61050-221 = "그러니……."
61050-226 = "죄송합니다."
61050-230 = "……어?!"
61050-231 = "지, 지금……!"
61050-232 = "……."
61050-233 = "무엇을 해도 해석의 여지가 필요하고, 어떤 말을 해도 진의를 요구받기 마련이라고 했지."
61050-234 = "그러니까 그걸 여기에서 물어봐도 될까, 나기사 씨?"
61050-236 = "물론입니다. 그리고 보신 그대로입니다."
61050-237 = "한 명의 트리니티 학생으로서도, 티파티의 호스트로서도."
61050-238 = "나아가…… 지금의 트리니티를 대표하는 자리로서도."
61050-239 = "저는 여러분과, 나아가 아리우스 분교에게 사과를 드리고 싶습니다."
61050-240 = "어째서? 트리니티에게 테러 행위를 가장 먼저 주도했던 것은 우리였을 텐데?"
61050-241 = "네. 분명히 아리우스 스쿼드 네 분이 선두에서 그 사건을 주도하셨지요."
61050-242 = "……그리고 거기에는, 그럴 만한 요건들이, 분명히 존재했습니다."
61050-243 = "아뇨, 존재해…… 왔습니다."
61050-244 = "'공의회' 이후로, 트리니티와 아리우스는…… 결국, 이런 결과에 다다르게 되었지만."
61050-245 = "그럼에도 저희 두 학교는 어떻게 보면…… 다른 학교들에 비해서, 원래는 하나였다고 볼 수 있는 부분이 있을 테니까요."
61050-246 = "그래서, 그런 부분에 대한 양심의 가책으로, 이제 와서 갑자기 미안한 감정이라도 들었다는 거야?"
61050-247 = "미사키."
61050-249 = "괜찮습니다. 여러분에게는 그런 말을 할 자격이 있다고 생각해요."
61050-250 = "해석 차이라는 이유로…… 아리우스를 추방한 것은, 분명 트리니티의…… 오래된 잘못이었으니까요."
61050-251 = "그렇지만 그것과는 별개로 저 자신이, 사실 언제나 주위에 계셨던 고통받는 분들을……."
61050-252 = "정치적 상황과 입장이라는 이유로, 지나치게 등한시하고 있었던 것은 아닐까, 하는 생각 역시 들었습니다."
61050-253 = "심지어 그 고통과 괴로움이 아직도 이어지고 있는데, 그걸 계속해서 내버려두기만 한다는 것은, 인간적인 도리로서도 할 일이 아닌 것 같았고요."
61050-255 = "………여전히 납득하기 어려운데."
61050-256 = "네, 네에?!"
61050-257 = "지나간 이야기를 이제 와서 하나하나 따지는 건, 별로 좋아하지 않지만."
61050-258 = "그냥 대놓고 말할게. 그 에덴 조약 사건에서 피해자는 분명히 당신이었어. 키리후지 나기사."
61050-259 = "그리고 그 가해자는, 의심의 여지 없이 우리, 아리우스 스쿼드였고."
61050-260 = "이상하지 않아? 피해자가 가해자에게 먼저 사과를 해 오다니. 일반적으로 생각하면 말이 안 되는 소리지."
61050-261 = "그리고 그렇게 말이 안 되는 이야기가 나올 때는 보통…… 다른 꿍꿍이가 숨어 있기 마련이고."
61050-263 = "미사키. 자제해라."
61050-264 = "……."
61050-265 = "괜찮습니다. 여러분. 미사키 씨의 의문은 합당한 것이니까요."
61050-266 = "그리고 저는…… 거기에 대해서, 모두가 납득할 수도 있을 답안과 납득하기 어려운 답안 모두를, 가지고 있기도 하고요."
61050-267 = "모두가 납득할 수 있는 답안이란 건 뭐야?"
61050-268 = "그것은……."
61050-269 = "가령, '아리우스 분교의 잔존 학생'이라는 트리니티 후방의 불안 요소를."
61050-270 = "저 한 명의 사죄로 진정시킬 수 있다면, 상당히 싸게 먹힐 수 있는 정치적 행위가 아닐까, 하는 것이 있겠네요."
61050-271 = "……그래. 차라리 처음부터 그렇게 말하지 그랬어."
61050-272 = "자, 자. 우리 조금만 더 나기사 씨의 이야기를 들어 보자."
61050-273 = "그리고 납득하기 어려운 답안이라는 건?"
61050-275 = "……."
61050-276 = "가령, 트리니티의 티파티 호스트를 담당하고 있던 어떤 학생이."
61050-277 = "에덴 조약이라는 특수한 사건을 겪고, 어째서 그 일이 그런 흐름으로 갈 수밖에 없었는지를 생각해 보다가."
61050-278 = "티파티 이외에는 접근하기 어려운…… 과거에 대한 기록에 접근해서, 모든 것을 원점에서 생각해 본 뒤."
61050-279 = "문득, 트리니티의 교정을 내려다보다가, 그렇게 해야만 한다는 생각이 들었기 때문이라든가."
61050-280 = "결국 두 학교는…… 지금 이대로의 관계를 유지해서는 안 되며."
61050-281 = "그렇게 하기 위해서는 과거의 부채를 지고 있는 것이 분명한 트리니티 쪽에서."
61050-282 = "어떤 식으로든, 화해의 제스쳐를 취해야 한다는 생각이 들었기 때문이라든가, 정도가 있겠네요."
61050-283 = "……어딘가의 힘센 분홍색 공주님이 할 것 같은 말이네, 완전."
61050-284 = "네……. 어쩌면 그 학생은 이 지경이 되고 나서야, 그 친구의 심정을 조금이나마 이해할 수 있게 된 것인지도 모르겠어요."
61050-286 = "……."
61050-287 = "……."
61050-288 = "헤, 헤헤……."
61050-292 = "그러면, 나도."
61050-296 = "……!"
61050-297 = "한 때 로열 블러드로 불렸던 자로서."
61050-298 = "어쩌면 당신이 이야기하는, 학생회장이라는 자리에."
61050-299 = "아리우스 분교에서 가장…… 가까운 위치에 한번은 있었던 자로서"
61050-300 = "우리들이 일으켰던 그 모든 테러 행위를, 사과드립니다."
61050-301 = "그렇게 말씀해 주시니 감사합니다만."
61050-302 = "사실 여기 계신 분들에게만 사과드린다고, 모든 것이 해결되는 것은 아니겠지요."
61050-303 = "지금 트리니티에 편입되신 아리우스 학생분들과."
61050-304 = "아직 아리우스 분교 부지에 남아 계신 아리우스 학생들께도…… 언젠가는 사과를 드려야 할 테니까요."
61050-305 = "그리고 사과에는 반드시 책임이 따라야 한다는 것과."
61050-306 = "그 책임은 보통 행동으로 뒷받침되어야 한다는 것을……."
61050-307 = "다른 누구도 아닌, 선생님께 배운 바 있으니까요."
61050-309 = "……이야기는, 알았다. 물론 나 역시 당신에게 사죄해야 할 것이 많겠지만."
61050-310 = "그러다가는 아마도 남은 시간 내내 사과만 하다가 끝날 것 같으니, 대화를 진행하도록 하지."
61050-311 = "어째서…… 이 자리에 참가하고자 한 거지? 분명 우리에게 해야 할 말이 있는 것이라고 이해하겠다."
61050-312 = "……그렇지 않았다면, 굳이 선생에게 먼저 이런 일을 요구하지도 않았을 것이고, 나중에 개인적으로 사태를 파악해도 충분했을 테니까."
61050-313 = "정확한 말씀이네요. 사오리 씨."
61050-314 = "저 역시 여기에서부터는 곧장 본론으로 들어가도록 하겠습니다."
61050-315 = "시험이라는 것에 대한 이야기를, 선생님께서 하셨죠."
61050-316 = "……? 설마……?"
61050-317 = "네."
61050-318 = "이 또한 강압적이거나, 저의 일방적이고…… 오만한 생각일 수 있겠습니다만."
61050-319 = "저 역시 선생님처럼, 여러분께서."
61050-320 = "나아가…… 아리우스 분교 부지에 계신 모든 분 역시."
61050-321 = "당당히, 사회의 일원이 되셨으면 합니다."
61050-322 = "마음 씀씀이 고마워. 나기사 씨."
61050-323 = "하지만 보기에 따라서는, 이것 역시, 이른바 '시혜적인 태도'로 해석될 수 있는 여지가 있지 않을까요?"
61050-327 = "자상함과 친절함 뒤에, '나는 너보다 우위에 있다'는 생각을……."
61050-328 = "자기가 그렇게 생각하고 있다는 것도 스스로 알아차리지 못한 채, 무심코 품곤 하죠."
61050-329 = "남을 가르치려 들고, 편협한 예시를 들어 타인의 인생을 재단하기 좋아하는 태도…… 말이죠."
61050-330 = "하지만 나기사 씨는 그렇지 않잖아?"
61050-331 = "아츠코 씨……."
61050-332 = "그럴지도 모른다는 자각이 있다는 시점에서, 나는 그 사람을 믿을 수 있다고 생각해."
61050-333 = "그렇지, 미사키?"
61050-335 = "……틀린 말은, 아니지."
61050-336 = "사실 저는, 나기사 씨가 그런 생각을 하고 있다고 해도……. 헤. 헤헤……."
61050-337 = "네. 그러니까…… 괜찮, 아요. 괜찮습니다……."
61050-342 = "……감사, 합니다. 여러분."
61050-343 = "너그럽게 생각해 줘서 고맙다."
61050-344 = "그러면, 우리 스쿼드와 선생님이, 이제부터 뭘 해 주길 바라는 거지?"
61050-345 = "네? 저, 저는 아직, 거기까지 말씀드리지…… 않았던 것 같은데요? 어떻게……!"
61050-346 = "음……."
61050-347 = "조금, 건방진 표현일지도 모르겠다만."
61050-349 = "길바닥에서 굴러먹다 보면 알게 되는 것들이 있다, 정도로 대답해 둘까."
61050-351 = "리, 리더……!"
61050-352 = "분명 멋진 부분이 있었지만."
61050-353 = "응. 그래도 역시 지금은 조금 감점. 삿 쨩."
61050-355 = "여, 역시 그런가……."
61050-357 = "다음화;건너편의 의자"
