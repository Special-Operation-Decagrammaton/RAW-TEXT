[translation]
901010600220-7 = "FOX 3, 듣고 있어?"
901010600220-11 = "여기는 FOX 3. 시에라 포인트에서 대기 중."
901010600220-12 = "갑자기 무슨 일이야?"
901010600220-13 = "혹시 하이랜더 학원의 교통 관리시스템에 접속해서 특정 인원의 승차 기록을 확인해 줄 수 있어?"
901010600220-14 = "하이랜더 학원의 데이터베이스에 직접 접근하는 건 어렵지만……#n총학생회 교통실에 운임 결제 데이터가 공유되니 간접적으로 확인할 수는 있을 거야."
901010600220-15 = "어떤 정보를 확인해 주면 될까?"
901010600220-16 = "미야구치가 실종된 날, 카네사키 항의 승강장에서 통근 열차에 탑승한 기록이 있는지 찾아봐 줘."
901010600220-17 = "혹시 모르니 전날과 다음날의 기록도 확인하고."
901010600220-18 = "알겠어."
901010600220-19 = "다만 서버에 접속하는 데 시간이 걸릴 것 같아서…… HQ에 복귀한 뒤에 알려줄게."
901010600220-20 = "응. 잘 부탁해."
