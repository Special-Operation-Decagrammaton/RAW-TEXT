901010600220-10 = ""
901010600220-11 = "這裡是FOX3。#n正在Point Sierra待命。"
901010600220-12 = "突然找我有什麼事嗎？"
901010600220-13 = "你可以連進高地人鐵道學園的交通管理系統，幫我確認特定人物的乘車記錄嗎？"
901010600220-14 = "要直接存取高地人學園的資料庫有點困難……#n不過運費支付資料會同步給聯邦學生會交通室，所以應該可以間接確認。"
901010600220-15 = "你想要確認什麼資訊呢？"
901010600220-16 = "幫我查一下宮口失蹤那天，有沒有在鐘崎港的月臺搭乘通勤列車的記錄。"
901010600220-17 = "保險起見，前後兩天的記錄也一起確認吧。"
901010600220-18 = "我知道了。"
901010600220-19 = "不過連進伺服器需要花點時間……等返回HQ之後再告訴你結果。"
901010600220-20 = "嗯，拜託你了。"
