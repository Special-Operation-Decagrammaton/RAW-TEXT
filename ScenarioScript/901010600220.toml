[translation]
901010600220-6 = ""
901010600220-7 = "FOX 3 ได้ยินมั้ย?"
901010600220-8 = ""
901010600220-10 = ""
901010600220-11 = "FOX 3 พูด ฉันกำลังสแตนด์บายอยู่ที่จุดเซียร์รา"
901010600220-12 = "จู่ๆ มีเรื่องอะไรเหรอ?"
901010600220-13 = "ช่วยเข้าระบบจัดการการเดินรถของสถาบันไฮแลนเดอร์ แล้วตรวจสอบบันทึกการโดยสารของ#nคนคนหนึ่งให้หน่อยได้มั้ย?"
901010600220-14 = "การเข้าถึงฐานข้อมูลของสถาบันไฮแลนเดอร์โดยตรงน่าจะยาก... แต่ข้อมูลการชำระค่าโดยสารก็#nถูกแชร์ให้ฝ่ายคมนาคมขององค์การนักเรียนอยู่ งั้นก็น่าจะตรวจสอบทางอ้อมได้นะ"
901010600220-15 = "อยากให้ตรวจสอบข้อมูลอะไรล่ะ?"
901010600220-16 = "ช่วยตรวจสอบให้หน่อยว่า ในวันที่มิยากุจิหายตัวไป มีบันทึกว่าเขาขึ้นรถไฟของคนงานจากชานชาลา#nท่าเรือคาเนะซากิหรือเปล่า"
901010600220-17 = "เพื่อความแน่ใจ ฝากดูบันทึกของวันก่อนหน้าและวันถัดไปด้วยนะ"
901010600220-18 = "ได้เลย"
901010600220-19 = "แต่กว่าจะเชื่อมต่อกับเซิร์ฟเวอร์ได้คงต้องใช้เวลานานหน่อย... ไว้ฉันจะบอกหลังจากกลับไป#nกองบัญชาการแล้วนะ"
901010600220-20 = "อื้อ ฝากด้วยนะ"
