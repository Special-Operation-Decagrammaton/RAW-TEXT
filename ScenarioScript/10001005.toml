[translation]
10001005-1 = "프롤로그;위대한 학생회장"
10001005-2 = "붉은겨울 학원 정문"
10001005-6 = "어서 오십시오, 선생님. 붉은겨울 학원은 선생님을 환영합니다."
10001005-7 = "체리노 회장께서 안에서 기다리고 계십니다."
10001005-8 = "이쪽으로……."
10001005-11 = "붉은겨울 학원 회장 집무실"
10001005-15 = "[ns] \"이건…….\""
10001005-19 = "이 초상화 말씀이십니까?"
10001005-20 = "이분이 바로 저희 붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장이자, 체육부장이자, 청소부장이자, 선도부장이자, 급식부장이신 체리노 님이십니다."
10001005-21 = "[s1] \"할 일이 많겠네.\"\n[s2] \"수염이 멋져.\""
10001005-22 = "서기장님. 선생님을 모셔 왔습니다."
10001005-26 = "정확하게 보셨습니다. 붉은겨울의 모든 권위는 저 수염에서 나옵니다."
10001005-27 = "마음에 드셨다니 다행입니다."
10001005-28 = "서기장님. 선생님을 모셔 왔습니다."
10001005-35 = "……수고했네. 토모에. 역시 내 충직한 오른팔이야. 상으로 특별 전령 훈장을 수여하겠네."
10001005-36 = "영광입니다. 서기장님."
10001005-38 = "붉은겨울 학원에 온 걸 환영하네, 콤라드."
10001005-40 = "이 몸이 바로 체리노!"
10001005-41 = "붉은겨울의 학생회장이자, 미화부장이자, 서기장이자 청소부장이자……"
10001005-42 = "어……."
10001005-43 = "또 뭐였지……."
10001005-44 = "체육부장, 청소부장, 선도부장, 급식부장……."
10001005-45 = "……그래! 하여튼 굉장한 건 다 도맡고 있는 매우 중요하신 몸이시다! 영광으로 생각하도록, 콤라드!"
10001005-46 = "[s] \"초상화랑 다르잖아.\""
10001005-47 = "하아? 하찮은 걸 신경 쓰는군! 그건 이 몸의 1년 뒤의 모습을 그린 것이다. 그러니 문제는 없어!"
10001005-48 = "내 초상화에 불만이라도 있나, 콤라드?"
10001005-49 = "어른이라면 그 정도는 눈치껏……"
10001005-50 = "으햣?!"
10001005-54 = "서, 서기장님?!"
10001005-55 = "아, 아파……."
10001005-56 = "토모에!! 여기 넘어지기 쉬우니까 카펫을 잘 펴두라고 했잖아! 숙청해버린다?!"
10001005-57 = "체, 체리노 쨩! 수, 수염! 수염……!"
10001005-58 = "……응?"
10001005-59 = "에— 으, 으햣—? 내 수염!"
10001005-65 = "……"
10001005-68 = "아무 일도 없었다. 그렇지, 토모에?"
10001005-69 = "그렇습니다, 서기장님."
10001005-70 = "[s] \"그나저나 갑자기 무슨 일로 부른 거야?\""
10001005-71 = "후후후, 그건 바로……"
10001005-72 = "이반 쿠팔라를 준비하기 위해서다!"
10001005-73 = "[s] \"이반 쿠팔라?\""
10001005-74 = "콤라드도 알고 있겠지만, 낮의 길이가 가장 긴 때— 하지가 머지않았느니라."
10001005-75 = "눈이 녹고 신록이 우거지는 이 경사스러운 때를 기념하기 위하여 붉은겨울 학원에서는 매년 이반 쿠팔라 축제를 열고 있지!"
10001005-76 = "이반 쿠팔라 축제는 붉은겨울 학원의 고유한 전통인 만큼, 사무국은 이를 성대히 기념할 수 있도록 학생들을 총동원하여 최고의 이반 쿠팔라를 준비하고 있느니라!"
10001005-77 = "그렇지 않은가, 토모에 총비서실장?"
10001005-78 = "네, 회장님의 지시에 따라 2교대 근무를 실시하고 모범 노동자를 추려 포상한 결과, 지난주에는 생산량이 250%나 초과 달성되었습니다."
10001005-79 = "어…… 그거, 잘 되고 있다는 뜻이지?"
10001005-80 = "좋아, 좋아! 이번 이반 쿠팔라 축제도 완벽하겠군!"
10001005-81 = "[s3] \"하지만 하지는 한 달 뒤잖아?\"\n[s4] \"내가 무언가 도와주어야 할 일이라도 있는 거야?\""
10001005-82 = "이 몸을 바보로 아는 겐가! 나도 그 정도는 알고 있느니라!"
10001005-83 = "하하! 이 몸의 완벽한 영도 아래 붉은겨울 학원에 부족한 점은 조금도 없느니라!"
10001005-84 = "다만, 콤라드를 일부러 부른 이유는…… 그대가 샬레의 선생이기 때문이다."
10001005-85 = "샬레의 선생이라면 다른 학교의 학생들과도 교류가 활발할 터."
10001005-86 = "우리 붉은겨울 학원의 위용을 전파하기 위해서는 샬레의 선생부터 매수……"
10001005-87 = "아니, 매도……?"
10001005-88 = "체리노 쨩, 포섭이요. 포섭!"
10001005-89 = "그, 그래! 샬레의 선생을 포섭하는 게 우선이라 생각했기 때문이다!"
10001005-94 = "자, 콤라드! 이반 쿠팔라 축제를 준비하는 붉은겨울 학원의 모습을 눈에 똑똑히 담아, 그 위용을 키보토스 전역에 널리 알리는 거다!"
