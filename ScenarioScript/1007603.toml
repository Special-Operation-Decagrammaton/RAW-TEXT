[translation]
1007603-1 = "확실히 도움이 됐어"
1007603-2 = "(몰려오는 운영관리 업무에, 한창 정신이 없던 때였다.)"
1007603-4 = "아니, 그러니까 이상하잖아요! 분명 트랙의 이쪽에는 제가 푸드트럭을 내겠다고 등록을……."
1007603-5 = "예? 제 출전 종목이 계주로 돼 있다고요!? 그럴 리가요! 저는 멀리뛰기 선수로 왔는데요!"
1007603-6 = "자, 자~. 드셔들 보세요~. 닭꼬치가 단돈……."
1007603-7 = "어라, 여긴 어디지? 난 어디까지 온 거야?"
1007603-8 = "저, 저기. 죄송한데 레드카드를 잃어버렸거든요. 다음 경기에 써야 하는데 추가분이 있는지……."
1007603-9 = "여기 식당 아니에요? 뭐야, 분명히 화살표대로 따라왔는데……? 밥 어디서 먹어요?"
1007603-13 = "전등 갈러 왔습니다~."
1007603-14 = "예? 왜 오늘이냐니요? 오늘로 요청돼 있었는데요?"
1007603-16 = "(웅성웅성…….)"
1007603-17 = "(응대해야 할 사람이 너무 많아, 화장실을 갈 타이밍조차 잡지 못했다…….)"
1007603-18 = "[ns1] (저, 정신없어…….)\n[ns2] (예상은 했지만, 보통 일이 아니구나.)"
1007603-21 = "여기 계셨군요, 선생님! 제가 왔습니다!!"
1007603-23 = "음? 어라? 선생님. 안색이 안 좋으신데……. 무슨 일이라도……?"
1007603-24 = "……네? 아, 화장실요?"
1007603-25 = "과연! 아, 한꺼번에 너무 많은 대응을 하느라 쉴 타이밍을 못 잡고 계신 거군요!"
1007603-26 = "그런 거라면야 또 제가 도와드릴 수 있죠! 중요한 일이 아니라면, 뭐든 맡겨만 주세요!"
1007603-27 = "의외시겠지만, 이래 봬도 제가 사람 상대하는 건 또 싫어하지 않으니까요!"
1007603-28 = "[s3] \"전혀 의외는 아니지만…….\"\n[s4] \"그럼 미안하지만, 잠시만 부탁해도 될까?\""
1007603-29 = "하하하……."
1007603-30 = "아무튼 맡겨만 주시라고요! 편하게 다녀오세요!!"
1007603-31 = "하하하하!"
1007603-32 = "좋습니다! 맡겨만 주시라고요! 편하게 다녀오세요~!"
1007603-33 = "[ns] 화장실을 다녀온다."
1007603-35 = "(……잠시 후.)"
1007603-37 = "[ns5] \"……휴우. 잘 다녀왔어.\"\n[ns6] \"살 것 같다. 고마워 코토리.\""
1007603-41 = "[ns7] \"……응? 코토리?\"\n[ns8] \"어라, 사람들이…….\""
1007603-44 = "아, 으!"
1007603-45 = "이, 이건. 그, 그게……. 그게 말이죠……!!"
1007603-46 = "그러니까……. 음……."
1007603-51 = "……죄……."
1007603-52 = "죄송합니다……."
1007603-53 = "[s9] \"……왜!?\"\n[s10] \"갑자기 사과!?\""
1007603-56 = "뭔가 어떻게 잘 풀어보려고, 나름대로 최선을 다해 열심히 설명 드렸는데……."
1007603-57 = "어째서인지 다들 도중에 '알았으니 그만해!'라고 말하며 돌아가 버리셔서……."
1007603-58 = "뭐, 뭔가 해결이 된 것 같기도……. 안 된 것 같기도……."
1007603-59 = "그러고 난 뒤에야, 또 평소처럼 습관이 나와서……. 사람들을 쫓아냈다는 걸 깨달았달까……."
1007603-60 = "으으……."
1007603-61 = "도와드리고 싶었는데, 또 이렇게 사고를 치고 말았네요. 정말 죄송해요……."
1007603-62 = "괜히 더 있으면 방해만 될 것 같으니, 얼른 돌아가도록 하겠습니다……."
1007603-66 = "…………?"
1007603-67 = "……선……생님? 왜 그런 표정을……?"
1007603-68 = "[s11] \"코토리! 계속 여기 있어 줘!!\"\n[s12] \"코토리만 괜찮다면, 얼마든지 있어도 좋아!!\""
1007603-71 = "……!? 네, 네!? 가, 갑자기!?"
1007603-72 = "확실하게 도움이 됐다고요……!? 제, 제가? 이, 이게요? 어떻게……!?"
1007603-73 = "저, 전혀 이해가 가지 않는데요……."
1007603-74 = "이해가 가지 않아도 상관없다고요!?"
1007603-75 = "그저 방금처럼 계속 있어 주시면 된다고요? 다음 제 일정 전까지만이라도……?"
1007603-76 = "무, 물론 저야! 저야 당연히 선생님께서 그렇게 말해주시면 너무나도 기쁘지만……."
1007603-77 = "으음……."
1007603-78 = "……네, 네……."
1007603-79 = "자, 잘은 모르지만……! 도움이 된다니 괜히 기쁘네요!! 이번에는 그냥 해주시는 말도 아닌 것 같고!"
1007603-80 = "그, 그럼……."
1007603-81 = "계속 힘내겠습니다!!"
1007603-83 = "(이후, 적어도 코토리와 함께하는 동안만은 무적이 된 기분으로 업무를 처리했다.)"
