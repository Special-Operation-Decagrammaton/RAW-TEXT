[translation]
10059080-1 = "제8화;D-Day"
10059080-2 = "(일주일 후. 드디어 찾아온 D-Day.)"
10059080-4 = "비밀 협상 장소"
10059080-8 = "[ns] (……긴장되는 곳이다.)"
10059080-19 = "아이구, 다들 오랜만에 뵙습니다."
10059080-20 = "이런 식으로 재회하고 싶진 않았는데 말이죠."
10059080-21 = "예상대로 꽤 많이 끌고 오셨군요."
10059080-22 = "하아, 유통 경로 살피실 때 그렇게나 돌려보내려 했는데."
10059080-23 = "여기까지 와버리시면 저희도 진심을 다할 수밖에 없단 말입니다."
10059080-24 = "그쪽은 전부 도착하신 건가요? 중요한 사람이 안 보입니다만."
10059080-25 = "보스라면 조금 늦으실 겁니다."
10059080-26 = "비즈니스 문제가 갑자기 생겨서 말이죠."
10059080-31 = "아, 마침 도착하셨군요. 모두 예의를 갖춰 주시길."
10059080-36 = "……그래. 뒤처리를 맡기지."
10059080-37 = "잘 가라앉게 손질해 뒀으니, 귀찮은 일은 없을 거야."
10059080-38 = "그럼 이만. 다음 일정이 있어서."
10059080-42 = "……흠."
10059080-47 = "다들 모였군."
10059080-48 = "[s] \"네가 바로…….\""
10059080-49 = "당신이 [USERNAME] 선생인가."
10059080-50 = "내가 누군진 알지?"
10059080-51 = "그럼 자기소개 따윈 집어치우고 바로 일을 시작하자."
10059080-52 = "시간은 돈이니까."
10059080-53 = "[s] \"일단 서로가 원하는 게 뭔지 말해보자.\""
10059080-54 = "제가 원하는 건 간단합니다."
10059080-55 = "오늘부로 와일드헌트 작품의 모든 불법 거래를 중단해 주세요."
10059080-56 = "그리고 앞으로 영원히 예술계에 손을 대지 않겠다는 각서를 부탁드립니다."
10059080-57 = "우리 학원에서 완전히 철수하는 겁니다."
10059080-58 = "……시작부터 대답할 가치를 못 느끼겠군."
10059080-59 = "야."
10059080-60 = "넵! 제가 상대하겠습니다, 보스!"
10059080-66 = "우두머리가 아니라, 그 아랫사람이 협상 테이블에 앉겠다고요?"
10059080-70 = "지금 뭔가 대단히 착각하고 계시는 것 같습니다만……."
10059080-71 = "당신이 이 협상에서 요구할 수 있는 건 아무것도 없습니다."
10059080-72 = "애초에 보스께서 만들어주지 않았다면 존재할 수조차 없는 자리인데, #n뻔뻔하게 뭔가를 요구한다는 건 상도에 어긋나는 일이죠."
10059080-73 = "그러니 잠자코 이쪽의 조건에 따르시죠."
10059080-74 = "……!"
10059080-75 = "후후, 너무 인상 찡그리지 마시길."
10059080-76 = "보스께서는 협상 자리이니만큼, #n당신들이 원하는 요구 하나 정도는 흔쾌히 들어주신다고 하셨습니다."
10059080-77 = "그런 의미에서, 그쪽의 첫 번째 요구는 수용해 드리죠."
10059080-78 = "블랙마켓에서 진행 중인 와일드헌트 작품의 모든 거래를 중단하겠습니다."
10059080-79 = "물론 조건이 있죠."
10059080-80 = "와일드헌트 작품의, 정식 유통권입니다."
10059080-81 = "그쪽이 정식으로…… 우리 학원의 작품을?"
10059080-82 = "……그래. 블랙마켓이 아닌, 정식 루트의 합법적인 장사다."
10059080-83 = "다른 녀석들보다 훨씬 좋은 가격에 작품을 팔아 주지."
10059080-84 = "후후후, 이것이야말로 서로가 윈윈하는 최고의 방법."
10059080-85 = "어떻습니까? 꽤 괜찮은 제안 아닌가요?"
10059080-88 = "당신들 말을 어떻게 믿으라는 거죠?"
10059080-89 = "계약서는 거짓말을 하지 않는다."
10059080-90 = "계약서의 중요함은 평의회장 정도면 잘 알고 있겠지."
10059080-91 = "그 계약서의 초안 작성 권한을 너에게 넘기지."
10059080-92 = "이만하면 많이 양보했다고 생각하는데."
10059080-93 = "설마 처음부터 이걸 노리고 우리 학원에 접근하신 건가요?"
10059080-94 = "그럴 리가."
10059080-95 = "당신이 일방적으로 계약을 파기할 가능성은?"
10059080-96 = "난 그따위로 장사 안 해."
10059080-97 = "……."
10059080-98 = "……그렇군요. 잘 들었습니다."
10059080-99 = "당신의 제안에 대한 저의 대답은……."
10059080-100 = "꺼져. 입니다."
10059080-101 = "……뭐?"
10059080-102 = "이 자리가 만들어진 것은, 학생들의 작품을 불법 자금 세탁에 활용한 당신의 부도덕한 행위 때문이었습니다."
10059080-103 = "그런 당신이 와일드헌트의 작품을 정식으로 유통해 돈을 벌겠다고요?"
10059080-107 = "헛소리는 그쪽의 개들에게나 가서 하세요."
10059080-108 = "네 녀석, 감히 보스에게……!!"
10059080-109 = "냅둬. 어디까지 지껄이는지 들어 보게."
10059080-110 = "세상의 모든 걸 돈으로 판단하는 당신과는 그 어떠한 협업도 할 수 없습니다."
10059080-111 = "우리는 돈을 벌려고 예술을 하는 게 아닙니다."
10059080-112 = "꿈을 좇기 위해 예술을 하는 겁니다."
10059080-113 = "순수하게 작품 활동을 즐기며, #n자아실현을 위해 노력하는 학생들의 미래를 더럽히지 마세요."
10059080-114 = "우리의 꿈을, 사업 수단으로 삼지 마세요!"
10059080-119 = "……흥."
10059080-120 = "궤변이군."
10059080-121 = "학원의 수장이라면 너도 충분히 알 텐데."
10059080-122 = "돈이 많은 자는 돈으로 죗값을 치를 수 있고, 돈이 없으면 없는 죄도 뒤집어써야 한다."
10059080-123 = "유전무죄. 무전유죄. 그게 이 세계의 진리다."
10059080-124 = "그딴 진리, 저는 잘 모르겠습니다."
10059080-125 = "아무래도 당신과는 더 이상 대화가 힘들 것 같군요."
10059080-126 = "아아……."
10059080-127 = "좋아. 역시 자존심이 대단하군."
10059080-128 = "그 대가가 뭔지는 잘 알고 있겠지?"
10059080-129 = "물론이죠."
10059080-130 = "그렇다면 원하는 대로 해주지."
10059080-134 = "협상 결렬이다."
10059080-135 = "으으…… 여, 역시 이렇게 되는 건가요……."
10059080-136 = "애초에 대화가 통하는 상대라고는 생각하지 않았습니다."
10059080-137 = "여러분. 준비하세요."
10059080-141 = "평의회 녀석들은 내가 직접 손보겠다. 나머지는 너희가 처리해."
10059080-142 = "알겠습니다, 보스!"
10059080-146 = "자! 전부 쓸어버리는 거다, 짜식들아!"
10059080-154 = "어머, 자신 있는 거니?"
10059080-155 = "이 범죄자 놈들이 어딜 기어올라……!"
10059080-156 = "(역시 여기서는, 사감대의 미리아로 싸워야겠네요.)"
