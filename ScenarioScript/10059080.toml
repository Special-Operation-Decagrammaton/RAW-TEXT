[translation]
10059080-1 = "第8話;D-Day"
10059080-2 = "（一週間後。ついにD-Dayを迎えた）"
10059080-4 = "秘密交渉の場所"
10059080-8 = "[ns] （凄まじい緊張感だ……）"
10059080-19 = "いやはや皆様。お久しぶりでございます。"
10059080-20 = "できれば、このような形での再会は避けたかったのですが。"
10059080-21 = "予想通りの大所帯ですね。"
10059080-22 = "はぁ……あの時、あれほど穏便にお帰りいただこうとしたのに。"
10059080-23 = "ここまで踏み込まれてしまっては、こちらも本気でお相手するしかないでしょう？"
10059080-24 = "そちらは全員お揃いですか？肝心な方が見当たりませんが。"
10059080-25 = "ボスは少々遅れておいでです。"
10059080-26 = "急な商談が入りましてね。"
10059080-31 = "ああ、噂をすれば。ちょうど到着されたようです。#n皆様、くれぐれも失礼のないように。"
10059080-36 = "……ああ。後始末は任せる。"
10059080-37 = "ちゃんと沈むようにしておいた。余計な手間はかからないはず。"
10059080-38 = "それじゃ。次の予定があるから。"
10059080-42 = "……ふん。"
10059080-47 = "全員揃ってるな。"
10059080-48 = "[s] \"君が……。\""
10059080-49 = "アンタが[USERNAME]先生か。"
10059080-50 = "私が誰かはもう知ってるんでしょ？"
10059080-51 = "なら自己紹介なんて無駄は省いて、さっさと始めよう。"
10059080-52 = "時は金なり、だろ？"
10059080-53 = "[s] \"まずは、お互いの要求を確認しよう。\""
10059080-54 = "こちらの望みはシンプルです。"
10059080-55 = "本日をもって、ワイルドハントの作品に関わる一切の違法取引から手を引くこと。"
10059080-56 = "そして金輪際、芸術をあなた方の商売に利用しないこと。#n以上2点を書面でお約束ください。"
10059080-57 = "我が学院から完全に手を引いていただきます。"
10059080-58 = "……アンタ、交渉する気ある？"
10059080-59 = "おい。"
10059080-60 = "はいっ！私が対応いたします！"
10059080-66 = "気に入りませんね。端役が交渉の席に着くと？"
10059080-70 = "いえ、大きな勘違いをされているようですので。"
10059080-71 = "この交渉で、あなた方が要求できることなど何一つありません。"
10059080-72 = "この場自体、ボスの厚意で成立しているもの。#n条件まで突きつけようなど、あまりにも図々しい。"
10059080-73 = "大人しく、こちらの条件をお飲みください。"
10059080-74 = "……！"
10059080-75 = "そう怖い顔をなさらずに。"
10059080-76 = "こちらも「交渉」の席として臨んでいます。#nボスも、あなた方の望みの1つくらいなら聞き入れてくださるとのことです。"
10059080-77 = "ですから、そちらの第一条件は受け入れましょう。"
10059080-78 = "ブラックマーケットで行われている、#nワイルドハントの作品の取引はすべて中止いたします。"
10059080-79 = "ただし、条件があります。"
10059080-80 = "これは「交渉」ですから。#n代わりに、ワイルドハントの作品の正式な流通権をいただきたい。"
10059080-81 = "あなた方が正式に……我が学院の作品を扱う、と？"
10059080-82 = "そう。正規ルートの合法的な商売でね。"
10059080-83 = "私に任せてくれれば、今よりよっぽど高く売れると思うけど。"
10059080-84 = "まさにwin-win！双方に利益のある理想的な取引でしょう？"
10059080-85 = "いかがです？悪い話ではないと思いますが。"
10059080-88 = "その言葉を、どう信じろと？"
10059080-89 = "契約書は嘘をつかない。"
10059080-90 = "契約書の重みくらい、評議会長なら分かるでしょ。"
10059080-91 = "草案も、そっちに作らせてあげる。"
10059080-92 = "これでも、相当譲ってるつもりだけど。"
10059080-93 = "……初めから、それが目的で我が学院に近づいたのですか？"
10059080-94 = "まさか。"
10059080-95 = "あなたが一方的に契約を破る可能性は？"
10059080-96 = "契約書の重みくらい、評議会長なら分かるでしょ？"
10059080-97 = "……。"
10059080-98 = "よく分かりました。"
10059080-99 = "お言葉を返すようで恐縮ですが――"
10059080-100 = "お話になりません。"
10059080-101 = "……あ？"
10059080-102 = "そもそもの発端は、生徒の作品を資金洗浄に利用するという卑劣な行い。"
10059080-103 = "その張本人が、今度はワイルドハントの作品を正式に流通させて金を稼ぐと？"
10059080-107 = "寝言は夢で仰ってください。"
10059080-108 = "貴様、ボスに向かって――！！"
10059080-109 = "好きに言わせておきな。どこまで吠えるのか聞いてやる。"
10059080-110 = "世の中をお金でしか測れないあなたと、いかなる協力関係も築けません。"
10059080-111 = "私たちが芸術と向き合うのは、お金を稼ぐためではありません。"
10059080-112 = "夢を追いかけるためです。"
10059080-113 = "純粋に創作を楽しみ、自分だけの道を見つけようと懸命にもがく生徒の未来を――#nあなた方の都合で汚さないでください。"
10059080-114 = "私たちの夢を踏みにじるものは、断じて許しません。"
10059080-119 = "……ふん。"
10059080-120 = "詭弁だね。"
10059080-121 = "学院のトップなら、アンタも分かってるはずでしょ。"
10059080-122 = "カネがあれば罪だろうと消せる。#nカネがない奴は、やってもいない罪まで背負わされる。"
10059080-123 = "カネを持ってるやつが強い。それがこの世界の現実だ。"
10059080-124 = "私の知る世界とは根本的に異なるようですね。"
10059080-125 = "これ以上、あなたと言葉を交わしても無駄でしょう。"
10059080-126 = "あーあー……。"
10059080-127 = "いいね。やっぱり、大したプライドだ。"
10059080-128 = "その代償が何かも、分かってるんだろうね？"
10059080-129 = "もちろんです。"
10059080-130 = "なら、望み通りにしてあげる。"
10059080-134 = "交渉は決裂だ。"
10059080-135 = "うぅ……や、やはりこうなってしまうのですね……。"
10059080-136 = "初めから、話の通じる相手だとは思っていませんでした。"
10059080-137 = "皆さん――構えてください。"
10059080-141 = "評議会の連中は私が潰す。残りはアンタらに任せる。"
10059080-142 = "承知しました！"
10059080-146 = "お前ら！一人残らず叩き潰せ！！"
10059080-154 = "あら。そんなに自信満々で大丈夫？"
10059080-155 = "犯罪者のくせに、勢いだけは一丁前なのか……。"
10059080-156 = "（ここでは、寮監隊のミリアとして戦うべきでしょうね）"
