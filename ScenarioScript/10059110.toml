[translation]
10059110-1 = "第11話;それぞれの思惑"
10059110-2 = "（翌日。残務処理のために芸術評議会を訪れた）"
10059110-4 = "ごきげんよう。"
10059110-5 = "記念品は飾ってくださいましたか？"
10059110-6 = "[s1] \"ごきげんよう。\"\n[s2] \"も、もちろん、壁に掛けてあるよ……。\""
10059110-9 = "ふふっ、あの作品に宿る芸術的な感覚を、#n皆さんにも味わっていただけていれば良いのですが。"
10059110-10 = "先生も、そう思われますよね？"
10059110-14 = "……あら？どうにも反応が鈍いですね。"
10059110-15 = "制服だけでは物足りなかったでしょうか？"
10059110-16 = "真心を伝えるためには、制服の内側まで額に入れるべきだったでしょうか。"
10059110-17 = "ちなみに、あの日は黒でした。"
10059110-18 = "[s] \"そこまでは知りたくなかった！\""
10059110-19 = "ふふ……マナミ様ったら……。"
10059110-20 = "申し訳ありません、先生。#n今日のマナミ様はいつにも増して悪戯が過ぎるようでして。"
10059110-21 = "昨日の今日ですから、まだ高揚されているのかもしれません。"
10059110-22 = "ウララ副会長。"
10059110-23 = "私は、本・気・ですよ。"
10059110-24 = "そ、そうなのですか……！？"
10059110-29 = "解説します――"
10059110-33 = "――いえ。これは無粋ですね。代わりに、先生へ助言を1つ。"
10059110-34 = "マナミ様と私は2人で1つです。"
10059110-35 = "マナミ様の行くところにカノンあり。どうか、御覚悟を。"
10059110-36 = "[s] \"何を！？\""
10059110-37 = "ともあれ、皆さん本当にお疲れ様でした。"
10059110-38 = "これで今回の事件はひとまず幕引きですね。"
10059110-39 = "とはいえ……危機はまた訪れるでしょう。"
10059110-40 = "いつの時代も、芸術には拝金主義の手が伸びるものです。"
10059110-41 = "……拝金のブローカー。"
10059110-42 = "本名、[ruby=はった]初田[/ruby]アスカ。#nハイランダー鉄道学園で停学処分を受けた人物のようです。"
10059110-43 = "違法取引に鉄道輸送を利用しているのも、学園で得た知識の応用でしょう。"
10059110-44 = "今なお捕らえられていないところを見るに、#n相当な手腕の持ち主であることは間違いありません。"
10059110-45 = "差し当たっては我が学院から手を引いたように見えますが、#n別の経路を使用して再び近づいてくる可能性もあります。"
10059110-46 = "そして、七囚人がもう1人。"
10059110-47 = "慈愛の怪盗――[ruby=きよすみ]清澄[/ruby]アキラ。"
10059110-48 = "あの泥棒猫は今もなお、予告状をばら撒きながら各地の芸術品を盗み続けています。"
10059110-49 = "これは、私への挑戦状。ならば、その挑戦に応えて差し上げるべきでしょう。"
10059110-50 = "我々が次に相手をするのは……あの泥棒猫です。"
10059110-51 = "それは、怪盗を捕らえる……ということでしょうか？"
10059110-52 = "ですがこれまでの失敗は数知れず。姿は見えてもつかめない、蜃気楼のような方です。#n何か、有効な手立てでも見つかったのでしょうか？"
10059110-53 = "ええ。今回の件で、思わぬ副産物がありまして。"
10059110-54 = "先日、信頼に足る情報を入手しました。"
10059110-55 = "曰く、あの泥棒猫が――"
10059110-56 = "生徒に扮して、我が学院に潜伏しているというのです。"
10059110-60 = "これまで散々手を焼かされてきたのです。#nここで、捕獲作戦を開始しようと思います。"
10059110-61 = "生意気な泥棒猫を檻に閉じ込め、生涯ツナ缶だけで過ごす刑に処すのです。"
10059110-62 = "……もちろん、学院に潜む共犯者も一緒に。"
10059110-63 = "共犯が……いるのですか？この学院に？"
10059110-64 = "私はそう確信しています。"
10059110-65 = "放っておけば、あなたのバラ園も害虫に食い荒らされてしまうでしょう。"
10059110-66 = "そうなる前に対処する必要があります。#nどうか、今回も力を貸してください。"
10059110-71 = "……ええ！もちろんです。"
10059110-75 = "話を聞くだけで感じます。"
10059110-79 = "私の湖面を揺らす――新たな波紋を。"
10059110-83 = "[ns] \"…………。\""
10059110-84 = "（どうやら、ワイルドハントの本当の波乱はここから始まる気がする……）"
10059110-86 = "……ふふふ。"
10059110-87 = "すべて、計画通りです。"
10059110-88 = "御しにくかったブローカーも、復讐心に駆られて私と志を同じくするでしょう。"
10059110-89 = "自由を脅かされる怪盗は、これからも私に手を伸ばさざるを得ない。"
10059110-90 = "これで、すべての準備が整いました。"
10059110-91 = "――私たちは孵化を待つ小鳥。"
10059110-92 = "偽善と虚飾で作られた――世界という殻に閉じ込められた小鳥です。"
10059110-93 = "ですが、やがて胸を張って大空へと羽ばたく日が来るでしょう。"
10059110-94 = "殻が砕け、世界は混乱に陥るでしょうが……構いません。"
10059110-95 = "生まれようとする者は――"
10059110-99 = "ひとつの世界を壊さなければなりませんから。"
10059110-101 = "踊らされし芸術～象牙の塔と招かれざる客～"
