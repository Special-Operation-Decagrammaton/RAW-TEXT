[translation]
10059110-1 = "제11화;각자의 속셈"
10059110-2 = "(다음 날. 정리할 것이 남아 있어 와일드헌트 예술 평의회를 찾아갔다.)"
10059110-4 = "어서 오세요, 선생님."
10059110-5 = "가져간 기념품은 잘 전시해 두셨는지?"
10059110-6 = "[s1] \"아, 안녕!\"\n[s2] \"무, 물론 벽에 잘 걸어뒀어!\""
10059110-9 = "후후, 제가 드린 작품에 깃든 감각의 예술을 모두가 느껴줬으면 좋겠네요."
10059110-10 = "선생님도 그렇게 생각하시죠?"
10059110-14 = "……흐음? 반응이 왠지 시원치 않네요."
10059110-15 = "역시 교복만으로는 부족하셨던 걸까요?"
10059110-16 = "아아, 그래요. 좀 더 저의 진심이 전달되도록…… 교복 안의 다른 것까지 액자에 넣어서 드려야겠어요."
10059110-17 = "참고로 그날은 검은색이었습니다."
10059110-18 = "[s] \"거기까지 알고 싶진 않았어!\""
10059110-19 = "후후…… 마나미 님도 참……."
10059110-20 = "죄송해요, 선생님. 오늘따라 마나미 님의 농담이 짓궂으시네요……."
10059110-21 = "큰 사건이 해결된 다음 날이라 아직 들떠 계신 것 같아요."
10059110-22 = "우라라 부회장……."
10059110-23 = "저는 진. 심. 이랍니다."
10059110-24 = "그, 그런가요……?!"
10059110-29 = "이건 해석하자면……."
10059110-33 = "……아니. 해석하지 않는 것이 좋겠군요. 대신 선생님께 조언을 하나 드리겠습니다."
10059110-34 = "마나미 님과 저는 1+1의 관계입니다."
10059110-35 = "마나미 님이 간다면 저도 가는 겁니다. 단단히 각오해 주세요."
10059110-36 = "[s] \"뭘 어떻게 각오하라는 건데!\""
10059110-37 = "후후, 아무튼 모두 수고 많으셨습니다."
10059110-38 = "이것으로 이번 사건은 일단락되었군요."
10059110-39 = "하지만…… 위기는 또 찾아올 겁니다."
10059110-40 = "예술을 향한 배금주의는 어느 시대든 존재해 왔으니까요."
10059110-41 = "……배금의 브로커."
10059110-42 = "본명, 핫타 아스카. 하이랜더 철도학원에서 정학 처분을 받은 인물이더군요."
10059110-43 = "불법 거래에 철도 운송을 이용하는 것도, 학원에서 배운 걸 응용하는 거겠죠."
10059110-44 = "계속 검거되지 않는 걸 보면 상당히 수완이 좋은 인물인 것 같아요."
10059110-45 = "현재 우리 학원에서는 철수한 것으로 보입니다만, #n새로운 루트를 이용해 또다시 접근해 올지 모릅니다."
10059110-46 = "그리고 또 다른 일곱 죄수……."
10059110-47 = "자애의 괴도. 키요스미 아키라."
10059110-48 = "그 도둑고양이는 여전히 예고장을 뿌리며 키보토스 곳곳의 예술품을 훔치고 있습니다."
10059110-49 = "이건 저를 향한 도전장. 그렇다면 그 도전에 응해줘야겠죠."
10059110-50 = "이제 다음은…… 그 녀석입니다."
10059110-51 = "마나미 님? 그 말씀은…… 괴도를 붙잡으시겠다는 건가요?"
10059110-52 = "하지만 지금까지는 계속 실패했는데, 혹시 좋은 방법이라도…… 떠오르신 걸까요?"
10059110-53 = "네. 이번 일에 대처하느라 미처 말씀드리지 못했습니다만……."
10059110-54 = "최근 신뢰할 만한 정보를 하나 입수했습니다."
10059110-55 = "그 도둑고양이가……."
10059110-56 = "우리 학원에 학생으로 위장해 숨어 있다는 정보를요."
10059110-60 = "그러니 더 늦기 전에 검거 작전을 시작하려 합니다."
10059110-61 = "건방진 도둑고양이를 철창에 가두고, 평생 참치캔만 먹는 형벌을 내리는 거예요."
10059110-62 = "물론, 학원에 숨어 있는 공범도 함께요."
10059110-63 = "공범이…… 있다고요? 우리 학원에?"
10059110-64 = "네. 저는 그렇게 확신하고 있답니다."
10059110-65 = "이대로 있다간 당신의 장미 화원도 그 해충이 갉아 없애버리겠죠."
10059110-66 = "그러니, 이번에도 협조를 부탁드립니다."
10059110-71 = "아…… 네! 물론이죠."
10059110-75 = "이야기만 들어도 느껴지는군요."
10059110-79 = "저의 호수를 흔드는…… 새로운 파장이."
10059110-83 = "[ns] \"………….\""
10059110-84 = "(왠지, 와일드헌트의 진짜 갈등은 지금부터라는 느낌이 든다…….)"
10059110-86 = "……후후후."
10059110-87 = "모두 계획대로예요."
10059110-88 = "통제가 어려웠던 브로커는 복수심에 빠져 저와 뜻을 같이할 테고……."
10059110-89 = "자유를 위협받는 괴도는 저에게 계속 손을 내밀 수밖에 없겠죠."
10059110-90 = "……이걸로 모든 준비가 갖춰졌어요."
10059110-91 = "우리는 부화를 기다리는 작은 새들."
10059110-92 = "위선과 가식으로 만들어진, 세상의 껍질에 갇혀 있는 작은 새들."
10059110-93 = "하지만 곧 당당히 밖으로 나갈 날이 찾아올 거예요."
10059110-94 = "껍질이 부서지며 세상이 혼란에 빠지겠지만…… 괜찮아요."
10059110-95 = "태어나기 위해서는……."
10059110-99 = "파괴부터 해야 하는 법이니까."
10059110-101 = "춤추는 예술 ~상아탑과 불청객~"
