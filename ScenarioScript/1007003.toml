[translation]
1007003-1 = "리코더 연습"
1007003-5 = "(후다닥!)"
1007003-12 = "더 이상 도망갈 곳은 없다! 순순히 오라를 받아라!"
1007003-13 = "쳇……!"
1007003-17 = "[ns1] \"지금이야, 미나!\"\n[ns2] \"막다른 곳에 몰아넣었어. 마무리만 하면 돼!\""
1007003-20 = "(그 순간, 어딘가에서 리코더 소리가 들려오기 시작했다.)"
1007003-21 = "(……아무리 잘 들어주려고 해도, 결코 능숙하다고 할 수 없는…… 엉망인 리코더 소리였다.)"
1007003-22 = "뭐, 뭐지……?"
1007003-28 = "[ns] \"미나 양. 그 리코더는 웬 겁니까……?\""
1007003-29 = "……(연주 중)"
1007003-31 = "뭐야, 대체…… 귀를 괴롭게 하려는 건가? 그런 의도라면 이미 성공하고도 남은 것 같은데……"
1007003-33 = "……(연주 중)"
1007003-43 = "그만…… 그만 불어! 장난하자는 거냐? 슬슬 귀가 아프다고!"
1007003-45 = "……"
1007003-46 = "풍류도 모르는 악당 녀석 같으니……!"
1007003-48 = "너 같은 녀석에게는 장송곡도 아깝다!"
1007003-55 = "(그 뒤, 왠지 모르게 분노한 미나에 의해, 불량 학생은 간단히 제압되었다……)"
1007003-57 = "후우…… 오늘따라 승리 뒤에 마시는 축배가 쓰군."
1007003-62 = "[ns] \"아니, 그거 주스 팩이잖아……\""
1007003-63 = "훗."
1007003-64 = "[s3] \"그런데 미나 양.\"\n[s4] \"그 리코더는 뭐였습니까.\""
1007003-67 = "아아, 리코더 말이군."
1007003-68 = "선생님이라면 알아봐 줄 거라고 믿고 있었다."
1007003-69 = "예전에 영화에서 본 적이 있었지."
1007003-70 = "오프닝 크레딧과 함께 술잔 소리가 들리고, 칵테일을 만들어 단숨에 들이키고는…… 그대로 클라리넷을 연주하는 주인공의 장면."
1007003-71 = "주인공은 이후에도 동료가 죽을 때면 늘 클라리넷을 연주하곤 했지."
1007003-72 = "그래서, 나도 결심한 거야."
1007003-73 = "상대방을 제압하기 전에, 장송곡을 연주해 주자고."
1007003-74 = "[s] \"클라리넷이 아니라 리코더였잖아……?\""
1007003-75 = "……"
1007003-76 = "알아 둬, 선생님."
1007003-77 = "클라리넷은…… 어려운 악기야."
1007003-78 = "[s] \"그래서 학교 리코더로 대체한 거야?\""
1007003-79 = "훗."
1007003-80 = "[s] \"……\""
1007003-81 = "감상은 어땠지. 선생님?"
1007003-82 = "[s] \"……솔직하게 이야기해도 돼?\""
1007003-83 = "얼마든지."
1007003-84 = "[s] \"무서운 느낌의 연주는 아니었던 것 같아……\""
1007003-85 = "그런가. 그러한가……"
1007003-86 = "중요한 것은 현재가 아니다. 앞으로 다가올 미래지."
1007003-87 = "끊임없이 반복되는 현재가, 미래로 이어질 길을 열 것이니."
1007003-88 = "[s] \"……연습을 하면 리코더 연주 솜씨가 좋아질 거라는 말이지?\""
1007003-89 = "훗."
1007003-90 = "역시 선생님은 말이 통하는군."
1007003-92 = "(그 일 이후로도, 미나의 리코더 연주는 계속되었다.)"
1007003-98 = "뭐, 뭐야? 이 리코더 소리는……?"
1007003-99 = "꼬마애들이 마구 삑삑 불어대는 것보다 더 끔찍한 소리가 나는데……?!"
1007003-106 = "훗."
1007003-119 = "리코더…… 리코더 소리가 들린다……!"
1007003-120 = "이, 청각을 마비시키는 리코더 소리는, 도대체……!"
1007003-128 = "후훗."
1007003-133 = "최근 현룡문의 방범 활동은 만족스러운 수준이다. 선생님."
1007003-134 = "불량 학생들의 행패도 줄어들었고, 치안도 안정되었지."
1007003-135 = "후…… 자신의 책무에 충실하다는 것은, 과연 기분 좋은 일이로군."
1007003-136 = "[s5] \"그와 동시에, 형용할 수 없는 솜씨로 리코더를 연주하며.\"\n[s6] \"불량배를 사냥하는 현룡문의 간부에 대한 소문이 퍼지고 있는 것 같던데……\""
1007003-139 = "아아, 그 소문. 내 귀에도 들어오고 있지."
1007003-140 = "그거야말로 내 장송곡 연주 솜씨가 무르익었다는 증거가 아니겠어?"
1007003-141 = "보람차군. 실로 보람찬 일이야."
1007003-142 = "[s] \"그래…… 뭐…… 미나가 만족한다면야.\""
1007003-144 = "(괴악한 리코더 간부에 대한 소문은, 그 뒤로도 계속해서 산해경을 맴돌았다.)"
1007003-145 = "(결과적으로 산해경의 치안 유지에는 도움이 되었다는 것 같으니, 해피 엔딩, 해피 엔딩……?)"
