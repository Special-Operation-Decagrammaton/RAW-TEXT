[translation]
1006305-1 = "판도라의 상자 2"
1006305-8 = "크크큭……. 완벽한 타이밍이군……."
1006305-11 = "지금이라면 누구도 날 막을 수 없다……. 가라, 코유키! 숨겨진 지식을 위해……!"
1006305-16 = "음음. 어디 보자……. 오호, 여기에 이런 장치를 걸어 두셨군요?"
1006305-17 = "어라어라, 선생님도 참. 이제 보니 또 새로운 보안 시스템이네요?"
1006305-18 = "몰래몰래 올 때마다 계속 보안 장치를 다른 걸로 바꾸시는군요. 노력도 가상하시지."
1006305-19 = "부질없는 몸부림을 제 앞에서……. 니하하하~."
1006305-20 = "자~. 그럼 이런 것 따위 대충 빨리 풀어버리고……."
1006305-37 = "자, 그럼 안의 내용물을……. 과연 어떤 게 있을……."
1006305-38 = "지……?"
1006305-42 = "……? ……어라?"
1006305-43 = "[s1] \"……코유키 씨.\"\n[s2] \"자─ 거기, 스톱─. 현행범─.\""
1006305-46 = "……아?"
1006305-47 = "……헉!!?!?? 선생님?! 어째서 선생님이 여기에!?!?"
1006305-48 = "[s3] \"이쪽이 할 이야기죠? 그건?\"\n[s4] \"그만 포기하렴. 이걸로 대체 몇 번째니.\""
1006305-51 = "크윽……!! 이럴 수가!! 언제나 이런 아날로그적인 함정에 절 빠뜨리시다니!!"
1006305-52 = "처음부터 절 붙잡기 위해 대기하고 계셨던 건가요!? 다 큰 어른이 이런 애를 잡으려고!!"
1006305-53 = "[s5] \"그것도 이쪽이 할 이야기지.\"\n[s6] \"말하자면, 원래부터 우리 집이지만 말이야.\""
1006305-56 = "이이익……!! 분하다!! 하지만 포기하지 않아요! 다음 번에는 꼭……!"
1006305-57 = "……네?"
1006305-58 = "그만하지 않으면 다음 번에는 세미나 선배들에게 이야기를 하실 거라고요……!?"
1006305-59 = "……!!!!! 큭!"
1006305-60 = "치, 치사하게 1:1 승부에서 그런 걸 꺼내드시다니요!! 이야기가 다르잖아요!? 이건 선생님과 저의 대결이었잖아요!?"
1006305-61 = "대결이었던 적이 없다고요……? 그, 그랬나? 아무튼……!!"
1006305-62 = "[s7] \"여기 서류들은 나만의 비밀이 아니야, 코유키.\"\n[s8] \"부탁할게. 모두에게 중요한 내용들이라서 그래.\""
1006305-65 = "……어……. 선생님……?"
1006305-66 = "……어라……. 갑자기 그런 얼굴로……."
1006305-67 = "으음……."
1006305-71 = "……하아."
1006305-72 = "알았어요. 선생님이 그렇게까지 말하시니……. 어쩔 수 없네요."
1006305-73 = "분위기를 보아 하니, 이 이상은 손 대 봐야 재밌을 것 같지도 않고……."
1006305-74 = "……그럼 여기 건 손대지 않겠습니다……."
1006305-75 = "[s9] \"고마워, 코유키.\"\n[s10] \"의외로 순순히……?\""
1006305-78 = "뭐……. 저도 딱히 선생님이 싫어하는 짓이라는 걸 알면서까지 보고 싶은 건 아니니까요. 그냥 궁금했던 것일 뿐."
1006305-79 = "……그치만."
1006305-80 = "[s] \"……그치만?\""
1006305-81 = "선생님…… 분명 '모두에게 중요한 것'이라 보이는 게 싫다고 하셨으니……."
1006305-82 = "그 말인즉슨……! 여기서 또다시 역발상!!"
1006305-83 = "……선생님의 '개인적인 것' 정도는 봐줄 수 있을 거라는 의미로! 알고!!"
1006305-84 = "[ns11] \"거기서 그런 해석……!?\"\n[ns12] \"……헉! 설마 생활관으로!?\""
1006305-87 = "먼저 쳐들어가겠습니다! 선생님의 숙소!! 니하하하하하!!!!"
1006305-91 = "[ns13] \"기, 기다려!! 코유키!!\"\n[ns14] 허겁지겁 쫓아간다."
1006305-95 = "(코유키를 쫓아 샬레 생활관 쪽으로 허겁지겁 쫓아왔다.)"
1006305-96 = "(예상보다 훨씬 더 빠른 속도로 달리는 코유키였기에, 한참 뒤에야 따라잡을 수 있었다.)"
1006305-101 = "[ns15] \"코, 코유키……!\"\n[ns16] \"잠깐!! 뭘 보는 거야……!\""
1006305-105 = "…………."
1006305-106 = "[s17] \"……???? 코유키?\"\n[s18] \"……어……. 손에 든 그건 뭐야……?\""
1006305-109 = "…………그……."
1006305-110 = "그……게……. 선생님……."
1006305-111 = "여기 와서……. 비밀번호 걸린 서랍이 보이길래……. 열었……는데……."
1006305-112 = "이……. '이상한 책들'이……. 좀……. 이, 이게 다 뭐예요……? 엄청 많으신데……."
1006305-113 = "뭔가……. 그……. 음……."
1006305-114 = "뭐……. 그, 그렇죠……. 선생님도……. 사생활이……. 있으실 거고……. 니, 니하하하……."
1006305-115 = "[s] \"………….\""
1006305-119 = "[ns] \"………!!!!!!!!!!!!\""
1006305-120 = "뭐, 뭔가 죄송하네요. 이런 건 줄은 몰랐어서……. 으음……. 니하하하……."
1006305-121 = "[s19] \"기, 기다려! 우선 내 말을 들어줘!!\"\n[s20] \"모, 몰수한 거니까! 전부 몰수한 거니까!!\""
1006305-124 = "에이, 아니에요. 괜찮아요. 괜히 그런 말씀 안하셔도……."
1006305-125 = "저, 저는……. 갑자기 해야 할 일들이……. 생각나서……."
1006305-126 = "먼저……."
1006305-127 = "……들어가 보겠습니다……."
1006305-131 = "……그, 그럼 이만!!!!"
1006305-139 = "(이후 코유키를 붙잡으려 쫓아갔지만, 역시나 너무 빠른 달리기라 따라잡지 못했다.)"
1006305-144 = "(……곧 세미나로부터 연락이 와, 사과와 취조를 동시에 들었다.)"
