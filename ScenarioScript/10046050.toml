[translation]
10046050-1 = "제5화;네버 카르페 디엠"
10046050-6 = "물론, 고양이는 웃을 수 있어요."
10046050-10 = "세이아 씨, 듣고 있나요?"
10046050-11 = "우으, 정말로 식후에 바로 티타임을 할 줄이야."
10046050-12 = "……? 무슨 말씀이시죠? 끼니는 걸러도, 티타임을 거를 수는 없잖아요?"
10046050-14 = "지당하신 말씀입니다."
10046050-19 = "설마하니, 여기서는 제가 소수파인가요?"
10046050-20 = "속이 안 좋을 때는 역시 홍차죠. 차라도 한 잔 더 하시죠."
10046050-21 = "네, 차는 소화에 이로우니까요. 제가 따라드리겠습니다."
10046050-26 = "…………."
10046050-27 = "…………!"
10046050-31 = "저, 나기사 님? 왜 그렇게 빤히?"
10046050-35 = "아뇨, 아무것도 아닙니다. 물론, 그런 취향이 있다는 것은 당연히 알고 있으니까요."
10046050-36 = "다양성은 존중해 마지않아야겠죠."
10046050-37 = "외람되지만, 그 말은 꼭 제가 별난 방법으로 차를 따랐다는 것처럼 들리는군요."
10046050-38 = "본의는 아니었습니다. 그렇게 들렸다면 사과드리겠습니다."
10046050-39 = "하지만, 저라면 우유를 먼저 따르고, 그 뒤에 홍차를 따랐을 거예요."
10046050-44 = "아."
10046050-45 = "……정말, 뜻밖이군요."
10046050-46 = "다른 분이라면 몰라도, 나기사 님처럼 차에 조예 깊으신 분께서 그런 말씀을 하신다니."
10046050-47 = "물론, 향을 묻어야 할 만큼 질 낮은 찻잎이라면, 저 역시 우유 먼저 따르겠습니다만."
10046050-51 = "여기 있는 것은 산해경 다원에서 직접 [ruby=싱글 에스테이트]공수한 명차[/ruby]. 평소라면 우유를 따라 마시지 않을 상등품……!"
10046050-52 = "향이 죽지 않도록 잔에 홍차를 따라 코팅하고 난 뒤에, 적정한 온도와 농도가 되도록 세밀하게 찬 우유를 따른다."
10046050-53 = "이것이 타협할 수 있는 최저한도라고 생각됩니다."
10046050-54 = "제 말에 틀린 부분이 있을까요?"
10046050-56 = "아."
10046050-57 = "물론, 차를 즐기는 방식에 정해진 정답은 없습니다. 당연히 제 방식이 절대적으로 옳다 주장할 생각도 없고요."
10046050-58 = "하스미 씨의 말대로 차를 먼저 따르는 편이, 본연의 향을 보존하는 데 유리하다는 것도 인정합니다."
10046050-59 = "하지만 그것은 밀크티의 또 하나의 주역……."
10046050-60 = "우유의 역할을 지나치게 과소평가하는 것이 아닐까요?"
10046050-64 = "우유의 고소한 맛과, 크리미한 질감이 홍차의 산미를 부드럽게 감싸줬을 때, 온도 차이에서 발생하는 화학적 변화."
10046050-65 = "그 모든 것을 포함하여 밀크티는 완성되는 것이죠."
10046050-66 = "밀크티의 정체성, 그것이 차 본연의 맛과 향…… 그 이상으로 중요하다는 걸까요?"
10046050-67 = "그냥 밀크티가 아닙니다. 오후 티타임의 밀크티죠."
10046050-68 = "음미의 영역을 넘어, 하나의 관습이자 절차. 예, 문화의 영역에 이르렀다 해도 과언이 아닙니다."
10046050-69 = "단지 시간을 지킬 뿐인 티타임에는 어떤 의미가 있을까요? 그건 그저 타임일 뿐이죠."
10046050-72 = "…………."
10046050-73 = "…………."
10046050-80 = "[ns1] \"저기, 미카.\"\n[ns2] \"항상 이래?\""
10046050-83 = "나 부르지 마……. 진짜 부끄러워 죽겠어."
10046050-84 = "선생님도 있는데 왜 저러는 거야, 나기 쨩."
10046050-85 = "아, 뭔가 죄송하네요. 하스미 선배도, 평소에는 전혀 이런 느낌이 아닌데요."
10046050-86 = "역시 홍차에 조예가 깊으신 나기사 님 상대로는 뭔가 다른 걸까요?"
10046050-90 = "……아, 결국 도화선에 불이 붙었군요."
10046050-91 = "개교 이래 한순간도 멈추지 않은 논쟁. 입에 담아서는 안 되는 논제. 트리니티의 터부."
10046050-92 = "<[ruby=증명 불가능한 문제]밀크티는 우유 먼저인가, 홍차 먼저인가……![/ruby]>"
10046050-93 = "…………."
10046050-94 = "…………."
10046050-99 = "아무래도, 합의에 이르기 어려워 보이는군요."
10046050-100 = "예에. 삼자의 개입 없이는 영원히 제자리걸음이겠죠."
10046050-101 = "세이아 씨!"
10046050-102 = "세이아 님!"
10046050-107 = "미, 미카…… 도움을……."
10046050-111 = "앗, 미안, 세이아 쨩! 우리는 다음 일정 준비로 바빠서!"
10046050-119 = "자, 세이아 씨! 세이아 씨라면 저와 같은 고견을 가지고 계시리라 믿습니다!"
10046050-120 = "아니요, 여기서는 순수하게 맛으로 승부를 봐야죠! 세이아 님의 미각이라면, 신뢰할 수 있으니까요!"
10046050-125 = "아아……."
10046050-131 = "미안, 선생님……."
10046050-132 = "옛날부터 나기 쨩은 좀 올드하다 할까, 이상한 데서 완고한 면이 있어서."
10046050-133 = "하여튼! 의도한 건 아니지만, 두 사람이 나기 쨩을 잡아두고 있는 동안, 남은 일정도 팍팍 준비하는 거야!"
10046050-134 = "잘 부탁해, 선생님!"
10046050-135 = "그리고, 이치카 쨩!"
10046050-140 = "네, 넷?! 저 말임까?! 노력하겠습니다!"
10046050-141 = "에이, 너무 딱딱하게 굴지 말고~ 고작 1살 차이밖에 안 나는걸."
10046050-142 = "앗…… 그, 혹시, 이치카 쨩도, 나하고 있으면 곤란한 쪽?"
10046050-143 = "아뇨, 아뇨! 그런 문제가 아니라……!"
10046050-144 = "[s3] \"미카가 걱정하는 그런 건 아닐 거야.\"\n[s4] \"이치카는 은근히 낯가림이 있으니까.\""
10046050-147 = "하하…… 낯가린다는 말은 살면서 처음 듣지 말임다."
10046050-148 = "그나저나 다음 일정이라고 하면은……?"
10046050-149 = "응, 그렇네~ 일단은, 요트 정비일까?"
10046050-150 = "아, 해변에 정박해 있던 요트 말이군요."
10046050-151 = "처음 계획이랑 조금 그림이 달라졌지만…… 응! 저녁놀 지는 바다에서 노는 것도 나쁘지 않을 것 같고!"
10046050-152 = "여기 옮길 때는 괜찮았는데, 그래도 좀 불안해서…… 그야 한동안 안 썼으니까."
10046050-153 = "한동안 안 썼다……? 대여한 것 아닙니까?"
10046050-154 = "응, 이거는 티파티 요트거든. 그치만 나기 쨩이나 나는 그런 취미 없고."
10046050-155 = "세이아 쨩은 애초에 개인 요트가 있으니까 좀처럼 쓸 일이 없었달까."
10046050-157 = "사는 세계가 너무 다르지 말임다……."
10046050-158 = "아하하. 좀, 그치?"
10046050-159 = "예전에는 나도 몰랐는데, 이제는 좀 알겠더라고."
10046050-163 = "아 참! 내가 이런 말 했다는 건 비밀이야?"
10046050-164 = "나기 쨩이나 세이아 쨩이, 그래도 티파티라면서 품위가 어쩌니 되게 시끄럽거든."
10046050-165 = "하하…… 고생 많으심다."
10046050-173 = "응응, 준비한 물건들은 다 멀쩡한 거 같고."
10046050-174 = "이제 멀쩡히 시동이 걸리는지만 확인하면 되려나?"
10046050-182 = "……어라?"
10046050-183 = "어, 어째서?! 어제까지만 해도 괜찮았는데?!"
10046050-184 = "음…… 완전히 시동이 걸렸다가 멈추는 걸 보면 엔진 문제는 아닐 거 같네요."
10046050-185 = "혹시 스크루 쪽에 뭔가 걸렸다든지?"
10046050-186 = "한 번 확인해 보고 오겠슴다."
10046050-193 = "아아~ 역시~"
10046050-194 = "응? 뭔가 보여? 나는 하나도 안 보이는데."
10046050-195 = "아, 예. 프로펠러에 뭔가 비닐 같은 게 감겨 있네요."
10046050-196 = "그러면 빼기만 하면 되는 거야?"
10046050-197 = "예에, 아마도요. 그렇지만 도구가 필요할 거 같네요. 어디 긴 갈고리 같은 게 있으려나."
10046050-198 = "그냥 물에 들어가면 되는 거 아니야?"
10046050-199 = "예? 아니, 으음~ 뭐, 그래도 괜찮지만, 조~금 위험하지 않을까 싶긴 한데."
10046050-200 = "뭐…… 찾아오는 시간을 생각하면, 어차피 수영복 차림이고 그냥 뛰어드는 게 낫나……."
10046050-201 = "괜찮아, 괜찮아. 나 보기보다 청소 잘하거든!"
10046050-202 = "네?"
10046050-212 = "미, 미카 님!!"
10046050-214 = "와앗, 차가워! 어디 보자, 프로펠러는……."
10046050-219 = "아, 진짜다. 비닐이 엉켜 있었구나. 이치카 쨩, 눈썰미 좋네."
10046050-220 = "……어, 그, 감사합니다. 뭐랄까, 진짜 예상 밖이네요."
10046050-221 = "앗, 미카 님. 잠시만요, 그거는 제가 하겠습니다."
10046050-223 = "응? 아니야, 이치카 쨩은 안 젖었으니까, 들어온 김에 내가 할게!"
10046050-224 = "하지만 비닐이 기름투성이라서……."
10046050-226 = "스스로 할 수 있는 일 정도는 직접 할게. 이미 충분히 도움받고 있는걸."
10046050-230 = "…………."
10046050-240 = "요트 문제는 이걸로 해결이네! 다들 수고했어!"
10046050-241 = "에이~ 고생은 미카 님 혼자 다 하셨잖슴까."
10046050-242 = "으응, 아니야. 혼자였으면 시동이 꺼지는 이유도 몰랐을걸."
10046050-243 = "이대로 다음 일정도 쭉쭉 잘 부탁할게!"
10046050-244 = "넵! 맡겨주십쇼!"
10046050-249 = "…………."
10046050-250 = "모처럼 예쁘게 꾸민 손톱이, 완전히 더러워지셨는데요……."
10046050-252 = "(그 후로도 두 사람과 함께 휴양 시설을 점검하러 다녔다.)"
10046050-258 = "콜록, 콜록! 우왓…… 먼지 엄청 나!"
10046050-259 = "이거는 대청소가 되겠네요. 미카 님, 잠깐 나가계시면……."
10046050-260 = "응! 둘이서 빨리 끝내버리자!"
10046050-265 = "넷?! 아, 넵! ……미카 님! 머리 위에 거미줄!"
10046050-266 = "어? 꺄앗?!"
10046050-279 = "(그렇게 여러 소동을 거쳐………….)"
10046050-284 = "다들 진~짜! 진짜로! 고생 많았어!"
10046050-289 = "이야~ 어떻게 제때 다 끝냈네요."
10046050-290 = "나기사 님도 의심하는 일 없이 잘 즐기시는 듯하고요."
10046050-291 = "응, 전부 두 사람 덕분이야! 고마워!"
10046050-292 = "그리고, 있잖아."
10046050-296 = "미안해."
10046050-300 = "네?"
10046050-301 = "[s5] \"왜 그래, 미카?\"\n[s6] \"뭔가 마음에 걸려?\""
10046050-306 = "으응, 아니~ 그치만, 꼭 말하고 싶었어."
10046050-307 = "다들 모처럼 바다에 온 만큼, 이것저것 하고 싶은 일이 많았을 텐데, 하나부터 열까지 내 억지를 들어주느라 고생만 했잖아?"
10046050-308 = "혼자서 괜찮다고 큰소리 뻥뻥 친 것치고는 엄청 도움받아서 좀 부끄럽지만……."
10046050-309 = "둘 중 하나라도 없었다면, 여기까지 오지도 못했을 거야."
10046050-310 = "그런 의미에서, 다들 고마워. 그리고 미안해."
10046050-311 = "미, 미카 님! 고개 드십쇼! 누가 보겠습니다!"
10046050-312 = "그리고 사과는 오히려 제가…… 어쩌면, 미카 님을 조금 오해하고 있었을지도……."
10046050-313 = "응? 뭐라고?"
10046050-317 = "아뇨! 아무것도 아님다!"
10046050-318 = "이제 별장 점검만 하면 끝이네요."
10046050-319 = "응, 그렇지만, 오전에도 한 번 확인했고, 아마 문제는……."
10046050-324 = "뭐, 뭐야, 땅이 흔들리는……!"
10046050-328 = "[ns7] \"지, 지진?!\"\n[ns8] (두 사람을 몸으로 감싼다.)"
10046050-346 = "미카 님! 선생님! 괜찮습니까?"
10046050-352 = "응, 나는 괜찮아. 선생님도…… 무사하구나, 다행이네."
10046050-353 = "그나저나 방금 진동은 대체……?"
10046050-354 = "응?"
10046050-358 = "…………?"
10046050-359 = "……어."
10046050-361 = "……어떻게 된 거야?!"
