[translation]
1005502-1 = "은근하게"
1005502-4 = "(붉은겨울 학원에 들러 업무를 마친 뒤, 약속대로 구교사로 향했다.)"
1005502-12 = "(워낙 외진 곳에 위치한 교사였던지라, 도착했을 땐 이미 해가 다 넘어간 저녁이었다.)"
1005502-16 = "응……? 별일이네, 이런 곳에 사람 발소리가 다 들리다니."
1005502-20 = "……어라."
1005502-27 = "이게 누구야, 선생님이잖아? 웬일이야, 이런 시간에? 이렇게 누추한 곳까지."
1005502-28 = "……응?"
1005502-29 = "약속? 아아. 그러고 보니 그런 이야기를 했었지? 기억해주고 있던 건가. 고맙네~."
1005502-33 = "어서 들어와. 밖이 많이 춥지? 그래도 이 안은 좀 나을 거야."
1005502-42 = "내 입으로 이런 말 하긴 뭐하지만, 진짜로 와 줄 거라 기대한 건 아니었는데 말이야. 조금 감동했어."
1005502-43 = "고마워, 선생님. 이렇게 기쁜 날 하필이면 여기 나밖에 없어서 좀 미안하네."
1005502-44 = "다른 학생들은 장작을 구하러 잠깐 나갔거든."
1005502-45 = "[s1] \"신경 쓰지 마. 손님 대접받으려고 온 것도 아닌걸.\"\n[s2] \"혼자서 여길 지키고 있던 거야? 심심하지 않았어?\""
1005502-46 = "손님이 아니라고? 그럼 뭘까? 그렇게 말하니 괜히 더 신경 쓰이는걸."
1005502-47 = "뭐어— 아니라고 하면 거짓말이겠지만……. 적어도 이젠 아니지. 선생님이 와줬잖아?"
1005502-48 = "후후. 농담은 여기까지 하고."
1005502-49 = "어디 보자……. 따로 대접할 만한 게 없어서 미안하지만……."
1005502-58 = "여기까지 오느라 지쳤을 텐데, 괜찮다면 목도 축일 겸 이거라도 좀 마실래?"
1005502-59 = "[s3] \"물이야? 시원해 보이네.\"\n[s4] 감사의 인사를 표하고 받아 마신다."
1005502-69 = "[ns5] 음료를 입에서 뿜는다.\n[ns6] \"물이 아니잖아! 술 아냐, 이거!?\""
1005502-71 = "으아— 이게 아깝게 무슨 짓이야. 보……. 아니, 생명의 물을……."
1005502-73 = "틀린 말은 아니네. 보드카의 어원은 '물'이기도 하니까."
1005502-74 = "응? 속인 거냐고? 그럴 리가. 나는 딱히 정확하게 '물'이라고 한 적은 없는걸?"
1005502-75 = "그리고 뭐 어때. 선생님은 어차피 어른인데, 술을 마신다고 해서 문제가 되는 것도 아니고 말이야."
1005502-76 = "……응? 뭐라고?"
1005502-77 = "학생 앞에서 술을 마시는 선생이 어디 있냐고?"
1005502-78 = "음……. 그렇게 나오시겠다……."
1005502-82 = "이제부터 선례를 차근차근 만들어 나가면 되는 거 아닐까……?"
1005502-83 = "[s7] \"이제부턴 확실하게 거절해야겠어.\"\n[s8] \"부탁이니 그냥 물을 줘.\""
1005502-84 = "으음…… 미안하지만 나도 달리 방도가 없거든."
1005502-85 = "으음…… 미안하지만 나도 달리 방도가 없거든."
1005502-86 = "일부러 선생에게 술을 먹이려고 보드카를 건넨 건 아니야."
1005502-87 = "그게 이 건물, 전기가 다 나가버렸거든. 냉장고도 고장 나서 음료수가 몽땅 다 얼어버렸어."
1005502-88 = "물도, 주스도, 콜라도…… 그나마 안 얼고 남아있던 게 이런 보드카 같은 도수 높은 술뿐이라서."
1005502-89 = "그러고 보면 보드카는 정말 완벽한 음료 아니야?"
1005502-90 = "극한의 상황에서도 사람의 갈증을 해소해 줄 수 있을 뿐만 아니라 추운 곳에서는 체온도 조절해 주고, 다치면 소독약으로도 쓸 수 있고……"
1005502-91 = "심지어 불을 붙여 연료로도 쓸 수 있는 만능의 물이니까. 후후."
1005502-92 = "[s] \"갑자기 보드카 찬양을 시작하셔도……\""
1005502-93 = "아아~ 이야기를 하고 있다 보니 나도 왠지 목이 마르네."
1005502-94 = "하지만 지금 마실 수 있는 음료는 보드카뿐이고, 얼음을 먹다가는 저온 화상을 입을지도 모르니……"
1005502-95 = "지금 같이 특수한 상황에서는 한 모금 정도는 괜찮겠지?"
1005502-99 = "그럼, 잘 마시겠습니다—"
1005502-100 = "[s9] \"아니, 아니. 그렇게는 안 되지.\"\n[s10] 보드카를 가져온다."
1005502-107 = "선생님……?"
1005502-108 = "갑자기 보드카는 왜 가져가는 거야? 선생님도 갑자기 보드카가 마시고 싶어졌어?"
1005502-115 = "뭐, 뭐 하는 거야!? 아까운 보드카에 불을 붙이다니……!"
1005502-116 = "……응? '연료로도 쓸 수 있으니 불을 피워서 얼어붙은 물이랑 주스를 녹이면 된다'고?"
1005502-117 = "………으음."
1005502-118 = "확실히 그건…… 그런 방법을 사용하면 되긴 하는데……."
1005502-119 = "………………으음."
1005502-120 = "[s11] \"……너무 대놓고 아쉬워하는 거 아냐?\"\n[s12] \"그래도 안 되는 건 안 되는 거야.\""
1005502-121 = "……아니, 아무것도 아니야."
1005502-122 = "……아니, 아무것도 아니야."
1005502-123 = "……."
1005502-125 = "……쉽지 않군."
1005502-129 = "(이후, 시구레와 보드카를 연료로 녹인 물과 주스를 마시며 여유로운 시간을 보냈다.)"
