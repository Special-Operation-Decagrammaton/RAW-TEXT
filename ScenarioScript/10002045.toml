[translation]
10002045-1 = "제4화;모래성 만들기와 모래찜질 2"
10002045-2 = "(몰려든 불량배들을 모두 쓰러트리고 나니, 모래성도 형체를 알아볼 수 없게 돼 있었다.)"
10002045-3 = "아아……."
10002045-4 = "아즈사 쨩과 마시로 씨가 만든 모래성이……."
10002045-5 = "어쩔 수 없어, 히후미. 형체가 있는 모든 건 사라질 뿐이야. 모든 것은 헛된 법이니까."
10002045-6 = "그, 그치만……."
10002045-7 = "모래성이야 또 쌓으면 돼. 헛되고 헛된 이 세계에서 오직 유의미한 것은 투쟁하는 것뿐이니까."
10002045-8 = "맞습니다. 악은 어디에나 존재하는 법이죠. 우린 항상 그와 맞설 대비를 해 놓아야 해요."
10002045-9 = "하, 하으…… 뭔가 다른 것 같은 느낌이……"
10002045-10 = "저는 이제 아무것도 모르겠어요……"
10002045-11 = "정말로 이게 맞는 걸까요……?"
10002045-15 = "츠, 츠루기 씨는……."
10002045-16 = "키헤헤헤헤헤헤!!"
10002045-18 = "캬하하하하!!!"
10002045-19 = "[s] \"즐거워하는 거 같은데.\""
10002045-21 = "정말로 저게 그런 의미인가요…… 선생님께서 그러시다면 맞겠지만……"
10002045-22 = "그, 그러고 보니 모래찜질 하는 사진도 찍어야 하네요. 이건 어떻게 하죠……?"
10002045-23 = "……? 네? 이미 찍으셨다고요? 모래찜질 사진을요?"
10002045-24 = "어, 언제요? 저희 중에 누가 모래찜질을 한 적이 있었나요?"
10002045-25 = "……네? 대신 불량배 분들께 모래찜질을 시켜주는 사진이라고요?"
10002045-26 = "그게 무슨……"
10002045-27 = "……호, 혹시 그 사진…… 저도 좀 보여주실 수 있을까요, 선생님……?"
10002045-32 = "[ns] 찍은 사진을 건네 준다."
10002045-35 = "……으음……역시……"
10002045-36 = "선생님…… 이건 '모래찜질'이 아니라……"
10002045-37 = "……'모래에 파묻혔다'……라고 해야 하지 않을까요?"
