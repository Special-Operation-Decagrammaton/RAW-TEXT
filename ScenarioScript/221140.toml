[translation]
221140-1 = "#title;제14화;빈 자리의 존재감"
221140-3 = "#na;(새미가 떠나고 난 뒤, 약 보름 정도 지났을 무렵……)"
221140-6 = "#na;(그동안 밀려 있던 샬레의 업무들을 정리하느라, 꽤 시간이 지난 뒤에 오디세이아 학원을 다시 방문할 수 있었다.)"
221140-10 = "3;트라이던트 부원;05\n#3;al\n#wait;1300\n#bgshake"
221140-11 = "3;트라이던트 부원;04;저기, 스미카~ 오늘 갑판 청소에 쓰는 이 비눗물 상태가 이상한데……\n#3;em;[속상함]\n#3;stiff"
221140-12 = "3;트라이던트 부원;05;평소에 쓰던 가루 비누 말고 다른 걸 넣었어?"
221140-13 = "5;스미카;01;아, 네. 오늘 준비한 비눗물에는 가루 비누 비율을 줄이고 안 쓰는 치약을 넣었어요.\n#5;al\n#3;m1"
221140-14 = "3;트라이던트 부원;04;왜?"
221140-15 = "5;스미카;99;그야 가루 비누는 비눗 방울이 많이 생기니까요. 지난 번처럼 비눗 방울에 혹한 새미가 달려들기라도 하면—"
221140-16 = "#st;[0,0];instant;1;"
221140-18 = "3;트라이던트 부원;04\n5;스미카;04\n#5;em;[!]\n#5;h\n#3;h\n#wait;800"
221140-19 = "5;스미카;06;……아.\n#5;stiff"
221140-20 = "5;스미카;07;죄송합니다. 저도 모르게 자꾸 깜박하고 마네요.\n#5;em;[땀]"
221140-21 = "3;트라이던트 부원;01;아니야. 나도 남는 참치 캔을 보면 무심코 하나 씩 챙겨버리곤 하니까."
221140-22 = "5;스미카;04;습관이라는 게 참 무섭네요."
221140-23 = "3;트라이던트 부원;02;……그치?"
221140-24 = "#st;[0,0];instant;1;"
221140-28 = "[ns1] \"다들 갑판 청소 중이었어?\"\n[ns2] \"……오늘도 고생이 많네.\""
221140-29 = "#st;[0,0];instant;1;"
221140-30 = "#st;[0,0];instant;1;"
221140-32 = "1;트라이던트 부원;04\n5;스미카;10\n#5;em;[?!]\n#1;em;[?!]\n#1;shake\n#5;shake\n#5;h\n#1;h\n#wait;1000"
221140-33 = "5;스미카;04;우, 우왓? [USERNAME] 선생님?!\n#5;stiff"
221140-34 = "5;스미카;10;오늘 오신다는 말씀은 듣지 못했었는데요…… 혹시 저희가 놓친 연락이라도……?"
221140-35 = "[s] \"아냐. 근처를 지나가는 참에 들른 것 뿐이야.\""
221140-36 = "5;스미카;07;다, 다행이네요. 저는 혹시라도 어제 야간 당직 중에 선생님께서 하신 연락을 못 보고 지나친 줄 알고…… 십년 감수했습니다.\n#5;em;[땀]\n#5;m3\n#1;dl"
221140-37 = "5;스미카;01;그럼, [USERNAME] 선생님이 오셨으니…… 크흠."
221140-38 = "#st;[0,0];instant;1;"
221140-40 = "5;스미카;99\n#5;greeting\n#5;h\n#wait;1200"
221140-41 = "5;스미카;02;샬레의 선생님께서 배에 승선하십—\n#bgshake\n#fontsize;80"
221140-42 = "[s3] \"잠깐, 잠깐. 그렇게 크게 외칠 필요는 없어!\"\n[s4] \"오늘은 사적으로 잠시 놀러 온 것 뿐이니까……\""
221140-45 = "5;스미카;04;네? 하지만 이렇게 외치지 않으면 다른 학생들이 선생님이 방문하셨는지 알지 못하는 걸요.\n#5;em;[?]"
221140-46 = "5;스미카;06;게다가 외부에서 오신 손님이 배를 타고 내릴 때는, 무조건 큰 소리로 주변에 알리는 것이 '오디세이아의 관습' 이기도 한데……\n#5;stiff"
221140-47 = "[s] \"하지만 그건 '손님'의 경우 잖아.\""
221140-49 = "[ns5] \"손님이 아니라 친구가 놀러 왔다고 생각해주면 안 될까?\"\n[ns6] \"친구가 올 때마다 전교에 알리는 것도 이상하잖아.\""
221140-52 = "5;스미카;04;그것도…… 그렇긴 하지만요.\n#5;em;…"
221140-53 = "5;스미카;16;그동안 오디세이아 학원은 육지에서 떨어져 항해를 계속해 왔기 때문에, 학원 밖에서 친구가 올 일이 있을 거라고는 생각지 못했는데……"
221140-54 = "5;스미카;08;이렇게 크게 알리면 친구 입장에서는 다소 부담스러울지도."
221140-55 = "[s] \"그렇지?\""
221140-56 = "#5;hide\n4;트라이던트 부원 B;00\n2;트라이던트 부원 A;02;하지만 선생님을 친구라고 부르기엔 제법 나이 차가 있잖아?\n#2;em;[반응]"
221140-57 = "4;트라이던트 부원 B;03;맞아. 갑자기 친구로 대하는 건, 조금 부담스러울지도~\n#4;em;[재잘]"
221140-59 = "#2;hide\n#4;hide\n3;스미카;10;자, 잠깐만요! 선생님께 그게 무슨 무례인가요. 다들!\n#3;hophop"
221140-60 = "[s] \"괜찮아. 사실은 사실이니까……\""
221140-62 = "[ns] \"그나저나 그동안 별 일은 없었어?\""
221140-63 = "#st;[0,0];instant;1;"
221140-65 = "3;스미카;02\n#3;em;…\n#3;h\n#wait;2500"
221140-66 = "3;스미카;01;……네. #n그동안 오디세이아 학원에서는 아무 일도 없었습니다."
221140-67 = "3;스미카;99;폭풍이 오지도 않았고, 크게 다치는 학생도 없었습니다."
221140-68 = "3;스미카;04;무, 물론 저희가 <아일랜드>의 간부가 아닌 이상, 오디세이아 학원의 모든 사건 사고를 파악하고 있지는 않지만요.\n#3;em;[땀]\n#3;stiff"
221140-69 = "3;스미카;02;참. 그러고보니 선생님께서는 지금부터 <아일랜드>에 가실 예정이신가요?"
221140-70 = "[s] \"응. 함장을 만날까 하는데……\""
221140-71 = "3;스미카;15;그럼 잔교까지 직접 안내해 드리겠습니다. 지난 번 출항 이후로 잔교의 위치가 다소 바뀌었거든요."
221140-72 = "#st;[0,0];instant;1;"
221140-74 = "3;스미카;01\n#3;m2\n#wait;1300"
221140-75 = "3;스미카;02\n#3;em;[반응]\n#wait;1000"
221140-76 = "3;스미카;01;선생님."
221140-77 = "3;스미카;00;그래도 배에 오를 때는 오른발부터 먼저 딛어주세요."
221140-78 = "[s] \"……역시 아직도 금기가 신경 쓰여?\""
221140-79 = "3;스미카;99;네.\n#3;em;…"
221140-80 = "3;스미카;01;아무리 미신이라도 선생님께 불길한 일이 생기진 않았으면 좋겠으니까요.\n#3;m3"
221140-87 = "4;미나토;15\n#4;greeting\n#4;a\n#wait;1500"
221140-88 = "#st;[0,0];instant;1;"
221140-92 = "4;미나토;02\n#4;em;[반응]\n#4;h\n#wait;1000"
221140-93 = "4;미나토;00;어머나, [USERNAME] 선생님.\n#4;m3"
221140-94 = "4;미나토;16;연락도 없이 갑자기…… 혹시 급한 일이라도 생기신 건가요?"
221140-95 = "[s] \"아니야. 미나토를 보러 왔어.\""
221140-96 = "4;미나토;02;저를…… 요?\n#4;stiff"
221140-97 = "#st;[0,0];instant;1;"
221140-99 = "4;미나토;24\n#4;em;[!]\n#4;h\n#wait;800"
221140-100 = "4;미나토;07;하하, 지난 일 때문에 걱정을 끼쳐드린 모양이네요."
221140-101 = "4;미나토;00;너무 걱정 마시길. 저나 아미 부장이나…… 오디세이아의 모든 학생들이 문제없이 잘 지내고 있으니까요."
221140-102 = "4;미나토;15;일단 겉으로는 말이죠.\n#4;em;…\n#fontsize;50"
221140-103 = "4;미나토;02;입항 후 상신해야 했던 문서도 모두 처리했고, 아마 다음 주부터는 다른 학원의 학생들과 마찬가지로 저희 학생들도 육지에서 일상을 보낼 수 있겠네요."
221140-104 = "4;미나토;99;다만 사관실에 구비해 둔 손님용 찻잎이 마침 떨어진 참이라."
221140-105 = "4;미나토;00;혹시 캔 녹차라도 괜찮으신가요?\n#4;em;[?]"
221140-106 = "[s] \"응. 잘 마실게.\""
221140-107 = "#st;[0,0];instant;1;"
221140-111 = "[ns] \"새미의 일은 유감이야.\""
221140-112 = "#st;[0,0];instant;1;"
221140-114 = "3;미나토;15\n#3;em;…\n#3;h\n#wait;2500"
221140-115 = "3;미나토;99;……아뇨. 이미 오래전부터 예상하고 있던 상황이었으니까요."
221140-116 = "3;미나토;00;오히려 선생님께서 중재해주신 덕분에 과거에 얽매이지 않고, 최선의 방법으로 새미를 배웅해 줄 수 있었습니다."
221140-117 = "3;미나토;12;학생들도 이 결정에 다들 만족하는 것처럼 보이고요.\n#3;em;[반짝]"
221140-118 = "[s] \"다들 이제 금기에 얽매이지 않을 수 있는 걸까?\""
221140-119 = "3;미나토;02;……글쎄요. 당장은 어려울 것 같네요."
221140-120 = "3;미나토;01;이번 일 덕분에 많은 학생들이 금기를 어긴다고 해서 반드시 문제가 발생하는 건 아니라는 걸 알게 되었지만."
221140-121 = "3;미나토;99;그래도 금기와 관습은 여전히 오디세이아의 일상에 적지 않은 몫을 차지하고 있으니까요."
221140-122 = "3;미나토;00;갑자기 보이지 않게 된다 하더라도, 그 기억마저 없었던 것으로 할 수는 없겠죠."
221140-123 = "#st;[0,0];instant;1;"
221140-125 = "3;미나토;00\n#3;m5\n#wait;1300"
221140-126 = "3;미나토;00\n#3;greeting\n#wait;1300"
221140-127 = "3;미나토;15;……저는 아직도 이 낡은 공을 버리지 못했어요."
221140-128 = "[s] \"새미의 방석도 여전히 그 자리에 있네.\""
221140-129 = "3;미나토;99;네, 당분간은 그대로 두려고요.\n#3;m3"
221140-130 = "3;미나토;00;처음에는 치워버릴까 생각도 했지만…… 빈 자리가 무엇을 채운 것보다 더 큰 존재감을 발할 수 있다는 사실을 이번에 또 깨닫게 되었어요.\n#3;em;…"
221140-131 = "3;미나토;03;이 삶은 계속되고, 언젠가 빈 자리가 익숙해질 때 즈음이면 새로운 만남이 찾아오겠죠."
221140-132 = "3;미나토;11;선생님이 저희의 삶에 찾아오신 것처럼."
221140-133 = "3;미나토;03;그 때는 과거의 기억에 얽매이지 않고, 저희의 삶을 스스로 결정할 수 있었으면 좋겠네요.\n#3;em;[음표]"
221140-134 = "[s7] \"분명 잘 해낼 수 있을 거야.\"\n[s8] \"모든 삶의 주인은 자신이니까.\""
221140-137 = "3;미나토;01;……저도 이 삶의 주인이 될 수 있다면 좋겠네요."
221140-138 = "#st;[0,0];instant;1;"
221140-140 = "3;미나토;00\n#3;d\n#wait;1500"
221140-141 = "3;미나토;00\n#3;a\n#3;closeup\n#wait;1500"
221140-142 = "3;미나토;13;그럼, 앞으로도 잘 부탁드립니다, 선생님.\n#3;em;[반짝]\n#3;greeting\n#3;closeup"
221140-144 = "#na;(이후, 오디세이아 학원에서 나와 샬레로 돌아가기 위해 지하철 승강장에서 열차를 기다리던 중……)"
221140-148 = "#st;[0,0];instant;1;"
221140-152 = "#na;(승강장 맞은 편에서 낯익은 학생 하나가 다가와 말을 걸었다.)"
221140-153 = "#na;???;……여기서 또 뵙게 되네요. [USERNAME] 선생님."
221140-154 = "#st;[0,0];instant;1;"
221140-157 = "3;가짜 총학생회장;00\n#3;a\n#wait;1500"
221140-158 = "[ns9] \"어라…… 총학생회장?\"\n[ns10] \"이곳에는 무슨 일이야?\""
221140-161 = "3;가짜 총학생회장;02;그야, 열차 승강장에는 열차를 타러 왔지요."
221140-162 = "3;가짜 총학생회장;00;선생님도 같은 이유로 이곳에 오신 게 아닌가요?\n#3;em;[?]"
221140-163 = "[s11] \"하지만 이곳은 총학생회 건물로부터 꽤 떨어진 곳인데……\"\n[s12] \"혹시, 총학생회장도 오디세이아 학원에 볼 일이 있었던 거야?\""
221140-166 = "3;가짜 총학생회장;99;……글쎄요.\n#3;em;…"
221140-167 = "3;가짜 총학생회장;02;오디세이아 학원에 볼 일이 있다기 보다는, 오디세이아 학원을 방문한 선생님께 볼 일이 있었다고 하는 편이 맞을 것 같네요."
221140-168 = "[s] \"내게 볼 일이……?\""
221140-169 = "3;가짜 총학생회장;01;이번 사건도 어느 정도 정리된 것 같아, 선생님과 오디세이아 학원에 대한 소회라도 공유하고자 샬레에 잠깐 방문했었는데…… 마침 부재중이셔서요.\n#3;m2"
221140-170 = "3;가짜 총학생회장;99;당번 학생에게 여쭈어보니, 오디세이아로 향하셨다고 해서 이곳까지 오게 되었답니다."
221140-171 = "3;가짜 총학생회장;00;말없이 뒤를 밟은 점에 대해서는 부디 양해를 부탁드립니다.\n#3;greeting"
221140-172 = "[s13] \"미안. 나를 찾은 줄은 몰랐었네……\"\n[s14] \"그럼 잠깐 카페에 가서 이야기를 계속 할까?\""
221140-175 = "3;가짜 총학생회장;02;아뇨, 그렇게 오래 걸리는 이야기는 아닙니다.\n#3;m3"
221140-176 = "3;가짜 총학생회장;01;마침 이 승강장에는 사람도 없고, 다음 열차가 들어올 때까지 시간도 충분하네요."
221140-177 = "3;가짜 총학생회장;09;그 동안 잠시, 선생님의 시간을 빌릴 수 있을까요?"
