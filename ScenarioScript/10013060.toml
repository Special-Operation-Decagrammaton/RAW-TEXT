[translation]
10013060-1 = "제6화;현무의 사신들 1"
10013060-6 = "이곳이네요! 인터넷에서도 현재 엄청나게 떠들썩한 <모든 것에 대가를 요구하는 현무의 사신들>이 있는 리조트라는 곳이!"
10013060-7 = "[s] \"꽤나 번잡한걸.\""
10013060-8 = "그러게요. 사람이 많을 뿐만 아니라……."
10013060-9 = "킁킁- 무언가 엄청 맛있는 냄새도 가득해요!"
10013060-15 = "……선생님, 배꼽시계가 울려~"
10013060-16 = "[s] \"으음. 그럼 뭐라도 좀 사 먹을까?\""
10013060-17 = "앗! 이즈나는 찬성이에요!"
10013060-18 = "후후, 금강산도 식후경이라고 하니까요."
10013060-20 = "그나저나……"
10013060-21 = "뭔가 평화로워 보이기는 하는데, 이곳이 정말로 <리조트 사냥>으로 악명을 떨치는 곳이 맞아……?"
10013060-22 = "아, 그거라면 일단 인터넷에서 찾아본 자료인데 말이죠"
10013060-23 = "이 리조트의 전반적인 관리는 아무래도 그 유명한 <현무상회>가 맡고 있는 모양이에요."
10013060-24 = "[s] \"현무상회라면, 산해경의 그……?\""
10013060-25 = "말 그대로 <현무>라는 이름 그대로인 거냐구?!"
10013060-26 = "하지만 이상한 건…… <리조트 사냥>에서 두각을 나타내고 있다는 것도 그렇지만,"
10013060-27 = "또 이곳 리조트의 서비스가 아무래도 인터넷상에서 악명으로 자자한 모양이라……."
10013060-28 = "그건 정말 이상하네……. 현무상회야 평소 요리에 깐깐하기로 유명하기는 해도, 서비스가 악평을 들을 정도라니……?"
10013060-29 = "보다 자세한 건, 역시 직접 확인해보는 수밖에 없겠어요."
10013060-36 = "어라~? 저기~ 소란이 일어났어~"
10013060-37 = "저건……. 손님하고 종업원인 걸까요?"
10013060-39 = "너, 너무해용! 의자에 앉았다는 이유만으로 비용을 청구하다니용!"
10013060-40 = "너무하긴 뭐가 너무해! 정당한 이용료를 지불하란 것뿐이야!"
10013060-41 = "의자 이용료뿐만이 아니다! 젓가락을 만진 비용도! 잔을 건드린 비용도!"
10013060-42 = "앗! 지금 막 탁자를 건드렸지! 그 비용도 청구할 테다!"
10013060-43 = "너, 너무해~?!"
10013060-44 = "하하하! 너무하긴 뭐가 너무해! 우린 현무상회라고? 고급 서비스엔 대가를 지불하셔야지!"
10013060-45 = "그~~게! 정당한 비용 청구일 리가 없잖아아앗!!"
10013060-46 = "[s] \"앗, 시즈코!\""
10013060-47 = "뭐, 뭐냐?! 네놈은?! 장사를 방해하려는 게냐!"
10013060-48 = "물론 장사라고 하는 건, 인건비나 임대료 등등. 여러 가지 요인으로 가격이 정해지는 것……. 거기에 어떤 가격을 매길지는, 제공하는 측의 마음이긴 해."
10013060-49 = "특히 이런 휴양지처럼 평소와 다른 비일상적인 곳이라면……. 좀 더 지갑이 느슨해지는 것도 어쩔 수 없는 일이고."
10013060-50 = "때문에 그걸 노리고 좀 더 높은 가격에 서비스를 제공하는 것도, 수요와 공급에 따른 자연스러운 현상이라는 것쯤은 잘 알고 있어!"
10013060-51 = "하지만 말이야. 정도라는 게 있다고!"
10013060-52 = "의자에 앉은 요금? 젓가락을 만진 비용? 잔을 건드리고, 탁자를 건드린 거에 비용을 청구하다니. 뭐야 그게?! 의미를 모르겠어!"
10013060-53 = "맞아요! 장사를 뭐라고 생각하는 건가요……! 바가지는 아웃!"
10013060-54 = "<모든 것에 대가를 요구하는 현무의 사신들>이라길래 무슨 소리인가 했더니……."
10013060-55 = "문자 그대로 모든 것에 비용을 청구하는 악덕 리조트였던 거야?!"
10013060-56 = "현무상회가 어쩌다 이렇게까지……!"
10013060-57 = "[s] \"아니아니, 저 녀석들…… 검은거북파잖아.\""
10013060-61 = "네?"
10013060-62 = "어라? 저분들은……. 현무상회가 아닌가요?"
10013060-63 = "네에?! 그랬던 건가용?!"
10013060-65 = "드, 들켰다?!"
10013060-66 = "에잇! 지원! 지원을 불러!"
10013060-74 = "이, 이게 어찌 된 거죠? 현무상회가 아니라, 검은거북파?"
10013060-75 = "[s] \"응, 하지만 검은거북파는 분명 한 번 와해되었던 걸로…….\""
10013060-80 = "갑작스러운 호출이라니, 무슨 일인 게냐."
10013060-85 = "사소한 트러블 정도는 너희끼리 해결하라고 내 몇 번이나……."
10013060-91 = "아."
10013060-92 = "어머나."
10013060-93 = "[s] \"앗.\""
10013060-98 = "………어………."
10013060-99 = "냐, 냐, 냐, 냐, 냥텐마루?!"
10013060-100 = "자, 잠깐! 어째서 네놈들이 여기에……!"
10013060-101 = "아니……. 생각해보면 이상할 것도 없나"
10013060-102 = "내가 가지고 있던 이 계약서에 쓰여 있던 이름,"
10013060-103 = "백귀야행 마츠리운영관리부를 확인한 시점에서 혹시라도 이런 상황이 일어날지도 모른다는 걸 상정하고 있긴 했었다마는!"
10013060-104 = "[s] \"여기서 뭘 하고 있는 거야……?\""
10013060-105 = "흥! 뭘 하고 있기는. 보다시피 장사 중이다."
10013060-106 = "딱히 서비스를 강매하는 것도 아니야. 장사하는데 필요한 <리조트 사용권>도 이렇게 손에 가지고 있다. 꿀릴 건 하나도 없다마는?"
10013060-107 = "[s] \"아니아니, 현무상회를 사칭하고 있었잖아.\""
10013060-108 = "커흠! 그건 어, 어디까지나 사업적인 선택의 일환으로 내 수완 능력을 발휘했을 뿐인 게다!"
10013060-109 = "망해가던 조직을 그러모아 재정비하고, 새로이 사업을 진행하는 게지! 그렇지 않느냐!"
10013060-111 = "예-썰!"
10013060-113 = "그렇게 조직을 정비해서! 대체 또 무슨 음모를 꾸미려는 건가요! 이 악당!"
10013060-114 = "흥! 음모는 무슨 그냥 좋은 기회다 싶었을 뿐이야."
10013060-115 = "<리조트 사용권>……… 이건 딱 봐도 누군가가 파놓은 함정 같은 거였겠지. 그런 것에 보기 좋게 걸려들다니. 한심하구나. 마츠리부."
10013060-116 = "!!"
10013060-117 = "봐라, 그 덕분에 이렇게 조직을 모아 리조트를 장만했다. 하하! 오히려 덕분에 내가 다시 일어설 발판을 만들게 되었으니. 고맙다고 해야 하나?"
10013060-118 = "전부 알고 있다면 이야기가 편하겠네요! 그 계약서! 돌려주세요!"
10013060-119 = "흥! 돌려 달라는 말에 넙죽 돌려줄 리가 있나!"
10013060-120 = "애당초 상황이 이렇게 된 건, 네 녀석의 실수가 아니더냐. 카와와 시즈코여!"
10013060-121 = "그건……."
10013060-122 = "딱 보아하니 돈을 벌 기회라고 생각하고, 어울리지 않게 욕심을 부린 것이겠지?"
10013060-123 = "섣부르게 명의를 빌려준 다음, 바로 이용당하는 꼴이라니. 실망이로군."
10013060-124 = "아니에요! 부장에겐 다른 생각이-!"
10013060-125 = "[s] \"시즈코는 단순히 그런 생각만으로 움직였을 아이가 아니야.\""
10013060-126 = "……선, 생님?"
10013060-128 = "흥! 말이라면 뭔들 못할까! 어차피 네놈들이 여기까지 들어온 시점에서 전부 끝났다고 생각해라!"
10013060-129 = "계약서를 가진 자는 모두가 <리조트 사냥>의 대상자!"
10013060-133 = "그렇다면 우리가 직접 리조트 사냥으로 네놈들의 모든 것을 빼앗아주마!"
10013060-135 = "모두! 조심해요!"
10013060-136 = "이즈나! 주군과 함께 싸우겠어요!"
10013060-137 = "응~ 불태울게~~"
