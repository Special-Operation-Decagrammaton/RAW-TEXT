[translation]
10019080-2 = "다섯 개의 성소, 모두 소멸 확인……!!"
10019080-3 = "하지만, 제6 성소의 에너지가 점점 더 커지고 있어……! 무슨 일이 벌어지고 있는 거야?"
10019080-4 = "모든 성소가 최후의 힘을 짜내 한 곳으로 에너지를 집중시키고 있는 것 같네요."
10019080-5 = "으응?!"
10019080-6 = "즉, 현재 상황은…… 6개의 성소의 힘이 합쳐진 <최후의 성소>…… 그런 것이 생성된 것이라고 봐야 해요."
10019080-8 = "그렇군요……. 알겠습니다."
10019080-9 = "선생님. 최후의 싸움을 준비해 주십시오."
10019080-17 = "후후후…… 그럼 슬슬 저의 비밀 무기를 꺼낼 때가 되었군요."
10019080-18 = "비밀 무기? 그런 게 있었어? 지금까지 숨겨두고 있었던 거야?"
10019080-19 = "숨겨둔 게 아니라…… 정확히는 지금 막 완성되었다고 보는 게 맞겠죠."
10019080-20 = "치 쨩, 준비는 되었나요?"
10019080-21 = "준비는 되었지만 아무것도 장담할 수는 없어."
10019080-22 = "좋아요. 늘 그렇듯이 일단 해보는 거죠. 저, 오늘의 운세도 나쁘지 않았거든요."
10019080-23 = "그 비밀 무기가 대체 뭐야?"
10019080-24 = "성소의 소재 분석을 통해서 얻어낸 정보로는……. 설명하기는 복잡한데……."
10019080-25 = "어쨌든 성소의 에너지로 물리법칙을 초월하는 현상을 제한적으로 일으킬 수 있을 것 같아……."
10019080-26 = "물리 법칙을 초월……?"
10019080-28 = "네. 간단히 말하자면……"
10019080-29 = "즉, 물질의 <거대화>예요."
10019080-34 = "흐음……. 흐으으음……."
10019080-35 = "뭔가 농담 같은 이야기지만…… 어차피 지금 이 키보토스에 발생하고 있는 사건도 농담 같은 거니까."
10019080-36 = "……그러니 자세한 건 따지지 않아 줬으면 해. 나도 사실 잘 모르겠거든."
10019080-38 = "뭐, 일종의 초현상이라고 이해하면 되지 않을까요?"
10019080-39 = "즉, 저 거대괴수를 상대할 수 있게 무언가를 <거대화>시키겠다는 거구나?"
10019080-40 = "맞아. 이론적으로는 이 <거짓된 성소>가 키보토스에 활성화되어 있는 동안 약 3분간 유지될 거야."
10019080-41 = "3분…… 생각보다 짧구나."
10019080-42 = "후후, 초현상이란 그런 거죠."
10019080-43 = "그럼, 거대화시킬 대상을 골라봐야겠네요."
10019080-44 = "흐음…… 거대 괴수와 싸워야 하니…… 탱크도 괜찮고, 헬기도 괜찮고…… 뭐든 괜찮을 듯하지만……."
10019080-45 = "[s] \"그런 거라면……!!\""
10019080-46 = "네, 선생님? 뭔가 의견이 있으신가요?"
10019080-47 = "[s] \"그거라면!! 제격인 게 있잖아!!\""
10019080-48 = "……네? 그게 뭐죠?"
10019080-55 = "핫핫핫핫핫핫!!"
10019080-56 = "무한초밥전대 카이텐져 재-등-장!!!"
10019080-57 = "그렇군! 그 역할에 제격인 게 있었어! 바로 우리다!"
10019080-58 = "푸하핫! 정말이지 이거라면 어쩔 수 없네! 제대로 해주겠어!"
10019080-59 = "그렇군요! 그런 일이라면 특별히 무급으로 서비스 해드리겠습니다!"
10019080-60 = "그럼 하는 수밖에 없겠지?"
10019080-61 = "좋아-! 그럼 그 대사를 부탁한다!! 선생!!"
10019080-63 = "[ns1] \"가라!! 무한초밥전대 카이텐 FX Mk[ruby=인피니티]. ∞!![/ruby]\"\n[ns2] \"크라켄---!!!\"\n[ns3] \"오케란파--!!\""
10019080-65 = "과연…… 0과 ∞는 동전의 양면 같은 존재, 그래서 그 이름인가요? 납득했어요."
10019080-67 = "……네? 그건 대체…… 무슨……."
10019080-68 = "[s] \"……이 타이밍엔 역시 이 대사랄까…… 그냥 외쳐보고 싶었달까…….\""
10019080-70 = "……네? 그건 대체…… 무슨……."
10019080-71 = "[s] \"……이 타이밍엔 역시 이 대사랄까…… 그냥 외쳐보고 싶었달까…….\""
10019080-72 = "으음……."
10019080-73 = "그런데 괜찮은 거야? 이런 전개……."
10019080-74 = "[s] \"멋있으니까 괜찮아.\""
10019080-79 = "저것은……!!"
10019080-80 = "저번에 애니메이션으로 봤던 그 장면이야, 히후미!"
10019080-81 = "뭐, 뭔가요……. 이건?!"
10019080-83 = "간다……!! 무한초밥전대 카이텐져의 궁극의 슈퍼로봇……!!"
10019080-88 = "카이텐 FX Mk[ruby=인피니티]. ∞ [/ruby]출동!!"
10019080-101 = "우, 우와아아아아아아-!!?"
10019080-102 = "굉장해-!! 초밥로봇!"
10019080-104 = "후후후…… 이건 진짜 도무지 종잡을 수 없네요. 뭐가 뭔지……."
10019080-105 = "즉, 결론은 아무튼 와장창★ 이라는 거잖아요? 알기 쉬워서 좋은데요."
