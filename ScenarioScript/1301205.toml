[translation]
1301205-1 = "더블 타겟"
1301205-2 = "발키리 경찰학교 실내 사격장"
1301205-8 = "이상하네요, 그렇게 먼 거리도 아닌데 계속 표적을 빗나가다니……."
1301205-9 = "호흡이 거친 것도 아니고, 팔 힘이 부족한 것도 아닌데."
1301205-10 = "이상하게도 방아쇠만 당기면 조준점이 흐트러지는지, 생각한 곳과 다른 방향으로 탄환이 날아갑니다."
1301205-11 = "[s] \"가늠자가 잘못 설정된 것 아닐까?\""
1301205-12 = "네? 하지만 총기 정비는 매일 아침마다 성실히 하고 있는걸요?"
1301205-13 = "가늠자에 문제가 생겼더라면 본관이 바로 알아차렸을 겁니다."
1301205-14 = "……하지만 총기는 워낙 예민한 장비니, 그 가능성도 놓칠 수는 없겠네요."
1301205-15 = "그럼, 우선 가볍게 영점 사격부터 해보겠습니다!"
1301205-25 = "(사격이 끝나고 사로에서 표적지가 돌아왔다.)"
1301205-30 = "[ns] \"………….\""
1301205-31 = "…………."
1301205-32 = "여, 역시 조준점이 잘못 설정되어 있었던 모양이네요!"
1301205-33 = "총알이 이렇게 인질 방향으로만 정확히 날아갈 리가 없으니까요! 하하하……."
1301205-34 = "[s] \"가늠자를 수정하고 다시 쏴 보자.\""
1301205-35 = "네, 그럼 조준점을 수정한 뒤에 다시 사격하겠습니다."
1301205-37 = "가늠자를 오른쪽으로 3클릭, 위쪽으로 3클릭……."
1301205-47 = "(사격이 끝나고 사로에서 표적지가 돌아왔다.)"
1301205-52 = "[ns] \"………….\""
1301205-53 = "…………."
1301205-54 = "이, 이상하네요. 분명 범인의 머리를 정확히 조준하고 방아쇠를 당겼는데……."
1301205-55 = "[s] \"정말로 범인을 조준한 거 맞아?\""
1301205-56 = "무, 물론입니다!"
1301205-57 = "서, 설마 선생님께서는 본관이 고의로 인질을 맞추었다고 생각하시는 겁니까?"
1301205-58 = "발키리 경찰 학교의 학생이 고의로 시민에게 위해를 끼칠 리가 없잖습니까!"
1301205-59 = "물론 결과적으로 총알은 인질에게 날아가긴 했지만……"
1301205-60 = "여하튼! 이건 모두 가늠자가 고장 났기 때문에 생긴 일입니다!"
1301205-61 = "[s] \"키리노.\""
1301205-62 = "네?"
1301205-63 = "[s] \"아예 처음부터 인질을 조준하고 쏘면 어떨까?\""
1301205-65 = "네? 범인이 아니라 인질에게 총구를 조준하라고요?"
1301205-66 = "아무리 가상의 인질이라지만 선량한 시민을 향해 총구를 겨누는 일은 할 수 없습니다!"
1301205-67 = "경찰의 긍지가 허락지 않아요!"
1301205-68 = "[s] \"어차피 범인을 노려도 인질에게 날아가잖아.\""
1301205-69 = "그, 그건 그렇지만……."
1301205-71 = "……인질로 잡힌 시민 씨, 죄송합니다!"
1301205-82 = "[ns] \"………….\""
1301205-83 = "…………."
1301205-84 = "[s] \"앞으로는 범인 대신 인질을 조준하면 되겠네.\""
1301205-85 = "그, 그럴 수는 없습니다! 인질을 향해 고의로 총을 겨누는 경찰이라니요!"
1301205-86 = "방금은 분명 착오가 있었을 겁니다. 이번에야 말로 가늠자를 제대로 수정하면……."
1301205-87 = "다시 한번 사격 개시입니다!"
1301205-89 = "(이후, 키리노는 계속해서 범인을 향해 방아쇠를 당겼지만, 총알은 어김없이 인질에게 날아가 박혔다…….)"
1301205-90 = "으앙, 어째서…… 어째서……!"
1301205-91 = "(후일, 결국 키리노는 울며 겨자 먹기로 인질을 조준하여 사격 시험을 통과했다고 한다…….)"
