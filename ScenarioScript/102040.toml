[translation]
102040-1 = "제4화;작전 준비 2"
102040-4 = "이건……."
102040-5 = "하, 하늘이 빨갛게…… 무, 무슨 일이 벌어지고 있는 걸까요……."
102040-6 = "……. 샬레의 선생님이 문자를 보내왔어. 도움이 필요한가 봐."
102040-7 = "그, 그치만 저희가 도움이 될 수 있을까요……. 쫓기는 신세인데…… 오히려 선생님께 폐만 끼치게 될 수도……."
102040-8 = "응, 그건 아닐 거야. 어떻게든 도울 수 있는 방법을 찾아봐야지."
102040-9 = "하지만…… 우리 같은 사람들이 도울 수 있는 일……."
102040-14 = "……거기, 누구냐?"
102040-15 = "서, 설마 추격자?!"
102040-16 = "……."
102040-23 = "……."
102040-25 = "?!"
102040-26 = "……."
102040-27 = "……."
102040-30 = "겨우 찾았어. 여기 있었구나, 다들……."
102040-39 = "네?! 미사키 씨 갑자기 권총을?!"
102040-40 = "뭐야, 너는."
102040-41 = "응. 수상해. 수상해."
102040-42 = "자, 잠깐 기다려?! 나, 나는……."
102040-43 = "아, 헬멧…… 이건 아르바이트 때문에……."
102040-47 = "좋은 아침, 삿 쨩. 자아 찾기는 잠깐 쉬기로 한 거야?"
102040-52 = "으, 으응…… 그건……."
102040-54 = "자아찾기는 무슨. 그냥 가출이지."
102040-55 = "리더……."
102040-56 = "……. 미안. 인사를 나누고 싶지만 시간이 없어. 선생님에게 우리의 도움이 필요해."
102040-57 = "응. 우리도 연락받았어."
102040-58 = "네, 네! 맞아요!"
102040-62 = "건강해 보이니 다행이야. 리더."
102040-64 = "……. 응."
102040-65 = "그러면, 움직여야겠네."
102040-69 = "제4 성소 작전 담당을 맡은 우라와 하나코입니다♡"
102040-70 = "모두들, 준비는 되셨나요?"
102040-72 = "……네. 시스터후드 부대, 성소가 위치한 카타콤의 입구 앞에 대기중입니다."
102040-73 = "그런데, 사쿠라코 님…… 아까부터 안 보이시던데. 어딜 가셨지……."
102040-75 = "기사단, 작전 지역에서 대기중."
102040-76 = "자, 잘 부탁드립니다!"
102040-78 = "제5 성소는 어떤가요? 현재 상황 보고 부탁드립니다."
102040-80 = "……이쪽은 문제가 생겼어. 노아."
102040-81 = "어머? 문제요? 무슨 문제죠?"
102040-82 = "<호드>는 요새도시의 지하로 숨어들었어. 지금 위치를 찾는 중인데……."
102040-83 = "문제는 요새도시의 에리두 지하는 리오 회장이 만들어낸 암호체계로 보호받고 있다는 겁니다. 도청도, 진동이나 소음 감지도 모두 불가능해요."
102040-85 = "……리오 회장의? 그치만 회장은 지금 행방불명인데……."
102040-87 = "맞아. 그래서 지금 회장의 암호체계를 뚫기 위해 연산을 진행 중이야."
102040-88 = "순수하게 단순 계산이라 난이도가 높은 건 아니지만…… 문제는 시간이 더 필요하다는 거야. 장비도, 인력도."
102040-89 = "하아…… 이대로라면 작전 시작 시각까지 맞출 수 없을지도……."
102040-90 = "뭐? 그럼 큰일이잖아? 게다가 이쪽은 성소 분석도 겸하고 있단 말야. 도와주고 싶어도……."
102040-91 = "마키 쨩은 계획대로 제1 성소에 집중해 주세요. 엔지니어부 쪽은 어때요? 여유가 있나요?"
102040-93 = "아니, 우리는 지금 각 지역에 세워진 호드의 침식 타워를 부수는 방법을 찾고 있는 중인데…… 이쪽도 난항이야."
102040-94 = "하아…… 답이 안 보여……. 접근이 불가능해……."
102040-95 = "여기는 성소의 소재 분석까지 같이 진행하고 있어. 슬슬 체력도 한계이고…… 여기서 일을 하나 더 받는 건 불가능해."
102040-96 = "수면이 부족해요……. 아니, 카페인이…… 요괴 MAX가……."
102040-97 = "역시 평소에 운동을 좀 더 해둘걸……."
102040-98 = "지금 와서 반성해봤자 소용없지만……."
102040-100 = "끄응…… 저쪽도 여력이 없는 상태이고…… 곤란하네요."
102040-101 = "역시 빅 시스터. 존재 자체가 방해네요."
102040-103 = "히마리!"
102040-104 = "그런데 예전에 밀레니엄 채권이 엄청 위조된 적이 있지 않았나요?"
102040-105 = "채권 발행의 보안 시스템도 리오가 구축한 건데 그땐 어떻게 한 거죠?"
102040-106 = "응? 그거 히마리가 한 거 아니었어? 우리는 화이트 해커로서의 윤리에 어긋나는 짓은 하지 않아."
102040-107 = "어머? 저도 아니에요. 그땐 바쁜 일이 있어서 그런 장난을 칠 여유가 없었거든요."
102040-108 = "……그럼 누구의 짓이야, 그건?"
102040-113 = "……유우카 쨩, 들었어요?"
102040-114 = "하아. 들었어! 정말이지 어쩔 수 없네."
102040-115 = "노아, 지금 바로 반성실 앞에서 만나!"
102040-116 = "네, 알겠어요, 지금 갈게요."
102040-122 = "부장…… 호드의 침식 타워의 공략법은…… 이게 최선인 것 같아."
102040-123 = "……. 침식 타워 주변으로 대규모의 구멍을 파서 지면에서 분리시킨 뒤 불태운다……?"
102040-124 = "정말 이 방법뿐이야?"
102040-125 = "좀 더 심플한 방법을 찾고 싶었지만……. 지금으로선 이것 밖에……."
102040-126 = "이런 토목 공사를 이 정도의 규모로 수행해야 한다니, 거의 도시 개발급인데……."
102040-127 = "으음…… 방법이 없을까…… 토목 공사용 드론을 지금부터 만든다면……."
102040-128 = "천둥이에게 화염방사기를 다는 건 어떨까요? 삽이랑 해머랑……."
102040-129 = "으음. 아무리 그래도 그것만으로는 좀……."
102040-135 = "안녕~ 친구들! 오늘도 개발하기 좋은 날이지?"
102040-139 = "어, 어라?! 누, 누구세요?!"
102040-140 = "응. 온천개발부야."
102040-142 = "……온천,"
102040-143 = "개발부……?!"
102040-144 = "오, 온천이라뇨? 여긴 그런 건……."
102040-146 = "와핫핫핫! 온천이 있는 곳엔 우리가 있다! 아니, 설사! 온천이 없다고 하더라도 우리가 있다!"
102040-148 = "그런 거니까 사소한 건 신경 쓰지 말라구. 그 부분은 우리가 맡을 테니까."
102040-150 = "응……?"
102040-154 = "지하의 지하까지 땅을 파고, 건물을 철거하고, 무엇이든 불태운다! 이것이 바로 온천개발부의 개발지상주의!"
102040-155 = "그러다가 결국 마지막에 온천에 도달하기만 하면 되는 거거든! 복잡하게 생각할 거 없어!"
102040-156 = "게다가 밀레니엄의 지하에는 어떤 온천이 숨겨져 있을지 계속 궁금했거든. 그러니까 좋은 기회인 거지!"
102040-158 = "하하하하하하핫-!!"
102040-163 = "뭐, 뭔가 엄청난 분들이 등장한 것 같은데요……."
102040-165 = "밀레니엄 반성실 앞"
102040-166 = "하아……."
102040-177 = "으잉? 으에엥? 서, 선배들?!"
102040-178 = "코드네임 <백토>, 아니, 쿠로사키 코유키. 나와. 석방이야."
102040-179 = "코유키 쨩~ 잘 지냈어요?"
102040-180 = "네?! 저요? 석방요? 지금요? 왜요?"
102040-181 = "시간 없어. 빨리 나와, 코유키."
102040-182 = "시, 싫어요! 갑자기 석방? 선배들 두 명이 찾아와서 석방이라니, 이 상황은 그거잖아요! 그거!"
102040-183 = "드디어 절 교정국에 집어넣으려는 거잖아요! 그렇죠? 맞죠? 정답이죠?"
102040-184 = "……."
102040-185 = "……."
102040-186 = "하아. 강제로 끌고 가야겠어. 도와줘, 노아."
102040-187 = "후후, 어쩔 수 없네요."
102040-193 = "네?! 으어? 오, 오지 마요! 선배들 무서워! 들어오지 마요!"
102040-196 = "뭐, 뭔가요! 얌전히 있었잖아요! 그동안 말썽도 안 일으키고, 탈출도 안 했는데! 어째서! 왜! 너무해! 폭력 반대! 억울해! 억울해!!"
102040-197 = "무, 무슨 소리야! 애초에 네가 여기 있는 건 네가 저지른 일 때문이잖아! 억울하다니, 대체 어디가?!"
102040-198 = "자아, 유우카 쨩. 코유키 쨩도 반성하고 있는 것 같으니까……. 여기서는 대화로 풀어보죠."
102040-199 = "반성!? 이게 어딜 봐서 반성하는 녀석의 모습이야?"
102040-200 = "맞아요! 반성이라뇨!? 그러면 마치 제가 잘못한 것 같잖아요!?"
102040-201 = "그건 어디까지나 불가항력이랄까…… 사고 같은 거랄까……."
102040-202 = "뭐? 채권을 위조한 게 사고라고?!"
102040-203 = "거, 거기다가 엄청 무서운 C&C 선배들을 시켜서 절 억지로 끌고 왔잖아요……! 그 부분은 오히려 내가 피해자랄까…… 그런 기분이 든달까……."
102040-205 = "……."
102040-206 = "……그렇죠? 코유키 쨩? 반성하고 있는 거 맞죠?"
102040-207 = "……예, 예? 아, 아니. 그러니까 이건…… 애, 애초부터 허술한 암호체계가 잘못한 거 아닐까요……? 그, 그러니까……."
102040-208 = "코~유~키~쨩?"
102040-209 = "아니, 그…… 으음…… 그……."
102040-210 = "서, 선배 그…… 진짜 무서우니까 그 얼굴 안 해주시면 안 될까요……."
102040-211 = "선배 말씀대로 이번 건 제가 잘못했으니……."
102040-212 = "반성은?"
102040-213 = "네, 네. 잘못했습니다. 반성하고 있습니다……."
102040-214 = "후후. 착하기도 해라."
102040-215 = "봐요, 유우카 쨩. 코유키 쨩도 스스로 잘못했다고 말하잖아요. 그쵸?"
102040-216 = "왜 노아한테만 고분고분해지는 건데!?"
102040-217 = "그치만 노아 선배는…… 가끔 진짜 좀 무섭달까…… 꿈에 나올 것 같을 때가 있달까……."
102040-218 = "몇 년도 더 지난 일을 날짜와 시간까지 말해가며 \"코유키 쨩? 그때랑 한 말이 다르지 않아요?\" 같은 식으로 몰아붙이거나 할 때는 정말 좀……."
102040-219 = "그런데 진짜 무슨 일인가요? 갑자기 선배 둘이 찾아오다니……."
102040-220 = "코유키 쨩의 도움이 필요해요."
102040-221 = "맞아. 너의 그 불가사의한 연산 능력이 필요해. 지금 당장 세미나로 복귀하도록 해."
102040-222 = "네?! 지금요? 세미나로요? 저 잘린 거 아니었나요……?"
102040-223 = "이제 아니야. 얼른 서둘러. 설명은 가면서 할 테니까."
102040-224 = "네. 코유키 쨩의 교복도 가져왔으니까 지금 갈아입도록 해요."
102040-225 = "그, 그치만……. 이 옷, 꽤 마음에 드는 건데……."
102040-227 = "코~유~키~쨩?"
102040-228 = "히, 히이잉……. 네……."
102040-232 = "그럼 마지막으로 남은 건…… D.U. 중앙 지구의 제6 성소입니다."
102040-233 = "어~이. 거긴 어때?"
102040-235 = "D.U. 중앙 지구"
102040-236 = "시민들의 대피는 모두 완료했다. 지금은 생텀 타워에서 30km 떨어진 곳에 대피소를 다수 만들어 두었지."
102040-237 = "하지만 인력이 부족한 상황이다. 식량도 부족하고…… 뭐, 발키리의 학생들과 자원봉사자들이 사람들을 도와주고 있긴 하지만."
102040-239 = "자아, 이걸 드셔보세요. 후우카 선배가 만든 죽인데, 몸이 따뜻해질 거예요."
102040-240 = "고맙습니다……."
102040-244 = "주리, 이 국도 다 됐으니까 사람들에게 나눠줄래?"
102040-245 = "네! 선배!"
102040-246 = "후우……. 자, 그럼 다음은……."
102040-247 = "제가 도와드릴까요, 선배?"
102040-248 = "괜찮아. 소수정예로 대규모의 식사를 만드는 건 이골이 났으니까. 주리는 지금처럼 사람들에게 나눠주는 걸 부탁할게."
102040-249 = "네, 선배! 확실히 이 대피소는 저희 급양부의 도움이 꼭 필요한 곳 같아요!"
102040-250 = "도움이 될 수 있다면 다행이야."
102040-251 = "하지만…… 이대로라면 재료가 부족할지도……."
102040-256 = "어머나?"
102040-257 = "뭐야?! 무슨 일이야?!"
102040-264 = "후후후. 후우카 씨, 저희가 왔습니다."
102040-265 = "드디어 도착했어요★"
102040-266 = "미식연구회?! 너희가 여기 왜?! 게다가 그렇게 잔뜩 젖어서는……?!"
102040-267 = "좋은 일을 하고 있다길래 도와주러 왔지! 자, 봐봐!"
102040-268 = "맞아! 요리 재료를 가져왔다고!"
102040-273 = "어머나…… 신선해 보이는 생선이 이렇게나 잔뜩……."
102040-274 = "이거라면 재료가 부족할 일은 없을 거 같아요, 선배!"
102040-275 = "그, 그러게……. 이걸로 국이나 튀김을 하고…… 구이도 하면……. 어떻게든 될 거 같아. 영양 밸런스도 나쁘지 않고!"
102040-276 = "애초에 우리 급양부 트럭을 왜 너희가 타고 다니는 건지는 일단 넘어가도……."
102040-277 = "그래도 생선을 이 정도나 모으는 건 힘들었을 텐데……."
102040-279 = "맞아! 엄청 힘들었다구! 근처의 아쿠아리움은 전부 털어서 먹을 수 있는 생선을……"
102040-283 = "으읍!?"
102040-284 = "뭐, 사소한 건 신경 쓰지 않아도 되잖아?"
102040-286 = "후후후. 그렇습니다. 저희와 급양부의 사이잖아요? 힘들 땐 도와야죠."
102040-287 = "아니, 모르겠거든…… 그런 사이……."
102040-288 = "……뭐, 그치만 확실히 도움이 되었어. 고마워, 미식연구회. 신세를 졌어."
102040-290 = "후후후. 천만에요."
102040-291 = "뭐어, 우리도 할 땐 하거든. 그런 거지."
102040-292 = "아아. 정말이지 여자아이들의 우정이란~★"
102040-293 = "그런데 이 생선은 언제 먹을 수 있는 거야?"
102040-295 = "지금의 시라토리구는 사람들이 한 명도 남아있지 않은 무인지대다. 마음껏 날뛰도록."
102040-296 = "감사합니다…… 제6 성소의 수호자는 아직 포착되지 않았지만…… 6개의 성소 중에 가장 강력한 에너지가 포착되었기에……."
102040-297 = "그래서 수호자가 나타나면 대피가 완료된 지구로 유인해서, 거기서 작전을 진행할 거야."
102040-299 = "우리는 D.U.의 외곽 도로를 순회하며 수호자를 찾아내는 정찰의 역할이야. 히후미."
102040-300 = "아우우…… 어째서…… 저희가……."
102040-301 = "그건 히후미의 탱크 운전 실력이 대단하기 때문이잖아. 그리고 히후미를 지키는 건 나 혼자로도 충분하고."
102040-302 = "그때는 정의실현부 30명을 해치우는데 그쳤지만, 지금이라면 그 두 배도 문제없을 거야."
102040-303 = "그, 그건 해치운 게 아니라 어쩌다 보니……. 아우우."
102040-304 = "……오늘은 페로로 님이 나오는 특촬 영화를 볼 계획이었는데……."
102040-306 = "응…… 그건 나도 기대하고 있었지만……"
102040-307 = "이 작전을 다 끝내고 같이 보자. 히후미."
102040-308 = "……."
102040-309 = "네…… 알겠어요. 아즈사 쨩, 이 임무, 최선을 다해 봐요."
102040-310 = "응."
102040-312 = "냐하하~ 이쪽도 드디어 준비 끝이랄까~"
102040-313 = "[s] \"니야! 어떻게 됐어?\""
102040-314 = "자아, 자아. 카호 부탁해."
102040-315 = "하아……. 네. 여러분. 준비는 되셨나요?"
102040-319 = "네!! 이즈나! 주군의 명을 받들어, 특별 임무를 수행하기 위해 도착했습니다!"
102040-320 = "도, 도착했……."
102040-321 = "흐, 흠흠. 인법연구부의 부장, 치도리 미치루! 이곳에서 화려하게 닌자의 참전을 선언하리니!"
102040-322 = "화, 화려하게에……. 서, 선언하……."
102040-323 = "[s] \"인법연구부……?!\""
102040-324 = "츠쿠요! 인법연구부의 참전을 알리는 중요한 장면이잖아! 좀 더 존재감을 드러내지 않으면 안 된다고!"
102040-325 = "네? 그, 그런가요……? 제 존재감은 지금도 너무 큰 것 같지만……."
102040-326 = "으음~ 이대로는 부족해!"
102040-327 = "안 되겠다! 츠쿠요! 이즈나!"
102040-328 = "네! 부장!"
102040-329 = "네, 네?!"
102040-330 = "닌자 하이퍼 합체다!"
102040-331 = "네?! 여, 여기서요?! 합체요?!"
102040-332 = "과연, 부장! 여기서는 과감하게 돌격하는 거군요! 이즈나, 이해했습니다!"
102040-333 = "……."
102040-334 = "냐하하하하핫- 나왔다, 나왔어- 그 명물 합체씬이~!"
102040-339 = "닌자란 무엇인가! 나아가 닌자가 사용하는 인법이란 무엇인가!"
102040-340 = "무, 무엇인가!"
102040-341 = "……저, 저기 정말 괜찮은 건가요?"
102040-345 = "괜찮아!! 그 본질을 연구하고 탐구하고, 또한 궁구하는……."
102040-346 = "이게 맞으니까 자신을 믿어! 츠쿠요!"
102040-347 = "무릇 닌자의 매력을 널리 알리기 위해 활동하는, 귀엽고 아리따운 소녀 우리 삼인방!"
102040-348 = "삼인방이에요~!! 닌닌!"
102040-352 = "우는 아이도 듣고 나면 방긋 웃게 된다는,"
102040-353 = "백귀야행 학원-! 최강의 닌자 동아리!"
102040-355 = "이름하여어어!! <인법연구부>!!"
102040-361 = "……."
102040-362 = "(짝짝짝짝) 냐하하하하! 과연, 정말이지 최고야. 냐하하항, 역시 닌자들이 정답이었달까~ 틀리지 않았달까."
102040-363 = "[s] \"저기…… 이건 대체……?\""
102040-364 = "그러게요. 이즈나, 뭔가 주군이 우리에게 부탁할 게 있다고 해서 왔는데…… 저희는 뭘 하면 되는 거죠?"
102040-365 = "그러게. 우리만이 할 수 있는 일이라더니, 무슨 임무라는 거야?"
102040-366 = "엣~헴. 흠흠. ……인법연구부는 지금부터 별동대로서 특별 임무를 수행해 주었으면 해요."
102040-367 = "특별 임무……?"
102040-369 = "……네. 지금부터 백귀야행 최북단에 있는 대설원으로 가주셨으면 합니다."
102040-371 = "네? 대설원이요?"
102040-372 = "뭐……?! 거긴 눈밖에 없는 곳이잖아?! 거긴 왜……?!"
102040-374 = "거기서 모습을 감춘 <백화요란>의 부장을 찾아줬으면 합니다."
102040-375 = "네? 백화요란? 부장?"
102040-376 = "분쟁조정위원회 백화요란을요……? 그건, 동아리실에 가면 되, 되지 않을지……."
102040-377 = "그건……."
102040-378 = "……! 그러고 보면 최근, 백화요란 녀석들의 얼굴을 본 적이 없긴 했었지."
102040-379 = "뭔가, 말하기 곤란한 사정이 있는 거지? 카호."
102040-380 = "……네. 말씀하신 대로예요."
102040-381 = "아니, 하지만 그래도 사람을 찾는 임무라면…… 딱히 우리가 아니어도 되잖아? 왜 하필 우리가……."
102040-383 = "흐응. 그건 말이죠~ 백화요란의 모습을 기억하고 있는 3학년 중에는 믿을만한 인물이 바로 인법연구부의 미치룽룽 씨 밖에 없기 때문이려나~요?"
102040-384 = "우냐앗! 누가 미치룽룽이란 거야?!"
102040-385 = "오오, 부장은 백화요란을 본 적이 있나요?"
102040-386 = "으, 으응. 스쳐 지나가듯 몇 번…… 그치만 나도 제대로 기억하는 건 없는데……."
102040-387 = "냐하하. 그것만으로도 충분하답니다."
102040-389 = "(저 너구리가 또 뭘 꾸미고 있는 거지……?)"
102040-391 = "그렇군요! 이해했습니다! <쿠즈노하>라는 분의 행방을 찾아내는 것이 우리의 임무이군요!"
102040-392 = "그 사람을 알고 있는 게 백화요란의 부장이라는 거지…… 끄응. 알겠어. 우리가 해볼게."
102040-393 = "부장! 백화요란은 어떤가요? 엄청 강한가요? 닌자만큼 멋진가요?"
102040-394 = "백화요란은 예전부터 엘리트들만 가입하는 동아리였으니까……"
102040-395 = "부, 분쟁조정위원회 백화요란……. 소문은 들어봤지만……."
102040-396 = "하지만, 닌자를 능가할 순 없지! 마지막에 서 있는 건 언제나 닌자니까!!"
102040-397 = "과연! 그렇군요! 역시 닌자예요!"
102040-398 = "[s1] \"이즈나, 츠쿠요. 미치루. 부탁할게. 중요한 임무야.\"\n[s2] \"그 사람을 찾으면 <샬레>에 연락을 해달라고 전해줘.\""
102040-399 = "네! 알겠습니다!"
102040-400 = "네! 알겠습니다!"
102040-401 = "알겠어…… 선생 공에겐 이것저것 신세도 많이 졌으니……."
102040-402 = "네, 네에…… 히, 힘낼게요……."
102040-406 = "이런 미증유의 위기가 발생했을 때, 백화요란이 취할 행동은 정해져 있달까…… 추리할 수 있달까……."
102040-407 = "특히 백화요란의 부장이라면…… 대설원에 있는 <황혼의 사원>으로 향했을 거예요."
102040-408 = "제 정보망을 총동원해서 추리해 본 결과, 거기가 아마도, 거의 확실하게! 백화요란의 부장이 쿠즈노하와 만나는 장소인 것 같으니까!"
102040-409 = "그러니 거기로 가면 부장을 만날 수 있는 거죠. 냐하하하하~"
102040-410 = "……. 지금은 니야 님의 추리가 맞길 바라는 수밖엔 없겠네요……."
102040-411 = "앗, 카호. 너무해, 나름 확신을 가진 결론이었는데~!"
102040-412 = "다행히 대설원에는 <거짓된 성소>의 영향이 크지 않은 걸로 확인되어서 큰 위험은 없을 것 같지만……."
102040-413 = "하지만 지금 키보토스에서 벌어지고 있는 이 미증유의 사태를 섣불리 추측하는 건 위험한 행동이죠."
102040-414 = "……그러니 부디 조심해 주세요."
102040-415 = "카호의 말이 맞아. 거기 사원에 없으면 바로 돌아오시길. 상황이 상황이니만큼."
102040-416 = "아, 그리고 이 임무는 모쪼록 비밀로 해주셨으면 한답니다~"
102040-418 = "……네. 아직은 알려져선 안 될 부분들이 꽤 있기에……."
102040-420 = "뭐. 알겠어. 이 장소에 사람이 없으면 바로 복귀할게. 그럼 되지?"
102040-421 = "무, 무슨 일이 있으면 연락드릴 테니까……. 잘 부탁드립니다."
102040-422 = "그럼 백화요란의 부장을 찾아서, 인법연구부, 대설원으로 출동하겠습니다!"
102040-426 = "자아, 그럼 우리도 소식을 기다려보자고."
102040-427 = "……."
102040-429 = "……킥킥킥. 과연."
102040-431 = "중요한 정보를 들었군. 인법연구부가 말이지……."
102040-432 = "이로하! 이로하, 어디 있나! 그것을 준비해라!"
102040-433 = "네? 뭘 준비하라는 건가요? 그건 그렇고 우리는 샬레를 도우러 가지 않아도 되나요?"
102040-434 = "……킥킥킥. 그건 걱정하지 마라. 이로하. 모든 것은 다 준비되고 있으니까."
102040-435 = "네? 또 무슨 소릴……."
102040-437 = "킥킥킥……. 그래. 이건 좋은 기회라는 거다. 절대 놓칠 수 없지."
