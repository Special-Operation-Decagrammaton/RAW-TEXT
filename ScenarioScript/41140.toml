[translation]
41140-1 = "제14화;물물교환"
41140-2 = "모에, 지금의 보급 문제를 해결할 좋은 방법이라도 있는 건가요?"
41140-3 = "하지만 지금의 우리에겐 보급품을 살 돈은커녕, 돈을 입금할 수 있는 계좌조차도 없는걸……."
41140-4 = "……해결책이라니. 불꽃놀이를 하느라 1개 포대의 탄약을 앞뒤 생각도 없이 통째로 날려 먹은 사람이 할 소리야?"
41140-6 = "날려 먹다니! 다시 말하지만 그때의 불꽃놀이는 중대 사항이었거든?"
41140-7 = "여하튼! 돈이 없어도 보급품을 구할 방법은 충분히 있어."
41140-8 = "[s] \"설마 은행을 털…….\""
41140-9 = "무슨 흉흉한 소리를 하는 거야?"
41140-10 = "시민의 안전을 지켜야 할 SRT 대원들이 은행을 털다니, 있을 수 없는 일입니다."
41140-11 = "그런 정신 나간 방법을 제안할 리가 없잖아."
41140-12 = "내가 말하려고 했던 방법은……"
41140-14 = "바로 물물교환이야!"
41140-15 = "물물교환은 인류의 가장 고전적인 거래 방식이라고도 하잖아?"
41140-16 = "그러니까 우리가 갖고 있는 귀한 물건을 건네주고, 대금으로 멀쩡한 무기와 탄약을 받아오는 거야!"
41140-18 = "저희가 갖고 있는 귀한 물건이라면……"
41140-19 = "……유통기한 지난 야키니쿠 도시락?"
41140-20 = "……그걸 누가 사 간다고 팔아? <소확행>?"
41140-21 = "내가 교환하려고 하는 물건은 캠프 외곽에 방치된 대량의 미사일과 폭탄들이야."
41140-22 = "비록 비를 맞아 못 쓰게 되었다지만, 자식 같은 폭탄들을 팔아치우려니 마음속으로는 피눈물이 나지만……."
41140-23 = "못 쓰는 상태로 저렇게 내버려 두느니, 차라리 좋은 주인을 찾아주어서 좋은 곳에서 폭발시키는 게 좋겠다는 생각도 들어서."
41140-24 = "[s] \"역시 폭발시키는 게 목적이구나……\""
41140-26 = "하지만 아무리 비싼 미사일과 폭탄이라 해도 대부분이 고장 나고 녹이 슬었는데, 그걸 제값에 사줄 사람이 있을까요?"
41140-27 = "그건 걱정하지 마. 내게는 오랜 보급계원 업무를 통해 쌓은 인맥이 있으니까."
41140-28 = "예를 들자면……"
41140-29 = "블랙마켓을 통해 무기를 주로 거래하는 카이저 그룹의 자회사, <카이저 인더스트리>에는 중고 무기를 구입하고 싶어 하는 가난한 용병들의 연락이 끊이질 않지."
41140-30 = "그 <카이저 인더스트리>라면 필요한 사람들에게 이 녹슨 미사일들을 판매할 수 있을 거야."
41140-31 = "그리고 그 대가로 카이저 그룹에서 생산하는 괜찮은 품질의 무기를 공급받을 수도 있고!"
41140-32 = "오오, 모에답지 않은 똑똑한 발상인데."
41140-33 = "어제 먹은 나폴리탄 도시락에 무슨 문제라도 있었던 거 아니야?"
41140-34 = "시끄러워. 폭파시켜버린다!"
41140-38 = "자, 그럼 어서 영업소에 전화를 걸어볼까?"
41140-45 = "네. 언제나 최고 품질의 화기를 공급해드리는 <카이저 인더스트리>입니다. 무엇을 도와드릴까요?"
41140-46 = "아, 오랜만이야!"
41140-47 = "나야, 나. 저번에 연락했던 그 SRT 학원의 보급 담당인데……."
41140-48 = "앗…… 그때의 VVIP 고객님이시군요!"
41140-49 = "다시 모시게 되어 정말 영광입니다!"
41140-50 = "혹시 이번에도 새로운 미사일을 구입하시려는 건가요?"
41140-51 = "아니면 설마 지난번에 구입해가신 클러스터 폭탄에 뭔가 문제라도……?"
41140-52 = "……모에. 언제 그런 걸 구매한 거죠?"
41140-53 = "고, 공금으로 구매한 거 아니거든?"
41140-54 = "그 폭탄은 사비로 구입한 물건이라고! 지극히 사적인 목적으로 구입한 거야!"
41140-55 = "[s] \"사적인 목적의 폭탄이 더 수상한데…….\""
41140-56 = "여하튼 오늘은 무언가를 구매하고 싶어서 연락한 게 아니야."
41140-57 = "무기를 팔고 싶어."
41140-58 = "판매요? 저희 영업소에서는 매입은 보통 하고 있지 않습니다만……."
41140-59 = "하지만 VVIP님의 의뢰니, 일단 어떤 물건을 팔고자 하시는지 들어볼 수 있을까요?"
41140-60 = "들으면 깜짝 놀랄걸? 총포상이나 편의점에서도 구하기 힘든 고급 무기가 잔뜩 있다고."
41140-61 = "……적외선 영상 유도식 대공 미사일이랑 위력 조절용 집속 수류탄, 원격 발사가 가능한 대전차 로켓……"
41140-62 = "정말이십니까? 그런 구하기 힘든 장비들을 저희에게 파시겠다고요?"
41140-63 = "응. 물론 습기 때문에 조금 녹슨 부분이 있기는 하지만……."
41140-64 = "[s] \"조금이 아니잖아.\""
41140-65 = "(시끄러워, 선생님! 거래를 방해하지 말라고!)"
41140-66 = "그런 특수 장비의 매매라면 언제나 수요가 있으니 거절할 이유가 없지요."
41140-67 = "좋습니다. 거래를 받아들이도록 하겠습니다."
41140-68 = "그럼 대금은 어떻게 처리해 드리면 좋을까요? 지난번의 계좌로 이체해 드리면 될까요?"
41140-69 = "그게…… 그 계좌는 지금 사정이 있어서 사용할 수가 없어서……."
41140-70 = "대신 대금을 무기와 탄약으로 대신 받을 수 없을까?"
41140-71 = "……무기요?"
41140-72 = "응응. 조금 가격은 싸더라도 위력은 괜찮은 무기들이 있잖아."
41140-73 = "발사관에 끼울 수 있는 열압력탄이라든가, 백린 연막탄이라든가……! 하아, 하아……."
41140-77 = "저…… 대단히 죄송합니다만, 지금 당사에서 보유하고 있는 무기의 재고가 마침 다 떨어져서요."
41140-78 = "뭐어? 그 많은 무기가 전부 팔려버렸다고?"
41140-79 = "예. 며칠 전에 익명의 고객님이 저희가 보유하고 있는 무기를 전부 구입해 가셨습니다."
41140-80 = "누가 그 많은 무기를 전부 구입했는데?"
41140-81 = "그 사람은 키보토스 내에서 전쟁이라도 치를 셈이래?"
41140-82 = "그건…… 기업 비밀입니다."
41140-83 = "VVIP님께서도 저희가 귀하의 구매 기록을 여기저기에 누출시킨다면 곤란하시지 않겠습니까?"
41140-84 = "윽…… 그건 그렇지만……."
41140-85 = "그러니 아쉽지만 이번 거래는 없었던 것으로 하지요."
41140-86 = "다음번에는 더 좋은 거래가 성사되기를 기대하겠습니다!"
41140-91 = "어, 어쩌지…… 설마 <카이저 인더스트리>에 남은 무기 재고가 없었을 줄이야……."
41140-93 = "모에. 그보다 네가 어떻게 <카이저 인더스트리>의 VVIP가 되었는지부터 알고 싶은데."
41140-94 = "어쩐지 그동안 소대 비품 장부에 미묘하게 누락된 재고가 생겨난다 싶었습니다만……."
41140-95 = "모에 쨩…… 이제 공금 횡령죄로 잡혀가는 거야……?"
41140-97 = "자, 잠깐……! 지금은 보급품을 구하는 게 우선이잖아?"
41140-98 = "그런 사소한 일에 신경 쓰고 있을 때가 아니라고!"
41140-99 = "<카이저 인더스트리>와의 거래는 불발되었지만, 중고 옥션에 무기를 올려놓았으니 곧 새로운 판매처를 찾을 수 있을 거야!"
41140-100 = "이런 비싼 물건들을 누가 중고 옥션에서 사겠냐!"
41140-101 = "중고 옥션을 무시하지 마! 옥션에선 해킹 장비부터 오늘 저녁 반찬거리까지 다 구할 수 있거든?"
41140-102 = "봐, 지금도 막 폭탄을 구매하고 싶다는 메시지가……."
41140-108 = "……정말 왔네?"
41140-110 = "다음화;소소하지만 확실한 패배"
