[translation]
10032070-1 = "제7화;어처구니없는 결말"
10032070-10 = "생각보다 훨씬 많은데? 정말 끝도 없이 밀려오잖아."
10032070-11 = "갱단 하나도 아니고 갱단 '연합'이니까. 저 돈 아란치노라는 녀석은 거기의 수장들의 대표고."
10032070-12 = "……그래서 아란치노는? 일어났어?"
10032070-13 = "흐음~."
10032070-14 = "……아니! 완전히 의식을 잃어버렸는데?"
10032070-15 = "조금 전 총격 도중에 날아든 유탄이 꽤 아팠나 봐. 깨어나려면 몇 시간은 걸릴 거 같아!"
10032070-16 = "하아……. 하필이면 이럴 때……."
10032070-17 = "이거 그냥 저 녀석들에게 줘 버리면 안 되는 거야? 녀석들이 원하는 건 이거뿐이잖아?"
10032070-18 = "아니. 그 반대야."
10032070-19 = "오히려 돈 아란치노가 지금 우리에게 있기 때문에 그나마 공격이 소극적이지."
10032070-20 = "넘겨주고 나면 이제 정말로 봐 줄 필요가 없으니 온갖 고화력 무기들이 날아들 테고, 그러면 훨씬 더 불리해져."
10032070-21 = "여기선 최대한 이 녀석을 끌고 안전한 곳까지 도망치는 수밖에 없어. 버리는 건 그다음이야."
10032070-22 = "자, 잠깐. 잠깐만……."
10032070-24 = "뭐냐. 지금 상황이 잘 이해되지 않는데."
10032070-25 = "왜 너희들이 돕는 거지? 아까 전에는 공격하며 쫓아오지 않았었나?"
10032070-26 = "난 분명 우리가 서로 하는 일이 어딘가에서 충돌하는 거라고 생각했는데."
10032070-28 = "틀린 말은 아니야. 단순히 상황이 바뀌었다는 것뿐."
10032070-29 = "그건 그거고, 이건 이거라는 거지."
10032070-31 = "으음……? 그, 그런가……. 잘은 모르겠지만……."
10032070-32 = "정신 똑바로 차려! 또 온다!!"
10032070-33 = "……!!"
10032070-34 = "으아아아아아-!!"
10032070-45 = "…………."
10032070-46 = "……전에도 봤지만, 정말이지 굉장한 저돌성이군."
10032070-47 = "이것이 흥신소 68……. 이쪽 세계의 패자들 중 하나……."
10032070-48 = "하, 하루카! 혼자 너무 튀어 나가지 말고! 좀 전선을 지키면서……!"
10032070-49 = "과연, 아군으로서는 이렇게나 든든한 것이로군."
10032070-55 = "……라는데, 아루 쨩? 방금 들었어? '이쪽 세계의 패자'래!"
10032070-56 = "잘됐네, 사장. 늘 듣고 싶던 말이었잖아."
10032070-57 = "……전혀 상상하지 못했던 쪽이긴 하지만."
10032070-58 = "……후, 후후……! 무, 물론이지!"
10032070-59 = "이번 기회에 잘 기억해 두라고. 우리 흥신소 68은……."
10032070-70 = "자, 잡담은 나중에! 우선 여기를 돌파해 빠져나갈 거야!!"
10032070-71 = "선생님!! 지휘를!!"
10032070-72 = "[s3] \"물론이지!\"\n[s4] \"잘 부탁해.\""
10032070-77 = "발목 잡지 않도록 최선을 다하지."
10032070-86 = "죽어주세요죽어주세요죽어주세요죽어주세요죽어주세요-!!"
10032070-93 = "죽어어어어어-!!"
