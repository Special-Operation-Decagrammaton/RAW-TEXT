[translation]
10033080-1 = "제8화;축제의 한복판에서"
10033080-3 = "신목제."
10033080-4 = "그것은! 백귀야행의 상징과도 같은! 저 거대 벚나무에서 벌어지는 축제이자 의식! 입니다!"
10033080-5 = "신목은 백귀야행의 어디에서나 보인다구?! 다들 이미 익숙해졌지?!"
10033080-7 = "후아아암……. 간단히 말하자면, 신목에게 제사를 올리면서…… 다 잘 되기를 기도하는 거야……."
10033080-8 = "신목제의 기원은, 한 해의 풍작을 기원하는 의식으로부터 시작되었는데요!"
10033080-9 = "'진짜' 신목제가 개최되는 시기에는, 백귀야행 각지로부터 크고 작은 가마를 조립해, 그 가마들을 신목제 광장까지 운반해 온답니다!"
10033080-10 = "가마들이 백귀야행 각지를 돌면서, 좋은 소식이나 기운을 전달해 준다고 믿는 것이었죠."
10033080-11 = "그리고 그 가마들 안에 담긴 좋은 기운을, 신목 터에서 제사를 올려 모두와 함께 나누는 것이랍니다!"
10033080-12 = "이번에 게헨나 여러분들께 보여드리게 된 신목제에서는, 가마들을 조립하고 운반하는 축제 전반부의 광경은 아쉽게도 보여드리지 못하게 되었습니다만……."
10033080-13 = "모든 가마들의 대표라고 할 수 있는 거대 가마와!"
10033080-18 = "이 신목제 광장까지에서 제사를 올리는, 봉헌의 과정과 광경은 그대로 보여드릴 수 있답니다!"
10033080-19 = "특히 이번 봉헌 의식을 주관하게 될 무녀 역을 담당할 분은! 바로!"
10033080-23 = "그렇습니다! 백귀야행에서 둘째가라면 서러워할 아이돌!"
10033080-24 = "치세 양입니다~!"
10033080-25 = "냐앙~?"
10033080-29 = "오오~ 저게 그 가마인가……."
10033080-30 = "크긴 크네. 한 스무 명은 올라갈 수 있겠는데?"
10033080-31 = "가마가 백귀야행 안을 돌 때에는, 정말로 사람들이 올라타서 악기를 연주하고 구령을 외친대."
10033080-32 = "지금은 비어 있는 것 같지만. 아쉽네."
10033080-36 = "(여기에서, 만회해야 해.)"
10033080-37 = "(신목제는 이번 수학여행에서 가장 큰 이벤트이자 하이라이트…….)"
10033080-38 = "(신목제만 잘 치러낼 수 있다면, 지금까지의 실수들을 전부 만회할 수 있을 거야.)"
10033080-39 = "(다행히 신목제 안내는 무사히 마쳤고…….)"
10033080-40 = "(……신목제 마지막에 터트릴 폭죽도, 스케쥴을 당기기 위해 미리 옮겨다 놓았으니까……!)"
10033080-47 = "흰옷을 입은 사람들이 가마를 둘러싸기 시작했어!"
10033080-49 = "뭐 하려는 거지? 아하…… 가마의 지붕을 여는 거구나."
10033080-50 = "저 안에 작은 나무 상자가 있다고 했지? 그 안에 좋은 기운을 담아 오는 거라고."
10033080-51 = "절대 무녀가 손을 댈 때까지 상자가 열리면 안 된대! 그러면 한 해의 액운이 거꾸로 전부 그 사람에게 몰리게 될 거라고 하네."
10033080-52 = "액운이 몰리면 무슨 일이 일어나는 거야?"
10033080-53 = "뭐…… 구체적으로는 문을 열 때마다 발가락을 찧게 된다든가, 걸을 때마다 한 번은 작은 플라스틱 장난감을 밟게 된다든가, 더위를 유난히 잘 타게 된다든가?"
10033080-54 = "그런 비인도적인 행위를! 백귀야행, 무섭군!"
10033080-55 = "좋아, 불로 정화하자! 소이수류탄, 투척!"
10033080-56 = "그걸 왜 나한테 던지는데!"
10033080-59 = "상자를 나를 때에는, 보시는 것처럼 절대로 손이 직접 닿지 않도록 한답니다."
10033080-60 = "깨끗한 흰 천으로 상자를 감싸고, 대나무로 만든 운반대를 통해 상자를 무대까지 옮기죠."
10033080-61 = "그리고 계속해서 피리로 음악을 연주하며, 만에 하나 좋은 기운이 다른 곳으로 도망치지 않도록 음악에 홀리게 하는 거죠."
10033080-66 = "잘은 모르겠지만 하여튼 음악이 필요하다는 거지? 교가라도 부를까?"
10033080-67 = "너 우리 학원 교가가 뭔지는 기억하냐?"
10033080-68 = "생각해 보니 모르겠네. 아니, 애초에 그런 게 있었던가?"
10033080-69 = "다행이군. 나만 모르는가 했어."
10033080-71 = "음……. 아마 지나가는 애들 열 명한테 물어보면, 열 명 다 모른다고 하지 않을까……."
10033080-74 = "우음……. 이제 슬슬 시간이 됐는데……?"
10033080-82 = "어? 갑자기 꽃잎이 엄청 날리기 시작한 것 같지 않아?"
10033080-83 = "아! 신목에서 꽃잎이 뿌려지고 있어!"
10033080-87 = "네에–엣! 전설에 따르면, 백귀야행에 행운이 찾아왔을 때! 신목이 꽃잎을 뿌려 그 좋은 기운들을 축하했다고 합니다!"
10033080-88 = "그 때문일까? 상자가 광장에 도착하면, 이렇게 꽃잎이 휘날리곤 해! 멋지지?"
10033080-90 = "사실은 축제 담당 학생들이 몰래 직접 뿌리고 있는 거지만……."
10033080-94 = "그리고 마침내! 무녀 역을 맡은 치세 님이 모습을 드러냈습니다!"
10033080-97 = "길 따라 온 길 따라, 굽이 돌아 여기 오니."
10033080-101 = "네입! 한 걸음씩 천천히, 치세 님이 무대를 오르고 계십니다!"
10033080-102 = "액은 멀리, 운수 보듬어, 놓지 말고 붙들어라."
10033080-103 = "또한 지금 들리는 시조는 봉헌 의식의 단계 중 하나로! 무녀가 단을 오르며 액운을 쫓고 복을 기원하는 노래이기도 합니다!"
10033080-104 = "꽃 피고 마파람 부니, 언덕 위를 올라라."
10033080-108 = "그리고 무녀가 단을 다 오르면……! 이렇게! 무대 위 제단에 긴 종이가 드리워지는 거야!"
10033080-113 = "어……? 무녀가 손에 뭔가를 들었는데? 종이를 나무에 붙인 건가?"
10033080-114 = "고헤이라고 불리는 제례 도구랍니다. 액운을 정화하고, 부정한 기운을 내쫓는다고 하죠!"
10033080-115 = "상자 위에서 고헤이를 흔들고, 그에 이어지는 '신목제의 춤'으로 좋은 기운을 축복하고 나면–!"
10033080-116 = "좋아! 거짓된 신목제는, 여기까지다!"
10033080-117 = "?!"
10033080-118 = "어, 어어!?"
10033080-119 = "갑자기 뭐야!!"
10033080-120 = "우웅……?"
