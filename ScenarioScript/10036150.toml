[translation]
10036150-1 = "스쿼드가 게임을 즐기는 법 (3)"
10036150-3 = "맙소사! 중급 단계도 완벽하게 통과입니다!"
10036150-4 = "정말로 경품 획득에 가까워지셨군요!"
10036150-5 = "흠, 슬슬 이런 방식의 전투에도 익숙해지는 기분이군."
10036150-6 = "하지만 다음 판이 마지막이야."
10036150-7 = "조금 아쉬운걸. 끝나고 또 한 번 플레이할 수 있을까?"
10036150-8 = "죄송합니다만, 참가자당 기회는 단 한 번!"
10036150-9 = "몇 번이고 시도하면 누구든 경품을 타 갈 테니까요~."
10036150-11 = "그럼, 이번 게임으로 경품을 탈 수 있을지 없을지 결정된다는 건가."
10036150-12 = "알기 쉬워서 좋네."
10036150-13 = "그럼, 갈까?"
10036150-20 = "……어라, 삿 쨩? 왜 그래? 어쩐지 표정이 어두운데……."
10036150-24 = "……혹시, 어디 아파?"
10036150-25 = "벼, 별일 아니야."
10036150-26 = "그저……. 이번이 마지막이라고 하니 어딘가, 아쉬워졌을 뿐."
10036150-27 = "그렇네. 이렇게 넷이서 뛰어노는 거, 처음이기도 하고."
10036150-29 = "그랬죠……."
10036150-30 = "……."
10036150-31 = "……후후, 그러니까 더욱, 후회 없이 놀아야겠지?"
10036150-35 = "후회 없이…… 그렇군."
10036150-36 = "오늘 밤은, 다시 돌아오지 않을 테니까, 최선을 다해 즐겨야겠지."
10036150-38 = "모두 준비됐지?"
10036150-39 = "마지막 판, 꼭 이기고 히요리를 위해 경품을 받아오자!"
10036150-40 = "음!"
10036150-41 = "여기까지 왔으니 어울려 줘야겠지……."
10036150-42 = "헤, 헤헤, 모두 감사합니다……."
10036150-46 = "하지만 경품은……."
10036150-47 = "네! 하지만 경품은 그렇게 쉽게 내어드릴 수는 없죠!"
10036150-48 = "다음은 저희가 준비한 최종 관문! 고급 단계입니다!"
10036150-49 = "과연 참가자 여러분들이 정말로, 원하는 경품을 획득하실 수 있을지!"
10036150-50 = "아니면 아깝게 여기서 탈락하실지!"
10036150-52 = "자, 시작하겠습니다!"
