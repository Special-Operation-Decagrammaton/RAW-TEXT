[translation]
32050-1 = "제5화;한밤중의 대소동 1"
32050-2 = "우후후♡"
32050-3 = "아, 아하하하……. 결국 나와버렸네요."
32050-4 = "어때요? 즐겁지 않나요? 금지된 걸 하고 있다는 배덕감. 그치만 다같이 하니까 안심이 되는 모순된 심정……."
32050-5 = "심야의 거리는 이런 느낌인가. 생각보다 더 활기가 넘치네."
32050-6 = "그렇죠? 24시간하는 가게들도 많고."
32050-7 = "저건 디저트 가게인가? 24시간 케이크 가게? 홍차 샵도 있고……."
32050-8 = "여기서 조금만 더 가면 무인 모모프렌즈 굿즈 샵도 있어요. 맞은 편에는 한정 굿즈만 취급하는 중고 가게도 있고……."
32050-9 = "어머나, 히후미 쨩. 잘 알고 계시네요."
32050-10 = "아, 아하하하……."
32050-14 = "아으…… 어쩌다 보니 나오긴 했는데…… 하스미 선배에게 들키기라도 하면…… 엄청 혼날 거 같아……."
32050-15 = "어머? 하스미 씨는 후배들에게 엄격한가요? 상냥한 분으로 알고 있었는데……."
32050-16 = "무, 물론 상냥해! 문무겸비에, 품위도 품격도 넘치는 선배님이니까!"
32050-17 = "그치만…… 화낼 땐 엄청 무섭기도 해서……."
32050-18 = "[s] \"그러고보면 하스미가 엄청 화낸 적이 있지 않았어?\""
32050-19 = "……으, 으응. 예전에 한 번 있었어……. 그때 나도 그 자리에 있었는데……."
32050-21 = "정의실현부 부실"
32050-26 = "……."
32050-27 = "……."
32050-28 = "하, 하스미 선배…… 진정하시고……."
32050-32 = "절대, 절대 용서 못 해요!! 만마전!! 게헨나!! 어떻게 그런……!!"
32050-33 = "히, 히익……!"
32050-35 = "어머나…… 대체 무슨 일이 있었길래……."
32050-36 = "에덴조약 때문에 게헨나의 수뇌부랑 회의를 다녀온 뒤에……. 갑자기……."
32050-38 = "하아…… 하아……."
32050-39 = "……잘 들으세요. 지금부터 선언하겠습니다."
32050-40 = "이제부터 저는……."
32050-41 = "다이어트를 시작하겠습니다!!"
32050-43 = "……?!"
32050-44 = "……?!"
32050-45 = "다, 다이어트……요?"
32050-47 = "네! 다이어트입니다! 즉, 체중 감량!"
32050-48 = "이제부터 제가 식사를 하루에 두 번 이상하거나, 간식을 입에 대는 걸 발견하면 바로 즉결 심판에 넘기셔도 좋아요!"
32050-49 = "다이어트는 모두에게 선언해두지 않으면 실패하는 법이에요! 여러분들의 도움이 필요합니다!!"
32050-50 = "하, 하스미 선배님…… 게헨나와의 회의에서 대체 무슨 일이 있었길래……."
32050-51 = "……."
32050-52 = "도저히 용서할 수 없어요!! 감히!! 감히……!!"
32050-55 = "네가 바로 트리니티의 공식 전략병기라는 켄자키 츠루기인가."
32050-56 = "……네? 아뇨, 저는……."
32050-57 = "과연 상정했던 것 보다 훨씬 더 규격 외로군. 불쾌할 정도야."
32050-58 = "키키키킷-! 그러나 그 속셈은 이 마코토 님이 다 꿰뚫어 보고 있다! 첫 만남부터 기를 꺾어놓겠다는 얕은 수작 따위!"
32050-59 = "……네?"
32050-60 = "이로하! 가서 사츠키를 데려와라. 트리니티 놈들에게 얕잡아 보이는 건 용서할 수 없으니까!!"
32050-62 = "마코토 선배. 이분은 츠루기 씨가 아니라 부부장인 하스미 씨입니다. 미리 서류에 적어 드렸잖아요."
32050-63 = "그리고 지금 가슴 얘기를 하고 있는 거라면 사츠키 선배가 와도 소용 없을 것 같은데요……."
32050-67 = "뭐, 뭐야?! 츠루기가 아니라고?! 어, 어느새 대역을 쓴 거냐! 우리를 무시하려고 그런 수작을?!"
32050-68 = "당했다……! 이 자리는 함정이었어!! 우리를 불러내서 저렇게 큰 키와 큰 가슴으로 기를 꺾어놓겠다는 수작에……!!"
32050-69 = "그러니까 원래부터 하스미 씨였다고 몇 번이나……. 제 말 안 듣고 있죠? 역시 안 듣고 있네요."
32050-70 = "저런 불쾌할 정도로 큰 가슴에……! 얕잡아 보이는 건가……!! 이 만마전의 마코토 님께서!!"
32050-71 = "점점 파국으로 가고 있는데요. 그리고 가슴 얘기는 그만해주세요. 같은 만마전이라는 게 부끄러워지고 있으니까."
32050-72 = "그래, 저 거대녀에게 질 수 없지! 이로하, 그것을 준비해라!"
32050-77 = "거.대.녀…………라고요?"
32050-81 = "뭘 준비하라는 건지 모르겠지만, 일단 이 회의가 망했다는 건 잘 알겠습니다. 슬슬 도망쳐야 할 타이밍 같네요."
32050-82 = "……응?"
32050-86 = "으아아아아-!!"
32050-94 = "……."
32050-95 = "……."
32050-96 = "[s] \"………….\""
32050-97 = "회의도 망쳤다고 들었어…… 그 뒤로 하스미 선배는 밥도 잘 안먹고……."
32050-98 = "그런 일이 있었군요……. 게헨나 분들한테 화를 내는 것도 이해가 가네요……."
32050-99 = "[s] \"하스미가 걱정되네…….\""
32050-100 = "아니, 하스미 선배는 강한 분이니까, 문제없어! 그 이후로도 계속 자기와의 약속을 철저하게 지키고 있단 말야."
32050-101 = "그러니까 괜찮아!"
32050-105 = "아, 디저트 가게야!"
32050-106 = "그러네요, 먹는 얘기를 하다 보니 슬슬 출출해지기도 하고, 저기서 뭔가 먹을까요?"
32050-107 = "여기 한정 파르페가 맛있어요! 24시간하는 곳인 줄은 몰랐는데……."
32050-108 = "파르페……. 나쁘지 않군. 가자."
32050-114 = "뭐?! 지, 진짜로?!"
32050-115 = "아, 아으…… 아, 아무도 없지……?"
32050-122 = "어서 오세요."
32050-123 = "아하하, 한밤중에 디저트 가게라니…… 뭔가 두근두근하네요."
32050-124 = "음."
32050-125 = "모두 다섯분이신가요? 주문은 뭘로 하시겠습니까?"
32050-126 = "어…… 한정 파르페 몇 개나 남아 있나요?"
32050-127 = "죄송합니다. 한정 파르페는 3개가 남아 있었는데 조금 전에 다른 분이 한 번에 다 사 가시는 바람에……."
32050-128 = "네? 그, 그런가요……."
32050-129 = "한발 늦었나……. 이 시간까지 한정을 노리는 사람이 있다니. 역시 얕잡아 볼 수 없군."
32050-130 = "……어머?"
32050-131 = "서, 선생님……?"
32050-132 = "[s] \"하스미……?!\""
32050-133 = "하, 하스미 선배?!"
32050-134 = "어머나. 한정 파르페가 잔뜩……."
32050-136 = "(파르페 3개를 앞에 두고 맛있게 먹고 있는 하스미의 모습이었다.)"
32050-138 = "선생님과 보충수업부 여러분……."
32050-139 = "으, 으으……."
32050-140 = "어머나♡ 하스미 씨, 한밤중에 여기서 파르페를 세 개씩이나……. 분명 다이어트 중이라고 들었는데 말이에요."
32050-141 = "이, 이건…… 그러니까……. 그게……."
32050-142 = "응, 이해해요. 한밤중에 정말 참을 수 없는 욕망에 이끌려서 여기까지 와 버린 거잖아요."
32050-143 = "네?! 그, 그건……."
32050-144 = "결국 엉망진창 저질러버린 후…… 이성을 되찾아봤자 이미 돌이킬 수 없는 지경에……."
32050-145 = "[s] \"배가 고팠구나. 하스미.\""
32050-146 = "……. 선생님……. 보충수업부도 분명 합숙 중에는 외출이 금지되어 있었을 텐데……"
32050-150 = "……여러분. 여기선 서로 못 본 것으로 하시죠."
32050-151 = "하, 하스미 선배……."
32050-152 = "코하루. 공부는 열심히 하고 있나요?"
32050-153 = "아, 그, 그게…… 그러니까……."
32050-154 = "[s] \"코하루는 최근에 성적이 엄청 올랐어.\""
32050-156 = "……네. 맞아요. 코하루 쨩, 이대로라면 낙제를 면하는 것도 충분히 가능할 것 같고……."
32050-158 = "그런가요?"
32050-159 = "아으……."
32050-160 = "다행이네요. 제가 말했죠? 코하루는 할 수 있다고."
32050-161 = "그때도 큰 소리로 말해버렸지만…… 역시 코하루는 할 수 있었던 거예요."
32050-163 = "공부 열심히 해주세요, 코하루."
32050-164 = "우리의 목표를 잊지 말아주세요."
32050-165 = "그치만 그런 거 저에게는 무리예요……"
32050-166 = "낙제를 면하라니, 그런 거 저에게 너무 어려운 임무……."
32050-167 = "아뇨! 할 수 있어요! 하지 않으면 안 돼요!"
32050-171 = "……소리쳐서 미안해요, 코하루. 하지만 계속 함께 있기 위해선 낙제를 면하지 않으면 안 돼요."
32050-172 = "그리고 무엇보다 힘써주시는 선생님을 위해…… 파이팅하는 거예요. 아시겠죠?"
32050-173 = "……네. 노력할게요."
32050-175 = "……헤헤헤. 하스미 선배의 기대를 배신하지 않을 거니까……."
32050-176 = "네. 언제나 응원하고 있어요. 코하루. 어서 빨리 정의실현부로 복귀해서 같이 임무를 수행하는 거예요."
32050-177 = "……응! 알겠어요."
32050-178 = "[s] \"뭔가 따뜻한 분위기네…….\""
32050-179 = "(위이이이잉- 위이이이이이잉-)"
32050-180 = "……응? 연락이……."
32050-181 = "네. 이치카, 무슨 일이죠?"
32050-182 = "아, 하스미 선배, 어디신가요? 문제가 생겼습니다."
32050-183 = "문제……요? 자세히 이야기를."
32050-184 = "지금 학원 근교에 게헨나로 추정되는 학생들이 무단침입해서, 무차별로 총격을 가하고 트리니티 관할 시설물을 습격하는 사건이 발생했습니다."
32050-185 = "습격……? 게헨나 선도부인가요?! 드디어 본색을 드러냈나, 만마전 놈들……!!"
32050-186 = "아, 그게……."
32050-187 = "에덴조약을 방해하려는 게 분명해요! 규모는요? 몇 중대죠?! 위치는요?! 습격당한 시설물은 뭐죠?"
32050-188 = "진정하지말임다, 선배. 일단 게헨나 선도부는 아니고 병력 수도 중대 규모가 아니라 4명뿐입니다."
32050-189 = "선도부가 아니라…… 4명……?"
32050-190 = "네. 습격한 시설물은…… 근처의 아쿠아리움으로 확인되었습니다."
32050-191 = "아쿠아리움……? 수, 수족관요? 거길 왜……."
32050-192 = "저도 잘 모르겠는데 하여튼 전시 중이던 희귀 어종인 골드마구로를 강탈해서 지금 도망치고 있습니다."
32050-193 = "골드마구로……?"
32050-194 = "엄청 비싼 어종이라고 하니, 아마 금품을 노린 범죄가…… 아, 해당 조직의 인적정보가 확인되었습니다."
32050-195 = "게헨나의 테러리스트 집단 <미식연구회> 동아리라고 합니다."
32050-198 = "주동자는 쿠로다테 하루나. 게헨나의 요주의 위험인물로 알려져 있습니다! 선배, 빨리 명령을!"
32050-200 = "으아아아! 왜 여기까지 와버린 거야! 트리니티 한가운데잖아!"
32050-201 = "그치만 골드마구로 소식을 들어버렸으니까 어쩔 수 없잖아요? 해버릴 수밖에 없달까★"
32050-202 = "후후후. 그 전설의 참치를 고작 관상용으로 둔다니, 이건 미식에 대한 예의가 아닙니다."
32050-203 = "미식이라는 것은 좀 더 고고하고, 또한 보편적인 것……"
32050-204 = "구경거리가 되어 돈벌이로 전락하는 건 이 골드마구로도 원치 않을 것이에요."
32050-205 = "저는 그저 그 울림에 답했을 뿐! 그렇지 않나요, 후우카 씨?"
32050-206 = "읍! 읍읍!!"
32050-207 = "보세요, 게헨나의 급양부장도 적극 동의하고 있잖아요?"
32050-208 = "재갈이 물려있어서 무슨 말인지 하나도 모르겠지만요★"
32050-209 = "으아, 참치가 퍼덕거리잖아! 지느러미가 따귀를 때리고 있어!!"
32050-210 = "꽉 잡고 있어, 이즈미!! 그거 엄청 비싼 거라고!"
32050-211 = "그래서 이건 언제 먹을 수 있는데? 참치는 뺨을 때리고, 검은 세일러복들은 막 쫓아오고 있고!"
32050-212 = "트리니티의 정의실현부라고!! 선도부만큼 무서운 녀석들에게 걸린 거란 말야! 우리 도망칠 수 있는 거야, 하루나?"
32050-213 = "후후후. 도망칠 수 있느냐, 는 중요하지 않습니다."
32050-214 = "오직 중요한 것은, 먹을 수 있느냐, 없느냐!"
32050-215 = "즉, [ruby=eat or die]먹느냐, 죽느냐![/ruby] 의 양자택일뿐! 바로 그것이 미식가가 걸어야 할 고고한 길인 것입니다!"
32050-216 = "즉, 결국 와장창★이란 거죠."
32050-220 = "연설은 됐고, 빨리 도망쳐!!"
32050-221 = "자아, 빨리 포위망을 뚫고 퇴각하죠! 후우카 씨가 만들어주는 참치회를 먹는 겁니다!!"
32050-222 = "우읍!! 으으읍!!!"
32050-224 = "다음화;한밤중의 대소동 2"
