[translation]
90002210-1 = "제21화;투쟁"
90002210-2 = "웃기지 마, 이 가짜 신 자식아!!!"
90002210-7 = "네가 죽였어."
90002210-8 = "네가 죽인 거나 마찬가지야!"
90002210-9 = "그러고도 신이라고 자칭하지 마!!!"
90002210-13 = "가지치기라니, 나는 그런 걸 바라지 않아."
90002210-14 = "잘라내어 없는 것으로 해야 할 모순이라니, 그런 건 절대로 용납할 수 없어!!!!!"
90002210-30 = "행복해질 거야."
90002210-31 = "무슨 일이 있어도, 죽을힘을 다해 행복해질 거야!"
90002210-32 = "모순 속에서 길을 헤매더라도, 누가 무슨 수를 써서 방해하더라도!!!"
90002210-33 = "어리석은 일이다."
90002210-34 = "죄의 삯은 죽음이니, 그 결과는 정해진 형태로 결말지어질 것이다."
90002210-35 = "그게 네가 생각하는 결말이라면……."
90002210-40 = "[log]\"스스로의 결함을 이기지 못하고 자멸한 존재들에게.\"[/log]"
90002210-43 = "[log]\"나는, 어떤 경의나 헌사도 바치지 않을 거야.\"[/log]"
90002210-46 = "그렇게 되든 말든, 나는 아무 신경도 쓰지 않을 거다!!!"
90002210-47 = "?!"
90002210-48 = "불가능한 일이다. 어떻게…… 움직일 수 있는 거지?"
90002210-49 = "으, 으윽……!"
90002210-56 = "선생, 님……?"
90002210-57 = "[ns1] \"……사라진 것들에게 할 수 있는 것은, 애도가 전부이겠지.\"\n[ns2] \"그건 슬픈 일이야. 우리의 한계에 부딪히는 일이기도 하고.\""
90002210-60 = "위험, 하다니까요…… 물러서 있으라구요……."
90002210-61 = "[s] \"이번만 봐주라, 응?\""
90002210-62 = "……그래요. 말한다고 해서 들을 분이 아니죠, 선생님은."
90002210-63 = "어째서 굳이 스스로의 한계를 시험하려 하는가."
90002210-64 = "선생, 님……!"
90002210-65 = "투쟁은 고통이니, 그것은 마침내 죄를 잉태할 것이다."
90002210-66 = "[s3] \"알고 있어. 그렇지만 그걸 빼앗아 가려 하지 마.\"\n[s4] \"우리에게서 가능성을 없애려 하지 마.\""
90002210-69 = "……!"
90002210-70 = "[s5] \"살아 있는 한, 벗어날 방법은 아마도 없겠지만.\"\n[s6] \"나는 모든 것을 대신해 주겠다는 이야기에, 굴복하지 않을 테니까.\""
90002210-73 = "마침내 벌레처럼 버르적대며, 추하게 땅을 기게 될 것이라고 해도?"
90002210-77 = "[log]\"그래. 그럴지도 모르지.\"[/log]"
90002210-80 = "[log]\"그렇다고 해도 나는, 그 길을 선택할 거야.\"[/log]"
90002210-83 = "[log]\"넘어지고, 몸부림치고, 진흙투성이로 꿈틀거리는 것밖에 하지 못하더라도.\"[/log]"
90002210-86 = "[log]\"우리는 분명 그 마지막에서, 반드시 함께 일어설 테니까.\"[/log]"
90002210-89 = "[ns] \"그렇지, 아리스?\""
90002210-90 = "……."
90002210-91 = "네. 그렇습니다, 선생님."
90002210-92 = "기억하고 있나요, 케이? 용사란 모두와 함께 나아가는 직업이라고 아리스가 이야기했던 것을요."
90002210-93 = "기억하고 있습니다, 아리스. 물론이죠."
90002210-95 = "용사는 그렇게 하는 것으로, 혼자만의 힘으로는 닿을 수 없는."
90002210-96 = "먼 곳까지 모두와 함께 나아갈 수 있는 직업이라고요."
90002210-102 = "……불경하구나."
