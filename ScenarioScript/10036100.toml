[translation]
10036100-1 = "제10화;Yo DJ Pump This Party"
10036100-2 = "무대는 멀쩡한 예비 부품으로 교체 완료."
10036100-3 = "DJ 기자재는 다행히 총을 안 맞은 것 같아. 신기할 정도인걸."
10036100-4 = "개, 객석도 준비 완료에요……!"
10036100-8 = "이렇게 직접 도와줄 필요는 없다만……."
10036100-9 = "함께 즐기는 축제니까. 그리고 일손은 많을수록 좋잖아?"
10036100-13 = "다른 쪽도 준비 완료!"
10036100-14 = "불청객 녀석들을 놓쳐버린 건…… 조금 속이 쓰리지만."
10036100-15 = "일단 방해꾼도 싹 물러갔고, 이제 본격적으로 축제의 밤을 즐겨 보자고!"
10036100-16 = "어…… 그게 말야."
10036100-17 = "DJ 공연은 다른 행사로 대체해야 할 것 같아."
10036100-22 = "어째서……?"
10036100-24 = "그게…… DJ B.o.B, 아까 한참 총격전이 벌어질 때 도망가더라고."
10036100-25 = "'납치당하는 건 싫어어~' 라면서."
10036100-26 = "나도 경황이 없어서 붙잡질 못했어."
10036100-27 = "하지만 DJ 공연은 모두가 기다리던 메인 이벤트잖아!"
10036100-28 = "……역시 망했어요!"
10036100-29 = "우리한테 여름밤의 추억 같은 건 과도한 사치였던 거예요!"
10036100-30 = "결국 우린 DJ 음악 대신 음침한 파도 소리나 들으면서 모랫바닥에서 잠을 청해야겠네요……."
10036100-31 = "그러다가 밀물에 휩쓸려서 아무도 모르는 무인도까지 떠내려가 버릴 거예요……!"
10036100-32 = "패션 잡지 저번 호에서 '무인도에 갈 때 가져갈 아이템' 특집을 읽어 둘 걸 그랬어요!"
10036100-33 = "[s] \"자, 자, 진정해.\""
10036100-38 = "당신은…… 샬레의 선생?"
10036100-39 = "뭔가 해결 방법이 있는 거야?"
10036100-40 = "[s] \"내 생각엔, DJ 공연을 멈출 필요는 없을 것 같아.\""
10036100-41 = "물론 공연용 턴테이블이나 스피커, 음원 같은 건 그대로 두고 간 거라 아깝긴 하지."
10036100-42 = "하지만 정작 그걸 이용해서 공연할 DJ가 없잖아?"
10036100-43 = "[s] \"후후, 걱정 마시죠!\""
10036100-47 = "서, 선생? 왜 나를 앞으로 내세우는 건가?"
10036100-48 = "[s] \"여기, DJ B.o.B의 수제자가 있으니까!\""
10036100-49 = "선생, 그게 무슨?!"
10036100-50 = "서, 설마 나보고 공연을 하라는 건가……?!"
10036100-55 = "[ns1] 세 사람에게 살짝 눈짓을 한다.\n[ns2] (찡긋)"
10036100-58 = "……!"
10036100-59 = "응, 그러네~ 삿 쨩이 디제잉 하는 모습, 보고 싶은걸."
10036100-60 = "마, 맞아요! 공연만 기다리고 있었는데, 취소되면 슬프잖아요……헤헤."
10036100-61 = "……나까지 해야 돼?"
10036100-62 = "[s] \"응?! 뭐라고? 미사키, DJ 공연만 기다리고 있었다고?\""
10036100-63 = "그런 말 안 했어!"
10036100-64 = "그, 그러니까…… 축제의 메인 이벤트를 취소하면 안 되는 거잖아."
10036100-66 = "하지만, 난 DJ가 아니다."
10036100-67 = "내게 모두를 즐겁게 해 줄 능력 같은 건……."
10036100-68 = "[s] \"능력은 중요하지 않아. 중요한 건 하고 싶은지 아닌지야.\""
10036100-69 = "……."
10036100-70 = "선생은, 그렇게 말하는 건가."
10036100-71 = "내가 하고 싶은 일…… 그건…… 역시……."
10036100-75 = "역시 잘 모르겠다."
10036100-76 = "[s] \"분명 깨닫는 흐름이었는데?!\""
10036100-77 = "하지만 한 가지는 알 것 같아."
10036100-78 = "지금, 내가 하고 싶은 일은……."
10036100-79 = "아까 무대에서 느꼈던 그 이름 모를 감정을, 한 번만 더 느껴보는 것…… 그뿐이다."
10036100-80 = "해보겠어, 선생."
10036100-81 = "아니, 해보고 싶다."
10036100-83 = "선생님 때문에 부추기는 데 동참하긴 했지만…… 리더가 디제잉이라니, 상상도 못 해봤는데."
10036100-84 = "사오리 언니가 음악……."
10036100-85 = "하다가 잘 안되면 턴테이블에 총알구멍을 내는 건 아닐까요……?"
10036100-86 = "삿 쨩은 잘 해낼 수 있을 거야."
10036100-88 = "어느 정도 답을 찾은 것 같으니까."
10036100-92 = "자, 자, 밀지 마세요! 밀지 마세요!"
10036100-93 = "소란은 지나가고, 이제 다시 축제의 열기가 <무법자 해변>을 덮을 때가 되었습니다!"
10036100-94 = "그럼 모두 함께, 한 번 놀아볼까요!"
10036100-95 = "뮤직! 큐!"
