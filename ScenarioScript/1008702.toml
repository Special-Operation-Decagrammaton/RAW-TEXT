[translation]
1008702-1 = "아무튼 질 수 없어요!"
1008702-2 = "(무슨 일인지 모르겠지만 어쨌든 게헨나로 향했다.)"
1008702-13 = "선도부 행정관실"
1008702-16 = "늦었잖아요!!"
1008702-17 = "[s] \"아뇨…… 제시간에 왔습니다만…….\""
1008702-22 = "어라…… 그러네요."
1008702-27 = "그치만 제가 계속 기다리고 있었으니까 늦은 거예요!"
1008702-28 = "[s] \"그런 건가요…….\""
1008702-29 = "네! 아무튼 그런 거예요!"
1008702-30 = "선생님이 도착할 때까지 제가 시계를 몇 번이나 본 줄 아세요?"
1008702-34 = "뭐, ……그렇지만 제시간에 왔으니까 용서해 드릴게요."
1008702-38 = "[ns1] (무슨 소린지 모르겠지만……)\n[ns2] (다행히 평상시 아코의 모습인 것 같다.)"
1008702-43 = "[ns] \"그래서 무슨 일이야, 아코?\""
1008702-46 = "만마전의 너구리 녀석들 말이에요!!"
1008702-47 = "그 녀석들이 파티를 개최하기로 한 건 아시나요? 또 추가 예산을 편성해서 말도 안 되는 엄청난 파티를 개최하기로 했어요."
1008702-48 = "이걸 좀 보세요! 만마전에서 보내온 파티 계획서예요."
1008702-49 = "[s] \"흐음…….\""
1008702-50 = "이 악의에 가득 찬 계획을 보세요!"
1008702-54 = "특히 자기들은 비싸고 화려한 이브닝드레스로 드레스코드를 맞출 거니까 선도부…… 특히 행정관은 평소 입고 다니던 구멍 뚫린 누더기나 입고 오는 걸 추천한다……?"
1008702-55 = "대체 이 옷의 어디가 누더기라는 거죠? 말도 안 되는 소릴……."
1008702-56 = "[s3] \"……………….\"\n[s4] \"지, 진정해…….\""
1008702-57 = "하지만 저 아마우 아코! 이런 악의적인 계획에 그대로 당해줄 생각은 없어요."
1008702-58 = "하지만 저 아마우 아코! 이런 악의적인 계획에 그대로 당해줄 생각은 없어요."
1008702-59 = "이런 일이 있을 줄 알고 그 녀석들 모르게 비자금을 확보해 두었거든요."
1008702-60 = "[s] \"비자금…….\""
1008702-61 = "그러니까 전쟁이에요! 저는 그 너구리 녀석들에게 꿇리지 않는 드레스를 입고 파티에 가야 하는 거죠."
1008702-62 = "그걸 통해 선도부와 만마전 사이엔 커다란 격의 차이가 있다는걸, 확실히 실감하게 해주겠어요."
1008702-63 = "이 상황을 이해하셨나요, 선생님?"
1008702-64 = "[s] \"어…… 이해는 했지만…… 그게 나와 무슨 관계가…….\""
1008702-68 = "네? 당연히 관계가 있죠!!"
1008702-69 = "선생님이 저에게 어울리는 드레스를 골라주셔야죠!"
1008702-73 = "[ns] \"제가요?\""
1008702-74 = "네?"
1008702-75 = "그럼 선생님이 아니면 누가……?"
1008702-76 = "[s] \"아니, 본인이 마음에 드는 취향으로 고르면 되지 않을까…….\""
1008702-80 = "……네?"
1008702-85 = "무, 무슨 소릴 하는 거예요? 이런 중요한 드레스를 저 혼자 고르라는……?"
1008702-86 = "너무한 거 아니에요, 선생님? 저에게 중요한 일인데도…… 난 모르겠으니 알아서 해라, 같은 식으로……?"
1008702-87 = "[s] \"아, 아니…… 그게 그렇게 되는 건가요…….\""
1008702-88 = "너무 관심이 없는 거 아니에요? 제대로 선생님이 골라주지 않으면 그 녀석들을 무릎 꿇릴 수가 없단 말이에요!"
1008702-89 = "저에게 어떤 디자인이 어울리는지, 어떤 색이 좋은지는 선생님이 결정해 주셔야 해요!"
1008702-90 = "[s] \"아니…… 그건…… 네…… 알겠습니다.\""
1008702-95 = "그럼 시작해 볼까요?"
1008702-99 = "자, 여기 드레스 상품 카탈로그예요. 받으세요."
1008702-100 = "여기서 저에게 어울리는 드레스를 골라주세요!"
1008702-102 = "(그렇게 아코의 드레스 고르기가 시작되었다.)"
1008702-106 = "그럼 가장 먼저. 드레스의 색깔부터 정해보도록 해요. 뭐가 좋을까요?"
1008702-107 = "[s5] \"음…… 평소 아코의 옷과 비슷한 톤이라면 문제없으려나…….\"\n[s6] \"역시 파란색 계통이 무난하지 않으려나…….\""
1008702-110 = "……흐응. 그게 선생님의 취향인가요? ……참고해 둘게요."
1008702-111 = "[s] \"아니, 내 취향이라기보단 아코에게 어울릴 것 같은 느낌으로…….\""
1008702-115 = "네? 뭔가요? 그런 미적지근한 말은?"
1008702-116 = "좀 더 자신의 의견을 제대로 말해주지 않으면 알 수 없잖아요! 취향을!"
1008702-117 = "[s] \"……으음. 알겠습니다.\""
1008702-120 = "디자인은요? 어느쪽이 좋아 보이세요?"
1008702-121 = "[s7] \"역시 파티에 어울리는 과감한 디자인이 좋다고 생각해.\"\n[s8] \"이렇게 면적이 적은 디자인이라면 주변을 압도할 수 있을 것 같아.\"\n[s9] \"위압적일 정도로 공격적인 이 디자인은 어때?\""
1008702-125 = "이거 말이죠……? 어디 보자……."
1008702-132 = "이, 이거요……? 조, 조금 과감하지 않나요?"
1008702-133 = "물론 이거라면 그 너구리 녀석들에게 격의 차이를 느끼게 해줄 수 있을 것 같지만……."
1008702-134 = "그치만 이건……. 고민할 시간이 조금……."
1008702-140 = "……즉, 선생님은 이런 풍기 문란해 보이는 옷이 취향이라는 거네요?"
1008702-144 = "[ns] \"……네?\""
1008702-145 = "이런 걸 저에게 입히겠다는 계획……? 선도부의 행정관으로서 이건 기각이에요! 기각!"
1008702-146 = "선생님의 취향을 믿은 것이 실수였어요!! 제가 이런 걸 어떻게 입어요?"
1008702-147 = "제가 그냥 알아서 고를게요! 그냥 제 취향껏 고르겠어요!"
1008702-148 = "[s] \"너, 너무해…….\""
1008702-149 = "너무한 건 선생님이잖아요!"
1008702-150 = "네? 갈팡질팡하는 것 같다고요?"
1008702-154 = "저도 알고 있으니까 말하지 않아도 돼요!"
1008702-156 = "(뭔가 이상한 소리를 하면서 안절부절못하는 아코를 두고 샬레로 돌아왔다.)"
