[translation]
10018050-1 = "제5화;계산 부탁합니다."
10018050-2 = "상가 거리"
10018050-4 = "오세요, 오세요. 한번 드셔 보시고 가세요!"
10018050-5 = "참새정의 새 메뉴입니다. 무료로 드려요!"
10018050-6 = "참새정이? 이제 곧 폐업한다는 이야기를 들었는데……"
10018050-7 = "그, 그런 소문도 분명 있었지만요!"
10018050-8 = "다시 시작하려 한답니다. 새 메뉴와 함께 말이에요."
10018050-9 = "그럼 어디 한번 맛이나 볼까……"
10018050-13 = "(우물우물……)"
10018050-17 = "마, 맛있어! 아니, 예전 참새정의 밥도 물론 맛있었지만!"
10018050-18 = "감칠맛이 좋아! 거기에 식감도 훨씬 좋아졌어!"
10018050-19 = "서, 선배! 다행이에요!"
10018050-20 = "새로운 참새정, 많이 응원해 주세요!"
10018050-24 = "식은 상태에서도 이 맛이라면…… 갓 만들었을 때에는 어떤 맛이 날지……"
10018050-28 = "이런, 먹느라 거래처와 약속한 시간도 잊어버릴 뻔했네!"
10018050-29 = "그거 큰일이잖아요! 어서 가 보세요!"
10018050-35 = "맛있어…… 확실히 맛있어."
10018050-36 = "그런데……"
10018050-37 = "무슨 문제라도…… 있나요?"
10018050-38 = "이 음식, 얼마에 팔 생각이지?"
10018050-39 = "그, 그건……! 들어간 원재료 가격과, 운반에 걸리는 수고, 그리고 준비 시간 같은 걸 고려하면……"
10018050-40 = "900엔 정도…… 가 되겠네요."
10018050-41 = "그 정도나……? 내가 점심에 쓸 수 있는 돈은 보통 600엔 정도인데……"
10018050-43 = "그, 그런가요?!"
10018050-44 = "하지만 주위 가게에 비해 약간 높은 정도고, 원래 참새정의 음식 가격도 그런 면이 있었고……"
10018050-45 = "그래, 그랬지. 그러니까 참새정이 문을 닫느니 마느니 하는 소리가 나왔던 것이고."
10018050-46 = "하지만 그 정도 가격이라면, 난 자주 찾아가기 힘들겠어……"
10018050-48 = "으음…… 이 정도 가격이라면, 난 조금 더 고급스러운 음식을 먹고 싶은데."
10018050-49 = "지금 먹어 본 것은 주위에서 흔히 먹을 수 있는 음식이잖아?"
10018050-50 = "물론 그 맛의 수준이 흔한 정도가 아니라는 건 인정하겠지만."
10018050-51 = "그, 왜. 이왕 돈을 쓰는 거, 완전히 새로운 경험을 해 보고 싶어지는 게 사람이라는 거지."
10018050-52 = "하지만, 참새정에서 조달할 수 있는 식재료로 만들 수 있는 음식에는 한계가……"
10018050-53 = "그건 소비자가 고려할 문제가 아니지 않을까?"
10018050-54 = "확실히 그 말씀은 맞긴 한데요……"
10018050-57 = "……그렇군요. 맛뿐만 아니라 가격도 중요하다……"
10018050-58 = "불찰이었습니다. 퀄리티에만 신경 쓴 나머지 가격이라는 문제를 놓치고 말았군요."
10018050-61 = "사실 양도 부족했다는 느낌이었고요."
10018050-62 = "어라? 그건 아카리라서 부족한 거 아니야?"
10018050-63 = "아니야. 내가 먹기에도 살짝 모자랐으니, 확실히 양이 적었던 건 맞아."
10018050-64 = "우우, 그렇지만 어떻게 하면 좋지? 삐약슈퍼의 식재료는 확실히 질이 좋지만……"
10018050-66 = "네. 그만큼의 가격 상승을 피할 수 없다는 뜻도 되죠."
10018050-67 = "하지만 이 지역 상권은 이미 냐오푸드의 저렴한 가격에 길들여진 상태."
10018050-68 = "가격적인 측면에서 겨뤄 이기려면, 그들과 같은 방식으로 승부하지 않으면 안 됩니다."
10018050-69 = "그렇다는 것은 어느 정도의 질적 하락을 감수할 수밖에 없다는 뜻인데……"
10018050-73 = "마음에 들지 않는군요. 이 상황은."
10018050-74 = "[s] \"양과 질, 모두를 잡는 방법은 어떨까?\""
10018050-75 = "네? 그런 게 가능할까요, 선생님?"
10018050-76 = "아…… 중저가 메뉴와 고급 메뉴를 동시에 준비하자고요?"
10018050-77 = "아하, 중저가 메뉴를 정식으로 단일화하여 식사 위주의 정식집으로 일반적인 운영을 하고,"
10018050-78 = "단골들을 위한 특별 메뉴를 따로 준비하자는 말씀이시군요."
10018050-79 = "그로 인해 메뉴 가짓수의 축소와, 차별화를 동시에 꾀한다……"
10018050-81 = "나쁘지 않아 보이는데? 나 정식 같은 것도 좋아해. 양도 적당하고."
10018050-82 = "어떻게 보면 학교 급식 같은 거니까요★"
10018050-83 = "우리 학교 급식은 맛이 없지만! 참새정의 정식은 분명 맛있을 거야!"
10018050-84 = "[s1] \"주인분의 수고를 최대한 줄이는 것도 중요한 점이지.\"\n[s2] \"급식이 맛없어지는 데에는 나름의 사정이 있지 않을까……\""
10018050-88 = "아무튼, 괜찮은 의견이라고 생각합니다. 역시 선생님이세요."
10018050-89 = "그러면 다음은, 중저가 메뉴를 위한 저렴한 식재료 구입인데……"
10018050-91 = "그건 역시 이 주위 상권에서 구할 수밖에 없으려나……"
10018050-92 = "하루나는 마음에 들지 않아 할지도 모르겠지만요."
10018050-93 = "아, 확실히. 확실히! 타협하는 거 정말 싫어하지."
10018050-95 = "……이번만큼은 다릅니다."
10018050-96 = "참새정이 살아남는 데 필요한 일이라는 걸 알고 있으니까요. 생존의 문제는 다른 이야기죠."
10018050-101 = "이야기가 들린 김에 말해 보자면, 장을 보는 건 주리에게 맡겨 두면 될 거야."
10018050-103 = "뭐?!"
10018050-105 = "그렇게 놀라면 실례잖아. 주리는 다른 건 몰라도 식재료 보는 눈은 확실하다고."
10018050-106 = "그, 그래요! 저 스스로 말하기에는 민망하지만…… 열심히 공부했어요!"
10018050-107 = "제가 선배에게 도움이 될 수 있는 건, 재료를 알아보는 눈썰미밖에는 없었으니까……"
10018050-109 = "흐, 흠. 그렇게 말한다면야……"
10018050-111 = "그러면, 선생님?"
10018050-112 = "[s] \"그런가. 내가 나설 시간인가.\""
10018050-113 = "잘 부탁드립니다."
