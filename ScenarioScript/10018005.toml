[translation]
10018005-1 = "프롤로그;지금, 뭐라고 하셨죠?"
10018005-4 = "맛있게 드셨어요?"
10018005-9 = "네. 제법 괜찮았답니다."
10018005-10 = "(제게는 약간 아쉬웠지만……)"
10018005-11 = "(가게의 규모, 혼자 운영하는 식당 같은 제반 사항을 생각하면 합격점이겠죠.)"
10018005-12 = "무엇보다 특별 메뉴로 준비한 '오조니'가 만족스러웠어요."
10018005-13 = "오조니의 핵심은 구운 떡입니다만, 구운 정도가 적당하고 가운데도 잘 부풀어 있었어요."
10018005-14 = "다른 음식들도 인상적이었습니다."
10018005-15 = "어디에서나 먹을 수 있을 것 같은 메뉴였지만, 나름의 정갈함이 엿보였다고 할까요."
10018005-20 = "난 생선구이가 좋았어."
10018005-21 = "바싹 구워서 바삭한 느낌이 드는 껍질이라던가, 간이 잘 배었고 촉촉한 속살이라던가."
10018005-22 = "양이 조금 아쉬웠지만, 모든 게 좋았어요."
10018005-23 = "……너한테 충분한 양이란 건, 도대체 뭐냐……"
10018005-24 = " 나도 다 좋았어!"
10018005-25 = "카레 가루와 식초, 시럽을 뿌리면 더 맛있었겠지만!"
10018005-26 = "그럴 리가 있겠냐! 너만 좋아하겠지!"
10018005-31 = "그럼, 계산을 부탁드리죠. 후후."
10018005-32 = "감사합니다. 마지막 손님들이 좋은 분들이어서 저도 기쁘네요."
10018005-36 = "지금 마지막 손님이라고 하셨나요?"
10018005-37 = "네…… 저희 '참새정' 식당은 곧 문을 닫을 예정이거든요."
10018005-42 = "어머?"
10018005-43 = "응?"
10018005-44 = "네에에엥?! 왜?!"
10018005-51 = "아쉽네요. 모처럼 괜찮은 가게를 찾았다고 생각했는데."
10018005-52 = "응! 정말 좋은 가게였어. 나, 거기서 나오는 거라면 뭐든 먹을 수 있을지도!"
10018005-53 = "네가 못 먹는 게 애초에 있긴 하냐……"
10018005-54 = "그러는 준코 씨도 감동한 표정인데요?"
10018005-58 = "아니, 그게……"
10018005-59 = "맛있는 걸 먹는게 얼마 만이었나, 하는 생각이 들어서."
10018005-60 = "뭔가, 맛있는 걸 먹으려고 하면 꼭 일이 터지곤 했단 말이지."
10018005-61 = "그런 기억은 주로 준코 씨에게만 집중되어 있는 모양이지만요★"
10018005-62 = "억울해! 왜 나만!"
10018005-63 = "언제쯤 비슷한 가게를 다시 찾을 수 있을까?"
10018005-64 = "간신히 찾아낸 보물이 눈앞에서 사라지는 기분일지도."
10018005-65 = "양은 좀 부족했지만, 그 비유에는 공감이 가네요."
10018005-72 = "아니요. 이렇게 포기할 수는 없습니다."
10018005-77 = "응? 포기할 수 없다고 해도, 우리가 뭘 할 수 있는데?"
10018005-78 = "그건 그렇네요. 하다못해 조금만 더 일찍 알았더라면, 홍보라도 할 수 있었을 텐데."
10018005-79 = "없어져 가는 모습을 지켜보는 게 전부인가…… 그거 왠지 슬플지도."
10018005-81 = "후후. 제게 다 방법이 있답니다."
10018005-82 = "이럴 때에 도움이 될 사람들을……"
10018005-83 = "알고 있거든요."
