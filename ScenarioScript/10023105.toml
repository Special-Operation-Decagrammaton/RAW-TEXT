[translation]
10023105-2 = "으읏……!"
10023105-3 = "과연 상정 외의 힘…… 이것이 소위 말하는, 샬레의 선생님이 가진 힘인가요……?"
10023105-11 = "왕관 확보!"
10023105-12 = "레어 아이템을 획득했습니다! 뽜밤뽜밤!"
10023105-13 = "저 분은…… 어떻게 하죠……?"
10023105-19 = "!!!"
10023105-20 = "엄청난 연막이군요…… 호흡기를 조심해 주십시오, 선생님."
10023105-22 = "으, 눈이 매울 정도예요. 콜록, 콜록! 언니 거기 있어?"
10023105-24 = "바로 옆에서 목소리는 들리는데, 모습이 안 보여!"
10023105-29 = "(그때, 발밑으로 투명한 구슬 같은 것이 굴러왔다.)"
10023105-33 = "(무심코 구슬을 집어 들자……)"
10023105-34 = "안녕하세요, 제 목소리가 들리시나요?"
10023105-35 = "[s] \"……응, 들려.\""
10023105-37 = "이런 식으로 작별하게 되어서 아쉽네요."
10023105-38 = "결론적으로는 왕관을 선생님에게 빼앗긴 셈이 되었지만……"
10023105-39 = "반대로 생각하면, 메이타로로부터 왕관을 되찾는 것에는 성공한 셈이네요. 그렇다면 전보다는 훨씬 상황이 나아진 셈이죠."
10023105-40 = "그러니 아쉽지만, 이번에는 그냥 물러나겠어요. 샬레의 '선생님'과 처음으로 만난 것에 대한 존중으로 생각해 주세요."
10023105-41 = "[s] \"……언제나 이런 일을 반복해 오고 있던 거야?\""
10023105-42 = "…………."
10023105-43 = "선생님, 당신께서는 <돌>과 <예술품>이 구분되는 기준을 알고 계신가요?"
10023105-44 = "아무리 예술품이라고 한들, 모두가 그 가치를 온전히 알아보지는 못하는 법이죠."
10023105-45 = "앞서 말씀드렸다시피 그 온전한 가치를 알아볼 수 있는 것은 오로지 저뿐."
10023105-46 = "그렇다면 그러한 물건들은 제가 보관하는 게 맞지 않겠어요?"
10023105-47 = "[s] \"그것이 네가 물건을 훔치는 이유……?\""
10023105-50 = "네, 그것이야말로 아름다움에 대한 저의 사랑. 헌신과 자비…… 자애죠."
10023105-51 = "알아봐 주는 사람이 없다면, 영원히 어둠 속에 묻혀버릴지도 모르는 예술품들을, 언젠가 그 가치를 알아봐 줄 세상을 위해 남기고자 하는 것."
10023105-52 = "우리는 이름을 갖고 태어나지 못하니, 호칭이란 타인에 의해 규정되기 마련이죠."
10023105-53 = "세상은 저를 괴도라고 불렀고, 그래서 저는 거기에 약간의 수정을 가하기로 했어요."
10023105-54 = "……물론, 이런 저를 두고 세상 사람들은 이해할 수 없다. 그런 건 사랑이 아니다. 제정신이 아니다. 손가락질을 하고는 하지요."
10023105-55 = "그러니 당신께서 그렇게 생각하시는 것도 어쩔 수 없……."
10023105-56 = "[s] \"딱히……. 그런 식으로 생각하지는 않는데.\""
10023105-57 = "네……?!"
10023105-60 = "[ns1] \"물론 섣불리 이해할 수 있어, 라고 말할 수는 없어.\"\n[ns2] \"그래도 학생을 이해하려 노력하고 지켜보는 건\"\n[ns3] \"선생님의 역할이니까.\""
10023105-66 = "그런…… 대답은, 처음이네요."
10023105-67 = "그렇다면 선생님은, 괴도라는 학생을 이해할 수 있다고 생각하시나요?"
10023105-68 = "[s] \"어른으로서, 선생님으로서, 그렇게 하고 싶어.\""
10023105-69 = "……그 괴도라는 학생이, 어떻게 해도 이해하지 못하고 비뚤어진…… '아이'라면요?"
10023105-73 = "[ns] \"선생이란 건 말이지, 마지막까지 학생을 포기해서는 안 돼.\""
10023105-74 = "……!"
10023105-75 = "[s4] \"물론 그 학생이 너무 엇나가고, 자기 스스로를 힘들게 한다면.\"\n[s5] \"어느 정도 손을 잡아 이끌어 줄 필요는 있겠지만.\""
10023105-78 = "'그럼에도, 우리는 노력하는 것을 멈추지 말아야 한다'고요……?"
10023105-79 = "……"
10023105-80 = "한 가지만, 여쭤보아도 될까요."
10023105-81 = "이런 저라도, 선생님의 학생이라고 말할 수 있나요?"
10023105-82 = "[s] \"……응. 너는 여전히 내 학생이야.\""
10023105-83 = "……"
10023105-84 = "……아키라."
10023105-85 = "[s] \"응? 아키라?\""
10023105-86 = "네. 키요스미 아키라."
10023105-90 = "그게…… 제 진짜 이름이에요."
10023105-94 = "그러면 선생님. 다음에, 언젠가 또."
10023105-100 = "우아……"
10023105-101 = "이제 앞이 좀 보이네! 선생님, 괜찮아?"
10023105-102 = "선생님! 괜찮은 겁니까? 선생님은 특히 약하니까, 조심해야 합니다……"
10023105-103 = "일단 겉보기에는 문제없으신 것 같군요."
10023105-104 = "[s] \"응. 난 괜찮아.\""
10023105-106 = "저…… 그런데 표정이, 왜 그러세요……? 무언가 씁쓸한 듯한……"
10023105-107 = "혹시 무슨 안 좋은 일 당하신 거 아니죠? 괜찮으신 거 맞죠?"
10023105-108 = "[s6] \"괜찮아. 아무 문제도 없어.\"\n[s7] \"왕관은? 잃어버리거나 하지 않았지?\""
10023105-113 = "여기요……"
10023105-117 = "무사하죠?"
10023105-119 = "(유즈가 품속에서 조심스럽게 꺼낸 왕관을 보고, 모두는 안도의 한숨을 내쉬었다.)"
10023105-120 = "(자애의 괴도도, 메이타로도 놓치고 말았지만, 모두가 무사하다는 사실이 우리를 기쁘게 했다.)"
10023105-124 = "헉, 헉……! 따라오는 녀석은 없나? 좋아……"
10023105-125 = "아직 할 수 있어…… 포기하지 않는 한 길은 열려!"
10023105-126 = "난 알아. 안다고! 지금까지 그렇게 살아남아 왔으니까!"
10023105-128 = "그러냐? 그러면 이것도 피해 보라고."
10023105-132 = "누구─"
10023105-141 = "크헉?!"
10023105-153 = "뭐야, 별것도 아니었잖아."
10023105-154 = "뒷골목의 큰 손이니 뭐니 하더니, 그냥 이 정도 잔챙이었나. 하암."
10023105-155 = "다들 나와. 애들 보러 가자고."
