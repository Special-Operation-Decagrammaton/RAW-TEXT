[translation]
10002085-1 = "제8화;바다의 집 2"
10002085-2 = "바다의 집"
10002085-3 = "크흑……! 으윽…… 뭐, 뭐야…… 이 녀석들이 왜 여기 있는 거야……!?"
10002085-4 = "말도 안 돼…… 설마 이 녀석들이 바다의 집 주인과 같은 한패였다니!"
10002085-5 = "다른 사람이 열심히 만든 소중한 요리에 존중을 가져야죠! 기본 중의 기본!!"
10002085-6 = "기, 기본……!? 소중한 요리……!? 너희들…… 진심이냐!!"
10002085-7 = "크흑, 두고 보자! 언젠가는……! 언젠가는 이 빚을 꼭 갚아주마!!"
10002085-12 = "흐으으으~."
10002085-13 = "다들 정말 고마워! 덕분에 살았어! 하마터면 큰일 나는 줄 알았는데……"
10002085-14 = "덕분에 가게도 무사해!"
10002085-15 = "아닙니다. 이 정도는 정의실현부로서 당연히 해야 할 일이죠. 그보다 가게가 무사해서 다행이네요."
10002085-16 = "응! 정말 다행이야!"
10002085-17 = "그 대신이라기엔 뭐하지만……"
10002085-20 = "우선 이거 한 잔씩 마셔! 자, 여기!"
10002085-21 = "이건 내가 그냥 주는 거야! 감사의 선물이니까 공짜! 그냥 마셔도 돼!"
10002085-22 = "이런 답례를 바라고 한 일은 아닌데……"
10002085-23 = "……그나저나 이건 뭔가요? 주스……? 신기한 색을 한 주스네요."
10002085-24 = "괜찮대도, 마시고 맛을 같이 알아줬으면 하는 것도 겸하고 있으니까 말이야!"
10002085-25 = "자, 너도. 너도!"
10002085-26 = "가게가 무사한 것에 대한 축하의 의미야!"
10002085-27 = "모두 건배~!!"
10002085-34 = "건배애애~!!"
10002085-35 = "[s] 음료수를 마신다."
10002085-38 = "(……꿀꺽!)"
10002085-44 = "푸후우우우우우우웃-!!"
10002085-45 = "(나중에 알게 된 사실이지만, 그 때 마셨던 게 바로 <초코맛 해삼 주스>였다.)"
