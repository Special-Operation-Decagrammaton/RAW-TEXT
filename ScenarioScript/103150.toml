[translation]
103150-1 = "제15화;아트라하시스의 방주 점령전"
103150-2 = "적, 격퇴 확인!! 무사히 방어에 성공했습니다!"
103150-3 = "수고했어, 선생."
103150-4 = "주변에 수상한 움직임도 딱히 안 보이고……."
103150-10 = "우, 와아아아?! 뭐, 뭐야?! 폭발!?"
103150-11 = "포, 폭발이에요? 어, 어디서……?"
103150-21 = "!!"
103150-22 = "아, 으아아……?! 어, 언제 안으로……!?"
103150-26 = "[ns] \"시로코……?!\""
103150-27 = "……. 그렇네. 응. 결국 여기까지 와버렸구나."
103150-31 = "경고했는데도, 어째서……?"
103150-32 = "여기서 찾을 수 있는 건 죽음밖에 없을 텐데."
103150-33 = "시로코 선배!!!"
103150-43 = "멈춰!!"
103150-44 = "시로코 쨩……!?"
103150-45 = "시, 시로코 선배? 맞지?"
103150-54 = "안 돼요! 자, 잠깐만요, 시로코 쨩!?"
103150-57 = "기다려, 시로코-!!!"
103150-66 = "수, 수류탄-?!"
103150-75 = "[ns] \"호시노……!!\""
103150-78 = "콜록, 콜록……"
103150-79 = "괜찮아, 선생?"
103150-80 = "[s] \"아아…….\""
103150-81 = "콜록, 시로코 선배는?"
103150-82 = "사라졌어요……."
103150-83 = "역시…… 여기 있는 게 맞았어…… 시로코 쨩은."
103150-84 = "……. 그치만……. 어째서 이런……."
103150-86 = "……."
103150-90 = "흐음…… 방금 전의 폭발로 상태가 더 심해졌는데."
103150-91 = "엔지니어부? 들려? 지금 우트나피쉬팀의 배 상태를 체크해 줄 수 있어?"
103150-93 = "하아, 모두들 큰 부상이 없는 것만 해도 다행이야."
103150-94 = "전함 상태는 현재 체크 중인데……"
103150-95 = "끄응, 너덜너덜해졌네."
103150-96 = "방주와 부딪치면서 여러 부분에 문제가 생겼어. 방금의 폭발도 그렇고."
103150-97 = "지금부터 시스템 진단 및 대미지 분석에 들어가겠습니다. 그래도 너무 걱정하진 마세요."
103150-98 = "근본적인 수리는 불가능해도 다시 기동시키는 것 정도는 어떻게든 가능할 거니까요."
103150-99 = "응. 이걸 복구해야 너희들이 지상으로 무사히 돌아올 수 있으니까. 힘 내볼게."
103150-100 = "하지만 우리만으로는 시간이 걸리니까 그쪽 오퍼레이터들의 도움이 있어야 할 것 같아."
103150-102 = "누가 지원해 줄 수 있어?"
103150-104 = "내가 할게. 필요한 걸 말해줘."
103150-105 = "오오, 네! 감사합니다!"
103150-106 = "네. 그럼 부탁드리겠습니다."
103150-110 = "……. 히마리."
103150-111 = "방금 전의 시로코가 보여준 공간 이동은 아마 이 방주의 연산 능력을 활용한 것으로 보여."
103150-112 = "……. 으음. 네, 그럴 수도 있겠네요."
103150-113 = "이 아트라하시스의 방주는 기본적으로 차원 위상을 계산하는 연산장치. 그걸 이용해서 저렇게 공간을 옮겨 다닐 수 있는 거겠지."
103150-114 = "저 시로코는 이 방주를 사용하는 것에 익숙한 것 같네."
103150-115 = "그래서요, 리오?"
103150-116 = "방주의 연산 능력을 확보할 수 있다면, 아마 저것과 비슷한 물리적 공간 도약 시퀀스를 만들 수 있을 거야."
103150-117 = "공간 도약 시퀀스……?"
103150-118 = "<이름 없는 신들>의 기술은 키보토스에서 내가 제일 잘 알고 있어. 미래 예지도 제한적이지만 구현해 낸 적이 있으니까."
103150-119 = "이걸 활용하면, 단 한 번 정도겠지만. 그걸로 여기 있는 모두를 지상으로 이동시킬 수 있을 거야."
103150-120 = "흐음…… 과연."
103150-121 = "리오, 당신은…… 엔지니어부가 이 배를 수리하지 못할 거라고 생각하는군요?"
103150-122 = "……. 엔지니어부를 믿지 못한다는 게 아니라……."
103150-123 = "……네, 그렇죠. 당신은 빅 시스터였죠."
103150-124 = "모든 것을 알고 있고, 그렇기에 그 모든 것에 불안해하는……"
103150-126 = "마치, 신탁을 듣는 왕과 같은 사람."
103150-127 = "……?"
103150-128 = "당신의 불안과 강박은 대부분은 나쁜 문제를 일으켜 왔죠."
103150-129 = "동료를 신뢰하지 못하고, 오직 스스로만 옳다고 믿는 독선에 빠져서."
103150-130 = "……. 그래. 나는 이런 사람이야, 히마리."
103150-131 = "그건 아마 영원히 변하지 않겠지. 날 경멸해도 좋아."
103150-132 = "하지만 지금 이 배는 너와 선생님, 그리고 여기 있는 모두의 목숨이 걸려 있는 유일한 방법이야."
103150-133 = "그러니 계획이 실패했을 때를 대비하지 않으면 안 돼. 만의 하나라도, 절대 일어나지 않을 확률이라도."
103150-134 = "이런 상황이기에 나는……."
103150-135 = "당신을 경멸하지 않아요, 리오. 그냥 싫은 것뿐이지."
103150-136 = "이 차이는 꽤 크답니다?"
103150-140 = "……걱정해 줘서 고마워요. 리오."
103150-141 = "……뭐라고?"
103150-142 = "엔지니어부도 고마워할 거예요."
103150-143 = "자신들의 실패를 떠받쳐 줄 지지대가 생기는 거니까요."
103150-144 = "……그런가."
103150-145 = "우트나피쉬팀의 배가 없더라도 저희가 무사히 생환할 수 있는 방법…… 그런 게 있다면 분명 큰 도움이 될 거예요."
103150-146 = "부탁드릴게요. 리오."
103150-147 = "알겠어. 나에게 시간을 줘. 너희들이 점령전을 수행하는 동안 준비해 볼 테니까."
103150-148 = "그럼."
103150-152 = "……."
103150-155 = "아트라하시스의 방주에 진입하는 것까진 어떻게든 성공했습니다……."
103150-156 = "하지만 지금 저희는 적의 본거지 한가운데로 돌입한 상태…… 언제 적들의 공격이 시작되어도 이상하지 않은 상황."
103150-157 = "네. 아까와 같은 습격이 반복될지도 모릅니다."
103150-158 = "그러나 저희는 우트나피쉬팀의 배를 방어하는 것도 신경을 써야만 합니다……."
103150-162 = "엔지니어부가 우트나피쉬팀의 배를 복구하는 동안,"
103150-170 = "게임개발부와 대책위원회, 그리고 미식연구회는 적들의 습격에서 배를 방어하는 역할을 맡아주십시오."
103150-172 = "그동안 나머지 오퍼레이터들과 <샬레>는, 작전의 다음 단계로 넘어가야 합니다."
103150-173 = "다음 단계……."
103150-174 = "이제부터 진짜 시작이네……."
103150-175 = "네. 지금부터 저희는,"
103150-181 = "아트라하시스의 방주를 점령해서 탈취합니다."
