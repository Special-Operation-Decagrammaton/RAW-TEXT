[translation]
13390-1 = "제39화;제약 해제"
13390-2 = "호시노 선배!!"
13390-3 = "선배!!"
13390-4 = "호시노 선배!!"
13390-5 = "선배……."
13390-7 = "……. 되돌아올 수 있었구나. 어떻게…… 그런……."
13390-12 = "시로코 쨩, 세리카 쨩. 노노미 쨩. 아야네 쨩. ……그리고 시로코 쨩……."
13390-16 = "선도부…… 아니, [ruby=.]히[/ruby][ruby=.]나[/ruby] 쨩……."
13390-17 = "해후를 즐기는 건 일단 뒤로 미뤄."
13390-24 = "아아. 맞아. 저걸 먼저 처치해 볼까?"
13390-28 = "최후의, 최후의, 최후의 싸움이다!! [USERNAME] 선생이여-!!"
13390-29 = "지금까지 치사하게, 비겁하게 반칙을 저질러주었겠다아--!!"
13390-30 = "여기서 5번째 공략법을 꺼내겠다……!"
13390-31 = "히든 공략법, <반칙은 반칙으로 상대한다.>"
13390-32 = "히히, 히히히히-!!"
13390-33 = "마침내 해석을 완료했다, 너의 시스템을. 너의 강함을. 그딴 더러운 반칙 따위, 이제 전부 파훼할 수 있다!"
13390-34 = "모두 파악했어! 그것의 한계 효용은 정해져 있다. 그렇지?"
13390-35 = "선생의 지휘를 받을 수 있는 것은 4+2인이 최대."
13390-36 = "즉, <선생>이 한 번에 지휘할 수 있는 유닛의 한계는 최대 6명. 그 이상은 불가능하다!"
13390-37 = "그렇지, 그렇지이이-? 이건 지금까지의 모든 정보를 분석한 뒤에 내린 귀납적 진실이다!!"
13390-38 = "그렇다면, 나의 세계에서 온 <만신의 성좌>는 그것보다 더 강하기만 하면 된다. 그럼 나의 승리다!!"
13390-39 = "6명? ……히히, 아니, 거기 모여 있는 모든 녀석들을 상대해도 공략이 불가능한 존재로 각성시키겠다!!"
13390-40 = "즉, <세트의 분노>는 네 현재 시스템으로는 공략 불가능한 존재, 패배가 강요되는 존재다!!"
13390-41 = "어떠냐, 이게 반칙이다! 너의 치사한 것보다 훨씬 더-----"
13390-46 = "[ns1] \"오래 기다렸습니다.\"\n[ns2] \"마침내 이제 내가 활약할 차례네.\""
13390-49 = "네! 프라나 쨩이 <싯딤의 상자>의 깊은 곳에 잠겨 있던, 새로운 프로세스를 발견했어요!"
13390-50 = "프라나 쨩!"
13390-51 = "설명. 본래라면 기동 자체가 불가능한 프로세스입니다. 하지만, 아로나 선배와 저, 이렇게 두 명의 OS가 있는 지금의 <싯딤의 상자>라면……."
13390-52 = "지금까지의 제약을 벗어난 연산을 한정적으로 해낼 수 있습니다."
13390-53 = "선생님. 명령을."
13390-57 = "[ns] \"지금부터 소개하지. 우리들의 새로운 [ruby=컨텐츠]기술[/ruby]을.\""
13390-59 = "명령 확인."
13390-60 = "싯딤의 상자 제약 해제 프로세스 <베레스 웃사 Perez Uzzah> 한정 가동 개시."
13390-65 = "인증 완료."
13390-66 = "선생님의 접속 프로세스를 확인했습니다. 잘 부탁드립니다."
13390-67 = "싯딤의 상자 제약 해제 프로세스 <베레스 웃사> 한정 가동 중."
13390-68 = "대기 중. 선생님, 명령을 내려주십시오."
13390-69 = "지금의 저는 무적입니다. 평소보다 2배 강합니다."
13390-70 = "아로나 선배와 힘을 합쳐서, 선생님을 지원합니다."
13390-74 = "……!?"
13390-75 = "뭐라고……?"
13390-76 = "고정된 시스템을 뒤틀었다……고?"
13390-77 = "지금까지의 시스템의 제약을…… 해제…… 했다고……?"
13390-81 = "[ns3] \"이제 충분해.\"\n[ns4] \"더 이상 이 아비도스에서 그 누구도 죽게 두지 않겠어.\""
13390-90 = "[ns] \"더 이상 아비도스의 그 누구도 고통받게 두지 않겠어.\""
13390-94 = "무, 무슨 소릴 하는 거냐……?"
13390-95 = "뭐, 뭐냐? 그게 이 승패에…… 이 구도에 무슨 관계가 있다고……. 왜……? 무슨 소릴 대체……?"
13390-96 = "[ns] \"내 손이 닿는 세계에서 고통받고 있는 아이가 있다면,\""
13390-98 = "[ns] 내가 손 뻗을 수 있는 세계에서 그런 아이의 기도가 떠돌고 있다면,"
13390-100 = "[ns5] \"그것은 언제나,\"\n[ns6] 그것은 언제나,"
13390-103 = "[ns7] \"아이들과 같은 세계를 살아가는 어른의 책임이니까.\"\n[ns8] 아이들과 같은 세계를 살아가는 어른의 책임이니까."
13390-106 = "[ns9] \"[ruby=.]그[/ruby][ruby=.]렇[/ruby][ruby=.]게[/ruby] [ruby=.]되[/ruby][ruby=.]어[/ruby][ruby=.]선[/ruby] [ruby=.]안[/ruby][ruby=.]돼[/ruby].\"\n[ns10] [ruby=.]그[/ruby][ruby=.]렇[/ruby][ruby=.]게[/ruby] [ruby=.]되[/ruby][ruby=.]어[/ruby][ruby=.]선[/ruby] [ruby=.]안[/ruby][ruby=.]돼[/ruby]."
13390-110 = "[ns11] 어른의 카드를 꺼낸다.\n[ns12] 어른의 카드를 꺼낸다."
13390-113 = "저게 뭐야?!?"
13390-114 = "저건……"
13390-115 = "대체……"
13390-116 = "뭐야……?"
13390-117 = "어, 어…… 어어어?"
13390-118 = "[ruby=pay to win]어른의 카드[/ruby]-라고????"
13390-119 = "그, 그, 그런 게…… 그런 게 어디 있어……."
13390-120 = "룰은……? 이 코덱스는……?"
13390-121 = "승리는……? 스, 승패에…… 저, 저, 저런 게 있으면……."
13390-122 = "뭐야, 저게, 저건, 저건, 저건, 저건, 룰 위반이잖아, 반칙이잖아……."
13390-123 = "저러면 안 되는 거잖아…… 저딴 게 어딨어, 게임은 이러면 안 되는 거잖아……? 아, 아아?"
13390-124 = "저런 걸 어떻게 이겨?? 바, 바, 바, 반칙이잖아? 반칙……."
13390-125 = "반칙, 반칙, 반칙, 반칙이잖아!"
13390-126 = "반칙이야아-!!!"
13390-127 = "날 속였어!!!"
13390-128 = "무효, 무효, 무효야! 무효!! 이 게임은 무효다!!"
13390-129 = "무효-------!!"
13390-130 = "강제 연결 확인."
13390-131 = "--------!??"
13390-132 = "지금부터 선생님의 메시지를 전합니다. <지하생활자>. 경청하십시오."
13390-137 = "[ns13] \"이 세계를 승리와 패배로밖에 정의하지 못하는 애송이는,\"\n[ns14] \"어른의 힘으로 혼내줄 수밖에 없는 거겠지.\""
13390-140 = "무, 뭐, 뭐, 뭐라고…………?!"
13390-142 = "즉, 어른이 되지 못한 너 같은 애송이와 놀아주고 있을 시간은 없다는 뜻입니다."
13390-143 = "……!!!!"
13390-147 = "선생님은 어른이시라 바쁘시니까요. 참고로 어제도 밤샘 작업을 하셨습니다."
13390-148 = "(프라나 쨩…… 어쩐지 무서워…….)"
