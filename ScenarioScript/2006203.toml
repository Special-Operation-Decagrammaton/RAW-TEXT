[translation]
2006203-1 = "설득도 화학!"
2006203-2 = "183호 특별반"
2006203-3 = "(에리나의 공부를 응원할 겸, 간식을 사서 183호에 왔다.)"
2006203-9 = "으윽…… 그림으로 좀 설명하지, 글씨만 잔뜩……."
2006203-10 = "'토크란…… 어떤 고정된 회전축을 중심으로 작용하는……'"
2006203-11 = "그렇군, 그래…… 하아……."
2006203-12 = "'……지점으로부터 멀어질수록, 회전하는 힘은 커진다.'"
2006203-13 = "'이 원리를 이용해서-'"
2006203-14 = "아휴…… 하기 싫어……."
2006203-15 = "[s1] \"멋있다, 에리나!\"\n[s2] \"싫어도 열심히 공부하다니, 아주 기특한걸!\""
2006203-18 = "오, 선생님! 언제 오셨어요?"
2006203-19 = "좋아! 선생님도 오셨으니, 오늘 공부는 여기서 영업 종료!"
2006203-20 = "[s3] \"선생님인데 공부의 방해를 해버렸다?!\"\n[s4] \"공부 응원하려고 온 건데!!\""
2006203-23 = "꺄하하! 농담이에요, 농담! 진짜 리액션 좋으시다니깐!"
2006203-24 = "벌써 8시간째 공부하기도 했고, 마침 딱 쉬고 싶었어요!"
2006203-25 = "[s] \"공부가 싫은데도 엄청 성실하구나……\""
2006203-26 = "공부는 엄청 싫지만, 공부의 결과물인 지식은 좋아하니까요. 으히히♪"
2006203-27 = "지식이 많으면 할 수 있는 일이 많아지고, 설득력이 올라가잖아요!"
2006203-28 = "[s] \"설득력? 무슨 공부를 했는데?\""
2006203-29 = "아! 그거야 당연히……."
2006203-30 = "……그, 단어가 뭐였더라……."
2006203-31 = "맞다! 프로레슬링 기술 공부예요! 폐지함에서 마침 좋은 게 있어서 가져왔어요!"
2006203-32 = "말싸움할 때마다 서로 설득이 안 되면 레슬링으로 결판짓는데 말이죠-"
2006203-33 = "최근 들어서 기술적으로 뭔가 부족한 것 같기도 하고, 매번 똑같은 기술만 쓰니까 이제 간파당하는 것 같아서요. 그래서 공부하고 있었어요!"
2006203-34 = "사진이나 영상도 아니라 글로만 이해하다 보니 조금 얼렁뚱땅이긴 한데……."
2006203-35 = "아, 그렇지! 선생님, 저하고 같이 프로레슬링 할래요?"
2006203-36 = "[s] \"네?\""
2006203-37 = "앗, 당연히 전력으로 하지는 않을 거예요! 진짜 힘주지는 않을 거고, 기술만 받아주세요!"
2006203-38 = "상대해 주시면 진짜 도움 많이 될 거예요! 도와주실 거죠? 네? 선생님?"
2006203-39 = "[s5] \"어, 으응…….\"\n[s6] 이 순수한 미소를 지켜주기로 한다."
2006203-42 = "선생님 최고! 진짜 최고예요!"
2006203-43 = "그러면 일단 제일 궁금했던 4자 다리 꺾기부터 해볼게요!"
2006203-44 = "누워서 왼쪽 다리 들어보세요! 자아, 힘 빼고~"
2006203-45 = "[s] \"네, 네엡…….\""
2006203-47 = "그러면, 선생님 다리를 오른손으로 잡고, 선생님을 바라보고- 시계방향으로 돌면서-"
2006203-48 = "숫자 4처럼 보이도록 선생님 다리를 꼬고- 4 한가운데에 내 오른다리를 넣고서-"
2006203-49 = "뒤로 넘어지면 완성! 오! 확실히 숫자 4처럼 보이네요!"
2006203-50 = "아프지 않으시죠? 괜찮죠?"
2006203-51 = "[s7] \"아프지는 않아! 괜찮은데-!\"\n[s8] \"이 정도면 충분하지?! 그렇지?!\""
2006203-54 = "네! 충분해요! 해보니까 생각보다 쉬워서 다음에 바로 써먹을 수 있겠네요!"
2006203-56 = "역시 배울 때는 선생님의 도움이 최고네요!"
2006203-57 = "그러면 이제 풀어볼게요--"
2006203-62 = "……어라?"
2006203-66 = "으음-? 응? 어라?"
2006203-67 = "이거 왜 안 풀리…… 지……?"
2006203-68 = "아, 아하하! 걱정하지 마세요! 위상수학 공부를 했었거든요!"
2006203-69 = "이렇게 다리가 얽힌 건, 위상수학에서 말하는 두 개의 고리로 된 호프링크 상태잖아요? 이론적으로는 풀 수 있어요! 책에서 봤어요!"
2006203-70 = "[s] \"오오! 어떻게 풀 수 있는데?!\""
2006203-71 = "아, 그건요!"
2006203-75 = "……."
2006203-76 = "으아앙! 그건 책 뒷부분에 있어서 몰라요! 지겹다고 관두지 말고 끝까지 읽을걸, 으아앙-!"
2006203-77 = "그렇지! 화, 화학으로 해결해 볼까요?! 윤활유를 충분히 뿌리면 꼬인 다리 사이의 전단저항이 줄어들어서 풀릴 거니까요!"
2006203-78 = "쉽게 말해서! 기름 뿌려서! 미끌미끌! 해볼게요!!"
2006203-79 = "[ns] \"더더욱 안 돼!!\""
2006203-81 = "(이후, 에리나를 겨우 진정시켰다.)"
2006203-82 = "(에리나가 분해는 조립의 역순임을 떠올려서, 다행히 풀려날 수 있었다.)"
