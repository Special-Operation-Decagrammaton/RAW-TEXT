2006203-56 = "3;에리나;03;역시 배울 때는 선생님의 도움이 최고네요!\n#3;em;[음표]\n#3;closeup"
2006203-57 = "3;에리나;00;그러면 이제 풀어볼게요--\n#3;closeup"
