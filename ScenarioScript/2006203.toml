[translation]
2006203-1 = "説得も化学！"
2006203-2 = "183号特別クラス"
2006203-3 = "（エリナを励まそうと差し入れを持って183号に来た）"
2006203-4 = ""
2006203-6 = ""
2006203-7 = ""
2006203-8 = ""
2006203-9 = "うぅ……文字ばっか。イラストくらい入れてよぉ……。"
2006203-10 = "「トルクとは……ある固定された回転軸を中心にはたらく――」"
2006203-11 = "なるほど……はぁ……。"
2006203-12 = "「……支点からの距離が長くなればなるほど、回転する力は大きくなる」"
2006203-13 = "「この原理を利用し――」"
2006203-14 = "あー……やりたくなーいー……。"
2006203-15 = "[s1] \"かっこいいぞー！エリナ！\"\n[s2] \"嫌いな勉強頑張ってえらいね！\""
2006203-18 = "あれ、先生？いつ来たんです？"
2006203-19 = "よしっ！先生も来たことだし、今日の勉強はここまでっ！"
2006203-20 = "[s3] \"勉強の応援に来たのに！\"\n[s4] \"むしろ邪魔しちゃった！？\""
2006203-23 = "あははっ！冗談ですよじょーだん！ほんといいリアクションしますね！"
2006203-24 = "もうそろ8時間経つし、休憩したいと思ってたトコなんです。"
2006203-25 = "[s] \"勉強嫌いとは思えないくらい真面目だね……。\""
2006203-26 = "勉強は大嫌いだけど、知識は好きなんで。えへへ♪"
2006203-27 = "知識があれば出来ることが増えますし、説得力も増しますからねっ！"
2006203-28 = "[s] \"説得力？何の勉強をしたの？\""
2006203-29 = "えーっとですね～"
2006203-30 = "あー……なんだっけ、なんて言うんだっけ……。"
2006203-31 = "そう！プロレスの技の勉強です！#n古紙回収ボックスに良さげなものがあったんで持ってきました！"
2006203-32 = "説得できなかった時、いつもレスリングでケリをつけるんですけど――"
2006203-33 = "最近なんか技術不足な気がするし、#n同じ技ばっかだからそろそろパターン読まれてる気がするんですよね～なので勉強してました！"
2006203-34 = "写真とか動画は見てないので、なんとなくの理解なんですけど……。"
2006203-35 = "あっ、そうだ！先生も一緒にプロレスしません？"
2006203-36 = "[s] \"え？\""
2006203-37 = "もちろん全力ではやりませんから！技だけ試したいんです！"
2006203-38 = "相手してくれたらほんとーに助かります！手伝ってくれますよね、ね？先生？"
2006203-39 = "[s5] \"あ……う、うん……。\"\n[s6] （このまっすぐな笑顔を守ってあげよう）"
2006203-42 = "やたー！先生さいこー！ほんっとさいこー！"
2006203-43 = "んじゃ、一番気になってた足4の字固めからいきますね！"
2006203-44 = "仰向けになって左足をあげてみてください！はい、力抜いて～"
2006203-45 = "[s] \"わ、分かった……。\""
2006203-47 = "そしたら先生の左足を右手で持って、時計回りに回る。"
2006203-48 = "数字の4の形に先生の足をひねって、4の真ん中に私の右足を入れる……。"
2006203-49 = "最後に、後ろに転べば完成～！おおっ、本当に4に見えますね！"
2006203-50 = "大丈夫ですか？痛かったら言ってくださいね！"
2006203-51 = "[s7] \"痛くはない……けど！\"\n[s8] \"そろそろ解いてもいいんじゃないかな！？\""
2006203-54 = "はい、もう大丈夫です！思ったより簡単だったんで実戦で使ってみます！"
2006203-55 = ""
2006203-56 = "やっぱり先生に手伝ってもらうのが一番ですね！"
2006203-57 = "それじゃ外しますよ～"
2006203-58 = ""
2006203-60 = ""
2006203-61 = ""
2006203-62 = "……あれ？"
2006203-63 = ""
2006203-65 = ""
2006203-66 = "ん～？あれれ～？"
2006203-67 = "なんか……外れ、ない……。"
2006203-68 = "あ、あははっ！心配しないでくださいね！位相幾何学の勉強もしたんで！"
2006203-69 = "この形なら、本で見ました！理論的には解除可能なはずっ！"
2006203-70 = "[s] \"おお！！どうやるの！？\""
2006203-71 = "それはですね～！"
2006203-72 = ""
2006203-74 = ""
2006203-75 = "……。"
2006203-76 = "うわーん！本の後半に書いてあったので分かりません！#n最後まで読んでおけばよかった～！"
2006203-77 = "そうだ！こんな時こそ化学の力を借りましょう！#n潤滑油をたっぷりかければ絡まった足同士の抵抗が減って取れるはず！"
2006203-78 = "名付けて！油でぬるぬる作戦！いざ！！"
2006203-79 = "[ns] \"もっとダメーーっ！！\""
2006203-81 = "（なんとかエリナを落ち着かせた）"
2006203-82 = "（組み立ての逆の手順で分解できることを思い出し、なんとか抜け出せた）"
