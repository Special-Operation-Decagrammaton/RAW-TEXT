2006203-66 = "3;에리나;04;으음-? 응? 어라?\n#3;closeup"
2006203-67 = "3;에리나;20;이거 왜 안 풀리…… 지……?\n#3;closeup\n#3;em;[땀]"
2006203-68 = "3;에리나;20;아, 아하하! 걱정하지 마세요! 위상수학 공부를 했었거든요!\n#3;closeup"
2006203-69 = "3;에리나;14;이렇게 다리가 얽힌 건, 위상수학에서 말하는 두 개의 고리로 된 호프링크 상태잖아요? 이론적으로는 풀 수 있어요! 책에서 봤어요!\n#3;closeup"
2006203-70 = "[s] \"오오! 어떻게 풀 수 있는데?!\""
2006203-71 = "3;에리나;00;아, 그건요!\n#3;closeup"
2006203-72 = "#st;[0,0];instant;1;"
2006203-74 = "3;에리나;00\n#3;closeup\n#3;em;[...]\n#wait;2500"
2006203-75 = "3;에리나;06;…….\n#3;closeup"
2006203-76 = "3;에리나;26;으아앙! 그건 책 뒷부분에 있어서 몰라요! 지겹다고 관두지 말고 끝까지 읽을걸, 으아앙-!\n#3;shake\n#3;em;[훌쩍]\n#3;closeup"
2006203-77 = "3;에리나;06;그렇지! 화, 화학으로 해결해 볼까요?! 윤활유를 충분히 뿌리면 꼬인 다리 사이의 전단저항이 줄어들어서 풀릴 거니까요!\n#3;closeup\n#3;jump"
2006203-78 = "3;에리나;25;쉽게 말해서! 기름 뿌려서! 미끌미끌! 해볼게요!!\n#3;closeup"
2006203-79 = "[ns] \"더더욱 안 돼!!\""
