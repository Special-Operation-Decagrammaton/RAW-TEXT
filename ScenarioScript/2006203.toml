[translation]
2006203-1 = "#title;설득도 화학!"
2006203-2 = "#place;183호 특별반"
2006203-3 = "#na;(에리나의 공부를 응원할 겸, 간식을 사서 183호에 왔다.)"
2006203-4 = "#st;[0,0];instant;1;"
2006203-6 = "3;에리나;09\n#3;a\n#wait;1000"
2006203-7 = "3;에리나;09\n#wait;1000\n#3;greeting"
2006203-8 = "3;에리나;09\n#wait;1000\n#3;greeting"
2006203-9 = "3;에리나;06;으윽…… 그림으로 좀 설명하지, 글씨만 잔뜩…….\n#3;em;[속상함]"
2006203-10 = "3;에리나;09;'토크란…… 어떤 고정된 회전축을 중심으로 작용하는……'"
2006203-11 = "3;에리나;10;그렇군, 그래…… 하아…….\n#3;em;[한숨]"
2006203-12 = "3;에리나;09;'……지점으로부터 멀어질수록, 회전하는 힘은 커진다.'\n#3;greeting"
2006203-13 = "3;에리나;06;'이 원리를 이용해서-'"
2006203-14 = "3;에리나;10;아휴…… 하기 싫어…….\n#3;greeting"
2006203-15 = "[s1] \"멋있다, 에리나!\"\n[s2] \"싫어도 열심히 공부하다니, 아주 기특한걸!\""
2006203-18 = "3;에리나;22;오, 선생님! 언제 오셨어요?\n#3;em;[!]"
2006203-19 = "3;에리나;03;좋아! 선생님도 오셨으니, 오늘 공부는 여기서 영업 종료!\n#3;greeting"
2006203-20 = "[s3] \"선생님인데 공부의 방해를 해버렸다?!\"\n[s4] \"공부 응원하려고 온 건데!!\""
2006203-23 = "3;에리나;19;꺄하하! 농담이에요, 농담! 진짜 리액션 좋으시다니깐!\n#3;em;[음표]"
2006203-24 = "3;에리나;00;벌써 8시간째 공부하기도 했고, 마침 딱 쉬고 싶었어요!"
2006203-25 = "[s] \"공부가 싫은데도 엄청 성실하구나……\""
2006203-26 = "3;에리나;19;공부는 엄청 싫지만, 공부의 결과물인 지식은 좋아하니까요. 으히히♪"
2006203-27 = "3;에리나;11;지식이 많으면 할 수 있는 일이 많아지고, 설득력이 올라가잖아요!"
2006203-28 = "[s] \"설득력? 무슨 공부를 했는데?\""
2006203-29 = "3;에리나;02;아! 그거야 당연히……."
2006203-30 = "3;에리나;04;……그, 단어가 뭐였더라…….\n#3;em;[땀]"
2006203-31 = "3;에리나;03;맞다! 프로레슬링 기술 공부예요! 폐지함에서 마침 좋은 게 있어서 가져왔어요!\n#3;jump"
2006203-32 = "3;에리나;13;말싸움할 때마다 서로 설득이 안 되면 레슬링으로 결판짓는데 말이죠-"
2006203-33 = "3;에리나;14;최근 들어서 기술적으로 뭔가 부족한 것 같기도 하고, 매번 똑같은 기술만 쓰니까 이제 간파당하는 것 같아서요. 그래서 공부하고 있었어요!"
2006203-34 = "3;에리나;00;사진이나 영상도 아니라 글로만 이해하다 보니 조금 얼렁뚱땅이긴 한데……."
2006203-35 = "3;에리나;03;아, 그렇지! 선생님, 저하고 같이 프로레슬링 할래요?\n#3;jump"
2006203-36 = "[s] \"네?\""
2006203-37 = "3;에리나;02;앗, 당연히 전력으로 하지는 않을 거예요! 진짜 힘주지는 않을 거고, 기술만 받아주세요!"
2006203-38 = "3;에리나;03;상대해 주시면 진짜 도움 많이 될 거예요! 도와주실 거죠? 네? 선생님?\n#3;em;[반짝]"
2006203-39 = "[s5] \"어, 으응…….\"\n[s6] 이 순수한 미소를 지켜주기로 한다."
2006203-42 = "3;에리나;03;선생님 최고! 진짜 최고예요!\n#3;hophop"
2006203-43 = "3;에리나;00;그러면 일단 제일 궁금했던 4자 다리 꺾기부터 해볼게요!"
2006203-44 = "3;에리나;11;누워서 왼쪽 다리 들어보세요! 자아, 힘 빼고~"
2006203-45 = "[s] \"네, 네엡…….\""
2006203-47 = "#na;에리나;그러면, 선생님 다리를 오른손으로 잡고, 선생님을 바라보고- 시계방향으로 돌면서-"
2006203-48 = "#na;에리나;숫자 4처럼 보이도록 선생님 다리를 꼬고- 4 한가운데에 내 오른다리를 넣고서-"
2006203-49 = "#na;에리나;뒤로 넘어지면 완성! 오! 확실히 숫자 4처럼 보이네요!"
2006203-50 = "#na;에리나;아프지 않으시죠? 괜찮죠?"
2006203-51 = "[s7] \"아프지는 않아! 괜찮은데-!\"\n[s8] \"이 정도면 충분하지?! 그렇지?!\""
2006203-54 = "#na;에리나;네! 충분해요! 해보니까 생각보다 쉬워서 다음에 바로 써먹을 수 있겠네요!"
