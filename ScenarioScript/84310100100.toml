[translation]
84310100100-6 = "어라…… 조금 소란스럽네요. 무슨 일 있으신가요?"
84310100100-11 = "아, 유리조노 세이아. 마침 잘 왔어. 그러잖아도 할 말이 있었거든."
84310100100-13 = "할 말이요? 저에게?"
84310100100-14 = "뭔가 시키실 일이라도 생긴 건가요?"
84310100100-15 = "반대야, 반대. 그만 좀 시키라고 하고 있었던 거니까."
84310100100-16 = "……네? 그게 무슨……"
84310100100-17 = "아무리 기꺼이 도와준다고 말했다지만 그래도 일 시키는 게 너무 잦잖아. 이래서야 누가 손님이고 누가 대접하는 사람인지 모르겠다고."
84310100100-21 = "너, 솔직히 말해. 여기 엑스포 견학하러 왔다는 사실도 제대로 기억 못 하고 있지? 반쯤은 임무 하러 왔다고 생각하고 있는 거 아냐?"
84310100100-22 = "그게 무슨……"
84310100100-26 = "……아니라고는 말씀드릴 수 없겠네요. 솔직히."
84310100100-27 = "이것 봐, 이것 봐. 말이 되냐고, 이게."
84310100100-29 = "하지만 이건 유리조노 세이아도 스스로 원했던……"
84310100100-30 = "사람 생각은 어제 다르고 오늘이 다른 법이야!"
84310100100-35 = "스스로 원했다고 해서 이렇게 며칠 씩이나 당연하다는 듯 부려 먹으면 곤란하다니까!?"
84310100100-36 = "아, 아니요. 네루. 저는 정말로 괜찮습니다. 신경 써 준 건 고맙지만요."
84310100100-37 = "그리고……"
84310100100-38 = "……선생한테도 한 소리 들었고 말이지."
84310100100-40 = "……!"
84310100100-42 = "선생님……께서? 저희에게요?"
84310100100-43 = "아니, 한 소리 들었다고 하니까 막 뭐라 한 걸로 오해할 수 있겠는데…… 그런 건 아니고."
84310100100-44 = "하루이틀 정도라도 순수하게 엑스포를 즐기는 날도 있으면 좋겠다-라고 말했다고."
84310100100-45 = "잘 돌려서 말했지만, 그게 그 소리 아니야?"
84310100100-50 = "……확실히. 사과해야겠군."
84310100100-52 = "아뇨. 다시 말씀드리지만 사과할 일은 아니에요. 어디까지나 제가 먼저 하고 싶다고 했고, 리오는 그걸 받아 주었을 뿐이니까요."
84310100100-53 = "하지만…… 그러네요. 선생님께서 하신 말씀도 이해는 갑니다."
84310100100-54 = "이곳에 온 본질적인 이유도, 조금은 챙겨 둬야 아쉬움이 없겠지요."
84310100100-55 = "그래야겠어. 하루이틀 정도는 이쪽 일에 신경 쓰지 말고, 회장을 돌며 엑스포를 순수하게 즐겨줬으면 해."
84310100100-56 = "그래. 뭐 어차피 이쪽에서 무슨 일 좀 생긴다고 해도, 나랑 이 녀석이 알아서 처리하면 되니까."
84310100100-57 = "쳇. 선생도 이런 이야기는 직접 해도 될 건데, 굳이 나한테 하고 말이야. 잔소리꾼 같으니."
84310100100-59 = "(……두 사람 사이에는 그런 분위기도 있나 보군요.)"
84310100100-60 = "(네루에 대한 선생님의 신뢰는 굉장하군요. 조금 부럽다는 생각도 드네요. 그것도 그녀가 지금까지 보여준 행동들에 대한 보답이겠지요.)"
84310100100-61 = "알겠습니다. 그러면 모두들 그렇게 말씀하시니…… 오늘은 저도 다 잊고, 엑스포 회장을 둘러보다 오겠습니다."
84310100100-63 = "그래. 잘 다녀오라고."
84310100100-64 = "잘 다녀와. 혹시라도 무슨 일 생기면 말하고."
84310100100-66 = "후후, 그럴게요."
