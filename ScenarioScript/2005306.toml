[translation]
2005306-1 = "닌자 소녀는 트렌드에 뒤쳐지지 않아!"
2005306-3 = "[ns]\"미치루?\""
2005306-8 = "도-모, 선생 공. 미치루입니다."
2005306-12 = "[ns]\"누, 누구세요?!\""
2005306-13 = "에에?! 무슨 소리를 하는 거야?!"
2005306-14 = "방금 미치루라고 말했잖아?!"
2005306-15 = "[s1] \"이렇게 공손하게 문을 노크하고 들어오다니…….\"\n[s2] \"나의 미치루는 이렇지 않아!\""
2005306-18 = "우냐악! 대체 평소에 나를 어떻게 생각하고 있었던 거야?!"
2005306-19 = "……아, 아냐, 말하지 마! 사실 알 것 같으니까."
2005306-20 = "아무튼, 오늘은 말이지!"
2005306-21 = "무려 이 몸께서, ‘브리핑’이라는 것을 준비해 왔다고?"
2005306-22 = "[s]\"브리핑?\""
2005306-23 = "후후, 맞아."
2005306-24 = "바로 <소녀인법첩 미치룻치 채널 성장의 비책 및 그 청사진에 대한 프레젠테이션 브리핑>을 말이야……!"
2005306-25 = "어때? 선생 공도 기다리고 있던 주제였지?"
2005306-26 = "[s]\"아, 저번에 모모톡으로 말했던 게 이거였구나.\""
2005306-27 = "바로 그거야!"
2005306-28 = "이상한 방법에 의존하지 않고, 온전히 나의 머릿속에서 짜낸 비책……!"
2005306-29 = "자, 지금부터 그 비책의 브리핑을 시작하겠소이다!"
2005306-30 = "그래서 결론부터 말하자면!"
2005306-31 = "[s]\"시작과 동시에 결론이야?!\""
2005306-32 = "그, 아, 아무튼!"
2005306-33 = "어쨌든 결론은, 앞으로는 영상을 만들 때 최신 트렌드를 더 많이 반영하겠다는 거야!"
2005306-34 = "닌자와 관련된 이야기를 조금은…… 줄여서라도 말이지!"
2005306-35 = "[s3] \"닌자 채널에서 닌자 이야기를 줄이다니…….\"\n[s4] \"그래도 괜찮겠어?\""
2005306-38 = "후후, 10보 전진을 위한 1보 후퇴라고 해두자고, 선생 공."
2005306-39 = "일단 생각해 봐. 많은 사람들이 영상을 보러 들어오는 가장 큰 이유가 무엇일 것 같아?"
2005306-40 = "그것은 바로…… 높은 조회수야!"
2005306-41 = "[s5] \"높은 조회수를 만들기 위해 필요한 것이 높은 조회수라니…….\"\n[s6] \"미치루, 이야기가 안 끝난다.\""
2005306-44 = "아니! 일단 어떻게든 조회수를 높여 놔야 사람들이 유입된다는 말이야!"
2005306-45 = "조작 프로그램 같은 불법적인 방법만 아니라면, 수단 방법을 가리지 않고 일단 조회수를 높이는 게 중요하다는 거지!"
2005306-46 = "그래야 처음 우리 채널에 오는 사람들도 안심하고 영상을 볼 거고!"
2005306-47 = "그리고 바로 이를 위해서, 최신 트렌드를 반영한 영상을 올리겠다고 결정했다, 이거지!"
2005306-48 = "[s]\"그럼 어떤 트렌드를 반영할 건데?\""
2005306-49 = "후후, 좋은 질문이야, 선생 공."
2005306-50 = "내가 이번에 택한 트렌드 키워드는 바로…… ‘패션’이야!"
2005306-51 = "[s]\"패션……?\""
2005306-52 = "맞아. 대세는 ‘패션’이야."
2005306-53 = "사실 내가 얼마 전에 <인기도 폭등 동영상>의 리스트를 쭉 분석해 봤거든?"
2005306-54 = "그런데 그 리스트 최상위권이 전부 패션과 관련된 내용이었단 말이지!"
2005306-55 = "<매일 입어도 질리지 않는 7가지 티셔츠>, <퍼스널 컬러로 알아보는 나만의 수류탄>, <당신의 총기와 어울리는 코트 디자인> 등등……."
2005306-56 = "그래서 나도 패션을 주제로 영상을 기획해 봤지!"
2005306-57 = "[s]\"오, 어떤 내용인데?\""
2005306-58 = "그건 바로……"
2005306-59 = "패션과 인법의 컬래버레이션!"
2005306-60 = "패션과 접목한 인법들을 구상해서 매주 한 편씩 쭉 올릴 생각이야!"
2005306-61 = "그리고 이것들로 최대한 많은 구독자를 끌어모은 뒤……."
2005306-62 = "은근슬쩍 본격적인 닌자 콘텐츠를 조금씩 올리기 시작한다면……!"
2005306-63 = "사람들은 자기도 모르게 조금씩 닌자의 매력에 젖어 들어가게 되겠지!"
2005306-64 = "마치 끓는 물 속의 개구리처럼 말이야!"
2005306-65 = "[s]\"비유가 살벌해!\""
2005306-66 = "아무튼! 이상으로 브리핑은 끝!"
2005306-67 = "이 이후의 이야기는…… 결과로 보여주겠다고!"
2005306-68 = "그러니 이번에도 기다리고 있으라고, 선생 공!"
2005306-69 = "이 미치루! 초 유명 인플루언서가 되어서 선생 공을 매니저로 섭외하러 다시 찾아올 테니까!"
2005306-70 = "그럼 오늘은 이만! 아디오스=SAYONARA!"
2005306-76 = "(……연막을 터뜨렸지만, 미치루가 어디로 나갔는지 다 알 것 같았다.)"
2005306-78 = "(며칠 뒤.)"
2005306-80 = "(오늘도 잔뜩 밀린 서류 작업을 처리하던 중…….)"
2005306-81 = "선생 공……."
2005306-85 = "나 좀 도와줘어어……."
2005306-86 = "[s7] \"미치루! 역시 성공해서 나를 데리러 왔구나!\"\n[s8] \"나를 이 서류 지옥에서 구해줘……!\""
2005306-89 = "아니…… 나도 도와달라고 온 건데……!"
2005306-90 = "[s]\"……엥?\""
2005306-91 = "사실 이번에 패션과 인법을 주제로 한 영상을 올렸거든?"
2005306-92 = "그런데 이상할 정도로 반응이 안 좋아……."
2005306-93 = "싫어요가 이전 영상의 몇 배가 넘게 찍혀 버렸다고……!"
2005306-94 = "[s]\"혹시 댓글 반응이랑 영상도 확인해 봤어?\""
2005306-95 = "……아니."
2005306-96 = "사실 지금 무서워서 댓글도 영상도 못 열어보고 있어……."
2005306-97 = "그래서 선생 공을 찾아온 거야…… 나랑 같이 영상이랑 댓글 좀 확인해 달라고 부탁하고 싶어서……."
2005306-98 = "[s] \"……정말로 내가 봐도 괜찮다면…… 도와줄게.\""
2005306-99 = "부탁해, 선생 공……."
2005306-101 = "(그렇게, 미치루의 영상을 검토하기 시작했다.)"
2005306-106 = "백귀야행의 제38번 구교사의 어느 교실"
2005306-107 = "소녀인법첩, 미치룻치~."
2005306-108 = "도-모, 미치루입니다."
2005306-109 = "자, 오늘 선보일 인법은 <옷 갈아입기의 술>!"
2005306-110 = "숙달한다면 복잡한 옷도 순식간에 환복할 수 있는 비장의 실용 인법!"
2005306-111 = "그러나 백문이 불여일견인 법."
2005306-112 = "일단 먼저 시범을 보이도록 하겠습니다!"
2005306-113 = "하지만 만일의 사태에 대비해서……."
2005306-114 = "으럇!"
2005306-119 = "[ns](카메라 렌즈의 뚜껑을 닫았다?!)"
2005306-121 = "짜잔!"
2005306-122 = "자! 이렇게 순식간에 옷을 갈아입었다고!"
2005306-123 = "자, 그럼 이 인법의 원리에 대해서 말해볼 텐데……."
2005306-124 = "(……영상이 끝날 때까지, 렌즈에 씌워진 뚜껑은 벗겨지지 않았다.)"
2005306-125 = "(그렇게 분량의 대부분이 암전인 영상이 올라가게 된 것이었다.)"
2005306-126 = "샬레 사무실"
2005306-127 = "……."
2005306-128 = "[ns]\"…….\""
2005306-129 = "으아아아, 이, 이, 이런 초보적인 실수를……!"
2005306-130 = "우, 우냐아아악……!"
2005306-136 = "(……많이 당황했던 탓인지, 평소와 달리 연막탄도 터뜨리지 않고 사라진 미치루였다.)"
