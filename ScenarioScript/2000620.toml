[translation]
2000620-1 = "스케이트보드를 타는 이유"
2000620-2 = "(사야의 안내를 받아, 근처의 공원으로 향했다.)"
2000620-7 = "(아직 텅 빈 공원 가운데에서, 뭔가를 준비하고 있던 사야를 발견했다.)"
2000620-15 = "……아! 선생! 이쪽이다, 이쪽!"
2000620-16 = "역시 선생도 기대를 하고 있었던 게지? 나님의 발명품!"
2000620-17 = "잘 온 것이다. 이 위대한 신작을 가장 먼저 볼 수 있는 기회를 주는 것이다!"
2000620-18 = "……응? 이것들?"
2000620-19 = "무슨 발명품이냐고? 아아. 이건 말이지……."
2000620-20 = "으음. 어떻게 설명해야 할까. 선생이 가장 이해하기 쉽게 설명하자면……."
2000620-21 = "일종의……. 향수!"
2000620-22 = "그래. 이곳 공원 일대에 향기를 뿌려줄 향수인 것이다!"
2000620-23 = "[s1] \"……그건 그냥 방향제 아냐?\"\n[s2] \"그러니까 방향제라는 뜻이지?\""
2000620-26 = "에잇! 다르다! 그렇게 말해버리면 나님의 작품이 세간의 다른 것들과 비슷한 수준으로 격하돼 버리는 것이다!"
2000620-27 = "이건 격이 다른 물건이란 말이다. 거리에 뿌려 두기만 해도 은은하게 공원 전체를 감싸 줄 것이다. 보통의 방향제로는 어림도 없는 일!"
2000620-28 = "향수다, 향수! 사람이 아니라 공원을 물들여 줄 향수!"
2000620-29 = "사실 오늘 오후부터 이 공원에서 이런저런 행사들이 있을 예정이라고 했는데, 예상한 것보다 꽃들이 적게 피어서……."
2000620-30 = "그래서 향기로나마 온 사람들을 즐겁게 해 주고 싶다는 말에, 나님이 특별히 도와주겠다고 한 것이다."
2000620-31 = "특별히 '마음이 편해지고 나른하게 몸이 풀어지는', 좋은 성분들을 섞어서 가져온 것이다!"
2000620-32 = "[s3] \"뭐, 확실히 '이번 건' 좋을지도…….\"\n[s4] \"웬일로 좋은 일을…….\""
2000620-35 = "……지금 뭐라고 말한 것이냐?"
2000620-36 = "아무튼 지금 중요한 건 그게 아니다!"
2000620-37 = "이렇게 이른 시간에 선생을 부른 건, 단순히 처음으로 이 향수를 시연해 주기 위해서만이 아니니까!"
2000620-38 = "선생은 나님을 조금 도와주는 것이다. 이 많은 양을 모두 공원 곳곳에 고르게 뿌리려면, 조수가 필요하니까."
2000620-39 = "내가 이것을 공원 여기저기 뿌리고 다닐 동안, 다 뿌리고 돌아오면 얼른 다음 걸 챙겨주는 것이다. 무슨 이야긴지 알겠지?"
2000620-40 = "……응?"
2000620-41 = "알겠긴 하지만, 어째서 또 그런 복장이냐고? 이 복장이 어때서 그러느냐?"
2000620-45 = "……아."
2000620-51 = "이 스케이트보드……?"
2000620-52 = "왜 굳이 자전거나 스쿠터 같은 평범한 것들을 두고 스케이트보드를 타냐고……?"
2000620-56 = "……하하하! 무슨 소리냐, 선생! 이상한 말을 하는구나!"
2000620-62 = "당연히 스케이트보드 쪽이 훨씬 유리하니까 그렇지! 자전거나 스쿠터 같은 것들보다 훨씬!"
2000620-63 = "[s5] \"유리하다고? 스케이트보드가?\"\n[s6] \"보통은 반대로 생각하지 않아……?\""
2000620-66 = "하아아~."
2000620-67 = "이래서 범인들은……. 천재의 발상을 이해해 주지 못하는 것이다."
2000620-68 = "들어봐라, 자전거나 스쿠터는 움직일 때에 항상 핸들을 쥐고 있어야 하지? 놓는다 해도 직선으로밖에 못 가지?"
2000620-69 = "하지만 당장 오늘의 일만 해도 어떠냐? 향수를 뿌리면서 이리저리 다니려면 양손을 모두 쓸 수 있는 편이 좋지?"
2000620-70 = "양손에 향수병을 들고 뿌리면서 다녀야 하니까 말이지."
2000620-71 = "보드는 양손이 자유롭다! 게다가 자전거나 스쿠터보다 훨씬 더 다양한 길, 다양한 조건에서도 운용할 수 있다!"
2000620-72 = "물론 선생이 생각하는 대로, 그건 보드 사용자의 숙련도가 받쳐줘야 하는 것이지만……."
2000620-73 = "어차피 나님은 완벽! 새로운 약의 발명도, 스케이트보드 실력도 모두 천재이지 않느냐!"
2000620-74 = "그러니 아무 문제 없는 것이다. 이것이야말로 나를 위한 이동수단인 것이다!"
2000620-75 = "자, 자. 잡담은 여기까지!!"
2000620-76 = "시간이 없는 것이다! 사람들이 모이고 행사가 시작되기 전에, 어서 공원에 향기를 뿌려 두는 것이다!"
2000620-77 = "일단 두 병을 먼저 양손에 들고……."
2000620-81 = "그럼……. 다녀오겠다! 선생은 다음 병을 들고 기다리도록!"
2000620-86 = "휴우우우~!"
2000620-95 = "으음……. 으응……?"
2000620-96 = "뭐, 뭐지…… 갑자기 기분이……. 어라……."
2000620-97 = "뭔가 '마음이 편해지고 나른하게 몸이 풀어지는' 느낌이……. 지…… 집중이……"
2000620-98 = "어……."
2000620-102 = "……으아아아아아-!?!?"
2000620-115 = "(넘어진 사야에게 달려가니, 사야에게서 '마음이 편해지고 나른하게 몸이 풀어지는' 향기가 물씬 풍겼다.)"
2000620-116 = "(다행히 다친 곳은 없었기에 이후 둘이 함께 나눠 향수를 공원 곳곳에 뿌려 주었다.)"
