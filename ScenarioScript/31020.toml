[translation]
31020-1 = "제2화;보충수업부"
31020-2 = "우울해!!"
31020-3 = "우울하고, 슬프고, 고통스러워!"
31020-4 = "이, 이게 다 선생님 탓이야!"
31020-5 = "[s] \"저요?\""
31020-8 = "어머나, 코하루 쨩. 그렇게 말씀하시면 선생님의 입맛이 쓰잖아요."
31020-9 = "선생님은 어디까지나 저희를 도우러 오신 분……. 시험에 낙제를 당한 건 원칙적으로는 코하루 쨩의 책임이니까……."
31020-10 = "!!"
31020-11 = "나, 나는 정의실현부니까! 수업을 빠지는 경우가 많아서……. 그, 그래서 그런 거고!"
31020-12 = "그건 다른 정의실현부들도 마찬가지잖아. 정의부에서 낙제를 당한 건 코하루 네가 유일하고."
31020-13 = "……."
31020-14 = "어머? 아즈사 쨩은 코하루 쨩이 바보라는 얘기를 하고 싶은 걸까요?"
31020-15 = "아니, 그 말도 맞지만. 나는 인생이란 원래 그런 거라는 말을 하고 싶었던 거야."
31020-16 = "인생은 고통……인가요. 심오한 이야기네요."
31020-17 = "무, 무, 무슨 소리야!! 너희들도 전부 낙제잖아! 왜 나만 바보야? 그렇다고 하면 여기 있는 모두가 바보잖아!"
31020-18 = "아, 아하하…… 저기…… 모두들……"
31020-19 = "바보니까 보충수업부에 들기나 한 거잖아! 전부 바보잖아!"
31020-20 = "너도!"
31020-21 = "너도!"
31020-22 = "너도!"
31020-26 = "너도!"
31020-27 = "[s] \"네?! 저도요?\""
31020-28 = "아우…… 코하루 쨩…… 조금만 진정하고……."
31020-29 = "진정하게 생겼어! 모두 다 사이좋게 퇴학당하는데!"
31020-30 = "퇴학당하면…… 정의실현부에서도 쫓겨나잖아……. 그것만큼은……."
31020-31 = "물론이야. 나도 퇴학당할 생각은 없어. 무슨 수를 써서라도, 비참하게라도 발버둥쳐줄 거니까."
31020-32 = "후후. 그치만 퇴학당한다고 인생이 끝나는 건 아니니까요. 오히려……."
31020-33 = "저, 저기요!!"
31020-34 = "……."
31020-35 = "……."
31020-36 = "……."
31020-41 = "아, 아우……. 그, 그러니까…… 지금 모인 건…… 그 퇴학을 막기 위해서니까……."
31020-42 = "조금만 다 같이 머리를 맞대고 방법을 찾지 않으면……."
31020-43 = "안그러면 일주일 뒤에 저희는 사이좋게 전원 퇴학이……."
31020-44 = "머리를 맞댄다- 라는 표현 좀 답답하지 않나요? 애매하게 얼버무리는 부분이 있달까, 약간 비겁하달까……"
31020-45 = "여기서는 확실하게, 배를 맞댄다, 같은 표현이 좀 더……."
31020-50 = "하지 마! 음담패설은 사형이야! 금지야! 배를 왜 맞대는데? 어떻게 해야 그런 자세가 나오는데?"
31020-51 = "어머나? 역시 직접 실행해보지 않으면 상상하기가 힘든 걸까요? 코하루 쨩……?"
31020-55 = "……어? 어어?"
31020-58 = "하, 하지 마! 다가오지 마! 아, 알고 싶지 않으니까!"
31020-59 = "에잇♡"
31020-63 = "으, 으아아아! 하지마! 살려줘, 도와줘, 선생님, 선배님! 잘못했어요……! 잘못했으니까……!"
31020-64 = "반말해서 죄송해요! 으아아아아- 이제 그만 용서해주세요……!"
31020-65 = "흠. 백병전에서 적을 제압하는 기술이었군. 공부가 되었어."
31020-66 = "하지만 나라면 거기서 관절부터 꺾겠어. 무의미한 손동작이 너무 많아."
31020-68 = "……."
31020-69 = "선생님……. 부디……."
31020-70 = "[s] \"……응. 노력해볼게. 히후미.\""
31020-71 = "감사합니다……."
31020-72 = "이대로 가다간…… 저희는 모조리 퇴학이니까요…… 아우우……."
31020-74 = "(이 일이 있기 몇 주 전)"
31020-76 = "트리니티 다과회실"
31020-78 = "안녕하세요, [USERNAME] 선생님. 처음 뵙겠습니다."
31020-79 = "제가 바로 티파티의 호스트, 키리후지 나기사입니다."
31020-81 = "그리고 이쪽은 마찬가지의 티파티 멤버인 미소노 미카 씨."
31020-82 = "트리니티의 티파티가 샬레의 선생님을 뵙습니다."
31020-84 = "다음화;티파티"
