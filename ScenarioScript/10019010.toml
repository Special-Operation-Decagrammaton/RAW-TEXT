[translation]
10019010-12 = "우와아아아아--!! 나타났어!!"
10019010-13 = "자아, 달리는 거예요!"
10019010-14 = "목표 지점까지 유인할게."
10019010-21 = "에너지 반응?! 조, 조심해! 레이저야-!!"
10019010-22 = "이, 이쪽으로 쏘려나 봐!"
10019010-23 = "피할 타이밍이 나오지 않아요! 호시노 선배!"
10019010-36 = "우와, 직격당했어……?!"
10019010-37 = "아, 아루 님……?!"
10019010-44 = "……흥."
10019010-45 = "이 정도로 그 녀석들이 당할 리가 없잖아. 계획대로 계속 진행한다."
10019010-46 = "네? 그, 그런가요? 그렇군요! 알겠습니다!"
10019010-47 = "……과~연. 그럼 계속 전진☆"
10019010-51 = "우와아아-?! 정통으로 맞아버렸어!! 크, 큰일 났어!"
10019010-52 = "……아뇨. 저 정도라면 괜찮을 거예요."
10019010-53 = "호시노 선배, 상황은요?"
10019010-66 = "이야, 꽤 아픈걸. 그치만 그럭저럭 세이프려나."
10019010-67 = "응응, 우리는 괜찮아요, 아야네 쨩."
10019010-68 = "맞아. 이 정도야 아무것도 아니잖아?"
10019010-70 = "저 공격을 막아냈다고……?!"
10019010-71 = "이야~ 정말이지 큰일 날 뻔했잖아~ 요즘 허리도 안 좋은데 무리하면 이 아저씨는 곤란하다구. 파스 값이 남아나질 않는다구."
10019010-72 = "그러니까 나이 차이 얼마 안 난다니까!"
10019010-74 = "……굉장하네. 너희 부장…… 아니, 아비도스 학생들은 전부 엄청 강하구나."
10019010-75 = "응? 그런가……?"
10019010-76 = "아하하…… 비교 대상이 없어서 잘 모르겠지만……."
10019010-80 = "……네! 이것으로 공략 준비는 모두 완료되었습니다!"
10019010-81 = "제1 성소의 수호자 공략, 바로 시작 가능합니다!"
10019010-82 = "그럼 시간 낭비할 거 없이 바로 가볼까."
