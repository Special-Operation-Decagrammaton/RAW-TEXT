[translation]
10039035-2 = "정말이지 대단한 활약이셨어요, 시스터 님!"
10039035-3 = "이 협조를 어떻게 감사드려야 할지……!!"
10039035-4 = "도, 도움이 되었다니 다행이에요. 저도 확실하지 않은 상황에서 시도해 보았던 건데……."
10039035-5 = "굉장했지. 처음에는 헬멧단뿐 아니라 우리도 멍하니 보고만 있는 수준이었으니까."
10039035-6 = "[s1] \"키리노의 춤과 똑같았어.\"\n[s2] \"어쩌면 보고 배우는 데에 재능이…….\""
10039035-9 = "그, 그런 가요……? 저도 모르게 흥겨워서 그만……. 하하……."
10039035-10 = "아아. 그러고 보니 그랬지. 선생님과 시스터 님, 아이돌에 관해 조사 중이라고 했던가?"
10039035-11 = "아무리 그래도 저 춤을 그대로 가르쳐 주기는 좀 그렇겠지. 도움도 받아버린 마당에."
10039035-12 = "네, 네? 아, 아뇨! 저는 절대 그런 식으로 부담드리려던 게……!"
10039035-13 = "아냐, 아냐. 진짜로 괜찮으니까. 오히려 우리 입장에서도 그 방식이 더 편할 거야."
10039035-14 = "……음? '그 방식'이 무슨 이야기냐고?"
10039035-15 = "간단한 이야기야. 춤을 가르쳐주는 건, 우리 같은 초보가 아니라 전문 강사여야지."
10039035-16 = "……춤 연습할 연습실도 겸사겸사 빌리고 말이지."
10039035-17 = "우리가 잘 말씀드려 둘 테니, 이제 시스터 님도 와서 강사님께 같이 춤을 배우자고."
10039035-19 = "……! 후부키! 드디어 할 의욕이……!!"
10039035-20 = "……배우는 사람 수가 늘어나면 집중해서 감시할 시간도 줄겠고 말이지."
10039035-21 = "[s3] (참 후부키 다운 이유야.)\n[s4] \"응. 마리에게도 잘 된 이야기네.\""
10039035-24 = "여러분……!"
10039035-25 = "후~부키~!! 키리노~!!"
10039035-28 = "……윽."
10039035-32 = "구해줘서 고마워, 두 사람!! 역시 우리 가게의 단골들!!"
10039035-33 = "라이브도 기대할게! 꼭 휴가 내고 다 같이 찾아갈 테니까! 아니, 점장님도 그날은 휴업해 줄지도!"
10039035-34 = "으, 으으……."
10039035-39 = "[ns5] \"인기 많구나, 너희들.\"\n[ns6] \"……훌륭하네, 생활안전국.\""
10039035-44 = "……과연……."
10039035-45 = "아이돌……. 어쩌면, 저런 느낌……."
10039035-46 = "……후후."
10039035-47 = "……즐거운 일이네요."
10039035-59 = "- 댄스 클리어 -"
