[translation]
101-1 = "현상수배, 시작합니다."
101-2 = "총학생회 상황실"
101-3 = "오랜만이야, 선생님. #n그동안 잘 지냈어?"
101-4 = "나야 선생님과 샬레의 학생들이 온갖 말썽을 해결해준 덕분에 과자나 먹으며 여유로운 나날을 보내는 중이지. (와작)"
101-5 = "정말이지 샬레의 학생들은 써먹기 편리해서…… 아니, 친절해서 다행이라니까."
101-6 = "물론 키보토스의 모든 학생들이 샬레의 학생들처럼 상냥한 건 아니야."
101-7 = "개중에는 총학생회의 통제를 벗어난 중범죄를 일으켜 현상수배가 걸린 학생들도 있어."
101-8 = "그래서 말인데, 시간이 남으면 이 현상수배 중인 학생들을 대신 좀 처리해 줄래?"
101-9 = "일이 잘 해결되면 나중에 내 명란 과자를 나누어 줄게~ (와작)"
