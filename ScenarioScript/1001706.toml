[translation]
1001706-1 = "설원의 암살자"
1001706-2 = "붉은겨울 학원 운동장"
1001706-3 = "퍽!"
1001706-4 = "(체리노의 문자를 받고 붉은겨울 학원에 도착하자마자 뒤에서 날아온 눈덩이에 뒤통수를 맞았다.)"
1001706-5 = "하하하, 방심했구나. 콤라드!"
1001706-6 = "눈싸움의 세계는 냉혹한 법! 그런 무른 태도로 설원을 거닐었다가는 눈이 그치기도 전에 옷이 모두 젖고 말 거다!"
1001706-7 = "눈이 내린 곳은 모두 전장이라고 생각하는 게 좋을 거야, 음하하!"
1001706-8 = "자, 그럼 지금부터 무얼 하고 놀까?"
1001706-9 = "[s1] \"눈싸움을 하자.\"\n[s2] \"눈사람을 만들자.\""
1001706-10 = "후후, <설원의 암살자>라는 이명을 갖고 있는 이 몸에게 눈싸움으로 승부를 걸겠다는 건가?"
1001706-11 = "무모한 선택이로군, 콤라드! 우선은 눈사람이라도 만들면서 몸을 풀도록 하지."
1001706-12 = "좋은 생각이다, 콤라드!"
1001706-13 = "붉은겨울 학원의 모두가 감탄을 금치 못할 정도의 멋진 눈사람을 만드는 것이다!"
1001706-14 = "자, 그럼 누가 더 멋진 눈사람을 만드는지 경쟁하는 거다!"
1001706-18 = "[wa:50]― 수염[wa:910] 눈사람이야!"
1001706-20 = "― 더 크게,[wa:490] 세상에서 제일 [wa:1480]크게 만드는 것이다![wa:550] 콤라드!"
1001706-23 = "― 아야![wa:120]"
1001706-26 = "― 우우,[wa:890] 공격했겠다?"
1001706-28 = "― 좋아, [wa:830]도전을 [wa:970]받아주겠어,[wa:810] 콤라드!"
1001706-31 = "[wa:410]― 꺄하하하하-,"
1001706-34 = "― 그 정도로는[wa:1010] 안 돼,[wa:80]"
1001706-36 = "― 좀 더 크게,[wa:630] 더 크게 [wa:380]해야지.[wa:80]"
1001706-39 = "[wa:550]― 에, 에,[wa:750] 엣-취! [wa:2930]...훌쩍."
1001706-42 = "[wa:1180]― 에잇, [wa:490]방해야![wa:640] 지금은 집중하고 있다고!"
1001706-45 = "[wa:1190]― 춥지 [wa:940]않냐고?[wa:810] 몸이 허약하군,[wa:730] 콤라드!"
1001706-48 = "― 이 정도는 [wa:940]끄떡없어-!"
1001706-50 = "― 아직 [wa:740]3시간은 더 놀 수 있단 말이다!"
1001706-53 = "[wa:700]― 좋은 생각이 났어,[wa:550]"
1001706-55 = "― 콤라드는 [wa:750]거기서 눈사람을 만들어!"
1001706-58 = "― 이쪽에서 우리들이 만든 걸"
1001706-60 = "― 그 옆에 두는 거다!"
1001706-63 = "― 응?[wa:780] 왜? [wa:1240]괜찮지 않나?[wa:40]"
1001706-66 = "― ……[wa:240]그 둘 사이에"
1001706-68 = "― 작은 눈사람도 [wa:1120]만들까?[wa:40]"
1001706-71 = "― 아! [wa:480]……무,[wa:180] 물론"
1001706-73 = "― 콤라드가 괜찮다면 말이야![wa:40]"
1001706-76 = "완성이다! #n콤라드, 이것 좀 보게나, 이 몸의 눈사람이 완성되었다네!"
1001706-77 = "내가 만든 것이지만 수염의 각도까지 절묘한 것이 제법 완성도가 높군. 아주 만족스러워!"
1001706-78 = "콤라드, 자네가 만든 눈사람은 어찌 되었나?"
1001706-79 = "보여주게. #n어디, 어디……."
1001706-82 = "우앗!"
1001706-87 = "갑자기 눈덩이를 던지다니 무슨 짓인가, 콤라드!"
1001706-88 = "뭐? 눈싸움의 세계는 냉혹한 법이라고?"
1001706-89 = "후후후……."
1001706-91 = "이 몸이 방심한 틈에 눈싸움을 걸어오다니, 제법이구나!"
1001706-92 = "이번에야말로 봐주지 않겠어, 콤라드!"
1001706-94 = "(이후 체리노와 함께 눈싸움을 하며 즐거운 시간을 보냈다.)"
