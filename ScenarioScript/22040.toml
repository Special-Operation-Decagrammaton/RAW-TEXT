[translation]
22040-1 = "제4화;~아리스와 인도받는 자들~ 1"
22040-13 = "(그렇게 아리스와 함께 얼마나 앞으로 전진하고 있었을까.)"
22040-30 = "헛둘 헛둘."
22040-35 = "앗."
22040-36 = "[s] \"응? 아리스. 왜 그래?\""
22040-38 = "헛둘 헛둘."
22040-40 = "선생님, 어디선가 심상치 않은 소리가 들려옵니다."
22040-41 = "헛둘 헛둘."
22040-42 = "[s] \"그러게 무슨 소리지?\""
22040-43 = "이 소리는 분명……"
22040-44 = "핫……! 아리스, 깨달았습니다."
22040-45 = "이건 밀레니엄 학원 캠퍼스 내에서도 가끔 일어나고는 하는 특수 이벤트……."
22040-46 = "<밀레니엄 랜덤 인카운터 이벤트>의 전조입니다!"
22040-47 = "[s] \"으, 응? 랜덤 인카운터……? 전조……?\""
22040-48 = "네, 모험을 하다 보면 종종 마주치게 되는 필드 이벤트입니다."
22040-49 = "이때는 어떤 만남이 기다리고 있을지 알 수 없으니, 선생님, 방심은 금물입니다!"
22040-51 = "헛둘 헛둘."
22040-52 = "헛둘 헛둘 헛둘."
22040-53 = "[ns] \"대, 대체 무슨 이벤트가 일어나길래……?!\""
22040-55 = "헛둘 헛둘!!"
22040-59 = "[ns] \"나, 나왔다……!\""
22040-62 = "음? 이런 데서 두 분을 뵙다니 의외로군요."
22040-66 = "안녕하세요. 오늘도 운동하기 좋은 날입니다."
22040-67 = "[s] \"스, 스미레……? 아, 안녕.\""
22040-68 = "이건 스미레 선배와의 조우 이벤트였군요!"
22040-69 = "스미레 선배는 오늘도 <운동 모험> 중이었습니까?"
22040-70 = "[s] \"운동 모험……?\""
22040-71 = "네, 마침 한가한 참에 가볍게 이 주변에서 조깅을 할까 해서요."
22040-72 = "그러는 아리스는 오늘도 <모험 운동> 중입니까?"
22040-73 = "[s] \"이번엔 <모험 운동>……?\""
22040-74 = "네, 오늘은 선생님과 함께 견습용사 모험 중이었습니다!"
22040-75 = "과연 오늘은 트레이너와 함께 파트너를 짜고 운동이라……."
22040-76 = "매일 야외로 나와 운동을 하다니. 정말 성실하군요."
22040-77 = "모험은 언제나 성실히 해야 합니다. 하루라도 빼먹으면 금방 레벨이 뒤처지기 마련인 법입니다."
22040-78 = "일퀘를 빼먹는 건 죄악이라고 모모이도 그랬습니다."
22040-79 = "네, 운동과 단련은 무엇보다 꾸준히 하는 게 생명입니다."
22040-80 = "이번엔 평소 운동이 부족한 트레이너도 함께라니 더욱 훌륭하네요."
22040-81 = "[s] \"저기, 혹시 두 사람은 자주 만나고 그래?\""
22040-82 = "네, 스미레 선배는 밀레니엄의 주요 인카운터 이벤트 인물 중 하나입니다."
22040-83 = "이렇게 캠퍼스 안에서 운동을 하고 있다 보면, 아리스 양과는 자주 마주치고는 합니다."
22040-84 = "아무래도……."
22040-85 = "스미레 선배는 운동 모험을 하는, 아리스의 동료니까요!"
22040-86 = "후후, 네. 말씀대로 아리스 양은 제게 있어 운동을 함께하는, 운동 친구입니다."
22040-87 = "[s1] \"아까부터 들었던 의문인데 <운동 모험>……이 뭐야?\"\n[s2] \"아까부터 들었던 의문인데 <모험 운동>……이란 게 뭐야?\""
22040-88 = "그건 모험의 일종입니다!"
22040-89 = "스미레 선배는 이렇게 캠퍼스에서 열심히 뛰면서 근력과 민첩, 나아가 지구력 스테이터스를 올린다고 들었습니다."
22040-91 = "네, 운동을 하며 신체를 단련하는 건 즐거운 일이니까요."
22040-92 = "주요 스텟을 열심히 단련해 레벨업 한다…… 그걸 위해 평소에도 열심히 거리를 돌아다니며 노력하는 그 모습."
22040-93 = "이건 이미 훌륭한 용사의 모험입니다!"
22040-94 = "훌륭하다니, 그냥 매일 하는 일일 뿐인데 아리스 양의 말은 낯간지럽네요."
22040-95 = "[s] \"그, 그렇구나…….\""
22040-96 = "아리스 양은 늘 모험? 이란 걸 한다고 들었습니다."
22040-97 = "아리스 양에게 듣기로 모험의 주요 목적은 심신을 단련하고……."
22040-98 = "네! 레벨업을 해서 HP와 MP를 증가시키는 겁니다!"
22040-99 = "……단련을 통해 평소엔 불가능했던 걸 이뤄내는 경지에 도달하는 것이 목표라고 했지요."
22040-100 = "그렇게 해서 레벨을 올리면 새로운 스킬을 배울 수 있습니다!"
22040-101 = "음, 과연 그 마음가짐만으로도 이미 훌륭한 운동이라 할 수 있습니다!"
22040-102 = "평소에도 노력하는 그 멋진 마음가짐과 몸가짐! 굉장합니다. 아리스 양!"
22040-103 = "[s] \"그, 그래……?\""
22040-105 = "[ns] \"뭔가…… 대화의 합이 맞는 거 같으면서 또 아닌 거 같기도…….\""
22040-106 = "어쨌거나 오늘 이렇게 트레이너와 함께하는 아리스 양을 보고 있으려니……."
22040-107 = "저도 질 수는 없겠군요. 아리스 양."
22040-109 = "앗, 아리스도 마찬가지입니다. 스미레 선배에게 지지 않도록 좀 더 많은 이벤트와 조우하고 레벨업을 할 겁니다!"
22040-110 = "그럼 여기선 가볍게 조깅 20km 뛰기부터 시작하겠습니다!"
22040-111 = "먼저 실례하도록 하겠습니다. 트레이너! 아리스 양!"
22040-112 = "[s] \"아, 저기. 힘내.\""
22040-113 = "헛! 둘! 헛! 둘!"
22040-114 = "아리스도 질 수 없습니다!"
22040-118 = "선생님! 다음 퀘스트로 가죠!"
22040-119 = "[s] \"아, 으, 응…….\""
22040-127 = "(아리스의 뒤를 따라 전진을 계속하다 보니 어느새인가 밀레니엄 학원의 교외로 나오게 되었다.)"
22040-128 = "[s3] \"캠퍼스 밖까지 나올 줄이야…….\"\n[s4] \"아리스의 모험 반경은 생각보다 넓구나…….\""
22040-131 = "네. 아리스의 모험에 멈춤이란 없습니다."
22040-132 = "이렇게 먼 곳까지 오게 되면 평소 볼 수 없던…… 생각지 못한 이벤트도 겪을 수 있으니까요!"
22040-133 = "[s] \"과연, 생각지 못한 이벤트인가…….\""
22040-141 = "앗! 주인님이랑 아리스 쨩이다!"
22040-142 = "야호~ 안녕~!"
22040-143 = "[s] \"진짜 생각조차 못 해본 이벤트네!\""
22040-144 = "……으, 응? 선생님? 갑자기 왜 그래?"
22040-145 = "아하하! 뭔데? 뭔데?"
22040-146 = "[s] \"아니, 그, 두 사람 다…… 평소에 보기 힘든 복장이다 싶어서.\""
22040-148 = "평소와 다른 복장…… 신규 직업으로의 전직 코스튬……."
22040-149 = "핫! 아리스, 깨달았습니다! 두 사람은 메이드에서 새로운 직업……"
22040-150 = "<여고생>으로 전직한 것이로군요!"
22040-151 = "아니…… 학생이니까. 당연한 복장이라고 할까……."
22040-152 = "아리스도 잘 알고 있습니다. <여고생>은 강한 법이라고 모모이도 자주 말했습니다."
22040-153 = "자기 전에 아이스크림을 먹어도 체중계가 무섭지 않은 직업이라고 했습니다."
22040-154 = "[s] \"아니, 그건 어디까지나 근거 없는 자신감이 아닐까.\""
22040-155 = "아하핫~! 아리스 쨩! 날카로운걸!"
22040-156 = "맞아! 지금 우린 새롭게 전직해서 비밀 퀘스트를 진행 중이야~! 이 교복은 그걸 위한 유니폼이고!"
22040-157 = "[s] \"비밀 퀘스트……?\""
22040-158 = "응~! 리오 회장이 최근에 게헨나의 상황이 신경 쓰인다고 했던가~"
22040-159 = "뭐더라? 게헨나의 움직임? 같은 게 없는지 잠입해서 조사해달라고 해서 말이야~"
22040-160 = "아스나 선배, 잠깐……."
22040-161 = "그래서 이렇게 교복을 입고 지나가는 게헨나 학생이 어디 없을까~"
22040-162 = "발견하면 말을 걸어 봐야지~! 하고 있는 거야!"
22040-163 = "과연, 아스나 선배도 퀘스트를 해결하기 위해 모험을 하는 것이군요."
22040-164 = "아리스와 같습니다!"
22040-166 = "진짜~? 아리스 쨩이랑 똑같네~"
22040-167 = "잠깐, 아스나 선배. 아카네가 그건 비밀이라고……."
22040-168 = "아, 맞다~"
22040-169 = "아리스 쨩~ 그리고 주인님~ 방금 말한 건 비밀이야~?"
22040-170 = "[s] \"아, 으응.\""
22040-171 = "……하아. 뭐, 상대가 선생님과 아리스라면…… 상관없을까."
22040-173 = "네! 아리스! 비밀은 지키겠습니다! 게임에서도 비밀을 누설하면 저주를 받기도 하니까요!"
22040-174 = "아하하! 그래~! 아리스 쨩은 언제나 씩씩하네!"
22040-175 = "[s] \"그렇다고는 해도, 두 사람의 교복 차림이라니…….\""
22040-176 = "아니, 우리도 학생이니까. 당연히 교복 정도는 입는다고 할까……"
22040-177 = "이 복장은, 그게 그러니까…… 아스나 선배가 말했던 것처럼 잠입용 복장이라고 할까……"
22040-178 = "임무를 위해 평범한 교복을 가지고 나오라고 해서…… 그래서……"
22040-179 = "그게……."
22040-180 = "[s] \"아, 으응……. 그, 그렇구나.\""
22040-181 = "…………"
22040-182 = "……읏."
22040-183 = "너, 너무 그렇게 보진 말아줘. 선생님."
22040-184 = "그…… 조, 조금 부끄러우니까……."
22040-185 = "[s] \"앗, 미안! 무례했지……!\""
22040-187 = "[ns] \"그 평소랑 다른 복장이라 살짝 놀라서…… 자, 잘 어울려!\""
22040-188 = "근데 아리스 쨩하고 주인님은 뭘 하고 있던 거야?"
22040-191 = "선생님과 아리스는 모험 중이었습니다."
22040-192 = "오오-! 모험이라, 재밌겠다. 그거! 나도 하고 싶어!"
22040-193 = "하아, 선배, 우선은 임무부터……."
22040-195 = "네, 아리스도 언제나 파티 멤버가 늘어나는 건 환영입니다!"
22040-196 = "파티원의 숫자가 늘어나는 만큼 쓸 수 있는 전략과 전술의 숫자도 늘어납니다!"
22040-198 = "뽜밤뽜밤! 아스나 선배도, 카린 선배도! 다음 모험 때는 동료입니다!"
22040-199 = "와! 파티에 가입했다~"
22040-200 = "나, 나도……?"
22040-201 = "네!"
22040-205 = "……응."
22040-209 = "그럼 잡담은 이쯤 해두고……"
22040-210 = "아리스, 그리고 선생님. 우리는 일이 있으니 먼저 가볼게."
22040-211 = "[s] \"응, 임무 힘내.\""
22040-212 = "얏-호~! 응! 주인님! 응원 고마워!"
22040-213 = "그러니까 그건 비밀…… 아니, 이제 와서는 새삼스럽지도 않은가."
22040-214 = "아참. 그리고 아리스. 네루 선배가 널 찾고 있을 거야."
22040-216 = "네?! 꼬, 꼬마 메이드님이 아리스를 말인가요?!"
22040-217 = "무언가 볼일이 있었다고 하는 것 같은데……"
22040-218 = "어쨌거나 만나면 잘 대해줘."
22040-219 = "선배는, 아리스. 널 정말 마음에 들어 하는 거 같으니까."
22040-220 = "아, 으으……."
22040-222 = "그럼 빠잉~"
22040-226 = "앗, 거기 지나가는 게헨나의 학생!"
22040-233 = "응~? 누구야? ……우리한테 볼일이라도?"
22040-234 = "우린 지나가던 게헨나 편입을 준비하고 있는 학생들……이라고 할까."
22040-235 = "편입하기 전에 궁금한 게 있어서 말이야~!"
22040-236 = "……응? 지금 만마전의 대빵이 누구냐고?"
22040-237 = "너, 알아?"
22040-238 = "글쎄? 음~ 이부키 쨩 아냐?"
22040-239 = "마코토? 그게 누군데?"
22040-241 = "[ns] \"으음, 임무……. 제대로 할 수 있겠지……?\""
22040-242 = "선생님! 이러고 있을 때가 아닙니다."
22040-243 = "언제 네루 선배가 나타날지 모르니, 지금은 우선 퇴각 작전을 펼칠 때입니다!"
22040-247 = "[ns] \"앗, 같이 가. 아리스!\""
22040-249 = "다음화;~아리스와 인도받는 자들~ 2"
