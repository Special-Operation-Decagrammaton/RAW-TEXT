[translation]
700-1 = "백지장도 맞들면 낫다"
700-4 = "총학생회 리셉션 룸"
700-6 = "[ns] \"잠시 볼일이 있어서 오긴 했는데…….\""
700-10 = "어, 어어어?"
700-11 = "[s] \"……?!\""
700-12 = "죄, 죄송해요, 저, 저기 잠깐만요……?! 꺄, 꺄아아……?!"
700-14 = "이대로라면 넘어져 버려요오오……?!"
700-15 = "[ns] 붙잡는다."
700-18 = "사, 살았다아……."
700-19 = "가, 감사합니다…… 하마터면 쓰러질 뻔했어요……."
700-20 = "어, 어라……?"
700-21 = "<샬레>의 서, 선생님?! 죄, 죄송해요! 하마터면 선생님을 납작하게 만들 뻔했어요……."
700-22 = "[s] \"넌…….\""
700-23 = "아…… 제 소개가 늦었네요. 저는 총학생회 조정실의 아유무라고 합니다……."
700-24 = "지금은 린 선배…… 아니, 수석행정관님의 비서 역할을 겸하고 있어요."
700-25 = "[s] \"반가워. 아유무 쨩.\""
700-26 = "네! 바, 반갑습니다, 선생님!"
700-27 = "선생님의 이야기는 여기 저기서 많이 들었어요……. 저, 정말 대단한 어른이라고 생각해요! 여, 여러모로 굉장하시다고나 할까……."
700-28 = "저는 이렇게 쌓여가는 서류를 처리하는 것도 벅찬데……."
700-29 = "[s1] \"엄청난 서류 더미네. 도움이 필요해?\"\n[s2] \"내가 좀 도와줄 건 없어?\""
700-30 = "네, 네?!"
700-31 = "네, 네?!"
700-32 = "도, 도움이요? 선생님이요?"
700-33 = "기, 기쁘지만…… 그치만 이런 일들은 매일 매일 계속 쌓이는 것이라서 분명 귀찮으실 텐데……."
700-34 = "[s] \"괜찮아.\""
700-35 = "그, 그러신가요……."
700-36 = "그, 그렇다면 염치없지만 감사하게 도움을 받도록 하겠습니다."
700-41 = "그럼 이것부터 확인해주시겠어요?"
700-43 = "(이렇게 총학생회의 아유무와 함께 다양한 미션들을 해결해 나가게 되었다.)"
