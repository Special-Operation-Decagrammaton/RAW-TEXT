[translation]
33215-2 = "ETO 대 ETO의 싸움…… 낙원을 믿는 자와 부정하는 자들의 싸움……."
33215-3 = "그런가요."
33215-4 = "<낙원에 도달한 사람의 진실을 증명할 수 있는가.>"
33215-5 = "<예스>와 <노> 로만 이루어진 폭력적인 증명 요구……. 거기에 선생님은……."
33215-6 = "질문 자체가 잘못되어 있었던 게 아니라, 그럴 필요가 없다……. 그게 답이었던 걸까요."
33215-7 = "믿음으로써 증명되는 낙원이라……."
33215-8 = "……그런 발상은 못 했습니다."
33215-9 = "아니, 오히려…… 낙원이라는 건 언제나 그런 식으로 우리들 사이에 존재해 왔다."
33215-10 = "그렇게 선언하고 있었군요."
33215-11 = "그런 말도 안 되는 억지라니…… 그건 증명도 뭣도 아니지 않습니까."
33215-12 = "네. ……제가 졌습니다, 선생님."
33215-13 = "이 이야기는 이런 것이었군요. 제가 틀렸습니다."
33215-14 = "어른과의 승부라니, 애초에 승산이 없는 승부였을지도요."
33215-19 = "어른은 언제나 아이들이 생각지도 못하는 치사한 방법으로 이겨버리니까요."
33215-21 = "다음화;낙원의 이름 3"
