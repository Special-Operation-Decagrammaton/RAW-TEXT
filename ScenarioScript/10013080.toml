[translation]
10013080-1 = "제8화;헬멧단! 최후의 결전!"
10013080-6 = "바로 여기예요!"
10013080-7 = "마침내 도착했네! 이곳 <로스트 파라다이스 리조트> 군도에서도 가장 커다란 세력을 자랑하는 헬멧단의 리조트에……!"
10013080-8 = "그런데 시즈코 쨩……."
10013080-9 = "뭔가 이제까지랑은 분위기가 다른 것 같아요……!"
10013080-13 = "[ns] \"어째, 텅텅 비어 있지 않아……?\""
10013080-15 = "아……."
10013080-16 = "[s] \"치세?\""
10013080-17 = "반짝반짝 무당벌레 씨-"
10013080-18 = "네? 치세 공, 무당벌레라는 건……."
10013080-24 = "……누가 빨강과 검정색이 멋지게 조화를 이룬 무당벌레라는 거냐아앗!"
10013080-25 = "[s] \"의미를 바로 알아듣는 거야?! 굉장하잖아!\""
10013080-27 = "당신이 말로만 듣던 헬멧단의 간부?"
10013080-28 = "여러분께서 기다렸다는 듯이 저희들을 포위하신다는 건……."
10013080-29 = "처, 처음부터 전부 함정이었던 건가요?!"
10013080-31 = "흥! 맞아! 이곳은 처음부터 네 녀석들의 무덤으로 점 찍은 장소다! 잘도 멍청하게 이곳까지 직접 행차하셨구만!"
10013080-32 = "[s] \"하지만 어떻게 우리가 올 줄 알고…….\""
10013080-34 = "고객에 대한 애프터 서비스는 확실히 책임진다."
10013080-35 = "그것이 우리 카이저 코퍼레이션의 사훈이기 때문이지."
10013080-41 = "[ns] \"혹시 그럴지도 모른다고 생각은 했었지만, 너는…….\""
10013080-42 = "오랜만이군. 샬레의 선생."
10013080-43 = "[s1] \"카이저 이사……!\"\n[s2] \"아니, 어쩐지 휴양을 즐길 생각으로 한가득이지 않아?!\""
10013080-46 = "앗……! 당신은! 문어 은행에서 만났던 직원!"
10013080-47 = "여기서 또 뵙게 되네요!"
10013080-48 = "[s] \"심지어 계약을 했다는 게 댁이었어?!\""
10013080-49 = "그래, 이곳 <로스트 파라다이스 리조트>에 좋은 상품이 있다며 그쪽의 꼬맹이들에게 거래를 제안한 건 나였지."
10013080-50 = "지난번 샬레의 선생. 네놈과 아비도스들과 엮이는 바람에 그대로 쪽박을 차고, 이사의 자리에서도 물러날 수밖에 없던 탓에"
10013080-51 = "지금은 <문어 은행>의 현장 영업직을 맡고 있단 말이다!"
10013080-52 = "[s] \"과연, 그런 비하인드의 이야기……가 아니라!\""
10013080-53 = "하지만……. 지금 여기서 뭘 하는 거지?"
10013080-58 = "지금쯤이면 열심히 리조트를 운영하고 있어야 하는 것 아닌가?"
10013080-59 = "뭘 하고 있느냐니, 그야 당신이 제멋대로 뿌려 댄 불법 계약서를 회수하러 온 거라고!"
10013080-60 = "맞아요! 저희에게 사용권을 판매했으면서, 설마 계약서의 허점을 만들어 이런 짓을 꾸미다니!"
10013080-61 = "무슨 소리지? 너희가 우리 은행을 방문했을 때, 나는 괜찮은 상품이 있다며 제안을 했을 뿐."
10013080-62 = "나는 그 어떤 강요도, 강압도 하지 않았다. 그저 돈을 벌고자 하는 마음에 그 상품을 구매한 건 네놈들 쪽이지 않나?"
10013080-63 = "그건……!"
10013080-64 = "허나 지금 이런 행위는 곤란하군. 자기 멋대로 다른 리조트들을 찾아가 사용권을 회수한다니."
10013080-65 = "그런 월권행위를 그냥 넘길 수는 없지. 그래서 직접 애프터케어 서비스를 위해 여기까지 나온 거다."
10013080-66 = "보디가드까지 대동하고 말이지."
10013080-68 = "헹!"
10013080-69 = "……이건, 그냥 말장난이로군요. 시즈코 쨩들을 먼저 속인 것은 당신이면서……."
10013080-71 = "[ns] \"처음부터 백야당을 노리고 벌인 일이지?\""
10013080-72 = "마츠리운영관리부는 좋은 물건이지. 백귀야행 학원에서 축제를 열 수 있는 권한. 그걸 놀리고 있어서야 쓰나."
10013080-76 = "이번 일을 통해 백야당의 명예를 실추시킨다."
10013080-82 = "그걸 위해 다양한 놈들을 이곳 군도로 끌어들였다."
10013080-88 = "이번 해프닝이 백귀야행의 이름을 좀먹고 나면, 그 뒤엔 만신창이가 된 백야당을 사들인다."
10013080-89 = "완벽한 계획이지?"
10013080-91 = "하지만 이번에도 또다시 네놈에게 방해받아버렸군. 샬레의 선생."
10013080-92 = "[s] \"방해를 받아? 나한테?\""
10013080-93 = "이번엔 무슨 수를 썼지?"
10013080-94 = "백야당의 버팀목이 되어주었나? 포기하지 말고 싸우자고 응원이라도 했나? 달콤한 속삭임이라도 주었던가?"
10013080-95 = "무의미하군. 그런 것보다 내가 더 현실적인 제안을 하마."
10013080-96 = "……무슨 소리야?"
10013080-97 = "계약을 맺도록 하지. 네놈들에게 투자해주마."
10013080-98 = "투, 투자를……? 저희에게? 문어 은행, 아니, 카이저 코퍼레이션이 말인가요?"
10013080-99 = "그래. 여기까지 도달한 걸 보니, 생각보다 괜찮은 놈들이라는 생각이 들어서 말이야."
10013080-100 = "필시 여기까지 오는 길에, 다양한 이들과 프랜차이즈 계약을 맺었다고 들었다. 우리도 거기에 한 손 거들도록 하지."
10013080-101 = "물론 지금까지는 여러모로 마츠리운영관리부의 이름으로 계약서를 뿌린 탓에 다소 이름에 흠집은 나 있겠지만."
10013080-102 = "그것도 전부 돈이면 해결될 문제다."
10013080-103 = "자, 우리가 투자하도록 하마. 더욱 많은 돈을 벌 기회다."
10013080-104 = "이번에야말로 계약 관계를 확실히 하고"
10013080-105 = "마츠리운영관리부가 이곳 <로스트 파라다이스 리조트>를 운영하면서 막대한 이익을 벌어들이는 게다."
10013080-106 = "……설마 바보가 아닌 이상, 이런 좋은 기회를 걷어차지는 않겠지?"
10013080-111 = "사장님……."
10013080-112 = "시즈코 쨩."
10013080-113 = "…………."
10013080-114 = "그거, 참 솔깃한 제안인걸."
10013080-115 = "시즈코 공……."
10013080-116 = "……하지만."
10013080-120 = "거절하겠어."
10013080-121 = "……뭐? 진심인가?"
10013080-124 = "니야가 말했었지."
10013080-125 = "카이저 코퍼레이션에게 사기를 당했다면, 그냥 돌아가면 된다고."
10013080-126 = "저쪽이 더러운 수를 썼다면 이쪽도 똑같이 갚아주면 될 일이라고. 괜히 여기에 남을 필요 따윈 없다고 말이야."
10013080-128 = "하지만 난 남기로 결정했어."
10013080-129 = "물론 앞서 말했다시피 백귀야행이라는 이름의 <브랜드 가치> 때문이기도 하지만……."
10013080-130 = "또 하나의 이유. 그건………"
10013080-131 = "축제를 바보 취급하는 녀석들은 절대로 용서할 수 없어서야!"
10013080-135 = "무슨 헛소리를……."
10013080-136 = "온천개발부 아이들은"
10013080-142 = "그저 자기가 찾고 싶은 걸 향해 노력하는 녀석들이었어."
10013080-143 = "그래서 계약을 하자고 했어."
10013080-149 = "무시퀸 대회는 어디까지나 자기들이 재미있으니까 여는 축제의 여흥 같은 거였지."
10013080-150 = "그것도 좋겠다 싶어 계약하자고 했어."
10013080-155 = "하지만 당신네들은 달라. 냥텐마루와 같아."
10013080-156 = "이러고 있는 순간에도 군도 여기저기선 <리조트 사냥>이 벌어지면서 손님들이 피해를 보고 있을 거야."
10013080-158 = "가장 즐거워야 할 여름의 한때가 당신, 카이저 코퍼레이션의 욕심 때문에 망가지고 있는 거라구!"
10013080-162 = "그런 건 용납 못 해-!"
10013080-163 = "뿐만 아니라, 이런 상황을 만든 너희 카이저 코퍼레이션도 똑같이 용서 못 해!"
10013080-164 = "그러니 그 웃기지도 않는 제안에 대한 대답이라면 하나!"
10013080-165 = "거절이야! 응! 완전 거절! 절대로 NO입니다!"
10013080-167 = "사장님!"
10013080-168 = "시즈코 쨩!"
10013080-170 = "……고작 그런 이유로, 돈이 되는 기회를 뻥 차버린다고? 멍청한 선택을 하겠다는 거냐?"
10013080-171 = "[s] \"멍청한 선택이 아니야. 시즈코의 결정이다.\""
10013080-172 = "샬레의 선생……."
10013080-173 = "[s3] \"딱히 처음부터 내가 한 일은 없었어. 모든 건 시즈코가 결심한 거였으니까.\"\n[s4] \"선생인 나는 믿고 따를 뿐이야.\""
10013080-176 = "바보 같기는……. 대체 그까짓 신념 따위가 뭐라고-!"
10013080-177 = "……뭐, 좋다. 열을 내봤자, 우습기만 할 뿐."
10013080-178 = "그렇다면 이쪽도 정당하게 헬멧단의 이름으로 <리조트 사냥>을 해서 빼앗으면 그만이다!"
10013080-179 = "라브, 인원을 전부 불러라!"
10013080-180 = "하하하! 그것만 기다리고 있었다고!"
10013080-195 = "모두 집합!"
10013080-201 = "우, 우와아앗! 수, 숫자가 어, 엄청나게 많아요! 어, 어쩌죠?! 주군?!"
10013080-202 = "음~ 다 같이 축제를 벌이는 거야~?"
10013080-203 = "으음! 치세 씨 말대로 축제라면 축제라고도 할 수 있겠지만요-! 사장님?! 어떡해요?!"
10013080-205 = "일단 뒤로 빠지면서! 탈출구를 찾으면……!"
10013080-206 = "하! 도망칠 수 있을 것 같으냐! 어이, 헬멧단 신입들! 뒤를 막아!"
10013080-210 = "[ns] \"이런! 뒤에도 헬멧단……………………이?\""
10013080-212 = "이번에 뛰어난 실력을 지닌 헬멧단 멤버들을 새로 뽑았거든! 자! 실력을 보여줘!"
10013080-214 = "으헤~ 이렇게 해서 무사히 작전 성공~"
10013080-216 = "정말로 성공한 거야?! 진짜로?! 이래도 되는 거야?!"
10013080-218 = "그만큼 엄청난 작전이었단 거죠~☆"
10013080-223 = "응. <헬멧단으로 위장해서 의심받지 않고 적진 깊숙이 숨어들기 작전> 대성공."
10013080-224 = "[s] \"……….\""
10013080-225 = "어, 어, 어어어?!"
10013080-226 = "응? 왜 그래? 신입들! 저 녀석들의 퇴로를 막고! 해치워버려!"
10013080-227 = "[s] \"아니…… 저기…….\""
10013080-228 = "……잠깐, 라브. 네놈 설마."
10013080-229 = "네놈이 오는 길에 말했던 뛰어난 실력을 가진 헬멧단 신입이라는 게……."
10013080-230 = "응? 다들 왜 그래?"
10013080-237 = "앗?! 너는! 그때 봤던?!"
10013080-242 = "으, 으음?! 잘못 봤나?!"
10013080-243 = "아냐! 복잡한 건 됐어! 헬멧단 신입들! 전부 전투 준비……!"
10013080-248 = "으헤~"
10013080-249 = "어, 어어어어?! 너, 너는?!"
10013080-250 = "………"
10013080-251 = "……어머."
10013080-252 = "어, 선생님. 나비-"
10013080-253 = "아, 아비도스……! 네놈들이 어째서 여기에?! 라브, 어떻게 된 거지?!"
10013080-254 = "자, 잠깐! 나는 분명! 조금은 이상하긴 해도 엄청나게 쿨하고 힙한 헬멧을 쓴 녀석들이라고 생각해서-!!"
10013080-255 = "……선생님 말대로, 엄청나게 기상천외한 방법……."
10013080-256 = "[s] \"아니, 나라고 이런 걸 생각한 건 아니었지만…….\""
10013080-257 = "우리도 당신네가 꾸민 일 때문에! 리조트 사용권 상품에 당첨되어서 온 거라고!"
10013080-258 = "이번 일도 다! 카이저 이사! 당신의 소행이었군요!"
10013080-259 = "아니, 잠깐 그럴 리가. 나는 어디까지나 소동을 일으킬 문제아들로만 골라서 사용권을 팔았……."
10013080-261 = "잠깐, 당첨되었다고? 어떻게?"
10013080-262 = "[s] \"그러고 보니 정작 세리카가 어디서 당첨되었는지 듣지는 못했네.\""
10013080-263 = "어, 어? 나, 나 말이야?"
10013080-264 = "그냥 그……. 시바세키 라멘집에서 마스터가 열었던 스페셜 빙고 대회에서……. 이겨서…… 그게……."
10013080-268 = "[ns] \"그렇게 된 거였구나.\""
10013080-269 = "뭐, 덕분에 다 같이 여기 모일 수 있게 되었으니까 그치?"
10013080-271 = "응! 덕분에! 엄청나게 든든해졌어!"
10013080-276 = "[ns] \"그럼 백귀야행과 아비도스, 공동 작전 시작이야!\""
