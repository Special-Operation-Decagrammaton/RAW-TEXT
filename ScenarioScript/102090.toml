[translation]
102090-1 = "제9화;제2 성소 공략 - 밀레니엄 폐허 지구"
102090-2 = "제2 성소 공략, 지금 시작합니다. 방어 부대는 준비되었어?"
102090-3 = "준비 완료."
102090-4 = "저는 츠루기 선배의 후방 지원이군요, 뭐, 선배 혼자서도 충분하지 않을까 싶지만. 네. 준비되었슴다."
102090-8 = "응, ……어디 보자. 강하 부대는 어때? 침투는 완료?"
102090-10 = "네, 저희는 조금 전에 환풍구로 침투 완료했어요."
102090-11 = "지금은 군수공장의 중심부로 향하는 중이다."
102090-12 = "아하하하. 오랜만의 낙하산이었네~ 재미있었지?"
102090-14 = "미적거릴 거 없이 빨리 시작하자고!"
102090-15 = "응. 그럼 방어 부대가 병력의 진격을 막는 사이, 강하 부대가 군수공장의 중심을 공격하는 플랜이야."
102090-16 = "그러면 적의 방어 체계가 혼란에 빠질 거고, 그러면 방어 부대도 안으로 진입 가능해질 거야."
102090-17 = "그럼 작전 시작! 헤세드의 앞에서 다 같이 만나."
