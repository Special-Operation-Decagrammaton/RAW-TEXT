[translation]
83304100200-6 = "이 서류는 이쪽에 정리해 두고……"
83304100200-7 = "이건 또 이쪽이려나……"
83304100200-8 = "훈련에 나서기 전, 처리가 필요한 서류 정리는 이 정도면 된 거 같고……"
83304100200-9 = "다음은…… 게헨나 파티에 앞선 대테러 훈련 준비, 겠네."
83304100200-10 = "특별히 고된 훈련은 아니라고 해도, 사소한 것 하나 완벽하게 해내지 않는다면……"
83304100200-11 = "또 만마전에서 무슨 빌미를 가지고 걸고넘어질지 모르니까."
83304100200-12 = "────우선, 훈련에 참여하는 부원들은 소집할까."
