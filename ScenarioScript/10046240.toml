[translation]
10046240-3 = "이치카 선배."
10046240-4 = "도우러 왔습니다."
10046240-5 = "마시로? 마시로는 비번 아니었나요?"
10046240-6 = "예, 하지만 지금 여기서 정의의 도움이 필요하다는 직감을 따라왔습니다."
10046240-7 = "하하…… 그러고 보니, 마시로는 그런 거 정말 좋아했죠."
10046240-8 = "하지만 마시로는 어제까지 작전하지 않았슴까."
10046240-9 = "오늘은 무리하지 말고, 돌아가서 쉬시죠."
10046240-10 = "으음…… 사실, 최근 저 스스로 한계를 느끼고 있어서요."
10046240-11 = "뭔가, 요즘 눈에 띄는 활약을 하지 못하고 있는 듯하다고 할까, 존재감이 없다고 할까……."
10046240-12 = "음? 마시로는 저격수니까, 굳이 눈에 띌 필요는 없지 않을까요?"
10046240-13 = "오히려 존재감이 낮은 편이 좋지 않슴까?"
10046240-14 = "그렇지 않습니다! 저격수에 존재감은 필수적입니다!"
10046240-15 = "뛰어난 저격수는 한 발의 총알로 3명의 적을 무력화한다고 하듯이…… 하스미 선배만 해도 엄청난 존재감을 갖고 계시지 않습니까!"
10046240-16 = "음…… 하스미 선배의 존재감은, 어느 쪽인가 하면, 3명의 적을 전부 해치워 버린다는 느낌이지만요, 하하……."
10046240-20 = "(시즈야마 마시로…… 분명, 1학년 중에서도 눈에 띄게 우수한 후배이기는 하지만…….)"
10046240-21 = "(엄청 성실하다 할까, 열정적이라고 할까, 선배로서는 좀 더 완급 조절을 배워줬으면 좋겠는데.)"
10046240-22 = "(솔직히 나랑은 잘 안 맞는 느낌이라고 할까…….)"
10046240-28 = "그리고…… 이치카 선배 혼자서 순찰하고 계시다 들었습니다."
10046240-29 = "네? 아, 아아. 어쩌다 보니 그렇게 되었네요."
10046240-30 = "혼자는 조금, 외롭지 않습니까?"
10046240-31 = "설마, 그게 이유입니까?"
10046240-32 = "………."
10046240-33 = "……이야, 이거 부끄럽네요. 후배를 걱정시키기나 하고……."
10046240-34 = "하하! 역시, 저는 좋은 선배는 못 되겠네요."
10046240-35 = "그러면, 원호를 부탁드리겠슴다. 가려서 도움받을 처지는 아니라서요."
10046240-39 = "네! 맡겨주세요!"
