[translation]
80000092-1 = "조금 특별한 구호용품"
80000092-2 = "(발렌타이 데이 당일, 어째서인지 미네의 방에 불려가게 되었다……)"
80000092-6 = "들어오십시오, 선생님."
80000092-13 = "비좁은 곳입니다만, 부디."
80000092-17 = "[ns] \"이건…… 초콜릿? 초콜릿도 모으는 거야?\""
80000092-18 = "아…… 초콜릿 말씀이십니까……?"
80000092-19 = "예. 얼마 전부터…… 약간, 심경의 변화로, 의료 용품의 일종으로 모으기 시작했습니다."
80000092-20 = "[s] \"초콜릿이, 의료 용품?\""
80000092-21 = "네. 초콜릿은 의외로 훌륭한 구호용품이 될 수 있다는 것이 제 판단이었습니다."
80000092-22 = "실제로 초콜릿은 그 특성으로 인해 키보토스에서 현장 구호 물품으로 사용되기도 하죠."
80000092-23 = "저혈당 쇼크 상황에도 나쁘지 않은 당 공급원이 되어 주기도 하고요."
80000092-24 = "물론 가장 좋은 것은 주스입니다만, 주스는 휴대가 조금 불편하니까요."
80000092-25 = "고함량의 카페인을 첨가하여 일시적인 각성 효과를 유도한, 구두약처럼 생긴 제품도 있고."
80000092-26 = "오트밀을 첨가하여…… 대강 삶은 감자보다는 조금 맛있게 만든 특수한 제품은."
80000092-27 = "기호품으로써는 선호되지 않지만, 기력 회복과 열량 보충에 특화되어 있죠."
80000092-28 = "그렇기에 저는, 초콜릿 정도면 훌륭한 구호용품 혹은 의료 용품이 아닐까, 하는 생각이 들어……"
80000092-29 = "일주일 정도 전부터, 초콜릿을 모으기 시작했답니다."
80000092-30 = "[s1] \"초콜릿이 의료 용품이라…… 그렇게 볼 수도 있겠네.\"\n[s2] \"그런 것 치고는 뭔가, 묘하게 고급인 데다 귀여운 포장인 것들이 많은데?\""
80000092-33 = "!?"
80000092-34 = "그, 그것은!"
80000092-35 = "시판되는 초콜릿들의 태반이, 저기, 그런 것들로 준비되어 있어서 어쩔 수 없었다고나 할지……!"
80000092-36 = "[s3] \"아, 계란 모양 초콜릿. 이거 알아.\"\n[s4] \"초콜릿 계란 안에 귀여운 장난감이 들어 있지?"
80000092-39 = "!!!"
80000092-40 = "그, 그그그그그건! 어디까지나! 자료 조사라고 말씀드려야 할지, 그, 보세요!"
80000092-41 = "아이들이 그런 초콜릿을 한 입에 삼키다가 숨이 막힐 수도 있지 않을까요?!"
80000092-46 = "[ns5] \"병아리 모양 초콜릿이네? 화이트 초콜릿에 레몬 색소를 섞은 건가?\"\n[ns6] \"미네는 의외로 병아리 파였다던가?!\""
80000092-51 = "……"
80000092-52 = "그래요! 안 되나요?"
80000092-53 = "저도 예쁘고 귀여운 거 좋아해요!"
80000092-54 = "갖고 싶어지고, 모으고 싶어지고! 그러면 안 되나요? 네?"
80000092-58 = "역시 선생님도 안 어울린다고 생각하시죠? 이렇게 딱딱하기만 한 사람은 싫고, 꺼려지고, 가까이하면 귀찮을 것 같고……"
80000092-59 = "저도 알아요, 다 안다구요! 그래도, 그래도……!"
80000092-60 = "[s7] \"진정해, 미네. 그리고 잘 어울려.\"\n[s8] \"귀여움은 진리지!\""
80000092-65 = "……정말요?"
80000092-66 = "[s] \"응. 정말이야.\""
80000092-67 = "……"
80000092-68 = "뭔가…… 보여드리면 안 될 모습을 보여드렸군요…… 사과드립니다."
80000092-69 = "절 여기까지 몰아세우신 분도, 선생님이 처음이십니다……"
80000092-70 = "그 대신!"
80000092-82 = "(갑자기 입 안에 무언가가 밀어넣어졌다.)"
80000092-86 = "(달콤하고……. 고소한 쓴맛이 났다.)"
80000092-88 = "해피 발렌타인! 입니다!"
80000092-94 = "(미네는 그 말만을 남기고 어딘가로 쏜살같이 도망쳤다.)"
80000092-95 = "(미네의 방에서, 미네가 다시 돌아올 때까지 미네가 준 초콜릿을 맛보고 있었다……)"
