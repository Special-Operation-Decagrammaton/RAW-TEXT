[translation]
10052060-1 = "케테르. 가장 찬란하게 빛나는 지고의 왕관"
10052060-2 = "케테르의 구역으로 진입했습니다."
10052060-3 = "아직도 정확한 의미는 모르겠습니다만, 세피라의 상징 숫자는 1이라고 하는군요."
10052060-4 = "오오…… 대단합니다, 토키! 아리스는 그것조차 모르고 있었습니다!"
10052060-5 = "각 예언자의 표기 정보를 읽었을 뿐입니다. 귀여운 아리스."
10052060-6 = "토키는 꼼꼼하네요! 그것만으로도 충분히 대단하다고 생각합니다!"
10052060-7 = "감사합니다. 아리스. 이리 가까이 오면 쓰다듬어 드릴게요."
10052060-8 = "네!"
10052060-15 = "생각해 보면 케테르는 첫 번째 예언자라고 해야겠지만……"
10052060-16 = "우리가 케테르를 만났던 건, 생각해 보면 꽤 나중이었죠."
10052060-17 = "기억나세요, 선생님? 폐허수몰지구에서 우리는, 케테르를 처음으로 만났죠."
10052060-18 = "[s] \"술래잡기를 했었지.\""
10052060-19 = "네. 단지 저희 쪽이 술래였을 뿐이었지만요."
10052060-20 = "[s] \"드물게도, 히마리까지 현장에 나왔었고.\""
10052060-21 = "저도 이야기는 들었습니다. 데카그라마톤을 직접 눈으로 보고 싶어서, 어린아이처럼 눈을 반짝이며 흥분하셨다고."
10052060-22 = "그러게요. 저도 그 비슷한 말을 들은 것 같네요."
10052060-23 = "……둘 다, 누구에게서 그런 악의적인 음해로 넘쳐나는 헛소문을 들은 건가요? 역시 리오인가요?"
10052060-24 = "에이미에게서였습니다."
10052060-25 = "그렇군요……. 에이미도 참. 가끔 사물과 현상을 직관적으로 바라보지 못할 때가 있단 말이죠."
10052060-26 = "아닌데? 그때 부장은 분명 그랬어."
10052060-27 = "에, 에이미?!"
10052060-28 = "(그랬구나…….)"
10052060-29 = "괜찮습니다, 히마리 선배! 아리스도 새로운 게임이 발매되기 하루 전에는 그런 기분이 들고는 하니까요!"
10052060-30 = "그, 그런가요? 크흠. 어쨌든 그때의 저는, 절대 흥분하거나 신을 내지는 않았지만."
10052060-31 = "데카그라마톤이라는 하나의 '현상'을 제 눈으로 확인하면, 모든 것이 끝날 것이라고 기대하기는 했어요."
10052060-32 = "……그리고 어떤 의미로는 한 가지가 끝났지만, 또 다른 가능성이 시작되고 말았고……"
10052060-33 = "그게 결국에는 이런 상황에 이르고야 말았다는 것."
10052060-34 = "그리고 그런 결과를 예상하고 대비하지 못했다는 것이, 저로서는 뼈아픈 부분이긴 하네요."
10052060-35 = "? 히마리 부장. 제가 모르는 사이에 예언 능력이라도 얻으셨습니까?"
10052060-36 = "설마요. 물론 제가 오컬트를 연구하는 이유 중 하나가 미래에 대한 예지의 목격이긴 하지만."
10052060-37 = "아직까지 그 영역에 대한 확실한 답은 얻지 못한 상황이기도 하니까요……."
10052060-38 = "그렇다면 어째서 예측하지 못한 결과에 대해 구태여 책임을 지려 하시는 건가요?"
10052060-39 = "……!"
10052060-40 = "(나이스 샷이야, 토키.)"
10052060-41 = "나이스 샷이네요. 토키."
10052060-46 = "저, 모두 좋은데요. 다 좋은데 말이에요……."
10052060-47 = "또다시 강하해야 하는 건가요?!"
10052060-48 = "그래. 그게 가장 합리적인 선택이야."
10052060-49 = "네. 그게 가장 전략적인 방안이에요."
10052060-50 = "케테르의 십자 포화망이 지나치게 강해서, 지상 루트로는 진입이 어려운 상황입니다."
10052060-51 = "강하 시의 안전에 대해서는 걱정하지 않아도 좋습니다. 겪어 보았겠지만요."
10052060-52 = "애초에 강하 작전 자체는, 이미 몇 번 해 본 것이기도 하잖아요?"
10052060-53 = "테마파크에서 수직으로 떨어지는 놀이기구를, 예전에 타 봤다고 해서 무섭지 않은 건 아닌데요?!"
10052060-54 = "유즈가 모처럼 적극적으로 말을 하는군요. 이건 진심으로 무섭다는 뜻이기도 합니다."
10052060-55 = "하지만 이 드랍 포드는, 유즈와 게임개발부 여러분의 의견을 적극적으로 반영한 장치잖아요?"
10052060-56 = "거기에 제가 직접 타고 내려가게 될 거라고는 생각도 하지 못했거든요?!"
10052060-57 = "모두, 강하 시간이야. 준비해."
10052060-58 = "히잇??!!"
10052060-59 = "괜찮습니까, 유즈?"
10052060-60 = "여, 역시 이건, 이건……!"
10052060-61 = "강하 팀은 드랍 포드로. 반복합니다. 강하 팀은 드랍 포드로."
10052060-62 = "드랍 포드. 사출 준비 완료."
10052060-69 = "그러면, 가 보자."
10052060-70 = "선두는 맡겨 주십시오."
10052060-72 = "히마리 부장. 모모이. 판단에 따라 후속 조치 부탁해."
10052060-73 = "히이이이이이이이……!"
10052060-75 = "강하 시작!"
10052060-77 = "좋았어…… 그러니까 이 레버를 밀면 되는 거였지?"
10052060-78 = "언니……. 부탁이니까 제발 신중하게 해 줘."
10052060-79 = "나는 아주 진지하다구!"
10052060-86 = "꺄아아아아아아아악–!!!"
10052060-87 = "(언제 들어도 엄청난 비명이네…….)"
