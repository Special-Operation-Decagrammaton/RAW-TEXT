[translation]
2005903-1 = "小惡魔與轉賣商"
2005903-2 = "（當天傍晚，與無月一起來到了黑市……）"
2005903-3 = ""
2005903-7 = "來，這邊。#n老師，快走吧！"
2005903-10 = "[ns] 「我也好久沒來黑市的便利商店了呢。」"
2005903-11 = "聽說最近這裡進了一款能刺激我收藏欲的神奇炸彈。"
2005903-12 = "那就是彩虹煙霧彈。據說殺蟲消毒的效果超強的哦！"
2005903-13 = "躲在房間裡的蚊子，只要一發就能搞定！"
2005903-14 = "怎麼樣？超實用的吧？"
2005903-15 = "[s] 「哦哦！那我也買幾個吧！」"
2005903-16 = "咯呵呵，老師也覺得不錯吧？#n我們可以多買一點回去！"
2005903-17 = "包裝是彩虹色的，應該馬上就能找到……"
2005903-18 = "……咦？"
2005903-19 = ""
2005903-21 = ""
2005903-22 = ""
2005903-23 = "怎麼回事？一個炸彈都沒有耶？"
2005903-24 = "[s] 「不只彩虹煙霧彈，其他炸彈也都沒了。」"
2005903-25 = "請問是在找炸彈嗎？"
2005903-26 = "您還是死心比較好哦？因為頭盔團全都買走了。"
2005903-27 = "[s] 「頭盔團？」"
2005903-28 = "是的，剩下的就只有那邊那些仿製品了。"
2005903-29 = "需要下次進貨時幫您留幾個嗎？"
2005903-30 = "不過相對地，價格會稍微貴一些就是了。哈哈哈。"
2005903-31 = "啊哈哈，不用沒關係。"
2005903-32 = "畢竟我也不是那麼想要～"
2005903-33 = "總之我們先出去吧，老師。#n看來炸彈是真的全部都被買走了。"
2005903-37 = "咯呵呵，感覺有事件要發生了呢？"
2005903-38 = "我先去蒐集一下情報，順便向其他人打聽看看。"
2005903-40 = ""
2005903-41 = ""
2005903-43 = ""
2005903-44 = ""
2005903-45 = ""
2005903-47 = "（綜合情報的結果……）"
2005903-49 = "看來頭盔團囤積炸彈這件事好像是真的。"
2005903-50 = "而且他們似乎把囤積的炸彈，用比定價更高的價格轉賣出去。"
2005903-51 = "因為炸彈是日常會用到的消耗品，所以很多學生都是別無選擇才買下來的。"
2005903-52 = "再這樣下去……"
2005903-53 = "就要變成轉賣天堂了！那種事我絕對不能原諒！"
2005903-54 = "[s] 「轉賣炸彈啊，這還真是……」"
2005903-55 = "老師！我們一起把轉賣商抓起來吧！"
2005903-56 = "我有個好主意！"
2005903-58 = "（於是在某一天……）"
2005903-60 = "頭盔團秘密物流倉庫"
2005903-61 = "時間也差不多了……"
2005903-62 = "嘿嘿嘿。不知道是哪來的肥羊，竟然說要把我們的炸彈全部買走。"
2005903-63 = "別大意，搞不好是其他組織的陷阱。"
2005903-64 = ""
2005903-66 = ""
2005903-67 = "哦？來了。"
2005903-68 = ""
2005903-70 = ""
2005903-71 = "[ns] 「這邊請，大小姐。」"
2005903-72 = ""
2005903-75 = "……"
2005903-76 = "哦哦，一看就是很有錢的傢伙嘛……！"
2005903-77 = "喂，你就是那個買家嗎？"
2005903-78 = "[s1] 「說什麼喂，太無禮了！」\n[s2] 「這位可是卡佩利尼家族的千金──卡佩拉大小姐！」"
2005903-81 = "卡佩利尼家族……？有那種組織嗎？"
2005903-82 = "總之看起來是個有錢的大小姐，但是買這麼大量的炸彈是要做什麼？"
2005903-83 = "那真是個非常無趣的問題呢。"
2005903-84 = "我買炸彈要做什麼，跟你們有什麼關係？"
2005903-85 = "你們只要在收到錢之後把東西交出來就行了。"
2005903-86 = "那，那倒是沒錯啦……"
2005903-87 = "明白的話就快點把東西交出來，我想快點離開這個令人作嘔的地方。"
2005903-88 = "哇，看看那傢伙說話的口氣。"
2005903-89 = "嘖，真是個惹人厭的大小姐。"
2005903-90 = "別廢話了，先把準備好的錢拿出來看看！"
2005903-91 = "哼，真是個疑神疑鬼的小人呢。"
2005903-92 = ""
2005903-94 = ""
2005903-95 = "[USERNAME]管家，把皮箱打開。"
2005903-96 = "[s] 「是，大小姐。」"
2005903-100 = ""
2005903-101 = "那些……是真的現金吧？"
2005903-102 = "那當然，難不成你連偽鈔都分不出來嗎？"
2005903-103 = "搞不好只有表面是真的，裡面塞的是別的東西！我得親自確認一下！"
2005903-104 = "[s] 「站住，接下來輪到我們了。」"
2005903-105 = "沒錯，接下來輪到我們了。"
2005903-106 = "把帶來的炸彈拿給我看。#n要確認現金等我確認完炸彈再說。"
2005903-107 = "哼，好吧。"
2005903-108 = ""
2005903-110 = ""
2005903-113 = "（掀開布之後，出現了裝在箱子裡的大量炸彈……）"
2005903-115 = "我可以拿一個起來確認看看嗎？"
2005903-116 = "怎，怎麼辦？"
2005903-117 = "就讓他們確認一個吧。"
2005903-118 = "好，好吧！"
2005903-119 = ""
2005903-121 = ""
2005903-122 = ""
2005903-123 = ""
2005903-124 = ""
2005903-125 = ""
2005903-126 = "確認過了，確實是真品呢。"
2005903-127 = ""
2005903-129 = ""
2005903-130 = "咯呵呵，老師。多虧這些傢伙把炸彈全都集中在箱子裡，這樣事情就變得更簡單了。"
2005903-131 = "在狹小的地方大量聚集的炸彈……這個發展是不是有點眼熟？"
2005903-132 = "[s3] 「原來如此……」\n[s4] 「我只要躲到安全的地方就行了嗎？」"
2005903-135 = "那我數到三就開始。"
2005903-136 = "一～二～"
2005903-137 = "喂！你們兩個在那邊竊竊私語做什──"
2005903-138 = "三～！"
2005903-139 = "咦？"
2005903-140 = ""
2005903-144 = "你，你瘋了嗎！？這邊有炸彈箱耶！這，這樣下去……！！"
2005903-145 = "炸彈全都會爆炸呢！"
2005903-146 = "但是無所謂！因為這是「警告」……！"
2005903-147 = "那，那傢伙！打從一開始就沒打算交易嗎！？"
2005903-148 = ""
2005903-152 = "唔，啊啊啊……！大家快逃……！！"
2005903-153 = ""
2005903-159 = "咯呵呵。這樣轉賣的頭盔團和贓物就一口氣全部解決了！"
2005903-160 = "這下應該不會再有想靠炸彈做轉賣生意的笨蛋出現了吧。"
2005903-162 = ""
2005903-163 = "啊～真好玩。#n不但守護了興趣又教訓了壞蛋。"
2005903-164 = "對吧，老師？"
2005903-165 = "[s5] 「是的，大小姐。」\n[s6] 「這樣一來就能繼續健全地享受興趣了。」"
2005903-168 = "啊哈哈哈！老師模仿管家的樣子超好笑的！"
2005903-170 = "（之後迅速整理完現場並匆匆離開）"
2005903-171 = "（希望事件可以就這樣圓滿落幕……）"
