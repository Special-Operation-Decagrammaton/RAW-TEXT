[translation]
2005903-1 = "소악마와 리셀러"
2005903-2 = "(그날 저녁, 무츠키와 블랙마켓에 왔다…….)"
2005903-7 = "자. 이쪽이야, 선생님. 어서 가자!"
2005903-10 = "[ns] \"블랙마켓 편의점도 오랜만이네.\""
2005903-11 = "최근 여기에 내 수집욕을 자극하는 신기한 폭탄이 입고됐다고 들었거든."
2005903-12 = "무지개 연막탄인데, 살충 소독 효과가 엄청나대!"
2005903-13 = "방 안에 숨어있는 모기도 이거 한방이면 끝!"
2005903-14 = "어때? 엄청 실용적이지 않아?"
2005903-15 = "[s] \"오! 나도 몇 개 살까?\""
2005903-16 = "쿠후후, 선생님도 마음에 들지? 그러니까 잔뜩 사가자!"
2005903-17 = "무지개색으로 포장되어 있으니까 금방 찾을 수 있을……."
2005903-18 = "……어라?"
2005903-23 = "뭐지? 폭탄이 하나도 없네?"
2005903-24 = "[s] \"무지개 연막탄 말고 다른 폭탄도 없어.\""
2005903-25 = "혹시 폭탄을 찾고 계신가요?"
2005903-26 = "포기하시는 게 어때요?#n헬멧단이 전부 사 갔거든요."
2005903-27 = "[s] \"헬멧단이?\""
2005903-28 = "네. 남은 건 거기 있는 모조품뿐이에요."
2005903-29 = "원하신다면 재입하 때 몇 개 빼놓을까요?"
2005903-30 = "대신 가격은 좀 더 비싸지겠지만요. 후후후."
2005903-31 = "아하핫, 사양할게."
2005903-32 = "그렇게까지 해서 사고 싶진 않거든~"
2005903-33 = "일단 나가자, 선생님. 폭탄이 없다는 말은 진짜인 것 같으니까."
2005903-37 = "쿠후후, 이거 뭔가 사건의 냄새가 나는데?"
2005903-38 = "일단 정보 조사 겸 다른 사람들한테도 물어볼게."
2005903-47 = "(정보를 종합한 결과…….)"
2005903-49 = "아무래도 헬멧단이 폭탄을 사재기하는 건 사실인 모양이야."
2005903-50 = "그리고 그렇게 사재기한 폭탄을 정가보다 높은 가격에 되팔고 있는 것 같아."
2005903-51 = "폭탄은 일상적으로 사용하는 소모품이라 어쩔 수 없이 샀다는 학생도 많더라구."
2005903-52 = "이대로 있다간……."
2005903-53 = "되팔이 천국이 되고 말 거야!#n그런 거 용서 못 해!"
2005903-54 = "[s] \"폭탄 되팔이라니, 그거참…….\""
2005903-55 = "선생님! 같이 되팔이를 잡자!"
2005903-56 = "나한테 좋은 아이디어가 있어!"
2005903-58 = "(그렇게 어느 날…….)"
2005903-60 = "헬멧단 비밀 물류창고"
2005903-61 = "슬슬 시간이 됐는데……."
2005903-62 = "키키킥, 어떤 호구인지는 모르겠지만 우리 폭탄을 전부 사 가겠다니."
2005903-63 = "방심하지 마. 다른 조직의 함정일지도 모르니까."
2005903-67 = "어? 왔다."
2005903-71 = "[ns] \"이쪽입니다, 아가씨.\""
2005903-75 = "……."
2005903-76 = "오오, 딱 봐도 돈 많아 보이는 녀석이잖아……!"
2005903-77 = "어이. 네가 그 구매자냐?"
2005903-78 = "[s1] \"어이라니, 무례하다!\"\n[s2] \"이분은 카펠리니 패밀리의 영애, 카펠라 아가씨다!\""
2005903-81 = "카펠리니 패밀리……? 그런 조직이 있었나?"
2005903-82 = "아무튼 돈 많은 아가씨 같은데, 이렇게 폭탄을 대량으로 사 가서 뭘 하려고?"
2005903-83 = "그거, 정말 재미없는 질문이네요."
2005903-84 = "제가 폭탄을 사 가서 뭘 하든, 당신들이 무슨 상관이죠?"
2005903-85 = "여러분은 그저 돈을 받고 물건을 넘기면 되는 거예요."
2005903-86 = "그, 그렇긴 한데……."
2005903-87 = "알았으면 어서 물건을 넘기세요. 이 구역질 나는 곳을 빨리 벗어나고 싶으니까."
2005903-88 = "으와, 저 녀석 말하는 것 좀 봐."
2005903-89 = "칫, 재수 없는 아가씨 같으니."
2005903-90 = "됐으니까 준비한 돈이나 보여줘!"
2005903-91 = "흥, 의심이 많은 소인배군요."
2005903-95 = "[USERNAME] 집사. 가방을 열어주세요."
2005903-96 = "[s] \"네, 아가씨.\""
2005903-101 = "그거, 진짜 현금 맞겠지?"
2005903-102 = "물론이죠. 설마, 위폐도 구별 못 하는 건가요?"
2005903-103 = "겉만 진짜고 속은 다른 걸로 채웠을지도 모르잖아! 직접 확인을 해봐야겠어!"
2005903-104 = "[s] \"멈춰라. 다음은 우리 차례야.\""
2005903-105 = "그래요. 이제 다음은 우리 차례예요."
2005903-106 = "가져온 폭탄을 보여주시죠. 현금 확인은 가져온 폭탄을 보고 해드리겠어요."
2005903-107 = "흥, 좋아."
2005903-113 = "(장막을 걷어내자, 상자에 담긴 대량의 폭탄이 나왔다…….)"
2005903-115 = "폭탄 아무거나 하나만 확인해 보죠."
2005903-116 = "어, 어떡할까?"
2005903-117 = "하나 정도는 확인하게 해줘."
2005903-118 = "조, 좋아! 이쪽이다!"
2005903-126 = "확인했습니다. 확실히 진품이네요."
2005903-130 = "쿠후후, 선생님. 얘들 폭탄을 상자에 다 모아놨어. 덕분에 일 처리가 쉽겠네."
2005903-131 = "좁은 곳에 대량으로 모여 있는 폭탄. 이거 어딘가 익숙한 전개지?"
2005903-132 = "[s3] \"과연…….\"\n[s4] \"난 안전한 곳에 숨으면 되는 건가?\""
2005903-135 = "그럼 셋에 시작할게."
2005903-136 = "하나, 둘~"
2005903-137 = "어이! 둘이서 속닥속닥 뭘 하는……."
2005903-138 = "셋~!"
2005903-139 = "어라?"
2005903-144 = "미, 미쳤어?! 이쪽엔 폭탄 박스가 있다고! 이, 이러다간……!!"
2005903-145 = "폭탄이 다 터지겠지!"
2005903-146 = "하지만 상관없어! 중요한 건 메시지니까……!"
2005903-147 = "저, 저 녀석! 애초에 물건을 살 생각이 없었던 건가?!"
2005903-152 = "아, 아아악……! 다들 피해……!!"
2005903-159 = "쿠후후, 이걸로 되팔이 헬멧단과 장물을 한꺼번에 처리했어!"
2005903-160 = "이제 폭탄으로 되팔이 장사를 하겠다는 바보들은 또 안 나타나겠지."
2005903-163 = "아아, 재미있었다. 취미 생활도 지키고, 나쁜 녀석도 혼내주고."
2005903-164 = "그렇지, 선생님?"
2005903-165 = "[s5] \"그렇습니다, 아가씨.\"\n[s6] \"이걸로 건전한 취미 생활을 계속할 수 있겠군요.\""
2005903-168 = "아하하핫! 선생님 집사 흉내 엄청 웃겨!"
2005903-170 = "(이후 서둘러 현장을 정리하고 자리를 떴다.)"
2005903-171 = "(이걸로 잘 해결 됐으면 좋겠는데…….)"
