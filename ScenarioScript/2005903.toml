[translation]
2005903-1 = "ปีศาจน้อยกับผู้ค้ากำไร"
2005903-2 = "(ค่ำวันนั้น คุณครูมาตลาดมืดกับมุสึกิ...)"
2005903-3 = ""
2005903-7 = "เฮ้ คุณครู ทางนี้ รีบไปกันเถอะ!"
2005903-10 = "[ns] \"ไม่ได้มาร้านสะดวกซื้อในตลาดมืดนานแล้วนะ\""
2005903-11 = "ได้ยินมาว่าที่นี่เพิ่งมีระเบิดเจ๋งๆ เข้ามาใหม่ แล้วมันก็กระตุ้นต่อมอยากสะสมระเบิดของเค้ามากเลย"
2005903-12 = "มันเป็นระเบิดควันสีรุ้งที่มีฤทธิ์ฆ่าแมลงและฆ่าเชื้อโรคด้วยละ!"
2005903-13 = "แค่ตู้มเดียว พวกยุงที่ซ่อนอยู่ในห้องก็ตายเรียบ!"
2005903-14 = "ว่าไงล่ะ? มันมีประโยชน์มากเลยเนอะ?"
2005903-15 = "[s] \"โอ้! ครูก็ซื้อกลับไปด้วยดีมั้ย?\""
2005903-16 = "ฮุฮุฮุ คุณครูก็ถูกใจใช่มั้ยล่ะ? งั้นเราซื้อไปเยอะๆ เลย!"
2005903-17 = "ระเบิดอันนั้นมีห่อเป็นสีรุ้ง งั้นก็น่าจะหาได้ไม่ยาก..."
2005903-18 = "เอ๋...?"
2005903-19 = ""
2005903-21 = ""
2005903-22 = ""
2005903-23 = "อะไรน่ะ? ไม่มีระเบิดแม้แต่ลูกเดียวเหรอ?"
2005903-24 = "[s] \"ไม่ใช่แค่ระเบิดควันสีรุ้งนะ ระเบิดอื่นก็ไม่มีเลยด้วย\""
2005903-25 = "มาซื้อระเบิดเหรอคะ?"
2005903-26 = "ล้มเลิกความตั้งใจดีกว่าค่ะ พวกแก๊งหมวกกันน็อกมากวาดซื้อไปหมดแล้วค่ะ"
2005903-27 = "[s] \"แก๊งหมวกกันน็อกเหรอ?\""
2005903-28 = "ใช่ค่ะ ที่เหลือในร้านตอนนี้ก็แค่ของก๊อปเท่านั้นค่ะ"
2005903-29 = "ถ้าต้องการละก็ ไว้เติมสต็อกแล้วให้ฉันเก็บไว้ให้มั้ยคะ?"
2005903-30 = "แต่ว่าราคาอาจจะสูงกว่าเดิมหน่อยนะคะ ฮุฮุฮุ"
2005903-31 = "อะฮ่าฮ่า ขอปฏิเสธดีกว่า"
2005903-32 = "พอดีไม่ได้อยากซื้อถึงขนาดนั้นน่ะ~"
2005903-33 = "รีบออกไปกันเถอะ คุณครู ที่พนักงานบอกว่าไม่มีระเบิด เค้าว่าน่าจะจริงนะ"
2005903-37 = "ฮุฮุฮุ ดูจะมีบางอย่างไม่ชอบมาพากลนะเนี่ย"
2005903-38 = "เค้าไปสืบข้อมูลจากคนแถวนี้ดีกว่า"
2005903-40 = ""
2005903-41 = ""
2005903-43 = ""
2005903-44 = ""
2005903-45 = ""
2005903-47 = "(หลังจากรวบรวมข้อมูลที่ได้มา...)"
2005903-49 = "ดูเหมือนแก๊งหมวกกันน็อกจะซื้อระเบิดไปกักตุนจริงๆ ด้วยนะ"
2005903-50 = "แล้วก็ยังเอาระเบิดที่กักตุนไว้ไปขายต่อในราคาที่สูงกว่าเดิมด้วย"
2005903-51 = "มีนักเรียนหลายคนบอกว่าต้องซื้อระเบิดจากพวกนั้นโดยไม่มีทางเลือก เพราะมันเป็นของจำเป็นที่ต้องใช้ทุกวันด้วยละ"
2005903-52 = "ถ้าเป็นแบบนี้ต่อไปละก็..."
2005903-53 = "ที่นี่ต้องเป็นสวรรค์ของพวกผู้ค้ากำไรนั่นแน่เลย!#nเค้าไม่ยอมให้เกิดเรื่องแบบนั้นหรอก!"
2005903-54 = "[s] \"เอาระเบิดไปกักตุนกันเหรอเนี่ย...\""
2005903-55 = "คุณครู! ไปจับตัวคนพวกนั้นกันเถอะ!"
2005903-56 = "เค้ามีไอเดียดีๆ อยู่!"
2005903-58 = "(และแล้วในวันหนึ่ง...)"
2005903-60 = "คลังสินค้าลับของแก๊งหมวกกันน็อก"
2005903-61 = "ใกล้จะถึงเวลาแล้วสินะ..."
2005903-62 = "คิกคิกคิก ถึงจะไม่รู้ว่าเป็นลูกค้าหน้าโง่มาจากไหน แต่ก็คงมาซื้อระเบิดของเราไปจนหมดแหละนะ"
2005903-63 = "อย่าประมาทนะ นี่อาจเป็นกับดักของกลุ่มแก๊งอื่นก็ได้"
2005903-64 = ""
2005903-66 = ""
2005903-67 = "หืม? มาแล้ว"
2005903-68 = ""
2005903-70 = ""
2005903-71 = "[ns] \"ทางนี้เลย คุณหนู\""
2005903-72 = ""
2005903-75 = "..."
2005903-76 = "โอ้ว แค่ดูจากภายนอกก็รู้แล้วว่าเป็นเศรษฐี...!"
2005903-77 = "นี่ เธอน่ะเหรอลูกค้าที่ติดต่อมา?"
2005903-78 = "[s1] \"พูดกับลูกค้าแบบนี้ ไม่มีมารยาทเลยนะ\"\n[s2] \"นี่คือคุณหนูคาเปลล่า จากคาเปลลินี แฟมิลี่เชียวนะ!\""
2005903-81 = "คาเปลลินี แฟมิลี่...? มีองค์กรอะไรแบบนั้นด้วยเหรอ?"
2005903-82 = "แต่ก็เอาเถอะ คุณดูเหมือนคุณหนูที่ร่ำรวยเลย จะซื้อระเบิดมากขนาดนี้ไปทำอะไรเหรอ?"
2005903-83 = "เป็นคำถามที่น่าเบื่อจังเลยนะคะ"
2005903-84 = "ไม่ว่าฉันจะซื้อระเบิดไปทำอะไร มันก็ไม่เห็นจะเกี่ยวกับพวกคุณตรงไหนเลยนี่คะ?"
2005903-85 = "พวกคุณแค่รับเงินไป แล้วส่งของมาก็พอค่ะ"
2005903-86 = "มะ... มันก็จริงอยู่หรอก..."
2005903-87 = "ถ้าเข้าใจแล้วก็รีบๆ ส่งของมาเถอะค่ะ ฉันอยากไปให้พ้นจากสถานที่ชวนอ้วกนี่เต็มทีแล้ว"
2005903-88 = "โอ้โห ดูใช้คำพูดเข้าสิ"
2005903-89 = "ชิ ยัยคุณหนูไร้มารยาท"
2005903-90 = "ช่างเถอะ เอาเงินออกมาให้ดูก่อน!"
2005903-91 = "ฮึ่ม เป็นคนใจแคบที่ขี้สงสัยจริงๆ นะคะ"
2005903-92 = ""
2005903-94 = ""
2005903-95 = "คุณผู้ช่วย [USERNAME] ช่วยเปิดกระเป๋าด้วยค่ะ"
2005903-96 = "[s] \"ได้เลย คุณหนู\""
2005903-100 = ""
2005903-101 = "นั่นคือ... เงินสดจริงๆ ใช่มั้ย?"
2005903-102 = "แน่นอนค่ะ อย่าบอกนะคะว่าพวกคุณแยกแบงก์จริงกับแบงก์ปลอมไม่ออก?"
2005903-103 = "ข้างนอกอาจเป็นเงินจริง แต่อาจซุกอย่างอื่นไว้ข้างในก็ได้นี่นา! ขอเช็กดูให้แน่ใจด้วยตัวเองดีกว่า!"
2005903-104 = "[s] \"หยุดนะ ต่อไปเป็นคิวของพวกเราต่างหาก\""
2005903-105 = "ใช่ค่ะ ต่อไปเป็นคิวของพวกเรา"
2005903-106 = "เอาระเบิดมาให้พวกเราดูค่ะ เงินสดพวกนี้น่ะ ฉันจะให้ตรวจสอบหลังจากได้เห็นระเบิดที่เตรียมมาค่ะ"
2005903-107 = "ฮึ่ม ก็ได้"
2005903-108 = ""
2005903-110 = ""
2005903-113 = "(เมื่อเอาผ้าคลุมออก ก็เห็นว่ามีระเบิดจำนวนมากอยู่ในกล่อง...)"
2005903-115 = "ขอเช็กระเบิดด้วยค่ะ"
2005903-116 = "อะ... เอาไงดีล่ะ?"
2005903-117 = "ให้เช็กดูสักลูกแล้วกัน"
2005903-118 = "กะ... ก็ได้! ทางนี้!"
2005903-119 = ""
2005903-121 = ""
2005903-122 = ""
2005903-123 = ""
2005903-124 = ""
2005903-125 = ""
2005903-126 = "เช็กแล้วเรียบร้อยค่ะ เป็นระเบิดของแท้แน่นอนจริงด้วย"
2005903-127 = ""
2005903-129 = ""
2005903-130 = "ฮุฮุฮุ คุณครู ยัยพวกนี้เอาระเบิดมาใส่กล่องไว้หมดเลย แบบนี้งานของเราก็ง่ายขึ้นเลยนะ"
2005903-131 = "ระเบิดจำนวนมากถูกกองรวมไว้ในพื้นที่จำกัด พล็อตเรื่องนี้ฟังดูคุ้นๆ มั้ย?"
2005903-132 = "[s3] \"เป็นอย่างนี้สินะ...\"\n[s4] \"ครูควรไปซ่อนตัวในที่ปลอดภัยใช่มั้ย?\""
2005903-135 = "เค้าจะนับถึงสามนะ"
2005903-136 = "หนึ่ง สอง~"
2005903-137 = "นี่! สองคนนั้นกระซิบอะไรกันน่ะ..."
2005903-138 = "สาม~!"
2005903-139 = "หืม?"
2005903-140 = ""
2005903-144 = "บะ... บ้าไปแล้วเหรอ?! ตรงนี้มีกล่องระเบิดอยู่นะ! บะ... แบบนี้คง...!!"
2005903-145 = "ได้ระเบิดกันหมดน่ะสิ!"
2005903-146 = "ก็ไม่เห็นจะเป็นอะไรนี่! เพราะสิ่งสำคัญที่สุดคือข้อความที่จะสื่อต่างหาก...!"
2005903-147 = "ยะ... ยัยนั่น! ไม่ได้คิดจะซื้อของไปตั้งแต่แรกแล้วงั้นเหรอ?!"
2005903-148 = ""
2005903-152 = "อะ... อ๊ากก...! ทุกคน หาที่หลบเร็วเข้า...!!"
2005903-153 = ""
2005903-159 = "ฮุฮุฮุ แค่นี้ก็จัดการแก๊งหมวกกันน็อกค้ากำไรกับของกลางได้ในคราวเดียวเลย"
2005903-160 = "ทีนี้พวกโง่เง่าที่คิดจะเอาระเบิดมาขายเก็งกำไรต่อคงไม่โผล่หัวมาอีกแล้วละนะ"
2005903-162 = ""
2005903-163 = "อ่า สนุกจังเลยน้า ได้ปกป้องงานอดิเรกไว้ แล้วก็ได้ลงโทษคนไม่ดีด้วย"
2005903-164 = "ใช่มั้ย คุณครู?"
2005903-165 = "[s5] \"ใช่แล้วละ คุณหนู\"\n[s6] \"แบบนี้ก็ทำงานอดิเรกที่สร้างสรรค์ต่อสังคมต่อได้แล้วละ\""
2005903-168 = "อะฮะฮะฮ่า! การแสดงของคุณครูนี่ตลกชะมัดเลย!"
2005903-170 = "(หลังจากนั้นทั้งสองคนก็ช่วยเก็บกวาดสถานที่แล้วออกมาจากตรงนั้น)"
2005903-171 = "(ในใจก็หวังว่านี่จะช่วยแก้ปัญหาได้...)"
