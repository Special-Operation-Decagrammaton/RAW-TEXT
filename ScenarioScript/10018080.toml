[translation]
10018080-1 = "제8화;혹을 떼라고 보냈더니……"
10018080-4 = "혹을 붙여 오면 어떡해!!!"
10018080-8 = "진정하세요. 후우카 씨."
10018080-9 = "진정할 수 있는 일이 아니잖아!!!"
10018080-10 = "요리…… 대결이라고요?"
10018080-11 = "그 냐오푸드와? 최종적으로는 상인회에게 시식……?"
10018080-12 = "우선…… 몇 인분이나 준비해야 하는 거죠?"
10018080-13 = "일단은 100찬합을 준비하기로 했습니다."
10018080-14 = "아시다시피 오세치는 겹겹이 찬합으로 되어 있고,"
10018080-15 = "보통 하나의 찬합을 3~4명이서 나눠 먹는 식이니……"
10018080-16 = "400인분이네요★"
10018080-18 = "나 잠시 기절하고 올게."
10018080-19 = "안 됩니다. 후우카 씨. 이미 대결은 시작되었어요."
10018080-20 = "모든 일이 일어나기 전이라면 모를까, 여기서 물러나는 건 언어도단입니다."
10018080-21 = "그러니까 그거 전부 네가 벌인 일이잖아……"
10018080-22 = "애초에 말이지! 승부를 받아 온 건 하루나였잖아!"
10018080-23 = "그걸 나한테 떠넘기고 있는 것도 하루나고!"
10018080-27 = "……"
10018080-28 = "미안해요. 후우카 씨."
10018080-32 = "어, 어……?"
10018080-33 = "[ns] \"하루나가…… 사과했어?!\""
10018080-34 = "저는 저뿐만이 아니라 모두가 보다 맛있는 것을 먹었으면 합니다. 맛있는 음식은 우리를 행복하게 만드니까요."
10018080-35 = "하지만 냐오푸드의 행위를 그대로 내버려 두면,"
10018080-36 = "결국 모두가 맛없는 음식을 먹게 된다는 결과에 이르고 말 거에요."
10018080-38 = "저는 그게 싫어요. 제가 마음에 들었던 참새정이 사라지는 것도 마찬가지죠."
10018080-39 = "최종적으로는 이 거리의 모든 분들이, 더 맛있는 음식을 먹을 가능성을 잃어버리는 것이 싫기도 하고요."
10018080-40 = "그러니까 하루나는, 이 거리를 위해서 그 승부를 받아들였다고 이야기하고 싶은 거지?"
10018080-41 = "정확합니다."
10018080-42 = "그리고 그 과정에서, 내가 도와줬으면 하는 거고?"
10018080-43 = "……그렇죠."
10018080-44 = "……내가 만일 하루나의 부탁을 거절하면, 어떻게 할 생각이야?"
10018080-48 = "그때는 저희 미식연구회끼리, 어떻게든 해 볼 작정입니다."
10018080-49 = "[s] \"가능할까……?\""
10018080-50 = "가능성의 문제가 아니에요, 선생님. 당위성의 문제죠."
10018080-51 = "그 정도 각오도 없이, 냐오푸드의 승부를 받아들인 것도 아니고요."
10018080-52 = "물론 실패하고, 비웃음당할 가능성이 높기는 하겠지만……"
10018080-53 = "또 모르죠. 미래는 아직 결정되지 않았으니까요. 그 정도로 저의 미식에 대한 의지가 꺾이지도 않을 거고요."
10018080-54 = "……말은 그렇게 하면서, 막상 그렇게 되면 침울해할 거지?"
10018080-58 = "!?!?"
10018080-63 = "알았어. 도와줄게."
10018080-65 = "후우카 씨?!"
10018080-66 = "왠지 이렇게 될 것 같기도 했고, 나도 참새정이 이대로 없어지는 것은 싫고."
10018080-67 = "[s] \"……이제 와서 하는 말이지만, 다른 방법은 없었어?\""
10018080-68 = "정직하게 말씀드리죠. 선생님."
10018080-69 = "요리는 어느 정도 자본력의 싸움입니다."
10018080-70 = "가정 요리라면 몰라도, 외식업일수록 더더욱 그렇죠."
10018080-71 = "물론 세상에는 가격표만큼의 값어치를 하지 못하는 식당도 있고."
10018080-72 = "그런 식당들을 볼 때 마다 저는 수도꼭지를 잠가 주고 싶은 충동에 휩싸입니다만……"
10018080-73 = "수도꼭지라니, 무슨 말이야?"
10018080-74 = "이런 거죠, 후우카 씨. 아무도 없는 싱크대 수도에 물이 콸콸 흘러넘치는 걸 보면 무슨 기분이 들죠?"
10018080-75 = "어…… 잠가야겠다?"
10018080-76 = "그거예요. 가격표만큼의 값어치를 하지 못하는 식당을 보면, 저는 그런 충동을 느낀답니다."
10018080-77 = "……조금, 다르게 잠그는 방법도 고려해 줘……"
10018080-78 = "아무튼간에요."
10018080-79 = "논의의 연장선상에서, 참새정이 냐오푸드와 동일한 경쟁을 하는 것은 불가능에 가깝습니다."
10018080-80 = "오히려 저쪽에서 이런 조건을 걸어 줘서, 그나마 한시적으로 비슷하게나마 겨뤄 볼 수 있게 된 것이죠."
10018080-82 = "……차라리 그런 설명을 처음부터 하지 그랬어."
10018080-83 = "아무튼, 위기는 거꾸로 생각하면 기회일 수 있습니다."
10018080-84 = "여기서 승리하면 모든 것을 한 번에 되찾을 수 있어요."
10018080-85 = "그리고 저는 저희가 질 것이라고는 조금도 생각하지 않습니다."
10018080-86 = "나중에 말이야…… 도박 같은 건 웬만하면 손대지 마. 하루나."
10018080-87 = "무슨 뜻이죠?"
10018080-88 = "저는 미식 이외의 길을 추구할 생각은 조금도 없습니다만?"
10018080-89 = "그래…… 잘 생각했어."
10018080-94 = "400인분이라니……"
10018080-95 = "지금까지 그 정도의 대량 조리를 해 본 적은 없는데……"
10018080-96 = "그 부분은 후우카 씨가 어떻게든 해 주지 않을까 하는데요★"
10018080-97 = "나는 소원을 들어주는 만능의 기계장치 같은 게 아니거든?!"
10018080-98 = "그리고 내가 대량 조리를 할 때마다…… 뭔가 꼭 하나씩 사고가 나곤 했고……"
10018080-99 = "그 부분은 저희가 최대한 지원하도록 하겠습니다. 걱정 마세요."
10018080-100 = "구체적으로 어떻게?"
10018080-101 = "맛보기는 맡겨 주세요. 설탕 한 스푼, 간장 한 방울까지 그 차이를 구분해 드리죠."
10018080-106 = "결국 먹기만 하겠다는 소리잖아!"
10018080-109 = "결국…… 그때 야채들을 사들였던 건 냐오푸드였군요……"
10018080-110 = "미안하게 됐어. 우리 사정도 조금 이해해 주었으면 해."
10018080-111 = "어쩔 수 없으셨겠죠. 너무 마음 쓰지 마세요."
10018080-112 = "그 때 냐오푸드가 사 갔던 식재료들을 재공급 받아, 이렇게나마 쓸 수 있게 되었으니까요."
10018080-113 = "같은 식재료를 사용한 참새정과 냐오푸드의 대결이라…… 가슴이 웅장해지는군."
10018080-114 = "기대하고 있다고. 힘내."
10018080-119 = "어라, 그런데 식재료의 상태가……?"
10018080-120 = "무슨 문제라도……"
10018080-124 = "있군."
10018080-125 = "뭐야, 이거. 여기 저기 짓눌리고 뭉개져서, 3분의 1 정도는 버려야겠는걸."
10018080-126 = "너무 심하잖아. 평소 같았으면, 절대 이렇게 조잡하게 포장하지 않을 텐데……"
10018080-130 = "우으…… 하지만 대결 규칙 상 다른 식재료는 쓸 수 없게 되어 있으니……"
10018080-136 = "'안전하지 않게 배송시켜, 식재료를 엉망으로 만들기 작전' 성공."
10018080-137 = "좋아. 연락하자."
10018080-144 = "잠깐만. 이 식재료들, 상태가 왜 이래?"
10018080-145 = "냐오푸드 본사에 보내졌던 건 며칠 정도밖에 안 됐는데,"
10018080-146 = "한 달은 지난 것 마냥 엉망이잖아?"
10018080-147 = "그렇게 싱싱하던 것들이 이렇게 되어버렸다니……"
10018080-148 = "어쩌면 좋죠?!"
10018080-149 = "냐오푸드도 똑같은 식재료를 쓴다면 그나마 공정한 경쟁이 되겠지만……"
10018080-150 = "모르겠군. 과연 그렇게 하려고 할까……?"
10018080-155 = "됐어. 위쪽에 전해."
10018080-156 = "'허술한 보관으로 식재료를 더 빨리 상하게 만들기 작전' 성공."
10018080-160 = "조미료는…… 괜찮을 줄 알았는데……"
10018080-161 = "제가 대신 사과드리고 싶네요."
10018080-162 = "돈을 받고 넘긴 순간 더 이상 제 상품이 아니라는 것은 알지만……"
10018080-166 = "그렇다고 병에 다 금이 가고 깨어져 와서야……"
10018080-167 = "상품을 제대로 다루지 않는 식품 회사라니, 참으로 언어도단입니다."
10018080-168 = "말씀만이라도…… 감사하네요."
10018080-171 = "그래도…… 어떻게든 식재료를 모을 수는 있었네요……"
10018080-172 = "으응……"
10018080-173 = "애초에 조건이 '이 상점 거리에서 구한 식재료만 사용할 것' 이었으니……"
10018080-179 = "그렇다고는 해도 한 번 이렇게 유통을 엉망으로 만들어 버리면,"
10018080-180 = "나중에 분명 크게 대가를 치를 텐데요."
10018080-184 = "어쩌려는 걸까요, 냐오푸드의 회장님은★"
