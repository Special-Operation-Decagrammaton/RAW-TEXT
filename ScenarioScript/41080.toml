[translation]
41080-1 = "제8화;당근 작전 2"
41080-2 = "D.U. 항만 내 하역장"
41080-6 = "여기는 RABBIT 1. 현재 시각은 2100시. 지금 막 포인트 델타에 도착했습니다."
41080-7 = "현 위치에 별다른 위협은 파악되지 않았으며, <당근>이 위치한 포인트 에코까지 지체없이 이동하도록 하겠습니다."
41080-8 = "여기는 캠프 RABBIT. 각 위치에서 소대원들의 GPS 신호를 확인."
41080-9 = "이 하역장의 보안 업무를 맡고 있는 경비 업체의 근무 시프트를 확인해보니 특별한 변경점은 없었어."
41080-10 = "아마 포인트 에코까지의 이동을 방해하는 적은 없을 거야."
41080-11 = "[s] \"이래도 괜찮은 걸까…….\""
41080-12 = "……뭔가요, 선생님."
41080-13 = "여기까지 따라오셔서 잔소리를 늘어놓으실 생각이라면 먼저 돌아가 주셨으면 합니다."
41080-14 = "특수부대의 작전 현장은 선생님께는 지극히 위험하니까요."
41080-15 = "[s] \"무슨 문제라도 생길까 봐 걱정되어서.\""
41080-16 = "설마 저희가 도둑질 같은 걸 할까 봐 그러시는 건가요?"
41080-17 = "당연히 시민을 지키기 위해 조직된 SRT 학원의 학생으로서 시민의 재산을 훔칠 생각은 없습니다."
41080-18 = "파악한 바에 따르면 이곳에 적재된 빈 드럼통은 폐기 처분 예정인 폐자재로, 저희가 가져간다 해서 이들에게 금전적 손해가 발생하는 물건은 아닙니다."
41080-19 = "오히려 기업 입장에서는 처리 비용을 아낄 수 있어 이득을 보게 되는 셈이지요."
41080-20 = "[s] \"그럼 그냥 달라고 하면 안 되는 거야?\""
41080-21 = "그건……"
41080-22 = "버릴 예정인 물건을 달라고 직접 구걸하면 거지 같잖아."
41080-23 = "지금은 노숙을 하고 있지만, 우리는 SRT 학원의 엘리트들이라고! 다른 사람의 동정 따위에 기댈 수는 없어!"
41080-24 = "[s] \"하지만 저번에는……\""
41080-25 = "그때, 도시락은 그러니까……"
41080-26 = "시끄러워!"
41080-27 = "폐기 도시락도 우리가 '확보'한 거지, 절대로 구걸해서 얻어낸 게 아니거든?!"
41080-28 = "우리의 자존심은 절대로 꺾이지 않으니까—"
41080-29 = "……RABBIT 2. 진정하고 목소리를 줄여주세요. 이곳은 적진입니다."
41080-30 = "우선 돌입에 앞서 경로에 위험 요소가 없는지 선두 정찰을 부탁드리겠습니다."
41080-31 = "그런데 어째서 미야코. 네가 다시 자연스럽게 지휘를 맡는 거야?"
41080-32 = "……작전 중에는 이름 대신 호출 코드를 사용해주세요, RABBIT 2. 신원이 들통날 수도 있습니다."
41080-33 = "쳇, 이럴 때만 정론을……"
41080-34 = "그보다 말 돌리지 말고 대답해. 지금에 와서 왜 네가 멋대로 지휘를 맡는 거야?"
41080-35 = "그건…… 제가 이 소대의 소대장이기 때문에……."
41080-36 = "그래, 높으신 분들이 네게 소대장 역할을 맡겼지."
41080-37 = "무책임하게 SRT 학원을 폐쇄한 그 총학생회의 높으신 분들 말이야."
41080-38 = "……."
41080-39 = "그런데 총학생회에 반기를 들고 일어난 마당에, 이제는 누가 지휘를 맡든 상관없지 않겠어?"
41080-43 = "……다른 분들은 어떻게 생각하시나요?"
41080-45 = "나는 상관없어. 어차피 미야코나 사키나 마음에 안 드는 건 매한가지고."
41080-46 = "난…… 잘 모르겠어……."
41080-48 = "……알겠습니다."
41080-49 = "그럼 이번 작전에 한해 소대장 권한을 이양하겠습니다."
41080-50 = "지휘를 부탁합니다, RABBIT 2."
41080-51 = "흥. 훈련된 적도 아닌 경비원들 상대로 하는 작전은 식은 죽 먹기지."
41080-52 = "탈취 상황을 가정한 모의 훈련은 눈 감고도 수행할 수 있을 만큼 자주 해봤다고."
41080-54 = "저, 사키 쨩……"
41080-55 = "아니, RABBIT 2. 나는 어디서 대기하면 좋을까?"
41080-56 = "응? 그러니까, 저격 요원 말이야?"
41080-57 = "자, 잠시만 기다려 봐. 시가전에서 유효한 저격수의 배치를 적은 노트가 이 근처에……."
41080-64 = "으으…… 저녁에 음료를 너무 마셨나. 갑자기 화장실이……."
41080-66 = "……누가 다가옵니다!"
41080-67 = "뭐? 이 근처는 순찰 경로가 아니었잖아?"
41080-68 = "나, 나도 몰라! 계획에 없던 돌발 상황인걸!"
41080-69 = "사, 사키 쨩! 어떻게 하지? 경비원이 이쪽으로 오고 있어!"
41080-70 = "우으으…… 나, 정면 승부는 자신 없는데…… 도망칠까?"
41080-71 = "그, 그게 그러니까……."
41080-72 = "높은 곳! 높은 곳으로 일단 올라가!"
41080-73 = "교범에 따르면 저격의 기본은 시야 확보라고 했지. 높은 곳에 올라가면 상황이 어찌 되었든 저격은 할 수 있을 테니까."
41080-75 = "잠깐만요, 사키. 이곳의 크레인 타워는 저격에는 용이하지만, 도주가—"
41080-76 = "나한테 명령하지 마, 미야코! 나도 그 정도는 알고 있거든?!"
41080-77 = "응? 이게 무슨 소리지……?"
41080-85 = "침입자다!"
41080-86 = "선적된 물건을 훔치러 온 좀도둑인가?!"
41080-87 = "누가 누구더러 좀도둑이래!"
41080-91 = "모두 교전 개시! 최대한 화력을 투사하며 포인트 엡실론까지 각자 이동하는 거야!"
