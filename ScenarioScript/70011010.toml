70011010-186 = "คือว่า... มีนักโทษแหกคุก..."
70011010-187 = "คะ... คะ?!! แหกคุกเหรอคะ?!"
70011010-188 = "เมื่อไรคะ?! ใครกันคะ?! วาคาโมะหรือเปล่า?! แล้วหลบหนีไปคนเดียวหรือเปล่าคะ?!"
