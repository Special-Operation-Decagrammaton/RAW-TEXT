70011010-122 = "ก่อนอื่นนะ เธอที่อยู่ตรงนั้นน่ะ กลับห้องตัวเองไปก่อนเลย แล้วก็ถืออันนั้นไปด้วย"
70011010-123 = "อืม... ฉันไม่ได้ตั้งใจให้เป็นแบบนี้แท้ๆ รู้สึกผิดขึ้นมาเลย"
70011010-124 = "เห็นทีฉันควรลดคาเฟอีนบ้างแล้วละ... ขอโทษนะ ซึสึจัง!"
