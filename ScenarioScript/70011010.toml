[translation]
70011010-1 = "監原美鈴的憂鬱（１）"
70011010-2 = ""
70011010-3 = "謝謝你，鈴醬！"
70011010-4 = "多虧有你，才讓我鼓起了重新開始的勇氣！我出去後一定會聯絡你的！"
70011010-5 = "那是因為你付出了很多努力。"
70011010-6 = ""
70011010-8 = ""
70011010-9 = ""
70011010-10 = ""
70011010-11 = ""
70011010-12 = "鈴醬好厲害！連續三個月都拿到模範獎耶！"
70011010-13 = "別說矯正局了，整個女武神應該也只有鈴醬能辦到吧？"
70011010-14 = "這都是多虧了大家的幫助。"
70011010-15 = ""
70011010-17 = ""
70011010-18 = ""
70011010-19 = ""
70011010-20 = ""
70011010-21 = "果然……只有鈴醬可以吧？"
70011010-22 = "鈴醬？啊，是說監原美鈴嗎？#n可是……他的個性真的沒問題嗎？"
70011010-23 = "畢竟他有實績在嘛……"
70011010-24 = "（……嗯？咦？）"
70011010-25 = "啊，在那裡！是監原美鈴同學對吧！？"
70011010-26 = ""
70011010-28 = ""
70011010-29 = ""
70011010-30 = ""
70011010-31 = ""
70011010-32 = "請分享一下被任命為下任矯正局長的感想！"
70011010-33 = "（怎麼會變成這樣？）"
70011010-34 = "（這種事並不是我……）"
70011010-35 = ""
70011010-37 = ""
70011010-38 = ""
70011010-39 = ""
70011010-40 = ""
70011010-41 = ""
70011010-42 = ""
70011010-43 = ""
70011010-44 = ""
70011010-45 = ""
70011010-46 = ""
70011010-48 = "……醬。"
70011010-50 = "鈴醬。"
70011010-51 = "哇啊！？"
70011010-52 = "嚇我一跳！發生什麼事了，怎麼反應這麼大？"
70011010-53 = "沒，沒什麼……只是稍微恍神了一下……"
70011010-54 = "鈴醬本來就有點迷糊，之後要小心點哦，哈哈！"
70011010-55 = "耶嘿嘿……就是說啊。#n我會小心的，謝謝你的關心。"
70011010-56 = "話說，關於之前拜託你的東西……"
70011010-57 = "啊，是這個吧……？"
70011010-58 = ""
70011010-60 = ""
70011010-61 = ""
70011010-62 = "對對，就是這個！#n要是沒有這個的話，早上根本就提不起精神來。"
70011010-63 = "謝謝你，鈴醬！下次也拜託你囉！"
70011010-64 = "啊，那個……按照規定，像這樣持續帶入外部物品是很困難的……"
70011010-65 = "所以下次可能沒辦法……"
70011010-66 = "嗯？一直以來都沒問題的話，下次應該也沒問題吧？"
70011010-67 = "所以說，那些都算是特例……"
70011010-68 = "那下次也請你當成特例囉～"
70011010-69 = "好的……"
70011010-70 = "啊，不過，要不要試著慢慢減少呢？#n畢竟這終究是個對身體不好的習慣。"
70011010-71 = "唔嗯……這倒是沒錯啦。"
70011010-72 = "嗯？等一下，那邊的。"
70011010-73 = ""
70011010-75 = ""
70011010-76 = ""
70011010-77 = "嘖！是獄警！"
70011010-78 = "就說了我們不是獄警……唉，算了。"
70011010-79 = "這次又惹了什麼麻煩？"
70011010-80 = "不是，怎麼二話不說就懷疑我啊！太冤枉了！"
70011010-81 = "你先照照鏡子再說吧。#n而且更重要的是……"
70011010-82 = ""
70011010-84 = "……"
70011010-85 = ""
70011010-87 = ""
70011010-88 = "……在我搜身之前，老實把東西全部交出來。"
70011010-89 = "呿。"
70011010-90 = ""
70011010-92 = ""
70011010-93 = ""
70011010-94 = "……這是什麼？"
70011010-95 = "看就知道了吧？是綠茶拿鐵的沖泡包。"
70011010-96 = "即溶咖啡之類的東西，不是只要提出申請就會發放了嗎？"
70011010-97 = "那東西太難喝了。"
70011010-98 = "說什麼難喝……這裡又不是讓你來渡假的地方……"
70011010-99 = "而且這個不是很貴嗎？你的錢是哪裡來的？"
70011010-100 = "咦？是嗎？"
70011010-101 = "等等。你連價格都不知道的話……有確實付錢給局長嗎？"
70011010-102 = "啊，那個是我自己選的。"
70011010-103 = "畢竟被關在這裡一定很悶，所以就想至少讓他吃點好吃的東西……耶嘿嘿。"
70011010-104 = "而且啊！管理被收容學生的身體狀況，也是我們的主要工作吧？"
70011010-105 = "局長。"
70011010-106 = "……果然還是不行嗎？#n耶嘿嘿……"
70011010-107 = "每次都這樣偷帶東西進來，會增加我們在管理方面的負擔的。"
70011010-108 = "對不起……"
70011010-109 = "等等，不要怪鈴醬。是我硬要他幫我的。"
70011010-110 = "要罵就罵我吧！！！"
70011010-111 = ""
70011010-113 = ""
70011010-114 = "這不是理所當然的嗎……"
70011010-115 = "怎麼被你說得好像我才是壞人一樣啊……？"
70011010-116 = "喂，發生什麼事了？"
70011010-117 = ""
70011010-119 = ""
70011010-120 = "啊，前輩。"
70011010-121 = "啊～我大概知道是什麼情況了。"
70011010-122 = "你先回房間去吧。那個東西也順便帶走。"
70011010-123 = "嗯……本來沒打算變成這樣的，總覺得很抱歉。"
70011010-124 = "果然還是減少咖啡因吧……鈴醬，對不起！"
70011010-125 = ""
70011010-127 = ""
70011010-128 = "耶嘿嘿……路上小心哦。"
70011010-129 = "局長，那我們也回去工作了。"
70011010-130 = ""
70011010-132 = ""
70011010-133 = ""
70011010-134 = ""
70011010-135 = "好的，接下來也拜託你們了……"
70011010-137 = "就這樣含糊帶過沒問題嗎？"
70011010-138 = "你也知道局長的個性吧？我們得配合他才行。"
70011010-139 = "唉……美鈴局長善良過頭了啦。"
70011010-140 = "啊不是，雖然我可以理解他的想法，也還挺喜歡他這個人的……"
70011010-141 = "我知道你想說什麼，不過每個人都有適合自己的位置。"
70011010-143 = "像他這樣的人……確實不適合擔任矯正局長呢。"
70011010-148 = ""
70011010-149 = ""
70011010-150 = "……今天也總算撐過去了呢。"
70011010-151 = ""
70011010-153 = ""
70011010-154 = "雖然一直有這種感覺……果然局長室對我一個人來說還是太寬敞了呢。"
70011010-155 = "之前擔任局員的時候，反而覺得位置太小很不舒服……#n要是可以把這些空間分給大家就好了……"
70011010-156 = ""
70011010-158 = ""
70011010-159 = ""
70011010-160 = "前任的局長們也有過類似的想法嗎？#n還是我的想法太平民了呢？"
70011010-161 = ""
70011010-163 = ""
70011010-164 = ""
70011010-165 = "想太多只會變得消極，還是到此為止吧。"
70011010-166 = "不如來想些開心的事吧。#n今天可是難得提早完成了工作呢。"
70011010-167 = "……雖然有點勉強，看來還是能趕在期限之內把這個做好。"
70011010-168 = ""
70011010-170 = ""
70011010-171 = "呵呵。"
70011010-172 = "果然織毛線的時候，心情會變得很平靜呢。"
70011010-173 = "要是時間就這樣靜止──"
70011010-174 = ""
70011010-176 = ""
70011010-177 = "局長！"
70011010-178 = "是，是──！？"
70011010-179 = ""
70011010-182 = ""
70011010-183 = "很抱歉這麼晚還來打擾！#n不過我認為這件事還是趕緊報告會比較好……"
70011010-184 = "啊，沒關係的。#n如果是緊急事務的話，當然得優先處理才行。"
70011010-185 = "所以發生什麼事了？"
70011010-186 = "那個……有囚犯嘗試越──"
70011010-187 = "什，什麼！？越獄！？"
70011010-188 = "什麼時候！？誰！？是若藻嗎！？他一個人！？"
70011010-189 = "呃……不是的。"
70011010-190 = "不是一個人！？"
70011010-191 = "那是幾個若藻！？"
70011010-192 = "呃，若藻應該只有一個才對……"
70011010-193 = "況且若藻他早就越獄成功了吧。局長您還好嗎？"
70011010-194 = "啊，說的也是……都怪我太慌張了。"
70011010-195 = "總之請先冷靜下來。#n越獄的行動已經被阻止了。"
70011010-196 = "只是因為此事非同小可，需要由局長親自判斷該如何處置。"
70011010-197 = "這是越獄未遂犯的個人資料。"
70011010-198 = ""
70011010-200 = ""
70011010-201 = ""
70011010-202 = "啊，如果是這樣的話……"
70011010-203 = ""
70011010-205 = ""
70011010-206 = ""
70011010-207 = ""
70011010-208 = ""
70011010-209 = "能給我一點時間準備嗎？#n我想跟他進行個人面談。"
70011010-210 = "也就是說，您要進行審訊對吧？"
70011010-211 = "……雖然我不太喜歡這個說法，不過是的。"
70011010-212 = "可是讓局長親自審訊那種試圖越獄的危險囚犯，再怎麼說都有點……"
70011010-213 = "畢竟矯正局人手不足嘛……"
70011010-214 = "請讓我做吧。"
70011010-215 = "……明白了，我這就去準備。"
70011010-216 = ""
70011010-218 = ""
70011010-220 = ""
70011010-221 = ""
70011010-223 = "……如果是以前的矯正局，明明不會發生這種事的。"
