[translation]
70011010-1 = "칸바라 미스즈의 우울 1"
70011010-3 = "고마워, 스즈 쨩!"
70011010-4 = "나, 덕분에 재출발할 용기가 생겼어! 나가서도 꼭 연락할 테니까!"
70011010-5 = "반대로, 당신이 그만큼 노력한 것이죠."
70011010-12 = "대단해, 스즈 쨩! 3개월 연속 모범상이라니!"
70011010-13 = "교정국이 아니라 발키리 전체에도 그런 학생은 스즈 쨩밖에 없을걸?"
70011010-14 = "반대로, 주변 분들께서 도움을 주신 덕이죠."
70011010-21 = "역시…… 스즈 쨩밖에 없겠지?"
70011010-22 = "스즈 쨩? 아, 칸바라 미스즈 말이네? 근데 괜찮을까? 성격이……."
70011010-23 = "그렇지만 실적이 있으니까……."
70011010-24 = "(……응? 어라?)"
70011010-25 = "아, 저기 있다! 칸바라 미스즈 님이시죠?!"
70011010-32 = "차기 교정국장으로 선임되신 소감 한마디 부탁드립니다!"
70011010-33 = "(어쩌다 이렇게 되었지?)"
70011010-34 = "(나는 이런 거…….)"
70011010-48 = "……즈 쨩."
70011010-50 = "스즈 쨩."
70011010-51 = "하이얏?!"
70011010-52 = "깜짝야! 왜 그래, 갑자기?"
70011010-53 = "아, 아니요…… 조금 딴생각을 하느라……."
70011010-54 = "스즈 쨩은 안 그래도 얼빠진 구석이 있으니까 조심해야지, 하하!"
70011010-55 = "에헤헤…… 그러게요. 조심할게요. 걱정 감사합니다."
70011010-56 = "……그나저나, 전에 부탁했던 물건 말인데."
70011010-57 = "아, 이거, 말이죠……?"
70011010-62 = "그래, 이거이거! 이게 없으면 아침에 정신을 못 차리겠단 말이야."
70011010-63 = "고마워, 스즈 쨩! 다음에도 잘 부탁할게!"
70011010-64 = "아, 그게, 규정상 이렇게 외부 물품을 계속 반입하는 것은 어려워서요……."
70011010-65 = "다음번에는 조금 곤란할지도……."
70011010-66 = "응? 저번에도 됐고, 이번에도 됐잖아?"
70011010-67 = "그러니까, 그건 조금 특례 같은 거라……."
70011010-68 = "그냥 다음에도 특례로 부탁할게~"
70011010-69 = "네에……."
70011010-70 = "아, 그렇지만, 조금씩 줄여보는 게 어때요? 몸에 좋지 않은 습관이니까요."
70011010-71 = "응? 뭐…… 그렇긴 하지만."
70011010-72 = "응? 잠깐, 거기."
70011010-77 = "겍! 간수!"
70011010-78 = "그러니까, 우리는 간수가 아니라…… 에휴, 됐다."
70011010-79 = "이번에는 또 무슨 문제를 저지른 거냐?"
70011010-80 = "아니, 그렇게 다짜고짜 의심하는 법이 어딨어! 억울해!"
70011010-81 = "거울을 보고 말해라, 거울을. 그리고 무엇보다……."
70011010-84 = "……."
70011010-88 = "……소지품 검사하기 전에, 순순히 전부 꺼내 놔."
70011010-89 = "칫."
70011010-94 = "……? 뭐야, 이건?"
70011010-95 = "보면 알잖아. 녹차라테 스틱이야."
70011010-96 = "인스턴트커피 정도는, 신청하면 지급해 주고 있잖아."
70011010-97 = "그건 써서 맛없어."
70011010-98 = "맛이 없다니……. 여기 놀러 온 것도 아니고……."
70011010-99 = "게다가 이거 꽤 비싼 거 아니야? 돈은 어디서 났어?"
70011010-100 = "어, 그래?"
70011010-101 = "잠깐. 너, 가격도 모르고…… 국장님께 제대로 돈은 드린 거야?"
70011010-102 = "아, 저기, 이거는 제가 멋대로 고른 거라서요."
70011010-103 = "안 그래도 갇혀 있어 답답할 텐데, 음식이라도 맛있는 걸 먹었으면 해서, 에헤헤……."
70011010-104 = "아! 그리고, 또! 수감 학생들의 컨디션 관리는 저희 주요 업무이기도 하잖아요?"
70011010-105 = "국장님."
70011010-106 = "……역시, 안 되겠죠? 에헤헤……."
70011010-107 = "매번 이런 식으로 반입을 들여다 주시면, 관리하는 저희 일만 늘어나니까요."
70011010-108 = "죄송합니다……."
70011010-109 = "잠깐, 스즈 쨩한테 너무 그러지 마. 내가 무리하게 부탁한 거니까."
70011010-110 = "차라리 나한테 뭐라고 해!!!"
70011010-114 = "아니, 뭔 당연한 소리를……."
70011010-115 = "내가 나쁜 사람이야?"
70011010-116 = "거기, 다들 무슨 일이야?"
70011010-120 = "아, 선배."
70011010-121 = "……아아~ 대충 무슨 상황인지 알겠네."
70011010-122 = "일단, 거기 너. 먼저 방으로 돌아가. 거기 그것도 가져가고."
70011010-123 = "음…… 이럴 생각은 없었는데. 뭔가, 되게 미안하네."
70011010-124 = "역시 카페인은 줄이는 편이 좋으려나…… 미안해, 스즈 쨩!"
70011010-128 = "에헤헤…… 조심히 들어가세요."
70011010-129 = "그러면, 국장님. 저희도 업무 보러 가겠습니다."
70011010-135 = "네, 남은 시간도 잘 부탁드려요오……."
70011010-137 = "이렇게 어물쩍 넘어가도 돼요?"
70011010-138 = "국장님 성격은 너도 알잖아. 우리가 맞춰 드려야지."
70011010-139 = "에휴…… 미스즈 님은 너무 유하세요."
70011010-140 = "아니, 제 말은 좋으신 분이고, 저도 좋아하지만……."
70011010-141 = "뭐, 무슨 말을 하고 싶은지는 알아. 사람마다 어울리는 자리가 있으니까."
70011010-143 = "교정국장에는 안 어울리는 분이시지."
70011010-150 = "……오늘 하루도, 겨우 지나갔네요."
70011010-154 = "항상 느끼지만, 국장실은 혼자 쓰기에 너무 넓어요."
70011010-155 = "반대로, 국원일 때는 자리가 좁아서 늘 불편했는데, 차라리 이 공간만큼 사람들한테 나눠준다면……."
70011010-160 = "전임 국장님들도 비슷한 생각을 했을까요? 아니면, 역시 제가 지나치게 소시민적인 걸까요?"
70011010-165 = "길게 생각해도, 부정적으로 될 뿐이니까 그만두죠."
70011010-166 = "반대로, 좋은 것을 생각하죠. 오늘은 모처럼 일이 빨리 끝났잖아요?"
70011010-167 = "……살짝 무리한 감은 있어도, 그래도 날짜에 맞춰 완성할 수 있겠어요."
70011010-171 = "후후."
70011010-172 = "역시, 뜨개질을 하고 있으면, 마음이 편안해지네요."
70011010-173 = "이대로 시간이 멈췄으면……."
70011010-177 = "국장님!"
70011010-178 = "네, 넵?!"
70011010-183 = "늦은 시간에 죄송합니다! 아무래도 급하게 보고드리는 편이 좋아 보여……."
70011010-184 = "아, 괜찮아요. 급한 용무라면, 그쪽이 더 중요하죠."
70011010-185 = "그래서, 무슨 일인가요?"
70011010-186 = "그게, 죄수가 탈옥……."
70011010-187 = "ㄴ, 네에?! 탈옥이요?!"
70011010-188 = "언제요?! 누가요?! 와카모인가요?! 혼잔가요?!"
70011010-189 = "어…… 아닌데요."
70011010-190 = "혼자가 아니라고요?!"
70011010-191 = "그러면 와카모 몇 명이죠?!"
70011010-192 = "아뇨, 와카모는 한 명밖에……."
70011010-193 = "애초에 와카모는 진작에 탈옥했잖아요. 무슨 말이에요?"
70011010-194 = "아, 그랬었죠……. 너무 놀라서 그만."
70011010-195 = "일단, 진정해 주세요. 탈옥 시도는 제대로 저지했습니다."
70011010-196 = "다만, 건이 건인 만큼, 처우에 대해 국장님의 판단이 필요해서요."
70011010-197 = "여기, 탈옥 미수범의 신상 기록입니다."
70011010-202 = "아, 그런 일이라면……."
70011010-209 = "조금만 준비할 시간을 주시겠어요? 제가 개인 면담을 할게요."
70011010-210 = "그러니까, 취조 말씀이시죠?"
70011010-211 = "……좋아하는 표현은 아니지만, 일단은요."
70011010-212 = "아무리 그래도 국장님께서 탈옥수처럼 위험한 죄수를 직접 취조하시기엔……."
70011010-213 = "교정국에는."
70011010-214 = "일손이 없잖아요. 제가 거들게 해주세요."
70011010-215 = "……알겠습니다. 준비해 두겠습니다."
70011010-223 = "……전에는 교정국도 이렇지 않았는데 말이죠."
