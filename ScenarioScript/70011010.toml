70011010-51 = "เฮือกก?!"
70011010-52 = "ตกใจหมดเลย! จู่ๆ ก็เป็นอะไรไปน่ะ?"
70011010-53 = "ปะ... เปล่าค่ะ... ฉันแค่กำลังคิดเรื่องอื่นอยู่..."
70011010-54 = "ซึสึจังน่ะชอบเหม่อลอยบ่อยๆ ต้องระวังบ้างนะ ฮ่าฮ่า!"
70011010-55 = "แหะๆๆ... นั่นสินะคะ ฉันจะระมัดระวังค่ะ ขอบคุณที่เป็นห่วงนะคะ"
70011010-56 = "จะว่าไปแล้ว... ของที่ฉันขอร้องไว้เมื่อครั้งก่อน..."
70011010-57 = "อ้อ หมายถึงอันนี้ใช่มั้ยคะ...?"
70011010-58 = ""
70011010-60 = ""
70011010-61 = ""
70011010-62 = "ใช่แล้ว นี่แหละที่ฉันต้องการ! ถ้าไม่มีสิ่งนี้ละก็ ตอนเช้าฉันคงตั้งสติไม่ได้แน่ๆ"
70011010-63 = "ขอบใจนะ ซึสึจัง! ไว้จะมารบกวนใหม่นะ!"
70011010-64 = "อ่า คือว่า... ตามระเบียบแล้วการนำของภายนอกเข้ามาบ่อยๆ ไม่ใช่เรื่องง่ายน่ะค่ะ..."
70011010-65 = "ครั้งต่อไปอาจจะลำบากก็ได้..."
70011010-66 = "หืม? ครั้งที่แล้วก็ทำได้ แล้วครั้งนี้ก็ทำได้อีกไม่ใช่เหรอ?"
70011010-67 = "พอดีว่า... มันเหมือนเป็นกรณีพิเศษน่ะค่ะ..."
70011010-68 = "งั้นต่อไปฉันก็จะรบกวนเป็นกรณีพิเศษแล้วกัน~"
70011010-69 = "ค่ะ..."
70011010-70 = "อ่า แต่ว่า... ค่อยๆ ลดปริมาณลงหน่อยดีมั้ยคะ? แบบนี้มันไม่ดีต่อร่างกายนะคะ"
70011010-71 = "หืม? ก็นะ... ที่พูดมามันก็จริงอยู่"
70011010-72 = "เอ๋? เดี๋ยวนะ คนที่อยู่ตรงนั้นน่ะ"
70011010-73 = ""
70011010-75 = ""
70011010-76 = ""
70011010-77 = "เฮือก! ผู้คุม!"
70011010-78 = "พวกฉันไม่ใช่ผู้คุมสักหน่อย... เฮ้อ แต่ก็ช่างเถอะ"
70011010-79 = "ครั้งนี้ไปก่อปัญหาอะไรมาอีกล่ะ?"
70011010-80 = "อะไรกัน มาสงสัยฉันโดยไม่มีเหตุผลได้ยังไง! แบบนี้ไม่ยุติธรรมนะ!"
70011010-81 = "ก็เพราะเป็นเธอน่ะสิฉันถึงถามอย่างนั้น แต่ที่สำคัญกว่านั้นน่ะ..."
