70011010-194 = "อ๊ะ นั่นสินะคะ... พอดีฉันตกใจมากไปน่ะ"
70011010-195 = "เอาเป็นว่าใจเย็นๆ ก่อนนะคะ พวกฉันขัดขวางการแหกคุกนั้นไว้ได้แล้วค่ะ"
70011010-196 = "แต่นี่เป็นเรื่องใหญ่ พวกฉันก็เลยอยากให้หัวหน้าเป็นคนตัดสินใจเรื่องการพิจารณาโทษน่ะค่ะ"
70011010-197 = "นี่คือบันทึกประวัติส่วนตัวของนักโทษที่พยายามแหกคุกในครั้งนี้ค่ะ"
