70011010-20 = ""
70011010-21 = "ก็น่าจะ... มีแค่ซึสึจังคนเดียวละนะ?"
70011010-22 = "ซึสึจัง? หมายถึงคันบาระ มิซึสึใช่มั้ย? ว่าแต่จะไม่เป็นไรเหรอ? เห็นว่านิสัยดีจน..."
