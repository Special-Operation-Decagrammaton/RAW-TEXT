70011010-137 = "ปล่อยเรื่องนี้ไปแบบนี้ได้เหรอคะ?"
70011010-138 = "เธอก็รู้จักนิสัยของหัวหน้าไม่ใช่หรือไง งั้นเราก็ควรปรับตัวให้เข้ากับหัวหน้าสิ"
70011010-139 = "เฮ้อ... คุณมิซึสึเนี่ย ใจดีเกินไปแล้วค่ะ"
70011010-140 = "เอ่อ ฉันหมายถึงฉันก็ชอบที่หัวหน้าเป็นคนดีค่ะ..."
70011010-141 = "เอาน่า ฉันรู้ว่าเธอจะสื่อว่าอะไร เราทุกคนต่างก็มีตำแหน่งที่เหมาะสมกับตัวเอง"
