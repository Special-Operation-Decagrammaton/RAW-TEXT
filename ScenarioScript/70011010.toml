[translation]
70011010-1 = "The Melancholy of Kanbara Misuzu 1"
70011010-3 = "Thanks, Suzu!"
70011010-4 = "Thanks to you, I have the courage to turn over a new leaf! Embrace life! I'll call you when I get out, promise!"
70011010-5 = "If anything, YOU'RE the one who put in all the hard work."
70011010-12 = "Amazing work, Suzu! You've won \"Student of the Month\" 3 times in a row!"
70011010-13 = "You're probably the only one who's ever done that in the history of the Corrections Bureau! In the history of Valkyrie!"
70011010-14 = "Oh... I owe everything to the generous support of my peers."
70011010-21 = "Who else but Suzu, am I right?"
70011010-22 = "Suzu? Oh, you must mean Kanbara Misuzu. Will she be okay? Her personality is so..."
70011010-23 = "But her skills are undeniable."
70011010-24 = "(...Wait. What was that?)"
70011010-25 = "There she is—the lady of the hour! You're Kanbara Misuzu, right?!"
70011010-32 = "You've been appointed as the next head of the Corrections Bureau! How do you feel? What's your plan, Director?"
70011010-33 = "(How did this happen...?)"
70011010-34 = "(I never wanted any of this...)"
70011010-48 = "...zu."
70011010-50 = "Suzu."
70011010-51 = "Hyaaah?!"
70011010-52 = "Whoa! Are you all right?"
70011010-53 = "Oh, yes. Thank you kindly. I was a bit distracted..."
70011010-54 = "You space out a lot, Suzu! You should be more careful. I'd hate for some...unsavory type to get the jump on ya!"
70011010-55 = "Heehee... Guilty as charged. I'll be more careful. Thank you for your concern."
70011010-56 = "...Yeah. Well, about that thing I was askin' you about... If you don't mind..."
70011010-57 = "Oh, you mean this...?"
70011010-62 = "Yeah, precisely! I can't get my morning started without a good hit!"
70011010-63 = "Thanks, Suzu! You take it easy! Same time next week? You know I need my fix!"
70011010-64 = "Well, actually, it's difficult to bring in outside items...on account of the current regulations."
70011010-65 = "So I might not be able to..."
70011010-66 = "Huh? But you brought it in just FINE this time. And last week."
70011010-67 = "Yes, but those were...special cases, you see."
70011010-68 = "Then I hope you can find a \"special case\" next week too! It'd mean a lot to me!"
70011010-69 = "Sure..."
70011010-70 = "But, if I may offer a piece of advice, do try to wean yourself off them. They're not good for your health."
70011010-71 = "Huh? Yeah... You got a point there."
70011010-72 = "Hm? Wait. Freeze."
70011010-77 = "Ack! The prison guard!"
70011010-78 = "Like I said before, we are NOT \"prison guards.\" You know what? Forget it."
70011010-79 = "Just tell me what trouble you're up to."
70011010-80 = "Oh come on, you can't just go suspectin' me right off the bat like that!"
70011010-81 = "You should reflect on YOUR actions and why you're here. And, more importantly..."
70011010-84 = "..."
70011010-88 = "...Let's save me the trouble of searching you, huh? Empty your pockets."
70011010-89 = "Tch."
70011010-94 = "...? What's this?"
70011010-95 = "Can't you tell? Clearly, it's a stick...of drink mix. For a matcha latte."
70011010-96 = "If you need instant coffee, we can provide it. All you have to do is ask."
70011010-97 = "Yeah, but that stuff is bitter. It sucks."
70011010-98 = "So what if it's bitter...? This isn't a vacation, you know..."
70011010-99 = "And where'd you get the money for them? These premium matcha sticks are expensive."
70011010-100 = "Oh, are they?"
70011010-101 = "Wait, you didn't even know? Did you properly pay the director?"
70011010-102 = "Oh, um, I just happened to have a box."
70011010-103 = "I'm sure it's frustrating to be all cooped up, and I thought it would be nice to give her a treat. Heehee..."
70011010-104 = "Ah! After all, our main responsibility is ensuring the students' well-being, right?"
70011010-105 = "Director."
70011010-106 = "...I guess it's not, huh? Heehee..."
70011010-107 = "If you keep smuggling things like this, you'll give us more work."
70011010-108 = "I'm deeply sorry..."
70011010-109 = "Hey! Don't be so harsh on Suzu. I'm the one who asked her! I was real pushy, too!"
70011010-110 = "So if you're going to scold someone, then scold me!"
70011010-114 = "I mean, yeah. I intend to."
70011010-115 = "Wait, why are you acting like I'M the bad guy?"
70011010-116 = "All right, what's going on over here?"
70011010-120 = "Oh, hey."
70011010-121 = "...Ah. I think I get the picture."
70011010-122 = "First, you there. Back to your cell. And take your contraband with you."
70011010-123 = "Sorry... I didn't mean to get you in trouble. I feel awful."
70011010-124 = "But you're right... I'll try to ease off the caffeine. Forgive me, Suzu!"
70011010-128 = "Heehee... Take care."
70011010-129 = "We'll get back to work. Carry on, Director."
70011010-135 = "Yes, I look forward to working with you both again."
70011010-137 = "So, we're really going to let that go? Just move on and let it be?"
70011010-138 = "You know how the director is. We need to work around her."
70011010-139 = "*sigh* You're way too soft, Misuzu."
70011010-140 = "Look, she's a great girl and I like her a lot, but..."
70011010-141 = "I read you. Sometimes, you're just not cut out for the job."
70011010-143 = "I wish her well, but she's got no business running the Corrections Bureau."
70011010-150 = "...Another long day."
70011010-154 = "I've always thought that the director's office was too spacious. All this, for one person?"
70011010-155 = "When I was a junior, everything was so cramped and crowded. I think it would be nice to share this space with everyone else."
70011010-160 = "I wonder if my predecessors felt the same way? Or am I truly the only one?"
70011010-165 = "Well, there's no point in ruminating. I'll stop here."
70011010-166 = "All right, let's reflect on the good things. I finished my work rather quickly today, didn't I?"
70011010-167 = "...I pushed myself a little too much, but the wheels are moving. We're all on schedule. Everyone's taken care of."
70011010-171 = "Fufu."
70011010-172 = "Knitting always helps me relax."
70011010-173 = "If only this moment could last forever..."
70011010-177 = "Director!"
70011010-178 = "Y-Yes?!"
70011010-183 = "I'm so sorry to interrupt, but this is a bit of an emergency!"
70011010-184 = "Oh, it's fine. There's no need to apologize. You're doing your best."
70011010-185 = "So, what's the matter?"
70011010-186 = "Well, there was an escape attempt."
70011010-187 = "Wh-What?! Someone got out?!"
70011010-188 = "When?! Who?! Was it Wakamo?! Did she act alone?!"
70011010-189 = "Uh...no, ma'am."
70011010-190 = "She didn't act alone?!"
70011010-191 = "Then how many Wakamos are we dealing with?!"
70011010-192 = "Um, there's still only ONE Wakamo..."
70011010-193 = "Wait, Wakamo escaped a while ago. You didn't know that?"
70011010-194 = "Oh, right, she did... I recall. I was just so startled."
70011010-195 = "Director, please calm yourself. We suppressed the escape attempt."
70011010-196 = "But...this is a serious matter. We require your guidance, Director."
70011010-197 = "Here are the student's records."
70011010-202 = "Thank you. In that case..."
70011010-209 = "...Could you give me some time to review the file? I would like to counsel her personally."
70011010-210 = "By \"counsel\"...you mean \"interrogate\"?"
70011010-211 = "...It's not my favorite way to put it, but yes."
70011010-212 = "Madame Director, if I may... It's probably best that you refrain from personally speaking with a high-risk guest."
70011010-213 = "We have others in the Corrections Bureau for that. Currently on duty are—"
70011010-214 = "Not many. I know we don't have enough staff. So, please... Allow me to help."
70011010-215 = "...Very well, ma'am. We'll prep a room for you."
70011010-223 = "...The Corrections Bureau wasn't always like this, you know."
