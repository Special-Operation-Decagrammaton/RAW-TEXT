70011010-11 = ""
70011010-12 = "ยอดไปเลยละ ซึสึจัง! ได้รางวัลเชิดชูเกียรติสามเดือนติดต่อกันเลยนะ!"
70011010-13 = "ทั้งสำนักควบคุม ไม่สิ ต้องบอกว่าทั้งวัลคิรี่น่าจะมีนักเรียนแบบซึสึจังแค่คนเดียวเลยละ"
70011010-14 = "ไม่หรอกค่ะ เป็นเพราะฉันได้รับความช่วยเหลือจากทุกคนมากกว่าค่ะ"
