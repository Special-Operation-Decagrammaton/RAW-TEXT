70011010-3 = "ขอบใจนะ ซึสึจัง!"
70011010-4 = "ฉันมีกำลังใจที่จะเริ่มต้นชีวิตใหม่แล้วละ! ต่อให้ออกไปแล้วฉันก็จะติดต่อมาบ่อยๆ นะ!"
70011010-5 = "ไม่หรอกค่ะ คุณต่างหากค่ะที่พยายามอย่างหนัก"
