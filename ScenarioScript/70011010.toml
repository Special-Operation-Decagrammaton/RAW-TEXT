70011010-87 = ""
70011010-88 = "เอาของทั้งหมดที่มีมาให้ดูซะดีๆ ก่อนที่ฉันจะค้นตัว..."
70011010-89 = "ชิ"
70011010-90 = ""
70011010-92 = ""
70011010-93 = ""
70011010-94 = "นี่มันอะไรกัน...?"
70011010-95 = "ดูก็รู้ไม่ใช่เหรอ? ก็มัทฉะลาเต้แบบซองไง"
70011010-96 = "แต่ถ้าขอกาแฟสำเร็จรูป ที่นี่ก็มีให้ไม่ใช่เหรอ?"
70011010-97 = "กาแฟน่ะขมออก ไม่เห็นจะอร่อยเลย"
70011010-98 = "ไม่อร่อยงั้นเหรอ... แล้วคิดว่ามาเพื่อกินของอร่อยๆ หรือไง..."
70011010-99 = "อีกอย่าง มัทฉะนี่มันแพงไม่ใช่เล่นเลยไม่ใช่เหรอ? ไปเอาเงินมาจากไหนน่ะ?"
70011010-100 = "หืม นี่ของแพงเหรอ?"
70011010-101 = "เดี๋ยวนะ นี่เธอไม่รู้ราคาหรอกเหรอ... แล้วให้เงินหัวหน้าสำนักควบคุมไปถูกต้องหรือเปล่า?"
70011010-102 = "อ่า คือว่า... ฉันเป็นคนเลือกมาให้เองน่ะค่ะ"
70011010-103 = "ถ้าต้องถูกคุมตัวอยู่ตลอดก็น่าจะอึดอัด ฉันก็เลยอยากให้ได้กินอะไรอร่อยๆ บ้างน่ะ แหะๆๆ..."
70011010-104 = "อ้อ! อีกอย่าง! การดูแลสภาพความเป็นอยู่ของนักเรียนที่ถูกคุมตัวก็เป็นหน้าที่หลักของฉันอยู่แล้วนี่คะ?"
70011010-105 = "หัวหน้าคะ"
70011010-106 = "ทำแบบนี้... ไม่ได้ใช่มั้ยคะ? แหะๆๆ..."
70011010-107 = "ถ้าหัวหน้าเอาของแบบนี้มาให้ทุกครั้งละก็ มันจะยิ่งเพิ่มภาระงานของพวกฉันมากกว่าค่ะ"
70011010-108 = "ขอโทษค่ะ..."
70011010-109 = "นี่ อย่าไปต่อว่าซึสึจังสิ ฉันต่างหากที่เป็นฝ่ายขอให้เอามาให้"
70011010-110 = "ถ้าจะดุอะไรก็มาดุฉันเถอะ!!!"
