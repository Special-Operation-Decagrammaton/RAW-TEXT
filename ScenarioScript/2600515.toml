[translation]
2600515-1 = "디저트 약탈자"
2600515-2 = "(요시미의 연락을 받고, 근처의 카페 거리로 향했다.)"
2600515-7 = "[ns1] \"……요시미?\"\n[ns2] \"어째서인지 가게 밖으로 나와 있네?\""
2600515-10 = "……다 먹었으니까."
2600515-11 = "안에 앉아서 먹고 있었으면 어차피 또 \"언제까지 먹을 거냐\"는 둥 \"많이도 먹는다\"는 둥 쓸데없는 소리 할 거잖아?"
2600515-12 = "하루이틀 당한 줄 알아? 나도 이제 그런 말에는 대비를 한다고."
2600515-13 = "……응? 딱히 그렇게까지 말한 적은 없지 않냐고?"
2600515-14 = "무, 무슨 상관이야! 그렇다면 그런 줄 알아! 어른이 이런 것까지 하나하나 따지는 거야!?"
2600515-15 = "……뭐?"
2600515-16 = "맛은 있었냐고? 뭐, 그야 그렇지. 이 근방에서도 알아주는 곳이었거든."
2600515-17 = "줄 서는 데에도 시간 꽤나 걸리고……. 그래서 앉은 김에 본전을 건지려고 노력 좀 했지."
2600515-18 = "후후. 종류별로 하나씩은 다 맛본 느낌이라……."
2600515-22 = "돼지 아니니까!!!"
2600515-23 = "[s3] \"아니, 진짜 아무 말도 안 했는데…….\"\n[s4] \"내심 바라는 건가 이건……?\""
2600515-26 = "아무튼! 아무튼이야. 오늘 이렇게 선생님을 부른 데에는 다 이유가 있는 거니까."
2600515-27 = "……자. 이거 받아, 선생님."
2600515-28 = "[s5] \"……이건……. 새로 나온 거야?\"\n[s6] \"나 주려고 하나 포장한 거야?\""
2600515-31 = "뭐, 내 입으로 말하기도 좀 창피하지만 그동안 받은 게 많으니까 말이야."
2600515-32 = "가끔은 이렇게 내 쪽에서 뭔가 주는 것도 있고 해야 하지 않을까? 싶어서."
2600515-36 = "……뭐, 뭐야."
2600515-37 = "뭐야, 그 표정!? 뭐 그렇게 기분 나쁜 표정으로 실실거리며 웃는 건데!?"
2600515-38 = "……그만!"
2600515-39 = "그만, 그 표정 그만! 웃지 마, 웃지 말라고!! 괜히 기분 나쁘니까!!"
2600515-40 = "[s7] \"음~. 맛있어 보이네, 이거~.\"\n[s8] 요시미가 보는 앞에서 디저트를 개봉한다."
2600515-43 = "……!?"
2600515-44 = "왜, 왜 갑자기 그걸 여는 거야!? 아직 길거리라고! 여기서 그냥 먹을 생각이야!?"
2600515-45 = "나중에 먹어, 나중에!! 여기서는 금지!"
2600515-46 = "왜, 왜냐고? 왜냐니, 그야……."
2600515-47 = "뭔가 좀……. 이런 상황……. 뭐랄까……. 남들이 보면……."
2600515-51 = "……아, 좀!! 그냥 좀 그렇다면 그런 줄 알아!! 몇 번 말하게 하지 말라고!!"
2600515-52 = "여기서 열면 나도 뺏어 먹을 거야!! 진짜야, 나는 경고했어!!"
2600515-53 = "……뭐?"
2600515-54 = "어차피 포크도 하나뿐이니 뺏어 먹지도 못할 거 아니냐고?"
2600515-55 = "……하!"
2600515-56 = "방심했구나, 선생님!"
2600515-57 = "나를 얕보는 건 익숙하지만 이번에는 한참 잘 못 찍었어!"
2600515-58 = "다른 사람도 아닌 나를……. 뭐라고 생각하는 거야!?"
2600515-64 = "[ns9] \"……뭐……라고???\"\n[ns10] \"그건 또 뭐야……!?\""
2600515-67 = "선생님이 열어버린 이상……."
2600515-68 = "나도 이제는 어쩔 수 없지."
2600515-69 = "\"방과후 디저트부\"의 일원이자 트리니티 디저트 챌린지의 랭커, 한정판의 제왕!!"
2600515-70 = "나, <이바라기 요시미>의 필살기!! <디저트 약탈자>가 울부짖을 것이야!!"
2600515-74 = "……비기!!"
2600515-75 = "빼앗아 먹어라, <디저트 약탈자>!!!"
2600515-76 = "[s] \"뭣……!!\""
2600515-80 = "어딜 도망치는 거야!? 거기 서지 못해!!"
2600515-81 = "멈춰, 멈추라고!!!"
2600515-88 = "(달려드는 요시미를 피하려다 그대로 바닥에 같이 엎어졌다.)"
2600515-89 = "(다행히 디저트는 떨어지지 않았지만, 정말로 절반 가까이 요시미에게 빼앗겨 버렸다…….)"
