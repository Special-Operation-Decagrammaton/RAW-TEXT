[translation]
1010506-1 = "일탈하는 용기"
1010506-2 = " (업무를 마친 저녁, 마리의 말대로 트리니티의 성당을 찾아갔다.)"
1010506-8 = "[ns1] \"……마리?\"\n[ns2] \"아무도 없나…….\""
1010506-11 = "……아, 선생님. 오셨군요."
1010506-12 = "귀한 시간 내어주셔서……. 감사합니다."
1010506-13 = "……놀라신 표정이네요."
1010506-14 = "역시 조금 갑작스러우셨을까요……?"
1010506-15 = "하지만 이렇게라도 하지 않으면,"
1010506-16 = "이런 곳을……. 잡을 수 없을 것 같아서요."
1010506-17 = "……아, 걱정하실 것 없답니다."
1010506-18 = "다른 분들은, 지금 안 계시니까요."
1010506-19 = "네. 지금 이곳에는 오직 선생님과 저만."
1010506-20 = "처음부터……. 그것을 위해 부탁드린 것이었어요."
1010506-21 = "……선생님."
1010506-22 = "괜찮으시다면……. 받아 주시겠어요?"
1010506-23 = "지금의 이 순간이 있기까지, 이번 일……. 그리고 그 전의 모든 일들."
1010506-24 = "어느 하나 선생님의 도움 없이는 불가능했을 수많은 순간들이었다고 생각합니다."
1010506-25 = "하지만 아시다시피 저는 성당에 속한 일개의 시스터."
1010506-26 = "기도를 드리는 것 정도밖에는……. 해 드릴 수 있는 게 없지요."
1010506-27 = "……없었지요, 정확히는."
1010506-28 = "물론 지금의 이 모습도 한시적인 것이라는 것도, 저는 너무나 잘 알고 있답니다."
1010506-29 = "그리고 그렇기 때문에, 이렇게 무리해서라도 선생님께 자리를 만들고자 부탁드린 거예요."
1010506-30 = "만일 아이돌로서 사람들 앞에 노래를 하고 공연을 하는 것이 그들을 위하는 무언가의 행위가 될 수 있다고 한다면."
1010506-31 = "그리고 선생님께서도……. 그것과 마찬가지라고 하신다면."
1010506-32 = "이 모든 것이 끝나기 전까지는, 저도 선생님께 해드릴 수 있는 게 기도 이외에 있는 것일 테니까요."
1010506-33 = "[s3] \"그래서 이런 자리를…….\"\n[s4] \"말하자면 게릴라 콘서트구나.\""
1010506-36 = "……후후."
1010506-37 = "역시 바로 이해해 주시는군요. 감사합니다, 덕분에 어설픈 변명의 시간이 줄었어요."
1010506-38 = "사실 선생님께서는 어떻게 생각하실지 모르겠지만……."
1010506-39 = "나름대로 꽤……. 용기를 낸 거거든요, 지금 이 자리는."
1010506-40 = "그러니 선생님……. 스스로도 부끄러운 이런 이야기는 이제 그만 줄이고……."
1010506-41 = "제가 이 자리에서, 선생님만을 위한 공연을 할 수 있도록……. 허락해 주시겠어요?"
1010506-42 = "시스터가 아닌……."
1010506-46 = "……한 명의 아이돌로서."
1010506-48 = "(이후 아무도 없는 성당에서, 마리의 <공연>을 조용히 관람했다.)"
1010506-49 = "(마리는 자신 없다는 듯 말했지만, 혼자 볼 수 없을 정도로 훌륭한 노래의 공연이었다.)"
1010506-52 = "(그렇게 공연이 끝난 후, 마리를 방까지 데려다주기 위해 이동했다.)"
1010506-53 = "이, 이렇게까지 하려던 건 아니었는데……."
1010506-54 = "선생님. 저는 괜찮아요. 신경 쓰실 필요 없으니, 그만 돌아가서 쉬셔도……."
1010506-55 = "……네? 늦은 저녁이니 숙소 앞까지는 가야 마음이 놓이신다고요?"
1010506-56 = "그, 그런……. 어차피 성당 안인데……."
1010506-57 = "이래서야 오히려 또 선생님께 제가 도움받는 꼴이 돼 버리는데……."
1010506-58 = "그, 그야 선생님의 입장이시라면 이것도 당연한 거긴 하지만……."
1010506-59 = "……어라."
1010506-60 = "선생님의 입장……이군요……."
1010506-64 = "……후후."
1010506-65 = "[s5] \"……마리?\"\n[s6] \"웃었다……\""
1010506-68 = "아, 죄송해요. 저도 모르게 그만……."
1010506-69 = "하긴 선생님의 입장이시라면, 당연히 그러시겠네요. 어쨌거나 이렇게 될 일이었던 걸까요."
1010506-70 = "저는 또 생각이 짧아서, 아까 전의 그 상황만 생각했던 거라……."
1010506-71 = "……늘 일만 키우는 아이네요, 저는."
1010506-72 = "…………."
1010506-73 = "그래도……. 잘한 것 같아요."
1010506-74 = "용기를 내서, 이런 자리를 만들었던 것……. 고집을 부려서라도, 감사를 표하고 싶었던 것."
1010506-75 = "덕분에 많은 것을 얻어 가는 느낌이 들어요."
1010506-76 = "이제 내일부터는 다시 경건한 생활로 돌아갈 것이지만……."
1010506-77 = "그건 딱히 해야 한다는 의무감이나, 아쉬움이 남는 그런 느낌은 아니니까요."
1010506-78 = "저에게는……. 양쪽 다 즐거운 일이니까요."
1010506-79 = "[s7] \"훌륭한 마음가짐이야.\"\n[s8] \"응. 그거면 충분하다고 생각해.\""
1010506-82 = "후후후……."
1010506-83 = "다시 한번, 오늘까지 정말로 감사했습니다, 선생님."
1010506-84 = "그리고……."
1010506-85 = "……내일부터의 저도, 계속해서 잘 부탁드리겠습니다."
