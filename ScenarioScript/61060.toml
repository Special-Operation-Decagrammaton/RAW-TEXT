[translation]
61060-1 = "제6화;건너편의 의자"
61060-6 = "……곧 저녁이 되겠군."
61060-7 = "그렇겠네. 조금만 더 서두르자."
61060-11 = "……."
61060-12 = "왜 그래, 히요리?"
61060-13 = "저, 정말로 아리우스로 돌아가는 거구나…… 하는 실감이 들어서요. 헤. 헤헤……."
61060-14 = "……일이 그렇게 된 거니까."
61060-15 = "이제 닥쳐오는 일들에, 너무 의미를 부여하지 않기로 했어."
61060-16 = "그런가. 좋은 마음가짐이다. 미사키. 성장했구나."
61060-21 = "시끄러워, 리더. 언제나 먼저 멋대로 사라지는 주제에."
61060-22 = "윽……."
61060-23 = "그래도 다시 사오리가 리더를 맡아 줘서, 기쁜 것도 있지?"
61060-24 = "어디까지나 이번 일 한정으로, 임시이지만."
61060-25 = "그건……!"
61060-26 = "……됐어. 다 귀찮으니까 그런 걸로 해. 어차피 내가 무슨 말을 해도, 공주는 그렇게 생각할 거고."
61060-27 = "여전히 솔직하지 못하네, 미사키."
61060-28 = "그러니까 아니라고!"
61060-30 = "[ns] \"선생님은 우리 학생들이 사이가 좋아서 좋단다…….\""
61060-31 = "진짜 안 참는 수가 있어, 선생님……."
61060-32 = "후훗. 그래도 나는 선생님이 같이 있어 줘서 기뻐."
61060-34 = "이, 일종의 호위…… 같은 것이기는, 하지만요. 에헤헤……."
61060-36 = "그렇기에, 감히 선생님께 부탁드리고자 합니다."
61060-37 = "선생님. 간접적인 방식이나 원격 같은 것이라도 좋으니……."
61060-38 = "아리우스 학생들에게, 과외 수업을 해 주실 수 있으실까요?"
61060-39 = "물론 이것은 어디까지나 저의 개인적이고 이기적인 부탁이고, 선생님의 안전이 그 무엇보다 중요한 데다."
61060-40 = "어떤 의미에서는, 이 부탁 자체가…… 제가, 아리우스 학생분들을 일방적으로 무시하는 처사가 될 수도 있겠습니다만."
61060-41 = "네?! 선생님께서 직접, 아리우스 분교 부지로 향하시겠다고요……!?"
61060-43 = "……."
61060-44 = "나는 우리가, 아리우스에 남아 있는 학생들과 일종의 협상을 하고……."
61060-45 = "선생의 원격 과외 준비를 보조하는 임무를 맡게 될 것이라고 생각했다."
61060-46 = "선생이 직접 가겠다고 해서, 이렇게 호위 임무로 변경된 것이지만……."
61060-47 = "[ns] \"미안. 혹시 부담돼?\""
61060-48 = "아, 아니다! 그럴 리가!"
61060-49 = "오히려, 한 때 아리우스 분교에 있었던 학생으로서, 선생에게 과한 폐를 끼치는 것은 아닌지……."
61060-50 = "그리고 이렇게까지 우리들에게, 마음을 써 줘서 면목이 없다고 해야 할 것 같은 기분이다만……."
61060-51 = "말이 나온 김에, 확인 좀 할게."
61060-52 = "왜 아리우스 분교라는 위험한 곳으로, 직접 가려는 거야. 선생님?"
61060-56 = "[ns1] \"후. 후. 후. 당연한 거니까, 간만에 폼 좀 잡아 볼까…….\"\n[ns2] \"거기에도, 내 학생들이 있으니까!\""
61060-60 = "[ns] \"크으……! 지금 대사 좀 괜찮지 않았어?\""
61060-61 = "아, 아우……."
61060-62 = "……적어도, 한 가지는 확실히 알았어……."
61060-63 = "어른은, 가끔 추하구나……."
61060-65 = "[ns] \"그럴 수가…….\""
61060-66 = "응. 확실히 조금 듣는 쪽에서도 부끄럽기는 했지만."
61060-67 = "그래야 우리가 믿는 선생님이라는 생각도 들었어."
61060-68 = "따듯한 위로가 오히려 마음을 아프게 한다고?"
61060-69 = "응. 그것도 어느 정도 짐작하고 한 말이기는 해."
61060-75 = "아, 아츠코?!"
61060-76 = "서, 선생님이 가슴을 붙잡고 쓰러지는 것처럼 몸을 웅크렸는데요……?"
61060-77 = "엄살 부리지 말고 일어나, 선생님. 갈 길이 아직 멀다고."
61060-79 = "–그러면 모두 박수!"
61060-80 = "별 탈 없이 아리우스로 돌아온, 우리 친구를 축하하는 의미에서 말이죠!"
61060-86 = "아, 하하……. 그런 것 치고는 완전히 엉망이지만요……."
61060-87 = "뭐, 어떤가요. 적어도 헤일로는 무사하잖아요?"
61060-88 = "가장 비싼 것을 지켰으니, 나머지는 언제든 다시 찾으면 되는 거니까요."
61060-93 = "잘 돌아왔어요. 그리고 무사해 줘서 고마워요. 마이아."
61060-94 = "우리에게 남은 시간은…… 아직, 많으니까요."
61060-95 = "네, 네…… 선배!"
61060-96 = "막상 환영회라고 해서, 뭐 해 줄 수 있는 것은 별로 없지만요. 그 부분은 미안해요."
61060-97 = "처, 천만에요! 저는 어쩌면…… 이 분위기가, 그리웠던 것인지도 몰라요……."
61060-98 = "그러고 보니, '바깥'은 어땠나요? 한번 감상을 직접 듣고 싶은데."
61060-99 = "바깥, 이요? 네. 우선……."
61060-100 = "……신기했어요."
61060-101 = "멋있기도, 했고요."
61060-106 = "……."
61060-108 = "많은, 풍경들을 봤어요. 유리로 만들어진 고층 건물이라든가."
61060-109 = "커다란 강. 그 강을 가로지르는 다리."
61060-112 = "밤이 되면, 빌딩들과 거리는 전등의 불빛으로 밝아지고."
61060-113 = "다리가 물 위에 어른거리면서, 꿈같은 분위기를 만들어내죠."
61060-115 = "오로지 음악만을 연주하기 위해 만들어진 건물도 있었어요."
61060-116 = "여기에서는, 음악 같은 건…… '마담'이 자리를 비웠을 때나, 간신히 숨어서 몰래 연주할 수 있는 것이었는데 말이죠."
61060-119 = "……심지어 그 건물은, 낮보다는 밤에 더 많이 공연을 하곤 했는데."
61060-120 = "그래서 오히려, 주위가 어두워졌을 때, 조명 불빛으로 주위를 장식하는 걸 전제 조건으로 해서, 설계되었다고 해요."
61060-121 = "……네. 세상 어딘가에는, 특별히 생존이나 이득에 도움이 되지 않는데도."
61060-122 = "그저 '예쁘다'는 것만으로, 거기에 시간과 노력을 쏟을 수 있는 사람들이 있더라고요."
61060-124 = "시장에는 본 적도 없었던 음식들이, 좌판을 가득 채우고 있었고."
61060-125 = "그저 그 모습을 보고, 냄새를 맡는 것만으로 행복해지는 기분이었어요."
61060-126 = "……네. 보고, 냄새를 맡는 것 말고는 할 수 있는 게 없었지만요."
61060-128 = "워터 파크라는 곳, 아세요? 당장 마셔도 아무렇지도 않을 만큼 깨끗한 물을, 물놀이를 하기 위해서 가득 채워 둔 곳인데……."
61060-130 = "그것도 모자라서 실내와 실외를 구분해서, 완전히 다른 세상인 것처럼 꾸며 놓았더라고요."
61060-131 = "그리고 그 밖에도……."
61060-145 = "……."
61060-146 = "……."
61060-147 = "하지만 그 어디에도, 제가 있을 곳은 없었던 것 같아요."
61060-148 = "네……. 이해해요."
61060-149 = "조명은 화려하고, 모두 행복해 보였어요."
61060-150 = "그게 너무 자기들끼리 행복해 보여서."
61060-151 = "그래서."
61060-156 = "제가 그 구석 자리 어디쯤에서 쓰러져 의식을 잃어도."
61060-157 = "아무도, 신경 쓰지 않을 거라는 걸 알았어요."
61060-161 = "세상의 누군가는, 행복하겠죠."
61060-162 = "그리고 또 다른 누군가는, 아마도 만족할 거고요."
61060-163 = "그리고 그 말은 달리 이야기해서."
61060-167 = "누군가는, 그럴 수 없을 것이란 뜻도 될 겁니다."
61060-168 = "모든 것을 할 수 있다는 말은……."
61060-169 = "달리 말해, 아무것도 할 수 없다는 말이기도 했던 것 같아요."
61060-170 = "어떻게 살아가야 하는지, 아무도 확실하게 이야기해 주지 않았으니까요."
61060-171 = "'삶에 정답은 없으니, 네가 선택하는 대로 살아가라'."
61060-172 = "어떻게 보면, 참, 무책임하고 듣기 좋기만 한 격려이지 않아요?"
61060-178 = "고생 많았어요. 잘 돌아왔어요."
61060-179 = "선배……."
61060-180 = "알죠. 알고 말고요."
61060-181 = "그렇게 나갔다가 돌아온 아이들이, 여기에는 너무나 많았으니까요."
61060-182 = "……트리니티로 향한 끝에, 소식이 끊긴 아이들도 없지는 않았지만요."
61060-183 = "……."
61060-184 = "트리니티……."
61060-185 = "왜요. 가고 싶나요?"
61060-192 = "아, 아아아아, 아니에요! 제가 무슨!"
61060-193 = "괜찮아요. 말리지는 않겠어요. 하지만 저는…… 그럴 수 없을 것 같네요."
61060-194 = "저는 아직, 트리니티를 좀처럼 용서할 수 없으니까요."
61060-195 = "그, 그렇죠! 그건 분명 그럴 거예요!"
61060-196 = "저도…… 선배와, 마찬가지고요……!"
61060-197 = "고마워요. 힘이 나네요."
61060-204 = "그리고."
61060-205 = "모든 것을 이끌 수 있었는데도, 그냥 없어져 버리기를 선택한 스쿼드와."
61060-209 = "'조마에 사오리', 역시도요."
61060-211 = "다음화;하모니카"
