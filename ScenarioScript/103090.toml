[translation]
103090-1 = "제9화;지상에서의 마지막 밤"
103090-2 = "<샬레> 임시 숙소"
103090-4 = "……그렇게 됐어, 노아."
103090-5 = "네. 저도 소식은 들었어요, 유우카 쨩."
103090-6 = "그동안 밀레니엄 자치구……"
103090-7 = "아니, 키보토스는 저희들이 지키고 있을 테니까요."
103090-8 = "응. 부탁할게."
103090-11 = "아뇨, 오히려 제가 부탁할게요. 유우카 쨩."
103090-18 = "부디 다치지 말고 몸 조심히 다녀오세요."
103090-23 = "……응. 알겠어."
103090-26 = "호시노 선배……."
103090-27 = "응, 맞아. 아야네 쨩. 우리도 <우트나피쉬팀>에 타고 선생이랑 같이 <방주>로 갈 거야."
103090-28 = "맞아! 아야네 쨩만 거기 혼자 보낼 수는 없다고!"
103090-29 = "그, 그치만……."
103090-31 = "어차피 그 방주에 가서도 전투를 해야 하잖아요?"
103090-32 = "그렇다면 싸울 수 있는 사람들이 많을수록 좋을 거구요."
103090-33 = "그리고 무엇보다……"
103090-34 = "그 방주에 시로코 쨩이 있는 거잖아요?"
103090-41 = "……."
103090-42 = "……네. 아마도 그럴 거예요."
103090-43 = "시로코 선배를 직접 만나고 싶어. 그건 여기 있는 모두 다 마찬가지라고."
103090-45 = "그 상태의 시로코 쨩이라면 반드시 우리를 방해하러 오겠지."
103090-46 = "시로코 쨩을 쓰러트리고 붙잡는 일이야. 우리가 해야만 해."
103090-47 = "이미 선생한테도 말해 두었으니까."
103090-48 = "하지만…… 이 작전은 성공 확률이 낮아요. 저희가 실패했을 때를 대비하지 않으면……."
103090-52 = "그딴 불길한 소리는 집어치워!"
103090-53 = "어, 어라……?!"
103090-62 = "와아~☆ 흥신소 여러분!!"
103090-65 = "안녕~ 놀러 왔어."
103090-66 = "수, 수고 많으십니다……."
103090-67 = "하아. 여기도 분위기가 뒤숭숭하군."
103090-68 = "아직 작전은 시작도 하지 않았는데 벌써 실패했을 때부터 걱정하는 거야?"
103090-70 = "네? 그, 그건……."
103090-73 = "이럴 땐 말야!"
103090-78 = "돌아오면 다 함께 라멘을 먹으러 가자, 고 말해야지!"
103090-85 = "그, 그렇군요! 그게 바로 하드보일드!! 역시 아루 님이세요!!"
103090-86 = "……오히려 더 불길한 플래그 대사 같은데."
103090-87 = "쿠후후…… 그치만 아루 쨩. 카요코 쨩이 혼자서 간다는 얘기를 들었을 땐 막 울먹이면서……."
103090-89 = "뭐?! 내, 내가 언제?!"
103090-90 = "쿠후후후…… 다치지 말아야 한다느니, 조심 또 조심해야 한다면서……."
103090-91 = "그, 그런 적 없거든?!"
103090-93 = "……뭐, 걱정되는 건 많겠지만, 괜찮을 거야."
103090-94 = "각 학원의 학생들이 다 같이 협력해서 준비한 계획이니까. 그리고 무엇보다 [USERNAME] 선생이 함께 가잖아."
103090-95 = "선생과 함께 있으면…… 무슨 일이든 어쩐지 잘될 것 같은 기분이 들거든. 그러니까 괜찮을 거야."
103090-96 = "……네."
103090-98 = "맞아."
103090-99 = "지금까지의 선생이 있었기에 가능했던 것들을 생각해 보면 말야……."
103090-100 = "……."
103090-101 = "……."
103090-121 = "……네. 맞아요. 마치 뭐랄까…… 상상도 못 할 일들이 벌어지곤 했으니까요."
103090-122 = "으헤~ 그렇지? 그러니까, 이번에도 그럴 거라고 믿는 거야."
103090-127 = "……네!"
103090-128 = "가서 시로코 쨩을 구해 오자."
103090-129 = "응응! 시로코 쨩 포획 작전이에요!"
103090-131 = "그러니까 야생동물이냐고……."
103090-133 = "사막 발굴지의 임시 숙소"
103090-136 = "우주 전함이 발견되었다고 하길래 구경 오긴 했지만……."
103090-137 = "그렇지. 우리가 생각하는 거랑은 좀 다른 느낌이었지."
103090-139 = "응…… 우주로 나가지도 못하고, 무장 같은 것도 실려있지 않다고 해. 이건 우주전함이 아니라 다른 무언가인가 봐."
103090-141 = "선생님은 이걸 타고 내일 성층권에 있는 본거지를 공략하러 간다고 하고……."
103090-142 = "언니…… 우리는 이제 어쩌지?"
103090-143 = "으응. 유우카 말대로 밀레니엄으로 돌아가야 하나…… 여기 있다가 괜히 모두에게 방해만 되는 게 아닐까……"
103090-149 = "아리스는 선생님과 함께 가고 싶습니다."
103090-151 = "아리스 쨩?"
103090-152 = "어, 어째서……?"
103090-153 = "맞아. 우주 용사 데뷔는 물 건너갔잖아."
103090-154 = "네. 물론 그건 아쉽지만……"
103090-155 = "그것보다는 이 전함을 지킬 수 있는 사람이 아리스뿐이기 때문입니다."
103090-157 = "어……?"
103090-158 = "응…… 전함에는 무기가 없으니까…… 그러니까……."
103090-159 = "<빛의 검> 때문에? 그래서 아리스 쨩이 가고 싶은 거야?"
103090-161 = "네. 저의 <빛의 검>은 원래 엔지니어부 여러분들이 우주전함용으로 계획하고 제작한 무기."
103090-162 = "현재 키보토스에서 이걸 다룰 수 있는 사람은 아리스 말곤 없습니다."
103090-165 = "……."
103090-167 = "엔지니어부 분들은 반쯤은 장난으로 만든 거라, 이 정도 출력으로는 전함급 전투에 도움이 되진 않을 거라고 했지만……."
103090-168 = "그래도 지금 저 전함을 지킬 수 있는 유일한 방법이 저라면……"
103090-169 = "아리스가 선생님에게 조금이라도 도움이 될 수 있다면…… 돕고 싶습니다."
103090-171 = "그, 그치만…… 그래도……."
103090-172 = "응. 아리스의 기분도 알 것 같아. 선생님에겐 진짜 많은 도움을 받았으니까."
103090-181 = "……그럼 우리 모두 다 같이 갈까?"
103090-183 = "응? 뭐라고?"
103090-184 = "유즈 쨩……?"
103090-186 = "그동안 생각해 보면 아리스 쨩에게 위험한 일들이 많이 벌어졌었잖아."
103090-187 = "그중에는 우리가 잘 이해하지 못하는 일들도 많았고……, 우리가 해결할 수 없는 일들도 많았어……."
103090-188 = "그, 그랬지……."
103090-189 = "사실 나는…… 아직도 학생회장이 아리스 쨩을 왜 노리는지, 무슨 일이 숨겨져 있는지 잘 몰라……."
103090-190 = "그, 그건 우리도 그래……."
103090-191 = "그치만 그런 건 중요한 게 아니잖아!"
103090-192 = "마, 맞아. 그런 건……."
103090-194 = "……."
103090-196 = "나는…… 우리가 더 이상 소외당하는 건 싫어."
103090-197 = "상황을 이해하지 못해도, 다 함께 있으면, 괘, 괜찮을 거라고 생각해……."
103090-198 = "이번에도 이해할 수 없는 일들이 잔뜩 벌어졌지만…… 그래도 모두와, 선생님과 함께 있었으니까 별로 불안하지 않았어……."
103090-199 = "새로운 사람들도 만날 수 있었고…… RABBIT 소대분들이나, 선도부장 같은 분들도……. 무, 무서웠지만…… 그래도……."
103090-204 = "캐비닛 안에 숨어있는 것보다는…… 나았다고 생각해."
103090-205 = "그러니까…… 나는 아리스 쨩과 함께 가고 싶어."
103090-206 = "아리스 쨩이 있었으니까 우리 게임개발부가 존속할 수 있었잖아?"
103090-207 = "그러니까 아리스 쨩이 하고 싶은 게 있다면…… 당연히 우리가 도와줘야 해……."
103090-208 = "그, 그야 우리는…… 도, 동료니까……."
103090-213 = "……."
103090-215 = "그래, 맞는 말이야, 말 잘했어, 유즈! 우리도 함께 가야 해! 그게 맞아!"
103090-216 = "응……!! 아리스 쨩, 우주 용사는 아니어도, 전함의 메인 딜러가 되는 거야!"
103090-218 = "……네! 모두와 함께 간다면 기쁠 것 같습니다! 아리스도 더 이상 두렵지 않을 것 같습니다!"
103090-220 = "아리스 쨩도…… 두려운 거야?"
103090-221 = "네. 그렇습니다."
103090-226 = "……제 안에는 아직도 <케이>라는 존재가 남아 있는 것 같습니다."
103090-232 = "뭐? 케, 케이가? 진짜야? 그 녀석은 빛의 검으로 날려버렸잖아!"
103090-233 = "케, 케이…… 이름은 그걸로 괜찮은 걸까……."
103090-235 = "사실 아리스도 케이의 정체가 뭔지, 아리스에게 무엇을 원하는지 잘 알지 못합니다."
103090-236 = "……[ruby=.]저[/ruby]는 [ruby=.]저[/ruby]의 정체도 알지 못합니다."
103090-237 = "케이는 제가 <이름 없는 신들>이 남긴 왕녀라고 했고, 리오 회장님은 제가 세상을 멸망시킬 병기라고 했습니다."
103090-238 = "왕녀도, 케이도, 방주도, 이름 없는 신들도…… 저는 저와 관계된 그 어떠한 것들도 알지 못하지만……."
103090-239 = "하지만 모모이, 미도리, 유즈가 있었기에, 그리고 선생님이 있었기에……"
103090-240 = "저는 그런 것들을 알지 못해도, [ruby=.]아[/ruby][ruby=.]리[/ruby][ruby=.]스[/ruby]가 될 수 있다고 생각합니다."
103090-244 = "[ns] \"하면 돼!\""
103090-246 = "[ns] \"네가 되고 싶은 존재는 네가 결정해도 돼. 아리스.\""
103090-248 = "……."
103090-249 = "아리스는 다 함께, 동료들과 함께…… 선생님을 도우러 가고 싶습니다."
103090-250 = "아리스가 용사이고 싶고, 게임개발부이고 싶기 때문에."
103090-251 = "다른 누군가가 아닌, 아리스가 아리스를 결정하고 싶기 때문입니다."
103090-252 = "아리스 쨩……."
103090-254 = "응, 아리스 쨩…… 우리 내일 다 함께 출발하자. 절대 헤어지지 않는 거야."
103090-255 = "아, 아리스!! 지금 뭔가 굉장했어! 진짜 용사 같은 느낌이었다고!"
103090-257 = "네! 당연합니다! 아리스는 용사니까요!"
103090-258 = "그리고 지금은 안됐지만 언젠가는 우주 용사도 될 예정입니다! 그건 먹히는 장르니까요!!"
103090-260 = "포기하지 않았구나, 그 컨셉……."
103090-262 = "유행을 탈 것 같은 소재라 빨리 구현하지 않으면 안 될 것 같은데……."
103090-264 = "아냐!"
103090-265 = "이런 건 생각보다 오래 간다구!"
103090-267 = "공룡 토네이도 같은 거! 두고두고 회자되는 명작으로!"
103090-272 = "망작…… 아냐?"
103090-277 = "우, 우주 용사가……"
103090-278 = "공룡 토네이도급인가요……."
103090-280 = "아, 앗!? 아리스 쨩이 시무룩해졌어?!"
103090-286 = "으응…… 그렇게 되었어요."
103090-287 = "하나코 쨩……."
103090-288 = "그렇군. 힘든 임무가 되겠네."
103090-290 = "괘, 괜찮은 건 맞지?"
103090-291 = "아니, 뭐…… 선생님도 함께 가는 거니까……"
103090-292 = "네. 그러니까 괜찮을 거라고 생각해요. 어떻게든 되지 않을까…… 후후♡"
103090-293 = "네. 선생님이 함께 계시니까 분명……."
103090-294 = "……그런 생각을 해 본 적이 있었어요."
103090-298 = "그때, 선생님이 보충수업부의 담임으로 오시지 않았다면……"
103090-299 = "우리는 어떻게 되었을까……."
103090-307 = "그, 그건…… 그랬다면…… 분명……."
103090-308 = "그리고 거꾸로, 선생님이 계셨기 때문에 해낼 수 있었던 일들도……."
103090-327 = "……."
103090-328 = "……."
103090-329 = "하나코 쨩……."
103090-330 = "조심해서 다녀와, 하나코. 그동안 우리들은 학원을 지키고 있을게."
103090-331 = "맞아! 우리가 키보토스를 지키는 동안 잽싸게 돌아오는 거야!"
103090-333 = "후후, 네. 얼른 다녀올게요."
103090-335 = "몸 조심해. 아코."
103090-336 = "부장님……."
103090-337 = "아니, 이쪽에는 내가 있는 게 맞아. 만에 하나라도 긴급한 상황이 생겼을 때 그걸 가장 효율적으로 해결할 수 있는 건 나니까."
103090-338 = "……네. 그럼, 다녀와서 보고드릴게요."
103090-339 = "아아. 기다리고 있을게."
103090-341 = "……."
103090-343 = "……."
103090-345 = "걱정되시나요, 세이아 씨?"
103090-346 = "아, 아뇨. 그런……."
103090-348 = "그러는 나기 쨩도 지금 홍차 몇 잔 째야? 그렇게 마셔대면 잠을 며칠은 못 잘 것 같은데?"
103090-350 = "아뇨. 이, 이건……. 그러니까……."
103090-351 = "……. 네. 저에게 예지몽이 남아 있었으면 좋았겠다고 생각했습니다."
103090-352 = "세이아 씨……."
103090-354 = "흐응……. 세이아 쨩도 걱정되는 건 마찬가지구나."
103090-355 = "실은 나도 그래."
103090-356 = "그치만, 이런 이야기는 해피엔딩으로 끝나는 게 보통이잖아? 그런 감각을 믿는 거야. 응, 그런 느낌으로!"
103090-357 = "……. 그렇죠. 저희가 이렇게 한 자리에 모일 수 있는 것도…… 선생님이 계시지 않았다면 불가능한 일이었겠죠."
103090-358 = "그러니 미카의 말대로 그런 느낌을 믿도록 하겠습니다."
103090-359 = "맞아. 선생님이 없었다면……."
103090-363 = "으음, 아냐. 그런 생각은 지금 별로 하고 싶진 않고."
103090-368 = "선생님, 그리고 모두들. 부디……."
103090-369 = "……. 네. 부디, 조심히 다녀오시길."
103090-370 = "그동안 지상의 안전은 우리가 맡고 있을 테니까☆"
103090-372 = "우, 우리는 이제 어떡해?"
103090-373 = "달라지는 건 없습니다. SRT로서 저희는 선생님이 작전을 수행하는 동안 D.U.를……"
103090-374 = "아니, 키보토스의 안전을 지켜야 합니다."
103090-375 = "선생님이 자리를 비우는 동안 키보토스의 치안을 유지한다, 그것이 바로 저희의 임무이니까요."
103090-376 = "그래. 카이저 녀석들도 지금은 물러났지만 언제 다시 혼란을 틈타 모습을 드러낼지도 모르고."
103090-377 = "맞아. 게다가 마비된 총학생회도 어떻게든 지금 상황을 정리하려고 간부들이 동분서주하고 있는 것 같고 말야."
103090-378 = "……뭐, 그 녀석들의 속도를 보면 이미 선생님이 지상으로 돌아온 뒤에나 시작하지 않을까?"
103090-380 = "으응……. 선생님…… 무사해야 할 텐데."
103090-381 = "너무 걱정하지 마, 미유. 선생님이라면 얼마 안 있다가 뻔뻔한 얼굴로 돌아와서는 또 먹을 걸 가지고 우리를 놀려댈 거니까!"
103090-383 = "……네. 어쩐지 그런 느낌이 있죠. 선생님은."
103090-384 = "흐흐흐, 맞아. 확실히 그런 쪽으로는 그렇지."
103090-389 = "이쪽엔 더 이상 적들의 흔적을 찾을 수 없었어."
103090-394 = "……."
103090-395 = "삿 쨩? 무슨 생각해?"
103090-396 = "……아아. 아무것도 아니야."
103090-398 = "우리가 트리니티와 함께 싸우다니, 신기하다고 생각했겠지?"
103090-399 = "그러게요……. 생각해 보면 예전에는 상상도 할 수 없었던 일들이 마구마구 벌어지고 있는 느낌이에요……."
103090-400 = "인생이 고통이라는 건 변하지 않았지만…… 뭐랄까…… 뭔가……."
103090-401 = "내일을 기대하게 되지?"
103090-402 = "네, 네에…… 그걸 뭐라고 불러야 할지 자, 잘은 모르겠지만……"
103090-403 = "……."
103090-405 = "……아니, 감상은 모든 일이 끝난 뒤에 해도 늦지 않아."
103090-406 = "아직 그 거짓된 성소의 위협은 끝난 게 아닌 것 같으니까."
103090-409 = "네, 네……! 그렇겠죠?"
103090-410 = "역시 인생은 고통스러운 거니까요. 헤헤……."
103090-411 = "뭐, 주인공들이 활약할 수 있게 우리 같은 악당들은 어둠 속에서 고생해야 하는 법이니까."
103090-416 = "……."
103090-417 = "그래도 이렇게 다 함께 있을 수 있어서 기뻐."
103090-419 = "고, 공주님……."
103090-420 = "……."
103090-426 = "그리고 언젠가는……. 응."
103090-427 = "……그래."
103090-441 = "저기…… 린 선배. 계세요?"
103090-442 = "……아아. 네. 들어오세요. 아유무."
103090-452 = "쉬고 계신데 죄송해요……"
103090-453 = "그치만 확인해 보셔야 할 게 있어서……."
103090-460 = "총학생회의 비상통신망이에요…… 아까부터 알람이 계속 울리고 있는데, 린 선배를 찾고 있는 것 같아요."
103090-461 = "……. 통신망 긴급복구에 성공했나 보네요."
103090-465 = "이 코드라면……."
103090-466 = "네…… 재무실장님인 것 같아요. 저기, 통신망을 끊을까 하다가 혹시 몰라서……."
103090-467 = "아뇨. 제가 받을게요."
103090-468 = "아, 네. 그, 그럼……. 저는 돌아가 볼 테니……."
103090-469 = "네. 고맙습니다. 아유무."
103090-479 = "(지직-) 수석행정관……!!"
103090-480 = "어디야? 무사해? (지직-) 다치진 않았어?!"
103090-481 = "재무실장. 무사했군요."
103090-482 = "……잘 들리지 않아. 이것도 통신망을 임시로 복구한 거……"
103090-483 = "(지직) 어디야? 어디에 있어? 지금 생텀 타워가 부서졌는……."
103090-484 = "지금 흩어진 다른 실장들을 모으고 있…… (지직-) 카이저 코퍼……"
103090-485 = "수석행정관……"
103090-486 = "……. 아오이."
103090-487 = "……미안해, 린 선배. 나는…… 일이 이렇게 될 줄……."
103090-488 = "……아뇨, 당신을 탓하지는 않아요. 당신은 당신의 일을 했을 뿐입니다."
103090-489 = "그리고 저는 저의 일을 할 거고요."
103090-490 = "……지금 뭘 하고 있는…… (지직) 어디……. <샬레>와 함께 있는 거야……?"
103090-494 = "아오이."
103090-498 = "……만약 저에게 무슨 일이 생긴다면…… 총학생회를, 키보토스를 부탁드립니다."
103090-499 = "……!? (치익-) 지금 뭐라고……."
103090-500 = "……몸조심하세요. 아오이."
103090-508 = "(그렇게 지상에서의 마지막 밤이 지나갔다…….)"
103090-514 = "선생님. 출발 준비는 모두 끝났습니다."
103090-515 = "브릿지에서 모두 선생님을 기다리고 있습니다."
