[translation]
10013010-1 = "제1화;해야 할 일은 하나!"
10013010-6 = "모두 스톱! 정지예요!"
10013010-7 = "어라…… 아야네 쨩?"
10013010-8 = "아야네 쨩?! 왜 여기에?! 분명 선생님을 데려다준다고……!"
10013010-9 = "악당들에게 억류된 상태인 게 분명해."
10013010-10 = "어머, 그건 큰일이네요~"
10013010-12 = "아니에요! 그런 게 아니라!"
10013010-14 = "……선생님, 혹시 아는…… 사람들이신가요?"
10013010-15 = "[s] \"아, 아마도?\""
10013010-16 = "주군……! 괴, 굉장해요! 저런 수상한 분들과도 친분을 다지기를 주저하지 않는 배포!"
10013010-17 = "뭐, 뭐야?! 수상하다니 실례네!"
10013010-18 = "[s] \"저기, 일단 상황을 정리할까?\""
10013010-20 = "(그렇게 잠시 서로를 소개하는 시간을 가지게 되었다.)"
10013010-22 = "즉…… 복면을 쓰고 있던 분들은 아비도스 고등학교의 학생……?"
10013010-23 = "혹시 축제 용품의 일환인가요?! 아비도스에서만 통용되는 독특한 문화! 라던가!"
10013010-24 = "이야~ 게헨나 등지에는 가면을 쓰고 참가하는 축제가 있다는 모양인데 여기선 복면이라니, 이 유니크함. 참을 수가 없네요! 그쵸! 사장님?!"
10013010-26 = "아하하, 따, 딱히 그런 건……."
10013010-28 = "그러니까 몇 번이나 말하지만 사장님이 아니라 부장!"
10013010-29 = "그보다 왜 그런 아비도스가 우릴 습격하는 건데? 우리가 무슨 잘못을 했다고?"
10013010-30 = "뭐야? 오히려 이쪽에서 하고 싶은 말이라고!"
10013010-31 = "마츠리운영관리부라면, 이번 <리조트 사냥>을 일으킨 주범이잖아? 그런데 왜 선생님이야말로 그런 애들이랑-"
10013010-32 = "그러니까, 그건 오해라고 몇 번이나-!"
10013010-40 = "저기…… 여러분, 일단 진정하시고……."
10013010-41 = "우와, 우와아앗, 이, 이즈나는 어떡해야-"
10013010-48 = "아- 니야 부장으로부터 전화야 선생님."
10013010-52 = "냐하핫~ 헬로- 헬로- 여러분 모두 안녕하신가요~?"
10013010-53 = "제가 자리를 비운 사이 혹시나 불상사가 일어나지는 않을까. 그럼 곤란한데- 아니, 오히려 재미있으려나~ 하고 걱정했습니다만."
10013010-54 = "[s] \"후자는 걱정이 아니잖아…….\""
10013010-55 = "분위기로 보아하니 이미 한바탕하신 모양이네요~?"
10013010-56 = "흥. 니야. 무슨 일이야? 백귀야행에서 제일 잘나신 분께서. 정작 중요할 땐 코빼기도 보이지 않았으면서."
10013010-57 = "우후후~ 대화 전 가볍게 분위기를 돋우는 그 가시 돋친 태도, 마음에 드네요~"
10013010-58 = "잡담은 이쯤으로 해두고."
10013010-59 = "선생님이 그쪽으로 향한 사이에 이것저것 조사를 해본 결과."
10013010-60 = "카와와 시즈코 양. 당신이 현재 휘말린 일에 대해 대강의 윤곽을 알아냈답니다~♪"
10013010-67 = "내가, 휘말린 일의 윤곽……?"
10013010-68 = "시즈코 양. 최근 백야당이 커다란 사업에 손을 댄 정황을 확인했는데, 맞을까요?"
10013010-69 = "……윽, 그걸 어떻게……."
10013010-70 = "[s] \"커다란 사업을? 시즈코가?\""
10013010-71 = "얼마 전 마츠리운영관리부가 기존에 백귀야행의 각 동아리로부터 출자한 자금으로 조성한 펀드 기금을, 특정 기획 상품에 투자했다는 걸 알게 되었습니다."
10013010-72 = "[s] \"시즈코가, 투자를…….\""
10013010-73 = "다만 문제는, 시즈코 양. 당신이 구매한 물품이 <허위매물>이란 사실이에요."
10013010-75 = "……허위, 매물?"
10013010-76 = "자료에는 최근 마츠리운영관리부가 <로스트 파라다이스 리조트의 사용권>을 구매했다고 쓰여 있습니다만."
10013010-77 = "애당초 로스트 파라다이스 리조트는 약 20년 전에 망해버린 사업체의 이름이거든요."
10013010-78 = "뭐……?"
10013010-79 = "그런 정체불명의 사용권을 마츠리부 뿐만 아니라, 다른 사람들도 가지고 있는 상황……."
10013010-80 = "아비도스의 여러분도 그런 경우가 아니신지?"
10013010-81 = "마, 맞아! 우리도 1등 상품에 당첨되어서 이곳에……."
10013010-82 = "……진짜 선생님의 말대로, 우리뿐만 아니라 아비도스도 리조트 사용권을 가지고 있다구요……?"
10013010-83 = "아, 여기 보세요. 저희가 가진 계약서 여기에 마츠리운영관리부의 이름이……."
10013010-89 = "<로스트 파라다이스 리조트 투자 및 운영 총괄 : 백귀야행 연합학원 마츠리운영관리부>……?"
10013010-90 = "잠깐?! 왜 다른 사람이 가진 서류에 우리의 이름이! 이거 가짜-"
10013010-94 = "-라기엔, 어, 어라?! 여기에 우리 도장이?! 어, 어?!"
10013010-95 = "함정에 빠진 거예요. 시즈코 양."
10013010-96 = "당신이 구매한 사용권이, 다른 세력들에게도 뿌려졌고, 그 계약서의 독소조항으로 해석된 말장난 때문에-"
10013010-97 = "[s] \"<리조트 사냥>이라는 사건이 벌어지게 되었다……?\""
10013010-98 = "애당초 그 사용권이라는 건, 어디서 구매한 거였죠?"
10013010-99 = "그건……"
10013010-101 = "자, 여기에 도장을 꾹-하고 찍으면, 이걸로 됐지?"
10013010-102 = "하하하! 이것으로 마츠리운영관리부의 펀드 기금은 저희 <문어 은행>에서 주관하는 특별 상품에 투자되었습니다!"
10013010-103 = "올여름 시즌을 맞이해, 복합 리조트 시설 <로스트 파라다이스>에서 바다의 집을 운영한다! 좋은 계획이군요! 안전하고 좋은 투자이지요!"
10013010-104 = "곧 리조트 시설의 운영 관리자들도 모집할 예정이니, 그쪽도 잘 부탁드리겠습니다."
10013010-106 = "아니, 잠깐만. 그게 문제였다고? 뭐야? 확실하게 계약서는 다 읽었는데?!"
10013010-107 = "그 계약서가 애당초 말장난이었던 거예요."
10013010-108 = "제가 입수한 정보에 따르면, 애당초 문어 은행 측에게 정말로 그걸 팔 수 있는 권리가 있는지부터가 의문이라고 할지……."
10013010-109 = "마, 만약 정말로 허위매물이라면, 서류 자체가 불법이니까! 이대로 돌아가서 계약을 취소하면……!"
10013010-111 = "문어 은행이라고 그랬지? 그 은행."
10013010-112 = "……으, 으응? 맞아."
10013010-117 = "……흐음. 그런가. 그렇다면 그렇게 간단하게 진행되진 않을 거야."
10013010-118 = "[s] \"호시노? 무슨 의미야?\""
10013010-120 = "…………."
10013010-121 = "문어 은행이라는 이름은……."
10013010-122 = "…… <카이저 론>의 페이퍼 컴퍼니 이름 중 하나예요."
10013010-123 = "[s] \"카이저 론……?!\""
10013010-124 = "네, 지금 이야기해 주신 수법은 저희도 잘 알고 있거든요……. 틀림없이 카이저 론의 수법이에요."
10013010-125 = "응……. 아마, 여기서 벌어지고 있는 사건의 배후에는 카이저 코퍼레이션이 있을 거야."
10013010-126 = "그 악랄한 녀석들! 전혀 수법이 변하질 않았잖아! 우리도 거기에 몇 번이나 당했다구!"
10013010-128 = "응. 맞아요. 하지만 여기서 마주치게 될 줄은……."
10013010-129 = "흐음. 그런가. 여기서 그 녀석들이……."
10013010-130 = "아마도…… 처음부터 카이저 코퍼레이션은 마츠리부를 노렸던 것이겠지요."
10013010-131 = "마츠리부가 가지고 있는 백귀야행 학원의 축제 개최 권한은 무척이나 먹음직스러운 먹이일 테니까"
10013010-132 = "[s] \"아비도스 때처럼, 이번엔 백귀야행으로 마수를 뻗친 건가…….\""
10013010-133 = "당해버렸네요. 시즈코 양♪"
10013010-134 = "……읏……!"
10013010-135 = "하지만 이번 일은 좀 의외인걸요. 시즈코 양답지 않다고 할지-"
10013010-136 = "왜 덜컥 그런 수상한 물건에 투자한 건가요?"
10013010-137 = "단적으로 말해 혹시 돈이 필요하셨다던가?"
10013010-138 = "그건……."
10013010-140 = "아니에요! 사장님은-!"
10013010-141 = "………아니, 우미카 됐어. 니야의 말이 맞아."
10013010-142 = "[s] \"시즈코?\""
10013010-143 = "……인정하긴 싫지만, 이미 벌어진 일은 어쩔 수 없으니까."
10013010-144 = "돈이 필요해서 사업에 투자했고, 그래서 이런 꼴이 됐다. 그뿐인 이야기인 거야."
10013010-145 = "이러쿵저러쿵 구차하게 변명할 생각은 없어."
10013010-146 = "사장님……."
10013010-147 = "나 때문에 이런 일이 벌어진 셈이니까. 모두에겐 미안해."
10013010-148 = "아, 아니, 뭐…… 사과를 한다면야……."
10013010-149 = "응, 이미 지나간 일을 가지고 타박하는 건 좋지 않아. 세리카."
10013010-150 = "시로코 선배가 가장 먼저 뛰어왔으면서?!"
10013010-151 = "[s] \"문제는 앞으로 어떻게 할지겠네.\""
10013010-153 = "학원으로 돌아오세요. 카와와 시즈코 양."
10013010-154 = "……응?"
10013010-155 = "외부의 세력이 마츠리운영관리부를 노렸다는 건, 곧 저희 백귀야행 학원을 향한 공격을 감행한 것이나 다름없습니다."
10013010-156 = "그러니 여기서부터는 저희 음양부가 맡도록 하지요. 저쪽에서 더러운 방법을 쓴다면 이쪽도 마찬가지의 방법으로 응수하겠습니다."
10013010-157 = "때문에 후속 대응을 위해서라도 마츠리부는 지금 곧바로 귀환을……."
10013010-159 = "아니, 그럴 순 없어."
10013010-163 = "…………………네?"
10013010-164 = "……무슨 소리인가요?"
10013010-165 = "이곳을 떠난다면 당장엔 <리조트 사냥> 같은 문제에서 멀어질 수 있을지도 몰라."
10013010-166 = "네, 그러니 당연히 돌아와서 상황을 정리하고 다음을 대비해야……."
10013010-167 = "하지만 그래선 아무것도 해결되지 않아."
10013010-168 = "……네?"
10013010-169 = "물론 니야의 말도 충분히 이해해."
10013010-170 = "하지만 계약서에 백야당의 이름이 남아있는 한, 내버려 두면 계속해서 백귀야행의 이름이, 그 브랜드 가치가 떨어지겠지-"
10013010-171 = "[s] \"그건 심각한 일인 거지?\""
10013010-172 = "물론이죠! 선생님! 이건 학교는 물론, 백귀야행의 관광업계가 가진 신뢰도와도 직결된 문제니까요!"
10013010-173 = "그러니 돌아가지 않아. 이곳에 남아, 내가 직접 해결하겠어."
10013010-174 = "……이름? 브랜드 가치 때문에 돌아갈 수 없다? 그래서 고집을 피우시겠다, 인가요?"
10013010-175 = "고, 고집을 피운다니 실례네!"
10013010-176 = "……이해가 되지 않아요. 왜 그렇게 어렵사리 돌아가는 길을……."
10013010-178 = "그야- 내가 그러고 싶으니까."
10013010-182 = "게다가, 뭐 여기 남는 이유가 꼭 브랜드 가치 때문만은 아니라고 할까……. 다른 이유도 있다고 할까."
10013010-183 = "하, 하여간 그런 줄로 알아!"
10013010-184 = "아, 물론 이번 건은 어디까지나 내 실수니까."
10013010-185 = "수습한다고 하더라도 나 혼자서 할 거니까. 다른 사람들은 걱정할 필요-"
10013010-186 = "[s] \"그럼 우리도 도와줄게.\""
10013010-187 = "……네? 아, 아뇨. 굳이 선생님의 손을 빌릴 것까지는……."
10013010-188 = "무슨 소리인가요? 시즈코 쨩. 우리 모두 이걸 돕기 위해 온 거랍니다."
10013010-189 = "응~ 맞아~ 니야 부장은 쩨쩨하니까 대신 도와줄게."
10013010-191 = "치세까지……."
10013010-193 = "여러분……!"
10013010-194 = "이즈나도 도울게요! 주군도 함께라면! 그야말로 천군만마예요!"
10013010-196 = "……어디 한 번 들어나 보죠. 생각해둔 방법은 있는 건가요?"
10013010-197 = "아비도스 학생들의 말에 따르면, 문어 은행에 직접 따져선 해결할 수 없을 거야."
10013010-198 = "그렇다고 가만히 있어봤자 <리조트 사냥>의 습격이 계속될 뿐이니까."
10013010-199 = "그럼 여기선 반대로 움직이는 거지."
10013010-200 = "반대라는 말씀은……."
10013010-201 = "간단해. 우리가 직접 <리조트 사냥>에 뛰어드는 거야!"
10013010-202 = "오- 과감해라-"
10013010-203 = "[s] \"그래도 괜찮아?!\""
10013010-204 = "물론 그냥 빼앗자는 건 아니에요!"
10013010-205 = "<리조트 사용권>의 최종 권리자가 저희 이름으로 되어있다는 건, 어쨌거나 다른 계약서들은 저희의 권리를 일부 양도받는 형태로 계약이 되어있단 뜻이에요."
10013010-206 = "아마…… 그때 은행 직원이 이야기했던 <리조트 시설의 운영 관리자>라는 형태로 되어있는 거겠죠."
10013010-208 = "어머나…. 정말 계약서상으로는 그런 느낌으로 되어있네요~"
10013010-209 = "시설의 운영 관리자라니, 원래는 그 폐허를 관리하는 역할이었다고……?"
10013010-211 = "네, 그럴 거예요……. 현재 이곳 군도를 찾아온 문제아들은 전부 문어 은행에서 독단으로 계약을 맺어 데리고 온,"
10013010-212 = "사실상의 불법 점거자들!"
10013010-213 = "하지만 정식으로 운영 관리자로서 계약한 건 저희 백야당인 만큼, 저희에겐 불법 점거자들을 내쫓을 권리가 있을 터!"
