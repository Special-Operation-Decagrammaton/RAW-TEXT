[translation]
1013408-1 = "돌아온 용사님?"
1013408-2 = "(……강철대륙에서의 결전을 끝마치고, 일상으로 돌아와서 얼마나 시간이 흘렀을까.)"
1013408-3 = "(평소와는 사뭇 다른 느낌의 모모톡을 보낸 아리스를 찾아, 아리스가 보내준 주소로 향했다.)"
1013408-6 = "(발 디딜 틈도 없이 엄청난 인파다.)"
1013408-7 = "(바깥에서 안 사실이지만, 아주 유명한 게임 페스티벌이 열리고 있다고 한다.)"
1013408-16 = "(……아무래도, 돌아다니면서 아리스를 찾는 건 불가능할 듯하다.)"
1013408-17 = "(아리스에게 행사장에 도착했다는 연락과, 현재 장소를 함께 보내뒀다.)"
1013408-22 = "선생님?"
1013408-23 = "어디 계신가요? 아리스는 여깄습니다!"
1013408-24 = "[ns1] \"아리스?!\"\n[ns2] \"저기 죄송한데, 길을 좀…….\""
1013408-27 = "앗, 선생님! 찾았습니다!"
1013408-28 = "아리스가 갈 테니, 거기 가만히 계시면 됩니다!"
1013408-33 = "뽜밤뽜밤!"
1013408-34 = "선생님이 동료로 합류했습니다!"
1013408-35 = "[s3] \"그 모습은……?!\"\n[s4] \"아비 에슈흐?!\""
1013408-38 = "그렇습니다! 용사 아리스, 완전 부활……."
1013408-46 = "방금 하늘 날지 않았어?!"
1013408-47 = "어떤 구조로 되어 있는 거야? 일개 코스프레의 퀄리티가 아닌데?"
1013408-48 = "무슨 게임이에요? 어느 부스 홍보예요?"
1013408-50 = "끄앙! 도망치는 중이라는 걸 깜빡했습니다!"
1013408-51 = "설명은 나중에 하고, 일단 도망치는 겁니다!"
1013408-57 = "……그렇게, 게임개발부에서도 모처럼 신작으로 참가하자! 라는 흐름이 되었는데요."
1013408-58 = "주변 부스들보다 눈에 띄려면 홍보가 중요하다고 해서……."
1013408-59 = "홍보 효과는 좋았지만, 너무 잘 되어 버렸습니다!"
1013408-60 = "언젠가부터 부스가 아니라 사람들이 아리스한테만 몰려오고 있는 겁니다!"
1013408-61 = "완전히 본말전도입니다!"
1013408-62 = "[s5] \"확실히, 화려한데 날아다니기까지 하니까.\"\n[s6] \"나 같아도 구경할 거 같아.\""
1013408-65 = "선생님까지 그러시는 겁니까?!"
1013408-66 = "이대로 모두 한 명씩 상대해 주다가는 영영 부실로 돌아갈 수 없습니다!"
1013408-67 = "저쪽으로 날아갔어!"
1013408-68 = "저기 혹시 사진 좀, 괜찮으면 포즈 취해주실 수 있나요?"
1013408-69 = "앗! 들키고 말았습니다!"
1013408-76 = "처, 천천히 한 사람씩 말하는 겁니다! 끄앙!"
1013408-82 = "(결국, 행사가 끝나는 시간까지, 아리스와 함께 정신없이 바쁜 시간을 보냈다.)"
1013408-90 = "……어, 어떻게든 끝난 겁니다."
1013408-91 = "도중부터는 어떻게 되었는지, 기억도 흐릿합니다……"
1013408-92 = "[s7] \"수고했어…….\"\n[s8] \"나도 중간부터 엄청 사진 찍어줬던 기억만…….\""
1013408-97 = "[ns9] \"아, 맞다! 그 모습, 어떻게 된 거야?!\"\n[ns10] \"아비 에슈흐는 그때 부서진 거 아니었어?\""
1013408-100 = "아, 중간에 너무 바빠서 설명하기를 깜빡하고 말았습니다!"
1013408-101 = "뽜밤뽜밤! 용사 아리스 완전 부활!"
1013408-102 = "……이라고 하고 싶지만……."
1013408-103 = "사실, 이 모습은 레플리카입니다."
1013408-104 = "아, 레플리카라 해도, 원본을 바탕으로 만든 거지만요."
1013408-105 = "실은, 강철대륙을 떠나기 직전, 아비 에슈흐의 잔해를 발견했습니다."
1013408-106 = "잔해라 해도, 한 손으로 집을 만큼 작은 파편이었지만……."
1013408-107 = "[s11] \"함께 돌아오고 싶었던 거구나.\"\n[s12] \"아비 에슈흐도 동료니까.\""
1013408-112 = "……! 네!"
1013408-113 = "그래서, 혹시라도 고칠 수 있을까 하고, 밀레니엄 모두에게 보여줬습니다."
1013408-123 = "하지만 손상이 너무 심해서, 원상 복구는 불가능하다고 했습니다."
1013408-124 = "대신 [ruby=원형]마스터 모델[/ruby]의 형태와 기능을 설명해주면, 최대한 비슷하게 재현해 보겠다고요."
1013408-125 = "덕분에, 아비 에슈흐도 원래 모습으로 돌아온 겁니다!"
1013408-126 = "……비록, 원본은 일부분에 불과하지만요."
1013408-127 = "아, 그래도, 이전에 비하면 출력은 훨씬 약해져서 장시간 비행이나, 고속 기동 같은 건 불가능합니다."
1013408-128 = "장비 내구도도 한계라서, 전투에 사용하지 말라고 신신당부했습니다."
1013408-129 = "[s13] \"그래서 레플리카구나.\"\n[s14] \"모처럼 복구했는데, 아쉽겠네.\""
1013408-132 = "……?"
1013408-133 = "아리스는 전혀 아쉽지 않습니다."
1013408-134 = "마왕과의 싸움이 끝나고, 힘이 봉인되는 용사는 이 바닥에서 흔합니다. 최근에는 오히려 클리셰입니다."
1013408-135 = "그리고……."
1013408-142 = "오늘, 처음으로 아비 에슈흐를 다시 입고 모두의 앞에 섰습니다."
1013408-143 = "그리고 모두 아비 에슈흐를 보고 멋있다고, 좋아한다고 말해줬습니다."
1013408-144 = "그건 하늘을 날거나, 마왕과 싸우는 힘을 가진 것보다, 훨씬, 훨씬 멋진 일입니다."
1013408-145 = "그래서 오늘 아리스는 무척 행복했습니다!"
1013408-147 = "(아리스와 함께 손을 잡고 게임개발부 부실까지 돌아왔다.)"
1013408-148 = "(……도중에도 몇 번이나 통행객들로부터 함께 사진을 찍어달라는 부탁을 받았다.)"
