[translation]
10055010-1 = "Episode 1;Romantic Cruising"
10055010-3 = "The sky was clear."
10055010-7 = "The sea breeze brought in gentle waves that lapped lazily at the pristine shore."
10055010-8 = "There were no better omens to set off on a cruise."
10055010-11 = "So..."
10055010-12 = "Where did you say the ship we rented was?"
10055010-13 = "You're Hanuma Makoto, right?"
10055010-14 = "That is I! I am Hanuma Makoto, Supreme Chairman of the Pandemonium Society, Gehenna's one and only leader, greatest throughout heaven and earth!"
10055010-15 = "...Sure, sure, unrivaled one. Your glorious ship's right here. See, written right there—\"Rented out to 'Hanuma Makoto.'\""
10055010-16 = ""
10055010-18 = ""
10055010-19 = ""
10055010-20 = ""
10055010-21 = "No, that can't be right!"
10055010-24 = "This little tub?!"
10055010-25 = "This rickety old boat that's already halfway to the bottom of the ocean?"
10055010-26 = "This is the ship the Pandemonium Society is meant to take our luxurious cruise on?!"
10055010-29 = "Iroha! What is the meaning of this?!"
10055010-30 = ""
10055010-32 = ""
10055010-33 = "Why are you looking at me...? You told me not to bother because you found \"the best deal that only a great leader could find.\""
10055010-34 = "I mean... It was somewhat suspiciously cheap... I suppose..."
10055010-35 = "GASP! I know what this is! That conniving Prefect Team must have planned this dastardly trap from the very beginning!"
10055010-36 = "Are you... No, the Prefect Team had no hand in this whatsoever."
10055010-37 = "So basically, you meant to charter a large passenger ship, got blinded by the low price, and somehow ended up renting this tiny fishing boat instead."
10055010-38 = "Hearing it all laid out like that actually makes it even worse. What were you thinking?"
10055010-39 = "Phooey! That's beside the point!"
10055010-41 = "Hm? Is something wrong? I did send you a confirmation photo, but you didn't respond..."
10055010-43 = "...What do you have to say for yourself?"
10055010-44 = "I am the leader of the illustrious Pandemonium Society! Do you think I have time to CHECK MESSAGES?!"
10055010-45 = "Wow. If you looked up \"shameless\" in the dictionary, there'd be a picture of your face there."
10055010-47 = "Sooo, does that mean we're canceling the trip?"
10055010-48 = "Is that even a question?! We can't be seen taking a vacation in this little dinghy! We'd be the laughingstocks of Kivotos!"
10055010-49 = ""
10055010-51 = ""
10055010-53 = "We're...canceling the trip?"
10055010-54 = "W-We don't get to go on the \"cwuise\" thingie?"
10055010-55 = "Did...Ibuki do something? Is it because she didn't brush her teeth this morning?"
10055010-56 = "EHHH?!"
10055010-57 = "N-N-No! Of course not! You've never done anything wrong in your life, Ibuki! You're right! As long as it floats, who cares what kind of boat it is? Big or small, it's just about spending time with you!"
10055010-58 = "A boat like this could take us to the ends of the sea! Isn't that right, Sensei?!"
10055010-59 = ""
10055010-63 = "[ns] \"Let's say yes!!\""
10055010-64 = "...*sigh* There's no way around it."
10055010-65 = "Makoto aside, we can hardly let Ibuki down like this."
10055010-67 = "Ahaha! No matter how much Makoto and Iroha bicker, neither of them can say no to Ibuki!"
10055010-68 = "This isn't quite what I'd pictured, but it'll do."
10055010-70 = "Eh? Y'all are going to take it?"
10055010-71 = "Don't be put off by its looks! This old gal has held up through wind and rain for thirty long years!"
10055010-72 = "The hull does spring a leak every once in a while, but Odyssey patrols around here anyway! If you start sinking, just send out a distress signal and they'll come get'cha!"
10055010-73 = ""
10055010-76 = ""
10055010-77 = "That's not a very funny joke. ...That was a joke, right?"
10055010-78 = "Hey, back off! Satsuki gets scared easily! But there's something alluring about her face when it's frozen in fear! Let's commemorate it! Say \"CHEESE!\""
10055010-79 = ""
10055010-81 = ""
10055010-84 = ""
10055010-86 = ""
10055010-88 = "One last warning. Be careful not to travel into deep waters."
10055010-89 = "Wh-Why?! Will we sink?!"
10055010-90 = "No, no... It's more about what's out there. Word around the docks is that some ghost ship's been lurking lately."
10055010-91 = "A-A ghost ship...?!"
10055010-92 = "I'd think you youngins would've heard more about it than me."
10055010-94 = "Me, me! I've heard of it!! When it comes to rumors and gossip, you can count on me, Motomiya Chiaki, secretary of the Pandemonium Society!"
10055010-95 = "A long, long time ago, a band of pirates discovered treasure while out at sea. But the greedy crew wanted it all for themselves, so they mutinied and threw the captain overboard."
10055010-96 = "However, the sea has its own justice. It cursed the disloyal pirates, dooming them to wander through an endless fog for the rest of time..."
10055010-97 = ""
10055010-99 = ""
10055010-100 = "You know, it's a lot less creepy when I'm telling it in the light of day, compared to when I read it by myself at night."
10055010-101 = "My, you're well informed, Chiaki. Even I hadn't heard that rumor before, and I'm the Pandemonium Society's Intelligence Committee Director. I'm impressed."
10055010-102 = "Heehee, thaaanks!"
10055010-104 = "Hmm. Even I, the revered leader of the Pandemonium Society, have never heard of it. What about you...Iroha?"
10055010-105 = "Eh? ...No way, I'm not doing it. Don't look at me like that."
10055010-106 = "I have heard of it, though."
10055010-107 = "Not that I've actively sought it out or anything, but it's been going viral on social media. You'll have a harder time finding someone in Gehenna who doesn't know about it... Besides our Intelligence Director and Chairman..."
10055010-109 = "Why does a creepy story like that have to start trending right before our trip?"
10055010-110 = "Because there have been sightings lately, duh!"
10055010-111 = "Sightings?"
10055010-112 = "Yup. Posts have been popping up of completely different people claiming they saw it in the same place at the same time."
10055010-113 = "It's almost like...it really did materialize."
10055010-114 = ""
10055010-116 = ""
10055010-117 = "Don't tell me you students came all this way because you believe that nonsense too."
10055010-118 = "Huh? You think it's all made up, Captain?"
10055010-119 = "Bah! I've been fishing here since you youngins were still in diapers! I would've seen if some ghost ship were sailing around on my waters!"
10055010-120 = "I'm more annoyed with the commotion these darned rumors have stirred up around town!"
10055010-121 = "Ahaha... That's a good point."
10055010-122 = "Come to think of it, considering how old this story is, it IS weird that people randomly started seeing the ghost ship now."
10055010-123 = "And the rumors only started spreading like wildfire after one person claimed they'd seen it..."
10055010-124 = "Maybe other people just wanted a piece of the pie and jumped on the conspiracy once it started trending!"
10055010-125 = "What?! Who would lie about things like that online? I'd like to personally investigate and punish them!"
10055010-127 = "Forget those old rumors. Here, in reality, the fog's been thick lately. If the clouds start rolling in, you come right on back, you hear?"
10055010-128 = ""
10055010-130 = ""
10055010-131 = "The sea is an unpredictable mistress. You should always tread carefully."
10055010-133 = "Kihehe! The sky's looking plenty clear to me! What could possibly happen?"
10055010-134 = "Makoto, PLEASE don't jinx us like that..."
10055010-136 = "Ooh! So we're going for real? Yay! I'm gonna get a bunch of great shots!"
10055010-137 = "I will say, the boat IS very small. We're going to be in very close quarters."
10055010-138 = ""
10055010-141 = ""
10055010-142 = "Ibuki calls dibs on Sensei's lap!"
10055010-143 = ""
10055010-145 = ""
10055010-146 = "I-Ibuki?! My lap is free too, you know?! IBUKIII?!"
10055010-154 = ""
10055010-155 = "Hmm. This isn't bad at all, is it?"
10055010-156 = ""
10055010-158 = ""
10055010-160 = "It really does feel relaxing! Oh, Iroha! Look at me! Smile!"
10055010-161 = ""
10055010-163 = ""
10055010-166 = ""
10055010-168 = ""
10055010-170 = "Eh? I didn't sign a release waiver, so you shouldn't take pictures of me without my consent."
10055010-171 = "Ahaha, c'mon! It's for the mems! Don't you want to remember your voyage through the ocean?"
10055010-172 = ""
10055010-174 = ""
10055010-175 = ""
10055010-176 = "...Hey, where's Makoto? I haven't seen her for a bit."
10055010-177 = "Oh, Makoto? She got seasick, so she went to lie down."
10055010-178 = "For someone who gets seasick like that, why did she want to go on a cruise?"
10055010-179 = "She probably just heard the \"luxury\" part and ran with it! You know how Makoto gets!"
10055010-180 = "I'll just never really understand her taste..."
10055010-181 = "I am a little worried about her, though! I'm gonna check on her...and sneak in a quick snap while I'm at it!"
10055010-182 = "You want a picture of her sleeping?"
10055010-183 = "Yeah! Because Makoto always looks so cool in her \"Weekly Pandemonium Society\" features! It'd be a nice change of pace to showcase her vulnerability as she overcomes seasickness!"
10055010-184 = "Makes sense. Print me a copy too."
10055010-185 = "[s] \"I'll just never really understand her taste...\""
10055010-186 = "Huuuh? YOU want a pic of MAKOTO? It really is true that anything can happen out on the open waters!"
10055010-187 = "Deal, then let's go! And try not to be too loud!"
