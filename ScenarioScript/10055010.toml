[translation]
10055010-1 = "ตอนที่ 1;ล่องเรือสำราญสุดโรแมนติก"
10055010-3 = "(ท้องฟ้าปลอดโปร่ง)"
10055010-7 = "(คลื่นซัดชายหาดแผ่วเบา ลมทะเลพัดเอื่อยๆ)"
10055010-8 = "(อากาศแจ่มใสดูเหมาะกับการล่องเรืออย่างถึงที่สุด)"
10055010-11 = "แล้ว..."
10055010-12 = "เรือที่เราเช่าอยู่ที่ไหนกันนะ?"
10055010-13 = "เธอคือฮานุมะ มาโคโตะใช่รึเปล่า?"
10055010-14 = "ใช่แล้ว เราผู้นี้คือท่านฮานุมะ มาโคโตะ ประธานสูงสุดแห่งแพนเดโมเนียม โซไซตี้ ผู้นำหนึ่งเดียวแห่งเกเฮนน่า ผู้เป็นหนึ่งเหนือฟ้าใต้หล้า"
10055010-15 = "เหนือฟ้าเหนือดินอะไรพูดไม่รู้เรื่องเลย แต่มีชื่อเขียนอยู่ตรงนี้นะ ดูสิ เขียนว่าผู้เช่าเรือ ฮานุมะ มาโคโตะ"
10055010-16 = ""
10055010-18 = ""
10055010-19 = ""
10055010-20 = ""
10055010-21 = "ไม่ เป็นไปไม่ได้!!"
10055010-24 = "เรือยนต์ลำจิ๋วแบบนี้เนี่ยนะ!!"
10055010-25 = "เรือเก่าผุๆ ใกล้จมแบบนี้น่ะเหรอ!"
10055010-26 = "จะเป็นเรือสำราญที่แพนเดโมเนียม โซไซตี้ของเราจะโดยสาร#nท่องเที่ยวอย่างนั้นเรอะ?!"
10055010-29 = "อิโรฮะ! นี่มันเรื่องอะไรกัน?!"
10055010-30 = ""
10055010-32 = ""
10055010-33 = "จะเรื่องอะไรก็เถอะ… คนที่บอกว่ามีสัญญาที่ดีกว่า แล้วปฏิเสธเรือที่ฉันหามาให้ก็คือรุ่นพี่มาโคโตะเอง#nนะคะ"
10055010-34 = "เดี๋ยวสิ เรื่องนั้นมันก็ใช่อยู่หรอก... คิดแล้วเชียวว่าทำไมถึงราคาถูก..."
10055010-35 = "อึก! อย่าบอกนะว่าเจ้าพวกคณะกรรมการวินัยนั่นคำนวณไว้ถึงขั้นนี้ แล้ววางกับดักอันต่ำช้าแบบนี้ไว้?!"
10055010-36 = "เฮ้อ... มันจะเป็นแบบนั้นได้ยังไงคะ ช่วยยอมรับความจริงสักทีเถอะค่ะ"
10055010-37 = "สรุปคือเดิมทีวางแผนจะเหมาเรือโดยสารขนาดใหญ่ แต่พอเห็นราคาถูกก็เลยหน้ามืด เข้าใจผิดแล้วเช่าเรือประมงลำจิ๋วนี่มาแทนสินะคะ"
10055010-38 = "พอสรุปแล้วยิ่งไม่น่าเชื่อเลยค่ะ... ทำไมถึงเข้าใจผิดไปได้ขนาดนั้นกันคะ?"
10055010-39 = "ฮึ่ย! มันเรื่องเล็กน้อยน่า!"
10055010-41 = "หืม? มีอะไรผิดพลาดงั้นเหรอ? ฉันส่งรูปให้ดูก่อนแล้วเผื่อว่าจะมีปัญหาอะไรนี่นา..."
10055010-43 = "เขาบอกว่าอย่างนั้นนะคะ...?"
10055010-44 = "เราเป็นถึงประธานของแพนเดโมเนียม โซไซตี้เลยนะ จะมีเวลาว่างคอยตรวจข้อความที่ส่งเข้ามาทุกอัน#nได้ยังไงกัน!"
10055010-45 = "ว้าว พูดอย่างมั่นใจจนคนฟังยังเอือมเลยนะคะ..."
10055010-47 = "ถ้าอย่างนั้นทริปวันนี้ก็ต้องยกเลิกสินะ?"
10055010-48 = "แน่นอนอยู่แล้ว! จะให้เราท่องเที่ยวด้วยเรือเล็กๆ โกโรโกโสแบบนี้เนี่ยนะ ไร้สาระสุดๆ! แบบนั้นจะโดนหัวเราะเยาะเอาได้ไม่ใช่รึไง!"
10055010-49 = ""
10055010-51 = ""
10055010-53 = "ยกเลิก... ทริป...?"
10055010-54 = "คือ... วันนี้ไปเที่ยวไม่ได้แล้วเหรอ?"
10055010-55 = "หรือว่าเป็นเพราะอิบูกิเหรอ? เพราะอิบูกิเป็นเด็กไม่ดีเลยไปไม่ได้งั้นเหรอ?"
10055010-56 = "ว้ากกก...?!"
10055010-57 = "มะ... ไม่ใช่แบบนั้นนะอิบูกิ! แค่ลอยน้ำได้ก็นับว่าเป็นเรือแล้วละ จะเล็กจะใหญ่ก็ไม่สำคัญหรอก!"
10055010-58 = "เรือแบบนี้ไปได้ถึงสุดขอบทะเลเลยนะ! ใช่มั้ยล่ะ ครู?!"
10055010-59 = ""
10055010-63 = "[ns] \"ของมันแน่อยู่แล้ว!!!\""
10055010-64 = "เฮ้อ... ช่วยไม่ได้นะคะ"
10055010-65 = "ถ้าเป็นรุ่นพี่มาโคโตะก็ว่าไปอย่าง แต่ฉันจะทำให้อิบูกิผิดหวังไม่ได้ค่ะ"
10055010-67 = "อะฮะฮ่า~ ไม่ว่าจะรุ่นพี่มาโคโตะหรืออิโรฮะจัง ต่อให้ทะเลาะกันขนาดไหนก็แพ้ให้อิบูกิจังตลอดเลยนะคะ!"
10055010-68 = "หืม~? มันต่างจากที่ฉันคิดเอาไว้นิดหน่อย แต่ก็ยังไงก็ได้อยู่แล้วละ"
10055010-70 = "อืม? ดูเหมือนจะตกลงกันได้แล้วสินะ"
10055010-71 = "ถึงสภาพภายนอกมันจะดูเป็นแบบนี้ แต่สบายใจได้ เรือลำนี้น่ะอยู่มาได้ตั้ง 30 ปีแล้วนะ"
10055010-72 = "ถ้าเกิดว่ามีรูรั่วขึ้นมาจริงๆ ละก็ แถวนี้ก็เป็นเขตลาดตระเวนของโรงเรียนการเดินเรือโอดิสซีย์ ส่งสัญญาณขอความช่วยเหลือไปเดี๋ยวก็คงมาถึงก่อนเรือจมเองนั่นแหละ ฮ่าๆๆ!"
10055010-73 = ""
10055010-76 = ""
10055010-77 = "เป็นมุกที่ขำไม่ออกเลยนะ... ล้อเล่นใช่มั้ยเนี่ย?"
10055010-78 = "อ๊ะ! อย่าทำให้รุ่นพี่ซัตสึกิของพวกเรากลัวสิคะ! แต่ว่าสีหน้าตกใจของรุ่นพี่ก็ดูดีสุดๆ เลย ถ่ายเก็บไว้เป็นที่ระลึกสักรูปดีมั้ยคะ!"
10055010-79 = ""
10055010-81 = ""
10055010-84 = ""
10055010-86 = ""
10055010-88 = "อ้อ มีอีกเรื่องหนึ่ง พวกเธออย่าออกไปไกลเกินไปนักล่ะ"
10055010-89 = "มีเรื่องอันตรายจริงๆ งั้นเหรอ?!"
10055010-90 = "ไม่ใช่อย่างนั้นหรอก... ช่วงนี้มีข่าวลือแปลกๆ เรื่องเรือผีสิงอะไรทำนองนั้นน่ะ"
10055010-91 = "ระ... เรือผีสิง...?!"
10055010-92 = "พวกเธอน่าจะรู้เรื่องนี้ดีกว่าฉันนะ ไม่เคยได้ยินกันรึไง?"
10055010-94 = "เคยสิคะ~! ถ้าพูดถึงข่าวลือและเรื่องซุบซิบจะขาด โมโตมิยะ จิอากิ เลขาแห่งแพนเดโมเนียม โซไซตี้#nคนนี้ไปได้ยังไงคะ! ฉันเคยได้ยินเรื่องนี้ค่ะ!"
10055010-95 = "กาลครั้งหนึ่งนานมาแล้ว~ มีกลุ่มโจรสลัดพบสมบัติแห่งท้องทะเล จากนั้นก็ขับไล่กัปตันเรือออกไป#nเพื่อจะฮุบสมบัติเอาไว้เอง~"
10055010-96 = "พวกเขาเลยถูกคำสาปแห่งท้องทะเล จนต้องติดอยู่ในหมอกที่ไม่มีวันจาง แล้วล่องลอยอยู่กลางทะเล#nไปตลอดกาล…"
10055010-97 = ""
10055010-99 = ""
10055010-100 = "เอ๊ะ? ตอนอ่านรู้สึกขนลุกกว่านี้นะคะ แต่ทำไมพอเล่าแล้วกลับดูจืดชืดแบบนี้นะคะ"
10055010-101 = "อ้าว รู้ละเอียดดีนี่ จิอากิจัง ขนาดฉันเป็นหัวหน้าฝ่ายข่าวกรองของแพนเดโมเนียม โซไซตี้ยังเพิ่งเคย#nได้ยินครั้งแรกเลย น่าชื่นชมจริงๆ"
10055010-102 = "ขอบคุณค่า~!"
10055010-104 = "อืม เราที่เป็นประธานแพนเดโมเนียม โซไซตี้ก็ไม่เคยได้ยินเหมือนกัน... แล้วอิโรฮะ... เคยได้ยินรึเปล่า?"
10055010-105 = "เอ่อ... อะไรเหรอคะ? รุ่นพี่จะมองด้วยสายตาคาดหวังอะไรขนาดนั้นกัน... ฉันไม่เอาด้วยหรอกนะคะ"
10055010-106 = "เอาเป็นว่าก็เคยได้ยินมาบ้างเหมือนกันค่ะ"
10055010-107 = "ฉันไม่ได้ไปหาเองหรอกค่ะ แค่เห็นจากฟีดในโซเชียลมีเดียบ่อยๆ ในเกเฮนน่าคงแทบไม่มีใครที่จะไม่รู้#nหรอกค่ะ"
10055010-109 = "ทำไมเรื่องแบบนั้นถึงต้องมาเป็นกระแสตอนนี้ด้วยนะ? สังหรณ์ใจไม่ดีเลย..."
10055010-110 = "อ่า คืออย่างนี้ค่ะ~ จริงๆ แล้ว ช่วงนี้เริ่มมีคนโพสต์ว่า 'เคยเห็น' กันน่ะค่ะ"
10055010-111 = "เคยเห็นเหรอ?"
10055010-112 = "ค่ะ มีหลายๆ คนมาโพสต์ว่า 'เคยเห็น' ในที่เดียวกัน แถมเวลาเดียวกันด้วยค่ะ"
10055010-113 = "เหมือนกับว่า... มันปรากฏตัวขึ้นมาจริงๆ เลยค่ะ"
10055010-114 = ""
10055010-116 = ""
10055010-117 = "อย่าบอกนะว่าพวกเธอก็เชื่อข่าวลือไร้สาระนั่นเหมือนกัน?"
10055010-118 = "เอ๋? คุณกัปตันคิดว่าเป็นเรื่องหลอกลวงเหรอคะ?"
10055010-119 = "ก็แหงสิ ฉันเป็นชาวประมงอยู่ที่นี่มาตั้งกี่ปีแล้ว ถ้าแถวนี้มีอะไรแบบนั้น ฉันก็คงเจอไปนานแล้วสิ จริงมั้ย?"
10055010-120 = "แค่เรื่องนั้นก็ทำเอาคนในหมู่บ้านวุ่นวายกันใหญ่แล้ว!"
10055010-121 = "อ่า~ นั่นสินะคะ~"
10055010-122 = "พอคิดดูดีๆ ถ้าบอกว่ามันมีมาตั้งแต่สมัยก่อนแล้ว แต่จู่ๆ เพิ่งมา 'เห็น' ตอนนี้ มันก็น่าแปลกนิดหน่อย..."
10055010-123 = "ข่าวลือเองก็หนาหูขึ้นเรื่อยๆ เลยหลังจากที่มีคนอ้างว่า 'เห็น' น่ะค่ะ..."
10055010-124 = "สุดท้ายก็คงเป็นเรื่องเล่าสยองขวัญแบบเดิมๆ ที่ใครต่อใครต่างก็อ้างว่า ‘เคยเห็น’ ตามกระแสสินะคะ?"
10055010-125 = "อะไรกัน สุดท้ายก็เรื่องโกหกนี่นา ใครปล่อยข่าวลือน่ากลัวแบบนั้นนะ ต้องหาตัวมาสั่งสอนซะหน่อย!"
10055010-127 = "ยังไงก็เถอะ ไม่ว่าข่าวลือนั่นจะเป็นยังไง แต่ช่วงนี้มีหมอกลงบ่อยจริงๆ ถ้ารู้สึกว่าสภาพอากาศแปลกไป#nแม้แต่นิดเดียวก็รีบกลับเข้าฝั่งทันทีเลยนะ"
10055010-128 = ""
10055010-130 = ""
10055010-131 = "ทะเลน่ะเป็นสิ่งที่เอาแน่เอานอนไม่ได้ ระวังไว้ก่อนก็ไม่เสียหายหรอก"
10055010-133 = "คิกคิกคิก! กังวลอะไรไม่เข้าเรื่องจริงๆ อากาศแจ่มใสขนาดนี้จะไปมีปัญหาอะไรได้?"
10055010-134 = "อย่าพูดเป็นลางสิคะ รุ่นพี่มาโคโตะ"
10055010-136 = "ว้าว~ สุดท้ายก็ยังจะไปให้ได้สินะคะ! ดีเลยค่ะ! น่าจะได้รูปสวยๆ เพียบเลย!"
10055010-137 = "เรือลำเล็กจริงๆ ด้วย ต้องนั่งเบียดกันแล้วละ"
10055010-138 = ""
10055010-141 = ""
10055010-142 = "ถ้างั้นอิบูกิจะนั่งตักคุณครูเอง!"
10055010-143 = ""
10055010-145 = ""
10055010-146 = "อะ... อิบูกิ?! ตักเราก็ว่างอยู่นะ?! อิบูกิ~~?!"
10055010-154 = ""
10055010-155 = "หืม~ ก็เข้าท่าดีไม่ใช่รึไง?"
10055010-156 = ""
10055010-158 = ""
10055010-160 = "รู้สึกผ่อนคลายจริงๆ เลยนะคะ! อ๊ะ อิโรฮะจัง! หันมาทางนี้แล้วยิ้มหน่อยค่ะ!"
10055010-161 = ""
10055010-163 = ""
10055010-166 = ""
10055010-168 = ""
10055010-170 = "อะไรคะ อย่าถ่ายรูปฉันตามใจชอบสิคะ แบบนี้มันละเมิดสิทธิส่วนบุคคลนะคะ"
10055010-171 = "อะฮ่าฮ่า! ถ่ายเก็บไว้เป็นที่ระลึกไม่ดีรึไง อุตส่าห์มาทะเลทั้งทีนะ!"
10055010-172 = ""
10055010-174 = ""
10055010-175 = ""
10055010-176 = "เอ๋... ว่าแต่ว่าไม่เห็นรุ่นพี่มาโคโตะมาตั้งแต่เมื่อกี้แล้วนะคะ?"
10055010-177 = "อ๋อ มาโคโตะจังเมาเรือเลยไปพักอยู่ข้างในแทนน่ะ"
10055010-178 = "ฉันไม่เข้าใจจริงๆ เลยค่ะว่าคนเมาเรือจะวางแผนมาท่องเที่ยวเรือสำราญทำไมกัน"
10055010-179 = "อาจสะดุดใจกับคำว่า ‘เรือสำราญสุดหรู’ ละมั้งคะ? ถ้าพูดถึงรุ่นพี่มาโคโตะก็คงเป็นเรื่องความมุ่งมั่น#nไม่ย่อท้อนี่ละค่ะ เท่สุดๆ ไปเลยค่ะ! อะฮ่าฮ่า!"
10055010-180 = "รสนิยมอะไรของเธอกันเนี่ย..."
10055010-181 = "อืม... แต่ก็น่าเป็นห่วงนะคะ ฉันไปดูรุ่นพี่หน่อยดีกว่า! ถ้าเป็นไปได้จะถ่ายรูปไว้ด้วยค่ะ!"
10055010-182 = "ถ่ายรูปเหรอ?"
10055010-183 = "ก็ใน ‘แพนเดโมเนียมรายสัปดาห์’ รุ่นพี่มาโคโตะดูเท่ตลอดเลยนี่คะ! เลยคิดว่าถ้าได้เห็นมุมอ่อนแอ#nตอนเมาเรือบ้าง ก็น่าจะมีเสน่ห์ไปอีกแบบค่ะ!"
10055010-184 = "โอ๊ะ ถ้าเป็นรูปแบบนั้น ฉันก็อยากได้สักรูปเหมือนกันค่ะ"
10055010-185 = "[s] \"ชอบอะไรแบบนี้ด้วยเหรอเนี่ย...\""
10055010-186 = "โอ้โฮ! อิโรฮะจังเป็นฝ่ายขอรูปของรุ่นพี่มาโคโตะก่อนเหรอเนี่ย! แบบนี้หายากนะคะ! มาทะเลนี่ดีจริงๆ เลย ได้เจออะไรแปลกใหม่ด้วย!"
10055010-187 = "งั้นไปดูกันเถอะค่ะ! อ๊ะ แต่ก็อย่าเสียงดังเกินไปนะ"
10055010-192 = ""
10055010-193 = "เอ่อ รุ่นพี่มาโคโตะ... ขออนุญาตค่ะ~"
10055010-194 = ""
10055010-196 = ""
