[translation]
10055010-1 = "제1화;로맨틱 크루징"
10055010-3 = "(하늘이 맑다.)"
10055010-7 = "(해변에는 파도가 잔잔히 일고, 바닷바람이 살랑거리며 불어온다.)"
10055010-8 = "(바다를 유람하기에는 더할 나위 없이 멋진 날씨다.)"
10055010-11 = "그래서."
10055010-12 = "우리가 빌린 배가 어디 있다고 했지?"
10055010-13 = "학생 이름이 하누마 마코토 아닌가?"
10055010-14 = "그렇다. 바로 이 몸이 만마전의 최고 의장이자, 게헨나의 유일한 지도자, 천상천하 유아독존, 하누마 마코토 님이시다."
10055010-15 = "……천상천하 어쩌고는 모르겠지만, 여기 나와 있잖나. 자, 하누마 마코토 이름으로 배를 빌린다고."
10055010-21 = "아니, 그럴 리가 없지 않나!"
10055010-24 = "이런 통통배가!!"
10055010-25 = "침몰하기 직전의 고물선이!"
10055010-26 = "우리 만마전이 타고 여행할 크루즈라고?!"
10055010-29 = "이로하! 이게 어떻게 된 거지?!"
10055010-33 = "어떻게 되시고 자시고 간에…… 더 좋은 계약이 있다면서 제가 알아 온 배를 마다한 게 바로 마코토 선배잖아요."
10055010-34 = "아니, 그건 맞지만…… 어쩐지 너무 싸다고 생각은 했지만……."
10055010-35 = "허억! 설마, 선도부 놈들! 이것까지 계산하고, 비열한 함정을?!"
10055010-36 = "하아…… 그럴 리 없잖아요. 슬슬 현실을 보자고요."
10055010-37 = "결국, 원래는 대형 여객선을 대절하려는 계획이었지만, 싼 가격을 보고 눈이 돌아가서 착각하고 이 조그만 어선을 빌렸다는 거네요."
10055010-38 = "……정리해 보니 더 장난 아닌데요. 어떻게 그걸 착각할 수 있죠?"
10055010-39 = "에에잇! 사소한 문제다!"
10055010-41 = "응? 뭔가 잘못됐나? 혹시나 싶어서 사진도 미리 보내줬는데……."
10055010-43 = "……라고 하시는데요?"
10055010-44 = "만마전 의장이신 이 몸이 모든 연락을 일일이 확인할 만큼 한가할 리 없지 않나!"
10055010-45 = "우와. 보는 쪽이 질릴 만큼 당당하네요."
10055010-47 = "그럼, 오늘 여행은 취소려나?"
10055010-48 = "당연하다! 이렇게 작고 낡은 배로 크루즈 여행이라니, 언어도단! 오히려 세간의 비웃음만 살 것이 뻔하지 않나!"
10055010-53 = "여행…… 취소……?"
10055010-54 = "저기, 오늘 여행 못 가?"
10055010-55 = "혹시 이부키 때문이야? 이부키가 나쁜 아이라서 못 가는 거야?"
10055010-56 = "우와아앗-?!"
10055010-57 = "그, 그렇지 않다! 이부키! 배는 물에 뜨기만 하면 그만! 크든 작든 상관없다!"
10055010-58 = "이런 배라면 바다 끝까지도 갈 수 있다! 그렇지 않나, 선생이여?!"
10055010-63 = "[ns] \"그렇다!!!\""
10055010-64 = "……하아. 어쩔 수 없네요."
10055010-65 = "마코토 선배라면 몰라도, 이부키를 실망시킬 수는 없으니까."
10055010-67 = "아하하~ 역시 마코토 선배도, 이로하 쨩도, 서로 아무리 티격태격해도 이부키 쨩 앞에서는 무력하네요!"
10055010-68 = "흐응~? 나는 어느 쪽도 괜찮지만, 생각한 거랑 약간 다르긴 하네."
10055010-70 = "음? 어찌어찌 잘 해결된 모양이군."
10055010-71 = "뭐, 이렇게 생겼어도 걱정하지 말라고. 30년은 버텨준 녀석이니까."
10055010-72 = "그리고 만에 하나 배에 구멍이 난다 해도, 이 근방은 오디세이아 해양학원 순찰 구역이니까 구조 신호를 보내면 가라앉기 전에 도착할 거야, 하하하!"
10055010-77 = "……웃기 힘든 농담인데. 그거, 농담 맞지?"
10055010-78 = "아앗! 저희 사츠키 선배를 겁주지 마세요! 하지만, 겁먹은 사츠키 선배의 얼굴도 나이스! 기념으로 한 컷 찍어둘까요!"
10055010-88 = "아, 그리고 또 하나. 너무 먼 바다까지 나가지 말게."
10055010-89 = "정말로 위험한 거야?!"
10055010-90 = "아니, 그런 문제는 아니고…… 요즘 유령선이니 어쩌니 하는 이상한 소문이 도는데."
10055010-91 = "유, 유령선……?!"
10055010-92 = "나보다는 학생들이 잘 알 거 같은데, 혹시 모르나?"
10055010-94 = "네엣~! 소문과 가십이라 하면 빼놓을 수 없는 만마전의 서기, 저 모토미야 치아키! 들어본 적 있습니다!"
10055010-95 = "옛날 옛적 아주 먼 옛날~ 바다의 보물을 찾은 해적들이, 이를 독차지하기 위해 선장을 내쫓았는데~"
10055010-96 = "바다의 저주를 받아 영원히 사라지지 않는 물안개 속에 갇혀 바다를 떠돌게 되었다는……."
10055010-100 = "어라? 글로 볼 때는 좀 더 오싹한 느낌이었는데, 막상 말로 하니까 좀 허무하네요."
10055010-101 = "어머, 자세히 알고 있네, 치아키. 만마전의 정보부장인 나도 처음 듣는 소문인데. 칭찬해 줄게."
10055010-102 = "감~사합니닷~!"
10055010-104 = "음, 만마전의 의장인 이 몸도 들어본 적 없다. 만마전의…… 이로하는 들어봤나?"
10055010-105 = "……어, 뭔가요? 뭘 그리 기대하는 눈으로…… 저는 안 할 거거든요?"
10055010-106 = "일단, 들어보긴 했네요."
10055010-107 = "따로 찾아본 건 아니고, SNS 트렌드로 자꾸 올라와서요. 아마 게헨나에서는 모르는 사람이 더 드물지 않을까요?"
10055010-109 = "왜 하필 지금 그런 이야기가 유행하는 거야? 기분 나쁘게……."
10055010-110 = "아~ 그게 말이죠~ 실은, 최근에 '목격담'이 올라오기 시작했거든요."
10055010-111 = "목격담?"
10055010-112 = "네, 전혀 다른 사람들이 같은 장소, 같은 시간에 보았다고 주장하는 글들이 올라왔거든요."
10055010-113 = "꼭…… 나타나기라도 한 것처럼요."
10055010-117 = "설마, 학생들까지 그 헛소문을 믿고 온 건가?"
10055010-118 = "어라? 선장님께서는 거짓말이라 생각하시나요?"
10055010-119 = "당연하지. 내가 여기서 어부 생활을 몇 년을 했는데. 이 근처에 그런 게 있다면, 진작에 내가 찾았겠지, 안 그래?"
10055010-120 = "안 그래도 그것 때문에 마을이 어찌나 소란스러워졌는지!"
10055010-121 = "아차차~ 그것도 그렇네요~"
10055010-122 = "생각해 보면, 오래전부터 있었다면서 이제 와서 갑자기 '보았다'고 주장하는 것도 좀 이상하고……."
10055010-123 = "소문 자체도 누군가 '봤다'고 주장한 이후로 우후죽순으로 올라왔으니까……."
10055010-124 = "결국, 유행에 편승해, 너도나도 '봤다'고 주장하는 그런 뻔한 느낌의 괴담이려나요?"
10055010-125 = "뭐야, 그러니까 결국 거짓말이란 거잖아. 누가 그런 무서운 소문을 퍼트리는 거야. 조사해서 혼내줘야겠어!"
10055010-127 = "여튼간에, 그 헛소문은 어쨌건, 요즘 물안개가 자주 끼긴 하지. 조금이라도 날씨가 이상하다 싶으면 바로 돌아오도록 해."
10055010-131 = "바다는 변덕스러우니까, 아무리 조심해도 나쁠 건 없어."
10055010-133 = "키키킷! 괜한 걱정이군. 이렇게 날이 맑은데, 무슨 문제가 있을까?"
10055010-134 = "괜한 복선 깔지 말아주세요, 마코토 선배."
10055010-136 = "이야~ 결국 강행인가요! 좋네요! 멋진 사진이 잔뜩 찍힐 거 같아요!"
10055010-137 = "배가 작긴 하네. 나란히 붙어 앉아야 할지도."
10055010-142 = "그러면 이부키는 선생님 무릎에 앉을래!"
10055010-146 = "이, 이부키?! 여기 내 무릎도 비어 있단다?! 이부키이이?!"
10055010-155 = "흐응~ 꽤 좋지 않아?"
10055010-160 = "확실히 힐링, 이라는 느낌이네요! 아, 이로하 쨩! 여기 보고 웃어봐!"
10055010-170 = "뭔가요. 마음대로 찍지 말아 주세요. 초상권 침해예요."
10055010-171 = "아하하! 기념으로 좋잖아! 모처럼 바다인데!"
10055010-176 = "……어라, 그나저나 조금 전부터 마코토 선배가 안 보이네요?"
10055010-177 = "아, 마코토 쨩이라면, 뱃멀미로 안에서 쉬고 있어."
10055010-178 = "도대체 뱃멀미하는 사람이 왜 크루즈 여행을 계획했는지 모르겠다니까요."
10055010-179 = "아마 호화 크루즈라는 단어에 꽂힌 게 아닐까? 마코토 선배하면 그 추진력, 역시 멋지네요! 아하핫!"
10055010-180 = "도대체 무슨 취향인지……."
10055010-181 = "으음…… 그래도 걱정이네요. 제가 살펴보고 올게요! 가능하면 사진도 찍고요!"
10055010-182 = "사진?"
10055010-183 = "주간 만마전에서 언제나 멋진 모습만 보여주는 마코토 선배니까, 뱃멀미로 고생하는 약한 모습을 보여주면 갭이 살아나지 않을까 하고!"
10055010-184 = "오, 그런 사진이라면 저도 한 장 갖고 싶네요."
10055010-185 = "[s] \"도대체 무슨 취향인지…….\""
10055010-186 = "오오! 이로하 쨩이 먼저 마코토 선배의 사진을 달라니! 이것도 드문 일이네요! 역시 바다, 신선한 경험을 하게 되네요!"
10055010-187 = "그러면, 다 같이 보러 가죠! 아, 물론, 너무 소란 피우면 안 되겠지만."
10055010-193 = "저기, 마코토 선배~ 실례합니다~"
10055010-199 = "아아, 치아키하고…… 선생인가. 어쩐 일이지?"
10055010-200 = "뱃멀미 중이라고 들어서, 혹시 괜찮으신가 하고…… 아, 혹시 사진 찍어도 괜찮을까요?"
10055010-201 = "키, 키킷…… 치즈다."
10055010-202 = "[s] \"아, 해주는구나.\""
10055010-203 = "당연하다…… 만마전 의장 되는 몸."
10055010-207 = "언제 어디서나 당당하지 않으면…… 우읍…….!"
10055010-208 = "[s1] \"괜히 말하니까…….\"\n[s2] \"무리하지 말고 쉬어.\""
10055010-211 = "아아, 선생의 호의를 받들어, 조금만 쉬도록 하지."
10055010-217 = "이야, 설마설마, 마코토 선배의 저런 모습을 보게 될 줄은 몰랐는데요~"
10055010-218 = "그러게요. 평소에도 저만큼 얌전했으면 좋겠네요."
10055010-219 = "이로하 쨩, 신랄해~"
10055010-225 = "사츠키 선배! 저기 봐! 갈매기!"
10055010-226 = "어머, 정말이네. 배를 따라오는 걸까?"
10055010-230 = "후후~"
10055010-231 = "……갑자기 뭐에요."
10055010-232 = "이로하 쨩~ 입꼬리 올라갔다고요~"
10055010-233 = "잘못 본 거겠죠."
10055010-234 = "[s] \"그래도 이렇게 나오니까 좋지?\""
10055010-235 = "뭐…… 나쁘지는 않네요."
10055010-242 = "……? 방금 이상한 소리 나지 않았나요? 뭔가 푸슝~ 하는 느낌으로."
10055010-243 = "네, 저도 들었습니다. 디젤 엔진 소리예요. 하지만 지금 소리는……."
10055010-247 = "나쁜 예감이 드네요. 잠깐 확인해 보죠."
10055010-255 = "저기요……."
10055010-258 = "엔진, 멈췄는데요?"
10055010-261 = "[log]표 류  1일 차[/log]"
