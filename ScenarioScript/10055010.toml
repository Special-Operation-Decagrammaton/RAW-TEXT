[translation]
10055010-1 = "第1話;ロマンティック・クルージング"
10055010-3 = "（晴れた空）"
10055010-7 = "（静かにさざなみが立ち、潮風が頬を撫でる）"
10055010-8 = "（船旅には絶好の日和だった）"
10055010-11 = "――それで。"
10055010-12 = "我々の船はどこにある？"
10055010-13 = "キミ……羽沼マコトといったか。"
10055010-14 = "ああ。この私が万魔殿の最高議長でありゲヘナ唯一の指導者。#n天上天下唯我独尊――羽沼マコト様だ。"
10055010-15 = "てんじょうてん……？まあいい、ほらここに署名があるだろう？#n「羽沼マコト」って。"
10055010-21 = "いいや、そんなはずはない！"
10055010-24 = "このちんけな船が！？"
10055010-25 = "こんな――少しの波で沈没しそうなおんぼろ船が……！"
10055010-26 = "我々の乗るクルーズ船だと！？"
10055010-29 = "イロハ！どういうことだこれは！？"
10055010-33 = "どういうことも何も……私が提案したものを全部却下したのはマコト先輩じゃないですか。#nそんなものよりこっちのほうがお得だ、とかなんとか言って。"
10055010-34 = "い、いやそれはそうだが……#nたしかに、やけに安いとは思ったが……。"
10055010-35 = "はっ……！まさか風紀委員が、卑劣な罠を仕掛けて……！？"
10055010-36 = "はぁ……そんなわけないでしょう。#nそろそろ現実を見てください。"
10055010-37 = "つまり……値段に釣られてこの船を契約した、ってことで合ってます？"
10055010-38 = "というか、契約前に分かりますよね普通……。"
10055010-39 = "ええいっ！この程度、些事だ！大体、マコト様だって事前に――"
10055010-41 = "ん、何かトラブルかのう？#n一応、事前に確認の写真も送っているのだが……。"
10055010-43 = "……だそうですけど。"
10055010-44 = "万魔殿の議長であるこのマコト様に、いちいち確認する暇があるとでも！？"
10055010-45 = "開き直りもここまでくるといっそ芸術的ですね。"
10055010-47 = "じゃあ、旅行はキャンセルかしら？"
10055010-48 = "当然だ！こんな船で旅行に行ったなど知られてみろ？我々は世間の笑いものだ！"
10055010-53 = "旅行……キャンセル？"
10055010-54 = "いかないの……？"
10055010-55 = "もしかして……イブキのせい？#nイブキがいい子にしてなかったから？"
10055010-56 = "ぬぁっ！？"
10055010-57 = "そ、んなことはないぞイブキ！#n船は海に浮かべばいい！大きさの違いなど些事だ！"
10055010-58 = "うむ！私が間違っていた。我々は予定通り船旅ができるというわけだ。#nそうだろう先生！？"
10055010-63 = "[ns] \"そういうこったぁ！！！\""
10055010-64 = "……はぁ、仕方ないですね。"
10055010-65 = "マコト先輩はともかく、イブキを悲しませるわけにはいきませんので。"
10055010-67 = "マコト先輩もイロハちゃんも、なんだかんだ言って、イブキちゃんに甘いですね！"
10055010-68 = "ふぅん？まあ、私はどっちでもいいけど……#nなんだか、思ってたのとはちょっと違うわね。"
10055010-70 = "ふむ……話がまとまったようじゃな。"
10055010-71 = "まあ、こんな見た目の船じゃが、30年間頑張っておる。"
10055010-72 = "それに、万が一床に穴が開いたとしても、この周辺はオデュッセイア海洋高等学校の巡回エリアだから大丈夫じゃ。#n救難信号を送れば、沈む前には助けてくれるはずじゃ。はっはっは！"
10055010-77 = "……それ、冗談だとしても笑えないわ。#n本当に大丈夫なのよね？"
10055010-78 = "サツキ先輩、怖がらなくても大丈夫ですよ！でも怯えてるサツキ先輩の顔もいいですね！記念に1枚、はい、チーズ！"
10055010-88 = "ああ、そうじゃもう一つ……。あまり、遠くへ行き過ぎないようにな。"
10055010-89 = "あの、マコトちゃん……これ本当は危険なんじゃない？"
10055010-90 = "いや、そういう話ではなくてのう。#n……最近、幽霊船が出るっていう噂があるんじゃよ。"
10055010-91 = "ゆっ、幽霊船……！？"
10055010-92 = "わしよりはキミらの方が詳しそうじゃが……知らんのかね？"
10055010-94 = "噂とゴシップなら、万魔殿の書紀であるこの私――元宮チアキにおまかせあれ！#n……聞いたことがあります！"
10055010-95 = "むかーしむかし……海の秘宝を見つけた海賊は、財宝を独り占めすべく船長を追い出しました。"
10055010-96 = "海神の怒りに触れた海賊たちは、今も霧の中をさまよい続けているのだとか……。"
10055010-100 = "……あれ？自分が読んだ時は結構怖かったんですが。"
10055010-101 = "その話、情報部長の私でも初耳だわ。詳しいのねチアキ。"
10055010-102 = "えへへっ、ありがとーございます！"
10055010-104 = "ふむ、議長であるマコト様もだ。#nおい、戦車長――イロハは聞いたことあるか？"
10055010-105 = "え？何ですか……急に。#n私はやりませんよ。"
10055010-106 = "一応、聞いたことあります。"
10055010-107 = "SNSのトレンドでよく回ってくるので。#n知らない人の方が少ないと思いますよ。"
10055010-109 = "なんでそんな噂が出回るのよ……気味悪いわねぇ。"
10055010-110 = "結構、目撃情報があったらしいですよ？"
10055010-111 = "目撃情報？"
10055010-112 = "はい！なんでも、同じ場所、同じ時間で船を見た人がそこそこいるみたいなんです。"
10055010-113 = "本当に……幽霊船なのかもしれませんね。"
10055010-117 = "キミたちも、あの噂を検証しにきたのかい？"
10055010-118 = "あれっ、船長さんは信じてないんですか？"
10055010-119 = "当然じゃ。ここで何年漁師をやってると思っておる。#nそもそも幽霊船が実在するなら、わしがとっくの昔に目撃しておるわい。"
10055010-120 = "例の噂のせいで街中が騒がしくて仕方ない……はぁ。"
10055010-121 = "あちゃ～……それもそうですよね。"
10055010-122 = "昔話なのに、最近になって目撃情報が出るっていうのがそもそもおかしいですし……。"
10055010-123 = "そう考えると、最初に噂の投稿を見てから急激に見るようになった気も……。"
10055010-124 = "なんか流行ってるんですかね？誰かが言い出したから、自分も見たって言ってる人が増えているだけかもしれませんが。"
10055010-125 = "結局ただの嘘ってこと？#nこんな噂を広めて、何の得があるっていうのかしら……。"
10055010-127 = "まぁ、噂はともかく……最近霧が多いのは本当じゃ。#nちょっとでも海の様子がおかしかったらすぐに引き返すんじゃぞ。"
10055010-131 = "海は気まぐれなもの。慎重に事を運ぶにこしたことはない。"
10055010-133 = "キキキッ！この晴天で何を言う。心配することなどない。"
10055010-134 = "マコト先輩、フラグ立てないでください。"
10055010-136 = "お！それじゃあ行くんですね？いい写真がいっぱい撮れそうです！"
10055010-137 = "でも、この船ちょっと小さいわね……くっついて乗らないと。"
10055010-142 = "じゃあイブキは先生のお膝に座るね！"
10055010-146 = "い、イブキぃ！？私の膝も空いているぞ？イブキ～～！？"
10055010-155 = "へぇ、結構いいんじゃない？"
10055010-160 = "たしかに、パワースポットって感じがしますね！#nあ、イロハちゃん、はいチーズ！"
10055010-170 = "勝手に撮らないでください。肖像権の侵害です。"
10055010-171 = "あははっ！記念撮影だってば！せっかくの海なんだから。"
10055010-176 = "……あれ？そういえばマコト先輩がいないですね。"
10055010-177 = "マコトちゃんなら中にいるわ。#n酔っちゃったみたい。"
10055010-178 = "酔うのになんで船旅なんて計画したんだか。"
10055010-179 = "「豪華客船」に惹かれたとか！#nマコト先輩、そういうの好きだし？"
10055010-180 = "はぁ……見栄を張りたいだけのような。"
10055010-181 = "んー……でもなんだか心配だし……私見てこよっかな。#n念のためカメラも持って――"
10055010-182 = "カメラ……？"
10055010-183 = "普段、気合を入れた写真ばかりなので、たまには弱った姿もあるとギャップになっていいかな～と！"
10055010-184 = "ああ、そういう……1枚くらいはあってもいいんじゃないですかね。"
10055010-185 = "[s] \"マコトにも弱いものがあるんだ……。\""
10055010-186 = "マコト先輩は隠してますけどね！あんまり触れないようにしてあげた方がいいですよ！"
10055010-187 = "それではとつげーき！"
10055010-193 = "マコト先輩～失礼しまーす！"
10055010-199 = "ああ、チアキと……先生か。どうかしたのか？"
10055010-200 = "先輩の様子が気になりまして！大丈夫ですか？#nあとお写真お撮りしても？"
10055010-201 = "き、キキッ……ああ、問題ない。"
10055010-202 = "[s] \"大丈夫？無理しないでね。\""
10055010-203 = "キキッこの程度……万魔殿の議長たる者。"
10055010-207 = "いつどこでも堂々と……うっぷ……！"
10055010-208 = "[s1] \"無理して喋るから……。\"\n[s2] \"ゆっくり休んで。\""
10055010-211 = "ああ。先生の厚意に甘えて休むとしよう。"
10055010-217 = "マコト先輩、元気なかったねぇ。"
10055010-218 = "そうですね。いつもあれくらい静かならいいんですが。"
10055010-219 = "イロハちゃん辛辣ぅ！"
10055010-225 = "サツキ先輩！見て！カモメ！"
10055010-226 = "あら、本当ね。船についてきているのかしら。"
10055010-230 = "ふっふーん？"
10055010-231 = "……なんですか急に。"
10055010-232 = "イロハちゃん、なんだか浮かれてる？"
10055010-233 = "なんのことですか？"
10055010-234 = "[s] \"こうやってみんなでお出かけするのっていいよね。\""
10055010-235 = "まあ……悪くはないですね。"
10055010-242 = "……？いま変な音しませんでした？#nプシュー、みたいな。"
10055010-243 = "あれは……ディーゼルエンジンの音ですね。#nでも今のは……。"
10055010-247 = "嫌な予感がします。#n見に行きましょう。"
10055010-255 = "これは……。"
10055010-258 = "エンジンが、止まってしまいました。"
10055010-261 = "[log]漂 流  1 日 目[/log]"
