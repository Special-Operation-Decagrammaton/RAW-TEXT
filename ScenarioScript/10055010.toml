[translation]
10055010-1 = "第1話;浪漫巡航"
10055010-3 = "（天空很晴朗）"
10055010-7 = "（海浪輕輕拍打著沙灘，海風徐徐吹來）"
10055010-8 = "（是最適合出海遊覽的好天氣）"
10055010-11 = "所以呢。"
10055010-12 = "我們租的船在哪裡？"
10055010-13 = "你是叫羽沼真琴的學生吧？"
10055010-14 = "沒錯。本大人正是萬魔殿的最高議長、格黑娜唯一的領導者，#n天上天下唯我獨尊的羽沼真琴大人。"
10055010-15 = "……什麼天上天下的我是不懂，不過這裡有寫哦。#n你看，是用羽沼真琴的名字租的船。"
10055010-16 = ""
10055010-18 = ""
10055010-19 = ""
10055010-20 = ""
10055010-21 = "不對，這怎麼可能！"
10055010-24 = "這種小破船！！"
10055010-25 = "這艘快要沉沒的破船！"
10055010-26 = "竟然是我們萬魔殿要搭著旅行的郵輪！？"
10055010-29 = "伊呂波！這是怎麼回事！？"
10055010-30 = ""
10055010-32 = ""
10055010-33 = "什麼怎麼回事……說有更好的契約而拒絕了我找的船的人，不就是真琴前輩你嗎？"
10055010-34 = "不，話是沒錯……雖然我也覺得好像太便宜了……"
10055010-35 = "唔！難道是風紀委員會的傢伙連這一步都算到了，所以才設下這麼卑鄙的陷阱！？"
10055010-36 = "唉……怎麼可能。差不多該面對現實了吧。"
10055010-37 = "也就是說，原本打算包下大型客輪，#n結果看到便宜的價格就昏了頭，誤租了這艘小漁船是吧。"
10055010-38 = "……整理一下反而覺得更誇張了。這種事怎麼會搞錯？"
10055010-39 = "哎！這點小事不算什麼！"
10055010-41 = "嗯？出了什麼問題嗎？#n為了以防萬一，我還事先寄了照片過去呢……"
10055010-43 = "……他是這麼說的哦？"
10055010-44 = "身為萬魔殿議長的本大人，怎麼可能閒到一一確認所有聯絡！"
10055010-45 = "哇。理直氣壯的程度真是令人目瞪口呆。"
10055010-47 = "所以，今天的旅行要取消了嗎？"
10055010-48 = "那當然！用這種又小又破的船去郵輪旅行成何體統！只會招來世人的嘲笑而已！"
10055010-49 = ""
10055010-51 = ""
10055010-53 = "旅行……取消……？"
10055010-54 = "那個，今天不能去旅行了嗎？"
10055010-55 = "是因為伊吹嗎？因為伊吹是壞孩子，所以不能去嗎？"
10055010-56 = "嗚哇啊啊～！？"
10055010-57 = "不，不是這樣的！伊吹！船只要能浮在水上就好！大小根本無所謂！"
10055010-58 = "這種船也能航行到海的盡頭！你說是吧，老師！？"
10055010-59 = ""
10055010-63 = "[ns] 「沒錯！！！」"
10055010-64 = "……唉。真拿你們沒辦法。"
10055010-65 = "真琴前輩就算了，總不能讓伊吹失望。"
10055010-67 = "啊哈哈～真琴前輩跟伊呂波醬不管再怎麼爭論，在伊吹醬面前都毫無招架之力呢！"
10055010-68 = "哼嗯～？我倒是不怎麼介意，不過跟我想的有點不一樣呢。"
10055010-70 = "嗯？看來總算是解決了。"
10055010-71 = "雖然外表如此但不用擔心。這傢伙可是撐了30年呢。"
10055010-72 = "而且萬一船破了個洞，這附近是奧德賽海洋高中的巡邏區域，#n只要發出求救訊號，在沉下去之前就會有人趕到的，哈哈哈！"
10055010-73 = ""
10055010-76 = ""
10055010-77 = "……這玩笑一點也不好笑。那是玩笑吧？"
10055010-78 = "啊啊！不要嚇我們皐月前輩啦！不過，受到驚嚇的皐月前輩表情也很讚！#n要不要拍一張當紀念呢！"
10055010-79 = ""
10055010-81 = ""
10055010-84 = ""
10055010-86 = ""
10055010-88 = "啊，還有一件事。別出海太遠。"
10055010-89 = "真的很危險嗎！？"
10055010-90 = "不，不是那個問題……最近有幽靈船之類的奇怪傳聞。"
10055010-91 = "幽，幽靈船……！？"
10055010-92 = "學生們應該比我更清楚才對……你們不知道嗎？"
10055010-94 = "有～！說到傳聞和八卦，就少不了我萬魔殿的書記元宮千秋！我有聽說過！"
10055010-95 = "很久很久以前～找到大海寶藏的海盜們，為了獨占寶藏而把船長趕走了～"
10055010-96 = "結果因此受到大海的詛咒，被困在不會消散的海霧之中，永遠在海上漂流……"
10055010-97 = ""
10055010-99 = ""
10055010-100 = "咦？看文字的時候感覺挺可怕的，實際說出口反而有點空虛呢。"
10055010-101 = "哎呀，你知道得真清楚呢，千秋。#n連身為萬魔殿情報部長的我都是第一次聽說。我就誇誇你吧。"
10055010-102 = "謝～謝誇獎～！"
10055010-104 = "嗯，身為萬魔殿議長的本大人也沒聽說過。萬魔殿的……伊呂波聽說過嗎？"
10055010-105 = "……呃，怎麼了？為什麼用那麼期待的眼神……我可不會做哦？"
10055010-106 = "姑且是有聽說過啦。"
10055010-107 = "雖然沒有特地去查，不過常常出現在社群的熱門話題。#n在格黑娜不知道的人應該才是少數吧？"
10055010-109 = "為什麼偏偏現在流行那種傳聞？真讓人不舒服……"
10055010-110 = "啊～那個啊～其實，最近開始有人貼出「目擊經歷」了。"
10055010-111 = "目擊經歷？"
10055010-112 = "對，有好幾篇文章，是完全不同的人聲稱在同一地點、同一時間看到的。"
10055010-113 = "簡直就像……真的出現過一樣。"
10055010-114 = ""
10055010-116 = ""
10055010-117 = "不會吧，連你們學生也是相信那種謠言才來的？"
10055010-118 = "咦？船長先生覺得那是騙人的嗎？"
10055010-119 = "當然。我在這裡當了多少年漁夫了。#n要是這附近真有那種東西，我豈不是老早就該找到了嗎？"
10055010-120 = "因為那件事的關係，搞得鎮上鬧哄哄的！"
10055010-121 = "哎呀呀～說得也是呢～"
10055010-122 = "仔細想想，明明說是很久以前就有的傳說，#n結果到現在才突然有人聲稱「看到了」的確有點奇怪……"
10055010-123 = "而且傳聞本身也是在有人聲稱「看到了」之後，才如雨後春筍般冒出來的……"
10055010-124 = "八成是搭上流行的順風車，大家都跟著說「看到了」的那種老套怪談吧？"
10055010-125 = "什麼嘛，所以講白了就是騙人的嘛。#n我得查出究竟是誰在散播那麼可怕的傳聞，好好教訓一頓他才行！"
10055010-127 = "那個謠言姑且不論，最近確實經常起海霧。#n只要覺得天氣不太對勁，一定要馬上回來。"
10055010-128 = ""
10055010-130 = ""
10055010-131 = "大海是很善變的，再怎麼小心也不為過。"
10055010-133 = "嘻嘻！真是杞人憂天。天氣這麼晴朗，能有什麼問題？"
10055010-134 = "請不要隨便立旗好嗎，真琴前輩。"
10055010-136 = "哎呀～結果還是要硬著頭皮出發啊！#n真不錯！感覺能拍到一大堆好照片呢！"
10055010-137 = "船確實有點小呢。說不定得擠一擠了。"
10055010-138 = ""
10055010-141 = ""
10055010-142 = "那伊吹要坐在老師的腿上！"
10055010-143 = ""
10055010-145 = ""
10055010-146 = "伊，伊吹！？我的腿上也是空著的哦！？伊吹～！？"
10055010-154 = ""
10055010-155 = "哼嗯～這不是挺不錯的嗎？"
10055010-156 = ""
10055010-158 = ""
10055010-160 = "確實很有療癒的感覺呢！啊，伊呂波醬！看這邊笑一個！"
10055010-161 = ""
10055010-163 = ""
10055010-166 = ""
10055010-168 = ""
10055010-170 = "什麼啦，請不要擅自拍照。這是在侵犯肖像權。"
10055010-171 = "啊哈哈！就當是做個紀念嘛！難得能到海邊來啊！"
10055010-172 = ""
10055010-174 = ""
10055010-175 = ""
10055010-176 = "……咦，好像從剛才開始就沒看到真琴前輩了耶？"
10055010-177 = "啊，真琴醬因為暈船在裡面休息。"
10055010-178 = "真搞不懂為什麼會暈船的人要計畫郵輪旅行。"
10055010-179 = "大概是迷上「豪華郵輪」這個詞了吧？#n說到真琴前輩就會想到那股行動力，果然很帥氣呢！啊哈哈！"
10055010-180 = "品味還真怪……"
10055010-181 = "唔嗯……不過還是有點擔心呢。#n我去看看情況！可以的話順便拍個照！"
10055010-182 = "拍照？"
10055010-183 = "真琴前輩在週刊萬魔殿裡總是展現帥氣的一面，#n要是讓大家看到他暈船受苦的虛弱模樣，不就能營造出反差感了嗎！"
10055010-184 = "哦，那種照片的話，我也想要一張呢。"
10055010-185 = "[s] 「品味還真怪……」"
10055010-186 = "哦哦！伊呂波醬居然會主動要真琴前輩的照片！#n這也是很難得的事呢！大海果然能讓人獲得新鮮的體驗！"
10055010-187 = "那麼，大家一起去看看吧！啊，當然不能太吵鬧就是了。"
10055010-192 = ""
10055010-193 = "那個，真琴前輩～打擾了～"
10055010-194 = ""
10055010-196 = ""
10055010-198 = ""
10055010-199 = "啊啊，是千秋跟……老師嗎。有什麼事？"
10055010-200 = "聽說前輩在暈船就來看看你……啊，請問可以拍照嗎？"
10055010-201 = "嘻，嘻嘻……笑一個。"
10055010-202 = "[s] 「啊，還真的配合了。」"
10055010-203 = "當然……身為萬魔殿的議長。"
10055010-204 = ""
10055010-206 = ""
10055010-207 = "無論何時何地都必須抬頭挺胸……嗚噗……！"
10055010-208 = "[s1] 「都是因為你硬要說話……」\n[s2] 「別勉強了，好好休息吧。」"
10055010-211 = "啊啊，那就接受老師的好意，稍微休息一下吧。"
10055010-212 = ""
10055010-214 = ""
10055010-216 = ""
10055010-217 = "哎呀，真沒想到會看到真琴前輩那副模樣呢～"
10055010-218 = "就是說啊。真希望他平常也能那麼安分。"
10055010-219 = "伊呂波醬，好毒舌～"
10055010-220 = ""
10055010-225 = "皐月前輩！你看那邊！海鷗！"
10055010-226 = "哎呀，真的耶。是在跟著船飛嗎？"
10055010-229 = ""
10055010-230 = "哼哼～"
10055010-231 = "……突然怎麼了。"
10055010-232 = "伊呂波醬～你的嘴角上揚了哦～"
10055010-233 = "是你看錯了吧。"
10055010-234 = "[s] 「不過像這樣出來玩還是很不錯吧？」"
10055010-235 = "嗯……是不壞啦。"
10055010-236 = ""
10055010-241 = ""
10055010-242 = "……剛才是不是有奇怪的聲音？#n類似「噗咻～」這種感覺。"
10055010-243 = "對，我也聽到了。是柴油引擎的聲音。不過剛才的聲音……"
10055010-244 = ""
10055010-246 = ""
10055010-247 = "我有不好的預感。去確認一下吧。"
10055010-248 = ""
10055010-255 = "那個……"
10055010-258 = "引擎好像停了耶？"
