[translation]
10055010-1 = "#title;제1화;로맨틱 크루징"
10055010-3 = "#na;(하늘이 맑다.)"
10055010-7 = "#na;(해변에는 파도가 잔잔히 일고, 바닷바람이 살랑거리며 불어온다.)"
10055010-8 = "#na;(바다를 유람하기에는 더할 나위 없이 멋진 날씨다.)"
10055010-11 = "3;마코토;99;그래서.\n#3;em;[...]\n#3;a"
10055010-12 = "3;마코토;02;우리가 빌린 배가 어디 있다고 했지?"
10055010-13 = "1;어부;00;학생 이름이 하누마 마코토 아닌가?\n#1;ar\n#3;m5"
10055010-14 = "3;마코토;03;그렇다. 바로 이 몸이 만마전의 최고 의장이자, 게헨나의 유일한 지도자, 천상천하 유아독존, 하누마 마코토 님이시다."
10055010-15 = "1;어부;00;……천상천하 어쩌고는 모르겠지만, 여기 나와 있잖나. 자, 하누마 마코토 이름으로 배를 빌린다고.\n#1;greeting"
10055010-16 = "#st;[0,0];instant;1;"
10055010-18 = "1;어부;00\n3;마코토;01\n#3;greeting\n#3;h\n#1;h\n#wait;1200"
10055010-19 = "1;어부;00\n3;마코토;02\n#3;em;[?]\n#3;h\n#1;h\n#wait;1200"
10055010-20 = "1;어부;00\n3;마코토;24\n#3;em;[?!]\n#3;shake\n#3;h\n#1;h\n#wait;1200"
10055010-21 = "3;마코토;11;아니, 그럴 리가 없지 않나!\n#3;stiff"
10055010-24 = "#zmc;instant;-620,-444;1896\n#na;마코토;이런 통통배가!!"
10055010-25 = "#zmc;instant;-620,-444;1500\n#na;마코토;침몰하기 직전의 고물선이!\n#fontsize;80"
10055010-26 = "#zmc;instant;-620,-444;1200\n#na;마코토;우리 만마전이 타고 여행할 크루즈라고?!\n#bgshake\n#fontsize;100"
10055010-29 = "3;마코토;11;이로하! 이게 어떻게 된 거지?!\n#3;em;[?!]\n#3;shake\n#3;a\n#fontsize;80"
10055010-30 = "#st;[0,0];instant;1;"
10055010-32 = "3;이로하;06\n#3;em;[한숨]\n#3;h\n#wait;1200"
10055010-33 = "3;이로하;02;어떻게 되시고 자시고 간에…… 더 좋은 계약이 있다면서 제가 알아 온 배를 마다한 게 바로 마코토 선배잖아요."
10055010-34 = "3;마코토;22;아니, 그건 맞지만…… 어쩐지 너무 싸다고 생각은 했지만…….\n#3;stiff"
10055010-35 = "3;마코토;24;허억! 설마, 선도부 놈들! 이것까지 계산하고, 비열한 함정을?!\n#3;em;[?!]\n#3;shake"
10055010-36 = "5;이로하;06;하아…… 그럴 리 없잖아요. 슬슬 현실을 보자고요.\n#5;em;[속상함]\n#5;al\n#3;m1"
10055010-37 = "5;이로하;01;결국, 원래는 대형 여객선을 대절하려는 계획이었지만, 싼 가격을 보고 눈이 돌아가서 착각하고 이 조그만 어선을 빌렸다는 거네요."
10055010-38 = "5;이로하;05;……정리해 보니 더 장난 아닌데요. 어떻게 그걸 착각할 수 있죠?"
10055010-39 = "3;마코토;19;에에잇! 사소한 문제다!\n#3;em;[땀]"
10055010-41 = "3;어부;00;응? 뭔가 잘못됐나? 혹시나 싶어서 사진도 미리 보내줬는데…….\n#3;em;[?]"
10055010-43 = "1;마코토;22\n5;이로하;02;……라고 하시는데요?"
10055010-44 = "1;마코토;11;만마전 의장이신 이 몸이 모든 연락을 일일이 확인할 만큼 한가할 리 없지 않나!\n#1;hophop"
10055010-45 = "5;이로하;01;우와. 보는 쪽이 질릴 만큼 당당하네요."
10055010-47 = "3;사츠키;15;그럼, 오늘 여행은 취소려나?"
10055010-48 = "3;마코토;18;당연하다! 이렇게 작고 낡은 배로 크루즈 여행이라니, 언어도단! 오히려 세간의 비웃음만 살 것이 뻔하지 않나!\n#3;closeup\n#fontsize;80"
10055010-49 = "#st;[0,0];instant;1;"
10055010-51 = "3;마코토;18\n#3;closeup\n#3;d\n#wait;1200"
10055010-53 = "3;이부키;02;여행…… 취소……?\n#3;em;…\n#3;a"
10055010-54 = "3;이부키;11;저기, 오늘 여행 못 가?\n#3;stiff"
10055010-55 = "3;이부키;12;혹시 이부키 때문이야? 이부키가 나쁜 아이라서 못 가는 거야?\n#3;em;[속상함]"
10055010-56 = "3;마코토;11;우와아앗-?!\n#3;em;[?!]\n#3;shake\n#fontsize;80"
10055010-57 = "3;마코토;22;그, 그렇지 않다! 이부키! 배는 물에 뜨기만 하면 그만! 크든 작든 상관없다!\n#3;stiff"
10055010-58 = "3;마코토;10;이런 배라면 바다 끝까지도 갈 수 있다! 그렇지 않나, 선생이여?!\n#3;em;[반짝]"
10055010-59 = "#st;[0,0];instant;1;"
10055010-63 = "[ns] \"그렇다!!!\""
10055010-64 = "3;이로하;99;……하아. 어쩔 수 없네요.\n#3;em;[속상함]"
10055010-65 = "3;이로하;05;마코토 선배라면 몰라도, 이부키를 실망시킬 수는 없으니까."
10055010-67 = "4;사츠키;01\n2;치아키;12;아하하~ 역시 마코토 선배도, 이로하 쨩도, 서로 아무리 티격태격해도 이부키 쨩 앞에서는 무력하네요!\n#2;em;[음표]\n#2;hophop"
10055010-68 = "4;사츠키;00;흐응~? 나는 어느 쪽도 괜찮지만, 생각한 거랑 약간 다르긴 하네."
10055010-70 = "3;어부;00;음? 어찌어찌 잘 해결된 모양이군.\n#3;em;[반응]"
10055010-71 = "3;어부;00;뭐, 이렇게 생겼어도 걱정하지 말라고. 30년은 버텨준 녀석이니까."
10055010-72 = "3;어부;00;그리고 만에 하나 배에 구멍이 난다 해도, 이 근방은 오디세이아 해양학원 순찰 구역이니까 구조 신호를 보내면 가라앉기 전에 도착할 거야, 하하하!\n#3;em;[재잘]\n#3;hophop"
10055010-73 = "#st;[0,0];instant;1;"
10055010-76 = "4;사츠키;04\n2;치아키;02\n#2;em;…\n#4;em;…\n#2;h\n#4;h\n#wait;2500"
10055010-77 = "4;사츠키;14;……웃기 힘든 농담인데. 그거, 농담 맞지?\n#4;stiff"
10055010-78 = "2;치아키;10;아앗! 저희 사츠키 선배를 겁주지 마세요! 하지만, 겁먹은 사츠키 선배의 얼굴도 나이스! 기념으로 한 컷 찍어둘까요!\n#2;hophop"
10055010-79 = "#st;[0,0];instant;1;"
10055010-81 = "4;사츠키;14\n2;치아키;06\n#2;dl\n#2;h\n#4;h\n#wait;1200"
