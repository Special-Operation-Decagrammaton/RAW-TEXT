10055010-193 = "Makoto? Excuse us!"
10055010-194 = ""
10055010-196 = ""
10055010-198 = ""
10055010-199 = "Ah, Chiaki...and Sensei. What are you doing here?"
10055010-200 = "We wanted to see if you were feeling better at all! ...And I wanted to take a picture of you!"
10055010-201 = "K-Kiheh... Cheese."
10055010-202 = "[s] \"Wow, she's doing it.\""
10055010-203 = "Naturally... As Chairman of the Pandemonium Society..."
10055010-204 = ""
