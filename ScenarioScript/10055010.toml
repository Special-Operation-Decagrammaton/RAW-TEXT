10055010-86 = "3;사츠키;16\n#3;h"
10055010-88 = "3;어부;00;아, 그리고 또 하나. 너무 먼 바다까지 나가지 말게.\n#3;em;[반응]"
10055010-89 = "3;사츠키;04;정말로 위험한 거야?!\n#3;em;[?!]\n#3;shake"
10055010-90 = "5;어부;00;아니, 그런 문제는 아니고…… 요즘 유령선이니 어쩌니 하는 이상한 소문이 도는데.\n#5;al\n#3;m1"
10055010-91 = "3;사츠키;06;유, 유령선……?!\n#3;em;[땀]"
10055010-92 = "5;어부;00;나보다는 학생들이 잘 알 거 같은데, 혹시 모르나?"
10055010-94 = "3;치아키;12;네엣~! 소문과 가십이라 하면 빼놓을 수 없는 만마전의 서기, 저 모토미야 치아키! 들어본 적 있습니다!\n#3;em;[음표]\n#3;jump"
10055010-95 = "3;치아키;99;옛날 옛적 아주 먼 옛날~ 바다의 보물을 찾은 해적들이, 이를 독차지하기 위해 선장을 내쫓았는데~\n#3;m2"
10055010-96 = "3;치아키;13;바다의 저주를 받아 영원히 사라지지 않는 물안개 속에 갇혀 바다를 떠돌게 되었다는……."
10055010-97 = "#st;[0,0];instant;1;"
10055010-99 = "3;치아키;02\n#3;em;[?]\n#3;h\n#wait;1000"
10055010-100 = "3;치아키;00;어라? 글로 볼 때는 좀 더 오싹한 느낌이었는데, 막상 말로 하니까 좀 허무하네요."
10055010-101 = "5;사츠키;01;어머, 자세히 알고 있네, 치아키. 만마전의 정보부장인 나도 처음 듣는 소문인데. 칭찬해 줄게.\n#5;em;…\n#5;al\n#3;m1"
10055010-102 = "3;치아키;03;감~사합니닷~!\n#3;em;[재잘]\n#3;hophop"
10055010-104 = "3;마코토;99;음, 만마전의 의장인 이 몸도 들어본 적 없다. 만마전의…… 이로하는 들어봤나?"
10055010-105 = "3;이로하;00;……어, 뭔가요? 뭘 그리 기대하는 눈으로…… 저는 안 할 거거든요?\n#3;em;[?]"
10055010-106 = "3;이로하;99;일단, 들어보긴 했네요."
10055010-107 = "3;이로하;02;따로 찾아본 건 아니고, SNS 트렌드로 자꾸 올라와서요. 아마 게헨나에서는 모르는 사람이 더 드물지 않을까요?"
10055010-109 = "1;치아키;00\n5;사츠키;14;왜 하필 지금 그런 이야기가 유행하는 거야? 기분 나쁘게…….\n#5;em;[속상함]"
10055010-110 = "1;치아키;02;아~ 그게 말이죠~ 실은, 최근에 '목격담'이 올라오기 시작했거든요."
10055010-111 = "5;사츠키;15;목격담?"
10055010-112 = "1;치아키;99;네, 전혀 다른 사람들이 같은 장소, 같은 시간에 보았다고 주장하는 글들이 올라왔거든요.\n#1;em;…\n#1;m3\n#5;dr"
10055010-113 = "1;치아키;05;꼭…… 나타나기라도 한 것처럼요.\n#1;stiff"
10055010-114 = "#st;[0,0];instant;1;"
10055010-116 = "#1;hide\n#5;hide\n3;어부;00\n#3;em;[한숨]\n#3;h\n#wait;1000"
10055010-117 = "3;어부;00;설마, 학생들까지 그 헛소문을 믿고 온 건가?"
10055010-118 = "3;치아키;02;어라? 선장님께서는 거짓말이라 생각하시나요?\n#3;em;[?]"
10055010-119 = "3;어부;00;당연하지. 내가 여기서 어부 생활을 몇 년을 했는데. 이 근처에 그런 게 있다면, 진작에 내가 찾았겠지, 안 그래?"
10055010-120 = "3;어부;00;안 그래도 그것 때문에 마을이 어찌나 소란스러워졌는지!\n#3;em;[속상함]\n#3;stiff"
10055010-121 = "3;치아키;04;아차차~ 그것도 그렇네요~\n#3;em;[땀]"
10055010-122 = "3;치아키;02;생각해 보면, 오래전부터 있었다면서 이제 와서 갑자기 '보았다'고 주장하는 것도 좀 이상하고……."
10055010-123 = "3;치아키;99;소문 자체도 누군가 '봤다'고 주장한 이후로 우후죽순으로 올라왔으니까……."
10055010-124 = "3;치아키;01;결국, 유행에 편승해, 너도나도 '봤다'고 주장하는 그런 뻔한 느낌의 괴담이려나요?"
10055010-125 = "5;사츠키;05;뭐야, 그러니까 결국 거짓말이란 거잖아. 누가 그런 무서운 소문을 퍼트리는 거야. 조사해서 혼내줘야겠어!\n#5;em;[빠직]\n#5;al\n#3;m1"
10055010-127 = "3;어부;00;여튼간에, 그 헛소문은 어쨌건, 요즘 물안개가 자주 끼긴 하지. 조금이라도 날씨가 이상하다 싶으면 바로 돌아오도록 해.\n#3;em;[한숨]"
10055010-128 = "#st;[0,0];instant;1;"
10055010-130 = "3;어부;00\n#3;greeting\n#3;h\n#wait;1200"
10055010-131 = "3;어부;00;바다는 변덕스러우니까, 아무리 조심해도 나쁠 건 없어.\n#3;m2"
10055010-133 = "3;마코토;03;키키킷! 괜한 걱정이군. 이렇게 날이 맑은데, 무슨 문제가 있을까?\n#3;em;[재잘]"
10055010-134 = "3;이로하;06;괜한 복선 깔지 말아주세요, 마코토 선배.\n#3;stiff"
10055010-136 = "5;사츠키;01\n1;치아키;03;이야~ 결국 강행인가요! 좋네요! 멋진 사진이 잔뜩 찍힐 거 같아요!\n#1;em;[음표]\n#1;hophop"
10055010-137 = "5;사츠키;00;배가 작긴 하네. 나란히 붙어 앉아야 할지도."
10055010-138 = "#st;[0,0];instant;1;"
10055010-141 = "3;이부키;01\n#3;a\n#3;closeup\n#wait;1000"
10055010-142 = "3;이부키;03;그러면 이부키는 선생님 무릎에 앉을래!\n#3;em;[반짝]\n#3;closeup\n#fontsize;80"
