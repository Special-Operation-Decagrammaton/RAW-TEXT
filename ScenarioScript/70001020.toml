[translation]
70001020-1 = "테르마이 아카이 2"
70001020-3 = "그러니까 너희들이……"
70001020-4 = "붉은겨울 학원에서 왔다는 그 목욕 조사관인가 뭔가 하는 특사인가……?"
70001020-9 = "네. 체리노 회장의 특명을 받고 게헨나 학원의 목욕 시설을 견학하러 온 붉은겨울 연방학원의 아마미 노도카라고 합니다."
70001020-10 = "온천과 목욕탕으로 유명한 게헨나의 목욕 시설을 직접 체험해 볼 수 있다니 감회가 새롭네요."
70001020-11 = "오늘은 모쪼록 잘 부탁드리겠습니다."
70001020-13 = "하아…… 마코토 의장이 지난번에 붉은겨울 학원을 다녀온 뒤로 무언가 귀찮은 일이 생길 거라고 예상하긴 했었지만……"
70001020-14 = "정말 시키지도 않은 귀찮은 일을 물고 온다니까."
70001020-16 = "혹시…… 무언가 문제라도?"
70001020-18 = "아니야. 목욕 시설이야, 마음대로 보고 가도록 해."
70001020-19 = "게헨나의 기숙사는 기본적으로 방임주의라, 특별히 공을 들여 관리하고 있지도 않거든."
70001020-21 = "하지만 그런 것 치고는 시설이 꽤나 깨끗하게 정비되어 있는걸요."
70001020-26 = "그러게. 이곳에 있는 타월이나 목욕용품도 꽤나 비싼 고급품이야."
70001020-28 = "아, 그건 말이지……"
70001020-29 = "온천개발부가 멋대로 설치하고 간 거야."
70001020-31 = "네……? 멋대로요……?"
70001020-33 = "응, 원래는 탕도 중앙에 설치된 커다란 온탕밖에 없었고, 목욕용품도 싸구려 오이 향 비누밖에 없었는데……"
70001020-34 = "온천개발부가 게헨나 학원의 온천 시설이 이런 식으로 방치되는 걸 용납할 수 없다면서, 주기적으로 시설을 보수하고 있어."
70001020-41 = "(온천개발부의 도움을 받고 있었을 줄이야…… 이건 조금 맹점이네요.)"
70001020-52 = "목욕물에서도 뭔가 좋은 향이 나는 것 같은데…… 이것도 온천개발부가 입욕제 같은 걸 풀어놓은 건가?"
70001020-54 = "아니, 그건 처음부터 이곳의 물에 섞여 있는 자연 성분이야."
70001020-55 = "힌놈 화산을 타고 내려온 지하수가 자연적으로 유황 성분을 띄기 때문에, 그냥 물을 끌어 다 쓰기만 해도 게헨나 곳곳에서는 쉽게 온천욕을 즐길 수 있지."
70001020-56 = "게헨나 자치구에서만 즐길 수 있는 몇 안 되는 좋은 점 중 하나라고."
70001020-66 = "(지하수의 수질이 근본적으로 다른 것도 고려해야 할 요인이고……)"
70001020-70 = "……우선은 탕에 직접 들어가 물의 상태를 한 번 봐도 괜찮을까요?"
70001020-72 = "물론이야. 편하게 살펴봐."
70001020-74 = "어디……"
70001020-81 = "앗, 뜨거워!"
70001020-82 = "도, 도대체 뭔가요. 이 뜨거운 탕은?!"
70001020-84 = "응? 이 탕이 그렇게 뜨거운가? 70도밖에 안 되는데……"
70001020-86 = "70도면 열탕이 아니라 거의 샤브샤브용 전골에 가깝잖아요!"
70001020-87 = "이런 온도에서 목욕을 했다가는 화상을 입고 말 거예요!"
70001020-89 = "이상하네. 게헨나 기숙사의 학생들은 이 정도 온도가 몸을 지지기에 딱 좋다고 해서 일부러 데워 둔 건데……"
70001020-91 = "게헨나의 학생들이라면 모르겠지만, 붉은겨울 학원에서 쓰는 건 어렵겠어요."
70001020-92 = "이보다 온도가 낮은 탕은 따로 없나요?"
70001020-98 = "냉탕은 이쪽이야."
70001020-100 = "어디……"
70001020-107 = "앗, 차가워!!"
70001020-108 = "냉탕은 또 왜 이렇게 얼음장처럼 차가운 건가요!"
70001020-110 = "우와, 겨울에 강의 얼음을 깨고 목욕을 하던 때가 떠오르는 걸……"
70001020-112 = "왜, 온도 차가 큰 탕을 오가며 목욕을 하면 피부가 자극이 되어서 미용에 좋다고들 하잖아?"
70001020-113 = "게헨나에는 그런 강렬한 자극을 좋아하는 학생들이 많아서 일부러 온도 차를 크게 설정했는데……"
70001020-114 = "역시 붉은겨울의 학생들에게 이 온도는 조금 가혹했나 보네."
70001020-116 = "붉은겨울 학원뿐만 아니라, 대부분의 학생들에게 가혹하다고요!"
70001020-117 = "게다가 온천개발부의 도움 없이 이 정도의 환경을 붉은겨울 학원 내에서 재현하는 건 어려울 것 같으니……"
70001020-118 = "역시 다른 학원의 목욕 시설을 찾아보는 게 좋겠어요!"
70001020-120 = "<불합격>"
70001020-124 = "트리니티 종합학원에 어서 오세요, 붉은겨울 학원의 특사 여러분."
70001020-125 = "오시기 전에 다른 학생들로부터 이미 이야기는 전해 들었습니다."
70001020-126 = "……게헨나 학원의 기숙사를 방문했다가 불쾌한 경험을 하셨다지요."
70001020-127 = "아, 아뇨…… 조금 놀라긴 했지만 불쾌할 정도까지는……"
70001020-128 = "아니요. 소속 학생들조차 제대로 관리하지 못하는 그 추레한 기숙사에서 손님 대접을 제대로 했을 거라고 생각할 수가 없습니다."
70001020-129 = "우선 이곳에서 차와 다과를 즐겨주시길. 대욕탕이 정리되는 대로 금방 안내해 드리겠습니다."
70001020-134 = "우, 우와…… 뭔가 비싸 보이는 홍차와 다과가 나왔어."
70001020-135 = "이거, 견학이 끝난 뒤에 조금 싸갈 수 있으려나……?"
70001020-140 = "나도 차에 조예가 깊은 건 아니지만, 풍미가 진한 것이 꽤 비싼 홍차인 모양인데."
70001020-141 = "이럴 줄 알았다면 직접 담근 월귤 잼을 같이 가져올 걸 그랬네."
70001020-142 = "처음부터 이렇게 후한 환대를 받다니, 어쩐지 좋은 인상이 드는 걸……"
70001020-151 = "오래 기다리셨습니다. 욕탕의 정리가 끝났으니, 바로 안내를 시작하겠습니다."
70001020-154 = "으음…… 좋은 냄새……"
70001020-155 = "뭔가 탕에서 은은하게 홍차 향이 나는 것 같네요."
70001020-160 = "감이 예리하시네요."
70001020-161 = "저희 트리니티 공용 기숙사에서는 음료뿐만 아니라, 목욕물에도 찻잎을 넣어 제공하고 있습니다."
70001020-162 = "이렇게 하면 좀 더 특별한 기분으로 목욕을 즐길 수 있을뿐더러, 찻잎에 포함된 좋은 성분을 피부로 흡수할 수 있어 건강에도 도움이 되지요."
70001020-163 = "목욕물의 온도는…… 어디 보자……"
70001020-170 = "으음, 이만하면 목욕을 즐기기에 딱 좋은 온도네요!"
70001020-171 = "차를 우리는 것과 마찬가지로 목욕을 즐기는 데에도 최적의 온도가 존재하는 법."
70001020-172 = "트리니티의 세련된 목욕 시설은 정취도 모르고 무작정 끓는 물을 들이붓는 어딘가의 바보들과는 다르지요."
70001020-173 = "과연……"
70001020-174 = "어떠신가요. 붉은겨울 학원에서도 저희 트리니티 학원에서 사용하는 것과 같은 목욕 시설을 들여놓으심이……?"
70001020-175 = "이만하면 붉은겨울 학원의 학생들도 좋아할 것 같은데……"
70001020-176 = "어때? 시구레 쨩은 어떻게 생각해?"
70001020-182 = "으음, 좋은 분위기에 초를 치는 것 같아서 미안하긴 한데……"
70001020-183 = "혹시 이 목욕 시설을 유지하는 데 드는 비용은 얼마 정도야?"
70001020-185 = "시설의 유지 비용 말씀이신가요. 그렇게 비싸지는 않습니다만……"
70001020-186 = "최고급 본차이나로 미장된 바닥재의 청소 비용부터 탕에 들어가는 찻잎의 비용까지 더하면……"
70001020-190 = "최소한 한 달에 100만엔 정도는 들지 않을까요?"
70001020-192 = "네?! 그렇게나 비싼가요?"
70001020-194 = "비싸다니요? 욕탕에 넣는 차만 하더라도, 한 통에 1만엔 밖에 하지 않는 저렴한 물건인걸요."
70001020-195 = "평상시에 마시는 차의 비용에 비하면 형편없을 정도의 싸구려 찻잎이라고 생각합니다만……"
70001020-197 = "한통에 1만 엔이 넘는 찻잎이…… 형편없는 싸구려라니……"
70001020-202 = "역시 트리니티의 부르주아들과는 함께 할 수 없겠어요!"
70001020-204 = "<불합격>"
70001020-208 = "정말이지…… 트리니티나 게헨나처럼 유서 깊은 학원의 목욕 시설 운영이 이토록 엉망일 거라고는 생각지도 못했어."
70001020-209 = "다른 학원에서 저런 방만한 운영을 했다가는 한 달도 지나지 않아 파산하고 말 거야!"
70001020-210 = "하지만 트리니티 학원에서는 마지막에 조금 말이 과하지 않았어?"
70001020-211 = "계약을 하지 않더라도 좋게 이야기를 마무리했더라면, 선물로 비싼 다과를 받을 수 있었을지도 모르는데……"
70001020-212 = "그, 그런 부르주아들의 간식에는 처음부터 관심 없었거든?"
70001020-213 = "붉은겨울 학원의 특사로 나온 이상, 사소한 일에 일희일비하지 않고 학원의 교풍에 부끄럽지 않도록 항상 당당한 자세를 보여야 해!"
70001020-214 = "우리 학원에 부끄럽지 않은 교풍 같은 게 있었는지는 의문스럽지만……"
70001020-218 = "그보다 백귀야행 학원에서는 음양부에서 마중을 나오기로 했던 것 같은데, 아무도 안 보이네……"
70001020-219 = "혹시 장소를 착각한 걸까?"
70001020-220 = "저기, 아무도 안 계신가요……?"
70001020-225 = "……응? 누구지? 백귀야행 학원의 학생은 아닌 것 같은데."
70001020-226 = "외, 외부에서 방문하신 손님이실까요……?"
70001020-227 = "아, 다행이다. 장소를 착각한 줄 알고 걱정하고 있었어요."
70001020-228 = "저희는 붉은겨울 학원에서 왔습니다만, 이곳의 시설을 견학해 보고 싶어서……"
70001020-239 = "견학……?"
70001020-240 = "츠쿠요, 설마…… 우리가 채널에 새로 올린 <무료 닌자 체험 이벤트> 게시글을 보고 찾아온 손님인 걸까……?"
70001020-241 = "하, 하지만…… 그 게시글은 댓글은커녕 조회수도 10회가 넘지 않았는걸요……?"
70001020-242 = "그래도 이 두 사람이 그 10명 중에 하나일지도 모르잖아?"
70001020-243 = "그동안 백귀야행 학원 외에 닌자에 관심이 있는 학원은 거의 없다고 생각했었는데……"
70001020-247 = "……이건 <소녀인법첩 미치룻치>를 글로벌한 채널로 성장시킬 기회일지도!"
70001020-252 = "잘 왔어. 안 그래도 이곳에서 계속 기다리고 있었어."
70001020-253 = "다들 백귀야행 학원에 어서 와!"
70001020-254 = "후후, 따듯하게 환대해 주셔서 감사합니다."
70001020-255 = "그럼 무엇부터 먼저 체험해 볼래? 수리검 던지기? 아니면 죽순 뛰어넘기?"
70001020-256 = "……수리검 던지기? ……죽순 뛰어넘기?"
70001020-257 = "그런 방식의 목욕법은 처음 듣는 것 같은데요……"
70001020-258 = "목욕……?"
70001020-259 = "네, 혹시 못 들으셨었나요? 저희는 이곳에 목욕 시설을 체험하기 위해 방문했다고—"
70001020-260 = "아, 그런 거라면 진작 말했어야지!"
70001020-261 = "잠시만 기다려 봐. 닌자들이 즐겨 사용하는 유서 깊은 전통 목욕 시설을 보여줄 테니까!"
70001020-273 = "이건……?"
70001020-274 = "드럼통 목욕이야!"
70001020-275 = "이렇게 안 쓰는 드럼통에 물을 채우고 아래에 불을 때면 적은 양의 물로도 목욕을 할 수 있지!"
70001020-276 = "게다가 이 드럼통 욕조는 설치가 간편하기 때문에 경관이 좋은 야외 어디에서도 느긋하게 목욕을 즐길 수 있다고."
70001020-277 = "다, 다만 단점이라면 드럼통에 몸이 끼어 버릴 위험도 있어서……"
70001020-278 = "지난번에는 목욕을 마치고 난 뒤에 나오려 하니 몸이 빠지지 않아서 큰일이었어요……"
70001020-279 = "쓸데없이 방해가 될 정도로 커다랗기만 해서…… 죄송합니다아……"
70001020-280 = "그, 그러니까 그때는 드럼통이 너무 작았던 거라니까……"
70001020-286 = "(어, 어라……? 생각보다 마음에 안 들었나……?)"
70001020-288 = "저기, 혹시 뭔가 문제라도……?"
70001020-289 = "설마 백귀야행 학원 같은 메이저 학원의 학생들이, 이토록 열악한 환경에서 몸을 씻고 있었다니……"
70001020-293 = "여러분. 아무리 백귀야행 학원의 잔악한 권력자들이 박해한다 하더라도 절대 포기하지 마세요!"
70001020-297 = "붉은겨울 학원의 [ruby=콤라드]동지[/ruby]들은 백귀야행의 학생들과도 언제든 연대할 준비가 되어 있으니까요!"
70001020-301 = "으, 으응…… 고, 고마워……"
70001020-302 = "이건 예전에 온천장을 운영할 때 만들어 두었던 특제 온천 만쥬에요!"
70001020-303 = "많지는 않지만 배고프실 때 드시면 힘이 날 거예요!"
70001020-304 = "어, 어어…… 고마워……"
70001020-306 = "그럼 자유와 안락한 목욕을 위해 계속 투쟁하자고요!"
70001020-308 = "어…… 어어……"
70001020-313 = "뭐, 뭔가 이상한 오해를 하신 것 같은데……"
70001020-318 = "냐아아악— 크, 큰일이다…… 약속한 시간에 늦어버리고 말았어……"
70001020-319 = "저기, 인법연구부 여러분. 혹시 이 근처에서 다른 학원의 학생들을 보지 못하셨나요?"
70001020-320 = "붉은겨울 학원에서 특사가 올 예정이라고 들었는데……"
