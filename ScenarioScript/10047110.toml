[translation]
10047110-1 = "에필로그;일상은 계속된다"
10047110-3 = "[ns] \"멋진 작품을 만든 것까진 좋았는데 말이야.\""
10047110-6 = "[ns] \"……또 여기에 갇혀 버렸네.\""
10047110-7 = "자업자득이라고. 그렇게나 말썽을 부렸는데 이 정도로 끝나서 다행인 줄 알아."
10047110-12 = "그나저나 레나 쨩은…… 왜 여기 있는 거야……?"
10047110-13 = "자수했지. 출입 금지 구역에 들어가서 종을 쳤으니까."
10047110-14 = "나는 선배들과 달리 매우 양심적인 학생이라고."
10047110-15 = "역시 그 종소리는 레나 쨩이었군요."
10047110-16 = "히히, 멸망의 종을 울리다니…… 너무 대담한 거 아냐……?"
10047110-17 = "멸망은 뭐가 멸망이라는 거야? 그런 건 다 엉터리 도시전설이라고!"
10047110-18 = "하지만, 소원을 이루는 마법은 발동됐잖아요?"
10047110-19 = "소원을 이룬 건 에리 선배뿐이었잖아."
10047110-20 = "아니에요. 저 역시 소원을 이루었답니다."
10047110-21 = "다음에 라이벌 밴드와 배틀 콘서트가 예정되어 있는데,#n어떤 곡으로 상대를 압도할지 고민했거든요."
10047110-22 = "이번에 사감대에 쫓기면서 다급한 상황을 많이 겪다 보니 저절로 가사와 멜로디가 떠오르더군요."
10047110-23 = "후후, 덕분에 깔끔하게 고민 해결~."
10047110-24 = "지금도 속으로 흥얼거리는 중인데, 한번 들어보시겠어요?"
10047110-25 = "아, 아니야! 괜찮아! 츠무기 선배는 상냥한 모습이 좋다고!"
10047110-26 = "저는 언제나 상냥한데요?"
10047110-27 = "아아, 그럼 레나 쨩은 항상 제가 좋다는 거였군요?"
10047110-34 = "샤아아악……!!"
10047110-35 = "사실은 나도…… 이번에 새롭게 깨달은 것이 있어."
10047110-36 = "선배는 또 뭔데?"
10047110-40 = "전생의 연인을…… 떠올리게 된 거지. 히히……."
10047110-44 = "나도 처음엔 몰랐어…… 하지만 보면 볼수록 확신이 들었지."
10047110-45 = "그게 누군지 궁금하지 않아……?"
10047110-46 = "안 궁금해. 어차피 또 쓸데없는 소리나 할 거잖아."
10047110-47 = "레나 쨩은…… 전생을 안 믿는구나."
10047110-48 = "내 다정했던 손길을 잊었다니……. 슬퍼……."
10047110-49 = "그, 그게 무슨 소리야? 다정했던 손길?"
10047110-50 = "……설마 전생의 연인이 나였다는 소리는 아니겠지?"
10047110-51 = "우린…… 서로 매우 아끼는 사이였어……."
10047110-52 = "나는 주인님……."
10047110-57 = "레나 쨩은 귀여운 고양이……."
10047110-63 = "샤아악! 그만둬엇!"
10047110-64 = "하지만 레나 쨩이 귀여운 건 사실인걸요?"
10047110-65 = "샤아아아악……!!"
10047110-67 = "아무튼 고마웠어요, 레나 쨩. 덕분에 모두가 한 걸음 앞으로 나아갈 수 있었으니까요."
10047110-68 = "난 아무것도 얻은 게 없는데?"
10047110-69 = "뉴후후, 그럴 리가요. 레나 쨩도 이번 일로 소원을 이루었는걸요."
10047110-70 = "내가? 무슨 소원을?"
10047110-71 = "우리랑 더 즐겁게 지냈으면 좋겠다는 소원이요."
10047110-72 = "누, 누가 그런 소원을 빌었다고!"
10047110-74 = "늘 말하지만 두고 봐! 오컬트 같은 미신은 없다는 걸 증명할 테니까!"
10047110-75 = "후후, 네. 그렇게 알고 있을게요."
10047110-76 = "레나 쨩이 최근 잠들기 전에 점성술 책을 열심히 보는 것도 저는 모르는 일이니까요."
10047110-77 = "……!"
10047110-78 = "내가 연금술 가마를 쓸 때도…… 몰래 보고 있던 거 모르는 일이니까……."
10047110-79 = "……!!"
10047110-80 = "뉴후후. 타로가 어떻게 그리 잘 맞는지 열심히 물어봐 준 것은…… #n잊고 싶지 않군요."
10047110-81 = "……!!!"
10047110-82 = "[s] \"사실…… 레나도 오컬트에 흥미가 있는 거야?\""
10047110-83 = "아 몰라! 정말 시끄러운 사람들이네!"
10047110-88 = "뉴후후, 그럼 여기서 다음 작품을 구상해 보죠."
10047110-89 = "또 어떤 걸로 모두를 놀라게 해 줄까요?"
10047110-90 = "……꼭 모두가 놀라야 하는 거야? 그냥 평범한 거면 안 돼?"
10047110-91 = "모두가 놀라지 않으면 그건 혁신적인 예술이 아니니까요!"
10047110-92 = "혁신적이라……."
10047110-93 = "그럼 다음엔 평의회장의 개인 박물관에 가보는 건 어때요?"
10047110-94 = "그곳은 와일드헌트의 신비한 예술품들이 은밀히 보관된 장소."
10047110-95 = "어째서 일반 학생들에겐 공개하지 않는지 그 이유조차 설명하지 않는 금단의 장소."
10047110-96 = "그곳에 숨은 정보를 조합한다면, <창세의 초상>에 숨겨진 우리 학원의 비밀도 찾을 수 있겠죠."
10047110-97 = "평의회장의 개인 박물관이라…… 나도 궁금하긴 해."
10047110-98 = "거기엔 어떤 오컬트가 숨어있을까. 히히……."
10047110-99 = "카노에 선배도 가본 적이 없는 건가요?"
10047110-100 = "응……. 평의회장을 제외하고…… 그곳에 들어간 사람은 지금까지 아무도 없었어……."
10047110-105 = "심지어 그 <자애의 괴도> 조차도."
10047110-109 = "그, 그런 곳에 숨어 들어가겠다고?! 진심이야?!"
10047110-110 = "뉴후후, 모두와 함께라면 불가능은 없다고 생각해요! 그렇죠?"
10047110-115 = "아아, 저 표정들……! 진짜로 할 생각이야!"
10047110-116 = "선생님! 어떻게든 해 봐! 이러다 또 사고 칠 거라고!"
10047110-117 = "[ns] \"이야기 들어보니 나도 궁금하긴 한데…….\""
10047110-121 = "[ns1] \"일단 정상적인 방법이 좋겠지.\"\n[ns2] \"노력해 볼게. 일반 학생도 그 박물관에 들어갈 수 있도록 말이야.\""
10047110-124 = "정상적이지 않더라도 어떻게든 할 테니까……."
10047110-125 = "히히…… 이히히히……!"
10047110-126 = "이 상태가 된 카노에 선배는 아무도 못 말리죠. #n저도 가슴이 두근거려요."
10047110-127 = "뉴후후, 이걸로 다음 목표가 정해졌군요!"
10047110-131 = "자! 여기서 오컬트 연구회의 회장으로서 선언합니다!"
10047110-132 = "다음 목표는…… <평의회장의 박물관>! 그곳에 숨은 오컬트를 모두 찾아내는 겁니다!"
10047110-133 = "하아, 내가 못 살아 진짜……."
10047110-135 = "(과연 오컬연의 다음 계획은 성공할 수 있을 것인가…….)"
10047110-141 = "……재미난 일을 꾸미고 계시네요. 다음에도 지켜보는 재미가 있겠어요."
10047110-142 = "<사감대의 간부>로서도."
10047110-143 = "<자애의 괴도>로서도."
10047110-144 = "그럼 다시 만날 날을 기다리고 있겠습니다."
10047110-153 = "그 무대가 어떤 곳이 될지는, 저도 아직 모르지만요. 후후후……."
10047110-154 = "우리는 오컬트 연구회! ~학원의 불가사의와 고대 주문~"
