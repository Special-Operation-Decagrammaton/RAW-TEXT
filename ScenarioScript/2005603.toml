[translation]
2005603-1 = "내 집처럼"
2005603-2 = "(점심쯤까지 작업하고 있으니, 약속대로 초인종 소리가 들려왔다.)"
2005603-6 = "[ns1] \"열렸으니 들어와~.\"\n[ns2] 문 여는 버튼을 눌러준다."
2005603-10 = "하이, 하~이. 선생님! 쿠로사키 코유키, 명을 받들어 왔습니다!!"
2005603-11 = "오늘 하루는 선생님의 유능한 손발이 되어 드릴 테니, 저에게 맡겨만 주시라고요!"
2005603-12 = "……그렇다고 비밀번호 푸는 거만 너무 많이 맡기진 마시고요! 니하하하하!!"
2005603-13 = "[s3] \"다 좋은데……. 복장의 상태가?\"\n[s4] \"어, 응. 그런데 왜 파자마야?\""
2005603-16 = "예? ……아, 이 복장이요?"
2005603-17 = "……음? 복장에 대한 이야기는 없었잖아요? 혹시 무슨 문제라도 있나요?"
2005603-18 = "아, 딱히 그런 건 아니라고요? 니하하하! 깜짝 놀랐잖아요. 시작부터 사고 친 줄……."
2005603-19 = "뭐, 복장이라고 해 봐야 그냥 교복보다는 이쪽이 편해서 그랬던 것뿐이고, 정말 별다른 이유는 없는데요."
2005603-20 = "몸이 편하면 일도 더 잘될 거 아니에요?"
2005603-21 = "세미나에서는 선배들이 복장도 신경 쓰라고 해서 어쩔 수 없이 그렇게 입고 있지만……."
2005603-22 = "여기서 하는 당번이라는 건, 말하자면 일종의 도우미나 지원 같은 거니까? 굳이 의상까지 신경 쓸 필요는 없을 거 같고?"
2005603-23 = "다른 학생들이라고 맨날 다 교복만 입고 오는 건 아닐 거 아니에요? 그렇죠? 제 말 맞죠?"
2005603-24 = "[s5] \"그, 그건 그렇다만…….\"\n[s6] \"그렇게 말하니 할 말이 없긴 하네.\""
2005603-27 = "니하하하하!! 봐요, 그런 거라니까요?"
2005603-28 = "자, 그러면 바로 선생님의 일감을 도와드리기 전에……."
2005603-32 = "……영-차."
2005603-33 = "[ns7] \"……코유키 씨?\"\n[ns8] \"아예 돗자리를 펴고 누워버렸네?\""
2005603-36 = "……예? 무슨 말씀이시죠?"
2005603-37 = "지금 뭐 하고 있는 거냐고요? 그야……. 일할 준비하는 건데요?"
2005603-38 = "여기 누워 있을 테니, 시키실 일 있으면 훌렁훌렁 던져 주세요. 받아서 다 하고 다시 그대-로 돌려드리겠습니다!"
2005603-42 = "……선생님?"
2005603-43 = "아, 아무것도 아니라고요? 니하하하! 싱거우시기는."
2005603-44 = "자, 그러면 대충 자세도 다 잡았겠다……."
2005603-45 = "……시작하시죠!! 오늘의 업무!!"
2005603-47 = "(이후 바닥을 뒹굴던 코유키와 함께 그날의 샬레 업무들을 시작했다.)"
2005603-48 = "(코유키는 얼핏 굉장히 불성실해 보이는 자세로 뒹굴거리며 일을 진행했지만…….)"
2005603-52 = "(……놀랍게도 본인이 했던 말대로, 정말로 순식간에 업무들을 끝내고 돌려주었다.)"
2005603-58 = "[ns9] \"이걸로 벌써 마지막이네.\"\n[ns10] \"굉장한걸. 예상보다 훨씬 많이 했어.\""
2005603-61 = "니하하하하!! 그러기에 말씀드렸잖아요? 저만 믿으시라고! 한 말은 지킨다~ 이 말입니다!"
2005603-62 = "……음? 뭐라고요?"
2005603-63 = "평소에 세미나에서도 이런 속도로 일을 처리하냐고요?"
2005603-67 = "……아뇨? 절대 못 하죠. 에이, 말도 안 되는 말씀을……."
2005603-68 = "[s11] \"뭔가 그럴 거 같긴 했지만…….\"\n[s12] \"무슨 차이가 있는 거야?\""
2005603-71 = "무슨 차이냐니……. 그야 당연하잖아요? 세미나 사무실은 불편한걸요."
2005603-72 = "바닥에 누울 수도 없어, 옷도 정장이나 다름없는 교복 챙겨 입어야 해……."
2005603-73 = "중간에 자고 싶다고 잘 수도 없고, 시끄럽게 하면 혼나고, 과자도 잘 못 먹고……."
2005603-74 = "사실 그런 작업 환경에서 속도가 난다는 것 자체가 이상한 거 아닐까요? 아닌가?"
2005603-75 = "뭐……. 선배들 말로는 오는 사람도 있고 하니까 지킬 건 지켜야 한다고 말하긴 했지만요."
2005603-76 = "그럼 오는 사람들도 그 ‘지킬 거’라는 걸 다 같이 안 지키면 되는 거 아닌가……."
2005603-77 = "……라고 말했지만, 역시나 먹힌 적이 없습니다! 니하하하하!!"
2005603-78 = "[s13] \"……과연, 이해했어.\"\n[s14] \"코유키에 대해 조금 더 알게 됐네.\""
2005603-81 = "에엑-? 뭐예요, 그게? 갑자기 이상한 말씀을……!"
2005603-82 = "……니하하."
2005603-83 = "어쨌든……. 선생님께 도움이 된 거 같아서 뭔가 묘하게 기분이 좋군요!"
2005603-84 = "그러면 오늘 업무들은 모두 끝? 이제 셔터 내리는 건가요?"
2005603-85 = "오늘만큼은 좋~은 이미지일 때 이대로 물러나서 점수를 좀 따 볼까 하는데 말이죠."
2005603-86 = "더 시키실 일이 없으면 저는 그럼 이만 물러가겠습니다!"
2005603-87 = "[ns15] \"……아, 코유키. 잠깐만.\"\n[ns16] 가려던 코유키를 불러 세운다."
2005603-90 = "으음? 선생님……? 왜 그러시죠?"
2005603-91 = "……네?"
2005603-92 = "딱히 다른 일정 없으면, 오늘은 여기서 자고 가도 괜찮다고요?"
2005603-93 = "어라. 그렇지만 그건 말씀드린 거랑 전제부터 달라지는데……. 선생님께 폐가 되는 게……?"
2005603-94 = "전혀 아니라고요? 어차피 늦어서 지금 보내는 게 더 마음에 걸려……?"
2005603-95 = "[s17] \"고생했으니까. 세미나엔 내가 잘 말해 둘게.\"\n[s18] \"여기 게임기라든가, 마음대로 가지고 놀아도 돼.\""
2005603-98 = "어……."
2005603-100 = "……!!!!!!!!"
2005603-101 = "게임……기……!!!"
2005603-102 = "니하하하하하하!! 어쩔 수 없네요!! 역시 선생님께서도 꽤 심심하셨던 거죠!?"
2005603-103 = "그렇게까지 말씀하신다면 저도 거절할 수 없죠. 마침 옷도 딱 잠옷이겠다! 상황이 좋네요!"
2005603-104 = "자, 가시죠. 선생님! 휴게실의 콘솔과 간식거리들이 저흴 기다리고 있습니다!!"
2005603-105 = "[s19] \"갑자기 태도 돌변!!\"\n[s20] \"그, 일단은 내 건데…….\""
2005603-108 = "니하하하하!! 자, 자. 그런 건 됐으니까요!"
2005603-109 = "가시죠, 선생님! 아직 밤은 많이 남아 있다고요!!"
2005603-110 = "It’s show time~!!!"
2005603-112 = "(이후 코유키와 함께 휴게실에서 게임을 하며 남은 시간을 보내었다.)"
2005603-113 = "(코유키는 밤새워 놀 것처럼 의기양양한 태도를 보였지만…….)"
2005603-117 = "(역시나 예상대로, 두어 시간도 더 버티지 못하고 푹 곯아떨어졌다.)"
