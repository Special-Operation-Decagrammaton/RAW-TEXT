[translation]
2005603-1 = "Just Like Home"
2005603-2 = "It was around lunchtime at the office when, as promised, the doorbell rang."
2005603-6 = "[ns1] \"Come in, it's open.\"\n[ns2] Open the door."
2005603-10 = "Hi, hi! Sensei! Kurosaki Koyuki, at your service!!"
2005603-11 = "I'll be your capable assistant today, so just leave everything in my hands!"
2005603-12 = "...But I'll start charging if you ask me to crack TOO many passwords! Nihahaha!"
2005603-13 = "[s3] \"That's fine and all, but...why are you dressed like that?\"\n[s4] \"Aren't those...your pajamas?\""
2005603-16 = "Huh? ...Ah, my clothes?"
2005603-17 = "I wasn't supposed to wear a uniform or something here, right?!"
2005603-18 = "Ah, not really? Nihahaha! Don't scare me like that, Sensei! I thought I'd managed to get myself in trouble already!"
2005603-19 = "I just wore it because it's way comfier than my school uniform!"
2005603-20 = "After all, don't you work best when you're at your comfiest?"
2005603-21 = "Everyone in Seminar is always harping on me about the importance of \"how I present myself,\" so I have to wear my uniform around them, but..."
2005603-22 = "Being Student Rep is just being your support, right? So why does it matter how other people see me?"
2005603-23 = "It's not like all the other students wear their school uniforms every single day, is it? Right? I'm right, aren't I?"
2005603-24 = "[s5] \"Well, you're not WRONG...\"\n[s6] \"I guess I don't really have anything to say to that...\""
2005603-27 = "Nihahaha!! See, you get it!"
2005603-28 = "All righty! So, before I get started with any work..."
2005603-32 = "...Hup!"
2005603-33 = "[ns7]...\"Koyuki?\"\n[ns8] \"Did you seriously just spread out a mat and lay down?\""
2005603-36 = "...Huh? What do you mean?"
2005603-37 = "What am I doing right now? Well... I'm getting ready to work."
2005603-38 = "Just toss me whatever tasks you need done, and I'll get them done before you know it! And I promise I won't move from this mat!"
2005603-42 = "Sensei...?"
2005603-43 = "It's nothing? Nihahaha! If you say so, silly Sensei."
2005603-44 = "Now that I'm more or less settled in..."
2005603-45 = "...LET'S GOOO! WORK TIME!"
2005603-47 = "So, I did as Koyuki said and started on Schale's tasks for the day. And, true to her word, she stayed laying down on the floor."
2005603-48 = "From an outside perspective, she looked ridiculously lackadaisical and unfocused."
2005603-52 = "But surprisingly, she cranked through every task I gave her with record speed."
2005603-58 = "[ns9] \"This is already the last one.\"\n[ns10] \"Incredible. We got through way more than I expected today.\""
2005603-61 = "Nihahaha!! See? You need to learn to trust me! I ALWAYS keep my word, Sensei."
2005603-62 = "...Hmm? What?"
2005603-63 = "Do I usually finish my work this quickly at Seminar?"
2005603-67 = "...No? Of course not. Come on now, that'd be totally impossible!"
2005603-68 = "[s11] \"Well, I guess I already knew that...\"\n[s12] \"What's the difference?\""
2005603-71 = "Do I even have to say it? The Seminar office is sooo uncomfortable."
2005603-72 = "I'm not allowed to lie on the floor, and I have to wear my stupid uniform all the time."
2005603-73 = "If I wanna take a nap, they won't let me! But I can't be awake and making too much noise or eating snacks, because I get yelled at!"
2005603-74 = "Am I REALLY the weird one for thinking it's crazy to expect someone to work in that kind of environment?"
2005603-75 = "Well... The upperclassmen always say that we have a lot of visitors at Seminar, so we need to follow the rules at all times."
2005603-76 = "But doesn't it make more sense then for those visitors to just not follow the rules WITH us?"
2005603-77 = "...At least, that's what I would say, but they never listen! Nihahaha!!"
2005603-78 = "[s13] \"...I see.\"\n[s14] \"I think I've learned a little more about you, Koyuki.\""
2005603-81 = "Eh?! What the heck are you saying?!"
2005603-82 = "...Nihaha."
2005603-83 = "Still... I'm happy I got to help you today, Sensei. And in my way."
2005603-84 = "So, is that it for today's tasks? This is when we close up shop?"
2005603-85 = "Since I left a real good impression today, I think I'll score a few extra points and behave!"
2005603-86 = "So if that's it, I'll take my leave without causing even one iota of a fuss!"
2005603-87 = "[ns15] \"...Ah, Koyuki. One moment.\"\n[ns16] Stop Koyuki from leaving."
2005603-90 = "Hmm? Sensei...? What's the matter?"
2005603-91 = "...Huh?"
2005603-92 = "If I don't have any other plans, it's okay if I stay the night?"
2005603-93 = "Huh. That changes things... Are you sure, Sensei? I wouldn't be a bother?"
2005603-94 = "...It actually bothers you more if you send me away when it's so late?"
2005603-95 = "[s17] \"You worked hard. I'll be sure to let Seminar know.\"\n[s18] \"You can play on the game consoles we have here for tonight.\""
2005603-98 = "Oh..."
2005603-100 = "Oh my god...!"
2005603-101 = "GAME CONSOLES!!"
2005603-102 = "Nihahahahahaha!! I mean, what's a girl to do? You wanted to hang out, too, didn't you, Sensei?!"
2005603-103 = "How could I possibly say no to your heartfelt request? And I'm already dressed for the occasion too!"
2005603-104 = "Come on, let's go, Sensei! Snacks and games are waiting in the break room for us!"
2005603-105 = "[s19] \"Look at that sudden change in attitude!!\"\n[s20] \"Well, those are all mine, first off...\""
2005603-108 = "Nihahaha!! C'mon, don't sweat the small stuff!"
2005603-109 = "Let's go, Sensei! The night is still young!!"
2005603-110 = "It's show time!!"
2005603-112 = "Koyuki and I spent the rest of our night playing games in the break room together."
2005603-113 = "At first, Koyuki was excited to pull an all-nighter playing together..."
2005603-117 = "But, as I thought, she only lasted a few hours before she was fast asleep."
