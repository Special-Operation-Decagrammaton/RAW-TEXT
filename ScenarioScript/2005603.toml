[translation]
2005603-1 = "เหมือนบ้านของตัวเอง"
2005603-2 = "(คุณครูนั่งทำงานอยู่จนถึงเที่ยง แล้วก็มีใครบางคนมากดกริ่งเรียกตามที่บอกไว้)"
2005603-3 = ""
2005603-6 = "[ns1] \"ประตูไม่ได้ล็อก เข้ามาได้เลย~\"\n[ns2] กดปุ่มเปิดประตูให้"
2005603-10 = "ฮาย~ คุณครู! คุโรซากิ โคยูกิมารับคำสั่งแล้วค่ะ!!"
2005603-11 = "วันนี้ฉันจะคอยเป็นผู้ช่วยให้คุณครูตลอดทั้งวันเอง เพราะงั้นวางใจได้เลยค่ะ!"
2005603-12 = "แต่ก็อย่าให้ทำพวกเรื่องไขรหัสมากเกินไปนะคะ! วะฮ่าฮ่าฮ่าฮ่า-!!"
2005603-13 = "[s3] \"ทุกอย่างดูดีนะแต่... ชุดนั่นมันอะไรน่ะ?\"\n[s4] \"อืม ว่าแต่ว่าทำไมใส่ชุดนอนมาล่ะ?\""
2005603-16 = "คะ? อ้อ... ชุดนี้น่ะเหรอคะ?"
2005603-17 = "อืม...? ก็คุณครูไม่ได้พูดถึงเรื่องชุดเลยนี่คะ มันมีปัญหาอะไรรึเปล่าคะ?"
2005603-18 = "อ้อ ไม่ใช่อย่างนั้นหรอกเหรอคะ? วะฮ่าฮ่าฮ่า! ตกใจหมดเลยค่ะ นึกว่าฉันก่อเรื่องตั้งแต่แรกเลย..."
2005603-19 = "ส่วนเรื่องชุด ฉันแค่คิดว่ามันใส่สบายกว่าชุดนักเรียนก็เท่านั้นแหละ ไม่มีเหตุผลพิเศษอะไรหรอกค่ะ"
2005603-20 = "ถ้ารู้สึกสบายตัวก็จะทำงานได้ดีขึ้นไม่ใช่เหรอคะ?"
2005603-21 = "ตอนอยู่ที่เซมิน่า พวกรุ่นพี่ก็บอกว่าให้ใส่ใจเรื่องเครื่องแต่งกายด้วย ฉันเลยไม่มีทางเลือกอื่น นอกจากใส่ชุดนี้..."
2005603-22 = "ว่าแต่ว่าเรื่องเข้าเวรตัวแทนเนี่ย มันเป็นงานสนับสนุนอย่างหนึ่งใช่มั้ยคะ? ดูเหมือนจะไม่เกี่ยวกับเรื่องชุดเลยนี่นา?"
2005603-23 = "นักเรียนคนอื่นๆ คงไม่ได้ใส่ชุดนักเรียนมากันอย่างเดียวหรอกใช่มั้ยล่ะคะ? ใช่มั้ยคะ? ฉันพูดถูกมั้ยคะ?"
2005603-24 = "[s5] \"ระ... เรื่องนั้นมันก็จริงอยู่หรอก...\"\n[s6] \"ถ้าคิดอย่างนั้น ครูก็ไม่รู้จะพูดยังไงแล้ว\""
2005603-27 = "อะฮ่าฮ่าฮ่าฮ่า-!! เห็นมั้ยล่ะ บอกแล้วไงล่ะคะ"
2005603-28 = "เอาละค่ะ ถ้างั้นก่อนที่ฉันจะช่วยงานคุณครู..."
2005603-29 = ""
2005603-31 = ""
2005603-32 = "ฮึบ..."
2005603-33 = "[ns7] \"คุณโคยูกิ...?\"\n[ns8] \"ปูเสื่อนอนเฉยเลย?\""
2005603-36 = "คะ...? พูดอะไรกันน่ะคะ?"
2005603-37 = "ตอนนี้ฉันกำลังทำอะไรน่ะเหรอคะ? ก็... เตรียมตัวทำงานยังไงล่ะคะ?"
2005603-38 = "ฉันจะนอนอยู่ตรงนี้ ถ้าคุณครูจะให้ฉันทำอะไรก็ส่งมาได้เลยค่ะ ฉันจะทำงานให้เสร็จแล้วส่งคืนให้#nสภาพเดิมทุกอย่างเลย!"
2005603-39 = ""
2005603-42 = "คุณครู...?"
2005603-43 = "มะ... ไม่มีอะไรงั้นเหรอคะ? อะฮ่าฮ่าฮ่า คุณครูนี่ตลกจัง"
2005603-44 = "เอาละ ตอนนี้ก็เตรียมพร้อมแล้ว..."
2005603-45 = "งานของวันนี้...!! จะเริ่มเลยแล้วกันนะคะ!!"
2005603-47 = "(หลังจากนั้นคุณครูก็เริ่มทำงานประจำวันของชาเล่ต์โดยมีโคยูกินอนกลิ้งๆ อยู่บนพื้น)"
2005603-48 = "(โคยูกินอนกลิ้งไปกลิ้งมาพลางทำงานไปด้วย ท่าทางของเธอดูไม่จริงจังอะไรนัก...)"
2005603-49 = ""
2005603-50 = ""
2005603-51 = ""
2005603-52 = "(แต่เธอกลับทำงานเสร็จและส่งกลับมาให้ตามกำหนดอย่างที่พูดไว้ได้...)"
2005603-53 = ""
2005603-55 = ""
2005603-57 = ""
2005603-58 = "[ns9] \"นี่เป็นอันสุดท้ายแล้วละ\"\n[ns10] \"สุดยอดเลยนะ ทำได้ดีกว่าที่ครูคิดไว้ซะอีก\""
2005603-61 = "วะฮ่าฮ่าฮ่าฮ่า-!! ก็บอกไปแล้วนี่คะ ว่าให้คุณครูเชื่อใจฉันได้เลยน่ะ! ฉันรักษาสัญญาเสมอนะคะ!"
2005603-62 = "หืม...? อะไรเหรอคะ?"
2005603-63 = "ปกติเวลาอยู่ที่เซมิน่าก็ทำงานเร็วแบบนี้รึเปล่าน่ะเหรอคะ?"
2005603-64 = ""
2005603-66 = ""
2005603-67 = "ไม่หรอกค่ะ ทำไม่ได้เลยละค่ะ โธ่ เป็นไปไม่ได้หรอกค่ะ..."
2005603-68 = "[s11] \"ครูก็พอจะเดาได้อยู่หรอก...\"\n[s12]  \"แล้วมันต่างกันตรงไหนล่ะ?\""
2005603-71 = "ต่างกันตรงไหนงั้นเหรอคะ... อืม มันก็แน่อยู่แล้วนี่คะ? ก็สำนักงานของเซมิน่าน่ะ น่าอึดอัดจะตาย"
2005603-72 = "ไม่มีที่ให้นอนเล่นบนพื้น แล้วก็ต้องใส่ชุดนักเรียนที่น่าอึดอัด..."
2005603-73 = "ถึงอยากจะพักงีบก็ทำไม่ได้ และถ้าทำเสียงดังก็จะโดนดุ แล้วก็กินขนมไม่ได้ด้วย..."
2005603-74 = "ถ้าให้ทำงานได้เร็วในสภาพแวดล้อมแบบนั้นมันก็คงแปลกเกินไปแล้วค่ะ ใช่มั้ยล่ะคะ?"
2005603-75 = "อืม... รุ่นพี่บอกว่ามีคนเข้าออกเซมิน่าบ่อยๆ เพราะงั้นเลยต้องทำตามกฎระเบียบค่ะ"
2005603-76 = "ถ้างั้นขอแค่คนที่เข้าออกทั้งหมดพร้อมใจกัน 'ไม่ทำตามระเบียบ' ก็สิ้นเรื่องแล้วไม่ใช่รึไง..."
2005603-77 = "ฉันเคยพูดไปแบบนั้นแล้ว แต่ก็ไม่ได้ผลเลยค่ะ! วะฮ่าฮ่าฮ่าฮ่า-!!"
2005603-78 = "[s13] \"ครูพอจะเข้าใจโคยูกิขึ้นมาบ้างแล้วละ\"\n[s14] \"เหมือนได้รู้จักโคยูกิขึ้นมาอีกนิดเลยนะ\""
2005603-81 = "ฮึก... อะไรกันคะ ทำไมจู่ๆ ถึงพูดอะไรแบบนั้น...!"
2005603-82 = "ฮะฮ่าฮ่า..."
2005603-83 = "ยังไงก็เถอะค่ะ... ฉันดีใจที่ทำตัวเป็นประโยชน์กับคุณครูได้นะคะ!"
2005603-84 = "งานของวันนี้เรียบร้อยดีแล้วใช่มั้ยคะ? แสดงว่าตอนนี้ก็เลิกงานได้แล้วสินะคะ?"
2005603-85 = "ฉันกำลังคิดว่าจะขอตัวกลับในตอนที่ยังมีภาพลักษณ์ดีๆ อยู่น่ะค่ะ"
2005603-86 = "เพราะงั้นถ้าไม่มีงานอะไรเพิ่มแล้ว ฉันขอตัวก่อนนะคะ!"
2005603-87 = "[ns15] \"อ่า... โคยูกิ เดี๋ยวก่อนสิ\"\n[ns16] เรียกโคยูกิเอาไว้"
2005603-90 = "หืม? คุณครู...? มีอะไรเหรอคะ?"
2005603-91 = "คะ...?"
2005603-92 = "ถ้าฉันไม่มีแผนอะไรอย่างอื่น ก็นอนค้างที่นี่ได้งั้นเหรอคะ?"
2005603-93 = "เอ๋ แต่ถ้าทำแบบนั้นมันก็ไม่เหมือนกับที่ตกลงกันไว้น่ะสิคะ... แบบนี้ฉันจะเป็นภาระให้คุณครูรึเปล่า...?"
2005603-94 = "ไม่เป็นภาระเลยงั้นเหรอคะ? ยังไงตอนนี้มันก็ดึกแล้ว ถ้าปล่อยให้กลับไปตอนนี้จะเป็นห่วงงั้นเหรอ...?"
2005603-95 = "[s17] \"ทำงานเหนื่อยพอแล้วละ เดี๋ยวครูบอกทางเซมิน่าให้เอง\"\n[s18] \"คืนนี้จะนอนเล่นเกมหรือเล่นอยู่ที่นี่ก็ได้ตามสบายเลยนะ\""
2005603-98 = "อ่า..."
2005603-100 = "......!!!!!!!!!!"
2005603-101 = "เล่น... เกม...!!!!!"
2005603-102 = "วะฮ่าฮ่าฮ่าฮ่าฮ่า!! ช่วยไม่ได้นะคะ!! คุณครูเองก็คงจะเบื่อๆ อยู่เหมือนกันใช่มั้ยล่ะคะ?!"
2005603-103 = "ถ้าคุณครูพูดถึงขนาดนี้แล้ว ฉันก็คงปฎิเสธไม่ได้หรอกค่ะ ฉันใส่ชุดนอนมาพอดีเลยด้วย สถานการณ์เป็นใจสุดๆ เลยค่ะ!"
2005603-104 = "เอ้า ไปกันเถอะค่ะ คุณครู! เครื่องเล่นเกมกับของว่างในห้องพักผ่อนกำลังรอเราอยู่ค่ะ!!!"
2005603-105 = "[s19] \"จู่ๆ ท่าทางก็เปลี่ยนไปเลยนะ!!\"\n[s20] \"นั่นมันของครูนะ...\""
2005603-108 = "วะฮ่าฮ่าฮ่า!! เอาละๆ เลิกพูดเรื่องนี้กันเถอะค่ะ!"
2005603-109 = "ไปกันเถอะค่ะคุณครู! คืนนี้ยังอีกยาวไกลค่ะ!!"
2005603-110 = "It’s show time~!!!"
2005603-112 = "(จากนั้นคุณครูก็ใช้เวลาที่เหลือนั่งเล่นเกมกับโคยูกิที่ห้องพักผ่อน)"
2005603-113 = "(โคยูกิทำท่าเหมือนจะนั่งเล่นสนุกอยู่ทั้งคืน...)"
2005603-114 = ""
2005603-116 = ""
2005603-117 = "(แต่พอผ่านไปสัก 2-3 ชั่วโมง เธอก็ผล็อยหลับไป)"
