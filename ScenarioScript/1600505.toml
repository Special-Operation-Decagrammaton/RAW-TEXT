[translation]
1600505-1 = "여름 바다의 계단"
1600505-4 = "(바다로 찾아가니 츠루기가 해변가에 앉아 있었다.)"
1600505-5 = "(이전과는 달리 별달리 움직이거나 두리번거리지 않고, 쭉 바다만 보고 있었다.)"
1600505-6 = "[s1] \"츠루기?\"\n[s2] \"뭐 보고 있어?\""
1600505-7 = "……?"
1600505-8 = "……?"
1600505-9 = "……!? 헛!!"
1600505-10 = "서, 선생님. 여긴 어쩐 일로 오신 겁니까……?"
1600505-11 = "네? 제 모모톡 말씀이십니까……? 거, 걱정돼서 와보셨다고요……!?"
1600505-12 = "아, 아니…… 그, 그건 정말로 말씀드린 그대롭니다만……"
1600505-13 = "아무래도 뭔가 신경 쓰이게 해드린 모양입니다…… 죄송합니다……"
1600505-14 = "아. 괜찮으시다니…… 그렇게 말씀해주시니 감사합니다만……"
1600505-15 = "네? 여기서 뭘 하고 있었냐고요?"
1600505-16 = "으음……"
1600505-17 = "……"
1600505-18 = "시, 실은 저도 잘 모르겠습니다. 뭔가 하고 있었다는 느낌은 아니었던지라……"
1600505-19 = "그저……"
1600505-20 = "그저 여기에 앉아서, 계속 저 바다만을 보고 있었습니다. ……이유는 저도 모르겠습니다."
1600505-21 = "왜일까요……"
1600505-22 = "어쩌면 생각했던 여름 바다의 이미지와 달라서……?"
1600505-23 = "주변에 다른 관광객들도 안 보이고, 떠들썩한 분위기도 없고 해서……? 저만 덩그러니 있는 느낌이라서?"
1600505-24 = "그래서 느끼는…… 일종의 미련이라고도 할 수 있을까요……?"
1600505-25 = "……네?"
1600505-26 = "그렇게는 보이지 않으셨다고요?"
1600505-27 = "그렇군요…… 아무래도 저는 스스로의 모습을 볼 수가 없다 보니…… 케헤……"
1600505-28 = "케헤헤……"
1600505-29 = "[s3] \"……다른 사람의 바다와 같을 필욘 없지 않을까?\"\n[s4] \"미련 때문은 아니었을 것 같아. 즐거워 보였는걸.\""
1600505-30 = "그, 그렇습니까……? 잘은 모르겠지만…… 네……"
1600505-31 = "그, 그렇습니까……? 잘은 모르겠지만…… 네……"
1600505-32 = "확실히…… 여기 온 뒤로는 무언가 트리니티 때와는 다르다는 걸 느끼고 있지만……"
1600505-33 = "그래도 그게 좀…… 여러 모로 예상했던 것과는 판이하게 차이가 있어서……"
1600505-34 = "그것만으로도 정말 괜찮은 것일까…… 뭔가 틀린 게 아닐까…… 그런 생각도 조금 들었습니다만……"
1600505-35 = "[s5] \"원래 모르는 것들은 처음이 불안하지.\"\n[s6] \"하지만 지금의 츠루기는 꽤 좋은 표정을 하고 있으니까.\""
1600505-36 = "아, 네. 네에……"
1600505-37 = "아, 네. 네에……"
1600505-38 = "그럴지도 모르겠습니다……."
1600505-39 = "처음은 저도 모든게 혼란스럽기만 했습니다만……."
1600505-40 = "지금 다시 생각해 보면……. 결국 다 즐거웠던 걸지도……."
1600505-41 = "……"
1600505-42 = "케헤……"
1600505-43 = "케헤헤…… 그렇습니까. 네…… 저도 말씀대로 그런 거라는 느낌이 듭니다."
1600505-44 = "……선생님께서는 정말 모르시는 게 없으시군요. 저 혼자서는 끝까지 풀지 못했을 겁니다."
1600505-45 = "뭔가 괜한 고민을 하고 있었던 것 같은 기분입니다. 사실 제대로 하고 있었던 건데……"
1600505-46 = "하긴, 여기가 아니면 할 수 없는 것들도 많았죠. 선생님과 같이 뛰어놀았다던가……"
1600505-47 = "[s7] \"꽤 재밌었지.\"\n[s8] (어딘가 모양새는 좀 달랐지만……)"
1600505-48 = "……크큭…."
1600505-49 = "……크큭…."
1600505-50 = "……네."
1600505-51 = "여러모로……"
1600505-54 = "감사합니다. 선생님."
1600505-56 = "……여기에."
1600505-57 = "바다에 데려와 주셔서."
