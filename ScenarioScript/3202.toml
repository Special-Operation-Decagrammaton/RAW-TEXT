[translation]
3202-1 = "와라쿠 공주님의 특별한 공연 2"
3202-2 = "(그렇게 시간이 흘러, 치세의 <백귀야행 감사제> 공연 날이 밝았다.)"
3202-3 = "치세 님의 공연! 기대돼!"
3202-4 = "저번 감사제도 좋았지! 이번에는 어떨까?"
3202-5 = "뭐가 됐든, 사진도 잔뜩 찍어야지!"
3202-6 = "결국, 무대가 시작되기 직전까지도 이유를 물어보지 못했네."
3202-7 = "……그렇습니다."
3202-8 = "하지만, 치세 쨩이 숨기고 싶어 하는 것을 캐묻는 건 못 할 짓입니다."
3202-9 = "우린 그저 치세 쨩이 마음 놓고 공연할 수 있게 만드는 역할이니 말이죠."
3202-10 = "무대 밑에서 지켜볼 뿐이라는 거야?"
3202-11 = "지금처럼?"
3202-12 = "맞습니다. 무대 위에서 빛나는 것은 치세 쨩의 역할."
3202-13 = "치세 쨩의 마음을 알 수 없을지라도, 그것을 전력으로 서포트하는 것이 우리의 역할이겠지요."
3202-14 = "과연, 과연, 우린 암약하는 존재란 거지."
3202-15 = "냐하핫, 나도 그런 거 좋아해."
3202-16 = "니야 님은 조금 다른 것 같지만……."
3202-17 = "여기서는 치세 쨩을 믿고 지켜보도록 하죠."
3202-26 = "그럼, 지금부터 <백귀야행 감사제> 공연을 시작하도록 하겠습니다!"
3202-31 = "<백귀야행 감사제>는 백귀야행 연합학원의 전통적인 공연으로, 학원 종사자들에게 평소의 감사를 전하기 위해 진행되어 왔습니다."
3202-32 = "오늘 공연은 백귀야행 연합학원의 아이돌! 와라쿠 공주님! 와라쿠 치세 님께서 선보이겠습니다!"
3202-33 = "그럼 치세 님! 시작해 주시죠!"
3202-34 = "응, 좋아~"
3202-39 = "첫 번째는 우산을 이용한 무용입니다."
3202-40 = "백귀야행 연합학원의 공예품인 쪽 염색을 사용하여 불굴의 정신을 나타내는 남색의—"
3202-46 = "—아, 아니 분홍색 우산은……그, 그렇지! 버, 벚꽃을 연상케 합니다! 참으로 아름답군요!"
3202-50 = "다음은 백귀야행의 전통 방식대로 만들어진 멋진 코케시 인형이 등장할 차례—"
3202-54 = "—이 아니라! 귀, 귀여운 여우 인형과 다루마 오뚝이입니다!"
3202-59 = "냐하, 우리한테만 비밀로 한 건 아닌 것 같네."
3202-60 = "평소와 다른…… 전혀 색다른 감사제 축제……."
3202-61 = "이런 식이면 회장에 모인 분들도 수군수군…… 당혹스러워할 것이……!"
3202-62 = "꺄아! 치세 님! 귀여워!"
3202-63 = "역시 치세 님이야!"
3202-64 = "오늘의 치세 님도 최고!"
3202-66 = "……가 아닌 건 다행이지만. 그래도……!"
3202-71 = "이것으로 <백귀야행 감사제>의 순서는 드디어, 아니 아쉽게도 막바지에 도달했습니다."
3202-72 = "남은 것은 오늘의 주인공, 치세 님의 인사입니다."
3202-73 = "그럼 치세 님, 인사말을 부탁드립니다!"
3202-74 = "부디 예정대로……!"
3202-75 = "모두, 오늘 와 줘서 고마워~"
3202-79 = "사실은 말이야, 오늘 공연은 평소랑 달랐는데 모두 알아차렸을까~?"
3202-80 = "응, 맞아, 오늘은 특별히 감사를 전하고 싶은 사람들이 있어서~ 평소랑 조금 다르게 준비했어."
3202-81 = "그, 그랬군요! 어쩐지……!"
3202-82 = "그렇다면, 치세 님의 특별한 사람들이란, 과연 누구일까요!"
3202-83 = "그건~"
3202-85 = "니야 부장이랑, 카호 부부장이야~"
3202-90 = "네?!"
3202-91 = "어라, 어라라."
3202-95 = "응, 부장이랑 부부장은 언제나 내가 즐겁게 공연할 수 있도록 노력해 줘~"
3202-96 = "응, 그래서 오늘은 두 사람을 위한 공연인 거야~"
3202-97 = "그, 그렇다면 공연 소품이 평소와 달랐던 이유는……."
3202-98 = "저와 니야 님을 위해서……?"
3202-99 = "냐하하, 그런 거였나."
3202-100 = "확실히, 분홍색은 카호 쨩이 가장 좋아하는 색이고."
3202-102 = "인형 또한 저와 니야 님을 닮은 것으로 준비하셨군요."
3202-103 = "으, 응? 그거 진짜 닮아서 고른 거였어? 카호도 같은 생각?"
3202-104 = "구매한 오렌지 주스도…… 지금 보니 평소 니야 님이 즐겨 마시는 브랜드의 제품……."
3202-105 = "의식용 물잔을 대신한 캐릭터 컵도 제가 좋아하는 것이고,"
3202-106 = "심지어 푸딩까지 니야 님과 제 취향에 맞추다니……."
3202-107 = "으음~ 알고 보니 그런 거였나~ 응. 한 방 먹었어. 쑥스러운 걸~"
3202-108 = "고맙다는 말을 전해야겠네."
3202-109 = "그런데 진짜 다루마가 나랑 닮아서 고른 건 아니—"
3202-111 = "우아앙! 치세 쨩! 고마워요!"
3202-112 = "저는 그런 줄도 모르고 치세 쨩을 의심하고……!"
3202-113 = "응, 괜찮아."
3202-114 = "니야 부장, 카호 부부장. 항상 고마워."
3202-115 = "그러니까……."
3202-116 = "앞으로도 잘 부탁해?"
3202-118 = "네! 치세 쨩!"
3202-119 = "냐하하, 맡겨달라구~"
3202-121 = "저기, 그래서 다루마는……정말로……?"
3202-126 = "……라는 일이 있었어."
3202-127 = "[s1] \"카호와 니야가 감동했겠네.\"\n[s2] \"카호와 니야가 좋아해 줘서 다행이네.\""
3202-130 = "응, 카호 부부장은 눈물 주륵, 이었어."
3202-131 = "니야 부장도 감동의 도가니."
3202-132 = "작전 성공, 이야."
3202-133 = "[s] \"치세는 음양부의 모두를 좋아하는구나.\""
3202-134 = "응, 좋아해."
3202-135 = "나랑, 카호 부부장이랑, 니야 부장이랑, 언제나 함께."
3202-136 = "이렇게 모두 모여 음양부, 야~"
3202-138 = "와라쿠 공주님의 특별한 공연"
