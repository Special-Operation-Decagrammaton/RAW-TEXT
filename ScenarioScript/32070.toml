[translation]
32070-1 = "제7화;새로운 관점"
32070-3 = "어머나, 준코 씨와 아카리 씨까지."
32070-4 = "하루나……? 너도 잡혔어?"
32070-5 = "후후. 저는 10미터도 못 가서 포획당했습니다."
32070-6 = "……."
32070-7 = "그럼 무사히 탈출에 성공한 것은 이즈미 씨뿐인가요. 다행이군요, 우리들의 희생이 헛되지 않았네요."
32070-8 = "아니, 희생한 적이 있었던가……."
32070-9 = "과연 정의실현부. 트리니티의 무력 집단답군요. 얕잡아봐선 안 되었는데."
32070-10 = "그러니까!! 그 아카리가 구겨진 콜라 캔처럼 되어버렸잖아…… 무서워 죽는 줄 알았다고!"
32070-11 = "그러니까 왜 참치 같은 걸 먹자고 여기까지 와서는……!!"
32070-12 = "후후……. 그건 마치 이런 겁니다. 준코 씨. 아무도 없는 싱크대 수도에 물이 콸콸 흘러넘치는 걸 보면……."
32070-13 = "아니, 수도꼭지는 이제 됐으니까! 설명하지 마!"
32070-17 = "……우리는 어떻게 되는 거지?"
32070-18 = "(벌떡) 선도부에게 인계되지 않을까요?"
32070-19 = "깜짝이야! 아카리, 기절한 거 아니었어?!"
32070-20 = "후후. 이 정도의 대미지야 별거 아니죠★"
32070-21 = "그, 그치만 선도부에 인계라니…… 역시 그런 결말이겠지? 싫어……. 생각만해도……. 으으……."
32070-22 = "이건 사면초가군요……. 그 히나 씨의 손에 우리의 운명이 맡겨지게 되는 것만큼은 피하고 싶었는데……."
32070-23 = "이번엔 제가 생각해도 좀 많이 무모했으니까요★ 뭐, 운명을 받아들여야죠."
32070-27 = "(아무래도 좋으니까 빨리 집에 보내줘……)"
32070-29 = "트리니티 자치구 경계 부근"
32070-30 = "(한편 그 시간, 이즈미는…….)"
32070-31 = "여, 여기가 어디지……? 으, 으아앙. 어디로 가야 해?!"
32070-36 = "수고하셨습니다, 선생님. 그리고 보충수업부 여러분. 덕분에 소요 사태를 무사히 해결할 수 있었습니다."
32070-37 = "아, 아하하…… 뭐, 뭔가 정신이 없어서……."
32070-38 = "아니, 좋은 공부가 되었어. 정의실현부의 전술도 파악할 수 있었고."
32070-39 = "도, 도움이 되었는지 모르겠지만……."
32070-40 = "이제 저 분들은 어떻게 되는 거죠?"
32070-41 = "원래라면 저희 쪽에서 신병처리의 권한을 가지게 되겠지만, 지금은 아무래도 때가 때이니만큼, 선도부를 부를 예정입니다."
32070-42 = "[s] \"게헨나 선도부를…….\""
32070-43 = "네. 여기서부터는 선생님께 부탁이 있습니다만……."
32070-44 = "[s] \"부탁? 어떤 거야?\""
32070-45 = "에덴조약을 앞두고 있는 시기이니만큼, 저희 쪽에서 적극적으로 이 사태에 나서는 것은 부담이 됩니다."
32070-46 = "저쪽 선도부에서 사람들이 와서 학생을 인계하는 일을, 선생님이 맡아주실 수 있을까요?"
32070-47 = "<샬레>가 학생들을 인계해주는 형태라면, 저희나 게헨나 모두에게 정치적 부담은 훨씬 적어질 것입니다."
32070-48 = "[s] \"맡겨줘.\""
32070-49 = "네. 고맙습니다. 선생님. 그럼 여기서는 저희가 물러나 있겠습니다."
32070-51 = "트리니티 자치구 외곽 브릿지"
32070-52 = "(미식연구회를 데려갈 선도부 차량을 기다리고 있었다.)"
32070-60 = "……도착했습니다. 시체들은 어디에 있습니까?"
32070-61 = "[s] \"시체……?\""
32070-62 = "……실례. 시체가 아니라 부상자였죠. 가끔씩 헷갈려서."
32070-63 = "어디…… 납품 품목은 신선한 부상자 3명과 인질 한 명…… 이라고 적혀있습니다만."
32070-64 = "[s] \"신선한……? 납품……?\""
32070-65 = "……. 그런데 당신은 정의실현부가 아니군요. 누구시죠?"
32070-66 = "[s] \"그러는 너도 선도부가 아닌 거 같은데…….\""
32070-72 = "저 사람은 [USERNAME] 선생이야. <샬레>의 고문이지."
32070-76 = "[ns] \"히나다!\""
32070-77 = "오랜만이야. 선생. 또 보게 되네. ……그런데 여기서 뭐하고 있는 거야?"
32070-78 = "아는 사이였습니까, 선도부장."
32070-79 = "응……. 뭐, 그렇지……."
32070-81 = "과연. 그쪽도 정치적 무게를 지기 싫은 거군. 그래서 선생에게 이런 일을 맡긴 건가."
32070-82 = "그건 이쪽도 마찬가지야. 그래서 여기 문제아들을 인계받는 것도 공식적으로는 선도부가 아닌 <응급의학부>가 온 거고."
32070-83 = "……응급의학부장 히무로 세나입니다. 잘 부탁드립니다. 선생님."
32070-84 = "시체…… 아니, 부상자가 있다면 언제든지 불러주시면 감사하겠습니다. 배송비는 받지 않을 테니."
32070-85 = "[s] \"으, 으응…….\""
32070-86 = "응급의학부는 게헨나에서도 특별히 정치적 입지가 거의 없는 동아리라서 오늘은 공식적으로 선도부 대신 온 거야."
32070-87 = "정치 놀음은 선도부장이 하면 됩니다. 저는 시체 말고는 관심없으니까."
32070-88 = "부상자겠지. 진짜 시체를 본 적도 없잖아."
32070-89 = "네. 부상자. 선도부장도 없지 않습니까."
32070-93 = "미식연구회는 여기에 있나? 이쪽 엠뷸런스에 옮겨 태우도록 해."
32070-98 = "……후후후. 히나 씨. 오랜만이네요."
32070-99 = "……. 하아. 하루나. ……아니, 자세한 이야기는 가서 하지."
32070-100 = "어머나, 역시 응급의학부가 와주었군요★ 제 팔 각도가 좀 이상한데 봐주시겠어요?"
32070-101 = "으으……. 토할 거 같아……."
32070-102 = "하아……. 드디어 살았어……."
32070-103 = "급양부장……? 오늘 하루종일 안보인다고 했더니 여기 같이 있었던 거야?"
32070-104 = "지금 주리가…… 아니, 설명은 가면서 하고."
32070-105 = "미식회의 한 명이 안보이는데, ……뭐 상관없나."
32070-107 = "배려해 주셔서 감사합니다, 선생님. 다음에 게헨나에 오시면 맛있는 걸 대접해드릴게요."
32070-108 = "다음에 뵈어요★"
32070-109 = "……시끄러우니까 얼른 들어가."
32070-110 = "[s] \"조심해서 가…….\""
32070-114 = "……적재 완료 했습니다. 출발 준비 완료."
32070-115 = "그래. 조금만 기다려 줘."
32070-116 = "……."
32070-117 = "선생……. 트리니티에서 뭘 하고 있는 거야?"
32070-118 = "[s] \"보충수업부의 담임이랄까…….\""
32070-119 = "아니, 그건 이미 알고 있어. 이런 저런 정보를 듣게 되니까……."
32070-120 = "<샬레>는 중립 조직 아니었어? 왜 이 시기에 트리니티에 가 있는 거야? 설마 그쪽에……."
32070-121 = "[s] \"……….\""
32070-122 = "……. 아니, 선생이 그럴 리는 없겠지."
32070-123 = "[s] \"히나. 궁금한 게 있어.\""
32070-124 = "으, 으응? 궁금한 거……?"
32070-125 = "[s] 에덴조약에 대해서 히나의 관점을 물어본다."
32070-128 = "(히나에게 지금 처한 상황에 대해서 상세하게 설명했다.)"
32070-140 = "……과연. 꽤 복잡한 상황에 빠져있구나. 선생……."
32070-141 = "……아니, 잠깐만. 뭔가 이상한 장면이 끼어있지 않았어?"
32070-142 = "[s1] \"기분 탓이야.\"\n[s2] \"아무튼 기분 탓이야.\""
32070-143 = "……."
32070-144 = "……."
32070-145 = "뭐, 아무튼."
32070-146 = "<트리니티의 배신자> 라니, 이상한 사건에 휘말려 있네. 선생도."
32070-147 = "수많은 누구의 말이 진실인지, 누가 거짓말을 하고 있는지 알 수 없는 상황인 건가……."
32070-148 = "[s3] \"진실에는 여러 관점이 있다고 생각해.\"\n[s4] \"진실이 단 하나뿐인 건 아니니까.\""
32070-149 = "……. 신중한 건지, 낙천적인 건지……."
32070-150 = "……. 신중한 건지, 낙천적인 건지……."
32070-151 = "……그런데 이런 일들을 나에게 쉽게 얘기해도 괜찮은 거야?"
32070-152 = "[s] \"응. 히나는 누구보다 믿고 있으니까.\""
32070-153 = "……."
32070-154 = "그런 게 선생의 나쁜 버릇이야."
32070-155 = "[s] \"……?\""
32070-156 = "……아니, 혼잣말이야."
32070-157 = "에덴조약이 군사동맹이라. 그것도 재미있는 관점이네."
32070-158 = "하지만 난 거기에 대해선 부정적이야. 그건 어디까지나 평화 조약이 맞아."
32070-159 = "[s] \"……맞다고?\""
32070-160 = "……. 조약을 통해 새롭게 생기게 되는 무력집단 ETO, 그건 나기사가 혼자서 통제할 수 있는 조직이 아니야."
32070-161 = "만마전의 의장인 마코토도 나기사와 동일한 권한을 가지게 되니까."
32070-162 = "그리고 다른 티파티의 멤버들이나, 만마전의 의원들도 어느정도 권한이 나누어질 테니, ETO가 본래의 목적을 잊고 폭주하는 일은 없을 거야."
32070-163 = "물론 그들 모두가 다같이 협력한다면 이론적으로는 가능할 수는 있겠지만……."
32070-164 = "애초에 그런 게 가능했다면 그냥 두 학원의 통합을 추진하는 게 맞았겠지."
32070-165 = "마코토 또한 누군가와 협력한다…… 라는 것이 불가능한 녀석이고."
32070-166 = "[s] \"그럼 마코토는 왜 에덴조약에 동의하는 거야?\""
32070-167 = "그 녀석은 아마, 아무 생각이 없었을 거야. ……게헨나에서 에덴조약을 추진한 건 나였으니까."
32070-168 = "[s] \"히나가……? 어째서?\""
32070-169 = "……글쎄. 은퇴……?"
32070-170 = "ETO가 생긴다면 지금보다 훨씬 더 게헨나에 질서가 잘 유지될 수 있을 거야. 그때는 내가 선도부장이 아니어도 괜찮겠지."
32070-171 = "[s] \"………….\""
32070-172 = "선도부장. 아직입니까? 기다리고 있는 중입니다."
32070-173 = "……아아. 지금 가."
32070-174 = "그럼 선생님. 수고하도록 해."
32070-181 = "……보충수업부는, 선생님이 지켜주고 있는 거지?"
32070-182 = "[s] \"응. 지켜줄 거야.\""
32070-183 = "……. 그렇군."
32070-185 = "……아니, ……아무것도 아냐. 그럼. 다음에 또."
32070-194 = "아우우…… 뭐, 뭔가 엄청 정신없는 하루였네요……."
32070-195 = "그러게요. 밤산책이 이렇게 길어질 줄은……."
32070-196 = "음. 재미있었어."
32070-197 = "……헤헤헤."
32070-198 = "코하루 쨩은 엄청 기뻐 보이네요? 역시 하스미 씨를 도울 수 있어서 그런가요?"
32070-199 = "다, 당연하지! 하스미 선배랑 같이 싸우는 거…… 처음이었으니까……."
32070-201 = "내가 도움이 될 수 있었다니…… 다행이야! 아하하하, 엄청 기뻐."
32070-202 = "우후후♡ 다행이네요. 이제 하스미 씨가 부탁한대로 낙제만 면하면……?"
32070-203 = "다, 당연하잖아! 그것도 금방 할 수 있어! 나, 나는 엘리트니까!"
32070-204 = "……그러네요. 저도 좀 더 반성하고 분발해야겠네요♡"
32070-208 = "아하하……. 이제 밤도 늦었으니까 슬슬 쉬지 않으면 내일 공부에 지장이 생길 테니……."
32070-209 = "오늘은 이걸로 마무리를 하시죠……. 수고하셨습니다, 선생님."
32070-210 = "[s] \"모두 수고했어.\""
32070-212 = "(그렇게 긴 하루가 지나고 있었다…….)"
32070-214 = "다음화;보이기 시작하는 희망"
