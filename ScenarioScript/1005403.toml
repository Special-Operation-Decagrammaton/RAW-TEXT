[translation]
1005403-1 = "벤치 위의 시스터"
1005403-6 = "스타디움 트랙 옆"
1005403-7 = "(걱정이 돼서 마리가 있다는 스타디움의 트랙 한쪽을 찾아갔다.)"
1005403-8 = "(마리는 벤치 한쪽 구석에서 모든 것을 새하얗게 불태운 듯 주저앉아 있었다.)"
1005403-14 = "하아, 하아……. 하아……. 하아……."
1005403-15 = "하하하……. 세상이 새하얗네요……."
1005403-16 = "의식이……. 아아. 저기 먼 곳에서 어떤 분이 손을 흔들고 계셔요……."
1005403-20 = "[ns1] \"마, 마리……!?\"\n[ns2] \"괜찮니!? 뭔가 많이 힘들어 보이는데……!?\""
1005403-23 = "……!?"
1005403-24 = "어, 어어!? 서, 선생님!? 어, 언제부터……!?"
1005403-27 = "[wa:500]― 하아, [wa:1300]하아……."
1005403-28 = "[wa:1300]― 죄송해요, [wa:700]선생님……."
1005403-31 = "[wa:1400]― 이런 모습을……. [wa:1700]하아……."
1005403-32 = "[wa:1100]― 보여드리려던 건 [wa:1200]아니었는데……."
1005403-35 = "[wa:2100]― 죄송해요."
1005403-36 = "[wa:1800]― 우선은……. [wa:1400]진정을 좀……. [wa:1000]하고 나서……."
1005403-39 = "― 하아……. [wa:2700]후우……."
1005403-42 = "[ns3] \"우선 좀 쉬자. 내가 해줄 수 있는 게 있을까?\"\n[ns4] \"괜찮아? 필요한 게 있으면 뭐든 말해줘.\""
1005403-43 = "[wa:200]― 네……!?"
1005403-44 = "[wa:200]― 네……!?"
1005403-45 = "[wa:700]― 아, [wa:500]그게, [wa:800]딱히 [wa:300]그런 의미는……!"
1005403-48 = "[wa:500]― 마, [wa:400]말씀만으로도 [wa:1500]정말 [wa:300]감사합니다……. [wa:1600]네……."
1005403-51 = "[wa:1300]― (선생님께서……. [wa:1400]저를 [wa:900]신경 써주시다니…….)[wa:50]"
1005403-54 = "[wa:1800]― (이런 일은, [wa:1350]상상도 [wa:350]하지 못했어요…….)"
1005403-57 = "[wa:2500]― 저……. [wa:1500]이런 일,"
1005403-58 = "[wa:1200]― 말씀드려도 [wa:200]괜찮을지 [wa:1200]모르겠지만……."
1005403-61 = "[wa:1000]― 선생님을 [wa:600]독차지하고 있는 것 [wa:600]같아서……."
1005403-62 = "[wa:1800]― 이러면, [wa:1310]벌을 받을지도 [wa:1000]모르겠지만… [wa:2050]그치만……."
1005403-65 = "[wa:1000]― 저……. [wa:1500]이 시간이……."
1005403-66 = "[wa:1500]― 너무 [wa:300]행복[wa:1200]해요!"
1005403-70 = "감사합니다, 선생님. 덕분에 한결 나아진 거 같아요."
1005403-71 = "……네? 어쩌다가 이렇게 된 거냐고요? 으음. 딱히 뭔가 대단한 걸 한 건 아닌데……."
1005403-72 = "그냥 다른 분들 좀 도와 드리고……. 제가 출전하는 종목들 가서 열심히 뛰고……."
1005403-73 = "[s5] \"경기를 뛰면서 다른 사람까지 도운 거야?\"\n[s6] \"너무 무리하면 안 돼, 마리. 그러다 다쳐.\""
1005403-76 = "죄, 죄송해요……. 아무래도 역시 계속 눈에 밟히다 보니……."
1005403-77 = "곤란해하고 있는 분들을 지나치는 건, 아무래도 좀 무리라서……. 하하하……."
1005403-78 = "……그치만, 말씀대로 오히려 선생님께 걱정을 끼쳐버렸네요."
1005403-79 = "다음부터는 주변의 진행 요원분들이나 선생님께 부탁드리도록 할게요."
1005403-80 = "……네?"
1005403-81 = "잘 즐기고 있냐고요……? 저 말씀이신가요?"
1005403-82 = "……네! 정말로요! 기대했던 것보다 훨씬 더 즐거워요. 이렇게 힘이 다 빠질 정도로!"
1005403-83 = "사실 시작하기 전에는 기대보다 걱정이 훨씬 더 많았었지만……."
1005403-84 = "막상 시작해 보니, 운동이라는 거, 뭔가 개운하고 시원한 느낌이 들어요!"
1005403-85 = "어쩌면 끝나고 나서도 종종……. 여유 있을 때 해보고 싶은 정도예요!"
1005403-86 = "…어……."
1005403-87 = "그, 그러고 보니…… 선생님은요? 선생님께선 딱히 어디 출전하시고 그러지 않으시죠?"
1005403-88 = "계속 저희 뒷바라지만 해주시는 거 같은 느낌이 드는데……. 으음……."
1005403-89 = "죄송해요. 저희만 신나게 즐기는 거 같아서……."
1005403-90 = "[s7] \"그렇지 않아. 나도 해야 할 일인 걸.\"\n[s8] \"나도 충분히 즐기고 있으니 걱정하지 마.\""
1005403-91 = "……선생님……."
1005403-92 = "네? 그, 그런 가요……? 뭔가 잘 모르겠지만……."
1005403-93 = "선생님께선 늘 이런 식으로 저희를 챙겨주시는군요. 정말이지 어떻게 다 감사로 보답드려야 할지 모르겠어요."
1005403-97 = "……선생님."
1005403-103 = "혹시 나중에, 무슨 일일지는 아직 잘 알 수는 없지만."
1005403-104 = "무엇이든 필요하신 일이 있으시면 언제든 불러주세요. 저도 한 번쯤은 꼭 선생님께 도움이 되고 싶어요."
1005403-105 = "네? 괜찮으시죠? 약속해 주실 수 있으신가요?"
1005403-106 = "[s9] \"그래. 기대할게.\"\n[s10] 새끼손가락으로 약속한다."
1005403-109 = "……!!"
1005403-110 = "약속하신 거예요, 선생님! '꼭'이에요!"
1005403-111 = "……후후."
1005403-112 = "그날을 기다릴게요!"
1005403-114 = "(활기가 돌아온 마리는 힘차게 자리에서 일어나 다음 종목을 하러 달려 나갔다.)"
1005403-115 = "(이후 마리가 계속 앉아 있던 자리로 슬그머니 옮겨 앉았더니…….)"
1005403-120 = "(……어디선가 공이 날아와 얼굴에 부딪혔다.)"
