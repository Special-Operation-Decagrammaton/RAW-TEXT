[translation]
2300002-1 = "점심 대신 디저트"
2300002-2 = "샬레 집무실"
2300002-4 = "(외근을 끝내고 돌아온 샬레의 집무실 책상엔 다양한 서류들이 잔뜩 쌓여 있었다.)"
2300002-5 = "(결국 점심도 거른 채 책상에 쌓인 서류들을 정리했다.)"
2300002-8 = "선생님, 계신가요?"
2300002-12 = "선생님, 안녕하세요!"
2300002-13 = "오늘도 좋은 하루 보내고 계신가요?"
2300002-14 = "[s1] \"아하하, 글쎄…….\"\n[s2] 말없이 책상을 응시한다."
2300002-15 = "음? 이렇게 많은 일을 하시는 거예요?"
2300002-16 = "음? 이렇게 많은 일을 하시는 거예요?"
2300002-17 = "우와…… 어른은 대단하네요……."
2300002-18 = "참! 점심은 드셨나요?"
2300002-19 = "네? 아직 못 드셨다고요?"
2300002-20 = "후, 후, 후."
2300002-21 = "제가 그럴 줄 알고 선생님을 위해 디저트를 준비해 왔어요!"
2300002-22 = "마침 오늘 <카페 밀피유>에서 신메뉴가 나왔거든요!"
2300002-23 = "선생님과 함께 먹고 싶어서 이것저것 사왔어요."
2300002-25 = "짜잔~!"
2300002-26 = "(아이리의 가방에서 다양한 형태의 컵 케이크가 쏟아져 나왔다.)"
2300002-27 = "이번에 나온 신상 컵케이크들이에요!"
2300002-28 = "어때요? 선생님? 너무 맛있어 보이지 않나요?"
2300002-29 = "자! 이건 라즈베리가 들어간 컵케이크예요!"
2300002-30 = "시식용으로 조금 먹어 봤는데…… 과연 라즈베리랄까……"
2300002-31 = "이 새콤함은 어디에서도 볼 수 없는……!"
2300002-33 = "그리고 이건, 바나나가 들어간 컵케이크!"
2300002-34 = "따로 시식용이 없어서 먹어보진 못했지만, 그냥 색이 예뻐서 사봤어요!"
2300002-35 = "그리고 이건……."
2300002-37 = "민트 초코 컵케이크!"
2300002-38 = "사실, 이 컵케이크는 원래 있던 메뉴인데요."
2300002-39 = "제가 먹고 싶어서 사왔어요."
2300002-40 = "초콜릿의 달콤함과, 민트의 깔끔하고 시원함이 함께하는……."
2300002-41 = "……."
2300002-42 = "[s3] \"아이리?\"\n[s4] \"학생, 정신차려.\""
2300002-43 = "……아앗!?"
2300002-44 = "……아앗!?"
2300002-45 = "아하하하…… 잠깐 다른 세계에 다녀왔네요."
2300002-46 = "그럼, 뭐부터 드시겠어요, 선생님?"
2300002-48 = "(이후, 아이리와 함께 컵케이크를 먹으며 여러 메뉴에 대한 설명을 들으며 시간을 보냈다.)"
2300002-49 = "(아무래도 쌓여있는 서류 업무는 다음에 해야할 것 같다.)"
