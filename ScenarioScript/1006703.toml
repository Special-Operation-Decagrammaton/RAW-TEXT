[translation]
1006703-1 = "존재의 이유"
1006703-2 = "샬레 집무실"
1006703-4 = "오늘도 샬레는 평화롭군요. 좋은 일입니다."
1006703-5 = "아, 선생님. 그쪽의 감자칩 좀 집어 주시겠습니까?"
1006703-10 = "[ns1] \"……토키가 마음 편히 지내는 건 좋은데 말이야……\"\n[ns2] \"지나치게 편히 지낸다는 생각도 든단 말이지?!\""
1006703-14 = "음? 그건 중대한 문제인가요? 아니라고요?"
1006703-15 = "그렇다면 크게 신경 쓸 일은 아니군요. 괜찮습니다. 제가 먹은 감자칩은 제 손으로 보충해 두겠습니다."
1006703-17 = "(최근 한 가지 고민거리가 생겼다.)"
1006703-18 = "(다름이 아니라…… 토키가 샬레를 너무 편하게 생각하고 있다는 것이다.)"
1006703-19 = "(이 문제에 대해서는, 며칠 전에도 토키와 진지하게 이야기를 나누어 보았으나……)"
1006703-21 = "왜 샬레를 계속해서 찾아오냐고요?"
1006703-22 = "여러 가지 이유가 있겠습니다만, 가장 큰 이유는 지금 제 소속이 명확하지 않기 때문입니다."
1006703-23 = "그 덕에 저는 C&C 소속, 콜사인 제로포의 이름을 받았으면서도 선배들과 함께 행동하기 어려운 상황이지요."
1006703-24 = "그런 저에게 이곳, 샬레만큼 효율적인 장소는 없습니다."
1006703-25 = "여기에서라면 곧바로 명령을 받을 수도 있고, 각종 상황과 정보가 모여들므로 즉각적인 대처를 취할 수도 있죠."
1006703-26 = "이런 상황에서는, 저뿐만이 아니라 누구라도 샬레에서 대기하는 것을 택할 것이라고 생각합니다만, 아닌가요?"
1006703-28 = "(토키는 오히려 이쪽의 할 말을 잃게 만들었다.)"
1006703-29 = "(그리고 다시 현재로 돌아와……)"
1006703-31 = "음. 너무 짠 것만 먹었더니 목이 마르는군요. 선생님. 거기 있는 녹차, 마시겠습니다."
1006703-41 = "아, 찻줄기가 섰군요. 오늘은 좋은 일이 있을지도 모릅니다."
1006703-42 = "향이 좋고 맛이 부드럽네요. 선생님께서 녹차에 조예가 있으신 줄은 몰랐습니다."
1006703-43 = "[s] \"어…… 일단은 선물 받은 건데……?\""
1006703-44 = "그렇습니까. 예상대로의 대답이군요. 조금 실망했습니다."
1006703-45 = "[ns] \"어째서?!\""
1006703-46 = "그러고 보니 오늘 점심은 어떤 메뉴로 하실 건가요?"
1006703-47 = "아뇨, 저는 상관없습니다. 선생님께서 1인분만 주문하셔서 혼자만의 식사를 만끽하신다고 해도."
1006703-48 = "저는 지극히 정상일 겁니다. 심경의 변화도, 기분의 급격한 요동침도 없을 테지요."
1006703-56 = "[ns3] \"실례합니다. 샬레입니다만……\"\n[ns4] \"스페셜 헬시 런치 세트 2인분이요……\""
1006703-59 = "어라. 2인분을 주문하셨군요."
1006703-60 = "어쩔 수 없네요. 제가 함께 먹어 드리겠습니다."
1006703-61 = "[s] \"응…… 야채도 단백질도 같이 먹어야, 건강에 좋으니까……\""
1006703-62 = "그렇게 말씀하시면, 평소에 제가 건강에 좋지 않은 과자만 먹고 있는 것처럼 들리지 않습니까."
1006703-63 = "[s] \"아니었어……?\""
1006703-64 = "……"
1006703-65 = "과거는 과거입니다. 잊어야 할 것들은 빨리 잊고, 우리 함께 희망찬 미래를 향해 나아가죠."
1006703-66 = "[s] \"최소한 변명이라도 생각해 줘!\""
1006703-72 = "[ns] \"그러고 보니 토키는.\""
1006703-74 = "부르셨습니까?"
1006703-75 = "네. 그야 물론, 저는 날이 저물면 제 오피스로 돌아갑니다."
1006703-76 = "그러면 오피스에서 대기하면 되는 것 아니냐고요?"
1006703-77 = "……"
1006703-78 = "선생님께서는, 제가 여기 있는 것이 부담되거나, 방해되시나요……?"
1006703-79 = "[s5] \"아니아니! 그런 건 절대 아니니까!\"\n[s6] \"이렇게 아무것도 없는 곳에 와도, 토키가 즐거울 것 같지가 않아서!\""
1006703-82 = "특별히 그렇게 느끼지는 않습니다만."
1006703-83 = "어쨌든, 그렇다면 계속 여기에 있어도 되는 것 아닌가요?"
1006703-84 = "[s] \"그렇게 이야기하면 할 말이 없긴 한데……\""
1006703-85 = "그럴 거라고 생각하고 있었습니다."
1006703-86 = "네? 그렇지만 샬레에 대한 괴소문이 걱정되신다고요?"
1006703-88 = "(여기에서 잠깐. 샬레에 대한 괴소문이란……)"
1006703-90 = "소식 들었어요? 샬레의 선생님이라는 분, 최근에는……"
1006703-91 = "들었어요, 들었어요. 출입하는 학생들에게 바니걸 복장을 입히고…… 그걸 즐긴다면서요?"
1006703-92 = "좋으신 분이라고 들었는데, 사람은 정말 모르는 거네요……"
1006703-93 = "당장 어제만 해도, 바니걸 차림으로 샬레에 들어가는 학생을 보았다고 하니……"
1006703-94 = "(……같은 것이었다.)"
1006703-98 = "(그런 것들을 토키에게 이야기하자……)"
1006703-99 = "음. 별것 아니군요. 사실과는 무관한, 뜬소문들 아닙니까."
1006703-100 = "우선 바니걸 복장으로 드나드는 학생은 저 한 명뿐이니, 출입하는 '학생들'이 바니걸 복장을 입고 있는 것은 아닙니다."
1006703-101 = "그리고 선생님이 그것을 즐기는 것도 아니니, 사실과는 완전히 어긋납니다."
1006703-102 = "……아니면 혹시, 남몰래 즐기고 계신가요?"
1006703-103 = "[ns] \"절대로 아닙니다! 네!\""
1006703-104 = "그렇게 대답하실 줄 알았습니다."
1006703-105 = "아무튼, 완전한 허구임이 명백한 소문들에 대해, 일일이 대응할 필요는 없다고 생각합니다."
1006703-106 = "그러므로 이 의제는 여기에서 종결, 이라고 봐도 되겠지요."
1006703-107 = "[s] \"정말로 괜찮을까……\""
1006703-108 = "괜찮습니다. 저는 아무 문제없습니다."
1006703-109 = "네? 선생님의 이미지가 문제라고요? 음…… 잘 모르겠군요. 저는 판단을 중지하겠습니다."
1006703-114 = "아, 배달 음식이 도착한 모양이군요."
1006703-118 = "제가 나가 보겠습니다."
1006703-122 = "선생님? 왜 그렇게 사색이 되셔서 일어서시는 거죠? 네? 선생님이 직접 나가시겠다고요?"
1006703-123 = "……"
1006703-124 = "알겠습니다. 선생님께서 왜 그러시는지는 모르겠습니다만……"
1006703-126 = "(토키와 함께, 오늘따라 잘 소화되지 않는 점심을 먹었다……)"
