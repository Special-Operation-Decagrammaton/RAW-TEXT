[translation]
1300705-1 = "빈곤한 미식회"
1300705-2 = "샬레 집무실"
1300705-5 = "다녀왔어……."
1300705-6 = "으으, 이번 조사는 최악이었어. #n최고급 품질의 와규를 뷔페로 먹을 수 있는 가게가 있다고 기대했었는데……."
1300705-7 = "설마 오늘이 정기 휴일이었을 줄이야! 상상도 하지 못했어!"
1300705-8 = "불고기를 잔뜩 먹을 수 있을 줄 알고 점심은 부실하게 먹었는데. #n으으, 배고파……."
1300705-9 = "선생님, 뭔가 먹을만한 거 없어? 배고프단 말이야~."
1300705-10 = "[s] \"지금 가지고 있는 음식이라면…….\""
1300705-11 = "으응? 이게 뭐야? 밋신의 치킨라멘?"
1300705-12 = "아, 먹어본 적은 없지만 알고 있어. #n컵에 넣고 뜨거운 물을 부어서 먹는 인스턴트 라멘이잖아?"
1300705-13 = "아무리 배가 고프다지만 미식가인 나에게 이런 싸구려 인스턴트 음식은 조금……."
1300705-14 = "[s] \"싫으면 먹지 않아도 괜찮아.\""
1300705-15 = "아, 안 먹겠다고 말한 적은 없거든? 돌려줘!"
1300705-16 = "으음…… 컵에 면을 넣고 끓는 물을 붓고 3분이라……."
1300705-17 = "스프도 고명도 없는 이런 싸구려 라멘이 맛있을 리가……."
1300705-21 = "(뭐야, 맛있잖아?!)"
1300705-22 = "(조미된 유탕면 특유의 고들고들한 식감이 이렇게나 매력적일 줄이야…….)"
1300705-23 = "(게다가 면에서 우러나온 감칠내가 잔뜩 배인 국물까지…… 생각했던 것 이상이야!)"
1300705-24 = "[s] \"맛은 어때? 괜찮아?\""
1300705-25 = "그, 그럭저럭 먹을 만하네! #n미식가인 내 기준에는 한참 모자라지만 말이야! 하, 하하!"
1300705-26 = "그나저나 양이 너무 적은 것 같은데…… 혹시 하나 더 있어?"
1300705-27 = "차, 착각 하지마! 맛있어서 계속 먹는 게 아니니까!"
1300705-28 = "그냥 배가 너무너무 고파서 어쩔 수 없었던 거니까! 오해하지 말라고!"
1300705-30 = "이후, 준코는 두 개째의 치킨라멘을 깨끗이 비우고는 하나를 더 먹었다."
