[translation]
51095-8 = "……!"
51095-14 = "[ns] \"유카리, 괜찮아?!\""
51095-20 = "저, 저는…… 전……."
51095-23 = "이것으로 이제 잘 알겠지. 나는 돌아가지 않는다는 걸."
51095-24 = "백화요란은, 우리들은 원래대로 돌아갈 수 없다는걸."
51095-25 = "………"
51095-27 = "하지만 오해하지 마. 유카리……"
51095-28 = "넌 애당초 우리와 달라. 백화요란으로 돌아갈 필요 없이."
51095-29 = "유카리 너에겐 돌아갈 곳이──"
51095-30 = "………!"
51095-31 = "읏."
51095-32 = "[s1] \"렌게, 유카리는 네가 도와줄 거라고 믿고 여기까지 왔어.\"\n[s2] \"……여기서는 좀 더 이야기를 들어주지 않을래?\""
51095-35 = "아니, 이 이상의 말은……"
51095-40 = "역시 됐어."
51095-41 = "유카리. 선배로서 충고 하나 해둘게."
51095-42 = "괜한 힘 빼지 말고. 지금이라도 청춘을 즐겨두는 게 좋을 거야."
51095-43 = "이미 끝나버린 동아리에 매달리기엔…… 시간이 아까우니까."
51095-48 = "……대화는 이걸로 끝이야."
51095-53 = "레, 렌게 쨩! 잠깐만요!"
51095-54 = "앗, 저기……! 어, 어쩌지?!"
51095-55 = "……선생님, 우린 먼저 가볼게."
51095-56 = "[s] \"응. 다들, 렌게를 부탁할게.\""
51095-63 = "………렌게 선배……."
51095-65 = "(그렇게 렌게와 수행부가 멀리 사라질 때까지, 유카리는 자리에서 움직이지 못했다.)"
51095-67 = "다음화;붉어진 뺨"
