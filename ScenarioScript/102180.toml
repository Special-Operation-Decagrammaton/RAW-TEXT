[translation]
102180-1 = "제18화;인법연구부의 특별 임무"
102180-10 = "우, 우와앗-?! 부장, 여기도 가로막혔어요!"
102180-11 = "크, 크윽…… 어떻게 된 거지…… 대설원은 분명 비교적 안전하다고 했는데……."
102180-12 = "도착하자마자 이 녀석들이 이렇게나 몰려와선……."
102180-13 = "서, 설마…… 저, 저희를 쫓아온 걸, 까요?"
102180-14 = "네?! 저희를 말인가요? 이즈나들의 특별 임무를 어떻게 알고……."
102180-15 = "아냐, 그럴 리 없어! 그 임무는 아무도 모르는 비밀로 했는데……."
102180-17 = "……키킥킥킥."
102180-25 = "이, 이쪽에도…… 포위되어 버렸어요! 어쩌죠, 부장?"
102180-26 = "이, 이대로라면…… 저희는……."
102180-27 = "우냐아앗! 모두! 약한 소리 하지 마!!"
102180-28 = "부장님……."
102180-30 = "부장……."
102180-31 = "<샬레>의 선생 공이 우리 인법연구부를 믿고 맡긴 임무잖아! 그게 고작 이 정도의 위기로 실패할 리가 없어!"
102180-32 = "<닌자란! 자고로 한번 약속한 것은 반드시 지키는 법!>"
102180-33 = "츠쿠요, 이즈나! 닌자를 통해 맺어진 우리들의 인연의 힘을 보여주는 거야!"
102180-34 = "……인연의 힘, 네! 부장님!"
102180-35 = "넵! 이즈나도 주군과의 약속, 반드시 지키겠어요!"
102180-36 = "자아, 그럼 간다……!!"
102180-41 = "미치루류 인법……!!!"
102180-42 = "이즈나류 인법……!!"
102180-43 = "츠, 츠쿠요류 인법……."
102180-50 = "좋아!! 지금이다!!"
102180-51 = "초무적철갑 토라마루!!"
102180-52 = "강하!!!"
102180-53 = "그 이름 좀 제발……. 하아……"
102180-54 = "네. 강하. 갑니다."
102180-68 = "……? 어, 어라……?"
102180-69 = "이 소리는……."
102180-71 = "부장!! 츠쿠요 공! 위를 보세요! 비행선이 지나가고 있어요!"
102180-72 = "뭐, 뭐야, 저거?! 뭔가 떨어지고 있잖아?!"
102180-80 = "대, 대체 뭐가……."
102180-81 = "이, 이건……."
102180-82 = "태, 탱크……?! 탱크가 떨어졌어요?"
102180-91 = "키키키키키키키킥-! 정확한 타이밍이었다, 이로하!"
102180-92 = "아하하하하, 응! 엄청 재밌어! 강하!"
102180-93 = "……하아, 네네. 그런데 저희 여긴 왜 온 거예요, 선배?"
102180-94 = "뭐야, 모르는 거냐? 위기에 처한 동료를 타이밍 좋게 구하러 온 거잖나!"
102180-95 = "……네?"
102180-96 = "그래, 정의의 아군이 되기 위해서지!! 그것도 이부키가 좋아하는 닌자들을 위해서 말이다!!"
102180-97 = "안녕, 닌자 언니들! 이부키가 도와주러 왔어-!!"
102180-99 = "앗……! 저 목소리는……."
102180-100 = "이, 이부키……?!"
102180-101 = "이로하 씨까지…… 어, 어떻게 여기까지……?"
102180-103 = "킥킥킥킥…… 이 마코토 님의 정보망을 얕보면 곤란하지. 나는 무엇이든지 알고 있다! 닌자들이 위험한 임무를 맡은 것도 다 알고 있었어!"
102180-104 = "이부키가 좋아하는 닌자들이 다치기라도 하면, 이부키가 슬퍼할 게 뻔하니까……."
102180-105 = "그러니 조용히 지켜보다가 위기의 순간에 도와주러 올 수밖에 없었다는 거다!"
102180-106 = "……하아."
102180-107 = "그럼 여기까지 온 것도…… 이부키를 위해서……?"
102180-108 = "그래!! 이부키에게 점수 따기 위한 절호의 기회라고!! 절대 놓칠 수 없어!!!"
102180-109 = "저번 푸딩 사건 이후로 이부키가 나한테 눈도 안 마주치고 말도 안 걸어준단 말이다!!"
102180-110 = "……그야 이부키가 아끼던 푸딩을 몰래 먹었으니."
102180-111 = "네 푸딩인 줄 알았다고!"
102180-112 = "제 푸딩이면 괜찮은 건가요?"
102180-113 = "응! 그땐 마코토 선배 미웠는데, 그치만 이제 괜찮아! 마코토 선배 너무 좋아!!!"
102180-114 = "키하하하하하하하핫-!! 들었나, 이로하? 그러니까 지금 당장 저 닌자들을 구해주는 거다!!!"
102180-118 = "초무적철갑 토라마루!! 출격이다!"
102180-120 = "……하아. ……네네. 출격."
102180-121 = "언니들! 이부키가 도와줄게!"
102180-123 = "도, 도와주러 오신 건가요? 감사합니다!"
102180-124 = "좋아! 그럼 가자!"
102180-125 = "네!!"
