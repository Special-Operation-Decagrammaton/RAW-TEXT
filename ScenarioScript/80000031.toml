[translation]
80000031-1 = "1년을 기다린 상대"
80000031-2 = "발키리 생활안전국 사무실"
80000031-3 = "후후…… 벌써부터 기대가 되어서 견딜 수가 없네."
80000031-4 = "[s] \"무슨 좋은 일이라도 있어?\""
80000031-5 = "아, 선생. 좋은 아침이야."
80000031-6 = "좋은 일이야 뻔하지. 오늘은 발렌타인 데이잖아?"
80000031-7 = "무릇 키보토스의 학생이라면 오늘을 기대하지 않을 수가 없지."
80000031-8 = "[s] \"설마 그동안 마음에 두고 있던 상대라도……?\""
80000031-9 = "후후…… 눈치가 빠른걸."
80000031-10 = "맞아, 선생. 나는 그 상대를 위해 지난 1년을 기다려왔어."
80000031-11 = "그동안은 만나고 싶어도 만날 수가 없어서 마음만 졸이고 있었는데……."
80000031-12 = "게다가 그 상대가 생활안전국까지 직접 와 준다고 하니, 아침부터 기대가 되어서 일에 집중을 할 수가 없더라고."
80000031-13 = "[s] \"도대체 어떤 상대이기에…….\""
80000031-14 = "이제 곧 올 시간이 되었는데……."
80000031-18 = "왔다!"
80000031-20 = "안녕하세요! 언제 어디서나 가장 빠르게 도넛을 즐기는 방법, <마스터 도너츠 딜리버리 서비스>입니다!"
80000031-21 = "발렌타인 데이 기념— 특제 초코 트롤러 도넛 2박스 주문하신 후부키 씨 맞으시죠?"
80000031-22 = "응응, 맞아! 계속 기다리고 있었다고!"
80000031-27 = "[ns] \"후부키…… 이건?\""
80000031-29 = "보면 모르겠어? <마스터 도너츠>의 특제 초코 트롤러야!"
80000031-30 = "초코 트롤러는 평소에도 먹을 수 있지만, 특제 스프링클을 뿌린 초코 트롤러는 발렌타인 데이에만 맛볼 수 있다고!"
80000031-31 = "게다가 발렌타인 기간에는 수시로 초콜릿 도넛의 할인 행사가 진행되니……."
80000031-32 = "하아~ 역시 발렌타인 데이는 최고야~"
80000031-33 = "[s1] \"아침부터 집중하지 않고 빈둥거렸던 이유가…….\"\n[s2] \"겨우 그 도넛 때문이야?\""
80000031-34 = "어, 그게 그러니까……."
80000031-35 = "어, 그게 그러니까……."
80000031-39 = "선생도 하나, 먹을래……?"
