90101090-247 = "[log=카야]If they fear me, then they'll fall into line.[/log]"
90101090-249 = "It's human instinct to fear the unknown. Which makes fear easy to use."
90101090-250 = "Think about the General Student Council President's special forces unit. Just their existence is a deterrent to criminals all over Kivotos."
90101090-251 = "And people aren't even sure if they exist. Or what they've done. That part doesn't matter."
