90101090-20 = "ขอโทษทีค่ะ~ ฉันมาส่งอาหาร แต่ไม่มีใครอยู่ที่ทางเข้าเลยค่ะ"
90101090-21 = "ถ้าวางอาหารทิ้งไว้ก็อาจจะเสียเอาได้ ก็เลยเดินหาคนไปเรื่อยๆ จนมาถึงที่นี่ค่ะ"
