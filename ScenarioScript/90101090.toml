90101090-170 = "[s1] \"This is crueler than electric torture...!\"\n[s2] \"I think a chill just went down my spine.\""
90101090-173 = "S-Stop! Please! You'll ruin everything I've worked for!"
90101090-174 = "Of course I don't WANT to. But if you don't answer our questions, I'll really have no choice."
90101090-175 = "Team Lead Takahashi. What was the motive behind spreading rumors about the monster crabs?"
90101090-176 = "Tch. So you're well-informed."
90101090-177 = "But I won't tell you. I am the Carpaccio boss' favorite capo and Kanesaki Merchant Guild's feared—"
90101090-178 = "Guess she still hasn't grasped the situation."
90101090-179 = "FOX 1, I brought that cat treat we talked about earlier."
90101090-180 = "Inari's tuna-flavored wet food can, right?"
90101090-181 = "Yeah, good work."
90101090-182 = "FOX 3. If we can't reach an agreement, go to the capo's house and feed this to her cat."
90101090-183 = "Wh-What do you think feeding my cat is gonna do?"
90101090-184 = "As a cat enthusiast, you must know that cats go feral for this treat."
90101090-185 = "Your cat is hungry at home. How do you think your cat would react if someone came in and offered it this delicacy?"
90101090-186 = "D-Don't tell me..."
90101090-187 = "You feed your cat bland kibble. It sure would be grateful and affectionate towards someone who introduces them to a whole new world, won't it?"
90101090-188 = "Maybe it won't even like its owner anymore. The one who's only ever fed them unappetizing food."
90101090-189 = "Y-You aren't human! You're devils, disguised as people!"
90101090-190 = "...\"Human\"?"
90101090-191 = "It seems there's been a misunderstanding."
90101090-192 = "We're not humans or devils. We're cruel, cunning foxes."
90101090-193 = "If you won't cooperate, you'll find this is just the beginning of your nightmare."
90101090-194 = "Gah...!"
