90101090-33 = "ฉันก็ไม่ชัวร์ค่ะ แต่ก็ได้ยินว่าเป็นซูชิอะไรนี่ละค่ะ อากาศร้อนๆ แบบนี้ซูชิเสียง่าย แต่พวกนั้นก็ดันกินเป็นมื้อดึก ก็เลยท้องเสียค่ะ"
90101090-34 = "พอเป็นแบบนี้ เวรกลางคืนวันนี้เลยขาดคน พวกฉันกำลังกังวลอยู่เลยค่ะว่าจะทำยังไงกันดี"
