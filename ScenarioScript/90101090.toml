90101090-29 = "ว่าแต่พวกเธอเข้าเวรแค่ช่วงกลางวันไม่ใช่เหรอ? นี่ก็เลยหกโมงเย็นมาแล้ว ทำไมยังเฝ้าโกดังอยู่ล่ะ?"
90101090-30 = "อ่า คือว่า..."
90101090-31 = "พวกที่เข้าเวรกลางคืนวันนี้น่ะสิคะ คงสั่งอาหารอะไรผิดมากินเมื่อวาน ก็เลยท้องเสียกันค่ะ"
