90101090-159 = ""
90101090-160 = "You're Team Lead Takahashi, right? The Carpaccio Family's Capo and manager of Kanesaki Port's contracted security services?"
90101090-161 = "You have quite the reputation for being merciless, and the other members are terrified of you. But from what I hear, you have a soft spot for collecting cute things."
