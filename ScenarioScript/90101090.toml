[translation]
90101090-1 = "第9話;SRT式說服法"
90101090-2 = "鐘崎港倉庫前"
90101090-3 = ""
90101090-4 = ""
90101090-5 = ""
90101090-6 = ""
90101090-7 = "是誰在那裡？"
90101090-8 = ""
90101090-10 = ""
90101090-11 = ""
90101090-12 = "是我是我。你們的[ruby=Capo]組長[/ruby]。"
90101090-13 = "現在連大姐頭的臉都認不出來了嗎？"
90101090-14 = "啊，大姐頭……失禮了！"
90101090-15 = "好啦好啦。下午沒發生什麼事吧？"
90101090-16 = "是！我們把守這裡的期間，連一隻螃蟹都沒有靠近過。"
90101090-17 = "也是啦。畢竟哪個不怕死的傢伙敢在卡爾帕喬家族的地盤上閒晃啊？"
90101090-18 = "不，最近好像稍微變多了呢……"
90101090-19 = ""
90101090-20 = "不好意思～我是來送餐的，但是入口沒有看到任何人。"
90101090-21 = "想說把可能會壞掉的食物就這麼放著也不太好，結果找著找著就跑到這裡來了。"
90101090-22 = "你說的是真的嗎？看守正門的傢伙就這麼放你進來了？"
90101090-23 = "是的。正門一個人都沒有哦？"
90101090-24 = ""
90101090-25 = "嘖，看來卡爾帕喬家族的聲望也大不如前了。"
90101090-26 = "就算是為了奪回老大的信任，這次的競標也非成功不可……！"
90101090-27 = "大姐頭，您有什麼心事嗎？"
90101090-28 = "不，沒什麼。"
90101090-29 = "比起這個，你們不是負責日間巡邏的嗎？#n都超過下午六點了，為什麼還是你們在守著倉庫？"
90101090-30 = "啊，那個……"
90101090-31 = "今天原本負責夜間巡邏的傢伙們，好像昨天叫外送吃壞肚子了。"
90101090-32 = "真是些不中用的傢伙。#n他們是吃了什麼才會變成那樣啊？"
90101090-33 = "唔嗯……好像是什麼壽司吧。#n這種天氣壽司很容易壞掉，聽說是把那個當宵夜才會拉肚子的。"
90101090-34 = "總之因為這樣，今天的夜間班次出現了空缺，我們正在煩惱該怎麼辦呢。"
90101090-35 = "這群笨蛋……"
90101090-36 = "要是我沒來的話，你們兩個打算在這裡守一整晚嗎！？"
90101090-37 = "對，對不起！"
90101090-38 = "去宿舍把佐藤和鈴木帶來。#n今天他們輪休，應該正閒著呢。"
90101090-39 = "告訴他們之後Capo會另外補假，今天就先辛苦一下。"
90101090-40 = "啊，好的……！"
90101090-41 = ""
90101090-43 = ""
90101090-44 = ""
90101090-45 = ""
90101090-46 = "……還在磨蹭什麼？"
90101090-47 = "啊，我們正在應該要由誰去比較好。"
90101090-48 = "您也知道老大交代過守衛區域時一定要兩人一組，不能讓崗位空下來……"
90101090-49 = "唉……真的是會被你們打敗。"
90101090-50 = "所以你們是打算一個人去帶休假的人過來，另一個留在這裡跟我瞎聊是嗎？"
90101090-51 = "如果想盡快把人找來，不就應該兩個人一起行動嗎！"
90101090-52 = "還是說……你們擔心我連區區一個倉庫都守不住？"
90101090-53 = "不，不是的！"
90101090-54 = "不是的話就快點去把人帶來！"
90101090-55 = ""
90101090-57 = ""
90101090-58 = ""
90101090-59 = "……唉，居然得帶著這些沒用的傢伙管理地盤。"
90101090-60 = "那個……Capo。"
90101090-61 = "如果是面對突襲的話，即使是Capo也很危險吧？"
90101090-62 = "什麼？你話都說完了──"
90101090-63 = ""
90101090-65 = ""
90101090-67 = "……唔。"
90101090-68 = ""
90101090-71 = ""
90101090-72 = "你的老大應該就是擔心這種情況吧。"
90101090-73 = ""
90101090-75 = "這裡是FOX3。#n已控制卡爾帕喬家族的中階管理者。"
90101090-76 = "FOX4收到。#n半徑50m以內未確認到其他組織成員的蹤跡。"
90101090-77 = "FOX1收到。#n立即將目標祕密護送至Point Charlie，途中注意目擊者。"
90101090-78 = "這到底是怎麼……"
90101090-79 = ""
90101090-81 = ""
90101090-86 = "唔，唔唔唔……"
90101090-87 = ""
90101090-95 = "……恢復意識了嗎？"
90101090-96 = ""
90101090-98 = ""
90101090-99 = "這裡到底是……還有你們是……？"
90101090-100 = "鐘崎港外圍廢棄倉庫"
90101090-101 = ""
90101090-103 = ""
90101090-104 = "FOX1，看來目標恢復意識了。"
90101090-105 = ""
90101090-107 = ""
90101090-108 = "那就好。在旁邊持續製造噪音總算是有成效了。"
90101090-109 = "那就開始審問吧。"
90101090-110 = ""
90101090-112 = ""
90101090-113 = ""
90101090-114 = "……審問？呵，你們要審問我？"
90101090-115 = "我瞧瞧，是沒見過的制服呢……"
90101090-116 = "你們是阿蘭奇諾家族派來的嗎？"
90101090-117 = "居然還帶了大人過來，氣勢還挺囂張的嘛。#n你們以為我們老大會坐視不管嗎？"
90101090-118 = "[s] 「呃，那個……」"
90101090-119 = "您不需要回答，老師。"
90101090-120 = "反正對方八成只是想反過來嚇唬人而已。"
90101090-121 = ""
90101090-123 = ""
90101090-124 = "閉嘴。只有我們有權利提問。"
90101090-125 = "哈哈，好大的威風啊。"
90101090-126 = "來試試看啊。不管你們這些傢伙耍什麼花樣，我都不會開口的。"
90101090-127 = "與其背叛組織，我寧可去當螃蟹的飼──"
90101090-128 = ""
90101090-131 = ""
90101090-134 = "FOX2，這台發電機好像壞了。"
90101090-135 = "沒有其他備用的發電機嗎？最好是功率再強一點的。"
90101090-136 = "等，等一下。你們打算用那個東西做什麼！？"
90101090-137 = "還能做什麼。剛才不是說過要審問了嗎？"
90101090-138 = "不過可以再稍等一下嗎？配線還沒完成呢。"
90101090-139 = "你，你們打算用那種東西來拷問我嗎！？"
90101090-140 = ""
90101090-141 = ""
90101090-142 = "做出那種殘忍的事，聯邦學生會可不會坐視不管的哦！？"
90101090-143 = "你，你們應該也有聽說過吧。#n如果在D.U.自治區犯下暴行，聯邦學生會長的直屬特殊部隊就會找上門的傳聞……！"
90101090-144 = ""
90101090-146 = ""
90101090-147 = ""
90101090-148 = ""
90101090-149 = "無論逃到哪裡，那支特殊部隊都會一路追到奇普托斯的盡頭……#n你，你們難道不怕聯邦學生會長嗎！？"
90101090-150 = "[s] 「啊，那支特殊部隊的話……」"
90101090-151 = "你儘管放心，我們來之前就已經跟當事人好好商量過了。"
90101090-152 = "對啊對啊。進行了一場非常坦誠的對話呢。"
90101090-153 = "你們這些傢伙跟聯邦學生會長直接商量過？吹牛也該有個──"
90101090-154 = "還有你也別太擔心，我們也沒有打算做出會在皮膚上留下疤痕的殘忍行為。"
90101090-155 = "這台發電機也只是為了運行網路伺服器才帶來的，並沒有打算用在人身上。"
90101090-156 = "網路伺服器……？"
90101090-157 = ""
90101090-159 = ""
90101090-160 = "你就是卡爾帕喬家族的Capo，負責鐘崎港警備業務的高橋組長沒錯吧？"
90101090-161 = "在組織成員眼中似乎被視為冷酷無情、令人畏懼的大姐頭。#n然而，實際上卻有著蒐集可愛物品的興趣……"
90101090-162 = "你這傢伙，怎麼會知道那種事……！？"
90101090-163 = "我看了你在「FruLink」上的小號，上面寫得可詳細了呢？"
90101090-164 = "當然，你似乎想用化名隱藏身分……"
90101090-165 = "可惜只要把追蹤的帳號跟你的行動規律交叉比對，很快就能找出來了。"
90101090-166 = "上個月為了購買限定的烏洛米玩偶，好像還特地跑去了柯基町的快閃商店……"
90101090-167 = "哎呀，還養了一隻可愛的貓咪呢。"
90101090-168 = "唔……"
90101090-169 = "那麼，要是把這個小號公開到卡爾帕喬家族的官方帳號，大家會作何感想呢？"
90101090-170 = "[s1] 「怎麼能想出那麼可怕的主意……！」\n[s2] 「好恐怖。」"
90101090-173 = "住，住手！要是那麼做的話，我在組織裡的威信就全毀了！"
90101090-174 = "既然如此，勸你還是乖乖回答我們的問題比較好哦。"
90101090-175 = "好了，高橋組長──你們散播會攻擊居民的怪物螃蟹的傳聞，究竟有什麼目的？"
90101090-176 = "唔，已經查到那種程度了嗎。"
90101090-177 = "但我可不會這麼輕易告訴你們。#n本小姐可是深受卡爾帕喬老大寵信的Capo，是令鐘崎商會聞風喪膽的──"
90101090-178 = "看來這傢伙還沒搞清楚狀況呢。"
90101090-179 = "FOX1，我把剛才說的貓咪零食拿來了。"
90101090-180 = "是這個沒錯吧？稻荷的鮪魚口味濕食罐頭。"
90101090-181 = "嗯，辛苦了。"
90101090-182 = "FOX3。如果談判破裂，就馬上去Capo家把這個零食餵給他的寵物貓。"
90101090-183 = "你，你打算餵我的貓吃什麼！？"
90101090-184 = "你是愛貓人士的話，應該很清楚貓咪有多喜歡這種零食罐頭吧？"
90101090-185 = "要是有個陌生人代替主人，在用餐時間遞上這種高級零食罐頭……#n貓咪會有什麼反應呢？"
90101090-186 = "難，難道說……"
90101090-187 = "它的美味程度和平常吃的平淡飼料根本無法相提並論，#n說不定還會展現出不曾有過的撒嬌模樣呢。"
90101090-188 = "啊，搞不好還會跟只給難吃飼料的主人變得相當疏遠哦？"
90101090-189 = "你們這群惡魔！怎麼能披著人皮做出那麼窮凶惡極的事……！"
90101090-190 = "……人皮？"
90101090-191 = "你好像誤會了什麼呢。"
90101090-192 = "我們並不是人，只是一群執著又殘酷的狐狸。"
90101090-193 = "如果你拒絕這場交易，比你想像中更殘忍的事我們也做得出來。"
90101090-194 = "唔唔唔……！"
90101090-195 = "[s3] 「大家先冷靜一下。」\n[s4] 「總得給對方說話的機會吧。」"
90101090-198 = "你又是誰？"
90101090-199 = "看你們帶著大人來，應該不是普通的小混混吧？是哪個企業派來的傢伙嗎？"
90101090-200 = "[s5] 「我是夏──不對，是這些孩子的監護人。」\n[s6] 「很抱歉，用這麼粗暴的方式把你帶來。」"
90101090-203 = "哼，事到如今才這麼說，誰會相信啊？"
90101090-204 = "就算你想用溫柔的語氣哄騙我也沒用，你的居心我都看得一清二楚。"
90101090-205 = "[s7] 「我以我的名譽發誓。」\n[s8] 「我們對卡爾帕喬家族的利益毫無半點興趣。」"
90101090-208 = "我連你是誰都不知道，是要怎麼相信──"
90101090-209 = ""
90101090-211 = ""
90101090-212 = "……你們真的對這次的定期招標沒有興趣嗎？"
90101090-213 = ""
90101090-215 = ""
90101090-216 = ""
90101090-217 = "哦，老師一出面，氣氛馬上就緩和下來了呢。"
90101090-218 = "胡蘿蔔加棍子雖然老套，卻總是個有效的策略。#n只是沒想到，老師會負責扮演胡蘿蔔就是了。"
90101090-219 = "老師大概不是抱著那種意圖去安撫的吧……"
90101090-220 = ""
90101090-222 = ""
90101090-223 = ""
90101090-224 = "[ns] 「我們只是想知道，你們為什麼要散播那個傳聞而已。」"
90101090-225 = "……身為大人的話應該很清楚吧？煽動恐懼的理由。"
90101090-226 = ""
90101090-229 = ""
90101090-230 = "人的判斷力在情緒激動的時候就會變得遲鈍。#n無論是喜悅、悲傷還是恐懼……"
90101090-231 = "一旦被情緒主導就無法做出理性的判斷，也更容易受他人的言語左右。"
90101090-232 = ""
90101090-234 = ""
90101090-236 = "現在的奇普托斯缺乏恐懼。"
90101090-238 = "[log=카야]現在的奇普托斯缺乏恐懼。[/log]"
90101090-240 = "……只要展現足夠的恐懼，"
90101090-244 = "……只要展現足夠的恐懼，"
90101090-245 = "大家就會乖乖照我的話去做了。"
90101090-247 = "[log=카야]……只要展現足夠的恐懼，大家就會乖乖照我的話去做了。[/log]"
90101090-249 = "其中最容易操控的情緒就是恐懼……#n因為人們對於未知的存在，總是會先本能地感到畏懼。"
90101090-250 = "沒錯，就像聯邦學生會長的那支特殊部隊一樣。#n明明沒多少人親眼見過，但光憑存在本身就讓許多不良學生對犯罪卻步了不是嗎？"
90101090-251 = "那支特殊部隊實際上是否存在，又逮捕了多少罪犯都不重要。"
90101090-252 = ""
90101090-255 = "建築在人們恐懼之上的學園……"
90101090-257 = "[log=미야코]建築在人們恐懼之上的學園……[/log]"
90101090-261 = "又怎麼稱的上是SRT特殊學園呢？"
90101090-263 = "[log=미야코]又怎麼稱的上是SRT特殊學園呢？[/log]"
90101090-265 = "……"
90101090-266 = "我們也只是為了維持組織的運行，採用了類似的手法罷了。"
90101090-267 = "也就是「如果不想直面未知的恐懼，那就別插手我們的工作」。"
90101090-268 = "如果目的是灌輸恐懼，應該還有其他手段才對。"
90101090-269 = "為什麼要刻意散播和螃蟹有關的傳聞？"
90101090-270 = "一開始就只是巧合而已……#n因為發現了這則對我們在港口活動而言相當有利的怪談，所以才會拿來加以利用。"
90101090-271 = "「違抗卡爾帕喬家族就會變成螃蟹的飼料，並直面未知的恐懼。」"
90101090-272 = "不過最重要的是，現實中並沒有任何人受到傷害。"
90101090-273 = "只要稍微調查一下……#n不，只要是在港口工作的人都非常清楚「普通大小的螃蟹」是無法傷人的。"
90101090-274 = "然而，我們面對的那些不特定多數的普通人又會如何呢？"
90101090-275 = "乍看之下鋒利的蟹螯和堅硬的螃蟹形象，就已經足夠讓人聯想到那份恐懼。"
90101090-276 = "這種程度的傳聞也不會讓女武神展開調查。"
90101090-277 = "我們只是從那無形的恐懼中獲利罷了。"
90101090-278 = "看吧。沒有任何問題，也沒有任何人失蹤不是嗎？"
90101090-279 = ""
90101090-281 = ""
90101090-283 = ""
90101090-284 = ""
90101090-285 = "……你怎麼能說得那麼理直氣壯？"
90101090-286 = ""
90101090-288 = ""
90101090-289 = "許多人都因為恐懼而感到不安，甚至在競爭開始之前，勝負就已經確定了。"
90101090-290 = "你怎麼能斷言沒有問題！？"
90101090-291 = "突，突然怎麼了？我說錯了什麼嗎？"
90101090-292 = ""
90101090-294 = "[ns] 「雪乃，冷靜點。」"
90101090-295 = "可是我──"
90101090-296 = ""
90101090-301 = "嗯？這是什麼聲音？"
90101090-302 = "好像有什麼東西在發出咔嚓咔嚓的聲音。"
90101090-303 = "很像昆蟲或節肢動物移動時會發出的聲音。"
90101090-304 = "……難道是這附近出現了大量的蟑螂？"
90101090-305 = "別說那麼嚇人的話！蟑螂不可能發出這麼大的聲音吧！？"
90101090-306 = "而且這個震動又是怎麼回事？地面像是有重型機械在移動一樣不停地搖晃。"
90101090-307 = "我沒有聽說這個時間有預定要施工的消息耶。"
90101090-308 = "……而且聲音還越來越大了。"
90101090-309 = "老師，請退後。"
90101090-310 = ""
90101090-312 = ""
90101090-313 = "……來了。"
90101090-314 = "[s] 「……什麼來了？」"
90101090-315 = ""
90101090-320 = "那是什麼東西啊──！？"
