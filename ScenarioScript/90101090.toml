90101090-16 = "ค่ะ! ระหว่างที่พวกฉันยืนเฝ้าอยู่ตรงนี้ แค่ปูสักตัวก็ไม่มีโผล่มาให้เห็นค่ะ"
90101090-17 = "ก็คงงั้นแหละ จะไปมีเจ้าบ้าที่ไหนกล้ามาเดินเพ่นพ่านในเขตของการ์ปัชโช่ แฟมิลี่กันล่ะ?"
