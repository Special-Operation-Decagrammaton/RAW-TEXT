90101090-265 = "..."
90101090-266 = "So we made use of a similar tactic. In the name of keeping our family name alive."
90101090-267 = "\"Unless you want to face the fear of the unknown, do not meddle in our affairs...\""
90101090-268 = "There had to have been plenty of other ways to instill fear."
90101090-269 = "So why crabs, of all things?"
90101090-270 = "It was just convenient. We work at a port, so we made use of an already existing urban legend."
90101090-271 = "\"Enemies of the Carpaccio Family get fed to the crabs. We are the unknown you fear.\""
90101090-272 = "If you really look at it, no one got hurt, right?"
90101090-273 = "It doesn't take much for any port worker to look into it and realize that some CRABS couldn't possibly eat someone down to their bones."
90101090-274 = "And as for the general public..."
90101090-275 = "The idea of a crab, with its hard shell and sharp pincers, is enough to make them scared. To keep them afraid of us."
90101090-276 = "And Valkyrie's not going to hold an investigation about some weird man-eating crabs."
90101090-277 = "We're profiting from a vague feeling of fear. That's it."
90101090-278 = "No one actually disappeared, so there's no real problem here."
