[translation]
10045060-1 = "제6화;패자부활전: 비치발리볼"
10045060-2 = "안녕하세요, 여러분! 잘 쉬고 오셨나요?"
10045060-3 = "그럼 지금부터 모두가 기대하던 패자부활전! 비치발리볼의 첫 경기를 시작하겠습니다!"
10045060-4 = "선수 입장!"
10045060-14 = "경기는 10점 선취의 단판 승부!"
10045060-15 = "분명 1점이 승패를 가르는, 긴장감 넘치는 시합이 될 테죠!"
10045060-16 = "[ns] \"선공은 간단하게 가위바위보로 정할게!\""
10045060-17 = "각 팀 대표, 앞으로 나와주세요……!"
10045060-24 = "케헤헤, 난 주먹을 낼 거야."
10045060-25 = "흠, 심리전인가."
10045060-26 = "이기고 싶다면 보자기를 내라고. 난 주먹으로 정면돌파 할 거니까."
10045060-27 = "정정당당히, 주먹이라. 그렇군."
10045060-29 = "[ns] \"처음은 주먹! 가위 바위……보!\""
10045060-31 = "주먹……! #n청춘은 돌진이닷! 어라?!"
10045060-32 = "케헤헤, 정정당당. 참 좋지? #n뭐, 나는 이기고 싶으니까 보를 냈지만 말이야!"
10045060-34 = "……미안, 키쿄."
10045060-35 = "괜찮아. 선공 정도는 빼앗겨도 금방 만회할 수 있어. 전력상으로 우리가 훨씬 위니까."
10045060-37 = "으으, 시작은 좋은데 다음은 어쩌지? 좋은 생각 있어?"
10045060-38 = "물론 있지."
10045060-39 = "저 키쿄라는 녀석, 아까까지 물에 빠져서 기절해 있었지?"
10045060-40 = "그러니까 저 녀석만 집중적으로 노린다. 어떻게든 상대의 약점을 후벼 파는 거야!"
10045060-41 = "으음, 별로 내키진 않는데……."
10045060-43 = "그럼 경기를 시작하겠습니다!"
10045060-44 = "정정당당하게~ 승부!"
10045060-48 = "받아라……! 야망의 스파이크 서브!!"
10045060-57 = "으윽……!"
10045060-59 = "아앗! 공이 키쿄 선수의 몸에 맞고 라인 밖으로 나갑니다!"
10045060-60 = "곧바로 선제점을 획득했습니다!"
10045060-61 = "헷, 생각대로군. 내가 말했지? 저 녀석이 약점이다!"
10045060-62 = "내가…… 약점?"
10045060-63 = "그래. 이 바닥에서 구르다 보면 상대의 눈만 봐도 어떤 상태인지 알 수 있지."
10045060-64 = "너, 이렇게 생각하고 있잖아."
10045060-66 = "자기가 팀에 도움이 안 된다고."
10045060-67 = "내가 모두의 발목을 잡고 있다고."
10045060-68 = "하긴, 너 때문에 동료들이 전부 탈락했었으니까 그런 생각 해도 무리는 아니지."
10045060-69 = "……!"
10045060-70 = "키쿄! 저 녀석 말은 무시해!"
10045060-71 = "……나도 알아. 걱정 마."
10045060-72 = "그럼 다시 한번 받아 보시지……!"
10045060-79 = "윽……!"
10045060-81 = "괜찮아! 아직 공이 살아 있어! 내가 받을게!"
10045060-85 = "키쿄! 마무리해!"
10045060-86 = "알겠어……!"
10045060-88 = "야! 너구리! 블로킹이다!!"
10045060-89 = "누구보고 너구리라는 거야!"
10045060-96 = "꾸엣……?!"
10045060-101 = "아라타 선수, 멋진 안면 블로킹입니다! #n이걸로 2점 차가 되어버렸습니다!"
10045060-102 = "아……."
10045060-103 = "케헤헤, 좋았어! 이대로만 가자고!"
10045060-104 = "좋을 리 없잖아! #n우으…… 코피 났다……."
10045060-105 = "너도 봤잖아? 저 녀석들 생각보다 별거 아니야!"
10045060-106 = "이대로 저 키쿄라고 하는 녀석의 약점을 계속 공략한다면……!!"
10045060-108 = "……."
10045060-109 = "이것들이 보자 보자 하니까……!"
10045060-111 = "그렇게 경기가 이어지고……."
10045060-122 = "와아! 어느새 첫 경기가 종료되었습니다!"
10045060-123 = "눈 깜짝할 새 없는 공방! 열띤 경기였네요!"
10045060-124 = "하아, 하아……."
10045060-125 = "……."
10045060-127 = "후, 후후후……."
10045060-128 = "하얗게 불태웠어……."
10045060-130 = "최종 스코어는 10대 7!"
10045060-131 = "제1경기는, 키쿄 렌게 팀의 승리입니다~!"
10045060-132 = "뭐야, 강하잖아……."
10045060-133 = "내가 무리라고…… 했잖아……."
10045060-139 = "그럼 인터뷰를 진행해 보겠습니다!"
10045060-140 = "[ns] \"렌게의 활약이 돋보이는 경기였지!\""
10045060-141 = "그저 할 일을 했을 뿐이야."
10045060-142 = "경기가 어느 순간부터 렌게 팀으로 주도권이 넘어가던데, 이유가 뭐였을까요?"
10045060-143 = "<지고 싶지 않다>가, <질 수 없다>로 된 이유라고 할까."
10045060-144 = "친구를 모욕하는 녀석은 용서할 수 없으니까."
10045060-146 = "……."
10045060-147 = "키쿄 선배의 컨디션이 회복되질 않사와요"
10045060-148 = "렌게 선배와의 팀워크도 잘 맞지 않았던 것 같아요."
10045060-149 = "그랬구나……."
10045060-150 = "키쿄…… 아직 아까 일로 신경 쓰고 있나 보네."
10045060-151 = "그러고 보니 유카리. 나도 모두에게 말하지 못한 이야기가 있어."
10045060-152 = "……보트 경기 때 조금 무리를 했나 봐. 오른손이 이전 같지 않아."
10045060-153 = "그, 그렇다면 빨리 의사 선생님께—"
10045060-154 = "너무 걱정 마. 심한 상태는 아니니까. 금방 회복될 거야."
10045060-155 = "아, 알겠사와요! 그럼 선배의 오른손이 회복되는 동안, 소녀가 열심히 해보겠사와요!"
10045060-157 = "……그런 일이 있었군요."
10045060-158 = "응? 무슨 일이요?"
10045060-159 = "나구사 씨의 컨디션이 좋지 않은 모양이에요. 조금 걱정되네요."
10045060-160 = "네? 그걸 보는 것만으로 알 수 있나요?"
10045060-161 = "후후, 다 방법이 있답니다."
10045060-163 = "자! 그럼 바로 두 번째 경기를 진행하겠습니다! 선수들은 경기장에 입장해 주세요!"
10045060-173 = "자 그럼~ 모두 정정당당하게, 승부!"
10045060-175 = "그렇게 시작된 두 번째 경기."
10045060-185 = "엄청난 난전이 펼쳐졌다."
10045060-190 = "아아, 미모리 선수! 마치 상대의 마음을 읽는 듯한 플레이입니다!!"
10045060-191 = "연계가 정말 환상적이군요! 백화요란을 상대로 이런 플레이라니!!"
10045060-192 = "……그러네. 우리의 생각이 모두 읽히고 있어."
10045060-193 = "생각이 읽힌다라……."
10045060-194 = "너무 고민해도 오히려 망치게 될 수 있고……."
10045060-195 = "그렇다면……."
10045060-196 = "머리를 비우자!"
10045060-197 = "춤추는 무녀처럼, 바람에 몸을 맡기고. #n봄바람을 타고, 하늘하늘 흩날리는 벚꽃처럼……."
10045060-198 = "이 소녀, 부드럽고 의연하게 자신과 마주하겠어요!"
10045060-199 = "그럼 백화요란 팀의 서브로 경기가 이어집니다!"
10045060-200 = "자! 쾌진격의 시간이어요!"
10045060-209 = "오오, 갑자기 경기의 흐름이 바뀌었네."
10045060-210 = "응. 유카리와 나구사 선배 모두 서로의 공백을 잘 채워주고 있어."
10045060-211 = "그거에 비해 난……."
10045060-212 = "어이어이, 언제까지 신경 쓰고 있을 거야."
10045060-213 = "너무 그렇게 움츠러들지 마. 누구나 완벽할 순 없는 거라고."
10045060-214 = "청춘이니까 고민하고 방황하는 거야!"
10045060-216 = "……."
10045060-217 = "그러니까 키쿄. 이렇게 하자."
10045060-218 = "결과가 어떻든, 이번 패자부활전이 끝나면 나에게 수영을 배우는 거야."
10045060-219 = "내가…… 수영을?"
10045060-220 = "응. 너는 똑똑하니까 분명 금방 배울 수 있어. 물이 무섭다는 생각은 두 번 다시 안 하게 될 거라고."
10045060-221 = "……뭘 믿고 그렇게 말하는 거야?"
10045060-222 = "난 널 오랫동안 옆에서 지켜봐 왔어."
10045060-224 = "그걸로는 부족한가?"
10045060-228 = "……하여간, 쓸데없이 성격이 좋은 건 여전하구나."
10045060-233 = "치열한 공방 끝에 승부가 났습니다!"
10045060-234 = "양 팀 다 인상적인 경기였네요!"
10045060-235 = "10대 8의 스코어로 패자부활전 결승에 진출한 팀은……!"
10045060-236 = "[ns] \"나구사, 유카리 팀입니다!\""
10045060-244 = "……."
10045060-247 = "(렌게는 어렸을 때부터 함께 했던 오랜 친구.)"
10045060-248 = "(성격은 완전히 다르지만, 서로에 대해 누구보다 잘 아는 친구.)"
10045060-249 = "(……그래. 그런 친구를 위해서라도 힘을 내야 해.)"
10045060-250 = "(더 이상 발목을 잡고 싶지 않아.)"
10045060-251 = "(반드시 이겨 보이는 거야.)"
10045060-252 = "(내가 아닌, 렌게를 위해서……!)"
