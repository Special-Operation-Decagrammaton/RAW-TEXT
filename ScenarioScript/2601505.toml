[translation]
2601505-1 = "딥 앤 딥 페이크"
2601505-5 = "아, 선생님."
2601505-8 = "괜히 늦은 시간에 불러내서 죄송합니다."
2601505-9 = "사실 다름이 아니라, 저번에 했던 산책…… 이라기보다는 상담 있잖슴까?"
2601505-10 = "역시 조금 신경 쓰여서~"
2601505-11 = "[s1] \"아, 걱정 마! 무슨 말인지 알아!\"\n[s2] \"그거라면, 완전히 이해했어!\""
2601505-14 = "아, 역시 선생님께서는 말이 통하네요~"
2601505-15 = "정말이지…… 밤바다의 마력이란 게 있긴 한가 봅니다."
2601505-16 = "저도 참 그렇게 입이 가벼워져서는……."
2601505-17 = "하여튼, 그날 일은 그대로 잊어주셨……."
2601505-18 = "[s3] \"나는 이치카가 어떤 모습이라도!\"\n[s4] \"그대로 받아들일 테니까!\""
2601505-24 = "허?"
2601505-25 = "아니, 그런 얘기를 하려는 게……."
2601505-26 = "……."
2601505-27 = "음, 으음……."
2601505-28 = "역시 선생님께서는 평범한 말로는 안 될 거 같습니다."
2601505-29 = "……그렇다면."
2601505-30 = "선생님, 방금 제 본모습이 어떻다 해도……."
2601505-35 = "……그대로 받아들인다, 그렇게 말하셨죠?"
2601505-36 = "[s] \"어, 이치카 씨……?\""
2601505-39 = "[wa:770]― [log=이치카 수영복]혹시 멋대로 착각하고 계신 거 아닙니까?[wa:2140] [/log]"
2601505-42 = "― [log=이치카 수영복]아무리 위험해 봐야, 온실 속의 귀여운[wa:1430] [/log]"
2601505-44 = "― [log=이치카 수영복]트리니티 아가씨라고.[wa:1650] [/log]"
2601505-47 = "[wa:1460]― [log=이치카 수영복]저희 정의실현부는,[wa:2750] [/log]"
2601505-49 = "― [log=이치카 수영복]트리니티에서 거친 일을 도맡죠.[wa:790] [/log]"
2601505-52 = "― [log=이치카 수영복]다들 차고 다니지 않습니까, [wa:970]초커.[wa:80] [/log]"
2601505-54 = "― [log=이치카 수영복]그게, [wa:1360]실은 '목줄'[wa:900]이라 [wa:710]하면…… [/log]"
2601505-57 = "― [log=이치카 수영복]어떻습니까?[/log]"
2601505-60 = "― [log=이치카 수영복]무언가에 목줄을 채우는 이유는 [wa:1050]하나밖에 없죠.[/log]"
2601505-63 = "[wa:1060]― [log=이치카 수영복]현명한 선생님께서는,[/log]"
2601505-65 = "― [log=이치카 수영복]말하지 않아도 아시겠죠.[/log]"
2601505-68 = "― [log=이치카 수영복]그렇다면 목줄이 풀렸을 때,[/log]"
2601505-70 = "― [log=이치카 수영복]어떤 일이 일어나는지도……[/log]"
2601505-73 = "― [log=이치카 수영복]물론, [wa:2000]아시겠죠? [/log]"
2601505-76 = "[wa:610]― [log=이치카 수영복]……[wa:930]죄송해요. [/log]"
2601505-78 = "― [log=이치카 수영복]장난이 너무 심했네요. [/log]"
2601505-81 = "― [log=이치카 수영복]그러니까,[wa:80] [/log]"
2601505-83 = "― [log=이치카 수영복]왜 그리 안일한 약속을 하고 그러십니까?[/log]"
2601505-86 = "― [log=이치카 수영복]만약 제가 정말로 위험한 사람이었으면,[wa:300] [/log]"
2601505-88 = "― [log=이치카 수영복]어떻게 [wa:870]하시려고요? [/log]"
2601505-91 = "[ns5] \"깜짝 놀랐어…….\"\n[ns6] \"이치카도 이런 장난치는구나.\""
2601505-94 = "[wa:2260]― [log=이치카 수영복]하하.[wa:980] [/log]"
2601505-96 = "― [log=이치카 수영복]선생님 [wa:540]앞에서만요. [wa:2680]그러니까……[/log]"
2601505-99 = "― [log=이치카 수영복]오늘 일은, [wa:1400]둘이서 무덤까지[wa:80] [/log]"
2601505-101 = "― [log=이치카 수영복]가져가는 검다?  [/log]"
2601505-107 = "……."
2601505-108 = "[s7] \"…….\"\n[s8] (숨막히게 어색하다.)"
2601505-111 = "……뭔가, 제가 생각했던 거랑 다르게 된 느낌이……."
2601505-112 = "망한 거 같은데……."
2601505-113 = "어어, 음……."
2601505-114 = "일단, 오늘은 주무시고, 나중에 얘기하시죠?"
2601505-116 = "(그렇게 이치카에게 등 떠밀리듯이 방으로 돌아왔다…….)"
