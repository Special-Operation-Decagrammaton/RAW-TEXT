[translation]
13110-1 = "제11화;드러나는 비밀"
13110-8 = "여기 앉으세요……."
13110-9 = "감사합니다……. 이곳이 대책위원회군요. 여기에 이런 식으로 이곳에 오게 될 줄은 몰랐는데……."
13110-14 = "아, 스오우 감독관은 어제도 말했듯이 저희 네프티스에 고용되어 있는 아군입니다. 이번에도 저의 호위를 맡아주셨죠."
13110-15 = "……나는 물러나 있겠어."
13110-19 = "직접 뵙는 건 2년 만이네요. 그동안 별일 없으셨습니까? 영애님?"
13110-20 = "……네에. 덕분에."
13110-21 = "카드의 한도는 문제없으신가요? 카드를 주시면 한도를 더 늘린 카드로 교체해 드리겠습니다."
13110-22 = "아, 아뇨. 필요 없어요. 딱히 많이 쓸 일도 없고……."
13110-23 = "그런가요…… 돌아오실 생각은 없으신가요?"
13110-24 = "네? 돌아온다뇨……?"
13110-25 = "지금이라도 결정만 하신다면 당장이라도 하이랜더로 재입학하실 수 있습니다."
13110-26 = "어…… 저기……."
13110-28 = "이봐. 노노미 쨩이 곤란해하고 있잖아."
13110-29 = "응. 본론으로 들어가."
13110-31 = "네? 저, 저기……."
13110-32 = "아니, 우리 쪽에선 충분히 할 수 있는 말이다."
13110-33 = "원래 네프티스는 하이랜더와 산학 동맹을 맺을 예정이었어. 그런데 입학하기로 한 영애님이 아비도스에 남는 바람에 동맹이 깨질 뻔했거든."
13110-35 = "……."
13110-36 = "영애님의 억지를 받아주고 손해도 감수해 준 상대에게 무례하다고 생각하지 않나?"
13110-42 = "저기저기! 참아! 시로코 선배! 여기서 또 문제를 일으키면 안 된다고!"
13110-43 = "으, 으응. 딱히 그런 건……."
13110-45 = "상관없어. 상대해 줄 테니까 준비되면 언제든지 덤벼."
13110-46 = "……. 스오우 군. 부탁이니 참아주세요."
13110-47 = "……흥."
13110-51 = "……죄송합니다. 영애님. 돌아오라는 말을 하려고 여기 온 것은 아니었습니다."
13110-53 = "네. 얼른 본론으로 넘어가야 할 거 같아요……."
13110-54 = "네……. 그거였죠. 사막횡단철도에 숨겨진 비밀."
13110-56 = "……."
13110-57 = "……."
13110-62 = "결론부터 말하자면 <사막횡단철도>에는……."
13110-63 = "아비도스 학생회가 주도하고 세인트 네프티스가 극비리에 진행했던 <비대칭 전력 병기> 제작 계획이 숨겨져 있었습니다."
13110-69 = "……네?!"
13110-70 = "학생회……?"
13110-72 = "비대칭 병기?"
13110-73 = "무기……를 말하는 거야?"
13110-75 = "네. 맞습니다. 그 병기의 이름은……."
13110-76 = "<열차포 셰마타>"
13110-82 = "<셰마타>는 구경, 중량, 사거리, 파괴력…… 그 어떤 것도 기존의 규격과 상식을 벗어나 있는 초대형 열차포…… 아니, 요새 병기입니다."
13110-83 = "광활한 아비도스 자치구에 거미줄처럼 깔려있는 <사막횡단철도>……. 그 위를 달리는 게 화물차나 여객차가 아니라……."
13110-84 = "작약 무게만 1톤 이상인 1,200mm 고폭탄을 500km 너머까지 날릴 수 있는 초장거리 포를 탑재한 전략 폭격 요새라면?"
13110-85 = "그런 과대망상적인 아이디어에서 출발한 계획이죠."
13110-86 = "완성만 된다면 그 자체로 주변 자치구에 억지력을 행사할 수 있[ruby=asymmetric power]는 비대칭 전력이 [/ruby]탄생하는 것입니다."
13110-89 = "…………. 병기, 라고."
13110-94 = "자, 잠깐만요?! 이런 걸 아비도스 학생회가 만들고 있었다고요……? 대, 대체 왜……?!"
13110-95 = "뭐, 뻔하지 않아?"
13110-96 = "이건 아비도스의 빚을 해결할 수 있는 [ruby=・]매[/ruby][ruby=・]력[/ruby][ruby=・]적[/ruby][ruby=・]인[/ruby] [ruby=・]도[/ruby][ruby=・]구[/ruby]잖아."
13110-97 = "도, 도구라고……?"
13110-98 = "그래. 강력한 병기를 사용해서 아비도스의 이익을 낼 수 있는 방법은 얼마든지 있겠지. 정당한 방법은 아니겠지만 그런 건 키보토스에선 드물지는 않잖아?"
13110-100 = "그, 그런……."
13110-101 = "<셰마타>…… 설마 그 학생회장인가요?"
13110-103 = "맞아. 잘 알고 있네? 철권통치의 셰마타."
13110-105 = "……? 누구야, 그게?"
13110-106 = "과거 70명의 학생회장이 난립하던 혼란기를 정리하고 아비도스의 전성기를 이끈 전설적인 학생회장의 별명이야……."
13110-107 = "뭐어? 70명?!"
13110-109 = "……나는 아비도스 출신은 아니지만, 그래도 이곳의 역사는 조금 배운 적이 있어."
13110-110 = "아비도스는 한때 키보토스에서 가장 부유하고 가장 강력한 자치구였다. 키보토스의 모든 자치구가 아비도스를 두려워하며 선망했다고 하지."
13110-111 = "열차포에 그런 이름을 붙인 것도 흥미롭지 않나? 이걸로 뭘 원하는지 확실하게 알 수 있으니까."
13110-112 = "……그래. 강력한 무기야말로 가장 확실한 돈벌이 수단이니까."
13110-114 = "호시노 선배……."
13110-115 = "그렇다는 건…… 결국 <사막횡단철도>의 정체는 이 병기를 은폐하기 위한 네프티스의 기만 사업이었다는 건가요?"
13110-120 = "아, 아뇨. 아닙니다! 저도 담당자가 아니어서 잘 모릅니다만, 어디까지나 사막횡단철도사업이 먼저였고 <열차포> 계획은 그 이후에 추가된 것입니다!"
13110-121 = "채산성이라곤 찾아볼 수 없는 이 골칫덩이 사업을 한 번에 뒤바꿀 아이디어를 누군가가 학생회에 제공했던 거예요……!"
13110-122 = "네? 누가요? 누가 그런 짓을……."
13110-123 = "그건 저도 잘……. 이 사업 자체가 워낙 극비리에 진행된 것이라……."
13110-125 = "뭐, 진정해, 영애님. 계획대로 완성되었다면 모를까, 결국 이건 취소되었어."
13110-126 = "네, 네! 그렇습니다. 결국 이 계획은 속았달까, 사기당했달까……. 저희는 그 아이디어 자체가 허언증, 과대망상, 사기였다고 결론 내렸습니다!"
13110-127 = "셰마타의 크기는 현존하는 병기를 아득히 초월합니다. 상식적으로 그런 사이즈가 정상적으로 동작할 리가 없잖아요!"
13110-128 = "사이즈라는 것은 결국 물리적 한계입니다. 설계자는 자신만만해했지만, 결국  열차포의 엔진은 동작하지 않았습니다. 저희도, 학생회도 속은 것이었죠."
13110-129 = "그래서 이 열차포 계획은 중단되고, 지금도 미완성인 채로 아비도스 사막 어딘가에 방치되어 있었던 것입니다."
13110-130 = "……불과 얼마 전까지만 해도 말입니다."
13110-136 = "그런데 최근, 새로운 알고리즘이 개발되었고, 시뮬레이션 결과 실제로 이 열차포는 운용이 가능하다는 가설이 나왔습니다."
13110-137 = "그 기술자는 실제로 몇 년 앞을 내다본 설계를 했던 것인지, 아니면 순전히 우연인지는 모르겠지만……."
13110-139 = "보유하고 있기만 해도 억지력이 생기는 이동 가능한 전략 병기. 시대를 앞서간 혁신적인 기술이 적용된 보물 창고."
13110-140 = "지금 <열차포>는 그 자체로 이미 금광이나 다를 바 없는 존재가 되어버렸다."
13110-141 = "그리고 그 금광이 세상에 알려지기 전에 빠르게 행동을 시작한 사람들이 나타났지."
13110-142 = "그렇습니다. <사모펀드>가 사막횡단철도의 부속 시설 운용 권리에 집착하는 게 바로 그 이유 때문입니다."
13110-146 = "이 열차포는 사막횡단철도 사업의 부속 시설이니까 말이죠…… 채권에 포함된 권리를 가지면 자연스럽게 열차포의 운용 권리 또한 가지게 되는 것입니다."
13110-147 = "사모펀드에 소속된 세력들의 목적 자체는 조금씩 다를 수는 있겠지만 어쨌든 그들은 이 <열차포>를 손에 넣어서 이익을 취하려고 하는 겁니다."
13110-150 = "그리고 폐기된 열차포 계획에 대해선 까맣게 잊어버린 네프티스에 접근해서 투자를 제안했습니다."
13110-151 = "저희에겐 <사막횡단철도>는 어떻게든 보존해 두고 싶은 역사적인 자료였으니까요. 타산지석이랄까, 반면교사랄까……. 그래서 수락해 버렸죠."
13110-154 = "……."
13110-155 = "저희는 뒤늦게 이 계획의 실체를 알게 되었지만, 현재로선 <사모펀드>에서 발을 뺄 수 없는 상황이 되어버렸죠……."
13110-156 = "열차포가 <사모펀드>의 손에 넘어가게 두어선 안 됩니다."
13110-157 = "그러게. 그런 병기가 악당들의 손에 넘어가는 순간, 아비도스는 엄청난 분쟁의 소용돌이에 휩싸이게 되겠지."
13110-159 = "그럼 우리가 먼저 찾아내서 부수면 되지 않아?"
13110-160 = "열차포의 위치를 알고 있나요, 집사님?"
13110-162 = "아뇨…… 저희도 사모펀드도 그게 어디 있는지 전혀 모릅니다."
13110-163 = "이 계획 자체가 극비이기도 하고, 관계된 서류는 하나도 남김없이 파기됐을 겁니다. 알려봤자 하나도 좋을 게 없는 사업이니까요."
13110-168 = "그런가……."
13110-169 = "지금 생각해 보면 <사모펀드>가 우리에게 접근했던 이유가 열차포의 위치를 알아내기 위해서였던 것 같습니다."
13110-170 = "하지만 그들이 열차포를 찾아내는 건 시간문제겠죠. 하이랜더가 사막횡단철도 공사를 재개하면 열차포의 위치는 금방 드러날 거예요."
13110-171 = "하이랜더는 열차포의 존재에 대해선 아무것도 모르지만 그래도 열차라면 사족을 못 쓰는 녀석들이라서 실력은 확실하거든요."
13110-172 = "게다가 <사모펀드>는 이 열차포를 정당한 계약을 통해 확보하려고 하기 때문에, 함부로 부쉈다가는 엄청난 피해보상을 해야만 하고요……."
13110-173 = "정당한 계약이요……?"
13110-174 = "네. 아무래도 열차포가 소유권이라던가 정체가 명확하지 않은 물건이라서 그런지, 그런 것에 집착하고 있습니다."
13110-175 = "주체자 아비도스 학생회, 실행자 네프티스, 게다가 핵심 설계 아이디어를 제공한 사람도 따로 있고…… 심지어 그 권리는 채권에 담보로 묶여 있죠."
13110-176 = "그러니 사업가로서는 당연한 선택일 겁니다. 명확하게 법리관계를 끝내야 뒤탈이 없겠죠."
13110-177 = "그럼 카이저는 <열차포>의 존재를 모르는 건가요? 어째서 채권을 순순히 판 거죠?"
13110-178 = "글쎄요, 아마 알았다고 해도 카이저는 <열차포>에 대해 관심이 없는 것 같습니다. 카이저 프레지던트는 지금 생텀타워에 관심이 더 많은 것 같고……."
13110-179 = "게다가 카이저는 채권 판매로만 엄청난 이익을 얻었으니까요. 이젠 그런 소문 따위 아무래도 상관없는 걸지도……."
13110-183 = "……하지만 이때, 누구도 예상하지 못한 일이 발생했습니다."
13110-187 = "아비도스 전 학생회장의 계약서가 발견된 것이죠."
13110-189 = "어째서 이런 계약서가 존재하는지는 모르겠지만…… 이게 발견된 이상 열차포의 권리는 사모펀드에 넘어가지 않아요."
13110-190 = "기다려……. 이 계약서에 대해서 알고 있는 건 없어?"
13110-191 = "어째서 유메 선배는…… 학생회장은 이 계약을 진행한 거야? 이때 무슨 일이 있었던 거야?"
13110-193 = "……호시노 선배."
13110-198 = "……아뇨. 말했다시피 저희도 이게 발견되기 전까지 계약서의 존재를 모르고 있었습니다. 그 과정이나 이후 결과도 제대로 파악이 안 되고 있어요."
13110-199 = "……."
13110-200 = "그때 저희 네프티스는 파산 직전이라 가지고 있는 자산은 모두 여기저기 싼 값에 팔아치우고 있었거든요."
13110-201 = "그냥 단순하게 그런 식으로 사막횡단철도라는 쓸모없는 자산의 권리를 학생회에 팔아 치웠던 것 같습니다."
13110-202 = "……."
13110-203 = "어쨌든 사모펀드는 먼저 이 계약서를 해결하려고 할 겁니다. 말했다시피 그들에게 정당한 계약 절차는 중요하거든요."
13110-204 = "그래서 급하게 채권단 총회를 열어서 이 계약서를 확실하게 폐기하려고 하는 거예요."
13110-209 = "……내일이에요. 내일 12시 아비도스 중앙역 구청사……."
13110-210 = "……네. 그렇습니다. 사모펀드는 채무자인 <아비도스 학생회>에 와서 확실하게 출석 통보를 했었죠."
13110-211 = "그렇기 때문에 학생회 대표가 총회에 출석해서 계약 포기를 하던가, 아니면 총회에 불참석하면 계약은 효력을 잃고 원래 소유주인 네프티스에게 권리가 돌아갑니다."
13110-215 = "네?! 그렇다는 건……?!"
13110-216 = "……아뇨. 어디까지나 <사모펀드>의 구성원인 네프티스에게 귀속되는 겁니다."
13110-217 = "채권을 저희 네프티스 명의로 구매한 것과 동일하게 이 권리 또한 <사모펀드>로 귀속되는 거예요. 저희가 마음대로 처분할 수 없습니다."
13110-222 = "……그렇다면 남은 방법은 하나뿐이네."
13110-228 = "내가 채권단 총회에 참석해서 그 계약의 유지를 선언하면 되는 거야."
13110-229 = "……그렇습니다. 그렇게 되면 열차포의 권리는 계속 아비도스 학생회에 귀속되겠죠."
13110-230 = "그래. 매매 대금이야 지금처럼 천천히 갚아나갈 수밖에 없겠지만, 어쨌든 그렇게 되면 사모펀드는 열차포에 손댈 수 없게 될 거야."
13110-231 = "그동안 우리는 사막을 샅샅이 뒤져서 열차포를 찾아내서 파괴하면 돼."
13110-233 = "그러네. 그러면 간단하게 해결되잖아?"
13110-234 = "그렇긴 한데……."
13110-236 = "아니, 그건 어려울 거야. 타카나시 호시노."
13110-241 = "먼저 <사모펀드>도 당연히 그 사실을 알고 있어. 그러니 네가 출석해서 공증하는 것을 반드시 막으려고 할 거다."
13110-242 = "네? 막으려고 한다면…… 어떻게……?"
13110-243 = "간단하잖아? 아비도스 중앙역 구청사를 수백 명의 용병들로 봉쇄할 거야. 네가 건물 안으로 들어오지 못하게 말야."
13110-244 = "뭐어?!"
13110-249 = "이미 지금 중앙역은 사모펀드 소속원들이 고용한 용병들이 봉쇄를 시작했을 거야. 장갑차, 헬기, 대공포, 바리케이드 등으로 구청사를 철저하게 방어하고 있겠지."
13110-251 = "중앙역 구청사 동쪽 지역"
13110-256 = "……. 좋아. 추가 병력은 저쪽으로 가라."
13110-258 = "자아, 가자! 일이다!"
13110-264 = "중앙역 구청사 서쪽 접근로"
13110-270 = "좋아. 전투 헬기도 도착했군."
13110-271 = "전차는 지정된 위치를 확보하고, 마켓가드들은 봉쇄 영역을 강화하도록."
13110-276 = "중앙역 구청사 남쪽 개활지"
13110-278 = "좋아. 계획은 알고 있겠지?"
13110-280 = "물론. 돈 받은 대로 일해주겠다."
13110-286 = "<열차포>…… 게헨나의 그 뇌제가 남긴 유산이다. 탐내지 않을 이유가 없지. 큭큭."
13110-288 = "중앙역 구청사 북쪽 접근로"
13110-293 = "호오, 호오. 이쪽입니다. 여기에 바리케이드를 쌓으세요. 두껍게요."
13110-297 = "굴삭기, 불도저, 포크레인 등등 가져올 수 있는 건 모조리 가져오세요."
13110-307 = "후후후……. 자아, 내일 12시까지 여기에 도착하지 못하면 열차포는 저희의 것이 됩니다."
13110-308 = "얼마든지 해 보십시오. 후후……."
13110-310 = "뭐어?! 그렇게까지 한다고?!"
13110-311 = "흐음……. 수백 명이라고?"
13110-312 = "으음……."
13110-313 = "벼, 병력의 숫자가 그 정도라면…… 저, 저희 5명으로서는……."
13110-315 = "서, 선생님이 있으면 어떻게든 되지 않을까?"
13110-316 = "아니, <샬레>의 선생은 이런 사적 거래에 개입할 명분이 없어."
13110-320 = "무슨 소리야?! 엄연하게 계약을 방해하고 있는 건 그쪽이잖아!"
13110-322 = "아냐. 세리카 쨩. ……그걸 증명할 방법이 없을 거야."
13110-324 = "어, 어째서?"
13110-325 = "총회가 열리는 장소가 왜 하필 중앙역 구청사겠어? 거긴 <사막횡단철도>의 노선 수십 개가 교차하는 중심 지역이야."
13110-326 = "아……! <사막횡단철도>의 권리는 부가 시설 사용권을 빼고는 전부 사모펀드에게 있으니까……."
13110-327 = "맞아. 그 녀석들은 자신들의 사유지를 지키고 있을 뿐이라고 주장하겠지."
13110-328 = "그, 그런 게 어딨어!"
13110-334 = "……. 그런데 총회에 참석하는 건 호시노, 너인가? 아니면 나머지인가?"
13110-336 = "응? 그거야…… 당연히……."
13110-337 = "당연히 여기 있는 5명 모두야."
13110-342 = "……아니, 질문이 잘못됐군."
13110-343 = "너희는 <아비도스 학생회>로서 참석할 건가, <대책위원회>로서 참석할 건가?"
13110-344 = "네? 그, 그건……."
13110-345 = "학생회장 유메가 작성한 계약서의 주체는 아비도스 학생회로 되어 있어. 그런데 그건 이름만 존재할 뿐이라지?"
13110-346 = "그렇다면 너희는 둘 중에 어디가 진짜 학생회인지 정해야 할 거야. 그리고 결정하지 않은 동아리는 폐쇄하고."
13110-347 = "뭐, 이건 어디까지나 강행 돌파할 때의 문제였어. 중요한 건 아니지만."
13110-348 = "……."
13110-350 = "어쨌든 총회에 참석할 방법은 강행 돌파뿐이야."
13110-351 = "아니, 그게 어렵다니까. 시로코 선배."
13110-353 = "……네. 그건 무리예요. 다른 방법을 찾아야 해요."
13110-355 = "……물론 다른 방법도 있습니다. 영애님."
13110-363 = "훨씬 더 쉽고 간단한 방법이죠. 영애님이 하이랜더로 재입학해서 학생회장이 되어주시면 됩니다."
13110-364 = "네에……?"
13110-370 = "영애님을 하이랜더의 학생회장으로 만들어드릴 테니, <네프티스>의 간부가 되어 영향력을 행사하시면 이 계약을 취소할 수 있습니다."
13110-371 = "네프티스의 간부이자 하이랜더의 학생회장…… 그렇게 되면 사모펀드의 세력 두 개를 손에 넣을 수 있게 됩니다. 이 계약 자체를 없던 걸로 만드는 것도 불가능하지 않겠죠."
13110-372 = "그, 그건……. 그러면 확실히……."
13110-373 = "하지만 그건 제가 아비도스를 떠나야 한다는 건데…… 그런……."
13110-375 = "기각."
13110-376 = "맞아! 무슨 말도 안 되는 소릴 하는 거야?! 노노미 선배가 왜 여길 떠나야 하는 건데?"
13110-381 = "네. 맞아요. 그 방법은 거절하겠어요. 아비도스를 떠나는 건 싫어요!!"
13110-382 = "그건 해결책이 아니에요!"
13110-383 = "네에. 뭐. 그럴 것 같았습니다. 영애님의 억지…… 아니, 고집을 꺾는 건 힘드니까요."
13110-384 = "그 외에 제3의 방법도 있지만……. 뭐어, 지금 말씀으로 그것도 불가능할 것 같고……."
13110-388 = "제3의……? 그게 뭐죠?"
13110-389 = "아니, 좀 과격한 방법이라……."
13110-390 = "아뇨, 상관없어요! 알려주세요."
13110-394 = "네, 그럼 알려드리죠. 제3의 방법을……."
13110-395 = "그건 바로…… 사막횡단철도 매매계약서 자체를 원천 무효로 만들어버리는 것입니다."
13110-396 = "……?"
13110-397 = "즉, 애초에 계약 주체인 <아비도스 학생회>가 사실 학생회 권한이 없는 가짜라고 선언하는 거죠."
13110-398 = "네?!"
13110-404 = "즉, 쿠치나시 유메와 타카나시 호시노, 이렇게 두 명으로만 구성된 <아비도스 학생회>는 사실 정식 학생회가 아니라 비인가 사칭 조직이었다…… 그렇게 공증하는 겁니다."
13110-405 = "무, 무슨 소릴……."
13110-406 = "그 학생회장은 어차피 전임 학생회에서 거수투표 같은 걸로 뽑혔다죠? 그 정통성을 부정하는 건 불가능하지 않습니다."
13110-407 = "그 학생회 소속이었던 타카나시 호시노가 총회에 출석해서 그 사실을 자백하는 겁니다. 그리고 계약 상대인 저희가 그걸 인정하면, 계약서 자체가 무효화될 겁니다."
13110-408 = "그러면 계약 자체가 취소나 중지가 아니라, 애초에 존재하지 않았던 게 되는 겁니다."
13110-409 = "그럼 <사모펀드>의 소속 여부와 관계없이 열차포의 권리는 우리 네프티스에게 100% 귀속되는 거죠."
13110-410 = "무슨 소릴 하는 거예요!! 그런 방법을 쓸 리가……!!"
13110-411 = "……뭐, 그래서 말했잖습니까. 불가능할 거라고."
13110-412 = "……."
13110-413 = "……아무튼 저희는 사막횡단철도의 비밀을 알려드렸습니다만, 이걸 해결할 뾰족한 방법은 여러분들에겐 없는 것 같군요……."
13110-417 = "내일 12시까지입니다. 그 이후면 <사모펀드>가 열차포를 손에 넣게 됩니다."
13110-418 = "저희는 저희 나름대로 고민해 볼 테니 좋은 방법이 있으면 연락해 주세요."
13110-419 = "그럼 내일 채권단 회의에서 뵙겠습니다. 그리고 오늘 대화는 사모펀드에게 들키지 않게 주의해 주시길."
13110-420 = "그럼."
13110-429 = "……끄응."
13110-430 = "으음."
13110-435 = "……."
13110-440 = "자아, 자아. 모두들 멍때리고 있지 마. 이어서 우리끼리 회의야."
13110-441 = "호시노 선배……"
13110-442 = "노노미 쨩, 이 아저씨는 괜찮아. 그리고 시간이 없잖아?"
13110-443 = "내일 정오까지 방법을 찾지 않으면 안 된다고. 즉, 오늘 밤이 마지노선이니까, 부지런히 생각해 봐야지. 그렇지?"
13110-445 = "응. 선배의 말이 맞아. 고민해 보면 어떻게든 될 거야."
13110-447 = "네……."
13110-448 = "야~ 시로코 쨩은 언제든 씩씩해서 좋다니까. 다들 시로코 쨩을 좀 본받아 달라구."
13110-450 = "으음……."
13110-452 = "가, 갑자기 웬 칭찬?!"
13110-453 = "아하하……. 긴 시간 동안 복잡한 이야기를 해 왔으니까……"
13110-457 = "그럼 잠깐 휴식하고 다시 모이겠습니다."
13110-459 = "다음화;대책위원회의 시작"
