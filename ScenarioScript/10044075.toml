[translation]
10044075-2 = "으윽! 이 녀석들…… 의외로 강하잖아!"
10044075-3 = "워, 원통하다! 이 열차만 손에 넣으면…… 블랙마켓을 일통할 수 있었는데……"
10044075-8 = "대체 무슨 헛소문이 어디까지 퍼진 걸까요……"
10044075-9 = "여기 뭐가 실려 있는지는 우리도 모르는데-"
10044075-10 = "보물 고블린의 기분을 조금은 알 것 같구만! 파햐햐!"
10044075-12 = "후……"
10044075-13 = "상황은 대략 종료된 것 같네."
10044075-14 = "[ns1] \"고마워, 이오리.\"\n[ns2] \"선도부의 도움 덕분에 무사히 위기를 넘겼어.\""
10044075-17 = "게헨나 자치구역에서 벌어지는 소란이니까, 개입은 했어야 했지만……"
10044075-18 = "아직도 선생님과 이 열차를 그냥 보내는 게 맞는지는 잘 모르겠거든?"
10044075-19 = "……"
10044075-20 = "그래도, 선생님이 학생들과 함께할 때는 다 이유가 있었으니까."
10044075-21 = "[s] \"믿어주는구나……!\""
10044075-22 = "대신, 일이 마무리된 후에는 꼭 선도부에 들러서 설명해야 해."
10044075-23 = "그럼 이제 곧 게헨나 자치구역을 벗어날 것 같기도 하고. 난 이만……"
10044075-24 = "파햐햐, 멋진 활약이었어! 선도부의 에이스 씨!"
10044075-25 = "아니, 딱히 에이스까진……"
10044075-26 = "열차 위에서 백발백중이었어- 히카리 감탄-"
10044075-28 = "저, 정말 감사했어요…… 눈앞이 캄캄했는데…… 덕분에 살았어요……"
10044075-29 = "나, 나중에 개인적으로라도 신세 꼭 갚을게요!"
10044075-30 = "……으음."
10044075-31 = "뭐…… 잘 살펴 가라고, 하이랜더 친구들."
10044075-32 = "물론 선생님도."
10044075-33 = "[s] \"응. 고마워, 이오리.\""
10044075-37 = "이야~ 역시 선생님이야. 여기서 아는 학생을 만날 줄은!"
10044075-38 = "그, 그러게요…… 역시 세상은 인맥이구나…… 나, 나 같은 사람은 어떻게 살아가야 할까……"
10044075-39 = "아오바 친구 없어-?"
10044075-40 = "그런 걸 대놓고 물어보면 상처가 될 거라는 생각은 안 하시나요?"
10044075-41 = "없어 보이긴 해-"
10044075-42 = "애, 애송이 간부님이 하실 말은 아닌 것 같은데……"
10044075-43 = "히카리는 친구 왕 많아- 여기 선생님도 친구-"
10044075-44 = "어디까지 기어오를 셈인가요…… 명색이 선생님이신데……"
10044075-45 = "어……?"
10044075-46 = "왜-? 아오바도 친구 하고 싶어-?"
10044075-47 = "누, 누가 그렇대요? 그게 아니라 여기 화물이……"
10044075-49 = "어? 상자가 좀 부서졌네. 아까 폭탄 때문인가?"
10044075-51 = "다, 다행히 외부만 살짝 부서진 것 같지만……"
10044075-55 = "내, 내용물이 이런 거였다니……"
10044075-56 = "[ns] \"이건……\""
10044075-59 = "크윽…… 일이 이렇게 될 줄은……"
10044075-60 = "초, 총장…… 어쩌지?"
10044075-61 = "완전 엉망진창이야…… 서로 공격하고 난리에 게헨나 선도부까지……"
10044075-62 = "다, 다행히 다른 놈들도 다 떨어져 나갔지만 열차는 놓쳤고……"
10044075-63 = "……"
10044075-64 = "이대로라면 계획은 완전히 실패……"
10044075-65 = "아니…… 언제나 길은 있어."
10044075-66 = "배달할 때도, 폭주 뛸 때도, 완전히 막힌 것처럼 보이는 도로에서도……"
10044075-67 = "언제나 길은 있는 법…… 아직 발견하지 못했을 뿐……!"
10044075-72 = "그래! 그거다! 발상의 전환이야!!"
10044075-73 = "어, 어떻게??"
10044075-74 = "열차의 목적지라면 알고 있어. 의뢰인 녀석이 우리에게 일을 맡기기 직전까지 갔으니까."
10044075-75 = "우리는 목적지에 먼저 가서 대기하다가……!!"
10044075-77 = "화물을 강탈한다!!"
10044075-79 = "그리고! 강탈한 화물을 그대로 의뢰인에게 전달한다!!!"
10044075-81 = "그래도 되는 걸까?!?"
10044075-83 = "나, 난 머리가 나빠서 잘 모르지만…… 그거 배송이랑은 좀 다른 거 같은데?!"
10044075-84 = "아니! 배송이 맞아!!"
10044075-85 = "단지 화물의 중간 이동 수단이 달라지는 것뿐이지, 최종 전달자는 우리가 맞잖아??"
10044075-86 = "그, 그런가……?"
10044075-87 = "그리고 우리는 이번 일을 시작으로 배송 업계의 큰손이 되어, 키보토스 전체를 아우르는 배달 전문 단체로 거듭나는 거다!"
10044075-88 = "맞아……! 우리의 꿈은 이루어질 거야!!"
10044075-89 = "자, 어서 출발하자! 뒤처졌지만 속도 하면 우리잖아!!"
