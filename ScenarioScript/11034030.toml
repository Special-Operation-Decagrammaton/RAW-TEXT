[translation]
11034030-1 = "퍼포먼스;경쟁의식 1"
11034030-2 = "……앗, 따가워!!"
11034030-3 = "아잇……. 진짜……."
11034030-4 = "……? 뭐야, 다쳤어?"
11034030-5 = "아니, 뭐. 그냥 기타 줄에 손가락이 좀 헐어서……."
11034030-6 = "쯧쯧, 한심하긴. 잘하는 짓이다."
11034030-7 = "일단 그대로 있어 봐. 여기 분명 손가락 파스가……."
11034030-8 = "……응? 뭐야. 왜 다 썼지?"
11034030-10 = "그야……. 본인이 아까 썼으니까."
11034030-11 = "……???"
11034030-12 = "……어라. 언제 이렇게나……."
11034030-13 = "남한테 뭐라 하기 전에 본인 손가락 걱정부터 하셔요, 나는 이번이 처음이라고."
11034030-14 = "우, 우선 좀 쉴까? 두 사람……. 너무 무리해서 할 필요는 없는데……."
11034030-15 = "아냐, 아냐. 무리는 이 정도 가지고 무슨. 말했잖아. 나는 이번이 처음이라니까?"
11034030-17 = "……누구 씨랑은 달리, 말이지."
11034030-18 = "……?"
11034030-19 = "뭐야. 왜 또 시비지? 해 보자는 거냐."
11034030-20 = "한심하다-라고 먼저 한 게 어디 사는 누구셨는데?"
11034030-22 = "……오오. 여기서 또 일기토의 분위기를……?"
11034030-23 = "두, 두사람……! 싸우면 안 돼……!"
11034030-24 = "응? ……아. 아냐, 아냐. 아이리. 싸운다니, 그런 건 아니니까 신경 쓰지 마."
11034030-25 = "그저……."
11034030-26 = "……아아. '합주'를 좀 해보려고 말이지. 누가 먼저 드러눕는지만 확인해 보고 싶어서."
11034030-28 = "하. 그 체력으로 꽤나 자신감 넘치시네."
11034030-29 = "흐으응……."
11034030-30 = "……호오오."
11034030-34 = "음음. 과연. 이건 정말이지……."
11034030-38 = "……록이로군!!!"
