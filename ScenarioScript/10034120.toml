[translation]
10034120-1 = "6일 전: 정석적인 해결책"
10034120-3 = "……으어어, 탈진하겠다"
10034120-4 = "어째서 기타 줄 튕기는 연습보다 노트 끄적이는 이론 쪽이 더 힘든 건지……."
10034120-5 = "동감이야, 이런 상황은 전혀 예상 밖의 일이었는데……."
10034120-9 = "아하하……."
10034120-10 = "그, 그래도 같은 부분을 계속 틀리거나 연습만으로는 묘하게 안 맞을 때는……. 대체로 이론의 문제니까."
10034120-11 = "의외로 이럴 때 이론적인 부분 하나 배우는 게, 막힌 부분의 해결책이 될 수 있어!"
10034120-12 = "실제로 이론 공부도 병행했던 자만이 할 수 있는, 피부에 와닿는 조언이로군. 훌륭해."
10034120-13 = "결국……. 또 '공부'……인가. 크흑……."
10034120-14 = "여기서까지 종이와 글자를……."
10034120-19 = "뭐야~? 그 자신 없다는 듯한 표정?"
10034120-20 = "……? 뭐지? 먼저 투덜거린 건 그쪽 아니었나……?"
10034120-21 = "시, 시끄럽네!!"
10034120-22 = "자, 자! 쓸데없는 소린 됐고, 다시 시작!!"
