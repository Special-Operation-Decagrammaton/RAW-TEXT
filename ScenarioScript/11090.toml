[translation]
11090-2 = "제9화;배은망덕한 혈투"
11090-3 = "그럼 조심해서 가라구!"
11090-4 = "하던 사업도 잘 되길 빌게요!"
11090-5 = "크하하-! 그래, 너희들도 학교 부흥 힘내라고! #n이 아루 님께서 응원해줄테니까 말야!"
11090-6 = "바이바이-!"
11090-9 = "하아…… 좋은 녀석들이었어. 그렇지?"
11090-10 = "……."
11090-11 = "……."
11090-12 = "아루. #n……저 교복 어딘지 몰라?"
11090-13 = "응? 몰라. 뭔데?"
11090-14 = "쟤들 아비도스 애들이잖아."
11090-16 = "뭐, 뭐-?!?! 뭐라고-----?!??!!"
11090-18 = "아하하하. 반응 웃겨."
11090-19 = "하아…… 진짜 몰랐던 거냐……."
11090-20 = "어? 그, 그러면 우리 타겟이잖아요. 제, 제가 가서 해치우고 올까요?"
11090-21 = "아하하하. 늦었어, 늦었어. #n어차피 조금 이따가 습격하러 갈 거니까 그때 날뛰라고, 하루카 쨩."
11090-22 = "지, 진짜냐……. 저 녀석들이? 아비도스라고……. #n아, 으, 으으…… 이 무슨 운명의 장난……."
11090-23 = "뭐해, 아루 쨩. 이제 일하러 가야지?"
11090-24 = "용역 알바들이 우리 명령을 기다리고 있다."
11090-25 = "정말이냐…… #n나는 지금부터 저 녀석들을……."
11090-26 = "아하하, 착한 아루쨩에게는 힘든 상황이겠네."
11090-27 = "인정에 얽매이지 않고 돈만 받으면 무엇이든지 OK인 게 우리 흥신소 68의 모토잖아.#n뭘 고민하는 거야?"
11090-28 = "그, 그렇긴 하지만……."
11090-29 = "(완전 의기소침해졌는데…….)"
11090-30 = "아, 아냐! 정신차려, 아루! 이래서야 하나의 사업체를 이끄는 몸이 될 수 있겠어?"
11090-32 = "간다! 용역들을 집합시켜!"
11090-38 = "뭐야~ 왜이리 늦어."
11090-39 = "잠깐 사정이 있었다. 준비는 다 됐겠지?"
11090-40 = "물론이야. 뭐든 상관없지만 정시 퇴근은 시켜줘야 해. #n시급도 깎았으면서."
11090-41 = "사소한 건 신경쓰지 마! #n자, 가는 거다! 아비도스 학교를 습격하러!"
11090-43 = "출동~!"
11090-44 = "하아……."
11090-45 = "제, 제가 최선을 다할게요, 아루 님!"
11090-47 = "전부 다 해치워버릴게요!"
11090-49 = "학교 남쪽 15km 근방에서 대규모 병력이 확인되었습니다!"
11090-50 = "설마? 헬멧단이?"
11090-51 = "아, 아니에요! 헬멧단은 아니에요."
11090-52 = "……용역들입니다! 아르바이트 용병들이에요!"
11090-53 = "헤에? 새벽 인력시장에서 누가 병력을 구했나본데? 걔들 꽤 비쌀 텐데."
11090-54 = "더 이상 접근을 허용하면 안됩니다! #n선생님, 출동 명령을-!"
11090-55 = "[s]\"출동하자-\""
11090-57 = "전방에 용역을 이끌고 있는 집단이 확인됩니다!"
11090-58 = "어라…… 라멘 가게에서 본……"
11090-59 = "끄, 끄응……."
11090-60 = "누군가 했더니 너희들이었냐!! 라멘도 줬는데 우리를 습격해?! 이 배은망덕한 놈들이!!"
11090-61 = "아하하하, 아까는 고마웠어. 그건 그거지만 이건 또 사업이라서."
11090-62 = "유감스럽게 생각한다. 하지만 공은 공. 사는 사. 의뢰 받은 건 확실하게 처리해야지."
11090-63 = "……그렇군. 그 사업이 바로 흥신소였군."
11090-65 = "정말-! 학생이라면 좀 더 제대로 된 아르바이트를 해야죠! #n흥신소가 뭐예요?"
11090-66 = "아, 아르바이트가 아냐! 제대로 된 사업이라고! 직함도 있단 말야!"
11090-67 = "나는 사장!"
11090-68 = "쟤는 실장,"
11090-69 = "쟤는 과장……."
11090-70 = "하아…… 아루 사장. 여기서 그러면 더 없어보이잖아."
11090-73 = "배후가 누구지? ……아니, 대답할 리가 없겠지."
11090-74 = "(철컥) 강제로 입을 열게 하는 수 밖에."
11090-75 = "후후후, 그건 기업 비밀이거든?"
11090-76 = "얘들아! 공격!!"
