[translation]
10034060-1 = "제6화;자리에 어울리는 사람"
10034060-3 = "(……늦은 밤.)"
10034060-10 = "[ns1] \"……역시 여기 있었구나.\"\n[ns2] \"찾아다녔어, 아이리.\""
10034060-13 = "……? 어, 어라……? 선생님……?"
10034060-14 = "어, 어쩌다 이런 시간에, 이런 곳에……?"
10034060-15 = "……네? 저를 찾으셨다고요? ……여태까지? 대, 대체 언제부터……."
10034060-16 = "어째서 그런……. 무슨 일 있으신가요?"
10034060-17 = "일이 있으시면 모모톡이나 전화로 연락하셔도 됐을 텐데……."
10034060-18 = "그런 건 일단 괜찮다고요? 그, 그게 무슨……."
10034060-19 = "……네?"
10034060-20 = "……저요……?"
10034060-21 = "[s3] \"츠무기를 찾고 있는 거지?\"\n[s4] \"이번에도 선생님으로서의 일이라 할까.\""
10034060-24 = "……어……."
10034060-28 = "……그렇군요. 그렇게 된 거였군요. 역시 그렇게 된 거겠지요."
10034060-29 = "선생님……. 역시 저를 설득하러 오신 거군요. 다시 동아리로 데리고 가려고……."
10034060-30 = "다른 아이들이 부탁한 거죠? 아니면 선생님께서 그렇게 해주겠다고 약속하신 거죠?"
10034060-31 = "그러니까 따로 연락도 없이 이렇게 직접 찾아오시고……. 그렇겠네요."
10034060-32 = "선생님은 제가 여기서 츠무기 씨를 찾고 있을 거라는 걸 알고 계시니까요."
10034060-33 = "[s5] \"그렇긴 하지만, 지금은 아니야.\"\n[s6] \"걱정 마. 억지로 데리고 가려는 건 아니니까.\""
10034060-36 = "그건……. 정말이신가요? 그냥 하시는 말씀은 아니신가요?"
10034060-37 = "솔직히 잘 모르겠어요. 여기까지 이렇게 오셨다는 건, 상황도 다 들으셨단 말일 테고……."
10034060-38 = "어떻게든 저에게 좋은 말을 해 주시고, 이대로 다시 동아리로 데려가려 하신다고밖에 생각되지가 않아요."
10034060-39 = "하지만……."
10034060-40 = "하지만 그래서는 문제가 해결되지 않아요, 선생님. 이건 다른 아이들의 문제가 아니에요."
10034060-41 = "네. 다들 착하고 좋은 친구들이니까요. 그 이상으로 좋을 수 없는……. 최고의 친구들이죠."
10034060-42 = "……그러니까 이건 어디까지나 제 문제."
10034060-43 = "그런 친구들에게……. 폐가 되면 안 되니까요. 저로서는 기한 내에, 테스트를 통과할 실력이 못 되니까요."
10034060-44 = "그러니 지금이라도 츠무기 씨를……. 츠무기 씨라면, 그 정도는 쉽게 치실 테니까……."
10034060-49 = "……죄송……."
10034060-50 = "죄송해요, 선생님……. 그런 말씀 하러 오신 게 아니라는 것 정도는 알고 있는데……."
10034060-51 = "그렇지만……. 그렇지만요……."
10034060-52 = "이 이상……"
10034060-53 = "이 이상은 제가……."
10034060-54 = "제가 힘들어서……. 안 되겠어요……."
10034060-55 = "더는 못하겠어요. 죄송해요, 선생님……."
10034060-59 = "[ns7] \"편하게 말해줘, 아이리.\"\n[ns8] \"여기서는 괜찮으니까, 다 말해봐.\""
10034060-62 = "…………."
10034060-63 = "……두 장……."
10034060-64 = "두 장만큼 밀려 있었어요. 진도……. 다른 아이들은 다 저 앞을 치고 있는데……."
10034060-65 = "저만 겨우겨우……. 합주 맞추는 것도 잘 안돼서……."
10034060-66 = "연습은……. 연습은 내가 제일 많이 했는데……."
10034060-67 = "내가 제일 진지하고 열심히 쳤는데……. 나만 남아서 밤까지 혼자 쳤는데……. 이론도 혼자 공부했는데……."
10034060-71 = "내가……."
10034060-72 = "애초에 내가 하자고 해서 한 건데……."
10034060-73 = "[s9] \"……응. 그런 때도 있지.\"\n[s10] \"마음고생이 많았겠구나.\""
10034060-76 = "……네. 그럴 수 있겠죠. 그런 때도 있는 거겠죠."
10034060-77 = "말씀대로 그건 그럴 수 있어요. 저도 그것까지는 참을 수 있었어요. 하지만……."
10034060-78 = "하지만……. 그래서 제가 잘 못 하고 있으니, 다들 저에게 이런저런 말들을 해주더라고요."
10034060-80 = "괜찮아. 다 잘될 거야……."
10034060-81 = "셈라 먹을 만큼만 하면 돼. 적당히만 해도 괜찮아……."
10034060-82 = "편하게 해. 어차피 단체니까, 서로 커버하면 돼……."
10034060-84 = "분명 저를 위해서, 마음이 편해지라고 해 준 말이었어요. 저도 알고 있었어요."
10034060-85 = "알고 있었는데도……. 그거 아세요?"
10034060-86 = "그 말들이 제 귀에는 전혀 다르게 들리더라고요. ……제 안의 또 다른 제가, 전혀 다르게 말하더라고요."
10034060-88 = "……그러니까 그것조차 못하는 내가 문제야."
10034060-89 = "나는……. '적당히'의 수준도 맞추지 못해……."
10034060-90 = "나는 이렇게 해도, 결국 커버가 필요한 아이야……."
10034060-92 = "점점 그렇게 생각이 들고, 점점 더 심해지더니……. 도중부턴……."
10034060-96 = "도중부턴 더는……. 더는 듣기 싫다는 생각까지 해버렸어요……."
10034060-98 = "정말 내 기분을 모르는 걸까……?"
10034060-99 = "왜 속도 모르면서, 다들 그렇게 편하게 말을 하는 걸까……?"
10034060-103 = "사실……."
10034060-104 = "사실 다 알면서……. 은근히 떠 보는 게 아닐까?"
10034060-106 = "그제야 갑자기 정신이 번쩍 들었어요. 겨우 마지막에 가서야, 스스로 깨달았어요."
10034060-110 = "……그만해."
10034060-111 = "그럴 리가 없잖아. 너도 사실 다 알고 있잖아."
10034060-112 = "더 이상 그 아이들을 험담하지 마, 아이리. 그런 생각을 한다니. 어떻게 그럴 수 있어?"
10034060-113 = "네가 모자란 게 그 아이들 탓은 아니잖아. 대체 어디까지 못 난 거니? 아이리……?"
10034060-115 = "애초에……. 정말로 우스운 이야기지 않나요? 애초에 친구들끼리 그런 걸 신경 쓰는 게 어딨어요?"
10034060-116 = "친구끼리는 그러는 게 아니잖아요? 저도 아는데, 머리로는 그걸 모르는 것도 아닌데……."
10034060-117 = "그런데도 계속 신경 쓰여요. 그런……. 제가……. 제가 너무 싫어서……."
10034060-118 = "그렇게 안 하려 해도……. 안 하려고 해도 자기도 모르게 그런 생각을 하는 걸 어떻게 할 수가 없어요."
10034060-119 = "이게 제 천성……. 어쩔 수 없는 부분인 거예요. 저는 역시 이기적인 아이인 거예요."
10034060-120 = "이러다가는 언젠가……. 그 아이들을 상처 주고 말 거예요. 네. 반드시 그날이 와요."
10034060-121 = "그렇게 되기 전에……. 제가 먼저 나온 거예요. 이게 최선이에요, 선생님."
10034060-125 = "……대체 왜 이럴까요?"
10034060-126 = "카즈사 쨩은 저렇게 멋지고, 요시미 쨩은 저렇게 귀엽고 추진력도 좋고,"
10034060-127 = "나츠 쨩은 저렇게 생각도 깊고 특별한데, 저는……."
10034060-128 = "아니, '저만' 왜……? 아무것도 없는 주제에, 바라는 건 또 왜 이렇게 많을까요?"
10034060-129 = "왜 이렇게 속내가 이기적이고 못됐을까요?"
10034060-130 = "애초에……. 왜 저만 아무것도 없을까요? 왜 저는 이 모양일까요?"
10034060-131 = "왜 저는……."
10034060-132 = "……왜 이렇게 부족할까요?"
10034060-136 = "[ns11] \"………….\"\n[ns12] \"……아이리.\""
10034060-139 = "[ns13] \"……말해야 할 때가 왔구나.\"\n[ns14] \"……아이리가 놓치고 있는 게 있어.\""
10034060-142 = "……네? 그게 무슨……."
10034060-146 = "……음? 전화가……."
10034060-147 = "……아. 제 건 아니에요. 선생님 전화네요."
10034060-151 = "[ns15] \"……이 번호는…….\"\n[ns16] \"……<사육제 운영위원회>……?\""
10034060-155 = "……아, 늦은 밤중에 죄송합니다. 샬레의 선생님 되시죠?"
10034060-156 = "다름이 아니라, 저희가 지금……."
10034060-158 = "유치장에 학생 셋을 구금하고 있습니다만……."
