[translation]
10012005-1 = "프롤로그;한 치 앞도 모른다"
10012005-5 = "아비도스 대책위원회 부실"
10012005-9 = "……모두 모이셨나요? 도착하신 분은 손을 들어주세요."
10012005-13 = "응."
10012005-14 = "네~☆"
10012005-15 = "으헤……."
10012005-16 = "아저씨는 계속 여기서 자고 있었으니까……."
10012005-21 = "그렇군요. 그럼 안 오신 분은 없으시죠? 그럼 다 오신 것으로 간주하고 진행하겠습니다."
10012005-24 = "……?"
10012005-25 = "아야네. 아직 한 명이 도착하지 않았는데……."
10012005-26 = "세, 세리카 쨩에게는 나중에 따로……!"
10012005-27 = "뭔가 마음이 급해 보이네. 아야네 쨩."
10012005-31 = "……아무튼 오늘 이 자리에 여러분을 불러 모은 이유는, 한 가지 공지할 일이 생겼기 때문입니다!"
10012005-32 = "저희 대책위원회의 분기점이 될, 지금까지의 노력과 노고가 형태를 맺은 날이기 때문이죠."
10012005-33 = "매달 이자를 갚으면서도 남은 돈을 차곡차곡 모아 투자한 끝에 만들어낸 결실……."
10012005-34 = "대책위원회 최초의 중장비 비품……!!"
10012005-35 = "……아."
10012005-36 = "운동장에 있던 그거구나. 헬기……."
10012005-37 = "자, 자. 여기선 그냥 기다려 주자고. 모처럼 아야네 쨩이 들뜬 모습으로 말하고 있으니까."
10012005-38 = "응응! 뭘까요? 정말 궁금하네요!"
10012005-44 = "……바로……!!"
10012005-51 = "으아아아아아-!"
10012005-52 = "이거 봐, 이거 봐 다들!!! 큰일 났다, 큰일이야!!"
10012005-57 = "나 1등 당첨됐어어어!!!"
