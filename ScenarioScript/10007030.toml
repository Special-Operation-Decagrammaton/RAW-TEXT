[translation]
10007030-1 = "제3화;수상한 시선"
10007030-2 = "227호 온천장 특별 개인탕"
10007030-4 = "(탕에서 온천욕을 즐기고 있을 무렵…….)"
10007030-5 = "[s] \"좋은 온천이네~.\""
10007030-6 = "후후, 후후후……."
10007030-12 = "[ns1] \"누, 누구냐?!\"\n[ns2] \"……노도카냐?\""
10007030-15 = "이런, 이런. 들켜버린 모양이네."
10007030-16 = "이렇게 된 이상 직접 모습을 드러내는 수밖에……."
10007030-22 = "[ns] \"……너는?\""
10007030-23 = "안녕~ 소문은 이미 익히 들었지만 이렇게 보는 건 처음이네, 선생."
10007030-24 = "나는 지식해방전선의 히메키 메루! 팬 네임인 메루리로 불러도 좋아. ★"
10007030-25 = "[s3] \"지식해방전선이라면……\"\n[s4] \"이상한 책을 수집하는 그 모임?\""
10007030-26 = "응, 모미지와는 전에 만난 적 있지?"
10007030-27 = "동인 취향은 조금 다르기 하지만, 이 어수선한 붉은겨울 학원에서 등을 맡길 수 있는 몇 안 되는 동료 중 하나지. 후후……."
10007030-28 = "이상한 책이라니, 말이 심하네!"
10007030-29 = "지금은 분명 괴짜들의 취급을 받고 있긴 하지만……"
10007030-30 = "언젠간 BL이나 GL작품도 메이저 예술로 인정받는 날이 올 거라고!"
10007030-31 = "흠, 흠."
10007030-32 = "여하튼 이 사람이 온 키보토스의 학생들이 믿고 따른다던 그 선생인가……."
10007030-37 = "후후…… 역시 생각했던 대로의 모습이네."
10007030-38 = "이 육체와 바디 라인은 기록으로 남기지 않으면……."
10007030-42 = "아, 나는 신경 쓰지 말고 계속 느긋하게 목욕해."
10007030-43 = "나는 그저 그림을 그리고 있을 뿐이니까."
10007030-44 = "[s] \"더 신경 쓰여…….\""
10007030-45 = "응? 사진도 아니고 그림인데, 뭐가 신경 쓰여?"
10007030-46 = "그림이란 사람의 주관에 의존하는 창작 예술! 사진으로 찍는 것도 아니니, 부끄러워할 필요는 없다고."
10007030-47 = "[s] \"메루는 이곳에 뭐하러 온 거야?\""
10007030-48 = "응? 당연히 동인 소재를 찾으러 왔지."
10007030-49 = "선생도 알고 있겠지만, 초대형 동인 행사인 <코믹 센터>…… 약칭 <코미센>이 이제 얼마 남지 않았거든."
10007030-50 = "키보토스 전역의 동인 작품들이 일시에 배포되는 이 행사는 우리 <지식해방전선>에게도 아주 중요한 행사야."
10007030-51 = "새로 들여온 작품들을 읽고, 평가하고, 체리노 회장의 눈을 피해 도서관에 전시하고……."
10007030-52 = "모미지는 다른 학원에서 만든 작품들을 읽는 것만으로도 충분하다고 말하고 있지만, 그래서는 안 돼!"
10007030-53 = "유산계급처럼 앉아서 소비하는 데 그치지 않고, 직접 발로 뛰며 새로운 작품을 생산해야 진정한 붉은겨울 학원의 학생이라고 할 수 있지!"
10007030-54 = "……그런데 마침 이 근처에 근사한 온천장이 새로 생겼다지 뭐야?"
10007030-55 = "온천이라면 겨울을 배경으로 하는 애니메이션에서 빠지지 않는 단골 이벤트 장소!"
10007030-56 = "이곳이라면 코미센에 쓸 좋은 소재가 가득할거라는 생각에 바로 달려왔지!"
10007030-57 = "선생도 혹시 이 온천에서 뭔가 좋은 소재를 목격한 적이 있어?"
10007030-58 = "예를 들자면, 게헨나의 선임행정관과 트리니티의 정의부 부부장이 민달팽이처럼 달라붙어 알몸의 교제를 하는 장면이라던가……."
10007030-59 = "[s] \"……두 사람이 그럴 리가 없잖아.\""
10007030-60 = "에이, 세상에 절대라는 건 없다고!"
10007030-61 = "게다가 창작의 세계라는 건 심오하기 때문에, 약간의 빌미만 주어져도 얼마든지 상황을 부풀릴 수 있지."
10007030-62 = "'의외의 장소에서 마주친 두 숙적. 서로를 경멸에 찬 눈으로 흘겨보는데…….'"
10007030-63 = "'아아, 저 두 사람은 분명히 몰래 사귀고 있는 거야!' #n하아, 하아……."
10007030-64 = "[s5] \"이 녀석, 안 되겠어…….\"\n[s6] \"빨리 어떻게든 하지 않으면…….\""
10007030-71 = "지금 무얼 하고 계시는 건가요?!"
10007030-72 = "어라? 노도카 쨩이잖아?"
10007030-73 = "손님이 목욕하는 탕에 지배인이 멋대로 들어오다니. 이 온천장의 접객 교육은 어떻게 돼먹은 거야?"
10007030-74 = "그건 제가 할 말이에요! 왜 자꾸 남이 목욕하는 탕에 들어가서 수상한 시선으로 학생들을 지켜 보시는 건가요?"
10007030-75 = "벌써 대욕탕 두 곳과 노천탕 한 곳에서 목욕 중 수상한 시선이 느껴진다고 항의가 들어왔다고요!"
10007030-76 = "응? 나는 노천탕 쪽에는 간 적이 없는데."
10007030-77 = "노천탕에서 다른 학생들이 목욕하는 모습을 지켜보며 하악거렸던건…… 내가 아니라 노도카 쨩 아니야?"
10007030-78 = "그, 그랬었던가……?"
10007030-79 = "하, 하지만 다른 사람이 목욕하는 모습을 지켜보는 데 그치지 않고 스케치까지 한 메루 쨩의 죄질이 훨씬 나빠요!"
10007030-80 = "저는 그저 지배인으로서의 소임을 다했을 뿐이라고요?"
10007030-81 = "그렇게 치면 나도 그저 예술을 하고 있었을 뿐이거든?"
10007030-82 = "오히려 권력을 악용해서 다른 사람의 목욕을 훔쳐본 노도카 쨩이 더 나빠!"
10007030-83 = "여하튼! 탕을 즐기러 오신 손님들이 메루 양의 그 '예술 행위' 때문에 떠나시기라도 한다면 저희 온천장은 대손해를 입는다고요!"
10007030-84 = "유감이지만, 저희 온천장에서 나가주셔야겠어요!"
10007030-85 = "흥, 이쪽도 목숨을 걸고 그리고 있으니까!"
10007030-86 = "모처럼 좋은 소재를 얻을 수 있는 기회인데, 호락호락 물러날 수는 없어!"
10007030-87 = "우읏…… 계속 그렇게 비협조적으로 나오신다면……"
10007030-88 = "강제로 퇴거시키겠습니다!"
10007030-89 = "[s] \"그냥 둘 다 빨리 나가줬으면 좋겠어…….\""
