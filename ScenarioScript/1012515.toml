[translation]
1012515-1 = "마법의 시작점"
1012515-2 = "(예정된 업무를 마치고 에리가 기다리는 아틀리에로 향했다.)"
1012515-9 = "오오, 에리 쨩. 평소보다 과감한 색감이네?"
1012515-10 = "이 따스하면서도 정열적인 기운…… 평범한 추상화가 아닌 것 같아."
1012515-11 = "맞아. 이건 마치……."
1012515-12 = "아아, 그렇구나? 이게 바로 에리 쨩이 상상하는 그……?"
1012515-14 = "무, 무, 무슨 말씀인지 모르겠지만 저, 절대로 이상한 상상 아니니까요……!"
1012515-16 = "흐응? 정마아알?"
1012515-17 = "아닌 것 같은데에에?"
1012515-19 = "지, 진짜라고요……!"
1012515-21 = "아무튼 멋진 작품인 건 분명해."
1012515-22 = "우리 에리 쨩, 착실히 성장하고 있구나?"
1012515-27 = "그, 그런가요? 가, 감사합니다……. 에헤헤……."
1012515-32 = "[ns] \"얘들아, 안녕?\""
1012515-34 = "오, 안녕하세요, 선생님."
1012515-35 = "여기서 선생님이 나타난다는 건…… 후후, 역시 그랬구나?"
1012515-36 = "방해꾼은 빠져줄게! 다음에 또 이야기하자!"
1012515-37 = "그럼 나중에 또 봐요, 선생님!"
1012515-44 = "[ns] \"바, 방해꾼?\""
1012515-46 = "오, 오해니까요! 아무튼 저분들이 오해한 거니까요!"
1012515-47 = "[s] \"아무튼 이제 학과 친구들이랑 잘 어울리는구나.\""
1012515-48 = "그, 그런가요? 여전히 휘둘리기만 해서……."
1012515-49 = "뭐, 그래도 예전보다 나아지긴 했지만요."
1012515-50 = "[s1] \"이런 거 물어보기 조심스럽긴 한데…….\"\n[s2] \"예전에는 대체 어땠던 거야?\""
1012515-53 = "……대화는커녕 눈도 잘 못 마주쳤어요."
1012515-54 = "같은 학과 분들 앞에 서면 왠지 제가 초라하고 작게만 느껴져서……."
1012515-55 = "이 마법 모자가 없었더라면…… 아마 지금도 계속 피해 다녔을지도 몰라요."
1012515-56 = "마스터와 대화를 나누는 일도 불가능했을지도……."
1012515-57 = "[s3] \"자신감을 심어주는 마법의 모자구나!\"\n[s4] \"직접 만든 거야?\""
1012515-60 = "네? 아뇨. 저는 이런 멋진 모자 못 만들어요."
1012515-61 = "이 모자는……."
1012515-65 = "……아틀리에의 창고에 버려져 있던 아이였어요."
1012515-67 = "그게…… 대략 1년 전쯤의 이야기일까요?"
1012515-70 = "아틀리에의 창고"
1012515-73 = "하아아아아아……."
1012515-74 = "으으으, 또 창고에 숨어버리다니……."
1012515-75 = "이러면 안 되는데……. 왜 바보 같이 정말……."
1012515-76 = "이대로 있다간…… 친구도 못 사귀고 낙제를 거듭하다 학원에서 퇴출당하고 말 거예요……."
1012515-77 = "이러려고 와일드헌트에 왔던 게 아니었는데……."
1012515-78 = "……."
1012515-82 = "……?"
1012515-83 = "……어라? 저 모자는……?"
1012515-92 = "코, 콜록! 콜록, 콜록……!"
1012515-93 = "어우, 먼지……. 도대체 언제부터 여기에 있었던 걸까요?"
1012515-94 = "아무도 찾는 사람이 없었던 것 같은데."
1012515-95 = "뭔가……."
1012515-96 = "……불쌍해."
1012515-106 = "하아, 하아……."
1012515-107 = "저, 저, 저기……!"
1012515-113 = "응……? 지, 지금 우리한테 말을 건 거야?!"
1012515-114 = "오! 오오! 무슨 일이야? 말만 해! 뭐든 들어줄게!"
1012515-116 = "그, 그게 그러니까……."
1012515-120 = "혹시 창고에 있는…… 먼지 쌓인 마법 모자……. 주인이 있는 물건인가요……?"
1012515-122 = "응? 글쎄? 난 모르겠는데? 넌 알겠어?"
1012515-123 = "그런 모자가 있다는 것도 지금 알았어."
1012515-124 = "아마 우리보다 창고 관리자한테 물어보는 게 더 빠를지도?"
1012515-126 = "그, 그렇군요!"
1012515-127 = "가, 가, 감사합니다……!"
1012515-132 = "……와. 방금 뭐야? 나 쟤 목소리 처음 들어."
1012515-133 = "뭐, 좋은 시작을 알리는 신호일지도?"
1012515-136 = "……이후 창고 관리자한테 물어봤는데, 꽤 오래전부터 창고에 버려져 있었대요."
1012515-137 = "너무 오래돼서 언제부터 있었는지조차 모르겠다고……."
1012515-138 = "보통 이런 물건은 버리지만, 불길한 마녀 모자라 건드리지 않았대요."
1012515-139 = "저주라도 받으면 어쩌나, 안 좋은 기운이 옮겨붙는 게 아닐까…… 뭐 그런 이유 때문에요."
1012515-140 = "오래된 물건엔 영혼이 깃든다는 이야기도 있잖아요?"
1012515-141 = "[s] \"……그래서 계속 방치됐던 거구나.\""
1012515-142 = "……네."
1012515-146 = "그런데 신기하게도 저는 이 모자를 보자마자 운명을 느꼈어요."
1012515-147 = "먼지가 쌓여 있는 모습이…… 왠지 주변 사람들과 어울리지 못하는 저를 보는 것 같았거든요."
1012515-148 = "그래서 창고 관리자한테 허락받아서 모자를 가져왔죠."
1012515-149 = "깨끗하게 세탁하고, 해진 부분을 꿰매고, 엉성하게 수습된 부분은 붉은 천을 묶어서 가리고……."
1012515-150 = "그런 다음에 모자를 써봤는데, 이상할 정도로 자신감이 마구 생기는 거예요."
1012515-151 = "넓은 챙에 주변의 시선이 가려져서 그런 게 아닐지 생각하기도 했지만……."
1012515-152 = "이 모자엔 마법이 깃들어 있는 것이 분명해요! 뭔가 특별한 마법이요!"
1012515-153 = "그렇지 않다면 처음의 운명적 만남이 설명되지 않아요!"
1012515-154 = "[s] \"응. 그럴지도!\""
1012515-155 = "……이 모자가 없었다면 지금의 저도 없었을 거예요."
1012515-156 = "마스터와 만나지도 못했을 거고요."
1012515-157 = "이전 주인이 누구인지는 모르지만, 어째서 그런 곳에 방치했는지도 모르지만……."
1012515-158 = "이제 이 모자는 제 분신이나 다름없어요!"
1012515-159 = "그러니까, 평생 아껴줄 거예요!"
1012515-160 = "[s] \"지금까지 관리 잘했으니까, 에리라면 할 수 있을 거야.\""
1012515-161 = "뉴후후. 감사합니다, 마스터."
1012515-162 = "아, 참. 혹시 괜찮으시다면 한번 써보시겠나요?"
1012515-163 = "마스터도 한번 느껴보셨으면 좋겠어요! 평소와는 다른 기운이 느껴질 거예요!"
1012515-164 = "[s5] \"내가 그 모자를……?\"\n[s6] \"괜찮겠어?\""
1012515-167 = "물론이죠!"
1012515-171 = "자! 써보세요!"
1012515-178 = "오오! 역시 마스터한테도 잘 어울리네요!"
1012515-179 = "흐음, 흐음. 역시 제가 보는 눈이 있다고 할까요?"
1012515-180 = "어떠신가요? 자신감이 마구마구 솟는 것 같지 않나요?"
1012515-181 = "[s] \"뭔가 특별한 기운이 느껴지는 것 같아!\""
1012515-182 = "뉴후훗, 역시 그렇다니까요?"
1012515-183 = "좀 더 쓰고 계셔도 좋아요! 지금은 이곳에 우리 둘뿐이니, 마나 공명도 좀 더 확실히……."
1012515-184 = "우리 둘뿐이니…… 공명이……."
1012515-188 = "모자가…… 어라?"
1012515-189 = "[s7] \"그러고 보니…….\"\n[s8] \"모자를 벗어도 부끄럽지 않은 거야?\""
1012515-192 = "……."
1012515-196 = "……!!"
1012515-198 = "아, 아앗! 저도 모르게 마스터의 앞에서 또 이런 파렴치한 모습을……!!"
1012515-199 = "크, 큰일 났어요……! 이, 이럴 땐 어서 기억을 지우는 마법을 사용해야……!!"
1012515-200 = "비, 비켜주세요, 마스터! 그, 금방 끝낼 테니까……!!"
1012515-201 = "[s] \"진정해! 모자 돌려줄 테니까……!\""
1012515-204 = "(이후 재빨리 에리에게 모자를 씌워주며 기억을 지우는 마법의 발동을 막았다…….)"
1012515-208 = "헉, 헉……. 가, 감사합니다, 마스터."
1012515-209 = "저도 모르게 이상한 짓을 해버렸네요."
1012515-210 = "아, 아무튼 오늘 뵙자고 했던 건 제 그림을 드리려고 했던 거니까……."
1012515-211 = "마침 물감이 다 마른 것 같네요! 잘 챙겨드릴게요!"
1012515-217 = "(에리가 부끄러워하는 것 같아 얼른 그림을 받고 아틀리에를 나서기로 했다.)"
1012515-223 = "그, 그럼 다음에 또 뵈어요, 마스터!"
1012515-224 = "[s] \"응! 다음에 또 봐!\""
1012515-226 = "(그렇게 샬레로 돌아가는 길. 이상할 정도로 에리의 모습이 머릿속에 맴돌았다.)"
1012515-230 = "(분신 같은 모자를 나에게 씌워주었던…… 순수하고 명랑한 에리의 모습이.)"
