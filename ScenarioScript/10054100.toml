[translation]
10054100-1 = "第10話;有時必要之物"
10054100-2 = "門主大人，駕到。"
10054100-3 = ""
10054100-4 = "門主……？"
10054100-5 = "大人……？"
10054100-6 = "難，難道說！？！？！？"
10054100-8 = "呵呵，沒錯……"
10054100-9 = "門主大人！駕到～！！！"
10054100-10 = "是的！門主大人駕到啦～！"
10054100-11 = ""
10054100-12 = "[ns1] 「門主大人駕到！」\n[ns2] 「所有人還不趕緊低頭行禮！！！」"
10054100-15 = ""
10054100-16 = ""
10054100-17 = "請，請稍微冷靜點……老師……"
10054100-18 = "會使用門主這個稱號，難道是山海經的……？"
10054100-19 = "那個名號豈是你們可以隨口提起的！"
10054100-20 = "這次又是誰！？"
10054100-21 = ""
10054100-23 = ""
10054100-25 = ""
10054100-26 = "抗強扶弱，銘恩不忘，但憑心中大義策馬向前！"
10054100-27 = "順天意而行義，秉俠道而濟蒼生！"
10054100-28 = "吾等之名乃山海經……玄龍門！"
10054100-29 = "（唔哦……！剛才那段簡直帥呆了！）"
10054100-30 = "……等一下，那我們呢？"
10054100-31 = "玄龍門？不就是那群超難溝通的死腦筋集團嗎！？#n我還聽說連用錢都沒辦法搞定……！"
10054100-32 = "難道這些大人之所以突然變得那麼囂張，就是因為這個……？"
10054100-33 = "死腦……筋……"
10054100-34 = "可是那些山海經的笨蛋為什麼會在這裡……？"
10054100-35 = "這還用問嗎？還不是因為你們太過任性妄為，完全不懂得自制。"
10054100-36 = "你……你說什麼！？"
10054100-37 = "人可不是長得像就是人，而是要做出符合人道的行為才能被稱為人。"
10054100-38 = "你們應該慶幸自己運氣好。#n要是在梅花園早就被狠狠教訓一頓了知道嗎？至少我是不會放過你們的。"
10054100-39 = "什，什麼啊！你明明跟我們一樣也是小孩子！"
10054100-40 = "一樣是小孩子？#n受不了，現在的小鬼頭真的是吼……"
10054100-41 = "不管是嘮叨還是教訓，全都是為了你們的將來著想！"
10054100-42 = "你們以為看著那些被罵哭的孩子，我們的心裡會好受嗎？"
10054100-43 = "那就隨我們高興，別管我們不就好了！"
10054100-44 = "那樣孩子們要怎麼好好長大！#n看看現在在這裡胡鬧的你們就知道了！"
10054100-45 = "我們就是想照自己的想法做事……！你們大人根本不懂小孩子的心情！"
10054100-46 = "我們大人曾經也是小孩子啊！"
10054100-47 = "醜話先說在前頭，勸你們在還能用嘴巴說的時候乖乖聽話比較好哦？"
10054100-48 = "否則等將來教訓你們的變成規則或法律的時候，就沒有人幫得了你們了。"
10054100-49 = "反正我們還小不會有事啦！"
10054100-50 = "你們以為那是什麼免死金牌嗎？#n而且你們該不會以為自己永遠不會長大吧？"
10054100-51 = "呵呵。已經足夠了，心菜教官。#n汝的那番教誨，的確是為了他們的將來著想……"
10054100-52 = "然而若能在那般年紀便悟得此理，恐怕也無法稱之為孩童了吧。"
10054100-53 = "儘管這不過是妾身的一己之見……"
10054100-54 = "過於早熟的孩子，心裡多半也藏有不為人知的悲苦。"
10054100-55 = "因此也別太過責備雛鳥組的孩子們──"
10054100-56 = ""
10054100-58 = ""
10054100-60 = "咳咳……！"
10054100-61 = ""
10054100-62 = ""
10054100-63 = ""
10054100-65 = "[ns]「妃姬！？」"
10054100-66 = "門，門主大人！？！？"
10054100-67 = ""
10054100-69 = ""
10054100-72 = ""
10054100-73 = "通，通通不准動！#n不然我……我就把你們的門主大人給……！"
10054100-74 = ""
10054100-76 = ""
10054100-77 = "這，這樣好嗎……？這麼做真的沒問題嗎……！？"
10054100-78 = "看起來好像有點不太妙耶……？"
10054100-79 = ""
10054100-81 = ""
10054100-82 = "不要怕！全都……全都是其他人的錯！"
10054100-83 = "既然事情變成這樣……乾脆把山海經還是什麼的全都搶過來算了！我們一定做得到！"
10054100-84 = "這些傢伙……"
10054100-85 = "本來看在你們年紀還小才手下留情，竟敢對門主大人……！"
10054100-86 = "就是說啊。就算是小孩子，也有必要讓他們明白有些界線是不可以跨越的。"
10054100-87 = "！？"
10054100-88 = ""
10054100-90 = ""
10054100-91 = ""
10054100-92 = ""
10054100-95 = "看來我們的孩子，好像還不明白這種事情是不可以做的呢。"
10054100-96 = "咦，咦……？"
10054100-97 = "不可以造成別人的麻煩──這是最基本的規矩。"
10054100-98 = ""
10054100-101 = "嗚哇啊！？！？哇啊啊啊啊啊啊──！？！？"
10054100-102 = "還有，不可以為了自己的利益而利用別人。"
10054100-103 = "好痛！屁股好痛啊啊啊啊啊！！！"
10054100-104 = "要是不趁現在養成習慣，將來可是會釀成大禍的哦。"
10054100-105 = "對，對不起！我知道錯了！！！！！"
10054100-106 = ""
10054100-107 = "那邊那兩位朋友也是。"
10054100-108 = ""
10054100-110 = ""
10054100-111 = ""
10054100-112 = ""
10054100-113 = "噫，噫……！？"
10054100-114 = "啊嗚，啊啊啊啊……！"
10054100-115 = ""
10054100-118 = "朋友誤入歧途的時候，不可以跟著一起走過去。"
10054100-119 = "嗚哇啊啊！屁股，我的屁股啊！！！"
10054100-120 = "而是要對他說「不可以」，那樣才是真正的朋友哦。"
10054100-121 = "啊，啊嗚……！噫……！！！"
10054100-122 = "不是大家一起就可以闖紅燈，而是就算大家一起也要等紅燈。"
10054100-123 = "嗚哇啊啊啊啊啊……！！！"
10054100-124 = ""
10054100-125 = "各位都明白了嗎？"
10054100-126 = "嗚……嗚嗚……"
10054100-127 = "嗚嗚嗚……"
10054100-128 = "唔唔……嗚嗚……"
10054100-129 = "您沒事吧，門主大人？"
10054100-130 = "……是旬教官啊。承蒙相助了。"
10054100-131 = "門主大人言重了。#n剛才您突然沒有站穩，真是嚇了我一跳呢。"
10054100-132 = "妾身沒事。呵呵……看來妾身在渡假勝地多少有些得意忘形了呢。"
10054100-133 = ""
10054100-136 = ""
10054100-138 = "[ns] 「妃姬……」"
10054100-139 = "老師……"
10054100-140 = "……呵呵。"
10054100-141 = "日後，吾等二人單獨好好談談吧。"
10054100-142 = "你們這群傢伙！竟敢……竟敢打我的屁股！"
10054100-143 = "接下來我絕對不會放過你們的！！！"
10054100-144 = "……到底是誰不放過誰啊。"
10054100-145 = "旬姐姐都已經那麼做了還得寸進尺，你們這群臭小鬼！"
10054100-146 = "唉……這下確實是沒辦法了呢！"
