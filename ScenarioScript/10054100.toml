10054100-17 = "P-Please exercise some restraint, Sensei."
10054100-18 = "Surely they don't mean \"Madam,\" as in Shanhaijing's—"
10054100-19 = "How dare you speak Madam Kisaki's name so flippantly!"
10054100-20 = "And who are you?!"
10054100-21 = ""
10054100-23 = ""
10054100-25 = ""
10054100-26 = "We are the bulwark against evil and guardian of the weak! We repay every kindness and slight given to us in kind!"
10054100-27 = "We walk the path of Heaven's will with chivalry and dignity!"
10054100-28 = "We are...Genryumon of Shanhaijing!"
10054100-29 = "(That was it! That was so hard-boiled!)"
10054100-30 = "...Um, what about us?"
10054100-31 = "Isn't Genryumon full of a bunch of pretentious idiots who operate off of phony stuff like ideals? I hate people who can't be bribed!"
10054100-32 = "You think it's because of THEM the adults here started acting out?"
10054100-33 = "She...called us...idiots..."
10054100-34 = "What in the heck are a bunch of Shanhaijing dummies doing here?"
10054100-35 = "Because of you! Your reckless and inconsiderate behavior stops here!"
10054100-36 = "What?! "
10054100-37 = "First off, you don't get to claim yourselves members of society without acting like civilized beings first!"
10054100-38 = "All of you are lucky you're not Plum Blossom students! I would've given you the scolding of a lifetime!"
10054100-39 = "Y-You woulda?! You're just a kid, like us!"
10054100-40 = "\"Just a kid.\" I can't stand your generation!"
10054100-41 = "Do you think it's fun being a nag? We do it for your own good!"
10054100-42 = "It's not like we enjoy scolding children and seeing them cry as a result! We hate it, in fact!"
10054100-43 = "If you hate it so much, then let us do whatever we wanna! It ain't that hard!"
10054100-44 = "We can't, because otherwise we end up with little miscreants like you all! And look at all the trouble you've caused for those around you!"
10054100-45 = "We ain't care! We ain't care one bit! Stupid adults have no idea how it feels to be a kid!"
10054100-46 = "Are you kidding? Of course I know how it feels! I used to be a kid too!"
10054100-47 = "Here's another lesson. You should listen when people are still asking nicely."
10054100-48 = "One day, harsh scoldings will turn into real consequences. Rules become laws, and you'll find the Corrections Bureau isn't nearly as forgiving as we are!"
10054100-49 = "Psh! We ain't gots to worry about stuff like that! We're just kids!"
10054100-50 = "You can't pull the age card for the rest of your life! The habits you develop now will follow you into adulthood!"
10054100-51 = "Let us not be too harsh, Instructor Kokona. Yes, proper discipline is essential to setting one on the correct path."
10054100-52 = "However, that in itself is a difficult concept for a child to grasp. That sort of understanding only comes with time."
10054100-53 = "And perhaps I am imposing my own philosophy here..."
10054100-54 = "But I find young ones who could not enjoy the innocence of childhood often harbor the greatest sadness of all. "
10054100-55 = "Therefore, a better alternative to scolding these children—"
