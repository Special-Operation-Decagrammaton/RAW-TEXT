[translation]
10054100-1 = "10화;때때로 필요한 것"
10054100-2 = "문주님, 행차하십니다."
10054100-4 = "문주……?"
10054100-5 = "님……?"
10054100-6 = "서, 설마???!!!"
10054100-8 = "후후, 그렇지……."
10054100-9 = "문주님! 행차하십니다!!!"
10054100-10 = "맞아요! 문주님 행차이신 거예요!"
10054100-12 = "[ns1] \"문주님 행차시다!\"\n[ns2] \"다들 어서 머리를 조아리지 못할까!!!\""
10054100-17 = "조, 조금 진정해 다오. 선생……."
10054100-18 = "문주라는 칭호를 쓴다는 것은 혹시, 산해경의……?"
10054100-19 = "그 이름은 사사로이 입에 올릴 것이 아니니!"
10054100-20 = "또 누구야?!"
10054100-26 = "강자에 맞서 약자를 지키고, 받은 은혜를 기억하며 옳음을 위해 달린다!"
10054100-27 = "하늘의 뜻에 따라 의를 행하고 협을 펼치니!"
10054100-28 = "우리의 이름은 산해경…… 현룡문이라 한다!"
10054100-29 = "(크으……! 지금, 끝내줬어!)"
10054100-30 = "……저기, 우리는?"
10054100-31 = "현룡문? 그거, 웬만해서는 이야기고 뭐고 안 통하는 꼴통 집단이잖아?! 심지어 돈으로도 어떻게 안 된다던데……!"
10054100-32 = "설마, 여기 어른들이 갑자기 건방져진 것도 그것 때문에……?"
10054100-33 = "꼴…… ㅌ……."
10054100-34 = "그런데, 그 산해경의 바보들이 여긴 어째서……?"
10054100-35 = "어째서긴 어째서야. 너희가 너무 천방지축에 제멋대로니까 그렇지."
10054100-36 = "뭐…… 라고요?!"
10054100-37 = "애초에 말이지, 사람이라고 다 사람인 줄 알아? 사람다운 행동을 해야 사람인 거야."
10054100-38 = "너희들 그나마 운 좋은 줄 알아. 매화원이었으면 다 엄청나게 혼났을걸? 일단 내가 가만 안 둘 거고."
10054100-39 = "뭐, 뭐야! 너나 우리나 어차피 같은 애들이면서!"
10054100-40 = "같은 애들이라고? 하여튼 이러니까 요즘 어린 것들은……."
10054100-41 = "잔소리하고 혼내는 것도, 다 나중에 너희를 위해서 그러는 거라고!"
10054100-42 = "혼나서 우는 아이들 보는 거, 우리라고 해서 마음이 좋지는 않거든?"
10054100-43 = "그러면 우리 마음대로 하게 내버려두면 되는 거잖아!"
10054100-44 = "그러면 아이들이 제대로 자라겠냐고! 당장 지금 여기 있는 너희들만 봐도, 이렇게 사고를 쳐 대고 있는데!"
10054100-45 = "우리는 우리가 하고 싶은 대로 할 거예요……! 어른들은 아이들의 마음, 모르잖아요!"
10054100-46 = "그 아이들이 커서 된 게 나란 말이야!"
10054100-47 = "그리고 미리 이야기해 두는 건데, 아직 말로 할 때 잘 듣는 게 좋을걸?"
10054100-48 = "언젠가는 말이 아니라 규칙이나 법률 같은 걸로 혼나게 될 거고, 그때는 아무도 뭐라고 못 해준다?"
10054100-49 = "아직 우린 어리니까 괜찮거든?!"
10054100-50 = "그게 무슨 면죄부인 줄 알아? 그리고 너희들은 나이 안 먹을 줄 알지?"
10054100-51 = "후후. 그만하면 되었다, 코코나 교관. 분명 적지 않은 꾸지람은 나중을 위한 것이다만……."
10054100-52 = "그것을 그 시점에 깨달을 수 있다면, 이미 아이라고 할 수 없는 것이겠지."
10054100-53 = "그리고 이것은 나의 개인적인 견해다만……."
10054100-54 = "지나치게 웃자란 아이는, 그만큼 슬픈 부분을 품고 있기도 하기 마련이란다."
10054100-55 = "그러니 여기에서는 저 병아리파라는 아이들을, 지나치게 나무라지 말고–"
10054100-60 = "쿨럭……!"
10054100-65 = "[ns] \"키사키?!\""
10054100-66 = "무, 문주님??!!"
10054100-73 = "모, 모두 꼼짝 마! 여차하면 이…… 너희들의 문주라는 학생을……!"
10054100-77 = "괘, 괜찮을까……? 이래도, 괜찮은 걸까……?!"
10054100-78 = "이건 조금, 위험성이 있어 보이는데요……?"
10054100-82 = "겁먹지 마! 모두…… 모두 다른 사람들이 나쁜 거라고!"
10054100-83 = "이렇게 된 거…… 산해경이고 뭐고, 전부 우리가 차지해 버리면 되는 거야! 우리라면 할 수 있어!"
10054100-84 = "이 녀석들이……."
10054100-85 = "어리다고 참아 주고 있었는데, 감히 문주님께……!"
10054100-86 = "그러네요. 아무리 아이들이라고 해도, 선을 넘으면 안 된다는 것은 가르쳐 줄 필요가 있지요."
10054100-87 = "?!"
10054100-95 = "우리 어린이, 이런 짓을 하면 안 된다는 걸 아직 잘 모르는 모양이네요."
10054100-96 = "어, 어어……?"
10054100-97 = "기본적인 규칙이에요. 남에게 피해를 주면 안 된답니다."
10054100-101 = "우아앙?!?! 와아아아아아-??!!"
10054100-102 = "그리고 다른 사람을 자기 이익을 위해 이용하면, 더더욱 안 돼요."
10054100-103 = "아파! 엉덩이 아파아아아아아!!!"
10054100-104 = "지금부터 습관을 들이지 않으면, 나중에는 정말로 큰일이 되고 말아요."
10054100-105 = "죄, 죄송해요! 잘못했어요!!!!!"
10054100-107 = "그리고 거기 두 친구도 말인데요."
10054100-113 = "히, 히잇……?!"
10054100-114 = "아우, 아아아아아……!"
10054100-118 = "친구가 잘못된 길로 가고 있으면, 같이 그 길로 가는 게 아니라."
10054100-119 = "와아앙! 엉덩이가, 엉덩이가!!!"
10054100-120 = "그러면 안 된다고 말해 줄 수 있어야, 진짜 친구랍니다."
10054100-121 = "하, 하읏……! 히잇……!!!"
10054100-122 = "함께라면 빨간 불을 건널 수 있는 게 아니라, 함께라도 빨간 불을 기다려야 하는 거예요."
10054100-123 = "히우우우우우우우……!!!"
10054100-125 = "알았나요, 여러분?"
10054100-126 = "웃……. 우웃……."
10054100-127 = "아으으으……."
10054100-128 = "훌쩍……. 흐윽……."
10054100-129 = "괜찮으신가요, 문주님?"
10054100-130 = "……슌 교관인가. 신세를 졌구나."
10054100-131 = "별말씀을요. 갑자기 비틀거리셔서, 놀랐답니다."
10054100-132 = "괜찮다. 후후……. 조금, 휴양지에서 여러모로 지나치게 들떴던 모양이구나."
10054100-138 = "[ns] \"키사키…….\""
10054100-139 = "선생……."
10054100-140 = "……후후."
10054100-141 = "나중에, 둘이서만 제대로 이야기하도록 하자꾸나."
10054100-142 = "너희들! 감히…… 감히 우리 엉덩이를 때렸겠다!"
10054100-143 = "이제 절대로 안 봐 줄 테니까!!!"
10054100-144 = "……누가 누굴 안 봐 준다는 거야."
10054100-145 = "슌 언니가 그렇게까지 해 줬는데, 보자 보자 하니까 이 꼬맹이들이!"
10054100-146 = "뭐…… 이건 확실히 어쩔 수 없네!"
