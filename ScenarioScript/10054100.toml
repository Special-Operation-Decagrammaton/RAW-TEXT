[translation]
10054100-1 = "ตอนที่ 10;สิ่งที่จำเป็น"
10054100-2 = "ท่านประมุขเสด็จแล้ว"
10054100-3 = ""
10054100-4 = "ท่าน...?"
10054100-5 = "ประมุข...?"
10054100-6 = "ยะ... อย่าบอกนะ???!!!"
10054100-8 = "ฮุฮุ ใช่แล้ว..."
10054100-9 = "ท่านประมุข! เสด็จแล้วค่ะ!!!"
10054100-10 = "ใช่ค่ะ! นี่ละท่านประมุข!"
10054100-11 = ""
10054100-12 = "[ns1] \"ท่านประมุขเสด็จแล้ว!\"\n[ns2] \"ทุกคนยังไม่รีบก้มหัวอีกหรือ!!!\""
10054100-15 = ""
10054100-16 = ""
10054100-17 = "ชะ... ช่วยใจเย็นลงสักหน่อยเถอะ ครู..."
10054100-18 = "ใช้ตำแหน่งว่าประมุข หรือว่าจะเป็น... ประมุขของซานไห่จิง?"
10054100-19 = "ชื่อนั้นไม่ใช่สิ่งที่จะกล่าวถึงได้ตามอำเภอใจหรอกนะ!"
10054100-20 = "คราวนี้ใครอีกล่ะ?!"
10054100-21 = ""
10054100-23 = ""
10054100-25 = ""
10054100-26 = "ต่อกรผู้แข็งแกร่งเพื่อปกป้องผู้อ่อนแอ ไม่ลืมบุญคุณที่ได้รับ และพุ่งทะยานไปเพื่อความถูกต้อง!"
10054100-27 = "ดำเนินตามเจตจำนงแห่งสวรรค์ ผดุงความชอบธรรม และสำแดงน้ำใจแห่งจอมยุทธ์!"
10054100-28 = "นามของพวกเราคือมังกรดำ... แห่งซานไห่จิง!"
10054100-29 = "(หึหึ...! เมื่อกี้เจ๋งสุดๆ ไปเลย!)"
10054100-30 = "เดี๋ยวก่อน แล้วพวกเราล่ะ...?"
10054100-31 = "มังกรดำ? นั่นมันกลุ่มพวกหน้ามึนที่พูดอะไรไปก็ไม่รู้เรื่องไม่ใช่เหรอ?! ได้ยินมาว่าแม้แต่เงินก็ทำอะไร#nพวกนั้นไม่ได้ด้วย...!"
10054100-32 = "หรือว่าที่จู่ๆ พวกผู้ใหญ่ที่นี่ก็อวดดีขึ้นมา เป็นเพราะมังกรดำพวกนี้...?"
10054100-33 = "หน้า... มึน...?"
10054100-34 = "แล้วพวกโง่จากซานไห่จิงมาทำอะไรที่นี่กันล่ะ...?"
10054100-35 = "ยังจะถามอีก ก็เพราะพวกเธอซุกซน ไม่รู้จักยั้งคิด และเอาแต่ใจเกินไปน่ะสิ"
10054100-36 = "ว่าอะไร... นะคะ?! "
10054100-37 = "ก่อนอื่นเลยนะ คิดว่าแค่เกิดเป็นคน ก็จะเรียกว่าเป็นคนได้ทุกคนเหรอ? ต้องทำตัวให้สมกับเป็นคนสิ ถึงจะเรียกว่าคนได้"
10054100-38 = "พวกเธอน่ะ ถือว่ายังโชคดีนะ ถ้าเป็นที่สวนต้นบ๊วยละก็ ทุกคนคงโดนดุยับไปแล้ว อย่างน้อยฉันก็ไม่ปล่อยไว้เฉยๆ หรอก"
10054100-39 = "อะ... อะไรกัน! เธอกับพวกเราก็เป็นเด็กเหมือนกันไม่ใช่เหรอ!"
10054100-40 = "เป็นเด็กเหมือนกันงั้นเหรอ? ให้ตายสิ เด็กสมัยนี้..."
10054100-41 = "ที่พวกเราทั้งคอยดุบ่น ทั้งหมดก็ทำเพื่ออนาคตของพวกเธอนะ!"
10054100-42 = "พวกเราเองก็ไม่ได้รู้สึกดีเวลาเห็นเด็กที่ถูกดุแล้วร้องไห้เลยสักหน่อย"
10054100-43 = "ถ้างั้นก็ปล่อยให้พวกเราทำตามใจชอบสิ!"
10054100-44 = "ถ้าทำแบบนั้น เด็กๆ จะเติบโตมาอย่างถูกต้องได้ยังไง! แค่ดูพวกเธอที่อยู่ตรงหน้าตอนนี้ก็รู้แล้ว เอาแต่ก่อเรื่องไม่หยุดอยู่แบบนี้!"
10054100-45 = "พวกเราจะทำตามใจตัวเองค่ะ...! พวกผู้ใหญ่น่ะ ไม่เข้าใจหัวอกเด็กๆ หรอกค่ะ!"
10054100-46 = "ฉันก็คือเด็กพวกนั้นที่เติบโตขึ้นมานี่แหละ!"
10054100-47 = "แล้วขอเตือนไว้ก่อนนะ ตอนที่ยังพูดกันดีๆ อยู่ก็ควรตั้งใจฟังไว้จะดีกว่า"
10054100-48 = "สักวันหนึ่ง พวกเธอจะไม่ได้ถูกดุด้วยคำพูด แต่จะถูกกฎหรือกฎหมายลงโทษ และเมื่อถึงตอนนั้น ต่อให้ใครอยากช่วยก็ช่วยไม่ได้แล้วนะ?"
10054100-49 = "พวกเรายังเด็กอยู่ เพราะงั้นไม่เป็นไรหรอก!!"
10054100-50 = "คิดว่านั่นเป็นข้ออ้างให้ทำผิดได้เหรอ? แล้วพวกเธอคิดว่าจะไม่โตขึ้นหรือไง?"
10054100-51 = "ฮุฮุ พอเท่านั้นเถอะ ผู้ฝึกสอนโคโคน่า จริงอยู่ว่า คำดุตักเตือนล้วนมีไว้เพื่อประโยชน์ในวันข้างหน้า..."
10054100-52 = "แต่หากเข้าใจเรื่องนั้นได้ตั้งแต่ตอนที่ถูกดุ ก็คงไม่อาจเรียกว่าเป็นเด็กได้หรอก"
10054100-53 = "และนี่ก็เป็นเพียงความเห็นส่วนตัวเท่านั้น..."
10054100-54 = "แต่เด็กที่เติบโตเกินวัยมากเท่าไร ก็มักจะเก็บซ่อนความเศร้าไว้ในใจมากเท่านั้น "
10054100-55 = "เช่นนั้นก็อย่าตำหนิเด็กๆ แก๊งลูกเจี๊ยบแรงเกินไปเลย..."
10054100-56 = ""
10054100-58 = ""
10054100-60 = "แค่ก...!"
10054100-61 = ""
10054100-62 = ""
10054100-63 = ""
10054100-65 = "[ns] \"คิซากิ?!\""
10054100-66 = "ทะ... ท่านประมุข??!!"
10054100-67 = ""
10054100-69 = ""
10054100-72 = ""
10054100-73 = "ทะ... ทุกคนอย่าขยับ! ไม่อย่างนั้น เด็กคนนี้... นักเรียนที่พวกเธอเรียกว่าประมุข...!"
10054100-74 = ""
10054100-76 = ""
10054100-77 = "จะ... จะไม่เป็นไรเหรอ...? ทำแบบนี้... จะไม่เป็นไรจริงๆ เหรอ...?!"
10054100-78 = "แบบนี้ดูจะเสี่ยงอยู่สักหน่อยนะคะ...?"
10054100-79 = ""
10054100-81 = ""
10054100-82 = "อย่ากลัวสิ! ทุกอย่าง... ทุกอย่างเป็นความผิดของคนอื่นทั้งนั้น!"
10054100-83 = "ในเมื่อเรื่องมันเป็นแบบนี้แล้ว... ไม่ว่าจะซานไห่จิงหรืออะไรก็ช่าง แค่ยึดทุกอย่างมาเป็นของพวกเราให้หมดก็พอ! พวกเราทำได้!"
10054100-84 = "เด็กพวกนี้นี่..."
10054100-85 = "อุตส่าห์อดทนให้เพราะเห็นว่ายังเด็ก กล้าดียังไงถึงทำกับท่านประมุข...!"
10054100-86 = "นั่นสินะคะ ต่อให้เป็นเด็ก ก็จำเป็นต้องสอนให้รู้ว่าห้ามล้ำเส้นค่ะ"
10054100-87 = "?!"
10054100-88 = ""
10054100-90 = ""
10054100-91 = ""
10054100-92 = ""
10054100-95 = "เด็กน้อยของเรา ดูเหมือนจะยังไม่เข้าใจนะคะว่าห้ามทำเรื่องแบบนี้"
10054100-96 = "เอะ... เอ๋...?"
10054100-97 = "ห้ามสร้างความเดือดร้อนให้ผู้อื่น นี่เป็นกฎพื้นฐานค่ะ"
10054100-98 = ""
10054100-101 = "แงงง?!?! ว้ายยยยยย??!!"
10054100-102 = "และการใช้คนอื่นเป็นเครื่องมือเพื่อผลประโยชน์ของตัวเอง ยิ่งเป็นเรื่องที่ห้ามทำเด็ดขาดเลยค่ะ"
10054100-103 = "เจ็บนะ! เจ็บก้นนนนนน!!!!!"
10054100-104 = "หากไม่สร้างนิสัยที่ดีตั้งแต่ตอนนี้ ต่อไปจะเป็นเรื่องใหญ่จริงๆ นะคะ"
10054100-105 = "ขะ... ขอโทษค่ะ! หนูผิดไปแล้วค่ะ!!!!!"
10054100-106 = ""
10054100-107 = "อีกสองคนที่อยู่ตรงนั้นด้วยค่ะ"
10054100-108 = ""
10054100-110 = ""
10054100-111 = ""
10054100-112 = ""
10054100-113 = "ฮะ... เฮือก...?!"
10054100-114 = "โอ๊ย อ๊าาาาา...!"
10054100-115 = ""
10054100-118 = "ถ้าเพื่อนกำลังเดินไปในทางที่ผิด ก็ไม่ควรเดินตามไปด้วย"
10054100-119 = "แงงง! ก้น... ก้นของฉัน!!!"
10054100-120 = "แต่ต้องกล้าบอกเพื่อนว่าไม่ควรทำแบบนั้น ถึงจะเรียกว่าเป็นเพื่อนแท้นะคะ"
10054100-121 = "ฮะ... เฮือก...! เฮือก...!!!"
10054100-122 = "ไม่ใช่ว่าพออยู่ด้วยกันแล้วจะข้ามถนนตอนสัญญาณไฟแดงได้ ต่อให้อยู่ด้วยกันก็ต้องรอให้ไฟเปลี่ยน#nนะคะ"
10054100-123 = "ฮือออออออออ...!!!"
10054100-124 = ""
10054100-125 = "เข้าใจกันแล้วใช่มั้ยคะ ทุกคน?"
10054100-126 = "อึก... ฮืออ..."
10054100-127 = "อึกกก..."
10054100-128 = "(สะอื้น) ฮือ..."
10054100-129 = "ไม่เป็นไรใช่มั้ยคะ ท่านประมุข?"
10054100-130 = "ผู้ฝึกสอนชุนหรือ...? เราติดหนี้บุญคุณเธอแล้วสินะ"
10054100-131 = "ไม่เป็นไรค่ะ จู่ๆ ท่านก็เซขึ้นมา ฉันตกใจหมดเลยค่ะ"
10054100-132 = "ไม่เป็นไร ฮุฮุ... ดูเหมือนว่าพอมาเที่ยวพักผ่อน เราจะคึกเกินไปในหลายๆ เรื่องน่ะ"
10054100-133 = ""
10054100-136 = ""
10054100-138 = "[ns] \"คิซากิ...\""
10054100-139 = "ครู..."
10054100-140 = "ฮุฮุ..."
10054100-141 = "ไว้ภายหลัง เราสองคนค่อยมาคุยกันอย่างจริงจังตามลำพังนะ"
10054100-142 = "พวกเธอ! บังอาจ... บังอาจตีก้นพวกเราเหรอ!"
10054100-143 = "ต่อจากนี้จะไม่ออมมือให้อีกเด็ดขาดเลย!!!"
10054100-144 = "ใครกันแน่ที่ควรไม่ออมมือให้... "
10054100-145 = "ทั้งที่พี่ชุนอุตส่าห์ช่วยพวกเธอถึงขนาดนั้นแท้ๆ พอปล่อยไว้หน่อยก็ได้ใจใหญ่เลยนะ เจ้าพวกเด็กแสบ!"
10054100-146 = "เอาเถอะ... เรื่องนี้มันก็ช่วยไม่ได้จริงๆ สินะ!"
