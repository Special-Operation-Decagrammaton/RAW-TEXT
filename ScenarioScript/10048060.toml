[translation]
10048060-1 = "제6화;플롯 수정"
10048060-3 = "좋아, '단단한 하늘이 풀어지니'라는 문구가 청금석으로 만든 울트라마린 물감을 가리킨다는 것은 이해했어."
10048060-4 = "그럼 '달팽이들의 울음'은?"
10048060-6 = "자주색이에요."
10048060-7 = "자주색?"
10048060-8 = "자주색 안료를 만드는 가장 고전적인 방식은, 대량의 바다 달팽이를 으깨서 그 즙에 여러 처리를 가하는 거예요."
10048060-9 = "달팽이들의 울음이라는 것은 이 제조 과정에 대한 은유겠죠."
10048060-10 = "그럼 '오직 왕만이 미소를 짓는다.', 이 문구는?"
10048060-11 = "푸른색과 자주색은 옛날부터 왕만이 소유할 수 있었던 색이었어요."
10048060-12 = "앞서 제가 말했듯이, 제조 과정이 지나치게 복잡한 데다 재료도 굉장히 비쌌기 때문이죠."
10048060-13 = "즉, '풀어진 단단한 하늘'과 '달팽이들의 울음'이 각각 푸른색과 자주색을 가리킨다는 것을 재확인시켜 주는 문구……."
10048060-14 = "그것이 '왕만이 미소를 짓는다.'의 의미일 거예요."
10048060-15 = "종합하자면, 자주색과 푸른색을 주된 색상으로 쓴 그림을 노리고 있다고 해석할 수 있겠네."
10048060-16 = "예, 바로 그거죠."
10048060-17 = "그러니까 이 단서를 기반으로 도록의 그림들을 다시 살펴보면, 자애의 괴도가 어떤 그림을 노리고 있는지도 알 수 있……."
10048060-19 = "저기 저기, 그거 후유 쨩 가방 안에 들어 있지 않아?"
10048060-20 = "응? 나 아직 아무것도 훔치지 않았는데?"
10048060-21 = "……아."
10048060-22 = "아……!"
10048060-23 = "<누가 자줏빛과 푸른빛을 귀여워하랴>!"
10048060-24 = "그거네요! 제목부터 대놓고 자주색과 푸른색을 썼다고 광고하고 있잖아요?!"
10048060-25 = "[s] \"심지어 진품은 우리가 가지고 있고……!\""
10048060-26 = "그러니까요."
10048060-27 = "맙소사, 괴도가 노리는 물건이 이미 우리 손에 들어와 있다니……."
10048060-31 = "……아니 잠깐만, 서, 선생님?!"
10048060-32 = "어, 언제부터 와 계셨어요……?!"
10048060-33 = "[s] \"후유가 도와달라고 해서 조금 전에 들어왔어.\""
10048060-34 = "샬레의 정식 명칭이 '연방수사동아리 샬레'잖아."
10048060-35 = "그리고 우리의 상대는 악명 높은 일곱 죄수 중 한 명인 자애의 괴도……."
10048060-36 = "그래서 샬레 소속인 선생님이라면 분명 뭔가 정보를 알고 계시지 않을까 해서 부탁드렸지!"
10048060-37 = "[s] \"……물론 나도 말해줄 수 있는 건 별로 없지만.\""
10048060-38 = "후후."
10048060-39 = "뭐야, 결국 변한 게 아무것도 없잖아요."
10048060-40 = "하지만 선생님께서 우리 먹으라고 조각 케이크를 사 오셨지."
10048060-41 = "변화는…… 이 정도면 충분한 게 아닐까."
10048060-43 = "맞아! 이 케이크 진짜 맛있어!"
10048060-44 = "[s] \"후후, 직접 카페에 가서 먹으면 더 맛있다고?\""
10048060-45 = "너도 먹어 봐, 미요. 디저트에 대한 선생님의 깊은 조예를 느낄 수 있을 테니까."
10048060-46 = "[s] \"정확히는 조예가 깊은 학생들이 주변에 있는 것이긴 한데…….\""
10048060-47 = "잠깐, 선생님은 외부 음식 반입이 가능하신 건가요?"
10048060-48 = "외부인은 사식 명목으로 반입이 가능하다더라고."
10048060-49 = "사식이라니……."
10048060-50 = "여기 학원이 아니라 교도소였나."
10048060-51 = "아주 틀린 말은 아니지……."
10048060-52 = "아무튼, 이런 이유로 선생님을 통해 외부 음식을 밀반입하는 새로운 비즈니스 모델을 구상해 봤는데, 들어 볼래, 미요?"
10048060-53 = "[s] \"기각입니다, 후유 양.\""
10048060-54 = "힝."
10048060-58 = "[ns] \"그보다, 이야기가 다른 곳으로 샌 것 같지 않아?\""
10048060-59 = "아 맞다, 자애의 괴도 이야기 중이었지."
10048060-60 = "그럼 다시 돌아와서……."
10048060-61 = "어쨌든 이것으로 저희와 괴도가 같은 전시회의 같은 그림을 노린다는 것이 확실해졌군요."
10048060-62 = "<누가 자줏빛과 푸른빛을 귀여워하랴.>……."
10048060-63 = "저희는 이 그림을 수장고에서 빼내고 진품으로 교체하는 것이 목적, 괴도는 이 그림을 훔치는 것 자체가 목적……."
10048060-64 = "상황이 꽤나 복잡해져 버렸네요."
10048060-66 = "응?"
10048060-67 = "아니, 오히려 굉장히 단순해졌는걸요."
10048060-68 = "단순해졌다니……?"
10048060-69 = "우리의 목표는 수장고에서 그림을 빼내는 것이 아니에요."
10048060-70 = "그 자리에 우리가 가진 진품을 가져다 놓는 것이지."
10048060-71 = "만약 자애의 괴도가 수장고에서 위작을 빼내어 도망친다면, 우리는 그 자리에 우리가 가진 진품을 가져다 놓으면 돼요."
10048060-72 = "그러면 우리는 의뢰의 모든 조건을 깔끔하게 달성하게 되죠."
10048060-73 = "……!"
10048060-74 = "……!"
10048060-75 = "이렇게 되면 우리가 수장고에서 애써 위작을 빼낼 필요도 없어져요."
10048060-76 = "그 일은 자애의 괴도가 대신해 줄 테니까."
10048060-77 = "그리고 자애의 괴도가 훔쳐 간 것 중 세상에 다시 나온 물건은 단 하나도 없다는 소문도 있어요."
10048060-78 = "……즉, 괴도가 도둑질에만 성공한다면, 그 위작은 세상에서 영영 사라지게 되고, 진품만 남게 되는 거죠."
10048060-79 = "뒤처리까지도 말끔하게 해결되는 셈이에요."
10048060-83 = "……."
10048060-84 = "늘 느끼는 건데, 미요 너는 역시 범죄에 재능이 있어."
10048060-85 = "욕설을 칭찬처럼 하지 말아줄래요?"
10048060-86 = "흐우우우…… 이런 이야기나 쓰려고 문학과에 온 게 아닌데……."
10048060-87 = "[s] \"그렇다면 미요가 쓰고 싶었던 이야기는 뭐야?\""
10048060-88 = "그…… 그게……."
10048060-89 = "지, 지금은 그게 중요한 게 아니에요. 그리고 아직……."
10048060-90 = "로맨스예요."
10048060-91 = "미요 쟤 로맨스 소설에 푹 빠져서 살다가 소설 창작 시작했거든요."
10048060-93 = "으아아아아! 조용히 해!"
10048060-94 = "마, 마, 맞긴 한데! 조용히 해!"
10048060-95 = "[s] \"읽어보고 싶다, 미요가 쓴 로맨스 소설.\""
10048060-96 = "아, 아, 안 보여드릴 거예요!"
10048060-97 = "그, 그리고 지금 아직 다 해결된 게 아니에요!"
10048060-98 = "아직 예고장의 절반밖에 해석하지 못했다고요……."
10048060-99 = "생각해 보니 그러네."
10048060-100 = "첫 문장을 해석한 것은 기쁘지만, 아직 두 번째 문장이 남아 있었어."
10048060-101 = "'문이 닫히고, 무지개가 뒤섞이는 마술적인 찰나에, 여러분을 찾아뵙겠습니다.'"
10048060-102 = "으음…… 이건 무슨 뜻이야?"
10048060-103 = "첫 문장이 목표물을 예고한 것을 보면, 두 번째 문장은 범행 시각을 예고한 것 아닐까?"
10048060-104 = "그럴싸한 추론이긴 한데……."
10048060-110 = "음……."
10048060-111 = "일단 오늘은 기숙사로 돌아가죠."
10048060-112 = "통금 시간 지나면 들어가기 상당히 귀찮아지니까."
10048060-113 = "그러게, 벌써 황혼이 지네."
10048060-114 = "미안해요, 선생님. 온 지 얼마 안 돼서 바로 가시게 됐네요……."
10048060-115 = "[s] \"뭘, 내가 일 때문에 늦게 와서 그런 것뿐인걸.\""
10048060-116 = "그럼 선생님, 같이 가시죠. 제가 직접 정문까지 바래다드릴……."
10048060-117 = "잠깐만 후유, 조금 전에 뭐라고 했죠?"
10048060-118 = "응? 어…… 통금?"
10048060-119 = "그거 말고."
10048060-120 = "어…… 황혼?"
10048060-122 = "그래, 그거예요! 황혼!"
10048060-123 = "그게 무슨 소리야……?"
10048060-124 = "하늘을 올려다봐요. 무슨 색이죠?"
10048060-125 = "주황색이지……?"
10048060-126 = "정말요? 아니잖아요. 다시 보세요."
10048060-128 = "주황색이 지배적이긴 하지만, 주황색만 있는 게 아니에요."
10048060-129 = "태양과 가까운 하늘은 주황색이지만, 먼 곳은 옅은 보랏빛……."
10048060-130 = "그리고 엷은 구름은 탁한 흰색, 두꺼운 구름은 군청색……."
10048060-131 = "황혼의 순간에는, 무지개와 같은 온갖 색들이 뒤섞이게 돼요."
10048060-133 = "'무지개가 뒤섞이는 그 마술적인 찰나' ……!"
10048060-134 = "예. 예고장의 두 번째 문장은, 황혼 녘을 가리키는 거였어요!"
10048060-135 = "황혼……!"
10048060-136 = "아, 그러고 보니 이제 생각났다!"
10048060-137 = "황혼 시간대를, 다른 말로 '매직 아워'라고도 해!"
10048060-138 = "매직 아워?"
10048060-139 = "응. 낮과 밤이 교차하는 마술적인 시간이라고."
10048060-140 = "거기다 그 시간대에는 사진이 굉장히 잘 나와. 광량도 적당하고, 그림자도 사라져서."
10048060-141 = "문제는 매직 아워는 꽤 짧다는 거지. 길어야 20분 정도?"
10048060-142 = "매직 아워……."
10048060-143 = "그래서 '마술적인 찰나'라는 표현을 쓴 거군요."
10048060-144 = "긴 하루에 비하면 매직 아워는 찰나에 불과한 순간이니까."
10048060-145 = "……그런데 후유는 그걸 어떻게 알고 있었던 거죠?"
10048060-146 = "나 미디어아트 전공이잖아. 사진 쪽 지식도 대충은 알고 있지."
10048060-147 = "아, 그랬죠."
10048060-148 = "어쨌든 그렇다면 황혼이 질 무렵에 그림을 훔치러 온다는 이야기인데……."
10048060-149 = "그런데 문제가 하나 있어."
10048060-150 = "?"
10048060-151 = "황혼은 엄밀히 말해서 하루에 두 번이야. 일출 직전에 한 번, 일몰 직전에 한 번."
10048060-152 = "이 두 시간대 중 어느 때에 온다는 얘기일까?"
10048060-153 = "으음……."
10048060-154 = "'문이 닫히고, 무지개가 뒤섞이는 그 마술적인 찰나…….'"
10048060-156 = "저기 저기, 그럼 밤에 온다는 이야기 아닐까?"
10048060-157 = "응?"
10048060-158 = "보통 일을 끝낼 때 '문 닫는다.'라는 표현을 쓰잖아?"
10048060-160 = "진짜로 작업 끝! 오늘 특수교역부의 활동은 여기서 문 닫겠습니다!"
10048060-162 = "……하루의 문을 닫는 시간, 저녁."
10048060-163 = "그리고 황혼, 매직 아워……."
10048060-164 = "[s] \"그럼 이것으로 해석 완료……?\""
10048060-165 = "예. 모든 수수께끼는 풀렸어요."
10048060-166 = "그럼 자애의 괴도의 예고장을 요약하자면……"
10048060-167 = "……<누가 자줏빛과 푸른빛을 귀여워하랴>를 저녁 황혼 녘에 훔쳐 가겠다, 라는 거죠?"
10048060-173 = "……좋아, 이것으로 소재는 전부 갖춰졌어요."
10048060-174 = "지금 바로 플롯을 수정할게요."
10048060-175 = "……!"
10048060-176 = "자애의 괴도가 출현하는 날, 우리는……."
10048060-177 = "……전력을 다해, 괴도의 도둑질을 서포트할 겁니다."
