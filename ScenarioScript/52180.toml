[translation]
52180-1 = "제18화;동상이몽"
52180-3 = "이익, 이이익……"
52180-4 = "조금만 더…… 조금만 더 당기면……"
52180-8 = "키쿄, 거기서 그렇게 쳐다보기만 할 거면 같이 와서 철창 당기는 것 좀 도와줘!"
52180-9 = "조금만, 조금만 더 당기면…… 한 사람 정도 나갈 수 있는 틈이 생길 것 같은데……!"
52180-10 = "지금은 그런 쓸데없는 시도에 힘을 낭비하는 것보다, 이후의 상황을 대비해 체력을 아껴두는 편이 낫지 않을까?"
52180-11 = "어차피 감시도 세워두지 않고 자리를 비웠을 정도니, 그 철창이 힘으로 뜯어낼 수 있을 만큼 허술하지는 않을 거라 생각해."
52180-12 = "그렇다고 이대로 가만히 갇혀 있기만 할 거야? 할 수 있는 건 뭐든 해 봐야지!"
52180-13 = "그래서 이곳을 빠져나갈 수 있는 방법을 궁리하고 있잖아. 모두가 너처럼 기합과 의욕만으로 문제를 해결하려 들진 않거든?"
52180-14 = "애초에 내가 처음에 말했던 것처럼 아야메 부장을 의심했더라면, 이렇게까지 문제가 커지진 않았을 텐데."
52180-15 = "그, 그건 그렇지만……"
52180-16 = "그럼 이곳을 빠져나갈 다른 대책이 있다면, 빨리 말해 보라고. 시간이 없으니까."
52180-17 = "그러니까—, 생각 좀 하게 그 시끄러운 입을 다물고 있어 주지 않을래?"
52180-18 = "너, 말 다했어?!"
52180-19 = "키, 키쿄 선배. 렌게 선배. 우선은 진정하셔요!"
52180-20 = "지금은 저희끼리 싸울 때가 아니—"
52180-26 = "[ns1] \"뭔가 소란스럽네……\"\n[ns2] \"……내가 얼마나 잠들어 있었던 거지?\""
52180-29 = "[USERNAME] 선생님!"
52180-30 = "……스승님!"
52180-31 = "선생님, 몸은 괜찮아? 다친 곳은 없고?"
52180-32 = "[s3] \"응. 머리가 조금 아프지만, 다친 곳은 없는 것 같아.\"\n[s4] \"너희들도 다친 곳은 없니?\""
52180-37 = "응, 조금 긁히긴 했지만 부상 자체는 대단치 않아."
52180-38 = "튼튼한 신체 역시 백화요란 부원이 갖추어야 할 소양이니까요!"
52180-40 = "[ns] \"그보다 이곳은……?\""
52180-41 = "여기는 <피안의 저택>에 있는 지하 감옥이야."
52180-42 = "화조풍월부 녀석들과의 전투에서 패배한 뒤, 곧장 이곳으로 끌려 왔어."
52180-43 = "카데노코지 가문의 지하에도 이와 비슷한 창고가 있었는데…… 설마 이런 식으로 사용될 거라곤 상상도 하지 못했사와요."
52180-44 = "젠장, 녀석들에게 총알만 먹혔더라도 이렇게 허무하게 잡히진 않았을 텐데……"
52180-45 = "[s5] \"화조풍월부라고……?\"\n[s6] \"그 사이에 무슨 일들이 벌어졌었던 거야?\""
52180-48 = "결론부터 간단하게 정리하자면."
52180-49 = "우리가 북방 자치구에서 마주친 거의 모든 것들이 가짜였다는 거야."
52180-51 = "(키쿄로부터 기절한 사이 있었던 일들에 대해 설명을 들었다.)"
52180-59 = "[ns] \"……설마 아자미 양이 화조풍월부의 부원이었을 줄이야.\""
52180-60 = "그러니까요. 그렇게나 친절해 보였던 부장님이 실은 저희를 적대하는 화조풍월부의 부원이었다니, 정말 쇼-쿠였사와요……"
52180-61 = "분명 처음부터 우릴 속일 생각으로 접근했었겠지. 그 웃는 낯으로 무슨 생각을 하고 있었을지, 떠올리는 것만으로도 구역질이 나."
52180-62 = "그럼 이 에비스 분교 주변의 자치구도, 이곳에서 만난 주민들도 모두 가짜였던 거야? 그렇게 생각하니 조금 소름 끼치는데……"
52180-63 = "아니, 에비스 분교의 주민들은 백물어와 상관없는 진짜였을 거야."
52180-64 = "아무리 백물어가 강력한 힘을 지니고 있다고 해도 축제에 쓰이는 에비스산 식재료까지 가짜로 만들어 낼 수는 없으니까."
52180-65 = "애초에 일부 주민들은 처음부터 아자미를 낯설어하는 눈치이기도 했었고."
52180-66 = "[s] \"그럼…… 아야메도 가짜였던 건가?\""
52180-67 = "그게, 사실은 말이야……"
52180-68 = "우리도 그게 신경 쓰여서 아야메 부장과 마지막까지 있었던 나구사 선배에게 무슨 일이 있었는지 물었거든."
52180-69 = "하지만 무슨 일이 있으셨는지 선배는 줄곧 저 상태셔요……"
52180-74 = "[ns7] \"……괜찮아, 나구사?\"\n[ns8] \"어디 다친 곳이라도 있는 거야?\""
52180-77 = "……나는 괜찮아."
52180-78 = "그저…… 내 미숙함으로 모두를 위험에 빠트린 걸 용납할 수 없을 뿐이야."
52180-79 = "선배가 뭘 잘못했다는 거야? 상황이 이렇게 된 건 모두 화조풍월부 녀석들 때문이지!"
52180-80 = "그렇사와요. 나구사 선배는 다른 부원들을 지키기 위해 최선을 다하셨을 뿐인걸요."
52180-81 = "나구사 선배, 지금은 혼란스럽겠지만 책망해야 할 상대를 착각하진 말아줘."
52180-82 = "작금의 사태를 정리하고 수습해야 할 책임은, 부장 대리인 당신이 아니라…… 부장인 아야메 선배에게 있으니까."
52180-83 = "……아니, 아야메의 책임이 아니야. 아야메는 잘못하지 않았어."
52180-84 = "……선배!"
52180-85 = "결국 이 모든 사건의 원인은 아야메를 이해하지 못한—"
52180-86 = "……능력도 없으면서, 믿고 싶은 대로 상대를 믿어버린 당신의 탓이죠.#n그렇지 않나요, 나구사 쨩~?"
52180-92 = "야부키 슈로……!"
52180-93 = "아하하, 아하하하!"
52180-94 = "뭔가요, 그 한심한 꼴은?"
52180-95 = "그때의 그 기세는, 그때의 그 결심은 어디에 두고서. 이제 와서 꼴사납게 흐느끼고 있는 건가요, 나구사 쨩."
52180-96 = "갑자기 자신 앞에 모습을 드러낸 아야메가 가짜인 줄 몰랐다고요? 꿈에서도 잊지 못했던 친구의 모습을 착각했었다고요?"
52180-100 = "……거짓말."
52180-101 = "단순히 믿고 싶지 않았던 것뿐이면서."
52180-102 = "그 말은, 우리가 만났던 아야메 부장이 진짜가 아니었다는 뜻이야?"
52180-103 = "물론이고 말고요."
52180-104 = "위기에 처하자마자 기다리고 있었던 것처럼 등장해 목숨을 구해주고, 듣기 좋은 소리로 죄책감을 덜어주는 친구라니. 편의주의적인 망상도 정도가 있지."
52180-105 = "그 아야메는…… 아니. 아야메의 모습을 한 '그것'은 사실, 괴서 <토테이붓카이로쿠>의 신비에서 태어난 나구사 쨩의 두려움이었답니다!"
52180-106 = "두려움이요? 하지만 그 아야메 선배의 모습은 조금도 무서워 보이지 않았는데……"
52180-107 = "역시 세상 물정 모르시는 말씀이시네요, 카데노코지의 무녀님."
52180-108 = "두려움이란 알기 쉬운 소름 끼치거나 두려운 형태를 하고 있기도 하지만, 가끔은 도리어 행복을 의태 하기도 하지요."
52180-109 = "마음속으로 줄곧 부정해 오던, 절대로 현실이 될 수 없는 허황된 행복. 그 행복이 눈앞에 나타나는 것만큼이나 두려운 일도 없잖아요?"
52180-113 = "왜냐하면…… 그 가상의 행복을 바라볼수록 현실의 잔인함이 더욱 사무쳐 스며드니까."
52180-114 = "윽………"
52180-115 = "당신은 그러니까 아야메의 대체품이 될 수 없는 거예요, 나구사 쨩."
52180-116 = "네가 나구사 선배에 대해 뭘 안다고 멋대로 떠드는 거야?!"
52180-117 = "아하하하! 그렇게라도 악을 써서 부정하고 싶은 거죠?"
52180-118 = "하지만 이를 어쩌죠? 울부짖고 소리쳐 부정해도 현실은 조금도 바뀌지 않는데."
52180-119 = "네 녀석들이 아무리 노력한다 해도 아야메의 발끝도 따라가지 못하는 실패작이라는 사실은 바뀌지가 않는데."
52180-120 = "결국 언젠가 쓸모를 다하면 버려질 폐품일 뿐인데—"
52180-121 = "[s] \"슈로, 한 가지 궁금한 게 있는데.\""
52180-122 = "뭔가요, 샬레의 선생님."
52180-123 = "또 궤변으로 저를 흔들어 볼 계획이시라면 그만두시는 게 좋을걸요."
52180-124 = "이미 붙잡힌 패배자에게 무슨 도발을 듣더라도 저는 동요하지 않을 테니까."
52180-125 = "[s9] \"슈로가 처음부터 모든 걸 알고 있었더라면……\"\n[s10] \"그때 가짜 아야메에게 당했던 것도 연기였던 거야?\""
52180-131 = "…………하아?"
52180-132 = "그걸 질문이라고 하는 건가요?"
52180-133 = "당연한 소릴…… 모든 게 당신과 백화요란을 사로잡기 위해 처음부터 계획된 것이었다고요."
52180-134 = "가짜 아야메에게 붙잡힌 것도, 당신을 피안의 저택으로 이끈 것도—"
52180-138 = "………어?"
52180-139 = "……샬레의 선생님?"
52180-142 = "마지막에 당신을 방패막이로 쓴 것까지 모두……"
52180-143 = "……모두 코쿠리코 님을 위한 연기였으니까!"
52180-146 = "[ns11] \"붙잡힌 처지에서 할 소리는 아니지만……\"\n[ns12] \"전에도 한 번 이야기했었지만……\""
52180-149 = "[ns13] \"자신에게 없는 걸 연기하는 일은 이상한 게 아니야.\"\n[ns14] \"누구에게나 있는 아주 평범한 일이지.\""
52180-152 = "[ns] \"그렇기에, 자신이 저지른 일에서 절대로 눈을 돌리지 마.\""
52180-154 = "[ns] \"슈로는 슈로의 일을 한 거야.\""
52180-155 = "하, 하하…… 무슨 소릴 하는가 했더니."
52180-156 = "그런 알량한 궤변으로 제 마음을 돌릴 수 있을 거라 생각하신 건가요?"
52180-157 = "그때 저를 구했다고 착각하고서…… 고작 그런 일 때문에, 제가 코쿠리코 님을 배신하고 당신을 도울 거라고 생각한 건가요?"
52180-158 = "정말이지…… 질 나쁜 망상이네요."
52180-159 = "어린아이나 할 법한 유치한 망상—"
52180-160 = "그래. 당신들이 믿고 있는 그 전설 속의 쿠즈노하 마냥, 어처구니없는 망상의 산물이라고!"
52180-164 = "……쿠즈노하."
52180-165 = "맞아, 그때 쿠즈노하가 나를 대설원에서 죽게 내버려 두었으면 좋았을 텐데."
52180-166 = "아야메를 구하지 않았으면서, 어째서 나는 구했던 걸까. 나도 그 자리에서 죽도록 내버려두었으면 좋았을 것을."
52180-167 = "그게 무슨 소리인가요, 나구사 쨩."
52180-168 = "그렇게 말하면 마치 당신이 실제로 쿠즈노하를 만났던 것처럼 들리잖아요."
52180-169 = "[s15] \"쿠즈노하는 전설 속에서만 존재하는 가상의 인물이 아니야.\"\n[s16] \"나도 전에 나구사를 통해 쿠즈노하의 편지를 전달받았거든.\""
52180-172 = "쿠즈노하가…… 정말로 현실에 존재한다고?"
52180-173 = "모든 괴서의 원주인이자, 백화요란의 초대 부장이었다는 대 예언자 쿠즈노하가……?"
52180-174 = "지금 저를 놀리려는 속셈이라면—"
52180-181 = "그러고 보면 이상한 점이 한둘이 아니야."
52180-182 = "코쿠리코 님의 말씀에 의하면 그때 나구사는 마을에서 한참 떨어져 있는 대설원 한 가운데 버려졌을 텐데, 멀쩡히 살아 돌아오다니."
52180-183 = "사람은커녕 들짐승도 거의 지나지 않는 설원 한가운데에서, 누군가가 우연히 나구사를 발견했을 가능성은 희박해."
52180-184 = "게다가 샬레의 선생은 사실을 교묘하게 포장해 궤변은 늘어놓아도, 거짓은 말하지 않는 사람이었을 텐데……"
52180-185 = "정말로 대 예언자 쿠즈노하가 실존한다면, 대설원 어딘가에 황혼의 사원에 존재한다면—"
52180-186 = "전에 잃어버린 <이노모노노케로쿠>를 대체할 수 있는 새로운 괴서를 만드는 것도 가능할지도 몰라."
52180-192 = "유감이네요, 나구사 쨩. 의지했던 친구로부터 버림받고, 아무것도 하지 못한 채 이렇게 자책만 하고 있는 처지라니."
52180-193 = "가엾고 안쓰러워서 지켜보고 있기가 딱할 정도네요."
52180-194 = "그런 나구사 쨩을 위해 제가 한 번의 기회를 더 드릴까요?"
52180-195 = "……기회?"
52180-196 = "네. 당신이 모든 것을 망쳐버렸다 하더라도, 황혼에 떨어진 사람을 건져내고 끊어진 관계를 이을 수 있는 존재가 남아 있잖아요?"
52180-201 = "……바로 쿠즈노하 님을 찾아가는 거예요."
52180-203 = "다음화;피안의 기억"
