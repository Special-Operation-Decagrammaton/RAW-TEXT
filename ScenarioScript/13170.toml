13170-310 = "말조심하십시오. 배신이라니요. 열차포는 처음부터 저희의 것이었습니다."
13170-311 = "애초에 당신들 같은 삼류 폭력단이 탐낼 물건이 아닙니다만."
13170-317 = "고, 공격해!!"
13170-331 = "이, 이 소리는……?"
13170-333 = "……."
