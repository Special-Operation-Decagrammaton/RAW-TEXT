[translation]
13170-1 = "제17화;추격"
13170-5 = "……좋습니다. 공방이 교체되었다는 걸 인정하겠습니다."
13170-6 = "이제 [USERNAME] 선생의 턴이군요."
13170-7 = "공격과 방어는 본래 뒤바뀌는 것. 그것이 공평한 게임의 룰이겠죠."
13170-8 = "물론 저는 공평할 생각은 없지만요. 히히히……."
13170-9 = "이 캠페인은 어디까지나 저의 구도를 위한 과정일 뿐. 실험도, 의식도, 연구도 아닙니다. 공평할 필요도 없고 규칙에 얽매일 필요도 없죠."
13170-10 = "자아, 공략법 세 번째. <마음은 예측도, 통제도 불가능하다.>"
13170-11 = "인간의 마음…… 그 욕망과 죄악과 공포와 집착이 비탄이, 이리저리 충돌하고 상쇄하고 발산하고 소멸해 내며 그려내는 해석 불가능한 원초의 혼돈……"
13170-12 = "그것이…… 당신 앞에 나타나겠죠."
13170-16 = "그것을…… 어떻게 공격해 나갈지 궁금하군요……."
13170-19 = "[log]이 작품에서 등장하는 모든 법적 해석은#n실제와는 일절 관련이 없는 픽션입니다.[/log]"
13170-24 = "[ns] \"노노미의 위치를 확인했어.\""
13170-25 = "어디인가요!"
13170-26 = "[ns] \"아비도스 중앙역 구청사 건물 안에 있어.\""
13170-27 = "거긴……."
13170-28 = "응. 채권단 총회가 열리는 건물이야."
13170-29 = "다행히 떨어트려 놓지 않았네요. 어쩌면 팀을 2개로 나눠야 하나 싶었는데……."
13170-30 = "고마워, 선생님. 덕분에 계획이 좀 더 심플해졌어."
13170-31 = "호시노 선배의 저지, 계약 유지, 노노미의 구출 모두 한 번에 할 수 있을 거야."
13170-33 = "정말이지 볼 때마다 대단한 어른의 힘이라니까."
13170-34 = "응. 예전에 세리카가 헬멧단에 납치됐을 때도 선생님이 이렇게 도와줬었지."
13170-35 = "어, 언제 적 얘기를 하는 거야!! 그런 건 굳이 언급 안 해도 되거든?"
13170-36 = "……그때는 진짜 걱정했었으니까."
13170-37 = "그, 그래……? 갑자기 그렇게 반응하면 나도 좀 부끄러운데……."
13170-39 = "아하하…… 그때 세리카 쨩이 행방불명되어서 다들 너무 놀랐었는데……."
13170-40 = "응, 특히 호시노 선배가 엄청 당황해했었어."
13170-41 = "혼자서 안절부절못하다가 선생님에게 부탁해 본다고 하곤 혼자 나가버렸어."
13170-42 = "호시노 선배가? 진짜?"
13170-43 = "[ns1] \"그때 호시노가 나에게 세리카를 찾아달라고 고개 숙였었어.\"\n[ns2] \"굳이 모두에게 말하진 않았지만.\""
13170-48 = "세리카 쨩 전화는요?"
13170-49 = "……안 돼요. 몇 시간 전부터 계속 끊겨 있어요."
13170-50 = "라멘집에서는 정시에 퇴근했다고 했고 그 이후에 집에 돌아오지 않았다는 건가."
13170-51 = "이렇게 늦게까지 집에 돌아오지 않은 적은 없었는데……."
13170-52 = "설마…… 헬멧단 놈들인가."
13170-53 = "네?! 헬멧단이 세리카 쨩을……?!"
13170-54 = "일단은 기다려보자. 호시노 선배와 선생님이 알아보러 갔으니까."
13170-55 = "……."
13170-57 = "(덜컥)"
13170-58 = "자아, 기다렸지?"
13170-59 = "호시노 선배! 선생님!"
13170-60 = "[s] \"다녀왔어.\""
13170-61 = "어떻게 된 거야, 선배?"
13170-62 = "선생의 권한으로 총학생회가 관리하는 중앙 통신망에 접속할 수 있었어."
13170-63 = "중앙 통신망에……. #n선생님의 권한은 그런 것까지 가능하구나……."
13170-64 = "으헤~ 물론 몰래 접근한 거야. 들키면 시말서 써야 할걸?"
13170-67 = "헤에…… 그런 일이 있었구나……."
13170-68 = "응. 그래 놓고 아무렇지도 않은 척 으헤~ 한 거야."
13170-69 = "아하하…… 그런 일도 있었죠. 벌써 엄청 옛날 전 같아요."
13170-70 = "응. 그치만 얼마 되진 않았지만."
13170-71 = "뭐, 그때 구해줘서 고마워. 선생님."
13170-73 = "[ns] \"내가 해야 하는 일이니까.\""
13170-78 = "현재 시각 AM. 08 : 5X"
13170-80 = "그럼 상황을 브리핑하겠습니다!"
13170-84 = "저희는 지금부터 아비도스 중앙역 구청사 최상층에서 열리는 채권단 총회에 출석해야 합니다! 제한 시간은 12시까지!"
13170-85 = "그 건물에 갇혀 있는 노노미 선배를 구해내야 합니다."
13170-86 = "그리고 호시노 선배가 <아비도스 학생회>를 부정하려는 것을 막고, <대책위원회>의 정통성을 선언해야 합니다!"
13170-87 = "응. 알겠어. 아야네 학생회장님."
13170-88 = "……."
13170-89 = "뭐야, 왜 그래, 아야네 쨩? 적응해야 하잖아?"
13170-90 = "이건…… 어디까지나…… 저희의 권한과 자격을 위한 방법의 일종으로……."
13170-91 = "[s3] \"전부 아야네 학생회장님의 명령에 무릎 꿇으라고 해.\"\n[s4] \"당당하게 선언하는 거야. 아야네 학생회장님.\""
13170-94 = "……이번 작전은 공증이 필요하니, 저도 모두와 함께 출동할 예정입니다."
13170-96 = "얼버무렸네."
13170-97 = "회피했어."
13170-99 = "다음은 작전 브리핑입니다!"
13170-100 = "현재, 아비도스 중앙역으로 이어지는 각 동서남북 4개의 모든 루트에 <사모펀드>의 병력이 봉쇄하고 있는 상황입니다."
13170-102 = "중앙역 구청사 동쪽 지역"
13170-103 = "동쪽은 사채노동조합장이 고용한 둥실둥실 헬멧단입니다."
13170-104 = "전력은 가장 약해 보이지만, 숫자가 가장 많습니다! 이 전투는 기본적으로 12시 전까지 목표점에 도달해야 하는 타임어택!"
13170-105 = "따라서 이 루트는 가장 돌파 시간이 길어질 것으로 보입니다!"
13170-107 = "중앙역 구청사 서쪽 접근로"
13170-111 = "서쪽은 압류품경매길드장이 데려온 마켓가드들이 지키고 있습니다!"
13170-112 = "숫자는 적지만 마켓가드답게 전투 헬기, 탱크 등 강력한 중화기가 포진되어 있습니다! 훈련 레벨도 높고 비교적 지휘체계도 잡혀 있는 편입니다."
13170-113 = "이곳은 지형적으로 유불리가 없으나 상대가 가장 강력한 화력을 소유하고 있기 때문에, 특별한 전략적 우위를 점하지 않았다면 피해야 할 루트입니다!"
13170-115 = "중앙역 구청사 남쪽 개활지"
13170-117 = "남쪽 루트는 전당포연합장이 고용한 폭력단 검은거북파가 지키고 있습니다!"
13170-118 = "숫자도 적고 지휘체계도 난잡하지만 무인 포탑을 잔뜩 보유하고 있고 무엇보다 지형이 개활지라서 특별한 대비 없이 접근하면 안 됩니다!"
13170-120 = "중앙역 구청사 북쪽 접근로"
13170-123 = "마지막으로 북쪽 루트는 ZYAKO흥업이 고용한 용역들이 특이하게 바리케이드를 구축해 두었습니다."
13170-124 = "즉, 전투보단 수성을 목표로 하고 있는 루트입니다. 화력이나 전투력엔 특별할 게 없지만 중장비 없이는 이곳을 돌파하는 건 불가능해 보입니다!"
13170-127 = "음…… 우린 어느 루트를 택해야 할까?"
13170-128 = "호시노 선배가 고른 곳을 따라가면 되는 거 아냐?"
13170-129 = "그렇다면 호시노 선배의 입장이 되어서 생각해 봐……."
13170-130 = "복잡하게 생각할 필요가 있어? 우리에겐 호시노 전문가가 있잖아!"
13170-132 = "으음……."
13170-133 = "네, 호시노 전문가인…… 시로코 선배가 볼 때 어느 쪽일 거 같아요?"
13170-134 = "음……. 호시노 선배의 강함은 순수한 전투 능력, 그러니까 백병전에 있어."
13170-135 = "지금은 그런 느낌은 많이 사라졌지만, 선배는 예전엔 자신의 몸을 돌보지 않는 공격적인 전술을 주로 펼쳤다고 해."
13170-136 = "호시노 선배는 아주 오래전부터 혼자서 싸우는 것에 익숙했을 거야."
13170-137 = "그러니까……."
13170-142 = "중앙역 구청사 서쪽 접근로"
13170-146 = "웬 놈이냐!!"
13170-154 = "저, 저건……!!"
13170-155 = "쏴, 쏴라!! 타카나시 호시노다!"
13170-164 = "어, 어디 갔지?!"
13170-188 = "……서쪽이라고 생각해."
13170-189 = "좋아, 그럼 호시노 전문가의 말을 믿고 출발이야!"
13170-196 = "모든 병력을 호시노에게 집중시켜라! 전투헬기와 탱크 전부를 그쪽으로 집결시켜!"
13170-197 = "지금 곧 여기서 채권단 총회가 시작될 거다! 침입자를 절대 이 안으로 들여보내지 마라!"
13170-199 = "넵, 넵!"
13170-204 = "헤에~ 또 헬기야?"
13170-207 = "타겟 위치 확인 중!"
13170-208 = "6시 방향입니다!!"
13170-213 = "색적 완료. 타겟 확인. 락온-"
13170-219 = "잡았다! AGM-114 공대지 미사일 전 탄 발사-!"
13170-226 = "전 탄 타겟 명중!"
13170-231 = "무, 무슨-?!"
13170-239 = "이쪽으로 달려옵니다……!?"
13170-240 = "무슨 바보 같은 소리야! 공중에 떠 있는 헬기로 다가와서 어쩌겠다고……?"
13170-248 = "어, 어디야?!"
13170-249 = "아, 아래에요! 밑에 있습니다! 헬기 밑에 매달렸……?!"
13170-255 = "으, 으아아-!?"
13170-264 = "무, 무슨 일이 벌어지고 있는 거야!"
13170-269 = "끄, 끄응……."
13170-274 = "잘 풀리지 않나 보네요."
13170-276 = "닥쳐라, 네프티스!!"
13170-288 = "무슨 짓입니까, 어째서 저에게 총을 겨누는 거죠?"
13170-289 = "흥, 이미 네놈이 뭘 꾸미고 있는지는 다 알고 있어."
13170-290 = "제가요? 뭘 알고 있다는 거죠?"
