[translation]
11170-2 = "제17화;드리우는 먹구름"
11170-3 = "흥신소 사무실"
11170-5 = "좋은 아침~"
11170-6 = "(퀭-) 좋은 아침……."
11170-7 = "우와, 깜짝이야! 아루 쨩, 밤샜어?"
11170-8 = "아니 잤는데……."
11170-9 = "또 무슨 고민이 있는 거야, 사장?"
11170-10 = "계획은 다 세웠잖아? 용역을 2배로 고용하고, 우리가 원하는 전장으로 #n아비도스를 유인한다."
11170-11 = "하루카가 폭탄 설치를 하러 아침 일찍 나갔어. #n폭탄이 수십 개 매설된 데드존에서 아비도스 녀석들을 차근차근 쓰러트린다는 계획이었잖아."
11170-13 = "(덜컥)"
11170-14 = "다녀왔습니다."
11170-15 = "왔네, 하루카 쨩. 고생했어."
11170-16 = "주요 포인트에 폭탄 매설을 끝냈어요. 이제 이 버튼을 누르기만 하면……."
11170-17 = "잘했어, 잘했어. 위치만 까먹지 말고 기억하고 있으라고."
11170-18 = "말씀만 하세요. 제가 뭐든지 터트려버릴 테니까요……. 뭐든지……."
11170-19 = "하아……."
11170-20 = "무슨 또 죽을 상이야. #n그러면 애초에 그 클라이언트한테 선금을 받고 그걸로 진행하면 됐잖아."
11170-21 = "……아냐. 선금은 받지 않는다. 그게 우리의 철칙이야."
11170-22 = "선금을 받으면 클라이언트의 명령에 얽매이게 되니까…… 라는 이유였던가."
11170-23 = "그래. 멋지게 일을 해결하고 의뢰비를 받는다. #n이 순서가 아니면 내가 추구하는 비전을 이룰 수 없어."
11170-24 = "비전? 그런게 있었나?"
11170-25 = "있다고!! 법칙과 규율에 얽매이지 않는 하드보일드 무법자!! #n그게 우리 흥신소 68의 비전이잖아!"
11170-26 = "아아, 그랬나? 기억났어, 기억났어."
11170-27 = "클라이언트의 의뢰도 마찬가지야. 그게 우리를 얽매는 족쇄가 될 수도 있어. #n우리가 원하지 않는 형태의 행동을 강요할 수 있다고."
11170-28 = "그래서 의뢰비는 무조건 성공 보수로 받는 거란 말야."
11170-29 = "……."
11170-30 = "정 부담스러우면 다 내팽겨치고 게헨나로 돌아가는 것도 방법이야. 사장."
11170-31 = "뭐?!"
11170-32 = "부, 부담스럽다고 한 적 없어! 그냥…… 조금……."
11170-33 = "헤- 그건 무리 아닐까? 선도부 녀석들이 가만있지 않을 텐데?"
11170-34 = "게헨나 선도부…… 말이지."
11170-36 = "확실히 선도부는 우리를 눈엣가시로 여기고 있긴 하지만……. #n딱히 우리가 그 녀석들을 피해 여기 도망쳐 온 건 아니잖아."
11170-37 = "그리고 선도부가 키보토스 최강이라는 평가를 받는 건 사실……."
11170-40 = "선도부장 히나 때문이야."
11170-41 = "선도부의 전력은 대부분 선도부장에게서 나오는 거니까. #n일당백. 그 표현을 그대로 체현한 존재지."
11170-42 = "바꿔 말하면,"
11170-46 = "히나만 제외하면 선도부 녀석들도 무적은 아니라는 소리야."
11170-47 = "계획만 잘 짜면 충분히 승산이 있지."
11170-49 = "그런가? 카요코 쨩은 거기까지 생각해 둔 거야?"
11170-50 = "언젠간 상대해야 하는 적이니까. 우리가 아비도스에게 쓰는 노력 정도면#n히나가 없는 선도부도 충분히 상대해볼만 해."
11170-51 = "그만큼 아비도스는 강력한 학교라는 거지. #n학생 숫자가 적다는게 최대의 약점이지만."
11170-52 = "응? 그 정도려나……."
11170-55 = "……"
11170-56 = "……아냐. 돌아간다는 선택지는 없어."
11170-57 = "그렇다고……. 하아."
11170-58 = "……. 뭐가 문제인 거야, 대체."
11170-59 = "알았어, 알았어. 아루쨩, 재미없는 이야기는 그만하고 밥이나 먹으러 가자. 배고파."
11170-60 = "라멘집 갈까? 시바세키?"
11170-61 = "거기를?"
11170-62 = "뭐 어때~ 알바 쨩은 오후에 출근한다고. #n마주치지만 않으면 되는 거 아냐?"
11170-63 = "흠…… 맛있긴 했지. 하긴, 사장도 기운을 내야 하니까……."
11170-64 = "그래, 그래. 가자~♪"
11170-66 = "아비도스 대책위원회 동아리실"
11170-68 = "(동아리실에 들어가니, 호시노가 노노미의 무릎을 베고 누워 있는 게 보인다.)"
11170-69 = "여어, 좋은 아침. 선생."
11170-70 = "선생님, 수고하셨습니다~ 일찍 오셨네요?"
11170-71 = "응? 편해보인다고? 으헤~ 노노미 쨩의 무릎은 푹신푹신해서 잠들기 좋거든. 나만의 특등석이라고."
11170-72 = "선생님도 이리 오실래요? 자, 여기요~☆"
11170-73 = "안돼. 이 무릎은 내 차지니까 선생은 저리 가서 불편해보이는 의자에나 앉으라고."
11170-74 = "딱히 선배의 전용은 아니지만……"
11170-77 = "(소근소근) 다음에 아무도 없을 때 오세요, 선생님."
11170-79 = "읏-챠."
11170-80 = "하-아암. 아침 일찍부터 다들 부지런도 하지."
11170-81 = "모처럼 있는 여유라서…… 지금은 다들 하고 싶은 걸 하고 있겠죠."
11170-82 = "음~ 시로코 쨩은 아마 체력단련 중일 거고, 아야네 쨩은 공부하러 도서관에 갔을 거고……."
11170-83 = "노노미 쨩은 일찍 나와서 학교를 청소하고 부실도 정리하고 있었고. #n이야, 다들 성실하단 말야."
11170-84 = "응? 나? 으헤~ 나야 당연히 여기서 빈둥거리고 있었지!"
11170-85 = "선배도 뭔가 생산적인 걸 해보는 게 어때요? 알바나 체력단련 같은 거……?"
11170-86 = "무리무리. 이 아저씨는 이제 야외활동은 할 수 없는 나이가 되어버렸다고. 노노미 쨩."
11170-87 = "저랑 얼마 차이 안나잖아요."
11170-88 = "으헤~ 여튼 선생이 왔으니 다른 아이들도 슬슬 도착하겠네. #n그럼 적당히 농땡이치러 가볼까?"
11170-89 = "어라, 어디 가시게요, 선배?"
11170-90 = "으헤~ 오늘 이 아저씨는 오프라구. #n적당히 사라져 있을 테니 무슨 일 있으면 연락 달라고, 노노미 쨩."
11170-92 = "호시노 선배…… 또 낮잠 자러 가나 봐요."
11170-93 = "응. 뭐, 괜찮지 않을까요? 어차피 회의는 아야네 쨩이 알아서 다 진행해 줄 거고."
11170-94 = "하하…… 그래도 예전과는 많이 달라졌어요, 호시노 선배도."
11170-95 = "응? 예전엔 어땠냐고요?"
11170-96 = "지금은 느긋한 잠꾸러기 같은 느낌이지만…… #n처음에 봤을 때 호시노 선배는 엄청 쫓기고 있는 사람 같았어요."
11170-97 = "뭐에 쫓기고 있었냐면…… 음…… 모든 상황에?"
11170-98 = "저는 모르는 이야기지만 예전에 있던 선배가 있었는데……."
11170-99 = "아비도스의 마지막 학생 회장이었다고 들었어요. #n되게 못미더운 사람이었다는데 그 사람이 사라지면서 모든 걸 호시노 선배가 떠안게 되었다고……."
11170-100 = "그때가 호시노 선배가 1학년이었나……. #n저도 자세한 이야기는 듣질 못해서 잘 모르지만요."
11170-101 = "하지만 지금은 선생님이 오시고 선배도 다른 학원의 학생들과도 잘 지내고……."
11170-102 = "예전이라면 다른 학원과 엮이는 거 자체를 싫어했을 텐데……. #n많이 부드러워진 거죠."
11170-103 = "응, 선생님 덕분이에요☆"
11170-105 = "……."
11170-108 = "……."
11170-109 = "아, 오셨군요."
11170-111 = "기다리고 있었습니다. 새벽의 호루……, 아니, 호시노라는 이름이었죠. #n실례했습니다."
11170-112 = "이거이거, 키보토스는 아직 익숙하지가 않아서. #n이쪽으로 오시죠. 호시노 씨."
11170-113 = "……. 이번엔 무슨 일이야, 검은 양복?"
11170-114 = "……후후. 상황이 변했으니까요. #n다시 한 번 아비도스의 최고 신비를 지닌 호시노 씨에게 제안을 드리려는 겁니다."
11170-115 = "제안? 웃기지 마!! 그건 이미……!!"
11170-116 = "아아. 조용. 조용히."
11170-117 = "……?!"
11170-118 = "……제가 좋아하는 영화에 그런 대사가 있습니다. 이번엔 그걸 활용해보도록 하죠."
11170-120 = "(털썩-)"
11170-123 = "당신에게 거절하지 못할 제안을 하나 하겠습니다."
11170-124 = "아주 흥미로울 겁니다. 모쪼록 경청해주시길."
11170-125 = "큭. 큭큭큭큭."
11170-127 = "다음화;친구 같은 게 아니라고!"
