[translation]
2601502-1 = "비즈니스 서핑"
2601502-2 = "(해변을 거닐던 도중에, 우연히 이치카와 마주쳤다.)"
2601502-8 = "선생님?"
2601502-9 = "여기는 어쩐 일…… 이라고 물을 정도는 아니네요. 선생님도 와 계셨지요, 하하."
2601502-10 = "예? 저요? 아, 그게 말이죠……."
2601502-11 = "실은, 할일을 먼저 끝내버려서 말임다. 평소에는 페이스 조절을 하는 편인데……."
2601502-12 = "그렇다고 놀고 있으면 눈치 보이지 않습니까? 그래서 괜히 어슬렁거리고 있었슴다, 하하."
2601502-13 = "[s1] \"아, 그럴 때 있지.\"\n[s2] \"일이란 게…… 빨리 끝나기도 하던가?\""
2601502-16 = "뭐, 그 덕에 선생님과 만났으니, 저로서는 약간 상 받은 느낌이네요."
2601502-17 = "그나저나 선생님께서는 지금 어떤 용무로……?"
2601502-18 = "뭐, 아무리 선생님이라 하셔도, 이런 머나먼 해변에서까지 일에 치여 계실 가능성은……."
2601502-22 = "……꽤 있어 보여서 말하기 조심스럽네요."
2601502-23 = "네? ……땡땡이 공범이요?"
2601502-24 = "아하하! 좋습니다. 같이 가시죠."
2601502-28 = "응? 왜 그러십니까, 선생님?"
2601502-29 = "아, <서핑 입문자 교실>이요? 관심 있으심까?"
2601502-30 = "저도 자세히는 모르지만, 오늘 여기서 서핑 대회를 개최한다 해서요."
2601502-31 = "그러니 대회 홍보 겸, 입문자 유입 겸, 그렇게 겸사겸사하는 것 아니겠슴까?"
2601502-32 = "그나저나 선생님께서 서핑에 흥미 있으실 줄은……."
2601502-33 = "네……?"
2601502-34 = "선생님이 아니라 저요? 제가 해보라고요?"
2601502-35 = "또 그러시네요! 저는 됐슴다!"
2601502-36 = "분명, 할 게 없다고는 했지만, 서핑이라고요?"
2601502-37 = "서핑이 뭐냐니요…… 그야, 좀 더 뭔가…… 반짝반짝한 사람들이 하는 느낌이잖슴까?"
2601502-38 = "저는 괜히 넘어져서 망신당하지나 않으면 다행이죠……."
2601502-39 = "네? 그것도 재미라…… 흐음…… 과연, 선생님께서는 그런 생각으로……?"
2601502-43 = "……오호~"
2601502-44 = "후후, 좋습니다. 해보겠슴다."
2601502-45 = "대신에! 선생님도 같이하는 검다!"
2601502-46 = "[s] \"어……? 나도?!\""
2601502-47 = "먼저 말 꺼낸 사람이 물러나기는 없슴다!"
2601502-48 = "자, 자, 선생님! 등록하러 가시죠! 어른스러운 모습 보여주십쇼!"
2601502-50 = "(어쩔 수 없이 이치카와 함께 서핑 교실에 참여하게 되었다.)"
2601502-51 = "(결국, 물에 흠뻑 젖고 말았다…….)"
2601502-57 = "음~ 오, 오오? 이런 느낌…… 일까요?"
2601502-58 = "이치카 쨩, 대단하네! 처음이라 하지 않았어?"
2601502-59 = "네? 그냥 가르쳐 주신 대로 보드에 섰을 뿐인데요."
2601502-60 = "아니, 말이 쉽지! 물 위에 똑바로 뜨는 데만 며칠 걸리는 사람도 있는걸. 테이크 오프를 한 번에 성공하는 건 정말 대단한 거야!"
2601502-61 = "하하…… 감삼다. 몸을 쓰는 일은 특기라서요."
2601502-62 = "원래 첫날에는 기초만 반복하지만, 이치카 쨩은 조금 더 이것저것 가르쳐줘도 될 거 같네."
2601502-63 = "너무 기대는 안 하셨음 좋겠는데. 뭐, 한 번 해보겠슴다."
2601502-65 = "(그 후로도 이치카는 걱정이 무색하게 가르쳐주는 대로 기술을 성공했다.)"
2601502-66 = "(그리고…….)"
2601502-70 = "그래서……."
2601502-71 = "……어쩌다 이렇게 됐죠?"
2601502-75 = "다음 선수는, 트리니티에서 온 나카마사 이치카 선수! 대회 개막 직전에 참가 신청했는데요, 대단히 기대됩니다!"
2601502-76 = "이치카 쨩, 파이팅!"
2601502-77 = "[s3] \"힘내, 이치카!\"\n[s4] \"최고다, 이치카 쨩!!!\""
2601502-80 = "하하…… 선생님까지 완전히 관중 모드이시네."
2601502-81 = "도중에 대회에 나가보라 할 때만 해도, 강사님이 진짜 신청서를 넣으실 줄 몰랐는데."
2601502-85 = "이치카 선수. 시작하기 전에, 대회에 임하는 마음가짐. 한 마디 부탁드립니다."
2601502-86 = "음…… 물에 빠지지 않으면 좋겠네요."
2601502-87 = "위트가 돋보이는 인터뷰 감사합니다!"
2601502-88 = "농담이 아닌데 말임다……."
2601502-89 = "에휴~ 다녀오겠습니다. 망신이나 안 당하면 좋겠네요."
2601502-96 = "오오! 겸손했던 인터뷰에 비해 상당한 실력자인데요, 나카마사 이치카 선수!"
2601502-97 = "테크닉은 화려하지 않지만, 기초가 아주 탄탄합니다. 대회 경력은 짧지만, 아주 오랫동안 서핑을 해온 선수 같습니다."
2601502-101 = "(이치카는 연이어 능숙하게 서핑을 해냈지만, 아쉽게도 기초 기술만으로는 우승할 수 없었다.)"
2601502-105 = "정말 아까웠어, 이치카 쨩! 테크닉 점수만 딸 수 있었으면 우승했을 텐데!"
2601502-106 = "하하, 감삼다."
2601502-107 = "다음 대회는 제대로 준비해서 우승하자! 너를 서핑계를 이끌 차세대 에이스로 키워낼게!"
2601502-108 = "아~ 감사하지만 조금~ 지금은, 동아리 활동에 집중하고 싶어서요."
2601502-109 = "으응~ 그건 아깝네. 대단한 재능인데…… 일단, 내 명함이니까, 마음이 바뀌면 아무 때나 연락해!"
2601502-113 = "……후우~ 정말, 별일이 다 있네요."
2601502-114 = "몇 시간 전까지, 서핑 같은 건 저랑 인연이 없다 생각했는데 말이죠."
2601502-115 = "[s5] \"대단해! 순위권이었어!\"\n[s6] \"조금만 더하면 우승이었는데!\""
2601502-118 = "에이~ 너무 띄워 주지 마십쇼. 하루 연습했다고 우승할 리가 없잖슴까?"
2601502-119 = "그리고 제가 우승해 버리면 그간 노력해 온 사람들은 어쩌고요."
2601502-120 = "가능하지도 않고, 가능해도 문제임다."
2601502-121 = "……너무 깊이 생각하는 거라고요?"
2601502-122 = "그럴지도 모르지만."
2601502-123 = "아무튼, 제가 우승했으면, 정말 분위기 깼을 검다. 으~"
2601502-127 = "아, 벌써 시간이……."
2601502-128 = "다음 일정까지 시간을 어떻게 때우나 했는데, 덕분에 상상도 못하게 즐거웠슴다!"
2601502-129 = "네? 서핑이요?"
2601502-133 = "음…… 그건, 계속할지는 잘 모르겠네요."
2601502-135 = "(이치카는 무언가 고민하는 얼굴로 떠나갔다.)"
