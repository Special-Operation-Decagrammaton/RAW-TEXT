[translation]
10003110-1 = "선도부의 지옥 하계 합숙 훈련 <실전편>!"
10003110-4 = "모두 빨랑빨랑 못해? 거기! 다리가 보여서 되겠어?"
10003110-5 = "네, 네, 넵!"
10003110-6 = "네, 아, 알겠습니, 다!"
10003110-7 = "대답이 늘어진다! 네는 한 번만!"
10003110-8 = "하아, 나 참……."
10003110-9 = "어때요. 이오리. 훈련은 잘 되어가나요?"
10003110-10 = "앗, 아코 쨩."
10003110-11 = "잘 되어간다고 할까. 다들 느려터졌다니까?"
10003110-12 = "언제 문제아 녀석들하고 전면전을 벌일지도 모르는데, 저런 식으로 굼뜨게 굴다니. 걱정이라니까. 정말로."
10003110-13 = "아하. 그런가요? 하지만 말이죠. 이오리."
10003110-14 = "응?"
10003110-15 = "훈련을 지도하는 당사자가 이곳에 가만히 앉아 지시만 하고 있어봐야, 아무래도 선도부의 간부로서 본보기가 되질 못하잖아요?"
10003110-16 = "……응?"
10003110-17 = "후후, 그런 고로 지금부터 이오리가 직접 사격 훈련 시범을 보여주었으면 하는데요. 괜찮죠?"
10003110-18 = "시, 시범? 내가?"
10003110-19 = "네."
10003110-20 = "저, 저기, 아코 쨩? 그런 거라면 굳이 내가 아니더라도……."
10003110-21 = "지금은 제가 선도부장님 대리니까. 말이죠? 후후……."
10003110-25 = "……실시."
10003110-26 = "으아아! 알았어! 하면, 하면 되잖아! 까짓것!"
