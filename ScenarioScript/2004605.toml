[translation]
2004605-1 = "크게 노하여 천지를 엎다"
2004605-6 = "(끝내 니야는 답장을 보내지 않았다.)"
2004605-7 = "(도저히 가만히 기다릴 수 없어, 마지막으로 니야가 보낸 주소로 찾아가기로 했다.)"
2004605-9 = "망량즈 녀석들이 또 말썽 피우고 있다던데."
2004605-10 = "안 그래도 바빠 죽겠는데! 대체 뭐가 문제래!"
2004605-11 = "몰라, 다짜고짜 돈을 내놓으라나……."
2004605-12 = "강도도 아니고 그게 뭐야? 문제아긴 해도 축제를 좋아하는 녀석들인 줄 알았는데……."
2004605-14 = "(전보다 더 어수선해진 거리를 지나…….)"
2004605-16 = "으아앙~ 왜 아무도 부실을 바꿔주지 않는 거야?"
2004605-17 = "그야 우리 부실은 엄청 외진 데다가, 유령이 나온다는 소문까지 있으니까……."
2004605-18 = "그나마 바꿔준다는 동아리들도 부실이 너무 작아서, 우리 종이 공예품을 둘 자리도 없었고……."
2004605-19 = "이제 끝장이야~ 이젠 부 활동도 못 하고, 이대로 폐부될 거야……!"
2004605-20 = "울지 마! 나도 울고 싶어진단 말이야!"
2004605-22 = "(동아리 문제로 힘들어하는 학생들을 지나…….)"
2004605-24 = "호오호오…… 제가 없는 사이에, 그런 일들이~"
2004605-25 = "네? 예상하지 않았느냐고요?"
2004605-26 = "냐하~ 선생님께서는 너무 과대평가하시네요. 저에게 미래를 보는 능력이라도 있는 게 아니고서야~"
2004605-30 = "후후…… 뻔한 거짓말은 그만둘까요?"
2004605-31 = "뭐어~ 분명, 제가 슬~쩍 주선 자리를 마련했더라면, 상인회와 망량즈의 오해는 일어나지 않았을 테고……."
2004605-32 = "당장 종이접기부와 부실을 바꿔줄 만한 동아리도 몇 군데 정도 알고 있으니……."
2004605-33 = "그렇네요~ 대부분 문제는 당장 해결할 수 있네요~"
2004605-34 = "왜 방치하느냐…… 그건 저번에 드린 답변과 같습니다."
2004605-35 = "음양부는 조화를 지키는 역할, 누군가의 편을 들게 되면 조화가 깨지고 말죠."
2004605-36 = "그리고 무엇보다~"
2004605-37 = "적당히 소동이 있는 편이 재밌지 않습니까~?"
2004605-38 = "[s] \"……아까 말한 큰일은 뭐야?\""
2004605-39 = "아, 그거 말인데요."
2004605-40 = "구실 만들기네요~ 선생님께서 잘 받아주셔서 저도 참 편하답니다~"
2004605-44 = "……."
2004605-45 = "[ns] \"니야 학생, 정좌합니다.\""
2004605-46 = "네?"
2004605-47 = "[ns] \"지금부터 설교할 거니까.\""
2004605-50 = "[wa:770]― [log=니야]냐, [wa:650]냐하하……[/log]"
2004605-51 = "[wa:1680]― [log=니야]저기~ [wa:860]요~ [wa:410]선생님~?[/log]"
2004605-54 = "― [log=니야]어머어머, [wa:1150]무서운 얼굴…….[/log]"
2004605-55 = "[wa:1820]― [log=니야]선생님께 안 어울린답니다?[/log]"
2004605-58 = "[wa:1470]― [log=니야]혹시나…… [wa:2040]정말로 화나셨나요~?[/log]"
2004605-61 = "― [log=니야]아니, [wa:610]뭐,[/log]"
2004605-62 = "[wa:1390]― [log=니야]알고는 있습니다만, [wa:2140]아핫…….[/log]"
2004605-65 = "[wa:1780]― [log=니야]그게 [wa:2050]저~ [/log]"
2004605-66 = "[wa:1330]― [log=니야]네~ 네~ 송구합니다…….[/log]"
2004605-69 = "― [log=니야]그렇지만~ [wa:1000]뭐라고 할까~[/log]"
2004605-70 = "[wa:2040]― [log=니야]저희 쪽에도 [wa:930]내부 사정이란 게 [wa:1190]있어서~[wa:160] [/log]"
2004605-73 = "[wa:260]― [log=니야]냐핫?! [wa:1260]아뇨, 아뇨![/log]"
2004605-76 = "― [log=니야]당치도 않습니다![/log]"
2004605-77 = "[wa:1020]― [log=니야]반성하고 있습니다! [wa:1530]예! 예![/log]"
2004605-80 = "[wa:1300]― [log=니야]네…… [wa:930]진심으로 반성하고 있으니까…….[/log]"
2004605-81 = "[wa:2800]― [log=니야]어떻게, [wa:1270]한 번만 용서해 주심이……?[wa:120] [/log]"
2004605-84 = "(……그렇게 한참을 설교했다.)"
