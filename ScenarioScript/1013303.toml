[translation]
1013303-1 = "혼잣말"
1013303-2 = "(혼자 방에서 업무를 처리하다, 기분 전환할 겸 밖으로 나왔다.)"
1013303-7 = "[ns1] \"조용하네…….\"\n[ns2] \"리오는 뭘 하고 있을까?\""
1013303-10 = "아……. 거긴 안 돼."
1013303-11 = "[ns] \"……?\""
1013303-12 = "선생에게 들리면 방해가 될 거야."
1013303-13 = "그러니 최대한 조용히……."
1013303-14 = "[ns] \"……??\""
1013303-15 = "(뭘 하는 걸까. 일단 소리가 들리는 곳으로 가보자.)"
1013303-22 = "[ns] \"리오? 여기 있어?\""
1013303-23 = "으음……."
1013303-24 = "[s] \"리오……?\""
1013303-25 = "……."
1013303-26 = "(아무래도 내가 온 걸 모르는 눈치다.)"
1013303-27 = "(뭔가에 상당히 집중한 것 같은데…… 방해할 순 없으니 일단 지켜보자.)"
1013303-28 = "응. 거기야. 최대한 조심스럽게……."
1013303-29 = "이건…… 너무 강해. 좀 더 천천히……."
1013303-30 = "……딱 좋은 강도야. 계속 부탁해."
1013303-31 = "아, 잠깐. 거긴 섬세한 곳이니 살살."
1013303-32 = "응……. 바로 그렇게."
1013303-33 = "음……."
1013303-34 = "……후우, 잘했어."
1013303-35 = "이제 반복해서 가보자. 방금 느낌을 기억해."
1013303-36 = "[ns] \"……?\""
1013303-37 = "(……이후로도 리오의 혼잣말은 끊이지 않았다.)"
1013303-38 = "(혹시라도 다른 아이들이 복귀해서 볼지도 모르니…… 깨우는 게 좋겠다.)"
1013303-39 = "[ns] \"저기…… 리오?\""
1013303-40 = "그럼 이쪽을 해볼까?"
1013303-41 = "이제 익숙해졌으니, 더 잘할 수 있지?"
1013303-42 = "[s] \"리, 리오야……?\""
1013303-43 = "……?"
1013303-47 = "……!!"
1013303-48 = "서, 선생? 언제부터……?"
1013303-49 = "[s] \"뭔가를 조심스럽게 해야 한다고 했을 때부터……?\""
1013303-50 = "그, 그런……."
1013303-51 = "……봤구나."
1013303-52 = "있으면 있다고 말해주지. 놀랐잖아."
1013303-53 = "[s] \"혼자서 뭘 하고 있었던 거야?\""
1013303-54 = "그건…… 말하기 조금 부끄러운데."
1013303-55 = "[s] \"그, 그렇구나! 그럼 묻지 않을게!\""
1013303-56 = "……아니야. 어차피 들켰으니 상관없어."
1013303-57 = "수송선의 업그레이드를 하고 있었어."
1013303-58 = "이 AMAS를 이용해서."
1013303-63 = "[ns] \"아……!\""
1013303-64 = "최근 작전에서 꽤 괜찮은 파츠를 찾았거든."
1013303-65 = "그래서 사람이 없을 때 집중해서 작업을 해두고 싶었어."
1013303-66 = "그리고, 그……."
1013303-67 = "몰래 업그레이드를 해두고 #n모두를 놀라게 해주고 싶기도 했고……."
1013303-68 = "[s3] \"그, 그랬구나!\"\n[s4] \"우리 리오 장하네!\""
1013303-71 = "응. 고마워……."
1013303-72 = "그런데…… 왜 그렇게 얼굴을 붉히는 거야? 합리적이지 못한 반응인데."
1013303-73 = "……응? 내가 이상한 혼잣말을 한 걸로 보였다고?"
1013303-74 = "그랬나? 난 상당히 평범한 명령어를 말했을 뿐인데."
1013303-79 = "조심스럽게."
1013303-80 = "천천히."
1013303-81 = "좋아."
1013303-82 = "거긴 섬세함이 필요하니 살살."
1013303-83 = "……이런 말을 했던 기억은 있어."
1013303-87 = "……아무리 생각해도 문제 될 사항이 없는데?"
1013303-92 = "[ns] \"그, 그렇지!!\""
1013303-93 = "……여전히 이해할 수 없는 반응이네."
1013303-94 = "선생만 아는 뭔가가 있는 건가?"
1013303-95 = "하지만 이쪽 분야는 내가 선생보다 더 전문가일 텐데."
1013303-96 = "설마 선생은…… 내가 아무도 없는 사이에 수송선을 손보는 게 문제라는 거야?"
1013303-97 = "이래 봬도 최소한의 분별은 하고 있다는 생각인데."
1013303-98 = "나도 그 정도까지 선을 넘진 않는데……."
1013303-99 = "[s] \"그런 건 절대 아니야!\""
1013303-100 = "반응을 보니…… 또 내가 잘못 짚은 것 같네."
1013303-101 = "다만, 다른 가능성을 생각해 봤을 때는…… 짐작 가는 건 없어."
1013303-102 = "선생은 나한테 뭘 숨기는 거야?"
1013303-103 = "솔직하게 말해줘. 내가 합리적인 사고를 할 수 있도록."
1013303-104 = "[s] \"아, 그래! 오랫동안 집중해서 피곤하지? 내가 커피라도 타올까?\""
1013303-105 = "그 정도로 노골적이면, 나라도 '말 돌렸다'라는 건 알아차릴 것 같은데?"
1013303-106 = "……뭐, 선생님의 커피 정도라면 눈감아 줄게."
1013303-107 = "대신 조건이 있어."
1013303-108 = "이왕 커피를 타오는 거, 계속 내 옆에서 보조를 해줬으면 해."
1013303-109 = "아무래도 HMD를 계속 쓰고 있으면 시야가 차단돼서 불편한 부분이 있거든."
1013303-110 = "선생도 급한 일은 다 처리한 모양이니, 괜찮겠지?"
1013303-111 = "[s] \"응! 완전 괜찮아!\""
1013303-112 = "그럼, 잘 부탁해."
1013303-113 = "선생이라면…… 마음 놓고 보조를 맡길 수 있겠지."
1013303-115 = "(그렇게 재빨리 커피를 타온 뒤, 리오의 곁에서 열심히 수송선의 업그레이드를 도왔다.)"
1013303-116 = "(어떻게든 넘어가 줘서 다행이다…….)"
