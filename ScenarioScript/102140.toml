[translation]
102140-1 = "제14화;자치구 방어 작전 - 트리니티 2"
102140-2 = "이쪽은 어느 정도 마무리가 된 것 같네요……."
102140-3 = "잠시만요, 아직 뭔가가……."
102140-5 = "세이아 씨……?"
102140-6 = "대피하지 못한 시민들이 있는 것 같은데……. 저쪽의 유적지 부근에……."
102140-7 = "(치익) 마시로, 그쪽 유적지 확인 부탁해요. 특이 사항이 있나요?"
102140-8 = "네, 선배. 지금 확인 중인데……."
102140-12 = "……!! 미처 대피하지 못한 시민들과 학생들이 유적 성당 쪽에 모여 있는 걸 확인했습니다!"
102140-13 = "네?! 뭐라고요?!"
102140-28 = "어, 어라……?! 그리고 거길 방어하고 있는 사람이……!"
102140-36 = "으, 으으……!"
102140-57 = "하아…… 하아……"
102140-62 = "고, 곧…… 하스미 선배랑 정의실현부가 구하러 올 거니까…… 조금만 기다리면……."
102140-64 = "코하루가 혼자서 거길 지키고 있다고요?! 어, 어째서……?!"
102140-65 = "코하루 쨩이 갇혀 있다고?! 거기가 어디야?"
102140-66 = "분명 코하루는 대피 임무에 투입되었는데……. 어디서 엇갈린 거죠…… 아뇨, 제가 바로 그쪽으로 가겠습니다!"
102140-68 = "네! 저도 가겠습니다, 선배!! 하지만 병력의 숫자가 너무 많아서……."
102140-69 = "지원 병력을 유적 성당으로 보내주세요!"
102140-93 = "아, 아으으……."
102140-97 = "가, 가까이 오지 마……!!"
102140-106 = "으, 으으……."
102140-113 = "응. 저기, 저기. 조금 실례할게."
102140-116 = "어, 벼, 벽을……?"
102140-122 = "저, 저건…… 배신자 미카?!"
102140-123 = "저 마녀가 여기에……?!"
102140-126 = "응! 코하루 쨩이 여기 있다고 해서, 서둘러 왔지 뭐야."
102140-127 = "어…… 그, 그러니까…… 티, 티파티의 높으신 분인……."
102140-131 = "괜찮아, 코하루 쨩? 다치진 않았어? ……응, 다쳤네."
102140-132 = "어…… 네…… 이건 조, 조금 긁힌 정도라서……. 어……."
102140-133 = "……응. 그렇구나."
102140-144 = "그러네. 네 녀석들, 그랬다는 거지? 응. 정말이지……. 하하하하."
102140-148 = "……감히 내 소중한 친구한테 무슨 짓을 한 거야?"
