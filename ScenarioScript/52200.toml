[translation]
52200-1 = "제20화;원래의 모습"
52200-2 = "이 소녀가, 정말로 그 전설 속의 대 예언자인 쿠즈노하라고……?"
52200-3 = "어쩐지 신비로운 분위기가 느껴지는 장소이긴 하지만, 이렇게 귀엽고 가녀린 소녀가 쿠즈노하 님이라니…… 쉽게 믿기가 어렵사와요."
52200-4 = "후후, 그렇게 생각하는 것도 무리가 아니지."
52200-5 = "백화요란의 초대 부장으로서 용병술에 능통하면서, 이만한 재색까지 갖춘 소녀는 미색이 뛰어나기로 유명한 백귀야행에서도 흔치 않은 존재니까."
52200-6 = "[s1] \"네가…… 그 쿠즈노하야?\"\n[s2] \"그 자신감 넘치는 말투는 어쩐지 나구사와도 조금 닮은 것 같네.\""
52200-8 = "호오. 먼 후배와 닮았다는 칭찬은 나쁘게 들리지 않지만, 그 말에는 조금 어폐가 있구나."
52200-9 = "내가 나구사를 닮은 것이 아니라, 나구사가 나를 닮은 것이겠지."
52200-10 = "이래 보여도 이 몸은 나구사가 태어나기 수백 년 전부터 살아온 존재니까."
52200-14 = "그래. 그대가 샬레의 선생인가."
52200-15 = "그대를 만나게 되면 하고 싶었던 말이 여러 가지 있었다만……"
52200-16 = "늦었지 않나!"
52200-17 = "내가 서신을 전달한 것이 언제인데, 이제야 나를 찾다니— 아무리 바쁜 몸이라 하더라도 그 정도가 있지."
52200-18 = "아니면 그대는 나와 같은 여우 요괴의 시간은 다른 학생들과 달리 천천히 흘러가기라도 한다고 생각한 것인가?"
52200-19 = "[s3] \"이, 일부러 늦게 온 건 절대 아니야!\"\n[s4] \"여러가지 사정이 있었지만…… 늦어져서 정말 미안해.\""
52200-22 = "……흐음. 뭐, 어쩔 수 없는가."
52200-23 = "애초에 '누군가를 구하고 싶다면'이라고 전제를 달아둔 건 내 쪽이기도 하거니와, 그대를 기다리는 학생들이 많다는 사실은 이미 알고 있었으니까."
52200-24 = "그리고 표정을 보아하니, 이미 그대는 나름의 결론을 내린 듯하구나."
52200-25 = "[s] \"쿠즈노하, 사실 나는—\""
52200-29 = "자, 여기까지."
52200-36 = "모두 잊고 있었던 건 아니겠죠? 여러분을 여기에 올 수 있도록 이끈 건 저였다는 사실을."
52200-37 = "잠시, 제가 쿠즈노하 님과 괴서에 대한 이야기를 나눌 수 있도록 모두 자리를 비켜주시겠어요?"
52200-38 = "야부키 슈로……"
52200-39 = "뭔가요, 나구사 쨩. 그렇게 쳐다본다고 제가 겁먹을 것 같나요?"
52200-40 = "백련도 없는 당신 따위는 하나도 무섭지 않거든요~"
52200-41 = "뭐, 하지만 당신 덕분에 황혼의 사원을 찾았으니 목숨만큼은 살려드—"
52200-46 = "뭐, 뭐야?! 방금 그 일격은……?"
52200-47 = "어른이 말을 나누는 데, 중간에 끼어들다니. 고얀 녀석이로구나."
52200-48 = "지금은 썩 물러나거라."
52200-53 = "마, 말도 안 돼…… 백련도 없이 괴서의 신비를 무력화할 수는—"
52200-54 = "하아. 버르장머리만 없는 줄 알았더니 아둔하기까지 하구나."
52200-55 = "백련의 자격이란 본디 이 몸으로부터 이어져 온 것인데, 그대는 어찌하여 내가 백련의 힘을 사용하지 못할 거라 생각했는지."
52200-56 = "그 아둔함을 도무지 이해할 수가 없구나."
52200-57 = "그리고 이곳은 시간도 세월도 속세와 다르게 흘러가는 <황혼의 사원>. 황혼 속에서는 무슨 일이든 벌어질 수 있다는 걸 염두에 두고 있어야지."
52200-67 = "우으…… 우으으으……"
52200-68 = "코, 코쿠리코 님께 다 이를 거야!"
52200-72 = "후후, 어린아이가 손에 쥔 칼의 위세만 믿고 으스대는 꼴이로구나."
52200-76 = "그래서, 후배야. 어찌 나를 찾았느냐."
52200-77 = "단순히 샬레의 선생을 배웅하기 위해 이곳을 찾아온 것은 아닐텐데."
52200-78 = "………."
52200-79 = "나를 부정하던 네가 이 사원을 다시 찾았다는 것은, 내가 쿠즈노하라는 사실을 인정했다는 뜻으로 받아들여도 괜찮겠느냐?"
52200-80 = "그래. 더 이상 당신이 쿠즈노하라는 사실을 부정하지 않겠어."
52200-81 = "당신이 나를 인정해 주었기에 내가 백화요란의 적법한 후임으로서 백련을 사용할 수 있게 되었다는 사실 또한…… 지금은 이해할 수 있어."
52200-82 = "하지만……"
52200-86 = "……어째서 그 상대가 '아야메'가 아니었던 거야."
52200-87 = "나보다 훨씬 우수하고 간절히 원했던 아야메는 당신을 만날 수 없었는데."
52200-88 = "어째서 당신은 나처럼 불완전하고 모자란 사람 앞에 모습을 드러냈던 거야."
52200-89 = "당신이 아야메를 만났더라면, 그녀를 인정하고 백련의 자격을 계승해 주었더라면."
52200-91 = "……아야메도, 백화요란의 그 누구도 상처받지 않았을텐데."
52200-92 = "……모든 관계가 전과 다르지 않았을 텐데."
52200-93 = "정말 아무도 상처받지 않았을 거라고 생각하느냐?"
52200-97 = "아야메가 나를 만나고, 백련을 자유롭게 쓸 수 있었더라면. 모두가 계속해서 행복한 삶을 누릴 수 있었을 거라 생각 했느냐?"
52200-98 = "그건……"
52200-99 = "착각을 하고 있는 것 같아 첨언해 두자면, <황혼의 사원>에 발을 들일 수 있는 조건은 내가 직접 판단하고 결정하는 것이 아니다."
52200-100 = "이 <황혼의 사원>은 현실에서는 이미 오래전에 사라져 없어져 버린 과거의 공간. 나 또한 현실에서는 기억하는 이가 거의 남아 있지 않은 잊힌 존재에 불과하지."
52200-101 = "빛과 어둠이 공존하는 이 기묘한 황혼 속에서, 과거의 존재는 어둠 속에 스러져 가는 그림자와 같은 것인데—"
52200-102 = "사라진 과거의 빛을 쫓는 자가, 어찌 옛 그림자를 마주할 수 있겠느냐."
52200-103 = "스스로의 어둠을 인정하지 않는 자가, 어찌 타인을 밝힐 수 있겠느냐."
52200-104 = "다만, 희미한 여명을 뒤로한 채 두려움 없이 어둠 속으로 나아가는 자는 몸 앞에 드리워진 그림자를 볼 수 있지."
52200-105 = "……그렇기에 그대는 아야메와 달리, 나를 만날 수 있었던 게다."
52200-106 = "하지만 그렇다고 해도…… 아야메를 이대로 내버려둘 수는 없어."
52200-107 = "제발, 부탁할게."
52200-108 = "어떻게 해야 아야메를 '원래의 모습'으로 되돌릴 수 있는 거야?"
52200-109 = "……원래의 모습이라."
52200-113 = "후배야. 네가 생각하는 '원래의 아야메'는 어떤 모습이었느냐?"
52200-114 = "원래의 아야메라니……"
52200-115 = "내가 기억하는 아야메는, 한낮의 햇살처럼 따듯하고 거절하는 법을 모르는 우수한 백화요란의 부장—"
52200-116 = "그 설명만으로 아야메의 모든 모습을 묘사할 수 있느냐?"
52200-117 = "아야메가 겉과 속이 조금도 다르지 않은 투명한 존재라고 확신할 수 있느냐?"
52200-118 = "그건……"
52200-121 = "……이번에도 좋은 대련이었어. 고마워, 나구사."
52200-125 = "행복한 꿈은 깨어난 순간부터 괴로운 현실을 계속 곱씹어야 하니까."
52200-129 = "단 한 번도 친구라고 생각한 적이 없었으니까."
52200-134 = "사람은 누구나 가면을 쓰고 살아가지."
52200-135 = "미움받지 않기 위해, 버림받지 않기 위해. 서로가 필요로 하는 모습을 연기하고, 호감 받는 인상을 얼굴 위에 뒤집어쓰지."
52200-136 = "그건 사람이 사람과 함께 살아가는 이상, 당연한 일이니라."
52200-137 = "가끔씩 어떤 가면은 본인의 얼굴에 딱 들어맞아, 이를 본 다른 사람들이 그 가면을 상대의 진짜 얼굴이라 생각할지라도—"
52200-138 = "그 얼굴이 진짜인지, 가짜인지 판단할 수 있는 것은 오직 자신뿐이니라."
52200-139 = "다시 한번 물으마. 네가 바라는 원래의 아야메는 어떤 모습이었느냐?"
52200-143 = "내가 바라는 아야메의 본래 모습은……"
52200-151 = "나는…… 알 수 없어. 나는 아야메가 아니니까."
52200-152 = "나는 아야메가 아니니까. 아야메의 본 모습이 어떤 것이었는지 감히 헤아릴 수 없어."
52200-153 = "하지만…… 하지만 이해할 수 없더라도, 설령 아야메가 나를 원치 않는다 하더라도—"
52200-154 = "나는, 아야메의 곁에 있고 싶어."
52200-155 = "엎질러진 물을 되담을 수 없는 것처럼, 죽은 자를 되살릴 수 없는 것처럼. 변해 버린 존재를 원래의 모습으로 되돌릴 수 있는 방법은 존재하지 않는다네."
52200-156 = "이는 죽은 사람을 되살릴 수 없는 것처럼, 꽃이 지면 열매가 맺히는 것처럼. 인과의 흐름이 존재하는 세상에서는 당연한 이치지."
52200-157 = "하지만 그럼에도 불구하고, 누군가를 구하고 싶다면……"
52200-161 = "후후, [USERNAME] 선생은 이미 그 방법을 알고 있는 것 같군."
52200-164 = "그래도 조금은 알게 된 게 있어. 선생님."
52200-165 = "호시노 선배가 어째서 자신의 본질이 반전된 상태에서 다시 원래대로 돌아올 수 있었는지."
52200-166 = "애초에 나와는 달리 불완전한 상태였기도 하고, <색채>가 아닌 다른 무언가를 통해 전환된 것이기도 했지만……."
52200-167 = "하지만 선배는 결국 자신의 본질이었던, 자신의 일부를 버렸던 거야. 그래서……"
52200-168 = "……앞으로 나아갈 수 있었던 거겠지."
52200-171 = "어떤 모습의 자신이라 할지라도 부정하지 않고, 자신을 받아들여 인정한다면."
52200-172 = "누구나 내일로 걸어 나갈 수 있다는 사실을 말이야."
52200-173 = "후배야, 너는 아야메를 구하고 싶으냐."
52200-174 = "무슨 수를 써서라도, 구하고 싶어."
52200-175 = "그렇다면 그녀를 부정하지 말거라."
52200-176 = "이해할 수 없어도 부정하지는 말고, 도망치고 싶어도 마주하면 길이 보일 것이니."
52200-177 = "황혼 속에서 헤매고 있는 너의 벗도, 벗을 향한 너의 손길도, 그 여정 속에서 다시 만날 수 있을 거란다."
52200-178 = "……그마아아안!"
52200-184 = "그런…… 그런 궤변이나 듣자고, 여기까지 온 줄 알아?"
52200-185 = "인간은……평범한 인간은 절대로 타인을 이해할 수 없어."
52200-186 = "그깟 궤변을 지껄이는 것만으로 이해받고, 구원받을 수 있다면 누가 풍문 따윌 신경 쓰는데!"
52200-187 = "상대가 가면 아래에서 어떤 표정을 짓고 있는지, 불안해하고, 괴로워하며 끊임없이 스스로를 증명하지 않으면 아무도 상대해 주지 않는다고!"
52200-188 = "그렇지 않으면 괴서조차 갖지 못한 나는…… <이노모노노케로쿠>를 잃어버린 그때 이미—"
52200-189 = "<이노모노노케로쿠>……?"
52200-190 = "아, 그 낡은 괴담집 말이냐? 그깟 낡은 책에 무슨 의미가 있다고."
52200-191 = "그, 그깟 낡은 책……?"
52200-192 = "모처럼 <황혼의 사원>을 찾아왔으니, 네게도 조언을 해주마. 미숙한 아이야."
52200-197 = "책의 가치는 안에 적힌 이야기에 있지, 거창한 외견에 있는 것이 아니란다."
52200-198 = "그 사실을 깨닫게 되었을 때, 너 또한 너만의 괴서를 갖게 될 것이야."
52200-199 = "그런 궤변으로 얼버무리려 해도……"
52200-200 = "궤변……? 모든 이야기는 궤변으로부터 시작한다는 점을 아직 모르겠느냐?"
52200-201 = "좋은 이야기꾼이 되려면 너는 아직 한참 먼 모양이구나."
52200-206 = "으으……"
52200-207 = "이래서 백화요란 따윈 정말 싫어!"
52200-209 = "다음화;타인의 시선"
