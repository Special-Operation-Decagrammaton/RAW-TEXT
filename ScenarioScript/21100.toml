[translation]
21100-1 = "제10화;다시, 폐허로."
21100-2 = "폐허"
21100-3 = "선생님……."
21100-4 = "엎드려!!"
21100-5 = "(콰과과과광!)"
21100-6 = "이런! 괜찮아? 모두?"
21100-7 = "크윽. 생각보다 화력이 강해! 선생님은?!"
21100-9 = "[ns] \"괜찮아.\""
21100-10 = "로봇들이 계속 몰려와. 이대로는……!"
21100-11 = "걱정하지 마. 그래서 일부러 이런 좁은 곳으로 끌어들인거니까."
21100-12 = "후우……."
21100-13 = "아리스 쨩!"
21100-14 = "딜타임이야!"
21100-16 = "(끄덕)"
21100-17 = "……오늘 나의 역할은…… 명 속성 광역 딜러……"
21100-18 = "전방의 몬스터들을 섬멸합니다."
21100-19 = "빛이여!"
21100-20 = "(콰과과광!)"
21100-21 = "서, 성공이다!"
21100-22 = "아리스 쨩 굉장해!"
21100-23 = "아, 아직이야! 적 2번째 부대 진입 중!"
21100-24 = "윽. 즉시 재전투라니…… 불리해! 도망치자. 선생님도 있으니 최대한 안전하게……."
21100-25 = "……아니."
21100-26 = "……도망은 안 돼. 돌파해야 해."
21100-27 = "뭐?!"
21100-28 = "여기서 물러나면, 기회가 없어. 로봇들은 전투 음을 듣고 계속 몰려오고 있으니까."
21100-29 = "G.Bible이 있을 거라 표시된 좌표 지점인 저 '공장'에 들어가려면, 지금뿐이야."
21100-31 = "하, 하지만……."
21100-32 = "할 수 있습니다."
21100-33 = "어? 아리스 쨩?"
21100-34 = "저희는, 지금까지 27번의 던전 탐사와 139번의 레이드 성공이라는 결과를 쌓아왔습니다."
21100-35 = "이번에도 함께라면…… 반드시 승리할 수 있습니다."
21100-36 = "아니…… 그건 게임 멀티 플레이 얘기잖아!"
21100-37 = "으음…… 위험하긴 하지만…… 나도 열심히 할게."
21100-38 = "하지만 선생님은? 우리와 달리 선생님은 정말 위험할지도 몰라!"
21100-39 = "괜찮습니다."
21100-40 = "응?"
21100-41 = "아무리 위험한 곳에 가더라도, 아리스가 선생님을 지킵니다."
21100-43 = "선생님은, 아리스와, 우리와 함께합니까?"
21100-44 = "[s1] \"물론이야.\"\n[s2] \"우리는 이미 동료잖아?\""
21100-45 = "……!"
21100-46 = "……!"
21100-47 = "뽜밤뽜밤! 선생님이, 동료로 합류했습니다."
21100-48 = "하아. 좋아. 알았어! 알겠다구!"
21100-49 = "게임개발부! 적을 돌파합니다."
21100-50 = "선생님! 지시를 부탁드려요!"
