[translation]
2003803-1 = "추운 나라에서 온 비서실장"
2003803-3 = "후우……."
2003803-4 = "[s] \"많이 더워?\""
2003803-5 = "그렇네요. 아무래도 붉은겨울보다는 산해경의 기온이 조금 더 높은 것 같고."
2003803-6 = "그래서 이런 옷으로 갈아입었습니다만, 뭐라고 해야 할까요."
2003803-7 = "기본적으로 온도를 느끼는 체질 자체가 다른 것 같다고 표현해야 하려나요."
2003803-8 = "그래서 뭔가, 시원한 마실 것이라도 찾기 위해 이곳까지 왔지만……."
2003803-9 = "[s] \"……그다음부터는 나도 알 것 같네.\""
2003803-10 = "네. 산해경 어디에서도 차가운 음료는 준비하고 있지 않는 모양이더군요."
2003803-11 = "차가운 것은 몸에 좋지 않고, 특히 소화기관에 나쁘다고……."
2003803-12 = "갑자기 찬 물을 마시고 체하는 경우도 제법 있는 편이니, 완전히 틀린 말은 아니겠지만."
2003803-13 = "그렇다고는 해도 이렇게 더운데 따듯한 차만 마셔야 한다는 것도, 조금, 말이죠?"
2003803-14 = "심지어 다른 학원에서라면 원래 차갑게 해서 제공하고는 하는 음료수마저도 미지근한 상태로 보관하고 있다고 하니……."
2003803-15 = "[s] \"도움이 될지는 모르겠지만, 일단 이거라도……?\""
2003803-22 = "어머나, 이것은……?"
2003803-23 = "현룡문에서 받은 부채라고요? 후후. 그런 것 치고는 예쁘네요. 귀엽기도 하고요."
2003803-24 = "붉은겨울에서는, 특성상 부채를 거의 쓰지 않았습니다만……."
2003803-25 = "조금 흥미가 생기네요. 어디……."
2003803-29 = "[wa:1670]― [log=토모에 치파오]시원한 바람…… [wa:2310]적당히 좋은 그늘……[/log]"
2003803-30 = "[wa:2770]― [log=토모에 치파오]거기에 부채로 바람을 쐬고……[/log]"
2003803-33 = "[wa:830]― [log=토모에 치파오]후후. [wa:1140]확실히 이건 [wa:1210]처음 경험하는 일이에요.[/log]"
2003803-36 = "[wa:1500]― [log=토모에 치파오]이런 경험 하나하나가……[/log]"
2003803-37 = "[wa:3990]― [log=토모에 치파오]시야를 넓혀주는 것이겠죠.[/log]"
2003803-40 = "[ns] \"토모에의 넓은 시야라……. 나도 보고 싶네.\""
2003803-42 = "[wa:1230]― [log=토모에 치파오]어머나? [wa:1530]그다지 재미있지 [wa:1140]않을 수도 있을 텐데요?[/log]"
2003803-45 = "[wa:670]― [log=토모에 치파오]후후, [wa:1220]선생님. [wa:1280]그런 곳에서 보지 말고……[/log]"
2003803-46 = "[wa:2580]― [log=토모에 치파오]이쪽으로 오세요.[/log]"
2003803-49 = "[wa:2830]― [log=토모에 치파오]자, [wa:1160]부채로 부채질해 드릴 테니까요.[/log]"
2003803-54 = "저기, 저 난간 좀 봐."
2003803-55 = "뭔데 그래? 어, 잠깐……."
2003803-56 = "그렇지? 분위기 살지?"
2003803-57 = "그냥…… 바라보게 되네. 우아하고, 아름답고, 기품있고……."
2003803-58 = "그저 단순하게 만든 둥글부채일 뿐인데……."
2003803-59 = "저분이 흔드니까, 엄청 고급스러워 보여……."
2003803-61 = "……!"
2003803-62 = "[s1] \"왜 그래, 토모에? 아직도 그렇게 더워?\"\n[s2] \"얼굴이 어째 더 붉어진 것 같은데……?\""
2003803-65 = "아, 아뇨. 이건 덥다기보다는……. 그, 결과적으로는 더운 게 맞기도 한데……."
2003803-66 = "조금, 부끄럽네요. 우선 이 자리를 피할까요?"
2003803-67 = "[s] \"그런 거라면 좋은 생각이 있어!\""
2003803-68 = "네? 바오빙(刨冰)을 먹으러 가자고요? 그게 뭐죠?"
2003803-69 = "아……. 빙수의 일종이군요. 좋네요! 지금 저희에게 가장 필요한 음식인 것 같아요."
2003803-70 = "가는 길에…… 부채로 바람을 부쳐 드릴게요. 어떠신가요?"
2003803-72 = "(그렇게 토모에와 함께 시원한 것을 먹으러 거리로 나섰다.)"
2003803-73 = "(가위바위보를 해 서로에게 부채를 부쳐 주거나, 부쳐짐을 당하거나 하는 장난을 치면서.)"
