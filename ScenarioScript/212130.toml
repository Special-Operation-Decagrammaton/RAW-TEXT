[translation]
212130-1 = "第13話;監禁"
212130-3 = "[ns] \"牢屋……久しぶりだなぁ……。\""
212130-4 = "（外とは完全に遮断されており、不安ばかりが募る）"
212130-15 = "……先生よ。"
212130-16 = "[s] \"やあ、マコト。\""
212130-17 = "……こんな場所しか用意できなかったこと、どうか理解してほしい。"
212130-18 = "私とてこんな形を望んでいたわけではない。"
212130-19 = "ただ、先生は我々にとって最大の懸念だ……そういう意見があってな。"
212130-20 = "先生の力は、この私ですら予測できぬほどだからな。#n私も同意した以上、この手段を取るしかなかった。"
212130-21 = "……。"
212130-22 = "なぜ先生が反対の立場をとるのか、分からぬわけではない。"
212130-23 = "どんな学園であれ、どんな生徒であれ大切に思うのが先生だ。#nならば、キヴォトスを害する可能性に対して反対せざるを得ないのも当然だろう。"
212130-27 = "だが、こう考えてみるのはどうだ？"
212130-28 = "今のキヴォトスは多様な学園が各々の個性を武器に、好き勝手に秩序を主張している。"
212130-29 = "故に無意味な対立が生まれ、不信による非効率な決定が下され、争いが起こる。"
212130-30 = "しかし！！ゲヘナの旗のもと、全ての生徒が同じ目標に向かって歩くのなら！#nそうした問題は二度と起こらなくなる。"
212130-31 = "それだけではない。#n散らばっていた思考と資源を束ねられれば、キヴォトスは目覚ましい発展を遂げるだろう。"
212130-32 = "先生よ、素晴らしいとは思わないか？#nゲヘナに留まらず、キヴォトスが偉大になれる道だ。"
212130-33 = "[s] \"私は……。\""
212130-36 = "[ns1] \"前のゲヘナの方がずっと素敵だと思う。\"\n[ns2] \"マコトが作りたかった、自由なゲヘナの方が。\""
212130-39 = "……。"
212130-48 = "ぐっ……！！"
212130-49 = "[s] \"マコト……！？\""
212130-57 = "……ふぅ。"
212130-58 = "そうか。先生の考えは理解した。"
212130-59 = "キシシッ……ならば、今日はこれで帰るとしよう。"
212130-60 = "だが、先生は私の長所を知っているだろう？"
212130-61 = "――執念深いのだよ。"
212130-65 = "[ns] \"……またね。\""
212130-66 = "……ここで過ごす間、不自由のないようには手配しておこう。"
212130-70 = "[ns] \"……。\""
212130-77 = "先生。"
212130-78 = "[s3] \"やあ、ショウコ。\"\n[s4] \"今日は人気者だなあ。\""
212130-81 = "ふふ……相変わらずですね。"
212130-82 = "先ほどのお話、私も聞かせていただきました。"
212130-83 = "マコト議長は先生を説得するつもりのようですが、できると思っているのでしょうか。"
212130-84 = "私の知る限り、先生の思考パターンは一貫しています。"
212130-85 = "1人でも多く、生徒のために。"
212130-86 = "平和的で、慈悲深く、皆が幸せになる方向へ。"
212130-87 = "……。"
212130-88 = "[s] \"……。\""
212130-89 = "だからこそ、先生が肯定するはずがない。"
212130-90 = "まったく、マコト議長にもヒナ風紀委員長にも困ったものです。"
212130-91 = "皆、甘すぎるんですよ。"
212130-92 = "先生だってそう。"
212130-93 = "皆が幸せになれる世界など夢物語です。"
212130-94 = "先生は、生徒がいつか答えを出すと信じているのでしょうけれど……現実は違います。"
212130-95 = "烏合の衆から生ずるエネルギーなんて、ほとんどが浪費されてしまいます。#n極めて非効率なんですよ。"
212130-96 = "[s] \"それも答えを見つけていく過程だと思ってるよ。\""
212130-99 = "[ns] \"みんなが幸せな世界を作るのは、たしかに難しいと思う。\""
212130-101 = "[ns] \"だからこそ努力し続ける必要があるんだ。\""
212130-102 = "……それは限られた者の特権ですよ。#n自分探しをできる人たちの陰で、非効率の被害者となる子も間違いなく存在します。"
212130-103 = "全員に手を差し伸べられるとでもお思いですか？#nどれだけ無茶をしようと、時間も心も限りがあるというのに。"
212130-104 = "先生の優しさも次第にすり減って、取り残された子は無秩序の奈落へ落ちていく。"
212130-105 = "いくら先生でも「みんなが幸せ」など不可能なのですよ。"
212130-106 = "[s] \"…………。\""
212130-107 = "この点においては抑圧による統制の方が、より大きなメリットをもたらします。"
212130-110 = "ゲヘナがキヴォトスに秩序を打ち立てるその時から、真の平和が始まるんです。"
212130-111 = "先生もいずれ分かりますよ。#n強大な力で統治された社会の方が、中途半端な自由よりずっとマシだということを。"
212130-114 = "[ns] \"前に、理想像の話をしてくれたよね。\""
212130-118 = "[ns5] \"一切迷わずに正しい決断を下せて。\"\n[ns6] \"何も疑わず前へ進める人。\""
212130-121 = "……そうでしたね。"
212130-122 = "それが何か？"
212130-127 = "[ns7] \"もしかしてだけどさ。\"\n[ns8] \"自分を信じきれてないんじゃない？\""
212130-130 = "なっ……！"
212130-131 = "[s] \"間違った選択を怖がってるように見えるよ。\""
212130-132 = "……。"
212130-133 = "なぜです？この状況でどうしてそんなことを言うんですか？"
212130-134 = "先生は牢の中に閉じ込められているんですよ？"
212130-135 = "隔てた反対側にいる、私によって。"
212130-136 = "マコト議長と風紀委員長に進言したのは私なんです。"
212130-137 = "[s] \"分かってるよ。\""
212130-138 = "ならば憎んで……恨むべきでしょう？"
212130-139 = "……なのに、どうして私を……そんな目で見るんですか？"
212130-140 = "[s9] \"憎むのは簡単なことだよ。\"\n[s10] \"でも、それは先生の仕事じゃない。\""
212130-143 = "馬鹿らしい！恨んで呪うのが人間の本性なんです！！#nそれがこの混沌として醜い世界の真実なんですよ！！"
212130-144 = "同情されるべきは私じゃなくて！無力に閉じ込められている先生の方でしょう！？"
212130-145 = "[s11] \"そうやって私に憎まれたがってるのはさ。\"\n[s12] \"ショウコが自分自身を許せてないからじゃないかな。\""
212130-150 = "……！！"
212130-154 = "……最低です。先生は……最低最悪の先生です。"
212130-159 = "二度と、そんな目で私を見ないでください。"
212130-166 = "[ns] \"……。\""
212130-169 = "次回;反逆者たち"
