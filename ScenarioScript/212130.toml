212130-76 = ""
212130-77 = "คุณครู"
212130-78 = "[s3] \"สวัสดี โชโกะ\"\n[s4] \"วันนี้ครูเนื้อหอมจังนะ\""
212130-81 = "ฮุฮุ... ยังเหมือนเดิมเลยนะคะ"
212130-82 = "เอาเป็นว่า ฉันได้ฟังคำพูดของคุณครูแล้วค่ะ"
212130-83 = "ดูเหมือนประธานมาโคโตะคิดจะเกลี้ยกล่อมคุณครู แต่ฉันต่างออกไปนิดหน่อยค่ะ"
212130-84 = "เท่าที่ฉันรู้ รูปแบบความคิดของคุณครูเสมอต้นเสมอปลายมาโดยตลอด"
212130-85 = "ทำงานเพื่อนักเรียน ทำงานหนักมากยิ่งขึ้นก็เพื่อนักเรียน"
212130-86 = "มุ่งไปในทิศทางที่สงบ มีเมตตา และทุกคนมีความสุข"
212130-87 = "..."
212130-88 = "[s] \"...\""
212130-89 = "คุณครูที่เป็นแบบนั้นย่อมไม่มีทางเห็นด้วยกับสงครามพิชิตของเกเฮนน่าอยู่แล้วค่ะ"
212130-90 = "จริงๆ เลย ทั้งประธานมาโคโตะ ทั้งประธานกรรมการวินัยฮินะ ตอนนี้ฉันเพิ่งเข้าใจว่าทำไมถึงเอาแต่ลังเล และไม่เดินหน้าเสียทีค่ะ"
212130-91 = "ทุกคนใจอ่อน ใจอ่อนเกินไป"
212130-92 = "คุณครูเองก็เหมือนกันค่ะ"
212130-93 = "โลกที่ทุกคนมีความสุขอะไรนั่นไม่มีอยู่จริงหรอกค่ะ คุณครูก็รู้นี่คะ"
212130-94 = "คุณครูคงเชื่อว่าสักวันเจตนาดีของนักเรียนจะนำคำตอบมาให้ แต่ความจริงนั้นมันต่างออกไปค่ะ"
212130-95 = "พลังงานที่เกิดขึ้นเมื่อบุคคลซึ่งไร้การควบคุมมารวมตัวกัน ส่วนใหญ่มีแต่สูญเปล่าไปในอากาศ#nและก็ไร้ประสิทธิภาพอย่างยิ่งค่ะ"
212130-96 = "[s] \"ครูว่าความไร้ประสิทธิภาพก็เป็นสิ่งที่นักเรียนใช้ค้นหาคำตอบด้วยตัวเอง\""
212130-99 = "[ns] \"อย่างที่โชโกะบอก โลกที่ทุกคนมีความสุขคงสร้างขึ้นได้ยาก\""
212130-101 = "[ns] \"เพราะงั้นเราถึงต้องพยายามกันอย่างไม่หยุดยั้งไงล่ะ\""
212130-102 = "เป็นคำพูดที่สวยหรูดีนะคะ... ระหว่างที่พวกคนที่ปล่อยตัวตามอำเภอใจค้นหาคำตอบกันอยู่ ก็ย่อมต้องมีผู้ที่ตกเป็นเหยื่อของความไร้ประสิทธิภาพนั้นค่ะ"
212130-103 = "คุณครูจะเช็ดน้ำตาทุกหยดได้เหรอคะ? เวลาและหัวใจของคนเรามีขีดจำกัดนะคะ"
212130-104 = "ท้ายที่สุดแล้ว ความอ่อนโยนของคุณครูก็จะสึกกร่อนจนถึงขีดจำกัด และเด็กที่ถูกทิ้งไว้ ก็จะตกลงสู่หลุมแห่งความไร้ระเบียบอีกครั้ง"
212130-105 = "ต่อให้เป็นคุณครูก็ช่วยทุกคนเอาไว้ไม่ได้หรอกค่ะ"
212130-106 = "[s] \"...\""
212130-107 = "ในแง่นั้นแล้ว การควบคุมด้วยการกดขี่กลับจะนำประโยชน์ส่วนรวมมาให้มากกว่ากันค่ะ"
212130-108 = ""
212130-110 = "เมื่อเกเฮนน่าพิชิตคิโวทอสและสร้างระเบียบเพียงหนึ่งเดียวขึ้นมา เมื่อนั้นสันติภาพที่แท้จริงจึงจะเริ่มต้นค่ะ"
212130-111 = "คุณครูเองก็จะเข้าใจ ว่าสังคมที่ปกครองด้วยอำนาจอันแข็งแกร่งนั้นดีกว่าอิสรภาพแบบครึ่งๆ กลางๆ มากเพียงใด"
212130-112 = ""
212130-114 = "[ns] \"โชโกะเคยพูดถึงคนที่ตัวเองอยากเป็นใช่มั้ยล่ะ?\""
212130-115 = ""
212130-117 = ""
212130-118 = "[ns5] \"คนที่ตัดสินใจได้อย่างถูกต้องโดยไม่ลังเลแม้แต่น้อย\"\n[ns6] \"คนที่ก้าวไปข้างหน้าได้โดยไม่เคลือบแคลงแม้แต่นิดเดียว\""
212130-121 = "ฉันเคยพูดแบบนั้นค่ะ..."
212130-122 = "ทำไมถึงได้ยกเรื่องนั้นขึ้นมาเอาตอนนี้ล่ะคะ?"
212130-123 = ""
212130-127 = "[ns7] \"คำพูดนั้น หรือว่า...\"\n[ns8] \"เกิดจากใจที่ไม่เชื่อมั่นในตัวเองหรือเปล่า\""
212130-130 = "...!"
212130-131 = "[s] \"โชโกะ กลัวว่าจะเลือกผิดอยู่หรือเปล่า?\""
212130-132 = "..."
212130-133 = "ทำไมคะ? ทำไมถึงพูดเรื่องนั้นในสถานการณ์แบบนี้?"
212130-134 = "ตอนนี้คุณครูถูกขังอยู่นะคะ อยู่ในคุกเลยด้วย"
212130-135 = "ฉันคือคนที่ขังคุณครูนะคะ"
212130-136 = "ฉันเป็นคนบอกประธานมาโคโตะกับประธานกรรมการวินัย ให้ขังคุณครูเองนะคะ"
212130-137 = "[s] \"ครูรู้\""
212130-138 = "ถ้างั้นก็ควรเกลียดฉันสิคะ...? ต้องโกรธแค้นฉันสิคะ"
212130-139 = "แต่ทำไมถึงมองฉัน... ด้วยสายตาแบบนั้นล่ะคะ...?"
212130-140 = "[s9] \"การเกลียดใครสักคนเป็นเรื่องง่ายมาก\"\n[s10] \"และนั่นไม่ใช่สิ่งที่ครูควรทำ\""
212130-143 = "บ้าบอน่า...!! การโกรธแค้นและสาปแช่งคือธรรมชาติของมนุษย์!#nนั่นต่างหากคือความจริงของโลกอันวุ่นวายและน่าเกลียดใบนี้!!"
212130-144 = "คนที่ควรได้รับความสงสารไม่ใช่ฉัน! แต่เป็นคุณครูผู้ไร้กำลังที่ถูกขังอยู่ในนั้นต่างหาก!!"
212130-145 = "[s11] \"การที่เธอคอยเร่งเร้าให้ครูเกลียดเธอน่ะ...\"\n[s12] \"เป็นเพราะเธอเองก็ให้อภัยตัวเองในตอนนี้ไม่ได้หรือเปล่า\""
