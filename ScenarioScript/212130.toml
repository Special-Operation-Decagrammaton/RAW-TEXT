[translation]
212130-1 = "ตอนที่ 13;กักขัง"
212130-3 = "[ns] \"ไม่ได้เข้าคุกมานานเลยนะ...\""
212130-4 = "(พอไม่อาจรับรู้ถึงสถานการณ์ภายนอกได้ คุณครูก็เลยยิ่งกังวล)"
212130-5 = ""
212130-14 = ""
212130-15 = "ครู..."
212130-16 = "[s] \"สวัสดี มาโคโตะ\""
212130-17 = "ได้โปรดเข้าใจด้วยว่าเราไม่มีทางเลือก นอกจากต้องควบคุมตัวครูไว้ในสถานที่แบบนี้..."
212130-18 = "อันที่จริง นี่ไม่ใช่ทิศทางที่เราต้องการหรอก"
212130-19 = "เพียงแต่มีความเห็นว่า การกระทำของครูอาจเป็นตัวแปรที่ใหญ่ที่สุดสำหรับพวกเรา..."
212130-20 = "เราเองก็เห็นด้วยกับความเห็นนั้น สุดท้ายถึงได้เลือกใช้วิธีนี้#nเพราะแม้แต่เราก็ยังไม่อาจคาดเดาความสามารถของครูได้"
212130-21 = "..."
212130-22 = "เราพอเดาได้ว่าทำไมครูถึงคัดค้านนโยบายของเกเฮนน่า"
212130-23 = "ครูเป็นคนที่เห็นว่า ไม่ว่าโรงเรียนไหนหรือนักเรียนคนใดก็ล้วนสำคัญ จึงย่อมต้องคัดค้านสงครามพิชิตที่มีพวกเขาเป็นเป้าหมาย"
212130-24 = ""
212130-26 = ""
212130-27 = "แต่ว่า ถ้าลองคิดแบบนี้ดูล่ะ จะเป็นยังไง?"
212130-28 = "ตอนนี้โรงเรียนต่างๆ ใช้เอกลักษณ์ของตัวเองเป็นอาวุธ และต่างฝ่ายต่างอ้างระเบียบในแบบของตน"
212130-29 = "ผลที่เกิดขึ้นคือความขัดแย้งไม่รู้จบ การเผชิญหน้าที่ไร้ความหมาย และการตัดสินใจอันไร้ประสิทธิภาพ#nจากความไม่ไว้วางใจ..."
212130-30 = "แต่ว่า!! ถ้านักเรียนทุกคนเดินสู่เป้าหมายเดียวกันภายใต้ธงของเกเฮนน่า เรื่องเหล่านั้นก็จะไม่เกิดขึ้นอีก"
212130-31 = "ถ้ารวบรวมความคิดและทรัพยากรที่กระจัดกระจายไว้ภายใต้ระเบียบที่มีการควบคุม คิโวทอสแห่งนี้#nจะพัฒนาไปไกลเกินกว่าจะเทียบกับปัจจุบันได้"
212130-32 = "เป็นยังไงล่ะ ครู? นี่คือหนทางที่เกเฮนน่ากับคิโวทอสจะยิ่งใหญ่ไปด้วยกันเลยนะ"
212130-33 = "[s] \"ครู...\""
212130-36 = "[ns1] \"ครูคิดว่าเกเฮนน่าเมื่อก่อนยอดเยี่ยมกว่าเกเฮนน่าแบบนั้น\"\n[ns2] \"เกเฮนน่าที่เป็นอิสระ แบบที่มาโคโตะเคยอยากสร้างน่ะ\""
212130-39 = "..."
212130-40 = ""
212130-44 = ""
212130-48 = "อึก...!!"
212130-49 = "[s] \"มาโคโตะ...?!\""
