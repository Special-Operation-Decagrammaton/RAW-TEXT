212130-92 = "3;쇼코;S2_15;선생님도 마찬가지고요."
212130-93 = "3;쇼코;S2_99;모두가 행복한 세상 따위는 있을 수 없습니다. 아시잖아요.\n#3;em;[한숨]"
212130-94 = "3;쇼코;S2_14;선생님은 학생들의 선의가 언젠가 답을 내놓을 거라 믿으시겠지만, 현실은 다릅니다."
