212130-102 = "3;쇼코;S2_99;……사치스러운 말씀입니다. 방종하는 개인이 그렇게 정답을 찾는 동안, 그 비효율의 피해자가 되는 이들이 있게 마련이죠.\n#3;em;…"
212130-103 = "3;쇼코;S2_00;선생님이 그 모든 눈물을 닦아줄 수 있을까요? 사람의 시간과 마음은 유한합니다."
212130-104 = "3;쇼코;S2_01;결국 선생님의 그 상냥함도 한계에 다다라 마모되고, 남겨진 아이들은 다시 무질서의 구렁텅이에 빠지게 될 겁니다."
212130-105 = "3;쇼코;S2_99;아무리 선생님이라 해도 모두를 구할 수는 없으니까요."
