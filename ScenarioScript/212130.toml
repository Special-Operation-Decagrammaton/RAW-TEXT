[translation]
212130-1 = "第13話;監禁"
212130-3 = "[ns] 「好久沒進監獄了呢……」"
212130-4 = "（無從得知外面的情況，讓不安越發擴大）"
212130-5 = ""
212130-14 = ""
212130-15 = "……老師啊。"
212130-16 = "[s] 「嗨，真琴。」"
212130-17 = "只能在這種地方確保老師的人身安全，還請你多多諒解。"
212130-18 = "其實我所期望的，也不是這種方式。"
212130-19 = "只是有意見認為，老師的行動恐怕會成為我們最大的變數……"
212130-20 = "我也同意這一點，所以最終才選擇了這種方式。#n畢竟老師的能力連我都無法預測。"
212130-21 = "……"
212130-22 = "為什麼老師會反對格黑娜的方針，我大概猜得到。"
212130-23 = "老師是個無論哪所學園、哪位學生都同樣珍惜的人。#n所以理所當然會反對以他們為對象的征服戰爭吧。"
212130-24 = ""
212130-26 = ""
212130-27 = "但是，何不這樣想想看？"
212130-28 = "現在各個學園都以彼此的個性為武器，各自主張著自己的秩序。"
212130-29 = "因此而起的無止境紛爭、毫無意義的對立、因不信任而做出的低效率決定……"
212130-30 = "但是！！只要所有學生都在格黑娜的旗幟下朝著同一個目標前進──#n那樣的事情就不會再發生了。"
212130-31 = "只要在受控的秩序下集結零散的想法與資源，#n這個奇普托斯就能達成現在無法比擬的發展吧。"
212130-32 = "老師你怎麼看？#n這是格黑娜與奇普托斯能夠一同變得偉大的道路啊。"
212130-33 = "[s] 「我……」"
212130-36 = "[ns1] 「我覺得以前的格黑娜比那樣的格黑娜更棒。」\n[ns2] 「就是真琴想打造的，那個自由的格黑娜。」"
212130-39 = "……"
212130-40 = ""
212130-44 = ""
212130-48 = "唔……！！"
212130-49 = "[s] 「真琴……！？」"
212130-50 = ""
212130-55 = ""
212130-56 = ""
212130-57 = "呼……"
212130-58 = "是嗎。老師是這麼想的啊。"
212130-59 = "嘰嘻嘻……我明白了。#n那麼，今天我就先回去了。"
212130-60 = "不過老師應該也知道我的長處吧。"
212130-61 = "我啊，可是相當執著的。"
212130-62 = ""
212130-65 = "[ns] 「……再見，真琴。」"
212130-66 = "……你待在這裡的期間，我會安排好讓你什麼都不缺的。"
212130-67 = ""
212130-69 = ""
212130-70 = "[ns] 「……」"
212130-71 = ""
212130-76 = ""
212130-77 = "老師。"
212130-78 = "[s3] 「嗨，翔子。」\n[s4] 「我今天還真受歡迎呢。」"
212130-81 = "呵呵……您還是老樣子呢。"
212130-82 = "剛才老師的話，我都聽到了。"
212130-83 = "真琴議長似乎打算說服老師，但我的想法有點不同。"
212130-84 = "就我所知，老師的思考模式向來都很一致。"
212130-85 = "為了學生，為了更多的學生。"
212130-86 = "和平地、慈悲地，朝著讓大家都幸福的方向。"
212130-87 = "……"
212130-88 = "[s] 「……」"
212130-89 = "所以說，那樣的老師根本不可能贊同格黑娜的征服戰爭。"
212130-90 = "真是的，無論真琴議長還是陽奈風紀委員長都是這樣。#n我現在總算明白，為什麼他們兩位一直都表現得那麼拖拖拉拉的了。"
212130-91 = "大家都太天真了。#n實在太過天真了。"
212130-92 = "老師也一樣。"
212130-93 = "讓所有人都幸福的世界根本不可能存在。#n您也很清楚吧。"
212130-94 = "老師或許相信學生們的善意總有一天會給出答案，但現實並非如此。"
212130-95 = "不受控制的個人聚集在一起時產生的能量，大部分都只會白白浪費掉。#n極其，極其沒有效率。"
212130-96 = "[s] 「我認為那樣的沒效率，也是學生們自己尋找正確答案的過程。」"
212130-99 = "[ns] 「就像翔子說的，要打造讓所有人都幸福的世界或許很難。」"
212130-101 = "[ns] 「正因如此，才需要不斷地努力。」"
212130-102 = "這話未免太奢侈了。#n在放縱的個人如此尋找答案的期間，必然會有人成為那份沒效率的受害者。"
212130-103 = "老師能擦乾所有人的眼淚嗎？#n人的時間與心力都是有限的。"
212130-104 = "最終老師的那份溫柔也會到達極限而被消磨殆盡，#n被留下來的孩子們將再次墜入無秩序的深淵。"
212130-105 = "就算是老師，也是不可能拯救所有人的。"
212130-106 = "[s] 「…………」"
212130-107 = "就這層意義來說，以壓迫進行的控制反而能帶來更多的公共利益。"
212130-108 = ""
212130-110 = "一旦格黑娜征服奇普托斯、建立起單一的秩序──真正的和平就會開始。"
212130-111 = "老師也會明白的。#n由強大力量統治的社會，遠比半吊子的自由好得多。"
212130-112 = ""
212130-114 = "[ns] 「翔子曾經跟我說過自己想成為什麼樣的人吧。」"
212130-115 = ""
212130-117 = ""
212130-118 = "[ns5] 「能毫不猶豫地做出正確的決定……」\n[ns6] 「毫不懷疑地向前邁進的人。」"
212130-121 = "是這樣沒錯。"
212130-122 = "您為什麼現在要提起那件事？"
212130-123 = ""
212130-127 = "[ns7] 「那句話會不會是……」\n[ns8] 「源自於無法相信自己的心情呢？」"
212130-130 = "……！"
212130-131 = "[s] 「翔子，你是不是害怕做出錯誤的選擇？」"
212130-132 = "……"
212130-133 = "為什麼？您為什麼要在這種時候說那種話？"
212130-134 = "老師，您現在可是被關起來了。#n這裡可是監獄啊。"
212130-135 = "把老師關起來的人就是我啊。"
212130-136 = "是我去跟真琴議長和風紀委員長進言，要把老師關起來的啊。"
212130-137 = "[s] 「我知道。」"
212130-138 = "那您應該要恨我才對吧……？#n應該要怨我才對啊。"
212130-139 = "可是您為什麼要……用那種眼神看著我呢？"
212130-140 = "[s9] 「憎恨是件非常容易的事。」\n[s10] 「而那不是老師該做的事。」"
212130-143 = "真是豈有此理……！！怨恨與詛咒才是人類的本性！#n那才是這個混亂又醜惡的世界的真相啊！！"
212130-144 = "該被同情的不是我！#n而是被關在裡面、無能為力的老師才對啊！！"
212130-145 = "[s11] 「你之所以期望我去恨你……」\n[s12] 「會不會是因為你自己無法原諒現在的自己呢？」"
212130-146 = ""
212130-147 = ""
212130-149 = ""
212130-150 = "……！！"
212130-151 = ""
212130-153 = ""
212130-154 = "爛透了。老師是最差勁的老師。"
212130-155 = ""
212130-157 = ""
212130-159 = "請您再也不要用那種眼神看著我。"
212130-160 = ""
212130-166 = "[ns] 「……」"
212130-169 = "下一話;叛徒們"
