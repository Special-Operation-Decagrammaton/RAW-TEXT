212130-27 = "3;마코토;00;허나, 이렇게 생각해 보는 것은 어떻겠는가?\n#3;em;[?]"
212130-28 = "3;마코토;01;현재는 다양한 학원들이 서로의 개성을 무기 삼아 제각각의 질서를 주장하지."
212130-29 = "3;마코토;99;그로 인해 발생하는 끊이지 않는 분쟁, 무의미한 대립, 불신으로 인한 비효율적인 결정……"
212130-30 = "3;마코토;10;허나!! 모든 학생이 게헨나의 깃발 아래 같은 목표를 향해 걷는다면, 더 이상 그런 일들은 일어나지 않을 것이다.\n#3;em;[!]"
212130-31 = "3;마코토;23;통제된 질서 아래 파편화된 생각과 자원을 모은다면, 이 키보토스는 지금과는 비교할 수 없는 발전을 이룰 수 있겠지.\n#3;m3"
212130-32 = "3;마코토;03;어떤가, 선생이여? 게헨나와 키보토스가 함께 위대해질 수 있는 길이다."
