212130-65 = "[ns] \"ไว้เจอกันใหม่นะ มาโคโตะ...\""
212130-66 = "ระหว่างที่อยู่ที่นี่ เราจะคอยจัดการไม่ให้ครูขาดเหลืออะไรให้เอง"
212130-67 = ""
212130-69 = ""
212130-70 = "[ns] \"...\""
