[translation]
212130-1 = "Episode 13;Confinement"
212130-3 = "[ns] \"I haven't been locked up in a while...\""
212130-4 = "I was cut off from the outside world. Dread and anxiety built inside me."
212130-5 = ""
212130-14 = ""
212130-15 = "...Sensei."
212130-16 = "[s] \"Hi, Makoto.\""
212130-17 = "...I hope you understand that this \"secure fortress\" is here to ensure your safety."
212130-18 = "Frankly, this is not what I wanted."
212130-19 = "However, several voices asserted that you had become an unpredictable variable for us..."
212130-20 = "I agree with them. After all, your capabilities have proven to exceed my imagination."
212130-21 = "..."
212130-22 = "I am somewhat aware of why you are opposed to Gehenna's policies."
212130-23 = "You are sentimental, bursting with wanderlust. You cherish every academy and student. Naturally, you would be opposed to them seeing conflict."
212130-24 = ""
212130-26 = ""
212130-27 = "But what if you shifted your perspective?"
212130-28 = "Right now, the various schools claim their own definition of order."
212130-29 = "That causes endless conflicts, meaningless confrontations, and inefficient decisions, all born from mistrust..."
212130-30 = "However! If all students walk in line, toward the same goal under Gehenna's glorious flag, such strife and angst shall be eliminated."
212130-31 = "If we could repurpose all those fragmented thoughts and resources, putting them to purposeful order, Kivotos would become unstoppable."
212130-32 = "What do you say, Sensei? With this, Kivotos and Gehenna could be glorious together. As one."
212130-33 = "[s] \"I...\""
212130-36 = "[ns1] \"...liked the previous Gehenna more.\"\n[ns2] \"The free Gehenna that you wanted to create, Makoto.\""
212130-39 = "..."
212130-40 = ""
212130-44 = ""
212130-48 = "Ugh...!"
212130-49 = "[s] \"Makoto...?!\""
212130-50 = ""
212130-55 = ""
212130-56 = ""
212130-57 = "*sigh*"
212130-58 = "I see. So that is your answer."
212130-59 = "Kihehe... Very well. Then I shall retire for the evening."
212130-60 = "But you should already know my greatest strength, Sensei."
212130-61 = "I am quite persistent."
212130-62 = ""
212130-65 = "[ns] \"...I'll see you again, Makoto.\""
212130-66 = "...I will ensure you are treated well. Make yourself at home."
212130-67 = ""
212130-69 = ""
212130-70 = "[ns] \"...\""
212130-71 = ""
212130-76 = ""
212130-77 = "Sensei."
212130-78 = "[s3] \"Hi, Shouko.\"\n[s4] \"Looks like I'm pretty popular today.\""
212130-81 = "Fufu... You're the same as always."
212130-82 = "Just know that I received your message loud and clear."
212130-83 = "While Chairman Makoto is trying to persuade you, I see things a bit more clearly."
212130-84 = "From what I've observed, your thought patterns have proven consistent."
212130-85 = "Working for the students. Working even harder for the students."
212130-86 = "All in some nebulous, imagined direction where all is peaceful, merciful, and everyone's happy."
212130-87 = "..."
212130-88 = "[s] \"...\""
212130-89 = "Which is why you would never condone Gehenna's war of conquest."
212130-90 = "Now I finally understand why Chairman Makoto and Head Prefect Hina squabbled for so long."
212130-91 = "They're all soft. Too soft."
212130-92 = "As are you, Sensei."
212130-93 = "You know that you can't have a world where everyone is happy."
212130-94 = "You believe that the alleged goodwill of all students will eventually yield a happy harmony, but the reality of the world is quite different."
212130-95 = "The energy generated by the undisciplined rabble is mostly wasted. It's hot air. And that is extremely, EXTREMELY inefficient."
212130-96 = "[s] \"Inefficiency is how students find their own answers.\""
212130-99 = "[ns] \"You said that you can't have a world where everyone is happy.\""
212130-101 = "[ns] \"But it's worth the endless effort.\""
212130-102 = "...Spoken with true privilege. And while those wandering individuals inefficiently search for answers, others will suffer the consequences."
212130-103 = "Sensei, do you think you can wipe the tears of every sad student? You have finite time and limited mental capacity."
212130-104 = "That \"kindness\" of yours will reach its limit and erode. The children left behind will fall into the chaotic abyss."
212130-105 = "Not even YOU can save everyone, Sensei."
212130-106 = "[s] \"...\""
212130-107 = "In that sense, control via suppression provides a greater public benefit."
212130-108 = ""
212130-110 = "When Gehenna conquers Kivotos and establishes order, true peace shall begin."
212130-111 = "Then you will realize that a society ruled by absolute control is far better than one of flimsy freedom."
212130-112 = ""
212130-114 = "[ns] \"Shouko, you talked about the person who you wanted to be before.\""
212130-115 = ""
212130-117 = ""
212130-118 = "[ns5] \"One who acts without hesitation...\"\n[ns6] \"...and walks without a shred of doubt.\""
212130-121 = "...I did."
212130-122 = "Why are you bringing this up?"
212130-123 = ""
212130-127 = "[ns7] \"Could it be that...\"\n[ns8] \"those words came from your lack of trust in yourself?\""
212130-130 = "...!"
212130-131 = "[s] \"Shouko, are you afraid of making the wrong choices?\""
212130-132 = "..."
212130-133 = "Why? Why are you asking this right now?"
212130-134 = "Sensei, you're incarcerated. You're in a prison. Locked. Up."
212130-135 = "And I put you behind these bars."
212130-136 = "I'm the one who told Chairman Makoto and Head Prefect Hina to hold you here."
212130-137 = "[s] \"I know.\""
212130-138 = "Then shouldn't you hate me...? You should resent me with every fiber."
212130-139 = "...So why...are you looking at me like that?"
212130-140 = "[s9] \"It's very easy to hate.\"\n[s10] \"But that's not what a teacher should do.\""
212130-143 = "Dummkopf...!!! Resentment is human nature! Hate is all we have in common. That's the truth of this chaotic and wretched world!!!"
212130-144 = "Don't you dare. I don't require your pity. You're the one who needs it, powerless, helplessly trapped here!!!"
212130-145 = "[s11] \"...Do you want me to hate you...\"\n[s12] \"...because you cannot forgive who you've become?\""
212130-146 = ""
212130-147 = ""
212130-149 = ""
212130-150 = "...!!!"
212130-151 = ""
212130-153 = ""
212130-154 = "...You're the worst, Sensei. You are an absolutely loathsome excuse for a teacher."
212130-155 = ""
212130-157 = ""
212130-159 = "Never look at me like that again."
212130-160 = ""
212130-166 = "[ns] \"...\""
212130-169 = "Next Episode;Traitors"
