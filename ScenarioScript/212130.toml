212130-57 = "ฮู่ว..."
212130-58 = "งั้นเหรอ? นั่นคือความคิดของครูสินะ"
212130-59 = "คิกคิกคิก... เข้าใจแล้ว ถ้างั้นวันนี้เราขอตัวกลับก่อนแล้วกัน"
212130-60 = "แต่ครูก็รู้จุดแข็งของเราใช่มั้ย"
212130-61 = "เราน่ะ ไม่ยอมเลิกราง่ายๆ หรอก"
