212130-17 = "3;마코토;99;……이런 곳에 선생의 신변을 확보할 수밖에 없었음을 부디 양해바라지.\n#3;em;[한숨]"
212130-18 = "3;마코토;02;기실, 내가 바라는 것도 이런 방향은 아니었다."
212130-19 = "3;마코토;01;다만 선생의 행동은 우리에게 있어 가장 큰 변수로 작용할 우려가 있다는 의견이 있었고……"
212130-20 = "3;마코토;00;나 또한 그것에 동의하기에 결국 이런 방식을 택하고 말았지.#n선생의 능력은 나조차도 예측할 수 없을 정도이기에.\n#3;em;…"
212130-21 = "3;마코토;99;……."
212130-22 = "3;마코토;01;어째서 선생이 게헨나의 방침에 반대하는지는 어느 정도 짐작하고 있다.\n#3;em;[반응]"
212130-23 = "3;마코토;02;선생은 어떤 학원일지라도, 어떤 학생일지라도 소중히 생각하는 인물이니, 당연히 그들을 대상으로 한 정복 전쟁에는 반대할 수밖에 없겠지."
