[translation]
10051110-1 = "에필로그;다시 제자리로"
10051110-2 = "(다음 날)"
10051110-4 = "샤인캣의 사무실"
10051110-5 = "어제는 고마웠네."
10051110-6 = "쇼는 망했지만…… 뭐 그게 자네 탓도 아니고."
10051110-7 = "오히려 자네들과 샬레의 선생 덕에 피해가 최소화됐지."
10051110-8 = "아무튼 그래서, 다시 인법연구부로 돌아가고 싶다고?"
10051110-9 = "……예."
10051110-10 = "음."
10051110-11 = "그래, 그렇다면 그게 맞는 거지. 자신의 길은, 자신이 결정해야 하는 것이니까."
10051110-12 = "……나도 그랬었고."
10051110-16 = "잡담이 길었군. 이제 남은 업무적인 사안을 마무리해야지."
10051110-17 = "자네가 찢어먹은 내 드레스, 어떻게 할 생각이지?"
10051110-18 = "그, 그건……!"
10051110-19 = "푸하하! 농담이야."
10051110-20 = "자, 받아."
10051110-21 = "상자……?"
10051110-25 = "이, 이건……!"
10051110-26 = "그래, 네가 찢은 드레스다. 내가 어제 밤새 수선해서 고쳐 놨지."
10051110-28 = "선물이다."
10051110-29 = "……!"
10051110-30 = "오해 마라. 새해 초부터 내 사무실에 온 객을 빈손으로 보낼 수는 없으니까 그런 거다."
10051110-31 = "새해 복, 많이 받아라."
10051110-32 = "그, 그런……!"
10051110-33 = "이제 나가 봐. 나 바빠."
10051110-38 = "……감사합니다! 새해 복 많이 받으세요!"
10051110-40 = "샤인캣의 사무실 정문"
10051110-42 = "늦네, 츠쿠요……."
10051110-43 = "[s] \"저기, 들어간 지 5분도 안 됐는데…….\""
10051110-44 = "주, 중요한 건 마음이지!"
10051110-48 = "부장! 주군! 츠쿠요가 나옵니다!"
10051110-49 = "츠쿠요!"
10051110-54 = "부, 부장님! 이즈나 쨩! 그리고…… 선생님?!"
10051110-55 = "[s] \"결정은 잘 내렸어, 츠쿠요?\""
10051110-56 = "예! 저……."
10051110-57 = "저는 역시…… 인법연구부가 좋아요!"
10051110-58 = "예에에에!"
10051110-59 = "다시 한번 환영합니다! 츠쿠요 공!!"
10051110-60 = "저기 그런데, 왜 카메라가……?"
10051110-61 = "[s] \"동료가 돌아왔으니, 세상에 알려야지!\""
10051110-62 = "엣……?!"
10051110-63 = "이번에는 카메라도 확실하게 제대로 설치해 놨다고!"
10051110-64 = "다 촬영하고 나면 함께 라멘도 먹으러 가고요! 닌닌!"
10051110-65 = "라멘……!"
10051110-70 = "자, 그럼 지금부터 <소녀인법첩 미치룻치>!"
10051110-78 = "시작합니다!"
10051110-82 = "불인의 길 ~패션쇼 경호 임무!의 서~"
