[translation]
2002303-1 = "그 국장의 업무"
2002303-6 = "이번 잠복 수사의 용의자는 주차된 경비국의 순찰 차량을 뒤져 내부에 있던 현금과 보안 문서를 훔쳐 달아났다는 혐의를 받고 있다."
2002303-7 = "도둑맞은 현금과 보안 문서 자체는 그리 대단한 물건이 아니지만……"
2002303-8 = "일개 좀도둑이 경비국의 차량을 대놓고 뒤졌다는 사실이 세간에 알려진다면 우리 발키리 경찰학교의 위신이 땅에 떨어지게 되겠지."
2002303-9 = "겨우 이런 일로 공안국의 인력이 투입될 줄은 몰랐지만……"
2002303-10 = "이 사건은 시민들의 신뢰와 직결되는 중대한 문제이므로, 보안 문서와 범행 경위가 유출되기 전에 녀석을 반드시 검거해야 한다."
2002303-11 = "공안국의 내부 첩보에 따르면 녀석은 이 주변, 스나오마치 거리 일대에 거점을 두고 신분을 위장한 채 활동 중이라고 한다."
2002303-12 = "용의자의 인상착의는 짧은 수염에 접힌 귀를 가지고 있으며, 눈가에 큰 흉터가 있는 삼색 고양이……"
2002303-20 = "[USERNAME] 선생님……?"
2002303-21 = "알아차리는 게 늦었습니다. 여기는 무슨 일로 오셨습니까?"
2002303-22 = "[s1] \"칸나가 잠복근무를 한다고 해서.\"\n[s2] \"응원하러 왔어!\""
2002303-25 = "……마음은 감사합니다만."
2002303-26 = "잠복근무는 응원이 필요한 업무가 아닙니다. 날이 늦었으니 오늘은 이만 돌아가 주시지요."
2002303-27 = "[s] \"혹시…… 내가 있으면 방해돼?\""
2002303-28 = "방해되는 건 아닙니다만……"
2002303-29 = "용의자가 언제 나타날지 확신할 수 없는 잠복근무에 공사가 다망하신 선생님을 끌어들이는 것도 죄송하니까요."
2002303-30 = "혹 늦은 시간까지 제 업무를 도와주시느라 컨디션을 해치지는 않으실지 걱정이 됩니다."
2002303-31 = "[ns] \"피곤하면 돌아갈 테니 걱정하지 마.\""
2002303-33 = "[ns3] \"그리고 감시하는 눈은 많으면 많을수록 좋잖아?\"\n[ns4] \"수상한 사람이 지나가지 않는지 함께 지켜볼게.\""
2002303-36 = "……그렇게 말씀하시니 어쩔 수 없겠군요."
2002303-37 = "그럼 무리하시지 않는 선에서 부탁드리겠습니다."
2002303-39 = "현재 시각 오전 00시 30분. 시계는 양호. 주변을 배회하는 거동 수상자는 보고되지 않음."
2002303-40 = "경계 태세를 유지한 채 현 위치에 대기……"
2002303-47 = "[ns] \"……미안. 아직 저녁을 먹지 못해서……\""
2002303-48 = "아닙니다. 그러고 보니 저도 잠복근무를 하느라 저녁은 잊고 있었군요."
2002303-49 = "선생님, 시장하시면 주변의 편의점에서 식사라도 하고 오시는 게 어떠신지요?"
2002303-50 = "아니면 밤이 깊었으니 이만 샬레로 돌아가셔도 괜찮습니다만—"
2002303-51 = "[s] \"칸나는 괜찮아?\""
2002303-52 = "저는 본래 잠복근무 중에는 식사를 거의 하지 않는 편입니다."
2002303-53 = "잠복근무 중에 부식비가 제공되긴 하지만, 식사 때문에 감시를 소홀히 할 수는 없으니까요."
2002303-54 = "기껏해야 가끔씩 잠을 깨우기 위해 진하게 탄 블랙커피를 한두 잔 마실 뿐입니다."
2002303-55 = "그러니 저는 신경 쓰지 마시고 이만 쉬러 가셔도 괜찮습니다."
2002303-56 = "[s] \"그럼 다녀올게.\""
2002303-57 = "네, 부디."
2002303-66 = "……생각보다 일찍 돌아오셨군요."
2002303-67 = "내일도 샬레의 일로 바쁘실 텐데, 어째서 이렇게까지……"
2002303-68 = "그보다…… 손의 그 봉지는?"
2002303-69 = "[s5] \"칸나와 함께 먹으려고 사 왔어.\"\n[s6] \"단팥빵과 우유야!\""
2002303-72 = "후훗…… 단팥빵입니까."
2002303-73 = "경찰의 잠복근무라고 하면 바로 떠오르는 물건이긴 합니다만……"
2002303-74 = "저는 괜찮습니다. 선생님 혼자 드시지요."
2002303-75 = "[s7] \"어째서?!\"\n[s8] \"단팥빵 싫어해?\""
2002303-78 = "그게…… 기호의 문제는 아닙니다."
2002303-79 = "다만 안 그래도 늦은 시간인데, 식사를 해서 배가 차면 졸음이 오기 쉬우니까요."
2002303-80 = "발키리 경찰학교의 학생이 식곤증으로 인한 졸음 때문에 범인을 놓치기라도 한다면 온 키보토스의 웃음거리가 될 겁니다."
2002303-81 = "그러니 호의는 감사합니다만, 지금은 사양하겠습니다."
2002303-87 = "(이후, 여러 가지 음식을 칸나에게 권해보았지만……)"
2002303-89 = "선생님? 이번에야말로 돌아가신 줄 알았습니다만……"
2002303-90 = "도넛을 사 오셨다고요? 제가 배고플까 봐……?"
2002303-91 = "아까도 말씀 드렸을 텐데요. 저는 잠복근무 중에는 식사를 거의 하지 않는다고."
2002303-92 = "죄송합니다만, 이번에도 거절하겠습니다."
2002303-94 = "이 냄새는…… 또 무언가를 사 오셨습니까?"
2002303-95 = "……햄버거? 어째서……?"
2002303-96 = "전에 영화에서 형사들이 잠복근무 중에 햄버거를 먹는 장면을 보셨다고요?"
2002303-97 = "영화는 영화일 뿐입니다. 게다가 아까도 말씀 드렸지만 저는—"
2002303-98 = "……그보다 이제 슬슬 그만둬 주시지 않겠습니까? 용의자가 이쪽의 수상한 낌새를 알아채고 도망치기라도 하면 곤란하니까요."
2002303-100 = "……이건?"
2002303-101 = "[s9] \"야키소바야!\"\n[s10] \"잠복 근무중에는 역시 면 요리지!\""
2002303-108 = "범죄자를 추적하는 긴박한 업무 중에……"
2002303-109 = "이렇게 기름지고 향이 강한 요리를 먹을 수 있을 리가 없잖습니까!"
2002303-111 = "(하나같이 모두 거절당하고 말았다…….)"
2002303-113 = "선생님. 어째서 아까 전부터 계속 저를 방해하시는 겁니까?"
2002303-114 = "계속해서 식사를 권하며 제 잠복근무를 방해하신다면……"
2002303-115 = "업무방해죄로 선생님을 체포하겠습니다!"
2002303-116 = "[s11] \"바, 방해하려 했던 게 아니야!\"\n[s12] \"그저 일 때문에 식사는 거르지 않았으면 해서……\""
2002303-119 = "식사를 한 끼 거른다고 해서 큰 문제가 생기는 건 아닙니다."
2002303-120 = "물론 규칙적인 식사가 건강 유지에 도움이 된다는 사실은 알고 있지만, 모든 일에는 우선순위가 존재하는 법이니까요."
2002303-121 = "경찰에게 있어 범인의 체포보다 더 중요한 일은 없습니다."
2002303-122 = "[s] \"범인의 체포보다 칸나의 건강이 더 중요해.\""
2002303-123 = "……진심이십니까?"
2002303-124 = "[s13] \"체력이 약해지면 범인도 잡을 수 없잖아?\"\n[s14] \"그러니까 식사가 먼저야.\""
2002303-127 = "하아……"
2002303-128 = "알겠습니다. 그럼 단팥빵 하나만 받도록 하지요."
2002303-129 = "정말 여러모로 성가신 선생님이야……"
2002303-130 = "그러고보니 이 음식들은 어디서 가져오신 겁니까?"
2002303-131 = "포장 용기나 봉투의 디자인을 보아하니, 근처의 편의점에서 사 온 것 같지는 않고. 음식점에서 직접 포장해 오신 것 같은데……"
2002303-132 = "이 주변의 가게는 이 시간이면 모두 문을 닫았을 텐데요."
2002303-133 = "[s] \"이 앞의 포장마차에서 팔고 있었어.\""
2002303-134 = "인적이 드문 이런 심야의 주택가에 포장마차가 있었다고요?"
2002303-135 = "설마 혹시……"
2002303-136 = "선생님, 혹시 포장마차 점원의 인상착의를 기억하고 계십니까?"
2002303-137 = "[s] \"접힌 귀에 눈에 상처가 있는 삼색 고양이였는데……\""
2002303-142 = "그 녀석인가!"
2002303-143 = "선생님, 그 포장마차가 있는 곳까지 바로 안내를 부탁드립니다!"
2002303-147 = "(이후, 칸나는 포장마차에서 신분을 속인 채 위장 중이던 범인을 발견해 바로 체포했다.)"
2002303-148 = "(다만 작전이 끝난 뒤에도 칸나는 좀처럼 음식을 받으려 하지 않아서……)"
2002303-149 = "(구입한 대량의 음식은 다른 경찰학교 학생들과 나누어 먹었다.)"
