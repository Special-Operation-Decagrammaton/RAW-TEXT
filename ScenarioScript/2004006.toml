[translation]
2004006-1 = "사츠키는 참고 있다."
2004006-2 = "(사츠키의 연락을 받고 서둘러 만마전을 찾았다.)"
2004006-9 = "샬레의 선생님, 안녕하십니까. 이곳에는 어쩐 일로……"
2004006-13 = "아, 사츠키 의원이라면……"
2004006-14 = "그, 그게……"
2004006-15 = "[s] \"무슨 일이 있는 거야?\""
2004006-16 = "그, 일이라면 일이긴 합니다만……"
2004006-20 = "[ns] \"그러니까……\""
2004006-22 = "[ns] \"예방접종 주사가 싫어서 방문을 닫고 숨어있다고?\""
2004006-23 = "예에…… 그, 종종 있는 일입니다만……"
2004006-28 = "사츠키 의원! 사츠키 의원!"
2004006-29 = "이제 만마전에서는 사츠키 의원만 남았다구요!"
2004006-30 = "안 아프게 금방 끝낼 테니까 빨리 나와보세요!! 거참!!"
2004006-31 = "거짓말하지 마! 안 아픈 주사가 어디 있어? 나는 괜찮으니까 이제 가!"
2004006-32 = "아니, 이 예방 주사는 게헨나 학생이라면 모두 맞아야 한다니까요?"
2004006-33 = "나중에 콧물 질질 흘리면서 일주일 내내 앓아누워야 속이 시원하겠어요?"
2004006-34 = "그런 거 안 걸릴걸? 나는 감기에 걸려본 적이 없어!"
2004006-35 = "그건 당신이……"
2004006-36 = "아, 아니! 여튼 그런 문제가 아니라고요!"
2004006-42 = "보시다시피…… 이런 상황입니다."
2004006-43 = "[s] \"고생이 많네……\""
2004006-46 = "[ns] \"저기, 내가 한번 이야기해 봐도 괜찮을까?\""
2004006-47 = "아, 선생님."
2004006-48 = "예. 제 이야기는 도무지 듣질 않아서……"
2004006-49 = "그럼 부탁드리겠습니다."
2004006-54 = "[ns] \"사츠키. 나야.\""
2004006-56 = "……선생? 정말 선생이야?"
2004006-57 = "아니지. 선생이 이곳에 있을 이유가 없잖아?"
2004006-58 = "후후, 성대모사가 제법이네. 이런 식으로 속임수를 써봤자 소용없어. 나는 심리에 통달한 만마전의 정보부장……"
2004006-59 = "[s] \"사츠키, 진짜 나야. 문 좀 열어줄래?\""
2004006-60 = "……"
2004006-61 = "정말 선생인 거야?"
2004006-66 = "정말 선생이잖아? 이곳까지는 무슨 일로……"
2004006-67 = "아, 모모톡을 보고?"
2004006-68 = "후후, 나의 긴급 구조 요청을 정확하게 간파했네."
2004006-69 = "본 그대로야. 지금 나는 분기별로 들이닥치는 미증유의 위기에 처한 상태……"
2004006-70 = "자, 어서 나를 데리고 이곳에서 탈출하도록."
2004006-71 = "[s] \"주사 맞기 싫어서 이러는 거야?\""
2004006-72 = "응, 싫어!! 엄청나게 싫어!!"
2004006-73 = "아픈 건 싫으니까! 특히 주사는 최악 중의 최악이야!!"
2004006-74 = "가늘고 날카로운 바늘이 내 얇고 가녀린 피부를 거침없이 뚫고 들어오는 그 감각……"
2004006-75 = "실린더를 눌렀을 때, 정체를 알 수 없는 약물이 나의 혈관 속으로 침투하는 그 참을 수 없는 통증과 압력……"
2004006-76 = "[s1] \"그렇게 표현하니까 진짜 아파 보이긴 하지만!!\"\n[s2] \"금방 끝나잖아? 조금 참아보는 건 어때?\""
2004006-79 = "선생…… 그렇게 쉽게 이야기할 일이 아니야."
2004006-80 = "선생이라면 그 고통을 참을 수 있어?"
2004006-81 = "육체적 고통뿐만이 아니야. 심리적으로 주삿바늘이 가까워져 올 때의 그 공포감을 견딜 수 있겠어?"
2004006-82 = "차가운 알코올 솜으로 환부를 미리 문지를 때, 곧 다가올 내 삶의 종언과 고통을 선고하는 듯한 그 소름 돋는 느낌을 참아낼 수 있겠냐고!"
2004006-83 = "[s3] \"만마전은 사츠키가 마지막이라며?\"\n[s4] \"사츠키만 빼고 다들 맞은 거 아냐? 이부키도.\""
2004006-86 = "큭, 그렇긴 하지만……"
2004006-90 = "뭐야, 그 표정은?"
2004006-91 = "어쨌든 나는 싫어! 학생으로서 정당한 거부권을 행사하겠어."
2004006-92 = "그런 거 없거든요?"
2004006-93 = "그 장부에 나도 접종 완료라고 기록하면 되잖아? 그럼 누구도 상처받지 않고 끝나는 거 아냐?"
2004006-94 = "말이 되냐고요!! 그건 완전히 허위잖아요!!"
2004006-95 = "[s] \"저기, 혹시 그 예방접종 주사…… 여분이 있을까?\""
2004006-96 = "아, 네. 몇 개 있긴 한데……"
2004006-97 = "[s] \"그럼 사츠키, 나랑 같이 맞는 건 어때?\""
2004006-98 = "으응……?"
2004006-99 = "[s] \"참는 데에 도움이 되지 않을까 해서.\""
2004006-100 = "선생…… 주사가 무섭지도 않아? 엄청나게 아프다고?"
2004006-101 = "[s5] \"뭐…… 아프기야 하겠지……\"\n[s6] \"그래도 둘이 동시에 같이 맞으면 좀 덜 무섭지 않을까?\""
2004006-104 = "이렇게까지 하시는데, 저 같으면 그냥 맞고 말겠습니다."
2004006-105 = "조용히 해! 생각 중이니까……"
2004006-106 = "……"
2004006-107 = "……동시에?"
2004006-108 = "[s] \"응. 동시에.\""
2004006-110 = "……크윽……"
2004006-112 = "알겠어."
2004006-113 = "예방접종, 맞을 테니까……"
2004006-114 = "[s] \"응, 잘 생각했어!\""
2004006-118 = "(사츠키는 내내 부들거렸지만, 어떻게든 끝까지 마무리할 수 있었다……)"
