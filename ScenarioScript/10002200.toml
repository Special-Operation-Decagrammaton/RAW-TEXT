[translation]
10002200-1 = "후일담;밀레니엄 60 폭죽"
10002200-3 = "아, 안녕하세요. 밀레니엄 60 폭탄입니다. 밀레니엄 사이언스 스쿨 제입니다."
10002200-4 = "이, 일단은 네이팜 탄이에요! 키, 키는 23cm고 몸무게는 44kg입니다."
10002200-5 = "……나이는 비밀이에요."
10002200-6 = "아하하……. 왜 바다의 집 매점에 네이팜 탄 같은 게 있나 싶으시죠?"
10002200-7 = "그……. 원래는 폐건물 철거용으로 태어났는데, 그 일을 다른 중장비가 맡게 돼서 일거리가 없어져 버렸거든요."
10002200-8 = "이후로도 학교 내에선 제가 나설 일이 없어졌기 때문에, 이리저리 자리를 옮기다……. 결국 여기까지 오게 됐습니다."
10002200-9 = "……네. 벌써 여기 온 지도 꽤 오래 됐네요."
10002200-10 = "이 곳 바다는 예쁘고, 바람은 시원합니다. 아주 좋은 곳이에요."
10002200-11 = "물론 저에게 어울리는 곳은 아닌 것 같지만요. 가게에 온 뒤로도 계속 먼지만 쌓여가고 있답니다."
10002200-12 = "다른 아이들……. 특히 저기 폭죽 친구들은 하루가 멀다 하고 사람들이 데려가는데 말이에요."
10002200-13 = "자기가 할 일을 완수하며 모두에게 즐거운 추억을 주는 모습을 보고 있으면, 멋지기도 하고 부럽기도 합니다."
10002200-14 = "저도 이런 모습이 아니라 폭죽으로 태어났다면, 사람들을 즐겁게 할 수 있었을까요?"
10002200-15 = "그렇게 생각하면 조금, 아주 조금은 저에게도 바라는 것이 생기려고 합니다."
10002200-16 = "그것은……."
10002200-17 = "아저씨!! 여기 폭죽! 폭죽 더 내놔!!"
10002200-18 = "……? 어라, 손님들이네요."
10002200-23 = "아니. 인정할 수 없다. 이것들은 우리 측에서 먼저 선택했어. 무단으로 탈취하려 한다면 물리적 충돌도 불사할 것."
10002200-24 = "이, 이런 빌어먹을. 여기서까지 우릴 방해하다니, 이젠 진짜 누가 불량배인지 모르겠네……."
10002200-25 = "아저씨!! 그럼 이건? 이것도 파는 거야?"
10002200-26 = "이 대왕만 한 폭죽!"
10002200-27 = "대왕 만한 폭죽? ……설마 저를 말하는 걸까요?"
10002200-28 = "허허허. 학생, 잘 못 골랐어. 그건 폭죽이 아니야. 네이팜 폭탄이지."
10002200-29 = "뭔 상관이야!"
10002200-30 = "환하게 터지기만 하면 되지! 그래서 터지냐고, 안 터지냐고!?"
10002200-31 = "허허허. 그야 터지긴 환하게 터지지. 그래 봬도 네이팜이니까 말이야. 그 한 발이면 하늘이 대낮처럼 훤해질 게다."
10002200-32 = "……어?"
10002200-33 = "좋아. 그럼 이거 살 테니까! 돈은 이 정도면 됐지?"
10002200-34 = "가져간다!!"
10002200-35 = "……어어?"
10002200-36 = "이, 이봐. 진짜 쓰려고? 그건 폭죽이 아니라 폭탄이잖아?"
10002200-37 = "뭔 소리야? 폭탄이든 폭죽이든 잘만 터지면 그만이지. 허공에서 터지면 다 폭죽이야!!"
10002200-38 = "아무튼 그럼 간다! 그럼 우린 바빠서 이만!!"
10002200-43 = "……뭐, 틀린 말은 아닐지도 모르지."
10002200-45 = "……안녕하세요. 밀레니엄 60 폭탄입니다."
10002200-46 = "……."
10002200-47 = "아니, 밀레니엄 60 폭죽입니다."
