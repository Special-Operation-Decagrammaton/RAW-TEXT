[translation]
2300603-1 = "마츠리운영관리부의 멋진 부장님!"
2300603-2 = "백귀야행의 시가지"
2300603-3 = "(본의 아니게 약속 시간에 10분 정도 늦고 말았다.)"
2300603-4 = "(가까스로 도착한 약속장소에는 어째서인지 인파가 몰려 있었다.)"
2300603-6 = "와~ 시즈코 쨩! 사진 찍어주세요!"
2300603-7 = "나도나도! 같이 한 장만 찍어주실래요?!"
2300603-8 = "에헤헷~ 네에~ 시즈코, 그런 거라면 얼마든지 해드릴 수 있어요!"
2300603-11 = "[s] \"시즈코는 백야당 밖에서도 인기가 많구나.\""
2300603-12 = "응? 아! 선생님! 에헤헷! 여기에요. 여기~♪"
2300603-13 = "저, 그럼 약속이 있어서 실례할게요~!"
2300603-15 = "시즈코~ 계~속 선생님을 기다리고 있었어요~ (방긋방긋)"
2300603-16 = "[s1] \"과연, 백야당 아이돌 모드의 시즈코…….\"\n[s2] \"빈틈이 없구나!\""
2300603-22 = "[ns] \"허, 허리를 그렇게 무자비하게 꼬집으시면?!\""
2300603-23 = "자아~ 선생님……?"
2300603-24 = "쓸데없는 말은 하지 않으셔도 된다구요?"
2300603-25 = "[s] \"엄청난 걸 본 듯한 느낌이야.\""
2300603-26 = "업무의 일환이에요. 업무의!"
2300603-27 = "그보다 10분 지각이시라구요?"
2300603-28 = "[s3] \"윽, 미안……. 그래서 불러서 나오긴 했는데.\"\n[s4] \"축제 준비라니, 무슨 일이야?\""
2300603-29 = "후. 후. 후."
2300603-30 = "후. 후. 후."
2300603-31 = "선생님, 제가 누구던가요?"
2300603-32 = "[s5] \"백야당의 아이돌?\"\n[s6] \"백야당의 프로 덜렁이?\""
2300603-33 = "아니아니아니! 백야당의 그 모습은 어디까지나 또 하나의 저……!"
2300603-34 = "아니아니아니! 백야당의 그 모습은 어디까지나 또 하나의 저……!"
2300603-35 = "동아리 활동 자금을 벌기 위해, 평소 업무 중에 보여주는 일면일 뿐!"
2300603-36 = "그게 제 전부는 아니라구요!?"
2300603-37 = "저 이래 봬도 마츠리운영관리부의 부장이고……!"
2300603-38 = "[s] \"있었지, 그런 설정.\""
2300603-39 = "설정 아니거든요?!"
2300603-40 = "하아……. 정말……."
2300603-41 = "어쨌거나 오늘 이렇게 선생님을 모신 건, 마츠리운영관리부에게 의뢰가 들어왔기 때문이에요."
2300603-42 = "[s] \"의뢰?\""
2300603-43 = "네. 이번 주말에 백귀야행 제23상점가에서 작은 축제가 열릴 예정인데."
2300603-44 = "그 축제의 프로듀스를 마츠리운영관리부에서 맡아주지 않겠냐-고 상점가로부터 공식 요청이 들어왔거든요."
2300603-45 = "[s] \"그래서 축제 준비를 한다는 거구나.\""
2300603-46 = "네, 본디 백귀야행은 관광업을 업으로 삼는 학원 자치구."
2300603-47 = "그런 백귀야행에서도 가장 중요하다고 말할 수 있는 관광 상품이, 바로 축제거든요."
2300603-48 = "축제가 보다 완전히, 완벽히, 그리고 엘레강트하게 진행될 수 있도록"
2300603-49 = "뒤에서 서포트하는 것이 저희 마츠리운영관리부의 주요 업무라구요?"
2300603-50 = "자자, 여기서 이럴 게 아니라."
2300603-52 = "그럼 가실까요? 선생님~"
2300603-55 = "안녕하세요~"
2300603-56 = "네, 무슨 일로 오셨습니까?"
2300603-57 = "이번에 제23번 상점가에서 축제를 열려고 하는데요."
2300603-58 = "거기에서 사용할 기자재를 빌리고 싶어서……."
2300603-63 = "알겠습니다. 그럼 그 조건으로, 그 일정에 맞춰서 납품을."
2300603-64 = "네에, 거래. 감사합니다~♪"
2300603-68 = "[ns] \"헉, 엄청 빠르게 처리했네.\""
2300603-69 = "이 정도쯤이야. 부장으로서 당연하다구요?"
2300603-70 = "하지만 이게 끝이 아니에요."
2300603-71 = "공연 기자재를 빌렸다면 다음은 당연히……."
2300603-72 = "이 기자재로 공연을 해줄 팀을 구해야겠죠?"
2300603-75 = "실례합니다~"
2300603-76 = "저, 저희 회사엔 무슨 일이신가용~?"
2300603-77 = "아, 이번에 백귀야행 23번 상점가에서 공연을 해줄 밴드 그룹이 필요한데요."
2300603-78 = "이런 조건으로, 이렇게."
2300603-79 = "으음, 하지만 그것만으로는 부족한데용……."
2300603-80 = "이런 건, 어떠실까요?"
2300603-81 = "축제의 현장을 직접 기록해서 인터넷으로 중계도……"
2300603-82 = "거기다 축제 버전의 음원 판매 수익을……."
2300603-83 = "판매루트는 이걸 통해, 보장하는 쪽으로……. 추후 공연 계약도 마찬가지로……."
2300603-84 = "과, 과연! 이런 조건이라면 다, 당장 계, 계약하겠습니다용!"
2300603-85 = "네~ 감사합니다~!"
2300603-86 = "[s] \"괴, 굉장해!\""
2300603-89 = "(그 뒤로도 시즈코는 연신 계속해서 이곳저곳을 돌아다녔다.)"
2300603-90 = "(축제에 투입될 노점 출자 계약, 축제 당일의 교통통제 대책 상담, 축제와 관련하여 주변 상권과 연계되는 즉석 이벤트 기획 등등…….)"
2300603-91 = "(시즈코는 씩씩하게 전부 처리해 나갔다.)"
2300603-93 = "네, 이걸로 대강의 업무는 끝!"
2300603-94 = "뿌듯하네요!"
2300603-95 = "응? 선생님, 괜찮으세요? 안색이 좋지 않은데요."
2300603-96 = "[s7] \"허억, 허억. 하, 하루 종일…….\"\n[s8] \"시즈코를 따라다니는 것만으로도 벅차서…….\""
2300603-97 = "음~ 그런가요?"
2300603-98 = "음~ 그런가요?"
2300603-99 = "[s] \"축제 준비란 건 엄청 힘들구나…….\""
2300603-100 = "후훗, 그야…… 쉬운 일은 아니라고요?"
2300603-101 = "그나마 이번엔 축제의 규모가 작아서 이 정도지."
2300603-102 = "저희 마츠리운영관리부에서 직접 개최하는 축제는 더 정신없으니까요."
2300603-103 = "[s] \"그 정도야?\""
2300603-104 = "네에~ 축제 개최는 보다 많은 시간과 노력."
2300603-105 = "모두의 헌신과 협조…… 그리고 그걸 진행하기 위한 자금까지."
2300603-106 = "정말 많은 게 필요해요."
2300603-107 = "백야당에서 매일 같이 일을 하는 것도, 그 축제의 자금을 마련하기 위한 방편 중 하나고……."
2300603-108 = "그것만 해도 엄청 고생이죠."
2300603-109 = "진짜 번거롭다니까요?"
2300603-110 = "[s] \"그런데도 계속해서 하는 이유가 뭐야?\""
2300603-111 = "그야."
2300603-112 = "좋아하니까요."
2300603-113 = "번거롭고, 축제를 연다는 게 힘든 일인 걸 알아도."
2300603-114 = "백야당의 일은 즐겁고, 손님들이 좋아해주고, 다른 부원들도 함께 노력하고 있어요."
2300603-115 = "이런 노력 끝에 축제가 무사히 열렸을 때."
2300603-116 = "축제에 참가한 사람들이 웃는 걸 보면, 고생 같은 건 아무래도 좋아지는 거예요."
2300603-117 = "게다가……."
2300603-118 = "[s] \"게다가?\""
2300603-119 = "오늘은 선생님이랑 함께였으니까."
2300603-120 = "선생님께 제 멋진 모습을 보여줄 수 있다는 것만으로, 전 만족한다구요?"
2300603-121 = "자, 어땠나요."
2300603-123 = "오늘 직접 보신 마츠리운영관리부 부장의 능력은!"
2300603-124 = "[s9] \"응, 시즈코는 프로구나.\"\n[s10] \"새삼 감탄했어.\""
2300603-125 = "네에, 그거면 충분해요. 그거면! 에헤헷!"
2300603-126 = "네에, 그거면 충분해요. 그거면! 에헤헷!"
2300603-128 = "(돌아가는 길에도 시즈코와 함께 축제에 대해 이야기를 나누었다.)"
