1014703-39 = "เป็นไงๆ?"
1014703-40 = "เห็นท่าหลบคลื่นที่ซัดขึ้นมาถึงชายหาดเท่ๆ ของฉันหรือเปล่า? ฮุฮุ!"
1014703-41 = "วิธีดูคลื่นแบบนี้แม่นใช้ได้เลยนะ รับรองว่าช่วยให้รอดชีวิตในทะเลที่อันตรายสุดๆ ได้มากขึ้นเยอะเลย"
1014703-42 = "ว่าไงล่ะ ครูจะมาลองด้วยกันหรือเปล่า?"
1014703-43 = "[s1] \"ก็ดูสนุกดีอยู่หรอก แต่ออกไปให้มากกว่านี้กันเถอะ...\"\n[s2] \"ครูว่าเราลองออกไปลึกกว่านี้อีกนิดก็น่าจะได้นะ\""
1014703-46 = "ให้ออกไปลึกกว่านี้งั้นเหรอ...?"
1014703-47 = "อึก ไม่เอาหรอก ฉันไม่ทำเรื่องอันตรายแบบนั้นหรอกนะ"
1014703-48 = "[s3] \"หาดแถวนี้ค่อนข้างตื้น ไม่ค่อยอันตรายหรอก\"\n[s4] \"อุตส่าห์มาถึงชายหาดทั้งทีนะ\""
1014703-51 = "ฮึ่ม ความชะล่าใจแบบนั้นละที่ทำให้เกิดอุบัติเหตุ"
1014703-52 = "ก็ทะเลน่ะทั้งอันตรายแล้วก็น่ากลัวสุดๆ~ เลย"
1014703-53 = "..."
1014703-54 = "ต่อให้มองด้วยสายตาเป็นประกายแบบนั้นก็ไม่ได้ผลหรอกนะ ครู..."
1014703-55 = ""
1014703-57 = ""
