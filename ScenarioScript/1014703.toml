[translation]
1014703-1 = "サツキの海対策 "
1014703-2 = ""
1014703-3 = ""
1014703-4 = ""
1014703-6 = ""
1014703-7 = ""
1014703-8 = ""
1014703-9 = ""
1014703-11 = ""
1014703-12 = ""
1014703-13 = "[ns] \"楽しそうなことをしてるね、サツキ。\""
1014703-14 = "あら、先生。"
1014703-15 = "ふふ、私が何をしていたか気になる？"
1014703-16 = "いいわ、教えてあげる。"
1014703-17 = "私は今――"
1014703-18 = "海を克服するトレーニングをしていたのよ！"
1014703-19 = "[s] \"海を克服するトレーニング？\""
1014703-20 = "1つ、海の秘密を教えてあげる。"
1014703-21 = "見て頂戴。"
1014703-22 = "波がきているでしょう？"
1014703-24 = "さっき海辺を観察していて気づいたのよ。"
1014703-25 = "波を観察すれば、規模をある程度予測できる、って。"
1014703-26 = ""
1014703-27 = "例えば……遠くで大きく崩れている波は、#nこちらに届く前に勢いがなくなってしまうけど……。"
1014703-28 = "静かな波は違うの。"
1014703-29 = "……あっ！ちょうど来るわ、見ていて頂戴。"
1014703-30 = ""
1014703-32 = ""
1014703-33 = "えいっ！"
1014703-34 = ""
1014703-38 = ""
1014703-39 = "ふふっ、どうかしら？"
1014703-40 = "打ち寄せる波を、華麗に避ける私は。"
1014703-41 = "この見分け方、結構当たるのよ。危険な海で生存率を上げるのに役立つはずだわ。"
1014703-42 = "先生もやってみない？"
1014703-43 = "[s1] \"確かに面白そうだけど――\"\n[s2] \"もう少し海の中に入ってもいいんじゃない？\""
1014703-46 = "海の中に……？"
1014703-47 = "い、嫌よ。そんなの危ないじゃない。"
1014703-48 = "[s3] \"この辺りは浅いから大丈夫だよ。\"\n[s4] \"せっかく海に来たんだし。\""
1014703-51 = "……その油断が命取りになっても知らないわよ。"
1014703-52 = "海はと～っても危なくて恐ろしい場所なんだから！"
1014703-53 = "……。"
1014703-54 = "そんなキラキラした目で見てもダメなものはダメ！"
1014703-55 = ""
1014703-57 = ""
1014703-58 = "でも……先生は万魔殿の協力者だし……。"
1014703-59 = "先生と海に入るのも、ちょっと楽しいかもしれないし……。"
1014703-60 = "……う～ん。"
1014703-61 = ""
1014703-63 = ""
1014703-64 = "はぁ……完敗よ。今回だけ、先生の提案に乗ってあげるわ。"
1014703-65 = "[s] \"やった～！\""
1014703-68 = ""
1014703-69 = "うぅ……波が……。"
1014703-70 = "……いいわ。誘ってきた先生に責任を取ってもらうから。"
1014703-71 = "どんな緊急事態でも私を守るよう、催眠をかけておかないと。"
1014703-72 = ""
1014703-74 = ""
1014703-75 = "そーれそれ……ぐ～るぐる……ぐ～るぐる……。"
1014703-76 = "先生は私を守る、先生は私を守る……。"
1014703-77 = "[ns5] \"ちょ、ちょっと待ってサツキ……！\"\n[ns6] \"あの波、なんだか大きくない……？\""
1014703-80 = ""
1014703-81 = "きゃあああっ！！"
1014703-82 = ""
1014703-87 = ""
1014703-88 = "あ、危なかったわ……ありがとう、先生。"
1014703-89 = "あら？そういえば……なんで先生は守ってくれたのかしら。#nまだ催眠は不完全だったのに……。"
1014703-90 = "まさか……。"
1014703-91 = "私の能力がレベルアップしたのかしら！？#n言葉だけで催眠をかけられるように！？"
1014703-92 = "[s] \"……催眠なんてなくても、サツキのことは守るよ。\""
1014703-93 = "え？催眠にかかったわけじゃないの？ならどうして……。"
1014703-94 = "……。"
1014703-95 = "わ、分かったわ。万魔殿の協力者としてってことね？"
1014703-96 = "[s7] \"違うよ。サツキ、痛いの嫌いでしょ。\"\n[s8] \"怖いのも。\""
1014703-99 = "……。"
1014703-100 = "そうね。#n先生は、この[ruby=きょうごく]京極[/ruby]サツキの秘密を知る数少ない人物……。"
1014703-101 = "いつか……この秘密を種に脅すつもりかしら？"
1014703-102 = ""
1014703-104 = ""
1014703-105 = "……いえ、答えは分かりきっているわね。先生がそんなことするはずない。"
1014703-106 = "[s] \"うん、絶対しない。\""
1014703-107 = "……ええ、知っているわ。"
1014703-108 = "ねぇ先生、これからも……私を守ってくれる？"
1014703-109 = "[s] 頷く。"
1014703-110 = "……いいわ。"
1014703-111 = ""
1014703-113 = ""
1014703-114 = "っ！また大きな波が……！"
1014703-115 = ""
1014703-117 = ""
1014703-118 = ""
1014703-119 = ""
1014703-120 = "頼んだわ、先生！"
1014703-123 = "（サツキが浅瀬を怖がらなくなるまで、一緒に過ごした）"
