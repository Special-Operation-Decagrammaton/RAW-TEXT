1014703-13 = "[ns] \"ทำอะไรอยู่น่ะ ดูสนุกดีนะ ซัตสึกิ\""
1014703-14 = "อ๊ะ ครู"
1014703-15 = "ฮุฮุ ดูหน้าก็รู้แล้ว อยากรู้ล่ะสิว่าฉันทำอะไรอยู่"
1014703-16 = "ได้ เดี๋ยวบอกให้"
1014703-17 = "ฉัน..."
1014703-18 = "กำลังฝึกเอาชนะทะเลที่ดุร้ายและอันตรายนี้อยู่น่ะ จะว่าอย่างนั้นก็ได้"
1014703-19 = "[s] \"ฝึกเหรอ?\""
1014703-20 = "งั้นฉันจะบอกความลับของทะเลให้ฟังตรงนี้เลยก็แล้วกัน"
1014703-21 = "นี่ ดูสิ"
1014703-22 = "เห็นคลื่นที่ซัดอยู่ตรงนั้นใช่มั้ย?"
1014703-24 = "ฉันสังเกตชายหาดอยู่นานแล้ว ก็เลยได้รู้อะไรบางอย่างน่ะ"
1014703-25 = "แค่เราดูลักษณะของคลื่นที่ซัดเข้ามา ก็เดาได้แล้วว่าคลื่นจะใหญ่แค่ไหน"
1014703-26 = ""
1014703-27 = "อย่างคลื่นที่ม้วนตัวแตกเป็นฟองใหญ่มาตั้งแต่ไกลแบบนั้น พอถึงกลางทางก็หมดแรง มาไม่ถึงตรงนี้หรอก"
1014703-28 = "แต่คลื่นที่มาเงียบๆ แบบนั้นน่ะต่างออกไป"
1014703-29 = "เอ้า คอยดูนะ มาแล้ว มาแล้ว..."
