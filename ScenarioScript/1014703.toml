[translation]
1014703-1 = "皐月的大海對策"
1014703-2 = ""
1014703-3 = ""
1014703-4 = ""
1014703-6 = ""
1014703-7 = ""
1014703-8 = ""
1014703-9 = ""
1014703-11 = ""
1014703-12 = ""
1014703-13 = "[ns] 「你好像在做什麼有趣的事呢，皐月。」"
1014703-14 = "啊，老師。"
1014703-15 = "呵呵，看你的表情，是很好奇我剛才在做什麼吧。"
1014703-16 = "好，我告訴你。"
1014703-17 = "我……"
1014703-18 = "可以說正在進行克服這片洶湧危險大海的訓練。"
1014703-19 = "[s] 「訓練？」"
1014703-20 = "就跟你分享一個大海的祕密吧。"
1014703-21 = "來，你看。"
1014703-22 = "浪正在打過來對吧？"
1014703-24 = "我從剛才就一直觀察海邊，然後發現了一件事。"
1014703-25 = "只要看海浪湧來的樣子，就能預測浪的大小。"
1014703-26 = ""
1014703-27 = "比如像那樣在遠處就碎開的大浪，到中途就會失去力道而到不了這裡。"
1014703-28 = "但那種平靜的浪就不一樣了。"
1014703-29 = "來，你看。來了，來了……"
1014703-30 = ""
1014703-32 = ""
1014703-33 = "嘿！"
1014703-34 = ""
1014703-38 = ""
1014703-39 = "怎麼樣，怎麼樣？"
1014703-40 = "看到了嗎？我剛才漂亮地閃過海浪的身影。呵呵！"
1014703-41 = "這個辨別海浪的方法相當精準。#n我敢保證，它能大幅提升在危險大海中的生存率。"
1014703-42 = "怎麼樣，老師也要一起玩嗎？"
1014703-43 = "[s1] 「那個看起來也挺好玩的……」\n[s2] 「不過稍微往裡面走一點應該也沒關係吧。」"
1014703-46 = "往大海裡面……？"
1014703-47 = "唔，不要。我才不做那麼危險的事。"
1014703-48 = "[s3] 「這片海灘很淺，不太危險的。」\n[s4] 「難得來海邊一趟嘛。」"
1014703-51 = "哼嗯，就是這種掉以輕心的想法才會釀成意外。"
1014703-52 = "因為大海是非～常危險又可怕的地方。"
1014703-53 = "……"
1014703-54 = "就算用那麼閃亮的眼神看我也沒用，老師……"
1014703-55 = ""
1014703-57 = ""
1014703-58 = "唔嗯……不過老師也是萬魔殿的主要協力者……"
1014703-59 = "在海裡玩水，或許也挺有趣的……"
1014703-60 = "……唔嗯～～～"
1014703-61 = ""
1014703-63 = ""
1014703-64 = "好，好吧。僅限這次，我就配合老師的提議吧。"
1014703-65 = "[s] 「哇～」"
1014703-68 = ""
1014703-69 = "唔……海浪……"
1014703-70 = "哼嗯，好吧。既然是老師慫恿我的，我也要想好自己的對策。"
1014703-71 = "我要對老師施加催眠，讓你在任何危急狀況下都會保護我。"
1014703-72 = ""
1014703-74 = ""
1014703-75 = "來，看著這根手指。轉圈圈～轉圈圈～"
1014703-76 = "老師會保護我，老師會保護我……"
1014703-77 = "[ns5] 「啊，那個浪……還挺大的耶？」\n[ns6] 「皐月……！」"
1014703-80 = ""
1014703-81 = "呀啊～！！"
1014703-82 = ""
1014703-87 = ""
1014703-88 = "好危險……謝謝你，老師。"
1014703-89 = "嗯？可是我都還沒完全催眠，老師就保護我了呢。"
1014703-90 = "難道……"
1014703-91 = "是我的催眠能力成長了嗎！#n看來我已經到了光靠言語就能催眠的境界！"
1014703-92 = "[s] 「就算不催眠，我也會保護皐月的。」"
1014703-93 = "嗯？你不是被催眠了嗎？那為什麼……"
1014703-94 = "……"
1014703-95 = "啊，我知道了。是基於萬魔殿協力者的身分對吧？"
1014703-96 = "[s7] 「不是。因為你討厭痛啊。」\n[s8] 「也討厭可怕的東西。」"
1014703-99 = "……"
1014703-100 = "說的也是。老師是少數知道我京極皐月祕密的人呢。"
1014703-101 = "你把祕密記得那麼清楚，是想找機會抓住我的把柄嗎？"
1014703-102 = ""
1014703-104 = ""
1014703-105 = "……不，老師不可能那麼做的。"
1014703-106 = "[s] 「嗯，絕對不會。」"
1014703-107 = "……呵呵。沒錯，不可能的。"
1014703-108 = "老師，那你以後也會保護我嗎？"
1014703-109 = "[s] 回答"
1014703-110 = "……好。"
1014703-111 = ""
1014703-113 = ""
1014703-114 = "啊，那邊又有大浪來了！"
1014703-115 = ""
1014703-117 = ""
1014703-118 = ""
1014703-119 = ""
1014703-120 = "老師，這次也拜託你了！"
1014703-123 = "（就這樣一直陪著皐月，直到他不再害怕淺海為止）"
