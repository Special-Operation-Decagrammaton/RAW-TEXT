[translation]
1014703-1 = "사츠키의 바다 대책"
1014703-13 = "[ns] \"뭔가 재미있는 걸 하고 있네, 사츠키.\""
1014703-14 = "아, 선생."
1014703-15 = "후후, 그 표정. 내가 뭘 하고 있었는지 궁금한 얼굴이구나."
1014703-16 = "좋아, 알려줄게."
1014703-17 = "나는……"
1014703-18 = "이 거칠고 위험한 바다를 극복하기 위한 훈련 중이었다고 말할 수 있어."
1014703-19 = "[s] \"훈련?\""
1014703-20 = "여기서는 바다의 비밀을 공유하도록 할까."
1014703-21 = "자, 봐."
1014703-22 = "지금 저렇게 파도가 치고 있지?"
1014703-24 = "나는 아까부터 오랜 시간 동안 해변가를 관찰하면서 알게 됐거든."
1014703-25 = "파도가 밀려오는 모양을 보면, 파도의 크기를 예측 가능하다는 사실."
1014703-27 = "가령 저렇게 멀리서부터 크게 부서지는 파도는 중간부터 힘이 부족해져서 이곳까지 다다르지 못해."
1014703-28 = "하지만, 저렇게 조용한 파도는 다르지."
1014703-29 = "자, 봐. 온다, 온다……."
1014703-33 = "얍!"
1014703-39 = "어때, 어때?"
1014703-40 = "이렇게 해변까지 밀고 들어오는 파도를 멋지게 피하는 내 모습. 잘 봤지? 후후!"
1014703-41 = "이 파도 구분법은 꽤 잘 들어맞아.#n위험하기 짝이 없는 바다에서의 생존률을 크게 올려줄 거라고 장담할 수 있어."
1014703-42 = "어때, 선생도 같이할래?"
1014703-43 = "[s1] \"그것도 꽤 재미있어 보이지만,\"\n[s2] \"조금 더 안쪽으로 들어가도 괜찮지 않을까.\""
1014703-46 = "바다 안쪽으로……?"
1014703-47 = "으, 싫어. 그렇게 위험한 일은 하지 않을 거야."
1014703-48 = "[s3] \"이쪽 해변은 꽤 얕아서, 별로 위험하지 않거든.\"\n[s4] \"모처럼 해변에 왔으니까 말이야.\""
1014703-51 = "흐응, 그런 안일한 마음이 사고를 부르는 거라구."
1014703-52 = "바다는 아~주 위험하고 무서운 곳이니까 말이야."
1014703-53 = "……."
1014703-54 = "그렇게 초롱초롱한 눈으로 봐도 소용없어, 선생……."
1014703-58 = "으음…… 그래도 선생은 만마전의 주요 협력자기도 하고……."
1014703-59 = "바다에서의 물놀이, 나름 즐거울지도 모르고……."
1014703-60 = "……으음~~~"
1014703-64 = "아, 알겠어. 이번만큼은 선생의 제안에 어울리도록 할게."
1014703-65 = "[s] \"와아~\""
1014703-69 = "으…… 파도가……."
1014703-70 = "흐응, 좋아. 선생이 나를 꼬드겼으니, 나는 나름대로 대책을 강구하겠어."
1014703-71 = "어떤 위급한 상황에서도 선생이 나를 보호하도록 최면을 걸 거야."
1014703-75 = "자아, 이 손가락을 보도록 해. 빙글빙글~ 빙글빙글~"
1014703-76 = "선생은 나를 보호한다, 선생은 나를 보호한다……."
1014703-77 = "[ns5] \"앗, 저 파도는…… 제법 큰데?\"\n[ns6] \"사츠키……!\""
1014703-81 = "꺄악-!!"
1014703-88 = "위험했어…… 고마워, 선생."
1014703-89 = "음? 그런데 아직 최면을 완전히 걸기 전인데도 선생이 나를 보호했네."
1014703-90 = "설마……."
1014703-91 = "내 최면 능력이 성장한 건가!#n이제 말로만 최면을 걸 수 있는 경지에 도달했나 봐!"
1014703-92 = "[s] \"딱히 최면 없어도 사츠키를 지켰을 거야.\""
1014703-93 = "으응? 최면에 걸린 게 아니었어? 그런데 왜……."
1014703-94 = "……."
1014703-95 = "아, 알았다. 내가 만마전의 주요 협력자라서지?"
1014703-96 = "[s7] \"아니. 아픈 거 싫어하잖아.\"\n[s8] \"무서운 거랑.\""
1014703-99 = "……."
1014703-100 = "그러네. 선생은 이 쿄고쿠 사츠키의 비밀을 알고 있는 사람이었지."
1014703-101 = "비밀을 그렇게 기억하고 있다는 건, 언젠가 약점 잡을 기회를 노리고 있는 걸까?"
1014703-105 = "……아니, 선생이 그럴 리가 없지."
1014703-106 = "[s] \"응. 절대.\""
1014703-107 = "……후후. 맞아. 그럴 리 없어."
1014703-108 = "선생, 그럼 앞으로도 나를 지켜줄 거야?"
1014703-109 = "[s] 대답한다."
1014703-110 = "……좋아."
1014703-114 = "아, 저기 또 큰 파도가 와."
1014703-120 = "선생, 이번에도 부탁해!"
1014703-123 = "(그렇게 사츠키가 얕은 바다를 무서워하지 않을 때까지 계속 함께 있었다.)"
