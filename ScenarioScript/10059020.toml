[translation]
10059020-1 = "제2화;작전 회의"
10059020-2 = "[ns] \"학원에 숨은 어둠……?\""
10059020-3 = "최근, 우리 학원 내에 특이한 동향이 발생 중입니다."
10059020-4 = "학생들의 작품을 고액에 사들이는 수상한 구매자가 나타났죠."
10059020-5 = "완성된 작품은 물론, 대충 그린 낙서나 실패한 조형물,#n심지어는 망상을 써 둔 노트까지."
10059020-6 = "와일드헌트 학생의 작품이라면 가리지 않고 전부 사들인다 해요."
10059020-7 = "[s] \"정상적이진 않네.\""
10059020-8 = "네. 말씀대로 구매자는 정상적으로 예술을 즐기는 자가 아닌 것 같습니다."
10059020-9 = "하지만 거액을 주고 작품을 사간다는 것은 사실."
10059020-10 = "이런 상황을 방치한다면, 학원의 명성이 실추되는 것은 물론…… #n학생들의 작품 활동에도 문제가 생깁니다."
10059020-11 = "어떤 작품을 만들어도 돈이 된다……."
10059020-12 = "너무나도 불건전해요.#n예술과 마주하기 위한 감각 그 자체가 왜곡되겠죠."
10059020-13 = "그런 상황은 어떻게든 막고 싶습니다."
10059020-14 = "[s1] \"확실히 이대로 두면 위험하겠어.\"\n[s2] \"내가 도와줄게!\""
10059020-20 = "예상보다 너무 흔쾌히 받아 주시는군요."
10059020-21 = "뭐, 상관없습니다. 선생님이 어떻게 대답하든 무조건 협력하게 할 생각이었으니까."
10059020-22 = "그럼 우라라 부회장. 선생님께 이번 사건의 좀 더 자세한 정보를."
10059020-23 = "아…… 네. 일단 저희가 조사한 정보대로라면……."
10059020-24 = "그 구매자는, 비대면으로 작품을 구매한다고 해요."
10059020-25 = "메일을 통해 구매 의사를 밝히고…… 작품을 지정 장소에 두면 대금을 지불하고 가져간대요."
10059020-26 = "마치 <파종>을 하듯 작품을 땅에 묻어 놓으라는 요구도 있었고……."
10059020-27 = "[s] \"……응?\""
10059020-28 = "작품을 <슈트케이스>에 넣은 뒤, 코인 로커에 보관해 달라는 요구도 있었고……."
10059020-29 = "[s] \"……으응?\""
10059020-30 = "투석기를 사용한 흔적도 찾았어요."
10059020-31 = "정말 수상한 향기가 잔뜩 나는데…… 혹시 짐작 가는 게 있으실까요?"
10059020-35 = "[ns] \"아, 아니. 잘 모르겠는데.\""
10059020-36 = "정말요……?"
10059020-37 = "으, 으으음……."
10059020-41 = "우라라 부회장. 일단 설명을 이어가 주시죠."
10059020-42 = "아…… 네. 마나미 님."
10059020-43 = "아무튼 말씀드린 것처럼…… 은밀한 방법 때문에 구매자와 만난 사람이 없어요."
10059020-44 = "메일도 매번 주소를 바꾸는 터라…… 이쪽에서 연락할 방법도 없고요."
10059020-45 = "확실한 건 그 구매자는 학원을 자유롭게 출입한다는 건데요."
10059020-46 = "사감대의 출입 기록에도 수상한 사람이 없어요."
10059020-47 = "마치…… 안개처럼 손에 잡히지 않아요."
10059020-48 = "인정하기 싫지만, 저는 그와 비슷한 상대를 알고 있습니다."
10059020-49 = "자칭 <자애의 괴도>라는 <도둑고양이>죠."
10059020-50 = "어쩌면 이번 사건은 그 녀석의 짓일지도 모릅니다."
10059020-51 = "……감히 간사한 수법으로 학생들을 속여 작품을 빼돌리다니."
10059020-52 = "이 기회에 붙잡아 평생 고양이 사료만 먹는 형벌을 내리겠어요."
10059020-53 = "[s3] \"도, 도둑고양이……?\"\n[s4] \"고, 고양이 사료?\""
10059020-59 = "마나미 님과 자애의 괴도는 서로를 용인할 수 없는 숙적이자 앙숙."
10059020-60 = "그 이야기를 지금 하기엔 꽤 장황한 설명이 될 것 같기에……. #n더 이상의 자세한 설명은 생략하기로 하죠."
10059020-61 = "확실한 건, 그 도둑고양이가 우리 학원에 끼치는 해악이 크다는 것입니다."
10059020-62 = "어떻게든 붙잡아야 해요."
10059020-63 = "[s] \"난 자애의 괴도는 이번 일엔 관계없을 것 같은데?\""
10059020-64 = "그렇게 말씀하시는 이유는?"
10059020-65 = "[s] \"예고장이 없잖아.\""
10059020-66 = "혹시 아나요? 다른 수법을 쓰기 시작한 건지."
10059020-67 = "저, 그게…… 마나미 님. 죄송하지만 저도 이번 일은 자애의 괴도와 무관해 보여요."
10059020-68 = "괴도는 성격상 사건에 앞서 꼭 예고장을 준비해요……. #n그게 자신의 시그니처라고 생각하니까."
10059020-69 = "괴도라면 분명…… 예고장 없이 움직이진 않을 거예요."
10059020-70 = "……칫."
10059020-74 = "[ns] (아무래도 아키라를 정말 싫어하나 보다…….)"
10059020-75 = "아무튼 선생님도 아시겠지만, 상대는 상당한 은밀함을 갖춘 상대입니다."
10059020-76 = "그런 의미에서 다시 한번 묻겠습니다만……."
10059020-77 = "정말로 짐작 가는 사람이 없으신지요?"
10059020-78 = "[ns5] (방법은 특수교역부 아이들과 비슷하지만……)\n[ns6] (그 아이들이 나쁜 짓을 할 리가 없다.)"
10059020-82 = "[ns] \"응. 없어.\""
10059020-83 = "……좋습니다. 일단 믿어보기로 하죠."
10059020-84 = "그렇다면 현재 상황에서 우리가 할 수 있는 것은 크게 두 가지입니다."
10059020-85 = "하나는 정보 입수를 위해 학원 학생들을 상대로 대규모 불심검문을 펼치는 것."
10059020-86 = "또 하나는 작품이 흘러 들어갔을 것으로 추정되는 블랙마켓을 조사하는 것."
10059020-87 = "어느 쪽이 되든 많은 인원과 시간이 필요하기에, #n한 번에 하나의 작전만 펼칠 수 있습니다."
10059020-88 = "선생님은 어느 쪽이 현명하다고 생각하시나요?"
10059020-89 = "[s] \"블랙마켓을 먼저 조사해 보는 게 어떨까?\""
10059020-92 = "[ns7] \"다수의 학생이 이번 사건의 피해자야.\"\n[ns8] \"모두가 마음을 추스를 시간이 필요해.\""
10059020-97 = "……과연. 그렇군요."
10059020-98 = "사실은 저도 블랙마켓을 조사해야 한다고 생각했습니다."
10059020-99 = "학생들도 피해자라는 발상이 아니라, #n평의회가 나섰다는 정보가 퍼지기 전에 현장을 급습하는 게 좋다는 판단 때문이지만요."
10059020-100 = "생각이 다르지만 같은 결과를 도출한다라. 이것 또한 흥미롭군요."
10059020-101 = "아무튼 의견이 일치함을 확인했으니, 블랙마켓을 조사하도록 하죠."
10059020-102 = "빠르면 빠를수록 좋으니 내일 당장 시작하는 겁니다."
10059020-103 = "다른 분들은 어떻게 생각하시는지?"
10059020-104 = "저는…… 당연히 찬성이에요."
10059020-105 = "저도 이견 없습니다. 즐거운 기록의 시간이 되겠네요."
10059020-106 = "[s] \"나도 좋아.\""
10059020-110 = "그럼 이것으로 선생님과의 공식 회의가 마무리되었군요."
10059020-111 = "아무래도 제 걱정보다 서로의 의견이 잘 일치했던 것 같습니다."
10059020-112 = "그럼 이 성공적인 회의를 기념하고, 서로의 믿음을 굳건히 하고자 하는 의미에서 기념품을 하나 드리죠."
10059020-113 = "카논 서기관. 선생님께 그것을."
10059020-119 = "[ns] \"응……? 이건……?\""
10059020-121 = "제가 말씀드렸던 <장난감 병정과 발레리나 인형> 기억하시나요?"
10059020-122 = "그 작품에서 발레리나 인형 역의 배우가 사용했던 토슈즈 중 하나입니다."
10059020-123 = "상당한 프리미엄이 붙은 고가의 수집품이죠."
10059020-124 = "이 아이를 선생님께 맡기겠습니다."
10059020-125 = "이게 어떤 의미인지는 굳이 설명해 드리지 않아도 아시겠죠?"
10059020-126 = "[s9] (도저히 거절할 수 없는 분위기다…….)\n[s10] 덜덜 떨리는 손으로 토슈즈를 받는다."
10059020-132 = "후후, 좋습니다. 역시 선생님은 이해가 빠르시군요."
10059020-133 = "그럼 이것으로 샬레와의 동맹 체결도 완료."
10059020-134 = "앞으로 그 아이의 상태를 확인하기 위해 주기적으로 샬레에 방문하겠습니다."
10059020-135 = "그 과정에서 신뢰가 깨졌다고 생각되는 순간, 바로 회수 절차에 들어가도록 하죠."
10059020-136 = "벌점과 함께 여러 벌칙이 따라가는 건 덤입니다."
10059020-137 = "부디 그런 일이 없도록 주의해 주시길."
10059020-138 = "[s] \"소, 소중히 보관하겠습니다!\""
10059020-139 = "네. 감사합니다."
10059020-140 = "그럼 이것으로 오늘의 공식 일정을 마무리하죠."
10059020-141 = "모두 내일 출정에 대비해 만반의 준비를 갖춰 주시길."
10059020-142 = "저의 뜻을 거스르는 어리석은 자들에게, 와일드헌트의 분노를 보여주는 거예요."
