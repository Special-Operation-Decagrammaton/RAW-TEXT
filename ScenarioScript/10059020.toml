[translation]
10059020-1 = "第2話;作戦会議"
10059020-2 = "[ns] \"学院に潜む闇……？\""
10059020-3 = "最近、学院内で奇妙な動きが確認されています。"
10059020-4 = "生徒の作品を異様な高値で買い集める、不審な人物が現れたのです。"
10059020-5 = "完成している作品はもちろん、走り書きの落書きや、失敗した造形物、#n果ては妄想を書き殴ったノートさえ。"
10059020-6 = "ワイルドハントの生徒の作品であれば、見境なくすべて買い取っているそうです。"
10059020-7 = "[s] \"まともではなさそうだね。\""
10059020-8 = "ええ。その買い手は純粋に芸術を楽しむ者ではないのでしょう。"
10059020-9 = "ですが、実際に大金を支払っていることは事実です。"
10059020-10 = "この状況を放置すれば、学院の名声が損なわれるだけでなく、#n生徒の創作活動にも悪影響が出ます。"
10059020-11 = "どんな作品を作っても金になる――"
10059020-12 = "それはあまりに不健全です。#n芸術に向き合うための感覚そのものが歪められてしまう。"
10059020-13 = "そんな未来だけは何としても防ぎたい。"
10059020-14 = "[s1] \"たしかに、このままだと危険だね。\"\n[s2] \"わかった。手伝うよ。\""
10059020-20 = "思いの外、あっさりと引き受けてくださるのですね。"
10059020-21 = "協力を取り付けるための手段は何通りか用意していたのですが……まあ、構いません。"
10059020-22 = "では、ウララ副会長。先生にご説明を。"
10059020-23 = "はい。現状で把握できていることをご共有します。"
10059020-24 = "まず、その購入者は決して顔を合わせずに取引をするそうです。"
10059020-25 = "買い取りの意思と場所の指定がメールで送られてきて、#n指示された場所に作品を置いておくと代金を支払った上で持ち去るのだとか。"
10059020-26 = "まるで[ruby=・]種[/ruby][ruby=・]ま[/ruby][ruby=・]き[/ruby]のように、作品を地中へ埋めておけと指示された例もあるようで……。"
10059020-27 = "[s] \"……ん？\""
10059020-28 = "作品をスーツケースに詰めて、#nコインロッカーに預けておくよう求められたケースも……。"
10059020-29 = "[s] \"……んん？\""
10059020-30 = "さらには投石機が使用された痕跡まで見つかっています。"
10059020-31 = "どれもこれも、あまりにも濃く怪しい香りを漂わせていて……#n先生、何かお心当たりはありませんか？"
10059020-35 = "[ns] \"いやー、よく分からないかな……。\""
10059020-36 = "……本当に？"
10059020-37 = "じー……。"
10059020-41 = "ウララ副会長。説明を続けてください。"
10059020-42 = "……はい。"
10059020-43 = "話を戻しますが、いずれも手口が巧妙で、購入者と直接会った者はいません。"
10059020-44 = "唯一の手掛かりであるメールアドレスは毎回変わるため、#nこの線から追うこともできず……。"
10059020-45 = "作品が持ち出されていることから確かなのは、#nその購入者は何らかの手段によって学院を自由に出入りしているということ。"
10059020-46 = "寮監隊の記録にも不審な人物は残っていないのです。"
10059020-47 = "まるで霧のように掴みどころがありません。"
10059020-48 = "……認めたくはありませんが、手口には心当たりがあります。"
10059020-49 = "「慈愛の怪盗」を名乗る、あの[ruby=・]泥[/ruby][ruby=・]棒[/ruby][ruby=・]猫[/ruby]です。"
10059020-50 = "もしかすると今回の一件にも関わっているのかもしれません。"
10059020-51 = "……姑息な手で生徒を欺き、作品を掠め取るなんて。"
10059020-52 = "この機に捕らえて、生涯キャットフードの刑に処して差し上げましょう。"
10059020-53 = "[s3] \"ど、泥棒猫……？\"\n[s4] \"キャットフード……？\""
10059020-59 = "マナミ様と慈愛の怪盗は、水と油。互いを決して容認できない宿敵なのです。"
10059020-60 = "この話を始めると長くなりますので、ここでの詳細は割愛します。"
10059020-61 = "あの泥棒猫は我が学院にとって看過できない存在です。"
10059020-62 = "何としてでも捕らえなければなりません。"
10059020-63 = "[s] \"今回の件とは関係ないんじゃないかな……。\""
10059020-64 = "理由を伺っても？"
10059020-65 = "[s] \"予告状がないから。\""
10059020-66 = "……別の手口を使い始めたのかもしれません。"
10059020-67 = "あの……マナミ様。わたくしにも、今回の件は慈愛の怪盗とは無関係に見えます。"
10059020-68 = "あの怪盗は、事を起こす前には必ず予告状を用意します。#nそれこそが美学だと思っている方ですから。"
10059020-69 = "きっと……予告状もなく動くことはないと思います。"
10059020-70 = "……ちっ。"
10059020-74 = "[ns] （アキラとそりが合わないのは本当らしい……）"
10059020-75 = "いずれにせよ、今回の相手は隠密性に長けています。"
10059020-76 = "そこで改めてお尋ねしますが……。"
10059020-77 = "本当に、心当たりのある人物はいないのですね？"
10059020-78 = "[ns5] （手口は特殊交易部に似てるけど……）\n[ns6] （こんな悪事に手を染めるはずがない）"
10059020-82 = "[ns] \"うん。いないよ。\""
10059020-83 = "……分かりました。今は先生を信じましょう。"
10059020-84 = "では、現状で私たちが取れる手段は2つです。"
10059020-85 = "1つは、学院の生徒に大規模な抜き打ち検査を行うこと。"
10059020-86 = "もう1つは、作品が流れ込んだと思われるブラックマーケットを調査すること。"
10059020-87 = "どちらも相応の人員と時間を要します。#n一度に動かせる作戦は、どちらか一方だけでしょう。"
10059020-88 = "先生のご意見をお聞かせ願えますか？"
10059020-89 = "[s] \"先にブラックマーケットを調べるのはどうかな。\""
10059020-92 = "[ns7] \"今回の件は多くの生徒が被害者になってる。\"\n[ns8] \"みんなが気持ちを落ち着ける時間も必要だと思う。\""
10059020-97 = "……なるほど。そのような見方もあるのですね。"
10059020-98 = "実のところ、私もブラックマーケットを調べるべきだと考えていました。"
10059020-99 = "ただ、先生の理由とは異なりまして。#n評議会が動いたという情報が広まる前に、現場を押さえるべきだと判断したからです。"
10059020-100 = "それでも、導き出した結論は同じ。興味深いものですね。"
10059020-101 = "意見も一致したので、ブラックマーケットを調査します。"
10059020-102 = "日取りは……早いに越したことはありません。明日、すぐに始めましょう。"
10059020-103 = "お二人はいかがですか？"
10059020-104 = "わたくしは……もちろん賛成です。"
10059020-105 = "私も異論はありません。記録に残す甲斐がありそうですね。"
10059020-106 = "[s] \"私も賛成だよ。\""
10059020-110 = "会議はこれまでとします。"
10059020-111 = "……少し意外でした。#n思っていたほど、先生とは意見が食い違わないようですね。"
10059020-112 = "実りある会議と――今後の信頼の証として、記念品をお贈りします。"
10059020-113 = "カノン書記官、先生に例のものを。"
10059020-119 = "[ns] \"これは……？\""
10059020-121 = "昨日お話した「しっかり者のスズの兵隊」を覚えておいでですか？"
10059020-122 = "その作品で、バレリーナ人形役の演者が使用していたトウシューズのひとつです。"
10059020-123 = "今では相当なプレミアが付いている、貴重な収蔵品でもあります。"
10059020-124 = "この子を先生にお預けしましょう。"
10059020-125 = "これが意味するところは――説明するまでもありませんよね？"
10059020-126 = "[s9] （預かるのは怖いが、とても断れる雰囲気じゃない……）\n[s10] 震える手でトウシューズを受け取る。"
10059020-132 = "ふふ、よろしい。さすが先生、察しが良いですね。"
10059020-133 = "ここにシャーレとの同盟は締結されました。"
10059020-134 = "今後は定期的にシャーレへ伺うことにします。#nこの子が大切に扱われているかを確認しないといけませんので。"
10059020-135 = "その過程で信頼が損なわれたと判断した場合、直ちに回収手続きに入ります。"
10059020-136 = "もちろん、その際は減点に加えて、相応の罰則も覚悟してくださいね。"
10059020-137 = "ふふっ、くれぐれも大切に扱っていただきますよう。"
10059020-138 = "[s] \"も、もちろんだよ！\""
10059020-139 = "ええ。よろしくお願いします。"
10059020-140 = "では、本日はここまでといたしましょう。"
10059020-141 = "皆さん、明日に備えて万全の準備を整えてください。"
10059020-142 = "私の意に逆らう愚か者に、ワイルドハントの怒りを思い知らせて差し上げましょう。"
