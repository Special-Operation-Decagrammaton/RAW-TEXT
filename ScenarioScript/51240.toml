[translation]
51240-1 = "제24화;평범한 일"
51240-3 = "아야메에게, 부끄럽지 않은 사람이 되고 싶었다."
51240-4 = "내 진짜 모습이 들키는 게 무서워, 아야메에게 어울리는 사람을…… 연기했다."
51240-15 = "어느 순간 뒤를 돌아보니, 모두가 나를 바라보고 있었다."
51240-16 = "그게 무서웠어."
51240-19 = "나는 그런 사람이 아닌데. 모두가 나를 착각하고, 오해하고 있었다."
51240-20 = "대단하다고. 뛰어나다고. 아야메에게 비교해 전혀 부족함이 없노라고."
51240-22 = "나는…… 단지 아야메에게 부끄럽지 않은 사람이 되고 싶었을 뿐인데."
51240-23 = "그걸 위해 필사적으로 아등바등…… 허우적거렸을 뿐인데……. 그런데……."
51240-25 = "[ns] \"그렇다면, 그걸로 충분하잖아.\""
51240-26 = "………?!"
51240-33 = "…………………뭐라, 고요?"
51240-34 = "[ns1] \"거짓된 자신을 연기하고……\"\n[ns2] \"그것이 진짜처럼 받아들여지는 게 뭐, 어때서?\""
51240-39 = "[ns3] \"거짓일지라도 계속하고 지키려고 노력하면……\"\n[ns4] \"끝내 진짜가 되는 법이야.\""
51240-42 = "[ns5] \"누구라도 자신의 모습을 꾸미고자 하는 건\"\n[ns6] \"당연한 일이야. 그건 정말로…….\""
51240-46 = "[ns] \"누구나 하는 흔한 일이잖아.\""
51240-47 = "그런……"
51240-48 = "아니, 그런 궤변 따위로 넘어갈 수 있으리라 생각하시나요?"
51240-49 = "거짓은 거짓…… 그로 인해 결국 모두가 상처 입고. 이런 비극에 이르렀잖아요."
51240-50 = "[s] \"설사 당사자에겐 거짓에 불과할지라도…… 타인에겐 그렇지 않을 때도 있어.\""
51240-56 = "(예를 들어, 유카리와 나구사가 처음 만났을 때처럼.)"
51240-59 = "다친 데는 없니?"
51240-60 = "불의를 앞에 두고도 물러서지 않고 맞서는 당당한 기개."
51240-65 = "무척이나 멋졌어."
51240-66 = "……!"
51240-67 = "여기서부턴 우리, 백화요란에게 맡겨. 후배님. 그럼."
51240-69 = "(예를 들어, 백화요란의 멤버들이 함께했을 때처럼.)"
51240-72 = "렌게는…… 뛰어난 아이야. ……나 같은 반푼이보다도 훨씬."
51240-73 = "그런 렌게가, 나는 자랑스러워. 유카리도 그렇게 생각하지?"
51240-74 = "네!"
51240-75 = "유카리, 그 말은 나구사 선배보다 렌게가 더 위라는 말이야."
51240-76 = "……헉?!"
51240-77 = "아니, 진짜. 그만하라고. 다들. 듣는 사람이 무진장 부끄럽거든?!"
51240-78 = "진짜 잘난 사람에게 그런 말 들어봤자 낯간지럽기만 하다고."
51240-83 = "………후후."
51240-85 = "(예를 들어, 백화요란을 떠나고자 결심했을 때처럼.)"
51240-87 = "키쿄. 너는 우수해. 백화요란의 작전참모로서, 많은 아이들이 널 따르고 있어."
51240-88 = "……심지어 다른 일반부원들뿐만 아니라. 나조차도."
51240-91 = "[ns] \"물론 처음엔 단순한 연기였을지도 몰라. 하지만 그 덕분에……\""
51240-93 = "[ns7] \"나구사는 그 누구보다 세 사람에 대해 잘 알고,\"\n[ns8] \"이해해 주는 사람이 되었어.\""
51240-96 = "[ns] \"그래, 마치, 나구사가 동경했던…… 그 누군가처럼 말이야.\""
51240-97 = "………!!!"
51240-98 = "[s] \"코스프레면 어때. 발버둥 치면서 그 자리에 있기 위해 노력한 게 뭐 어때?\""
51240-99 = "그 결과 서로가 반목하고! 싸우게 되더라도 말인가요?!"
51240-100 = "상처 입고! 좌절하고…… 끝내 증오하게 될 게 뻔한데도 그따위 말을……!"
51240-101 = "[s9] \"확실히…… 그러다 보면 싸우는 일도,\"\n[s10] \"서로를 미워하는 일도 있을지도 몰라.\""
51240-104 = "[ns] \"손가락질하고, 헐뜯고…… 마음이 상하는 일도, 분명 있겠지.\""
51240-107 = "[ns] \"하지만 그것까지 포함해, 누구에게나 있는 평범한 일이니까.\""
51240-109 = "[ns11] \"단지, 싸우고 난 뒤엔 화해할 수 있도록 노력하면 돼.\"\n[ns12] \"모두가 그럴 수 있도록, 나도 최선을 다해 도울 생각이야.\""
51240-114 = "…………………뭐야. 그게."
51240-115 = "그딴……. 쓸데없는 이상론 따위를……"
51240-116 = "그딴 건……! 풍류도 뭣도 아니야! 이야기로서 최악이라고!"
51240-117 = "<백물어>를 짓밟는 헛소리 따위는 전부 짓밟아 주겠어……!"
51240-118 = "샬레의 선생! 네놈부터……!"
51240-123 = "그렇게 하도록 내버려 두지 않겠사와요!"
51240-132 = "[ns] \"유카리………!\""
51240-137 = "정신을 차렸, 다고요? 카타시로에게 잡아 먹힌 그 상황에서? ………어떻게?"
51240-139 = "어둠 속에서 목소리가 들려왔사와요."
51240-140 = "선생님과……"
51240-141 = "무엇보다도 선명했던 나구사 선배의 목소리가."
51240-145 = "그러므로 저 유카리! 이 자리에 부! 활! 이어요!"
51240-150 = "무슨, 헛소리야."
51240-151 = "잊었……나요? 세상 모두가 당신을 밀쳐내고 거절하고, 끝내 마음을 유린했던걸?"
51240-152 = "그 때문에 저 <카타시로>를 태어나게 한 것을……?"
51240-153 = "그런데 이제 와서, 그런 건 아무래도 좋다는 식으로……!"
51240-154 = "당연히! 소녀 또한 그 일들로 인해 한가득 상처받은 것을, 부정하지는 않사와요!"
51240-155 = "[s] \"유카리…….\""
51240-156 = "여전히 제 가슴 한쪽은 아리고…… 또 아픔으로 터질 것처럼 두근대고 있는 것이 사실이어요!"
51240-157 = "하지만. 가물거리는 의식 속에서 들려온 선생님의 목소리, 말씀."
51240-158 = "네! 그것 덕분에 뒤늦게나마…… 정말로 늦었지만, 소녀는 깨달을 수 있었사와요!"
51240-160 = "깨닫는다고? 무엇을?"
51240-165 = "평범한 일이라는 걸요."
51240-171 = "거짓말을 하는 건 나구사 선배뿐만이 아니었사와요."
51240-172 = "그건 소녀도 마찬가지."
51240-173 = "나아가, 렌게 선배도, 키쿄 선배도 똑같았던 것이어요."
51240-179 = "표리부동한 모습…… 그건 무서워서 그랬던 걸지도 모르고, 다른 사람을 위해서일지도, 또는 스스로를 속이기 위해서일지도 몰라요."
51240-180 = "그로 인해 상처받는 일도, 위선이라 손가락질하는 일도, 계기가 되어 싸우는 일도…… 분명 있을 수 있사와요."
51240-184 = "하지만, 동시에 그건 누구나 하는, 그런 평범한 일이라고."
51240-185 = "[s] \"……응.\""
51240-187 = "뭐……?"
51240-188 = "그 때문에 싸웠더라도 화해하면 된다고…… 말씀해 주신다면!"
51240-195 = "소녀는 그 말씀에 따르고자 하여요!"
51240-196 = "저 유카리는 화해하고 싶으니까! 설사 서로에게 상처를 주고 싸우게 된 저희일지라도!"
51240-197 = "모두와 화해해서 백화요란의 그때로 돌아갔으면 하니까!"
51240-199 = "그런……. 유치한 대사를…… 잘도……!"
51240-200 = "그대, 야부키 슈로라고 하였지요!"
51240-201 = "저 소녀 유카리! 백화요란의 모두를 지키기 위해! 당신과 싸우겠다 선언하겠사와요!"
51240-202 = "그것이 백화요란의 엘리트를 자처하는! 저 유카리의 결의여요!"
51240-203 = "하! 그래. 어디 맘대로 지껄여 보지 그래!"
51240-204 = "너에게서 태어난 카타시로는 아직 이곳에 남아 있어……!"
51240-215 = "이걸 활용하면 제압한 나구사도! 샬레의 선생 당신도! 거기 있는 자기 주제도 모르는 계집까지!"
51240-216 = "전부……!"
51240-224 = "………하아?"
51240-229 = "우랴아아압!! 우리가 왔다고!"
51240-230 = "………유카리! 무사해?!"
51240-235 = "…………아."
51240-236 = "아아앗! 렌게 선배! 키쿄 선배!!"
51240-238 = "후우…… 늦지 않은 모양이네."
51240-239 = "[s] \"둘 다?! 여기까지 오다니! 어떻게……!\""
51240-240 = "다른 녀석들의 도움으로 어떻게든 우리 먼저 여기까지 올 수 있었어!"
51240-241 = "그리고 상황은…… 아무래도 격전의 한복판-이란 거겠지."
51240-247 = "……야부키 슈로. 화조풍월부의 부원."
51240-248 = "백화요란의 작전참모로서 권유하겠어. 얌전히 투항하도록 해."
51240-252 = "하."
51240-253 = "하하."
51240-254 = "아하하하핫!"
51240-258 = "여기까지 와서? 이 모든 이야기를, 고작 이런 정도의 얄팍한 이야기로 전락시킨다고?"
51240-259 = "……그래. 좋아. 좋다고요. 어디 한 번 해보자고요."
51240-260 = "나만의 <백물어>를 이런 지리멸렬한 이야기로 만들겠다면……"
51240-261 = "지금이라도 전부 리셋시키고! 다시 처음부터 시작하면 돼!"
51240-272 = "끝장내버려!"
51240-273 = "백화요란 따윈 전부! 박살내 버리라고!"
51240-275 = "………키쿄, 유카리, 선생님!"
51240-276 = "[s] \"응.\""
51240-277 = "여기까지 온 이상 물러날 곳은 없어."
51240-278 = "전력을 다해! 싸우는 것이어요!"
