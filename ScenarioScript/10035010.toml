[translation]
10035010-1 = "제1화;라이프가드, 시작합니다!"
10035010-2 = "드디어 도착했습니다!"
10035010-3 = "이곳이 바로 D.U. 최대 규모의 워터파크, <아에기르>군요!"
10035010-4 = "너무 넓어서 어디가 어딘지 헷갈릴 정도네요!"
10035010-5 = "왜 실외 시설로 오라고 한 거야……."
10035010-6 = "이러면 순찰 도는 거랑 별로 차이가 없잖아."
10035010-7 = "그런 소리 마세요, 후부키!"
10035010-8 = "우리의 본분은 시민들의 안전을 지키는 것이잖아요?"
10035010-9 = "조금 덥다고 해서 마음이 꺾이면 안 됩니다!"
10035010-10 = "우리가 고생한 만큼 시민 여러분도 알아주실 거예요!"
10035010-12 = "누굴 지키기 전에 내가 먼저 말린 오징어가 될 지경이라고."
10035010-13 = "선크림도 안 발랐는데……."
10035010-14 = "실내 풀장도 있는 것 같던데, 그쪽으로 배정해 줬으면 좋겠네."
10035010-15 = "국장도 그렇게 생각하지?"
10035010-19 = "……."
10035010-20 = "왜 그러세요, 국장님? 표정이 안 좋으세요!"
10035010-21 = "피로해 보이는 표정에, 팔다리에는 힘이 없고, 눈에도 힘이 풀린 것이……"
10035010-22 = "호, 혹시 열사병 초기 증상?!"
10035010-23 = "큰일이에요, 후부키! 얼른 국장님을 그늘에 눕히고 라이프가드를 불러 주세요!"
10035010-24 = "앗, 라이프가드는 저였죠?"
10035010-26 = "호들갑 떨지 마라, 키리노 경관. 난 괜찮으니까."
10035010-27 = "그냥 조금, 이 상황이 비현실적으로 느껴졌을 뿐이다."
10035010-28 = "아직도 그 상태야? 이제 받아들일 때도 됐잖아?"
10035010-29 = "말이야 쉽지."
10035010-30 = "애초에 워터파크에 온 것도,"
10035010-31 = "이런 면적 적은 옷을 입고 근무를 한 것도,"
10035010-32 = "업무 시간에 수영장에 있는 것도, 공안국에 들어온 이후 처음이란 말이다."
10035010-34 = "그, 그러셨군요……."
10035010-35 = "어라? 그러면 어째서 파견 인원 명단에 국장님의 이름이 있었던 거죠?"
10035010-36 = "그러게 말야."
10035010-37 = "우리 둘이야 생활안전국 소속이니 차출되는 게 당연하지만, 공안국, 그것도 국장님이 어째서 같이 파견된 거야?"
10035010-39 = "그건……"
10035010-47 = "부국장! 이게 어떻게 된 거냐!"
10035010-48 = "아, 오셨슴까, 누님!"
10035010-49 = "잠깐, 지금 턱걸이 마지막 세트라서, 이것만 끝내겠슴다……!"
10035010-50 = "흐읏차!"
10035010-53 = "히야, 개운하다. 무슨 일이심까, 누님?"
10035010-54 = "누가 근무 시간에 운동해도 좋다고……"
10035010-55 = "젠장, 됐다. 지금 그게 중요한 게 아니니까."
10035010-56 = "어째서 파견 인원에 내가 들어가 있는 거지?"
10035010-57 = "지금 팔자에도 없는 워터파크를 가게 생겼단 말이다. 그것도 임시 생활안전국 소속으로!"
10035010-59 = "아하, 그렇슴까~"
10035010-60 = "발뺌하지 마라. 파견 인원 결재 서류를 보니 부국장 서명이 있었단 말이다."
10035010-61 = "즉, 이 일을 꾸민 건 너라는 뜻이다, 코노카."
10035010-62 = "변명이라도 해볼 테냐?"
10035010-66 = "크하핫! 역시, 이런 반응이 돌아올 줄 알았슴다."
10035010-67 = "뭐어, '일을 꾸몄다'고 말할 만큼 거창한 건 아닙니다만……."
10035010-68 = "네, 누님 말씀대로, 누님의 이름을 파견 인원에 넣은 건 제가 맞슴다."
10035010-69 = "그게, 마침 선배가 부재중일 때 공문이 들어와서 말임다."
10035010-70 = "너……!"
10035010-71 = "하지만 그건 누님을 위해서 그런 거였슴다."
10035010-72 = "뭐?"
10035010-73 = "그동안 범죄자 취조에, 서류 작성에 주말도 없이 시달리셨잖슴까."
10035010-74 = "적절한 휴식을 취하지 않으면 쓰러지고 말 검다."
10035010-75 = "……그래서 나를 워터파크로 보내겠다는 거냐?"
10035010-76 = "바로 그검다!"
10035010-77 = "라이프가드가 쉬운 일은 아니지만, 어차피 워터파크 측에서도 외부 인력에게 중요한 일을 맡기지는 않을 검다."
10035010-78 = "말하자면 '발키리 경찰학교의 협조를 받고 있다'는 인식을 심어주기 위한 파견 요청 아니겠슴까?"
10035010-79 = "그러니까 그냥 가서 놀고 오시면 되는 검다!"
10035010-80 = "캬! 상사를 위해서 이렇게까지 하는 부하가 또 어디 있겠슴까!"
10035010-82 = "당장 취소해."
10035010-83 = "공안국장의 몸으로 한가로이 워터파크 따위에 가 있을 여유는 없다."
10035010-84 = "생활안전국의 인원을 충원해서 보내도록."
10035010-88 = "잠깐만 기다려 보시지 말임다, 누님."
10035010-89 = "정말 그래도 괜찮겠슴까?"
10035010-90 = "……무슨 말이지, 그게?"
10035010-91 = "우리끼리 얘기지만……이거, 누님한테도 좋은 기회라고 생각함다."
10035010-92 = "……?"
10035010-94 = "누님, 발키리에 처음 입학했을 때 생활안전국에 지원하시지 않았슴까?"
10035010-95 = "너, 그걸 어떻게 알았지?"
10035010-96 = "뭐어, 누님만큼은 아니지만, 부국장에게도 이런저런 서류의 열람 권한은 있으니 말임다."
10035010-97 = "심심할 때 살짝 들춰본 것 뿐임다."
10035010-98 = "아무튼, 비록 지금은 공안국장으로 재직 중이시지만……."
10035010-99 = "그때의 마음이 남아 있으시다면, 이번 기회에 한 번 체험해 보는 것도 좋을 검다."
10035010-100 = "이럴 때 아니면 언제 대민 업무를 해 보시겠슴까!"
10035010-104 = "훗."
10035010-105 = "?"
10035010-106 = "코노카, 까불지 마라."
10035010-107 = "네?"
10035010-108 = "분명 처음 입학할 때 생활안전국 지망이었지. 그러나 이미 마음을 접은 지 오래다."
10035010-109 = "이 나쁜 인상으로 시민을 대해 봤자 좋은 결과는 안 나올 테니까."
10035010-110 = "이제 와서 미련이 있지도 않다."
10035010-111 = "파견 인원 명단은 윗선에 재검토를 요청하지."
10035010-112 = "내가 직접 다녀올 테니 그렇게 알아."
10035010-114 = "그렇게 말씀하셔도……."
10035010-115 = "이미 끝났는데 말임다."
10035010-116 = "끝나다니, 뭐가 말이지?"
10035010-117 = "이미 결재고 예산이고 다 끝났지 말임다."
10035010-118 = "자, 여기 오늘 발급된 인사발령장임다!"
10035010-119 = "뭣……!"
10035010-122 = "……기밀 사항이다."
10035010-123 = "뭐야, 말해줄 것처럼 해 놓고."
10035010-125 = "[ns1] \"그러게 말야. 듣고 싶었는데.\"\n[ns2] \"그러니까 더 궁금한걸.\""
10035010-129 = "어라? 선생님?"
10035010-130 = "이런 곳에서 뵙게 되네요! 안녕하세요!"
10035010-131 = "이야, 수영복까지 챙겨입었네."
10035010-132 = "선생도 놀 생각 만만이구만?"
10035010-133 = "[s] \"안녕, 키리노, 후부키, 칸나.\""
10035010-134 = "어, 어째서 [USERNAME] 선생님께서 여기 계시는 겁니까?"
10035010-135 = "이번 업무는 샬레와 관련이 없을 텐데요."
10035010-136 = "[s] \"라이프가드 파견 인원들이 걱정된다는 제보가 있어서.\""
10035010-137 = "(코노카……!)"
10035010-138 = "[s] \"부담 줄 생각은 없어.\""
10035010-140 = "[ns] \"난 어디까지나 단순한 이용객으로 생각해 줘.\""
10035010-141 = "알겠습니다!"
10035010-142 = "물에 빠지면 언제든 전화나 모모톡으로 연락 주세요! 본관이 구해 드리겠습니다!"
10035010-143 = "[s] (물속에서 모모톡……?)"
10035010-144 = "선생, 이렇게 됐으니 같이 느긋하게 유수풀 유영, 아니 순찰이나 돌자고."
10035010-145 = "푸드코트에는 도넛을 파는 가게도 있으니 배도 좀 채우고."
10035010-146 = "또 놀 생각만 하네요, 후부키!"
10035010-150 = "……."
10035010-151 = "[s] \"칸나, 무슨 걱정이라도 있어?\""
10035010-152 = "아, 아닙니다."
10035010-153 = "그게, [USERNAME] 선생님을 여기서 뵐 거라곤 생각지 못했기에."
10035010-154 = "조금 놀랐을 뿐입니다."
10035010-155 = "[s] \"라이프가드 수영복, 잘 어울리네.\""
10035010-156 = "……신경 써 주셔서 감사합니다."
10035010-157 = "하지만 역시, 제게는 맞지 않는 옷 같군요."
10035010-158 = "어라? 국장님, 사이즈 안 맞으시나요?"
10035010-159 = "확실히 가슴 부분이 조금 끼는 것 같아 보이기는 하네~"
10035010-160 = "그, 그런 얘기가 아니다, 후부키 경관."
10035010-164 = "파크 내에 대기 중이신 라이프 가드 여러분께 안내 말씀드립니다."
10035010-165 = "잠시 후 근무지 배정이 있을 예정이니, 모두 실외 시설 중앙으로 모여 주시기 바랍니다."
10035010-170 = "네, 이제 시작이네요, 라이프가드 임무!"
