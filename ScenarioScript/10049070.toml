[translation]
10049070-1 = "제7화;섬광소녀 모리즈키 1"
10049070-3 = "35도 방향입니다. 느린 발걸음으로 이동 중입니다."
10049070-4 = "추정 상대거리는 70야드입니다."
10049070-5 = "용의 표적, 노란색입니다."
10049070-7 = "[ns1] \"노란색……?\"\n[ns2] \"라브가 그런 색이었던가?\""
10049070-10 = "으응? 굳이 말하자면, 하얗고, 빨갛고, 검은색 조금에, 회색……."
10049070-11 = "딸기 찹쌀떡 같지 않았던가요?"
10049070-12 = "그건 직접 확인해 보겠습니다. 노란색이면…… 저 분이군요."
10049070-16 = "대, 대장! 또 나타났어요!"
10049070-17 = "으엑, 지치지도 않냐, 너희들?!"
10049070-19 = "……어째서 그런 옷을……?"
10049070-20 = "너희들이 할 말은 아니지 않아?!"
10049070-21 = "뭐야, 쟤들 이거 모르나 본데?"
10049070-23 = "뭐, 뭐지? 다른 시리즈였나?"
10049070-24 = "저건 마법헤비의 귀염둥이 마스코트 '스타낙' 쨩입니다!"
10049070-25 = "화이트와 핑크를 돕는 착하고 연약한 아이입니다!"
10049070-26 = "킥킥킥, 그래, 그 말대로다!"
10049070-27 = "너희들이 입고 연기하는 그거, 후다닥 찾아봤단 말이지."
10049070-28 = "아까는 성가시게 굴었지만, 과연 사람들 앞에서 마법소녀가 마스코트를 공격할 수 있겠어?"
10049070-32 = "오! 이제 오후 공연 시작하나 봐!"
10049070-33 = "이제는 마스코트도 함께 하나 본데?"
10049070-35 = "테르밋 화이트랑 핑크, 다시 나왔어!"
10049070-36 = "스타낙 쨩도 있어!"
10049070-38 = "자, 어때? 이제 그냥 얌전하게 물러나시지?"
10049070-39 = "너희들은 우릴 막을 수 없으니까!"
10049070-41 = "오옷-홋홋홋호!!"
10049070-42 = "헤비캘리버즈와 그 하찮은 졸개 녀석! 한 번에 싹 쓸어버리기 좋게 모여 있구나!"
10049070-49 = "어디선가…… 들어본 것 같으면서도……."
10049070-50 = "한 번도 들어본 적 없는 것 같은 목소리가……?"
10049070-51 = "[ns] \"이건……?\""
10049070-55 = "모두들, 잘도 활개치고 있었구나."
10049070-56 = "너는 또 뭐야?!!!?!"
10049070-58 = "누구세요?!!"
10049070-60 = "[ns3] \"저것은……! 도서부의 시미코!\"\n[ns4] \"저것은……! 악의 간부 에라!\""
10049070-63 = "시미코 씨, 라고요?!"
10049070-64 = "그동안 어디 가 계셨다가 이제서야?!"
10049070-66 = "테르밋 화이트, 테르밋 핑크. 그리고 가증스러운 마스코트 스타낙."
10049070-67 = "모두, 마침 이렇게 한곳에 모여 있었구나. 잘 되었다."
10049070-68 = "나, 에라의 힘 앞에 무력감을 느끼며 좌절하도록 하여라!"
10049070-70 = "에라가 나왔어!! 악의 간부!!"
10049070-71 = "화이트와 핑크, 이길 수 있을까……."
10049070-73 = "악의…… 간부?"
10049070-75 = "스타낙 쨩은 매번 에라가 나타날 때마다 얻어맞으니까 불쌍해-"
10049070-76 = "뭐……?"
10049070-77 = "그러면……."
10049070-78 = "스타낙 쨩, 힘내!"
10049070-79 = "적이라고?? 저 녀석도?!"
10049070-80 = "내 어둠의 마법이, 너를 조각낼 것이다!"
10049070-81 = "오늘은 일진이 왜 이러냐 진짜!!!"
