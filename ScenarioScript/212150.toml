212150-76 = "The equipment in the broadcasting room."
212150-77 = "...!!!"
212150-78 = "D-Doesn't that mean...?"
212150-79 = "...They will immediately know if we touch the broadcasting equipment."
212150-81 = "Yeah. As long as the central server is active, we're locked out. Turning on the broadcasting equipment would alert the strategy room, and they could immediately cut power."
212150-82 = "To get what we need, we have to either deceive the system or neutralize the remote security system."
212150-83 = "Th-Then what should we do...?"
212150-84 = "The Head Prefect is always in the strategy room. We won't be able to get past her."
