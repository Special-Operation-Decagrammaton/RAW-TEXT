212150-50 = "ยินดีต้อนรับ อิโรฮะจัง"
212150-51 = "เฮ้อ... รู้สึกเหมือนยิ่งนานไปก็ยิ่งถูกบีบคั้นจนหายใจไม่ออกเลยค่ะ"
212150-52 = "อ๊ะ ฉันก็รู้สึกเหมือนกัน การเฝ้าระวังดูจะเข้มงวดขึ้นเรื่อยๆ เลย"
212150-53 = "พวกเราถูกกำหนดให้เป็นบุคคลเฝ้าระวังพิเศษแล้วนี่นา แค่แอบออกมาแบบนี้ก็ยากแล้ว..."
212150-54 = "ถ้ายังเป็นแบบนี้ ไม่นานคงถึงขีดจำกัดค่ะ"
212150-55 = "แต่อย่าร้อนใจกันนักเลย ขืนพลาดแม้แต่นิดเดียว ทุกอย่างจะพังหมดนะ"
