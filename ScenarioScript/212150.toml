[translation]
212150-1 = "제15화;작전 수립"
212150-8 = "……."
212150-16 = "……."
212150-22 = "……."
212150-27 = "……."
212150-35 = "뻐꾸기."
212150-36 = "둥지 위로 날아가다."
212150-42 = "들어와."
212150-50 = "어서 와, 이로하 쨩."
212150-51 = "후…… 점점 더 숨통이 조여드는 느낌이네요."
212150-52 = "아, 나도 느꼈어. 감시가 계속해서 빡세지네."
212150-53 = "……우리는 요주의 인물로 지정되었으니까. 이렇게 빠져나오는 것도 어려운 일이지."
212150-54 = "이대로 가면 금방 한계점이 올 거예요."
212150-55 = "하지만 조바심은 금물이야. 조금이라도 실수하면 다 망치게 될 테니까."
212150-61 = "하아…… 문제가 생겼어."
212150-65 = "사츠키 선배, 무슨 일이에요……?"
212150-66 = "혹시 꼬리가 붙은 거야?!"
212150-67 = "아니, 그 정도로 경솔하진 않아."
212150-68 = "그치만 좀 더 까다로운 문제일까……."
212150-69 = "……뭔데 그래?"
212150-70 = "집중지휘실에 원격 조작 시스템이 있더라."
212150-75 = "원격 조작……? 어디의?"
212150-76 = "방송실 장비를 원격으로 조종할 수 있는 시스템이야."
212150-77 = "……!!"
212150-78 = "그, 그 말은……?"
212150-79 = "……방송 장비를 건드리면, 그쪽에서 알아채겠군요."
212150-81 = "응. 중앙 서버가 장악된 이상, 방송 장비를 켜는 순간 원격으로 전원이 차단될 거야."
212150-82 = "우리 목적을 달성하려면 이걸 속이거나, 원격 조작 시스템을 무력화해야 해."
212150-83 = "그, 그럼 어떻게 해……?"
212150-84 = "작전 회의실에는 선도부장이 상주해 있으니까, 쉽게 건드릴 수 없어."
212150-85 = "방송실에 침투해서 방해전파를 틀려면 일단 원격 조작 시스템을 무력화해야 하고……"
212150-86 = "젠장, 뭐 이렇게 어려워?!"
212150-90 = "학원을 뒤집어엎는 게 쉬울 줄 알았어?"
212150-91 = "그건 그렇지만……! 너는 누구 편이야?"
212150-92 = "머리 식히라는 거야. 이오리 쨩. 흥분한다고 해결될 일도 아니잖아."
212150-93 = "……그 말은 맞긴 하지만……."
212150-94 = "그래도 넌 밥맛이야."
212150-95 = "야핫. 내가 밥맛이면, 이오리 쨩은 꿀맛이겠네."
212150-96 = "……뭐?"
212150-100 = "아무튼 머리는 좀 식었지?"
212150-101 = "끄응……."
212150-103 = "뭘 더 할 수 있지? 우리가…… 아직 할 수 있는 게 뭐가 있지……?"
212150-104 = "방송실 침투…… 방송실……."
212150-105 = "사츠키 선배, 방송실 장비에서 원격 조종하는 부분을 해제할 수 있어요?"
212150-106 = "글쎄, 장담은 못 해. 내가 모든 통신 장비를 알고 있는 건 아니라서."
212150-107 = "그리고 주파수 분석까지 고려하면 아무리 생각해도 시간이 모자라."
212150-108 = "하아……."
212150-112 = "잠깐. 그러고 보니……"
212150-113 = "뭔가 생각난 거야?"
212150-114 = "방송실에 대해 잘 알 것 같은 사람들이……."
212150-128 = "할래! 할래!!"
212150-129 = "이렇게 바로요?! 우리가 뭘 하려는지 알고 계시는 건가요?"
212150-130 = "하아, 키라라 쨩. 너무 즉답이잖아."
212150-131 = "뭐…… 어쨌든 할 거였지만."
212150-132 = "……교내 방송을 해보신 두 분께 말씀드리긴 했지만, 뭔가 이야기가 잘 될거라는 생각은 크게 없었는데요……."
212150-133 = "으음. 이로하 쨩. 만마전 그만뒀다며?"
212150-134 = "윽, 그게 벌써 그렇게 소문 퍼졌나요?"
212150-135 = "그거, 만마전이 말하는 방향이랑 안 맞아서 그랬던 거지?"
212150-136 = "……음, 네. 맞아요."
212150-137 = "안 그래도 이번에 만마전이랑 선도부랑 했던 선언이랑, 게헨나 전쟁 준비 말이야."
212150-139 = "우리도 탐탁치 않게 생각하고 있었거든."
212150-140 = "키보토스 정복이라니, 무슨 말인지…… 게다가 다른 학교에도 우리 친구들이 있는데."
212150-141 = "그 친구들이랑 진심으로 싸우라고? 피 흘리면서? 절대 안 되지."
212150-143 = "……네. 말도 안 되는 이야기예요."
212150-144 = "그래서 우리도 반대하는 마음이니까……"
212150-146 = "우리는 동지라는 이야기지. 서로 힘을 합쳐야 할 동지."
212150-152 = "……두 분이랑 친구가 되길 잘했어요."
212150-154 = "우와~ 엄청 기쁜 말!"
212150-155 = "앞으로도 잘 부탁할게."
212150-156 = "그래서, 우리는 정확히 뭘 하면 되는데?"
212150-167 = "……라는 거야. 혹시 방송할 때 기기 사용법에 대해 조금 익혀두었을까?"
212150-168 = "그러니까 정리하자면……"
212150-169 = "외부에서 원격으로 조종하는 시스템을 우회하면 되는 거지?"
212150-170 = "아, 맞아. 전원과 상관없이 송신기에 직접 연결할 수 있으면 가장 좋고."
212150-171 = "그건 충분히 가능할 것 같은데?"
212150-173 = "저, 정말? 가능해?"
212150-174 = "에리카 쨩, 전자 기계 같은 거 꽤 잘 다루거든!"
212150-175 = "그렇게 전문적인 수준은 아니지만…… 방송국에 있던 장비 정도라면."
212150-176 = "우와! 그럼 문제 해결이야?!"
212150-177 = "후훗, 적재적소에 인력이 나타났네. 운이 좋을지도."
212150-178 = "뭔가 잘될 것 같은 느낌이 들기 시작했는데. 야핫!"
212150-179 = "그럼, 급양부가 시간을 끌고 있는 동안 차분히 작전을 세워보죠."
212150-180 = "최소한 며칠, 운 좋으면 몇 주 정도는 벌 수 있을 테니……"
212150-186 = "크, 큰일 났어요……!!"
212150-190 = "왜? 무슨 일이야, 치아키?"
212150-194 = "……곧, 곧 전쟁이 시작될 것 같아요!!"
212150-195 = "뭐어? 그게 무슨 말이야?!"
212150-204 = "……그렇게 된 거예요……."
212150-205 = "자, 잠깐만. 화학탄?!"
212150-206 = "네……! 그것도 엄청난 위력의……."
212150-208 = "너, 너무 스케일이 커서 못 따라가겠어~!"
212150-209 = "이거, 지금까지 들은 이야기 중에 제일 무서운데……."
212150-211 = "그런 게 우리 학교에 있었다고요……?"
212150-215 = "……있어."
212150-219 = "정확하게는, 있었지."
212150-220 = "마코토 쨩…… 역시 제대로 기억하고 있었구나. 만들지 않았던 것뿐이지…….."
212150-221 = "마, 마코토 선배가 그걸 왜 알고 있는데요?!"
212150-222 = "말했잖아. 함께 뇌제의 모든 흔적을 폐기했다고."
212150-223 = "그 말은, 모든 흔적을 직접 봤다는 거니까."
212150-224 = "그런데 본 것만으로 그렇게 기억할 수 있는 거예요……?"
212150-225 = "마코토 쨩은 관심 있는 분야에 대한 기억력이 아주 좋으니까."
212150-227 = "……칫, 정말…… 이럴 때만 유능하다는 거네요."
212150-228 = "……진심 모드의 마코토 쨩은 키보토스의 그 누구보다 위협적이라고 했잖아."
212150-229 = "어쨌든 그게 사실이라면, 그걸 막을 시간이 별로 없는 거잖아?!"
212150-230 = "느긋하게 작전을 준비할 새가 아니었어……!!"
212150-234 = "……바로 가죠. 당장."
212150-236 = "엣? 바로 이렇게?"
212150-237 = "그래, 차라리 속전속결이 낫겠어. 기본적인 계획은 이미 세워둔 게 있으니까."
212150-238 = "무섭지만…… 우리도 도움이 될 수 있다니, 뭐라도 해야지!"
212150-239 = "……결전의 때가 이렇게 빨리 올 줄은 몰랐지만요."
212150-240 = "아, 그쪽에도 연락해 둘게요."
212150-241 = "해야겠지…… 조금 꺼림칙하긴 하지만 남은 시간도 별로 없고."
212150-242 = "지금은 뜻을 함께하는 동지니까요."
212150-243 = "네. 그럼……"
212150-252 = "다음화;게헨나 탈환 작전 1"
