212150-209 = "This is getting pretty scary..."
212150-211 = "Our school has those kinds of weapons...?"
212150-212 = ""
212150-214 = ""
212150-215 = "...We do."
212150-216 = ""
212150-218 = ""
212150-219 = "To be more precise, we DID."
212150-220 = "Makoto... So you remembered everything. You just didn't act on it..."
212150-221 = "Wh-Why would Makoto know how to make warheads?"
212150-222 = "I told you. We destroyed all traces of the Tyrant Emperor together."
212150-223 = "And that means we saw all her research with our own eyes."
212150-224 = "But how is it possible for her to retain all that from only seeing it once...? She barely remembers her own schedule."
212150-225 = "Makoto has an incredible memory when encountering topics she's interested in."
212150-227 = "...Tch, seriously... NOW she chooses to be competent."
212150-228 = "...It's as I said. When she gets serious about something, Makoto is a bigger threat than anyone else in Kivotos."
212150-229 = "But, if that's true, doesn't it mean we're running out of time?"
212150-230 = "We don't have the luxury of contingencies and thinking everything through."
212150-231 = ""
212150-233 = ""
212150-234 = "...Let's go. Now."
212150-236 = "Eh? Just like that?"
212150-237 = "Yeah. At this point, the faster the better. We've got the basic plan. We trust each other."
212150-238 = "I'm freaked out... But if we CAN help, then we gotta!"
212150-239 = "...Thank you. I didn't expect the confrontation to be so soon."
212150-240 = "Ah, and I'll let \"them\" know that we're moving."
212150-241 = "I suppose we have to... I don't have a good feeling about this, but we're out of time."
212150-242 = "Just know that we're allies—no, friends—sharing the same worthy vision."
212150-243 = "Yes. In that case..."
