212150-126 = ""
212150-128 = "I'm in! I'm SO in!"
212150-129 = "Already?! Do you even know what we're trying to do?"
212150-130 = "*sigh* Kirara. You agreed too early."
212150-131 = "Still... That doesn't change anything. Of course we'll help."
212150-132 = "...I asked you two because you're the only ones with school broadcast experience. I thought it was a long shot..."
212150-133 = "Um. Iroha. You quit the Pandemonium Society, right?"
212150-134 = "Ugh, is the word already out?"
212150-135 = "And that's because you disagreed with them, isn't it? Your beliefs didn't vibe?"
212150-136 = "...Um, yes. That's correct."
212150-137 = "There were so many Pandemonium declarations, combined with the Prefect Team and the war effort..."
212150-139 = "We weren't thrilled about all that either."
212150-140 = "All that bluster about conquering Kivotos... We both have friends in other academies."
212150-141 = "And they seriously wanted us to fight our friends and shed blood for Gehenna? No way."
212150-143 = "...Yes. It is completely ridiculous."
212150-144 = "So, since we're against all that..."
212150-146 = "Then that means we're allies."
212150-147 = ""
212150-150 = ""
212150-151 = ""
212150-152 = "...I'm glad we became friends."
212150-154 = "Wow, that's so sweet! You hear that Erika? Ride-or-dies!"
212150-155 = "Hopefully not literally. But know that we'll help however we can."
212150-156 = "So, what exactly do we have to do?"
212150-165 = ""
212150-167 = "...and that sums it up. Are you familiar with the broadcasting equipment?"
212150-168 = "Um... So, here's how I understood it."
212150-169 = "We have to bypass the remote security system, right? Because it can run an emergency shutoff?"
212150-170 = "Right. It'd be best if you could connect directly to the transmitter."
212150-171 = "I think we can do that."
212150-173 = "R-Really? You can?"
212150-174 = "Erika's super good with electronics!"
212150-175 = "I'm no expert, but I've seen what we're working with. I can handle it."
212150-176 = "Wow! Then the problem's solved, right?"
212150-177 = "Fufu, our luck has turned around. We found the perfect people at the perfect time."
212150-178 = "I had a feeling it would all work out. Score one for the good guys! Yaha!"
212150-179 = "Well, how about we work on the plan while the School Lunch Club buys us time? "
212150-180 = "They should be able to get us at least a few days, or even weeks if our luck holds..."
212150-181 = ""
212150-185 = ""
212150-186 = "W-We have a MAJOR PROBLEM!"
212150-187 = ""
212150-189 = ""
212150-190 = "Hm? What's wrong, Chiaki?"
212150-191 = ""
212150-193 = ""
212150-194 = "...Th-The war's breaking out! SOON!!!"
