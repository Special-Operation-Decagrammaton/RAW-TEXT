212150-64 = ""
212150-65 = "รุ่นพี่ซัตสึกิ เกิดอะไรขึ้นคะ...?"
212150-66 = "หรือว่ามีคนสะกดรอยตามมา?!"
212150-67 = "เปล่า ฉันไม่ประมาทถึงขั้นนั้นหรอก"
212150-68 = "แต่ว่ามันเป็นปัญหาที่ยุ่งยากกว่านั้นนิดหน่อยน่ะ..."
212150-69 = "อะไรเหรอ...?"
212150-70 = "ฉันเจอระบบควบคุมระยะไกลในห้องศูนย์บัญชาการกลางน่ะสิ"
212150-71 = ""
212150-73 = ""
212150-75 = "ควบคุมระยะไกล...? ของที่ไหนเหรอ?"
212150-76 = "มันเป็นระบบที่ใช้ควบคุมอุปกรณ์ในห้องกระจายเสียงจากระยะไกลน่ะ"
212150-77 = "...!!"
212150-78 = "ถะ... ถ้างั้นก็หมายความว่า...?"
212150-79 = "ถ้าแตะต้องอุปกรณ์กระจายเสียง ฝั่งนั้นก็จะรู้ตัวสินะคะ..."
212150-81 = "อื้อ ในเมื่อเซิร์ฟเวอร์กลางถูกยึดไปแล้ว ทันทีที่เปิดอุปกรณ์กระจายเสียง ฝั่งนั้นก็จะตัดไฟจากระยะไกล"
212150-82 = "ถ้าจะทำเป้าหมายของเราให้สำเร็จ เราต้องหลอกระบบนี้ หรือทำให้ระบบควบคุมระยะไกลใช้การไม่ได้"
212150-83 = "ถะ... ถ้างั้นจะทำยังไงล่ะ...?"
212150-84 = "ประธานกรรมการวินัยประจำอยู่ที่ห้องประชุมปฏิบัติการตลอด จะเข้าไปแตะต้องง่ายๆ ไม่ได้"
212150-85 = "ถ้าจะแทรกซึมห้องกระจายเสียงแล้วเปิดคลื่นรบกวนละก็ เราต้องทำให้ระบบควบคุมระยะไกลใช้การ#nไม่ได้ก่อน..."
212150-86 = "ให้ตายสิ ทำไมมันยากขนาดนี้?!"
212150-87 = ""
212150-89 = ""
212150-90 = "คิดว่าการพลิกโรงเรียนทั้งแห่งเป็นเรื่องง่ายเหรอ?"
212150-91 = "ก็จริงอยู่หรอก...! แต่นี่เธออยู่ฝ่ายไหนกันแน่?"
212150-92 = "ฉันแค่บอกให้ใจเย็นๆ อิโอริจัง ต่อให้โมโหก็แก้ปัญหาไม่ได้หรอกนะ"
212150-93 = "ที่พูดมามันก็จริง..."
212150-94 = "ถึงอย่างนั้นเธอก็น่าหมั่นไส้อยู่ดี"
212150-95 = "ยะฮ่า ถ้าฉันน่าหมั่นไส้ งั้นอิโอริจังก็น่าหม่ำสินะ"
212150-96 = "อะไรนะ...?"
212150-97 = ""
212150-99 = ""
212150-100 = "เอาเป็นว่า ใจเย็นลงบ้างแล้วใช่มั้ย?"
212150-101 = "อึก..."
212150-103 = "ยังทำอะไรได้อีกมั้ยนะ? พวกเรา... ยังมีอะไรที่พอจะทำได้อีกบ้าง...?"
212150-104 = "แทรกซึมห้องกระจายเสียง... ห้องกระจายเสียง..."
212150-105 = "รุ่นพี่ซัตสึกิ ถอดส่วนควบคุมระยะไกลออกจากอุปกรณ์ในห้องกระจายเสียงได้มั้ยคะ?"
212150-106 = "ไม่รู้สิ ยังรับประกันไม่ได้ ฉันก็ไม่ได้รู้จักอุปกรณ์สื่อสารทุกชนิดด้วย"
212150-107 = "แถมถ้ารวมเวลาที่ใช้วิเคราะห์ความถี่ด้วย ยังไงเวลาก็ไม่พออยู่ดี"
212150-108 = "เฮ้อ..."
212150-109 = ""
212150-111 = ""
212150-112 = "เดี๋ยวนะ จะว่าไปแล้ว..."
212150-113 = "คิดอะไรออกเหรอ?"
212150-114 = "คนที่น่าจะรู้เรื่องห้องกระจายเสียงดี..."
212150-115 = ""
212150-117 = ""
212150-126 = ""
212150-128 = "เอาสิ! เอาด้วย!!"
212150-129 = "ตอบตกลงทันทีแบบนี้เลยเหรอคะ?! รู้หรือเปล่าว่าพวกเรากำลังจะทำอะไรกัน?"
212150-130 = "เฮ้อ คิราระจัง ตอบไวเกินไปแล้วนะ"
212150-131 = "ก็นะ... ยังไงฉันก็ตั้งใจจะทำอยู่แล้วแหละ"
212150-132 = "ถึงฉันจะมาคุยกับทั้งสองคนเพราะเคยทำงานกระจายเสียงในโรงเรียน แต่ก็ไม่ได้คิดเลยค่ะ ว่าจะคุยกันรู้เรื่องง่ายขนาดนี้..."
212150-133 = "อืม อิโรฮะจัง ได้ยินว่าลาออกจากแพนเดโมเนียม โซไซตี้แล้วเหรอ?"
212150-134 = "อึก ข่าวแพร่ไปไกลขนาดนั้นแล้วเหรอคะ?"
212150-135 = "นั่นน่ะ เป็นเพราะไม่เห็นด้วยกับแนวทางที่แพนเดโมเนียม โซไซตี้พูดถึงใช่มั้ย?"
212150-136 = "อืม... ค่ะ ใช่ค่ะ"
212150-137 = "เรื่องคำประกาศร่วมของแพนเดโมเนียม โซไซตี้กับคณะกรรมการวินัย แล้วก็การเตรียมสงครามของ#nเกเฮนน่าน่ะ"
212150-139 = "พวกเราเองก็ไม่ค่อยพอใจเหมือนกัน"
212150-140 = "จะพิชิตคิโวทอสอะไรกัน... ที่โรงเรียนอื่นก็มีเพื่อนของพวกเราอยู่ด้วยแท้ๆ"
212150-141 = "จะให้สู้กับเพื่อนพวกนั้นจริงๆ เหรอ? ถึงขั้นเลือดตกยางออกเลยน่ะนะ? ไม่มีทางหรอก"
212150-143 = "ค่ะ เป็นเรื่องเหลวไหลสิ้นดี..."
212150-144 = "เพราะงั้น พวกเราเองก็คิดต่อต้านเหมือนกัน..."
212150-146 = "ก็หมายความว่าเราเป็นสหายกัน สหายที่ต้องร่วมมือกันสินะ"
212150-147 = ""
212150-150 = ""
212150-151 = ""
212150-152 = "ดีจริงๆ เลยค่ะที่ได้เป็นเพื่อนกับทั้งสองคน..."
212150-154 = "ว้าว~ เป็นคำพูดที่ทำให้ดีใจสุดๆ เลย!"
212150-155 = "จากนี้ก็ขอฝากตัวด้วยนะ"
212150-156 = "แล้วตกลงพวกเราต้องทำอะไรเหรอ?"
212150-165 = ""
212150-167 = "เรื่องมันก็เป็นแบบนี้แหละ... พวกเธอพอจะจำวิธีใช้อุปกรณ์ตอนทำงานกระจายเสียงได้บ้างมั้ย?"
212150-168 = "สรุปก็คือ..."
212150-169 = "แค่หาทางเลี่ยงระบบที่ควบคุมจากภายนอกก็พอใช่มั้ย?"
212150-170 = "อื้ม ใช่ ถ้าเชื่อมต่อเข้ากับเครื่องส่งสัญญาณโดยตรง โดยไม่ขึ้นอยู่กับแหล่งจ่ายไฟได้จะดีที่สุด"
212150-171 = "เรื่องนั้นน่าจะทำได้อยู่นะ?"
212150-173 = "จะ... จริงเหรอ? ทำได้เหรอ?"
212150-174 = "เอริกะจังเก่งพวกอุปกรณ์อิเล็กทรอนิกส์พอตัวเลยนะ!"
212150-175 = "ไม่ได้เชี่ยวชาญขนาดนั้นหรอก... แต่ถ้าเป็นอุปกรณ์ระดับที่มีอยู่ในสถานีกระจายเสียงก็พอไหว"
212150-176 = "ว้าว! งั้นปัญหาก็คลี่คลายแล้วเหรอ?!"
212150-177 = "ฮุฮุ คนที่เหมาะกับงานโผล่มาถูกที่ถูกเวลาพอดี อาจเป็นโชคดีของเราก็ได้นะ"
212150-178 = "เริ่มรู้สึกว่าเรื่องจะไปได้สวยแล้วสิ ยะฮ่า!"
212150-179 = "ถ้างั้นระหว่างที่ชมรมโภชนาการกำลังถ่วงเวลา เราค่อยๆ วางแผนปฏิบัติการกันเถอะค่ะ"
212150-180 = "อย่างน้อยก็น่าจะซื้อเวลาได้หลายวัน ถ้าโชคดีก็หลายสัปดาห์..."
212150-181 = ""
212150-185 = ""
212150-186 = "กะ... เกิดเรื่องใหญ่แล้วค่ะ...!!"
212150-187 = ""
212150-189 = ""
212150-190 = "ทำไมล่ะ? เกิดอะไรขึ้นเหรอ จิอากิ?"
