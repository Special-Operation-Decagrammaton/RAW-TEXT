212150-204 = "เรื่องมันกลายเป็นแบบนั้นไปแล้วค่ะ..."
212150-205 = "ดะ... เดี๋ยวก่อน กระสุนเคมีเหรอ?!"
212150-206 = "ค่ะ...! แถมยังมีอานุภาพมหาศาล..."
212150-208 = "ระ... เรื่องมันสเกลใหญ่เกินไปจนตามไม่ทันแล้ว~!"
212150-209 = "นี่เป็นเรื่องที่น่ากลัวที่สุดเท่าที่เคยได้ยินมาเลย..."
212150-211 = "โรงเรียนของเราเคยมีของแบบนั้นอยู่ด้วยเหรอคะ...?"
