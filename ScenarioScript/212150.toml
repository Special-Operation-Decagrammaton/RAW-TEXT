212150-218 = ""
212150-219 = "พูดให้ถูกคือ มันเคยมีอยู่น่ะ"
212150-220 = "มาโคโตะจัง... ยังจำได้แม่นอยู่จริงๆ ด้วยสินะ แค่ไม่ได้สร้างมันขึ้นมาเท่านั้น..."
212150-221 = "ทะ... ทำไมรุ่นพี่มาโคโตะถึงรู้เรื่องนั้นล่ะคะ?!"
212150-222 = "ก็เคยบอกแล้วนี่ว่าเราช่วยกันกำจัดร่องรอยทั้งหมดของผู้เหี้ยมโหด"
212150-223 = "นั่นก็หมายความว่า มาโคโตะจังเคยเห็นร่องรอยทั้งหมดด้วยตาตัวเองมาก่อน"
212150-224 = "แต่แค่เห็นครั้งเดียวก็จำได้ขนาดนั้นเลยเหรอคะ...?"
212150-225 = "มาโคโตะจังมีความจำดีมากเป็นพิเศษในเรื่องที่ตัวเองสนใจน่ะ"
212150-227 = "ชิ จริงๆ เลย... ดันมีความสามารถเฉพาะเวลาแบบนี้สินะคะ..."
212150-228 = "ก็บอกแล้วไงว่ามาโคโตะจังในโหมดเอาจริงเอาจังน่ะ เป็นภัยคุกคามยิ่งกว่าใครในคิโวทอสเลยนะ..."
212150-229 = "เอาเถอะ ถ้าเรื่องนั้นเป็นความจริง พวกเราก็เหลือเวลาหยุดมันไม่มากแล้วนะ?!"
212150-230 = "ไม่ใช่เวลามานั่งเตรียมแผนสบายๆ กันแล้ว...!!"
212150-231 = ""
212150-233 = ""
212150-234 = "ไปกันเดี๋ยวนี้เลยค่ะ เดี๋ยวนี้เลย..."
212150-236 = "เอ๋? จะไปกันทั้งแบบนี้เลยเหรอ?"
212150-237 = "ใช่สิ รีบลงมือให้จบโดยเร็วน่าจะดีกว่า ก็เราวางแผนพื้นฐานเอาไว้แล้วนี่"
212150-238 = "ถึงจะน่ากลัว... แต่ถ้าพวกเราช่วยได้ ก็ต้องทำอะไรสักอย่างสิ!"
212150-239 = "ไม่คิดเลยว่าเวลาของศึกตัดสินจะมาถึงเร็วขนาดนี้นะคะ..."
212150-240 = "อ๊ะ ฉันจะติดต่อหาทางนั้นไว้ด้วยค่ะ"
212150-241 = "คงต้องทำสินะ... ถึงจะรู้สึกตะขิดตะขวงใจนิดหน่อย แต่ก็เหลือเวลาไม่มากแล้ว"
212150-242 = "ตอนนี้พวกเขาเป็นสหายที่มีเจตจำนงเดียวกับพวกเราค่ะ"
212150-243 = "ค่ะ ถ้างั้น..."
