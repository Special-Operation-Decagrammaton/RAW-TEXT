212150-31 = ""
212150-32 = ""
212150-35 = "杜鵑。"
212150-36 = "飛越巢上。"
212150-37 = ""
212150-42 = "進來吧。"
212150-43 = ""
212150-45 = ""
212150-46 = ""
212150-49 = ""
212150-50 = "歡迎，伊呂波醬。"
212150-51 = "呼……感覺越來越喘不過氣了呢。"
212150-52 = "啊，我也感覺到了。#n監視越來越嚴了。"
212150-53 = "……畢竟我們被列為需要注意的人物了。#n光是要像這樣溜出來都很不容易。"
212150-54 = "再這樣下去，很快就會到極限了。"
212150-55 = "不過千萬不能急躁。#n只要出一點差錯就會全部搞砸。"
212150-56 = ""
212150-60 = ""
212150-61 = "唉……出問題了。"
212150-62 = ""
212150-64 = ""
212150-65 = "皐月前輩，發生什麼事了……？"
212150-66 = "難道是被跟蹤了！？"
212150-67 = "不，我沒那麼輕率。"
212150-68 = "不過這也許是更棘手的問題……"
212150-69 = "到底是什麼啊？"
212150-70 = "我發現集中指揮室裡有遠端操作系統。"
212150-71 = ""
212150-73 = ""
212150-75 = "遠端操作……？操作哪裡？"
212150-76 = "是能遠端操控廣播室設備的系統。"
212150-77 = "……！！"
212150-78 = "也，也就是說……？"
212150-79 = "只要一碰廣播設備，那邊就會察覺吧。"
212150-81 = "嗯。既然中央伺服器已經被掌控，一旦打開廣播設備，電源就會被遠端切斷。"
212150-82 = "要達成我們的目的就必須騙過它，或者讓遠端操作系統失效。"
212150-83 = "那，那該怎麼辦……？"
212150-84 = "作戰會議室有風紀委員長常駐，沒辦法輕易下手。"
212150-85 = "要潛入廣播室播放干擾電波，就必須先讓遠端操作系統失效……"
212150-86 = "可惡，怎麼會這麼難啊！？"
212150-87 = ""
212150-89 = ""
212150-90 = "你以為要把學園翻過來很簡單嗎？"
212150-91 = "話是這麼說沒錯……！#n等等，你到底是站在哪一邊的啊？"
212150-92 = "我是叫你冷靜一下，伊織醬。#n激動也解決不了問題吧。"
212150-93 = "這種事我也知道……"
212150-94 = "不過你還是很討人厭。"
212150-95 = "呀哈。我要是討人厭，那伊織醬就是討人喜歡囉？"
212150-96 = "……什麼？"
212150-97 = ""
212150-99 = ""
212150-100 = "沒事沒事，頭腦冷靜一點了嗎？"
212150-101 = "唔嗯……"
212150-103 = "還能做些什麼？#n我們……還有什麼能做的……？"
212150-104 = "潛入廣播室……廣播室……"
212150-105 = "皐月前輩，能解除廣播室設備上被遠端操控的部分嗎？"
212150-106 = "這個嘛……我不敢保證。#n畢竟我也不是所有通訊設備都了解。"
212150-107 = "考慮到還得進行頻率分析，時間不管怎麼想都不夠。"
212150-108 = "唉……"
212150-109 = ""
212150-111 = ""
212150-112 = "等等。這麼說來……"
212150-113 = "想到什麼了嗎？"
212150-114 = "好像有對廣播室很熟悉的人……"
212150-115 = ""
212150-117 = ""
212150-126 = ""
212150-128 = "我要做！我要做！！"
212150-129 = "答應得這麼快！？#n你們知道我們要做什麼嗎？"
212150-130 = "唉，綺羅羅醬，你回答得太快了啦。"
212150-131 = "不過……反正我們本來就打算要做了。"
212150-132 = "我是想說兩位做過校內廣播才來找你們商量的，但老實說沒想到會這麼順利……"
212150-133 = "唔嗯……伊呂波醬，聽說你退出萬魔殿了？"
212150-134 = "咦，那件事已經傳得那麼開了嗎？"
212150-135 = "是因為跟萬魔殿說的方向不合才退出的吧？"
212150-136 = "……嗯，是這樣沒錯。"
212150-137 = "正好就是這次萬魔殿和風紀委員會發表的宣言，還有格黑娜的戰爭準備啊。"
212150-139 = "我們也覺得不太對勁。"
212150-140 = "居然要征服奇普托斯，到底在說什麼啊……而且其他學園也有我們的朋友。"
212150-141 = "要我們跟那些朋友認真打，甚至還要流血？絕對不行。"
212150-143 = "……就是說啊。實在太荒唐了。"
212150-144 = "所以我們也反對那麼做……"
212150-146 = "也就是說我們是同志。#n是必須互相合作的同志。"
212150-147 = ""
212150-150 = ""
212150-151 = ""
212150-152 = "……能和兩位成為朋友真是太好了。"
212150-154 = "哇～這句話真讓人開心！"
212150-155 = "以後也請多多指教。"
212150-156 = "所以，我們具體來說要做什麼？"
212150-165 = ""
212150-167 = "……就是這樣。#n你們廣播的時候，有稍微學過機器的使用方法嗎？"
212150-168 = "所以總結來說……"
212150-169 = "只要繞過從外部遠端操控的系統就行了吧？"
212150-170 = "啊，沒錯。如果能不經過電源，直接連接到發射器是最好的。"
212150-171 = "那應該完全做得到哦？"
212150-173 = "真，真的？做得到嗎？"
212150-174 = "繪里香醬對電子機器之類的東西很拿手哦！"
212150-175 = "雖然稱不上多麼專業……但如果是廣播台裡的設備的話。"
212150-176 = "哇！那問題就解決了！？"
212150-177 = "呵呵，真是適才適所呢。#n看來運氣不錯。"
212150-178 = "開始覺得好像會很順利了耶。呀哈！"
212150-179 = "那麼，趁供給部在拖延時間的期間，我們好好來擬定作戰吧。"
212150-180 = "至少能爭取到幾天，運氣好的話應該能爭取到幾週……"
212150-181 = ""
212150-185 = ""
212150-186 = "不，不好了……！！"
212150-187 = ""
212150-189 = ""
212150-190 = "怎麼了？發生什麼事了，千秋？"
212150-191 = ""
212150-193 = ""
212150-194 = "就，就快要開戰了！！"
212150-195 = "什麼？那是什麼意思！？"
212150-198 = ""
212150-199 = ""
212150-201 = ""
212150-202 = ""
212150-204 = "……事情就是這樣。"
212150-205 = "先，先等一下，你說化學彈！？"
212150-206 = "沒錯……！而且還是威力非常驚人的……"
212150-208 = "規，規模太大了，我跟不上啦～！"
212150-209 = "這是我到目前為止聽過最可怕的事了……"
212150-211 = "我們學園居然有那種東西……？"
212150-212 = ""
212150-214 = ""
212150-215 = "……確實有。"
212150-216 = ""
212150-218 = ""
212150-219 = "準確來說，是曾經有過。"
212150-220 = "真琴醬……果然記得清清楚楚啊。只是沒有做出來而已……"
212150-221 = "真，真琴前輩為什麼會知道那種東西啊！？"
212150-222 = "我說過了吧。我們一起銷毀了雷帝的所有痕跡。"
212150-223 = "也就是說，他親眼看過所有的痕跡。"
212150-224 = "可是只是看過，就能記得那麼清楚嗎……？"
212150-225 = "因為真琴醬對感興趣的領域記憶力非常好。"
212150-227 = "嘖，真是的……偏偏只有這種時候才那麼能幹。"
212150-228 = "所以我才會說認真模式的真琴醬，比奇普托斯的任何人都更具威脅。"
212150-229 = "總之如果那是真的，就沒剩多少時間阻止了吧！？"
212150-230 = "根本不是悠哉準備作戰的時候……！！"
212150-231 = ""
212150-233 = ""
212150-234 = "……馬上出發吧。現在就去。"
212150-236 = "咦？就這樣馬上去？"
212150-237 = "對，乾脆速戰速決比較好。#n反正基本的計畫已經擬好了。"
212150-238 = "雖然很可怕……但既然我們也能幫上忙，總得做點什麼！"
212150-239 = "沒想到決戰的時刻會來得這麼快呢。"
212150-240 = "啊，我也會先聯絡那邊。"
212150-241 = "只能這樣了吧……雖然有點不太情願，但剩下的時間也不多了。"
212150-242 = "畢竟現在是志同道合的同志。"
212150-243 = "好。那麼……"
212150-244 = ""
212150-246 = ""
212150-252 = "下一話;格黑娜奪還作戰（１）"
