[translation]
212150-1 = "第15話;作戦立案"
212150-8 = "……。"
212150-16 = "……。"
212150-22 = "……。"
212150-27 = "……。"
212150-35 = "カッコウは――"
212150-36 = "巣の上へ飛んでいく。"
212150-42 = "入って。"
212150-50 = "いらっしゃい、イロハちゃん。"
212150-51 = "はぁ……息苦しくなっていきますね。"
212150-52 = "だよねー。監視、どんどん厳しくなってる。"
212150-53 = "しかも私たちは要注意人物に指定されてるんだから。#n隙を見て抜け出すのだって大変だ。"
212150-54 = "このままではすぐに限界が来ます。"
212150-55 = "でも焦りは禁物っしょ。1ミスでアウトなんだし。"
212150-61 = "はぁ……問題が起きたわ。"
212150-65 = "何があったんですか……？"
212150-66 = "尾行にバレたのか！？"
212150-67 = "いいえ、そんなヘマはしないわ。"
212150-68 = "問題はそれより厄介だけれどね……。"
212150-69 = "……何だよ。"
212150-70 = "集中指揮室に、遠隔操作システムがあると判明したわ。"
212150-75 = "遠隔操作……？どこの？"
212150-76 = "放送室よ。機材を遠隔で操作できるみたい。"
212150-77 = "……！！"
212150-78 = "つまり……？"
212150-79 = "……放送機材に触れた時点で、集中指揮室に気づかれるということですね。"
212150-81 = "ええ。放送機材の電源を入れた瞬間に、遠隔で落とされるはずだわ。"
212150-82 = "目的を果たすにはこれを欺くか……システムそのものを無力化する必要がある。"
212150-83 = "そんなことできるのか……？"
212150-84 = "作戦会議室には風紀委員長が常駐しているわ。そう簡単には手を出せない。"
212150-85 = "だけど放送室に潜入して妨害電波を流すには、遠隔操作システムをどうにかしないといけないし……。"
212150-86 = "無茶言うなよな……。"
212150-90 = "学園ひっくり返すのが簡単なわけなくない？"
212150-91 = "それはそうだけど……！ってお前、どっちの味方なんだよ！？"
212150-92 = "頭を冷やせって言ってんの。興奮したって解決しないでしょ。"
212150-93 = "それはそうだけど……。"
212150-94 = "でもやっぱり、お前は感じ悪い。"
212150-95 = "やはっ、同じ穴の狢って感じ？"
212150-96 = "……は？"
212150-100 = "まあまあ。少しは頭冷えたっしょ？"
212150-101 = "むぅ……。"
212150-103 = "八方ふさがりにも思えますが……何か他の手は……。"
212150-104 = "放送室への潜入……放送室……。"
212150-105 = "サツキ先輩、放送室の機材から遠隔操作システムを切り離すことってできますか？"
212150-106 = "……断言はできないわ。すべての通信機器を把握しているわけではないもの。"
212150-107 = "どのみち周波数の分析まで考えると、どう考えても時間が足りないのよ。"
212150-108 = "はぁ……。"
212150-112 = "待ってください。そういえば――"
212150-113 = "何か思いついたの？"
212150-114 = "放送室に詳しそうな人に心当たりが……。"
212150-128 = "やる！やる！！"
212150-129 = "即答ですか！？#n何をしようとしてるのか、ちゃんと分かってます？"
212150-130 = "キララちゃん、落ち着いて。"
212150-131 = "まあ……どのみち、やるつもりだったけど。"
212150-132 = "校内放送の経験があるお二人ならと思ったのですが、正直ここまで話が早いとは……。"
212150-133 = "そういえばイロハちゃん、万魔殿辞めたんだって？"
212150-134 = "えっ、それもうそんなに広まってるんですか？"
212150-135 = "辞めたのって、万魔殿の進もうとしてる方向と合わなかったからでしょ？"
212150-136 = "……ええ、まあ。その通りです。"
212150-137 = "最近いろいろあったもんね。"
212150-139 = "私たちも、あんまりいい気はしてなかったんだ。"
212150-140 = "キヴォトスに攻撃するとか意味が分からない。"
212150-141 = "他の学園にも友達いるのに、本気で戦えって？それは勘弁かな。"
212150-143 = "……はい。ほんと、何を言ってるんでしょうね。"
212150-144 = "うんうん。あたしたちも同じ気持ち。"
212150-146 = "だから協力するよ。"
212150-152 = "持つべきものは友ですね。"
212150-154 = "おぉっ、それ、すっごく嬉しいんだけど！"
212150-155 = "これからもよろしくね。"
212150-156 = "で、具体的に何をすればいいの？"
212150-167 = "――という話なの。機材の使い方は覚えているかしら？"
212150-168 = "先に整理してもいい？"
212150-169 = "遠隔操作システムを迂回できればいいんだよね？"
212150-170 = "ええ。電源を介さずに送信機へ直接つなげられたら理想的ね。"
212150-171 = "……それならできると思うよ。"
212150-173 = "で、できるのか！？"
212150-174 = "エリカちゃん、こういうの結構得意なんだよ！"
212150-175 = "自慢するほどじゃないけど……放送室にあった機材くらいなら。"
212150-176 = "ってことは問題解決！？"
212150-177 = "最後のピースがはまったわね。運が向いてきたのかしら。"
212150-178 = "やはっ、なんか上手くいきそうじゃん？"
212150-179 = "それでは、給食部が時間を稼いでくれているうちに作戦を立てましょう。"
212150-180 = "少なくとも数日。運が良ければ数週間は稼げるはずで――"
212150-186 = "た、大変です……！！"
212150-190 = "落ち着いて。何があったの？"
212150-194 = "もうすぐ……攻撃が始まりそうです！！"
212150-195 = "なんで！？"
212150-204 = "――ということなんです……。"
212150-205 = "ちょ、ちょっと待て。化学弾！？"
212150-206 = "それも、ものすごい威力の……。"
212150-208 = "スケール大きすぎてついていけないんだけど～！"
212150-209 = "これ……今まで聞いた話の中で一番怖いんだけど……。"
212150-211 = "そんなものがゲヘナにあったんですか……？"
212150-215 = "……あるわ。"
212150-219 = "正確には、あった……と言うべきかしら。"
212150-220 = "マコトちゃん……やっぱり覚えてたのね。作らなかっただけで……。"
212150-221 = "なんでマコト先輩がそんなことを知ってるんですか！？"
212150-222 = "言ったでしょう？一緒に雷帝の痕跡を処分したって。"
212150-223 = "つまり、全部自分の目で見ているのよ。"
212150-224 = "見ただけでそこまで覚えられるものなんですか……？"
212150-225 = "マコトちゃん、興味のある分野に関しては記憶力がとてもいいもの。"
212150-227 = "ほんっとうに……こういう時に限って有能なんですから。"
212150-228 = "本気になったマコトちゃんはキヴォトスの誰よりも厄介とはこういうことよ。"
212150-229 = "って、それが本当なら時間がほとんど残ってないってことだよな？"
212150-230 = "のんびり作戦なんか練ってる場合じゃなかった……！！"
212150-234 = "……行きましょう、今すぐ。"
212150-236 = "えっ？もう！？"
212150-237 = "速攻でいこう。この際それがいい。基本の作戦はもうできてるし。"
212150-238 = "怖いけど……役に立てるなら頑張るよ！"
212150-239 = "……決戦の時がこんなに早く来るとは思いませんでしたね。"
212150-240 = "ああ、それと。[ruby=・]あ[/ruby][ruby=・]っ[/ruby][ruby=・]ち[/ruby]にも連絡を入れておきます。"
212150-241 = "頼るしかないよな……気は進まないけど。"
212150-242 = "今は、志を同じくする[ruby=・]仲[/ruby][ruby=・]間[/ruby]ですから。"
212150-243 = "はい。では――"
212150-252 = "次回;ゲヘナ奪還作戦（１）"
