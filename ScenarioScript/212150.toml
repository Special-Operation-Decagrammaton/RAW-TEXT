212150-198 = ""
212150-199 = ""
212150-201 = ""
212150-202 = ""
212150-204 = "...And that's what happened..."
212150-205 = "H-Hold on. Chemical warheads?!"
212150-206 = "Yes...! And ones of mass-destruction..."
