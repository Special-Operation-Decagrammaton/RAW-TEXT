212150-91 = "No, but...! Wait, whose side are you on?"
212150-92 = "I'm telling you to calm down, Iori. We're not going anywhere even if you get so heated about everything."
212150-93 = "...That's true, but..."
212150-94 = "Well, you're still annoying."
212150-95 = "Yaha. And you're such a peach."
212150-96 = "...What?"
212150-97 = ""
