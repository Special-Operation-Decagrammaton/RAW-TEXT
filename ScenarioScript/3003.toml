[translation]
3003-1 = "통조림의 그림자 3"
3003-4 = "……이거 언제부터 이렇게 부풀어 올라 있었던 거야?"
3003-5 = "모르겠습니다. 한동안 방치한 뒤에 확인해보니 어느새……"
3003-6 = "그보다 이거 먹어도 괜찮은 거 맞아?"
3003-7 = "제대로 된 상태의 통조림이 이렇게까지 부풀어 오를 리가 없잖아!"
3003-9 = "역시 이 통조림은 평범한 통조림이 아니었어…… 분명 엄청난 생물의 일부가 봉인된 게 분명해……"
3003-10 = "크라켄의 촉수라던가, 거대 바다뱀의 꼬리라던가……"
3003-11 = "아니면 밝혀지지 않은 심해의 미확인 생명체라던가……"
3003-12 = "공장에서 대량 생산되는 전투식량에 그런 게 들어있을 리가 없잖아."
3003-13 = "어디…… 일단은 성분을 확인해볼까."
3003-17 = "<……본사의 '해물비빔소스' 캔은 풍미와 식감을 극대화하기 위해 신선한 해산물을 통째로 집어넣었습니다.>"
3003-18 = "<캔에 들어간 해산물은 청어와 정어리, 문어 등이며, 해산물 고유의 맛을 살리기 위해 별도의 살균처리는 하지 않았습니다……>"
3003-19 = "아무리 봐도 캔에 담긴 해산물이 안에서 썩거나 발효된 모양인데……."
3003-20 = "으윽, 역겨워라……"
3003-21 = "그럼 이 통조림 안에는 뚜껑이 부풀어 오를 정도로 생선 가스가 잔뜩 차 있다는 뜻이야?"
3003-22 = "자칫 실수로 통조림에 충격이 가해져 터지기라도 한다면……"
3003-24 = "……생각하고 싶지도 않아……"
3003-25 = "역시 이건 다른 곳에 가져다 버리는 수밖에 없겠지……"
3003-30 = "아니요, 모두 잠시만 기다려주세요."
3003-36 = "사키의 말이 사실이라면 이 통조림은 조금만 건드리기만 해도 생화학 가스를 뿜어내는 폭발물이나 다름없습니다."
3003-37 = "저희가 이 통조림을 무책임하게 쓰레기통에 버린다면…… 이를 모르고 건드린 청소부나 인근의 주민들이 큰 피해를 입을지도 모르지요."
3003-38 = "그, 그럼 이걸 어떻게 해? 먹을 수도 없고……"
3003-39 = "키보토스 내의 불발탄[ruby=급조폭발물]과 IED를[/ruby] 제거하[ruby=폭발물 처리]는 EOD 임[/ruby]무도 SRT가 수행해야 하는 작전 중 하나……"
3003-40 = "이 극악무도한 생화학 폭탄이 다른 사람의 손에 들어가게 내버려둘 수는 없습니다."
3003-42 = "미야코, 설마 너……"
3003-43 = "설마 그 방법을……?"
3003-44 = "이 해물 통조림은 저희가 책임지고 처리합니다!"
3003-46 = "지금부터, 이 통조림을 안전하게 처리하기 위한 <썩은 청어> 작전을 시작합니다."
3003-47 = "폭발물 처리의 기본은 피해를 최소한으로 억제하여 폭발물을 작동 불능 상태로 만드는 것……"
3003-48 = "생선에서 발생하는 대부분의 악취 성분은 수용성 물질이므로 통조림을 수조에 담근 채 천천히 가스를 제거하여 처리합시다."
3003-49 = "방법은 아무래도 상관없지만……"
3003-50 = "……그럼 사키, 부탁합니다."
3003-54 = "잠깐, 어째서 내가 처리하는 모양이 되었는데?"
3003-55 = "그건…… RABBIT 소대에서 EOD 교육을 수료한 사람이 사키밖에 없기 때문입니다."
3003-56 = "아니, EOD 교육이라면 모에도 받은 것으로 알고 있는데."
3003-57 = "그렇습니다만, 모에에게 폭발물 처리를 맡기는 건……"
3003-61 = "뭔데, 내 도움이 필요해? 폭파라면 맡겨 달라고, 쿠후후."
3003-63 = "……어쩔 수 없군."
3003-64 = "……네, 어쩔 수 없습니다."
3003-65 = "하지만 걱정하지 마세요, 사키. 저희도 유사시를 대비하여 계속 옆에서 서포트를 할 테니까요."
3003-67 = "우리는 운명을 함께하는 전우니까……!"
3003-68 = "통조림 하나 개봉하는 데 그렇게까지 호들갑을 떨 일인가 싶기도 하지만……"
3003-72 = "(꿀꺽) ……역시 막상 처리 하려니 긴장되는걸."
3003-73 = "우선, 캔의 바닥에 가스가 새어 나올 수 있는 미세한 구멍을 뚫습니다."
3003-74 = "그, 그러다가 실수로 뻥! 하고 터지면 어쩌지……?"
3003-76 = "고약하고 축축한 액체에 푹 젖어서 맞는 파멸도 나름…… 하아, 하아……"
3003-77 = "어, 그게 그러니까……"
3003-78 = "잠깐 기다리세요. 사키, 부풀어 오른 캔에 구멍을 뚫을 때는 압력으로 캔이 파손되지 않도록 가장 두꺼운 바닥 외곽에 구멍을 내야 합니다."
3003-79 = "으으, 못 보겠어. 역시 우리는 다 끝났어……"
3003-81 = "이렇게 된 이상, 아예 시원하게 터트리는 게 더 좋지 않을까? 하아, 하아……"
3003-82 = "으으, 시끄러워!! 그렇게 자꾸 옆에서 말을 걸면 집중력이 흐트러진다고—"
3003-86 = "아."
3003-91 = "(이후, 폭발한 해물 통조림 캔은 비산하여 코우사기 공원에 막대한 생물학적 재해를 일으켰다…….)"
3003-93 = "(가까스로 잔해를 치우긴 했지만 RABBIT 소대원들의 몸에 밴 고약한 악취는 사흘이 넘도록 빠지지 않았다고 한다……)"
3003-94 = "통조림의 그림자"
