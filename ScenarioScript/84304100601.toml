[translation]
84304100601-5 = "언제라도 관심 있으면 다시 말씀 부탁드립니다!"
84304100601-6 = "왠지 같이하는 운동…… 굉장히 즐거울 것 같아요!"
84304100601-7 = "좋게 봐주는 건 고맙지만……"
84304100601-8 = "혹시나 해서 하는 말인데, 내가 누군지 모르는 거지?"
84304100601-9 = "……음? 그게 무슨 뜻인가요?"
84304100601-10 = "혹시 이미 대단한 트레이너시라든가……!!"
84304100601-11 = "……아냐, 됐어. 신경 쓰지 마."
