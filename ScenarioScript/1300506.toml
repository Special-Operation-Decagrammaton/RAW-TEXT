[translation]
1300506-1 = "비 오는 날의 골목"
1300506-2 = "샬레 건물 앞"
1300506-4 = "업무를 마치고 건물 밖으로 나와보니 비가 거세게 내리고 있다."
1300506-5 = "[s] \"아까 까지만 하더라도 날씨가 맑았는데…….\""
1300506-11 = "응……? 선생? #n무슨 문제라도 있는 거야?"
1300506-12 = "뭐? 깜박 잊고 우산을 가져오지 않았다고?"
1300506-13 = "아침에 모모톡으로 말했는데, 그걸 그새 잊어버리다니……."
1300506-16 = "자, 여기. 우산."
1300506-17 = "어째서 여벌 우산을 가지고 다니느냐고?"
1300506-18 = "주변에 덜렁거리는 녀석들이 많아서 말이야. #n여분을 챙겨 두면 편리하거든."
1300506-19 = "워낙 손이 많이 가는 녀석들이라……."
1300506-20 = "학교는 반대쪽 방향인데 어디로 가느냐고?"
1300506-21 = "응……. 비가 오는 날이면 마찬가지로 내버려둘 수 없는 녀석이 있거든."
1300506-22 = "대수롭지 않은 일이니까. 신경 쓰지 않아도 돼."
1300506-23 = "[s1] 카요코의 신경을 쓰이게 하는 녀석이 또 있다니\n[s2] 궁금하니까 따라 가겠다고 한다."
1300506-24 = "뭐? ……같이 가겠다고?"
1300506-25 = "뭐? ……같이 가겠다고?"
1300506-26 = "아니 뭐, 안되는 건 아닌데……."
1300506-27 = "특별한 건 없을 텐데, 굳이……."
1300506-28 = "비도 오고, 바닥도 더러운데……."
1300506-29 = "……하아. 뭐, 말린다고 듣지도 않겠지만……."
1300506-30 = "내키는 대로 해."
1300506-34 = "[ns] 카요코를 따라간다."
1300506-39 = "[ns3] \"고양이 집?\"\n[ns4] \"내버려둘 수 없는 녀석이라는 게…….\""
1300506-42 = "[wa:500]― 여기까지 따라 올 필요는 없는데 말야, 선생."
1300506-45 = "[wa:2000]― 지금 없는 건가……."
1300506-48 = "[ns5] \"외출했나 보네.\"\n[ns6] \"기다려볼까?\""
1300506-51 = "[wa:3700]― 그냥 비가 오니까 [wa:1200]와 봤던 거뿐이야."
1300506-53 = "― ……아마 괜찮겠지. [wa:2000]혼자서도 잘 지내는 녀석이니까.[wa:500]"
1300506-56 = "[wa:2000]― 얽매이는 것도, [wa:1500]상처받을 일도 없으니 좋지만……"
1300506-59 = "― 그래도 [wa:1500]혼자는 쓸쓸하니까……."
1300506-62 = "[ns7] \"………….\"\n[ns8] \"카요코 쨩은 다정하구나.\""
1300506-65 = "[wa:6000]― ……내버려 둘 수 없는 녀석이니까. [wa:2000]그냥 그 뿐이야."
1300506-67 = "[wa:500]― 다른 뜻은 아니라고. [wa:2500]응, [wa:1000]선생?[wa:500]"
1300506-71 = "……어느새 비가 그쳤네."
1300506-72 = "우산을 지금 돌려주겠다고?"
1300506-73 = "아니, 갑자기 다시 소나기가 내릴지도 모르고…… #n지금은 괜찮아."
1300506-74 = "그리고 빌려준 물건이 있어야 내일 또 볼 수 있잖아?"
1300506-75 = "말은 그렇게 했지만…… 얽매이는 것, 싫어하지 않거든."
1300506-76 = "그럼 내일 보자, 선생."
