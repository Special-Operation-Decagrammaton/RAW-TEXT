221030-96 = "1;가짜 총학생회장;99;과연…… 이 정도 규모의 시설이라면 다량의 해산물을 안정적으로 확보할 수 있겠군요.\n#1;em;[…]"
221030-97 = "1;가짜 총학생회장;01;그렇지만 해산물만 섭취한다면 학생들에게 영양 불균형이 일어나지는 않을까요?"
221030-98 = "5;미나토;11\n3;아미;21;그 점은 걱정 마시길. 영양 관련해서는 선내의 의무실장이 철저하게 체크하고 있으니까요.\n#3;em;[반응]\n#3;a"
221030-99 = "3;아미;01;그리고 해수와 해조류에서 소금과 향신료도 추출해 내고 있기에, 학생들의 기호에 맞춘 다양한 부식도 충분히 생산할 수 있습니다."
221030-100 = "5;미나토;02;다만…… 육지에서 생산하는 모든 식재료를 대체할 수는 없어서요."
221030-101 = "5;미나토;06;특히 초콜릿이나 우유가 들어가는 디저트류의 경우는 출항 때마다 충분히 싣고 있지만, 항해가 몇 개월 이상 지속되면 얼마 남지 않은 디저트를 두고 밀거래가 일어나기도 해서……\n#5;em;[한숨]"
221030-102 = "3;아미;20;함장. 손님들 앞에서 그런 이야기는……"
221030-103 = "3;스미카;11;맞습니다! 지난 달에는 선내에 열 개밖에 남지 않은 밀크 초콜릿을 훔쳐 밀거래를 하려던 학생들이 적발되어, 저희 트라이던트에서 검거하기도 했었지요!\n#3;hophop\n#1;hide\n#5;hide"
