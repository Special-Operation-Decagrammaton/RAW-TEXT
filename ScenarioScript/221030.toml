[translation]
221030-1 = "제3화;바다의 금기"
221030-14 = "그럼 모처럼 저희 학원을 방문해 주셨으니, 제가 직접 학원을 안내해 드리겠습니다."
221030-15 = "아뇨. 사적인 일로 찾아온 것도 아니니까요. 바로 학생회실로 이동하시지요."
221030-16 = "하지만 학원을 처음 방문하신 [USERNAME] 선생님도 계시니, 가볍게 학원의 소개를 먼저 하는 편이 좋지 않을까요?"
221030-17 = "말씀은 감사합니다만, 저도 선생님도 시간이 많지 않기 때문에."
221030-18 = "안내는 다음 기회에 부탁드리겠습니다."
221030-19 = "그리 오래 걸리지는 않을 겁니다."
221030-20 = "게다가 <아일랜드>를 방문한 귀빈을 함장이 직접 모시는 건 저희 오디세이아 학원의 전통이라서요."
221030-21 = "전통이라……"
221030-22 = "그 전통에는 저희도 포함되는 걸까요?"
221030-23 = "선박에 발을 올린 순간부터는 총학생회장님이라도 예외는 없습니다."
221030-24 = "어머나……"
221030-25 = "'듣던 대로' 오디세이아의 함장님은 타협이 없는 원칙주의자시군요."
221030-26 = "후후, 칭찬으로 받아들이겠습니다."
221030-31 = "………."
221030-32 = "으아, 으아아……"
221030-33 = "이, 이런 상황에서는 누구의 편을 들어야 하는 거지? 직급이 더 높은 총학생회장님……? 아니면 같은 학원의 상급자인 함장님……?"
221030-38 = "[ns1] \"저기, 총학생회장……?\"\n[ns2] \"나는 학원을 한 바퀴 견학해도 좋다고 생각하는데—\""
221030-41 = "뭐, 선생님의 의견이 그러시다면……"
221030-47 = "[ns] \"……고양이?\""
221030-50 = "……새미. 언제 여기까지 올라온 거야? 빨리 네 자리로 돌아가."
221030-51 = "냐옹—"
221030-52 = "아무래도 새미가 손님 마중을 먼저 나온 것 같군요."
221030-57 = "……이 고양이는 아일랜드에서 키우고 있는 고양이인가요?"
221030-58 = "네. 평소에는 여기까지 올라오는 일이 없었는데…… 아무래도 낯선 냄새를 맡은 모양이네요."
221030-62 = "(킁킁)"
221030-63 = "……후후. 생각지도 못한 가이드가 있었군요."
221030-64 = "이런 상냥한 가이드와 함께 하는 학원 투어라면, 일부러 시간을 내더라도 아쉽지는 않을 것 같네요."
221030-65 = "네, 그럼 안내하겠습니다."
221030-70 = "새미, 그렇게 다른 사람 앞에서 애교를 부리더라도 간식은 안 줄 거야. 너 요새 많이 무거워졌다고."
221030-71 = "냐앙……"
221030-73 = "[ns] \"물을 싫어하는 고양이가 배에 있다니 신기한 풍경이네.\""
221030-74 = "오디세이아에서는 그리 특별한 일도 아닙니다만……"
221030-75 = "새미의 이야기는 나중에 또 들려드릴 테니, 우선은 다른 배로 이동하실까요?"
221030-77 = "[ns] \"응? 이 배 말고 다른 배로 이동하는 거야?\""
221030-78 = "네. <올림포스 호>는 저희 아일랜드 부원들이 사용하는 기함이니까요."
221030-79 = "육지의 학원으로 치자면…… 학생회 건물과 비슷한 개념이라고 할까요?"
221030-80 = "오디세이아 학원의 부 활동은 항해를 전제로 이루어지고 있기 때문에 오디세이아의 거의 모든 동아리는 각자의 선박을 하나씩 보유하고 있답니다."
221030-81 = "동아리의 규모나 활동 방향에 따라 목적이 달라지기도 하니, 이를 비교해 보시는 것도 재미있는 경험이 되실 겁니다."
221030-82 = "[s] \"그렇게 말하니 기대가 되는데……!\""
221030-83 = "그럼, 제일 먼저 오디세이아 학원에서 가장 규모가 큰 동아리부터 소개해드리겠습니다."
221030-85 = "[ns3] \"이곳은……?\"\n[ns4] \"엄청나게 큰 수상 시설이네……\""
221030-88 = "네, 이곳은 <양식연구부>의 이동식 해상 양식 시설입니다."
221030-89 = "이곳에서 오디세이아 학원에서 소비하는 거의 대부분의 식량을 생산하고 있거든요."
221030-90 = "때문에 <양식연구부>는 오디세이아 학원에서 가장 많은 학생들이 활동중인 동아리이기도 하고, 가장 많은 활동비를 지원받는 동아리이기도 합니다."
221030-91 = "이 양식 시설을 통해 주식에 사용되는 다양한 물고기부터 문어와 오징어 같은 두족류는 물론이고, 미역과 김 같은 해조류도 얻을 수 있지요."
221030-92 = "이 양식 시설만 있다면 원양 항해가 아무리 길어지더라도 식량 보급만큼은 큰 문제가 없답니다!"
221030-96 = "과연…… 이 정도 규모의 시설이라면 다량의 해산물을 안정적으로 확보할 수 있겠군요."
221030-97 = "그렇지만 해산물만 섭취한다면 학생들에게 영양 불균형이 일어나지는 않을까요?"
221030-98 = "그 점은 걱정 마시길. 영양 관련해서는 선내의 의무실장이 철저하게 체크하고 있으니까요."
221030-99 = "그리고 해수와 해조류에서 소금과 향신료도 추출해 내고 있기에, 학생들의 기호에 맞춘 다양한 부식도 충분히 생산할 수 있습니다."
221030-100 = "다만…… 육지에서 생산하는 모든 식재료를 대체할 수는 없어서요."
221030-101 = "특히 초콜릿이나 우유가 들어가는 디저트류의 경우는 출항 때마다 충분히 싣고 있지만, 항해가 몇 개월 이상 지속되면 얼마 남지 않은 디저트를 두고 밀거래가 일어나기도 해서……"
221030-102 = "함장. 손님들 앞에서 그런 이야기는……"
221030-103 = "맞습니다! 지난 달에는 선내에 열 개밖에 남지 않은 밀크 초콜릿을 훔쳐 밀거래를 하려던 학생들이 적발되어, 저희 트라이던트에서 검거하기도 했었지요!"
221030-104 = "그 때의 거래 비율이 초콜릿 하나에 냉동 정어리 10 kg이라고 했던가—"
221030-105 = "[s] \"싼 건지 비싼건지 모르겠어……\""
221030-106 = "……코모리 양."
221030-107 = "아, 아앗! 시, 시정하겠습니다!"
221030-108 = "그래도 신선한 생선을 언제나 바로바로 구할 수 있다는 점만큼은, 어느 학원에도 뒤지지 않는 장점이거든요."
221030-109 = "자, 선생님. 이 전갱이를 한 번 들어 보시겠어요? #n양식장에서 키운 이 전갱이는 고등어 만큼이나 커지기 때문에—"
221030-115 = "새미!"
221030-116 = "저, 망할 고양이가……"
221030-117 = "……실례했습니다. 제가 바로 데려오겠습니다."
221030-118 = "[s] \"아냐. 내가 한 번 유인해 볼 게.\""
221030-122 = "[ns] \"휘이— 새미, 이리로 오렴.\""
221030-123 = "……아."
221030-124 = "……방금, 휘파람 소리였지?"
221030-125 = "설마, 지금 배 위에서 휘파람을 분 거야?"
221030-126 = "하아, 큰일이네. 펜더의 재고도 충분하지 않은데."
221030-130 = "[ns] \"어라? 나 지금 뭔가 실수한 거야?\""
221030-131 = "아닙니다. 그저 뱃사람의 금기 같은 것이니까요."
221030-132 = "금기라……."
221030-133 = "함장. 새미는 제가 챙길 테니, 함장께서는 두 분을 다음 장소로 안내해 주시겠어요?"
221030-134 = "아…… 으, 응. 그래야지."
221030-135 = "그럼, 다음으로는 오디세이아에 계시는 동안 휴식하실 수 있는 장소로 안내해 드리겠습니다."
221030-137 = "이곳은—"
221030-138 = "[s] \"……혹시 크루즈 선인가?\""
221030-139 = "잘 아시는군요. 맞습니다."
221030-140 = "이곳은 저희 학원의 기숙 시설이자, 오디세이아의 관광 수입을 전담하고 있는 '여객관리부'의 기함, <골든 엘리시움> 이랍니다."
221030-141 = "여객관리부는 수십 척의 크루즈 선박을 관리하며 키보토스에서 찾아 오신 방문객 여러분께 다양한 유희와 편의를 제공해 드리고 있답니다."
221030-142 = "오디세이아 학원을 방문한 적이 있다는 대부분의 시민들도 여객관리부의 크루즈를 이르는 경우가 대다수지요."
221030-143 = "혹시 선생님께서도 전에 저희 오디세이아의 크루즈를 이용해 보신 적이 있으신가요?"
221030-144 = "[s5] \"있다고 해야 할까, 없다고 해야 할까……\"\n[s6] \"있긴 한데, 이상한 옷차림을 한 학생들이 있었지……\""
221030-147 = "저런, 아무래도 불량 학생들이 운영하는 크루즈 선에 타신 모양이네요."
221030-148 = "여객관리부의 통제를 벗어난 일부 크루즈에서는 학원에서 허가한 교복 이외의 이상한 옷차림을 강제하거나, 상품에 터무니없는 가격을 매겨 폭리를 취하기도 한다고 들었습니다만……"
221030-149 = "불쾌한 경험을 겪게 한 점에 대해, 학원을 대표하여 대신 사죄드립니다."
221030-150 = "[s] \"아냐. 너희 잘못도 아닌 걸.\""
221030-151 = "아, 마침 여객관리부의 부장이 자리에 있었군요."
221030-152 = "그럼 여객관리부의 소개는 그녀에게 대신 부탁하도록 할까요?"
221030-154 = "어머나, 손님이 오셨군요."
221030-158 = "<골든 엘리시움>에 오신 걸 환영합니다. 체크인을 도와드릴까요?"
221030-159 = "아차, 제 소개를 깜빡했네요."
221030-160 = "저는 여객관리부의 부장이자, 이 <골든 엘리시움>의 총지배인인 센고쿠 미츠키라고 합니다."
221030-161 = "[ns] \"이쪽도 이상한 옷차림이잖아!\""
221030-162 = "……네? 그런가요?"
221030-163 = "혹시 스카프가 조금 비뚤어졌나……"
221030-164 = "[s] \"그게 아니라, 하의가……\""
221030-165 = "센고쿠 양, 혹시나 해서 묻는 것입니다만……"
221030-166 = "혹시 하의를 입는 걸 깜박한 건 아니신지요?"
221030-167 = "네? 하의요……?"
221030-168 = "아, 오해를 하신 모양이군요."
221030-169 = "걱정 마시길. 이 재킷 아래에 받쳐 입은 건 속옷이 아니라 수영복이거든요."
221030-170 = "왜, 그런 말도 있잖아요? #n'속옷이 아니면 부끄럽지 않다' 라던가—"
221030-171 = "[ns] \"속옷이 아니어도 부끄러운 차림새인데……\""
221030-172 = "학원 외부에서 오신 여러분께는 다소 오해의 소지가 있을지도 모르겠지만, 이 의상은 <아일랜드>에서 정식 허가를 받은 엄연한 여객관리부의 제복이랍니다."
221030-173 = "상의는 전통적인 크루즈 크루의 제복 형태를 그대로 유지하면서도, 하의는 언제든 물에 뛰어들어도 문제가 없도록 수영복의 형태를 유지한 것이지요."
221030-174 = "여객관리부 부장이 직접 고안한 형태의 의상이기에, 부원 모두가 추호의 부끄러움도 없이 이 의상을 착용하고 있답니다."
221030-175 = "……아마도."
221030-176 = "[ns] \"왜 갑자기 말 끝을 흐리는 거야……\""
221030-177 = "후후, 걱정 마세요. 크루즈에서 중요한 건 의상이 아니니까요."
221030-178 = "오디세이아 학원에 체류하시는 동안, 저희 여객관리부에서 두 분의 숙식을 포함한 모든 편의를 책임지겠습니다."
221030-179 = "혹시 못 드시는 식재료가 있으신가요? 알러지는 없으신가요?"
221030-180 = "숙소는 바다가 보이는 트인 곳이 좋으신가요, 연회장과 가까운 내부가 좋으신가요?"
221030-181 = "체류가 끝난 뒤에는 어느 항구에 내려드리는 게 좋을까요?"
221030-182 = "혹 숙박 중 불편한 점이 생기신다면 숙소마다 배정된 룸 메이드에게 말씀주시면, 바로 조치해드리겠습니다."
221030-183 = "제 직위를 걸고 장담하건데, 분명 저희 서비스에 '100%' 만족하실 거예요!"
221030-184 = "후후, 의욕이 넘쳐서 보기 좋네요. 여객관리부의 부장님은 자신의 일에 아주 확신을 갖고 계신 모양이에요."
221030-185 = "그럼요! 저희 크루즈를 하선하실 때 불만을 표하신 손님은 그동안 단 한 분도 없었으니까요."
221030-186 = "혹시 의심스럽다면, 내기 하실래요?"
221030-187 = "회장님께서 저희의 서비스에 만점을 주실거라는 데 이 <골든 엘리시움> 호를 걸죠!"
221030-188 = "도망칠까 걱정은 마세요! 제대로 계약서를 쓰는 내기니까요!"
221030-189 = "그 대가로 총학생회장님은 무엇을 거시—"
221030-190 = "잠깐 자리를 비운 사이 또 무슨 내기를 걸고 있었나요, 센고쿠 양."
221030-191 = "야옹."
221030-192 = "내, 내기 건 거 아닌데요?!"
221030-193 = "시치미 떼지 마시죠. 당신이 손님들에게 수시로 내기를 거는 취미가 있다는 건 공공연한 사실이니까요."
221030-194 = "그러니까 <골든 플리스> 호 같은 크루즈를 헐값에 뜯기는 게 아닌가요."
221030-195 = "헐값으로 뜯기지 않았거든요?! 그 말, 장담하실 수 있으시겠어요?"
221030-196 = "그 말이 틀렸다는 데 저는 100만엔을 걸 수 있—"
221030-201 = "아얏."
221030-202 = "실례. 여객관리부의 부장은 우수한 사람이긴 하지만, 심각할 정도의 내기 중독이라……"
221030-203 = "두 분께서도 그녀가 내기를 걸어오거든, 부디 모른척 해주셨으면 합니다."
221030-204 = "[s] \"대충은 이해했어.\""
221030-209 = "[ns] \"그럼 그 바니걸은 여객관리부와 상관없었던 거지?\""
221030-212 = "아…… 네. 그 '귀가 긴 동물'을 흉내낸 의상 말씀이시죠?"
221030-213 = "당연히 그런 망측한 의상을 여객관리부에서 인정할리가 없죠."
221030-214 = "하의라면 몰라도 어깨 위로 아무것도 걸치지 않다니. 망측해라~"
221030-215 = "혹시 실례가 아니라면, 혹시 이곳에선 '바니걸' 이라는 단어를 언급하는 게 금지되어 있나요?"
221030-219 = "아, 그…… 의상의 문제가 아니라."
221030-220 = "실례했습니다. '토끼' 라는 단어를 언급하는 것도 뱃사람의 금기 같은 것이라서요."
221030-221 = "불편하시겠지만 양해해주시길."
221030-222 = "[s] \"아냐. 그 점은 배려하지 못했네.\""
221030-223 = "………."
221030-224 = "그럼 이어서 다음 선박으로 이동하실까요?"
221030-226 = "(그 후로도 배를 오가며 오디세이아 학원의 여러 동아리를 견학했다.)"
221030-236 = "(견학을 마치고 나니 어느덧 해가 수평선 너머에 걸려, 저녁 시간이 되었다.)"
221030-238 = "이런, 어느새 시간이 이렇게……"
221030-239 = "죄송합니다. 앞서 시간이 오래 걸리지 않을 거라고 말씀드렸습니다만, 동선을 잘못 계산한 모양이네요."
221030-240 = "[s] \"아니야. 생각보다 유익한 시간이었는 걸.\""
221030-241 = "저도 생각보다 즐거운 시간이었습니다."
221030-242 = "오랜만에 기분 전환도 했고…… 총학생회 건물 내에서는 알 수 없었던 여러가지 새로운 사실도 알 수 있었으니까요."
221030-243 = "그렇게 말씀해주시니 다행입니다."
221030-244 = "그럼 학생회실로 돌아가서 본격적인 이야기를 꺼내기에 앞서……"
221030-245 = "저녁 식사라도 함께하시는 건 어떠신가요?"
221030-246 = "후후, 이번에는 저녁 식사의 초대인가요."
221030-247 = "권해주신다면 사양 않고."
221030-251 = "함장, 하지만 괜찮을까요? 오늘 저녁 메뉴는……"
221030-252 = "아, 그러고보니 오늘이 입항 당일이었지? 그 사실을 깜박했었네……"
221030-254 = "[ns] \"왜? 식사 준비에 문제라도 있는 거야?\""
221030-255 = "아, 아뇨. 식재료는 충분합니다. 준비에 문제는 없을 거라 생각합니다만……"
221030-256 = "그게. 입항 첫 날의 메뉴는 언제나 '이것'으로 통일되어서요."
221030-260 = "……혹시 카레, 괜찮으신가요?"
221030-265 = "다음화;흰 제복과 카레"
