[translation]
221030-1 = "第3話;海の禁忌"
221030-2 = ""
221030-3 = ""
221030-4 = ""
221030-5 = ""
221030-6 = ""
221030-7 = ""
221030-8 = ""
221030-9 = ""
221030-10 = ""
221030-11 = ""
221030-12 = ""
221030-13 = ""
221030-14 = "さて……せっかくお越しいただきましたし、学園の見学でもいかがでしょう？"
221030-15 = "お気持ちはありがたいのですが、このまま生徒会室へ向かいましょう。"
221030-16 = "ですが、[USERNAME]先生は初めていらしたのですし……#nまずは学園の紹介から始めた方がよろしいのでは？"
221030-17 = "お心遣いはありがたいのですが、私も先生も予定が詰まっておりまして。"
221030-18 = "ご案内は次の機会にお願いできますか？"
221030-19 = "お時間は取らせません。"
221030-20 = "それに、アイランドの賓客を艦長自ら歓待するのがオデュッセイアの伝統なのです。"
221030-21 = "伝統――"
221030-22 = "オデュッセイアの伝統に、私たちも則るべき、と？"
221030-23 = "この船に足を踏み入れた者は、等しく。例外はありません。"
221030-24 = "そうですか……。"
221030-25 = "[ruby=・]聞[/ruby][ruby=・]い[/ruby][ruby=・]て[/ruby][ruby=・]い[/ruby][ruby=・]た[/ruby][ruby=・]通[/ruby][ruby=・]り[/ruby]、オデュッセイアの艦長さんは妥協のない原則主義者なのですね。"
221030-26 = "ふふ、褒め言葉として受け取っておきます。"
221030-27 = ""
221030-29 = ""
221030-30 = ""
221030-31 = "…………。"
221030-32 = "うぁ、うぁああ……。"
221030-33 = "こ、こういう時はどっちにつけば……？#n位が上なのは連邦生徒会長……？それとも学園の上官である艦長……？"
221030-34 = ""
221030-36 = ""
221030-37 = ""
221030-38 = "[ns1] \"えっと……。\"\n[ns2] \"私は学園をひと回りしてもいいと思うけど……。\""
221030-41 = "……先生がそうおっしゃるのでしたら。"
221030-42 = ""
221030-47 = "[ns] \"……猫？\""
221030-49 = ""
221030-50 = "……サミー、いつの間にここまで上がってきたの？#nほら、戻りなさい。"
221030-51 = "にゃ～"
221030-52 = "どうやら、サミーもお出迎えしたいようですね。"
221030-53 = ""
221030-55 = ""
221030-56 = ""
221030-57 = "……この猫はアイランドで飼っているのですか？"
221030-58 = "ええ。普段はここまで上がってくることはないのですが……#n嗅ぎ慣れない匂いが気になったみたいです。"
221030-59 = ""
221030-61 = ""
221030-62 = "（くんくん）"
221030-63 = "……こんなに愛らしい案内役がいるとは。"
221030-64 = "この子と一緒の見学ツアーなら、楽しい時間になりそうですね。"
221030-65 = "では、決まりですね。"
221030-66 = ""
221030-68 = ""
221030-69 = ""
221030-70 = "……サミー、お客様の前で愛想を振りまいても、おやつはあげないわよ。#n最近ちょっと重くなったでしょ。"
221030-71 = "にゃあ……。"
221030-72 = ""
221030-73 = "[ns] \"船で猫を飼うこともあるんだね。\""
221030-74 = "オデュッセイアでは珍しいことでもありませんよ。"
221030-75 = "ともあれ、サミーの話はまたあとで。まずは船を移動しましょうか。"
221030-76 = ""
221030-77 = "[ns] \"別の船に行くの？\""
221030-78 = "はい。オリュンポス号は、私たちアイランドの旗艦ですから。"
221030-79 = "陸の学園に例えるなら……生徒会棟と言えば分かりやすいでしょうか。"
221030-80 = "オデュッセイアの部活動は航海を前提に成り立っています。#nそのため、ほとんどの部活が自前の船を所有しているんです。"
221030-81 = "部活ごとに規模も活動方針も異なるので、見比べるのも面白いですよ。"
221030-82 = "[s] \"ワクワクしてきた……！\""
221030-83 = "最初は、オデュッセイアで最も規模の大きい部活をご紹介します。"
221030-85 = "[ns3] \"ここは……？\"\n[ns4] \"ものすごく大きな施設だね。\""
221030-88 = "養殖研究部の養殖施設です。"
221030-89 = "オデュッセイアの食料はここにかかっていると言っても過言ではありません。"
221030-90 = "養殖研究部はオデュッセイア最大の部活であると同時に、#n最も多くの部費が振り分けられている部活でもあります。"
221030-91 = "魚や、タコ、イカ、海藻など幅広く養殖しています。"
221030-92 = "この施設があるからこそ、遠洋航海がどれだけ長引いたとしても、#n食料の心配はないのです！"
221030-93 = ""
221030-95 = ""
221030-96 = "たしかにこの規模なら、学園全体を賄うだけの食料を安定して供給できるでしょう。"
221030-97 = "ですが、海産物ばかりでは生徒の栄養が偏りませんか？"
221030-98 = "その点はご心配なく。#n生徒の健康は船内の医務室が徹底的にチェックしていますから。"
221030-99 = "もちろん、味に飽きがこないような工夫もしています。#n海水や海藻から塩や香辛料も抽出していますので。"
221030-100 = "ただ、それでも陸の食材すべてを代替できるわけではなく……。"
221030-101 = "航海が数ヶ月にわたると、残り少ないデザートを巡って闇取引が起きたり――"
221030-102 = "艦長、お客様の前でそういう話は……。"
221030-103 = "まったく困ったものですよ！#n先月も、闇取引しようとした生徒を[ruby=私たち]トライデント[/ruby]が取り押さえました。#n残り10個だったミルクチョコレートを盗もうとしたんですよ！"
221030-104 = "その時の交換レートは、チョコ1個につき冷凍イワシ10kgだったとか。"
221030-105 = "[s] \"高いのか安いのか分からない……。\""
221030-106 = "……[ruby=こもり]小森[/ruby]さん。"
221030-107 = "あ、ああっ！し、失礼しました！"
221030-108 = "まあ、色々ありますが……それでも、新鮮な魚をいつでも確保できる点は、#nどの学園にも負けない強みです。"
221030-109 = "先生。このアジを持ってみてください。#nここで育てたアジはサバ並みに大きくなるので――"
221030-110 = ""
221030-115 = "サミー！"
221030-116 = "あのバカ猫……。"
221030-117 = "……失礼しました。すぐ連れ戻してきます。"
221030-118 = "[s] \"いや、私が呼んでみるよ。\""
221030-119 = ""
221030-122 = "[ns] \"サミー、こっちにおいで～\""
221030-123 = "……あ。"
221030-124 = "今の……口笛？"
221030-125 = "誰？吹いたの。"
221030-126 = "もー、最悪。[ruby=フェンダー]防舷材[/ruby]の在庫も十分じゃないのに。"
221030-127 = ""
221030-129 = ""
221030-130 = "[ns] \"あ、あれ……？何かやっちゃった？\""
221030-131 = "……船乗りの[ruby=タブー]禁忌[/ruby]でして。"
221030-132 = "禁忌、ですか……。"
221030-133 = "艦長。お二人の案内をお任せしてもよろしいですか？#n私はサミーを捕まえてから追いかけますので。"
221030-134 = "あ……う、うん。分かった。"
221030-135 = "それでは、私はまた後ほど。"
221030-137 = "ここは――"
221030-138 = "[s] \"もしかして、クルーズ船？\""
221030-139 = "お詳しいですね。"
221030-140 = "この船の名はゴールデンエリジウム。#nオデュッセイアの観光収入を一手に担うクルーズ運営部の旗艦であり、#n私たちの学生寮でもあります。"
221030-141 = "クルーズ運営部は数十隻のクルーズ船を管理し、#nお客様に娯楽とサービスを提供しています。"
221030-142 = "オデュッセイアを訪れたことがあるという方の多くは、#nクルーズ船を指している場合がほとんどですね。"
221030-143 = "先生であれば、[ruby=私たち]オデュッセイア[/ruby]のクルーズ船を利用されたこともあるのでは？"
221030-144 = "[s5] \"あると言えばあるし、ないと言えばないかな……。\"\n[s6] \"妙な格好の生徒がいたよ……。\""
221030-147 = "おや。どうやら素行の悪い生徒が運営する船に乗られたようですね。"
221030-148 = "部の統制を外れた船は、学園が許可していない服装を強要したり、#n商品に法外な値をつけて暴利を得たりしていると聞きます。"
221030-149 = "不快な思いをさせてしまったこと、学園を代表してお詫び申し上げます。"
221030-150 = "[s] \"いやいや、君たちのせいじゃないよ。\""
221030-151 = "あ、ちょうどクルーズ運営部の部長がいますね。"
221030-152 = "部の紹介は彼女にお願いしましょうか。"
221030-154 = "あら？お客様ですか？"
221030-157 = ""
221030-158 = "ゴールデンエリジウムへようこそ。チェックインはお済みでしょうか？"
221030-159 = "……あっ、申し遅れました。"
221030-160 = "このゴールデンエリジウムの総支配人であり、クルーズ運営部の部長を務める――#n[ruby=せんごく]千石[/ruby]ミツキと申します。以後、お見知りおきを。"
221030-161 = "[ns] \"こっちの格好も大概じゃないかなぁ！？\""
221030-162 = "と、おっしゃいますと？"
221030-163 = "もしかして、スカーフが少し曲がっていたでしょうか……。"
221030-164 = "[s] \"いや、その……。\""
221030-165 = "千石さん、念のためお伺いしますが……。"
221030-166 = "下を……お忘れでは？"
221030-167 = "下……？"
221030-168 = "ああ、どうやら誤解を生んでいるようですね。"
221030-169 = "ご安心ください。これは下着ではなく、水着ですので。"
221030-170 = "下着じゃなければ恥じることなんてないでしょう？"
221030-171 = "[ns] \"そう……かな？\""
221030-172 = "ええ。アイランドの承認を得ている、れっきとしたクルーズ運営部の制服です。"
221030-173 = "上は伝統的なクルーズクルーの制服形式を維持しつつ、#nいつでも海へ飛び込めるように、下は水着を採用しています。"
221030-174 = "部長が考案した制服ですので、部員も皆同じ服を着ているんですよ。"
221030-175 = "羞恥心もないはずです……おそらく。"
221030-176 = "[ns] \"なんで最後を濁したの……。\""
221030-177 = "ご心配には及びません。大切なのは制服ではありませんから。"
221030-178 = "さて、オデュッセイアにご滞在の間は、#n私たちクルーズ運営部が身の回りのお世話をさせていただきます。"
221030-179 = "アレルギー等はございますか？"
221030-180 = "お部屋はいかがいたしましょう。#n海が見える開放的なお部屋？それとも、宴会場に近い内側のお部屋がよろしいですか？"
221030-181 = "それと、下船される予定の港をお伺いしても？"
221030-182 = "ご滞在に不便があれば、部屋のルームメイドに何なりとお申しつけください。#n力の及ぶ限りお応えいたします。"
221030-183 = "クルーズ運営部の名にかけて――サービスに「100%」ご満足いただけると断言します！"
221030-184 = "ふふ、意欲的なのですね。#nご自身のお仕事にずいぶんと自信がおありのようで。"
221030-185 = "もちろんですとも。#n不満を口にされたお客様は、これまでただの1人もいらっしゃいませんでしたから。"
221030-186 = "もしもお疑いでしたら……賭けませんか？"
221030-187 = "私は、連邦生徒会長が100点をくださるほうに、#nこのゴールデンエリジウム号を賭けます！"
221030-188 = "賭け事の神髄はスリル！私は逃げも隠れもいたしません。#n言い逃れなど許さぬよう、契約書も用意しますので！"
221030-189 = "さあ……さあ、さあ、連邦生徒会長には何を賭けていただき――"
221030-190 = "相変わらずですね、千石さん。今度は何を賭けるつもりですか？"
221030-191 = "にゃお。"
221030-192 = "賭け！？はて、なんのことやら。"
221030-193 = "白を切らないでください。#nお客様に賭けを持ちかける趣味をお持ちなのは、周知の事実です。"
221030-194 = "だから[ruby=・]ゴ[/ruby][ruby=・]ー[/ruby][ruby=・]ル[/ruby][ruby=・]デ[/ruby][ruby=・]ン[/ruby][ruby=・]フ[/ruby][ruby=・]リ[/ruby][ruby=・]ー[/ruby][ruby=・]ス[/ruby][ruby=・]号[/ruby]を二束三文で持っていかれるんじゃないですか。"
221030-195 = "二束三文で持っていかれていませんが！？#nその発言、責任持てますか？"
221030-196 = "その言葉が間違ってるほうに、私は100万円賭けられま――"
221030-197 = ""
221030-199 = ""
221030-201 = "あいたっ！"
221030-202 = "失礼。優秀な方ではあるのですが、かなりのギャンブル中毒でして……。"
221030-203 = "もしも賭けを持ちかけられたら、#nどうかお二人は知らぬふりをしていただけると助かります。"
221030-204 = "[s] \"……だいたいは分かったよ。\""
221030-205 = ""
221030-206 = ""
221030-209 = "[ns] \"あのバニーガールはクルーズ運営部とは無関係なんだね？\""
221030-210 = ""
221030-211 = ""
221030-212 = "あ……はい。[ruby=・]耳[/ruby][ruby=・]の[/ruby][ruby=・]長[/ruby][ruby=・]い[/ruby][ruby=・]動[/ruby][ruby=・]物[/ruby]を真似た衣装のことですね？"
221030-213 = "当然、あのような破廉恥な衣装をクルーズ運営部が認めるはずがありません。"
221030-214 = "下がどうこう以前に、肩に何も羽織らないとは……なんてはしたない。"
221030-215 = "……もしかして、バニーガールも禁忌に含まれるのでしょうか？"
221030-216 = ""
221030-218 = ""
221030-219 = "あ、その……衣装の問題ではないのですが……。"
221030-220 = "「ウサギ」という言葉は船乗りにとって忌避すべきものです。"
221030-221 = "ご不便をおかけしますが、どうかご理解ください。"
221030-222 = "[s] \"ごめんね、私の配慮が足りなかったよ。\""
221030-223 = "…………。"
221030-224 = "では、次の船に移動しましょうか。"
221030-226 = "（その後も船を移動しながら、オデュッセイアの様々な部活を見学した）"
221030-236 = "（見学を終える頃には、太陽が水平線に沈みかけていた）"
221030-238 = "おや、もうこんな時間に……。"
221030-239 = "お時間を取らせないと言ったのに、申し訳ありません。#n動線の計算を誤ったようです。"
221030-240 = "[s] \"気にしないで。有意義だったよ。\""
221030-241 = "私も、想像以上に楽しい時間でした。"
221030-242 = "久しぶりに良い気分転換になりましたし……#n籠っていたら知り得なかっただろうことにも触れられましたから。"
221030-243 = "そう言っていただけて何よりです。"
221030-244 = "では、生徒会室に戻って本題に入る前に――"
221030-245 = "夕食をご一緒にいかがですか？"
221030-246 = "ふふ、今度は夕食のお誘いですか。"
221030-247 = "お招きいただけるのでしたら、遠慮なく。"
221030-248 = ""
221030-250 = ""
221030-251 = "艦長、分かってますか？今日の夕食は……。"
221030-252 = "あっ、そっか。すっかり忘れてた……。"
221030-253 = ""
221030-254 = "[ns] \"何か問題があるの？\""
221030-255 = "いえ、準備に問題はないと思います。"
221030-256 = "ただ、その……入港初日のメニューは「あれ」と決まっているのです。"
221030-257 = ""
221030-259 = ""
221030-260 = "……カレーでもよろしいでしょうか？"
221030-261 = ""
221030-263 = ""
221030-265 = "次回;白い制服とカレー"
