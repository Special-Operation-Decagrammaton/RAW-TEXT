221030-77 = "[ns] \"응? 이 배 말고 다른 배로 이동하는 거야?\""
221030-78 = "3;아미;20\n4;미나토;01;네. <올림포스 호>는 저희 아일랜드 부원들이 사용하는 기함이니까요.\n#4;m3\n#4;h\n#3;d"
221030-79 = "4;미나토;02;육지의 학원으로 치자면…… 학생회 건물과 비슷한 개념이라고 할까요?"
221030-80 = "4;미나토;01;오디세이아 학원의 부 활동은 항해를 전제로 이루어지고 있기 때문에 오디세이아의 거의 모든 동아리는 각자의 선박을 하나씩 보유하고 있답니다."
221030-81 = "4;미나토;03;동아리의 규모나 활동 방향에 따라 목적이 달라지기도 하니, 이를 비교해 보시는 것도 재미있는 경험이 되실 겁니다.\n#4;em;[음표]"
221030-82 = "[s] \"그렇게 말하니 기대가 되는데……!\""
221030-83 = "4;미나토;01;그럼, 제일 먼저 오디세이아 학원에서 가장 규모가 큰 동아리부터 소개해드리겠습니다."
221030-85 = "[ns3] \"이곳은……?\"\n[ns4] \"엄청나게 큰 수상 시설이네……\""
221030-88 = "3;미나토;01;네, 이곳은 <양식연구부>의 이동식 해상 양식 시설입니다.\n#3;a\n#3;em;[반응]"
221030-89 = "3;미나토;03;이곳에서 오디세이아 학원에서 소비하는 거의 대부분의 식량을 생산하고 있거든요."
221030-90 = "3;미나토;12;때문에 <양식연구부>는 오디세이아 학원에서 가장 많은 학생들이 활동중인 동아리이기도 하고, 가장 많은 활동비를 지원받는 동아리이기도 합니다."
221030-91 = "3;미나토;01;이 양식 시설을 통해 주식에 사용되는 다양한 물고기부터 문어와 오징어 같은 두족류는 물론이고, 미역과 김 같은 해조류도 얻을 수 있지요."
221030-92 = "3;미나토;11;이 양식 시설만 있다면 원양 항해가 아무리 길어지더라도 식량 보급만큼은 큰 문제가 없답니다!\n#3;em;[반짝]"
