[translation]
52140-1 = "제14화;화조풍월부의 괴예가"
52140-3 = "그, 그게 무슨 소리야……? 아자미 양이 화조풍월부의 부원이라니."
52140-4 = "그 말대로야. 여기 있는 하부 아자미는 에비스 분교의 학생이 아니라, 화조풍월부의 부원이었다는 거지."
52140-5 = "내 추측이 틀리지 않다면, 북방 자치구에서 사람을 습격해 왔다는 백물어 또한 그녀가 괴서를 통해 자아낸 괴담의 일부일 터."
52140-6 = "처음부터 우리는 그녀의 손아귀에서 놀아났던 셈이야."
52140-11 = "대단한 통찰력이시네요, 백화요란의 작전참모님."
52140-12 = "어차피 목적한 바를 이루었으니, 더 숨길 생각은 없었지만…… 어떻게 제가 화조풍월부의 부원이라는 사실을 깨달으셨나요?"
52140-13 = "비아냥거릴 생각이라면 그만둬. 그렇게 노골적으로 의심스러운 모습을 보여왔는데, 이제야 확신을 얻었다는 사실을 스스로도 용납하기 어려우니까."
52140-14 = "처음부터 수상한 점이라면 여럿 있었지. 우선 에비스 분교 인근의 주민들이 너를 처음 본다는 반응을 보였을 때부터."
52140-19 = "그때만 하더라도 단순히 평소에 마주칠 일이 없는 주민들뿐인가 싶었지만, 아무리 그래도 이 작은 마을에서 자치위원회의 회장을 모른다는 건 이해하기 어려워."
52140-20 = "그리고 야부키 슈로가 아야메 부장의 총격에 쓰러졌을 때."
52140-28 = "괴서의 신비는 백물어 뿐만 아니라 괴담가에게도 적용되는 데, 그때의 슈로는 마치 괴서의 힘을 다루지 못하는 것처럼 백련이 아닌 다른 총에 제압되었지."
52140-29 = "그 이후에도 슈로의 몸에서 괴서가 발견되지 않았던 점으로 미루어 보아…… 괴서를 갖고 있는 부원은 따로 존재했을 거야."
52140-32 = "그리고 마지막으로 이 저택에 새겨져 있는 문양…… 이 문양은 카데노코지 가문의 문양이야."
52140-33 = "20년 전, 카데노코지 가문이 그 사건 이후 백귀야행 중심부로 거처를 옮기기 전에 살았던 본채가, 아마 이 <피안의 저택>이었겠지."
52140-34 = "하지만 아무리 버려진 저택이라 하더라도, 오랫동안 이 일대의 영지를 다스리던 카데노코지 가문의 존재를 에비스 자치위원회에서 몰랐다는 건 말이 되지 않아."
52140-35 = "그럼에도 불구하고 이곳에 도달할 때까지 우리에게 그 사실을 숨겼다는 건…… 이 저택에 알리고 싶지 않은 무언가가 있어서였겠지."
52140-40 = "아하하…… 아하하하……!"
52140-41 = "정말 훌륭한 추리네요. 역시 백화요란의 작전참모다워요!"
52140-42 = "그럼 정체도 모두 탄로 난 것 같으니, 정식으로 다시 한 번 인사를 드릴까요."
52140-53 = "제 이름은 하부 아자미. 괴담의 주인이신 코쿠리코 님을 모시는 화조풍월부의 종자이자, 뱀의 혀로 사람을 홀리는 [ruby=뱀 여인]헤비온나[/ruby]이며—"
52140-54 = "괴서를 통해 괴예를 자아내는 괴예가이기도 하지요."
52140-55 = "이번에는 불민한 슈로 쨩을 대신하여 여러분을 이 <피안의 저택>까지 모시는 것이 제 임무였답니다."
52140-56 = "어떠셨나요, 즐거운 여행이 되셨는지?"
52140-57 = "이 녀석…… 그동안 태연한 얼굴로 사람을 속이고 있었다니, 가만두지 않겠어!"
52140-58 = "후후, 그 용기만큼은 가상하지만 딱하네요."
52140-59 = "샬레의 선생님도, 나구사 양도 없는 이 상황에 여러분이 저를 상대로 승산이 있다고 생각하시는 건가요?"
52140-60 = "……아니, 어차피 지금이라면 나구사 양도 제대로 된 전력이 되어주지 못할 테지만요."
52140-64 = "너…… 나구사 선배에게 무슨 짓을 한 거야?"
52140-65 = "글쎄요. 한 번 알아맞혀 보시겠어요? 지금쯤 당신들의 부부장이 어떤 꼴이 되어 있을지."
52140-69 = "아아…… 그래, 바로 그 표정이에요. 제가 바랐던 표정은."
52140-70 = "일견 분노를 가장하고 있지만, 앞으로 어떤 일이 벌어질지 알지 못한 두려움에서 피어나는 공포는 어떤 수를 쓰더라도 감출 수가 없지요."
52140-74 = "저의 괴서, <토테이붓카이로쿠>의 힘은 두려움에서 비롯된답니다."
52140-75 = "그 어떠한 두려움보다 여러분의 머릿속으로 떠올린 최악의 공포야말로, <토테이붓카이로쿠>의 삽화를 칠하는 데 가장 적합한 색을 발하니까요."
52140-90 = "자, 마음껏 상상하고 마음껏 두려워해 주시길."
52140-91 = "……여러분이 질식하여 마지막 숨을 토해낼 때까지 저의 이야기는 끝나지 않을 테니까요."
