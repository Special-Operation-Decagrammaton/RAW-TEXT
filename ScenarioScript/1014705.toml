[translation]
1014705-1 = "皐月的疼痛對策"
1014705-2 = "（和已經相當習慣下水的皐月一起出來玩水）"
1014705-3 = ""
1014705-6 = ""
1014705-7 = "呵呵，老師的水面手刀還挺厲害的嘛。這招能有效把海水濺到遠處。"
1014705-8 = "但是我京極皐月的──"
1014705-9 = ""
1014705-11 = ""
1014705-12 = "[ns] 「有破綻！」"
1014705-13 = "呀！？"
1014705-14 = ""
1014705-19 = "[ns] 「哇哈哈！趁你說話時攻擊！」"
1014705-20 = ""
1014705-21 = "嗚嗚，呸呸。鹹鹹的海水跑進嘴裡了……"
1014705-22 = ""
1014705-24 = ""
1014705-25 = "這是什麼……"
1014705-26 = ""
1014705-28 = ""
1014705-29 = "呀啊啊啊～！！"
1014705-30 = ""
1014705-34 = "[ns] 「冷，冷靜點！皐月！那只是海帶芽！」"
1014705-36 = ""
1014705-37 = "哈啊，哈啊……我還以為是從近海偷襲的未知觸手……"
1014705-38 = "又長又黑，軟趴趴的還黏在身上，感覺好噁心……！"
1014705-39 = "不管是海帶芽還是昆布，泡水的海藻摸起來都不太舒服呢……"
1014705-40 = "[s] 「抱歉……都怪我惡作劇……」"
1014705-41 = "哼嗯……居然露出那種表情。"
1014705-42 = "老師應該不是故意的，這次就原諒你吧。"
1014705-43 = "不過，大海果然是很可怕的地方呢。#n要是沒有仔細觀察，會嚇到人的東西實在太多了。"
1014705-44 = "不只海藻，還有那邊那個漂來漂去的……"
1014705-45 = "是水母！！"
1014705-46 = "呀啊啊！快躲開！"
1014705-47 = "對，就是那種東西。"
1014705-48 = "老師，你對水母很了解嗎？"
1014705-49 = "[s1] 點頭\n[s2] 搖頭"
1014705-52 = "老師應該也知道，水母是海邊最大的危險因素之一。"
1014705-53 = "像僧帽水母這類的毒性非常強，絕對不能碰。"
1014705-54 = "藍色？紫色？只要看到那種顏色的水母，就要馬上避開。"
1014705-55 = "當然也有沒有顏色的水母。#n聽說像箱型水母這類的是透明的，根本看不清楚。"
1014705-56 = "而且要是被螫到，聽說會非～～常非常痛，我最討厭了。"
1014705-57 = "[s] 「皐月，你知道得好清楚啊！」"
1014705-58 = "當然！"
1014705-59 = "我可是動員了萬魔殿情報部的所有力量，把海邊的危險因素都調查過了。"
1014705-60 = "……"
1014705-61 = "總，總之這裡有點可怕，我們再往那邊過去一點吧……"
1014705-63 = "（和皐月一起往旁邊移動時……）"
1014705-64 = ""
1014705-66 = ""
1014705-67 = ""
1014705-68 = ""
1014705-69 = ""
1014705-70 = "唔……在水裡走路比想像中還難呢。#n別放開我的手哦，老師。"
1014705-71 = ""
1014705-74 = "……？"
1014705-75 = "腳，腳上有東西……"
1014705-76 = ""
1014705-78 = ""
1014705-79 = "水母……！！水母在我腳上！！"
1014705-80 = ""
1014705-84 = "（還來不及查看發生了什麼事，皐月就抱了上來）"
1014705-85 = ""
1014705-87 = ""
1014705-88 = "水，水母！水母黏在我大腿上了！"
1014705-89 = "哈啊……！我完蛋了，老師！！"
1014705-90 = "要來了……最可怕的疼痛……！！就像有一千根針在刺我的大腿！！"
1014705-91 = ""
1014705-94 = "[ns3] 「這個……」\n[ns4] 「是塑膠袋耶。」"
1014705-97 = ""
1014705-98 = "……嗯？真的耶？"
1014705-99 = "是誰把這種東西亂丟在海邊的啊！？真是的！！"
1014705-100 = "呼……呼……哈啊……"
1014705-101 = "[s] 「你要一直這樣抱著嗎？」"
1014705-102 = "唔嗯……我被嚇得腿都軟了……"
1014705-103 = ""
1014705-105 = ""
1014705-106 = "老師的身體好溫暖呢。"
1014705-107 = ""
1014705-109 = ""
1014705-110 = ""
1014705-111 = "聽說在海邊，保持體溫是很重要的。"
1014705-113 = "（皐月就這樣好一陣子都沒有放開）"
1014705-114 = "（之後和皐月一起在海邊繞了一圈，清理塑膠袋之類的垃圾）"
