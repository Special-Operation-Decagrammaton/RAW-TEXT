[translation]
1014705-1 = "มาตรการรับมือความเจ็บปวดของซัตสึกิ"
1014705-2 = "(คุณครูออกมาเล่นน้ำกับซัตสึกิ ที่ตอนนี้คุ้นเคยกับการลงน้ำมากขึ้นแล้ว)"
1014705-3 = ""
1014705-6 = ""
1014705-7 = "ฮุฮุ ท่าใช้สันมือตีผิวน้ำของครูนี่ร้ายกาจใช้ได้เลยนะ เป็นเทคนิคที่ซัดน้ำทะเลให้กระเซ็นไปได้ไกล#nอย่างมีประสิทธิภาพเลย"
1014705-8 = "แต่ว่า เคียวโงคุ ซัตสึกิคนนี้..."
1014705-9 = ""
1014705-11 = ""
1014705-12 = "[ns] \"ได้จังหวะแล้ว!\""
1014705-13 = "ว้าย?!"
1014705-14 = ""
1014705-19 = "[ns] \"อะฮะฮ่า! โจมตีตอนกำลังพูดอยู่นี่ละ!\""
1014705-20 = ""
1014705-21 = "อึก ถุย ถุย น้ำทะเลเค็มๆ เข้าปากเลย..."
1014705-22 = ""
1014705-24 = ""
1014705-25 = "นี่อะไร..."
1014705-26 = ""
1014705-28 = ""
1014705-29 = "ว้ายยยย!!"
1014705-30 = ""
1014705-34 = "[ns] \"จะ... ใจเย็นๆ ก่อน! ซัตสึกิ! แค่สาหร่ายเอง!\""
1014705-36 = ""
1014705-37 = "แฮ่ก แฮ่ก... นึกว่าเป็นหนวดปริศนาที่โผล่มาจู่โจมจากชายฝั่งซะอีก..."
1014705-38 = "ทั้งยาว ทั้งดำ ทั้งอ่อนยวบยาบ แถมยังติดหนึบอีก สัมผัสแบบนี้น่าขยะแขยงชะมัด...!"
1014705-39 = "จะวากาเมะหรือคอมบุก็เถอะ สาหร่ายเปียกน้ำนี่ไม่ใช่สัมผัสที่ดีเลยจริงๆ..."
1014705-40 = "[s] \"ขอโทษนะ... เพราะครูเล่นแผลงๆ แท้ๆ...\""
1014705-41 = "หืม... อะไรกัน สีหน้าแบบนั้น"
1014705-42 = "ครูคงไม่ได้ตั้งใจหรอก ครั้งนี้ฉันจะยกโทษให้ก็แล้วกัน"
1014705-43 = "แต่ว่านะ ทะเลนี่น่ากลัวจริงๆ ด้วย ถ้าไม่ระวังดีๆ ก็มีอะไรให้ตกใจเต็มไปหมดเลย"
1014705-44 = "ทั้งสาหร่าย แล้วก็ที่ลอยฟ่องอยู่ตรงโน้น..."
1014705-45 = "แมงกะพรุนนี่นา!!"
1014705-46 = "ว้ายย! หลบเร็ว!"
1014705-47 = "ใช่ ก็อย่างที่ฉันว่านั่นละ"
1014705-48 = "ครู รู้เรื่องแมงกะพรุนดีหรือเปล่า?"
1014705-49 = "[s1] (พยักหน้า)\n[s2] (ส่ายหน้า)"
1014705-52 = "ครูก็คงรู้อยู่แล้ว แต่แมงกะพรุนเป็นหนึ่งในปัจจัยเสี่ยงสุดอันตรายในทะเลเลยนะ"
1014705-53 = "อย่างแมงกะพรุนกระดุมฟ้าเนี่ย มีพิษร้ายแรงมาก ห้ามจับเด็ดขาดเลย"
1014705-54 = "ถ้าเจอแมงกะพรุนที่ดูเป็นสีฟ้าๆ หรือม่วงๆ ละก็ ให้หลบทันทีเลยนะ"
1014705-55 = "แน่นอนว่าแมงกะพรุนที่ไม่มีสีก็มี อย่างแมงกะพรุนกล่อง ว่ากันว่าตัวใส จนแทบมองไม่เห็นเลยละ"
1014705-56 = "แถมถ้าโดนต่อยเข้าละก็ ได้ยินว่าเจ็บสุดๆ~~ เลยนะ ฉันไม่เอาด้วยเด็ดขาด"
1014705-57 = "[s] \"ซัตสึกิรู้เยอะมากเลยนะ!\""
1014705-58 = "แน่นอน!"
1014705-59 = "ฉันเกณฑ์ฝ่ายข่าวกรองทั้งหมดของแพนเดโมเนียม โซไซตี้ แล้วให้ไปสืบเรื่องอันตรายทุกอย่างบน#nชายหาดไว้แล้ว"
1014705-60 = "..."
1014705-61 = "ยะ... ยังไงก็เถอะ ตรงนี้มันน่ากลัว เราไปทางโน้นอีกหน่อยเถอะ ครู..."
1014705-63 = "(ระหว่างที่ขยับไปข้างๆ พร้อมกับซัตสึกิ...)"
1014705-64 = ""
1014705-66 = ""
1014705-67 = ""
1014705-68 = ""
1014705-69 = ""
1014705-70 = "อึก... เดินในน้ำนี่ยากกว่าที่คิดแฮะ อย่าปล่อยมือนะ ครู"
1014705-71 = ""
1014705-74 = "...?"
1014705-75 = "ทะ... ที่ขาฉันมีอะไรบางอย่าง..."
1014705-76 = ""
1014705-78 = ""
1014705-79 = "แมงกะพรุน...!! แมงกะพรุนเกาะขา!!"
1014705-80 = ""
1014705-84 = "(ซัตสึกิเข้ามากอดคุณครูไว้แน่น โดยที่ยังไม่ทันได้ดูว่าเกิดอะไรขึ้น)"
1014705-85 = ""
1014705-87 = ""
1014705-88 = "มะ... แมงกะพรุน! แมงกะพรุนเกาะต้นขาฉัน!"
1014705-89 = "ฮือ...! ฉันจบเห่แล้ว ครู!!"
1014705-90 = "มันกำลังจะมาแล้ว... ความเจ็บปวดที่เลวร้ายที่สุด...!!#nความรู้สึกเหมือนโดนเข็มนับพันเล่มทิ่มต้นขา!!"
1014705-91 = ""
1014705-94 = "[ns3] \"นี่มัน... ถุงพลาสติก?\"\n[ns4] \"ถุงพลาสติกนี่นา\""
1014705-97 = ""
1014705-98 = "หืม...? จริงด้วย?"
1014705-99 = "ใครกันมาทิ้งของแบบนี้ลงทะเลส่งเดชเนี่ย?! จริงๆ เลย!!"
1014705-100 = "ฮู่ว... ฮู่ว... เฮ้อ..."
1014705-101 = "[s] \"จะอยู่แบบนี้ต่อไปเหรอ?\""
1014705-102 = "อื้ม... ฉันตกใจหนักจนหมดแรงเลย..."
1014705-103 = ""
1014705-105 = ""
1014705-106 = "ตัวครูอุ่นมากเลยนะ"
1014705-107 = ""
1014705-109 = ""
1014705-110 = ""
1014705-111 = "ได้ยินว่าที่ทะเล การรักษาอุณหภูมิร่างกายเป็นเรื่องสำคัญน่ะ"
1014705-113 = "(ซัตสึกิกอดคุณครูอยู่แบบนั้นอีกพักใหญ่)"
1014705-114 = "(หลังจากนั้นคุณครูก็เดินเก็บขยะอย่างถุงพลาสติกรอบชายหาดไปกับซัตสึกิ)"
