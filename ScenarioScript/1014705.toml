[translation]
1014705-1 = "사츠키의 고통 대책"
1014705-2 = "(이제 물에 들어가는 게 꽤 익숙해진 사츠키와 물놀이를 하러 나왔다.)"
1014705-7 = "후후, 선생의 수면 손날 치기는 제법 매섭네.#n바닷물을 효과적으로 멀리까지 튕겨 보낼 수 있는 기술이야."
1014705-8 = "하지만 이 쿄고쿠 사츠키의……"
1014705-12 = "[ns] \"빈틈!\""
1014705-13 = "꺅?!"
1014705-19 = "[ns] \"와하하! 말하는 틈에 공격이다!\""
1014705-21 = "으으, 퉤퉤. 짠 바닷물이 입안에 들어갔어……."
1014705-25 = "이건 뭐……."
1014705-29 = "꺄아아악-!!"
1014705-34 = "[ns] \"지, 진정해! 사츠키! 그냥 미역이야!\""
1014705-37 = "하아, 하악…… 연안에서 습격해 오는 미지의 촉수라고 생각했어……."
1014705-38 = "길고, 검고, 흐느적거리고, 달라붙는 감촉이 불쾌해……!"
1014705-39 = "미역이든, 다시마든 물에 젖은 해조류는 썩 좋은 느낌이 아니구나……."
1014705-40 = "[s] \"미안…… 내가 장난치는 바람에…….\""
1014705-41 = "흐응…… 뭐야, 그 얼굴."
1014705-42 = "선생이 일부러 한 건 아닐 테니까, 이번엔 용서해 주도록 할게."
1014705-43 = "그런데, 새삼 바다는 무서운 곳이네.#n잘 살피지 않으면 깜짝 놀랄 수 있는 것들이 너무 많아."
1014705-44 = "해조류도 그렇고, 저기 저쪽에 둥실둥실 떠 있는……"
1014705-45 = "해파리다!!"
1014705-46 = "꺄아악! 피해!"
1014705-47 = "그래, 저런 거 말이야."
1014705-48 = "선생, 해파리에 대해 잘 알고 있어?"
1014705-49 = "[s1] (끄덕끄덕)\n[s2] (도리도리)"
1014705-52 = "선생도 알고 있겠지만, 해파리는 바닷가에서 가장 큰 위험 요소 중 하나야."
1014705-53 = "실제로 푸른우산해파리 같은 종류는 독성이 아주 높아서 만지는 건 절대 금지야."
1014705-54 = "파란색? 보라색? 그런 느낌의 해파리를 보게 되면 즉시 피하도록 해."
1014705-55 = "물론 색이 없는 해파리도 있어.#n상자해파리 같은 종류는 투명해서 잘 보이지도 않는대."
1014705-56 = "그러면서 쏘이기라도 하면 정~~말 정말 아프다고 하니까, 완전 싫지."
1014705-57 = "[s] \"사츠키, 엄청 잘 알고 있네!\""
1014705-58 = "물론!"
1014705-59 = "만마전 정보부의 역량을 총동원해서 해변가의 모든 위험 요소에 대해 조사했거든."
1014705-60 = "……."
1014705-61 = "아, 아무튼 무서우니까 조금 더 저쪽으로 가자. 선생……."
1014705-63 = "(사츠키와 함께 옆으로 이동하던 중…….)"
1014705-70 = "으…… 물속에서 걷는 건 생각보다 어렵네.#n손 놓지 말아 줘, 선생."
1014705-74 = "……?"
1014705-75 = "다, 다리에 뭔가가……"
1014705-79 = "해파리……!! 해파리가 다리에!!"
1014705-84 = "(무슨 일인지 살필 새도 없이 사츠키가 껴안아 왔다.)"
1014705-88 = "해, 해파리가! 해파리가 허벅지에 붙었어!"
1014705-89 = "하앙……! 나는 이제 끝났어, 선생!!"
1014705-90 = "이제 올 거야…… 최악의 고통이……!!#n허벅지를 천 개의 바늘로 쑤시는 듯한 감각이!!"
1014705-94 = "[ns3] \"이거……\"\n[ns4] \"비닐봉지네.\""
1014705-98 = "……응? 진짜네?"
1014705-99 = "누가 이런 걸 바닷가에 함부로 투기하는 거야?! 정말!!"
1014705-100 = "후우…… 후우…… 하아……."
1014705-101 = "[s] \"이대로 계속 있을 거야?\""
1014705-102 = "으응…… 잔뜩 놀랐더니 진이 다 빠졌어……."
1014705-106 = "선생의 몸, 엄청 따뜻하네."
1014705-111 = "바닷가에서는 체온을 유지하는 것이 중요하대."
1014705-113 = "(사츠키는 그대로 한참 동안 떨어지지 않았다.)"
1014705-114 = "(이후에 사츠키와 함께 해변을 돌면서 비닐봉지 등 쓰레기를 치웠다.)"
