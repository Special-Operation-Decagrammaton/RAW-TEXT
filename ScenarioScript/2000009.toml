[translation]
2000009-1 = "이 밤을 당신에게!"
2000009-2 = "밀레니엄 학원 복도"
2000009-3 = "선생님!"
2000009-4 = "와주었구나."
2000009-5 = "고마워. 하지만 제대로 인사할 시간도 없을 것 같네."
2000009-6 = "지금 다리 저편에 있는 밀레니엄 제1 발전소에, 누군가 장난을 쳤어."
2000009-7 = "아마 밀레니엄을 시기하는, 어느 불량조직의 소행이 아닐까 싶지만."
2000009-8 = "이대로는 밀레니엄 학원에 전기공급이 끊겨버려."
2000009-9 = "지금은 날이 밝아서 괜찮지만……"
2000009-10 = "밤이 될 때까지 이 사태를 해결하지 못하면……"
2000009-11 = "밀레니엄은 어둠에 휩싸일 거야."
2000009-12 = "[s] \"아니…… 그 정도까지야.\""
2000009-13 = "나는 농담을 하는 게 아니야."
2000009-14 = "과학의 첨단을 달리는 학교답게, 양초나 램프조차도 드물 테니까."
2000009-15 = "게다가…… 오늘 밤부터 밀레니엄 야경 행사가 시작되는데……"
2000009-16 = "이날을 기다려왔던 학생은…… 분명 많을 거야."
2000009-17 = "일단 나부터가 그러니까!"
2000009-18 = "우리가 할 일은, 망가진 발전소를 수리하는 거야."
2000009-19 = "다른 엔지니어부 선배들은 내부의 동력원 수리에 전력을 다하고 있어."
2000009-20 = "발전소 쪽은, 내 담당이기 때문에 내가 가야 해."
2000009-21 = "도와줘. 선생님."
2000009-23 = "밀레니엄 제1발전소"
2000009-25 = "으음. 생각보다 심각한데."
2000009-26 = "전투가 치열했나 봐."
2000009-28 = "선생님! 시작하자!"
2000009-30 = "우선 1번 코어 확인…… 윽. 완전히 박살 났네."
2000009-31 = "가져온 보조 코어로 전환…… 좋아……. 1번 코어 연결!"
2000009-32 = "에너지 가동 확인, 다행이다. 전원부는 무사해."
2000009-33 = "하지만…… 이대로는 끝이 없겠어."
2000009-34 = "만약 13번 코어까지 전부 이 상태라면……"
2000009-35 = "당장 시작해도…… #n밤이 되기 전에 시간을 못 맞출지도."
2000009-37 = "3번 코어도 확인! #n다행히 상태가 심각하지는 않으니 전선만 수복하면……!"
2000009-39 = "7번 코어…… 간신히 수리 완료. #n하아. 겨우 연결되었네."
2000009-40 = "[s1] \"조금 쉬는 게 어때?\"\n[s2] \"앞으로 얼마나 남았어?\""
2000009-41 = "……이제…… 겨우 절반 정도야."
2000009-42 = "……이제…… 겨우 절반 정도야."
2000009-43 = "어떡하지. 이대로 시간을 맞추지 못하면……"
2000009-44 = "…… 흑."
2000009-45 = "[s3] \"포기하지마.\"\n[s4] \"하루 정도는 문명의 도움 없이 살아보는 것도 나쁘지 않아.\""
2000009-47 = "……그래"
2000009-49 = "……아니야!"
2000009-50 = "포기할 순…… 없어."
2000009-51 = "설령 이대로 시간을 맞추지 못한다고 해도……"
2000009-52 = "이대로 포기해 버리면, 밀레니엄의 마이스터가 아니야."
2000009-53 = "그렇게…… 말해주려던 거지? 선생님."
2000009-54 = "응. 해볼게."
2000009-56 = "할 수 있는 데까지…… 응?"
2000009-57 = "……8번…… 양호?"
2000009-58 = "서, 설마?!"
2000009-59 = "9, 9번도 거의 새것인데?"
2000009-60 = "새, 생각보다 빨리 끝날지도!"
2000009-61 = "선생님!"
2000009-63 = "서둘러!"
2000009-65 = "13번 코어까지 연결, 시스템을 재기동합니다."
2000009-66 = "(우우우우우웅)"
2000009-67 = "제발…… 제발……"
2000009-69 = "(파아아앙!)"
2000009-70 = "와아! 성공이다!"
2000009-71 = "저, 정말 고마워 선생님!"
2000009-72 = "덕분에 발전소의 동력을 재가동 시킬 수 있었어."
2000009-73 = "물론 미봉책인 부분도 많아서, 나중에 제대로 정비해야겠지만……"
2000009-76 = "……"
2000009-77 = "……선생님. 도와준 보답을 하고 싶어."
2000009-78 = "예전에, 불꽃놀이보다 멋진 걸 보여주겠다고 약속했던 거…… 기억해?"
2000009-79 = "오늘 그 보답을, 할 수 있을 것 같아."
2000009-82 = "잠깐 밖으로 나가보지 않을래?"
2000009-86 = "이미 몇 번이나 말했지만…… 다시 한번 말할게."
2000009-89 = "[wa:1000]― 고마워 [wa:500]선생님. [wa:1500]이 풍경은, [wa:1000]선생님 덕분에 이루어졌어."
2000009-91 = "― 아름답지? [wa:2700]시간 맞춰 다행이야."
2000009-94 = "― 응? [wa:1000]왜 [wa:1000]이렇게까지 [wa:1000]노력했냐고?"
2000009-96 = "― 밀레니엄의 여학생들이 [wa:1700]안전하게……"
2000009-99 = "― 빛나는 밤거리를 걷게 해주고 싶었으니까."
2000009-102 = "[wa:500]― 내가 할 수 있는 건, [wa:1800]이런 것 밖에 없으니까."
2000009-105 = "― 그리고 [wa:800]내게도……."
2000009-107 = "― 이런 순간은 [wa:1600]이미 [wa:400]'선물' 그 이상이야."
2000009-110 = "[wa:3000]― 어때. [wa:500]선생님. [wa:1500]아직 시간이 있으니까……"
2000009-112 = "― 좀 더…… [wa:1300]함께 있어줄래?"
2000009-115 = "이상한 기분이야."
2000009-116 = "사실 언제나 봐오던, 익숙한 풍경인데."
2000009-117 = "선생님이 함께라면…… 이렇게나……"
2000009-118 = "……"
2000009-119 = "……아름답지?"
