[translation]
10046025-3 = "이야, 이치카 쨩~ 다짜고짜 너무하지 않아? 우리가 생판 남도 아닌데."
10046025-4 = "차라리 남이면 좋겠슴다!"
10046025-5 = "참~ 선수끼리 왜 이러실까?"
10046025-6 = "누가 선수임까!! 아까부터 촐랑촐랑!! 거기 서십쇼!!"
10046025-7 = "와~하핫! 야생마처럼 기운 넘치는구만!"
10046025-12 = "…………."
10046025-16 = "아, 죄송합니다. 잠깐 넋을 놓았군요."
10046025-17 = "저렇게 감정을 드러내는 이치카 모습은 처음 봐서요."
10046025-18 = "특히 저 카스미라는 게헨나 학생에게는…… 무슨 악연이라도 있는 걸까요?"
10046025-19 = "[s1] \"그게 말하자면 좀 긴데.\"\n[s2] \"쏘 배드 하드 새드 스토리…….\""
10046025-24 = "……? 잘은 모르겠지만, 뭔가 있긴 했군요."
10046025-30 = "으으으음~ 역시 정면승부는 시기상조인가! 다들 철수! 철수!"
10046025-38 = "도망치게 둘 거 같슴까! 하스미 선배! 제가 몰겠습니다!"
10046025-42 = "후후, 첫 합동 작전 때가 떠오르네요. 좋습니다, 제가 배후를 잡죠."
10046025-47 = "다들 잠깐만!!"
10046025-51 = "……미카 님?"
10046025-57 = "부탁이야. 더는 온천개발부를 쫓지 말아줘."
10046025-58 = "하지만 그러면 온천개발부는……."
10046025-59 = "응, 알아. 언젠가 다시 돌아와서 이 프라이빗 비치를 엉망진창으로 만든다는 거지?"
10046025-60 = "하지만 이제 곧 나기 쨩이 도착할 테니까."
10046025-64 = "이번 일정의 목표는, 나기 쨩이 편하게 쉴 시간을 만들어주는 것."
10046025-65 = "만약 싸우는 모습을 보거나, 그런 흔적을 발견한다면, 나기 쨩은 분명 크게 걱정할 거야."
10046025-66 = "그러니까, 게헨나를 쫓건, 그 아이들을 어떻게 체포하건…… 우선은 그다음이라고 생각해."
10046025-67 = "정말로 필요하다면 아예 해변의 일부를 조금 내어줘도 괜찮아. 제일 중요한 건……."
10046025-72 = "소란 피우지 않는 것……. 나기 쨩이 나서지 않게 하는 것……."
10046025-73 = "……응."
10046025-74 = "두 사람도, 선생님도 미안해. 하지만 이번 일정만큼은, 그렇게 도와줬으면 해."
10046025-75 = "[s3] \"훌륭하네, 미카는.\"\n[s4] \"나도 힘껏 도와줄게.\""
10046025-82 = "……부끄럽습니다. 소임에 맞지 않은 행동을 하고 말았군요."
10046025-83 = "네, 그랬었죠. 이번 일정은 무엇보다 나기사 님을 편하게 해드리기 위한 것……."
10046025-84 = "말씀대로 해야 할 정리부터 하고 하는 게 먼저네요. 면목 없슴다."
10046025-88 = "빠르게 정리하죠. 시간이 없으니까요."
10046025-96 = "……어마어마하군요."
10046025-97 = "건물 한두 채는 지을 정도의 공사 자재…… 대체 여기서 뭘 하려 했던 걸까요?"
10046025-98 = "온천, 이겠죠, 아마도."
10046025-99 = "……과연, 온천개발부의 악명이 헛되지 않았군요."
10046025-100 = "그래도 이 정도 자재를 압수했으니, 곧바로 재기할 수는 없을 겁니다."
10046025-101 = "……최소한 이번 바캉스 기간에는 잠잠하겠죠."
10046025-102 = "아하하…… 응, 그러면 좋겠네."
10046025-103 = "이번 바캉스만 무사히 끝난다면."
10046025-104 = "응, 이번 바캉스만 무사히 끝나면 어떻게 돼도 좋으니까."
10046025-108 = "미카 님?"
10046025-112 = "아무것도 아니야."
10046025-113 = "다들 고마워."
10046025-115 = "아, 아니요! 당연한 일을 했을 뿐임다!"
10046025-117 = "그렇습니다."
10046025-118 = "그냥, 전하고 싶었어."
10046025-119 = "……헤헤."
10046025-121 = "……? 미카 님……??"
10046025-122 = "[s5] \"……미카?\"\n[s6] \"갑자기 웃었다……?\""
10046025-127 = "아, 으으응. 아무것도 아니야. 그냥 좀……."
10046025-128 = "뭔가……. 이번 일정은 잘될 것 같아! 모두 덕분인지, 뭔가 느낌이 좋네?"
10046025-129 = "……응!"
10046025-130 = "다 잘될 거야! 꼭!!"
