[translation]
901010800220-6 = "흐음……."
901010800220-10 = "FOX 2, 뭔가 문제라도 있어?"
901010800220-11 = "이쪽은 식료품을 보관하는 구역 같은데, 이상한 점이 하나 있어."
901010800220-15 = "……게가 너무 많아."
901010800220-16 = "게?"
901010800220-17 = "응. 다른 식재료는 물론이고 생선 같은 다른 해산물도 거의 없는데— 게 상자만 이상할 정도로 잔뜩 쌓여 있어."
901010800220-18 = "양이 얼마나 되는데?"
901010800220-19 = "게 열 마리씩 담긴 상자가 스무 상자 정도 있으니까…… 대략 200마리 정도?"
901010800220-20 = "엄청난 양이네. 그렇게 많은 게를 어디에 쓰려고 산 걸까?"
901010800220-22 = "저녁 식사에라도 쓰려고 하는 거 아냐?"
901010800220-23 = "아무리 게를 좋아하는 사람이라도 저 정도 양은 한 번에 다 못 먹을걸."
901010800220-24 = "나약해졌구나, FOX 3. 1학년 때 훈련을 마치고 저녁 식사로 특대 사이즈 규동을 주문하던 모습이 아직도 눈에 선한데……"
901010800220-28 = "그냥 대 사이즈였거든? 그리고 갑자기 그 얘기가 왜 나오는 거야?!"
901010800220-29 = "나는 한 가지 음식을 계속해서 먹을 수 있는 푸드 파이터가 아니거든."
901010800220-31 = "FOX 2. 게가 든 상자의 수량과 규모를 좀 더 정확히 파악해 줘."
901010800220-32 = "작전이 끝난 뒤에 게의 출처에 대해 조사해 둘 테니."
901010800220-33 = "알겠어."
