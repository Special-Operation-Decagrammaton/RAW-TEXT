[translation]
901010800220-6 = "唔嗯……"
901010800220-7 = ""
901010800220-9 = ""
901010800220-10 = "FOX2，有什麼問題嗎？"
901010800220-11 = "這邊似乎是保管食品的區域，不過有一個奇怪的地方。"
901010800220-12 = ""
901010800220-14 = ""
901010800220-15 = "……螃蟹太多了。"
901010800220-16 = "螃蟹？"
901010800220-17 = "嗯。不只是其他食材，就連魚之類的水產幾乎都沒有──#n唯獨裝螃蟹的箱子堆得滿滿的，數量多到不正常。"
901010800220-18 = "大概有多少？"
901010800220-19 = "每箱裝十隻螃蟹的箱子大約有二十箱……大概200隻左右吧？"
901010800220-20 = "好驚人的數量……買那麼多螃蟹是要拿來做什麼啊？"
901010800220-22 = "會不會是想拿來當晚餐啊？"
901010800220-23 = "再怎麼愛吃螃蟹的人，那種數量也不可能一次吃完吧。"
901010800220-24 = "看來你退步了呢，FOX3。#n你1年級訓練結束後點特大份牛丼當晚餐的模樣，我到現在都還歷歷在目呢……"
901010800220-25 = ""
901010800220-27 = ""
901010800220-28 = "那明明是大份的好嗎！？而且怎麼突然提起那件事啊！？"
901010800220-29 = "我又不是那種可以一直吃同一種食物的大胃王！"
901010800220-31 = "FOX2，再幫我更精確地掌握裝螃蟹箱子的數量和規模。"
901010800220-32 = "作戰結束後我會去調查螃蟹的來源。"
901010800220-33 = "我知道了。"
