[translation]
901010800220-6 = "ฮืม..."
901010800220-7 = ""
901010800220-9 = ""
901010800220-10 = "FOX 2 มีปัญหาอะไรงั้นเหรอ?"
901010800220-11 = "ตรงนี้เหมือนจะเป็นพื้นที่เก็บวัตถุดิบอาหาร แต่มีจุดที่แปลกอยู่อย่างหนึ่ง"
901010800220-12 = ""
901010800220-14 = ""
901010800220-15 = "มีปูอยู่เพียบเลย..."
901010800220-16 = "ปูเหรอ?"
901010800220-17 = "อื้อ วัตถุดิบอย่างอื่นก็ไม่มี แม้แต่อาหารทะเลชนิดอื่นอย่างปลาก็แทบไม่เห็น มีแต่ลังปูที่กองไว้เยอะผิดปกติ"
901010800220-18 = "เยอะแค่ไหนเหรอ?"
901010800220-19 = "มีลังที่ใส่ปูลังละ 10 ตัวอยู่ประมาณ 20 ลัง... งั้นก็มีปูราวๆ 200 ตัวได้?"
901010800220-20 = "เยอะมากเลยนะ ซื้อปูเยอะขนาดนั้นไปทำอะไรกัน?"
901010800220-22 = "หรือจะเอาไว้ทำอาหารเย็น?"
901010800220-23 = "ต่อให้เป็นคนที่ชอบปูมากแค่ไหน ก็กินปริมาณขนาดนั้นหมดในมื้อเดียวไม่ได้หรอก"
901010800220-24 = "เธออ่อนแอลงแล้วสินะ FOX 3 ภาพตอนปี 1 ที่เธอสั่งข้าวหน้าเนื้อชามใหญ่พิเศษเป็นมื้อเย็น#nหลังฝึกซ้อมเสร็จยังติดตาฉันอยู่เลย..."
901010800220-25 = ""
901010800220-27 = ""
901010800220-28 = "แค่ชามใหญ่เฉยๆ ต่างหาก? ไม่ใช่ใหญ่พิเศษ แล้วจู่ๆ จะขุดเรื่องนั้นขึ้นมาทำไม?!!"
901010800220-29 = "ฉันไม่ใช่นักกินแหลกที่จะกินอาหารเมนูเดียวเรื่อยๆ ได้หรอกนะ"
901010800220-31 = "FOX 2 ช่วยยืนยันจำนวนและขนาดของลังปูให้ชัดเจนกว่านี้หน่อย"
901010800220-32 = "หลังจบปฏิบัติการ ฉันจะไปสืบที่มาของปูพวกนี้เอง"
901010800220-33 = "เข้าใจแล้ว"
