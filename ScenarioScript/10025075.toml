[translation]
10025075-5 = "……그믐날이 다 되었는데도, 어째서 마을에 생기가 도는 거지?"
10025075-6 = "<깊은 곳의 존재들>이 두려워 문밖으로는 나오지도 않던 사람들이 해변에서 물고기를 낚고 음식을 즐기고 있다니……"
10025075-7 = "……이게 다 그 외지인 녀석들 때문이야. 그 녀석들이 이 마을에 쓸데없는 희망을 불어넣었어."
10025075-8 = "마을 사람들이 전설을 어찌 여기는지는 중요하지 않지만, 혹여라도 이 <배>의 정체가 들통나면 곤란한데……"
10025075-13 = "저, 대표…… 아니, 선장."
10025075-14 = "내일 새벽에 하기로 한 선적 작업은 나중으로 미룰까요?"
10025075-18 = "……아니. 큰 돈을 벌 수 있는 기회인데, 고작 사람의 시선 따위가 두려워 사업을 미룰 수는 없지."
10025075-19 = "선적은 강행한다. 어차피 내일 오전에는 안개가 짙을 테니 배가 눈에 쉽게 띄진 않을 거야."
10025075-20 = "게다가 이쪽의 정체를 들킨다 하더라도, 대단한 무기도 없는 촌 동네의 주민들쯤이야…… 무력으로 찍어 누르면 그만이지."
10025075-21 = "그럼 내일 아침에 예정대로 배를 <도깨비의 암초> 근처에 접안시키겠습니다."
10025075-27 = "마을의 모든 새우를 긁어모았으니, 분명 이번에야말로 큰돈을 손에 쥘 수 있을 거야."
10025075-28 = "남은 돈을 챙기고 배를 모두 처분하고 나면……"
10025075-29 = "이 축축하고 비린내 나는 마을과도 작별이다!"
