[translation]
10059005-1 = "프롤로그;우연한(?) 만남"
10059005-3 = "(화창한 어느 날…….)"
10059005-4 = "(발레 공연의 초대장을 받아 무용 예술회관을 찾았다.)"
10059005-7 = "무용 예술회관"
10059005-8 = "[ns] \"이야, 공연 관람하기 정말 좋은 날씨네.\""
10059005-11 = "아이고, 어서 오십시오 선생님."
10059005-12 = "이렇게 무용 예술의 증진에 힘써 주셔서 정말 감사합니다."
10059005-13 = "오늘 준비된 공연은 발레 갈라 콘서트. 여러 작품의 하이라이트를 풍성하게 즐길 수 있는 구성이죠."
10059005-17 = "자, 이쪽으로. 가장 좋은 자리를 마련해 두었습니다. 부디 편안한 관람 되시길."
10059005-19 = "(그리하여 도착한 예술회관 내부.)"
10059005-23 = "(지정된 자리에 앉았다.)"
10059005-25 = "[ns] \"벌써 두근두근하네.\""
10059005-30 = "아니 이럴 수가. 저분은 [USERNAME] 선생님이네요."
10059005-31 = "후후, 정말이네요. 반갑습니다, 선생님."
10059005-32 = "[s] \"오, 날 아는구나? 반가워.\""
10059005-33 = "이렇게 우연히 만날 줄은 몰랐네요."
10059005-34 = "사실 이전부터 꼭 뵙고 싶었답니다. 선생님에겐 신세 진 것이 있거든요."
10059005-39 = "해석을 하자면…… 계속 복수할 기회를 노리고 있었다는 뜻입니다."
10059005-43 = "[ns] \"……?!\""
10059005-44 = "후후, 카논 서기관. 그렇게 말하면 제가 꼭 선생님을 미워하는 것 같잖아요?"
10059005-45 = "걱정 마세요, 선생님. 어느 쪽이냐 묻는다면 저는 선생님을 좋아하는 쪽이니까."
10059005-49 = "정. 말. 로. 요."
10059005-53 = "[ns] \"나…… 너희에게 뭔가 잘못한 게 있었던 걸까?\""
10059005-54 = "그럴 리가요."
10059005-55 = "말씀드렸듯, 저는 선생님을 좋아하는 쪽이랍니다."
10059005-56 = "그런 의미에서……."
10059005-61 = "이 티켓에 사인을 부탁드립니다."
10059005-62 = "선생님과 이 자리에서 만난 걸 기념하고 싶어요."
10059005-66 = "해석하자면…… 이 기회에 당신의 필체를 미리 확인해 두고 싶다는 뜻입니다."
10059005-67 = "위조가 쉬운 필체라면 거래 시에 주의가 필요할 테니까요."
10059005-68 = "후후, 카논 서기관. 그렇게 말하면 제가 꼭 선생님을 믿지 않는 것 같잖아요?"
10059005-69 = "걱정 마세요, 선생님. 저는 선생님을 상당히 신뢰하고 있으니까."
10059005-70 = "진. 심. 으. 로. 요."
10059005-71 = "자. 그런 의미에서 어서 사인을 부탁드립니다."
10059005-75 = "[ns] \"아, 알았어……!\""
10059005-79 = "후후, 협조해 주셔서 정말 감사합니다. 이건 제 박물관에 소중히 보관할게요."
10059005-80 = "[s] \"박물관?\""
10059005-81 = "네. 저는 개인 박물관에 다양한 물건을 수집하는 취미가 있거든요."
10059005-85 = "수집은 감각의 예술."
10059005-86 = "시간을 뛰어넘어, 그 안에 담긴 다양한 감정과 역사를 느낄 수 있죠."
10059005-87 = "이 티켓도 마찬가지예요."
10059005-88 = "얼핏 보기엔 평범한 티켓입니다만, 오늘의 만남으로 새로운 의미가 생겼죠."
10059005-89 = "이제 저는 이 티켓을 보며 오늘의 시간을 회상할 거랍니다."
10059005-90 = "사소한 것도 특별한 기념품이 될 수 있다니, 낭만적이죠?"
10059005-91 = "[s] \"그건 그렇네.\""
10059005-92 = "상황에 따라서는 의미 없는 쓰레기도 기념품이 될 수 있어요."
10059005-93 = "아, 마침 제 주머니에 나중에 버리려고 넣어둔 티슈가 하나 있네요."
10059005-94 = "저는 이것도 오늘의 기념품으로 간직하겠어요."
10059005-95 = "이 티슈를 보면서 선생님과의 대화를 떠올리는 거예요."
10059005-96 = "[s] \"티, 티슈로 나를 떠올리진 말아줘……!\""
10059005-97 = "후후. 농담이에요, 농담."
10059005-98 = "이 티슈는 제대로 쓰레기통에 버릴게요."
10059005-99 = "선생님과의 추억 일부가 쓰레기통에 들어가는 건 아쉽게 됐지만요."
10059005-100 = "[s] \"추억도 같이 버리는 거야?!\""
10059005-101 = "말씀드렸듯이 수집은 감각의 예술. #n수집품이 버려지면, 그것에 깃든 추억도 함께 버려지는 건 당연한 일이죠."
10059005-102 = "하지만 너무 걱정하지 마세요. 버려지지 않게 갱신하는 방법도 있으니까."
10059005-106 = "해석하자면, 앞으로의 일은 선생님에게 달렸으니 기대해 보겠다는 말씀입니다."
10059005-110 = "[ns1] (뭐, 뭔가 독특한 학생들이다…….)\n[ns2] \"그러고 보니 그 교복은…… 와일드헌트?\""
10059005-113 = "아……. 아직 저희의 소개를 하지 않았네요."
10059005-114 = "죄송합니다. 그럼 저부터 정식으로 자기소개를 하죠."
10059005-115 = "제 이름은 우루와시 마나미."
10059005-119 = "와일드헌트 예술 평의회의 평의회장입니다."
