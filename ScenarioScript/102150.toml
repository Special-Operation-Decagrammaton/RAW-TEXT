[translation]
102150-1 = "제15화;제4 성소 공략 - 카타콤 내부 바실리카"
102150-8 = "제4 성소로 향하는 길은 하나뿐이에요. 화력을 집중시키기 쉽지 않겠지만…… 현재로선 방법이 없네요."
102150-10 = "괜찮습니다. 하나코 씨의 지휘를 믿겠습니다."
102150-11 = "……네. 하나코 씨. 부디 마음껏 저희에게 명령을."
102150-12 = "어머나……♡ 마리 쨩은 그런 말을 악의 없이 하니까 더 나쁜 거예요."
102150-16 = "으응…… 그치만 지금 병력으로는 후방의 방어가 더 필요한데……."
102150-17 = "위험을 감수하고 진행을 할 수 밖엔……."
102150-19 = "우리가 돕게 허락해 주지 않겠나?"
102150-27 = "……당신은."
102150-28 = "후방의 방어는 우리에게 맡겨줄 수 있겠나?"
102150-30 = "……."
102150-31 = "물론, 우리를 믿을 수 없겠지만…… 도울 수 있게 해준다면……."
102150-32 = "물론이에요. 사오리 씨. <스쿼드>에게는 후방 방어를 부탁드릴게요."
102150-33 = "……!"
102150-35 = "지, 진짜인가요? 이렇게 쉽게?!"
102150-36 = "……우리가 누군지 너는 알고 있을 텐데. 무슨 속셈이지?"
102150-38 = "여러분들도 <샬레>의 선생님에게 도움 요청을 받은 거잖아요? 그걸 제가 거절할 수는 없겠죠. 그리고……."
102150-39 = "……우리는 같은 소중한 사람을 친구로 둔 사이잖아요?"
102150-41 = "……."
102150-42 = "그러니 당신들을 믿을 이유는 그걸로 충분하다고 생각하는데요."
102150-43 = "……. 그렇군. 이해했어."
102150-44 = "……."
102150-45 = "하지만 당신들을 단순한 방어 담당으로만 두진 않겠어요. 이건 각오해 주시길. 후훗♡"
102150-46 = "무슨 짓을……."
102150-47 = "네, 네! 힘들고 괴롭겠지만…… 잘 부탁드립니다아……."
102150-52 = "그럼 모두들 준비는 다 한 것 같고……."
102150-53 = "……그런데 사쿠라코 씨는 왜 안 보이죠?"
102150-54 = "늦어서 죄송합니다."
102150-62 = "사, 사쿠라코…… 님……? 그, 그 복장은 대체……?!"
102150-63 = "그, 그건…… 그 옷은……."
102150-64 = "사…… 사쿠라코 씨?!"
102150-66 = "이것은 최후의 성도회장이 남긴 유스티나 성도회의 예장……."
102150-67 = "……네. 이것은 저의 각오입니다."
102150-68 = "지금까지 이어져 온 과거의 증오를 끊고 새롭게……."
102150-69 = "……사쿠라코 씨."
102150-73 = "그것이 각오라고요?!"
102150-74 = "그 야한 옷이?!"
102150-75 = "그게, 바로!! 시스터후드가 이어 나가야 할 성도회의 의지라는 건가요!!"
102150-76 = "즉, 앞으로 모든 시스터에게 저 야한 옷을 입히겠다는 건가요!!"
102150-78 = "네?! 그, 그런 건가요?!"
102150-79 = "저, 저는…… 저, 저런 건…… 무리……."
102150-80 = "네? 아, 아뇨?? 무, 무슨 소리를……?!"
102150-81 = "입기 전에 엄청난 용기가 필요해 보이는 저 아슬아슬한 하이레그 레오타드가 바로!!"
102150-82 = "걸을 때마다 어쩐지 앞뒤로 신경을 써야 할 것 같은 저 불합리한 면적의 디자인이 바로!!"
102150-83 = "그것이 바로 사쿠라코 씨의 각오라는 건가요!!"
102150-84 = "네? 그, 그건……."
102150-85 = "사쿠라코 씨, 솔직히 말씀해 주세요, 저 엄청 신경 쓰이거든요? 안에 속옷은 있는 건가요? 아뇨…… 생각해보면 물리적으로 존재할 수 없어 보이는…… 그렇군요."
102150-86 = "즉, 사쿠라코 씨는 거대한 팬티 하나만 입고 나타난 거군요!!"
102150-87 = "무, 무슨 소리인가요! 대체!!"
102150-88 = "……."
102150-89 = "저희의 죄를 용서해 주시고…… 악에서 구하시고……."
102150-90 = "……저 우라와 하나코. 이런 거대한 의지 앞에서 또 스스로의 부족함을 깨닫게 될 줄은."
102150-91 = "……네. 좋아요. 그럼 부족하지만 저도 각오를 다지지 않으면 안 되겠죠……."
102150-97 = "……."
102150-98 = "……."
102150-99 = "……."
102150-100 = "이것으로 모든 준비가 완료되었습니다."
102150-101 = "네, 네? 주, 준비……? 완료?!"
102150-102 = "그럼 지금부터 제4 성소의 공략을 시작하겠습니다!!"
102150-103 = "이, 이대로 시작하는 건가요……? 정말로요……?"
