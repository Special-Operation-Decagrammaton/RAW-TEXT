[translation]
10036120-1 = "스쿼드가 축제를 즐기는 법"
10036120-2 = "(사오리의 디제잉 공연이 끝난 후…….)"
10036120-5 = "헤헤, 공연 멋졌어요, 사오리 언니."
10036120-6 = "정말 잡지 표지에 실려도 이상하지 않을 정도로……!"
10036120-11 = "과, 과찬이다."
10036120-12 = "……나로서는 뭐가 뭔지도 모르게 지나쳐 버린 느낌이니까. 다시 하라고 하면 못 할 거야."
10036120-13 = "하지만 너희가 즐거웠다면 그걸로 괜찮겠지."
10036120-18 = "응, 즐거웠어."
10036120-19 = "나도, 히요리도, 미사키도 뛰면서 소리지를 정도였거든."
10036120-20 = "미사키가?"
10036120-24 = "나, 나까지 끌어들일 필요 없잖아."
10036120-25 = "난 그냥…… 혼자 가만히 있는 것도 이상하니, 분위기를 맞췄을 뿐."
10036120-26 = "후후, 솔직하지 못하기는."
10036120-27 = "자, 삿 쨩도 쉬는 시간을 얻은 김에, 모두 함께 축제장을 돌아보자."
10036120-28 = "축제는 늦게까지 계속되는 모양이고, 또 낮과는 또 다른 느낌이잖아?"
10036120-29 = "그리고 무엇보다, 삿 쨩은 낮에 일하느라 제대로 놀지 못했으니까."
10036120-30 = "이왕 이렇게 바다까지 왔는데, 그건 아까운걸."
10036120-32 = "나, 나는 괜찮다만……."
10036120-33 = "안 돼, 안 돼."
10036120-34 = "삿 쨩도 똑같이 즐겨야 해. 안 그러면 화낼 거야?"
10036120-35 = "아, 알겠다."
10036120-36 = "그럼, 저기 있는 모래놀이 체험 존이나 해파리 어항은 어떨까."
10036120-37 = "……진심이야? 왜 있는지도 모르는 코너들인데."
10036120-38 = "저, 저긴 어떨까요?"
10036120-43 = "'<전탄 발사! ......'"
10036120-44 = "……'~몰려오는 귀여운 표적들을 막아서'……"
10036120-45 = "……'경품을 차지하자!~>' 라고?"
10036120-46 = "게임 부스구나. 사람도 북적북적하고, 즐거워 보여. 나쁘지 않을지도."
10036120-47 = "……그다지 안 끌리는데."
10036120-48 = "게다가 구경꾼도 많고 조명도 요란해서 정신 사나워."
10036120-50 = "…………."
10036120-51 = "그렇네요…… 역시 게임 같은 건 저희한테 어울리지 않겠죠……."
10036120-52 = "밤새 해파리 어항이나 들여다보고 있어야겠네요…… 완전 파멸이네요……."
10036120-54 = "지, 진정해라, 히요리. 방금 말은 미사키의 단순한 심술이다."
10036120-56 = "?"
10036120-57 = "게임 부스라, 모처럼이니 한 번 참가해 보는 것도 나쁘지 않겠어."
10036120-58 = "응, 모두 함께 노는 거, 재미있을지도."
10036120-63 = "……하아."
10036120-64 = "어쩔 수 없지. 앞장서. 따라갈 테니까."
10036120-65 = "헤, 헤헤헤……!"
