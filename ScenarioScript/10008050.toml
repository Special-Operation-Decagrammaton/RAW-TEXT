[translation]
10008050-1 = "제5화;선도부까지?!"
10008050-3 = "카이텐져 녀석들, 어느 쪽으로 향했어?!"
10008050-4 = "지금까지의 도주 루트를 생각해 보자면 아마도 놈들이 향한 방향은……."
10008050-9 = "앗! 여기! 거동 수상자를 발견했습니다!"
10008050-10 = "뭐? 거동 수상자라고?! 어디? 어디야?!"
10008050-11 = "……카이텐져 녀석들이 어디에 있다는 거야?!"
10008050-13 = "작전 계획에 따라 포위망을 구축하겠습니다!"
10008050-24 = "……사장, 이거 아무래도."
10008050-25 = "……어, 어어어?!"
10008050-26 = "자, 잠깐! 거동 수상자라는 게 설마?!"
10008050-31 = "드디어 따라잡았다! 문제아 녀석들! 이젠 더는 도망칠 수 없을걸!!"
10008050-32 = "[s] \"이오리……?\""
10008050-33 = "뭐야. 익숙한 얼굴이 보인다 했더니, 선생님이잖아?"
10008050-34 = "새해 복 많이 받아…라고 할지, 그보다 선생님이 여긴 어쩐 일이야? 그것도……. 거기 있는 문제아들하고."
10008050-35 = "누, 누가 문제아란 거야?!"
10008050-36 = "여기에서 달리 누가 있겠어? 이 흥신소 녀석들!"
10008050-37 = "[s] \"이오리야말로 여긴 어쩐 일이야?\""
10008050-38 = "응? 나야 당연히……."
10008050-39 = "이런 야심한 시각에 단체로 우르르 몰려오다니……."
10008050-40 = "아하핫~"
10008050-41 = "혹시 게헨나의 선도부는 생각보다 한가하다던가?"
10008050-42 = "뭐어?!"
10008050-43 = "그럴 리가 없잖아! 그렇지 않아도 새해를 코앞에 두고 쉬지도 못하고 일하는 마당에!"
10008050-44 = "[s] \"역시 선도부의 일 때문에?\""
10008050-45 = "맞아. 조금 전에 있었던 <대길전>의 생방송 건으로 지금 난리도 아니야."
10008050-46 = "덕분에 여기저기서 너나 할 거 없이 새전함인지 뭔지를 노리고 그야말로 엉망진창……."
10008050-47 = "하아……. 우리 학원의 문제아들은 날뛰고 있지. 아코 쨩은 이걸 수습하지 못하면 집으로 돌아갈 생각은 엄두도 내지 말라고 하지……."
10008050-48 = "아니, 진짜 어째서 내가 당직을 서고 있을 때 이런 일이 벌어지는 거야? 그것도 새해 벽두부터!"
10008050-49 = "……역시 이것도 전부 다 너희 문제아들 때문이야!"
10008050-50 = "난데없이 적반하장이야?!"
10008050-51 = "애당초 이번 일에서는 우리도 피해자라고 할까……."
10008050-52 = "맞아! 지금은 이럴 때가 아니라……!"
10008050-53 = "뭐? 피해자?"
10008050-54 = "뻔뻔하게 그런 말을 하다니 낯짝 한번 두꺼운걸! 어차피 너희도 새전함을 노리고 있는 거잖아?"
10008050-55 = "앗, 그건 그러니까……."
10008050-56 = "봐봐! 결국 선도부를 방해할 생각인 거지! 이 문제아 녀석들!"
10008050-58 = "선도부의 업무 집행, 그리고 내 새해 휴일을 위해 이 자리에서 문제아들을 배제하겠어!"
10008050-60 = "아니, 분명 틀린 말은 아니지만, 그게 또 딱 맞는 말은 아니라고 할까. 아아! 진짜!"
10008050-61 = "[s] \"자, 잠깐! 모두 진정하고…….\""
10008050-63 = "아하핫! 싸우자는 거네!"
10008050-64 = "사장, 전투 준비."
10008050-65 = "아, 아루 님! 맡겨만 주세요!"
10008050-70 = "으아앗! 이게 뭐냐구?!"
