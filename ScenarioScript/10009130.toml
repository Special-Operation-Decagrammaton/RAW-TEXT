[translation]
10009130-1 = "후일담;해피 발렌타인!"
10009130-2 = "(와카모가 선생님과 만나, 마음을 전달하기 직전.)"
10009130-10 = "……."
10009130-30 = "난동을 부리는 것도 거기까지입니다. 재액의 여우."
10009130-36 = "……그만한 미끼를 뿌렸는데도 기어코 저를 찾아내 이곳까지 도달하다니."
10009130-40 = "……당신, 뭔가요?"
10009130-42 = "구호기사단 단장, 아오모리 미네라고 합니다."
10009130-43 = "구호기사단……?"
10009130-44 = "아아, 생각났어요. 분명 트리니티의 한가하기 짝이 없는 무리들……."
10009130-45 = "그런 구호기사단에, 제 작전의 진의를 눈치챌 정도의 인물이 있었을 줄이야."
10009130-46 = "네, 저는 그냥 밀고 들어왔을 뿐입니다만."
10009130-47 = "그래서, 그 구호기사단의 단장이 여긴 어쩐 일인가요?"
10009130-48 = "……당신 또한 설마, 감히 저를 막겠다는 둥의 이야기를 하려는 건가요?"
10009130-49 = "재액의 여우, 남들이 말하는 바가 아닌, 당신에게 직접 물어보고 듣고 싶은 게 있었습니다."
10009130-50 = "……?"
10009130-54 = "왜 이런 소동을 벌인 겁니까?"
10009130-56 = "…………."
10009130-60 = "……오늘은."
10009130-61 = "……오늘?"
10009130-62 = "오늘은 발렌타인 데이. 자신의 마음을 전하고자 하는 날."
10009130-63 = "저는 단지 저의 마음을 그분께 전하려고 했을 뿐."
10009130-64 = "그것을 방해하는 이가 있다면, 그 상대가 누구라고 할지라도 이 와카모."
10009130-65 = "부수고, 부수고, 또 부수어 앞으로 나아갈 뿐."
10009130-69 = "발렌타인 데이의 마음을 전하기 위해?"
10009130-70 = "흥, 당신이 무어라 생각하든 상관없답니다."
10009130-74 = "제 앞을 가로막는다면, 지옥 끝까지 물어뜯어서라도 부수고 지나갈 뿐."
10009130-75 = "……."
10009130-76 = "자아……. 어디, 당신조차도 절 방해하겠다면 얼마든지……!"
10009130-82 = "좋습니다. 가십시오."
10009130-83 = "……. 무슨?"
10009130-84 = "무엇을 꾸미고 있는 것인지는 모르겠지만, 얕은 속임수 따위. 이 와카모에게는 통하지 않……."
10009130-85 = "속임수도 노림수도 없습니다."
10009130-86 = "구호기사단의 구호에 그런 목록은 존재하지 않습니다."
10009130-91 = "오늘 같은 날 마음을 전하고자 한다. 그것이 당신의 의도라면, 제가 막을 이유 따윈 없습니다."
10009130-92 = "…………."
10009130-97 = "…………!"
10009130-103 = "당신의 행동에 대한 '구호'는, 그 이후에 전달하도록 하죠."
10009130-107 = "단장님? 조금 전 지나간 분은……"
10009130-108 = "호, 혹시. 모두가 찾고 있었던 재액의 여우 아니었나요?!"
10009130-109 = "어, 어째서 그냥 보내주신 건가요?!"
10009130-111 = "……"
10009130-112 = "세리나. 하나에. 오늘이 무슨 날인지 아직 기억하고 있나요?"
10009130-114 = "네? 그, 그야. 엄청난 일들뿐인 날이었지만……"
10009130-115 = "저 알아요! 발렌타인 데이였죠?"
10009130-117 = "그렇습니다. 서로가 서로에게 진심을 전하는 날이기도 하죠."
10009130-118 = "그런 날에 그녀의 마음을 가로막는 것은, 옳지 못한 일이겠죠."
10009130-119 = "그녀가 자신의 기분을 솔직하게 전하도록 하는 것……"
10009130-123 = "그것 또한 그녀에게 보내는 구호가 되지 않을까요?"
10009130-128 = "그런데요……"
10009130-132 = "이 소동은 전부 어떻게 하면 좋을까요. 단장님?!"
10009130-134 = "잘 말해 주었습니다. 하나에."
10009130-135 = "재액의 여우가 자신에게 솔직하게 되는 것과 별개로, 이 소동은 정리되어야만 합니다."
10009130-136 = "그렇게 하기 위해서는……"
10009130-147 = "우선 난동을 벌이는 저 문제아들에게 우리의 '구호'를 전달해야 할 것입니다!"
10009130-148 = "그리고 곧바로, 자신의 할 일을 마친 재액의 여우에게 향하겠습니다!"
10009130-150 = "네, 단장님!"
10009130-151 = "구급상자와 주사기, 부목과 압박 붕대! 모두 준비됐어요!"
10009130-152 = "좋습니다. 그러면 다시 움직이도록 하죠."
10009130-153 = "구호가 필요한 곳에 구호를!"
