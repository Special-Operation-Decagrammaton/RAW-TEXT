[translation]
1002506-1 = "비밀 기지"
1002506-2 = "매화원 인근 공원 놀이터"
1002506-3 = "여기가 제 어릴 적의 비밀기지가 있는 곳이에요."
1002506-4 = "마지막으로 온 지 얼마나 되었을까요…"
1002506-5 = "무척 오랜만인 듯한 느낌이 들지만, 이 놀이터는 거의 그대로네요."
1002506-6 = "제 비밀기지도 여전히 건재한 것 같고요."
1002506-7 = "[s] \"아무것도 안 보이는 걸…….\""
1002506-8 = "물론이죠. 쉽게 찾을 수 있으면 비밀기지가 아니니까요"
1002506-9 = "선생님, 제 비밀기지를 한 번 찾아보시겠어요?"
1002506-16 = "[ns1] \"미끄럼틀 아래 쌓인 나무 덤불인가……?\"\n[ns2] \"역시 못 찾겠어…….\""
1002506-17 = "땡! 틀렸어요."
1002506-18 = "그 나무 덤불은 그냥 방치되어서 쌓인 평범한 덤불이에요."
1002506-19 = "……하하, 포기가 빠르시네요."
1002506-21 = "아무래도 찾기 어려워하시는 것 같으니, 제가 직접 알려드릴게요."
1002506-22 = "제 비밀기지가 있었던 곳은 바로……"
1002506-24 = "이곳이에요!"
1002506-25 = "[s] \"……콘크리트 파이프?\""
1002506-26 = "네. 누군가가 버려둔 공사용 토관인 듯한데, 입구가 작아서 어린아이가 드나들기에는 딱 좋은 크기였거든요."
1002506-27 = "매화원에 다니던 시절의 저는 우울한 일이 생기면 이곳에서 마음을 달래곤 했어요."
1002506-28 = "사람이 드나들지 않는 비밀기지 안에서 생각을 정리하고 있노라면, 신기하게도 금세 마음이 진정되더라고요."
1002506-29 = "미운 친구에 대한 원망을 털어놓기도 하고, 또 멋진 교관이 된 미래의 나를 상상하며 꿈을 적어놓기도 하고……."
1002506-30 = "[s] \"역시 슌은 어릴 적부터 조숙했구나.\""
1002506-31 = "후후, 그런가요? 지금의 제가 보기에는 어린아이의 철없는 일탈처럼 느껴지지만요."
1002506-32 = "그렇게 자주 찾던 비밀기지였지만, 나이가 든 이후로는 입구에 몸이 끼일 것 같아서 들어가 본 적이 없네요."
1002506-35 = "하지만 이 몸이라면 다시 토관에 들어가 볼 수 있겠어요."
1002506-36 = "……물론 살이 쪄서 들어갈 수 없었다는 건 아녜요! 여러모로 성장했으니까요!"
1002506-37 = "[s] \"변명하지 않아도 돼…….\""
1002506-38 = "그, 그렇죠? 지금의 저와는 상관없는 이야기니까요."
1002506-39 = "자, 그럼 오랜만의 비밀기지를 방문해 볼까요? 선생님은 입구에서 기다려주세요."
1002506-40 = "……실례합니다."
1002506-46 = "[wa:4100]― 후후, [wa:1600]이곳은 [wa:750]하나도 [wa:400]변하지 않았네요."
1002506-49 = "― 제가 벽에 적어둔[wa:1500] 자신과의 약속도……"
1002506-51 = "― 그 때 그대로네요."
1002506-54 = "[wa:1350]― 그리워라……"
1002506-57 = "― 이 약속들, [wa:1400]지금에 와서 이렇게 보니,"
1002506-59 = "― 대부분 [wa:500]지킬 수 있었던 것들이네요."
1002506-62 = "[wa:750]― 그럼 [wa:450]모처럼이기도 하고,"
1002506-64 = "― 이번에는 여기에 [wa:1050]미래의 소원이라도 [wa:700]적어볼까요?"
1002506-67 = "[ns] \"새 소원은 뭐라고 적었어?\""
1002506-68 = "[wa:2450]― 알려드릴 수 없어요."
1002506-70 = "― 비밀이니까요!"
1002506-73 = "[wa:1150]― 어른에게는 [wa:550]알려드릴 수 없는"
1002506-75 = "― 어린아이만의 [wa:500]비밀…… [wa:1200]이니까요. [wa:900]후후."
1002506-78 = "후후, 오랜만에 동심으로 돌아가 비밀기지에 들어가보니 생경한 기분이 드네요."
1002506-79 = "어릴 적의 제가 어떤 생각을 했고, 어떤 꿈을 가졌었는지 돌아볼 수도 있었고……."
1002506-80 = "여러모로 옛날의 초심을 되새길 수 있는 좋은 기회였어요."
1002506-81 = "[s] \"나도 비밀기지에 들어가 보고 싶었는데…….\""
1002506-82 = "안 돼요. 아까도 말했지만 이 비밀기지는 어른은 들어올 수 없는, 어린아이만의 공간이니까요."
1002506-87 = "……대신 오늘은 선생님과 저만 공유하는 비밀을 잔뜩 만들어봐요. ♥"
1002506-89 = "(이후, 해가 질 때까지 인적이 드문 놀이터에서 슌과 잔뜩 놀았다.)"
