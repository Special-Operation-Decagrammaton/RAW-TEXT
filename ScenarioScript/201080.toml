201080-42 = "[ns] \"ว่าแต่จะใส่แว่นกันแดดนั่นตลอดเลยเหรอ?\""
201080-43 = "แน่นอนค่ะ เพราะถ้าตัวตนของฉันถูกเปิดเผยคงไม่เป็นผลดีต่อการสืบสวน"
201080-44 = "หากความจริงที่ว่าเจ้าหน้าที่บริหารระดับสูงกำลังสงสัยในตัวตนของประธานองค์การนักเรียน แพร่ออกไปในหมู่ประชาชนแล้วละก็ นอกเหนือจากความสงสัยของฉันแล้ว อาจก่อให้เกิดความโกลาหล#nครั้งใหญ่ในสังคมได้ค่ะ"
201080-45 = "การปิดบังตัวตนไว้ไม่ให้ดูน่าสงสัยย่อมเป็นสิ่งสำคัญค่ะ"
201080-46 = "[s] (ดูน่าสงสัยกว่าเดิมอีกนะนั่น...)"
201080-47 = "สีหน้าแบบนั้นหมายความว่ายังไงคะ"
201080-48 = "คงไม่ได้คิดว่าแว่นกันแดดนี้ดูน่าสงสัยหรือตลกหรอกใช่มั้ยคะ?"
201080-49 = "[s5] \"ครูไม่ได้คิดแบบนั้นสักหน่อย!\"\n[s6] \"แค่แว่นกันแดดเหมาะกับรินจังมากเกินไปน่ะ...\""
201080-52 = "......"
201080-53 = "ตอนนี้เรามีเวลาไม่มาก เพราะงั้นเดินไปคุยไปดีมั้ยคะ"
201080-54 = "ก่อนอื่น เริ่มจากไปที่ย่านการค้าที่มีนักเรียนจากหลายโรงเรียนมารวมตัวกันก่อนดีกว่าค่ะ"
201080-56 = "คอร์กี้ทาวน์ เขตชิราโทริ"
201080-57 = ""
201080-58 = ""
201080-59 = "(ลองถามคนที่เดินผ่านไปมาในย่านพลุกพล่านเกี่ยวกับประธานองค์การนักเรียนอย่างคร่าวๆ)"
201080-60 = "ประธานองค์การนักเรียนเหรอครับ...? ค่อยยังชั่วหน่อยที่เธอกลับมาแล้วนะ"
201080-61 = "ตลอดช่วงเวลาที่เธอไม่อยู่น่ะ มีเรื่องเดือดร้อนมากมายเต็มไปหมดเลย..."
201080-62 = "ตอนนี้เธอกลับมาแล้ว ต่อไปก็หวังว่าจะกังวลเรื่องการโดนลูกหลงจากการยิงต่อสู้ในเมืองน้อยลงนะ"
201080-63 = ""
201080-64 = "รู้สึกยังไงกับภาพลักษณ์ที่เปลี่ยนไปของเธองั้นเหรอ?"
201080-65 = "อืม... ไม่ค่อยแน่ใจเหมือนกันแฮะ ปกติผมจำหน้าคนไม่ค่อยเก่งเท่าไร..."
201080-66 = "สีผมเปลี่ยนไปนิดหน่อยรึเปล่านะ...?"
201080-67 = ""
201080-68 = "อ๊ะ ดูต่างจากเมื่อก่อนแน่นอน ฉันเป็นคนช่างสังเกตเลยจำรายละเอียดได้แม่นเลย"
201080-69 = "เทียบกับก่อนที่จะหายตัวไปแล้ว... ผมของเธอสั้นลงไปประมาณ 5 ซม. เลยนะ!"
201080-70 = "การตัดผมให้สั้นเป็นธรรมชาติด้วยตัวเองเป็นเรื่องยาก ดูแล้วน่าจะต้องเข้าร้านทำผมเป็นประจำ... "
201080-71 = "ช่างทำผมที่ตัดผมให้ระหว่างที่เธอหายตัวไป เป็นใครกันแน่นะ?"
201080-73 = "(คนส่วนใหญ่จำประธานองค์การนักเรียนคนเก่าไม่ได้...)"
201080-74 = ""
201080-75 = "ประธานองค์การนักเรียนเปลี่ยนไปเหรอ? อืม... ไม่รู้เลยแฮะ~"
201080-76 = "เอริกะ นึกอะไรออกบ้างรึเปล่า?"
201080-77 = "อืม... ฉันก็ไม่แน่ใจเหมือนกัน"
201080-78 = "แต่ประธานองค์การนักเรียนก็เป็นแบบนั้นมาตั้งแต่ไหนแต่ไรแล้วไม่ใช่เหรอ? ดวงตาสีม่วง ผมบลอนด์แพลทินัมนุ่มสลวย แล้วก็รอยยิ้มที่ดูสุขุมทำให้รู้สึกว่าเข้าถึงได้ยาก..."
201080-79 = "เมื่อเทอมก่อน ในนิตยสารแฟชั่นยังลงเรื่องสีผมสุดฮิต 'สีบลอนด์องค์การนักเรียน' ที่เลียนแบบสีผม#nของประธานองค์การนักเรียนเลยไม่ใช่เหรอ?"
201080-80 = "อ๊ะ จริงด้วย ตอนนั้นฮิตกันมากเลยละ~"
201080-81 = "ฮิตมากจนฉันเองยังลังเลเลยว่าจะย้อมปลายผมเป็นสีบลอนด์องค์การนักเรียนบ้างดีรึเปล่าน่ะ"
201080-82 = "ประธานองค์การนักเรียนเป็นที่สนใจของคนในคิโวทอสเสมอ  คนที่สนใจเรื่องแฟชั่นอย่างพวกเราน่ะ ไม่มีทางจำผิดหรอก"
201080-83 = ""
201080-84 = "[ns7] \"อย่างนี้นี่เองสินะ...\"\n[ns8] \"นักเรียนในเกเฮนน่าสนใจเรื่องประธานองค์การนักเรียนมากเลยนะ\""
201080-87 = "ก็แหงอยู่แล้ว ต่อให้เป็นคนที่ไม่สนใจเรื่องรอบตัวแค่ไหน ก็ไม่มีทางที่จะไม่รู้จัก#nประธานองค์การนักเรียนที่ดูแลความปลอดภัยของคิโวทอสหรอก ใช่มั้ยล่ะ?"
201080-88 = ""
201080-90 = ""
201080-91 = "มาโคโตะ...? รู้สึกเหมือนเคยได้ยินชื่อนี้จากที่ไหนสักแห่งเลยแฮะ..."
