201080-98 = "หยุดอยู่ตรงนั้นนะ หยุด!"
201080-99 = "พวกคุณคือคนที่เที่ยวปล่อยข่าวลือเกี่ยวกับตัวตนของประธานองค์การนักเรียนแถวนี้ใช่มั้ยคะ?"
201080-100 = "จริงๆ เลยเชียว... ประธานองค์การนักเรียนเพิ่งกลับมาได้ไม่นานเอง ทำไมถึงมาปล่อยข่าวแบบนั้นกันล่ะคะ? "
