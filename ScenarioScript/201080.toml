[translation]
201080-1 = "第8話;虛像與推論"
201080-2 = ""
201080-4 = "[ns1] 「……為什麼戴著墨鏡？」\n[ns2] 「新買的嗎？很適合你呢！」"
201080-5 = "這是偽裝。畢竟不能讓身分被識破。"
201080-6 = "我可不是為了時尚才戴的。這是偽裝。"
201080-7 = "[s] 「偽裝……？」"
201080-8 = "是的。"
201080-9 = "我接下來打算去四處探查。#n確認除了老師之外，是否還有人記得我所認識的聯邦學生會長。"
201080-10 = "今天一整天，我在觀察行政委員會運作的同時也留意著幹部們的反應，#n然而卻沒有任何人對「聯邦學生會長的樣貌改變」一事表現出違和感。"
201080-11 = "就連透過視訊會議看到會長的各自治區代表們也沒有特別的反應。#n從這些情況推斷……"
201080-12 = "……整個奇普托斯的記憶，似乎都被竄改得與原本不同了。"
201080-13 = "[s] 「竄改了整個奇普托斯的記憶……」"
201080-14 = "我也明白這聽起來就像是天方夜譚。"
201080-15 = "不過，如果奇普托斯內還存在像我和老師一樣，記得真正的聯邦學生會長的人……"
201080-16 = "或許有一天能夠找出我們所認識的「真正的聯邦學生會長」的下落也說不定。"
201080-17 = "[s3] 「就現階段來看，也只有這個方法了呢……」\n[s4] 「我也會向來訪夏萊的學生們逐一詢問看看的。」"
201080-20 = "謝謝您。老師願意這麼說，讓我感覺踏實多了。"
201080-21 = ""
201080-23 = ""
201080-24 = "……起初，我曾想過或許是我的記憶有誤。"
201080-25 = "尤其看著他在轉眼之間贏得眾人的信任，聯邦學生會如往昔般重拾生氣的模樣……#n這樣的想法就變得愈加強烈……"
201080-26 = "但是那個人──"
201080-27 = ""
201080-28 = "琳醬。"
201080-29 = ""
201080-30 = "琳醬～"
201080-32 = "琳醬！"
201080-33 = ""
201080-34 = "──絕對不是我記憶中的那位聯邦學生會長。"
201080-35 = ""
201080-37 = ""
201080-38 = "抱歉。似乎說得有些太久了呢。"
201080-39 = ""
201080-41 = ""
201080-42 = "[ns] 「話說回來，那副墨鏡你要一直戴著嗎？」"
201080-43 = "那是當然的。要是我的身分曝光，對調查可沒有好處。"
201080-44 = "假如「聯邦學生會的首席行政官正在懷疑聯邦學生會長的身分」一事在市民間傳開，#n無論我的懷疑是否屬實，都有可能引發社會極大的混亂。"
201080-45 = "為了避免讓人起疑，隱藏身分才是當務之急。"
201080-46 = "[s] （感覺這樣反而更可疑就是了……）"
201080-47 = "您那是什麼表情啊。"
201080-48 = "該不會是覺得這副墨鏡看起來很可疑……或是很滑稽吧？"
201080-49 = "[s5] 「我，我才沒有那樣想呢！」\n[s6] 「只是墨鏡實在太適合你，我一時忍不住就……」"
201080-52 = "……"
201080-53 = "沒時間了，剩下的我們邊走邊說吧。"
201080-54 = "先去各學園學生經常聚集的商業設施一帶看看。"
201080-56 = "白鳥區・柯基町"
201080-57 = ""
201080-58 = ""
201080-59 = "（在市區的繁華街道上，向路過的市民們簡單地打聽了關於聯邦學生會長的事）"
201080-60 = "……聯邦學生會長嗎？他能回來真是太好了。"
201080-61 = "這段期間因為聯邦學生會長不在，許多地方實在挺不方便的……"
201080-62 = "既然聯邦學生會長已經回來，希望之後擔心在市區被捲入槍戰的情況能減少一些。"
201080-63 = ""
201080-64 = "你說聯邦學生會長的形象是不是變了？"
201080-65 = "唔嗯……不確定耶。#n我其實不太擅長記別人的臉……"
201080-66 = "髮色好像有點不一樣了……？"
201080-67 = ""
201080-68 = "啊，確實跟以前不一樣了呢。#n我的觀察力還算敏銳，這點我非常肯定。"
201080-69 = "跟失蹤前相比，聯邦學生會長的頭髮……短了大概5cm哦！"
201080-70 = "只靠自己應該很難把頭髮修得那麼自然，一定得定期去理髮店才行……"
201080-71 = "在他失蹤期間替他修剪頭髮的設計師，究竟會是誰呢？"
201080-73 = "（然而大多數人都不記得從前的聯邦學生會長……）"
201080-74 = ""
201080-75 = "你說聯邦學生會長的形象變了？這個嘛～"
201080-76 = "繪里香醬有什麼頭緒嗎？"
201080-77 = "唔嗯……我也不太清楚耶。"
201080-78 = "聯邦學生會長原本不就是那種形象嗎？#n紫色的眼睛配上潔淨的白金色金髮，還有那莫名令人難以親近的高雅微笑……"
201080-79 = "上學期的時尚雜誌裡，不是還流行過模仿聯邦學生會長金髮的「會長金」嗎？"
201080-80 = "啊，對耶。那時候真的超受歡迎的～"
201080-81 = "連我都煩惱過要不要把髮尾染成會長金呢。"
201080-82 = "他可是一直站在奇普托斯話題中心的人物。#n像我們這種對流行敏感的學生，是不可能記錯的。"
201080-83 = ""
201080-84 = "[ns7] 「……原來如此。」\n[ns8] 「看來格黑娜的學生們也很關注聯邦學生會長呢。」"
201080-87 = "那當然囉。#n再怎麼對周遭的事漠不關心，也不可能不知道負責奇普托斯安全的聯邦學生會長吧？"
201080-88 = ""
201080-90 = ""
201080-91 = "……真琴？那個名字我好像在哪裡聽過……"
201080-93 = "（……結果後來還是被當成了可疑人物）"
201080-94 = ""
201080-97 = ""
201080-98 = "那邊的人，給我站住別動！"
201080-99 = "在這一帶到處散播關於聯邦學生會長真實身分謠言的人，就是你們嗎？"
201080-100 = "真是的……聯邦學生會長才回歸多久而已，你們就散播那種謠言？"
201080-101 = "因為奇怪的謠言害市民們跑來投訴，我們也會很困擾的。"
201080-102 = "[s] 「不，我們並沒有那種打算……」"
201080-103 = "咦，這個聲音是……"
201080-104 = "[USERNAME]老師！？"
201080-105 = "這，這真是失禮了。我們也是接到通報才過來的。"
201080-106 = "……既然老師您都這麼說了，其中想必是有什麼誤會吧。"
201080-107 = "不過還請多加留意。#n聯邦學生會長雖然回來了，但並非所有人都為此感到安心與滿意。"
201080-108 = "有部分市民持續呼籲徹查聯邦學生會長失蹤事件的真相，以及這段期間的行蹤……"
201080-109 = "……看來D.U.短期內還是會鬧哄哄的呢。"
201080-113 = ""
201080-114 = "[ns] 「結果還是沒能找到記得聯邦學生會長的人呢。」"
201080-115 = "……是啊。"
201080-116 = "[s9] 「……差不多該回去了吧？」\n[s10] 「現在時候不早，天氣也漸漸變冷了。」"
201080-119 = "再一下子……請再稍微等我一下就好。"
201080-120 = "只要再多找一下，說不定就能遇見記得聯邦學生會長的人了。"
201080-121 = "就算只有30分鐘也好──"
201080-123 = "原本以為今天運氣不好，沒想到竟然會在這種地方見到夏萊的老師……"
201080-124 = ""
201080-127 = ""
201080-128 = "而且還避開他人的目光，在昏暗的巷弄裡和一名學生單獨談話。"
201080-129 = "這根本就是……"
201080-130 = ""
201080-132 = ""
201080-133 = "獨家新聞嘛！"
201080-134 = "[s] 「麻衣……！？」"
201080-135 = "沒錯，克洛盧斯頻道的主MC，同時也是不放過任何真相、鍥而不捨的採訪員！#n就是我，克洛盧斯新聞部的風卷麻衣！"
201080-136 = "哎呀～今天原定的採訪突然被取消，我還以為要白跑一趟了呢。#n沒想到竟然能在這裡遇見[USERNAME]老師……#n託您的福，我不必擔心要空手而歸了！"
201080-137 = ""
201080-139 = ""
201080-140 = ""
201080-141 = ""
201080-142 = "話說回來，這位學生是哪位呢？"
201080-143 = "特地在夏萊外面避人耳目地交談，該不會是哪間學園的大人物……"
201080-144 = "還是說……是不能對其他學生說明的親密關係……？"
201080-145 = "[s11] （……這下麻煩了）\n[s12] （沒想到會在這種時候碰上克洛盧斯新聞部……）"
201080-148 = "唔嗯……"
201080-149 = "……咦？話說回來，總覺得這位女士有點眼熟呢。#n我們以前見過面嗎？"
201080-150 = "這對尖尖的耳朵和帶有藍色光澤的黑髮……我肯定見過。"
201080-151 = "我們克洛盧斯頻道好像有採訪過……到底是誰來著……"
201080-152 = ""
201080-154 = ""
201080-155 = ""
201080-156 = "……啊！"
201080-158 = "（……被發現了呢）"
201080-159 = "你是神祕主義偶像團體「K.G.S.C」的主唱「莉娜」對吧！？"
201080-160 = "什麼……？"
201080-161 = ""
201080-163 = ""
201080-164 = ""
201080-165 = "就是那個在上次樂團競賽中如彗星般登場，卻在迅速爆紅之後銷聲匿跡──#n連成員身分和所屬學園都一概成謎的神祕偶像團體「K.G.S.C」啊！"
201080-166 = "在那之後我雖然想進一步採訪，#n但是你們的資訊控管實在做得太過徹底，就連一點線索都沒能找到……"
201080-167 = "那次大賽之後，各位在網路上引起了極大的討論，請問你有什麼感想呢？"
201080-168 = "不，能不能先告訴我你的名字和所屬學園呢！？"
201080-169 = "[s] 「麻衣，你先冷靜一下。」"
201080-170 = "怎，怎麼突然這麼嚴肅？發生什麼事了嗎……？"
201080-171 = "[s13] 「琳……不對。莉娜醬正在協助夏萊的重要工作。」\n[s14] 「這是與奇普托斯安全相關的事務，希望你能保密。」"
201080-172 = "……誰是莉娜醬啊。"
201080-174 = "呿，沒想到會在這裡被下封口令……"
201080-175 = "我明白了。既然是夏萊老師的請求，那也沒辦法了。#n我也不是不懂察言觀色的人……"
201080-176 = "要是無視老師用這麼認真的表情提出的請求……#n隔天新聞部可能真的會有貨真價實的炸彈飛進來也說不定呢。"
201080-177 = "話雖如此，我也不能就這樣兩手空空回新聞部……#n有沒有什麼透露給我也無妨的獨家新聞呢？"
201080-178 = "像是只有夏萊的老師才會知道的，學生會幹部之間的醜聞……"
201080-180 = "或是老師您從來沒有對任何人說過的，不可告人的祕密之類的……！"
201080-181 = "[s] （這正是個好機會，也向麻衣問問看吧……）"
201080-182 = ""
201080-185 = "[ns] 「你有沒有聽說過聯邦學生會長換了一個人的消息？」"
201080-186 = "咦？您的意思是聯邦學生會長在失蹤期間被人掉包了嗎？"
201080-187 = ""
201080-189 = ""
201080-190 = ""
201080-191 = ""
201080-192 = "唉……那到底是什麼荒唐的想法啊。"
201080-193 = "那種天方夜譚般的想法，就算是老師的意見也沒有人會相信的啦。"
201080-194 = "不對，把夏萊的老師竟然認真相信這種陰謀論的事寫成報導，#n反而會成為獨家新聞也說不定……？"
201080-195 = "[s] 「這部分就拜託你放過我吧……」"
201080-196 = "總之，我從來沒聽說過那種消息呢。"
201080-197 = "像聯邦學生會長那樣的名人，不可能神不知鬼不覺地就被掉包，#n而且我也難以想像這麼做究竟能得到什麼好處。"
201080-198 = "……啊，仔細想想。好像有誰講過類似的話呢。"
201080-199 = "他說原本的聯邦學生會長是個有著藍色眼睛和頭髮的另一個人，#n但是在失蹤之後被掉包成了另一個存在──"
201080-201 = "那是誰說的！？"
201080-203 = "哇，嚇我一跳！突，突然怎麼了？"
201080-204 = "我現在必須立刻見到那個人。是住在哪裡的誰講了那種話？"
201080-205 = "呃……我是從青葉西區一間老舊飲料吧的常客那邊聽來的……"
201080-206 = "之前聽說有很有趣的爆料就過去採訪，#n結果對方只是一股腦地講了一堆荒唐的都市傳說，害我大失所望地回來了。"
201080-207 = "這個時段他總是待在店裡，又有著掛滿奇怪雜物的詭異外表，應該不難找到才對……"
201080-208 = "非常感謝。您真是幫了我一個大忙。"
201080-209 = "[s] 「謝謝你，麻衣！改天我一定會報答你的！」"
201080-210 = "不，不用客氣……"
201080-211 = ""
201080-213 = ""
201080-215 = ""
201080-216 = "老師、偶像還有聯邦學生會長……這到底是什麼組合啊？"
201080-218 = "下一話;Good Evening, Mr. Orwell"
