201080-4 = "[ns1] \"ทำไมถึงใส่แว่นกันแดดล่ะ...?\"\n[ns2] \"ซื้อแว่นมาใหม่เหรอ? เหมาะมากเลย!\""
201080-5 = "ฉันปลอมตัวเพื่อไม่ให้คนอื่นรู้ว่าเป็นใครค่ะ"
201080-6 = "ไม่ได้ใส่เพื่อความสวยงามหรอกค่ะ ใส่เพื่อปลอมตัวค่ะ"
201080-7 = "[s] \"ปลอมตัว...?\""
201080-8 = "ค่ะ"
201080-9 = "ฉันจะลองสืบหาดูว่า นอกจากคุณครูแล้ว ยังมีคนอื่นที่ยังจดจำประธานองค์การนักเรียนที่ดิฉันรู้จักได้#nอยู่อีกหรือเปล่าค่ะ"
201080-10 = "วันนี้ฉันเฝ้าดูการทำงานของคณะกรรมการบริหารและสังเกตปฏิกิริยาของคนอื่นๆ แล้ว แต่ก็ไม่มีใคร#nแสดงท่าทางหรือความรู้สึกแปลกใจที่รูปลักษณ์ของประธานองค์การนักเรียนเปลี่ยนไปออกมาเลยค่ะ"
201080-11 = "นอกจากนี้ ตัวแทนของเขตปกครองตนเองที่ได้พบประธานองค์การนักเรียนผ่านการประชุมทาง#nวิดีโอคอล ก็ไม่มีท่าทางอะไรเป็นพิเศษ..."
201080-12 = "ดูเหมือนว่าความทรงจำของคนทั้งคิโวทอสจะถูกดัดแปลงให้ต่างไปจากเดิมค่ะ..."
201080-13 = "[s] \"ความทรงจำของทุกคนถูกดัดแปลงเหรอ...\""
201080-14 = "ฉันรู้ค่ะว่ามันฟังดูเหมือนเรื่องเหลวไหล..."
201080-15 = "แต่ถ้ามีคนอื่นที่จำประธานองค์การนักเรียนคนเดิมได้เหมือนฉันกับคุณครูอยู่ในคิโวทอสอีก..."
201080-16 = "สักวันหนึ่งเราอาจจะหาที่อยู่ของ 'ประธานองค์การนักเรียนตัวจริง' ที่พวกเรารู้จักได้ค่ะ"
201080-17 = "[s3] \"ตอนนี้คงมีแค่วิธีนี้เท่านั้น...\"\n[s4] \"ครูจะลองถามนักเรียนที่มาที่ชาเล่ต์ดูด้วยก็แล้วกัน\""
201080-20 = "ขอบคุณค่ะ พอได้ยินคุณครูพูดแบบนี้แล้ว ฉันก็รู้สึกมีกำลังใจขึ้นมาเลยค่ะ"
201080-21 = ""
201080-23 = ""
201080-24 = "ตอนแรกฉันคิดว่าความทรงจำของฉันจะผิดพลาดไปเอง..."
201080-25 = "ยิ่งเห็นเธอได้รับความไว้วางใจจากคนอื่นๆ อย่างรวดเร็ว และองค์การนักเรียนก็กลับมาคึกคักเหมือน#nเมื่อก่อน ก็ยิ่งทำให้คิดแบบนั้น..."
201080-26 = "แต่ว่าคนคนนั้น..."
