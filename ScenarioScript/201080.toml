[translation]
201080-1 = "Episode 8;Illusions and Inferences"
201080-2 = ""
201080-4 = "[ns1] \"...Why are you wearing sunglasses?\"\n[ns2] \"Are those new? They look good on you!\""
201080-5 = "To disguise myself. I didn't want anyone to recognize me."
201080-6 = "This isn't a fashion statement. It's a disguise."
201080-7 = "[s] \"A disguise...?\""
201080-8 = "Yes."
201080-9 = "I'm going to surreptitiously survey the public and see if anyone else besides you remembers MY General Student Council President."
201080-10 = "While carrying out my work for the Board of Administration, I've been observing the officers very closely. No one seems to even be surprised by the sudden change in the President's appearance."
201080-11 = "Not even the individual academy district leaders had any significant reaction after meeting with her in video calls."
201080-12 = "There, I've come to the conclusion that the memories of everyone in Kivotos have been altered."
201080-13 = "[s] \"EVERYONE in Kivotos?\""
201080-14 = "Yes. I realize this sounds far-fetched."
201080-15 = "But if we can find anyone else who remembers the original General Student Council President, the one that you and I remember..."
201080-16 = "We might be able to find out where the real President is now."
201080-17 = "[s3] \"I guess that's our only choice now...\"\n[s4] \"I'll try asking the students who stop by Schale too.\""
201080-20 = "Thank you. I feel a little relief, hearing you say that."
201080-21 = ""
201080-23 = ""
201080-24 = "...At first, I thought maybe it was my memories that were wrong."
201080-25 = "I doubted myself more and more as I watched her win over everyone she came in contact with. I saw with my own eyes the positive effect she had on the General Student Council."
201080-26 = "But she..."
201080-27 = ""
201080-28 = "Rinny."
201080-29 = ""
201080-30 = "Rinny..."
201080-32 = "Rinny!"
201080-33 = ""
201080-34 = "...is definitely not the President."
201080-35 = ""
201080-37 = ""
201080-38 = "I'm sorry. I took too much of your time."
201080-39 = ""
201080-41 = ""
201080-42 = "[ns] \"More importantly, are you going to keep those sunglasses on?\""
201080-43 = "Of course I am. No one can know who I am during this investigation."
201080-44 = "The public wouldn't react well if they found out that the Chief Officer was questioning the identity of the General Student Council President."
201080-45 = "I need to obscure my identity completely, so I don't raise any suspicions."
201080-46 = "[s] \"(You look incredibly suspicious like this...)\""
201080-47 = "Why are you looking at me like that?"
201080-48 = "...Do these sunglasses look strange on me?"
201080-49 = "[s5] \"N-Not at all!\"\n[s6] \"I actually was thinking they look cute!\""
201080-52 = "..."
201080-53 = "We're short on time, so we can talk on the way."
201080-54 = "Our first target is the commercial district, since students from various academies visit there often."
201080-56 = "Shiratori City, Corgi Town"
201080-57 = ""
201080-58 = ""
201080-59 = "We casually asked people in the busy downtown area about the General Student Council President."
201080-60 = "...The General Student Council President? I'm glad she returned."
201080-61 = "Life was a lot harder when she was gone."
201080-62 = "Now that she's back, I'm less worried about getting caught in random shootouts."
201080-63 = ""
201080-64 = "The General Student Council President's new look?"
201080-65 = "Um... Does she look different? I'm not good with faces."
201080-66 = "Maybe she dyed her hair?"
201080-67 = ""
201080-68 = "Ah, she's definitely different from before. I have sharp eyes, so I know that for sure."
201080-69 = "Compared to before, the General Student Council President...has shorter hair! By 5 centimeters!"
201080-70 = "It'd be difficult to trim her hair on her own, so she must have been visiting a salon while she was gone... "
201080-71 = "But which salon?! Who in the world could it have been?"
201080-73 = "Most people we asked didn't remember the previous General Student Council President at all."
201080-74 = ""
201080-75 = "The General Student Council President seems different? Hm, you think?"
201080-76 = "What about you, Erika? Do you remember?"
201080-77 = "Hmm... Not really."
201080-78 = "I think she looks more or less the same. Purple eyes, platinum blonde hair, and a beautiful smile that made her a little unapproachable..."
201080-79 = "There was even a trend going around in fashion magazines last semester: \"President Blonde,\" inspired by the General Student Council President's blonde hair."
201080-80 = "You're right, you're right! It was super popular."
201080-81 = "I was considering dyeing the tips of my hair with President Blonde! Heehee!"
201080-82 = "We like to keep up with the latest trends, and Kivotos basically revolves around her. I'm pretty sure we'd notice if something was different."
201080-83 = ""
201080-84 = "[ns7] \"...That makes sense.\"\n[ns8] \"The President is even popular with Gehenna students, then?\""
201080-87 = "Duh. We might not care that much about current events, but she's the one who keeps Kivotos safe and all that."
201080-88 = ""
201080-90 = ""
201080-91 = "...Huh? \"Makoto\"? Uh, the name sounds vaguely familiar."
201080-93 = "...We were even stopped and treated as \"suspicious people.\""
201080-94 = ""
201080-97 = ""
201080-98 = "You there! Stop!"
201080-99 = "Are you the ones who've been spreading false rumors about the General Student Council President's identity around here?"
201080-100 = "She just got back! Why would you spread such malicious slander? "
201080-101 = "What if people file complaints because of your lies?!"
201080-102 = "[s] \"No, that wasn't our intention...\""
201080-103 = "What, isn't that...?"
201080-104 = "[USERNAME] Sensei?!"
201080-105 = "Um, excuse us. We were sent here based on a tip someone called in."
201080-106 = "If it was you, it really must just be a misunderstanding."
201080-107 = "But please do take extra caution. Just because the President's returned, it doesn't mean everything is all fine and dandy."
201080-108 = "People are starting to gather, demanding answers around her disappearance, and what she's been doing all this time."
201080-109 = "...So it looks like D.U. is going to be quite hectic for a while."
201080-113 = ""
201080-114 = "[ns] \"In the end, we didn't find anyone who remembers the President.\""
201080-115 = "...You're right."
201080-116 = "[s9] \"...Should we start heading back?\"\n[s10] \"It's getting late, the night air is starting to get cold.\""
201080-119 = "Please... Please wait just a little longer."
201080-120 = "I'm sure we'll find someone. We just need to try a little harder."
201080-121 = "Give me just thirty more minutes."
201080-123 = "I thought today wasn't my lucky day, but to be able to run into Schale's Sensei at a place like this..."
201080-124 = ""
201080-127 = ""
201080-128 = "And on top of that, to find you illicitly meeting with a student in a dark alleyway..."
201080-129 = "This is..."
201080-130 = ""
201080-132 = ""
201080-133 = "...a scoop!"
201080-134 = "[s] \"Mai...?!\""
201080-135 = "That's me! The main host of the Kronos Channel and a tenacious reporter who never loses sight of the truth! It's Kazamaki Mai from Kronos School of Journalism!"
201080-136 = "My, my! I thought today was a flop when my interview got cancelled out of nowhere, but then I stumbled upon [USERNAME] Sensei in a compromising position... Thanks to you, I won't have to worry about going back empty handed!"
201080-137 = ""
201080-139 = ""
201080-140 = ""
201080-141 = ""
201080-142 = "More importantly, who is this student over here?"
201080-143 = "Since you're talking outside of Schale, and in such a secretive manner, she must be either a higher-up from an academy..."
201080-144 = "*gasp* Or is this a secret relationship you've been trying to keep from the public?!"
201080-145 = "[s11] \"(This is bad.)\"\n[s12] \"(I didn't expect to run into someone from Kronos here...)\""
201080-148 = "Hmm..."
201080-149 = "...Huh? You look familiar for some reason. Have we met before?"
201080-150 = "These sharp ears and black hair with a bluish tint... I swear I've seen it before."
201080-151 = "I'm absolutely certain we interviewed you in Kronos Channel before. Who was it...?"
201080-152 = ""
201080-154 = ""
201080-155 = ""
201080-156 = "...Ah!"
201080-158 = "(I've been found out.)"
201080-159 = "Aren't you Rina? The vocalist for K.G.S.C., the mysterious idol group?"
201080-160 = "What...?"
201080-161 = ""
201080-163 = ""
201080-164 = ""
201080-165 = "K.G.S.C. is an idol group whose whole brand was mystery! No one knows their real identities or schools, and they came and went like a blazing comet, winning the band competition, and then vanishing into thin air!"
201080-166 = "I've been wanting to cover you guys for sooo long, but I've had so much trouble finding even a single lead!"
201080-167 = "You've been a hot topic in online communities since then! Could I get a statement, please?"
201080-168 = "Actually, first, please tell us your name and academy!!"
201080-169 = "[s] \"Mai, calm down.\""
201080-170 = "Wh-What is it? Why do you look so serious?"
201080-171 = "[s13] \"Rina, well, Rinny is helping Schale with something important.\"\n[s14] \"We're protecting the safety of Kivotos, so please keep this a secret.\""
201080-172 = "...Don't call me Rinny."
201080-174 = "Tch, I can't believe you're hitting me with an embargo..."
201080-175 = "Fine, fine. What am I gonna do, say no to SENSEI of all people?"
201080-176 = "We might get sent an actual bomb this time, if people found out I ignored your heartfelt plea."
201080-177 = "But even so, I can't go back empty-handed... So could you give me an interesting scoop?"
201080-178 = "Like a scandal between student council executives that only you might know..."
201080-180 = "Or a secret of yours! One you've never shared with anyone!"
201080-181 = "[s] \"(This is actually a good opportunity.)\""
201080-182 = ""
201080-185 = "[ns] \"Have you heard the rumors of the General Student Council President being switched?\""
201080-186 = "What? The General Student Council President was switched with someone else when she went missing?"
201080-187 = ""
201080-189 = ""
201080-190 = ""
201080-191 = ""
201080-192 = "*sigh* Do you WANT me to get cancelled?"
201080-193 = "Even if I cited you as the source, no one would believe something THAT crazy."
201080-194 = "But wait... I could write an article about how Schale's Sensei is seriously endorsing this conspiracy theory. The public would eat it up!"
201080-195 = "[s] \"Please have mercy...\""
201080-196 = "Anyway, I haven't even heard a whisper about something like that."
201080-197 = "I don't think anyone could switch out someone as famous as the General Student Council President without anyone noticing. And what would the motive even be?"
201080-198 = "Wait, you know what, I just remembered."
201080-199 = "Someone said something like that. They swore up and down that the President had blue eyes and blue hair, but she's turned into a different person—"
201080-201 = "Who?! Who said that to you?!"
201080-203 = "Whoa! Wh-What's wrong? Why do you need to know?"
201080-204 = "We have to meet that person. Where and who did you hear that from?"
201080-205 = "I-I heard it from a regular at an old bar in Aoba West District... "
201080-206 = "I went there for an interview because I heard there was an interesting scoop there, but I walked away disappointed. All I heard was a bunch of absurd, far-fetched urban legends."
201080-207 = "He's usually there around this time. Just look for the guy covered in junk."
201080-208 = "Thank you. You helped us a lot."
201080-209 = "[s] \"Thank you, Mai! I definitely owe you one!\""
201080-210 = "D-Don't mention it..."
201080-211 = ""
201080-213 = ""
201080-215 = ""
201080-216 = "Sensei, an idol, and the General Student Council President... Just what kind of lineup is this?"
201080-218 = "Next Episode;Good Evening, Mr. Orwell"
