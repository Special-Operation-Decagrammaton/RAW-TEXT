201080-169 = "[s] \"มาอิ ใจเย็นๆ ก่อน\""
201080-170 = "จะ... จู่ๆ มีเรื่องอะไรเหรอคะ? ถึงทำหน้าจริงจังขนาดนั้น..."
201080-171 = "[s13] \"ริน... ไม่สิ รินะจังกำลังช่วยงานสำคัญของชาเล่ต์อยู่\"\n[s14] \"นี่เป็นเรื่องความปลอดภัยของคิโวทอส ช่วยเก็บเป็นความลับได้มั้ย?\""
201080-172 = "เรียกใครว่ารินะจังคะ..."
201080-174 = "ชิ นึกไม่ถึงเลยว่าจะโดนห้ามทำข่าว..."
201080-175 = "เข้าใจแล้วค่ะ ถ้าเป็นคำขอของคุณครูละก็คงช่วยไม่ได้ ฉันเองก็ไม่ได้ตาถั่วอ่านบรรยากาศไม่ออก#nขนาดนั้นหรอกนะ..."
201080-176 = "คุณครูทำหน้าจริงจังขนาดนี้แล้ว ถ้าฉันยังดื้ออยู่ละก็ พรุ่งนี้อาจจะมีระเบิดลูกย่อมๆ มาหย่อนที่ชมรมข่าวก็ได้"
201080-177 = "แต่ถึงอย่างนั้น จะให้กลับไปชมรมโดยไม่ได้ข่าวอะไรเลยก็คงไม่ได้... มีเรื่องเด็ดๆ อะไรที่พอจะ#nบอกฉันได้บ้างรึเปล่าคะ?"
201080-178 = "อย่างเรื่องอื้อฉาวระหว่างสภานักเรียนกับคุณครูของชาเล่ต์..."
201080-180 = "หรือความลับสุดยอดของคุณครูที่ไม่เคยเปิดเผยที่ไหน...!"
201080-181 = "[s] (ถือเป็นโอกาสที่ดี ลองถามมาอิด้วยดีกว่า...)"
201080-182 = ""
201080-185 = "[ns] \"เคยได้ยินเรื่องประธานองค์การนักเรียนถูกสับเปลี่ยนตัวรึเปล่า?\""
201080-186 = "คะ? ประธานองค์การนักเรียนถูกสับเปลี่ยนตัวระหว่างที่หายตัวไปเหรอคะ?"
201080-187 = ""
201080-189 = ""
201080-190 = ""
201080-191 = ""
201080-192 = "เฮ้อ... พูดเรื่องไร้สาระอะไรกันคะเนี่ย"
201080-193 = "คำกล่าวอ้างไร้สาระแบบนั้น ต่อให้เป็นคุณครูก็ไม่มีใครเชื่อหรอกค่ะ"
201080-194 = "ไม่สิ แต่ถ้าเขียนข่าวว่าคุณครูของชาเล่ต์เชื่อทฤษฎีสมคบคิดแบบนี้ก็อาจจะกลายเป็นข่าวเด็ดก็ได้...?"
201080-195 = "[s] \"ละเว้นครูไว้หน่อยเถอะ...\""
201080-196 = "ฉันไม่เคยได้ยินเรื่องอะไรแบบนี้เลยค่ะ"
201080-197 = "ไม่มีทางที่จะสับเปลี่ยนคนดังอย่างประธานองค์การนักเรียนโดยไม่ให้ใครรู้ตัวได้หรอกค่ะ แล้วฉันก็นึกไม่ออกเลยว่าจะได้ประโยชน์อะไรจากเรื่องนั้น"
201080-198 = "อ้อ จริงสิ... เคยได้ยินใครบางคนพูดเรื่องคล้ายๆ กันอยู่นะคะ"
201080-199 = "คนคนนั้นพูดว่าประธานองค์การนักเรียนคนเก่าเป็นอีกคนหนึ่งที่มีดวงตาและเส้นผมสีฟ้า แต่หลังจากหายตัวไปก็ถูกสับเปลี่ยนเป็นอีกคน..."
201080-201 = "ใครเป็นคนพูดแบบนั้นเหรอคะ!"
201080-203 = "โอ๊ย ตกใจหมดเลย! จู่ๆ เป็นอะไรไปคะ?"
201080-204 = "ฉันต้องไปพบคนคนนั้นเดี๋ยวนี้เลยค่ะ  คนที่พูดเรื่องเมื่อกี้อยู่ที่ไหนเหรอคะ?"
201080-205 = "อ่า ได้ยินว่าเป็นลูกค้าขาประจำของบาร์นั่งดื่มเก่าๆ ในเขตอาโอบะค่ะ... "
201080-206 = "ก่อนหน้านี้เขาบอกฉันว่ามีเบาะแสที่น่าสนใจ ฉันเลยไปพบเขาเพื่อทำข่าว แต่เขากลับเอาแต่พูดเรื่องตำนานเมืองไร้สาระเต็มไปหมด จนฉันผิดหวังกลับมาค่ะ"
201080-207 = "ได้ยินว่าช่วงเวลานี้ เขาจะอยู่ที่ร้านนั้นตลอดเลย แถมแต่งตัวเด่นจนน่าสงสัยด้วย คงหาตัวไม่ยากหรอกค่ะ..."
201080-208 = "ขอบคุณค่ะ ช่วยได้เยอะเลยค่ะ"
201080-209 = "[s] \"ขอบคุณนะ มาอิ! ครูจะตอบแทนให้แน่นอน!\""
201080-210 = "มะ... ไม่เป็นไรค่ะ"
