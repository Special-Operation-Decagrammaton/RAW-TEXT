201080-165 = "ไอดอลกรุ๊ปสุดลึกลับ <K.G.S.C> ที่ปรากฏตัวราวกับดาวหางในงานประกวดวงดนตรีครั้งก่อน เรียกความนิยมได้อย่างล้นหลามแล้วก็หายตัวไป โดยที่ทั้งชื่อและสถาบันต้นสังกัด ต่างก็ล้วนเป็นปริศนายังไงล่ะคะ!"
