[translation]
90102010-1 = "第1話;過去行きの列車"
90102010-2 = "D.U.川西駅"
90102010-4 = "ねえ、5番出口の前さ、気づいた？"
90102010-5 = "ずっと工事してたお店、オープンしてたよ。"
90102010-6 = "え、ほんと？何のお店だった？"
90102010-7 = "クレープ屋さんっぽかった。"
90102010-8 = "「生クリームクレープ始めました！」って書いてあったから。"
90102010-9 = "今度食べ行ってみようよ。"
90102010-10 = "よく行ってたお店、急になくなっちゃったし。"
90102010-11 = "ああ、学園の前にあったとこ？#nあそこのバナナチョコクレープ好きだったな～"
90102010-12 = "分かる～！"
90102010-13 = "ああ……なんか甘いの食べたくなってきた。"
90102010-14 = "え？お腹いっぱいーってさっき言ってなかった？"
90102010-15 = "デザートは別腹なんですー！"
90102010-16 = ""
90102010-22 = ""
90102010-23 = "……。"
90102010-24 = "はぁ……昔はよく行ってたのにな……クレープ屋。"
90102010-25 = "こっちに転校してから、1回も行ってないや。"
90102010-26 = "ああいうお洒落な店に一人で入るの怖いし……。"
90102010-29 = ""
90102010-30 = "……だから転校なんてしたくなかったんだ。"
90102010-31 = "通学路に咲いてた綺麗な花も、好きだったカフェも……新しい学園には全部ない。"
90102010-32 = "友達も――"
90102010-33 = "みんな、廃校と一緒にバラバラになっちゃった。"
90102010-34 = ""
90102010-36 = ""
90102010-37 = "……昔に戻りたいなぁ。"
90102010-38 = "戻れるなら……何だってするのに。"
90102010-39 = ""
90102010-42 = ""
90102010-43 = ""
90102010-44 = "「まもなく、4番線に列車が参ります」"
90102010-45 = "……え？"
90102010-46 = "来るの早くない？"
90102010-47 = "ダイヤ乱れてるのかな？"
90102010-48 = ""
90102010-51 = "「まもなく、私立ヒヤシンス学園行き急行列車が参ります」"
90102010-52 = "「危ないですから、黄色い線の内側までお下がりください」"
90102010-53 = ""
90102010-56 = ""
90102010-57 = "……ヒヤシンス学園行き？"
90102010-58 = "もう廃線になってるのに、どうして……？"
90102010-59 = ""
90102010-61 = ""
90102010-62 = "でも……本当にこの列車が連れていってくれるなら――"
90102010-63 = ""
90102010-67 = "「ドアが閉まります。無理なご乗車はおやめください」"
90102010-68 = "「次の列車の予定は……ありません」"
90102010-70 = "次回;無賃乗車"
