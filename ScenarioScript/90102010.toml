[translation]
90102010-1 = "제1화;과거로 가는 열차"
90102010-2 = "D.U. 카와니시 역"
90102010-4 = "저기, 아까 역 들어오는 길에 그거 봤어?"
90102010-5 = "5번 출구 앞에 몇 달 동안 공사 중이던 가게가 오픈했던데."
90102010-6 = "정말? 나는 못 봤는데. 무슨 가게였어?"
90102010-7 = "음…… 자세히는 못 봤지만, 케이크나 크레페를 파는 가게처럼 보였어."
90102010-8 = "입간판에 <생크림 크레페 개시!> 라고 적혀 있더라."
90102010-9 = "우와, 어떤 맛일지 궁금하네."
90102010-10 = "왜, 전에 자주 가던 크레페 가게도 갑자기 없어져서 한동안 못 먹었잖아."
90102010-11 = "아. 학교 앞에 있던 그 가게 말이지? #n거기 바나나 초콜릿 크레페가 맛있었는데~"
90102010-12 = "응응. 맞아."
90102010-13 = "아…… 크레페 이야기했더니 달콤한 게 먹고 싶다."
90102010-14 = "뭐? 방금 전에는 저녁을 너무 많이 먹어서 배부르다고 했었잖아."
90102010-15 = "디저트가 들어갈 자리는 따로 있거든?"
90102010-23 = "………."
90102010-24 = "하아…… 나도 예전에는 친구랑 자주 갔었는데, 크레페 가게."
90102010-25 = "이곳으로 전학 온 이후로는 한 번도 가 보질 못했네."
90102010-26 = "그렇다고 화려한 디저트 가게에 혼자 가는 것도 내키질 않고……"
90102010-30 = "……이래서 전학을 오고 싶지 않았던 거야."
90102010-31 = "새로운 학교에는 익숙한 게 하나도 없으니까."
90102010-32 = "등교길에 피어 있던 예쁜 꽃들도, 내 취향의 디저트를 파는 작은 카페도, 등하교를 함께 하던 절친한 친구들도……"
90102010-33 = "모두 폐교와 함께 더는 볼 수 없게 되었으니까."
90102010-37 = "……할 수만 있다면 옛날로 돌아가고 싶어."
90102010-38 = "전학 오기 전으로 돌아갈 수만 있다면, 뭐든지 할 수 있는데."
90102010-44 = "<지금 4번 승강장으로 열차가 들어오고 있습니다.>"
90102010-45 = "……응?"
90102010-46 = "이상하다. 지금 시간에 이 승강장에 들어올 열차는 없는데……"
90102010-47 = "이전 역에서 연착이 있었던 걸까?"
90102010-51 = "<이번 열차는 사립 히아신스, 사립 히아신스 학원으로 가는 급행 열차입니다.>"
90102010-52 = "<선로 가까이 계시면 위험하오니, 안전하게 물러서 주시기 바랍니다.>"
90102010-57 = "……히아신스 학원으로 가는 열차라고?"
90102010-58 = "이 노선은 이미 오래 전에 폐쇄되었을 텐데, 어째서……"
90102010-62 = "하지만, 정말로 이 열차가 옛날로 나를 데려다 준다면."
90102010-67 = "<출입문이 닫힙니다. 탑승하지 못한 분은 다음 열차를 이용해 주시기 바랍니다.>"
90102010-68 = "<다음 열차의 예정은…… 없습니다.>"
90102010-70 = "다음화;무임승차"
