[translation]
1007405-1 = "의외로 서툰 모습"
1007405-4 = "(조금씩 해가 넘어가고 있던 저녁 바닷가.)"
1007405-8 = "(지는 해를 보며 시간을 보내고 있던 도중, 뒤로부터 누군가의 발소리가 들려왔다.)"
1007405-9 = "[ns1] \"하나코구나.\"\n[ns2] \"정말 찾아왔네.\""
1007405-12 = "정말 이런 곳에 계셨네요. 설마 했는데……."
1007405-13 = "……영차."
1007405-14 = "[ns3] \"옆에 앉았다?\"\n[ns4] \"굉장히 자연스럽네.\""
1007405-17 = "이제 와서 그런 말씀 하시는 거예요? 저희 사이에……? 조금 상처 입었을지도……."
1007405-21 = "……농담이에요. 후후."
1007405-22 = "하지만 저도 선생님의 소중한 학생 중 하나라고 믿으니까……. 봐주실 수 있죠?"
1007405-23 = "이 정도는 소중한 학생의 어리광……이라고 하면 괜찮겠죠?"
1007405-24 = "선생님으로서는 거절하지 않으실 부탁 방법이라고 생각하는데요. 방금의 멘트."
1007405-28 = "후후……."
1007405-29 = "……역시 정답이었군요."
1007405-30 = "그나저나 이렇게 좋은 자리를 혼자서만 차지하고 계시고……."
1007405-34 = "예쁜 경치네요. 바다의 색도, 하늘 색도. 똑같이 금빛으로 물들어 있고……."
1007405-35 = "이것도 지금 이런 타이밍이 아니면 볼 수 없는 색이었겠죠."
1007405-36 = "같이 온 분들도 하나 같이 마음에 드는 분들뿐이고, 운이 좋네요. 이번 탐사는."
1007405-37 = "……네? 제가 마련한 자리 아니냐고요?"
1007405-38 = "그러기야 하지만……. 그런다고 그게 늘 지금처럼 잘 됐던 건 아니니까요."
1007405-39 = "결과가 무사히 나왔다는 건, 그 자체만으로도 '행운'이라 부르기 충분하다고 생각해요."
1007405-40 = "물론 그것도 전부……. 선생님이 계셨기 때문이지만……."
1007405-41 = "…………."
1007405-42 = "……음……."
1007405-43 = "으음……. 그……."
1007405-44 = "……선생님?"
1007405-45 = "[s5] \"응. 뭔가 할 말이 있는 거지?\"\n[s6] \"하나코답지 않게 쑥스럼을 타고 있네.\""
1007405-48 = "으, 으응……? 그래 보이나요? 물론 그렇게 물어보시면 그렇다고도 할 수 있긴 하지만……."
1007405-49 = "……후후."
1007405-50 = "그래도 지금 말씀은 조금 에티켓이 부족했던 게 아닐까요? 그렇게 직접적으로 물어보시면, 부끄러워서 말 못 할 학생들도 있을 거라고요?"
1007405-51 = "[s7] \"그렇지만 하나코는 아니잖아.\"\n[s8] \"맞춰서 대하는 거니까, 걱정하지 마.\""
1007405-54 = "흐응……. 과연……."
1007405-55 = "그렇군요. 그렇게 말씀하시는 거군요."
1007405-56 = "오히려 이렇게까지 가까워지니, 확실히 제가 손해 보는 부분도 생기나 보네요. 조금 꿍해지는걸요."
1007405-57 = "[s9] \"여기선 그래도 된다고 했거든. 어떤 소중한 학생이.\"\n[s10] \"그렇지만 이제 곧 마음이 편해지려는 거잖아?\""
1007405-58 = "끄응……. 완전히 휘둘리고 있는 기분인걸요. 이런 건 또 오랜만이라……."
1007405-59 = "또 그렇게 다 알고 계신다는 것처럼……."
1007405-63 = "……후후. 후후후……."
1007405-64 = "후후후후후……."
1007405-65 = "그렇지만, 네. 말씀대로일지도 모르겠어요. 저란 아이는……. 왜 여기까지 와서도 말을 어물쩡거리는 건지."
1007405-66 = "……음."
1007405-67 = "으으음……."
1007405-68 = "……으으으으으음…………."
1007405-69 = "[ns] 말없이 기다려 준다."
1007405-71 = "……선생님."
1007405-72 = "…………."
1007405-73 = "……감사합니다."
1007405-74 = "……이번 일도 그렇고, 지금까지의 일들도 그렇고. 하나부터 열까지 전부."
1007405-75 = "선생님이 없으셨다면……. 지금 같은 즐거움은 꿈도 꾸지 못했을 거예요."
1007405-76 = "알고 계시겠지만 저……. 옆에서 치켜세워 주는 것과는 달리, 사실 꽤 서투른 사람이거든요."
1007405-77 = "사실 지금 이렇게 말씀드리는 것도, 제가 저 편하자고 하는 말인 걸 알고 계시잖아요?"
1007405-78 = "다른 형태로는 몇 번이나 티를 냈었고, 선생님께서 그걸 모르실 리는 없으니까요."
1007405-79 = "굳이 이렇게 말로 감사하다고 표현하는 건, 결국……. 말했다는 걸 스스로 확인하고 싶은 것뿐."
1007405-80 = "…………."
1007405-81 = "그래도 말할 수 있어서 다행이에요. 전달했다는 걸 확인해서 정말로 다행이에요."
1007405-82 = "생각해 보면 생각해 볼수록……."
1007405-83 = "여기에 오길, 정말로 잘했어요."
1007405-84 = "마지막까지 선생님께 이런 식으로 일방적 통보를 보내는 건 죄송하지만……."
1007405-85 = "……선생님께서는 어떠셨나요? 조금이라도……. 여기에 온 거, 즐거우셨을까요?"
1007405-86 = "[s11] \"물론이지. 정말 즐거워.\"\n[s12] \"하나코가 그렇게 말해줘서 정말 기뻐.\""
1007405-89 = "……후후. 다행이네요."
1007405-90 = "선생님, 그럼……."
1007405-96 = "……앞으로도 잘 부탁드립니다."
