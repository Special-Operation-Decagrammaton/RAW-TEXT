[translation]
90002045-2 = "[ns] \"성공이야!\""
90002045-3 = "네! 예소드의 신호가 지금 극단적으로 약해졌습니다!"
90002045-4 = "[s] \"해치웠나?\""
90002045-8 = "그 말 꺼내서 망하면 책임질 건가요?!"
90002045-13 = "우와아아악?!"
90002045-14 = "꺄아악!?"
90002045-16 = "모모이, 미도리. 저길 봐."
90002045-18 = "으어어…… 어지럽고 귀가 아파……. 그런데 저기라니? 어……?"
90002045-19 = "강철대륙을 막고 있던 장벽이……?"
90002045-25 = "그래. 사라졌어."
90002045-26 = "……."
90002045-27 = "고마워, 선생님. 덕분에 살았네."
90002045-30 = "출격조 회수! 서둘러 주세요!"
90002045-31 = "이미 하는 중이지만요. 격납고, 들려요? 상황 확인 부탁해요."
90002045-35 = "뽜밤뽜밤! 아리스, 무사히 돌아왔습니다! 우리를 가로막는 거대한 장벽을 물리치고 왔습니다!"
90002045-36 = "네, 아리스. 정말 잘했어요."
90002045-38 = "해치 폐쇄 확인. 에이미에게서도 무사하다는 연락을 받았어. 이제……."
90002045-43 = "?!?!"
90002045-44 = "왜 그래요, 리오? 무슨 일이라도 있나요?"
90002045-45 = "방벽 쪽을 봐, 히마리!"
90002045-46 = "예소드의 벽이…… 재생성되기 시작했어!"
90002045-47 = "!!!"
90002045-52 = "이번엔 뭐야?!"
90002045-53 = "어어……? 저기 벽이…… 뭐라고 해야 하지? 가장자리부터 다시 생겨나서, 좌우로 닫히려고 하고 있는데?"
90002045-55 = "모두 뛰어!"
90002045-57 = "또?!"
90002045-58 = "달려야 해, 언니! 벽이 닫히면 우리 저기로 못 들어가!"
90002045-63 = "조금만…… 조금만 더……!"
90002045-64 = "으으으으으으……!"
90002045-65 = "앞으로 점프!"
90002045-74 = "모두, 괜찮아?"
90002045-80 = "아야야야야야…… 어떻게든?"
90002045-84 = "세상에……."
90002045-88 = "우와……."
90002045-89 = "꿈속 풍경 같아……."
90002045-95 = "이즈미모토 에이미. 현장으로부터 보고."
90002045-96 = "지금 막, 강철대륙 내부로 진입했어."
90002045-98 = "다음화;전진 기지"
