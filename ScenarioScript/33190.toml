33190-62 = "……뭐?"
33190-63 = "자아, 봤죠? 이 붕어빵 봉투가 아즈사 쨩의 것보다 훨씬 더 기괴해요! 더 잔혹해요! 더 무시무시하고 무섭거든요?"
