33190-44 = "전…… 평범한…… 학생입니다."
33190-45 = "히후미…… 그만둬…… 어째서 여기에……"
33190-46 = "이건 평범한 네가 감당할 수 있는 적이 아냐……."
33190-47 = "……."
33190-48 = "……네. 맞아요. 확실히 저는 평범해요."
33190-49 = "그리고 아즈사 쨩이 뒤집어쓴 방독면이…… 아즈사 쨩이 숨겨온 진짜 모습이라는 것도 잘 알겠어요."
