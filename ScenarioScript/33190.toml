33190-76 = "……."
33190-77 = "같아요! 같은 위치예요!"
33190-78 = "그러니까 아즈사 쨩만 다른 [ruby=・]저[/ruby][ruby=・]쪽[/ruby]에 있다고 하지 마세요! 제가 [ruby=・]이[/ruby][ruby=・]쪽[/ruby]에 있다고 하지 마세요!"
33190-79 = "가까이 오지 말라고 말하지 말아요! 저도……!!"
33190-80 = "……저도 아즈사 쨩에게 갈 수 있어요!"
33190-81 = "이렇게 닿을 수 있다구요……!"
33190-82 = "히후미……"
33190-83 = "그치만 그런 걸 뒤집어쓴다고……. 가상의 수영복 복면단이 진짜가 되는 건 아니라고 생각하는데……."
33190-84 = "누가 가짜라는 거야?!"
