33190-94 = "?!"
33190-95 = "?!"
33190-99 = "눈에는 눈. 이에는 이. 인정사정 보지 않고 고고하게 인외마경의 길을 걷는다."
33190-100 = "응. 그게 바로 우리의 모토."
33190-101 = "참고로, 평상시에는 아이돌로 활동하다가 밤이 되면 악당을 물리치는 부업도 하고 있어요~♧"
