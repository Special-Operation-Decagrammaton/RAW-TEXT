33190-381 = "[ns] \"우리가 바로 진짜 [ruby=ETO]에덴조약기구군[/ruby]이라고.\""
33190-382 = "뭐……라고?!"
33190-384 = "설마!!!"
33190-385 = "이것은 에덴조약……? 선생님, 당신은 분명……!"
33190-386 = "에덴조약…… 원래 총학생회장이 만든 조약……."
33190-387 = "그리고 그 총학생회장이 설립한 초법적 기관 <샬레>……."
33190-388 = "설마, <샬레>가 총학생회장을 대행하겠다는 것인가요? 아니, 그렇게 해석했다……?"
33190-389 = "마치…… 그것은 1차 공의회에 불참한 아리우스의 권한처럼……."
33190-390 = "여기에 조약의 주체인 게헨나가, 티파티가, 정의실현부가, 선도부가 모여서……."
33190-391 = "바로 이 고성당이 있던 폐허 위에서……."
33190-392 = "이 조약의 최초 발의자인 총학생회장 대신……"
33190-393 = "선생님이 낙원의 이름을 한 약속을……. 여기서 재현하겠다……?"
33190-394 = "……."
33190-395 = "계약을 [ruby=・]곡[/ruby][ruby=・]해[/ruby]하고 [ruby=・]왜[/ruby][ruby=・]곡[/ruby]해서 선생님이 원하는 대로 결과를 [ruby=・]조[/ruby][ruby=・]작[/ruby]하겠다……는 건가요?"
33190-396 = "<어른>의 방식에는, <어른>의 방식으로 대응하겠다……"
33190-398 = "리더…… 성도회가 통제되지 않아……."
33190-399 = "!!"
33190-412 = "호, 혼란에 빠진 것 같아요……. 에, 에덴조약기구군을 돕는 것이 계율이라면…… 지금 여기에는 똑같은 ETO가…… 둘이나……."
33190-413 = "헛되다!!!!!!"
33190-414 = "그게 어쨌다는 거냐! 그런 선언으로 뭘 바꿀 수 있다는 거냐!"
33190-415 = "그런다고 이 증오와 불신의 세계가 바뀌기라도 한다는 거냐! 꿈같은 소리다!"
33190-416 = "[s] \"아니, 학생들의 꿈을 실현해 주는 건 언제나 어른들의 의무였다.\""
33190-417 = "……!!"
