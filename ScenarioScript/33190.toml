33190-110 = "……리더. 저 녀석들, 실없이 웃고 있지만 만만한 상대가 아닌 것 같아. 주의해야 해."
33190-111 = "……."
33190-116 = "으헤~ 누가 우리 두목님의 심기를 불편하게 한 걸까나~ 오호라, 너희들이야?"
33190-117 = "이야~ 누군진 모르겠지만 이제 끝장이라고? 파우스트 님이 화나면 인정사정 봐주지 않는다고?"
33190-118 = "응응, 파우스트 쨩은 카이저 코퍼레이션의 간부 하나도 잘라버린 적도 있어요~♧"
33190-119 = "블랙마켓의 은행도 식전 운동으로 털어버렸지."
33190-120 = "맞아! 저번엔 카이저 PMC의 병력도 포격으로 싸그리 날려버렸다고!"
33190-121 = "그렇다구~? 무시무시하다구? 살아 움직이는 재앙이라구? 암흑가를 지배하는 숨겨진 보스라구?"
33190-122 = "응. 그게 바로 파우스트."
