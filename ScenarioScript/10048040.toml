[translation]
10048040-1 = "제4화;순백의 변수"
10048040-2 = "특수교역부 기숙사실"
10048040-3 = "아, 침, 아, 침~."
10048040-4 = "아침이랍니다, 미요 쨩~."
10048040-5 = "등교할 시간이랍니다~."
10048040-9 = "으우우…… 5분만 더……."
10048040-13 = "아, 리츠 쨩이었어……?"
10048040-14 = "응. 이제 일어날 시간이야, 미요 쨩."
10048040-15 = "후후……."
10048040-16 = "저기 그런데 리츠 쨩, 궁금한 게 있는데……."
10048040-17 = "응?"
10048040-18 = "그…… 왜 내 머리맡에서 망치를 들고 서 있는 거죠?"
10048040-19 = "아, 이건……."
10048040-24 = "그것은! 네가 일어나지 않으면 사용하기 위해서다!"
10048040-25 = "헛소리할 거면 그 입으로 아침이나 먹어요."
10048040-26 = "그래서 리츠 쨩, 그 망치는……?"
10048040-27 = "아, 나는 바로 조각 작업실로 등교하려고! 그래서 장비 챙기는 중이었어!"
10048040-28 = "망치하고, 끌하고, 정하고……"
10048040-29 = "……아하."
10048040-30 = "후후, 리츠 쨩은 성실하네요."
10048040-31 = "그리고 넌 늦잠 자면서 게으름이나 피우고 있고 말이지."
10048040-32 = "내가 이러고 있는 건 다 그쪽 때문이거든요……!"
10048040-33 = "그림 밀반출 작전 구상하느라 거의 밤을 새웠다고요?!"
10048040-34 = "호오, 작가님. 드디어 작품이 완성된 겁니까……!"
10048040-35 = "아주 이럴 때만 작가 대접이지."
10048040-36 = "……하아, 이런 작품을 쓰고 싶어서 와일드헌트에 들어온 건 아니었는데."
10048040-38 = "응? 미요 쨩은 미요 쨩이 쓴 작품이 싫어?"
10048040-39 = "아니, 그, 그게……."
10048040-40 = "이건 제가 원래 지향하던 창작의 방향이 아니라고 할까요……."
10048040-41 = "그래도 나, 미요 쨩이 쓴 글 정말 좋아하는걸?"
10048040-42 = "내가 제일 좋아하는 작가가 미요 쨩이니까!"
10048040-43 = "리츠 쨩……"
10048040-45 = "와, 반응 차이 봐."
10048040-46 = "나도 좀 귀여워해 줘."
10048040-47 = "……."
10048040-48 = "에휴."
10048040-49 = "자 아무튼."
10048040-50 = "건너뛰었어!"
10048040-51 = "작전의 윤곽은 대충 나왔어요."
10048040-52 = "일단, 우리의 작전 장소는 전시회장이 아니에요."
10048040-54 = "응? 전시회장에서 그림을 빼내는 거 아니었어?"
10048040-55 = "전시회장에 '걸릴' 그림을 빼내는 거죠."
10048040-56 = "<누가 자줏빛과 푸른빛을 귀여워하랴>는 현재 전시회장에 없어요."
10048040-57 = "우리 학원의 수장고에 보관되어 있지."
10048040-58 = "전시회가 정식으로 개막하기 전까지, 작품들은 거의 다 수장고에 들어가 있으니까요."
10048040-59 = "아……!"
10048040-60 = "결국, 우리는 수장고로 들어가서 그림을 빼 와야 한다는 의미죠."
10048040-61 = "수장고라면…… 예술품 창고인 거지?"
10048040-62 = "그러면 창고 벽을 부순 다음 거기로 그림을 빼내면……."
10048040-63 = "음음, 그건 안 돼요 리츠 쨩."
10048040-64 = "의뢰인한테 창고 수리비는 못 받았거든요."
10048040-66 = "어쨌든 예상보다 난이도가 올라가 버렸군……."
10048040-67 = "그래서, 수장고 안으로 어떻게 들어가려고?"
10048040-68 = "대충 플롯은…… 아니, 계획은 구상해 두긴 했는데, 자세한 것은 이따가 말할게요."
10048040-69 = "일단 지금은 각자 수업이나 들으러 가요."
10048040-70 = "그리고 조각 잘하고요, 리츠 쨩."
10048040-71 = "응응!"
10048040-76 = "나는?"
10048040-77 = "그럼 이만."
10048040-81 = "힝."
10048040-85 = "와일드헌트 교실"
10048040-87 = "으음……."
10048040-88 = "벌써 수업이 끝났나……."
10048040-90 = "괜찮나, 미요 쨩?"
10048040-94 = "아, 히로미 쨩."
10048040-99 = "평소답지 않게 꽤나 많이 피곤해 보이더군."
10048040-100 = "충분한 수면을 취하지 못했나?"
10048040-101 = "아…… 네. 어젯밤에 잠을 좀 설쳐서요."
10048040-102 = "그런데 히로미 쨩도, 그, 꽤 피곤해 보이는데……?"
10048040-103 = "아아, 최근 우리 사감대의 업무가 확 늘어나서 말이지."
10048040-104 = "아 맞아, 히로미 쨩은 사감대의 부대장이었죠……."
10048040-105 = "근데 무슨 일 때문인데요……?"
10048040-106 = "얼마 후에 있을 베로니카 특별전 때문에 말이야."
10048040-107 = "(뜨끔)"
10048040-108 = "아, 아아, 그것 때문이었군요……."
10048040-109 = "그 전시회에 걸릴 작품들이 벌써 전부 수장고에 들어와 있거든."
10048040-110 = "그리고 그 수장고의 보안을 담당하는 게 바로 우리 사감대고."
10048040-111 = "수장고의 보안……."
10048040-112 = "고, 고생이 많네요, 히로미 쨩……."
10048040-113 = "(미안해요 히로미 쨩……!)"
10048040-114 = "뭐 고생스럽긴 하지만, 원래 우리 사감대가 해야 할 일이니까."
10048040-115 = "단지 이 일 때문에 최근 밀수 범죄 관련 대응을 전혀 못 하고 있다는 것이 조금 마음에 걸리지만……."
10048040-116 = "최근 교내에 밀반입된 금지 물품들이 꽤 많이 적발돼서 말이야."
10048040-117 = "(뜨끔)"
10048040-118 = "그, 그렇군요……."
10048040-119 = "그래도 미요 쨩, 너만큼은 이런 범법 행위에 손대지 않아서 다행이다."
10048040-120 = "그래서일까, 너와 대화할 때는 마음이 편하다고 해야 할까……."
10048040-121 = "사감대의 부대장으로 일하다 보면, 사람과 만날 때마다 의심하게 되거든."
10048040-122 = "하지만 너와 대화할 때만큼은 그런 느낌이 들지 않아서 좋아."
10048040-123 = "(으아아아아 미안해요오오오……!)"
10048040-124 = "후우우……."
10048040-125 = "뭐, 아무튼 나는 요즘 그렇게 살고 있다."
10048040-126 = "저기 그런데 히로미 쨩."
10048040-127 = "응?"
10048040-128 = "혹시…… 아직 남은 고민이 있나요?"
10048040-129 = "……."
10048040-130 = "……보였나?"
10048040-131 = "그, 목소리가 어쩐지 평소보다 가라앉아 있어서……."
10048040-132 = "후후……."
10048040-133 = "역시 바로 알아맞히는군."
10048040-134 = "맞아. 사실 지금 우리 사감대가…… 상당히 귀찮은 이슈에 직면해 있거든."
10048040-135 = "이것 봐."
10048040-136 = "이건…… 편지봉투?"
10048040-137 = "그래. 이틀 전에 베로니카 특별전 운영 위원회 사무실로 날아든 물건이다."
10048040-138 = "한 번 읽어 봐."
10048040-139 = "아, 네."
10048040-144 = "[log]달팽이들은 울고[/log]"
10048040-145 = "[log]단단했던 하늘이 풀어지니[/log]"
10048040-146 = "[log]오직 왕만이 미소를 짓는다.[/log]"
10048040-147 = "[log]문이 닫히고, 무지개가 뒤섞이는 마술적인 찰나에-[/log]"
10048040-149 = "[log]여러분을, 찾아뵙겠습니다.[/log]"
10048040-153 = "잠깐. 이, 이거 설마……!"
10048040-154 = "그래.."
10048040-156 = "……<자애의 괴도>의 예고장이다."
