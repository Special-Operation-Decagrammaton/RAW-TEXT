[translation]
1000602-1 = "그녀의 오해"
1000602-2 = "키보토스 상점가"
1000602-4 = "음료수 자판기 앞에서 실수로 100엔 짜리 동전을 떨어트렸다."
1000602-5 = "……동전이 하수구 덮개 안쪽으로 굴러가 사라져 버렸다."
1000602-6 = "[s] 하수구 덮개를 열고 아래로 내려가 동전을 찾는다."
1000602-8 = "(덜컹-!)"
1000602-11 = "……이봐, 거기서 무얼 하는 거야?"
1000602-16 = "……선생님?"
1000602-17 = "[s] \"……….\""
1000602-18 = "………."
1000602-19 = "[s] \"……….\""
1000602-20 = "소문의 변태를 잡았다고 어서 선도부에 연락을……."
1000602-21 = "[s] \"오해다.\""
1000602-22 = "오해라고? 말도 안 되는 소리."
1000602-23 = "멀쩡한 하수도 덮개를 열고 그 안에 들어갈 이유가 뭐가 있는데?"
1000602-24 = "분명 눈에 띄지 않는 하수도 밑에 숨어 들어가서 지나가는 여학생들의 치마 속을 훔쳐보려고 했던 거겠지."
1000602-25 = "[s] 자초지종을 설명한다."
1000602-26 = "동전을 주우러 하수구에 들어갔다고?"
1000602-27 = "……샬레의 선생님은 동전 하나 때문에 하수구에 들어갈 정도로 어렵게 사는 건가……"
1000602-28 = "선생님. 마시고 싶은 음료수가 있다면 내가 대신 사줄게."
1000602-29 = "학생에게 손을 벌릴 수는 없다고? #n아니, 100엔 정도라면 내가 대신 내 줄 수 있으니까."
1000602-30 = "앞으로는 동전을 잃어버렸다고 하수구에 들어갈 필요는 없어."
1000602-31 = "돈이 부족해서 그러는 게 아니라고? #n그럼 어째서……?"
1000602-32 = "[s1] \"하수구에 앉아있으면 의외로 서늘해서 기분이 좋거든.\"\n[s2] \"이 위치에서라면 이오리의 다리가 더 잘 보이거든.\""
1000602-33 = "무, 무슨 소리를 하는 거야!"
1000602-34 = "무, 무슨 소리를 하는 거야!"
1000602-35 = "변태, 죽어!"
1000602-37 = "이후, 동전은 되찾았지만 이오리로부터 이상한 오해를 받고 말았다."
