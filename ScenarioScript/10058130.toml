[translation]
10058130-1 = "後日談その1;空冷0気筒"
10058130-2 = "（レース前日）"
10058130-3 = "ゲヘナカップ宿泊施設"
10058130-5 = ""
10058130-6 = "暑い。"
10058130-7 = "ほんっと暑い！ムカつく！！やってらんない！！！"
10058130-8 = "あはは……結局、クルセイダーちゃんのエアコンは直せませんでしたね。"
10058130-9 = "私はピタっとしてベタベタするのも良いと思いますよ。"
10058130-10 = "嫌っ！汗かいてるのにくっついたら気持ち悪いでしょ！"
10058130-11 = "そういうのは、本で見るほうが好きなんですよね？"
10058130-12 = "な、何言ってんの！？そんなの知らないもん！"
10058130-13 = "それなら……コハルちゃんのカバンに入っている#n『戦車装備教範』、今から一緒に見ても良いですか？"
10058130-14 = "そ、それは……！あんたには難しいからダメ！"
10058130-15 = "なるほど……。"
10058130-16 = "何よ、その目！？"
10058130-17 = "別の表紙でカモフラージュなんて、古典的ですね。"
10058130-18 = "！！！"
10058130-19 = "出発前から一生懸命に読んでたね。教範は全ての戦術の基本だ。"
10058130-20 = "良ければ、私も読みたい。"
10058130-21 = "ダメったらダメ！！！"
10058130-22 = "あはは、大丈夫ですよ。教範がなくても修理する方法はありますから。"
10058130-23 = "そろそろ、注文した「涼しくなるもの」が到着するはずなんですが……。"
10058130-24 = "涼しくなるもの？"
10058130-25 = ""
10058130-28 = "こんな時間に誰でしょう？お隣さんですかね？"
10058130-29 = "コハルちゃん。#n夜に呼び鈴が鳴ったら、その後何が起こるか……よく知ってますよね？"
10058130-30 = "質問の意図が不純なんだけど！最っ低！"
10058130-31 = "離れて、催涙弾を投げ込まれるかもしれない。"
10058130-32 = "防毒マスク、今回も持ってきたんですね。"
10058130-33 = ""
10058130-36 = ""
10058130-37 = "やっほー！ぱんでもにうむ・そさえてぃーだよー！"
10058130-38 = "荷物を届けに来たの！"
10058130-40 = ""
10058130-41 = "わっ！う、宇宙人！？こわい～！！"
10058130-42 = "宇宙人じゃない。[ruby=しらす]白洲[/ruby]アズサだ。よろしく。"
10058130-43 = "それ、早く外しなさいよ！その子びっくりしてるじゃん！"
10058130-44 = "コハルちゃんのも私が外してあげますね……♡"
10058130-45 = "死刑、死刑、死刑っ！！"
10058130-46 = "しけい？イブキ、悪い子……？"
10058130-47 = "そ、そうじゃなくて……！"
10058130-49 = ""
10058130-50 = "そうなんだ！おいしいキャンディーをありがとう！"
10058130-52 = ""
10058130-53 = ""
10058130-54 = "お姉ちゃん、ここって616号室だよね？ここにサインしてくれる？"
10058130-55 = "ありがとうございます！重いのにご苦労様です！"
10058130-56 = "[ruby=パンデモニウム・ソサエティー]万魔殿って、ゲ[/ruby]ヘナの生徒会ですよね？宅配業務もするんですか？"
10058130-57 = "うん！みんな忙しいから、イブキがお手伝いしてるんだ！"
10058130-58 = "えへへ！いろんな人に会えて楽しいよ！"
10058130-59 = "あら、偉いですね。"
10058130-60 = "コハルちゃんと一緒で[ruby=・]オ[/ruby][ruby=・]ト[/ruby][ruby=・]ナ[/ruby]です！"
10058130-61 = "決まってんでしょ、私はエリートなんだから大人……。"
10058130-63 = ""
10058130-64 = "ん？もしかして、からかってる……？"
10058130-65 = "からかってませんよ～"
10058130-67 = ""
10058130-68 = ""
10058130-70 = "どうして急に抱きつくの！？"
10058130-71 = ""
10058130-72 = "ここにサインですね……はいっ！ありがとうございます！"
10058130-73 = "うん！明日のレース、頑張ってね！"
10058130-75 = ""
10058130-76 = ""
10058130-77 = "ところで、何を注文したんですか？"
10058130-79 = ""
10058130-80 = ""
10058130-81 = "壊れたのはエアコンのエバポレーターなので……#n冷媒を直接冷やせば、冷たい風が出てくると思って……。"
10058130-82 = "さっきドライアイスを注文したんです！"
10058130-83 = "早く、保冷バッグに移さないと……。"
10058130-85 = ""
10058130-88 = "これは……。"
10058130-89 = "ドライアイスじゃないけど、涼しそうではあるね。"
10058130-90 = "中身間違われちゃったってこと？#n616ってあるし、この部屋宛てではあるんだよね？"
10058130-92 = ""
10058130-93 = ""
10058130-94 = "はい、そのはずなんですけど……。"
10058130-95 = "車両点検を受けた時に故障の話をしたので、運営さんが送ってくれたのでしょうか？"
10058130-96 = "そんなはず……なくはないの？運営が送ってくるなんて……。"
10058130-97 = "これは……レーシングスーツですね。"
10058130-98 = "レーシングスーツ、ですか？"
10058130-99 = "はい！広告でもこういう衣装を着た人を見るでしょう？"
10058130-100 = "それは出場選手じゃなくて、進行の人たちが着ているような……。"
10058130-101 = "トリニティとは違う風習かもしれない。涼しそうだし、機能的で良いと思う。"
10058130-102 = "うーん……ドライアイスがないなら、エアコンは機能しないでしょうし……。"
10058130-103 = "制服だと熱中症の恐れもあるので、これを着たほうが良いかもしれませんね。"
10058130-104 = "でも2着しかないわよ？"
10058130-105 = "もしかしたら、戦車長と副戦車長の分だけなのかも。"
10058130-106 = "でしたら、ヒフミちゃんとアズサちゃんの分ですね！"
10058130-107 = "私たちは念のために持ってきた水着を着ましょう、コハルちゃん！"
10058130-108 = "何言ってんの？私は水着なんて持ってきてないけど。"
10058130-109 = "コハルちゃんの分も私が持ってきてます。非常時に備えて、当然のことです。"
10058130-110 = "どんな非常時よ！？"
10058130-111 = "戦場に出るための鎧、気に入った。"
10058130-112 = "熱中症も心配ですし……せっかく運営さんが準備してくださったんですから、#n遠慮なく着させてもらいましょう。"
10058130-113 = "水着で戦車に乗るなんておかしいでしょ！"
10058130-114 = "え！？"
10058130-116 = "ふんふん～るんるん～♪"
10058130-117 = "えっと～"
10058130-118 = "616号室にドライアイス、配達完了！"
10058130-119 = "それと919号室にマコト先輩の服を配達したら、お仕事終わり！"
10058130-120 = "えへへ！"
