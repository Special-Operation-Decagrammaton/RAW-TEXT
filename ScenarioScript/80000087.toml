[translation]
80000087-1 = "졸음 방지대책"
80000087-2 = "샬레 집무실"
80000087-3 = "(발렌타인 데이를 앞둔 어느 날……)"
80000087-8 = "어, 음……"
80000087-9 = "좋은 아침이야, 선생님."
80000087-10 = "[s] \"좋은 아침, 사키.\""
80000087-11 = "저…… 혹시나 해서 묻는 건데."
80000087-12 = "오늘 아침은 졸립지 않아?"
80000087-13 = "[s1] \"괜찮아. 안 졸려.\"\n[s2] \"어젯밤에는 간만에 푹 잤거든!\""
80000087-14 = "아…… 그건 다행이네."
80000087-15 = "아…… 그건 다행이네."
80000087-16 = "매일 늦게까지 샬레의 불이 켜져 있는 것 같아서, 혹시나 잠이 부족하지 않을까 했거든."
80000087-17 = "[s] \"……혹시 걱정해 준 거야?\""
80000087-18 = "하, 하아……? 내가 선생님을 걱정할 리가 없잖아!"
80000087-19 = "모처럼 내가 시간을 내서 당번 활동을 하러 왔는데, 선생님이 졸고 있으면 곤란하니까 확인해 본 것뿐이라고."
80000087-20 = "자, 피곤하지 않으면 서둘러 오늘의 업무부터 시작하자."
80000087-22 = "(……하지만 그 이후로도 사키는 계속 틈만 나면 졸립지 않느냐고 물어왔다.)"
80000087-24 = "(점심 식사를 마치고 난 뒤에……)"
80000087-25 = "하아~ 오늘 점심은 정말 배부르게 잘 먹었네."
80000087-26 = "이렇게 배부르게 식사를 하고 나면 어쩐지 노곤해져서 잠이 솔솔 잘 온단 말이지……"
80000087-27 = "선생님, 어때. 식사를 하고 났더니 뭔가 졸음이 오지 않아?"
80000087-28 = "[s] \"글쎄…… 그다지……?\""
80000087-29 = "뭐, 졸립지 않다면 다행이지만……."
80000087-31 = "(휴식 시간에 TV를 시청하며……)"
80000087-32 = "아아— 진짜 지루한 다큐멘터리네."
80000087-33 = "나야 평소에도 다큐멘터리를 즐겨 시청하니 별 상관은 없지만, 어떤 사람들은 내레이터의 목소리를 듣는 것 만으로도 졸음이 쏟아진다고 하더라고."
80000087-34 = "선생님은 어때? 다큐멘터리를 보고 있으니까 졸음이 오는 것 같지 않아?"
80000087-35 = "[s] \"잘 모르겠는데……\""
80000087-36 = "그런가…… 그렇다면 상관없지만."
80000087-38 = "……어라? 작업곡 리스트가 평소와는 조금 다른 것 같네."
80000087-39 = "클래식인가……"
80000087-40 = "나쁘지는 않지만, 작업곡으로 듣기에 클래식 음악은 자장가처럼 편안하고 조용한 음색이 많아서 듣고 있으면 졸음이 오기 쉽지."
80000087-41 = "어때, 선생님? 이번에야 말로 졸음이 오는 것 같아?"
80000087-42 = "[s] \"그렇게 계속 물어보니 조금 졸린 것 같기도 하고……\""
80000087-51 = "그렇지? 졸음이 오지?"
80000087-52 = "후후, 마침 내가 졸음을 깨는데 좋은 간식을 갖고 있던 참이거든."
80000087-57 = "자, 초콜릿 캐러멜이야."
80000087-58 = "[s] \"어째서 갑자기 캐러멜……?\""
80000087-59 = "캐러멜은 만들기도 간단하고 당분이나 열량을 보충하기에도 좋은 간식이라, 전투 식량으로 자주 보급되거든."
80000087-60 = "특히나 이 초코 캐러멜은 입 안에서 잘 녹지 않고, 쫀득한 식감을 갖고 있기 때문에 야간 근무를 서는 초병들이 잠을 쫓기 위해 자주 먹는 간식 중 하나야."
80000087-61 = "늦은 밤에 위험한 고갯길을 차로 지나갈 때, 운전병이 졸지 않도록 부대장이 계속 옆에서 캐러멜을 먹여 주었다는 일화도 있을 정도니까."
80000087-62 = "마침 이번에 보급으로 초콜릿 캐러멜이 나왔기에 선생님을 위해 가져왔어. 양은 충분하니까 졸릴 때 먹도록 해."
80000087-63 = "[s] \"혹시 사키, 이 초콜릿 캐러멜……\""
80000087-65 = "[ns] \"발렌타인 데이 초콜릿이야?\""
80000087-67 = "뭐, 뭐? 그, 그, 그럴리가 없잖아?!"
80000087-68 = "언제나 훈련에 매진해야 할 SRT의 특수요원이 발렌타인 데이 같은 세속적인 행사에 관심이 있을 리가……"
80000087-69 = "무, 물론 어쩌다 보니 우연히 시기가 맞은 건 어쩔 수 없지만……"
80000087-73 = "저, 정말이니까 착각하지 말라고!"
