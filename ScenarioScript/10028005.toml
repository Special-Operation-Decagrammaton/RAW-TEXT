10028005-64 = "호송 대상 도착! 쇠사슬 연결!!"
10028005-72 = "어서 들어가라! 쓸데없는 짓 할 생각은 하지도 말고!"
10028005-77 = "……이제 정지! 본사에 도착할 때까지 그대로 얌전히 앉아 있도록."
10028005-78 = "쇠사슬 위치 고정!! 족쇄 위치 고정!!"
10028005-83 = "네 녀석의 '처분'에 대한 건 본사로 돌아가서 결정하게 될 것이다. 아마도 오늘 본 햇빛이 네 학원 생활의 마지막 햇빛이겠지."
10028005-84 = "…………."
10028005-85 = "……쳇. 뭔가 말이라도 할 줄 알았더니, 꿔다 놓은 보릿자루로군."
10028005-86 = "그나저나 진짜 이 녀석이야? 겉보기에는 쪼그마한 꼬맹이인데, 과연 이런 정도의 경계가 필요한 건지……."
10028005-87 = "패밀리 간부들이 다 모여 있던 회장 한복판에다 그런 테러 행각을 벌인 녀석들의 우두머리야. 그런 녀석이 정상일 리 없잖아."
10028005-88 = "물론 이 녀석이 미치광이라는 건 유명해서 알고 있지만……."
10028005-89 = "하긴, 오죽하면 그 게헨나 선도부가 요주의 인물로 벼르고 있는 녀석이겠어."
10028005-90 = "하지만 그것도 다 오늘로 끝이야. 네 녀석을 처리하는 건 우리 패밀리 연합……."
10028005-91 = "그중에서도 총대를 멘 <아란치노 패밀리>이니까."
10028005-92 = "…………."
10028005-93 = "후문 폐쇄! 모두 안으로 들어와서 자리에 착석한다!!"
10028005-94 = "전원 착석!! 좌석 고정!! 본사까지 이 상태를 유지!!"
10028005-100 = "차량 연결 확인!! 올 그린!!"
10028005-101 = "……출발한다!"
