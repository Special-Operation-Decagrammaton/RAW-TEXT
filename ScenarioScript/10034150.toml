[translation]
10034150-1 = "4일 전: 동아리의 정체성"
10034150-3 = "……출출한데."
10034150-4 = "어떻게 오자마자 출출할 수가 있냐……. 아직 시작도 안 했잖아."
10034150-5 = "출출한 건 출출한 거지, 출출한 데에 때와 장소가 있어?"
10034150-6 = "지금은 좀 있어야 하지 않을까……."
10034150-10 = "하지만 최근 수련에 집중하느라 연료 공급이 적었던 것은 또한 사실."
10034150-11 = "차가 달리기 위해서도 엔진오일이 필요하듯, 우리에게도 윤활유 정도는 있어야 하겠지."
10034150-12 = "아무리 맹훈련 기간이라지만, 동아리의 정체성까지 잃지는 말아야 하지 않겠어?"
10034150-13 = "정체성까지 끌고 올 정도의 일은 아니라고 생각하는데."
10034150-14 = "아니, 연습 안 할 때는 줄 창 먹어대고 있잖아. 왜 기억 못 한다는 듯이 구는 거냐고."
10034150-15 = "맨날 그런 식이니까……."
10034150-20 = "아하하……"
10034150-21 = "……역시 오늘은 좀 먹으면서 할까?"
