1014905-124 = "#st;[-1200,-530];serial;60;― [log=코코로]……네.[wa:1562] 선생님께서 원하신다면,[/log]"
1014905-126 = "#st;[-1200,-630];serial;60;― [log=코코로]저는 [wa:2330]괜찮아요.[wa:40] [/log]"
