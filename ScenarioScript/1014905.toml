1014905-102 = "#st;[-1200,-530];serial;60;[wa:520]― [log=코코로]아, [wa:1040]그래도…… [wa:1640]그렇긴 하네요.[/log]"
1014905-105 = "#st;[-1200,-530];serial;60;― [log=코코로]이 국을 먹어 줄 사람을 생각하며,[/log]"
1014905-107 = "#st;[-1200,-630];serial;60;― [log=코코로]평소보다 더 정성을 들여 끓였으니까―[/log]"
1014905-110 = "#st;[-1200,-530];serial;60;[wa:1230]― [log=코코로]그게…… [wa:630]노, [wa:720]농담이에요![/log]"
1014905-113 = "#st;[-1200,-530];serial;60;[wa:800]― [log=코코로]네? [wa:1670]제 된장국을 매일 아침마다 [wa:2690]드시고 싶으시다고요?[/log]"
1014905-116 = "#st;[-1200,-530];serial;60;― [log=코코로]그 [wa:430]말씀은…… [wa:1440]설마……[/log]"
1014905-119 = "#st;[-1200,-530];serial;60;[wa:460]― [log=코코로]아뇨.[wa:346]  [wa:40] [/log]"
