[translation]
1014905-1 = "#title;다이버와 된장국"
1014905-2 = "#na;(다음 날 아침. 새벽부터 바람과 파도가 거칠어서, 코코로의 상태를 보러 그녀가 평소에 다이빙을 하던 포인트로 향했다.)"
1014905-3 = "#na;(해변에 도착했을 때 파도는 이미 잠잠해져 있었다. 그리고 곧이어 코코로가 평소보다 지친 모습으로 천천히 수면 위로 올라왔다.)"
1014905-4 = "#st;[0,0];instant;1;"
1014905-7 = "3;코코로;06\n#3;a"
1014905-8 = "3;코코로;10;으으, 역시 이런 날의 바다는 최악이야……\n#3;stiff"
1014905-9 = "3;코코로;02;어라, 선생님?\n#3;em;[반응]"
1014905-10 = "3;코코로;08;가, 갑자기 연락도 없이 무슨 일로……"
1014905-11 = "3;코코로;02;무, 무슨 급한 볼 일이라도 생기신 건가요?"
1014905-12 = "[s1] \"아니. 코코로가 걱정되어서 와 봤어.\"\n[s2] \"아침부터 바다의 상태가 심상치 않아서.\""
1014905-15 = "3;코코로;01;아…… 저, 저를 걱정해 주신 건가요?"
1014905-16 = "3;코코로;00;감사합니다…… 하지만 일부러 와 주실 필요는 없었는 걸요."
1014905-17 = "3;코코로;01;지금은 파도도 한결 가라앉았거니와…… 만일을 대비해서 준비도 철저히 해두었거든요."
1014905-18 = "3;코코로;00;방향을 잃지 않도록 하강라인도 제대로 설치했고, 마스크에 안티포그액도 미리 발라두었고……\n#3;em;[재잘]"
1014905-19 = "3;코코로;13;비, 비상 상승에 대비한 마커 부이도 제대로 준비했으니까요!\n#3;hophop"
1014905-20 = "[s] \"역시 매사에 준비가 철저한 코코로답네.\""
1014905-21 = "#st;[0,0];instant;1;"
1014905-24 = "[ns3] \"그래도 이런 날은 감기에 걸릴 수도 있으니까……\"\n[ns4] \"핫팩을 몇 개 챙겨왔으니 몸 좀 덥혀.\""
1014905-27 = "3;코코로;03;가, 감사합니다. \n#3;greeting"
1014905-28 = "3;코코로;99;이럴 줄 알았으면 조금 더……\n#3;stiff"
1014905-29 = "#st;[0,0];instant;1;"
1014905-31 = "3;코코로;01\n#3;em;[...]\n#wait;2500"
1014905-32 = "3;코코로;02\n#3;em;[반응]\n#wait;1000"
1014905-33 = "3;코코로;05;저, 저기…… 선생님!"
1014905-34 = "3;코코로;02;그, 그러고 보니 곧 점심 시간인데 식사는 하셨나요?"
1014905-35 = "3;코코로;01;사실 물에서 나온 뒤에 먹으려고 따듯한 된장국을 준비해 두었는데…… 저 혼자 먹기에는 조금 양이 많아서요."
1014905-36 = "3;코코로;00;괜찮으시다면…… 가, 같이 식사라도 하고 가실래요? \n#3;stiff\n#3;em;[///]"
1014905-37 = "[s5] \"좋아!\"\n[s6] \"응. 안 그래도 마침 배가 고프던 참이었어.\""
1014905-40 = "3;코코로;14;그럼 잠시만 기다려주세요. 금방 국을 덥혀 올게요.\n#3;em;[반짝]"
1014905-41 = "[s7] \"그런데 코코로. 전에 말하길……\"\n[s8] \"된장국은 싫어한다고 하지 않았어?\""
1014905-44 = "3;코코로;02;네? 제가요……?\n#3;em;[?]"
1014905-45 = "3;코코로;02;그, 그럴 리가요. 제가 된장국을 싫어할 이유는 특별히 없는데……"
1014905-46 = "#st;[0,0];instant;1;"
1014905-48 = "3;코코로;02\n#3;em;[...]\n#wait;2500"
1014905-49 = "3;코코로;03;……아아!\n#3;em;[전구]"
1014905-50 = "3;코코로;02;죄, 죄송합니다. 제가 착각을 했었네요."
1014905-51 = "3;코코로;01;제가 그 때 말한 '된장국'은 다이버들이 쓰는 은어였어요. "
1014905-52 = "3;코코로;00;다이버들은 종종 조류나 폭우로 인해 물에 침전물이 잔뜩 떠서 시야가 나쁜 걸 두고 '된장국'이라고 부르기도 하거든요."
1014905-53 = "3;코코로;01;황갈색으로 부옇게 침전물이 뜬 바다의 색이 꼭 된장국 같아 보이기도 해서……"
1014905-54 = "[s9] \"아아, 과연.\"\n[s10] \"그렇게 듣고 보니 바다가 된장국처럼 보이기도 하네.\""
1014905-57 = "3;코코로;02;그래도 죄송합니다. 다른 사람과 이야기할 때 이해하기 어려운 은어를 쓰는 건 지양해야 했는데……"
1014905-58 = "3;코코로;08;제 실수로 선생님께 혼란을 드린 것 같네요……\n#3;em;[한숨]"
1014905-59 = "[s] \"괜찮아, 신경 쓰지 마.\""
1014905-60 = "#st;[0,0];instant;1;"
1014905-63 = "[ns] \"여하튼 코코로도 먹는 된장국은 좋아하는 거지?\""
1014905-64 = "3;코코로;15;네. 정말 좋아해요!\n#3;jump"
1014905-65 = "3;코코로;00;날이 궃은 날 차가운 바다에서 올라와 먹는 따뜻한 된장국은 그 어떤 음식에도 비할 수 없는 매력이 있거든요."
1014905-66 = "3;코코로;01;따듯한 된장국을 한 모금 들이켰을 때 은은하게 퍼져나가는 온기와, 지친 몸에 스며드는 진한 맛이 그 어떤 음식보다도 중독적이라……"
1014905-67 = "3;코코로;14;가끔은 물 속의 풍경보다 다이빙이 끝난 뒤에 먹는 이 된장국이 더 기다려질 때도 있어요.\n#3;em;[반짝]"
1014905-68 = "[s] \"그렇게 말하니 더욱 기대가 되는 걸.\""
1014905-69 = "#st;[0,0];instant;1;"
1014905-72 = "3;코코로;01;아, 슬슬 먹어도 될 것 같아요.\n#3;em;[반응]"
1014905-73 = "3;코코로;03;잠시만 기다려 주세요, 선생님. 금방 그릇에 덜어드릴게요."
1014905-77 = "#st;[-1200,-530];serial;60;[wa:3540]― [log=코코로]아아……[wa:1780] 따듯해…….[/log]"
1014905-79 = "#st;[-1200,-630];serial;60;― [log=코코로]다이빙을 마치고 먹는 이 따듯한 한 그릇의 맛은……[wa:1710] 각별하네요.[/log]"
1014905-82 = "#st;[-1200,-530];serial;60;[wa:500]― [log=코코로]아, [wa:1480]선생님은 어떠신가요……?[/log]"
1014905-84 = "#st;[-1200,-630];serial;60;― [log=코코로]혹시 너무 짜거나 [wa:1720]싱겁지는 않으신가요……?[/log]"
1014905-87 = "#st;[-1200,-530];serial;60;[wa:2380]― [log=코코로]다행이다……[/log]"
1014905-89 = "#st;[-1200,-630];serial;60;― [log=코코로]……조미료, [wa:1280]말씀이신가요?[/log]"
1014905-92 = "#st;[-1200,-530];serial;60;― [log=코코로]딱히 특별한 것은……[/log]"
1014905-94 = "#st;[-1200,-630];serial;60;― [log=코코로]인터넷에서 본 레시피대로 만들었는걸요?[/log]"
