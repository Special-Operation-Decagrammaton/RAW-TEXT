[translation]
1009605-1 = "라이프가드의 특권"
1009605-3 = "어째서 선생님께서 여기 계시는 겁니까?"
1009605-4 = "[s1] \"칸나가 고생하는 것 같아서 도와주러 왔어.\"\n[s2] \"칸나랑 같이 고생하러 왔어.\""
1009605-7 = "……."
1009605-8 = "확실히, 파크에서 라이프가드 이외에도 일일 도우미를 모집한다고 했었죠."
1009605-9 = "하지만 설마 선생님이 오실 줄은 몰랐습니다."
1009605-10 = "[s] \"같이 일하자고! 오늘은 동료니까!\""
1009605-11 = "……네, 알겠습니다."
1009605-12 = "오늘은 작업을 위해 만난 만큼, 이전과 같이 놀 시간은 없을 겁니다. 그래도 괜찮으신가요?"
1009605-13 = "[s] \"물론이지. 성실하게 일할게.\""
1009605-14 = "그럼, 청소도구를 들고 담당 구역으로 이동하시죠."
1009605-15 = "실외에 있는 시설입니다."
1009605-17 = "저희가 맡은 곳은 이곳, '힐링 스파'입니다."
1009605-18 = "프라이빗한 공간에서 단둘이서만 스파를 즐길 수 있는 시설이지요."
1009605-19 = "그런 만큼 평소에는 인기가 많아 줄을 서서 이용하는 곳입니다."
1009605-20 = "[s] \"커플 전용이라는 느낌이네…….\""
1009605-21 = "그럼 저는 저쪽 끝부터 시작하겠습니다."
1009605-22 = "선생님은 반대쪽 끝부터 청소를 부탁드립니다."
1009605-23 = "구석구석 깨끗이, 책임감을 갖고!"
1009605-24 = "[s3] \"네, 넵!\"\n[s4] (……꿀꺽.)"
1009605-28 = "(한동안 힐링 스파를 열심히 청소했다…….)"
1009605-30 = "휴우, 이걸로 대충 끝났군요."
1009605-31 = "수고하셨습니다, 선생님."
1009605-32 = "[s5] \"칸나도 고생했어.\"\n[s6] \"시설 전체가 아주 반짝반짝 빛나는걸.\""
1009605-35 = "그럼 파크 측에 임무 완료를 보고하겠습니다."
1009605-39 = "여기는 힐링 스파 담당자. 파크 책임자 응답 바람."
1009605-40 = "(치직) 무슨 일 있습니까?"
1009605-41 = "현재 청소 및 시설 점검 임무를 마치고 대기 중. 다음 임무 하달 바람."
1009605-42 = "(치직)수고하셨습니다. 이쪽 일이 바쁘니 일단은 잠시 쉬면서 기다려 주세요. (치직…….) 통신 끝."
1009605-43 = "끊겼군요……."
1009605-44 = "아무래도 저쪽에 바쁜 일이 있는 모양입니다. 이대로 대기해야 할 것 같은데, 괜찮으십니까?"
1009605-45 = "[s7] \"좋지, 안 그래도 좀 쉬고 싶었어.\"\n[s8] 쑤시는 근육을 문지른다."
1009605-50 = "그럼, 잠깐 함께 휴식을 취하도록 하죠."
1009605-51 = "'힐링 스파'를 함께 이용하는 것은 어떻습니까?"
1009605-52 = "[s] \"엥? 그래도 돼?\""
1009605-53 = "물론입니다. 이쪽으로 들어오세요."
1009605-56 = "[wa:750]― [log=칸나 수영복]후우,[/log]"
1009605-58 = "― [log=칸나 수영복]확실히 피로가 [wa:800]풀리는 느낌이군요.[/log]"
1009605-61 = "[wa:750]― [log=칸나 수영복]괜찮습니다.[/log]"
1009605-63 = "― [log=칸나 수영복]이것도 점검의 [wa:900]일부니까요.[/log]"
1009605-66 = "― [log=칸나 수영복]게다가……[/log]"
1009605-68 = "― [log=칸나 수영복]열심히 일한 자에게는 [wa:800]포상이 있어야죠.[/log]"
1009605-71 = "[wa:750]― [log=칸나 수영복]……그리고,[/log]"
1009605-73 = "― [log=칸나 수영복]선생님께는 늘[wa:1350] 신세를 졌으니까요.[/log]"
1009605-76 = "― [log=칸나 수영복]그러니까 [wa:400]이건……[/log]"
1009605-78 = "― [log=칸나 수영복]제가 선생님께 드리는 [wa:1750]작은 선물입니다.[/log]"
1009605-81 = "[ns9] \"그러니까 그 말은…….\"\n[ns10] \"'칸나와 함께 스파를 즐길 자격'이 선물이라는 말이지?\""
1009605-82 = "[wa:500]― [log=칸나 수영복]네, 네?![/log]"
1009605-83 = "[wa:500]― [log=칸나 수영복]네, 네?![/log]"
1009605-85 = "― [log=칸나 수영복]그, [wa:410]그럴 리가 [wa:600]없지 않습니까![/log]"
1009605-88 = "[wa:830]― [log=칸나 수영복]제가 있는 이유는, [wa:1300]그러니까……[/log]"
1009605-91 = "― [log=칸나 수영복]……[wa:1150]선생님의 안전을 [wa:800]위해서입니다![/log]"
1009605-93 = "― [log=칸나 수영복]저는 [wa:1000]라이프가드니까![/log]"
1009605-96 = "정말, 그렇게 놀리시다니……."
1009605-97 = "(치직) 힐링 스파 담당자, 이쪽은 파크 책임자입니다."
1009605-98 = "수고하셨습니다. 슬슬 작업을 마무리할 시간이니 본부로 돌아오세요 (치직…….)"
1009605-103 = "그렇다는군요. 복귀하시죠, 선생님."
1009605-104 = "청소하시느라 고생하셨습니다."
1009605-105 = "[s] \"오늘 하루 즐거웠어, 칸나.\""
1009605-109 = "[ns] \"칸나는 어땠어?\""
1009605-110 = "라이프가드가 임무에 즐거움을 따지는 것은 어불성설입니다만."
1009605-111 = "그래도 굳이 따지자면……."
1009605-113 = "네, 저도 즐거웠습니다, 선생님."
