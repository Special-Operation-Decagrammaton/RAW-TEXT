[translation]
10005050-1 = "제5화;C&C식 문제 해결"
10005050-4 = "골든 플리스호 수감실"
10005050-6 = "앗 따가워……. 다 까졌잖아."
10005050-7 = "선생, 괜찮아? 혹시 다친 데라든가……."
10005050-8 = "[s1] \"괜찮아. 안 다쳤어.\"\n[s2] \"뒤로 물러나 있었으니까.\""
10005050-11 = "……휴우."
10005050-12 = "그래도 다행이네. 선생이 다쳤으면 나도 진짜 가만히 안 있었을 텐데 말이지."
10005050-13 = "……그나저나 의외로 많기도 하구만. 무슨 그 방 하나에 백 명도 넘는 가드가 몰려오냐."
10005050-14 = "이런 신발만 아니었어도 진즉 다 쓸어버렸을 텐데……."
10005050-15 = "쯧. 그놈의 스마트인지 뭔지, 안 하던 방식으로 하려니까 꼴이 이렇게 된 거지."
10005050-16 = "……미안, 선생. 괜히 우리 때문에 선생도 고생하고."
10005050-17 = "[s3] \"난 괜찮아. 신경 쓰지 마.\"\n[s4] \"그런 것치고는 네루도 꽤 침착한걸.\""
10005050-18 = "음…….뭐어……."
10005050-19 = "음…….뭐어……."
10005050-20 = "그래. 사실 너무 걱정할 필요는 없으니까. 이 정도는 일하다 보면 늘 있는 일이고."
10005050-21 = "아직 임무가 실패했다고 결정된 것도 아니잖아?"
10005050-22 = "단지 내가 지금 짜증 나는 건, 이제부터 있을 일인데……."
10005050-26 = "야호-! 선배, 보러 왔어요-!"
10005050-27 = "……하아."
10005050-28 = "그래. 저 녀석의 저런 신난 낯짝을 봐야 한다는 거지."
10005050-35 = "니하하하!! 깜짝 놀랐지 뭐예요."
10005050-36 = "갑자기 전광판에 아스나 선배가 떡 하니 뜨길래, 돌아보니 선배가……!"
10005050-37 = "하지만 어림도 없습니다! 저는 이곳의 이용객으로서 철저한 보호를 받고 있다고요."
10005050-38 = "즉 이곳의 가드들은 다 제 호위병이나 다름없는 것! 아무리 선배들이라도 겨우 네 명으론 어림없죠~."
10005050-39 = "여기 사람들을 전부를 상대하고 이 학교 자체를 적으로 돌릴 생각이 아닌 바에야……."
10005050-40 = "흠……. 아니면……."
10005050-41 = "아예 선배들도 열심히 뽑기를 돌리고……. S등급을 뽑아서 VIP권을 구한다든가?"
10005050-42 = "그럼 초법 권한과 면책권도 주어진다니까 가능할지도? 니하하하하!!"
10005050-43 = "……말도 안 되는 소리죠. 선배들 수중의 돈으로 S등급이라니."
10005050-44 = "그건 제가 여태껏 채권까지 쏟아 부으면서도 나온 적이 없는 등급이라구요~. 즉 불가능!"
10005050-45 = "이 쿠로사키 코유키, 이번에야말로 밀레니엄의 마수에서 벗어나고 마는 것입니다!"
10005050-46 = "이 배의 주인으로서 선배들을 내쫓고 앞으로도 왕처럼 살아가는 것입니다!!"
10005050-47 = "얼씨구, 아주 신이 나셨구만."
10005050-48 = "……그나저나 넌 예의도 없냐? 옆에 어른 있는 거 안 보여?"
10005050-49 = "……네? 어른?"
10005050-51 = "어……. 헉!"
10005050-52 = "아, 안녕하세요! 처음 뵙는 분이네요!"
10005050-53 = "저는 쿠로사키 코유키라고 합니다. 쫓길 때는 주로 코드네임 '백토'라고 불리고 있어요!"
10005050-54 = "[s5] \"안녕 코유키. 너도 네루처럼 익숙해 보이는구나.\"\n[s6] \"타깃 본인이 코드명을 알고 있다니…….\""
10005050-55 = "니하하하하! 그야 한두 번 있던 일들이 아니라서 말이죵."
10005050-56 = "니하하하하! 그야 한두 번 있던 일들이 아니라서 말이죵."
10005050-57 = "그러고 보니 이분은 어떤 분이신지……. 혹시 선배 보호자예요?"
10005050-58 = "뭣……!!"
10005050-59 = "[s7] \"좀 비슷하지만 달라.\"\n[s8] \"마음은 굴뚝같지만 아쉽구나.\""
10005050-60 = "시, 시끄러워!! 아니야, 아니라고!!"
10005050-61 = "시, 시끄러워!! 아니야, 아니라고!!"
10005050-62 = "선생은 또 무슨 이상한 소리 하는 거야!? 저 녀석이랑 놀아주지 마!!"
10005050-63 = "응? 선생……?"
10005050-65 = "선생님……!?"
10005050-66 = "선생님이에요!? 와!! 저 선생님 처음 봐요!!"
10005050-67 = "……그런데 선생님은 뭐 하는 사람이에요? 그리고 왜 선생님이 여기에 네루 선배랑 같이……?"
10005050-68 = "알 필요 없어, 인마! 그런 건 네가 알아서 뭐하게?"
10005050-69 = "[s9] \"코유키야말로 여기서 뭐 하고 있었던 거야?\"\n[s10] \"선배들이 걱정했어. 나쁜 짓 하고 있던 건 아니지?\""
10005050-70 = "예? ……나쁜 짓? 무슨 나쁜 짓이요?"
10005050-71 = "예? ……나쁜 짓? 무슨 나쁜 짓이요?"
10005050-72 = "……예?"
10005050-73 = "채권 발행이요? 그야 여기서 뽑기 좀 하다가 돈이 부족해서 약간 가져다 쓰긴 했지만……."
10005050-74 = "약간? 그게 약간이라고?"
10005050-75 = "그동안 네가 얼마나 쓰고 있었는지 계산은 하고 있었냐? 보나 마나 안 했지? 그냥 막 썼지?"
10005050-76 = "계산이요? 글쎄요. 딱히?"
10005050-77 = "충동적으로 뽑아 쓴 거라서 청구서 뽑아봐야 알 거 같은데요?"
10005050-78 = "대체 얼마나 뽑기를 하고 논 거냐! 평생 뽑을 뽑기 여기서 다 하려고 그랬냐!?"
10005050-79 = "아, 안 세 봐서 모른다니까요? 그리고 돈이야 떨어지면 대충 다른 데에서 가져오면 되지!"
10005050-80 = "하. 그러다 밀레니엄 돈 다 쓰면?"
10005050-81 = "다른 학교는 돈 없어요?"
10005050-82 = "……."
10005050-83 = "……애초에 남의 돈을 가져다 쓴다는 발상 자체가 이상하다는 생각은 안 해봤냐?"
10005050-84 = "딱히……? 왜요? 있는 걸 쓰는 건데?"
10005050-85 = "돈은 원래 순환하라고 있는 거잖아요. 묵혀 두고 있으면 그게 잘못 아닐까요?"
10005050-89 = "봤지, 선생? 이런 녀석이야. 말이 안 통하는 녀석이라고."
10005050-90 = "선배야말로 대화가 안 통하네요! 에휴. 하여간 뭐만 하면 폭력부터 쓰는 사람들이 그렇지~."
10005050-91 = "하……. 이 녀석 이거 지금 자긴 잡혀 있는 거 아니라고 아주 여유가 넘치는데."
10005050-92 = "거기 딱 기다리고 있어. 조금만 있으면 다른 녀석들이 와서 날 몰래 빼내 줄 테니까."
10005050-93 = "그럼 바로 여길 나가서 너 이 녀석을 그냥……!"
10005050-105 = "역시 여기들 있었군."
10005050-106 = "어머나. 다들 여기서 모이는 모양이네요."
10005050-108 = "히익!? 서, 선배들……!?"
10005050-109 = "크하하하!! 봐라. 내가 뭐라 했어?"
10005050-110 = "역시 이럴 줄 알았지! 믿고 있었다고, 이 녀석들! 우릴 빼 주러 왔구나!"
10005050-115 = "뭐 하고 서 있어? 어서 안으로 들어가!"
10005050-117 = "……?"
10005050-118 = "……후훗."
10005050-119 = "……."
10005050-120 = "……아니. 우리도 잡혀 들어왔어."
10005050-124 = "……싫다, 진짜……."
