[translation]
42140-1 = "제14화;죄수의 딜레마"
42140-2 = "(코우사기 공원에서 짐을 정리하고 샬레로 돌아오니 이미 늦은 저녁 시간이었다……)"
42140-7 = "샬레 건물, 엔젤 24 편의점"
42140-10 = "(도시락을 구입하기 위해 매대로 가보니……)"
42140-14 = "[ns] \"어라? 도시락이 하나도 없네?\""
42140-15 = "죄, 죄송합니다. 선생님…… 오늘은 남아 있는 도시락이 없어요."
42140-16 = "[s1] \"오늘은 편의점 도시락으로 저녁을 해결하려 했는데……\"\n[s2] \"폐기 도시락도 없는 거야?\""
42140-19 = "네. 평소에는 팔리지 않아서 언제나 폐기되던 숙주 도시락조차도……"
42140-20 = "그게, 어째서인지 어제부터 엔젤 24의 샬레 지점에서만 도시락 발주가 금지되어서요."
42140-21 = "그 이유를 물어보았지만 새로운 행정명령 때문이라는 답만 돌아오고, 이미 발주한 도시락도 모두 취소되어서……"
42140-22 = "지금 편의점에 남아 있는 물건이라고는 생수 정도밖에……"
42140-23 = "[s] \"빵이나 음료수도 없는 거야……?\""
42140-24 = "네. 빵은 물론이고 음료수까지 발주가 금지되었다고 해서……"
42140-25 = "오늘은 하루 종일 개점휴업 상태네요. 불편을 끼쳐드려 죄송합니다……."
42140-26 = "[s3] \"괜찮아, 소라의 잘못이 아닌걸.\"\n[s4] (생각했던 것보다 쪼잔한 방식의 복수인걸……)"
42140-33 = "저, 선생님…… 혹시 요새 D.U.에서 벌어지고 있는 일에 대해 뭔가 알고 계신가요?"
42140-34 = "그제 시내에서 소란이 생겼던 이후로는 지나가는 사람들의 발길도 뚝 끊기고, 본사의 분위기도 심상치 않아서요."
42140-35 = "손님 응대에 필요한 새 규칙이라며 두꺼운 매뉴얼 북이 들어오기도 하고, 행정명령을 준수하고 있는지 확인한다며 카이저 시큐리티의 무서운 가드들이 가게를 순찰하기도 하고……"
42140-36 = "거기에 더해 들리는 소문에 의하면 <엔젤 24> 매장도 곧 모두 폐점하고, 대신 그 자리에는 <카이저 26>이 들어올지도 모른다던데…… 이를 어쩌죠?"
42140-37 = "<카이저 26>은 하루에 26시간을 일해야 할 정도로 근무 환경이 가혹하다던데, 그런 곳에서 일하면 과로로 쓰러지고 말 거예요……"
42140-38 = "[ns5] \"26이 그런 의미였구나……\"\n[ns6] \"그래도 하루에 26시간 일하는 건 불가능하지 않을까……?\""
42140-43 = "[ns] \"소라는 저녁 먹었어?\""
42140-44 = "네, 저는 도시락을 싸 왔기 때문에 괜찮아요."
42140-45 = "어제 저녁에 고기 감자조림을 너무 많이 만들어버려서, 오늘 저녁에 일하면서 먹을 도시락 반찬으로—"
42140-50 = "아, 저……"
42140-51 = "혹시라도 제 도시락이 필요하시다면……"
42140-52 = "[ns] \"괘, 괜찮아! 신경 쓰지 마!\""
42140-57 = "(차마 소라의 도시락을 받을 수는 없었기에 정중히 사양하고 샬레 집무실로 돌아왔다.)"
42140-59 = "샬레 집무실"
42140-63 = "[ns] \"배고프다…….\""
42140-69 = "<안녕하세요, 'FOX EATS' 입니다!>"
42140-70 = "<[USERNAME] 고객님, 도시락 배달 주문 시키셨었죠?>"
42140-74 = "[ns] \"……음식 주문을 한 적은 없는데요?\""
42140-75 = "<이상하네요…… 분명 유부초밥 도시락 1인분을 이곳 샬레 집무실에 배달해 달라는 주문을 받았는 걸요.>"
42140-76 = "<혹시 모르니 확인을 위해 잠깐 문을 열어 주실 수 있으신가요?>"
42140-80 = "[ns7] 문을 열어준다.\n[ns8] 문을 열어주지 않는다."
42140-85 = "<……감사합니다.>"
42140-91 = "[ns9] \"너희는 그때의……?\""
42140-92 = "좋은 저녁이네요, 선생님. 다시 만나 뵙게 되어 반갑습니다."
42140-93 = "안녕!"
42140-94 = "이 어른을 또 보러 오게 되다니……"
42140-98 = "늦은 시간인데, 저녁 식사는 어떻게 하셨나요?"
42140-99 = "<……하는 수 없네요. 여기까지 와서 돌아가는 것도 어려우니……>"
42140-104 = "<……접착성 폭약 설치 완료. 기폭 개시.>"
42140-105 = "[s10] \"……뭐 하려는 거야?\""
42140-110 = "<3…… 2…… 1……>"
42140-114 = "[ns11] \"잠깐 기다려, 지금 열어줄 테니까—\""
42140-125 = "이런, 생각보다 크게 부서졌네."
42140-126 = "오토기, 브리칭하는 데 도대체 폭약을 얼마나 쓴 거야? 출입문이 프레임째로 날아갔잖아!"
42140-127 = "미안, 저격수라 CQB에는 익숙하지가 않아서."
42140-128 = "아하하…… 죄송합니다, 선생님. 부서진 문은 금방 수리해 드릴게요……"
42140-129 = "[s12] \"너희는 그때의……?\""
42140-133 = "좋은 저녁…… 이라고 하기에는 면목 없는 상황입니다만, 다시 만나게 되어 반갑습니다. 선생님."
42140-134 = "늦은 시간인데, 저녁 식사는 어떻게 하셨나요?"
42140-137 = "[ns] \"아직이야.\""
42140-138 = "안 그래도 식사는 아직 하지 않으셨을 거라고 생각했습니다."
42140-139 = "이번 신규 행정명령으로 인해 샬레의 편의점 물류 유통에 차질이 생긴 듯하여……"
42140-141 = "차질은 무슨. 단순히 자기 말을 들어주지 않는다고 심술을 부리는 것에 불과하잖아?"
42140-142 = "초등학생도 아니고, 먹는 걸로 장난을 치다니…… 유치해."
42140-143 = "하지만 농성 중인 적을 상대하기 위해 병참을 차단하는 건 중요한 전략이야."
42140-144 = "아무리 강경한 사상가라 하더라도 배를 곯으면서까지 투쟁을 계속할 수는 없는 법이거든."
42140-146 = "딱히 선생님께서는 샬레의 집무실에서 농성을 하고 계신 건 아니지만……"
42140-150 = "일단은 저희 FOX EATS…… 아니, FOX 소대에서 선생님을 위해 간단한 식사를 준비해 왔답니다."
42140-151 = "[ns] \"……이건 유부초밥인가?\""
42140-152 = "네. 전에 한 번 제가 만든 유부초밥을 드셔 보셨지요?"
42140-153 = "다행히도 입에 맞으셨던 것 같아서, 그때 만든 것과 같은 유부초밥을 다시 준비해 왔어요."
42140-154 = "양은 충분히 준비했으니까, 편하신 대로 마음껏 드세요."
42140-156 = "물론 이 시점에서 우리들이 준비한 음식을 먹는 건 꺼려지겠지만—"
42140-160 = "[ns] 니코가 가져온 유부초밥을 먹는다."
42140-167 = "……먹었는데?"
42140-168 = "에……? 의심없이 먹는다고……? 진짜……?"
42140-170 = "저, 괜찮으신가요……?"
42140-171 = "[s13] \"괜찮아. 맛있는데?\"\n[s14] \"유부도 부드럽고 밥도 고슬고슬해서 최고야!\""
42140-174 = "아뇨. 그런 뜻이 아니라……"
42140-179 = "저희가 할 말은 아니지만…… 이 도시락에 독이 들어있을 수도 있다는 의심은 하지 않으셨나요?"
42140-180 = "[s] \"……응? 이 유부초밥 안에 독 들었어?\""
42140-181 = "아뇨. 그건 아니지만……"
42140-185 = "저기, 뭔가 착각하고 있는 것 같은데…… 지금의 우리는 적대 관계라고."
42140-186 = "샬레의 선생님이라면 알고 있잖아? 우리 FOX 소대는 현재 SRT 학원의 부활을 위해 카야 총학생회장 대행에게 협력하고 있어."
42140-187 = "그런데 카야의 제안을 단칼에 거절했으면서, 그 협력자인 우리가 아무런 꿍꿍이도 없이 음식을 가져왔을 거라고 생각하는 거야?"
42140-188 = "아무리 사람이 좋아도 유분수지……"
42140-189 = "뭐— '적에게 보내는 소금'이라는 표현도 있지만, 보통은 적이 보내온 물건에는 손을 대지 않는 게 현명하지."
42140-190 = "작전 중에는 일부러 적이 노획할 때를 대비해서 소지품에 불량 탄약을 섞어 둘 때도 있을 정도니까."
42140-191 = "그래서 SRT 학원에서도 '적진에서는 안전을 위해 직접 가져온 음식 이외에는 물도 함부로 마시지 말라'고 거듭 가르치긴 하지만……"
42140-192 = "[ns] \"난 너희들의 적이 아니야.\""
42140-196 = "[ns] \"……그저 선생님일 뿐이지.\""
42140-200 = "으음……"
42140-201 = "……들은 대로의 사람이네."
42140-203 = "굳이 적이 아니더라도 사람을 쉽게 믿어서 좋을 건 없으니까요."
42140-204 = "사람을 신뢰하는 모습을 쉽게 보이면, 미숙하고 불안하다는 인상을 주어 협상에서 손해를 보거든요."
42140-205 = "사회에서는 낯선 이를 의심하고, 불신하고, 경계하지 않으면 손해를 본다는 것을."
42140-206 = "……선생님도 어른이시니까, 알고 계시잖아요?"
42140-207 = "[s] \"의심해서 잃는 것보다, 신뢰해서 얻는 것이 더 많은 법이야.\""
42140-209 = "……궤변이야."
42140-210 = "선생님은 <죄수의 딜레마>라는 게임 이론을 알고 있어?"
42140-211 = "서로가 상대에게 유리한 선택을 하면 아무런 손해도 입지 않지만, 상대가 자신을 배신하면 상대의 여죄까지 뒤집어쓰게 되는 상황에서 어떤 선택이 제일 '합리'적인지 논하는 이론."
42140-212 = "이 이론에 따르면 죄수는 상대의 선택과 무관하게 배신하는 것이 언제나 이득이기 때문에 언제나 배신을 택하게 되지."
42140-213 = "실제로도 우리는 그동안 수많은 <죄수>를 다뤄왔지만, 일부러 남 좋은 일을 자처하는 바보는 단 한 명도 없었어."
42140-214 = "……어른들이 말하는 신뢰라는 것도, 결국 이와 다르지 않아."
42140-215 = "[s15] \"뭔가 어려운 이론이지만…… 흥미롭네.\"\n[s16] \"……역시 SRT의 엘리트들이구나!\""
42140-218 = "뭐, 엘리트가 아니더라도 이 정도의 게임 이론은 누구나 충분히—"
42140-222 = "아니, 지금 칭찬할 때가 아니잖아……?!"
42140-223 = "너무 칭찬에 무르잖아……"
42140-224 = "[s] \"그렇지만 실제로는 다르지 않을까?\""
42140-225 = "물론 게임 이론을 현실에 적용하기 위해서는 여러 가지 변수를 더 적용해야지."
42140-226 = "이 선택이 가져온 결과가 다음 게임에 어떤 영향을 끼칠지도 고려해야 한다든가……"
42140-227 = "……하지만 선생님, 이 게임은 단판 승부로도 끝날 수 있어."
42140-228 = "패자는 영원히 돌아오지 못하는, 피드백이 없는 야생의 사회에서 제일 주효한 전략은 '언제나 상대를 배반하여 공포를 안겨주는' All-Defect 전략이지."
42140-230 = "……이번 일이 끝나면 저희는 다시 돌아오지 않을지도 몰라요."
42140-231 = "게다가 저희는 무기이기 때문에 선생님의 선택을 기억하지도 않죠."
42140-232 = "이 선택이 다른 학생에게 영향을 미치는 일도 없을 겁니다."
42140-233 = "그런데도 저희를…… 학생을 신뢰하시나요?"
42140-234 = "[s] \"믿어.\""
42140-236 = "우리를 놀릴 생각이라면 더 이상은—"
42140-237 = "……진정해, 쿠루미."
42140-239 = "모두가 오늘의 일도 기약하지 못하는데, 선생님은 내일의 가능성에 승부를 거시는군요."
42140-240 = "[ns] \"당연하지.\""
42140-245 = "[ns17] \"나는 선생님이니까.\"\n[ns18] \"내일의 어른이 될 아이들을 가르치는 사람이니까.\""
42140-253 = "……이상한 어른이야."
42140-254 = "……정말 소문만큼이나 이상한 어른이네."
42140-255 = "[s] \"게다가 신뢰의 강점은 너희가 직접 증명하고 있잖아?\""
42140-257 = "[ns19] \"FOX 소대는 소대장에 대한 신뢰가 두터운 팀이라고 들었어.\"\n[ns20] \"FOX 소대의 강점은 그 신뢰에서 나오는 거겠지.\""
42140-260 = "유키노 쨩, 말인가요……."
42140-261 = "……뭐, 일단은 그렇지."
42140-262 = "……소대장이니까."
42140-266 = "[ns] \"……무슨 문제라도 있는 거야?\""
42140-272 = "아뇨. 아무 문제도 없습니다."
42140-273 = "FOX 소대의 유대는 그 무엇보다 견고하니까요."
42140-275 = "최소한 너구리 같은 선생님의 말 한 마디에 흔들릴 정도는 절대 아니지."
42140-276 = "……일단은 소대장이기 이전에 오래 알고 지낸 친구니까."
42140-278 = "알겠습니다. 선생님의 진심은 충분히 확인한 것 같네요."
42140-283 = "도시락도 전달 드렸으니, 저희는 그럼 이만 슬슬 돌아가 볼까요."
42140-284 = "갑자기 찾아와 질문만 쏟아내고 돌아가는 것 같아 어쩐지 죄송하네요……"
42140-285 = "대신이라기 뭣하지만 뭔가 저희에게 특별히 궁금하신 점은 없으신가요?"
42140-286 = "[s21] \"RABBIT 소대의 소대원들이 그쪽에 합류했다고 들었는데……\"\n[s22] \"RABBIT 소대는 다들 잘 지내고 있어?\""
42140-289 = "RABBIT 소대는 아마도 지금……"
42140-290 = "소대의 위치는 일단은 기밀이라, 말해주기가 곤란한 걸……"
42140-299 = "……샬레 앞 정류장에서 신키로오 방면 10번 버스를 타고 종점에서 내린 다음, 마른 계곡을 따라 동쪽으로 1km 정도 걸어가면 지도에는 나오지 않는 시설 하나가 보일 거예요."
42140-300 = "버려진 캠핑장처럼 보일 수도 있지만, 그곳은 총학생회장이 실종되기 전에 SRT 학생들의 훈련과 작전을 위해 건설된 군사 시설입니다."
42140-301 = "……RABBIT 소대는 그곳에 머무르고 있습니다."
42140-302 = "아이들의 안부는, [USERNAME] 선생님께서 직접 확인해 주세요."
