[translation]
80000028-1 = "초콜릿 맛 비약"
80000028-2 = "사야의 연구실"
80000028-3 = "(사야의 호출을 받고 사야의 연구실을 찾았다.)"
80000028-4 = "나님의 연구실에 어서 오는 것이다, 선생!"
80000028-5 = "오늘은 선생에게 시험해보고 싶은 약이 있어서 특별히 부른 것이다."
80000028-6 = "오늘 준비한 약은…… 초콜릿으로 만든 불로불사의 영약이야!"
80000028-7 = "밖에 나가보니 초콜릿을 염가에 잔뜩 팔고 있기에, 특별히 오늘은 초콜릿으로 영약을 만들어 본 것이다."
80000028-8 = "[s] 도망친다."
80000028-9 = "도망치지 마, 선생!"
80000028-10 = "이것도 다 연단술의 발전을 위해 필요한 일이라고!"
80000028-11 = "[s] \"초콜릿으로 어떻게 불로불사의 약을 만든 건데?\""
80000028-12 = "그야 초콜릿에는 항산화 성분이 잔뜩 포함되어 있으니까."
80000028-13 = "이 성분을 잔뜩 뽑아내서 농축하고, 다른 비약의 재료와 섞으면 몸의 나이를 되돌릴 수 있는 것이다!"
80000028-18 = "그렇게 준비한 게 바로 이 약이란 말씀."
80000028-19 = "자, 선생. 걱정하지 말고 쭉— 마시는 것이다. 베이스는 초콜릿이니까 맛도 그리 나쁘지 않을 것이다."
80000028-20 = "[s] 사야가 건넨 약을 마신다."
80000028-26 = "어때, 효과가 있어? 젊음이 느껴지는 것이냐?"
80000028-27 = "[s] \"잘 모르겠는데…….\""
80000028-28 = "그럴 리가 없는데…… 최소한 젊어지지 않더라도 몸이 황금색으로 빛나거나, 털이 돋아나야 정상인데……."
80000028-29 = "[s] \"너는 나한테 그런 걸 먹인 거야?!\""
80000028-30 = "우선 간이 분석 키트로 화학식을 분석해보면……."
80000028-31 = "으음…… 그렇군. 그렇게 많은 재료를 섞었는데, 결과물의 성분은 어째서인지 평범한 시판 초콜릿에 가까워진 것이다."
80000028-32 = "결국 내가 만든 건 재료만 잔뜩 들어간 초콜릿인 건가……."
80000028-37 = "자, 선생. 받는 것이다. 이번에 쓰고 남은 실패작이다."
80000028-38 = "어차피 이 약은 다 초콜릿이 되어 버렸으니 다른 곳에 쓰기도 어려울 테고. 애초에 나는 초콜릿 같은 건 좋아하지도 않으니까."
80000028-39 = "게다가 오늘 같은 날 다른 사람에게 초콜릿을 떠넘겨 봤자 이상한 오해를 살 것 같고……."
80000028-40 = "오, 오늘이 무슨 날이냐고……? 선생, 정말로 몰라서 묻는 것이냐?"
80000028-41 = "……."
80000028-42 = "역시 심각한 부작용이 남아있을지도. 검사를 해봐야 하나?"
