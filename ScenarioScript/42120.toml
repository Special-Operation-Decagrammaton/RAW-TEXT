[translation]
42120-1 = "제12화;결심"
42120-5 = "코우사기 공원"
42120-7 = "[ns] \"……다녀왔어.\""
42120-9 = "[ns1] \"다들 어디에 간 거야?\"\n[ns2] \"고급 특상 소고기 도시락을 가져왔는데—\""
42120-16 = "(……한동안 공원 곳곳을 둘러보았지만 RABBIT 소대원들의 모습은 어디서도 보이지 않았다.)"
42120-25 = "(소대원들이 머무르던 텐트 안은 말끔하게 치워진 채 편지 한 장만이 남겨져 있었다.)"
42120-29 = "[ns3] \"이건……\"\n[ns4] 책상 위에 놓인 편지를 읽는다."
42120-34 = "[USERNAME] 선생님께."
42120-35 = "선생님, 미야코입니다. 이렇게 편지로 인사를 대신하게 되어 죄송합니다."
42120-39 = "저희는 금일부로 코우사기 공원에서의 농성을 종료하고 선배들이 있는 장소로 복귀하려 합니다."
42120-44 = "그 날, 선배들에게 들은 말 때문에 생각이 바뀐 것도 있었지만……"
42120-45 = "SRT 부활에 호의적인 카야 실장이 총학생회장 대행이 된 이상, 이곳에서 무력시위를 이어 나갈 명분도 더 이상 없겠다는 판단이 들었습니다."
42120-46 = "명분 없는 투쟁을 지속할 만큼 공원에서의 생활은 쉽지 않으니까요."
42120-49 = "먹을 것도, 자는 곳도, 씻을 곳도 풍요롭지 않아서…… 소대원들에게는 많은 폐를 끼쳤습니다."
42120-50 = "또 선생님께도 많은 도움을 받았지요."
42120-51 = "선생님이 계시지 않았더라면, 저희의 삶은 진작에 꺾여버리고 말았을 거예요."
42120-52 = "하지만 이제는 선배들의 도움을 받을 수 있게 되었으니."
42120-53 = "사키가 원하는 규율 잡힌 생활도, 모에가 원하는 강력한 화기도, 미유가 원하는 안락한 생활 공간도 모두 마련할 수 있습니다."
42120-54 = "다만 제 신념에 조금 걸리는 부분이 있기는 하지만……"
42120-59 = "저희는 결국 명령에 따르는 무기에 불과하니까요."
42120-60 = "이 결정이 부디 최선의 선택이었기를 바랄 뿐입니다."
42120-61 = "……멋대로 결정을 내리는 나쁜 아이라 죄송합니다."
42120-62 = "본래는 직접 얼굴을 뵙고, 적어도 전화상으로라도, 선생님께 상의를 드리는 게 옳았을 거라고 생각했었습니다만……"
42120-63 = "선생님의 목소리를 들으면 어쩐지 마음이 약해질 것 같아서……"
42120-64 = "이렇게 마지막 인사를 드리는 점 양해 부탁드립니다."
42120-65 = "그동안 큰 폐를 끼쳤습니다."
42120-66 = "공원의 물자는 작전이 모두 끝나면 돌아와서 정리하겠습니다."
42120-70 = "기회가 된다면 언젠가…… 다른 곳에서, 다른 모습으로 뵐 수 있기를."
42120-71 = "미야코 올림."
42120-74 = "[ns] 공원의 남은 짐을 정리한다."
42120-82 = "D.U. 외곽, 버려진 군사 훈련장"
42120-85 = "좌표에 따르면 여기가 선배들이 찾아오라고 했던 그 지점인데……"
42120-90 = "이 시설은…… 군사 훈련장?"
42120-92 = "이런 외진 장소에 이만한 규모의 시설이 있었을 줄이야……"
42120-94 = "이상하네. 위성 사진이나 온라인 지도상에는 아무것도 존재하지 않는 공터로 표시되고 있는데……"
42120-95 = "카메라의 인식 기능을 저해하는 대형 ECM 장치라도 설치되어 있는 건가?"
42120-101 = "……총학생회장이 실종되기 전에 건설된 SRT 학원 전용의 군사 훈련장이군요."
42120-102 = "유사시에 거점으로 활용할 수 있도록 존재 자체가 기밀로 취급되었기에, 저도 실제로 와 보는 것은 처음입니다만……"
42120-104 = "……끝내 결심이 들었나 보군."
42120-112 = "유키노 선배……"
42120-120 = "……신고합니다."
42120-121 = "SRT 특수학원 소속, 츠키유키 미야코 외 3인은 FOX 소대로의 전입을 명 받았습니다."
42120-122 = "이에 따라 현 시간부로 RABBIT 소대는 해체. 소대원들에 대한 통제 권한은 FOX 소대의 소대장인 시치도 유키노에게 이양합니다."
42120-124 = "통제 권한의 이양을 확인. 현 시간부로 츠키유키 미야코 외 3인은 FOX 소대 소속 RABBIT 분대로서 활동하게 된다."
42120-130 = "FOX 소대에 온 것을 환영한다, 츠키유키 분대장."
42120-131 = "……감사합니다."
42120-139 = "오, 왔구나. 토끼 후배들."
42120-140 = "……늦었잖아. 선배들을 얼마나 더 기다리게 할 셈이었어?"
42120-141 = "오토기 선배, 쿠루미 선배……!"
42120-143 = "다들 먼 길 오느라 수고 많았어."
42120-144 = "배고프지? 바로 식사부터 준비해 줄까? 아니면, 샤워부터 할래?"
42120-149 = "샤, 샤워……?"
42120-150 = "여, 여기에는 샤워실도 있나요……?"
42120-152 = "물론이지. 위생은 부대의 전투력과 직결되는 중대한 문제니까."
42120-153 = "아무리 환경이 열악하다 하더라도 샤워 시설도 없이 훈련을 할 수는……"
42120-159 = "아…… 미, 미안."
42120-160 = "괜찮습니다. 그 공원을 농성 장소로 정한 것은 저희의 선택이었으니까요."
42120-162 = "이 훈련장에는 샤워실은 물론이고, 개인 침대도 있으니까. 훈련장의 시설은 원하는 대로 마음껏 쓰도록 해."
42120-164 = "감사합니다……!"
42120-165 = "아, 지쳤어…… 빨리 샤워를 하고 푹신한 이불에 몸을 누이고 싶어……"
42120-167 = "샤워도 좋지만, 우선 그 전에……"
42120-175 = "지금부터 주특기 숙달 훈련을 시작한다!"
42120-180 = "주, 주특기 훈련이요……? 갑자기 어째서……"
42120-182 = "저번에 전투하는 모습을 보니 기초 전투 능력이 꽤나 부실해졌던데……"
42120-183 = "신고식을 겸해서 주특기 실력을 한 번 테스트하는 것도 나쁘지 않겠지?"
42120-185 = "RABBIT 분대, 전원 CS복으로 환복하고 연병장에 집합!"
42120-186 = "으으…… 모처럼 안락한 숙소에서 휴식을 취할 수 있나 했더니……"
42120-187 = "후후…… 오랜만에 선배들이 직접 훈련을 지도해 준다니, 묘하게 기분이 들뜨네."
42120-188 = "자, 자. 다들 뭐 하고 있어? 빨리 가서 짐부터 풀고 환복해야지!"
42120-189 = "……예정에 없던 훈련이 추가되었다고 좋아할 학생은 SRT에도 너밖에 없을 거야."
42120-190 = "그래도 여기에는 샤워실이 있으니까…… 몸이 더러워질 걱정을 하지 않고 열심히 땀을 흘릴 수 있겠어."
42120-192 = "오늘은 후배들이 왔으니 저녁 식사 준비에도 한껏 기합을 넣어야겠네, 후후."
42120-198 = "응……? 미야코, 왜 그래? 무슨 걱정이라도 있어?"
42120-199 = "아, 아니요. 그저……"
42120-205 = "……아무것도 아닙니다."
42120-209 = "다음화;충격과 공포"
