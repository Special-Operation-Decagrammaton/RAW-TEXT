[translation]
62060-1 = "제6화;길 잃은 아이"
62060-3 = "다들, 수고 많았어."
62060-8 = "뭐, 뭔가 엄청난 하루였네요……."
62060-9 = "확실히, 그랬지."
62060-10 = "하지만 그런 것 치고, 다들 크게 흔들리지는 않았던 것도 같군."
62060-11 = "그거야 뭐, 도망 다니면서 별일을 다 겪어 봤으니까."
62060-12 = "[s] \"모두 강해졌구나…….\""
62060-13 = "우리 의지가 아니었거든?"
62060-14 = "뭐? 원래 그런 건 타의로 강해지는 경우가 많은 법이라고?"
62060-15 = "……하아. 꼭 얄밉게 틀린 말 한번을 안 해요……."
62060-16 = "그, 그런데 우리는……."
62060-17 = "……."
62060-18 = "이 일이 끝나면, 또다시 계속 도망치면서…… 살아가야 하는 거겠죠……?"
62060-19 = "히요리……?"
62060-23 = "아, 아니에요! 저는 이것도 좋아요! 헤, 헤헤……."
62060-24 = "그렇지만 역시……."
62060-25 = "뭔가……."
62060-26 = "저, 저도 참 이상하네요! 오랜만에 아리우스에 돌아와서 그런가, 이상한 생각이나 하고 말이죠……."
62060-27 = "[s1] \"아니야, 히요리. 그렇지 않아.\"\n[s2] \"너희들과 아리우스 분교에 관한 것은…….\"\n[s3] \"어떻게 보면, 내 직무 유기 같은 것이기도 하니까…….\""
62060-33 = "네? 그, 그게 무슨 소리세요?"
62060-34 = "선생……?"
62060-35 = "……."
62060-40 = "있잖아, 선생님. 그렇게 모든 일에 과도한 책임을 지려고 하지는 말아 줘."
62060-41 = "이건 우리가 선택한 길이고, 그래서 우리 역시 이 길에 짊어져야 할 것들이 있어."
62060-42 = "그래도 만에 하나 다른 방법이 있지 않을까 한다면……."
62060-43 = "그때는 다 함께, 같이 생각하자."
62060-44 = "지금은, 미네 씨가 우리에게 부탁한 것에 대해 의논하는 게 어떨까?"
62060-45 = "[s] \"'일상', 말이지…….\""
62060-46 = "응. 아리우스의 일상."
62060-47 = "……사실 아리우스의 일상은, 그 사람이 말한 것과는 완전히 다른 것이었긴 한데……."
62060-48 = "그건…… 그랬죠. 어떻게 보면 지금 아리우스 아이들은, 생전 처음 겪어 보는 경험만 하고 있을 거예요……."
62060-49 = "수업에…… 공부에…… 현장 학습……. 웅덩이 물을 걸러서 마실 수 있는 도구도 있고, 각종 신상 의약품에……."
62060-51 = "긴급용품이기는 하지만, 찢어진 천막이 아닌, 보온 효과는 확실한 이불이라든가."
62060-52 = "영양 개선 구호식 같은 것도, 여기에서는 모두 낯선 것들이다."
62060-53 = "새삼 느끼게 되는군. 누군가의 일상은, 다른 누군가의 기적인 것이라는 사실을 말이지."
62060-55 = "하지만 미네 씨는 그걸, 가능한 한 앞으로도 지켜 달라고 했지?"
62060-56 = "반복할 만한 같은 일과를 반복하는 것. 그저 그렇게 사는 것만으로 자기 안의 무언가가 성장해 갈 수 있는 것……."
62060-57 = "사실 그거, 의외로 쉬운 일 아닌데 말이지."
62060-58 = "[s4] \"그 말이 맞아. 미사키.\"\n[s5] \"그러니까 선생님으로서는 더더욱 그렇게 해야 할 것 같아.\""
62060-61 = "하지만…… 역시 공부는 하기 싫죠……."
62060-62 = "[s] \"어허! 학생이 말이야, 공부를 해야지! 공부를!\""
62060-66 = "지, 지금 정말로 선생님 같았어요……!"
62060-67 = "아, 생각해 보니까 선생님은 선생님이셨죠…… 네……."
62060-68 = "[s6] \"역시 안 되겠구만!\"\n[s7] \"애들이 가장 싫어하는 걸 해야겠어!\""
62060-73 = "그, 그게 뭔데?"
62060-74 = "[s8] \"내일도 정상 수업을 할 거라고!\"\n[s9] \"모두에게 공지 모모톡을 보낼 거야!\""
62060-77 = "정말 심술쟁이네, 선생님……."
62060-78 = "뭐? 싫은 일을 반복해서 이겨낼 수 있어야, 사람이 강해지는 법이라고?"
62060-79 = "하아……. 그거 아리우스에서도, 조금 많이 변형시켜서 사용되고 있는 말이거든?"
62060-80 = "그건 그랬지……."
62060-81 = "후후. 하지만 아리우스식의 훈련보다는, 선생의 수업이 훨씬 나은 것 같군. 물론 개인적인 감상이다만."
62060-82 = "너는 아니었던 건가, 미사키?"
