[translation]
42130-1 = "제13화;충격과 공포"
42130-2 = "키보토스 총학생회 회의실"
42130-5 = "……그래서 제가 요구하는 조건은 단 하나뿐입니다."
42130-6 = "붉은겨울 학원 출신의 용역 시위대를 붉은겨울 사무국이 책임지고 해산시키는 것."
42130-7 = "……이해하셨는지요, 체리노 회장?"
42130-12 = "무언가 오해가 있었던 모양이군, 신임 총학생회장 대행."
42130-13 = "이 몸은 단순한 학생회장이 아니라……"
42130-14 = "붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장이자, 체육부장이자, 청소부장이자, 선도부장이자, 급식부장이자 이달의 최우수 푸딩 시식가로 선정된 체리노 님이시다!"
42130-15 = "그런 단순한 호칭으로 이 몸을 부르는 것은 용납할 수 없어!"
42130-16 = "네. 붉은겨울 학원의 학생회장이시자, 그 외 이것저것 중책을 맡고 계신 체리노 님. 지금 중요한 것은 호칭의 문제가 아니라—"
42130-17 = "'그 외 이것저것'이라니……? 이 무슨 무례한 발언이란 말인가!"
42130-23 = "(……이 꼬맹이는 어째서 아무도 신경 쓰지 않는 가짜 직책에 이렇게 집착하는 거야……?)"
42130-29 = "……실례했습니다, 체리노 서기장."
42130-30 = "하지만 지금 가장 우선하여 대응해야 하는 문제는 D.U. 시내 곳곳에서 시위를 주동하며 총학생회의 행정을 마비시키고 있는 시위대의 문제입니다."
42130-31 = "외주 치안기관이 조사한 결과, 이 시위대는 대부분이 붉은겨울 학원 출신의 학생으로 구성된 것으로 파악되었습니다."
42130-32 = "D.U.의 치안을 관리하는 방위실장이자 총학생회장 대행으로서 이 사태에 대해 붉은겨울 사무국에 강력히 항의하는 바입니다."
42130-33 = "그러고보니 요새 용역부 녀석들이 조용하다 싶었는데, 그런 곳에서 말썽을 부리고 있었나……"
42130-34 = "녀석들은 뭐가 불만이기에 그곳에서 시위를 하고 있는 거지?"
42130-35 = "잘 물어보셨습니다, 체리노 회장."
42130-36 = "그 학생들은 푸딩 지급이나 주 2일 노동과 같은 이해되지 않는 정책을 요구하는 것뿐만 아니라, 더 나아가……"
42130-37 = "……쿠데타를 일으키려 하고 있습니다!"
42130-42 = "……그래서?"
42130-47 = "……혹시 제 말을 잘못 들으셨나요?"
42130-48 = "쿠데타입니다…… 반역이라고요! 그 학생들은 총학생회를 전복시키려는 시도를 하고 있습니다!"
42130-49 = "이는 키보토스의 치안을 책임지는 총학생회장 대행으로서 용납할 수 없는—"
42130-50 = "쿠데타라…… 나도 자주 겪어봐서 쿠데타가 얼마나 귀찮은 일인지는 잘 알고 있지."
42130-51 = "하지만 방위실장, 쿠데타를 원천적으로 막을 수 있는 방법은 존재하지 않는다네."
42130-52 = "학생회의 정책이 마음에 들지 않으면 쿠데타를 일으키는 게 당연하지 않는가?"
42130-53 = "네? 그게 무슨……"
42130-54 = "물론 우리 같은 위대한 지도자의 정책을 한낱 참새 같은 학생들이 이해할 수는 없겠지만 말이야."
42130-55 = "D.U.의 총학생회장 대행도 고생이 많군 그래. 녀석들을 상대하려면 여러모로 피곤하겠어."
42130-56 = "그러니까 붉은겨울 사무국이 책임지고 시위대의 해산을—"
42130-57 = "원칙대로라면 학원 밖의 일에는 관여하지 않는다만, 이번만큼은 총학생회장 대행의 노고를 치하하는 의미에서……"
42130-62 = "우리 붉은겨울 사무국에서 체룐카를 한 박스 보내도록 하지!"
42130-67 = "체룐카가…… 뭐죠?"
42130-68 = "으응? 방위실장은 체룐카를 먹어본 일이 없단 말인가?"
42130-69 = "체룐카는 붉은겨울 학원에서 생산되는 특제 밀크 초콜릿이다. 달콤한 맛이 아주 일품이지!"
42130-70 = "한 번 먹어보고 마음에 든다면 특별히 총학생회에는 체룐카의 정기 납품을 고려해 보겠네."
42130-71 = "그러니까 지금 필요한 건 밀크 초콜릿이 아니라 진압 병력을—"
42130-72 = "……이런! 벌써 이런 시간이 되어 버린 건가?"
42130-73 = "모처럼 즐겁게 이야기를 나누느라 오후 낮잠 시간을 놓칠 뻔했네."
42130-74 = "그럼 다음에 또 이야기하도록 하지, 카…… 뭐시기 총학생회장 대행."
42130-80 = "이 빌어먹을 꼬맹이가……"
42130-81 = "붉은겨울 학원에는 어째서 제대로 된 학생이 단 한 사람도 없는 건가요!"
42130-88 = "……어? 나, 나는 붉은겨울 학원 출신 아닌데?"
42130-90 = "……당신 들으라고 한 이야기가 아니거든요."
42130-91 = "조정실장. 정말 저 꼬맹이가 붉은겨울 학원의 대표이자 학생회장이 맞는 건가요?"
42130-93 = "네. 현시점에서 붉은겨울 연방학원의 학생회장은 렌카와 체리노 씨가 맞습니다."
42130-94 = "현 시점에서……?"
42130-95 = "일주일 전에는 이케쿠라 마리나 위원장이 붉은겨울 학원의 학생회장이었습니다."
42130-99 = "지금 그러니까……"
42130-100 = "일주일 단위로 대표가 뒤바뀌는 학교와 협상을 해서 치안 문제를 해결해야 한다는 소리인가요?"
42130-102 = "하지만 전임 대행이었던 린 선배는 아무런 불평 없이 잘만 해왔는걸."
42130-103 = "당근과 채찍을 잘 활용하면 오히려 트리니티나 게헨나의 학생회장을 대하는 것보다 간단한 일일 텐데……"
42130-104 = "뭐, 채찍밖에 모르는 방위실 출신의 대행에게는 조금 어려운 일일지도 모르겠지만. (와작)"
42130-111 = "저, 저…… 카야 실장님……"
42130-112 = "……총학생회장 대행."
42130-113 = "죄, 죄송합니다…… 총학생회장 대행님!"
42130-114 = "방위실의 정기 보고 관련한 이슈입니다만…… 계좌에서 현금을 인출할 때마다 10여 종의 신분 증명 서류를 추가로 제출해야 한다는 새로운 행정명령에 대해 시민들이 크게 불만을 표시해서……"
42130-115 = "D.U. 곳곳에서 은행원에게 신분 증명 서류 대신 총기를 들이밀고 예금을 강제로 인출해 가는 사례가 속출하고 있다고 합니다."
42130-116 = "그건…… 단순한 무장 강도잖아요?!"
42130-117 = "D.U 곳곳에서 은행 강도가 속출하고 있는데, 발키리 경비국과 카이저 시큐리티는 무얼 하고 있는 건가요?"
42130-118 = "전에도 말씀드렸지만 경비국과 카이저 시큐리티는 검문으로 인한 인력도 부족한 상황이라……"
42130-119 = "인력이 부족하다면 민간 경비 업체든 뭐든 더 고용해서라도 치안을 안정시키세요."
42130-120 = "제가 관리하는 키보토스에서 범죄는 한 건도 용납할 수 없습니다!"
42130-126 = "(소근) 그렇게 말하지만 시내는 전보다 더 혼란스러워 보이던걸?"
42130-127 = "오늘 생텀 타워에 오는데도 시위 때문에 30분이나 더 걸렸어."
42130-128 = "범죄율은 줄었다지만, 중범죄는 더 자주 일어나는 것 같은데……"
42130-129 = "이게 다 애꿎은 시민들만 쥐어짜서 얻어낸 성과지."
42130-130 = "인재자원실장이 당하고 난 뒤로는 카야 실장을 지지하는 임원들도 많이 줄은 것 같은데……"
42130-131 = "이대로 대행을 유지해도 괜찮은 거야?"
42130-132 = "어쩌면 린 행정관이 그나마 유능했던 걸지도 모르겠어……"
42130-137 = "……해산! 본 회의는 이것으로 해산합니다!"
42130-152 = "총학생회장 대행 집무실"
42130-156 = "……기다리고 있었다."
42130-157 = "왔는가, 총학생회장 대행."
42130-158 = "안 그래도 카이저 시큐리티에 지불해야 할 대금이 지연되고 있는 것 같아 직접 찾아왔다네."
42130-159 = "치안 관리에 필요한 인력과 장비의 숫자를 계산했을 때, 이미 지불된 금액으로는 더 이상의 가드 운영이 곤란—"
42130-161 = "어째서 통제에 계속 구멍이 생기는 거죠?"
42130-162 = "당신네들에게 들인 비용이 얼마인데, 그깟 시위대 하나 제대로 통제하지 못해서 잡음이 제 귀에까지 들려오는 겁니까."
42130-163 = "그야…… 그만한 비용을 지불하지 않았기 때문이지."
42130-164 = "총학생회에서 지불하는 금액으로는 이 정도의 규제가 한계야."
42130-165 = "돈으로 문제가 해결되지 않는다면, 돈이 부족한 건 아닌지 생각해 봐야지."
42130-166 = "……돈 이야기를 할 입장이 아닐 텐데요, 카이저."
42130-167 = "제가 지난번 사태의 책임을 무마해 준 덕분에 카이저 코퍼레이션이 파산을 면하게 되었다는 걸 벌써 잊었나요?"
42130-168 = "잊었을 리가 있나. 기업의 가치는 신용이거늘."
42130-169 = "……하지만 프레지던트께서도 슬슬 불편한 심기를 드러내기 시작하셔서 말이야."
42130-170 = "아무리 파산을 면하게 도와주었다지만, 이렇게 한도 없이 돈을 계속 쏟아부으면 수지타산이 맞지 않거든."
42130-175 = "우리는 최악의 경우에는 카이저의 이름을 버리고 명패만 새것으로 갈아버리면 그만이야."
42130-176 = "하지만 너는 어떻지? 지금까지 쌓아온 명예와 이름을 버리고 처음부터 시작할 수 있겠나?"
42130-181 = "……코우사기 역의 지하에 건설한 사일로를 묵인해 주는 것만으로는 부족한가요?"
42130-183 = "그 건은 별개로 쳐야지. 지난번 리베이트가 폭로되며 타운 재개발이 엎어지는 바람에 오히려 적자를 보았으니까."
42130-184 = "이번 일이 끝나면 갚아드릴 테니 빚으로 달아 두시지요. 이자도 충분히 붙여서."
42130-185 = "원한다면 그렇게 하지."
42130-186 = "……하지만 이 이상 청구서를 늘려도 정말 괜찮겠나?"
42130-187 = "들리는 소문에 의하면 신임 총학생회장 대행은 아직도 재무실장의 신임을 얻지 못해 자금 조달에 어려움을 겪고 있다고 들었는데."
42130-188 = "부하들에게 신용도 얻지 못하는 리더에게 투자를 하자니, 조금 불안해서 말이야."
42130-195 = "(……도대체 뭐가 문제지?)"
42130-196 = "(어째서 내 주변에 있는 녀석들은 나를 곧이곧대로 신뢰하지 않는 거지?)"
42130-197 = "(내 지시에 따르기만 하면 모든 게 완벽할 텐데…… 어째서 다들 의심하고 반항하는 거지……?)"
42130-198 = "(……그[ruby=총학생회장] 여자는[/ruby] 무슨 말을 해도 키보토스의 모든 학생들이 따르고 신뢰했었는데.)"
42130-199 = "(나와 그녀는 무엇이 다르지……?)"
42130-200 = "(나는 어째서 <초인>이 될 수 없지……?)"
42130-201 = "(과거의 총학생회와 지금의 총학생회는 무엇이 다르지……)"
42130-208 = "……그래."
42130-209 = "이 키보토스에는 공포가 부족해."
42130-210 = "……충분한 공포를 보여준다면 모두가 내 말을 따를 거야."
42130-213 = "……카야?"
42130-214 = "유키노. 전에 당신이 회수한 <A.N.T.I.O.C.H.> 프로젝트의 결과물— 탄도 미사일용 열압력 탄두는 현재 어디에 보관되어 있죠?"
42130-215 = "그 미사일용 탄두는 비활성화하여 D.U. 외곽의 군사 시설에서 보관하고 있다."
42130-216 = "워낙 폭발력이 강해 기폭 처리하는 것도 쉽지 않으니까."
42130-217 = "……명령입니다, 유키노 소대장."
42130-218 = "지금 즉시 그 탄두를 코우사기 역 지하의 사일로로 가져가 폭파시키세요."
42130-226 = "……이유를 물어도 되겠나?"
42130-227 = "명령에 질문으로 답하다니, 당신답지 않은 반응이네요."
42130-228 = "하지만 어려운 일도 아니니 친절히 그 질문에 답변드리죠."
42130-229 = "방금 유키노 소대장이 말한 것처럼 <A.N.T.I.O.C.H.>의 탄두는 폭발력이 강력하기 때문에 주변에 미칠 피해를 염려하여 기폭 처리를 미루고 있었습니다."
42130-230 = "하지만 코우사기 타운은 재개발로 인해 대부분의 주민들이 떠났기 때문에, 기폭으로 인한 피해를 최소화할 수 있지요."
42130-232 = "그렇다고는 해도 여전히 코우사기 타운에 남아있는 시민의 수도 적지 않아."
42130-233 = "더욱이 열압력탄은 지하철과 같은 폐쇄 공간에서 기폭하면 더욱 위력이 강해지는데—"
42130-235 = "네, 알고 있습니다. 아마 코우사기 역은 물론이고 인근 역사까지 피해를 입겠지요."
42130-241 = "……하지만 그 정도의 위력은 보여주어야 다들 우리가 가진 힘을 짐작할 수 있지 않겠어요?"
42130-243 = "………!"
42130-244 = "여차하면 소도시 하나는 가볍게 지워버릴 수 있는 힘이 우리에게 있다는 걸 알게 된다면, 앞으로는 다들 건방진 소리를 입에 담지 못하겠죠."
42130-245 = "거기에 더해 지하철 시설에서 일어난 '사고'니, 안전 조치 미비를 핑계로 교통실에 책임을 물어 교통실의 임원들도 내보낸다면……"
42130-246 = "그야말로 일석이조의 효과가 아니겠어요?"
