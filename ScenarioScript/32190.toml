[translation]
32190-1 = "제19화;제3차 평가 시험"
32190-3 = "……아, 아우……."
32190-4 = "이제 끝인가요……."
32190-5 = "으, 으응……."
32190-10 = "코하루 쨩……?!"
32190-11 = "다, 다리가 풀려서……."
32190-12 = "그러게요……. 밤새 뛰어다니며 몸을 움직였으니……."
32190-13 = "게다가 요 일주일간 제대로 자지도 못해서……."
32190-17 = "아니, 히후미. 이제 시작이야."
32190-19 = "……네?"
32190-20 = "……아."
32190-21 = "마, 맞아요……. 평가시험이 남아 있었죠."
32190-22 = "아…… 잊고 있었어……."
32190-24 = "지금 시간 오전 7시 50분."
32190-25 = "시험장에 1시간만에 도착해야 해. 뛰어."
32190-30 = "네?! 뛰, 뛰라고요?! 자, 잠깐만요, 아즈사 쨩……?! 지금부터 외곽의 분관까지요……?!"
32190-31 = "전력으로 뛰어도 부족할 거 같네요, 히후미 쨩, 코하루 쨩! 달려야 해요!"
32190-35 = "거, 걷는 것도 힘들단 말야…… 기, 기다려어-!"
32190-36 = "아, 아우…… 어째서 이렇게……."
32190-39 = "하아…… 하아…… 하아……."
32190-40 = "겨, 겨우 도착했어요……."
32190-41 = "기다리고 있었습니다. 보충수업부 여러분. 하스미 부부장님의 전언입니다."
32190-42 = "힘내세요, 라고."
32190-43 = "어머나……."
32190-44 = "하, 하스미 선배가……."
32190-45 = "그리고 힘이 되어주지 못해 미안하다는 말도 전해달라고 했습니다."
32190-46 = "……그런가."
32190-47 = "[s] \"들어가자.\""
32190-51 = "……."
32190-52 = "……."
32190-53 = "……."
32190-54 = "……."
32190-55 = "[s] \"이게 마지막 시험이네.\""
32190-56 = "……응. 어떠한 결말이든 이 시험으로 결정되는 거야."
32190-57 = "그러네요."
32190-58 = "……아우."
32190-59 = "……."
32190-60 = "많은 일들이 있었던 기분이에요."
32190-61 = "아니, 감상은 시험을 치고 나서 하자."
32190-62 = "……네. 그래요. 그 누구의 힘도 빌리지 않고, 우리들의 노력으로…… 해내는 거예요."
32190-63 = "응 나도 어느 것 하나 포기하지 않겠어."
32190-64 = "네. 저도요. 아즈사 쨩에게 배운 걸 잊지 않으려고요."
32190-65 = "만점이야! 만점을 목표로 할 거니까!"
32190-67 = "[ns] \"그럼 3차 평가 시험, 시작!\""
