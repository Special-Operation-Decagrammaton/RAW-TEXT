[translation]
51160-1 = "제16화;고료 나구사"
51160-5 = "(들뜬 마음과 가벼운 발걸음, 그리고 기대감이 한껏 어린 목소리……)"
51160-6 = "(백귀야행의 거리는 지금, 축제를 기대하는 마음과 흥겨움으로 가득했다.)"
51160-8 = "(지난날 백귀야행에서는 몇 번이고 곧잘 볼 수 있었던…… 어찌 보면 평범한 풍경.)"
51160-9 = "(원래는 이 거리를 우리는…… 백화요란은………)"
51160-12 = "너와 함께…… 순찰하고는 했었지."
51160-13 = "…………아야메."
51160-15 = "이번에 또 아야메 선배가 문제아들을 전부 쓰러트렸대!"
51160-16 = "이것으로 벌써 통상 127번째 단독 분쟁 해결이지?"
51160-17 = "저번에는 나뭇가지에 올라가서 내려오지 못하는 고양이를 가볍게 구해준 적도 있다고 하던데."
51160-18 = "게다가 그것만이 아니라……!"
51160-20 = "(모두가 이야기한다.)"
51160-21 = "(아야메의 이야기를.)"
51160-23 = "정말 굉장하다니까. 아야메 선배는."
51160-24 = "아야메 선배만 있다면 어떤 일이 있더라도 걱정 없다니까!"
51160-25 = "나나카도 아야메 선배! 나도 언젠가 선배처럼──"
51160-27 = "정말 아야메 선배가 백화요란에 있어주어서 다행이야."
51160-32 = "응. 아야메가 있다면 백화요란은 문제없어."
51160-33 = "아야메가 있다면…… 나 또한 백화요란 활동을 함께할 수 있어."
51160-34 = "아야메의 소꿉친구로서……"
51160-35 = "나도 언제까지고 아야메의 곁에 설 수 있어."
51160-37 = "설 수 있다고 생각───"
51160-38 = "──했는데."
51160-41 = "그 이야기 들었어? 아야메 부장이 하루아침에 사라졌대."
51160-42 = "소문으로는 쿠즈노하 님과 이야기한 뒤로 모습을 감췄다던데."
51160-43 = "진짜야? 그거? 쿠즈노하라는 건 그냥 단순한 소문이잖아?"
51160-44 = "글쎄…… 그보다 이제 어떡하지?"
51160-45 = "앞으로 백화요란은? 부장의 자리가 공석이 되는 거잖아?"
51160-46 = "우리들은 어떻게 되는 거야?"
51160-51 = "그거라면 괜찮아. 걱정할 필요 없어."
51160-52 = "맞아, 우리에겐 나구사 선배가 있으니까."
51160-53 = "설사 아야메 선배가 없어져도, 소꿉친구이며 똑같이 우수한 나구사 선배가 남아 있어 주었으니까."
51160-55 = "그러니 괜찮아."
51160-62 = "아냐…… 그렇지 않아."
51160-63 = "(그것은 미처 입 밖으로 꺼내지 못한 마음.)"
51160-64 = "……나는, 그럴 수 없어."
51160-67 = "(남겨진 내게, 이 [ruby=자격]총[/ruby]은 너무나도 무거워.)"
51160-68 = "그도 그럴게…… 나는……"
51160-72 = "[ruby= ■ ■ ■   ■ ■ ■   ■   ■ ■   ■ ■ ■   ■ ■ ■   ■ ■ ■ ■]나는 아야메가 아니니까[/ruby]."
51160-76 = "[ruby=■ ■ ■ ■   ■ ■   ■ ■   ■ ■ ■ ■   ■ ■ ■ ■ ■ ■   ■ ■ ■ ■   ■ ■ ■ ■ ■   ■ ■ ■ ■]나로서는 그런 아야메를 대신할 수 없으니까[/ruby]."
51160-77 = "[ruby=■ ■   ■ ■ ■,   ■ ■ ■   ■ ■   ■ ■ ■   ■ ■   ■ ■ ■   ■ ■   ■ ■ ■ ■   ■ ■ ■ ■]백화요란의 부장으로서 자격을 가진 건 아야메뿐이니까.[/ruby]"
51160-79 = "나에겐 그런 자격 같은 건……. 그런 건 처음부터……."
51160-80 = "네가 떠나간 이곳을…… 나는 더 이상 혼자서는………"
51160-84 = "[ns] \"역시 네가 나구사였구나.\""
51160-88 = "……!"
51160-92 = "(인법연구부로부터 \"나구사로 보이는 사람을 서쪽 지구에서 발견한 거 같다.\" 라는 연락을 받은 뒤, 곧장 현장으로 찾아가자.)"
51160-93 = "(그곳에서 만날 수 있던 건 이전에도 한 번 이야기를 나눈 적이 있는 소녀였다.)"
51160-94 = "당신은 저번에 만났던…… 샬레의 선생님……."
51160-95 = "[s] \"그러는 넌, 그때 만났던 무한 닭꼬치의 행복 스파이럴 여고생……!\""
51160-96 = "행복 스파…… 뭐?"
51160-97 = "……시답지 않은 농담을 할 생각이라면 됐어."
51160-98 = "그 기색을 보니 이미 알고 온 거구나. 딱히 숨길 생각은 없었지만, 어쩌다 보니 이렇게 되었네."
51160-99 = "[s] \"나구사.\""
51160-103 = "그래, 맞아. 내가 바로 고료 나구사. 백화요란의 부부장이야."
51160-104 = "아니…… 자격을 반납한 지금은, 단순히 탈퇴한 부원에 지나지 않지만."
51160-105 = "그래서 내겐 무슨 일이야?"
51160-106 = "볼일이 있다고? 당신이? 왜……?"
51160-107 = "[s] \"저번에 만났을 때, 계승전과…… 백화요란에 대한 이야기를 했었지.\""
51160-109 = "(그때 이후로 벌어진 일들에 대해, 나구사에게 이야기했다.)"
51160-110 = "(유카리를 따라 키쿄를 만났던 일. 그곳에서 벌어진 계승전과 결과. 그리고 끝내 유카리가 이번 축제에서 무녀를 맡기로 한 것까지.)"
51160-112 = "……그래. 그렇구나."
51160-113 = "차라리 그게 맞는 거겠지. 그게 올바른 방향일 거야."
51160-114 = "[s] \"……정말 그렇게 생각해?\""
51160-115 = "……왜?"
51160-116 = "[s1] \"유카리는 이제껏 늘 나구사, 네 이야기를 했었어.\"\n[s2] \"너를 동경해서 자신은 백화요란에 들어왔다고.\""
51160-119 = "[ns3] \"그런 유카리가 백화요란을 떠나 돌아가는 것이,\"\n[ns4] \"정말 네가 바라는 바야?\""
51160-122 = "………………."
51160-123 = "……나는………."
51160-124 = "[s] \"나구사, 부장의 자격을 반납하려고 했다고 들었어.\""
51160-125 = "그래서 내가 왜 그런 일을 했냐고?"
51160-126 = "모두가 모인 이곳으로 돌아와, 왜 다시 백화요란으로서 활동하지 않느냐고, 그렇게 묻고 싶은 거야?"
51160-127 = "……………………"
51160-128 = "답은, 간단해."
51160-129 = "백화요란의 부장은 <나나카도 아야메>. 그 아이야."
51160-130 = "그러니 부장 자리엔 아야메가 어울려."
51160-131 = "아야메가 아니면 안 돼."
51160-132 = "내겐 아야메를 대신할 자격이 없어. 그래서 물러나려고 했을 뿐이야."
51160-136 = "………그 아이들의 생각만큼…… 나는 그 자리에 어울리지 않아. 그만한 자격을 가진 사람이 아니야……."
51160-137 = "비록…… 지금은 키쿄도, 렌게도…… 유카리조차도 납득할 수 없다고 화를 내고 있지만."
51160-138 = "시간이 지나면 다들 이해해 줄 거야."
51160-140 = "부장 대리……라는 호칭은, 그저 내게 떠맡겨진 것에 불과하단 것을."
51160-141 = "그래, 단지 그뿐───"
51160-146 = "[log=???][ff4444]<거짓말>[-][/log]"
51160-149 = "……?!"
51160-150 = "[s] \"방금 그건……?\""
51160-157 = "[ns] \"아, 축제의 시작을 알리는 불꽃놀이…….\""
51160-158 = "(폭죽이 피어오른다.)"
51160-160 = "(축제가 시작된다.)"
51160-171 = "망량즈, 너희들……"
51160-176 = "히익?!"
51160-177 = "아, 아냐……! 저건 우리가 한 게……!"
51160-178 = "우리가 부른 게 아니야! 진짜라구!"
51160-179 = "[s] \"무슨 소리야? 잠깐 진정하고………\""
51160-180 = "우린 그냥 그 녀석이 묻는 말에 대답했을 뿐이야."
51160-181 = "그냥 도움이 필요하다고. 녀석이 한 말에 <그럴지도 몰라> 라고 생각한 것뿐……"
51160-182 = "근데……!"
51160-192 = "………!"
51160-193 = "[s] \"………저게, 뭐야?\""
51160-194 = "………………[ruby=괴담]환량백물어[/ruby]."
51160-195 = "어째서…… 대설원이 아닌, 이곳에 저것이……!"
51160-198 = "무대 위로 배역은 전부 모였어요."
51160-199 = "그러니 이제 시작하도록 하죠."
51160-203 = "우리들의…… 우리들만의 [ruby=괴담]풍류[/ruby]를."
51160-205 = "다음화;거리를 거니는 괴담 1"
