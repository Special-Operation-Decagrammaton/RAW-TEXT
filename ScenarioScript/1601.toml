[translation]
1601-1 = "좌충우돌 급양부의 위생관리평가 1"
1601-2 = "(게헨나 학원의 학생식당)"
1601-3 = "(아침 급식시간이 시작되기 3시간 전.)"
1601-7 = "킁킁. 킁킁."
1601-9 = "냄새 나는 걸로 봐서는 여기, 이쯤에 있을 거 같은데……."
1601-13 = "아! 찾았다……!"
1601-15 = "오오- 그럼 어디."
1601-17 = "주리, 잡아!"
1601-18 = "네! 선배!"
1601-20 = "어?! 우와앗?!"
1601-25 = "잡았다! 학생식당의 쿠키 도둑!"
1601-26 = "네! 완전 포획이에요!"
1601-27 = "우웁?! 우물우물우물! 우웁우웁!"
1601-28 = "우물우물, 꿀꺽! 푸하아! 무, 무슨 짓이야!"
1601-29 = "그건 우리가 할 말이야."
1601-30 = "왜 이른 아침부터 학생식당을 기웃거리고 있는 거야?"
1601-31 = "네, 맞아요!"
1601-32 = "그, 그건……!"
1601-33 = "오늘 아침 디저트로 쿠키가 나온다고, 어제 이야기를 들어서."
1601-34 = "응, 그러니까. 그게……."
1601-39 = "아! 맞다! 응! 혹시 쿠키 맛이 괜찮은지! 먼저 확인해보려구!"
1601-40 = "미식연구회의 부원으로서!"
1601-42 = "아, 그래."
1601-43 = "하아, 배고픈 건 알겠지만. 이건 급식이잖아?"
1601-44 = "먹으려면 아침 급식 때까지 기다려야지."
1601-45 = "아아~! 그러지 말고 쪼금만! 아주 쬐끔만!!"
1601-46 = "아, 쿠키가 아니라면 아침으로 나오는 수프도 괜찮아!"
1601-47 = "아침 식사 주문이야?!"
1601-48 = "후우, 오늘은 바쁘니까. 이따가 아침 급식시간이 되면 다시 와."
1601-49 = "응? 바쁘다니?"
1601-50 = "네~ 오늘은 급양부 위생평가일이거든요."
1601-51 = "급양평가관이 찾아와서, 여러가지를 살펴보는 날이야."
1601-52 = "시설의 청결함이라던가, 식재료의 유통기한이라던가……."
1601-53 = "그밖에 여러 다양한 부분들을 평가해서 등급을 매기는 거예요."
1601-54 = "저번 평가 때는 그렇지 않아도 낮은 등급을 받는 바람에 예산이 반토막 나서……."
1601-55 = "왜……? 준비는 철저했는데?"
1601-56 = "평가관도 돌아가기 전까진 웃는 얼굴이었는데. 어째서……?"
1601-57 = "후우카 선배! 진정하세요! 심호흡, 심호흡!"
1601-59 = "……으응. 맞아. 어차피 그건 이미 지나간 일! #n지나간 과거를 되돌아볼 필요는 없어."
1601-60 = "네, 운이 나빴을 뿐이니까요!"
1601-61 = "어쨌거나, 잘 들었지? 오늘은 이만 돌아가서……."
1601-63 = "모두 제자리에서 손 들고 움직이지 마!"
1601-64 = "응?"
1601-69 = "어머나."
1601-70 = "……응?"
1601-71 = "뭐야, 미식연구회인가. #n수상한 녀석이 있다, 싶었더니만."
1601-72 = "나를 뭐라고 생각하는 거야?!"
1601-73 = "잠깐, 어째서 선도부가 여기 있는 거야?"
1601-74 = "과연, 잘도 아무렇지도 않다는 얼굴로 뻔뻔한 태도를 취하다니, 굉장한데?"
1601-75 = "어?! 무, 무슨 소리야?!"
1601-76 = "오늘 급양부 위생평가는 급양평가관 대신, 나 선도부의 이오리가 담당할 거야."
1601-77 = "선도부가……? 왜?"
1601-78 = "당연한 조치야."
1601-79 = "지난 번 위생평가 때, 급양부를 찾았던 평가관은 식중독 판정을 받았어."
1601-80 = "시, 식중독이라니?!"
1601-81 = "그 말인즉슨 학생식당 어딘가엔 식중독 균이 있을지도 모른다는 거지."
1601-82 = "가령, 저 녀석이 먹고 있는 저 쿠키에 있다든가!"
1601-84 = "……? (냠냠)"
1601-85 = "(꿀꺽)"
1601-86 = "조금은 놀라는 척이라도 해!!"
1601-87 = "그보다 식중독이라니, 그럴 리가! 잘못 들었겠지!"
1601-88 = "우리가 만드는 급식이 때로는 맛이 없을지도 모르……."
1601-89 = "모르……. 모……."
1601-90 = "응! 급식이 맛이 없을 때는 자주 있지만!"
1601-91 = "말해버리는 거야?! #n그것도 자주?!"
1601-92 = "하, 하여간 식중독이 일어날 정도로 허투루 관리하고 있진 않아."
1601-93 = "맞아요! 후우카 선배가 위생 관리에 얼마나 신경을 쓰시는데요!"
1601-94 = "말은 누구나 다 그렇게 할 수 있지."
1601-95 = "하지만 하나 확실한 건, 그때 위생평가를 맡았던 급양평가관이 이곳 평가를 마친 뒤."
1601-96 = "배를 부여잡고는 화장실로 달려가면서 이렇게 말했다고 해."
1601-99 = "'그 급양부에는 괴물이 살고 있다!' 라고……!"
1601-100 = "괴물?! 무슨 소리야! 영문을 모르겠어!"
1601-101 = "흥. 대체 얼마나 위생관리가 형편없길래, 그런 이야기까지 나왔는지."
1601-102 = "내가 오늘 그 민낯을 낱낱이 까발려 주겠어!"
1601-103 = "(진짜 영문을 모르겠는데?!)"
1601-104 = "저도, 저도 질 수 없어요!"
1601-105 = "제아무리 상대가 선도부라고 할지라도!"
1601-108 = "우리 급양부가 호락호락하지 않다는 걸 보여드리겠어요!"
1601-109 = "호오, 기백만큼은 거창한데. 좋아."
1601-110 = "어디 전력으로 덤벼보라고!"
1601-111 = "네!"
1601-116 = "(아냐, 위생평가는 그런 경쟁 같은 게 아니잖아?! 선의의 라이벌처럼 외쳐도 곤란하거든?!)"
1601-118 = "(그렇게 이오리의 철저한 위생관리평가가 시작되었다.)"
