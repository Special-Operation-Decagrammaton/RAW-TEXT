[translation]
1601203-1 = "다양한 음식이 필요해!"
1601203-2 = "늦었잖아, 선생님!"
1601203-6 = "정말, 간만에 사람이 되갚아 주겠다는데."
1601203-7 = "[s] \"되갚아 주겠다는 말이 무서워서…… 흑흑……\""
1601203-8 = "뭐, 뭐야! 왜 울고 그래! 그렇게 무서운 거 아니라니까!"
1601203-9 = "되갚아 주겠다는 것도, 뭐, 농담 같은 거였고……"
1601203-10 = "그러니까 그렇게 훌쩍거리는 척하지 마! 다 보이거든!"
1601203-11 = "[s] \"새해 축제에 가고 싶었던 거면, 말을 하지 그랬어.\""
1601203-12 = "어…… 뭐, 그 비슷한 것도 있긴 하지만 말이야."
1601203-13 = "여기 축제 거리는, 조금 다르거든!"
1601203-14 = "[s] \"다르다니, 뭐가?\""
1601203-15 = "선생님은, 새해 음식 하면 뭐가 떠올라?"
1601203-16 = "그래, 그래……해넘이 국수, 오세치 요리, 오조니…… 뭐 그런 것들이겠지."
1601203-17 = "물론 맛있는 음식들이지. 나도 아주 좋아하고."
1601203-18 = "하지만…… 조금 식상해! 나는 미식연구회의 일원이라고! 더 많은 미식을 탐구할 의무가 있어!"
1601203-19 = "올해에는 정말로 다양한 새해 음식을 맛보고 싶었단 말씀이야!"
1601203-20 = "[s] \"그러고 보니, 이 축제 거리는……?!"
1601203-21 = "훗, 훗, 훗…… 이제 뭐가 다른지 조금 눈에 들어오는 모양이지?"
1601203-22 = "그래, 맞아. 다른 데에서는 맛볼 수 없는 새해 음식들을 파는 곳이라고!"
1601203-23 = "그럼, 선생님! 뭐부터 먹어 볼까?"
1601203-24 = "저번 <르와조 블뢰> 일도 있으니, 내가 살게!"
1601203-25 = "어…… 예산이 허락하는 범위 안에서, 말이지만."
1601203-28 = "어…… 이 만두 같은 건 뭐야, 아저씨?"
1601203-29 = "만두는 만두지! 자오쯔라고 한단다!"
1601203-30 = "무사고를 기원할 때에는 두부와 배추, 가족운을 기원할 때에는 땅콩."
1601203-31 = "장수를 기원할 때는 국수, 승진을 기원할 땐 찹쌀떡을 넣어서 만들지!"
1601203-32 = "자, 어떤 걸 고르겠니?"
1601203-33 = "어, 어어……? 어떻게 하지, 선생님?"
1601203-34 = "일단 사고가 나지 않아야 맛있는 걸 많이 먹을 수 있지 않겠냐고? 그것도 그렇네……"
1601203-35 = "그러면, 아저씨! 두부와 배추 자오쯔 두 개 줘!"
1601203-37 = "어라, 이 구수한 냄새가 나는 음식은……?"
1601203-41 = "호핑 존이라는 음식입니다."
1601203-42 = "콩과 돼지고기, 녹색 야채를 한 번 볶은 다음 끓여내서 만들죠."
1601203-43 = "콩은 동전, 녹색 야채는 지폐를 상징한답니다."
1601203-44 = "이 음식을 먹고 모두 부자가 되기를 바라는 것이죠."
1601203-45 = "정말로 그렇게 된다면, 맛있는 것도 많이 먹을 수 있겠지……?"
1601203-46 = "이거, 2인분!"
1601203-48 = "이 엄청난 파이는……?"
1601203-49 = "'갈레트 데 루아' 라고 하는 파이란다. '왕들의 파이' 라는 뜻이지."
1601203-50 = "버터를 잔뜩 머금은 바삭한 페이스트리 생지 속에, 아몬드 페이스트리 크림이 잔뜩 들어가 있어."
1601203-51 = "우와아……"
1601203-52 = "파이를 먹다 보면 '페브' 라고 하는 작은 도자기가 들어 있는데,"
1601203-53 = "페브를 발견하는 사람은 그 자리의 왕이 될 수 있어."
1601203-54 = "여기에서 왕이 되면…… 뭘 할 수 있는데?"
1601203-55 = "파이를 한 조각 더 받을 수 있지."
1601203-56 = "흐음…… 일단 파이 두 조각!"
1601203-58 = "맛있었어!"
1601203-59 = "[s] \"잘 먹더라. 괜찮았어?\""
1601203-60 = "응! 하나같이 다 맛있고, 개성도 강하고……"
1601203-61 = "강하, 고……"
1601203-68 = "[ns] \"준코?\""
1601203-69 = "우, 윽……!"
1601203-70 = "꼼짝도 못 하겠어…… 숨이 안 쉬어져……"
1601203-71 = "[s] \"왜, 왜 그래?!\""
1601203-72 = "선생님, 어쩌지……?"
1601203-73 = "나, 너무 과식했나 봐……"
1601203-75 = "(안색이 파래진 준코에게 소화제를 사다 주었다……)"
1601203-77 = "후아…… 고마워, 선생님. 이제 좀 살 것 같네."
1601203-78 = "우우…… 미안해. 즐거운 미식의 마지막을 망쳐 버린 것 같아……."
1601203-79 = "[s] \"준코가 즐거워했으니 그걸로 됐어.\""
1601203-80 = "정말? 그냥 해 보는 말 아니지……?"
1601203-81 = "그렇다고 해도, 이래서야 내일까지는 아무것도 못 먹을 것 같네."
1601203-82 = "왜 나는 아카리처럼 많이 먹지 못하는 걸까……"
1601203-84 = "(풀이 죽은 준코를 달래며 샬레로 돌아왔다.)"
