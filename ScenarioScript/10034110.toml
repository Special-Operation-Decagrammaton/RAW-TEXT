[translation]
10034110-1 = "7일 전: 할 거면 제대로"
10034110-4 = "자, 자! 며칠 안 남았으니, 이제 진짜 각 잡고 해야만 해."
10034110-5 = "뭐, 그간도 나름대로 열심히 연습했으니 승산은 충분하겠지. 남은 일주일 동안 달린다!!"
10034110-6 = "촉박한 시간과 결전의 날……."
10034110-8 = "……과연, 록이로군."
10034110-9 = "그거 언제까지 밀 거냐."
10034110-10 = "……일주일 정도? 이 옷 벗을 때까지?"
10034110-11 = "시즈너블 대사였냐."
10034110-12 = "분위기 초 치고 싶은 생각은 없지만 의외로 경쟁률도 꽤 있는 이벤트라고 들었어. 그리 쉽지만은 않을걸."
10034110-13 = "그, 그래도 할 수 있을 거야! 아마……. 확실히!"
10034110-14 = "……아니, 할 수 있어! 응!"
10034110-15 = "……아이리?"
10034110-16 = "그……. 저……. 그게……."
10034110-17 = "……그……."
10034110-18 = "왠지 그냥 그런 느낌. 에헤헤……."
10034110-22 = "……그래, 뭐. 어차피 해야 할 거 할 거면 제대로 하는 게 맞지. 안 그래?"
10034110-23 = "……??? 태도 변화 뭐지?"
10034110-24 = "자, 자! 쓸데없는 소리 말고! 이러고 있을 시간이 없어!!"
10034110-25 = "……시작한다!!"
10034110-26 = "니가 뭔데 지시냐고."
