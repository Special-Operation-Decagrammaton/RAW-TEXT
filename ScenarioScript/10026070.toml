[translation]
10026070-1 = "제7화;제대로 된 사용법"
10026070-2 = "(네 군데의 포인트를 모두 조사한 후, 다시 처음 모였던 해변으로 돌아왔다.)"
10026070-3 = "음……. 흐음……."
10026070-4 = "으음……? 음……. 으으음……."
10026070-5 = "[s1] \"왜 그래, 우이?\"\n[s2] \"꽤나 골똘히 생각하는 얼굴인걸.\""
10026070-8 = "아, 아뇨. 그……. 별 건 아니고……."
10026070-9 = "그냥 조사한 내용들을 좀 살펴보고 있었어요. 여기 지도랑 같이……. 그런데……. 음……."
10026070-10 = "오히려 조금 이상하달까……. 일단 차근차근 말씀드려 볼게요."
10026070-12 = "우선 여기……. 훈련장으로 보이는 돌담길."
10026070-14 = "여기는 지하 벙커로 잘 만들어 둔 지휘 센터……."
10026070-16 = "여기는 선박 안내용 등대……. 아무 특이점이 없어요."
10026070-17 = "오래되긴 했지만 틀림없는 고대 트리니티 양식에 용도도 비교적 명확하고, 전체적으로 특이할 게 없거든요. 그래서……."
10026070-21 = "저, 저기……. 하나코……."
10026070-22 = "뭔가 저 사람……. 여기 처음 왔을 때랑 분위기가 좀 다르지 않아……?"
10026070-23 = "……음? 그런가요?"
10026070-24 = "우이 씨……. 뭔가 푹 빠져 있어요……. 마치 다른 사람……."
10026070-25 = "좋아하는 일에 열중하다 보니 나오는 모습일지도요. 보기 좋네요. 후훗."
10026070-27 = "개인적으로는 내심, 인적 드문 곳에 만든 고대 성도회의 고문장이나 처형장 같은 곳이었길 바랐지만."
10026070-32 = "아쉽게도 그런 개념은 아니었던 것 같았고……."
10026070-33 = "……하, 하하하, 하하……."
10026070-34 = "……아, 죄송……."
10026070-35 = "아무튼 그런 건 아닌 것 같으니 걱정하실 이유는 없고……."
10026070-36 = "그렇다면 이대로 끝인가?"
10026070-37 = "그런 생각이 들다 보니, 좀……. 뭔가……."
10026070-38 = "[s3] \"뭔가 더 있다고 생각하는 거구나.\"\n[s4] \"이대로는 만족할 수 없다는 걸까?\""
10026070-41 = "뭐, 사실 진짜로 별거 없는 곳이었을 수 있어요. 그 확률이 더 높긴 하겠죠. 그렇지만……."
10026070-42 = "마지막의 마지막까지 '혹시'를 놓지 않는 게, 연구하는 사람의 태도여야 하니까요."
10026070-43 = "처음부터 '별거 없을 것이다'라고 생각하는 연구자는, 아무것도 찾아낼 수 없어요."
10026070-44 = "늘 허탕을 치고, 허무한 결말을 맞아도 그 안에서 계속 뭔가 있을 거라는 자세를 지켜내야 하죠."
10026070-45 = "……이쯤에서 논점을 살짝 바꿔볼까요. 이 장소의 '용도가 무엇인가'보다……."
10026070-46 = "'어째서 폐쇄됐는가'-로."
10026070-47 = "그러네요. 전통과 기록을 중시하는 그들이 이런 곳을 버리고, 그 기록조차 없앴다."
10026070-48 = "어쩌면 이 조사의 핵심 포인트, 시스터후드 답지 않은 면은 '기록을 없앴다'는 것일 수도 있겠네요."
10026070-49 = "네. 평소의 시스터후드답지 않은 방식이라고 볼 수 있으니까요."
10026070-50 = "그렇다면 왜 그렇게까지? 어째서?"
10026070-51 = "훈련장, 지휘 센터, 등대……."
10026070-53 = "……그리고 뜬금없는 레몬 농장……."
10026070-59 = "……레몬?"
10026070-60 = "우이 씨……?"
10026070-64 = "……뭔가 이상한데……. 보세요. 지도상으로도 그래요. 이 레몬농장만 좀 따로 놀잖아요."
10026070-65 = "확실히……. 혼자서 이곳이 건설될 때의 초기 기획에는 없었다는 느낌이네요. 즉 이후에 임의적으로 만들어졌다."
10026070-66 = "레몬 나무가 자생할 환경의 섬은 아니니, 의도적으로 외부에서 끌어와 키우게 된 것들이겠군요."
10026070-67 = "주식으로 쓰기도 애매한 레몬을……. 그렇다면 뭔가의 이유가 있었겠죠."
10026070-68 = "……레몬……. 레몬……."
10026070-76 = "[ns5] \"레몬을 꺼내 들었어?\"\n[ns6] \"갑자기 레몬은 왜?\""
10026070-79 = "음……. 역시 그거겠죠, 여기선 그거밖에 없겠지요."
10026070-81 = "……흡……!!"
10026070-85 = "[ns7] \"지도 위에다 레몬을 짰다!?\"\n[ns8] \"손으로 꽉 쥔 시큼한 물이 아래로……!!\""
10026070-88 = "어머나…… 그렇게 세게 쥐면……♡"
10026070-89 = "우이 씨, 보기와 달리 대담하고 격렬한 구석이……."
10026070-90 = "큰 소리로 말하지 마, 하나코!"
10026070-91 = "우, 우이 씨!?! 우이 씨! 뭐, 뭘 하시는 건가요!? 그건 성당의 오래된 지도……!!"
10026070-93 = "……음. 네. 역시 이런 거겠죠. 어쩐지 이 지도는, 양피지의 재질부터 조금 특이하다 싶었어요."
10026070-94 = "나왔네요. 새로운 포인트."
10026070-99 = "……!? 어, 어라? 뭐죠? 지도에……. 못 보던 곳의 표시가 나타나고 있어요……!?"
10026070-100 = "예전엔 자주 쓰던 방식이에요. 특정한 사람들에게만 보여주고 싶은 정보를 감추기 위해 만든 방식이죠."
10026070-101 = "이정도면 굉장히 허술한 편이라고 생각하지만……. 어떻게 또 지금까지 잘 먹혀들고 있었나 보네요."
10026070-103 = "시스터후드의 연구팀이라면 감히 지도에 레몬 즙을 뿌리고 불까지 댈 생각은 못했겠죠. 어쩌면 그런 것까지 생각해서 만든 방식일 수도 있겠고……."
10026070-104 = "정말이지, 쓸데없는 데에서 고리타분하다니까요. 바깥 사람들이란. 막상 이 아이가 진짜 원하는 방식에 대해서는 관심도 없고."
10026070-105 = "……아니. 오히려 그게 원하는 것일지도 모르겠지만."
10026070-106 = "아무튼 이제 해야 할 일은 확실해졌네요. 이 두 곳. 아마도 이 섬의 비밀 장소."
10026070-107 = "비밀 장소. 라는 거죠. 여기가 '진짜 이곳의 내막'일 겁니다."
10026070-108 = "……가시죠."
10026070-112 = "우, 우이 씨!? 같이 가요, 우이 씨!!"
10026070-116 = "정말 생각도 못했어요, 대단해요!"
10026070-117 = "전력으로 도울게요! 함께 끝까지 찾아봐요, 우이 씨!!"
10026070-118 = "크아악……!! 2m!! 2m……!!"
10026070-122 = "후후후. 그럼……."
10026070-123 = "저희도 따라갈까요?"
