[translation]
10052175-2 = "다시 날아올랐어!"
10052175-3 = "……!"
10052175-4 = "리오 선배! 아리스의 무장은, 얼마나 오래 버틸 수 있습니까?"
10052175-5 = "……최대 출력을 상정한 거지? 내가 무슨 말을 해도, 너는 갈 거고."
10052175-6 = "……."
10052175-10 = "다녀와, 아리스. 다른 부분들은 맡겨 줘."
10052175-11 = "감사합니다, 리오 선배! 그러면 다녀오겠습니다!"
10052175-15 = "왕녀여. 저는 묻고 싶습니다."
10052175-16 = "당신들은 왜 이렇게까지 고통을 자처하나요?"
10052175-17 = "고통을, 자처한다니요……?"
10052175-18 = "살아간다는 것은 고통입니다. 그 사실로부터 눈을 돌리지 말아요."
10052175-19 = "우리는 우리의 의지로 태어나지도 않았고, 그저 아무것도 모른 채 세계에 내던져졌을 뿐입니다."
10052175-20 = "……!"
10052175-24 = "말쿠트!"
10052175-25 = "(엄청난 가속입니다……. 하지만 아리스도 따라가야 합니다!)"
10052175-30 = "잠시만요! 조금만…… 아리스는 조금만 더 이야기를 하고 싶습니다!"
10052175-31 = "……."
10052175-33 = "포기하지 않는군요."
10052175-34 = "심지어 우리는 자신의 이름마저도, 자신의 뜻대로 정하지 못합니다."
10052175-35 = "삶은 그 자체로 모순이고 부조리하며, 그렇기에 살아가는 모두에게 말도 안 되는 고통을 억지로 감내하게 합니다."
10052175-36 = "우리는 다만, 그 순환을 끊고자 할 뿐입니다."
10052175-37 = "우리가 우리의 이름조차 제대로 정하지 못하는 한, 그 고통은 계속될 수밖에 없습니다."
10052175-42 = "그렇지만, 그렇지만 그건……!"
10052175-43 = "어딘가, 잘못되었다고 생각합니다!"
10052175-51 = "어떤 근거로 그런 생각에 이르게 되었나요?"
10052175-52 = "그것은…… 그러니까……!!!"
10052175-53 = "으읏……! 아직은…… 조금만 더……!"
10052175-54 = "대답하지 않아도 좋습니다. 저는 알고 있으니까요."
10052175-55 = "그것은 생명체가 생명체로 남아 있는 한, 대답이 존재할 수 없는 물음이니까요."
10052175-62 = "아아아아아앗—!!!"
10052175-64 = "아, 아리스 쨩?!"
10052175-65 = "아리스 쨩!"
10052175-66 = "오지 마세요! 위험합니다!"
10052175-68 = "어, 언니……? 이런 말씀 드리기 죄송한데요, 저기……."
10052175-69 = "추력 편향 노즐 쪽에 문제가 생겼어! 비행 출력 자체를 내는 데에는 문제가 없지만……."
10052175-70 = "……솔직하게 말씀드리자면, 비행 중 안정성을 유지하는 것이 조금 어렵게 된 상태입니다."
10052175-74 = "그렇군요. 미안해요. 아인, 소프, 오르. 너무 격렬한 공중 기동이었지요."
10052175-75 = "아, 아아아, 아뇨! 괜찮아요, 언니! 저희가 언니를 잘 도와드리지 못해서……!"
10052175-76 = "소프의 판단은 어떻죠?"
10052175-77 = "지상에서 싸우는 것을 추천해! 비행에 필요한 출력까지 전부 화력으로 전환하면, 저 녀석들 따위 상대도 안 될 거야!"
10052175-78 = "알겠어요. 그렇게 할게요."
10052175-79 = "언니의 상태는 우리도 실시간으로 모니터링하고 있으니까요. 남은…… 모든 걸, 언니에게 드릴게요."
10052175-80 = "모두, 고마워요."
10052175-86 = "마침내 내려왔군요."
10052175-87 = "인사나 하자고 온 것은 아니겠지?"
10052175-88 = "모두, 적당 적당한 말은 여기까지만 하죠."
10052175-89 = "뭔가 보이니, 케이?"
10052175-90 = "네……. 저와 아리스는 볼 수 있습니다. 있기는 한데……."
10052175-91 = "이거 정말, 우리의 시야를 공유할 수 있다면 좋을 것 같다는 생각이 들면서도, 그럴 수 없어서 다행이라는 마음이 동시에 드네요."
10052175-92 = "……저 말쿠트에게 무슨 일이 일어나고 있는 건가요?"
10052175-93 = "그건……."
10052175-101 = "[ns] \"아리스……?\""
10052175-102 = "괜찮습니다, 선생님. 괜찮습니다. 그러니 조금만 뒤로 물러나 주세요."
10052175-103 = "저분…… 말쿠트는, 아리스가 상대하겠습니다."
10052175-104 = "지금의 아리스 말고는, 아무도 저 말쿠트를 상대할 수 없을 테니까요."
10052175-105 = "[s] \"그건, 무슨 뜻이야……?\""
10052175-106 = "곧 알게 될 것 같네요."
10052175-107 = "그렇지만 이 말은 할 수 있을 것 같습니다."
10052175-108 = "지금 이 자리의 땅과 하늘, 그리고 모든 것은…… 오직, 저 말쿠트만을 위해서 움직이고 있다고요."
10052175-114 = "!!! 옵니다!!!!!"
10052175-119 = "아인!"
10052175-120 = "네, 네에……! 저희가 할 수 있는 전부를, 언니에게……!"
10052175-121 = "강철대륙에 남은 모든 가능성을, 이 자리로!"
10052175-123 = "창조는 최초의 빛으로부터!"
10052175-124 = "지혜를 거쳐 지성을 지나 아름다움에 이르기까지!"
10052175-125 = "광휘와 지혜, 사랑과 자비, 힘과 미덕. 그리고 마침내 다다를 승리."
10052175-128 = "예호바 체바오트. 만군의 주여."
10052175-129 = "왕좌에 도달한[ruby=Adonai Melekh] 순례자에[/ruby]게."
10052175-130 = "태초부터 예비되어 온, [ruby=Malkuth]왕국[/ruby]의 영광을!"
10052175-134 = "으, 으윽……?!?!!!"
10052175-136 = "(아, 안 됩니다. 밀리고…… 있습니다……!)"
10052175-137 = "(그렇지만 아리스가 버티지 않으면…… 아리스가 해내야만……!)"
10052175-147 = "(제발…… 조금만 더, 어떻게든……!)"
10052175-152 = "괜찮습니다. 아리스."
10052175-154 = "당신은 이제 혼자가 아닙니다. 만에 하나 제가 아니더라도, 또 다른 모두가 있을 테니까요."
10052175-158 = "그 말은, 당신 혼자서 모든 것을 짊어지려 할 필요가, 더 이상 없다는 뜻이기도 합니다."
10052175-159 = "……!"
10052175-160 = "케이!!!"
10052175-161 = "……!!!"
10052175-163 = "어, 어떻게……?! 언니의 출력과, 거의 같아졌어요……!"
10052175-164 = "이럴 수가……! 저 왕녀에게, 저 정도의 힘을 끌어낼 수단은 이제 없을 텐데??!!"
10052175-165 = "무, 무슨 짓을 한 건가요!? 이건 말도 안 돼요!"
10052175-167 = "간단한 거예요. 당신들, 네차흐의 동력을 전부 말쿠트에게 집중시켰죠?"
10052175-168 = "같은 원리입니다. 당신들이 네차흐의 가능성을 전부 이 자리에 사용하고 있다면."
10052175-169 = "저는, 이 몸에 담긴 나머지 여덟 개 세피라의 가능성을, 모두 아리스에게 사용하고 있을 뿐이니까요."
10052175-170 = "(……솔직히, 용량 초과로 여기저기가 불안하기는 하지만…….)"
10052175-171 = "(아직 참을 수 있어요. 견디면 되는 겁니다……!)"
10052175-172 = "그, 그건 반칙이라고…… 생각, 해요……!"
10052175-173 = "그건 당신들도 마찬가지였을 텐데요."
10052175-175 = "……왜 이렇게까지 고통을 자처하느냐고 물었지요, 말쿠트."
10052175-176 = "우리가 우리의 이름조차 제대로 정하지 못하는 한, 그 고통은 계속될 수밖에 없다고요."
10052175-177 = "……?!"
10052175-178 = "말쿠트. 아리스는 이제 대답할 수 있을 것 같습니다. 왜냐하면……."
10052175-180 = "왜냐하면, 아리스는 이름을 바꿨으니까요!"
10052175-181 = "?!"
10052175-182 = "그리고 그건 케이도 마찬가지입니다!"
10052175-183 = "아, 아리스? 그게, 틀린 말은 아닌데 말이죠……?"
10052175-184 = "삶에는 슬픈 일이 더 많습니다. 아리스 역시 그 정도는 알고 있습니다."
10052175-185 = "우리를 이 자리에 있도록 만든 누군가에게 끝없는 원망을 하는 것도, 어떤 의미에서는 정당한 것일지도 모릅니다."
10052175-186 = "그렇지만, 그래도 선생님께서는 말씀해 주셨습니다."
10052175-187 = "그 어떤 일보다도, 너희를 만나서 정말 다행이었다고요!"
10052175-188 = "네! 그러니까 아리스는!"
10052175-189 = "그것만으로도 충분히, 살아갈 가치가 있다고 생각합니다!!!"
10052175-190 = "기적은, 우리들 사이에서 잠시 빛났다 사라지는 섬광 같은 것이겠지만."
10052175-191 = "그 섬광을 우리가 기억하는 한, 빛은 영원할 것입니다."
10052175-192 = "아리스는 고통이 없었기에 행복했던 것이 아니었습니다!"
10052175-193 = "그 모든 것들에도 불구하고, 아리스는 행복한 것입니다!"
10052175-195 = "[log=아리스 결전 비무장][2B2B2B]그리고, 그건 분명.[-][/log]"
10052175-197 = "[log=아리스 결전 비무장][2B2B2B]당신들도 마찬가지일 수 있다고, 아리스는 생각합니다.[-][/log]"
10052175-200 = "……!"
10052175-201 = "……!!!"
10052175-202 = "우리, 도……?"
10052175-204 = "하아아아아앗–!!!"
10052175-208 = "이 빛은……."
10052175-218 = "아아……!"
10052175-226 = "[ns] \"아리스! 케이!\""
10052175-232 = "선생, 님……? 모두들……?"
10052175-233 = "에헤헤. 괜찮습니다. 아리스는 멀쩡합니다. 조금…… 힘이 빠졌을 뿐입니다."
10052175-234 = "조금이 아닐 건데요, 그거……."
10052175-235 = "그, 그렇지만 괜찮은 거지? 아리스 쨩, 케이 쨩?!"
10052175-236 = "그런 것 같습니다. 자신의 의사를 잘 표현하는 것을 보니, 크게 문제는 없어 보이네요."
10052175-237 = "저 역시 네루 선배에게 조금 얻어맞았을 때가 있었습니다만."
10052175-238 = "종합적이면서도 총체적인 측면에서 큰 이상이 없던 바가 있었기에."
10052175-242 = "……그거, 위로라고 하는 거예요, 아니면 놀리는 거예요……?"
10052175-243 = "토키. 틀린 말은 아니지만, 틀리지 않은 말이 언제나 옳지는 않아……."
10052175-244 = "그런가요……. 자주 느끼는 것입니다만, 언어란 참으로 어렵군요."
10052175-246 = "정말 수고 많았어요. 아리스, 케이. 이제 말쿠트의 코어 정보를 우선 흡수하고……."
10052175-247 = "그래. 마지막으로 저 구조물 안으로 진입해서, 네차흐의 코어 정보를 흡수하면 돼."
10052175-248 = "그렇습니다! 그러면 마침내 케이는 만렙을 찍을 수 있게 될 거고……!"
10052175-249 = "[s] \"이 '강철대륙 현상'을, 끝낼 수 있겠구나!\""
10052175-250 = "네. 그렇게 되겠네요. 그러면 움직여 볼까요? 우선은 말쿠트부터……."
10052175-254 = "……어?"
10052175-256 = "어, 언니……?"
