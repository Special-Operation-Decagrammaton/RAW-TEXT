[translation]
2003602-1 = "본전 뽑기 대작전"
2003602-2 = "(일단은 세리카가 부르는 대로, 리조트 앞마당에 나와 있었다.)"
2003602-3 = "기다리고 있었지, 선생님! 좋아, 이 정도면 되겠……."
2003602-4 = "잠깐만……. 윽. 들기가 불편……."
2003602-9 = "……선생님."
2003602-10 = "그, 미안한데. 같이 좀 들어줄 수 있을까. 무겁다기 보다 부피가 커서……."
2003602-11 = "[s1] \"뭔가 많이 챙겨왔네.\"\n[s2] \"이게 다 뭐야?\""
2003602-14 = "뭐, 하나하나는 그다지 대단한 게 아니긴 한데."
2003602-15 = "그래도 전부 다 즐기려면 모자라는 게 없어야 하니까. 이건 먹을 거고, 마실 거고……."
2003602-16 = "이건 자리 펼 때 쓸 거고 이거는 혹시 모를 수영 도구, 이건 사진기, 그건 정글도. 또……."
2003602-17 = "……응?"
2003602-18 = "너무 많다고? 이렇게 전부 다 챙겨 갈 필요는 없을 거 같다고?"
2003602-19 = "지금까지 뭘 들은 거야? 최고의 휴가를 보내야 한다고 했잖아! 이 정도는 당연한 준비지!"
2003602-20 = "……달라? 뭐가 다르다는 거지?"
2003602-21 = "[s3] \"최고의 휴가랑 완벽한 휴가는 달라.\"\n[s4] \"휴가에서까지 채비에 쫓기면 안 되잖아?\""
2003602-24 = "그, 그런가……? 뭐지? 뭔가 그럴싸한 말인 느낌도……."
2003602-28 = "아니! 안 돼! 또 그런 말로 얼렁뚱땅 넘기려고!?"
2003602-29 = "이번만큼은 안 되니까 말이야. 오늘은 일단 내가 하자는 대로 가는 거야!"
2003602-30 = "……엥?"
2003602-31 = "알았다고? 이렇게 순순히……?"
2003602-32 = "놀러 와서 싸우는 건 좋지 않아? 따, 딱히 싸우려는 건 아니었는데!?"
2003602-33 = "아, 아무튼! 아무튼 좋아. 그럼 선생님도 동의한 거니까……."
2003602-37 = "이제 출발이야! '최고의 휴가'!!"
2003602-39 = "(그렇게 세리카가 잔뜩 준비한 것들을 나눠 들고, 이런저런 포인트를 옮겨 다니며 '최고의 휴가'를 찾아다녔다.)"
2003602-45 = "[ns5] \"……어때?\"\n[ns6] \"여기 자리가 좋네.\""
2003602-49 = "음……. 확실히 좋긴 하지만……."
2003602-50 = "뭐랄까, 약간 뻔한 느낌도 있고 그러네. 흔한 패턴이기도 하고."
2003602-51 = "최고의 휴가……라기에는 약간 부족할지도."
2003602-55 = "[ns7] \"여긴 어때?\"\n[ns8] \"살짝 다른 분위기지?\""
2003602-58 = "그렇……긴 한데……. 으음……."
2003602-59 = "뭐지……? 왜 뭔가 여전히 시원찮지……? 여전히 바다를 못 벗어나서 그런가……?"
2003602-63 = "[ns9] \"아예 바다를 벗어나 봤어.\"\n[ns10] \"슬슬 주객전도의 느낌인데…….\""
2003602-66 = "끄응……. 이상하다……."
2003602-67 = "분명 좋은데……. 다 좋은 곳인데, 뭔가……. 뭔가 모르겠어. 왜 어딘가 성에 안 차지?"
2003602-68 = "이래서야 괜히 선생님 끌고 고생시키는 것밖에는 안 될 텐데……. 큰일이네……."
2003602-72 = "……아무리 그래도 이건 역시 조금……."
2003602-74 = "(……결국 자리조차 제대로 잡지 못한 채, 이곳저곳 돌아다니다 리조트로 돌아왔다.)"
2003602-81 = "…………."
2003602-82 = "그, 그……. 음……. 서, 선생님. 이건……. 그……."
2003602-86 = "……미안."
2003602-87 = "기세 좋게 말해서 짐까지 들게 해 놓고, 결국 아무것도 못 하고 끝나버렸네."
2003602-88 = "역시 쉽지가 않다, 최고의 휴가라는 거……."
2003602-89 = "괜히 고생만 시키고……."
2003602-90 = "……응?"
2003602-91 = "그렇지 않다고? 지금도 충분히 최고의 휴가라고……?"
2003602-92 = "무슨 소릴 하는 거야? 하루 종일 자리도 못 잡고 계속 돌아다니기만 했는데……."
2003602-93 = "[s11] \"최고의 휴가랑 완벽한 휴가는 달라.\"\n[s12] \"애초에 휴가라는 건, 뭘 해야 하는 게 아니거든.\""
2003602-96 = "하아. 또, 또……. 하여간 선생님은 항상 그런 말로 위로를……."
2003602-97 = "……뭐? 위로가 아니야?"
2003602-98 = "진심이라고? ……그건 또 무슨 소리야?"
2003602-99 = "[s13] \"덕분에 하루 종일 같이 구경 다녔잖아.\"\n[s14] \"덕분에 지금 이런 여름밤 대화도 나누고 있지.\""
2003602-102 = "……으, 으음……?"
2003602-103 = "뭐, 뭐지……? 그런가. 그런 걸로 되는 건가, 이게……?"
2003602-104 = "확실히 오늘 내내 바다도 가고 숲도 가고, 동굴도 가 보고……."
2003602-105 = "중간중간 쉬면서 먹을 것도 먹고……. 선생님이랑……."
2003602-106 = "어라……. 그런가……. 그런 식이라면 나도……."
2003602-107 = "……흠……."
2003602-108 = "……히히."
2003602-109 = "어쩌면 조금은 그럴지도……."
2003602-113 = "……그, 그러네! 그렇게 생각할 수도 있겠네! 음!!"
2003602-114 = "그럼 오늘은 이 정도로 하고! 내일 다시 이야기하도록 해."
2003602-115 = "오늘이 나쁘지 않았다는 건 부정하지 않겠지만……."
2003602-116 = "그렇다고 오늘 하루로 끝낼 생각도 없으니까 말이야! '최고의 휴가'는 가는 날까지 계속이라고!"
2003602-117 = "알겠지? 선생님도 협력해 줘야 해!! 꼭이야!!"
2003602-118 = "나, 난 그럼……. 먼저 자러 간다!!"
2003602-123 = "(이후 세리카가 실수로 떨어뜨리고 간 물건들을 주워서 정리한 뒤, 숙소로 돌아갔다.)"
