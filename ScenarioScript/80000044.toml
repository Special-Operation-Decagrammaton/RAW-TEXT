[translation]
80000044-1 = "포기하지 않는 게이머"
80000044-2 = "(발렌타인 데이를 기념하여 오락실에서 대전격투게임 대회가 열렸다.)"
80000044-9 = "응! 이 정도는 낙승이지! 목표는 완벽한 우승을 통해, 상품인 초콜릿 트로피를 따내는 것!"
80000044-10 = "선생님! 거기서 지켜보고 있으라구?!"
80000044-11 = "지금부터 나, 사이바 모모이의 복숭앗빛 우승 스토리가 시작될 테니까!"
80000044-12 = "아자아자! 간다-앗!"
80000044-20 = "1, 1회전에서 바로 탈락?! 우, 우와아앙?!"
80000044-22 = "(그렇게 대회에서 속공으로 탈락한 모모이를 위로하게 되었다.)"
80000044-23 = "거기서 그런 꼼수를 쓰다니~! 너무하잖아!"
80000044-24 = "짠 발에 짠 발, 거기다 또 짠 발뿐이라니!"
80000044-25 = "아무리 공식이 허가한 전법이라고 해도, 그것만 쓰는 건 치사하지 않냐구~!"
80000044-26 = "정면으로 싸우자고! 격겜러의 혼을 불태우면서!"
80000044-27 = "[s] \"응, 딸피로 필살기를 지르다니, 모모이다웠어.\""
80000044-28 = "그치?! 아무리 내가 딸피라고 해도, 그렇게 빈틈을 내주는데. 쓰지 않을 수가 없잖아!"
80000044-29 = "[ruby=Angry Arts]딸피 역전용 필살기[/ruby]……!"
80000044-30 = "[s] \"상대가 일부러 보여준 빈틈이었지만 말이야.\""
80000044-31 = "우와아아앙~!"
80000044-32 = "하여간……… 우으…… 우승상품……. 갖고 싶었는데."
80000044-33 = "[s] \"너무 집착할 필요 없지 않아?\""
80000044-34 = "하지만~! 발렌타인 데이 기념 격겜 대회였고………"
80000044-35 = "우승 트로피에 부상으로 딸린 초콜릿을 멋지게 딱 따내서-!"
80000044-36 = "거기서 또 보란 듯이 선생님에게 선물하면서 의기양양 하려던 내 완벽한 작전이……!"
80000044-37 = "[s] \"……작전?\""
80000044-38 = "앗! 취소! 쉬잇! 방금 말은 취소야! 서프라이즈니까!"
80000044-39 = "우으……. 잔뜩 흥분한 나머지 이런 실수까지……… 이게 뭐야……."
80000044-40 = "[s] \"뭐, 모모이의 마음만으로도 기쁘지만.\""
80000044-41 = "나왔다! 공략용 대사 패턴! 아니! 선생님이라면 그렇게 말할 줄 알았지만……!"
80000044-42 = "그래서 더 심쿵하게 된다니, 치사해! 뭐야! 어른의 여유란 거야?!"
80000044-46 = "으으……. 그래도 이대로 아무것도 안 하고 돌아갈 수는……."
80000044-52 = "응? 이 소리는……… 과자 뽑기 게임?"
80000044-53 = "아……! 좋은 생각이 났어! 선생님! 잠시만 기다려줘!"
80000044-57 = "[ns] \"앗, 저기, 모모이?\""
80000044-62 = "자! 선생님! 이거 줄게! 받아!"
80000044-64 = "[s] \"이건……. 장난감 초콜릿?\""
80000044-65 = "후후후! 맞아! 잘 알아봤어! 선생님!"
80000044-66 = "무엇을 숨기랴~! 오늘 열렸던 격투 게임 대회 <카시오페이아의 권 ~우파루파 대열전~>의 마스코트 캐릭터 피규어 장난감이 든 초콜릿!"
80000044-67 = "아는 사람은 알고, 모르는 사람도 일단은 알지도 모를 업계의 전문 용어로 부르길"
80000044-68 = "그 이름! 식품완구라고 부르는 바로 그거!"
80000044-69 = "[s1] \"업계 전문 용어……였나?\"\n[s2] \"근데 이건 왜……?\""
80000044-70 = "그게……. 원래 계획은, 멋지게 대회에서 우승해서…… 그, 트로피랑 함께 초콜릿을 선물하는 거였지만."
80000044-71 = "그게……. 원래 계획은, 멋지게 대회에서 우승해서…… 그, 트로피랑 함께 초콜릿을 선물하는 거였지만."
80000044-72 = "그건 실패해버렸구. 하지만 그렇다고 포기하기엔 억울하고 분하니까."
80000044-73 = "이거! 일단은 여기서 따낸 거니까. 내가 직접 따낸 상품을 선생님에게 선물한다!"
80000044-74 = "원래의 그 목적은 이걸로 이루게 되었달까……. 응, 이거면 되지 않을까~ 라고 생각했달까."
80000044-75 = "에헤헷………."
80000044-76 = "……역시 좀 속보이지? 미안. 역시 그냥 없던 일로……."
80000044-77 = "[s3] \"모모이의 귀중한 초콜릿을 얻었다!\"\n[s4] \"전설의 모모이 초코를 손에 넣었다!\""
80000044-83 = "[ns] \"같이 나눠 먹자. 모모이.\""
80000044-84 = "아……."
80000044-88 = "응! 마침 두 개 뽑았으니까!"
80000044-89 = "여기서 나온 장난감으로, 나랑 배틀하자! 선생님!"
