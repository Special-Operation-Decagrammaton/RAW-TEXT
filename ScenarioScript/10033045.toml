[translation]
10033045-3 = "[ns] \"조금 진정했어, 메구?\""
10033045-4 = "으음……! 아쉽지만 어쩔 수 없지. 인형들도 어째 멈춰 버린 모양이고."
10033045-5 = "그렇지만 어째서일까……. 온천 수맥의 기운이 전부 말라 버린 걸까?"
10033045-6 = "일단, 작전상 후퇴다……!"
10033045-11 = "오, 인형들이 멈췄네."
10033045-12 = "우리 학교 애들도 대충은 달랬고……. 뭐, 이걸로 좋지 않아?"
10033045-13 = "두 분……. 손님으로 방문해 주셨는데, 계속 저희 쪽에서 폐만 끼친 것 같네요……."
10033045-14 = "죄송하고, 감사합니다."
10033045-15 = "아하하하. 곤란했지, 여러 가지로? 어떻게든 알 것 같아서 말이야~"
10033045-16 = "괜한 참견이었으려나?"
10033045-17 = "그럴 리가요! 오히려, 이 보답을 어떻게 해 드려야 할지……."
10033045-18 = "에이, 친구 사이에 너무 딱딱한 거 아냐?"
10033045-19 = "친…… 구요?"
10033045-20 = "응~? 난 그렇다고 생각하는데, 아니야? 같이 사진 찍고, 번호도 교환했고."
10033045-21 = "뭐……. 이미 이야기했던 거지만, 키라라 쨩은 거리감을 잘 안 재니까 말이지……."
10033045-22 = "부담이었다면 말해 줘. 내가 대신 사과할게."
10033045-23 = "아, 아뇨! 그렇다기보다는…… 오히려 황송하달까…… 놀라웠다고 할까……."
10033045-24 = "그러면 저희는…… 친구, 인 거죠?"
10033045-25 = "응! 남은 수학여행 기간, 잘 부탁해 악수라도?"
10033045-26 = "네, 네에……."
10033045-28 = "아–! 나도, 나도! 나도 낄래!"
10033045-32 = "예이–! 함께 고난을 이겨낸 우정이라는 것은, 정말로 멋진 것입니다!"
10033045-33 = "다음 일정 시작되면…… 깨워 줘……. 쿠울……."
10033045-34 = "조금 전부터 느꼈지만……. 여러 가지 의미로 거물이네. 이쪽은."
10033045-39 = "(스케줄이…… 34분이나 늦어지고 말았어…….)"
10033045-40 = "(다, 다음 일정이야말로……!)"
