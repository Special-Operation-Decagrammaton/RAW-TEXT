[translation]
1601605-1 = "저를 맡아주세요."
1601605-5 = "(휴게실에서 기다리고 있으니, 잠시 후 미네가 직접 찾아왔다.)"
1601605-6 = "실례하겠습니다, 선생님."
1601605-14 = "[ns1] \"……역시.\"\n[ns2] \"그쪽 일일 거라고 생각했어.\""
1601605-17 = "역시 예상하고 계셨던 거군요, 제가 이런 쪽……."
1601605-18 = "이 의복에 관해 상담을 요청할 거라는 걸."
1601605-19 = "……덕분에 긴장은 조금 풀리네요. 감사합니다."
1601605-20 = "이야기가 빠르겠군요. 선생님, 무례라는 걸 알고 있지만 그럼에도 이러는 저를 용서해 주시기 바랍니다."
1601605-21 = "단도직입적으로 말씀드리겠습니다."
1601605-22 = "선생님. 저는……."
1601605-27 = "……이 옷의 '처분'에 대해 고민하고 있습니다."
1601605-28 = "[ns] \"…….\""
1601605-30 = "[ns3] \"……예!? 처분!? 갑자기 처분!?\"\n[ns4] \"무슨 문제라도 있는 거야!?\""
1601605-32 = "네. 처분입니다."
1601605-34 = "네. 문제가 있습니다."
1601605-35 = "아시겠지만 저는 다른 곳도 아닌 트리니티 구호기사단의 단장 역할을 맡고 있는 몸."
1601605-36 = "지금의 옷과 이 옷을 입고서 하는 아이돌 활동도 좋지만, 그렇다고 제가 본래의 저를 버릴 수는 없습니다. 그것을 바라지도 않습니다."
1601605-37 = "그리고 문제는 거기서 발생합니다. 이것은 과연 두 면이 양립할 수 있는가에 대한 이야기."
1601605-40 = "이 옷은 계속 입고 싶지만, 그래서는 구호기사단의 단장이라는 정체성이 점점 옅어지고……."
1601605-41 = "다시 말해 입고 있는 시간만큼, 구호기사단의 저와는 멀어진다는 것입니다."
1601605-44 = "홍보니 뭐니 이런저런 이유를 들어가며 입으면서도 활동할 수 있는 방법을 취해 보았지만, 그 또한 일시적인 것이었습니다. 문제의 본질이 바뀌지는 않더군요."
1601605-45 = "선생님 저는, 언젠가는……. 둘 중 하나에 소홀해지고 말 것입니다. 그리고 그게 어느 쪽이건, 저에게는 상처가 될 것만 같습니다."
1601605-46 = "단원분들은 때때로 옷을 입고 게릴라 라이브 같은 걸 취미로 해보는 것도 어떠냐-같은 절충안도 말해 주셨습니다만……."
1601605-47 = "결국 모두 거절했습니다."
1601605-48 = "그것도 결국 둘 사이의 경계가 모호해지거나, 섞이는 느낌이었기 때문입니다."
1601605-49 = "[s5] \"꽤나 경계하고 있구나, 그 부분을.\"\n[s6] \"공존은 어렵다고 판단한 거야?\""
1601605-52 = "네. 그것이 저의, 진지하게 내린 고민의 결론입니다."
1601605-56 = "막연하게 낙천적이지도, 그렇다고 지나치게 부정적이지도 않게 이 상황이 지속됐을 때의 미래를 상상해 본 결과입니다."
1601605-57 = "저 스스로는 완전한 병행이 불가능합니다. 결국 둘 중 하나가 다른 한쪽에 영향을 줄 것입니다. 그리고 저는 그것을 원하지는 않습니다."
1601605-58 = "……그래서."
1601605-63 = "그래서 이 옷을……. 선생님께 맡기고자 합니다."
1601605-67 = "[ns7] \"나에게?\"\n[ns8] \"보관하고 있어 달라는 뜻이니?\""
1601605-70 = "그렇습니다. 말하자면, 이것은 일종의 '봉인'이라고 할 수 있겠네요."
1601605-71 = "제가 직접 들고 있다면 끊임없이 저는 이 옷에 대해 생각할 것이고, 그렇다고 없애고 싶지는 않습니다."
1601605-72 = "네. 지금의 이 모습도 부정할 생각까지는 없으니까요. 저에게는 소중한 추억이고, 그렇기에 그것이 변질되진 않길 바랍니다."
1601605-73 = "그러니 선생님께 맡겨 드리는 것이 가장 안전한 방법이라고 판단했습니다. 그런 거라면 저도 가슴 한편에, 이 기억들을 잘 재울 수 있겠지요."
1601605-77 = "……선생님."
1601605-78 = "지금 입고 있던 이 옷을, 이제부터 선생님께서 보관해 주실 수 있으실까요?"
1601605-79 = "[s] \"………….\""
1601605-81 = "[ns] \"……미네.\""
1601605-85 = "[ns9] \"미안하지만, 그 부탁은 들어줄 수 없어.\"\n[ns10] \"그 옷은 미네 스스로가 가지고 있어야 해.\""
1601605-90 = "……그렇습니까."
1601605-91 = "알겠습니다. 선생님께서 그렇게 말씀하신다면, 어쩔 수 없는 일이겠지요."
1601605-95 = "그러면 결국 이 옷은 없애는 방향으로……."
1601605-99 = "……? 네? 다르다고요?"
1601605-100 = "제가 그대로 가지고 있어도 별문제가 없다……? 오히려 그래야만 한다고요……?"
1601605-101 = "어째서 그런……."
1601605-105 = "……잠깐."
1601605-106 = "선생님. 지금 뭔가 저에 대해 좋은 말씀을 해주시려는 것처럼 들립니다만, 지금은 이야기가 다릅니다."
1601605-107 = "요점은 이것을 들고 있으면 저는, 결국 이것을 어떻게 해야 할지 판단할 수 없게 된다는 것입니다. 그런데도……."
1601605-108 = "……네?"
1601605-109 = "그런 이야기가 아니라고요? 그렇지만……."
1601605-110 = "[s11] \"대신 그동안은 나도 같이 고민해 줄게.\"\n[s12] \"받아들일 수 있을 때까지는, 내가 입을 때를 알려줄게.\""
1601605-113 = "……?"
1601605-117 = "……!!"
1601605-118 = "……선생님……께서? 이 옷을 입을 때를?"
1601605-119 = "어째서 그렇게까지……."
1601605-120 = "……죄송합니다. 아직은 의도를 정확히 이해하지는 못하겠군요."
1601605-121 = "그렇지만……. 네. 제가 모르는 뭔가가 있겠지요. 여기서는 그렇게 믿겠습니다."
1601605-122 = "뭐……. 스스로도 저의 사고가 다소 경직돼 있다는 것은 알고 있으니까요."
1601605-127 = "음……. 그렇군요. 과연……."
1601605-128 = "선생님께서 입을 때를 알려주신다……라."
1601605-129 = "확실히, 그런 방식이라면 저 스스로도 옷을 두고 어떻게 해야 할지 고민할 필요는 없을 것 같고 말이지요."
1601605-130 = "……후후."
1601605-131 = "정말이지……. 자신의 옷을 언제 입을지 다른 사람이 정해주는 상황이라니, 참신하면서도 재미있는 발상입니다."
1601605-132 = "괜찮겠지요. 다른 분도 아닌, 선생님의 선택이시니까요."
1601605-133 = "……뭔가……."
1601605-134 = "……생각해 보면, 뭔가 조금 묘하게 부끄러운 느낌도 들긴 하지만 말이에요."
1601605-138 = "[ns13] \"아, 아니! 이건 어디까지나 고민을 위해……!!\"\n[ns14] \"뭐죠! 조금 전까진 심각한 분위기였잖아요!?\""
1601605-143 = "후후후, 농담입니다."
1601605-144 = "그러면 선생님. 앞으로는 '이쪽 저'를 완전히 선생님께 맡긴다고 생각하고 있겠습니다."
1601605-145 = "개인적인 욕심으로는……."
1601605-150 = "……지금의 저와 선생님이, 자주 뵐 수 있기를 기대하고 있답니다."
