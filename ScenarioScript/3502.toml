[translation]
3502-1 = "선물과 선물"
3502-3 = "으아아~ 덥다~."
3502-4 = "그렇지만 모리모리군~. 모리모리군이 있으니까~."
3502-5 = "오늘 점심 후식은 모리모리군……."
3502-11 = "……응? 어라……."
3502-12 = "……선도부장!?"
3502-13 = "……음?"
3502-14 = "아아. 누군가 했더니 메구였네. 여긴 어쩐 일로……?"
3502-18 = "……혹시 온천 때문?"
3502-19 = "응? 아냐, 아냐~! 지금은 그런 거 아니야! 그냥 후식으로 모리모리군을 사러 왔을 뿐!"
3502-20 = "모리모리군……?"
3502-21 = "그러고 보니 편의점 안에 그런 이름의 아이스크림이 있었던 것 같네."
3502-22 = "그러면 오늘은 따로 근처에서 온천을 판다든가 하는 일은 없고?"
3502-23 = "으음, 그게……."
3502-24 = "……아! 잠깐!"
3502-25 = "우선 \"평상시 선도부나 발키리와 만났을 때 카스미 부장이 어떻게 대처하라 했는지 말했던 것\"들을 해야지. 히나 선도부장도 선도부니까!"
3502-26 = "……? 뭘 하려고……."
3502-27 = "그게……. 음……. 잠시만, 떠올릴 시간을……."
3502-31 = "……생각났니?"
3502-32 = "……아!"
3502-33 = "응! 기억났어. 우선 이걸 꺼내서……."
3502-38 = "……쨔쟌-!! 찾았다! 자, 받아!"
3502-44 = "그리고 이제……. 흠흠!"
3502-45 = "\"늘 수고가 많으십니다. 별다른 뜻은 없고, 이건 저희의 작은 선물입니다. 잘 부탁드립니다.\""
3502-46 = "…………."
3502-47 = "………………."
3502-48 = "……라고 말하면……. 끝!"
3502-49 = "이제 해야 할 건 했다! 그리고 아까 물어본 온천 파는 건 나도 몰라."
3502-50 = "아직 부장이 따로 이야기해 준 건 없으니까 말이야. 뭐, 때가 되면 알아서 말해 주겠지만!"
3502-51 = "과연……. 그럼 이건……."
3502-55 = "후우……."
3502-56 = "……메구."
3502-57 = "카스미가 시킨 이거, 혹시 다른 사람들한테도 했어?"
3502-58 = "……응? 아니? 아직?"
3502-59 = "만나서 실제로 해보는 건 히나 선도부장이 처음이야. 그런데 왜?"
3502-60 = "알았어. 그래도 다행이네."
3502-61 = "그럼 부탁이 하나 있는데, 혹시 괜찮다면 들어줄 수 있을까?"
3502-62 = "부탁? ……뭔데?"
3502-63 = "뭐, 안될 거 없지? 말만 해!"
3502-64 = "고마워. 그럼……."
3502-65 = "지금부터 내가 하는 걸 그대로 카스미에게 다시 전해줘."
3502-71 = "……!? 헉!?"
3502-72 = "봉투가 산산조각 났어……!?"
3502-73 = "카스미라면 자세하게 설명하지 않아도 알 거야. 그래도 굳이 말로 전달한다면……."
3502-74 = "\"또 어디선가 이런 행위를 한 것이 적발되면, 그땐 제대로 손 봐주겠다.\""
3502-75 = "\"경고하는데 게헨나 안에서는 예전 습관 최대한 빨리 버리도록.\""
3502-78 = "……라고 전해줘. 알았지?"
3502-79 = "으음……. 뭐지? 선물을 줬는데 선물을 부수고……. 다시 선물을 부쉈다고 전달……."
3502-80 = "으으음. 뭔가 이해가 안 가는 행동이긴 하지만……."
3502-81 = "에이, 뭐. 선도부장도 우리 부장도 똑똑하니까, 뭔가 이유가 있겠지. 알겠어!"
3502-82 = "후후. 고마워."
3502-83 = "……아, 그러고 보니……."
3502-84 = "선도부장!! 잠시만 기다려!! 금방 올 테니까!"
3502-89 = "왔다……!"
3502-90 = "오래 기다렸지! 자, 이거 받아!!"
3502-95 = "이건……. 아이스크림?"
3502-96 = "……모리모리군? 나 주는 거야?"
3502-97 = "응! 어차피 잔뜩 사서 모두 나눠 줄 생각이었으니까. 선도부장도 하나 먹으면 좋잖아?"
3502-98 = "오늘 꽤 더운 날이라고. 이런 날씨에는 모리모리군이 딱이지!"
3502-99 = "……어라."
3502-100 = "그러고 보니 선도부장은 우리한테 선물 받는 게 별로였나? 조금 전에도 부숴버렸는데."
3502-101 = "미안, 미안! 나도 모르게 습관적으로 그만."
3502-105 = "……아니. 그렇지 않아."
3502-106 = "고마워, 메구. 잘 먹을게."
3502-107 = "……응? 이건 괜찮은 거야? 뭔가 다른가……?"
3502-108 = "그건 카스미에게 물어봐도 대답해 줄 거야."
3502-109 = "…………."
3502-110 = "……메구."
3502-111 = "응? 나?"
3502-112 = "메구는 지금 3학년이었지? 카스미랑은 사이가 꽤 좋아 보이는데……."
3502-113 = "온천개발부는 그전에도 있었던 걸로 알고 있어. 숫자는 지금과 달리 열댓 명 정도뿐이었지만……."
3502-114 = "그때에는 원래는 메구가 부장이었던 거지? 카스미는 뒤에 들어온 거고."
3502-115 = "응? 아아~. 응! 카스미 부장이 온 뒤로, 부장 자리를 대신 맡아주겠다고 해서 넘겨줬거든."
3502-116 = "이야~! 역시 선도부장은 뭐든지 알고 있네!"
3502-117 = "그 정도는 아니지만……."
3502-118 = "흐음……."
3502-119 = "그럼 카스미가 먼저 그렇게 말한 거야? \"부장 자리를 대신 맡아주겠다\"고?"
3502-120 = "응."
3502-121 = "……그래."
3502-122 = "……아. 조금 다른가?"
3502-123 = "……? 응?"
3502-124 = "정확히는 \"뭘 하고 싶어?\"라고 물어보길래, \"온천만 계-속 파고 싶어!\"라고 말했거든!!"
3502-125 = "그렇게 말하니까 \"그럼 그렇게 만들어 주겠다\"고 대답했어. 카스미 부장이."
3502-126 = "덕분에 그 뒤로는, 정말로 나는 온천 파는 거만 계속하고 있으니까 말이야!! 같이 하는 부원들도 엄~청 늘었지!!"
3502-130 = "……그래."
3502-131 = "대충 그런 식일 거라 생각은 했어. '그곳' 녀석들은 원래부터 그런 구두약속을 중시했으니까."
3502-134 = "……응? 무슨 이야기야?"
3502-135 = "아무것도 아니야. 그냥 이쪽의 이야기."
3502-136 = "그럼 나는 마저 해야 할 일이 있어서 실례할게. 메구도 날 더운데 몸조심하고. 카스미도……."
3502-137 = "……너무 크게 사고 치지는 말라고, 같이 전해줘."
3502-138 = "응! 선도부장도 조심해서 들어가~."
3502-142 = "그럼 나도 다시 돌아가 볼까~."
3502-144 = "……라는 일이 있었어!"
3502-145 = "덧붙여서 선도부장이 전해달래."
3502-146 = "\"또 어디서 이런 행위를 한 것이 적발되면, 그땐 제대로 손 봐주겠다.\""
3502-147 = "\"경고하는데 게헨나 안에서는 예전 습관 최대한 빨리 버리도록.\""
3502-151 = "히이이이이-!!!"
3502-152 = "선물과 선물"
