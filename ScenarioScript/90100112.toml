[translation]
90100112-2 = ""
90100112-3 = "สำนักงานประธานองค์การนักเรียน"
90100112-5 = "ท่านประธานองค์การนักเรียนคะ ฉันพาตัวผู้ต้องขังหมายเลข 1192 มาตามที่สั่งแล้วค่ะ"
90100112-6 = "ค่ะ เชิญเข้ามาเลยค่ะ"
90100112-7 = ""
90100112-12 = ""
90100112-13 = "ไม่ได้เจอกันนานเลยนะคะ หัวหน้าสำนักป้องกัน"
90100112-14 = "ไม่สิ... ชิรานูอิ คายะ"
90100112-15 = "คุณ..."
90100112-16 = "ฉันได้รับรายงานเกี่ยวกับทุกสิ่งที่เกิดขึ้นขณะที่ฉันไม่อยู่แล้วค่ะ"
90100112-17 = "คุณฉวยโอกาสในช่วงที่รักษาการนานากามิ รินพ้นจากอำนาจ แล้วพยายามก่อการปฏิวัติสินะคะ"
90100112-18 = "โดยพื้นฐานแล้ว ฉันก็มีส่วนรับผิดชอบที่ทำให้คิโวทอสตกอยู่ในความวุ่นวาย... แต่การกระทำของคุณ เกือบทำให้องค์การนักเรียนล่มสลายทั้งองค์กรเลยค่ะ"
90100112-19 = "เพราะงั้นก่อนจะเข้าสู่การพิจารณาคดี ฉันเลยอยากฟังคำให้การของคุณก่อนค่ะ"
90100112-20 = "คายะ ทำไมคุณถึงต้องการตำแหน่งของประธานองค์การนักเรียนเหรอคะ?"
90100112-21 = ""
90100112-23 = ""
90100112-24 = "..."
90100112-25 = "เดี๋ยวก่อน คุณคือ... ใครคะ?"
90100112-26 = "คะ...?"
90100112-27 = "คุณจำหน้าฉัน... ไม่ได้เหรอคะ? คายะ?"
90100112-28 = "จะให้จำได้ยังไงคะ ในเมื่อฉันไม่เคยเห็นคนอย่างคุณมาก่อนเลย"
90100112-29 = "ว่าแต่ ทำไมคุณถึงใส่ชุดของประธานองค์การนักเรียนอยู่ล่ะคะ? หรือว่าคุณก็ปฏิวัติมา..."
90100112-30 = ""
90100112-32 = ""
90100112-33 = "เหมือนว่าคุณจะยังเข้าใจสถานการณ์ผิดอยู่นะคะ งั้นฉันขอแนะนำตัวอีกครั้ง"
90100112-34 = "ฉันคือหัวหน้าขององค์การนักเรียน ผู้รับผิดชอบการบริหารคิโวทอส เมืองแห่งการศึกษาแห่งนี้..."
90100112-35 = "คุณกำลังพูดเรื่องอะไรคะ?!"
90100112-36 = "[ruby=ยอดคน]ประธานองค์การนักเรียน[/ruby]ที่ฉันรู้จัก... ไม่ได้มีหน้าตาแบบนี้ค่ะ!"
90100112-37 = ""
90100112-39 = ""
90100112-40 = "ถึงคุณเองก็ดูมีสง่าราศีอยู่บ้าง แต่ยังไงก็ไม่เหมือนเลยค่ะ!"
90100112-41 = "ประธานองค์การนักเรียนตัวจริงต้องสง่างามกว่านี้ เป็นกันเองกว่านี้... ถึงบางครั้งจะดูเป๋อๆ จนชวนให้เป็นห่วง แต่แบบนั้นแหละ... คือความสมบูรณ์แบบ..."
90100112-42 = "นี่ พูดกับท่านประธานองค์การนักเรียนแบบนั้นได้ยังไง!"
90100112-43 = "คุณก็ถูกตัวปลอมคนนี้ซื้อตัวไปแล้วเหมือนกันเหรอคะ? ดูยังไงก็รู้ว่าไม่เหมือนประธานองค์การนักเรียนเลยนี่!"
90100112-44 = "ถ้าประธานองค์การนักเรียนตัวจริงกลับมา ทั้งคุณ ครูจากชาเล่ต์ แล้วก็ริน จะต้องถูกลงโทษกันหมด..."
90100112-45 = ""
90100112-47 = ""
90100112-50 = ""
90100112-51 = "อุ้บ อุ้บ!"
90100112-52 = "ขอประทานโทษด้วยค่ะ ท่านประธานองค์การนักเรียน เธอถูกคุมขังมานาน สงสัยสภาพจิตใจจะผิดปกติไปแล้วค่ะ"
90100112-53 = "ไม่เป็นไรค่ะ... ถ้างั้นฉันจะเลื่อนการพูดคุยกับคายะออกไปก่อนค่ะ"
90100112-54 = ""
90100112-59 = "ครั้งหน้าฉันจะไม่พลาดอีกแน่!"
90100112-60 = ""
90100112-61 = ""
90100112-62 = ""
90100112-64 = "ฉันดูเปลี่ยนไปมากขนาดนั้นเลยเหรอคะ...?"
90100112-66 = "องก์ <แกะรอยตำนาน>;ติดตามต่อในบทที่ 2"
