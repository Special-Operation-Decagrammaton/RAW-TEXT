[translation]
90100112-2 = ""
90100112-3 = "聯邦學生會長辦公室"
90100112-5 = "聯邦學生會長。#n我把您交代的囚犯編號1192號帶來了。"
90100112-6 = "好的，請進。"
90100112-7 = ""
90100112-12 = ""
90100112-13 = "好久不見了，防衛室長。"
90100112-14 = "不對……不知火香耶。"
90100112-15 = "你……"
90100112-16 = "在我離開期間發生的事，我已經全部收到報告了。"
90100112-17 = "聽說你趁著七神琳代理失勢之際，企圖發動政變。"
90100112-18 = "奇普托斯陷入混亂的根本性原因固然在我……#n然而你的行動，差點就讓聯邦學生會徹底崩潰了。"
90100112-19 = "因此在進行審判之前，我想先聽聽你的證詞。"
90100112-20 = "香耶，你為什麼要覬覦聯邦學生會長的位置呢？"
90100112-21 = ""
90100112-23 = ""
90100112-24 = "…………"
90100112-25 = "不對，你……是誰啊？"
90100112-26 = "……什麼？"
90100112-27 = "你……認不出我的臉了嗎，香耶？"
90100112-28 = "說什麼認不認得，我從來沒見過你這個人啊？"
90100112-29 = "而且你為什麼穿著聯邦學生會長的衣服？#n難不成你也想政變──"
90100112-30 = ""
90100112-32 = ""
90100112-33 = "你看起來似乎不太理解，我就重新向你自我介紹一次吧。"
90100112-34 = "我是管理這座學園都市奇普托斯的聯邦學生會之首──"
90100112-35 = "你在胡說什麼啊！？"
90100112-36 = "我的[ruby=超人]聯邦學生會長[/ruby]他……可不長這個樣子！"
90100112-37 = ""
90100112-39 = ""
90100112-40 = "雖然你確實也挺有氣質的，但是完全不一樣！"
90100112-41 = "真正的聯邦學生會長應該更優雅、更平易近人……#n雖然有時反而會因此顯得有點傻里傻氣的，但是就連那一點都很完美──"
90100112-42 = "你這傢伙，怎麼用這種口氣對聯邦學生會長說話！"
90100112-43 = "連你也被這個冒牌貨收買了嗎？#n這個人怎麼看都跟聯邦學生會長長得不一樣啊！"
90100112-44 = "等真正的聯邦學生會長回來之後，#n你也好，夏萊的老師也好，琳也好，全都得吃不完兜著──"
90100112-45 = ""
90100112-47 = ""
90100112-50 = ""
90100112-51 = "唔唔！"
90100112-52 = "非常抱歉，聯邦學生會長。#n可能是長期收監導致他的精神出現異常了。"
90100112-53 = "……沒關係。#n那麼，與香耶的面談就延到下次再進行吧。"
90100112-54 = ""
90100112-59 = "──下次我可不會再失敗了！"
90100112-60 = ""
90100112-61 = ""
90100112-62 = ""
90100112-64 = "……我給人的印象，真的變了那麼多嗎？"
90100112-66 = "怪談追蹤篇;To be Continued in Chapter 2"
