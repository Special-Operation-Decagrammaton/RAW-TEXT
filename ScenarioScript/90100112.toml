[translation]
90100112-3 = "총학생회장 집무실"
90100112-5 = "총학생회장님. 말씀하신 죄수번호 1192 번을 데리고 왔습니다."
90100112-6 = "네, 들어오세요."
90100112-13 = "오랜만에 뵙네요, 방위실장."
90100112-14 = "아니…… 시라누이 카야."
90100112-15 = "당신은……."
90100112-16 = "제가 자리를 비운 사이에 있었던 일에 대해서는 전부 보고 받았습니다."
90100112-17 = "나나가미 린 대행이 실각된 틈을 타, 쿠데타를 시도했다지요."
90100112-18 = "근본적으로 키보토스가 혼란에 빠진 것에는 제 책임도 있지만…… 당신의 행동은 총학생회를 완전히 무너트릴 뻔 했습니다."
90100112-19 = "그렇기에 재판을 진행하기 전에 앞서 당신의 증언을 들어보고 싶었습니다."
90100112-20 = "카야, 어째서 당신은 총학생회장의 자리를 노린 건가요?"
90100112-24 = "………"
90100112-25 = "아니, 당신…… 누군가요?"
90100112-26 = "……네?"
90100112-27 = "제 얼굴을…… 못 알아보시겠나요. 카야?"
90100112-28 = "알아보고 자시고, 당신 같은 사람은 처음 보는데."
90100112-29 = "그보다 당신이 어째서 총학생회장의 옷을 입고 있는 거죠? 설마 당신도 쿠데타를—"
90100112-33 = "아무래도 이해하지 못하신 듯하니, 다시 한번 제 소개를 하겠습니다."
90100112-34 = "저는 이 학원도시, 키보토스를 관리하는 총학생회의 수장—"
90100112-35 = "그게 무슨 소리인가요?!"
90100112-36 = "저의 [ruby=초인]총학생회장[/ruby]은…… 그렇게 생기지 않았다고요!"
90100112-40 = "물론 당신도 제법 기품이 있긴 하지만, 전혀 다르다고요!"
90100112-41 = "진짜 총학생회장은 좀 더 우아하고, 사람들이 다가가기 쉬운…… 가끔은 그래서 오히려 얼빠진 느낌조차 들지만, 그 점까지 완벽한—"
90100112-42 = "이 녀석, 총학생회장님께 그게 무슨 말버릇이냐!"
90100112-43 = "당신도 이 가짜에게 매수당한 건가요? 누가 봐도 총학생회장과 다르게 생겼잖아!"
90100112-44 = "진짜 총학생회장이 돌아오면 당신도, 샬레의 선생도, 린도 모두 가만두지 않—"
90100112-51 = "읍읍!"
90100112-52 = "죄송합니다, 총학생회장님. 아무래도 긴 수감으로 정신이 이상해진 모양입니다."
90100112-53 = "……아닙니다. 그럼 카야 양과의 면담은 다음으로 미루지요."
90100112-59 = "—다음 번에는 실패하지 않을테니까!"
90100112-64 = "……제 인상이 그렇게 많이 달라진 걸까요?"
90100112-66 = "로어추적 편;To be Continued in Chapter 2"
