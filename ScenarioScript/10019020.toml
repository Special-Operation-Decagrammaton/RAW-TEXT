[translation]
10019020-11 = "방어 부대와 강하 부대 합류 완료. 현재 마지막 교전 중."
10019020-21 = "하하하하하-! 꽤 하잖아, 네 녀석! 마음에 들었어!"
10019020-22 = "캬하하하하-!"
10019020-26 = "……. 신났네, 두 사람."
10019020-27 = "이건 꽤 희귀한 장면이지 말임다. 흐음."
10019020-28 = "으, 으음."
10019020-29 = "하지만 그래도……."
10019020-36 = "적들의 숫자는 줄어들지 않고 있어요."
10019020-37 = "끝이 없겠는걸요, 이거……."
10019020-42 = "……수고했네, 제군들!"
10019020-43 = "으, 으응?"
10019020-51 = "어라…… 저 교복은……."
10019020-52 = "붉은겨울……?"
10019020-59 = "이 몸이 바로 체리노!"
10019020-60 = "붉은겨울의 학생회장이자, 미화부장이자, 서기장이자 청소부장이자, 선도부장이자 급식부장인 중요하신 몸이다!!"
10019020-61 = "콤라드의 부탁으로 제군들을 도우러 온 것이야! 이 몸은 중요하신 몸이니 이런 중요한 일에 빠질 수 없는 법이지!"
10019020-66 = "……."
10019020-67 = "……."
10019020-69 = "어…… 굉장한 악세서리……."
10019020-70 = "수염?! 아하하하! 굉장해! 뭐야, 저거?"
10019020-72 = "(뭐야, 저 수염……?! 엄청 멋지잖아!?)"
10019020-73 = "……."
10019020-74 = "그러니까…… 지원군이 도착한 거네요?"
10019020-81 = "응. 붉은겨울의 지원군 확인했어. 이제 해볼 만하겠네."
10019020-84 = "좋아, 그럼 다시 시작해 보자고!"
10019020-85 = "킥킥킥……."
10019020-87 = "제군들! 전열을 가다듬어라!"
10019020-88 = "지금부터 붉은겨울의 총력전을 시작한다!"
