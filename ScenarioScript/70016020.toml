[translation]
70016020-1 = "용궁으로 가는 길 2"
70016020-3 = "흥흥~ 흥흥흥~ ♪"
70016020-4 = "옛날에 바다로 나간 배~ 그 배의 이름은 빌리 오 티 ~ ♫"
70016020-9 = "어엇, 앞에 다리 올리면 안 돼요."
70016020-10 = "응?"
70016020-11 = "걱정할 것 없다. 이 부츠, 새것이나 다름 없으니까!"
70016020-12 = "하하하, 그게 아니라 위험해서 그래요. 사고가 나면 에어백 때문에 다쳐요."
70016020-13 = "에어백……?"
70016020-14 = "잘은 모르지만, 키잡이의 말이니 듣는 게 좋겠지."
70016020-15 = "(차를 한 번도 타본 적이 없는 건가?)"
70016020-16 = "아까 냄새 난다고 했는데, 괜찮아요? 생선 냄새가 여간 지독한 게 아닐 텐데."
70016020-17 = "생선 냄새를 싫어할 이유가 어디 있느냐? 바다에서 가장 흔히 맡을 수 있는 향이니, 오히려 마음이 편안해지는 걸."
70016020-18 = "바다를 좋아하나 봐요. 이 시간에 갑자기 바다에 가려고 하고."
70016020-19 = "갑자기가 아니야! 여는 마땅히 있어야 하는 곳으로 돌아가는 중이라고. 여가 바다에 있지 않으면 도대체 어디에 있어야 한 단 말이냐?"
70016020-20 = "바다에 돌아가야 한다고요……?"
70016020-21 = "하하, 꼭 옛날 이야기에 나오는 용궁에서 온 사신 같은 표현이네요."
70016020-22 = "용왕님을 보러 가는 길이라고 생각하니, 조금 기운이 나는데요."
70016020-23 = "응? 그대는 용왕이 두렵지 않은 게냐?"
70016020-24 = "왜 두려워 해야 하나요?"
70016020-25 = "옛날 이야기에서도 자주 나오잖아요. 곤경에 처한 가엾은 거북이를 바다에 데려다 줬더니, 용왕님이 소원을 들어주는 보옥을 줬다 던가—"
70016020-26 = "그런 보옥을 손에 넣을 수 있다면, 다들 만사를 제쳐 놓고 용왕님을 만나러 가고 싶어하지 않을까요?"
70016020-27 = "흠…… 그대도 소원이 있는 모양이지?"
70016020-28 = "물론이죠. 다만 멋없는 소원이라서 말하기는 뭣한데……."
70016020-29 = "……결국은 돈이죠. 돈 걱정 없이 살고 싶다는 표현이 더 맞으려나."
70016020-30 = "조금 더 넉넉하게, 숨이라도 돌릴 수 있을 만큼 돈을 벌었으면 좋겠어요."
70016020-31 = "……."
70016020-32 = "하하, 미안해요. 재미없는 현실 이야기로 분위기에 초를 쳤네. 듣기 좀 그렇죠?"
70016020-33 = "으음, 전혀! 욕망이란 사람을 움직이는 동력이 되는 법이니까. 여는 그런 이야기를 아주 좋아하거든."
70016020-34 = "그렇군. 뭍 사람들은 용왕을 그리 생각한단 말이지."
70016020-41 = "응? 이곳은 바다가 아니지 않느냐. 바다는 아까 갈림길 방향 쪽이었는데……"
70016020-42 = "설마 여를 속인 것은—"
70016020-43 = "아뇨. 먼저 오늘 운행을 마쳐야 해서…… 잠깐 사무실에 들려야 해요."
70016020-44 = "금방 돌아올테니 차에서 기다려요. 라디오도 고장 나버려서 심심하겠지만……."
70016020-48 = "이런, 이미 늦었잖아! 여기 가만히 있어요!"
70016020-52 = "……흐음."
70016020-53 = "스읍— 흠."
70016020-54 = "……방금 전까지는 여유로이 바다를 유영하는 해파리처럼 보였는데, 방금의 표정은 마치 상어 떼를 마주한 전갱이처럼 보이는군."
70016020-60 = "6번차! 나와봐!"
70016020-64 = "네, 네엡!!"
70016020-65 = "이게 뭐야? 타이어 교환 청구서?"
70016020-66 = "그, 그게요. 이번에 정비하는데 타이어 스레드가 하나도 안 남았다고 해서……."
70016020-67 = "터질 때까지 한참 쓸 수 있잖아?! 타이어가 한두 푼 하는 것도 아닌데, 장난해?"
70016020-68 = "그러다가 터지면 사고가 크게 나는데……."
70016020-69 = "그래서 지금 사고가 났어? 허락도 없이 갈았으니 월급에서 깔 테니 그런 줄 알아!"
70016020-70 = "그런……!"
70016020-71 = "다음, 3번차! 가지가지 했구만? 15톤에 15톤밖에 안 싣고 오는 것도 모자라서, 오는 길에 휴게소에서 잠까지 자다가 왔어?!"
70016020-72 = "사장님, 과적하면 단속에 걸려서 벌금이 장난이 아녜요……. 벌금도 저희 돈으로 메꾸잖아요."
70016020-73 = "3일 넘게 눈도 제대로 못 붙여서 도저히 버틸 수가 없어서 딱 한 시간만 쉬다가 온 거에요, 제발……."
70016020-74 = "그러면 더 빨리 몰아서 알아서 쉬던지, 겸사겸사 단속도 따돌릴 수 있잖아?"
70016020-75 = "게으름 피운 만큼 월급에서 깔 거니까 알아서 해!"
70016020-76 = "7번차! 어디 있어, 7번차!"
70016020-77 = "와, 왔습니다!! 여기 있습니다!!"
70016020-78 = "시간이 어느 때인데 이제서야 오는 거야!!"
70016020-82 = "이것 봐라? 어디에서 기름 낭비하다가 온 거야? 저번에 경유 주유했다고 경고받았던 거, 너지?"
70016020-83 = "사장님, 경유차에 경유를 안 넣으면 안 돼요……."
70016020-84 = "등유 넣어도 시동은 걸리잖아! 기름이 뭐 땅 파서 나오는 줄 알아?"
70016020-86 = "(당연히 석유는 땅 파서 나오지…….)"
70016020-87 = "(개자식, 월급도 제대로 주는 법이 없으면서, 벼락이나 맞아라.)"
70016020-89 = "너, 정말 잘리고 싶어? 여태까지 가불받은 거 지금 당장 토해낼 수 있어?"
70016020-93 = "그, 그건…… 제발요, 사장님……."
70016020-99 = "왜 멀쩡한 육지에서 토를 하지? 멀미라도 있나?"
70016020-100 = "그럴 때는 뭐라도 좀 씹으면 괜찮아지는데. 염장 고기 남은 건 없나?"
70016020-105 = "여, 여기서 뭐 해요?!"
70016020-106 = "넌 뭐야?! 왜 여기 있어?!"
70016020-108 = "뭔지는 몰라도 빨리 끝내주면 안 되겠느냐? 이 자가 여를 바다에 데려다 주기로 했다만."
70016020-110 = "이젠 택시 부업이라도 하는 거야? 멋대로 손님 받느라 늦었구만?"
70016020-111 = "아, 아녜요 사장님. 그냥, 길에 혼자 있는데 딱해 보여서 가는 길에 태워다 준 건데……."
70016020-112 = "공짜로? 그럼, 사람 태운만큼 더 기름 썼을 거 아냐?"
70016020-113 = "어이, 아가씨. 세상에 공짜는 없어요. 여기까지 태워다 줬으면 뭐라도 줘야 하는 거 아니야?"
70016020-114 = "아이고, 참…… 왜 이러시나……."
70016020-119 = "그야 당연히 알고 있지."
70016020-120 = "뭐?"
70016020-121 = "세상에 공짜는 없다는 건, 비단 육지만의 법칙이 아니지. 여도 알고 있다. 친절을 베푼 이를 대가 없이 돌려보내지는 않을 테니."
70016020-122 = "그대가 이곳의 선장인가. 귀가 많으니 따로 이야기를 했으면 하는데."
70016020-123 = "아니면 그냥 여기서 폭로하기를 바라는 건가? 이득을 모두와 나누고 싶어하는 자처럼 보이지는 않는데."
70016020-124 = "지금 무슨 소리를 하는 거야?"
70016020-125 = "'뭐라도' 달라고 했잖나. 내가 가진 것이라면 익사할 만큼 줄 수 있는데."
70016020-126 = "이야기 정도 듣는다고 손해는 아닐 걸. 여기서 피라미들 상대로 푼돈이나 뜯어내는 것보다는 말이야."
70016020-127 = "……."
70016020-131 = "다들, 일이나 보러 가! 나중에 이어서 하지."
70016020-132 = "아가씨는 사무실로 따라오고."
70016020-133 = "후후, 말이 빨라서 좋군."
70016020-142 = "아니, 대체 어쩌려고…… 돈 한 푼 없어 보이는 게 뻔한 사람이 참……."
70016020-152 = "……피곤해서 퇴근하고 싶은데, 걱정되네. 참……."
70016020-163 = "아이구, 왜 직접 문을 여시고! 짐도 많으신 데 제가 열어 드리려 했습니다!"
70016020-164 = "괜찮다, 괜찮다. 그리 굽신거리지 않아도 마음은 이해하니까."
70016020-165 = "네에 네에, 아무렴요. 헤헤……"
70016020-166 = "그럼, 제 차로 모셔다드릴까요? 트럭은 영 불편하실 텐데—"
70016020-167 = "아니. 미리 어느 차로 도착할지, 누구와 함께 가는지는 미리 말해 두었거든."
70016020-168 = "뱃사람들은 경계심이 많으니까. 처음 보는 뭍사람이 함께 하고 있다면 쓸데없는 경계를 살지도 모르지."
70016020-169 = "그, 그렇군요! 어이, 7번차! 바다로 모셔다드려!"
70016020-171 = "네? 저 아가씨가 요금을 냈어요?"
70016020-173 = "시끄럽고, 사업하는 거 네가 들어서 뭐해? 아무것도 묻지 말고, 잘 모셔다 드려!"
70016020-174 = "가자, 바다로!"
70016020-179 = "네, 네에……."
70016020-185 = "……."
70016020-186 = "바다가 가까워지고 있어! 냄새가 나!"
70016020-187 = "……."
70016020-188 = "……."
70016020-189 = "흐음, 아무것도 묻지 않는게냐?"
70016020-190 = "사장님께서 아무것도 묻지 말라고 해서요."
70016020-191 = "그렇다면, 지금부터는 여가 혼잣말을 하겠노라."
70016020-192 = "그대는 그대로 듣기만 하면 된다."
70016020-193 = "바다는 투명하기에 사람과 달리 속내를 숨기지 않는다.."
70016020-194 = "끊임없이 소용돌이치며 자신의 모든 것을 알려주는데, 뭍 사람들은 듣는 시늉도 하려 하지 않아."
70016020-195 = "그러고선 바다가 알려준 사실을 전해주기만 하면 처음 듣는 것처럼 깜짝 놀라는 거야. '아니, 어떻게 알았지? 정말 바다에 뭐가 있기라도 한가?'"
70016020-196 = "……."
70016020-197 = "그래서. 여가 알게 된 사실 절반에다가, 상대가 듣고 싶어 하는 것 절반을 섞어주면 감쪽같이 신뢰하게 되는 거야."
70016020-198 = "어떤 이야기를 했는데요……?"
70016020-199 = "이제 궁금해졌나? 그러면 말해주지. 그대가 아는 게 더 좋을 테니."
70016020-200 = "아까, 저 앞의 갈림길에서 살짝 바다가 보였는데, 그곳에 모래 준설선이 있었어. 전에 몇 번 본 적 있는 배여서 알아봤거든."
70016020-201 = "그리고 해안 지형은 고래들이 자주 놀러 오는 곳처럼 보였고. 아마 물 위로 튀어오르는 걸 몇 차례 봤을 거야. 그렇지?"
70016020-202 = "여기 처음 온 거 아니에요? 고래가 많은 해안인 건 어떻게……."
70016020-203 = "말했지 않느냐. 바다가 다 이야기해 준다고. 이게 '여가 알게 된 사실'이야."
70016020-204 = "그래서 말해줬어. 준설선의 모래에는 고래의 용연향이 함께 섞여 있다고."
70016020-205 = "하지만 용연향은 준설선에 허가된 업무 외의 부산물이라, 대신 몰래 처분해 줄 곳을 찾고 있다고 당신네 사장한테 이야기해 주었지."
70016020-206 = "수수료를 조금 떼 주는 대신에, 거의 수고도 들이지 않고 '단지 나와 우연히 만났다는 이유' 만으로 큰 돈을 잔뜩 만질 수 있는 거지."
70016020-207 = "이게 '그가 듣고 싶어 하는 것' 이야. 뭍 사람들은 이런 제안에 약하지."
70016020-208 = "그래서, 이렇게 첫 거래비를 선불로 받아온 거야. 브로커한테 성의 표시를 하고 맛보기로 물건을 받아와 준다고 했거든."
70016020-209 = "어떻느냐? 생각보다 별거 없지 않느냐?"
70016020-210 = "별거 아니라니, 정말 터무니없는 이야기인데요……."
70016020-211 = "(바다로 가고 싶다고 한 게, 결국 이 일 때문이었나?)"
70016020-216 = "후후후!"
70016020-217 = "바다! 마침 해도 뜨고 있군. 좋았어!"
70016020-218 = "멈춰, 멈춰! 양 현 정지! 아하하!"
70016020-219 = "우, 우와앗!! 차가 멈추고 문을 열어야죠! 위험해요!"
70016020-231 = "스읍- 하아……."
70016020-232 = "감히 나서는 조각배를 떨치는 파랑, 길을 알려주는 바람……."
70016020-236 = "바다여, 용왕이 돌아왔도다."
70016020-241 = "여기서 만나기로 한 거예요? 준설선은 저기에 있는데?"
70016020-242 = "바람이 너무 센데, 차에서 기다려요. 감기 걸려요."
70016020-243 = "세상에 너무 센 바람은 없어. 만나기로 한 사람도 없고. 그리고……"
70016020-247 = "'용왕'이 바다를 두려워하면 쓰나."
70016020-251 = "네에?! 그러면 사장님에게 말한 건 전부……?"
70016020-253 = "그런 게 있다면, 왜 그런 녀석에게 말해 줘야 하지? 키를 잡고 여기에 데려다 준 건 그대가 아닌가."
70016020-254 = "덕분에 고마웠다. 바다에서 멀어지면 나도 모르게 의기소침해지거든."
70016020-255 = "그러고 보니, 용왕의 이야기를 했었지. 친절을 베푼 대가로 소원을 들어주는 용왕을 만나면 좋겠다고."
70016020-256 = "사장에게 받은 차비는 차에 그대로 두었다. 어차피 떳떳한 돈도 아닐테니, 그걸 들고 잠적하면 한동안은 돈 걱정 없을 게야."
70016020-257 = "하, 하지만…… 그건 범죄라구요…… 그리고……."
70016020-258 = "이것 참, 이야기를 반 만 읽는 반편이였군."
70016020-259 = "전설의 이야기, 정말 제대로 끝까지 읽은 건가?"
70016020-260 = "소원에는 늘 대가가 있기 마련이거늘. 용왕과 얽힌 보통의 것들은 마침내 불행해지기 마련이야."
70016020-264 = "당장 잡을 수 있는 행복이라도 붙잡지 않으면, 차라리 처음부터 엮이지 않았기를 바라게 될 거야."
70016020-265 = "그, 그런……."
70016020-266 = "아, 그러고 보니 내 이름을 아직 말하지 않았나."
70016020-267 = "짐은 키보토스의 대양을 지배하는 용왕이자, 바람과 파도를 다스리는 조수의 교룡—"
70016020-271 = "……그, 다음의 도주, 입니다."
70016020-272 = "고노카미 나나미, 대단히…… 폭력…… 위험한 인물입니다."
