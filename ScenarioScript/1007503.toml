[translation]
1007503-1 = "창작의 고통 1"
1007503-14 = "생애 최초로 데이트 신청 받은 히로인은 어떻게 행동해야 할까!"
1007503-15 = "[s] \"그걸 나한테 물어도 말이지……\""
1007503-16 = "그렇지만 모르겠는걸! 선생님은 어른이잖아. 뭔가 아는 거 없어?"
1007503-17 = "[s] \"무슨 일이길래 그래?\""
1007503-21 = "으음…… 역시 하나하나 설명해야 하는 건가."
1007503-22 = "이런 거야. 여주인공이 한 명 있어."
1007503-23 = "매사에 서투르고, 자신감도 없어서 자기를 돌본다거나 꾸미는 일 같은 건 한 번도 신경 쓰지 못했던 아이지……"
1007503-24 = "그런데 어떤 일이 일어나서, 이래저래 해서 어쩌구저쩌구한 나머지 데이트 신청을 받게 된 거야!"
1007503-25 = "[s] \"그 이래저래하고 어쩌구저쩌구한 부분을 좀 더 자세히.\""
1007503-26 = "지금 그런 게 중요한 게 아니잖아!"
1007503-27 = "아무튼……그래서 여주인공은 평생 한 번도 안 해 본 화장이란 것에도 도전을 해 보고."
1007503-28 = "한 번도 만들어 본 적 없는 도시락을 직접 만들기도 해."
1007503-29 = "[s] \"이야기 잘만 만들어 내고 있잖아……\""
1007503-30 = "문제는 여기서부터란 말이야!"
1007503-31 = "그때 여주인공은 어떤 마음으로 문을 나가게 될까?"
1007503-32 = "첫걸음을 내딛는 순간, 무슨 생각을 하고 무엇을 느낄까?"
1007503-33 = "그리고…… 데이트를 하면서 어떤 이벤트를 맞이하고 그때마다 어떻게 반응할까?"
1007503-34 = "우아아, 모르겠어! 전혀 모르겠다고! 완전히 꽉 막혔단 말이야!"
1007503-35 = "[s3] \"흐음, 그런 거라면……\"\n[s4] \"지금부터 붉은겨울 밖으로 나가 볼래?\""
1007503-38 = "어, 어?! 갑자기 뜬금없이 무슨 소리야?"
1007503-42 = "선생?"
1007503-46 = "선생?!"
1007503-50 = "아, 알았어! 갈 테니까 억지로 잡아끌지 마~!"
1007503-51 = "키보토스 시내"
1007503-60 = "……"
1007503-66 = "진짜로, 나와버렸다……"
1007503-67 = "도대체 뭘 하려는 거야, 선생!!!"
1007503-68 = "[s5] \"이야, 날씨가 좋구만.\"\n[s6] \"바깥 산책이라도 하면서, 머리를 좀 식혀 보자고.\""
1007503-71 = "흐음, 산책이라……"
1007503-72 = "그래. 뭐. 붉은겨울 안에서만 갇혀 있다 보면, 떠오를 생각도 안 떠오를지도 모르지."
1007503-73 = "[s] \"그러면 일단 움직이자.\""
1007503-74 = "오. 에스코트인가. 좋아. 맡기겠다고~!"
1007503-75 = "쇼핑몰"
1007503-77 = "여긴…… 대형 쇼핑몰……?"
1007503-78 = " 새삼 느끼지만, 사람 참 많네…… 붉은겨울은 부지는 넓지만 학생들 숫자는 그걸 채울 만큼 충분하지 않으니 말이지."
1007503-79 = "오, 저기 두 명. 뭔가 그림이 되는데?"
1007503-80 = "화장품 샵이로군. 한 학생이 다른 학생에게 샘플을 발라 주려고 하고, 그 학생은 부끄러운 건지 익숙하지 않은 건지 피하려고 하고 있어……"
1007503-81 = "흐음, 흐음. 잠깐만……"
1007503-86 = "왔다! 스케치 안건이다!"
1007503-87 = "[s] \"뭐, 뭐가?!\""
1007503-88 = "그러니까, 이런 거야! 여주인공이 화장을 하고 나왔는데! 상대가 보기엔 뭔가 어설펐던 거지!"
1007503-89 = "그래서 여주인공은 화장품 샵에 끌려가게 되는데…… 당연히 싫어하겠지?"
1007503-90 = "여기에서 역효과가 발생하는 거지! 그게 상대의 괴롭히고 싶은 마음을 자극하고! 기초 파운데이션만 했던 여주인공은 결국 풀 메이크업을 하게 되고, 완전히 달라진 자기 모습을 보고 넋을 잃으면서……"
1007503-91 = "아니야, 아니야. 여기에서 약간 턴 업을 하자고. 여주인공이 싫어했던 것은 사실 그냥 연기일 뿐이었고, 그걸로 오히려 상대방의 공격성을 자극한 것이었으며……"
1007503-92 = "자기가 공격자라고 생각하고 있었던 쪽은 어느새 그물에 갇혀 빠져나갈 수 없게 되는……"
1007503-93 = "뭐야, 선생! 잘 알고 있잖아!"
1007503-94 = "[s7] \"큿, 메루에게 도움이 되길 바랐지만!\"\n[s8] \"이런 식으로 도움이 되길 바란 건 아니었어!\""
1007503-101 = "어, 선생? 뭐 하려고! 지금 딱 좋을 때란 말이야! 잡아끌지 말라고~!"
1007503-105 = "유원지"
1007503-107 = "흐음. 이번엔 유원지인가. 이벤트의 성지이긴 하지."
1007503-108 = "어디, 어디…… 이벤트를 즐기는 학생들은 없는 것이냐…… 있구만! 말을 하자마자 나타났어!"
1007503-109 = "이야, 관람차인가. 좋지. 좋을 때야. 사이좋게 둘이서 안으로 들어가서는……"
1007503-114 = "……여기도 왔다! 스케치 안건이다!"
1007503-115 = "[s] \"……그 안건의 기준을 모르겠어……\""
1007503-116 = "들어 보라고! 이건 어떻게 보면 클리셰라고도 할 수 있어!"
1007503-117 = "처음에는 여주인공과 상대가 서로 마주 보고 앉아 있다가, 점점 관람차의 고도가 높아지면서……"
1007503-118 = "그러면서 서로를 바라보는 눈빛 속에, 또 다른 어떤 감정이 관람차와 같이 높아져 가는 거지……"
1007503-119 = "그리고 이윽고 한 쪽이 살며시 일어나 다른 쪽의 옆자리에 앉고, 두 사람의 거리는 순식간에 가까워지며……"
1007503-120 = "물리적 거리와 함께 심리적 거리도 같이……! 그리고, 그리고……!"
1007503-121 = "[ns] \"신나 있는 중에 미안하지만……\""
1007503-123 = "[ns] \"우리 순서가 됐다고, 메루.\""
1007503-124 = "아앗! 지금 딱 좋을 때인데!"
1007503-125 = "그렇지만 뭐, 롤러코스터인가. 나쁘지 않지. 나쁘지 않아."
1007503-126 = "흔들다리 효과로, 나란히 앉은 여주인공과 그 상대는 ……"
1007503-128 = "좌석에 앉으신 분들은, 안전벨트를 단단히 착용해 주시기 바랍니다."
1007503-138 = "히얏~ 하하하! 좋은데, 이거!"
1007503-139 = "카페"
1007503-141 = "이번엔 카페인가. 카페야말로 이중적인 공간이지! 단둘만의 시간을 보낼 수 있다는 착각이 들면서도……"
1007503-142 = "그 본질은 공개된 휴식 공간이란 말이야……!"
1007503-143 = "그 갭과 모순에서 오는 양가적 감정과 생각의 소용돌이…… 후후후…… 이거 타오르는구만……"
1007503-144 = "[s] \"……일단 주문부터 하시죠……\""
1007503-145 = "응? 아, 그래. 자릿값 내야지. 자릿값. 그러면 나는……"
1007503-153 = "선생. 저기 저 둘 말이야. 조금 전부터 지켜보고 있었는데……"
1007503-154 = "아, 지금 막 한 쪽의 빨대가 땅에 떨어졌어."
1007503-155 = "[s] \"그리고, 평범하게 새로 빨대를 가져다 달라고 요청했네.\""
1007503-156 = "이런. 재미없는 결말이군……"
1007503-161 = "하지만 나의 스케치 안건 타임은 멈추지 않는다! 이번에는 여주인공의 턴인 것으로 하겠어! 우연을 가장해 빨대를 떨어뜨리고, 그래서 둘이 하나의 빨대를 쓰는 걸 유도하는 것으로……!"
1007503-162 = "아닌가? 차라리 그 반대가 나은가? 여기에서 여주인공의 진도를 여기까지 진행시켜 두는 것은, 차후 이야기의 흐름에 오히려 방해가 되려나?"
1007503-163 = "아니야, 아니야…… 이렇게 가자고. 사실은 정말로 빨대 작전을 세우고 있었는데, 마지막에 와서 겁이 난 거지!"
1007503-164 = "그래서 빨대를 가져다 달라고 하면서도, 한 편으로는 안도감을, 다른 한 편으로는 아쉬움을 느끼면서……"
1007503-165 = "그 풋풋함과 신선함, 우정과 그 이상의 어떤 감정 사이에서……!"
1007503-166 = "[s] \"자, 자. 주문한 거 나왔으니 일단 마시자.\""
1007503-171 = "이야아, 배부른 하루였어!"
1007503-172 = "[s] \"……그렇게 많이 먹었던가?\""
1007503-173 = "잘 모르는구만, 선생! 배부르다는 표현은 여러 가지 의미로 사용할 수 있다고?"
1007503-174 = "선생, 조수로서 재능 같은 게 있었던 거 아냐? 완벽한 로케이션이었다고!"
1007503-175 = "[s] \"만족스러운 데이트였다니, 다행이네.\""
1007503-179 = "……어……?"
1007503-180 = "뭐, 뭣……?! 데, 데데, 데이트……?!"
1007503-181 = "그, 그러고 보니 우리가 오늘 돌아다닌 곳이…… 쇼핑몰에 유원지에……"
1007503-182 = "……?!"
1007503-183 = "[s] \"첫 데이트 장면의 자료 조사에, 참고가 됐을까?\""
1007503-184 = "……!"
1007503-185 = "무, 무무무, 물론이지!"
1007503-186 = "나, 나 같은 작가에게, 이 정도는 여유니까 말야!"
1007503-187 = "그, 그럼 먼저 들어갈 테니까! 또 보자고, 선생!"
1007503-193 = "후악?!"
1007503-194 = "[s] \"아. 전봇대에 머리 부딪혔다.\""
1007503-195 = "으으으…… 머리 아파……!"
1007503-196 = "두, 두고 봐라! 이 원한, 반드시 갚아 주고 말 테다~!"
1007503-198 = "(잘 가라고 말할 새도 없이 멀리 달려가는 메루를 보며, 조용히 손을 흔들었다……)"
