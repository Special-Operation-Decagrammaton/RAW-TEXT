[translation]
2004706-1 = "작전참모의 기책"
2004706-2 = "(키쿄의 말대로 약속 시간에 맞춰 바다에 왔다.)"
2004706-7 = "어서 와. 기다리고 있었어."
2004706-8 = "[s] \"일은 잘 해결됐어?\""
2004706-9 = "문제없어.#n그러니 마음 놓고 즐길 수 있겠지."
2004706-10 = "응? 오늘 하고 싶은 일은 뭐냐고?"
2004706-11 = "금방 알게 될 거야."
2004706-12 = "우선…… 오늘은 가슴 높이까지 들어가 보려고 해."
2004706-13 = "그러니까 이번에도 도와줬으면 하는데, 괜찮지?"
2004706-14 = "[s1] \"하네스 필요해?\"\n[s2] \"실뜨기 실 가져올래?\""
2004706-17 = "뭐가 됐든 상관없어."
2004706-18 = "[s] \"사, 상관없는 겁니까?!\""
2004706-19 = "당신이 나에게 장난치는 게 하루이틀도 아니잖아."
2004706-20 = "하나하나 반응해 주는 것도 바보 같고."
2004706-21 = "자, 어서."
2004706-25 = "손 줘."
2004706-29 = "후우우……."
2004706-30 = "[s3] \"걱정하지 마.\"\n[s4] \"내가 곁에 있잖아?\""
2004706-36 = "……응. 잘 부탁해."
2004706-40 = "(이후로 오랫동안 키쿄와 해수욕을 즐겼다.)"
2004706-42 = "고마워, 선생님."
2004706-43 = "이제 혼자 물에 들어가도 걱정 없겠지."
2004706-44 = "손을 놓지 않아 준 덕분이려나."
2004706-45 = "[s] \"뭐 이 정도쯤이야.\""
2004706-46 = "그건 그렇고, 슬슬 피곤하지 않아?"
2004706-47 = "[s] \"응? 아직 괜찮은데?\""
2004706-48 = "나는 녹초가 됐는데."
2004706-49 = "당신은 아직 쌩쌩하다는 거야?"
2004706-50 = "[s5] \"아! 갑자기 졸음이 쏟아져……!\"\n[s6] \"으! 이상하게 힘이 빠진다……!\""
2004706-53 = "……그렇지?"
2004706-54 = "당신도 피곤한 것 같고, 특별히 준비한 휴식처로 안내해 줄게."
2004706-55 = "[s] \"설마, 아까 말한 '할 일'이라는 게…….\""
2004706-56 = "후후. 보면 알게 될 거야."
2004706-60 = "이쪽이야. 따라와."
2004706-66 = "[ns] \"오, 이건……?\""
2004706-67 = "타는 법 알아?#n그래, 그렇게 누워봐."
2004706-70 = "[wa:450]― [log=키쿄 수영복]어때? [wa:1200]꽤나 좋지 않아?[/log]"
2004706-72 = "― [log=키쿄 수영복]오늘을 위해 만들어 봤지.[/log]"
2004706-75 = "[wa:300]― [log=키쿄 수영복]마음껏 [wa:930]즐겨줬으면 좋겠어.[/log]"
2004706-78 = "[ns7] \"이거 좋네!\"\n[ns8] \"엄청 좋아!\""
2004706-81 = "[wa:1200]― [log=키쿄 수영복]사실……[wa:1580] 처음[wa:970]이야.[wa:120] [/log]"
2004706-84 = "[wa:500]― [log=키쿄 수영복]뭔가를 만들며 [wa:2090]그 사람의 얼굴이 [wa:1120]계속 떠오른 것도.[/log]"
2004706-86 = "― [log=키쿄 수영복]이렇게 무방비한 모습을 [wa:1370]다른 사람에게 보이는 것도.[/log]"
2004706-89 = "[wa:940]― [log=키쿄 수영복]딱히……[wa:1070] 누구라고까지는 말하지는 않겠지만.[/log]"
2004706-92 = "[wa:860]― [log=키쿄 수영복]……앞으로도 [wa:1300]내 곁에 있어 줘.[/log]"
2004706-94 = "― [log=키쿄 수영복]나도 항상 [wa:1540]당신의 곁을 지킬 테니까.[/log]"
2004706-97 = "[wa:730]― [log=키쿄 수영복]……이 동맹은, [wa:1690]영원한 거야.[/log]"
2004706-100 = "(이후 밤이 깊을 때까지 그물침대에서 즐거운 시간을 보냈다.)"
