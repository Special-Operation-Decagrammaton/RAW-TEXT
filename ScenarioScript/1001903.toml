[translation]
1001903-1 = "방호"
1001903-3 = "(마지막 모모톡 메시지가 도착하고 난 뒤, 정확하게 15분이 지나자 벨이 울렸다.)"
1001903-4 = "(어째서인지 도착한 아즈사의 표정은 썩 밝아 보이지 않았다.)"
1001903-5 = "……하아."
1001903-6 = "예상은 했지만, 정말 생각한 것과 일말의 차이도 없네. 선생님의 거처."
1001903-7 = "[s] \"아즈사? 무슨 문제라도 있어?\""
1001903-8 = "이 건물 앞으로 도착해서 내가 이렇게 선생님 앞에 와 서는 데까지 걸린 시간은 겨우 6분 19초."
1001903-9 = "중간에 날 가로막은 거라고는 샬레 정문 하나가 전부. 그마저도 선생님이 바로 열어줬지."
1001903-10 = "엘리베이터도 보안 장치 하나 없이 탈 수 있었고, 집무실 문도 그냥 열 수 있었어."
1001903-11 = "만약 지금 여기 찾아온 게, 사실은 내가 아니라 나로 위장한 다른 사람이었다면 어땠겠어?"
1001903-12 = "안이해. 너무 안이해, 선생님. 전술적으로 전혀 세이프티 존을 만들지 못했어."
1001903-13 = "……하지만 괜찮아."
1001903-14 = "바로 그래서 내가 찾아온 거니까."
1001903-15 = "[s1] \"세이프티 존을 만들겠다는 뜻……?\"\n[s2] \"잘은 모르지만 잘 부탁드립니다.\""
1001903-16 = "응. 이런 면에 있어서 나는 전문가니까. 확실하게 선생님의 안전을 지켜줄게."
1001903-17 = "응. 이런 면에 있어서 나는 전문가니까. 확실하게 선생님의 안전을 지켜줄게."
1001903-18 = "이후로는 개미 한 마리 여길 드나들지 못하게 만들어 놓을 테니까. 챙겨온 부비트랩과 지뢰는 충분해."
1001903-19 = "……응? 뭐라고?"
1001903-20 = "샬레에 찾아오는 학생들을 막는 건 안 돼? 샬레 집무실은 열려 있는 공간이니까……?"
1001903-21 = "선생님. 지금까지 뭘 들은 거야. 그래서는 선생님의 안위를 보장할 수가……"
1001903-22 = "……뭐? 차라리 대피할 수 있는 공간을 만드는 게 낫지 않겠냐고?"
1001903-23 = "으음……"
1001903-24 = "……좋아. 내키지는 않지만, 이곳은 이곳의 룰이 있는 법일 테니. 따르도록 할게."
1001903-25 = "그럼 어디로 가면 되지?"
1001903-27 = "여기는……?"
1001903-28 = "휴게실? 쉬는 공간이라고?"
1001903-29 = "그렇네. 생필품도 충분하고 기온도 더 잘 유지될 것 같아."
1001903-30 = "여기라면 방호시설을 설치해도 무방하겠지."
1001903-31 = "……응? 아직은 시작하지 말라고?"
1001903-32 = "업무가 끝나고 오면 같이 하자고? 혼자만으로도 충분한데. 나를 못 믿는 거야?"
1001903-33 = "그게 아니라고? 혼자 시키는 게 마음이 불편해서 그런다고……?"
1001903-34 = "……후. 정말이지, 선생님은……"
1001903-35 = "알았어. 선생님이 그렇게까지 말한다면, 우선은 따르도록 할게."
1001903-36 = "그럼 나는 여기서 대기하도록 하겠어. 선생님이 돌아오면, 곧바로 착수하도록 하지."
1001903-41 = "(소파에 앉는 아즈사를 두고 다시 집무실로 향했다.)"
1001903-43 = "(그렇게 서류 작업들을 모두 끝내니 해가 진 뒤였다.)"
1001903-44 = "(휴게실로 돌아가 보았다.)"
1001903-46 = "(아즈사가 안마의자에 앉은 채 잠들어 있었다.)"
1001903-50 = "으음…… 음냐…… 음……"
1001903-51 = "(……?)"
1001903-52 = "으, 으음…… 후후……"
1001903-53 = "……?"
1001903-54 = "……헉……!?"
1001903-56 = "서, 선생님……?"
1001903-57 = "[s3] \"잘 잤어, 아즈사?\"\n[s4] \"이해해. 안마의자는 못 참지.\""
1001903-58 = "……으음"
1001903-59 = "……으음"
1001903-60 = "그…… 이, 이건…… 그러니까……"
1001903-61 = "……응? 아무 일 없었냐고?"
1001903-62 = "으, 응. 그야…… 딱히 아무 일도……"
1001903-63 = "……!!"
1001903-64 = "……선생님."
1001903-65 = "설마 처음부터 이럴 생각으로 일하고 온다고 한 거야? 내게 이곳의 분위기를 알리려고?"
1001903-66 = "굳이 방호시설을 깔 필요는 없다고 말하려고……"
1001903-67 = "[s5] \"이곳에는 이곳의 분위기라는 게 있으니까.\"\n[s6] \"아즈사도 조금은 더 릴렉스 해보는 건 어떨까?\""
1001903-68 = "또 그런 안이한 말을……"
1001903-69 = "또 그런 안이한 말을……"
1001903-70 = "……후."
1001903-71 = "그치만 알았어. 나도 스스로 이곳의 룰에 적응하기로 마음 먹었으니까."
1001903-72 = "응. 꺼림칙한 게 없는 건 아니지만, 여기서는 선생님 말이 맞는 거겠지. 내가 참아보도록 할게."
1001903-73 = "……응? 나중에 더 알려주겠다고?"
1001903-74 = "이곳 생활에 대해서?"
1001903-76 = "……후훗."
1001903-77 = "그러네. 어쩌면 지금은 선생님이 아니라, 나에게 그런 게 필요한 것일지도 모르겠어."
1001903-78 = "그럼 기대하고 있을게. 그 훈련."
1001903-80 = "(이후 조금 더 늦은 시간까지, 아즈사와 돌아가며 안마의자를 사용했다.)"
