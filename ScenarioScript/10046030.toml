[translation]
10046030-1 = "제3화;제멋대로 하이웨이"
10046030-4 = "나기사, 일어나세요."
10046030-5 = "도착했습니다."
10046030-10 = "응? 선생님? 혹시 마중 나오신 건가요?"
10046030-11 = "기다리시는 줄 알았으면 조금 더 밟을 걸 그랬군요."
10046030-15 = "나기사. 나기사?"
10046030-19 = "……아, 아. 육지에 도착했나요?"
10046030-20 = "좋은 꿈을 꿨나 보군요. 하늘을 나는 꿈이라도 꿨나요?"
10046030-21 = "그건 잠든 게 아니라…… 하여튼, 오늘부터는 움직이지 않는 지면만 육지라 부르기로 했습니다."
10046030-29 = "나기사, 지면은 원래 움직이지 않아요."
10046030-35 = "세이아 씨, 진지하게 운전 습관은 고치도록 해요."
10046030-36 = "제가 마치 과속이라도 한 듯이 말하는군요. 법정 제한 속도는 철저히 준수했습니다만."
10046030-37 = "이 근처는 속도 제한이 없잖아요!!"
10046030-41 = "……아, 선생님."
10046030-42 = "도착하자마자 못 보일 모습을 보였군요. 송구스럽습니다."
10046030-43 = "모처럼 휴양지에서까지 그런 딱딱한 인사를 하는 겁니까?"
10046030-47 = "……선생님? 왜 그러시죠?"
10046030-48 = "신기한 것이라도 본 듯한 시선이군요."
10046030-49 = "[s1] \"두 사람 다 굉장히…….\"\n[s2] \"……즐길 생각 만땅이구나.\""
10046030-54 = "……? 당연하죠. 즐기러 온 거지 않나요? '휴양'인데."
10046030-55 = "평소의 자신을 버리고…… 자그마한 일탈이 허락되는 날이에요. 그저 흘려보내기엔 너무나도 아깝죠."
10046030-56 = "저는 아닙니다. 평범한 외출복으로 충분했는데, 주변에서 하도 강권해서……."
10046030-57 = "또, 또 시작이군요."
10046030-58 = "기왕 온 것이니 그저 만끽하면 될 텐데요."
10046030-63 = "아, 대화 중에 실례합니다. 티파티 후배로부터 연락이……."
10046030-70 = "여보세요? 아, 네. 착각이 아닙니다. 유리조노 세이아입니다."
10046030-71 = "네, 오늘 나기사는 휴무라서요. ……그렇군요. 해당 업무 관련된 연락은 전부 제 쪽으로 돌려주세요."
10046030-76 = "세이아 씨……?"
10046030-77 = "약속은 벌써 잊었나요? 아니면 애초에 지킬 마음이 없었을까요?"
10046030-78 = "여기 오기 전에 분명히 말했죠. 금일 티파티의 공적 업무는 전부……."
10046030-79 = "……세이아 씨에게 위임한다. 네, 그런 약속을 했었죠."
10046030-80 = "하지만 그것과, 지금 제 핸드폰을 뺏은 행위는 명백히……."
10046030-81 = "무관하다, 라고. 설마 그런 형식적인 변명을 하진 않겠죠?"
10046030-85 = "단지 육신의 피로를 달랠 뿐이라면, 홀로 방에 누워 있는 편이 효율적이겠죠. 그럼에도 구태여 이 멀리까지 '휴양 목적'으로 찾아온 이유가 뭘까요?"
10046030-86 = "루틴한 업무 환경에서 분리하여, 심신을 온전히 회복에 집중할 수 있는 상태로 한다. 그게 바캉스의 본 목적이라 알고 있었습니다."
10046030-87 = "혹시 제가 잘못 이해한 부분이 있나요?"
10046030-88 = "……아니요. 세이아 씨의 말이 맞습니다."
10046030-89 = "그러면 핸드폰은 제가 보관해 두죠."
10046030-90 = "일상과의 연락 수단을 남겨두는 한, 당신을 업무에서 분리했다고 말할 수는 없을 테니까요."
10046030-91 = "아무래도 너무 비약입니다. 그건……."
10046030-92 = "아, 참고로 저는 나기사가 어떤 선택을 해도 상관없습니다. 이 일정은 제 계획도 아니고, 나기사의 휴양은 엄밀히 따지면 저와 무관하니까요."
10046030-93 = "하지만 미카는 어떨까요?"
10046030-94 = "……!"
10046030-99 = "처음부터 나기사는 약속을 지킬 생각이 없었다……. 그걸 알게 된 미카의 표정이 어떨지는 살짝 흥미가 동하는군요."
10046030-100 = "그리고, 나기사가 저의 지적 호기심을 충족시켜 줄지 어떨지도 몹시 기대됩니다."
10046030-101 = "크읏……!"
10046030-106 = "알겠습니다. 이번 바캉스 기간 동안, 제 핸드폰을 세이아 씨가 보관해 주세요."
10046030-110 = "솔직히 무슨 의미가 있는지, 저는 도저히 모르겠습니다만."
10046030-111 = "미카 씨만으로 충분히 피곤한데, 세이아 씨까지 왜 이러는지……."
10046030-120 = "의외로 나기사에게는 이런 억지가 잘 통하는군요."
10046030-121 = "어떻습니까, 선생님. 제 미카 흉내, 괜찮지 않았습니까?"
10046030-122 = "[s3] \"방금 그게, 미카 흉내였다고?\"\n[s4] \"비슷…… 했나?\""
10046030-127 = "어머, 미묘한 반응이네요. 제 딴에는 나름 야심작이었는데요."
10046030-128 = "뭐, 좋습니다. 다음 기회에 만회해 보이죠. 아직 나기사 흉내가 남아 있으니까요."
10046030-129 = "선생님. 어쩌면 오늘, 아니, 틀림없이 무언가 아주 특별한 것을 보실 겁니다."
10046030-130 = "굳이 말하자면…… 이것은 일종의 프리퀄."
10046030-134 = "<공주의 호박 마차를 끌어준 생쥐는 어디서 왔을까?>"
10046030-135 = "네, 이것은 그런 이야기입니다."
10046030-139 = "……아아. 나쁜 버릇이 나왔군요. 그리 복잡한 이야기는 아닙니다."
10046030-145 = "간단히 말하자면……."
10046030-146 = "그건 바로……."
10046030-151 = "아니, 이 얘기는 관두도록 하죠."
10046030-152 = "[s5] \"구, 궁금해!\"\n[s6] \"속였구나, 세이아!\""
10046030-155 = "후후, 스포일러는 좋지 않으니까요."
10046030-156 = "뭐든지 미리 안다면, 그것만큼 따분한 것도 없는 법이죠."
10046030-157 = "……아아, 딱히 심각한 이야기를 할 셈은 아니었는데요."
10046030-158 = "이런 흔한 구절도, 제가 말하면 뼈가 실리는군요. 물론, 이 말을 들은 선생님이 난처해할 것도 예상한 바입니다만."
10046030-159 = "꼭 눈으로 보고 싶어 하는 것만큼은, 고쳐지지 않는 나쁜 습관이군요."
10046030-163 = "……그 시선의 의미는 뭘까요?"
10046030-164 = "실은 고칠 생각 따위는 조금도 하지 않으면서, 그런 생각을 하고 계실까요?"
10046030-165 = "후후, 당연하지 않나요?"
10046030-166 = "'그 나쁜 습관' 하나하나가 모여, 현재의 저를 만들고 있으니까요."
10046030-167 = "어쩌면 고친다는 표현 자체가 어불성설일 테죠. 이건 그보다 기저에서 일어나는, 근본적인 차원에서의 변화일 테니까요."
10046030-168 = "하지만, 오늘은 역시 자중할까요."
10046030-169 = "그 자기중심적이고, 근시안적인 말괄량이 아가씨가 고심 끝에 만들어낸 하루니까요."
10046030-170 = "어디까지나 같은 티파티 임원으로서……."
10046030-171 = "아니, 친구로서, 성심성의껏 임하지 않으면 실례겠죠."
10046030-176 = "(우당탕탕-!)"
10046030-180 = "뭐죠? 지금 소리는?"
10046030-181 = "해변 쪽에서, 굳이 표현하자면, 무슨 공사장 같은 소리가……."
10046030-182 = "[s7] \"앗, 그러고 보니……!\"\n[s8] (해변에는 압수한 온천개발부의 자재가 그대로!)"
10046030-191 = "……음."
10046030-192 = "뭐죠, 이건?"
10046030-193 = "저희 프라이빗 비치에 이런 게 있었던가요?"
10046030-197 = "나, 나기 쨩?!"
10046030-198 = "저, 전부 설명할 수 있으니까!"
10046030-199 = "아니요, 됐습니다."
10046030-203 = "(어쩌지, 어쩌지…….)"
10046030-204 = "(역시 수상하게 여기는 거야!)"
10046030-205 = "(그러면, 나기 쨩이라면 틀림없이…….)"
10046030-212 = "어떤 위험 변수가 있는지 모르는 공간에서 바캉스를 즐길 수는 없는 법이죠."
10046030-213 = "좀 더 안전한 장소를 물색하도록 하죠."
10046030-214 = "그래요. 예를 들어, 세이프티 하우스는 어떤가요?"
10046030-218 = "그, 그러면 오늘 바캉스는……?"
10046030-222 = "물론, 취소입니다."
10046030-228 = "안돼애애애앳~~~~!!!!"
10046030-232 = "까, 깜짝이야. 미카, 갑자기 무슨 일인가요?"
10046030-236 = "아, 아니! 나기 쨩, 이건 말이지!"
10046030-237 = "네, 얼추 짐작은 갑니다. 정말 곤란한 일이군요."
10046030-238 = "내가 설명할 수 있으니까!"
10046030-239 = "아까도 말했지만, 그러지 않아도 됩니다."
10046030-240 = "굳이 설명하는 것보다는, 조용히 있다가 떠나는 편이 소란을 작게 만들겠죠."
10046030-244 = "……응?"
10046030-245 = "뭐, 이렇게 되어 있을 줄은 알았습니다. 프라이빗 비치라고는 해도, 저희 대에 이르러서는 사용한 적이 없으니까요."
10046030-246 = "이제 와서 사유지라며 짐을 치우라고 해도, 인근 주민들 입장에서는 외지인이 쓰지도 않는 토지로 괜한 소란을 일으키는 것이겠죠."
10046030-247 = "……그렇다 해도, 이 양은 조금 놀랐습니다만. 어디서 공사라도 하는 걸까요?"
10046030-248 = "어…… 어?"
10046030-249 = "아~ 아참! 그러고 보니~ 오늘 아침에, 공사 관계자가 찾아왔거든! 양해를 구한다든가~?"
10046030-250 = "미리 말하려 했는데, 완전 깜빡했지 뭐야★"
10046030-254 = "네? 아무리 그래도 잊을 일이 따로 있죠."
10046030-255 = "미안, 미안~ 준비로 너무 바빴어서~"
10046030-259 = "그보다 빨리 점심 먹자! 나 배고파! 빨리, 빨리!"
10046030-264 = "하여튼, 미카 당신이라는 사람은."
10046030-272 = "…………."
10046030-273 = "어떻게, 잘 넘어간 걸까……?"
10046030-278 = "미카."
10046030-282 = "세이아 쨩! 보고 있었어?"
10046030-283 = "네, 재밌어 보여서. 연기 실력이 제법이더군요."
10046030-287 = "역시, 트리니티를 속여넘긴 여자답다고 할까."
10046030-288 = "세이아 쨩?! 그거 얘기하기 있어?!"
10046030-289 = "후후, 미안합니다. 안절부절못하는 당신을 보고 있으니, 왠지 놀리고 싶어져서요."
10046030-290 = "그나저나 오늘 나기사는…… 역시 그렇군요."
10046030-291 = "예상보다 살짝 이른 감이 있지만, 근래 나기사는 원체 다망했으니 이해는 갑니다."
10046030-292 = "[s9] \"그보다 역시, 라니?\"\n[s10] \"나기사가 저렇게 반응할 줄 알았어?\""
10046030-297 = "아, 여기 한 사람, 안절부절못하는 사람이 더 있었죠."
10046030-298 = "말해줘도 저는 상관없습니다만."
10046030-302 = "…………."
10046030-303 = "역시 스포일러는 좋지 않네요."
10046030-304 = "뭐야, 그 엄청나게 높은 사람 말투?"
10046030-305 = "저희는 실제로도 꽤 높은 사람이에요. 물론, 한 철딱서니 없는 아가씨 덕에 싸잡혀 점점 낮아지는 기분도 듭니다만."
10046030-306 = "짜, 짜증 나!!"
10046030-307 = "휴우…… 내가 참아야지."
10046030-308 = "오?"
10046030-309 = "애초에 계획이 순조롭게 진행되고 있으니까, 딱히 흥분할 이유는 없네요!"
10046030-310 = "점심은 바비큐니까, 재료가 도착하면 굽기만 하면 되고, 나머지 준비는……."
10046030-314 = "……? 어라, 지금 몇 시지?"
10046030-319 = "12시 40분?"
10046030-320 = "어라, 이상하다. 일정상 식자재는 12시 반에 도착하기로 되어 있는데."
10046030-321 = "으음~…… 뭐랄까, 불길한 느낌이……."
10046030-325 = "아, 아니, 괜찮아!"
10046030-326 = "무사할 거야. 설마 오늘 딱 무슨 일이 터지기라도 하려고?"
10046030-335 = "1시…… 돼 버렸다……."
10046030-336 = "미안, 선생님. 잠깐 통화 좀 할게."
10046030-344 = "아! 응, 저기 있잖아~ 오늘 바비큐 말인데."
10046030-352 = "응? 응?"
10046030-353 = "잠깐, 잠깐만. 너무 이야기가 생략돼서 무슨 말인지 전혀 모르겠거든?"
10046030-354 = "'식자재 트럭이 습격당해서, 추격 중'…… 이라고 해도 말이지."
10046030-355 = "미안한데, 조금만 더 자세히 설명해 줄래?"
10046030-360 = "응. 응."
10046030-361 = "그러니까…… 바비큐를 실은 트럭이 하이재킹을 당했고, 지금 실종 상태라고?"
10046030-365 = "어떻게 그래?!"
10046030-366 = "아니, 아니! 현금이나 귀금속을 운송하던 것도 아니잖아!"
10046030-367 = "물론, 최대한 좋은 물건을 구하긴 했지만, 그래도 바비큐 재료라고?"
10046030-371 = "저기, 미카? 큰 소리가 들렸는데, 무슨 문제 있나요?"
10046030-375 = "아, 아무것도 아니야! 나기 쨩은 쉬고 있어!"
10046030-376 = "아…… 뭔가 문제 있습니까? 아무래도 늦으시길래, 하스미 선배께서 보고 오라고."
10046030-377 = "이, 이치카 쨩?!"
10046030-378 = "그게…… 좀 스스로 말하기에도 이상한 상황이기는 한데……."
10046030-383 = "음…… 고급 바비큐 재료를 노리고, 트럭을 습격할 만한 집단이라……."
10046030-384 = "당장 제 머릿속에만 대여섯 개는 떠오르네요……."
10046030-385 = "진짜로?!"
10046030-386 = "하하…… 정의실현부 일을 하다 보면, 이것저것 있으니까요."
10046030-387 = "음, 그렇지만, 확실히 곤란하네요. 관광지가 아니니 바비큐 재료처럼 준비가 필요한 것이 비치되어 있을 거 같지는 않고, 큰 시내는 꽤 떨어져 있으니……."
10046030-388 = "물론, 바비큐용으로 준비한 빵과 소시지가 있으니까, 끼니 정도는 어찌저찌 때울 수 있을 거 같은데요."
