[translation]
1001406-1 = "주군과 함께 있는 지금을."
1001406-3 = "[ns1] \"그래서 그 탐구하기 위한 수행이라는 거.\"\n[ns2] \"정확히 뭘 하려는 거야?\""
1001406-6 = "우선 닌자란 무엇인가."
1001406-7 = "그것에 대해 집중적으로 탐구하려고 합니다. 주군!"
1001406-8 = "시대극도 물론 훌륭한 자료지만……."
1001406-9 = "영상만으로는 알 수 없는 게 분명 있을 거라고, 이즈나는 생각했어요!"
1001406-10 = "[s3] \"맞는 말이야.\"\n[s4] \"자료는 다양하면 할수록 좋지.\""
1001406-11 = "그러니 어디서 닌자에 대해 조사할 수 있을까."
1001406-12 = "그러니 어디서 닌자에 대해 조사할 수 있을까."
1001406-13 = "철저한 사전조사를 거쳐서, 그 리스트를 뽑아왔습니다!"
1001406-14 = "주군은 함께 해주시기만 하면 되어요!"
1001406-15 = "[s] \"좋아, 그럼 믿고 가볼까.\""
1001406-16 = "네!"
1001406-19 = "[ns5] \"여긴……. 디저트 카페잖아?\"\n[ns6] \"여기에서 닌자에 대해 알 수 있다고?\""
1001406-20 = "네, 주군! 여기 보세요. 여기."
1001406-21 = "네, 주군! 여기 보세요. 여기."
1001406-23 = "(이즈나가 보여준 메뉴표에는 당당히 이렇게 적혀 있었다.)"
1001406-24 = "(시바견왕왕 시대극 시리즈 콜라보 이벤트 '77종의 닌자 스위트 축제')"
1001406-25 = "[s] \"콜……라보?\""
1001406-26 = "네! 콜라보예요! 그것도 시바견왕왕 감독의 대표작과……!"
1001406-28 = "주군! 주군은 어떤 걸로 하시겠어요?"
1001406-29 = "이즈나가 개인적으로 추천하는 건 방랑하는 파르페지만……"
1001406-30 = "아! 이 고독한 크레이프랑 수리검 쿠키도 괜찮을 거 같아요!"
1001406-31 = "앗?! 여기, 메뉴를 4가지 이상 시키면 영화의 명장면을 담은 색지도 준대요!"
1001406-32 = "[s] \"으, 응?\""
1001406-33 = "얼른 시키죠! 주군!"
1001406-35 = "(이즈나와 같이 4종의 메뉴를 클리어하고 콜라보 특전을 받았다…….)"
1001406-38 = "[ns] \"디저트 다음엔, 라멘 가게야?!\""
1001406-39 = "아, 이즈나가 말씀 안 드렸었나요?"
1001406-40 = "여기도 마찬가지로 콜라보 상품으로 닌자 라멘을 판매하고 있거든요!"
1001406-41 = "[s] \"닌-자!\""
1001406-42 = "주군! 같이 닌자에 대해 알아보도록 하죠!"
1001406-43 = "아, 여기 책자에 쓰여 있기를."
1001406-44 = "닌자들은 보통 라멘을 먹을 때, 돈코츠를 베이스로"
1001406-45 = "가는 면, 마늘 많이, 차슈 추가로 먹은 모양이에요."
1001406-46 = "그럼 이즈나도 같은 메뉴로 도전하겠습니다!"
1001406-47 = "[s] \"으, 응……?\""
1001406-50 = "후루룩~!"
1001406-52 = "(그 뒤로도 이즈나에게 이끌려, 이곳 저곳의 닌자 컨텐츠들을 격파해나가기 시작했다.)"
1001406-53 = "(닌자 타코야키, 닌자 라무네, 닌자 농구공 던지기 게임 등등…….)"
1001406-55 = "으응~! 오늘, 주군과 닌자에 대해 잔뜩 배우게 되네요!"
1001406-56 = "[s] \"근데 이거…… 슬슬 닌자에 대한 탐구라기보다는…….\""
1001406-57 = "앗, 주군! 저기 보세요!"
1001406-58 = "닌자를 체험할 수 있는 보트가 있대요!"
1001406-59 = "[s] \"그냥 평범한 보트…… 아냐?\""
1001406-62 = "(이즈나는 보트 선착장 옆에 세워진 표지판을 들여다보기 시작했다.)"
1001406-63 = "오호, 오호……."
1001406-64 = "과연……. 닌자들은 근력을 단련하기 위해 보트에 앉아 노젓기를……."
1001406-66 = "주군!"
1001406-67 = "[s7] \"그래그래…….\"\n[s8] \"같이 타자는 거지?\""
1001406-68 = "제 마음을 꿰뚫어 보시다니……!"
1001406-69 = "제 마음을 꿰뚫어 보시다니……!"
1001406-70 = "역시 주군은……. 닌자 초능력자?"
1001406-71 = "[s] \"그건 닌자야, 초능력자야?!\""
1001406-72 = "에헤헷! 자, 주군!"
1001406-73 = "타러 가요!"
1001406-78 = "― 앗, [wa:1000]주군, [wa:500]주군! [wa:1000]지금 거 보셨나요?!"
1001406-80 = "― 잉어가 [wa:500]폴짝! [wa:500]하고 뛰어올랐어요!"
1001406-83 = "[ns] \"이즈나, 진정해. 배가 흔들리잖아.\""
1001406-84 = "― 앗, [wa:500]그러네요. [wa:1300]이즈나, 진정하자……. [wa:1100]진정…….[wa:1000]"
1001406-86 = "― 에헷, [wa:1000]에헤헤헷."
1001406-89 = "[ns] \"뭔가, 이즈나 엄청 즐거워 보이네.\""
1001406-90 = "[wa:500]― 네! [wa:500]즐거워요! [wa:1500]이렇게나 즐거운 건 역시…."
1001406-92 = "― 역시 제일로 좋아하는 주군과 [wa:1500]함께라서 [wa:1200]일까요?[wa:300]"
1001406-95 = "[wa:800]― 오늘 같은 날은 [wa:1200]이즈나에게 [wa:1000]잊지 못할 평생의 추억이 될 거예요.[wa:500]"
1001406-98 = "[ns9] \"오늘만이 아니야.\"\n[ns10] \"수행이라면 앞으로도 얼마든지 어울려줄 테니까.\""
1001406-101 = "[wa:2000]― 네에, [wa:500]주군! [wa:1000]비록 불초한 몸이지만……!"
1001406-103 = "― 앞으로 이즈나를 [wa:1100]잘 부탁드립니다. 주군. [wa:1700]에헤헷!"
1001406-106 = "(한동안 배를 저으며 이즈나와 함께 조용한 시간을 보냈다.)"
