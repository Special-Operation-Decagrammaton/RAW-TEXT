[translation]
1001402-1 = "그래서 이즈나는 미행한다."
1001402-2 = "(마침 사야할 물건이 있어 거리로 나와 걷고 있을 때였다.)"
1001402-4 = "샤샥-"
1001402-6 = "[ns] \"……응?\""
1001402-9 = "샤샤샥-"
1001402-11 = "(툭.)"
1001402-12 = "어, 어어어?!"
1001402-15 = "아야야……."
1001402-16 = "헉……! 다, 다시!"
1001402-17 = "샤샤샥-!"
1001402-19 = "[ns] \"으음…….\""
1001402-21 = "샤샤샤샤-!"
1001402-22 = "야오옹?"
1001402-24 = "쉬, 쉿! 고양이공! 쉬잇이에요!"
1001402-25 = "절 보고 울면 들킨다구요……!"
1001402-26 = "핫, 혹시 고양이라 말이 통하지 않는 걸까요?"
1001402-27 = "그럼 닌자들이 동물과 소통할 때 쓰는 동물회화를 시도하면……!"
1001402-30 = "냐, 냐오옹?"
1001402-32 = "야옹?"
1001402-33 = "통하지 않는다앗?!"
1001402-34 = "에, 에잇! 어쩔 수 없죠."
1001402-35 = "이즈나 긴급회피의 술!"
1001402-41 = "후우……. 이러면 안 들켰겠죠?"
1001402-42 = "[s] \"…….\""
1001402-44 = "[s1] 핸드폰을 꺼내들어\n[s2] 이즈나의 번호를 눌렀다."
1001402-46 = "(띠리링~♪)"
1001402-48 = "(띠리링~♪)"
1001402-49 = "우왓, 앗! 핸드폰이!"
1001402-50 = "어, 어떻게 끄지? 으앗?!"
1001402-52 = "이걸, 이렇게 해서, 이렇게……!"
1001402-54 = "(뚝)"
1001402-55 = "휴우, 무사히 넘겼다."
1001402-56 = "[s3] \"무사히 못 넘겼거든?\"\n[s4] \"진작에 전부 들켰어.\""
1001402-57 = "주, 주군?!"
1001402-58 = "주, 주군?!"
1001402-59 = "어떻게……! 절 눈치 채신 건가요?!"
1001402-60 = "[s] \"어떻게고 자시고 그 정도로 요란하면 누구라도…….\""
1001402-61 = "이즈나의 숙련된 미행술을 알아차리시다니,"
1001402-62 = "설마……."
1001402-63 = "[s] \"……설마?\""
1001402-64 = "주군은……."
1001402-66 = "또 다른 닌자의 후예……? (꿀꺽)"
1001402-67 = "[s5] \"그래! 내가 바로 햄토리 햄쥐의 후예다!\"\n[s6] \"……가 아니라, 그럴 리 없지……!\""
1001402-68 = "아……. 아니신 건가요."
1001402-69 = "아……. 아니신 건가요."
1001402-70 = "아쉬워라……."
1001402-71 = "[s] \"아쉬운 거구나.\""
1001402-72 = "뭐어, 대신에 이즈나가 완벽한 닌자니까."
1001402-73 = "주군이 닌자가 아니어도 괜찮지만요!"
1001402-74 = "[s] \"바로 회복했네…….\""
1001402-76 = "[ns7] \"애당초 미행하려면 좀 더 얌전히 했어야지.\"\n[ns8] \"발걸음에 주의하고, 타인의 시선을 의식하고.\"\n[ns9] \"무엇보다 핸드폰부터 무음으로 설정하고.\""
1001402-77 = "오옷! 과연! 음음! (활짝)"
1001402-78 = "오옷! 과연! 음음! (활짝)"
1001402-79 = "오옷! 과연! 음음! (활짝)"
1001402-80 = "주군의 말씀은 금과옥조, 도움이 됩니다!"
1001402-81 = "전부 메모해둬야겠어요!"
1001402-82 = "수첩이 어디 있더라. 으음~"
1001402-83 = "[s] \"그건 그렇고, 정작 왜 미행을 하는 거야?\""
1001402-84 = "아, 미행 말씀이신가요?"
1001402-85 = "당연히 닌자로서 주군을 호위하기 위해서죠!"
1001402-86 = "[s] \"호위……?\""
1001402-87 = "저번에, 이즈나가 고민하고 있었단 말을 했었잖아요?"
1001402-88 = "그 고민이라는 게……."
1001402-89 = "실은 주군에 대한 것이었습니다!"
1001402-90 = "[s] \"……응?\""
1001402-91 = "그때 퍼뜩 이즈나는 생각했어요."
1001402-92 = "주군처럼 대단한 분이라면……."
1001402-93 = "어디서 누가 주군을 노리고 나타날지도 모른다고!"
1001402-94 = "[s] \"아니아니, 없지. 그런 일.\""
1001402-95 = "아뇨! 주군!"
1001402-96 = "방심은 금물!"
1001402-97 = "시대극에도 자주 나온다구요!"
1001402-98 = "언제나 주군이 방심하고 부어라~ 마셔라~ 하면서……."
1001402-99 = "주지육림을 벌일 때야말로 적습의 타이밍!"
1001402-100 = "약속된 전개!"
1001402-101 = "[s10] \"저, 전개?\"\n[s11] \"그보다 주지육림을 벌인 적도 없고!\""
1001402-102 = "시대극의 클리셰예요!"
1001402-103 = "시대극의 클리셰예요!"
1001402-104 = "[s] \"크, 클리셰?\""
1001402-105 = "그러니 주군이 안심하고 무사히 업무를 보실 수 있도록."
1001402-106 = "이즈나가 할 수 있는 게 무엇인가."
1001402-107 = "고민하고 고민한 끝에 내놓은 결론이 바로!"
1001402-108 = "아침부터 주군의 일거수일투족을 감시하면서 호위하는 것이었습니다!"
1001402-109 = "[s] \"그걸 위해 미행을 했다. 이거지…….\""
1001402-110 = "에헤헷!"
1001402-111 = "네!"
1001402-112 = "몰래 호위예요!"
1001402-113 = "[s] \"하지만 이즈나. 그건 좀 곤란한데.\""
1001402-114 = "곤란……요?"
1001402-115 = "[s] \"아무리 그래도 멋대로 미행하다니.\""
1001402-116 = "네, 네엣?!"
1001402-117 = "하, 하지만! 이즈나는 어디까지나 주군을 위해……!"
1001402-118 = "[s] \"자칫하면 다른 사람에게 민폐가 될 수도 있다고?\""
1001402-119 = "으, 으아앙?!"
1001402-120 = "[s] \"사람에 따라, 숨기고 싶은 비밀이 있을지도 모르잖아?\""
1001402-121 = "우, 우으……."
1001402-122 = "죄, 죄송합니다……. 주군……."
1001402-123 = "[s] \"화난 건 아니야. 다음엔 미리 물어봐 줘.\""
1001402-124 = "(꼬르르르르륵.)"
1001402-125 = "아……."
1001402-126 = "아침부터 아무것도 못 먹었더니 힘이……."
1001402-127 = "[s] \"정말……. 어쩔 수 없지. 밥이라도 먹으러 갈래?\""
1001402-128 = "바, 밥이요?"
1001402-129 = "[s12] \"이즈나만 괜찮다면.\"\n[s13] \"싫다면 어쩔 수 없지만.\""
1001402-132 = "아뇨! 가요! 주군!"
1001402-133 = "물론! 밥을 먹으러 가는 길은 저 이즈나에게만 맡겨주세요!"
1001402-134 = "뒤에서 남몰래 미행을 하는 게 아니라."
1001402-135 = "닌자로서, 주군의 앞에서 완벽한 호위를 보여드릴 테니까요!"
1001402-136 = "[s] \"그래그래.\""
1001402-137 = "에헤헷!"
1001402-139 = "닌닌!"
1001402-141 = "(그렇게 이즈나의 요란스러운 호위를 받으며, 우리는 식당으로 향했다.)"
