[translation]
10002180-1 = "후일담;Pride of sniper"
10002180-2 = "(그렇게 다 같이 수박을 먹고 있을 때였다.)"
10002180-3 = "이 수박, 시원하네요!"
10002180-4 = "네, 모래가 묻은 게 좀 흠이지만, 달고 시원해서 맛있습니다."
10002180-5 = "전부……. 자업자득이란 기분이지만……."
10002180-6 = "아즈사 쨩은 어떤가요?"
10002180-7 = "수분 보급엔 최적이야. 다만 이런 섭취 방법으로는 지나치게 다량의 수분을 섭취하게 된다는 점이 디메리트네."
10002180-8 = "불시의 이뇨작용을 어떻게 대처할지, 진지하게 해결법을 강구해야……."
10002180-9 = "아, 아우우!"
10002180-10 = "그, 그런 이야기는 금지! 다, 다른 사람도 있고 무엇보다 서, 선생님도 계시니까요오~!"
10002180-15 = "수, 수수수수박, 서, 선생님 바로 곁에 앉아서. 수, 수수박을 수, 수박수박하고 우물우물,"
10002180-16 = "으, 으헤헤히흐흣……."
10002180-17 = "우물우물우물. 푸하. 맛있당!"
10002180-18 = "수박은 굉장해! 소금을 뿌려 먹어도 맛있고, 의외로 설탕을 뿌려 먹는 것도 맛있으니까!"
10002180-19 = "음……. 그럼 와사비도 어울리지 않을까?!"
10002180-21 = "네, 네에?! 와, 와사비요?!"
10002180-22 = "(후아아아……. 그래도 다행이다아. 모두 수박을 먹느라, 아까 전의 소동은……. 이대로 끝나는 모양이에요…….)"
10002180-24 = "그럼 모두 다 같이 수박도 다 먹었고, 다음 리스트로 가볼까요?"
10002180-25 = "아직 하스미 씨가 건네 준 리스트에서 저희가 해야할 일이……."
10002180-26 = "아, 근데 말이야. 나 궁금한 게 있는데."
10002180-27 = "네, 뭔가요? 이즈미 씨?"
10002180-28 = "결국 아까 전에 하던 그 수박 쏘기는, 누가 이긴 거야?"
10002180-29 = "……네?"
10002180-30 = "주, 중단시킨 이즈미 씨가 그 얘길 하는 거예요?! 그보다 그 화제를 다시 꺼내면 안 돼요!"
10002180-36 = "하긴……. 결판이 나진 않았었지."
10002180-37 = "과연, 그냥 넘어갈 뻔한 걸 딱 지적해주셨군요. 이대로 어영부영 끝내기엔, 정의실현부로서 이름이 울 겁니다!"
10002180-38 = "마찬가지야. 명확한 결론 없이 전장에서 물러나는 건, 우리 보충수업부의 이름에 먹칠을 하는 행동이겠지."
10002180-40 = "아즈사 쨩?! 보충수업부의 이름에 그 정도의 무게는 없다고 생각하는데요?!"
10002180-41 = "흐음. 승부를 다시 내고 싶어도 수박은 이미 쓸 수 없게 되었고……."
10002180-42 = "그럼 지금부터 승부는, 수박이 아닌 다른 것으로 내도록 하죠!"
10002180-43 = "예를 들어, 저 야자수의 열매는 어떤가요?!"
10002180-44 = "아니면 저기 멀리 해변 바위에 놓여 있는 조약돌이라면?"
10002180-45 = "바다에 떠다니는 부표를 맞추는 것도 자신 있습니다!"
10002180-46 = "자, 잠깐만요!"
10002180-47 = "둘 다 일단 진정하고……. 여기서 승부를 내는 건, 무익하달까. 하스미 씨가 건네준 리스트와 관계없는 일이니까!"
10002180-48 = "[s] \"히후미, 이 정도는 건전한 스포츠니까 괜찮지 않을까?\""
10002180-50 = "서, 선생님?! 선생님까지 그런 말씀을 하시면 어떡해요!"
10002180-51 = "아, 마침 여기에 선생님이 해변에서 구매했던 1/7 스케일? 피규어? 라는 게 있다."
10002180-52 = "이게 딱 좋은 표적이 되어줄 것 같아. 선생님, 잠시 빌리겠어."
10002180-53 = "[s] \"아, 안 돼! 이 무익한 싸움은 이제 그만 둬!\""
10002180-58 = "(우당탕, 와장창. 와지끈!)"
10002180-62 = "결국 이렇게 되어버리는 거냐구요! 우와아앙!!"
10002180-68 = "우물우물……"
10002180-69 = "으음!"
10002180-70 = "응응! 역시 수박에 와사비도 잘 어울리네!!"
