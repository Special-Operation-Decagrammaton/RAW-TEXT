[translation]
1005806-1 = "구호가 필요한 자리"
1005806-6 = "(미네의 도움을 받아 행정 업무를 빠르게 처리했다.)"
1005806-7 = "이걸로 오늘의 작업은 끝인 것 같군요."
1005806-8 = "[s] \"미네는 서류 작업에도 능숙하구나……\""
1005806-9 = "과찬이십니다."
1005806-10 = "한 단체의 책임자라는 것을 하다 보면, 이런저런 일에도 능숙해질 수밖에 없는 법이니까요."
1005806-11 = "뜻하지 않게 얻게 된…… 하나의 스킬 같은 것이라고나 할까요."
1005806-12 = "[s] \"그래도 미네의 '구호' 덕분에 많이 도움이 됐어.\""
1005806-16 = "……!"
1005806-17 = "그렇군요. 이것도 어떤 의미에서는 구호의 일환……!"
1005806-18 = "감사합니다. 선생님. 많은 배움이 되었습니다."
1005806-19 = "[s] (그렇게 진지하게 받아 줄 말이었던가……?)"
1005806-23 = "전화가……?"
1005806-24 = "[s] \"어서 받아 봐.\""
1005806-25 = "예, 선생님."
1005806-30 = "여보세요. 구호기사단입니다. 구호가 필요하십니까?"
1005806-36 = "사, 살려주세요……! 길을 잃었어요……"
1005806-37 = "숲에서…… <키보토스의 수해>에서요!"
1005806-38 = "네? <키보토스의 수해>에서요?"
1005806-39 = "조금 더 자세히 상황을 설명해 주실 수 있겠습니까?"
1005806-40 = "모르겠어요!"
1005806-41 = "주위가 너무 어둡고, 나무들이 다 똑같이 생겨서……"
1005806-45 = "……고, ……데다……"
1005806-50 = "여보세요? 여보세요??"
1005806-54 = "전화가 끊겼군요……"
1005806-58 = "선생님. 한시도 지체할 수 없게 되었습니다."
1005806-59 = "[s] \"무, 무슨 일이 일어나고 있는 거야?\""
1005806-60 = "<키보토스의 수해>에서 누군가가 구호를 요청하고 있습니다!"
1005806-61 = "저는 지금부터 <키보토스의 수해>로 향할 겁니다!"
1005806-62 = "[s] \"<키보토스의 수해>……?\""
1005806-63 = "아, 모르고 계십니까?"
1005806-64 = "<키보토스의 수해>란 키보토스에서도 이름난 울창한 숲으로……"
1005806-65 = "이상하게도 그 숲에만 들어가면 GPS가 작동하지 않는다거나, 나침반이 제멋대로 빙글빙글 돈다거나 하여."
1005806-66 = "한번 길을 잃으면 나올 수 없게 되어버린다는 무서운 숲입니다."
1005806-67 = "[s] \"그런 곳은 출입 금지 지역으로 지정해야 하지 않을까?!\""
1005806-68 = "이미 그에 준하는 조치가 취해져 있기는 합니다만……"
1005806-69 = "선생님도 아시다시피, 하지 말라고 하면 꼭 하는 자들이 생겨나기 마련이죠."
1005806-70 = "담력 시험이라거나 SNS 영상, 또는 순수한 호기심에서 <키보토스의 수해>를 찾는 사람들이 잊을 만하면 생겨나곤 합니다."
1005806-71 = "지금 저에게 들어온 신고도, 아마 그런 사람들 중의 한 부류겠지요."
1005806-72 = "아무튼, 오늘은 감사했습니다!"
1005806-73 = "그러면 저는 이만!"
1005806-83 = "[ns] \"잠깐 기다려 봐!\""
1005806-97 = "그렇다고는 해도 선생님마저 <키보토스의 수해>에 오실 필요는 없었을 텐데요……"
1005806-98 = "[s1] \"아무리 신고가 있었다 해도 말이지……\"\n[s2] \"미네는 내 학생이니까, 혼자서 그렇게 위험한 곳에 보낼 수는 없어……\""
1005806-101 = "저도, 선생님의……?"
1005806-102 = "후후, 그렇군요. 저 자신의 처지를 잊고 있었습니다."
1005806-103 = "그러면 선생님도 구호기사단의 '구호'를, 지금 이 순간만큼은 함께 한다는 뜻으로 받아들이겠습니다."
1005806-104 = "아뇨, 차라리 선생님을 지금 이 순간만이지만 구호기사단의 명예 고문으로 위촉하는 것이 어떨까요?"
1005806-105 = "[s] \"그 고문직 이야기…… 잊지 않고 있었구나.\""
1005806-106 = "당연합니다."
1005806-107 = "누차 말씀드리지만, 선생님께서는 훌륭한 '구호'의 정신과 재능을 갖고 계십니다."
1005806-111 = "그러면 선생님, 출발할까요."
1005806-112 = "사실 <키보토스의 수해>에 직접 발을 디디는 것은 저 역시 처음인 몸이라."
1005806-113 = "제법 긴장이 되는군요."
1005806-114 = "[s] \"미네는 그런 거 안 할 줄 알았는데.\""
1005806-115 = "……저 역시 선생님의 학생이라고 말씀하시지 않았나요?"
1005806-116 = "후후, 해본 말이에요. 그렇게까지 당황하지 않으셔도 됩니다."
1005806-117 = "그러면, 가겠습니다. 구호기사단 출동합니다!"
1005806-122 = "조심하세요, 선생님! 덩굴입니다"
1005806-127 = "이걸로 발길을 막는 장애물은 사라졌습니다."
1005806-128 = "네? 가능한 한 자원을 아끼는 편이 좋을 것 같다고요?"
1005806-132 = "그 말씀도 일리가 있습니다."
1005806-136 = "조금 더 발밑을 주의하면서 나아가도록 하죠."
1005806-139 = "제법 깊이 들어온 것 같습니다만, 사람의 흔적은 없군요."
1005806-140 = "걱정됩니다. 저희에게 구호를 요청한 그 학생들도, 이런 심정을 느끼고 있겠지요."
1005806-147 = "선생님은 괜찮으신가요?"
1005806-151 = "그나마 숲이 울창해서, 더울 일은 없는 것이 다행이군요."
1005806-155 = "시간이 상당히 지나 버린 것 같습니다……"
1005806-156 = "GPS가 작동하지 않는다던가 하는 것은 역시 부풀려진 소문이었던 모양이네요."
1005806-160 = "그 대신 핸드폰 배터리가……"
1005806-161 = "이건 저의 실책이군요. 예비 배터리를 넉넉히 준비했어야 했는데."
1005806-162 = "너무 갑작스러운 출동이었으니 어쩔 수 없었다고요? 후후, 그렇게 생각해 주신다면 감사합니다."
1005806-164 = "(결국 밤이 될 때까지 <키보토스의 수해>에서는 어떤 흔적이나 단서도 찾아내지 못했다……)"
1005806-166 = "……."
1005806-167 = "밤이 되고 말았군요."
1005806-168 = "죄송합니다, 선생님. 저는…… 이런 상황이 되면 좀처럼 앞뒤 구분을 잘 못하는 모양입니다."
1005806-169 = "저 자신의 고집 때문에 선생님에게까지 이런 폐를 끼쳐 드리고 말았군요."
1005806-170 = "[s3] \"그런 건 괜찮아.\"\n[s4] \"사람을 도우려고 했던 거잖아?\""
1005806-176 = "……감사합니다. 그렇게 생각해 주셔서."
1005806-181 = "저기, 자연적으로 생긴 듯한 공터가 보이는군요."
1005806-182 = "저곳에서 휴식하지 않으시겠습니까? 저희 둘 다 기력을 다 쓴 듯하군요."
1005806-189 = "선생님은 여기, 나무 그루터기 위에 앉으시면 될 것 같습니다."
1005806-190 = "더러운 것들은 대강 치워 두었으니, 잠시 방제 작업을 하겠습니다."
1005806-195 = "[wa:400]― 선생님, [wa:1300]괜찮으십니까?"
1005806-197 = "― 다친 곳은 [wa:850]없으신가요?"
1005806-200 = "[wa:500]― 밤공기는 [wa:1700]기분이 좋네요.[wa:50]"
1005806-203 = "― 풀의 향기에, [wa:1200]강의 물소리……"
1005806-205 = "[wa:100]― 마음이 안정됩니다."
1005806-208 = "[wa:350]― ……왜 그러시죠?"
1005806-210 = "[wa:200]― 눈부시다…… [wa:1200]고요?"
1005806-213 = "[wa:50]― 후후, [wa:1800]확실히 [wa:1200]그럴지도 모르겠네요."
1005806-216 = "[wa:400]― 불안하시다면, [wa:1900]저에게 기대거나"
1005806-218 = "― 무릎을 베고 주무셔도 [wa:1400]괜찮아요."
1005806-221 = "― 걱정하실 필요 없습니다.[wa:400]"
1005806-224 = "― 설령 무슨 일이 있어도,"
1005806-226 = "― 제가 꼭 [wa:1200]선생님을 지켜 드릴테니까요"
1005806-229 = "(미네 덕분에, 무사히 숲에서 밤을 보낼 수 있었다.)"
1005806-235 = "간신히 숲의 입구까지 나올 수 있었습니다……"
1005806-239 = "그 대가라고 해야 할지, 배터리의 잔량은 15% 정도밖에 남지 않았습니다만."
1005806-240 = "[s] \"고생 많았어요, 미네 단장님……\""
1005806-241 = "천만에요. 저보다는 임시 고문 선생님께서 더 고생하셨죠."
1005806-242 = "후후…… 언젠가 '임시'라는 수식어를 떼어낼 수 있으면 좋겠네요."
1005806-247 = "또 다시 전화가……?"
1005806-251 = "사, 살려주세요……! 길을 잃었어요……"
1005806-252 = "숲에서…… <키보토스의 수해>에서요!"
1005806-253 = "……조금 더 자세히 상황을 설명해 주실 수 있겠습니까?"
1005806-254 = "모르겠어요!"
1005806-255 = "주위가 너무 어둡고, 나무들이 다 똑같이 생겨서……"
1005806-256 = "……이미 <키보토스의 수해>에 들어와 있습니다만, 어디십니까?"
1005806-260 = "이미 와 있다고……?!"
1005806-261 = "와, 진짜냐? 정말로 갔다고? 대박이다!"
1005806-266 = "그 구호기사단을 장난 전화로 가지고 놀 수 있다니, 이거 끝내주는데!"
1005806-267 = "분명 한참을 헤맸을 거야. 그렇지?"
1005806-268 = "그 숲에서 사람을 찾는다는 건 애초에 무리니까, 들키지도 않을 거고!"
1005806-273 = "……"
1005806-274 = "[ns] \"저기…… 미네?\""
1005806-275 = "이 분들은 세 가지 실수를 하셨군요."
1005806-276 = "하나는, 아무리 저라고 해도 같은 장난에 두 번씩 넘어가지는 않는다는 사실을 몰랐다는 것."
1005806-277 = "또 하나는, 어제와 달리 통화를 적당한 시간에 끊지 못했다는 것."
1005806-278 = "마지막으로, 좀처럼 이런 것을 사용하고 싶지는 않았습니다만,"
1005806-279 = "구호기사단의 이름을 내걸면, 위치 역추적 정도는, 특정 상황에 한해 얼마든지 할 수 있다는 것……!"
1005806-280 = "선생님."
1005806-281 = "저는 지금부터, 진정한 '구호'를, 필요한 사람들에게 전하러 가겠습니다."
1005806-282 = "누군가가 어긋난 길을 가고 있다면,"
1005806-283 = "그것을 손수 바로잡아 올바른 길을 가도록 도와주는 것 역시 구호!"
1005806-284 = "선생님도 그렇게 생각하시죠!?"
1005806-288 = "[ns5] \"어…… 적당히 해 줘……?\"\n[ns6] \"너무 과하게 하지는 말고……?\""
1005806-291 = "이해해 주셔서 감사합니다."
1005806-292 = "실례가 되겠습니다만, 먼저 자리를 비우겠습니다."
1005806-293 = "『구호가 필요한 곳에 구호를!』"
1005806-299 = "(미네는 빠른 속도로 어딘가로 사라져 갔다.)"
1005806-303 = "(……장난 전화를 건 학생들의 운명은, 미네만이 안다……)"
