[translation]
2001806-1 = "Phase Line"
2001806-2 = "(모에의 문자를 받고 코우사기 공원까지 전력으로 달려왔다.)"
2001806-4 = "……어라? 선생님?"
2001806-5 = "생각보다 금방 왔네. 그렇게 달려올 필요는 없었는데……"
2001806-6 = "[s1] \"헉, 헉…… 늦진 않은 것 같네……\"\n[s2] \"폭탄, 터지진 않았지……?\""
2001806-7 = "폭탄이라면 아직 저쪽에 정리되지 않은 채로 잔뜩 쌓여 있긴 한데……"
2001806-8 = "폭탄이라면 아직 저쪽에 정리되지 않은 채로 잔뜩 쌓여 있긴 한데……"
2001806-9 = "……뭐야, 선생님도 폭탄을 터트려보고 싶었던 거야?"
2001806-10 = "폭탄이라면 종류별로 잔뜩 있으니까 말만 하라고."
2001806-11 = "어떤 것부터 터트려 볼래? 섬광탄? 연막탄? 아니면 소이탄……?"
2001806-12 = "[s3] \"폭탄을 터트리러 온 게 아니야…….\"\n[s4] \"모에가 폭탄을 터트릴까 봐 걱정되어서 온 거야.\""
2001806-13 = "……뭐야. 내가 의심스러워서 그렇게 급하게 달려온 거야?"
2001806-14 = "……뭐야. 내가 의심스러워서 그렇게 급하게 달려온 거야?"
2001806-15 = "아무리 내가 폭탄을 터트리는 걸 좋아한다지만, 물자 정리 중에 도화선을 당길 정도로 생각 없는 사람은 아니라고."
2001806-16 = "이래 봬도 엄연한 SRT의 오퍼레이터 겸 보급 계원이니까. 모두가 사용하는 공용 비품을 생각 없이 낭비하는 헤픈 여자는 아니라고."
2001806-17 = "……뭐, 최소한 '상식적인' 한도 내에서라면 말이지."
2001806-18 = "[s] \"더 불안해지는데……\""
2001806-19 = "뭐, 어찌 되었든 선생님이 와줘서 살았어. 이 무거운 물자들을 어느 세월에 혼자 정리할지 걱정하던 참이었거든."
2001806-20 = "……선생님은 정말 학생이 곤란한 상황에 있다면 언제나 찾아와 주는구나."
2001806-21 = "새삼스러운 사실이지만, 언제나 의지가 된단 말이지."
2001806-22 = "……그럼 함께 시작해 볼까?"
2001806-28 = "요새 집속 수류탄은 따로 뇌관을 연결하지 않아도 전기 신호로 동시 폭발이 가능하게 설계되는 모양이구나…… 신기하네."
2001806-29 = "그렇다는 말은…… 이 버튼 하나만으로도 이곳에 있는 수류탄을 모조리 폭파시킬 수 있다는 말이지……"
2001806-30 = "[s] \"잠깐, 모에. 기다려—\""
2001806-31 = "……실수로라도 작동되지 않도록 개별 포장하고 정전기 방지 장치를 설치해 둬야겠네."
2001806-32 = "응? 선생님, 왜 그래? 뭔가 할 말이라도 있어?"
2001806-33 = "[s] \"아니, 아무것도……\""
2001806-34 = "쿠후후…… 시시하기는."
2001806-35 = "그럼 계속 정리해 볼까?"
2001806-38 = "이게 신형 EMP 폭탄인가? 이렇게나 작은데, 설명서에 따르면 위력은 흉악한 모양이네."
2001806-39 = "실수로라도 이런 걸 터트렸다가는……"
2001806-40 = "후후…… 이 일대의 핸드폰과 차량이 모두 고장 나서 말 그대로 도심에 고립되고 말겠지……"
2001806-41 = "[s] \"잠깐, 그것도—\""
2001806-45 = "혹시 모를 상황을 대비해 차폐 소재로 만든 특수 금고 속에 보관해두자."
2001806-46 = "……응? 선생님, 거기에 서서 뭐 하는 거야?"
2001806-47 = "그쪽 정리가 다 끝났으면 여기 와서 나 좀 도와줘."
2001806-52 = "아아, 다 끝났다…… 생각보다 오래 걸렸네."
2001806-53 = "선생님이 도와주지 않았더라면 아직도 정리가 끝나지 않았을 거야. 도와줘서 고마워."
2001806-54 = "[s5] \"모에, 무슨 고민이라도 있어?\"\n[s6] \"상태가 평소와는 조금 다른 것 같은데…….\""
2001806-55 = "평소와 상태가 다른 것 같다고?"
2001806-56 = "평소와 상태가 다른 것 같다고?"
2001806-57 = "글쎄. 나는 평소와 다르지 않다고 생각하는데."
2001806-58 = "오늘은 위험한 버튼을 봐도 누르려 하지 않았다고?"
2001806-59 = "그건, 음……"
2001806-60 = "……더 저지르고 싶은 걸 정리하는 내내 참고 있어서 그랬던 게 아닐까."
2001806-61 = "[s] \"더 저지르고 싶은 것?\""
2001806-62 = "응. 사실 아까 전부터 계속 신경 쓰이고 있었거든."
2001806-63 = "오늘은 다른 소대원도 없고, 선생님과 둘 뿐이고……"
2001806-64 = "뭔가 자꾸 저질러버릴 것 같아서 마음속으로만 꾹꾹 누르고 있었는데……"
2001806-65 = "선생님이 말하는 바람에 떠올라 버렸어."
2001806-66 = "하아……"
2001806-72 = "[wa:700]― 선생님."
2001806-74 = "― 세상에는 [wa:1300]여러가지 금기가 있어.[wa:50]"
2001806-77 = "― 누르면 안 되는 버튼이라든가,"
2001806-79 = "― 넘어서는 안 되는 선이라든가…."
2001806-82 = "― 그 중에는 [wa:1300]한번 선택하면 돌이킬 수 없는,"
2001806-84 = "― 파멸로 이어지는 선택지도 존재하지."
2001806-87 = "[wa:700]― 한 걸음만 실수해도 끝나버리지만,"
2001806-89 = "― 그래도 [wa:900]스스로의 마음을 만족시킬 수만 [wa:1800]있다면…"
2001806-92 = "― 선생님은"
2001806-94 = "[wa:400]― 어떤 선택을 할 거야?"
2001806-97 = "[wa:400]― 무의미한 질문이라는 건 [wa:1200]나도 알아."
2001806-99 = "[wa:100]― 선생님은 성실하니까."
2001806-102 = "[wa:700]― 하지만 나는……"
2001806-104 = "― 그 선을 [wa:1800]넘어버릴지도 몰라."
2001806-107 = "― 왜냐하면 그 파멸의 순간은,"
2001806-109 = "― 나 자신을 [wa:800]증명할 수 있는 [wa:600]기회이기도 하니까."
2001806-112 = "[wa:600]― 그러니까, [wa:1800]선생님."
2001806-115 = "― 이 선을……"
2001806-117 = "― 나와 함께 [wa:1250]넘어 보지 않을래?"
2001806-120 = "하아, 하아……"
2001806-121 = "역시 안되겠어. 더는 못 참아……"
2001806-122 = "(모에가 천천히 몸을 일으켜 나에게 다가오더니……)"
2001806-123 = "(갑자기 입안에 무언가를 쑤셔 넣었다.)"
2001806-125 = "[ns7] \"……이, 이건?\"\n[ns8] \"뭔가 강렬한 단맛이……\""
2001806-126 = "후후…… 엄청나게 달콤하지?"
2001806-127 = "후후…… 엄청나게 달콤하지?"
2001806-128 = "이번에 탄약이랑 같이 주문한 초고열량의 농축 캔디야."
2001806-129 = "보통은 작전 중 엄청나게 지쳤을 때 피로 회복을 위해 먹는 회복제지만, 워낙 달콤한 지라 평소에도 가끔 먹고 싶어진단 말이지."
2001806-130 = "더욱이 이런 늦은 시간에 먹는 고열량의 음식이라면…… 먹는 그대로 체중으로 가 버리겠지……"
2001806-131 = "아아, 이 얼마나 파멸적인 죄악의 맛인지…… 그래서인지 더 달콤해……"
2001806-132 = "[s9] \"넘고 싶다고 했던 선이……\"\n[s10] \"사탕을 먹는 것이었구나……\""
2001806-133 = "뭐야, 그 표정은."
2001806-134 = "뭐야, 그 표정은."
2001806-135 = "설마 선생님…… 내가 넘고 싶다고 한 선을 다른 의미로 생각한 거야? 선생님도 정말 엉큼한 면이 있네. 쿠후후……"
2001806-136 = "뭐, 그런 종류의 파멸도 관심이 없는 건 아니지만, 그랬다가는 정말 돌이킬 수 없을 정도로 험한 꼴을 당할 테니까."
2001806-137 = "파멸을 좋아하는 나도 그 정도의 학습능력은 있다고."
2001806-139 = "……하지만 인간은 망각의 동물이라고 하잖아?"
2001806-140 = "그러니까 언젠가는 이 사실을 잊어버리고, 다시 선을 넘을지도 모르는 일이지."
2001806-141 = "그러니까 그때는 용서해 줘야 해, 선생님? 쿠후후……"
