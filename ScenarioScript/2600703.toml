[translation]
2600703-1 = "이불 속의 아야네"
2600703-2 = "(무슨 일인지 확인하기 위해 아야네가 쉬는 방을 찾아갔다.)"
2600703-9 = "(대답이 없다.)"
2600703-13 = "음…… 으음……? 세리카 쨩……."
2600703-14 = "선배들이 보낸 거야……?"
2600703-15 = "음……. 미안……. 오늘은 5분만 더 잘게……."
2600703-19 = "(………….)"
2600703-23 = "……5분만 더 잔다고 했잖아……."
2600703-24 = "세리카 쨩이 깨워도 안 나갈 거야. 오늘은 그렇게 정했어."
2600703-28 = "……오늘따라 끈질기네, 세리카 쨩."
2600703-29 = "그래도 소용없어. 오늘은 절대 밖으로 안 나갈 거니까……. 세리카 쨩이 포기해……."
2600703-33 = "[ns] \"…….\""
2600703-35 = "[ns] 문을 열고 들어간다."
2600703-42 = "(문을 열고 들어가자 깔끔한 객실 중앙의 침대 위로 '무언가'가 눈에 들어온다.)"
2600703-48 = "[ns] \"………….\""
2600703-49 = "문 열리는 소리가 들렸어……. 기어이 방 안으로 들어왔구나, 세리카 쨩."
2600703-50 = "하지만 말했듯이……. 이 이불은 누구도 뚫을 수 없다……."
2600703-51 = "난 이 안에서 모자란 잠을 보충할 거야……."
2600703-52 = "……이곳은 나의 비밀 기지……."
2600703-53 = "[s] \"………….\""
2600703-55 = "[ns] 아야네를 흔들어 본다."
2600703-59 = "오옷……. 평소보다 부드러운 것 같으면서도 더 묵직한 느낌……."
2600703-60 = "하지만 이 정도로 내 기지는 흔들리지 않아……. 더 잘 거라니까……!"
2600703-61 = "[s] 아야네를 흔들어 본다."
2600703-65 = "……저기, 세리카 쨩……."
2600703-66 = "이쯤 했으면 오늘은 그만 포기하는 게 어때……."
2600703-67 = "아무리 나라도……. 참는 데에는 한계가 있어……."
2600703-68 = "[s] 아야네를 흔들어 본다."
2600703-73 = "……."
2600703-74 = "세……리카……쨩……!!"
2600703-75 = "그만큼이나……. 그만하라고 말했는데!"
2600703-79 = "도대체가 말이야, 사람이 말을 하면 좀……!!"
2600703-82 = "……들……어야……."
2600703-86 = "……하…………?"
2600703-87 = "[s1] \"……안녕, 아야네.\"\n[s2] \"미안. 세리카가 아니었어.\""
2600703-88 = "……어라……?"
2600703-89 = "……어라……?"
2600703-90 = "어……. 음……."
2600703-91 = "아, 안녕하세요, 선생님……. 선생님께서……. 왜 여기에……."
2600703-92 = "네? ……모모톡이요?"
2600703-96 = "……아."
2600703-97 = "이게 무슨……. 자다가 실수로 누른 모양이네요……."
2600703-101 = "그……. 선생님……."
2600703-102 = "이건, 그게……. 저기……. 그러니까……."
2600703-103 = "[s3] \"……슬슬 나갈까. 다들 기다리고 있어.\"\n[s4] \"밥 다 됐으니 먹으러 가자.\""
2600703-108 = "……네."
