[translation]
10046060-1 = "제6화;악마는 언제나 묻는다"
10046060-3 = "……완전 글렀군요."
10046060-4 = "아예 지면이 움푹 꺼졌습니다. 이래서야 건물을 다시 세우는 건 고사하고, 이 해변에 머물러도 되는지도……."
10046060-9 = "……왜 이렇게 된 거야?"
10046060-10 = "왜? 하필 오늘? 우리한테만?"
10046060-11 = "미카 님……."
10046060-12 = "…………."
10046060-13 = "……괜찮아, 이건 누구의 잘못도 아닌걸."
10046060-14 = "나도 알고 있어. 그러니까, 괜찮아."
10046060-15 = "……미안해, 다들 열심히 도와줬는데."
10046060-16 = "역시 누군가를 행복하게 하는 건, 나한테는 조금 어려운 일이었나 봐."
10046060-20 = "그, 그렇지 않습니다! 이거는 정말, 말 그대로, 사고 같은 거니까요."
10046060-21 = "미카 님이 최선을 다하셨다는 건……."
10046060-22 = "고마워, 이치카 쨩."
10046060-23 = "그래도 별장이 이런 상태가 되었으니, 바캉스를 이어 나가자는 것은 무리겠지."
10046060-24 = "응…… 나기 쨩이랑, 세이아 쨩이 돌아오면 솔직하게 얘기하자."
10046060-25 = "그리고, 돌아가자. 어쩌면 너무 늦기 전에 기숙사에 도착할 수 있을지도."
10046060-31 = "……비록 건물이 무너졌어도 바캉스는……."
10046060-32 = "…………."
10046060-33 = "선생님…… 그, 평소에 잘하는 그런 거 없습니까?"
10046060-34 = "있잖습니까, 기운이 나는 말이라든지……."
10046060-35 = "[s1] \"그러고 싶은 마음은 굴뚝 같지만…….\"\n[s2] \"학생들을 위험에 노출시킬 수는 없어.\""
10046060-40 = "……말씀대로네요. 냉정하게 생각하면 그게 맞겠죠."
10046060-41 = "지반이 불안정하다면, 이 일대가 위험지대라는 뜻이니까요."
10046060-42 = "선생님 입장에서는, 아니, 경호원으로 온 저의 판단으로도 바캉스는 중단하는 게 맞습니다."
10046060-47 = "…………."
10046060-48 = "……지반만."
10046060-49 = "지반만 안전하다는 게 검증되면, 바캉스는 계속할 수 있는 거죠?"
10046060-50 = "어쩌면, 방법이 있을지도 모릅니다."
10046060-51 = "솔직히 말해서, 이 수단만큼은…… 정말 쓰고 싶지 않았는데……."
10046060-52 = "…………."
10046060-53 = "……………………."
10046060-54 = "……………………………………………………."
10046060-55 = "정말 쓰고 싶지 않은데!!!"
10046060-56 = "[s3] \"대체 무슨 방법이길래……?\"\n[s4] \"그렇게까지 싫으면 무리하지 마…….\""
10046060-59 = "아니요. 각오는 다졌습니다."
10046060-60 = "언제나 적당적당히, 흘러가는 대로 하는 저라도……."
10046060-61 = "성의를 보여야 할 때 정도는 압니다."
10046060-66 = "선생님, 부탁이 하나 있습니다."
10046060-73 = "……………."
10046060-74 = "결국, 말하자면 무너진 건물 때문에 우릴 찾아왔다는 거지?"
10046060-75 = "의뢰는 지반 조사와, ……가능하다면 별장 건물의 재건이겠고."
10046060-77 = "인정하고 싶지는 않지만, 토목 공사에서 있어서 온천개발부만큼 전문가는 없으니까요."
10046060-78 = "이야~ 인정받는 건 기쁘네~ 나도 이래저래 열심히 공부하고 있으니까~"
10046060-82 = "근데…… 뭐든지 가는 게 있으면, 오는 것도 있어야지. 그래야 세상 이치가 맞지 않겠어?"
10046060-83 = "…………."
10046060-84 = "우선, 압수당한 공사 자재부터 돌려받으실까?"
10046060-85 = "……알겠슴다. 제가 보증하겠슴다."
10046060-86 = "그래? 그러면, 우리가 개발하려 했던 해변도 좀 받으면 좋겠는데? 아직 못다 한 개발이 있어서 말이야."
10046060-87 = "……그건 제가 결정할 수 있는 게 아님다."
10046060-88 = "그래? 별로 중요한 일이 아니었나 보네? 그러면 아쉽지만, 교섭은 여기까지로~"
10046060-89 = "…………."
10046060-90 = "어라? 지금 노려보는 거야?"
10046060-91 = "…………아님다."
10046060-92 = "해변은, 어떻게든 설득해 보겠슴다. 미카 님께서도, 그쪽을 우선했을 테니까요."
10046060-96 = "이것도 된단 말이지?"
10046060-100 = "근데 어쩌지? 나는 욕심쟁이라서 말이야. 받으면 받을수록 더 받고 싶어진단 말이지?"
10046060-104 = "…………제가."
10046060-105 = "응?"
10046060-106 = "제가 할 수 있는 거라면, 뭐든지 하겠슴다."
10046060-112 = "허?"
10046060-113 = "이 친구 봐라? 대담하게 나오네?"
10046060-114 = "뭐, 좋아. 그럼 그걸로 하지. 도우면 되는 거지?"
10046060-118 = "정말임까?!"
10046060-119 = "남도 아니고, 우리 이치카 쨩이 그렇게 나오는데, 무시할 수가 있어야지 말이야~"
10046060-120 = "대신, 들어봐야겠어. 이제 진짜로 궁금해졌단 말이야."
10046060-121 = "대체 뭐 때문에 그렇게까지 하는 거야?"
10046060-122 = "답할 이유는 없슴다."
10046060-123 = "아니, 있어."
10046060-129 = "뭐든지 한다고 말했잖아?"
10046060-130 = "정의실현부한테 받아낸 <뭐든지> 치고는 아주 싸게 쳐주는 거라고. 너도 알잖아?"
10046060-131 = "그러니까, 내 마음이 바뀌기 전에, 얼버무리지 말고 솔직하게 대답해."
10046060-137 = "…………하아, 안 그래도 피하는 부분만, 이 사람 진짜 싫다."
10046060-138 = "미카 님을 돕고 싶었슴다. 그게 다임다."
10046060-139 = "어, 그래그래, 좋은 사연이야."
10046060-140 = "근데 그건 아까 들었고. 나는 대답을 듣겠다니까?"
10046060-141 = "보아하니 우리 이치카 쨩이 수줍어서 말문을 못 여는 거 같은데, 내가 먼저 말해볼까?"
10046060-142 = "알다시피 나 같은 사람은 이것저것 주워듣는 일이 많거든? 근데 이 미카라는 아가씨가 말이야~ 세상에나, 상당한 사고뭉치였다나 봐?"
10046060-143 = "………."
10046060-144 = "에이~ 웃자고 하는 얘기에 왜 그리 심각해~ 나도 딱히 트리니티의 치부를 들출 생각은 없어."
10046060-145 = "근데 뭐랄까~ 내가 보는 이치카 쨩이랑, 그 소문의 왈가닥 아가씨랑 보면은, 궁합이 참 뭐랄까~"
10046060-146 = "그렇게 충성을 바칠 만한 상대인가 싶어서 말이야."
10046060-147 = "……충성이 아님다."
10046060-148 = "호오? 그러면 친구라도 되셨나?"
10046060-149 = "……친구."
10046060-150 = "친구라…… 하."
10046060-160 = "알 거 다 아는 사람끼리 왜 그러심까?"
10046060-161 = "…………하핫! 이제 좀 말이 통하네!"
10046060-162 = "그러면 왜?"
10046060-163 = "……미카 님을 몰랐다 하면 거짓말임다. 일 때문에 몇 번 뵙기도 했고, 몇몇 사건 이후로는 좀 더 자주 이름 들었고……."
10046060-164 = "그러다 오늘 하루, 옆에서 보좌하게 되었슴다."
10046060-165 = "처음에는 생각했죠. 이 사람이 그 소문의 티파티인가, 하고."
10046060-166 = "그리고, ……계속 지켜봤슴다. 그리고 생각했죠."
10046060-171 = "…………."
10046060-172 = "나랑 달리, 이 사람은 참 반짝이는구나, 하고."
10046060-173 = "보통 친구를 위한다고, 이렇게까지 하나? 나는 할 수 있나? ……하, 당연히 못 하죠."
10046060-174 = "그 반짝임이 사라지게 두고 싶지 않았습니다. 그런 사람이 실패하는 모습을 보고 싶지 않았습니다."
10046060-175 = "그게 다임다."
10046060-180 = "…………."
10046060-181 = "그래, 그런 이유라. 참 재밌는 우연이 다 있네."
10046060-182 = "안 어울리는 거 아니까, 비꼬지 마십쇼."
10046060-186 = "비꽈? 설마~ 그냥, 내가 아는 어떤 얼간이가 생각났을 뿐이야."
10046060-187 = "…………."
10046060-188 = "좋아. 약속했으니까, 지켜야지."
10046060-192 = "정말임까?!"
10046060-193 = "뭐, 이 바닥에서는 신뢰가 다니까."
10046060-194 = "근데 말야~ 이거 참, 미안한데, 나 혼자서는 도와줄 수가 없거든?"
10046060-199 = "아니, 아니~ 사람 말은 끝까지 들어야지, 이 사람아~"
10046060-200 = "나도, 내 나름 성의를 보여야 할 때가 되었다는 거지."
10046060-208 = "크흠."
10046060-209 = "저기이~ 다들 미안한데~ 잠깐만 모여볼래?"
10046060-216 = "뭐야, 부장? 무슨 일 있어?"
10046060-217 = "탈환 작전은 야밤에 하는 거 아니었어요?"
10046060-219 = "아, 그거는 엎어졌어."
10046060-220 = "……탈환 작전?"
10046060-221 = "이야~ 내가 어쩌다 약속을 해버려서 말이지~ 건물 한 채 지을 일이 생겼거든."
10046060-222 = "미리 말하지만, 이거는 온천이랑 아무 관계도 없어. 명령 같은 것도 아니야. 하기 싫다면 안 해도 돼."
10046060-223 = "그래서…… 무더운 여름에, 굳이 땀 흘려가며 무상 봉사하고 싶은 사람, 있으려나?"
10046060-228 = "난 할래. 카스미 부장이 부탁할 정도면 뭐든 있겠지."
10046060-229 = "애초에 짓다가 실패한 온천도 한두 개가 아닌데, 건물 하나 더 짓는 정도야~"
10046060-231 = "으응~ 이야기는 어려워서 중간부터 잘 모르겠지만…… 쉽게 말하면 카스미 부장 친구를 돕는 일이지?"
10046060-232 = "그런 일이라면 얼마든지 환영이야!"
10046060-238 = "허……."
10046060-239 = "……하하, 와하하핫!! 내가 부원 복이 있다니까!"
10046060-240 = "잘됐네, 이치카 쨩?"
10046060-245 = "누……."
10046060-246 = "누가 친구임까!!!!"
