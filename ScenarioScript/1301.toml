[translation]
1301-1 = "회장 동지는 언제나 옳다 1"
1301-2 = "붉은겨울 학원 회장 집무실"
1301-3 = "흐으음……."
1301-5 = "무슨 고민이라도 있으십니까, 체리노 회장님?"
1301-6 = "……혹시 마리나 위원장은 '페로로'라는 캐릭터에 대해 들어본 일이 있는가?"
1301-7 = "페로로, 말입니까?"
1301-8 = "그러고 보니 학교의 몇몇 학생들이 그런 이름의 이상한 새 인형을 가지고 있었지요."
1301-9 = "아무리 캐릭터 굿즈라지만 침을 흘리며 날개를 퍼덕이는 꼴이 괴상해 보여 모두 압수하긴 했습니다만…… 무슨 문제라도 있으십니까?"
1301-10 = "다름이 아니라, 이 몸은 지난 주말에 키보토스의 시내에 외출을 나갔다가 그 페로로의 한정판 인형을 경매하는 광경을 보았다."
1301-11 = "정말이지. 쓸모없어 보일 정도로 커다랗고 못생긴 인형이었는데도, 다들 그 인형을 사지 못해 안달을 내고 있더군. 웃돈을 내서라도 사려고 할 정도로 말이지."
1301-12 = "밀레니엄, 게헨나의 학생들은 물론이고 트리니티의 고상한 아가씨들조차도 그 페로로라는 새 인형에 열광하고 있었어."
1301-13 = "하하! 그것참 우스꽝스러운 모습이로군요. 역시 이래서 선동과 미디어에 물든 외부의 나약한 학생들은 어쩔 수가 없다니까요."
1301-14 = "저희 붉은겨울 연방학원은 그런 형편없는 인형에 학생들이 휘둘리지 않도록 정보를 철저히 통제하고 있습니다!"
1301-15 = "음, 하지만 현명한 지도자는 바보로부터 교훈을 얻는 법."
1301-16 = "영리하고 현명한 서기장인 이 몸은 그 우스꽝스러운 광경 속에서도 붉은겨울 학원의 위상을 높일 수 있는 새로운 아이디어를 떠올린 것이다!"
1301-17 = "부디 의견을."
1301-22 = "그건 바로…… 그 페로로를 우리 붉은겨울 연방학원에 편입시키는 것이다!"
1301-28 = "…………네?"
1301-29 = "눈앞에서 바로 되묻다니. 귀가 어떻게 되기라도 한 건가, 마리나 위원장?"
1301-30 = "이 몸은 페로로를 우리 붉은겨울 연방학원에 편입시키자고 말했었네."
1301-31 = "아무리 그 새가 형편없는 모습을 하고 있다지만, 키보토스의 학생들로부터 큰 인기를 끌고 있는 것은 틀림없는 사실."
1301-32 = "그러니 페로로를 우리 학원에 편입시키면, 그 새와 같은 학교에 다니고 싶어 하는 전학생들이 키보토스 전역에서 몰려들겠지?"
1301-34 = "학원의 권력은 학생의 숫자에 비례하는 법…… 페로로로 인해 학생의 숫자가 늘어난다면 붉은겨울 학원은 트리니티와 게헨나 따위는 감히 범접할 수 없을 정도의 초거대 학원으로 거듭나게 될 것이다!"
1301-36 = "저, 하지만…… 페로로는 소수의 마니아에게만 인기가 있는 매니악한 물건인 데다……."
1301-40 = "그것참 완벽한 계획이십니다, 서기장님!"
1301-41 = "토, 토모에 비서실장?"
1301-42 = "마스코트를 활용한 홍보전략은 프로파간다의 기본! 매력적인 캐릭터를 학원에 유치한다면 이를 보기 위해 학생들이 몰려드는 건 당연한 일이지요!"
1301-43 = "그 짧은 혼란의 틈 속에서 이토록 훌륭한 계획을 세우시다니…… 대단한 판단력이십니다, 체리노 회장님!"
1301-44 = "그, 그런가?"
1301-45 = "후후, 더 칭찬해도 괜찮느니라. 이 몸은 위대한 학생회장이자, 미화부장이자, 서기장이자, 체육부장 등인…… 체리노 님이니까!"
1301-46 = "더욱이 페로로는 저희 붉은겨울 학원의 설원과 잘 어울리는 순백의 깃털을 가지고 있으니, 저희 학원의 교복을 입혀 홍보부장 역할을 맡기면 분명 잘 어울리겠지요."
1301-47 = "회장님께서 허락하신다면, 페로로에게 깃털과 잘 어울리는 커다란 하얀색 수염을 달아주는 건 어떨까요? 그럼 붉은겨울 학원의 권위가 키보토스 전역에 널리 알려질 겁니다!"
1301-48 = "음, 그것도 좋은 생각이구나! 채용이다!"
1301-49 = "저…… 그렇지만 페로로는 학생이 아니기 때문에……."
1301-52 = "마리나 위원장. 아까 전부터 불만스러운 표정으로 무슨 혼잣말을 하는 건가? 이 몸에게 특별히 할 말이라도 있는가?"
1301-53 = "그도 아니라면…… 이 몸이 모처럼 생각해 낸 위대한 계획에 불만이라도 있는 건가?"
1301-54 = "그, 그렇지 않습니다! 저도 마침 좋은 생각이라 생각하고 있었습니다!"
1301-55 = "그렇지? 이 몸의 계획에 빈틈이 있을 리가 없으니까!"
1301-56 = "남은 문제는 그 페로로에게 어떻게 전학 권유를 하는가 뿐인데……."
1301-57 = "마리나 위원장! 그대가 책임지고 페로로를 붉은겨울 학원에 편입시키도록!"
1301-58 = "네, 네에?!"
1301-59 = "어째서 그렇게 놀라는 거지? 이 몸의 위대한 계획을 직접 실행할 수 있는 명예로운 기회이거늘."
1301-60 = "성공적으로 페로로를 붉은겨울 학원에 데려온다면 그대에게 <특별 황금 수염 훈장>을 수여하겠다!"
1301-61 = "하, 하지만 페로로는 가상의 캐릭터이기 때문에 학생 명부에 실을 수 없는걸요……."
1301-62 = "무엄하다, 마리나 위원장!"
1301-63 = "이 몸이 두 눈으로 똑똑히 키보토스의 시내에서 춤추고 노래하는 페로로를 보았거늘!"
1301-64 = "아니면 붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장…… 등인 이 몸이 잘못 보기라도 했다는 말이냐?!"
1301-65 = "그, 그건 그러니까……."
1301-67 = "그렇네요. 붉은겨울 학원의 교칙에도 다음과 같이 쓰여 있으니까요."
1301-68 = "<붉은겨울 연방학원 교칙 제1조. 체리노 회장은 언제나 옳다.>"
1301-69 = "<붉은겨울 연방학원 교칙 제2조. 1조에 위배되는 발언을 한 사람은 모두 숙청에 처한다.>"
1301-70 = "설마 마리나 위원장 정도의 위치에 있는 사람이 학원의 교칙을 어기지는 않겠지요?"
1301-72 = "그, 그건 그렇습니다만……."
1301-75 = "(크, 큰일이야. 이대로 가다가는 정말로 내가 숙청되고 말겠어!)"
1301-76 = "(하지만 현실에 존재하지 않는 페로로를 학생으로 데려올 수도 없고, 이를 어쩐다…….)"
1301-77 = "(잠깐. 가상의 페로로를 현실로 데려올 수 없다면…… 현실에 있는 존재를 페로로로 만들어 버리면 되잖아?)"
1301-78 = "(후후…… 그래, 그렇게 하면 되겠어!)"
1301-81 = "맡겨만 주십시오, 회장님. 분부하신 대로 페로로를 꼭 붉은겨울 학원에 데려오도록 하겠습니다!"
1301-82 = "음, 좋아. 좋아. 그럼 이 몸은 마리나 위원장만 믿고 있겠네."
1301-83 = "하아암…… 벌써 낮잠 시간인가……"
1301-84 = "토모에…… 나 졸려……."
1301-85 = "네, 바로 이부자리를 준비하겠습니다. 이쪽으로……."
1301-90 = "페로로를 붉은겨울 연방학원에 편입시켜야 한다니……"
1301-91 = "분명 쉽지 않은 일이겠지만, 여기서 실패한다면 출세의 길은 막혀버릴 테고, 최악의 경우는 숙청될지도 모르니…… 이렇게 된 이상 나의 지위와 명예를 위해서라도 증명하는 수밖에 없어……"
1301-92 = "……체리노 회장님은 언제나 옳다는 것을!"
