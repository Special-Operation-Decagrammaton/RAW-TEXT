[translation]
1004502-1 = "숨겨진 섬의 보물"
1004502-2 = "(호시노의 말을 듣고 객실 복도로 찾아갔다.)"
1004502-7 = "(………….)"
1004502-8 = "으헤. 이거야, 이거. 이런 걸 찾고 있었지……."
1004502-12 = "(……?)"
1004502-13 = "음음. 훌륭하네. 꽤 좋은 센스를 가지고 있는걸……?"
1004502-14 = "[s1] \"……호시노?\"\n[s2] 소리가 난 쪽으로 찾아간다."
1004502-21 = "……? 응?"
1004502-22 = "어라, 이게 누구야. 선생이잖아."
1004502-23 = "모른다고 해 달라니까 직접 찾아온 거야? 정말이지 선생답구만~."
1004502-24 = "[s3] \"여기서 뭘 하고 있었어?\"\n[s4] \"뭔가 혼잣말을 중얼거리고 있던데…….\""
1004502-25 = "……음?"
1004502-26 = "……음?"
1004502-27 = "아아, 이거 말하는 건가. 뭐, 별건 아니고……."
1004502-31 = "……자."
1004502-35 = "[ns5] \"리조트 가이드 맵?\"\n[ns6] \"이런 건 홀에도 많지 않았어?\""
1004502-36 = "으헤-. 뭘 모르는구만, 선생."
1004502-37 = "으헤-. 뭘 모르는구만, 선생."
1004502-38 = "좀 더 자세히 살펴보라고."
1004502-39 = "사용감이 있지? 이미 여기서 묵었던 누군가가 나름대로 포인트들을 체크한 책자야."
1004502-40 = "이런 건 오히려 새것보다 헌 것이 더 의미가 깊잖아? 실제 경험해 본 평가가 반영되니까."
1004502-41 = "그래서 객실들을 좀 뒤지며 찾고 있었어. 누가 좀 좋은 장소라든가……. 선별해 놓은 게 없나 하고 말이야."
1004502-42 = "……말하자면 이것도 일종의 보물지도라는 거지. 으헤헤."
1004502-43 = "아마도 선생은 또 내가 자는 줄 알고 있었겠지만……."
1004502-44 = "……응? 그래서 어디가 제일 마음에 들었냐고?"
1004502-45 = "좋은 질문이야, 선생. 안 그래도 이 방까지만 체크하고 슬슬 출발해 보려 했는데……."
1004502-46 = "이왕 이렇게 됐으니……."
1004502-53 = "선생도 온 김에 같이 가지 않겠어?"
1004502-54 = "지도에 표시된 '보물'을 찾아서."
1004502-61 = "흐음-. 거의 다 왔어. 이제 이 부근 어딘가인데……."
1004502-62 = "이야……. 그나저나 훌륭한 경치네. 과연 오는 사람마다 극찬한 곳답구만."
1004502-66 = "그리고 저쪽이 바로……."
1004502-70 = "……오……."
1004502-71 = "[s] \"……호시노?\""
1004502-76 = "……!!!"
1004502-81 = "[ns] \"호시노!?\""
1004502-88 = "[wa:200]― 이야-. [wa:1700]참을 수가 없네-."
1004502-90 = "― 이것이야말로 [wa:900]낙원-."
1004502-93 = "[wa:1500]― 시원한 그늘……. [wa:1850]기분 좋은 바닷바람……."
1004502-95 = "― 부드러운 [wa:850]파도 소리……."
1004502-98 = "― 이야아~. [wa:1150]역시 오길 잘했네~"
1004502-100 = "― 최고야. [wa:2100]마치 [wa:300]꿈 같은 장소야……."
1004502-103 = "[wa:1700]― ……선생도 그렇게 [wa:1100]서 있지만 말고"
1004502-105 = "― 누워 보는 게 어때?"
1004502-108 = "― 별로 넓진 않지만, [wa:1550]어때?"
1004502-110 = "― 꽤 괜찮다고~?"
1004502-113 = "[ns7] \"지금은 호시노의 표정만 봐도 만족스러워.\"\n[ns8] \"……마음에도 없는 소리 하지 말고 편히 자.\""
1004502-114 = "― 으헤-. [wa:650]역시 그렇게 나오는 건가……."
1004502-115 = "― 으헤-. [wa:650]역시 그렇게 나오는 건가……."
1004502-117 = "― 뭐, [wa:1000]왠지 그럴 거라 [wa:400]예상은 했지만서도."
1004502-120 = "[wa:650]― 상관없는데……."
1004502-123 = "― 딱히 [wa:800]그런 부분… [wa:1250]싫어하진 않지만."
1004502-125 = "[wa:50]― ……에헤헤."
1004502-128 = "[ns9] \"결국 자러 온 거였네.\"\n[ns10] \"뭐, 이럴 거라 예상했지.\""
1004502-129 = "그렇게 서운한 말 말라고-. 선생도 나 없을 때 은근슬쩍 여기 쓸 거잖아, 안 그래?"
1004502-130 = "그렇게 서운한 말 말라고-. 선생도 나 없을 때 은근슬쩍 여기 쓸 거잖아, 안 그래?"
1004502-135 = "음……. 뭐……."
1004502-136 = "……이왕 나도 불러주면 더 좋겠지만 말이야."
1004502-138 = "(결국 같이 누워 느긋한 낮잠을 청한 뒤 돌아갔다.)"
