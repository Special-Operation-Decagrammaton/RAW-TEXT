[translation]
10054020-1 = "第2話;名分"
10054020-2 = "……詳細說來聽聽。"
10054020-3 = "是，是的！那個……事情是這樣的……"
10054020-4 = "聽說在距離山海經稍遠的溪谷有個度假設施，而玄武商會在那裡投入了大量的資金。#n對吧，瑠美會長？"
10054020-5 = "這件事也未曾向玄龍門如實上報。"
10054020-6 = "對於玄武商會單方面做出決定並動用資金一事，我感到非～常的遺憾。"
10054020-7 = "所謂慎其身，敬其事，而後可盡其職。不是嗎？"
10054020-8 = "咦……？這麼用應該沒錯吧？"
10054020-9 = "誰知道呢？#n那方面的事我也不太清楚……"
10054020-10 = "……錯了。"
10054020-11 = "呃咦！？"
10054020-12 = "嗯……我承認這在解讀層面確實可能存在爭議。"
10054020-13 = "不過地理位置、發展潛力、交通條件，我全都仔細調查過了。#n那裡真的是個空氣好、水質佳的渡假勝地。"
10054020-14 = "相較於設施的潛在價值，那裡的市場評價明顯偏低。#n因此我們判斷這是一筆值得嘗試的投資。"
10054020-15 = "既然都已經著手了，將來如果能進一步設立玄武商會的分店也不錯。"
10054020-16 = "不過，關於玄武商會如何自行運用商會資金這件事……"
10054020-17 = "依照慣例，只要確實提交明細就不會加以追究吧？"
10054020-18 = "那僅限於「山海經內部」的情況。這也是我剛才提過的部分。"
10054020-19 = "原來如此。畢竟迄今為止，玄武商會從未有向山海經外部投資的先例。"
10054020-20 = "嚴格來說，這次投資甚至是前所未有的案例。"
10054020-21 = "因此恐怕難以遵循過往的慣例吧。"
10054020-22 = "前所未有的案例……"
10054020-23 = "如果在梅花園，我應該會集合孩子們商量今後該怎麼做並訂下規則。#n這也算是所謂的討論式教育吧。"
10054020-24 = "不過孩子們總是沒多久就把那些事情丟在一旁，自顧自地聊天玩鬧起來……"
10054020-25 = "心菜醬已經做得很好了哦。#n而且現在大家聚在這裡，本質上和那件事也是一樣的呢。"
10054020-26 = "正是如此，心菜教官。#n即便是吾等這些年長者……說不定與梅花園的孩子們也相差無幾。"
10054020-27 = "呵呵。討論協商以達成共識，並共同遵守結果……無論對誰而言都絕非易事啊。"
10054020-28 = ""
10054020-30 = ""
10054020-31 = "[ns] 「就是說啊……確實……是這樣的呢……」"
10054020-32 = "老師，於此流露大人世界的黑暗面，恐怕有點不利於教育。"
10054020-33 = "所以你怎麼看，妃姬？"
10054020-34 = "我認為這是值得一試的機會，如果把慣例和規定廣泛解讀……也並非完全無法通融。"
10054020-35 = "唔呣，汝在此等事務上確實一向重視變通與靈活性。"
10054020-36 = "然而站在玄龍門的立場，此般做法並非長久之計。"
10054020-37 = "門主大人所言甚是！#n縱使玄龍門與山海經的方針，將較以往確實有所改變……"
10054020-38 = "但是先人們所留下的那些傳統與教誨，究竟都跑到哪裡去了！？"
10054020-39 = "嗯。即便如此，我們屬於山海經高級中學這點，還是應該堅持下去！"
10054020-40 = ""
10054020-42 = ""
10054020-43 = ""
10054020-45 = "（眼看話題正要轉向規定與慣例的解讀）"
10054020-46 = "（不知為何……剛才瑠美說過的話，不斷浮現在腦海中）"
10054020-47 = ""
10054020-49 = ""
10054020-50 = "那裡真的是個空氣好、水質佳的渡假勝地。"
10054020-51 = ""
10054020-52 = "（還有……另一段對話也是！）"
10054020-53 = "不過任何人都能看出那不是進補就能改善，而是要好好讓身心靜養才能解決的問題。"
10054020-54 = "例如去空氣清新、山明水秀的好地方之類的……"
10054020-55 = ""
10054020-57 = ""
10054020-58 = ""
10054020-59 = "然而作為玄龍門的門主……"
10054020-60 = "以妾身的立場而言，若無合適的「名分」也不好隨意抽身休養。"
10054020-61 = ""
10054020-63 = ""
10054020-64 = ""
10054020-65 = "唔嗯……類似突然想到了好主意的感覺吧！"
10054020-66 = ""
10054020-68 = ""
10054020-71 = "[ns] 「既然如此，我們就直接去那裡看看吧！」"
10054020-72 = "？"
10054020-73 = "……"
10054020-74 = "……？"
10054020-75 = "哎呀？"
10054020-76 = "……"
10054020-77 = "呵呵呵。"
10054020-78 = "您，您突然間說什麼呢，老師！？現在比起去那種地方玩──"
10054020-79 = "不，真要說的話，問題根本不在那裡……！"
10054020-80 = "[s1] 「所以我才會這麼說啊！」\n[s2] 「既然學園的資金被投資到外部……不就需要進行『實地查核』嗎？」"
10054020-83 = "實地查核……？"
10054020-84 = ""
10054020-86 = ""
10054020-87 = "原來如此！"
10054020-88 = "既然老師提出了這樣的意見也沒辦法了呢。哈哈哈！"
10054020-89 = "唉……我就知道事情會變成這樣。"
10054020-90 = "總不能讓商會自行查核，此事只能交由玄龍門處理了呢。"
10054020-91 = "若由玄龍門對玄武商會進行查核，且結果並無不妥……想必任誰都會信服吧。"
10054020-92 = "老師，感謝汝公正無私的建言。"
10054020-93 = "門主大人！？"
10054020-94 = "呃……我不太明白。所以……接下來會怎麼樣呢……？"
10054020-95 = "關於這件事呢……心菜醬。"
10054020-96 = "……"
10054020-97 = "就是我們大家，要一起去溪谷的渡假勝地旅遊的意思哦！"
10054020-98 = "[ns] 「沒錯，就是這樣！」"
10054020-99 = "渡假……？剛才不是說實地查核嗎……？"
10054020-100 = "[ns] 「你先聽我說，事情是這樣的……」"
10054020-102 = "嗯？意思是如果大張旗鼓地進行查核，現場的人反而會試圖隱瞞問題？"
10054020-103 = "原來如此。於旁人眼中，玄武商會與玄龍門皆是山海經的一份子。"
10054020-104 = "沒錯，所以我們必須盡可能偽裝成與山海經毫無關聯的避暑遊客。"
10054020-105 = "在溪谷進行查核活動……夏天的假期……呵呵呵。#n要穿什麼樣的泳裝好呢？"
10054020-106 = "咦？也，也就是說……姐姐和老師……都要穿泳裝？"
10054020-107 = "真的嗎！？真的……可以嗎！？！？"
10054020-108 = "[s] 「當然囉，心菜醬！」"
10054020-109 = "太好了！既然這次是去玩的，就特別允許老師叫我心菜醬吧！"
10054020-110 = "不過我也會趁這個機會展現出色淑女的模樣，你可要做好覺悟哦？"
10054020-111 = "原來如此，泳裝啊……"
10054020-112 = ""
10054020-114 = ""
10054020-115 = "（且慢……如此一來，妾身豈不是得在老師面前穿著泳裝……！？）"
10054020-116 = "我作為商會長也沒有意見。#n那麼老師……"
10054020-117 = ""
10054020-119 = ""
10054020-120 = ""
10054020-121 = "你比較希望我穿什麼樣的泳裝？我會盡量配合你的要求哦？"
10054020-122 = ""
10054020-124 = ""
10054020-125 = ""
10054020-126 = "等，等等。瑠美！突然問老師那種問題……多少有些失禮吧？"
10054020-127 = "咦？無論老師提出什麼意見，我都沒關係啊？反而會覺得挺開心的呢。"
10054020-128 = "妾，妾身並不是在說汝！所以說……！"
10054020-129 = "至少在這個場合該遵守禮數吧！"
10054020-130 = "啊哈哈！好久沒從妃姬口中聽到「遵守禮數」這句話了！"
10054020-131 = ""
10054020-133 = ""
10054020-134 = ""
10054020-135 = ""
10054020-136 = ""
10054020-138 = "總之，討論的方向大致上已經有所結論了呢。"
10054020-139 = "若將慣例和規定從寬解釋，玄武商會的對外投資屬於容許範圍之內。"
10054020-140 = "不過相對地，由玄武商會、玄龍門、梅花園和老師組成的查核團，#n將前往當地進行實地查核……結論大概就是這樣。"
10054020-141 = "既然名義上是遊客，泳裝可千萬不能忘記帶哦。各位都明白了吧？"
10054020-142 = "話雖如此，總覺得對於規定的解釋範圍還是有點過於廣泛了……"
10054020-143 = "畢竟世事本來就不可能完全依照章程運轉嘛……？"
10054020-144 = "那個道理我基本上也同意，但是從你口中說出來，總覺得讓人有些擔心……"
10054020-145 = "我，我怎麼了嗎……？"
10054020-146 = "你偶爾不是也會因為擴大解釋規定而惹出麻煩嗎？"
10054020-147 = "之前擅自以「累積現場經驗」為由……"
10054020-148 = "把玄龍門一年級的部員派去某個奇怪的古老宅邸當警衛的事情，我可還沒忘記呢。"
10054020-149 = ""
10054020-151 = ""
10054020-152 = "啊……"
10054020-153 = "哎呀哎呀～廣義上來說，那些也都是經驗嘛。#n不是都說多樣化的經驗能使人成長嗎？"
10054020-154 = "假如那棟古宅不是非法藝術品的拍賣會場，我或許會更認同你的說法吧。"
10054020-155 = "多，多樣化的經驗能使人……這本來就是門主大人所追求的方針啊！？"
10054020-156 = "唉……要是你能少說兩句的話，或許還不會這麼惹人厭吧。"
10054020-157 = "咦？美奈醬你討厭我嗎？#n有點受傷……我明明不討厭美奈醬的說……"
10054020-158 = "而且也是因為有美奈醬在，我才能安心待在房間裡做軍師的工作嘛？"
10054020-159 = "就說了給我把那張嘴管好！！！"
10054020-160 = "呀啊～門主大人～美奈醬欺負我啦～"
10054020-161 = "拜託汝等成熟一點好嗎……"
10054020-163 = "那麼各位！非常感謝今日前來參與聚會，大家都辛苦了！"
10054020-164 = "謝謝大家！夏天……避暑……溪谷！我等不及了！"
10054020-165 = ""
10054020-167 = ""
10054020-168 = "查核……兼渡假嗎。呵呵。"
10054020-169 = "門主大人，您似乎很開心呢。"
10054020-170 = "嗯……儘管名義上仍是外派公務罷了。"
10054020-171 = "不過……溪谷啊……"
10054020-172 = ""
10054020-174 = ""
10054020-175 = ""
10054020-176 = "老師，汝大可拭目以待。"
10054020-177 = ""
10054020-179 = ""
10054020-180 = ""
10054020-181 = "美奈，妾身先行一步了。"
10054020-182 = "是的，門主大人。"
