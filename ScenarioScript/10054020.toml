10054020-186 = "[ns] 「那麼接下來……」"
10054020-188 = "[ns] 「瑠美，辛苦你幫忙製造這次休假的名分了。」"
10054020-189 = "這點小事不算什麼。畢竟名分在山海經可是最重要的事啊。"
10054020-190 = "就是說啊。尤其是對門主大人而言……"
10054020-191 = "什，什麼！？原來……是這麼回事嗎！？老師是如何得知的……！？#n不，等等。加奈惠，你該不會……？"
10054020-192 = "……"
10054020-193 = "連你也跟玄武商會串通好了嗎！？"
10054020-194 = "什，什麼串通！真要說起來我也是受害者耶！#n瑠美會長突然打電話過來，不容分說地就……！"
10054020-195 = "抱歉抱歉。不過在玄龍門還算可以溝通的人就只有加奈惠了。"
10054020-196 = "如果可以的話，我本來是不打算接受的！#n可是一聽說是為了門主大人，不知不覺就點頭答應了……"
10054020-197 = "我也很感謝老師能迅速察覺我的意圖，並且主動提出這件事。"
10054020-198 = "畢竟與老師合作的經驗，如今也累積了不少呢。"
10054020-199 = "啊，原來是這樣嗎。#n僅憑一句話，便能立刻明白其中隱藏的深意。"
10054020-200 = "嗚嗚嗚……老師居然比我們玄龍門更早和玄武商會發展成那種關係！#n果然應該早點和老師見面的～！"
10054020-201 = "你本來就不是會主動去做那種事的人吧……"
10054020-202 = "是這樣沒錯，但我其實很喜歡能迅速掌握狀況的人哦？"
10054020-203 = "那只是因為這樣你就更不用踏出房門了吧……"
10054020-204 = "耶嘿嘿。"
10054020-205 = ""
10054020-207 = ""
10054020-208 = ""
10054020-209 = "啊哈哈，那倒是沒錯。#n在玄龍門的學生當中，加奈惠算是比較願意和我們玄武商會保持良好關係的人……"
10054020-210 = "但是因為他不願踏出房門，所有飲食都依靠外送解決，有時候還挺傷腦筋的。"
10054020-211 = ""
10054020-213 = ""
10054020-214 = ""
10054020-215 = "畢竟從商會外送到六和閣幹部的房間，可不是件輕鬆的差事呢。"
10054020-216 = "一開始又是盤查又是搜身的……真是有夠折騰人。"
10054020-217 = "不，不過那也為商會增加了不少收入吧？我可沒有錯哦！"
10054020-218 = "而且現在大家不是都習慣了嗎？一般情況下都會直接放行吧？"
10054020-219 = "那麼我倒想問問，每當部員們跑來問我「這樣真的沒有安全問題嗎」的時候，#n你打算怎麼處理呢……"
10054020-220 = "看在我一向懂事又勤勉的份上，你就別追究了嘛？"
10054020-221 = "你這個人還真是……"
10054020-222 = "總之，這次的渡假……#n不，這次查核我依然會以護衛的身分行動，所以就不另外準備泳裝了。"
10054020-223 = "咦，真的嗎？"
10054020-224 = "哎呀？"
10054020-225 = "[ns] 「咦咦！？！？」"
10054020-226 = "有，有必要那麼驚訝嗎？"
10054020-227 = "畢竟……總得有人堅守原則吧。#n如果能由我來肩負這份責任，將是無上的光榮。"
10054020-228 = "真死板耶～好可惜哦～"
10054020-229 = ""
10054020-230 = "[ns] 「好可惜啊～」"
10054020-231 = "連，連老師也……！？#n可是……即便如此……"
10054020-232 = "將，將來總會有其他機會吧！#n這次不管誰說什麼，我都不會改變主意！"
10054020-233 = "既然決定了方向就該貫徹到底，這才是硬派作風！"
10054020-234 = "又來了又來了。你老是掛在嘴邊的硬派作風。"
10054020-235 = "成天把軍師掛在嘴邊的你有資格說嗎！"
10054020-236 = "好了好了。美奈說的其實也有道理，我們反而應該感謝他不是嗎？"
10054020-237 = "到時候就拜託你了，美奈。#n仔細想想，無論作為會長還是學生，總是受到你的照顧呢。"
10054020-238 = "是啊。要是沒有美奈同學，無論山海經還是玄龍門都會相當辛苦呢。"
10054020-239 = "不，那個，與其說是那樣……"
10054020-240 = "我只不過是履行自身的職責罷了……！"
10054020-241 = "[s] 「那麼護衛就拜託你囉。」"
10054020-242 = "好的！放心交給我吧！"
10054020-243 = "不過……這段期間玄龍門要由誰來負責呢？#n商會這邊倒是可以由我暫時代理……"
10054020-244 = "哼嗯？我想想……"
10054020-245 = ""
10054020-247 = ""
10054020-248 = "不必擔心！玄龍門這邊……相信我們最出色的軍師，肯定能妥善處理的！"
10054020-249 = "……咦？"
10054020-250 = "我嗎？讓我負責？為什麼！？"
