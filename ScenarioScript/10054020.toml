10054020-71 = "[ns] \"ถ้างั้น เราไปดูที่นั่นด้วยตัวเองกันเถอะ!\""
10054020-72 = "?"
10054020-73 = "..."
10054020-74 = "...?"
10054020-75 = "ตายจริง?"
10054020-76 = "..."
10054020-77 = "ฮุฮุฮุ"
10054020-78 = "จะ... จู่ๆ ก็พูดเรื่องอะไรน่ะ คุณครู?! ตอนนี้แทนที่จะพูดเรื่องการไปเที่ยวเล่นในที่แบบนั้นมัน..."
10054020-79 = "ไม่สิ นี่ไม่ใช่ปัญหาแบบนั้นตั้งแต่แรกแล้ว...!"
10054020-80 = "[s1] \"เราต้องไปตรวจสอบจากสถานที่จริงกันสิ!\"\n[s2] \"เราต้องไปตรวจสอบการลงทุนที่ว่านั่นจากสถานที่จริงสิ!\""
10054020-83 = "ตรวจจากสถานที่จริง...?"
10054020-84 = ""
10054020-86 = ""
10054020-87 = "อย่างนี้นี่เอง!"
10054020-88 = "เสนอความเห็นแบบนี้สินะ! ถ้าเป็นความเห็นของคุณครู งั้นก็ช่วยไม่ได้สินะ ฮ่าฮ่าฮ่า!"
10054020-89 = "ก็... ฉันกะไว้แล้วละค่ะว่าจะกลายเป็นแบบนี้"
10054020-90 = "ในเมื่อย่านการค้าไม่อาจตรวจสอบตัวเองได้ เรื่องนี้จึงไม่มีทางเลือกอื่น นอกจากต้องให้มังกรดำจัดการค่ะ"
10054020-91 = "นั่นก็จริง... หากมังกรดำเป็นผู้ดำเนินการตรวจสอบงานภายนอกของย่านการค้าเทพเต่าดำ แล้วผลการตรวจสอบไม่พบปัญหา ทุกคนก็คงยอมรับได้"
10054020-92 = "ขอบคุณสำหรับความเห็นอันเที่ยงธรรมและเป็นกลางนะ ครู"
10054020-93 = "ท่านประมุข!?"
10054020-94 = "เอ่อ... ฉันตามไม่ค่อยทันเลยค่ะ แล้ว... ต่อจากนี้จะเป็นยังไงเหรอคะ...?"
10054020-95 = "เรื่องนั้นน่ะ โคโคน่าจัง"
10054020-96 = "..."
10054020-97 = "ก็หมายความว่า พวกเราทุกคนจะออกไปเที่ยวพักร้อนที่หุบเขากันยังไงล่ะคะ"
10054020-98 = "[ns] \"ใช่แล้ว!\""
10054020-99 = "ไปเที่ยว... พักร้อน? แต่เมื่อกี้นี้บอกว่าเป็นส่วนหนึ่งของการตรวจสอบจากสถานที่จริงไม่ใช่เหรอ...?"
10054020-100 = "[ns] \"ลองฟังดูก่อนนะ มันเป็นแบบนี้...\""
10054020-102 = "หะ... หืม? ถ้ามังกรดำลงไปตรวจสอบอย่างเปิดเผย ทางพื้นที่จะกลับพยายามปกปิดส่วนที่ยังบกพร่อง#nงั้นเหรอ?"
10054020-103 = "เป็นเช่นนั้นสินะ ในสายตาคนนอก ไม่ว่าจะเป็นย่านการค้าเทพเต่าดำหรือมังกรดำ สุดท้ายก็คงถูกมองว่าเป็นซานไห่จิงเหมือนกัน"
10054020-104 = "ใช่ค่ะ เพราะงั้นพวกเรา... ต้องทำตัวให้เป็นนักท่องเที่ยวที่มาพักร้อนธรรมดา ที่ไม่เกี่ยวข้องกับซานไห่จิงให้มากที่สุด"
10054020-105 = "กิจกรรมตรวจสอบที่หุบเขา... วันหยุดฤดูร้อน... อุฮุฮุ จะเลือกชุดว่ายน้ำแบบไหนดีนะคะ?"
10054020-106 = "เอ๋? ดะ... เดี๋ยวนะคะ... ให้ใส่ชุดว่ายน้ำ... ไปกับพี่ชุนและคุณครู?"
10054020-107 = "จริงเหรอคะ? ทำแบบนั้น... ได้จริงๆ เหรอคะ??!!"
10054020-108 = "[s] \"ได้แน่นอนอยู่แล้ว โคโคน่าจัง!\""
10054020-109 = "ดีเลยค่ะ! ในเมื่อเราจะไปเที่ยวเล่นกัน งั้นฉันจะยอมให้เรียกว่าโคโคน่าจังเป็นกรณีพิเศษค่ะ!"
10054020-110 = "แต่ฉันก็จะแสดงให้เห็นภาพลักษณ์ของกุลสตรีที่แท้จริงในโอกาสนี้ เตรียมใจไว้ได้เลยนะคะ?"
10054020-111 = "เช่นนั้นสินะ ชุดว่ายน้ำอย่างนั้นหรือ..."
10054020-112 = ""
10054020-114 = ""
10054020-115 = "(เดี๋ยวก่อน... เช่นนั้นเราก็จะต้องให้ครูเห็น... ตัวเราในชุดว่ายน้ำอย่างนั้นหรือ...?!)"
10054020-116 = "ในฐานะประธานย่านการค้า ฉันก็ไม่มีอะไรจะค้าน! ถ้าอย่างงั้น คุณครู..."
10054020-117 = ""
10054020-119 = ""
10054020-120 = ""
10054020-121 = "อยากให้ชุดว่ายน้ำของฉันเป็นสไตล์ไหนเหรอ? ฉันจะพยายามหาชุดให้ตรงตามคำขอให้มากที่สุดเลย"
10054020-122 = ""
10054020-124 = ""
10054020-125 = ""
10054020-126 = "ดะ... เดี๋ยวก่อน รูมิ! มาถามเรื่องเช่นนั้นกับครูตอนนี้... มัน... เสียมารยาทไม่ใช่หรือ?"
10054020-127 = "เอ๋? แต่ไม่ว่าคุณครูจะพูดยังไง ฉันก็ไม่ว่าอะไรหรอกนะ กลับรู้สึกสนุกมากกว่าด้วยซ้ำ"
10054020-128 = "ระ... เราไม่ได้หมายความแบบนั้น! คือว่า...!"
10054020-129 = "อะแฮ่ม อยู่ที่นี่ก็สำรวมกิริยาให้มากกว่านี้กันหน่อย!"
10054020-130 = "ฮ่าฮ่าฮ่า! ไม่ได้ยินคำว่าให้สำรวมกิริยาจากปากของคิซากิมานานมากแล้วนะ!"
10054020-131 = ""
10054020-133 = ""
10054020-134 = ""
10054020-135 = ""
10054020-136 = ""
10054020-138 = "เอาละ ดูเหมือนเราจะกำหนดทิศทางการหารือได้แล้วนะ"
10054020-139 = "การลงทุนภายนอกของย่านการค้าเทพเต่าดำ หากตีความธรรมเนียมและกฎของโรงเรียนอย่าง#nผ่อนปรนขึ้นเล็กน้อย ก็ถือว่าอยู่ในขอบเขตที่ทำได้"
10054020-140 = "แต่คณะตรวจสอบที่ประกอบด้วยย่านการค้าเทพเต่าดำ มังกรดำ สวนต้นบ๊วย และคุณครู จะดำเนินการตรวจสอบจากสถานที่จริง... คงสรุปได้ประมาณนี้ค่ะ"
10054020-141 = "เราจะไปในฐานะนักท่องเที่ยวที่ไปพักร้อนกัน เพราะงั้นก็ห้ามลืมชุดว่ายน้ำนะคะ เข้าใจแล้วใช่มั้ยคะ ทุกคน?"
10054020-142 = "ถึงจะว่าอย่างนั้นก็เถอะ แต่ดูเหมือนว่าจะตีความกว้างเกินไปหน่อยนะ..."
