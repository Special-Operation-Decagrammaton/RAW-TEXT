10054020-50 = "ที่นั่นเป็นสถานที่พักผ่อนที่อากาศดี และน้ำก็ใสสะอาดจริงๆ"
10054020-51 = ""
10054020-52 = "(แล้วก็... มีเรื่องอื่นด้วย!)"
10054020-53 = "แต่ปัญหานั้นไม่ได้แก้ได้ด้วยการกินอาหารดีๆ หรอก ต้องให้ทั้งร่างกายและจิตใจได้พักบ้าง ถึงจะรู้สึกดีขึ้น"
10054020-54 = "อย่างเช่น ไปในสถานที่ที่อากาศดีๆ และก็มีน้ำใสสะอาดๆ"
10054020-55 = ""
10054020-57 = ""
10054020-58 = ""
10054020-59 = "แต่ตำแหน่งประมุขแห่งมังกรดำนั้น..."
10054020-60 = "เป็นตำแหน่งที่ยากจะหาเวลาพักตามอำเภอใจเช่นนั้นได้ หากไม่มี 'ข้ออ้างที่เหมาะสม' น่ะ"
10054020-61 = ""
10054020-63 = ""
10054020-64 = ""
10054020-65 = "อืม คงต้องเรียกว่าไอเดียดีๆ หรืออะไรทำนองนั้น! พอดีฉันนึกอะไรแบบนั้นขึ้นมาได้น่ะ!"
