10054020-46 = "(ไม่รู้เพราะเหตุใด คุณครูถึงรู้สึกว่าคำพูดของรูมิเมื่อครู่นี้... ผุดขึ้นมาในหัวซ้ำแล้วซ้ำเล่า)"
10054020-47 = ""
