[translation]
10054020-1 = "ตอนที่ 2;ข้ออ้าง"
10054020-2 = "อืม... จงบอกรายละเอียดมา"
10054020-3 = "ค่ะ... ค่ะ! คือว่า เรื่องนั้นน่ะค่ะ คือว่า..."
10054020-4 = "มีสถานที่พักผ่อนอยู่ในหุบเขาห่างจากซานไห่จิงไปเล็กน้อย เห็นได้ยินมาว่ามีการลงทุนในสถานที่#nแห่งนั้นไปไม่น้อยเลยละค่ะ ใช่มั้ยคะ ท่านประธานรูมิ?"
10054020-5 = "ฉันอยากแสดงความไม่พอใจเป็นอย่างยิ่ง~!"
10054020-6 = "ที่เรื่องนี้ไม่ได้มีการรายงานให้มังกรดำของเราทราบอย่างถูกต้อง และที่ย่านการค้าเทพเต่าดำเบิกจ่าย#nเงินทุนนั่นโดยพลการค่ะ"
10054020-7 = "มีคำกล่าวว่า \"พึงสำรวมและอุทิศตนด้วยความนอบน้อม พร้อมทุ่มเทแรงกายจนถึงที่สุด\" ด้วยนี่คะ?"
10054020-8 = "เอะ เอ๋...? คำนี้ใช้ในเวลานี้ ถูกมั้ยคะ?"
10054020-9 = "ไม่รู้สิ? ฉันไม่ค่อยรู้เรื่องแบบนั้นน่ะ..."
10054020-10 = "...ผิดแล้ว..."
10054020-11 = "เอ๋?!"
10054020-12 = "ก็นะ... ต้องยอมรับว่ามันเป็นส่วนที่อาจถกเถียงกันได้ในแง่การตีความ"
10054020-13 = "แต่ฉันก็ตรวจสอบทั้งทำเล ศักยภาพในการพัฒนา และการเดินทางมาหมดแล้ว ที่นั่นเป็นสถานที่พักผ่อนที่อากาศดี และน้ำก็ใสสะอาดจริงๆ"
10054020-14 = "เมื่อเทียบกับศักยภาพของสถานที่แล้ว ดูเหมือนจะถูกประเมินค่าต่ำไปมากด้วยค่ะ เราก็เลยตัดสินว่าเป็นเรื่องที่คุ้มค่าพอจะลองลงทุน"
10054020-15 = "และในระยะยาว ถ้าพัฒนาไปถึงขั้นเปิดสาขาแฟรนไชส์ของย่านการค้าเทพเต่าดำนอกพื้นที่ได้#nก็คงจะดีด้วย!"
10054020-16 = "แต่เรื่องที่ย่านการค้าเทพเต่าดำจะใช้เงินทุนของตัวเองอย่างไรนั้น..."
10054020-17 = "ตราบใดที่ยื่นรายละเอียดบัญชีอย่างชัดเจน ตามธรรมเนียมแล้วก็มักจะปล่อยผ่านให้โดยปริยาย#nไม่ใช่เหรอ?"
10054020-18 = "แต่ธรรมเนียมนั้นก็ใช้กันเฉพาะ 'ภายในซานไห่จิง' เท่านั้นนี่คะ อย่างที่ฉันเพิ่งพูดไปเมื่อครู่นี้เลยค่ะ!"
10054020-19 = "เป็นอย่างนี้เองสินะคะ ที่ผ่านมาย่านการค้าเทพเต่าดำไม่เคยนำเงินทุนไปลงทุนนอกซานไห่จิงมาก่อน"
10054020-20 = "ถ้าจะพูดให้ถูกต้อง นี่เป็นครั้งแรกที่มีการลงทุนภายนอก"
10054020-21 = "ก็เลยเป็นเรื่องที่ตีความตามธรรมเนียมปฏิบัติที่ผ่านๆ มาได้ยากสินะคะ"
10054020-22 = "กรณีแรกที่ไม่เคยเกิดขึ้นมาก่อน..."
10054020-23 = "ถ้าเป็นที่สวนต้นบ๊วย ก็คงเกณฑ์เด็กๆ ทุกคนมา แล้วชวนกันตั้งกฎว่าต่อจากนี้ควรทำยังไงดีค่ะ#nนี่คือการเรียนรู้ผ่านการอภิปรายน่ะค่ะ"
10054020-24 = "แต่เด็กก็คือเด็ก... แค่ไม่กี่นาทีก็เลิกสนใจเรื่องนั้น แล้วเริ่มคุยเล่นกันเองแล้วค่ะ..."
10054020-25 = "ตอนนี้ก็ทำได้ดีแล้วค่ะ โคโคน่าจัง และการที่หลายคนมารวมตัวกันที่นี่ในตอนนี้ โดยพื้นฐานแล้วก็เหมือนกับเรื่องนั้นเลยนี่คะ?"
10054020-26 = "เป็นเช่นนั้น ผู้ฝึกสอนโคโคน่า และถึงจะเป็นพวกพี่สาวอย่างพวกเรา... ก็อาจไม่ได้ต่างจากเด็กๆ ของสวนต้นบ๊วยมากนักหรอก"
10054020-27 = "ฮุฮุ ก็การยึดมั่นในข้อตกลงที่ผ่านการปรึกษาหารือ และปฏิบัติตามข้อสรุปที่ได้โดยไม่ให้เกิดปัญหา เป็นเรื่องที่ไม่ง่ายสำหรับใครทั้งนั้นนี่นะ"
10054020-28 = ""
10054020-30 = ""
10054020-31 = "[ns] \"เป็นจริง... อย่างที่ว่าเลยละ... เป็นอย่างนั้นจริงๆ...\""
10054020-32 = "คือว่า... ครู การเผยความมืดมนอันลึกล้ำของผู้ใหญ่ให้เห็นกันตรงนี้ น่าจะไม่เป็นผลดีต่อการอบรม#nสั่งสอนเท่าไรนะ"
10054020-33 = "แล้วคิดว่ายังไงบ้างล่ะ คิซากิ?"
10054020-34 = "ส่วนฉันคิดว่าลองดูก็น่าจะดี และถ้าตีความธรรมเนียมกับข้อบังคับให้กว้างขึ้นอีกหน่อย... ก็น่าจะไม่ใช่เรื่องที่ทำไม่ได้เสียทีเดียวนะ"
10054020-35 = "อืม ในเรื่องเช่นนี้ เธอมักจะให้ความสำคัญกับความยืดหยุ่นและการปรับเปลี่ยนตามสถานการณ์จริงๆ สินะ "
10054020-36 = "ทว่ามังกรดำเองก็ไม่ได้อยู่ในสถานะที่จะวางท่าทีเช่นนั้นได้ตลอดไป"
10054020-37 = "เป็นอย่างที่ท่านกล่าวค่ะ! ถึงแนวทางของมังกรดำและซานไห่จิงจะมีส่วนที่เปลี่ยนไปจากเมื่อก่อนอยู่#nบ้างก็เถอะ...!"
10054020-38 = "แต่แล้วธรรมเนียมกับหลักคำสอนที่มีมาแต่เดิมมันหายไปไหนกันคะ หลักคำสอนน่ะค่ะ!"
10054020-39 = "อืม ถึงอย่างนั้น ฉันคิดว่าอย่างน้อยพวกเราก็ควรรักษาความเป็นนักเรียนของโรงเรียนมัธยมซานไห่จิง#nเอาไว้ต่อไปอยู่ดี!"
10054020-40 = ""
10054020-42 = ""
10054020-43 = ""
