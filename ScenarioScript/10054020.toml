[translation]
10054020-1 = "2화;명분"
10054020-2 = "……흐음. 자세히 이야기해 보거라."
10054020-3 = "네, 네엣! 그러니까 그게 말이죠. 그러니까……."
10054020-4 = "산해경에서 조금 떨어진 계곡에 휴양 시설이 있는데, 거기에 제법 대규모 투자를 했다고 하더라고요? 맞죠, 루미 회장님?"
10054020-5 = "물론 이런 일이 우리 현룡문에도 제대로 보고되지 않고."
10054020-6 = "현무상회에서 독단적으로 결정되어 자금 집행이 이루어졌다는 부분에서는, 상당~히 유감을 표하고 싶습니다만!"
10054020-7 = "이르기를, 몸을 삼가 공경스럽게 바쳐, 비로소 수고로움을 다해야 한다고 하잖아요?"
10054020-8 = "어라라……? 이럴 때 쓰는 말, 맞나요?"
10054020-9 = "글쎄? 그런 부분은 난 잘 몰라서……."
10054020-10 = "……틀렸다……."
10054020-11 = "으엥?!"
10054020-12 = "뭐…… 확실히 해석의 영역에서 다툼이 있을 수 있는 부분이라는 것은 인정하겠어."
10054020-13 = "하지만 입지라든가 발전 가능성, 교통편 같은 것도 모두 조사해 봤다구. 정말 공기 좋고 물 좋은 휴양지야."
10054020-14 = "시설이 가지고 있는 잠재 가능성에 비해, 상당히 저평가되어 있더군요. 충분히 걸어볼 만한 이야기라고 판단했습니다."
10054020-15 = "하는 김에, 장기적으로는 현무상회의 외부 프랜차이즈 지점을 출범시키는 것까지 진행되면 더 좋지 않을까 싶기도 했고!"
10054020-16 = "하지만 현무상회가 상회의 자금을 자기들끼리 어떻게 사용하는지에 대해서는……."
10054020-17 = "명세서만 확실히 제출한다면, 암묵적으로 묵인하는 것이 관례이지 않았나?"
10054020-18 = "하지만 그것은 '산해경 내부'에 한정되는 이야기이기도 했죠. 조금 전 말씀드렸던 부분이지만요!"
10054020-19 = "그렇군요. 지금까지 현무상회가 산해경 외부로 자금을 출자한 경우는 없었으니까요."
10054020-20 = "엄밀히 말씀드리자면 이번이 외부 출자가 이루어진 첫 케이스이다 보니."
10054020-21 = "지금까지의 관례로는 해석하기 어려운 사례가 된 것이겠네요."
10054020-22 = "지금까지 없었던 첫 사례……."
10054020-23 = "매화원이었다면, 아이들을 모두 모아 놓고, 앞으로는 어떻게 하면 좋겠냐고 규칙을 정하자고 하겠네요. 토론 교육이죠."
10054020-24 = "……아이들이 늘 그렇지만, 몇 분 만에 그런 건 아무래도 좋고 자기들끼리 떠들고 놀기 시작하지만요……."
10054020-25 = "잘하고 있어요, 코코나 쨩. 그리고 지금 여기 많은 분이 모인 것도, 기본적으로는 그 일과 마찬가지랍니다?"
10054020-26 = "그러하다. 코코나 교관. 그리고 우리 언니들이라고 해서…… 매화원의 원아들과 그렇게까지 다르지는 않을지도 모른단다."
10054020-27 = "후후. 합의와 협의, 그리고 거기에서부터 도출된 결론을 무탈하게 지켜 나가는 것은, 누구라 해도 쉽지 않은 일이니 말이다."
10054020-31 = "[ns] \"정말로…… 그렇지……. 그렇고말고…….\""
10054020-32 = "그, 선생. 여기에서 그렇게 어른의 깊은 어두움을 보여도, 교육적으로는 그다지 좋지 않을 것이라고 생각한다만."
10054020-33 = "그래서 어떻게 생각해, 키사키?"
10054020-34 = "나로서는 한번 해 보면 좋을 것 같기도 했고, 관례와 규정을 조금 넓게 해석하자면…… 아예 안 될 일은 아닌 것 같았거든."
10054020-35 = "음. 그대는 확실히 이런 일에서 융통성과 유연성을 중시하는 편이지."
10054020-36 = "허나 현룡문은 그런 자세를 언제까지나 취할 수도 없는 입장이니 말이다."
10054020-37 = "그 말씀대로입니다! 아무리 현룡문과 산해경의 기조가, 이전과는 조금 달라진 부분이 있다지만……!"
10054020-38 = "애초에 전통과 가르침은 어떻게 된 거냐구요, 가르침은!"
10054020-39 = "음. 그래도 우리가 산해경 고급중학교의 학생이라는 부분만은, 계속해서 가져가야 한다고 생각한다!"
10054020-45 = "(화제가 규정과 관례의 해석으로 넘어가려고 하고 있었다.)"
10054020-46 = "(왠지 모르게, 조금 전 루미가 했던 말이…… 자꾸 머릿속에 떠올랐다.)"
10054020-50 = "정말 공기 좋고 물 좋은 휴양지야."
10054020-52 = "(그리고…… 또 다른 이야기도!)"
10054020-53 = "하지만 누가 봐도 그 문제는, 좋은 음식을 먹어서 해결되는 것이 아니라, 몸과 마음을 좀 쉬게 해야 해결될 텐데."
10054020-54 = "가령 공기 좋고 물 좋은 곳이라던가."
10054020-59 = "허나 현룡문의 문주라는 자리는 아무래도……."
10054020-60 = "적합한 '명분' 없이는, 함부로 그런 시간을 내기 어려운 위치이기도 해서 말이다."
10054020-65 = "으음, 뭔가 좋은 생각이라고나 할까, 그 비슷한 것이라고나 할까! 그런 게 떠올라서 말이지!"
10054020-71 = "[ns] \"그러면, 우리 거기에 직접 가 보자!\""
10054020-72 = "?"
10054020-73 = "……."
10054020-74 = "……?"
10054020-75 = "어머나?"
10054020-76 = "……."
10054020-77 = "우후훗."
10054020-78 = "가, 갑자기 무슨 말인가, 선생님?! 지금 우리는 그런 곳에 놀러 가자는 것보다……"
10054020-79 = "아니, 애초에 이건 그런 문제가……!"
10054020-80 = "[s1] \"그래서 하는 말이야!\"\n[s2] \"학교 자금이 외부에 투자되었다면…… '현장 감사'가 필요하잖아?\""
10054020-83 = "현장 감사……?"
10054020-87 = "그런가!"
10054020-88 = "그런 의견을 내놓았나! 선생님의 말이라면 어쩔 수 없지. 하하하!"
10054020-89 = "뭐……. 이런 식으로 될 것 같기는 했죠."
10054020-90 = "상회가 스스로 자기를 감사할 수는 없는 일이니, 이 부분은 어쩔 수 없이 현룡문에게 맡길 수밖에 없겠군요."
10054020-91 = "……하기야, 누구라고 해도 현무상회의 외부 감사를 현룡문이 수행하고, 그 결과에 아무 문제가 없다면 납득하게 되겠지."
10054020-92 = "공명정대한 의견에 감사한다, 선생."
10054020-93 = "문주님!?"
10054020-94 = "어……. 잘 모르겠어요. 그러니까…… 앞으로 어떻게 되는 건가요……?"
10054020-95 = "그건 말이죠. 코코나 쨩."
10054020-96 = "……."
10054020-97 = "우리 모두, 계곡 휴양지로 바캉스를 떠나자는 거랍니다?"
10054020-98 = "[ns] \"바로 그거야!\""
10054020-99 = "바캉…… 스? 조금 전에는 분명, 외부 현장 감사의 일환이라고 하지 않았나……?"
10054020-100 = "[ns] \"그러니까 들어 봐. 이런 거라고…….\""
10054020-102 = "으, 음? 대놓고 현룡문에서 감사를 가게 되면, 현장에서는 오히려 미진한 부분들을 감추려 할 거라고?"
10054020-103 = "그렇구나. 외부에서는 현무상회이든 현룡문이든, 결국 다 같은 산해경으로 보일 테니."
10054020-104 = "그렇답니다. 그래서 우리는…… 최대한 산해경과는 관련이 없는, 평범한 여름 휴양객으로 보일 필요가 있는 것이죠."
10054020-105 = "계곡에서 보내는 감사 활동…… 여름휴가…… 우후후. 수영복은 어떤 것으로 할까요?"
10054020-106 = "어? 그, 그러니까…… 언니랑 선생님이랑…… 수영복?"
10054020-107 = "정말요? 진짜로…… 그래도 돼요??!!"
10054020-108 = "[s] \"물론이지, 코코나 쨩!\""
10054020-109 = "좋아요! 이번에는 놀러 가는 거니까, 특별히 코코나 쨩이라고 부르셔도 용서해 드릴게요!"
10054020-110 = "그 대신 이 기회에 제대로 된 레이디의 모습을 보여 드릴 테니까, 각오하시라구요?"
10054020-111 = "그렇구나. 수영복이라……."
10054020-115 = "(가만……. 그렇다면 선생에게…… 수영복 모습을 보이게 되는 것인가……?!)"
10054020-116 = "상회장으로서는 할 말이 없네! 그러면 선생님……."
10054020-121 = "내 수영복은, 어떤 스타일이 좋아? 최대한 리퀘스트는 맞춰 줄게."
10054020-126 = "기, 기다려라. 루미! 지금 당장 그런 것을 선생에게 물어도…… 그…… 실례이지 않은가."
10054020-127 = "어라? 난 선생님이 뭐라고 하든, 별로 상관없는데? 오히려 즐겁다는 느낌이고."
10054020-128 = "그, 그대가 아니라! 그러니까……!"
10054020-129 = "에에이, 여기에서는 조금 더 법도를 지키거라!"
10054020-130 = "하하하! 키사키 입에서 법도를 지키라는 말, 정말 오랜만에 듣네!"
10054020-138 = "그러면, 논의 방향은 정해진 것 같네."
10054020-139 = "현무상회의 외부 자금 투자는, 관례와 학칙을 조금 여유 있게 해석해 보면, 허용될 수 있는 범위이다."
10054020-140 = "그 대신 현무상회와 현룡문, 매화원과 선생님으로 이루어진 감사단이, 현장 감사를 실시한다…… 정도가 되겠군요."
10054020-141 = "휴양객이라는 명목이니까, 수영복도 잊으면 안 된답니다. 아셨죠, 여러분?"
10054020-142 = "그렇다고는 해도, 역시 조금 과하게 해석 범위를 넓힌 것 같다만……."
10054020-143 = "어, 으, 세상일이 그렇게 규격에 맞게 딱딱 돌아가는 게 아니기는 한데 말이죠……?"
10054020-144 = "기본적으로는 동의한다만, 그 말을 하고 있는 게 너라는 것이 조금 마음에 걸리는군……."
10054020-145 = "저, 저는 왜요……?"
10054020-146 = "너 역시 규율의 폭넓은 해석으로 문제를 일으킨 적이, 이따금 있지 않았나."
10054020-147 = "예전에 멋대로, 현장 경험이랍시고 현룡문 1학년 부원들을……."
10054020-148 = "……웬 이상한 고저택의 경호원으로 파견 보냈던 것, 아직 기억하고 있으니까 말이지."
10054020-152 = "아."
10054020-153 = "아이참, 아이참. 그것도 넓게 보면 다~ 경험이라구요. 다양한 경험이 사람을 성장하게 한다, 이거 몰라요?"
10054020-154 = "그 고저택이 미술품 불법 경매장이었다는 사실만 제외한다면, 지금보다는 그 말에 동의할 수 있었을 거다."
10054020-155 = "다, 다양한 경험이 사람을……. 애초에 이거, 문주님께서도 지향하는 방향성이라구요!"
10054020-156 = "하아……. 말이나 못 하면 밉지라도 않겠다."
10054020-157 = "어라, 미나 쨩. 저 미워해요? 조금 쇼크……. 저는 미나 쨩 싫어하지 않는데."
10054020-158 = "무엇보다 미나 쨩이 있어야, 제가 마음 놓고 방에서 책사 일을 할 수 있잖아요?"
10054020-159 = "그러니까 그 입을 좀 어떻게 하라고!!!"
10054020-160 = "꺄앙~ 문주니임~ 미나 쨩이 괴롭혀요~"
10054020-161 = "둘 다 덩칫값 좀 해 다오……."
10054020-163 = "그러면 여러분! 오늘 감사했습니다. 모두 고생 많으셨어요!"
10054020-164 = "감사했습니다! 여름…… 피서…… 계곡! 못 기다리겠어요!"
10054020-168 = "감찰…… 휴양이라. 후후."
10054020-169 = "즐거우신가요, 문주님?"
10054020-170 = "으음. 표면적으로는 어디까지나 외부 출장 업무다만, 말이지."
10054020-171 = "하지만…… 계곡인가. 그래……."
10054020-176 = "기대해도 좋을 것이다. 선생."
10054020-181 = "나는 조금 먼저 들어가 있겠다, 미나."
10054020-182 = "알겠습니다. 문주님."
10054020-186 = "[ns] \"자, 그러면.\""
10054020-188 = "[ns] \"휴가 명분 만드느라 고생 많았어, 루미.\""
10054020-189 = "이 정도야. 산해경에서는 그게 가장 중요하니까."
10054020-190 = "그렇지요. 특히 문주님이라면 더더욱……."
10054020-191 = "뭐, 뭐라고?! 그런…… 것이었나? 선생님은 어떻게……?! 아니, 잠깐. 카나에 너, 혹시……?"
10054020-192 = "……."
10054020-193 = "너도 현무상회와 짜고 쳤냐!"
10054020-194 = "짜, 짜고 쳤다니요! 저도 알고 보면 피해자라구요! 갑자기 루미 회장님이 전화를 걸어오셔서, 다짜고짜……!"
10054020-195 = "미안, 미안. 하지만 그나마 현룡문에서 말이 통하는 게, 카나에 정도여서 말이야."
10054020-196 = "저는 웬만하면 이 이야기, 받아들이기 싫었다구요! 하지만 문주님을 위한 일이라는 말에, 살짝 설득되어 버려서……."
10054020-197 = "나로서는 그렇게 빨리 눈치채고 이야기를 꺼내 준 선생님도 고마웠지만 말이야."
10054020-198 = "선생님과 발을 맞추어 본 경험도, 이제 제법 쌓여 왔으니 말이지요."
10054020-199 = "아, 그건가요. 소리를 듣는 것만으로, 그 숨은 뜻을 단번에 알아차린다는 거네요."
10054020-200 = "우으으……. 선생님이 우리 현룡문보다 먼저, 현무상회와 그런 관계가 되셨을 줄이야! 역시 선생님을 조금 더 빨리 만나 뵐 걸 그랬어요~!"
10054020-201 = "아니, 넌 그럴 수 있는 녀석이 아니지 않나……."
10054020-202 = "하지만 상황을 빠르게 파악하는 사람, 저 꽤 좋아한다구요?"
10054020-203 = "그러면 한층 더 방 밖으로 나가지 않아도 될 테니까 말이지……."
10054020-204 = "에헤헤."
10054020-209 = "하하하. 그건 그래. 카나에는 말이지, 현룡문 학생 중에서는 우리 현무상회와 그나마 가깝게 지내 주지만……."
10054020-210 = "이게 또 방 밖으로 나가고 싶지 않다고 모든 음식을 배달 주문으로 시키는 덕분에, 조금 곤란할 때가 있다니까."
10054020-215 = "상회에서 육화각 간부의 방까지 배달을 가는 게 보통 일은 아니다 보니 말이죠."
10054020-216 = "처음에는 검문이라든가 몸수색이라든가……. 조금 큰 일이었습니다."
10054020-217 = "그, 그것도 다 매출에 도움되는 부분이잖아요. 저는 잘못 없다구요!"
10054020-218 = "그리고 이제 다들 익숙해져서, 웬만하면 패스시켜 주고 있는 걸로 아는데요?"
10054020-219 = "그때마다 부원들이 내 쪽으로, 보안 문제는 괜찮냐고 의구심을 보내오는 건, 어떻게 해 줄 생각이냐고 묻고 싶군……."
10054020-220 = "언제나 기특하고 성실한 저를 봐서, 잘 넘어가 주시면?"
10054020-221 = "말을 골라도 꼭……."
10054020-222 = "어쨌든, 이번 휴양…… 아니, 이번 감사에서 나는 여전히 호위 역할을 고수할 것이다. 그러니 수영복은 따로 준비하지 않겠어."
10054020-223 = "어, 정말?"
10054020-224 = "어머나."
10054020-225 = "[ns] \"어어!?!?\""
10054020-226 = "그, 그렇게 놀랄 일인가? 하지만……."
10054020-227 = "누군가는 그래도 원칙을 지켜야 하지 않겠나. 그리고 그것이 내가 될 수 있다면, 말로 표현할 수 없는 영광일 것이다."
10054020-228 = "딱딱해라~ 아까워라~"
10054020-230 = "[ns] \"아까워라~\""
10054020-231 = "서, 선생까지? 그렇다면……. 그렇지만……."
10054020-232 = "다, 다음에 언젠가 기회가 있지 않을까 한다! 이번은 누가 뭐라고 해도 이렇게 하겠어!"
10054020-233 = "한번 정한 길을 바꾸지 않는 것이야말로 하드보일드니까!"
10054020-234 = "또, 또, 또! 그놈의 하드보일드!"
10054020-235 = "허구한 날 책사, 책사 하는 네가 할 말이냐!"
10054020-236 = "자, 자. 그 말도 틀린 부분은 없으니까 말이지. 오히려 우리가 고마워해야 하는 일이잖아?"
10054020-237 = "잘 부탁해, 미나. 이거 이래저래 자꾸 신세 지게 되네. 회장으로서도, 학생으로서도."
10054020-238 = "그렇지요. 미나 씨가 없다면 산해경도 현룡문도, 많이 힘들 테니까요."
10054020-239 = "아니, 그건, 그런 것이라기보다는……."
10054020-240 = "나는 그저, 내 의무에 충실할 뿐이니까, 음!"
10054020-241 = "[s] \"그러면 호위 잘 부탁할게.\""
10054020-242 = "좋다! 나만 믿도록!"
10054020-243 = "그런데…… 그러면 그동안 현룡문은 누가 담당하게 되죠? 상회야 임시로 제가 운영하면 됩니다만……."
10054020-244 = "흐음? 가만있자……."
10054020-248 = "걱정할 것 없다! 현룡문은…… 우리 최고의 책사께서 잘 맡아 줄 테니까!"
10054020-249 = "………네?"
10054020-250 = "제가요? 그걸요? 왜요?!"
10054020-251 = "에이, 너 말고 달리 누가 있겠나! 문주님께서도 나도, 피할 수 없는 외부 감사로 자리를 비울 수밖에 없는데!"
10054020-252 = "조직 구조를 보더라도 책임 소재를 보더라도, 너 말고는 적임자가 없는 상황 아닌가!"
10054020-253 = "하, 하지만…… 제 업무 분야는 행정 처리와 내부 규율 단속……. 그리고, 그리고……."
10054020-257 = "이 기회에 일 좀 하라고. 안 그래?"
10054020-258 = "……!"
10054020-259 = "???!!! 설마, 루미 씨? 처음부터 이걸 노리고……!!!???"
10054020-260 = "어라~ 이것 참, 계곡에 가려면 준비할 게 많아서 말이야~ 나는 조금 먼저 가 볼게~"
10054020-261 = "회장님이 상회로 돌아가신다면, 저도 동행해야겠죠. 오늘 즐거웠습니다."
10054020-262 = "그리고 육화각 출입 시 검문에 대한 불만 사항은, 아직도 꾸준히 제기되고 있습니다. 그냥 그렇다는 겁니다."
10054020-267 = "미나 쨩, 미나 쨩! 지금 현룡문 구성원이 현무상회 사람들에게 속아서 함정에 빠졌어요!"
10054020-268 = "이거 집행부장으로서 마땅히 응징해야 하지 않을까, 건의드리고자 하는데요!"
10054020-269 = "아니지, 아니지! 현무상회도 현룡문도, 결국 모두 산해경이라는 이름 안에서 하나잖아?"
10054020-270 = "어떤 사안에서 서로 도울 수 있다면, 그것보다 좋은 일이 어디 있겠어!"
10054020-271 = "서, 선생님??!!??!!"
10054020-272 = "[s] \"으음. 여기에서는 책사님의 명언을 인용할 수밖에.\""
10054020-277 = "[ns] \"다양한 경험은…… 사람을 성장하게 하는 법…….\""
10054020-278 = "세상에 믿을 사람 하나 없다더니!!!!!"
10054020-279 = "핫핫핫! 오히려 나는 이렇게나 신뢰할 수 있는 사람이 많았다는 것에 놀라고 있는데 말이야!"
10054020-286 = "계곡, 기대되시나요?"
10054020-287 = "[s] \"응. 당연하지.\""
10054020-288 = "네……."
10054020-289 = "저도, 정말로 기대되네요."
