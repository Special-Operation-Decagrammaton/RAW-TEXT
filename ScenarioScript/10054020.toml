[translation]
10054020-1 = "Episode 2;Justification"
10054020-2 = "Please elaborate."
10054020-3 = "Yes, ma'am! Let me see here..."
10054020-4 = "They made quite the investment into a recreational facility, located in a valley just outside of Shanhaijing. Am I correct, President Rumi?"
10054020-5 = "And, for my part, I would like to say that I am very, very, extremely disappointed!"
10054020-6 = "The funds were vested, completely arbitrarily, by the Black Tortoise Promenade, without notifying Genryumon first!"
10054020-7 = "They say one must bend to a task and spare no effort, yes?"
10054020-8 = "Aha! That one was correct, no?"
10054020-9 = "Sure? I don't know exactly what you mean..."
10054020-10 = "...It is not...at all..."
10054020-11 = "Ehh?!"
10054020-12 = "Well... I can see how it might seem bad from a certain perspective."
10054020-13 = "But we did all our research. It's a great vacation spot with clean air and water, has great development potential, and is easy to get to."
10054020-14 = "It was significantly undervalued, so we snapped up the opportunity before it could slip away."
10054020-15 = "On a long term basis, it's a great starting point for us to expand our franchise."
10054020-16 = "But as for how the Black Tortoise Promenade's funds get used..."
10054020-17 = "Isn't it standard procedure to allow it as long as we receive the proper paperwork?"
10054020-18 = "But this happened outside of Shanhaijing! So standard procedure doesn't apply!"
10054020-19 = "I see, the issue is more so that Black Tortoise Promenade is investing outside of Shanhaijing's borders."
10054020-20 = "This would be the first instance in our history that our funds were used on an external site in this way."
10054020-21 = "There is no precedent for it."
10054020-22 = "The \"first instance\"..."
10054020-23 = "At Plum Blossom Garden, we would handle this by gathering all the children and asking them to help decide on a rule for if this happened in the future."
10054020-24 = "...Although they normally get bored after a few minutes and start playing amongst themselves."
10054020-25 = "That's a great reference to draw, Kokona. We're essentially doing the same thing here."
10054020-26 = "That's correct, Instructor Kokona. In that sense, we aren't much different from the children of Plum Blossom Garden."
10054020-27 = "Fufu, coming together, hearing everyone's opinions, settling on a conclusion, and upholding the rules... It is as difficult for us as it is them."
10054020-28 = ""
10054020-30 = ""
10054020-31 = "[ns] \"Yes... She's right... It really is...\""
10054020-32 = "Sensei, please do not corrupt her with the dark side of adulthood. She's still young."
10054020-33 = "Anyways, what do you think, Kisaki?"
10054020-34 = "I think it's worth a shot. And we're not breaking any rules, if you're able to interpret and apply the regulations from a broader perspective."
10054020-35 = "You've always been the more adaptable and flexible in cases such as these. Those are your values. "
10054020-36 = "However, they cannot be Genryumon's. Not always."
10054020-37 = "As she says! Genryumon and Shanhaijing HAVE taken a different approach as of late..."
10054020-38 = "...but does that mean we should throw away our traditions entirely?! What of the TRADITIONS?!"
10054020-39 = "Yes, we're losing the essence of who we are: students of Shanhaijing Academy!"
10054020-40 = ""
10054020-42 = ""
10054020-43 = ""
10054020-45 = "The debate was beginning to spiral into interpretations of regulations and customs."
10054020-46 = "But I couldn't stop thinking about what Rumi said earlier."
10054020-47 = ""
10054020-49 = ""
10054020-50 = "It's a great vacation spot with clean air and water..."
10054020-51 = ""
10054020-52 = "The events of the day started to replay in my head..."
10054020-53 = "But even good food can only do so much. More than anything, she needs rest, mentally and physically."
10054020-54 = "Like a vacation, somewhere with clean air and water..."
10054020-55 = ""
10054020-57 = ""
10054020-58 = ""
10054020-59 = "However, I am the president of Genryumon."
10054020-60 = "I cannot simply run off as I please, citing \"rest\" as my only justification."
10054020-61 = ""
10054020-63 = ""
10054020-64 = ""
10054020-65 = "I may have stumbled on a genius idea! Maybe!"
10054020-66 = ""
10054020-68 = ""
10054020-71 = "[ns] \"Then why don't we all go there together?\""
10054020-72 = "?"
10054020-73 = "..."
10054020-74 = "...?"
10054020-75 = "Oh?"
10054020-76 = "..."
10054020-77 = "Fufu."
10054020-78 = "Wh-What are you talking about, Sensei?! We don't have time to run off to some valley and take a vacation! "
10054020-79 = "Wait! No, the actual problem was—"
10054020-80 = "[s1] \"That's exactly why! If school funds were invested...\"\n[s2] \"Then you need to conduct an on-site audit!\""
10054020-83 = "An \"on-site audit\"...?"
10054020-84 = ""
10054020-86 = ""
10054020-87 = "I see!"
10054020-88 = "How interesting! Well, can't say no to Sensei, can we? Hahaha!"
10054020-89 = "Well... I suppose things played out as expected."
10054020-90 = "Obviously the Promenade can't audit itself, so Genryumon would have to do it."
10054020-91 = "...If Genryumon conducts an audit of the Black Tortoise Promenade and finds no fault, then the matter would be considered resolved from any party's perspective."
10054020-92 = "Thank you for your impartial and fair opinion, Sensei."
10054020-93 = "Madam?!"
10054020-94 = "Um... I don't understand. So... What's happening next...?"
10054020-95 = "You see, Kokona."
10054020-96 = "..."
10054020-97 = "We're all going on a vacation to a valley resort!"
10054020-98 = "[ns] \"Exactly!\""
10054020-99 = "A...vacation? I thought it was an on-site audit..."
10054020-100 = "[ns] \"Let me explain.\""
10054020-102 = "E-Eh? If we announce that we're auditing them, people will try to cover up any wrongdoings before we get there?"
10054020-103 = "From the perspective of outsiders, Genryumon and the Black Tortoise Promenade are one and the same."
10054020-104 = "Precisely. Therefore, we must present ourselves as ordinary tourists enjoying our summer vacation and hide our connection to Shanhaijing."
10054020-105 = "Fufufu. An audit in the valley...and a summer vacation as well. Which swimsuit shall I bring?"
10054020-106 = "E-Eh? Swimsuits? With...Sensei and Shun?"
10054020-107 = "C-Can we really?!"
10054020-108 = "[s] \"Of course, Kokona!\""
10054020-109 = "Well, since this is just for fun, I'll give you a special pass to call me just Kokona!"
10054020-110 = "But I'm really going to prove to you what a proper young lady I've become, so prepare yourself!"
10054020-111 = "I see. Swimsuits..."
10054020-112 = ""
10054020-114 = ""
10054020-115 = "(Would that not mean...Sensei would also see me dressed in a swimsuit?)"
10054020-116 = "The Black Tortoise President has no comment on that!"
10054020-117 = ""
10054020-119 = ""
10054020-120 = ""
10054020-121 = "That being said, what swimsuit do you want to see me wearing, Sensei? I'll do my best to live up to your expectations."
10054020-122 = ""
10054020-124 = ""
10054020-125 = ""
10054020-126 = "R-Rumi! That's a rather...rude proposition to put to Sensei."
10054020-127 = "You think so? I think it's a pretty fun one, no matter what Sensei says!"
10054020-128 = "N-Not for you! I am attempting to say...!"
10054020-129 = "Please conduct yourself with some modicum of decorum, Rumi!"
10054020-130 = "Hahaha! Is it weird to say that I've missed your nagging?"
10054020-131 = ""
10054020-133 = ""
10054020-134 = ""
10054020-135 = ""
10054020-136 = ""
10054020-138 = "So, are we all on the same page?"
10054020-139 = "The Black Tortoise Promenade's external investment is within reasonable bounds, if we take a little bit of liberty with the current rules and customs."
10054020-140 = "But to ensure everything is above board, an audit team consisting of the Black Tortoise Promenade, Genryumon, Plum Blossom Garden, and Sensei will go to the site in question."
10054020-141 = "However, we will be going undercover, as tourists on a regular summer vacation. So please remember to bring your swimsuits."
10054020-142 = "This is taking more than \"a little bit\" of liberty..."
10054020-143 = "Hm, hmmm, but the world isn't as black and white as the ink and paper rules are written on!"
10054020-144 = "This is a case of \"right message, wrong messenger\"..."
10054020-145 = "M-Me? The wrong messenger? Why?!"
10054020-146 = "There's no one who causes more trouble by bending the rules to their will than YOU."
10054020-147 = "I'll never forget what you did to those first-year Genryumon members."
10054020-148 = "You made them work security at that creepy, old mansion, calling it \"field experience!\""
10054020-149 = ""
10054020-151 = ""
10054020-152 = "Ah."
10054020-153 = "It IS experience, isn't it? From a certain perspective? And that's how people grow! By trying new things!"
10054020-154 = "Oh, did I forget to mention that \"old mansion\" was an illegal art auction house? What kind of \"growth\" did they learn from that experience?!"
10054020-155 = "A-All kinds of things... And Madam Kisaki also advocates for broadening one's horizons!"
10054020-156 = "*sigh* Your smooth talking is just irritating me more."
10054020-157 = "When presented like that... It seems like you hate me, Mina! My poor heart... But I'll still love you no matter how you feel!"
10054020-158 = "After all, I could never focus solely, 100% on being a strategist without your hard work!"
10054020-159 = "When will you ever learn to keep your giant trap SHUT?!"
10054020-160 = "Kyaaah! Madam! Mina is bullying me!"
10054020-161 = "Would the two of you act in a way befitting of your station? I beg of you..."
10054020-163 = "And that concludes our meeting! Great work, everyone, and thank you for your time!"
10054020-164 = "Thank you! Summer vacation...in the valley! I can't wait!"
10054020-165 = ""
10054020-167 = ""
10054020-168 = "Audits... Vacation... Fufu."
10054020-169 = "Are you excited, Madam?"
10054020-170 = "On the surface, it is a business trip. Nothing more, nothing less."
10054020-171 = "However, a trip to the valley..."
10054020-172 = ""
10054020-174 = ""
10054020-175 = ""
10054020-176 = "I hope you look forward to it, Sensei."
10054020-177 = ""
10054020-179 = ""
10054020-180 = ""
10054020-181 = "I have some matters to attend to first, Mina. I will take my leave."
10054020-182 = "Understood, Madam."
10054020-183 = ""
10054020-185 = ""
10054020-186 = "[ns] \"All right.\""
10054020-188 = "[ns] \"That was a great cover-up for a vacation, Rumi.\""
10054020-189 = "Ah, it was nothing. All for a good cause."
10054020-190 = "Yes. Anything for our Madam Kisaki."
10054020-191 = "Wh-What do you mean? This whole time...? And Sensei? Wait, KANAE?!"
10054020-192 = "..."
10054020-193 = "You were in league with the Black Tortoise Promenade!!"
10054020-194 = "\"In league\"?! I am a victim! A victim! President Rumi was the one who called me out of the blue."
10054020-195 = "I sure put you on the spot. Sorry, Kanae. But I knew you were the only person I could ask."
10054020-196 = "I didn't WANT to do it! Rumi is very convincing! And she said it was all for Madam Kisaki's sake!"
10054020-197 = "Hats off to Sensei as well. You caught on and steered the conversation in the right direction without any prompting."
10054020-198 = "We have been working together for a while now, so they're used to our ways now."
10054020-199 = "It's said that one need only listen to the sound to understand the hidden meaning underneath! "
10054020-200 = "Uwaaah! Why did Sensei have to meet the Black Tortoise first? If it had been Genryumon, I could've met Sensei sooner, and we would be just as close!"
10054020-201 = "You're not really the type to do that..."
10054020-202 = "I would've made an exception! I quite like people who are quick to read a room!"
10054020-203 = "Only because it helps you not leave YOUR room..."
10054020-204 = "Heehee."
10054020-205 = ""
10054020-207 = ""
10054020-208 = ""
10054020-209 = "Hahaha. Despite being from Genryumon, Kanae's actually on pretty good terms with us."
10054020-210 = "She used to cause problems for us all the time, refusing to leave her room and meet us for deliveries."
10054020-211 = ""
10054020-213 = ""
10054020-214 = ""
10054020-215 = "It's not exactly easy to get from the Promenade to the front door of an executive's office in the Rikkagaku. "
10054020-216 = "No one would ever want to take her order...not with all those inspections and body searches."
10054020-217 = "H-However, I contribute greatly to your monthly sales! So I'm actually doing a benevolent thing!"
10054020-218 = "And since the members know of my usual habits now, they've become much more lax, have they not?"
10054020-219 = "And then I'm the one who catches flak for weak security measures every time you order food... What \"benevolent thing\" are you doing for ME?"
10054020-220 = "Perhaps you can find it in your heart to give me grace, since I'm such a wonderful and diligent worker!"
10054020-221 = "I'm being driven to the edge..."
10054020-222 = "Anyways, for this vacation—ahem, audit, I'm still working as a bodyguard. I don't have time for frivolous things like swimsuits."
10054020-223 = "Wait, really?"
10054020-224 = "Oh my."
10054020-225 = "[ns] \"Huh?!\""
10054020-226 = "Wh-What? Why is everyone so surprised?"
10054020-227 = "At least one person needs to uphold our rules! And I'm honored to be the one to do so!"
10054020-228 = "How strict... What a shame..."
10054020-229 = ""
10054020-230 = "[ns] \"What a shame...\""
10054020-231 = "S-Sensei too? Then... But..."
10054020-232 = "N-Next time, then, okay?! Because now I've already said it, and I have to stick to my word! "
10054020-233 = "It's my hard-boiled way to not waver from a path once I've chosen it!"
10054020-234 = "Ugh! Not the hard-boiled nonsense again! That's all you ever talk about!"
10054020-235 = "You're the one who never shuts up about being a strategist!"
10054020-236 = "Now, now. She's doing a good thing and should be recognized for it."
10054020-237 = "Thanks, Mina. Really. As a Shanhaijing student and president of an organization here, I'm always indebted to you."
10054020-238 = "Absolutely. Without Mina, both Shanhaijing and Genryumon would find themselves in dire straits."
10054020-239 = "I mean, it's more so that..."
10054020-240 = "I-I'm just doing what I can!"
10054020-241 = "[s] \"Our safety will be in your hands then, Mina!\""
10054020-242 = "Just leave it to me!"
10054020-243 = "Speaking of... Who's going to run Genryumon in the mean time? I can handle the Promenade, but..."
10054020-244 = "You're right. Let's see..."
10054020-245 = ""
10054020-247 = ""
10054020-248 = "That's not even a question, actually! Of course, Genryumon will be safe in our hardworking, diligent strategist's capable hands!"
10054020-249 = "...Eh?"
10054020-250 = "M-M-Me? WHY??"
10054020-251 = "Who else could it be?! Both Madam Kisaki and I will be going on the audit trip!"
10054020-252 = "Look at our organizational structure! You're next in line!"
10054020-253 = "B-But...this is out of my job description! My work covers administration, internal affairs, and...and..."
10054020-254 = ""
10054020-256 = ""
10054020-257 = "Take this opportunity to \"broaden your horizons,\" yeah?"
10054020-258 = "...!"
10054020-259 = "RUMI?! Did you plan on this happening from the beginning?!"
10054020-260 = "Would you look at the time? I've got so much to prepare for our trip. Bye bye!"
10054020-261 = "I should help the president with that. Good to meet all of you. "
10054020-262 = "Oh, before I go. We still get a ton of complaints from food deliverers about the security inspection at the Rikkagaku. Just so you know."
