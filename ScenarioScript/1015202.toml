[translation]
1015202-1 = "特別な演奏"
1015202-2 = "(ツムギがいる公園へ向かった)"
1015202-3 = ""
1015202-7 = ""
1015202-8 = ""
1015202-9 = ""
1015202-10 = ""
1015202-11 = "あら。こんなに早くいらっしゃるだなんて。"
1015202-12 = "白雪姫を哀れむ「狩人」のお心でしょうか？"
1015202-13 = "それとも、眠れる姫を迎えに来た者のお心でしょうか？"
1015202-14 = "……どちらでも構いません。大切なのは、先生の――"
1015202-15 = ""
1015202-17 = ""
1015202-18 = ""
1015202-19 = "――「ハート」。"
1015202-20 = ""
1015202-22 = ""
1015202-23 = ""
1015202-24 = "……ですから。"
1015202-25 = "ふふっ、来てくださりありがとうございます。#n先生のお気持ちに応えられるよう、今日のチューニングは丁寧にするとしましょう。"
1015202-26 = "[s1] \"準備中にごめんね。\"\n[s2] \"何か手伝えることはあるかな？\""
1015202-29 = "なんとお優しい……。"
1015202-30 = "ですが、お気遣いなく。自分で準備を進めるのも、路上ライブの醍醐味ですので。"
1015202-31 = "とはいえ、そのお気持ちにはお返ししたいところではありますね。"
1015202-32 = "何がよろしいでしょうか？今すぐ用意できるものはありませんが……。"
1015202-33 = "そうですね、先生さえよろしければ――"
1015202-34 = "あ？あいつ、ここで何してんだ？"
1015202-35 = ""
1015202-36 = "これから人が昼寝しようってのに、うっせぇな……。"
1015202-37 = "ひひっ！安眠を邪魔した落とし前、つけてもらおうぜ！"
1015202-38 = "オイ！そこのギター！"
1015202-39 = "あら、何かご用でしょうか？"
1015202-40 = "はぁ？こいつ、なに余裕ぶっこいてんだ？"
1015202-41 = "てめぇのせいでせっかくの昼寝が台無しだ！どうしてくれるんだよ！"
1015202-42 = "迷惑料を払うってんなら、見逃してやってもいいぜ。"
1015202-43 = "あいにくですが、持ち合わせがありませんので。"
1015202-44 = "だったら、そのギター寄こせ！"
1015202-45 = "痛い目見たくなきゃさっさとしな！ひひっ！"
1015202-46 = "……ふふっ、ふふふ。"
1015202-47 = "ああ？何だヘラヘラしやがって。"
1015202-48 = "このギターの価値が分かるなんて――"
1015202-49 = "もしや、芸術にご興味が？"
1015202-50 = "ゲイジュツ？んなモン知るかよ！"
1015202-51 = "では……教えて差し上げましょう。"
1015202-52 = ""
1015202-54 = ""
1015202-56 = "これはただのギターではなく、「[ruby=Escopetarra]エスコペターラ[/ruby]」という芸術作品なのです。"
1015202-57 = "平和主義を象徴するこの作品は――"
1015202-58 = "銃とギターを融合させているのが特徴です。"
1015202-59 = "……は？"
1015202-60 = "通常ならば、銃の形をベースに実弾が出ないギターを作るものなのですが……。"
1015202-61 = "私はギターの形をベースに、実弾が出るエスコペターラを作ってみたんです。"
1015202-62 = "……この方が、色々な音を奏でられますから。"
1015202-63 = ""
1015202-65 = ""
1015202-66 = "一度、お聴きになりますか？"
1015202-67 = "私の「特別な演奏」を。"
1015202-68 = ""
1015202-73 = "ぐはっ……！？"
1015202-74 = ""
1015202-79 = ""
1015202-80 = ""
1015202-82 = ""
1015202-83 = "あら、この程度で倒れてしまうなんて……。"
1015202-84 = "私の演奏が、そんなに衝撃的だったのでしょうか？"
1015202-85 = "[ns3] \"ほ、本当に特別な演奏なんだね……。\"\n[ns4] \"こ、これがツムギの平和主義なの……？\""
1015202-88 = "争いは、暴力の意志から生まれるもの。"
1015202-89 = "ならば、根源を絶つ行為もまた――#n平和主義と言えるのではないでしょうか？"
1015202-90 = "平和とは、単なる暴力の不在ではありません。"
1015202-91 = "平和とは、慈悲の心の顕現なのです。"
1015202-92 = "ええ。私は慈悲の心でエスコペターラを奏でています。"
1015202-93 = "先ほども、あの方々を眠らせていなければ……。#n先生を含めここにいる全員が危険に晒されていたことでしょう。"
1015202-94 = "[s] \"に、人間の死が社会の福祉……！\""
1015202-95 = "ふふっ、そのフレーズはあくまでメッセージとして受け取ってください。"
1015202-96 = "「ラブ・アンド・ピース」――は大事ですから。"
1015202-97 = "さて、準備が整いました……路上ライブの開幕です。"
1015202-98 = "[s] \"今日はどんな曲を演奏するの？\""
1015202-99 = "いつもの曲から始めようと思っていたのですが……。"
1015202-100 = "そうですね……面白いアレンジが降りてきたので――"
1015202-101 = "このギターでしか演奏できない曲を披露しようかと。#nさて、どんな曲でしょう？"
1015202-102 = "[s] \"え……まさか……？\""
1015202-103 = "はい。その「まさか」です。"
1015202-104 = "……始めましょう。"
1015202-105 = ""
1015202-107 = ""
1015202-108 = ""
1015202-114 = "ひれ伏せェェェ！！暴徒どもォォォォォ！！"
1015202-115 = "ラブ・アンド・ピース！ラブ・アンド・ピーーース！！"
1015202-116 = ""
1015202-120 = "[ns] \"おぉ……。\""
1015202-121 = "（いつもよりも激しいステージだ……）"
1015202-123 = ""
1015202-124 = ""
1015202-125 = ""
1015202-126 = "う、うぅ……私、気絶していたのか……？"
1015202-127 = ""
1015202-131 = ""
1015202-132 = "起きろ！お前ら！寝てる場合じゃねぇぞ！"
1015202-133 = "うーん……なんだよ、このデケェ音は……！"
1015202-134 = "あっ、あれは……！"
1015202-135 = "ラブ・アンド・ピース！ラブ・アンド・ピーーース！！"
1015202-136 = ""
1015202-141 = "ウォェェェェェェェェェェェェッ！！！！"
1015202-142 = "ヒィィィッ！こ、こいつら！正気じゃねぇ！"
1015202-143 = "うちらが手ェ出していい相手じゃなかった……！逃げろォ！"
1015202-144 = "す、すんませんっしたァァァーーッ！！"
1015202-145 = ""
1015202-147 = ""
1015202-148 = ""
1015202-149 = ""
1015202-151 = "（その後、スケバンの間で「広場でギターを持ってる女に気をつけろ」#nという噂が広まったとか広まらなかったとか……）"
