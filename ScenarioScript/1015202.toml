[translation]
1015202-1 = "특별한 연주"
1015202-2 = "(연락을 받자마자 츠무기가 있는 공원으로 향했다.)"
1015202-11 = "어머나. 곧바로 달려오시다니."
1015202-12 = "백설공주를 어여삐 여긴 사냥꾼의 마음일까요?"
1015202-13 = "아니면 긴 잠에 빠진 연인을 찾아온 자의 마음일까요?"
1015202-14 = "사실 무엇이 되었든 중요하지 않답니다. 중요한 것은 저를 향한 선생님의—"
1015202-19 = "—'진심'."
1015202-24 = "……이니까요."
1015202-25 = "후후, 아무튼 찾아와 주셔서 감사해요. 그 마음까지 튜닝에 담아봐야겠네요."
1015202-26 = "[s1] \"아직 공연 준비 중이었구나?\"\n[s2] \"내가 도와줄 게 있을까?\""
1015202-29 = "어머나, 이 얼마나 고마운 말씀."
1015202-30 = "하지만 괜찮답니다. 스스로 준비하는 과정 또한 버스킹의 즐거움이니까요."
1015202-31 = "그래도 도움을 주겠다는 마음에는 보답하는 것이 인지상정인데……."
1015202-32 = "어떤 것이 좋을까요? 지금 당장은 해드릴 것이 없습니다만."
1015202-33 = "만약 선생님께서 괜찮으시다면……."
1015202-34 = "응? 저 녀석 여기서 뭐 하는 거야?"
1015202-36 = "공원에서 조용히 낮잠이나 자려 했는데 시끄럽게……."
1015202-37 = "키키킥, 우리 잠을 깨운 대가를 치르게 해주지."
1015202-38 = "어이! 거기 기타 든 녀석!"
1015202-39 = "어머나. 중요한 순간에 무슨 일이실까요?"
1015202-40 = "이 자식, 여유 부리는 것 좀 보게?"
1015202-41 = "너 때문에 낮잠도 못 자겠잖아! 어떻게 할 거야?"
1015202-42 = "피해 보상금을 준다면 그냥 넘어갈 수도 있는데 말이야."
1015202-43 = "죄송합니다만 저는 돈이 없어요."
1015202-44 = "그럼 그 기타라도 넘겨!"
1015202-45 = "좋은 말로 할 때 말이야. 키키킥!"
1015202-46 = "후후, 후후후……."
1015202-47 = "뭐야? 뭐가 좋다고 웃는 거야?"
1015202-48 = "여러분도 이 기타의 가치를 알아보시는군요?"
1015202-49 = "혹시 예술에 조예가 있으신가요?"
1015202-50 = "예술? 그런 건 모르는데?"
1015202-51 = "그렇다면 알려드릴게요."
1015202-56 = "이것은 평범한 기타가 아니라, [ruby=Escopetarra]'에스코페타라'[/ruby] 라고 하는 예술 작품이랍니다."
1015202-57 = "반전(反戰)과 평화주의를 상징하는 이 작품은……."
1015202-58 = "총과 기타를 하나로 만든 것이 특징이죠."
1015202-59 = "……응?"
1015202-60 = "보통은 총기 모양을 베이스로, 실탄이 나가지 않는 기타를 만드는 편입니다만……."
1015202-61 = "저는 기타 모양을 베이스로, 실탄이 나가는 에스코페타라를 만들어봤어요."
1015202-62 = "이런 기타라면 평소보다 다양한 연주를 할 수 있을 테니까요."
1015202-66 = "한번 들어 보실래요?"
1015202-67 = "저의, '특별한 연주'를."
1015202-73 = "커, 커허억……?!"
1015202-83 = "어머나. 고작 이 정도에 쓰러지다니."
1015202-84 = "생각보다 저의 특별 연주에 충격을 많이 받으셨나 보네요."
1015202-85 = "[ns3] \"저, 정말 특별한 연주네…….\"\n[ns4] \"이, 이것이 츠무기의 평화주의?\""
1015202-88 = "싸움은 폭력의 의지에서 태어나는 법이죠."
1015202-89 = "그럼 그 의지의 근원을 찾아 제거한다면…… 그것 또한 훌륭한 평화주의가 아닐까요?"
1015202-90 = "평화는 폭력의 부재가 아니랍니다."
1015202-91 = "평화는, 자비심의 현현이죠."
1015202-92 = "그래요. 저는 모두를 위한 자비심으로 에스코페타라를 연주하고 있어요."
1015202-93 = "조금 전에도 제가 저분들을 잠재우지 않았다면, #n저는 물론이고 선생님을 포함한 이곳의 모두가 위험에 빠졌겠죠."
1015202-94 = "[s] \"이, 인간이 죽는 것이 사회복지……!\""
1015202-95 = "후후, 어디까지나 메시지로만 해석해 주시면 감사하겠네요."
1015202-96 = "어찌 되었든 저는 평화를 사랑하니까요."
1015202-97 = "그럼 버스킹 준비도 이제 끝난 것 같으니, 슬슬 무대의 막을 올려 볼까요?"
1015202-98 = "[s] \"오늘은 어떤 곡을 들려줄 거야?\""
1015202-99 = "언제나 연주하던 그 곡부터 시작하면 어떨까 했습니다만……."
1015202-100 = "방금 일로 재미있는 어레인지가 떠올랐어요."
1015202-101 = "오직 제 기타로만 연주할 수 있죠. 혹시 뭔지 아시겠나요?"
1015202-102 = "[s] \"어…… 설마……?\""
1015202-103 = "네. 그 설마랍니다."
1015202-104 = "그럼 시작해 볼까요?"
1015202-114 = "내 앞에 바짝 엎드려라, 폭도들아!"
1015202-115 = "평화만 있으면 돼—! 평화만 있으면 돼—!!"
1015202-120 = "[ns] \"우와…….\""
1015202-121 = "(평소보다 더 격렬한 무대다…….)"
1015202-126 = "끄, 끄으으…… 잠깐 기절했었나……."
1015202-132 = "어, 어이! 다들 정신 차려! 자고 있을 때가 아니야!"
1015202-133 = "으, 으으으음…… 뭐가 이렇게 시끄러워?"
1015202-134 = "응? 저, 저건……!"
1015202-135 = "평화만 있으면 돼—! 평화만 있으면 돼—!!"
1015202-141 = "우우워우우우어어어어어—!!!"
1015202-142 = "키에에엑! 미, 미친 녀석이다!"
1015202-143 = "우, 우리가 어떻게 할 상대가 아니었어……! 도망쳐!"
1015202-144 = "죄, 죄송했습니다아아아—!!"
1015202-151 = "(이후 불량배들 사이에서 광장의 기타 든 녀석을 조심하라는 소문이 돌기 시작했다고 한다…….)"
