[translation]
70006020-1 = "미식과 쿠키. 그리고 구호 2화"
70006020-2 = "시작은…… 저에 대한 이상한 소문이었습니다."
70006020-4 = "성 테레사 종합병원 로비"
70006020-5 = "으으음……."
70006020-9 = "단장님? 무슨 고민이 있으신가요? 기운이 없어 보이네요."
70006020-10 = "아! 그럼 하나에가 힘이 나도록 응원을 해드릴게요!"
70006020-12 = "아닙니다. 괜찮습니다. 그저 저와 관련된 이상한 소문이 신경 쓰였던 것뿐이니까요."
70006020-14 = "이상한 소문이요?"
70006020-15 = "설마…… 단장님이 의료용품을 수집하는 이유가 파스 냄새를 좋아하기 때문이라는 소문인가요?"
70006020-17 = "아닙니다."
70006020-18 = "그럼 다과회에 사람들을 초대하는 이유가 다음 구호 대상을 찾기 위해서라는 소문인가요?"
70006020-19 = "아닙니다……."
70006020-20 = "그러면 근력을 키우기 위해 티타임에 몰래 프로틴 쿠키를 먹는다는 소문?"
70006020-21 = "아닙니다……!"
70006020-22 = "대체 어디서 그런 헛소문이 돌고 있는 거죠? 전부 신경 쓰이기 시작했습니다만!"
70006020-23 = "너무 걱정 마세요! 진짜 단장님은 그렇지 않다는 건 알고 있으니까요!"
70006020-24 = "그런데, 이렇게까지 그런 소문이 퍼진다는 건 이상하군요."
70006020-25 = "저는 단지, 한 분에게라도 더욱 널리 구호의 정신을 전해 드리려 했을 뿐인데……."
70006020-27 = "안타깝네요……."
70006020-28 = "어떡해야 단장님이 이상한 소문에서 벗어날 수 있을까요?"
70006020-32 = "아……! 이건 어떨까요?"
70006020-33 = "직접 쿠키를 만들어서 많은 분들에게 나눠주는 거예요."
70006020-34 = "정성이 가득 담긴 쿠키를 받게 되면 단장님에 대한 오해도 자연스레 사라질 거예요!"
70006020-36 = "그러네요! 이왕 만드는 거, 귀여운 모양이면 좋겠어요! 병아리 모양 같은 거요!"
70006020-37 = "병아리 모양의 쿠키라……. 확실히 좋은 아이디어네요."
70006020-39 = "……그렇게 병아리 쿠키를 만들기로 했지만, 문제가 있었습니다."
70006020-40 = "저는 쿠키를 만들어본 적이 없었다는 거죠."
70006020-41 = "세리나와 하나에가 도와줬지만 처음 결과물은 정말 처참했습니다."
70006020-42 = "병아리가 아니라 지옥에서 태어난 뒤틀린 생명체 같은 것이……."
70006020-43 = "그래서 트리니티의 유명 제과점에서 조언을 구하기도 했었습니다만……."
70006020-44 = "구호기사단의 수장이라는 직책 탓인지 필링과 아이싱이 잔뜩 올라간 고급스러운 쿠키의 레시피만 받아버려서……"
70006020-45 = "미네 씨는 병아리 쿠키가 더 좋으셨던 거군요?"
70006020-46 = "그, 그렇습니다! 귀여운 것은 정의니까요!"
70006020-47 = "아무튼, 그래서 조언을 해줄 사람을 찾다가 이 상점가에서 우연히 후우카 씨를 만나게 된 거랍니다."
70006020-48 = "샬레 근처의 상점가라 게헨나와 트리니티의 학생이 만날 수도 있지만 다소 신기하긴 하네요."
70006020-49 = "그 유명한 구호기사단 분들과 후우카 씨의 조합이라니."
70006020-51 = "그렇지? 나도 신기해. 대충 이런 일이 있었거든."
70006020-53 = "아, 역시 오늘은 신선한 재료들이 잔뜩 들어왔네."
70006020-54 = "이걸로 당분간은 걱정 없겠어."
70006020-55 = "……그 녀석들이 또 방해하지만 않는다면 말이야."
70006020-60 = "흐음……."
70006020-64 = "어…… 안녕하세요? 무슨 일이신지……?"
70006020-65 = "안녕하십니까. 혹시 구호 활동에 관심 있으신가요?"
70006020-66 = "……네?"
70006020-67 = "저는 트리니티 종합학원의 구호기사단 단장 미네라고 합니다."
70006020-69 = "트, 트리니티? 그것도 구호기사단 단장님이요?!"
70006020-70 = "그렇습니다. 멀리서 당신을 발견한 순간부터 기묘한 동질감을 느꼈습니다."
70006020-71 = "요리에 필요한 재료들을 꼼꼼히 살피시는 모습에서, 구호용품을 고르며 고민하는 저의 모습이 떠올랐죠."
70006020-72 = "그, 그런가요……?"
70006020-73 = "특히 많은 이들을 생각하는 인자한 표정에서 당신이 구호에 관련된 일을 하고 계실 거라 판단했습니다. 그렇지 않나요?"
70006020-74 = "어……. 제가 게헨나의 급양부 부장이긴 한데요……."
70006020-79 = "역시……! 저의 안목은 정확했군요!"
70006020-80 = "잠깐 저와 이야기를 나눠보지 않으시겠습니까? 당신이라면 대화가 통할 것 같다는 예감이 듭니다."
70006020-81 = "네? 하지만 전 게헨나 학생인데요……?"
70006020-82 = "구호라는 대의 앞에선 학원 같은 구별은 무의미한 것. 그렇게 생각하지 않나요?"
70006020-83 = "……뭐, 그렇긴 해요. 배고프다는 사람은 누가 됐던 뭐라도 먹여야 한다는 주의라……."
70006020-85 = "조금 손이 가는 녀석들이 있긴 하지만요."
70006020-86 = "손이 가는 녀석들……?"
70006020-88 = "과연. 그렇게 저희의 이야기를 듣게 된 거군요."
70006020-89 = "쿠키 만드는 것도 도와주기로 했고 말이야."
70006020-90 = "이 기회에 구호기사단과 친해져서 나쁠 건 없잖아?"
70006020-91 = "그러니까 오늘은 이만 포기해. 우리는 쿠키 재료를 사러 가야 한다고."
70006020-92 = "좋습니다. 후우카 씨에게 점심을 부탁한다는 계획은 보류하죠."
70006020-93 = "대신 새로운 계획이 생겼습니다."
70006020-94 = "미네 씨. 실례가 안 된다면 저희 미식연구회가 병아리 쿠키의 시식을 맡아도 될까요?"
70006020-95 = "이야기를 듣는 순간부터 미식의 기운을 느꼈답니다."
70006020-96 = "우후후, 어떤 맛일지 궁금하네요★"
70006020-97 = "나 쿠키 엄청 좋아해! 진짜로!"
70006020-98 = "시식이면 무료지? 에헤헤……."
70006020-100 = "다들 그 사이에 완전히 부활했네."
70006020-101 = "시식이라……. 확실히 저희보다는 미식연구회 분들이 맛에 대해 잘 알 거라는 느낌이 드는군요."
70006020-102 = "괜히 엮어봤자 좋지 않다고 생각해요……."
70006020-104 = "걱정 마시길. 저희는 그저 미네 씨의 병아리 쿠키가 궁금할 뿐이니까요."
70006020-105 = "그리고 후우카 씨가 진심으로 도와준다면 이상한 쿠키가 나오는 일도 없겠죠."
70006020-106 = "뭐…… 그건 그렇지만……."
70006020-107 = "미네 단장님, 어떻게 할까요?"
70006020-108 = "저는 찬성이에요! 여러분과 과자를 만들다니, 벌써 기대돼요!"
70006020-110 = "좋습니다. 그럼 모두가 같이 가시죠."
70006020-111 = "아, 뭔가 예감이 안 좋은데……."
70006020-128 = "(잠시 후…….)"
70006020-130 = "트리니티의 조리실습실"
70006020-131 = "아…… 맛있는 냄새. 쿠키는 언제 완성되려나?"
70006020-132 = "이제 다 되어가니까 조금만 기다려."
70006020-134 = "그렇다네요. 그럼 슬슬 준비를……."
70006020-135 = "트리니티 조리실습실까지 와버렸는데…… 정말로 괜찮겠지?"
70006020-137 = "네, 물론이죠. 계획대로 즐기면 된답니다."
70006020-141 = "계획대로요."
70006020-142 = "계획대로라는 게…… 설마 맛없으면 폭파시킬 작정이야?!"
70006020-143 = "후후후, 글쎄요?"
70006020-145 = "여러분! 오래 기다리셨습니다!"
70006020-146 = "미네 단장님의 귀여운 쿠키가 완성됐어요!"
70006020-152 = "……."
70006020-154 = "자아, 어서 보여주세요!"
70006020-155 = "다들 분명 좋아하실 거예요."
70006020-157 = "아, 알겠습니다."
70006020-158 = "여러분……! 이게 바로 제가 만든 쿠키입니다!"
70006020-164 = "오오, 보는 것만으로도 마음이 포근해지는 쿠키군요."
70006020-165 = "겉모습은 무조건 합격이네요★"
70006020-166 = "진짜 귀여워! 먹기 아까울 정도로!"
70006020-167 = "굉장해, 굉장해! 이제 먹어도 돼?!"
70006020-169 = "그렇게 칭찬해 주시니, 조금 부끄럽네요……."
70006020-170 = "아니 땐 굴뚝에 연기 나랴, 라는 말도 있습니다만……."
70006020-171 = "소문은 결국 소문. 전부 그대로 믿어서는 본질을 놓치게 되지요."
70006020-172 = "……!!"
70006020-174 = "와아! 성공이에요, 단장님!"
70006020-175 = "이걸로 다른 분들도 단장님의 진짜 모습을 알게 될 거예요!"
70006020-177 = "그, 그렇다면 정말 기쁘겠지만……."
70006020-178 = "그럼 이제 본격적인 시식에 들어가죠."
70006020-183 = "에헤헤, 머리부터 먹을까? 몸통부터 먹을까?"
70006020-184 = "머리부터 먹어주는 게 덜 고통스럽지 않을까요?"
70006020-186 = "그럼 잘 먹겠습니다……!"
70006020-197 = "아니, 이 맛은……!"
70006020-198 = "이거 위험하네요★"
70006020-199 = "이런 쿠키는 태어나서 처음이야……!"
70006020-200 = "이건 뭐라고 해야 할까……. 간단하게 말하자면……."
70006020-201 = "정말로 엄청난 맛……!!"
70006020-203 = "입안에 가득 퍼지는 고소하고 달콤한 계란 맛이 정말 참을 수 없어!"
70006020-204 = "바삭한 식감 안에서 느껴지는 풋풋한 소녀의 감성이 진짜 좋네요."
70006020-205 = "쿠키에서 귀여운 맛이 나! 지금까지 많은 걸 먹었지만 귀여운 맛은 처음이야!"
70006020-206 = "……음식은 맛뿐만 아니라 만든 사람의 정성도 함께 즐기는 법."
70006020-207 = "이 쿠키에서는 미네 씨의 정성이 가득 느껴지네요."
70006020-208 = "아아, 확실한 미식이에요."
70006020-209 = "……그, 그런 극찬을 해주시다니."
70006020-210 = "정말 감사합니다. 미식연구회 여러분이 인정해 주시니 용기가 나네요."
70006020-211 = "사실 실패하면 어떡하나 걱정했는데……."
70006020-212 = "후후, 저도 여길 폭파하지 않게 되어서 정말 다행이네요."
70006020-213 = "역시 폭파할 생각이었구나!"
70006020-214 = "하지만 맛있었죠?"
70006020-215 = "응! 나 이거 다 먹어도 돼?"
70006020-217 = "물론이죠. 많이 만들어 두었으니 마음껏 드세요."
70006020-218 = "와아……!"
70006020-220 = "단장님. 이 쿠키라면 분명 많은 분들에게 마음을 전할 수 있을 거예요."
70006020-221 = "맞아요! 정의실현부의 하스미 부부장님께서도 좋아하실 것 같아요!"
70006020-223 = "하스미 부부장이라……. 저를 비웃지나 않으면 좋겠습니다만."
70006020-225 = "디저트에 대해서는 기준이 확실한 분이니까, 이런 맛있는 쿠키를 비웃진 못할 거예요!"
70006020-226 = "이걸로 두 분 사이가 가까워졌으면 좋겠네요."
70006020-228 = "흐, 흐음……!"
70006020-229 = "아무튼 정말 감사합니다. 여러분 덕에 새로운 경험을 할 수 있었어요."
70006020-230 = "특히 후우카 씨에게 큰 신세를 졌습니다. 덕분에 훌륭한 쿠키를……."
70006020-234 = "……응? 후우카 씨?"
70006020-236 = "어라? 어디 가셨죠? 쿠키를 만들 때까지만 해도 분명 같이 있었는데."
70006020-237 = "그러고 보니 쿠키를 시식할 때부터 계속 안 보이셨던 것 같은 느낌이……."
70006020-239 = "그럼 구호기사단 여러분. 저희는 이만 돌아가 보겠습니다."
70006020-240 = "읍……! 우으읍!!"
70006020-241 = "후우카 씨?! 어째서 묶여 계신 거죠?!"
70006020-242 = "어느 틈에 후우카 씨를……!"
70006020-243 = "여러분이 쿠키를 들고 조리실을 나갈 때예요."
70006020-244 = "완성한 쿠키에, 흠뻑 빠져있었던 모양이네요★"
70006020-245 = "그 짧은 사이에 어떻게……?"
70006020-247 = "후후후, 저희가 얼마나 많이 후우카 씨와 시간을 보냈을 거라 생각하시나요? 이 정도는 간단하죠."
70006020-248 = "그런 걸 자랑하듯 말하지 마……!"
70006020-249 = "우웁! 우우웁……!"
70006020-250 = "아, 후우카가 빨리 우리 점심 만들어주고 싶대!"
70006020-251 = "그럼 슬슬 이동하죠. 그전에 주리 씨에게 연락을……."
70006020-256 = "아, 하루나 씨. 선배는 찾으셨나요?"
70006020-257 = "네. 무사히 ‘보호’하고 있습니다."
70006020-258 = "후우카 씨는 식자재를 고르느라 바빴던 모양이에요."
70006020-259 = "아, 역시 그랬군요! 그럼 계속 선배를 잘 부탁드립니다……!"
70006020-260 = "맡겨 주세요. 잘 모셔다드릴 테니까요."
70006020-264 = "이제 용무는 끝났으니 이만."
70006020-265 = "쿠키 잘 먹고 갑니다★"
70006020-272 = "친우에게, 무슨 처사를!"
70006020-273 = "추격하겠습니다! 구호가 필요한 곳에 구호를!!"
70006020-278 = "벼, 벽에 구멍이……."
70006020-279 = "아하하……. 아무래도 당분간은 단장님 이미지를 바꾸긴 힘들어 보이네요……."
70006020-281 = "미식연구회……! 절대 놓치지 않습니다!"
70006020-282 = "후후, 이번에는 안 잡힐 거랍니다……!"
