[translation]
10027125-5 = "이럴 수가…… 역시 선생은…… 강하군!"
10027125-12 = "[ns] \"미안, 마리나. 이쪽도 사정이 있어서.\""
10027125-16 = "아~ 역시 사무국만으로는 무리였나요~ 선생님이 계신다고는 하지만, 우정 파워, 무섭네요."
10027125-17 = "[s] \"출판부장님~ 선생님은 이제 그만 하고 싶은데요~\""
10027125-18 = "네에. 뭐어. 이쪽의 패배라면 어쩔 수 없죠. 아쉽지만, 깔끔하게 물러나겠습니다. 그 원고도 받지 않을게요."
10027125-19 = "하아…… 알아들었다니 다행……."
10027125-20 = "뭐, 다음에 다른 원고로 받아 내면 되는 일이고요."
10027125-21 = "끝난 거 아니었어?!"
10027125-22 = "전투 한 번으로 모든 일이 행복하게 끝날 거라고 생각하지 마세요! 그건 너무나도 안이한 생각! 용사가 마왕을 쓰러트리고 난 뒤에도 공주와의 결혼 생활은 남아있는 거니까요!"
10027125-23 = "관점에 따라서는 그쪽이 더 본격적인 전쟁이라고 보는 사람도 있고요! 힛. 힛. 히……!"
10027125-24 = "태연한 얼굴로 무서운 소리 아무렇지도 않게 하는구만!"
10027125-25 = "약속했잖아요? 설마 메루, 타인과의 약속, 어기진 않겠죠?"
10027125-26 = "으윽?!"
10027125-27 = "[s] \"뭐, 그건 사실이니까…….\""
10027125-28 = "어쨌든, 출판부는 이만 물러가겠습니다. 다음에 다시 보죠. 가능하면 좋은 사업 안건으로요."
10027125-30 = "……가능하다면 그게 양쪽 모두에게 좋게 작용할 수 있는 것이길 바랄게요……."
10027125-38 = "자아. 이것으로 소란은 대충 정리되었군요."
10027125-39 = "……그 소란 일으킨 거, 너희 부장님 아니냐?"
10027125-40 = "부장님은 부장님, 저는 저인걸요?"
10027125-42 = "그리고 지금 중요한 건, 그게 아니잖아요?"
10027125-43 = "[s] \"드디어, 타카네의 평론을 들어 볼 시간이 된 건가…….\""
10027125-45 = "어……? 괘, 괜찮으시겠어요. 선생님? 안 좋은 소리라도 듣게 되시면……!"
10027125-46 = "아니, 저, 그, 선생은 그렇다 쳐도 내 멘탈이 멘탈적으로 안 괜찮을 것 같은데?!"
10027125-47 = "[s1] \"외부의 시선이라는 건…… 생각보다 중요하니까.\"\n[s2] \"마음 굳게 먹자, 우리…….\""
10027125-50 = "으, 윽……!"
10027125-51 = "잠시만요. 저 심호흡 좀 할게요. 후우. 하아. 후우. 하아."
10027125-57 = "……사람을 무슨 저승사자 같은 취급을 하고 있는 것 같아 기분이 묘하긴 한데요……."
10027125-58 = "그러면, 지금부터 읽겠습니다. 잠시만 집중할 시간을 주세요."
10027125-69 = "좋아요……. 솔직한 감상을 이야기할 시간이군요."
10027125-75 = "후. 후후. 열심히 했어. 열심히 했다고. 그렇지만 열심히 했다고 해서 항상 좋은 결과가 나오는 게 아니라는 것 정도, 요즘은 유치원 아이들도 아는 세상이지. 후. 후후. 후후후……."
10027125-76 = "잊지 말아 주세요. 우리를 잊지 말아 주세요. 모든 것이 스러져 없어지더라도, 여기에 한 권의 책과 그것을 읽고 이야기했던 사람들이 있었다는 사실만은 기억해 주세요……."
10027125-78 = "……두 사람, 무슨 유언이라도 남기려는 건가요……?"
10027125-79 = "이왕 시간이라는 말이 나왔으니 하는 이야기입니다. 시간이라는 것만큼 그 가치를 쉽게 잊곤 하는 것도 없죠."
10027125-80 = "알고 있잖아요? 다들 미래에 대해 생각하고 걱정한다지만, 정말로 미래에 대해 진심으로 생각하는 사람은 드물죠."
10027125-81 = "과거 역시 마찬가지예요. 현재는 과거의 집대성이라고 이야기하지만, 과거를 명확한 의미 그대로 기억하려는 사람은 드물죠. 망각하고, 미화시켜, 추억의 저편으로 밀어 넣을 뿐이죠. 고통으로부터 자유로워지기 위해서요."
10027125-82 = "우리가 중요하게 생각하는 것은 어쩌면 현재뿐인지도 모르지만, 어떤 의미에서 현재란 존재하지 않아요. 존재하는 것은 무한히 다가올 미래와, 끊임없이 밀려나는 과거뿐. 현재란 그사이에 개념적으로 존재하는, 얇고 투명한 종이 같은 것이죠."
10027125-83 = "그렇기에 현재를 다루는 이야기는……. 과거에 대해서, 그리고 미래에 대해서 이야기하지 않으면 안 됩니다. 그것이 시간이라는, 망각하기 쉽고 망각하고 싶어 하지만 결코 도망칠 수 없는 그 무엇인가에 대한 예의이자 경의이죠."
10027125-84 = "이 이야기는, 그런 의미에서, <루나>의 과거에 대해 이야기하고 있어요. 동시에 미래에 대한 끈을 놓지 않으면서, 현재를 돌아보는 것을 멈추지 않죠."
10027125-85 = "이야기 자체는 어찌 보면 평이하고, 좋게 말해 무난하고 나쁘게 말하자면 큰 특색이 없지만…… 그 성실함은 분명히 눈에 띄는군요. 그것이 이 이야기의 가장 도드라지는 장점이겠지요."
10027125-86 = "인정하죠. 근래에 보기 드문, 성실하면서도 클래식한 이야기였다는 것을요. 그리고 나아가……."
10027125-90 = "……나아가……."
10027125-96 = "나아가……?"
10027125-97 = "그다음은, 뭐죠……?"
10027125-99 = "……."
10027125-103 = "[ns3] \"가끔은, 솔직함이 최고의 미덕이라고 하지…….\"\n[ns4] \"그것은 우리를 자유롭게 해방시켜 주니까…….\""
10027125-106 = "……!"
10027125-107 = "그래요. 좋아요! 선생님께서 그렇게 말씀하신다면……!"
10027125-108 = "흠. 크흠!"
10027125-109 = "……좋은 이야기였습니다. 그리고 충분한 시간이 주어졌다면, 어떤 결과가 나왔을지 기대되는 이야기이기도 했고요."
10027125-110 = "수고했어요. 지식해방전선."
10027125-112 = "이상하다. 나 지금 들을 리 없는 말을 들은 느낌이야."
10027125-113 = "그러게요. 메루 선배에게 굉장히 과분한 평가라고 생각해요."
10027125-115 = "큰맘 먹고 이야기한 건데 그렇게 반응한다 이거죠?!"
10027125-116 = "아니, 방금 나도 한 소리 들었다구?!"
10027125-122 = "이렇게 되었으니, 다음번 온리전의 장소와 일시를 알려드리죠. 나중에 메일을 확인해 두세요."
10027125-123 = "좋아. 다음 <루나> 온리전에서는, 완전히 다른 모습을 보여 주도록 하지."
10027125-124 = "그때에는 적어도 시간이 충분히 있을 테니까요!"
10027125-125 = "그러면, 너무 기대하지 않고 기다리도록 하죠. 건투를 빌어요. <지식해방전선>."
10027125-129 = "자, 그러면……."
10027125-130 = "돌아갈까요. 선배, 선생님?"
10027125-131 = "그럴까? 으아아, 오늘은 간만에 좀 푹 자야겠어……."
10027125-132 = "[s] \"나 이제부터 이틀은 잘 자신 있어…….\""
10027125-133 = "뭐, 그래도 이번 일……."
10027125-134 = "메루 선배가, 절 위해 루나의 완결권까지 만들 생각을 하다니…."
10027125-135 = "뭐랄까. 이번만큼은 저도 그게…… 그…… 무척이나 감탄을, 했달까. 감ㄷ……."
10027125-136 = "헤헹! 역시 그렇지? 돌아보고 나면 다 즐거운 추억이 되는 법이라니까!"
10027125-137 = "결과만 좋으면 전부 OK! 경사 났네, 경사 났어! 엔딩이야!"
10027125-138 = "……마지막까지 감상을 늘어놓을 짬을 주지 않는 게, 진짜 메루 선배답네요."
10027125-139 = "무엇보다 그 과정이란 거, 엄청 순탄했던 것도 아니잖아요? 선생님을 끌어들여서 나흘 동안 원고까지 돕게 만들었으면서!"
10027125-140 = "마, 마감 직전 만화가의 일상을 체험시켜 준 것뿐이야!"
10027125-141 = "반성 좀 하세요. 그 자체가 민폐라는 거잖아요."
10027125-142 = "사, 상호 협의였다고!"
10027125-143 = "아무리 협의를 했다고는 해도, 넘지 말아야 할 선이라는 게 있어요!"
10027125-144 = "반성 좀 하세요! 선생님께 얼마나 민폐를 끼쳐드린 건가요!"
10027125-145 = "나도 고생했는데?!"
10027125-146 = "반쯤은 자업자득이잖아요! 그리고 고생이라면 저도 했거든요?"
10027125-150 = "[ns] \"저기, 난 괜찮은데……?\""
10027125-151 = "선생님은 괜찮으셔도, 제가 안 괜찮아요! 거기 서세요, 메루 선배! 오늘이야말로 확실하게 한마디 해야겠어요!"
10027125-152 = "으아아아~ 후배가 선배 잡는다~ 잔소리 반대! 설교 반대!"
10027125-154 = "메~ 루~ 선~ 배~!"
10027125-162 = "(<지식해방전선>은 그렇게 서로 아웅다웅거리면서 목소리를 높여 가고 있었지만, 이번에는 그다지 걱정이 되지 않았다.)"
10027125-166 = "[ns] \"뭐어.\""
10027125-171 = "[ns] \"오늘도 평화롭구나~\""
10027125-173 = "학원 동인 이야기 ~두 명이 도달한 최종회~"
