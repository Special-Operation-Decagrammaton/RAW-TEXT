[translation]
1001205-1 = "트레이너도 함께"
1001205-2 = "밀레니엄 헬스장"
1001205-3 = "트레이너! 오셨군요."
1001205-4 = "기다리고 있었습니다."
1001205-5 = "오늘 몸 상태는 괜찮으신가요?"
1001205-6 = "[s] \"응? 좋은 것 같은데.\""
1001205-10 = "네, 정말 좋아 보이는군요."
1001205-11 = "제가 준비한 것을 <실행>하기에 최적의 상태이신 것 같습니다."
1001205-12 = "네? 뭘 실행하는 거냐고요?"
1001205-15 = "후훗, 그건 바로 이겁니다!"
1001205-16 = "(스미레가 건넨 핸드폰엔 트레이닝에 대한 스케쥴이 적혀있다.)"
1001205-17 = "[s] \"또 다른 트레이닝 스케쥴을 만든 거야?\""
1001205-18 = "아무래도 똑같은 스케쥴을 하시기엔 무리일 것 같아서요."
1001205-19 = "네? 지금 제가 하고 있는 트레이닝은 어떻게 하냐고요?"
1001205-20 = "그건…… 그것대로 해야겠죠?"
1001205-21 = "[s] \"그럼 하루에 트레이닝 스케쥴을 2개나 하겠다는 거야?\""
1001205-22 = "음……."
1001205-23 = "무슨 말씀인지 잘 이해가 안 되네요, 트레이너."
1001205-24 = "애초에 그 스케쥴은 절 위한 게 아닌걸요. 다시 한번 읽어보세요."
1001205-25 = "[s] 스미레의 말 대로, 스케쥴을 다시 확인해보자."
1001205-28 = "(트레이너의 트레이닝 스케쥴이라…… 이상한 점은…… 음?! 잠깐!)"
1001205-29 = "[s] \"여기 적힌 트레이너는 설마…?\""
1001205-30 = "네! 바로 [USERNAME] 트레이너를 위한 스케쥴입니다!"
1001205-31 = "후훗, 어떤가요? 마음에 드시나요?"
1001205-32 = "제가 그동안 쌓은 헬스 지식을 통해 심혈을 기울여 만든 스케쥴입니다!"
1001205-33 = "먼저, 트레이닝을 시작하기에 앞서 가벼운 스트레칭을 10분 정도로 적어두었고요."
1001205-34 = "그 이후엔 러닝 머신으로 워밍업을 약 20분 정도로 진행하고……."
1001205-35 = "[s1] \"자, 잠깐만!!\n[s2] \"이의 있음!!\""
1001205-36 = "네? 왜 그러시나요?"
1001205-37 = "네? 왜 그러시나요?"
1001205-38 = "음…… 역시 트레이너에겐 너무 쉬운 스케쥴인가요."
1001205-39 = "워밍업 후 가벼운 웨이트 운동 위주로만 스케쥴링을 했는데."
1001205-40 = "아참, 그럴까 봐 제가 다른 스케쥴도 하나 만들어 두었습니다."
1001205-44 = "자, 트레이너! 여길 보시면……."
1001205-45 = "[s] \"아, 아니야. 지금이 딱 좋은 것 같아!\""
1001205-46 = "음? 정말요?"
1001205-47 = "조금 못마땅한 표정이신데요."
1001205-48 = "[s] \"아냐! 지금이 너무 좋아! 역시 스미레는 최고!\""
1001205-49 = "아하하, 트레이너도 참."
1001205-50 = "자, 그럼 오늘은 특별히!"
1001205-51 = "제가 트레이너의 <트레이너>가 되어 드리겠습니다."
1001205-52 = "네? 제 트레이닝은 어떻게 하냐고요?"
1001205-53 = "역시 트레이너, 절 이렇게 신경써주셔서 감사합니다."
1001205-54 = "물론, 트레이너가 오시기 전에 오늘치 운동량은 이미 끝내 두었습니다."
1001205-55 = "음? 표정이 조금 안 좋아 보이시는데……."
1001205-56 = "아하! 빨리 트레이닝을 하고 싶으신거죠?"
1001205-57 = "알겠습니다! 그럼 지금 바로 시작하죠!"
1001205-58 = "자자, 어서요~!"
1001205-60 = "(결국, 스미레의 스케쥴 대로 스트레칭을 한 뒤 러닝 머신을 달렸다.)"
1001205-62 = "하아, 하아……."
1001205-63 = "가벼운 러닝은 괜찮을 것 같아 트레이너와 함께 뛰었는데."
1001205-64 = "앞서 트레이닝을 했던 탓인지 금방 지치네요."
1001205-65 = "트레이너도 힘들어 보이는데, 잠깐만 쉴까요?"
1001205-66 = "[s] \"하아, 하아……. 그러자.\""
1001205-69 = "― 어때요. 트레이너, [wa:3200]운동, [wa:1300]재미있죠?"
1001205-71 = "― 건강해진다는 느낌이 [wa:1500]들지 않나요?"
1001205-74 = "― 어, [wa:1000]어……. [wa:1500]너, [wa:500]너무 쳐다보지 말아 주세요.[wa:500]"
1001205-76 = "― (트레이닝 중에는 흉한 모습이어서…….)"
1001205-79 = "― 어, [wa:1000]어딜 보고…… 계신 건가요?"
1001205-82 = "― 트레이너. [wa:2500]부탁이 있어요."
1001205-84 = "― 앞으로도, [wa:2500]계속 함께, 운동하시죠."
1001205-87 = "― 저는 [wa:1000]트레이너가 [wa:1000]건강해졌으면 좋겠습니다."
1001205-89 = "― 이, [wa:1000]이유? [wa:2000]그, [wa:500]그건…… [wa:3000]후훗."
1001205-92 = "― 맞춰보세요."
1001205-95 = "(이후, 스미레의 스케쥴대로 트레이닝을 받으며 남은 운동을 마쳤다.)"
1001205-97 = "밀레니엄 학원"
1001205-98 = "트레이너, 오늘 저와 함께한 트레이닝은 즐거우셨나요?"
1001205-99 = "[s3] \"하아, 하아…… 으, 응.\"\n[s4] \"후우, 아직 부족해.\""
1001205-100 = "후훗, 즐거우셨다니 다행입니다."
1001205-101 = "열심히 고민해서 만든 스케쥴이거든요."
1001205-102 = "?!"
1001205-103 = "대, 대단해요. 트레이너."
1001205-104 = "역시, 혹시 몰라 준비했던 강도 높은 트레이닝 스케쥴로 바꿔야……."
1001205-105 = "[s5] \"아, 아하하. 장난이야! 장난!\""
1001205-106 = "후훗, 저도 장난입니다."
1001205-107 = "아무튼, 함께 트레이닝을 하니 전보다 더욱더 즐거웠던 것 같네요."
1001205-108 = "트레이너가 여러 일로 바쁘신 것은 알고 있으니, 종용하진 않겠지만."
1001205-109 = "가능하다면 앞으로도 계속 함께 운동해요."
1001205-110 = "트레이너."
