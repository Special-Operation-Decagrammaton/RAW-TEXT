[translation]
10055100-1 = "후일담;로맨틱 크루징(진짜)"
10055100-3 = "키시싯! 선생!"
10055100-4 = "잘 즐기고 있나? 조금 늦긴 했지만, 약속대로 크루즈 여행을 마련해줬지!"
10055100-5 = "[s1] \"아, 응…….\"\n[s2] \"준비해 준 거는 오디세이아지만…….\""
10055100-8 = "결국은, 이러한 대접 역시 만마전이기에 받을 수 있는 것."
10055100-9 = "즉, 실질 만마전에서 준비한 것과 다르지 않다!"
10055100-10 = "지당하신 말씀입니다, 대만마전 의장님!"
10055100-11 = "선생님도 부~디~! 자기 집처럼 편하게 지내 주세요!"
10055100-12 = "키시싯! 그 훌륭한 태도를 미뤄보아, 네가 이 트라이던트의 부장이겠군."
10055100-13 = "……네? 음, 비슷한 거라 보셔도 좋습니다, 헤헤."
10055100-14 = "지금 이 몸은 기분이 좋다. 오디세이아에서 무례하게 가한 선제공격은 없던 일로 해주마!"
10055100-15 = "성은이 망극합니다!"
10055100-17 = "……부장의 비슷한 거는 뭘까?"
10055100-18 = "바보겠죠. 아마도."
10055100-27 = "오옷!"
10055100-28 = "여기가 바로 그 유명한 오디세이아 해양학원!"
10055100-29 = "그~렇다~! 해도……."
10055100-30 = "듣던 것보다 살짝 작은 느낌인데, 역시 소문은 소문이라는 걸까요?"
10055100-31 = "아, 저희 트라이던트는 치안 임무로 별동 활동 중이라서요."
10055100-32 = "<학원>이라면, 지금쯤 원양 항해에서 돌아오고 있지 않으려나요?"
10055100-33 = "학원 전체가요?! 항해에 나가 있는 건가요?! 소문 그 이상이네요!"
10055100-34 = "아, 혹시 사진 찍어도 괜찮을까요?"
10055100-35 = "아…… 일단은, 저희는 선도부 같은 거라, 기함 <로도스 호>만큼은 아니라도 여기에도 보안 구역이 꽤 있어서요."
10055100-36 = "아, 아뇨, 오디세이아 분은 처음 만나서 함께 사진을 찍고 싶었어서요!"
10055100-37 = "네, 넷?! 저요?! 그…… 하나도 안 꾸며서, 부끄러운데……."
10055100-38 = "그 자연스러운 모습을 찍고 싶었던 거라서요!"
10055100-39 = "아, 물론, 강요는 아니에요! 정말 싫으시면, 말씀해 주세요."
10055100-40 = "아, 저, 그럼……."
10055100-41 = "브이."
10055100-50 = "오옷! 엄청 귀여워요! 좋은 사진을 찍었네요!"
10055100-51 = "같이 셀카 찍어도 될까요?"
10055100-52 = "아, 네."
10055100-59 = "감사합니다! 인생에 보물이 늘었네요"
10055100-60 = "어라……?"
10055100-61 = "으으음~ 역시, 사진으로 보니 조금 낯이 익은데~"
10055100-65 = "아! 기억났다! 아까 배에서 싸울 때, 반대편에 계셨죠?"
10055100-66 = "그…… 사실, 맞아요."
10055100-67 = "몰랐다고 변명이 되지는 않지만……."
10055100-68 = "오오! 그러면, 꼭 인터뷰하고 싶어요!"
10055100-69 = "……네?"
10055100-70 = "역시 생생한 무용담은 좀처럼 듣기 힘들잖아요? 게다가 본인의 이야기는 더더욱이요!"
10055100-71 = "바다에 나타난 흉악한 해적을 물리친 소감이라든지! 들어보고 싶은데요!"
10055100-72 = "……죄송한데, 그 해적 아니신가요?"
10055100-75 = "선생, 여기 있었네?"
10055100-76 = "아니면 혹시 날 찾은 거야?"
10055100-77 = "[s3] \"이번에는 사츠키가 맹활약했지.\"\n[s4] \"정말 고생 많았어.\""
10055100-80 = "맞아!"
10055100-81 = "진짜로, 진짜로~!"
10055100-82 = "엄청 무섭고 힘들었단 말이야!"
10055100-83 = "여기서 백배로 즐기지 않으면 수지가 안 맞아!"
10055100-88 = "당연히 선생도 어울려 줄 거지?"
