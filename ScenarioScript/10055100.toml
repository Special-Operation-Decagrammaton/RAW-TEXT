[translation]
10055100-1 = "後日談その1;ロマンティック・クルージング（本当）"
10055100-3 = "キシシッ！先生よ。"
10055100-4 = "ちゃんと楽しんでいるか？遅くなったが、約束通りクルージングの旅を用意したぞ！"
10055100-5 = "[s1] \"ああ、うん。\"\n[s2] \"用意してくれたのはオデュッセイアだけど……。\""
10055100-8 = "結局こういう待遇も万魔殿であるがゆえに受けられるのだ。"
10055100-9 = "つまり万魔殿が用意したものと変わりない！"
10055100-10 = "ごもっともです！万魔殿の議長様！"
10055100-11 = "先生も、ど～か我が家のように！ごゆっくりお過ごしくださいね！"
10055100-12 = "キシシッ！その素晴らしい心構え、きっとお前がトライデントの部長なのだろう。"
10055100-13 = "……えっ？ああ、まあそんな感じです。へへっ。"
10055100-14 = "いま私は気分がいい。オデュッセイアの無礼な先制攻撃はなかったことにしてやろう。"
10055100-15 = "誠にありがとうございます！！"
10055100-17 = "……部長、でいいのかしら？"
10055100-18 = "ただのバカなんでしょう、きっと。"
10055100-27 = "おおっ！"
10055100-28 = "ここがあの、オデュッセイア海洋高等学校！"
10055100-29 = "とはいえ……。"
10055100-30 = "聞いていた話よりは少し小さい気がするのですが、やっぱり噂は誇張されがちなんでしょうか？"
10055100-31 = "あ、私たちは主に治安要員で、別で活動してるんです。"
10055100-32 = "[ruby=・]学[/ruby][ruby=・]園[/ruby][ruby=・]の[/ruby][ruby=・]方[/ruby]は、今頃遠征から帰路につく頃じゃないでしょうか？"
10055100-33 = "学園の方……！？全体規模で航海に出てるんですか！？噂以上でした！"
10055100-34 = "あ、よければ写真撮っても大丈夫ですか？"
10055100-35 = "撮影は……ごめんなさい。#n私たちはゲヘナでいう風紀委員会みたいな組織でして。#nセキュリティ上、あまりこの船の写真は撮らないでいただけると……。"
10055100-36 = "あ、いえ、オデュッセイアの方は初めてなので、一緒に写真を撮りたいと思って！"
10055100-37 = "えっ、わ、私ですか！？ちょっと、いつもの格好だから、恥ずかし……。"
10055100-38 = "そのいつも通りの姿をカメラに収めたいんです！"
10055100-39 = "あっもちろん、強制ではありません！本当に嫌でしたら言ってくださいね。"
10055100-40 = "あっ……じゃあ。"
10055100-41 = "ピース。"
10055100-50 = "わあ！すごく可愛いです！いいショットです！"
10055100-51 = "二人で撮っても大丈夫ですか？"
10055100-52 = "ああ、はい。"
10055100-59 = "ありがとうございます！人生のお宝がまた一つ増えました！"
10055100-60 = "あれ……？"
10055100-61 = "ん～……写真で見ると、なんかどこかでお会いしたような。"
10055100-65 = "あっ、思い出した！さっき船で戦った時の方ですよね？"
10055100-66 = "あ……実は、はい。"
10055100-67 = "気付かなかったので……は言い訳にならないかもしれませんが……。"
10055100-68 = "おお！では是非インタビューをお願いしたいです！"
10055100-69 = "……えっ？"
10055100-70 = "ナマで武勇伝なんてそうそう聞けないので！しかもご本人からなんて尚更です！"
10055100-71 = "海に現れた凶悪な海賊をやっつけた感想とか！お話を聞けたらなと思います！"
10055100-72 = "あの……海賊の方じゃ、なかったんですか？"
10055100-75 = "先生、ここにいたのね。"
10055100-76 = "それとも、私のこと探してたのかしら？"
10055100-77 = "[s3] \"今回は大活躍したね。\"\n[s4] \"本当にお疲れ様。\""
10055100-80 = "そうよ！？"
10055100-81 = "私すっごく……。"
10055100-82 = "怖くて大変だったんだから！？"
10055100-83 = "ここで200パーセント楽しまなきゃ損よ。"
10055100-88 = "当然、先生も付き合ってくれるわね？"
