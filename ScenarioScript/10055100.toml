[translation]
10055100-1 = "後日談;真．浪漫巡航"
10055100-2 = ""
10055100-3 = "嘰嘻嘻！老師！"
10055100-4 = "玩得開心嗎？雖然晚了一點，但本大人可是照約定安排了郵輪之旅！"
10055100-5 = "[s1] 「啊，嗯……」\n[s2] 「雖然準備這些的是奧德賽……」"
10055100-8 = "說到底，能受到這種款待，也是因為我們是萬魔殿。"
10055100-9 = "也就是說，這和萬魔殿準備的根本沒兩樣！"
10055100-10 = "您說得完全正確，偉大的萬魔殿議長大人！"
10055100-11 = "老師也請務～必～把這裡當成自己家，好好放鬆一下！"
10055100-12 = "嘰嘻嘻！從這非凡的態度來看，你想必就是三叉戟的部長吧。"
10055100-13 = "……咦？啊，您要說是類似部長的人也可以，嘿嘿。"
10055100-14 = "本大人現在心情很好，奧德賽無禮的先制攻擊就當作沒發生過吧！"
10055100-15 = "真是感激不盡！"
10055100-16 = ""
10055100-17 = "……「類似部長」是什麼啊？"
10055100-18 = "大概就是個笨蛋吧。"
10055100-20 = ""
10055100-21 = ""
10055100-22 = ""
10055100-23 = ""
10055100-24 = ""
10055100-25 = ""
10055100-26 = ""
10055100-27 = "哦哦！"
10055100-28 = "這裡就是那所鼎鼎大名的奧德賽海洋高中！"
10055100-29 = "話～是～這麼說……"
10055100-30 = "感覺比聽說的還要小一點耶……果然傳聞總是比較誇張嗎？"
10055100-31 = "啊，我們三叉戟主要負責管理治安，所以是另外分開行動的。"
10055100-32 = "「學園」那邊的話，現在差不多正在結束遠洋返航吧？"
10055100-33 = "整所學園都出海航行了嗎！？比傳聞還厲害耶！"
10055100-34 = "啊，請問可以拍照嗎？"
10055100-35 = "啊……我們算是類似風紀委員會的組織，所以可能有點……#n雖然比不上旗艦「羅德斯號」，但這裡也有不少保全區域……"
10055100-36 = "啊，不是啦，因為這是我第一次見到奧德賽的人，想跟你一起拍張照！"
10055100-37 = "咦，咦咦！？我嗎！？#n那個……我完全沒打扮，感覺會很丟臉……"
10055100-38 = "我就是想拍下你最自然的樣子嘛！"
10055100-39 = "啊，當然我也不會勉強你！#n如果真的不願意的話請跟我說。"
10055100-40 = "啊，那個，那就……"
10055100-41 = "耶。"
10055100-42 = ""
10055100-44 = ""
10055100-45 = ""
10055100-46 = ""
10055100-47 = ""
10055100-48 = ""
10055100-49 = ""
10055100-50 = "哦哦！超可愛的！這張拍得真好！"
10055100-51 = "可以一起自拍嗎？"
10055100-52 = "啊，好的。"
10055100-53 = ""
10055100-55 = ""
10055100-56 = ""
10055100-57 = ""
10055100-58 = ""
10055100-59 = "謝謝你！人生又多了一件寶物！"
10055100-60 = "咦……？"
10055100-61 = "唔嗯～從照片上看，果然有點眼熟耶～"
10055100-62 = ""
10055100-64 = ""
10055100-65 = "啊！想起來了！剛才在船上交戰的時候，你是站在對面那一方的吧？"
10055100-66 = "那個……其實是的。"
10055100-67 = "雖然說不知情也不能當作藉口……"
10055100-68 = "哦哦！那麼，還請務必接受我的採訪！"
10055100-69 = "……咦？"
10055100-70 = "畢竟很難得能聽到第一手的英勇事蹟嘛！#n更別說是當事人親口說的了！"
10055100-71 = "像是擊退出現在海上的兇惡海盜的感想之類的！我很想聽聽看！"
10055100-72 = "……不好意思，你們不就是那群海盜嗎？"
10055100-74 = ""
10055100-75 = "老師，原來你在這裡啊？"
10055100-76 = "還是說，你是在找我？"
10055100-77 = "[s3] 「這次皐月大顯身手了呢。」\n[s4] 「真的辛苦你了。」"
10055100-80 = "就是說啊！"
10055100-81 = "真的，真的是～！"
10055100-82 = "超級可怕又超級辛苦的耶！"
10055100-83 = "不在這裡玩個一百倍回本，那可就虧大了！"
10055100-84 = ""
10055100-86 = ""
10055100-87 = ""
10055100-88 = "老師當然也會陪我吧？"
