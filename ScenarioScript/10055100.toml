10055100-2 = ""
10055100-3 = "Kihehe! Sensei!"
10055100-4 = "Are you enjoying your luxury cruise? It may be a little late, but I always deliver on my promises!"
10055100-5 = "[s1] \"Ah, yeah... It's great...\"\n[s2] \"But Odyssey's the one who arranged it for us...\""
10055100-8 = "And why do you think they did that? Because we're the Pandemonium Society, of course!"
10055100-9 = "Therefore, you can technically say that we of the Pandemonium Society are the ones who made this happen!"
10055100-10 = "Yes! You're absolutely correct, great Chairman!"
10055100-11 = "Please, make yourself right at home, Sensei!"
10055100-12 = "Kihehe! Judging by your excellent attitude, you must be the president of Trident."
10055100-13 = "...M-Me? Sure, something like that, yeah! I am! Heh. Heh."
10055100-14 = "Since I'm in a good mood, I'll forgive you for Odyssey's insolent surprise attack!"
10055100-15 = "I am deeply honored!"
10055100-16 = ""
10055100-17 = "...What does she mean by \"something like that,\" exactly?"
10055100-18 = "That she's another dummy would be my best bet."
