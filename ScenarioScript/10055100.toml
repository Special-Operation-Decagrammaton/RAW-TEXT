10055100-27 = "Ooh!"
10055100-28 = "So this is the famous Odyssey Maritime Academy!"
10055100-29 = "That said..."
10055100-30 = "It's a little smaller than the rumors say! Hyperbole is just in human nature, I guess!"
10055100-31 = "Oh, no, no. Trident is a small, separate crew that operates independently to oversee security."
10055100-32 = "The academy itself... Well, our mothership and her fleet should be returning from their voyage now. They've been gone a long time."
10055100-33 = "Your entire academy is out at sea?! Now that's beyond what I imagined!"
10055100-34 = "Do you think I could take some pictures? Please!"
10055100-35 = "As the Prefect Committee, I'm afraid we can't let you do that. Even if this isn't our flagship, the Rhodes, there are a lot of sensitive and restricted areas aboard."
10055100-36 = "Ah, wait! That's not what I meant! I meant you! You're the first person from Odyssey I've ever met, so I wanted a pic together!"
10055100-37 = "W-With me?! I'm a little embarrassed to be in front of a camera, though... I barely put effort into getting ready today..."
10055100-38 = "But that's why I wanted to capture this moment! I wanted to get you exactly as you are!"
10055100-39 = "You don't have to at all, though! I just wanted to ask, so no pressure!"
10055100-40 = "Oh, um, then..."
10055100-41 = "Cheese."
