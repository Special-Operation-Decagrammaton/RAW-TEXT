[translation]
10055100-1 = "ย้อนวันวาน;ล่องเรือสำราญสุดโรแมนติก (ของจริง)"
10055100-2 = ""
10055100-3 = "คิกคิกคิก! ครู!"
10055100-4 = "เพลิดเพลินดีรึเปล่า? ถึงจะช้าไปหน่อย แต่เราก็จัดทริปล่องเรือสำราญให้ตามสัญญาแล้วนะ!"
10055100-5 = "[s1] \"อ้อ อืม...\"\n[s2] \"แต่คนที่เตรียมให้คือโอดิสซีย์ต่างหาก...\""
10055100-8 = "แต่สุดท้ายแล้ว ที่ได้รับการดูแลแบบนี้ก็เพราะว่าเป็นแพนเดโมเนียม โซไซตี้"
10055100-9 = "พูดอีกอย่างก็คือ ในทางปฏิบัติแล้วมันก็เหมือนกับว่าแพนเดโมเนียม โซไซตี้เป็นฝ่ายจัดเตรียมให้นั่นละ!"
10055100-10 = "ถูกต้องที่สุดค่ะ ท่านประธานแห่งแพนเดโมเนียม โซไซตี้ผู้ยิ่งใหญ่!"
10055100-11 = "คุณครูก็เชิญตามสบายเลยนะคะ ทำตัวเหมือนอยู่บ้านตัวเองได้เลยค่ะ!"
10055100-12 = "คิกคิกคิก! ดูจากท่าทีอันยอดเยี่ยมนั่นแล้ว เธอคงเป็นหัวหน้าของไทรเดนต์สินะ"
10055100-13 = "คะ...? อืม จะมองว่าคล้ายๆ กันก็ได้ค่ะ แหะๆ"
10055100-14 = "ตอนนี้เราอารมณ์ดี เรื่องที่โอดิสซีย์โจมตีเราอย่างไร้มารยาท เราจะถือว่าไม่เคยเกิดขึ้นก็แล้วกัน!"
10055100-15 = "เป็นพระคุณอย่างสูงเลยค่ะ!"
10055100-16 = ""
10055100-17 = "อะไรที่คล้ายๆ กับหัวหน้านี่คือยังไงนะ...?"
10055100-18 = "คงเป็นพวกทึ่มๆ ละมั้งคะ อาจจะนะ"
10055100-20 = ""
10055100-21 = ""
10055100-22 = ""
10055100-23 = ""
10055100-24 = ""
10055100-25 = ""
10055100-26 = ""
10055100-27 = "โอ้โฮ!"
10055100-28 = "ที่นี่ก็คือโรงเรียนการเดินเรือโอดิสซีย์อันเลื่องชื่อ!"
10055100-29 = "ถึงจะ... พูดแบบนั้นก็เถอะ..."
10055100-30 = "รู้สึกจะเล็กกว่าที่ได้ยินมานิดหน่อย หรือว่าข่าวลือก็เป็นแค่ข่าวลือกันนะคะ?"
10055100-31 = "อ๋อ พวกเราไทรเดนต์แยกออกมาปฏิบัติภารกิจรักษาความสงบน่ะค่ะ"
10055100-32 = "ถ้าเป็น <โรงเรียน> ตอนนี้น่าจะกำลังกลับจากการเดินเรือในมหาสมุทรแล้วนะคะ"
10055100-33 = "ทั้งโรงเรียนเลยเหรอคะ?! ออกเดินเรือกันอยู่เหรอคะ?! ยิ่งกว่าข่าวลือเสียอีกนะคะเนี่ย!"
10055100-34 = "เอ่อ ขอถ่ายรูปได้มั้ยคะ?"
10055100-35 = "อ่า... พวกเราทำหน้าที่คล้ายกับคณะกรรมการวินัยค่ะ ถึงจะไม่เท่าเรือธง <เรือโรดอส> แต่ที่นี่ก็มีพื้นที่หวงห้ามอยู่พอสมควรค่ะ"
10055100-36 = "อ๊ะ... ไม่ใช่ค่ะ นี่เป็นครั้งแรกที่ได้เจอคนจากโอดิสซีย์ ก็เลยอยากขอถ่ายรูปร่วมกันน่ะค่ะ!"
10055100-37 = "คะ... คะ?! ฉันเหรอคะ?! คือ... ฉันไม่ได้เตรียมตัวมาเลย น่าอายจัง..."
10055100-38 = "ฉันอยากถ่ายภาพที่ดูเป็นธรรมชาติแบบนี้ละค่ะ!"
10055100-39 = "อ้อ แน่นอนว่าไม่ได้บังคับนะคะ! ถ้าไม่อยากถ่ายจริงๆ ก็บอกได้เลยค่ะ"
10055100-40 = "อ่า คือ... ถ้างั้น..."
10055100-41 = "ชูสองนิ้วนะคะ"
10055100-42 = ""
10055100-44 = ""
10055100-45 = ""
10055100-46 = ""
10055100-47 = ""
10055100-48 = ""
10055100-49 = ""
10055100-50 = "โอ้โฮ! น่ารักมากเลยค่ะ! ได้รูปดีๆ แล้วละค่ะ!"
10055100-51 = "ขอถ่ายเซลฟี่ด้วยได้มั้ยคะ?"
10055100-52 = "อ่า ได้สิคะ"
10055100-53 = ""
10055100-55 = ""
10055100-56 = ""
10055100-57 = ""
10055100-58 = ""
10055100-59 = "ขอบคุณค่ะ! ได้สมบัติล้ำค่าในชีวิตเพิ่มมาอีกแล้วละค่ะ"
10055100-60 = "เอ๋...?"
10055100-61 = "อืม~ พอดูในรูปแล้ว รู้สึกคุ้นหน้าจริงๆ ด้วย~"
10055100-62 = ""
10055100-64 = ""
10055100-65 = "อ๊ะ! จำได้แล้ว! ตอนที่สู้กันบนเรือเมื่อกี้ คุณอยู่ฝ่ายตรงข้ามใช่มั้ยคะ?"
10055100-66 = "คือ... จริงๆ ก็ใช่ค่ะ"
10055100-67 = "ถึงจะอ้างว่าไม่รู้ก็แก้ตัวไม่ขึ้นอยู่ดี..."
10055100-68 = "โอ้! ถ้างั้นฉันอยากสัมภาษณ์ให้ได้เลยค่ะ!"
10055100-69 = "คะ...?"
10055100-70 = "ก็เรื่องวีรกรรมด้นสดแบบนี้ไม่ได้หาฟังกันง่ายๆ นี่คะ? ยิ่งเรื่องที่เจ้าตัวเป็นคนเล่าเองแล้ว ยิ่งหายากสุดๆ เลยค่ะ!"
10055100-71 = "อย่างความรู้สึกหลังจากปราบโจรสลัดสุดโหดที่ปรากฏตัวกลางทะเลได้สำเร็จ...! ฉันอยากฟังเรื่องอะไรแบบนั้นน่ะค่ะ!"
10055100-72 = "ขอโทษนะคะแต่ว่าคุณก็คือโจรสลัดที่ว่านั่นไม่ใช่เหรอคะ?"
10055100-74 = ""
10055100-75 = "อยู่ที่นี่เองเหรอ ครู?"
10055100-76 = "หรือว่ากำลังตามหาฉันอยู่?"
10055100-77 = "[s3] \"ครั้งนี้ซัตสึกิทำผลงานได้ดีมากเลยนะ\"\n[s4] \"คราวนี้ก็เหนื่อยเลยสินะ\""
10055100-80 = "ใช่!"
10055100-81 = "เหนื่อยมากๆ จริงๆ นั่นแหละ~!"
10055100-82 = "ทั้งน่ากลัวทั้งเหนื่อยสุดๆ ไปเลย!"
10055100-83 = "ถ้าไม่สนุกให้เต็มที่เป็นร้อยเท่าที่นี่ ก็ไม่คุ้มกับที่ลำบากมาหรอก!"
10055100-84 = ""
10055100-86 = ""
10055100-87 = ""
10055100-88 = "ครูเองก็จะมาสนุกด้วยกันใช่มั้ย?"
