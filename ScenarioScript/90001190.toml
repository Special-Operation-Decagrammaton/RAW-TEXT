[translation]
90001190-1 = "제19화;강철대륙"
90001190-4 = "이런, 이런, 이런. 뭘 하고 있나 했더니, 아직도 거기에 머무르고 있었군요."
90001190-5 = "[s] \"……!\""
90001190-9 = "왕녀여. 아니, 아리스. 잠시 이쪽으로……."
90001190-10 = "무슨 일입니까, 케이?"
90001190-11 = "지금 저 아이들에게 우리의 모습을 보여주는 건, 어딘가 위험할 것 같습니다."
90001190-16 = "아, 아아아아, 안녕, 하세요! 그리고 조심하시는 게, 좋을 거예요! 우, 우리는 지금부터……."
90001190-17 = "당신들에게 엄청 무서운 일을, 저지를 거니까요!"
90001190-18 = "아직도 이런 통신을 꼭 보내야 하는지 의문이 들기는 하지만, 소프가 하자고 했으니까 말이죠……."
90001190-19 = "그래! 그러니까 우리는 지금부터……."
90001190-24 = "당신들 모두에게! 선전포고를 하겠다는 거야!"
90001190-27 = "선전?"
90001190-28 = "포고?"
90001190-30 = "……들어 보도록 하죠. 그보다, 마침내 네차흐를 만들어낸 것 같던데요?"
90001190-35 = "아, 아니거든요?! 네차흐, 네차흐 쨩은 이미 한참 오래전에 완성되어 있었거든요……???"
90001190-36 = "그래! 우리는 단지 네차흐가 <강철대륙>이 될 때까지, 조금 모습을 숨겨 두고 있었을 뿐이라고!"
90001190-37 = "아아, 이게 얼마나 대단하고 비할 데 없는 위업인지, 조금도 이해하지 못하겠죠."
90001190-38 = "그거야 당신들의 수준을 생각하면 당연한 것이겠지만, 그래도 안타깝다 못해 동정심이 들 지경이네요."
90001190-40 = "강철대륙, 이라니……?"
90001190-41 = "어라, 그 츠카츠키 리오도 여기까지는 알 수 없었던 건가? 생각해 보면 당연한 일이겠지만 말이야."
90001190-42 = "잘했어, 아인! 역시 아인이네! 상상도 하지 못한 일을 태연하게 저지르는 것이야말로, 우리가 해야 할 일이니까!"
90001190-43 = "에, 에헤헷. 고마워요, 소프. 앞으로도 열심히 할게요……!"
90001190-44 = "강철대륙! 그것은!"
90001190-45 = "네, 네차흐 쨩의 발전된 모습 그 자체이자……"
90001190-46 = "그 <금지된 힘>을 사용해서, 접촉하는 물질을 변환시켜, 스스로의 영역을 넓혀 가는 금속의 대륙……!"
90001190-47 = "[s] \"스스로를 넓혀 가는, 금속 대륙……?\""
90001190-48 = "이해력이 부족한 당신들도 이해할 수 있도록, 쉽게 이야기해 드리죠."
90001190-49 = "강철대륙을 이루고 있는 것은, 당신들의 표현을 빌리자면, <이름없는 신들의 힘>입니다."
90001190-50 = "그, 그리고 그 힘의 중요한 특징 중 하나는…… 물질의 구성을 그, 근본적으로 바꾸어 버릴 수 있다는 데에 있죠……."
90001190-51 = "여기에서 문제! 그렇다면 그 힘을 바탕으로 만들어진 구조체가, 주위의 다른 물질과 접촉하면 무슨 일이 일어날까?"
90001190-53 = "설마……!"
90001190-54 = "주위에 닿는 모든 물질을, 자기와 같은 구성 성분으로……?!"
90001190-56 = "맞아. 바로 그거야. 앞으로 강철대륙에 닿는 것은, 무엇이든 강철대륙 그 자체가 되어 버리는 거지!"
90001190-57 = "주위를 모두 먹어 치워가며 스스로를 넓히는, 무적의 대륙이라고!"
90001190-58 = "그렇습니다. 거기에 또 하나, 아무 준비 없이 강철대륙에 들어오면 말이죠?"
90001190-59 = "그 즉시…… 강철대륙과 하나가 되어서, 영원히 돌아갈 수 없게 될 거예요……!"
90001190-60 = "아인? 소프? 오르? 뭔가 도와줄 부분이라도 있나요?"
90001190-61 = "어, 언니?! 아뇨, 괜찮아요! 언니는 이런 거 신경 안 쓰셔도 돼요! 저희가 다 할게요!"
90001190-62 = "강철대륙이 어디까지 자신을 증폭시킬 수 있는지 궁금하지 않습니까? 여기에서 반전 하나. 우리는 궁금해요. 왜냐하면–"
90001190-63 = "강철대륙……. 네차흐 쨩의 한계는, 저희들도 잘 모르니까요……!"
90001190-64 = "그런 거야! 어디까지 커질 수 있을지 기대되네!"
90001190-65 = "우리들의 네차흐…… 강철대륙은, 주위에 있는 것을 닥치는대로 먹어 치우면서 그 크기를 키워 갈 거고!"
90001190-66 = "그리고 머지않아, 키보토스 역시 마찬가지가 되겠지요!"
90001190-67 = "엄청나죠? 대단하죠? 놀라서 말도 안 나올 지경이죠, 그렇죠?!"
90001190-68 = "[s] \"……한 가지, 묻고 싶은 것이 있어.\""
90001190-69 = "뭔데? 지금은 선전포고 중이니까, 특별히 대답해 줄게."
90001190-70 = "[s1] \"너희는 키보토스를 강철대륙으로 만들어서, 뭘 하려는 거야?\"\n[s2] \"혹시 사라진 데카그라마톤의 부활?\""
90001190-73 = "이, 이 어른 녀석……! 그분의 이름을 그렇게 함부로 부르지 마! 그건 말이야! 당신이 감히 입에 올리기도 황송한, 신성한 열 글자의 이름이라고!"
90001190-74 = "……여러 가지 의미로 대단하네요. 샬레의 선생님."
90001190-75 = "기다리세요…… 두고 보세요……! 그때가 되면, 아무도 그 분의 뜻을 함부로 이야기하지 못하게 될 테니……!"
90001190-76 = "그래! '믿지 않는다'를 '믿고 싶지 않다'로 바꿔 줄 테니까!"
90001190-77 = "그때 가서 후회해도, 조금도 안 봐 줄 거라구요~? 어차피 키보토스는, 우리의 계산대로라면……."
90001190-78 = "앞으로 3일 정도면 모두, 강철대륙으로 변해 버릴 테니까(요)!"
90001190-85 = "[ns] \"키보토스가, 강철대륙으로 변해 버릴 거라고……?\""
90001190-87 = "……다른 알지도 못하는 누군가가 그런 말을 했다면, 과대망상자의 헛소리라고 흘려 넘겼겠지만."
90001190-88 = "다른 누구도 아닌 데카그라마톤의 엔지니어들이 한 말이니, 가볍게 볼 수도 없겠네요."
90001190-89 = "그렇지만 어떻게 하지? 아무 준비 없이 강철대륙에 들어가면……."
90001190-90 = "네. 그 즉시 강철대륙과 하나가 되어서, 돌아갈 수 없게 될 거라고 그 아이들은 이야기했습니다."
90001190-95 = "아마 그럴 일은 없을 거에요. 강철대륙으로 변하는 건, 무기물뿐일 테니까요."
90001190-96 = "[s] \"케이!\""
90001190-97 = "그러고 보니, 조금 전에는 아리스와 함께 모습을 감췄더군요. 일부러였나요?"
90001190-98 = "……그 셋과 지금 마주쳤다가는, 여러모로 번거로운 일이 될 것 같았으니까요."
90001190-99 = "아무튼, 사정은 모두 듣고 있었어요. 한마디로 말해……."
90001190-100 = "우습지도, 않더군요."
90001190-101 = "저, 정말입니까. 케이?!"
90001190-102 = "그래요, 왕녀…… 아리스. 그건 그저 이름 없는 신들의 힘이 열화된 채 응용되고 있는 것일 뿐이에요."
90001190-103 = "오오…… 믿음직해! 이것이 바로 아군이 된 적 보정!"
90001190-104 = "아니, 그거 보통 약해지잖아요……."
90001190-105 = "아, 그런 게임의 상식…… 케이 쨩도 알고 있었던 거구나……. 뭔가, 기쁘네……."
90001190-106 = "……? 아, 앗차!"
90001190-108 = "이미 선생님께서도 말씀하신 것이지만, 이름 없는 신들의 힘 중 대표적인 것은 물질 재구축이죠."
90001190-109 = "그래. 프로토콜 ATRAHASIS도 그런 것이었지."
90001190-110 = "네. 그랬었죠. 아무튼 이름 없는 신들의 힘에는, 파동과 물질 사이의 연관관계를 근본적으로 변화시킬 수 있는 힘이 깃들어 있어요."
90001190-111 = "나는 그것을 데이터의 <수집>과 <변형>으로 해석했는데……."
90001190-112 = "근본적인 부분에 차이는 없습니다. 물질은 결국 에너지이고, 에너지는 정보값을 가지니까요."
90001190-113 = "그러니, 저 강철대륙이라는 현상과 일곱 번째 예언자라는 네차흐에게 그렇게까지 대단할 것은 없습니다."
90001190-114 = "프로토콜 ATRAHASIS에 비하면 그야말로 기초적인 것이죠. 단지……."
90001190-115 = "[s] \"단지?\""
90001190-116 = "뭐어, 이렇게 대규모로 물질 재구축을 일으키고 있다는 점만은, 무시할 수 없는 일이겠네요."
90001190-117 = "그리고 우리가 강철대륙에 대항할 수단이 없다는 것도, 마찬가지 일인 것 같고."
90001190-118 = "……칫."
90001190-121 = "어떻게 해야 할까요?"
90001190-122 = "케이의 가설…… 그러니까 강철대륙으로 변하는 건 무기물뿐일 것이라는 예측을 받아들여도, 문제는 남아요."
90001190-123 = "그래. 일단 내 AMAS들과 케이는, 강철대륙 근처에 다가갈 수 없다는 결론이 나오지."
90001190-124 = "저의 아비 에슈흐도 사용할 수 없을 것 같습니다."
90001190-127 = "저기, 이런 경우라면 보통, 입고 있는 옷이나 장비도 전부 못 쓰게 된다는 것 아닐까요……?"
90001190-128 = "엑?! 그러면 우리, 거기 가면 전부 알몸이 되는 거야?"
90001190-129 = "어어?!?! 그, 그러고 보니……??!!"
90001190-131 = "그게 왜? 나는 아무 문제 없는데?"
90001190-132 = "아뇨, 에이미. 거기에서 그런 대답을 할 수 있는 건 당신 정도일 테니까요……?"
90001190-134 = "저, 저저저저저, 저는 완전히 무리예요……!"
90001190-141 = "그렇지만 이것은 또한 저의 퍼펙트 메이드 보디를 보여 드릴 수 있는 기회이기도 하겠군요. 어떻게 생각하시나요, 선생님?"
90001190-145 = "[ns] \"나, 나?!\""
90001190-146 = "아, 하지만 선생님 외의 다른 분들께는 그다지 보여 드리고 싶지 않기도 하니…… 견해를 정정하겠습니다. 이것은 확실히 문제이겠군요."
90001190-147 = "토, 토키……?"
90001190-148 = "잠깐만요, 여러분. 그 이전에 근본적인 문제가 있지 않나요?"
90001190-149 = "이 혹한의 환경에 이 청초한 병약미소녀의 신체를 노출시켜야 한다는 것은, 확실히 그 자체로 큰 문제이긴 하겠습니다만……."
90001190-150 = "그 이전에 강철 대륙에는 다차원 배리어가 설치되어 있잖아요? 달리 말하면, 우리들의 진입 자체가 현재로서는 불가능한 상황이라는 거죠."
90001190-151 = "고마워, 히마리. 좋은 부분을 말해 줬어."
90001190-153 = "어, 어떻게 하죠? 게임이라면 보통 보호막이나 뒤로 돌아갈 수 있는 길 같은 것이 준비되어 있겠습니다만……."
90001190-154 = "(보호막……? 뒤로 돌아갈 수 있는 길……?)"
90001190-155 = "!!!"
90001190-159 = "저기, 그러면 혹시…… 백도어 같은 게, 있지 않을까요?"
90001190-160 = "백도어 말인가요? 그렇지만 백도어라는 보통 해킹에서……."
90001190-161 = "네. 그렇지만 이 경우에는 물리적인 백도어가, 어쩌면……."
90001190-163 = "어떻게 그런 결론에 도달한 거지?"
90001190-166 = "그, 그그그그, 그러니까요……! 그, 저기, 그 아이들, 자원을 대량으로 모으고 있었다고 했잖아요……? 그러니까 어쩌면……!"
90001190-167 = "!"
90001190-168 = "그렇구나……. 툰드라 지대에서 수집한 자원들은, 네차흐의 위치 좌표로 운송되고 있었어."
90001190-169 = "그래. 철도와 시설까지 만들어서 자원을 가공하고 있었지?"
90001190-170 = "네. 철도를 지키는 잔여 병력도 분명히 있었습니다."
90001190-172 = "그렇네요. 네차흐가 모든 무기물을 강철대륙의 일부로 변환하기만 했다면, 그렇게까지 자원을 정제하고 가공할 필요도 없었을 거예요."
90001190-173 = "맞아. 애초에 자원을 채취할 필요조차 없었겠지. 그냥 그 아이들이 말한 대로, 주위를 집어삼키면서 커지면 되는 것이었을 테니까."
90001190-174 = "즉, 그 아이들이 자원을 채취, 정제, 가공했던 것은, 네차흐를…… 이 표현이 적절할지는 모르겠지만, 일단 진화라고 하죠."
90001190-175 = "다시, 네차흐를 강철대륙으로 진화시키기 위해 그런 일을 하고 있었다고 추론할 수 있겠군요."
90001190-176 = "그리고 최종적으로 가공된 자원이, 네차흐의 진화를 위해 사용되었을 것이라고 가정한다면……."
90001190-177 = "그곳 어딘가에는, 물질 변환의 영향을 받지 않는…… 백도어 루트가 분명히 있을 거야."
90001190-179 = "와아, 와아! 역시 유즈입니다. 그야말로 UZQueen 모드였습니다!"
90001190-181 = "즉, 그 아이들은 자원을 끌어들여 네차흐를 만들고 있었으니, 자원 반입 수단을 조사해 볼 필요가 있다는 뜻이로군요."
90001190-182 = "어…… 그러니까 게임으로 비유하자면…… 그거다! 숏컷을 찾자는 이야기네?"
90001190-183 = "그렇습니다. 모모이. 지금은 '현명한 모모이'라고 불러 드려야 하겠군요."
90001190-184 = "응? 자, 잘 모르겠지만…… 어쨌든 칭찬해 주는 거 맞지? 헹! 내가 조금만 진심이 되면, 이 정도라고!"
90001190-185 = "잠시 정정을. '현명해 보였지만, 결국 쉽게 잘난 체하고 마는 모모이'라고 해 두겠습니다."
90001190-189 = "뭔가 자꾸 부정적인 방향으로 길어지는데?! 무슨 칭호 시스템이냐–?!?!"
90001190-192 = "우리의 다음 행동은, 거의 결정된 것 같습니다."
90001190-193 = "자원 반입 수단으로 사용된 백도어 루트를 찾기 위해, 툰드라 지대로 되돌아가 조사를 마치는 것이죠."
90001190-194 = "질문 하나만 할게. 부장. 지금이라도 밀레니엄이나 다른 곳에 연락해서, 지원을 요청하는 것은 어때?"
90001190-197 = "……그 방안도 생각은 해 봤지만, 시간이 부족해."
90001190-198 = "그 아이들의 선전 포고에 따르면, 키보토스가 강철대륙으로 변하기까지는 3일 정도밖에 남지 않았어."
90001190-199 = "지금부터 연락을 취하고, 인선을 선별하고 기밀 보안을 유지하면서 모든 행정 처리 과정을 거쳐, 이곳까지 도착하는 물리적인 시간을 계산하면……."
90001190-200 = "아, 맞다. 우리 여기까지 오는 데 사흘 가까이 걸렸었지……?"
90001190-201 = "그래. 어떻게 해도 현실적인 시간이 모자라."
90001190-203 = "조건과 과정에 얽매이지 않는, 즉각 대응 가능한 현장 특수 부대가 필요하다는 이야기네."
90001190-204 = "어떤 의미로는 이미 익숙하긴 하지만 말이야."
90001190-206 = "저, 리오 선배? 그렇다면 우리들은……."
90001190-207 = "그러네. 너에게 어울리는 표현을 사용하자면……."
90001190-208 = "이번에는 우리가, 세상을 지키러 가는 거야."
90001190-209 = "리오 선배와 함께 말이로군요?"
90001190-215 = "(잠깐만, 이럴 때는 어떻게 대답해야 할까……?)"
90001190-216 = "(…….)"
90001190-221 = "그래. 그렇게 생각해 준다면, 고맙겠어."
90001190-225 = "뽜밤 뽜밤! 리오 선배가 아리스의 정식 동료가 되었습니다! 파티 상한선이 늘어났습니다!"
90001190-226 = "(다행이야. 틀리지 않았던 것 같아.)"
90001190-231 = "어떻게 생각해, 부장?"
90001190-232 = "뭐, 70점 정도로군요. 이게 어딘가 싶지만요."
90001190-237 = "[ns3] \"그러면, 출발할까?\"\n[ns4] \"다들 잊은 물건 없지? 챙길 것들 잘 챙기고!\""
90001190-240 = "선생? 우리는 지금 소풍이나 야유회를 가는 것이……."
90001190-241 = "어머나. 좋지 않나요? 지나치게 긴장하면, 오히려 성공률이 떨어지는 법이죠."
90001190-242 = "해야 할 일이 변하지 않는다면, 차라리 부담을 내려놓고 가볍게 시작하는 것도 좋을 듯한데요."
90001190-243 = "히마리 부장의 의견에는 저도 찬성합니다. 리오 님. 어차피 본격적으로 일이 시작되면, 긴장 같은 것은 그때부터 충분히 하게 될 테니까요."
90001190-244 = "그, 그래? 그런 걸까……?"
90001190-245 = "네. 아침 산책을 다녀오는 기분으로 세상을 지킬 수 있다면, 그것만큼 좋은 일도 없지 않을까요."
90001190-247 = "맞아! 세상을 구하는 파티의 첫 퀘스트는, 보통 집 앞 정원의 잡초를 뽑거나 방 청소부터 시작하는 법이라구!"
90001190-248 = "……우리 부실 청소도, 그런 기분으로 좀 성실하게 해 줬으면 하지만 말이야."
90001190-249 = "왜, 왜에?! 나 이번엔 제대로 쓰레기 버리고 왔는데!?"
90001190-250 = "설거지는 안 했잖아. 청소기도 안 돌렸고."
90001190-251 = "그엑."
90001190-253 = "괜찮습니다, 모모이! 청소기는 제가 돌렸으니까요!"
90001190-254 = "아리스 쨩이 자꾸 언니 응석을 받아 주니까, 언니 버릇이 더 안 좋아지는 거야……."
90001190-255 = "아, 아리스가 잘못한 건가요……?"
90001190-257 = "아뇨. 제가 보기에 잘못은 당신들 모두가 하고 있습니다. 아리스만 빼고요."
90001190-258 = "나, 나까지……?"
90001190-259 = "……유즈는 조금 봐줄게요."
90001190-260 = "고, 고마워. 케이 쨩……. 에헤헤."
90001190-261 = "점점 다들 절 케이 쨩이라고 부르는 횟수가 늘어나고 있는 것 같은데 말이죠……?"
90001190-262 = "[s] \"케이 쨩은, 케이 쨩이니까!\""
90001190-263 = "선생님은 가만히 좀 있으세요!"
90001190-267 = "이번에는 내 수송선을 쓰도록 해. 그렇게까지 큰 편은 아니지만…… 그렇게까지 작은 것도 아니니까."
90001190-268 = "추, 충분히 큰 것 같은데, 회장……?"
90001190-269 = "그렇지만 보다 합리적으로 생각하자면, 좀 더 여러가지 물자를 선적할 수 있을 만큼–"
90001190-270 = "자, 여러분. 신속하게 출발하도록 할까요."
90001190-274 = "휠체어는 내가 옮겨 줄게. 부장."
90001190-275 = "어머나. 그러면 저는 선생님이 업어 주시면 되겠네요."
90001190-276 = "물론 청초하고 가련한 저를 공주님 안기로 데려가 주셔도, 저는 완전히 신경 쓰지 않을 거랍니다?"
90001190-278 = "어떠세요? 어때요? 이 기회에 그런 거, 한번 해 보고 싶지 않으신가요?"
90001190-280 = "……."
90001190-281 = "토키. 히마리를 옮겨 줘."
90001190-282 = "……."
90001190-283 = "알겠습니다. 리오 님."
90001190-289 = "다, 당신들에게 도움을 요청한 게 아니었는데요?!"
90001190-290 = "괜찮습니다. 히마리 부장. 원래 어려울 때에는 다들 서로 돕고 사는 법 아니겠습니까."
90001190-291 = "제 경험상, 토키가 제대로 된 말을 할 때에는 뭔가 본심을 숨기고 있을 때였는데 말이죠–?!"
90001190-299 = "히이이이잉…… 선생니임……."
90001190-300 = "[ns] \"자, 자. 어서들 출발하자…….\""
90001190-302 = "으, 응. 선생님. 그러면 게임개발부도, 출동이야!"
90001190-303 = "네!"
90001190-308 = "다음화;전조"
