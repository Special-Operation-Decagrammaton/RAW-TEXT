[translation]
21070-1 = "제7화;그것은 총이라기엔 너무 컸다."
21070-2 = "밀레니엄 게임개발부"
21070-3 = "밀레니엄, 아니 키보토스의 학생이라면 누구나 자신의 무기를 가지고 있어."
21070-4 = "따라서 아리스. 너에게도 무기가 필요해."
21070-5 = "일단 가장 빠르게, 괜찮은 무기를 얻을 수 있는 곳은 역시……"
21070-6 = "엔지니어부려나."
21070-7 = "엔지…… 니어……?"
21070-8 = "기계를 만들고, 수리하는 전문가들을 밀레니엄에서는 '마이스터'라고 불러."
21070-9 = "엔지니어부는, 바로 그 마이스터들이 모이는 동아리야."
21070-10 = "기계 전반에 탁월하지만, 밀레니엄 학원의 무기 수리나 개조도 전담하고 있는 곳이니……."
21070-11 = "아마 안 쓰는 무기나 남는 무기가 있지 않을까 생각해."
21070-12 = "자! 그럼 가볼까!"
21070-14 = "엔지니어부 동아리 작업실"
21070-15 = "……그렇군. 이해했어."
21070-16 = "동료에게 보다 좋은 무기를 선물하고 싶기에……"
21070-17 = "엔지니어부에 온 거라면 탁월한 선택이야."
21070-18 = "밀레니엄의 전투란 뛰어난 기술자가 함께하는가에서 승패가 결정되니까."
21070-19 = "구석에 보면 우리가 만든 여러 가지 시제품들이 있어."
21070-20 = "그곳에 있는 거라면 뭐든지 가져가도 좋아."
21070-21 = "우와! 선배 고마워!"
21070-24 = "안녕…… 1학년 히비키야. 내가…… 좋은 거로 골라줄게."
21070-25 = "아리스…… 이건 어때?"
21070-27 = "헤에. 권총인가."
21070-28 = "딱 보는 순간…… 알겠어. 이 애…… 전투 경험이 별로 없지?"
21070-29 = "그 말, 부정합니다. 아리스에게는 약 스물 일곱 번의 인류 구원과, 사십 여섯 번의 마왕군과의 전투와, 세 자릿수 이상의 던전 탐사 경험이 있습니다."
21070-31 = "……"
21070-32 = "…… 굉장…… 하네."
21070-33 = "어쨌든, 총기 사용 경험은 별로 없어 보여."
21070-34 = "그런 소녀라면…… 역시 권총이야. 플라스틱이라 무게도 가볍고 반동도 적은……"
21070-35 = "초보자를 배려하는 화기니까…… 그리고 무엇보다……"
21070-37 = "이 총에는, 밀레니엄 역사상 단 한 번도 존재하지 않았던 기능이 있어."
21070-39 = "뭐, 뭐라고?"
21070-40 = "굉장해. 대체 무슨 기능이야?"
21070-41 = "바로……"
21070-42 = "'블루투스' 기능이야."
21070-43 = "……어?"
21070-44 = "블루투스를 통한 음악 감상이나 파일전송이 가능한 권총은…… 전 세계에 하나뿐이지."
21070-45 = "……키이카 기능도 탑재. 승차장 IC 패널에 올려 대중교통을 이용할 수도 있지."
21070-46 = "게다가 NFC 기능을 활성화 시 편의점 페이 같은 걸로 쓸 수도 있어……."
21070-47 = "대, 대, 대단하긴 한데."
21070-48 = "편의점에서 \"이걸로 결제하도록 하지.\"라며 권총을 꺼내면 직원분이 놀랄 것 같아!"
21070-49 = "아리스 쨩은 어…… 응? 아리스 쨩? 어디 갔지?"
21070-50 = "아 저기 있네."
21070-51 = "……저건……."
21070-54 = "(빤히)"
21070-57 = "……이건……?"
21070-58 = "홋홋홋. 손님. 보는 눈이 있으시군요."
21070-59 = "……누구?"
21070-60 = "설명을 필요로 한다면 언제든 대답해주는 엔지니어부의 마이스터! 코토리 입니다."
21070-61 = "……?"
21070-62 = "당신이 아리스로군요. 게임개발부의 네 번째 멤버!"
21070-64 = "코토리 쨩? 오랜만이야. 그런데 아리스 쨩이 바라보는 이 커다란 건 뭐야?"
21070-67 = "마치…… '대포' 같은데."
21070-68 = "좋은 질문이에요 미도리. 이것은 하반기 예산의 약 70%를 들여 제작된……"
21070-69 = "엔지니어부의 야심작, 우주 전함용 레일건입니다!"
21070-70 = "우주 전함이라니…… 또 그런 말도 안 되는 짓을……"
21070-71 = "전에 콜드슬립으로 \"미래에서 뵙겠습니다.\" 동면 장치를 만들겠다며 난리 치다가 단체로 감기 걸리지 않았어?"
21070-72 = "……그 '미래직행 익스프레스'는 지금도 잘 쓰고 있어."
21070-73 = "……냉장고로. 음식을 더 먼 미래까지 보낼 수 있게 되었으니 실패한 건 아니야."
21070-74 = "쓸데없이 이름 엄청 거창해!"
21070-75 = "엔지니어부는 헬기와 범용 작업 로봇에 이어, 이번에는 우주 전함의 개발을 목표로 하고 있어요!"
21070-76 = "이 레일건은 그 시작이죠. 대기권 외부에서의 전투를 목적으로 개발된 실탄 병기! 이건 밀레니엄 역사상 분명 최초의 시도입니다!"
21070-77 = "헤에…… 살짝 기대될지도?"
21070-78 = "역시 밀레니엄 엔지니어부! 이번엔 진짜 만들 수 있을 것 같아!"
21070-79 = "홋홋홋! 물론이죠!"
21070-80 = "……라고 말하고 싶지만, 당분간은 보류."
21070-81 = "아앗?! 왜! 기대했는데!"
21070-82 = "언제나 그렇듯, 공학자의 발목을 잡는 건 부족한 상상력과 열정이 아니라…… 예산이죠……."
21070-83 = "이 자주포 하나를 만드는데도 예산의 70%가 들었는데, 우주 전함을 만들려면 천배 이상의 예산은 각오해야……."
21070-84 = "그럼 대체 이 우주 전투용 자주포는 왜 만든 거야!"
21070-87 = "안타까운 질문이구나 모모이."
21070-88 = "……빔은, 로망이니까."
21070-89 = "(끄덕끄덕)"
21070-90 = "음. 부정할 말이 없군요. 빔의 매력을 모른다니, 모모이에게는 바보라는 호칭이 어울려요."
21070-91 = "바보다! 여기 바보들이 있어!"
21070-93 = "엔지니어부의 열정이 깃든 이 무기의 정식 명칭은……."
21070-94 = "'빛의 검 : 슈퍼노바'!"
21070-95 = "또 쓸데없이 거창한 이름을……."
21070-96 = "……!"
21070-97 = "……빛의 검……?!"
21070-98 = "응? 아리스 눈이 반짝반짝 빛나고 있어?"
21070-99 = "와아! 와아!"
21070-100 = "아, 아리스 쨩이 이렇게 흥분한 거 처음 봐."
21070-101 = "이거…… 갖고 싶어요."
21070-102 = "……응?"
21070-104 = "위대한 강철의 장인이여. 저 용의 숨결을 원하오."
21070-106 = "으음. 그렇게 말해주니 기쁘긴 한데……."
21070-107 = "미안하지만, 무리예요!"
21070-109 = "어째서?! 이 방에 있는 거라면 뭐든 가져가도 좋다고 했잖아!"
21070-110 = "……이유가 있어."
21070-111 = "이유?"
21070-112 = "혹시 제가 레벨이 부족해서…… 장착 가능 레벨이 궁금합니다!"
21070-113 = "아니…… 그런 문제가 아니라……."
21070-114 = "좀 더 현실적인 문제야."
21070-115 = "돈이로군. 그럴 줄 알았어."
21070-116 = "걱정 마, 아리스. 내가 미도리의 플라이 스테이션을 팔아치우는 한이 있더라도……"
21070-117 = "……그것도 아니야."
21070-118 = "현실적인 문제에서 돈보다 더 어울리는 게 있을 리 없잖아!"
21070-119 = "으음. 예산에 관련해서는 어느 정도 동의하는 말이긴 한데……"
21070-120 = "……일단…… 이 무기는…… 개인화기로 사용하기엔 너무 무거워."
21070-122 = "기본 무게만 140kg을 호가하죠! 게다가 광학 조준 장비와 배터리를 포함해 쏘는 순간의 반동은 200kg 이상이에요!"
21070-124 = "으으으음……."
21070-125 = "우리의 자주포를 멋지다 말해준 것만으로 고마워. 가져갈 수 있다면 정말 주고 싶지만……."
21070-126 = "……?"
21070-127 = "?!"
21070-128 = "그 말에 추호도 거짓이 없습니까?"
21070-129 = "응? 이 아이 말투가 또……?"
21070-130 = "저, 정말이냐고 묻는 것 같아요."
21070-131 = "물론이지만…… 정말로 저걸 들어보려고?"
21070-132 = "(끄덕)"
21070-134 = "(스윽)"
21070-135 = "……이 무기를 뽑는 자."
21070-136 = "……이 땅의 왕이 되리니!"
21070-137 = "홋홋홋! 좋은 패기를 가진 소녀로군요."
21070-139 = "(덥석)"
21070-140 = "하아……!"
21070-141 = "무리…… 안 하는 게 좋아…… 기중기라도 쓰지 않고는 뽑을 수 없……"
21070-143 = "하아아아……!(우직……)"
21070-144 = "……앗."
21070-145 = "흐이이익!!"
21070-146 = "(우지지지직- 뚝!)"
21070-147 = "야압! 뽀, 뽑았어요!"
21070-148 = "말…… 도 안…… 돼……."
21070-149 = "으음…… 버튼이…… 이게 B 버튼인가……?"
21070-150 = "자, 잠깐만!"
21070-152 = "빛이여!!!"
21070-155 = "(콰와아아아앙!)"
21070-156 = "꺄아아! 우, 우리 부의 천장이!"
21070-157 = "……굉장해."
21070-158 = "아리스, 이 무기를 장착합니다."
21070-159 = "하, 하지만…… 이건 안 돼!! 제발 다른 걸로 골라줘! 이 무기는 부의 예산이 집결된……"
21070-160 = "아니……"
21070-161 = "가져가도록 해."
21070-162 = "우타하 선배…… 정말 괜찮나요?"
21070-163 = "괜찮아. 어차피 이 아이 외에는 쓸 수 있는 사람이 없으니까."
21070-164 = "히비키, 아리스가 쉽게 가지고 다닐 수 있도록 어깨끈이랑 손잡이 부분을 만들어 줘."
21070-165 = "응…… 선배……."
21070-166 = "어떻게 보면…… 긍정적…… 실전 데이터를 얻을 수 있게 되었으니……."
21070-167 = "우와! 뭔가 엄청 센 무기를 손에 넣은 기분인데! 고마워!"
21070-168 = "가, 가, 감사합니다!"
21070-169 = "아니, 아직 감사하기에는 일러."
21070-170 = "응?"
21070-172 = "히비키. 처분 요청받은 드론과 로봇을 전부 꺼내."
21070-173 = "……응."
21070-175 = "……어? 우타하 선배, 뭔가 분위기가 이상한데."
21070-176 = "으으음! '그렇게 입맛대로 쉽게 무기를 내줄 순 없지!' 패턴 같지 않아?!"
21070-177 = "정답이야."
21070-178 = "그 무기를 가져가고 싶으면……"
21070-181 = "우헤헤! 아리스여. 우리를 쓰러트리고 가라!"
21070-182 = "?!"
21070-183 = "뭐, 뭐야! 우타하 선배! 어째서 이러는 거야?!"
21070-184 = "무, 무기 하나 때문에 이러는 건가요?"
21070-186 = "다른 무기라면 기쁘게 주었겠지만……"
21070-187 = "그 무기라면, 확인이 필요해서 말야."
21070-188 = "화, 확인?"
21070-189 = "아니…… '자격'이 맞는 표현이려나."
21070-190 = "무슨 말을……?"
21070-193 = "전방에 전투형 드론 및 로봇 감지, 적성 반응 확인."
21070-194 = "옵니다!"
21070-195 = "이런!"
