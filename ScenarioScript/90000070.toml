[translation]
90000070-1 = "제8화;정보수집 7 - 폐허 수몰지구"
90000070-2 = "……. 여러분."
90000070-3 = "뭔가 찾아냈어?"
90000070-4 = "폐허의 어떤 지역에서, 아주 잠깐이지만 무시할 수 없는 신호를 포착했습니다."
90000070-5 = "신호? 어떤 신호?"
90000070-6 = "그건……. 누군가를 부르는 듯한 호출 신호입니다."
90000070-7 = "……. 얼핏 보면 의미없는 노이즈에 가깝지만…… 저는 이 신호의 패턴을 기억하고 있어요."
90000070-8 = "바로…… 우리가 조우했던 바로 그 존재."
90000070-14 = "……설마?"
90000070-15 = "데카그라마톤, 그것의 신호와 일치하고 있었어요. 설마 해서 몇번이고 재확인을 했지만, 확실합니다."
90000070-16 = "[s] \"어…… 그렇다는 건…….\""
90000070-17 = "그 신호가 포착된 곳에 데카그라마톤이 있다는 얘기야?"
90000070-18 = "……지금까지의 흐름이라면, 네. 맞아요."
90000070-19 = "잠깐만. 우리의 임무는 데카그라마톤의 정체를 찾기 위한 거잖아."
90000070-20 = "이렇게 되면 굳이 번거롭게 다른 예언자들의 데이터를 수집할 필요 없이 바로 이쪽을 공략하는 게……?"
90000070-22 = "……그 말이 맞긴 하지만, 아직 성급하게 결론을 내어서는 안 되죠. 게다가 우리는 데카그라마톤의 정체를 밝히려는 것이지, 그것과 숨바꼭질을 하고 있는 건 아니에요."
90000070-23 = "일단 가서 확인을 해 보죠. 그게 우선이에요. 제가 잘못봤을 수도 있고,"
90000070-24 = "일단 해당 신호가 발신된 곳으로 출발해봐요."
90000070-25 = "아주 찰나의 신호였기 때문에, 구체적인 위치를 특정할 수는 없어요. 수색 범위는 굉장히 넓습니다. 어쩌면 며칠이고 헤매야 할지도 몰라요."
90000070-26 = "그럼 시작하죠."
