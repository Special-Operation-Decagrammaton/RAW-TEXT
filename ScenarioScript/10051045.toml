[translation]
10051045-2 = "큭, 분하다……!"
10051045-7 = "해……해치웠다……."
10051045-8 = "후후후, 모두 괄목하라……! 역시 마지막에 서 있는 것은, 닌자일지니……!"
10051045-9 = "모두 고생 많았습니다! 닌닌!"
10051045-10 = "[s] \"다친 사람은 없지?\""
10051045-11 = "예, 선생님 덕분에 모, 모두 괜찮아요."
10051045-12 = "피아 구별을 않자면 저쪽은 하나도 안 괜찮은 것 같긴 한데……."
10051045-13 = "그나저나 남의 옷을 훔치려고 이렇게 떼로 몰려오다니. 얼마나 도둑질에 진심인 거야?"
10051045-14 = "그럼 부장! 일단 옷부터 회수하면 될까요?"
10051045-15 = "아 맞아! 샤인캣 디자이너의 옷! 그게 제일 중요했지!"
10051045-17 = "아마도 옷은 저 가방 안에 들어있을 거예요. 끝까지 소중하게 안고 있었으니까요."
10051045-18 = "오오, 다행이네. 마침 가방에도 별 손상이 없군."
10051045-19 = "좋아, 이걸로 목표물은 회수했고."
10051045-20 = "……잠깐만, 여기 바닥에 쓰러져 있는 이 사람, 누구야?"
10051045-24 = "……."
10051045-25 = "어……? 그러고 보니 전투 시작할 때만 해도 없었던 사람인데요……?"
10051045-26 = "이즈나도 처음 보는 사람입니다!"
10051045-27 = "뭐지, 전투 중에 휘말린 일반인인가?"
10051045-28 = "일단 빨리 치료를……."
10051045-33 = "어이 거기, 내 작품은 찾았나?"
10051045-34 = "응? 옷 가방은 회수했는데."
10051045-35 = "오오, 내 작품! 좋아. 이것으로 잘 해결됐군."
10051045-36 = "어디 보자…… 음? 잠깐만, 여기 쓰러진 이 사람……."
10051045-40 = "아, 안 돼……!"
10051045-41 = "안 돼애애!!"
