[translation]
28-1 = "제15화;연출 추가"
28-5 = "이 이야기는 전복되었다."
28-6 = "맥락도, 구성도, 장르도, 의도도, 해석도 모두 파괴되었다."
28-7 = "의미는 이제 뒤엉키고 뒤섞여 통제되지 못하게 퇴색되었다."
28-11 = "선생이여."
28-12 = "지금까지의 이야기는 모두 잊어라."
28-13 = "지금부터 너에게 벌어질 일은 이제 더이상 그런 것이 아니다."
28-15 = "주인공도, 악당도, 사건도, 갈등도 없는 세계."
28-16 = "해체되어 모든 것이 뒤엉킨 세계."
28-18 = "맥락도, 구성도, 개연성도, 없는 어떤 작위의 세계."
28-19 = "마침내 의미를 잃고 제멋대로 날뛰는 이해 불가능한 부조리의 세계."
28-23 = "아아, 그렇다. 이 세계는 그저 그렇게 존재할 뿐이었다."
28-24 = "우리 모두는 그것을 망각하고 있었을 뿐."
28-27 = "그러니 드디어 시작하자."
28-28 = "이야기가 아닌 이야기를."
28-30 = "맥락도, 장르도, 개연성도, 핍진성도 모두 사라진 채,"
28-34 = "이리저리 충돌하고, 날뛰고, 배신하고, 뒤엎고, 전복하는 이야기를."
28-36 = "이야기라고 부를 수 없는 망가진 이야기를."
28-38 = "관객을 모독하고 등장인물을 모독하는 이야기를."
28-39 = "그 반란의 이야기를."
28-51 = "그리고, 모든 기적이 시작되는 곳"
