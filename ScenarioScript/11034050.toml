[translation]
11034050-1 = "#K-04"
11034050-3 = "……음. 방금 건 꽤 괜찮았어. 이렇게만 가자."
11034050-4 = "시험이랑 본 공연 때에도 이 정도로만 나왔으면 좋겠는데 말이지."
11034050-5 = "괜히 긴장하면 어쩌지, 하는 걱정이 좀 되는데……."
11034050-6 = "나의 회전 회오리 드럼 스틱을 보라-!!"
11034050-7 = "나, 나츠 쨩……! 최소한 끝까지 치고 나서……!!"
11034050-8 = "셈라 먹을 생각, 있는 거 맞지?"
11034050-12 = "……뭐……."
11034050-13 = "……적어도 긴장이 유지될 거 같진 않네."
