[translation]
10010010-1 = "제1화;비밀 작전으로 변경합니다……."
10010010-5 = "……과연……."
10010010-6 = "그런 이유로 찾아오신 거군요……. 이 책……."
10010010-7 = "……아니……. 책'이었던' 것과 함께 말이죠……."
10010010-8 = "으으……. 죄송합니다! 정말 죄송합니다……! 제가 이런 애라……!"
10010010-9 = "아, 아뇨. 히나타 씨……. 그런 뜻은 아니고……."
10010010-10 = "우, 우선 진정하세요. 저에게 죄송할 일은 아니니까요! 게다가……."
10010010-15 = "……도서관에서는, 조금 더 작게 말해주세요."
10010010-17 = "……네, 네에……."
10010010-19 = "음……. 그렇지만 확실히 큰일이네요."
10010010-20 = "그렇게 중요한 사람들이 많이 모이는 큰 행사에서 그런 사고가 난다는건……."
10010010-24 = "어라. 그러고 보니 그럼 상자는요?"
10010010-25 = "지금까지의 이야기를 들어보면, 경전의 나무 상자도 같이 있어야 하는 거 같은데……. 안 보이네요?"
10010010-26 = "……네? 이미 행사가 열릴 성당 제단에 두고 왔다고요?"
10010010-27 = "……어라 그럼 상자는 지금 비어 있는 상태인가요?"
10010010-28 = "아아. 무게감이 있어야 하니 적당히 비슷한 책을 넣어두셨다고요."
10010010-29 = "음음. 그렇군요. 카마수트라를 대신……."
10010010-34 = "……잠깐만요. 지금 무슨 책이라고……."
10010010-35 = "카마수트라요? 왜 하필 그런 걸……. 아니, 그게 왜 거기 있었죠?"
10010010-36 = "[s] \"마침 들고 있던 책이 그거여서…….\""
10010010-37 = "네? 마침 들고 있던 책이 카마수트라여서 경전 대신 그걸 집어넣고 왔다고요?!"
10010010-38 = "카마수트라를 왜 들고 계셨던 거죠? 어디부터 딴지를 걸어야 할지 모르겠는데요?!"
10010010-39 = "네? 하나코 씨가 가지고 있는 걸 압수해서……. 도서관에 대신 돌려주려고 가지고 있으셨다고요……?"
10010010-40 = "[s1] \"나도 정신이 없었어……. 무슨 책인지도 몰랐고…….\"\n[s2] \"통이 비어 있으면 들키니까……. 당황해서 그만…….\""
10010010-41 = "그, 그럼 일단 다른 책으로 바꿔치기 한다던가……."
10010010-42 = "그, 그럼 일단 다른 책으로 바꿔치기 한다던가……."
10010010-46 = "……그래도 결국 경전이 아니면 문제는 해결되지 않겠네요."
10010010-47 = "확실히……. 네. 상황은 대략 이해했습니다."
10010010-51 = "이 산산조각이 난 경전을 <복원>해서 행사장에 돌려놓지 않으면……."
10010010-66 = "사쿠라코 씨가 수백 명이 모여있는 행사장에서 경전 대신 카마수트라를 읽어버리게 되겠네요……."
10010010-67 = "……네에."
10010010-69 = "그건 그거 나름대로 장관이겠지만…… 역시 도와드릴 수밖에 없겠네요……."
10010010-70 = "음……. 그렇지만……. 역시……."
10010010-76 = "으음……. 죄송합니다. 선생님. 역시 제 실력으로는 무리일 것 같아요."
10010010-77 = "물론 저도 사서로서 망가진 책을 보수하긴 하지만, 그건 어디까지나 사서로서 하는 '관리' 레벨의 영역이라……."
10010010-78 = "이 정도로까지 훼손된 상태는……. 저도 손쓸 수 있는 게 많지 않아요."
10010010-79 = "이건 뭐랄까……. 보수가 아니라 복원에 가깝달까, 저보다는 '진짜 전문가'의 손길이 필요하겠네요."
10010010-80 = "[s3] \"보수가 아니라 복원?\"\n[s4] \"진짜 전문가?\""
10010010-81 = "네. 보수가 작은 상처에 밴드를 붙이고 약을 발라 주는 것이라면, 복원은 큰 수술, 혹은 소생에 가까운 느낌……?"
10010010-82 = "네. 보수가 작은 상처에 밴드를 붙이고 약을 발라 주는 것이라면, 복원은 큰 수술, 혹은 소생에 가까운 느낌……?"
10010010-83 = "사서인 제 입장에서도 '전문가'라고 올려다볼 수 있는, 보다 높은 영역의 이야기인 거죠."
10010010-88 = "게다가 이 책은 요즘 책도 아닌 고서……. 사실상 유물이라고 봐야 하는 그런 물건."
10010010-89 = "찢어진 페이지를 붙이고 정렬하려 해도, 고문자 해독능력마저 필요한 상황이잖아요?"
10010010-92 = "이런 작업을 해낼 수 있는 사람은 트리니티……. 아니, 어쩌면 키보토스 내에서도 손가락 안에 꼽힐 거 같아요."
10010010-93 = "그, 그러면……. 그러면 역시 무리인 건가요……? 방법이 없는 건가요……??"
10010010-94 = "으으……!"
10010010-95 = "아, 아아. 히나타 씨."
10010010-96 = "……으……?"
10010010-98 = "……쉿."
10010010-100 = "죄송합니다……."
10010010-101 = "[s5] \"역시 도서관 카리스마.\"\n[s6] \"굉장한 걸…….\""
10010010-105 = "후우……."
10010010-106 = "사실 방법이 전혀 없지는 않을 거라고 생각해요. 다행히 아는 사람이 한 분 계시니까요."
10010010-107 = "그분에게 가 보시면, 어떻게든 방법이 나올지도 모르겠네요."
10010010-108 = "생각보다 엄청 대단한 분이라서. ……보기와는 달리 말이에요."
10010010-109 = "[s7] \"……보기와는 달리?\"\n[s8] (찝찝한 뒷말이 붙었다……?)"
10010010-110 = "아, 아무튼 저희 사이에서는 '고서관의 마술사'라 불릴 만큼 대단한 사람이기도 하고……."
10010010-111 = "아, 아무튼 저희 사이에서는 '고서관의 마술사'라 불릴 만큼 대단한 사람이기도 하고……."
10010010-112 = "물론 실제로 마술을 쓴다는 건 아니지만요. 문제들을 척척 해결해 내서 붙은 별명일 뿐."
10010010-113 = "다만 방금도 말씀드렸듯, 작은 문제가 하나 있는데……."
10010010-115 = "네? 무슨 문제냐고요? 그게……. 음……."
10010010-116 = "그냥 좀……. 사람을 좀 가린달까, 낯선 사람을 경계한달까……. 햇빛을 싫어한달까……."
10010010-117 = "늘 고서관에 틀어박혀 절대 나오려 하지 않는 사람이랄까……."
10010010-118 = "대인관계? 사회성? 그런 쪽의 이야기긴 한데……. 나쁜 사람은 아니지만……."
10010010-120 = "……네? 누구냐고요? 아아. 그……."
10010010-121 = "……저희 도서부의 부장님이에요."
10010010-123 = "……우이 부장님이요."
