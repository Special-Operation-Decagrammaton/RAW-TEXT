[translation]
10047020-1 = "제2화;꿈과 희망의 원더랜드"
10047020-2 = "(오늘은 츠무기와 와일드헌트 예술학원에 가기로 한 날이다.)"
10047020-5 = "긴 지하 터널이네요. 마치 래빗 홀 같아."
10047020-6 = "역시 오늘은 바니걸 코스튬을 하고 와야 했을까요?"
10047020-7 = "훗…… 농담이에요.#n저도 시간과 장소는 가린다고요."
10047020-8 = "[s] \"그, 그말은 조건이 갖춰지면……?\""
10047020-9 = "과연 어떤 쪽일까요? 저도 궁금하네요."
10047020-10 = "그럼 계속 가도록 하죠. 앞으로의 만남을 기대하면서."
10047020-15 = "자. 이쪽이에요. 여기서 조금만 걸어가면 돼요."
10047020-20 = "[ns] \"응? 여기는……?\""
10047020-21 = "잠시 검문이 있겠습니다. 협조 부탁드려요."
10047020-22 = "[s] \"거, 검문?\""
10047020-23 = "저희 학원은 외부 물품 반입에 다소 민감한 편이라서요."
10047020-24 = "평소 선생님의 소지품이라면 크게 걸릴 일은 없을 테니 안심하세요."
10047020-29 = "흠, 이상 없네요. 통과하셔도 좋습니다."
10047020-33 = "후훗, 그럼 갈까요."
10047020-34 = "[s] \"와일드헌트는 교칙이 강한 편이구나?\""
10047020-35 = "예술은 폭발이라는 말이 있잖아요?"
10047020-36 = "그 말을 실천해 보겠다고 위험한 폭발물을 반입해 사고가 일어난 적이 있어서요."
10047020-37 = "또, 어떤 음악과 학생은, 고출력의 확성기를 가지고 들어와서―"
10047020-38 = "학원의 유리창을 산산조각 내버렸어요."
10047020-39 = "[s1] \"검문할 만하네…….\"\n[s2] \"다들 열정이 엄청나네…….\""
10047020-42 = "후후, 예술은 폭발이니까요."
10047020-43 = "그럼 계속 가실까요?"
10047020-48 = "(그렇게 얼마 지나지 않아…….)"
10047020-53 = "자, 도착했어요."
10047020-54 = "소개하죠.#n여기가, 예술의 고향―"
10047020-59 = "<와일드헌트 예술학원>입니다."
10047020-60 = "[ns] \"와……! 엄청 아름다워!!\""
10047020-62 = "예술인의, 예술인에 의한, 예술인을 위한 학원."
10047020-63 = "삼대학원 정도의 규모는 아니지만, 역사는 트리니티나 게헨나에 뒤처지지 않아요."
10047020-64 = "학원의 학생은 엄격하게 관리되는 기숙사 생활을 하며, 밤낮으로 실력을 키우고 있답니다."
10047020-69 = "(조금 멀리서 말싸움하는 소리가 들려왔다.)"
10047020-71 = "뭐? 시대를 따라가지 못한다고? 내 예술관이 구닥다리라는 거야?!"
10047020-72 = "그런 말 안 했는데~?#n귀도 꽉 막혀 있는 거 아냐?"
10047020-76 = "칫…… 이렇게 되면!"
10047020-77 = "승부다!!"
10047020-84 = "……가끔 견해 차이로 사소한 부딪힘이 발생하긴 하지만요."
10047020-85 = "[s] \"물리적으로 충돌하고 있는데?!\""
10047020-86 = "예술은 쟁취하는 것이니까요."
10047020-87 = "그럼 계속 가실까요? 다음은 제가 생활하는 기숙사예요."
10047020-98 = "[ns] \"이게 예술가들의 일상…….\""
10047020-100 = "와일드헌트 학원 기숙사 복도"
10047020-102 = "자. 이 복도의 끝에 저와 친구들이 지내는 방이 있답니다."
10047020-103 = "[s] \"츠무기가 지내는 방이라면 왠지…….\""
10047020-107 = "[ns3] \"동화 분위기가 날 것 같네.\"\n[ns4] \"아니면, 데스메탈 느낌?\""
10047020-110 = "후후, 과연 어떨까요?"
10047020-111 = "저희들의 방은, 제4 기숙사의 404호실……."
10047020-112 = "4는 죽음을 뜻하는 말과 비슷하게 읽혀서 불길한 느낌이 든다는 사람도 있죠."
10047020-113 = "저는 개인적으로 아주 만족하지만요. 후후후."
10047020-114 = "[s] \"이, 인간이 죽는 것이 사회복지……!!\""
10047020-115 = "어머, 선생님도 그 가사가 인상적이었나 보네요."
10047020-116 = "하지만 그대로 받아들이면 곤란한 일. 그저 사회비판을 담았다 생각해 주시면 좋겠어요."
10047020-117 = "아무튼, 일반적으론 꺼림칙한 숫자다 보니 저와 룸메이트들은 조금 다르게 개성을 부여해 부르고 있답니다."
10047020-121 = "아, 어느새 도착했네요. 그럼 들어갑니다."
10047020-125 = "자. 여기가 저와 친구들이 생활하는 방이에요. 아늑하고 좋죠?"
10047020-126 = "[ns] \"……오, 뭔가 신비한 느낌이 드네.\""
10047020-132 = "히히…… 이히히……."
10047020-133 = "드디어 찾아왔군요. 아르카나의 마법에 이끌린 자여."
10047020-138 = "나도…… 운명의 이끌림을 느꼈어."
10047020-139 = "아, 진짜 쫌! 첫 만남인데 다들 정상적으로 반겨주면 안 돼?!"
10047020-140 = "하지만, '분위기 있는 인사를 하는 게 좋다'고 점괘에서……."
10047020-141 = "에리 쨩의 점은…… 누구보다 정확하지."
10047020-142 = "하아, 죄송해요. 제가 대신 사과드릴게요. 여기 정상인은 저밖에 없어서……."
10047020-147 = "그럼 저의 룸메이트들을 소개할게요."
10047020-148 = "이쪽은 맏언니인 카노에 선배."
10047020-153 = "무기 쨩에게 이야기 많이 들었어……. 잘 부탁해……."
10047020-154 = "애옹! 애오오옹!"
10047020-155 = "까악! 까아아악!"
10047020-157 = "[ns] \"트, 특이한 애완동물을 데리고 있네?\""
10047020-158 = "또 언제 들어온 거지……."
10047020-159 = "나도 모르는 애들이야……. 보통 적당히 있다가 나가니까 신경 쓰지 마."
10047020-160 = "[ns] \"그, 그렇구나…….\""
10047020-165 = "자, 다음은 저와 동급생인 에리."
10047020-170 = "선생님은…… <마법>이 존재한다고 생각하시나요?"
10047020-171 = "[s] \"여러 놀라움의 연속을 '마법'이라고 부른다면……?\""
10047020-172 = "역시! 선생님은 <이쪽 사람>이라고 생각했어요."
10047020-173 = "이제부터 선생님을 마스터라 부르겠어요!"
10047020-174 = "저는 이 만남에서 형용할 수 없는 마력의 이끌림을 느끼고 있거든요!"
10047020-175 = "[ns] \"나는 마스터였구나…….\""
10047020-180 = "그리고 이쪽은 막내인 레나 쨩."
10047020-185 = "선생님. 지금이라도 늦지 않았으니까 어서 도망쳐!"
10047020-186 = "나는 어쩔 수 없이 잡혀 있지만 당신은 아직 기회가 있다고……!"
10047020-187 = "[s] \"잡혀있……다고?\""
10047020-189 = "후후, 농담하는 거예요. 보시다시피 건강한 친구라서요."
10047020-190 = "마지막으로 저는 시이나 츠무기. 귀여운 분들과 살고 있는 백설 공주랍니다."
10047020-191 = "[s5] \"……잠자는 숲속의 공주 아니었어?\"\n[s6] \"……이상한 나라의 토끼 아니었어?\""
10047020-194 = "마음만 먹으면, 누구든지 될 수 있는 것이 나. #n이렇듯 예술에서는―"
10047020-199 = "—'페르소나.'"
10047020-200 = "……가 중요하니까요!"
10047020-202 = "[ns] \"오…….\""
10047020-203 = "봤지? 다들 정상이 아니야!"
10047020-204 = "히히…… 와일드헌트의 <정상>은, 뭘까……?"
10047020-205 = "레나 쨩도 말로는 싫다면서 사실 저희랑 지내는 거 좋아하잖아요?"
10047020-206 = "조, 좋아하긴 누가 좋아한다고!"
10047020-210 = "두고 봐! 언젠간 전부 사이비라는 걸 증명해 낼 테니까!"
10047020-211 = "[s] \"사이비? 무슨 소리야?\""
10047020-212 = "말씀드렸듯이, 와일드헌트에는 공식적인 부활동이 없답니다."
10047020-213 = "하지만 전공 이외의 취미 활동도 필요한 법."
10047020-214 = "창작욕구는…… 무한한 거니까……."
10047020-218 = "네! 그래서 제가 룸메이트 모두의 취향을 파악해 비공인 동아리를 만들었죠!"
10047020-219 = "예술의 역사에서 오컬트가 기여하는 철학적이고 심미적인 영역을 탐구하는 연구회!"
10047020-223 = "오컬트 연구회! 줄여서 <오컬연>!"
10047020-227 = "[ns7] \"오컬……연?\"\n[ns8] \"그래서 이런 느낌의 방이었구나.\""
10047020-230 = "자, 그런 의미에서 다시 자기소개를 하죠."
10047020-231 = "저는 시라오 에리. 전공은 회화!"
10047020-232 = "오컬연의 초대 회장이자, 마법의 존재를 연구하는 이 시대의 마지막 마법사입니다!"
10047020-233 = "시이나 츠무기.#n실용음악 전공, 오컬트 연구회의 부회장을 맡고 있죠."
10047020-234 = "활동 이유는…… 데스메탈로 정말 악마가 소환되는지 알고 싶어서?"
10047020-235 = "나는…… 이타가키 카노에. 전공은 비밀이야."
10047020-236 = "모르는 게 있으면 편안하게 물어봐. 난 무엇이든 알고 있으니까."
10047020-238 = "무. 엇. 이. 든. 말이야. 이히히……."
10047020-239 = "애옹! 애오오옹!"
10047020-240 = "까악! 까아아악!"
10047020-244 = "봤지? 다들 이상하지?!#n지금이라도 늦지 않았으니 어서 도망쳐!!"
10047020-245 = "혼자 정상인인 척하는 저 친구는…… 키누이 레나."
10047020-246 = "이상한 액세서리 센스랑 다르게 패션 디자인 전공이야."
10047020-247 = "이상한 건 눈알 방울 달고 있는 카노에 선배라고!"
10047020-248 = "하아…….#n다들, 오컬트 같은 걸 믿어버리고 말이야. 바보 같아."
10047020-249 = "하지만 오컬트는 실존해요! 실제로 관련된 여러 목격담이 들려온다고요."
10047020-250 = "D.U. 인근 해역에 나타나는 페로로 형태의 거대 괴수라거나……."
10047020-251 = "폐쇄된 놀이공원의…… 춤추는 인형들…… 히히."
10047020-252 = "수상한 책에서 나타난다는 정체불명의 요괴라거나?"
10047020-253 = "[s] \"그, 그건 좀 다른 이야기 같긴 한데…….\""
10047020-258 = "[ns] \"아무튼 기숙사 분위기는 즐거운 것 같네…….\""
10047020-259 = "기숙사뿐만 아니라 학원 전체가 즐거운 느낌이랍니다."
10047020-260 = "자. 그런 의미에서 함께 학원을 둘러보실까요?"
10047020-264 = "함께 학원을 둘러보며 예술에 숨은 오컬트를 연구해 보는 거예요!"
10047020-269 = "[ns] \"응. 그럼 안내를 부탁할게!\""
10047020-272 = "……하아, 난 몰라. 어쨌든 경고했으니까."
10047020-273 = "그럼 이걸로 결정이네요!"
10047020-274 = "네. 다 함께 출발하죠."
10047020-275 = "잠깐! 어디부터 갈지 정해두긴 한 거야?"
10047020-276 = "물론이죠. 이미 마스터가 도착하기 전부터 운명처럼 결정되어 있었어요."
10047020-277 = "첫 번째 장소는 제가 추천하는 장소랍니다."
10047020-278 = "후후, 저도 좋아하는 곳이죠."
10047020-279 = "설마, 거기?!"
10047020-280 = "히히…… 정답."
10047020-281 = "……제발 부탁이니까 사고만 치지 말아 줘."
10047020-283 = "(이렇게 와일드헌트 투어가 시작되었다.)"
