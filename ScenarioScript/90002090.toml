[translation]
90002090-1 = "9화;Dress Up"
90002090-6 = "오래 기다리셨죠, 선생님?"
90002090-7 = "[s] \"미도리……?\""
90002090-8 = "왜 그러세요……?"
90002090-9 = "[s] \"뭔가, 엄청나게 귀여워……!\""
90002090-10 = "에헤헤. 감사합니다. 다행이에요……."
90002090-15 = "아리스의 표현을 빌리자면, 우리는 모두의 새 갑옷과 무구를 만들었습니다."
90002090-16 = "지금 미도리가 입고 있는 방호복도 그중 하나죠."
90002090-17 = "[s1] \"모두?\"\n[s2] \"여덟 명 전부?\""
90002090-20 = "네."
90002090-21 = "그 정도야 뭐, 한다면 하죠. 여기서라면요."
90002090-22 = "디자인 쪽은, 아시겠지만 미도리가 이미 준비해 둔 것이 있었습니다."
90002090-23 = "당연히 기능성 쪽으로는 저와 토키가 검수했고요."
90002090-24 = "수송선에 새로 설치된 케이 쨩의 설비 덕분에, 작업이 엄청나게 쉬웠어요."
90002090-25 = "잠깐 스톱. 이 몸은 할 말이 아직 있도다, 동생이여."
90002090-26 = "왜 우리 둘만 이렇게 둔해 보이게 만든 거야?!"
90002090-28 = "실제 움직임에는 큰 문제 없을 텐데요. 생긴 것만 그렇지."
90002090-30 = "겉보기도 중요한 거라고, 이런 건!"
90002090-31 = "아픈 거 싫다며, 언니. 그래서 안전하게 만든 것뿐이야."
90002090-32 = "부, 분명 그렇게 말하긴 했는데……."
90002090-33 = "그래도 어? 뭔가 좀 어? 주인공답게 멋있게, 좀. 어?"
90002090-34 = "[s] \"내가 보기에는 충분히 괜찮은데?\""
90002090-35 = "어? 그, 그래? 선생님이 그렇다면야, 뭐. 에헤헤……."
90002090-37 = "아무튼 모모이와 미도리의 전투복은, 방어력 측면에서는 모든 슈트 중에서 최고입니다."
90002090-38 = "만에 하나…… 무슨 일이 일어나더라도, 마지막까지 살아남아, 모두의 뒷수습을 해 줄 수 있겠죠."
90002090-39 = "케, 케이 쨩?! 그런 불길한 이야기, 만들 때는 하지 않았잖아……?"
90002090-40 = "해 본 말입니다, 미도리. 그러려니 하고 넘겨요."
90002090-41 = "그리고 다음은–"
90002090-45 = "안녕하십니까. 선생님. 과거의 중무장으로부터 탈피하여, 경량화, 쾌속화, 최적화를 거친 기동형 아스마 토키입니다. 뿅뿅."
90002090-46 = "……정말 이럴 때는 한시도 가만히 있질 않네요……."
90002090-47 = "하지만 어떤 학생이든, 새 옷을 받게 되면, 가장 먼저 선생님께 보여 드리고 싶어지지 않을까요?"
90002090-48 = "모두가 그러지는 않을 수도 있어요……."
90002090-49 = "하지만 저는 그렇습니다."
90002090-50 = "네, 네. 알겠습니다……."
90002090-51 = "[s] \"그렇구나. 아비 에슈흐를 아리스에게 인계했으니까…….\""
90002090-52 = "네. 그렇게 된 김에 컨셉과 분위기를 완전히 일신. 이번에는 최전방에서 스피드로 승부하는, 기동 수색대로 활약할 예정입니다."
90002090-53 = "무엇보다 체온 저하 문제가 있었던 기존의 제 메이드복과는 달리, 보온성 측면에서 높은 점수를 주고 싶습니다."
90002090-57 = "[ns] \"……혹시, 지금까지 추웠어?\""
90002090-58 = "네."
90002090-59 = "[s] \"그런데 그런 복장이었던 거야?\""
90002090-60 = "네."
90002090-61 = "어째서냐고요?"
90002090-62 = "……."
90002090-63 = "선생님. 사람에게는 의지로 버텨야 할 때가 있습니다."
90002090-64 = "또다시 어째서냐고요?"
90002090-66 = "에이미에게 질 수 없었기 때문입니다."
90002090-67 = "[s] \"정말 영문을 알 수 없는 대답이구나, 토키야…….\""
90002090-68 = "괜찮습니다. 저는 알고 있기에."
90002090-73 = "토, 토키 씨……."
90002090-74 = "에휴……."
90002090-75 = "계속하죠. 두 정의 에너지 피스톨이 주 무장입니다. 배터리 셸이 전부 소진된 순간 이젝터로 후방 배출되죠."
90002090-76 = "색 배합은 제가 했어요! 토키 씨의 퍼스널 컬러는 아무래도 흰색과 청색일 거라고 생각해서 말이죠!"
90002090-77 = "그리고 이 흰색 재킷을 벗으면 저의 나이스 바디를 있는 그대로 감상하실 수도 있을 겁니다. 지금 보시겠습니까?"
90002090-78 = "네?!"
90002090-79 = "[s] \"안 되니까! 적어도 지금은 큰일 나니까!\""
90002090-80 = "그렇군요. 그렇다면 다음에 언젠가, 저희 둘만의 특별한 시간에 보여드리도록 하는 것으로."
90002090-81 = "토키 씨?!?!"
90002090-82 = "저런 거 하나하나 받아 주다가는 날 샐 겁니다, 미도리……."
90002090-83 = "아무튼 다음은 에이미입니다. 뭐라고요? 벌써부터 더워 죽겠다고요?"
90002090-84 = "좀 참아 봐요……. 가끔은 당신의 체질을, 생물학적인 것이 아니라 공학적으로 분석해 보고 싶어진다니까요……."
90002090-90 = "후우……."
90002090-91 = "에이미?! 케이프는 어쨌어요!?"
90002090-92 = "그거? 더워서 벗었는데?"
90002090-93 = "아니, 그건 보면 대충 아는데……."
90002090-94 = "에이미, 당신 이번에는 주로 후방 지원 담당이잖아요? 그러면 케이프라도 써서 위장 지수를 높여야 '효율적인' 것 아니에요?"
90002090-95 = "그렇지만 그걸 계속 입고 있다가는, 내가 먼저 열사병으로 쓰러질 것 같았는걸."
90002090-96 = "지정 사수가 더위 때문에 지원 포인트를 맞추지 못하면, 그거야말로 비효율적이잖아?"
90002090-98 = "네……. 뭐……. 이럴 줄 알고, 에이미 씨의 케이프는 허리에 묶기 좋은 디자인으로 작업해 두었지만요."
90002090-100 = "고마워, 미도리. 덕분에 좀 살 것 같았어."
90002090-101 = "……."
90002090-102 = "그래요……. 제 불찰이네요……. 이 사람은 이런 사람이었지, 애초에……."
90002090-103 = "토키와 같이, 에이미의 주 무장을 교체했어요. 배터리 셸을 사용하는 에너지 무기라는 점에서, 공통점을 갖고 있죠."
90002090-104 = "그 출력이나 배터리 용량은, 완전히 다르기는 하지만요."
90002090-105 = "바이저 역시 빠르게 지원 포인트를 맞추기 위해 추가한 HUD이고, 그러다 보니 전체적인 에너지 소모율이 높아져서……."
90002090-106 = "백팩 역시, 토키의 그것보다 훨씬 대형화된 상태입니다."
90002090-108 = "그래서 어때, 선생님?"
90002090-109 = "효율적으로 보인다고? 음……."
90002090-110 = "……."
90002090-111 = "[s] \"왜 그래, 에이미?\""
90002090-112 = "아냐, 스스로도 조금 이상해서. 예전 같으면 그건 최고의 칭찬이었을 텐데……."
90002090-113 = "지금은, 약간 다른 말이 듣고 싶어지고 있어서."
90002090-114 = "어떤 말이냐고? 가령……."
90002090-118 = "……."
90002090-119 = "예뻐?"
90002090-121 = "?!"
90002090-122 = "!?"
90002090-127 = "[ns] \"응. 정말 예쁘고 잘 어울려.\""
90002090-128 = "그래."
90002090-129 = "고마워, 선생님."
90002090-131 = "미도리. 저 지금 뭔가 무서운 장면을 본 것 같은데요……."
90002090-132 = "그, 그런 식으로 말하면 안 돼, 케이 쨩!"
90002090-133 = "알아요. 저도 안다구요. 그런데……."
90002090-137 = "……."
90002090-138 = "으어어. 이해 불가능성은 빠르게 망각하기로 하고, 거기. 벌써부터 신이 나신 분. 슬슬 나오시죠."
90002090-141 = "후후. 제 새로운 슈트는 어떠신가요, 선생님?"
90002090-142 = "[s] \"어……. 이런 말을 하는 건 조금 미안할지도 모르는데…….\""
90002090-143 = "네?"
90002090-144 = "[s] \"춥지…… 않아?\""
90002090-145 = "어머나. 무슨 말씀을 하시나 했더니."
90002090-146 = "걱정하지 마세요. 저 정도의 초천재병약만능전투미소녀해커가, 그 정도도 대비하지 못했을까요."
90002090-147 = "방한, 방수, 모든 상황에 대한 대응성 및 가녀림과 청초함까지 갖춘, 현장 지원 사양의 만능 슈트랍니다."
90002090-151 = "[ns3] \"가녀림…….\"\n[ns4] \"청초함…….\""
90002090-157 = "……예전부터 묻고 싶었던 거긴 한데요, 그런 말 스스로 하고도 괜찮은 건가요……?"
90002090-158 = "케이도 참. 사실에 대한 명확한 서술이야말로, 과학적 방법론의 기초 아닌가요?"
90002090-159 = "사실에 대한 명확한 서술……. 네……. 알겠습니다……. 제가 졌어요……."
90002090-160 = "그렇지만 역시, 새삼 이렇게 정결함을 상징하는 듯한 순백색 슈트를 입고 나니……."
90002090-161 = "흑흑……."
90002090-162 = "[s] \"히마리? 왜 그래, 무슨 일이야……?\""
90002090-163 = "어떡하죠, 선생님……. 제가 너무 아름답고 귀여워서, 감동한 나머지 눈물이 나오고 말았어요."
90002090-164 = "미안해, 선생님. 지금의 히마리 부장은 내가 책임지고 어떻게든 해 볼게."
90002090-169 = "에이미? 에이미!? 아직 제 소개 안 끝났는데요–?!"
90002090-172 = "[ns] \"폭풍이 지나갔군…….\""
90002090-173 = "말 그대로네요……."
90002090-174 = "(부, 분위기를 환기해야 해! 이대로는……!)"
90002090-178 = "리오 회장? 나와 주세요! 어서요!"
90002090-185 = "[ns] \"리오……?\""
90002090-186 = "왜 그래, 선생?"
90002090-187 = "[s] \"아니, 그게…….\""
90002090-188 = "선생이 왜 그런 반응을 보이는지는 잘 모르겠지만, 이렇게 됐어."
90002090-189 = "현장 대처, 시설 활용, 상황 분석…… 어느 방면이든 대응할 수 있는, 범용성에 중점을 둔 전투 슈트지."
90002090-190 = "말 그대로, 합리적이야."
90002090-191 = "왠지 모르게 그래야 할 것 같아서, 히마리 선배와 대조되는 방향으로 색조를 잡았어요. 그런데……."
90002090-192 = "지금 생각해도 그 디자인 방향성에는 조금 문제가 있다고 생각해요, 미도리–!!!"
90002090-193 = "부장. 진정해. 그렇지 않으면 억지로 다시 개인실 안에 집어넣어 버릴 거야?"
90002090-194 = "우우우……."
90002090-195 = "히, 히마리 부장은 계속 저렇게 말했지만, 이건 어쩔 수 없어요! 디자이너로서의 자존심 같은 게 걸린 문제였으니까요!"
90002090-197 = "저는 제 선택과 결정에…… 조금의 후회도 없어요!"
90002090-202 = "저는 이 일에 대해서는, 특별히 말을 덧붙이지 않기로 했습니다……."
90002090-203 = "아무튼 리오의 슈트 기능 중 또 하나 신경 쓴 부분은, 방어적인 측면에서의 보강과 전자전 대응 사양을 갖추었다는 것이었습니다."
90002090-204 = "히마리와는 달리, 현장에서 기술적인 지원을 직접 담당하겠다고 해서 말이죠."
90002090-205 = "[s] \"리오가? 위험하지 않을까……?\""
90002090-206 = "그렇지만 히마리가 현장에 가는 것보다는, 내가 가는 것이 합리적이지 않을까?"
90002090-207 = "여기는 강철대륙이고, 다른 상황이나 전장과는 달리, 테크 레벨에서의 전투 역시 상정할 수밖에 없을 거야."
90002090-208 = "[s5] \"그래. 그렇구나.\"\n[s6] \"잘 부탁해, 리오.\""
90002090-211 = "응."
90002090-212 = "맡겨 줘, 선생."
90002090-213 = "그리고 다음은……."
90002090-219 = "유즈?"
90002090-220 = "……나오시죠, 유즈. 뭘 여기까지 와서……."
90002090-221 = "유즈 쨩? 괜찮으니까, 응?"
90002090-229 = "우우우……."
90002090-230 = "[s] \"어라? 모모이나 미도리와는…… 많이 다르네?\""
90002090-231 = "그, 그게요……."
90002090-232 = "내가 특별히 요청한 부분이 있었어."
90002090-233 = "네. 원래는 저희랑 같은 방향으로 하려고 했는데……."
90002090-234 = "[s] \"그런데 어째서?\""
90002090-235 = "……."
90002090-236 = "지금은 말하지 않는 방향으로 부탁하고 싶은데, 괜찮을까?"
90002090-237 = "여기는 강철대륙이고…… 지금 우리의 대화도, 어쩌면 실시간으로 그 일부분을 도청당하고 있을 수도 있어."
90002090-238 = "거기에 유즈의 슈트 사양을 이런 방향으로 부탁한 것은, 아마도 웬만해서는 일어나지 않을, 만일의 가능성을 대비하고자 한 것이니까."
90002090-239 = "[s] \"즉, 비장의 수는 아군에게까지 숨겨 두고 싶은 거구나?\""
90002090-240 = "……미안해, 선생. 그리고 모두. 이러면 안 된다는 것은 알고 있고."
90002090-241 = "모두를 믿어야만, 개인이 할 수 있는 일의 영역을 뛰어넘을 수 있다는 것도, 이제는 알지만……."
90002090-242 = "[s] \"괜찮아. 리오를 믿을게.\""
90002090-243 = "저, 정말……?"
90002090-245 = "괜찮겠습니까, 선생님?"
90002090-246 = "네? 리오가 지금까지 정말 나쁜 뜻으로 어떤 계획을 세워 온 적은 없었으니까요?"
90002090-247 = "뭐, 그렇게 보자면 그렇게 볼 수 있는 문제이긴 한데요……."
90002090-248 = "네! 아리스도 그렇게 생각합니다!"
90002090-249 = "아리스?!"
90002090-250 = "아리스 쨩!?"
90002090-251 = "아리스, 쨩……???"
90002090-256 = "……."
90002090-257 = "믿어, 주는 거야……?"
90002090-258 = "네. 왜냐하면 리오 선배는, 아리스의 아비 에슈흐와 케이의 총을, 마지막까지 최선을 다해 조정해 주셨으니까요!"
90002090-259 = "리오 선배가 나쁜 마음을 품고 있었다면, 절대로 그렇게 해 주셨을 리가 없었을 거라고 생각합니다!"
90002090-260 = "저도 했거든요?!"
90002090-261 = "맞습니다! 히마리 선배도 함께해 주셨습니다!"
90002090-262 = "후…… 좋아요. 아리스의 얼굴을 보아, 이번은 넘어가도록 하죠."
90002090-263 = "숨겨진 기능도 많으니, 기대하셔도 좋답니다?"
90002090-268 = "[ns] \"그리고 보니, 케이의 총?\""
90002090-269 = "네?"
90002090-270 = "아, 네. 뭐…… 그런 거죠."
90002090-271 = "지금의 키보토스에서 총 없이 돌아다닌다는 건, 대충 알몸으로 돌아다니는 것보다 이상한 일이기도 하고……."
90002090-272 = "이름은 에아렌델: 루미너스 노바. 마찬가지로, 에너지 무기지."
90002090-273 = "우우우……. 역시 저는 아직도 잘 모르겠어요……. 이 옷이 저에게, 어울리는 걸까요……?"
90002090-274 = "그 이전에, 제가 이런 자리에 어울리기는 한 걸까요……?"
90002090-275 = "[s7] \"괜찮아, 유즈. 어느 쪽이든 어울려.\"\n[s8] \"우리는…… 유즈가 필요해!\""
90002090-278 = "네, 네에?!"
90002090-279 = "그건, 그러니까……."
90002090-280 = "선생님께서 그렇게 말씀, 하신다면……."
90002090-281 = "알겠, 어요. 최선을…… 다하겠습니다."
90002090-282 = "[s] \"그러면, 마지막 점검이야!\""
90002090-294 = "저, 케이?"
90002090-295 = "왜 그래요, 리오?"
90002090-296 = "너에게만 살짝, 이야기해 두고 싶은 것이 있어서."
90002090-297 = "? 왜 저죠? 선생님도 있잖아요."
90002090-298 = "그게."
90002090-299 = "예전에 있었던 일들로부터 추론해 본 것이지만."
90002090-300 = "너는…… 어떤 정보를, 강철대륙과 그 세 명의 아이로부터 숨길 수 있지?"
90002090-301 = "……."
90002090-302 = "눈치가 빠르군요. 어떻게 알았죠?"
90002090-303 = "티페레트에게 도달할 때까지, 그 세 명은 너와 아리스의 존재를 몰랐으니까."
90002090-304 = "그래서, 저에게라면 조금 전의 그 비밀…… 비장의 수를 공유할 수 있다고 판단한 거군요?"
90002090-305 = "알겠어요. 하지만 오래는 안 됩니다. 여기에서 세울 수 있는 방화벽의 지속 시간은, 아무리 길어 봤자 30초도 안 될 테니까요."
90002090-306 = "그래. 그 정도면 어떻게든 될 것 같아."
90002090-309 = "……."
90002090-310 = "………."
90002090-311 = "…………."
90002090-312 = "왜, 왜 그래?"
90002090-313 = "리오. 당신."
90002090-314 = "으, 응?"
90002090-315 = "제정신, 아니군요……?"
90002090-316 = "그, 그런가……? 이 정도는 누구나……."
90002090-317 = "아뇨. 만에 하나라는 가능성을 위해서, 여기까지 대비하는 것은 보통의 영역이……"
90002090-318 = "……아뇨. 여기는 강철대륙이니, 그 가설과 대비까지도 가능성의 하나로 고려하기는 해야겠네요."
90002090-319 = "그렇다고는 해도, 맙소사……."
90002090-320 = "이상한, 걸까……?"
90002090-321 = "다른 케이스라면 그렇게 생각했을지도 모르겠습니다만."
90002090-322 = "이 경우에는……."
90002090-323 = "……."
90002090-324 = "당신이 있어 줘서, 어떤 의미로는 다행이겠네요. 리오."
90002090-325 = "그, 그래……?"
90002090-326 = "어쨌든, 그래서 유즈의 슈트를 그런 방식으로 만들자고 한 거군요?"
90002090-327 = "맞아."
90002090-328 = "그리고 아까 이야기했던 두 번째 단계 말인데……."
90002090-329 = "안 될 건 없을 거예요. 오히려 어떤 의미로는 선례가 있었으니……. 오히려 쉬울 수도 있죠."
90002090-330 = "물론 저 역시 당신의 말처럼, 그런 걸 꺼낼 일이 없었으면 하지만요."
90002090-331 = "그래. 그렇지. 비장의 수는 사용되지 않을 때가 가장 강한 법이니까."
90002090-332 = "[s] \"응? 비장의 수?\""
90002090-333 = "서, 선생?!?!"
90002090-334 = "이건, 그러니까, 그건……!"
90002090-335 = "……."
90002090-336 = "깜짝 파티에서, 어떤 요리를 만들어 와야 비장의 수가 될지, 이야기하고 있었어요."
90002090-337 = "[s] \"깜짝 파티라니?\""
90002090-338 = "뭐."
90002090-339 = "우리, 이길 거잖아요. 안 그래요?"
90002090-340 = "[s] \"아하. 그런 이야기구나.\""
90002090-341 = "네."
90002090-342 = "그렇죠, 리오?"
90002090-343 = "……."
90002090-344 = "그래. 맞아."
90002090-345 = "뭐하고 계신가요, 선생님? 아, 리오 선배도, 케이도요!"
90002090-346 = "네? 이 일이 끝난 다음, 깜짝 파티에 대한 것인가요? 그거 좋네요!"
90002090-347 = "아리스는 선생님과 함께라면 무엇이든 좋습니다!"
90002090-348 = "[s9] \"맞아! 선생님도 그래!\"\n[s10] \"그렇게 하기 위해서라도…… 꼭 무사히 돌아가야겠지?\""
90002090-351 = "……뭐, 그래야겠죠."
90002090-352 = "그리고 그렇게 하기 위해, 조금 더 구체적인 계획을 제안할까 합니다."
90002090-353 = "구체적인 계획?"
90002090-354 = "네. 각 예언자의 격퇴와 구역 점령 자체는 특별한 순번 없이, 선생님의 지시에 따라 진행하면 될 것 같지만요."
90002090-355 = "<비나>의 구역만큼은 가장 먼저 점령해야 할 것으로 보입니다."
90002090-356 = "[s] \"비나를 첫 번째로? 어째서?\""
90002090-357 = "지금 막, 간신히 비나의 위치를 알아내는 데에 성공했기 때문입니다."
90002090-358 = "[s] \"역시 케이 쨩이야!\""
90002090-359 = "케이 쨩 아니라구요!!!"
90002090-360 = "크흠……. 그리고 이유는 또 하나 있습니다."
90002090-361 = "조금 전에 강철대륙 전체가 일종의 네트워크로 뒤덮여 있다고 했죠?"
90002090-362 = "비나의 구역에, 그 네트워크로 들어가는 방화벽이 설치되어 있습니다."
90002090-363 = "강철대륙 네트워크의 보안을 돌파하기 위해서는, 그 방화벽을 물리적으로든 전자적으로든 해제해야 할 필요가 있어요."
90002090-364 = "그 방화벽을 돌파하는 데 성공한다면, 나머지 예언자의 위치도 어느 정도 더 쉽게 알아낼 수 있을 겁니다."
90002090-365 = "거기에다 그 방화벽을 내버려두면…… 아리스의 표현을 빌리자면."
90002090-366 = "제가 아무리 레벨을 높여도, 강철대륙에 확장 중지 명령을 내릴 수 없게 될 테니까요."
90002090-367 = "[s] \"그렇, 구나?\""
90002090-368 = "즉, 지금 케이가 알아낸 정보는 일종의 총괄 매뉴얼 같은 것이고, 그 너머의 상위 보안 권한을 획득하기 위해서는……."
90002090-369 = "네. 비나로부터 시작되는 강철대륙 네트워크의 접근 권한과, 비나의 정보 코어가 가장 먼저 필요합니다."
90002090-370 = "[s] \"그러면 첫 번째 목표는 정해진 셈이네.\""
90002090-371 = "네. 선생님. 우리의 첫 목표는."
90002090-372 = "스스로 칭하기를, <다름을 통감하는 숙고의 이해자>."
90002090-374 = "데카그라마톤의 세 번째 예언자, 비나입니다."
90002090-376 = "다음화;000, 00, 0"
