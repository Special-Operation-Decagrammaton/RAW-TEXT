[translation]
103080-1 = "제8화;작전 브리핑"
103080-14 = "자. 작전 계획서가 완성되었어."
103080-15 = "여기 계신 분들이 작전 수립에 도움을 주셨어요. 감사드립니다."
103080-16 = "작전명은, <아트라하시스의 방주 점령전>."
103080-17 = "……. 아마도 이것이 저희들의 마지막 작전이 되겠군요."
103080-19 = "마, 마지막……."
103080-21 = "성공한다면 그걸로 끝이고, 실패해도 끝나게 되겠지. ……키보토스가."
103080-22 = "그러네요. 어느 쪽이든 마지막이겠네요."
103080-24 = "서, 성공하면 되잖아요! 괜히 불안하게 말하지 마요, 카요코 씨!"
103080-29 = "그래. 다양한 분야의 전문가들이 모여서 검증을 끝낸 내용이잖아?"
103080-30 = "가장 완벽한 작전이라고 생각하는 거야!"
103080-32 = "……그럼 작전 설명에 들어가겠습니다."
103080-35 = "저희의 가장 큰 목표는, 키보토스 상공에 있는 <아트라하시스의 방주>를 파괴하는 것입니다."
103080-36 = "그걸 파괴해야만 거짓된 성소가 키보토스에 나타나는 것을 막을 수 있는 거지."
103080-39 = "하지만 방주는 외부의 물리적인 개입이 불가능하게 만드는 <확률적 중첩 상태>의 배리어로 보호되고 있습니다."
103080-40 = "이 배리어가 있는 이상 방주에 물리적으로 도달하는 것은 불가능."
103080-42 = "따라서 저희는 <우트나피쉬팀의 배>를 그것과 동일한 <확률적 중첩 상태>로 만들어서 배리어를 통과할 예정입니다."
103080-44 = "즉, 상대와 같은 존재가 된다면 확률과 무관하게 개입할 수 있다는 얘기지."
103080-46 = "그 다차원해석의 계산은 제가 이 배의 연산장치를 이용해서 진행할 예정이에요."
103080-48 = "계산에 실패하면 어떻게 되지?"
103080-54 = "그러게요. 만약 계산에 실패한 채로 <확률적 중첩 상태>인 공간으로 진입한다면……."
103080-55 = "……운이 나쁘면 원자 단위로 산산조각이 날 거고, 운이 좋다면 배에서 튕겨져 나가 75,000m 높이에서 추락하겠네요."
103080-57 = "그, 그 높이라면…… 헤일로가 파괴되겠네요……."
103080-58 = "아니, 지상에 닿기도 전에 죽을 거야."
103080-62 = "그 높이면 영하 60도가 넘어. 한 번만 숨을 들이쉬어도 폐가 얼어버릴 거야."
103080-63 = "게다가 몸 안의 체액이 순식간에 끓어서 기화되겠지. 이 극한의 환경에 노출되면 아마 2분도 못 버티고 헤일로가 부서질 거야."
103080-64 = "……. 좋은 정보 고마워요, 카요코 씨. 큰 힘이 되네요."
103080-69 = "……. 실패는 상정하지 않습니다."
103080-70 = "배리어를 통과한 뒤에는 방주에 물리적으로 충격을 가하고, 그 내부로 진입합니다."
103080-71 = "방주 내부에 침입하여 방주의 중요 시설들을 해킹, 더 이상 작동하지 못하도록 철저하게 파괴해야 합니다."
103080-72 = "당연히 방주 내부의 적들이 공격해 오겠죠."
103080-73 = "그 공격을 방어하며, 방주의 각 구역들을 조금씩 [ruby=해킹]점령[/ruby], 최종적으로 방주의 통제권을 저희가 뺏어오는 것, 그것이 이 작전의 최종 목표가 됩니다."
103080-75 = "그렇게 방주의 통제권을 장악하면, 방주를 자폭시키거나 지상으로 추락시킬 수도 있을 거예요."
103080-76 = "그래. 즉, 방주를 해킹해서 빼앗는다, 그게 우리의 승리 조건인 거지."
103080-78 = "갑자기 알기 쉽게 이해되는데요?"
103080-79 = "그런데……."
103080-85 = "……아. 참고로 나는 단순한 서포트형 AMAS 같은 건데……."
103080-90 = "리오 회-장?!"
103080-95 = "……바로 들켰네요."
103080-96 = "어디 갔나 했더니 여기 있었던 거야?! 아니, 어디서 뭐 하는 거야?"
103080-97 = "그, 그건……."
103080-98 = "……정말. 여기 아리스 쨩이랑 게임개발부 부원들이 있지 않아? 무슨 염치로 여기 있는 거야?"
103080-99 = "……. 리오는 여기서 저를 돕고 있는 중이에요."
103080-103 = "제가 감시하고 있으니까, 걱정하진 마세요. 허튼짓하면 바로 부숴버릴 테니까."
103080-104 = "하아……"
103080-105 = "무슨 속셈인지는 모르겠지만 절대 게임개발부 쪽으론 접근도 하지 마!! 내가 감시할 거야!!"
103080-106 = "일단 나중에 얘기해, 회장. 할 말이 많으니까. 그래, 그 횡령 건부터 철저하게 따져줄 테니까!!"
103080-111 = "……. 알겠어."
103080-112 = "만약을 대비해서 내가 지상으로 돌아올 수 있는 방법을 찾아 보겠어. ……물론 허락해 준다면 말야."
103080-113 = "그래요. 부탁드릴게요. 우트나피쉬팀이 고장 난다면 저희는 꼼짝없이 그 방주에 갇혀버리는 꼴이 될 테니까."
103080-114 = "그래. 그럼 바로 준비해 볼게."
103080-117 = "아유무, 앞으로 저희에게 남은 시간은요?"
103080-122 = "네, 거짓된 성소의 재출현 시기까지…… 약 12시간 남은 걸로 예상됩니다."
103080-124 = "으으…… 그때까지 이 전함을 타고 하늘 위로 올라가서 방주를 점령해야 한다는 거잖아?"
103080-125 = "가능한 작전인 건 맞지?"
103080-127 = "네. 시뮬레이션도 몇 번이나 돌려봤거든요."
103080-128 = "성공 확률이 무려 3% 나 돼요."
103080-129 = "3%……."
103080-130 = "으응…… 기적 같은 확률을 뚫고 성공시켜야 하겠네요."
103080-131 = "[s] \"이 정도면 해볼 만하다고 생각해.\""
103080-133 = "……네. 선생님 말씀이 맞습니다."
103080-134 = "키보토스에 도래한 이 미증유의 사태……. 처음부터 저희들은 이 불가해한 문제들을 어떻게든 헤쳐 나가며 여기까지 왔습니다."
103080-136 = "최초의 징후, 유리조노 세이아의 <예언>이 있었던 이후로……."
103080-137 = "6개의 고위급 에너지가 키보토스에 탐지되었을 때, 그것은 존재하지만 보이지 않는 불가해한 현상일 뿐이었습니다."
103080-139 = "그 후에 나타난 <거짓된 성소>는 지금까지 키보토스에서 발생한 모든 <신비>를 총망라해서 공격해 왔습니다."
103080-140 = "통제 불능의 AI <데카그라마톤>, 기억을 재현한다는 <미메시스>, <이름 없는 신들>이라는 초고대 기술과,"
103080-141 = "……그리고 키보토스 학생들의 존재를 왜곡시킨다는 <색채>까지……."
103080-143 = "대규모의 연합 작전을 통해 결국 수호자들을 쓰러트리고, 모든 성소를 파괴하는 데 성공했지만……."
103080-144 = "지금은 다시 성소가 부활하려고 하고 있는 상태입니다."
103080-145 = "지금까지 벌어진 상황들…… 그중에서 어느 것 하나도 제대로 이해할 수 있는 건 없었습니다."
103080-146 = "예언, 데카그라마톤, 미메시스, 색채, 이름없는 신들, 디비전, 거짓된 성소, 수호자, 색채의 인도자 프레나파테스까지……."
103080-147 = "성공확률이 3%라고 하지만…… 상관없습니다. 저희는 지금까지 그래왔듯이 그런 확률을 헤쳐 나가지 않으면 안 됩니다."
103080-148 = "[s] \"그래. 모두들 한번 해보는 거야.\""
103080-150 = "……네. 선생님 말이 맞아요. 여기서는 하는 수밖엔 없겠죠."
103080-151 = "응. 맞아."
103080-152 = "……네. 시로코 선배를 돌려받기 위해서라도."
103080-154 = "하아……. 어쩔 수 없겠지."
103080-155 = "여기까지 왔으면 나아갈 수밖에 없는 거죠."
103080-157 = "그럼 <우트나피쉬팀의 배>를 지금부터 8시간 안에 발진시킬 수 있게 준비해 주십시오."
103080-158 = "뭐?! 자, 잠깐만. 8시간 뒤에?"
103080-159 = "이미 매뉴얼은 있으니까요. 이걸 전부 외우면 어떻게든 될 겁니다."
103080-160 = "그, 그런 사람이 있어? 이 두꺼운 걸 몇 시간 만에 다 외워야 하잖아……."
103080-161 = "할 수 있느냐가 아니라, 해야만 하는 일입니다. 매뉴얼을 전부 숙지한 사람이 <우트나피쉬팀의 배>의 오퍼레이터가 되어줘야 합니다."
103080-162 = "하아…… 오퍼레이터라…… 10명 정도는 있어야 할 텐데……."
103080-163 = "[s] \"그럼 내가 배의 총책임자를 맡을게.\""
103080-164 = "선생이?"
103080-165 = "[s] \"싯딤의 상자의 능력으로 어떻게든 될 거야.\""
103080-166 = "그렇군요……. 말을 꺼낸 사람이 구경만 하면 안 되겠죠. 제가 지원하겠습니다."
103080-168 = "리, 린 선배?"
103080-170 = "여기까지 와서 몸을 사릴 이유는 없겠죠. 가장 위험한 일을 선생님에게만 맡길 수는 없으니까, 저도 함께하겠습니다."
103080-171 = "[s] \"린……, 든든해!\""
103080-177 = "책을 외우기만 하는 거라면 저, 저도 어떻게든 가능할 것 같아요……."
103080-179 = "아유무 선배까지?!"
103080-181 = "뭐, 선생님이 그렇게 말하는데 세미나의 회계인 내가 물러설 수는 없지. 나도 할게."
103080-182 = "저도 함께하겠습니다. 외우는 건 저도 꽤 잘하거든요♡"
103080-184 = "하아. 게헨나에선 선도부 선임행정관인 제가 이 책무를 피할 수는 없겠죠!"
103080-185 = "저도요!"
103080-186 = "네, 저도 함께하겠어요!"
103080-187 = "그리고 무엇보다……"
103080-188 = "시로코 선배를 구해야 하니까요!"
103080-190 = "이러려고 여기 온 건 아니지만 말야. 하아…… 이런 분위기라면 어쩔 수 없겠네."
103080-192 = "우와…… 다들 의욕 충만이네."
103080-193 = "참고로 말해두지만, 나는 무리거든?"
103080-194 = "모모카 쨩…… 설마 여기까지 와서 우리와 함께하지 않으려는……?"
103080-201 = "분명 모모카 쨩이 우주 끝까지라도 따라가 준다고 한 말을 기억하고 있는데……."
103080-203 = "우, 우와아아! 그런 표정 짓지 말라고!"
103080-204 = "……알겠어, 알겠으니까!"
103080-205 = "나도 할게, 하지 뭐! 할 수 있겠지……."
103080-207 = "후후, 우주전함의 승무원이라, 울림이 좋네요♡"
103080-208 = "그럼 코스튬도 제공되나요?"
103080-210 = "네? 코스튬……?"
103080-211 = "어머나? 우주전함의 승무원이잖아요? 분명 이런저런 의도로 만들어진 전용 의상이 있어야 하지 않겠어요?"
103080-213 = "자, 잠깐만……? 전용 의상?"
103080-214 = "응, 그건 내가 준비할 수 있을 것 같아."
103080-215 = "뭐?! 히비키?! 그거 준비할 시간이 있어?"
103080-216 = "하지만 우주전함의 승무원복이잖아."
103080-217 = "이런 거대한 도전……"
103080-219 = "받아줄 수밖에 없지."
103080-223 = "오오, 엔지니어부의 로망을 배신할 수는 없죠! 발진! 이라든가, 고도 상승! 에너지 충전 같은 대사를 외쳐야 하는데 교복이면 이상하잖아요!"
103080-224 = "……그건 그렇지."
103080-225 = "좋아! 이건 할 수밖에 없겠네."
103080-226 = "네! 좋습니다! 저도 레퍼런스를 찾아볼게요! 애니나 만화에 많이들 있으니까!"
103080-228 = "응, 그럼 지금 당장 제작에 들어갈게. 일단 모두의 사이즈부터 재야겠어."
103080-229 = "어머나…… 기대되네요. 디자인은 저랑 심도 깊은 토론을 해봐요♡"
103080-231 = "그렇군요. 그러면 저는 거기에 이런저런 기능들을 추가해서 단순한 의상이 아니라 파일럿 슈트 같은 느낌으로 개조해 볼게요."
103080-232 = "선생님은 의견 없으신가요?"
103080-233 = "[s] \"있어요, 의견 있습니다!\""
103080-235 = "뭔가…… 불안한데."
103080-237 = "[ns1] \"우주 전함의 오퍼레이터라면 당연히 게리슨 모자를 써야지!!\"\n[ns2] \"승무원이니까 목 스카프가 정석이지!!\"\n[ns3] \"다른 건 모르겠고, 제일 중요한 함장은 무조건 롱코트야!!\""
103080-243 = "꽤 구체적이네요……."
103080-244 = "흐음. 알겠어. 선생님의 의견은 참고해 볼게."
103080-246 = "(대체 무슨 일이 벌어지고 있는 거야…….)"
103080-250 = "하아, 그럼 대충 정리되었네."
103080-251 = "그럼 지금부터 발진 준비를 시작해서, 8시간 뒤에 하늘 위의 <방주>로 날아가는 거네."
103080-252 = "오퍼레이터 담당, 항공관제 담당, 해킹 담당…… 그 외에 식사 담당과 치료 담당분들을 모셔야 하고……."
103080-253 = "그래. 방주의 점령전을 수행할 학생들도 소집해야 하고 말야."
103080-259 = "린 선배……"
103080-260 = "지금까지 선배는 물론 선생님과 샬레의 학생들 모두가 쉬지도 못하고 지금까지 달려왔어요……."
103080-261 = "지금 조금이나마 휴식을 하는 게 필요하지 않을까요? 린 선배는 특히……."
103080-262 = "……네."
103080-263 = "앞으로의 작전에 지장이 생길지도 모르니, 시간을 내서라도 휴식을 취해두지 않으면 안 되겠군요……"
103080-264 = "그럼 모두들, 지금으로부터 8시간 뒤. 해가 뜨면 바로 출발하는 것으로 하겠습니다."
