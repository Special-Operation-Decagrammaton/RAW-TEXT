[translation]
84311100402-6 = "아직도 붙잡히지 않았군요. 네루의 말대로, 도망치는 데에는 일가견이 있는 모양이네요."
84311100402-7 = "후후, 당연하죠. 제가 하루이틀 이 일을 했다고 생각하시는 건가요?"
84311100402-11 = "어라? 그런데 누구시죠? 트리니티 학생분 같은데…… 옷을 보아하니, 꽤 직위가 있는 분 같으시네요."
84311100402-12 = "눈썰미가 좋네요. 하지만 지금은 그저 엑스포 참관 학생 중 한 명일 뿐이랍니다."
84311100402-13 = "그래요? 후후, 잔뜩 놀다 가시라고요! 지루한 곳이지만, 그래도 이것저것 준비하려고 노력한 것 같으니까요!"
84311100402-14 = "지루한 곳……? 여기가요?"
84311100402-15 = "참고로 코유키 씨에게 \"지루하지 않은 곳\"은 어디가 있을까요?"
84311100402-19 = "네? 뭐…… 몇 군데 있는데요? 게임 센터도 있고, 겜블하는 곳도 있고, 샬레 휴게실이라던가……"
84311100402-20 = "(대충 성향을 알 수 있는 리스트네요.)"
84311100402-21 = "흠…… 그런데 그건 왜 물어보시죠?"
84311100402-22 = "별 건 아니에요. 저도 은근히 비슷한 취향이거든요."
84311100402-23 = "……!!! 오오오-!!"
84311100402-25 = "그럼 연락처라도 알려 주시겠어요? 다음에 괜찮을 때 말씀드릴 테니!"
84311100402-26 = "나쁘지 않네요. 그럼 그렇게 하죠."
84311100402-28 = "하지만 공개적으로, 이 연락망은 존재하지 않는 거예요. 꼭 비밀로 지켜주셔야 합니다."
84311100402-29 = "후후후, 누가 할 말씀을…… 점점 더 마음에 드는군요."
84311100402-30 = "좋아요! 기억해 두겠습니다!!"
