[translation]
90101110-1 = "ตอนที่ 11;บทส่งท้าย"
90101110-2 = "(หลังจากเหตุการณ์คลี่คลายและเริ่มมีเวลาว่าง คุณครูก็แวะไปที่องค์การนักเรียน)"
90101110-5 = "[ns] \"รินจัง!\""
90101110-6 = "ห้องรับรอง องค์การนักเรียน"
90101110-7 = ""
90101110-8 = "อ๊ะ คุณครู [USERNAME]"
90101110-9 = "ไม่ได้เจอกันนานเลยนะคะ ช่วงนี้สบายดีหรือเปล่าคะ?"
90101110-10 = "ว่าแต่ รินจังนี่ใครเหรอคะ...?"
90101110-11 = "[s1] \"สัปดาห์นี้งานไม่ยุ่งมาก ครูเลยมาให้กำลังใจรินน่ะ\"\n[s2] \"ครูไม่ได้เจอรินจังนานแล้ว คิดถึงมากเลย...\""
90101110-13 = "เฮ้อ..."
90101110-14 = "ถึงจะพูดแบบนั้น แต่จริงๆ แล้วมาที่นี่เพราะมีธุระอย่างอื่นใช่มั้ยคะ?"
90101110-15 = "อย่างเช่น ขอเลื่อนกำหนดส่งรายงานการเบิกจ่ายงบประมาณของชาเล่ต์ที่ล่าช้ามาแล้วหนึ่งเดือน"
90101110-16 = "หรือจะขอให้ช่วยเขียนรายงานเหตุผลการปฏิบัติงานนอกสถานที่ เพื่อยื่นต่อคณะกรรมการบริหารแทน..."
90101110-17 = "[s] \"อึก...\""
90101110-18 = ""
90101110-20 = ""
90101110-21 = "ถ้าไม่ใช่เรื่องนั้น ก็มาถามความคืบหน้าเกี่ยวกับเศษแก้วที่เคยขอให้ช่วยวิเคราะห์ครั้งก่อนหรือเปล่าคะ?"
90101110-22 = "[s3] \"เจอหน้ากันปุ๊บก็พูดเรื่องงานปั๊บเลย ใจร้ายจัง~\"\n[s4] \"ครูมาหาเพราะเป็นห่วงรินที่งานยุ่งต่างหาก\""
90101110-25 = "ไม่จำเป็นต้องเป็นห่วงขนาดนั้นหรอกค่ะ 'ฉันในช่วงนี้' ไม่เป็นอะไรจริงๆ ค่ะ"
90101110-26 = "เพราะหลังจากที่ประธานตัวปลอม..."
90101110-27 = "ไม่ค่ะ หลังจากที่ประธานองค์การนักเรียนกลับมา งานส่วนใหญ่ขององค์การนักเรียนก็กลับมาเป็นปกติ#nแล้วค่ะ"
90101110-28 = "ถึงหน้าตาและวิธีพูดจะไม่เหมือนเลยสักนิด แต่ความสามารถในการทำงานของเธอนั้นยอดเยี่ยม#nจนเทียบกับตัวจริงได้อย่างไม่ต้องสงสัยเลยค่ะ"
90101110-29 = "ไม่สิ ในบางด้านอาจจะเก่งกว่าด้วยซ้ำ..."
90101110-30 = "แต่ก็ต้องขอบคุณเรื่องนั้น ตอนนี้ฉันเลยมีเวลาว่างพอจะมีเวลาส่วนตัวสักหนึ่งวันต่อสัปดาห์แล้วค่ะ"
90101110-31 = "[s5] \"สัปดาห์ละวันเองเหรอ...\"\n[s6] \"ตกลงไม่เป็นไรจริงๆ ใช่มั้ย?\""
90101110-34 = "ค่ะ อันที่จริงถ้าพักมากกว่านี้ ฉันคงกังวลว่ากิจวัตรประจำวันจะเสียมากกว่าค่ะ"
90101110-35 = ""
90101110-37 = ""
90101110-38 = "ก่อนอื่นเลย ฉันลองตรวจสอบเศษแก้วที่คุณครูให้ยืมมาด้วยหลายๆ วิธีแล้วค่ะ"
90101110-39 = "ฉันทั้งเฝ้าดูทั้งวันว่าโลกที่อยู่หลังเศษแก้วชิ้นนี้เปลี่ยนแปลงไปบ้างหรือเปล่า แล้วก็ลองส่องแสง#nเพื่อสังเกตการเปลี่ยนแปลงด้วยค่ะ"
90101110-40 = "แต่ยิ่งตรวจสอบก็ยิ่งรู้สึกว่า... วัตถุที่ส่องประกายชิ้นนี้ดูจะเป็น \"เศษกระจกเงา\" มากกว่า \"เศษแก้ว\" ค่ะ"
90101110-41 = "[s] \"สองอย่างนี้ต่างกันยังไงเหรอ?\""
90101110-42 = "แก้วคือวัสดุที่ใช้ทำหน้าต่างสำหรับมองออกไปด้านนอก"
90101110-43 = "เพราะอย่างนั้น ภาพที่ปรากฏผ่านแก้วจึงเป็นภาพของสิ่งที่อยู่อีกด้านของแก้ว ไม่ว่าจะมองจากทิศทางใดก็ตามค่ะ"
90101110-44 = "แต่กระจกเงามีด้านหนึ่งถูกเคลือบไว้ จึงไม่ให้แสงผ่าน แต่สะท้อนแสงกลับ และสะท้อนภาพของฝั่งผู้สังเกตแทน"
90101110-46 = "ภาพที่ปรากฏบนเศษชิ้นนี้ ไม่ได้ส่องสว่างเมื่ออยู่ในที่มืด และก็ไม่ได้จางลงเมื่ออยู่ในที่สว่างด้วยค่ะ"
90101110-47 = "ราวกับว่ามันเปลี่ยนแปลงไปตามสภาพของโลกฝั่งนี้"
90101110-48 = "ถ้าภาพที่ปรากฏบนชิ้นส่วนนี้ไม่ได้สะท้อนโลกอื่น แต่สะท้อนความเป็นจริงของคิโวทอสแห่งนี้ละก็..."
90101110-49 = "ถ้างั้น ฉันว่าเรียกมันว่า 'เศษกระจกเงา' แทน 'เศษแก้ว' น่าจะถูกต้องกว่านะคะ"
90101110-50 = "[s] \"งั้นทุ่งหญ้าหรือห้วงลึกที่เห็นก็เป็นส่วนหนึ่งของโลกคิโวทอสเหรอ?\""
90101110-51 = "อย่างน้อยจากการประเมินของฉันก็เป็นเช่นนั้นค่ะ"
90101110-52 = "แต่ทิวทัศน์นี้ไม่เหมือนสถานที่ใดในคิโวทอสที่ฉันรู้จักเลยค่ะ"
90101110-54 = "เหมือนกับทะเลสาบที่อยู่ในภาพถ่ายที่ประธานทิ้งไว้..."
90101110-55 = ""
90101110-56 = "[ns] \"คิโวทอสในกระจกงั้นเหรอ...\""
90101110-57 = "ถ้าลองคิดดูดีๆ ฉันว่าในวรรณกรรมคลาสสิกของทรีนิตี้ก็มีเรื่องคล้ายๆ กันนี้อยู่นะคะ"
90101110-58 = "เรื่องของเด็กผู้หญิงคนหนึ่งที่เดินเข้าไปในกระจกในความฝัน และได้พบกับโลกที่คล้ายโลกเดิมที่เธอรู้จัก แต่ก็แตกต่างโดยสิ้นเชิง"
90101110-59 = "โลกใบนั้นถูกบรรยายว่าเป็นเหมือนความฝันชั่วขณะ ที่จะสลายหายไปเมื่อราชินีบนกระดานหมากรุก#nตื่นขึ้น..."
90101110-60 = "บางครั้งฉันเองก็อดคิดไม่ได้ว่า ความจริงอันเหลือเชื่อนี้ ถ้าเป็นเพียงความฝันของใครสักคนก็คงจะดีค่ะ"
90101110-61 = "[s] \"ครูอยากให้เวลาที่อยู่กับรินตอนนี้เป็นความจริงนะ\""
90101110-62 = "คุณครูก็พูดหวานๆ แบบนี้กับนักเรียนคนอื่นด้วยหรือเปล่าคะ...?"
90101110-63 = "เดี๋ยวจะเกิดความเข้าใจผิดโดยไม่จำเป็นเพิ่มอีก ฉันว่าก่อนที่จะพูดอะไร คุณครูช่วยคำนึงถึงสถานะ#nความเป็นครูให้มากกว่านี้หน่อยก็น่าจะดีนะคะ"
90101110-64 = "[s] \"ใจร้ายจัง...\""
90101110-65 = "เอาเถอะค่ะ"
90101110-66 = "ตัวฉันเองก็ไม่ได้รู้จักทุกสถานที่ในคิโวทอส เพราะงั้นก็ไม่อาจยืนยันได้ว่าทิวทัศน์ที่สะท้อนอยู่ใน#nเศษชิ้นนี้ไม่มีอยู่ในคิโวทอสค่ะ"
90101110-67 = "ฉันก็เลยตั้งใจว่าในวันหยุดครั้งหน้าจะออกนอก D.U. แล้วลองเดินทางไปให้ไกลกว่านี้ค่ะ"
90101110-68 = "[s] \"งั้นขอครูไปด้วยได้มั้ย?\""
90101110-69 = "ถ้าคุณครูต้องการ จะไปด้วยกันก็ไม่เป็นไรค่ะ"
90101110-70 = "[s7] \"ยะฮู้ว! เดตครั้งที่สองกับรินจัง!\"\n[s8] \"เดี๋ยวครูเตรียมข้าวกล่องไปเองนะ!\""
90101110-73 = "เปลี่ยนใจดีกว่า... ฉันจะไปคนเดียวค่ะ"
90101110-74 = "[s] \"ใจร้ายเกินไปแล้วนะ รินจัง~\""
90101110-75 = "ใครคือรินจังกันคะ!"
90101110-80 = "กองบัญชาการของกองทหาร FOX"
90101110-81 = "[ns9] \"ทุกคนยังไม่ได้กินข้าวใช่มั้ย?\"\n[ns10] \"ครูว่าจะสั่งอาหารเย็นพอดี มากินด้วยกันมั้ย...?\""
90101110-84 = ""
90101110-86 = "[ns] \"ปูเหรอ...?\""
90101110-87 = "อ๊ะ ถูกจับได้แล้ว"
90101110-88 = "ถูกจับได้อะไรล่ะ? เราไม่ได้แอบกินสักหน่อย?!"
90101110-89 = "แหะๆ พวกเรากำลังลองทำอาหาร เพื่อดูว่าเนื้อปูจะมากแค่ไหนน่ะค่ะ..."
90101110-90 = "ชะ... ช่วยรอสักครู่นะคะ คุณครู"
90101110-91 = "พวกเราอธิบายทั้งหมดได้ค่ะ"
90101110-92 = "[s11] \"ไม่หรอก ไม่เห็นต้องแก้ตัวอะไรเลยนี่?\"\n[s12] \"ตราบใดที่ไม่ได้เอาปูมาด้วยวิธีน่าสงสัยน่ะนะ...\""
90101110-95 = "เอ่อ... คือว่า..."
90101110-96 = "[s] \"ได้มาด้วยวิธีน่าสงสัยจริงๆ งั้นเหรอ...?\""
90101110-97 = "ไม่ใช่นะ!"
90101110-99 = "[ns] \"เป็นปูของการ์ปัชโช่ แฟมิลี่ที่ได้มาตอนนั้นสินะ\""
90101110-100 = "อื้อ ถึงจะจับปูที่หนีไปได้เกือบทั้งหมด แต่ไม่รู้ทำไมสมาชิกของการ์ปัชโช่ แฟมิลี่ถึงปฏิเสธที่จะรับไป"
90101110-101 = "บอกว่ามันทำให้นึกถึงความทรงจำแย่ๆ บ้างละ ต่อไปนี้ขอไม่ยุ่งกับปูอีกแล้วบ้างละ..."
90101110-102 = "โดยเฉพาะพวกที่เห็นปูยักษ์ในวันนั้นกับตา แค่ได้ยินเสียงก้ามปูดังแกร็กๆ ก็ถึงกับผวากันเลย"
90101110-103 = "คนที่คิดจะใช้ความหวาดกลัวควบคุมคนอื่น กลับถูกความหวาดกลัวนั้นกลืนกินเสียเอง... เป็นบทสรุปที่ย้อนแย้งจริงๆ นะ"
90101110-104 = "ก็ทำตัวเองทั้งนั้นเลยนี่นะ"
90101110-105 = "แต่พอมีข่าวลือว่าปูพวกนี้เป็น 'ปูที่การ์ปัชโช่ แฟมิลี่เอาไปใช้ทำเรื่องน่าสงสัย' ก็เลยไม่มีใครยอมรับไป ทางท่าเรือก็กำลังจะเอาไปกำจัดด้วย พวกเราก็เลยรับมาไว้เองค่ะ"
90101110-106 = "ถึงพวกเราก็มีแต่ความทรงจำแย่ๆ จนแทบจะเอือมกลิ่นคาวปูแล้วก็เถอะ"
90101110-107 = "แต่อาหารไม่ได้มีความผิดอะไรนี่นา"
90101110-108 = "อีกอย่าง การได้กินปูกองเป็นภูเขาแบบนี้ ปกติต่อให้เป็นความฝันก็ยังยากเลย ใช่มั้ยล่ะ?"
90101110-109 = "งั้นก็ถือโอกาสนี้กินปูให้เบื่อไปข้างเลยก็แล้วกัน... ฮุฮุ"
90101110-110 = "อะแฮ่ม"
90101110-111 = "เอาเป็นว่า ถึงจะมาบอกเอาป่านนี้ก็เถอะ..."
90101110-112 = "แต่ถ้าคุณครูไม่รังเกียจ มาทานปูด้วยกันมั้ยคะ?"
90101110-113 = ""
90101110-115 = ""
90101110-116 = ""
90101110-117 = "[ns] \"ให้ครูเข้าร่วมปาร์ตี้ด้วยได้เหรอ...?\""
90101110-118 = "แน่นอนอยู่แล้วค่ะ พวกเรามีปูเหลือเฟือเลยค่ะ"
90101110-122 = "เท่านี้ก็น่าจะสุกดีแล้วนะ"
90101110-123 = "งั้นขอชิมหน่อย..."
90101110-124 = ""
90101110-127 = "อะไรกัน ต่างกันจริงๆ ด้วยแฮะ...?"
90101110-128 = "ทั้งเด้งกว่า แล้วก็มีรสอูมามิลึกซึ้งกว่ามาก... ต่างจากไส้กรอกปลารสปูของ <โยโคซุนะ> กันคนละเรื่องเลย!"
90101110-129 = "ก็แน่อยู่แล้ว! ไส้กรอกที่ทำจากแป้งกับเนื้อปลาราคาถูก จะไปเทียบกับเนื้อปูของจริงได้ยังไงล่ะ?"
90101110-130 = "ฮุฮุ ในเมื่อตอนนี้ได้ลิ้มรสของจริงแล้ว ต่อไปคงกลับไปกินรสเดิมไม่ได้แล้วละ"
90101110-131 = ""
90101110-135 = "งั้นเหรอ...?#nแต่ส่วนตัวฉันว่าไส้กรอกปลาอร่อยกว่านะ"
90101110-136 = "ว่าไงนะ?! ลิ้นเธอเป็นอะไรไปแล้วเนี่ย?"
90101110-137 = "แต่ถ้าเทียบกับรสหวานมันที่เป็นเอกลักษณ์ของไส้กรอกปลาแล้ว เนื้อปูของจริงมันก็จืดเกินไปนะ"
90101110-138 = "แถมต่อให้ตั้งใจแกะแค่ไหน เนื้อก็หนาแค่ข้อนิ้วก้อยเท่านั้น จะไปพอยาไส้ใครกัน?"
90101110-139 = "ถ้าจะพูดแบบนั้นก็เอามานี่เลย ฉันจะกินส่วนของเธอให้หมดเอง!"
90101110-140 = ""
90101110-144 = "แต่ฉันก็เห็นด้วยกับที่โอโทกิพูดอยู่นะ ปูที่ได้มาคราวนี้ดูเหมือนจะมีเนื้อไม่ค่อยเยอะเลย"
90101110-145 = "ยังอีกนานกว่าจะถึงฤดูที่ปูมีเนื้อแน่น แถมปูพวกนี้ยังถูกทิ้งไว้อย่างไม่ใส่ใจในถังเหล็ก สภาพจะแย่ก็ไม่แปลกหรอก"
90101110-146 = ""
90101110-147 = ""
90101110-148 = "เนื้อปูน่ะ ยิ่งปูตัวใหญ่ เนื้อก็ยิ่งหนาใช่มั้ย...?"
90101110-149 = "ถ้างั้น ขาหน้าของปูปีศาจที่เราสู้ด้วยตอนนั้น ก็น่าจะได้เนื้อปูชิ้นใหญ่เท่าขาลูกวัวเลยไม่ใช่เหรอ?"
90101110-150 = "สู้กับปูตัวนั้นมาด้วยตัวเองแท้ๆ ยังคิดอยากลองกินมันอีกเหรอ?"
90101110-151 = "เนื้อของปูที่มีเศษเหล็กขึ้นสนิมสีเขียวฝังอยู่ แถมยังพ่นฟองน่าขยะแขยงออกมา ต่อให้เอามาให้ฟรีๆ ฉันก็ขอไม่รับไว้เด็ดขาด"
90101110-152 = "ว่าแต่เธอไม่เคยคิดเรื่องแบบนั้นบ้างเลยเหรอ?#nถ้าได้กัดเนื้อก้ามปูยักษ์ที่ชิ้นใหญ่จนถือไว้ในมือไม่หมด มันจะมีรสชาติยังไงกันน่ะ..."
90101110-153 = "..."
