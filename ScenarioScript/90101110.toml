90101110-208 = ""
90101110-209 = ""
90101110-212 = ""
90101110-213 = ""
90101110-215 = "E-Eeek..."
90101110-217 = "Phew, that's more like it."
90101110-218 = "Also, I don't think I've seen those books before."
90101110-219 = "A merchant's transaction records from Hyakkiyako's warring states period..."
90101110-220 = "An original copy of \"Koi About Love\" author's \"Sledgehammer\" that was recalled due to defective printing..."
90101110-221 = "And this is...Saint Justina Council's stenographic record from the first Trinity Council?"
90101110-222 = ""
90101110-224 = ""
90101110-225 = "Why is this over here?!"
90101110-226 = "Don't tell me, President... Did you make another copy during restoration again?"
90101110-227 = "Wh-What do you mean \"again\"? I don't do it that often—"
90101110-228 = "Ahem. Chieru brought me this book."
90101110-229 = "Chieru... Hasn't she been gone for quite some time now?"
90101110-230 = "If I recall correctly, she went into the catacombs to search for ancient manuscripts. She went missing three months ago..."
90101110-231 = "That's her. She's back now. With a trove of new books she \"excavated.\""
90101110-232 = "She's back in her dorm room now, reading all the books she missed. She'll be there for a while."
90101110-233 = "Well, I'm glad to hear that she's okay."
90101110-234 = "Especially after last time. She caused quite a few problems with Gehenna when she was found near Hinnom Volcano."
90101110-235 = "A nightmare... A true nightmare. Do you remember? They kept saying they would only let her go if the Library Committee president visited them in person."
90101110-236 = ""
90101110-238 = ""
90101110-239 = "By the way, Shimiko. Chieru had a question before she left."
90101110-240 = "She was asking if you remember any news articles about \"Perorodzilla.\""
