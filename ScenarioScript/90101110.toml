90101110-176 = "ไม่ใช่ว่าคิดไม่ถึงหรอก แต่เพราะเนื้อปูมันแพง พวกเราก็เลยไม่กล้าคิดจะเอาไปผสมกับอาหารอย่างอื่น#nมากกว่า"
