[translation]
90101110-1 = "第11話;尾聲"
90101110-2 = "（在事件告一段落，稍有餘裕的時候造訪了聯邦學生會）"
90101110-5 = "[ns] 「琳醬！」"
90101110-6 = "聯邦學生會接待室"
90101110-7 = ""
90101110-8 = "啊，[USERNAME]老師。"
90101110-9 = "好久不見了。這段期間都還安好嗎？"
90101110-10 = "……還有，誰是琳醬啊？"
90101110-11 = "[s1] 「這週的工作比較空閒，所以就來幫琳加油了。」\n[s2] 「太久沒見到琳醬了，我好想你……」"
90101110-13 = "唉……"
90101110-14 = "雖然您嘴上這麼說，其實是為了其他事情而來的吧？"
90101110-15 = "比如想請我延長已經拖延一個月的「夏萊預算支出報告」的繳交期限。"
90101110-16 = "或者想請我代筆需要提交給行政委員會的外勤事由報告──"
90101110-17 = "[s] 「唔……」"
90101110-18 = ""
90101110-20 = ""
90101110-21 = "再不然……就是詢問先前拜託我進行的玻璃碎片分析的進度吧。"
90101110-22 = "[s3] 「一見面就談工作太過分了啦～」\n[s4] 「我是真的因為擔心忙碌的琳才特地跑來的說。」"
90101110-25 = "您不需要那麼擔心。「最近的我」真的沒問題。"
90101110-26 = "自從那個冒牌貨……"
90101110-27 = "不，自從聯邦學生會長回歸之後，聯邦學生會大部分的業務都已經恢復正常了。"
90101110-28 = "雖然外表和說話方式完全不同，處理業務的能力確實優秀得能與本人相提並論。"
90101110-29 = "不，在某些領域上甚至還可能更為出色……"
90101110-30 = "總之，我也因此變得比較從容，一週大約能夠擁有一天的私人時間。"
90101110-31 = "[s5] 「一週一天……」\n[s6] 「真的沒問題嗎？」"
90101110-34 = "是的。如果再增加休息時間的話，我反而擔心生活作息會被打亂呢。"
90101110-35 = ""
90101110-37 = ""
90101110-38 = "首先，老師提供給我的這塊玻璃碎片，我已經透過各種方法進行了確認與分析。"
90101110-39 = "我試過全天觀測碎片另一頭的世界是否會有所變化，也試過照射光線來觀察其反應。"
90101110-40 = "然而越是深入調查……我越覺得這個閃亮物體比起「玻璃碎片」更像「鏡子碎片」。"
90101110-41 = "[s] 「這兩者之間有什麼差別嗎？」"
90101110-42 = "玻璃是用於觀看外界的材料。"
90101110-43 = "因此玻璃上呈現的景象無論從哪個方向觀察，映照的都是玻璃的另一側。"
90101110-44 = "但是鏡子的其中一面受到遮蔽，所以會反射出觀察者這一側的景象。"
90101110-46 = "這塊碎片上映照的景象既不會在暗處發光，也不會因為在亮處就黯淡失色。"
90101110-47 = "彷彿實時投影著這一側的狀況並隨之變化一樣。"
90101110-48 = "如果碎片上映照的景象並非某個異世界，而是這個奇普托斯的現實──"
90101110-49 = "那麼比起玻璃碎片，稱之為鏡子碎片不是更加合理嗎？"
90101110-50 = "[s] 「所以這片草原和深淵，都是奇普托斯的世界嗎？」"
90101110-51 = "現階段依我的判斷而言，確實是如此。"
90101110-52 = "但是這片景象，與我所知的奇普托斯的任何地方都不相似。"
90101110-54 = "……就像會長留下的照片裡出現的那座湖泊一樣。"
90101110-55 = ""
90101110-56 = "[ns] 「……鏡中的奇普托斯啊。」"
90101110-57 = "這麼說來，三一的古典文獻中似乎有個類似的故事呢。"
90101110-58 = "某位少女在夢中走進鏡子，接觸了與他所知的世界十分相似，卻又截然不同的世界。"
90101110-59 = "那個世界，最終被描寫為棋盤上的女王醒來便會消失的須臾之夢……"
90101110-60 = "我偶爾也會這麼想……要是這個令人難以置信的現實，只是某個人的夢境就好了。"
90101110-61 = "[s] 「我倒是希望和琳共度的這段時光是現實呢。」"
90101110-62 = "……您對其他學生也會說這種甜言蜜語嗎？"
90101110-63 = "這樣只會增加不必要的誤會，希望老師能更慎重地考慮自己的立場再發言。"
90101110-64 = "[s] 「好過分……」"
90101110-65 = "總而言之。"
90101110-66 = "我也並非對奇普托斯的所有地方都瞭若指掌，#n所以無法斷言這塊碎片上映照的風景不存在於奇普托斯。"
90101110-67 = "因此我打算在下個假日離開D.U.，稍微到更遠的地區看看。"
90101110-68 = "[s] 「我也可以一起去嗎？」"
90101110-69 = "如果老師想要同行的話，我倒是不介意。"
90101110-70 = "[s7] 「太好了！和琳醬的第二次約會！」\n[s8] 「便當就由我來準備吧！」"
90101110-73 = "……果然還是當我沒說吧。我一個人去就好。"
90101110-74 = "[s] 「太過分了～琳醬～」"
90101110-75 = "所以說，誰是琳醬啊！"
90101110-80 = "FOX小隊HQ"
90101110-81 = "[ns9] 「大家都還沒吃晚餐吧？」\n[ns10] 「我打算來叫外送，不介意的話要不要一起──」"
90101110-84 = ""
90101110-86 = "[ns] 「……螃蟹？」"
90101110-87 = "啊，被發現了。"
90101110-88 = "什麼叫被發現啊？我們又不是在偷吃！？"
90101110-89 = "哈哈……只是為了確認螃蟹的出肉率，所以才試著烹調看看……"
90101110-90 = "請，請稍等一下，老師。"
90101110-91 = "我可以全部解釋清楚的。"
90101110-92 = "[s11] 「呃……也沒有必要特地解釋吧？」\n[s12] 「只要食材不是透過奇怪的管道弄來的就好了。」"
90101110-95 = "呃，那個，該怎麼說呢……"
90101110-96 = "[s] 「……不會真的是透過奇怪的管道弄來的吧？」"
90101110-97 = "才不是！"
90101110-99 = "[ns] 「……原來是那個時候回收的卡爾帕喬家族的螃蟹啊。」"
90101110-100 = "是啊，幸好逃走的螃蟹大部分都回收了。#n但是不知道為什麼，卡爾帕喬家族的組織成員們拒絕接收。"
90101110-101 = "說什麼會勾起不好的回憶，不想再碰到螃蟹之類的……"
90101110-102 = "尤其是那天親眼目睹巨大螃蟹的組織成員，#n據說嚴重到光是聽到蟹螯咔嚓咔嚓的聲音就會發作的程度。"
90101110-103 = "想利用恐懼來操控他人的傢伙們，反倒被那份恐懼給吞噬了……真是諷刺的結局呢。"
90101110-104 = "完全是自作自受嘛。"
90101110-105 = "總之，因為流傳著「被卡爾帕喬家族用於可疑勾當」的傳聞，所以沒有人願意接收。#n港口方面原本打算將這些螃蟹廢棄，我們就代為收下了。"
90101110-106 = "雖然我們也對螃蟹的腥味沒什麼好印象……"
90101110-107 = "不過食物本身是無罪的嘛。"
90101110-108 = "而且能像這樣盡情享用堆積如山的螃蟹，可是平常想都不敢想的奢侈享受呢。"
90101110-109 = "我一定要趁這個機會把螃蟹吃到膩為止……呵呵。"
90101110-110 = "咳哼。"
90101110-111 = "就是這樣，雖然稍微晚了一些……"
90101110-112 = "如果老師您不介意的話，要不要也一起來吃螃蟹呢？"
90101110-113 = ""
90101110-115 = ""
90101110-116 = ""
90101110-117 = "[ns] 「我真的可以加入這場派對嗎……？」"
90101110-118 = "當然可以呀，畢竟螃蟹很充足呢。"
90101110-122 = "應該都熟得差不多了。"
90101110-123 = "我來嚐一口看看……"
90101110-124 = ""
90101110-127 = "這是什麼！？吃起來完全不一樣耶……！？"
90101110-128 = "口感更有彈性，還帶著濃郁的鮮味……跟「橫綱」的蟹味魚肉香腸完全不一樣！"
90101110-129 = "那還用說！混了麵粉和廉價魚漿的香腸，根本不能和真正的蟹肉相提並論吧？"
90101110-130 = "呵呵，既然嚐過了真正螃蟹的滋味，恐怕就回不去原本的口味了吧？"
90101110-131 = ""
90101110-135 = "……是嗎？我個人反而覺得魚肉香腸比較好吃耶。"
90101110-136 = "你在胡說什麼啊！？你的味覺到底是怎麼回事？"
90101110-137 = "可是跟魚肉香腸那種香甜油膩的味道比起來，真正的蟹肉實在是太清淡了嘛。"
90101110-138 = "而且就算努力把肉挑出來也只有小指頭大小，這樣到底夠塞誰的牙縫啊？"
90101110-139 = "你要是那麼嫌棄的話就拿來，我連你的份也一起吃掉！"
90101110-140 = ""
90101110-144 = "不過御伽說的我也有點認同呢。#n這次回收的螃蟹，出肉率好像不怎麼理想。"
90101110-145 = "距離螃蟹肥美的季節還早，又被隨意扔在鐵桶裡放置，狀態不好也是理所當然的。"
90101110-146 = ""
90101110-147 = ""
90101110-148 = "……你說的出肉率是螃蟹越大，蟹肉就會越多的意思吧？"
90101110-149 = "那麼我們對付的那隻怪物螃蟹的前腳，是不是就能取出像小牛腿那麼大的蟹肉了呢？"
90101110-150 = "你都跟那隻螃蟹正面交手過了，居然還會想吃牠？"
90101110-151 = "那可是身體插著滿是鏽斑的鐵塊，還會噴出噁心泡沫的螃蟹耶。#n就算免費送我我也不要。"
90101110-152 = "你難道沒有想像過嗎？#n如果一口咬下那塊大到連手都握不住的蟹螯肉，究竟會是什麼滋味……"
90101110-153 = "…………"
90101110-154 = "啊，你猶豫了。"
90101110-155 = "我才沒有！"
90101110-158 = ""
90101110-159 = "以前我只吃過加工後的螃蟹製品，沒想到像這樣做成火鍋來吃也相當不錯呢。"
90101110-160 = "其他食材好像也都熟了……"
90101110-161 = "來，老師。#n殼很燙，請小心享用。"
90101110-162 = ""
90101110-165 = "[ns13] 「感覺像是有另外調味過一樣，帶著甜甜鹹鹹的味道呢。」\n[ns14] 「這股濃郁的鮮味，讓人莫名地很想配飯呢。」"
90101110-168 = "啊，需要幫您準備白飯嗎？"
90101110-169 = "其實為了明天製作豆皮壽司，我正好有事先準備。"
90101110-170 = "仁子，我突然有個想法。"
90101110-171 = "如果把蟹膏拌進豆皮壽司用的飯裡調味……"
90101110-172 = "不覺得會超級好吃的嗎？"
90101110-173 = "那樣……"
90101110-174 = "肯定會很好吃吧！"
90101110-175 = "明明以前吃了那麼多豆皮壽司，為什麼從來沒有這麼想過呢……？"
90101110-176 = "與其說是沒想過，不如說是因為蟹肉太貴才不敢混進其他食物裡面吧。"
90101110-177 = "不過，既然今天的螃蟹多到只吃蟹肉都能填飽肚子……"
90101110-178 = "我現在馬上把煮好的飯全部拿過來。"
90101110-179 = "那個，可以順便把倉庫裡的軍用乾糧也拿過來嗎？"
90101110-180 = "蟹肉塗上美乃滋再配上蘇打餅乾，感覺會很好吃……"
90101110-181 = "天啊，FOX3。你真是個天才！"
90101110-182 = "馬上就來試試吧！"
90101110-183 = "大家不要在火源前面跑來跑去，這樣很危險的。"
90101110-184 = "呵呵，看來得再多洗點米了呢。"
90101110-186 = "（之後和FOX小隊一起享用著螃蟹，度過了一段愉快的時光）"
90101110-187 = ""
90101110-192 = ""
90101110-193 = "三一古書館入口"
90101110-195 = ""
90101110-196 = "……咳咳。"
90101110-197 = "委員長，你該不會又關著窗戶在做古書修復工作吧？"
90101110-198 = "灰塵多到肉眼都看得見了……虧你在這種環境下還能專心看書呢。"
90101110-199 = ""
90101110-201 = ""
90101110-202 = "可，可是最近天氣很熱，只要稍微開一點窗，室內就會跟著變熱嘛。"
90101110-203 = "而且直射的陽光也是古書的天──"
90101110-204 = "不行，我馬上來通風。"
90101110-205 = ""
90101110-207 = ""
90101110-208 = ""
90101110-209 = ""
90101110-212 = ""
90101110-213 = ""
90101110-215 = "噫，噫呀啊啊啊……"
90101110-217 = "呼……總算稍微舒服一點了。"
90101110-218 = "話說回來，不知不覺間又堆了一大堆沒見過的新書呢。"
90101110-219 = "百鬼夜行戰國時代的某位商人所寫的交易日誌……"
90101110-220 = "因為印刷問題而全數回收的「戀愛鯉魚」老師的《大鐵鎚》初版……"
90101110-221 = "還有這是……第一次三一公會議時，由優斯提娜聖徒會撰寫的會議記錄？"
90101110-222 = ""
90101110-224 = ""
90101110-225 = "為什麼這個會在這裡啊！？"
90101110-226 = "難道說，委員長……你又在修復時偷偷做了副本嗎？"
90101110-227 = "又，又是什麼意思！？我又不是每次都會做副──"
90101110-228 = "咳哼。這本書是知繪琉醬親自拿來給我的。"
90101110-229 = "知繪琉醬……是指失蹤了好一陣子的副委員長嗎？"
90101110-230 = "我記得三個月前他說要去發掘新的古書，結果進入地下墓穴之後就失蹤了……"
90101110-231 = "沒錯，他今天早上帶著大量新「發掘」的孩子們回來了。"
90101110-232 = "不過他說要把這段時間沒讀的書補完，所以就跑回宿舍去了。#n我想短時間內應該不會走出房間才對。"
90101110-233 = "這樣啊。不過他能平安回來真是太好了呢。"
90101110-234 = "我聽說上次他在辛嫩火山一帶被發現，還跟格黑娜鬧出了外交問題……"
90101110-235 = "那時候……簡直是場惡夢。#n對方提出了一堆可怕的要求，還說什麼要圖書委員長親自來才肯放人……"
90101110-236 = ""
90101110-238 = ""
90101110-239 = "話說回來，志美子。#n知繪琉醬離開之前問了一件事。"
90101110-240 = "那就是我們還記不記得跟「佩洛洛吉拉」相關的報導內容。"
90101110-241 = ""
90101110-243 = ""
90101110-244 = ""
90101110-245 = ""
90101110-246 = "……「佩洛洛吉拉」嗎？"
90101110-248 = "怪談追蹤篇;To be Continued in Chapter 3"
