[translation]
1003403-1 = "신부수행 Ⅰ : 가정요리 편"
1003403-2 = "백귀야행 제7학생식당"
1003403-3 = "마침 학생식당이 비어서, 오늘 특별히 빌릴 수가 있었어요."
1003403-4 = "오늘 요조숙녀로서 해볼 수행은 다름 아닌 요리 수행……."
1003403-5 = "그것도 가정 요리를 해볼까 해요."
1003403-6 = "[s] \"무슨 요리를 만들 생각인데?\""
1003403-7 = "오늘 만들어볼 요리는 가정 요리의 대표주자……"
1003403-8 = "고기 감자조림이에요."
1003403-9 = "[s1] \"헉, 고기 감자조림!\"\n[s2] \"그야말로 가정 요리 오브 가정 요리!\""
1003403-10 = "후후, 요조숙녀에게 있어 요리란……."
1003403-11 = "후후, 요조숙녀에게 있어 요리란……."
1003403-12 = "단아하고 지나치지 않으며…… 모자람이 없는 것."
1003403-13 = "고기 감자조림은 만들기도 그리 어렵지 않고, 들어가는 재료도 심플하다 보니."
1003403-14 = "요조숙녀로서 쌓아온 제 실력을 보여주기에 딱 알맞은 요리라고 생각한답니다."
1003403-15 = "선생님, 고기 감자조림, 좋아하시나요……?"
1003403-16 = "[s3] \"좋아합니다.\"\n[s4] \"엄청 좋아하는 건 아니지만, 미모리가 만드는 것이라면!\""
1003403-17 = "후후후, 좋아하신다면 안심이에요."
1003403-18 = "그, 그러신가요?"
1003403-19 = "[s] \"게다가 저번에 미모리가 만들어줬던 샌드위치, 무척 맛있었으니까.\""
1003403-20 = "그, 그렇군요?"
1003403-21 = "가, 가, 감사합니다……."
1003403-22 = "[s] \"이번에도 기대할게.\""
1003403-23 = "흐, 흠흠, 그렇게까지 말씀해주신다면……."
1003403-24 = "……네!"
1003403-25 = "결심했어요. 저, 이번 요리는 조금 더 기합을 넣어서 만들어 봐야겠네요!"
1003403-26 = "열심히! 전력을 다해서……!"
1003403-27 = "[s5] \"응? 하지만 그렇게 되면…….\"\n[s6] \"미모리가 앞에서 말한 이야기와는 조금 멀어지는 게……?\""
1003403-28 = "저에게 맡겨만 주세요!"
1003403-29 = "저에게 맡겨만 주세요!"
1003403-30 = "[s] \"으, 응? 히, 힘내?\""
1003403-33 = "[ns] \"저기, 미모리?\""
1003403-34 = "잠시만요……. 선생님, 조금 더 신중하게, 저울눈에 맞춰서 정량을 재야만……."
1003403-35 = "단 1g도 벗어나지 않게, 레시피에 쓰인 그대로의 양으로……."
1003403-36 = "[s] \"그렇게까지 하지 않아도…….\""
1003403-37 = "아니에요. 선생님."
1003403-38 = "모처럼 선생님께서 기대해주시는데, 요조숙녀를 지망하는 몸으로서, 선생님의 기대를 저버리고 싶지 않답니다."
1003403-39 = "오늘이야말로 제가 쌓아온 실력을 보여 드려야 할 때라고."
1003403-40 = "그렇게 생각해요!"
1003403-42 = "[s] \"무, 물론 미모리의 마음 씀씀이는 굉장히 고맙지만.\""
1003403-46 = "(투욱)"
1003403-47 = "됐어요! 선생님! 여기 간장, 맛술, 설탕, 그리고 물의 양까지 전부 레시피대로 갖춰놨답니다."
1003403-48 = "그럼, 이대로 새롭게 다시 시작할게요!"
1003403-49 = "여기 미리 준비해둔 조미료들을 모두 넣어서……."
1003403-50 = "고기와 양파, 당근까지 전부 냄비에 넣고 천천히 끓이면 되어요!"
1003403-52 = "(보글보글보글)"
1003403-53 = "이렇게 국물이 끓어오를 때쯤 되면, 양파가 서서히 투명해지니까."
1003403-54 = "이때 불을 줄이고……. 뚜껑을 덮고 20분 정도 졸인 다음……."
1003403-55 = "양파가 완전히 투명해졌을 때에, 또 준비해둔 감자를 넣고 20분 정도를 더 끓이면……."
1003403-58 = "(보글보글보글)"
1003403-59 = "완성이에요. 선생님. 전력을 다한, 제 고기 감자조림이……!"
1003403-60 = "……맛보아주시겠어요?"
1003403-61 = "[s] \"응, 그럼 잠시 실례합니다…….\""
1003403-62 = "……(꼴깍)"
1003403-63 = "[s] \"하압, 우물우물……\""
1003403-67 = "[ns] \"으음?!\""
1003403-68 = "어, 어떠신가요?"
1003403-69 = "[s] \"……짜. 그것도 엄청.\""
1003403-70 = "네…? 그, 그럴 리가. 정량을 제대로 맞췄는데. 잠시만요……!"
1003403-71 = "합, 우물우물."
1003403-73 = "저, 정말 맛이 이렇게나 짜다니. 대체……."
1003403-74 = "[s] \"미모리, 이 조미료, 설탕이 아니라 소금인데?\""
1003403-75 = "아앗……!"
1003403-76 = "어, 어째서 이런 실수를. 죄, 죄송해요. 선생님!"
1003403-77 = "제가 미처 확인해보지 못하고. 아아, 이걸 어쩌지요……!"
1003403-78 = "모처럼, 선생님께 가정 요리를 대접해 드리려고 했는데!"
1003403-79 = "이렇게 실망만 안겨 드리고……!"
1003403-80 = "이래서야 요조숙녀로서는 실격……!"
1003403-81 = "[s] \"괜찮아. 진정해, 미모리.\""
1003403-82 = "하지만 선생님……."
1003403-83 = "[s7] \"요리 한 번 실패했다고 전부 끝나는 건 아니니까.\"\n[s8] \"여기선 어떻게 만회할지, 같이 생각해보자.\""
1003403-84 = "이런 실수에도 선생님은 그렇게 격려의 말씀을……"
1003403-85 = "이런 실수에도 선생님은 그렇게 격려의 말씀을……"
1003403-86 = "네. 요조숙녀를 꿈꾸는 몸으로써, 먼저 당황해서야 언어도단."
1003403-87 = "선생님의 말씀대로 꼴사나운 모습을 보이기보다는"
1003403-88 = "만회할 방법을 찾는 것이 더……. 옳은 말씀이세요."
1003403-89 = "……어디, 달리 방법이……."
1003403-90 = "아, 마침 식당 선반에 그게 남아있었지요."
1003403-91 = "잠시만 기다려주세요. 선생님!"
1003403-96 = "[ns] \"이건…… 카레네.\""
1003403-97 = "그…… 찬장에 카레 루가 남아있었거든요."
1003403-98 = "고기 감자조림하고 카레는, 재료도 비슷하니까."
1003403-99 = "한 솥에 크게 끓이면, 짠맛도 어느 정도 잡을 수 있을 거라고 생각해서……"
1003403-100 = "무, 물론 굳이 억지로 드시지 않으셔도……."
1003403-104 = "[ns] \"응, 이 카레. 무척 맛있어. 미모리.\""
1003403-105 = "다, 다행이다아……."
1003403-107 = "후, 후후. 후후후……."
1003403-108 = "[s] \"응? 미모리, 갑자기 왜 웃어?\""
1003403-109 = "아니요. 카레도, 생각해보면 가정요리의 대표였잖아요?"
1003403-110 = "결국 돌고 돌아, 이렇게 또 다른 가정 요리를 대접해 드릴 수 있어서."
1003403-111 = "그게 무척이나 다행이라고, 생각했답니다."
1003403-112 = "이것도 다 선생님이 포기하지 말라고 말해주신 덕분이니까요."
1003403-113 = "조금, 뭔가 기뻐서요."
1003403-114 = "[s] \"그래? 다행이네.\""
1003403-115 = "네에. 정말, 다행이에요……."
1003403-116 = "선생님과 수행할 수 있어서……."
1003403-117 = "자, 아직 잔뜩 남아있으니까."
1003403-118 = "한 그릇, 더 드실래요?"
1003403-120 = "(그렇게 미모리와 함께 즐겁게 식사를 마쳤다.)"
