[translation]
2003705-1 = "폴리스 스토리-로스트 파라다이스 편"
2003705-2 = "(후부키의 파라다이스를 찾아가 보기로 했다…….)"
2003705-7 = "(선베드에 누워서 콧노래를 흥얼거리고 있다.)"
2003705-9 = "[ns1] \"후부키.\"\n[ns2] \"잡았다! 근무태만!\""
2003705-15 = "깜짝이야."
2003705-17 = "깜짝이야!"
2003705-18 = "뭐야, 선생이었잖아. 들킨 줄 알고 놀랐네."
2003705-19 = "[s] \"그래서, 여기가 후부키가 말한 파라다이스야?\""
2003705-20 = "응, 맞아."
2003705-21 = "워터파크 구석진 곳에 있는 어린이 풀."
2003705-22 = "어린애들은 다들 실내 키즈 풀로 가고, 어른들은 여기 올 일이 없거든."
2003705-23 = "그래서 열심히 지켜볼 필요도 없고, 한가롭게 자리만 지키면 돼."
2003705-24 = "이곳의 담당 라이프가드로 지정되면 그 날은 하루 종일 쉬다가 퇴근하는 거지!"
2003705-25 = "게다가 가장 좋은 점은……."
2003705-26 = "(치직……치지직……)"
2003705-27 = "본부랑 멀어서 무전이 잘 안된다는 거."
2003705-28 = "[s] \"그게 좋은 점이야……?\""
2003705-29 = "당연하지!"
2003705-30 = "파크 책임자가 할 일 없는 라이프가드들을 호출해서 작업시키는 경우가 얼마나 많은데."
2003705-31 = "여기 있으면 무전기 사정으로 못 들었다고 하면 되니까, 괜히 동원당할 걱정도 없지!"
2003705-32 = "[s3] \"정말 그래도 괜찮을까?\"\n[s4] \"급한 일이 있으면 어쩌려고?\""
2003705-35 = "괜찮아, 괜찮아. 진짜 급한 일이면 따로 핸드폰으로 연락하겠지."
2003705-36 = "그때까지는 여유롭게 이 파라다이스를 만끽하면 된다구."
2003705-37 = "자, 여기 선생 몫의 선베드도 있어."
2003705-38 = "[s5] \"하지만 햇볕 아래 눕는 건 더워서 싫은걸…….\"\n[s6] \"그늘은 없어?\""
2003705-41 = "그……안타깝게도 파라솔이 고장 나서, 햇빛을 받을 수밖에 없어."
2003705-42 = "물론 한여름의 햇빛 아래서 대기하는 게 쉽지는 않지만……."
2003705-43 = "그래도 한가롭게 쉴 수 있는 게 어디야?"
2003705-44 = "더위를 못 참겠으면, 대신 여기 아이스박스에 음료수가 있다구."
2003705-48 = "자, 여기 시원하게 보관된 음료수가……."
2003705-49 = "뭐야!"
2003705-50 = "누가 상자를 열어 놨어! 콜라가 따뜻하잖아!"
2003705-54 = "그, 그래도! 한가롭게 쉴 수 있는 게 어디야."
2003705-55 = "[s] \"…….\""
2003705-56 = "왜, 왜 그런 표정을 짓는 거야."
2003705-57 = "감시도 없고, 할 일도 없고, 정말 천국이 따로 없다니까?"
2003705-58 = "자, 봐봐!"
2003705-59 = "이렇게 선베드에 누워서 낮잠이라도 자면 그거야말로……."
2003705-64 = "앗뜨거!"
2003705-65 = "며, 몇 마디 하는 사이에 햇빛에 달궈져서……."
2003705-66 = "[s] \"…….\""
2003705-73 = "정말……천국이 따로 없다니까……!"
2003705-74 = "[ns7] (억지로 누워서 따뜻한 콜라를 마시고 있어…….)\n[ns8] (엄청 불편해 보이는데…….)"
2003705-77 = "일을 안 하면……즐거워……행복해……."
2003705-78 = "서, 선생도 그렇게 생각하지……?"
2003705-79 = "[s] \"역시 성실히 일하는 편이 나을지도 모르겠는데.\""
2003705-80 = "아니! 난 지금 완전 편한데? 아주 완벽히 즐거운 상태인데?"
2003705-81 = "불편해 보인다면 선생의 착각이야!"
2003705-82 = "두고 봐! 난 이렇게 몇 시간이나 농땡이 칠 수 있다고!"
2003705-84 = "(그렇게 두 시간쯤 흐르고…….)"
2003705-88 = "으으으……."
2003705-89 = "솔직히 말하자면, 조금, 아주 조금 힘이 드는 것 같기도 하고……."
2003705-90 = "그래도 다른 사람들처럼 작업은 안 했으니까 이득 아니겠어?"
2003705-91 = "그럼, 그럼, 이곳이야말로 파라다이스지."
2003705-92 = "(치직……치지지직…….)"
2003705-93 = "[s] \"연락 온 거 아냐?\""
2003705-94 = "아까부터 그랬는데, 그냥 내버려둬. 어차피 할 일 없는 사람 불러서 일 시키려는 거겠지."
2003705-95 = "우린 그냥 여기서 계속 천국을 즐기면……."
2003705-96 = "(띠링~)"
2003705-97 = "어라?"
2003705-98 = "핸드폰으로 연락이 왔네. 어디 보자……."
2003705-103 = "'본부의 휴게실로 와 주세요'?"
2003705-104 = "[s] \"급한 일이라면 가봐야 하는 거 아냐?\""
2003705-105 = "으음, 무전 대신 핸드폰으로 연락한 걸 보면 확실히 큰일일지도 모르겠네."
2003705-106 = "역시 가보는 게 좋으려나."
2003705-107 = "마, 말해 두지만 절대로 여기서 벗어나고 싶어서 가는 건 아니다?"
2003705-111 = "워터파크 라이프가드 휴게실"
2003705-113 = "잠깐 실례할게~."
2003705-114 = "우왓, 빵빵한 에어컨……이제야 좀 살 것 같아……."
2003705-115 = "앗, 드디어 오셨군요?"
2003705-116 = "아까부터 무전으로 불렀는데, 왜 이렇게 늦게 오셨어요?"
2003705-117 = "내 파라다이스, 아니 근무지가 본부랑 멀어서 말야. 무전 상태가 좋지 않았어."
2003705-118 = "그동안 한눈팔지 않고 열심히 근무했다고."
2003705-119 = "연락은 안 돼도, 열심히 라이프가드의 임무를 수행하고 있었어!"
2003705-120 = "맙소사, 그러셨군요!"
2003705-121 = "미리 알았다면 진작에 핸드폰으로 연락드릴 걸 그랬네요!"
2003705-122 = "설마 휴식 시간에도 근무하고 계셨을 줄이야!"
2003705-123 = "뭘, 해야 할 일을 했을 뿐—"
2003705-127 = "으응?"
2003705-128 = "사실 한 시간 전부터 휴식 시간이었거든요."
2003705-129 = "고생하시는 분들을 위해 도넛 세트도 사서 나눠드렸는데……뒤늦게 한 분이 부족하다는 걸 알게 되어서……."
2003705-130 = "도넛?!"
2003705-131 = "죄송하게도 지금은 남아 있지 않네요."
2003705-132 = "시원한 음료수도……이런, 마침 떨어졌군요."
2003705-133 = "그, 그런……."
2003705-134 = "비록 휴식 시간은 맞추지 못하셨지만, 그만큼 파크를 위해 근무해 주셨잖아요?"
2003705-135 = "라이프가드 여러분! 휴식 시간에도 열심히 근무해 주신 후부키 씨에게 격려와 감사의 박수를!"
2003705-140 = "그야말로 성실한 라이프가드의 모범입니다! 네무가키 후부키 씨!"
2003705-141 = "어……그, 그게…….난 그럴 생각은 아니었……."
2003705-145 = "으으으……."
2003705-146 = "난 대체 무엇을 위해……."
