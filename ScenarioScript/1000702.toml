[translation]
1000702-1 = "모범 시민"
1000702-2 = "파출소"
1000702-3 = "우아아아앙— 선생님—!"
1000702-4 = "나는 아무런 잘못도 하지 않았는데, 경찰이 갑자기 끌고 와서는……"
1000702-5 = "아무런 잘못도 하지 않았다니, 아직도 반성을 안 했군!"
1000702-6 = "으앙, 선생님— 나 좀 도와줘!"
1000702-7 = "이 아이의 보호자이십니까?"
1000702-8 = "[s] \"이 아이의 선생님입니다.\""
1000702-9 = "그렇다면 이 아이가 무슨 잘못을 저지르고 다녔는지 알고 계십니까?"
1000702-10 = "나는 잘못하지 않았어! #n해야 할 일을 했을 뿐인걸!"
1000702-11 = "그읏!"
1000702-13 = "이 아이는 무려, 남의 사유지에 들어가서……"
1000702-15 = "낙서를 했습니다!"
1000702-16 = "낙서가 아니야! 그래피티, 예술이라고!"
1000702-17 = "당하는 사람 입장에서는 똑같은 낙서일 뿐이지!"
1000702-18 = "[s] \"낙서요?\""
1000702-19 = "예, 그래피티인지 뭔지, 지워지지도 않는 유성 페인트를 벽에 잔뜩 뿌려 놓았다고요!"
1000702-20 = "하지만 주인 아저씨는 괜찮다고 했잖아!"
1000702-21 = "그건 용서한다는 뜻이지 괜찮다는 뜻이 아니라고! #n게다가 넌 이번이 처음도 아니잖아!"
1000702-22 = "KV 하이웨이의 고가대교에, 쿠로네코 시장의 뒷골목에……"
1000702-23 = "인적이 드문 곳이라면 어디든 온통 낙서를 해 두니, 지우는 사람이 얼마나 고생인 줄 알아?"
1000702-24 = "그러니까 낙서가 아니라 예술이라니까!"
1000702-26 = "[s] \"……죄송합니다.\""
1000702-27 = "사과는 선생님이 아니라 이 학생이 해야지요."
1000702-28 = "싫어! 나는 우중충한 도시를 밝게 꾸며준 것 뿐인걸!"
1000702-29 = "[s] \"제대로 사과해, 마키.\""
1000702-30 = "하지만…… 으으……."
1000702-31 = "죄송……합니다. 잘못했어요."
1000702-32 = "흥, 오늘은 이 정도로 넘어가 주지요. #n하지만 다음번에는 용서하지 않을 겁니다!"
1000702-34 = "저, 선생님. 어…… 그러니까……. #n혹시 화났어?"
1000702-35 = "[s] \"괜찮아.\""
1000702-36 = "역시 화났지? 우으으……"
1000702-37 = "하지만~ 그 우중충한 회벽이 내게 말하고 있었다고. 예쁜 색의 옷을 입고 싶다고 말이야!"
1000702-38 = "무, 물론 남의 물건에 멋대로 칠을 해서는 안된다는 건 알고 있었지만……"
1000702-39 = "불타오르는 예술혼이 나를 멋대로 조종하는 바람에……"
1000702-40 = "……미안. 역시 선생님께 미움 받고 싶지는 않아."
1000702-41 = "그래피티를 하는 것도 좋지만, 선생님에게 혼나는 건 더 싫은 걸."
1000702-42 = "어쩌지…… 그래피티는 하고 싶고, 선생님에게 혼나는 건 싫고……."
1000702-43 = "[s] \"커다란 캔버스를 구해 그 위에 그림을 그리자.\""
1000702-44 = "……커다란 캔버스?"
1000702-45 = "그래, 캔버스 여러 개를 쌓아 겹쳐 놓는다면 벽 대신 쓸 수 있을 지도 몰라!"
1000702-46 = "물론 진짜 벽에 그래피티를 하는 것만큼 신나지는 않겠지만…… #n선생님과 함께한다면 분명 뭐든지 즐거울 거야."
1000702-47 = "그럼 선생님, 다음 번에 내가 커다란 캔버스를 가져오면 같이 그림 그릴래?"
1000702-48 = "[s] \"그래, 같이 그림을 그리자.\""
1000702-49 = "후후, 약속한 거다? #n고마워, 선생님!"
