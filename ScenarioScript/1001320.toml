[translation]
1001320-1 = "특별한 상자"
1001320-2 = "(모처럼 여유가 생겨 상점가로 산책을 나왔다.)"
1001320-3 = "(상점가 한 쪽 영화관 앞에서 서성거리고 있던 츠루기를 발견했다.)"
1001320-4 = "크, 크흐……. 크흐으……."
1001320-9 = "크헤헤헤……!!"
1001320-13 = "뭐, 뭐야……. 저 사람 왜 저래……?"
1001320-14 = "쉿. 조용히 해. 쓸데없는 소리 하다 눈이라도 마주치면 어쩌려고……."
1001320-21 = "크헤에에에에헤헤-!!"
1001320-23 = "히, 히이익……!"
1001320-27 = "야, 야! 같이 가!!"
1001320-32 = "……크흐흐……? 흐……?"
1001320-33 = "[s1] \"안녕, 츠루기.\"\n[s2] 손을 흔들어 인사한다."
1001320-34 = "……!?"
1001320-35 = "……!?"
1001320-36 = "흐, 흐컥……!? 서, 선생님……? 어, 어째서 선생님께서 이런 곳에……."
1001320-37 = "네, 네? 손에 든 거……. 이거 말씀이십니까……?"
1001320-38 = "아, 이, 이건 그……. 영화 보고 남은 티켓과 팸플릿입니다만……."
1001320-39 = "네, ……네. 방금 보고 나온 것……입니다."
1001320-40 = "[s3] \"영화가 끝나도 버리지 않는 거구나.\"\n[s4] \"모으는 취미 같은 게 있는 거야?\""
1001320-41 = "그, 그렇습니다……. 아무래도 좀……. 버리고 싶지 않아서……."
1001320-42 = "그, 그렇습니다……. 아무래도 좀……. 버리고 싶지 않아서……."
1001320-43 = "역시 좀 이상한 것일까요……? 다 끝난 것도 모으고 이러는 건……."
1001320-44 = "아, 그렇지 않다고요……. 감사합니다. 말씀해주신 덕분에 조금 안심했습니다."
1001320-45 = "네? 더 있냐고요? 그, 그야 많이 있습니다만……. 어째서 여쭤보시는 것인지……."
1001320-49 = "호, 혹시……. 다른 것도 확인하고 싶으신 것입니까!? 그런 것이십니까?"
1001320-50 = "어쩌면 선생님께서도 흥미를 가지실 만한 게 있을 지도 모르고……."
1001320-51 = "보여드려도 괜찮은……."
1001320-52 = "크헤……."
1001320-53 = "크헤헤헤헤……!!"
1001320-57 = "……아, 아니. 이게 아닌가……."
1001320-58 = "죄송합니다, 선생님. 제가 또 무례하게 혼자 짐작해서……."
1001320-59 = "[s5] \"아냐. 나야 고맙지. 보여줘도 괜찮겠어?\"\n[s6] \"오, 츠루기의 영업이라니. 이건 귀한 걸.\""
1001320-60 = "……!?"
1001320-61 = "……!?"
1001320-62 = "저, 정말이십니까, 그 말씀……. 그, 그렇지만……. 선생님께서 이런……."
1001320-63 = "굳이 저 때문에 신경 써 주시는 거라면 그러실 필요는……."
1001320-64 = "아, 아닙니다. 이렇게 말씀드리는 게 오히려 실례일 것 같군요……. 알겠습니다."
1001320-65 = "그럼 선생님. 괜찮으시다면 이, 이쪽으로……."
1001320-70 = "(츠루기를 따라 츠루기의 방으로 들어갔다. 깔끔하고 단정하게 정돈된 방이었다.)"
1001320-71 = "드, 들어오십시오. 선생님. 누추한 곳이지만……."
1001320-72 = "이렇게 될 줄 알았으면 좀 더 신경 써서 정리를 했어야 하는데……."
1001320-73 = "아, 아니지. 중요한 건 그게 아니고……. 편하게 앉아 계십시오. 지금 바로 가져오겠습니다!!"
1001320-86 = "[ns7] \"…………우와.\"\n[ns8] \"굉장하네. 오랫동안 모아 온 모양이구나.\""
1001320-87 = "네. 실은 예전부터 쭉 모아 왔던 것인지라……."
1001320-88 = "네. 실은 예전부터 쭉 모아 왔던 것인지라……."
1001320-89 = "……네? 영화 말고 다른 것도 많이 있다고요? 네, 아무래도 크게 가리지는 않다 보니……."
1001320-90 = "아……. 그건 만화책입니다. <해산물 바스켓>이라고 하는 순정만화……."
1001320-91 = "그, 그건 BD……. <초속 5광년>이라는 SF 멜로 드라마……."
1001320-92 = "그건 <토이타닉>이라는 로맨스 영화 팸플릿입니다. 옛날 영화인데, 최근 재개봉을 했었습니다……."
1001320-93 = "아, 그건 또……."
1001320-94 = "……………………."
1001320-95 = "……선생님……?"
1001320-96 = "[s9] \"츠루기는 정말 이런 쪽을 좋아하는구나.\"\n[s10] \"다른 사람들한테도 보여준 적 있어?\""
1001320-97 = "어……. 그, 그게……."
1001320-98 = "어……. 그, 그게……."
1001320-99 = "……네? 아, 아닙니다. 일부러 숨기거나 하지는 않습니다. 다만 다들 크게는 관심이 없어 보여서……."
1001320-100 = "오히려 신기한 느낌으로 보거나, 같이 보다가 자거나 하는 경우가 많았다 보니……."
1001320-101 = "그래서 지금은 그냥 저 혼자서 보고 있습니다……."
1001320-102 = "……네?"
1001320-103 = "아아. 시간 되면 혼자 갈 때 가끔 불러 주셔도 좋다……는 말씀이십니까?"
1001320-104 = "그, 그야 그래 주시면 저야 당연히 감사하지만……."
1001320-105 = "…………."
1001320-106 = "……어어……. 네……?"
1001320-107 = "선생님……? 지금 뭐라고 말씀하신……."
1001320-108 = "가, 같이……. 보자고 말씀하신 겁니까……? 저랑……? 영화라든가……. 드라마라든가……? 그, 그런 말씀이십니까……?"
1001320-109 = "[s11] \"츠루기만 좋다면.\"\n[s12] \"나라도 괜찮다면 물론이지.\""
1001320-110 = "서, 선생님이 저와 함께……. 영화관……을……."
1001320-111 = "서, 선생님이 저와 함께……. 영화관……을……."
1001320-112 = "……키……."
1001320-113 = "키헤……"
1001320-114 = "키헤헤헤헤헤……!!!"
1001320-115 = "클헤헤헤헤헤헤!!!"
1001320-116 = "[s] 익숙하게 적당한 곳으로 피한다."
1001320-117 = "키햐하하하하하하하-!!!!"
1001320-124 = "[ns13] \"다행히 상자는 무사하네.\"\n[ns14] \"즐거워 보여서 다행이야, 츠루기.\""
1001320-127 = "(이후 돌아온 츠루기와 함께 무너진 주변을 다시 정리했다.)"
1001320-128 = "(츠루기는 치우는 동안에도 계속해서 즐거워하는 웃음소리를 흘리고 있었다.)"
