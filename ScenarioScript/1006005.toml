[translation]
1006005-1 = "온천개발부의 일"
1006005-6 = "(업무를 마친 저녁, 샤워하기 위해 생활관 쪽을 다녀왔다.)"
1006005-7 = "(물이 얼음장처럼 차가웠기 때문에, 결국 포기하고 돌아올 수밖에 없었다.)"
1006005-13 = "[ns1] (……이 시간에 전화 연락?)\n[ns2] 연락을 받는다."
1006005-19 = "……아! 연결됐다."
1006005-20 = "선생님!! 선생님 지금 자리에 있어? 있으니까 연락받은 거겠지? 그렇지?"
1006005-21 = "[s3] \"……메구?\"\n[s4] \"있긴 한데……. 갑자기 무슨 일이야?\""
1006005-24 = "설명은 나중에! 시간이 없어, 선생님! 지금 당장 나와줘!!"
1006005-25 = "급하니까 빨리! 지금 당장이야! 알았지!? 위치는 보내줄 테니까!!"
1006005-32 = "[ns] \"……???\""
1006005-35 = "(메구가 보내준 장소는, 샬레로부터 멀지 않은 곳의 인근 야산의 어느 기슭이었다.)"
1006005-45 = "(인적도 제대로 된 도로도 없는 숲길을 헤치며 겨우겨우 목적지에 도달했다.)"
1006005-51 = "[ns5] \"……아.\"\n[ns6] \"분명 메구겠군, 이건.\""
1006005-59 = "……! 아 선생님!? 선생님 맞나? 맞겠지?"
1006005-60 = "선생님~~!! 여기야, 여기!!!"
1006005-61 = "[ns] 소리가 난 쪽으로 향한다."
1006005-62 = "선생님~~!!!"
1006005-65 = "[wa:650]― 아~! [wa:1000]역시 [wa:450]선생님이었구나!"
1006005-67 = "― 기다리고 있었다고!"
1006005-70 = "― 바빴어? [wa:1500]미안!"
1006005-72 = "― 그치만 급했거든!"
1006005-75 = "[ns7] \"메구……? 이게 다 뭐야?\"\n[ns8] \"온천? 네가 만든 거야?\""
1006005-76 = "[wa:800]― 아아~. [wa:550]그렇긴 한데……."
1006005-77 = "[wa:800]― 아아~. [wa:550]그렇긴 한데……."
1006005-79 = "― 이거, [wa:550]계속 나오는 온천이 아니거든?"
1006005-82 = "― 앞으로 몇 시간밖에 안 남았어!"
1006005-84 = "― 마르기 전에 [wa:1050]선생님이 왔으면 해서!"
1006005-87 = "[wa:250]― ……응? [wa:950]그런데?"
1006005-89 = "― 혼자 만든 거야!"
1006005-92 = "[wa:900]― 이래 봬도 [wa:500]온천개발부니까!"
1006005-95 = "― 아무래도, [wa:750]따듯한 물이 필요한 사람을"
1006005-97 = "― 지나칠 순 [wa:900]없거든."
1006005-100 = "― 뭣보다……."
1006005-102 = "― 선생님의 일이고 말이지! [wa:2200]……히히!"
1006005-105 = "[wa:650]― 자, 자! [wa:350]사양 말고 들어가!"
1006005-107 = "― 지금 [wa:250]한창 좋을 온도라고!"
1006005-110 = "― 메구 특제, [wa:1300]선생님 전용 온천이야!"
1006005-113 = "어라? 선생님?"
1006005-114 = "왜 멍하니 서 있어? 안 들어가도 괜찮아?"
1006005-115 = "응? ……이거 언제부터 만들고 있었냐고?"
1006005-116 = "으음~. 글쎄……. 아까 전에 선생님이랑 연락한 뒤부터니까……."
1006005-117 = "대충 아침쯤부터?"
1006005-118 = "……어라……. 선생님?"
1006005-119 = "표정이 왜 그래? 무슨 일 있어?"
1006005-120 = "……나?"
1006005-121 = "흙투성이가 다 됐다고? 그야 당연하잖아? 이걸 만들고 있었으니까!"
1006005-122 = "하하하! 뭐야~. 신경 쓰지 마! 온천개발부에게는 늘 있는 일이라고!"
1006005-123 = "아, 그러면 이왕 이렇게 된 거, 나도 같이 씻을까? 같이 들어갈래?"
1006005-124 = "그래도 두 사람 정도는 같이 들어갈 수 있을 것 같은데! 좀 낄 거 같기도 하지만……."
1006005-125 = "……응? 괜찮다고? 먼저 씻어? 내가?"
1006005-126 = "으음~. 이상한데, 선생님을 위해 만든 탕인데 내가 먼저 씻는다니. 뭔가 앞뒤가 맞지 않아."
1006005-130 = "에이, 뭐 그래도 선생님의 말이니까! 모르긴 몰라도 이유가 있겠지! 온천수는 아직 시간도 좀 있는 것 같고!"
1006005-131 = "그럼 금방 먼저 씻을 테니까, 조금만 기다려 줘. 선생님!!"
1006005-137 = "(이후 말끔하게 돌아온 메구와 교대하며, 메구가 만들어 준 온천탕에서 하루의 피로를 풀었다.)"
1006005-138 = "(온천개발부 다운 솜씨로 만든 온천은, 굉장히 쾌적하면서도 따듯한 물이 솟아 나왔다.)"
1006005-142 = "(그리고 돌아오는 길. 함께 모리모리군을 사 먹으며 나란히 걸었다.)"
