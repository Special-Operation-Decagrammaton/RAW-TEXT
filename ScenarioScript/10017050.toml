[translation]
10017050-1 = "제5화;Civil War(?)"
10017050-2 = "카페 <화이트&메이슨>"
10017050-3 = "저…… 솔직히, 이런 자리는 오랜만이라고 해야 할지, 처음이라고 해야 할지……"
10017050-4 = "그래서 뭘 어떻게 즐기면 좋은지 잘 모르겠네요……"
10017050-6 = "편한 대로 즐기면 된답니다."
10017050-7 = "맛있는 스콘과 케이크가 있고, 향이 좋은 홍차도 있어요."
10017050-8 = "마음 가는 대로 맛보고, 마시면 되는 겁니다."
10017050-13 = "하지만 저희는…… 그…… 하스미 부부장님처럼 행동이 기품 있지도 않고……"
10017050-14 = "홍차의 맛이나 향도 아직 잘 모르겠는걸요……"
10017050-16 = "그런 건 신경 쓰지 않아도 돼요."
10017050-17 = "다과를 즐기는데, 그리고 홍차를 즐기는데 그렇게까지 난해한 지식은 필요 없답니다."
10017050-18 = "그리고 이 자리는 여러분들이 지난 1년간 수고해 주신 것을 소박하게나마 위로하기 위한 자리이기도 하잖아요?"
10017050-23 = "차가 식겠어요. 어서 드세요."
10017050-24 = "가, 감사합니다……"
10017050-25 = "그런데, 밀크티를 만들 때 우유에 홍차를 붓는 게 맞을까요, 아니면 홍차에 우유를 붓는 게 맞을까요?"
10017050-26 = "홍차에 찬 우유를 붓는 게 맞지 않을까요? 그래야 뜨거운 홍차를 우유가 식혀 주면서 마시기 좋은 온도가 되니까요."
10017050-27 = "아뇨, 따뜻하게 덥힌 우유에 홍차를 붓는 게 맞겠지요. 그래야 우유의 고소한 맛과 홍차가 어우러져 보다 깊은 맛을 내주니까요."
10017050-28 = "그건 이상한 방법이에요! 우유를 덥히는 과정에서 표면에 얇은 막이 생길 수가 있고,"
10017050-29 = "결과적으로 홍차에 불순물이 섞이게 되어서 오히려 제대로 맛이 나지 않는다구요!"
10017050-30 = "그건 잘 모르고 하시는 말씀이에요! 홍차에 우유를 붓게 되면 단백질이 변성되면서 특유의 비린 냄새가 나게 되고,"
10017050-31 = "홍차 성분과 어울려서 홍차의 떫은맛을 제어할 유지방까지 변성되어 버리면서 떫은맛은 떫은맛대로 조절되지 않아요!"
10017050-32 = "반대로 우유에 홍차를 부으면 일정 온도 이상으로 차의 온도가 올라가지 않기 때문에 변성이 일어나지 않아서 밀크티의 맛을 온전히 즐길 수 있죠!"
10017050-33 = "홍차에 우유를!"
10017050-34 = "우유에 홍차를!"
10017050-36 = "자, 자. 진정들 하세요. 여러분."
10017050-38 = "핫? 죄, 죄송합니다. 하스미 님!"
10017050-39 = "저도 모르게 이런 추태를……!"
10017050-41 = "괜찮습니다. 애초에 그것은…… 위험한 질문이었어요."
10017050-42 = "네? 위험한 질문이요?"
10017050-43 = "물론 모르고 하신 말씀이시겠지만, 그 질문은 무려 100년이 넘는 시간 동안 논쟁을 불러일으키고 있는 물음이거든요."
10017050-44 = "덧붙여서, 제대로 된 결론은 아직도 나지 않았죠……"
10017050-45 = "우유에 홍차를 붓는 것이 조금 더 떫은맛을 줄일 수 있다고도 합니다만……"
10017050-46 = "말씀해 주셨듯이 그 떫은맛을 오히려 즐긴다거나, 우유를 가열할 때 나는 풍미가 좋다는 사람도……"
10017050-47 = "'우유에 홍차를 붓는 쪽'과 '홍차에 우유를 붓는 쪽'으로 나뉘어서 다툼이 생길 뻔했을 정도니까요."
10017050-49 = "그, 그렇군요……! 모르고 있었습니다."
10017050-50 = "적당히 마음 편한 선에서 다과와 송년회를 즐기도록 하겠습니다!"
10017050-52 = "그래도 걱정했던 것보다는 다들 편히 즐기고 있는 것 같군요."
10017050-53 = "……괜찮나요, 츠루기?"
10017050-61 = "키에에에……"
10017050-62 = "츠루기도 조금 더 어깨의 힘을 뺄 필요가 있어요……"
10017050-63 = "자아, 홍차와 다과, 제법 좋아하잖아요?"
10017050-64 = "싫어하지는, 않아……"
10017050-65 = "하지만……"
10017050-66 = "……내가 자리에 있는 것만으로도, 긴장하는 사람이 생겨 버리니까."
10017050-67 = "그렇지만 부원들 앞이잖아요. 부장으로서 그렇게까지 신경 쓰지 않아도……"
10017050-68 = "노력하고, 있어……"
10017050-69 = "그런가요. 그렇다면 괜찮지만……"
10017050-71 = "카페 <화이트&메이슨> 입구"
10017050-75 = "저…… 조금 전부터 뭐 하고 계시는지……?"
10017050-76 = "보시다시피, 경계를 서고 있습니다."
10017050-77 = "네? 하지만 지금은 다 같이 파티 중인데요?"
10017050-78 = "분명히 그렇습니다. 그러나 모두가 마음 편히 쉴 수 있도록 경계를 서는 것……"
10017050-79 = "그 또한 정의를 실현하는 하나의 방법일 테니까요!"
10017050-81 = "그, 그래도 즐길 시간은 있으셔야죠……?"
10017050-82 = "괜찮습니다. 정의를 지키는 것이야말로, 저에게는 또 다른 파티나 다름없기 때문입니다!"
10017050-83 = "그런…… 가요? 하지만…… 역시……"
10017050-89 = "……교대하지."
10017050-94 = "부, 부장님?!"
10017050-95 = "츠루기 선배? 여긴 무슨 일이십니까?"
10017050-97 = "교대하러 왔다……"
10017050-102 = "네? 하지만 선배는……"
10017050-103 = "저, 저는 이만 실례하겠습니다!"
10017050-109 = "……괜찮으시겠습니까?"
10017050-110 = "이 쪽이 편해……"
10017050-111 = "알겠습니다. 그러면 염치 불고하고–"
10017050-113 = "–구호기사단이 정의실현부에게 묻겠습니다!"
10017050-118 = "……뭔가 말이 미묘하게 연결된 것 같군요."
10017050-119 = "구호기사단의 미네 단장님 아니십니까?"
10017050-120 = "여기에는 무슨 일이시죠, 단장님?"
10017050-122 = "확인하겠습니다. 귀 정의실현부는, 오늘 불량배들에게서 크리스마스 치킨을 수거했습니까?"
10017050-127 = "……어?"
10017050-128 = "(회수…… 했었지…….)"
10017050-129 = "(사실관계를 명확히 전달하는 것도, 또 하나의 정의를 실현하는 방법이겠지요.)"
10017050-130 = "예. 그런 일이 있었습니다."
10017050-132 = "그렇군요. 확인했습니다. 그리고 이 순간 저는……"
10017050-133 = "슬픕니다. 한없이 슬픕니다!"
10017050-134 = "다른 날도 아닌 크리스마스에, 정의 그 자체여야 할 정의실현부가, 그 마음을 잃어버리다니!"
10017050-135 = "네? 무슨 말씀이신지……"
10017050-136 = "정녕 모르겠다는 것입니까? 아니면 아예 스스로 깨닫지조차 못하는 건가요?"
10017050-137 = "돌아와 주십시오, 정의실현부! 함께 가엾은 자들에게 구호를 전하곤 했던 그때의 우리들로!"
10017050-138 = "(이 녀석, 늘 그렇지만 영문을 모르겠다니까……)"
10017050-139 = "기다려 주세요, 단장님. 저희는 크리스마스를 맞이하여 조촐한 파티를 개최하고 있는 중입니다."
10017050-140 = "제가 알기로 크리스마스는, 구호기사단에게도 정의실현부에게도 중요한 날이 아니었는지요?"
10017050-142 = "바로 그래서입니다!"
10017050-143 = "키에에에……?!"
10017050-144 = "휴식을 갖는 것으로 뭐라 할 생각은 없습니다."
10017050-145 = "그러나 다른 날도 아닌 크리스마스에, 정의실현부가 그 근본을 잊은 채 본분을 망각한다면!"
10017050-146 = "저는 주저 없이 이 방패를 들고 그 앞을 막아설 것입니다!"
10017050-147 = "그것이 정의실현부에게 보내는 저의 경의입니다!"
10017050-148 = "도, 도대체 무슨 일로 그러시는지 말씀이라도 해 주시면……"
10017050-149 = "시치미 떼지 마세요! 불량배들의 치킨을 수거했다고 하셨잖습니까!"
10017050-150 = "그들이 불량배이든 무엇이든, 자신들의 것을 정의실현부에게 빼앗겼다는 사실에는 변함이 없지 않나요?"
10017050-151 = "'구호'는 모두에게, 가능한 한 공평하게 전달되어야 합니다! 그것이 구호기사단의 목표입니다!"
10017050-152 = "분명히 그랬습니다만 그 치킨은……!"
10017050-153 = "이렇게까지 말씀드렸는데도 모르시겠다는 것입니까? 아니면 모르기로 결정한 것인가요?"
10017050-154 = "어느 쪽이든 저는 슬픔의 마음을 금할 수 없습니다!"
10017050-160 = "……물러나, 마시로."
10017050-161 = "츠루기 선배?"
10017050-167 = "(사정이고 영문이고 하나도 모르겠지만……)"
10017050-168 = "(부원들 모두가 간만에 쉬고 있어…… 그걸 방해하게 둘 수는 없지……)"
10017050-171 = "저 녀석, 이렇게 되면 말이 안 통해. 안으로 들어가 있어."
10017050-172 = "아뇨, 그럴 수는 없습니다!"
10017050-173 = "선배가 앞에 서시는데, 제가 물러나는 것은 정의가 아닙니다!"
10017050-174 = "……온다. 위치로."
10017050-175 = "네, 선배!"
10017050-177 = "구호가 필요한 곳에 구호를!"
