[translation]
10031070-1 = "제7화;그리고 찾아온 파티 당일"
10031070-2 = "(그간 수많은 일이 있었지만, 마침내 파티 개최 당일이 찾아왔다.)"
10031070-4 = "게헨나 파티장"
10031070-7 = "[ns] \"파티 시작까지 앞으로 3시간……인가.\""
10031070-22 = "그러고 보니 그 이야기 들었어? 이번 축제의 첫 이벤트 말이야."
10031070-23 = "아, 맞아. 대대적으로 광고도 했었지?"
10031070-24 = "나도 들었어! 이번 파티의 메인이 되는 이벤트……"
10031070-25 = "<선도부장님의 오프닝 피아노 공연!>"
10031070-26 = "히나 님의 공연이라니 기대된다~"
10031070-27 = "근데 만마전이랑 선도부, 서로 사이가 나쁘지 않았나? 용케도 만마전이 선도부의 공연을 허가해 줬네."
10031070-28 = "듣기로는 그것도 전부 만마전의 의장님이 하해와 같은 넓은 아량으로, 선도부와의 관계 진전을 위해 스스로 직접 한 걸음 내딛은 덕분이라는 이야기를 저번에……."
10031070-30 = "[ns] \"마코토…… 아무렇지도 않게 저런 홍보를…….\""
10031070-31 = "정말 그렇다니까요."
10031070-36 = "잠시 저희 선도부가 훈련 일정이나, 만마전의 억지 때문에 발이 붙잡혀 있는 사이에, 번갯불에 콩 구워 먹듯이 여론을 자기에게 유리한 방향으로 선동해 뒀다니."
10031070-37 = "그 인간…… 진짜 자기에게 좋은 방향이라고 생각된 건 죄다 불도저처럼 진행해 버린다니까요."
10031070-38 = "……하아. 여기까지 온 이상, 너무 늦어버린 말일지도 모르지만. 부장님도 더 칼같이 거절하시는 편이 좋았을 텐데."
10031070-39 = "[s] \"앗, 아코…….\""
10031070-40 = "네, 안녕하세요. 선생님. 먼저 와 계셨군요."
10031070-41 = "솔직히 선생님께서 만마전에게 곧이곧대로 협력하신 것에, 한두 마디 정도 불평을 해 두고 싶던 참입니다만."
10031070-42 = "[s1] \"으음. 그건 학생의 부탁이었으니까.\"\n[s2] \"파티를 여는 이유도, 딱히 음모를 꾸미려고 했던 게 아니었고.\""
10031070-45 = "다른 학생들과 마찬가지로, 협력하는 것은 당연……하다는 말씀인가요?"
10031070-46 = "……뭐, 그런 점까지 고려해서 움직여야 하는 점이 곧 선생님의 고충이란 것이겠지요. 그걸 이해하지 못하는 건 아닙니다."
10031070-47 = "그 결과, 중간에서 선도부가 여러모로 골탕을 먹는 느낌은 있습니다마는."
10031070-48 = "[s] \"그, 그건 선도부가 잘해줄 거라고 믿고 있으니까!\""
10031070-49 = "……네. 신뢰해 주시는 건 물론 기쁘지만, 귀찮은 일을 떠넘기는 건 곤란하다고요?"
10031070-50 = "그래서 어떠신가요? 만마전을 직접 상대해 본 경험은?"
10031070-51 = "그 얼토당토않은 무리들을 상대하면서…… 조금은 저희의 처지가 이해되지 않으셨나요? 네?"
10031070-52 = "[s] \"아니, 뭐…… 다들 개성적인 아이들이라고 생각해…….\""
10031070-53 = "흐응. 개성이라, 참 좋은 말로 포장해 주시네요……."
10031070-54 = "[s] \"그, 그보다 아코. 그 옷차림 말인데…….\""
10031070-55 = "아, 이거 말인가요."
10031070-56 = "뭐어…… 이번 파티에 대해선 딱히 내키는 건 아니었습니다만."
10031070-57 = "게헨나의 선임행정관으로서 부장님을 완벽히 보좌하기 위해서라도, 상황에 맞춰 저 자신을 꾸몄다고 해둘까요?"
10031070-58 = "그래요…… 지금의 저는 선도부의 둘째가라면 서러워할 완벽한 첩보원……!"
10031070-59 = "네, 그런 컨셉이랍니다."
10031070-60 = "[s] \"응, 잘 어울려.\""
10031070-61 = "……네?"
10031070-62 = "오, 오해하지 마세요. 이건 뭔가 흑심이 있어서 꾸며 입은 게 아니라, 정말 몸가짐부터 첩보원이 되고자……"
10031070-63 = "……아니, 뭘 당황하는 거람."
10031070-64 = "이, 이게 다 느닷없이 정면에서 그런 말을 하는 선생님 때문이라구요."
10031070-65 = "[s] \"어?! 내 잘못이야?!\""
10031070-66 = "……흠흠. 그래도 선생님의 솔직한 칭찬이라면, 네. 접수해 두겠지만요."
10031070-67 = "하여간. 이번 파티…… 어찌 되었든 간에 방심할 순 없겠죠."
10031070-68 = "일단은 저희 선도부 쪽에서는 무슨 상황이 발생하더라도 빠르게 대응할 수 있도록 현장 병력 배치는 마쳐 둔 참입니다마는."
10031070-83 = "이렇게 배치하고도 마음 한구석이 불안한 이유는 무엇일까요."
10031070-84 = "……만마전과 선도부가 참관하는 파티이니, 간이 배 밖으로 나오지 않는 이상 문제를 일으키려고 드는 문제아는 없을 것이다……라고 생각합니다만."
10031070-85 = "정작 이 파티를 연 당사자가…… 다른 누구도 아닌 판데모니움 소사이어티의 의장이니까요."
10031070-86 = "파티 개최 직전까지도 방심할 수가 없다니까요. 진짜."
10031070-87 = "[s3] \"그래도 괜찮지 않을까? 여기까지 온 만큼…….\"\n[s4] \"누가 뭐라 해도 아코랑 히나, 그리고 선도부가 철통처럼 지키고 있고!\""
10031070-90 = "히나, 부장님…… 말씀이지요. 으음. 하지만."
10031070-91 = "[s] \"그러고 보니 아코, 히나는 어디 있어?\""
10031070-92 = "아, 그게 부장님은 잠시 자리를 비우셨다고 할지."
10031070-93 = "당신만의 볼일이 있어서……."
10031070-94 = "크크큭. 안녕하신가. [USERNAME] 선생. 그리고 아코 선임행정관."
10031070-105 = "안녕~! 선생님이랑! 아코 선배~!"
10031070-107 = "흥…… 당신들인가요."
10031070-111 = "[ns] \"안녕, 두 사람도 잘 어울리네.\""
10031070-113 = "키킷! 그래. 잘 알아보았다! 파티를 맞이해. 이 몸의 위엄에 어울리는 것으로 골라두었지!"
10031070-114 = "이부키의 드레스~ 마코토 선배가 골라준 거야~ 이쁘지~"
10031070-115 = "[s] \"응, 이부키도, 입고 있는 드레스도 전부 귀여워.\""
10031070-116 = "앗, 그래? 고마워 선생님!"
10031070-117 = "크크큭…… 그렇지. 이부키의 매력은…… 이것으로 평소보다 150배는 더 업그레이드……"
10031070-118 = "조심하라고, 아마우 아코. 멍하니 쳐다보고 있다간 눈이 멀어버릴지도 모르니까."
10031070-120 = "……아, 네. 당신이야 차치하고서라도 이부키 양이 귀여운 건 사실이니까요."
10031070-121 = "앗. 정말? 아코 선배가 칭찬해 줬다! 고마워!"
10031070-122 = "네, 네에…… 그, 그냥 단순한 진심을 말했을 뿐이에요. 흠흠."
10031070-123 = "키키키킷! 뭐, 그런 아주 당연한 잡담은 잠시 뒤로 미뤄두기로 하고……"
10031070-124 = "소라사키 히나…… 선도부장이 보이질 않는군."
10031070-125 = "앗, 그건……."
10031070-126 = "이제 피아노 공연까지 남은 시간은 앞으로 고작 해봐야 2시간 남짓."
10031070-127 = "이런 시간이 되도록 모습을 드러내지 않고 있다는 건………"
10031070-128 = "키킷. 선도부장 녀석. 역시나 피아노를 치는 것이 무서워 도망간 것은 아닌가?"
10031070-129 = "뭐라고요?"
10031070-130 = "그런 게 아니라면 이 시간이 되도록 모습을 드러내지 않는 게 설명이 안 되잖나?"
10031070-131 = "평범하게 생각하면 진즉 리허설을 마치고 대기실에 있어야 할 시간이라고?"
10031070-132 = "그, 그건 그럴지도 모르지만……"
10031070-133 = "부장님이 도망칠 리가 없잖아요! 다른 누구도 아닌 저희의 선도부장님이라고요?!"
10031070-134 = "키킷. 말뿐인 신뢰라는 건 어찌 이토록 공허한지."
10031070-135 = "아무리 책임감이 강해도, 도망치고 싶어지는 날쯤 있기 마련."
10031070-136 = "노력한다 해도 자신에게 불가능한 것이 있다는 걸 깨달았다면…… 제아무리 선도부장이라고 해도 도망칠지 모른다고?"
10031070-140 = "[ns] \"자신에게 불가능한 것이라니……?\""
10031070-141 = "키키킷! 잘 물어봐 주었다! 선생!"
10031070-142 = "우리 만마전의 첩보 능력은 매우 우수하지! 선도부 따윈 상대가 되지 않을 정도로 말이야!"
10031070-143 = "그런 우리가 첩보를 통해 손에 넣은 선도부에 관한 특급 비밀 정보가 있었지."
10031070-144 = "당신…… 선도부를 대상으로 그런 첩보 활동을 펼치고 있었나요?!"
10031070-145 = "흥, 새삼스럽긴. 게헨나에선 누구나 하는 일이잖아?"
10031070-146 = "손에 넣은 정보에 따르면…… 무엇이든 척척 해내는 모습이, 그야말로 완벽해 보이는 소라사키 히나이지만."
10031070-147 = "실은 그 녀석에게도 할 수 없는 것, 못 하는 것이 여럿 있다는 걸 알게 되었다……"
10031070-148 = "그 대표적인 것이 바로……… 수영!"
10031070-149 = "?!"
10031070-150 = "그뿐만 아니라 녀석은 피아노를 포함한 악기의 연주도 못 한다고 했던가!"
10031070-151 = "그걸 알고도 당신은……"
10031070-152 = "맞아! 오히려 그런 약점들을 알고 있었기에 나는 녀석에게 피아노 연주를 맡겼다!"
10031070-153 = "……어째서죠?"
10031070-154 = "응? 그랬다간 내가 애써 공들여 준비한 파티를 망칠지도 모르는데, 왜 그런 선택을 했느냐고?"
10031070-155 = "크크크큭. 새삼스레 그런 당연한 걸 묻는 군…… 그야………"
10031070-156 = "이 몸의 파티가 망쳐지는 것보다, 그 녀석이 자빠지는 꼴을 보는 게 더 유쾌하니까 그렇지!!"
10031070-157 = "[s] \"………우와.\""
10031070-158 = "………당신, 바보죠?"
10031070-159 = "에잇! 물론 노리는 건 그것만이 아니야!"
10031070-160 = "히나, 그 녀석이 나타나지 않고 도망쳤다면. 그 자체로 우리 만마전과 선도부의 격차가 증명되는 것이나 다름없다!"
10031070-161 = "도망친 녀석은 아무런 변명도 할 수 없는 법이니까!"
10031070-162 = "………당신, 그런 약은 수를 쓰려고."
10031070-163 = "하지만 부장님은…… 애당초 도망친 게 아니라……"
10031070-164 = "흥, 이제 와서 변명하려고 해봤자 늦었어."
10031070-165 = "이로하! 이로하랑 치아키는 어디 있느냐! 공연이 코앞으로 다가왔는데도 선도부장이 나타나지 않고 있다!"
10031070-166 = "그 사실을 게헨나 전체에 공표하고! 우리 만마전이 승리했다는 소식을 널리 알리도록 해라!"
10031070-167 = "자, 잠깐만요. 제정신이에요?! 그런 선언을 했다간……!"
10031070-168 = "키키킷! 패자의 말 따윈, 이 몸에게 한낱 미풍에 지나지 않는 법! 그보다 이로하랑 치아키는……."
10031070-169 = "아, 두 사람이라면 파티 준비 때문에 잠깐 자리를 비웠어."
10031070-170 = "이 중요한 순간을 함께하지 못하다니, 안타깝군."
10031070-171 = "크크큭. 뭐, 좋다. 그럼 이 몸이 직접 나서볼까."
10031070-172 = "크크큭……… 이것으로 마침내 오늘부터……!"
10031070-173 = "우리 만마전의 천하가 시작된다……!"
10031070-174 = "[ns] \"………뭔가, 엄청 불길한 느낌인데.\""
10031070-178 = "자아! 게헨나의 모든 학생은 들어라!"
10031070-179 = "본디 오늘부터 시작될 게헨나 특별 파티에 앞서…… 그 개막 공연을 맡기로 한 소라사키 히나. 선도부장이 모습을 드러내지 않고 있다!"
10031070-180 = "필시 녀석은 공연을 맡는 막중한 임무가 두려워 모습을 감춘 것이 틀림없으렷다!"
10031070-181 = "이는 우리 만마전에 대한 모욕이자, 스스로 패배를 선언한 것이나 다름없는 상황!"
10031070-182 = "따라서, 게헨나의 진정한 톱은, 이 마코토 님밖에 없다는 것이 증명되고야 말았다!"
10031070-188 = "크크큭…… 이것으로 승부는 났다."
10031070-189 = "…………"
10031070-190 = "[s] \"아코…… 이대로 있어도 괜찮은…….\""
10031070-191 = "저희는 괜찮아요."
10031070-192 = "문제는……"
10031070-193 = "[s] \"문제는………?\""
10031070-197 = "의, 의장님! 큰일입니다!"
10031070-198 = "응? 무슨 일이냐."
10031070-199 = "그, 그것이…… 방금 전의 방송 직후에…… 게헨나 각지에서……!"
10031070-200 = "………?"
10031070-203 = "부장! 방금 방송 봤어?! 선도부장이 행방불명이래! 만마전이 이겼다는데?!"
10031070-204 = "…………… 선도부장이…… 행방, 불명……?"
10031070-205 = "………"
10031070-206 = "크으응. 훌쩍."
10031070-210 = "그 말은 즉……… 온천개발부가 활약할 때가 찾아왔다는 말이로군?"
10031070-211 = "응! 그런가 봐!"
10031070-212 = "와핫핫핫!!"
10031070-213 = "전원, 돌격이다! 온천 개발의 시간이다! 만마전의 온천을 완성시켜 주겠어!"
10031070-214 = "얏~~~호! 전원! 장비 챙겨! 지금부터 탈옥 준비~~~~!"
10031070-215 = "땅이야!"
10031070-225 = "호오. 방금 방송…… 저희를 방해했던 선도부장이 현재는 부재인 상황……."
10031070-226 = "후후. 어떻게 할까요? 하루나."
10031070-227 = "여기까지 왔으면 말할 것도 없잖아?"
10031070-228 = "맞아! 아직 맛있는 것도 못먹었구!!"
10031070-229 = "네에, 그럼 좋습니다. 아까는 선도부장 때문에 실패해 버렸습니다만. 다시 움직일까요?"
