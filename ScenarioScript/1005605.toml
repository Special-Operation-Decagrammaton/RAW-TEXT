[translation]
1005605-1 = "구호기사단 일일 체험"
1005605-8 = "아, 선생님! 여기예요!"
1005605-12 = "그런데 정말…… 괜찮으시겠어요?"
1005605-13 = "[s] \"세리나가 언제나 하는 일인걸!\""
1005605-14 = "아하하…… 그렇게 말씀하신다면 드릴 말씀이 없지만요."
1005605-15 = "정말…… 감사드려요."
1005605-21 = "성 테레사 종합병원 병실"
1005605-22 = "안녕하세요! 산타가 도착했습니다!"
1005605-23 = "선물이 필요한 분 계신가요? 물론 건강이 최고의 선물이겠지만요!"
1005605-24 = "오오, 병원에도 산타 세리나 짱이 와 주는 건가. 이거 반갑구만."
1005605-25 = "그 뒤에 계신 분은 샬레의 선생님 산타이신가? 수고가 많네."
1005605-26 = "산타가 두 분이나 왔으니, 선물이 모자랄 리는 없겠네."
1005605-27 = "그럼요, 물론이죠. 언제든 말씀만 하세요."
1005605-29 = "저런…… 손을 다치셔서 선물을 풀 수가 없으시군요. 제가 대신 해 드릴게요."
1005605-30 = "아하하. 그러고 보니 이상하네요. 선물을 주는 산타가 직접 선물을 풀어 주다니요."
1005605-31 = "안에 든 것은 무엇일까요……?"
1005605-35 = "짜잔! 어때요, 맘에 드셨나요?"
1005605-37 = "산타들이 와 준 것만으로 이미 충분히 선물이 되셨다고요?"
1005605-38 = "그렇지만 저희가 준비한 선물도 받아 보셔야죠. 어느 게 좋으세요?"
1005605-39 = "그럼 오른쪽 선물로 하겠습니다! 메리 크리스마스!"
1005605-41 = "아무리 그래도 식사는 확실히 하셔야죠!"
1005605-42 = "산타는 나쁜 환자분께는 선물을 드릴 수가 없어요."
1005605-43 = "치료도 잘 받으셔야 하고, 회진 때도 이야기 잘 해주셔야 하고!"
1005605-44 = "그래야 저희도 기쁜 마음으로 선물을 드릴 수가 있는 거예요!"
1005605-46 = "(그렇게 세리나는 구호기사단의 일과 산타로서의 일을 척척 처리해 나갔다.)"
1005605-47 = "(세리나가 너무 열심히 해 준 덕분에 내가 할 일은 그다지 많지 않을 정도였다……)"
1005605-51 = "성 테레사 종합병원 로비"
1005605-53 = "[ns] \"……세리나는 매일 이런 일을 하는 거야?\""
1005605-54 = "매일…… 은 아니에요. 오늘은 산타 일까지 해야 했어서 조금 바빴네요."
1005605-55 = "죄송해요, 선생님. 힘드셨죠?"
1005605-56 = "네? 그렇게 생각할 필요는…… 없다고요?"
1005605-57 = "후훗, 알겠어요."
1005605-58 = "[s] \"학업에 구호기사단 일까지 병행하는 건 큰일이겠네……\""
1005605-59 = "그런…… 가요? 그런 식으로는 생각해 본 적이 없어서……"
1005605-60 = "그저 매일, 해야 할 일을 할 뿐이라는 감각인걸요."
1005605-61 = "학교생활은 즐거워요. 절 필요로 해 주시는 학생분들도 많고요."
1005605-62 = "구호기사단 일은 뿌듯하죠. 하루를 마치고 나면, 오늘도 할 일을 다 했다는 느낌이 들어서"
1005605-63 = "가슴이 후련해지기도 하고, 기분이 좋아지기도 하고 그러거든요."
1005605-64 = "[s1] \"나에게는 누구보다 무리하지 말라고 하면서……\"\n[s2] \"세리나가 가장 무리하고 있는 것처럼 보인단 말이지……\""
1005605-67 = "아하하…… 그렇게 말씀하시니 저도 뭔가 할 말이 없어지네요."
1005605-68 = "하지만 너무 걱정하지 마세요."
1005605-69 = "제가 스스로 한계를 느끼게 되면…… 누구보다 먼저 선생님께 말씀드릴 테니까요!"
1005605-74 = "그보다, 오늘 무슨 일로 구호기사단 일에 참여하겠다고 하신 거예요?"
1005605-75 = "[s3] \"대단한 이유는 없었어.\"\n[s4] \"세리나와 구호기사단에 대해 더 알고 싶었을 뿐이야.\""
1005605-78 = "네, 네?! 저와…… 구호기사단에 대해서요?"
1005605-79 = "그, 그런 걸 무슨 일로, 갑자기……"
1005605-80 = "아우, 뭔가 부끄럽네요. 엄청나게요……"
1005605-81 = "……"
1005605-86 = "저, 선생님?"
1005605-87 = "그러면 말이에요……"
1005605-88 = "다음에, 사정이 괜찮으시면……"
1005605-89 = "한 번만 더, 도움을 부탁드려도, 괜찮을까요?"
1005605-90 = "오늘 선생님과 함께해서…… 더 기쁘기도 했고……"
1005605-91 = "[s5] \"물론이지! 언제든 불러만 줘!\"\n[s6] \"언제나 어디서나 선생님!\""
1005605-97 = "아하하하, 뭐예요, 그게……"
1005605-98 = "그러면…… 약속하신 거예요?"
1005605-99 = "저, 약속 같은 거 기억 잘하니까요? 나중에 잊어버리신 척해도 소용없어요?"
1005605-100 = "감사합니다…… 선생님."
1005605-101 = "선생님이 계셔서…… 정말, 다행이에요."
1005605-103 = "(왠지 모르게 쑥스러워하는 세리나와 함께, 샬레로 돌아왔다.)"
