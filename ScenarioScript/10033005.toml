[translation]
10033005-1 = "프롤로그;그것은 마른하늘에 날벼락처럼"
10033005-2 = "하아아아……."
10033005-3 = "이렇게 한가한 시간을 갖는 것이 얼마 만인지……."
10033005-4 = "그러네– 여유롭네–"
10033005-5 = "조용하고, 사고도 없고, 소동극도 일어나지 않고, 거기에 옆에는……."
10033005-11 = "하아아아아……. 외람된 말입니다만, 이대로 시간이 멈추어 주었으면 하네요……."
10033005-12 = "아– 떠올랐어–"
10033005-17 = "잔잔한 냇가"
10033005-18 = "퐁당 뛰어오르는"
10033005-19 = "잉어 한 마리"
10033005-23 = "하, 하앗……! 치세 쨩의 갑작스러운 하이쿠……! 이것은 정말로……."
10033005-24 = "평화롭네요!"
10033005-28 = "그러게~ 냐하하~"
10033005-29 = "아, 그러고 보니 지금 떠올랐는데, 이번에 게헨나에서 우리 백귀야행으로 수학여행을 하고 싶다고~"
10033005-31 = "그렇군요."
10033005-32 = "기대되네. 그치~?"
10033005-33 = "그치~?"
10033005-35 = "그렇군요. 후후……"
10033005-39 = "……네? 방금, 니야 님. 뭐라고."
10033005-40 = "응. 게헨나에서 수학여행을. 백귀야행으로."
10033005-41 = "게헨나에서 수학여행을. 백귀야행으로."
10033005-42 = "응. 그거."
10033005-46 = "네에에에에?!?!"
10033005-48 = "여행이야–?"
10033005-49 = "계, 계약서. 계약서! 뭔가 준비된 거 있나요? 기본계획서나 금액산출예상서는?"
10033005-50 = "흠흠~?"
10033005-51 = "……견적서와 사업 제안요청서, 견본이라도 좋으니 일정표와 배치도, 식단표, 종합진단표, 시설 현황표, 수의계약 또는 경쟁계약서, 그리고, 그리고 또……."
10033005-52 = "자아~ 카호도 조금 진정하고 마음을 가다듬는 게 좋다고 생각하는데~?"
10033005-54 = "그, 그렇지요. 여기에서 필요 이상으로 흥분할 필요는……."
10033005-55 = "왜냐하면, 하나도 준비 안 되어 있거든~?"
10033005-56 = "역시 그런 건가요! 그보다, 왜 말 안 하신 거예요?!"
10033005-57 = "어……. 그야, 이제껏 꼼짝 없이 잊어버리고 있었……"
10033005-63 = "……던 게 아니라. 카호라면 갑작스러운 상황에도 충분히 대응해 줄 거라고~"
10033005-64 = "응. 그렇게 신뢰하고 있어서~ 랄까?"
10033005-69 = "니~ 야~ 님~?!"
10033005-70 = "꺄앙~"
10033005-75 = "전화야– 메세지야–"
10033005-77 = "자아, 여기."
10033005-78 = "앗, 고, 고마워요! 치세 쨩."
10033005-82 = "후우, 일단 마음의 정리부터 우선해서……. 그런데…… 어쩐지 느낌이 좋지 않은 듯한……."
10033005-87 = "이건…… 게헨나 선도부로부터 온 공문인데요……?"
10033005-92 = "네?! 게헨나 선도부와, 백화요란 분쟁조정위원회의 업무 회담 알림?!?!"
10033005-93 = "'……그리하여 상기와 같이, 음양부 여러분께 업무 공조 및 입회 부탁을 드리는 바……'"
10033005-99 = "안 돼– 이런 곳에서 잠들면 몸에 좋지 않아–"
10033005-104 = "그래요! 제가…… 저까지 쓰러지면! 누가 이 일에 대처한단 말인가요!"
10033005-105 = "우선 상황을 정리해 보도록 하겠습니다. 니야 님."
10033005-106 = "아하~ 카호. 얼굴이 딱딱해~ 좀 더 릴렉스~ 하는 편이 좋지 않을……."
10033005-112 = "상황을 정리해 보도록 하겠습니다."
10033005-113 = "냐하하. 으, 응. 카호가 그, 그렇게 하고 싶다면야……?"
10033005-114 = "우선, 게헨나 학원으로부터 백귀야행으로의 수학여행 제안서가 도착했습니다. 여기까지는 맞지요?"
10033005-115 = "응~ 그런 거지~?"
10033005-116 = "그리고 그에 따른 제반 행정 절차는 하나도 진행되어 있지 않은 채."
10033005-117 = "근시일 내에 게헨나 학원의 학생들이 이곳, 백귀야행 연합학원으로 수학여행을 올 예정입니다. 여기까지도 맞지요?"
10033005-118 = "확실히 그렇게 되었지~?"
10033005-122 = "거기에 한층 더해, 저는 방금 게헨나 선도부로부터 백화요란 분쟁조정위원회와의 업무 회담 및 입회 요청 알림을 받아."
10033005-123 = "저희 음양부와 백화요란 사이의 실무협의체를 구성해야 한다는 부탁을 받았습니다."
10033005-125 = "여기까지도 확인하셨지요?"
10033005-126 = "분명 카호의 말대로인데~?"
10033005-134 = "아, 또다시 쓰러지려 하고 있어–"
10033005-139 = "아니에요……. 아닙니다. 치세 쨩. 저는 아직 쓰러질 수 없어요. 적어도 이 일을 제대로 마무리하기 전까지는……."
10033005-140 = "백귀야행의 좋은 점을……! 하나라도 더, 게헨나 학원 여러분들께 알리기 전까지는……!"
10033005-141 = "그래, 그래. 바로 그 자세야~ 카호."
10033005-146 = "그러면 니야 님. 저는 지금부터 백화요란 분쟁조정위원회로 향하겠습니다."
10033005-147 = "음? 그건 좋지만, 수학여행 준비는~?"
10033005-148 = "게헨나 학원 여러분들이 방문하기까지는 어느 정도의 말미가 있지만……."
10033005-149 = "게헨나 학원의 선도부원분들이 도착하는 것은, 바로 내일이라고 하는군요."
10033005-150 = "따라서 백화요란과의 실무협의체는 오늘 오후에 당장 발족하여야 하며, 지금 가장 시급한 일은 그것입니다."
10033005-151 = "하, 하지만 다른 일들도 어쨌든 추진되어야 하지 않을까~? 그런 생각을 해 보기도 하고~?"
10033005-153 = "본디 손님맞이는 저희 음양부가 담당해야 할 일!"
10033005-155 = "그러면, 니야 님! 제가 실무협의체를 구성하고 발족하는 동안……. 나머지를 부탁드리겠습니다!"
10033005-160 = "정말 카호는 성실하다니까안~."
10033005-161 = "음~ 괜찮아–?"
10033005-162 = "흠흠. 괜찮고 말고~ 카호도 이렇게 힘을 내주는 만큼! 여기서부터 우리도 성실히 임하는 것이 정석……! 이겠지만."
10033005-163 = "역시 그건 재미없지. 치세~?"
10033005-164 = "재미없어?"
10033005-165 = "이야기란 언제나 의외의 장면, 상상치 못한 구성, 기대를 뛰어넘는 전개가 있어야, 비로소 활기를 띠고 재미있어지는 법이니까~"
10033005-166 = "여기에선 이번 이벤트가 좀 더 공정한 방법으로, 흥을 돋우고 재미있어지는 방향으로 나아가도록……."
10033005-167 = "재미있어져라~"
10033005-168 = "응. 어디 그쪽으로 진행해 볼까아~? 냐하핫."
