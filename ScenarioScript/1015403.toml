[translation]
1015403-1 = "수집가의 고민"
1015403-2 = "(마나미를 만나기 위해 와일드헌트의 예술 평의회실로 향했다.)"
1015403-7 = "어서 오세요, 선생님."
1015403-8 = "선뜻 협력해 주셔서 감사합니다."
1015403-9 = "[s1] \"마나미 혼자야?\"\n[s2] \"다른 평의회 임원들은?\""
1015403-12 = "없습니다. 개인적인 안건이라서요. #n저번에 말씀드렸던 '예술품 전시' 관련입니다만……."
1015403-13 = "제 <개인 박물관>에 대한 이야기입니다."
1015403-14 = "선생님께서도 아시다시피, 저는 다양한 예술품을 저만의 박물관에 보관하고 있습니다."
1015403-15 = "그러다 최근 큰 문제에 봉착했어요."
1015403-16 = "요즘 들어 부쩍 늘어나는 예술품 때문에 더 이상……."
1015403-17 = "전시 공간이 없다는 겁니다!"
1015403-21 = "처음엔 학원의 수장고에 잠시 보관하면 어떨까 했습니다만……."
1015403-22 = "개인 물건을 학원 수장고에 둘 수는 없다며 평의회 회의에서 기각당했습니다."
1015403-24 = "사용하지 않는 다락방을 새로운 개인 박물관으로 개조하려고도 했습니다만……."
1015403-25 = "생각보다 예산이 많이 필요하다며, 마찬가지로 평의회 회의에서 기각당했습니다."
1015403-27 = "물론 강제로 집행한다면 가능이야 하겠습니다만……."
1015403-28 = "개인적인 일을 억지로 추진했다가 반대 세력에게 트집거리를 던져 주는 건 싫군요."
1015403-29 = "[s] \"마나미의 반대 세력……?\""
1015403-30 = "네. 이 학원엔 저를 견제하는, 일명 <그림자 조직>이 있답니다."
1015403-31 = "워낙 은밀하게 행동하는 터라 세력의 규모도, 리더의 정체도 미궁 속이죠."
1015403-32 = "아마 제가 추적 중인 <도둑고양이>와 연관이 있는 조직이라 생각합니다만……."
1015403-33 = "……뭐, 이것이 전부 저의 망상이라 생각하는 임원도 있습니다."
1015403-34 = "하지만…… 아니요. 저는 느낄 수 있답니다."
1015403-35 = "꿈틀꿈틀 기분 나쁘게 어둠 속을 기어다니며, 학원의 위생을 더럽히는 벌레 같은 놈들이."
1015403-36 = "만약 붙잡는다면 평생 곤충용 젤리만 먹는 형벌을 내려야……."
1015403-39 = "……아. 이런. 실례했습니다. 저도 모르게 언사가 거칠어졌군요."
1015403-40 = "아무튼 나름 복잡한 사정이 있기에, #n제 마음대로 학원 수장고를 사용하거나 개인 박물관을 증축할 수는 없는 일."
1015403-41 = "후우, 역시 수집가의 가장 큰 고민은 부동산이군요."
1015403-42 = "혹시 선생님께서는 좋은 방안을 가지고 계실까요?"
1015403-43 = "[s3] \"공간이 부족한 거니까…….\"\n[s4] \"일부 수집품을 판매하거나 기증한다면?\""
1015403-46 = "……네?"
1015403-47 = "진심입니까?"
1015403-48 = "[s] \"……은 당연히 안 되겠지!\""
1015403-49 = "그렇습니다. 하나하나 전부 저의 마음이 담겼는데, 그 소유권을 타인에게 넘길 순 없어요."
1015403-50 = "신뢰하는 사람이 관리하는 공간에 일시적으로 대여하는 것 정도가 한계일 것 같군요."
1015403-51 = "[s5] \"음, 그럼 샬레의 공간을 활용해 볼래?\"\n[s6] \"임시 대여 형태로 보관하는 거야.\""
1015403-54 = "저의 예술품을…… 선생님이 계신 샬레에?"
1015403-57 = "흐음……."
1015403-58 = "일단 말씀은 감사합니다만, 확답을 드리기가 힘들군요."
1015403-59 = "실례가 안 된다면 지금 당장 샬레를 방문해도 괜찮겠습니까?"
1015403-60 = "그곳이 저의 수집품이 있기에 걸맞은 장소인지 확인해 보고 싶습니다."
1015403-61 = "[s] \"지금 당장……?\""
1015403-62 = "네. 지금 당장입니다."
1015403-64 = "(결국 마나미에게 붙잡혀 샬레로 가게 되었다…….)"
1015403-73 = "[ns] \"자! 내 사무실에 어서 와!\""
1015403-74 = "흐음……."
1015403-75 = "설마 이곳에 제 예술품을 보관하겠다는 말씀은 아니시겠죠?"
1015403-76 = "[s] \"여긴 넓으니 공간 활용이 가능하지 않을까?\""
1015403-77 = "하아아……."
1015403-78 = "선생님. 혹시 예술품을 보관할 때 신경 써야 하는 4대 요소를 아시나요?"
1015403-79 = "만약 알고서 그런 말씀을 하셨다면, #n선생님과의 협력 관계를 진지하게 고민해 봐야 한다고 생각합니다."
1015403-80 = "[s7] \"어…… 4대 요소?!\"\n[s8] \"머, 먼지 안 쌓이게 밀폐된 곳에 잘 보관하면…….\""
1015403-83 = "……그러실 줄 알았습니다."
1015403-84 = "온도, 습도, 빛, 오염 차단. #n이것이 예술품의 보관에 신경 써야 하는 4대 요소입니다."
1015403-85 = "이곳은 채광이 지나치게 잘 되어 조도 관리가 매우 힘들어 보이는군요."
1015403-86 = "여기에 제 소중한 피규어를 둔다면, 자외선에 의한 변색으로 예술적 가치가 하락할 겁니다."
1015403-87 = "[s] \"그렇구나…….\""
1015403-90 = "[ns9] \"응? 잠깐. 피규어?\"\n[ns10] \"보관하려는 예술품이 피규어였어?\""
1015403-93 = "전부는 아니지만 포함되어 있답니다. #n피규어도 훌륭한 예술품이니까요."
1015403-94 = "피규어를 바라보며 좋아하는 작품에 대한 감상과 선율을 떠올릴 수 있죠."
1015403-95 = "이것은 훌륭한 감각의 예술입니다."
1015403-96 = "설마…… 이해 못 하시나요?"
1015403-97 = "[s] \"아닙니다! 이해합니다!\""
1015403-98 = "네. 그렇다면 다행입니다."
1015403-99 = "그럼 다른 곳을 살펴보도록 하죠."
1015403-100 = "부디 이곳보다 나은 장소가 있길 바라겠습니다."
1015403-102 = "(그렇게 마나미와 샬레 곳곳을 살펴보기 시작했다…….)"
1015403-111 = "(아무래도 마음에 드는 장소가 없는 것 같았다.)"
1015403-112 = "(그렇게 마지막으로 찾아간 곳은…….)"
1015403-114 = "[ns] \"여, 여기는 어떨까?\""
1015403-115 = "오호, 이곳은……?"
1015403-120 = "다소 정리가 되지 않은 느낌이 있긴 합니다만…… 꽤 훌륭하군요?"
1015403-121 = "처음부터 물건을 보관하기 위해 설계된 장소로 보입니다."
1015403-122 = "먼지와 벌레의 유입을 막는 밀폐된 구조. 광도 조절이 가능한 조명."
1015403-123 = "거기에 온도와 습도 조절 장치까지."
1015403-124 = "이곳이라면 저의 추억이 담긴 피규어들을 보관해도 부족함이 없겠어요."
1015403-125 = "[s] \"다, 다행이네…….\""
1015403-126 = "그럼 이곳에 임시 수장고를 만들도록 하겠습니다."
1015403-127 = "협력해 주셔서 정말 감사합니다."
1015403-129 = "(그리고 바로 다음 날…….)"
1015403-140 = "(마나미의 신속한 지휘 아래, 이곳에 임시 수장고가 만들어졌다.)"
1015403-143 = "평의회장님! 작업 완료하였습니다!"
1015403-144 = "네. 모두 수고하셨습니다."
1015403-145 = "약속대로 작업을 도와주신 여러분께는 특별 외출권을 발급해 드리죠."
1015403-146 = "오오! 감사합니다!"
1015403-148 = "이곳에 보관할 예술품은 제가 직접 옮기겠습니다."
1015403-149 = "하나하나 소중한 작품이기에, 신중해야 하거든요."
1015403-150 = "한 번에 옮길 수 있는 양이 적다 보니 생각보다 자주 샬레에 방문할 것 같습니다만……."
1015403-151 = "선생님이라면 이해해 주실 거라 믿습니다."
1015403-152 = "[s] \"으, 으응! 문제없어! \""
1015403-153 = "부디 영광으로 생각해 주시길."
1015403-154 = "아무에게나 저의 소중한 예술품을 맡기진 않으니까요."
1015403-155 = "[s] \"그런데…… 정말 괜찮아? 소중한 걸 여기에 보관해도?\""
1015403-156 = "떨어져 지낸다는 것이 아쉽긴 합니다만……."
1015403-157 = "괜찮습니다. 이걸로 저는 언제 샬레를 방문해도 이상하지 않다는 개연성을 얻었으니까요."
1015403-158 = "이렇게 가까워진 샬레와의 관계를 내세워, 학원 내의 권력을 한층 더 키울 수 있겠죠."
1015403-159 = "후후, 두고 보시죠."
1015403-160 = "언젠가 저에게 저항하는 세력을 모두 붙잡아, 평생 개다래 열매만 먹는 형벌을……."
1015403-161 = "[s] (서, 설마…… 처음부터 이게 목적이었나…….)"
1015403-164 = "아, 참. 그러고 보니…… 답례의 이야기를 하지 않았군요?"
1015403-165 = "평의회장인 제가 샬레의 공간을 무상으로 대여할 수는 없는 일."
1015403-166 = "자. 무엇이든 원하는 것을 말씀하세요. 저도 선생님의 부탁을 하나 들어드리죠."
1015403-167 = "은밀하면 은밀한 것일수록 좋습니다."
1015403-172 = "이 기회에 털어놓는 거예요. 선생님의 비밀스러운 소원을."
1015403-173 = "저에겐 그 소원을 들어드릴 힘과 권력이 있답니다?"
1015403-174 = "[s] \"비밀스러운 소원 같은 건 없습니다만!\""
1015403-175 = "후후, 아직은 말씀하실 기분이 아닌 것 같군요."
1015403-180 = "뭐, 부탁을 들어드리겠다는 마음은 진심이니…… 언제든 부담 없이 이야기해 주시길."
1015403-181 = "그럼 다음에 또 뵙도록 하죠."
1015403-183 = "(이후 한동안 마나미의 샬레 방문이 이어졌다.)"
1015403-184 = "(뭔가 이용당하는 느낌이 들긴 했지만…… 정신 차리고 있으면 괜찮겠지.)"
