[translation]
10039090-1 = "후일담;대책위원회는 무대에서"
10039090-9 = "(오늘은 사육제의 꽃, 아이돌 콘테스트의 리허설이 있는 날.)"
10039090-10 = "(학생들의 색다른 모습이 기대된다.)"
10039090-18 = "[ns1] \"아, 세리카.\"\n[ns2] \"무슨 일이야?\""
10039090-21 = "서, 선생님……!! 큰일이야!!"
10039090-27 = "(세리카의 다급한 연락을 받고 서둘러 대책위원회를 찾았다.)"
10039090-33 = "서, 선생님…… 와줬구나……"
10039090-34 = "[s] \"무슨 일이길래 그래?\""
10039090-35 = "아야네가……"
10039090-39 = "아야네가 사라졌어!"
10039090-40 = "[s] \"으응???\""
10039090-45 = "으헤~ 곧 리허설 시간인데…… 곤란하다구."
10039090-46 = "연락도 받지 않고…… 무슨 일이라도 있는 게 아닌지 걱정되네요."
10039090-47 = "세리카 때의 사건도 있고……"
10039090-52 = "아니, 그때랑은 상황이 좀 다르잖아!"
10039090-53 = "이 아저씨의 감으로는 딱히 그런 건 아니겠지만 말야……"
10039090-54 = "하아, 이곳저곳 찾아봤지만 아직 발견 못 해서……"
10039090-55 = "선생님이라면 알고 있지 않을까 해서 도움을 요청한 거야."
10039090-56 = "[s] \"일단 짐작 가는 곳부터 함께 찾아보자!\""
10039090-57 = "……응!! 부탁해, 선생님! 시간이 별로 없거든."
10039090-66 = "(아야네가 있을 만한 곳을 얼마나 찾았을까.)"
10039090-76 = "[ns] \"아야네.\""
10039090-77 = "……"
10039090-84 = "서, 선생님?"
10039090-85 = "선생님이 어떻게 이곳에……"
10039090-86 = "[s3] \"여기 있었구나.\"\n[s4] \"괜찮아?\""
10039090-89 = "서, 선생님……"
10039090-96 = "헉, 헉…… 아야네! 찾았다!"
10039090-97 = "앗, 아야네 쨩…… 여기 있었군요. 다행이다."
10039090-98 = "이거 참. 갑자기 사라져서 걱정했다고?"
10039090-99 = "응, 다친 곳은 없어 보이네."
10039090-101 = "세, 세리카 쨩…… 모두들……"
10039090-102 = "왜 혼자 여기에 있어, 아야네? 말도 안 하고 사라져서 놀랐다고."
10039090-106 = "으…… 으흑……"
10039090-110 = "아, 아야네?"
10039090-111 = "무, 무서워요……"
10039090-112 = "엥? 뭐가?"
10039090-113 = "……가……"
10039090-115 = "응?"
10039090-122 = "……무대가…… 너무 커요……!!"
10039090-130 = "아, 아까 올라가 봤을 때…… 무대가 너무 컸어요……"
10039090-131 = "관객석도 엄청 많고…… 사, 상상했던 것보다 너무 큰 무대예요……"
10039090-132 = "그야 거대 학원 중에서도 가장 큰 무대라잖아! 당연하지!"
10039090-133 = "이, 이렇게 클 줄은 몰랐다고요!"
10039090-135 = "하, 하긴…… 평소 눈에 띄는 걸 별로 좋아하지 않는 아야네 쨩이니까……"
10039090-136 = "……어떻게 해결해야 할지 알 수 없는 문제네."
10039090-138 = "어, 어떡해! 나 안무 까먹은 부분 있어서 아야네가 리드해줘야 한단 말이야……!"
10039090-139 = "아야네가 추는 거 곁눈질로 몰래 보면서 따라 하려고 했는데……!!"
10039090-140 = "죄, 죄송해요……! 제대로 해낼 자신이 없어요……"
10039090-141 = "저곳에 선다고 생각하니 머리가 하얗게 되고…… 눈앞이 흐려지고 숨이 가빠져서……"
10039090-142 = "저, 저 때문에 계획이 망가지면…… 어떻게 하죠……"
10039090-143 = "[s] \"계획……?\""
10039090-145 = "이번 아이돌 콘테스트의 우승 상금을 타내서, 학교의 빚도 갚고 부실한 선풍기도 새것으로 교체하려는 원대한 계획이야!"
10039090-146 = "응. 꿈과 돈은 많을수록 좋으니까. 우리는 처음부터 우승을 노리고 있었어."
10039090-147 = "세리카 쨩과 아야네 쨩, 이 둘이라면 충분히 가능하다고 생각했거든요☆"
10039090-149 = "그, 그 원대한 계획이 저 때문에…… 으흑……"
10039090-150 = "우승 상금이라고 해도 격려금 정도지. 그렇게 거액은 아니라구……"
10039090-155 = "아니었어……?"
10039090-157 = "그, 그치만…… 그래도……"
10039090-158 = "이 무대는 호시노 선배와의 약속이기도 했는데…… 으앙……"
10039090-160 = "그거, 신경 쓰고 있었구나……"
10039090-161 = "이, 일어서 봐! 아야네! 주저앉아 있으면 더 기운이 빠진다니까!"
10039090-162 = "으음…… 눈을 가리면 어때? 객석도 관객도 안 보이게."
10039090-164 = "장점보다 단점이 더 클 것 같네요……. 움직임에도 제약이 생기고, 실수할 가능성도 높아지니까요."
10039090-165 = "그리고 그렇게 큰 무대에서는 보이는 것만 문제가 아니라, 몸에 전해지는 공기 자체가 다르니…… 지금의 아야네 쨩은 아마 그 분위기에 압도된 상태라고 생각해요."
10039090-166 = "막상 이 아저씨도 그런 무대에 서본 적은 없으니까 말이지~"
10039090-167 = "아야네 쨩이 느끼고 있을 중압감과 부담감을 조금 덜어줘야 할 텐데……"
10039090-168 = "선생님, 좋은 방법 없을까요?"
10039090-175 = "[ns] \"아야네, 잠깐 괜찮아?\""
10039090-177 = "선생님……"
10039090-178 = "[s5] \"익숙하지 않은 경험일 거야. 나도 잘 알아.\"\n[s6] \"남들 앞에 선다는 게 쉬운 일은 아니니까.\""
10039090-181 = "네에…… 작은 교실에서 연습할 때는 몰랐는데…… 실제 무대는 전혀 달랐어요……"
10039090-182 = "이, 이 많은 객석에 앉을 사람들이 모두 저를 본다고 생각하니까……"
10039090-183 = "심장이 두근거려서…… 긴장감이 엄습해 와서……"
10039090-184 = "[s] \"그럼, 이렇게 하면 어떨까?\""
10039090-189 = "[ns7] \"대책위원회 모두 객석에서 지켜볼 테니까,\"\n[ns8] \"우리에게만 시선을 집중하는 거야.\""
10039090-194 = "예, 예?!"
10039090-195 = "[s9] \"왜, 집중하면 시야가 좁아진다고 하잖아?\"\n[s10] \"그렇게 되면 주변의 관객들에게는 상대적으로 신경이 덜 쓰일 테고.\""
10039090-198 = "그, 그렇게…… 되려나요……?"
10039090-199 = "[s] \"응. 나도 거기에 같이 앉아 있을게.\""
10039090-200 = "선생님도……"
10039090-201 = "응. 한번 해볼 만하다고 생각해."
10039090-202 = "시로코 선배……?"
10039090-203 = "나도 뭔가에 극도로 집중할 때는 대상밖에 보이지 않는 경험을 자주 해봤어."
10039090-204 = "가령 드론을 조종해서 환풍구에 숨어들 때라든지, 은행의 경비원 순찰 주기를 파악할 때라든지……"
10039090-205 = "예, 예시들이 좀 이상하긴 하지만…… 사실이라면 나름 괜찮은 방법일지도……"
10039090-211 = "아야네! 일단 해보는 거야!!"
10039090-215 = "지금은 어차피 리허설이잖아? 실수해도 본무대가 남아있으니까……!"
10039090-216 = "세리카 쨩……"
10039090-217 = "우리, 처음에는 비록 자의가 아니었지만…… 그동안 최선을 다해서 연습했잖아?"
10039090-218 = "그 노력들이 수포로 돌아가면 정말 아쉬울 거야."
10039090-219 = "선생님이 말해준 방법대로 해보자. 그러고도 안 되면, 그 뒤에 생각하자."
10039090-225 = "할 수 있는 데까지는 해봐야지! 그거야말로 우리가 가장 잘하는 거잖아!!"
10039090-232 = "……"
10039090-233 = "으응……! 알겠어요!"
10039090-235 = "아야네 쨩!"
10039090-236 = "세리카 쨩의 말대로, 이제 와서 포기할 수는 없어요."
10039090-237 = "무대가 아무리 크다 한들, 너무나 많은 관객들이 두렵고 긴장된다 한들……"
10039090-241 = "그간 우리가 흘린 피와 땀, 눈물이 있으니까요!"
10039090-242 = "피까지는 잘 모르겠지만 말이야……"
10039090-243 = "이 무대에서 저희가 가진 모든 것을! 폭발시키고 말겠어요!!"
10039090-247 = "아니! 리허설이니까! 여기서 폭발시키면 안 된다고! 본무대에서는 어쩔 셈이야?!"
10039090-252 = "으헤~ 귀여운 후배가 드디어 기운을 차린 모양이네~"
10039090-253 = "의욕이 솟아난 것 같아서 다행이에요, 정말."
10039090-255 = "응. 할 수 있어. 이 기세라면."
10039090-259 = "적어도 객석의 절반 정도는 길동무로 데려가는 거야!"
10039090-261 = "감동시킨다는 말이죠? 시로코 쨩."
10039090-262 = "자, 그럼 준비를 마무리하러 가자고."
10039090-267 = "네…… 이제 더 이상 흔들리지 않겠어요."
10039090-268 = "모두…… 객석에서 지켜봐 주세요!"
10039090-269 = "[s11] \"응. 우리가 계속 지켜보고 있을게.\"\n[s12] \"잘할 수 있을 거야, 아야네.\""
10039090-272 = "후후, 감사해요……"
10039090-276 = "세리카 쨩, 아까 말했던 안무 까먹은 부분 어디야? 한 번 더 같이 연습해 보자!"
10039090-281 = "앗, 으응! 어, 어디냐면……"
10039090-283 = "자아, 그럼 모두 리허설 무대로 이동해볼까요☆"
10039090-290 = "(처음에는 객석에 시선을 고정하고 있던 아야네지만, 막상 무대가 시작되니 점점 긴장이 풀리는 게 보였다.)"
10039090-291 = "(무대와 객석의 거리가 생각보다 멀어 서로가 작게 보였지만,)"
10039090-297 = "(아야네와 세리카의 멋진 무대에는 아무런 영향도 끼치지 않았다.)"
