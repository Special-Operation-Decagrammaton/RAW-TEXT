[translation]
10023110-1 = "에필로그;해피 엔딩, 절찬리 판매 중!"
10023110-5 = "……"
10023110-6 = "……"
10023110-7 = "히익……"
10023110-9 = "으아앙! 으아앙! 네루 선배가 화난 겁니다! 아리스는 무섭습니다!"
10023110-11 = "저기 말이다, 너희들……"
10023110-12 = "미안해, 네루 선배!"
10023110-13 = "앙? 뭐, 뭐가."
10023110-14 = "그걸 일일이 내 입으로 말하게 할 생각이야? 너무해, 선배!"
10023110-15 = "좀 전에는 미안하다고 해 놓고 이번엔 너무하다냐…… 너도 참 바쁘구만."
10023110-16 = "다른 모두도! 미안해! 내가…… 내가 애초에 그런 짓만 안 했어도…… 의뢰고 뭐고 처음부터 거절하거나 도망치기만 했어도……!"
10023110-17 = "이제 끝이야…… 네루 선배한테 엄청나게 혼나고, 박살 나고…… 게임개발부는 폐부되겠지…… 다른 동아리를 사칭한 거라서 정상 참작도 없어……"
10023110-18 = "흐윽…… 간신히 지킨 부실인데…… 어떻게든 아리스도 유즈도 함께할 수 있게 되었는데……!"
10023110-20 = "모모이……"
10023110-21 = "우, 울지 마십시오. 모모이. 아리스는……"
10023110-22 = "아리스는 괜찮습니다. 떨어져 있게 되어도, 함께일 수 있습니다. 아리스는 그것을 배웠습니다……!"
10023110-24 = "어…… 너희들, 뭔가 좀 착각하고 있는 모양인데……"
10023110-25 = "난 아직 아무 말도……"
10023110-26 = "아니, 그보다 나 이런 이미지였냐?!"
10023110-27 = "후후, 그건 어떨까요?"
10023110-28 = "넌 또 왜 다 자업자득이라는 표정을 짓는 거냐고!"
10023110-30 = "죄송합니다. 선배님들."
10023110-31 = "증거품인 왕관을 확보했지만, 정작 용의자를 놓치고 말았군요."
10023110-33 = "아니, 그러니까 그건 우리가 여기 잡아 왔으니까 말이지……"
10023110-34 = "이런 일에 선배님들의 손을 쓰게 해 드려서 죄송하다는 말이었습니다."
10023110-35 = "뭘 그런 걸 신경 쓰고 그래. 끝이 좋으면 다 좋은 거지. 어차피 다 알고 왔다고."
10023110-36 = "그리고……"
10023110-41 = "너희들."
10023110-46 = "히익?!"
10023110-47 = "사, 살려만 주세요……!"
10023110-49 = "잠시만 기다려 주십시오. 네루 선배."
10023110-50 = "아앙?"
10023110-51 = "이번 일…… 너무 게임개발부를 나무라지 말아 주셨으면 합니다."
10023110-52 = "호오?"
10023110-53 = "게임개발부에게 책임이 있다면, 저에게도 책임이 있습니다."
10023110-54 = "원래대로라면 서둘러 선배들께 알리고, 지원을 기다렸어야 했지만, 저는 그렇게 하지 않았습니다."
10023110-55 = "그것은 게임개발부와 제가 동료…… 나아가 친구로서 함께 행동했기 때문이었습니다."
10023110-56 = "그러니 적어도, 함께 책임을 지게 해 주십시오."
10023110-58 = "그, 그렇습니다. 네루 선배! 토키와 아리스는 동료입니다. 친구입니다!"
10023110-59 = "친구가 어려울 때는 서로 도와야 하는 법이라고 게임에서 배웠습니다. 그래서, 그래서……"
10023110-61 = "아니, 그러니까 난 그런 말을 하려던 게 아니라……"
10023110-62 = "그 뭐냐……"
10023110-63 = "잘했다고."
10023110-68 = "어……? 네루 선배, 정말 괜찮아?"
10023110-69 = "헉?! 혹시 네루 선배 모습을 한 도플갱어 같은 건 아니지?!"
10023110-71 = "뭔 소릴 하는 거야!"
10023110-72 = "정말이지, 사람이 칭찬 좀 해주려는 데도 이렇게 번거로우니……"
10023110-74 = "저…… 정말 괜찮으신…… 건가요?"
10023110-75 = "아앙?"
10023110-79 = "결국 C&C의 이름으로 사건 하나가 끝난 거잖냐."
10023110-80 = "그러면 됐지, 뭐. 용의자 녀석도 잡았고, 증거품도 확보했고."
10023110-81 = "나머지는 이것들을 싹 발키리에 넘기면 되는 거 아냐?"
10023110-86 = "(네루 선배…… 키와는 달리 역시 통이 클지도……)"
10023110-87 = "(언니! 말조심해! 들리면 어떡하려고!)"
10023110-93 = "음, 그리고 너 말이다. 토키. 너……"
10023110-94 = "네. 어떤 처분이든 달게 받아들이겠습니다."
10023110-95 = "아니, 그런 이야기가 아니라…… 아, 거, 참!"
10023110-96 = "우선 말이야, 왜 바니걸이야?"
10023110-97 = "C&C의 잠입 정복이기 때문입니다."
10023110-101 = "……하아."
10023110-102 = "내가 그래서 그때 입기 싫다고 한 건데……"
10023110-104 = "응? 왜 그래, 부장?"
10023110-105 = "잘 어울리고 좋았는데! 아하하! 토키 쨩도 잘 어울려!"
10023110-110 = "감사, 합니다……"
10023110-111 = "아무튼!"
10023110-112 = "음. 내가 말하고 싶은 건……"
10023110-114 = "네. 근신, 자숙, 반성, 감금. 무엇이든 마음의 준비는 되어 있습니다."
10023110-115 = "그러니까!"
10023110-116 = "아, 정말 못 해 먹겠네……"
10023110-117 = "[s1] \"네루는 토키에게도 칭찬해 주고 싶은 거야.\"\n[s2] \"그리고 토키를 빼놓고 작전을 나간 것을 사과하고 싶은 거고.\""
10023110-121 = "서, 선생?!?!"
10023110-122 = "망할…… 선생이 있다는 걸 깜빡하고 있었어……!"
10023110-124 = "그건, 무슨 말씀이신지……?"
10023110-125 = "아─ 진짜! 그러니까!"
10023110-129 = "……잘해 줬다. 그리고…… 미안했다."
10023110-130 = "그, 뭐냐. 너 혼자 내버려 두려고 한 거 아니었으니까 말이지."
10023110-131 = "이번엔 정말 어쩌다, 이렇게 된 것뿐이고. 그런데도 이렇게 마지막까지 잘 마무리해 줬으니까."
10023110-132 = "그, 수고했다고. 그런 거다."
10023110-134 = "그런 거예요. 토키 쨩. 부장님은 이럴 때 솔직하지 못하니까요."
10023110-135 = "넌 또 왜 한 마디를 더 거드는 거냐고!"
10023110-136 = "그렇대, 토키 쨩! 잘 됐다!"
10023110-142 = "감사합니다. 선배님들."
10023110-144 = "지쳤어…… 고생은 고생대로 하고, 얻은 건 아무것도 없고."
10023110-145 = "꼭 그런 것만은 아니지 않아? 차기작에 대한 아이디어는 얻었잖아."
10023110-146 = "차기작……?"
10023110-147 = "아, 그래. 아이디어라면 넘치게 얻긴 했지……"
10023110-148 = "[s] \"발키리에서 받을 포상금도 마음대로 쓸 수 있을 거고.\""
10023110-149 = "어? 포상금이라니, 무슨 말이야? 그런 이야기 처음 들어. 선생님."
10023110-150 = "[s3] \"나도 몰랐는데, 우리가 되찾은 장물들에.\"\n[s4] \"포상금이 걸려 있었다고 하더라고.\""
10023110-153 = "퀘스트 완료 보상이라는 거군요! 금고에 자금이 늘어났습니다! 뽜밤뽜밤!"
10023110-156 = "아! 그렇다면 받은 포상금으로 여, 역시 신형 게임기를……!"
10023110-157 = "그것보다는 좀 더 나은 사용처가 있지 않을까, 언니?"
10023110-158 = "왜애! 우리는 게임개발부라고! 게임개발부가 게임에 투자하지 않으면 어디에 투자한단 말이야!"
10023110-160 = "아리스, 생각이 있습니다!"
10023110-161 = "게임개발부의 부장은 유즈입니다! 그러니까 유즈에게 결정하게 하는 겁니다!"
10023110-167 = "내게…… 생각이 하나, 있어……"
10023110-168 = "어? 뭔데, 뭔데?"
10023110-169 = "이걸……. 차기작의 개발비로 쓰고 싶어."
10023110-170 = "차기작의 개발비……?"
10023110-172 = "……그리고 보면 세미나에서 받은 R&D 비용이 거의 다 떨어져 가고 있기는 했지……"
10023110-173 = "과연 유즈입니다!"
10023110-175 = "우리가…… 여기에서 얻은 경험을 살리면……"
10023110-176 = "제법 좋은 게 나올지도…… 몰라."
10023110-178 = "아, 나 그럼 아이디어 있어!"
10023110-179 = "들어 봐, 그러니까─"
10023110-180 = "아이디어가 있으면 기획서부터 써 줬으면 해. 언니."
10023110-181 = "켁, 난 생각을 기획서로 표현하는 것에 약하단다, 동생이여."
10023110-182 = "시나리오 라이터 겸 기획자가 그걸 못하면 어떡해!"
10023110-184 = "돌아가면…… 곧바로 코딩 준비를 해야겠네……"
10023110-186 = "기다려! 지금 머리에서 아이디어가 넘치고 있다고!"
10023110-187 = "이걸 좀 정리하기 위해서…… 게임부터 하지 않을래?"
10023110-188 = "딴 짓 금지! 언니의 속셈을 모를 줄 알아?"
10023110-190 = "아리스는 언제나 준비되어 있습니다!"
10023110-192 = "다들 기운 넘치네…… 후후……"
10023110-197 = "(모두가 왁자지껄하게 떠들어대기 시작했다.)"
10023110-198 = "(밤은 점점 깊어 갔지만, 모두에게 그런 건 그다지 중요한 사실이 아닌 것처럼 보였다.)"
10023110-200 = "(그래서……)"
10023110-204 = "[ns] \"모모이.\""
10023110-205 = "응? 왜 그래, 선생님?"
10023110-206 = "[s] \"진짜 엄청난 소동이었네…….\""
10023110-207 = "응, 그러게……"
10023110-208 = "한때는 정말 어떻게 되는 줄 알았지만…… 으으……."
10023110-209 = "그래도 말이야!"
10023110-210 = "[s] \"응……?\""
10023110-211 = "유즈도, 미도리도, 아리스도! 거기다 토키까지!"
10023110-212 = "모두 다 함께 겪었던 이번 일, 엄청 즐거웠어!"
10023110-213 = "선생님은 어때?"
10023110-214 = "[s] \"응, 나도 즐거웠어.\""
10023110-215 = "응!"
10023110-220 = "(모모이와 게임개발부의 미소는, 그 어느 때보다도 힘차 보였다.)"
10023110-225 = "\"……응. 너는 여전히 내 학생이야.\""
10023110-233 = "……"
10023110-237 = "\"……응. 너는 여전히 내 학생이야.\""
10023110-238 = "……선생님."
10023110-242 = "\"……응. 너는 여전히 내 학생이야.\""
10023110-243 = "하아……"
10023110-244 = "숨이 뜨거워요. 가슴이 조여와요. 심장이 터질 듯이 뛰어요."
10023110-245 = "그런데도 고통스럽지 않고, 오히려 행복하기까지 하네요."
10023110-246 = "어째서일까요. 선생님은 답을 알고 계세요?"
10023110-247 = "……"
10023110-248 = "훔치지 못할 것은 없고, 소중한 것은 모두를 위해."
10023110-249 = "우리는 이름을 갖고 태어나지 못하니, 인생이란 선택을 향해 나아가는 과정."
10023110-250 = "다음에 또다시, 언젠가."
10023110-256 = "달라진 모습으로 찾아 뵙겠습니다."
10023110-259 = "순백의 예고장 ~허식의 저택과 미학이 머무는 곳~"
