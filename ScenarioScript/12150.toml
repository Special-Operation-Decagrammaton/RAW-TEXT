[translation]
12150-1 = "제15화;아비도스 공방전 2"
12150-3 = "크, 크으으윽-!!"
12150-4 = "무, 무슨! 네놈들! 감히!! 기르던 개 주제에!"
12150-6 = "시, 시끄러워!! 무슨 상관이야! 네 녀석보다 선생님 쪽이 훨씬 동업하기 편하거든?"
12150-7 = "아하하하- 고용주의 뒤를 찌른다, 이거야 말로 진정한 악당의 모습이잖아! 그정도는 예측했어야지!"
12150-9 = "흥신소 분들……."
12150-10 = "그래. 저 말이 맞아."
12150-11 = "……네. 덕분에 정신이 들었어요. 지금 우리가 이렇게 망설이고 있을 시간이 없어요."
12150-12 = "그래! 호시노 선배가 있어! 호시노 선배를 되찾아야 해!!"
12150-13 = "비공인이니, 뭐니 그런 건 상관없어! 비록 우리가 불법 조직이 되더라도, 호시노 선배를 구하지 않으면……."
12150-15 = "호시노 선배를 구하는 것이 가장 중요해. 지금은 그것 말고는 어떤 것도 생각할 필요가 없어."
12150-16 = "네놈들-!! 이런 저항에 무슨 의미가 있다는 거냐! 감히……!!"
12150-17 = "[s] \"너희는 나의 소중한 학생을 납치했다.\""
12150-18 = "!!"
12150-19 = "[s] \"돌려줘야겠어. 호시노 쨩을.\""
12150-20 = "웃기지 마라! 선생! 네놈이 이럴 권리 따윈……."
