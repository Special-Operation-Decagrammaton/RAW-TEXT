[translation]
90000100-1 = "제11화;케테르 공략"
90000100-2 = "준비되셨죠, 여러분?"
90000100-3 = "응. 준비 완료."
90000100-4 = "곧 케테르가 이쪽으로 올 거예요. 조우 즉시 준비한 대로 작전을 실행, 녀석과 전투를 시작합니다."
90000100-5 = "계획이 성공한다면 케테르를 최소 12시간 동안은 무력화시킬 수 있을 거예요."
90000100-6 = "그러면 우리는 케테르가 지키고 있던 폐허의 <연구지구>로 진입하는 거고."
90000100-7 = "네. 그렇죠."
90000100-11 = "케테르가 오고 있네요. 그럼, 작전 시작합니다!"
90000100-12 = "[s] \"좋아. 해보자고.\""
