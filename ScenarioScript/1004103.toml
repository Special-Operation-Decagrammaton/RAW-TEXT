1004103-45 = "푸헹취-!"
1004103-46 = "푸헤잉-!"
1004103-47 = "후엣취, 푸엣취-!!"
1004103-48 = "[s] \"…….\""
1004103-49 = "……. 크, 꼬, 꽃가루가 너무 많아, 여기……."
1004103-50 = "[s] \"미사키 지금…….\""
1004103-51 = "아, 알레르기가……. 응?"
1004103-52 = "[s] \"미사키의 코에서 콧물이…….\""
1004103-53 = "……어?"
1004103-54 = "으, 으아아아아아아아아아?!!"
1004103-55 = "자, 잠깐만…… 티, 티슈가……? 흐, 흐르잖아, 어디 닦을 것이……?!"
1004103-56 = "[s3] \"자, 잠깐만! 기다려 봐!\"\n[s4] \"손수건이라면 여기 있어!\""
1004103-63 = "(잠시 뒤…….)"
1004103-65 = "하아……."
