[translation]
1004103-1 = "통제 밖의 육체"
1004103-2 = "……."
1004103-3 = "[s] \"…….\""
1004103-4 = "어째서 다시 이렇게 된 거지……. 선생님을 만날 계획은 없었는데."
1004103-5 = "[s] \"그러게…….\""
1004103-6 = "이번엔 무슨 볼일인 거야?"
1004103-7 = "[s] \"딱히 볼일이 있는 건 아닌데…….\""
1004103-8 = "그럼 돌아간다."
1004103-9 = "[s] \"자, 잠깐만?!\""
1004103-10 = "……또 뭐야?"
1004103-11 = "[s] \"조금만 더 친목을 다지는 것도 괜찮지 않아?\""
1004103-12 = "무엇을 위해서?"
1004103-13 = "[s] \"어…… 이렇게 서로 알게 된 것도 인연이라면 인연인데…….\""
1004103-14 = "인연 같은 건 없어."
1004103-15 = "애초에 사람은 육체라는 고립된 섬 안에 갇힌 조난객일 뿐이야."
1004103-16 = "외롭게 태어나 외롭게 살다가 외롭게 죽는 것이고, 그게 인생의 정체."
1004103-17 = "그 사이를 잇는 실이라는 건 그저 사람들의 망상일 뿐이지."
1004103-18 = "[s] \"시니컬해…….\""
1004103-19 = "……."
1004103-20 = "……하아."
1004103-21 = "……그래, 마음대로 해."
1004103-22 = "그래서, 뭘 하면 되지?"
1004103-23 = "[s] \"어…… 응! 바람이라도 쐬러 갈까?\""
1004103-24 = "……."
1004103-25 = "……명령이라면."
1004103-27 = "……."
1004103-28 = "[s] \"꽃이네.\""
1004103-29 = "응. 꽃이네."
1004103-30 = "[s] \"강이야.\""
1004103-31 = "강이군."
1004103-32 = "[s] \"어…… 음.\""
1004103-33 = "……."
1004103-34 = "그냥 그뿐. 여기에 무슨 의미가 있는 거지?"
1004103-35 = "[s] \"그, 그러게…….\""
1004103-36 = "여기에 오래 있고 싶은 생각은 없으니까. (훌쩍) 명령이니까 왔을 뿐."
1004103-37 = "[s] \"그런데 마스크는 왜 쓰고 있는 거야?"
1004103-38 = "……. 아니. 조금. (훌쩍)"
1004103-39 = "[s1] \"마스크를 벗는 게 좋지 않아?\"\n[s2] \"신선한 공기를 마시는 거야.\""
1004103-40 = "아, 아니, 잠깐만…… 그것보다…… 가, 가까이 오지…… 에……."
1004103-41 = "아, 아니, 잠깐만…… 그것보다…… 가, 가까이 오지…… 에……."
1004103-42 = "에, 에…… 에……."
