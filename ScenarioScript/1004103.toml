1004103-67 = "……빨리 여기를 떠나자."
1004103-70 = "[ns] \"자. 음료수 사 왔어.\""
1004103-71 = "……고마워. 선생님."
1004103-72 = "하아……."
1004103-73 = "……육체 따위 최악이야."
1004103-74 = "[s] \"꽃가루 알레르기가 있었구나…….\""
1004103-75 = "……. 그래도 선생님 덕분에 최악의 상황은 면했어."
