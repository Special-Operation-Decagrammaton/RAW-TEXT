1004103-79 = "……애초에 원인을 제공한 게 선생님이었잖아."
1004103-80 = "당당한 것도 정도가 있지."
1004103-81 = "[s] \"죄송합니다…….\""
1004103-82 = "……."
1004103-83 = "그래도, 고마워……."
1004103-84 = "……손수건은, 세탁해서 돌려줄게."
1004103-85 = "[s] \"응? 아니, 그대로 돌려줘도 괜찮은데…….\""
1004103-86 = "……."
1004103-87 = "[s] \"아, 아닙니다……. 죄송합니다…….\""
1004103-88 = "하아."
