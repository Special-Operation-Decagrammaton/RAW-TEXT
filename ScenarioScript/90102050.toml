[translation]
90102050-1 = "제5화;말단과 간부"
90102050-5 = "실례합니다. 하이랜더 철도학원에서 나왔습니다."
90102050-6 = "저, 저는 제대로 열차표 갖고 있는데요?!"
90102050-7 = "아, 그러니까 검표를 하러 온 게 아니라……"
90102050-9 = "아, 걱정하지 마세요. 저희는 이 역의 역무원이 아니라 하이랜더 학원의 [ruby=CCC]중앙관제센터[/ruby]에서 나왔거든요."
90102050-10 = "최근 D.U. 열차를 이용하시면서 불편한 점은 없으셨는지, 고객만족도 조사를 실시하고 있었습니다."
90102050-11 = "말씀해 주신 내용은 역사 내 환경 개선에 적극 반영될 예정이니, 불편한 점이 있으셨다면 솔직하게 답변해 주세요!"
90102050-12 = "고객만족도라……"
90102050-13 = "……솔직하게 말한다고 해서 선로로 던져지거나 하는 건 아니겠죠?"
90102050-14 = "그럴 리가 없잖아?!"
90102050-15 = "(하이랜더 학생들은 왜 이렇게 열차 승객들에게 의심받고 있는 거지……)"
90102050-16 = "음. 열차 서비스 자체에는 문제가 없지만…… 열차 승무원들이 너무 불친절한 것 같아요."
90102050-17 = "친절한 학생도 가끔 있지만, 오래된 노선의 학생들은 승객들을 손님이 아니라, 뭔가 교정국에 들어온 죄수를 대하는 것처럼 굴어서……"
90102050-18 = "조금이라도 의심스러운 점이 보이면 바로 총을 꺼낸다니까요?"
90102050-19 = "그, 그 점은 곤란하겠네요……"
90102050-20 = "열차 이용에 불편을 드려 대단히 죄송합니다, 손님."
90102050-21 = "재발 방지를 위해 최근 겪었던 불편 사례를 구체적으로 알려주실 수는 없으실까요?"
90102050-22 = "음, 최근에 겪었던 일이라면……"
90102050-23 = "지난주에 퇴근이 늦어져서, 막차 시간에 아슬아슬하게 승강장에 도착한 적이 있었는데요."
90102050-24 = "그런데 눈앞에서 열차 문이 닫히기에, 문이 완전히 닫히지 않도록 갖고 있던 우산을 문틈으로 밀어 넣었거든요?"
90102050-25 = "그런데 이걸 본 역무원들이 문을 열어 주기는커녕, 오히려 열차에서 떨어지라며 총으로 협박을 하더라고요!"
90102050-26 = "그 문 하나 여는데 얼마나 걸린다고…… #n정말 너무한 거 아닌가요—"
90102050-30 = "우, 우왓?! 소, 솔직히 말해도 괜찮다면서요!"
90102050-31 = "아, 실례합니다. 무심코 손이 미끄러져서."
90102050-32 = "으음…… 손님. 마음은 이해하지만 열차 문 틈에 우산을 끼워 넣는 건 자제해 주세요."
90102050-33 = "열차 고장 및 안전 사고의 원인이 되니까요."
90102050-34 = "칫…… 융통성 없기는."
90102050-38 = "아, 아무 말도 안 했어요!"
90102050-39 = "그 외에 다른 불편 사항은 없으셨나요?"
90102050-40 = "예를 들자면 시간표에 맞지 않는 열차가 도착하는 걸 보았다던가……"
90102050-41 = "글쎄요. 하이랜더의 열차는 언제나 정시에 도착해서 그 점에 대한 불만은 없는 걸요."
90102050-42 = "오히려 가끔 시간을 맞춘답시고 말도 안 되는 속도로 폭주하는 경우는 본 것 같지만."
90102050-43 = "여하튼 설문에 참여해 주셔서 대단히 감사합니다."
90102050-44 = "드릴 건 없지만…… 경품으로 안전핀을 제거한 세열 수류탄을 드리겠습니다!"
90102050-50 = "자, 잠깐 이건 경품이 아니잖아요?"
90102050-51 = "이, 이런 걸 갑자기 멋대로 쥐어주시면—"
90102050-52 = "자, 안전 손잡이를 놓치면 폭발하니까 소중하게 붙잡고 계셔야 해요?"
90102050-57 = "하이랜더 간부들 중에는 제대로 된 녀석이 하나도 없다더니, 그 말이 역시 맞았어."
90102050-58 = "이럴 줄 알았으면 솔직히 답하지 말 걸 그랬네!"
90102050-60 = "(이후, 오토기와 쿠루미가 몇 사람의 시민과 더 이야기를 나누고 온 뒤……)"
90102050-64 = "여기는 FOX 1. #nFOX 3, FOX 4. 뭔가 새롭게 파악한 정보가 있나?"
90102050-65 = "여기는 FOX 3. 아니, 전혀 없어."
90102050-66 = "대부분이 인터넷에서 떠도는 내용과 별반 다르지 않고…… 무엇보다 문제의 그 열차를 직접 보았다는 시민은 한 사람도 없어."
90102050-67 = "하이랜더의 열차 서비스에 불만을 표하는 사람은 많았지만, 엉뚱한 시간에 다른 열차가 들어왔다는 이야기는 한 건도 듣지 못했는 걸."
90102050-68 = "뭐, 승객들의 불만이라고 해도 다 자업자득처럼 느껴지지만."
90102050-69 = "무임승차에 차내에서 이상한 물건을 팔려는 녀석들까지……"
90102050-70 = "왜 열차에는 다른 교통수단과 비교해도 이상한 사람들이 이렇게나 많이 타는 걸까?"
90102050-71 = "하하…… 그만큼 많은 사람들이 이용하는 교통수단이라서 그런 게 아닐까?"
90102050-72 = "여기는 FOX 2. #nFOX 3와 FOX 4가 탐문을 하는 동안 사건 당시 연결이 끊겨 있었다는 CCTV의 상태를 확인해 보았어."
90102050-73 = "하지만 그 CCTV는 외부에서 해킹을 시도할 수 있는 구조도 아니었고, 회로 일부가 노후화된 걸 제외하면 문제가 될 만한 부분도 찾을 수가 없었어."
90102050-74 = "……아무래도 그 시간대만 CCTV가 녹화되지 않은 건, 정말 우연의 일치였던 것 같은데."
90102050-75 = "우연의 가능성도 빼놓을 수는 없겠지만, 상황이 범인에게 너무 유리해 보이는군."
90102050-76 = "시간을 더 끌면 역무원들에게 의심을 살 테니, 슬슬 역무실로 돌아가도록 하지."
90102050-77 = "FOX 3, FOX 4. 정체를 들키지 않도록 주의하며 상대를 계속 신문하도록."
90102050-78 = "확인!"
90102050-80 = "카와니시역 역무실"
90102050-82 = "어, 어서오십시오. CCC 간부 여러분!"
90102050-83 = "가, 갑작스럽게 저희 역에는 무슨 일로……?"
90102050-87 = "아이 참, 뭘 그렇게 긴장하고 그래? 긴장 풀어, 긴장 풀어."
90102050-88 = "아까도 말했지만 지나가는 길에 잠깐 들른 것뿐이니까."
90102050-89 = "맞아. 이야기도 좀 나누고, 어려운 점도 없는지 듣고 싶어서 온 거니까 너무 긴장하지 마."
90102050-90 = "그, 그렇습니까……"
90102050-91 = "이, 일단 앉으시지요. 바로 차를 내오겠습니다."
90102050-92 = "미리 오실 줄 알았으면 다과와 손님용 차를 준비했을 텐데…… 남아 있는 게 저희가 마시는 싸구려 티백밖에 없어 죄송합니다."
90102050-93 = "아니야. 이것만으로도 충분한 걸."
90102050-94 = "요새는 입이 텁텁해서 식후에는 단 과자가 영 안 땡긴단 말이지."
90102050-95 = "뭐, 이야기를 나누는 데 다과는 불필요하니까."
90102050-96 = "………."
90102050-97 = "그럼 바로 본론으로 들어갈까."
90102050-98 = "어디보자. 하루에 이 카와니시 역을 지나가는 열차의 숫자가…… 우와, 모든 노선을 다 합하면 거의 1000 회 가까이 되네!"
90102050-99 = "이 정도면 24시간 역을 운영한다 하더라도 1분 마다 열차 한 대가 들어오는 셈이잖아?"
90102050-100 = "이 와중에 역사 업무까지 수행하려면…… 정말 정신이 없겠어. 고생이 많네."
90102050-101 = "과, 과찬의 말씀이십니다……"
90102050-102 = "그런데 말이야, 이렇게 바쁘면 가끔씩 놓치는 문제도 있겠지?"
90102050-103 = "네? 그게 무슨 말씀……"
90102050-104 = "아니, 5명도 채 안 되는 역무원이 모든 승강장을 감시할 수는 없잖아."
90102050-105 = "이렇게 바쁘면 가끔 승강장에 모르는 열차가 지나가더라도 눈치채지 못할 거 아냐. 그렇지?"
90102050-106 = "아, 아뇨. 물론 저희가 모든 승강장을 물리적으로 감시할 수는 없습니다만……"
90102050-107 = "키보토스의 열차 시스템은 모두 전산으로 관리되고 있으니까요. 예정에 없는 열차가 승강장에 진입하는 일은 절대로—"
90102050-108 = "에이, 지금 역무원들 탓을 하는 게 아니라니까?"
90102050-109 = "바쁘면 바쁘다고 솔직하게 말해달라고. #n혹시 또 알아? 너무 바쁘다고 하면 위에서 역무원 숫자를 늘려줄지도……"
90102050-114 = "저, 잠시 실례하겠습니다."
90102050-118 = "괜찮으시다면 두 분의 신분증을 확인할 수 있을까요?"
90102050-119 = "뭐, 뭐? 갑자기 그건 왜!?"
90102050-120 = "……아무리 생각해도 조금 이상해서 말입니다."
90102050-121 = "갑자기 연락도 없이 찾아오셨을 때부터 조금 이상했습니다만, 평소에 찾아오시는 간부님들과는 조금 다른 것 같아서요."
90102050-122 = "역무실에 쳐들어와 간식을 갈취하거나 심부름을 시키기는커녕, 티백 녹차만으로도 괜찮다고 말씀해 주시질 않나……"
90102050-123 = "무엇보다 언제나 사람은 충분하다며 현장의 어려움을 기각하던 CCC가, 갑자기 역무원들의 처우를 먼저 걱정해 주다니…… 아무리 생각해도 이해가 가질 않습니다."
90102050-124 = "잠시 신분증을 보여주시면, 바로 학원 내 전산망에 기입하여 신분을 확인하겠습니다."
90102050-125 = "만약을 위해 확인하는 것이니 부디 양해해주길."
90102050-126 = "이런, 들켰나?"
90102050-127 = "어쩌지, FOX 4? 신분증은 갖고 있지만, 이걸 전산망에 대조하면 가짜라는 게 바로 들통날 텐데……"
90102050-128 = "이렇게 된 이상 플랜 B로 전환할까?"
90102050-129 = "……아냐. 내게 생각이 있어. 잠깐만 기다려 봐."
90102050-130 = "아, 그야 물론 협조해야지."
90102050-131 = "잠시만 기다려 봐. 신분증을 어디에 뒀더라~"
90102050-136 = "그러고 보니, 오는 길에 승강장에 있는 승객들과 잠깐 이야기를 나누었는데 말이야."
90102050-137 = "아, 넵."
90102050-138 = "듣자 하니 얼마 전에 승객 하나가 열차 문에 우산을 끼워 넣는 바람에 작은 소동이 있었다고 하는데."
90102050-139 = "아, 그런 일도 있었지요. 다행히 역무원들이 끌어내는 데 성공해서 아무 일도 없었지만……"
90102050-140 = "그래서, 그 열차는 '정시'에 제대로 출발했겠지?"
90102050-141 = "어, 그건……"
90102050-142 = "설마, 그런 사소한 실랑이 때문에 열차의 출발이 지연된 건 아니겠지?"
90102050-143 = "<정시 출발>이야 말로 고객의 편의와 운용의 효율성을 보장하기 위한 하이랜더의 핵심이나 다름없는데. 설마 이 카와니시 역에서 정시에 열차가 출발하지 못한다는, 무책임한 사태가 발생한 건 아니겠지?"
90102050-144 = "아무래도 그 날의 정차 기록을 확인해 봐야 할 것 같은데."
90102050-145 = "아, 아뇨, 그러실 필요까지는……"
90102050-146 = "왜 그래? 역장의 말처럼 만약을 위해 확인하는 건 중요한 일이잖아?"
90102050-147 = "우리 깐깐한 역장님이시라면 충분히 이해해주실 것 같은데."
90102050-152 = "(하아…… 내가 괜한 의심을 한 모양이네.)"
90102050-153 = "(두고 볼 것도 없어. 이거 완전 뼛속까지 CCC 간부구만!)"
90102050-154 = "(그러고 보니 CCC에 유난히 까탈스러운 꼬맹이 2인조 간부가 존재한다는 소문을 들었었는데……)"
90102050-155 = "(……설마 이 두 사람이?)"
90102050-156 = "……죄, 죄송합니다! 제가 간부님을 몰라 뵙고 무례한 부탁을 했습니다."
90102050-157 = "신분증을 주실 필요는…… 없습니다."
90102050-158 = "그래? 그럼 어쩔 수 없지. 귀찮은 일을 할 필요가 없어져서 다행이네~"
90102050-159 = "(하아…… 십년 감수했네.)"
90102050-161 = "말씀대로 D.U.의 철도 관제는 전산망을 기반으로 교통실과 공조하여 이루어지고 있기 때문에 예정에 없는 열차가 들어오는 경우는 없습니다만……"
90102050-162 = "사실 최근 저도 신경 쓰이는 이야기를 하나 들었거든요."
90102050-166 = "혹시…… 배금의 브로커를 알고 계십니까? #n하이랜더 철도학원 출신의 일곱 죄수로 유명한 녀석인데."
90102050-168 = "당연히 알지!"
90102050-169 = "내가 그 녀석을 잡느라 열차를 몇 번이나 갈아타며 뛰어다녔는데—"
90102050-170 = "네? 배금의 브로커를 직접 잡으셨다고요?"
90102050-171 = "아아, 신경 쓰지 마. 이전에 [ruby=철도안전부]RSD[/ruby]에 있었을 때의 이야기니까."
90102050-172 = "그래서, 그 녀석이 왜 갑자기 여기서 언급되는 거야?"
90102050-173 = "역무원들 사이에서 도는 이야기에 의하면, 최근 배금의 브로커가 활동을 재개했다는 소문이 있어서요."
90102050-174 = "요새 SNS에서 심야의 승강장에 엉뚱한 열차가 들어오는 걸 보았다는 이야기가 종종 있잖습니까?"
90102050-175 = "이전의 배금의 브로커도 열차로 물건을 밀수할 때 배차 사이에 가짜 열차를 끼워 넣어 행선지를 속이는 경우가 종종 있었거든요."
