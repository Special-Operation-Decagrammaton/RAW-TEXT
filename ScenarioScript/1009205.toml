[translation]
1009205-1 = "한 사람을 위한 연주"
1009205-4 = "(약속한 시간에 맞춰, 요시미가 알려준 장소로 향했다.)"
1009205-10 = "(문을 열고 들어간 방안은 휑했고, 아직 불도 꺼져 있었다.)"
1009205-14 = "[ns1] \"요시미는 아직인가……?\"\n[ns2] 불을 찾아서 켠다."
1009205-22 = "……후."
1009205-23 = "왔구나, 선생님. 기다리고 있었어."
1009205-27 = "[ns3] \"……? 요시미?\"\n[ns4] \"이건 무슨 상황…….\""
1009205-30 = "무슨 상황이긴, 이제부터 내가 연주를 할 상황이지."
1009205-31 = "그동안 연습은 죽도록 했다고 생각하지만……."
1009205-35 = "그래도 역시 떨리네. 제대로 누군가에게 들려준다고 생각한 건 이번이 처음이라."
1009205-36 = "……응?"
1009205-37 = "무슨 이야기인지 좀 더 설명해 달라고?"
1009205-41 = "……하아."
1009205-42 = "제발, 선생님. 이걸 내 입으로 설명하라는 건 좀 너무하지 않아?"
1009205-43 = "눈치가 없는 것도 아니면서 여기서까지 그럴 거야, 진짜?"
1009205-44 = "기타 잡은 아이가 곡 처음으로 완주했다고, 연습한 결과를 처음으로 보여줄 상대를 불렀다잖아."
1009205-45 = "여기서 이게 '무슨 의미'인지를 당사자에게 직접 묻는 거야?"
1009205-46 = "꽤나 큰 용기를 낸 상황인데……. 그냥 잠자코 들어달라고. 이번만큼은."
1009205-47 = "……지금 완전 진지하다고, 나."
1009205-51 = "[ns5] \"……이해했어.\"\n[ns6] 말없이 근처 의자에 앉는다."
1009205-56 = "……후우. 좋아."
1009205-57 = "순순히 말을 따라주는 선생님을 보는 것도 처음인 것 같네. 왠지 더 긴장되는걸."
1009205-58 = "그럼……."
1009205-59 = "……응?"
1009205-60 = "그 전에 무슨 곡이냐고?"
1009205-61 = "밴드 연습곡……?"
1009205-62 = "아니. 이건 다른 거야. 다른 거고, 다른 애들은 들은 적 없는 곡이지."
1009205-63 = "내가 직접 선정한……."
1009205-68 = "……잠깐."
1009205-69 = "무슨 곡인지, 제목이 뭔지는 물어보지 마. 어차피 대답도 안 해줄 거야."
1009205-70 = "그냥 연주를 듣는다는 거만 생각해. 알았지?"
1009205-79 = "……그럼 간다. 집중해."
1009205-80 = "……하아……. 후우……."
1009205-81 = "……후……."
1009205-82 = "……음……."
1009205-83 = "으음……."
1009205-87 = "으으음……!!"
1009205-90 = "……역시 안 되겠다."
1009205-95 = "[ns7] \"갑자기 자리에 앉았어……?\"\n[ns8] \"그렇게 긴장할 거 없는데.\""
1009205-99 = "선생님. 미안한데, 서서 하다가 틀리느니 연습할 때처럼 앉아서 해야겠어."
1009205-100 = "모양새가 좀 그럴 순 있지만……. 그냥 그 부분은 이해해 달라고."
1009205-101 = "그럼……."
1009205-106 = "……진짜 간다."
1009205-112 = "(이후 다른 모든 소리들이 완전히 죽은 채, 요시미의 기타 연주만이 방안을 울렸다.)"
1009205-113 = "(따로 앰프나 확성기에 연결한 것도 아니었기에, 가까이에서만 온전한 음을 들을 수 있었다.)"
1009205-114 = "(연주의 수준은…….)"
1009205-118 = "(……놀랍게도 꽤 훌륭했다.)"
1009205-121 = "[wa:580]― [log=요시미 밴드]후……. [wa:1020]후우…….[/log]"
1009205-124 = "― [log=요시미 밴드]……돼, [wa:1030]됐다…….[/log]"
1009205-126 = "― [log=요시미 밴드]해냈어…….[/log]"
1009205-129 = "[ns9] \"정말로 굉장한 연주였어.\"\n[ns10] \"……이건 진짜였다.\""
1009205-130 = "[wa:400]― [log=요시미 밴드]그, [wa:550]그래……? [/log]"
1009205-131 = "[wa:400]― [log=요시미 밴드]그, [wa:550]그래……? [/log]"
1009205-133 = "― [log=요시미 밴드]선생님이 [wa:470]듣기에도 [wa:550]그랬어……?[wa:160] [/log]"
1009205-136 = "― [log=요시미 밴드]장난 치는 거 [wa:550]아니지?[/log]"
1009205-138 = "― [log=요시미 밴드]이건……. [wa:1020]진짜지?[wa:280] [/log]"
1009205-141 = "[wa:1350]― [log=요시미 밴드]뭔가……. [wa:1180]가슴이 떨려…….[/log]"
1009205-144 = "― [log=요시미 밴드]이런 느낌은 [wa:1250]처음이라…….[/log]"
1009205-147 = "[wa:650]― [log=요시미 밴드]……선생님…….[/log]"
1009205-150 = "― [log=요시미 밴드]생각해 보면, [/log]"
1009205-152 = "― [log=요시미 밴드]선생님한테 [wa:400]처음으로 보여준 것 같아. [/log]"
1009205-155 = "[wa:1160]― [log=요시미 밴드]뭐랄까……. [wa:1630]그…….[/log]"
1009205-158 = "― [log=요시미 밴드]……내 [wa:500]'멋진' 모습……. [wa:1650]이라는 거…….[/log]"
1009205-162 = "……자, 자! 이제 끝!"
1009205-163 = "볼일 끝났어. 용무는 이게 다였으니까! 진짜 끝!!"
1009205-167 = "도, 돌아가자! 그냥 처음 연주를 다른 사람에게 들려주고 싶지 않았던 것뿐이니까! 대단한 건 아니니까!!"
1009205-168 = "이제 그만……."
1009205-172 = "……? 응? 뭐라고?"
1009205-176 = "하, 한 번 더……? 앵콜……?"
1009205-177 = "무슨 소리야! 그딴 거 필요 없어! 앵콜은 무슨 놈의 얼어 죽을 앵콜……."
1009205-178 = "첫 번째를 보여주고 싶을 뿐이었다니까? 앵콜부터는 아무 의미가 없다고. 당연하잖아!"
1009205-179 = "[s11] \"난 요시미의 두 번째도 세 번째도 좋은걸.\"\n[s12] \"요시미의 첫 앵콜이라는 의미도 있지 않겠어?\""
1009205-182 = "……!!!!"
1009205-183 = "큭……. 크윽……!! 진짜!!"
1009205-184 = "진짜 입! 입!! 저놈의 입을 처음부터 뭔가로 틀어막았어야 했는데……!!"
1009205-188 = "……~~~~~~~~!!!!!!"
1009205-189 = "하아, 하아……. 후우……. 그렇게 나오시겠다……."
1009205-193 = "……좋아."
1009205-194 = "원한다면 더 상대해 주지. 어차피 여긴 선생님이랑 나밖에 없다고."
1009205-195 = "어차피 선생님도 이런 건 처음이겠지? 왠지 그런 느낌이었으니까."
1009205-196 = "그럼 각오하는 게 좋을 거야. 나도 계속해서 쉽게 넘어갈 생각은 없거든."
1009205-197 = "선생님의 그런 처음들……."
1009205-202 = "……이제부터 내가 전부 가져가 주겠어."
1009205-204 = "(이후 그 자리에서 요시미가 연주할 수 있는 모든 곡을 들었다.)"
1009205-208 = "(의기양양하게 말한 것과 달리, 중반부터의 요시미는 연주에 집중하느라 녹초가 돼 있었다…….)"
