[translation]
10018010-1 = "제1화;도움이 필요해요!"
10018010-6 = "모든 게 잘 되고 있었어. 정말 간만에……."
10018010-7 = "휴일이라 잠도 푹 잤고, 아침 준비도 잘 끝내고 나왔고, 음식도 문제없었고."
10018010-8 = "기모노도 입었고, 그대로 첫 기원을 하러 가려던 참이었는데……"
10018010-9 = "그랬는데, 그랬었는데……"
10018010-13 = "왜 또 나야!!!"
10018010-14 = "선배……"
10018010-21 = "뜻대로 되지 않는 것이 인생이라는 것이죠."
10018010-22 = "수많은 시련이 닥치고, 극복하고, 또다시 밀어닥치고, 이겨내고……"
10018010-23 = "인간이란 그렇게, 극복되어야 할 무엇……"
10018010-24 = "납치한 장본인이 그런 말 하니까, 참 신기하게 들리네."
10018010-25 = "별 말씀을."
10018010-26 = "그보다 기모노 아름답네요. 어울려요. 후우카 씨."
10018010-27 = "……인상적인 감상, 고마워. 하루나도 옷 예쁘네."
10018010-28 = "후후후. 감사합니다. 평소보다 조금 더 신경 써 봤어요."
10018010-32 = "그러면 이제, 본론으로 들어갈까요?"
10018010-33 = "우리 미식연구회가 당신들을 이 장소까지 어렵게 모신 것은,"
10018010-34 = "반드시 해 주었으면 하는 일이 있기 때문입니다."
10018010-35 = "모신 거 아니잖아…… 납치한 거잖아……"
10018010-36 = "그것도 늘 있는 일이라서 이제 익숙해지려 하고 있지만……"
10018010-37 = "사람은 적응의 동물이라는 말이 이젠 무서워!"
10018010-38 = "우리 미식연구회는 숨겨진 보석 같은 가게를 발견했습니다. 참새정이라는 곳이죠."
10018010-39 = "하지만 그 참새정이 이제 곧 문을 닫는다고 하더군요."
10018010-44 = "후우카 씨. 트러플이 아무 보존 처리도 되지 않은 채 길바닥에 버려져 있다면,"
10018010-45 = "한 명의 요리사로서, 어떻게 하시겠어요?"
10018010-46 = "우선 방향 처리부터 해야겠지."
10018010-47 = "오일로 향을 우려내거나 해서. 물론 빨리 조리하는 게 가장 좋겠지만."
10018010-48 = "네. 바로 그런 것이랍니다."
10018010-49 = "그렇게 가능성이 풍부한 가게가 알 수 없는 사정으로 문을 닫는 것은,"
10018010-50 = "미식의 측면에서도 크나큰 손실이라 아니 할 수 없겠지요."
10018010-51 = "……우선 이 포박부터 풀어주고 말하면 안 돼?"
10018010-52 = "저, 가게가 문을 열고 닫는 건, 기본적으로 주인의 재량인 게 아닐까요?"
10018010-53 = "가게의 폐업은 주인의 결정에 달려 있다……"
10018010-54 = "근본적으로는 옳은 말이지요."
10018010-59 = "하지만! 다른 누군가가 허락한다 해도 이 쿠로다테 하루나가 허락하지 않습니다!"
10018010-60 = "신이 용서해도 제가 용서하지 않아요!"
10018010-62 = "아니, 용서해 줘. 그리고 하는 김에 우리도 좀 풀어주고."
10018010-67 = "그러고 보니 슬슬 도착할 때가 됐는데……"
10018010-72 = "아, 왔구나. 선생님."
10018010-74 = "야호~ 우리 왔어!"
10018010-76 = "잘 지내고 있었나요?"
10018010-78 = "[ns] \"안녕, 모두들.\""
10018010-80 = "[ns] \"다들 옷이 예쁘네.\""
10018010-85 = "선생님! 우리를 구하러 와 주신 건가요?!"
10018010-86 = "[s] \"그러고 싶은 마음은 한가득인데……\""
10018010-90 = "[ns] \"나도 잡혔어.\""
10018010-94 = "네…… 그렇, 군요. 괜찮아요. 전 울지 않을 거예요."
10018010-95 = "전 울어도 되죠, 선배?"
10018010-97 = "이제 상황을 도와줄 사람들이 모두 모였으니, 타개책을 생각해 볼까요?"
10018010-98 = "어떻게 하면 참새정을 폐업에서 구할 수 있을까,"
10018010-99 = "그것이 이번 미식연구회의 탐구 주제입니다!"
10018010-103 = "[ns] \"그런 거라면 말로 부탁해도 얼마든지 들어주었을 텐데……\""
10018010-104 = "결의와 각오라는 것입니다. 선생님."
10018010-105 = "이렇게 상궤를 벗어난 방법을 사용할 정도로, 저희가 진심이라는 것을,"
10018010-106 = "선생님께 전달시켜 드리고 싶었기에."
10018010-108 = "……두 번만 진심이었다간, 선생님이 쓰러지고 말 거야."
10018010-109 = "(끄덕끄덕)"
10018010-112 = "[ns1] \"우선 말이지…… 우리끼리 이야기하는 것 보다.\"\n[ns2] \"주인분의 말을 한번 들어 보는 게 어떨까?\""
10018010-115 = "과연. 문제 해결에는 당사자의 의견이 중요하다……"
10018010-116 = "마음이 앞선 나머지 중요한 것을 놓치고 있었군요."
10018010-117 = "고견 감사드립니다. 선생님."
10018010-118 = "역시 선생님을 납치……"
10018010-119 = "아니, 모신 것은 정답이었어요."
10018010-121 = "(……조금만 생각해도 알 수 있는 게 아닐까, 그거.)"
10018010-127 = "어머나…… 저건?"
10018010-128 = "하루나, 뭔가 분위기가 이상한데……?"
10018010-135 = "아직도 못 알아듣겠어, 주인장?"
10018010-136 = "빨리 가게 비우라고! 몇 번을 말해야 하는 거야!"
10018010-138 = "죄송합니다, 죄송합니다. 정리에 시간이 걸려서요."
10018010-139 = "마지막 손님도 얼마 전에 받았으니, 최대한 빨리 정리하겠습니다……"
10018010-140 = "나 참, 우리도 이러고 싶어서 이러는 게 아니라고."
10018010-141 = "그래. 우리도 알고 보면 좋은 사람들이라니까?"
10018010-142 = "좋은 게 좋은 거잖아. 주인장이 우리 말만 잘 따라 주면 되는 거라고."
10018010-146 = "이만하면 알아들을 수 있지? 곱게 가자고, 서로. 엉?"
10018010-153 = "후후후후……"
10018010-154 = "하, 하루나……?"
10018010-155 = "선객이 계셨군요. 그다지 반갑지 않은 선객이."
10018010-156 = "그럼 어떻게 할까요, 하루나★"
10018010-157 = "미식연구회는 궁극의 맛을 추구하는 모임."
10018010-158 = "그에 준하는 맛을 선사해 준 분이 곤경에 처했을 때."
10018010-159 = "그냥 두고 보는 것도 도리가 아니겠지요."
10018010-160 = "완전 찬성! 나 그런 거 좋아해!"
10018010-161 = "뭐, 이렇게 될 것 같긴 했지만 말이야."
10018010-163 = "하, 하루나? 뭘 하려는 거야……?"
10018010-164 = "선배…… 저희는 조금 물러나는 게……"
10018010-165 = "[s] \"그러게. 주리는 현명하구나.\""
10018010-169 = "앗, 감사해요, 선생님!"
10018010-170 = "그렇지만 이건 오랜 경험에서 우러나온 반사 작용이라고 할까."
10018010-171 = "네, 선생님…… 하긴 하루나는 저렇게 되면 어떤 말도 통하지 않았죠……"
10018010-177 = "뭐, 뭐냐! 너희들은!"
10018010-178 = "이봐, 사람이 지금 영업 중이라고. 보면 모르냐?"
10018010-185 = "네, 모른답니다."
10018010-186 = "미식을 방해하고 핍박하는 무뢰한들의 이야기 따위,"
10018010-187 = "관심도 없고 신경도 쓰고 싶지 않으니까요."
10018010-195 = "자, 그러면."
10018010-200 = "미식연구회, 시작해 볼까요?"
