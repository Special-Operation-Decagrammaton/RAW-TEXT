[translation]
1301103-1 = "좋은 시나리오의 조건"
1301103-2 = "밀레니엄 게임개발부"
1301103-3 = "[Gamemaniac : 고전 게임에서 시나리오 같은 게 중요해?]"
1301103-4 = "[Waga-mama : 응~ 구닥다리 시나리오 구려~ ㅋㅋㅋㅋ]"
1301103-5 = "[ikusa007 : 히로인 언제 나옴?]"
1301103-6 = "[tensaiko: 반전 없음? 내가 써도 이것보단 잘 쓰겠다.]"
1301103-7 = "[s] \"그러니까, 이게 뭐야?\""
1301103-8 = "아무것도 모르는 멍청이들의 평가야!"
1301103-9 = "[s] \"평가……?\""
1301103-10 = "으음, 그러니까."
1301103-11 = "최근에 펀딩 열풍으로 복고풍 레트로 게임이 몇 개 다시 만들어지고 있거든?"
1301103-12 = "개인적으로는 옆에서 열심히 응원하고 싶달까."
1301103-13 = "그 도전에 찬사를 보내고 싶은데."
1301103-14 = "봐봐……!"
1301103-15 = "새로 나온다는 레트로 게임에 대놓고, 다들 이런 악담만 퍼붓고 있잖아!"
1301103-16 = "[s] \"일부러 찾아볼 필요까진 없을 텐데.\""
1301103-17 = "그게, 원치 않게 내 눈에 띄었달까……."
1301103-18 = "천을 덮어놨던 치즈가 상한 걸 우연치 않게 발견했달까……."
1301103-19 = "조, 좋아서 검색해본 게 아니야!"
1301103-20 = "어디까지나 시장조사의 일환으로……."
1301103-21 = "그보다, 애당초 이 녀석들. 죄다 얼토당토않는 이야기뿐이잖아!"
1301103-22 = "고전 게임에선 시나리오가 중요하지 않다느니."
1301103-23 = "왜 중간에 히로인이 나오지 않냐느니!"
1301103-24 = "반전이 없어 실망했다느니!"
1301103-25 = "[s] \"으음.\""
1301103-26 = "애당초 평가 기준이 너무 얄팍해!"
1301103-27 = "용사가 마왕을 쓰러트리러 떠나는 정석적인 시나리오는, 그럼 정석이라서 구린 거야?"
1301103-28 = "클리셰를 따르는 게 바보고, 그걸 부수는 의외성과 반전이 있어야만 훌륭하다니 그게 말이야?! 방구야?!"
1301103-29 = "거들먹거리면서 좋은 게임 시나리오란 곧 '유저에게 강한 인상을 남기는 시나리오'라고 하는데."
1301103-30 = "입으로는 그런 말을 누가 못하겠냐구!"
1301103-31 = "그렇게 잘 알고 있으면, 니가 쓰던가!"
1301103-32 = "[s] \"모모이, 그, 진정해…….\""
1301103-33 = "후우후우……."
1301103-34 = "우……."
1301103-36 = "[s] \"우……?\""
1301103-37 = "우아아앙! 분해! 분하다고!"
1301103-38 = "이런 헛소리를 하는 녀석들에게 통쾌하게 한 방 먹여주고 싶은데!"
1301103-39 = "마음처럼 글이 안 써져서! 화딱지가 나!"
1301103-40 = "[s] \"마감 때문에 그런 거구나.\""
1301103-41 = "……미안. 선생님."
1301103-42 = "괜히 나 혼자만 흥분해서, 선생님한테 투정이나 부리고."
1301103-43 = "[s1] \"아냐.\"\n[s2] \"오히려 고맙지.\""
1301103-44 = "……응? 고맙다니, 왜?"
1301103-45 = "……응? 고맙다니, 왜?"
1301103-46 = "[s] \"모모이가 힘들 때, 믿고 의지해준다는 거니까.\""
1301103-47 = "…….헤엥, 나-참."
1301103-48 = "으응, 고마워. 선생님."
1301103-49 = "사실, 나도 잘 모르겠어."
1301103-50 = "내가 뭘 쓰면 좋을지, 어떻게 쓰면 좋을지."
1301103-51 = "이래서는 게임개발부 시나리오 라이터로서 실격인데……."
1301103-52 = "[s3] \"무엇이 완벽한 게임 시나리오인지는 몰라.\"\n[s4] \"그래도 한 가지, 알 수 있는 건 있어.\""
1301103-53 = "알 수 있는 거?"
1301103-54 = "알 수 있는 거?"
1301103-55 = "[s5] \"모모이가 쓰고 싶어하는 시나리오가-\"\n[s6] \"-가장 좋은 시나리오라는 건 확실해.\""
1301103-56 = "……헤-"
1301103-58 = "……헤-"
1301103-60 = "헤-에……. 그, 그렇구나."
1301103-61 = "응. 내가 쓰고 싶어하는 시나리오가……."
1301103-62 = "가장 좋은 시나리오……!"
1301103-63 = "응! 선생님 말을 듣고 나니, 조금 감이 잡히는 거 같아."
1301103-64 = "조오오았어! 의욕 풀 충전!"
1301103-65 = "마침 선생님의 말을 듣고 좋은 아이디어가 떠올랐어!"
1301103-66 = "정석을 따르되, 그걸 넘어서는 특제 시나리오가 말이야!"
1301103-69 = "그러니, 다음번에 내 차기작 시나리오를 읽고 감상을 들려줘! 선생님!"
1301103-70 = "[s] \"응, 맡겨줘.\""
1301103-73 = "(그로부터 며칠 후, 모모이에게서 모모톡이 도착했다.)"
1301103-74 = "어쩌지, 선생님?!"
1301103-75 = "모처럼 떠오른 아이디어가 완전 모순적이라, 그걸 타파할 다음 아이디어가 전혀 떠오르지 않아! 도와줘!!!"
1301103-76 = "우와아앙?!"
1301103-77 = "(역시나 평소의 모모이다웠다.)"
