[translation]
83303200200-6 = "아. 히나찌다."
83303200200-7 = "역시 떴구나."
83303200200-8 = "……뭐, 상황이 상황이니까. 당연한 거겠지만."
83303200200-14 = "소식이라면 이미 들었어. 마코토의 동상이 설치되었다고."
83303200200-15 = "아하하핫~ 맞아! 여기저기 왕창 늘어난 거 있지! 진짜 깜짝 놀랐다니깐. 아하하핫!!"
83303200200-16 = "여기에도 이미 여러 개가……"
83303200200-17 = "이곳 선도부 건물뿐만이 아니야."
83303200200-18 = "듣기로는 만마전 의장이 문제아들을 고용해서 게헨나 여기저기에 잔뜩 설치하고 있는 모양이니까."
83303200200-19 = "이미 SNS에서는 그걸로 엄청나게 불타고 있는 거 있지~"
83303200200-20 = "우리도 마침 그거 때문에 구경하러 나온 거고!"
83303200200-22 = "하아…"
83303200200-23 = "그래. 상황은 이해했어."
83303200200-24 = "……지금부터 문제아를 포함해 남김없이 전부 정리하도록 하겠어."
83303200200-25 = "아하핫~ 힘내~ 히나찌~"
