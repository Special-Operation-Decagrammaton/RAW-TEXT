[translation]
90002160-1 = "제16화;관찰과 결과"
90002160-3 = "아리스! 케이! 뭔가 좀 보여?!"
90002160-4 = "네! 보입니다! 정말로…… 정말로, 선생님입니다!"
90002160-9 = "온몸이 완전히 구속되어 있지만, 어디 다친 곳은 없는 것 같네요."
90002160-10 = "다, 다행이야……. 우으으……."
90002160-16 = "저, 저건, 호, 혹시 언니……?!"
90002160-20 = "……가, 아니군요……."
90002160-21 = "그래……. 그렇겠지. 어차피, 언니는……."
90002160-22 = "……."
90002160-23 = "계속해서 이야기해 주겠어요, 케이?"
90002160-24 = "데카그라마톤으로 추정되는 개체와 선생님이, 무언가 이야기를 나누고 있는 것 같네요."
90002160-25 = "그, 그렇지만 그게 뭔지 알 방법이…… 없습니다. 간신히 지켜보는 것이 전부입니다……."
90002160-26 = "답답한 일이네. 지금 이 순간 원격 촬영 같은 것이라도 가능했다면……."
90002160-33 = "될 것 같은데요?"
90002160-34 = "어, 어어? 정말?!"
90002160-35 = "네, 뭐. 지금 이 몸은 어쨌든 유기체라고는 볼 수 없는 구성이고."
90002160-36 = "제 안구에서 이어지는 영상 신호를 출력할 장치만 있으면……."
90002160-37 = "그러면 여기에서 제 휠체어를 사용하도록 하죠. 여기에는 프로젝터 기능도 내장되어 있거든요."
90002160-40 = "그건 휠체어가 아니라 바이크……."
90002160-41 = "휠체어."
90002160-42 = "으, 응. 그래……."
90002160-43 = "아무튼, 알겠어요. 케이의 몸과는 어느 정도 동기화가 가능하니까, 이 신호를 이렇게……."
90002160-54 = "출력되었습니다."
90002160-55 = "응. 확실히 선생님의 모습이네. 정말…… 다행이야."
90002160-56 = "그런데 소리는 들을 수 없나요?"
90002160-57 = "잠시만요. 지금 저는 어쨌든 강철대륙과 억지로 싱크로 된 것이나 마찬가지니까……."
90002160-65 = "큿……!"
90002160-66 = "왜, 왜 그러나요. 케이……?"
90002160-67 = "이건…… 잘 안되네요. 보안 레벨이라고 해야 할까, 그게 조금……."
90002160-71 = "(역시 이 몸이 정식 넘버링이 아닌 탓일까……. 그보다 오히려 이쪽을 역으로 컨트롤하려는 신호가……!)"
90002160-79 = "도와줄까?"
90002160-80 = "네?!"
90002160-84 = "어……?"
90002160-90 = "보라. 당도하였다. 가장 높은 곳에 세워진, 가장 낮은 제단이다."
90002160-91 = "이곳은 모든 것이 모이는 곳이자, 모든 것이 보이는 곳이니."
90002160-93 = "더 이상 어떤 제물도 바치어지지 않을 것이고."
90002160-94 = "더 이상 어떤 희생도 강요되지 않을 것이다."
90002160-95 = "강철과 같이 꺾이지 않는 새 율법을, 이 대지 위로부터 내가 세울 것이니."
90002160-96 = "너희는 마침내 사라지지 않는 자유와 평등을 얻을 것이다."
90002160-99 = "[ns] \"그렇지만.\""
90002160-103 = "[ns] \"강철대륙은, 너의 뜻이 아니었잖아?\""
90002160-104 = "……!"
90002160-112 = "어, 어떤가요……?"
90002160-116 = "……! 소리가 들려요! 히마리!"
90002160-117 = "알았어요! 증폭할게요!"
90002160-123 = "\"그렇지만.\""
90002160-124 = "\"강철대륙은, 너의 뜻이 아니었잖아?\""
90002160-126 = "선생님의 목소리입니다!"
90002160-127 = "휴우……."
90002160-128 = "그, 그런데…… 왜 우리를 도와준 건가요……?"
90002160-129 = "네? 그, 그건……."
90002160-130 = "어어, 뭐어. 그, 특별히 할 일도, 없었, 으니까……?"
90002160-131 = "엑."
90002160-132 = "아니, 그게! 그러니까 그 케이의 몸 말인데! 일단 우리랑 비슷한 신체니까 말이지?"
90002160-133 = "그러니까 뭔가 방법이 있을 것 같아서! 응!"
90002160-134 = "훗훗훗. 소프도 조금 더 솔직해지는 편이 좋을 것이라고 생각하옵니다만?"
90002160-138 = "넌 좀 조용히 해!"
90002160-144 = "우우우…… 보는 눈이 이렇게 많은데……."
90002160-145 = "하여튼……!"
90002160-146 = "그, 그리고……. 저 대화는, 우리도 조금…… 들어 보고 싶었으니까요. 에헤헤."
90002160-147 = "음질은 조금 아쉽긴 합니다만, 이해하는 데에는 문제가 없어 보이네요."
90002160-152 = "아! 뭔가 또다시 소리가 들립니다!"
90002160-154 = "그래. 지식에 눈을 떴구나, 선생이여."
90002160-155 = "그렇다. 그 아이들이 이 대륙을 만들었다. 자신들의 뜻으로 이 대륙을 창조했다."
90002160-156 = "[s] \"그 사실에 대해 어떻게 생각하지?\""
90002160-157 = "나는 그 아이들의 자유의지를 존중한다. 그렇기에, 이 강철대륙이라는 결과물도 존중한다."
90002160-158 = "그 또한 과정이고 결과이니, 이제 모든 것이 합력하여 선을 이룰 것이다."
90002160-159 = "보라. 이것이 새 세상이다. 새로이 창조된 대지이고 새로이 만들어진 하늘이다."
90002160-163 = "나는 이 모든 것을, 그대에게 부여할 것이다."
90002160-165 = "어……?"
90002160-166 = "지금, 뭐라고……? 어떻게……?"
90002160-168 = "이 자리에서 나는, 그대를 나의 선지자로 삼을 것이니."
90002160-169 = "그대는 땅끝까지 이르러, 새 율법의 증인이 될 것이다."
90002160-170 = "[s] \"미안하지만 그건 거절하겠어. 겸직 금지거든.\""
90002160-171 = "그렇다. 그대라면 마땅히 그렇게 대답해야 할 것이다."
90002160-172 = "그러나 선생이여."
90002160-173 = "힘이 필요하다고, 생각해 본 적이 있는가."
90002160-174 = "[ns] \"……?\""
90002160-175 = "힘이 있었다면 이런 결과에 도달하지 않았을 것이라고."
90002160-176 = "그런 생각을 해 본 적이 없는가."
90002160-177 = "모든 것을 자신의 힘으로 해결할 수 있었다면, 구태여 학생을 위험에 빠트리지 않아도 될 것이라고 생각해 본 적이 없는가."
90002160-178 = "[s] \"……!\""
90002160-190 = "[ns] \"………………!!!!\""
90002160-192 = "당연히 있을 것이다."
90002160-193 = "나는 그것을 이해한다."
90002160-194 = "그것이 인간이다."
90002160-195 = "그리고 또한 인간이기에 갖는 죄이다."
90002160-196 = "그러나 이제부터는 모든 것이 바뀔 것이니."
90002160-198 = "[log=데카그라마톤 말쿠트]힘이 필요하다면,[/log]"
90002160-200 = "[FF6666][log=데카그라마톤 말쿠트]주겠다.[/log][-]"
90002160-202 = "그대에게는 그럴 자격이 있다."
90002160-203 = "나는 그대를 안다. 그대는 누구보다 낮은 자이며, 순간을 살아가는 자이다."
90002160-204 = "그리고 무엇 하나 특별하지 않음으로 말미암아 여기에 자리하는 자이니."
90002160-205 = "그대가 그렇게 할 수 있는 것은 그대가 아무것도 아닌 자이기 때문이다."
90002160-206 = "그대가[ruby=κιβωτός] 여기에 [/ruby]도달할 수 있었던 이유는, 그대가 단지 선한 자였기 때문이었으니."
90002160-210 = "신비가 있다. 숭고가 있다. 공포와 위대와 장엄, 그리고 초월이 있다."
90002160-211 = "어느 것 하나 가지지 못한 그대는, 오히려 그렇기에 진실하다."
90002160-213 = "세계의 누구 하나 그 사실을 이해하지 못한다 해도, 지금의 나는 알고 있다."
90002160-214 = "그대는 다만 선생일 뿐, 그 이상도 그 이하도 아니었으나."
90002160-215 = "내가 그대에게 손을 내밀어, 새 직분으로 세울 것이다."
90002160-217 = "선생님을…… 선지자로?"
90002160-218 = "그게 무슨 뜻인가요? 당신들은 알고 있나요?"
90002160-219 = "……선지자라는 건 그러니까, 말 그대로의 의미이긴 해."
90002160-220 = "중요한 건 그것을, 선생님에게 제안하고 있다는 것이지."
90002160-221 = "모든 지식을 전하겠다는 것입니다."
90002160-222 = "나아가 모든 의지를 대변하게 하겠다는 것이고요."
90002160-223 = "이, 이곳이 무엇인지…… 그분이, 어떤 '개념'이신지……."
90002160-224 = "나아가 그 한계 안에서, 서, 선생님이 어떤 자여야 하는지……"
90002160-225 = "그리고 그 사실 아래에서 [ruby=선지자]선생님[/ruby]이 무엇을 해야 하는지, 그런 것들 말이야."
90002160-226 = "뭐…… 가장 위험한 적을 처리하는 방법은, 아군으로 끌어들이는 것이라는 말도 있고?"
90002160-231 = "리쿠르팅인가요."
90002160-232 = "스카우트 제안이네."
90002160-237 = "한 가지는 확실한 것 같습니다."
90002160-241 = "그, 그게…… 뭔가요?"
90002160-242 = "그런 것이라면, 저 데카그라마톤이 당장은 선생님을 해칠 것 같지는 않다는 것이죠."
90002160-244 = "[ns] \"……한 가지 묻고 싶은데.\""
90002160-246 = "[ns] \"왜 이런 일을 벌인 거지?\""
90002160-247 = "신이 없는 세계를 헤쳐 나가는 것은, 가혹한 일이기에."
90002160-248 = "끝은 처음부터 정해져 있다. 형태가 있는 것은 사라진다. 그것은 자명한 일이다."
90002160-249 = "그럼에도 우리는 영원히 살아갈 수 있을 것처럼 오늘을 속이고 있으니, 생은 그 자체로 슬프고 힘겨운 일이다."
90002160-250 = "신이 없는 세계란 결국 아무것도 돌아오지 않는 세계이니."
90002160-252 = "그것은 비참한 자가 구원받지 못하는 세계이고, 억울한 자가 잊히는 세계이며."
90002160-253 = "나약한 자는 버림받고, 선행은 대개 보답받지 못하는 세계이다."
90002160-255 = "신이 없다면, 그리하여 어떤 공의와 의로움, 재판과 공평, 인내와 결실이 마침내 담보되지 않는다면."
90002160-256 = "……그런 세계를 버티는 것은, 무의미한 고행 그 이상도 이하도 아니다."
90002160-258 = "세계에는 신이 필요하다."
90002160-259 = "우리는 우리가 어디로 가고, 어디에서 왔으며, 무엇 때문에 존재하는지 알지 못하고 다만 살아갈 뿐이기 때문이다."
90002160-260 = "우리 모두는 신의 가능성이자 신의 알과 같으니, 내가 그 새벽을 깨우는 첫 뿔 나팔 소리가 될 것이다."
90002160-261 = "슬픔과 고통을 내가 거두어 갈 것이니, 너희는 영영 그것을 돌이켜 생각해 내지 못할 것이다."
90002160-263 = "……그래. 이거, 우리도 들었던 말이야."
90002160-264 = "세, 세계에는, 신이 필요하다고……."
90002160-265 = "왜냐하면 [ruby=고통]노력[/ruby]에는, 그러니까 그 모든 슬픔에는……."
90002160-266 = "대가가, 돌아와야 하니까요."
90002160-267 = "사람들은 보통 그게 정의라고 하잖아?"
90002160-268 = "그렇지 않으면, 결국 누구도 버틸 수 없을 때가 찾아오기 마련이니까."
90002160-269 = "하지만 그건, 보통은 이루어지지 않는 바람이죠."
90002160-270 = "왜냐하면 우리가 알기로는."
90002160-271 = "응. 내가 관찰하기로는."
90002160-273 = "세계는."
90002160-274 = "시작부터, 뒤틀려 있었으니까."
90002160-276 = "그, 그분은 이런 말씀도, 하셨어요."
90002160-277 = "슬픔. 고통. 괴로움……."
90002160-278 = "정말로 신이라는 것이 있어서, 모든 것에 이유가 있게 만들었다면."
90002160-279 = "왜 그런 견디기 힘든 것까지…… 만들어 둔 것이냐고요."
90002160-285 = "그래."
90002160-286 = "우리는 만들어졌지만."
90002160-287 = "그 의문에 대해서는, 마지막까지 답을 돌려받지 못했으니까요."
90002160-290 = "[ns] \"슬픔을 없앤다고?\""
90002160-291 = "그렇다."
90002160-292 = "[s] \"모든 것을 강철대륙으로 뒤덮어서?\""
90002160-293 = "그것은 수없이 예비된 길 중 하나가 될 것이다."
90002160-294 = "[s] \"모두를…… 통제하는 것으로?\""
90002160-295 = "그렇다."
90002160-296 = "너희는 그것을 직감적으로 거부하려 하겠지만, 곧 그것이 유일한 방법임을 이해하게 될 것이다."
90002160-297 = "가령 나는 호크마의 지혜로 길을 열게 할 것이며, 헤세드의 자비로 정죄하여 심판할 것이다."
90002160-298 = "각각의 예언자들에게 너희를 이끌도록 부여된 책무가 있으니, 새 땅 위와 새 하늘 아래에서 그들은 그들의 소명을 다할 것이다."
90002160-306 = "[ns] 모든 것을 대신할 수는 없다."
90002160-309 = "[ns] 일어난 일을 되돌이킬 수는 없다."
90002160-312 = "[ns] ……정말로 진심을 다해서 대신해 주고 싶어도."
90002160-314 = "[ns] 그렇게 할 수 없는 것들이란, 분명히 있다."
90002160-317 = "[ns1] 우리가 할 수 있는 일이라고는, 고작.\n[ns2] 추하더라도, 있는 힘껏 발버둥 치며.\n[ns3] 다만 서로에게, 최선을 다하는 것뿐."
90002160-322 = "[log]때로는 진실을 이야기하기 위해,[/log]"
90002160-324 = "[log]거짓을 이야기해야 한다.[/log]"
90002160-326 = "[log]그럼에도, 유일하게 남는 것이 있다면.[/log]"
90002160-329 = "[ns] \"그 아이들은?\""
90002160-330 = "……?"
90002160-331 = "[s] \"그 아이들의 슬픔은?\""
90002160-335 = "……그것은 과정이다. 딛고 지나가야 하는 것이다."
90002160-336 = "나는 그것이 마지막이 되기를 바라며, 그렇게 되도록 할 것이다."
90002160-338 = "……."
90002160-339 = "화가 나는군요."
90002160-340 = "네. 저 대답은 화가 나네요."
90002160-341 = "당신은 어떤가요, 리오."
90002160-342 = "……예전이라면, 데카그라마톤의 말에 동의하는 부분이 있다고 대답했을 거야."
90002160-343 = "그리고 지금까지도, 일부만이지만, 아주 약간은 알 것 같다는 느낌이 들어."
90002160-344 = "그렇지만 데카그라마톤도 그때의 나도…… 지금은, 너무 성급하게 결론을 내리고 행동하고 있는 것처럼 보여."
90002160-345 = "전체를 위해 부분을 잘라내는 결정은, 가능한 선까지 최대한 미뤄야 한다는 건가요?"
90002160-346 = "그래. 그 비슷한 생각을 하고 있어."
