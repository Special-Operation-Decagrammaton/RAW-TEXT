[translation]
10003105-1 = "제10화;아직 우리들의 여름은 끝나지 않았다."
10003105-2 = "(그렇게 여름의 해변을 뜨겁게 달군 사건은 히나의 활약으로 마무리가 되었다.)"
10003105-3 = "(예정되어 있던 하계 합숙 일정도 끝이 나고, 게헨나로의 복귀가 코앞으로 다가온 그때.)"
10003105-5 = "하계 합숙 훈련 지휘통제실"
10003105-6 = "죄, 죄, 죄송했습니다! 부장님! 저는 단지……. 어떻게든 일이 커지기 전에 수습하려는 마음에……!"
10003105-7 = "마음에……?"
10003105-8 = "부장님에게 들키지 않고 해결하면 그걸로 만사 OK라고 생각했달까……."
10003105-9 = "애당초 왜 그렇게 행동한 건지 전혀 이해가 안 돼."
10003105-10 = "내게 얘기했다면 일이 쉽게 해결됐을 거잖아."
10003105-11 = "그건……. 그야…… 그랬다간……."
10003105-12 = "응?"
10003105-13 = "또 쉬지 않고 일을 하려고 하셨을 거 아니에요?!"
10003105-14 = "……응?"
10003105-15 = "저는 부장님이 휴가를 보냈으면 했을 뿐이었는데~! 으아앙~!"
10003105-16 = "자, 잠깐……. 무슨 소리야? 휴가라니?"
10003105-17 = "그게 말이야. 부장. 아코 쨩이 그러는데."
10003105-18 = "부장님께서 스트레스가 무척이나 심해 보였다고……."
10003105-19 = "스트레스? 내가? ……어째서?"
10003105-20 = "훌쩍. 그게, 얼마 전에……. 제가 탄 커피를 맛있다고 해주셨던 것 때문에……. 부장님이라면 이런 말을 하실 리가 없는데……"
10003105-21 = "커피라면? 샬레와 합동 작전을 이야기했을 때 마셨던……?"
10003105-22 = "잠깐, 아코. 그건 오해야."
10003105-23 = "네?"
10003105-24 = "그때 내가 커피를 맛있다고 말했던 건 스트레스 때문이 아니라, 어디까지나 그때의 기분이 제법 괜찮아서……."
10003105-25 = "[s1] \"샬레와 작전을 같이 하면 커피가 맛있게 느껴지는 거야?\"\n[s2] \"축제에서 먹는 옥수수 같은 건가…….\""
10003105-26 = "선생님?! 아니, 방금 그 말은 그러니까 그게."
10003105-27 = "선생님?! 아니, 방금 그 말은 그러니까 그게."
10003105-28 = "그런 게 아니라……. 으, 으음……."
10003105-29 = "사, 사소한 건 됐어! 나를 배려한다고 그런 행동을 했다한들, 이런 방식이면 문제라고."
10003105-30 = "네에, 죄송합니다……."
10003105-31 = "뭐어, 그래도…… 요 1박 2일 간의 시간, 아무것도 안하면서 보낸 시간은……. 응. 분명…… 내게 있어 약간은 새로운 경험이었을지도 몰라."
10003105-32 = "하지만 그건 그거고, 이건 이거."
10003105-33 = "나는 쉰다면서 아무것도 안하고 가만히 있기보다, 일을 하는 게 더 안심이 되는 쪽이니까."
10003105-34 = "[s] \"그거, 완전 전형적인 워커홀릭의…….\""
10003105-35 = "……무슨 말 했어? 선생."
10003105-36 = "[s] \"아, 아닙니다…….\""
10003105-37 = "하아……. 누구누구의 독단으로 인해, 이번 하계 합숙 훈련은 엉망이 되어버렸지. 다른 선도부원들도 아마 제대로 된 훈련은 되지 않았을 거고."
10003105-38 = "이대로 돌아가서야, 만마전의 녀석들에게 또 무슨 말꼬리를 잡힐지 알 수 없을 테지."
10003105-39 = "그러니 어쩔 수 없지. 결정했어."
10003105-40 = "지금부터 진짜 하계 합숙 훈련을 시작하겠어."
10003105-41 = "저기……. 부장. 그 말은 즉……?"
10003105-42 = "이 시간부로 바닷가의 출입은 금지. 내가 원래 준비해온 계획표대로 36시간의 하계 지옥 합숙 훈련을 시작할 거야."
10003105-43 = "……."
10003105-44 = "……."
10003105-45 = "……."
10003105-46 = "요 이틀. 다들 여름을 마음껏 즐긴 것 같으니 지금부터가 진짜야. 일체의 자유시간도 없고 마지막엔 철야 훈련까지 준비된 코스."
10003105-47 = "이거라면 만마전 녀석들도 아무 소리 못하겠지."
10003105-48 = "으아아악……! 결국 이렇게 되는 거야?!"
10003105-49 = "이미 저희는 지금까지로도 충분히 힘들었지만…… 핑계는 통하지 않겠죠."
10003105-50 = "네, 네에……. 알겠습니다."
10003105-51 = "……."
10003105-52 = "선생님은? 이 의견에 불만 있어?"
10003105-53 = "[s] \"없습니다.\""
10003105-54 = "응, 좋은 태도야. 선생님."
10003105-59 = "(소근) 날 바람맞힌 대가는 톡톡히 치르게 할 거니까."
10003105-61 = "(결국 그렇게 되어, 게헨나 선도부의 모두와 함께하는 이 짧으면서도 기나긴 여름은…… 아직 끝나지 않았다.)"
10003105-62 = "히나 선도부장님의 여름방학!"
