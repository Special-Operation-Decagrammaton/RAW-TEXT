[translation]
1012305-1 = "마지막 순간"
1012305-2 = "(세이아의 말을 듣고, 세이아의 방으로 향했다.)"
1012305-7 = "……기다리고 있었답니다. 선생님."
1012305-8 = "말씀드리려 했던 '마지막'은……."
1012305-10 = "세이아의 방"
1012305-11 = "……후우."
1012305-12 = "역시 전혀 놀라지 않는 표정이시네요. 그러기는커녕, '예상했다'는 얼굴이에요."
1012305-13 = "[s1] \"뭐, 실제로 사실이니까.\"\n[s2] \"역시 '그 옷의 마지막'이란 뜻이었지?\""
1012305-19 = "사실 그렇습니다……만."
1012305-20 = "흐응. 그래도 너무 무드가 없으세요. 조금은 놀라는 척이라도 해주실 줄 알았는데 말이에요."
1012305-21 = "어디 아파? 라던가, 무슨 일 있어? 같은 식으로 놀라며 들어오시는 걸 기대했거든요."
1012305-22 = "너무 담담한 반응이라 제가 조금 무안해질 지경이에요. 이래도 되는 걸까요?"
1012305-23 = "허탈해진 저를 무엇으로 채워 주실 예정이실까요? 생각해 둔 게 있으신가요?"
1012305-24 = "……네?"
1012305-25 = "말해줄 수 없다고요? 그게 무슨……."
1012305-26 = "[s3] \"……사실 세이아도 알고 있지?\"\n[s4] \"이미 꽤 봐주고 있다고 생각하는데~?\""
1012305-32 = "후후, 그렇군요. 맞는 말씀이네요."
1012305-33 = "오히려 제가 죄송하다…… 아니, 감사하다-라고 말씀드려야 할 상황이었군요. 좋습니다. 넘어가죠."
1012305-34 = "연락드렸던 이유는……. 말씀하신 대로 오늘이 이 옷을 입는 마지막이기 때문입니다."
1012305-35 = "실은 오늘도 딱히 입을 이유가 없죠. 이미 꽤 여러 번 주변에 보여주기도 했으니까요."
1012305-36 = "그래도……. 아깝달까요."
1012305-37 = "그래서 한 번이라도 더, 마지막으로 선생님께 보여드리고 싶었어요."
1012305-38 = "우스운 이유죠. 실은 그래서 다른 사람이 아닌, 선생님을 부른 이유기도 하고요."
1012305-39 = "이왕 웃을 거라면 선생님이……. 라는 느낌이랄까요."
1012305-40 = "언제든지 또 입으면 되지 않느냐고요?"
1012305-41 = "……평소에 다른 학생들에게는 그렇게 말씀해 주시나 보군요."
1012305-42 = "뭐……. 아예 불가능한 이야기는 아니겠습니다만……. 뭐랄까……."
1012305-43 = "그건 제가 내키지 않네요. 재미도 없고 말이죠."
1012305-44 = "다음에는 다른 옷을 입어야지요. 모처럼의 기회가 생긴 거잖아요? 이런 기회는 저에게 별로 없잖아요? 말씀드렸듯이."
1012305-45 = "반복적으로 입어야 하는 옷은 트리니티의……."
1012305-46 = "……티파티의 교복만으로도 충분하답니다."
1012305-47 = "그리고 조금은, 옷이 다르면……."
1012305-48 = "평소에 걸려 있던 심적 제약 사항도 많이 달라지는 법이고 말이죠."
1012305-52 = "……특별히 더 생각나는 말이 없네요."
1012305-53 = "죄송해요. 이렇게 재미없는 아이인데, 괜히 불러서 시간만 빼앗고 있네요."
1012305-54 = "사실은 저도 조금 더 재미있는 방식이나, 흥미를 느끼실 만한 게 있는지 고민해 봤었답니다."
1012305-55 = "수수께끼로 접근을 해볼까? 책에 대한 이야기를 해볼까? 여러 가지 고민을 했고……."
1012305-56 = "하지만 뭘 생각해도 그다지 이거다! 하는 느낌이 없더군요."
1012305-57 = "뭐, 그야 그렇겠지요. 그 생각을 하고 있는 게 저이니까요."
1012305-58 = "기껏 지어낸 것이 꾀병이나 가벼운 거짓말 정도였지만, 그것도 이제 다 간파돼 버리고 마는군요."
1012305-59 = "그리고 이렇게, 더 이상 꺼내 들 주제가 없으니 옷에 대한 이야기나 꺼내 들고 있습니다."
1012305-60 = "……정말이지."
1012305-61 = "정말이지 불쌍한 녀석이네요, 저는. 후후후."
1012305-62 = "[s5] 세이아의 머리를 쓰다듬는다.\n[s6] 세이아의 머리를 톡톡 두드린다."
1012305-65 = "……? 선생님?"
1012305-66 = "이건 무슨 의미일까요?"
1012305-67 = "……네?"
1012305-68 = "그런 반응을 기다렸다고요? ……좋다고요?"
1012305-69 = "그게 무슨 말씀……."
1012305-74 = "[ns7] \"……세이아?\"\n[ns8] \"삐쳤니?\""
1012305-77 = "……흥."
1012305-78 = "정말이지, 저에게만 너무하시는군요. 선생님. 아무리 자업자득이라고는 해도……."
1012305-79 = "그렇게 나오신다면, 저도 생각이 있습니다."
1012305-86 = "[ns9] \"……!? 세이아!?\"\n[ns10] \"문을 잠갔어……!?\""
1012305-90 = "후후후……."
1012305-91 = "이제야 조금 당황하시는군요. 선생님께는 이 정도의 도발을 해야 한다는 것, 방금 배웠습니다."
1012305-92 = "이미 알고 계시겠지요? 이 방에서는……. 제 말이 곧 트리니티의 법."
1012305-93 = "자, 그러면 이제……. 제 어리광을 들어주실 시간이에요, 선생님."
1012305-99 = "……제가 허락할 때까지는, 여기서 나가실 수 없답니다."
1012305-101 = "(이후 세이아가 만족할 때까지, 방에서 세이아의 어리광을 들어주었다.)"
1012305-102 = "(세이아는 저녁이 다 돼서야 나갈 수 있게 방문을 열어주었다.)"
