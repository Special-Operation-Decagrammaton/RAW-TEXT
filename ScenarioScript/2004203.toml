[translation]
2004203-1 = "증강 현실"
2004203-2 = "(주말 휴일, 마키가 이야기한 밀레니엄 인근의 등산로를 찾았다.)"
2004203-7 = "으읏…… 으으읏……"
2004203-8 = "[s1] \"안녕, 마키.\"\n[s2] \"핸드폰을 들고 뭘 하고 있는 거야?\""
2004203-11 = "아, 선생님. 벌써 왔구나."
2004203-12 = "미안하지만 잠깐만 기다려 줘. 오늘치 일일 퀘스트를 하는 중이라……"
2004203-13 = "요일 던전도 클리어했고, 스태미나도 모두 사용했고, 로그인 보너스도 받았으니까—"
2004203-14 = "이걸로 오늘 일퀘도 끝!"
2004203-18 = "[ns3] \"마키의 취미를 나무랄 생각은 아니지만……\"\n[ns4] \"모처럼 산에 왔으니, 주변 풍경에 집중하는 게 좋지 않겠어?\""
2004203-21 = "아, 그건 걱정하지 않아도 돼."
2004203-22 = "지금하고 있는 이 게임은…… [ruby=AR]증강 현실[/ruby] 게임이거든!"
2004203-23 = "봐. 게임 내에 등장하는 몬스터가 카메라에 찍힌 주변 지물을 따라 움직이고 있잖아? 그래서 게임을 하면서도 주변의 풍경은 확실하게 관찰하고 있었어."
2004203-24 = "[s] \"그런 뜻이 아니었지만……\""
2004203-25 = "게다가 이 등산로는 지난번의 캠핑장과는 다르게 전파도 잘 터져서 다행이야."
2004203-26 = "사실 오늘 등산을 가자고 한 이유도 이 게임에서—"
2004203-31 = "아차, 이런 이야기를 하고 있을 때가 아니지. 겨울 산은 일찍 어두워진다고 하니까."
2004203-32 = "선생님, 서두르자. 해가 지면 산의 풍경을 제대로 관찰할 수 없을 테니까!"
2004203-43 = "으음, 분명히 이 근처에 있었던 것 같은데."
2004203-44 = "[s5] \"마키, 제대로 앞을 보고 걸어.\"\n[s6] \"스마트폰만 보다가는 넘어질 거야.\""
2004203-47 = "알겠어~"
2004203-48 = "……이상하네. 분명 공략 사이트에서는 이 근처에 있다고 했는데."
2004203-49 = "설마 좌표를 잘못 읽었나?"
2004203-50 = "[s] \"뭔가 찾는 물건이라도 있어?\""
2004203-51 = "물건이라기보다는 야생 동물에 가까운 녀석이지만—"
2004203-55 = "아, 찾았다!"
2004203-56 = "선생님, 여기 좀 봐. 황금 족제비야!"
2004203-57 = "[s] \"어디? 내 눈에는 안 보이는데……\""
2004203-58 = "그쪽이 아니라, 여기 스마트폰 속의 화면."
2004203-59 = "여기 카메라에 찍인 계곡 풍경 아래에 황금빛으로 빛나는 족제비가 뛰어다니는 게 보이지?"
2004203-60 = "후후, 이 황금 족제비는 이 AR 게임에서 가장 많은 보상을 주는 몬스터인데, 평범한 지역에서는 마주치는 것도 어렵거든."
2004203-61 = "그런데 어느 유저가 이 등산로 근처에서 황금 족제비가 나타난다고 해서 한 번 와봤는데— 설마 정말로 있었을 줄이야!"
2004203-62 = "[s7] \"오늘 등산을 오자고 한 이유가……\"\n[s8] \"설마 그 AR 게임 때문이었어?\""
2004203-65 = "응."
2004203-69 = "왜, 왜 그런 눈으로 쳐다보는 거야?!"
2004203-70 = "치히로 선배도 AR 게임은 괜찮다고 했는걸!"
2004203-71 = "AR 게임을 플레이하려면 밖을 돌아다녀야 하니까 운동도 겸사겸사 되고…… 다른 게임보다는 훨씬 건강에도 도움이 된다고!"
2004203-72 = "[s9] \"게임을 한 걸 나무라는 게 아니라……\"\n[s10] \"모처럼 나왔는데 스마트폰만 들여다보면 아쉽잖아?\""
2004203-75 = "윽, 어른 같은 잔소리…… 아니, 어른이니 당연한가."
2004203-80 = "……알겠어. 선생님을 곁에 두고 계속 스마트폰만 들여다보는 것도 예의는 아니고, 선생님도 혼자는 심심할 테니까."
2004203-81 = "그럼 지금부터는 뭐 하고 놀까?"
2004203-82 = "아, 그래! 선생님, 나랑 시합하자. 저기 계곡에 누가 먼저 도착하는지 내기야!"
2004203-83 = "후후, 늦은 사람이 나중에 음료수 사는 거야!"
2004203-87 = "[ns] \"마, 마키. 잠시만 기다려줘……!\""
2004203-92 = "후후, 내가 1등!"
2004203-96 = "뭐야, 선생님~ 평소에는 우리보고 운동 좀 하라고 말했으면서, 지금은 선생님이 훨씬 약해 보이는걸."
2004203-97 = "[s11] \"요새 너무 앉아만 있었나……\"\n[s12] \"학생의 체력을 얕보고 있었어……\""
2004203-104 = "그나저나 이 계곡은 뭔가 심심한 느낌이네."
2004203-105 = "좀 더 인상적인 색의 조형물을 잔뜩 배치했어도 좋았을 텐데……"
2004203-106 = "[s13] \"찾아보니 이 계곡은 단풍으로 유명한 모양이야.\"\n[s14] \"단풍철이 지나서 그런지 조금 심심하긴 하네.\""
2004203-109 = "그러게……"
2004203-114 = "아, 좋은 생각이 떠올랐어!"
2004203-115 = "선생님. 잠시만 기다려 봐!"
2004203-120 = "자, 선생님. 이번에는 내 스마트폰의 카메라를 통해 주변 풍경을 확인해 볼래?"
2004203-121 = "[ns] \"어디……\""
2004203-128 = "[ns15] \"……계곡의 풍경이 단풍으로 물들어 있잖아?\"\n[ns16] \"이거, 어떻게 한 거야?\""
2004203-131 = "아까도 말했잖아. 증강 현실 기능이라고."
2004203-132 = "이 AR 게임의 컨텐츠 중에는 AR 시스템을 이용해서 주변 환경 위에 몬스터 뿐만 아니라 원하는 그림을 연출할 수 있는 기능도 있거든."
2004203-133 = "그 기능을 이용해서 계곡 위에 화려한 낙엽을 그려 넣어 봤어."
2004203-134 = "어때. 증강현실 어플을 통해 본 세계도 제법 나쁘지 않지?"
2004203-135 = "[s17] \"확실히 부정할 수는 없겠네…….\"\n[s18] \"화면 속의 세상이 가끔은 현실보다 더 다채로울 수도 있구나.\""
2004203-138 = "물론이지. 내게 펜과 약간의 영감만 쥐어준다면 세상을 얼마든지 유쾌하고 화려하게 칠할 수 있는걸."
2004203-139 = "모처럼 펜을 잡았으니 조금 더 주변을 화려하게 칠해볼까?"
2004203-140 = "선생님, 혹시 뭔가 이 주위에 추가되면 좋을 것 같은 물건이라도 있어? 말해주면 내가 그려줄게!"
2004203-141 = "[s] \"그럼 마키에게 부탁해 볼까?\""
2004203-146 = "(이후, 마키가 그린 화면 속의 풍경을 감상하며 즐거운 시간을 보냈다.)"
