[translation]
22130-1 = "제13화;빅 시스터"
22130-2 = "에리두 내부 중앙 격리시설"
22130-5 = "리오. 당신이 하는 일들은 정말 전부 악취미 그 자체네요."
22130-6 = "……히마리."
22130-7 = "넌 언제나 나에 대해서 그렇게 말해 왔었지. 오물이라느니, 정화조에 둥둥 떠 있는 썩은물이라느니……."
22130-8 = "……."
22130-9 = "……뭐, 상관없어. 나를 비난할 수 있는 건 이 밀레니엄에……."
22130-10 = "아니, 이 키보토스에서 아마 너 정도일 테니까."
22130-11 = "그런 너이기에, 지금부터 내가 하려는 일을 이해해주지 않을까 기대했던 걸지도 몰라."
22130-12 = "아리스의 헤일로를 파괴하는 걸 말인가요?"
22130-13 = "……."
22130-14 = "당신은 자신이 하는 행위에 대해 밀레니엄을, 키보토스를 지키기 위해서……라고 믿고 있겠지만."
22130-15 = "그건 결국 한 소녀를 납치해서 이런 텅 빈 도시에 감금한 뒤, 그 헤일로를 파괴하는 일이잖아요."
22130-16 = "그 말은 틀리지 않았어. 하지만……."
22130-17 = "으응, 아니, 그렇게 생각하고 있기에 너는 나를 이해하지 못하고……… 또 용납하지 못하는 거겠지."
22130-18 = "네. 저는 동의하지 않아요. 무엇보다…… 샬레의 선생님이 가만히 있지 않을 테죠."
22130-19 = "맞아. 선생이 아리스를 회수하러 올 확률은 99.99999% 이상……."
22130-20 = "더구나 C&C라는 밀레니엄 최고의 전력 또한 저쪽 손에 넘어간 상황이지."
22130-21 = "정말이지, 아무도 나를 이해해주지 않는구나. 단 한 명도 말야."
22130-22 = "리오…… 그걸 알면서도……."
22130-23 = "그래도 상관없어."
22130-24 = "히마리, 네가 말한 적이 있었지. <세이프하우스>를 만들고 있지 않느냐고."
22130-25 = "……비슷하긴 하지만 조금 더 정확히 말하자면, 이곳 에리두는 미래에 있을 위협을 막고, 요격하고, 쓰러트리기 위해 세운 <요새>……."
22130-26 = "리오, 당신은, 여전히……."
22130-31 = "이해 받지 못해도 괜찮아. 이 세상이 나를 악으로 규정해도 상관없어."
22130-32 = "나는 내가 옳다고 믿는 걸 행할 뿐이야."
22130-34 = "모든 변수를 계산하고 감안을 하더라도 내가 목표를 이룰 확률은 99% 이상."
22130-35 = "이미 모든 대비는 끝마쳤어. 남은 것은 실행하는 것뿐……."
22130-39 = "리오 님. 요새도시 에리두의 감시망으로부터 보고입니다."
22130-40 = "……그래. 결국 데이터가 가리킨 대로, 당신은 정말로 찾아온 거구나."
22130-41 = "그럼 부탁할게. 토키."
22130-42 = "예스, 맴."
22130-46 = "모든 게 끝나고 나면…… 히마리 너도,"
22130-47 = "그리고 샬레의 선생, 당신도……"
22130-48 = "분명……."
22130-50 = "…………."
22130-59 = "이곳이………"
22130-60 = "에리두……"
22130-61 = "여기에 아리스 쨩이……"
22130-68 = "좋았어. 예상대로 <물류수송용 무인열차>를 탈취해서 현장까지 도착하는 데는 성공했어."
22130-69 = "응. 베리타스의 도움이 컸네. 즉석에서 가볍게 열차 시스템을 해킹할 줄이야."
22130-70 = "역시 필요하다면 밀레니엄 학생기록부의 해킹도 서슴지 않는 실력답다니까요!"
22130-74 = "그거, 말에 뼈가 있지 않아?"
22130-75 = "어쨌거나 조심해. 그 통로를 지나 지상으로 나가게 되면 거기서부터는 정말로 <에리두>의 구역이니까."
22130-76 = "우리가 눈이 빠져라 화면을 들여다보고 있긴 한데 말이야~"
22130-77 = "이쪽에서 캐치하지 못한 위험이 현장 어디에서 불쑥 나타날지 모르니, 부디 주의를."
22130-78 = "[s] \"응. 고마워.\""
22130-79 = "우선은 작전대로 C&C가 날뛰면서 시선을 끌기 전까지는 이곳에서 얌전히……."
22130-84 = "우와아앗?! 이, 이게 뭐야?!"
22130-85 = "어라, 제법 멋진 아이인걸. 길을 잃어 미아가 된 드론인 걸까?"
22130-86 = "[s1] \"아니아니아니, 그럴 리가 없지!\"\n[s2] \"이 녀석…… 리오가 다루는 드론이야……!\""
22130-87 = "설마……! 벌써 들킨 건가요?!"
22130-88 = "설마……! 벌써 들킨 건가요?!"
22130-89 = "아니, 괜찮아."
22130-91 = "들키기 전에 시스템 장악은 끝내놨어! 하는 김에 주변 네트워크는 우리가 해킹했으니까 괜찮아!"
22130-93 = "엄청나게 막무가내네!"
22130-94 = "뭐, 베리타스니까 가능한 일이야. 나쁘지 않은 도입부인걸."
22130-95 = "[ns] \"좋았어! 그럼 모두 전투 준비!\""
