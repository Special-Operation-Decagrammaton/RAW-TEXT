[translation]
84308100300-12 = "……저기."
84308100300-13 = "우선 상황을 좀 여쭤봐도 괜찮을까요, 여러분들?"
84308100300-19 = "혹시나 해서 여쭙는 것입니다만……"
84308100300-20 = "……지금까지 쭉 이곳에 계셨던 분이, 여러분 자신들이었나요?"
84308100300-26 = "그, 그게……!!"
84308100300-30 = "……응? 어라?"
84308100300-31 = "뭐, 뭐죠? 네루 선배가 아니……야……?"
84308100300-35 = "어, 어째서 여기 계신 거예요!? 아니, 애초에 어떻게 들어오신 거예요!?"
84308100300-36 = "완전히 똑같은 질문을 제가 먼저 드린 것 같은데……"
84308100300-37 = "하지만 대략적인 상황은 알겠네요. 저희가 발견한 '수상한 침입자'는 여러분들이셨군요."
84308100300-38 = "수상한 침입……!? 우리가!?"
84308100300-39 = "어째서!! 우리가 우리 부스에 있었을 뿐인데!!"
84308100300-41 = "언니, 폐장 이후에는 들어오면 안 되는 거 알고 있었잖아. 아무리 우리라도 지금은 수상할 수밖에 없어."
84308100300-42 = "굉장합니다. 그 어려운 던전을 뚫고 여기까지 당도하다니! 역시 세이아 씨는 왕도적입니다!"
84308100300-44 = "(왕도적……)"
84308100300-45 = "하지만 걱정하실 필요는 없습니다! 우리들이 여기 온 이유는, 우리의 게임을 보다 더 훌륭하게 만들기 위함이었으니까요!"
84308100300-46 = "보다 더 훌륭하게……?"
84308100300-48 = "벼, 별 건 아니고…… 그저 아쉬웠던 부분의 패치를 진행하고 싶었어요. 하지만 이미 출품한 작품이다 보니, 타이밍을 잡기 어려워서요."
84308100300-49 = "……아하."
84308100300-50 = "과연, 이해했어요. 폐장 이후에 숨어든 게 아니라, 폐장 이후로도 나가지 않고 여기 숨어 계셨던 거군요."
84308100300-51 = "몰래 숨어드는 행동 같은 건 하지 않았다고요! 우리는 나쁘지 않아!!"
84308100300-52 = "……사실상 잠입이나 다를 것 없는 행동이긴 합니다만."
84308100300-53 = "아무튼 알겠습니다. 그런 일이라면 저도 더 이상 여러분에게 따로 조치를 취할 필요는 없어 보이네요."
84308100300-54 = "그만 돌아가서, 상황을 잘 설명하는 것 정도로 상황을 종료하려 합니다. 괜히 놀라게 만들어서 미안해요."
84308100300-56 = "아닙니다! 왕도적의 돌발 출현 이벤트, 아리스는 너무나 즐거웠습니다!"
84308100300-57 = "……잠시만요. 그런데 그…… 방금 말씀하신 '상황을 잘 설명한다'라는 거 때문인데요."
84308100300-58 = "따지고 보면 세이아 님도 밀레니엄 학생이거나 엑스포의 진행 요원은 아니시잖아요? 어떻게 저희가 여기 있다는 걸 알고 오신 거예요?"
84308100300-59 = "아니 애초에…… 누구에게 상황을 설명하시려는 거예요?"
84308100300-64 = "아, 죄송해요. 그러고 보니 말씀드리지 않았군요."
84308100300-65 = "그건……."
84308100300-70 = "미카모 네루입니다."
84308100300-76 = "……에."
84308100300-77 = "뭐?"
84308100300-78 = "……네?"
84308100300-80 = "그러면 저는 이만……."
84308100300-84 = "자, 잠시만요. 세이아 님. 잠시만요!"
84308100300-85 = "자, 잠깐! 잠깐!!"
84308100300-87 = "끄아아아아아-!!"
84308100300-89 = "게임 오버였습니다아아아아-!!!"
