[translation]
10015050-1 = "5화;황륜대제에 반대하는 모임"
10015050-4 = "이거…… 대운동회에 사용하는 로봇 맞지?"
10015050-5 = "아무리 봐도 '전차' 같은데……"
10015050-6 = "이런 흉악한 물건을 어디에 쓰려고 만든 거지?"
10015050-7 = "공굴리기 경주에서 쓰는 고무 공 대신 굴린다던가……?"
10015050-8 = "이런 무거운 쇳덩어리를 손으로 굴릴 수 있겠어? 게다가 아래에 바퀴도 달려 있는데?"
10015050-9 = "아니면 달리기 경주에서 페이스 조절을 위해 뒤에서 계속 쫓아온다던가……"
10015050-10 = "로봇의 추격을 피해 하염없이 도망쳐야 한다니, 생각만 해도 끔찍해……"
10015050-11 = "흥…… 이제 와서는 놀랍지도 않아."
10015050-12 = "그 녀석들은 건강한 신체를 가꾼다느니, 친목을 도모한다느니— 여러 가지 핑계를 대면서 다른 사람들을 괴롭혀 왔으니까."
10015050-13 = "분명 이 전투 로봇도 녀석들이 만든 사악하고 끔찍한 고문 기계 중 하나겠지."
10015050-15 = "……역시 대운동회는 중단되어야 해!"
10015050-20 = "방금 대운동회 이야기를 하셨나요?"
10015050-21 = "히, 히이익?!"
10015050-22 = "트, 트레이닝부의 부장……? 어느 틈에……?"
10015050-23 = "아, 놀라게 해드렸다면 죄송합니다."
10015050-24 = "운동을 마치고 돌아가는 길에 갑자기 대운동회라는 말이 들려와서요."
10015050-25 = "이런 늦은 시간까지 주무시지 않고 이야기꽃을 피우시는 걸 보니……"
10015050-26 = "역시 여러분도 내일 있을 대운동회를 기대하고 계셨던 모양이군요!"
10015050-28 = "그게 그러니까……"
10015050-29 = "우리는 대운동회를 기대하고 있던 게 아니라……"
10015050-30 = "후후, 부정하지 않으셔도 괜찮습니다. 내일의 대회가 기대되어서 잠을 이루지 못하던 것은 저 역시 마찬가지였니까요."
10015050-31 = "대운동회, 그것은 체육 활동을 통한 학생의 완성……"
10015050-32 = "학원을 가리지 않고 서로 화합하며, 공정하게 선의의 경쟁을 치르는 평화의 제전이 다름 아닌 저희 밀레니엄 학원에서 열리게 되었다니……"
10015050-33 = "잠이 오지 않을 만큼 흥분되는 게 당연하지요!"
10015050-36 = "(이 사람…… 어째서 답하지도 않았는데 제멋대로 이야기를 이어가는 거야?)"
10015050-37 = "(이래서 체육계 학생은 상대하기 껄끄럽다니까……)"
10015050-39 = "그나저나 여러분은 어느 종목에 출전하실 예정이신가요?"
10015050-40 = "엿들을 생각은 아니었지만, 아까 얼핏 공굴리기 경주라는 이야기를 들은 것 같습니다만……"
10015050-41 = "그, 그러니까… 맞아! 우리는 공굴리기 경주에 나갈 예정이었어."
10015050-42 = "그래서 대회를 앞두고 마지막으로 작전을 검토하던 중이었거든……"
10015050-43 = "공굴리기 경주에서 작전이요?"
10015050-44 = "여, 역시 공굴리기 경주에서 작전을 짜는 건 이상한가……?"
10015050-45 = "아뇨. 좋은 자세라고 생각합니다!"
10015050-49 = "공굴리기 경주는 세간의 인식과는 달리, 만만한 운동이 아니니까요!"
10015050-55 = "공을 안정적으로 이송하기 위해서는 충분한 상체 근력과 반환점에서 재빠르게 공의 방향을 제어할 수 있는 순발력이 필요합니다."
10015050-57 = "거기에 트랙에서 발생할 수 있는 불규칙 바운드를 고려하여 방향 전환에 용이한 스터드를 착용하고 하체 근력을 단련해야—"
10015050-68 = "어, 음……"
10015050-69 = "저기, 이제 슬슬 우리는 보내주면 안 될까……"
10015050-75 = "스미레 부장, 거기에 있는 학생들 절대 놓치지 마!"
10015050-76 = "어라? 선생님과 베리타스의 부원 여러분? 그리고……"
10015050-85 = "엔지니어부의 마이스터 여러분까지? 그보다 그 옷차림은 도대체……."
10015050-86 = "그게, 이 옷은 그러니까……"
10015050-87 = "기세를 따라 선생님을 쫓아오다 보니…… 갈아입을 기회가 없었다고 해야 할까요."
10015050-92 = "이 의상에 대해 설명을 드리자면, 히비키가 재작년에 코스프레 취미를 갖기 시작했을 때까지 거슬러 올라갑니다만—"
10015050-93 = "미안, 코토리. 시간이 없으니까 설명은 잠시 생략할게."
10015050-94 = "결론부터 말하자면……"
10015050-95 = "거기 있는 학생들이 우리의 응원 로봇을 훔쳐 간 범인이야!"
10015050-96 = "응원 로봇을 훔쳐 간 범인……?"
10015050-98 = "응원…… 로봇?"
10015050-99 = "응원……?"
10015050-100 = "[s1] \"왜 다들 놀라는 거야…….\"\n[s2] \"설마…… 범인을 잘못짚었나?\""
10015050-103 = "응원 로봇 같은 걸 훔친 적은 없다고! 우리는 그저……"
10015050-104 = "맞아! 우리는 그저 대운동회를 방해하려고 폭탄을 터트리거나, 서버를 해킹하긴 했지만, 응원 로봇 같은 건—"
10015050-105 = "아, 앗차……"
10015050-107 = "후후. 아무래도 이들이 범인인 게 틀림없는 모양이네요."
10015050-108 = "여러분이 대운동회를 방해하려 하시는 이유는 모르겠지만, 이쯤에서 그만두어 주시겠어요?"
10015050-109 = "<황륜대제>는 많은 학생의 염원이 담긴, 전 키보토스의 축제입니다."
10015050-110 = "여러분의 방해 때문에 저희 세미나는 물론이고, 많은 학생들이 곤란해하고 있습니다."
10015050-111 = "지금이라도 로봇을 돌려주고 물러가신다면 이 일은 불문에 부치겠습니다만……"
10015050-112 = "만약 저희 세미나의 냉혹한 회계가 뒤늦게 이 사실을 알게 된다면……"
10015050-113 = "어떤 반응을 보일지는 장담하기 어렵겠네요."
10015050-115 = "세미나의 냉혹한 회계라면…… 그 유우카 회계 말이야?"
10015050-116 = "……그러고 보니 나도 소문을 들은 적이 있어."
10015050-117 = "엉뚱한 발명품을 만들어 유우카 회계의 심기를 거스른 어느 학생이 연구비를 전액 삭감당한 채 파산했다고……"
10015050-118 = "밀레니엄 학원의 학생에게 연구비 전액 삭감은 사형 선고나 다름없는데…… 이 어쩜 무시무시한……"
10015050-120 = "하지만 그런 협박에 굴할 만큼 우리 <황.반.모>의 각오는 무르지 않아!"
10015050-121 = "[s] \"황.반.모……?\""
10015050-122 = "그래. 우리는 <황륜대제에 반대하는 밀레니엄 학생들의 모임>……"
10015050-123 = "줄여서 <황.반.모>야!"
10015050-124 = "밀레니엄의 학생 모두가 대운동회의 개최를 고대하고 있을 거라 생각했다면 오산이라고!"
10015050-125 = "대운동회를 반대하는 학생들이 있었다니, 그럴 수가……"
10015050-126 = "무, 물론 열심히 대운동회를 준비해 온 학생들에겐 미안하지만……"
10015050-127 = "우리에게도 물러설 수 없는 우리만의 이유가 있다고!"
10015050-129 = "……그래서 훔쳐 간 응원 로봇은 어디에 있어?"
10015050-130 = "돌려주지 않겠다면 강제로라도 회수할 테니까."
10015050-132 = "그러니까 우리는 응원 로봇 같은 건 훔친 적 없다니까?"
10015050-133 = "아무래도 말이 통하지 않는 것 같으니…… 하는 수 없지."
10015050-134 = "엔지니어부에서 훔쳐 온 이 '전차'로 상대해 주겠어!"
10015050-139 = "나와라, <트랙 크래셔>!"
10015050-145 = "[ns] \"저, 저게 뭐야?!\""
10015050-146 = "잠깐, 여기에 전차가 있다는 소리는 못 들었다고!"
10015050-147 = "아하하! 저거 뭐야, 엄청 멋지잖아!"
10015050-148 = "저 공 모양의 로봇, 엔지니어부에서 만든 거야? 채색은 조금 아쉽지만 디자인은 정말 쿨한데!"
10015050-149 = "……응. 아직 무사히 작동하는 것 같아서 다행이야."
10015050-151 = "그보다 <트랙 크래셔>라니, 아쉬운 작명 센스인걸."
10015050-152 = "만약 시간이 좀 더 남았더라면 저 로봇에 어울리는 더 멋진 이름을 지어주었을 텐데."
10015050-153 = "……이런 말 하긴 뭣하지만, 우타하 선배의 작명 센스는 조금 엉뚱한 구석이 있으니까요."
10015050-154 = "……일단은 <트랙 크래셔>로 괜찮지 않을까?"
10015050-155 = "음. 사용자가 만족하는 것 같으니 이견은 없지만……"
10015050-156 = "……엔지니어부 여러분?"
10015050-161 = "도면을 보았을 때 이미 어느 정도는 예상하고 있었지만……"
10015050-163 = "저 전차는 도대체 뭔가요?"
10015050-164 = "어, 그게…… 그러니까……"
10015050-165 = "보다시피, 응원 로봇이야."
10015050-166 = "………"
10015050-172 = "튼튼한 장갑으로 둘러싸여 있는데요?"
10015050-173 = "불의의 사고에도 고장 나지 않도록 튼튼하게 설계해달라고 부탁하셨으니까요."
10015050-174 = "튼튼하게 열처리를 한 장갑은 어지간한 탄환에도 끄덕 없답니다!"
10015050-181 = "외륜 무한궤도는……"
10015050-182 = "관객을 안내하고 이동하려면 회장의 어떤 장소든 쉽게 이동할 수 있어야 하니까……"
10015050-183 = "경사로가 많은 스타디움 내에서도 안심하고 쓸 수 있어."
10015050-190 = "……15mm 기관포는 어째서 달려있는 건가요?"
10015050-191 = "대운동회가 아무리 평화의 제전이라고 하지만, 평화를 시기하는 무뢰배들은 어디에나 있는 법이니까."
10015050-192 = "불의의 사태를 대비하여 자체적으로 무력 진압을 할 수 있도록 전투 모드를 탑재했지."
10015050-193 = "과연……"
10015050-194 = "[s] \"……설득되지 마!\""
10015050-195 = "어머나, 실례. 너무나도 참신한 아이디어라 저도 모르게 감탄하고 말았네요."
10015050-203 = "그보다 지금 만담이나 하고 있을 때야? 저 전차 좀 어떻게 해 봐!"
10015050-204 = "……여쭈어 보고 싶은 건 산더미 같지만, 아무래도 지금은 느긋하게 대화를 나눌 타이밍이 아닌 것 같네요."
10015050-205 = "선생님. 일단 현장의 지휘를 부탁드리겠습니다."
