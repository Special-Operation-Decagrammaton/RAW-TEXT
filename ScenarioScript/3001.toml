[translation]
3001-1 = "통조림의 그림자 1"
3001-4 = "사설 보안자문 업체, <블랙스톤> 사무실"
3001-9 = "후후…… 계획은 순조롭게 잘 진행되고 있군."
3001-10 = "길거리의 불량배들을 고용해 군소 학교들을 습격하게 하고, 적당한 타이밍에 보안 용역을 제공한다……"
3001-11 = "카이저 그룹의 낡은 수법을 따라한 것뿐이지만 생각보다 잘 먹히는군."
3001-12 = "이대로 사업을 확장시켜 나가면 언젠가는 카이저 그룹을 뛰어넘는 거대한 군수 기업을—"
3001-19 = "보스…… 아니, 사장님! 습격입니다!"
3001-20 = "뭐라고? 어떤 간 큰 녀석들이 감히 우리 회사를 습격한 거지?"
3001-21 = "설마 발키리의 참새 녀석들이……? 방위실의 임원들에게는 입막음 비를 충분히 챙겨주었을 텐데……!"
3001-23 = "겨, 경찰은 아닙니다. 그게…… SRT의 특수 요원들입니다!"
3001-24 = "SRT?! SRT 특수학원은 이미 총학생회에 의해 폐쇄된 게 아니었단 말인가?"
3001-25 = "어떻게 우리의 존재를 눈치채고 이곳에……"
3001-26 = "그으읏…… 이 사업에 들인 돈이 얼마인데……"
3001-27 = "이대로 물러설 수는 없어!"
3001-34 = "SRT다! 모두 손을 들고 물러서!"
3001-35 = "여기는 RABBIT 1. 현재 시각은 1330시. 포인트 위스키에 도착."
3001-36 = "……출입구에서 경미한 저항이 있었으나 진압되었습니다. 이어서 작전을 속행합니다."
3001-38 = "이 녀석들…… 여기가 어디라고 감히……!"
3001-40 = "당신이 이 보안자문 업체의 대표이신가요?"
3001-41 = "지난주 발키리 경비국으로부터 '우연히' 입수한 보고서를 통해, 그동안 군소 학교를 습격해 온 불량배들의 배후에 여러분이 있다는 증거를 확보했습니다."
3001-42 = "……발키리 경비국은 증거를 확보했음에도 불구하고, 방위실의 복잡한 행정 절차 때문에 계속 검거 기회를 놓친 모양이더군요."
3001-43 = "하지만 그런 수법은 저희 SRT 특수 요원들에게는 통하지 않습니다!"
3001-45 = "그으으읏…… 설마 생각지도 못한 곳에서 꼬리가 잡힐 줄이야……"
3001-46 = "하지만 공들여 키운 회사를 너희 같은 애송이에게 빼앗길 수는 없지!"
3001-47 = "나 또한 오랫동안 용병일을 해 온 PMC의 수장. 근접전에는 어느 정도 자신이 있다고!"
3001-53 = "덤벼! 덤비라고!"
3001-60 = "서, 설마 이 거리에서 저격이……"
3001-66 = "……여기는 RABBIT 4. 목표에 착탄을 확인."
3001-67 = "이어서 저격을 속행……"
3001-69 = "읏, 보스가 쓰러졌어……"
3001-70 = "모든 게 다 들통 난 마당에 SRT의 특수 요원들과 싸울 의리도 없고……"
3001-71 = "도, 도망치자!"
3001-72 = "그대로 도망치게 둘 줄 알고?"
3001-83 = "A 사이트 클리어. 실내에 남아있는 적은 더 이상 없는 것 같네."
3001-84 = "……B 사이트도 클리어. 도망간 적을 제외하면 모두 제압했어……."
3001-85 = "수고하셨습니다, 여러분."
3001-86 = "무력화된 적은 포박한 뒤, 사후 처리는 발키리 경찰학교의 학생들께 부탁드리도록 하죠."
3001-87 = "저희는 이제 캠프로 복귀를……"
3001-89 = "그나저나 PMC의 기지라고 들었는데, 뭔가 쓸 만한 물자는 없었어?"
3001-90 = "어차피 압류되어 처분될 물자라면 우리가 조금 가져다 써도 괜찮을 것 같은데."
3001-91 = "아쉽지만 여기 있는 무기는 대부분 소화기뿐이고, 그마저도 저희가 갖고 있는 무기와는 호환이 되지 않는 장비와 탄약이 대부분이라……"
3001-92 = "이대로 폐기하거나 발키리 경찰학교에 맡기는 수밖에 없겠네요."
3001-94 = "으음. 보상을 바라고 온 건 아니지만, 전리품이 하나도 없다니 아쉬운 걸……"
3001-95 = "어라? 미야코 쨩, 사키 쨩. 여기에 있는 상자들은 뭐야?"
3001-96 = "뭔가 위에 '음식'이라고 쓰여 있는 것 같은데……"
3001-102 = "이건…… 전투식량이군요."
3001-103 = "게다가 유통기한도 아직 충분히 남았어."
3001-104 = "후후, 의외의 소득인걸? 이런 곳에서 식량을 구하게 될 줄이야."
3001-105 = "뭐야, 뭐야. 먹을 게 있다고?"
3001-107 = "전투식량이라면 보존성과 휴대성을 높이기 위해 특수 처리한 보존식……."
3001-108 = "캠프에서 야영을 이어가고 있는 저희에게는 가장 적합한 식량이라 할 수도 있겠네요."
3001-109 = "게다가 이만한 양이라면…… 당분간 음식 걱정은 하지 않아도 괜찮겠어."
3001-111 = "……으음, 그런데 어째 메뉴가 영 별로인데."
3001-112 = "<체다 치즈가 들어간 채식 오믈렛>, <오트밀 포리지>, <한랭지용 동결 건조 팥밥>……"
3001-117 = "윽, 거기에 해물비빔소스 캔도 있네. 이거 진짜 맛없는데……."
3001-118 = "……네? 전투식량은 원래 맛이 없는 게 당연하지 않나요?"
3001-119 = "전투식량이 맛이 없다는 것도 옛날이야기지, 요즘은 그렇지도 않다고."
3001-120 = "맛있는 음식은 병사들의 사기에도 직결되는 문제인 만큼, 극한 상황을 대비해 일부러 먹기 어렵게 만든 특수전용 식량이 아니고서야 일부러 맛없게 만드는 경우는 거의 없어."
3001-121 = "옛날에는 보존 기술이 한정되었기 때문에 딱딱하고 향미가 부족한 전투 식량밖에 만들 수 없었지만, 요새는 기술의 발달로 불이 없는 야지에서도 촉촉하고 풍부한 향의 음식을 즐길 수 있지."
3001-122 = "게다가 요즘은 채식주의자를 위한 두부 고기나 알레르기가 있는 병사를 위한 특수 메뉴도 개발되어서, 기호에 맞게 다양한 전투식량을 즐길 수 있어."
3001-124 = "그, 그렇군요……."
3001-125 = "그런데 사키 쨩…… 전투식량에 대해서 너무 잘 아는 것 같은데……"
3001-126 = "성분이라면 몰라도 맛까지는 교범으로 알 수 없지 않아……?"
3001-127 = "그러게. SRT의 훈련 중에 실제 전투식량을 먹어본 건 두 번 정도밖에 없었잖아?"
3001-129 = "그, 그건 그러니까……"
3001-130 = "전투식량은 특수부대의 주식이라는 말도 있고, 어떤 맛일지 궁금하기도 해서……"
3001-131 = "SRT 학원에 입학하기 전부터 이것저것 개인적으로 사서 먹어봤으니까……"
3001-132 = "뭐야. 맨날 교범만 들먹이길래 고지식한 줄만 알았는데, 은근히 비슷한 구석이 있잖아?"
3001-133 = "솔직히 말해봐, 사키. 너도 사실 SRT에 입학한 이유가 다양한 군사 장비를 만져보고 싶어서 그랬던 거지?"
3001-134 = "같은 오타쿠끼리 싸우지 말고 솔직하게 이야기해 보자구. 쿠후후……"
3001-135 = "시, 시끄러워! 내가 너 같은 줄 알아?!"
3001-137 = "어찌 되었든 생각지도 못했던 소득이 생겨서 다행이네요."
3001-138 = "자, 모두 먹을 만큼 전투 식량을 충분히 챙겨서 돌아갑시다."
3001-140 = "(……그날 밤.)"
3001-147 = "……현재 시각은 0500시. 경계 근무 중 이상 무……."
3001-151 = "오늘은 달빛도 어둡고, 소음도 거의 들려오지 않는 것 같아……."
3001-152 = "이런 날 경계 근무를 서는 건 무서워서 싫은데……"
3001-153 = "그래도 오늘 경계가 끝나면 모처럼 맛있는 통조림을 먹을 수 있으니까…… 좀 더 힘내야지."
3001-154 = "사키 쨩의 말처럼, 맛있는 음식이 기다리고 있다는 건 기분 좋은 일이네……"
3001-159 = "이 소리는…… 혹시 도둑……?"
3001-160 = "설마 낮에 가져온 식량을 노리고……"
3001-166 = "저, 정지! 움직이면 쏘겠습니다!"
3001-170 = "어라? 식량 창고에는 아무도 없는데……"
3001-175 = "들짐승이라도 들어왔던 걸까……"
3001-183 = "딸깍……"
3001-184 = "어라, 방금 저 통조림……"
3001-189 = "……움직였어?"
3001-194 = "설마 그럴 리가……"
3001-201 = "……딸깍, 딸깍, 딸깍, 딸깍!"
3001-202 = "…………!?!!#%$!"
