[translation]
10045110-1 = "제11화;물러날 수 없는 싸움"
10045110-2 = "나구사 씨. 당신이 저의 상대인가요?"
10045110-3 = "우후훗, 확실히 당신은 강자. 이 와카모의 상대로 손색이 없군요."
10045110-4 = "그렇다면 바로……."
10045110-5 = "아니. 너와 맞서는 건 내가 아니야."
10045110-6 = "네? 그렇다면 누가……?"
10045110-7 = "네 상대는……."
10045110-12 = "키쿄야!"
10045110-16 = "난 부표 위에서 싸워 본 적이 없어서…… 승리를 장담할 수 없어."
10045110-17 = "지금 이런 장소라면…… 키쿄야말로 네 상대에 적합해."
10045110-18 = "소녀도 그렇게 생각하여요."
10045110-19 = "지금의 키쿄 선배라면, 상대가 누구든 엘~레강트하고 파~워풀한 경기력을 보여주시겠죠!"
10045110-21 = "그냥 흘려 넘길 수 없는 말이네요. 진심인가요?"
10045110-22 = "……부정은 하지 않을게."
10045110-23 = "이즈나와 렌게는 직전까지 경기를 진행했고, 치세는 아직 회복 중이야."
10045110-24 = "준결승 진출자 중 체력적으로 가장 유리한 사람이 나야."
10045110-25 = "……가장 먼저 떨어진 것이 이런 나비효과를 불러오다니. 정말 재미있네."
10045110-27 = "역시 키쿄 선배! 그 자신감 넘치는 모습, 기다리고 있었사와요!"
10045110-28 = "그럼 잘 부탁한다고. 우린 뒤에서 응원하고 있을 테니까."
10045110-33 = "선생님. 여기는 내가 나서도 문제없겠지?"
10045110-34 = "[s1] \"물론이지!\"\n[s2] \"부탁할게!\""
10045110-37 = "그럼 지금부터 키쿄 선수 대, 와카모 선수의 이벤트 매치가 있겠습니다!"
10045110-39 = "오옷! 이건 놓칠 수 없어!"
10045110-40 = "얘들아, 어느 쪽이 이길 것 같아?"
10045110-41 = "으음…… 아무래도 일곱 죄수 쪽이지 않을까요?"
10045110-42 = "저, 저는 백화요란이 이길 거 같아요! 내일분의 간식도 걸 수 있어요!"
10045110-44 = "엥? 이건 간식을 거는 흐름인 건가?! #n으으으음……."
10045110-45 = "그럼 난 일곱 죄수에 걸래!"
10045110-46 = "부탁할게……! 꼭 이겨 달라고……! #n내 간식이 걸렸어……!"
10045110-47 = "……다들 엄청 기대하고 있네."
10045110-48 = "아무튼 시작하자. 이쪽은 준비 끝났어."
10045110-49 = "우후훗, 자신이 있으신지요?"
10045110-50 = "자신이 있고 없고의 문제가 아니야."
10045110-51 = "내가 해야만 해."
10045110-52 = "아아. 그 기개, 잘 보았습니다. 그럼 어서 시작하도록 하죠."
10045110-53 = "선생님의 선택을 받는 사람이 누가 될지를……!"
10045110-55 = "자, 그럼 바로 경기를 시작하겠습니다!"
10045110-56 = "[ns] \"정정당당하게…… 승부!\""
10045110-64 = "(역시 재액의 여우. 강해……!)"
10045110-65 = "이 와카모, 선생님을 위해 승리를 가져가겠어요!"
10045110-66 = "크읏……!"
10045110-72 = "아아, 키쿄 선수! 점점 코너로 몰리고 있습니다! 이대로 바다에 빠지고 말 것인가!"
10045110-73 = "……역시 힘과 운동신경은 와카모가 한 수 위."
10045110-74 = "하지만 분명 키쿄는 해낼 거야. 지금의 키쿄는 그 어느 때보다 강하니까……!"
10045110-76 = "(상대의 힘은 압도적이야.)"
10045110-77 = "(마치 거스를 수 없는 거대한 파도와 같은 힘. 이 힘을 이겨내려면…….)"
10045110-79 = "좀 더 열심히 팔다리를 휘저어! 몸에서 힘 빼고! 안 그럼 계속 가라앉을 거야!"
10045110-80 = "으윽…… 힘을 빼고 열심히 팔다리를 휘저으라니, 그게 말이 되는 거야?"
10045110-81 = "거스를 수 없는 힘엔 똑같이 힘으로 맞서면 안 돼. 그러니까 긴장을 풀고 즐기는 거야."
10045110-82 = "너라면 어떤 느낌인지 금방 알게 되겠지."
10045110-84 = "(흐름에 몸을 맡기면 돼.)"
10045110-85 = "(부담 없이. 그저 내가 잘하는 것을 하면서.)"
10045110-92 = "궁지에 몰린 키쿄 선수, 여기서 반격이닷! #n와카모 선수 공격을 피해서, 발을 거는 동작……!"
10045110-93 = "그대로 회전을……?!"
10045110-94 = "저 기술은……!!"
10045110-98 = "[ns] \"떴다! 키쿄의 실타래 잡기!\""
10045110-99 = "크윽?! 뭐, 뭐죠?! 빠져나갈 수가……!"
10045110-100 = "실뜨기의 기초야."
10045110-101 = "이런 실뜨기가 어디 있어요!"
10045110-102 = "상대를 옭아맨다는 점에선 비슷하지."
10045110-103 = "아앗, 와카모 선수! 당황했는지 제대로 대응하지 못합니다……!"
10045110-105 = "역시 키쿄. 효율적인 힘으로 상대를 제압하는 방법을 알고 있어."
10045110-106 = "하, 하지만 렌게 선배는 저 기술을 풀어냈었잖아요?"
10045110-108 = "아니, 솔직하게 말하면…… 그때도 아슬아슬했어."
10045110-109 = "그런데, 지금의 키쿄는 그 기백이 달라……!"
10045110-110 = "으, 으으으읏……!"
10045110-116 = "……조금, 얕본 모양이네요."
10045110-118 = "오오, 와카모 선수! 키쿄 선수의 실타래 잡기를 풀어냈습니다!"
10045110-120 = "언제든 덤벼. 몇 번이든 걸어줄 테니까."
10045110-121 = "그렇다면 그 전에 제압해 드리죠……!"
10045110-129 = "……!!"
10045110-130 = "부표 위는 탄성 때문에 생각보다 몸의 움직임이 커지지."
10045110-131 = "그렇게 흥분해서 커다란 동작으로 다가오는 건, 다시 잡아달라고 부탁하는 것과 같아……!"
10045110-132 = "……!!"
10045110-133 = "와카모 선수! 다시 키쿄 선수에게 잡히고 말았습니다!"
10045110-134 = "……그래. 평범한 싸움이었다면 키쿄가 와카모에게 밀렸을지도 몰라."
10045110-135 = "하지만 익숙한 전장에서 준비된 전법이 있는 키쿄라면……!"
10045110-136 = "역시 키쿄 선배가 유리했던 것이어요!"
10045110-138 = "키쿄 선수! 과연 이대로 승리를 굳힐 수 있을 것인가……!!"
10045110-139 = "(그렇게 한창 치열한 대결이 벌어지던 순간…….)"
10045110-146 = "……어라? 이건 또 무슨 일이?"
10045110-147 = "[s] \"발판이 폭발한 거 같은데…….\""
10045110-148 = "앗?! 거기까지?!"
10045110-149 = "키쿄! 뒤에! 파도가……!!"
10045110-158 = "아앗, 갑자기 이런 변수가!"
10045110-159 = "경기의 행방은 비디오 판정을 기다려주세요……!"
10045110-165 = "발판이 폭발하다니……."
10045110-166 = "그러네. 하지만 먼저 빠진 건 그쪽이야."
10045110-167 = "설마. 그럴 리 없습니다."
10045110-172 = "오오, 승자! 키류~ 키쿄……!!"
10045110-177 = "이건……."
10045110-178 = "갑자기 발생한 큰 파도에 휩쓸린다 해도……#n<먼저 바다에 빠진 쪽이 패배>라는 게 룰이라는 건가요."
10045110-179 = "그럼 선생님과의 약속대로 이번엔 깔끔히 물러나도록 하죠. 하지만 다음번엔……."
10045110-181 = "그래. 도전이라면 얼마든지 받아주겠어."
10045110-182 = "흐음, 그나저나 당신……."
10045110-183 = "……상당히 특이하게 헤엄을 치시는군요. 마치……."
10045110-184 = "그만. 거기까지. 더 이상 말하지 마."
10045110-186 = "자……! 여차저차 이벤트도 끝났으니 결승을 재개할 준비를……."
10045110-191 = "이, 이번엔 또 뭐죠?!"
10045110-192 = "[s] \"아무래도 고장 난 게 여러 군데인 것 같네…….\""
10045110-193 = "아, 안돼! 진행요원들! 어서 불길을 제압해 주세요……!"
10045110-194 = "[ns3] \"이미 늦은 느낌이…….\"\n[ns4] \"……역시 마지막엔 폭발 엔딩인가.\""
