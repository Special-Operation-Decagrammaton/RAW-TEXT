[translation]
80000085-1 = "SRT、補給します！"
80000085-2 = "（ある日ミヤコの頼みで、シャーレの調理実習室を貸すことになった）"
80000085-3 = ""
80000085-7 = "先生、場所を貸していただきありがとうございます。"
80000085-8 = "簡単な料理なら、公園でも作れるのですが……"
80000085-9 = "今から作るものは、他の隊員に知られたくなかったので。"
80000085-10 = "[s] \"大丈夫だよ、必要な時はいつでも来てね。\""
80000085-12 = "[ns] \"ところで、何を作るの？\""
80000085-13 = "その……もうすぐバレンタインデーでしょう？#n街のお店には、色んな種類のチョコレートが並んでいましたし。"
80000085-14 = "なのに私たちのキャンプには、硬くて苦い、#n軍用チョコレートしかなかったので……"
80000085-15 = "いつも頑張っているみんなのために、#n何か甘いものを作ってあげたいと思ったんです。"
80000085-16 = "そういえば、バターや卵に砂糖まで頂いてしまって……本当にありがとうございました。"
80000085-17 = "手持ちの食材だけでは、正直足りないと思っていたので。"
80000085-18 = "先生に助けていただけなかったら、#n今回の作戦は計画段階で終わっていたでしょう。"
80000085-19 = "[s] \"気にしないで。食材が余って困ってたから。\""
80000085-20 = "ふふ、ありがとうございます。"
80000085-21 = ""
80000085-24 = "あ、焼き上がったみたいですね。"
80000085-25 = "取り出してきます。"
80000085-26 = ""
80000085-28 = ""
80000085-29 = ""
80000085-30 = ""
80000085-31 = "[ns] \"わあ……！おいしそう！\""
80000085-32 = "チョコレートを使った、キャロットケーキです。"
80000085-33 = "生地に細かく切ったにんじんを入れると、#n食感がよくなって、甘さも和らぐんですよ。"
80000085-34 = "……まあ一番のメリットは、小麦粉を節約できるという点ですが。"
80000085-35 = "[s] \"すごいね……どこでやり方を習ったの？\""
80000085-36 = "どこで……というわけではありませんが、特殊部隊はよく野営をしますので。#n簡単な調理くらいはできるようになりました。"
80000085-37 = "SRT特殊学園にいた時も、#n時々飯ごうをオーブン代わりにして、小さなパンを焼いたりしましたね。"
80000085-38 = "ふふ、なんだか懐かしいです……。"
80000085-39 = "……4つあるので、3つはみんなに渡して……。"
80000085-40 = ""
80000085-42 = ""
80000085-43 = ""
80000085-44 = ""
80000085-45 = ""
80000085-47 = ""
80000085-48 = "……先生。よろしければこのケーキ、#n受け取っていただけませんか？"
80000085-49 = "せっかく作りましたし……日頃のお礼もできたら、と。"
80000085-50 = "[s1] \"でもこのケーキ……。\"\n[s2] \"ミヤコの分じゃ……？\""
80000085-51 = "……私は、作っている途中に味見をしましたので。"
80000085-52 = "……私は、作っている途中に味見をしましたので。"
80000085-53 = "それに、ウサギに甘いものは良くないと言いますし……。"
80000085-54 = "このケーキを、一緒に……？"
80000085-55 = "……いいのですか？#n分けて食べるには、もともと少ない量だと思うのですが……。"
80000085-56 = "[s3] \"私がミヤコと食べたいんだ。\"\n[s4] \"甘い物は誰しも、食べ過ぎると良くないからね。\""
80000085-57 = "……ふふ、そうですね。"
80000085-58 = "……ふふ、そうですね。"
80000085-59 = "いつも気遣ってくださって、ありがとうございます。#nでは、いただきましょう。"
80000085-61 = "（ミヤコと一緒に、甘いキャロットケーキを味わった）"
