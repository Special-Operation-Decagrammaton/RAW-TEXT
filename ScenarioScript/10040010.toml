[translation]
10040010-1 = "제1화;공범"
10040010-2 = "후후후……."
10040010-4 = "이렇게 한 해도 거의 다 지나갔다. 어느덧 마지막 날……."
10040010-5 = "정말로 폭풍 같은 한 해였지. 지금 만끽하는 이 여유가, 마치 거짓말처럼 느껴질 만큼."
10040010-6 = "……하지만 살아남았다."
10040010-7 = "그래, 나는 결국 또 살아남았지. 나의 행복을 시기하고 가로막는 수많은 싸움을 견뎌낸 거야."
10040010-8 = "스스로 생각해도, 조금은 그런 자신이 자랑스럽군. 그러니……."
10040010-9 = "역시 조금은 괜찮겠지. 파란만장한 삶을 살아온 나를 위하여, 작은 선물 정도는 말이야."
10040010-14 = "……그러니 고독한 축배를 들도록 해볼까."
10040010-15 = "잘못된 세상을 위해, 그리고…… 그 안에서 자유를 갈망하는 고독한 영혼인 나를 위해."
10040010-19 = "……\"Cheers\"."
10040010-26 = "……아."
10040010-31 = "\"아\"는 무슨……. 또 뭐 하고 있는 거야? 모니터에는 이상한 배경 사진이나 띄워 놓고……."
10040010-32 = "예쁜 야경 사진이네요. 분위기를 맞추고 있던 건가요, 코유키 쨩?"
10040010-34 = "이상한 사진이라니!? 무슨 말을 그렇게 하죠!? 선배는 눈치도 무드도 없는 건가요!?"
10040010-35 = "내가 너한테 눈치 없다는 말을 들어야 한다고……?"
10040010-36 = "지금 고달픈 스스로를 위한 치료 중인 거 안 보이시냐고요! 고독한 1인 연말 파티를 하고 있었잖아요!!"
10040010-37 = "아니, 반성실에서 하라는 반성은 안 하고 연말 파티를 하고 있다는 점에서 이미 아웃인데……."
10040010-38 = "애초에 뭐가 고달픈 건데!? 그게 지금 고달픈 사람의 모습이야? 완전 편해 보이는데!?"
10040010-39 = "하……! 어이가 없네요! 이게 대체 어디가 편해 보인다는 건가요!? 이게 다 누구 때문인데!!"
10040010-40 = "너 때문이잖아!! 또 세미나 예산을 가져다 써서 이렇게 된 거고!"
10040010-41 = "이번에는 또 어디다 쓴 거야!? 대체 뭘 샀길래……!"
10040010-42 = "세미나 돈은 개인 자금이 아니니까 쓰면 안 된다고 그렇게나 말했는데, 언제까지……!!"
10040010-46 = "하아……."
10040010-47 = "생각해보면 어쩌면 반성이라는 걸 모르는데 굳이 이렇게 반성실에 가두는 의미가 있을까 싶고……."
10040010-49 = "……!?"
10040010-50 = "오, 그럼 풀어주는 건가요!?"
10040010-51 = "……?????? 이 무슨……."
10040010-52 = "절대 그런 뜻이 아니잖아. 방금 건……."
10040010-53 = "네에에에에-!? 그치만 방금 가둬도 소용없다고 했잖아요!?"
10040010-54 = "아아아아~!!! 날 속였어! 너무하다, 아무튼 너무하다!! 이런 건 좋지 않아요!!!"
10040010-55 = "너무 어긋난 논리라 대응조차 하고 싶지 않네."
10040010-57 = "코유키 쨩 답네요."
10040010-59 = "하……!"
10040010-60 = "들어보세요, 선배. 그래요, 뭐 백 보 양보해서 여기선 제가 좀 잘못했다고 치죠."
10040010-61 = "백 보 양보……? 했다고 쳐……?"
10040010-62 = "하지만 아무리 그렇다고 해도, 오늘은 무슨 날이죠? 연말이죠? 그것도 마지막 날이죠?"
10040010-63 = "그런 날에 다른 곳도 아닌 반성실이란 이름의 감옥에 혼자 갇혀 있다니……!"
10040010-64 = "이건 좀 너무하지 않나요? 한 해의 마지막이라고요?"
10040010-65 = "이런 날에……. 뭐라도 해야 하지 않겠습니까?"
10040010-70 = "반성을 하라고!!!"
10040010-76 = "반성!"
10040010-80 = "을!"
10040010-84 = "좀!"
10040010-88 = "하라고, 어!!"
10040010-92 = "반성, 어! 반성!!"
10040010-97 = "아따따따따-!! 폭력 반대-!!!"
10040010-98 = "에휴, 정말이지……."
10040010-99 = "알았어. 알았으니까 일단 얌전히 있어. 심심하다 그 말이지?"
10040010-105 = "……?? 뭐죠, 그 반응은?"
10040010-106 = "유우카 쨩……? 뭔가 생각이라도 있는 건가요?"
10040010-108 = "코유키 넌 알 거 없으니 일단 기다려."
10040010-109 = "노아, 그……. 미안한데, 혹시 오늘 시간 좀 괜찮아?"
10040010-110 = "음? 저는 전혀 문제없어요."
10040010-111 = "고마워. 그럼 시간을 좀 빌릴게. 부탁할 게 있어서."
10040010-112 = "코유키! 방금도 말했듯이, 너는 또 이상한 짓 하면 진짜 그때는 가만 안 둘 테니까!"
10040010-113 = "가만 안 둔다니, 대체 또 뭘 하려고……."
10040010-117 = "……헉!"
10040010-118 = "설마 또 노아 선배까지 동원해서 저를……!!"
10040010-119 = "갑자기 노아는 또 왜……. 아니, 애초에 왜 노아만 무서워하는 건데!?"
10040010-120 = "코유키, 너 명백히 나랑 노아를 대하는 태도가 다른 거 알고 있어!? 나는 만만하다 이거야!?"
10040010-121 = "아무리 노아가 기억력이 좋다고 해도……!"
10040010-122 = "아뇨, 뭐……. 아니, 아닌 건 아니지만 딱히 그것 때문만은 아니고……."
10040010-123 = "으음. 이걸 뭐라고 해야 하지? 그치만 선배도 어느 정도 느끼고 있지 않나요?"
10040010-124 = "노아 선배 특유의 그 뭐랄까……. 기묘한 프레셔……?"
10040010-125 = "뭔가 말을 하고 있어도 무슨 생각을 하는지 잘 모르겠다는 느낌……? 같은 거?"
10040010-126 = "……없으신가요?"
10040010-130 = "…………."
10040010-132 = "……?"
10040010-133 = "………………."
10040010-134 = "……?????"
10040010-135 = "……그……."
10040010-136 = "본인 앞에서 할 이야기는 아닌 것 같다는 생각, 들지 않는 걸까요? 코유키 쨩……?"
10040010-137 = "……아."
10040010-138 = "그…… 어……. 음, 선배. 그러니까……."
10040010-142 = "…………."
10040010-147 = "……따흐흑!"
10040010-149 = "……???? 그게 무슨 소리야? 노아가 뭐가 어때서? 생각을 모르겠다니?"
10040010-150 = "무슨 또 말도 안 되는 소리를……. 노아가 너 같은 줄 알아? 그런 게 있을 리 없잖아!"
10040010-151 = "노아가 가끔 장난기가 있긴 해도, 너처럼 속을 모를 아이는 아니라고!"
10040010-157 = "우, 우와……. 세상에, 방금 발언 실화냐……."
10040010-159 = "뭐, 뭐야……. 그 표정……."
10040010-160 = "아, 아뇨 뭐……. 네. 유우카 선배는 늘 지금 같은 모습으로 있는 편이 좋을 거 같네요."
10040010-161 = "……!?"
10040010-168 = "뭐, 뭐예요!? 왜요!? 이번에는!!"
10040010-169 = "잘은 모르지만 뭔가 기분 나빠서."
10040010-170 = "아무튼 말 그만 돌리고, 아까 했던 말의 대답은? 얌전히 있을 거지?"
10040010-171 = "네……."
10040010-172 = "……후……. 피곤해……. 가자, 노아."
10040010-178 = "…………."
10040010-179 = "……뭐, 뭐죠. 선배……?"
10040010-180 = "……후후."
10040010-181 = "별로……. 아무것도 아니에요."
10040010-191 = "…………."
10040010-192 = "…………크크큭."
10040010-193 = "……갔나……?"
10040010-198 = "크크크큭……. 니하, 니하하하……!!"
10040010-200 = "(……같은 시각. 샬레.)"
10040010-207 = "[ns1] \"아……. 일 인간적으로 너무 많다…….\"\n[ns2] \"마지막 날에 이게 무슨 꼴이야…….\""
10040010-211 = "네!? 연말 업무 정산을 아직도 다 안 끝내셨다고요? 그, 그게 무슨……. 이제 연말이잖아요?"
10040010-212 = "아니, 이게 다 얼마야……! 이런 일이 있으셨으면 차라리 말을 하시지!!"
10040010-213 = "선~생~님~!!"
10040010-215 = "……네?"
10040010-216 = "마감 자체는 다음 주까지니까 일단은 놔둬도 된다고요? 그런 게 어딨어요!?"
10040010-217 = "선생님! 이건 '연말' 정산이라고요! 그래도 오늘 안에는 다 끝내셔야죠!"
10040010-218 = "예? ……포기요? 아니, 게임 같은 게 아니거든요!?"
10040010-219 = "포기 같은 거 없으니까요! 당장 시작하세요!"
10040010-220 = "나중에 꼭 확인할 테니까요……!!"
10040010-221 = "……꼭이에요!!"
10040010-223 = "(………….)"
10040010-224 = "(음. 완전히 자업자득.)"
10040010-229 = "[ns3] \"……?? 이 시간에 연락이?\"\n[ns4] 연락을 받아본다."
10040010-234 = "……오, 받았다."
10040010-235 = "야호-! 선생님! 안녕하세요!!"
10040010-236 = "[s5] \"코유키? 무슨 일이야?\"\n[s6] \"이런 시간에 연락이라니, 신기하네.\""
10040010-239 = "에이~. 왜 이러세요, 저희 사이에. 연말인데 전화 좀 할 수도 있지, 안 그래요?"
10040010-243 = "그런데 지금 뭐 하세요? 아마 일 하고 계시겠죠? 선생님의 일이니까."
10040010-244 = "아, 아뇨. 그냥. 뭐……. 그냥 그러고 계실 거 같아서요."
10040010-245 = "……예?"
10040010-246 = "……? 아니, 아니 하. 선생님, 진짜!"
10040010-247 = "아무리 그래도 \"놀리려고 연락한 거냐\"니, 좀 너무하시네요! 제가 그런 이미지에요!?"
10040010-248 = "뭐어……."
10040010-249 = "물론 아무 할 말도 없이 연락 드린 건, 당연히 아니지만 말이지요. 후후……."
10040010-250 = "놀리는 건 아니지만, 선생님께서 혹하실 만한 것이긴 하거든요."
10040010-251 = "바로……."
10040010-252 = "기대하시라, 두구두구두구두구……!!"
10040010-257 = "[ns7] \"……!? 이, 이건 무시퀸 카드팩……!?\"\n[ns8] \"잠깐, 어……? 신팩이 나왔다고!?\""
10040010-260 = "니하하하하!! 역시 알아보시는군요! 따끈따끈한 신팩이죠, 풀린 지 얼마 안 돼서 매물도 없는 초판 에디션이고 말이죠!"
10040010-261 = "지금부터 이 통의 팩을 하나하나 뜯어볼 거랍니다~. 어떤 신카드가 들어있을지 궁금하지 않으신가요~?"
10040010-262 = "……네?"
10040010-263 = "어디서 구했냐고요? 그야 돈 주고 샀죠……?"
10040010-264 = "그 돈은 어디서 났냐고요? 그야……."
10040010-268 = "……그건 왜 물어보시죠?"
10040010-269 = "[s9] \"이 녀석, 나중에 또 혼나려고…….\"\n[s10] \"나중에 어쩌려고 그러냐, 너.\""
10040010-272 = "나중……? 나중에……?"
10040010-273 = "니하하하하!! 선생님, 재미있는 말씀을 하시는군요. 나중이라니요?"
10040010-274 = "오늘은 한 해의 마지막 날이라고요! 나중이라니, 그럼 내년이겠네요?"
10040010-275 = "무슨 내년 걱정을 지금부터 하시는 거예요? 정말 걱정도 팔자셔~."
10040010-276 = "항상 현재에 충실하자고요, 현재에! 그리고 그 현재, 지금은 바로 이 팩이 중요한 거 아니겠어요? 그렇죠? 제 말이 맞죠?"
10040010-277 = "[s11] \"과연, 사고방식이…….\"\n[s12] \"이건 또 참신한 발상…….\""
10040010-280 = "아무튼!! 중요한 것은 그게 아닙니다! 지금부터 이 팩을 뜯을 거란 말입니다!"
10040010-281 = "모처럼 이 역사적 순간을 선생님과 함께하려고 연락드렸던 건데, 그런 말씀이나 하시고!"
10040010-282 = "……네? 그런데 지금 어디냐고요?"
10040010-283 = "그야 뭐, 늘 그렇듯 반성실인데요?"
10040010-287 = "[ns13] \"늘 그렇듯……. 늘 그렇듯…….\"\n[ns14] \"반성실은 언제 제 용도를 찾는 거야?\""
10040010-290 = "니하하하!! 뭐예요, 그 표정! 적잖이 감탄하신 얼굴이네요!!"
10040010-291 = "그래서, 언제 오실 거예요? 오실 때까지 기다릴 거긴 하지만요! 밤은 기니까요!"
10040010-292 = "……네?"
10040010-293 = "못 와요……? 일이 많아서 오늘은 안 돼……?"
10040010-294 = "오늘 안에 많이 해 두지 않으면 내일 유우카 선배에게 혼난다고요……?"
10040010-295 = "그게 무슨……."
10040010-299 = "하아아……."
10040010-300 = "선생님. 제가 방금 드린 말씀을 어떻게 들으신 거예요."
10040010-301 = "그건 결국 내년의 일이라고 말씀드렸잖아요?"
10040010-302 = "벌써부터 오지도 않은 먼 미래가 무서워 용기를 내지 못한다니, 선생님답지 않네요?"
10040010-303 = "[s15] \"……??? 나, 나다운 게 뭐길래?\"\n[s16] \"아니, 뭐 이런 말도 안 되는…….\""
10040010-306 = "크큭. 이거, 이거. 안 되겠네. 이분……."
10040010-307 = "좋아요. 그렇게 나오시겠다면 저도 다 생각이 있으니까요. 선생님께서 거부하실 수 있을지 한 번 보도록 하죠."
10040010-308 = "후후……. 기대하시라……."
10040010-309 = "[s17] \"……? 코유키?\"\n[s18] \"뭘 하려는…….\""
10040010-315 = "자~ 들어갑니다~. 실시간 언박싱 중계방송~."
10040010-316 = "먼저 첫 번째 팩~."
10040010-317 = "간다아~!!"
10040010-321 = "[ns] \"………….\""
10040010-323 = "[ns19] \"……!!!!!!!\"\n[ns20] \"여기서 실황 중계를……!!\""
10040010-327 = "으음~. 별거 없네~."
10040010-328 = "니하하하!! 아, 이게 안 뜨네~. 한 장쯤 뜰 것도 같았는데~."
10040010-329 = "하긴 첫 팩부터 뜨길 바라는 건 조금 과욕이겠죠? 아직 팩은 꽤 있으니까요?"
10040010-330 = "뭐, 그렇다 해도, 이 통의 팩이 무한한 건 또 아니니, 조만간 다 뜯어서……."
10040010-336 = "……\"없어지긴 하겠죠\", 안 그래요? 선생님."
10040010-337 = "[s21] \"……!! 이, 이 자식……!!\"\n[s22] \"감히 이런 걸로 내게 도발을……!!\""
10040010-340 = "아~니, 뭐~. 저야 당연~히, 친애하는 선생님과 이 역사적 행위를 같이하고 싶었지만~?"
10040010-341 = "성실한 어른인 선생님께서는 그다지 카드에는 관심이 없어 보이시고~?"
10040010-342 = "그렇다면 뭐~. 어쩔 수 없이 저 혼자 다 뜯는 수밖에는 없지 않겠나요~?"
10040010-343 = "새 팩이라 아예 새로운 성능의 카드도 들어있을 수 있을지 모르는데~? 아니, 거의 확정일 텐데~?"
