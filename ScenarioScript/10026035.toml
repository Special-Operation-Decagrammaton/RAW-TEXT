[translation]
10026035-2 = "하아, 하아……. 하아……."
10026035-3 = "진짜 대체 뭐야, 저것들은……!?!? 왜 여기 있는 건데!?"
10026035-4 = "게다가…… 그 모양새에 그 복장은……!?"
10026035-5 = "으으……. 놀라서 다리에 힘이 풀려버렸어……."
10026035-6 = "[s1] \"괜찮아, 코하루?\"\n[s2] \"걸을 수 있겠어?\""
10026035-9 = "으, 으음……. 일단 어떻게든……."
10026035-13 = "히이이이!! 무, 무리! 무리무리무리! 다리가 너무 떨려서……!!"
10026035-14 = "[s3] \"……어쩔 수 없다.\"\n[s4] \"코하루. 일단 이리 와.\""
10026035-20 = "……!? 서, 선생님……!?"
10026035-22 = "음……. 결국 여기서 특별한 점은 딱히 발견할 수 없었네요……. 이곳은 대체 뭐지?"
10026035-23 = "……그나저나 늦으시네요, 두 분……. 혹시 길을 잃으신 건 아닌지……."
10026035-24 = "부지가 꽤 넓긴 했으니까요."
10026035-25 = "그런……. 혹시 모르니 제가 가서 한 번 찾아볼까요?"
10026035-26 = "아뇨. 이럴 때 성급하게 들어가면 그것대로 또 길 잃은 사람이 바뀔 뿐이라서……. 들어간다 하면 대책부터 미리 강구해야 해요……."
10026035-27 = "……아. 저기 오네요."
10026035-37 = "[ns5] \"어떻게든 빠져나왔다…….\"\n[ns6] \"정말 깜짝 놀랐어.\""
10026035-40 = "다행이네요, 선생님. 마침 좋은 타이밍에 도착하셨어요."
10026035-41 = "그러잖아도 찾으러 갈까 생각하고 있었는데……."
10026035-42 = "네? 저희는 괜찮냐고요? 그게 무슨 말씀이신지……."
10026035-43 = "……네?"
10026035-44 = "미메시스……라고요? 수영복을 입은……?"
10026035-45 = "미, 미메시스요!? 갑자기 어째서……. 왜 여기에……?"
10026035-46 = "어라……. 그렇군요……. 음. 확실히……."
10026035-47 = "아예 불가능한 이야기는 아닐지도 모르겠네요. 시스터후드의 유적지이기도 하고……."
10026035-48 = "어, 어째서 아무도 수영복에 대해 따지지 않는 거죠……."
10026035-49 = "후후……. 말씀드렸듯 그런 건 사소한 문제이기도 하고……."
10026035-50 = "……그나저나……. 어머나……."
10026035-51 = "……후후. 이건 저도 예상하지 못했는데……."
10026035-52 = "[s7] \"……? 예상?\"\n[s8] \"갑자기 무슨 말이야?\""
10026035-55 = "선생님……."
10026035-56 = "우선 등에 업고 계신 사람부터 내려 주는 게 먼저이지 않을까요?"
10026035-57 = "[s] \"………….\""
10026035-59 = "[ns] \"……?????\""
10026035-60 = "……코하루 쨩……♡"
10026035-61 = "잠깐 안 보인 그사이에, 두 분 꽤나 굉장한 일들을 하고 오신 것 같군요……?"
10026035-62 = "진짜야. 정말이지 엄청났다니까! 하나코도 직접 봤어야……."
10026035-63 = "……응?"
10026035-64 = "어라? 하, 하나코? 갑자기 그건 또 무슨 소리야?"
10026035-65 = "코하루 쨩……. 그렇게……."
10026035-66 = "선생님 등에 찰싹 붙어 업혀서는……."
10026035-71 = "……?"
10026035-72 = "이거? 어……. 이, 이건……."
10026035-77 = "아, 아냐! 아냐아냐아냐아냐아냐아냐!! 아니라고! 이건 그런 게 아니야!!"
10026035-78 = "이건 단지 다리에 힘이 풀려서……."
10026035-79 = "……어머나♡"
10026035-80 = "아니라니까!! 아니야! 아니라고!!! 이건 그런 게 아니야!!!"
10026035-82 = "아니야아아아아아!!!!!!!!!!!!"
