[translation]
1600105-1 = "메이드의 깜짝 선물"
1600105-3 = "(여느 때처럼 철야를 하던 밤이었다. 그럼에도 불구하고, 업무는 끝이 보이질 않았다.)"
1600105-8 = "(……잠깐 쉬겠다는 책상에 머리를 뉘었더니, 그대로 의식이 날아가버렸다……)"
1600105-11 = "(……)"
1600105-12 = "……인님?"
1600105-13 = "……주인님?"
1600105-16 = "주인님? 으음. 이상하다. 슬슬 일어날 때가 된 거 같은데……"
1600105-17 = "[s] \"아스나……?\""
1600105-18 = "아, 일어났네! 정신이 들어? 주인님! 약속대로 아스나가 왔어!"
1600105-19 = "마침 되게 피곤해 보여서, 보답의 봉사를 해줄 수 있는 기회라고 생각했지!"
1600105-20 = "여기가 어디냐고? 생활관인데? 주인님이 자고 있길래, 내가 안아서 데려왔는데?"
1600105-21 = "응? 왜 놀라는 거야? 정말~. 아무리 피곤하다고 책상에서 그냥 자면 어떻게 해!"
1600105-22 = "온 사방에 각성 드링크랑 서류뭉치만 쌓여서는…… 그러다간 몸 버리겠어."
1600105-23 = "자, 자. 오늘 하루만이라도 전~부 잊어버리고, 아스나의 봉사를 받는 거야, 알았지?"
1600105-24 = "마침 조금 있으면 도착하게끔 배달음식도 주문해 뒀으니까, 같이 먹는 거야! 주인님!"
1600105-25 = "……응? 뭐라고? 메이드가 배달요리를 주문해도 되냐고?"
1600105-26 = "아니, 그것보다 어떻게 들어왔냐고? 그게 무슨 말이야? 당연히 현관으로 들어왔지."
1600105-27 = "……현관 비밀번호?"
1600105-28 = "으음~? 대충 이거겠지~ 하는 느낌으로 누르니까 맞았다면서 열리던데?"
1600105-29 = "……아하하하하!! 또 멍한 표정! 귀여워, 주인님!"
1600105-30 = "……응?"
1600105-31 = "아직 해야 할 일이 남아 있다고? 서류 분류작업? 아, 그 책상 위에 있던 것들?"
1600105-32 = "그거라면 내가 다 해 놨는데? 뭐, 제대로 읽고 한 건 아니지만."
1600105-33 = "대충 비슷하다 싶은 것들끼리 손 가는 대로 정리하긴 했는데…… 궁금하면 가져다줄까?"
1600105-35 = "(직후 아스나가 정리된 파일을 몇 개를 가져와서 보여주었다.)"
1600105-36 = "(대충 감으로 했다더니, 믿을 수 없을 정도로 정확하게 잘 분류가 되어 있었다.)"
1600105-37 = "응? 어떻게 한 거냐고? 뭘 어떻게 해? 그냥 대충 감으로 찍어서 한 건데?"
1600105-38 = "표정을 보아 하니 어떻게 제대로 잘 됐나 봐? 다행이네~."
1600105-39 = "아, 사무실 청소랑 빨래 같은 건 이미 다 해놨으니까, 주인님은 신경 쓸 거 하나도 없어."
1600105-40 = "뭘 하고 싶어? 일 빼고 뭐든지 말만 해보라고!"
1600105-41 = "식사? 목욕? 아니면……"
1600105-42 = "[s1] \"어깨가 좀 뭉쳐 있는데……\"\n[s2] \"……그럼 몸 쪽을 부탁해볼까.\""
1600105-43 = "오오-! 이젠 주인님도 아스나에게 부탁하는 게 점점 익숙해져 가는구나? 좋아좋아!"
1600105-44 = "오오-! 이젠 주인님도 아스나에게 부탁하는 게 점점 익숙해져 가는구나? 좋아좋아!"
1600105-45 = "자, 그럼 아스나의 특제 안마를 서비스해드리죠! 이래봬도 이거, 꽤 평들이 좋다고!"
1600105-46 = "자, 자. 몸을 돌려서 앉아보세요~."
1600105-48 = "목 뒤부터…… 어깨 쪽으로 이렇게~. 손으로 살짝 감싸 눌러서~."
1600105-52 = "(크게 힘주지 않은 부드러운 손길임에도, 거짓말처럼 뭉친 근육들이 풀리는 게 느껴졌다.)"
1600105-53 = "……어때? 좀 괜찮은 거 같아?"
1600105-54 = "아하하하하. 주인님 안마 받으면서 골골거리는 게 고양이 같은 소리를 내네?"
1600105-55 = "자, 끄읕-! 끝났습니다. 몸은 좀 회복이 되셨나요, 주인님?"
1600105-56 = "오오~! 기운 넘쳐 보이잖아? 다행이야. 왠지 모르게 뿌듯한 걸!"
1600105-57 = "응? 왜 내가 더 기분 좋아 보인다고? 그야 당연하지! 메이드잖아?"
1600105-58 = "주인님에게 한 봉사가 잘 됐다는 것이야 말로 메이드로서 최고의 즐거움이니까!"
1600105-59 = "사실은 에이전트 같은 거 아니냐고? 하하하! 그러니까 사소한 건 신경 쓰지 말래도……"
1600105-60 = "……응? 뭐라고?"
1600105-61 = "……이번에는 주인님이 아스나한테……?"
1600105-62 = "봉사를 해주겠다고……?"
1600105-63 = "……에? 그게 무슨 말이야? 주인님이 봉사를 하겠다는 뜻이 이해가 잘 안 가는데?"
1600105-64 = "……아~. 내가 해줬던 것처럼 어깨를 주물러 주겠다고? 나를?"
1600105-65 = "오오~! 좋아! 재밌겠는 걸! 메이드가 봉사를 받는다니 신선해!"
1600105-66 = "그럼 뒤돌아 앉아 있을 게. 이렇게 자리에 앉고~."
1600105-69 = "자, 준비 됐어! 잘 부탁해요. 주인님!"
1600105-70 = "[s] (아스나의 어깨를 주물러준다.)"
1600105-72 = "……"
1600105-73 = "……힉!?"
1600105-74 = "……?"
1600105-75 = "[s] \"……?\""
1600105-76 = "……???"
1600105-77 = "뭐, 뭐지? 뭐야. 방금 전에……? 뭘 한 거야 주인님?"
1600105-78 = "……? 에? 그냥 어깨를 주물렀을 뿐이라고?"
1600105-79 = "으, 으응? 아, 아냐. 아무 것도. 그냥 좀 놀라서……?"
1600105-80 = "괘, 괜찮아! 계속 해줘. 그대로 앉아 있을 테니까."
1600105-81 = "[s] (아스나의 목 아래쪽을 주물러준다.)"
1600105-83 = "……"
1600105-84 = "……하읏!!"
1600105-85 = "……??"
1600105-86 = "뭐, 뭐야!? 왜 이러지? 이런 느낌은 처음인데……?"
1600105-87 = "……? 응? 어? 뭐라고?"
1600105-88 = "그만하는 게 좋을 거 같다……고?"
1600105-89 = "아, 아냐! 아니야. 싫다는 게 아니라. 이건 그러니까, 그……"
1600105-90 = "으, 으음……"
1600105-91 = "그, 그럼 마지막으로! 마지막으로 한 번만 다시!"
1600105-92 = "아, 아니야. 긴장한 거 아니니까! 괜찮다니까? 그러니까……!"
1600105-93 = "……응. 응. 다, 다시 부탁해. 주인님……"
1600105-94 = "다, 다시……"
1600105-97 = "배달왔습니다아아아아-!!"
1600105-98 = "(……)"
1600105-99 = "(같이 배달음식을 먹은 후, 아스나를 돌려보냈다.)"
