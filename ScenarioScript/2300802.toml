[translation]
2300802-1 = "훌륭한 시스터"
2300802-2 = "트리니티 대성당 뒤편"
2300802-3 = "(마리의 안내를 따라 마리가 있다는 트리니티의 대성당 뒤편으로 향했다.)"
2300802-4 = "……여기예요. 선생님."
2300802-9 = "기다리고 있었답니다."
2300802-10 = "갑작스레 말씀드린 것이었는데, 와 주셔서 감사합니다."
2300802-11 = "네?"
2300802-12 = "시간대요? 아아. 죄송해요. 딱히 특별한 이유가 있는 건 아니었어요."
2300802-13 = "오늘은 빈 시간이 지금 정도였던 것뿐이었던 지라……."
2300802-14 = "[s1] \"미안해. 바빴던 모양이구나.\"\n[s2] \"좀 더 여유로운 날을 잡을 걸 그랬을까?\""
2300802-15 = "아아. 아닙니다. 그럴 리가요. 찾아와 주셔서 기쁜 걸요."
2300802-16 = "아아. 아닙니다. 그럴 리가요. 찾아와 주셔서 기쁜 걸요."
2300802-17 = "그저 늘 하던 성당에서의 일을 하고 있었을 뿐입니다. 특별히 일이 있는 날은 아니었습니다."
2300802-18 = "……네? 무슨 일이냐고요?"
2300802-19 = "아아. 그렇군요."
2300802-20 = "물론 시스터로서 해야 할 일들은 여러 가지가 있지만……."
2300802-24 = "제가 하는 일들은 대부분 고해성사를 들어드리고, 마음 속의 아픔에 공감해드리는 일이랍니다."
2300802-25 = "대단한 일은 아니지만, 때때로 그것 만으로도 스스로를 치유하고, 일어서시는 분들도 있으니까요."
2300802-26 = "……네? 상담사 같은 일이냐고요?"
2300802-27 = "……네. 어쩌면 비슷한 것일 지도 모르겠습니다."
2300802-28 = "물론 답을 내드리는 상담사 분들과 달리……. 전 그저 듣기만 하는 것이지만요."
2300802-29 = "그걸로도 도움이 된다면, 얼마든지 전 기쁘게 시간을 내 드릴 수 있답니다."
2300802-30 = "지금 이렇게, 선생님을 만나기 위해 나온 것처럼요."
2300802-31 = "그럼 이제……."
2300802-37 = "괜찮으시다면 선생님께서는 어떤 고민이 있는지, 감히 여쭤봐도 괜찮을까요?"
2300802-38 = "……네?"
2300802-39 = "따로 고민이 있어서 찾아온 건 아니시라고요……? 그냥 인사 겸……?"
2300802-40 = "아, 아아……. 그, 그렇군요. 죄송합니다. 저도 모르게 주제 넘는 착각을……."
2300802-41 = "……괜찮으시다고요?"
2300802-42 = "열심히 하는 것만 봐도 마음이 편해지는 것 같으시다고요?"
2300802-46 = "……후후후."
2300802-47 = "감사합니다. 선생님."
2300802-48 = "말씀만 들어도 오늘 하루 쌓였던 피로가 날아가는 기분이예요."
2300802-49 = "[s3] \"혹시 무리하고 있는 거 아냐?\"\n[s4] \"조금은 쉬면서 하는 게 어때?\""
2300802-50 = "……으으응."
2300802-51 = "……으으응."
2300802-52 = "말씀은 감사하지만 그럴 수는 없을 것 같습니다. 저에겐 아직 가야 할 길이 머니까요."
2300802-53 = "지금이야 이렇게, 성당과 찾아오는 신도분들 모두에게 귀여움을 받는 게 고작이지만……."
2300802-54 = "언젠가는 저도, 시스터를 넘어 한 명의 어엿한 '시스터'가 되고 싶다고 생각하고 있거든요."
2300802-55 = "[s5] \"시스터가 된다고?\"\n[s6] \"지금도 이미 시스터인 게 아니야??\""
2300802-56 = "음……. 조금 다르긴 한데……."
2300802-57 = "음……. 조금 다르긴 한데……."
2300802-58 = "시스터복을 입고 있다고 해서 모두 시스터라고 하기에는 조금 무리가 있겠지요."
2300802-59 = "아직 배울 점도 많고, 알아야 할 것들도 많고……."
2300802-60 = "스스로 '시스터'라 불리는 데에 아직은 부끄러움이 많은 상황이니까요."
2300802-61 = "언젠가 누군가 '시스터 마리'라고 불러 주셨을 때, 부끄럽지 않게 되는 것이 제 꿈이랍니다."
2300802-62 = "그래서 이렇게 제가 할 수 있는 건 뭐든지 최선을 다하고 싶은 거고요."
2300802-63 = "……네?"
2300802-64 = "제가……. 어른스럽다고요?"
2300802-65 = "마음가짐은 이미 시스터라고……요?"
2300802-66 = "노, 놀리지 마세요……! 제가 아직 멀었다는 건 누구보다도 제가 잘 아니까요……!"
2300802-67 = "바, 방금 건 못 들은 걸로 할게요. 선생님도 참……!"
2300802-68 = "[s7] \"훗. 불러주는 것 정도야 얼마든지 쉽지.\"\n[s8] \"시스터 마리! 시스터 마리!\""
2300802-69 = "그, 그만……! 그만해주세요!"
2300802-70 = "그, 그만……! 그만해주세요!"
2300802-71 = "[s] \"시스터 마리~!!\""
2300802-72 = "그만……!"
2300802-78 = "……!?"
2300802-84 = "서, 선생님?"
2300802-89 = "……괜찮으세요!? 선생님!?"
2300802-91 = "(다행히 크게 다친 것은 아니어서, 잠시 후 깨어나 샬레로 돌아왔다.)"
