[translation]
1014003-1 = "A Wise Fox"
1014003-2 = "Schale Executive Office"
1014003-3 = "Kurumi was Student Rep for the day, and we were sorting through some light administrative work."
1014003-4 = ""
1014003-6 = ""
1014003-7 = ""
1014003-8 = ""
1014003-9 = ""
1014003-10 = ""
1014003-11 = "Hm... Are we about halfway through?"
1014003-12 = "...Maybe it's because the sun is so hot, but Schale feels warmer than usual today."
1014003-13 = "[s1] \"Shall we take a break?\"\n[s2] \"Let's grab a drink and take a breather.\""
1014003-16 = "Sure!"
1014003-20 = "[ns] \"...Oh no, where did it go?\""
1014003-21 = "What's wrong, Sensei?"
1014003-22 = "[s3] \"I was trying to take the cap off of my drink...\"\n[s4] \"But I can't find the bottle opener anywhere.\""
1014003-25 = "What the... That's what you were worrying about?"
1014003-26 = ""
1014003-28 = ""
1014003-29 = "Give it to me. I'll open it for you. I just need a spoon."
1014003-30 = ""
1014003-32 = ""
1014003-35 = "[ns] \"Wow, how did you do that?\""
1014003-36 = "It's not a big deal. "
1014003-37 = "A bottle opener is essentially just a lever. So as long as you can fit it under the cap, you can use anything to open a bottle."
1014003-38 = "Carrying a bottle opener around during training would be annoying, so I had to learn how to open it with other tools."
1014003-39 = "[s5] \"This is exactly what the other members were talking about!\"\n[s6] \"You're very good at thinking on the spot, Kurumi!\""
1014003-42 = "This amount of praise for something as simple as opening a bottle..."
1014003-43 = "Well, I am FOX Squad's point woman. Improvisation comes with the territory."
1014003-44 = "I'm the one to lead the squad, the one to face the enemy, and the one to handle whatever else they may have waiting for us."
1014003-45 = "It's not necessarily the most useful skill for my Student Rep duties, but it could come in handy. For things like electronic repair or lockpicking..."
1014003-46 = "[s] \"Really?\""
1014003-47 = ""
1014003-50 = "[ns7] \"There's actually a lock I've lost the key to...\"\n[ns8] \"Could I ask you to unlock it?\""
1014003-53 = "Sure. Bring it to me."
1014003-54 = ""
1014003-55 = "This is...a pin tumbler lock. Give me ten seconds."
1014003-56 = "Just bend the end of a hair pin and match the height of the cylinder..."
1014003-57 = ""
1014003-59 = ""
1014003-60 = "Got it!"
1014003-61 = "[s9] \"That's amazing...!\"\n[s10] \"Is this how you broke into Schale...?\""
1014003-63 = "Gah! Why are you bringing that up now?!"
1014003-64 = "I'm still making up for it, okay...?"
1014003-65 = "Anyway! I'm glad you see my skills now! Quick-thinking adaptation is one of my strengths."
1014003-66 = "[s] \"Then can you open this, too?\""
1014003-67 = "H-Huh...?"
1014003-68 = "...This is an electronic lock."
1014003-69 = "It's a little annoying, but the location of the mechanism that disables the deadbolt is set..."
1014003-70 = ""
1014003-72 = ""
1014003-73 = "There, it's unlocked."
1014003-74 = ""
1014003-76 = "Are these wired earbuds? How did they get so tangled?"
1014003-77 = "Tangled knots can be undone by squeezing a wire through the knot and lightly twisting it in the other direction."
1014003-78 = ""
1014003-80 = ""
1014003-81 = "Like this... There, it's unraveled."
1014003-82 = "[s11] \"Amazing, absolutely amazing!\"\n[s12] \"Then lastly, can you open this?\""
1014003-85 = "This is..."
1014003-86 = "A puzzle ring!"
1014003-87 = "It's a toy that was made to be hard to solve! Are you playing with me?"
1014003-88 = "[s13] \"I thought the point woman could overcome any obstacle...\"\n[s14] \"...Are puzzle rings too difficult?\""
1014003-91 = "Not a chance! Give it here."
1014003-92 = ""
1014003-94 = ""
1014003-95 = "...What's with this strange structure? How was it put together?"
1014003-96 = "..."
1014003-97 = "G-Give me some time. I'll solve it in no time!"
1014003-102 = "After, I had a fun afternoon watching Kurumi struggle with the puzzle ring."
