[translation]
1014003-1 = "จิ้งจอกผู้ชาญฉลาด"
1014003-2 = "สำนักงานชาเล่ต์"
1014003-3 = "(คุณครูกำลังทำงานธุรการง่ายๆ ในชาเล่ต์กับคุรุมิที่มาเข้าเวร...)"
1014003-4 = ""
1014003-6 = ""
1014003-7 = ""
1014003-8 = ""
1014003-9 = ""
1014003-10 = ""
1014003-11 = "อืม... น่าจะทำได้ครึ่งหนึ่งแล้วมั้ยนะ?"
1014003-12 = "คงเป็นเพราะข้างนอกแดดแรง วันนี้ก็เลยรู้สึกว่าชาเล่ต์อากาศร้อนกว่าปกตินะ..."
1014003-13 = "[s1] \"เราพักสักหน่อยมั้ย?\"\n[s2] \"พักสักหน่อยแล้วไปหาอะไรดื่มกันเถอะ\""
1014003-16 = "ดีเลย!"
1014003-20 = "[ns] \"ตายจริง... ไปอยู่ไหนล่ะเนี่ย?\""
1014003-21 = "มีอะไรเหรอ คุณครู?"
1014003-22 = "[s3] \"ครูจะเปิดฝาเครื่องดื่มนี่น่ะ แต่ที่เปิดขวดมัน...\"\n[s4] \"ครูหาที่เปิดขวดไม่เจอนี่น่ะสิ\""
1014003-25 = "อะไรกัน กังวลกับเรื่องแค่นี้เนี่ยนะ?"
1014003-26 = ""
1014003-28 = ""
1014003-29 = "ส่งมานี่สิ เดี๋ยวฉันเปิดให้เอง แต่ขอยืมช้อนคันหนึ่งด้วยนะ"
1014003-30 = ""
1014003-32 = ""
1014003-35 = "[ns] \"ว้าว เมื่อกี้ทำยังไงน่ะ?\""
1014003-36 = "ไม่ใช่เรื่องยากอะไรหรอก "
1014003-37 = "ที่เปิดขวดน่ะใช้หลักการของคานดีดคานงัด ถ้าเป็นวัตถุที่มีความยาวพอจะสอดเข้าไปในซอกเล็กๆ นั้นได้ ไม่ว่าอะไรก็ใช้แทนที่เปิดขวดได้ทั้งนั้นแหละ"
1014003-38 = "ตอนฝึกภาคสนาม พวกฉันไม่มีเวลามานั่งจัดเตรียมของจุกจิกอย่างที่เปิดขวดหรอก ก็เลยต้องเปิดขวดเครื่องดื่มตอนอยู่กลางแจ้งเองบ่อยๆ ไงล่ะ"
1014003-39 = "[s5] \"ที่จริงครูก็ได้ยินมาจากสมาชิกในกองคนอื่นเหมือนกัน\"\n[s6] \"คุรุมิแก้ปัญหาเฉพาะหน้าได้เก่งจริงๆ เลยนะ!\""
1014003-42 = "แค่เปิดฝาขวดได้ ก็ได้คำชมว่าแก้ปัญหาเฉพาะหน้าเก่งเลยเหรอ ฉันต้องรู้สึกยังไงดีล่ะเนี่ย..."
1014003-43 = "แต่ก็นะ ในฐานะพ็อยนต์แมนแห่ง SRT ฉันก็ถือว่ารับมือกับสถานการณ์ที่ไม่คาดคิดได้ดีกว่า#nสมาชิกคนอื่นในกองอยู่แล้ว"
1014003-44 = "ก็พ็อยนต์แมนต้องคอยเดินนำหน้าทุกคน แล้วก็ต้องเข้าปะทะกับการดักซุ่มโจมตีของศัตรูหรือ#nสิ่งกีดขวางก่อนใครนี่นา"
1014003-45 = "ถึงฉันจะแทบไม่ได้แสดงทักษะนี้ในระหว่างมาเข้าเวรที่ชาเล่ต์ แต่ฉันก็ช่วยซ่อมของเล็กๆ น้อยๆ หรือปลดล็อกอุปกรณ์นู่นนี่ให้ได้นะ"
1014003-46 = "[s] \"จริงเหรอ?\""
1014003-47 = ""
1014003-50 = "[ns7] \"ครูมีแม่กุญแจที่ลูกกุญแจหายอยู่พอดีเลย...\"\n[ns8] \"งั้นช่วยปลดแม่กุญแจนี้ให้หน่อยได้มั้ย?\""
1014003-53 = "ได้สิ เอามาให้ฉันได้เลย"
1014003-54 = ""
1014003-55 = "นี่มัน... กุญแจระบบลูกปืนไม่ใช่เหรอ? ถ้างั้นก็ใช้เวลาไม่ถึง 10 วินาทีหรอก"
1014003-56 = "แค่ดัดปลายกิ๊บติดผมให้งอนิดหนึ่ง แล้วก็เอาไปดันสลักข้างในให้ได้ระนาบเดียวกันแบบนี้..."
1014003-57 = ""
1014003-59 = ""
1014003-60 = "ได้แล้ว!"
1014003-61 = "[s9] \"สุดยอดเลย...!\"\n[s10] \"เมื่อก่อนก็เข้ามาที่ชาเล่ต์ด้วยวิธีนี้หรือเปล่า...\""
1014003-63 = "เดี๋ยวสิ ทำไมจู่ๆ ถึงเอาเรื่องนั้นมาพูดล่ะ?!"
1014003-64 = "ฉะ... ฉันก็ยังสำนึกผิด... กับเรื่องในตอนนั้นอยู่นะ"
1014003-65 = "เอาเถอะ แค่นี้ก็พอรู้แล้วใช่มั้ยล่ะ ว่าฉันเก่งเรื่องแก้ไขสถานการณ์เฉพาะหน้าแค่ไหน—"
1014003-66 = "[s] \"งั้นช่วยปลดอันนี้ให้ด้วยได้มั้ย?\""
1014003-67 = "หะ... หืม...?"
1014003-68 = "นี่มันกุญแจระบบไฟฟ้านี่นา...?"
1014003-69 = "ถึงจะแอบยุ่งยากอยู่หน่อย แต่จุดที่จะช็อตไฟฟ้าเพื่อปลดล็อกสลักเดดโบลต์มันก็ถูกกำหนดไว้#nตายตัวอยู่แล้ว..."
1014003-70 = ""
1014003-72 = ""
1014003-73 = "เอ้า เปิดได้แล้ว"
1014003-74 = ""
1014003-76 = "ส่วนนี่ก็หูฟังแบบมีสาย? ไปทำท่าไหนมาถึงได้พันกันยุ่งเหยิงขนาดนี้เนี่ย?"
1014003-77 = "ถ้าเป็นปมเชือกที่พันกันจนยุ่ง แค่เอาลวดเส้นเล็กๆ สอดเข้าไปตรงกลางระหว่างปม แล้วหมุนกลับ#nด้านแบบเบามือ เท่านี้ก็คลายออกได้ง่ายๆ แล้ว"
1014003-78 = ""
1014003-80 = ""
1014003-81 = "แบบนี้ไง... ได้แล้ว"
1014003-82 = "[s11] \"สุดยอดเลย แก้ได้ทุกอย่างเลยนะ!\"\n[s12] \"งั้นช่วยปลดอันนี้ให้เป็นอันสุดท้ายได้มั้ย?\""
1014003-85 = "นี่มัน..."
1014003-86 = "<ห่วงแห่งปัญญา> นี่นา!"
1014003-87 = "เป็นของเล่นที่ออกแบบมาให้แก้ยากตั้งแต่แรกอยู่แล้วไม่ใช่เหรอ? หรือว่าคุณครูกำลังแกล้งฉันอยู่?"
1014003-88 = "[s13] \"ก็เห็นบอกว่าเอาชนะทุกอุปสรรคได้...\"\n[s14] \"ถ้าเป็นห่วงแห่งปัญญา ถือว่ายากไปงั้นเหรอ...?\""
1014003-91 = "ไม่มีทางหรอก ส่งมาสิ"
1014003-92 = ""
1014003-94 = ""
1014003-95 = "อะไรกัน... ทำไมโครงสร้างถึงแปลกแบบนี้ล่ะ ประกอบมายังไงเนี่ย?"
1014003-96 = "..."
1014003-97 = "ขะ... ขอเวลาฉันเดี๋ยวนะ ฉันจะรีบแก้ปริศนานี้ให้!"
1014003-102 = "(หลังจากนั้นคุณครูก็ดูคุรุมิแก้ห่วงแห่งปัญญาอย่างเอาเป็นเอาตาย และใช้เวลาช่วงเย็นด้วยกัน#nอย่างสนุกสนาน)"
