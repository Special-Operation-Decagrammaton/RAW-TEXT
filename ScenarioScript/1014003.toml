[translation]
1014003-1 = "睿智的狐狸"
1014003-2 = "夏萊辦公室"
1014003-3 = "（正和來值日的胡桃一起在夏萊處理著文書工作時……）"
1014003-4 = ""
1014003-6 = ""
1014003-7 = ""
1014003-8 = ""
1014003-9 = ""
1014003-10 = ""
1014003-11 = "嗯……現在大概處理完一半了吧？"
1014003-12 = "……或許是陽光太強的關係，感覺今天特別熱呢。"
1014003-13 = "[s1] 「要不要休息一下？」\n[s2] 「喝點飲料，稍微喘口氣吧。」"
1014003-16 = "好啊！"
1014003-20 = "[ns] 「……咦，跑哪去了？」"
1014003-21 = "怎麼了嗎，老師？"
1014003-22 = "[s3] 「我想開飲料的瓶蓋……」\n[s4] 「但不知道把開瓶器放到哪去了，怎麼找也找不到。」"
1014003-25 = "什麼啊。你就為了那點小事在煩惱？"
1014003-26 = ""
1014003-28 = ""
1014003-29 = "給我，我來幫你開。#n借我一支湯匙就好。"
1014003-30 = ""
1014003-32 = ""
1014003-35 = "[ns] 「哇，你剛才是怎麼辦到的？」"
1014003-36 = "又不是什麼難事。"
1014003-37 = "開瓶器是利用槓桿原理的工具……#n所以只要是能塞進縫隙的細長物品，任何東西都能代替開瓶器。"
1014003-38 = "訓練途中沒有多餘的心思特地帶開瓶器這種東西。#n所以在野外開飲料瓶時，我都是這麼做的。"
1014003-39 = "[s5] 「雖然我之前聽其他小隊隊員說過……」\n[s6] 「不過胡桃真的很擅長臨機應變呢！」"
1014003-42 = "光是開個瓶蓋就被稱讚擅長臨機應變，讓我有點五味雜陳……"
1014003-43 = "不過身為SRT的尖兵，我確實算是比其他隊員更能妥善應付突發狀況的類型啦。"
1014003-44 = "尖兵必須比小隊裡的任何人都更早衝在前頭，去面對敵人的突襲或障礙。"
1014003-45 = "雖然在夏萊幾乎沒有機會展現這項本領……#n不過如果是簡單修理故障的裝置或打開鎖具的話，我隨時都能幫忙。"
1014003-46 = "[s] 「真的？」"
1014003-47 = ""
1014003-50 = "[ns7] 「正好我這裡有一個弄丟鑰匙的鎖……」\n[ns8] 「可以拜託你解開嗎？」"
1014003-53 = "好，拿來我看看。"
1014003-54 = ""
1014003-55 = "這不是……針式彈子鎖嗎？#n這種程度的話，10秒就夠了。"
1014003-56 = "把髮夾的尖端稍微彎一下，對準彈子的高度……"
1014003-57 = ""
1014003-59 = ""
1014003-60 = "打開了！"
1014003-61 = "[s9] 「太厲害了……！」\n[s10] 「所以之前闖進夏萊的時候，也是用這種方式……」"
1014003-63 = "等等，你為什麼突然提起那件事！？"
1014003-64 = "那，那件事……我已經在反省了。"
1014003-65 = "總之，這樣你就明白了吧？#n我有多麼擅長臨機應變──"
1014003-66 = "[s] 「那這個也能解開嗎？」"
1014003-67 = "咦，咦……？"
1014003-68 = "……這不是電子鎖嗎？"
1014003-69 = "雖然有點麻煩，不過使鎖栓失效短路的位置是固定的……"
1014003-70 = ""
1014003-72 = ""
1014003-73 = "來，解開了。"
1014003-74 = ""
1014003-76 = "這是有線耳機？怎麼會纏成一團啊？"
1014003-77 = "打結的結只要在結與結之間塞進鐵絲，輕輕往反方向轉就能解開了。"
1014003-78 = ""
1014003-80 = ""
1014003-81 = "像這樣……好，解開了。"
1014003-82 = "[s11] 「好厲害！」\n[s12] 「那這個也解得開嗎？」"
1014003-85 = "這是……"
1014003-86 = "這不是「智慧環」嗎！？"
1014003-87 = "這一開始就是做得讓人很難解開的玩具吧？你現在是在耍我嗎？"
1014003-88 = "[s13] 「可是你不是說任何障礙都能突破嗎……」\n[s14] 「……難道智慧環很難嗎？」"
1014003-91 = "怎麼可能，拿來。"
1014003-92 = ""
1014003-94 = ""
1014003-95 = "……什麼啊，這奇怪的結構是怎樣？#n到底是怎麼組起來的？"
1014003-96 = "…………"
1014003-97 = "給，給我一點時間。#n我馬上解開給你看！"
1014003-102 = "（之後望著和智慧環較勁的胡桃，度過了愉快的午後時光）"
