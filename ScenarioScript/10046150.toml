[translation]
10046150-3 = "야호★"
10046150-4 = "미카 님?!"
10046150-5 = "아핫, 이치카 쨩~ 나기 쨩이 이상한 일 저질러서 고생하고 있다며~"
10046150-6 = "그래서 도와주려고 왔는데……."
10046150-10 = "……어라. 기뻐할 줄 알았는데."
10046150-11 = "혹시 나, 또 뭔가 잘못했으려나?"
10046150-12 = "아, 아니요! 그렇지 않습니다!"
10046150-13 = "그냥 좀…… 놀라서요."
10046150-14 = "아, 그래? 다행이다."
10046150-15 = "그래도 역시, 사람들이 있는 해변으로 돌아가시는 게 어떨까요?"
10046150-16 = "응? 왜?"
10046150-17 = "왜냐고 물으셔도…… 아무래도 저는 위험한 장소 위주로 순찰하니까……."
10046150-18 = "아, 혹시 걱정해 주는 거야?"
10046150-19 = "어, 네에, 뭐, 그런 셈이죠……? 티파티의 호위는 정의실현부 주요 업무 중 하나니까요."
10046150-20 = "그럼 괜찮아~"
10046150-21 = "나 이래 봬도 꽤 세거든!"
10046150-22 = "아하하…… 바로 그 미카 님이 싸우는 상황 자체를 막기 위한 순찰입니다만……."
10046150-23 = "뭐야, 티파티라고 따돌리기야?"
10046150-27 = "그러면, 으응, 이런 건 어때?"
10046150-28 = "티파티가 아니라, 이치카 쨩의 친구, 미소노 미카가 도와주러 왔다고 하면?"
10046150-29 = "……그게 그거 아님까?"
10046150-30 = "아핫! 역시 그런가?"
10046150-31 = "하하, 뭡니까~"
10046150-32 = "……어쩔 수 없네요."
10046150-33 = "응? 그 말은?"
10046150-34 = "넵, 잘 부탁드리겠슴다, 미카 님."
10046150-35 = "아싸! 무르기 없기야? 그러면 또 잘 부탁해!"
