63090-326 = "그러니까, 여러분! 사실 저희도 그렇게 공부를 잘하는 편은 아니었어요!"
63090-327 = "하지만 공부라는 것은 일종의 시스템이니까, 누구나 그걸 열심히 반복해서 학습하면……."
