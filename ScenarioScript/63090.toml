[translation]
63090-1 = "제9화;시험공부"
63090-4 = "안녕하심까, 사오리 씨! 생활은 어떠신가요!"
63090-9 = "신경 써 준 덕분에 잘 지내고 있다. 코노카 부국장…… 이었던가?"
63090-10 = "에이, 에이. 뭘 그렇게 딱딱하게 부르고 그럽니까! 코노카라고 부르면 됨다!"
63090-11 = "어차피 저보다 한 살 연상이잖슴까! 학년은 같지만요."
63090-12 = "으, 음. 알겠다. 코노카. 그런데……."
63090-13 = "쭉 감옥에 있었던 나를, 이제 와서 취조실로 부르다니, 무슨 일이라도 있는 건가?"
63090-14 = "아뇨, 뭐. 그냥 말 그대로 어떻게 지내나 싶어서 말이죠. 사오리 씨, 발키리 한정으로 그 나름 유명한 분이기도 하고요?"
63090-15 = "……그런가. 발키리에서 유명한 것은 그다지 좋은 일이 아닌 것 같지만."
63090-16 = "………키보토스 전역에서 유명한 것보다야 낫지 않겠슴까……."
63090-17 = "그것도 그렇겠군. 내가 이런 말을 하는 것도 이상하지만, 고생이 많군……."
63090-18 = "좋아요, 좋아. 어색한 시간은 이걸로 대충 붕~ 날려 버린 것 같고. 본론으로 들어가죠."
63090-19 = "당신들…… 아리우스 스쿼드 맞죠? 아리우스 스쿼드 앞으로, 공문이 하나 갱신돼서 말임다. 그 이야기 좀 하려고요."
63090-20 = "공문 갱신, 인가. 그렇다면 아마도 형량 관련 문제이겠군."
63090-21 = "네. 뭐, 그 비슷한 거죠."
63090-22 = "형량 자체는 정식 재판으로 확정받았다만……. 뭔가 여죄가 발견된 모양이지? 상관없다. 나는 무엇이든 받아들일 각오가 되어 있으니까."
63090-23 = "그것 참 신기하네요……. 사오리 씨는. 보통은 반대 태도인데 말임다."
63090-24 = "그, 그런가? 하지만……. 아리우스 출신은, 흔히 말하는 '보통'과는, 약간 다른 경우가 많아서 말이다."
63090-25 = "네, 네. 총학생회에서도, 드디어 아리우스 분교의 위치를 확정할 수 있게 되어서 다행이라는 것 같슴다. 아, 이건 별로 관계없는 이야기였구만요."
63090-26 = "아니. 내 학교에 관한 이야기라면 뭐든 좋다. 좋든 싫든, 그곳은 내 모교니까."
63090-27 = "……최악의 테러리스트를 양성한 학교 취급을 받는다 해도, 그 사실을 부정할 마음은 없다."
63090-28 = "과오까지 받아들이지 않으면, 나아갈 수 없게 되니까."
63090-29 = "좋은 말을 해 줬네요! 그래서 말입니다만……."
63090-35 = "……후회합니까?"
63090-36 = "그 테러, 말인가?"
63090-37 = "달리 뭐가 있겠어요."
63090-43 = "훗……."
63090-47 = "어라? 왜 웃으시죠?"
63090-48 = "아, 미안하다. 코노카나 발키리…… 심지어 트리니티를 비웃겠다는 의도는 전혀 없었어."
63090-49 = "단지……. 예전에, 누군가와 같은 대화를 했던 게 조금 기억나서 말이지."
63090-50 = "후회하냐고 물었지? 답은 간단하다."
63090-54 = "단 하루도, 후회하지 않은 날이 없었으니까."
63090-57 = "미숙하고 멍청한 애송이, 말이군요."
63090-58 = "그래. 지금은 사라져 버린, 바보 같은 애송이."
63090-59 = "하지만 분명히 나 자신인, 그 애송이 말이지."
63090-60 = "……."
63090-61 = "좋슴다. 역시 제가 생각하고 있었던 대로네요."
63090-65 = "뭐가 말이지?"
63090-66 = "뭐, 별거 아님다."
63090-67 = "그래도 일단 해야 할 말은 해야겠지요. 관례 같은 거니까요."
63090-71 = "축하드림다. 사오리 씨. 그리고 다른 스쿼드 분들도."
63090-72 = "가석방임다. 짐 챙기십쇼."
63090-77 = "……?"
63090-78 = "잘 이해가 안 가는군, 코노카. 그…… 새로운 종류의, 농담 같은 건가?"
63090-79 = "아니, 뭐……. 왠지 그런 식으로 반응할 것 같기도 했는데 말이죠……."
63090-80 = "빠르게 이어가겠슴다. 흐름 잘 따라오십쇼."
63090-81 = "아리우스 스쿼드의 죄와 형량은, 분명 남아 있습니다만, 집행 유예가 선고되었슴다."
63090-82 = "집행…… 유예? 하지만, 우리는 분명히 테러를……."
63090-83 = "네, 뭐. 그건 사실이긴 한데."
63090-84 = "……사실, 폭발이나 건물 붕괴 같은 건, 키보토스에서 잊을 만하면 일어나는 일이고 말이죠……."
63090-85 = "………그래서 키보토스 호황 산업 중 하나가, 건축업인 것이기도 하죠……."
63090-86 = "으, 으음……."
63090-87 = "그러니 키보토스의 범죄에서 가장 문제 사항으로 삼는 건, 살의와 악의, 뭐 그런 건데……."
63090-88 = "그랬나? 그 기준에 대해서는 처음 들었군. 하지만 그렇다면 더더욱……."
63090-89 = "네. 그 테러는 분명히 그 둘을 갖고 일어난 일이었슴다. 그 부분은 당신들도 인정해야 하고요."
63090-90 = "근데, 뭐. 들어 보니까, 다들 반성 잘하고 있는 것 같고 말이죠?"
63090-91 = "으, 음?"
63090-92 = "거기에 당신들, 심지어 자수까지 했잖슴까? 이야~ 문제아가 자수하다니, 정말 부국장 자리에 오른 다음에도 처음 보는 일임다!"
63090-93 = "스스로 자기 잘못을 반성하고 처벌을 원하는 학생이 있었다니, 키보토스의 미래도 그렇게까지 절망적인 것은 아니겠네요!"
63090-94 = "고, 고맙다……."
63090-95 = "(내가 할 말은 아닌 것 같지만, 일 처리를 이렇게 대충대충 해도 되나…….)"
63090-96 = "그리고 무엇보다 당신들이 살의나 악의를 가진 건, 결국 선생님과 트리니티였단 말임다. 그런데……."
63090-97 = "거기에서 좀, 탄원서가 왕창 왔슴다."
63090-102 = "심지어 게헨나에서도요."
63090-103 = "아, 이 부분 재미있었으니까 전달해 드리겠슴다."
63090-105 = "그래. 그런 일도 있었지."
63090-106 = "나 자신이 다쳤던 건 상관없었지만, 내가 정말로 화가 났던 건, 선생님에게 피해가 갔다는 사실이었어."
63090-107 = "그렇지만 그것도……."
63090-108 = "……어쨌든 선생님이 직접, 자기를 봐서라도 제발 용서해 달라고 했으니까. 그 부분은 더 이상 할 말이 없게 된 것도 사실이야."
63090-109 = "그렇다면 남은 건 마코토의 헤어 스타일 비용 정도인데……."
63090-110 = "……."
63090-111 = "됐어. 이 문제는 이제 정말로 아무래도 좋아."
63090-114 = "그래도, 되는 건가……?"
63090-115 = "그래도 되는 모양임다……."
63090-116 = "아무튼 뭐…… 일이 이렇게 되면, 우리도 특별히 선처하지 않을 이유는 없는 것 같고 말이죠."
63090-117 = "애초에 발키리는 선도와 교화를 목적으로 하는 학원이고요?"
63090-118 = "교정국 유지 비용도 만만한 게 아니기도 하고요……."
63090-119 = "무엇보다 선생님이 책임지신다고 하기도 했으니까요. 거 선생님 실망시키지 마십쇼."
63090-120 = "알았다. 그 부분은 확실히 유념하겠어."
63090-121 = "그리고 많이들 착각하는 겁니다만, 집행유예가 무죄는 아님다. 이 기간에 사고 치면, 우리도 어쩔 수 없이 가중처벌 때려야 함다."
63090-122 = "그래. 걱정하지 마라. 만일 우리가 사고를 치면, 내 헤일로를 파괴해 줘도 좋아."
63090-123 = "아, 거! 그렇게 좀 이야기하지 말고요! 아리우스식 화법 진짜 무섭네!"
63090-124 = "미, 미안하다……."
63090-125 = "그러면…… 우리, 진짜…… 가석방인, 건가……?"
63090-126 = "네."
63090-127 = "이렇게 된 거, 가서 시험이나 준비하시면 어떨까 하는데요."
63090-131 = "시험……! 그렇군!"
63090-146 = "어서 오세요!"
63090-147 = "……."
63090-148 = "여러분!"
63090-149 = "조금 시설이 아쉬운 교실이라고 느끼실 수도 있겠지만……."
63090-150 = "그래도, 우리 모두 함께 열심히 공부해서! 모의고사 잘 치러 봐요!"
63090-155 = "와…… 교실 되게 좋다……."
63090-156 = "이런 곳이라면 확실히, 공부할 맛이 날지도……."
63090-161 = "어, 어라……?"
63090-162 = "음. 저 반응은 이해가 가는 군."
63090-163 = "그곳의 교실에 비교하자면, 뭐든 저렇게 느낄 수밖에 없을 거야."
63090-164 = "그, 그런 건가요. 아하하……."
63090-165 = "고마워, 히후미. 다른 모두도."
63090-166 = "이 아이들의 '보충수업'을, 기꺼이 도와준다고 해서."
63090-172 = "별말씀을요. 저희도 선생님을 도울 수 있어서 기뻐요."
63090-174 = "그런데…… 학교 이름이랑 동아리 이름 말 안 하기, 쉽지 않네요……. 조금만 방심하면, 바로 이야기해 버릴 것 같아요……."
63090-175 = "[s] \"그건 선생님도 마찬가지란다…….\""
63090-179 = "……."
63090-180 = "……."
63090-181 = "오, 오랜만이네요. 아즈사 씨."
63090-182 = "그래. 오랜만이네. 마이아."
63090-183 = "이런 말을 하는 게 어떻게 들릴지는 모르겠지만."
63090-184 = "나는 지금, 반갑다고 느끼고 있어."
63090-185 = "그, 그 말투는 여전하네요……."
63090-186 = "잘…… 살고 있었던 것 같아서, 좋아요……."
63090-187 = "……."
63090-188 = "응."
63090-189 = "너희들도, 잘 살 수 있어."
63090-190 = "그렇게 되도록 하면 되니까."
63090-196 = "그러니까 내가 도와줄 수 있는 일이 있다면, 뭐든지 이야기해 줬으면 해."
63090-200 = "그럼 시험 좀 대신 쳐 주실 수 있나요?!"
63090-201 = "그건 안 돼."
63090-202 = "우앵……."
63090-206 = "이쪽분은 코하루 쨩…… 이라고, 하셨죠? 엘리트, 라고……."
63090-210 = "흐, 흥! 사람 보는 눈이 있네! 그래, 맞아! 내가 바로 정……"
63090-214 = "하여튼! 엘리트니까! 뭐든 의지해도 좋아!"
63090-215 = "그러면 이 문제는…… 어떻게 푸나요?"
63090-216 = "어, 어……?"
63090-220 = "(어라? 이거 분명 알았던 건데……?)"
63090-221 = "(왜 기억이 안 나지? 그때 확실히 필기까지 했었는데?!?!)"
63090-222 = "그, 그러니까 말이지! 이건, 이건……!"
63090-223 = "네, 네!"
63090-224 = "으, 으으……."
63090-225 = "시험 범위 아니니까, 아직 몰라도 돼!"
63090-227 = "네?! 그런 건가요!?"
63090-228 = "그건 아니랍니다. 코하루 쨩. 시험 범위가 아니라고 해서 공부하지 않아도 된다는 건, 너무 무른 생각이에요."
63090-229 = "마치 코하루 쨩이…… '멋진 지식'들을, 선행 학습하고 있는 것처럼 말이죠?"
63090-231 = "삐약?!?!"
63090-232 = "무, 무슨 말을 하는 거야! 그런 거 아웃이야! 무엇보다 오해라구!"
63090-234 = "후훗. 그런 걸까요?"
63090-235 = "그보다, 그 문제는 확실히 시험 범위가 아니지만, 지금 시험 범위를 공부하기 위해서는 알아야 하는 부분이기도 하죠."
63090-236 = "자아, 여기에서는 이렇게 접근해 볼까요? 어디……."
63090-242 = "우라와 하나코…… 역시 대단하군."
63090-243 = "……저 사람, 여러 의미로 예측이 안 될 정도로 심상치 않았으니까."
63090-244 = "하나코 씨는 모르는 게 뭘까요……."
63090-250 = "모든 것을 아는 것은 아니랍니다? 아는 것만 알 뿐이죠."
63090-251 = "우애애앵?! 드, 듣고 계셨나요?!?! 죄송합니다아아아아아아아!!!"
63090-252 = "괜찮아요. 츠치나가 히요리 씨…… 였죠? 히요리 쨩이라고 불러도 괜찮을까요?"
63090-253 = "네? 네, 네네네네네. 여, 영광…… 입니다……."
63090-254 = "그리고 이쪽분은……. 확실히, 하카리 아츠코 씨였죠? 어머나……?"
63090-258 = "왜 그래, 하나코 씨?"
63090-259 = "……으음?"
63090-260 = "……."
63090-261 = "……."
63090-265 = "후훗."
63090-266 = "후후."
63090-267 = "재미있는 분을 만난 것 같네요. 앞으로, 여러 가지로 잘 부탁드리겠습니다. 아츠코 '쨩'?"
63090-268 = "응. 나도 같은 심정이야. 잘 부탁할게. 하나코 '쨩'."
63090-269 = "어머나, 어머나."
63090-270 = "후후후."
63090-272 = "……? 무슨 일이라도 있나, 아츠코? 저 우라와 하나코와…… 미리 알고 있었던 건가?"
63090-273 = "그런 건 아니야. 삿 쨩. 그냥, 그런 느낌이 들었어. 왠지, 여러모로 이야기가 통할 것 같다고."
63090-274 = "그리고 그건 아마, 나만 그렇게 느꼈던 게 아닌 것 같네."
63090-275 = "……하나도 모르겠는데."
63090-276 = "응. 지금은 그걸로 좋은 것 아닐까?"
63090-277 = "역시 모르겠지만, 네에……."
63090-278 = "자. 그러면 모두 다시 공부 시작하자. 수업 부탁할게요. 선생님?"
63090-279 = "[s] \"맡겨 줘!\""
63090-294 = "……그런데…… 이 이상한 솜뭉치……? 같은 것들은 뭔가요. 히후미 씨?"
63090-298 = "네! 이건 말이죠……."
63090-303 = "성적이 좋은 분께 드리는, 모모프렌즈 굿즈 선물이에요!"
63090-305 = "또 그거야……?"
63090-307 = "모모…… 프렌즈요?"
63090-308 = "네! 요즘 유행하는 모모프렌즈랍니다! 모두에게…… 는 아니지만, 여러 계층에게 특이한 인기가 있거든요!"
63090-310 = "모두에게 인기 있다고 하지 않은 것만으로도, 장족의 발전이네……."
