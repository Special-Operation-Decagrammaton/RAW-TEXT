63090-348 = "외워! 외우라고! 이 멍청한 머리야! 왜 이렇게 못 외우는 거냐!!!"
63090-349 = "나, 지금 막 시험 기간의 특성에 대해 엄청난 진리를 깨닫게 된 것 같아……."
