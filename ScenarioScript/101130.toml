[translation]
101130-1 = "제13화;샬레 탈환 작전 1"
101130-3 = "PMC의 기지를 무사히 빠져나와 코우사기 공원에 일단 몸을 숨겼다."
101130-4 = "……그렇군요. 선생님도 그 음모에 휩쓸려 납치당하셨던 거군요."
101130-5 = "칸나 국장님이 아니었다면 큰일 날 뻔했네요. 선생님."
101130-6 = "저 미친개가 선생님을 구하려고 몸을 던지다니…… 믿을 수가 없어."
101130-7 = "저렇게 다칠 정도로……."
101130-8 = "텐트 안에 눕혀 두긴 했는데, 뭐. 푹 쉬면 일어나겠지. 저 사람도 발키리의 국장이니까, 이정도는 끄떡없을 거야."
101130-9 = "일단 지금은 서로의 정보를 취합해서 상황을 파악하는 게 우선이겠네요."
101130-10 = "지금 무슨 일이 벌어지고 있는지, 우리가 무엇을 어떻게 해야 하는지……. 상황을 정리하는 게 필요합니다."
101130-12 = "현재 D.U.는 계엄령이 발동되어 모든 통신과 물류, 이동이 금지되고 행정 체계가 셧다운되었습니다."
101130-13 = "D.U. 외부로 통하는 모든 통신이 차단되었기 때문에…… 다른 학원 자치구의 도움을 받을 수도 없고, 다른 위원장들의 행방도 알 수 없는 상황……."
101130-14 = "카이저가 선포한 이 계엄령을 취소하려면 그들이 탈취한 행정 제어권을 되찾아야 하지만, 하필 총학생회는 지금 수석행정관의 문책결의안이 의결되어서 행정 권한을 상실했어요!"
101130-15 = "이걸 해소하려면 거기에 동의한 6명의 실장들이 모여 문책결의안을 취소하거나, 투표를 열어 재신임을 가결해야 하는데……"
101130-16 = "으으…… 그건 또 계엄령 때문에 불가능한…… 그런 꼬리에 꼬리를 무는 골치 아픈 상태예요!"
101130-18 = "즉, 지금의 총학생회는 아무런 도움이 되지 않는다는 거네."
101130-19 = "높으신 분들이 언제 도움이 된 적이 있었어?"
101130-20 = "하지만 일개 기업에게 행정 권한을 탈취당하다니…… SRT 학원이 유지되고 있었다면 그런 일은 막을 수 있었을 텐데……."
101130-21 = "그, 그럼 이 상태에서도 생텀 타워는 계속 그 카이저에게 장악당하고 있는 건데…… 이제 어떻게 해야……."
101130-22 = "[s] \"남은 방법은 간단해…….\""
101130-24 = "이제 남은 방법은 생텀 타워의 행정 제어권을 장악하고 있는 장소로 직접 쳐들어가서 물리적으로 저지하는 수밖엔 없어요!"
101130-25 = "[s] \"거기가 어딘데?\""
101130-26 = "……바로 샬레예요!"
101130-27 = "[s] \"샬레 건물……?\""
101130-28 = "네, 정확히는 샬레의 건물의 지하, <크래프트 챔버>입니다!"
101130-29 = "<크래프트 챔버>는 총학생회장이 남긴 물질 생성기, 원래라면 싯딤의 상자의 관리자만이 접속할 수 있지만……."
101130-30 = "모종의 방법으로 카이저 코퍼레이션은 인증을 우회해서 크래프트 챔버를 기동, 생텀 타워 장악에 사용하려는 것 같아요!"
101130-31 = "그것 때문인지 몰라도 카이저는 수석행정관 린 씨를 납치해서 샬레의 건물에 가둬둔 상태입니다!"
101130-32 = "[s] \"린이 샬레에 있다고…….\""
101130-33 = "네! 린 씨는 샬레의 감옥에 갇혀 있어요! 다치진 않은 것 같지만……."
101130-37 = "……이해했습니다. 요컨대, PMC에게 장악당한 샬레를 탈환하는 거군요."
101130-38 = "여기 모인 우리들 만으로……?"
101130-39 = "맞아. 다른 자치구에는 연락이 닿지 않으니까, 우리들이 하지 않으면 안 되는 거지."
101130-40 = "잘됐네! 안 그래도 언젠가 샬레를 날려버리고 싶던 참이었거든!"
101130-41 = "알겠습니다! 본관도 힘내겠습니다!"
101130-42 = "으으…… 그치만 그게 말처럼 쉬울까…… 상대는 굴지의 대기업 카이저라고."
101130-43 = "게다가 바보가 아닌 이상, 우리가 올 거라는 걸 알고 있을 텐데. 만반의 준비를 해두지 않았을까……?"
101130-45 = "……카이저 SOF를 불러와라."
101130-46 = "[ruby=Special Operation Forces]트, 특수부대원을 [/ruby]말입니까?"
101130-47 = "그래. 선생이 이곳으로 올 거다."
101130-48 = "그 자라면 이 상황에서 어디를 공격해야 하는지 누구보다 잘 알고 있겠지. 그러니 준비해두는 것이다."
101130-49 = "원래라면 그 <여우>들을 상대하기 위해 준비한 카이저 PMC의 결전 부대……. 최고의 카드를 여기서 꺼낸다."
101130-50 = "어서!"
101130-51 = "네, 넵!"
101130-54 = "나는 방심하다가 실패하는 머저리와는 다르지."
101130-56 = "으으…… 거기 갇혀 있는 수석행정관도 구해야 하고……. 카이저의 음모도 저지해야 한다니……? 내가 할 수 있을까……."
101130-57 = "미유. 할 수 있는가의 문제가 아니라, 하지 않으면 안 됩니다."
101130-58 = "네! 맞습니다! 키보토스의 평화가 우리 손에 달렸어요!"
101130-59 = "으, 응……. 나도 힘낼게……."
101130-63 = "으으…… 다 끝나면 각오하라고. 이 정도의 추가 근무라면 29박 30일 포상휴가라도 받지 않는 이상 수지타산이 맞지 않으니까!"
101130-64 = "흥, PMC 따위가 뭐가 대수라고. 이쪽은 키보토스 제일의 엘리트들이 모인 SRT 특수학원이거든!"
101130-65 = "뭐, 저희는 실전 경험도 없는 신입생들이지만요……."
101130-66 = "학원도 없어졌지만……."
101130-67 = "노숙 중이고……."
101130-68 = "교과서도 없어서 발키리 학원 것을 빌려서 하고 있지만."
101130-69 = "네?! 바, 발키리의 BD가 어때서요! 본관은 그걸로 공부 잘하고 있는데요?!"
101130-70 = "누가 뭐래? 재고도 많아서 얼마든지 나눠줄 수 있다는 얘기였거든?"
101130-74 = "[ns] \"자아. RABBIT 소대. 생활안전국. 시작하자.\""
101130-75 = "미야코. 작전명을 정해줘."
101130-76 = "……그, 그렇군요. 그럼 지금부터…… 샬레 탈환을 위한 <파슬리 작전>……."
101130-77 = "잠깐- 왜 파슬리야? 무슨 의미야, 그거? 뭔가 더 멋진 단어 없어?"
101130-78 = "네? 그, 그건…… 토끼가 좋아하는 음식이라서……."
101130-79 = "앗, 그런 거라면 당근이 더 귀엽지 않나요? 당근 작전! 어감도 좋고!"
101130-80 = "그건 저번에 썼는데……."
101130-81 = "그럼 도넛 작전은 어때? 글레이즈드 도넛 작전!"
101130-82 = "무슨 크리스마스 특선 가족 영화 제목 같은데."
101130-83 = "처음 의도를 살려야죠. 클로버 작전은 어떤가요?"
101130-84 = "…………<샬레 탈환 작전>으로 하겠습니다."
101130-85 = "에이. 뭐야. 시시해."
101130-86 = "[ns] \"그럼 가볼까!\""
101130-89 = "선생님…… 부디 조심하세요……. 지금 이 상황은 뭔가 평소와는 다른 게 있는 것 같아요……."
101130-90 = "제가 봤던 그 불길한 유성들……. 그건 대체 무엇이었는지……."
101130-99 = "적 순항 전차, 중대 규모 확인! 공격 헬기와 바리케이드까지 철저하게 준비했네……."
101130-100 = "칫…… 제대로 준비해뒀구만……."
101130-101 = "정면돌파는 불가능해 보여……. 미야코 쨩, 어쩌지?"
101130-102 = "……지원병력이 조금만 더 있었더라면……. 어떻게든……."
101130-109 = "으응? 이 신호는……?"
101130-114 = "드디어 찾았어! 이쪽이야!"
101130-115 = "연락을 듣고 왔습니다! 선생님! 저희가 돕겠습니다!"
101130-117 = "공안국 여러분……!"
101130-118 = "어라? 평소라면 절대로 먼저 움직이지 않는 공안국의 학생들이……."
101130-119 = "[s] \"발키리가 와주었구나!\""
101130-121 = "어떤 명령도 내려지지 않아서 불안하게 시간을 보내고 있었는데…… 우연히 코우사기 타운 근처에서 칸나 국장님과 선생님의 모습을 보았습니다!"
101130-122 = "힘닿는 대로 저희도 돕겠습니다, 선생님!"
101130-126 = "미야코. 이거라면……."
101130-127 = "……네. 할 수 있습니다."
101130-128 = "그럼 선생님. 지시를."
101130-129 = "[s] \"지시는 미야코가 내려줘. 나는 그걸 도울게.\""
101130-130 = "……네. 알겠습니다."
101130-131 = "그럼, 모두들. 지금부터 D.U.의 계엄령을 해제하고 카이저 그룹의 음모를 분쇄하기 위한…… <샬레 탈환 작전>을 개시합니다!"
101130-132 = "네!"
