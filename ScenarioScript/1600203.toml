[translation]
1600203-1 = "그거라면 제대로 찾아오셨습니다!"
1600203-2 = "……"
1600203-4 = "아, 안녕하세요. 선생님! 오늘도 좋은 하루네요!"
1600203-6 = "……이미 저녁이지만요. 하하……"
1600203-7 = "[s1] \"힘이 없어 보이는데.\"\n[s2] \"……무슨 일 있어?\""
1600203-8 = "네? 아, 아뇨. 아무 것도 아니에요. 별 일 없었어요."
1600203-9 = "네? 아, 아뇨. 아무 것도 아니에요. 별 일 없었어요."
1600203-10 = "그냥 평소처럼 설명해주려던 사람들이 도망쳤달까……"
1600203-11 = "늘 있는 일이죠. 아하하……"
1600203-12 = "그런데 가만히 생각해보니, 이번 주에는 한 번도 제대로 설명을 끝낸 적이 없더라고요."
1600203-13 = "계속 끝까지 들어주는 사람이 없다고만 생각했는데, 어쩌면 그게 아닌 게 아닐까 하고……"
1600203-14 = "사실 다들 그렇게 제 설명을 듣고 싶지 않아 하는게 아닐까? 그런 생각도 좀 들고."
1600203-15 = "아무리 제가 이것저것 많이 찾아보고 지식을 습득해 놓아도……"
1600203-16 = "막상 그걸 알려줄 사람이 없으니 솔직히 조금 맥이 빠지긴 하더라고요."
1600203-17 = "저라고 사실 아는 척하고 싶어서 계속 말을 하는 건 아닌데 말이에요."
1600203-18 = "저는 그저 조금…… 약간 선생님처럼……? 그렇게 되고 싶다고 생각했던 것뿐인데."
1600203-19 = "……"
1600203-20 = "역시 너무 수다스러웠던 걸지도 모르겠어요. 하하……"
1600203-21 = "다들 딱히 관심도 없으니까요! 앞으로는 이런 습관도 조금 줄여야……"
1600203-22 = "[s] \"……\""
1600203-24 = "[s] \"……콘비프 통조림은 왜 그렇게 생겼어?\""
1600203-25 = "……네?"
1600203-26 = "콘비프 통조림이요? 갑자기 콘비프 통조림이라니……"
1600203-27 = "[s3] \"저번에는 바빠서 듣다 말았으니까.\"\n[s4] \"전부터 궁금하다고 생각했던 거라서.\""
1600203-28 = "저번에……? 듣다 마셨다니……"
1600203-29 = "전부터요……? 통조림이?"
1600203-30 = "……"
1600203-31 = "……!!"
1600203-32 = "그, 그건 말이죠! 아~. 또 그런 게 궁금하셨었다니!"
1600203-33 = "아하하! 그거라면 제대로 찾아오셨습니다! 그러니까 이게 말이죠……!"
1600203-34 = "원래 이전에는 음식을 상하지 않게 하기 위해 샴페인 병에 음식을 놓고 가열한 병이 수축할 때, 코르크 마개를 막아서 그 틈을 없앴었는데, 이게 문제가……"
1600203-38 = "(갑자기 눈빛에 생기가 돌아온 코토리는, 그후로도 거의 한 시간을 더 쉬지 않고 이야기했다.)"
1600203-39 = "(그렇게 시간이 지나고 새로운 사실이 언급될수록, 점점 더 코토리에겐 생기가 돌아왔다.)"
1600203-41 = "……해서 기본적으로 콘비프 통조림은 다른 통조림들과 달리 사다리꼴로 만들어져 있고 위가 아니라 아랫부분에 따개가 달려 있는데요! 애초에 그렇게 된 이유는……"
1600203-42 = "……이유는……"
1600203-43 = "……"
1600203-44 = "[s] \"……코토리?\""
1600203-45 = "……"
1600203-46 = "선생님 그…… 혹시……"
1600203-47 = "아, 아무것도 아니에요! 아니, 아무것도 아닌 건 아니고……! 그러니까……!"
1600203-48 = "그, 그냥! 뭔가 일부러 물어봐 주신 거 같아서……? 일부러 저를 위해서……!"
1600203-49 = "……"
1600203-50 = "……헤헤."
1600203-51 = "……고마워요."
1600203-53 = "(그렇게 잠시 웃은 뒤, 코토리는 언제 그랬냐는 듯 평소의 텐션으로 설명을 이어갔다.)"
1600203-54 = "(이후 코토리가 만족할 때까지 설명을, '이야기'를 쭉 들어주고 부실로 돌아갔다.)"
