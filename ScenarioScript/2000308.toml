[translation]
2000308-1 = "정의의 실현"
2000308-2 = "트리니티 학원 건물 옥상"
2000308-3 = "으음…… 예상보다 조금 늦군요. #n분명 이 앞으로 지나갈 때가 되었는데……"
2000308-4 = "하지만 긴장을 늦출 수는 없습니다. #n적을 노릴 수 있는 건 단 한순간 뿐이니까요!"
2000308-5 = "네? 아무리 극악무도한 악의 간부라 하더라도 총으로 즉결 처분하는 건 너무한 일 아니냐고요?"
2000308-6 = "안심하시길. 이 총에 장전된 탄환은 사람을 잠들게 만드는 마취탄입니다."
2000308-7 = "상대가 쓰러지는 즉시 구속하여 츠루기 부장께 조사를 부탁드릴 예정입니다."
2000308-10 = "― 후우…… [wa:1200]오늘따라 날씨가 무덥군요."
2000308-13 = "[wa:700]― 완벽한 저격을 위해서라면 [wa:1700]이 정도의 더위는 [wa:800]충분히 감내할 수 있습니다.[wa:200]"
2000308-16 = "― 조금…… [wa:1300]땀 냄새가 나지는 않으려나……"
2000308-19 = "― 이런 여름날에는 [wa:2000]다른 학우들의 [wa:1000]하얀 교복이 그립네요."
2000308-22 = "[wa:500]― 선생님…… [wa:1500]어쩐지 시선이 음흉합니다만……"
2000308-24 = "― 제대로 적을 [wa:1000]주시하고 계신 게 맞으시지요?"
2000308-27 = "(삐리리리-)"
2000308-28 = "어라, 정의실현부로부터 연락이……?"
2000308-29 = "마시로 씨? #n지금 어디서 무얼 하고 계시는 건가요?"
2000308-30 = "어제 하스미 선배께서 블랙마켓의 간부가 근처를 지나간다고 하셔서……. #n근처의 저격 포인트에서 대기중이었습니다."
2000308-31 = "이런, 헛걸음을 하셨군요."
2000308-32 = "네? 그게 무슨 말씀이신가요?"
2000308-33 = "그 악당은 어젯밤에 이미 츠루기 부장님께서 직접 생포해 오셨답니다."
2000308-34 = "츠루기 부장님도 참, 멋대로 습격을 감행하시다니……"
2000308-35 = "그런…… 그럼 저는 무얼 위해서……"
2000308-36 = "우선은 학교로 복귀 부탁드립니다. #n수고하셨습니다."
2000308-37 = "우으…… 네."
2000308-39 = "이후, 풀이 죽은 마시로를 달래 주며 학교로 돌아왔다."
