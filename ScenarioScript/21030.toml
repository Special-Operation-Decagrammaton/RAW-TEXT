[translation]
21030-1 = "제3화;폐허로."
21030-2 = "폐허"
21030-5 = "……"
21030-6 = "……"
21030-7 = "……저기 언니."
21030-8 = "대체 언제까지 이러고 있어야 해?"
21030-9 = "쉬잇. 소리 내지 마. 앗 선생님! 머리 숙이라니까!"
21030-16 = "……"
21030-17 = "……■■■ ■■■■……."
21030-20 = "……■■■."
21030-21 = "■■■■ ■■."
21030-27 = "……휴우. 갔나?"
21030-28 = "좋아. 움직이자."
21030-29 = "안 좋아!"
21030-30 = "대체 여긴 뭐야! 저런 정체도 알 수 없는 로봇들이 수도 없이 돌아다니고!"
21030-31 = "뭐긴 뭐야. 들어올 때부터 말했잖아."
21030-34 = "'폐허' 야."
21030-36 = "출입 금지 구역이라길래 어느 정도 위험은 있을 거라 생각했지만……"
21030-37 = "저 로봇들의 정체는 뭘까……?"
21030-38 = "아니, 저런 로봇들이 배회하는…… 이 '폐허'란 대체 어떤 곳인 거야?"
21030-39 = "으음 나도 베리타스에게 들은 게 전부라 다 아는 건 아니지만……"
21030-40 = "본래 이곳의 출입은 엄격하게 통제되고 있었다~ 까지는 선생님에게도 말했지?"
21030-41 = "[s1] \"들었던 것 같…… 기도…….\"\n[s2] \"여기는 어디? 나는 누구?\""
21030-42 = "폐허에 온 김에, 다시 설명할게. 이곳의 출입의 통제하고, 존재 자체를 숨긴 건……"
21030-43 = "폐허에 온 김에, 다시 설명할게. 이곳의 출입의 통제하고, 존재 자체를 숨긴 건……."
21030-44 = "총학생회장이야."
21030-45 = "총학생회장? 그 어느 날 갑자기 사라졌다는, 키보토스 학생회장들의 정점에 있던 사람?"
21030-46 = "맞아. 그녀가 사라진 뒤 이곳의 총학생회의 병력도 철수했고 자연히 방치되었어."
21030-47 = "덕분에 우리도 이곳에 올 수 있었지만…… 어쨌든!"
21030-48 = "총학생회의 은폐나 경비가 사라졌기에, 베리타스를 통해 우리도 이곳에 들어올 수 있었고……."
21030-49 = "히마리 선배의 말을 빌리면……."
21030-50 = "'키보토스에서 사라지고 잊혀진 것들이 모이는, 시대의 하수구 같은 곳일지도.'라더라."
21030-51 = "히마리 선배…… 베리타스의 그 휠체어 탄 미인 선배를 말하는 거지?"
21030-52 = "무슨 RPG 게임의 현자처럼 '난 뭐든지 알고 있다'는 느낌의 그 히마리 선배가 '일지도' 라고 말할 정도면…… 확실히 미지의 세계이긴 하네."
21030-53 = "그런데 어째서 이런 곳에 G.Bible이…… 어 잠깐?!"
21030-54 = "설마 언니, 이곳에 G.Bible이 있다고 생각한 이유가 '사라지고 잊혀진 것'들이 모이는 곳이라는 말 때문인 거야?!"
21030-55 = "그렇진 않아. 베리타스에 G.Bible의 수색을 요청했을 때, 마지막으로 G.Bible 구동된 장소를 확인해줬어."
21030-56 = "그 주소는, '존재하지 않는 지역' 이었지."
21030-57 = "그렇다면……?!"
21030-58 = "그래."
21030-59 = "G.Bible은 이곳, 폐허에 있어."
21030-60 = "[s] \"G.Bible 이란게 뭐야?\""
21030-61 = "어제 설명해주려다 '유우카'가 찾아왔지 참."
21030-62 = "간단히 말하면, 과거 밀레니엄에는 아니 키보토스에는……"
21030-63 = "전설적인 게임개발자가 있었어."
21030-64 = "그 사람이 밀레니엄 재학시절 만든 것이 G.Bible이야."
21030-65 = "자세한 내용은 모르지만……."
21030-66 = "그 안에는 '최고의 게임을 만드는 완벽한 비법'이 담겨져 있다고 해."
21030-67 = "……아무리 생각해도 그거, 어느 게임 학원 광고 아냐?"
21030-68 = "아니야! G.Bible은 있어! 최고의 게임을 만들 수 있도록 도와주는, 게임의 성서는! 분명 있다구!"
21030-69 = "즉, 우리가 원하는 건 그 G.Bible을 통해 완벽한 게임…… <테일즈 사가 크로니클 2>를 만드는 거야!"
21030-70 = "베리타스가 준 이 좌표를 따라가기만 하면 분명 G.Bible을……"
21030-72 = "(스윽)……."
21030-73 = "……■■■ ■■■■!"
21030-74 = "어…… 어…… 이런!"
21030-75 = "앗! 로봇?!"
21030-83 = "괴, 굉장히 적대적인데! 로봇들이 이쪽으로 몰려들고 있어!?!"
21030-84 = "이, 이대로는 포위당할지도!"
21030-85 = "으아아 어, 어떡하지?!"
21030-86 = "[s] \"마침 저쪽에 공장 같은 게 있어!\""
21030-87 = "응? 고, 공장 쪽으로?"
21030-88 = "오! 선생님! 좋은 판단이야! 서둘러! 로봇들을 돌파해, 공장으로 가는 거야!"
21030-89 = "선생님! 전투 지휘를 부탁드려요!"
