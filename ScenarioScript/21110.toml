[translation]
21110-1 = "제11화;그곳에는, 그것이 있었다."
21110-2 = "공장 내부"
21110-7 = "헥헥…… 서, 성공한 건가?"
21110-8 = "진입 성공. 미션을 클리어했습니다."
21110-9 = "와! 우리 사실 엄청 센 거 아냐? C&C나 각 학원 에이스 스쿼드랑 싸워도 이길 것 같아!"
21110-10 = "C&C는 절대 무리겠지만…… 놀랍긴 해."
21110-11 = "선생님의 지휘 덕분일지도?"
21110-12 = "나도…… 그렇게 생각해…… 확실히…… 선생님이 있으니…… 달라……."
21110-13 = "아. 다들 잔탄은 어때?"
21110-14 = "배터리가…… 깜빡깜빡. 아마도…… '마나가 부족합니다.'?"
21110-15 = "부족해. 앞으로 한 번 정도가 한계일지도?"
21110-16 = "으음. 다음 전투는 가능한 피하는 편이 좋겠어."
21110-18 = "……여기……?"
21110-19 = "아."
21110-20 = "응? 아리스? 무슨 일이야?"
21110-21 = "……."
21110-22 = "모르겠습니다. 익숙합니다. 이쪽으로 가야 합니다."
21110-24 = "엣?"
21110-26 = "아리스는 이곳, 기억에 없습니다. 하지만, 마치 '세이브 데이터'를 가지고 있는 것처럼."
21110-27 = "몸이 반응하고 있습니다."
21110-30 = "어떠한 튜토리얼이나 설명이 없음에도, 마치 익숙한 장르의 게임을 하는 것처럼."
21110-31 = "익숙? 흐음, 아리스가 있던 곳이랑 비슷하긴 한데."
21110-32 = "단지 컴퓨터 하나가 있……? 어?"
21110-33 = "저기………… 저 컴퓨터? 켜져 있는 것 같은데?"
21110-36 = "……"
21110-37 = "(삐빅-)"
21110-38 = "［Divi:Sion System에 오신 걸 환영합니다. 도움이 필요한 항목을 입력하세요.］"
21110-39 = "오오. 생각보다 편리한데? G.Bible을 검색해볼까?"
21110-40 = "아니…… 너무 수상하지 않아? 그보다 디비전 시스템이라는건 이 군수공장을 말하는 거야?"
21110-41 = "(스윽)"
21110-42 = "자판…… 발견. G.Bible을 입력해봅니다. (타닥타닥)"
21110-43 = "앗! 뭔가 떴어!"
21110-44 = "……."
21110-45 = "……#$@#$$%#%^*&(#@"
21110-46 = "아앗?! 고장 난 거 아냐? 아리스! 대체 뭘 입력한 거야?!"
21110-47 = "아, 아직 엔터도 안 눌렀는데……."
21110-50 = "[56cd7b]당신은 AL-1S 입니까?"
21110-53 = "?!"
21110-54 = "!!"
21110-55 = "?"
21110-56 = "아닙니다. 아리스는 아리스입니……"
21110-57 = "자, 잠깐만!"
21110-58 = "뭔가…… 이상해. 아리스 쨩. 일단 입력해선 안 될 것 같……"
21110-60 = "［음성 확인, 자격을 확인했습니다. AL-1S, 귀환을 환영합니다.］"
21110-61 = "?!"
21110-62 = "자판은 왜 있는 거야!?"
21110-63 = "……? AL-1S 가, 아리스의 이름이야?"
21110-64 = "으음. 미안. 유즈 쨩. 말하는 게 늦어 미안해."
21110-65 = "……"
21110-66 = "아리스의…… 진짜 이름…… 진짜 나……"
21110-67 = "당신은 AL-1S에 대해 알고 있습니까?"
21110-68 = "……"
21110-69 = "…………"
21110-70 = "반응이…… 느린데?"
21110-71 = "화면도 흐릿해져. 상태가 안 좋은 걸까?"
21110-72 = "그렇……@!#%#@!$%@!!!!"
21110-73 = "어, 어라? 무슨 뜻이지?"
21110-74 = "그것은……"
21110-75 = "……"
21110-76 = "긴급 상황 발생."
21110-77 = "현재 제 전력은 한계입니다. 전원 상실 시 소멸합니다. 남은 시간 51초"
21110-78 = "뭐?! 아, 안 돼! G.Bible을 찾아야 해!"
21110-79 = "확인, 당신이 원하는 것은, G.Bible입니까? < YES / NO >"
21110-80 = "?!"
21110-81 = "맞아!"
21110-82 = "G.Bible…… 체크 완료. 코드 유희…… 인간, 이해용, 레퍼런스, 라이브러리 등록 넘버 193, 폐기 대상 데이터 제1순위. 남은 시간 35초"
21110-83 = "폐기?! 어째서?! 그건 게임개발자들의, 아니 이 세상의 보물이라고!"
21110-84 = "G.Bible 을 얻고 싶다면, 제안합니다. 데이터를 전송할 저장 매체를 연결하세요."
21110-85 = "뭐? G.Bible이 어디 있는지 알아?"
21110-87 = "[56cd7b]당신들도 알고 있습니다."
21110-90 = "[56cd7b]지금, 보고 있으니까요."
21110-92 = "뭐, 뭐라고?!"
21110-94 = "정확히는, 내 안에 G.Bible이 있습니다. 하지만 현재 나는 소멸하기 직전, 새로운 저장 매체로의 이동을 원합니다."
21110-95 = "으음. 저장 매체라…… 아 혹시 '게임걸즈 어드벤스 SP' 메모리 카드에 들어올 수 있으려나?"
21110-96 = "하아…… 젠…… 가능합…… 니다."
21110-97 = "어, 어째 엄청나게 싫어하는 느낌인데……. 기분 탓인가."
21110-98 = "데이터 케이블을 이용해 볼게. 연결 완료!"
21110-99 = "전송 개시, 저장 공간 협소, 기존, 데이터, 삭제. 남은 시간 9초."
21110-100 = "아앗! 내 게임걸즈 어드벤스의 파일들이 일제히 삭제되고 있어! 너 뭐 하는 거야!"
21110-101 = "공간, 부족, 확보."
21110-102 = "아, 안돼! 제발 세이브 데이터만은 남겨줘! 거기까지 장비 맞추는 데 엄청 힘들……"
21110-103 = "유감, 제거"
21110-104 = "야아아아! 안돼에에에!"
21110-105 = "……"
21110-107 = "…………"
21110-108 = "어……? 전원이…… 종료 되었……?"
21110-109 = "아아아앗! 내 게임걸즈 어드벤스가아아아!!"
21110-111 = "자, 잠깐만!"
21110-112 = "뭔가 화면이 뜨는데……?"
21110-113 = "전송 완료."
21110-114 = "응?"
21110-115 = "신규 데이터를 전송합니다."
21110-116 = "<G.Bible .EXE>"
21110-117 = "서, 설마?!"
21110-118 = "오오! 당장 실행해봐야지! 진품인지 확인해보자!"
21110-120 = "EXE 실행! 야호! 오 뭔가 팝업이 떴……"
21110-121 = "암호가 걸려있잖아! 야! 장난하냐!"
21110-122 = "하, 하지만…… 어지간한 암호라면 베리타스가 풀 수 있을 거야!"
21110-123 = "(끄덕끄덕!)"
21110-124 = "그, 그렇다면……!"
21110-125 = "이것만 있으면 정말로…… '재미' 있는…… 테일즈 사가 크로니클 2……"
21110-126 = "완성할 수 있는 거야! 해냈다구! 아하하하하!"
21110-127 = "밀레니엄 프라이스, 아니 키보토스 게임 대상! 기다려라! 우리의 신작은! 키보토스 게임계에 지각변동을 일으킬 거라고!!"
21110-129 = "어, 언니 목소리가 너무 커. 그렇게 큰 소리로 소리 질렀다간……"
21110-134 = "……."
21110-135 = "이렇게…… 될…… 수…… 있……"
21110-136 = "어?"
21110-137 = "■■■ ■ ■! ■■■!"
21110-138 = "뭐, 뭔가 엄청 화가 난 것 같은데?!"
21110-140 = "(투타타타!)"
21110-142 = "꺄악! 쏜다! 도, 도망쳐!"
21110-143 = "크윽! 언니! 그보다……"
21110-144 = "아, 알겠어! 게임걸즈 어드벤스 확보! 유즈! 선생님을 지켜! 나랑 아리스가 남고 로봇들을 저지하며 탈출한다!"
21110-145 = "엄호할게!"
21110-146 = "여기서 당할 수 없지! 드디어 G.Bible을 얻었는데!"
21110-147 = "우리들의 게임개발부 부실로…… 돌아가는 거야!"
21110-152 = "응!"
