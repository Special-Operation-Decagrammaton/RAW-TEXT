[translation]
84302200400-5 = "여긴가. 보아하니 제대로 온 거 같네."
84302200400-6 = "어이, 리오. 목적지에 도착했다. 어디다 꽂으면 되지?"
84302200400-11 = "……??? 리오?"
84302200400-15 = "아니, 설마……."
84302200400-16 = "어이, 어이. 설마 진짜냐. 여기까지 와서 통신이 끊겼다고? 재밍이라도 있는 건가?"
84302200400-17 = "리오가 예상하지 못한 건가? ……아니, 그럴 녀석은 아니지. 단순한 통신 장치 고장이거나 잠입 도중 부서진 쪽이라고 봐야겠는데."
84302200400-18 = "아무튼 보자, 그럼 이제 어떻게 한다……."
84302200400-22 = "일단 있는 대로 다 꽂아 볼까? 이것저것 막 꽂다 보면 어딘가 얻어걸리지 않을까."
84302200400-26 = "하아, 역시 안 되겠지. 잘못 했다간 오히려 일만 커지는 꼴이 될 테고."
84302200400-27 = "어쩔 수 없나, 우선은 돌아가서 다시 리오 녀석에게 물어보는 수밖에."
84302200400-28 = "일단 알려줘야 하니 사진을 찍고……."
84302200400-36 = "이거 뭔가 찝찝하네. 곰곰이 생각해 보면 보안 누출 아닌가."
84302200400-37 = "끝나면 바로 지워야지. 어쨌든 이걸로 됐고. 일단은 다시 돌아가도록 할까……."
