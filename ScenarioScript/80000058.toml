[translation]
80000058-1 = "고민 끝에 내린 결론"
80000058-2 = "(놀이터로 나가니, 그네에 앉아 안절부절못하고 있던 아이리의 모습이 보였다.)"
80000058-3 = "……."
80000058-9 = "아, 서, 선생님! 언제 오셨어요!?"
80000058-10 = "방금이요? 아. 다행이네요. 전 또 계속 선생님 계신 데 멍하니 있던 건 줄……. 에헤헤……."
80000058-11 = "네? 무슨 일로 불렀냐고요? 그, 그야……. 어, 어라? 아마 아실 거라고 생각했는데……."
80000058-12 = "아, 아닌가. 선생님 바쁘시니까……. 역시 이런 건 우리 같은 애들이나 챙기는 걸지도……."
80000058-13 = "서, 설마 그런 거라면 이건……. 어쩌면 괜히 폐를 끼치는 건가? 설마……!"
80000058-14 = "[s1] \"농담이야. 예상은 하고 있어.\"\n[s2] \"발렌타인 데이 때문이지?\""
80000058-15 = "……!"
80000058-16 = "……!"
80000058-17 = "마, 맞아요. 역시 선생님은 다 예상하고 계셨군요."
80000058-18 = "그, 그럼……."
80000058-22 = "그럼 어차피 예상하고 계시니까……! 지, 지금 바로 드릴게요! 여기!!"
80000058-28 = "[ns3] \"…….\"\n[ns4] (언제나의 그것이다…….)"
80000058-29 = "……."
80000058-30 = "……."
80000058-31 = "서, 선생님? 어, 어때 보이시나요……? 왜 아무 말씀이 없으신 건가요……."
80000058-32 = "……네?"
80000058-33 = "이, 이럴 때까지 민트초코냐고요……!?"
80000058-34 = "그건……! 여, 역시 그렇죠! 그렇게 생각하시겠죠!? 사실 그 생각도 하긴 했는데……."
80000058-35 = "그래도 뭔가, 생각이 돌고 돌다 보니 결국 이렇게 해야 할 것 같아서……."
80000058-36 = "음……. 뭔가 설명이 안 되네요. 에헤헤……."
80000058-37 = "나름대로 고민 끝에 내린 결론인데, 혹시 건성으로 보이진 않을까 걱정되기도 해요."
80000058-38 = "[s5] \"절대 그렇게 생각하지 않아.\"\n[s6] \"괜찮아. 충분히 이해하고 있어.\""
80000058-39 = "……!"
80000058-40 = "……!"
80000058-41 = "에헤헤……. 감사합니다. 선생님."
80000058-42 = "……아."
80000058-43 = "그리고 말씀드릴 타이밍을 놓쳤는데, 그래도 이건 보통의 민트초코가 아니에요."
80000058-44 = "보시면 아시겠지만, 여기 초코와 민트의 배합률도 이 메이커의 고유한 비율이고, 박하도 보통은 먹을 수 없는 페니로열 계통을 잘 정제해서……."
80000058-45 = "……네? 뭐가 다른……거냐고요?"
80000058-46 = "……다르죠! 전혀 다르다고요! 말씀드렸잖아요!"
80000058-47 = "이건 페니로열 박하라니까요!? 보통 상태라면 먹을 수 없는 걸 정제해서 먹을 수 있게 만든 귀하디 귀한……!!"
80000058-48 = "……."
80000058-52 = "……아시겠죠?"
80000058-53 = "[s] \"…….\""
80000058-55 = "(……전혀 이해하지 못한 채 샬레로 돌아왔다.)"
