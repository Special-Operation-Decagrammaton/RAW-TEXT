[translation]
104060-1 = "제6화;동등한 조건"
104060-7 = "상황 분석. ……. 우트나피쉬팀과의 연결 해제. 지금 즉시 우회 연결을 시도합니다."
104060-11 = "……. 실패. 우트나피쉬팀의 연결이 차단되어 있습니다. 저의 개입이 불가능합니다."
104060-15 = "다차원해석 억제가 아직 유지되고 있는 것을 확인. ……. 연산 가속으로 파훼 재시도."
104060-19 = "연산 가속 불가능. 지상의 생텀 인카네이션 프로세스 체크. 임시 개체의 현현 상태 확인."
104060-23 = "임시 개체 파괴 확인. 현현 불가. 이대로라면 계획이……."
104060-24 = "……실패합니다."
104060-25 = "……."
104060-36 = "……. 상태 확인. 아트라하시스의 방주의 <자폭 시퀀스>가 준비 중인 것을 확인했습니다."
104060-37 = "시퀀스 기동 시, 방주는 폭발하여 종말처리에 들어가며, 다차원해석 기능은 영구히 소멸합니다."
104060-38 = "……. 지금 바로 대응 방법을……."
104060-42 = "……. 연산 불가. 리소스 부족. 생텀 인카네이션 프로세스……"
104060-43 = "……캔슬됐습니다."
104060-51 = "해냈어……. 된 거지?"
104060-52 = "으아아……. 그럼 이제 어떻게 되는 거야? 여기가 자폭하는 거야?"
104060-53 = "으음, 그러겠죠?"
104060-58 = "……."
104060-59 = "어머나, 후우카 씨?"
104060-64 = "괜찮습니다. 긴장이 풀린 것뿐이니……. 수고하셨습니다, 후우카 씨."
104060-65 = "자, 그럼 다 끝난 거지?"
104060-66 = "응, 원래라면 그렇지만……."
104060-67 = "후후후……."
104060-68 = "뭐야, 또 무슨 불길한 웃음을……."
104060-70 = "아냐! 선생님을 도우러 가야지!!"
104060-71 = "그, 그렇지…… 선생님."
104060-72 = "그렇습니다. 코스 요리는 마지막에 나오는 음식을 다 먹지 않으면 끝나지 않습니다."
104060-73 = "자, 아직 끝난 게 아닙니다. 마지막 마무리를 하러 가볼까요?"
104060-74 = "아아~ 여자아이들의 우정이란~★"
104060-75 = "뭐, 이런 전개일 것 같았어. 그럼 어쩔 수 없지."
104060-80 = "가자고!!"
104060-81 = "후우카는 내가 업을게!! 가자!"
104060-83 = "하늘이 다시 바뀌었어!"
104060-84 = "네!! 겨우 성공했어요! 이걸로 방주의 자폭 시퀀스도 다시 발동했어요!"
104060-85 = "흐음~ 그럼 여기가 폭발하기 전에 선생님과 시로코 쨩을 구해서 탈출하는 것만 남았네?"
104060-86 = "아야네 쨩, 저희는 바로 선생님을 도우러 갈게요! 아야네 쨩은 거기서 다른 사람들과 먼저 탈출하세요!"
104060-87 = "……. 아뇨, 선생님과 시로코 선배를 무사히 구하는 걸 확인한 뒤 탈출할게요! 그때까지 함께 하겠습니다."
104060-88 = "그치만……."
104060-89 = "그래, 그럼 끝까지 함께 하자고. 아야네 쨩. 길을 부탁할게."
104060-90 = "네! 그럼 바로 이동하겠습니다!! 가시죠!!"
104060-91 = "가자!!"
104060-94 = "들었지? 너희들도 어서 서둘러! 리오 회장이 만든 <탈출 시퀀스>를 이용하는 거야!"
104060-95 = "응? 잠깐만?! 게임개발부? 지금 어디야?"
104060-96 = "지금 방주의 중앙 구역으로 가는 중입니다!"
104060-97 = "응! 선생님을 도우러 갈 거야!"
104060-98 = "네……!! 여기서 금방이거든요!!"
104060-99 = "탈출은 언제든지 할 수 있을 테니까……."
104060-100 = "뭐?!"
104060-104 = "……으으. 알겠어! 선생님이랑 같이 탈출하는 거야? 알겠지!!"
104060-105 = "네! 맡겨주세요, 유우카!"
104060-110 = "하늘이……."
104060-111 = "크하핫. 거 봐. 해낼 줄 알았다고!"
104060-112 = "네. 현현 중이던 거짓된 성소도 사라졌어요."
104060-113 = "이쪽도 남은 적도 대충 정리 끝났고, 토키 쨩도 후송 보냈고. 이제 뭐 하면 돼?"
104060-114 = "남은 건 하나밖에 없잖아!"
104060-117 = "선생이 돌아오는 걸 기다려야지!"
104060-118 = "응! 그거라면 자신 있어!"
104060-119 = "다른 곳들의 상황을 계속 살펴보긴 해야겠지만요……."
104060-120 = "음. 그래."
104060-122 = "경고. 아트라하시스의 방주 <자폭 시퀀스>가 준비 중입니다. 시퀀스가 기동 되면 폭발 후 내부 인원의 생존 확률은 0.0003% 이하."
104060-123 = "스나오오카미 시로코. 스나오오카미 시로코. [USERNAME] 선생님. 전원 사망 예측. 지금 대응법을 설계하지 않으면……."
104060-127 = "……. 그랬구나."
104060-128 = "선생님은 시간을 벌고 있었던 거였어. 학생들이 해낼 거라고 판단했구나."
104060-129 = "[s] \"믿고 있었으니까.\""
104060-133 = "응. 내가 이길 수 없어도 괜찮아."
104060-134 = "그렇다면 모두와 함께 이기면 되니까."
104060-135 = "……모두와."
104060-136 = "[s] \"그래. 이제 곧 모두가 여기로 와 줄 거야.\""
104060-137 = "응. 대책위원회가. 그리고 <샬레>가."
104060-141 = "[ns] \"그러니까, 그때까지 너희를 저지하겠어. 하고 싶은 말이 있으니까.\""
104060-142 = "하고 싶은 말이라……."
104060-143 = "대응법 설계 중. 해결 방법은 아직 있습니다. 지금부터 다른 루트로 우트나피쉬팀을……."
104060-144 = "……. 아니. 소용없겠지."
104060-148 = "해봤자 이런 결과가 반복될 뿐이야. 선생님이라면 또다시 힘을 합쳐 위기를 극복하겠지."
104060-149 = "모두와 함께 힘을 합쳐서 싸운다…… 응. 그건 확실히 위험해."
104060-150 = "선생님은 몇 번이고 그런 식으로 기적을 만들어 왔으니까."
104060-156 = "그러니까, 가장 먼저 <선생님>부터 처리하지 않으면 안 돼."
104060-157 = "그러면 방주의 자폭도, 성소의 현현도, 그 뒤에 얼마든지 다시 시작할 수 있어."
104060-158 = "선생님만 없다면. 응."
104060-159 = "선생님만 없으면…… 전부…… 무너지게 되니까."
104060-160 = "……그러니까, 여기선 우리의 모든 노력을 쏟아부어야만 해."
104060-166 = "……. 지시 확인. 알겠습니다. <싯딤의 상자>의 연산 지원을 중지. 현 시간부로 저는 전투 지원 모드로 전환."
104060-172 = "[ns] \"장소가 바뀌었어……?\""
104060-173 = "지금부터 저의 모든 능력을 전투 지원에 집중하겠습니다."
104060-174 = "[s1] \"아로나----!!\"\n[s2] \"그렇다면, 나에게도 있어! 초 유능한 아로나 쨩이!!\""
104060-177 = "네!! 지금부터 슈퍼 아로나 쨩이 선생님을 돕겠습니다!!"
104060-178 = "상대가 누구든지 간에 [USERNAME] 선생님을 해치려는 사람은 가만두지 않겠어요!"
104060-179 = "선생님을 해치게 두지 않겠어."
104060-180 = "……. 그래. 어차피 서로 같은 심정이겠지."
104060-181 = "하지만 동등한 조건이 되었다고 착각하지는 마. 선생님. 내가 경험한 전투는 당신들과 단위 자체가 다르니까."
104060-182 = "<싯딤의 상자>의 성능이 동등해도, 이 경험의 차이는 메워지지 않아."
104060-183 = "[ns3] \"…………….\"\n[ns4] 어른의 카드를 꺼낸다."
104060-187 = "……. 그러네. 그게 있었지."
104060-188 = "확실히 그거라면 모든 조건을 무시해 버리고 승리를 가져오는 것도 불가능하지 않겠지."
104060-189 = "하지만…… 잊어버린 건 아니지, 선생님?"
104060-190 = "당신 앞에 있는 프레나파테스가 누구인지?"
104060-199 = "서, 선생님……!?! 프, 프레나파테스도 무언가를 꺼내고 있어요……!!?"
104060-200 = "저, 저건……!?"
104060-203 = "………?!"
104060-204 = "[ns] \"………………………………!!\""
104060-205 = "<어른의 카드>와 <어른의 카드>의 싸움이라……."
104060-206 = "그렇다면, 어떤 <카드>의 힘이 더 강한지에 따라 승패가 나뉘게 될 거야."
104060-208 = "다음화;같은 상황, 같은 선택"
