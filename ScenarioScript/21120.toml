[translation]
21120-1 = "제12화;'거울'을 찾아서"
21120-2 = "밀레니엄 베리타스"
21120-3 = "전에 요청했던 '데이터'에 관련된 사항, 결과가 나왔어."
21120-4 = "드, 드디어……."
21120-5 = "두근두근."
21120-6 = "알겠지만 우리 베리타스는, 키보토스 최고의 해커집단임을 자부하고 있어."
21120-7 = "때문에 시스템이나 데이터 복구 쪽으로 다양한 문의를 받았고, 수없이 해결해왔지만……."
21120-8 = "단도직입적으로 말할게."
21120-9 = "(꿀꺽)"
21120-11 = "모모이, 네 게임 세이브 데이터를 살리는 건 불가능해."
21120-13 = "끄아앙! 안돼에에에!"
21120-14 = "대체 뭘 요청한 거야! G.Bible에 대한 암호를 트래킹 해달라고 부탁하려 했잖아!"
21120-15 = "그거라면 마키가 작업 중입니다."
21120-16 = "마키 쨩이?"
21120-17 = "요! 미도! 좋은 아침이야."
21120-18 = "마침 게임개발부로 찾아갈까 했는데 직접 왔네."
21120-19 = "흑흑. 내 세이브 데이터가…… 후에에엥!"
21120-20 = "으잉? 모모는 왜 이러고 있어?"
21120-21 = "신경 쓰지 마. 그보다, G.Bible에 대한 결과가 듣고 싶어."
21120-22 = "분석은 끝났어. 저건 그 전설의 게임개발자가 만들었다는 갓겜 매뉴얼…… G.Bible이 분명해."
21120-23 = "여, 역시!"
21120-24 = "파일 생성 시기, 마지막으로 발송된 시간, 파일의 형식, 그리고 작업자는 너희가 말했던 전설의 게임개발자의 IP와 일치하며, 무엇보다 저 데이터의 복사 횟수는 단 한 번뿐이야."
21120-25 = "그, 그렇다면……!"
21120-26 = "그래. G.Bible의 원본이겠지."
21120-28 = "괴, 굉장해!!"
21120-29 = "하지만…… 아직 파일의 암호를 완전히 해석하진 못한 상태야."
21120-30 = "어? 그럼 열람이 불가능하잖아! 마키 실망이야!"
21120-31 = "우웃! 나, 나는 사실 크래커지 화이트 해커가 아니라고! 어쨌든!"
21120-32 = "방법이 없는 건 아니야."
21120-33 = "오호?"
21120-34 = "해당 파일의 암호를 직접 해석하는 건, 거의 불가능해. 하지만 보안 파일을 제외한 채 복제하는 건 가능하지."
21120-35 = "그러기 위해서는 Optimus Mirror System, 통칭 '거울'이라 불리는, 툴이 필요해."
21120-36 = "저, 전혀 못 알아듣겠는데."
21120-37 = "그러니까…… G.Bible을 얻기 위해선 프로그램 '거울'이 필요하다야? 그게 어디 있는데?"
21120-38 = "우리 베리타스에 있었지……."
21120-39 = "오오 그렇다면 지금 바로! 응? 잠깐? 과거형?!"
21120-40 = "……그래. 이젠 없어. 하하하! 젠장! 학생회가 압수해 갔다고!"
21120-41 = "얼마전 유우카가 불법 장비를 소지하고 있는 건 용서할 수 없다며 쳐들어왔어. 크윽."
21120-43 = "'거울'을 비롯해…… 제 도청 장치 등 우리의 장비를 많이 빼앗겼죠……."
21120-44 = "무슨…… '거울'이 그 도청 장치마냥 위험한 프로그램인 거야?"
21120-47 = "그럴리 없잖아. 단지 암호화된 시스템을 뚫는데 최적화된 툴일 뿐이야."
21120-48 = "그리고…… 우리 부장이 직접 제작한, 전 세계에 유일한 해킹툴이기도 해."
21120-49 = "부장이라면…… 아 히마리 선배?"
21120-50 = "히마리……?"
21120-51 = "베리타스의 부장 선배야. 몸이 불편해서 휠체어를 타고 다니지만, 누구도 그녀를 동정하거나 얕보지 않아."
21120-52 = "천재랄까. 밀레니엄 역사상 단 세 명 밖에 받지 못한 학위인 '전지'의 소유자라 해."
21120-53 = "헤에. 그거 대단…… 한 건 상관없어! 그 천재님의 장비를 어쩌다 빼앗긴 거야."
21120-54 = "그저 선생님의 문자 메시지 내용을 확인하고 싶었을 뿐……."
21120-55 = "어떠한 불순한 의도도 존재하지 않았는데 말이죠."
21120-56 = "아니…… 난 불순한 의도밖에 느껴지지 않는데……."
21120-59 = "흐와아앙! 빨리 거울을 되찾지 못하면 난 부장에게 혼날 거야!!"
21120-60 = "어쨌든…… 정리하자면, 우리도 '거울'을 되찾고 싶어."
21120-61 = "그리고 너희도 필요할 텐데? G.Bible의 암호를 풀기 위해서라면?"
21120-62 = "오호…… 직접 불러서 혹시나 했는데. 무슨 말을 하려는지 알 것 같네."
21120-63 = "어…… 설마?"
21120-64 = "후후. 역시 모모. 이야기가 통해."
21120-65 = "헤헷. 출발지는 다르더라도 목적지가 같다면, 여행자들은 동반자가 될 수도 있는 법이지."
21120-66 = "같은 레이드에 입장한 그 순간부터, 우리는 파티원입니다."
21120-67 = "서, 설마……?"
21120-69 = "언니! 베리타스와 손잡고 학생회에 쳐들어갈 생각은 아니겠지?!"
21120-71 = "밀레니엄 옥상"
21120-72 = "바로 그 설마야."
21120-73 = "흐음. 믿기 어렵네요."
21120-74 = "밀레니엄 게임개발부에 대해서라면, 저도 알고 있어요."
21120-75 = "귀여운 느낌이었는데. 그런 아이들이 밀레니엄의 학생회에 쳐들어온다고요?"
21120-76 = "순수한 애들이지. 하지만 그렇기에, 터무니없는 장난을 저지르기도 해."
21120-77 = "그리고 이번에는 베리타스도 엮여 있어."
21120-78 = "베리타스? 아 그 해킹에 특화된 크래커 집단 말이군요."
21120-79 = "맞아. 소중한 것을 위해서라면, 수단을 가리지 않는다는 점에서 두 집단은 서로 닮았어."
21120-80 = "그렇군요. 뭐, 의뢰인 이상 그것을 받는 것이 저희의 일이지만……"
21120-81 = "사소한 문제가 한 가지 있어요."
21120-83 = "밀레니엄 베리타스"
21120-84 = "사소한 문제?"
21120-85 = "사실 '거울'이 보관된 학생회의 '압류품 보관소'를 지키고 있는 게 바로……"
21120-86 = "메이드부거든."
21120-87 = "……어? 메이드부라면……?"
21120-88 = "아하. C&C 말하는 거지? 밀레니엄의 무력집단, 메이드복을 입고 대상을 '청소'해버리는……."
21120-89 = "맞아 맞아~ 대단히 사소한 문제지~"
21120-90 = "응~ 그렇네~ 아~주~ 사소하네~ 너무 사소하니……."
21120-93 = "포기다!!! 게임개발부 뒤로 돌아 전진!"
21120-95 = "아앗!! 왜! 대체 왜 포기하는 거야?! 모모! G.Bible이 갖고 싶은거 아니었어?!"
21120-96 = "갖고 싶어. 하지만 G.Bible이 갖고 싶다고 메이드부랑 싸우라고?! 장난하냐!"
21120-97 = "차라리 달리는 열차나 불타는 화산에 뛰어드는 게 더 안전하겠다!"
21120-98 = "하, 하지만 이대로 물러서면 나는 부장에게 혼나…… 는 게 문제가 아니라! 너희 게임개발부도 끝장난다구! 폐부란 말야!"
21120-99 = "폐부…… 싫어. 하지만 이건 차원이 달라."
21120-100 = "C&C의 '봉사'에 괴멸된 과격 단체나 무장 서클은 셀 수도 없지. 왠지 알아?"
21120-102 = "……존재의 흔적조차 남기지 않은 채, 청소되어버렸으니까."
21120-103 = "그래! 아무리 부가 소중해도, 미도리와 아리스만큼은 아니야! 너무 위험해!"
21120-104 = "위험? 청소? 오해야! 우리가 무슨 게헨나 선도부나 트리니티 정의실현부도 아닌데 뭐하러 메이드부랑 싸우겠어."
21120-105 = "우리 목표는 '메이드부를 박살 낸다'가 아니라 압류품 보관소에서 '거울'을 챙겨온다라구~"
21120-106 = "그게 그거잖아!"
21120-107 = "근거 없는 말은 아니야."
21120-108 = "제가 도청한 바에 의하면…… 현재 메이드부는, 완전한 상태가 아니에요."
21120-109 = "응?"
21120-112 = "물론 메이드부는 밀레니엄 최강의 무력집단이야."
21120-113 = "왜 그렇게 되었을까? 물론 메이드들이 탁월한 에이전트이기도 하지만……"
21120-114 = "'그녀'가 있기 때문이지."
21120-117 = "메이드부 부장. 콜사인 더블오. 네루."
21120-119 = "맞아."
21120-121 = "하지만 지금 그녀는……."
21120-123 = "밀레니엄 옥상"
21120-124 = "네, 네루 선배가 지금 없다고?!"
21120-125 = "그래요. 밀레니엄 외곽 쪽에 개인적인 용무가 있는 모양이에요."
21120-126 = "하지만 걱정하지 않아도 돼요."
21120-127 = "엄밀히 말하면 우리 부장은, 지키는 것보다는 '부수는 쪽'에 특화된 사람이니까."
21120-128 = "부장과 함께 있을 때 C&C가 가장 강한 것은 사실이지만."
21120-129 = "지키는 것만이라면…… 우리만 있는 게 더 나을 수 있어요."
21120-130 = "의뢰, 수락하겠습니다."
21120-132 = "게임개발부가 약속한 기한까지, 학생회 압류품 보관소에 접근할 일은 없을 겁니다."
21120-134 = "밀레니엄 베리타스"
21120-135 = "정면승부를 피하고…… 거울만 뺏은 뒤 도망친다라……."
21120-136 = "……."
21120-137 = "해보자 언니."
21120-138 = "뭐?! 하지만 네루 선배가 없다고 메이드부가 만만한 상대는 아니잖아!"
21120-139 = "알아. 하지만…… 이대로 폐부 당할 순 없어."
21120-142 = "낡아 빠지고, 좁고, 비가 새는 그런 부실이지만……"
21120-145 = "그저 게임만 하던 우리의 도피처는……"
21120-148 = "모두와 함께 하는, 너무 소중한 공간이 되었어."
21120-149 = "메이드부와 싸우는 것만이 길이 아니라면…… 해볼만하다고 생각해."
21120-150 = "아니, 설령 그렇다 해도……! 위험하다고 해도!"
21120-152 = "지키고 싶어."
21120-154 = "아리스 쨩을 위해서, 유즈 쨩을 위해서, 아니 우리 모두를 위해서."
21120-157 = "미도리……."
21120-158 = "할 수 있습니다."
21120-159 = "전설의 용사도, 세상의 멸망을 막기 위해…… 마왕을 물리쳤습니다."
21120-160 = "저는 약 45종의 RPG 게임을 하며…… 용사들이 마왕을 물리치는, 가장 강력한 힘을 알게 되었습니다."
21120-161 = "어? 가장 강력한 힘……? 레벨업이나 장비 강화를 말하는 건 아니지?"
21120-162 = "도청인가요?"
21120-163 = "EMP 쇼크?!"
21120-165 = "아…… 아니요."
21120-167 = "함께 하는, 동료입니다."
21120-168 = "……아리스."
21120-169 = "……."
21120-170 = "좋아."
21120-171 = "학생회에 잠입해서! '거울'을 탈환한다!"
21120-173 = "하레 선배! 뭔가 계획은 있는 거지?"
21120-174 = "물론이야."
21120-175 = "하지만, 그 계획을 실행하기 위해선……"
21120-176 = "몇 가지 준비가 필요해."
21120-178 = "도청이나 EMP 쇼크…… 그리고……"
21120-179 = "역시 '동료'일까나."
21120-180 = "동료?"
21120-181 = "(반짝반짝)"
21120-182 = "으음. 우리랑은 별로 친하지 않으니…… 선생님께 부탁해야겠네."
21120-183 = "[s1] \"나?\"\n[s2] \"생각해둔 동료들이라도 있어?\""
21120-186 = "응."
21120-187 = "엄밀히 말하면, 그들 없이는 이 작전에 성공할 수 없을 거야."
21120-189 = "정확한 판단이야."
21120-190 = "네 말대로, 그 방법은 우리가 아니면 실행하기 어렵겠네."
21120-191 = "좋아. 협력할게."
21120-192 = "저, 정말이세요?"
21120-193 = "사실 엔지니어부는…… 이번 클럽 심사에서도 안전권일 텐데."
21120-194 = "맞아."
21120-195 = "그런데 어째서 메이드부와 싸운다는, 위험한 배에 같이 타주시는 거죠?"
21120-196 = "음 그야……."
21120-197 = "그게 더 재미있을 것 같으니까……."
21120-198 = "게다가 선생님이랑은! 우리도 더 친해지고 싶었거든요!"
21120-202 = "그리고……. (스윽)"
21120-203 = "?"
21120-204 = "……?"
21120-205 = "………아니, 아무것도 아니야. 잘 부탁해."
21120-206 = "아, 네."
21120-207 = "그럼! 잘 부탁드리겠습니다!"
21120-209 = "밀레니엄 베리타스"
21120-210 = "자! 그럼 멤버는 다 모인거지?"
21120-211 = "그래. 준비는 끝났어."
21120-212 = "좋았어!"
21120-213 = "작전은 언제 시작하는 거야?"
21120-214 = "작전……?"
21120-217 = "이미 시작되었어."
21120-219 = "밀레니엄 옥상"
21120-220 = "아 한 가지만."
21120-222 = "당신들은 어떻게 게임개발부와 베리타스가 학생회를 습격할 것을 알고 있었죠?"
21120-223 = "정보전이라면 밀레니엄에서 베리타스를 능가하는 집단이 없을 텐데."
21120-224 = "맞는 말이야."
21120-225 = "우리에게 베리타스가 곧 습격할 거라는 정보를 준 쪽도 마찬가지니까."
21120-226 = "네?"
21120-227 = "우리에게 베리타스와 게임개발부가 올 거라는 것을 알려준 게……"
21120-230 = "베리타스 부장, 히마리거든."
21120-232 = "다음화;Nerd VS Maid"
