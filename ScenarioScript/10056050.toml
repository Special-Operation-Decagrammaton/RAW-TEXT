[translation]
10056050-1 = "제5화;손해배상청구서"
10056050-2 = "아일랜드 사관실"
10056050-6 = "그러니까…… 선저 작업 중 따개비가 폭발했다는 거지?"
10056050-7 = "……네."
10056050-8 = "증언만으로는 조금 믿기 어렵지만."
10056050-9 = "뭐, 키보토스에서 해상 작업 중 폭발로 인해 배에 구멍이 나는 일은 제법 흔하니까."
10056050-10 = "예를 들면— 청소하는 게 귀찮다고 총기나 폭발물로 선체 부착 생물을 제거하려다 유폭이 발생한다던가."
10056050-11 = "………."
10056050-12 = "관련하여 뭔가 짚이는 부분은 없었어?"
10056050-16 = "짚이는 부분이…… 있긴 합니다……."
10056050-20 = "유감이야, 코코로 부장."
10056050-21 = "불의의 사고라면 어느정도 참작이 가능하지만, 개인의 부주의로 발생한 사고에 대해서는 아일랜드도 적극적으로 지원을 하기는 어려워서……"
10056050-22 = "아무래도 이번 사고에 대해서는 다이빙부에도 어느 정도 수리비를 청구해야 할 것 같네."
10056050-23 = "저, 저기……"
10056050-24 = "이런 질문을 드리는 게 다소 면목없다는 건 알고 있지만……"
10056050-25 = "호, 혹시 비용이 얼마나 나오려나요……?"
10056050-26 = "우선 보수 및 배수 작업에 든 기재 비용을 시작으로 함선 수리 비용과 침수로 인해 못 쓰게 된 적재물의 배상 비용까지 더하면……"
10056050-30 = "아마, 이 정도 금액이 청구될 예정입니다."
10056050-31 = "………!"
10056050-32 = "저, 저기…… 혹시 숫자가 잘못된 건 아닌가요?"
10056050-33 = "뭔가 화면에 저희 동아리 1년 운영비를 넘는 비용이 적혀 있는 것 같은데……"
10056050-34 = "계산에 틀린 부분은 없습니다."
10056050-35 = "오히려 사고로 배를 사용하지 못하는 동안의 손실액은 아일랜드에서 부담하기로 했으니 예상보다 적게 나왔다고 생각하시는 편이 좋을 겁니다."
10056050-36 = "으으……"
10056050-37 = "[s1] \"뭔가 봐줄 수는 없는 거야?\"\n[s2] \"아무리 그래도 불의의 사고인데, 예외로 할 수는……\""
10056050-40 = "예외라……"
10056050-41 = "선생님. 변수로 가득한 바다를 항해할 때 가장 내려서는 안 되는 위험한 판단이 무엇인지 아시나요?"
10056050-42 = "바로 예외를 두는 것입니다."
10056050-44 = "의도치 않았으니까. 어쩔 수 없으니까. 이번만이니까."
10056050-45 = "편의를 위해, 혹은 상대를 배려하기 위해 예외를 하나씩 두기 시작하는 순간……"
10056050-46 = "배의 결속은 순식간에 헐거워지고, 파도를 견뎌낼 수 없게 됩니다."
10056050-48 = "게다가 이곳이 정박지가 아니라 망망대해 한 가운데였더라면, 이 사소한 실수가 인명 사고로 이어졌을 수도 있습니다."
10056050-49 = "제 자리를 떠난 판자 한 장 때문에, 배가 가라앉을 수도 있는 법이니까요."
10056050-50 = "[s] \"하지만……\""
10056050-51 = "사실 다이빙부가 지고 있는 빚을 모두 없앨 수 있는 다른 방법이 있기는 합니다."
10056050-52 = "지금 바로 폐부 신청을 하신다면 다이빙부에 청구된 비용은 일괄 면제됩니다."
10056050-53 = "어때. 지금 바로 폐부 신청서를 작성할래?"
10056050-54 = "………!"
10056050-55 = "그리 가혹한 결정은 아니라고 생각하는데."
10056050-56 = "다이빙부의 부원들은 신체 능력이 뛰어난 편이니, 트라이던트나 다른 동아리에 입부하더라도 충분히 활약할 수 있을 거야."
10056050-57 = "하지만…… 오디세이아에서도 수중 활동을 할 수 있는 장소는 다이빙부 뿐인데……"
10056050-58 = "그건, 그렇지만."
10056050-62 = "……죄송합니다. 부원들과 조금 더 고민해 보고 올게요."
10056050-70 = "후우……"
10056050-71 = "악역은 별로 취향이 아닌데."
10056050-72 = "어쩌겠습니까. 아일랜드의 함장이라는 것이 그러기 위한 자리인데."
10056050-73 = "히잉."
10056050-74 = "어른스럽게 구세요."
10056050-81 = "……부장!"
10056050-82 = "미안, 부장…… 많이 혼났어?"
10056050-83 = "……미안해."
10056050-87 = "아니, 괜찮아. 어쩔 수 없는 사고였으니까."
10056050-88 = "따개비가 갑자기 폭발할 거라곤 아무도 생각하지 못했으니까……"
10056050-89 = "하지만 청구서가 꽤 나왔을 텐데, 괜찮겠어?"
10056050-90 = "이미 진 빚도 꽤 있는데, 이 이상 빚이 늘어나면 감당할 수 없을 거야."
10056050-91 = "역시 포기하는 편이……"
10056050-92 = "그, 그렇지 않아!"
10056050-93 = "벌써 약한 소리를 하면 안 되지. 이 상황을 타개할 수 있는 다른 방법이 또 있을 거야."
10056050-94 = "……다른 방법이라면?"
10056050-98 = "뭔가 일확천금을 단번에 벌 수 있는 보물섬의 지도라던가~"
10056050-99 = "저기, 혹시 다이빙부 학생들이신가요?"
10056050-100 = "네, 네, 넷?!"
10056050-101 = "죄, 죄송합니다. 혹시 저희 때문에 망가진 어망이나 통발 이야기라면—"
10056050-106 = "아뇨. 그런 문제가 아니라 여쭈고 싶은 게 있어서요."
10056050-107 = "듣기로는 오디세이아에서 제일 가는 잠수 전문가들이라고 하시던데."
10056050-111 = "한 가지 의뢰를 드려도 괜찮을까요?"
