[translation]
10056050-1 = "第5話;損害賠償"
10056050-2 = "アイランド・士官室"
10056050-3 = ""
10056050-4 = ""
10056050-5 = ""
10056050-6 = "……船底を掃除していたらフジツボが爆発した、と？"
10056050-7 = "……はい。"
10056050-8 = "俄かには信じがたいけど……。"
10056050-9 = "とはいえ、作業中の爆発で船に穴が開くこと自体は日常茶飯事。"
10056050-10 = "例えば――掃除が面倒だからといって、付着物を爆弾で吹き飛ばそうとしたり。"
10056050-11 = "…………。"
10056050-12 = "心当たりはないの？"
10056050-13 = ""
10056050-15 = ""
10056050-16 = "まったくない、わけでは……ない、です……。"
10056050-17 = ""
10056050-19 = ""
10056050-20 = "……残念でならないわ、ココロ部長。"
10056050-21 = "不慮の事故なら酌量の余地もあったけど……。"
10056050-22 = "個人の不注意が原因なら、ダイビング部にも修理費を負担してもらうことになる。"
10056050-23 = "あ、あの……。"
10056050-24 = "こんなことを聞くのは恥ずかしいのですが……。"
10056050-25 = "その……金額はどのくらいに……？"
10056050-26 = "補修に係る費用と、海水に浸った物の損害賠償まで考慮すると……。"
10056050-27 = ""
10056050-29 = ""
10056050-30 = "概算でこの程度になるかと。"
10056050-31 = "ひぇっ……！"
10056050-32 = "あ、あの……何かの間違いじゃないですか？"
10056050-33 = "うちの年間活動費以上の金額に見えるのですが……。"
10056050-34 = "計算に間違いはありません。"
10056050-35 = "むしろこれでも少なく見積もっています。#n事故で船を使用できない間の損失は、アイランドが負担しますので。"
10056050-36 = "ううぅ……。"
10056050-37 = "[s1] \"どうにかならないかな？\"\n[s2] \"なんかこう、例外として……。\""
10056050-40 = "[ruby=・]例[/ruby][ruby=・]外[/ruby]、ですか……。"
10056050-41 = "先生。不確定要素の多い航海で、最もやってはいけない判断は何だと思いますか？"
10056050-42 = "答えは、例外を認めること。"
10056050-44 = "意図したものではないから。しょうがないから。今回だけだから。"
10056050-45 = "理由はどうあれ、例外を認め始めた瞬間――"
10056050-46 = "船の結束は一息に緩み、荒波を乗り越える力を失います。"
10056050-48 = "今は停泊中であることだけは幸いでしたが、これが海のど真ん中だったら……#n小さなミスが、命を脅かす大事故につながっていたかもしれません。"
10056050-49 = "たった1枚、あるべき場所から板がなくなるだけで、船が沈むこともあるのです。"
10056050-50 = "[s] \"でも……。\""
10056050-51 = "先生の口添えがあろうと、本件に例外を適用することはできません。#nですが……チャラにする方法が、あるにはあります。"
10056050-52 = "賠償は、部員ではなく、部に請求されるもの。部そのものが無くなれば免除されます。"
10056050-53 = "廃部という手もあるけど……どうする？"
10056050-54 = "えっ……。"
10056050-55 = "それほど難しい選択でもないと思うけど。"
10056050-56 = "ダイビング部は身体能力が高いから、トライデントや他の部でも活躍できるはず。"
10056050-57 = "でも……水中での活動をするならダイビング部でないと……。"
10056050-58 = "うん、それも理解してる。"
10056050-59 = ""
10056050-61 = ""
10056050-62 = "……すみません。みんなと考えてきます。"
10056050-63 = ""
10056050-65 = ""
10056050-69 = ""
10056050-70 = "ふぅ……。"
10056050-71 = "悪役は趣味じゃないんですけどね。"
10056050-72 = "仕方ないですよ。艦長とはそういうものです。"
10056050-73 = "ぴえーん。"
10056050-74 = "幼稚な言葉遣いは慎んでください。"
10056050-76 = ""
10056050-78 = ""
10056050-79 = ""
10056050-80 = ""
10056050-81 = "……部長！"
10056050-82 = "ごめん、部長……しこたま詰められたよね？"
10056050-83 = "……ごめんね。"
10056050-84 = ""
10056050-86 = ""
10056050-87 = "ううん、大丈夫。仕方なかったんだから。"
10056050-88 = "フジツボが急に爆発するなんて思わなかったし……。"
10056050-89 = "賠償請求とか……平気？"
10056050-90 = "借金がこれ以上増えたら手に負えないよ。"
10056050-91 = "やっぱり諦めたほうが……。"
10056050-92 = "そ、そんなことない！"
10056050-93 = "今から弱音を吐いてちゃダメ。きっと打開策があるはずだから。"
10056050-94 = "……例えば？"
10056050-95 = ""
10056050-97 = ""
10056050-98 = "一獲千金を狙えるような宝の地図とか……。"
10056050-99 = "もしかして、ダイビング部の皆さんですか？"
10056050-100 = "はっ、えっ、はいっ！？"
10056050-101 = "ご、ごめんなさい！#n私たちが破った網の話なら――"
10056050-102 = ""
10056050-104 = ""
10056050-105 = ""
10056050-106 = "網……？#nいえ。お尋ねしたいことがありまして。"
10056050-107 = "オデュッセイアで最も優秀なダイバーが集まってると聞いたんですけど……。"
10056050-108 = ""
10056050-110 = ""
10056050-111 = "その腕を見込んで……依頼をしても？"
