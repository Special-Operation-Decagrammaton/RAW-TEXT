[translation]
2001402-1 = "북풍과 태양"
2001402-2 = "샬레 업무관"
2001402-3 = "(어느 무더운 한낮의 오후.)"
2001402-4 = "하아, 덥다……."
2001402-5 = "어쩐지 키보토스는 나날이 더워지는 것 같아."
2001402-6 = "그래도 뭐, 이제 샬레에 도착했으니 드디어 시원한 공간에서 쉴 수 있겠네……"
2001402-7 = "……어라? 오늘따라 사무실이 왜 이렇게 찜통 같지?"
2001402-8 = "[s] \"오늘은 에어컨이 고장 나서 수리 중이야.\""
2001402-9 = "으윽…… 이 더운 날씨에 에어컨이 고장 나다니……."
2001402-10 = "샬레에 도착하면 조금이나마 땀을 식힐 수 있지 않을까 기대했는데."
2001402-11 = "……하는 수 없지. 오늘은 더위를 참은 채 업무를 보는 수밖에."
2001402-12 = "[s] \"너무 더우면 그 철모는 벗는 게 어때?\""
2001402-13 = "그게 무슨 말도 안 되는 소리야, 선생님?"
2001402-14 = "철모는 가장 치명적인 급소인 머리를 지키는 보호장구. 작전 중에는 절대로 벗어서는 안 되는 물건이라고!"
2001402-15 = "작전 중에 땀을 식히기 위해 철모를 벗었다가 저격에 당한 병사가 몇이나 되는 줄 알아?"
2001402-16 = "비록 총알이 오가는 현장은 아니지만, 샬레의 업무도 엄연한 작전의 일환."
2001402-17 = "SRT의 특수요원이 작전 중에 머리를 노출하고 땀을 식히고 있다는 걸 다른 학생들이 보게 된다면 사람들이 SRT 학원을 어떻게 생각하겠어?"
2001402-18 = "[s] \"하지만 대부분 다른 학생들도 철모는 쓰지 않는걸.\""
2001402-19 = "그건 그쪽의 사정이지. 내가 신경 쓸 바가 아니야."
2001402-20 = "여하튼, 업무 중에는 무슨 일이 있어도 철모를 벗을 수 없어!"
2001402-21 = "[s] \"……무슨 일이 있어도?\""
2001402-22 = "음, 당연하지."
2001402-23 = "무슨 일이 있어도, 절대로!"
2001402-25 = "(이후, 사키의 더위를 식혀 주기 위해 철모를 벗도록 여러 가지 방법으로 유인해 보았다.)"
2001402-28 = "[ns] \"사키, 철모 위로 벌레가 기어가고 있어.\""
2001402-29 = "응?"
2001402-33 = "뭐야. 아무것도 손에 잡히지 않았는데. ……그새 도망간 건가."
2001402-34 = "[s] \"……벌레를 손으로 잡으려 한 거야?\""
2001402-35 = "응. 무슨 문제라도 있어?"
2001402-36 = "……설마 머리에 벌레가 붙었다는 이유 하나만으로 내가 어린애처럼 호들갑을 떨 거라고 생각한 거야?"
2001402-37 = "대담하게 선봉에 서야 하는 포인트맨이 겨우 그 정도의 일에 호들갑을 떨 리가 없잖아."
2001402-38 = "벌레가 사라졌으면 상관없어. 다음에 처리할 업무가……."
2001402-41 = "[ns] \"최근 연구 결과에 의하면 물구나무 자세가 건강에 좋대.\""
2001402-42 = "……헤, 그렇구나."
2001402-46 = "……샬레에 보관 중인 카라비너와 지주 핀의 내구연한이……."
2001402-47 = "[ns] \"……물구나무를 서 보지 않을래?\""
2001402-48 = "지금? 갑자기? 여기서?"
2001402-49 = "……."
2001402-50 = "선생님에게 이상한 취미가 있다고 듣긴 했지만……"
2001402-51 = "치마를 입은 여학생에게 물구나무 자세를 시키려는 의도가 도대체 뭐야?"
2001402-52 = "[s] \"그, 그런 의도가 아니라…….\""
2001402-53 = "뭐, 말하지 않아도 선생님의 생각은 훤히 보이지만."
2001402-54 = "그러니까 쓸데없는 소리는 하지 말고 업무에나 계속 집중해."
2001402-56 = "(……결국 최후의 수단을 쓰기로 했다.)"
2001402-58 = "[ns] 몰래 다가가 사키의 철모를 벗긴다."
2001402-62 = "……뭐 하는 거야?"
2001402-63 = "갑자기 말도 없이 시야의 사각에서 머리를 노리다니……."
2001402-64 = "기습에 대처하는 능력이라도 시험해 보고 싶어진 거야?"
2001402-65 = "지금은 다른 업무로 바쁘니 방해하지 말아줬으면 좋겠는데."
2001402-66 = "[s] \"미, 미안…….\""
2001402-68 = "(결국 사키의 철모를 벗기지 못한 채 당번 활동 시간이 모두 끝나버렸다…….)"
2001402-71 = "하아, 드디어 업무가 끝났네."
2001402-72 = "[s] \"……수고했어.\""
2001402-73 = "응, 선생님도 수고했어."
2001402-74 = "그나저나 오늘은 평소보다 더 지쳐 보이네. 에어컨이 고장 나서 그런가?"
2001402-75 = "후…… 그러고 보니 나도 평소보다 더 지친 것 같아. 더워……."
2001402-80 = "[ns] \"사키, 너…… 어째서……\""
2001402-81 = "응? 왜?"
2001402-82 = "[s] \"작전 중에는 철모를 절대 벗지 않는다며?\""
2001402-83 = "응. 작전 중에는 언제나 철모를 쓰고 있어야지."
2001402-84 = "하지만 방금은 업무가 끝났으니 철모를 벗은 것이고……"
2001402-85 = "무슨 문제라도 있어?"
2001402-86 = "[s1] \"더워서 쓰러진 건 아니니 다행이지만……\"\n[s2] \"그럼 나는 그동안 무엇을 위해…….\""
2001402-87 = "……이상한 어른이야."
2001402-88 = "……이상한 어른이야."
2001402-90 = "(……그리고 사키는 수상한 시선을 남겨둔 채, 자신의 캠프로 돌아갔다.)"
