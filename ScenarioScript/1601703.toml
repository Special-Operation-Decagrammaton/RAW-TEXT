[translation]
1601703-1 = "I hate this world"
1601703-2 = "(아오바가 불러준 장소로 이동했다)"
1601703-8 = "[ns] \"이곳인가……\""
1601703-12 = "아, 선생님……!"
1601703-17 = "와, 와주셔서 감사해요……"
1601703-18 = "진짜 오실 줄은 몰랐는데……"
1601703-22 = "아! 오, 오늘 해야 하는 일은 신호기 정비인데요……"
1601703-23 = "이 건널목의 신호기가 자꾸 이상하게 깜빡인다고……"
1601703-24 = "기차가 오지 않을 때도 계속해서 알람이 울린다고 하네요……"
1601703-28 = "아, 지금처럼요……"
1601703-29 = "[s] \"빨리 수리해야겠네.\""
1601703-30 = "네, 네에…… 그럼 일단 한번 진단을 해볼게요."
1601703-35 = "흠…… 기기 배선에는 문제없고……"
1601703-36 = "센서 문제려나……"
1601703-40 = "일단 한번……"
1601703-44 = "에, 에잇……!"
1601703-49 = "하, 한 번 더……!"
1601703-54 = "[ns] \"그, 그래도 되는 거야?\""
1601703-58 = "네, 네?"
1601703-59 = "[s] \"파이프렌치로 신호기를 때려도 괜찮은 거야……?\""
1601703-60 = "아……"
1601703-64 = "아, 아아!"
1601703-65 = "네에…… 헤헤."
1601703-66 = "대부분의 기계 문제는 때리면 해결이 되거든요……"
1601703-67 = "사, 사람이랑 똑같아요……"
1601703-68 = "[s] \"뭔가 흘려들을 수 없는 말이 나왔는데?!\""
1601703-69 = "아, 아무튼…… 이렇게 하면 금방 고쳐져요……"
1601703-70 = "일단은 다음 기차가 지나가기 전에 수리를 끝내야 하니까……"
1601703-71 = "빠, 빠르게 가볼게요……"
1601703-78 = "주, 죽어……!!"
1601703-91 = "……조용해졌네요……"
1601703-92 = "[s] \"이제 고쳐진 것 같은데?\""
1601703-93 = "호, 혹시 모르니 한동안 지켜보죠……"
1601703-96 = "(그렇게 아오바와 함께 한동안 건널목을 지켜보았다.)"
1601703-100 = "(기차가 지나갈 때만 잘 작동하는 것을 확인했다.)"
1601703-103 = "되, 된 것 같아요…… 헤헤…… 잘 고쳐졌다."
1601703-104 = "[s] \"그 방법이 효과가 있구나……\""
1601703-105 = "아, 안 되면 내부까지 모두 분해했어야 했는데……"
1601703-106 = "다행히 플랜A로 마무리가 되었네요……"
1601703-107 = "고, 고생하셨어요…… 선생님."
1601703-108 = "[s1] \"나는 아무것도 안 했는걸.\"\n[s2] \"내가 필요 없었던 것 같기도……\""
1601703-113 = "그, 그게요……"
1601703-114 = "사실……"
1601703-115 = "저 혼자도 괜찮은 일이긴 했어요……"
1601703-116 = "……그, 그런데 저번에 선생님께서 언제든지 말하라고 하신 게 생각나서……"
1601703-117 = "그래서……"
1601703-118 = "호, 혹시 기대해 봐도 되려나……? 하는 마음에 연락드려본 건데……"
1601703-119 = "저, 정말 와주실 줄은 몰랐어요……"
1601703-120 = "……"
1601703-121 = "바, 바쁘신데 죄송합니다! 으아아……"
1601703-125 = "[ns3] \"그런 거라면 잘 불러줬어.\"\n[ns4] \"학생의 부름에 응답하는 게 선생님이니까.\""
1601703-130 = "그, 그렇군요……"
1601703-131 = "……선생님은 기대에 응답하는 사람…… 이네요……"
1601703-132 = "[s5] \"꼬, 꼭 그렇지는 않을 수도 있어!\"\n[s6] \"나도 항상 그런 건 아니거든……\""
1601703-137 = "푸, 푸훗……"
1601703-138 = "아…… 그렇네요. 선생님도 사람이시구……"
1601703-139 = "오늘 이렇게 와주셔서 감사해요. 다음이 없더라도요. 오늘만이라도……"
1601703-140 = "후후."
1601703-142 = "(그렇게 아오바와 이런저런 이야기를 나누다가 돌아왔다.)"
