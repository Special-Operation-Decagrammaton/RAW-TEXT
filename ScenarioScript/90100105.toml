90100105-27 = "[ns] \"Is everyone okay?\""
90100105-28 = "I don't see a single scratch. What about you, Sensei?"
90100105-29 = "[s1] \"Oh, I was just giving orders.\"\n[s2] \"I'm perfectly fine.\""
90100105-32 = ""
90100105-34 = ""
90100105-35 = ""
90100105-36 = ""
90100105-37 = "This was my first time working with you in combat, Sensei. It was incredible."
90100105-38 = "That's right. It felt like there was a drone, NO, something from even higher up—looking out for us."
90100105-39 = "Thank you very much! This wrapped up so much more easily than usual."
90100105-40 = "I suppose your reputation is warranted. You have an eye for placement and harnessing our talents."
90100105-41 = "I understand why RABBIT trusted you..."
90100105-42 = "[s] \"It's flattering to hear such praise...\""
90100105-43 = ""
90100105-45 = ""
90100105-46 = "[ns] \"More importantly, are all the kunekune gone?\""
90100105-47 = "It appears so. I do not detect any haze anomalies."
90100105-48 = "If this means we fully resolved the \"Lore\" issue..."
90100105-49 = "We have an unscathed scene. Not a single bullet hole. I'm starting to wonder if it even happened."
90100105-50 = "But all that shoot made me feel so much better! It was nice to have something REAL to shoot at, you know?"
90100105-51 = "Even better than when we found that box of unregistered ammo in the armory?"
90100105-52 = "Oh yeah. It was fun, but dealing with it was SUCH a headache..."
90100105-53 = "What are you two talking about...?"
90100105-54 = "N-Nothing!"
90100105-55 = "I-I was just imagining... Haha!"
90100105-56 = ""
90100105-58 = ""
90100105-59 = ""
90100105-60 = ""
90100105-61 = "By the way, where did those shards on the floor come from?"
90100105-62 = "Hmm... I don't see a lot of glass around here."
90100105-63 = "M-Maybe they dropped from the kunekune?"
90100105-64 = "Let's see..."
90100105-65 = ""
90100105-67 = ""
90100105-68 = "Hey, FOX 4!"
90100105-70 = "Huh... Interesting. It's shimmering with a strange hue."
90100105-71 = "Be careful! You could get entranced again!"
90100105-72 = "Ah, sorry, sorry."
90100105-73 = "I thought it'd be fine since you were watching over me."
90100105-74 = "I can't keep my eyes on you 24/7, okay?!"
90100105-75 = "More importantly... The view reflected in this glass isn't from here, right?"
90100105-76 = "Yeah. But it's familiar."
90100105-77 = ""
90100105-78 = "It's that grass field. The one the kunekune inhabits..."
90100105-79 = "I guess it's all right. We can look at it safely."
90100105-80 = "Sure... But it's creeping me out. What's going on with the colors?"
90100105-81 = "A glass shard reflecting another world."
90100105-82 = "This seems...uncanny. This is clearly no ordinary shard."
90100105-83 = "Doesn't the General Student Council President also collect things like this?"
90100105-84 = "What? Do you think we should bring it to her?"
90100105-85 = "[s] \"This shard...\""
90100105-86 = "Is something wrong, Sensei?"
90100105-87 = ""
90100105-88 = "This world found its story rewritten, brutishly and suddenly, just last night. Contradictions are still scattered within the subtext."
90100105-89 = "Investigate, collect, and record them."
90100105-91 = "[ns3] \"(Could this glass shard be...)\"\n[ns4] \"(...evidence of the contradictions Orwell mentioned?)\""
90100105-94 = ""
90100105-95 = "Sensei. Would you please hold onto this glass shard for now?"
90100105-96 = "[s] \"You don't want to report it to the General Student Council President?\""
90100105-97 = "...I think you having it is fine."
90100105-98 = "I'm not sure about anything, but I'm certain I will figure things out in time."
90100105-99 = "Until then, I would like you to make decisions on my behalf."
90100105-100 = "[s] \"Okay. Then I'll hold onto this.\""
90100105-101 = "Yes. Now then..."
90100105-102 = ""
90100105-104 = ""
90100105-105 = ""
90100105-106 = "...Please excuse me."
90100105-107 = "I've been nervous too. But, now that we've eased up, I'm starting to get hungry."
90100105-108 = "Yeah. Maybe I should have packed some inarizushi."
90100105-109 = "Eh, you know you can't pack a bento in this weather."
90100105-110 = "We're still in the city! How about we pick up some take-out on the way home?"
90100105-111 = "I don't have any cash. And it's not like I can flash my student ID card..."
90100105-112 = ""
90100105-113 = "[ns] \"Finally, it is time for my credit card to shine.\""
90100105-114 = ""
90100105-115 = "[ns] \"What would you like?\""
90100105-116 = "In that case, I'll take fried tofu udon from the front of the station..."
90100105-117 = "You're really going to waste this opportunity on some cheap udon?"
90100105-118 = "You should ask for something expensive... Yeah, something like a double katsudon meal!"
90100105-119 = "I can't believe double katsudon is the extent of your imagination."
90100105-120 = "Sensei, can we go to that yakiniku place from last time?"
90100105-121 = "I didn't get to try out the grilled beef intestine because I was so full."
90100105-122 = "[s] \"Of course!\""
90100105-123 = ""
90100105-125 = ""
90100105-126 = ""
90100105-127 = "U-Um. Sensei, you don't have to..."
90100105-128 = "[s5] \"It's not a problem.\"\n[s6] \"SRT has their own missions. Mine is to ensure you're fed well.\""
