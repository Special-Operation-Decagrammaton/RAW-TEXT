[translation]
90100105-5 = "A 사이트 클리어."
90100105-11 = "B 사이트 클리어."
90100105-17 = "마지막 타겟의 무력화를 확인…… '초원'은 더 이상 보이지 않는 것 같아."
90100105-21 = "확인. 작전 종료. 현 시간부로 등화관제를 해제한다."
90100105-27 = "[ns] \"다들 무사해?\""
90100105-28 = "네, 모두 다친 곳 하나 없이 멀쩡해요. 선생님도 괜찮으신가요?"
90100105-29 = "[s1] \"나야 멀리서 관제만 하고 있었는걸.\"\n[s2] \"괜찮아. 생채기 하나 없이 멀쩡해.\""
90100105-37 = "그나저나 선생님의 전투 지원을 직접 받는 건 처음이었는데…… 뭔가 대단한 느낌이네."
90100105-38 = "그러게. 뭔가 정찰 드론— 아니, 그보다 더 높은 곳에서 우리를 지켜보고 있는 것처럼 느껴졌어."
90100105-39 = "덕분에 평소보다 더 빠르게 상황을 정리할 수 있었던 것 같네요. 감사합니다."
90100105-40 = "역시 학생들의 재능을 누구보다 빠르게 파악하여 적재적소에 배치한다는 선생님의 소문은 과장된 것이 아니었군요."
90100105-41 = "후배들이 어째서 선생님의 지휘를 신뢰하는지 새삼 깨닫게 되었습니다."
90100105-42 = "[s] \"SRT의 베테랑들에게 그런 칭찬을 들으니 부끄럽네……\""
90100105-46 = "[ns] \"그나저나 이것으로 쿠네쿠네는 모두 사라진 건가?\""
90100105-47 = "네. 이제는 더 이상 아지랑이를 관찰하더라도 아무런 반응이 없네요."
90100105-48 = "이것으로 [ruby=로어]이상 현상[/ruby]이 완전히 사라졌다면 다행이겠지만……"
90100105-49 = "그렇게 총알을 쏟아부었는데도 탄흔 하나 없이 멀쩡한 현장을 보고 있으니, 정말 허깨비에게 홀린 기분이네."
90100105-50 = "그래도 한바탕 총을 쏘고 나니 뭔가 후련한 기분이야. 실체가 존재하는지도 모를 적을 상대로 기력을 낭비하는 건 최악이니까."
90100105-51 = "무기고에서 장부에 기입되지 않은 실탄을 한 박스 발견했을 때처럼?"
90100105-52 = "맞아. 그 때는 이걸 어떻게 처리해야 할지 정말 고민했었는데—"
90100105-53 = "두 사람 다 무슨 이야기를 하고 있는 걸까나……?"
90100105-54 = "아, 아무것도 아니야!"
90100105-55 = "예, 예시를 들자면 그렇다는 거지…… 하하!"
90100105-61 = "그런데, 저기 바닥에 흩어져 있는 유리 조각은 어디서 떨어진 거지?"
90100105-62 = "그러게. 이 근처에는 유리로 된 구조물 같은 건 없었는데."
90100105-63 = "호, 혹시 쿠네쿠네에게서 떨어진 건가?"
90100105-64 = "어디 보자……"
90100105-68 = "야, FOX 4!"
90100105-70 = "오오…… 이게 뭐야. 엄청나게 이상한 빛깔로 일렁이고 있어."
90100105-71 = "조, 조심하라고 했잖아! 멋대로 집어들었다가 또 괴이에 홀리면 어쩌려고!"
90100105-72 = "아, 미안미안."
90100105-73 = "하지만 네가 지켜보고 있으니 괜찮을 것 같아서 무심코."
90100105-74 = "내가 네 모든 일거수일투족을 지켜봐 줄 수는 없거든?!"
90100105-75 = "그보다…… 이 유리에 비친 풍경은 이 장소가 아니지?"
90100105-76 = "그러게. 뭔가 낯이 익은데."
90100105-78 = "아, <쿠네쿠네>가 있던 그 초원이다."
90100105-79 = "이건 맨눈으로 봐도 문제가 없나 봐."
90100105-80 = "그렇다면 다행이지만…… 뭔가 계속 시선을 두기는 꺼림칙한걸. 색도 기묘한 느낌으로 일렁이고 있고."
90100105-81 = "다른 세계의 풍경을 비추는 유리 조각이라."
90100105-82 = "단순한 유리 조각이라기보다는 [ruby=오파츠]이론상 존재할 수 없는 물건[/ruby]에 가깝군."
90100105-83 = "그러고보니 총학생회장도 이런 이상한 물건을 잔뜩 수집하고 있었지."
90100105-84 = "그럼 이 유리 조각은 총학생회장에게 가져다 주면 되려나?"
90100105-85 = "[s] \"이 파편은……\""
90100105-86 = "선생님, 뭔가 짚이는 게 있으신가요?"
90100105-88 = "이 세계는 어젯밤 갑작스럽게 변모했기 때문에, 검은 깃털과 같은 모순이 세계 곳곳에 남아 있습니다."
90100105-89 = "조사하고, 수집하고, 기록하십시오."
90100105-91 = "[ns3] (혹시 이 유리 조각이……)\n[ns4] (……그가 말했던 모순의 증거인가?)"
90100105-95 = "선생님. 일단 이 유리 조각은 선생님께서 보관해 주시겠습니까?"
90100105-96 = "[s] \"총학생회장에게 보고하지 않아도 괜찮아?\""
90100105-97 = "……아직은 괜찮을 것 같습니다."
90100105-98 = "현재로서는 아무것도 확신할 수 없지만, 묵묵히 정보를 모아 나가다 보면 이 미시감의 정체를 깨닫게 될 날이 올 테니까요."
90100105-99 = "그 때까지는 선생님께서 판단을 대신해 주셨으면 합니다."
90100105-100 = "[s] \"알겠어. 그럼 지금은 내가 맡아둘게.\""
90100105-101 = "네. 그럼 이제—"
90100105-106 = "……실례했습니다."
90100105-107 = "아아, 나도 너무 긴장을 해서 그런가. 갑자기 배가 고프네~"
90100105-108 = "그러게. 이럴 줄 알았으면 유부초밥이라도 싸올걸."
90100105-109 = "에이, 이런 날씨에 도시락을 싸왔으면 금방 상했을걸?"
90100105-110 = "어차피 도심 밖으로 나온 것도 아니고, 근처에서 적당히 식사라도 하고 돌아갈래?"
90100105-111 = "하지만 현금은 안 갖고 나왔는데. SRT 때 쓰던 ID 카드를 쓸 수도 없고……"
90100105-113 = "[ns] \"마침내 어른의 카드를 쓸 때가 돌아왔군.\""
90100105-115 = "[ns] \"먹고 싶은 게 있으면 말만 해. 뭐든지 사 줄게!\""
90100105-116 = "아, 그럼 저는 역 앞의 유부 우동을……"
90100105-117 = "니코, 모처럼의 기회를 겨우 500엔 짜리 우동으로 날릴 셈이야?"
90100105-118 = "이럴 때는 비싼 음식을…… 그래, 더블 가츠동 정식 같은 거라도 사달라고 해야지!"
90100105-119 = "고작 비싼 음식이라고 떠올리는 게 더블 가츠동이라니."
90100105-120 = "선생님, 혹시 지난 번에 데려가 주었던 그 고깃집도 괜찮아?"
90100105-121 = "지난 번에 배가 불러서 미처 못 먹었던 대창 구이가 그동안 계속 신경 쓰였는데."
90100105-122 = "[s] \"물론이지!\""
90100105-127 = "저, 저기. 선생님, 이러실 필요는……"
90100105-128 = "[s5] \"폐를 끼친다고 생각할 필요는 없어.\"\n[s6] \"SRT의 작전과 마찬가지로 아이를 잘 먹이는 건 어른의 의무이니까.\""
90100105-135 = "……역시 선생님께선 학생을 다루는 법을 잘 이해하고 계시는군요."
90100105-136 = "그럼 이번에도 잘 부탁드리겠습니다."
90100105-138 = "(이후, 고깃집에서 작전의 뒤풀이를 겸해서 식사를 하며 즐거운 시간을 보냈다.)"
90100105-140 = "다음화;소문과 불가해"
