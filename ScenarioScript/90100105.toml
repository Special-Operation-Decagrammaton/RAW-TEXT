90100105-136 = "งั้นครั้งนี้ก็ขอรบกวนด้วยค่ะ"
90100105-138 = "(หลังจากนั้นทุกคนก็ไปกินเนื้อย่างเพื่อฉลองปิดปฏิบัติการ และใช้เวลาร่วมกันอย่างสนุกสนาน)"
