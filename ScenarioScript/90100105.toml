90100105-27 = "[ns] \"ทุกคนปลอดภัยดีใช่มั้ย?\""
90100105-28 = "ค่ะ ทุกคนปลอดภัยดี ไม่มีตรงไหนได้รับบาดเจ็บค่ะ คุณครูก็ปลอดภัยดีมั้ยคะ?"
90100105-29 = "[s1] \"อื้อ ครูแค่ช่วยควบคุมจากระยะไกลเอง\"\n[s2] \"อื้อ ครูก็ไม่ได้รับบาดเจ็บตรงไหนเหมือนกัน\""
90100105-32 = ""
90100105-34 = ""
90100105-35 = ""
90100105-36 = ""
90100105-37 = "จะว่าไป นี่เป็นครั้งแรกที่การต่อสู้ของเราได้รับการสนับสนุนจากคุณครู... รู้สึกน่าทึ่งกว่าที่คิดนะ"
90100105-38 = "นั่นสิเนอะ ให้ความรู้สึกเหมือนมีโดรนลาดตระเวน... ไม่สิ เหมือนมีใครคอยมองดูพวกเราจากที่สูงๆ กว่าโดรนไปอีก"
90100105-39 = "เราก็เลยคลี่คลายสถานการณ์ได้รวดเร็วกว่าที่เคยค่ะ ขอบคุณคุณครูนะคะ"
90100105-40 = "สมกับที่ลือกันว่า คุณครูมองเห็นพรสวรรค์ของนักเรียนได้เร็วกว่าใคร และจัดวางแต่ละคนได้อย่างเหมาะสมเลยค่ะ"
90100105-41 = "ตอนนี้ฉันเข้าใจแล้วค่ะ ว่าทำไมรุ่นน้องถึงไว้วางใจการสั่งการของคุณครู"
90100105-42 = "[s] \"ได้ยินคำชมแบบนี้จากคนเก่งๆ ของ SRT แล้วก็เขินเหมือนกันนะ...\""
90100105-43 = ""
90100105-45 = ""
90100105-46 = "[ns] \"ว่าแต่ แบบนี้คุเนะคุเนะก็หายไปหมดแล้วใช่มั้ย?\""
90100105-47 = "ใช่ค่ะ ตอนนี้ต่อให้สังเกตไอร้อน ก็ไม่เกิดปฏิกิริยาอะไรอีกแล้วค่ะ"
90100105-48 = "ถ้าปฏิบัติการนี้ทำให้[ruby=ตำนาน]ปรากฏการณ์ผิดปกติ[/ruby]หายไปให้หมดเลยก็คงจะดีนะคะ..."
90100105-49 = "ทั้งที่ระดมยิงไปขนาดนั้น แต่พอเห็นว่าที่เกิดเหตุยังสภาพดี ไม่มีแม้แต่รอยกระสุนสักนัด ก็ชวนให้รู้สึกเหมือนถูกภาพลวงหลอกจริงๆ เลย"
90100105-50 = "แต่พอได้สาดยิงไปเต็มที่ ก็รู้สึกโล่งอย่างบอกไม่ถูกเลยละ ก็การต้องเปลืองแรงกับศัตรูที่ไม่รู้ด้วยซ้ำว่า#nมีตัวตนจริงหรือเปล่า มันแย่ที่สุดเลยนี่นา"
90100105-51 = "เหมือนตอนเจอกระสุนจริงหนึ่งกล่องที่ไม่ได้ลงทะเบียนไว้ในระบบจากคลังอาวุธน่ะเหรอ?"
90100105-52 = "ใช่ ตอนนั้นฉันคิดหนักเลยว่าจะจัดการกับเรื่องนี้ยังไงดี..."
90100105-53 = "ทั้งสองคนกำลังคุยเรื่องอะไรกันอยู่น่ะ...?"
90100105-54 = "มะ... ไม่มีอะไรทั้งนั้น!"
90100105-55 = "ฉะ... ฉันแค่ยกตัวอย่างให้ฟังน่ะ... ฮ่าฮ่า!"
90100105-56 = ""
90100105-58 = ""
90100105-59 = ""
90100105-60 = ""
90100105-61 = "ว่าแต่ เศษแก้วที่เกลื่อนอยู่บนพื้นตรงนั้น มันหล่นมาจากไหนน่ะ?"
90100105-62 = "นั่นสิ แถวนี้ก็ไม่น่าจะมีสิ่งก่อสร้างที่ทำจากกระจกนี่นา"
90100105-63 = "ระ... หรือว่าหล่นมาจากคุเนะคุเนะ?"
90100105-64 = "ไหนดูซิ..."
90100105-65 = ""
90100105-67 = ""
90100105-68 = "นี่ FOX 4!"
90100105-70 = "โอ้ว... นี่มันอะไรเนี่ย มันส่องแสงวูบไหวเป็นสีสันที่ประหลาดมากเลย"
90100105-71 = "ฉะ... ฉันบอกให้ระวังไง! ถ้าผลีผลามหยิบมันขึ้นมาแล้วโดนสิ่งลึกลับครอบงำอีกจะทำยังไง!"
90100105-72 = "อ่า ขอโทษๆ"
90100105-73 = "แต่เห็นเธอคอยดูอยู่ ก็เลยเผลอคิดว่าไม่เป็นอะไรน่ะ"
90100105-74 = "ฉันคอยจับตาดูทุกการเคลื่อนไหวของเธอไม่ได้หรอกนะ?!"
90100105-75 = "เดี๋ยวก่อน... ภาพที่สะท้อนอยู่ในกระจกนี่ ไม่ใช่ที่นี่ใช่มั้ย?"
90100105-76 = "นั่นสิ มันดูคุ้นตาฉันจังเลย"
90100105-77 = ""
90100105-78 = "อ้อ นั่นคือทุ่งหญ้าที่ <คุเนะคุเนะ> เคยอยู่"
90100105-79 = "คราวนี้มองด้วยตาเปล่าก็ไม่เป็นอะไรแล้วสินะ"
90100105-80 = "แบบนั้นก็น่าโล่งอกอยู่หรอก... แต่ไม่รู้ทำไม ฉันรู้สึกไม่ค่อยอยากจ้องมันนานๆ เลย แถมสีของมันยังวูบวาบประหลาดๆ อีก"
90100105-81 = "เศษแก้วที่สะท้อนภาพของอีกโลกหนึ่งงั้นเหรอ"
90100105-82 = "ฉันว่ามันใกล้เคียงกับ[ruby=วัตถุหลงยุค]วัตถุที่ไม่ควรมีอยู่ตามทฤษฎี[/ruby] มากกว่าจะเป็นเศษแก้วธรรมดานะ"
90100105-83 = "จะว่าไป ประธานองค์การนักเรียนก็สะสมวัตถุประหลาดแบบนี้ไว้เยอะเหมือนกัน"
90100105-84 = "งั้นเอาเศษแก้วนี้ไปให้ประธานองค์การนักเรียนดีมั้ย?"
90100105-85 = "[s] \"ชิ้นส่วนนี้มัน...\""
90100105-86 = "คุณครูนึกอะไรออกงั้นเหรอคะ?"
90100105-87 = ""
90100105-88 = "เพราะโลกนี้ได้เปลี่ยนแปลงไปอย่างฉับพลันเมื่อค่ำคืนที่ผ่านมา ความผิดเพี้ยนดุจขนนกสีดำจึงยังคงหลงเหลืออยู่ทั่วทุกแห่งของโลกยังไงล่ะครับ"
90100105-89 = "สำรวจ เก็บรวบรวม และบันทึกไว้สิครับ"
90100105-91 = "[ns3] (หรือว่า เศษแก้วนี้มัน...)\n[ns4] (เศษแก้วนี้คือหลักฐานของความผิดเพี้ยนที่เขาพูดถึงงั้นเหรอ...?)"
90100105-94 = ""
90100105-95 = "คุณครู ฉันฝากเก็บเศษแก้วนี้ไว้กับคุณครูก่อนได้มั้ยคะ?"
90100105-96 = "[s] \"ไม่ต้องรายงานให้ประธานองค์การนักเรียนรู้เหรอ?\""
90100105-97 = "ตอนนี้น่าจะยังไม่เป็นไรค่ะ..."
90100105-98 = "ถึงตอนนี้เราจะยังยืนยันอะไรไม่ได้ แต่ถ้าค่อยๆ รวบรวมข้อมูลต่อไป วันหนึ่งเราคงได้รู้ความจริงเบื้องหลังความรู้สึกไม่คุ้นเคยนี้ค่ะ"
90100105-99 = "จนกว่าจะถึงเวลานั้น ฉันอยากให้คุณครูช่วยตัดสินแทนฉันค่ะ"
90100105-100 = "[s] \"เข้าใจแล้ว งั้นตอนนี้ครูจะเก็บมันไว้ก่อน\""
90100105-101 = "ค่ะ ถ้างั้นฉันขอตัว..."
90100105-102 = ""
90100105-104 = ""
90100105-105 = ""
90100105-106 = "ต้องขออภัยด้วยค่ะ..."
90100105-107 = "อ่า เป็นเพราะฉันเองก็เครียดเกินไปหรือเปล่านะ จู่ๆ ก็รู้สึกหิวขึ้นมาเลย~"
90100105-108 = "นั่นสิ รู้งี้น่าจะห่อซูชิเต้าหู้หวานมาสักหน่อยนะ"
90100105-109 = "ไม่เอาน่า ถ้าห่อข้าวกล่องมาในอากาศแบบนี้ แป๊บเดียวก็บูดหมดแล้วละ"
90100105-110 = "ยังไงพวกเราก็ยังอยู่แถวตัวเมืองกัน งั้นแวะหาอะไรกินแถวนี้ก่อนแล้วค่อยกลับดีมั้ย?"
90100105-111 = "แต่ฉันไม่ได้พกเงินสดมาด้วยน่ะสิ แถมบัตรประจำตัวที่เคยใช้สมัยอยู่ SRT ก็ใช้ไม่ได้แล้วด้วย..."
90100105-112 = ""
90100105-113 = "[ns] \"ในที่สุดก็ถึงเวลาต้องใช้บัตรของผู้ใหญ่แล้วสินะ\""
90100105-114 = ""
90100105-115 = "[ns] \"อยากกินอะไรบอกได้เลย เดี๋ยวครูเลี้ยงเอง!\""
90100105-116 = "อ่า งั้นฉันขอเป็นอุด้งเต้าหู้ทอดร้านหน้าสถานี..."
90100105-117 = "นิโกะ นานๆ เราจะได้โอกาสแบบนี้ทั้งที แต่จะใช้กับอุด้งราคา 500 เยนเนี่ยนะ?"
90100105-118 = "โอกาสแบบนี้ต้องขอให้เลี้ยงอาหารแพงๆ สิ... อย่างชุดดับเบิลคัตสึด้งอะไรแบบนั้น!"
90100105-119 = "นึกถึงอาหารแพงๆ ได้แค่ดับเบิลคัตสึด้งเองเหรอ"
90100105-120 = "คุณครู ขอไปร้านเนื้อย่างที่เคยพาไปคราวก่อนได้มั้ย?"
90100105-121 = "ตอนนั้นฉันอิ่มเสียก่อนก็เลยไม่ได้กินไส้ย่างน่ะ จนถึงตอนนี้ก็ยังเสียดายไม่หายเลย"
90100105-122 = "[s] \"ได้อยู่แล้ว!\""
