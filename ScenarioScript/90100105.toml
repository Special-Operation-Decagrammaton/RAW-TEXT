[translation]
90100105-3 = ""
90100105-4 = ""
90100105-5 = "A點，Clear。"
90100105-6 = ""
90100105-10 = ""
90100105-11 = "B點，Clear。"
90100105-12 = ""
90100105-16 = ""
90100105-17 = "確認最後一個目標已被無力化……「草原」似乎也看不見了。"
90100105-18 = ""
90100105-20 = ""
90100105-21 = "確認。作戰結束。現在開始解除燈火管制。"
90100105-22 = ""
90100105-25 = ""
90100105-26 = ""
90100105-27 = "[ns] 「大家都沒事嗎？」"
90100105-28 = "是的，所有人都毫髮無傷。#n老師您也沒事吧？"
90100105-29 = "[s1] 「我只是在遠處負責指揮而已。」\n[s2] 「沒事。連一點擦傷都沒有。」"
90100105-32 = ""
90100105-34 = ""
90100105-35 = ""
90100105-36 = ""
90100105-37 = "話說回來，這還是第一次直接接受老師的戰鬥支援……感覺真厲害呢。"
90100105-38 = "就是說啊。感覺就像有架偵察無人機──不，是從比那更高的地方守護著我們一樣。"
90100105-39 = "托您的福，感覺比平常更快控制住了狀況。謝謝您。"
90100105-40 = "老師能比任何人更快看出學生的才能，並適才適所地配置──#n看來這個傳聞果然沒有被誇大其實呢。"
90100105-41 = "讓我再次體會到了後輩們會如此信賴老師指揮的理由。"
90100105-42 = "[s] 「被SRT的老手們這麼稱讚，還真有點不好意思……」"
90100105-43 = ""
90100105-45 = ""
90100105-46 = "[ns] 「話說回來，這樣扭來扭去就全都消失了嗎？」"
90100105-47 = "是的。現在就算繼續觀察陽炎，也沒有任何反應了。"
90100105-48 = "如果這樣就能讓[ruby=怪談]異常現象[/ruby]徹底消失當然再好不過……"
90100105-49 = "可是看著明明傾瀉了那麼多子彈，現場卻連一個彈痕都沒有的樣子……#n真的有種被幻影迷惑了的感覺呢。"
90100105-50 = "不過盡情開槍之後，心情倒是有點暢快。#n畢竟對連實體都不知道存不存在的敵人消耗精力，那才是最糟糕的嘛。"
90100105-51 = "就像在武器庫發現一整箱沒登記在帳冊上的實彈時一樣？"
90100105-52 = "沒錯。那時候真的很煩惱該怎麼處理才──"
90100105-53 = "你們兩個到底在說什麼……？"
90100105-54 = "啊，沒，沒什麼！"
90100105-55 = "就，就只是打個比方而已啦……哈哈！"
90100105-56 = ""
90100105-58 = ""
90100105-59 = ""
90100105-60 = ""
90100105-61 = "話說回來，那個散落在地上的玻璃碎片是從哪裡掉下來的？"
90100105-62 = "對耶。這附近並沒有玻璃製的東西啊。"
90100105-63 = "難，難道是從扭來扭去身上掉下來的？"
90100105-64 = "我看看……"
90100105-65 = ""
90100105-67 = ""
90100105-68 = "喂，FOX4！"
90100105-70 = "哦哦……這是什麼。#n裡面有超級詭異的光芒在晃動耶。"
90100105-71 = "我，我不是叫你小心點嗎！#n這樣隨便撿起來，要是又被怪異迷惑了怎麼辦！"
90100105-72 = "啊，抱歉抱歉。"
90100105-73 = "我想說有你看著應該沒問題，一不小心就……"
90100105-74 = "我可沒辦法隨時盯著你的一舉一動啊！？"
90100105-75 = "話說……這片玻璃裡映出的風景，應該不是這個地方吧？"
90100105-76 = "嗯。總覺得有點眼熟。"
90100105-77 = ""
90100105-78 = "啊，是「扭來扭去」出現過的那片草原。"
90100105-79 = "這個似乎用肉眼看也沒問題呢。"
90100105-80 = "那倒是個好消息……不過一直盯著總覺得有點不舒服。#n顏色也晃動得有點詭異。"
90100105-81 = "映照出異世界風景的玻璃碎片啊。"
90100105-82 = "與其說是單純的玻璃碎片，或許更接近[ruby=歐　　帕　　茲]理論上不可能存在之物[/ruby]呢。"
90100105-83 = "這麼說來，聯邦學生會長也收集了一大堆這種奇怪的東西呢。"
90100105-84 = "那麼這片玻璃碎片，拿去給聯邦學生會長就可以了嗎？"
90100105-85 = "[s] 「這片碎片……」"
90100105-86 = "老師，您想到什麼了嗎？"
90100105-87 = ""
90100105-88 = "這個世界在昨夜驟然變貌，因此如黑色羽毛般的矛盾仍遍布於世界各地。"
90100105-89 = "請去調查、蒐集並且記錄吧。"
90100105-91 = "[ns3] （難道這片玻璃碎片……）\n[ns4] （……就是他說的矛盾的證據？）"
90100105-94 = ""
90100105-95 = "老師。這片玻璃碎片，可以先請您保管嗎？"
90100105-96 = "[s] 「不向聯邦學生會長報告沒關係嗎？」"
90100105-97 = "……目前應該還不要緊。"
90100105-98 = "雖然現階段還無法確定任何事……#n只要默默地持續收集情報，相信總有一天會明白這股既視感的真面目的。"
90100105-99 = "在那之前，我希望能由老師代為判斷。"
90100105-100 = "[s] 「知道了。那現在就先由我保管吧。」"
90100105-101 = "好的。那麼接下來──"
90100105-102 = ""
90100105-104 = ""
90100105-105 = ""
90100105-106 = "……打擾了。"
90100105-107 = "啊啊～可能是我太緊張的關係，肚子突然好餓哦～"
90100105-108 = "就是說啊。早知道就帶一點豆皮壽司來了。"
90100105-109 = "咦～這種天氣帶便當來早就壞掉了吧？"
90100105-110 = "反正也還沒走出市中心，要不要在附近隨便吃點東西再回去？"
90100105-111 = "可是我沒帶現金出來耶。#nSRT時期的ID卡也不能用……"
90100105-112 = ""
90100105-113 = "[ns] 「終於輪到大人的卡片出場的時候了。」"
90100105-114 = ""
90100105-115 = "[ns] 「想吃什麼儘管說。老師都買給你們！」"
90100105-116 = "啊，那我想吃車站前的豆皮烏龍麵……"
90100105-117 = "仁子，你打算把這麼難得的機會，用在一碗500元的烏龍麵上嗎？"
90100105-118 = "這種時候就該點貴一點的……對了，比如雙倍炸豬排定食之類的！"
90100105-119 = "你腦袋裡能想到的貴一點的東西，居然是雙倍炸豬排定食啊。"
90100105-120 = "老師，你之前帶我們去的那家燒肉店也可以嗎？"
90100105-121 = "上次因為吃太飽而沒吃到的烤大腸，我這陣子一直都很在意呢。"
90100105-122 = "[s] 「當然可以！」"
90100105-123 = ""
90100105-125 = ""
90100105-126 = ""
90100105-127 = "那，那個。老師，您其實不用這樣……"
90100105-128 = "[s5] 「不用覺得是在給我添麻煩。」\n[s6] 「就像SRT的作戰一樣，讓孩子們吃飽是大人的義務。」"
90100105-131 = ""
90100105-133 = ""
90100105-134 = ""
90100105-135 = "……老師果然很懂該如何對待學生呢。"
90100105-136 = "那麼這次也請您多多關照了。"
90100105-138 = "（之後在燒肉店舉行了作戰的慶功宴，度過了愉快的時光）"
90100105-140 = "下一話;傳聞與不可解"
