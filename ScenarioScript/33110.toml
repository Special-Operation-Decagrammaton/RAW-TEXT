[translation]
33110-1 = "제11화;가중되는 혼란 1"
33110-2 = "으아아아아-!"
33110-3 = "자, 잠깐! 흩어지지 말고 학원 내에 있어야……!!"
33110-4 = "게헨나가 공격해 올 거야! 대응하지 않으면……!!"
33110-5 = "아, 아우우……."
33110-6 = "이런 혼란스러운 상태가……."
33110-14 = "하나코 씨!! 보충수업부 여러분!"
33110-15 = "아, 마, 마리 씨?"
33110-19 = "마, 마리 쨩?! 무사했군요?!"
33110-20 = "지, 지금……!! 티파티의 일부 분파들이……. 독단으로 긴급 소집령을 내렸어요……."
33110-21 = "……네?! 설마. 지금 시점에서……."
33110-22 = "……?"
33110-23 = "무, 무슨 일인 거야?"
33110-24 = "사쿠라코 님도 부재중인 상황이라, 이걸 대응할 수 있는 사람은 하나코 씨밖에……."
33110-25 = "그, 그치만……. 지금은……."
33110-26 = "하나코 씨……."
33110-27 = "아, 거기!"
33110-31 = "너, 분명 정의실현부의 부원이었지? 지금 긴급 소집령이 떨어졌어! 부실로 집합이야!"
33110-32 = "아, 으, 으응? 나, 나도……? 그, 그치만……."
33110-33 = "부장님도 부부장님도 안 계신 상태라서! 서둘러!"
33110-37 = "어…… 으, 으응?"
33110-41 = "하나코 쨩, 코하루 쨩…… 저는 여기서 아즈사 쨩을 찾아볼 테니까, 어서들 가세요."
33110-42 = "히후미 쨩……."
33110-43 = "그, 그치만……."
33110-44 = "아즈사 쨩이라면 분명 학원으로 돌아올 테니까, 아즈사 쨩을 찾으면 연락할게요!"
33110-45 = "아, 알았어! 그럼 조금 이따가 봐!"
33110-46 = "……네. 알겠어요. 마리 쨩, 가죠……!"
33110-48 = "네, 네!"
33110-51 = "……."
33110-52 = "대체 무슨 일이…… 아우……. 아즈사 쨩……."
33110-54 = "에덴조약 회담장의 갑작스러운 폭발로, 현재 고성당 주변은 처참한 상황입니다!!"
33110-55 = "대체 무슨 일이…… (치익)"
33110-56 = "……."
33110-57 = "나기 쨩…… 내가 그랬잖아……."
33110-58 = "응…… 역시 우리들은 어쩔 수 없는 거야."
33110-59 = "여긴 그런 세계이고……"
33110-60 = "……세이아 쨩의 말대로, 이건 그런 이야기니까."
33110-61 = "……."
33110-63 = "교전 지역 외곽 교통로"
33110-69 = "에덴조약 회담장의 갑작스러운 폭발로, 현재 고성당 주변은 처참한 상황입니다!!"
33110-70 = "고성당의 후방에 대기하고 있던 두 학원의 예비 병력들이 해당 고성당으로 계속 진격하고 있습니다!!"
33110-71 = "고성당이 있던 장소에선 두 학원 간의 교전이 벌어지고 있는지 총소리와 폭발음만이 들려오고 있습니다!"
33110-72 = "현재 무슨 상황이 벌어졌는지는 여전히 오리무중! 부상자나 피해 규모도 아직 집계되지 않고 있는 상황에서……."
33110-73 = "……앗, 속보입니다! 트리니티에서 티파티의 긴급 회동이 포착되었다고 합니다!"
33110-74 = "네? 게헨나의 만마전에서도 긴급회의가 소집되었다고 합니다! 비상사태 선포를 준비하려는 건지……."
33110-80 = "우와아아-!! 시논 쨩, 이, 이제 그만 우리도 퇴각하는 게 좋지 않을까?"
33110-81 = "도, 동감입니다, 마이 선배! 좀 더 안전한 곳으로 가서 중계를 이어 나가겠습니다!"
33110-83 = "폭발의 원인은 찾았습니까!"
33110-84 = "사쿠라코 님의 행방은요?! 부상자의 집계는!?! 호스트 나기사와의 연락은요?!"
33110-85 = "츠루기 부장과 하스미 부부장 아직 소재 불명!"
33110-86 = "시스터들의 소집령은 어떻게 되었습니까! 지금 당장 우리라도 자체 계엄을 선포해서……!"
33110-87 = "티파티의 본부에서 수상한 움직임이 보고되었습니다! 그쪽으로 각 분파의 대표가 소집되고 있습니다!"
33110-88 = "고성당 후방에 대기하던 시스터들이 현재 게헨나 예비 병력과 교전 중입니다! 다음 지시를 기다리고 있습니다! 어떻게 하나요!"
33110-89 = "소라사키 히나예요! 그자가 원흉입니다!!"
33110-94 = "모두, 제 말을 들어주세요!"
33110-98 = "당신은…… 우라와 하나코……?"
33110-99 = "……사쿠라코 님의 부탁으로, 지금부터 한정적으로 제가 참견하도록 하겠습니다."
33110-100 = "뭐, 뭐라고요?"
33110-102 = "네! 제가 보증해요! 사쿠라코 님이 혹시라도 자신에게 문제가 생기면 하나코 씨에게 대행을 요청했었어요……!!"
33110-103 = "그런…… 아무리 사쿠라코 님의 명령이래도 여기에는 다른 분파들도……."
33110-104 = "지금부터 티파티의 모든 호스트가 부재할 시의 임시 지휘 체계를 구축해야 합니다!"
33110-106 = "그게 없다면 이 트리니티는 위에서부터 붕괴해버릴 거예요!"
33110-107 = "!!"
33110-108 = "삼두정치 시스템이 가지고 있는 문제점……. 호스트가 모두 부재 시에 이런 대혼란이……"
33110-109 = "온갖 파벌들이 모여 있는 티파티는 지금 통제가 불가능해져 있을 거예요!"
33110-110 = "지금부터 티파티의 폭주를 막지 않으면 안 됩니다……!! 그게 최우선이에요!"
33110-111 = "……. 알겠습니다. 하나코 씨. 사쿠라코 님의 약속이라면……."
33110-112 = "아, 알겠습니다……."
33110-113 = "그 뒤, 현재 벌어지고 있는 교전을 중지시켜야 합니다!"
33110-114 = "그다음은 부상자의 수색 및 후송!"
33110-115 = "그리고 목격자의 증언을 포함해 주변의 모든 정보를 수집해서 지금 거기서 무슨 일이 벌어지고 있는지를 파악해야 해요!"
33110-116 = "교, 교내 14교사에서 소요 사태가 발생! 파테르 분파가 지금 당장 계엄령 선포를 요구하고 티파티 본부로 향하고 있다고 합니다!!"
33110-117 = "벌써……?! 정의실현부에 연락을 부탁드립니다! 하스미 씨와 츠루기 씨가 부재중일 때의 연락책을 찾아주세요! 분명……."
33110-118 = "아니……, 지금은 정의실현부도 혼란 상태…… 지금 시스터후드에서 운용할 수 있는 인원은 몇이나 있죠?!"
33110-121 = "(미안해요, 히후미 쨩…… 저는 한동안 여기에 묶여 있을 수밖에 없을 거 같아요.)"
33110-122 = "(……아즈사 쨩, 코하루 쨩, 선생님…… 부디…… 무사해야 해요.)"
33110-124 = "정의실현부 부실 근처"
33110-132 = "티, 티파티에서 14교사로 지원요청이 왔습니다!"
33110-133 = "뭐? 조금 전에는 고성당 쪽으로 출동 명령이 있지 않았나요?"
33110-134 = "시스터후드에서 연락이……! 어떡할까요?"
33110-136 = "지금 명령을 듣고 있을 때가 아닙니다! 하스미 선배와 츠루기 선배를 구해야 합니다!"
33110-140 = "아, 아……."
33110-141 = "저, 저희는 어떻게 해야 하죠? 파견 나가있는 부원들에게도 어떻게 해야 하냐고 연락이 계속……."
33110-146 = "저, 저기……."
33110-147 = "으, 으으……. 난…… 어, 어떻게 해야……."
33110-148 = "거기 당신! 적당히 서 있지 말고 자기 담당 자리로 찾아가!!"
33110-152 = "아, 으, 으응……? 내 담당이라면……"
33110-153 = "아, 압류 창고……?"
33110-155 = "트리니티 5번 정문"
33110-158 = "게헨나의 차량이 어째서 여기까지 온 거죠!!"
33110-159 = "앰뷸런스? 장난해! 지금 무슨 상황인지 알고 있어?! 계엄령이라고!!"
33110-164 = "지금 당장 저 녀석을 끌어내려서…… 본때를 보여줍시다!!"
33110-169 = "부상자를 후송 중입니다. 길을 비켜주십시오. 긴급한 상황입니다."
33110-170 = "부상자?! 웃기지 마! 어째서 게헨나의 부상자 따위를 위해……!!"
33110-171 = "……."
33110-173 = "그만두지 못해요!!"
33110-180 = "구호기사단……?"
33110-181 = "부상자를 데리고 있는 앰뷸런스를 공격하다니, 그런 무자비한 짓은 이 구호기사단이 용납할 수 없어요!!"
33110-182 = "부상자를 공격하는 것은 저희 구호기사단을 공격하는 것과 같습니다. 미네 단장님이 계셨다면 분명 이 상황을 보고 슬퍼하셨을 거예요!"
33110-183 = "미, 미네 단장이라면……."
33110-185 = "미네가 부수고 기사단이 고친다, 라는 평을 듣는 미치광이 녀석이잖아! 지금 협박하는 거야!"
33110-186 = "네? 아, 아니에요! 단장님은 미쳤다기보다 약간 시대착오적일 뿐이고……."
33110-187 = "그걸 미쳤다고 하는 거야!"
33110-188 = "세, 세리나 선배? 뭔가 역효과가 나고 있는 것 같은데요?"
33110-189 = "그, 그러게요……. 단장님, 평판이 이렇게 안 좋았던가……."
33110-190 = "상처를 치료하기 보다 상처의 원인을 제거해야 한다고 주장하시는 분이니……."
33110-196 = "저, 저기요! 몰려들지 마세요? 주, 주사 놔버릴 거예요?"
33110-197 = "전방 섬광탄!!"
33110-199 = "꺄아아악-! 가, 갑자기 뭐야!? 눈이……! 눈앞이 안 보여!"
33110-200 = "정신없어! 으으, 어지러워……!"
33110-201 = "대, 대체 무슨 일이야 이게!?"
33110-205 = "치안이 이렇게까지 나빠지다니……. 자경단으로서 좌시할 수 없습니다."
33110-206 = "자, 자경단원……!?"
33110-207 = "스즈미 씨!"
33110-208 = "구호기사단은 자경 활동 중에 몇 번이나 신세를 졌었죠."
33110-209 = "더군다나 부상자는 부상자. 그 이상도 이하도 아닙니다. 소속은 중요하지 않아요."
33110-213 = "자경단이라니…… 저 녀석들은 필요하다면 정의실현부와도 적대하는 녀석들이잖아……."
33110-214 = "미치광이 녀석이 또 몰려오다니……."
33110-215 = "지금 여기에 신경 쓸 때가 아니지…… 돌아가자."
33110-219 = "하아…… 다들 물러갔네요."
33110-220 = "고, 고마워요, 스즈미 씨. 덕분에 살았어요."
33110-224 = "아뇨. 질서가 무너졌을 때 자경단이 움직이는 것은 당연한 법이죠."
33110-225 = "……응?"
33110-226 = "스즈미 씨! 스즈미 씨! 드디어 우리 자경단이 나설 차례예요!"
33110-227 = "저, 자경단의 에이스, 모두의 아이돌, 이 우자와 레이사가 스즈미 씨와 함께……!"
33110-232 = "……. 실례했습니다. 저는 또 다른 사람들을 구하러 가야 해서."
33110-236 = "아, 앗! 스즈미 씨!"
33110-237 = "가버렸네요……. 여전히 바람 같은 사람이네요."
33110-238 = "……협조에 감사드립니다. 구호기사단."
33110-239 = "아, 네! 엠블럼을 보아하니…… 게헨나의 응급의학부……이신 거죠? 어쩐 일로 환자를 트리니티 본관으로 데려오신 거죠……?"
33110-240 = "안의 환자는 누구인가요?"
33110-241 = "네. 샬레의 [USERNAME] 선생님입니다."
33110-242 = "네?!"
33110-243 = "서, 선생님이요?"
33110-244 = "참고로 총에 맞았습니다."
33110-248 = "네?!!??!!"
33110-250 = "다음화;가중되는 혼란 2"
