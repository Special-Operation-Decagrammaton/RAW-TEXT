[translation]
13230-1 = "제23화;학생회장들의 계곡"
13230-3 = "……열차포 <셰마타>."
13230-4 = "하지만 어째서……"
13230-9 = "게헨나의 엠블럼이……?"
13230-12 = "게다가…… 이 형태는……"
13230-17 = "기념관이 아니라 마치……."
13230-19 = "……전쟁 요새 같다고?"
13230-25 = "……. 안대 쨩."
13230-26 = "(안대 쨩……?)"
13230-27 = "그래. 타카나시 호시노. 그 말이 맞아. 여기는 수백 년 전에 학생회장들이 세운 유적지였다. 그것을 누군가가 전쟁 요새로 탈바꿈시킨 거야."
13230-30 = "……저도 담당자가 아니어서 잘 모릅니다만, 어디까지나 사막횡단철도사업이 먼저였고 <열차포> 계획은 그 이후에 추가된 것입니다!"
13230-31 = "채산성이라곤 찾아볼 수 없는 이 골칫덩이 사업을 한 번에 뒤바꿀 아이디어를 누군가가 학생회에 제공했던 거예요……!"
13230-32 = "네? 누가요? 누가 그런 짓을……."
13230-35 = "<아비도스 학생회>도, 네프티스도 모두 그 사람의 손아귀에서 놀아난 것에 지나지 않아."
13230-36 = "그건 진짜 흑막이 따로 있었다는 얘기야? 안대 쨩?"
13230-37 = "아니. 그 사람은 더 이상 흑막이라고 부를 수 없겠지. 지금은 졸업하고 키보토스에 없으니까."
13230-38 = "……졸업했다고?"
13230-39 = "그래. 그자는 바로…… 2년 전 키보토스를 암흑으로 뒤덮었던 게헨나의 폭군 <뇌제>."
13230-40 = "……. 뇌제?"
13230-41 = "천재 전략가이자 발명가, 동시에 고도의 정치가였어. 총학생회장이 준비한 <에덴조약>도 사실 뇌제를 상대하기 위한 기책이었다는 설도 있지."
13230-42 = "들어본 적 없어."
13230-43 = "……. 그렇군. 그 사람이 <사막횡단철도> 사업에 접근해서 이 사업을 전혀 다른 것으로 만들어버린 장본인이야."
13230-44 = "그 사람 때문에 단순한 물류 유통 사업이 순식간에 고도의 정치적 분쟁 요소가 되어버린 거지."
13230-45 = "그 뇌제란 녀석은 어째서 그런 짓을 저지른 거야?"
13230-46 = "……그걸 알 수 없어."
13230-47 = "…… 사실 뇌제가 어떤 생각을 하고 있는지는 그 시대에도 아무도 알지 못했어."
13230-48 = "천재……라고 해야 할까, 괴짜라고 해야 할까……. 속을 알 수 없는 사람이었다고 해."
13230-49 = "아비도스에 접근한 것도 그냥 단순한 변덕이었을 수도 있고, 아니면 그저 심심풀이 유희였을 수도 있겠지."
13230-50 = "어쨌든 뇌제는 이 <열차포> 사업이 중단된 이후에 다시는 아비도스에 관심을 두지 않았으니까."
13230-52 = "……."
13230-53 = "뇌제는 결국 부하들에 의해 실각되어 그녀의 철권통치는 막을 내렸지만……. 그녀가 남긴 수많은 발명품들은 아직도 키보토스 곳곳에 남아 있다고 하지."
13230-54 = "하나같이 전부 키보토스를 위험에 빠트릴 위험한 물건들이니까. 탐내는 사람들이 아직 많거든. ……이 열차포처럼 말야."
13230-55 = "아니, 안대 쨩. 옛날이야기는 아무래도 됐어. 이 아저씨는 별로 관심이 없거든?"
13230-56 = "(아저씨……?)"
13230-57 = "그래서, 이 아저씨를 여기로 부른 이유는 뭐야? 혹시 그 뇌제가 유메 선배와 관계라도 있는 거야?"
13230-58 = "……아니. 전혀."
13230-59 = "그럼 유메 선배가 남긴 계약서와는 뭔가 연관된 게 있어?"
13230-60 = "……."
13230-61 = "아니면 설마 안대 쨩은 사실 게헨나 학생이라서 저 뇌제의 발명품을 회수해 가는 게 목적인 거야?"
13230-62 = "……넌 누구야? 뭘 꾸미고 있는 거야?"
13230-63 = "……."
13230-64 = "하아, 뭐, 됐어. 그냥 본론으로 넘어갈게."
13230-68 = "이제부터 나는 열차포를 파괴할 거야. 뇌제든 게헨나든 그런 건 아무 관심 없어."
13230-69 = "저건 유메 선배의 유지를 정면으로 부정하는 물건이야. 그러니까 절대로 저걸 그냥 두지 않을 거야."
13230-70 = "절대, 절대로."
13230-72 = "……그래. 마음대로 해. 호시노."
13230-73 = "하지만 그러려면 먼저 나에게서 이 <카드>를 빼앗아야 할 거다."
13230-79 = "노노미 쨩의 황금 카드……?"
13230-80 = "이게 있다면 열차포를 기동시킬 수 있어. 네가 열차포를 부수려면 먼저 이 카드를 확보할 필요가 있겠지."
13230-89 = "나를 쓰러트리고 카드를 가져가 봐라."
13230-90 = "내 진짜 목적은 바로 너니까. 타카나시 호시노."
13230-91 = "……누구야, 넌?"
13230-92 = "아아. 나도 언제나 그게 궁금했었지."
13230-93 = "학교도 없이 떠도는 부랑자, 카이저PMC의 용병, 네프티스의 심부름꾼, 하이랜더 학원의 이방인, 사모펀드의 이중 첩자……."
13230-94 = "……하지만 이젠 확실하게 알 것 같아."
13230-98 = "나는 너의 적이다. 타카나시 호시노. 아비도스의  공포와 광기를 상속받은 적통자(嫡統子)."
13230-99 = "너의 그 강함은 바로 그 때문인 거지. 그러니 나는 너를 부정하지 않으면 안 돼."
13230-104 = "무엇이 너를 절박하게 만들지? 열차포로는 부족한가?"
13230-106 = "……그래, 나를 쓰러트리면 그 <수첩>이 어디 있는지 알려줄 수도 있겠지."
13230-110 = "……적당히 하려고 했는데 안 되겠네, 너."
13230-112 = "그래, 좋은 얼굴이 되었군."
13230-117 = "그럼 시작하자."
