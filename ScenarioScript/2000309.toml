[translation]
2000309-1 = "연기와 바보는 높은 곳을 좋아한다"
2000309-2 = "키보토스의 번화가"
2000309-3 = "시내를 걷다가 우연히 건물 위에서 도심을 내려다보는 마시로를 발견했다."
2000309-4 = "마시로는 진지한 표정으로 지나가는 행인들을 관찰하고 있다."
2000309-5 = "[s] \"무얼 하고 있는 걸까……\""
2000309-6 = "걱정이 되니 마시로를 쫓아 옥상에 올라가보자."
2000309-8 = "건물 옥상"
2000309-11 = "어라, 선생님? 이 옥상에는 무슨 일이십니까?"
2000309-12 = "길을 걷다가 우연히 저를 보고 올라오셨다고요?"
2000309-13 = "아하, 그렇군요. #n너무 무방비하게 난간에 몸을 기대고 있었을지도 모르겠습니다."
2000309-14 = "새로운 저격 임무를 수행하는 중이냐고요? #n아뇨, 이건 제 순수한 취미입니다."
2000309-15 = "이곳에서 도심을 내려다보고 있으면 많은 것이 보이거든요."
2000309-16 = "차로를 따라 시내를 오가는 자동차들과, 부지런히 일을 하는 시민들, 그리고 등하굣길의 학생들까지……"
2000309-17 = "이렇게 질서정연한 모습을 보고 있노라면 이 도시에서 불의가 발생한다는 것을 믿기 어려울 정도입니다."
2000309-18 = "하지만 분명 불의는 이 평화를 깨트리기 위해 오늘도 키보토스 어디선가 흉계를 꾸미고 있겠지요."
2000309-19 = "좀 더 정의실현부의 일원으로서 노력하지 않으면……"
2000309-20 = "[s] \"마시로는 성실하구나.\""
2000309-21 = "그렇습니까? 저는 스스로가 그저 평범하다고만 생각했었는데……"
2000309-22 = "평범하니까 더 노력하지 않으면 선배들의 뒤를 좇을 수 없다고, 그래서 더 성실하게 노력을 해왔습니다만……"
2000309-23 = "선생님의 마음에 들 수 있다면 이 평범함도 나쁘지 않을지도 모르겠습니다. #n후후……"
2000309-24 = "[s] \"계속 더 여기에 머무를 거야?\""
2000309-25 = "평소라면 이만하고 내려갔겠지만……"
2000309-26 = "오늘은 선생님이 곁에 계시니까요. #n이 순간을 좀 더 즐기고 싶네요."
2000309-29 = "오늘은 조금만 더…… 응석을 부리게 해 주시겠습니까?"
2000309-31 = "이후, 해가 질 때까지 마시로와 도심을 관찰하다가 건물에서 내려왔다."
