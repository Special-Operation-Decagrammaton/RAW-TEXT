[translation]
2600306-1 = "드디어 잡았다!"
2600306-2 = "(피크닉을 위한 만반의 준비를 하고, 공원으로 나왔다.)"
2600306-3 = "(공원 구석의 인적 드문 곳에 자리를 잡고, 챙겨온 것들을 늘어놓았다.)"
2600306-4 = "(이제 남은 것은 하나……)"
2600306-8 = "[ns1] \"아아, 너무 힘들다~. 죽을 것 같아~.\"\n[ns2] \"악! 가, 갑자기 배가! 복통이!\""
2600306-13 = "……스슥!"
2600306-15 = "스스슥! 푸스슥!!"
2600306-21 = "무슨 일이신가요, 선생님!!"
2600306-22 = "또 몸이 안 좋으시군요!?"
2600306-23 = "하지만 괜찮습니다. 이렇게 세리나가 왔으니까요!"
2600306-24 = "이제부터는 제가……"
2600306-28 = "……?"
2600306-29 = "……선생님?"
2600306-30 = "[s3] \"후후, 걸려들었구나!\"\n[s4] \"미안해. 놀랐어?\""
2600306-31 = "어……? 이, 이게…… 이게 대체 무슨 상황이죠?"
2600306-32 = "어……? 이, 이게…… 이게 대체 무슨 상황이죠?"
2600306-33 = "돗자리에 샌드위치에, 주스까지……?"
2600306-34 = "선생님? 이게 다 뭐예요? 아프신 게 아니셨던 건가요?"
2600306-35 = "……네?"
2600306-36 = "일단 옆에 앉으라고요?"
2600306-37 = "……아. 네. 그럼……"
2600306-42 = "……음? 뭐라고요?"
2600306-43 = "……저요?"
2600306-44 = "저를 위한 거라고요? 이게 전부 다……?"
2600306-45 = "……왜, 왜……!? 어째서?!"
2600306-46 = "어째서 갑자기 저를 위해……?"
2600306-47 = "[s5] \"그동안 신세 진 게 꽤 되니까.\"\n[s6] \"세리나는 항상 다른 사람만 챙기니까.\""
2600306-51 = "……어……"
2600306-52 = "어어…… 그, 그게…… 그러니까 이런…… 이런 때는……"
2600306-53 = "그, 그러니까……"
2600306-57 = "……푸훗."
2600306-58 = "푸훗. 후후훗……!"
2600306-59 = "[s] \"세리나?\""
2600306-60 = "……아, 죄송해요."
2600306-69 = "[wa:500]― 정말이지, [wa:1300]선생님은……."
2600306-71 = "― 진짜로 [wa:1000]깜짝 놀랐다고요."
2600306-74 = "[wa:600]― ……이상한 기분이네요."
2600306-76 = "― 이런 걸 받는 건 처음이라,"
2600306-79 = "― 조금 [wa:1900]당황스럽다고 해야 하나……."
2600306-82 = "[wa:800]― 정말……"
2600306-84 = "― ……이런 분을 만난 건, [wa:2000]처음이랍니다."
2600306-87 = "[wa:550]― 죄송합니다. [wa:950]아직 [wa:500]약간 정신이 없어서……."
2600306-89 = "[wa:50]― 감사합니다. [wa:1800]정말로 [wa:1050]기뻐요……!"
2600306-92 = "[wa:500]― ……선생님 덕분이네요."
2600306-94 = "― ……선생님 덕분이랍니다. [wa:2400]이 기분은."
2600306-97 = "(이후 세리나와 함께 준비해온 것들을 먹으며 즐겁게 대화했다.)"
2600306-98 = "(이후 세리나가 돌아갈 때에도, 어떻게 왔는지 어디로 가는지는 전혀 물어보지 않았다.)"
2600306-103 = "언제나 어디서나, 세리나!"
