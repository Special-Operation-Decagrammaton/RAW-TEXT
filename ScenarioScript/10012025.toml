[translation]
10012025-3 = "뭐, 뭐야! 도저히 상대가 안 되잖아! 퇴각! 모두 퇴각!!"
10012025-7 = "말도 안 돼!! 우리가 졌다고!? 겨우 두 명인데 왜 저리 세!?"
10012025-8 = "크윽……. 그럴 리가……! 우리 퐁당퐁당 헬멧단이 겨우 이런 녀석들에게……!"
10012025-9 = "역시 바다는 넓고 강적은 많다는 건가……!?"
10012025-10 = "그치만 이대로 포기할 수는……!!"
10012025-14 = "앗따따따따따!"
10012025-15 = "따, 따가워! 따갑다고!! 그만해!! 아프잖아!!"
10012025-16 = "젠장, 두고 보자!"
10012025-17 = "우리가 이대로 포기할 거라 생각하지 마라……!!"
10012025-22 = "저 녀석들……. 대체 뭐지……?"
10012025-23 = "멋대로 쳐들어와서 난동 부린 주제에, 삼류 악당 같은 말이나 내뱉으며 도망치고……."
10012025-24 = "……이거야 원. 겨우 치워 둔 것들인데 아주 엉망진창이 됐네."
10012025-25 = "다른 아이들이 돌아오면 어디서부터 이야기해야……."
10012025-29 = "얏호~. 저희예요~. 돌아왔어요~☆"
10012025-30 = "……!? 선배들!?"
10012025-31 = "기막힌 타이밍이네-."
10012025-36 = "응. 장비들은 모두 잘 옮겨 뒀어. 박스 표면부만 조금 파손됐을 뿐, 내용물은 모두 무사해."
10012025-37 = "청소는 잘 되고 있나요?"
10012025-39 = "……?"
10012025-46 = "자, 잠깐. 잠깐만!"
10012025-47 = "무슨 생각 하는지 다 알겠지만 일단 멈춰! 여기에는 이유가……!"
10012025-48 = "청소는 다 했어!! 아니 했었어!! 선배랑 선생님이랑 우리 다 같이 열심히……!"
10012025-50 = "……으음. 세리카 쨩……."
10012025-51 = "아냐. 다 이해해. 둘이서 치우기엔 넓은 곳이었으니까……."
10012025-52 = "응. 지금부터 다 같이 하면 되니까."
10012025-53 = "아, 아니! 진짜라니까!? 사실이라고! 진짜 선배가 여길 전부……!"
10012025-54 = "자, 자. 괜찮아요~. 어차피 세리카 쨩 혼자 치우게 하는 건 우리도 마음에 걸렸으니까요."
10012025-55 = "지금부터 같이 치우면 되죠~. 다 같이 하도록 해요~."
10012025-57 = "진짜라니까아아아아-!!"
10012025-59 = "(이후 청소를 다 한 뒤, 그간의 일들에 대해 차근차근 설명해 주었다.)"
10012025-61 = "으으, 어깨야……. 하도 맞아서 다 까졌잖아……."
10012025-62 = "역시 이대로는 무리겠는 걸……. 어떻게 하지……? 대장……."
10012025-63 = "그냥 돌아갈까……? 다른 섬을 찾아본다든가……?"
10012025-65 = "……지금 뭐라고 했어?"
10012025-67 = "히, 히익……. 아, 아무 말도……."
10012025-68 = "그치만 어쩔 수 없잖아요……! 지금의 우리로는 절대 못 이길 것 같던데."
10012025-69 = "게다가 그 녀석들, 상황을 보니 비슷한 녀석들이 더 있는 것 같고……."
10012025-71 = "……으음……. 확실히……."
10012025-72 = "……그럼 하는 수 없지. 썩 내키는 방법은 아니었지만……."
10012025-74 = "……이쪽도 증원을 부르는 수밖에."
