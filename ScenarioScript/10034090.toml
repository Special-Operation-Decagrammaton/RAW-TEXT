[translation]
10034090-1 = "후일담 1;시이나 츠무기"
10034090-5 = "[ns1] \"……다 왔다.\"\n[ns2] \"이 건물인가 봐.\""
10034090-8 = "말해준 주소 대로라면 맞아. 뭐, 이 주변에는 공연하는 곳도 많으니까."
10034090-10 = "근데 학교가 아니네. 우리처럼 어디 연습실 대여하거나 옥상에서 하는 것도 아니고……."
10034090-11 = "당연하잖아. 우리랑 비교하다니, 실례라고……."
10034090-12 = "확실히 뭔가 본격적인 느낌이에요. 저희 때랑은 달리."
10034090-18 = "근데 그냥 이렇게 덜렁 들어가도 돼? 표는 뭐, 들어가서 사면 되나?"
10034090-19 = "보통은 그런 식이라고 하던데."
10034090-20 = "애초에 굳이 가서 따로 인사하거나 그래야 하는 건 아니잖아. 본인은 오늘 공연이라고 하셨으니 바쁘실 테고."
10034090-21 = "뭐, 그것도 그렇다. 보고 가서 잘 봤어요 하고 연락이나 보내면 되겠지."
10034090-27 = "동아리 대표로 아이리가 말하면 되겠군."
10034090-28 = "그러니까 부장 같은 건 안 한다고 했잖아……."
10034090-29 = "대표랑 부장은 다르니까 상관없는데……. 그렇게까지 힘을 숨기고 싶은 거야?"
10034090-30 = "뭐, 그 편이 확실히 록하긴 하지만……."
10034090-31 = "흐으으……. 아니라고……."
10034090-33 = "됐고, 슬슬 시간 다 된 거 같으니 들어가자. 선생님, 얼굴 알지? 그 츠무기라는 사람."
10034090-34 = "[s] \"약간 나츠 같은 느낌도 있었지.\""
10034090-35 = "호오……."
10034090-36 = "으에에……. 뭔가 불안한데……. 괜찮나, 그거."
10034090-37 = "음……."
10034090-38 = "이, 일단 들어가자! 하하……!"
10034090-52 = "인간이 죽는 것이 사회복지다아아아-!!!!"
10034090-53 = "우우워우우우어어어어어-!!!"
10034090-57 = "전부 죽어버려어어어어어-!!!"
10034090-58 = "와아아아아아아아-!!!"
10034090-63 = "…………."
10034090-64 = "…………."
10034090-65 = "…………."
10034090-66 = "…………."
10034090-70 = "……\"약간 나츠 같은 느낌도 있었지.\"……라."
10034090-71 = "[s3] \"아니, 어…… 음……. 그…….\"\n[s4] \"아니, 내가 봤던 건 이게 아닌…….\""
10034090-77 = "……내 인생을 돌아보게 되는군."
