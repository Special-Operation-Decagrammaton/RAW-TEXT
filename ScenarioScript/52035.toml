[translation]
52035-2 = "큿…… 역시 만만치 않은 상대구나, 백화요란 녀석들!"
52035-3 = "하지만 너희들의 약점은 이미 지난 싸움을 통해 충분히 파악했다고!"
52035-10 = "다들 저 녀석의 오른쪽을 노려! 녀석은 오른쪽 팔이 약점이야!"
52035-21 = "상대의 약점을 파고들어 승부를 뒤집으려 하다니, 치사하잖아!"
52035-25 = "무르구나, 렌게. 병법에 왕도나 부끄러움 같은 건 존재하지 않아. 오직 승리와 패배만이 기록될 뿐이지."
52035-27 = "나구사 선배, 지금이어요!"
52035-32 = "……그래. 지금의 나는 누가 상대하더라도 약점이 드러날 정도로 부족하고 미약하지만."
52035-33 = "그래도 이런 나를 의지하고 함께 해주는 소중한 동료들이 있으니까."
52035-35 = "큭…… 리더, 더는 못 버티겠어요!"
52035-36 = "아쉽지만 이번 하이쿠 경연 대회의 설욕은 뒤로 미루고, 다음번에는 센류 대회를 노려보죠!"
52035-38 = "그러니까 내 하이쿠는 상관없다고 했잖아!"
52035-42 = "으으으으…… 두고 보자, 백화요란!"
52035-52 = "잠깐, 잠깐, 잠깐~!"
52035-56 = "모처럼의 축제 준비를 방해하는 불한당들이 대체 누구인가요?"
52035-57 = "이 축제에 음양부가 대준 비용이 얼마나 되는데—"
52035-62 = "부, 부장님~ 아무리 급하셔도 높으신 분들과의 미팅 중에 갑자기 뛰쳐나가시면……!"
52035-66 = "……어라? 백화요란 위원회 여러분?"
52035-67 = "응? 정말이잖아? 백화요란분들이 어째서……"
52035-68 = "……축제장에서 누군가가 하이쿠를 읊으며 싸움을 벌이고 있다고 해서 혹시 인법연구부인가 했는데, 설마 백화요란의 여러분이셨나요?"
52035-73 = "그럴 리가 없잖아? 우린 오히려 말썽을 부리려는 녀석들을 말리고 있었다고!"
52035-74 = "……그보다 인법연구부 부원들은 싸울 때마다 하이쿠를 읊는 거야?"
52035-75 = "저희도 하이쿠에 대해서는 잘 모르지만, 피나가 말하는 '통성명' 같은 게 아닐까요?"
52035-77 = "일부 망량즈가 축제장에 설치된 하이쿠 간판의 내용에 불만을 갖고 행패를 부리기에, 분쟁이 일어나기 전에 '조정'을 하려는 것뿐이었지만……"
52035-78 = "마츠리운영관리부의 축제 준비에 방해가 되었다면 미안해."
52035-79 = "아뇨, 아뇨. 오히려 도움을 받은 쪽은 저희들인걸요."
52035-80 = "행사 때마다 망량즈는 장소를 가리지 않고 나타나는데, 경비를 배치하는 데에도 한계가 있는지라. 백화요란 여러분의 도움이 큰 힘이 되고 있어요."
52035-81 = "마츠리운영관리부와 백귀야행 상인회를 대신하여 깊은 감사의 인사를 드립니다."
52035-82 = "괜찮사와요. 백귀야행의 학생 여러분들이 안심하고 축제를 즐기실 수 있도록 정의를 수호하고 불의를 무찌르는 것이 저희 백화요란이 하는 일이니까요!"
52035-83 = "도움이 필요한 일이 있으시다면 언제든 저희 백화요란을 불러주시길!"
52035-84 = "아, 그러고보니 백야당의 업무와 관련하여 백화요란 여러분께 부탁드리고 싶은 일이 하나 있긴 했는데요."
52035-86 = "미안하지만 축제의 안전을 위협하는 불량 학생들을 몰아내는 일이라면 모를까, 지금은 개인의 사사로운 의뢰는 받지 않고 있어."
52035-87 = "백화요란의 책무는 어디까지나 학원 내의 안전을 지키고 분쟁을 조정하는 데 있으니까—"
52035-88 = "어머나, 그런가요? 그렇다면 아쉽게 되었네요."
52035-89 = "이번 축제에서 처음으로 선보일 예정이었던 트리니티산 특제 마롱 크림을 넣은 밤 경단의 시식을 부탁드리려 했는데……"
52035-93 = "백화요란의 여러분이 그렇게 바쁘시다면 다른 분께 시식을 부탁드려야겠네요~"
52035-94 = "아, 아니. 바쁘다고는 했지만……"
52035-99 = "아~ 어쩔 수 없네. 백화요란의 작전 참모께서는 백귀야행의 여러 문제를 해결하시느라 바쁘신 모양이니, 우리 셋만 가는 수밖에."
52035-104 = "렌게!"
52035-105 = "후후, 농담이에요. 경단은 충분히 준비해 두었으니까요."
52035-109 = "자, 모두 저를 따라 이쪽으로 와주세요!"
52035-116 = "아아, 달콤해…… 진짜 끝내준다!"
52035-117 = "이게 정말 내가 아는 경단이 맞는 거야? 달지 않고 부드러운 소 때문인지 양식 디저트를 먹는 것 같아!"
52035-118 = "소녀, 정말로 놀랐사와요! 트리니티 풍 디저어-트에 들어가는 크-림의 맛은, 화과자와는 전혀 어울리지 않을 것이라 생각했는데……"
52035-119 = "밤 만쥬 같은 고소한 알밤 향에, 부드러운 크-림의 단맛이 더해지니 짭짤한 경단과 참으로 잘 어울리는 것이와요!"
52035-120 = "유카리, 입가에 밤 크림이 묻었어."
52035-121 = "그리고 경단같이 이에 달라붙기 쉬운 디저트를 먹고 난 뒤에 양치하는 것도 잊지 말렴."
52035-125 = "무, 물론 기억하고 있사와요!"
52035-127 = "확실히 기존의 손님들이 좋아하는 정석적인 경단의 맛에 마롱 크림으로 새로운 풍미를 더한 것은 좋은 선택인 것 같아."
52035-128 = "하지만 단조로운 경단의 식감이 조금 아쉬운데…… 경단 사이에 다진 닭고기로 빚은 츠쿠네를 더하는 건 어떨까?"
52035-129 = "그럼 디저트가 아니게 되잖아?!"
52035-130 = "후후, 다들 마음에 들어 하시는 것 같아 다행이네요."
52035-131 = "이 경단은 언제나 축제를 위해 힘써 주시는 백화요란 여러분을 위해 저희 마츠리부에서 준비한 것이니 사양 말고 마음껏 드셔 주세요!"
52035-132 = "그것 참 분에 넘치는 말씀이셔요. 사시사철 백귀야행의 풍경을 수놓는 멋진 축제를 앞장서 준비해 주시는 것은 언제나 마츠리부의 여러분이셨는걸요."
52035-133 = "게다가 지난 등불 축제 때는 저희가 제대로 대응하지 못한 탓에 축제 준비에 여러모로 어려움을 끼쳤으니…… 정말로 면목이 없네요."
52035-134 = "아녜요! 오히려 지난번에는 저희 마츠리부 일동 모두가 기절해 있던 탓에, 다른 분들이 축제를 수습하시는 동안 아무것도 하지 못했는걸요!"
52035-135 = "백화요란 역시 아야메 부장이 갑자기 사라진 이후로 여러모로 어려움이 많으셨을 텐데—"
52035-143 = "아, 아앗…… 죄송합니다! 제가 무심코 실언을……"
52035-145 = "……괜찮아. 아야메는 분명 돌아올 테니."
52035-146 = "아야메가 돌아오면 그동안 모두가 얼마나 걱정했었는지, 꼭 내가 전달해 줄게."
52035-147 = "감사합니다. 꼭 부탁드릴게요!"
52035-154 = "저기, 실례합니다. 주 행사장 주변에 쌓은 축대가 어제 내린 비 때문에 조금 불안해서요."
52035-155 = "모래주머니를 쌓아 축대를 보강하려 하는데 손을 빌려주실 수 있으실까요?"
52035-159 = "이런…… 지금은 다들 축제 준비에 필요한 물자를 받으러 가서 일손이 모자란데."
52035-160 = "잠시만 기다려 주시겠어요? 다른 부원들이 돌아오면 곧 도와 드리러 갈 테니—"
52035-164 = "축제의 안전과 관련된 문제라면, 저희 백화요란에게 맡겨주시와요!"
52035-166 = "잘됐네. 안 그래도 몸을 움직이고 싶어서 좀이 쑤시던 참이었거든."
52035-167 = "……식후의 운동으로 나쁘지 않겠네."
52035-172 = "아…… 그렇다면, 다른 분들이 돌아오실 때까지만 부탁드리겠습니다!"
52035-173 = "맡겨 주시와요!"
52035-181 = "……준비한 모래 포대는 이 정도면 충분하겠지. 축대 위로 올려줄 테니 순서대로 쌓아 줘."
52035-182 = "제법 무게가 나가니까 주고받을 때 떨어트리지 않도록 조심하고."
52035-184 = "걱정 마. 이 정도의 무게는 훈련 중에 지겹도록 들어봤으니까."
52035-189 = "후후. 맛있는 경단을 잔뜩 먹고 난 뒤라 그런지, 기운이 펄펄 나는 것이와요!"
52035-190 = "나구사 선배, 그쪽에 있는 포대를 제게 건네주시겠어요?"
52035-191 = "응. 지금 바로 건네줄—"
52035-198 = "……윽."
52035-202 = "무슨 일이야? 방금 큰 소리가 났는데!"
52035-203 = "서, 선배! 괜찮으신 건가요?"
52035-209 = "걱정 마. 손목을 삐끗한 것뿐이니까."
52035-210 = "하지만 그런 것 치고는 무척 괴로워 보이시는데……"
52035-216 = "선배, 오른팔의 붕대를 풀고 손을 보여줘."
52035-220 = "그러니까 이건 별것 아니라고 해도……"
52035-225 = "손을, 보여줘."
52035-236 = "이건……"
52035-237 = "……언뜻 보아도 가볍게 넘길 수 있는 수준의 상처가 아니에요."
52035-238 = "나구사 선배, 언제부터 이런 상처를 감추고 계셨던 건가요?"
52035-240 = "전에 대설원에서 입은 상처야. 금방 나을 테니 신경 쓰지 않아도 괜찮아."
52035-241 = "이게 어딜 봐서 금방 나을 상처라는 거야? 상처가 덧나서 팔을 쓰지 못하게 되면 어쩌려고!"
52035-242 = "당장 병원에 연락을…… 아니, 구급차를 불러야 하나?"
52035-243 = "……그렇게 소란을 떨 필요는 없는데."
52035-249 = "나구사 선배, 괜찮으시다면 잠깐 시간 좀 내주시겠어요?"
52035-256 = "어쩌면…… 저희 카데노코지 가문에서 선배의 상처를 치료할 수 있을지도 몰라요."
52035-258 = "다음화;카데노코지 가의 귀인"
