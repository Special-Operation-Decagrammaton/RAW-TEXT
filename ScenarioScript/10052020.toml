[translation]
10052020-1 = "JEHOVAH ELOHIM"
10052020-2 = "포인트 오스카, 도착. 그러면…… 시작하겠어."
10052020-3 = "[s] \"우리가 뭘 도와주면 될까?\""
10052020-4 = "우선…… 나는 이 HMD로 이 구역의 네트워크에 접속할 거야."
10052020-9 = "단순 시각 정보 입출력만으로는 모자랄 텐데…… 아, 그렇군요. 그 슈트에 체내 신경 전기 신호 증폭 장치를 설치했겠네요."
10052020-10 = "그렇지. 그래서 이 구역의 네트워크는 이 HMD를 통해 하나의 개념 공간으로 나에게 인식될 거고."
10052020-11 = "그 안의 모든 데이터는, 3차원 좌푯값을 가진 채 이미지화되어, 무한한 공간 내에 클러스터를-"
10052020-12 = "알겠어, 회장! 회장의 패턴이 무엇인지!"
10052020-13 = "으, 으응……?"
10052020-14 = "다른 사람이 잘 알 수 없는 어려운 설명 금지! 결론부터 쉽게 이야기하는 버릇을 들여 줘!"
10052020-15 = "아, 응. 이번은 언니의 의견에 찬성. 리오 회장이 사실은 모두에게 친절하게 알려 주고 싶어 하는 분이라는 것은 알겠는데요."
10052020-16 = "……가끔은 그게 지나친 경우가 있는 것 같아요. 특히 이렇게 상황이 급박할 때는요."
10052020-17 = "(나에게는 딱 좋은 정도였지만…….)"
10052020-22 = "[ns] \"자아, 다시 한번. 우리가 뭘 하면 될까?\""
10052020-23 = "그러니까…… 내가 무사히 돌아올 때까지, 이 주위를…… 지켜 줬으면 해."
10052020-24 = "넷 러닝 중에는, 아무래도 무방비해질 수밖에 없을 테니까."
10052020-25 = "그리고 케이는, 혹시 모르니 나를 보조해 줘."
10052020-26 = "알았어! 그러면 가자, 미도리! 유즈!"
10052020-33 = "혹시나 해서 묻는 건데요. 아마 그 HMD는 하나밖에 준비되어 있지 않을 거고."
10052020-34 = "그러면 제가 뭐 보조할 일은 없지 않아요?"
10052020-35 = "지금은 그렇지. 하지만 무슨 일이 생기면……"
10052020-36 = "케이가 이 HMD를 이어받아 주었으면 해."
10052020-37 = "네? 그건 무슨……?"
10052020-41 = "……! 당신, 혹시 이상한 생각 하는 거 아니죠? 아니, 그렇지만 신경 전기 신호의 증폭은 상호적일 테니까……."
10052020-42 = "만에 하나 러닝에 실패하면, 그 피드백 역시 증폭되어 돌아올 테고……?"
10052020-43 = "그래. 그렇게 될 거야. 실패하게 되면 아마도……."
10052020-44 = "나는, 신경 채로 바싹 구워지겠지."
10052020-45 = "미쳤어요?! 당장 그거 내놔요! 이 몸은 적어도 당신들 같은, 인간의 신체보다는 전기 충격에 강할 테니까!"
10052020-47 = "[ns] \"나도 그런 위험을 무릅쓰는 건 찬성할 수 없어, 리오.\""
10052020-48 = "아냐. 이게 맞아. 케이는…… 우리의 마지막 보루야. 물론 나와 케이가 모두가 연달아서 실패할 가능성도 없지는 않겠지만."
10052020-49 = "적어도, 케이에게 이 일을 먼저 시도하게 하는 것은 순서가 맞지 않아."
10052020-50 = "그리고 이번일 정도는 나를 믿어 줬으면 좋겠어, 선생."
10052020-51 = "이 일이 그렇게까지 위험하고 가능성이 낮았다면…… 애초에, 히마리가 나를 적극적으로 말리지 않았을까?"
10052020-53 = "윽, 그건……!"
10052020-54 = "[ns] \"……너희 모두를 믿어 달라는 거야?\""
10052020-55 = "그래. 그렇게 해 줘."
10052020-60 = "……이상한 기색이 보이면, 억지로 그 자리에서 뜯어내겠어요. 그 정도는 불평하지 말아요."
10052020-61 = "알겠어."
10052020-62 = "그러면, 다녀올게."
10052020-67 = "읏……!"
10052020-68 = "(어지러워……. 정보량이 과다해. 휩쓸려 가 버릴 것 같은 느낌…….)"
10052020-69 = "(무엇보다 허공에 떠 있는 이 감각…… 좌표를 잃고 표류할 것 같아.)"
10052020-70 = "(급한 대로, 가상 중력이라는 임시값이라도 추가해서…….)"
10052020-77 = "후우……. 조금, 나아졌나?"
10052020-78 = "(그건 그렇고, 엄청난 광경이네…….)"
10052020-79 = "이것 참, 너무 늦은 거 아닌가요? 언제 오나 기다리다가, 늙는 줄 알았다니까요. 물론 우리는 나이 같은 거 안 먹겠지만 말이죠."
10052020-80 = "??!!"
10052020-83 = "어서 와요, 츠카츠키 리오. 환영합니다."
10052020-84 = "너는, 오르……!"
10052020-85 = "어라. 이름을 각각 기억하고 있어 줬던 건가요? 그건 고맙지만, 큰 의미는 없겠네요. 왜냐하면 당신의 시간은, 여기에서 끝날 테니까."
10052020-86 = "그러면, 죽어 주시죠!"
10052020-87 = "!!!"
10052020-92 = "오, 뭐야. 제법 잘 피하잖아요? 그렇다면 이런 건 어떻습니까?"
10052020-96 = "?! 발밑이……!?"
10052020-97 = "자유낙하에는 익숙하세요?"
10052020-101 = "당신은 이 네트워크 필드에서까지 중력에 기반한 지형 구조를 구축했죠."
10052020-102 = "그걸 뭐라고 하겠다는 건 아닙니다. 당신들에게는 그게 자연스럽겠죠. 네. 그야말로 무의식 레벨에서부터 말이에요."
10052020-103 = "으윽……!"
10052020-104 = "하지만 우리는 그런 것에 구애받지 않는답니다."
10052020-105 = "소프의 말을 인용하자면, 중력에 영혼이 속박된 당신들과는 발상의 근원부터가 다르다는 거죠."
10052020-106 = "이런 건 어떤가요?"
10052020-110 = "??? 중력 방향이, 옆으로……?!?!"
10052020-111 = "오른쪽으로 떨어지는 기분은 어때요? 이번엔 왼쪽! 다음은 위로!"
10052020-117 = "그러면 마지막으로 자비를 베풀어, 정방향으로 떨어트려 드릴게요!"
10052020-124 = "으…… 으윽……!"
10052020-126 = "슬슬 재미없어졌으니, 이만 마무리 짓도록 할까요?"
10052020-127 = "여기의 우리들은 말하자면 의식체……."
10052020-128 = "다시 소프의 비유를 빌리자면, 전자 유령 같은 거나 다름없는 존재죠."
10052020-129 = "그런 의미에서, 이곳에서의 물리적인 피해는, 실제 육체에는 영향을 주지 않겠지만."
10052020-131 = "다른 의미에서, 당신의 정신 자체에는 직접적으로 작용하게 될 거란 뜻이기도 합니다."
10052020-132 = "그러면 여기에서 퀴즈 하나."
10052020-134 = "여기에서 만일 '죽기라도' 한다면, 현실의 당신에게는 무슨 일이 일어날까요?"
10052020-135 = "……허용치를 넘은 전기적 충격으로, 뇌가 튀겨져 버리겠지."
10052020-136 = "오호, 뭐야. 제법 흐름을 잘 읽네요. 조금이지만 인정해 드리도록 하죠."
10052020-137 = "그러면……."
10052020-138 = "……."
10052020-142 = "그, 그렇지만…… 정말 괜찮은, 걸까요……? 그 아이를 만나게 되면, 아무리 저 사람들이라고 해도……."
10052020-143 = "죽어, 버릴 텐데……?"
10052020-144 = "응……. 그건 확실히 복잡한 문제지."
10052020-145 = "우린 아직 누군가를 해친 적도 없고, 그러고 싶지도 않고, 그런 생각을 해 본 적도 없으니까……."
10052020-150 = "……쳇."
10052020-151 = "각오하시죠, 츠카츠키 리오!"
10052020-163 = "아직이야……! 아직 나는 포기하지 않았으니까……!"
10052020-164 = "소용없다고요!"
10052020-165 = "……!"
10052020-166 = "이렇게, 옆에서 다가오는 것도 알아차리지 못하면서!"
10052020-181 = "아……!"
10052020-186 = "뭘 멍하니 있어요. 빨리 피하기나 하라고요."
10052020-191 = "어……?"
10052020-192 = "어어???"
10052020-193 = "히마리……?!"
10052020-199 = "후훗."
10052020-201 = "그럴 줄 알았어요, 리오. 이 초천재병약미소녀가 보다 못해 직접 서포트하러 왔답니다? 감사하게 여기세요."
10052020-202 = "너…… 그 바이크……."
10052020-203 = "휠체어예요."
10052020-204 = "하지만, 바이크……."
10052020-205 = "휠. 체. 어."
10052020-206 = "아, 알았어……."
10052020-208 = "포기해요, 리오. 죽어도 휠체어라고 우기고 있으니까."
10052020-209 = "말했다시피 저는 기본적으로는 후방 지원 담당이지만, 필요하다면 언제든 이렇게 휠체어를 타고 달려갈 수도 있었답니다?"
10052020-210 = "그야말로, 만능전투미소녀라고도 할 수 있겠죠. 무엇보다 이 휠체어의 숨겨진 기능은……."
10052020-211 = "……."
10052020-212 = "후훗. 이 이상의 설명은 생략하기로 하죠. 비밀은 비밀로 남겨져 있을 때 가장 강력한 법이니까요."
10052020-213 = "무엇보다 초천재미소녀병약바이ㅋ…… 초천재미소녀병약미소녀에게는 그 정도가 딱 어울릴 테니까요."
10052020-214 = "……지금 미소녀라고 두 번 말하지 않았습니까……?"
10052020-215 = "어머나, 케이. 아직 잘 알고 있지 못하는군요."
10052020-216 = "저처럼 청초한 한 떨기 꽃, 티 없이 맑은 1급 미네랄 워터, 그리고 만년산의 결정 같은 별명이 어울리는 세기의 레이디에게는."
10052020-217 = "미소녀 같은 단어는, 몇 번을 중복해서 사용해도 아무런 문제가 없는 법이랍니다."
10052020-218 = "에이미…… 빨리 와 줘요……. 저 지금 살짝 정신이 아득해졌다구요……."
10052020-222 = "자, 다음은 뭔가요? 우리 작은 꼬마 아가씨 오르 양."
10052020-223 = "지금까지의 패턴은 이 초천재병약미소녀이자 전뇌요정 아케보시 히마리가, 전부 파악했답니다?"
10052020-224 = "……아케보시 히마리가 따라왔군요. 그렇다고 한들 이곳에서……."
10052020-225 = "바로 저 오르의 지배 공간에서……!"
10052020-226 = "당신들이 이길 가능성 따윈 처음부터 없었다고요!!!"
10052020-231 = "(윽, 확실히 버겁기는 하네요……!)"
10052020-232 = "(하지만 여기에서는 최대한 뻔뻔하게…… 시간을……!!!)"
10052020-233 = "어머나. 정말로 그렇게 생각하나요? 이번에도 그다지 어렵지 않았는데 말이죠."
10052020-234 = "자신만만하시군요. 이 공간에서만큼은 저는 무엇이든 할 수 있고, 무엇이든 될 수 있다는 사실."
10052020-235 = "지금까지 보여 준 것만으로도, 충분히 알 수 있을 거라고 생각하는데요?"
10052020-236 = "츠카츠키 리오도 아케보시 히마리도, 저능하고 저열하지만, 아무튼 그 정도의 최소 지능은 가지고 있을 테니까 말이에요."
10052020-237 = "이번에는 어떤 방향으로 떨어지고 싶나요? 대각선으로 한번 가 볼까요?"
10052020-238 = "조심해, 히마리! 여기의 중력은, 오르가……!"
10052020-242 = "?"
10052020-248 = "???"
10052020-249 = "후후후."
10052020-250 = "뭐, 뭐야……. 어떻게 된 거죠? 다시 한번……!"
10052020-257 = "……아무 일도 일어나지 않는 것 같은데?"
10052020-258 = "어, 어어?!"
10052020-259 = "어머나, 놀랐나요?"
10052020-260 = "제 시그널이 입력되지 않는다고요?!"
10052020-261 = "무슨 짓을 한 건가요, 아케보시 히마리!!!"
10052020-262 = "알고 싶나요?"
10052020-267 = "부장, 회장. 들려?"
10052020-268 = "시킨 대로 여기…… 음…… 잘 모르겠지만."
10052020-269 = "하여튼, 다 부숴버렸어."
10052020-270 = "수고했어요, 에이미. 나이스 타이밍."
10052020-271 = "응. 시그널 아웃."
10052020-275 = "……."
10052020-276 = "………."
10052020-277 = "…………."
10052020-278 = "다 부숴버렸다고요?!?!?! 설마, 거기의 통신 허브 시스템을요???!!!"
10052020-279 = "그게 어떤 의미로는…… 가장 빠른 크래킹 방식이니까?"
10052020-280 = "역시 인간들은 글러 먹었어요!!!"
10052020-281 = "……미안해."
10052020-282 = "당신이 사과하면 어떡하나요, 리오."
10052020-283 = "미, 미안해……."
10052020-284 = "자, 이것으로 조건은 대등해졌네요. 이제 그만 포기하는 게 어때요, 오르? 지금이라면 봐 줄 수도 있는데요."
10052020-285 = "누가 당신들 마음대로 해 줄줄 알고요?!"
