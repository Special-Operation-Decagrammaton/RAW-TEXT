[translation]
2002602-1 = "건물은 어떻게 완성되는가"
2002602-5 = "D.U. 외곽의 버스정류장"
2002602-6 = "(샬레의 일로 늦은 시간까지 밖에서 업무를 보다가 새벽 첫차를 타고 돌아오게 되었다.)"
2002602-12 = "(……어째서인지 이른 시간이었음에도 불구하고 정류장에는 많은 학생들이 기다리고 있었다.)"
2002602-16 = "[ns] (무슨 행사라도 있는 건가……?)"
2002602-17 = "이야~ 이게 얼마만의 일감이야? 이번 달은 완전히 포기하고 있었는데."
2002602-18 = "안 그래도 기다리던 신상 굿즈가 출시되어서 주머니 사정이 궁하던 참이었는데…… 일이 들어와서 다행이야."
2002602-19 = "그래도 너무 어려운 일은 아니었으면 좋겠다~ 모래나 시멘트 옮기는 건 질색인데."
2002602-20 = "맞아, 맞아. 차라리 배관이나 내선 공사라면 힘쓸 일은 없으니까……"
2002602-25 = "[ns] 조용히 버스를 기다린다."
2002602-32 = "비계 5명, 철골 10명!"
2002602-37 = "나! 나 할래!"
2002602-38 = "나도…… 나도 할 거야!"
2002602-40 = "자, 자— 작업 현장까지 가려면 시간이 얼마 남지 않았으니까 어서 타라고!"
2002602-52 = "[ns] \"자, 잠시만……\""
2002602-53 = "어이, 그 앞에! 꾸물거리지 말고 빨리 승합차에 타!"
2002602-54 = "맞아! 사람이 다 차서 오늘 일감을 놓치기라도 하면 책임질 거야?"
2002602-55 = "[s1] \"그게 아니라 나는……\"\n[s2] \"버스를 기다리고 있을 뿐인데……\""
2002602-68 = "다 탔지? 그럼 출발한다!"
2002602-69 = "[ns] \"자, 잠깐만 기다려줘……!\""
2002602-71 = "(……인파에 떠밀려 승합차에 억지로 탄 뒤 알 수 없는 장소에 도착했다.)"
2002602-74 = "좋은 아침이군. 키보토스의 노동자 제군들!"
2002602-75 = "나는 오늘의 현장 관리 담당을 맡게 된 붉은겨울 학원의 야스모리 미노리라고 한다!"
2002602-76 = "간만의 일감인 만큼 모두 최선을 다하여 노동의 가치를 증명하도록 하자!"
2002602-77 = "물론 급여와 안전은 노동자의 당연한 권리! 조금이라도 이상한 점이 느껴진다면 지체 없이 현장사무소에 보고하도록!"
2002602-78 = "오오!"
2002602-79 = "자…… 그럼 작업에 앞서 구호 준비!"
2002602-80 = "어이!"
2002602-81 = "안전, 제일!"
2002602-82 = "좋아! 좋아! 좋아!"
2002602-83 = "좋아! 그럼 오늘 작업도 안전하게 진행하자고!"
2002602-84 = "[ns] \"……엄청나게 기합이 들어가 있네.\""
2002602-85 = "……응?"
2002602-86 = "어라? [USERNAME] 선생? 작업 현장에는 어쩐 일로……?!"
2002602-87 = "[s3] \"그게 말이야……\"\n[s4] 이곳에 오게 된 경위를 설명한다."
2002602-91 = "아아, 아침의 인파에 떠밀려 픽업 차량에 같이 타버린 건가……"
2002602-92 = "본의 아니게 휘말리게 해서 미안하네. 그 버스 정류장은 첫차가 오기 전까지 용역 학생들이 픽업 차량을 기다리는 집합 장소로 사용하고 있었거든."
2002602-93 = "하지만 이를 어쩌지……? 지금 현장에는 선생을 데려다 줄 수 있는 차량이 한 대도 남아 있지 않는데. 가장 가까운 역도 꽤 걸어야 하고……"
2002602-94 = "[ns] \"괜찮아. 신경 쓰지 마.\""
2002602-96 = "[ns] \"평소에 다들 어떻게 일하는지 보고 싶기도 했고.\""
2002602-97 = "……그래? 그럼 모처럼이니, 선생도 함께 작업 현장을 견학해 볼래?"
2002602-98 = "시간을 뺏은 대신이라긴 뭣하지만, 오늘 작업이 끝나면 내가 이 근처에 올 때마다 자주 가는 가게에서 특대 가츠동을 사줄게."
2002602-99 = "그 집 가츠동은 장국도 뻑뻑하고, 고기도 많이 들어서 정말 일품이란 말이지……"
2002602-100 = "보람찬 노동을 하고 나면 가츠동이나 규동처럼 든든한 식사로 배를 채워야 하루 일이 끝난 기분이 든다니까."
2002602-101 = "아, 우선 견학하기 전에…… 이것부터 착용해."
2002602-108 = "[ns] \"……이건?\""
2002602-109 = "안전모와 안전벨트야. 현장에서 중요한 건 첫째도 안전, 둘째도 안전이니까."
2002602-110 = "아무리 키보토스의 학생들이 몸이 튼튼하다 하더라도 공사 현장에서 쓰는 장비 중에는 총기 이상으로 위험한 물건들이 가득하거든."
2002602-111 = "그 외에도 불안해 보이는 구조물에는 다가가지 않고, 언제나 발밑을 조심해야 해. 알았지?"
2002602-112 = "[s] \"명심할게.\""
2002602-113 = "좋아!"
2002602-114 = "자, 그럼…… 보람찬 하루 일을 시작해 볼까?"
2002602-118 = "용접 팀! 여기 안전 난간 용접해서 고정 후 올려!"
2002602-124 = "미장 팀! 모르타르 세 포대 이쪽으로 가져와! 합판 사이 빈 공간 바로 마무리해!"
2002602-125 = "[s5] \"엄청난 속도네……\"\n[s6] \"금세 건물의 한 층이 올라갔어……\""
2002602-128 = "응? 이게 빠른 건가? 오늘은 다들 손이 덜 풀렸는지 평소보다 느린 것 같은데……"
2002602-129 = "[s] \"이 속도면 일주일이면 건물 한 채는 완성하겠어.\""
2002602-130 = "그렇지도 않아. 우리 용역부는 완공이 느리다는 이유로 발주처로부터 외면을 자주 받는 편이거든."
2002602-131 = "물론 속도는 다소 느려도 완성도만큼은 키보토스 제일이라 자부하고 있지만……"
2002602-132 = "용역 학생들의 작업 속도 자체는 괜찮다고 생각하는데, 어째서 늘 완공이 지연되는지 잘 모르겠네."
2002602-133 = "[s7] \"그건 조금 의외네.\"\n[s8] \"이렇게나 빨라 보이는데……\""
2002602-141 = "어이, 미노리 부장. 실제로 보는 건 처음인가?"
2002602-142 = "내가 이번 건축 공사를 의뢰한 마그마 건설의 사장이다. 만나서 반가워."
2002602-143 = "아, 당신이 이번 공사의 발주자인가. 요즘 같은 시기에 좋은 일감을 줘서 고마워."
2002602-144 = "고맙기는. 이렇게 짧은 시간에 용역을 잔뜩 모아주어서 우리가 더 고마울 정도지."
2002602-145 = "……그보다 현장에는 직접 무슨 일이야? 작업이 잘 진행되고 있는지 보러 나온 거야?"
2002602-146 = "현장의 안전은 내가 확실히 책임지고 있으니 걱정 말라고."
2002602-147 = "아, 그건 아니고……"
2002602-148 = "사실은 말이야…… 용역 학생들에게 부탁할 게 하나 있어서."
2002602-149 = "부탁?"
2002602-150 = "그게, 갑자기 급히 돈을 보내야 하는 곳이 생겼거든. 지금 수중에 가지고 있는 돈이 바닥나 버렸어. 그래서……"
2002602-151 = "……아무래도 용역 학생들의 오늘치 급여는 주기 어려울 것 같아."
2002602-155 = "대신 내일 급여는 더 높게 쳐줄 테니까, 일단 오늘만 급여 없이 일하는 것으로—"
2002602-157 = "모두, 작업 중지!"
2002602-164 = "급여 없는 곳에 노동 없다!"
2002602-165 = "노동이란 생존을 위한 인류의 근본적인 투쟁! 그러므로 모든 노동은 생존을 위한 대가가 전제되어야 한다!"
2002602-166 = "그런데 이 존귀한 투쟁의 행위를 한 치 혀를 부리는 것만으로 부려먹으려 하다니……"
2002602-167 = "노동의 가치도 모르는 자본가와는 일할 수 없어!"
2002602-168 = "아니, 내가 언제 돈을 떼어먹겠다고 했나. 그냥 조금 급여를 미루자는 것뿐이지……"
2002602-169 = "그 무슨 궤변! 용역은 합의에 따라 노동을 제공하는 계약—"
2002602-170 = "그러므로 계약서로 작성되지 않은 노동은 1분 1초도 제공할 수 없다!"
2002602-171 = "맞아, 맞아!"
2002602-172 = "쳇…… 고지식한 녀석들 같으니라고."
2002602-173 = "알겠어, 알겠어! 그럼 오늘은 이만 돌아가 봐."
2002602-174 = "내일은 돈을 준비해 올 테니까…… 내일부터라면 일할 수 있는 거지?"
2002602-175 = "돈을 준비해온다면 당연히 일할 수 있지만—"
2002602-176 = "……잠깐, 그럼 오늘 아침부터 여태까지 일한 급여는 어떻게 되는 거지?"
2002602-177 = "내 말을 무어로 들은 거야? 오늘은 돈이 없다니까!"
2002602-178 = "내일 와서 이야기하자고, 내일!"
2002602-179 = "아하…… 그런 식으로 노동의 가치를 조금씩 깎아왔던 건가, 이 부르주아 녀석……"
2002602-180 = "노동의 가치를 폄하하는 녀석에게 본때를 보여주는 일이라면 얼마든지 할 수 있지……!"
2002602-181 = "발파팀! 다이너마이트 있는 대로 가져와!"
2002602-182 = "다, 다이너마이트……? 네, 네 녀석 뭐 하려는 거야?"
2002602-183 = "설마 급여가 밀린 건 때문에 앙심을 품고 사보타주를 하려고……?"
2002602-184 = "사보타주라니, 말이 심하네. 우린 그저 거스름돈을 가져가려는 것뿐이야."
2002602-185 = "건물에서 오늘 우리가 무보수로 건설한 층계는…… 모두 폭파한다!"
2002602-186 = "잠깐! 어차피 오늘 부숴도 내일 오면 다시 건설해야 하잖아!"
2002602-187 = "공들여 만든 걸 부수고 다시 건설하다니, 아깝지도 않은 거냐고?"
2002602-188 = "네 녀석들에게는 건축 예술가로서의 자부심도 없는 거냐?!"
2002602-189 = "예술은 언제나 부에 의해 지배되는 법이지."
2002602-195 = "……자, 다시 한번 묻지. 오늘치 급여는 준비됐나?"
2002602-196 = "아까도 말했잖아! 오늘은 가지고 있는 돈이 없다고—"
2002602-202 = "그럼…… 폭발이다!"
2002602-208 = "아이고—!"
2002602-211 = "후후…… 오늘도 보람차게 노동의 가치를 증명했더니 배가 고픈걸."
2002602-212 = "좋다, 기분이다! 오늘은 내가 전원에게 특대 가츠동을 쏠 테니 든든하게 배나 채우고 돌아가자고!"
2002602-215 = "와! 역시 부장이야!"
2002602-216 = "부장이 지휘하는 공사라면 평생 따를 테니까!"
2002602-218 = "그나저나…… 우리 용역부가 진행하는 공사는 어째서 완공이 늘 지연되는 걸까? 정말 이해할 수가 없다니까."
2002602-223 = "(그 의문에 대한 답은 어렴풋이 알 것 같았지만, 말을 아끼기로 했다…….)"
2002602-225 = "(……이후, 미노리가 추천하는 가게에서 용역부 학생들과 함께 뜨끈한 가츠동을 먹고 샬레로 돌아왔다.)"
