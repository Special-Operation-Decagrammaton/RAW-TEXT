[translation]
10027110-1 = "11화;어느 특별한 거래"
10027110-4 = "붉은겨울 설원"
10027110-6 = "으아아아! 늦는다! 늦어! 늦고 말아!"
10027110-7 = "그래도, 어떻게, 물러가게 했네요. 고생하셨어요. 선생님……."
10027110-11 = "[ns] \"직감이 말하고 있어……. 이건 불길하다고……!\""
10027110-12 = "갑자기 그게 무슨 말씀이세요. 선생님?"
10027110-13 = "뭐? 두 번 일어난 일은 세 번 일어날 수도 있는 법이라고? 에이, 이상한 소리 하지 마. 선생."
10027110-14 = "맞아요. 이건 어디까지나 우연히 겹친 일이잖아요? 모두가 독립시행인 거죠. 그러니까……."
10027110-22 = "<지식해방전선>에서 뭔가 귀중한 '동인지'를 만든다는 말을 듣고 찾아왔어요!"
10027110-23 = "응! 나는 노도카가 좋은 생각이 있다길래 따라왔어!"
10027110-25 = "설마……?"
10027110-27 = "동인지의 내용은 잘 모르지만, 아무튼 그게 뭔가 귀중한 데다 가치 있는 물건이라고 들었거든요."
10027110-28 = "그래서 그걸 얻어서 체리노 회장과…… '거래'를 하면, 227호 특별반에 따듯한 난로를 들여놓을 수 있을지도 모르잖아?"
10027110-29 = "시구레 쨩?! 227호 특별반의 생활에 익숙해져 버리면 어떡해! 어떻게든 정학에서 벗어날 생각을 해야지!"
10027110-30 = "어쨌든, 체리노 회장은 욕심이 많고, 남들이 귀하다는 물건이라면 사족을 못 쓰니까 말이에요. 부러워서라도 샘이 나서라도 반드시 자기 것으로 만들려 하겠죠."
10027110-31 = "우리는 체리노 회장의 바로 그런 부분을 이용해서, 정학에서 벗어나…… 제대로 된 난방기구가 마련되어 있고, 벌레가 나오지 않는 이불이 있으며, 굶주린 곰이 나오지도 않는…… '보통'의 생활로 돌아갈 거예요!"
10027110-38 = "남의 동인지로 그런 거 하려고 하지 마-!"
