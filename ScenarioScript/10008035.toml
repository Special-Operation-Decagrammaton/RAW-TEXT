[translation]
10008035-3 = "끄, 끄아아아 다, 당했……다아……."
10008035-4 = "우, 우리의 원대한 꿈이……."
10008035-10 = "흥. 이런 시시한 녀석들까지 계획에 발을 담근 건가."
10008035-11 = "(헬멧단이 새전함을 노린다? 그보다 카이텐져의 도주 루트는 어떻게 알아낸 거지……?)"
10008035-12 = "(이거, 일이 단순하게 흘러가는 것만은 아닌 듯한…….)"
10008035-13 = "근데 괜찮아? 이러는 사이에도 점점 카이텐져는 멀리 도망가고 있다구?"
10008035-14 = "헉?!"
10008035-15 = "그, 그래! 이러고 있을 때가 아니야! 다시 출발이야! 가자!"
10008035-17 = "네, 넷!"
