[translation]
1013006-1 = "저녁 강가의 하모니카"
1013006-4 = "[ns] \"스바루가 사고 싶은 거!!!\""
1013006-5 = "부담스러워요!!!"
1013006-6 = "[s] \"그래! 그 반응을 기다렸어!\""
1013006-7 = "선생님 이럴 땐 진짜 싫어요!!!"
1013006-9 = "그래서…… 뭘 사고 싶었냐고요?"
1013006-10 = "그게, 그러니까……."
1013006-11 = "……."
1013006-12 = "악보, 요."
1013006-13 = "[s] \"어? 미안. 잘 안 들렸어.\""
1013006-14 = "으, 으으……. 그러니까……."
1013006-15 = "……."
1013006-16 = "악보요, 악보! 가능하면 하모니카 편곡 가능한 걸로요!"
1013006-18 = "후아……."
1013006-19 = "[s] \"만족했어?\""
1013006-20 = "만족이요?"
1013006-21 = "그런 것 같기도 하고, 아닌 것 같기도 하고."
1013006-22 = "쇼핑이라는 걸 처음 해 본 것 치고는, 만족했던 것 같기도 하지만요."
1013006-23 = "[s] \"……자주 오자.\""
1013006-24 = "네? 쇼핑을요?"
1013006-25 = "무리예요, 무리. 저 그렇게 돈 없어요."
1013006-26 = "예? 오늘도 정작 그렇게 많은 돈을 쓴 건 아니지 않냐고요?"
1013006-27 = "그건 맞긴 한데요……."
1013006-28 = "그렇군요……. 그냥 물건을 둘러보는 것만으로도, 즐거워지는 부분이 있으니까……."
1013006-29 = "하지만 그건, '언젠가 갖고 싶다'는 마음을 품게 하는 거잖아요?"
1013006-30 = "물론 그 마음을 달래기 위해서 사람으로 하여금 무언가를 더 하게 만들고, 그 결과 어떤 의미로는 사람을 움직이도록 하는 것이겠지만요."
1013006-31 = "그래도 그런 욕망은, 좀처럼 충족되지 않는 것이라고 생각해요."
1013006-32 = "결국, 채워지는 것 따위 없는 거잖아요. 쓸쓸한 이야기지만요."
1013006-33 = "……."
1013006-34 = "선생님. 저는 어쩌면……. 궁극적인 해결을 원하는 것인지도 몰라요."
1013006-35 = "물론 그건 충족될 수 있는 욕망만큼이나 말도 안 되는 것이겠죠. 그래도, 그런 것이 어딘가에는 있지 않을까, 하고……."
1013006-36 = "희미한 기대 정도는, 해 보고 싶어요."
1013006-37 = "풀리지 않는 문제나 답이 없는 문제 같은 건, 지금까지 너무 많이 겪었거든요."
1013006-38 = "[ns1] \"……응.\"\n[ns2] \"스바루는, 그런 말을 할 자격이 있다고 생각해.\""
1013006-41 = "……감사합니다."
1013006-42 = "하하. 그렇지만 어차피 안 될 게 뻔하고, 헛되기만 할 뿐일 텐데, 너무 과하게 생각하는 것도 손해겠죠."
1013006-43 = "[ns3] \"그렇지 않아.\"\n[ns4] \"그렇다고 하더라도, 지금 최선을 다하지 않을 이유는 없으니까.\""
1013006-46 = "……."
1013006-47 = "[s5] \"스바루가 하모니카를 연주하는 것도.\"\n[s6] \"하모니카로 불 수 있는 악보를 구한 것도.\"\n[s7] \"모두, 사라지더라도 의미가 있는 것들인 것처럼.\""
1013006-51 = "……!"
1013006-52 = "……그래요."
1013006-53 = "음악만큼 그 즉시 사라지는 것도, 정말로 드물겠죠."
1013006-54 = "심지어 저는 약간, 부끄러워질 때도 있고요."
1013006-60 = "취미에 부끄러움을 느낄 필요는 없다고요? 네. 저도 그 정도는 알아요. 머리로는요."
1013006-61 = "마음을 달래 주고, 후배들이 많이 좋아해 주는 것이기도 하지만……."
1013006-68 = "가끔은 제가 옛날 사람인 것을 넘어서."
1013006-69 = "저 자신을 무슨, 오래 전의 소설이나 영화 속 주인공처럼 연출하고 싶은 것은 아닌가, 하는 생각이 든단 말이죠."
1013006-70 = "우와아……. 자세하게 말해 놓고 나니까 진짜 부끄럽네요……."
1013006-71 = "[ns8] \"괜찮아. 괜찮아.\"\n[ns9] \"그러면 또 좀 어때.\""
1013006-74 = "자꾸 남의 일이라고 그렇게 말씀하시지 말고요……."
1013006-78 = "……."
1013006-79 = "선생님?"
1013006-80 = "괜찮으시면, 강변으로 조금 내려가지 않으시겠어요?"
1013006-81 = "선생님께, 들려 드리고 싶은 것이 있어요."
1013006-83 = "(스바루의 말을 따라, 천천히 강변으로 산책하듯 내려갔다.)"
1013006-84 = "(그 사이에 조금씩, 해가 지고 있었다.)"
1013006-86 = "(스바루는 강변에 자리를 잡고, 하모니카를 연주하기 시작했다.)"
1013006-87 = "(말없이 저녁 바람을 맞으며, 스바루의 연주를 감상하고 있었다…….)"
1013006-91 = "[wa:1890]― [log=니코 스바루]뭔가, [wa:1380]신선한 기분이에요.[/log]"
1013006-93 = "― [log=니코 스바루]이렇게 [wa:740]한 사람을 위해 [wa:700]연주하는 건 [wa:1340]처음이라…… [/log]"
1013006-96 = "[wa:770]― [log=니코 스바루]어떠,[wa:1440] 셨을까요.[wa:80] [/log]"
1013006-98 = "― [log=니코 스바루]이상하지는,[wa:1810] 않으셨나요……? [/log]"
1013006-101 = "[ns] \"그럴 리가. 최고의 연주였어.\""
1013006-103 = "[wa:1260]― [log=니코 스바루]그건……[wa:1920] [/log]"
1013006-105 = "― [log=니코 스바루]진심,[wa:1510] 이라고 받아들여도 [wa:570]되는 거죠?[wa:40] [/log]"
1013006-108 = "― [log=니코 스바루]……감사합니다.[wa:160] [/log]"
1013006-111 = "[wa:400]― [log=니코 스바루]사실은,[wa:1440] 다른 걸 더 할 수 [wa:1110]있으면[/log]"
1013006-113 = "― [log=니코 스바루]좋았을 텐데……[wa:80] [/log]"
1013006-116 = "― [log=니코 스바루]지금 저는,[/log]"
1013006-118 = "― [log=니코 스바루]이 정도밖에 해 드릴 게……[/log]"
1013006-121 = "[wa:370]― [log=니코 스바루]네? [/log]"
1013006-123 = "― [log=니코 스바루]'또 연습해서 [wa:770]들려줬으면 좋겠다'고요……?[/log]"
1013006-126 = "― [log=니코 스바루]'악보도[wa:790] 많이 샀으니까'요……?[/log]"
1013006-129 = "[wa:360]― [log=니코 스바루]그,[wa:990] 그건…….[/log]"
1013006-132 = "― [log=니코 스바루]다시……[wa:1320] 그때 가서[wa:80] [/log]"
1013006-134 = "― [log=니코 스바루]생각해 볼게요.[wa:40] [/log]"
