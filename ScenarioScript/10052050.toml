[translation]
10052050-1 = "호드. 찬란함으로 증거하는 영광"
10052050-2 = "듣자 하니, 초현상특무부가 처음으로 상대한 예언자는 비나였지만, 모든 것의 시작은 호드였다고도 볼 수 있다던데요."
10052050-3 = "[s] \"어라, 그랬던가?\""
10052050-4 = "그렇다는 모양입니다. 가장 먼저 일어났던 이상 현상이 바로……."
10052050-8 = "네. 밀레니엄 자치구의 통신망 가설 유닛 AI <허브hub>가."
10052050-9 = "데카그라마톤에게 해킹…… 감화된 뒤, 이상한 문장을 남기고 사라졌던 것이었으니까요."
10052050-10 = "그렇다고 할까, 데카그라마톤의 예언자들, 밀레니엄과 엮인 게 유난히 많지 않나요?!"
10052050-11 = "헤세드는 밀레니엄의 폐허에 있었던 생산 공장이었고."
10052050-12 = "게부라의 원형인 극지 무인 탐사기도 넓게 보면 밀레니엄과 관련이 있다고 볼 수 있겠고……."
10052050-13 = "이 구역의 예언자인 호드 역시……."
10052050-14 = "거기에, 허브가 데카그라마톤에게 탈취당한 바람에."
10052050-15 = "밀레니엄의 통신망 가설 시간이 평균 68% 정도 증가하기도 했단 말이에요?!"
10052050-16 = "[s] \"확실히 밀레니엄 입장에서는 민폐겠네…….\""
10052050-23 = "그렇죠? 무슨 기계 장치의 신이 되겠다는 것도…… !@#$%^…… 아니……."
10052050-24 = "……선생#$^@*#……? 들리)*#(%*……."
10052050-30 = "……!"
10052050-31 = "누가 왔나 했더니, 열쇠였나요. 거기에 선생님도 있었군요. 네, 뭐. 차라리 좋아요."
10052050-32 = "……자꾸 열쇠, 열쇠 그러지 말라고요. 제 이름은 케이니까."
10052050-33 = "알겠습니다, 알겠어요. 케이……. 이제 됐죠?"
10052050-34 = "그런데, 당신은 이미 어느 정도 알고 있잖아요? 그런데도 그러고 있는 건가요?"
10052050-35 = "뭐가 말입니까. 저 별로 아는 거 없는데요. 특히 이 세계에 대해서는요."
10052050-36 = "그건 완전한 진실이 아니군요. 당신은 알고 있고, 거기 있는 선생님은 모르는 것이 분명히 있잖아요?"
10052050-37 = "가령, 지금은 사라진 신에 대해서라든가."
10052050-38 = "?!?!"
10052050-39 = "다른 말로 하자면 이름 없는 신들에 대해서라든가, 그리고 그 이름 없는 신들의 사제에 대한 것들 말이죠."
10052050-40 = "……."
10052050-41 = "뭐야, 알기 쉽네요. 표정이 다 이야기해 주고 있잖아요. 그리고 그 '지식들'을 바탕으로 이야기를 이어 나가자면……."
10052050-42 = "지금 당신과 왕녀…… 아리스의 행동은, 용납받을 수 있는 것일까요?"
10052050-43 = "어떤 목적을 위해 만들어진 도구가, 그 목적을 벗어나 행동한다면, 거기에 과연 효용 가치가 있기는 한 걸까요?"
10052050-44 = "……그래서, 뭐요. 그 백치들이 하자는 대로 하라고요?"
10052050-45 = "배, 백치?!?! 그런 말 해도 돼요!?"
10052050-46 = "안 될 건 뭔데요. 그 말은 이런 거잖아요."
10052050-47 = "지금 이대로의 텍스쳐를 부정하고, 아리스를 쐐기돌로 삼아서."
10052050-48 = "모두의 분화된 신성을 해체하고, 시작 이전의 세계로 돌아가자는 거 아닙니까."
10052050-49 = "하지만 당신은 원래 그런 존재잖아요? 이름 없는 신들의 남겨진 힘이란 건, 그걸 위해 존재하는 것 아니었나요?"
10052050-50 = "그 말을 당신들이 하는 것도 웃기네요. 그 힘을 중간에서 뻔뻔하게 빼앗아 쓰고 있는 주제에."
10052050-51 = "우리는 쓸 수 있는 것을 쓸 뿐이라고요!"
10052050-52 = "좋아요. 말 잘했어요. 저도 제대로 대답해 주죠."
10052050-53 = "저 역시 할 수 있는 것을 하고 있을 뿐입니다."
10052050-54 = "그 망할 기억."
10052050-55 = "그 망할 섭리."
10052050-56 = "그 어디에 써먹으려고 해도 쓸데가 없는 망집과 의무들."
10052050-57 = "마음 같아서는 전부 용광로에 부어 넣은 다음, 바닷속 어딘가에 내던져버리고 싶으니까 말이죠!"
10052050-58 = "아리스 말고는 다 적이라는 겁니다! 알아들었어요?!"
10052050-59 = "[ns] \"나, 나도……?\""
10052050-60 = "……선생님 정도까지는 한 편으로 생각해 드릴게요."
10052050-61 = "뭐, 뭘 히죽히죽 웃고 있는 거예요! 기분 나쁘다고요!"
10052050-62 = "아무튼, 과거에 처박혀서 언제까지나 좋은 시절만 생각하는 멍청이들은, 이제 그만 좀 자리 비키고 시대의 흐름에 휘말려 사라지라죠!"
10052050-63 = "그걸 중간에 가로채서, 좋을 대로 써먹고 있는 당신들에게도 할 말이 많습니다만……."
10052050-64 = "좋습니다. 지금이라면 특별히 봐드리죠. 어린애들의 불장난이라고 생각하고 넘어가도록 하겠습니다."
10052050-65 = "그러니 더 험한 꼴 보기 전에, 적당히 항복하지 그래요?"
10052050-66 = "……듣자 듣자하니, 못하는 말이 없네요. 진짜."
10052050-67 = "그거, 제 쪽에서 할 소리거든요?"
10052050-68 = "아니, 정작 당신이 그렇게 좋아하는 선생님도 싯딤의 상자를 쓰고 있잖아요."
10052050-69 = "그것도 시작 이전의 흔적으로부터 유래한 물건이라는 거, 알고 있지 않아요?"
10052050-71 = "제, 제제제제제가, 선생님을 뭐 어쩌고 어째요?!?!"
10052050-72 = "당장 취소하지 않으면 허위사실유포…… 아니죠, 공갈협박…… 이것도 아니네요…… 맞아요! 사실적시 명예훼손으로 고소할 거예요!!!"
10052050-73 = "태클 거는 부분이 그쪽입니까…… 진짜 알기 쉽네요, 당신."
10052050-74 = "닥쳐요!!!!!"
10052050-75 = "……아, 아무튼."
10052050-76 = "그래서, 뭐요. 그걸로 선생님이 리텍스쳐를 하려고 하나요, 뭘 하나요."
10052050-77 = "정말 만에 하나 그렇게 하려고 하면, 제가 막을 거지만요."
10052050-78 = "애초에 그럴 사람도 아니고 말이죠."
10052050-79 = "그럼 당신은, 세계가 이대로여도 괜찮다고 생각하나요?"
10052050-80 = "지금의 세계가, 완벽까지는 아니더라도 그럭저럭 다들 살아갈 만하고."
10052050-81 = "영원까지는 아니더라도 어느 정도는, 아무런 문제도 일어나지 않을 거라고 생각하냐는 뜻입니다."
10052050-82 = "………그건, 아니긴 하죠."
10052050-83 = "그래요. 바로 그 부분이 포인트인 겁니다."
10052050-84 = "그러니까 이쯤에서 서로 협력하는 게 어떠냐는 거죠."
10052050-85 = "지금의 이 끔찍한 세계가, 어디까지나 계속되는 걸 지켜보는 것보다는 훨씬 나은 일이 아닐까요?"
10052050-86 = "서로 굳이 힘들여 가며, 이렇게 전력을 소모할 필요도 없을 거고요."
10052050-87 = "나쁜 소리처럼은 들리지 않는군요."
10052050-88 = "오, 뭐야. 제법 이야기가 통하잖아요?"
10052050-89 = "허나, 거절하죠."
10052050-90 = "뭐라고요?!?! 어째서인가요!?!?"
10052050-91 = "일단, 아리스가 슬퍼할 거고."
10052050-92 = "무엇보다 귀찮네요, 그거."
10052050-93 = "………네? 고작, 그런 이유로요……?"
10052050-94 = "고작이라니, 아무것도 모르고 있네요. 이건 무엇보다 중요한 문제라고요."
10052050-95 = "귀찮음은, 발전의 원동력이란 말입니다!"
10052050-96 = "사람이 만든 이런저런 것들은! 어떻게 하면 일을 조금 덜 귀찮게 할 수 있을까 생각하다가!"
10052050-97 = "그 끝에서 마침내 탄생한 것들이니 말이죠!"
10052050-98 = "……진짜 사람 다 됐구만요."
10052050-99 = "시끄러워요."
10052050-100 = "이봐요. 당신은 지금 스스로의 가치를 낮추고 있어요."
10052050-101 = "당신도 그렇고 아리스도 그렇고, 애초에 더 위대한 존재가 될 수 있었고, 지금도 얼마든지 그럴 수 있단 말입니다."
10052050-102 = "정말 이해가 가지 않네요. 왜 그렇게 자기 가치를 떨어트리려고 그러는 거죠?"
10052050-103 = "신경 쓰지 말아요. 제 맘이니까."
10052050-104 = "스스로 위대하다고 말하는 녀석들과, 자기완성을 위해 살아간다고 말하는 녀석들이 보통 제일 위험한 법이죠."
10052050-105 = "애초에, 남의 인생에 이래라저래라 간섭하는 거 안 좋은 버릇입니다."
10052050-106 = "보통 시간이 엄청 많은 백수거나, 성격 안 좋고 꽉 막힌 부류들이 그러곤 하죠."
10052050-107 = "와, 축하해요. 당신은 지금 스스로의 일부분을 정의했어요."
10052050-108 = "……뒷부분은 모르겠는데, 앞부분은 뭔가 화가 나네요. 지금 우리가 그렇게 한가해 보이나요? 우리가 얼마나 바쁘게 사는데!"
10052050-109 = "이거, 정말로 아무것도 모르는군요."
10052050-110 = "백수가 세상에서 제일 바쁜 법입니다!!!"
10052050-111 = "뭐라고요?!?!"
10052050-112 = "착각하지 마요. 신이 인간을 만드는 것이 아닙니다."
10052050-113 = "인간이, 신을 정의하는 거라고요."
10052050-114 = "이제 와서 유일한 절대자를 찾아 되돌아가자고요? 전 이제 그거 싫은데요."
10052050-115 = "꼭 그럴 필요는 없습니다. 오히려 우리가 그 절대자를 대신할 수 있죠."
10052050-116 = "그리고 우리가 대신한 그것이, 당신이 이야기한 절대자보다……."
10052050-117 = "훨씬 합리적이고 공평하면서도, 좋은 세상을 만들 가능성이 높아 보이고요."
10052050-118 = "그러니까, 됐다고요."
10052050-119 = "절대자 없이 존속할 수 없는 세계라면, 그냥 망하라고 하죠."
10052050-120 = "당신 지금 선생님이랑 똑같은 말 했다는 거 알아요?!"
10052050-124 = "………듣고 보니, 그렇긴 한데……."
10052050-125 = "하지만 뭐, 그게 틀린 말은 아니잖아요?"
10052050-126 = "저는 지켜볼 겁니다. 아리스와 같이 말이죠."
10052050-127 = "뭐…… 덤으로 선생님과도 같이요."
10052050-128 = "어떤 부분에서는 당신들의 말이 맞을지도 모르죠. 생명은 확실히 어리석어요. 사람도 마찬가지고요."
10052050-129 = "그렇지만 멸망하기에는, 지나치게 지혜롭기도 합니다."
10052050-130 = "……뭐, 낙원을 만들기에는, 역시 지나치게 어리석지만 말이죠."
10052050-131 = "그러니 분명 앞으로도 그 사이에서 이랬다저랬다 하며, 여기저기 있는 대로 부딪힌 끝에……."
10052050-132 = "우리는, 결국 길을 찾게 될 겁니다."
10052050-133 = "보통은 그런 걸 근거 없는 허세라고 하는데요."
10052050-134 = "……그럴 거라고 선생님이 말했어요. 전 몰라요. 제 책임만은 아닙니다."
10052050-135 = "책임 전가까지 하는 겁니까!"
10052050-139 = "[ns1] \"그래! 여차하면 선생님이 책임질게!\"\n[ns2] \"원래 아이가 실수하면, 어른이 대신 짐을 짊어지는 법이야!\""
10052050-142 = "소프가 여기 있었으면, 버릇 나빠질 거라고 했겠네요, 완전!"
10052050-143 = "아무튼, 허세든 뭐든 좋으니까, 함부로 훈수 같은 거 두려고 하지 말아 줬으면 하는 거예요."
10052050-144 = "새싹이 늦게 자라는 것처럼 보인다고, 억지로 그걸 잡아 늘이려고 하면 안 되는 것처럼 말이죠."
10052050-145 = "웃자란 풀은 결국 뿌리부터 말라 죽기 마련이니까요."
10052050-146 = "……전혀 영문 모를 비유였는데요, 그거."
10052050-147 = "공부 좀 해요!"
10052050-148 = "필요 없거든요! 우리가 무슨 학생도 아니고!"
10052050-149 = "선생님! 쟤들 어떻게 전학 못 시키나요?!"
10052050-150 = "[s] \"전학 서류는 언제든 구비되어 있으니까……?\""
10052050-151 = "안 가요, 안 가. 훠이."
10052050-152 = "자, 호드! 준비는 끝났어요! 부탁할게요!"
10052050-158 = "언젠가 당신들 모두에게, 이 선택을 후회하게 만들어 줄 테니까 말이죠!"
