[translation]
10025010-1 = "제1화;귀여운 수영복과 귀엽지 않은 마을"
10025010-2 = "야토우라 마을 어귀"
10025010-15 = "……모에. 그 허술한 차림은 도대체 뭐야?"
10025010-16 = "응? 내 옷차림에 무슨 문제라도 있어?"
10025010-18 = "평소에 쓰던 안경은 어째서 벗어 둔 거야? 서버용 단말기는 또 어디에 있고?"
10025010-19 = "세상에 안경을 쓴 채로 물놀이를 하는 사람이 어디 있다고. 당연히 렌즈로 갈아 끼웠지~"
10025010-20 = "그리고 서버용 단말기는 방수 처리가 되지 않아서 평소에 들고 다니는 스마트폰에 대체 어플을 설치했어."
10025010-21 = "물론 안정성은 전용 단말기보다 조금 떨어지겠지만……"
10025010-22 = "모에, 너는 지금 우리가 진짜 여름휴가라도 나온 걸로 착각한 거야?"
10025010-24 = "이건 엄연한 SRT의 작전이라고!"
10025010-25 = "작전에 필요한 장비를 하나라도 더 챙겨야 하는 마당에, 물놀이를 핑계로 장비를 덜어내다니—"
10025010-30 = "아니요, 사키. 이번 작전에서만큼은 모에의 판단이 옳습니다."
10025010-35 = "전에도 말씀드렸지만 이번 작전에서 저희는 평범한 관광객으로 위장하고 있는 만큼, 특수부대를 연상할 수 있는 장비들은 철저히 숨겨야 합니다."
10025010-36 = "교범대로 장비와 무장을 완벽히 갖춘 채 작전에 임한다면, 전투 시에는 도움이 되겠지만 시민들을 탐문할 때는 괜한 오해를 사 정보를 조사하는 데 방해가 될 수도 있으니까요."
10025010-42 = "……그 수영복은 또 뭐야?"
10025010-43 = "네, 네……? 뭔가 이상해 보이나요? 귀엽다고 생각했는데……"
10025010-44 = "아니, 귀여운 수영복인 건 동감하지만……"
10025010-45 = "움직이기에 불편하지 않아? 수영복에 거추장스러워 보이는 프릴이 잔뜩 달려 있는데."
10025010-46 = "게다가 그 튜브는 또 뭐야?"
10025010-47 = "분명 미야코 너, SRT 학원에 있었을 때 수영 실습을 만점으로 통과한 걸로 기억하는데—"
10025010-48 = "이, 이건 그러니까…… 작전에 필요한 장비 중 하나로……!"
10025010-50 = "뭐— 모처럼 바다에 나왔으니 우리 소대장님께서도 귀여운 모습을 어필하고 싶으셨던 모양이지."
10025010-52 = "……모에!"
10025010-54 = "그러는 사키 너도 뭘 그렇게 주렁주렁 챙겨 가지고 온 거야?"
10025010-55 = "더플백에 탄입대, 부니햇까지……"
10025010-56 = "장비만 두고 보면 무슨 수중 폭파 작전이라도 수행하러 떠나는 것처럼 보이는데."
10025010-57 = "나도 수상해 보이지 않는 선에서 최대한 덜어낸 거거든?!"
10025010-58 = "아무리 잠입 조사 작전이라고 해도 필수 장비까지 포기할 수는 없으니까."
10025010-59 = "머리를 보호할 수 있는 방탄 부니햇과 예비 탄약, 수분 보충을 위한 수통, 그리고 유사시 수중 작전을 위한 잠수 장비 정도는……"
10025010-60 = " ………"
10025010-61 = "최소한 그 더플백만이라도 평범한 걸로 바꿀 수는 없었어?"
10025010-62 = "이 더플백이 어때서? 일부러 보급품이 아니라 사제로 챙겨왔는데."
10025010-68 = "느, 늦어서 미안해……! 준비에 생각보다 시간이 오래 걸려서……"
10025010-69 = "일단 저격에 필요한 장비는 긴 낚시 가방 안에 몰아서 정리하긴 했는데, 역시 조금 이상해 보이려나……"
10025010-70 = "그리고 장비가 새것처럼 보이면 너무 눈에 띌 것 같아서, 오는 길에 해변 근처에서 장비를 조금 더럽혀 오긴 했는데—"
10025010-77 = "어, 어라……? 다들 표정이 왜 그래……?"
10025010-79 = "역시 이 정도는 공을 들여야 제대로 된 잠입이라고 할 수 있는 건가…… 맹점이었어."
10025010-80 = "역시 잠입과 관련된 업무는 미유를 못 따라가겠네."
10025010-82 = "나, 나 뭔가 이상해……?"
10025010-89 = "[ns1] \"다들 수영복으로 갈아입었구나!\"\n[ns2] \"모두 귀여운 모습이네.\""
10025010-93 = "가, 감사합니다……"
10025010-94 = "잘 어울린다니 다행이에요……"
10025010-96 = "뭐, 철인 3종 경기에 나갈 때 입을 것 같은 옷을 입고 온 친구도 있지만."
10025010-97 = "……눈치가 없어서 미안하게 됐네."
10025010-98 = "나야 귀여운 옷이랑은 거리가 먼 사람이라서 말이지."
10025010-99 = "[s3] \"응? 그게 무슨 소리야……?\"\n[s4] \"내가 보기에는 사키의 수영복도 엄청나게 귀여운걸?\""
10025010-109 = "이걸 좋아해야 할지, 말아야 할지……"
10025010-110 = "뭐, 평범한 관광객처럼 보인다면 문제없겠지. 일단은…… 고마워."
10025010-116 = "준비도 모두 끝난 것 같으니, 그럼 진입에 앞서 작전 개요를 다시 한번 설명 드리겠습니다."
10025010-117 = "이번 작전은 야토우라 마을을 탐문하여 이 마을의 새우가 폐기되거나, 별개의 루트로 반출된 정황은 없었는지 직접 조사하는 것입니다."
10025010-118 = "전에도 말씀드렸지만 이번 작전에서는 주민 여러분의 협조가 필수적이기 때문에 불필요한 의심이나 경계를 사지 않도록 각별히 주의를 부탁드리겠습니다."
10025010-119 = "저, 저기…… 미야코 쨩. 브리핑 중에 끼어드는 것 같아서 미안하지만……"
10025010-121 = "우리, 이미 엄청나게…… 주목받고 있는 것 같은데……"
10025010-130 = "……뭔가 뻔뻔하게 물놀이를 즐길 수 있을 만한 분위기는 아닌 것 같네요."
10025010-132 = "관광객을 위한 편의시설도 없고, 어구만 잔뜩 널려 있는 어촌 한 가운데에서 수영복을 입고 어슬렁거리고 있다면 조금은 수상히 보이겠지."
10025010-133 = "게다가 마을의 분위기도 어딘가 스산한 게…… 마치 공포 영화에 나오는 장소 같아……"
10025010-135 = "……여기 정말 관광지 맞아?"
10025010-137 = "기록에 따르면 야토우라 마을은 야생의 자연경관을 즐길 수 있는, 숨겨진 관광 명소로 과거에는 제법 인기가 있었다고 합니다만……"
10025010-138 = "공장이 세워진 이후로 마을의 분위기도 점차 바뀌어, 이제는 외부 사람들은 거의 찾지 않는 고립된 마을이 되어 버린 모양입니다."
10025010-139 = "[s] \"……역시 제복을 입고 탐문을 하는 게 좋으려나?\""
10025010-140 = "아뇨. 이미 수상한 시선을 받고 있는 상황에서 SRT의 정체를 드러낸다면 더 큰 의심을 살 뿐입니다."
10025010-141 = "탐문에 어려움이 있을지도 모르겠지만…… 일단은 계속해서 신분 은폐 상태를 유지합니다."
10025010-142 = "저는 선착장 근처에서 어부들을 상대로 탐문을 할 테니, 사키는 관공서에 들러 최근 이 마을에 사건 사고는 없었는지 확인해 주셨으면 합니다."
10025010-144 = "알겠어."
10025010-146 = "그리고 모에는 마을에 출입하는 수상한 사람들은 없었는지 CCTV 기록을. 미유는 그 외에 마을을 방문한 또 다른 외지인은 없는지 확인해 주셨으면 합니다."
10025010-148 = "아, 알겠어……!"
10025010-149 = "맡겨 달라고!"
10025010-151 = "그럼, 지체없이 바로 작전을 속행합니다!"
