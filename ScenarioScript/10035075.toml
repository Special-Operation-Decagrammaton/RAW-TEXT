[translation]
10035075-2 = "앗! 도망친다!"
10035075-8 = "물 속으로 들어가 버렸나……."
10035075-9 = "사장님, 추격해야 합니다. 저대로 둬서는 또다시 나타나 혼란을 불러일으킬 겁니다."
10035075-10 = "당연하지요! 지금 당장 실외 시설의 물을 빼겠습니다!"
10035075-11 = "숨을 곳이 없어지면 악어 녀석은 분명히 다시 모습을 드러낼 겁니다!"
10035075-12 = "그때 바로 공격해서 포획하는 겁니다!"
10035075-13 = "[s] \"협조 감사합니다.\""
10035075-14 = "아까는 죄송했습니다."
10035075-15 = "설마 진짜 악어가 있을 줄이야……대체 어디서 들어온 걸까요."
10035075-16 = "어쨌든 바로 수색 작업을 시작하겠습니다."
10035075-17 = "악어가 발견되면 우리 경비 병력으로도 상대할 수 있을 테니, 발키리 여러분은 이제 물러나셔도 됩니다."
10035075-18 = "함께 실내로 들어가시죠."
10035075-19 = "그건 듣던 중 반가운 소리인걸."
10035075-20 = "하지만 아직 위험이 사라진 건 아니잖아요?"
10035075-24 = "아니, 포획 작전은 파크 측에 맡겨두는 게 좋겠다."
10035075-25 = "네? 어째서요?"
10035075-26 = "현재 우리의 본분은 라이프가드."
10035075-27 = "메카 악어를 포획하는 것보다 이용객들의 안전을 지키는 게 우선이다."
10035075-28 = "그리고……내 생각엔, 이 사태의 주범도 지금 실내에 있거든."
10035075-30 = "주범?!"
10035075-31 = "역시 그렇지."
10035075-32 = "네? 그게 누군데요?"
10035075-33 = "[s] \"음, 역시 그 녀석인가.\""
10035075-34 = "보, 본관한테도 알려주세요!"
10035075-38 = "좋아, 이 정도면 나오겠지."
10035075-39 = "샅샅이 뒤져서 무조건 찾아내라!"
10035075-40 = "이제 막 개장한 워터파크 운영을 이렇게 말아먹을 순 없어!"
10035075-41 = "메카 악어든 뭐든 절대로 용납 못 한다……!"
10035075-42 = "사장님! 여기 좀 와 보셔야 할 것 같은데요!"
10035075-43 = "뭐야! 악어를 찾았나?"
10035075-47 = "그게 아니라, 여기 말입니다."
10035075-48 = "파크의 폐수를 바깥으로 내보내는 배수구로군. 어디 보자……."
10035075-49 = "이건?!"
10035075-50 = "네, 원래는 철망으로 막혀 있어야 하는데, 여기 이렇게 뚫려 있습니다!"
10035075-51 = "크기를 보니 아까 그 악어가 드나들기 충분한 크기입니다."
10035075-52 = "그렇군, 여기로 들어온 거였어!"
10035075-53 = "보아하니 나간 흔적은 아직 없군."
10035075-54 = "아직 녀석은 파크 안에 있다. 당장 찾아!"
10035075-56 = "네! 사장님!"
