[translation]
2003306-1 = "위대한 의장님의 일상"
2003306-3 = "키시싯. 지난번엔 선생에게 이 몸이 벌인 사업의 면면을 보여주었었지."
2003306-4 = "만마전의 독점 인쇄출판소 운영 사업…… 기념비적인 마코토 타워의 건설 사업…… 거기에 더해 이 마코토 님을 위시한 캐릭터 굿즈 사업이나 관광리조트 운영 사업 등등."
2003306-5 = "그 전부가 이곳 키보토스에서 우리 만마전의 영향력을 늘리고, 이 마코토 님의 위세를 드높이기 위한 것들."
2003306-6 = "시간도 어느덧 오래도록 지나…… 슬슬 그 모든 사업에서 가시적인 성과가 나올 타이밍이다."
2003306-7 = "크크크크큭! 그래! 이 하누마 마코토 님의 백년대계가 이룩해낸 성과가 곧 눈앞에 펼쳐지는 셈이다!"
2003306-8 = "어떤 결과물이 되었을지. 무척이나 기대되는군. 그렇지 않나. 선생?"
2003306-9 = "[s] \"……확실히 마코토의 말대로 결과가 나왔을지, 궁금하긴 해.\""
2003306-10 = "키키키킷! 역시나! 선생도 기대하고 있었나!"
2003306-11 = "하긴 그럴 수밖에!"
2003306-12 = "지금부터 펼쳐질 성과물을 보고 나면, 이제껏 이 몸의 매력적인 제안을 거부해 온 선생일지라도 끝내……."
2003306-13 = "<만마전과 옛날부터 협력해서 먼저 지분을 확보해 둘 걸! 미안! 마코토!>라고 후회를 할 테지만."
2003306-14 = "[s] \"아니. 아무리 그래도 거기까지는…….\""
2003306-15 = "걱정하지 말도록! 선생! 이 마코토 님의 아량은 넓다!"
2003306-16 = "그때 가서 후회하더라도, 내치지 않고 내 넓은 마음으로 선생을 받아줄 터이니 말이야. 키키키키킷!!"
2003306-17 = "[s] \"으응…….\""
2003306-18 = "자, 그럼 더 지체할 것도 없겠다. 지금 바로 사업장으로 이동을……."
2003306-26 = "의, 의장님……! 큰일입니다!"
2003306-27 = "응? 무슨 일이냐?"
2003306-29 = "그, 그것이…… 오늘부터 만마전 독점 출판인쇄소에서 발간 예정이었던 의장님의 자서전과 관련해 문제가 있다는 연락이……!"
2003306-30 = "[s] \"……자서전?\""
2003306-32 = "이야기는 들었다……! 이 몸의 자서전을 출간할 수가 없다고?!"
2003306-33 = "의, 의장님……!"
2003306-34 = "대체 무엇이 문제인 게냐!"
2003306-35 = "그간…… 이 몸이 수많은 역경을 뛰어넘으며 겪어온 드라마와 고뇌가 묻어나오는 개인사, 나아가 키보토스의 뭇 학생들에게 커다란 위안이 되어줄 조언 등을 담아낸 덕에──"
2003306-36 = "올해 키보토스 최고의 베스트셀러가 되는 것이 확정적이던 이 몸의 자서전 출간에 무슨 트러블이 발생한 게냐?!"
2003306-37 = "[s] \"마코토, 엄청난 물건을 출간할 예정이었구나……!\""
2003306-38 = "그. 그게 다름이 아니라………"
2003306-39 = "계산기를 때려보니…… 도저히 단가가 나오질 않습니다. 의장님!"
2003306-40 = "………단가?"
2003306-41 = "(그 후로 우리는 인쇄소 직원에게서 상황이 어떻게 된 것인지, 이야기를 들을 수가 있었다.)"
2003306-42 = "의장님께서 말씀하시길 <내가 만드는 자서전이라면 그 어느 것 하나 허투루 할 수 없다!> 고 말씀하신 만큼…… 책의 재질은 최고급 스노우펄 재질을 두툼하게 사용하고……."
2003306-43 = "표지도 A급 가죽 정장을 써서 제본하는 등, 많은 부분을 신경 써서 제작을 진행하였습니다만…… 그 결과……."
2003306-44 = "예산은 이미 진즉 바닥나버린 상황에다가…… 거기에 더해 이대로는 인쇄 비용이 천문학적으로 불어나 버려서 팔면 팔수록 마이너스가 찍히는 사태가 일어나 버렸습니다."
2003306-45 = "이대로는 자서전 출간 자체가 불투명한 상황이라고 할지………"
2003306-46 = "뭐…… 뭣이………!"
2003306-47 = "이 몸의 기념비적인 첫 자서전이니만큼…… 그저 최고의 책을 만들고자 했을 뿐인데……!"
2003306-48 = "[s] \"알아보지 않고 그냥 지른 거구나……….\""
2003306-49 = "아무래도 전면적인 재검토가 필요할 것 같습니다."
2003306-50 = "크…… 크읏, 크윽……!"
2003306-51 = "……하는 수 없지. 이 몸이 하는 사업이 전부 성공한다는 건, 처음부터 어려운 일이었을지도 모르겠어."
2003306-52 = "아쉽지만…… 그런 문제라면 어, 어쩔 수 없……"
2003306-58 = "의, 의장님! 큰일입니다!"
2003306-59 = "또……?!"
2003306-60 = "이번엔 무슨 일이냐!"
2003306-61 = "그게…… 마코토 타워가 완공되었다는 소식에 찾아가 보았습니다만, 전혀 예상치 못한 사태가 발생해 버려서……!"
2003306-63 = "뭐, 뭣이……?"
2003306-65 = "이, 이, 이……"
2003306-66 = "이게 뭐냐앗!"
2003306-67 = "이 건물이…… 완공된 마코토 타워라고?"
2003306-68 = "초고층 빌딩은……? 키보토스 어느 곳에서라도 관측되는…… 이 몸의 권위를 보여줄 건물은 어디로 가고……."
2003306-69 = "[s] \"어쩐지 빌딩이라기보단 창고 같은 느낌인데……\""
2003306-70 = "여기…… 건설 현장 담당자가 남긴 편지가 있습니다!"
2003306-71 = "뭐? 본인은 어디로 가고?"
2003306-72 = "아니지, 그보다 편지엔 뭐라고 쓰여있지?!"
2003306-73 = "어…… 그게…… 편지의 내용은……."
2003306-75 = "감히 그 누구도 범접할 자가 없는 우수한 카리스마 리더이며, 진정한 투자 감각을 지닌 마코토 의장님께."
2003306-76 = "의장님. 저희를 믿고 이렇게나 커다란 사업을 맡겨주셔서 감사합니다."
2003306-77 = "의장님의 의뢰에 따라, 사전에 약속한 대로 높이 400인치 크기의 마코토 타워를 완공하는 데 성공하였습니다."
2003306-78 = "계약을 완수한 건으로 찾아뵈어 인사를 나누는 것이 좋겠으나, 피치 못할 사정으로 먼저 떠나간 것을 부디 용서해 주십시오."
2003306-82 = "그럼 추후에 기회가 있다면 다시 만날 날을 기리며, 이만 총총입니다."
2003306-84 = "[ns] \"400인치……라는 건…… 설마.\""
2003306-85 = "계, 계약서다! 그리고 설계 도면을 가져오도록!"
2003306-86 = "넵!"
2003306-93 = "허, 허억!!"
2003306-94 = "지, 진짜로 설계 도면과 계약서에는 단위가 인치로 기록이……."
2003306-95 = "크읏…… 400이라는 숫자만 보고…… 드디어 이 몸의 대업이 이루어지나 싶어……. 그 외에 세세하고 사소한 내용 따윈 제쳐 두고, 내 큰 신뢰를 가지고 일을 맡겼거늘……!"
2003306-96 = "[s] \"아니, 제일 그냥 넘겨서는 안 될 부분 아니야……?!\""
2003306-97 = "감히…… 내 믿음을 이렇게 배신하다니!"
2003306-98 = "내가 이대로 가만히 있을 줄……!"
2003306-99 = "의, 의장님……! 크, 큰일입니다!"
2003306-100 = "으, 으응? 이, 이번엔 또 뭐냐?!"
2003306-102 = "그…… 의장님을 모델로 한 굿즈 사업체가 그대로 야반도주했다는 보고가……!"
2003306-106 = "그뿐만이 아닙니다! 만마전의 이름으로 진행한 리조트 지역에서 온천 수원이 발견되는 바람에 온천개발부가 난입했다는 보고가!"
2003306-110 = "게다가 거기에 더해, 저희가 진행 중인 관광사업 중에 이중계약이 되어있는 물건이 있단 소식이……! 때문에 상대 업체로부터 위약금을 물라는 요구가 들어와서……!"
2003306-114 = "아. 아아…… 아…… 으……"
2003306-115 = "큭!!"
2003306-120 = "[ns] \"마, 마코토………?! 괜찮아?!\""
2003306-122 = "의, 의장니이이임……!!!"
2003306-125 = "고작……!"
2003306-126 = "[s] \"아, 마, 마코토……?\""
2003306-127 = "고작 이 정도 문제들로……"
2003306-128 = "고작 이러한 역경들 때문에 이 마코토 님께서 충격을 받고 쓰러질 거라 생각했다면 오산이다아아앗!!"
2003306-130 = "마, 마코토 의장님~!!!"
2003306-132 = "후우…… 후우……! 지금부터 전 부원들에게 알리도록!"
2003306-133 = "우선 건설업체부터 시작해, 감히 주제도 모르고 우리 만마전의 뒤통수를 치고 배신한 업체들을 추적하라고 말이야!"
2003306-134 = "그 밖에도 동원할 수 있는 모든 수단을 동원해서……"
2003306-135 = "도망치거나 숨어들거나, 자취를 감춘 녀석들에 대해선 지옥 끝까지 찾아가서라도…… 이 몸을 우롱한 대가를 톡톡히 치르도록 해주마!"
2003306-136 = "……모두! 알겠나?"
2003306-138 = "네!!!"
2003306-142 = "[ns] \"………마코토는, 굉장하네.\""
2003306-143 = "응?"
2003306-144 = "아아. 지금까지 이런 일은 얼마든지 있어왔으니까 말이야."
2003306-145 = "키히힛. 이제는 익숙해진 일이다."
2003306-146 = "[s] \"대체 얼마나 자주 있었던 거야……?!\""
2003306-147 = "겨우 이 정도로 이 몸이 멈출 리가 없지!"
2003306-148 = "이 마코토 님이야말로 앞으로 게헨나를…… 나아가 키보토스를 전부 손에 넣을 몸!"
2003306-149 = "그때까지 고작 이 정도 일로 이 몸의 발걸음을 멈출까 보냐……!"
2003306-150 = "우선은 사기 업체부터 적발 및 처벌이다!"
2003306-151 = "[s] \"………응, 정말 마코토 다운걸. 나도 협력할게.\""
2003306-152 = "크크큭. 가능하다면 키보토스를 손에 넣는 일에 대해서도 도움을 받고 싶다마는."
2003306-153 = "[s] \"그건…… 일단 거절해 두겠습니다.\""
2003306-154 = "키키키킷. 뭐, 좋아. 여흥은 뒤로 미루도록 해둘까! 당장 눈앞에 닥친 일부터 해결하도록 하지!"
2003306-155 = "자, 그럼 이대로 복귀한다! 리무진을 준비……!"
2003306-156 = "앗, 의장님. 그게…… 죄송합니다만. 이번 사태로 인해 리무진 리스 비용의 대납이 연체되었다고, 리무진도 방금 계약 업체에 회수를 당한 참이라……."
2003306-157 = "……………………."
2003306-158 = "그…… 선생이여, 괜찮다면 교통비를 조금, 융통을……"
2003306-159 = "[s] \"으, 응. 빌려줄게……….\""
2003306-160 = "크크크큭. 이 은혜는! 잊지 않도록 하지!"
2003306-161 = "자! 다들! 만마전의 출진이다!"
2003306-163 = "넵!!"
2003306-165 = "(그 후, 마코토와 함께 힘을 합쳐, 무사히 여러 가지 트러블을 해결해 나갔다.)"
