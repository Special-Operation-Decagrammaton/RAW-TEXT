[translation]
2600006-1 = "예상치 못한 상황"
2600006-4 = "오셨군요. 선생님. 응해 주셔서 감사합니다."
2600006-5 = "솔직히 이렇게 빨리 와 주실 줄은 몰랐는데……"
2600006-6 = "덕분에 일이 많이 수월해질 것 같습니다."
2600006-7 = "아, 서류들은 여기 없습니다."
2600006-8 = "손도 많이 가고 주변이 어지러워지는 작업이라, 여기서는 하지 않거든요."
2600006-12 = "네. 이쪽으로……"
2600006-24 = "(휴게실 안은 단정하게 정리돼 있었지만, 부분부분 미처 치우지 못한 것들이 보였다.)"
2600006-25 = "(너저분하다기보단, 생활감이 느껴지는 쪽의 분위기였다.)"
2600006-29 = "으음…… 지금 다시 생각해 보니, 누추한 곳에 선생님을 모시게 되는 일이었군요."
2600006-30 = "다른 장소를 잡는 게 나았을 것 같습니다. 죄송합니다……"
2600006-31 = "[s1] \"괜찮아. 샬레도 비슷한 걸.\"\n[s2] \"뭔가 개인적인 용품들이 많은데?\""
2600006-32 = "하하…… 이해해 주셔서 감사합니다."
2600006-33 = "아아. 네. 맞습니다."
2600006-34 = "아무래도 선도부 내에서는, 이런 단순 서류작업을 같이 해 줄 사람이 없다 보니……"
2600006-35 = "자연스레 이곳을 사용하는 건 저 한 사람처럼 돼 버려서요."
2600006-36 = "일이 많거나 대기해야 할 때에는 숙직실 대용으로도 사용하고 있습니다."
2600006-40 = "이 접이식 침대도 그 일환인 거고요."
2600006-41 = "……네? 샬레에도 비슷한 게 있다고요?"
2600006-42 = "그, 그렇군요. 아하하…… 피차 고생이네요."
2600006-43 = "그럼 곧바로, 서류들은 여기……"
2600006-50 = "(쿠웅-!)"
2600006-54 = "[ns3] \"이걸 다 혼자서 한다고?\"\n[ns4] \"몇 년치 서류인가요?\""
2600006-55 = "네? 그야…… 네."
2600006-56 = "보통 밀린 걸 정리한다고 하면 이 정도는 되지 않나요? 샬레에선 다른가요?"
2600006-57 = "몇 년……?"
2600006-58 = "아뇨. 저번 주 일주일 간의 서류들입니다만……"
2600006-59 = "결재 자체는 선도부장님께서 다 해 주셨기 때문에, 저희는 분류 정리만 하면 되거든요."
2600006-60 = "아무래도 달리 부탁드릴 사람이 없다 보니…… 역시 실례였을까요?"
2600006-61 = "[s5] \"언제든 부탁해도 좋아.\"\n[s6] \"이런 건 또 제가 전문이죠.\""
2600006-62 = "으음. ……역시 그렇게 대답해 주시는군요."
2600006-63 = "으음. ……역시 그렇게 대답해 주시는군요."
2600006-64 = "사실 내심 선생님이라면 이렇게 흔쾌히 수락해 주실 거라고 기대하긴 했지만……"
2600006-65 = "어쩐지 그렇게 기대한 것 자체가 죄송스럽기도 하네요."
2600006-66 = "그치만 지금은 상황이 상황이다 보니, 어쩔 수 없이……"
2600006-67 = "그럼 염치 불고하고, 잘 부탁드리겠습니다. 선생님."
2600006-69 = "(서류들의 양은 딴청을 피울 수 있는 수준이 아니었기에, 곧바로 분류작업에 들어갔다.)"
2600006-70 = "(그렇게 두 사람이서 분류만 하는 것이었음에도 반나절 이상의 시간이 소비되었다.)"
2600006-75 = "……후우……"
2600006-76 = "이걸로 일단은 마지막인 것 같네요. 벌써 이렇게 늦은 밤이라니……"
2600006-77 = "네? 오래 걸렸다고요?"
2600006-78 = "아뇨. 결코 그렇지 않습니다."
2600006-79 = "저 혼자였다면 절대 오늘 안에 끝낼 수 없었을 거예요. 역시 선생님이세요."
2600006-80 = "……네?"
2600006-81 = "벽지요……? 아, 이쪽 벽지랑 포스터요?"
2600006-82 = "그, 그건 그냥 개인적인…… 물건들입니다만…… 왜, 왜 그러시죠?"
2600006-83 = "혹시 이상한가요……?"
2600006-84 = "아, 아니라고요?"
2600006-85 = "후우…… 다행이네요. 혹시나 했습니다."
2600006-86 = "아까도 말씀드렸듯, 이 휴게실은 사실상 제 개인 방이나 다름없는……"
2600006-87 = "공간이 돼 버려서……"
2600006-91 = "……?"
2600006-92 = "[s] \"……?\""
2600006-93 = "개인 방……이나 다름없는……?"
2600006-94 = "이렇게 늦은 시간에……?"
2600006-95 = "개인 방이나 다름없는 여기서……?"
2600006-96 = "……선생님과……?"
2600006-97 = "[s] \"……??????\""
2600006-98 = "……어, 어어…… 어……?"
2600006-99 = "……!!"
2600006-102 = "[wa:500]― 벼, [wa:950]별로 [wa:750]의식하지는 못했습니다만……."
2600006-105 = "― 이 상황은 [wa:1250]그,"
2600006-107 = "― 그다지 [wa:700]좋지 않다고 할까……."
2600006-110 = "[wa:1450]― 저기, [wa:1000]선생님……?"
2600006-112 = "― 그……. [wa:1200]뭐라도 말씀해주시지 않으면, [wa:1950]저기……."
2600006-115 = "[wa:200]― 계속 [wa:500]말씀이 없으시면"
2600006-117 = "― 오히려 이상한 기분이……."
2600006-120 = "[wa:350]― 아니, [wa:600]그 [wa:550]재촉하는 건 아니지만……!"
2600006-122 = "― 그게, [wa:1350]뭐라고 말씀드려야 할지……."
2600006-125 = "― 이럴 때는, [wa:1150]어떻게 해야……."
2600006-128 = "[ns] \"……치나츠? 괜찮아? 얼굴이 빨간데, 열이라도……?\""
2600006-129 = "[wa:250]― ……후우."
2600006-131 = "― ……아니. [wa:1400]괜찮습니다. [wa:1500]네."
2600006-134 = "― 후후, [wa:1100]정말 [wa:1300]곤란해졌네요……"
2600006-136 = "[wa:100]― 뭘까요, [wa:1600]이건."
2600006-139 = "[wa:1500]― 선생님과 함께 [wa:700]있다는 것만으로도,"
2600006-141 = "― 뭔가 [wa:550]평소처럼 있기가 어려워서…."
2600006-144 = "― 정말, [wa:1400]곤란합니다……"
2600006-146 = "― 여러 가지로……"
2600006-149 = "죄, 죄송합니다. 선생님."
2600006-150 = "먼저 부탁드려서 모셔 둔 주제에 혼자 안절부절 못 하고 있는 상황이라니……"
2600006-151 = "그, 그…… 저, 저에게는 흔치 않은 상황이다 보니 저도 모르게 그만……"
2600006-152 = "……네?"
2600006-153 = "아, 아아…… 괜찮으시다고요?"
2600006-154 = "감사합니다…… 그래도 조금 안심이 되네요……"
2600006-158 = "……"
2600006-159 = "[s] \"……치나츠?\""
2600006-163 = "으음…… 아, 아닙니다. 아무 것도……"
2600006-164 = "그, 그렇군요."
2600006-165 = "네…… 역시 그렇겠죠. 네……"
2600006-167 = "역시나 저만……이로군요."
