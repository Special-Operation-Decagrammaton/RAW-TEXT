[translation]
1003106-1 = "새해 운세 확인"
1003106-2 = "후후. 새해 하면 오미쿠지, 오미쿠지 하면 새해야. 선생님."
1003106-3 = "[s] \"그런가?\""
1003106-4 = "새해에 운세가 좋기를 바라는 마음은 누구나 다 같잖아?"
1003106-5 = "물론 당연한 이야기겠지만."
1003106-6 = "오미쿠지에서 어떤 운세를 뽑는다 한들, 그걸로 정말 한해 운세가 결정되리라 생각하는 건 아니지만."
1003106-7 = "그래도 사장으로서, 한 조직의 리더로서 이런 이벤트를 통해, 가볍게 올 한해 운세를 확인해 보는 것도 나름의 운치가 있다고 생각해."
1003106-8 = "새해의 풍물시란 거지."
1003106-9 = "[s] \"그런……가?\""
1003106-10 = "에잇, 잔말 말고. 자, 같이 뽑으러 가자."
1003106-11 = "혹시 모르잖아? 오미쿠지에서 1등을 뽑을지도."
1003106-12 = "응, 나라면 충분히 가능해~♪"
1003106-13 = "[s] \"오미쿠지가 그런 시스템이었나?\""
1003106-17 = "아, 여기 있다."
1003106-18 = "대충 이 통을 흔들어서 나온 봉에 쓰인 숫자를 확인한 뒤…… 그 숫자가 쓰인 서랍을 열어 운세를 체크하면 된다. 라는 거네."
1003106-19 = "1회에 100엔이라."
1003106-20 = "그럼 나 먼저 해볼게."
1003106-27 = "아, 나왔다. 번호는 45번……"
1003106-29 = "서랍은……. 여기 있다."
1003106-33 = "운세는……."
1003106-34 = "소흉……?"
1003106-35 = "'장사, 흔들릴 일이 있으므로 주의', '매매가 나쁘다', '동료와 불화가 생길 수 있음.'… 이라니……."
1003106-36 = "[s] \"별로 좋은 건 아니네.\""
1003106-37 = "으음, 뭐어, 딱히 믿는 건 아니지만 말이야."
1003106-38 = "결국 이런 건 그…… 바넘 효과인 거잖아?"
1003106-39 = "그럴듯한 말을 늘어놓아서 자기도 모르게 사정을 끼워 맞추게 만드는……."
1003106-40 = "[s] \"그럼 운세도 뽑았겠다. 묶으러 갈래?\""
1003106-44 = "[ns] \"아루?\""
1003106-45 = "안 되겠어. 선생님. 이대로 포기하는 건 지는 거 같잖아?"
1003106-46 = "한 번만 더 뽑을래. 100엔 정도면 뭐, 상관없으니까."
1003106-53 = "이번 번호는 87번……."
1003106-57 = "운세 내용은……"
1003106-61 = "흉……?"
1003106-62 = "'공들여 만든 일이 성사될 시기가 오지 않았다. 느긋하게 기다려라.', '다툼이 생길 수 있으니 몸조심하라.', '사업, 이룰 수 없다.'"
1003106-66 = "[ns] \"아루 쨩?\""
1003106-67 = "후훗."
1003106-68 = "후후훗. 좋아. 그 도전, 받아주겠어."
1003106-69 = "죽어라고 악담을 하는데. 누가 포기할 줄 알고?!"
1003106-70 = "[s] \"이건 대결이 아니야. 아루 쨩!\""
1003106-71 = "아니, 선생님! 이건 대결이야! 이 오미쿠지와 나의 대결!"
1003106-72 = "내 흥신소가 망하라고 고사를 지내는 이 녀석의 콧대를 눌러주겠어!"
1003106-79 = "다음 운세는! 48번!"
1003106-80 = "내용은?!"
1003106-82 = "반흉?!"
1003106-83 = "'사업, 유감'?!"
1003106-84 = "좋아. 다음이야!"
1003106-91 = "……말흉!"
1003106-100 = "대, 흉?!"
1003106-105 = "……!"
1003106-110 = "……?"
1003106-115 = "……!!!"
1003106-117 = "하아……. 하아……."
1003106-118 = "[s1] \"이제까지 나온 게 전부 흉이라니, 굉장해.\"\n[s2] \"흉의 종류가 이렇게 많은 줄 몰랐어.\""
1003106-119 = "크윽! 나, 난 포기하지 않아……!"
1003106-120 = "크윽! 나, 난 포기하지 않아……!"
1003106-121 = "이, 이걸로 내가 가진 마지막 100엔…이야……!"
1003106-128 = "번호는 1번……!"
1003106-132 = "내용은……!"
1003106-137 = "…………'흉이지만 한없이 흉이 아닌 흉'?"
1003106-138 = "이, 이, 이게 뭐야?! 하나쯤은 흉이 아니어도 되잖아!"
1003106-139 = "영험하다는 소문은 다 뭐였던 거야? 물론 하나도 안 믿지만……!"
1003106-140 = "[s] \"그럼 이번엔 내 차례네.\""
1003106-149 = "[ns] \"앗, 대길이다.\""
1003106-150 = "뭐어?!"
1003106-151 = "잠깐 줘봐! 선생님! 내용이 뭐야?!"
1003106-155 = "'멋진 만남이 있다. 특히 바로 곁에 있는 사람을 소중히 대해줄 것.'"
1003106-156 = "바로 곁에, 있는 사람……?"
1003106-157 = "[s] \"그렇대.\""
1003106-161 = "후후, 후후훗."
1003106-162 = "과연!"
1003106-163 = "흐응~! 그렇구나!"
1003106-164 = "영험한 곳이네……! 응. 납득했어!"
1003106-165 = "[s] \"납득했구나…….\""
1003106-166 = "뭐, 뭐 어때서! 끝이 좋으면 다 좋은 거니까. 좋은 결과가 나왔으니 됐잖아?"
1003106-170 = "자, 선생님. 뽑은 이 운세들, 전부 묶으러 가자!"
1003106-171 = "근데…… 이 많은 걸 언제 다 묶지……?"
1003106-172 = "[s] \"도와줄게.\""
1003106-173 = "으, 읏. 그, 그렇네."
1003106-174 = "운세에도 쓰여 있었지. 곁에 있는 사람을 소중히 대해줄 것……이라고."
1003106-175 = "후후훗, 운세에 쓰인 이야기대로 그럼……"
1003106-181 = "올해도 잘 부탁해. 선생님♪"
