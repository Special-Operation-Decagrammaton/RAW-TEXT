10005040-196 = "침입자!? 침입자라니!?"
10005040-197 = "여기, 여기 이 녀석들 전부 가짜 가드야! 이 녀석도, 저 녀석도!"
10005040-198 = "전부 가짜 가드들이라고! 다 잡아넣어!!"
