[translation]
10005040-1 = "제4화;결국 하던 대로"
10005040-2 = "플레이 라운지 후문 쪽 복도"
10005040-5 = "……클리어. 이상 없습니다."
10005040-6 = "이쪽도 딱히 쳐다보는 녀석들은 없다."
10005040-7 = "뒤쪽은?"
10005040-9 = "없다. 딱히 의심은 사지 않고 도착한 것 같군."
10005040-10 = "그나저나 미안하다. 내가 심문을 도중에 잘 멈추기만 했어도……."
10005040-11 = "신경 쓰지 마세요. 카린. 실수는 저도 했으니까요."
10005040-12 = "게다가 기절한 상태이긴 했지만, 가드 분이 중얼거리는 말로 단서 자체는 들었잖아요?"
10005040-13 = "기절한 채로도 \"플레이 라운지\"라는 말을 계속해서 중얼거렸지."
10005040-14 = "어쩌면 중간부터 계속 그 말을 하고 있던 것일 수도 있다. 입을 막아 둬서 못 들었을 뿐……."
10005040-15 = "……그런데 플레이 라운지라는 건 대체 뭐지?"
10005040-16 = "……? 뭐긴 뭐야? 중앙에 있는 큰 방 이름이라며? 안내도에도 그렇게 적혀 있잖아."
10005040-17 = "아니, 내 말은 그 뜻이 아니라……."
10005040-18 = "그 공간이 어떤 목적의 공간인지 상상이 가지 않는다. 그런 의미이시겠지요."
10005040-19 = "실은 저도 크게 감이 잘 오지 않아서……. 플레이 라운지라니, 대체 뭘 한다는 걸까요?"
10005040-20 = "백토가 발행했다는 채권들과도 관련이 있는 걸까요?"
10005040-21 = "선생님께서는……. 짐작 가는 바가 있으신가요?"
10005040-22 = "[s1] \"글쎄…….\"\n[s2] \"이름대로라면 '노는 곳'이라는 말인데.\""
10005040-24 = "역시 짐작 가는 게 없으시려나요……."
10005040-26 = "노는 곳……?"
10005040-28 = "크하하! 아무려면 어때? 그냥 좋게 생각해! 결국 평소 방식으로 돌아왔으니까."
10005040-29 = "거기서 녀석이 무슨 짓을 하든 알 게 뭐야!? 그냥 가서, 그냥 두들겨 패고, 그냥 데려온다!"
10005040-30 = "우리는 원래부터 이런 스타일이었다고. 안 그래?"
10005040-31 = "으음. 지금 상황에서 그게 좋은 거라고 동의하긴 어렵지만……."
10005040-32 = "그렇지만……. 그렇죠. 플랜B인 지금 상황에선 그래도 이게 최선이겠죠."
10005040-33 = "하지만 부장님도 기억은 해 주세요. 저희의 목표는 어디까지나 백토입니다."
10005040-34 = "<플레이 라운지>에 들어가면 흩어져서 백토를 찾고, 찾자마자 서로에게 연락합니다."
10005040-35 = "곧바로 제압한 뒤에는 가드들이 대처할 틈을 주지 않고 빠져나갈 거예요."
10005040-36 = "일을 키우지 않기 위해서, 사용해도 되는 건 파괴력이 없는 연막탄과 섬광탄뿐입니다."
10005040-37 = "저 안이 어떤 곳이든……. 저기서 가드들과 싸워서는 안 돼요. 아시겠죠?"
10005040-38 = "으윽……. 또 그런 쓸데없는 조건들을……."
10005040-39 = "[s3] \"어렵겠지만 잘 부탁해, 네루.\"\n[s4] \"네루라면 할 수 있을 거야.\""
10005040-43 = "……."
10005040-44 = "……시, 시끄러워! 그런 식으로 아부하는 거 싫어한다고."
10005040-45 = "물론 그 정도야 당연히 할 수 있지. 날 누구라고 생각하는 거야?"
10005040-46 = "딱 보라고. 소리 없는 뒤통수 한 방으로 쥐도 새도 모르게 데려올 테니까."
10005040-47 = "동의한다. 여기서 더 시간을 끌고 있어 봐야 좋을 게 없어. 바로 시작하지."
10005040-48 = "좋아. 선생은 날 따라와. 무슨 일이 있으면, 내가 지켜줄 테니까. 알았지?"
10005040-49 = "……그럼 시작이다!"
10005040-51 = "플레이 라운지"
10005040-53 = "……흠……."
10005040-54 = "여기가 바로 그 <플레이 라운지>인가 뭔가 하는 곳인가?"
10005040-55 = "뭐지……? 겉보기에는 그냥 좀 요란한 오락실 정도로밖에는 안 보이는……."
10005040-60 = "환영합니다, 여러분! 보아하니 처음 오신 이용객분들이신 것 같군요!"
10005040-61 = "……앙? 뭐야?"
10005040-62 = "반갑습니다. 저는 이곳 플레이 라운지의 안내를 맡은 <라운지 가이드>라고 합니다!"
10005040-63 = "이용객분들에게 이곳의 이용법과 규칙을 설명해 드리는 일을 맡고 있어요."
10005040-64 = "저희 골든 플리스호의 모든 서비스가 뽑기를 통한 재화로 교환된다는 사실은 알고 계시죠?"
10005040-65 = "……뭐? 뽑기……?"
10005040-66 = "음? 어……. 모르셨나요……?"
10005040-67 = "이 배의 모든 재화……. 숙식과 놀이시설, 화장실까지 모두 뽑기의 교환권으로 서비스 품질의 등급이 결정됩니다."
10005040-68 = "뽑기는 D부터 S등급까지 있고, 일반적으로 A가 되면 선내의 모든 최상의 서비스를 이용하실 수 있어요!"
10005040-69 = "[s5] \"그럼 S는…….\"\n[s6] \"아주 특별한 것인가요?\""
10005040-70 = "후후. 잘 물어보셨습니다. 그렇지요. S 뽑기는 그야말로 환상과도 같은 것!"
10005040-71 = "후후. 잘 물어보셨습니다. 그렇지요. S 뽑기는 그야말로 환상과도 같은 것!"
10005040-72 = "이곳 골든 플리스호에서 그것은 가히 초법적인……."
10005040-73 = "끄아아아아아악~!!!!"
10005040-74 = "……?"
10005040-80 = "아~. 진짜아~. 또 망했어~! 또 C야! 맨날 나만 이래!"
10005040-81 = "나도야. 오늘 한 번도 제대로 뜬 적이 없다고. 방금 하나 뜬 B가 전부고……."
10005040-82 = "넌 그래도 B하나 떴네! 난 전부 C라고! C등급이면 카레에 가라아게도 안 주잖아!?"
10005040-83 = "……어이, A급 이용객. A급은 뭐가 좋아? 우리보다 훨씬 더 뭐 많이 주겠지?"
10005040-84 = "뭐, 그야 그렇지. 그래도 S 등급에 비하면 별거 아냐."
10005040-85 = "듣자 하니 S 등급으로 교환한 <VIP권>만 있으면 이 배의 법도 무시한다던데……."
10005040-86 = "법을 무시해……? 그럴 수가 있어?"
10005040-88 = "C등급 이용객님, B를 뽑으셨군요! 진급 축하드립니다!! 빰빠밤-!"
10005040-89 = "다른 분들도 모두 행운을 빌어요~! 파이팅!!"
10005040-91 = "……뭐하는 짓이지?"
10005040-92 = "뭔가 커다란 모니터에 사람 얼굴이 크게 뜨고 있는데? ……축하해주는 건가?"
10005040-93 = "[s7] \"좋은 걸 뽑았으니 축하해주는 모양이야.\"\n[s8] \"뽑기 등급으로 모든 게 결정되는 곳이라…….\""
10005040-94 = "하. 어쩐지 다들 게임에 정신이 팔려서 주변은 보지도 않는다 했더니……."
10005040-95 = "하. 어쩐지 다들 게임에 정신이 팔려서 주변은 보지도 않는다 했더니……."
10005040-96 = "선생, 이거 괜찮은 거야? 이 녀석들. 이러다가 학교도 제대로 안 가고 그럴 거 같은데?"
10005040-97 = "……뭐?"
10005040-98 = "내가 그런 걸 다 신경 쓰냐고……?"
10005040-99 = "무, 무슨 소리야! 나라고 지각은 해도 결석까진 안 한다고! 사람을 뭐로 보고……!"
10005040-100 = "흠흠. 아무튼 중요한 건 그게 아니지."
10005040-101 = "……확실히 녀석이 있을 것 같은 장소긴 하네."
10005040-102 = "사방이 시끄럽고 사람 말도 잘 안 들리고, 요란해서 눈 둘 곳도 찾기 어려운 곳이잖아?"
10005040-103 = "일하기 싫어하고, 선배들한테서 도망치고 싶어 하는, 철딱서니 없는 놈이 숨어들기 딱 좋은 곳이지."
10005040-105 = "……음……."
10005040-106 = "그렇지만 아무리 봐도, 뭔가 작당 모의를 할 만한 곳으로는 안 보이는데……."
10005040-107 = "진짜 녀석이 여기 있는 거라면, 대체 이런 데에서 뭘 하는……?"
10005040-111 = "[ns9] \"……네루?\"\n[ns10] \"갑자기 무슨 일이야?\""
10005040-112 = "……찾았다."
10005040-113 = "……찾았다."
10005040-114 = "저기, 저 녀석……. 선생도 보여? 저쪽 기계 앞에 앉아 있는 녀석."
10005040-118 = "니하-! 이거지, 이거! 아. 오늘은 운이 좋구만~."
10005040-119 = "이제 여기서 끝내고……."
10005040-120 = "……? 아냐. 이 기세라면……. 한 번만 더 기세를 탄다면……?"
10005040-124 = "좋아. 간다!! 달려, 코유키!! 너의 흐름을 믿는 거야! 전설의 S가 코앞이라고!"
10005040-129 = "엑……. B……? B라고……? 쓸모없잖아!"
10005040-130 = "에에에엑-!! 말도 안 돼!! 방금 얼마를 부었는데!! 이제 슬슬 S가 나와야지!"
10005040-131 = "대체 언제 VIP를 달아 볼 수 있는 거냐고! 난 인정 못 해, 절대 인정 못 해!!"
10005040-136 = "이봐요! 멈추세요! 한 번만 더 기계를 때리면 뽑기 금지입니다!!"
10005040-137 = "……헉."
10005040-138 = "죄, 죄송합니다……."
10005040-144 = "[ns11] \"……저 친구가 백토?\"\n[ns12] \"이렇게 싱겁게 발견?\""
10005040-145 = "……하……. 그래. 유감스럽지만 맞아."
10005040-146 = "……하……. 그래. 유감스럽지만 맞아."
10005040-147 = "저기 정신 팔려서 우리 존재도 눈치 못 채고 있는 저 녀석이 바로 그 백토야."
10005040-148 = "……참, 나. 뽑은 채권으로 뭐 하고 있나 했더니……."
10005040-149 = "설마 저 뽑기인가 뭔가 하는 걸 하고 있었던 건가? 진짜로……?"
10005040-150 = "진짜 겨우 그런 짓을 하는 녀석을 잡으러 우리가 여기까지……!!"
10005040-151 = "[s13] \"차라리 다행이라고 생각하자.\"\n[s14] \"정말 기분 대로 사는 친구구나.\""
10005040-152 = "……하아."
10005040-153 = "……하아."
10005040-154 = "그래, 뭐. 세미나 회계 말처럼 작당 모의를 하고 있었다는 것보단 나을지도 모르지."
10005040-155 = "……사실 난 그쪽이 좀 더 취향이었겠지만."
10005040-159 = "……아, 아. 여기는 네루. 백토를 찾았다. 위치를 공지할 테니 모이도록."
10005040-160 = "알겠습니다. 찾아가겠습니다."
10005040-161 = "알았다. 지금 출발한다."
10005040-165 = "어이가 없을 정도로 수월해져 버렸군."
10005040-166 = "뭐, 짧은 시간이었지만 선생도 수고했어. 도움도 많이 됐고."
10005040-167 = "이제 일은 다 끝났다고 봐도 되겠네. 저렇게 정신이 팔려 있어서야 들킬 염려는 없다고 봐야지."
10005040-168 = "우리가 대놓고 얼굴을 들이밀어 보여주지 않는 이상……."
10005040-175 = "와! 아스나 님! 10회 뽑기에서 한 번에 A랭크 획득!"
10005040-176 = "축하합니다! 이대로 기세를 타서 S! VIP권까지 달려 보자고요~!"
10005040-177 = "그래. 저렇게 대놓고 전광판으로 얼굴이라도 보여주지 않는 바에야……."
10005040-181 = "……앙?"
10005040-182 = "[s15] \"아스나……?\"\n[s16] \"전광판에 얼굴이 나타났는데?\""
10005040-183 = "뭐, 뭐야? 왜 아스나가 저기에……."
10005040-184 = "뭐, 뭐야? 왜 아스나가 저기에……."
10005040-185 = "뭐, 뭐!? 뭐야!? 저거 아스나 선배잖아……!!"
