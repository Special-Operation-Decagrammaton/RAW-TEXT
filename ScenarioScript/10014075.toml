[translation]
10014075-2 = "하아, 하아……. 헉, 헉……. 헉……."
10014075-3 = "그, 그만……. 그만 뛰어……. 여기까지……."
10014075-9 = "이, 이만하면 괜찮지 않을까……? 이미 트리니티 자치구 안까지 오기도 했고……."
10014075-10 = "그런데 굳이……. 이렇게 도망쳐 올 필요가 있었어? 거의 다 이긴 거였잖아……?"
10014075-11 = "아니. 그 이상 시간을 끌면 진짜 위험해. 슬슬 발키리든 뭐든 어느 쪽 참새라도 도착할 타이밍이었으니까."
10014075-12 = "그 자리에 있었으면 전부 다 한꺼번에 잡혀 갔을 거야. 지금쯤 다들 잡히고 있겠지."
10014075-13 = "그, 그래? 그렇군……."
10014075-17 = "……근데 참새가 뭐야?"
10014075-21 = "……아."
10014075-22 = "[s1] \"여기서 또 전문용어가…….\"\n[s2] \"아마도 발키리 경찰학교를 말하는 걸 거야.\""
10014075-23 = "아, 아아. 경찰학교 학생들……. 선생님도 어떻게 그런 걸 알고 있네."
10014075-24 = "아, 아아. 경찰학교 학생들……. 선생님도 어떻게 그런 걸 알고 있네."
10014075-29 = "그렇게 카스팔루그의 부활을 막고자 했던 무리들은, 오히려 결과적으로 모두 소탕돼 버리고 만 것이다."
10014075-30 = "아아. 결국, 세상은 마수의 부활을 막지 못하고 다시 어둠의 시대로……."
10014075-37 = "그만하라고! 어!?"
10014075-39 = "그만!"
10014075-41 = "좀!"
10014075-43 = "하라고!"
10014075-45 = "했잖아! 어!?"
10014075-47 = "사람이! 어!?"
10014075-49 = "말을 하면! 좀! 어!?"
10014075-51 = "아, 아아! 아아아!! 이, 이것이……!"
10014075-53 = "아하하하……."
10014075-54 = "……크큭."
10014075-55 = "[s3] \"행복해 보이네, 요시미.\"\n[s4] \"요 근래 최고의 웃음이야.\""
10014075-56 = "……아아, 물론이야."
10014075-57 = "……아아, 물론이야."
10014075-58 = "지금 최고로 즐거우니까……. 즐기게 내버려 둬."
10014075-60 = "……그나저나, 그럼 이 친구는 어떻게 할 거야?"
10014075-61 = "이 친구……? 이 친구라니……."
10014075-67 = "그러고 보니……. 벽을 터뜨리고 들어갔을 때부터 이미 기절해 있었죠……."
10014075-68 = "음. 싸우는 건 커녕 우리 얼굴조차 전혀 못 봤겠네."
10014075-69 = "그래도 다행히 다쳤다거나……. 딱히 그런 곳은 없는 거 같아요!"
10014075-74 = "……음. 그럼 신경 쓸 거 없어. 뭐, 이건 대충 여기 벤치에 눕혀 놓으면 되니까."
10014075-81 = "으, 으응!? 카, 카즈사 쨩!?"
10014075-82 = "야, 야……. 아무리 그래도 그렇지. 기절한 사람을 그냥 벤치에……."
10014075-84 = "……? 어, 아냐. 내 말 믿어. 이 녀석 진짜 괜찮으니까."
10014075-85 = "알고서 하는 말이니까 말이야. 이런 거 한두 번 본 것도 아니거든. 애초에 이 녀석, 벤치에서 자는 거 좋아하기도 하고."
10014075-86 = "과연……. 악연에서 쌓인 이해와 신뢰인가."
10014075-88 = "……로망이네."
10014075-89 = "[s5] \"……응. 확실히.\"\n[s6] \"이번만큼은 나츠 말이 맞을지도.\""
10014075-90 = "시끄러워, 좀!! 로망은 무슨 얼어 죽을 로망……."
10014075-91 = "시끄러워, 좀!! 로망은 무슨 얼어 죽을 로망……."
10014075-95 = "……음……."
10014075-99 = "……? 뭐 해?"
10014075-100 = "카즈사 쨩? 그건……. 도전장? 다시 레이사 쨩에게 돌려주는 거야?"
10014075-101 = "뭐, 뭐……. 나한테는 있어 봐야 쓸모도 없으니까. 주인 돌려주는 거지. 그저 그것뿐."
10014075-103 = "과연. 츤데레라는 거군."
10014075-104 = "진짜 하지 말라고 했다."
10014075-105 = "하아, 진짜 피곤해……. 도대체 왜 내가 이런 일을……."
10014075-110 = "참 시계 성능도 좋으시네요."
10014075-111 = "다들 밤새 잠도 못 자고 고생했으니까……."
10014075-112 = "음. 당분 보급이 필요한 타이밍이긴 하지."
10014075-113 = "[s7] \"그럼 일단 뭐라도 먹으러 갈까.\"\n[s8] \"오늘은 선생님이 쏘도록 하지.\""
10014075-120 = "……응!!"
