[translation]
83306050100-7 = "음……?"
83306050100-13 = "이런 곳에 수첩이…… 꽤 낡은 물건이네."
83306050100-14 = "적혀 있는 내용은……"
83306050100-17 = "마침내 이곳에 나만의 피아노실을 마련했다."
83306050100-18 = "나의 장래 희망은 게헨나, 아니 키보토스에서 제일 가는 작곡가이자 피아니스트가 되는 것……"
83306050100-23 = "그 꿈을 이루기 위해…… 오늘부터 열심히 연습해야지."
83306050100-24 = "오늘부터 매일 빠짐없이 연습의 성과를 여기에 기록해 두도록 하자. 미래의 나를 위해서."
83306050100-31 = "……이곳을 원래 쓰던 주인이 남긴 물건, 이구나."
83306050100-32 = "분명, 그때엔 먼지가 쌓여있을 일은 없었겠지. 이 피아노도, 수첩도……."
83306050100-33 = "피아니스트가 되는 꿈, 이라……"
83306050100-34 = "이 사람은, 지금 어떻게 지내고 있을까."
83306050100-35 = "…………."
