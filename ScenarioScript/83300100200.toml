[translation]
83300100200-6 = "혹한기 훈련 고생하셨습니다. 부장님."
83300100200-7 = "아니, 아코야말로 고생했어."
83300100200-8 = "만마전의 갑작스러운 개입 때문에 훈련량이 작년보다 200% 더 늘어나 버렸지만."
83300100200-9 = "그래도 다들 노력해 준 덕분에 무사히 끝낼 수 있었네."
83300100200-10 = "정말이라니까요. 이 정도로 했으면 제아무리 만마전이라 해도 당분간은 얌전하겠죠."
83300100200-17 = "……음? 어쩐지, 분위기가 소란스러운걸."
83300100200-18 = "그러게요…… 무슨 일이라도 있는 걸까요?"
83300100200-19 = "……이제 막 복귀한 참이라, 조금쯤은 쉬고 싶은 기분이지만."
83300100200-20 = "아코, 잠시 주변을 둘러보고 올게."
83300100200-26 = "앗, 네……! 그럼 저도 주변을 탐문해보겠습니다!"
