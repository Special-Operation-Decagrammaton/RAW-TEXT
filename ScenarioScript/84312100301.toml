[translation]
84312100301-6 = "원래도 그랬지만, 이번에는 특히나 누군가 우릴 도와주고 있다는 느낌이 들어!"
84312100301-7 = "도와주다니…… 선생님 이야기야?"
84312100301-8 = "게다가 원래도 그랬다니, 누군가 밀레니엄을 감시라도 하고 있다는 거야?"
84312100301-9 = "아니! 선생님 이야기 아닌데? 그리고 감시라기 보다는…… 좀 더 좋은 느낌?"
84312100301-11 = "(……!!)"
84312100301-13 = "……? 선배. 그건 누구 이야기?"
84312100301-14 = "음……"
84312100301-18 = "……몰라! 딱히 거기까진 생각 안 해봤어."
84312100301-24 = "뭐야, 그게."
