[translation]
2600608-1 = "구름을 찾아 떠나는 모험"
2600608-2 = "키보토스 역사 내 지하철"
2600608-5 = "노도카가 커다란 망원경을 짊어진 채 걸어가고 있다."
2600608-6 = "[s] \"안녕, 노도카.\""
2600608-8 = "앗, 안녕하세요, 선생님. 출근하는 길이신가요?"
2600608-9 = "오늘은 날씨가 좋네요. 이런 날 높은 곳에 올라가면 분명 멀리 까지 보일 거예요."
2600608-10 = "붉은겨울 학원은 이쪽 노선이 아니라고요?"
2600608-11 = "아하하…… 네, 맞아요. #n사실은 학원에 가는 게 아니라 구름을 보러 산 너머의 역에 가는 길이었거든요."
2600608-12 = "아침에 일어나서 동쪽 하늘을 바라보니 예쁜 두루마리구름이 산 중턱에 걸려 있더라고요."
2600608-13 = "산 위에서 내려다보면 더 예쁜 모양일 것 같아서, 망원경을 들고 나들이를 나온 참이었어요."
2600608-14 = "[s] \"그 망원경, 무겁지 않아?\""
2600608-15 = "망원경이요?"
2600608-16 = "물론 무겁긴 하지만…… #n장비가 없으면 예쁜 풍경을 관찰할 수 없으니까요."
2600608-17 = "예쁜 풍경을 볼 수 있다면 망원경의 무게쯤이야, 아무렇지도 않답니다."
2600608-18 = "선생님도 같이 구름을 보러 저와 함께 가실래요?"
2600608-19 = "아, 샬레의 일이 바빠서 자리를 비우실 수 없으시다고요?"
2600608-20 = "아쉽지만 어쩔 수 없네요~"
2600608-21 = "제가 대신 예쁜 광경들을 눈에 잔뜩 담아 올게요!"
2600608-22 = "[s] \"망원경, 잠깐 들어줄까?\""
2600608-23 = "앗, 감사합니다. 선생님."
2600608-27 = "그럼 플랫폼까지만 부탁드릴게요!"
2600608-29 = "플랫폼까지 노도카를 배웅하고 샬레로 돌아왔다."
