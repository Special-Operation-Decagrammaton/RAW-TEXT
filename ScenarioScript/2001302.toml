[translation]
2001302-1 = "일일 보안 결산"
2001302-2 = "샬레 집무실"
2001302-4 = "(외근 업무를 마치고 집무실로 돌아오니, 치히로가 컴퓨터 앞에 앉아서 기다리고 있었다.)"
2001302-5 = "[ns1] \"수고 많았어, 치히로.\"\n[ns2] \"말했던 보안 점검은 무사히 끝마쳤어?\""
2001302-6 = "음. 보안 점검 자체는 어려운 일도 아니었어."
2001302-7 = "음. 보안 점검 자체는 어려운 일도 아니었어."
2001302-8 = "로그를 전수 검사하고 캐시 데이터를 청소하는 단순한 일이었으니까……."
2001302-9 = "다행히 샬레의 서버에는 누군가가 침입한 기록도 없었고, 특별한 악성 코드도 발견되지 않았어."
2001302-10 = "……하지만 이 PC에는 아직도 큰 문제가 남아있어."
2001302-11 = "[s] \"어떤 문제?\""
2001302-12 = "그건 바로……"
2001302-13 = "선생님의 보안 의식이야!"
2001302-14 = "어째서 PC의 비밀번호를 잘 보이는 곳에 써서 놔두는 거야?"
2001302-15 = "[s] \"복잡한 비밀번호는 외우기 어려워서…….\""
2001302-16 = "그렇다고 해서 누구나 볼 수 있는 곳에 비밀번호를 써 두면 안 되지!"
2001302-17 = "이 메모지를 본 누군가가 나쁜 마음이라도 먹었다면, 선생님은 물론이고 샬레와 관련된 학생들의 기록까지 유출될 수도 있는 위급한 상황이었다고."
2001302-18 = "샬레는 초법적 수사권을 지닌 기관이잖아? 그런 만큼 더 주의를 해야지."
2001302-19 = "선생님은 자신이 얼마나 중요한 정보를 취급하고 있는지 좀 더 자각해야 해."
2001302-20 = "[s] \"……미안.\""
2001302-21 = "다행히 이번에는 큰 문제가 없었던 것 같으니 넘어가 주겠지만……."
2001302-22 = "다음부터는 이런 경솔한 행동은 절대 하지 마."
2001302-31 = "선생님. 여기에 새 비밀번호를 적어줘. 이번에는 기억하기 쉬운 것으로."
2001302-32 = "[s3] <12345>라고 적는다.\n[s4] <qwerty>라고 적는다."
2001302-33 = "뭐 하는 거야?!"
2001302-34 = "뭐 하는 거야?!"
2001302-35 = "그런 단순한 문자열이 암호가 될 수 있을 리가 없잖아!"
2001302-36 = "[s] \"하지만 기억하기 쉬운 것으로 적으라며?\""
2001302-37 = "기억하기 쉬운 비밀번호를 적으라고는 했지만, 누구나 떠올릴 수 있는 단순한 문자열로 정하라고 하지는 않았어!"
2001302-38 = "비밀번호는 선생님만 알 수 있는 특별한 문자나 숫자 배열을 사용해야지."
2001302-39 = "[s] \"그렇다면 내 생일로…….\""
2001302-40 = "그것도 안 돼! 선생님을 노리고 있는 크래커라면 선생님의 생일은 당연히 알고 있을 거라고."
2001302-41 = "이건 보안의 기초 중의 기초라고……."
2001302-42 = "그리고 중요한 계정의 비밀번호에는 특수문자나 대소문자를 하나 정도 포함하는 게 좋아."
2001302-43 = "그렇지 않으면 간단한 수준의 매크로만으로도 계정이 열릴 수 있으니까."
2001302-44 = "[s5] \"그런가……?\"\n[s6] \"그것 참 큰일이네…….\""
2001302-45 = "큰일이고 말고. PC의 비밀번호는 집에 들어올 수 있는 현관문 열쇠와도 같으니까."
2001302-46 = "큰일이고 말고. PC의 비밀번호는 집에 들어올 수 있는 현관문 열쇠와도 같으니까."
2001302-47 = "비밀번호를 아무렇게나 방치하는 건 현관문 열쇠를 귀찮다며 우편함에 넣어두는 거나 마찬가지인 행위야."
2001302-48 = "[s] \"어…….\""
2001302-49 = "설마 선생님…… 정말로 현관문 열쇠를 우편함에 넣어두는 건 아니겠지?"
2001302-50 = "하아…… 온라인의 보안만 취약한 게 아니었다니……."
2001302-51 = "지금부터 보안의 중요성에 대해서 설명해줄 테니 잘 들어!"
2001302-53 = "(이후, 치히로로부터 한 식경이 넘도록 보안 의식에 대한 잔소리를 들었다…….)"
