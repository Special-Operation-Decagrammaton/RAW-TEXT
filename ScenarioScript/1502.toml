[translation]
1502-1 = "Trouble & Trackers 2"
1502-2 = "밀레니엄 세미나 집무실"
1502-4 = "유우카. 신체검사에 쓴 체중계 가져왔어. 이게 마지막이야."
1502-5 = "수고했어, 에이미."
1502-6 = "후유……. 혹시나 신체검사 결과에 불만을 가진 학생들이 말썽을 부릴까 걱정했는데, 이번에는 다행히 아무 일도 없었네."
1502-7 = "이번에는?"
1502-8 = "밀레니엄에는 워낙 괴짜들이 많다 보니, 신체검사를 할 때마다 자신이 개발한 발명품을 가져와 소동을 벌이는 학생들이 종종 있었거든."
1502-9 = "제트 추진 장치가 달린 신발을 신고 몸무게를 재게 해달라는 학생이 있지를 않나, 외골격 슈트를 입고 근력을 측정하게 해달라는 학생이 있지를 않나……."
1502-10 = "왜 다들 신체검사는 자신의 발육상태를 파악하기 위한 검사라는 걸 이해하지 못하는 걸까?"
1502-11 = "그렇구나. 신기하네."
1502-12 = "물론 그 심정을 이해하지 못하는 건 아니야. 나도 이번 신체검사에서는 체중계의 눈금을 확 돌려놓고 싶을 정도였거든."
1502-13 = "으으, 게임개발부 녀석들과 어울리며 너무 과자를 많이 먹었어……."
1502-14 = "유우카의 권한이라면 학생기록부의 기록 정도는 손쉽게 수정할 수 있잖아?"
1502-15 = "그건 안 돼! 세미나의 임원이 권한을 악용했다가는 학교의 풍기가 엉망이 될 게 뻔하잖아?"
1502-16 = "세미나의 회계라면 누구보다 공정해야 해. 그건 상식이라고!"
1502-17 = "그렇구나……."
1502-22 = "유우카. 학생기록부에 데이터를 입력하려고 하는데, 접근 패스워드가 뭐야?"
1502-23 = "학생기록부의 패스워드? 특별히 수정한 기억은 없으니 초기 설정 그대로일걸?"
1502-24 = "<1q2w3e4r>이라고 입력해 봐."
1502-29 = "……아, 된다. 확인했어."
1502-31 = "베리타스 해커 휴게실"
1502-32 = "……감청 완료."
1502-33 = "역시 코타마 선배야!"
1502-34 = "그래서, 학생기록부 서버에 접근하는 패스워드는 알아냈어?"
1502-35 = "네. 유우카 양은 초기 설정 패스워드를 그대로 사용하고 있습니다."
1502-36 = "뭐? 밀레니엄의 회계나 되는 사람이 패스워드를 바꾸지 않고 그대로 쓰고 있다고? ……보안 의식 너무 낮은 거 아냐?"
1502-37 = "덕분에 우리 같은 해커들이 더 쉽게 접근할 수 있는 것이지만."
1502-38 = "이제 내 드론이 나설 차례네. 잠깐만 기다려 줘. 내부망이 설치된 서버까지 드론을 이동시킬 테니."
1502-44 = "……드론 진입 완료. 내부망에 접속 단자를 연결했어."
1502-45 = "여기서부터는 마키 네가 직접 해결할 수 있겠지?"
1502-46 = "물론이야. 맡겨 달라고!"
1502-50 = "하레 선배의 드론이 접속한 노드에 연결된 장치를 스캔하고……."
1502-54 = "프록시에 과부하를 걸어 무력화시킨 다음……."
1502-58 = "도청한 암호를 사용하여 운영자 권한을 탈취하면……."
1502-64 = "됐다! 신체검사 기록의 수정 권한을 손에 넣었어!"
1502-65 = "자, 그럼 어디부터 수정해 볼까?"
1502-66 = "우선 몸무게는 10kg을 줄이고, 키는 10cm 정도 늘린 다음, 가슴둘레를 90cm로……."
1502-67 = "그 체형에 그 몸무게가 나온다고? 아무리 거짓말이라지만 너무한 거 아냐?"
1502-68 = "마키, 저도 그렇게 부탁드립니다."
1502-69 = "후후, 말만 하라고. 얼마든지 고쳐 줄 테니까!"
1502-74 = "응? 뭐야, 이 데이터는. 세미나의 회계, 유우카 선배의 신체검사 기록이잖아?"
1502-75 = "평소에 사사건건 훼방만 놓는 게 마음에 안 들었는데…… 이 기회에 잠깐 장난 좀 쳐볼까?"
1502-76 = "무슨 장난을 치려고?"
1502-77 = "데이터를 조작해서 유우카 선배의 몸무게 기록을 100kg으로 바꿔 놓는 거야!"
1502-78 = "그럼 나중에 자신의 몸무게를 확인하고서 깜짝 놀라겠지? 후후후……."
1502-79 = "자신만만하게 외친 것치고는 너무 쪼잔한 복수인걸……."
1502-88 = "어, 어라? 갑자기 키가 안 먹혀! 이게 무슨 일이지?"
1502-89 = "누군가가 서버 너머에서 역해킹을 시도하고 있습니다. 앞으로 10초……!"
1502-90 = "마키, 당장 로그를 지우고 연결을 끊어!"
1502-91 = "하, 하지만……! 간신히 해킹으로 얻어낸 데이터를 포기하라니, 그건 너무 아깝잖아?"
1502-92 = "근처에 다른 노드가…… 에라, 모르겠다! 일단 아무데나 복사해두자!"
1502-98 = "<SYSTEM> \"student_data\" 폴더에서 \"social_network\" 폴더로 파일을 복사합니다……."
1502-99 = "잠깐! 지금 무얼 하는 거야, 마키?"
1502-100 = "어? 권한을 탈취당하기 전에 데이터를 백업해 두려고……."
1502-101 = "지금 네가 학생기록부 정보를 업로드한 곳은 공개 SNS 서버라고!"
1502-102 = "……망했다……."
1502-104 = "밀레니엄 세미나 집무실"
1502-105 = "…………어라?"
1502-106 = "왜 그래, 에이미? 평소답지 않게 놀란 표정을 짓고선."
1502-107 = "유우카, 혹시 학생들의 키와 몸무게는 외부에 공개되는 정보야?"
1502-108 = "뭐? 그럴 리가 없잖아. 오늘 측정한 학생들의 신체정보는 최고등급의 보안 시스템으로 엄중하게 관리되고 있다고. 베리타스의 해커들이라 하더라도 이 정보에는 손도 대지 못할걸?"
1502-109 = "하지만 지금 교내 SNS에 학생들의 신체검사 기록이 올라오고 있는데."
1502-110 = "뭐어어어어?"
1502-115 = "저, 정말이잖아? 누가 이런 짓을? ……그보다 어째서?"
1502-119 = "유우카."
1502-120 = "또, 왜!?"
1502-121 = "확실히 살이 많이 찌긴 했네. 관리를 하는 게 좋겠어."
1502-122 = "뭐? 그게 무슨 폭언이야!?"
1502-123 = "무, 물론 지난해에 비하면 체중이 조금 늘긴 했지만, 아직 정상 체중 안쪽이거든?"
1502-124 = "하지만 SNS에 올라온 유우카의 개인 기록에는 몸무게가 100kg이라고……."
1502-129 = "그럴 리가 없잖아—!!"
