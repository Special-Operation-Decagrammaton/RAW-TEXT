[translation]
1011806-1 = "의외의 수면"
1011806-2 = "안~녕~! 선생님!"
1011806-3 = "[s1] \"안녕, 노조미.\"\n[s2] \"일찍 왔네.\""
1011806-6 = "당번이니까 빨리 와야지."
1011806-10 = "흐아암~"
1011806-11 = "[ns3] \"입 찢어지겠다.\"\n[ns4] \"피곤해?\""
1011806-14 = "아후, 어제 운행 시간표가 야간이었거든."
1011806-15 = "좀 뻑적지근하고 그러네."
1011806-16 = "[s] \"늦게까지 일한 거야? 그럼 그냥 쉬지!\""
1011806-17 = "파햐햐, 괜찮아! 괜찮아!"
1011806-18 = "어차피 선생님 보러 오는 건데. 피곤한 건 괜찮다구."
1011806-19 = "자! 나 뭐 하면 돼?"
1011806-21 = "(아무래도 걱정됐지만, 노조미는 거듭 멀쩡하다며 웃었다.)"
1011806-42 = "[ns] \"……노조미, 눈 좀 붙일래?\""
1011806-44 = "아니, 아니! 괜찮아!"
1011806-45 = "완전 끄떡없어, 파햐햐!"
1011806-46 = "[s5] \"그럼 저기 소파에 잠깐만 누워있어.\"\n[s6] \"그 정도는 할 수 있겠지?\""
1011806-49 = "으음, 그럼 쪼오끔만 그래볼까……"
1011806-56 = "으음……"
1011806-57 = "와…… 몸이 녹는다아……"
1011806-58 = "[ns] \"자도 돼. 업무는 거의 끝냈거든.\""
1011806-59 = "아니, 아니야. 그럴 수는 없지."
1011806-61 = "샬레까지 왔는데 잠드는 건 아쉬우…… 니까……"
1011806-62 = "……"
1011806-67 = "(잠든 노조미에게 담요를 덮어주었다.)"
1011806-68 = "(저녁 늦게서야 깨어난 노조미는 시간이 아깝다며 웃어버렸다.)"
