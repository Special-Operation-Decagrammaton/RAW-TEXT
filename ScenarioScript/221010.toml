221010-1 = "#title;제1화;해안 산책"
221010-2 = "#na;(항구 근처에서의 업무를 마치고, 다른 자치구로 이동하기 위해 D.U.의 항구를 오가는 연락선의 표를 예매했다.)"
221010-3 = "#na;(초행길이라 출항 시간에 늦지 않도록 아로나에게 알림과 길 안내를 부탁했는데……)"
221010-6 = "#na;(……부두에 도착해보니 배는 이미 떠난 뒤였다.)"
