221010-19 = "3;아로나;18;우으…… 죄송해요, 선생님.\n#3;sig"
221010-20 = "3;아로나;15;아로나가 좀 더 꼼꼼히 확인해보았더라면, 선생님께서 배를 놓치지 않으셨을텐데……\n#3;sig"
