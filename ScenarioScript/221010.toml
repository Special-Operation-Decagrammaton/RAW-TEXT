221010-96 = "3;가짜 총학생회장;01;하지만 사물이 지닌 고유한 특성이나, 흔적을 통해, 이곳에 다다르기 까지 거친 상황들을 추론해 보는 것 정도는 가능하니까요."
221010-97 = "3;가짜 총학생회장;02;이 공을 제작하는 데 쓰인 밧줄은 햇볕과 물기에 저항이 강한 폴리에스테르 소재의 로프군요."
221010-98 = "3;가짜 총학생회장;99;이런 종류의 로프는 보통 공사장이나 부두에서 무거운 물건을 견인할 때 자주 쓰입니다만……\n#3;em;[…]"
221010-99 = "3;가짜 총학생회장;02;특히 이 푸른색의 플레이티드 방식 로프는 오디세이아 학원에만 납품되는 특제품이라, 다른 작업장에서 구하기는 어려울 겁니다."
221010-100 = "3;가짜 총학생회장;01;게다가 이 공을 제작하는 데 쓰인 원숭이 주먹 매듭법은 육지보다는 뱃사람들이 자주 쓰는 매듭법이니……"
221010-101 = "[s] \"그럼 이 구조 신호는 오디세이아 학원에서 온 건가?\""
221010-102 = "3;가짜 총학생회장;01;네. 구조 신호— 라고 단언할 수는 없겠습니다만, 오디세이아 학원에서 떠내려온 물건일 가능성이 높긴 하네요."
221010-103 = "3;가짜 총학생회장;03;괜찮으시다면, 제가 이 물건의 출처를 더 파악해 볼까요?\n#3;em;[?]"
221010-104 = "[s] \"그럼 좀 부탁할게.\""
221010-105 = "#st;[0,0];instant;1;"
221010-108 = "[ns11] \"그런데 오디세이아 학원은 어디에 위치한 학원이야?\"\n[ns12] \"이야기는 많이 들었지만, 한 번도 가본적이 없어서.\""
221010-111 = "3;가짜 총학생회장;99;오디세이아 학원은…… 지금은 가기 어렵습니다."
221010-112 = "3;가짜 총학생회장;02;현재 오디세이아 학원의 주 선단은 D.U. 로부터 1500해리— 그러니까, 약 2700km 떨어진 곳을 항해하고 있을테니까요."
221010-113 = "3;가짜 총학생회장;01;지금 당장 쾌속선을 타고 쉬지 않고 항해하더라도, 오디세이아 학원에 닿으려면 이틀이 넘게 걸릴 겁니다."
221010-114 = "[s13] \"그렇게 먼 곳에?!\"\n[s14] \"원래부터 그렇게 먼 곳에 있었던 거야?\""
221010-117 = "3;가짜 총학생회장;99;오디세이아 학원도 특별한 일이 없을 때는 D.U. 근해에 머무르며, 다른 학원들과 교류하거나 항만 업무를 보조해 왔습니다만……"
221010-118 = "3;가짜 총학생회장;01;공교롭게도 선생님이 키보토스에 오시기 몇 달 전, 오디세이아의 학생들이 다 함께 먼 바다로 항해를 떠났거든요."
221010-119 = "[s] \"오디세이아의 학생들이 항해를 떠나는 건 자주 있는 일이야?\""
221010-120 = "3;가짜 총학생회장;02;잦은 일은 아니지만, 그래도 격년에 한 번 있는 일이니 드문 일도 아니라고 해야 할까요.\n#3;em;[반응]"
221010-121 = "3;가짜 총학생회장;01;오디세이아 학원은 격년 주기로 먼 바다까지 배를 몰고 나가 항해술을 연마하고, 학생들 간의 단합을 도모하거든요."
221010-122 = "3;가짜 총학생회장;03;현대식 함선이 개발되기 전부터 내려져 오던 오랜 전통이니, 오디세이아의 학생들에게는 통과의례와 다름없는 행사랍니다."
221010-123 = "3;가짜 총학생회장;99;하지만 항해 중에는 육지로부터의 보급도 불가능한 데다가, 다른 학원과 연락도 취할 수 없다 보니 일부 학생들은 교정국에 갇힌 것 같다며 원양 항해를 꺼려하는 모양이에요.\n#3;em;[…]"
