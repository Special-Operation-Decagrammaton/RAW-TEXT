221010-8 = "3;아로나;02\n#3;a\n#3;sig\n#wait;1000"
221010-9 = "3;아로나;04;이, 이번에는 실수하지 않았어요!\n#3;em;[!]\n#3;sig\n#3;jump"
221010-10 = "3;아로나;15;부, 분명 슈퍼 아로나의 최적 경로 계산에 따르면 출항 10분 전까지는 충분히 부두에 도착하고도 남을 시간이었는데—\n#3;sig"
221010-11 = "3;아로나;15\n5;프라나;02;……확실히, 선배의 계산은 틀리지 않았습니다.\n#5;em;[…]\n#5;a\n#3;sig\n#5;sig\n#3;m1"
221010-12 = "5;프라나;99;하지만 배는 출항 준비에 시간이 오래 걸리기 때문에, 출항 15분 전에는 닻을 올리고 잔교를 걷어 배에 승선할 수 없는 경우가 있습니다.\n#5;sig"
221010-13 = "5;프라나;01;따라서 배에 승선할 때는 15분 정도 여유를 갖고 탑승하시는 것을 추천 드립니다.\n#5;sig"
221010-14 = "5;프라나;01\n3;아로나;28;보, 보세요! 약속한 시간보다 먼저 떠나버린 배가 잘못한 거라고요!\n#3;jump\n#3;sig\n#5;sig"
221010-15 = "3;아로나;04;아로나의 계산은 완벽했는데……\n#3;sig"
221010-16 = "#st;[0,0];instant;1;"
