221010-50 = "3;아로나;03;후후, 그렇죠? 이 슈퍼 아로나의 예리한 시선 앞에서는 그 무엇도 숨을 수 없으니까요!\n#3;em;[재잘]\n#3;sig"
221010-51 = "3;아로나;32;흥흥~ 어디, 매장금의 지도가 담긴 유리병 편지 같은 건 없으려나~\n#3;sig"
221010-52 = "5;프라나;99;……유감. 이 해변은 항만관리국에 의해 주기적으로 청소되고 있기 때문에 유리병 같은 표착물은 이미 치워졌을 가능성이 높습니다.\n#5;em;[…]\n#5;sig"
221010-53 = "5;프라나;01;더군다나 유리병 편지와 같은 해류병은 회수율이 낮아 쉽게 발견하기 어렵습니다.\n#5;sig"
221010-54 = "5;프라나;02;이 근처에서 발견되는 유리병은…… 대부분 관광객이 버린 쓰레기가 아닐까요.\n#5;sig"
221010-55 = "3;아로나;18;으으, 프라나 쨩은 왜 그렇게 부정적인 건가요? 로망이 부족하다고요!\n#3;em;[땀]\n#3;sig"
221010-56 = "3;아로나;14;바닷가에 밀려온 유리병에는 꿈이 잔뜩 담긴 편지가 담겨 있는 게 상식이잖아요?\n#3;sig"
221010-57 = "5;프라나;02\n3;아로나;13;어딘가 외딴 섬에 갇혀 있는 공주님의 구조 요청이라던가, 미래의 나에게 보내는 과거의 추억 편지라던가~\n#3;m3\n#5;sig\n#3;sig\n#5;dr"
