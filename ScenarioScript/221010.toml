221010-44 = "5;프라나;99;바닷가에서 흔히 발견할 수 있는 조개 껍질 중 하나입니다만, 주변의 환경에 따라 색과 문양이 달라지는 특징이 있습니다.\n#5;sig"
221010-45 = "5;프라나;02;이 주변의 고둥은 이렇게 진한 산호빛을 띄지 않는데…… 아마 다른 곳에서 파도에 휩쓸려 온 모양입니다.\n#5;sig"
