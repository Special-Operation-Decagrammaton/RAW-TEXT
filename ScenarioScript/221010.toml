221010-22 = "[ns1] \"괜찮아, 신경 쓰지 마.\"\n[ns2] \"미리 알아보지 못했던 내게도 책임이 있는 걸.\""
221010-26 = "[ns] \"대신 모처럼 시간이 생겼으니 보물 찾기라도 하는 게 어떨까?\""
221010-27 = "3;아로나;02;보물…… 찾기요?\n#3;em;[?]\n#3;sig"
221010-28 = "5;프라나;02;이 근처에 보물이 묻혀 있다는 정보는 들은 적이 없습니다만……\n#5;sig"
