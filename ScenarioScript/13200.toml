[translation]
13200-1 = "제20화;보물찾기"
13200-4 = "……."
13200-8 = "호시노 선배!"
13200-9 = "프레지던트는요?"
13200-12 = "후후후."
13200-17 = "……."
13200-20 = "헬기……?!"
13200-25 = "……놓쳤어."
13200-27 = "그래, 아쉽게 됐네. 제군들. 이걸로 열차포는 나에게 넘어오게 되었어."
13200-28 = "즉, 체크메이트라네."
13200-31 = "스오우, 그건?"
13200-32 = "여기 있습니다."
13200-37 = "자, 잠깐만요. ……그건 제 카드?! 어, 어느새……?!"
13200-38 = "<학생회장들의 계곡>으로 가는 길을 뚫으려면 이게 필요하지."
13200-40 = "학생회장들의 계곡……?"
13200-41 = "그래. 분석 결과, 거기로 가는 노선을 해제하려면 네프티스 그룹 오너의 인증이 필요하다."
13200-42 = "원래대로라면 본인이 있어야겠지만…… 저 호시노를 상대로 그러기는 쉽지 않은 것 같군."
13200-44 = "……하지만 이 카드가 있다면 문제없습니다."
13200-45 = "열차포는…… <학생회장들의 계곡>이라는 곳에 있는 건가요……?"
13200-46 = "설마 자네들도 열차포를 노릴 셈인가? 그건 곤란하지!"
13200-47 = "자, 이게 바로 우리가 감정한 <열차포 셰마타>의 가치다! 전략적 가치, 기술적 가치, 역사적 가치를 모두 고려했다네."
13200-48 = "그 금액은…… 약 800억엔!"
13200-49 = "파, 팔백억엔……?!"
13200-50 = "무슨 말도 안 되는 숫자야……?!"
13200-52 = "열차포는 카이저의 것이다. 여기에 조금이라도 손을 대다간 천문학적인 금액을 배상해야 할 걸세."
13200-53 = "그럴 각오는 되어 있는가? 아비도스 대책위원회?"
13200-56 = "만약 그렇게 된다면…… 그래, 호시노, 자네를 카이저 PMC에 고용해 주겠네. 검은 양복이 좋아할 걸세."
13200-57 = "아니면, 정석대로 법적인 다툼을 할 셈인가? 그것도 환영일세. 자네들이 졸업할 때까지 끝없이 괴롭혀주지."
13200-60 = "그 후엔 신입생들을 괴롭혀주겠네. 그런 게 있다면 말일세. 하하하하-!"
13200-65 = "그러니까…… 응?"
13200-66 = "뭔가, 스오우 군?"
13200-72 = "무, 무슨 짓……?!"
13200-73 = "으아아아아아아아--------------------?!?!"
13200-79 = "무, 무슨……?!"
13200-88 = "크아아악-!"
13200-92 = "……헬기에서 밀어버렸어요……!!"
13200-93 = "……!!?"
13200-94 = "뭐, 뭐야?! 가, 갑자기!?"
13200-95 = "……. 대, 대체 저런……."
13200-100 = "끄……."
13200-101 = "끄…… 끄으……… 으…………."
13200-105 = "프레지던트님!!"
13200-106 = "괘, 괜찮으십니까!?"
13200-107 = "끄…… 끄으……."
13200-111 = "부상이 심하시다! 어, 어서 본사에 연락을……!"
13200-113 = "……. 타카나시 호시노. 학생회장들의 계곡. 장학전. 그게 어딘지 알고 있겠지?"
13200-114 = "거기서 기다리고 있겠어. 열차포를 막으려면 거기로 찾아와라."
13200-116 = "너는……."
13200-117 = "오지않는다면, 열차포를 기동시켜서 그대로 아비도스 밖으로 반출시켜 버리겠어."
13200-121 = "……."
13200-122 = "하, 학생회장들의 계곡……? 거, 거기가 어디죠?"
13200-123 = "나, 나도 몰라. 어디서 들어본 것 같기도 한데……."
13200-127 = "(학생회장들의 계곡…….)"
13200-128 = "(기억났어…… 섹터 35-9.)"
13200-130 = "다른데도 마찬가지일 거예요. 값비싼 보물들이 전시되어 있는 아비도스 회장들의 전시관?"
13200-131 = "그런 게 진짜 있었다면 진작에 예전 학생회 녀석들이 찾아내서 팔아치웠겠죠."
13200-134 = "아비도스의 옛 학생회장들이 사막 어딘가에 만들어두었다는 기념 건물."
13200-135 = "통칭 학생회장들의 계곡…… 알고 있어……. 열차포는 거기 숨겨져 있는 것이었어."
13200-141 = "기다려?! 호시노 선배?!"
13200-146 = "어, 어디 가는 거야!"
13200-147 = "선배! 얘기를 해요!! 기다려요!"
13200-148 = "호, 호시노 선배!"
13200-149 = "얘기를 하지 않으면 안 돼요! 이제 됐잖아요! 노노미 선배도 구해냈고……"
13200-151 = "우리는 유메 회장의 학생회도, 우리들의 대책위원회도 부정하지 않았어. 선생님이 도와주었으니까."
13200-152 = "네! 맞아요! 그러니까 혼자 가지 마요, 선배! 우리와 함께 가요!!"
13200-153 = "……미안해. 그럴 수 없어."
13200-154 = "네?!"
13200-155 = "호시노 선배, 설마……."
13200-156 = "[s] \"호시노. 기다려.\""
13200-158 = "내가 여기서 대책위원회에 다시 들어가게 되면…… 열차포를 파괴할 수 없게 돼."
13200-159 = "……!!"
13200-160 = "……나는 대책위원회가 아니어야 해. 내 아비도스 학생회는 대책위원회와 달라야만 해."
13200-161 = "네?!"
13200-162 = "아뇨! 그 선언은 이제 의미 없어요!!"
13200-164 = "……의미가 없어졌다고 해도, 나에겐 그 선언이 필요해."
13200-165 = "그래. 지금부터 벌어지는 일은 대책위원회와는 무관해야만 하니까."
13200-166 = "……!!"
13200-167 = "이건 가짜 학생회였던 호시노의 독단적인 습격이 되어야만 해. 그렇지 않으면 대책위원회에게 책임이 전가될 거야."
13200-171 = "[ns] \"기다려, 호시노!!\""
13200-177 = "여, 연막?!"
13200-185 = "미안해, 시로코 쨩."
13200-195 = "큭-!"
13200-196 = "열차포는 아비도스에 있어서는 안 돼. 절대로."
13200-197 = "나는 가서 그걸 부술 거야. 후배들의 길을 막아버려선 안 되니까."
13200-198 = "그리고 유메 선배를 긍정해 줘서 고마워. 모두들."
13200-203 = "호시노 선배!!"
13200-209 = "조, 조금만 기다리십시오! 차량이 도착했습니다!"
13200-210 = "끄으…… 아비도스 밖으로…… 나를 호위해라…… 그리고……."
13200-211 = "본사에 연락해서 카이저 PMC뿐만 아니라…… 카이저 그룹사 전원…… 전원을 불러라……!!"
13200-212 = "저, 전원 말씀이십니까?"
13200-214 = "그래!"
13200-215 = "카이저 인더스트리,"
13200-216 = "카이저 론,"
13200-217 = "카이저 건설,"
13200-218 = "그리고 카이저 편의점까지 포함해서,"
13200-219 = "카이저 PMC의 전체 병력을 불러와라! 계열사의 모든 병력을 집결시키는 거다!"
13200-220 = "총력전이다! 카이저 코퍼레이션의 총력전을 아비도스에서 시작하는 거다……!!"
13200-221 = "초, 총력전……!"
13200-222 = "목표는 학생회장들의 계곡……! 거기로 진격해서 열차포를 반드시 가져와라! 쿨럭, 쿨럭쿨럭……!!"
13200-223 = "열차포를 아비도스 자치구에서 가져오는 거다!! 반드시!!"
13200-224 = "아, 알겠습니다!"
13200-230 = "……."
13200-231 = "호시노 선배……."
13200-232 = "……."
13200-239 = "……."
13200-245 = "다음화;두 번째 추격"
