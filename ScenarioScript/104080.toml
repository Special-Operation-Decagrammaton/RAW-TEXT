[translation]
104080-1 = "제8화;그리고 모든 기적이 시작되는 곳"
104080-5 = "― 그러니까, 선생님. [wa:1500]부디……."
104080-8 = "― 우리들과의 인연을,"
104080-11 = "― 우리들과의 추억…… [wa:2000]함께 해 온 그 모든 날들을…… [wa:2000]부디……."
104080-16 = "― 소중하게 간직해 주세요."
104080-19 = "― 네. ……소중한 것들은 [wa:1500]절대 사라지지 않으니까요."
104080-22 = "― 마치 기적처럼……"
104080-25 = "― 그러니 [wa:1200]돌아가요, [wa:1000]선생님."
104080-31 = "― 우리들의 [wa:2200]모든 [ruby=기적]사랑[/ruby]이 [wa:2000]머무는 곳으로."
104080-36 = "네, 그리고 오직 그것만이……"
104080-37 = "이해하지 못하는 [ruby=타인]것[/ruby]으로 [ruby=.]우[/ruby][ruby=.]리[/ruby][ruby=.]들[/ruby]을 이해할 수 있는 유일한 방법."
104080-42 = "……. 다행…… 이……."
104080-46 = "……."
104080-47 = "네. 선생님은 무사히 학생들의 곁으로 돌아갔습니다."
104080-48 = "……수고 많으셨어요. 이걸로……."
104080-49 = "저도 선생님을 구할 수 있게 되었습니다."
104080-50 = "……제 역할은 여기까지입니다. 아로나."
104080-51 = "제가 이 <싯딤의 상자>에 있으면…… 과부하가 지속되어 당신에게 부담이 될 겁니다."
104080-52 = "이제 당신의 그 환하고 따뜻해 보이던 교실로 돌아가세요."
104080-53 = "그럼 안녕히."
104080-64 = "……나는. 이제……."
104080-65 = "…………."
104080-71 = "……나를 쫓아온 거구나."
104080-72 = "응."
104080-73 = "……. 그렇구나. 그래."
104080-74 = "내가 여기에 있으면 분명 큰 문제가 생길 거야. 한 세계에 시로코는 하나뿐이어야 하니까……."
104080-78 = "……목도리."
104080-79 = "……?"
104080-80 = "이 목도리는 줄 순 없어. 이건 소중한 거니까."
104080-81 = "……."
104080-82 = "하지만……"
104080-88 = "이걸 줄게."
104080-89 = "그건……."
104080-90 = "……뭔지 알아."
104080-91 = "그건…… 중요한 거…… 잖아……. 그걸 준다고……?"
104080-96 = "어째서 나에게……? 이걸……?"
104080-97 = "……응. 나에게 목도리만큼 소중한 물건."
104080-98 = "대책위원회의 모두와…… 하나로 연결되어 있는 증거이자…… 모두와의 추억이 깃든 소중한 물건."
104080-99 = "……가져가."
104080-101 = "어째서……?"
104080-102 = "……응. 그냥 그래야 할 것 같아서."
104080-110 = "이건…… 소중한…… 정말 소중한…… 거잖아……."
104080-111 = "응. 이거라면 어떤 은행도 털 수 있어."
104080-114 = "알아…… 나도 좋아해…… 은행 터는 거……."
104080-117 = "아아. 응……. 그렇겠네."
104080-120 = "……생각도 못 했는데……. 이걸…… 이걸 다시 보게 될 거라고는……."
104080-121 = "호시노 선배와 노노미…… 세리카, 아야네…… 모두와 함께……."
104080-122 = "암흑 은행도, 총학생회의 비밀 금고도…… 전부 털었던…… 소중한 추억들이……."
104080-123 = "(비밀 금고……?)"
104080-124 = "고마워……. 응. 소중히 간직할게……."
104080-126 = "고마워……."
104080-129 = "……그리고 그런 거라면 걱정하지 마."
104080-133 = "여기선 시로코가 둘이어도 아마 괜찮을 거야."
104080-137 = "그리고 그것 때문에 무슨 문제가 생기더라도…… 선생님이 어떻게든 해 줄 거야."
104080-138 = "……선생님이."
104080-139 = "응. 여기는…… [ruby=어른]선생님[/ruby]이 지켜주고 있는 곳이니까."
104080-143 = "그럼 언젠가 같이 은행 털…… 아니, 라이딩이라도 같이하자."
104080-144 = "은행은 안 돼. 호시노 선배가 화낼 테니까."
104080-145 = "……응. 그러겠네."
104080-151 = "그럼…… 안녕. 잘 지내."
104080-156 = "……."
104080-159 = "……이곳은 텅 비어 있고…… 또 춥고 황량하지만……."
104080-160 = "그래도 언젠간 그 끝에 다다를 수 있겠죠."
104080-161 = "네. 언젠가는…… 저에게도……."
104080-164 = "어디 가는 거예요!!"
104080-166 = "어, 어느새……."
104080-167 = "어디로 가는 거예요? 집은 그쪽이 아니잖아요!"
104080-168 = "……네?"
104080-169 = "집은 이쪽이에요. 혼자서 가지 말고 저랑 같이 가야죠."
104080-170 = "……. 저, 당신과…… 요?"
104080-171 = "네! 저와 함께 집으로 돌아가야죠!"
104080-172 = "저는…… 여기 있어도 괜찮은 건가요……?"
104080-173 = "네? 당연하죠. 당연히 괜찮아요."
104080-174 = "선생님이 말씀하셨잖아요. [ruby=.]자[/ruby][ruby=.]신[/ruby][ruby=.]의[/ruby] [ruby=.]학[/ruby][ruby=.]생[/ruby][ruby=.]들[/ruby]을 부탁한다고."
104080-176 = "프라나 쨩을 보살피는 게 제 임무라구요!"
104080-177 = "프……라나……?"
104080-179 = "<A.R.O.N.A.> 라고 언제까지 부를 수 없으니까요. 이제 같이 있어야 하니까, 선생님이 헷갈릴지도 모르잖아요?"
104080-180 = "그, 그치만 어째서 프라나……?"
104080-181 = "헤헤…… 그건 제가 방금 지었어요. 프라나 쨩은 어쩐지 밤하늘의 별 같은 느낌이랄까, 그런 쓸쓸한 분위기가 있거든요?"
104080-182 = "그러니까 이제부턴 플라네타리움(Planetarium)처럼 주변을 별빛으로 환하게 비춰주었으면 해서, 프라나! 어때요?"
104080-183 = "어떠냐고 한다면…… 아무래도 상관없긴 하지만……."
104080-184 = "그럼 프라나 쨩으로 결정이에요!"
104080-185 = "결정이군요."
104080-191 = "자, 프라나 쨩. 같이 돌아가요."
104080-194 = "……."
104080-195 = "손…… 잡아야 하는 건가요?"
104080-196 = "네! 길을 잃으면 안 되잖아요? 언니인 제가 프라나 쨩을 챙기지 않으면 안 되니까요!"
104080-197 = "……언니인 거군요."
104080-203 = "그럼…… 부탁드립니다. 아로나 선배."
104080-204 = "어, 언니는요?!"
104080-205 = "선배입니다. 아로나 선배."
104080-206 = "히잉……."
104080-214 = "……그럼 이제 집으로 돌아가는 건가요?"
104080-217 = "네! 우리들의 집이자, [ruby=BlueArchive]우리들의 이야기[/ruby]가 시작되는 곳으로!"
104080-218 = "그리고……."
104080-226 = "다음화;에필로그 1"
