[translation]
33070-1 = "제7화;불과 재의 날 1"
33070-3 = "꺄아아아아아아악-!!"
33070-4 = "여기, 여기 다쳤어요-!"
33070-5 = "콜록, 콜록-!"
33070-7 = "긴급 사태입니다! 고성당이 정체불명의 폭발에……! 이것은 대체……!"
33070-8 = "현재 고성당은 불길에 휩싸여 있습니다! 아앗, 첨탑이 무너지고 있습니다!"
33070-9 = "……나기 쨩."
33070-12 = "꺄아아아아아-!!"
33070-13 = "으아아아-! 조심해!"
33070-14 = "어, 어떻게 해야…… 지금……."
33070-18 = "아, 아즈사 쨩이 보이질 않아요!"
33070-19 = "서, 선배들이…… 어, 어떻게……."
33070-20 = "아뇨, 코하루 쨩, 히후미 쨩!"
33070-21 = "일단 상황을 파악하기 전까진 섣부르게 움직여선 안 돼요!"
33070-22 = "네? 그, 그치만 아, 아즈사 쨩이……."
33070-24 = "아즈사 쨩이라면, 자신의 몸을 지킬 수 있는 아이니까, 일단 지금은 흩어져선 안돼요!"
33070-25 = "그, 그치만……."
33070-26 = "하나코 쨩……. 코하루 쨩……. 우리는 어떻게 해야……."
33070-30 = "(……무슨 일이 벌어진 거지?)"
33070-31 = "(폭발……? 공격당했다? 상황은?)"
33070-32 = "(그 소리는…… 물체가 고속으로 비행할 때 생기는…… 종류? 게다가 이 정도의 탄착 에너지라면…….)"
33070-33 = "(순항미사일? 대공 방어 시스템이 요격할 수 없을 정도의 속도였다……?)"
33070-34 = "(램제트 엔진……? 키보토스에서 그런 기술을 가진 곳은…….)"
33070-35 = "(아냐. 그걸로도 이 규모의 폭발은 설명되지 않아…… 처음부터 고성당에는 폭약이 숨겨져 있었다?)"
33070-36 = "(어디서부터 함정이었던 거지……? 누가? 트리니티? 시스터후드? 이 시점에…….)"
33070-38 = "(……아냐, 생각을 멈춰. 지금은 여기에 집중해야 해.)"
33070-39 = "(아코는…… 다행히 무사하군. 그렇다면 빨리 움직여야…….)"
33070-40 = "(…….)"
33070-41 = "선생님은……!!?"
33070-43 = "……히, 히나 씨, 아직 일어서 있습니다."
33070-44 = "어, 어쩌죠? 저 공격으로도 서 있어요, 여, 역시 대단해요. 강해요. 아직까지 싸울 수 있다니……. 아플 텐데, 고통스러울 텐데……. 어째서……."
33070-46 = "처리해라. 히나는 특히 놓치지 마라."
33070-47 = "네, 넵! 노, 노력하겠습니다!"
33070-51 = "죄송합니다. 그, 그렇게 되었으니 실례하겠습니다…… 헤헤."
33070-53 = "(……아리우스 분교.)"
33070-54 = "죄, 죄송합니다. 당신은 여기서 다른 데로 가시면 안 돼요…… 헤헤…… 저도 명령받은 거라……."
33070-56 = "……."
33070-57 = "비켜."
33070-58 = "여, 역시 고통스럽겠네요."
33070-63 = "키키키키키키킷-!"
33070-64 = "성공이다! 계획대로야! 크하하하하하하하하!!!"
33070-65 = "마코토 선배…… 대체 무슨 짓을 저지른 겁니까……."
33070-66 = "이걸로 방해꾼들은 모두 사라졌다. 티파티는 물론이고 눈엣가시였던 히나도 사라졌어."
33070-67 = "모르겠나? 이로하? 이게 바로 일석이조라는 것이다."
33070-69 = "나 마코토 님과 트리니티를 증오하는 아리우스는 오래 전부터 내통하고 있었던 것이야!"
33070-70 = "티파티의 내분도, 쿠데타도 모두 다 나는 알고 있었지. 오늘의 계획을 위해서 말이다!"
33070-72 = "쿠데타……?"
33070-73 = "……그런 짓을 멋대로, 아니 잠깐. ……선배는 애초에 에덴조약을 치를 생각이 없었던 거였군요."
33070-74 = "그래! 그런 머리 아픈 것 따윈 관심없어! 나의 관심은 오직 내 방해꾼들을 치우는 것뿐!"
33070-75 = "모습을 드러내지 않는 티파티 놈들을 끌어내기 위해서 말야! 그 에덴 어쩌고에 동의하는 척 한 것뿐이야!"
33070-76 = "겸사겸사 히나도 치워버리고 말이야. 킷킷킷!"
33070-77 = "거기에 아리우스가 큰 도움을 줬지. 이 비행선도 그쪽이 준비해준 우호의 선물이다. 적의 적은 친구, 아니, 혈맹인 것이지. 킷킷킷킷-!"
33070-78 = "자아, 그럼 아리우스에게 연락을 해라. 트리니티의 궤멸 작전. 시작이다."
33070-79 = "히나와, 나기사. 나를 방해할 것들은 모두 사라졌으니-!"
33070-81 = "트리니티를 지도에서 지워버리겠다!"
33070-83 = "마코토 선배……. 그 아리우스가 트리니티보다 더 증오하는 게 바로 우리 게헨나입니다. 그런 집단이 우리와 손잡을 리가 없잖아요."
33070-88 = "……뭐라고?!"
33070-89 = "어? 여기 뭔가 상자가 잔뜩 있어. 이게 뭐야? 취급 주의? 가연성? 폭발?"
33070-90 = "하아……. 결국 또 저질러버렸군요. 마코토 선배."
33070-92 = "콰아아아아아아아앙-!!"
33070-96 = "II팀, 보고해라."
33070-97 = "II팀, 고성당 진입 완료. 곧 정의실현부와 교전에 돌입하겠어. 리더는?"
33070-98 = "아아, 이쪽도 정리 끝났다."
33070-99 = "III팀은 현재 히나와 교전 중입니다! V팀은 예정대로 지하로 진입 중이에요!"
33070-100 = "알겠다. 금방 합류하도록 하지."
33070-102 = "트리니티와 게헨나…… 오랜 증오의 부채를 갚을 때가 마침내 도래했다."
33070-103 = "그래, 아리우스가 낙원의 이름으로……."
33070-105 = "너희의 모든 것을 심판하겠다."
33070-107 = "……생님!"
33070-108 = "선생님! 정신차리세요!"
33070-109 = "[s] \"아로나……?\""
33070-110 = "괜찮으세요? 큰일났어요. 정신 차리셔야 해요!"
33070-111 = "[s] \"……무슨 일이 벌어진 거야?\""
33070-112 = "고성당이 무너졌어요. 폭발이…… 제가 어떻게든 선생님을 지키려고 했는데……."
33070-113 = "아우…… 이제 더는 무리랄까…… 힘에 부쳐서…… 그러니까 정신을 차리셔야 해요!"
33070-114 = "[s] \"……응? 아로나?\""
33070-125 = "[ns] (방금 그건…….)"
33070-127 = "……생님!"
33070-129 = "선생님…… 콜록, 콜록…… 무사하셨군요!"
33070-130 = "[ns] (움직일 수가 없다…….)"
33070-131 = "정말 다행이에요, 어떻게 무너진 파편들 사이의 틈에……."
33070-132 = "잠시만요, 제가 이 파편을 치울게요……!"
33070-136 = "힘이 센 게 이럴 때 도움이 되다니……. 자, 선생님, 일어나실 수 있겠어요?"
33070-137 = "[ns] 일어난다."
33070-139 = "다치신 곳은…… 진짜 없으시네요. 이런 폭발에서 큰 상처 하나 없다니…… 이건 기적이라고 밖엔……."
33070-143 = "선생님! 무사하셨군요!"
33070-144 = "크윽…… 선생님……!!"
33070-145 = "정의실현부 여러분……. 아아, 그 상처는……."
33070-146 = "[s] \"모두들……. 괜찮은 거야?\""
33070-147 = "이 정도는 아무 것도 아닙니다. 다만 이 폭발로 정의실현부 부원의 대부분이 전투불능이 되었습니다."
33070-148 = "게다가 이곳에 계시던 나기사 씨와 사쿠라코 씨…… 그 외에 이곳에 있던 주요 인사들의 신변도 알 수 없게 되었고…… 게다가……."
33070-149 = "게헨나 쪽 사람들도 보이지 않는군요…… 대체 이건 무슨 일이……."
33070-151 = "!!"
33070-158 = "작전 지역으로 올라왔어. 그리고 정의실현부의 잔당 발견. 아니, ……정정. 잔당이 아니라 정의실현부의 총전력이야."
33070-159 = "츠루기와 하스미……. 병력을 이쪽으로 지원해줘. 지금 교전에 들어간다."
33070-161 = "아리우스 분교……?!"
33070-162 = "어, 어디서 이 정도의 병력이……?! 어떻게 온 거죠?! 주변은 모두 통제되어 있었을 텐데!"
33070-163 = "서, 설마……!!"
33070-167 = "설마, 지하에서……? 고성당 지하의 카타콤을 통해서……?"
33070-168 = "……."
33070-169 = "과연. 그렇군요. 이 사태는……. 아리우스의 짓인가 보군요."
33070-170 = "용서할 수 없습니다…… 이 일의 대가는 지금 여기서……."
33070-171 = "……하스미."
33070-172 = "……!"
33070-173 = "진정해."
33070-174 = "……. 네. 그렇네요, 츠루기."
33070-175 = "고마워요. 여기서는 선생님의 안전이 최우선. 선생님을 데리고 이곳에서 벗어나겠습니다."
33070-176 = "그래, 날뛰는 건 내가 할 테니까 말야."
33070-177 = "키키키킥……. 그러니까……."
33070-178 = "이 버러지 놈들을 눌러 죽이는 건---!! 나아아아아아-!!"
33070-180 = "캬캬캬캬아아아아---------!"
33070-181 = "가시죠! 선생님!"
