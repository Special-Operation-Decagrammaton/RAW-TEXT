[translation]
10046090-1 = "제9화;토요일 밤이 지나면"
10046090-4 = "아, 선생님. 오셨군요."
10046090-5 = "얼마 지나지도 않았는데, 되게 오랜만에 뵙는 느낌이네요."
10046090-6 = "네, 알고 있습니다. 티파티에 들르시는 거죠?"
10046090-7 = "제가 안내하겠슴다."
10046090-14 = "……그렇게 외교적 문제로 번지기 전에, 나기사 님이 먼저 손을 쓰셨죠."
10046090-15 = "티파티 프라이빗 비치를 대중에게 개장하신 거죠."
10046090-16 = "덕분에 온천개발부가 멋대로 들이닥친 문제는 유야무야할 수 있었고요."
10046090-17 = "대신 해변 개장 소식을 듣고, 키보토스 각지에서 손님들이 들이닥쳤고…… 음……."
10046090-18 = "이후 일어난 일들은 별로 말하고 싶지 않네요. 하. 하. 하."
10046090-23 = "응~? 지금 무슨 이야기일까?"
10046090-24 = "미카에게는 너무 어려운 회화였나요? 유아도 이해할 수 있게 좀 더 풀어서 설명해 드리죠."
10046090-28 = "……하하, 저는 여기까지 안내하겠슴다."
10046090-29 = "이 뒷얘기는, 저는 듣지 않는 편이 좋아 보여서요."
10046090-30 = "[s1] \"데려다줘서 고마워, 이치카.\"\n[s2] \"아참, 하나만 묻고 싶은데.\""
10046090-35 = "……네? 온천개발부 말입니까?"
10046090-36 = "뭐, 제가 아는 영역에서 답변드리자면……."
10046090-42 = "하아……."
10046090-43 = "두 사람 다 하루라도 안 싸울 수는 없는 건가요?"
10046090-48 = "그 말에는 어폐가 있네요. 싸움은 동등한 지성을 지닌 상대끼리 통용되는 말입니다."
10046090-50 = "세이아 씨, 아무래도 그건 말이 너무……."
10046090-52 = "헤에~ 세이아 쨩~ 싸움 잘하나 보네?"
10046090-57 = "미카 씨, 좀 더 차분하게 대화를 하도록 해요."
10046090-59 = "싸움이라…… 자신 없군요. 상대를 다치지 않게 할 자신이요."
10046090-60 = "아무래도, 제 손가락에는 사람을 죽이는 힘이 담겨 있는 듯하여."
10046090-61 = "……? 뭐야, 그거? 중2병 선언?"
10046090-66 = "[ns3] \"안녕.\"\n[ns4] \"오늘도 사이좋네.\""
10046090-71 = "서, 선생님?! 여기는 어쩐 일이야?"
10046090-73 = "제가 불렀습니다. 예의 해변 건의 뒤처리를 위해서요."
10046090-74 = "저희 선에서 끝내는 것이 가장 좋겠지만, 이후 과정에 엮인 이해관계가 워낙 많아 샬레의 중재 없이는 원만하게 끝마치기 어렵다는 판단입니다."
10046090-75 = "그보다 해변을 개방하는 것만으로, 그렇게 많은 소동이 일어나는 것은 대체……."
10046090-76 = "그런고로, 한동안 선생님께서 방문하며 수고를 봐 주실 예정입니다. 정말이지, 면목이 없습니다."
10046090-77 = "[s5] \"새삼스럽지만, 잘 부탁해!\"\n[s6] \"마음껏 부려 먹어 줘!\""
10046090-80 = "아, 그러면!!"
10046090-81 = "안됩니다."
10046090-82 = "아직 말도 안 했는데?!"
10046090-83 = "아직 미카 씨는 본무를 다하지 못하신 걸로 압니다. 프라이빗 해변의 관리를 위한 예산안 제출과 심사가 통과될 때까지 선생님께는 접근 금지입니다."
10046090-84 = "엑, 싫어."
10046090-85 = "늘 말씀드리지만, 싫고 좋고를 정하는 문제가 아닙니다. 애초에 책임자를 자처한 것은 미카 씨 아닙니까? 언제까지나 휴양지 기분으로 있어서는 곤란합니다."
10046090-86 = "또 잔소리 시작이야~ 해변에서 그렇게 같이 떠들었으면서~"
10046090-87 = "그때와 지금은 시간도, 장소도 다르니까요. 자리에는 자리에 걸맞은 형태가 있습니다. 그러기에 격이고, 그러기에 식이죠."
10046090-88 = "트리니티의 교풍이 점차 해이해지는 것에는 저희의 과실도 적지 않습니다. 저희 티파티는 그 영향력을 자각하고, 늘 타의 모범이 되도록 경각심을 가져야 합니다."
10046090-89 = "세이아 씨도 마찬가지입니다!"
10046090-94 = "……? 저는 아무 말 안 했는데요?"
10046090-96 = "엄청난 잔소리 폭풍……."
10046090-97 = "[s] \"며칠 전, 해변에서 모습이 거짓말 같네.\""
10046090-102 = "그러게. 히히."
10046090-110 = "응?"
10046090-111 = "오오~ 이게 누구야?"
10046090-117 = "뜻밖의 선물인걸. 선생님이 먼저 어쩐 일이야?"
10046090-118 = "응? 나 혼자냐고?"
10046090-123 = "이야~ 그게 말이지. 우리가 트리니티 자치구에서 '착한 일'한 게, 어쩌다 선도부장 귀에 들어간 모양이라서."
10046090-124 = "지금 선도부는 조~~~금 만나고 싶지 않다고 할까."
10046090-125 = "그래서, 우리 든~든하신 만마전 의장님께서 선도부장 정신을 빼놓을 때까지, 잠깐 자숙기를 가지는 셈이지."
10046090-126 = "겸사겸사! 우리 부원들 여름방학도 챙겨주고 말이야! 와하하핫!"
10046090-130 = "응? 그런데 나는 왜 여기 있냐고?"
10046090-131 = "선생님도 알다시피, 이야~ 내가 인기가 좀 좋잖아?"
10046090-135 = "알아보는 사람이 워낙 많아서, 나랑 다니면 휴가가 휴가가 아니게 된단 말이지."
10046090-136 = "……그런 핑계로, 나 혼자 책 읽을 시간을 벌었다는 말씀! 와~핫핫핫하!"
10046090-137 = "설마, 다른 사람도 아닌 내가 손해 볼 상황을 자처할 거라 생각해?"
10046090-138 = "그런고로, 온천개발부는 임시 폐업 중이야. 누굴 찾아왔는지 몰라도, 유감스럽게도 나도 부원들 하나하나 어딨는지는 몰라서 말야~"
10046090-139 = "응? 아니야? 볼일은 내게 있다고?"
10046090-140 = "이거 어쩐담. 나는 자선사업가가 아니라, 공짜로 뭘 해주는 사람이 아닌데."
10046090-141 = "뭐, 선생님한테는 평소부터 이것저것 신세 지고 있으니까, 너무 야박하게 구는 것도 그렇겠지~"
10046090-142 = "그래서, 용건은 뭐야?"
10046090-143 = "[s7] \"그냥 궁금해서 말이야.\"\n[s8] \"왜 그때 이치카를 돕기로 한 거야?\""
10046090-146 = "이상한 질문이네. 전제부터 잘못되어 있잖아."
10046090-147 = "그건 계약 관계였어. 빼앗긴 공사 자재를 돌려받는다는 약속도, 프라이빗 비치를 개발하게 해준다는 약속도 전부 지켜받았지."
10046090-148 = "꼭 선의로 도움을 베푼 것처럼 말하네?"
10046090-149 = "…………."
10046090-150 = "보통 이렇게 얼버무리면 넘어가는데 말야~ 왜 선생님한테는 통하지 않을까?"
10046090-151 = "내 본심이 듣고 싶은 거지?"
10046090-159 = "글쎄?"
10046090-160 = "딱히 아무런 이유 없는데? 그런 기분이었거든."
10046090-161 = "왜, 거짓말 같아?"
10046090-165 = "오히려 누구나 그럴 때 있지 않아?"
10046090-166 = "그냥 미친 척하고, 평소라면 절대 안 할 짓거리를 하는 날."
10046090-167 = "마침 그런 날이었던 거야. 깜찍이 아가씨도, 나도 말이지."
10046090-168 = "그런 셈 치고 넘어가자고, 응?"
10046090-169 = "애초에 다 지난 이야기를 뒤적거리는 건, 별로 멋있지도 않잖아?"
10046090-175 = "부장~!!!!"
10046090-179 = "왓?!"
10046090-184 = "어라, 선생님도 같이 있었네! 마침 잘 됐다! 같이 먹으려고 아이스크림을 사 왔거든!"
10046090-185 = "부장하고 선생님한테 하나씩 주면, 내 꺼는 다시 사러 가야 하지만!"
10046090-186 = "으…… 음?"
10046090-187 = "아니, 잠깐. 잠깐만, 메구."
10046090-188 = "……응? 어라? 지금 메구가 왜 여기에 있지?"
10046090-189 = "부장, 왜 그래? 불러놓고, 갑자기 그렇게 괴로운 표정으로?"
10046090-190 = "저기, 메구? 혹시 내가 몰랐을 뿐, 사실 메구도 애독가였다든지? 그런 설정?"
10046090-191 = "어…… 아니, 책은 별로 읽고 싶지 않은데. 그림이 많은 책은 좋아하는데, 부장이 읽는 책은 글뿐이고, 글자도 되게 작고."
10046090-192 = "그건, 뭐, 그렇지? 그럴 거라 생각했어."
10046090-193 = "……그러면 메구는 왜 여기 있는 걸까?"
10046090-194 = "부장이 하고 싶은 걸 하라 했잖아? 그래서 하고 싶은 걸 하는 거야!"
10046090-195 = "음? 으으으응~?"
10046090-202 = "어라, 뭐야? 메구 반장 있었어?"
10046090-203 = "부장 혼자인 줄 알고, 반장 꺼는 못 사 왔는데 어쩌지."
10046090-209 = "……어, 혹시 내가 말을 좀 이상하게 했던가?"
10046090-210 = "그러니까 부 활동이랑 상관없이 아무거나 하고 싶은 걸 하라는 건데…… 왜 다들 여기로 돌아온 걸까?"
10046090-215 = "응? 그야…… 혼자 있으면 심심할까 봐 왔지."
10046090-216 = "그치? 부장은 냅두면 혼자 틀어박혀서 책만 읽잖아?"
10046090-217 = "아, 혹시 오해할까 봐 그러는데, 반장이랑 부장 빼고 짠 거는 아니니까?"
10046090-218 = "맞아, 우리도 이 앞에서 만난 거야."
10046090-226 = "어, 뭐야? 다들 있었잖아."
10046090-227 = "우리만 늦은 거야?"
10046090-229 = "허……."
10046090-233 = "하핫."
10046090-234 = "와~하하하핫!! 선생님, 이것 좀 봐!"
10046090-235 = "정말, 내가 부원 복이 있다고……."
10046090-236 = "그, 정말 미안한데, 선생님."
10046090-237 = "[s9] \"응, 나중에 또 올게!\"\n[s10] \"부끄러운 거구나!\""
10046090-242 = "……뭐?"
10046090-243 = "하핫."
10046090-256 = "그래, 그런 셈 치자고."
10046090-257 = "여름 하늘의 프로미스"
