[translation]
52210-1 = "제21화;타인의 시선"
52210-2 = "백화요란에 있었을 때의 나는, 언제나 시선 한 가운데 있었다."
52210-6 = "아야메."
52210-7 = "아야메 선배……"
52210-8 = "……아야메 부장!"
52210-12 = "나를 향한 그 시선은 동경과 선망인 동시에, 나를 다른 존재로 있을 수 없도록 얽어매는 주박과도 같았다."
52210-13 = "그 시선을 몸에 받고 있는 동안 나는 백화요란의 부장이라는 주어진 가면에서 벗어날 수 없었을뿐더러, 이 가면이 불편하다는 기색조차 내비칠 수가 없었다."
52210-16 = "저 꽃도 부끄러워할 법한 우아한 자태를 보셔요. 역시 아야메 부장이세요."
52210-17 = "용모단정, 규행구보, 품행방정,"
52210-18 = "백화요란의 대표란 역시 저 정도의 재원이 아니면 될 수 없는 것이겠지요."
52210-19 = "그런 아야메 부장이라면, 아무리 어려운 부탁이라도 들어줄 수 있으시지요?"
52210-20 = "……눈살이 찌푸려지는 말을 듣더라도 화내지 않으시겠지요?"
52210-21 = "……아야메 부장이니까, 괜찮으시지요?"
52210-22 = "물론, 나는 괜찮아!"
52210-23 = "—조금도 괜찮지 않았다."
52210-24 = "웃는 낯 위에 눌러 붙은 가면은 남의 얼굴을 빌려 쓴 것처럼 숨을 틀어막았고, 나를 향한 사람들의 시선은 날카로운 끌처럼 날아와 가면을 원하는 모습대로 계속 깎아냈다."
52210-25 = "입꼬리는 처지지 않도록 잡아당기고, 눈썹은 여덟 팔자를 유지하도록 잡아내리고."
52210-26 = "부탁을 받을 때는 번개처럼 반응해야 하나, 눈을 미혹시키는 부정한 것은 돌부처처럼 모른체한다."
52210-27 = "혹여 피로 탓에 가면 아래의 본모습이 조금이라도 드러나게 되면—"
52210-30 = "오늘은 아야메 부장답지 않으시네요."
52210-31 = "무슨 일이라도 있으신가요?"
52210-32 = "조금 쉬시면서 '원래의 상태'를 회복하시는 게 어떠신가요?"
52210-36 = "……끝내는 모두가 그 가면을 내 본래의 얼굴이라 여기게 되었다."
52210-37 = "나는 왜 이 가면을 뒤집어쓰기로 결심했던 걸까."
52210-38 = "사람들은 내가 왜 이 가면을 쓰기를 바라는 걸까."
52210-39 = "어째서, 다들 문제를 스스로 해결하지 못하는 걸까."
52210-42 = "저는 아야메 부장처럼 무엇이든 잘할 수 없는걸요……"
52210-43 = "아야메 부장은 무엇이든 잘하시니까요."
52210-44 = "그 가면을 쓸 수 있는 건 아야메 부장뿐이니까!"
52210-48 = "그 말처럼 나는 가면 아래의 얼굴마저 완벽한 무골호인이었던 걸까?"
52210-63 = "하지만 어둠 속에서 그림자를 마주했을 때, 나는 백련의 힘을 사용할 수 없다는 걸 깨달았다."
52210-64 = "나 자신이 완벽한 사람이 아니라는 것을 깨달았다."
52210-65 = "이대로는 안 된다는 초조함 속에서도 한 줄기 안도감이 피어올랐다."
52210-67 = "[log=아야메 황혼 1]당연해.[/log]"
52210-70 = "[log=아야메 황혼 1]이 완벽한 가면은[/log]"
52210-71 = "[log=아야메 황혼 1]나의 얼굴이 아니니까.[/log]"
52210-74 = "[log=아야메 황혼 1]이 책임은[/log]"
52210-75 = "[log=아야메 황혼 1]나의 책임이 아니었으니까.[/log]"
52210-79 = "쿠즈노하 님이 모든 걸 해결해 주실 거야."
52210-80 = "저 지긋지긋한 부탁도, 시선도, 쿠즈노하 님이 대신 받아주실 거야."
52210-83 = "돌아가자, 아야메."
52210-84 = "너도 알고 있잖아? 쿠즈노하 님은 전설 속의 존재라는 걸."
52210-85 = "하지만 그 아이는 망설임 없는 표정으로 내게 그렇게 말했다."
52210-86 = "겁이 많아 걸핏하면 울음을 터트리는 울보 주제에."
52210-87 = "나와의 대련에서 단 한 번도 승리하지 못했던 주제에."
52210-88 = "자신이 감당하지도 못할 시선이 쏟아지는 데도 도망치지 않고, 가면 벗기를 거부했다."
52210-90 = "………."
52210-94 = "……멍청한 계집애."
52210-95 = "그러니까 너는 언제나 그 자리에 머무르고 있는 거야."
52210-100 = "무슨 생각을 그렇게 하고 있어?"
52210-106 = "옛날 생각."
52210-107 = "나를 지켜보던 사람들의 시선을 떠올리고 있었어."
52210-108 = "시선?"
52210-109 = "응. 나를 바라던, 내게 바라던— 사람들의 시선."
52210-110 = "이곳은 여전히 조금도 바뀌지 않았구나."
52210-111 = "사람들은 서로의 시선을 두려워하며, 그 무엇도 스스로 해결하려 하지 않아."
52210-112 = "하지만 그런 모두를 언제나 지켜볼 수는 없었으니까."
52210-113 = "나는 모두의 시선에 응할 수 없었어."
52210-114 = "하지만 지금의 너라면 할 수 있겠지."
52210-115 = "후회와 증오를 머금어 아름답게 꽃 피운 괴담, 그 자체인 너라면 원하는 바를 이룰 수 있어."
52210-116 = "……그래."
52210-121 = "이전에는 사람들의 시선 한 가운데에 내가 있었지만,"
52210-122 = "이제는 사람들이 내 시선 아래에 있게 될 거야."
52210-147 = "아아, 아름다워……"
52210-148 = "그래. 내가 원했던 것이 바로 이 색이라니까!"
52210-149 = "역시 내 생각은 틀리지 않았어."
52210-150 = "그 아무리 기괴한 불가해라도 직접 보고 느끼지 못하면 남의 일처럼 공감할 수 없는 법."
52210-151 = "그 꼬맹이의 괴서와 달리, 이 <토테이붓카이로쿠>가 만들어 낸 백물어는 그림처럼 선명한 공포의 색을 사람들에게 억지로 이해시키고 주입시켜 줄테지."
52210-152 = "아무리 도망치고 시선을 회피하려 해도 이 시선에서는 도망칠 수 없을 테니까."
52210-153 = "아아, 이 아름다운 백물어에 이름을 붙인다면 무어가 좋을까."
52210-154 = "거리에 수많은 눈이 피어나고 있지만, 이를 통해 모두가 끝내 바라보는 풍경은 단 하나이니."
52210-159 = "그래. 단 하나의 눈, 히토츠메라 부르자."
52210-161 = "아야메. 아니, 히토츠메여."
52210-162 = "나약한 사람들에게 그대의 시선을 돌려주자."
52210-163 = "타인의 시선으로 살아갈 수밖에 없는 나약한 존재들은 눈을 뜰 가치도 없다는 것을 일깨워주자."
52210-167 = "………."
52210-169 = "다음화;축제는 계속되어야 한다"
