[translation]
1002306-1 = "모래찜질"
1002306-3 = "뭐하고 있는 거야?"
1002306-4 = "[s1] \"보시는 대로.\"\n[s2] \"모래 찜질을 하고 있어.\""
1002306-5 = "……어휴."
1002306-6 = "……어휴."
1002306-7 = "나는 선생님이 모래사장에 누워 있다기에 분명 지나가는 학생들의 치마 속을 들여다보기 위해 뭔가 꿍꿍이를 꾸미고 있다고 생각했는데……."
1002306-8 = "평범하게 모래찜질을 하고 있었다니, 다른 의미로 안심했어."
1002306-9 = "[s3] \"나를 그동안 어떻게 생각하고 있었던 거야?\"\n[s4] \"애초에 수영복에는 들여다 볼 치마가 없잖아!\""
1002306-10 = "생각해보니 그렇네. 이 근처에는 수영복 차림의 학생들만 오고 가니까."
1002306-11 = "생각해보니 그렇네. 이 근처에는 수영복 차림의 학생들만 오고 가니까."
1002306-12 = "……그래도 수상한 건 마찬가지야."
1002306-13 = "이렇게 더운 날씨에 달궈진 모래 속에 들어가 있다니……"
1002306-14 = "혹시 선생님은 고통받는 걸 즐기는 변태야?"
1002306-15 = "[s] \"이오리도 한 번 해볼래?\""
1002306-16 = "싫어. 뜨거운 모래가 맨살에 닿기만 해도 아플 것 같단 말이야."
1002306-17 = "[s5] \"생각만큼 뜨겁지는 않아.\"\n[s6] \"오히려 모래 안에 있으면 시원해.\""
1002306-18 = "뭔가 수상한데……."
1002306-19 = "뭔가 수상한데……."
1002306-20 = "하지만 선생님의 표정을 보아하니 고통을 참고 있는 것처럼 보이지는 않고……."
1002306-21 = "뭐, 잠깐이라면 괜찮겠지."
1002306-22 = "[s] \"자, 그럼 여기에 누워봐.\""
1002306-28 = "[ns] 이오리의 몸 위에 모래를 덮어준다."
1002306-30 = "……어라? 정말이네. 생각만큼 뜨겁지 않아."
1002306-31 = "몸 위에 덮힌 모래가 태양의 직사광선을 막아줘서…… 오히려 시원한 느낌이야"
1002306-32 = "[s] \"그대로 낮잠을 자도 기분 좋다고.\""
1002306-33 = "그럴 수는 없어. 선도부원이 대놓고 모래사장에서 낮잠을 자고 있다면 다른 학생들이 뭐라고 생각하겠어?"
1002306-34 = "으음…… 하지만 온 몸이 노곤하니, 확실히 졸음이 오기는 하는데……."
1002306-35 = "그러고보니 어제는 늦게까지 업무를 처리하느라 잠이 부족하기도 했고……."
1002306-36 = "………."
1002306-38 = "……으응? 어느새 잠들었던 거지?"
1002306-39 = "시원한 모래의 감촉이 기분 좋아서…… 나도 모르게 잠이 들고 말았네."
1002306-40 = "누가 보기 전에 어서 일어나야……."
1002306-45 = "……?! 어떻게 된 일이지? 몸을 옴짝달싹도 못하겠어!"
1002306-46 = "게다가 모래 찜질을 하고 있다기에는 뭔가…… 무거운 돌이 얹혀진 기분이 드는 데……."
1002306-52 = "이—게—뭐—야—!"
1002306-54 = "[ns] \"아, 일어났어?\""
1002306-55 = "선생님! 내 몸 위에 도대체 뭘 만들어 놓은 거야!"
1002306-56 = "[s7] \"예쁘게 잘 만들었지?\"\n[s8] \"섬세하게 작업하느라 고생 좀 했어.\""
1002306-57 = "감상을 물어본 게 아냐! 사람이 자고 있는 동안에 무슨 파렴치한 장난을 치는 거야!"
1002306-58 = "감상을 물어본 게 아냐! 사람이 자고 있는 동안에 무슨 파렴치한 장난을 치는 거야!"
1002306-60 = "으윽…… 게다가 이 모래 조각상, 어째서 부숴지지 않는 거야?!"
1002306-61 = "[s] \"쉽게 부숴지지 않도록 모래에 시멘트를 섞었어.\""
1002306-62 = "시멘트 가루? 장난으로도 쓸 물건이 아니잖아!"
1002306-63 = "어째서 모래 장난에 시멘트 가루를 섞는 건데!"
1002306-64 = "[s] \"모처럼 만든 조각상이 부숴지면 아까우니까…….\""
1002306-65 = "그런 건 사람 몸 위가 아니라 다른 곳에 세우라고!"
1002306-66 = "으윽…… 젠장! 손이 닿는 곳에 폭탄이라도 있었다면……."
1002306-67 = "[s] 핸드폰을 들어 이오리의 사진을 찍는다."
1002306-74 = "뭐, 뭐하는 거야! 그만둬!"
1002306-76 = "찍지 마! 찍지 말라고!"
1002306-77 = "으윽…… 여기서 빠져나가기만 해봐! 가만두지 않을 테니까!!"
1002306-79 = "(이후, 한식경 넘게 이오리가 버둥대는 것을 지켜보다가 모래 조각에서 꺼내주었다.)"
1002306-84 = "(……그리고 모래 조각에서 빠져나온 이오리에게 주먹을 맞았다.)"
