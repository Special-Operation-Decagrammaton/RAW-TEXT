[translation]
10031080-1 = "에필로그;파티 개시"
10031080-2 = "(그야말로 모든 문제를 순식간에 해결해 버린 뒤, 새삼스럽지만 다시금 게헨나 특별 파티는 처음부터 시작되게 되었다.)"
10031080-6 = "그럼, 다녀올게. 선생님. 아코."
10031080-7 = "네! 히, 힘내세요! 부장님!"
10031080-13 = "[ns] \"응. 히나, 다녀와.\""
10031080-18 = "크읏! 소, 소라사키 히나……! 선도부장 녀석……!"
10031080-19 = "이 몸의 노림수 따윈 전부 분쇄하고…… 이 자리까지 오다니……!"
10031080-20 = "응~ 히나 선배~ 멋있었어~"
10031080-21 = "이, 이부키?!"
10031080-27 = "선배…… 이젠 슬슬 인정하시죠…… 이번 파티도 결국엔 만마전……까지는 아니고, 마코토 선배가 진 거라는 걸."
10031080-33 = "푸핫! 이로하 쨩! 너무 정곡인 거 아냐?"
10031080-34 = "뭐, 마코토 쨩에겐 늘 있는 일이니까."
10031080-36 = "아니! 아니다! 아직 끝이 아니야……!"
10031080-37 = "그 촉박한 시간 속에서…… 히나 녀석이 제대로 피아노 연습을 해냈을 리가 없지!"
10031080-38 = "그런 주제에 겁도 없이 현장에 나타나다니…… 이래서야 녀석이 창피를 당하는 것도 불 보듯 뻔한 일일 터!"
10031080-39 = "아니아니, 그 말 전체가 플래그 아니냐구요……."
10031080-41 = "……………"
10031080-43 = "(열심히…… 연습을 해왔어………)"
10031080-44 = "(다른 누구도 아닌, 당신의 기대에 부응하기 위해서.)"
10031080-45 = "(그러니 나는 당신을 위해………)"
10031080-48 = "………지금 내가 할 수 있는, 전력을 다할 뿐이야."
10031080-74 = "[ns] \"………굉장했어.\""
10031080-78 = "…………크아아앗! 다, 당했다!"
10031080-79 = "이, 이런 연주를…… 아니! 히나, 녀석은 분명 피아노를 못 친다고 했을 터……!"
10031080-80 = "아니, 설마…… 그 정보는…… 처음부터 이쪽의 혼란을 유도한…… 역정보였나……?!"
10031080-81 = "서, 선도부 녀석들……! 언제까지 이 몸을 방해해야 속이 후련하단 말인가………!"
10031080-82 = "[s] \"아니, 이 무대를 준비한 건 마코토였으니까…….\""
10031080-83 = "네, 결국 마코토 선배가 자초한 거라고요."
10031080-84 = "………헉! 그, 그랬던가?! 크아아악!!!"
10031080-91 = "……후우."
10031080-96 = "부장님! 굉장했어요!"
10031080-102 = "부장! 언제 그렇게 피아노를 잘 치게 된 거야?!"
10031080-103 = "굉장히 멋지고…… 아름다웠어요."
10031080-108 = "아, 응. 다들…… 고마워."
10031080-109 = "어떻게든 시간에 맞출 수 있었네……."
10031080-110 = "[s] \"고생했어. 히나의 연주…… 확실하게 가슴에 와닿았어.\""
10031080-111 = "아, 서. 선생님……"
10031080-112 = "으응, 당신이 그렇게 말해준다면…… 노력한 보람이 있네."
10031080-113 = "고마워. 정말로."
10031080-114 = "[s1] \"그건 그렇고 정말 고생 많았어. 사건도 해결하랴, 연주도 준비하랴…….\"\n[s2] \"몸은 괜찮아? 혹시 무리하느라 몸 상태가 안 좋아지기라도 했다든가…….\""
10031080-117 = "응?"
10031080-118 = "아니, 선생님이 그렇게 말할 정도의 무리 같은 건 하지 않았는걸?"
10031080-119 = "[s] \"그렇게 말하기엔 엄청나게 다이나믹한 나날이지 않았어……?\""
10031080-120 = "아, 마코토 의장이 꾸몄던 이번 일 말이지."
10031080-121 = "뭐…… 살짝 힘들긴 했어도……"
10031080-122 = "만마전이 이런 일을 벌이는 건 늘 있는 일이니까. 이번에도 그렇게 고생했다는 느낌은 아닌걸?"
10031080-123 = "네, 마코토 의장의 이런 제멋대로 폭주는 늘 있는 일이니까요. 새삼스럽지 않긴 하죠."
10031080-124 = "[s] \"……저기, 어느 정도 빈도로 이런 소동이 일어나는데?\""
10031080-125 = "체감적으로 따지자면……"
10031080-126 = "1년에 4번 정도……?"
10031080-129 = "게헨나에선 일상 같은 거지."
10031080-130 = "오히려 의장이 가만히 있으면, 그게 더 우려될 정도라고 할까요?"
10031080-131 = "[s] \"……………무섭다……! 게헨나의 일상!\""
10031080-133 = "자, 이러고 있을 게 아니라. 파티는 이제 막 시작된 거잖아?"
10031080-134 = "괜찮다면……… 에스코트해 주지 않을래? 선생님."
10031080-135 = "[s] \"나라도 괜찮다면, 기꺼이.\""
10031080-136 = "후훗. 그럼."
10031080-142 = "───부탁할게. 선생님."
10031080-144 = "(수많은 소동이 이어진 끝에, 마침내 진정으로 즐거운 파티는 이렇게 시작된다.)"
10031080-145 = "빛으로 나아가는 그녀들의 소야곡"
