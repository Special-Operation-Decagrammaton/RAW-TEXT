[translation]
10046270-3 = "저기요."
10046270-5 = "앗, 티파티 임원분들 아니십니까?"
10046270-6 = "뭔가 도움 필요하신 일이라도?"
10046270-8 = "아, 그 반대예요. 오히려 저희가 도와드릴 게 없을까요?"
10046270-9 = "아무래도 혼자 너무 고생하고 계신 거 같아서."
10046270-11 = "하하…… 말씀만으로도 감사하지 말임다."
10046270-13 = "역시, 사람이 더 필요했던 거 아니야?"
10046270-14 = "나기사 님께서 하신 일이니까, 무슨 생각이 있으셨겠죠."
10046270-15 = "그야 그렇지만, 나기사 님은 현장 쪽이 어떻게 돌아가는지는 잘 모르시니까……."
10046270-16 = "그건, 뭐……."
10046270-17 = "당신도 그렇게 생각하지 않아요?"
10046270-19 = "저, 저 말임까?!"
10046270-21 = "나기사 님은 현장직의 고충을 너무 모른다니까요~"
10046270-22 = "그야 일일이 그런 걸 신경 쓸 수 있는 위치는 아니긴 하시지만, 그래도 말이죠~"
10046270-24 = "아하하하……."
10046270-26 = "뭐, 이렇게 불평불만만 늘어놔도 일이 돌아가는 것도 아니고."
10046270-27 = "그래서 저희가 도와드리러 왔어요."
10046270-29 = "이야…… 안 그래도 막막하던 참인데, 감사하지 말임다."
10046270-30 = "그러면 잘 부탁드리겠습니다!"
