[translation]
21090-1 = "제9화;유우카의 질문"
21090-2 = "밀레니엄 게임개발부"
21090-3 = "아리스 양, 게임개발부의 협박에 어쩔 수 없이 이 자리에 있는 거라면 (소근소근) 왼쪽 눈을 깜빡거려."
21090-4 = "(멀뚱멀뚱)"
21090-5 = "대체 뭐 하는 짓이야! 그게 질문이냐! 그런 짓 안 해!!"
21090-10 = "자! 보라고! 이 눈부신 학생증을! 틀림없는 우리 밀레니엄 학생이란 말야!"
21090-11 = "흐음…… 분명 학생증이나 학생명부 안에 아리스가 등록되어 있다는 건 확인했지만……"
21090-12 = "나는 그렇게, 쉽게 속아주는 여자가 아니야."
21090-14 = "(뜨끔)"
21090-15 = "(바, 발각당한 걸까?!)"
21090-17 = "자, 그럼 취조를 시작해볼까."
21090-18 = "이제 숨길 생각도 안 하는구나……."
21090-20 = "아리스 양. 당신이 게임개발부에 오게 된 계기는 뭐야?"
21090-21 = "정신을 차렸을 땐 이미 이곳이었…… 이 아니라……."
21090-22 = "모모이, 아리스를 째려보지 말아 줄래?"
21090-23 = "어…… 마왕성 드라큘라가 하고 싶었는데…… 게임개발부가 있다는 소식을 듣고……."
21090-24 = "흐음…… 그렇군."
21090-25 = "(좋아! 아리스 쨩. 잘하고 있어)"
21090-26 = "이곳은 고전게임클럽도 아닌, 어디까지나 게임개발부야."
21090-27 = "즉 당신도 개발에 참여하고 있다면, 이곳에서 담당하고 있는 역할이 뭐야?"
21090-28 = "탱커 겸 명 속성 근접 투사……."
21090-29 = "뭐?"
21090-30 = "가 아니라…… 그러니까…… 프, 프, 프…… 프로글래머 입니다!"
21090-31 = "……어? 프로그래머 아니야?"
21090-32 = "아, 예. 그렇습니다. 맞습니다. 틀림없이, 나는 완벽한 프로그래머 입니다."
21090-33 = "(망…… 했다!)"
21090-34 = "프로그래머라…… 무척 어려운 일이라고 알고 있는데."
21090-35 = "아, 그, 맞습니다. 프, 프로그래머는 힘듭니다. 때로는 과로 때문에 죽기도 합니다."
21090-36 = "뭐, 뭐라고?!"
21090-37 = "그래도 괜찮습니다!"
21090-38 = "아니…… 어떻게 괜찮……"
21090-39 = "보통 여관에서 자고 일어나거나 성당에 돈을 내면 동료들도 부활해 있습니다!"
21090-40 = "어라…… 그, 그럴 리가 없잖아!?"
21090-41 = "……그럴 리가 없다뇨……? 상식인데…… 혹시…… 영웅신화나 마검전설 모르십니까?"
21090-43 = "진짜 '갓겜'입니다."
21090-44 = "……."
21090-46 = "……모든 게 끝났어……."
21090-48 = "……."
21090-49 = "그래. 알겠어."
21090-50 = "아리스 양, 나는 당신의 정체를 이제 확신할 수 있어."
21090-52 = "(망했어!)"
21090-53 = "(어떡해!)"
21090-56 = "……?!"
21090-57 = "좀 수상한 점이 있지만……"
21090-58 = "새로운 세상을 모험하고, 동료들과 함께, 무언가를 이루는 이야기를 좋아하는……"
21090-60 = "게임개발부 학생이라는 건 의심할 여지가 없네."
21090-62 = "어……?"
21090-63 = "그, 그렇다면?!"
21090-65 = "인원수를 채웠으니 게임개발부를 클럽으로서 인정……. 부 활동 유지를 승인합니다."
21090-67 = "오오오오!"
21090-68 = "해냈다!"
21090-69 = "그, 그럼 부실을 써도 되는 거지! 부비도 받을 수 있고!"
21090-70 = "물론이지."
21090-71 = "'이번 학기' 까지 말야."
21090-72 = "우와와…… 어?"
21090-73 = "뭐, 뭐, 뭐라고?!"
21090-74 = "어째서! 정족수도 다 채웠는데!"
21090-76 = "어머. 말하지 않았던가."
21090-77 = "'이제'는 클럽의 정족수를 채우는 것뿐 아니라, 부서로서의 성과를 증명해야 한다고."
21090-78 = "물론 갑자기 약관이 바뀐 만큼 유예기간은 주겠지만……."
21090-79 = "이번달 내로 결과를 내지 않으면, 너희 부는 인원이 4명이건 400명이건 폐부 확정이야!"
21090-80 = "마, 말도 안 돼!"
21090-81 = "돼! 예전에 모든 클럽 부장들을 모아 한 번 설명했던 내용이라고."
21090-82 = "물론, 너희 부장 유즈는 참여하지 않았지만."
21090-83 = "?!"
21090-84 = "즉, 너희 책임이야!"
21090-85 = "크윽……비겁하다아!"
21090-86 = "비겁하다니, 규칙을 준수하는 게 어째서 비겁하다는 거야."
21090-87 = "사실 아리스 양의 정체도 수상하고, 원래대로라면 오늘 당장 퇴거를 요청하려 했지만……."
21090-88 = "?!"
21090-89 = "……정체야 상관없이, 게임을 좋아하는 순수한 열정은 확인할 수 있었어."
21090-90 = "유예를 주는 것은 그 열정이 걸맞은 결과를 낼 수 있기를 기대하기 때문이야."
21090-91 = "모모이, 네가 말했지? 밀레니엄 프라이스에서 깜짝 놀랄만한 결과를 내겠다고."
21090-92 = "그건…… 그랬지만."
21090-93 = "새로운 멤버도 생겼으니, 전작보다 더 재미있는 게임을 만들 수 있겠지?"
21090-94 = "그럼 기대할게. 안녕~"
21090-97 = "야! 기다려! 이 사기꾼아! 흐와아아앙!"
21090-98 = "가버렸…… 어……."
21090-100 = "으음……."
21090-101 = "결과적으로, 게임개발부의 존폐위기는 사라지지 않았네."
21090-102 = "으으! 분해! 아무리 생각해도 이건 사기야! 수작이라구!!"
21090-103 = "……미안. 내가 클럽 총 회의에 참여하지 못해서……."
21090-104 = "유, 유즈 쨩 탓이 아니야! 이런 경우 언니가 대리로 참석하기로 한 거 아니었어?"
21090-105 = "……어쩔 수 없었어."
21090-106 = "그때는 아이템 드랍율 2배 기간이었단 말야."
21090-107 = "당장 그 게임을 삭제해!"
21090-108 = "으으…… 어쨌든, 결론은 하나뿐이네."
21090-109 = "그래."
21090-110 = "밀레니엄 프라이스에 나갈 수 있는 게임을 만드는 것."
21090-111 = "결국에는 G.Bible이잖아! 흐와아앙! 그 폐허에 다시 가야 해?! 싫어!"
21090-112 = "……."
21090-116 = "……책임을 져야 해."
21090-117 = "응? 뭐라고 했어 유즈 쨩?"
21090-118 = "다시 G.Bible을 찾으러…… 폐허로 간다면…… 나도 함께 갈게."
21090-119 = "뭐, 뭐, 뭐라고?!"
21090-120 = "너 반년간 교사 밖으로 나간 적 한 번도 없잖아. 수업도 인터넷 수강으로만 진행하고 있고."
21090-121 = "……내 잘못…… 이니까. 그리고…… 이 부실은…… 더 이상 나만의 것이 아니야."
21090-122 = "함께…… 지킬 수 있게 해줘."
21090-123 = "유즈 쨩……."
21090-126 = "뽜밤뽜밤. 유즈가 동료로 참가했습니다."
21090-127 = "……그래. 좋아! 해보자!"
21090-128 = "아리스 쨩! 너도 무기랑 장비 챙겨!"
21090-131 = "아이템을 갖춥니다. 빛의 검: 슈퍼 노바를 장비 했습니다."
21090-134 = "좋은 의욕이야. 가자! 이번에야말로, G.Bible을 손에 넣고야 말겠어!"
21090-135 = "……"
21090-136 = "……응."
21090-137 = "다 함께! 부실을 지키는 거야!"
21090-139 = "다음화;다시, 폐허로."
