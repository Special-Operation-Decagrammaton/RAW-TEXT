[translation]
32170-1 = "제17화;그런 세계 1"
32170-2 = "으, 크으윽……!!"
32170-8 = "이, 이긴 거야……? 우리가?"
32170-9 = "전원 전투 불능."
32170-10 = "선생님의 전술 지휘는 대단하니까…… 아우……."
32170-14 = "이제 겨우 고비를 넘겼을 뿐이에요."
32170-15 = "곧 아리우스의 지원군이 도착할 거고…… 우리는 그때까지 시간을 끄는 것이 목적……."
32170-16 = "그때까지 정의실현부가 돌아와준다면 이 대규모 기습은 무위로 끝나게 될 거예요……."
32170-17 = "마, 맞아! 하스미 선배에게 연락을 취해놨어! 곧 답장이 올 거야!"
32170-18 = "네. 티파티의 명령을 수행 중인 정의실현부를 움직일 수 있는 유일한 방법은 바로 티파티의 신변에 문제가 생기는 것뿐."
32170-19 = "지금쯤이면 하스미 씨는 나기사 씨에게 문제가 생긴 것을 알아차렸을 거예요."
32170-20 = "거기에 코하루 쨩의 연락도 있었으니, 정의실현부가 상황을 확인하기 위해 돌아오는 건 시간문제예요."
32170-21 = "다만, 조금만 빨리 와줬으면 하지만……."
32170-25 = "?!"
32170-26 = "이건……."
32170-35 = "즈, 증원……? 이렇게 빨리……?"
32170-36 = "어, 어째서……?"
32170-44 = "숫자가……. 팀 단위가 아냐. 이건 대대단위야. ……분교의 절반 가까이가……."
32170-45 = "아, 아우……. 이 정도나 되는 사람들이 학원에 침입했는데 어째서 이렇게 조용한 거죠……?"
32170-46 = "정의실현부가 아직도 움직이지 않은 건가요……?"
32170-47 = "응, 그야 당연하잖아?"
32170-49 = "……다, 당신은?!"
32170-54 = "왜냐면, 이제부터 얘네들이 트리니티의 공식 무력집단이거든."
32170-55 = "[s] \"미카……?\""
32170-56 = "응, 오랜만이야. 선생님. 다시 보게 되니 좋네."
32170-57 = "정의실현부는 움직이지 않아. 내가 그렇게 명령했으니까."
32170-58 = "오늘 이상하게 학원이 조용하다고 생각하지 않았어? 당연하지. 방해가 될만한 것들은 모두 치워놨거든."
32170-59 = "티파티의 명령이 닿는 곳은 전부 이런 저런 걸로 발을 묶어뒀어."
32170-60 = "나기 쨩을 습격하는데 방해되지 말라고 말야."
32170-61 = "티파티의 미소노 미카 씨…… 당신이 어째서 여기에……."
32170-62 = "여기서는 마치 흑막 등장☆ 같은 느낌으로! 응. 내가 지금까지의 모든 계획의 실체야."
32170-63 = "내가 <트리니티의 진짜 배신자>니까."
32170-64 = "……."
32170-65 = "……."
32170-66 = "……?!"
32170-68 = "그러니까, 나기 쨩을 어디다 숨겼는지 말해주지 않을래? 나도 시간이 없어서 말야."
32170-71 = "뭐, 여기 있는 사람들을 다 없애버리고 이곳을 쥐잡듯이 수색해도 상관없지만."
32170-73 = "[ns] \"미카…… 어째서…….\""
32170-74 = "응? 왜 이런 짓을 했냐고? 선생님? 그렇게 묻는 거야?"
32170-75 = "응, 그야, 게헨나가 싫으니까."
32170-76 = "나는 게헨나가 진짜, 너무너무 싫거든."
32170-77 = "……에덴조약의 취소? 그게 목적이었나요, 미카 씨?! 나기사 씨를 노린 건……."
32170-78 = "어라…… 누구더라? 미안해, 나는 얼굴 기억하는 게 힘들어서……."
32170-79 = "아, 기억났어. 하나코였지? 채플 수업 때 수영복 차림으로 입장했다가 쫓겨났던. 아하하하."
32170-80 = "……."
32170-81 = "아하하. 맞아. 나기 쨩이 이상한 걸 하려고 해서 말야. 에덴조약 같은 말도 안 되는걸."
32170-82 = "그 게헨나의 뿔달린 녀석들과 평화 조약이라니, 끔찍해서 소름 돋을 거 같아."
32170-83 = "반드시 배신당할 걸? 게헨나 녀석들에게 뒤를 보였다간 바로 찔리게 될 거야."
32170-84 = "그런 꼴을 절대 볼 수 없어."
32170-85 = "나기 쨩도 참. 그렇게 편리한 이야기가 있을 리가 없잖아. 이게 단순하고 즐겁기만 한 학원의 순진한 이야기였으면 좋겠지만……."
32170-86 = "응. 그렇지 않은걸. 말하자면, 우리에겐 이런 게 어울린다는 걸 슬슬 인정해주지 않으려나……."
32170-87 = "그러니까 나기 쨩을 돌려줘. 해치진 않을 거야. 평범한 학생으로 남은 시간을 감옥 교실에서 보내겠지만, 나쁘진 않을 거고."
32170-88 = "[s] \"역시 에덴조약은 평화조약이 맞았구나.\""
32170-89 = "응. 선생님. 그땐 속여서 미안해. 내가 했던 말은 거짓말이었어."
32170-90 = "나기 쨩은 순진한 바보라서 에덴조약을 무력 동맹으로 활용할 수 있을 리가 없거든. 그건 평화조약이 맞아."
32170-91 = "하지만 거짓말만 한 건 아냐. 선생님."
32170-92 = "내가 아리우스와 화해하고 싶다는 건 진짜였으니까."
32170-96 = "자, 이것 봐. 게헨나를 증오하는 동지들을."
32170-97 = "전에도 말한 적 있지? 아리우스도 한때 트리니티의 일원. 게헨나를 싫어하는 건 우리 못지 않아. 아니, 이 친구들이야말로 증오로 똘똘 뭉쳐진 집합체 같은 거지."
32170-98 = "그래서 나와 뜻을 같이할 친구들에게 도움을 청한 거야. 게헨나와 평화 조약을 맺으려는 나쁜 악당을 물리쳐달라고."
32170-99 = "호스트 나기사에게 정의실현부가 있었다면, 호스트 미카에게는 앞으로 아리우스가 있을 거라고."
32170-100 = "응. 이건 그런 종류의 거래. 화해의 제스처라고 할까……?"
32170-101 = "공동의 적을 위해 한때의 원수들이 손을 잡는 거니까. 그래서 내가 아리우스를 남몰래 지원해준 거야."
32170-102 = "아리우스는 처음부터 트리니티의 쿠데타의 도구였던 건가……."
32170-103 = "응. 그러게. 이건 쿠데타라고 볼 수도 있겠네. 나기 쨩을 실각시키고 내가 티파티의 호스트가 되는 거니까."
32170-104 = "지금까지 신세 많았어. 아즈사. 난 널 잘 모르지만, 그래도 네가 나에게 소중한 존재라는 건 변치 않아."
32170-105 = "왜냐면 네가 나기 쨩을 해친 범인이 되어줘야 하거든."
32170-106 = "……!!"
32170-107 = "죄를 뒤집어 씌울 희생양인 거지. 그야, 그런 게 있어야 모두가 안심하고 발을 뻗고 잘 수 있잖아?"
32170-108 = "이곳엔 그런 게 있어 왔어. 흔히 있는 일이잖아? 여기는 그런 세계니까."
32170-109 = "……."
32170-110 = "그치만 깜짝 놀랐다구. 나기 쨩이 정체불명의 존재에게 습격당했다고 해서, 내 계획이 틀어지는 줄 알고 이렇게 달려왔는데."
32170-111 = "흐음. 설마 보충수업부가 움직였을 줄은. 아하하. 이건 예상 못했어."
32170-112 = "[s] \"넌 티파티의 호스트가 되려고 이런 짓을 저지른 거야?\""
32170-113 = "응. 맞아."
32170-114 = "그치만 권력욕 때문에 내가 이런다고 생각하진 말아줘. 선생님."
32170-115 = "나는 그저…… 게헨나를 키보토스에서 지워버리고 싶을 뿐이니까."
32170-116 = "[s] \"…….\""
32170-117 = "트리니티 안의 비둘기 파를 모두 다 숙청하고, 빈자리를 아리우스로 채울거야."
32170-118 = "새로운 연합이 탄생하는 거려나? 필요하면 새로운 공의회라도 열지 뭐. 응. 그것도 나쁘지 않겠어."
32170-119 = "그리고…… 새롭게 재무장한 트리니티는 게헨나와 전면전을 벌이는 거야. 그게 내 계획."
32170-120 = "[ns] \"거기까지 해!!\""
32170-121 = "우와, 까, 깜짝이야."
32170-122 = "응. 선생님. 화가 난 건 알겠어. 미안. 내가 너무 격식없이 굴었지?"
32170-127 = "일단…… 상황을 정리해놓고 마저 이야기해볼까?"
32170-131 = "조심해, 선생님."
32170-132 = "저 사람은…… 강해."
32170-133 = "응. 말했잖아. 나는 꽤 강하다고."
32170-134 = "자아, 보충수업부를 정리해."
