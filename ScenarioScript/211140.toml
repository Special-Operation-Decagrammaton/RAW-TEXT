211140-46 = ""
211140-47 = "Regarding the reason we're here..."
211140-48 = "Let's see. What if we said that it's to restore the Pandemonium Society's stature?"
211140-49 = "And what do you mean by that?"
211140-50 = "As you've undoubtedly noticed, the Gehenna Heritage League's influence expands by the day."
211140-51 = "And Gehenna student life satisfaction surveys have reached unprecedented levels since we've arrived."
211140-52 = "Wh-What about it?!"
211140-53 = "Campus accidents and incidents have plummeted, and the district's domestic market share has bloomed with activity."
211140-54 = "Some students ask why the Pandemonium Society never took this kind of initiative, given they had SO long to do it."
211140-55 = "People are even saying that perhaps we should have an...election."
211140-56 = "To think that some students believe that the Heritage League should replace the Pandemonium Society..."
211140-57 = "U-Ugh..."
211140-59 = "She's not lying. I've heard it too."
211140-60 = "Makoto, is your re-election at stake?"
211140-62 = "You..."
211140-63 = ""
211140-65 = ""
211140-66 = "Frankly, we'd hate to see our relationship come to that."
211140-67 = "Why?"
211140-68 = "We believe that the Gehenna Heritage League should stick to...\"supporting\" the Pandemonium Society."
