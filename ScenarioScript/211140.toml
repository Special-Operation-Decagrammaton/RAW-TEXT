211140-34 = "หัวเราะเหรอ?"
211140-35 = "เจ้าพวกนี้ ช่างอวดดีนัก! จงบอกมาตามตรงว่าทำไมถึงมาหาแพนเดโมเนียม โซไซตี้แห่งนี้!"
211140-36 = "มาขอให้ช่วยเหมือนคราวก่อนอีกหรือ? วันนี้โอกาสที่ทุกอย่างจะเป็นไปตามความต้องการของพวกเธอ#nนั้นแทบจะเป็นศูนย์ เพราะงั้นก็เตรียมใจไว้ให้ดี แล้วค่อยพูดมา!"
211140-37 = "อึก... อย่างที่คิดไว้เลย แรงกดดันจากออร่ารุนแรงจริงๆ...!"
211140-38 = "หัวหน้า ตรงนี้ให้ฉันจัดการเองค่ะ"
211140-39 = "โอ้โห จะเข้าโหมดขุนนางกังฉินอีกแล้วสินะ โชโกะจัง"
211140-40 = "เงียบไปเลยค่ะ ฉันคิดเอาไว้หมดแล้ว"
211140-42 = "มากระซิบกระซาบอะไรกันอยู่หน้าเราน่ะ? ถ้าไม่มั่นใจก็กลับไปกันได้แล้ว!"
