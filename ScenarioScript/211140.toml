[translation]
211140-1 = "제14화;불꽃 아래의 그림자"
211140-2 = "만마전 집무실"
211140-5 = "마코토 쨩~ 마코토 쨩~"
211140-11 = "뭐지, 사츠키?"
211140-12 = "재흥위원회에서 찾아왔는데. 아, 선생도 같이."
211140-13 = "하! 이 무도한 후배 녀석들이 무슨 낯짝으로 찾아왔을지 궁금하군."
211140-14 = "저번에는 어쩌다 넘어갔지만, 이번에는 선생이 함께 있다 하더라도 쉽지 않을 것이다."
211140-16 = "과연……."
211140-18 = "좋다, 안쪽으로 부르도록!"
211140-19 = "오케이, 들어와~"
211140-25 = "안녕, 의장님!"
211140-26 = "[s] \"안녕, 마코토.\""
211140-28 = "이 몸, 하누마 마코토 님께서는 썩 안녕하지 못하셨지만……"
211140-29 = "그래도 선생의 인사는 받도록 하지. 우리 만마전의 가장 큰 협력자이니 말이다."
211140-30 = "후훗……."
211140-34 = "웃는다고?"
211140-35 = "이 녀석들, 당돌하구나! 어째서 이 만마전을 찾았는지, 바른대로 고하렷다!"
211140-36 = "또 저번 같은 청탁이냐?#n오늘 너희의 뜻대로 이뤄질 확률은 그야말로 0에 수렴할 터이니, 각오하고 말하도록!"
211140-37 = "으윽…… 역시 영압이 강하네……!"
211140-38 = "회장, 여기서는 제가."
211140-39 = "오오, 또 간신 모드 들어가는 건가. 쇼코 쨩."
211140-40 = "시끄러워요. 다 생각이 있습니다."
211140-42 = "이몸 앞에서 뭘 그리 쑥덕거리고 있는 거지? 자신 없으면 돌아가도록!"
211140-47 = "저희가 어째서 의장님을 찾았는가……."
211140-48 = "글쎄요. 만마전의 위신을 세워 드리기 위함이라고 하면, 어떨까요?"
211140-49 = "그건 무슨 말이지?"
211140-50 = "현재 저희 게헨나재흥위원회의 영향력이 갈수록 확대되고 있다는 것 정도는 알고 계시겠지요."
211140-51 = "저희가 활동을 시작한 뒤부터 게헨나 학생들의 생활 만족도 조사 결과가 이전의 결과를 아득히 상회하고 있다는 것도요."
211140-52 = "그, 그게 뭐 어쨌다는 거냐!"
211140-53 = "교내 사건 사고도 큰 폭으로 줄어들었고, 자치구의 내수 시장도 훨씬 더 활성화되었지요."
211140-54 = "그동안 만마전에서는 어째서 이런 일을 하지 않았냐는 의견도 있고……"
211140-55 = "일각에서는 선거 이야기도 나오고 있는 상황입니다."
211140-56 = "차라리 저희 재흥위가 만마전의 역할을 대신하는 쪽이 낫지 않느냐며……."
211140-57 = "크, 크윽……."
211140-59 = "저거 거짓말은 아니거든요. 실제로 나온 이야기이긴 한데……."
211140-60 = "마코토 쨩, 이거 연임 위기?"
211140-62 = "이 녀석들……."
211140-66 = "사실, 그쪽은 저희도 바라는 바가 아닙니다."
211140-67 = "뭐라?"
211140-68 = "저희 게헨나재흥위원회는 어디까지나 만마전의 서포트에서 그쳐야 한다고 생각합니다."
211140-69 = "……그건 대체 무슨 소리냐."
211140-71 = "쇼코? 이게 무슨 말이야?"
211140-72 = "회장, 쇼코 쨩이 뭔가 생각이 있나 봐. 일단 들어보자."
211140-73 = "으음……."
211140-75 = "재흥위는 어디까지나 아마추어 학생들의 모임. 지금은 열정과 패기로 가시적인 성과를 이뤄낼 수 있지만, 아무래도 경험이 부족합니다."
211140-76 = "교내의 정책을 결정하거나, 큰 그림을 그려야 하는 상황에도 유연하고 능숙하게 대처하리라는 보장은 없습니다."
211140-77 = "만약 저희가 학생회 역할을 한다 해도, 여러 번 실수를 거듭할 테고 기껏 쌓아 올린 인망도 갉아 먹히겠죠."
211140-78 = "흠……."
211140-79 = "그렇기에, 지금처럼 게헨나를 더욱더 위대하게 만들 수 있는 것은 만마전의 역할이라고 생각합니다."
211140-80 = "저희 재흥위원회도, 선도부도 아닌 오직 만마전만이 해낼 수 있는 일이지요."
211140-81 = "……."
211140-82 = "키시싯, 역시 그렇단 말이지. 말이 통하겠어!"
211140-87 = "이 하누마 마코토 님이야말로 그에 걸맞은 참 리더라는 말을 해올 줄이야!#n제법이구나, 게헨나재흥위원회!"
211140-88 = "딱히 그런 말은 안 했는데요."
211140-89 = "아, 네…… 뭐 비슷한 말로 들려도 상관없습니다."
211140-90 = "하지만."
211140-96 = "게헨나의 평범한 학생들은 그렇게 생각하지 않아 문제지요."
211140-97 = "흥, 그럴 리 없다! 만마전 예산의 6할 이상은 언제나 하누마 마코토 님의 위대함을 설파하기 위해 사용하고 있을 터."
211140-98 = "학생들이 만마전의 존재감은 희미하게 인지하더라도, 이 마코토 님을 모르는 학생은 존재하지 않는다!"
211140-100 = "마코토 쨩, 그 반대 같은데……."
211140-102 = "여기서는 체계적인 숫자가 나설 차례군요. 자, 보십시오."
211140-107 = "얼마 전, 반짝반짝부가 교내 방송을 진행했을 때의 청취율입니다."
211140-108 = "평소 마코토 의장의 찬가가 나올 때보다 무려 800% 이상 증가한 수치가 보이실지요."
211140-109 = "뭐, 뭐냐! 저 그래프는……!"
211140-111 = "팩트로 때린다는 거네요. 하긴, 그때 엄청 흥했었죠."
211140-112 = "아쉽네. 나는 밖에 나가 있어서 못 들었는데."
211140-114 = "이 지표가 나타내는 것은 명확합니다. 학생들은 새로운 것에 열광하고, 여러 번 반복된 내용은 지루해하는 것이죠. 아니, 무관심에 가깝습니다."
211140-115 = "따라서 만마전의 영향력을 증대하기 위해……"
211140-116 = "이제는, 전략을 바꿔야 합니다."
211140-117 = "무슨 말을 하고 싶은 것이냐, 이가라시 쇼코!"
211140-118 = "저희 게헨나재흥위원회에게 정당한 방송 권한을 주십시오."
211140-119 = "……또 그 이야기군."
211140-120 = "교내 방송을 지금까지처럼 단순한 소식 전달처로 사용하지 않고, 보다 적극적인 컨텐츠 제작 창구, 그리고 소통의 창구로서 활용하는 겁니다."
211140-121 = "게다가, 저희라면 보다 세련된 방식으로 만마전의 홍보 또한 겸할 수 있습니다."
211140-123 = "오, 괜찮지 않을까요? 저희 교내 방송 중단된 상태였고."
211140-125 = "지금처럼 방송이 중단된 상태로 계속 내버려두는 것도 만마전의 권위를 실추시키는 일이지요.#n시스템의 부재는 행정력에 대한 의심을 불러오게 마련입니다."
211140-126 = "크흠…… 달리 맡길 수 있는 인재가 없어 피치 못하게 그대로 두고 있었다만……."
211140-127 = "……."
211140-128 = "그 빈 곳을 재흥위원회가 채울 수 있다는 말인가?"
211140-129 = "네. 지금까지 학생들을 사로잡는 저희의 실력을 보시지 않았습니까?"
211140-130 = "그건…… 인정해야겠군."
211140-131 = "[s] (마코토, 거의 다 넘어갔구나…….)"
211140-133 = "흐응, 어쩔까. 마코토 쨩."
211140-142 = "흥, 좋다! 다른 녀석들이 판을 깔았다면, 그 위에서 춤추는 것은 이 마코토 님이 되어야 마땅하지!"
211140-143 = "재흥위, 너희들의 꿈을 이 몸께서 철저히 이용해주마!!"
211140-145 = "그 무지몽매한 선도부 녀석들은 이런 큰 그림은 꿈도 못 꾸겠지! 키시싯!!"
211140-147 = "우와, 뭔가 기분은 나쁜데 어쨌든 방송실에 들어갈 수는 있게 됐네."
211140-148 = "근데 뭔가 만마전의 하수인이 된 것 같아서 기분 나쁜데……."
211140-150 = "다 계획이 있습니다."
211140-152 = "데헷, 그럼 사진 한 방!"
211140-163 = "만마전과 재흥위의 역사적인 협약 순간이랄까요! 이건 꽤 큰 토픽이 될 거라는 예감!"
211140-164 = "[s] \"어떻게 또 잘 해결됐구나…….\""
211140-165 = "흐응~ 하지만 방송실 설비는 조심해서 다뤄야 할 텐데."
211140-166 = "종종 사고가 나거든. 예전 방송부장도 갑자기 그만뒀고 말이지."
211140-167 = "……그건 무슨 이유였는지 알 수 있겠습니까?"
211140-168 = "뭐였더라? 계속 멍한 표정으로 일신상의 사유라는 말만 반복했다고 하던데."
211140-172 = "그 방송부장 아직도 복귀 안 했거든. 그러니까 너희들도 조심해?"
211140-173 = "네, 알겠습니다."
211140-174 = "……."
211140-175 = "사츠키 정보부장은 혹시……"
211140-176 = "나? 뭔가 물어볼 것이 있을까?"
211140-177 = "……아닙니다. 나중에 따로 여쭤보도록 하죠."
211140-178 = "아앗, 내가 궁금해지게 만들려는 목적이야? 끝까지 말해주면 안 될까?"
211140-179 = "아뇨, 정말 아무것도 아닙니다."
211140-185 = "그럼, 우린 이만 가보도록 할게."
211140-187 = "훗, 너희들이 아무리 뛰어봤자 이 몸의 손바닥 안이라는 것을 명심하도록."
211140-189 = "으으, 어떻게 저렇게 열받지?"
211140-191 = "불만이 있거든 너희도 정점에 오르도록! 이 하누마 마코토 님과 같은 눈높이에서 세상을 바라보는 일이 그리 쉽지는 않을 테지만 말이다! 키시싯!"
211140-193 = "빨리 가자……."
211140-201 = "그런데 마코토 선배. 그렇게 권한을 막 줘도 괜찮은 건가요?"
211140-202 = "키시싯. 아직 이 몸과 같은 혜안이 없구나, 이로하."
211140-203 = "지금 저 재흥위 녀석들은 게헨나에서 가장 뜨거운 화젯거리다."
211140-204 = "그런 녀석들에게 공식적으로 마이크를 쥐여준다는 것은, 녀석들의 인기를 우리 만마전의 권위 아래로 흡수한다는 뜻이지!"
211140-205 = "게다가 방송이 망하기라도 한다면 학생들이 누구를 탓하겠나?"
211140-206 = "우리 만마전이 아니라 실행 주체인 재흥위를 탓하겠지!"
211140-207 = "이 몸께서는 가만히 앉아서 홍보 효과만 누리고, 책임은 저 녀석들이 지게 되는……"
211140-208 = "그야말로 완벽한 계책인 것이다!!"
211140-210 = "이런 잔머리를 좀 생산적인 쪽으로 써보라니까요……."
211140-217 = "방송실"
211140-220 = "[ns] \"어두워!\""
211140-221 = "불을 켜야지!"
211140-222 = "스위치, 스위치!"
211140-233 = "여기가 방송실……."
211140-234 = "이곳이……."
211140-235 = "좀 낡은 느낌은 있지만, 이 정도면 있을 건 다 있는 느낌이네."
211140-241 = "우와, 이건 뭐지?"
211140-243 = "함부로 건드리면 안 되지 않을까, 회장……"
211140-250 = "윽……!!"
211140-252 = "아오, 마유미 쨩!"
211140-253 = "미안, 미안! 이런 건줄 몰랐어!"
211140-254 = "뭔가 모르겠는 기계가 잔뜩 있으니까 무섭네……."
211140-258 = "쇼코는…… 뭐해?"
211140-264 = "후후, 후후후……."
211140-265 = "뭐, 뭐야…… 왜 그래, 쇼코 쨩?"
211140-269 = "……아."
211140-270 = "[s] \"괜찮아, 쇼코?\""
211140-271 = "네. 괜찮습니다."
211140-272 = "회장이 이상한 걸 건드려서 그렇습니다."
211140-274 = "미안하다, 미안해!"
211140-275 = "아무튼, 여기까지 왔으니 그 귀신 소리에 대한 단서도 찾을 수 있겠지?"
211140-277 = "잠시…… 전자파 측정 장치를……."
211140-284 = "이쪽이군요……."
211140-290 = "쇼코 쨩, 전문가 같아. 야핫!"
211140-291 = "뭔가 나왔어?"
211140-293 = "……."
211140-294 = "이쪽에서 신호가 특히 강하네요……."
211140-302 = "……."
211140-304 = "……."
211140-308 = "카렌, 또 막 놀래키고 그러면 안 돼."
211140-309 = "앗, 들켰다."
211140-310 = "장난이고, 지금 쇼코 쨩이 뭔가 찾은 것 같으니 가만히 있어야지."
211140-316 = "그런가…… 여기 있던 건가……."
211140-317 = "뭔가 찾았어?"
211140-321 = "……아, 네. 스피커로 이어지는 이쪽 선이 노후된 것 같군요."
211140-322 = "단순 접지 문제일 가능성이 높습니다."
211140-324 = "헤에. 그런 거 척 보면 아는 거야?"
211140-325 = "통신이나 전파 관련해서는 꽤 많이 공부했으니까요."
211140-329 = "이 선을 빼놓는 것만으로도 이상한 귀신 소동은 벌어지지 않을 겁니다."
211140-330 = "……해당 장비는 교체가 필요하겠군요."
211140-331 = "오, 이렇게 금방 해결된 거야?"
211140-332 = "이야~ 한 건 해결이다!"
211140-333 = "재흥위가 또 해낸 거야! 쇼코 최고!"
211140-334 = "아, 의뢰인한테 가서 알려주자! 엄청 좋아할걸! 이제 괜히 귀신 소리 무서워할 필요도 없을 거고!"
211140-335 = "또 시동 걸렸네, 회장."
211140-337 = "……저는 좀 더 살펴보다 가겠습니다. 또 다른 문제점이 있을지 모르니까요."
211140-338 = "[s] \"나도 같이 볼까?\""
211140-339 = "아뇨. 괜찮습니다. 저만 있으면 됩니다."
211140-340 = "……신경 써주셔서 감사합니다, 선생님."
211140-341 = "알았어, 너무 늦게 오지 마! 우리 다른 거 또 해야 되니까!"
211140-342 = "긴 여행을 떠나보겠습니다. 찾지 말아주세요."
211140-343 = "빨리 와!!"
211140-351 = "……."
211140-355 = "그렇군요…… 이곳에서……."
211140-359 = "다음화;마유미"
