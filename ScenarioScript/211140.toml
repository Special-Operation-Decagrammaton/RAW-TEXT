211140-47 = "เหตุผลที่พวกเรามาพบท่านประธาน..."
211140-48 = "ก็ไม่รู้สินะคะ ถ้าจะบอกว่าพวกเรามาเพื่อช่วยเสริมบารมีให้แพนเดโมเนียม โซไซตี้ล่ะ จะว่าอย่างไรคะ?"
211140-49 = "หมายความว่ายังไง?"
211140-50 = "ท่านคงรู้อยู่แล้วว่าอิทธิพลของคณะกรรมการฟื้นฟูเกเฮนน่าเรากำลังขยายตัวขึ้นเรื่อยๆ ค่ะ"
211140-51 = "และตั้งแต่พวกเราเริ่มทำกิจกรรม ผลสำรวจความพึงพอใจในการใช้ชีวิตของนักเรียนเกเฮนน่าก็สูงกว่า#nครั้งก่อนอย่างเทียบไม่ติดด้วยค่ะ"
211140-52 = "ละ... แล้วนั่นมันยังไงกันล่ะ!"
211140-53 = "เหตุร้ายในโรงเรียนก็ลดลงอย่างมาก แถมตลาดภายในของเขตปกครองตนเองก็คึกคักขึ้นกว่าเดิม#nมากค่ะ"
211140-54 = "ยังมีเสียงตั้งคำถามด้วยว่า ทำไมที่ผ่านมาแพนเดโมเนียม โซไซตี้ไม่เคยทำเรื่องแบบนี้..."
211140-55 = "ตอนนี้บางส่วนก็เริ่มพูดถึงเรื่องการเลือกตั้งกันแล้วค่ะ"
211140-56 = "ว่าปล่อยให้คณะกรรมการฟื้นฟูของพวกเรารับหน้าที่แทนแพนเดโมเนียม โซไซตี้ไปเลย#nจะไม่ดีกว่าเหรอ..."
211140-57 = "อะ... อึก..."
211140-59 = "นี่ไม่ใช่คำโกหกนะคะ เป็นเรื่องที่มีคนพูดกันจริงๆ..."
211140-60 = "มาโคโตะจัง นี่เป็นวิกฤตต่อการได้ดำรงตำแหน่งอีกวาระเลยนะ?"
211140-62 = "เจ้าพวกนี้..."
211140-63 = ""
211140-65 = ""
