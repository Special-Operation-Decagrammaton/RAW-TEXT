211140-28 = "ท่านฮานุมะ มาโคโตะผู้นี้ไม่ค่อยสบายดีเท่าไรหรอก..."
211140-29 = "แต่ถึงอย่างนั้นก็จะยอมรับคำทักทายของคุณครูไว้ก็แล้วกัน ก็คุณครูคือผู้ให้ความร่วมมือคนสำคัญ#nที่สุดของแพนเดโมเนียม โซไซตี้นี่นะ"
