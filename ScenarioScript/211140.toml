211140-97 = "ฮึ่ม ไม่มีทาง! งบประมาณกว่า 60% ของแพนเดโมเนียม โซไซตี้ ถูกใช้เพื่อป่าวประกาศความยิ่งใหญ่#nของท่านฮานุมะ มาโคโตะผู้นี้อยู่เสมอ"
