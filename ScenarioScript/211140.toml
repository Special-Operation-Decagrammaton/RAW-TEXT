211140-126 = "อะแฮ่ม... ก็เพราะไม่มีบุคลากรคนอื่นที่พอจะฝากงานนี้ไว้ได้ เราก็เลยจำใจปล่อยเอาไว้แบบนั้น..."
211140-127 = "..."
