211140-120 = "พวกเราจะไม่นำระบบกระจายเสียงของโรงเรียนมาใช้เป็นแค่ช่องทางส่งข่าวเหมือนที่ผ่านมา แต่จะใช้เป็นช่องทางสร้างสรรค์เนื้อหาเชิงรุก และเป็นพื้นที่สำหรับการสื่อสารค่ะ"
