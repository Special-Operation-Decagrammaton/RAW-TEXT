211140-79 = "ด้วยเหตุนี้ ฉันจึงคิดว่าการทำให้เกเฮนน่ายิ่งใหญ่ขึ้นไปอีกจากที่เป็นอยู่ในตอนนี้ เป็นหน้าที่ของแพนเดโมเนียม โซไซตี้ค่ะ"
211140-80 = "เป็นสิ่งที่มีเพียงแพนเดโมเนียม โซไซตี้เท่านั้นที่ทำได้ ไม่ใช่ทั้งคณะกรรมการฟื้นฟู หรือคณะกรรมการวินัยค่ะ"
