211140-73 = "Hmm..."
211140-75 = "Ultimately, the Heritage League is staffed by amateurs. While we've achieved results with passion and drive, we lack experience."
211140-76 = "We are not proficient in enacting greater school policies and big-picture visions."
211140-77 = "If we were to serve as the student council, we would inevitably make mistakes. No matter our intentions, we would erode our hard-won reputation."
211140-78 = "Hm..."
211140-79 = "And that's why we believe that the Pandemonium Society will ultimately bring the greatest glory to Gehenna, just as you've been doing already."
211140-80 = "Such a task is beyond the Heritage League and the Prefect Team. Only the Pandemonium Society can achieve this dream."
211140-81 = "..."
211140-82 = "Kihehe, I see. I think we will get along very well!"
