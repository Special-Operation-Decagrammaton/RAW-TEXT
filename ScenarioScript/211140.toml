[translation]
211140-1 = "第14話;烈焰下的陰影"
211140-2 = "萬魔殿辦公室"
211140-4 = ""
211140-5 = "真琴醬～真琴醬～"
211140-6 = ""
211140-8 = ""
211140-10 = ""
211140-11 = "什麼事，皐月？"
211140-12 = "再興委員會的人來了。啊，老師也一起來了。"
211140-13 = "哈！真想知道那群無禮的後輩還有什麼臉來這裡。"
211140-14 = "上次是一時讓他們過關了，但這次就算老師在場，也不會那麼容易了。"
211140-16 = "是嗎……"
211140-18 = "好，讓他們進來！"
211140-19 = "OK，進來吧～"
211140-24 = ""
211140-25 = "你好，議長！"
211140-26 = "[s] 「你好，真琴。」"
211140-28 = "我羽沼真琴大人的心情可不怎麼好……"
211140-29 = "不過老師的問候我還是會接受的。畢竟是我們萬魔殿最大的協力者。"
211140-30 = "呵呵……"
211140-31 = ""
211140-33 = ""
211140-34 = "你在笑？"
211140-35 = "這些傢伙真是大膽！為何來找萬魔殿，給我從實招來！"
211140-36 = "又是像上次那樣的請託嗎？#n今天如你們所願的機率可說是趨近於0，做好覺悟再說吧！"
211140-37 = "唔唔……果然壓迫感好強……！"
211140-38 = "委員長，這裡交給我。"
211140-39 = "哦哦，又要進入奸臣模式了嗎，翔子醬。"
211140-40 = "吵死了。我自有打算。"
211140-42 = "在本大人面前嘀嘀咕咕什麼？沒自信的話就回去吧！"
211140-43 = ""
211140-45 = ""
211140-46 = ""
211140-47 = "我們為什麼會來找議長啊……"
211140-48 = "如果說是為了樹立萬魔殿的威信，您覺得如何？"
211140-49 = "那是什麼意思？"
211140-50 = "您應該知道，目前我們格黑娜再興委員會的影響力正日益擴大。"
211140-51 = "還有自從我們開始活動後，格黑娜學生們的生活滿意度調查結果變得遠超以往。"
211140-52 = "那，那又怎麼樣！"
211140-53 = "校內的事件與事故大幅減少，自治區的內需市場也變得更加活絡了。"
211140-54 = "有人提出疑問，為什麼萬魔殿這段期間都沒有做這些事……"
211140-55 = "甚至有一部分的人開始談論選舉的事了。"
211140-56 = "說是不如讓我們再興委員會來取代萬魔殿的角色……"
211140-57 = "可，可惡……"
211140-59 = "那可不是謊話哦。確實有人這麼說……"
211140-60 = "真琴醬，這是連任危機？"
211140-62 = "這些傢伙……"
211140-63 = ""
211140-65 = ""
211140-66 = "其實，那並不是我們所希望的。"
211140-67 = "什麼？"
211140-68 = "我們格黑娜再興委員會認為，自己終究只該扮演萬魔殿的輔助角色。"
211140-69 = "……你那是什麼意思。"
211140-71 = "翔子？這是什麼意思？"
211140-72 = "委員長，翔子醬好像有什麼打算。先聽聽看吧。"
211140-73 = "唔嗯……"
211140-75 = "再興委員會終究只是業餘學生的集團。#n現在雖能靠熱情與魄力取得可見的成果，但經驗終究不足。"
211140-76 = "無法保證在決定校內政策或規劃宏大藍圖時，也能靈活又熟練地應對。"
211140-77 = "就算我們扮演學生會的角色也會一再犯錯，#n好不容易累積起來的聲望也會被消磨殆盡吧。"
211140-78 = "哼嗯……"
211140-79 = "正因如此，我認為能像現在這樣讓格黑娜更加偉大，是萬魔殿的職責。"
211140-80 = "這件事既不是我們再興委員會，也不是風紀委員會，而是唯有萬魔殿才能辦到的。"
211140-81 = "……"
211140-82 = "嘰嘻嘻，果然是這樣啊。看來可以溝通嘛！"
211140-83 = ""
211140-85 = ""
211140-86 = ""
211140-87 = "沒想到你們會來說我羽沼真琴大人才是相稱的真正領袖！#n挺有一套的嘛，格黑娜再興委員會！"
211140-88 = "並沒有人那樣說吧。"
211140-89 = "啊，是的……聽起來像是類似的意思也無妨。"
211140-90 = "不過。"
211140-91 = ""
211140-93 = ""
211140-95 = ""
211140-96 = "問題就在於，格黑娜的普通學生並不這麼認為。"
211140-97 = "哼，不可能！#n萬魔殿超過6成的預算，應該一直都用在宣揚羽沼真琴大人的偉大上才對。"
211140-98 = "就算學生們只模糊地意識到萬魔殿的存在，也不可能有學生不認識我真琴大人！"
211140-100 = "真琴醬，好像正好相反耶……"
211140-102 = "這時候就輪到系統化的數據登場了。來，請看。"
211140-103 = ""
211140-105 = ""
211140-106 = ""
211140-107 = "這是前陣子閃亮亮部負責校內廣播時的收聽率。"
211140-108 = "您應該看得出來，比平時播放真琴議長讚歌的時候足足增加了800%以上。"
211140-109 = "什，什麼！那張圖表是……！"
211140-111 = "這是要用事實打臉呢。也是，那時候真的超熱烈的。"
211140-112 = "真可惜。我那時候在外面沒聽到。"
211140-114 = "這項指標顯示的事實很明確。#n學生們會為新事物狂熱，對重複多次的內容感到厭倦。不，應該說是近乎漠不關心。"
211140-115 = "因此，為了擴大萬魔殿的影響力……"
211140-116 = "現在必須改變戰略。"
211140-117 = "你到底想說什麼，五十嵐翔子！"
211140-118 = "請給予我們格黑娜再興委員會正當的廣播權限。"
211140-119 = "……又是那件事啊。"
211140-120 = "不再像至今那樣，只把校內廣播當成單純的消息傳達管道──#n而是將其作為更積極的內容製作窗口與溝通窗口。"
211140-121 = "如果是我們的話，還能以更洗鍊的方式兼顧萬魔殿的宣傳。"
211140-123 = "哦，這不是挺好的嗎？我們的校內廣播一直處於中斷狀態。"
211140-125 = "像現在這樣一直放著廣播中斷不管，也會損害萬魔殿的權威。#n系統的缺失必然會招致對行政能力的懷疑。"
211140-126 = "咳哼……是因為沒有其他能託付的人才，才不得已放著不管的……"
211140-127 = "……"
211140-128 = "你是說再興委員會能填補那個空缺嗎？"
211140-129 = "是的。您不是已經見識過我們擄獲學生的實力了嗎？"
211140-130 = "這點……我確實不得不承認。"
211140-131 = "[s] （真琴幾乎完全被說動了……）"
211140-133 = "哼嗯，怎麼辦呢，真琴醬。"
211140-134 = ""
211140-136 = ""
211140-138 = ""
211140-140 = ""
211140-141 = ""
211140-142 = "哼，好吧！既然別人已經搭好了舞台，那在上面起舞的理所當然該是我真琴大人！"
211140-143 = "再興委員會，你們的夢想就讓本大人徹底利用吧！！"
211140-145 = "那些無知愚昧的風紀委員，八成連這種宏大藍圖都想像不到吧！嘰嘻嘻！！"
211140-147 = "嗚哇，雖然有點不爽，但至少能進廣播室了呢。"
211140-148 = "不過總覺得好像變成萬魔殿的手下了，真不爽……"
211140-150 = "一切都在計畫之中。"
211140-152 = "啊哈哈，那就來拍張照片！"
211140-153 = ""
211140-157 = ""
211140-159 = ""
211140-163 = "這可說是萬魔殿與再興委員會歷史性的協定瞬間！#n感覺會成為相當大的話題！"
211140-164 = "[s] 「總算又順利解決了……」"
211140-165 = "嗯哼～不過廣播室的設備得小心使用才行。"
211140-166 = "因為常常發生意外。之前的廣播部長也突然不做了。"
211140-167 = "……能告訴我那是什麼原因嗎？"
211140-168 = "是什麼來著？聽說他一直一臉呆滯，只是反覆說是個人因素。"
211140-169 = ""
211140-171 = ""
211140-172 = "那位廣播部長到現在都還沒回來，所以你們也要小心哦？"
211140-173 = "好的，我知道了。"
211140-174 = "……"
211140-175 = "皐月情報部長是不是……"
211140-176 = "我？有什麼想問的嗎？"
211140-177 = "……沒什麼。之後再另外請教吧。"
211140-178 = "啊啊，你是故意要讓我好奇嗎？不能把話說完嗎？"
211140-179 = "不，真的沒什麼。"
211140-180 = ""
211140-182 = ""
211140-184 = ""
211140-185 = "那麼，我們就先告辭了。"
211140-187 = "哼，無論你們再怎麼蹦躂都逃不出本大人的手掌心，給我記住了。"
211140-189 = "唔唔，怎麼能那麼讓人火大啊？"
211140-191 = "要是不滿就爬上頂點看看吧！#n雖然要和我羽沼真琴大人以同樣的高度看世界可沒那麼簡單！嘰嘻嘻！"
211140-193 = "快走吧……"
211140-194 = ""
211140-201 = "不過真琴前輩。那樣隨便給他們權限真的沒問題嗎？"
211140-202 = "嘰嘻嘻。你還沒有本大人這樣的慧眼啊，伊呂波。"
211140-203 = "現在那些再興委員會的傢伙是格黑娜最熱門的話題。"
211140-204 = "正式把麥克風交給那種傢伙，就代表將他們的人氣吸收到我們萬魔殿的權威之下！"
211140-205 = "而且要是廣播搞砸了，學生們會怪誰？"
211140-206 = "不會怪我們萬魔殿，而是會怪執行者再興委員會吧！"
211140-207 = "本大人只要坐著享受宣傳效果，責任則由那些傢伙承擔……"
211140-208 = "這正是完美的計策！！"
211140-210 = "我就說了，這種小聰明拜託用在比較有建設性的地方吧……"
