211140-71 = "โชโกะ? ที่พูดมามันหมายความว่ายังไงน่ะ?"
211140-72 = "หัวหน้า ดูเหมือนโชโกะจังจะมีแผนอะไรอยู่ ลองฟังก่อนเถอะ"
211140-73 = "อืม..."
211140-75 = "คณะกรรมการฟื้นฟูเป็นเพียงกลุ่มนักเรียนมือสมัครเล่นเท่านั้นค่ะ ในตอนนี้พวกเราอาจสร้างผลงาน#nที่เป็นรูปธรรมได้ด้วยความมุ่งมั่นและความกล้า แต่ก็ยังขาดประสบการณ์อยู่มาก"
211140-76 = "ไม่มีอะไรรับประกันได้ว่าพวกเราจะรับมือได้อย่างยืดหยุ่นและชำนาญ เมื่อจำเป็นต้องกำหนดนโยบาย#nภายในโรงเรียนหรือวางแผนระยะยาวในภาพรวมค่ะ"
211140-77 = "ต่อให้พวกเรารับหน้าที่เป็นสภานักเรียน ก็คงทำผิดพลาดซ้ำแล้วซ้ำเล่า และความไว้วางใจที่อุตส่าห์#nสั่งสมมาก็คงถูกบั่นทอนไปด้วยค่ะ"
