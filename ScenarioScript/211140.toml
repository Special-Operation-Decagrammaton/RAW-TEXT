211140-67 = "ว่ายังไงนะ?"
211140-68 = "พวกเราคิดว่าคณะกรรมการฟื้นฟูเกเฮนน่าควรจำกัดบทบาทไว้เพียงการสนับสนุนแพนเดโมเนียม โซไซตี้เท่านั้นค่ะ"
