[translation]
84312101305-6 = "연락처? 아니. 어…… 괜찮은 거야?"
84312101305-7 = "싫다는 건 아니고. 이런 식으로 연락처 이야기를 먼저 듣는 건 처음이라……"
84312101305-8 = "응? 그래? 의외네. 쿨하고 멋지게 생겨서 인기 많을 줄 알았는데."
84312101305-12 = "이, 인기!? 누가!? 내가!?"
84312101305-13 = "아, 아니! 애초에 그런 말을 그렇게 직접적으로…… 아무렇지도 않게!?"
84312101305-14 = "……?? 왜? 무슨 문제 있어?"
84312101305-20 = "(과연…… 알 것 같네요. 이쪽 학생들의 분위기는 저희와 조금 다른 면이 있죠.)"
84312101305-21 = "(좋은 면이라고 생각합니다만……)"
