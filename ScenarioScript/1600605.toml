[translation]
1600605-1 = "소녀는 그렇게 바다와 싸운다."
1600605-2 = "(오늘도 이즈미와 함께 해변가 근처의 유명 맛집을 다섯 군데를 돌았을 때였다.)"
1600605-3 = "후아~ 맛있었다!"
1600605-4 = "그치? 선생님?!"
1600605-5 = "[s1] \"응, 맛있었어.\"\n[s2] \"확실히 맛있긴 했지만…….\""
1600605-6 = "왜애? 선생님은 별로였어?"
1600605-7 = "왜애? 선생님은 별로였어?"
1600605-8 = "으음~ 뭐가 별로였지. 난 전부 좋았는데에~"
1600605-9 = "앗! 혹시 돈코츠 라멘맛 빙수가 별로였다던가~?"
1600605-10 = "아니면 메론맛 야키소바?!"
1600605-11 = "[s3] \"굳이 따지자면 메론맛 야키소바 쪽이…….\"\n[s4] \"……가 아니라.\""
1600605-14 = "[s] \"모처럼 바다에 왔는데, 이즈미는 수영 안 해?\""
1600605-15 = "수여~엉~?"
1600605-16 = "으음~ 확실히 바다에 온 뒤로 계속 먹기만 하긴 했지만……."
1600605-17 = "바다라고 해서, 꼭 수영을 해야 해~?"
1600605-18 = "[s] \"꼭 그런 건 아니지만, 아깝지 않나 해서.\""
1600605-19 = "모처럼 수영복을 입은 게, 아깝지 않냐구~?"
1600605-20 = "으으으음~~"
1600605-21 = "뭐어! 선생님이 그렇게까지 말한다면야~"
1600605-22 = "마침 배도 슬슬 부르겠다. 열심히 수영하면 또 금방 배가 고파진다고 하니까."
1600605-23 = "그것도 확인해볼 겸! 뭐, 어디 한번 해볼까!"
1600605-24 = "바다 수영!"
1600605-25 = "[s] \"결국 그게 목적이었냐!\""
1600605-31 = "오오. 이게 바다!"
1600605-32 = "와앗-! 바다다~!"
1600605-33 = "이야아아~!"
1600605-38 = "아와와!!! 파도가 밀려온~다!"
1600605-39 = "와하하하하!! 와와-! 선생님 이거 봐!"
1600605-40 = "이게 다 바다야! 바닷물!"
1600605-41 = "[s] \"응.\""
1600605-42 = "헤에, 저 끝까지 전부 가득 차 있는 바닷물이라~ 재밌네!"
1600605-43 = "바닷물은 전부 짠맛이잖아?"
1600605-44 = "짠맛이라~ 짠맛은 응, 잘 어울리지~ 맛있기도 하고~"
1600605-45 = "쇼유 라멘이라던가~ 시오 라멘이라던가~"
1600605-47 = "……츄릅."
1600605-48 = "[s] \"이즈미?! 바닷물은 마시면 안 된다?!\""
1600605-49 = "아니, 아무리 그래도 바닷물까지 마시진 않는다구~!?"
1600605-50 = "라멘을 떠올렸을 뿐이야~!"
1600605-54 = "앗, 차가워라."
1600605-55 = "아하핫, 시원해! 선생님! 자자, 선생님도 이쪽! 이쪽으로 와봐!"
1600605-56 = "[s] \"이즈미, 즐거워 보이네.\""
1600605-57 = "응! 그러게!"
1600605-58 = "오기 전까지만 해도 그냥 귀찮다고 생각했는데……."
1600605-59 = "정작 와보니까 이렇게나 즐거운 건……."
1600605-61 = "으음~ 어째서일까~?"
1600605-62 = "그건……."
1600605-63 = "으응~ 아마도……."
1600605-64 = "흐응~♪"
1600605-66 = "(꽈아아아악)"
1600605-67 = "……어?"
1600605-69 = "(꽈아아아악)"
1600605-70 = "흐에에……?"
1600605-71 = "[s] \"이즈미? 왜 그래?\""
1600605-72 = "으아, 아아~?!"
1600605-73 = "후에에에엥?! 선생님, 뭔가, 뭔가 이상해애애!!"
1600605-74 = "[s] \"이, 이즈미……?!\""
1600605-77 = "[wa:200]― 선, [wa:600]선생님. [wa:750]도와줘어……"
1600605-80 = "[ns] \"이즈미, 괜찮아?!\""
1600605-81 = "[wa:150]― 으으, [wa:700]느낌이 이상해애애……."
1600605-83 = "― 축축하고,[wa:700] 미끈미끈해서,[wa:1100] 우에엥……!"
1600605-86 = "[ns] \"지금 바로 도와줄 테니까!\""
1600605-87 = "[wa:150]― 저리 [wa:450]가아~!"
1600605-89 = "― 난 [wa:700]먹는 게 아니라구우~!"
1600605-92 = "[wa:150]― 아직 [wa:400]못 먹어본 음식도 [wa:650]많단 말이야아~!"
1600605-95 = "[wa:50]― 히읏?![wa:550] 우으읏,"
1600605-97 = "― 이대로 [wa:530]당하고 있을 수만은……!"
1600605-100 = "[ns] \"……이즈미?\""
1600605-101 = "[wa:150]― 헉![wa:950]"
1600605-103 = "― 이대로 [wa:450]문어에게 먹힐 바에는[wa:1550] 차라리 그전에……!"
1600605-106 = "[wa:100]― 내가 먼저 [wa:910]먹어버리면 될지도-?!"
1600605-109 = "응! 맞아!"
1600605-110 = "먹히기 전에 먹어치우면 내가 이기는 거지?!"
1600605-114 = "에이잇!!"
1600605-115 = "[s] \"이즈미? 비위생적이니까 그만둬!\""
1600605-117 = "(그렇게 이즈미에게서 간신히 문어를 떼어내 무사히 바다로 돌려 보내주었다.)"
