[translation]
2601103-1 = "의외로 똑같은 것들"
2601103-2 = "(골목 시장의 한 귀퉁이.)"
2601103-8 = "[ns1] \"무슨 소리지……?\"\n[ns2] 소리가 난 곳으로 향한다."
2601103-14 = "……으음……."
2601103-15 = "으으으으음……."
2601103-16 = "[s3] \"여기 있었구나, 사텐.\"\n[s4] \"뭔가 일이라도 있어?\""
2601103-19 = "아. 선생님?"
2601103-20 = "아뇨, 뭐 다른 게 있는 건 아니고. 그냥 저쪽에서……."
2601103-25 = "겨우 한 사람 구하는 게 이렇게 어려운 거야!?"
2601103-26 = "겨우 한 사람이 아니지. '마작 칠 줄 아는 한 사람'을 구하는 거잖아."
2601103-27 = "아까 전까진 분명 네 명이었는데, 책방 영감이 일 생겼다고 가버렸으니……."
2601103-28 = "에잉……. 이놈의 마작. 역만보다 어려운 게 네 명 모으는 거라더니, 그 말대로라니까."
2601103-29 = "이대로 끊기는 영 아쉬운데, 어디 같이 해 줄 사람 없으려나……."
2601103-31 = "[ns5] \"……마작?\"\n[ns6] \"저걸 구경하고 있었던 거야?\""
2601103-34 = "네. 저희 세계에서도 똑같은 게임이 있었거든요. 그 부분이 신기해서 구경하고 있었어요."
2601103-35 = "일단은 아예 다른 세계잖아요? 그런데 마작은 둘 다 존재하고, 심지어 룰도 똑같고……."
2601103-36 = "생각해 보면 저희는 자연스럽게 대화도 하고 있고, 생활 양식도 도시의 구조도 크게 다르지는 않죠."
2601103-37 = "다른 세계인데 똑같은 부분이 많다……. 오히려 그 부분이 신기하다고 생각하고 있었어요."
2601103-38 = "……네?"
2601103-39 = "마작의 룰이 똑같다는 건 어떻게 알았냐고요? 그거야, 뭐. 저도 일단은……."
2601103-40 = "마작……. 칠 줄도 알고, 넷 마작이라도 꽤 자주 치기는 했으니까요. 일단은."
2601103-41 = "……뭐!? 방금 뭐라고 그랬지!?"
2601103-45 = "……응?"
2601103-46 = "거기, 학생! 방금 뭐라고 그랬지? 우리가 제대로 들은 거 맞아?"
2601103-47 = "마작을……. 칠 줄 안다고? 그게 정말이야?"
2601103-48 = "혹시 시간 괜찮나? 딱 한 판……. 딱 한 판만이라도 우리와 함께 쳐줄 수 있겠어?"
2601103-49 = "네, 네? 아, 아니. 갑자기 그렇게 제안을 하셔도……."
2601103-50 = "이렇게 부탁하네! 정말 딱 막판 한 판만 하고 해산하려 하는데, 도무지 사람을 못 구해서……!"
2601103-51 = "이대로 그냥 헤어지면 오늘은 하루 종일 마작 생각밖에 하지 못할 거란 말이야."
2601103-52 = "으음……. 그렇게까지……."
2601103-53 = "흠……."
2601103-54 = "[s] 상인들을 말리려 한다."
2601103-55 = "……앗."
2601103-56 = "아니에요, 선생님. 저는 괜찮아요. 딱히 부담스럽다든가, 그런 건 아니니까요. 오히려……."
2601103-60 = "네. 한 번 해보는 것도 나쁘지 않겠어요."
2601103-61 = "오오! 정말인가!! 고마워, 학생!!"
2601103-67 = "뭐 해, 빨리 패 정리 안 하고! 학생 앉을 자리에 방석이라도 가져와!"
2601103-68 = "이미 해 놨다고~. 우리도 봐줄 테니 그리 긴장할 필요는 없어!"
2601103-72 = "……흐응?"
2601103-73 = "봐주신다니, 학생이라고 얕보이고 있나 보네요. 이건 그냥 넘어갈 수 없겠는걸요."
2601103-74 = "마작 실력이 꼭 나이와 비례하지는 않는다는 걸 보여드리죠!"
2601103-75 = "……!! 오오오! 젊은이의 패기!"
2601103-76 = "그럼 바로 시작이야!!"
2601103-78 = "(이후 시장 한 가운데에서 사텐과 상인들의 마작판이 벌어졌다.)"
2601103-79 = "(……의외로 실력들이 박빙이었기 때문에, 게임은 이후로도 네 판이나 더 이어졌다.)"
2601103-90 = "……쯔모!!"
2601103-91 = "리치핑후삼색준짱쯔모 도라2……."
2601103-92 = "……우라2!! 삼배만! 오야 삼배만 12,000 ALL! 극적인 역전승!!"
2601103-93 = "이겼다!! 드디어 이걸로 전 판들의 설욕이네요!! 겨우 점수가 비슷해졌어요!!"
2601103-94 = "자, 자! 어서 다음 판 가시죠!! 어서요!!"
2601103-95 = "하, 학생……. 그만…… 이제 그만……."
2601103-96 = "우리는 한두 판만 가볍게 하려고 했던 건데……. 흐으으……."
2601103-97 = "체력이……. 늙은이들의 체력으로는……. 더는……. 무리……."
2601103-98 = "네……?! 그럴 수가……. 이제야 겨우 다시 비슷해졌잖아요! 그전까지 신나게 이기셔 놓고, 이제 와서 이렇게 빠지시는 건가요!?"
2601103-99 = "아직이에요, 아직 멀었어요! 승부는 이제부터라고요!"
2601103-100 = "끄어……억……."
2601103-101 = "살려줘……."
2601103-105 = "[ns] \"…….\""
2601103-107 = "[ns] 사텐을 데리고 나온다."
2601103-109 = "(날이 늦었다는 이유를 대며 사텐을 데리고 돌아왔다.)"
2601103-110 = "(……겨우 휴식을 취하게 된 상인 분들이, 말없이 감사의 눈빛을 보내 주었다.)"
