[translation]
1014505-1 = "เที่ยวแดนสวรรค์"
1014505-2 = "เมื่อคืนเราได้ลองค้นคว้าดูบ้างแล้ว"
1014505-3 = "ดูเหมือนจะมีคำกล่าวว่า หากมาถึงหุบเขาแห่งนี้แล้วไม่ได้ล่องเรือชมวิว ก็เท่ากับมาเสียเที่ยวเลยทีเดียว"
1014505-4 = "[s] \"งั้น... เหรอ?\""
1014505-5 = "อืม"
1014505-6 = "ดูเหมือนหัวใจสำคัญคือการพายเรือลำเล็กไปด้วยตัวเอง และเพลิดเพลินกับทิวทัศน์ให้เต็มที่"
1014505-7 = "ตอนนี้ยังเป็นยามเช้าตรู่ก็จริง แต่พอถึงช่วงบ่าย นักท่องเที่ยวคนอื่นๆ ก็คงมาชมวิวกันมากขึ้น"
1014505-8 = "แต่ไม่รู้เพราะเหตุใด เราถึงอยากดื่มด่ำกับบรรยากาศอันเงียบสงบนี้กับครูมากกว่า"
1014505-9 = "[s1] \"วิวที่มองจากบนแม่น้ำ คงสวยกว่าตรงนี้อีกนะ\"\n[s2] \"ถ้าได้มองจากบนแม่น้ำ วิวคงยิ่งสุดยอดไปเลยนะ\""
1014505-12 = "อืม เช่นนั้นก็ ไปกันเถอะ"
1014505-14 = "ข้อมูลแนะนำมีเพียงเท่านี้ครับ ขอบคุณครับ!"
1014505-15 = "ถึงจะเป็นฤดูร้อน แต่น้ำในแม่น้ำช่วงเช้าก็ยังเย็นอยู่ ระมัดระวังกันด้วยนะครับ"
1014505-16 = "ขอให้เพลิดเพลินกับการชมวิวครับ!"
1014505-17 = "อืม ชักตั้งตารอแล้วสิ"
1014505-18 = "นั่นคือเรือที่ว่าอย่างนั้นหรือ... ได้ยินว่านั่งได้ตั้งแต่ 2-4 คน ดูจะเป็นอย่างที่ว่าจริงด้วยนะ"
1014505-19 = "ได้ยินว่าทิวทัศน์ยามมีหมอกยามเช้านั้นน่าชมยิ่งนัก ใช่หรือไม่?"
1014505-20 = "ใช่แล้วครับ! แต่หมอกยามเช้าก็ไม่ได้ปรากฏให้เห็นตามใจเราทุกครั้งไปหรอกครับ..."
1014505-21 = "แต่เวลามองเห็นยอดเขาเหล่านั้น ที่ตั้งตระหง่านอยู่เหนือม่านหมอกหนาที่ปกคลุมผืนน้ำ..."
1014505-22 = "ได้ยินว่าจะรู้สึกราวกับได้เป็นผู้วิเศษในตำนานเลยละครับ!"
1014505-23 = "ฮุฮุ เช่นนั้นก็น่าตั้งตารอจริงๆ"
1014505-24 = "เอาละ รีบไปกันเถอะ"
1014505-25 = ""
1014505-27 = ""
1014505-28 = "(ในจังหวะที่คุณครูกำลังจะเดินตามคิซากิไปยังเรือ)"
1014505-29 = "อ๊ะ ขอรบกวนสักครู่นะครับ คุณเป็นผู้ปกครองใช่มั้ยครับ?"
1014505-30 = "[s] \"อ้อ? อื้อ ก็ประมาณนั้น\""
1014505-31 = "ครับๆ ไหนๆ ก็พูดถึงแล้ว เลยอยากแจ้งเพิ่มเติมอีกเล็กน้อยน่ะครับ"
1014505-32 = "เรือที่คุณลูกค้าจะขึ้น ดูเหมือนเรือลำเล็กที่สร้างด้วยวิธีดั้งเดิมก็จริง..."
1014505-33 = "แต่จริงๆ แล้วมีการติดตั้งระบบรุ่นใหม่ล่าสุด ให้เรือสามารถเคลื่อนที่ได้เองครับ!"
1014505-34 = "เพราะงั้น เพียงแค่ทำท่าเหมือนกำลังพายเรือ แล้วอินไปกับบรรยากาศก็พอครับ!"
1014505-35 = "[s] \"แบบนั้นก็ดีเลยนะ\""
1014505-36 = "ใช่มั้ยล่ะครับ? แล้วต่อให้เกิดหมอกลงจัด จนหลงทางขึ้นมา..."
1014505-37 = "หากเปลี่ยนเป็นโหมดเดินเรืออัตโนมัติ เรือก็จะกลับมายังท่าเรือแห่งนี้เอง ไม่ต้องกังวลนะครับ!"
1014505-38 = "ถ้างั้นก็ขอให้สนุกกับการล่องเรือนะครับ!"
1014505-39 = "เป็นอะไรไปหรือ ครู? มีเรื่องใดเกิดขึ้นเล่า?"
1014505-40 = "[ns] \"ครูจะรีบไปเดี๋ยวนี้แหละ!\""
1014505-42 = "(คุณครูพาคิซากิขึ้นเรือ แล้วเริ่มพายเรือ)"
1014505-43 = "(เพียงแค่ทำท่าเหมือนพาย เรือก็เคลื่อนที่ไปเองตามที่เจ้าหน้าที่บอก)"
1014505-45 = "เงียบสงบดีจริงๆ"
1014505-46 = "เหนื่อยหรือเปล่า ครู? เห็นพายเรืออยู่คนเดียวตั้งแต่ออกมาเลย..."
1014505-47 = "[s] \"สบายอยู่แล้ว\""
1014505-48 = "เช่นนั้นหรือ? ฮุฮุ... ดูเหมือนแขนของครูจะมีกำลังกว่าที่เราคิดไว้มากทีเดียวนะ"
1014505-49 = "ยอดเขานับพันตั้งตระหง่านโอบล้อมผืนทุ่ง สายน้ำหนึ่งสายไหลโอบอุ้มผืนดินไว้"
1014505-50 = "เห็นทิวทัศน์นั้นหรือไม่ ครู? นกกระยางขาวสองตัวกำลังมองกัน และหยอกล้อกันอย่างรื่นเริง"
1014505-51 = "..."
1014505-52 = "ครู ช่วยหยุดเรือสักครู่ได้หรือไม่?"
1014505-53 = "สายน้ำย่อมไหลไปรวมกันยังทะเล และกาลเวลาก็ไม่เคยหยุดรอผู้ใด"
1014505-54 = "แต่เพียงได้อยู่กับครูเช่นนี้ ในยามนี้เรากลับรู้สึกราวกับทุกสิ่งหยุดนิ่งลง"
1014505-55 = "..."
1014505-57 = "ณ ที่ซึ่งน้ำใส ทรายขาว นกน้อยโผบินกลับมา"
1014505-58 = "สายน้ำยังคงไหลต่อเนื่องไม่ขาดสาย"
1014505-59 = "ขอถามเถิด ลาภยศมั่งมีในโลกนี้ สำคัญนักหรือไร"
1014505-60 = "เมื่อครูกับเราอยู่ ณ ที่แห่งนี้ ก็ขอชวนฟ้าดื่มสักจอกเถิด"
1014505-61 = ""
1014505-62 = "หืม?"
1014505-63 = "[s] \"เป็นอะไรไปเหรอ คิซากิ?\""
1014505-64 = "ดูนั่นสิ ครู"
1014505-65 = "หมอกเริ่มโรยตัวลงมาปกคลุมแล้ว"
1014505-66 = "ฮุฮุ นี่คือทิวทัศน์ที่เจ้าหน้าที่คนนั้นกล่าวถึงสินะ"
1014505-67 = "จริงด้วยนะ หากเป็นผู้วิเศษในตำนาน ก็คงใช้ชีวิตในทิวทัศน์เช่นนี้ทุกวัน"
1014505-70 = "― [log=키사키 수영복]เป็นอย่างไรเล่า ครู[/log][wa:1560] "
1014505-72 = "― [log=키사키 수영복]ทิวทัศน์ที่เคยเต็มไปด้วยสีสัน บัดนี้มัน[/log][wa:2390] "
1014505-75 = "― [log=키사키 수영복]อืม ดูสะอาดตาขึ้นมากทีเดียว[/log][wa:650] "
1014505-78 = "― [log=키사키 수영복]สายน้ำ ลำธาร ม่านหมอก ยอดเขา...[/log][wa:3910] "
1014505-80 = "― [log=키사키 수영복]ทว่ามีเพียงครูเท่านั้น ที่ปรากฏอยู่ในสายตาของเรา [/log][wa:3300] "
1014505-83 = "― [log=키사키 수영복]แล้วในดวงตาของคุณกำลังสะท้อนสิ่งใดอยู่เล่า?[/log][wa:3770] "
1014505-85 = "― [log=키사키 수영복]ในบรรดาทิวทัศน์นี้ มีเพียงเรา[/log]"
1014505-88 = "― [log=키사키 수영복]ที่สลักอยู่ในดวงตาของคุณ เช่นเดียวกับของเราหรือเปล่า?[/log][wa:2290] "
1014505-91 = "― [log=키사키 수영복]ฮุฮุ... เคยได้ยินเรื่องเล่าเช่นนี้หรือไม่? [/log][wa:2890] "
1014505-94 = "― [log=키사키 수영복]ว่ากันว่านางฟ้าจะโต้สายลม...[/log]"
1014505-96 = "― [log=키사키 수영복]และร่ายรำอยู่บนท้องฟ้าดุจดั่งขนนก[/log][wa:1040] "
1014505-99 = "― [log=키사키 수영복]เอาละ สูดลมหายใจเข้าสิ ครู[/log][wa:5000] "
1014505-101 = "― [log=키사키 수영복]แม้จะเพียงแค่เล็กน้อย[/log][wa:1210] "
1014505-104 = "― [log=키사키 수영복]แต่ครูอาจสัมผัสได้ถึงตัวเราจากในนั้นก็เป็นได้[/log][wa:10] "
1014505-107 = "โอ้ หมอกมัน...?"
1014505-109 = "[ns] \"พอดวงอาทิตย์ลอยสูงขึ้น หมอกก็เริ่มจางสินะ\""
1014505-110 = "ฮุฮุ เช่นนั้นหรือ"
1014505-111 = "เรารู้สึกราวกับได้ล่องลอยขึ้นสู่แดนสวรรค์ไปพร้อมกับครู นับว่าไม่เลวเลยทีเดียว"
1014505-112 = "..."
1014505-113 = "ทว่ามนุษย์ในโลกมนุษย์ ย่อมต้องใช้ชีวิตตามแบบฉบับของโลกมนุษย์สินะ"
1014505-114 = "ถ้าเช่นนั้น ก็คงถึงเวลากลับกันแล้ว"
1014505-115 = "[s] \"น้อมรับบัญชา ท่านประมุข\""
1014505-116 = ""
1014505-118 = ""
1014505-120 = "(จากนั้นคุณครูก็ค่อยๆ บังคับเรือมายังท่าเรือพร้อมกับคิซากิ)"
