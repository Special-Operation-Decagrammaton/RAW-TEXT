[translation]
1014505-1 = "A Heavenly Trip"
1014505-2 = "I happened to learn something last night."
1014505-3 = "Apparently, everyone says that you simply cannot miss the boat tour here."
1014505-4 = "[s] \"I...see?\""
1014505-5 = "Hmm."
1014505-6 = "I've read that the tour includes riding in a boat, rowing a small one by yourself, and peacefully taking in the sights and sounds."
1014505-7 = "It's fairly early in the morning right now. I'm sure the tourists will eagerly partake by the afternoon."
1014505-8 = "I thought it could be nice to enjoy this experience with only you, Sensei."
1014505-9 = "[s1] \"The view's already impressive from here.\"\n[s2] \"Seeing it from the river must be even better.\""
1014505-12 = "Mm. Then, shall we?"
1014505-14 = "--and that's it for the basics. Thanks for listening. "
1014505-15 = "Remember, it may be summer, but the water is still cold. Keep that in mind."
1014505-16 = "Above all, we hope you enjoy the tour!"
1014505-17 = "I'm actually quite excited."
1014505-18 = "This must be the rowboat in question... I've read that it holds two to four people."
1014505-19 = "If I recall correctly, the morning fog is supposed to be quite the scene, is it not?"
1014505-20 = "You're absolutely right! We don't have the fog come in EVERY morning, but..."
1014505-21 = "When you behold the mountain peaks rising above the dense fog..."
1014505-22 = "It makes me feel like an immortal sage! You know...like from the folktales."
1014505-23 = "Fufu. That's certainly something to look forward to."
1014505-24 = "Now, let us embark."
1014505-25 = ""
1014505-27 = ""
1014505-28 = "Then, right as I was about to follow Kisaki onto the boat..."
1014505-29 = "One moment, please. Are you the guardian?"
1014505-30 = "[s] \"Huh? I mean, yes, in a sense.\""
1014505-31 = "Yes, yes. I thought I should say this while I happen to have you."
1014505-32 = "Now I know this looks like a traditional, handcrafted rowboat..."
1014505-33 = "But it's actually equipped with a state-of-the-art system that allows it to move autonomously!"
1014505-34 = "So you only need to pretend to row. Just relax and go with the flow!"
1014505-35 = "[s] \"That's pretty nice.\""
1014505-36 = "Right? So even if the fog is so dense that you can't see in front of you..."
1014505-37 = "Simply turn on the auto-navigation and you'll glide back to the docks. There's nothing to worry about!"
1014505-38 = "Have fun out there and enjoy the sights!"
1014505-39 = "What is it, Sensei? Is something the matter?"
1014505-40 = "[ns] \"I'll be right there!\""
1014505-42 = "Kisaki climbed in and I started rowing."
1014505-43 = "As the guide said, even though I wasn't rowing properly, the boat was moving smoothly."
1014505-45 = "How serene."
1014505-46 = "Isn't it tiring, Sensei? You've been rowing all by yourself for a while now..."
1014505-47 = "[s] \"I'm fine.\""
1014505-48 = "Is that so? Fufu... Perhaps your arms are much stronger than I initially suspected."
1014505-49 = "A thousand peaks rise to encircle the plain, while a single river flows, cradling the land."
1014505-50 = "Do you see that, Sensei? Two herons are gazing at each other and frolicking. "
1014505-51 = "..."
1014505-52 = "Sensei, could you stop the boat for a moment?"
1014505-53 = "Water will flow until it finds the ocean, and time will show no regard for mankind..."
1014505-54 = "In this moment, through simply being with you, I feel like time itself has paused."
1014505-55 = "..."
1014505-57 = "The water is clear as birds gather on the white sands."
1014505-58 = "The endless river continues to flow."
1014505-59 = "How much sway could the riches of the world possibly have?"
1014505-60 = "As you and I remain here, I offer a toast to the clear sky."
1014505-61 = ""
1014505-62 = "Hmm?"
1014505-63 = "[s] \"What's the matter, Kisaki?\""
1014505-64 = "Look, Sensei."
1014505-65 = "The fog is thickening."
1014505-66 = "Fufu. This must be what the guide was speaking of."
1014505-67 = "I can see why the sages from the folktales spent every day in places like this."
1014505-70 = "― [log=키사키 수영복]What do you think, Sensei?[/log][wa:1280] "
1014505-72 = "― [log=키사키 수영복]Such colorful scenery, unfolding in front of us. [/log][wa:1990] "
1014505-75 = "― [log=키사키 수영복]Hmm, how orderly. [/log][wa:1010] "
1014505-78 = "― [log=키사키 수영복]The river, water, fog, and mountain peaks...[/log][wa:3390] "
1014505-80 = "― [log=키사키 수영복]And you are the only sight that holds my gaze. [/log][wa:3380] "
1014505-83 = "― [log=키사키 수영복]What is it that you see right now?[/log][wa:4130] "
1014505-85 = "― [log=키사키 수영복]Here, amidst the scenery, with me.[/log]"
1014505-88 = "― [log=키사키 수영복]Am I the only thing that's being etched in your eyes?[/log][wa:2290] "
1014505-91 = "― [log=키사키 수영복]Fufu... Have you heard this story before? [/log][wa:2930] "
1014505-94 = "― [log=키사키 수영복]A celestial maiden rides upon the wind...[/log]"
1014505-96 = "― [log=키사키 수영복]And like a feather, dances across the heavens.[/log][wa:520] "
1014505-99 = "― [log=키사키 수영복]Now, take in a deep breath, Sensei.[/log][wa:4640] "
1014505-101 = "― [log=키사키 수영복]You never know, in that split second...[/log][wa:490] "
1014505-104 = "― [log=키사키 수영복]You may feel me as well.[/log][wa:740] "
1014505-107 = "Oh, the fog...?"
1014505-109 = "[ns] \"It must be evaporating as the sun rises.\""
1014505-110 = "Fufu. I see."
1014505-111 = "It wasn't a bad experience, feeling like we were ascending to immortality together."
1014505-112 = "..."
1014505-113 = "Well, I suppose it's only right for those of us in the lower realms to live lives that befit us."
1014505-114 = "I think it's time to go home."
1014505-115 = "[s] \"As you command, Madam.\""
1014505-116 = ""
1014505-118 = ""
1014505-120 = "The boat leisurely took Kisaki and me back to the docks."
