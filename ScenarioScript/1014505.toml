[translation]
1014505-1 = "天界之旅"
1014505-2 = "昨夜妾身自行做了一番調查。"
1014505-3 = "據說來此溪谷若不乘船觀景，便與未曾到訪無異。"
1014505-4 = "[s] 「這樣啊……？」"
1014505-5 = "唔呣。"
1014505-6 = "其中趣味似乎在於乘上輕舟，親自划水前行，悠然遍覽山川勝景。"
1014505-7 = "如今雖時刻尚早，然而待至午後時分，想必其他遊客亦將陸續來此賞景。"
1014505-8 = "可不知為何……妾身更希望能與老師兩人靜靜地獨享這片景致呢。"
1014505-9 = "[s1] 「確實光從這裡看就已經很壯觀了。」\n[s2] 「如果從河上看的話，想必會更加震撼吧。」"
1014505-12 = "唔呣，那麼便前去一遊吧。"
1014505-14 = "──以上為注意事項的說明。感謝各位！"
1014505-15 = "雖然現在是夏天，但清晨的河水還是偏冷，請務必多加留意。"
1014505-16 = "祝各位旅途愉快！"
1014505-17 = "唔呣，著實令人期待啊。"
1014505-18 = "那便是遊河的輕舟嗎……據說可乘坐二至四人，看來確實如此呢。"
1014505-19 = "方才聽聞晨霧籠江之景如詩如畫，頗為可觀是嗎？"
1014505-20 = "可不是嗎！不過晨霧這種東西，並不是每次想要就會出現的……"
1014505-21 = "當你望著濃霧壟罩的河面，山巒在霧海中若隱若現的景象……"
1014505-22 = "簡直就像成為了傳說中的仙人一樣呢！"
1014505-23 = "呵呵。那確實值得期待啊。"
1014505-24 = "好了，趕緊出發吧。"
1014505-25 = ""
1014505-27 = ""
1014505-28 = "（正要跟著妃姬走向船隻的那一刻）"
1014505-29 = "啊，抱歉打擾一下。您是這位同學的監護人對吧？"
1014505-30 = "[s] 「咦？是的。算是吧。」"
1014505-31 = "我這邊有幾件事想補充一下。"
1014505-32 = "兩位稍後要搭乘的小船，看起來雖然是以傳統工法打造的竹筏……"
1014505-33 = "但裡頭其實搭載了最新的自動駕駛系統哦！"
1014505-34 = "所以只要做出划槳的樣子，營造一下氣氛就可以了！"
1014505-35 = "[s] 「那還挺方便的呢。」"
1014505-36 = "對吧？萬一因為霧氣太濃而迷失方向……"
1014505-37 = "只要切換成自動行駛模式就會自行回到這座碼頭，完全不用擔心！"
1014505-38 = "那麼，祝兩位旅途愉快！"
1014505-39 = "怎麼了，老師？莫非有什麼問題嗎？"
1014505-40 = "[ns] 「我馬上過去！」"
1014505-42 = "（載著妃姬划起了船槳）"
1014505-43 = "（正如導覽員所說，船只要擺出划槳的樣子就會自己向前行駛）"
1014505-45 = "真是寧靜啊。"
1014505-46 = "老師，汝還好嗎？一路上獨自划著船槳……"
1014505-47 = "[s] 「目前完全沒有問題哦。」"
1014505-48 = "是嗎？呵呵……看來老師的臂膀，遠比妾身所想的還要強健許多呢。"
1014505-49 = "千峰環野而立，一水抱地而流。"
1014505-50 = "老師，汝可有見到那幅美景？#n兩羽白鷺正彼此相望，歡快地相互嬉戲呢。"
1014505-51 = "……"
1014505-52 = "老師，能否讓船稍作停留？"
1014505-53 = "逝水終將歸滄海，歲月從不待韶華。"
1014505-54 = "僅僅是與老師如此相伴，世間萬物便如同靜止一般。"
1014505-55 = "……"
1014505-57 = "水清沙白群鳥歸。"
1014505-58 = "不盡江水滾滾來。"
1014505-59 = "世間富貴何足道。"
1014505-60 = "且共舉杯向蒼天。"
1014505-61 = ""
1014505-62 = "呼呣？"
1014505-63 = "[s] 「妃姬？怎麼了？」"
1014505-64 = "老師請看。"
1014505-65 = "霧氣漸漸覆滿江面了。"
1014505-66 = "呵呵，這便是導覽員方才所言的那番景致嗎。"
1014505-67 = "若是傳說中的神仙，想必便是生活於此景之中吧。"
1014505-70 = "― [log=키사키 수영복]如何，老師。[/log][wa:2080] "
1014505-72 = "― [log=키사키 수영복]那般絢麗多彩的景觀──如今成了這副模樣。[/log][wa:3150] "
1014505-75 = "― [log=키사키 수영복]唔呣，愈發洗鍊了呢。[/log][wa:1330] "
1014505-78 = "― [log=키사키 수영복]江、水、霧、山……[/log][wa:4790] "
1014505-80 = "― [log=키사키 수영복]以及老師……唯有汝映照於妾身眼中。[/log][wa:4580] "
1014505-83 = "― [log=키사키 수영복]汝的眼中又映照著什麼呢？[/log][wa:5010] "
1014505-85 = "― [log=키사키 수영복]在妾身與這片景色之中……[/log]"
1014505-88 = "― [log=키사키 수영복]汝可曾將妾身，囚禁於那雙眼眸之中？[/log][wa:3730] "
1014505-91 = "― [log=키사키 수영복]呵呵……汝是否曾聽聞這番逸事？[/log][wa:4010] "
1014505-94 = "― [log=키사키 수영복]仙女乘著風──[/log]"
1014505-96 = "― [log=키사키 수영복]如羽翼般漫舞於天際。[/log][wa:1960] "
1014505-99 = "― [log=키사키 수영복]試著閉上眼深吸一口氣吧，老師。[/log][wa:5440] "
1014505-101 = "― [log=키사키 수영복]如此一來，在那之中──[/log][wa:1610] "
1014505-104 = "― [log=키사키 수영복]或許能感受到妾身也說不定哦？[/log][wa:1140] "
1014505-107 = "哦？霧氣……"
1014505-109 = "[ns] 「隨著太陽升起，霧也開始散去了呢。」"
1014505-110 = "呵呵，原來如此。"
1014505-111 = "方才能與老師一同恍若羽化登仙，倒也頗為愜意呢。"
1014505-112 = "……"
1014505-113 = "也罷，塵世之人自當安於塵世之道。"
1014505-114 = "那麼，也是時候該折返了。"
1014505-115 = "[s] 「謹遵吩咐，門主大人。」"
1014505-116 = ""
1014505-118 = ""
1014505-120 = "（緩緩划著船，與妃姬一起回到了碼頭）"
