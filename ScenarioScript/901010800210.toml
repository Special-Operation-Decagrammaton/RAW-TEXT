901010800210-11 = "FOX 2, did you find anything?"
901010800210-12 = "Well, they were reading a guide manual before they went out on a patrol."
901010800210-13 = "\"Initial Inspection Route,\" \"Key Inspection Points,\" \"Emergency Contact List\"..."
901010800210-14 = "Looks like it's mostly work guidelines and patrol checklists..."
901010800210-15 = ""
901010800210-17 = ""
901010800210-18 = "Ah, there's something handwritten on the last page of the manual."
901010800210-19 = ""
901010800210-21 = ""
901010800210-22 = ""
901010800210-23 = "\"Once a week, at midnight, the person on duty must roll a drum barrel once around the port.\""
901010800210-24 = "What kind of order is that?"
901010800210-25 = "And are there any notes as to why?"
901010800210-26 = "Nope. It's just the order."
901010800210-27 = "Sounds like a Neapolitan creepypasta. Something like \"you should never enter Room 302 no matter what.\""
901010800210-28 = "And why shouldn't I enter Room 302?"
901010800210-29 = "Beats me. It wouldn't be a creepypasta if it had an explanation."
901010800210-31 = "This is not fiction. In our reality, there is always an intention behind every rule."
901010800210-32 = "We will discuss the possibilities later."
901010800210-33 = "FOX 2, continue searching the warehouse at this time."
