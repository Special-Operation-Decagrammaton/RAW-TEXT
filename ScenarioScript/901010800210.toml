[translation]
901010800210-11 = "뭔가 발견했나, FOX 2?"
901010800210-12 = "음, 조직원들이 순찰을 나가기 전에 읽는 가이드 매뉴얼을 확인하고 있었어."
901010800210-13 = "<초도 순회 구역 지도>, <주요 점검 요소>, <긴급 상황 발생 시 비상 연락망>…"
901010800210-14 = "대부분 평범한 근무 지침이나 순찰 점검 목록표처럼 보이는데—"
901010800210-18 = "아, 매뉴얼 마지막 장에 손 글씨로 추기한 내용이 있어."
901010800210-23 = "<매주 1회, 당직 근무자는 자정에 드럼통을 굴리며 항만을 한 바퀴 배회할 것>…… 이라는데?"
901010800210-24 = "그게 무슨 뚱딴지같은 지시야?"
901010800210-25 = "어째서 그런 행동을 해야 하는지, 이유나 목적 같은 건 적혀 있지 않았어?"
901010800210-26 = "응. 아무런 설명 없이 지시 내용만 적혀 있어."
901010800210-27 = "뭔가 나폴리탄 괴담 같은 지시네. '무슨 일이 있어도 절대 302호에 들어가지 마세요' 같은."
901010800210-28 = "왜 302호에 들어가면 안 되는데?"
901010800210-29 = "몰라. 그걸 설명할 수 있으면 괴담이 아니잖아?"
901010800210-31 = "지어낸 이야기라면 몰라도, 현실의 모든 지침에는 '의도'가 존재하는 법이지."
901010800210-32 = "이 지침의 의도에 대해서는 나중에 찬찬히 고민해 보도록 하자."
901010800210-33 = "FOX 2, 일단은 계속해서 창고 내부를 수색하도록."
