901010800210-8 = ""
901010800210-9 = ""
901010800210-10 = ""
901010800210-11 = "有發現什麼嗎，FOX2？"
901010800210-12 = "嗯，我剛才確認了組織成員出去巡邏前必須過目的指南手冊。"
901010800210-13 = "「初次巡邏區域地圖」、「主要檢查項目」、「緊急情況應變聯絡網」……"
901010800210-14 = "看起來大部分都是普通的勤務指南或是巡邏檢查清單──"
901010800210-15 = ""
901010800210-17 = ""
901010800210-18 = "啊，手冊最後一頁有手寫補充的內容。"
901010800210-19 = ""
901010800210-21 = ""
901010800210-22 = ""
901010800210-23 = "「每週一次，值班人員須於午夜推著鐵桶沿港口徘徊一圈」。#n上面是這麼寫的耶……？"
901010800210-24 = "那是什麼莫名其妙的指示啊？"
901010800210-25 = "沒有寫為什麼非得做那種事的理由或目的嗎？"
901010800210-26 = "嗯。沒有任何說明，只寫了指示內容。"
901010800210-27 = "這個指示總有一種那布勒斯怪談的感覺呢……#n就像「無論發生什麼事都絕對不要進入302號房」那樣。"
901010800210-28 = "為什麼不能進302號房？"
901010800210-29 = "不知道。要是能說明清楚，那就不叫怪談了吧？"
901010800210-31 = "虛構的的故事另當別論，但現實中所有的指示都必定存在著「意圖」。"
901010800210-32 = "關於這項指示的意圖，之後再仔細研究。"
901010800210-33 = "FOX2，先繼續搜索倉庫內部吧。"
