901010800210-11 = "เจออะไรบ้างมั้ย FOX 2?"
901010800210-12 = "อืม ฉันกำลังดูคู่มือแนะนำที่ให้สมาชิกองค์กรอ่านก่อนออกลาดตระเวนอยู่"
901010800210-13 = "<แผนที่พื้นที่ตรวจตรารอบแรก>, <หัวข้อสำคัญที่ต้องตรวจสอบ>, <เครือข่ายติดต่อเมื่อเกิดเหตุฉุกเฉิน>..."
901010800210-14 = "ส่วนใหญ่ก็ดูเป็นแนวทางการปฏิบัติงานและรายการตรวจตราทั่วไป..."
901010800210-15 = ""
901010800210-17 = ""
901010800210-18 = "อ๊ะ หน้าสุดท้ายของคู่มือมีข้อความที่เขียนเพิ่มด้วยลายมือด้วย"
901010800210-19 = ""
901010800210-21 = ""
901010800210-22 = ""
901010800210-23 = "เขียนไว้ว่า... <เจ้าหน้าที่เวรต้องกลิ้งถังเหล็กเดินวนรอบท่าเรือในเวลาเที่ยงคืน สัปดาห์ละ 1 ครั้ง>"
901010800210-24 = "นั่นมันคำสั่งบ้าอะไรกันน่ะ?"
901010800210-25 = "ไม่มีเขียนไว้เหรอว่าทำไมต้องทำแบบนั้น หรือมีเหตุผลกับจุดประสงค์อะไร?"
901010800210-26 = "อื้อ มีแค่คำสั่งเฉยๆ ไม่มีคำอธิบายอะไรเลย"
901010800210-27 = "เหมือนคำสั่งในเรื่องเล่าลึกลับแบบนาโปลิตันเลยนะ ประมาณว่า \"ไม่ว่าจะเกิดอะไรขึ้น ห้ามเข้าไปใน#nห้อง 302 เด็ดขาด\""
901010800210-28 = "แล้วทำไมถึงห้ามเข้าห้อง 302 ล่ะ?"
901010800210-29 = "ไม่รู้สิ ถ้าอธิบายได้ มันก็ไม่ใช่เรื่องเล่าลึกลับหรอก"
901010800210-31 = "ถ้าเป็นเรื่องแต่งก็อีกเรื่อง แต่คำสั่งทุกอย่างในโลกแห่งความจริงย่อมมี 'เจตนา' อยู่เสมอ"
901010800210-32 = "เรื่องเจตนาของคำสั่งนี้ เอาไว้ค่อยพิจารณากันทีหลังอย่างละเอียด"
901010800210-33 = "FOX 2 ตอนนี้ค้นภายในโกดังต่อไปก่อน"
