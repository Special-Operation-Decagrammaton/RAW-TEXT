10057070-210 = "그걸로?! 페인트로 어떻게 티타늄을 만들어?"
10057070-211 = "크롤법을 썼어! 하얀색 페인트 주성분이 이산화티탄이잖아? 사염화티탄으로 만들고, 거기서 다시 티타늄을 추출한 거야."
10057070-212 = "구닥다리 설비로 이만큼 뽑아내기 힘들었다구, 낭비하지 말고 소중하게 써!"
