[translation]
10057070-1 = "第7話;何もそこまで"
10057070-8 = "うわあああっ！！"
10057070-12 = "よくも事務局の公務を妨害してくれたな！！コソ泥反乱分子め！！"
10057070-13 = "コソ泥なんかじゃありません！スローガンに徹しているだけです！！"
10057070-14 = "親衛隊！！親衛隊！！反逆だ！！クーデターだ！！"
10057070-15 = "現在地は、えっと――"
10057070-19 = "ええいっ！！このポンコツ無線機！！！"
10057070-21 = "ここで応援が来ちゃったらアウトだよ！"
10057070-22 = "弾薬はもうないし、どうしよ……。"
10057070-25 = "「チョップブロック」やるわよ！！私は「ラリアット」で行くから！！！"
10057070-26 = "「アレ」を！？う、うわあああ！！もう知らないよ～！！！"
10057070-37 = "うおおおおおっ！！！"
10057070-39 = "い、一体何を。"
10057070-41 = "「High and Low」！！！"
10057070-56 = "っしゃー！"
10057070-61 = "ぐあああっ！"
10057070-66 = "やっちゃった！？"
10057070-70 = "マリナ委員長！？どちらですか！？"
10057070-71 = "やっちゃったね！"
10057070-72 = "早く逃げないと！材料は揃った？"
10057070-73 = "もち！じゃあ逃げよう！！"
10057070-76 = "ちょ、ちょっと待った！いっこ忘れてた！待ってて！！"
10057070-82 = "早く行かないと！急いで！"
10057070-83 = "よしっ！"
10057070-84 = "行こう！！急げ～！！"
10057070-85 = "むぐぐ……重いんだから、一緒に持ちなさいよ！"
10057070-94 = "ふむ……。"
10057070-95 = "バランスもこれでよし、と。かっこいいですよ、会長。"
10057070-96 = "銅の確保、完了。"
10057070-100 = "ラナ！ちゃんと集められた！？もう行くよ！"
10057070-101 = "あ、もう少し調整したい……。"
10057070-103 = "そんな時間ないって！ほら、急いで～！"
10057070-104 = "逃げろー！！！"
10057070-116 = "[log]戦車レース予選まで[/log]"
10057070-118 = "[log]D-2[/log]"
10057070-124 = "うむ！今日も素晴らしい朝だな！"
10057070-125 = "は、はい！非常に素晴らしい朝です！"
10057070-126 = "ん？どうした、マリナ委員長？顔色が良くないな。"
10057070-130 = "何でもありません！事務局員はこのくらいのことでへこたれませんので！"
10057070-131 = "（昨日侵入者にコテンパンにやられた挙句、そのまま取り逃がしたとは言えない！！）"
10057070-132 = "マリナ委員長。事務局員といえども、疲れない日などないだろう。"
10057070-133 = "トモエ秘書室長がゲヘナカップの準備で忙しい中、#nマリナ委員長がその分頑張ってることは知っているぞ。"
10057070-134 = "昨夜も巡回があったと聞いている。ご苦労だったな。"
10057070-135 = "ちぇ、チェリノ会長……！"
10057070-138 = "（チェリノ会長、今日は機嫌が良さそうだ！）"
10057070-139 = "（このまま何もなかったということで通してしまおう！）"
10057070-140 = "（これまで散々迷惑をかけたのに、こんなにも慈悲深い賞賛をいただけるなんて……）"
10057070-141 = "（会長、このマリナは不変の忠誠を誓います……！）"
10057070-142 = "そういえば。"
10057070-146 = "はい！"
10057070-147 = "ここにあったおいらの等身大銅像は、どこにいったのだ？"
10057070-152 = "は、はいぃ！？ど、銅像ですか！？"
10057070-153 = "そうだ。昨日の夕方までは威厳ある銅像が立っていたのだが。"
10057070-164 = "……。"
10057070-165 = "……。"
10057070-166 = "これは……フィギュア、か……？"
10057070-168 = "183号研究室"
10057070-172 = "銅線の加工、終わった。"
10057070-173 = "すご～い！こんな良い銅、事務局にあったんだ！"
10057070-174 = "これだけあったら、スターターモーターも新しく作れるね！"
10057070-176 = "どこから持ってきたの？"
10057070-181 = "あえて言うなら、会長からの慈愛に満ちたプレゼント。"
10057070-185 = "（あの不審者、廊下の壁を削ったのか！？）"
10057070-189 = "マリナ委員長。これは何だ？廊下のペンキが剥がれてしまっているではないか。"
10057070-190 = "そ、それはですね！"
10057070-194 = "チェリノ会長のオーラをさらに引き立てるために、#nより適したペンキを塗る準備をしていたんです！"
10057070-195 = "そうなのか？そんな報告はなかったが。"
10057070-196 = "は、はは！！サプライズですので！"
10057070-197 = "広場の銅像がフィギュアになったのもサプライズか？"
10057070-198 = "そのとおりです！最近は生徒会長を象徴するミニグッズが流行しているようなので！"
10057070-199 = "……。"
10057070-200 = "あ、あはは！！"
10057070-206 = "はい！アンナが欲しがってたチタン！まだ熱いから気を付けてね！"
10057070-207 = "うわっ！チタンなんて、どこで手に入れたの？持ってくるとこ見てないけど。"
10057070-208 = "ふっふっふ……化学者を見くびってもらっちゃあ困るな～！"
10057070-209 = "これはあの時削り取った白いペンキから作ったんだよ。"
10057070-210 = "あれで！？ペンキがどうやってチタンになるの？"
10057070-211 = "クロール法を使ったの！#n白いペンキの主成分は二酸化チタンでしょ？#n四塩化チタンを生成して、そこから金属チタンを分離して完成。"
10057070-212 = "ポンコツ設備でこれだけ取り出すのは大変だったんだから、大切に使ってよ！"
10057070-213 = "[s] \"友達と仲良くなったね。\""
10057070-219 = "友達ではありません！！"
10057070-220 = "単なる協力関係です。研究のために仕方なくですから！"
10057070-221 = "こっちだってそう！優勝して解散したら、永遠にサヨナラ～！"
10057070-227 = "ふんっ！"
10057070-228 = "[s] \"ああっ……仲良かったのに……。\""
10057070-230 = "ふんっ！！"
10057070-233 = "……どうやら、マリナが一晩の間にあれこれやってくれたようだな。"
10057070-234 = "ち、チェリノ会長の気分転換になればと思ってのことです！"
10057070-235 = "そうか……。"
10057070-236 = "誰かが侵入して[ruby=サボタージュ]破壊活動[/ruby]でもしたのかと心配したが――"
10057070-237 = "マリナが鉄壁となって守ってくれていたおかげで、何もなくて良かった。"
10057070-238 = "たとえあったとしても、髭の権威に逆らうやつらを放っておくはずがないからな。"
10057070-243 = "（昨夜のこと、バレたら終わりだ！）"
10057070-244 = "まあ、休みながらのんびりやってくれ。"
10057070-245 = "ときにマリナ、今日はずいぶんと爽やかな朝だと思わないか？"
10057070-246 = "おっしゃるとおりです！会長の傑出したご指導により、#nレッドウィンターの気候も徐々に改善されているようです。"
10057070-247 = "そうだな。今日は空気も清々しい。"
10057070-248 = "会長の卓越したご指導で空気まで改善されたのでしょう！"
10057070-252 = "おいらが言いたいのは――"
10057070-253 = "この清々しくて爽やかな空気が……#nどうして今、この執務室に流れているかということだ。"
10057070-254 = "はい！？"
10057070-260 = "窓ガラスは一体どこにいったのだ！！！"
10057070-271 = "183号研究室"
10057070-274 = "よし！照準器の加工も終わり！"
10057070-275 = "ホウケイ酸ガラスなんて、会長の執務室は窓ガラスも良いものを使ってるのね！"
10057070-276 = "窓ガラスを持ってくるなんて、正直驚いたわ。さす――"
10057070-283 = "すぅ……すぅ……。"
10057070-284 = "ストーブつけると、すぐ熟睡しちゃうんだから……。"
10057070-285 = "徹夜で大騒ぎしたあと、今の今まで作業したんだから……そりゃ疲れるか。"
10057070-289 = "もう、80％ぐらいは進んだかな。"
10057070-293 = "……完成はもう目の前。"
10057070-294 = "さすが、シャーレの先生……。"
10057070-295 = "……。"
10057070-297 = "……本当に「奇跡」を起こしちゃうなんて思わなかった。"
