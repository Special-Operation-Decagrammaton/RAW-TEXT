10057070-194 = "체리노 회장님의 광채를 더 돋보이게 하기 위해서, 더 밝은 페인트로 칠하는 준비 중에 있었습니다!"
10057070-195 = "그래? 별도로 그런 내용은 보고받은 적이 없는데."
10057070-196 = "하, 하하!! 깜짝 리모델링이라서 그렇습니다!"
10057070-197 = "광장의 내 동상이 피규어가 된 깜짝 이벤트처럼, 말인가?"
10057070-198 = "그렇습니다! 요새는 학생회장을 상징하는 작은 굿즈들이 유행한다고 하지 않습니까!"
