10057070-200 = "아, 아하하!!"
10057070-206 = "자! 네가 달라고 한 티타늄! 아직 뜨거우니까 집게로 집어!"
10057070-207 = "우왓! 티타늄이라니, 대체 어디서 구한 거야? 가져오는 거 못 봤는데."
10057070-208 = "훗훗후…… 화학자를 얕보는구만~!"
