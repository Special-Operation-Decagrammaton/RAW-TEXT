[translation]
1008902-1 = "걸어 둔 드레스"
1008902-2 = "(무슨 일이 있는 건 아닌지 걱정이 됐기에, 흥신소 사무실을 찾아갔다.)"
1008902-8 = "[ns1] \"……어라, 열려 있네.\"\n[ns2] \"계십니까~?\""
1008902-11 = "……음? 선생님?"
1008902-16 = "무슨 일이야? 오늘 우리와 뭔가 약속 같은 게 있었던가?"
1008902-17 = "아니, 그럴 리가. 일정은 내가 다 기억하고 있는데……."
1008902-18 = "음? 그런 건 아니라고?"
1008902-19 = "……그냥 들러 봤어?"
1008902-20 = "뭐, 뭐……. 물론 안 될 거야 없지! 마침 나도 지금은 딱히 큰 일정이 없고……."
1008902-21 = "협력 관계를 공고히 하는 일정이라고 생각하면 되겠지? 들어와, 선생님."
1008902-30 = "……저기, 선생님?"
1008902-31 = "정말로 그냥 온 거야? 선생님은 그런 식으로 움직이는 것 같지 않던데……."
1008902-32 = "역시 뭔가 있는 거겠지……?"
1008902-36 = "눈치 볼 거 없이 바로 이야기해 줘. 우리 사이에 그런 가식은 필요 없으니까."
1008902-37 = "……음?"
1008902-38 = "아침에 보냈던 모모톡……?"
1008902-42 = "……아."
1008902-46 = "아하……. 그, 그렇군. 으음……. 역시 쓸데없이 신경 쓰이게 만든 건가……."
1008902-47 = "그, 그건 정말로 아무 일도 아닌데……. 오히려 이렇게 설명하라고 하면 좀 민망한 것 같기도……."
1008902-48 = "……음?"
1008902-49 = "왜 그래, 선생님?"
1008902-50 = "……아아. ……저거?"
1008902-55 = "[ns3] \"……어라. 뭔가 장식해 둔 느낌이네.\"\n[ns4] \"깨끗하네. 그 뒤로 한 번도 안 입은 거야?\""
1008902-58 = "으, 으음……."
1008902-59 = "그, 그렇지. 아무래도 좀……."
1008902-60 = "뭐랄까. 저번 일도 있고, 이래저래 신경이 쓰여서……."
1008902-65 = "사실 아침에 상담 좀 해볼까 했던 것도 저 이야기긴 해. 어쩌다 보니 잘 이어졌네."
1008902-66 = "[s5] \"상담……?\"\n[s6] \"저 옷에 대해서?\""
1008902-69 = "응……."
1008902-70 = "저번 의뢰 때에 기세 좋게 구한 것까진 좋았는데, 막상 쓰려니 잘 모르겠달까."
1008902-71 = "의외로 딱히……. 저 옷을 입고 있다고 해서 뭔가 일이 크게 달라지는 것 같지도 않고."
1008902-72 = "막상 가끔 기분 내는 정도의 의미밖에 없는 것 같다고 해야 하나……."
1008902-73 = "하아……."
1008902-74 = "차라리 정리하고 그 돈을 흥신소 운용비에 보태는 게 나을까?"
1008902-75 = "……값도 꽤 나가는데."
1008902-76 = "그런데 그렇게 생각하다 보니……. 정말로 좋은 생각일까? 하는 생각도 좀 들어서……."
1008902-77 = "선생님이라면 어떻게 대답할까 궁금했어. 나중에라도 시간이 괜찮으면 좀 물어보려 했지."
1008902-78 = "아침의 모모톡은 그게 전부. 그 이상은 없어."
1008902-79 = "……대답이 됐을까?"
1008902-80 = "……응?"
1008902-81 = "……'가끔 기분 내는 것 정도의 의미'면 이미 충분한 거 아니냐고? 되팔기에는 아까운 것 같다고?"
1008902-82 = "옷 자체는 마음에 드는 게 아니었냐고?"
1008902-83 = "아, 아니. 그런 건 아닌데. 당연히 좋지. 고르기도 내가 고른 거고……."
1008902-84 = "그렇지만 당장은 딱히 방도가 없으니까. 옷 같은 것보다……. 우리 흥신소 운용이 중요하고."
1008902-85 = "……확실히 조금 아깝긴 하지만."
1008902-86 = "……응?"
1008902-87 = "저 옷을 입고 뭘 하고 싶은지 구체적으로 생각해 본 적 있냐고?"
1008902-88 = "어……. 아, 아직……? 글쎄……?"
1008902-89 = "……? 응?"
1008902-90 = "그러면 더더욱 옷을 파는 건 아닌 것 같다고? ……어째서?"
1008902-91 = "아직 옷을 어떻게 쓸지에 대한 방안은……."
1008902-92 = "[s7] \"억지로 생각하려 하지 않으면, 자연스레 떠오를 거야.\"\n[s8] \"입을 때를 찾는 게 아니라, 입어야 할 때 옷을 찾는 거야.\""
1008902-95 = "……????"
1008902-96 = "으, 으음……? 그런……가……?"
1008902-97 = "무슨 말이지……."
1008902-98 = "뭔가 알 것 같기도 하고……. 아닌 것 같기도 하고……."
1008902-102 = "……후훗."
1008902-103 = "뭐, 좋아. 어쨌거나 선생님의 의견은 '일단 가지고 있는다' 쪽이라는 거네."
1008902-107 = "그 의견, 받아들이도록 하겠어. 파는 것에 대한 이야기는 일단 보류."
1008902-108 = "……후우!"
1008902-109 = "뭔가 이유는 모르겠지만……. 아무것도 해결된 게 없는데, 오히려 속이 좀 시원해졌어."
1008902-110 = "……그러네. 역시 선생님이야."
1008902-111 = "아니면 선생님이 한 말이라서일까……? 딱히 그런 건 아니라고?"
1008902-112 = "후훗……."
1008902-113 = "이럴 줄 알았으면, 아까 전 모모톡으로 연락할 때 처음부터 그냥 물어볼 걸 그랬나 봐."
1008902-117 = "…………음……."
1008902-118 = "[s9] \"……아루?\"\n[s10] \"왜 그래?\""
1008902-121 = "……아니."
1008902-122 = "방금 말은 취소."
1008902-123 = "역시 회의는 문자나 전화보다 대면으로 하는 게 맞겠지? 회의의 질이 다르니까 말이야."
1008902-124 = "……후훗."
1008902-125 = "그러니 앞으로도 종종……."
1008902-126 = "무슨 일이 있으면, 이렇게……."
1008902-132 = "찾아와서 '직접' 논의해 줬으면 좋겠어, 선생님."
