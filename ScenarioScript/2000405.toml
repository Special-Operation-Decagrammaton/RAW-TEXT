[translation]
2000405-1 = "열사병 방지 대책"
2000405-2 = "무이가하마 해수욕장"
2000405-3 = "하아~ 수영을 하기 전에 기분 좋게 땀을 흘리니 상쾌하네요."
2000405-4 = "이대로 시원한 바닷물에 뛰어든다면 분명 기분 좋겠죠~."
2000405-5 = "하지만 아직 다리 근육이 완전히 풀리지 않은 것 같으니, 한 세트만 더 뛰어볼까요?"
2000405-6 = "[s1] \"수영을 하기도 전에 지쳤어…….\"\n[s2] \"언제까지 계속 체조만 반복할 셈이야?\""
2000405-7 = "네? 아직 준비 운동은 끝나지 않았는 걸요?"
2000405-8 = "네? 아직 준비 운동은 끝나지 않았는 걸요?"
2000405-9 = "팔 다리를 완벽하게 풀어 두어야 물에 들어갔을 때 쥐가 나지 않는다고요."
2000405-10 = "[s] \"이러다가 또 열사병으로 쓰러지겠어…….\""
2000405-11 = "걱정 마시길. 저번처럼 열사병으로 쓰러지는 일이 발생하지 않도록 이번에는 준비를 철저히 해 왔거든요."
2000405-14 = "[ns] \"……이건?\""
2000405-15 = "열사병 방지 대책입니다."
2000405-16 = "아이스 캔디부터 청량 음료까지…… 몸을 식혀줄 수 있을 만한 시원한 음식들을 아이스박스에 가득 담아왔답니다."
2000405-17 = "선생님께서도 훈련 중에 차가운 빙과가 필요하시면 바로 말씀해주세요."
2000405-18 = "[s] \"난 지금 필요해…….\""
2000405-19 = "훈련을 시작하고 아직 한 시간도 지나지 않았는데요?"
2000405-20 = "확실히 오늘은 평소보다 조금 더 더운 것 같기는 합니다만……."
2000405-24 = "……그럼 이르지만 잠깐 아이스 캔디라도 먹으며 휴식을 취하도록 할까요?"
2000405-27 = "[wa:450]― 선생님은[wa:500] 아이스 캔디를[wa:850] 깨물어서 드시나요,"
2000405-29 = "[wa:750]― 녹여서 드시나요?"
2000405-32 = "[wa:900]― 저는[wa:850] 천천히[wa:500] 녹여 먹는 편입니다.[wa:50]"
2000405-34 = "― 그 편이[wa:1000] 아이스 캔디의 맛을[wa:1200] 오래 즐길 수 있거든요."
2000405-37 = "[wa:1250]― 냠……[wa:1850] 핥짝, [wa:800]핥짝."
2000405-40 = "[wa:850]― ……네?[wa:1050] 먹는 방법이[wa:1050] 이상하다고요?"
2000405-43 = "[wa:100]― 저는 [wa:1450]평범하다고 생각합니다만……"
2000405-45 = "― 뭔가[wa:500] 이상한가요?"
2000405-48 = "[wa:900]― 선생님……[wa:1350]어쩐지[wa:500] 또"
2000405-50 = "― 수상한[wa:300] 표정을[wa:450] 짓고 계십니다만……."
2000405-53 = "[ns] \"아이스 바 막대에 뭔가 쓰여있는데…….\""
2000405-54 = "아, 드디어 발견하셨군요. 그건 당첨 막대입니다."
2000405-55 = "아이스 캔디 중에는 당첨 막대를 통해 추가 아이스크림을 제공하는 상품이 있지 않습니까?"
2000405-56 = "이를 참고해서 저도 아이스 캔디 안에 특별한 당첨 메시지를 적어 두었습니다."
2000405-57 = "만약 선생님께서 당첨 막대를 뽑으신다면 제가 준비한 특별 상품을 드리겠습니다."
2000405-58 = "[s3] \"그거 기대되는걸.\"\n[s4] \"어떤 상품이 당첨되었으려나…….\""
2000405-63 = "어디보자…… 특별……"
2000405-64 = "축하합니다! <특별 체조 훈련 1세트 더!>에 당첨되셨군요!"
2000405-65 = "[s] \"그게 뭐야!\""
2000405-66 = "<특별 체조 훈련 1세트 더!>는 제가 준비한 특별한 체조 훈련을 받으실 수 있는 당첨권입니다."
2000405-67 = "준비한 아이스 캔디 중 단 한 개에만 적어 둔 당첨 메시지인데, 거기에 당첨되시다니……"
2000405-68 = "운이 좋으시군요. 선생님."
2000405-69 = "[s] 도망친다."
2000405-70 = "도망치시면 안 됩니다, 선생님! 당첨권의 유효기간은 오늘까지라고요!"
2000405-71 = "자. 그럼 아이스 캔디도 다 먹었으니, 함께 특별 체조 훈련을 하도록 하죠!"
2000405-73 = "(이후, 마시로와 함께 격렬한 준비 운동을 하느라 지쳐 결국 수영은 포기했다…….)"
