[translation]
90000030-1 = "제4화;정보수집 3 - PMC 발굴지"
90000030-2 = "밀레니엄 자치구의 외곽 지역"
90000030-4 = "안녕, 선생님. 기다리고 있었어."
90000030-5 = "드디어 새로운 부실이 준비되었어."
90000030-6 = "[s] \"새로운 부실?\""
90000030-7 = "응. 저번 작전 때 쓰던 곳은 데카그라마톤에게 노출되어 버렸잖아?"
90000030-8 = "위치까지 들켜버려서 역으로 우리가 해킹당할 뻔했었고. 그쪽의 기재들도 죄다 부숴버려서 더 이상 쓸 수 없거든."
90000030-9 = "그래서 히마리 부장이 단단히 마음 먹고 새로운 장소를 준비해 두었어."
90000030-10 = "부장의 말대로라면, 이 키보토스에서 데카그라마톤으로부터 가장 안전한 장소라고 하던데……."
90000030-11 = "뭐, 자세한 건 가서 부장에게 듣는 게 좋을 거 같아."
90000030-15 = "다른 사람들에게도 비밀인 구역이니까, 여기서부터는 나를 잘 따라와 줘."
90000030-16 = "[s] \"알겠어.\""
90000030-23 = "(에이미를 따라서 후미진 골목길 안쪽으로 들어가, 몇번의 엘리베이터를 갈아타고, 몇 개의 비밀 문을 지나서 간신히 어떤 장소에 도달할 수 있었다.)"
90000030-28 = "초현상특무부 부실"
90000030-30 = "[ns] \"여기는…….\""
90000030-31 = "부장. 선생님을 데려왔어. ……부장?"
90000030-37 = "……부장? 히마리 선배?"
90000030-38 = "……설마?!"
90000030-49 = "[ns] \"히마리……?!\""
90000030-50 = "부장……."
90000030-58 = "끼햐아아앙--??!"
90000030-62 = "뭐, 뭐죠? 무슨 일이?! 뭔가……. 어라, 에이미?!"
90000030-63 = "……선생님을 모셔 왔어. 부장."
90000030-64 = "[s] \"……안녕, 히마리.\""
90000030-65 = "……. 어…… 음……."
90000030-66 = "……안녕하세요, 선생님. 기다리고 있었습니다."
90000030-67 = "드디어 선생님에게 소개드릴 수 있게 되었네요. 이곳이 바로 저희 <초현상특무부>의 부실입니다."
90000030-68 = "특별히 제가 발명한 특수 방화벽 시스템으로 철저하게 보호되고 있는…… 말하자면 키보토스에서 데카그라마톤으로부터 가장 안전한 장소."
90000030-69 = "지금 시점에서는 저와 에이미, 그리고 선생님만이 존재를 알고 있는, 존재 자체가 극비인 공간이죠."
90000030-70 = "후후후……. 어떠신가요? 마치 비밀 컬트 집단의 아지트 같은 느낌이지 않나요? 참고로 자고 있었던 건 아니에요."
90000030-71 = "부장. 이쪽에 침이 흐르고 있어."
90000030-72 = "……."
90000030-73 = "그렇게 원망스러운 얼굴을 해 봤자……. 부실의 온도를 너무 높여놔서 졸린 거 아냐?"
90000030-74 = "실내 적정 온도는 12도 정도가 딱 좋으니까, 시원해지면 잠도 깰 거야."
90000030-80 = "아뇨, 무슨 소릴 하는 거죠? 숫자가 이상하잖아요? 제가 최상의 컨디션으로 작업을 하기 위해서는 실내 온도 앞자리가 3은 되어야 해요."
90000030-85 = "3도?"
90000030-90 = "여기가 냉장고인가요? 두자리 숫자라구요. 당연히."
90000030-95 = "[ns] \"저기…… 여러분…….\""
90000030-99 = "[ns3] \"한쪽에서 격렬하게 에어컨이 돌아가고 있고…….\"\n[ns4] \"다른 한쪽에서는 격렬하게 히터가 돌아가고 있는데요…….\""
90000030-100 = "포기해. 부장. 전기가 아깝지 않아?"
90000030-101 = "포기해. 부장. 전기가 아깝지 않아?"
90000030-102 = "에이미야말로 포기하시죠. 참고로 전기 요금은 리오 앞으로 청구될 예정이에요."
90000030-103 = "철두철미하네. 그럼 남은 방법은 그것뿐인가."
90000030-107 = "네? 그것?"
90000030-108 = "……아뇨아뇨. 또 왜 그런 결론으로 귀결되는 거죠? 지성인답게 여기서는 대화로 해결해야 하지 않겠어요?"
90000030-109 = "[s] 에어컨과 히터의 전원을 끈다."
90000030-115 = "[ns] \"중간 온도로 맞췄으니까, 둘 다 조금만 참아 줘.\""
90000030-116 = "……. 알겠어. 덥긴 하지만 못 견딜 정도는 아니니까."
90000030-117 = "……흠. 별 수 없군요. 이 정도로 쌀쌀한 편이 머리를 식히는데도 도움이 될 것 같으니까요."
90000030-118 = "[s] \"……고마워. 모두.\""
90000030-121 = "부장. 그러면 우리의 다음 작전 계획은 뭐야?"
90000030-122 = "……우리의 목표는 데카그라마톤이라는 존재의 정체를 밝히는 것이었죠."
90000030-123 = "그것을 위해 정보 수집을 진행하다가…… 오히려 데카그라마톤에게 우리들의 존재가 발각되는 사태가 벌어졌습니다."
90000030-124 = "아무리 방심하고 있었다지만 이런 굴욕을 당하다니……. 밀레니엄의 최강의 해커이자 미소녀인 제 명예에 흠집이 나버렸네요."
90000030-125 = "(미소녀는 관계 없지 않아?)"
90000030-126 = "저쪽은 우리를 인지하고 있지만, 우리는 저쪽의 정체를 전혀 모른다……. 지금 우리에게 유리한 상황은 아닌 거죠."
90000030-127 = "지금 이 상황을 뒤집지 않는 이상, 이 싸움은 계속 저쪽의 흐름에 끌려가게 될 거예요."
90000030-128 = "그러니 지금부터는 목표를 수정해서, 데카그라마톤의 <예언자>를 찾아내는 것을 최우선 목표로 삼겠습니다."
90000030-129 = "예언자…… 말이지. 이해했어. 직접 찾는 것보다는 그쪽이 확실히 지름길이겠네."
90000030-130 = "네. 데카그라마톤을 정보생명체라고 정의한다면 확실히 예언자라는 개념은 이상하죠."
90000030-131 = "자신의 <클론>도 아니고, 명령을 수행하는 <부하>도 아닌, 독립적으로 판단하고 행동하는 <추종자>……. 그중에서도 <예언자>라는 표현을 쓰다니."
90000030-132 = "……뭐, 그렇게 명명한 이유는 아직 모르겠지만."
90000030-134 = "이 예언자의 정보를 수집하고 분석하면 우리는 조금 더 저 정체불명의 AI에 대해 알 수 있게 될 거예요."
90000030-135 = "지금까지 확인된 예언자는 모두 셋."
90000030-136 = "<비나>, <헤세드>, 그리고 아마도…… <호드>까지."
90000030-137 = "이들의 이름, 그리고 선생님이 증언한 것을 기반으로 추측해보건대, 이들은 모두 <생명의 나무>라고 불리는 고대의 비의와 관계가 있는 것 같아요."
90000030-138 = "생명의 나무……?"
90000030-142 = "이것이 바로 <생명의 나무>입니다. 현재 키보토스에서는 알아내는 것이 거의 불가능한, 잊혀진 비의 중 하나예요."
90000030-143 = "불가능……? 그럼 히마리 선배는 어떻게 알고 있는 거야?"
90000030-144 = "어머? 거의 불가능한 것이지, 절대 불가능한 것은 아니니까요. 에이미? 제 별칭이 뭔지 아세요?"
90000030-145 = "어. ……정화조에 둥둥 떠 있는 한 떨기 꽃……?"
90000030-146 = "아뇨아뇨. 절반만 맞았어요. 게다가 앞에 건 리오의 별명이잖아요. 이상하게 섞으면 안 되죠. 에이미. 키보토스의 상식이잖아요. 학생의 본분이잖아요."
90000030-147 = "……. 상식이었나."
90000030-148 = "천재. 뭐든지 다 알고 있는 <전지> 학위의 소유자라고 불린다고요. 저에게 이정도야 식은 죽 먹기예요."
90000030-149 = "……응."
90000030-150 = "그런데 전부터 궁금했는데, 그런 학위가 밀레니엄에 진짜 있어?"
90000030-151 = "소문은 들었지만 진짜 그런 학위가 있다는 건 들어보질 못했는데. 무엇이든지 안다니, 너무 굉장한 이름이잖아."
90000030-152 = "후후후……. 이 세상에선 때로 이미지 메이킹을 위한 포퓰리즘이 필요한 상황도 있는 법이에요, 에이미."
90000030-153 = "……."
90000030-154 = "[s] \"어…… 저기. 여러분. 슬슬 다시 본론으로 돌아갔으면 하는데.\""
90000030-155 = "아, 네……."
90000030-156 = "미안. 선생님. 또 부장에게 휘말려버렸어."
90000030-157 = "아뇨아뇨. 휘말린 건 제쪽이라고요."
90000030-158 = "……아무튼."
90000030-159 = "다시 본론으로 넘어갈게요. 자, 이걸 보시면……."
90000030-163 = "이 <생명의 나무>에는 모두 10개의 <세피라>라는 속성이 존재하고 있어요. 데카그라마톤의 예언자들은 바로 이 세피라의 이름을 표방하고 있고요."
90000030-164 = "<비나>, <헤세드>, <호드>……. 모두 세피라의 이름이죠."
90000030-165 = "그렇다면 아직 우리가 알지 못하는 예언자가 7명이 더 있다는 걸까? 그만큼이나 더 있는 건가……."
90000030-166 = "생명의 나무는 <신의 섭리로 향하는 길>을 상징한다고 해요. 즉, 10개의 세피라를 통해 신이 된다…… 이것은 데카그라마톤의 주장과 일치해요."
90000030-167 = "무슨 이야기인지 전혀 알 수 없는 오컬트의 영역이지만…… 그런 존재가 실존하고 있다는 것을 두 눈으로 확인한 이상, 이 정보는 무시할 수 없어요."
90000030-168 = "생명의 나무…… 세피라…… 신의 섭리에 이르는 길…… 이것들의 의미를 알아내려면…… 이 10개의 예언자들의 정보를 확보할 수밖에 없어요."
90000030-169 = "정보를 확보……? 어떻게 해야 하지?"
90000030-173 = "직접 그들과 조우해야겠죠."
90000030-176 = "음…… 역시 그건가. 하지만 알려져 있는 예언자는 둘 뿐이야. 그중에 호드는 추측일 뿐이고."
90000030-177 = "그렇죠. 하지만…… 할 수 있는 일부터 시작할 수밖에 없어요. 그 도중에 새로운 방법을 찾아낼 지도 모르고."
90000030-178 = "[s] \"이해했어. 그럼 바로 시작해보자.\""
90000030-179 = "응. 그럼 나도 이견없어."
90000030-180 = "네. 그럼, 초현상특무부의 다음 임무는, <비나>와 <헤세드>를 찾아내어 이들의 데이터를 확보한다…… 라는 것이 되겠네요."
90000030-184 = "<초현상특무부>의 데카그라마톤 분석 작전. 다시 시작하겠습니다."
90000030-188 = "그럼 다음 목표는 다시 아비도스 사막이야? 부장?"
90000030-189 = "사막에서 수집했던 데이터는…… 해킹을 막으려고 컴퓨터를 파괴해버렸을 때 전부 소실됐잖아."
90000030-190 = "네. 하지만 그 정도는 복구할 수 있어요."
90000030-191 = "그것보다는…… 조금 더 신경쓰이는 게 있어요."
90000030-192 = "뭔데?"
90000030-193 = "바로 카이저 PMC예요."
90000030-194 = "확실히 그들은 아비도스의 사막에서 무언가 발굴하고 있었죠. 정체나 목적은 전혀 알려지지 않았지만……."
90000030-195 = "비나가 출몰하는 곳에서 그런 일을 벌이고 있다는 것 자체가 의심스러워요."
90000030-196 = "어쩌면 그들이 데카그라마톤과 관계가 있을 지도 모르고요. 그쪽을 한 번쯤은 체크해볼 필요는 있는 거죠."
90000030-197 = "흐음. 뭐, 듣고 보니 확실히 그럴 수도."
90000030-198 = "카이저 기업의 DB에 침투하겠다는 거잖아? 부장, 그래도 괜찮은 거야?"
90000030-199 = "저를 누구라고 생각하시는 거죠, 에이미?"
90000030-200 = "제가 바로 <베리타스>의 선대 부장이자, 밀레니엄 최고의 병약 미소녀 히마리예요. 이런 사기업의 DB 정도야 안 들키고 내 집 드나들 듯 들어갈 수 있어요."
90000030-201 = "……병약 미소녀는 관계 없지 않아?"
90000030-202 = "게다가 카이저 본사가 아닌 PMC의 기록이라면, 훨씬 보안이 취약할 테고……."
90000030-203 = "밑져야 본전이니 시도해볼 가치는 충분해요."
90000030-204 = "음…… 뭐. 부장이 그렇게 생각했다면야."
90000030-208 = "그럼 다시 출동이야. 목표는 카이저 PMC가 가지고 있는 정보를 탈취하는 것."
90000030-209 = "[s] \"좋아. 그럼 출발.\""
