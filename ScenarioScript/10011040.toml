[translation]
10011040-1 = "제4화;첫 번째 관문: 간판아가씨와 경호원"
10011040-8 = "하아하아……. 지, 진짜 저질러버렸다……!"
10011040-9 = "나, 납치! 해버렸슴다!"
10011040-10 = "저, 정말 괜찮은 거겠지? 이걸로!"
10011040-12 = "당황하지 마. 설마 잊은 건 아니겠지? 우리의 이번 목표를."
10011040-14 = "자, 잘 기억하고 있다고! 리더!"
10011040-15 = "<와라쿠 공주님>의 주역을 납치해서, 이번 교류회를 엉망으로 만든다!"
10011040-16 = "그걸로 음양부가 우리에게 굽신거리게 만든다 작전! 임다!"
10011040-17 = "지금까지 척척 진행된 걸 봐. 이 작전에 빈틈은 없다고."
10011040-18 = "누가 뭐라 해도 이번 작전은 키보토스 지식ON 사이트에서 범죄계의 마이스터라고 불리는, 바로 그 <히죽히죽 교수>에게 컨설팅을 받은 작전이니까."
10011040-19 = "히죽히죽 교수라면……."
10011040-20 = "크로노스 스쿨에서도 그 행적을 끊임없이 추적한다는! 유명한 사람 아님까?!"
10011040-21 = "맞아. 그만큼 이 작전은 완벽해."
10011040-22 = "우리는 그저 계획을 실행하면 그만. 그걸로 우리 제멋대로 망량즈가 얼마나 대단한지 백귀야행과 게헨나에게 보여주는 거지."
10011040-24 = "그나저나……. 정말로 그 유명한 치세 공주님을 납치하다니……."
10011040-25 = "성공했는데도 아직 가슴이 두근거림다……."
10011040-26 = "그럼 모처럼이니까, 치세 님의 얼굴을 한번 보고 진정하도록 할까……."
10011040-38 = "이부키 등장!"
10011040-39 = "응응! 이부키 흔들려도 꼬옥 참고 있었어!"
10011040-40 = "이제 이부키는 뭘 하면 돼?!"
10011040-47 = "\"\"\"……얜 또 뭐야?!\"\"\""
10011040-48 = "(잠깐?! 치세 공주가 아니라는 건…… 이 복장, 설마 게헨나의 만마전……?)"
10011040-49 = "치세 님을 가까이에서 뵙고 직접 사인받고 싶었는데!"
10011040-50 = "안타깝슴다!"
10011040-51 = "이게 안타까운 걸로 끝날 일이야?!"
10011040-53 = "우웅?"
10011040-59 = "거기! 너희들! 여기서 뭘 하는 거야?"
10011040-61 = "헉?! 벌써 꼬리를 잡혔나?!"
10011040-68 = "너희, 납치 역이지?! 지금 여기 있을 때가 아니잖아! 비행선의 방송 봤을 거 아냐? 이벤트는 이미 시작되어버렸다고!"
10011040-70 = "마, 마츠리부의 부장……?"
10011040-71 = "사전에 계획한 대로라면 너희가 도망치는 루트는 이쪽이니까 말이야!"
10011040-72 = "어?! 우리가 도망칠 수 있게 도와주는 검까?!"
10011040-73 = "그, 그러고 보면 들어본 적 있어!"
10011040-74 = "마츠리부의 부장은…… 돈을 위해서라면 어떤 일이든 마다하지 않는 비정한 녀석이라고!"
10011040-75 = "설마…… 이것도 그 히죽히죽 교수의 계획 중 하나임까?!"
10011040-77 = "그, 그런 것이었나……!"
10011040-78 = "응? 뭔가 당치도 않은 오해를 받는 느낌이……. 어디선가 인수인계가 잘못된 걸까?"
10011040-79 = "하여간 이럴 때가 아니야! 자, 이리로!"
10011040-80 = "엇, 어엇……?"
10011040-86 = "으음, 뭔가 공연 스태프가 아니라…… 망량즈와 비슷한 거 같아서 꺼림칙한데……"
10011040-87 = "아니, 그럴 리가 없지. 공연 도중이고 망량즈가 여기서 튀어나올 리가 없지. 응."
10011040-91 = "자, 이제 보자……. 이벤트 일정에 따르면, 이다음엔 분명……."
10011040-95 = "부장! 피나! 도착했습니다~!"
10011040-96 = "아, 마침 잘됐네! 좋았어! 우리도 준비하자! 피나!"
10011040-100 = "망량즈 녀석들은 이리로 도망쳤을 거야……!"
10011040-101 = "이즈나! 놓치지 않겠습니다!"
10011040-102 = "하아하아. 가, 갑니다아……!"
10011040-104 = "후후후!"
10011040-112 = "거기 잠깐!"
10011040-113 = "여기는 지나갈 수 없습니다!"
10011040-118 = "뭣……"
10011040-119 = "[s] \"시즈코랑…… 피나?\""
10011040-121 = "어라? 여러 도전자가 있겠거니 싶긴 했지만, 설마 거기에 선생님과…… 닌자 소녀가 있을 줄이야."
10011040-122 = "아잉~ 시즈코 깜짝 놀라버렸어요!"
10011040-123 = "피나도! 가슴이 아픕니다! 한때 함께 대마왕 냥텐마루를 쓰러트렸던 동료가 지금 와서는 적!"
10011040-124 = "협객의 길은! 너무 비정하고 슬픕니다!"
10011040-125 = "[s] \"그 이야기, 어디까지 공유된 거야?!\""
10011040-127 = "자, 잠깐! 백야당의 오너잖아! 왜 우리 앞을 막는 거야?! 설마……! 망량즈의 동료인 거야?!"
10011040-128 = "아, 그쪽은 분명 자칭 닌자들을 이끌고 다니는 괴짜 집단의 리더……였던가?"
10011040-129 = "윽……! 괴, 괴짜라니! 누가……!"
10011040-130 = "[s] \"괴짜라고 하면 백야당도 한가락 하지.\""
10011040-131 = "네?"
10011040-133 = "저, 드, 드, 들어본 적 있어요! 배, 백야당은 분명…… 매, 매니악한 서비스를 제공하고…… 그, 그에 대한 비, 비용을 청구하는 무서운 곳이라고……."
10011040-134 = "앗! 업계의 어둠이란 거군요! 과연! 이즈나는 속지 않을 거예요!"
10011040-135 = "오해할 소리 하지 마! 대체 어디서 그런 소리를 듣고 떠들어대는 거야! 다들!"
10011040-136 = "[s] \"확실히 백야당의 덜렁이 서비스는 꽤나 매니악하지…….\""
10011040-137 = "선생님까지 그러시는 건가요?!"
10011040-138 = "전 그냥 공연의 어트랙션 담당일 뿐이라고요!"
10011040-140 = "어트랙션……?"
10011040-141 = "아…… 공연용 시련이란 거야……?"
10011040-142 = "네에! 맞습니다!"
10011040-143 = "바로 이곳! <첫 번째 관문 어트랙션: 간판 아가씨와 경호원>의 수문장은 다름 아닌 저!"
10011040-144 = "백야당의 아이돌이자- 백야당의 오너! 카와와 시즈코와-!"
10011040-145 = "피나입니다! 두목!"
10011040-146 = "오늘 이렇게 저희가 첫 관문의 수문장 역할을 맡아 여러분의 앞길을 막은 건…… 후후후, 무엇을 숨기랴……!"
10011040-148 = "저 시즈코! 백야당의 간판 아가씨인 만큼! 들어서는 입구의 간판부터 막아서는 역할에 딱 알맞기 때문……!"
10011040-155 = "[ns] \"……아, 미안. 혹시 조크였어? 지금 웃을까?\""
10011040-157 = "우와아앙?!"
10011040-158 = "돼, 됐다구요! 그런 쓸데없는 배려! 오히려 슬퍼지니까!"
10011040-159 = "어쨌거나 대본은 둘째 치고 다시 시작이에요!"
10011040-160 = "납치된 공주님을 구하러 온 여러분을, 저 백야당의 간판 아가씨 시즈코와……!"
10011040-161 = "그 경호원, 피나가 상대하겠습니~~다앗!"
