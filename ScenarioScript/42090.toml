[translation]
42090-1 = "제9화;D.U.의 새로운 아침"
42090-2 = "(다음 날 아침, 코우사기 공원 앞.)"
42090-6 = "<시민 여러분께 알립니다. 금일 오전 00시부터 새로운 행정 명령이 시행됩니다.>"
42090-7 = "<시민 여러분께서는 총학생회 홈페이지 및 각 지역 행정 기관을 방문하시어 새로 고시된 행정 명령을 확인하시고, 치안 기관으로부터 검문 요청이 있을 시 적극적인 협조를 부탁드리겠습니다.>"
42090-8 = "<……행정 명령을 숙지하지 않거나 검문에 불응하여 생기는 불이익에 대해서 총학생회는 책임지지 않습니다.>"
42090-9 = "<다시 한번 시민 여러분께 알립니다. 금일 오전 00시부터 새로운 행정 명령이……>"
42090-10 = "……도대체 무슨 일이 일어나고 있는 거야?"
42090-11 = "모르겠어. 어젯밤부터 계속해서 같은 말을 방송으로 시끄럽게 떠들어대고 있던걸."
42090-12 = "총학생회 홈페이지를 확인해 보긴 했지만, 뭔가 어려운 조항만 잔뜩 적혀 있어서 뭐가 바뀌었는지도 잘 모르겠고……"
42090-13 = "……어제 총학생회에 갑자기 불려 간 선생님은 무사하실까?"
42090-15 = "생텀 타워에 특별한 변화는 없었으니, 아마 괜찮으실 거라고 생각합니다만……"
42090-16 = "문제는 현재 시내에서 벌어지고 있는 일들입니다."
42090-17 = "방송 내용도 수상쩍지만, 도로를 살펴보니 오전부터 계속해서 장갑차와 무장한 병력을 실은 차량이 시내로 향하던데."
42090-18 = "뭔가 지난번처럼 총격전을 동반한 쿠데타라도 벌어진 게 아닐까?"
42090-19 = "하지만 그런 것 치고는 총소리도 들리지 않고, 너무 지나치게 조용한걸."
42090-20 = "이곳 공원에서는 시내의 모습이 잘 보이질 않으니……"
42090-26 = "우선은 잠시 캠프를 벗어나 시내에서 무슨 일이 벌어지고 있는지 직접 확인해야 할 것 같습니다."
42090-27 = "전원, 정찰 장비와 탄약을 챙겨주세요. 준비가 끝나는 대로 시내로 향합니다."
42090-28 = "아무 일도 없었으면 좋겠는데……"
42090-32 = "저 녀석들, 카이저 코퍼레이션의 특수 부대원들이잖아?"
42090-33 = "어째서 기업이 고용한 병사들이 무장한 채 도시 한 가운데에……"
42090-35 = "시민 여러분께 알립니다. 금일 부로 신규 행정명령에 따라 이곳 코우사기 타운을 비롯한 47개 행정 구역의 치안 관리 업무는 저희 카이저 시큐리티로 이관되었습니다."
42090-36 = "이는 총학생회장 대행의 허가를 받은 내용이며 저희 카이저 시큐리티는 새로운 행정명령에 따라 공정히 치안 관리 업무를 수행할 것입니다."
42090-37 = "이를 위해 시민 여러분의 성실한 협조를 부탁드리며—"
42090-39 = "우와… 지각이야, 지각……"
42090-43 = "오늘따라 왜 이렇게 신호가 바뀌는 게 느린 거지?"
42090-44 = "이대로 신호를 기다리다가는 지각하겠어……"
42090-45 = "지나가는 차량도 없으니 이참에 슬쩍—"
42090-47 = "거기, 멈춰!"
42090-48 = "네, 네……? 저 말인가요……?"
42090-49 = "그래, 너 말이야."
42090-50 = "어째서 빨간 불에 횡단보도를 건너려 한 거지?"
42090-51 = "그게, 약속에 늦을 것 같아서 서두르다니 보니 저도 모르게……"
42090-52 = "죄송해요. 이번 한 번만 봐주시면 안 될까요……?"
42090-53 = "안 돼. 규칙은 모두에게 공평하게 적용되어야 한다!"
42090-54 = "총학생회의 규정을 무시하고 교통체계를 교란하려 한 대가로……"
42090-56 = "10만 엔의 과징금을 추징한다!"
42090-58 = "네? 겨우 횡단보도 무단횡단으로 벌금이 10만 엔이나 나온다고요?"
42090-59 = "무, 물론 무단횡단이 잘한 일은 아니지만, 이건 너무한 일—"
42090-60 = "……지금 새 총학생회장 대행의 결정에 반기를 들고 나선 건가?"
42090-61 = "안 되겠군. 네 녀석을 내란 조장 혐의로 긴급 체포한다!"
42090-62 = "말도 안 돼~"
42090-64 = "그러니까 이 버튼이…… 뭐였더라……?"
42090-65 = "응? 이 ATM 기기 앞은 왜 이렇게 혼잡한 거지?"
42090-66 = "거기 너, 기기 앞에서 무얼 꾸물거리고 있는 거지?"
42090-67 = "자, 잠깐만 기다려 주십시오. 나이가 드니 기계 장치에는 익숙하지가 않아서……"
42090-68 = "단순히 돈을 찾는 데에도 시간이 오래 걸리게 되는걸요."
42090-69 = "예외는 없어! 모두가 이용해야 할 공공시설을 독점할 생각이냐?"
42090-71 = "시간이 지났으면 썩 비켜! 뒤에서 차례를 기다리는 다른 시민들이 보이질 않는 거냐!"
42090-72 = "으으…… 어째서 이런 가혹한 일을……"
42090-77 = "이봐. 지금 손에 들고 있는 게 뭐지?"
42090-78 = "……네? 이건 그냥 평범한 수류탄인걸요?"
42090-79 = "뭐? 수류탄?"
42090-80 = "핀을 뽑아 던지는 것만으로도 많은 사람에게 상해를 끼칠 수 있는 위험한 화기를 아무렇지도 않게 시내에서 휴대하고 다니다니……"
42090-81 = "테러라도 일으킬 작정인가!"
42090-82 = "자, 잠시만요. 수류탄을 휴대하고 다니는 게 금지되었다는 이야기는 듣지 못했다고요!"
42090-83 = "키보토스에서는 수류탄 정도야 평범한 물건 아닌가요?!"
42090-84 = "D.U. 관할구역 내에서 100g 이상의 고폭약이 포함된 화기를 허가 없이 소지하고 다니는 건 금일 오전 00시부터 새로운 행정명령에 의해 금지되었다!"
42090-86 = "네 녀석을 테러 모의 혐의로 체포하겠다!"
42090-87 = "말도 안 돼. 이건 부당하다고……!"
42090-89 = "우와…… 곳곳에서 병사들이 시민들을 마구잡이로 체포하고 있네."
42090-90 = "그보다 시내에서 수류탄을 휴대하면 안 된다는 규정은 또 뭔데? 키보토스에 그런 법이 있다는 말은 한 번도 못 들어봤다고!"
42090-91 = "어제 고시된 행정명령에 추가된 내용이야. 그 밖에도 치안이나 통제와 관련된 내용이 빡빡하게 추가되었는 걸……"
42090-92 = "그보다 어째서 치안 관리 업무를 발키리가 아니라 카이저 코퍼레이션에서 담당하고 있는 거야?"
42090-93 = "저 녀석들은 지난 쿠데타의 실패로 다 감옥에 갔어야 했던 게 아니야?"
42090-95 = "게다가 범죄를 예방하기 위해서라고 해도, 마구잡이로 시민들을 연행하고 검문하며 불안감을 조성하는 건 올바른 치안 기관의 자세가 아닐 텐데요."
42090-96 = "그래도 뭐랄까…… 오늘따라 시내가 잘 정돈된 느낌이 들어."
42090-97 = "그러게. 평소의 키보토스였더라면 이 시점에서 기분이 내키지 않는다며 총을 쏘거나 폭탄을 던지는 바보가 한둘쯤은 있었을 테니까."
42090-99 = "곳곳에 치안 관리 병력이 눈을 부릅뜨고 있는데 총을 꺼낼 정도의 머저리는 없었나 보지."
42090-100 = "(……뭔가 이상한 기분이 들어.)"
42090-101 = "(모두가 규칙을 준수하고, 법에 의해 정의가 구현되는 사회인데도…… 조금도 안심이 되지 않아.)"
42090-102 = "(내가 꿈꾸던 정의가…… 과연 이런 모습이었을까……?)"
42090-104 = "어이, 거기 너. 뭐 하는 녀석이지?"
42090-106 = "이런, 이런…… 저희를 처음 보십니까?"
42090-107 = "청빈한 삶을 추구하는 자라면 누구나 알고 있을 텐데, 여러분은 청빈과는 거리가 먼 삶을 살아오셨나 보군요."
42090-111 = "제 이름은 데카르트. 청빈을 위한 구도의 모임— <소유하지 않고도 확실한 행복을 찾는 모임>, 줄여 <소확행>을 이끌고 있는 리더입니다!"
42090-112 = "소확행……?"
42090-113 = "네. 저희는 일하지 않고, 소유하지 않고, 버려진 건물 아래에서 무소유의 삶을 이어 나가는 수도자들입니다."
42090-114 = "어떠십니까. 여러분도 청빈의 삶에 관심이 있으시다면 부디—"
42090-115 = "브라보 1. 이 녀석 끌고 가."
42090-119 = "자, 자, 잠시만요?! 저희는 아무것도 저지르지 않았다고요?"
42090-120 = "끌려갈 때 끌려가더라도 어째서 끌려가는지는 알아야 할 거 아닙니까!"
42090-121 = "……아무것도 하지 않았기 때문이다."
42090-122 = "너희는 이 사회에 기생하면서 일하지 않고 자원만 축내는 암적인 존재들이다."
42090-123 = "건강한 사회의 존속을 위해서라면 너희와 같은 사회의 기생충을 교화시켜야 할 필요가 있겠지."
42090-124 = "너희들은 곧바로 카이저 코퍼레이션의 취업 시설로 보내져 노동을 하며, 사회에 이바지하는 일꾼으로 거듭나게 될 것이다!"
42090-125 = "안 돼……"
42090-127 = "이대로 취업할 수는 없어!"
42090-128 = "잠시만 기다려 주세요."
42090-132 = "아무리 치안 업무를 대행하고 있다고는 하지만 영장도 없이 시민을 연행할 수는 없습니다."
42090-133 = "이 이상으로 권한을 남용한다면 SRT 특수학원의 대원으로서 당신들을—"
42090-134 = "이는 총학생회장 대행의 '명령'이다. 너희는 이 명령에 불복할 셈이냐?"
42090-135 = "명령, 이라고 해도……"
42090-137 = "무기는 스스로 판단하지 않아야 그 가치가 있는 법이니까."
42090-139 = "……."
42090-140 = "그보다 너희들은 어느 학원 출신이지? 처음 보는 교복인데."
42090-141 = "S, SRT 특수학원인데요……"
42090-142 = "……SRT 특수학원? 학원 명단에서 그런 이름은 못 본 것 같은데."
42090-143 = "뭐 인마? 지금 시비 거는 거야?"
42090-144 = "괜찮아, 모를 수도 있지. 지금부터 직접 그 몸에 가르쳐 주면 되니까. 후후……"
42090-145 = "게다가 신규 행정 명령에 위배되는 화기도 잔뜩 보유 중인 것처럼 보이고……"
42090-150 = "네 녀석들도 체포하겠다! 무기를 버리고 똑바로 손 들어!"
42090-154 = "……RABBIT 1. 대응은?"
42090-155 = "……허가합니다. 제가 신호하면 즉시—"
42090-157 = "……괜찮다. 그냥 보내주도록."
42090-159 = "오랜만이군, RABBIT 소대."
42090-160 = "당신은 그때의……?"
42090-161 = "샬레 탈환 작전 때 우리 눈앞에서 건물을 폭파하려 했던 그 지휘관이잖아?"
42090-162 = "기억하고 있었나? 내 결정이 SRT 특수학원의 엘리트들에게도 기억될 만큼 인상적이었다니, 이거 영광이군."
42090-163 = "아니, 오히려 그 정반대거든?"
42090-164 = "패배를 받아들이지 못하고 억지를 부리는 모습이 어찌나 우스꽝스러웠는지, 다른 의미로 기억에 남았을 정도니까."
42090-165 = "후후…… 그랬을지도 모르지."
42090-166 = "확실히 그때는 너희들을 지나치게 과소평가하고 있었다."
42090-167 = "하지만 이제는 다르다. 나는 실패에서 교훈을 얻지 못하는 머저리와는 다르니까."
42090-169 = "……어째서 저희를 그냥 보내주시는 거죠?"
42090-170 = "그야 명령이 있었거든."
42090-171 = "SRT 특수학원의 학생들과 적대하지 말라고 총학생회장 대행이 직접 지시했다."
42090-172 = "카야 방위실장이……?"
42090-173 = "그래. 듣자 하니 곧 SRT 학원을 부활시키고 자신의 지휘 아래에 두겠다고 호언하던데."
42090-174 = "그렇게 된다면 같은 편에서 싸우게 될 텐데, 미래의 아군을 적대해서 좋을 건 없으니까."
42090-175 = "SRT 학원의 부활……"
42090-177 = "어쩐지 안색이 나쁘군. 유산균은 제대로 섭취하고 있나?"
42090-178 = "보급이 부족하다면 우리 카이저 코퍼레이션이 직접 지원해 주지. 탄약이든 보급품이든 우리에게는 충분하니까. 그것도 카이저 익스프레스로 공원 앞까지 바로 말이야."
42090-180 = "물론 조례에 위배되는 무기가 필요하다면 노골적으로 전달해 줄 수는 없지만……"
42090-182 = "필요하다면 나중에 사람들의 눈을 피해 몰래 가져다주지."
42090-183 = "……구미 당기는 제안이긴 하지만 이렇게 노골적으로 나오니 오히려 수상한걸."
42090-184 = "어째서 이렇게 친절하게 구는 거지?"
42090-185 = "분명 저희 때문에 총학생회를 장악하려던 계획도 실패하고, 큰 손해를 입었을 텐데……"
42090-186 = "당신은 저희에게 원한이 있는 게 아니었나요?"
42090-188 = "후후, 당연한 걸 묻는군."
42090-193 = "……SRT. 나는 너희들이 혐오스럽다."
42090-194 = "다른 사람들은 평생을 노력해도 얻지 못할 강한 힘을 가졌으면서, 너희들은 그 힘을 정의나 신념과 같은 같잖은 것들을 위해 낭비하고 있어."
42090-195 = "그 알량한 정의 놀음 때문에 나는 반생 동안 쌓아온 모든 것을 잃을 뻔했다."
42090-196 = "마음 같아서는 너희 모두를 강제로 땅바닥에 이마를 조아리게 한 채, 구둣발로 머리를 짓밟는다 해도 속이 시원찮을 정도야……"
42090-197 = "히, 히이익……"
42090-198 = "하지만 혐오스러운 상대와도 웃으며 악수를 할 수 있는 것이 사회인이니까."
42090-199 = "개인의 원한 때문에 사람을 골라서는 대업을 이룰 수 없는 법이지."
42090-200 = "그런 점에서 카야 총학생회장 대행은 정말 훌륭한 모범생이야. 자신의 뒤통수에 대고 총을 쏜 배신자라 하더라도, 자신의 대업에 도움이 된다면 거리낌 없이 손을 내미는 사람이니까."
42090-201 = "서로의 쓸모를 이해하고 있는 사람들의 협력은 그 어떤 유대보다도 끈끈하거든."
42090-202 = "전우애니 우정이니 하는 것은 능력이 없는 자들을 위로하기 위한 사탕발림일 뿐이야."
42090-203 = "……당신에게는 신념도 없나요?"
42090-204 = "신념? 내게도 신념은 있지. 하지만 그게 임무를 수행하는 것과 무슨 상관이 있지?"
42090-205 = "명령을 받으면 수행한다. 그것이 설령 내 신념과는 다르더라도."
42090-206 = "그것이 제대로 된 사회인이고 제대로 된 특수부대다."
42090-207 = "그에 비해 너희는 어떻지? 내가 보기에는 힘만 세지 생각하는 건 젖내나는 어린아이와 다를 바가 없군."
42090-208 = "눈앞의 불의에는 불같이 분노해도, 닿을 수 없는 부조리 앞에서는 눈을 감아버리는 겁쟁이야."
42090-209 = "그러니까 너희는 '전투'에서는 이겨도, '전쟁'에서는 이기지 못하는 거다."
42090-214 = "………."
42090-215 = "돌아갑시다, 모두."
42090-216 = "이만하면 현장의 정보는 충분히 수집했습니다."
42090-220 = "돌아가는 길에 보급품이라도 조금 가져가겠나?"
42090-221 = "아니요, 괜찮습니다."
42090-222 = "무엇을 원하는지도 모르는 상대에게 빚을 질 만큼 어리석지는 않습니다."
42090-223 = "오, 다행이군. 그나마 소대장은 조금이나마 머리가 돌아가는 친구라서."
42090-224 = "그럼 다음에 보자고."
42090-229 = "쳇, 재수가 없으려니…… 별 시답잖은 녀석에게 설교를 들었네."
42090-230 = "……이상하네."
42090-231 = "응? 뭐가 이상한데? 내 얼굴에 뭐라도 묻었어?"
42090-232 = "아니, 아까 전에 그 지휘관이 우리를 도발했을 때 말이야."
42090-233 = "분명 성질 나쁜 사키라면 중간에 욱해서 뛰쳐나갈 거라고 생각했거든."
42090-234 = "그런데 끝까지 도발을 참아내다니, 사키도 많이 성장했네~ 싶어서. 쿠후후……"
42090-235 = "성장하긴 뭘 성장했다는 거야? 아무리 나라도 수십이 넘는 병사들이 총을 겨누고 있는데 달려들 정도로 눈치가 없지는 않거든?"
42090-236 = "……게다가 마지막 말은 틀린 소리도 아니었어."
42090-237 = "아무리 우리가 전투에서 상대를 압도한다 하더라도, 높으신 분들이 판을 엎어버린다면 전쟁에서 이길 방법이 없으니까."
42090-238 = "뭐, 어차피 우리는 명령에 따라 작전을 수행하는 SRT 대원일 뿐이니까."
42090-239 = "감정을 우선시하면 전투에 집중하기 어려워지는 것도 사실이고……"
42090-241 = "………"
42090-242 = "그래서 미야코. 앞으로는 어떻게 할 거야?"
42090-243 = "네, 네? 무슨 계획 말인가요……?"
42090-244 = "어제의 일 말이야. FOX 소대의 선배들이 RABBIT 소대를 해체하고 돌아오라고 했잖아."
42090-245 = "RABBIT 소대를 해체하는 건 내키지 않지만, SRT 특수학원이 부활한다면 여기에 남아서 시위를 계속하는 것도 이상하고……"
42090-246 = "어쩌면 선배들의 말을 듣는 게 가장 좋은 선택일지도 모르겠다 싶어서."
42090-248 = "나도 이 공원에 계속 남아있어야 할 필요가 있을지 잘 모르겠어."
42090-249 = "보급도 날이 갈수록 쉽지 않고, 겨울이 오면 물도 구하기 어려울 테고……"
42090-250 = "나는…… 아무래도 상관없지만……"
42090-255 = "………그렇네요."
42090-260 = "(카야 실장이 SRT 학원의 부활을 보장해 준 이상, 이 공원에서 농성을 계속할 명분은 없어……)"
42090-261 = "(……선배들의 아래로 들어간다면 규율 잡힌 생활도, 강력한 화기도, 안락한 생활 공간도 모두 만족할 수 있겠지.)"
42090-262 = "(단 한 가지 마음에 걸리는 건, 입학할 때부터 품고 있었던 흐릿한 꿈과 신념뿐…….)"
42090-263 = "(고생하는 소대원들을 위해서라면……)"
42090-266 = "……잠시, 모두 귀를 모아주세요."
42090-267 = "최종 결정에 앞서, 먼저 여러분의 의견을 듣고 싶습니다."
42090-269 = "다음화;통제 불능"
