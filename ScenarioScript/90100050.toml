[translation]
90100050-1 = "제5화;에이스의 행방"
90100050-3 = "현재 시각은, 키보토스 표준시로 1030시."
90100050-4 = "현 시간부로 FOX 소대는 <로어 추적 작전>의 탐문을 시작한다."
90100050-5 = "각 소대원, 보고."
90100050-9 = "여기는 FOX 4. 현재 포인트 오스카에서 타겟의 동향을 관찰 중."
90100050-10 = "현재까지 타겟을 포함하여 이상 동향은 관측되지 않음. 다만……"
90100050-11 = "포인트 오스카에 아주 사소하고 앙증맞은 문제가 하나 있지만 말이야."
90100050-12 = "사소한 문제?"
90100050-13 = "더워…… 가만히 있는데도 더워……"
90100050-14 = "직사광선이 내리쬐는 곳에서 위장포를 뒤집어쓰고 가만히 앉아 있으려니 온 몸이 녹아내리는 것 같아~ 여름은 아직 한참 더 있어야 오는 거 아니었어?!"
90100050-15 = "올해는 평년보다 조금 일찍 더위가 찾아 온 모양이더군."
90100050-16 = "미안하지만 다음 번에는 조금 그늘진 포인트를 찾아줄 테니, 이번만큼은—"
90100050-20 = "우는 소리 내지마, FOX 4. 예전에는 이것보다 더 더운 곳에서도 잘 참았었잖아?"
90100050-21 = "교정국에 너무 오래 들어가 있었더니 몸이 약해진 거 아냐?"
90100050-22 = "작전 채널로 잔소리하지 마, FOX 3. 아무리 몸을 단련한다 하더라도 더운 건 더운 거니까."
90100050-23 = "나도 누구처럼 속옷 대신 캐미솔만 입는다면 덜 덥겠지만—"
90100050-24 = "제대로 입고 있거든!"
90100050-28 = "……FOX 3, 이어서 보고를."
90100050-29 = "여, 여기는 FOX 3. 그러니까 캐미솔이 아니라 제대로 된……"
90100050-30 = "FOX 3. FOX 4의 농담에 너무 진지하게 반응할 필요는 없어."
90100050-31 = "그, 그렇지. 으으……"
90100050-35 = "여기는 FOX 3. 포인트 파파에서[ruby=단말기 고유 식별 번호] IMSI 수집 [/ruby]장비를 가동 중."
90100050-36 = "현재 수집된 단말 식별자 수와 포인트 오스카 측 타겟 숫자를 대조한 결과, 500m 반경 내에 비식별 단말은 없는 것으로 보여."
90100050-37 = "감시 구역 내 이상 징후나 식별 변동 발생 시 추가 보고할게."
90100050-38 = "FOX 1, 확인."
90100050-42 = "마지막으로 FOX 2는……"
90100050-48 = "응. 이쪽도 준비는 모두 끝났어."
90100050-49 = "물자도 충분하고, 위장도 완벽히 갖추었으니까……"
90100050-50 = "타겟이 접근하면 절차에 따라 정보 수집을 시작할게."
90100050-51 = "좋아. 그럼 지금부터—"
90100050-52 = "[ns1] \"뭔가 엄청난 이야기가 오가는 것 같네……\"\n[ns2] \"지금부터 무얼 하려는 거야?\""
90100050-55 = "아…… [USERNAME] 선생님."
90100050-56 = "작전이 끝난 뒤 선생님이 계신 자리에서 사후 강평을 할 예정이니, 직접 따라오실 필요는 없다고 말씀드렸습니다만."
90100050-57 = "뭔가, 불안한 점이라도 있으셨는지요?"
90100050-58 = "[s3] \"FOX 소대와 샬레의 첫 합동 작전이니까!\"\n[s4] \"유키노가 일하는 모습을 직접 지켜보고 싶었거든.\""
90100050-61 = "……그렇습니까."
90100050-62 = "그럼 지금까지 수집한 정보와 앞으로 진행할 작전에 대해 짧게 브리핑하겠습니다."
90100050-63 = "이번 캥캥…… 아니, <로어 추적 작전>의 첫 번째 목표는 이곳, 시로우나기 역 근처에서 연쇄적으로 발생하고 있는 사건의 진상을 파악하는 것입니다."
90100050-64 = "[s] \"사건의 진상……?\""
90100050-65 = "예. 지난 달— 총학생회장이 돌아온 지 얼마되지 않은 때부터, 이 일대에서 정신을 잃은 채 발견되는 학생들이 급격히 늘어났습니다."
90100050-67 = "피해자들은 대부분 기온이 높은 정오에 발견되었으며, 찰과상 이외의 외상은 없었습니다. 때문에 처음에는 더위로 인한 온열질환을 의심했지만……"
90100050-68 = "환자의 맥박과 체온은 정상이었고, 뇌전증 환자처럼 경련을 일으키는 경우가 많았기에 온열질환은 아닌 것으로 판단되었습니다."
90100050-69 = "무엇보다 사고가 일어나기 전, 피해자들이 하얀 허수아비를 쫓았다는 공통된 증언이 있었기에…… 발키리 경찰학교에서는 그 하얀 허수아비의 정체를 파악하고 있습니다."
90100050-71 = "하지만 피해자를 제외하면 하얀 허수아비를 직접 목격했다는 사람이 없기에 수사에 난항을 겪고 있는 모양이에요."
90100050-72 = "이런 상황에서 피해가 확산되니, 귀신의 저주라든가. 악령의 소행이라든가 하는 소문도 퍼지는 모양이고……"
90100050-73 = "세상에 귀신이 어디 있어? 그냥 저 좋을 대로 떠드는 것뿐이지."
90100050-74 = "그렇게 무책임하게 소문을 퍼트리니까, 정작 사건의 본질이 흐려지는 거라고."
90100050-75 = "그 말은 동감이지만…… 지금으로서는 판단할 근거가 너무 부족하군."
90100050-76 = "천천히 사건을 복기하며 증거를 모으는 수밖에."
90100050-77 = "[s] \"그래서 지금은 무얼 하려는 거야?\""
90100050-78 = "우선은 피해자의 주변인들을 대상으로 탐문을 하려고요."
90100050-79 = "대놓고 취조를 하는 기색을 보이면 말을 숨기려 할 테니, 아르바이트 학생으로 위장해서 화제를 꺼내는 거죠."
90100050-80 = "[s] \"이번에도 유부초밥을 팔려고?\""
90100050-81 = "하하…… 이런 날씨에는 잘 팔리지 않을 테니 메뉴는 바꾸었지만요."
90100050-82 = "가장 최근에 발생했던 사건의 피해자는 게헨나 육상부의 선수였던 모양인데……"
90100050-83 = "게헨나 육상부는 인적이 드문 이곳 산책로에서 종종 훈련을 하는 모양이에요."
90100050-84 = "SNS를 확인해 보니 오늘도 훈련이 예정되어 있는 모양이더군."
90100050-85 = "다른 사람들이라면 몰라도 같은 육상부의 부원들이라면, 피해자가 정신을 잃기 전에 무슨 일이 벌어졌는지 알고 있지 않을까요?"
90100050-86 = "[s] \"과연…….\""
90100050-87 = "여기는 FOX 4. 즐거운 대화 중에 끼어들어서 미안한데……"
90100050-88 = "타겟— 게헨나 육상부원들이 해당 포인트에 접근하는 중이야."
90100050-92 = "그럼 FOX 2, 부탁한다."
90100050-93 = "맡겨줘~"
90100050-100 = "하나, 둘! 하나, 둘! 하나, 둘!"
90100050-101 = "다들 호흡 흐트러지지 않게! 구호에 맞춰서!"
90100050-105 = "실례합니다~"
90100050-106 = "응? 뭐야, 달리는 데 방해되니까 앞으로 나서지 마."
90100050-107 = "훈련 도중에 실례합니다만…… 이번에 새롭게 출시한 스포츠 드링크 <하이퍼 에이드> 한 잔, 어떠신가요?"
90100050-108 = "갑자기 스포츠 드링크……? 뭐야, 강매냐?!"
90100050-109 = "그럴리가요! 게헨나 육상부 여러분께 무료로 제공해 드리는 것이니 부담 없이 마셔주세요."
90100050-110 = "뭔가 수상한데……"
90100050-111 = "사실 이 <하이퍼 에이드>는 여러분도 한 번쯤은 들어 보셨을 유명 브랜드, 코즈카 제약에서 새롭게 출시한 제품인데요. 홍보가 잘 되지 않아서 그런지 아직 많이 모르시더라고요."
90100050-112 = "그래서 여기저기 광고도 붙이고, 판촉 행사도 진행중이지만…… 세상에 입소문만큼 빠른 게 없다잖아요?"
90100050-113 = "그래서 스포츠 드링크의 수요가 가장 많은 육상부 학생들을 상대로 시음을 부탁드리면 좀 더 입소문이 잘 퍼질 것 같아서요."
90100050-114 = "육상부 여러분이라면 아시겠지만, 격렬한 운동 뒤에는 땀과 함께 전해질이 빠져나가기 때문에 흡수가 빠른 스포츠 드링크를 섭취하는 것이 중요한데요. 이 <하이퍼 에이드>는 타 사의 스포츠 드링크보다 높은 농도의 전해질을 함유하고 있어—"
90100050-115 = "아, 알았어. 알았어. 네가 진심이라는 건 충분히 이해했으니까, 한 번 마셔볼게."
90100050-116 = "안 그래도 목이 타던 참이었는데 잘 됐네."
90100050-121 = "……날씨가 더워서 그런가? 평소보다 더 빠르게 갈증이 해소되는 느낌이야."
90100050-122 = "마시자마자 수분이 바로 몸에 스며드는 느낌이야……"
90100050-123 = "그렇죠? 어떤 환경에서나 필요한 전해질을 확실하게 흡수시키는 게 이 <하이퍼 에이드>의 장점이니까요!"
90100050-124 = "양은 충분하니 또 드시고 싶으신 분이 계시면 말씀해 주세요!"
90100050-125 = "그렇게 효과가 좋단 말이야? 그럼 나도……"
90100050-126 = "나도, 나도 마실래!"
90100050-130 = "저 <하이퍼 에이드>라는 거, 정체가 뭐야? 나도 처음 듣는 음료인데……"
90100050-131 = "SRT에서 배급되는 분말음료를 정량보다 1.5배 진하게 탄 거야. 너도 먹어본 적 있을걸."
90100050-132 = "응? 그 싸구려 레모네이드 말이야? 그걸 저렇게나 좋아한다고?"
90100050-133 = "쟤는 SRT가 아니라 영업 사원을 했어도 성공했을 거야."
90100050-134 = "(화제를 이끌어내는 데에는 성공했나……)"
90100050-136 = "……덕분에 잘 마셨어. 고마워서 이를 어쩌지?"
90100050-137 = "아니에요. 여러분이 맛있게 드시고 입소문만 내주신다면야 오히려 저희가 더 감사하죠."
90100050-138 = "그건 걱정 마. 소문이 확실하게 날 때까지 주변에 추천하고 다닐 테니까!"
90100050-143 = "……그나저나 소문이라고 하니 떠올랐는데."
90100050-144 = "얼마 전 이 근처에서 정신을 잃고 발견된 한 육상부원의 이야기, 들으신 적 있으신가요?"
90100050-148 = "응? 타마 쨩 이야기 하는 거야? 그건 왜—"
90100050-149 = "……그 사건에 대해서는 왜 묻는 거지?"
90100050-150 = "아, 특별한 이유가 있는 건 아니었어요."
90100050-151 = "그저 최근 이 근처에서 비슷한 사고가 자주 일어나는 것 같으니 조심하면 좋겠다 싶어서."
90100050-152 = "………."
90100050-153 = "그 사건에 대해서라면 우리는 할 말 없어."
90100050-154 = "어차피 다들 일사병 때문에 생긴 일이라고 말하고 있잖아?"
90100050-155 = "다들 알지도 못하면서……"
90100050-156 = "저, 저기 혹시—"
90100050-160 = "음료수, 잘 마셨어."
90100050-167 = "이런, 실패인가……"
90100050-168 = "뭔가 의도치 않게 역린을 건드린 모양이네."
90100050-169 = "여기는 FOX 2…… 미안, 실패한 것 같아."
90100050-170 = "괜찮아. 처음부터 호의적으로 나올 거라고 기대하진 않았으니—"
90100050-174 = "잠깐, FOX 2. 다른 사람이 그 쪽으로 접근중이다."
90100050-181 = "저기…… 이 음료수, 아직도 나눠주는 거야?"
90100050-182 = "무, 물론이에요. 한 잔 드시겠어요?"
90100050-187 = "고마워. 처음 듣는 브랜드라 호기심이 동하던 참이었거든."
90100050-191 = "흐음…… 뭔가 처음 먹어보는 독특한 풍미네. 나중에 키라라에게도 알려줘야지."
90100050-192 = "그나저나 이 근처에서는 못 보던 얼굴인데. 다른 학교에서 왔어?"
90100050-193 = "아…… 네, 네! 여기서 조금 떨어진 학원을 다니고 있거든요. 그, 사립 히아신스 학원의……"
90100050-194 = "사립 히아신스 학원? 어디선가 들어본 것 같은데."
90100050-195 = "여하튼, 아까 육상부 학생들이 한 말에 대해서는 너무 신경 쓰지 마. 안 그래도 '그 사건' 때문에 다들 날이 잔뜩 서 있는 상태거든."
90100050-196 = "그 사건이라면……"
90100050-197 = "응. 게헨나 육상부 학생이 갑자기 의식불명으로 발견된 사건 말이야."
90100050-198 = "너도 그 사건에 관심이 있는 거지?"
90100050-199 = "아뇨, 저는 사실 그렇게 관심이 있는 건 아니었는데—"
90100050-200 = "에이, 얼굴에 다 쓰여 있는걸. 풍문이 신경 쓰여서 견딜 수가 없다고."
90100050-201 = "너도 어지간히 수다 떠는 걸 좋아하는 모양이네."
90100050-206 = "아하하…… 그렇게 티가 났나요?"
90100050-208 = "사실, 게헨나 육상부는 곧 있을 인터하이에 출전할 주전 선발 시험을 앞두고 있었거든. 이번에 쓰러진 그 학생도 유력한 주전 후보였고."
90100050-209 = "그래서인지 그 학생은 휴일에도 홀로 달리기 연습을 할 정도로 의욕적으로 주전 경쟁에 임했었나 봐."
90100050-210 = "그 때문에 다들 쓰러진 모습을 보았을 때, 무리하다 일사병에 걸린 줄 알았지만……"
90100050-212 = "……일사병이 아니었던 거군요."
90100050-213 = "응. 이미 SNS에서 널리 알려진 사실이지만, 그 육상부 학생의 몸에는 아무런 이상이 없었대. 응급의학부에서도 확인해 준 내용이니 헛소문은 아닐 거야."
90100050-214 = "다만 아무 이유도 없이 유력한 주전 후보가 쓰러졌으니, 일각에서는 다른 부원들이 그 아이를 시기해서 저주하거나 해코지를 했다는 소문도 돌고 있어서."
90100050-215 = "아아…… 그래서 그런 반응을."
