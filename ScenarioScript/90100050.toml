[translation]
90100050-1 = "ตอนที่ 5;ร่องรอยของเอซ"
90100050-2 = ""
90100050-3 = "ปัจจุบันเวลา 10:30 น. ตามเวลาคิโวทอส"
90100050-4 = "จากนี้ไปกองทหาร FOX จะเริ่มสืบสวนใน <ปฏิบัติการแกะรอยตำนาน>"
90100050-5 = "สมาชิกแต่ละคน รายงานด้วย"
90100050-6 = ""
90100050-8 = ""
90100050-9 = "FOX 4 รายงาน ตอนนี้กำลังเฝ้าสังเกตความเคลื่อนไหวของเป้าหมายจากจุดออสการ์"
90100050-10 = "จนถึงตอนนี้ยังไม่ตรวจพบความเคลื่อนไหวผิดปกติ ทั้งจากตัวเป้าหมายและบริเวณโดยรอบ แต่ว่า..."
90100050-11 = "ที่จุดออสการ์มีปัญหาหยุมหยิมอยู่อย่างหนึ่ง"
90100050-12 = "ปัญหาหยุมหยิม?"
90100050-13 = "ก็มันร้อนน่ะสิ... แค่อยู่เฉยๆ ยังร้อนเลย"
90100050-14 = "พอต้องมานั่งนิ่งๆ คลุมผ้าพรางตัวอยู่กลางแดดเปรี้ยงแบบนี้ ก็รู้สึกเหมือนตัวจะละลายเลย~ นี่ยังไม่ถึงฤดูร้อนด้วยซ้ำไม่ใช่เหรอ?!"
90100050-15 = "ดูเหมือนว่าปีนี้อากาศร้อนจะมาเร็วกว่าปกตินิดหน่อย"
90100050-16 = "ขอโทษด้วยนะ ไว้ครั้งหน้าฉันจะหาจุดร่มๆ ให้นั่ง ครั้งนี้ขอให้อดทนไว้ก่อน..."
90100050-17 = ""
90100050-19 = ""
90100050-20 = "อย่าคร่ำครวญไปเลยน่า FOX 4 แต่ก่อนก็เคยทนอยู่ในที่ที่ร้อนกว่านี้ได้ไม่ใช่เหรอ?"
90100050-21 = "ไปอยู่ในสำนักควบคุมมานานเกินไป ร่างกายก็เลยอ่อนแอลงหรือเปล่า?"
90100050-22 = "นี่คือช่องสื่อสารสำหรับปฏิบัติการนะ หยุดบ่นได้แล้ว FOX 3 ต่อให้ฝึกฝนร่างกายมาขนาดไหน แต่ถ้าร้อนมันก็คือร้อนอยู่ดีแหละน่า"
90100050-23 = "ถ้าฉันใส่แค่เสื้อสายเดี่ยวแทนชุดชั้นในเหมือนใครบางคน ก็คงจะร้อนน้อยกว่านี้อยู่หรอก..."
90100050-24 = "ฉันใส่ชุดชั้นในเรียบร้อยเหอะนะ!"
90100050-25 = ""
90100050-27 = ""
90100050-28 = "FOX 3 รายงานเป็นคนต่อไป..."
90100050-29 = "F... FOX 3 รายงาน ฉันไม่ได้ใส่แค่เสื้อสายเดี่ยวตัวเดียว แต่ใส่..."
90100050-30 = "FOX 3 ไม่ต้องจริงจังกับมุกตลกของ FOX 4 ให้มากเกินไปหรอก"
90100050-31 = "นะ... นั่นสิเนอะ อึก..."
90100050-32 = ""
90100050-34 = ""
90100050-35 = "FOX 3 รายงาน ขณะนี้กำลังใช้งานอุปกรณ์[ruby=International Mobile Subscriber Identity]รวบรวม IMSI[/ruby] อยู่ที่จุดปาปา"
90100050-36 = "จากการเปรียบเทียบจำนวนตัวระบุอุปกรณ์ที่รวบรวมได้กับจำนวนเป้าหมายที่จุดออสการ์ ยืนยันว่าไม่พบอุปกรณ์ที่ไม่สามารถระบุตัวตนได้ภายในรัศมี 500 เมตร"
90100050-37 = "ถ้ามีเค้าลางความผิดปกติหรือมีการเปลี่ยนแปลงของข้อมูลระบุตัวตนภายในพื้นที่เฝ้าระวัง ฉันจะรายงานเพิ่มเติม"
90100050-38 = "FOX 1 รับทราบ"
90100050-39 = ""
90100050-41 = ""
90100050-42 = "สุดท้าย FOX 2..."
90100050-43 = ""
90100050-45 = ""
90100050-47 = ""
90100050-48 = "อื้อ ฉันก็เตรียมทุกอย่างเสร็จแล้ว"
90100050-49 = "เสบียงพร้อม การพรางตัวสมบูรณ์แบบ..."
90100050-50 = "ถ้าเป้าหมายเข้ามาในพื้นที่ จะเริ่มรวบรวมข้อมูลตามขั้นตอนทันที"
90100050-51 = "ดีมาก ถ้างั้นจากนี้ไป..."
90100050-52 = "[ns1] \"รายงานกันจริงจังมากเลยนะ...\"\n[ns2] \"จากนี้ไปจะทำอะไรเหรอ?\""
90100050-55 = "อ่า... คุณครู [USERNAME]"
90100050-56 = "ฉันบอกแล้วไม่ใช่เหรอคะว่าหลังจบปฏิบัติการ พวกฉันจะไปสรุปผลการปฏิบัติการให้ฟังเอง เพราะงั้นคุณครูไม่จำเป็นต้องตามมาด้วยก็ได้"
90100050-57 = "มีจุดไหนที่กังวลใจงั้นเหรอคะ?"
90100050-58 = "[s3] \"นี่เป็นปฏิบัติการร่วมครั้งแรกระหว่างกองทหาร FOX กับชาเล่ต์นี่นา!\"\n[s4] \"ครูอยากมาดูการทำงานของยูกิโนะด้วยตัวเองน่ะ\""
90100050-61 = "งั้นเหรอคะ..."
90100050-62 = "ถ้างั้นฉันจะบรีฟข้อมูลที่รวบรวมได้จนถึงตอนนี้ และแผนปฏิบัติการที่จะดำเนินการต่อไปให้ฟังค่ะ"
90100050-63 = "เป้าหมายแรกของปฏิบัติการค่งค่ง... ไม่สิ <ปฏิบัติการแกะรอยตำนาน> ก็คือการสืบหาความจริงของ#nเหตุการณ์ที่เกิดขึ้นต่อเนื่องบริเวณใกล้สถานีชิโระอุนางิ"
90100050-64 = "[s] \"ความจริงของเหตุการณ์...?\""
90100050-65 = "ค่ะ เมื่อเดือนที่แล้ว... ไม่นานหลังจากที่ประธานองค์การนักเรียนกลับมา พบว่านักเรียนที่ถูกพบใน#nสภาพหมดสติในย่านนี้เพิ่มขึ้นอย่างรวดเร็วค่ะ"
90100050-67 = "ผู้เสียหายส่วนใหญ่ถูกพบในช่วงเที่ยงวันที่เป็นช่วงอากาศร้อนที่สุด และไม่พบบาดแผลภายนอกใดๆ นอกจากรอยถลอกค่ะ ในตอนแรกจึงสงสัยว่าอาจเป็นอาการป่วยจากความร้อน..."
90100050-68 = "แต่ชีพจรและอุณหภูมิร่างกายก็อยู่ในเกณฑ์ปกติ และหลายรายยังมีอาการชักคล้ายผู้ป่วยโรคลมชัก จึงสรุปได้ว่าไม่น่าจะเป็นอาการป่วยจากความร้อนค่ะ"
90100050-69 = "ที่สำคัญก็คือ ก่อนเกิดเหตุ ผู้เสียหายทุกคนให้การตรงกันว่าไล่ตามหุ่นไล่กาสีขาวไป... ทางสถาบันฝึกตำรวจวัลคิรี่ก็เลยกำลังตรวจสอบตัวตนของหุ่นไล่กาสีขาวนั่นอยู่ค่ะ"
90100050-71 = "แต่ก็ไม่มีพยานคนอื่นนอกจากผู้เสียหายที่เคยเห็นหุ่นไล่กาสีขาวกับตาตัวเอง การสืบสวนก็เลยเหมือนจะติดอุปสรรคอยู่ค่ะ"
90100050-72 = "พอความเสียหายยิ่งขยายวงกว้างในสถานการณ์แบบนี้ ข่าวลือทำนองว่าเป็นคำสาปของภูตผี หรือเป็นฝีมือของวิญญาณร้าย ก็เริ่มแพร่สะพัดตามมาด้วย..."
90100050-73 = "โลกนี้มีผีเหรอ? คงจะพูดจาเรื่อยเปื่อยตามใจชอบน่ะสิ"
90100050-74 = "ก็เพราะมาปล่อยข่าวลือกันอย่างไร้ความรับผิดชอบแบบนี้ไง ประเด็นสำคัญของเหตุการณ์ก็เลยถูกกลบหมด"
90100050-75 = "ฉันก็เห็นด้วยกับที่ว่ามา... แต่ตอนนี้หลักฐานที่พอจะใช้ตัดสินได้ยังมีน้อยเกินไป"
90100050-76 = "คงมีแต่ต้องค่อยๆ ย้อนทบทวนเหตุการณ์แล้วรวบรวมหลักฐานเท่านั้น"
90100050-77 = "[s] \"งั้นตอนนี้จะทำอะไรต่อกันเหรอ?\""
90100050-78 = "ขั้นแรก เราจะเริ่มสอบถามคนใกล้ชิดของผู้เสียหายก่อนค่ะ"
90100050-79 = "ถ้าแสดงท่าทีชัดเจนว่ากำลังสืบสวนอยู่ อีกฝ่ายอาจจะพยายามปิดบังความจริงก็ได้ พวกฉันก็เลยจะปลอมตัวเป็นนักเรียนที่ทำงานพาร์ทไทม์แล้วชวนคุยเพื่อเปิดประเด็นค่ะ"
90100050-80 = "[s] \"ครั้งนี้ก็จะขายซูชิเต้าหู้หวานอีกเหรอ?\""
90100050-81 = "แหะๆ... อากาศแบบนี้คงขายไม่ได้ ครั้งนี้ฉันก็เลยเปลี่ยนเมนูค่ะ"
90100050-82 = "ผู้เสียหายจากเหตุการณ์ล่าสุดน่าจะเป็นนักเรียนจากชมรมกรีฑาจากเกเฮนน่านะ..."
90100050-83 = "ดูเหมือนว่าชมรมกรีฑาจากเกเฮนนาจะมาฝึกซ้อมกันบนทางเดินที่มีคนสัญจรเบาบางแห่งนี้อยู่บ่อยๆ ค่ะ"
90100050-84 = "ฉันเช็กจากโซเชียลแล้ว เห็นว่าวันนี้จะมีการฝึกซ้อมด้วยละ"
90100050-85 = "ถ้าเป็นคนอื่นคงไม่แน่ แต่ถ้าเป็นสมาชิกชมรมกรีฑาด้วยกัน ก็น่าจะรู้ว่าเกิดอะไรขึ้นกับผู้เสียหายก่อน#nที่จะหมดสติไปนะคะ"
90100050-86 = "[s] \"งั้นสินะ...\""
90100050-87 = "FOX 4 รายงาน ขอโทษที่ขัดจังหวะการสนทนาสนุกๆ นะ..."
90100050-88 = "ตอนนี้เป้าหมาย... สมาชิกชมรมกรีฑาจากเกเฮนน่ากำลังเข้าใกล้จุดที่กำหนดแล้ว"
90100050-89 = ""
90100050-91 = ""
90100050-92 = "FOX 2 รบกวนด้วยนะ"
90100050-93 = "วางใจได้เลย~"
90100050-98 = ""
90100050-99 = ""
90100050-100 = "หนึ่ง สอง! หนึ่ง สอง! หนึ่ง สอง!"
90100050-101 = "ทุกคนรักษาจังหวะการหายใจไว้! นับจังหวะไปพร้อมกัน!"
90100050-102 = ""
90100050-104 = ""
90100050-105 = "ขอโทษนะคะ~"
90100050-106 = "หืม? อะไรกัน พวกเรากำลังซ้อมวิ่งอยู่ อย่ามาขวางทางสิ"
90100050-107 = "ขอโทษที่มารบกวนการฝึกซ้อมนะคะ... สนใจลองดื่มเครื่องดื่มเกลือแร่สูตรใหม่ <ไฮเปอร์ เอด> สักแก้วมั้ยคะ?"
90100050-108 = "เครื่องดื่มเกลือแร่...? อะไรกัน จะบังคับให้ซื้อเหรอ?!"
90100050-109 = "จะเป็นแบบนั้นไปได้ยังไงล่ะคะ! เราแจกให้สมาชิกชมรมกรีฑาจากเกเฮนน่าทุกคนฟรีๆ เลย เชิญดื่มได้ตามสบายเลยค่ะ"
90100050-110 = "ดูแปลกๆ นะ..."
90100050-111 = "อันที่จริง <ไฮเปอร์ เอด> เป็นผลิตภัณฑ์ใหม่จากแบรนด์ดังชื่อ <โคซึกะ ฟาร์มาซูติคอล> ที่ทุกคนน่าจะ#nเคยได้ยินชื่อกันมาบ้างนะคะ แต่ตอนนี้สินค้าตัวนี้ยังโปรโมตไม่ทั่วถึง หลายคนก็เลยยังไม่ค่อยรู้จักน่ะค่ะ"
90100050-112 = "เราถึงได้ทั้งติดโฆษณาและจัดกิจกรรมโปรโมตอยู่ตามที่ต่างๆ... แต่ก็ไม่มีอะไรแพร่เร็วไปกว่าการบอก#nต่อปากต่อปากใช่มั้ยล่ะคะ?"
90100050-113 = "ทางเราเลยคิดว่าถ้าขอให้สมาชิกชมรมกรีฑา กลุ่มที่ดื่มเครื่องดื่มเกลือแร่มากที่สุดมาช่วยทดลองชิม ก็น่าจะช่วยให้เกิดการบอกต่อได้ดียิ่งขึ้นค่ะ"
90100050-114 = "อย่างที่ชมรมกรีฑาทุกคนทราบกันดีว่าหลังออกกำลังกายหนักๆ เราจะสูญเสียอิเล็กโทรไลต์ไปพร้อมกับเหงื่อ เราจึงต้องดื่มเครื่องดื่มเกลือแร่ที่ดูดซึมได้เร็ว และ <ไฮเปอร์ เอด> นี้ก็มีปริมาณอิเล็กโทรไลต์เข้มข้นกว่า#nเครื่องดื่มเกลือแร่ของบริษัทอื่น..."
90100050-115 = "กะ... ก็ได้ เข้าใจแล้ว ฉันรู้แล้วว่าเธอพูดจากใจจริง งั้นจะลองดื่มดูก็แล้วกัน"
90100050-116 = "กำลังคอแห้งอยู่พอดีด้วย ถือว่ามาได้ถูกจังหวะเลยละ"
90100050-117 = ""
90100050-119 = ""
90100050-120 = ""
90100050-121 = "เป็นเพราะอากาศร้อนด้วยหรือเปล่านะ...? รู้สึกว่าดื่มแล้วดับกระหายได้เร็วกว่าปกติอีก"
90100050-122 = "แค่ดื่มเข้าไปก็รู้สึกเหมือนร่างกายดูดซึมน้ำได้ทันทีเลยละ..."
90100050-123 = "ใช่มั้ยล่ะคะ? จุดเด่นของ <ไฮเปอร์ เอด> นี้ก็คือ ช่วยให้ร่างกายดูดซึมเกลือแร่ที่จำเป็นได้อย่างเต็ม#nประสิทธิภาพ ไม่ว่าจะอยู่ในสถานการณ์แบบไหนก็ตามค่ะ!"
90100050-124 = "ยังมีเหลืออีกเยอะเลยค่ะ ถ้าใครอยากดื่มเพิ่มก็บอกได้เลยนะคะ"
90100050-125 = "ดื่มแล้วได้ผลดีขนาดนั้นเลยเหรอ? งั้นฉันขอบ้าง..."
90100050-126 = "ฉันด้วยๆ ฉันเอาด้วย!"
90100050-127 = ""
90100050-128 = ""
90100050-129 = ""
90100050-130 = "<ไฮเปอร์ เอด> นั่นมันคืออะไรกันแน่นะ? ฉันไม่เคยได้ยินชื่อเครื่องดื่มนั้นมาก่อนเลย..."
90100050-131 = "มันก็คือเครื่องดื่มผงที่ SRT แจกให้นั่นแหละ แค่ชงให้เข้มกว่ามาตรฐาน 1.5 เท่าน่ะ เธอเองก็น่าจะเคยดื่มมาแล้วนะ"
90100050-132 = "หืม? หมายถึงน้ำมะนาวราคาถูกนั่นน่ะเหรอ? ชอบขนาดนั้นเลยเหรอเนี่ย?"
90100050-133 = "ยัยนั่นน่ะ ต่อให้ไม่ได้อยู่ SRT แต่ไปเป็นพนักงานขาย ก็คงประสบความสำเร็จแน่ๆ"
90100050-134 = "(ถือว่าเข้าไปเปิดบทสนทนาได้ดีเลยหรือเปล่านะ...)"
90100050-135 = ""
