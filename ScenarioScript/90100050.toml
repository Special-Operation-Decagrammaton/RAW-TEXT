[translation]
90100050-1 = "Episode 5;Whereabouts of the Ace"
90100050-2 = ""
90100050-3 = "Log. It is 1030 Kivotos Standard Time. Weather is...sunny."
90100050-4 = "The FOX Squad will commence inquiries regarding \"Mission Lore Pursuit\" immediately."
90100050-5 = "Requesting status reports from each squad member. Call in."
90100050-6 = ""
90100050-8 = ""
90100050-9 = "FOX 4 here. Observing the target's movement. They have left Point Oscar."
90100050-10 = "The target displayed no unusual activity. The area appears under control and vacant. However..."
90100050-11 = "There is a teensy weensy problem at Point Oscar."
90100050-12 = "A \"teensy\" problem?"
90100050-13 = "It's sooooo hot... I'm not even moving, and I'm burning up."
90100050-14 = "I feel like I'm melting away. I'm covered in camouflage netting, but it's doing nothing for the blazing sun... I thought summer wasn't for a few months?"
90100050-15 = "It seems that the hot weather arrived early this year."
90100050-16 = "I'll try to find you more adequate cover next time. Please attempt to endure for the next few—"
90100050-17 = ""
90100050-19 = ""
90100050-20 = "Quit your whining, FOX 4. I've seen you in worse weather."
90100050-21 = "Maybe you've gone soft from being coddled in the Corrections Bureau?"
90100050-22 = "Keep your nagging off the comms, FOX 3. No matter how much you train, what's hot is hot. Accept it."
90100050-23 = "I wouldn't be sweating as much if I could get away with only wearing a camisole instead of an actual bra, like SOMEONE I know..."
90100050-24 = "I'm adequately covered!"
90100050-25 = ""
90100050-27 = ""
90100050-28 = "...FOX 3, report."
90100050-29 = "Th-This is FOX 3. S-So I was saying that I'm actually wearing proper—"
90100050-30 = "FOX 3, practice non-reactivity. FOX 4 was making a joke. There's no need to get distracted."
90100050-31 = "R-Right. Ugh..."
90100050-32 = ""
90100050-34 = ""
90100050-35 = "FOX 3 here. I'm currently operating IMSI collector equipment at Point Papa."
90100050-36 = "The lack of collected device IDs at Point Papa indicate that there are no additional individuals within a 500-meter radius."
90100050-37 = "Will provide further reports if any anomalies or changes are detected in the surveillance zone."
90100050-38 = "FOX 1, roger that."
90100050-39 = ""
90100050-41 = ""
90100050-42 = "And lastly, FOX 2..."
90100050-43 = ""
90100050-45 = ""
90100050-47 = ""
90100050-48 = "Yes. I'm all ready too."
90100050-49 = "I have plenty of supplies, and my camouflage is perfect, so..."
90100050-50 = "I'll gather information according to procedure when the target arrives."
90100050-51 = "Great. Then, now..."
90100050-52 = "[ns1] \"Seems like things are getting serious...\"\n[ns2] \"What's the plan?\""
90100050-55 = "Ah... [USERNAME] Sensei."
90100050-56 = "I believe I told you earlier that you don't need to directly supervise. I will provide you with an official debriefing after the mission."
90100050-57 = "Is there a reason you're calling in?"
90100050-58 = "[s3] \"This is the FOX Squad's first joint mission with Schale!\"\n[s4] \"I wanted to personally see you work!\""
90100050-61 = "...I understand."
90100050-62 = "Then here is a quick rundown of our current status, as well as our next steps."
90100050-63 = "Mission Kon-Kon... No, Mission Lore Pursuit's first objective is to uncover the truth behind the multiple incidents alleged to have happened here, near Shiro Unagi Station."
90100050-64 = "[s] \"Uncover the truth...?\""
90100050-65 = "Yes. Since last month, around when the General Student Council President returned, multiple students have lost consciousness in this area."
90100050-67 = "Most of the victims were discovered around noon, during high temperatures, and showed no external injuries other than minor abrasions. Naturally, many suspected heat-related illness..."
90100050-68 = "However, the patients displayed normal heart rates and body temperatures. Many of them further suffered convulsions similar to those seen in epilepsy patients. All that is inconsistent with heat stroke."
90100050-69 = "Notably, witnesses consistently testified that victims were seen chasing a white scarecrow before the incidents... Valkyrie Police School is currently investigating the white scarecrow's identity."
90100050-71 = "But, see... No one has SEEN the scarecrow up close...aside from the victims."
90100050-72 = "Since the victim count is increasing, students are now spreading rumors of a ghost or evil spirit haunting the area."
90100050-73 = "Ghosts aren't real! They're just making stuff up! It's all nonsense!"
90100050-74 = "Needlessly spreading rumors like this only makes the truth harder to find."
90100050-75 = "Agreed... But we don't have enough evidence to draw a conclusion."
90100050-76 = "Regardless of our biases, we must take our time to review the incident and collect evidence."
90100050-77 = "[s] \"So, what's the current goal?\""
90100050-78 = "I'm going to ask around, specifically targeting people who are close to the victims."
90100050-79 = "No one likes being interrogated, so I'll pose as a part-timer. After a little banter, I'll try casually bringing up the topic."
90100050-80 = "[s] \"Are you selling inarizushi again?\""
90100050-81 = "Haha... I had to change the menu on account of the hot weather."
90100050-82 = "The most recent victim was a Gehenna Track and Field Team athlete..."
90100050-83 = "And, allegedly, the Gehenna runners enjoy this secluded trail."
90100050-84 = "According to their team's social media account, they're training today."
90100050-85 = "I'm hoping the victim's teammates can shed some light on what happened to their friend."
90100050-86 = "[s] \"I see...\""
90100050-87 = "FOX 4 here. Sorry to interrupt your conversation..."
90100050-88 = "But the targets are approaching the rendezvous point."
90100050-89 = ""
90100050-91 = ""
90100050-92 = "It's up to you, FOX 2."
90100050-93 = "Leave it to me!"
90100050-98 = ""
90100050-99 = ""
90100050-100 = "One, two! One, two! One, two!"
90100050-101 = "Control your breathing! Stay in sync with the chant!"
90100050-102 = ""
90100050-104 = ""
90100050-105 = "Pardon me!"
90100050-106 = "Hm? Who're you? Get out of our way!"
90100050-107 = "Sorry to interrupt your arduous training... But you girls seem so hot! Would you like to try out a refreshing \"Hyperade\"?"
90100050-108 = "A sports drink...? Look, we don't have any money. Beat it!"
90100050-109 = "Ladies! It's on the house! I'm a big fan of the Gehenna Track team! You're all so...special!"
90100050-110 = "Seems fishy..."
90100050-111 = "No, it's vegan! \"Hyperade\" is a spanking new electrolyte and hydration activation system from Kozuka Pharmaceutical! Keep it cool with Kozuka!"
90100050-112 = "We're flyering and holding promo sales... But they say nothing's faster than word of mouth, right? And you gals know \"fast!\" Haha!"
90100050-113 = "So we'd figured if you respected track students like it, then you could do us a favor and tell your friends!"
90100050-114 = "I'm sure you know how important it is to replace your electrolytes after a workout. Hyperade has a scientifically higher electrolyte concentration than our competitors, which means you can recover—"
90100050-115 = "Y-Yeah. Got it. It's free, you're serious. We'll try it."
90100050-116 = "Yeah. I was getting thirsty, anyway."
90100050-117 = ""
90100050-119 = ""
90100050-120 = ""
90100050-121 = "...Maybe it's because it's so hot today? I think I really needed that. Is this actually working?"
90100050-122 = "I can feel the water seeping into my cells!"
90100050-123 = "That's right! Hyperade is \"hype\" when it comes to delivering the electrolytes YOU need! Especially when things get heated, if you know what I mean!"
90100050-124 = "There's plenty for everyone, so please don't be shy! Take a sip and BE your BEST!"
90100050-125 = "Oh, it's actually good? Hmm, okay... I'll try it!"
90100050-126 = "Yeah, gimme one!"
90100050-127 = ""
90100050-128 = ""
90100050-129 = ""
90100050-130 = "Damn, what's in that stuff? They're loving it."
90100050-131 = "It's that drink powder from SRT. She just didn't water it down so much. I'm sure you've had it."
90100050-132 = "Huh? You mean that cheapo fake lemonade? What's wrong with these runners?"
90100050-133 = "It seems FOX 2 missed her true calling. Forget guns, she should have gone into sales."
90100050-134 = "(She's got their attention... Now for the strike.)"
90100050-135 = ""
90100050-136 = "...Thanks for the drink. You're a lifesaver! I wish we could repay you."
90100050-137 = "It's on the house, hun! But it would mean the world if you spread the HYPE about Hyperade to your friends!"
90100050-138 = "No problem! I can't wait to see this in stores. We'll get the word out."
90100050-139 = ""
90100050-141 = ""
90100050-142 = ""
90100050-143 = "...Speaking of words...getting out..."
90100050-144 = "Have you heard of the runner who fell ill around here?"
90100050-145 = ""
90100050-147 = ""
90100050-148 = "Hm? Are you talking about Tama? What about..."
90100050-149 = "...What's it to you?"
90100050-150 = "Oh, nothing."
90100050-151 = "It's just... My manager told me to be careful out here. That there have been...\"incidents.\""
90100050-152 = "..."
90100050-153 = "Yeah, sorry. We've got nothing to say about that."
90100050-154 = "It was heatstroke, right?"
90100050-155 = "She's got no idea..."
90100050-156 = "U-Um, maybe we can—"
90100050-157 = ""
90100050-159 = ""
90100050-160 = "Thanks for the drinks."
90100050-161 = ""
90100050-163 = ""
90100050-164 = ""
90100050-165 = ""
90100050-166 = ""
90100050-167 = "Damn. Didn't work."
90100050-168 = "Sounds like Niko somehow annoyed them."
90100050-169 = "FOX 2, reporting in... Sorry, but it looks like I failed."
90100050-170 = "It's fine. We never thought this would be easy."
90100050-171 = ""
90100050-173 = ""
90100050-174 = "FOX 2, hold. Someone's headed your way."
90100050-175 = ""
90100050-177 = ""
90100050-178 = ""
90100050-180 = ""
90100050-181 = "Hi there... Are you still giving out samples?"
90100050-182 = "O-Of course. Would you like some?"
90100050-183 = ""
90100050-185 = ""
90100050-186 = ""
90100050-187 = "Thank you kindly. I was curious. I've never heard of this brand."
90100050-188 = ""
90100050-190 = ""
90100050-191 = "Hmm... Zippy and unique. I'll tell Kirara about it."
90100050-192 = "You seem so nice! Do you go to school around here?"
90100050-193 = "Ah... Th-Thank you! I study, but not close by. It's a very secluded academy. It's called...\"Private Hyacinth\"..."
90100050-194 = "\"Private Hyacinth Academy\"? That rings a bell."
90100050-195 = "But I was watching. Don't let the track girls get to you. They're just a little on edge since...you know."
90100050-196 = "I'm not sure I do \"know\"?"
90100050-197 = "You mentioned it! About the runner who passed out around here?"
90100050-198 = "You must be curious."
90100050-199 = "Oh... I didn't want to intrude or offend anyone..."
90100050-200 = "You're sweet, but be honest. You want the scoop, don't you?"
90100050-201 = "And I can tell you like gossip. You have the vibe."
90100050-202 = ""
90100050-204 = ""
90100050-205 = ""
90100050-206 = "Ahaha... Was it that obvious?"
90100050-208 = "So, our track team was preparing for the upcoming interhigh championship. And the student who passed out was a strong contender for the starting lineup."
90100050-209 = "She was so competitive that she would run all by herself outside of practice. Even on the weekends."
90100050-210 = "That's why everyone thought that she overworked and gave herself heatstroke."
90100050-211 = ""
90100050-212 = "...But it turns out... That's not what happened."
90100050-213 = "Yeah. People are already posting about it, but there was nothing wrong with her. The Medical Emergency Club confirmed it."
90100050-214 = "So people said that one of the club members cursed or attacked her out of jealousy, all because they wanted her spot in the starting lineup."
90100050-215 = "Ah... So that's why those runners seemed so tense."
90100050-216 = "Even if you had less competition, you'd feel pretty defensive if people went around implying that you sabotaged your friend."
90100050-217 = "I know we Gehenna girls are pretty self-assured, but it's hard not to care what others think."
90100050-218 = "I see. Enough stress and public shame can ruin someone's health."
90100050-219 = "While the Track and Field Team is feeling the heat, they have no choice. They have to wait out the rumors, especially since the girl who collapsed still can't talk."
90100050-220 = ""
90100050-222 = ""
90100050-223 = "...It's all rumors."
90100050-224 = "Wild rumors like this are sometimes compared to natural phenomena, like the wind or waves."
90100050-225 = "You can't stop them even if you try, and fighting them only makes things worse."
90100050-226 = "For those at the center of the rumors, it must feel like facing a storm in the middle of the sea."
90100050-227 = "I suppose surrendering yourself to the waves and letting fate take over may feel like the only way to survive..."
90100050-228 = "But...we're not rudderless boats with no free will."
90100050-229 = "Maybe it would be best to take the helm and sail against the waves."
90100050-230 = ""
90100050-232 = ""
90100050-233 = ""
90100050-234 = "Is this coming from personal experience?"
90100050-235 = "You don't get to be a teenage girl without navigating through a few nasty rumors."
90100050-236 = "Fufu, I like you."
90100050-237 = "You want to add each other on MomoTalk? We may meet again, after all."
90100050-238 = "Sure! One second."
90100050-239 = ""
90100050-241 = ""
90100050-242 = ""
90100050-243 = "Awesome. I'll catch you later. Stay cool!"
90100050-244 = ""
90100050-246 = ""
90100050-247 = ""
90100050-248 = ""
90100050-249 = "She had a certain twinkle, didn't she?"
90100050-250 = "Yeah. Hey, FOX 2, you didn't give her your ACTUAL MomoTalk, right?"
90100050-251 = "Don't worry. It's a burner account. I'll delete it tomorrow."
90100050-252 = "In another place, we might have been friends... But we're in the middle of a mission right now."
