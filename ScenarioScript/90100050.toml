[translation]
90100050-1 = "第5話;王牌的去向"
90100050-2 = ""
90100050-3 = "現在時間為奇普托斯標準時間1030。"
90100050-4 = "FOX小隊現在開始進行「怪談追蹤作戰」的查訪。"
90100050-5 = "各小隊隊員，回報。"
90100050-6 = ""
90100050-8 = ""
90100050-9 = "這裡是FOX4。#n目前正在Point Oscar觀察目標的動向。"
90100050-10 = "截至目前為止，包含目標在內皆未觀測到異常動向。#n只不過……"
90100050-11 = "Point Oscar有個非常細微又可愛的小問題。"
90100050-12 = "細微的問題？"
90100050-13 = "好熱……就算只是待著也好熱……"
90100050-14 = "在陽光直射的地方裹著偽裝布待著，感覺全身都要融化了～#n夏天不是還要好一陣子才會來嗎！？"
90100050-15 = "今年的暑氣似乎比往年來得稍微早了一點。"
90100050-16 = "抱歉，下次我會幫你找個有點陰涼的據點，所以這次就──"
90100050-17 = ""
90100050-19 = ""
90100050-20 = "別發牢騷了，FOX4。#n以前你在比這更熱的地方不也忍得好好的嗎？"
90100050-21 = "是不是在矯正局待太久，身體變虛弱了啊？"
90100050-22 = "不要在作戰頻道嘮叨啦，FOX3。#n就算再怎麼鍛鍊身體，熱就是熱啊。"
90100050-23 = "要是我也像某人那樣不穿內衣只穿小可愛的話，大概也會比較不熱吧──"
90100050-24 = "我有好好穿著啦！"
90100050-25 = ""
90100050-27 = ""
90100050-28 = "……FOX3，接著回報。"
90100050-29 = "這，這裡是FOX3。#n所以說不是小可愛，是正經的──"
90100050-30 = "FOX3。沒必要對FOX4的玩笑那麼認真。"
90100050-31 = "說，說的也是。嗚嗚……"
90100050-32 = ""
90100050-34 = ""
90100050-35 = "這裡是FOX3。#n正在Point PaPa[ruby=終端機固有識別號碼]啟動IMSI蒐集[/ruby]設備。"
90100050-36 = "將目前蒐集到的識別號碼數量與Point Oscar的目標數量比對的結果顯示，#n半徑500m內似乎沒有未識別的終端設備。"
90100050-37 = "如果監視區域內出現異常徵兆或識別變動，我會追加回報。"
90100050-38 = "FOX1，確認。"
90100050-39 = ""
90100050-41 = ""
90100050-42 = "最後，FOX2是……"
90100050-43 = ""
90100050-45 = ""
90100050-47 = ""
90100050-48 = "嗯。這邊的準備也全都完成了。"
90100050-49 = "物資數量充足，偽裝也做得完美無缺……"
90100050-50 = "一旦目標接近，我就會依照程序開始蒐集情報。"
90100050-51 = "好。那麼從現在起──"
90100050-52 = "[ns1] 「好像在談什麼很了不得的事情呢……」\n[ns2] 「接下來打算做什麼呢？」"
90100050-55 = "啊……[USERNAME]老師。"
90100050-56 = "我應該向您提過，會在作戰結束後回去向老師進行事後檢討，因此不必親自跟來的。"
90100050-57 = "是有什麼讓您感到不安的地方嗎？"
90100050-58 = "[s3] 「這可是FOX小隊和夏萊的第一次聯合作戰！」\n[s4] 「因為我想親眼看看雪乃工作時的樣子嘛。」"
90100050-61 = "……這樣啊。"
90100050-62 = "那麼我就針對目前為止收集到的情報，以及接下來要進行的作戰進行簡短的報告。"
90100050-63 = "這次的哐哐……更正，「怪談追蹤作戰」的第一個目標，#n就是查明在這裡，也就是白鰻車站附近接連發生的事件真相。"
90100050-64 = "[s] 「事件真相……？」"
90100050-65 = "是的。自從上個月──聯邦學生會長回歸後沒多久，#n被發現在這一帶失去意識的學生便開始急遽增加。"
90100050-67 = "受害者大多在氣溫偏高的正午被發現，除了擦傷之外沒有其他外傷。#n因此最初被懷疑是由中暑引起的熱疾病……"
90100050-68 = "然而受害者的脈搏和體溫都正常，並且許多人都發生了癲癇般的痙攣……#n所以最終判斷那並不是熱疾病。"
90100050-69 = "重點是在事故發生前，受害者們都有追逐白色稻草人的共同證詞……#n現在女武神警察學園正在調查那個白色稻草人的真面目。"
90100050-71 = "但是除了受害者之外，沒有人親眼目擊過白色稻草人，因此調查似乎陷入了困境。"
90100050-72 = "隨著災情的不斷擴大，諸如鬼魂的詛咒、惡靈作祟等等傳聞也跟著散播開來……"
90100050-73 = "這個世上哪有什麼鬼魂啊？#n只不過是那些人在胡說八道而已。"
90100050-74 = "就是因為有人像這樣不負責任地散播謠言，才會讓事件真正的本質變得更加模糊。"
90100050-75 = "這點我也同意……不過就目前來說，能夠判斷的依據還太少。"
90100050-76 = "只能回顧事件並蒐集證據了。"
90100050-77 = "[s] 「那麼現在該做什麼呢？」"
90100050-78 = "首先，我打算對受害者身邊的人進行探訪。"
90100050-79 = "擺出調查的態度可能會讓對方有所隱瞞，所以要偽裝成打工的學生來帶出話題。"
90100050-80 = "[s] 「這次也打算賣豆皮壽司嗎？」"
90100050-81 = "哈哈……因為這種天氣可能賣不太出去，我稍微調整了一下菜單。"
90100050-82 = "最近一次事件的受害者，似乎是格黑娜田徑部的選手……"
90100050-83 = "而格黑娜的田徑部，好像經常在這條人煙稀少的步道上訓練。"
90100050-84 = "我查了一下SNS，今天應該也有要訓練的計畫。"
90100050-85 = "如果同為田徑部的成員，或許會知道受害者在失去意識前發生了什麼事才對。"
90100050-86 = "[s] 「原來如此……」"
90100050-87 = "這裡是FOX4。#n抱歉打斷你們愉快的談話……"
90100050-88 = "目標──格黑娜田徑部的成員們正在接近該地點。"
90100050-89 = ""
90100050-91 = ""
90100050-92 = "那麼FOX2，就拜託你了。"
90100050-93 = "交給我吧～"
90100050-98 = ""
90100050-99 = ""
90100050-100 = "一，二！一，二！一，二！"
90100050-101 = "大家呼吸不要亂掉！跟著口號來！"
90100050-102 = ""
90100050-104 = ""
90100050-105 = "打擾了～"
90100050-106 = "嗯？有什麼事啊？#n別擋在前面妨礙我們跑步好嗎？"
90100050-107 = "抱歉在訓練途中打擾各位……#n這是我們新推出的運動飲料「Hyper Aid」，要不要來一杯呢？"
90100050-108 = "突然就拿出運動飲料……？#n怎麼，難道是想強迫推銷嗎！？"
90100050-109 = "怎麼會呢！這是免費提供給格黑娜田徑部的，各位儘管喝沒關係。"
90100050-110 = "總覺得有點可疑……"
90100050-111 = "其實這款「Hyper Aid」是各位多少都聽過的知名品牌──小塚製藥新推出的產品。#n可能是因為宣傳做得不夠好的關係，好像還有很多人沒聽說過。"
90100050-112 = "雖然我們有到處張貼廣告或舉辦促銷活動……#n不過傳播最快的宣傳方式不就是口耳相傳嗎？"
90100050-113 = "所以我才想，如果請運動飲料需求最大的田徑部學生試喝，口碑應該能傳得更好。"
90100050-114 = "田徑部的各位應該都知道，電解質會在激烈運動後隨著汗水流失，#n所以補充吸收快速的運動飲料是很重要的。#n而這款「Hyper Aid」含有比其他運動飲料更高濃度的電解質──"
90100050-115 = "知，知道了知道了。#n我已經充分了解你的誠意了，就喝一杯看看吧。"
90100050-116 = "正好我也覺得口有點渴了。"
90100050-117 = ""
90100050-119 = ""
90100050-120 = ""
90100050-121 = "……是因為天氣熱嗎？感覺解渴速度好像比平常更快。"
90100050-122 = "有種水分一喝下去就馬上滲進身體裡的感覺……"
90100050-123 = "對吧？在任何環境都能確實吸收需要的電解質，正是這款「Hyper Aid」的優點！"
90100050-124 = "份量很充足，如果有人還想喝的話請儘管說！"
90100050-125 = "真的那麼有效嗎？那我也……"
90100050-126 = "我也要，我也要喝！"
90100050-127 = ""
90100050-128 = ""
90100050-129 = ""
90100050-130 = "那個叫「Hyper Aid」的到底是什麼啊？#n連我自己也是第一次聽到耶……"
90100050-131 = "只是把SRT配給的粉末飲料泡得比標準量濃1.5倍而已。#n你應該也喝過吧。"
90100050-132 = "嗯？你是說那個廉價的檸檬汽水嗎？#n他們居然這麼喜歡那種東西哦？"
90100050-133 = "那孩子就算不來SRT，改行當業務員也一定會成功的。"
90100050-134 = "（以帶出話題而言算是成功了吧……）"
90100050-135 = ""
90100050-136 = "……託你的福，我們喝得很開心。#n這下真不知道該怎麼謝你才好。"
90100050-137 = "不用客氣。只要各位能喝得開心並幫忙推薦一下，我們就很感謝了。"
90100050-138 = "這點你放心。在傳聞確實傳開之前，我會一直向周遭的人推薦的！"
90100050-139 = ""
90100050-141 = ""
90100050-142 = ""
90100050-143 = "說到傳聞……我想起來了。"
90100050-144 = "前陣子被發現在這附近失去意識的那位田徑部成員的事，您有聽說過嗎？"
90100050-145 = ""
90100050-147 = ""
90100050-148 = "嗯？是說玉醬的事嗎？#n為什麼要問──"
90100050-149 = "……你為什麼要問那件事？"
90100050-150 = "啊，並沒有什麼特別的理由。"
90100050-151 = "只是覺得最近這附近好像常發生類似的意外，所以希望你們也小心一點。"
90100050-152 = "……"
90100050-153 = "關於那起事件，我們沒什麼好說的。"
90100050-154 = "反正大家不都說是中暑造成的嗎？"
90100050-155 = "明明什麼都不知道……"
90100050-156 = "那，那個，莫非──"
90100050-157 = ""
90100050-159 = ""
90100050-160 = "飲料很不錯，謝謝你啦。"
90100050-161 = ""
90100050-163 = ""
90100050-164 = ""
90100050-165 = ""
90100050-166 = ""
90100050-167 = "糟糕，失敗了嗎……"
90100050-168 = "看來是不小心觸碰到逆鱗了呢。"
90100050-169 = "這裡是FOX2……抱歉，好像失敗了。"
90100050-170 = "沒關係。我本來就不指望對方會友善以對──"
90100050-171 = ""
90100050-173 = ""
90100050-174 = "等等，FOX2。有其他人正朝你那邊靠近。"
90100050-175 = ""
90100050-177 = ""
90100050-178 = ""
90100050-180 = ""
90100050-181 = "那個……這個飲料，現在還有在發送嗎？"
90100050-182 = "當，當然囉。您要來一杯嗎？"
90100050-183 = ""
90100050-185 = ""
90100050-186 = ""
90100050-187 = "謝謝。這是我第一次聽到的品牌，所以覺得有點好奇。"
90100050-188 = ""
90100050-190 = ""
90100050-191 = "哼嗯……有種沒有嚐過的獨特風味呢。#n之後也要告訴綺羅羅才行。"
90100050-192 = "話說回來，我好像沒在這附近見過你呢。#n是從別的學園來的嗎？"
90100050-193 = "啊……是，是的！我就讀的是離這裡有點遠的學園。#n那個，是叫做私立風信子學園的……"
90100050-194 = "私立風信子學園？好像在哪裡聽過。"
90100050-195 = "總之，你不必把剛才田徑部學生的話太放在心上。#n他們因為「那起事件」的關係，現在個個都繃緊了神經。"
90100050-196 = "那起事件是指……"
90100050-197 = "嗯。就是格黑娜田徑部學生被發現失去意識的事。"
90100050-198 = "你也對那起事件有興趣吧？"
90100050-199 = "不，其實我並沒有那麼有興趣──"
90100050-200 = "哎呀，你對那些傳聞在意得不得了的心思，已經全都寫在臉上了哦？"
90100050-201 = "看來你也相當喜歡聊八卦呢。"
90100050-202 = ""
90100050-204 = ""
90100050-205 = ""
90100050-206 = "啊哈哈……有那麼明顯嗎？"
90100050-208 = "其實，格黑娜田徑部很快就要迎接全國大賽的主力選拔賽了。#n這次倒下的那位學生，也是很有希望入選的主力候選人之一。"
90100050-209 = "或許是因為這樣，那位學生連假日都在獨自練跑，相當積極地投入主力競爭。"
90100050-210 = "所以大家發現他倒下的時候，都以為是他操練過度才會中暑……"
90100050-211 = ""
90100050-212 = "……看來並不是中暑呢。"
90100050-213 = "嗯。這在SNS上已經傳得很廣了，據說那位田徑部學生的身體沒有任何異常。#n這是急救醫學部也確認過的內容，所以應該不是空穴來風。"
90100050-214 = "不過畢竟是有力候選人莫名奇妙地倒下，#n才會傳出有其他成員嫉妒他、對他下詛咒之類的傳聞。"
90100050-215 = "啊啊……所以剛才他們才會是那種反應啊。"
90100050-216 = "就算能在主力競爭中得利……出現詛咒或加害朋友的傳聞，心裡肯定也不好受吧？"
90100050-217 = "即使格黑娜的學生大多是我行我素、不在意他人眼光的類型，#n終究還是會在意這些負面傳聞的。"
90100050-218 = "說的也是……俗話說三人成虎。#n要是被那麼多人指指點點，本來沒病也會生出病來的。"
90100050-219 = "雖然站在田徑部的立場可能覺得挺委屈的……#n不過在當事人無法回應的情況下，也只能等待傳聞平息了。"
90100050-220 = ""
90100050-222 = ""
90100050-223 = "……傳聞啊。"
90100050-224 = "這種在人們之間口耳相傳的傳聞，好像經常被比喻成風或浪之類的自然現象呢。"
90100050-225 = "即使想擋也擋不住……#n要是想逆流而行，那股風浪還可能會流向意想不到的地方擴大災情。"
90100050-226 = "對傳聞的當事人來說，那種感覺恐怕就像在茫茫大海中面對巨浪一樣吧。"
90100050-227 = "雖然將身體託付給浪潮，任由巨大的意志牽引也是一種做法……"
90100050-228 = "然而我們並不是沒有意志的小船。"
90100050-229 = "我認為唯有握緊舵、划著槳逆浪前行，才能抵達正確的目的地。"
90100050-230 = ""
90100050-232 = ""
90100050-233 = ""
90100050-234 = "這是你本人的經驗談嗎？"
90100050-235 = "畢竟活在社會上，應該很少有人從來沒被人議論過吧。"
90100050-236 = "呵呵，真有趣呢。"
90100050-237 = "話說，要不要交換一下MomoTalk的帳號？#n之後搞不好還有機會見面也說不定。"
90100050-238 = "好的。請稍等一下。"
90100050-239 = ""
