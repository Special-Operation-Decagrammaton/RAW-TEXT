[translation]
10018100-1 = "제10화;운명의 날."
10018100-9 = "안녕하세요! 시청자 여러분!"
10018100-10 = "올 한 해 잘 보내셨나요? 다가올 새해를 맞을 준비는 OK?"
10018100-11 = "크로노스 스쿨 보도부의 아이돌 리포터! 카와루 시논입니다!"
10018100-15 = "그러면~ 여기가 어딘지 혹시 아시는 분? 계시나요? 안 계시나요?"
10018100-16 = "혹시 모르신다고 해도 이상할 것은 없답니다!"
10018100-18 = "저희도 소식을 듣기 전까지는 평범한 상점가라고만 생각했으니까요!"
10018100-19 = "그런데 말입니다. 혹시 <냐오모토 푸드> 라고 알고 계신가요? 어쩌면 아시는 분도 계시겠죠!"
10018100-20 = "'냐오모토 푸드', 즉 '냐오푸드'는 최근 빠르게 키보토스 전역에서 사업을 확장하고 있는 식품회사입니다!"
10018100-21 = "오늘 저희는, 그 <냐오모토 푸드>가 주최하는 '신년 요리 오세치 대결'이 바로 이곳에서 벌어진다는 제보를 입수했습니다!"
10018100-22 = "박수! 짝짝짝!"
10018100-23 = "아, 이 방송은 <냐오모토 푸드>의 후원을 받아 이루어지고 있으며, 특별한 게스트도 모셨답니다."
10018100-24 = "<냐오모토 푸드>의 회장, 냐오모토 캔이십니다!"
10018100-31 = "뭇후후후. 반갑습니다. 여러분."
10018100-32 = "이 조촐한 이벤트에 많은 관심을 보여주셔서 감사합니다."
10018100-34 = "그리고 그에 맞서는 도전자!"
10018100-35 = "냐오푸드와 같은 신흥 대기업에게, 맛으로는 결코 밀리지 않겠다는 전통의 주인!"
10018100-36 = "<참새정>의 주인분이십니다!"
10018100-42 = "아, 안녕하세요…… 잘 부탁드립니다……"
10018100-43 = "룰은 간단합니다. 저희 냐오푸드와 여기 참새정…… 의 주인분은,"
10018100-44 = "각각 100찬합분의 오세치를 만들기로 약조를 했었죠."
10018100-45 = "오늘이야말로 바로 그 결과를 겨루는 당일. 그러나 걱정되는군요."
10018100-46 = "저희 냐오푸드야 첨단 공법과 대량 생산 체제로 100찬합분의 오세치를 어렵지 않게 준비했지만,"
10018100-47 = "수작업에 의지하는 참새정에서, 과연 그 물량을 소화할 수 있었으련지……?"
10018100-49 = "그렇군요! 도전자의 사정까지 염려하는 회장님의 관대함, 잘 들었습니다!"
10018100-50 = "그러면 참새정 주인분께서는?!"
10018100-53 = "(뭇후후후. 그게 가능할 리가 없지.)"
10018100-54 = "(수많은 방해공작이 있었고, 애초에 사람의 손으로 100찬합, 아니, 400인분의 요리를 단시간 안에 만든다는 것이 말이다.)"
10018100-55 = "(어떤 광경이 이어질지 눈에 선하다. 참새정 주인은 울상이 되어 정량을 준비하지 못했다고 망신을 당하고,)"
10018100-56 = "(이 몸은 짐짓 관대하게 그 실수를 넘어가 주는 광경이!)"
10018100-58 = "네……"
10018100-59 = "염려해 주신 덕분이라고 할까. 어떻게든 100찬합 분량의 오세치를 만드는 데 성공했답니다."
10018100-64 = "뭣이?!"
10018100-66 = "오오! 그렇군요! 냐오푸드의 대량 생산 공법에 밀리지 않는 참새정의 솜씨!"
10018100-67 = "그 비결을 여쭤봐도 될까요?!"
10018100-68 = "함께 도와주신 많은 분들이 계셨기 때문이지요."
10018100-69 = "소개드리겠습니다."
10018100-77 = "아, 안녕하세요. 게헨나 급양부의…… 아이키요 후우카입니다. 잘 부탁드립니다."
10018100-78 = "게헨나 미식연구회의 쿠로다테 하루나입니다."
10018100-80 = "세상에! 여러분. 주목해 주십시오!"
10018100-81 = "게헨나의 그 급양부와 그 미식연구회입니다!"
10018100-82 = "이 둘이 손을 잡다니, 무슨 일일까요! 내일 게헨나가 멸망하기라도 하는 걸까요?!"
10018100-83 = "참새정의 성과에는, 상상조차 할 수 없었던 두 집단의 협력이 있었던 것이군요!"
10018100-84 = "저 카와루 시논! 두 눈으로 보면서도 믿기지 않을 정도입니다!"
10018100-86 = "(하, 하지만 걱정할 것은 없다.)"
10018100-87 = "(짧은 시간에 만든 100찬합 분의 들쑥날쑥한 수제 요리가)"
10018100-88 = "(모든 것이 제어되는 환경에서 만들어진 공산품 요리보다 맛이 있을 리 없으니!)"
10018100-89 = "자, 그러면 이제부터 본격적인 승부입니다!"
10018100-90 = "입맛이 까다롭기로 소문난 상인회 여러분께 직접 심사를 받을 예정인데요!"
10018100-94 = "아? 저 역시 먹어 보아도 된다는 거군요?"
10018100-95 = "감사합니다!"
10018100-99 = "오세치 요리도 간만이구만……"
10018100-100 = "오세치는 맛있기는 한데, 너무 달아서 먹다 보면 조금 물린단 말이지."
10018100-101 = "손이 많이 가서 집에서는 만들기도 힘들고 말야."
10018100-108 = "잠깐만, 이 맛은……?!"
10018100-111 = "솔직히 말해, 난 오세치를 그렇게까지 좋아하지는 않아."
10018100-112 = "요즘 시대에 잘 먹힐 맛은 아니긴 하지. 그래도 보는 맛이라도 있으니 다행이지."
10018100-116 = "이쪽이 냐오푸드의 오세치인가……"
10018100-121 = "우물우물. 뭐, 예상대로의 맛이네."
10018100-122 = "그럼 이 쪽이 참새정……"
10018100-126 = "음?"
10018100-127 = "이봐, 잠깐. 이것 좀 먹어 봐."
10018100-129 = "솔직하게 말씀드려서 제대로 된 오세치는 처음 먹어 봐요! 기대되는데요?"
10018100-130 = "마침 좋은 기회겠구만. 하는 김에 우리 시장 홍보도 좀 부탁해."
10018100-131 = "이미 저희 크로노스 스쿨 보도부가 왔다는 시점에서 홍보는 충분히 된 게 아닐까요?!"
10018100-132 = "오히려 거기에서 신경 쓰이는 부분이 있다고나 할까, 어떨까……"
10018100-137 = "어라? 오세치라는 게…… 이렇게 깊은 맛을 내는 요리였나요?"
10018100-138 = "대단하네요!"
10018100-139 = "흐음?"
10018100-140 = "그렇다면 나도 한번……"
10018100-148 = "오오오오오옷?!"
10018100-151 = "보고 계신가요, 시청자 여러분!"
10018100-152 = "냐오푸드의 주최로 이루어지는 신년 요리 대결도 클라이막스!"
10018100-153 = "드디어 결정의 시간입니다!"
10018100-158 = "(최선을 다했어…… 남은 건 결과를 기다릴 뿐.)"
10018100-159 = "(어떻게 보아도 이 몸의 승리다. 그 사실에 변화는 없을 터. 뭇후후후.)"
10018100-164 = "승자는! 압도적인 표차로!"
10018100-166 = "(승리 멘트는 뭐라고 해야 하는가. 이것 참, 지배하는 입장이란 때로 번거롭군.)"
10018100-167 = "(적당히 저 주인을 배려하는 척하면서…… 어느 정도 겸양도 갖춘……)"
10018100-168 = "(그건 그것이고, 집행은 집행대로 처리해야겠지만.)"
10018100-173 = "이것은 누구도 예측하지 못했을 의외의 결과!"
10018100-174 = "참새정입니다!"
10018100-176 = "그래, 그래…… 예측대로 참새정……"
10018100-180 = "뭣이?!?!"
10018100-182 = "해냈어요! 우리가 해냈어요!!!"
10018100-183 = "이럴 수가…… 믿기지 않네요."
10018100-184 = "정말, 모두, 감사드립니다……!"
10018100-186 = "그럴 리가 없다! 무언가가 잘못되었음이 틀림없어!"
10018100-187 = "100찬합이다, 100찬합! 인원수로 따지면 400인분에 해당되는 양이다!"
10018100-188 = "그만한 양을, 품질이 들쑥날쑥해질 수밖에 없는 수제 요리가!"
10018100-189 = "모든 것이 제어되는 환경에서 만들어진 공산품 요리보다 더 뛰어날 리가!"
10018100-191 = "너무 안이하게 생각한 것 아닌가요, 회장님?"
10018100-200 = "너는!"
10018100-201 = "오세치 요리는 흔히 질린다고 하죠. 절반 이상이 단맛을 내는 요리들이니까요."
10018100-202 = "단맛의 한계는 질리는 구간이 너무 빨리 찾아온다는 거예요."
10018100-203 = "안 그래도 빨리 질리는 맛인데, 반복되는 공정 하에 합성 조미료로 일괄처리를 해 버렸으니."
10018100-204 = "맛을 보는 입장에서 그것이 어떻게 느껴졌을지, 두 번 생각할 필요도 없었겠지요."
10018100-205 = "그, 그것은 너희 역시 마찬가지였을 터!"
10018100-207 = "그래서 뒷맛에 차별점을 두려고 노력했죠."
10018100-208 = "생강이나 깨, 실고추 등의 여러 부재료를 사용해서요."
10018100-209 = "그것뿐만이 아니죠. 냐오푸드는 큰 생각 없이 저질 재료를 섞어서 합성 조미료로 보완하려 했죠."
10018100-210 = "하지만 식재료 자체의 품질에서 생겨나는 질적 저하는 피할 수 없습니다."
10018100-212 = "바로 식감이나 목 넘김 같은 문제로요!"
10018100-213 = "같은 표고버섯이라도 사람들은 조금 더 씹는 맛이 있는 쪽을 선호하기 마련이죠!"
10018100-215 = "하지만!"
10018100-216 = "어떻게 400인분이나 되는 양을 그만한 시간에 만들어낼 수 있었단 말인가!"
10018100-218 = "어…… 주리?"
10018100-219 = "우리 급양부가 하루에 만드는 급식이 몇 인분이지?"
10018100-220 = "4천인분이죠, 선배……"
10018100-221 = "그걸 매일같이 만들어야 하는 입장이 되어 보세요……"
10018100-222 = "거기에 맛 검수를 설탕 한 스푼, 간장 한 방울까지 꼼꼼히 해낼 수 있는 저희 미식연구회가 있는 이상!"
10018100-224 = "처음부터 승리는 필연이라고 밖에 할 수 없는 것이었습니다!"
10018100-229 = "정말로 놀라운 결과입니다!"
10018100-230 = "거기에 승리의 비결까지 당당하게 밝히는 용기!"
10018100-231 = "현장이 그야말로 후끈하게 달아오르고 있습니다!"
10018100-235 = "에에이, 인정할 수 없다! 결과가 무어냐. 요리가 다 무엇이냔 말이다!"
10018100-236 = "회, 회장님?!"
10018100-241 = "구르메 헬멧단! 그리고 냐오푸드 예비대! 가라! 녀석들을 혼쭐 내 주는 것이다!"
10018100-248 = "뭐…… 결국 이렇게 되는 건가."
10018100-254 = "일은 일이니까, 너무 원망들은 하지 말라고."
10018100-259 = "원망이라."
10018100-260 = "재미있는 표현을 사용하는군요."
10018100-261 = "어머나★ 이건 또 재미있는 전개네요."
10018100-262 = "왠지 저 아저씨라면 이럴 것 같기도 했지만."
10018100-263 = "와, 우리가 나설 차례인 거네?"
10018100-265 = "다른 의미로 현장이 뜨거워집니다!"
10018100-266 = "냐오푸드, 그리고 키보토스 최악의 테러리스트인 미식연구회의 대결!"
10018100-267 = "채널 고정!"
10018100-268 = "현장에서 계속 생방송으로 보내드립니다!"
