[translation]
10016070-1 = "제7화;협력 2"
10016070-2 = "도, 도대체 뭐야. 이 전차는? 어째서 움직이지 않는 거야!"
10016070-3 = "[s1] \"그야 전차가 아니니까……\"\n[s2] \"엔지니어부가 어제 수리를 하며 전투 기능을 막았나 보네……\""
10016070-4 = "생각보다 시시한 적이었네요. 전력을 다할 필요도 없겠어요."
10016070-5 = "생각보다 시시한 적이었네요. 전력을 사용할 필요도 없겠어요."
10016070-6 = "그렇군요. 큰 문제로 불거지지 않은 건 다행이지만, 이렇게 쉽게 제압되다니. 조금 맥이 빠지네요."
10016070-10 = "으읏…… 대놓고 우리를 바보 취급하다니……!"
10016070-11 = "일단은 후퇴다! 회장 밖으로 나가 주 3일 노동에 찬성하는 동지들을 모아 투쟁을 계속하겠어!"
10016070-16 = "아앗, 거기 서!"
10016070-19 = "안녕하세요, 크로노스 채널의 시청자 여러분! 점심 식사는 다들 맛있게 하셨나요?"
10016070-20 = "개인 대항 종목이 주를 이루었던 오전 경기가 모두 끝난 지금! 학교별 중간 순위를 확인하고 가겠습니다!"
10016070-21 = "대회가 시작한 직후에는 게헨나 학원이 압도적인 격차로 1위를 차지했는데요."
10016070-22 = "현재 순위는 과연……"
10016070-23 = "이럴 수가, 놀랍게도 밀레니엄 사이언스 스쿨이 선두로 치고 올라왔습니다!"
10016070-24 = "밀레니엄 사이언스 스쿨이요? 운동과는 거리가 먼 학원이라, 언제나 대운동회에서 나쁜 성적을 기록했기에 이번에도 좋은 성적을 거두지 못할 거라 생각했는데요."
10016070-25 = "역시 주최교로서의 자존심을 보여주려 하는 걸까요?"
10016070-26 = "하지만 게헨나와 트리니티가 그 뒤를 바짝 뒤쫓고 있으니 방심해서는 안 되겠습니다!"
10016070-27 = "치열한 승부 덕분에 오후에 있을 학원 대항 종목의 결과가 더욱 주목되는데요."
10016070-28 = "이어지는 다음 경기는…… <장애물 이어달리기>입니다!"
10016070-29 = "장애물 이어달리기라면, 장애물을 극복하며 주자가 이어서 달리는 경기인가요?"
10016070-30 = "네. 말씀하신 것처럼 트랙 위에는 선수들의 달리기를 방해하기 위한 장애물이 잔뜩 배치되어 있습니다."
10016070-31 = "'닌자용 마름쇠' 부터 '500엔짜리 동전처럼 보이는 병뚜껑', '<주워가 주세요>라고 적힌 박스에 담긴 고양이 인형'까지……"
10016070-32 = "과연, 그런 게 트랙 위에 있으면 신경이 쓰여서 달리기 어렵겠네요."
10016070-33 = "거기에 더해 이번 장애물 이어달리기에는 특별한 룰이 추가되었습니다."
10016070-34 = "그건 바로…… 배턴 대신 전자식 뇌관을 삽입한 막대형 수류탄을 사용한다는 점입니다!"
10016070-35 = "배턴 대신 수류탄을 주고받는다고요? 그럼 위험하지 않을까요?"
10016070-36 = "네, 하지만 일정 시간 내에 다음 주자에게 인계하면 터지지 않는다고 하네요."
10016070-37 = "하지만 너무 오랜 시간 반환점에 들어오지 못하면 그대로 수류탄이 폭발하면서 탈락합니다!"
10016070-38 = "과연, 특정 선수에게 의존하지 않고 모두가 최선을 다할 수 있도록 배려한 조치군요."
10016070-40 = "그럼 이번 경기에서 행운의 여신이 미소를 보내는 팀은 어느 학원이 될까요?"
10016070-42 = "이번 <장애물 이어달리기>에 아비도스 대표로 참가하는 선수는……"
10016070-43 = "세리카 쨩이랑 호시노 선배, 그리고 시로코 선배네요."
10016070-47 = "으헤~ 긴장되는걸."
10016070-48 = "……응. 맡겨줘."
10016070-49 = "수류탄이니, 버려진 고양이니. 경기 규칙에 뭔가 이상한 게 잔뜩 섞여 있는 것 같지만……"
10016070-50 = "황륜대제의 종합 우승 상금을 타내기 위해서라도 이번 경기에서는 꼭 1등을 따내는 거야!"
10016070-54 = "하하…… 아무리 그래도 저희 같은 군소 학원이 황륜대제의 종합 우승을 차지하는 건 어렵지 않을까요……?"
10016070-55 = "일단은 그래도 최선을 다해 경기에 임해 주세요."
10016070-56 = "저희가 대운동회에서 멋진 활약을 보여준다면 아비도스 학원에 전학 오고 싶어 하는 학생이 늘어날지도 모르니까요."
10016070-57 = "으헤~ 아야네 쨩은 아직도 잘 모르는구나~"
10016070-58 = "대운동회 같은 체육 대회에서 사람들의 시선을 사로잡기 위해선 경기장보다 관중석에서 뛰는 게 더 효과적이라고."
10016070-59 = "……관중석이요?"
10016070-60 = "네, 관중석에서 하는 치어리딩…… 바로 응원전 말이에요!"
10016070-61 = "호시노 선배의 말을 듣고 응원 포즈도 미리 준비해 왔는데……"
10016070-62 = "아자자! 힘내라!"
10016070-63 = "싸워라!"
10016070-64 = "수영복 응원단~ ☆"
10016070-65 = "수영복 응원단은 또 뭐야? 센스 구려!"
10016070-69 = "……음. 응원이라면 나도 준비를 한 게 있지."
10016070-70 = "뭔가 불길한 느낌이……."
10016070-74 = "……60mm 대전차로켓이야."
10016070-76 = "……어째서인가요?!"
10016070-77 = "……위협사격."
10016070-78 = "응원은 아군의 사기를 올리는 것도 중요하지만, 상대의 사기를 꺾는 것도 중요하지."
10016070-79 = "계주가 시작될 때 이 대전차로켓을 들고 레일에 들어서면, 압도적인 화력 차이를 본 상대 팀 선수의 사기가 떨어질 거야."
10016070-80 = "이야~ 괜찮네. 역시 싸움은 기선 제압이지~"
10016070-81 = "후후, 재미있어 보이네요! ☆"
10016070-84 = "그런 게……"
10016070-85 = "그런 게 허락될 리가 없잖아요!"
10016070-87 = "후후…… 이번 장애물 이어달리기에 사용되는 막대 수류탄은 마찰 신관을 사용하는 구형 모델처럼 보이지만, 사실은 손잡이의 자극 센서에 따라 작동하는 최첨단 전기 신관을 사용하고 있지요!"
10016070-88 = "다만 어제 급하게 만든 물건이라, 제대로 동작하는지 아직은 조금 불안하네요……"
10016070-89 = "그렇다면 경기에 직접 참여해서라도 발명품의 성능 테스트를 진행하는 게 [ruby=마이스터]장인의[/ruby] 도리겠지요!"
10016070-90 = "그럼, 우타하 선배. 수류탄의 신관 테스트는 제가 경기 중에 진행할 테니, 그동안 선수들의 응원을 부탁드리겠습니다!"
10016070-94 = "음, 응원은 우리에게 맡겨 두라고!"
10016070-95 = "우으으…… 사실은 내가 직접 경기에 나가서 확인해 보고 싶었는데…"
10016070-96 = "아직도 그렇게 우는소리를 하고 있을 거야, 히비키?"
10016070-97 = "팀의 분위기를 책임지는 응원단이 그런 표정을 짓고 있으면, 선수들도 제 실력을 충분히 낼 수 없다고!"
10016070-98 = "자. 활기찬 표정으로, 힘차게!"
10016070-99 = "나가자! 싸우자! 이기자! 밀레니엄!"
10016070-100 = "미, 밀레니엄……!"
10016070-102 = "하아…… 피곤해……"
10016070-103 = "어젯밤에 이어서 오늘도 계속 이상한 사건에 휘말리는 바람에……"
10016070-104 = "조금이라도 긴장을 풀면 바로 쓰러질 것 같아……"
10016070-105 = "모두 조금만 더 기운을 냅시다. 아직 황륜대제는 끝나지 않았으니까요."
10016070-106 = "지금도 극악무도한 테러리스트가 어디서 흉계를 꾸미고 있을지 알 수 없습니다."
10016070-110 = "그보다 레이더상에 이쪽 트랙으로 다가오는 거대한 물체가 하나 잡혔는데……"
10016070-111 = "이거 괜찮으려나……?"
10016070-113 = "(하아…… 이런 성가셔 보이는 경기에는 출전하고 싶지 않았는데…….)"
10016070-114 = "(하지만 아코가 3위 안에 들기만 해도 황륜대제에서 뭐든지 먹을 수 있는 '만능 식권'을 준다고 했고……)"
10016070-117 = "(일단은 열심히 뛰어볼까……?)"
10016070-125 = "신호와 함께 선수들, 출발합니다!"
10016070-129 = "빠른 속도로 트랙을 질주하는 선수들!"
10016070-133 = "첫 번째 장애물인 마름쇠 트랙을 무사히 극복하고, 두 번째 주자에게 배턴— 아니, 수류탄을 전달합니다!"
10016070-134 = "이어지는 다음 장애물은……"
10016070-135 = "쿠르르르릉—!"
10016070-136 = "어라, 이게 무슨 소리죠?"
10016070-141 = "끄, 끈질긴 녀석들……"
10016070-142 = "따, 따라오지 마!"
10016070-148 = "에엑? 전차?! 어째서 황륜대제에 전차가 있는 거죠?"
10016070-149 = "그건 저희가 설명드리겠습니다!"
10016070-150 = "저 공 모양의 로봇은 저희가 대운동회를 준비하며 만든 응원 로봇이랍니다."
10016070-151 = "어떤 장소든 신속하게 이동할 수 있도록 공기역학적인 구형의 동체와 무한궤도를 사용했죠!"
10016070-152 = "물론 지금은 '사소한 사고'가 있어서 공식적으로 사용하고 있지는 않지만……"
10016070-154 = "저게 어째서 여기에 있는 거지……?"
10016070-155 = "그, 그렇지만 전면에 거대한 기관포가 달려 있는 걸요?"
10016070-156 = "음, 그건 경기장에서 소동이나 테러가 발생했을 때 즉각 진압이 가능하도록 탑재시킨 전투 시스템이야."
10016070-157 = "물론 지금은 작동하지 않도록 손을 봤기 때문에, 눈앞에서 범죄를 저지르거나 강력한 충격이라도 주지 않는 이상 작동하는 일은 없—"
10016070-158 = "푸슈우우—"
10016070-159 = "콰광!"
10016070-160 = "시로코 선배! 그거 쓰지 말라고 했잖아!"
10016070-161 = "응원으로 대전차 로켓을 쏘는 사람이 세상에 어딨어?!"
10016070-162 = "안 되는 건가……."
10016070-163 = "당연히 안 되지!"
10016070-164 = "우와…… 뭔가 비싸 보이는 전차 같은 데 맞았어. 괜찮으려나……."
10016070-166 = "<400mm 이상의 관통력을 지닌 탄두의 폭발을 감지. 전투 시스템을 가동합니다.>"
10016070-167 = "<반경 1km 이내의 불량 학생을 탐지 중……>"
10016070-168 = "<불법 JHP 탄환을 소지한 학생이 3명, 허가되지 않은 사제 체육복을 착용한 학생이 7명, 보행하면서 음식물을 취식하는 학생이 5명……>"
10016070-170 = "……불량 학생을 판단하는 기준이 생각보다 엄격하네요."
10016070-171 = "AI의 머신 러닝에 세미나의 의사 결정 알고리즘을 사용했거든."
10016070-172 = "그 과정에서 '어딘가의 냉혹한 회계'로부터 안 좋은 영향을 받은 걸지도……."
10016070-174 = "<조사 완료. 반경 1km 내의 모든 학생을 '불량 학생'으로 간주합니다.>"
10016070-175 = "<전원— 인수 분해합니다!>"
10016070-176 = "콰광!"
10016070-178 = "자, 잠깐! 저거 뭐야? 어째서 트랙에 전차가 있는 거야?!"
10016070-180 = "방금 그 폭발 때문에 전차가 폭주한 거야?!"
10016070-181 = "아, 정말……! 이게 다 시로코 선배 탓이잖아!"
10016070-183 = "우, 우앗! 통제 불능이에요! 서, 선배! 도와주세요!"
10016070-184 = "<대운동회의 무사 개최를 방해하는 불량 학생들은…… 즉시 배제합니다.>"
10016070-186 = "드디어 모습을 드러냈나, 밀레니엄의 테러리스트들!"
10016070-187 = "이렇게 된 이상 근접해서 수류탄으로 궤도를 끊어내면……"
10016070-191 = "……어라? 수류탄이 작동하지 않—"
10016070-193 = "쾅!"
10016070-194 = "사키 쨩——!"
10016070-196 = "여, 여러분. 보셨습니까?"
10016070-197 = "장애물 이어달리기 트랙에 전차가 난입하여 학생들을 공격하고 있습니다!"
10016070-198 = "평화의 제전인 황륜대제에 저런 무시무시한 살상 병기가 나타나다니……"
10016070-199 = "유례를 찾기 어려운 대형 특종…… 아니, 사건이네요!"
10016070-201 = "유우카, 저 전차는 뭐죠?"
10016070-202 = "<황륜대제>에 저런 전차가 사용되는 경기가 있다는 건 운영 일정 때 소개받지 못했는데요?"
10016070-203 = "나, 나도 저 전차에 대해서는 들은 바가 없다고!"
10016070-204 = "불량 학생들이 처음 들고나왔을 때는 모양만 그럴싸한 모조품이라고 생각했는데……"
10016070-205 = "그렇게 말하는 것 치고는 당신이랑 비슷한 말투로 떠들어 대고 있는걸요."
10016070-206 = "<인수분해 해주겠어—> 라든가, <완벽—> 이라든가……"
10016070-207 = "그런 톤으로 말하진 않았거든?!"
10016070-208 = "그보다 선생님, 도대체 뭔가요. 저 전차는? 어제 대체 무슨 일이 있었던 건가요?!"
10016070-209 = "[s3] \"어, 그게 그러니까……\"\n[s4] \"설명하자면 길어지는데……\""
10016070-212 = "설명은 사태를 수습한 뒤에 해도 늦지 않습니다."
10016070-213 = "마리 씨, 우선 관람객들의 대피 안내를 부탁드리겠습니다."
10016070-214 = "……네, 넵!"
10016070-215 = "그리고 나머지 학생들은 적 전차의 제압을 우선합니다!"
10016070-217 = "그렇게 명령하지 않아도 그럴 생각이었거든요?"
10016070-218 = "정말— 이 일은 나중에 확실히 경위서를 받아내고 말 테니까요!"
