[translation]
10038055-16 = "[ns] \"키사키!\""
10038055-17 = "움직여선 안 된다, 선생!"
10038055-18 = "이곳은…… 위험하다. 그리고 카이 역시도……!"
10038055-19 = "그렇다고는 해도…… 기이할 정도로구나. 스스로의 몸에, 무슨 짓을 한 것인가……!"
10038055-25 = "아아, 지금의 이 몸에는 선단(仙丹)의 효과가 돌고 있어서 말이다."
10038055-26 = "타성에 젖은 채 망설이고 있는 너에게는, 아무래도 버거운 싸움이었겠지?"
10038055-27 = "무슨…… 소리인가……!"
10038055-32 = "그렇지 않은가? 지금도 고민하고 있지?"
10038055-33 = "현무상회와 산해경을 통제하는 것, 월영제에 대한 것, 현룡문과 경극부에 대한 것……."
10038055-34 = "그리고 보다 근본적으로, 산해경의 전통을 지킨다고 겉으로는 표방하면서도."
10038055-39 = "속으로는 완전히, 다른 생각을 품고 있는 것 같은 부분들 말이다?"
10038055-41 = "……?!"
10038055-42 = "쿡쿡쿡. 무슨 소리냐는 표정과, 그것을 어떻게 알았느냐는 표정이 섞여 있구나."
10038055-43 = "무슨 참언을 늘어놓는 것이냐……!"
10038055-45 = "여기에서까지 허세를 늘어놓을 생각인가. 그동안의 네 행동이 너의 마음을 증명하고 있는데도."
10038055-46 = "현룡문, 너희들 역시 마음속으로는 눈치채고 있지 않았는가?"
10038055-55 = "산해경의 전통을 수호한다는 현룡문의 문주가, 마음속 깊은 곳에서는 다른 생각을 품고 있는 것인지도 모른다고 말이다."
10038055-60 = "……!"
10038055-61 = "(역시…… 문주님께서는……?!)"
10038055-62 = "(무슨 소리야! 저런 범죄자의 말에 귀를 기울일 생각이야?!)"
10038055-63 = "(하, 하지만…….)"
10038055-64 = "(…….)"
10038055-68 = "쿡쿡쿡. 하하하하하……!"
10038055-69 = "충성을 바칠 자는, 충성을 바치면 좋다. 의심을 품고 싶은 자는, 그렇게 하면 좋을 것이고."
10038055-70 = "제아무리 위대한 통치자라 해도, 사람의 마음을 어찌할 수는 없는 것 아닌가."
10038055-71 = "이 자리에서 이야기해 주마. 너에게, 나와 같은 일을 겪게 하겠다."
10038055-72 = "뭐라고……?"
10038055-73 = "나와 같이, 산해경 밖으로 추방되는 아픔을 겪게 해 주마."
10038055-74 = "나와 같이, 무소속 학생으로서 겪어야 할 모든 고초를 겪게 해 주마."
10038055-75 = "나와 같이, 어디에도 속할 수 없이 떠돌아야 하는 허무함을 맛보게 해 주마."
10038055-76 = "그것은, 어디까지나……!"
10038055-78 = "네가 날 이렇게 만들었다. 키사키."
10038055-82 = "내, 가……?"
10038055-88 = "그렇다. 다른 누구도 아닌 네가."
10038055-89 = "나로 하여금 독기를 품게 하고, 복수심에 휩싸이게 하고, 원한을 갖게 만든 것도, 모든 것이 네 책임이다."
10038055-90 = "그도 그럴 것이, 그게 문주라는 자리가 아닌가?"
10038055-91 = "……?!"
10038055-92 = "꽃이 지고 홍수가 나고 벼락이 떨어져도 너의 책임이다."
10038055-93 = "모든 책임을 지고 그 어떤 변명도 필요 없는 자리. 그게 바로 산해경의 문주란 자리이지 않느냐."
10038055-94 = "그것은…… 나는……!"
10038055-95 = "어디까지나, 산해경을 위해…… 학생들이 고통받고 있었기에……."
10038055-96 = "그래서, 큰 것을 위해 작은 것을 잘라내었는가?"
10038055-97 = "……!!!"
10038055-98 = "그래. 그거다. 그 얼굴이 보고 싶었다. 어쩌면 이 순간을 위해서 나는 돌아온 것인지도 모르지."
10038055-99 = "보아라, 현룡문. 이것이 너희들의 문주다. 너희들의 산해경이고, 이제는 영락해 버린 과거의 잔재다."
10038055-100 = "과거와 전통을 지키는 것에도 사실은 관심이 없다. 일신의 영달에만 관심이 있었다면 그나마 이해할 수 있는 범부(凡夫)라고 이해할 수도 있겠지."
10038055-101 = "그러나 그 실체는, 문주라는 자리의 의미조차 제대로 이해하지 못하고, 자신이 무엇을 원하는지도 스스로 깨닫지 못한, 아둔한 아이일 뿐이다."
10038055-107 = "……."
10038055-108 = "……!"
10038055-110 = "쿡쿡쿡……. 내가 아는 현룡문은, 스스로 생각하기를 두려워하는 자들이었으나."
10038055-117 = "그럼에도, 스스로 생각할 때가 이제 도래했다."
10038055-118 = "너희의 발로 걷고, 너희의 혀로 답해라. 너희의 손으로 움켜쥐고, 너희의 눈으로 보아라."
10038055-119 = "지금의 산해경에게, 키사키는 필요한가?"
10038055-120 = "또한 지금의 현룡문에게, 키사키는 필요한가?"
10038055-125 = "……!"
10038055-126 = "……!"
10038055-131 = "[ns] \"미나! 레이죠!\""
10038055-135 = "?!"
10038055-136 = "!?"
10038055-137 = "[s] \"이 자리를 피하자! 키사키를 부탁해!\""
10038055-141 = "아, 알겠다. 선생님!"
10038055-142 = "예!"
10038055-164 = "……."
10038055-165 = "흥이 깨졌구나. 앞으로 조금이었는데."
10038055-166 = "……."
10038055-167 = "거기에서 먼저 행동하려 하다니. 샬레의 선생. 내 생각보다는 더 큰 변수로 작용할 수 있는 인물이었군."
10038055-168 = "뭐, 좋다. 이제 와서는 아무래도 상관없는 일."
10038055-169 = "내 목표는 보다 완벽한 선단(仙丹)을 만드는 것이니, 다른 일은 어떻게 되든 신경 쓸 바가 아니지."
10038055-173 = "쿡쿡쿡……. 그러면 다시, 모든 것을 시작해 볼까."
10038055-174 = "이번에야말로, 누구에게도 방해받지 않고, 대업을 이룩하도록 하겠다."
