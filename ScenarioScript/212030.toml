212030-6 = "..."
212030-9 = "มาเริ่มสงครามศักดิ์สิทธิ์เพื่อแก้ไขคิโวทอสอันบิดเบี้ยว และสถาปนาระเบียบที่แท้จริงในนามของเกเฮนน่ากันเถอะ"
212030-10 = ""
212030-12 = ""
212030-15 = "..."
212030-16 = "..."
212030-17 = "..."
212030-18 = "อ่า สับสนไปหมดแล้วเลย"
212030-19 = "ก็นั่นน่ะสินะ"
212030-20 = "ไม่รู้เลยว่าเรื่องมันเป็นมายังไงกันแน่..."
212030-21 = "แต่ถ้ามองอีกมุม นี่ก็เหมือนภาพที่พวกเราเฝ้าหวังไว้ไม่ใช่เหรอ?"
212030-22 = "หืม?"
212030-23 = "ก็เกเฮนน่าที่รวมเป็นหนึ่งเดียวยังไงล่ะ"
212030-24 = "ความขัดแย้งระหว่างประธานแพนเดโมเนียม โซไซตี้กับประธานกรรมการวินัยเป็นหนึ่งในปัญหาใหญ่#nที่สุดของเกเฮนน่า และตอนนี้ปัญหานั้นก็คลี่คลายแล้วนี่นา"
212030-25 = "ก็... จริงอยู่ มันก็ชวนอึ้งอยู่หรอก"
212030-26 = "แต่ดูเหมือนทิศทางที่รวมใจกันจะผิดไปหน่อยนะ..."
212030-27 = "สงคราม..."
212030-29 = "..."
212030-31 = "แต่เรื่องสงคราม อาจจะแค่พูดไปอย่างนั้นหรือเปล่า?"
212030-32 = "ก็แบบนั้นไง โยนปัญหาออกไปข้างนอกเพื่อสร้างความเป็นปึกแผ่นภายใน..."
212030-33 = "แต่ถ้าเป็นแค่แบบนั้น ก็ถือว่าจริงจังกันมากเลยนะ..."
212030-34 = "โธ่ คงไม่ใช่เรื่องจริงหรอก สงครามก็ไม่ใช่สิ่งที่จะเกิดขึ้นง่ายๆ ตั้งแต่แรกอยู่แล้วนี่?"
212030-36 = "ก็ไม่มีเหตุผลว่าทำไมสงครามถึงจะเกิดขึ้นไม่ได้เหมือนกันนะคะ"
212030-37 = ""
212030-40 = ""
212030-41 = "หืม?"
212030-42 = "หมายความว่ายังไงเหรอ โชโกะจัง?"
212030-44 = "ก็หมายความตามที่พูดค่ะ"
212030-45 = "วิธีที่ดีที่สุดในการรวมเกเฮนน่าให้เป็นหนึ่งเดียว ก็คือการสร้างศัตรูร่วมให้กับพวกเราทุกคนค่ะ"
212030-46 = "แต่ถ้าศัตรูนั่นคือทั้งคิโวทอส สเกลมันไม่ใหญ่เกินไปหน่อยเหรอ?"
212030-47 = "คิโวทอสมองเกเฮนน่าว่าเป็นกลุ่มของเด็กเจ้าปัญหา และกดขี่พวกเรามาโดยตลอดค่ะ"
212030-48 = "เพื่อให้คนพวกนั้นยอมรับพวกเรา ก็คงจำเป็นต้องใช้อำนาจอันเหนือชั้นค่ะ"
212030-49 = "เพราะงั้นสงครามของพวกเราจึงชอบธรรม และยังถือเป็นการตอบสนองต่อทัศนคติที่พวกเขามีต่อ#nพวกเราด้วยค่ะ"
212030-50 = "งะ... งั้นเหรอ...?"
212030-51 = "ถ้าไม่มีการต่อสู้ ก็ไม่อาจยิ่งใหญ่ได้ค่ะ"
212030-53 = "สงครามเหรอ..."
212030-55 = "สงคราม... ฉันไม่เคยคิดถึงเรื่องนี้อย่างจริงจังสักครั้งเลย..."
212030-56 = "ที่จริงแล้ว มันก็ไม่ได้แตกต่างจากสิ่งที่ทำกันมาจนถึงตอนนี้มากนักค่ะ"
212030-57 = "ถ้าคิดว่า <ทริกเกอร์ แฮปปี้ โซน> ขยายไปทั่วทั้งคิโวทอสก็คงเข้าใจได้ง่ายค่ะ"
212030-58 = "ทริกเกอร์ แฮปปี้ โซนงั้นเหรอ?"
212030-59 = "ค่ะ ยิง ระเบิด และทำลายไปตามเสียงสั่งการ"
212030-60 = "ทั้งอาคารหลักของทรีนิตี้ หอคอยมิลเลเนียม และต้นไม้ศักดิ์สิทธิ์แห่งเฮียกคิยาโค"
212030-61 = "เพียงเท่านั้นก็พอค่ะ"
212030-63 = "แต่ถ้าเป็นสงคราม ก็ต้องมีคนที่ต่อสู้กับพวกเราด้วยสิ"
212030-64 = "มันคงแตกต่างจากการทำลายฉากที่อยู่นิ่งๆ มากเลยนะ?"
212030-65 = "นั่นสิ โรงเรียนอื่นก็น่าจะแข็งแกร่งพอตัวเลยด้วย"
212030-66 = "ต่อให้พวกเรารวมเป็นหนึ่งเดียวกันแล้วก็เถอะ..."
212030-68 = "เป็นไปได้ค่ะ"
212030-69 = ""
212030-71 = ""
212030-72 = ""
212030-74 = ""
212030-75 = "จำคำที่หัวหน้าเคยพูดได้ใช่มั้ยคะ? ว่าทุกสิ่งที่พวกเราทำมาล้วนมีความหมาย"
212030-76 = "อ๊ะ... อื้ม ฉันเคยพูดแบบนั้นอยู่"
212030-77 = "กิจกรรมที่พวกเราทำมาตลอด ทำให้นักเรียนเกเฮนน่าส่วนใหญ่สามารถเดินรักษารูปขบวนได้"
212030-81 = ""
212030-82 = "การที่ทุกคนก้าวไปพร้อมๆ กันแบบนี้ก็สนุกไปอีกแบบนะ"
212030-83 = "ใช่ ตอนแรกฉันก็รู้สึกอึดอัดอยู่หรอก แต่ตอนนี้เผลอก้าวตามจังหวะโดยไม่รู้ตัวเลย"
212030-84 = ""
212030-86 = ""
212030-87 = ""
212030-89 = "นักเรียนเกเฮนน่าส่วนใหญ่สามารถปฏิบัติการเชิงยุทธวิธีได้ค่ะ"
212030-93 = ""
212030-94 = "มีทุ่นระเบิดเคลย์มอร์อยู่ข้างหน้า เคลื่อนที่หลบหลีก! เริ่มยิงจากทางขวา!"
212030-95 = ""
212030-98 = ""
212030-101 = "ตรวจพบหุ่นรูปสไนเปอร์บนอาคาร!"
212030-102 = "เอาปืนยิงระเบิดมาเป่าชั้น 2 ให้กระจุย! ยิงโดนเจ้านั่นได้โบนัสเพิ่ม 200 แต้ม!"
212030-103 = ""
212030-107 = ""
212030-108 = ""
