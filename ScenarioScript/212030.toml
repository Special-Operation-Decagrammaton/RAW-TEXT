212030-9 = "為了導正扭曲的奇普托斯──#n以格黑娜之名建立真正的秩序，開始這場聖戰吧。"
212030-10 = ""
212030-12 = ""
212030-15 = "……"
212030-16 = "……"
212030-17 = "……"
212030-18 = "啊，腦子一團亂。"
212030-19 = "就是說啊。"
212030-20 = "雖然完全搞不懂到底是怎麼一回事……"
212030-21 = "不過換個角度想，這好像就是我們期望的樣子耶？"
212030-22 = "嗯？"
212030-23 = "你想嘛，這就是團結一心的格黑娜啊。"
212030-24 = "萬魔殿議長和風紀委員長，這兩人的不和是格黑娜最大的問題之一。#n現在那個問題解決了啊。"
212030-25 = "嗯……那倒是沒錯啦。雖然有點讓人不知所措。"
212030-26 = "不過團結的方向好像有點不對就是了……"
212030-27 = "戰爭……"
212030-29 = "……"
212030-31 = "不過戰爭會不會只是說說而已？"
212030-32 = "你想想，不是有那種事嗎？#n為了鞏固內部的團結，把矛頭轉向外部之類的……"
212030-33 = "如果只是說說，看起來也太認真了……"
212030-34 = "哎唷，怎麼可能是真的。#n說到底，戰爭本來就不可能那麼輕易發生吧？"
212030-36 = "不過，戰爭也沒有不能發生的理由。"
212030-37 = ""
212030-40 = ""
212030-41 = "嗯？"
212030-42 = "那是什麼意思，翔子醬？"
212030-44 = "就是字面上的意思。"
212030-45 = "讓格黑娜團結一心的最好方法，就是為我們所有人製造共同的敵人。"
212030-46 = "可是如果那個敵人是整個奇普托斯，規模會不會太大了點？"
212030-47 = "奇普托斯一直都把格黑娜當成問題學生集團來打壓。"
212030-48 = "要讓那樣的他們認同我們，就需要壓倒性的力量吧。"
212030-49 = "因此我認為我們的戰爭具有正當性，同時也是對他們看法的一種回應。"
212030-50 = "是，是這樣嗎……？"
212030-51 = "不經過鬥爭，就無法變得偉大。"
212030-53 = "戰爭啊……"
212030-55 = "戰爭……我從來沒有認真想過……"
212030-56 = "其實這跟之前沒什麼太大的不同。"
212030-57 = "只要想成是「Trigger Happy Zone」擴大到整個奇普托斯就好了。"
212030-58 = "Trigger Happy Zone？"
212030-59 = "是的。配合口號射擊、引爆、破壞。"
212030-60 = "三一的本館、千年巨塔、百鬼夜行的神木。"
212030-61 = "這樣就夠了。"
212030-63 = "可是既然是戰爭，應該也會有人跟我們對打吧？"
212030-64 = "那跟單純破壞不會動的背景，應該差很多吧？"
212030-65 = "就是說啊。其他學園應該也相當強吧。"
212030-66 = "就算我們再怎麼團結一心……"
212030-68 = "做得到。"
212030-69 = ""
212030-71 = ""
212030-72 = ""
212030-74 = ""
212030-75 = "還記得委員長說過的話吧？#n我們所有的行動都是有意義的。"
212030-76 = "啊……嗯。是說過那種話呢。"
212030-77 = "多虧了我們至今的活動，格黑娜大部分的學生都能保持隊列行走……"
212030-81 = ""
212030-82 = "像這樣大家一起步調一致地行動，其實也挺有趣的。"
212030-83 = "沒錯。一開始還覺得很彆扭，現在不知不覺就會跟上步伐了。"
212030-84 = ""
212030-86 = ""
212030-87 = ""
212030-89 = "格黑娜大部分的學生都能採取戰術行動。"
212030-93 = ""
212030-94 = "前方有闊刀地雷，閃避後再移動！#n從右側開始射擊！"
212030-95 = ""
212030-98 = ""
212030-101 = "確認建築物上方有狙擊手造型的人偶！"
212030-102 = "拿榴彈發射器來，把2樓轟掉！聽說打中那個能加200分！"
212030-103 = ""
212030-107 = ""
212030-108 = ""
212030-110 = ""
212030-116 = ""
212030-117 = "那，那只是為了讓大家更好紓壓而已……"
212030-118 = "是誰讓事情變成這樣的呢？"
212030-119 = ""
212030-121 = ""
212030-123 = "是我們。是我。是你。"
212030-124 = "是我們讓格黑娜變成這樣的。"
212030-125 = "是我們……讓它變成這樣的……？"
212030-126 = "我們……？"
212030-127 = "是的。"
212030-128 = "不是別人，正是我們。"
212030-129 = "……"
212030-130 = "所以我們所做的一切都是有意義的。"
212030-131 = "……"
212030-132 = "為了導正扭曲的奇普托斯，以格黑娜之名建立真正秩序的聖戰即將開始。"
212030-133 = "我們將回到從前那個恐懼的象徵，任何學園都不敢輕視的格黑娜。"
212030-134 = ""
212030-136 = ""
212030-137 = "格黑娜將成為唯一的標準與規則。"
212030-138 = "舊日夢想實現的瞬間，又近了一步……"
212030-139 = ""
212030-141 = ""
212030-143 = ""
212030-146 = ""
212030-147 = "啊，你就是五十嵐翔子沒錯吧？"
212030-148 = ""
212030-150 = ""
212030-151 = "找我有事嗎？"
212030-152 = "真琴議長找你過去。他在萬魔殿作戰會議室等你。"
212030-153 = "知道了。我馬上過去。"
212030-154 = ""
212030-156 = ""
212030-157 = "那麼兩位，我先走了。"
212030-159 = "啊，嗯。路上小心，翔子……雖然不知道是什麼事。"
212030-160 = "……慢走。"
212030-161 = ""
212030-164 = ""
212030-165 = ""
212030-166 = "這麼說來，我也好久沒見到你們了呢。"
212030-167 = ""
212030-170 = ""
212030-171 = "咦……"
212030-172 = "啊，你不就是那時候那個前輩嗎？#n跟我們說過以前格黑娜的事……"
212030-174 = "終於變成這樣了！怎麼樣？心情很好吧？"
212030-175 = "咦？什麼……？"
212030-176 = "格黑娜現在決定要完全找回過去的樣子了啊！"
212030-177 = "這不正是你們夢寐以求的樣子嗎？"
212030-178 = "呃……那就是過去的樣子……？"
212030-179 = "沒錯！就是以恐懼君臨天下的那個時代！#n跟偉大的往昔一模一樣啊！"
212030-180 = "可，可是前輩不是說過去的格黑娜不怎麼好嗎？"
212030-182 = "明明說過不想回到那時候，為什麼現在這麼開心？"
212030-184 = "啊，那件事就忘了吧。#n是我太傻，說錯話了。"
212030-185 = "……"
212030-186 = "你想想看。以前的格黑娜，就像你們夢想的那樣，是由秩序與控制所支配的地方。"
212030-187 = "大家同心朝著同一個目標前進，不需要思考其他麻煩又複雜的事，#n真的是很偉大的地方。"
212030-188 = "……"
212030-189 = "當時沒能做到的事，現在好像終於要實現了。"
212030-190 = "要對整個奇普托斯開戰！哈哈，多痛快啊！"
212030-191 = "格黑娜終於回來了。那個從前偉大又可怕的格黑娜。"
212030-192 = ""
212030-194 = ""
212030-196 = ""
212030-197 = "前輩好像……和以前見到的時候差很多耶……？"
212030-198 = "……你真的沒事嗎，前輩？"
212030-200 = "當然！非常非常好，好得不得了！"
212030-201 = "以前的我只是喜歡那種不用負責任的自由，完全沒想過要回到過去。"
212030-202 = "但我現在終於明白了。#n回想起來，真是又丟臉又難過。"
212030-203 = "好了，那我也該回去了。"
212030-204 = "你們也好好準備吧。#n能參加聖戰可是非常光榮的事。"
212030-205 = ""
212030-207 = ""
212030-209 = ""
212030-210 = "……怎麼回事？"
212030-211 = "上次明明還說不要對過去抱有幻想的。"
212030-212 = "……就是說啊。"
212030-213 = "……"
212030-217 = "下一話;合而為一的格黑娜"
