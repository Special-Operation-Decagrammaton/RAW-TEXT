[translation]
212030-1 = "第3話;ゲヘナ再興委員会の反応"
212030-3 = ""
212030-4 = "……。"
212030-5 = "……。"
212030-6 = "……。"
212030-9 = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる――戦いの始まりだ。"
212030-10 = ""
212030-12 = ""
212030-15 = "……。"
212030-16 = "……。"
212030-17 = "……。"
212030-18 = "ダメだー、ぜんっぜん分かんない。"
212030-19 = "それなー。"
212030-20 = "でも……何が何だかさっぱりだけどさ……。"
212030-21 = "私たちが望んでたことだったりしない？"
212030-22 = "え？"
212030-23 = "だって、ゲヘナがまとまろうとしてるじゃん。"
212030-24 = "万魔殿の議長と風紀委員長が対立してるのって、大きな問題だったわけだし。#nそれが解消されたんだよ。"
212030-25 = "まあ、それはそうだけど……いいの？ほんとに。"
212030-26 = "んー、こういうのはなんか違う気がするんだよね……。"
212030-27 = "攻め込む、って……。"
212030-29 = "……。"
212030-31 = "言葉の綾だったりしないかな……？"
212030-32 = "ほら、あるじゃん？#n大きな敵と戦うために、これまでのライバルと手を組む～みたいな。"
212030-33 = "それにしては本気っぽかったけど……いやいや、まさかね。"
212030-34 = "そもそも、そんな簡単にできることでもないし。"
212030-36 = "ですが、攻め込んではいけない理由もありません。"
212030-37 = ""
212030-40 = ""
212030-41 = "んん？"
212030-42 = "どういう意味？"
212030-44 = "言葉通りです。"
212030-45 = "ゲヘナをまとめる最善の方法。それは、共通の敵を作ることです。"
212030-46 = "でも、その相手がキヴォトスってのはやりすぎじゃない？"
212030-47 = "そうは思いません。#nこれまで、ゲヘナを問題児集団だと見なして抑えつけてきたのは誰ですか？"
212030-48 = "キヴォトスです。ゲヘナを認めさせるには、圧倒的な力が必要でしょう。"
212030-49 = "ですから、これはゲヘナの正当な権利であり、キヴォトスからの認識に対する応答であると考えています。"
212030-50 = "そうかなぁ……？"
212030-51 = "動かなければ、偉大さは得られません。"
212030-53 = "それで……攻撃、か……。"
212030-55 = "こういうの、真面目に考えたことなかったな……。"
212030-56 = "といっても、今までと大きく変わることはありません。"
212030-57 = "「トリガー・ハッピー・ゾーン」がキヴォトスに広がる。その程度の違いです。"
212030-58 = "どういうこと？"
212030-59 = "号令に合わせて撃ち、爆破し、破壊する。"
212030-60 = "その対象が、トリニティの本館、ミレニアムタワー、百鬼夜行の神木などに変わるだけ。"
212030-61 = "それで十分です。"
212030-63 = "でも、反撃してくるよね？"
212030-64 = "壊されるための標的とはだいぶ違う気がするけど。"
212030-65 = "そうそう。他の学園だって、かなり強いだろうし。"
212030-66 = "いくら私たちがひとつになったって――"
212030-68 = "可能です。"
212030-69 = ""
212030-71 = ""
212030-72 = ""
212030-74 = ""
212030-75 = "委員長も言っていたじゃないですか。私たちのあらゆる行動には意味があったと。"
212030-76 = "あ……うん。そんなこと言ったね。"
212030-77 = "私たちの活動によって、今やゲヘナの大多数の生徒が隊列を維持して歩けますし――"
212030-81 = ""
212030-82 = "みんなで一緒に動くのも、意外と楽しいよね。"
212030-83 = "分かる！やってると癖になるって言うか。"
212030-84 = ""
212030-86 = ""
212030-87 = ""
212030-89 = "戦術的な行動を取れるようになっています。"
212030-93 = ""
212030-94 = "前方にクレイモア！回避して右側から射撃開始！"
212030-95 = ""
212030-98 = ""
212030-101 = "建物の上に狙撃手を確認！"
212030-102 = "グレネードランチャー持ってきて！2階ごと吹っ飛ばすよ！#nあれを落とせば200ポイントだって！"
212030-103 = ""
212030-107 = ""
212030-108 = ""
212030-110 = ""
212030-116 = ""
212030-117 = "そ、それはストレスを発散させるためで……。"
212030-118 = "それを作り上げたのは誰でしょうか。"
212030-119 = ""
212030-121 = ""
212030-123 = "私たちが。私が。貴女が。"
212030-124 = "ゲヘナを作り替えたんです。"
212030-125 = "私、たちが……？"
212030-126 = "作り替えた……？"
212030-127 = "ええ。"
212030-128 = "他の誰でもない、私たちが。"
212030-129 = "……。"
212030-130 = "私たちがしてきたことには全て意味があったんです。"
212030-131 = "……。"
212030-132 = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる戦いが始まります。"
212030-133 = "かつてのように、恐怖の象徴――どの学園も軽々しく見上げられなかったゲヘナへと戻るんです。"
212030-134 = ""
212030-136 = ""
212030-137 = "ゲヘナが世界の基準となり、唯一の規則となる。"
212030-138 = "旧き夢が叶う瞬間に、また一歩……。"
212030-139 = ""
212030-141 = ""
212030-143 = ""
212030-146 = ""
212030-147 = "君が[ruby=いがらし]五十嵐[/ruby]ショウコだね？"
212030-148 = ""
212030-150 = ""
212030-151 = "何かご用ですか？"
212030-152 = "マコト議長から呼び出しだよ。万魔殿の作戦会議室に来てほしい。"
212030-153 = "承知しました。"
212030-154 = ""
212030-156 = ""
212030-157 = "それでは、行ってまいります。"
212030-159 = "あ、うん。頑張ってね。……何の用か分かんないけど。"
212030-160 = "いってらっしゃ～い。"
212030-161 = ""
212030-164 = ""
212030-165 = ""
212030-166 = "そういえば、君たちも一緒なんだったね。"
212030-167 = ""
212030-170 = ""
212030-171 = "あ、えっと……。"
212030-172 = "あの時のセンパイじゃん？#n昔のゲヘナのこと話してくれた――"
212030-174 = "ついに成就するんだよ！どうかな。君たちも嬉しいだろ？"
212030-175 = "えっ？何が……？"
212030-176 = "ついにゲヘナが過去の姿を取り戻すんだよ！"
212030-177 = "君たちもそれを夢見ていたんだろう？"
212030-178 = "え……昔の、ゲヘナ……？"
212030-179 = "そう！恐怖で君臨していたあの時代！偉大だったゲヘナさ！"
212030-180 = "で、でも、あんまり良くなかったって言ってたよね？"
212030-182 = "戻りたくないって言ってたのに、何でそんな嬉しそうなの？"
212030-184 = "ああ、それは忘れてくれ。私が間違ってたんだ。"
212030-185 = "……。"
212030-186 = "昔のゲヘナは秩序と統制で支配されていた。まさに、君たちが夢見た通りに。"
212030-187 = "みんな同じ心で、一つの目的だけを目指して動いていた。#n面倒で複雑なことなんて考えなくていい、偉大な学園だったのさ。"
212030-188 = "……。"
212030-189 = "あの時は果たせなかったことが、ようやく実現しようとしてるんだ。"
212030-190 = "キヴォトスに攻撃を仕掛ける！こんなに痛快なことがあるか？"
212030-191 = "ついにゲヘナが戻ってくるんだ。昔の、偉大で恐ろしかったゲヘナが。"
212030-192 = ""
212030-194 = ""
212030-196 = ""
212030-197 = "なんか……前とキャラ違くない……？"
212030-198 = "先輩、大丈夫？"
212030-200 = "もちろん。最高な気分だよ！"
212030-201 = "この前まではさ、無責任な自由が好きで、昔に戻りたいなんて考えもしなかった。"
212030-202 = "でも、ようやく気づいたんだ。"
212030-203 = "じゃあ、私はこれで戻るよ。"
212030-204 = "君たちもせいぜい頑張りなよ。#nこの戦いに参加できること自体、本当に光栄なことなんだから。"
212030-205 = ""
212030-207 = ""
212030-209 = ""
212030-210 = "……ねぇ。"
212030-211 = "あの先輩、過去に幻想を抱くなって言ってたよね？"
212030-212 = "……だね。"
212030-213 = "……。"
212030-217 = "次回;一つになったゲヘナ"
