212030-116 = ""
212030-117 = "ระ... เรื่องนั้นก็แค่ทำให้ระบายความเครียดได้ดีขึ้นเท่านั้นเอง..."
212030-118 = "ใครกันล่ะคะที่ทำให้พวกเขากลายเป็นแบบนั้น?"
212030-119 = ""
212030-121 = ""
212030-123 = "พวกเรา ฉัน แล้วก็คุณ"
212030-124 = "พวกเราสร้างเกเฮนน่าให้กลายเป็นแบบนั้นค่ะ"
212030-125 = "พวกเรา... เป็นคนทำให้เป็นแบบนั้นเหรอ...?"
