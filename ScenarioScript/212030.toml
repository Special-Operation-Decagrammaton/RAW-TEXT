[translation]
212030-1 = "제3화;재흥위원회의 반응"
212030-4 = "……."
212030-5 = "……."
212030-6 = "……."
212030-9 = "뒤틀린 키보토스를 바로잡고, 게헨나의 이름 아래 진정한 질서를 세우기 위한 성전을 시작하지."
212030-15 = "……."
212030-16 = "……."
212030-17 = "……."
212030-18 = "아, 정신이 하나도 없네."
212030-19 = "그러니까 말야."
212030-20 = "대체 뭐가 어떻게 돌아가는 건진 모르겠지만……"
212030-21 = "어떻게 보면 이거, 우리가 바라던 모습인 것 같긴 한데?"
212030-22 = "응?"
212030-23 = "그러니까, 하나 된 게헨나잖아."
212030-24 = "만마전 의장과 선도부장, 이 둘의 반목이 게헨나에 있어 가장 큰 문제 중 하나였는데 그게 해결된 거니까."
212030-25 = "뭐…… 그건 맞지. 좀 당황스럽긴 하지만."
212030-26 = "……뭔가 뭉치는 방향이 잘못된 것 같긴 하지만……."
212030-27 = "전쟁……."
212030-29 = "……."
212030-31 = "그런데 전쟁은 그냥 하는 말 아닐까?"
212030-32 = "왜, 그런 거 있잖아. 내부 결속을 다지기 위해 외부로 문제를 돌리는……."
212030-33 = "그런 것치고는 엄청 진지해 보이긴 했는데……."
212030-34 = "에이, 설마 진짜일라고. 애초에 전쟁이 그렇게 쉽게 일어날 리도 없잖아?"
212030-36 = "뭐, 전쟁이 일어나면 안 되는 이유도 없으니까요."
212030-41 = "으응?"
212030-42 = "그건 무슨 말이야, 쇼코 쨩?"
212030-44 = "말 그대로입니다."
212030-45 = "게헨나를 하나로 뭉치게 하는 가장 좋은 방법. 그것은 우리 모두에게 공동의 적을 만드는 거죠."
212030-46 = "그런데 그게 키보토스 전체라고 하면, 좀 스케일이 너무 크지 않아?"
212030-47 = "키보토스는 늘 게헨나를 문제아 집단이라며 억압해 왔습니다."
212030-48 = "그런 그들이 우리를 인정하기 위해서는 압도적인 힘이 필요하겠죠."
212030-49 = "따라서 우리의 전쟁은 정당하며, 그들의 인식에 대한 응답이라고도 생각합니다."
212030-50 = "그, 그런가……?"
212030-51 = "투쟁 없이 위대해질 수는 없습니다."
212030-53 = "……전쟁이라……."
212030-55 = "전쟁…… 한 번도 진지하게 생각해 본 적이 없었는데……."
212030-56 = "사실, 지금까지와 크게 다를 것은 없습니다."
212030-57 = "<트리거 해피 존>이 키보토스 전역으로 확대되었다고 생각하면 쉽겠죠."
212030-58 = "트리거 해피 존이?"
212030-59 = "네. 구호에 맞춰 쏘고, 터뜨리고, 파괴한다."
212030-60 = "트리니티의 본관을, 밀레니엄 타워를, 백귀야행의 신목을."
212030-61 = "그거면 충분합니다."
212030-63 = "그런데 전쟁이라고 하면 우리와 싸우는 사람들도 있을 거 아냐."
212030-64 = "그냥 움직이지 않는 배경을 파괴하는 거랑은 많이 다를 것 같은데?"
212030-65 = "그러게. 다른 학원들도 꽤 강할 텐데."
212030-66 = "우리가 아무리 하나로 뭉쳤다고 해도……."
212030-68 = "가능합니다."
212030-75 = "회장이 한 말씀, 기억나시지요? 우리의 그 모든 행동이 의미가 있었다고."
212030-76 = "아…… 으응. 그런 말을 했었지."
212030-77 = "그간 우리의 활동으로 인해 게헨나 대부분의 학생들이 대열을 유지해서 걸을 수 있고,"
212030-82 = "이렇게 다 같이 발맞춰 움직이는 것도 나름 재미있다니까."
212030-83 = "맞아. 처음에는 불편했는데, 지금은 나도 모르게 발을 맞추게 돼."
212030-89 = "게헨나 대부분의 학생들이 전술적인 행동이 가능합니다."
212030-94 = "전방에 크레모아가 있다고 했으니 회피해서 기동하자! 우측부터 사격 개시!"
212030-101 = "건물 위에 저격수 모양 인형 확인!"
212030-102 = "2층 날려버리게 유탄발사기 가져와! 저거 맞추면 200포인트 가산이래!"
212030-117 = "그, 그건 그냥 스트레스를 더 잘 풀기 위해서였는……."
212030-118 = "누가 그렇게 만들었을까요?"
212030-123 = "우리가. 내가. 당신이."
212030-124 = "게헨나를 그렇게 만들었습니다."
212030-125 = "……우리가…… 그렇게 만들었다고……?"
212030-126 = "우리가……?"
212030-127 = "네."
212030-128 = "다른 누구도 아닌, 우리가요."
212030-129 = "……."
212030-130 = "그러니, 우리가 했던 모든 행동이 의미가 있었습니다."
212030-131 = "……."
212030-132 = "뒤틀린 키보토스를 바로잡고, 게헨나의 이름 아래 진정한 질서를 세우기 위한 성전이 시작될 겁니다."
212030-133 = "예전처럼 공포의 상징, 그 어떤 학원도 감히 함부로 바라보지 못했던 게헨나로 돌아가는 겁니다."
212030-137 = "게헨나가 유일한 기준이자 규칙이 된다."
212030-138 = "옛 꿈이 이루어지는 순간, 앞으로 한 걸음……."
212030-147 = "아, 네가 이가라시 쇼코 맞지?"
212030-151 = "저를 찾으셨습니까?"
212030-152 = "마코토 의장님의 호출이야. 만마전 작전회의실에서 기다리고 계셔."
212030-153 = "알겠습니다. 지금 바로 가도록 하죠."
212030-157 = "그럼 두 분, 다녀오겠습니다."
212030-159 = "아, 으응. 잘 다녀와, 쇼코…… 무슨 일인지는 모르겠지만."
212030-160 = "……다녀와."
212030-166 = "그러고 보니 너희도 오랜만이네."
212030-171 = "어……."
212030-172 = "아, 그때 그 선배잖아? 옛날 게헨나에 대해 말해줬던……."
212030-174 = "드디어 이렇게 되었네! 어때? 기분 좋지 않아?"
212030-175 = "엣? 어떤……?"
212030-176 = "게헨나가 이제 완전히 과거의 모습을 되찾기로 했잖아!"
212030-177 = "너희가 꿈꾸던 바로 그 모습 아니야?"
212030-178 = "어…… 그게 과거의 모습이라고……?"
212030-179 = "그래! 공포로 군림하던 그 시절! 위대했던 옛날의 모습 그대로 말이야!"
212030-180 = "그, 그런데 선배는 과거의 게헨나가 별로 좋지 않다고 했잖아?"
212030-182 = "그때로 돌아가고 싶지 않다고 했으면서, 왜 이렇게 좋아하는 거야?"
212030-184 = "아, 그건 잊어버려. 내가 바보였어. 잘못 말한 거야."
212030-185 = "……."
212030-186 = "생각해 봐. 예전의 게헨나는 너희가 꿈꾸는 것처럼 질서와 통제로 지배되는 곳이었어."
212030-187 = "모두가 하나의 마음으로 하나의 목적만을 향해 움직였고, 다른 귀찮고 복잡한 건 생각할 필요 없었던 실로 위대한 곳이었지."
212030-188 = "……."
212030-189 = "아무튼 그때 하지 못했던 일들이 이제서야 이루어지려나 봐."
212030-190 = "전 키보토스를 대상으로 전쟁이라니! 하하, 얼마나 통쾌해?"
212030-191 = "드디어 게헨나가 돌아온 거야. 예전의 위대하고 공포스러운 게헨나가."
212030-197 = "선배…… 뭔가…… 예전에 봤던 때랑 많이 달라진 것 같은데……?"
212030-198 = "……괜찮은 거 맞아, 선배?"
212030-200 = "당연하지! 아주 아주 괜찮고 좋아!"
212030-201 = "예전의 나는 그저 무책임하게 주어진 자유가 좋아서, 다시 예전으로 돌아간다는 생각은 전혀 하지 않았거든."
212030-202 = "하지만 이제야 깨달았단 말이야. 지금 생각해 보면 너무 부끄럽고 속상한 일이지."
212030-203 = "자, 그럼 나도 이만 돌아가야겠다."
212030-204 = "너희도 열심히 준비하고 있어. 성전에 참여할 수 있다는 건 정말 영광스러운 일이거든."
212030-210 = "……뭐지?"
212030-211 = "분명 저번에는 옛날에 대해 환상을 갖지 말라고 했었는데."
212030-212 = "……그러게."
212030-213 = "……."
212030-217 = "다음화;하나 된 게헨나"
