212030-127 = "ค่ะ"
212030-128 = "ไม่ใช่ใครอื่น พวกเรานี่แหละค่ะ"
212030-129 = "..."
212030-130 = "ก็เพราะอย่างนั้น ทุกสิ่งที่พวกเราทำมาจึงล้วนมีความหมายค่ะ"
212030-131 = "..."
212030-132 = "สงครามศักดิ์สิทธิ์เพื่อแก้ไขคิโวทอสอันบิดเบี้ยว และสถาปนาระเบียบที่แท้จริงในนามของเกเฮนน่า#nกำลังจะเริ่มขึ้นค่ะ"
212030-133 = "พวกเราจะทำให้เกเฮนน่ากลับไปเป็นดั่งเช่นในอดีต เป็นสัญลักษณ์แห่งความหวาดกลัว#nที่ไม่มีโรงเรียนใดกล้าแม้แต่จะมองอย่างลบหลู่"
212030-134 = ""
212030-136 = ""
212030-137 = "เกเฮนน่าจะกลายเป็นมาตรฐานและกฎเกณฑ์เพียงหนึ่งเดียว"
212030-138 = "อีกหนึ่งก้าว... สู่ช่วงเวลาที่ความฝันในอดีตจะเป็นจริง"
212030-139 = ""
212030-141 = ""
212030-143 = ""
212030-146 = ""
212030-147 = "อ๊ะ เธอคืออิการาชิ โชโกะใช่มั้ย?"
212030-148 = ""
212030-150 = ""
212030-151 = "กำลังตามหาฉันอยู่เหรอคะ?"
212030-152 = "ท่านประธานมาโคโตะเรียกตัวน่ะ กำลังรออยู่ที่ห้องประชุมปฏิบัติการของแพนเดโมเนียม โซไซตี้"
212030-153 = "เข้าใจแล้วค่ะ ฉันจะไปเดี๋ยวนี้"
212030-154 = ""
212030-156 = ""
212030-157 = "ถ้างั้นทั้งสองคน ฉันไปก่อนแล้วจะกลับมานะคะ"
212030-159 = "อ่า อื้ม ไปดีมาดีนะ โชโกะ... ถึงจะไม่รู้ว่าเรื่องอะไรก็เถอะ"
212030-160 = "ไปดีมาดีนะ..."
212030-161 = ""
212030-164 = ""
212030-165 = ""
212030-166 = "ว่าแต่ พวกเธอเองก็ไม่ได้เจอกันนานเลยนะ"
212030-167 = ""
212030-170 = ""
212030-171 = "อ่า..."
212030-172 = "อ๊ะ รุ่นพี่คนนั้นที่เคยเล่าเรื่องเกเฮนน่าในอดีตให้ฟังไม่ใช่เหรอ...?"
212030-174 = "ในที่สุดก็กลายเป็นแบบนี้แล้ว! เป็นไง? รู้สึกดีใช่มั้ยล่ะ?"
212030-175 = "หืม? เรื่องอะไร...?"
212030-176 = "ก็เกเฮนน่ากำลังจะทวงคืนภาพในอดีตกลับมาอย่างสมบูรณ์แล้วไง!"
212030-177 = "นี่ไม่ใช่ภาพที่พวกเธอใฝ่ฝันถึงหรอกเหรอ?"
212030-178 = "เอ่อ... นั่นคือภาพในอดีตเหรอ...?"
212030-179 = "ใช่! ยุคสมัยที่เกเฮนน่าปกครองด้วยความหวาดกลัว! เราจะกลับไปเป็นเหมือนยุคอันยิ่งใหญ่ในอดีตเลย#nยังไงล่ะ!"
212030-180 = "ตะ... แต่ว่ารุ่นพี่เคยบอกว่าไม่ค่อยชอบเกเฮนน่าในอดีตไม่ใช่เหรอ?"
212030-182 = "ทั้งที่เคยบอกว่าไม่อยากกลับไปสู่ยุคนั้น แล้วทำไมตอนนี้ถึงดูดีใจขนาดนี้ล่ะ?"
212030-184 = "อ๊ะ ลืมเรื่องนั้นไปเถอะ ตอนนั้นฉันมันโง่เอง ฉันพูดผิดไปน่ะ"
212030-185 = "..."
212030-186 = "ลองคิดดูสิ เกเฮนน่าในอดีตคือสถานที่ที่ถูกปกครองด้วยระเบียบและการควบคุมอย่างที่พวกเธอใฝ่ฝัน"
212030-187 = "เป็นสถานที่ที่ยิ่งใหญ่อย่างแท้จริง ทุกคนมีใจหนึ่งเดียว มุ่งไปยังเป้าหมายเพียงหนึ่งเดียว และไม่จำเป็นต้องคิดถึงเรื่องยุ่งยากซับซ้อนอื่นๆ"
212030-188 = "..."
212030-189 = "เอาเป็นว่า ดูเหมือนสิ่งที่ทำไม่สำเร็จในตอนนั้นกำลังจะเป็นจริงในที่สุดแล้วนะ"
212030-190 = "ทำสงครามกับทั้งคิโวทอสเชียวนะ! ฮ่าฮ่า มันจะสะใจถึงขนาดไหนกันล่ะ?"
212030-191 = "ในที่สุดเกเฮนน่าก็กลับมาแล้ว เกเฮนน่าที่ทั้งยิ่งใหญ่และน่าหวาดกลัวเหมือนในอดีต"
212030-192 = ""
212030-194 = ""
212030-196 = ""
212030-197 = "รู้สึกว่า... รุ่นพี่... เปลี่ยนไปจากตอนที่เคยเจอกันมากเลยนะ...?"
212030-198 = "รุ่นพี่ยังปกติดีอยู่แน่นะ...?"
212030-200 = "แน่นอนสิ! ปกติดีมากๆ แถมรู้สึกดีสุดๆ เลย!"
212030-201 = "เมื่อก่อนฉันเอาแต่ชอบอิสระที่ได้มาแบบไม่ต้องรับผิดชอบ ไม่ได้คิดจะกลับไปเป็นเหมือนเดิมเลยสักนิด"
212030-202 = "แต่ตอนนี้ฉันเพิ่งตระหนักได้ พอมาคิดดูแล้วมันทั้งน่าละอายและน่าเจ็บใจจริงๆ"
212030-203 = "เอาละ ฉันคงต้องกลับแล้ว"
212030-204 = "พวกเธอก็เตรียมตัวกันให้ดีล่ะ การได้เข้าร่วมสงครามศักดิ์สิทธิ์ถือเป็นเกียรติอย่างยิ่งเลยนะ"
212030-205 = ""
212030-207 = ""
212030-209 = ""
212030-210 = "อะไรกัน...?"
212030-211 = "ครั้งก่อนยังบอกกันอยู่เลยแท้ๆ ว่าอย่าไปเพ้อฝันถึงอดีตนักเลย"
212030-212 = "นั่นน่ะสิ..."
212030-213 = "..."
212030-217 = "ตอนต่อไป;เกเฮนน่าที่รวมเป็นหนึ่ง"
