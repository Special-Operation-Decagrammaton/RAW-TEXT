[translation]
10051010-1 = "제1화;거절할 수 없는 제안"
10051010-2 = "백귀야행의 제38번 구교사의 어느 교실"
10051010-3 = "(라멘 가게에서의 소동이 있고 난 다음 날…….)"
10051010-4 = "무, 무슨 일이죠, 부장님?"
10051010-5 = "분명 중대 발표가 있으시다고……."
10051010-6 = "앗! 혹시 카메라 수리가 완료된 겁니까?"
10051010-7 = "그, 그건 아직……."
10051010-8 = "마땅한 수리점을 찾기가 쉽지 않아서 말이지, 냐핫."
10051010-9 = "사실 수리 비용이 없는 거지만……"
10051010-10 = "그, 그럼 혹시 설마 저희 동아리의 폐부 명령이라도 내려온 건가요?!"
10051010-11 = "아니, 그럴 리가."
10051010-12 = "애초에 우리 정식 동아리도 아니잖아. 폐부 자체가 불가능하지."
10051010-13 = "아무튼, 내가 제군들을 모은 이유는 다름이 아니라……"
10051010-15 = "좀 전에 음양부에서 연락이 온 게 있어서 공유하려 함이다!"
10051010-16 = "여, 역시……! 어제 라멘집에서 난동 부린 것에 대한 징계인가요……!"
10051010-17 = "그렇지는 않을 겁니다!"
10051010-18 = "어제의 그 일은 정당한 응보였으니까요!"
10051010-19 = "아, 라멘집에서의 일 때문인 건 맞아."
10051010-20 = "네?"
10051010-21 = "어제 일, 니야의 귀에 들어간 모양이더라고."
10051010-22 = "에에에?!"
10051010-23 = "아무튼 그것과 관련해서 할 이야기가 있으니까, 미치루 씨께서 오늘 안에 음양부에 한번 방문해 달라…… 뭐 그런 내용의 연락이었어."
10051010-24 = "아, 그리고 최대한 은밀하게 방문하라는 말도 덧붙였고."
10051010-25 = "그, 그건 역시 수상하잖아요……!"
10051010-26 = "여, 역시 어제의 그 일을 인질 삼아 우리에게 이런저런 더러운 일들을 맡길 게 분명해요……!"
10051010-27 = "어…… 음양부가 그렇게 치졸한 조직은 아닐 텐데."
10051010-28 = "……아닌가, 니야 그 너구리 녀석은 충분히 그럴 수도 있으려나……."
10051010-29 = "아무튼! 자세한 이야기는 다녀와서 다시 해 줄게!"
10051010-30 = "파, 파이팅이에요! 부장님!"
10051010-31 = "잘 다녀오세요! 닌닌!"
10051010-33 = "음양부 부실"
10051010-34 = "후후, 오셨군요, 인법연구부의 부장님."
10051010-35 = "참고로 어제 라멘집에서의 전투는 아주 잘 봤답니다?"
10051010-36 = "엥? 너도 거기 있었어? 왜?"
10051010-37 = "라멘집에는 당연히 라멘을 먹으러 갔겠죠?"
10051010-38 = "너도 라멘을 먹는구나……."
10051010-39 = "맨날 가이세키 같은 고급 요리만 먹을 줄 알았는데……."
10051010-40 = "대체 저를 평소에 어떻게 생각하고 계셨던 건가요……."
10051010-41 = "아무튼, 폭죽을 이용한 허술한 공격 기술…… 잘 봤답니다, 냐하하."
10051010-42 = "뭐, 뭐가 허술하다는 거야!"
10051010-43 = "음? 그 허술함 또한 전술의 일부 아니었나요?"
10051010-44 = "폭죽으로 상대의 시선을 끌고 방심시킨 후에 뒤를 치는 성동격서의 전술……."
10051010-45 = "그 와중에 점주의 안전까지 챙기는 세심함……"
10051010-46 = "저는 굉장히 감명 깊게 봤다고요?"
10051010-47 = "그…… 어……."
10051010-48 = "보, 보는 눈이 제법 있구만!"
10051010-49 = "정확해! 제대로 봤어!"
10051010-50 = "후후, 그럴 줄 알았답니다."
10051010-51 = "아무튼, 그 정도의 팀플레이는 쉬운 게 아니지요."
10051010-52 = "재빠른 판단력과 단호한 행동력, 거기에 물 흐르는 듯한 공조까지……."
10051010-53 = "인법연구부 여러분들이 얼마나 혹독하게 훈련했을지 능히 알 수 있었습니다."
10051010-54 = "어…… 고마워."
10051010-55 = "(그런데 우리끼리 딱히 훈련은 한 게 없는데…….)"
10051010-56 = "(그냥 워낙 오랫동안 같이 다녀서 손발이 잘 맞았을 뿐이고…….)"
10051010-57 = "(아니 그전에, 이 너구리가 웬일로 칭찬만 늘어놓는 거지?)"
10051010-58 = "(아무런 속셈도 없이 이렇게 칭찬만 할 사람이 아닌데?)"
10051010-59 = "자, 그럼 칭찬은 일단 여기까지 하고 말이죠."
10051010-60 = "히끅!"
10051010-61 = "본론으로 들어가 보도록 하죠, 인법연구부의 부장님."
10051010-62 = "결론부터 이야기하자면, 저희는 인법연구부 여러분의 힘이 필요합니다."
10051010-63 = "우리의 힘이……?"
10051010-64 = "잠깐만, 징계 주려고 부른 게 아니었어?"
10051010-65 = "엥? 징계요?"
10051010-66 = "그 라멘 탐구회 녀석들이 먼저 난동을 부린 건데, 그걸 제압한 인법연구부가 징계받을 이유가 있나요?"
10051010-67 = "아……."
10051010-68 = "뭐야 왜 정론을 말하는 거지?!"
10051010-69 = "정말로 저를 대체 평소에 어떻게 생각하셨던 건가요……."
10051010-70 = "아무튼 다시 돌아와서, 저희는 인법연구부 여러분의 힘이 필요하답니다."
10051010-71 = "아~주 중요한 경호 임무 의뢰가 들어왔거든요."
10051010-72 = "경호 임무 의뢰……?!"
10051010-73 = "예. 혹시 '샤인캣'이라는 이름을 들어 보셨는지요?"
10051010-74 = "샤인캣……?"
10051010-75 = "음, 처음 듣는 이름인데."
10051010-76 = "후후, 그럼 설명이 필요하겠군요."
10051010-78 = "샤인캣은 현재 키보토스에서 가장 명망 높은 의상 디자이너랍니다."
10051010-79 = "조금이라도 패션에 관심이 있는 사람이라면 모를 수가 없는 이름이죠."
10051010-80 = "심지어 키보토스에서 열리는 대형 패션쇼들이 이 사람의 말 한 마디에 일정을 수정할 정도이니……."
10051010-81 = "거기다 샤인캣이 도착하지 않으면 패션쇼를 시작하지 않는다는 패션계의 불문율까지 자리 잡았죠."
10051010-82 = "그런 분이, 이번에 백귀야행에서 열리는 패션쇼에 참석한다고 하더군요."
10051010-84 = "그래서……."
10051010-85 = "……저희 음양부는, 그분의 경호를 인법연구부 여러분께 맡기기로 했답니다!"
10051010-86 = "오……!"
10051010-90 = "잠깐만, 중간에 뭔가 많이 건너뛴 느낌인데?!"
10051010-91 = "음? 뭐가 말이죠?"
10051010-92 = "저는 라멘집에서 인법연구부의 실력을 보았고, 그래서 여러분이 이런 경호 임무에 가장 적합하다는 판단을 내린 거랍니다."
10051010-93 = "무슨 문제라도?"
10051010-94 = "그, 높이 평가해 준 것은 고마운데……."
10051010-95 = "아니 그 전에! 전투력으로 따지면 백화요란 분쟁조정위원회의 애들이 더 강하지 않아?!"
10051010-96 = "무, 물론 그래도 마지막에 서 있는 건 언제나 닌자이긴 하겠지만……!"
10051010-97 = "후후, 물론 순수하게 전투력으로만 따지면 백화요란의 분들이 더 강하죠."
10051010-98 = "그런데 강함만으로 경호원을 선발할 거였으면, 그냥 행사장에 열압력폭탄을 가져다 놨겠죠? 안 그런가요?"
10051010-99 = "얘, 얘기가 그렇게 되나……?"
10051010-100 = "예. 훌륭한 경호는 전투력만으로 결정되는 것이 아니랍니다."
10051010-101 = "신속성, 은밀성, 치밀한 공조……."
10051010-102 = "다수의 사람이 모인 곳에서의 경호에는 전투력 이상으로 이런 역량들이 중요하죠."
10051010-103 = "그리고 저는 여러분들의 활약에서 이 역량들을 보았습니다."
10051010-104 = "더 이유가 필요할까요?"
10051010-105 = "……확실히, 신속함과 은밀함은 닌자의 기본이긴 한데……."
10051010-106 = "후후, 그래도 너무 부담 가지실 것 없답니다."
10051010-107 = "샤인캣 디자이너의 밀착 경호는 그쪽 사무실의 전속 경호팀이 맡을 거예요."
10051010-108 = "여러분들이 맡아 주셔야 할 것은 패션쇼의 인파 속에 섞여 경호를 서는 것……."
10051010-110 = "요컨대, 언더커버 경호라고 할 수 있겠네요."
10051010-111 = "언더커버……!"
10051010-112 = "아 그리고 당연하지만, 저희도 맨입으로 부탁하는 것은 아니랍니다?"
10051010-113 = "응?! 진짜?!"
10051010-114 = "음? 뭘 그렇게 놀라실까요?"
10051010-115 = "권력을 앞세워서 대가도 안 주고 꼬투리를 잡은 뒤 노역을 강요할 생각은 처음부터 추호도 없었다고요?"
10051010-116 = "그렇게 구체적으로 부인하니까 더 의심스럽잖아……."
10051010-117 = "아무튼 그래서, 대가가 뭔데?"
10051010-118 = "후후."
10051010-119 = "그거 아시나요? 음양부의 창고에는 온갖 종류의 전자 장비들이 잠들어 있다는 거?"
10051010-120 = "그런데 맙소사, 얼마 전에 꽤 보관 상태가 좋은 카메라가 발견되었답니다!"
10051010-121 = "카메라?"
10051010-122 = "예. 화질도 좋고, 배터리 용량도 넉넉하고……."
10051010-123 = "아마 인법연구부에서 쓰시던 카메라보다 스펙은 훨씬 더 좋을지도?"
10051010-124 = "……!"
10051010-125 = "이번 라멘집에서의 사건 때, 쓰시던 카메라가 돈코츠 국물을 뒤집어썼죠?"
10051010-126 = "그랬으면 아마 카메라가 고장 났을 가능성이 농후한데……."
10051010-127 = "그렇다면 당연히 새 카메라가 필요하실 거고요."
10051010-128 = "그…… 그걸 어떻게……."
10051010-129 = "만약 이번 의뢰를 수락해 주신다면, 저희 음양부가 보유하고 있는 카메라를 드리죠."
10051010-130 = "아 물론 공용 비품이라 내규상 완전히 넘겨드릴 수는 없지만……."
10051010-131 = "9999년 동안 대여하는 것으로 처리할 수는 있거든요!"
10051010-132 = "그 정도면 대여 만료가 되기 전에 카메라가 흙으로 돌아가겠는데……?"
10051010-133 = "자 그래서, 인법연구부 부장님의 답변은?"
10051010-134 = "음……."
10051010-135 = "닌자란 무릇, 곤란한 사람을 지나쳐서는 안 되는 법."
10051010-136 = "좋아! 음양부의 이번 의뢰! 수락하도록 하지!"
10051010-137 = "참고로 절대로! 카메라 때문만은 아니니까!"
10051010-138 = "물론 준다면 절대로 거절은 않겠지만!"
10051010-139 = "냐하하! 그럼 이걸로 계약 성립이군요."
10051010-140 = "자, 그럼 계약도 잘 체결되었으니……."
10051010-145 = "……이번 의뢰에서 여러분이 지켜 주셔야 할 '조건'에 대해서 이야기를 해 볼까요."
10051010-146 = "뭐, 뭐야 이 가방은?"
10051010-147 = "후후, 이번 의뢰에서 가장 중요한 것이죠."
10051010-148 = "바로 이 의뢰를 수행하기 위해 여러분들이 갖춰야 할 '조건', 혹은 '자격' ……."
10051010-149 = "그것이 바로 이 가방 안에 담겨 있답니다."
10051010-150 = "이, 이런 얘기는 없었잖아?!"
10051010-151 = "하지만 이미 계약을 받아들이셨잖아요?"
10051010-152 = "설마 닌자가 한 입으로 두 말을 하진 않으시겠죠?"
10051010-153 = "큿……"
10051010-154 = "후후, 자, 그럼……."
10051010-161 = "철컥……."
10051010-163 = "……함께 가방 안을 한번, 확인해 보실까요?"
10051010-164 = "아, 그전에 잠깐만."
10051010-165 = "예?"
10051010-166 = "혹시 이 가방 때문에 나 혼자만 은밀하게 오라고 한 거야?"
10051010-167 = "아뇨, 그런 이유 때문은 아닙니다."
10051010-168 = "그럼?"
10051010-169 = "후후, 그건 말이죠……!"
10051010-171 = "……재밌으니까?"
10051010-175 = "……."
10051010-176 = "……그냥 빨리 가방이나 열어 봐."
