[translation]
1601603-1 = "굳이 설명할 필요는……"
1601603-2 = "(샬레 업무의 일환으로 시내에 들러, 이런저런 물품들을 구입하고 있었다.)"
1601603-8 = "어라, 선생님. 이런 곳에서 만나는군요."
1601603-12 = "[ns1] \"……음? 이 목소리는…….\"\n[ns2] \"……미네?\""
1601603-18 = "샬레 업무로 나오신 건가요? 후후, 이거 우연이네요."
1601603-19 = "마침 저도 구호기사단의 일이 있어서 나왔습니다. 선생님께서만 괜찮으시다면, 가는 데까지는 함께 가시죠."
1601603-23 = "선생님? 왜 그러시죠? 뭔가 표정이……."
1601603-24 = "……아아, 이 옷 말씀이신가요?"
1601603-29 = "……아, 그렇군요. 죄송합니다. 설명이 부족했네요."
1601603-30 = "구호기사단의 일이긴 하지만, 이번 일은 일종의 위문 공연입니다. 따라서 평소의 옷보다는 이 옷이 더 적합하다고 생각했습니다."
1601603-31 = "설명이 되셨을까요?"
1601603-32 = "[s3] \"아아, 과연. 고생이구나.\"\n[s4] \"미네도 정말 열심이네.\""
1601603-35 = "후후. 아닙니다. 뭐 이런 정도로요."
1601603-39 = "그러면 의문점도 해결되셨으니……. 마저 가실까요?"
1601603-46 = "(……며칠 후.)"
1601603-52 = "(업무 진행 관계로 약속이 있어, 근처의 비즈니스 레스토랑을 찾았다.)"
1601603-58 = "……음? 선생님??"
1601603-64 = "어라……. 이런 곳에서 또 뵙는군요. 얼마 전에도 우연히 뵈지 않았던가요?"
1601603-65 = "물론 저는, 선생님을 자주 뵈게 된 이런 우연이 아주 기쁩니다만……. 후후."
1601603-66 = "[s5] \"여기도 공연하러 온 거야?\"\n[s6] \"이번에도 아이돌 복장이네?\""
1601603-69 = "……네?"
1601603-70 = "아, 이번에는 공연 때문에 온 것이 아닙니다. 그저 이곳 메뉴가 훌륭하다고 추천을 들었던 것뿐이거든요."
1601603-71 = "이 옷은 그저……."
1601603-76 = "…………."
1601603-77 = "……자, 자리에 맞는, 격식에 맞는 의상을 찾다 보니, 그렇게 된 것 같습니다. 네."
1601603-78 = "이곳은 꽤 고급 레스토랑이니까요. 조금 드레스 같은 걸 차려입는 게 좋겠지요. 그게 좋겠군요."
1601603-79 = "[s7] (……자리에 맞는……?)\n[s8] (뭐지? 방금 전의 정적은…….)"
1601603-82 = "아, 아무튼 선생님께서도 일정이 있으시다 하셨으니, 오늘은 이만 먼저 자리를 비우겠습니다."
1601603-83 = "실례했습니다. 그럼 이만……!"
1601603-89 = "(이후로도 몇 번 정도, 간간이 미네와 마주치는 일들이 있었다.)"
1601603-100 = "(그리고 그때마다 미네는 아이돌 복장을 하고 있었고, 점점 더 이상한 이유들을 둘러댔다…….)"
1601603-106 = "(……또 다음 날.)"
1601603-112 = "(야근을 하던 밤. 잠시 잠을 깨기 위해 편의점을 들렀다.)"
1601603-121 = "……어라. 선생님. 이런 시간에도 나와 계시는군요."
1601603-122 = "아, 야근 중이셨던 겁니까. 으음……. 늦은 시간까지 고생이 많으시군요."
1601603-123 = "제가 무언가를 대표할 수는 없지만, 그래도 저희들을 위해 힘써 주시는 모습, 다시 한번 감사드립니다."
1601603-124 = "그리고……."
1601603-129 = "……아……."
1601603-130 = "……그……. 선생님."
1601603-131 = "지금 이건……. 그러니까, 이 옷은……."
1601603-132 = "[s9] \"미네, 잠깐만. 그…….\"\n[s10] \"굳이 일일이 변명하지 않아도…….\""
1601603-137 = "아, 아닙니다! 이건 그러니까……! 그……!"
1601603-138 = "으음……! 뭐라고 해야 하지, 이건. 그……."
1601603-142 = "……아, 평상복! 지금의 저는 구호기사단의 단장이 아니라 개인 자격으로 나왔으니, 그냥 평상복 느낌으로……!!"
1601603-143 = "아니, 잠깐만요. 평상복으로 이런 걸 입는 게 보통이었던가? 으음……!!"
1601603-144 = "뭐라고 해야 하지? 무슨 말을 해야 자연스러울까요?"
1601603-145 = "아, 아니 잠깐. 그걸 지금 선생님 앞에서 직접 말하는 것도 조금……!!"
1601603-150 = "음? 선생님, 방금 뭔가 말씀하셨나요?"
1601603-151 = "……네? 괜찮다고요? 뭐, 뭐가……."
1601603-152 = "[s11] \"미네가 귀여운 거 좋아하는 건 알고 있는걸.\"\n[s12] \"자기 취향의 옷을 입는 거잖아. 좋다고 생각해.\""
1601603-155 = "아아, 역시 그렇지요. 네. 그런 거라면 다행……."
1601603-156 = "인……게……."
1601603-161 = "……선생님?"
1601603-162 = "잠시만요, 선생님. 지금 그 말씀은……. 어……."
1601603-169 = "……아아. 네."
1601603-170 = "처음부터……. 네. 이미 알고 계셨다고요……."
1601603-171 = "그렇군요……."
1601603-176 = "……선생님."
1601603-182 = "[ns13] \"……!? 미네 씨……!?\"\n[ns14] \"뭔가 압박 가득한 표정!!\""
1601603-185 = "그……."
1601603-187 = "……그런 이야기는, 조금 더 빨리 해 주세요."
