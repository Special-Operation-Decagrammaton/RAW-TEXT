[translation]
1011702-1 = "걸 인 더 트레인"
1011702-2 = "출장 열차의 객실"
1011702-4 = "[ns] \"……심심하네.\""
1011702-5 = "(딱히 할 것도 없어서 심심하던 찰나……)"
1011702-11 = "검표- 시작-"
1011702-12 = "승객님들- 티켓-"
1011702-16 = "[ns] \"히카리……?\""
1011702-34 = "어- 선생님-?"
1011702-35 = "[s1] \"안녕, 히카리. 여기서 만나네.\"\n[s2] \"일하고 있구나.\""
1011702-38 = "응- 히카리 열일중-"
1011702-39 = "선생님 출장 가는 길-?"
1011702-40 = "금방 끝내고 올 테니- 기다려-"
1011702-45 = "[ns] \"온다고……?\""
1011702-47 = "(시간이 지나……)"
1011702-53 = "와악-!!"
1011702-57 = "[ns] \"아이고, 깜짝이야.\""
1011702-58 = "선생님- 깜짝 놀랐지-"
1011702-59 = "[s] \"엄청 빨리 왔네.\""
1011702-60 = "응응- 히카리 완전 검표 전문가-"
1011702-61 = "선생님 숨 쉬는 동안 끝내고 왔어-"
1011702-67 = "자- 이제 뭐 하고 놀까-"
1011702-68 = "[s] \"노는 건가……!\""
1011702-69 = "아- 이거 같이 먹자-"
1011702-73 = "즐거워 스틱- 소이탄 맛-"
1011702-74 = "[s3] \"…….소이탄 맛?\"\n[s4] \"과자에 그런 맛이 왜 있는 거야?\""
1011702-77 = "먹어봐- 진짜 그런 맛이 나-"
1011702-82 = "[ns5] \"……소이탄 맛은 이렇구나……\"\n[ns6] \"콜록, 콜록…… 새로운 세계네……\""
1011702-85 = "응- 매콤해서 맛있지-"
1011702-86 = "이거 다 먹으면- 다음엔 이거야-"
1011702-90 = "팝팝 캔디 조명탄 맛- 한정판이야-"
1011702-91 = "원래 엄청 신맛인데- 이건 엄청엄청 신맛이래-"
1011702-95 = "선생님 아- 해-"
1011702-96 = "[s] (두려운데……)"
1011702-100 = "[ns] \"……아-\""
1011702-104 = "[ns] \"으! 진짜 셔!! 엄청 셔!!\""
1011702-105 = "선생님 얼굴- 찌그러져서 다 먹은 깡통 음료수 같아-"
1011702-106 = "[s] \"히카리도 아- 해!\""
1011702-107 = "아-"
1011702-111 = "……"
1011702-112 = "셔-"
1011702-113 = "[s] \"표정이 멀쩡한데?!\""
1011702-114 = "히하리 힌허에 항해-"
1011702-115 = "[s7] \"신 거에 강하다고?\"\n[s8] \"억울해! 당했다!\""
1011702-119 = "(그렇게 히카리와 이런저런 과자들을 먹으며 시간을 보냈다.)"
1011702-126 = "[ns] \"그런데 히카리……\""
1011702-130 = "[ns] \"이렇게 계속 놀고 있어도 돼?\""
1011702-132 = "응- 히카리 선생님이랑 놀려고 퇴근했어-"
1011702-133 = "[s9] \"그래도 되는 거야?!\"\n[s10] \"부럽다…… 부러워……!\""
1011702-136 = "지금 히카리는 무적-"
1011702-137 = "선생님도 퇴근해 버려- 까짓거-"
1011702-138 = "[s] \"그러고 싶지만……\""
1011702-139 = "선생님 불쌍해- 일해야 돼-"
1011702-140 = "하지만 히카리는 놀 거야-"
1011702-142 = "(그렇게 히카리는 종착역에서 내릴 때까지 실컷 놀다 갔다……)"
