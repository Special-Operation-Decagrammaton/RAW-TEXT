[translation]
84312100300-6 = "오-! 여기야, 여기! 손님!!"
84312100300-7 = "관람은 잘하고 있어? 오늘이 마지막 날인데…… 어땠으려나 모르겠네."
84312100300-9 = "즐거웠습니다. 정말로 즐거웠어요. 어떻게 표현해야 할지 모르겠네요."
84312100300-10 = "그, 그렇게 말할 정도야……? 뭐, 우리 입장에선 다행이지만……."
84312100300-11 = "그러고 보니 그……. 한 가지 조금 물어봐도 될까……?"
84312100300-12 = "우린 잘 모르지만, 엑스포 기간 내내 리더랑 이것저것 같이 일을 했다고 들었어. 혹시 이 주변 청소도 같이한 거야?"
84312100300-16 = "……네? 청소요?"
84312100300-18 = "응! 원래 우리가 여기 청소할 예정이었는데, 누가 이미 깔끔하게 다 치워 놓았더라고!"
84312100300-20 = "어제저녁까지는 방치돼 있었으니…… 분명 밤사이에 일어난 일일 거라고 생각했어."
84312100300-21 = "제일 먼저 떠오른 게 리더랑 그쪽이었거든."
84312100300-22 = "이해했어요. 그런 말씀이셨군요."
84312100300-23 = "하지만 저는 어제저녁에 나오지 않았어요. 네루 혼자서 했다고 하면 가능한 이야기지만……"
84312100300-24 = "아아, 아냐. 아냐. 그럴 리는 없어. 선배가 혼자서 청소 같은 걸 할 리가 없잖아."
84312100300-26 = "다 같이 할 때에도 제일 많이 투덜거리는걸!"
84312100300-27 = "그렇군요. 그럼 대체 누가……"
84312100300-31 = "(……리오.)"
84312100300-32 = "(과연…… 그때 그 말이…… '확인했다'는 게 이거였나 보네요.)"
84312100300-33 = "(……정말이지 당신답군요.)"
84312100300-35 = "아으. 어쨌든 할 일이 끝나버렸으니, 뭔가 재밌는 일을 하러 가볼까?"
84312100300-36 = "오늘 해야 할 일이 산더민데 무슨 말이야, 선배."
84312100300-37 = "당장 지금만 해도 트리니티 학생들을 배웅해 줘야 되는…"
84312100300-38 = "에에- 재미없는데, 그건."
84312100300-39 = "그야 일이니까…… 재미로 하는 게 아니잖아."
84312100300-45 = "(여기서부터는 조금 복잡한 이야기를 나누는 것 같으니, 자연스럽게 사라져야겠네요.)"
