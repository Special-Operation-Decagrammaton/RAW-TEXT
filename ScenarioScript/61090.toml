[translation]
61090-1 = "제9화;수업 시간"
61090-2 = "후우……."
61090-3 = "으, 윽……!"
61090-8 = "……한 발 차이였군."
61090-9 = "결과는 나온 것 같지만."
61090-10 = "……조금 녹슬지 않았습니까, 스쿼드?"
61090-11 = "확실히, 그런 감이 있었지."
61090-12 = "너희는 어딘가 지리멸렬해진 느낌이었고."
61090-13 = "……!"
61090-14 = "그러면, 어떻게 할 거야. 너희들?"
61090-15 = "일단 우리들은, 우리들의 '존재 가치'를 증명한 것 같은데?"
61090-19 = "……어쩔 수 없기는 한데……."
61090-20 = "스쿼드 녀석들, 기고만장해져서는……!"
61090-21 = "어차피 '바깥'에서 더 많은 경험을 했을 거 아냐. 애초에 결과가 뻔한 싸움이었을 거라고, 이거."
61090-22 = "지금까지 아리우스를 지키고 있지도 못했으면서, 이제 와서 이러니저러니 참견하려고 하기는……!"
61090-23 = "저 녀석들……!"
61090-24 = "괜찮아, 미사키. 괜찮아."
61090-25 = "어쩌면 이건, 우리가 감내해야 했을 이야기일 테니까."
61090-26 = "저 선생님이란 사람도 그래. 제멋대로에, 막무가내에……."
61090-27 = "분명 앞으로는 우리를 위한 것이라고 해 놓고, 뒤로는 다른 생각을 하고 있겠지……."
61090-35 = "으앗?!"
61090-36 = "야, 야! 괜찮아?!"
61090-37 = "기절했어……."
61090-38 = "저, 전조도 선행 동작도 없이 가슴에 더블 탭, 그리고 이어서 헤드……."
61090-39 = "선배는 녹슨 것 같다고 했지만…… 전혀 녹슨 것 같지 않아……."
61090-41 = "아, 아츠코?!"
61090-42 = "히에에에에……."
61090-43 = "우리들에 대해서는 뭐라고 해도 상관없지만, 선생님에게는 그러지 말아 줘."
61090-44 = "그 정도 분별력은 있을 거라고 믿어."
61090-45 = "나도, 아직은 아리우스인 셈이니까?"
61090-46 = "네, 네엣!"
61090-47 = "……."
61090-49 = "(모두들 어딘가 겁을 먹고 주눅이 들어 있는 것처럼 보였다…….)"
61090-50 = "(일부러 더욱 밝게 이야기하기로 했다!)"
61090-51 = "[ns] \"그러면 얘들아! 공부하자!\""
61090-52 = "고, 공부를 하자고 해도 우리는 아무것도 없거든요!"
61090-53 = "교실도 엉망이고, 아는 것도 없고, 시설도 장비도…… 뭘 가르칠 사람도……"
61090-54 = "……말해 놓고 보니 뭔가 우울해졌어요."
61090-55 = "[s1] \"괜찮아, 괜찮아.\"\n[s2] \"원래 공부란 건, 의자랑 책상이랑 칠판만 있으면 다 돼.\""
61090-60 = "[ns] \"그리고 가르칠 사람은, 생각해 둔 게 있으니까!\""
61090-64 = "……진짜 여기서 하시게요?"
61090-65 = "[s3] \"와! 좋네, 뭐! 책상도 있고! 의자는 일으켜 세우면 되고!\"\n[s4] \"교탁에 칠판까지! 완벽한 교실이야!\""
61090-68 = "사전은 우리 아리우스에 거의 남아 있지 않기는 하지만……."
61090-69 = "아무리 그래도, 완벽이라는 단어의 사전적 의미가, 제가 모르는 사이에 많이 달라졌나 보네요……."
61090-70 = "거기에 시간도 시간입니다만, 곧 밤이 될 겁니다……."
61090-71 = "[s5] \"원래 첫 수업은 대충 출석만 부르고!\"\n[s6] \"개요만 이야기한 다음 끝나는 법이니까 문제없어!\""
61090-74 = "그…… 정말 괜찮은 건가, 선생……?"
61090-75 = "[s] \"괜찮아! 나는 믿어! 우리 사오리 믿어!\""
61090-76 = "?!"
61090-77 = "!?"
61090-78 = "거기에서 왜 내 이름이 나오는 거지, 선생???"
61090-79 = "[s7] \"왜냐하면! 지금부터 특별히 선발된 교생 선생님들이!\"\n[s8] \"1교시 수업을 진행할 것이기 때문입니다!\""
61090-82 = "그 선발은 언제 이루어진 거야, 선생님?"
61090-83 = "바로 지금? 그래…… 그렇구나."
61090-84 = "설마, 이게 선생이 이야기했던 '장대한 계획'이었던 건가?!"
61090-85 = "그러고 보니, 공부는 평소에 짬짬이 하고 있냐고 물어보기도 했지……."
61090-86 = "정말 방심할 수가 없네. 하아……."
61090-87 = "하, 하지만 나는…… 내가……"
61090-88 = "[s] \"와! 가르쳐 주세요, 사오리 선생님!\""
61090-89 = "응. 가르쳐 주세요. 사오리 선생님."
61090-90 = "서, 선생도 모자라서, 아츠코까지……?!"
61090-92 = "(사오리는 결국 어색한 표정으로 교단에 섰다……!)"
61090-94 = "(하지만 뭘 어떻게 가르쳐야 할지…….)"
61090-95 = "(음? 이것은 고등학교 사회 과목? 그리고 이 교과는 사회문화…… 사회계약론?)"
61090-99 = "(할 수 있어…… 이거라면!)"
61090-100 = "제군! 수업을 시작한다. 착석!"
61090-101 = "저, 정말로 앉아야 하나?"
61090-102 = "사실 이미 앉아 있기는 한데……"
61090-103 = "노트를 펼쳐라! 그게 없으면 아리우스 학생 수첩이라도! 한 권씩 갖고 있다는 것 정도는 나도 아직 알고 있다!"
61090-104 = "만일 없으면, 나중에 옆자리 친구의 노트라도 베껴서 적어 두도록."
61090-105 = "머리로 기억하는 것과 손으로 필기하는 것은, 나중에 남겨지는 지식의 양이 다르다."
61090-106 = "네, 네엣!"
61090-107 = "이거 완전 교관이었을 때 사오리 선배네……."
61090-108 = "수업에 들어가기 전에, 한 가지 중요한 사항을 말해 두고자 한다."
61090-112 = "계약서는! 정말로 중요하다!"
61090-113 = "계, 계약서?"
61090-114 = "그게…… 뭐지? 바깥의 문화인가……?"
61090-115 = "계약서란, 계약한다는 법적 증거와 구체적인 계약 내용을 남기기 위해, 두 사람 사이의 합의 하에 작성하는 문서로……"
61090-116 = "이게 없으면! 아무리 임무를 완수해도! 그에 따른 보상을 받지 못한다!"
61090-117 = "고생은 고생대로 하고! 빈털터리로 돌아오게 되는 일이 부지기수라는 뜻이다!"
61090-118 = "영혼이 들어간 외침이야……"
61090-119 = "어떻게 저렇게 잘 알지? 혹시…… 경험담?"
61090-120 = "힘내. 삿 쨩……!"
61090-121 = "사, 사오리 언니……!"
61090-123 = "따라서 사회는, 본디 실체가 없는 것이며, 구성원들의 계약에 의해 유지되는 인공적인 개념체라는 것이 사회계약론의 핵심이다."
61090-124 = "즉, 처음부터 그러한 것은 없으며, 모든 사람에게는 본디 태어나면서부터 주어진…… 고유한 권리가 있다는 것이지."
61090-125 = "저, 저기…… 질문, 인데요?"
61090-126 = "뭔가. 마이아."
61090-127 = "처음부터 그러한 것은 없다고 했는데, 그러면 태어나면서부터 주어진 권리 같은 것도 없는 것 아닌가요……?"
61090-128 = "좋은 질문이다. 그 문장은 언뜻 보면 모순된 것처럼 보일 수 있지."
61090-129 = "하지만 거기에는 이런 가정이 선행된다고 보면 된다."
61090-130 = "모든 사람에게는 본디 태어나면서부터 주어진 고유 권리가 있다고 '가정하는' 편이."
61090-131 = "더 나은 사회를 만들 가능성을 높이는 것이라고."
61090-132 = "그, 그러니까 그런 건 아니지만, 그런 거라고 생각해 버리는 게 오히려 결과적으로는 더 좋다는 거구나……."
61090-133 = "그런 식으로는 한 번도 생각해 보지 못했어……!"
61090-137 = "음. 시간이 다 되었군. 오늘 수업은 여기까지."
61090-138 = "질문이 있으면 기록해 두었다가 다음 수업 시간에 하도록."
61090-139 = "예습은…… 여러 가지 이유로 어쩔 수 없겠지만, 복습은 충실히 해 두는 것을 추천한다."
61090-140 = "본디 학습 효과는 예습보다 복습이 더욱 뛰어난 편이기도 하고."
61090-144 = "그, 어땠지? 선생……?"
61090-145 = "[s9] \"최고였습니다. 사오리 선생님…….\"\n[s10] \"감동했습니다. 사오리 선생님…….\""
61090-148 = "그, 아직 선생님이라는 호칭은 나에게 조금……."
61090-149 = "그래도, 다행이군. 나쁘지 않게 해 낸 것 같아서."
61090-151 = "[ns] \"그러면 다음은, 물리학 담당의 미사키 선생님!\""
61090-152 = "뭐? 내가 왜? 그것도 물리학?! 무슨 생각이야, 선생님?!"
61090-153 = "뭐? 탄도학은 곧 고전역학 아니냐고? 그건……!"
61090-154 = "……."
61090-155 = "완전히 관계가 없다는 건 아니라는 게, 두 배로 열 받네……."
61090-156 = "하아…… 알겠어. 해 볼게."
61090-159 = "일단 공식을 외워! 아직 너희들은 제대로 두뇌가 활성화되지 않았을 테니까!"
61090-160 = "너희들에게 그 정도까지의 이해력은 아직 바라지 않아! 교과 과정이 더 진행된 다음이라면 모를까!"
61090-161 = "수학과 물리학이 암기로 시작되는 학문이라는 게 다행인 줄 알아!"
61090-162 = "……물론 이걸 처음부터 이해할 수 있는 사람이라면, 그쪽으로 진로를 잡는 걸 추천할 테지만."
61090-163 = "………적지 않은 경우, 그런 부류의 사람들은 정작 사람을 숫자와 통계로 파악하려 한다거나."
61090-164 = "사람의 감정을 잘 이해하지 못해서 사고를 치는 경우도 있기는 하고……."
61090-166 = "안녕? 생물학 교생을 담당하게 된 하카리 아츠코야."
61090-167 = "그러면 곧장 수업을 시작하도록 할게. 생물학은 즐거우면서도 중요한 분야니까."
61090-168 = "가령 유전자란 무엇인가."
61090-169 = "어떤 과정을 거쳐서 그 후손을 남기게 되는가, 같은 문제 말이지."
61090-170 = "[s] \"아츠코! 스톱! 스톱!\""
61090-171 = "왜 그래, 선생님? 이건 정말로 중요한 이론이라구?"
61090-172 = "후후. 괜찮아. 선생님. 나도 다 아니까."
61090-173 = "그러면 우선, 감수 분열이라는 게 무엇인지부터 시작할까?"
61090-175 = "이것으로 유전자를 포함한, 세포의 구성 성분과 구성 기관에 대해 알아보았어."
61090-176 = "세포는 생명의 기본 단위, 그 자체라고도 할 수 있는 것이니까, 잘 기억해 두도록 해."
61090-178 = "……."
61090-179 = "아, 안녕하세요. 여러분. 헤헤……. 여러 가지 의미로, 오래간만에 뵙네요……."
61090-180 = "그, 그런데……."
61090-184 = "서, 선생님?! 저 어떻게 해야 하죠……?"
61090-185 = "저, 저는 평소에 잡지 말고는, 전문적으로 알고 있는 것도 없고, 그리고……!"
61090-186 = "[ns] \"……!\""
61090-188 = "[ns] (잡지라는 말에 번뜩, 생각이 스쳤다!)"
61090-189 = "네? 바깥에서 사람들이 어떻게 살아가는지, 이야기해 보자고요?"
61090-190 = "잡지에서 본 대로, 어떤 옷을 입고 뭘 먹고, 어떤 식으로 생활하는지……?"
61090-191 = "……."
61090-192 = "네! 그거라면…… 할 수 있을 것 같아요……!"
61090-194 = "다, 다시 한번…… 안녕하세요, 여러분."
61090-195 = "조, 조금 뜬금없게 들릴지도 모르겠지만……. 그러니까……."
61090-196 = "패션이라는 것에 대해, 어떻게 생각하시나요?"
61090-200 = "헤, 헤헤……. 맞아요. 정말 막 던지는 이야기였죠……."
61090-201 = "그런데요. 패션이라는 거…… 옷을 꾸며 입고 다른 사람들에게 자기가 어떻게 보이는지를 스스로 결정한다는 거……."
61090-202 = "그런 게 생각보다…… 중요한 일인 것, 같더라구요……?"
61090-203 = "그, 그리고 '바깥'에서 사람들이, 어떻게 살아가는지…… '생활'에 관한 것도요……!"
61090-205 = "(히요리의 패션 및 생활 강의는, 네 명 중에서 가장 호응도가 좋았다!)"
61090-209 = "(그나마 익숙한 스쿼드 아이들이 교생으로 활약해 주었기 때문인지.)"
61090-210 = "(아리우스 학생들의…… '수업'에 대한 경계심이 누그러져 가는 것이 느껴졌다.)"
61090-211 = "(바로 이때를 기다리고 있었다!)"
61090-213 = "[ns11] \"–지금까지의 논의에서, 이런 결론을 내릴 수 있습니다.\"\n[ns12] \"자명하다는 것, 즉 그 스스로 명백한 명제라는 것은–\""
61090-219 = "(적지 않은 아이들이, 수업을 잘 따라와 주었다.)"
61090-225 = "(……어떤 아이들은 그 반대이기도 했지만.)"
61090-226 = "(그런 걸 통틀어서…… 학창 시절이라고 하는 것이겠지…….)"
61090-228 = "[ns] \"그러면 오늘 수업은 여기까지! 모두 수고하셨습니다!\""
61090-229 = "수고하셨습니다……."
61090-230 = "머리 아파……."
61090-231 = "그래도 의외로 할 만 했을지도?"
61090-232 = "필기 좀 보여주라."
61090-233 = "아까 안 적고 뭐 했어?"
61090-234 = "잠시 멍때리고 있었더니……."
61090-238 = "……."
61090-240 = "일단은…… 여기가 선생의 숙소…… 같은 것이 되겠군."
61090-241 = "미안하다, 선생. 이런 장소 정도밖에, 우리는……."
61090-242 = "[s13] \"괜찮아. 이럴 줄 알고 침낭 가져왔으니까.\"\n[s14] \"으어어~ 천국이구만~\""
61090-248 = "[ns] \"왜 그래, 사오리?\""
61090-249 = "……선생."
61090-250 = "잠시만이라도 좋으니, 이런 나라도……."
61090-251 = "오늘 일을 비롯해서 상담 하고 싶은 것이 있는데, 괜찮을까?"
61090-253 = "다음화;상처와 흔적"
