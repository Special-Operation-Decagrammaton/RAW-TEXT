[translation]
41020-1 = "제2화;공원의 불청객"
41020-3 = "우, 우앗? 공격받고 있어!"
41020-4 = "이곳의 사각은 완벽히 파악하고 있을 텐데…… 도대체 어디서 공격하는 거야?"
41020-9 = "후후…… 그런 어설픈 위장으로 들키지 않고 잠입할 수 있을 거라 생각한 거야?"
41020-10 = "네 녀석들의 움직임은 모두 이 열상 감시 장비에 똑똑히 기록되고 있다고."
41020-14 = "모에! 녀석들의 발을 묶었어! 지금 바로 폭격을 실시해 줘!"
41020-15 = "좌표는 빅터, 킬로, 4-0-4-5!"
41020-16 = "있는 대로 폭탄을 쏟아부어!"
41020-22 = "쿠히히, 그 말 만을 기다리고 있었다고!"
41020-30 = "으악! 드론 공습이다!"
41020-31 = "모두 도망쳐!"
41020-37 = "잠깐, 조금 전의 폭발은 뭐지?"
41020-41 = "알파 분대, 알파 분대! 응답해!"
41020-43 = "시청자 여러분. 방금 보셨습니까?"
41020-44 = "방금 전의 폭발로 공원에 잠입하려던 공안국의 마지막 별동대가 당해버렸습니다!"
41020-45 = "이로써 발키리 경찰학교에서 가용할 수 있는 인원은 생활안전국의 학생들뿐…… 사실상 전멸했다고 봐도 좋은 수준이네요!"
41020-46 = "아무리 SRT 특수학원의 학생들을 상대하고 있다고는 하지만, 고작 1개 소대에게 발키리 경찰학교가 통째로 놀아나다니……"
41020-47 = "이대로 이들에게 계속 키보토스의 치안을 맡겨도 좋은 걸까요?"
41020-48 = "정말 걱정되는 일이 아닐 수 없습니다!"
41020-49 = "시끄러! 그걸 왜 너희들이 걱정하는 거야?!"
41020-50 = "그보다 여기는 작전 현장이라고! 누구 허락을 받고 여기서 촬영을 하는 거야? 썩 꺼지지 못해!"
41020-51 = "여러분, 보십시오! 발키리의 비열한 공권력이 이제는 언론을 향하고 있습니다!"
41020-52 = "범인은 제대로 잡지도 못하면서 기자들에게 화풀이라니, 정말 꼴사나운 모습이네요."
41020-53 = "나가! 당장 나가!!"
41020-54 = "젠장! 안 그래도 일이 꼬여가는 마당에 크로노스의 촉새들까지 몰려들다니. 이게 다 무슨 촌극이람?"
41020-55 = "……하지만 녀석들의 말이 완전히 틀린 것도 아니야. 이제 투입할 수 있는 인원은 생활안전국의 머저리들밖에 남지 않았으니……."
41020-56 = "[s] \"고생이 많아 보이네.\""
41020-58 = "응? 어째서 아직 외부인이 남아있는 거지?"
41020-59 = "이봐. 여기는 작전 지역이다. 위험하니까 근처에서 어슬렁거리지 말고 나가."
41020-65 = "[ns] 린의 소개서를 건네준다."
41020-66 = "이건…… 수석 행정관의 소개서?"
41020-67 = "방위실을 대신해 샬레의 선생님을 파견하겠다니, 그 말인 즉……"
41020-68 = "으, 으음……"
41020-69 = "실례했습니다. 실제로 뵙는 건 처음이라, 미처 알아보지 못했습니다."
41020-75 = "발키리 경찰학교의 공안국장이자, 이번 작전의 현장 책임자인 오가타 칸나입니다."
41020-76 = "[s1] \"만나서 반가워.\"\n[s2] \"상황은 어때?\""
41020-77 = "그게 보시다시피……."
41020-78 = "그게 보시다시피……."
41020-79 = "솔직히 말씀드리자면 비관적입니다. 남아있는 아군의 숫자도 많지 않고, 사기는 바닥을 치고 있습니다."
41020-80 = "애초에 우수한 장비로 무장하고 있는 SRT의 학생들을 숫자로 밀어붙여 제압할 계획이었는데, 이제는 그 숫자마저도 열세인 상황이니까요."
41020-81 = "게다가 남은 인원이라고는……."
41020-86 = "칸나 국장님, 생활안전국의 키리노입니다!"
41020-87 = "생활안전국은 언제쯤 출동하면 될까요?"
41020-88 = "우리까지 나설 필요는 없지 않을까? 어차피 다 끝난 것 같은데……."
41020-90 = "(한숨) '그' 생활안전국뿐입니다."
41020-91 = "어라? 선생님도 여기 계셨군요. 저희 발키리 경찰학교를 지원하러 오신 건가요?"
41020-92 = "그런 모양이네. 이런 현장까지 직접 찾아오다니, 샬레의 선생도 고생이 많아."
41020-93 = "후후, 선생님의 지휘를 받을 수 있다니. 이번 작전은 벌써 성공한 거나 다름없네요!"
41020-94 = "자, 그럼 도시의 안전을 위협하는 불량 학생들을 퇴치하러 어서 출동해 볼까요?"
41020-95 = "잠깐, 멋대로 움직이지 마. 너희가 나서서 뭘 하겠다는 거야?"
41020-96 = "경비국과 공안국이 모두 괴멸당한 이 상황에서 생활안전국 소속의 학생만으로 SRT 학원의 엘리트들을 상대하겠다고? 무모한 것도 유분수지."
41020-97 = "애초에 귀관들에게는 변변찮은 무기도 없잖나. 중무장한 특수부대원들을 무엇으로 제압하려고?"
41020-98 = "……귀관들의 사격 성적은 익히 들어 알고 있다만."
41020-99 = "우으, 하지만…… 시민들이 불안하고 있는 이 때에 불의를 그냥 두고 볼 수는……."
41020-100 = "귀관의 의욕만큼은 높이 사겠지만, 세상에는 기합만으로 해결할 수 없는 일도 잔뜩 있는 법이야."
41020-101 = "일단은 다른 방법을 찾을 때까지 여기서 얌전히 대기해."
41020-102 = "넵……."
41020-103 = "후후, 다행이네. 하기야, 칸나 국장의 말도 틀리진 않았고."
41020-104 = "[s] \"공원을 점거한 저 학생들은 누구야?\""
41020-105 = "이미 대략적인 정보는 들으셨겠지만, 저들은 SRT 특수학원 소속의 1학년 팀— <RABBIT 소대>의 소대원들입니다."
41020-106 = "원래대로라면 RABBIT 소대 또한 다른 SRT의 학생들처럼 정상적인 폐교 절차를 거친 뒤 발키리 경비국으로 전학을 오게 될 예정이었습니다만……"
41020-107 = "금일 오전. 갑자기 무슨 심경의 변화가 생겼는지, 이들은 갑자기 학원 인근의 공원을 점거하고 폐교 결정을 취소해 달라며 농성을 하기 시작했습니다."
41020-108 = "그 숫자는 많지 않지만, SRT 학원에서 가져온 최첨단의 장비로 무장하고 있는지라…… 저희가 보유하고 있는 경찰 장비만으로는 진압에 어려움을 겪고 있습니다."
41020-109 = "[s] \"더 자세한 자료는 없을까?\""
41020-110 = "학생회에서 받은 학생기록부 자료가 있기는 합니다만……."
41020-114 = "마침 크로노스의 중계 드론이 가까이 다가왔군요. 우선 영상으로 용의자들의 얼굴을 직접 확인하시죠."
41020-119 = "야, 인마! 겁도 없이 어딜 찍고 있는 거야? [ruby=휴대용 방공 시스템]MANPADS[/ruby]로 날려버린다!"
41020-120 = "쿠흐흐. 너무 예민하게 굴지는 마, 사키."
41020-121 = "어차피 싸울 수 있는 학생들은 조금 전의 공격으로 모두 도망쳤는데, 지금에 와서 사진 좀 찍힌다고 무슨 문제라도 생기겠어?"
41020-122 = "차라리 이 기회에 크로노스의 중계 카메라를 통해 SRT를 몰아내려던 총학생회의 결정이 얼마나 멍청한 것이었는지 똑똑히 알려 줘야지."
41020-123 = "어이~ 총학생회의 헛똑똑이들, 여기 보고 있지?"
41020-124 = "너희들이 계획한 건 전부 틀렸어. 이 쓸모없는 버러지 녀석들!"
41020-125 = "도전이라면 몇 번이고 받아주지. 우리가 여기서 머무르고 있는 한 SRT 학원의 이름은 절대로 꺾이지 않을 테니까!"
41020-127 = "사키, 모에. 외부 카메라를 통한 불필요한 도발은 삼가주세요."
41020-128 = "저희는 전투를 통해 교섭에서 유리한 위치를 선점하려는 것이지, 장기적인 게릴라전을 치르려는 게 아닙니다."
41020-130 = "칫…… 미야코는 언제나 진지하다니까. 재미없게시리."
41020-134 = "그나저나, 저 드론 소리 진짜 거슬리네. 슬슬 머리가 아파올 지경이야."
41020-138 = "……생각해보니 탄약도 잔뜩 남아있고, 몇 발정도라면 시험 삼아 쏴도 괜찮지 않을까?"
41020-139 = "뭐야, 사키. 언제부터 그런 기특한 생각을 하고 있었던 거야?"
41020-140 = "화끈하게 저지르는 일이라면 언제나 찬성이지!"
41020-141 = "아니, 아예 남아 있는 탄약을 다 써서 화려한 불꽃놀이를 벌이는 건 어때?"
41020-142 = "분명 엄청나게 멋진 광경을 연출할 수 있을 거야. 하아, 하아……"
41020-143 = "전탄 사격을 하는 것 자체는 나쁘지 않지만, 뭔가 잊고 있는 듯한 기분이……."
41020-149 = "저, 다들…… 혹시 나 잊어버린 거 아니지……?"
41020-150 = "폭격을 하는 건 괜찮지만, 내가 있는 곳까지 날려버리면 안 돼……"
41020-152 = "아."
41020-153 = "무, 물론이지! 동료가 적진 근처에 잠복 중이라는 사실을 잊어버릴 리가 없잖아?"
41020-155 = "그렇다면 다행이지만……"
41020-156 = "그나저나 적은 다 돌아간 것 같은데, 나도 이제 슬슬 복귀하면 안 될까?"
41020-157 = "이 근처는 습하고, 벌레도 많고, 볕도 거의 들지 않아서……"
41020-158 = "혼자 대기하고 있으려니 너무 무서워……."
41020-159 = "우는 소리 내지 마, 미유. 우리는 SRT의 엘리트들이라고."
41020-160 = "SRT의 엘리트가 고작 벌레 때문에 잠복 임무를 중단한다는 게 말이나 돼?"
41020-161 = "계속 그런 우는 소리를 내고 싶다면 지금이라도 발키리 경찰학교로 가서 교통정리라도 하든가. 나는 말리지 않을 테니까."
41020-162 = "그, 그건 아니지만……."
41020-163 = "게다가 작전은 아직 끝나지 않았어. 미유, 저 위에 날아다니는 드론 보이지?"
41020-164 = "지금 바로 격추할 거니까, 타겟 고도 관측해서 바로 알려줘."
41020-165 = "우으…… 알았어. 잠시만……."
41020-167 = "기다려주세요, 사키. 추가 보급을 기대할 수 없는 상황에서 불필요한 사격은 지양해야 합니다. 섣불리 탄약을 낭비하는 행위는—"
41020-168 = "아까 전부터 종알종알 시끄러워!"
41020-169 = "네가 뭐라고 우리에게 명령하는 거야?"
41020-170 = "맞아. 다 똑같은 1학년이면서 선배인 척 굴기는!"
41020-171 = "어차피 총학생회장도 사라졌겠다, 우리도 지금부터는 우리가 하고 싶은 대로 할 거야!"
41020-172 = "하지만……."
41020-174 = "……사키 쨩. 방금 좌표를 확인했어. 타겟 고도 900m, 거리 2500m. 방위는 0-3-0……."
41020-175 = "좋았어."
41020-179 = "타겟 록 온."
41020-180 = "모에, 발사는 맡길게."
41020-181 = "불꽃을 쏘아 올리는 순간은 언제나 흥분된단 말이지. 하아하아……"
41020-185 = "그럼 조준하시고……"
41020-186 = "파이어!"
41020-196 = "……중계 드론, 로스트 되었습니다."
41020-197 = "전투와는 상관없는 방송국 중계 장비를 공격하다니, 무뢰한들 같으니라고…."
41020-198 = "저런 녀석들이 어떻게 SRT 학원에 입학한 거지?"
41020-199 = "[s] \"활기찬 아이들이네.\""
41020-200 = "키보토스에서는 그런 녀석들을 바보라고 부르지요."
41020-201 = "단순한 바보라면 모를까, 힘을 지닌 바보만큼 위험한 존재는 없습니다. 대화를 통한 설득이 불가능하니까요."
41020-202 = "이번만큼은 다른 학원 자치구의 선도부에 지원을 요청해야 할 것 같습니다."
41020-206 = "우선은 게헨나 선도부에 연락을……."
41020-207 = "[s3] \"아니, 그럴 필요는 없어.\"\n[s4] \"지금 있는 인원만으로도 어떻게든 될 것 같아.\""
41020-208 = "네? 뭔가 착각하신 게 아니십니까?"
41020-209 = "네? 뭔가 착각하신 게 아니십니까?"
41020-210 = "지금 움직일 수 있는 경비국, 공안국 인원들은 저를 포함해도 5명이 넘지 않습니다만."
41020-211 = "[s5] \"키리노, 후부키. 출동이야.\"\n[s6] \"지금 바로 RABBIT 소대를 제압하러 가자.\""
41020-214 = "네, 네, 넵?! 지금 바로 출동인가요?"
41020-215 = "으엑, 농담이지?"
41020-216 = "상대는 SRT라고?!"
41020-221 = "……농담이 심하시군요, 선생님."
41020-222 = "여기 있는 학생들은 전투원이 아닌, 평화에 찌든 생활안전국의 오합지졸뿐입니다."
41020-223 = "그런데 경비국과 공안국 몇 개 소대가 처치하지 못한 적을 생활안전국의 학생들만으로 제압하시겠다고요?"
41020-224 = "아무리 선생님이 유능하다 하시더라도 잡졸을 지휘해서 정예를 상대로 승리를 따낼 수는 없습니다."
41020-225 = "엘리트와 그렇지 못한 학생 사이에는 좁힐 수 없는 간극이 존재하니까요."
41020-226 = "[s] \"하지만 내게는 다 똑같은 학생처럼 보이는걸.\""
41020-230 = "……후우."
41020-231 = "책임은 샬레가 지는 겁니다. 저는 모릅니다."
41020-235 = "대원 전원에게 전파한다! 지금부터 남은 공안국 인원들은 샬레의 지시를 따른다. 생활안전국과 공조하여 확실하게 범인을 제압할 수 있도록!"
41020-237 = "자, 잠깐! 진짜로!? 우리가 상대하는 거야? SRT 학원의 엘리트들을? 레알?"
