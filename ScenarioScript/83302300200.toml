[translation]
83302300200-6 = "아코? 어쩐 일이야? 난 지금 막 선도부로 복귀한 참인데."
83302300200-7 = "부, 부장님……! 큰일이에요!"
83302300200-8 = "지금 게헨나의 공원에 엄청나게 거대한 괴물……? 같은 게 나타났다는 신고가 들어와서……!"
83302300200-9 = "물론 이렇게 말하면 무슨 이야기인지 부장님께선 이해하기 어려우시겠지만……!"
83302300200-10 = "……아니, 알 것 같아."
83302300200-11 = "역시 그렇……!"
83302300200-12 = "네……?"
83302300200-13 = "공원의 위치를 알려줘, 바로 달려갈게."
