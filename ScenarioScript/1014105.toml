[translation]
1014105-1 = "เดินเล่นยามค่ำคืน"
1014105-2 = "ประตูหน้าชาเล่ต์"
1014105-3 = "(คุณครูลงไปที่ชั้นหนึ่งของอาคาร)"
1014105-4 = ""
1014105-6 = ""
1014105-7 = ""
1014105-8 = ""
1014105-9 = ""
1014105-10 = ""
1014105-11 = "คะ... คุณครู?! "
1014105-12 = "[s] \"ว่าไง ฮารุกะ\""
1014105-13 = "สะ... สวัสดีค่ะ...!"
1014105-14 = "ขอโทษที่ติดต่อมาตอนดึกแบบนี้นะคะ..."
1014105-15 = "ฉะ... ฉันมีเรื่องอะไรน่ะเหรอคะ?"
1014105-16 = "คือว่า..."
1014105-17 = "ที่จริงวันนี้ฉันไปทำงานพาร์ทไทม์เป็นเจ้าหน้าที่รักษาความปลอดภัยที่อื่นมาค่ะ... ระหว่างทางกลับหลังจากเสร็จงาน ฉันก็บังเอิญเดินผ่านหน้าชาเล่ต์..."
1014105-18 = "[s] \"งานพาร์ทไทม์ราบรื่นดีมั้ย?\""
1014105-19 = "ค่ะ! วันนี้ฉันไม่ได้ทำผิดพลาดซ้ำรอยครั้งที่แล้วค่ะ!"
1014105-20 = "ถ้าเห็นใครดูน่าสงสัย ฉันก็ชิงเหนี่ยวไกก่อนเลยค่ะ!"
1014105-21 = "[s] \"หืม...?\""
1014105-22 = "อาจจะเพราะแบบนั้น ทางผู้ว่าจ้างก็เลยชอบใจใหญ่เลยค่ะ บอกว่าในงานดูเงียบสงบ แถมยังรักษาความเป็นระเบียบเรียบร้อยได้ดีกว่าปกติด้วยค่ะ!"
1014105-23 = "[s] \"สรุปว่าการใช้ความรุนแรงคือคำตอบสินะ...\""
1014105-24 = "คะ? "
1014105-25 = "[s1] \"ถ้างั้นเราเดินกลับด้วยกันมั้ย?\"\n[s2] \"เดี๋ยวครูเดินไปส่งให้นะ\""
1014105-28 = "จะ... จะไปส่งฉันเลยเหรอคะ...?"
1014105-29 = "หะ... ให้ทำแบบนั้นไม่ได้หรอกค่ะ...!"
1014105-30 = "แค่เรียกหาคุณครูตอนกลางคืนก็เสียมารยาทแล้ว ถ้าให้เดินไปส่งด้วยละก็..."
1014105-31 = "[s3] \"ไม่หรอก ฮารุกะ\"\n[s4] \"ขอแค่ให้ครูได้ปลีกตัวจากงานได้ ครูก็ยินดีอยู่แล้ว\""
1014105-34 = "คะ...? จะ... จะเอาแบบนี้จริงๆ เหรอคะ?"
1014105-35 = "ถะ... ถ้างั้นก็..."
1014105-36 = "ระ... รบกวนด้วยนะคะ..."
1014105-38 = "(แล้วคุณครูก็เริ่มเดินไปตามถนนตอนกลางคืนกับฮารุกะ)"
1014105-40 = "อึก..."
1014105-41 = "บนถนนไม่มีใครเลยสักคนนะคะ..."
1014105-42 = "รู้สึกมันมืดและชวนขนลุกยังไงไม่รู้..."
1014105-43 = "ขอโทษนะคะ... ที่ฉันติดต่อมาในยามดึกดื่นแบบนี้..."
1014105-44 = "[s] \"งานเลิกดึกได้ เป็นเรื่องธรรมดาอยู่แล้วละ\""
1014105-45 = "งาน..."
1014105-46 = "เอ่อ งานของฉันวันนี้น่ะค่ะ..."
1014105-47 = "ที่จริงมันเสร็จตั้งแต่ 2 ชั่วโมงก่อนแล้วค่ะ..."
1014105-48 = "[s] \"หืม?\""
1014105-49 = ""
1014105-52 = "[ns] \"งั้นก็มาเตร็ดเตร่หน้าชาเล่ต์อยู่นานเลยเหรอ?!\""
1014105-53 = "ค่ะ..."
1014105-54 = "ทำไมฉันถึงลังเลที่จะติดต่อไปน่ะเหรอคะ?"
1014105-55 = "ก็... คุณครูอาจกำลังยุ่งกับงานด่วนอยู่ก็ได้..."
1014105-56 = "ถ้าไม่อย่างนั้นก็อาจจะออกไปทำธุระข้างนอกอยู่..."
1014105-57 = "หรืออาจจะกำลังพักผ่อน หรือไม่ก็อาจขี้เกียจเกินกว่าจะออกไปข้างนอก..."
1014105-58 = "พอฉันคิดแบบนั้น ก็เลยไม่รู้ว่าควรติดต่อไปหรือเปล่าน่ะค่ะ..."
1014105-59 = "แล้วถ้าฉันแวะไปหาโดยไม่บอกล่วงหน้า คุณครูอาจจะตกใจก็ได้..."
1014105-60 = "ก็แบบนั้นจะเป็นการสร้างความรำคาญให้คุณครูนี่คะ..."
1014105-61 = "[s] \"อืม ก็อาจเป็นแบบนั้นได้นะ\""
1014105-62 = "วะ... ว่าแล้วเชียว...!"
1014105-63 = "[s5] \"แต่ในที่สุดแล้วฮารุกะก็ MOMOTALK มาหาครู\"\n[s6] \"แต่เราก็ได้มาเดินเล่นยามค่ำคืนอย่างเพลิดเพลินแบบนี้นะ\""
1014105-66 = "คะ...?"
1014105-67 = "[s] \"ขอบใจที่มาชวนครูคุยก่อนนะ ฮารุกะ\""
1014105-68 = "งะ... งั้นเหรอคะ..."
1014105-69 = "เพราะงั้นถ้าเจอสถานการณ์แบบนี้อีกในอนาคต ก็ให้ฉันบอกได้เลย ไม่ต้องลังเล... เหรอคะ...?"
1014105-70 = "เพราะถ้าฉันไม่แสดงออก อีกฝ่ายก็จะไม่มีทางรู้...?"
1014105-71 = ""
1014105-73 = ""
1014105-74 = "ถะ... ถ้างั้นก็ คุณครูคะ..."
1014105-75 = "คนอย่างฉันจะขอ..."
1014105-76 = "ขอ 'แสดงออก' อะไรบางอย่าง... ให้คุณครูได้รู้ได้มั้ยคะ...?"
1014105-77 = ""
1014105-79 = ""
1014105-80 = ""
1014105-82 = "(ฮารุกะเดินเข้ามาจับแขนเสื้อไว้แน่น)"
1014105-83 = ""
1014105-85 = ""
1014105-86 = "คือว่า... จะเป็นอะไรมั้ยคะ... "
1014105-87 = "ถ้าเราจะเดินให้ช้าลงหน่อย จนถึงที่หมายเลยน่ะค่ะ...?"
1014105-89 = "(ไม่มีเหตุผลอะไรที่คุณครูจะปฏิเสธคำขอนี้)"
1014105-90 = "(แล้วคุณครูกับฮารุกะก็ก้าวเดินกันอย่างสบายๆ และเพลิดเพลินกับการเดินเล่นยามค่ำคืนด้วยกัน)"
