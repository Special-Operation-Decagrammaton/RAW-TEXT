[translation]
1014105-1 = "밤 산책"
1014105-2 = "샬레 정문"
1014105-3 = "(건물 1층으로 내려갔다.)"
1014105-11 = "서, 선생님?!"
1014105-12 = "[s] \"안녕, 하루카.\""
1014105-13 = "아, 안녕하세요……!"
1014105-14 = "죄송합니다, 갑자기 이 야밤에……."
1014105-15 = "그, 그런데 무슨 일이냐고요?"
1014105-16 = "그게……."
1014105-17 = "사실 오늘은 다른 곳에서 시큐리티 아르바이트가 있었는데…… 그걸 마치고 돌아오는 길에 우연히 샬레 앞을 지나게 되어서……."
1014105-18 = "[s] \"아르바이트는 잘 했어?\""
1014105-19 = "예! 오늘은 저번과 같은 실수는 반복하지 않았습니다!"
1014105-20 = "조금만 수상해 보여도 일단 방아쇠를 당겼으니까요!"
1014105-21 = "[s] \"……응?\""
1014105-22 = "그 때문인지, 고용주 분도 평소보다 장내가 조용하고 질서 유지가 잘 된다며 좋아하셨어요!"
1014105-23 = "[s] \"역시 답은 폭력이었던 건가…….\""
1014105-24 = "예?"
1014105-25 = "[s1] \"그러면, 잠깐 같이 걸을까?\"\n[s2] \"바래다 줄게.\""
1014105-28 = "바, 바래다주신다고요……?"
1014105-29 = "그, 그럴 수는 없어요……!"
1014105-30 = "야밤에 선생님을 불러낸 것도 모자라서 그런 수고까지……."
1014105-31 = "[s3] \"아냐, 하루카.\"\n[s4] \"직장에서 멀어질 수 있다면, 나는 그걸로 좋아.\""
1014105-34 = "예……? 저, 정말로요?"
1014105-35 = "그렇다면, 그……."
1014105-36 = "자, 잘 부탁드립니다……."
1014105-38 = "(그렇게, 하루카와 밤길을 걷기 시작했다.)"
1014105-40 = "우으으……."
1014105-41 = "거리에 사람이 하나도 없네요……."
1014105-42 = "뭔가 어둡고, 스산하고……."
1014105-43 = "죄송합니다…… 너무 늦게 연락을 드려서……."
1014105-44 = "[s] \"일이 늦게 끝났으면 당연한 일이지, 뭐.\""
1014105-45 = "일……."
1014105-46 = "저기, 그 일 말인데요……."
1014105-47 = "……사실 두 시간 전에 끝났어요."
1014105-48 = "[s] \"응?\""
1014105-52 = "[ns] \"그럼 샬레 앞에서 한참 동안 서성였던 거야?!\""
1014105-53 = "예……."
1014105-54 = "왜 연락을 망설였냐고요?"
1014105-55 = "그, 혹시나 선생님께서 급한 업무 중이셨을 수도 있고……."
1014105-56 = "아니면 외근 중이셨을 수도 있고……."
1014105-57 = "혹은 휴식 중이시거나, 나가기 귀찮으실 수도 있고……."
1014105-58 = "그렇게 생각해서, 연락을 망설였거든요……."
1014105-59 = "그렇다고 갑자기 찾아뵈면 선생님을 놀라게 해드릴지도 모르고……."
1014105-60 = "선생님께 민폐일 수도 있으니까요……."
1014105-61 = "[s] \"음, 그랬을 수도 있지.\""
1014105-62 = "여, 역시……!"
1014105-63 = "[s5] \"하지만 결과적으로 하루카가 모모톡을 해줘서.\"\n[s6] \"이렇게 즐거운 밤 산책을 할 수 있게 됐잖아?\""
1014105-66 = "예……?"
1014105-67 = "[s] \"먼저 다가와줘서 고마워, 하루카.\""
1014105-68 = "그, 그런……."
1014105-69 = "그러니까 앞으로도 이런 상황이면 망설이지 말고 편하게 말해달라, 고요……?"
1014105-70 = "표현하지 않으면, 절대로 알 수 없으니까……?"
1014105-74 = "그, 그렇다면, 선생님……."
1014105-75 = "이런 저라도…… 그……."
1014105-76 = "선생님께 딱 한 가지만…… '표현' 해도 될까요……?"
1014105-82 = "(하루카가 다가오며 옷소매를 꼭 붙잡았다.)"
1014105-86 = "그러니까, 그 목적지까지……."
1014105-87 = "……조금, 천천히 걸어가도 괜찮을까요?"
1014105-89 = "(거절할 이유는 조금도 없었다.)"
1014105-90 = "(그렇게 느긋한 걸음으로, 하루카와 오랫동안 밤 산책을 즐겼다.)"
