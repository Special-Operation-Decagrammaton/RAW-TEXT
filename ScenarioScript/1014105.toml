[translation]
1014105-1 = "夜間散步"
1014105-2 = "夏萊正門"
1014105-3 = "（來到了夏萊大樓的一樓）"
1014105-4 = ""
1014105-6 = ""
1014105-7 = ""
1014105-8 = ""
1014105-9 = ""
1014105-10 = ""
1014105-11 = "老，老師！？ "
1014105-12 = "[s] 「你好，遙香。」"
1014105-13 = "您，您好……！"
1014105-14 = "對不起，突然在這種時間……"
1014105-15 = "您問有什麼事嗎？"
1014105-16 = "那個……"
1014105-17 = "其實今天在別的地方有保全的打工……結束之後剛好在回去的路上經過夏萊……"
1014105-18 = "[s] 「打工還順利嗎？」"
1014105-19 = "是的！今天沒有發生像上次那樣的事件！"
1014105-20 = "只要看起來稍微可疑，我就先扣下扳機了！"
1014105-21 = "[s] 「……嗯？」"
1014105-22 = "或許是因為這樣，雇主也很高興地說場內比平常安靜，秩序維持得很好！"
1014105-23 = "[s] 「果然還是得依賴暴力嗎……」"
1014105-24 = "嗯？ "
1014105-25 = "[s1] 「那……要不要一起散個步？」\n[s2] 「我送你回去。」"
1014105-28 = "送，送我回去嗎……？"
1014105-29 = "那，那怎麼可以……！"
1014105-30 = "不僅在這麼晚把老師叫出來，甚至還讓您費心……"
1014105-31 = "[s3] 「不，遙香。」\n[s4] 「只要能遠離職場，我就心滿意足了。」"
1014105-34 = "咦……？真，真的嗎？"
1014105-35 = "這樣的話……"
1014105-36 = "那，那就拜託您了……"
1014105-38 = "（就這樣，我和遙香開始走在夜晚的道路上）"
1014105-40 = "嗚嗚……"
1014105-41 = "街上一個人也沒有呢……"
1014105-42 = "總覺得又暗又淒涼……"
1014105-43 = "對不起……這麼晚才聯絡您……"
1014105-44 = "[s] 「工作晚結束的話，那也沒辦法嘛。」"
1014105-45 = "工作……"
1014105-46 = "那個……關於那個工作……"
1014105-47 = "……其實兩個小時前就結束了。"
1014105-48 = "[s] 「咦？」"
1014105-49 = ""
1014105-52 = "[ns] 「所以你在夏萊前面徘徊了很久嗎！？」"
1014105-53 = "是的……"
1014105-54 = "為什麼我遲遲不聯絡您嗎？"
1014105-55 = "那個……我想說……萬一老師正在處理緊急的工作……"
1014105-56 = "或者可能正在外勤……"
1014105-57 = "又或者正在休息……懶得出門之類的……"
1014105-58 = "這麼一想，我就不敢聯絡老師了……"
1014105-59 = "可是突然去拜訪，又可能會嚇到老師……"
1014105-60 = "因為我擔心自己會給老師造成困擾……"
1014105-61 = "[s] 「嗯，或許也有可能是那樣吧。」"
1014105-62 = "果，果然……！"
1014105-63 = "[s5] 「但以結果來說，遙香還是傳了MomoTalk給我。」\n[s6] 「我們才能像這樣享受一場愉快的夜間散步，不是嗎？」"
1014105-66 = "咦……？"
1014105-67 = "[s] 「謝謝你主動來找我，遙香。」"
1014105-68 = "那，那個……"
1014105-69 = "也就是說，以後如果遇到這種情況也不要猶豫，可以放心地告訴您嗎……？"
1014105-70 = "不表達出來的話，對方就永遠不會知道……？"
1014105-71 = ""
1014105-73 = ""
1014105-74 = "那，那樣的話……"
1014105-75 = "老師，就算是這樣的我……那個……"
1014105-76 = "也可以向老師「表達」一個想法嗎……？"
1014105-77 = ""
1014105-79 = ""
1014105-80 = ""
1014105-82 = "（遙香靠了過來，緊緊抓住了我的衣袖）"
1014105-83 = ""
1014105-85 = ""
1014105-86 = "那個……到目的地為止…… "
1014105-87 = "可以稍微……放慢腳步嗎？"
1014105-89 = "（絲毫沒有任何拒絕的理由）"
1014105-90 = "（就這樣，以悠閒的步調和遙香享受了一場漫長的夜間散步）"
