[translation]
1014105-1 = "Night Walk"
1014105-2 = "Schale Main Entrance"
1014105-3 = "I went down to the building's main entrance."
1014105-4 = ""
1014105-6 = ""
1014105-7 = ""
1014105-8 = ""
1014105-9 = ""
1014105-10 = ""
1014105-11 = "S-Sensei?! "
1014105-12 = "[s] \"Hello, Haruka.\""
1014105-13 = "H-Hello...!"
1014105-14 = "I'm so sorry for bothering you so late at night!"
1014105-15 = "Y-You want to know what's wrong?"
1014105-16 = "Well..."
1014105-17 = "Um... I had another part-time security job today, and I happened to pass by Schale on my way home..."
1014105-18 = "[s] \"How did work go today?\""
1014105-19 = "Well! Really well! I made SURE not to make the same mistake as last time."
1014105-20 = "If anything looked even slightly suspicious, I pulled the trigger right away!"
1014105-21 = "[s] \"...Huh?\""
1014105-22 = "My employer was really happy! They said the venue was way more orderly than usual!"
1014105-23 = "[s] \"In the end... Is violence really the answer?\""
1014105-24 = "Huh? "
1014105-25 = "[s1] \"Want to take a walk with me?\"\n[s2] \"I'll escort you back home.\""
1014105-28 = "Y-You'll walk me home...?"
1014105-29 = "Y-You can't...!"
1014105-30 = "I'm already bothering you in the middle of the night. I can't become even more of a burden..."
1014105-31 = "[s3] \"It's okay, Haruka.\"\n[s4] \"I'll take any excuse to leave my desk.\""
1014105-34 = "Eh...? R-Really?"
1014105-35 = "If that's the case, then..."
1014105-36 = "I-I appreciate it..."
1014105-38 = "So Haruka and I started the walk back in the quiet night."
1014105-40 = "U-Uh..."
1014105-41 = "There's no one around..."
1014105-42 = "It's dark and a little lonely..."
1014105-43 = "I'm sorry...for contacting you this late..."
1014105-44 = "[s] \"You were hard at work! Couldn't be helped.\""
1014105-45 = "My job..."
1014105-46 = "Um, about that..."
1014105-47 = "... ...My shift ended two hours ago."
1014105-48 = "[s] \"Huh?\""
1014105-49 = ""
1014105-52 = "[ns] \"So you were just pacing in front of Schale for TWO hours?!\""
1014105-53 = "Yes..."
1014105-54 = "Why was I so hesitant to reach out?"
1014105-55 = "What if you were in the middle of urgent business?"
1014105-56 = "Or you could have been out of the office..."
1014105-57 = "Or maybe I would be disturbing your break, or you didn't feel like going outdoors at the time..."
1014105-58 = "I started overthinking, and then I started to hesitate."
1014105-59 = "I didn't want to shock you by showing up out of nowhere."
1014105-60 = "I just don't want to be a nuisance to you, Sensei."
1014105-61 = "[s] \"I guess any of those scenarios is possible.\""
1014105-62 = "I-I knew it...!"
1014105-63 = "[s5] \"But in the end, you contacted me, and they weren't.\"\n[s6] \"And so we were able to go on this fun night walk together.\""
1014105-66 = "Eh...?"
1014105-67 = "[s] \"Thank you for reaching out first, Haruka.\""
1014105-68 = "Th-That's..."
1014105-69 = "So, if something like this happens again, I shouldn't hesitate and just reach out...?"
1014105-70 = "Because I can't read your mind? So I have to just tell you?"
1014105-71 = ""
1014105-73 = ""
1014105-74 = "I-If that's the case, Sensei..."
1014105-75 = "Even if it's me... Someone like me..."
1014105-76 = "Can I ask you something, Sensei?"
1014105-77 = ""
1014105-79 = ""
1014105-80 = ""
1014105-82 = "Haruka took a hesitant step closer, pulling gently on my sleeve, even though she was clutching it with white knuckles."
1014105-83 = ""
1014105-85 = ""
1014105-86 = "Until we reach our destination... "
1014105-87 = "...could we walk just a little bit slower?"
1014105-89 = "I didn't have any reason to refuse."
1014105-90 = "Keeping a leisurely pace, Haruka and I enjoyed our long, nighttime stroll together. "
