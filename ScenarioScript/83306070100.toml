[translation]
83306070100-6 = "아, 부장님. 오셨군요."
83306070100-7 = "다친 사람이 많은 것 같은데, 무슨 일이 있었던 거지?"
83306070100-8 = "아…… 다름이 아니라, 이번에 있었던 저희 선도부의 정기 순찰 중. 문제아들과 조금 트러블이 있었거든요."
83306070100-9 = "그 일로 이오리를 포함, 선도부 부원들이 다수 부상을 입었습니다."
83306070100-10 = "이오리까지……? 그 정도로 심각한 트러블이었던 거야?"
83306070100-11 = "아, 그렇게 큰 건 아니었어요. 대부분 자잘한 찰과상을 입은 게 전부였는데……"
83306070100-12 = "참고로 이오리만 문제아들과 전투를 치르던 와중에 하필 하수구에 발이 빠져 넘어져 버렸거든요."
83306070100-14 = "나라고 거기 하수구 구멍이 있을 줄 알았겠냐고~!"
83306070100-17 = "……그래, 그것참 재난이었겠네."
83306070100-18 = "그렇다고는 해도 아무래도 응급의학부실에서 세나 선배가 부재중인 모양이라. 치료엔 다소 시간이 걸릴 듯합니다만……"
83306070100-19 = "흠. 그런 거라면 좋아. 나도 돕겠어."
83306070100-21 = "앗, 감사합니다. 부장님. 그럼 부탁드리겠습니다."
