[translation]
1005105-1 = "불타는 단장의 응원혼"
1005105-4 = "라멘 가게 앞"
1005105-9 = "저기……"
1005105-10 = "제가 오해를 한 게 아니라면, 저는 호객을 위해 응원 로봇을 주문했었는데요……."
1005105-11 = "……어째서 엔지니어부의 마이스터께서 직접 찾아오신 건가요?"
1005105-12 = "음, 그건 말이지……"
1005105-13 = "새로운 응원용 로봇을 만드는 데 실패했거든!"
1005105-14 = "앗…… 그, 그런가요…… 유감이네요."
1005105-15 = "하지만 걱정하지 않아도 괜찮아. 로봇은 준비하지 못했지만, 대신 내가 직접 응원을 하러 찾아왔으니까."
1005105-16 = "엔지니어부의 마이스터께서 직접 응원을 해주신다고요……?"
1005105-17 = "저…… 사람을 불러서 호객을 하는 거라면 다른 사람을 써도……."
1005105-18 = "괜찮아! 한번 맡은 일은 어떤 방법을 써서라도 최선을 다해 해결하는 게 마이스터의 책무니까."
1005105-19 = "게다가 비용에 관해서도 걱정할 필요 없어. 이 일은 내 실책으로 벌어진 일이니, 무료로 해 줄게."
1005105-20 = "그, 그렇다면 부탁드리겠습니다……."
1005105-24 = "자…… 그럼 이 라멘가게의 번영을 위해 전력으로 응원해볼까?"
1005105-29 = "힘내라, 스즈메 라멘!"
1005105-30 = "싸워라, 스즈메 라멘!"
1005105-31 = "이겨라, 스즈메 라멘!"
1005105-35 = "[ns] \"……뭐랑 싸워서 이기라는 거야?\""
1005105-36 = "뭐, 음식 가게를 운영하려면 여러 가지 문제와 늘 맞서 싸워야 하지 않겠어?"
1005105-37 = "가게 운영에 들어가는 비싼 임대료라든가, 위생 문제를 일으키는 해충이라든가……"
1005105-38 = "어, 엄청난 기합이네요. 목소리를 듣고만 있어도 뭔가 좋은 기운이 느껴지는 것 같아요……"
1005105-39 = "……그런데 어째서 가게 앞이 아니라 주방 앞에서 응원을……?"
1005105-40 = "그야 가게의 번창은 손님이 아닌, 주인의 의욕에 달려있으니까."
1005105-41 = "아무리 손님을 많이 호객해도 주인의 의욕이 없다면 다들 금세 떠나게 되는 법이라고."
1005105-42 = "그, 그렇군요…… 한 수 배웠습니다."
1005105-43 = "……잠깐. 그런데 지금 면 반죽을 하고 있는 거야?"
1005105-44 = "개점 시간이 얼마 남지 않았는데, 아직도 면 반죽을 하고 있다니……"
1005105-45 = "괜찮습니다. 어차피 개점하자마자 손님이 들어오는 경우는 거의 없고, 좀 더 느긋하게 음식 준비를 해도……"
1005105-50 = "괜찮을 리가 없잖아!"
1005105-51 = "라멘 가게의 생명은 속도! 주문 즉시 면을 삶아 나가지 않으면 그사이에 손님이 떠나버리고 만다고!"
1005105-52 = "그런 굼뜬 손놀림으로 스스로를 [ruby=마이스터]라멘 장인[/ruby]이라 자처할 수 있겠어?"
1005105-54 = "따, 딱히 저는 장인까지 되고 싶은 생각은 없—"
1005105-56 = "그런 말을 할 시간에 조금이라도 더 빠르게 손을 움직여!"
1005105-60 = "이, 이렇게요?"
1005105-61 = "그걸로는 모자라! 더 빨리! 더 빠르게 반죽을 치대!"
1005105-62 = "히, 히익……"
1005105-63 = "온 힘을 다해서! 열정을 다해서! 싸우는 거야!"
1005105-64 = "……네, 넵!"
1005105-69 = "……저기 봐. 라멘가게 주인이 응원단의 구호에 맞추어 면 반죽을 하고 있어."
1005105-70 = "엄청난 속도로 면을 치대고 있는데…… 숨겨진 라멘 장인의 가게인가?"
1005105-71 = "마침 라멘이 먹고 싶던 참이었는데. 오늘 점심은 저 라멘 가게에서 해결해 볼까?"
1005105-72 = "음, 좋지. ……여기 두 사람 주문이요!"
1005105-74 = "……네, 넵! 자, 잠시만 기다려주세요!"
1005105-75 = "평소와는 달리 가게를 열자마자 손님들이 엄청나게 모여들고 있잖아……?"
1005105-76 = "이, 이게 응원단의 위력……?"
1005105-80 = "후후, 응원 대성공이네."
1005105-81 = "자, 선생님. 그럼 다음 장소로 이동해볼까?"
1005105-87 = "……네? 부탁드렸던 응원 로봇이 완성되지 못했다고요?"
1005105-88 = "……음, 미안. 내 능력으로는 기한 내에 완성할 수가 없었어."
1005105-89 = "어, 어쩔 수 없지요. 제가 기한을 너무 촉박하게 드리기도 했거니와……."
1005105-90 = "하지만 괜찮아. 로봇 대신, 내가 응원단장으로서 직접 널 전력으로 응원해 줄 테니까!"
1005105-91 = "자, 네 고민을 어서 말해봐."
1005105-92 = "제, 제 고민은……"
1005105-96 = "저는 모모프렌즈의 빅브라더 님이 너무 좋아요. 모든 것을 꿰뚫어 보는 그 시선을 보고 있노라면 신비한 매력이 느껴지거든요."
1005105-97 = "그래서 오래전부터 빅브라더 팬클럽에 가입해서 활동하고 있는데…… 다가오는 다음 주에 팬클럽의 회장 선거가 열릴 예정이래요."
1005105-98 = "마음 같아서는 회장 선거에 나가 제가 얼마나 빅브라더 님을 좋아하는지 다른 회원들에게 말하고 싶은데…… 어쩐지 용기가 나질 않아요……."
1005105-99 = "자신의 마음에도 솔직하지 못한 제가, 모든 것을 꿰뚫어 본다는 빅브라더 님의 팬클럽 회장이 될 수는 없겠죠……."
1005105-105 = "너의 애정은 겨우 그 정도냐!"
1005105-107 = "네, 네에?!"
1005105-109 = "좋아하는 것을 좋아한다고 말하는 건 조금도 부끄러운 일이 아니야!"
1005105-110 = "자신의 마음에 솔직해져! 좀 더 용기를 내!"
1005105-111 = "그게 아니면…… 사실은 빅브라더 님이 부끄러운 거냐?"
1005105-112 = "그, 그렇지 않아요! 저는 정말로 빅브라더 님을 좋아한다고요!"
1005105-113 = "그럼 외쳐라! 빅브라더 님에 대한 본심을!"
1005105-114 = "저, 저는 빅브라더 님이 좋아요!"
1005105-115 = "더 크게!"
1005105-120 = "저는 빅브라더 님이 너무 좋아요!"
1005105-128 = "……저, 회원님? 어째서 이런 곳에서 소리를 지르고 계시나요?"
1005105-130 = "그, 그게 그러니까…… 빅브라더 님에 대한 애정을 표현하기 위해……"
1005105-132 = "아무리 빅브라더 님이 좋다고는 하지만 다른 사람이 오가는 길 한가운데에서 그렇게 당당하게 외치시다니……"
1005105-137 = "……감격했어요!"
1005105-139 = "……네?"
1005105-141 = "저희도 그동안 빅브라더 님에 대한 애정을 언제나 외치고 싶었지만, 사람들의 시선이 부끄러워 마음속으로만 삭여왔었는데……."
1005105-142 = "그 마음을 솔직하게 표현할 수 있다니, 대단한 용기예요!"
1005105-143 = "차기 회장은 당신이 제격이에요!"
1005105-145 = "저, 정말이신가요?"
1005105-146 = "저 같은 게…… 정말로 빅브라더 팬클럽의 회장 같은 게 될 수 있을까요?"
1005105-147 = "물론이지요!"
1005105-148 = "자, 우리 함께 빅브라더 님의 멋짐에 대해 크게 외치자고요!"
1005105-157 = "……이번에도 대성공이네!"
1005105-158 = "[s] \"엄청난 기세와 박력이야…….\""
1005105-159 = "후후, 칭찬해줘서 고마워."
1005105-160 = "하지만 여기서 머뭇거릴 시간이 없어. 우리의 응원을 기다리는 사람이 잔뜩 남아있으니까!"
1005105-162 = "(이후, 우타하와 시내 곳곳을 돌아다니며 시민들을 열심히 응원해주었다.)"
1005105-168 = "후우…… 정신없는 하루였네."
1005105-169 = "[s] \"오늘은 정말 수고 많았어.\""
1005105-170 = "아니야. 애초에 내가 기한을 맞추지 못해 생긴 문제고. 다행히 다들 만족한 것 같으니까."
1005105-171 = "게다가 가끔은 이렇게 기계를 사용하지 않고 직접 몸을 움직여보는 것도 나쁘지 않은 것 같아."
1005105-172 = "새로운 영감도 잔뜩 얻을 수 있었고…… 무엇보다도 예전의 초심을 떠올릴 수 있는 좋은 자극이 되었거든."
1005105-173 = "오늘의 경험을 바탕으로 다음번에는 더 좋은 발명품을 만들 수 있겠어."
1005105-177 = "[ns1] \"그나저나 아까 전부터 어째서……\"\n[ns2] \"속삭이듯이 말하고 있어?\""
1005105-182 = "그게……"
1005105-183 = "하루 종일 소리를 질러서 그런가……"
1005105-189 = "목소리가…… 안 나와……."
1005105-191 = "(이후, 목이 쉬어 버린 우타하를 부축하여 샬레로 돌아왔다.)"
