[translation]
1300115-1 = "바람이 오는 소리"
1300115-4 = "(치세의 모모톡을 받고 음양부 휴게실에 도착했다.)"
1300115-8 = "[ns] \"치세?\""
1300115-13 = "아, 선생님."
1300115-14 = "여기야~."
1300115-15 = "[s] \"마루에서 뭐 하고 있어?\""
1300115-16 = "해님이 지글지글한 날이니까……."
1300115-17 = "가만히 앉아 있었어."
1300115-18 = "안 그러면, 녹아 버릴지도 몰라~"
1300115-19 = "[s] \"하긴, 조금만 움직여도 땀이 나는 날이지.\""
1300115-20 = "자, 선생님도 같이 기다리자."
1300115-21 = "분명 들릴 테니까."
1300115-22 = "[s] \"전에 말했던 '바람이 오는 소리' 말이야?\""
1300115-23 = "응, 예쁜 소리야."
1300115-24 = "시원하기도 하고."
1300115-25 = "귀를 기울이면 금방 들릴 거야~"
1300115-26 = "[s] \"……?\""
1300115-27 = "자아, 선생님, 가만히 앉아서."
1300115-28 = "이렇게 귀를 기울이고, 조용히 기다리면……."
1300115-34 = "들었어?"
1300115-35 = "[s] \"종소리……?\""
1300115-36 = "조금 달라."
1300115-37 = "사실은~"
1300115-42 = "[ns] \"풍령이었구나?\""
1300115-43 = "응, 맞아~."
1300115-44 = "바람이 오는 소리, 매달아 뒀었어."
1300115-45 = "[s] \"확실히, 풍령이 울리면 바람이 분다는 신호겠네.\""
1300115-46 = "응, 맑은 소리."
1300115-47 = "이 풍령, 여름마다 달고 있어."
1300115-48 = "특별히 아끼는 풍령이니까."
1300115-49 = "[s] \"평범한 것 같은데……?\""
1300115-50 = "그렇게 보이지만……."
1300115-51 = "다른 풍령보다 더 파란 소리가 나니까."
1300115-52 = "[s] \"파란…… 소리?\""
1300115-53 = "응, 그래서 매년 같은 장소에 매달아 둬."
1300115-54 = "항상 맑고 파란 소리를 들려달라고 부탁하면서."
1300115-59 = "그러니까, 선생님도 같이 듣자."
1300115-60 = "여기, 마루에 누워 봐."
1300115-64 = "이렇게에."
1300115-71 = "(일단 치세와 나란히 마루에 누워 보았다.)"
1300115-74 = "그럼, 선생님."
1300115-75 = "조용히 귀를 기울이는 거야."
1300115-76 = "[s] \"…….\""
1300115-81 = "[ns1] \"응, 파랗고 맑은 소리네.\"\n[ns2] \"응, 파랗고 청량한 소리네.\""
1300115-84 = "그렇지?"
1300115-85 = "아, 선생님. 시상이 떠올랐어."
1300115-89 = "더#n운#n여#n름#n날"
1300115-91 = "마#n루#n위#n에#n누#n우#n면"
1300115-93 = "스#n치#n는#n바#n람"
1300115-98 = "(이후, 한동안 치세와 나란히 누워 풍령 소리를 들었다…….)"
