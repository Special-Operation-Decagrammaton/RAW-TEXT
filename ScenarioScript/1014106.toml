[translation]
1014106-1 = "如雜草一般"
1014106-2 = "美術館大廳"
1014106-3 = "（走進了與遙香約好碰面的美術館大廳）"
1014106-4 = "您，您好，老師……！"
1014106-5 = ""
1014106-7 = ""
1014106-8 = "[ns1] 「你好，遙香！」\n[ns2] 「打扮得很漂亮呢！」"
1014106-11 = "嗚，嗚耶耶……"
1014106-12 = "那，那個……我想說美術館這種地方，那個……好像多少得打扮一下再來……"
1014106-13 = "所，所以我才這樣穿的……"
1014106-14 = "還，還有……因為老師也說過很漂亮……"
1014106-15 = ""
1014106-17 = ""
1014106-18 = "啊，不是嗎？難道是我搞錯了嗎！？是我一個人得意忘形了嗎！？"
1014106-19 = "[s3] 「不。」\n[s4] 「怎麼會。」\n[s5] 「完美無缺。」"
1014106-23 = "呼，呼耶耶…… "
1014106-24 = "完，完美這個詞，用在我，我這種人身上……嗚嗚嗚……"
1014106-25 = "[s] 「話說回來，這是個什麼樣的展覽會啊？」"
1014106-26 = "啊，我竟然忘了說最重要的事！"
1014106-27 = "這，這是個以「雜草」為主題的展覽會。"
1014106-28 = "集結了十位知名藝術家，展覽了以雜草為主題而創作的各式藝術品……"
1014106-29 = "那些藝術家之中，也有狂獵的學生……"
1014106-30 = "……手冊上是這麼寫的。"
1014106-31 = "[s] 「確實是遙香會感興趣的展覽會呢。」"
1014106-32 = "那，那句話的意思是……"
1014106-33 = "難道老師對這個主題不感興趣……"
1014106-34 = "對，對不起！票錢我會想辦法還給您的……！"
1014106-35 = "[s] 「先，先進去看看吧！」"
1014106-36 = "咦？啊，是的！！"
1014106-38 = "（就這樣，與遙香一同進入了展場）"
1014106-40 = "展場內部"
1014106-41 = ""
1014106-42 = "哇……"
1014106-43 = "[s6] 「遙香，你看看這個。」\n[s7] 「連真正的雜草都展示出來了。」"
1014106-46 = "真的嗎！？"
1014106-47 = ""
1014106-49 = ""
1014106-50 = ""
1014106-51 = ""
1014106-52 = "老師，那，那個好像不是真的雜草。"
1014106-53 = "雖然非常相似……但不是真的。"
1014106-54 = "[s8] 「……真的耶！？」\n[s9] 「是用金屬板加工做出來的！」"
1014106-57 = "用，用真的雜草做的作品在這邊。"
1014106-58 = "聽說是把雜草貼在畫布上做成的畫。"
1014106-59 = "啊，這麼說來那邊……"
1014106-60 = ""
1014106-62 = ""
1014106-64 = "（就這樣，與遙香一起悠閒地參觀了寧靜的展覽館）"
1014106-65 = "（偶爾還會以悄悄話交換感想）"
1014106-67 = "每一件都是很了不起的作品呢。"
1014106-68 = "而且……展覽館比想像中還寬敞。"
1014106-69 = "[s] 「那要不要稍微休息一下？」"
1014106-70 = "咦？啊，好的！"
1014106-72 = "（與遙香一起暫時離開展覽室，來到了室外的走廊）"
1014106-73 = ""
1014106-74 = "[ns] 「怎麼樣，遙香？」"
1014106-75 = "我，我很喜歡。"
1014106-76 = "同時也感到十分讚嘆，原來能用雜草做出那麼多樣又美麗的作品啊……"
1014106-77 = "不，不過那個……"
1014106-78 = "嗯……"
1014106-79 = "[s] 「你好像有什麼在意的地方呢。」"
1014106-80 = "……是的。"
1014106-81 = "可是……我真的可以說出來嗎？"
1014106-82 = "這些都是比我聰明、手藝比我好的人製作的作品，如果我對此提出意見……"
1014106-83 = "萬一說錯了什麼……"
1014106-84 = "[s] 「說錯就說錯嘛。」"
1014106-85 = "……咦？"
1014106-86 = "[s10] 「任何人都有可能會出錯。」\n[s11] 「我、遙香，還有做出這些作品的人們都一樣。」"
1014106-89 = "……"
1014106-90 = "……其實，我覺得每一件都是很棒的作品。"
1014106-91 = "光是能把雜草描繪得如此美麗，就讓我非常地驚訝。"
1014106-92 = "可是……"
1014106-95 = "― [log=하루카 드레스]……我喜歡雜草，並不是因為，它很美麗。[/log][wa:6360] "
1014106-97 = "― [log=하루카 드레스]我喜歡雜草那堅強的一面。 [/log][wa:2889] "
1014106-100 = "― [log=하루카 드레스]無論在多麼貧瘠的地方都能堅強地紮根，頑強地生存──[/log][wa:3790] "
1014106-102 = "― [log=하루카 드레스]那正是，我的理想。[/log][wa:2046] "
1014106-105 = "― [log=하루카 드레스]沒有必要保持美麗。[/log][wa:933] "
1014106-107 = "― [log=하루카 드레스]就算不耀眼也沒關係。 [/log][wa:1385] "
1014106-110 = "― [log=하루카 드레스]只要能和重要的人一起度過……[/log][wa:3878] "
1014106-112 = "― [log=하루카 드레스]只，只要能和老師待在一起…… [/log][wa:2971] "
1014106-115 = "― [log=하루카 드레스]我就是因為這樣……[/log][wa:5324] "
1014106-117 = "― [log=하루카 드레스]……才會喜歡的。 [/log][wa:1955] "
1014106-121 = "（之後和遙香看完剩下的展覽，一起踏上了歸途）"
