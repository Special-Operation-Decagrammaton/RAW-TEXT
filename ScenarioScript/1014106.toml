[translation]
1014106-1 = "잡초와 같은"
1014106-2 = "미술관 로비"
1014106-3 = "(하루카와 만나기로 약속한 미술관 로비로 들어갔다.)"
1014106-4 = "아, 안녕하세요, 선생님……!"
1014106-8 = "[ns1] \"안녕, 하루카!\"\n[ns2] \"예쁘게 입고 왔네!\""
1014106-11 = "으, 으에에에……."
1014106-12 = "그, 그게, 미술관 같은 곳이면 그…… 어느 정도 차려 입고 와야 할 것 같기도 하고……."
1014106-13 = "그, 그래서 입은 거긴 한데요……."
1014106-14 = "그, 그리고 선생님이 예쁘다고도 하셨……으니까……."
1014106-18 = "아, 아닌가요? 혹시 제가 뭔가를 잘못 알고 있었던 건가요?! 뭔가 혼자 들떠서 유난을 떨어 버린 건가요?!"
1014106-19 = "[s3] \"아냐.\"\n[s4] \"그럴 리가.\"\n[s5] \"완벽해.\""
1014106-23 = "흐, 흐에에에……."
1014106-24 = "와, 완벽이라는 단어를 저, 저 같은 것한테 쓰시는 건…… 으우우……."
1014106-25 = "[s] \"그나저나, 이 전시회는 어떤 전시회야?\""
1014106-26 = "앗, 제일 중요한 걸 말씀드리지 않았군요!"
1014106-27 = "이, 이 전시회는 '잡초'를 주제로 한 전시회예요."
1014106-28 = "유명한 예술가 10인이 잡초를 테마로 하여 제작한 다양한 예술품들이 출품된 전시회이고……."
1014106-29 = "그 예술가들 중에는 와일드헌트의 학생들도 있다……."
1014106-30 = "……라고 팸플릿에 적혀 있어요."
1014106-31 = "[s] \"확실히 하루카라면 관심 가질 만한 전시회네.\""
1014106-32 = "그, 그 말씀은……."
1014106-33 = "혹시 선생님께서는 관심이 없으신 주제라는……."
1014106-34 = "죄, 죄송합니다! 티켓 값은 제가 어떻게든 환불을 해 올 테니까……!"
1014106-35 = "[s] \"이, 일단 들어가볼까!\""
1014106-36 = "네? 아, 넵!!"
1014106-38 = "(그렇게 하루카와 함께 전시장 안으로 들어갔다.)"
1014106-40 = "전시장 내부"
1014106-42 = "와……."
1014106-43 = "[s6] \"하루카, 이것 좀 봐.\"\n[s7] \"진짜 잡초도 전시해 뒀어.\""
1014106-46 = "진짜요?!"
1014106-52 = "선생님, 그, 그건 진짜 잡초가 아닌 것 같아요."
1014106-53 = "굉장히 비슷하긴 하지만…… 진짜는 아니에요."
1014106-54 = "[s8] \"……정말이네?!\"\n[s9] \"금속판을 세공해서 만든 거였어!\""
1014106-57 = "지, 진짜 잡초로 만든 작품은 이쪽에 있어요."
1014106-58 = "잡초들을 캔버스 위에 붙여서 그림으로 만든 거래요."
1014106-59 = "어, 그러고보니 저 쪽에는……."
1014106-64 = "(그렇게 하루카와 함께 조용한 전시관을 천천히 관람했다.)"
1014106-65 = "(틈틈이, 속삭이듯이 감상을 나누면서.)"
1014106-67 = "하나하나가 굉장한 작품들이네요."
1014106-68 = "그리고…… 전시관이 생각보다 넓고요."
1014106-69 = "[s] \"그럼 잠깐 쉬었다 갈까?\""
1014106-70 = "예? 아, 예!"
1014106-72 = "(하루카와 함께, 잠시 전시실 밖 복도로 나왔다.)"
1014106-74 = "[ns] \"어땠어, 하루카?\""
1014106-75 = "조, 좋았어요."
1014106-76 = "잡초를 가지고 이렇게 다양하고 아름다운 작품들을 만들 수 있구나…… 하고 감탄하기도 했고요."
1014106-77 = "그…… 그렇지만……."
1014106-78 = "그…… 음……."
1014106-79 = "[s] \"뭔가 걸리는 게 있구나.\""
1014106-80 = "……예."
1014106-81 = "하지만…… 제가 말을 해도 괜찮은 걸까요?"
1014106-82 = "저보다 훨씬 똑똑하고 솜씨 좋은 분들이 만든 작품들인데, 제가 거기에 토를 달거나 하면……."
1014106-83 = "또 그러다 틀리기라도 하면……."
1014106-84 = "[s] \"틀리면 되지 뭐.\""
1014106-85 = "……네?"
1014106-86 = "[s10] \"누구나 틀릴 수 있어.\"\n[s11] \"나도, 하루카도, 그리고 이 작품들을 만든 사람들도.\""
1014106-89 = "……."
1014106-90 = "……사실, 모두 정말 멋진 작품들이라고 생각해요."
1014106-91 = "잡초들을 이렇게 아름답게 묘사할 수 있었다는 것 자체가 많이 놀라웠어요."
1014106-92 = "그렇지만……."
1014106-95 = "[wa:1237]― [log=하루카 드레스]……잡초를 좋아하는 건, [wa:2713]아름다워서가 [wa:2130]아니에요.[/log]"
1014106-97 = "― [log=하루카 드레스]저는, [wa:1631]잡초의 [wa:938]꿋꿋함이 좋아요.[wa:120] [/log]"
1014106-100 = "[wa:637]― [log=하루카 드레스]어떤 척박한 곳이라도 [wa:1571]강하게 뿌리내리는, [wa:1382]끈질김이…….[/log]"
1014106-102 = "― [log=하루카 드레스]그것이야말로, [wa:1846]저의 이상.[/log]"
1014106-105 = "[wa:613]― [log=하루카 드레스]아름다운 모습일 필요는 없어요.[/log]"
1014106-107 = "― [log=하루카 드레스]빛나지 않아도 [wa:1265]괜찮아요. [/log]"
1014106-110 = "[wa:1243]― [log=하루카 드레스]소중한 사람들과, [wa:2195]그저 함께할 수 있다면…….[/log]"
1014106-112 = "― [log=하루카 드레스]서, [wa:801]선생님과 [wa:1930]함께 할 수 있다면…… [/log]"
1014106-115 = "[wa:3643]― [log=하루카 드레스]저는, [wa:1641]그걸로…….[/log]"
1014106-117 = "― [log=하루카 드레스]……좋아, [wa:1875]해요.[wa:40] [/log]"
1014106-121 = "(이후, 남은 관람을 마무리한 뒤 하루카와 함께 돌아왔다.)"
