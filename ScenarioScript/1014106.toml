[translation]
1014106-1 = "เฉกเช่นวัชพืช"
1014106-2 = "ล็อบบี้ พิพิธภัณฑ์ศิลปะ"
1014106-3 = "(คุณครูเข้าไปในล็อบบี้พิพิธภัณฑ์ศิลปะที่นัดกับฮารุกะไว้)"
1014106-4 = "สะ... สวัสดีค่ะ คุณครู...!"
1014106-5 = ""
1014106-7 = ""
1014106-8 = "[ns1] \"สวัสดี ฮารุกะ ใส่ชุดเดรสมาเหรอเนี่ย?\"\n[ns2] \"สวัสดี ฮารุกะ แต่งตัวมาสวยเลยนะ!\""
1014106-11 = "อะ... อ่า..."
1014106-12 = "มะ... มาพิพิธภัณฑ์ศิลปะทั้งที... ฉันเลยคิดว่าควรแต่งตัวให้เหมาะกับสถานที่... "
1014106-13 = "ก็เลยหยิบชุดนี้มาใส่น่ะค่ะ..."
1014106-14 = "ละ... แล้วคุณครูก็เคยบอกไว้ว่าสวย... ด้วย..."
1014106-15 = ""
1014106-17 = ""
1014106-18 = "ระ... หรือว่าไม่ใช่คะ? ฉันอาจเข้าใจอะไรผิดไปหรือเปล่า?! นี่ฉันคิดไปเองคนเดียว#nจนดีใจเกินเหตุเหรอคะ?!"
1014106-19 = "[s3] \"ไม่ใช่หรอก นี่ละสมบูรณ์แบบแล้ว\"\n[s4] \"ไม่หรอก สมบูรณ์แบบแล้วละ\"\n[s5] \"ไม่ได้คิดไปเองหรอก สมบูรณ์แบบแล้วละ\""
1014106-23 = "แหะ... แหะๆๆ... "
1014106-24 = "ชะ... ใช้คำว่าสมบูรณ์แบบกับคะ... คนอย่างฉันได้ด้วยเหรอคะ... อึก..."
1014106-25 = "[s] \"ว่าแต่นี่คือนิทรรศการอะไรเหรอ?\""
1014106-26 = "อ๊ะ ฉันยังไม่ได้บอกสิ่งที่สำคัญที่สุดสินะคะ!"
1014106-27 = "นะ... นิทรรศการนี้มีธีมหลักเป็น 'วัชพืช' ค่ะ"
1014106-28 = "นี่เป็นงานนิทรรศการที่จัดแสดงผลงานศิลปะต่างๆ ที่รังสรรค์โดยศิลปินชื่อดัง 10 คน ภายใต้ธีม 'วัชพืช'..."
1014106-29 = "ในบรรดาศิลปินเหล่านั้น เห็นว่ามีนักเรียนจากไวลด์ฮันต์ด้วยนะคะ..."
1014106-30 = "ฉันอ่านเจอมาในแผ่นพับน่ะค่ะ..."
1014106-31 = "[s] \"งั้นก็เป็นนิทรรศการที่ตรงกับความสนใจของฮารุกะเลยนะ\""
1014106-32 = "พะ... พูดแบบนั้นหมายความว่า..."
1014106-33 = "มันเป็นเรื่องที่คุณครูไม่ได้สนใจหรือเปล่า..."
1014106-34 = "ขะ... ขอโทษด้วยค่ะ! ไว้ฉันจะไปขอรีฟันด์ตั๋วเข้าชมมาให้...!"
1014106-35 = "[s] \"ขะ... เข้าไปข้างในกันก่อนเถอะ!\""
1014106-36 = "คะ? อ่า ค่ะ!!"
1014106-38 = "(แล้วคุณครูก็เข้าไปในหอนิทรรศการกับฮารุกะ)"
1014106-40 = "ภายในหอนิทรรศการ"
1014106-41 = ""
1014106-42 = "ว้าว..."
1014106-43 = "[s6] \"ฮารุกะ ดูนี่สิ วัชพืชของจริงเลยละ\"\n[s7] \"มีวัชพืชของจริงมาจัดแสดงด้วย\""
1014106-46 = "จริงเหรอคะ?!"
1014106-47 = ""
1014106-49 = ""
1014106-50 = ""
1014106-51 = ""
1014106-52 = "คุณครู อะ... อันนั้นเหมือนจะไม่ใช่วัชพืชของจริงนะคะ"
1014106-53 = "ถึงมันจะคล้ายกันมาก... แต่ว่าไม่ใช่ของจริงค่ะ"
1014106-54 = "[s8] \"จริงด้วยแฮะ...?!\"\n[s9] \"เป็นการสลักแผ่นโลหะนี่เอง!\""
1014106-57 = "ผล... ผลงานที่ทำจากวัชพืชจริงๆ อยู่ทางนี้ค่ะ"
1014106-58 = "ได้ยินว่าทำขึ้นโดยการนำวัชพืชมาติดลงบนผืนผ้า จนได้เป็นรูปภาพขึ้นมาค่ะ"
1014106-59 = "อ๊ะ พอดูดีๆ แล้ว ตรงนั้นคือ..."
1014106-60 = ""
1014106-62 = ""
1014106-64 = "(คุณครูกับฮารุกะเดินชมงานศิลปะไปทั่วหอนิทรรศการที่เงียบสงบ)"
1014106-65 = "(และกระซิบบอกความประทับใจให้กันฟังเป็นครั้งคราว)"
1014106-67 = "เป็นผลงานที่ยอดเยี่ยมทุกชิ้นเลยนะคะ"
1014106-68 = "อีกอย่าง... หอนิทรรศการก็กว้างกว่าที่คิดไว้เยอะเลยค่ะ"
1014106-69 = "[s] \"งั้นเราพักกันสักเดี๋ยวมั้ย?\""
1014106-70 = "คะ? อ่า ค่ะ!"
1014106-72 = "(คุณครูเดินออกมายังทางเดินด้านนอกหอนิทรรศการกับฮารุกะ)"
1014106-73 = ""
1014106-74 = "[ns] \"เป็นยังไงบ้าง ฮารุกะ?\""
1014106-75 = "ฉะ... ฉันชอบมากเลยค่ะ"
1014106-76 = "แล้วฉันก็ทึ่งมากด้วยค่ะ... ไม่คิดเลยว่าวัชพืชจะสามารถเอามาทำเป็นผลงานที่สวยงามได้ขนาดนี้"
1014106-77 = "ตะ... แต่ว่า..."
1014106-78 = "เอ่อ... อืม..."
1014106-79 = "[s] \"มีเรื่องอะไรคาใจอยู่สินะ\""
1014106-80 = "ค่ะ..."
1014106-81 = "แต่ว่า... ให้ฉันพูดออกมาได้เหรอคะ?"
1014106-82 = "ผลงานเหล่านั้นสร้างสรรค์โดยผู้คนที่ฉลาดและมีฝีมือมากกว่าฉันมาก ถ้าฉันเข้าไปวิจารณ์..."
1014106-83 = "และถ้าฉันเกิดทำผิดพลาดในระหว่างนั้น..."
1014106-84 = "[s] \"จะผิดก็ไม่เห็นเป็นไรเลย\""
1014106-85 = "คะ...?"
1014106-86 = "[s10] \"ใครๆ ก็ผิดพลาดได้นะ\"\n[s11] \"ทั้งครู ฮารุกะ และเจ้าของงานศิลปะ ใครก็ผิดพลาดได้ทั้งนั้น\""
1014106-89 = "..."
1014106-90 = "ที่จริงแล้ว ฉันคิดว่าผลงานทั้งหมดนั้นยอดเยี่ยมมากค่ะ..."
1014106-91 = "แค่การถ่ายทอดวัชพืชออกมาเป็นงานศิลปะแบบนั้นได้ก็เป็นเรื่องที่น่าทึ่งแล้วค่ะ"
1014106-92 = "แต่ว่า..."
1014106-95 = "― [log=하루카 드레스]ที่ฉันชอบพวกวัชพืช... ไม่ใช่เพราะมันสวยงามหรอกค่ะ[/log][wa:5160] "
1014106-97 = "― [log=하루카 드레스]ฉันชอบความทรหดของวัชพืชค่ะ [/log][wa:2329] "
1014106-100 = "― [log=하루카 드레스]ถึงจะอยู่ในพื้นที่แห้งแล้ง ก็ยังหยั่งรากลึกอย่างแข็งแกร่ง ความอุตสาหะนั้นน่ะ...[/log][wa:1630] "
1014106-102 = "― [log=하루카 드레스]คืออุดมคติของฉัน[/log][wa:1766] "
1014106-105 = "― [log=하루카 드레스]ไม่จำเป็นต้องมีรูปลักษณ์ที่สวยงามหรอกค่ะ[/log][wa:10] "
1014106-107 = "― [log=하루카 드레스]ต่อให้ไม่เปล่งประกายก็ไม่เป็นไรค่ะ[/log][wa:465] "
1014106-110 = "― [log=하루카 드레스]ขอแค่ได้อยู่ร่วมกับคนที่สำคัญ...[/log][wa:3158] "
1014106-112 = "― [log=하루카 드레스]ถะ... ถ้าได้ อยู่กับคุณครู...[/log][wa:2411] "
1014106-115 = "― [log=하루카 드레스]แค่นั้นฉันก็...[/log][wa:5084] "
1014106-117 = "― [log=하루카 드레스]ดีใจ... แล้วค่ะ [/log][wa:1675] "
1014106-121 = "(หลังจากนั้นคุณครูก็ชมนิทรรศการต่อกับฮารุกะแล้วกลับมาพร้อมกัน) "
