[translation]
1014106-1 = "Like a Weed"
1014106-2 = "Art Gallery Lobby"
1014106-3 = "I arrived at the lobby of the art gallery where I had agreed to meet Haruka."
1014106-4 = "H-Hello, Sensei...!"
1014106-5 = ""
1014106-7 = ""
1014106-8 = "[ns1] \"Hello, Haruka!\"\n[ns2] \"You look so pretty again!\""
1014106-11 = "Uuu... Uwaaaah..."
1014106-12 = "U-Um, I thought that I should dress formally...for an art gallery..."
1014106-13 = "So I wore this..."
1014106-14 = "A-And, you said that I was pretty when I wore it, Sensei... So..."
1014106-15 = ""
1014106-17 = ""
1014106-18 = "M-Maybe not? Did I misunderstand somehow?! Did I get carried away?!"
1014106-19 = "[s3] \"No.\"\n[s4] \"Of course not.\"\n[s5] \"It's perfect.\""
1014106-23 = "W-Waaah... "
1014106-24 = "S-Saying the word \"perfect\" to s-someone like me... Huuuu..."
1014106-25 = "[s] \"By the way, what kind of exhibition is this?\""
1014106-26 = "Ah, I forgot to mention the most important thing!"
1014106-27 = "Th-This exhibition is themed around \"weeds.\""
1014106-28 = "It features a variety of works from 10 different artists, all focused on weeds in one form or another."
1014106-29 = "And among those artists are students from Wildhunt..."
1014106-30 = "...That's what it says in the pamphlet."
1014106-31 = "[s] \"This exhibition is right up your alley, Haruka.\""
1014106-32 = "Wh-When you say that..."
1014106-33 = "Of course this is something only I would enjoy! Why would you want to go look at some art about WEEDS?"
1014106-34 = "I-I'm sorry! I'll return your ticket right away!"
1014106-35 = "[s] \"S-Stop! Let's just go inside!\""
1014106-36 = "Huh? Ah, okay!!"
1014106-38 = "Despite the shaky start, Haruka and I headed inside the exhibition hall."
1014106-40 = "Inside the Exhibition Hall"
1014106-41 = ""
1014106-42 = "Whoa..."
1014106-43 = "[s6] \"Take a look at this, Haruka.\"\n[s7] \"They even have real weeds on display.\""
1014106-46 = "Really?!"
1014106-47 = ""
1014106-49 = ""
1014106-50 = ""
1014106-51 = ""
1014106-52 = "Sensei, I-I don't think those are real weeds."
1014106-53 = "They look very similar, but...they're actually fake."
1014106-54 = "[s8] \"...Oh, you're right!\"\n[s9] \"These were crafted from metal!\""
1014106-57 = "Th-There's a piece that actually is made from actual weeds over here."
1014106-58 = "They made it by attaching weeds to a canvas."
1014106-59 = "Oh, and over there..."
1014106-60 = ""
1014106-62 = ""
1014106-64 = "I took my time exploring the quiet exhibition hall with Haruka."
1014106-65 = "Whispering in the quiet rooms, we shared our thoughts on the different pieces."
1014106-67 = "Every piece is really unique. It's amazing."
1014106-68 = "And...the exhibition hall is bigger than I expected."
1014106-69 = "[s] \"Should we take a little break?\""
1014106-70 = "Eh? Ah, sure!"
1014106-72 = "Haruka and I stepped out into a hallway to take a quick breather."
1014106-73 = ""
1014106-74 = "[ns] \"How was it, Haruka?\""
1014106-75 = "I-It was nice."
1014106-76 = "I didn't know that so many different and beautiful art pieces could come from weeds."
1014106-77 = "B-But..."
1014106-78 = "Well... Um..."
1014106-79 = "[s] \"Something's bothering you.\""
1014106-80 = "...Yes."
1014106-81 = "But is it...okay for me to feel that way?"
1014106-82 = "All the artists who made these are a million times smarter and more talented than I am... So for someone like me to criticize them..."
1014106-83 = "Even worse, if I make some kind of mistake..."
1014106-84 = "[s] \"It's okay to make mistakes.\""
1014106-85 = "...What?"
1014106-86 = "[s10] \"Everybody makes mistakes.\"\n[s11] \"Like me, you, and even the people who made these pieces.\""
1014106-89 = "..."
1014106-90 = "...I really do think they're all really beautiful."
1014106-91 = "I was really surprised that weeds could be depicted like that."
1014106-92 = "Still..."
1014106-95 = "― [log=하루카 드레스]...I don't like weeds for their looks.[/log][wa:5600] "
1014106-97 = "― [log=하루카 드레스]I like how resilient they are. [/log][wa:2169] "
1014106-100 = "― [log=하루카 드레스]The tenacity with which they take root, even in the most barren of places...[/log][wa:1750] "
1014106-102 = "― [log=하루카 드레스]I think that's the ideal, for me.[/log][wa:1086] "
1014106-105 = "― [log=하루카 드레스]It doesn't have to be pretty.[/log][wa:133] "
1014106-107 = "― [log=하루카 드레스]Nor does it have to shine. [/log][wa:745] "
1014106-110 = "― [log=하루카 드레스]As long as I can be with those who are precious to me...[/log][wa:2198] "
1014106-112 = "― [log=하루카 드레스]A-As long as I can be with Sensei... [/log][wa:2091] "
1014106-115 = "― [log=하루카 드레스]For me...[/log][wa:5324] "
1014106-117 = "― [log=하루카 드레스]...that's what I like. [/log][wa:1395] "
1014106-121 = "We went back inside after that. Haruka and I explored the rest of the exhibition, then headed home. "
