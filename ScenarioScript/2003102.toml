[translation]
2003102-1 = "호화롭게"
2003102-2 = "(우연히 붉은겨울 학원 근처를 지날 일이 있어, 과자와 초콜릿을 사 구교사에 들렀다.)"
2003102-15 = "……아, 선생님."
2003102-16 = "미안. 말린 열매를 정리하느라 정신이 팔려서 누가 오는 줄도 모르고 있었네."
2003102-17 = "전에 모모톡으로 말했던 다다미를 가지러 온 거지?"
2003102-18 = "잠시만 기다려 줘. 금방 정리를 마치고 안내해 줄 테니까……"
2003102-19 = "[s] \"천천히 해도 괜찮아. 급한 일도 아니니까.\""
2003102-23 = "[ns1] \"자, 그보다 이것부터 받아.\"\n[ns2] \"전에 말했던 과자와 초콜릿이야.\""
2003102-26 = "우와, 정말로 사 온 거야?"
2003102-27 = "그냥 지나가는 말처럼 한 이야기였는데 기억해 주고 있었다니, 감격스러운걸."
2003102-32 = "고마워, 선생님. 다른 학생들과 나누어 먹을게."
2003102-33 = "[s] \"그나저나 아직도 유카타를 입고 있었네.\""
2003102-34 = "응. <227호 온천장>을 운영할 때 단체로 맞춘 것인데……"
2003102-35 = "이제 온천장을 운영할 일은 없겠지만, 좋은 소재로 만든 옷인지라. 구교사 안에서 홈웨어 대용으로 입기에는 나쁘지 않더라고."
2003102-39 = "……그러고 보면 온천장은 사라졌지만 생각보다 많은 것이 남았네."
2003102-40 = "이렇게 다다미나 유카타처럼 유용하게 쓸 수 있는 비품도 잔뜩 남아 있고……"
2003102-41 = "손님을 받을 수 있는 규모는 아니지만, 한두 사람 정도 들어갈 수 있는 수준의 탕도 아직은 남아 있으니까."
2003102-42 = "당분간은 추운 겨울에도 따듯한 물로 몸을 씻을 수 있겠어."
2003102-46 = "[ns3] \"잠깐, 따듯한 물로 몸을 씻을 수 있다니……\"\n[ns4] \"그럼 그 전에는 어떻게 목욕을 했던 거야?\""
2003102-49 = "뭐야, 선생님. 학생들이 어떻게 목욕하는지에 관심이 있는 거야?"
2003102-50 = "선생님도 참 음흉하다니까~"
2003102-54 = "……뭐, 선생님이니까. 그 정도는 가르쳐 주어도 상관없으려나."
2003102-55 = "사실 구교사에는 제대로 된 목욕 시설이 없었기 때문에 온천이 생기기 전에는 보통 근처의 강에서 목욕을 했었어."
2003102-56 = "겨울에는 얼음이 꽝꽝 얼어붙을 정도로 춥긴 하지만, 얼음을 깨고 들어가면 씻는 데에는 큰 문제가 없었으니까……"
2003102-57 = "[s5] \"얼음물에서 목욕을 하는 건 너무 위험하지 않아?!\"\n[s6] \"필요하다면 샬레의 샤워실을 사용해도 괜찮아.\""
2003102-60 = "후후, 선생님은 상냥하네."
2003102-61 = "제안은 고맙지만 사양할게. 샬레는 붉은겨울 학원에서 멀리 떨어져 있으니까, 샤워만 하러 찾아가기에는 품이 더 들 것 같거든."
2003102-62 = "게다가 아까도 말했지만 작은 규모의 온천은 아직도 남아 있으니까. 더 이상 얼어붙은 강 속에서 목욕을 할 일은 없을 거야."
2003102-63 = "게다가 안 그래도 오늘은 마침 탕을 새롭게 개조해 보려던 참이어서……"
2003102-64 = "[s] \"탕을 개조한다고……?\""
2003102-65 = "응. 전에 온천장을 운영할 때 손님들에게 들었는데, 유명한 온천장에는 과일이나 향료를 넣어서 색과 향을 입힌 특별한 탕이 있다고 하더라고."
2003102-66 = "이렇게 하면 온천의 향도 산뜻해질뿐더러, 피부로 좋은 성분을 흡수할 수 있어서 탕치에도 효과적이래."
2003102-67 = "다른 재료라면 몰라도 과일과 향료라면 구교사의 부지에서도 얼마든지 구할 수 있으니까. 생각이 난 김에 남아있는 작은 온천을 특별탕으로 개조해 보았어."
2003102-68 = "우리 구교사 특별반에는 주전부리도 충분치 않고, 여흥으로 즐길 수 있는 소일거리도 거의 없으니까……"
2003102-73 = "목욕만큼이라도 호화롭게 즐길 수 있다면, 기분 전환에 도움이 되지 않을까 싶어서."
2003102-74 = "[s7] \"좋은 생각이네.\"\n[s8] \"분명 다른 학생들도 기뻐할 거야.\""
2003102-77 = "후후, 그랬으면 좋겠네."
2003102-78 = "아, 선생님. 말이 나온 참에 한 번 탕에 먼저 들어가 볼래?"
2003102-79 = "나는 이곳에서 정리를 하느라 시간이 더 필요할 것 같아서."
2003102-80 = "선생님이 먼저 탕에 들어가 보고 감상을 알려줬으면 좋겠어."
2003102-81 = "[s] \"그런 특별한 탕을 내가 먼저 사용해도 괜찮은 거야?\""
2003102-82 = "응, 물론이야. 선생님에게는 평소에도 이것저것 많은 도움을 받고 있으니까."
2003102-83 = "즐거운 목욕이 되었으면 좋겠네~"
2003102-85 = "(잠시 후, 시구레의 안내를 받아 새로 만들었다는 특별탕에 들어갔다.)"
2003102-89 = "(탕에 첨가한 향료 탓인지, 온천수는 루비처럼 붉은 빛을 띄고 있었다……)"
2003102-94 = "[ns9] \"은은하게 퍼지는 과일 향이 나쁘지는 않은데……\"\n[ns10] \"어쩐지 피부가 달아오르는 느낌이……\""
2003102-99 = "아, 선생님. 물의 온도는 괜찮아?"
2003102-100 = "[s11] \"응. 온도는 딱 좋긴 한데……\"\n[s12] \"온천에 무슨 향료를 섞은 거야?\""
2003102-103 = "글쎄. 그렇게 대단한 건 넣지 않았어. 기껏해야 포도 정도……?"
2003102-104 = "……다만 발효되었지만."
2003102-108 = "[ns] \"발효라니, 설마……\""
2003102-109 = "응. 온천수에 와인을 섞었어. 증류된 브랜디가 섞인 강화 와인으로."
2003102-110 = "이야~ 정말 구하는 데 애를 먹었다니까. 입욕 효과를 낼 수 있을 정도로 강한 와인은 나도 그동안 한 번도 취급해 본 적이 없었거든."
2003102-111 = "[s] \"어째서 온천수에 와인을 섞은 거야?!\""
2003102-112 = "으응? 선생님, 모르는 거야? 적당한 와인은 오히려 건강에 도움이 된다고."
2003102-113 = "하루 한 잔의 와인은 혈관을 확장시켜 콜레스테롤 수치를 낮춰주고, 세포의 노화를 유발하는 활성산소를 제거해 준다고 해."
2003102-114 = "하지만 선생님이 학생은 술을 마시면 안 된다고 누차 경고했으니까……"
2003102-115 = "그래서 생각해 봤는데, 입으로 술을 마시는 게 안된다면 피부로 흡수하는 건 괜찮은 게 아닐까 싶어서—"
2003102-116 = "[s] \"조금도 괜찮지 않아!\""
2003102-117 = "자자, 사소한 건 신경 쓰지 말고. 옆으로 조금만 비켜봐."
2003102-118 = "급한 일도 모두 마쳤으니, 나도 이제 탕에 들어가 선생님과 함께 목욕을—"
2003102-119 = "[ns13] \"절대 안 돼!\"\n[ns14] \"이 온천은 중지야, 중지!\""
2003102-123 = "응? 안 되는 거야……?"
2003102-124 = "하지만 이 특별탕을 준비하느라 얼마나 많은 시간과 노력을 들였는데……"
2003102-125 = "그럼…… 살짝 발만이라도 담그면 안 될까?"
2003102-126 = "[s] \"안 됩니다.\""
2003102-130 = "………역시 쉽지 않군."
2003102-132 = "(이후, 와인이 섞인 온천수를 비우고 탕을 깨끗이 청소했다.)"
2003102-133 = "(……다만 고도수의 와인으로 목욕을 한 탓인지 한동안 숙취가 가시질 않아서 고생을 했다.)"
