10058005-13 = "3;마코토;20;키보토스 최고의 전차대회, 게헨나 컵에 온 모두를 환영한다.\n#fontsize;60\n#3;closeup\n#1;hide\n#5;hide"
10058005-14 = "3;마코토;25;대 게헨나의 만마전 의장. 하누마 마코토 님이시다.\n#3;closeup\n#fontsize;60"
10058005-15 = "3;마코토;23;전차란 본래, 우리에게 있어 친근한 교통수단.\n#3;closeup\n#fontsize;60"
10058005-16 = "3;마코토;20;흔하고 지루한 그것을…… 손에 땀을 쥐는 엔터테인먼트로 승화시킨, 키보토스 최고의 대회- 그것이 게헨나 컵이다!\n#3;closeup\n#fontsize;60\n#3;jump"
10058005-17 = "3;마코토;00;아주 간단하기 짝이 없는 룰이다. 트랙에 있는 다섯 개의 표적을 모두 맞히고 출발한 곳으로 돌아오는 것뿐.\n#3;closeup\n#fontsize;60"
10058005-18 = "3;마코토;17;키킷, 멍청한 선도부 녀석들도 이해할 수 있게 이 몸이 직접 고안한 룰이지. 단순명쾌하지 않나?\n#3;em;[재잘]\n#3;closeup\n#fontsize;60"
