[translation]
10058005-1 = "プロローグ"
10058005-2 = ""
10058005-3 = ""
10058005-4 = ""
10058005-5 = ""
10058005-6 = ""
10058005-7 = ""
10058005-8 = ""
10058005-10 = ""
10058005-11 = ""
10058005-12 = "キキッ……キキキッ……。"
10058005-13 = "キヴォトス最高峰の戦車レース「ゲヘナカップ」に来た諸君――#n心から歓迎しよう。"
10058005-14 = "ゲヘナ学[ruby=パンデモニウム・ソサエティー]園の万魔殿議長、[/ruby]#n[ruby=はぬま]羽沼[/ruby]マコト様だ。"
10058005-15 = "戦車とは本来、我々にとって身近な交通手段。"
10058005-16 = "ありふれた退屈なそれを……手に汗握るエンターテインメントに昇華した、#nキヴォトス最高の大会――それがゲヘナカップだ！"
10058005-17 = "ルールはただ１つ。#nサーキット上にある5つの的を砲撃して戻ってくること。それだけだ。"
10058005-18 = "キキッ。#n愚かな風紀委員会の連中でも理解できるよう、このマコト様が考案した。#n単純明快だろう？"
10058005-20 = ""
10058005-21 = "あの、マコト先輩。"
10058005-22 = "あとにしろ、イロハ！今は演説中だぞ！"
10058005-23 = "はぁ……。"
10058005-24 = "ごほん。"
10058005-25 = "ゲヘナカップはキヴォトス最高峰の大会といっていい。#n参加者には、期間中の宿泊場所から食事まで全てを提供してやろう！"
10058005-26 = "ゲヘナにしかできない、寛大なもてなしに感謝するがいい！"
10058005-31 = ""
10058005-32 = "……以上をもって、ミレニアムの衆愚の話を終わりとする。"
10058005-33 = "ふむ。これで全ての学園を紹介したな。そろそろ締めとしようか。"
10058005-34 = "では……これより、ゲヘナカップの開会を宣言する！"
10058005-36 = ""
10058005-37 = ""
10058005-38 = ""
10058005-39 = "んなっ！？"
10058005-40 = "なんだこの反応は！！ここは、拍手喝采だろう！？"
10058005-41 = "……マコト先輩。"
10058005-42 = "私が進言する隙もありませんでしたが、この30分間――"
10058005-44 = ""
10058005-45 = ""
10058005-46 = "マイクの電源、入ってませんでしたよ。"
10058005-47 = "私は指摘しようとしましたからね。#n先輩が「あとにしろ」というので。"
10058005-48 = "な、なんだと！？"
10058005-49 = "では、マコト様の歴史に残る名演説はどうなったのだ！？"
10058005-51 = ""
10058005-52 = "急に大きな声を出してどうしたのよ！？"
10058005-53 = "んぇ、やっと始まるの～？#nセッティングに時間かかり過ぎ～"
10058005-54 = "はぁ……この大会、無事に終わるのでしょうか。"
