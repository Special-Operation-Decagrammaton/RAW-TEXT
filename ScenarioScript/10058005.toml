[translation]
10058005-1 = "프롤로그"
10058005-12 = "키킥…… 킥킥킥……."
10058005-13 = "키보토스 최고의 전차대회, 게헨나 컵에 온 모두를 환영한다."
10058005-14 = "대 게헨나의 만마전 의장. 하누마 마코토 님이시다."
10058005-15 = "전차란 본래, 우리에게 있어 친근한 교통수단."
10058005-16 = "흔하고 지루한 그것을…… 손에 땀을 쥐는 엔터테인먼트로 승화시킨, 키보토스 최고의 대회- 그것이 게헨나 컵이다!"
10058005-17 = "아주 간단하기 짝이 없는 룰이다. 트랙에 있는 다섯 개의 표적을 모두 맞히고 출발한 곳으로 돌아오는 것뿐."
10058005-18 = "키킷, 멍청한 선도부 녀석들도 이해할 수 있게 이 몸이 직접 고안한 룰이지. 단순명쾌하지 않나?"
10058005-21 = "저기, 마코토 선배."
10058005-22 = "조용! 나중에 해라, 이로하! 지금은 연설 중이다!"
10058005-23 = "하아……."
10058005-24 = "흠흠,"
10058005-25 = "게헨나 컵은 키보토스 최고답게 참가자들의 모든 숙식과 부대비용도 제공하지."
10058005-26 = "이 드넓은 아량! 게헨나만이 가능한 관대함이다! 감사하도록!"
10058005-32 = "……이상, 밀레니엄이 왜 멍청이들뿐인지에 대한 이유이다."
10058005-33 = "흠. 모든 학교에 대해 이 마코토 님이 소개해 주었으니, 이제 마무리해도 좋겠군."
10058005-34 = "그러면…… 게헨나 컵의 개최를 선언한다!"
10058005-39 = "에, 에엥?!"
10058005-40 = "뭐냐! 이 반응은! 개최 선언을 하면 박수와 환호성이 있어야지!"
10058005-41 = "……마코토 선배."
10058005-42 = "제가 말할 틈도 안 주셨는데요, 이 30분간—"
10058005-46 = "마이크를 끄고 말했다구요."
10058005-47 = "아까 말하려고 했는데 끊지 말라면서요."
10058005-48 = "뭐, 뭐라고?!"
10058005-49 = "그러면 이 마코토 님의 역사에 남을 명연설은 뭐가 되는 건가!"
10058005-52 = "아유 시끄러워! 가만히 서 있다가 왜 갑자기 소리 지르는 거야?"
10058005-53 = "으엉, 이제 시작하는 건가? 세팅 엄청나게 오래 걸리네~"
10058005-54 = "하아……. 괜찮으려나, 이 대회."
