[translation]
1300820-1 = "좋은 물건의 기준"
1300820-4 = "헉, 헉, 헉……!"
1300820-5 = "알았지, 선생님? 여기 잘 숨어 있어야 해?"
1300820-11 = "내가 괜찮다고 할 때까지 절대 밖으로 나오면 안 돼? 꼭이야? 약속이다?"
1300820-12 = "[s1] \"아, 알았어!\"\n[s2] \"그보다…… 세리카는 잔걱정이 많구나……\""
1300820-15 = " 누, 누가 그렇다는 거야! 바보 선생님!"
1300820-16 = "아무튼 유탄 조심하고! 꼭 숨어 있고!"
1300820-21 = "(세리카는 대답도 듣지 않고 달려 나갔다……)"
1300820-27 = "뭐냐. 꽁지가 빠지게 도망치더니, 결국 여기냐?"
1300820-31 = "케케케케. 그러게 말로 할 때 잘 들었어야지. 안 그러니까 험한 꼴을 보게 되는 거잖아……"
1300820-37 = "……말 잘했어."
1300820-38 = "누가 험한 꼴을 보게 될지, 제대로 해 보자고!"
1300820-39 = "아아, 열 받네. 정말!"
1300820-42 = "앗, 따가. 앗 따가! 아프다고! 그만 해!"
1300820-43 = "어떻게 된 거지? 처음에는 분명 뒤도 돌아보지 않고 도망쳤던 녀석이……!"
1300820-50 = "이걸로 끝이라고 생각하는 건 아니겠지?"
1300820-51 = "체, 쳇! 일단 후퇴다!"
1300820-55 = "야! 혼자서 도망치기냐! 같이 가!"
1300820-59 = "거기 서! 이 기회에 아주 끝장을……!"
1300820-61 = "[s] \"자, 자. 세리카 씨. 오늘은 여기까지만 하도록 하죠.\""
1300820-68 = "선생님?! 잘 숨어있으라고 했잖아! 왜 내가 괜찮다고 하기도 전에 나온 거야!"
1300820-69 = "……그대로 있다가는 영영 괜찮다는 말이 나오지 않을 것 같았다고……?"
1300820-70 = "무, 무슨 소리야! 내가 완전 열 받으면 눈앞의 일밖에는 못 보는 사람 같잖아!"
1300820-71 = "[s] \"괜찮으니까, 괜찮으니까.\""
1300820-72 = "……또 그런 식으로 얼렁뚱땅 넘기려고 하고……"
1300820-77 = "어? 내 가방이……"
1300820-78 = "아…… 한쪽 가방끈이 끊어졌네…… 거기에, 귀퉁이가 상했어……"
1300820-79 = "……"
1300820-80 = "[ns] \"세리카?\""
1300820-81 = "좋은 가방이었는데……"
1300820-86 = "어, 어쩔 수 없지! 제법…… 오래 쓰기도 했고. 응!"
1300820-90 = "……"
1300820-91 = "좋은, 가방, 이었는데……"
1300820-92 = "[s] \"……가자!\""
1300820-93 = "어, 선생님? 갑자기 왜 그래? 가자니, 어디로?"
1300820-97 = "자, 잡아끌지 말고! 안 그래도 따라갈 테니까! 선생님? 선생님!"
1300820-103 = "여긴…… 어디야?"
1300820-104 = "선생님의 단골 수선소가 있는 곳이라고? 그런데 그런 건 왜?"
1300820-105 = "[s3] \"자, 자. 여기에선 선생님만 믿어.\"\n[s4] \"점장님. 계세요?\""
1300820-111 = "이 목소리는…… 샬레의 선생이군. 오늘은 무슨 일이지?"
1300820-112 = "[s] \"그게 말입니다……\""
1300820-115 = "그렇구만. 이 학생의 가방인가?"
1300820-116 = "으, 응. 여기……"
1300820-122 = "흠…… 가방끈이 떨어졌군. 그리고 귀퉁이가 상했고……"
1300820-123 = "그 밖에도 여기저기 사소하게 닳은 자국이 있구만."
1300820-124 = "우으……"
1300820-125 = "하지만, 좋은 가방이야. 주인을 잘 만난 것 같기도 하고."
1300820-126 = "저, 정말……?!"
1300820-127 = "그래. 사용하는 사람의 애정이 여기까지 전해져. 자신의 역할을 다하고 있으니, 사랑받는 물건인 거지. 그런 물건은 좋은 물건일 수밖에 없어."
1300820-128 = "그, 그런…… 가? 뭔가, 부끄럽네……"
1300820-129 = "이건 제법 보람이 있는 일이 되겠어. 좋아. 당장 작업에 들어가도록 하지."
1300820-135 = "[ns] \"잘됐네. 세리카.\""
1300820-136 = "으, 응……"
1300820-137 = "나 참. 그냥 스포츠백 하나일 뿐인데, 선생님도 점장님도 호들갑이라니까……"
1300820-138 = "[s] \"그래도 세리카에게는 소중한 가방이잖아?\""
1300820-139 = "무, 무슨 말을 하는 거야! 저건 그냥!"
1300820-143 = "그냥……"
1300820-144 = "……"
1300820-145 = "[s] \"뭔가 사연이라도 있는 거야?\""
1300820-146 = "없어. 사연이라고 할 만큼 거창한 이야기도 아니고."
1300820-147 = "그저…… 내가 처음으로 아르바이트비를 받았을 때 산, 스포츠백이었을 뿐이야."
1300820-148 = "공부용, 아르바이트용, 운동용, 정비용…… 뭐든 집어넣고 꺼낼 수 있는 만능 튼튼 가방이라는 말에 혹해서……"
1300820-149 = "[s] \"그렇게 과장광고였던 것 같지는 않네.\""
1300820-150 = "선생님에게도, 그렇게, 보여?"
1300820-151 = "……헤헤. 응. 맞아. 잘 썼어. 잘 쓰고 있고."
1300820-152 = "나 스스로도 이유를 모를 정도로, 이상하게 마음이 가고, 자주 사용하게 되는 가방이라고 해야 할까……"
1300820-153 = "뭐, 그만큼 튼튼하고 하자 없는 물건이기 때문이겠지?"
1300820-154 = "이래 봬도 나, 물건 보는 눈은 조금 있으니까 말이야!"
1300820-155 = "[s] \"……\""
1300820-156 = "뭐야. 선생님. 갑자기 말이 없어지고."
1300820-160 = "뭐, 뭔데?! 그렇게 흐뭇하다는 표정으로 바라보고……!"
1300820-161 = "……"
1300820-162 = "자, 잠깐 손 좀 씻고 올 거니까!"
1300820-169 = "자, 다 됐다. 어디 한 번 들어 보라고."
1300820-170 = "어……? 완전히 새것처럼 수선됐잖아? 가방끈도 더 튼튼한 재질로 바뀐 것 같고……"
1300820-171 = "어때. 마음에 드나?"
1300820-172 = "마음에 든다 안 든다를 떠나서…… 놀랄 정도인데……?"
1300820-173 = "괜찮은 반응이군. 나도 아직은 먹고 살 수 있을 것 같아."
1300820-174 = "고, 고마워. 점장님. 그럼, 수선비는……?"
1300820-175 = "수선비? 그렇구만. 그러면 그냥 기본 수선 값만 내라고."
1300820-176 = "엥? 그래도 되는 거야?!"
1300820-177 = "평소 단골인 선생의 얼굴을 봐서 그런 거다. 거기에, 물건을 잘 사용해 주는 주인을 보니, 나까지 기분이 좋아지는군. 뭐, 첫 고객 서비스라고 생각해 둬."
1300820-178 = "……"
1300820-184 = "고마워, 점장님! 앞으로도 잘 사용할게!"
1300820-185 = "앗, 아르바이트 시간에 늦겠어. 미안해, 선생님! 나 먼저 갈게!"
1300820-189 = "……그래서."
1300820-190 = "이걸로 된 건가. 선생?"
1300820-191 = "[ns] (고개를 끄덕인다.)"
1300820-192 = "수선비에 보수비에…… 금액이 제법 되었었지. 뭐, 나야 대금만 잘 받으면 상관없는 일이지만."
1300820-193 = "그렇게 비싼 수선비를 미리 지불해 둘 필요가 있었던 건가. 선생?"
1300820-194 = "[s5] \"그 스포츠백은, 세리카가 드물게도 자신을 위해 산 물건이니까요.\"\n[s6] \"얼마가 들던지, 최대한 오래 사용하게 해 주고 싶었습니다.\""
1300820-200 = "……그렇구만."
1300820-201 = "걱정 말라고. 그 가방, 아무리 험하게 다뤄도 앞으로 몇 년은 끄떡없을 테니까."
1300820-203 = "(점장과 세리카에 대해 몇 마디 이야기를 나누다가, 느긋하게 샬레로 돌아왔다……)"
