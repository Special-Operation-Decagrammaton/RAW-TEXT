[translation]
10035040-1 = "제4화;파도풀, 휩쓸립니다!"
10035040-3 = "좋아, 시설은 대충 한 번씩 돌아봤으니, 준비운동은 끝난 셈이다."
10035040-4 = "키키킥, 그럼 파도풀부터 시작해 볼까요."
10035040-5 = "마음껏 한번 놀아 보자고……!"
10035040-8 = "키보토스 최대의 워터파크, <아에기르>를 찾아주신 여러분, 오래 기다리셨습니다."
10035040-9 = "드디어 우리 파크의 명물, 실외 파도풀의 준비 작업이 끝났습니다."
10035040-10 = "실제 해변을 재현한 파도풀에서 즐거운 시간을 보내세요!"
10035040-11 = "……그리고 아까 키즈 풀에서 고객님을 울린 라이프가드 세 명은 파도풀로 근무지가 변경되었으니 이동하세요."
10035040-13 = "……뭐, 그렇다고 하네."
10035040-14 = "다시 실외로 나가야 한다니, 마음에 안 드는구만~"
10035040-15 = "……면목이 없다. 나 때문에."
10035040-16 = "딱히 칸나 국장한테 한 얘기는 아니었어."
10035040-17 = "겨우 이 정도 일 가지고 이리저리 이동시키는 사장한테 한 말이지."
10035040-18 = "괜찮습니다, 국장님!"
10035040-19 = "본관도 예전에 탈옥수를 잡아 놓고도 한두 번 놓쳐버린 적이 있습니다만, 결국 다 좋게 끝났으니까요!"
10035040-20 = "[s1] (확실히 그런 일이 있었던 것 같지만…….)\n[s2] (한두 번이 아닌 것도 같지만……!)"
10035040-23 = "어쨌든 오늘은 이 파크의 라이프가드니까, 하라는 대로 해야지."
10035040-24 = "파도풀로 가자고."
10035040-27 = "우와! 엄청나게 넓습니다!"
10035040-28 = "정말 작은 해변이라고 해도 믿을 정도예요!"
10035040-29 = "사람도 엄청나게 많네."
10035040-30 = "그만큼 지켜보는 라이프가드의 수도 많다."
10035040-31 = "다른 라이프가드들과의 협력이 필수일 것 같군."
10035040-35 = "거기! 지원 온 인원들이지? 파도풀은 넓다! 널찍하게 거리를 두고 서서 사람들을 통제할 수 있도록!"
10035040-36 = "자, 빨리빨리 움직여! 손님들이 계속 들어온다!"
10035040-37 = "각개전투네요!"
10035040-38 = "국장님, 후부키, 파이팅입니다!"
10035040-39 = "선생님, 그럼 이따 휴식 시간에 뵙겠습니다!"
10035040-43 = "너무 뛰어다니지 말라고~ 그러다 금방 지쳐."
10035040-44 = "그럼 나도 적당히 일해 볼까."
10035040-49 = "혼자서 일하는 건가."
10035040-50 = "이러다 아까 같은 상황이 벌어지면……."
10035040-51 = "[s3] \"그 아이도 놀라서 그랬을 거야.\"\n[s4] \"그 아이도 부끄러워서 그랬을 거야.\""
10035040-54 = "그렇게 말씀해 주시니 감사합니다."
10035040-55 = "하지만 그 아이가 놀란 건 분명 저 때문이겠지요."
10035040-56 = "제 나쁜 인상 때문에……."
10035040-57 = "거기! 빨리 자리로 갈 수 있도록!"
10035040-58 = "우선은 주어진 임무에 집중하겠습니다."
10035040-59 = "가능하면 손님들이 놀라시지 않도록, 풀 깊은 곳에 있는 역할이 좋겠군요."
10035040-63 = "[ns] \"…….\""
10035040-65 = "어푸어푸!"
10035040-66 = "사, 사람 살려! 아이고!"
10035040-67 = "자, 흥분하지 말고."
10035040-68 = "여기 구명 튜브를 잡으라고."
10035040-69 = "콜록! 자, 잡았어요!"
10035040-70 = "꼭 잡아. 끌어당길 테니까~"
10035040-73 = "자~ 도착."
10035040-74 = "가, 감사합니다! 덕분에 살았어요!"
10035040-75 = "너무 깊이 들어가지 말라구. 파도가 쳐서 위험하니까."
10035040-77 = "흐흐흥~"
10035040-78 = "앗! 그쪽의 손님!"
10035040-79 = "풀장에서 전자기기는 사용 금지입니다! 감전의 위험이 있으니까요."
10035040-80 = "지금 무슨 노래 듣고 있냐고요?"
10035040-81 = "데스 엔젤스의 락 더 시티요."
10035040-82 = "노, 노래 제목을 물어본 게 아닌데요?"
10035040-83 = "어쨌든 이어폰은 빼 주시기 바랍니다!"
10035040-84 = "안전 문제도 있고, 잃어버리기 쉬우니까요!"
10035040-85 = "아, 그렇네요. 알겠습니다."
10035040-86 = "감사합니다!"
10035040-88 = "(풀장 깊은 곳에서 사람들이 오지 못하도록 막는 임무인가.)"
10035040-89 = "(어찌 보면 내게 가장 잘 맞는 일이겠지…….)"
10035040-93 = "파도가 시작됩니다."
10035040-97 = "음? 왜 주위에 아무도 없지?"
10035040-98 = "설마 다 밖으로 나간—"
10035040-102 = "케헥!"
10035040-104 = "(파도에 휩쓸렸나!)"
10035040-105 = "(우선 침착하게 수영해서 뭍으로 나가는 게 먼저겠어……!)"
10035040-106 = "(……음?)"
10035040-110 = "(저, 저건 대체?)"
10035040-113 = "서, 선생님, 국장님이 파도에 휩쓸려서 밀려 나왔는데요!"
10035040-114 = "밀려 나온 게 아니라 수영으로 나온 것 같은데."
10035040-115 = "칸나 국장, 운동신경은 꽤나 있단 말이지."
10035040-119 = "쿨럭! 키리노, 후부키……!"
10035040-120 = "?"
10035040-121 = "당장, 지금 당장 사람들을 대피시켜야 한다!"
10035040-122 = "대피? 그게 무슨 소리야?"
10035040-124 = "물속에 뭔가 있다. 커다란 괴물 같은 무언가가!"
10035040-125 = "[s] \"괴물?!\""
10035040-129 = "그, 그럴 리가요! 국장님, 잘못 보신 거 아닌가요?!"
10035040-130 = "너무 스트레스받지 말라고, 국장. 헛것이 보일 정도면 정신적으로 꽤나 몰린 상태—"
10035040-132 = "정말이다!"
10035040-133 = "지금 당장 경보를 울리고 사람들을 대피시키도록."
10035040-134 = "녀석이 올라오기 전에, 빨리!"
10035040-135 = "구, 국장님이 그렇게 말씀하실 정도면……!"
10035040-136 = "알겠습니다! 경보를 울리겠습니다!"
10035040-140 = "나 참, 이건 또 무슨 일이래."
10035040-141 = "그럼 난 안내방송을 맡을게."
10035040-145 = "선생님도 빨리 대피하시기 바랍니다."
10035040-146 = "제 말이 믿기지 않는다는 것은 압니다. 하지만……!"
10035040-147 = "[s5] \"칸나를 믿어.\"\n[s6] \"같이 가자!\""
10035040-150 = "저는 사람들을 대피시키고 마지막에 가겠습니다."
10035040-151 = "그것이 라이프가드의 의무니까요."
10035040-152 = "그럼!"
10035040-156 = "[ns] 생활안전국 학생들과 함께 사람들을 대피시키러 간다."
10035040-160 = "하핫! 다들 놀라서 도망치는 것 좀 보라지!"
10035040-161 = "큭큭큭! 아주 바짝 쫄았구만!"
10035040-162 = "좋아, 이 기세를 몰아서……."
10035040-167 = "한 번 신나게 놀아 보실까!"
