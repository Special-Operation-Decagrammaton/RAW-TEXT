[translation]
1012302-1 = "변화하는 관계"
1012302-2 = "샬레 건물 앞"
1012302-3 = "(세이아의 말에 걱정되는 표정으로 기다리고 있었다.)"
1012302-8 = "이런……. 먼저 나와 계셨군요, 선생님."
1012302-9 = "이제 와서 번복하는 것 같지만, 부담 드리고 싶은 상황은 아니었는데."
1012302-10 = "[s1] \"세이아……!?\"\n[s2] \"……?? 스포츠카……!?\""
1012302-19 = "[ns3] \"……수영……복?\"\n[ns4] \"무슨……. 일이야?\""
1012302-22 = "자세한 설명은 나중에"
1012302-23 = "괜찮으시다면…. 옆에 타시겠어요?"
1012302-27 = "후후, 재미있는 표정을 하시네요."
1012302-28 = "너무 걱정은 마세요. 그다지 위험한 일은 아니니까요."
1012302-29 = "우선 번화가를 벗어날까요? 시간을 끌면, 누군가 알아볼지도 모르고."
1012302-30 = "……네?"
1012302-31 = "……아아, 차요?"
1012302-32 = "그렇군요. 선생님께선 처음 보시겠네요."
1012302-33 = "괜찮습니다. 엄연히 제 차고, 이래 봬도 은근히 자주 몰고 다닌답니다."
1012302-34 = "차도 있고, 오토바이도 있고……. 요트도 있는데, 기회가 되면 보여드리고 싶네요."
1012302-39 = "자, 사소한 건 됐으니 조수석에 앉아 주세요. 선생님."
1012302-40 = "[s5] \"으, 응…….\"\n[s6] 자동차 조수석에 앉는다."
1012302-49 = "후후……."
1012302-50 = "그럼 출발하겠습니다."
1012302-54 = "(이후 세이아의 차를 타고, 도심을 벗어나 교외로 향했다.)"
1012302-55 = "(운전하는 내내 세이아는 미소 짓고 있었지만, 말은 한마디도 하지 않았다.)"
1012302-56 = "슬슬 도착하겠네요. 꽤 빨리 온 걸요."
1012302-57 = "음……."
1012302-58 = "……좋네요. 바다 냄새예요."
1012302-67 = "[wa:2380]― [log=세이아 수영복]여기까지 오니[/log]"
1012302-69 = "― [log=세이아 수영복]바람도 선선해지는군요.[/log]"
1012302-72 = "[wa:570]― [log=세이아 수영복]다른 차도 없고…….[/log]"
1012302-74 = "― [log=세이아 수영복]좋네요.[/log]"
1012302-77 = "[wa:1200]― [log=세이아 수영복]드라이브는 어떠실까요? [wa:2150]많이 놀라셨나요?[/log]"
1012302-80 = "― [log=세이아 수영복]갑작스럽기도 하고,[/log]"
1012302-82 = "[wa:100]"
1012302-85 = "― [log=세이아 수영복]예상외이기도 하셨겠죠.[/log]"
1012302-87 = "[wa:100]"
1012302-90 = "[wa:1090]― [log=세이아 수영복]그 표정을 보니……. [/log]"
1012302-92 = "― [log=세이아 수영복]오길 잘했다는 생각이 드네요.[/log]"
1012302-95 = "[wa:60]― [log=세이아 수영복]사실 별다른 이유는 없어요. [/log]"
1012302-97 = "[wa:30]― [log=세이아 수영복]그저 [wa:1010]한 번쯤 해보고 싶었을 뿐.[/log]"
1012302-100 = "[wa:840]― [log=세이아 수영복]이런 걸 [wa:1300]뭐라고 하죠……?[/log]"
1012302-103 = "[wa:450]― [log=세이아 수영복]……납치?[/log]"
1012302-106 = "[wa:400]― [log=세이아 수영복]후후……. [wa:1140]농담이에요.[/log]"
1012302-109 = "[wa:340]― [log=세이아 수영복]그렇지만 [wa:470]아직은…….[/log]"
1012302-111 = "― [log=세이아 수영복]그래요.[/log]"
1012302-114 = "― [log=세이아 수영복]선생님을 집으로 돌려보내 드리기 전까진, [/log]"
1012302-116 = "[wa:230]― [log=세이아 수영복]농담이 아닌 걸로 하죠.[/log]"
1012302-119 = "다 왔답니다. 잠시 쉬도록 하시죠."
1012302-126 = "아까도 말씀드렸지만……. 무슨 사건이 있는 건 아니랍니다."
1012302-127 = "다급하다고는 말씀드렸지만……. 뭐랄까."
1012302-128 = "그저 다급하게 선생님을 데리고 여기로 오고 싶었다…? 그런 이야기일 뿐."
1012302-129 = "……실망하셨나요? 별일 아니라서?"
1012302-130 = "혹은……. 뭔가 또 말장난에 당한 것 같아서?"
1012302-131 = "[s7] \"뭐……. 살짝 놀라기는 했지?\"\n[s8] \"처음부터 말해줬어도 괜찮았을 텐데.\""
1012302-134 = "후후."
1012302-135 = "후후후……."
1012302-136 = "……아. 죄송해요. 그저 조금 즐거워서."
1012302-137 = "예전이었다면 '별일 아니라서 오히려 다행이야' 같은 판에 박힌 말씀을 해 주셨을 텐데……."
1012302-138 = "지금은……. 그래도 따져 주시는군요?"
1012302-139 = "하긴, 당연하다면 당연한 걸까요? 자신이 불러 놓고 잊을 때도 있었고, 거짓말이나 다름없는 말을 했던 적도 있었으니."
1012302-140 = "뭐랄까……."
1012302-141 = "선생님께서 저를 대하는 태도가, 조금씩 달라지고 계시는 느낌이 들어요."
1012302-142 = "조금 더 계속해서 노력한다면……. 언젠가는 따끔하게 나무라 주시는 날이 올지도 모르겠네요."
1012302-143 = "어쩌면 그런 잔소리를 듣고 싶었던 걸지도 모르죠."
1012302-144 = "철없는 짓을 하고, 말괄량이처럼 혼나고. 가끔은 한 소리 듣기도 하고……."
1012302-145 = "이런 걸 뭐라고 할까요. 음……."
1012302-146 = "[s9] \"……하아.\"\n[s10] 일부러 한숨을 푹 내쉰다."
1012302-152 = "……!!!"
1012302-153 = "후후, 후후……."
1012302-154 = "그렇군요. 이런 기분이로군요."
1012302-155 = "상당히 괜찮네요. 기대 이상의 감각이에요. 어쩌면 버릇이 돼 버릴지도 모르겠어요."
1012302-160 = "……농담입니다."
1012302-161 = "아니, 정확히는 마음은 진심이지만……. 저에게도 절제라는 건 있으니까요."
1012302-162 = "[s11] \"이런 정도의 장난은 괜찮아.\"\n[s12] \"어울려주는 것 정도는, 문제없지.\""
1012302-168 = "……과연. 거기서는 또 그렇게 받아 주시는 거군요."
1012302-169 = "알겠어요. 여기서부터는 제가 알아서 잘 조절해야겠지요. 선생님께선 아무래도 그 부분은 신뢰해 주고 계시군요."
1012302-170 = "……치사하시게도, 말이죠."
1012302-171 = "[s13] \"세이아에게 맞는 답을 할 뿐이야.\"\n[s14] \"어라, 그런 걸 좋아하는 줄 알았는데.\""
1012302-174 = "……후후."
1012302-175 = "우선 다시 타시죠. 납치는 여기까지입니다. 돌려보내 드릴 게요."
1012302-180 = "다음에는……. 어떻게 될지 모르지만요."
1012302-183 = "(이후 세이아의 차를 타고, 샬레 앞까지 함께 드라이브로 돌아갔다.)"
1012302-184 = "(세이아는 여전히 운전 내내 한 마디도 없었고, 돌아가기 전 한 번 웃을 뿐이었다.)"
