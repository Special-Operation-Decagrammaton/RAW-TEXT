[translation]
1300005-1 = "함께 걷는 시간"
1300005-2 = "밀레니엄 근교 블랙마켓 제 1지구"
1300005-3 = "멈추세요! 이 악당분!"
1300005-4 = "(후다닥!)"
1300005-11 = "크윽… 놓친 건가."
1300005-12 = "정보가 누설된 걸까…… 빠른 대응인걸."
1300005-13 = "거래는 막았지만, 아직 문서를 확보하진 못했어. 설마 이쪽으로 도망칠……"
1300005-14 = "……어머?"
1300005-15 = "어머어머?! 주인님. 어떻게 여기에……?"
1300005-16 = "네? 폭발음을 듣고…… 아 그렇군요. 저는 1억 퍼센트 무관하답니다."
1300005-17 = "네? 근데 제가 여기에 왜 있냐고요? 그러니까 지금 막 임무를 마치고……."
1300005-18 = "아니. 부활동을 종료하고 돌아가려던 길이었어요."
1300005-19 = "후훗. 우연이네요."
1300005-20 = "그보다 어떠세요 주인님."
1300005-21 = "정숙한 여학생은, 밤이슬을 신발 끝에 묻히지 않는 법이라고 하죠. 최근 키보토스 치안도 예전 같지 않아 겁이 나네요."
1300005-24 = "함께, 밀레니엄까지 바래다주시겠어요?"
1300005-26 = "밀레니엄 근교 번화가"
1300005-27 = "주인님. 주인님."
1300005-28 = "네? 사람들 앞에서는 주인님이라 부르지 말아달라고요?"
1300005-29 = "흐음. 사람들의 시선이 신경 쓰일 수 있겠네요. 그럼 어떻게 불러 드리길 바라시나요?"
1300005-30 = "[s1] \"오빠라고 불러줘.\"\n[s2] \"언니라고 불러줘.\"\n[s3] \"선생님이라고 불러.\""
1300005-31 = "으음. 어느 쪽이든…… 곤란하네요."
1300005-32 = "으음. 어느 쪽이든…… 곤란하네요."
1300005-33 = "으음. 어느 쪽이든…… 곤란하네요."
1300005-34 = "아무리 주인님의 명령이라도, 저는 제가 섬겨야 할 분의 호칭을 바꿀 수 없어요."
1300005-35 = "저는, 메이드니까요."
1300005-36 = "[s] \"메이드부에 들어가게 된 이유는 뭐야?\""
1300005-37 = "네……?"
1300005-38 = "아 하긴. 메이드부는 다른 부에 비하면 조금 독특하긴 하지요."
1300005-39 = "카린처럼 '가사'에 대한 걸 배워 현모양처가 되겠다며 찾아온 여학생도 있고……"
1300005-40 = "아스나 선배처럼 그저 '네루 선배와 함께 하기위해' 찾아온 사람도 있겠지만……"
1300005-41 = "저는 그런 오해나 목적 따위는 없었어요."
1300005-42 = "저는 메이드부에 들어가서 메이드가 된 게 아니라……"
1300005-43 = "제가 메이드였기 때문에 C&C를 선택한 거죠."
1300005-44 = "주인님, 오늘은 어떤 봉사로 주인님을 기쁘게 해드릴 수 있을까요."
1300005-45 = "저는 태어날 때부터 그런 것만 생각하고 있었답니다."
1300005-46 = "네? 주변 사람들이 수군거리기 시작한다고요?"
1300005-47 = "아하. 그런 게 불편하시다면 제가 청소를……"
1300005-49 = "후훗. 놀라지 마세요."
1300005-50 = "농.담.이.니.까."
1300005-52 = "실은…… 오늘…… 임무에 실패했어요."
1300005-53 = "하지만, 비록 목표를 달성하지 못했지만, 주인님과 만나니……"
1300005-54 = "그 실패조차도, 행운처럼 느껴지네요."
1300005-55 = "임무에 실패했는데……"
1300005-56 = "어째서일까요. 웃음이 멈추지 않아요."
1300005-57 = "주인님이 곁에 있기 때문일까요?"
1300005-58 = "고마워요. 주인님이 저를 행복하게 해주셔서……"
1300005-59 = "그러니 저도, 주인님을 행복하게 해드리고 싶……"
1300005-62 = "(툭-)"
1300005-63 = "으악! 조심해! 눈을 얻다 달고 다니는 거야!"
1300005-64 = "어머, 죄송합니다. 제가……."
1300005-65 = "응?"
1300005-66 = "……?"
1300005-67 = "어라?"
1300005-68 = "…… 어엇?!"
1300005-69 = "메, 메, 메이드! C&C 아직도 쫓고 있었나?!"
1300005-71 = "아앗! 멈춰요!"
1300005-72 = "행운이 확실하네요. 주인님과 함께해서!"
1300005-73 = "주인님! 저 사람이 블랙 기업의 사주를 받고 밀레니엄 학생들의 개인정보를 훔친 도둑이에요!"
1300005-74 = "쫓도록 하죠!"
1300005-76 = "(결국 아카네와 임무에 성공했다.)"
