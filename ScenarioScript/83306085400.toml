[translation]
83306085400-6 = "잃어버렸다던 푸딩을 발견했어."
83306085400-7 = "뭣이?! 그것이 정말이냐?!"
83306085400-8 = "그래서 그 천하의 마코토님조차 깜짝 놀랄 정도의 범죄를 저지른 범인은 누구지?!"
83306085400-9 = "범인이 누군지만 알게 되면, 이 마코토님의 모든 권력을 이용해! 철저하게 응징해 줄 테다!"
83306085400-10 = "그 범인 말인데……"
83306085400-16 = "아! 마코토 선배! 히나 선배! 그 푸딩!"
83306085400-17 = "그래! 이부키! 마침 잘 왔구나! 다행히 악독한 범인이 훔쳐 갔던 푸딩을 늦지 않게 발견……!"
83306085400-18 = "이부키가 말이야! 아까 텐트 안에서 그 푸딩을 발견했거든!"
83306085400-19 = "가만히 내버려두면 개미 씨나, 곰돌이 씨나, 토끼 씨가 가져갈지도 모르니까……!"
83306085400-20 = "그래서 이부키가 직접 보물 가방에 챙겨놨었어!"
83306085400-21 = "나중에 마코토 선배랑 이로하 선배랑! 사츠키 선배랑! 치아키 선배가 오면! 다 같이 먹으려구!"
83306085400-22 = "그렇게 된 모양이야."
83306085400-23 = "이, 이, 이, 이부키………"
83306085400-24 = "응? 왜애~?"
83306085400-25 = "아, 아, 아. 아…… 나, 난 그것도 모르고………"
83306085400-26 = "미안하다………!! 이부키………! 이부키의 기특한…… 그런 마음씨도 몰라보고……! 내가 나빴어어어어어!!!!"
83306085400-27 = "…………웅?"
