[translation]
1005203-1 = "세미나 서기 노아의 짓궂은 관찰"
1005203-2 = "샬레 집무실"
1005203-3 = "안녕하세요, 선생님."
1005203-4 = "오늘도 제가 샬레의 당번 활동을 맡게 되었답니다."
1005203-5 = "늘 그래왔지만, 이번에도 잘 부탁드리겠습니다."
1005203-6 = "[s] \"음, 잘 부탁해.\""
1005203-7 = "그나저나 오늘따라 기분이 좋아 보이시네요."
1005203-8 = "뭔가 즐거운 일이라도 있으셨나요?"
1005203-9 = "[s1] \"지난 밤에 좋은 생각이 떠올랐거든.\"\n[s2] \"노아의 평정심을 깨트릴 수 있는 방법을!\""
1005203-10 = "……제 평정심을 깨트릴 수 있는 방법이요?"
1005203-11 = "……제 평정심을 깨트릴 수 있는 방법이요?"
1005203-12 = "그동안 일부러 평정을 가장하고 다닌 기억은 없습니다만……"
1005203-13 = "선생님께서 저를 시험해보고 싶으시다니, 어쩐지 조금 흥미가 생기네요."
1005203-14 = "그래서, 어떤 방법인가요?"
1005203-15 = "[s] \"이번에는 내가 노아의 행동을 기록하려고.\""
1005203-16 = "……저번의 제가 서기 업무를 했던 것처럼, 이번에는 선생님께서 역으로 제 행동을 관찰하고 기록하시겠다고요?"
1005203-17 = "과연. 그건 제게도 익숙하지 않은 경험이네요."
1005203-18 = "평소의 저는 다른 사람들의 시선 밖에서 서기 업무를 하고 있었던지라……"
1005203-19 = "누군가가 저를 지켜보는 상황 아래에서 일을 한다는 인식은 없었거든요."
1005203-20 = "……그럼 오늘은 선생님의 제안대로 서로를 관찰하며 당번 시간을 보내볼까요?"
1005203-21 = "아, 당번 업무를 시작하기 전에 미리 말씀드리는 사실입니다만."
1005203-27 = "……아마 쉽지 않을 거예요. 후후."
1005203-29 = "(30분 후……)"
1005203-31 = "……."
1005203-32 = "[s] \"…….\""
1005203-33 = "……♪"
1005203-34 = "선생님? 뭔가 피곤해 보이시네요."
1005203-35 = "[s] \"사람을 관찰하는 일도 생각보다 지치네…….\""
1005203-36 = "그렇죠?"
1005203-37 = "사람의 의사는 말뿐만 아니라 행동이나 표정 등 여러 가지 기호로 표현될 수 있으니까요."
1005203-38 = "현장에 흐르고 있는 무한한 정보를 유한한 종이 위에 옮겨 적는 것도 쉬운 일이 아니랍니다."
1005203-39 = "[s] \"그래도 노아의 행동은 하나도 놓치지 않고 있으니까……!\""
1005203-40 = "선생님께서도 열심이시네요, 후후."
1005203-41 = "그럼 저는 잠시 필기구를 보충하러 창고에 다녀올게요."
1005203-50 = "다녀왔습니다~"
1005203-54 = "자, 그럼……"
1005203-55 = "여기서 문제입니다!"
1005203-56 = "[s] \"갑자기 퀴즈?!\""
1005203-57 = "선생님께서 그렇게 호언장담하셨으니, 얼마나 저를 잘 관찰하고 계셨는지 확인하지 않을 수 없겠지요."
1005203-58 = "지금부터 내는 문제를 맞히신다면, 제가 선생님의 부탁을 무엇이든 하나 들어드리겠습니다."
1005203-59 = "대신 틀리신다면…… 제대로 집중하지 않으신 벌로 선생님의 커피를 한 잔 받아 갈게요~"
1005203-60 = "[s] \"그건 어렵지 않지만…….\""
1005203-61 = "그럼 문제입니다."
1005203-62 = "방금 저는 집무실 밖에서 옷매무새의 한 부분을 고치고 돌아왔습니다."
1005203-63 = "아까와 비교하여 제 옷차림에서 달라진 부분은 어디일까요?"
1005203-64 = "[s3] \"어려운 걸…….\"\n[s4] \"똑같아 보이는데…….\""
1005203-65 = "저를 계속 유심히 관찰하고 계셨다면 그리 어려운 문제는 아닐 거예요."
1005203-66 = "저를 계속 유심히 관찰하고 계셨다면 그리 어려운 문제는 아닐 거예요."
1005203-67 = "다만 기회는 단 한 번뿐이니, 신중하게 말씀해주세요."
1005203-68 = "[s] \"……머리핀이 바뀌었나?\""
1005203-69 = "땡! 오답입니다."
1005203-70 = "후후, 그럼 약속대로 선생님의 커피를 한 잔 받아 갈게요."
1005203-76 = "[ns] \"그래서 정답은 뭐였어?\""
1005203-78 = "아직도 눈치채지 못하신 건가요?"
1005203-79 = "정답은…… 아무것도 바뀌지 않았답니다~"
1005203-80 = "[s5] \"그게 뭐야?!\"\n[s6] \"……날 속였어!\""
1005203-81 = "후후, 엄연히 말하자면 속인 건 아니랍니다."
1005203-82 = "후후, 엄연히 말하자면 속인 건 아니랍니다."
1005203-83 = "때로는 보기 밖에 존재하는 명제도 문제의 해답이 될 수 있으니까요."
1005203-84 = "그렇기 때문에 우수한 서기라면 편견에 사로잡히지 않도록 언제나 모든 경우의 수를 고려해야 한답니다."
1005203-85 = "그래야만 현실을 객관적으로 관찰할 수 있을뿐더러…… 저처럼 나쁜 학생에게도 속지 않을 테니까요."
1005203-86 = "그러니까 지금은, 좀 더 눈을 크게 뜨고 저에게 집중해 주세요."
1005203-88 = "(이후로도 노아의 변화를 관찰하기 위해 열심히 그녀를 노려보았지만……)"
1005203-89 = "후후, 어쩐지 평소보다 커피가 더 달콤한 느낌이네요~"
1005203-93 = "(아무런 소득도 얻지 못했다…….)"
