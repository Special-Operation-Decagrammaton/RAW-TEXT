[translation]
10000045-2 = "캐앵?!"
10000045-6 = "이, 이즈나가 또 졌다구요?!"
10000045-7 = "이번엔 더욱더 만반의 준비를 하고 찾아왔는데?! 정면승부로는 안 된다는 건가요?!"
10000045-8 = "아니면 아직, 이즈나의 수행 부족 때문?!"
10000045-9 = "[s1] \"그보다 이즈나는 닌자가 꿈이라고 했으면서.\"\n[s2] \"어째서 망량즈와 같이 있는 거야?\""
10000045-10 = "네? 그야……."
10000045-11 = "네? 그야……."
10000045-12 = "이즈나는 지금 닌자로서 고용주에게 의뢰를 받고 활동 중이니까요!"
10000045-13 = "[s] \"고용주……?\""
10000045-14 = "고용주의 사업을 위해! 방해꾼들을 쓰러트리고 임무를 완수한다!"
10000045-15 = "그 어떤 내용의 의뢰라도 완수하는 것이 닌자의 길!"
10000045-16 = "그렇게 닌자의 길을 걷다 보면 언젠가 이즈나는 저만의 주군을……!"
10000045-17 = "핫?! 나도 모르게 중요 정보를?! 이것도, 선생님의 무서운 책략?!"
10000045-18 = "으, 으읏! 이즈나! 이번만큼은 물러가겠지만. 다음번엔 다를 거예요!"
10000045-19 = "다음에 만나면 각오하세요! 선생님! 반드시 쓰러트려 드릴 테니까!"
10000045-20 = "[s] \"그거 완전히 도망치는 삼류 악당 대사잖아…….\""
10000045-21 = "이, 이즈나는 삼류 악당이 아니에요!"
10000045-22 = "닌자란 자고로 필요하다면 몇 번이고 후퇴한 다음 몸을 추스르고 다시 도전하는 존재!"
10000045-23 = "다음엔 절대로 지지 않아요! 닌닌!"
10000045-25 = "(퍼엉!)"
10000045-27 = "(그렇게 눈 깜짝할 새에 이즈나는 사라졌다.)"
10000045-29 = "아앗, 선생님. 어디 다치신 곳은 없나요?!"
10000045-30 = "[s] 고개를 끄덕인다."
10000045-31 = "와앗! 망량즈가 한순간에 도망쳐버렸어!"
10000045-32 = "도망치면서 '큿, 다음 번엔 다를 거다!' 같은 말을 했어. 그거, 악당?"
10000045-33 = "저희들로만 싸울 땐 계속 고전했지만. 선생님이 함께하신 것만으로도 이렇게 다르군요."
10000045-34 = "꿀꺽. 이, 이게 어른! 어른의 힘인가?!"
10000045-35 = "응. 굉장-해."
10000045-36 = "[s] \"너희들이라면 분명 저번에…….\""
10000045-39 = "거기~서! 놓치지 않는다앗!"
10000045-40 = "자, 잠깐만요. 카, 카에데 쨩. 하아…… 하아…… 너, 너무 빨라요……"
10000045-42 = "으응~ 그때, 선생님도 있었던 거야~?"
10000045-43 = "우리 수행부는 이제까지 망량즈와 싸우면서 거리 순찰 활동을 해왔으니까!"
10000045-44 = "어? 거리 순찰?"
10000045-45 = "수행의 일환으로 거리를 지키자- 라는 것도 우리 동아리의 목표니까~"
10000045-46 = "축제의 거리를 지키는 거야!"
10000045-47 = "모두가 즐겁게 즐길 수 있어야 비로소 축제잖아요?"
10000045-48 = "하지만 어째선지 길거리 망량즈가 날뛰기 시작해서, 곤란해하던 참이었어요."
10000045-49 = "그래서 음양부에……."
10000045-50 = "전혀 몰랐어. 수행부가 이런 활동을 하고 있을 줄은."
10000045-51 = "그냥 평소에 이상한 짓만 하는 괴짜들인 줄로만 알았는데."
10000045-52 = "[s] \"대놓고 그런 말을 하는 건 좀 그렇지 않아?\""
10000045-53 = "어, 어쨌든 간에요~!"
10000045-54 = "갑자기 망량즈 애들이 저렇게 날뛰는 이유를 모르겠다구요!"
10000045-55 = "흐아암. 그러고 보면 최근에 소문을 들은 적이 있어."
10000045-56 = "거리의 뒤편에서 어슬렁거리던 망량즈를 하나로 규합해서 움직이는 '고용주'가 있다고."
10000045-57 = "[s] (고용주라면 이즈나도 말했던…….)"
10000045-60 = "이즈나는 지금 닌자로서 고용주에게 의뢰를 받고 활동 중이니까요!"
10000045-62 = "[ns] (이즈나를 고용한, 다른 누군가가 있다는 거구나.)"
10000045-63 = "그 문제아들을? 돈 들이면서까지? 왜?"
10000045-64 = "이 축제가 잔뜩 마음에 안 드는 못된 악당이 있는 게 분명해!"
10000045-65 = "분명 모두가 하하호호 웃고 떠드는 걸 보고 배가 아픈 걸 테지! 응. 결정! 그런 나쁜 사람인 거네!"
10000045-66 = "카에데 쨩의 말은 잘 모르겠지만. 이 축제를 멈추고 싶어하는 사람은 분명 있는 모양이에요."
10000045-67 = "그 목적이 무엇인지, 아직 알 수는 없지만."
10000045-68 = "그래도 망량즈와 계속해서 이렇게 싸우기보다는 그 원흉을 찾으면 되지 않을까요?"
10000045-69 = "우움~ 원흉이라면 어떻게 찾게~?"
10000045-70 = "원흉을 찾는다. 원흉……."
10000045-71 = "우리 축제를 잔뜩 방해하려는 원흉을 찾기 위해서라면……."
10000045-72 = "우리도 눈물을 머금고, 특단의 조치를 취할 필요가 있어!"
10000045-74 = "망량즈 멤버를 유괴해서, 수괴를 알아내는 거야!"
10000045-76 = "오- 피도 눈물도 없는 악당."
10000045-77 = "과연, 마츠리부의 부장!"
10000045-78 = "가게의 실적, 축제의 성패, 원하는 것을 쟁취하기 등등!"
10000045-79 = "목적을 위해서라면 갖은 수단을 가리지 않는다는 소문이 있던데. 사실이었구나!"
10000045-80 = "그……. 카에데 쨩. 그건 칭찬이 아니지 않을……까요?"
10000045-81 = "[s] \"…….\""
10000045-84 = "아, 아니에요!"
10000045-85 = "시, 시즈코는 마음씨 여린 아, 아이돌이니까요!"
10000045-88 = "……우아아악! 하! 여! 간! 원흉을 찾기 위해 go! 라구요!"
