[translation]
1010103-1 = "축제의 소리를 찾아서"
1010103-4 = "아, 선생, 이쪽이다."
1010103-5 = "부탁을 들어줘서 고맙다."
1010103-6 = "[s] \"다른 일이 있다고 했지?\""
1010103-7 = "그 말대로다. 이번에도 아르바이트 관련이긴 한데……."
1010103-8 = "축제에서 DJ 행사를 준비하고 있다. 조금 도움이 필요한 상황이야."
1010103-9 = "턴테이블을 포함한 기자재는 준비되어 있지만, 가장 중요한 샘플이 없다."
1010103-10 = "샘플이 뭐냐고?"
1010103-11 = "아, DJ는 보통 이미 존재하는 음원의 일부를 가져와서 섞거나, 변형해서 새로운 음악을 만들어낸다."
1010103-12 = "그걸 샘플링이라고 하지."
1010103-13 = "아무리 좋은 장비를 가졌다고 해도, 좋은 음원이 없으면 공연은 할 수 없다."
1010103-14 = "[s] \"음원은 어떻게 구하는데?\""
1010103-15 = "물론, 다른 사람이 작곡한 음악이니 저작권료를 주고 사용 허가를 받아야 한다."
1010103-16 = "<DJ 입문 가이드>에 그렇게 쓰여 있었지."
1010103-17 = "하지만, 나는 저작권료를 지불할 만큼의 돈이 없어서……."
1010103-18 = "그래서, 직접 샘플링할 음원을 찾기로 한 거다."
1010103-19 = "[s] \"직접 작곡한다는 얘기?\""
1010103-20 = "으음, 그럴 수 있다면 좋겠지만, 내 수준에 작곡은 무리겠지."
1010103-21 = "대신, 음원 대용으로 쓸 수 있는 여러 소리들을 녹음하러 다닐 생각이다."
1010103-22 = "축제 현장에서 다양한 일이 벌어지는 만큼, 샘플로 쓸 수 있을 만한 소리도 많을 테니까."
1010103-23 = "즉, 현지 조달 작전이다."
1010103-24 = "[s] \"좋아, 나도 도울게.\""
1010103-25 = "고맙다."
1010103-29 = "자, 그럼 축제장으로 들어가 볼까."
1010103-33 = "으음, 어디부터 가야 할지……."
1010103-34 = "선생은 좋은 생각이라도 있나?"
1010103-35 = "[s] \"저기 포장마차부터 가 보는 건?\""
1010103-36 = "그렇군. 멀리서 봐도 활기가 넘친다."
1010103-37 = "좋은 소리를 얻을 수 있겠어."
1010103-44 = "어서 오세요! 오징어구이, 닭꼬치, 야끼소바, 무엇이든 있습니다!"
1010103-45 = "싼 가격에 맛있는 음식 드시고 가세요!"
1010103-46 = "[s] \"듣기만 해도 배가 고파지는걸.\""
1010103-52 = "음식을 만드는 소리……"
1010103-53 = "음, 사용할 수 있을 것 같다."
1010103-57 = "그럼, 녹음하도록 하지."
1010103-58 = "……음?"
1010103-59 = "선생, 이건…… 닭꼬치? 사주는 거라고?"
1010103-60 = "괘, 괜찮다. 오늘은 선생이 내 부탁을 들어주는 것이니, 산다고 하면 내가……."
1010103-61 = "[s] \"사오리가 샘플링하는 모습을 볼 수 있었으니, 그 답례야.\""
1010103-62 = "으음, 답례를 받을 만큼 대단한 것은 아니다만……."
1010103-63 = "하지만 녹음만 하는 것은 상인에 대한 예의가 아닐지도 모르겠군."
1010103-64 = "고맙다, 선생. 다음엔 내가 사겠다."
1010103-68 = "바다……"
1010103-69 = "그렇지, 규칙적으로 부서지는 파도 소리 또한 좋은 샘플이 될 수 있을 거라 생각한다."
1010103-73 = "어디, 녹음기를 켜고……."
1010103-77 = "으음, 거리가 멀어서 그런지 녹음이 잘 안되는군."
1010103-78 = "[s] \"내가 도와줘도 될까?\""
1010103-79 = "응? 선생이? ……물론 버튼을 누르기만 하면 되는 쉬운 일이다만, 어떻게……?"
1010103-86 = "신발을 벗고…… 물속으로?!"
1010103-87 = "[s1] \"시원해서 기분 좋은걸.\"\n[s2] \"이렇게 하는 편이 더 녹음이 잘 되잖아?\""
1010103-90 = "선생이 괜찮다면, 나로서는 고마울 따름이지."
1010103-91 = "이걸로 한 가지 샘플을 더—"
1010103-95 = "[ns] \"우왓!\""
1010103-101 = "선생, 괜찮나?! 갑자기 넘어져서 물에 빠지다니!"
1010103-102 = "[s] \"괜찮아. 발을 잠깐 헛디뎠을 뿐이야.\""
1010103-103 = "하지만 옷이 전부 젖어버렸다. 말릴 곳을 찾아야……."
1010103-104 = "응? 이걸 보라고?"
1010103-105 = "반사적으로 손을 치켜든 덕에 녹음기는 멀쩡하니 괜찮다, 고……?"
1010103-106 = " 크흠, 아무리 그래도 그런 상황에서는 선생 자신을 우선하는 게 좋다."
1010103-107 = "그러다 혹 감기라도 걸리면 선생을 볼 면목이 없지 않은가."
1010103-108 = "……그래도, 고맙다, 선생. 덕분에 샘플 수집을 계속할 수 있겠어."
1010103-114 = "이번에는 해안가의 숲이라……."
1010103-118 = "몇 걸음 들어왔을 뿐인데도 풀벌레 소리가 요란하군."
1010103-119 = "[s] \"이것도 쓸 수 있어?\""
1010103-120 = "음, 그건 실제로 시도해 봐야 알 수 있겠지. 우선은 다양하게 수집하려고 한다."
1010103-124 = "그럼, 잠깐 조용히 걷도록 하지."
1010103-131 = "……이렇게 걷고 있으니 어딘가, 묘한 기분이군."
1010103-132 = "무언가를 쫓거나, 누군가에게 쫓기거나, 시간에 맞추기 위해서 달리지 않아도 된다니."
1010103-133 = "생각해 보니, 한 번도 이런 여유를 가져본 적이 없었다."
1010103-134 = "아르바이트가 바쁘기도 하고."
1010103-135 = "[s] \"산책이 하고 싶어진다면, 언제든 불러도 괜찮아.\""
1010103-139 = "……선생이라면 그렇게 말할 것 같았다."
1010103-140 = "음, 기억해 두도록 하지."
1010103-151 = "후, 벌써 시간이 이렇게 되었군."
1010103-152 = "슬슬 헤어질 시간이 되었을지도 모르겠어."
1010103-153 = "[s] \"아르바이트를 위해 이렇게까지 하다니, 사오리는 성실하네.\""
1010103-154 = "아르바이트…… 그, 그렇지. 오늘은 일을 위해서……."
1010103-155 = "일깨워줘서 고맙다. 하마터면 깜빡 잊을 뻔했어."
1010103-156 = "임무를 잊는다는 것은 마음이 풀어져 있다는 증명일 터…… 그건 어째서일까."
1010103-161 = "그런가. 마음이 풀어진 이유는……."
1010103-162 = "[s] \"이유는?\""
1010103-166 = "어, 업무상 비밀이다."
1010103-167 = "아, 아무튼 수집한 소리로 만든 곡은 나중에 들려주겠다. 음악으로 만들려면 후처리가 필요하니 말이지."
1010103-168 = "시간도 늦었으니, 이만 헤어지도록 하지."
1010103-174 = "고생했다, 선생. 어울려줘서 고마워."
