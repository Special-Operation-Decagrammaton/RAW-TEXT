[translation]
2006102-1 = "일종의 매너리즘"
2006102-3 = "……일종의 매너리즘이라고 할까."
2006102-4 = "비슷한 작업, 비슷한 결과물이 반복되면, 역시 새로운 자극을 원하게 되는 법이지."
2006102-5 = "유행이 돌고 도는 거로 비유하면 조금 더 알기 쉬우려나?"
2006102-6 = "[s1] \"그러니까, 정리하자면…….\"\n[s2] \"부원들이 바다에 가고 싶다고?\""
2006102-9 = "일단은, 온천수 모래찜질이라는 녀석에 꽂힌 듯한데."
2006102-10 = "결국에는 해변까지 가야 하니까 사실상 같은 이야기긴 하지."
2006102-11 = "물론, 그 자체로는 별 문제없어. 바다라면 몇 번 다녀오기도 했고, 해변 개발의 노하우도 슬슬 쌓인 참이라."
2006102-12 = "근데 문제는, 바로 그 몇 번에 있다는 거지만."
2006102-13 = "일종의 매너리즘이라고 할까."
2006102-14 = "그래도 부장 체면이 있는데, 매번 빈손으로 가는 것은 좀 그렇잖아? 응?"
2006102-15 = "[s3] \"즉, 부원들이랑 바다에 가는데…….\"\n[s4] \"여행 준비를 도와달라는 거네?\""
2006102-18 = "……선생님은 얘기를 청춘스럽게 꾸미는 재능이 있단 말이지."
2006102-19 = "아, 오해하지 마. 칭찬이니까. 암, 칭찬이지."
2006102-25 = "그래서, 선생님은 이 도움이 필요한 학생을, 도와주는 걸까?"
2006102-26 = "[s5] \"이런 일이라면 얼마든지!\"\n[s6] \"저는 당신을 도우러 온 사람입니다.\""
2006102-29 = "하핫! 대답 한 번 시원시원하네!"
2006102-30 = "하기로 정해졌다면, 한시가 아깝지!"
2006102-34 = "가자고! 고! 고!"
2006102-40 = "역시, 시작은 식료품일까?"
2006102-41 = "아아, 물론 옮기는 것도 일이고, 신선도를 고려하면 현지에서 사는 것이 좋겠지만."
2006102-42 = "우리 애들은 원체 잘 먹어서 말이야! 해번 물가로는 내 지갑이 못 견디거든, 와하핫!"
2006102-43 = "일단, 고기를 챙길까."
2006102-50 = "응? 좀 많지 않느냐고?"
2006102-51 = "나도 그렇게 생각했지! 근데, 전혀 그렇지 않아!"
2006102-52 = "먹는 양의 문제가 아니라, 다들 엄청나게 좋아한단 말이지, 고기."
2006102-53 = "물론, 영양 밸런스를 고려해 채소도 챙겨야겠지만."
2006102-57 = "아, 그러고 보니, 전에 전골 얘기가 나왔는데."
2006102-58 = "그렇다면……."
2006102-62 = "(그렇게 카스미와 함께 여러 식료품을 골랐다. 그리고…….)"
2006102-66 = "아참, 그러고 보니."
2006102-67 = "혹시 기대하는 눈치라 미리 말하는데."
2006102-68 = "유감스럽게도 수영복은 있어. 그러니까 맞춰보지는 않을 거야."
2006102-69 = "[s7] \"갑자기……?\"\n[s8] \"절 뭐라고 생각하시는……?\""
2006102-72 = "흐응? 그럴까? 내가 듣자 하니……."
2006102-73 = "샬레의 선생님이 학생들이랑 수영복을 고르는 모습이 몇 차례나 목격되었다고……."
2006102-77 = "……와하하핫! 더 캐물을 생각은 없으니까 걱정 말라고!"
2006102-78 = "여기는 옷 말고도 이것저것 팔아서 말이야."
2006102-83 = "일단은 모기약이랑, 반창고랑 연고는 꼭 있어야지. 그리고……."
2006102-88 = "……음."
2006102-89 = "으으음~"
2006102-90 = "[s9] \"뭔가 문제 있어?\"\n[s10] \"그건, 폭죽?\""
2006102-93 = "……아니, 좀 변화를 주고 싶긴 한데, 이런 것은 내가 또 잘 모르겠어서 말이야."
2006102-94 = "폭죽이라고 해봐야, 평소에 쓰는 다이너마이트보다 화력도 약하고, 여러모로…… 소박하잖아?"
2006102-95 = "이런 걸 준비하는 게 의미가 있을런지……."
2006102-99 = "응? 전혀 다르다고?"
2006102-100 = "음음. 과연, 폭죽놀이라고 할 정도로, 폭죽은 밤에 쏘는 것 자체에 의미가 있다는 건가."
2006102-104 = "역시 선생님의 관점은 도움이 되네!"
2006102-105 = "확실히 놀이라고 하면, 우리 부원들은 좋아하겠지. 음, 이 부분에서는 선생님의 감각이 정확하겠어."
2006102-106 = "기왕 묻는 김에 한두 가지 더 확인해 볼까."
2006102-107 = "실은, 튜브 말인데……."
2006102-110 = "(그렇게 카스미의 '장보기'에 어울리며 시간을 보냈다.)"
2006102-121 = "이야~ 선생님이랑 오길 잘했어."
2006102-122 = "나 혼자였다면 여느 때랑 똑같은 합숙으로 끝날 뻔했지 뭐야."
2006102-123 = "그보다 선생님은, 이렇게 늦은 시간까지 어울려서 괜찮아?"
2006102-124 = "[s11] \"신경 쓰지 마.\"\n[s12] \"오히려 즐거웠어.\""
2006102-127 = "또, 또, 그렇게 듣기 좋은 말만~"
2006102-129 = "거기 둘!"
2006102-138 = "헤헷, 분위기 좋은데. 옷, 좋아 보인다?"
2006102-139 = "근데 여기가 어딘지는 알고 있지?"
2006102-140 = "이런 시간에, 블랙마켓을 어슬렁거린다는 것은……. 이런 일도 예상한 거지?"
2006102-141 = "그 장바구니, 꽤 두둑하네?"
2006102-142 = "이 언니들이 가진 게 없어서 그런데 좀 나눠주지 않겠어?"
2006102-147 = "……."
2006102-148 = "…………."
2006102-149 = "[s13] \"저, 카스미…….\"\n[s14] \"잠깐만…….\""
2006102-152 = "아이참, 이 언니들 왜 그러실까?"
2006102-157 = "으, 응?"
2006102-159 = "나도 이 동네 사람이야. 한 다리만 건너면 아는 사이일걸?"
2006102-160 = "우리끼리 이러는 건 진짜 아니지."
2006102-162 = "아니, 뭔……."
2006102-167 = "……."
2006102-168 = "에이씨. 봉인 줄 알았는데, 완전 이쪽 녀석이잖아."
2006102-169 = "쩝. 그래, 가봐라."
2006102-176 = "아, 정말이지~ 막판에 기분을 잡쳤네!"
2006102-177 = "블랙마켓은 다 좋은데, 종종 저런 녀석들이 나타나서 곤란하단 말이지."
2006102-178 = "내가 대신…… 음?"
2006102-179 = "선생님? 뭔가 문제라도? 넋이 나갔는걸?"
2006102-180 = "[s15] \"……아니, 좀 의외라.\"\n[s16] \"솔직히 카스미라면…….\""
2006102-183 = "펑!"
2006102-184 = "……하고, 폭탄이라도 터트릴 줄 알았다, 려나?"
2006102-185 = "이거 너무하구만! 나도 상식과 교양이 있는데 말이야!"
2006102-186 = "……농담이야, 농담."
2006102-187 = "당연히, 선생님 상대로는 그렇게 보이게 했으니까. 선생님 상대로는 그게 또 잘 먹혔거든."
2006102-191 = "원래 같았으면, 아까 뭐라도 했겠지만…… 지금 선생님 상대로는 그럴 필요가 없다고 할까."
2006102-192 = "어차피 내가 미친 사람처럼 굴지 않아도, 어련히 도와주려고 안달이 난 사람을 왜 볶겠어?"
2006102-193 = "그에 비해, 저런 조무래기들은…… 뭐, 내 입장에서는 아무래도 좋아. 어차피 내일이면 기억도 못할 테고."
2006102-194 = "적당히 말이 안 통했으면 다른 수를 썼겠지만……."
2006102-195 = "그렇게 머리가 돌아가는 녀석들도 아니었던지라! 와핫핫하~!"
2006102-201 = "아무튼, 오늘은 고마웠어!"
2006102-202 = "고생시킨 보답이라 하긴 뭐하지만, 아까 산 간식이라도 좀 가져가겠어?"
2006102-204 = "(……그렇게, 카스미에게 다 식은 붕어빵 봉투를 받고 샬레로 돌아왔다.)"
