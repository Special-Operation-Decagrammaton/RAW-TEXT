[translation]
63040-1 = "제4화;로열 블러드"
63040-2 = "로열 블러드."
63040-3 = "특별한 피. 특별한 혈통."
63040-4 = "생각해 보면 예전부터, 주위로부터 여러 가지로 떠받들어 주었지만."
63040-5 = "거기에, 큰 의미는 없었다."
63040-6 = "그도 그럴 게, 어차피 심한 꼴을 당했던 건, 마찬가지였으니까."
63040-7 = "특별한 존재라고, 괜히 할 수 없는 일만 많았고, 말할 수 없는 것들만 많기도 했고."
63040-9 = "고마워, 삿 쨩."
63040-10 = "삿 쨩이 있어 줘서, 그 시간들을 버틸 수 있었어."
63040-12 = "고마워, [USERNAME] 선생님."
63040-13 = "선생님을 만나서, 나는 비로소 내가 될 수 있었던 것 같아."
63040-15 = "미사키도, 히요리도."
63040-16 = "모두가 없었다면 나는, 말할 수 없는 인형이자 제물로."
63040-17 = "평생을 의미 없이, 누군가와 무언가의 상징으로서 살아가야 했겠지."
63040-19 = "아리우스의 신비에 대해 알게 되어서, 조금 들떴어?"
63040-20 = "이 땅에 잠들어 있는 것들이 무엇인지 약간 눈치채서, 이젠 뭐든 할 수 있을 거라고 생각했어?"
63040-24 = "유감이야. 그 정도 지식."
63040-25 = "나는, 선배가 상상도 하지 못했을 시절부터, 계속 알았어야 했어."
63040-26 = "그래도 한 가지는 확신할 수 있게 됐네."
63040-27 = "계시록의 천사 현상은, '선배'가 불러일으킨 것이었다는 걸."
63040-28 = "심지어 처음에는 의식도 하지 않고 그 현상을 일으켰던 거지? 어떤 의미로는 소환해 냈다고 볼 수도 있었을 거고."
63040-29 = "그래. 선배에게는 아쉬운 일이겠지만."
63040-30 = "이건 경전에 기록된 진짜 일곱 나팔 부는 천사가 아니야."
63040-31 = "하지만 말이지. 정말로 그 일곱 나팔 부는 천사로 승화할 가능성도 있었어."
63040-32 = "선배가 완전무결한 심판자일 수 있었다면 말이지."
63040-33 = "완전무결한…… '심판자'?"
63040-34 = "이야기했지만, 선배만이 아리우스인 것은 아니야."
63040-35 = "다시 말해, 선배 혼자만 아리우스의 비의를 알게 된 것이 아니라는 거야."
63040-36 = "왜냐하면 선배가 막 알게 된 것의 대부분은, 나에게는 이미 '알았어야 했던' 것들이었으니까."
63040-37 = "다만 소리내어 이야기하는 것이 금지되었을 뿐이지. 그건 지금도 마찬가지고."
63040-38 = "아리우스의 로열 블러드라는 건, 그런 것이었으니까."
63040-39 = "그래도 감사를 표할게. 스바루 선배."
63040-40 = "선배가 드러내어 버린 부분은, 이걸로 간신히 이야기할 수 있게 되었으니까."
63040-41 = "아, 속 시원해. 나만 알고 다른 모두가 모른다는 거, 엄청 답답한 거거든?"
63040-42 = "[ns] \"정확히, 뭐가 어떻게 된 거야. 아츠코……?\""
63040-43 = "우리 앞에 있는 저 천사…… 아니, 천사처럼 생긴 것은."
63040-46 = "말하자면, 아리우스의 모든 감정이 모여 형태를 이룬, 말 그대로 '현상'일 거야."
63040-47 = "얼마 전에 이야기했지? 아리우스는, '무언가'가 일어나는 땅이 되었다고."
63040-49 = "[ns] \"아……!\""
63040-51 = "아리우스에서는 원래, '무언가'가 있었어."
63040-52 = "한탄, 원한, 울분, 분노, 체념…… 여기는 그런 것들이 모인 거리지."
63040-54 = "그건, 아리우스가 세상의 멸망을 바랐기 때문이냐고?"
63040-57 = "솔직하게 말할게, 선생님. 바로 그래."
63040-61 = "마을로부터 따스함을 얻지 못한 아이는, 따스함을 얻기 위해 마을을 불태우겠죠."
63040-62 = "더 이상 잃을 것이 없는 사람에게, 세상의 멸망은 어쩌면 구원으로 다가올지도 모르는 일이고요."
63040-64 = "[ns1] \"스, 승화할 가능성도 있었다는 건?\"\n[ns2] \"완전무결한 심판자였다면 가능했을 거라고도 했지?\""
63040-67 = "맞아. 아리우스에 쌓여 왔던 것은, 명백하게 그런 결과를 이루어 낼 수 있을 만큼의 '무언가'이기는 했어."
63040-68 = "……최소한 트리니티에게, '어떤 종류의 결과'를, 되돌려줄 수 있을 정도는 되었지."
63040-69 = "말 그대로 스바루 선배가, 완전무결했다면 말이야."
63040-70 = "그렇다면 무언가, 흠결이 있었다는 거야?"
63040-71 = "있었어."
63040-72 = "그건 바로, 이 아이야."
63040-73 = "아……!"
63040-77 = "나…… 는……."
63040-78 = "드디어 이해한 모양이네."
63040-79 = "선배가 이 아이를 '버린' 순간, 선배의 어떤 행동도 정당화될 수 없었던 거야."
63040-80 = "차라리 선배가, 선배 본인을 매개체로 이 천사 현상을 구축했다면 오히려 나았겠지."
63040-81 = "하지만 선배는 선배 스스로의 의지로, <나팔 부는 천사>가 되기를 선택했어."
63040-82 = "이해는 할 수 있어. 선배든 누구든, 아리우스에 남은 모두는 어떤 식으로든 심판자가 되고 싶어 했겠지."
63040-83 = "하지만 말이야."
63040-84 = "심판자라는 것은 본디, 완전무결해야 하는 법이야."
63040-85 = "<네가 만든 올무가 너를 얽매고 넘어지게 하리라.>"
63040-86 = "선배라면 그 경구, 기억하고 있겠지?"
63040-87 = "하다못해 마이아가 우리를……."
63040-88 = "'선생님'을 찾아오지 않았어도, 선배는 심판자가 될 수 있었을 텐데."
63040-91 = "저를, 버리지 말아 주세요!"
63040-103 = "아……."
63040-104 = "아…… 아아……."
63040-106 = "스바루?"
63040-107 = "희미하지만 목소리가 들렸어. 혹시, 어쩌면……?!"
63040-108 = "……."
63040-116 = "히, 히요리 씨……?"
63040-117 = "할 말이 있으면, 해야 해요. 마이아."
63040-121 = "애, 애초에 우리…… 뭔가, 이야기라도 좀 나눠 보자고…… 여기까지, 온 거잖아요?"
63040-123 = "……."
63040-127 = "네. 알겠어요. 감사합니다. 히요리 씨."
63040-130 = "저, 선배? 그, 저기, 드리고 싶은 말이, 있었어요. 그때 이후로, 계속요."
63040-132 = "괜찮아요. 선배."
63040-133 = "전부 다…… 괜찮아요."
63040-134 = "…………!"
63040-135 = "전부라고는 말할 수…… 없겠지만, 그래도 선배를 이해해요."
63040-136 = "선배도, 스쿼드 여러분도. 아리우스의 모두도."
63040-137 = "그리고 [USERNAME] 선생님도, 저는 모두 좋아하니까."
63040-138 = "저는 아직도 아리우스가 남아 있었으면 하니까."
63040-139 = "그리고 아리우스가, 더 좋은 학교로 변해 갔으면 하니까."
63040-140 = "그, 그러니까……."
63040-144 = "그러니까…… 후우……."
63040-145 = "저 좀 도와주세요, 선배!!!!!"
63040-147 = "…………!"
63040-148 = "저, 선배의 하모니카, 정말로 좋아하니까요!!!!!"
63040-150 = "다음화;하모니카 2"
