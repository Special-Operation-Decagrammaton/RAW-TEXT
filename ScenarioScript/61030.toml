[translation]
61030-1 = "제3화;새로운 시작"
61030-6 = "어, 어서 오세요. 선생님."
61030-7 = "여기가…… 저희 기숙사 방이거든요."
61030-9 = "[ns1] \"그래서 무슨 일이야?\"\n[ns2] \"뭐든 좋으니까, 편하게 이야기해 줘.\""
61030-12 = "아, 맞다……! 깜빡했어……!"
61030-13 = "뭐가? 아……!"
61030-14 = "서, 서서서, 선생님! 정말, 정말로 죄송한데요……."
61030-15 = "1분만…… 아뇨, 5분만 잠시 밖에 계셔 주면…… 안 될까요?!"
61030-16 = "저희가 초대해 드려 놓고, 이런 말씀을 드리는 게 이상하다는 건 아는데요!"
61030-17 = "부탁드립니다! 정말 5분이면 되니까요!"
61030-19 = "(일단 학생들의 말대로 복도에 나가 있기로 했다.)"
61030-20 = "(잠시 시간이 지나고…….)"
61030-24 = "이, 이제 들어오셔도 괜찮아요……. 아, 아뇨! 들어와 주세요!"
61030-31 = "[ns] \"어……?!\""
61030-32 = "다, 다시 한번…… 안녕, 하세요. 선생님."
61030-33 = "죄송해요. 놀라셨죠……? 괘, 괜찮아요! 저희, 그런 거 아니에요! 저희는, 그러니까……."
61030-34 = "그, 트리니티 분들의 표현대로 하자면, 아리우스 편입생들입니다!"
61030-36 = "[ns] \"아……!\""
61030-44 = "기억나실지는 모르겠지만……. 그, 마담이 아리우스에서…… 완전히, 모습을 감춘 날이 있었잖아요?"
61030-45 = "거기까지는 좋았는데, 남은 아리우스 아이들은 이제부터 어떻게 되는지, 그리고 어떻게 살면 좋을지…… 다들 불안해하고 있었죠."
61030-46 = "그러고 있었는데…… 어느 날 처음 보는 아이들이, 우리에게 다가왔어요."
61030-49 = "……여기라면 괜찮을 것 같네요."
61030-53 = "?! 그 교복은……!"
61030-54 = "트, 트리니티!?"
61030-58 = "쉬잇. 죄송합니다. 놀라셨죠. 네. 저는 트리니티에서 왔습니다."
61030-59 = "사실 이 복장이 아니라, 원래는 티파티의 제복을 입어야 했겠지만……."
61030-61 = "티파티……?"
61030-62 = "그게…… 뭔가요?"
61030-64 = "……."
61030-65 = "그냥, 다과를 즐기는 트리니티의 동아리 같은 것이랍니다."
61030-67 = "네?! 트리니티로 편입이……. 가능하다고요!?"
61030-68 = "하지만 우리는…… 트리니티는……."
61030-70 = "네. 무슨 말씀인지 알 것 같네요."
61030-71 = "하지만 이것은 강요나 압박 같은 것이 아닙니다. 어디까지나 일종의…… '권유'죠."
61030-72 = "이 제안을 받아들여서 트리니티에서 새로운 학교생활을 시작하셔도 좋고."
61030-73 = "아니면 또 다른 선택을 하신다고 해도, 저희는 여러분의 모든 선택을 존중할 거예요."
61030-74 = "하지만, 이렇게 갑작스럽게……."
61030-75 = "맞아요. 너무 뜬금없는 이야기로 들리셨겠죠. 그러니 조금 더 시간을 들여서 천천히 생각해 주세요."
61030-76 = "트리니티…… 티파티…… 의 일부는, 어떤 의미로 여러분을 환영할 준비가 되어 있으니까요."
61030-77 = "……공개적인 환영은…… 많이, 어려울 것 같지만요."
61030-78 = "그렇지만…… 만일 저희가 트리니티…… 에 편입할 수 있고, 트리니티의 어떤 분들은 그걸 조용히 환영해 주신다고 해도."
61030-79 = "다른 트리니티 학생들이…… 그걸 가만히 두고 볼까요……?"
61030-80 = "네. 그 부분이 저희로서도 정말 어려운 부분이기는 해요. 기본적으로 트리니티에는…… 정말로 많은 파벌과 동아리가, 존재하고 있으니까요."
61030-81 = "만일 여러분이 편입을 선택하신다면, 여러분은 이름도 잘 알려지지 않은 '시골 학교의 전학생'으로 서류 처리가 될 거예요."
61030-82 = "……그게 지금 이 시점에서 저희가 해 드릴 수 있는, 최대치이기도 합니다."
61030-87 = "……."
61030-88 = "……."
61030-90 = "천천히 생각해 주세요. 정말로 괜찮습니다. 이것도 이미 한번 해 드린 말씀이지만요."
61030-94 = "그리고 마음을 정하시게 된다면, 이 번호로 조용히 연락 부탁드립니다."
61030-97 = "……."
61030-98 = "……."
61030-100 = "고민했어요."
61030-101 = "정말, 정말, 정말 많이 고민했어요."
61030-102 = "모든 게 불안했거든요. 우리 처지, 아리우스 바깥, 트리니티, 그리고 또……."
61030-106 = "……결국 결정하게 된 계기는, 어디에서 뭘 해도 지금보다는 낫지 않을까, 하는 감정이었어요."
61030-115 = "[ns] \"그렇게 된 거구나…….\""
61030-116 = "네……."
61030-117 = "그, 그래서 저희 말고도 트리니티로 온 아이들…… 이제 제법 생겨났어요."
61030-118 = "거의 1학년이나 2학년이 많기는 하지만요……."
61030-120 = "[ns3] \"그래……. 그랬구나.\"\n[ns4] \"……고생이 많았겠네.\""
61030-123 = "아, 아뇨. 고생은요. 무슨. 아직도 꿈 같이 느껴지기는 하지만요."
61030-124 = "예전에는…… 이불은커녕, 낡은 모포 정도라도 구할 수 있었으면 다행이었는데……."
61030-125 = "침대라는 거 정말 좋더라구요. 헤. 헤헤……."
61030-126 = "사실 아리우스에서도 침대 같은 것은 있었지만, 그런 것에 의지하면 나약해진다고……."
61030-131 = "[ns] \"……미안해. 모두.\""
61030-134 = "(고개를 숙여, 아이들에게 사과했다.)"
61030-135 = "네, 네에?! 서서서서, 선생님께서 왜요?"
61030-136 = "마, 맞아요! 저희는 어떻게 보면 선생님 덕분에…… 이렇게……."
61030-137 = "[s] \"그렇다고는 해도, 너무 너희들을 신경 쓰지 못했어.\""
61030-138 = "그, 그래도요! 너무 그러시면, 저희가……."
61030-139 = "선생님께 상담 드리고 싶었던 건, 이런 게 아니기도 했고……!"
61030-141 = "(생각해 보니, 아이들의 말을 들어야 한다는 사실을 뒤늦게 깨달았다!)"
61030-143 = "상담 내용이요? 다, 다행이다……. 드디어 여쭤볼 수 있게 되었네요. 헤. 헤헤……."
61030-144 = "그러니까, 저기……. 이런 건데요."
61030-145 = "종합고사라는 게, 뭔가요?"
61030-146 = "[s] \"……어?\""
61030-147 = "네. 사실은, 종합고사라고 할까, 그 이전에…… '시험'이라는 게 뭔지, 잘 모르겠어서……."
61030-148 = "아리우스에 있었을 때는…… 이런 식으로 뭘 공부해 본 적도 없었고……."
61030-149 = "그렇다고 해서 그걸, 주위에 물어보기에는…… 조금 그래서요."
61030-150 = "저희들 말고 다른 트리니티 학생들은, 너무 자연스럽게 잘 알고 있는 것 같고……."
61030-151 = "그래서, 선생님한테……."
61030-152 = "맞아요! 선생님은, 선생님이시잖아요?"
61030-154 = "[ns] \"……그래. 그랬구나.\""
61030-156 = "[ns] \"생각해 보면 우리, 이렇게 서로 보는 건 아예 처음이네?\""
61030-157 = "네? 그렇지만 그건, 당연한 일이 아닐까 하는데요……?"
61030-158 = "맞아요. 우리는…… 아리우스 출신이니까요……."
61030-159 = "그런 식으로 말하면 안 된다고요? 하지만……."
61030-160 = "아, 알겠습니다. 적어도, 선생님 앞에서만큼은……."
61030-166 = "읏……?!"
61030-167 = "힉……!"
61030-169 = "(무심코 머리라도 쓰다듬어 주려고 손을 내밀었다.)"
61030-170 = "(그러자, 아리우스 학생들은 반사적으로 겁에 질려, 몇 걸음 떨어지려 했다…….)"
61030-177 = "죄죄죄죄, 죄송, 합니다. 선생님. 이건, 그러니까!"
61030-178 = "네! 맞아요! 아니에요……! 저희가 선생님을 그렇게 생각하고 있는 게 아니라……!"
61030-179 = "[s] \"그래. 괜찮아.\""
61030-180 = "하, 하지만……."
61030-181 = "……."
61030-183 = "[ns] \"괜찮아.\""
61030-185 = "[ns] \"……이제, 괜찮아.\""
61030-189 = "(잔뜩 겁먹은 작은 동물처럼, 아리우스 학생들이 조금씩 다가왔다.)"
61030-190 = "……하우으……."
61030-191 = "웃…… 훌쩍……."
61030-193 = "(뒤늦게 깨달은 것이었지만, 아리우스 학생들의 체구는 보통 학생들보다도…… 조금 더 작은 것처럼 느껴졌다.)"
61030-194 = "(아이들을 진정시키고, 시험이란 것은 어떤 것인지, 그리고 그건 왜 중요한지 천천히 이야기했다.)"
61030-196 = "그렇, 군요……. 어떻게 보면 사람을 한 가지 결과로만 평가하는, 아쉬운 방법이기도 하지만."
61030-197 = "배운 것을 다시 한번, 확실히 습득하게 해 주는 효과도 있으니까……."
61030-198 = "그렇게 보면 아리우스에서도 시험이라는 개념이 있긴 했네요!"
61030-199 = "탄창 무게만으로 잔탄이 얼마나 남았는지, 근접 상황에서는 어떻게 대응해야 하는지……."
61030-203 = "헤일로를 어떻게 하면 효율적으로 손상시킬 수 있는지, 그런 것들이었지만요."
61030-204 = "야, 야!"
61030-205 = "어? 왜? 아……!"
61030-206 = "죄, 죄송해요! 선생님! 이런 이상한 이야기 꺼내서……!"
61030-207 = "네? 그런 것보다 그동안 어떻게 지냈냐고요? 어…… 음…… '학교생활'을 했어요! 헤. 헤헤……."
61030-208 = "저희 입으로 말하고 보니까, 뭔가 우습네요."
61030-209 = "좋았냐고요? 그런 것도 있지만, 무엇보다 신기했어요……."
61030-210 = "불침번을 서지 않아도 되고, 하루에 한 끼만 먹지 않아도 되고, 누가 혼내거나 독방에 집어넣고 소리치는 일도 없고……."
61030-211 = "그 때문인지는 모르겠지만, 약간 덥다고 느끼기는 해요."
61030-212 = "아리우스는…… 추웠으니까요……."
61030-214 = "[ns] \"트리니티 학생들은 잘 대해 주니?\""
61030-215 = "네? 네. 그럼요. 일단 저희는 그냥, 다른 시골 학교에서 전학 온 학생들로 되어 있으니까요."
61030-216 = "오히려 다들 지나치게 친절하시고 조심해 주셔서…… 약간, 부담스럽다고 할까요……."
61030-217 = "가끔 트리니티 분들과 '카페'라는 곳에 가기도 하는데……"
61030-218 = "우와. 그, 그렇게 비싼 걸, 서슴없이 턱턱 시키는 걸 보고, 표정 관리하느라 힘들기도 했어요."
61030-219 = "아직도 커피나 케이크 이름, 잘 못 외워요. 엄청 비싸고, 엄청 맛있지만요. 헤. 헤헤……."
61030-220 = "그, 그래서 카페 비용이라든지, 이것저것 돈이 많이 들어서, 아르바이트를 하고 있기도 하거든요?"
61030-221 = "그것도 재미있어요! 어떻게 보면 학교에서만큼 배우는 게 많기도 하고요."
61030-222 = "가령 월급날이 일주일 정도 남았을 때가, 가장 지갑이 가벼워진다는 사실이라든가요……."
61030-223 = "[s] \"어른이~ 되어도~ 그건 마찬가지더라~\""
61030-224 = "서, 선생님도요?! 선생님은 그래도 뭔가 더…… 더…… 대단하실 줄 알았는데……."
61030-225 = "뭔가 더 풍족하거나, 여유로우시거나……."
61030-226 = "사람 사는 게 다 거기에서 거기라고요……? 그, 그런가요……. 그건 왠지 좋네요."
61030-227 = "네……. 좋네요……."
61030-228 = "……."
61030-229 = "……."
61030-230 = "저기, 선생님?"
61030-231 = "눈치채셨을지도, 모르지만……."
61030-232 = "모든 아리우스 학생들이, 트리니티로 편입된 것은 아니었어요……."
61030-233 = "[s] \"……그래.\""
61030-234 = "잘, 이야기할 수 있을지는 모르겠지만."
61030-235 = "어떤 학생들은 그대로…… 아리우스에 남기를 선택했어요."
61030-236 = "이유는, 여러 가지 있었지만……."
61030-237 = "……결국은, 트리니티와 세상을 받아들이기 어렵다는 이유에서였죠."
61030-238 = "여기에 있으면서, 생각해 보게 된 것이 있었어요."
61030-245 = "우연히, 자라고 배워 온 장소가 달랐다는 것만으로."
61030-246 = "한쪽은 하루에, 한 끼를 간신히 먹을 수 있었고."
61030-247 = "한쪽은 카페에서, 그렇게 비싼 간식들을 아무렇지도 않게 즐길 수 있었죠."
61030-248 = "어떻게 보면 누구보다도 가까울 수 있었던, 두 학원이었는데도요."
61030-255 = "……아리우스에 남은 학생들이, 어떤 식으로 살아가고 있을지는, 이제 저희도 잘 몰라요."
61030-256 = "짐작은 가능하지만, 결국 짐작일 뿐이죠."
61030-257 = "하지만 그 학생들이, 모든 외부로부터의 접촉을 끊고……."
61030-258 = "……일종의 게릴라식 항전을 계속하고 있다는 이야기는, 들었어요."
61030-260 = "선생님. 이제 저희는…… 생각은 사람마다 다른 것이고, 그걸 가능하다면 존중해야 한다는 것을 알아요."
61030-261 = "그렇지만 남은 아이들이 걱정되는 건…… 어쩔 수 없는 것 같아요."
61030-262 = "아직도 꿈에서, 거의 매일같이…… 아리우스에서 있었던 일들을 보고는 해요."
61030-263 = "저희 둘 중 한 명이 소리를 지르며 일어나곤 하죠. 가끔은 동시에 그러거나요."
61030-264 = "누가 더 많이 잠에서 깨는지, 누구 소리가 더 큰지 기록도 하고 있어요. 헤. 헤헤……."
61030-265 = "아직은 제가 이기고 있지만요."
61030-266 = "그때 그건 거의 같은 시간이었잖아!"
61030-267 = "네가 1분 늦었거든?"
61030-272 = "선생님. 이상하게 들리실 수도 있겠지만……."
61030-273 = "선생님이 시험에 대해서 이야기해 주신 걸 들으면서, 이런 생각을 했어요."
61030-274 = "아리우스에 남은 아이들에게도, 시험을 볼 기회가 주어졌으면 좋을 것 같다…… 고요."
61030-276 = "어? 그런 생각 하고 있었어?"
61030-277 = "여, 역시 이상하려나……?"
61030-278 = "아니, 나도 같은 걸 생각하고 있었어서, 신기해서……."
61030-279 = "[ns] \"그건…… 어째서?\""
61030-281 = "자, 잘은 설명하기 어렵지만요……."
61030-282 = "그냥, 트리니티 학생들이 그러는 것처럼, 아침에 일어나고, 수업을 듣고……. 그리고 시험이란 걸 보고…… 그러는 게……."
61030-283 = "그냥, 좋아서요. 학생이라면 왠지, 그래야 하는 것 같기도 하고요."
61030-284 = "공부가 싫다거나 짜증 난다는 이야기는, 종종 듣고는 하지만……."
61030-285 = "그, 낯설고 어렵다는 느낌은 들었어도…… 저희는 공부가 그렇게까지 싫지 않아요."
61030-286 = "여기에서 들은 말이기는 하지만, 학생의 본분은 공부라고 하잖아요?"
61030-288 = "[ns] \"……!\""
61030-295 = "서, 서서서서, 선생님?!?!"
61030-296 = "선생님!?!?"
61030-297 = "(너무나도 기특한 말에…… 그만 자신도 모르게 아이들을 마구마구 쓰다듬고 말았다!)"
61030-299 = "[ns] \"앗, 미안! 그런 말을 하는 학생이, 너무 간만이어서……!\""
61030-301 = "괘, 괜찮아요! 괜찮습니다! 정말, 이에요……."
61030-302 = "서, 선생님께서 괜찮으시다면……. 조금만, 이대로 있어도…… 될까요?"
61030-303 = "……."
61030-304 = "……."
61030-305 = "……사람의 체온이란, 따듯한 거군요."
61030-306 = "네. 정말로요. 헤. 헤헤……"
61030-308 = "[ns5] \"아무튼, 아리우스 아이들에게도……\"\n[ns6] \"'공부'할 기회가 있었으면 하는 거지?\"\n[ns7] \"'시험'까지 포함해서 말이야!\""
61030-312 = "네, 맞아요! 바로 그거긴 한데……."
61030-313 = "거기에서도, 저희가 조금 심하게 걱정하는 것 같기도 하지만……. 약간, 신경 쓰이는 부분이 있어서요."
61030-314 = "그게 뭐냐고요? 그러니까……."
61030-315 = "이 시험은, <트리니티 종합고사> 잖아요? 무, 물론 문제를 내는 건 오히려 트리니티가 아니라는 건 들었는데요……."
61030-316 = "[s] \"아……!\""
61030-317 = "네……. 트리니티를 용서하기 힘들어서, 결국 아리우스에 남은 아이들이……."
61030-318 = "<트리니티 종합고사>라는 이름을, 잘 받아들일 수 있을까 해서요……."
61030-319 = "거기에 솔직히 그 애들, 공부 같은 거 한 번도 안 해 봤을 거 아냐……."
61030-320 = "응……. 지금 아리우스 분교에 함부로 들어가려고 하면, 그 즉시 쫓겨난다고 하니까……."
61030-321 = "아리우스 분교 자체적으로, 교과 수업을 받고 있다면 모르겠지만……."
61030-322 = "무리야, 무리. 그게 됐으면, 진작에……."
61030-323 = "[s] \"그런 부분은 너무 걱정하지 마!\""
61030-324 = "네? 괜찮으시겠어요? 아, 아뇨. 그보다…… 어떤 방법이라도 있으신 건가요?"
61030-325 = "그, 그렇겠죠? 선생님이시니까, 어른이니까……! 분명 저희가 잘 모르는 방법이……!"
61030-326 = "[s] \"방법이 없어 보여도 그걸 생각해 내는 게, 어른의 일이란다.\""
61030-327 = "여, 여전히 잘 모르겠지만……."
61030-328 = "왠지, 믿음이 가네요. 헤. 헤헤……."
61030-329 = "선생님께 상담 드리는 게…… 역시 정답이었나 봐요……."
61030-333 = "저, 그러면요. 선생님? 조금, 너무 주제넘은 부탁일지도 모르겠지만요……."
