[translation]
84307100200-5 = "잘 왔어, 네루. 마침 해야 할 일이 또 하나 생겼어."
84307100200-9 = "……? 뭐? 나 이제 막 왔는데?"
84307100200-10 = "너무 당연하다는 듯이 막 부려 먹는 거 아니냐? 물론 내 입으로 돕겠다고 하긴 했지만서도……"
84307100200-11 = "……세이아는? 설마 이거, 나만 부려 먹는 건 아니겠지?"
84307100200-12 = "그렇지 않아. 그녀도 충분히 그녀에 맞는 일을 하고 있어. 나 또한 그렇고…… 네 노고에 대해서도 당연히 인지하고 있어."
84307100200-13 = "인지하고 있지만…… 그래. 유리조노 세이아에게는 맡길 수 없는 일이기 때문이지, 이번 일은."
84307100200-14 = "이번 일은……? 뭔데? 싸움이라도 해야 하는 일인 거냐?"
84307100200-15 = "응."
84307100200-19 = "오케이. 그러면 뭐, 별수 없지."
84307100200-20 = "……납득이 빠르네."
84307100200-21 = "납득할 만한 설명이었잖아. 왜? 뭔가 뜸 들이는 립 서비스 반응 같은 걸 해줬으면 했어?"
84307100200-22 = "아니."
84307100200-23 = "그보다…… 이걸."
84307100200-24 = "……? 뭐야, 이건?"
84307100200-28 = "어? 무릎 보호대네. 이것도 뭔가의 발명품 같은 거냐?"
84307100200-29 = "특별히 새로운 기술을 발명해서 만든 건 아니야. 하지만 특수한 기능이 탑재돼 있기는 하지."
84307100200-30 = "한 번의 움직임으로 빠르게 목표 지점까지 이동할 수 있어. 슬라이딩 시에 큰 소리도 나지 않게 돼 있고."
84307100200-34 = "그리고 이것도……."
84307100200-39 = "근거리에서 대상을 제압할 때, 충격은 전달하되 소리는 나지 않게 해주는 특수 패드야. 너의 행동 특성상, 도움이 될 거라고 판단했어."
84307100200-40 = "헤…… 재미있는 장난감들이잖아. 나쁘지 않은데."
84307100200-44 = "이걸 줬다는 건…… 이번에 바로 써 봐도 된다는 뜻이겠지?"
84307100200-45 = "물론. 그걸 위한 전달이었으니."
84307100200-48 = "임무는 간단해. 엑스포 회장에 숨어들어 출품작을 훔치려는 움직임이 포착됐어. 녀석들을 붙잡아 일망타진해야 하지."
84307100200-54 = "목표는 그들의 리더야. 리더를 붙잡지 않으면 이 움직임은 근절되지 않을 테니, 반드시 리더를 잡아 와야만 해."
84307100200-57 = "나머지는? 사실 다 때려서 쓰러뜨려도 괜찮은 거지?"
84307100200-58 = "총을 쏘지만 않는다면."
84307100200-59 = "헤에…… 기대되는데, 육탄전은 육탄전 나름의 재미가 있으니까 말이지."
84307100200-60 = "사실 전혀 걱정되지는 않지만, 빈말이라도 조심해서 다녀오라는 말을 해야겠지."
84307100200-61 = "빈말이라는 걸 말해버리면 아무 의미 없는 건데, 그거."
84307100200-62 = "……됐다, 뭐. 너는 그 정도만 해도 이미 장족의 발전이니까."
84307100200-66 = "그러면 다녀올 테니까, 여기서 기다리라고."
84307100200-68 = "……조심해서 다녀와."
