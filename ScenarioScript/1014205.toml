[translation]
1014205-1 = "Can Never Say No to Good Food"
1014205-2 = "I went to the beach with Nagusa again..."
1014205-6 = "But the sun was extraordinarily hot."
1014205-7 = ""
1014205-8 = "Ugh..."
1014205-9 = "I may melt away into nothingness..."
1014205-10 = "[s] \"Shall we head to the shopping district nearby?\""
1014205-11 = "Yes. We can find shade to rest beneath."
1014205-12 = "It will also be an opportunity to seek out more civilians."
1014205-13 = "[s1] \"Aha...\"\n[s2] \"You really want people to see us, huh?\""
1014205-16 = "It is only to dispel the rumors about the snow maiden."
1014205-17 = "I possess no ulterior motives."
1014205-18 = "..."
1014205-19 = "That is all. Truly."
1014205-20 = "So I implore you to wipe that strange smile from your face."
1014205-21 = "Though I may appear cold and heartless on the outside, I am but a shy girl within."
1014205-22 = "[ns] \"I-I'm sorry, Nagusa...\""
1014205-24 = "So we went to the shopping district nearby..."
1014205-27 = ""
1014205-28 = "The selection of stores here are quite interesting."
1014205-29 = "Look. A water gun shooting range. They distribute prizes depending on your score."
1014205-30 = "[s] \"You'd have no issue getting the highest score, Nagusa.\""
1014205-31 = "While true..."
1014205-32 = "...I believe observing another's efforts would be more entertaining."
1014205-33 = ""
1014205-35 = ""
1014205-36 = ""
1014205-37 = "Would you like to try, Sensei?"
1014205-38 = "I will coach you."
1014205-39 = "[s] \"Oh, cool! Let's go!\""
1014205-41 = "With Nagusa advising me, I challenged the water gun shooting range."
1014205-42 = ""
1014205-47 = "In the end I only walked away with a participation award, a piece of candy."
1014205-48 = ""
1014205-49 = "Fufu. All is well when genuine effort has been made. It was only luck which barred you from the next level prize."
1014205-50 = "[s] \"What was the prize right above the participation award?\""
1014205-51 = "Let's see..."
1014205-52 = "It says...\"1 Skewer Exchange Ticket\"..."
1014205-53 = "Above that, \"Skewer Set Exchange Ticket.\""
1014205-54 = "..."
1014205-55 = "Sensei. Get the gun. I will ensure your victory."
1014205-56 = "[s] \"Hey, I see what you're doing there.\""
1014205-57 = ""
1014205-59 = ""
1014205-60 = ""
1014205-61 = "...It was a joke."
1014205-62 = "I have recently become self-aware about my chicken skewer consumption of late."
1014205-63 = "So I have been practicing moderation."
1014205-64 = "[s] \"Just how many chicken skewers have you been eating?\""
1014205-65 = "W-Well..."
1014205-66 = "...That is a secret."
1014205-67 = "W-We should go elsewhere. Otherwise, I will fall to temptation."
1014205-68 = ""
1014205-70 = ""
1014205-71 = ""
1014205-72 = ""
1014205-76 = "But out of all places, we ended up at..."
1014205-77 = ""
1014205-80 = ""
1014205-81 = "Skewers! Delicious skewers for sale!"
1014205-82 = ""
1014205-84 = ""
1014205-85 = "..."
1014205-86 = "[s3] \"...\"\n[s4] \"You didn't come here on purpose, did you?\""
1014205-89 = "No, I did not."
1014205-90 = "It is mere coincidence. I swear."
1014205-91 = "[s5] \"...\"\n[s6] \"Do you want one?\""
1014205-94 = "..."
1014205-95 = "...No, I do not."
1014205-96 = "[s] \"Your heart says otherwise!\""
1014205-97 = "U-Um..."
1014205-98 = "Only because it would be improper of me to decline your kind gesture."
1014205-99 = "One chicken skewer, please."
1014205-100 = "One grilled with salt."
1014205-101 = "Because of the heat."
1014205-102 = "[s] \"Yeah, after all the sweating too.\""
1014205-103 = ""
1014205-106 = "[ns] \"One chicken skewer with salt, please!\""
1014205-108 = "Gotcha, one moment, please!"
1014205-111 = "A short while later..."
1014205-112 = ""
1014205-113 = "Here you go!"
1014205-114 = ""
1014205-116 = ""
1014205-117 = ""
1014205-118 = "Now, if you'll excuse me..."
1014205-119 = ""
1014205-121 = ""
1014205-122 = ""
1014205-123 = "[ns] \"H-How is it?\""
1014205-124 = "...Astonishing."
1014205-125 = "The tenderness of the meat and the crispness of the green onions blend together perfectly."
1014205-126 = "The meat is juicy, and the saltiness is perfect. The aroma of the charcoal grill is wonderful as well."
1014205-127 = "To think I can experience such a rich flavor in just one bite..."
1014205-128 = "I must return as often as possible."
1014205-129 = "[s] \"I can almost taste it from your description.\""
1014205-130 = "Would you like a bite, Sensei?"
1014205-131 = ""
1014205-133 = ""
1014205-134 = ""
1014205-135 = ""
1014205-136 = "...Ah."
1014205-137 = "This side remains untouched. I was not making any untoward advances."
1014205-138 = "[s] \"Sure, let's say that's the case.\""
1014205-139 = "S-Sensei...!"
1014205-141 = "After that, we had a lot of fun walking around the shopping district."
