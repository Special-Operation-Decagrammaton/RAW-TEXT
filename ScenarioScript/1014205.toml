1014205-124 = "อร่อยเหาะ..."
1014205-125 = "ความสุกของเนื้อไก่กับความกรอบของต้นหอมเข้ากันได้อย่างลงตัว"
1014205-126 = "ย่างมาแบบที่เนื้อยังชุ่มฉ่ำ แล้วก็ปรุงรสด้วยเกลือมาพอดีเลย ได้กลิ่นของถ่านที่ใช้ย่างด้วย"
1014205-127 = "กินไปแค่คำเดียว ไม่อยากเชื่อเลยว่าจะสัมผัสได้ถึงรสชาติที่เข้มข้นได้ขนาดนี้..."
1014205-128 = "ฉันต้องมาซื้อยากิโทริร้านนี้กินบ่อยๆ แล้วละ"
1014205-129 = "[s] \"แค่ฟังก็รู้สึกได้เลยนะว่าอร่อยแค่ไหน\""
1014205-130 = "คุณครูก็ลองชิมดูมั้ย?"
