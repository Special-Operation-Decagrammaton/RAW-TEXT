1014205-137 = "เนื้อตรงนี้ยังไม่โดนปากฉัน แต่ฉันก็ไม่ได้พูดเพราะมีความหมายแฝงอะไรหรอกนะ"
1014205-138 = "[s] \"อื้อ เอาอย่างนั้นก็ได้~\""
1014205-139 = "คะ... คุณครู...!"
1014205-141 = "(จากนั้นคุณครูกับนางุสะก็ใช้เวลาในย่านการค้าด้วยกันอย่างเพลิดเพลิน)"
