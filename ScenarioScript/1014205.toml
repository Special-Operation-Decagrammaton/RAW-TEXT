[translation]
1014205-1 = "美食當前難以忍耐"
1014205-2 = "（再次和名草一起前往了海邊……）"
1014205-6 = "（今天的陽光格外炙熱……）"
1014205-7 = ""
1014205-8 = "唔，唔唔……"
1014205-9 = "再這樣下去……感覺都要融化了。"
1014205-10 = "[s] 「要不要去附近的商店街看看？」"
1014205-11 = "嗯，那樣比較好。#n那邊應該有很多能休息的陰涼處。"
1014205-12 = "能看見我們的人，也會比這裡多。"
1014205-13 = "[s1] 「哦哦……」\n[s2] 「果然名草還是希望有很多人注意到我們對吧？」"
1014205-16 = "……我只是想解開對雪女的誤會而已。"
1014205-17 = "除此之外沒有別的意思。"
1014205-18 = "……"
1014205-19 = "是真的，我沒有說謊。"
1014205-20 = "所以別再用那種奇怪的表情盯著我看了。"
1014205-21 = "我雖然外表看起來平淡又冷靜……其實是個很害羞的少女。"
1014205-22 = "[ns] 「是，是我不好，名草……」"
1014205-24 = "（於是一起前往了商店街……）"
1014205-27 = ""
1014205-28 = "看起來……有很多有趣的店呢。"
1014205-29 = "那邊還有水槍射擊場，好像可以按照得分獲得獎品。"
1014205-30 = "[s] 「只要名草出馬，應該能拿到最高分吧？」"
1014205-31 = "或許是那樣沒錯……"
1014205-32 = "不過比起我來玩，讓別人來玩應該會更有趣。"
1014205-33 = ""
1014205-35 = ""
1014205-36 = ""
1014205-37 = "老師要試試看嗎？"
1014205-38 = "我會在旁邊指導你的。"
1014205-39 = "[s] 「哦哦……！好！」"
1014205-41 = "（之後在名草的指導下，開始了水槍射擊）"
1014205-42 = ""
1014205-47 = "（但是……最終贏到的獎品就只有參加獎的糖果而已……）"
1014205-48 = ""
1014205-49 = "呵呵，真可惜。#n要是運氣好一點的話，感覺有機會能拿到更高一級的獎品呢。"
1014205-50 = "[s] 「比參加獎高一級的獎品是什麼來著？」"
1014205-51 = "我看看……"
1014205-52 = "串燒1支兌換券……上面是這麼寫的。"
1014205-53 = "再高一級是串燒套餐兌換券……"
1014205-54 = "……"
1014205-55 = "老師，再試一次吧。#n這次我會更仔細地指導你。"
1014205-56 = "[s] 「私心馬上就露出來了啊！」"
1014205-57 = ""
1014205-59 = ""
1014205-60 = ""
1014205-61 = "……我是開玩笑的。"
1014205-62 = "其實……我自己也有自覺。#n最近我好像吃太多烤雞肉串了。"
1014205-63 = "所以現在正在克制。"
1014205-64 = "[s] 「那你所謂的克制是一週吃幾串？」"
1014205-65 = "那，那個……"
1014205-66 = "……這是祕密。"
1014205-67 = "總，總之先去別的地方吧。#n要是待在這裡，我怕自己會承受不了誘惑。"
1014205-68 = ""
1014205-70 = ""
1014205-71 = ""
1014205-72 = ""
1014205-76 = "（然而在離開後前往的地方卻……）"
1014205-77 = ""
1014205-80 = ""
1014205-81 = "歡迎光臨～！有美味的烤雞肉串哦～！"
1014205-82 = ""
1014205-84 = ""
1014205-85 = "……"
1014205-86 = "[s3] 「……」\n[s4] 「你不是故意往這邊走的吧？」"
1014205-89 = "不是。真的不是。"
1014205-90 = "這只是巧合。請相信我。"
1014205-91 = "[s5] 「……」\n[s6] 「要不要買一串給你？」"
1014205-94 = "……"
1014205-95 = "……沒關係。不用了。"
1014205-96 = "[s] 「感覺你心裡想的是另一回事啊！」"
1014205-97 = "唔，唔唔……"
1014205-98 = "……我知道了。畢竟拒絕老師的好意也不合禮節。"
1014205-99 = "就麻煩你買一串雞肉串吧。"
1014205-100 = "我要鹽烤的。"
1014205-101 = "正好天氣熱，我想吃點鹹的東西。"
1014205-102 = "[s] 「而且也流了不少汗嘛。」"
1014205-103 = ""
1014205-106 = "[ns] 「不好意思，請給我一串鹽烤雞肉串！」"
1014205-108 = "好的～！請稍等一下！"
1014205-111 = "（過了一會……）"
1014205-112 = ""
1014205-113 = "來！久等了～！"
1014205-114 = ""
1014205-116 = ""
1014205-117 = ""
1014205-118 = "那麼我來嚐嚐……"
1014205-119 = ""
1014205-121 = ""
1014205-122 = ""
1014205-123 = "[ns] 「怎，怎麼樣？」"
1014205-124 = "……太出色了。"
1014205-125 = "雞肉烤得恰到好處，與青蔥的爽脆口感形成了絕妙的搭配。"
1014205-126 = "肉汁保留得很好，鹽的調味和炭火的香氣也恰到好處。"
1014205-127 = "光是咬一口就能感受到如此豐富的滋味……"
1014205-128 = "這家店，今後也要常來光顧才行。"
1014205-129 = "[s] 「光聽你說就能感覺到有多好吃了呢。」"
1014205-130 = "老師也要吃一口看看嗎？"
1014205-131 = ""
1014205-133 = ""
1014205-134 = ""
1014205-135 = ""
1014205-136 = "……啊。"
1014205-137 = "這，這邊我沒咬過。#n我不是別有用意才這麼說的。"
1014205-138 = "[s] 「嗯。就當作是那樣吧～」"
1014205-139 = "老，老師……！"
1014205-141 = "（之後繼續和名草在商店街漫步，度過了愉快的時光）"
