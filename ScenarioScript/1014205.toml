[translation]
1014205-1 = "ของอร่อยที่อดใจไม่ไหว"
1014205-2 = "(คุณครูได้มาทะเลกับนางุสะอีกครั้ง...)"
1014205-6 = "(ทะเลวันนี้แดดร้อนจัด...)"
1014205-7 = ""
1014205-8 = "อะ... อืม..."
1014205-9 = "ขืนเป็นแบบนี้... ฉันต้องละลายแน่เลย"
1014205-10 = "[s] \"งั้นเราไปย่านการค้าแถวนี้กันมั้ย?\""
1014205-11 = "อื้อ ก็น่าจะดีนะ ที่นั่นจะมีร่มเงาให้หลบแดดด้วย"
1014205-12 = "แล้วก็น่าจะมีคนเห็นเราสองคนเยอะกว่าที่นี่ด้วย"
1014205-13 = "[s1] \"โอ้ว...\"\n[s2] \"นางุสะอยากให้คนอื่นเห็นพวกเรากันเยอะๆ สินะ\""
1014205-16 = "ฉันแค่อยากให้คนเลิกเข้าใจผิดเรื่องสาวหิมะก็เท่านั้น..."
1014205-17 = "ไม่ได้มีจุดประสงค์อื่นหรอก"
1014205-18 = "..."
1014205-19 = "ฉันพูดจริงนะ พูดจริงๆ"
1014205-20 = "เพราะงั้นก็หยุดมองฉันแล้วยิ้มแปลกๆ แบบนั้นได้แล้ว"
1014205-21 = "ถึงภายนอกฉันจะดูเย็นชาและไม่สนใจอะไร... แต่จริงๆ แล้วฉันเป็นสาวน้อยขี้อายนะ"
1014205-22 = "[ns] \"คะ... ครูผิดไปแล้ว นางุสะ...\""
1014205-24 = "(แล้วคุณครูกับนางุสะก็มาถึงย่านการค้าที่อยู่ใกล้ๆ...)"
1014205-27 = ""
1014205-28 = "มีร้านที่... น่าสนใจเยอะเลยนะ"
1014205-29 = "ทางโน้นมีสนามยิงปืนฉีดน้ำด้วย เหมือนจะแจกรางวัลตามคะแนนที่ทำได้เลยละ"
1014205-30 = "[s] \"ถ้านางุสะไปแข่ง ครูว่าต้องได้คะแนนสูงสุดแน่นอน\""
1014205-31 = "อาจจะเป็นอย่างนั้นก็ได้..."
1014205-32 = "แต่ถ้าให้คนอื่นลงแข่ง ฉันว่าน่าจะสนุกมากกว่านะ"
1014205-33 = ""
1014205-35 = ""
1014205-36 = ""
1014205-37 = "คุณครู อยากลองดูมั้ยล่ะ?"
1014205-38 = "ฉันจะคอยเป็นโค้ชให้ข้างๆ เอง"
1014205-39 = "[s] \"โอ้ว...! เอาสิ!\""
1014205-41 = "(หลังจากนั้นคุณครูก็เริ่มแข่งยิงปืนฉีดน้ำโดยมีนางุสะเป็นโค้ชอยู่ข้างๆ)"
1014205-42 = ""
1014205-47 = "(แต่ว่า... รางวัลเดียวที่ได้รับก็คือรางวัลปลอบใจที่เป็นลูกอม...)"
1014205-48 = ""
1014205-49 = "ฮุฮุ น่าเสียดายนะ ถ้าโชคเข้าข้าง ฉันว่าเราน่าจะได้รางวัลที่สูงกว่านั้นได้เลย"
1014205-50 = "[s] \"รางวัลที่สูงกว่านั้นคืออะไรนะ?\""
1014205-51 = "ไหนดูซิ..."
1014205-52 = "เขียนไว้ว่า... เป็นคูปองยากิโทริ 1 ใบ"
1014205-53 = "ส่วนรางวัลที่สูงกว่านั้นก็คือคูปองเซ็ตยากิโทริ..."
1014205-54 = "..."
1014205-55 = "คุณครู ไปหยิบปืนอีกรอบ คราวนี้ฉันจะออกคำสั่งให้เข้มกว่าเดิมอีก"
1014205-56 = "[s] \"โลภมากขึ้นมาเลยนะ!\""
1014205-57 = ""
1014205-59 = ""
1014205-60 = ""
1014205-61 = "ล้อเล่นน่า..."
1014205-62 = "ที่จริง... ฉันก็รู้ตัวอยู่เหมือนกันว่าพักหลังมานี้ฉันกินยากิโทริมากเกินไปหน่อย"
1014205-63 = "ฉันก็เลยพยายามหักห้ามใจตัวเองอยู่น่ะ"
1014205-64 = "[s] \"แล้วหักห้ามใจได้อาทิตย์ละกี่ไม้เหรอ?\""
1014205-65 = "ระ... เรื่องนั้น..."
1014205-66 = "เป็นความลับ..."
1014205-67 = "อะ... เอาเป็นว่าเราไปที่อื่นกันเถอะ ขืนอยู่ตรงนี้ต่อไป ฉันคงเผลอใจไปกับของล่อตา#nล่อใจพวกนั้นแน่"
1014205-68 = ""
1014205-70 = ""
1014205-71 = ""
