1014205-84 = ""
1014205-85 = "..."
1014205-86 = "[s3] \"ตั้งใจเดินให้มาเจอร้านหรือเปล่า?\"\n[s4] \"ไม่ได้ตั้งใจมาทางนี้หรอกใช่มั้ย?\""
1014205-89 = "เปล่านะ จริงๆ นะ"
1014205-90 = "แค่บังเอิญน่ะ เชื่อฉันเถอะ"
1014205-91 = "[s5] \"ครูซื้อให้มั้ย?\"\n[s6] \"ให้ครูซื้อให้มั้ย?\""
1014205-94 = "..."
1014205-95 = "ไม่ดีกว่า... ไม่เป็นไร"
1014205-96 = "[s] \"แต่ในใจน่าจะตอบอีกอย่างหนึ่งนะ!\""
1014205-97 = "อะ... อืม..."
1014205-98 = "ก็ได้... ถ้าปฏิเสธน้ำใจจากคุณครู มันก็จะเป็นการเสียมารยาท"
1014205-99 = "งั้นฉันขอยากิโทริ... ไม้หนึ่ง"
1014205-100 = "เอาแบบย่างเกลือนะ"
1014205-101 = "อากาศมันร้อน ฉันเลยอยากกินอะไรเค็มๆ น่ะ"
1014205-102 = "[s] \"แล้วเหงื่อก็ออกมากด้วยนี่เนอะ\""
1014205-103 = ""
