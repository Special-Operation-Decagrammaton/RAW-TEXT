[translation]
10032055-7 = "……잠시 정지."
10032055-9 = "일단 안전이 확보된 것 같으니 우선 주변을 둘러보겠다."
10032055-10 = "그렇지만 지금의 진행 속도는 너무 느리다. ……이대로라면 조만간 따라잡히겠군."
10032055-11 = "……너무 느려? 설마 내 탓이라는 거냐?"
10032055-12 = "그걸 말이라고 해? 그 부분을 어떻게 좀 해 보라고 네놈을 고용한 거잖나!"
10032055-13 = "……으음."
10032055-14 = "확실히, 그 말이 옳다. 당신이 날 고용한 건 내가 이런 상황의 전문가라 믿고 있기 때문이지."
10032055-15 = "그런 상황에서 일을 받은 내가 부정적인 말을 하면 불안하겠군. 내 불찰이다. 사과하지."
10032055-16 = "하마터면 신뢰를 잃을 뻔했어."
10032055-17 = "후……."
10032055-18 = "일단 지하 주차장으로 가자. 이미 이곳은 난장판이 됐으니, 부하들이 날 데리러 오고 있을 거다."
10032055-19 = "당연히 차들도 끌고 들어올 테니, 접선만 하면 안전하게 빠져나갈 수 있을 거야."
10032055-20 = "과연, 좋은 소식이군. 그대로 진행하겠다."
10032055-21 = "하지만 그래도 지금의 이동 속도는 개선해야 한다."
10032055-22 = "이걸 어떻게든 개선하지 않으면 지하 주차장까지도 가지 못하고 따라 잡힐 거니까."
10032055-23 = "아무래도 당신이 좀 더 빠르게 움직일 수 있으면 좋겠는데……."
10032055-28 = "이런, 예상보다도 훨씬 빨랐나."
10032055-29 = "……이렇게 된 이상 어쩔 수 없다. 다소 극단적이지만, 가장 확실하고 효율적인 수단을 쓰는 수밖에."
10032055-30 = "효율적인 수단? 그런 게 있었다고?"
10032055-31 = "그렇다. 부득이하게 당신의 협조를 구하도록 하지."
10032055-32 = "……??? 내 협조? 뭐, 문제야 없다만……."
10032055-33 = "……확실한 거겠지?"
10032055-34 = "아아. 물론이지. 나만 믿어라."
10032055-35 = "기동성도 확보하며 당신을 안전하게 이동시킬 수 있는 방법이다. 나머진 나에게 맡기도록."
10032055-40 = "……?"
10032055-41 = "……뭐, 뭐냐?"
10032055-42 = "지금 뭐 하는……."
10032055-43 = "…………."
10032055-49 = "쿠헉……!!!"
10032055-61 = "흠……."
10032055-67 = "후우……. 후우……."
10032055-68 = "……좋아."
10032055-72 = "……완벽하군."
