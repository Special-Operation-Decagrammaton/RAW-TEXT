[translation]
1013405-1 = "잃어버린 용사의 자격"
1013405-2 = "(평소와 분위기가 다른 아리스를 찾아서 복도로 나온 참이었다.)"
1013405-11 = "경고. 훈련 중에 예기치 못한 사고가 발생했습니다."
1013405-12 = "텐도 아리스는 훈련을 중단하고, 즉시 수송선 내부로 복귀해 주십시오."
1013405-13 = "(선내에는 아리스가 당한 '사고'에 대한 안내 방송이 흘러나왔다.)"
1013405-15 = "아, 선생님."
1013405-16 = "[s1] \"아리스, 괜찮아?\"\n[s2] \"다친 곳은 없어?!\""
1013405-19 = "아리스는 괜찮습니다."
1013405-20 = "사고가 일어난 것은, 아리스가 아니라 용사의 갑옷, 그러니까, 아비 에슈흐 쪽이니까요."
1013405-21 = "사실, 무슨 사고인지도 잘 모릅니다."
1013405-22 = "하지만 왜 일어났는지는 들었습니다."
1013405-23 = "'원래 모습과 너무 달라졌기 때문'이라고요. 불안정해져서, 조정이 필요하다고요."
1013405-27 = "아비 에슈흐는, 불쌍합니다."
1013405-28 = "[s3] \"불쌍하다고?\"\n[s4] \"하지만, 아비 에슈흐는……. \""
1013405-31 = "네, 알고 있습니다."
1013405-32 = "아비 에슈흐는 처음부터 싸우기 위해 만들어진, 전투만을 위해 만들어진 병기라고요."
1013405-33 = "거기에 슬프거나, 기쁘거나 하는 감정은 없다고요."
1013405-34 = "아리스, 모두에게 들었습니다."
1013405-35 = "처음 만났을 때, 아비 에슈흐는 정말로 무시무시하게 강했다고요."
1013405-36 = "너무 크고 강해서, 어떻게 이겨야 할지도 모르겠는, 그야말로 치트 같은 갑옷이었다고요."
1013405-37 = "그렇지만 그 뒤로 싸우고, 부서지고를 반복해서……."
1013405-38 = "끝내는 아리스에게 딱 맞을 만큼 작아지고 말았습니다."
1013405-39 = "……어쩌면, 이번이 마지막일지도 모른다고 했습니다."
1013405-40 = "또다시 파괴되면, 더는 고칠 수 없다고요."
1013405-41 = "그런데도, 아비 에슈흐는 다음 싸움을 위해 개조되고 있습니다."
1013405-42 = "마지막까지 싸우고 파괴될 운명이라니요."
1013405-43 = "아리스는, 아리스는 그런 거 별로라고 생각합니다……."
1013405-44 = "아비 에슈흐도 함께 게임개발부 부실에 가고 싶습니다. 엔지니어부의 모두에게도 보여주고 싶습니다."
1013405-45 = "좀 더 다양한 사람과 만나, 좀 더 여러 장소에 함께하고 싶습니다."
1013405-46 = "아비 에슈흐도, 빛의 검처럼 사랑받았으면 좋겠습니다."
1013405-50 = "알려주세요, 선생님."
1013405-51 = "아비 에슈흐와, 빛의 검은, 어디에서 그렇게 달라지고 만 걸까요?"
1013405-52 = "그런 목적으로 만들어졌기 때문인가요?"
1013405-53 = "[ruby=태어날 때]만들어졌을 때[/ruby]부터 정해진 운명이라니……."
1013405-54 = "아리스는…… 그런 건, 옳지 않다고 배웠습니다……."
1013405-55 = "정하는 것은, 자기 자신이라고요."
1013405-56 = "하지만…… 아비 에슈흐는…… 아무것도 스스로 정할 수 없었습니다."
1013405-57 = "그래서, 아리스는…… 아리스는……."
1013405-62 = "선생님?"
1013405-65 = "[ns] 아리스를 안아준다."
1013405-68 = "[ns5] \"지금 그 마음을 잃지 말아 줘.\"\n[ns6] \"아비 에슈흐에게도 그거면 충분할 거야.\""
1013405-71 = "……이상합니다."
1013405-72 = "분명, 선생님에게 안기면 언제나 행복한 기분이 들었는데."
1013405-73 = "어째선지, 지금은, 자꾸 눈물이 나옵니다."
1013405-74 = "왠지 잘 모르겠습니다."
1013405-75 = "[s7] \"괜찮아. 아리스에게는 시간이 많으니까.\"\n[s8] \"분명 이해하는 날이 올 거야.\""
1013405-78 = "……선생님은 신기합니다."
1013405-79 = "지금 아리스는, 선생님의 말이 하나도 이해되지 않습니다."
1013405-80 = "하지만 선생님이 그렇다고 말해주니까, 언젠가 꼭 그렇게 될 거라는 기분이 듭니다."
1013405-81 = "역시, 선생님은 신기합니다."
1013405-83 = "(……한동안 아리스를 끌어안아 주었다.)"
1013405-84 = "(아비 에슈흐의 정비가 끝난 후에, 아리스는 다시 훈련하기 위해 돌아갔다.)"
