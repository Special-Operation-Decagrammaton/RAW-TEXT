[translation]
800-1 = "아오이의 등장"
800-4 = "기다리고 있었어, 선생님."
800-5 = "[s] \"…………….\""
800-6 = "……선생님? 무슨 문제라도 있어?"
800-7 = "[s1] \"누구세요?\"\n[s2] \"총학생회 재무실의 아오이……?\""
800-8 = "누구냐니, 총학생회 재무실장 오키 아오이야. 설마 잊어버린 거야?"
800-9 = "[s3] \"기억날 것 같기도 하고 아닌 것 같기도 하고…….\""
800-10 = "……하아. 그래. 선생님이 그런 반응을 해도 나는 할 말이 없겠지. 내 입장도 잘 알고 있어."
800-11 = "……그래. 뭐, 나도 이렇게 뻔뻔하게 얼굴을 비출 생각은 없었지만 말야."
800-12 = "하지만 공은 공이고 사는 사니까. 이번에는 어쩔 수 없이 이런 나와 같이 일을 처리해야만 해."
800-13 = "[s] \"이번에는……?\""
800-17 = "처리해야 할 다양한 일들, 사건들, 서류들…… 뭐 그런 것들이지."
800-18 = "원래 같으면 린 선배…… 아니, 수석행정관이 떠안아야 할 잡무지만, 그녀는 언제나 바쁘니까."
800-19 = "수석행정관에게 일을 넘겨봤자, 그녀는 미련하게 자신이 다 떠안으려고 할 테고…… 그런 그녀를 말리는 것도 불가능하다면, 이런 방법밖엔 없겠지."
800-20 = "그러니까 내가 도와주기로 한 거야."
800-21 = "[s] \"나와 함께 말이지?\""
800-22 = "물론 선생님과 함께."
800-23 = "[s] \"뭐 그런 거라면 어쩔 수 없겠네. 힘닿는 데까지 도울게.\""
800-24 = "……고마워. 선생님."
800-25 = "아, 그리고 한 가지 더."
800-31 = "나와 선생님이 수석행정관의 일을 도왔다는 건 비밀로 해두었으면 해."
800-32 = "이건 원래같으면 재무실에서 나설 일이 아니거든. 그러니까…… 린 선배에겐……."
800-33 = "[s] \"알겠어.\""
800-34 = "좋아. 그럼 시간 낭비할 것 없이 바로 시작해 보자고."
