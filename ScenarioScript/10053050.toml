[translation]
10053050-1 = "ตอนที่ 5;เงาแห่งลางร้ายที่คืบคลานเข้ามายังบ้านพัก"
10053050-6 = "กลับมาแล้วค่ะ..."
10053050-11 = "ฉันขยับตัวอีกไม่ไหวแล้ว..."
10053050-12 = "ฉันก็ด้วย..."
10053050-13 = "[ns1] \"ทุกคนน่าจะเหนื่อยกัน พักผ่อนกันเถอะนะ\"\n[ns2] \"ครูจะเตรียมอาหารเย็นให้เอง...\""
10053050-18 = "[ns3] \"ระ... ร่างกายขยับไม่ได้เลย...?\"\n[ns4] \"หรือว่าเวลาหยุดเดินกะทันหัน...?!\""
10053050-24 = "น่าจะเป็นแค่อาการปวดกล้ามเนื้อค่ะ"
10053050-25 = "ทุกคนดูเหนื่อยกันหมดเลย งั้นฉันจะเตรียมอาหารเย็นให้เองค่ะ "
10053050-26 = "อ่า... ขะ... ขอบใจนะ"
10053050-27 = "แต่ไม่ว่าฉันจะทำอะไรให้ ก็ห้ามบ่นว่ากินไม่ได้นะ?"
10053050-28 = "ทำอาหารเป็นใช่มั้ย...?!"
10053050-29 = "ทำอาหารมันจะไปยากอะไร ก็แค่ปิ้งๆ ต้มๆ ก็พอแล้วไม่ใช่เหรอ? ง่ายๆ น่า~"
10053050-33 = "นั่นไม่ใช่คำตอบที่ฟังแล้วสบายใจเลยนะ?! เดี๋ยวก่อนสิ!"
10053050-34 = "หรือควรรีบตามไปตอนนี้ดีนะ... รู้สึกไม่สบายใจเลย..."
10053050-35 = "เอ่อ? สึบาสะ?"
10053050-40 = "..."
10053050-44 = "หลับไปแล้วเหรอ...?"
10053050-45 = "แต่ก็นะ... วันนี้ใช้ร่างกายเยอะเลยนี่นา..."
10053050-46 = "จะเหนื่อยก็ไม่แปลกหรอก... ฮ้าวว..."
10053050-47 = "ฉันก็ง่วงเหมือนกันนะเนี่ย..."
10053050-48 = "..."
10053050-53 = "(ตึง!)"
10053050-57 = "ตะ... ตกใจหมดเลย...?!"
10053050-58 = "ฉันเองก็เผลอหลับไปสินะเนี่ย..."
10053050-59 = "..."
10053050-60 = "โคโนกะ? โคโนกะใช่มั้ย?"
10053050-61 = "..."
10053050-63 = "[ns5] \"มีเรื่องอะไรเหรอ โคโนกะ?\"\n[ns6] \"ให้ครูช่วยอะไรมั้ย?\""
10053050-66 = "ยะ... อย่าแกล้งกันอยู่สิ! รีบเข้ามาได้แล้ว!"
10053050-67 = "..."
10053050-68 = "ฉันรู้หรอกน่า! เล่นอะไรไร้สาระเป็นเด็กๆ ไปได้ ทำเหมือนพวกรุ่นพี่ของฉันไม่มีผิด..."
10053050-70 = "..."
10053050-71 = "คะ... คุณครู...?"
10053050-72 = "[s7] \"อื้อ ให้ครูจัดการเอง\"\n[s8] \"ครูจะไปดูให้เอง\""
10053050-75 = "มะ... ไม่ดีกว่า ฉันไปด้วย"
10053050-76 = "ฉันรู้สึกไม่ค่อยดีเลย คุณครูมาอยู่ข้างหลังฉันนะ"
10053050-80 = "ฝั่งตรงข้ามประตูบานนี้ มีใครบางคน..."
10053050-86 = "..."
10053050-92 = "พี่สาวกลับมาแล้ว!!!"
10053050-93 = "?!?!!@#!@#@#"
10053050-102 = "หืม? อะไรน่ะ ตีทำไม? ตีฉันทำไมเนี่ย?"
10053050-103 = "ยัยบื้อเอ๊ย! ทำไมถึงมาแกล้งอะไรกันแปลกๆ แบบนี้! ฉันกลัวจริงๆ นะ!"
10053050-104 = "คุณครู ทำไมเรนะเป็นแบบนี้ล่ะคะ?"
10053050-105 = "[s9] \"คนที่อยู่หน้าประตูเมื่อกี้ไม่ใช่โคโนกะเหรอ...?\"\n[s10] \"โคโนกะไม่ได้อยู่หน้าประตูเมื่อกี้หรอกเหรอ?\""
10053050-108 = "เอ๋? พูดเรื่องอะไรคะ? ฉันเพิ่งมาถึงเอง..."
10053050-109 = "อ่า ถ้างั้นฉันก็ไม่ได้ตาฝาดไปสินะ"
10053050-110 = "หืม?! พูดแบบนั้นหมายความว่ายังไง?"
10053050-111 = "ก็ระหว่างเดินถือซุปมา ฉันเห็นใครบางคนออกมาจากบ้านพักน่ะสิ"
10053050-112 = "แต่ทุกคนก็อยู่ข้างในกันหมด ฉันก็เลยคิดว่าตัวเองคงตาฝาดไป"
10053050-113 = "ถะ... ถ้างั้นก็มีอยู่จริงๆ เหรอ? ใครคนอื่นที่ไม่ใช่พวกเราน่ะ?"
10053050-114 = "ในเมื่อไม่ได้มีแค่ฉันคนเดียวที่รู้สึกอย่างนั้น งั้นก็น่าจะเป็นอย่างนั้นนะ?"
10053050-115 = "แต่เรารีบไปกินข้าวกันเถอะ แล้วก็ปลุกหัวหน้าด้วย"
10053050-116 = "ตอนนี้น่าจะมีอย่างอื่นที่สำคัญกว่าอาหารนะ?!"
10053050-117 = "ไม่เอาน่า จะไปมีอะไรสำคัญไปกว่าอาหารอีกล่ะ คนเราต้องกินเพื่ออยู่นะ หัวหน้า ตื่นได้แล้ว~"
10053050-119 = "(แล้วทุกคนก็เริ่มกินมื้อเย็นในบรรยากาศที่อึดอัดใจ)"
10053050-120 = "(ที่น่าประหลาดใจคืออาหารของโคโนกะนั้นอร่อยใช้ได้ทีเดียว... ถึงเมนูจะล้าสมัยไปหน่อยก็ตาม)"
10053050-123 = "อย่างนี้สินะ... เกิดเรื่องแบบนั้นระหว่างที่ฉันหลับไปนี่เอง"
10053050-124 = "ฉันขอถามเผื่อๆ นะ..."
10053050-125 = "มีใครในหมู่พวกเราที่ไปก่อเรื่องให้ใครเคียดแค้นไว้บ้างหรือเปล่า?"
10053050-126 = "จะไปมีได้ยังไงกันล่ะ!!!"
10053050-128 = "อ่า แต่ฉันมีนะ~?"
10053050-130 = "หืม?!"
10053050-132 = "พอมาคิดดูแล้ว... ก่อนหน้านี้เห็นมีคนมาบอกว่าจะมาแก้แค้น น่าจะสองสัปดาห์ได้แล้วละ..."
10053050-133 = "งั้นตอนนี้ก็น่าจะมีสักคนสองคนที่ออกมาแก้แค้นแล้วนะ"
10053050-134 = "ล้อเล่นใช่มั้ย?"
10053050-135 = "เปล่านะ? ฉันพูดเรื่องจริง"
10053050-136 = "ฉันก็ทำงานเหมือนกันนะ ไม่ได้นั่งกินนอนกินในกรมความมั่นคงสาธารณะไปวันๆ หรอก~"
10053050-137 = "อ่า~ แต่ก็ไม่น่าจะใช่ฉันนะ เพราะคนที่รู้ว่าฉันอยู่ที่นี่ ก็มีแค่คุณพี่คนเดียว"
10053050-138 = "ไม่หรอก... อาจจะไม่เป็นอย่างนั้นก็ได้"
10053050-139 = "เอ๋?"
10053050-140 = "ถ้ามีใครแอบติดตามโคโนกะมาด้วยเจตนาไม่ดี ก็น่าจะใช้จังหวะตอนที่อยู่คนเดียวในสถานที่ที่ไม่คุ้น#nเคยมากกว่าไม่ใช่เหรอ?"
10053050-141 = "และถ้าสมมติฐานนี้เป็นจริง ฝ่ายตรงข้ามก็ต้องมีความอดทนและความมุ่งมั่นอย่างมาก... และเหนือสิ่งอื่นใดก็ต้องมีความแค้นฝังลึกด้วย"
10053050-142 = "ไม่หรอกน่า ถึงอย่างนั้นฉันก็ไม่ได้ไปทำอะไรให้ใครโกรธแค้นขนาดนั้น~"
10053050-146 = "แต่อาจจะมีบ้างก็ได้นะ...?"
10053050-147 = "ไปทำเรื่องแบบนั้นไว้เหรอ?!"
10053050-148 = "ก็~ อย่างว่าละ~ พอทำงานสาธารณะมากๆ เข้า~ ก็ย่อมมีคนได้รับบาดเจ็บบ้างเป็นธรรมดา~"
10053050-149 = "วัลคิรี่ก็ทำแบบนี้ได้เหรอ?! คิโวทอสเป็นที่ที่ปลอดภัยจริงๆ มั้ยเนี่ย?!"
10053050-150 = "ปลอดภัยสิ ฉันทำเพื่อป้องกันตัวน่ะ มันเป็นการป้องกันตัว"
10053050-155 = "────เจ็ดอาชญากร"
10053050-162 = "ฉันเคยได้ยินข่าวลือมานะ อาชญากรตัวฉกาจเจ็ดคนที่ทำตัวไม่ดีจนโรงเรียนเก่ายังถอดใจที่จะดัดนิสัย แล้วกองกำลังพิเศษขององค์การนักเรียนก็เข้าจับกุมแล้วส่งตัวไปที่สำนักควบคุม แล้วสักพักก็แหกคุกออกไปได้"
10053050-163 = "ถ้าเป้าหมายของคนพวกนั้นไม่ใช่โคโนกะ แต่เป็นกรมความมั่นคงสาธารณะ... หรือก็คือสถาบันฝึกตำรวจวัลคิรี่ล่ะ?"
10053050-164 = "บางทีพวกเราอาจกำลังตกอยู่ในวิกฤตครั้งใหญ่ที่ไม่เคยมีมาก่อนก็ได้...!"
10053050-169 = "ด่วนสรุปไปหรือเปล่า...?"
10053050-174 = "อืม~ มันก็อาจจะเป็นไปได้นะ"
10053050-175 = "จริงเหรอ...?"
10053050-176 = "นักโทษเจ้าแผนการ กัดไม่ปล่อย และจงเกลียดจงชังวัลคิรี่อย่างน่าประหลาด"
10053050-177 = "เพิ่งแวบเข้ามาในหัวฉันน่ะ"
10053050-178 = "..."
10053050-179 = "..."
10053050-181 = "อ่า~ โล่งอกไปทีนะ~"
10053050-182 = "หืม?"
10053050-183 = "ก็ฉันคิดว่าเป็นวิญญาณที่โผล่ออกมาน่ะสิ"
10053050-184 = "ถ้าเป็นนักโทษพวกนั้น มันก็ง่ายๆ น่ะ แค่จับตัวให้ได้แล้วส่งเข้าคุกอีกครั้งก็จบ!"
10053050-185 = "อ๊ะ ขอถอนคำพูดที่บอกว่าคุก ฉันหมายถึงสำนักควบคุมน่ะ"
10053050-186 = "พูดง่ายเกินไปหรือเปล่า...?"
10053050-187 = "ฉันก็พอได้ยินเรื่องของเจ็ดอาชญากรมาบ้างนะ"
10053050-188 = "โอ้ จริงเหรอ? เคยได้ยินเรื่องเจ็ดอาชญากร แต่ไม่เคยได้ยินเกี่ยวกับกรมความมั่นคงสาธารณะงั้นเหรอ?"
10053050-189 = "อ๊ะ ขอโทษนะ ฉันไม่ได้หมายความแบบนั้น..."
10053050-190 = "อะไรกัน มาขอโทษกันอีกแล้ว! ฉันล้อเล่นหรอกน่า ล้อเล่น!"
10053050-194 = "เอาเถอะ ยังไงพี่สาวคนนี้ก็รับประกันให้ได้! ต่อให้จะบุกเข้ามากี่คน ฉันก็จะปกป้องทุกคนเอง ไม่ต้องกังวลให้มากหรอก!"
10053050-195 = "เท่านี้ก็คลี่คลายเรื่องนี้ได้แล้ว! โธ่~ กลัวไปเองซะงั้น~"
10053050-196 = "..."
10053050-200 = "..."
