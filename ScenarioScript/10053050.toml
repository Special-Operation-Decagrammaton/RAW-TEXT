[translation]
10053050-1 = "제5화;산장에 다가오는 불길한 그림자"
10053050-6 = "다녀왔습니다……."
10053050-11 = "더는 못 움직이겠어……."
10053050-12 = "나도……."
10053050-13 = "[ns1] \"다들 지쳤을 테니까 쉬고 있어.\"\n[ns2] \"저녁 준비는 선생님이…….\""
10053050-18 = "[ns3] \"모, 몸이 움직이지 않는다……?\"\n[ns4] \"설마, 시간이 멈춘 건가……?!\""
10053050-24 = "그냥 근육통으로 보이는뎁쇼."
10053050-25 = "다들 피곤해 보이니까, 저녁 준비는 제가 알아서 하겠슴다."
10053050-26 = "아, 고, 고마워."
10053050-27 = "대신 뭐가 나오든 못 먹겠다고 투정하기 없다?"
10053050-28 = "……요리할 줄 아는 건 맞지?!"
10053050-29 = "요리 까짓거 굽고 끓이면 되는 거 아니야? 쉽다, 쉬워~"
10053050-33 = "전혀 안심이 안 되는 대답인데?! 잠깐만!"
10053050-34 = "지금이라도 쫓아가 봐야 하나…… 엄청 불안한데……."
10053050-35 = "저기? 츠바사?"
10053050-40 = "……."
10053050-44 = "……그사이에 잠든 거야?"
10053050-45 = "하긴…… 오늘은 몸을 많이 움직였으니까……."
10053050-46 = "피곤할 만도…… 하암……."
10053050-47 = "나도 졸립네……."
10053050-48 = "……."
10053050-53 = "(덜컹!)"
10053050-57 = "……?! 까, 깜짝이야."
10053050-58 = "나도 모르게 잠들었구나……."
10053050-59 = "……."
10053050-60 = "코노카? 코노카지?"
10053050-61 = "……."
10053050-63 = "[ns5] \"무슨 일이야, 코노카?\"\n[ns6] \"혹시 도와줄까?\""
10053050-66 = "자, 장난치지 말고! 빨리 들어와!"
10053050-67 = "……."
10053050-68 = "다 알아! 유치하게 왜 그래? 꼭 우리 선배들이나 할 법한 짓을 하고……."
10053050-70 = "……."
10053050-71 = "서, 선생님……?"
10053050-72 = "[s7] \"응, 선생님한테 맡겨.\"\n[s8] \"확인해 보고 올게.\""
10053050-75 = "아, 아니야. 나도 같이 갈게."
10053050-76 = "뭔가 느낌이 안 좋아. 선생님은 내 뒤에 있어."
10053050-80 = "……이 문 건너편에, 누군가가……."
10053050-86 = "…………."
10053050-92 = "누님 오셨다!!!"
10053050-93 = "?!?!!@#!@#@#"
10053050-102 = "응? 뭐야, 왜 때려? 왜 때려?"
10053050-103 = "바보야! 왜 이상한 장난치고 그래! 진짜 무서웠단 말이야!"
10053050-104 = "……??? 선생님, 얘 왜 이럼까?"
10053050-105 = "[s9] \"……? 조금 전까지 문 앞에 있던 거.\"\n[s10] \"코노카 아니었어?\""
10053050-108 = "엥? 또 무슨 소림까? 저는 방금 막……."
10053050-109 = "아. 그럼, 내가 잘못 본 게 아니었네."
10053050-110 = "어?! 그건, 무슨 뜻이야?"
10053050-111 = "아니, 국 들고 오는데, 산장 쪽에서 누가 나오는 걸 봤단 말이지?"
10053050-112 = "그런데 다들 안에 있길래 잘못 봤나 싶었지."
10053050-113 = "그, 그러면, 진짜로 있는 거야? 우리 말고 누군가가?"
10053050-114 = "뭐, 나 말고도 느꼈다고 하니까, 그렇지 않을까?"
10053050-115 = "그보다 빨리 밥이나 먹자. 소장도 깨우고."
10053050-116 = "지금 밥보다 더 중요한 게 있지 않을까?!"
10053050-117 = "에이, 밥보다 중요한 게 어딨어. 다 먹고 살자고 하는 건데. 소장, 일어나~"
10053050-119 = "(그렇게 어색한 분위기 속에서 저녁 식사가 시작되었다.)"
10053050-120 = "(……뜻밖에도 코노카의 요리는 꽤 맛있었다. 메뉴는 좀 아저씨 같았지만.)"
10053050-123 = "과연…… 내가 잠들어 있던 동안, 그런 일이 있었구나."
10053050-124 = "……혹시나 물어보는데."
10053050-125 = "이 중에 누구 원한 살 만한 짓을 한 사람이 있어?"
10053050-126 = "있겠냐고!!!"
10053050-128 = "어, 나 있는데~?"
10053050-130 = "응?!"
10053050-132 = "어디 보자…… 전에 복수한답시고 찾아왔던 놈이 2주쯤 됐으니까……."
10053050-133 = "슬슬 한두 명 더 찾아올 때긴 한데."
10053050-134 = "농담이지?"
10053050-135 = "아니? 진짠데?"
10053050-136 = "나도 공안국에서 꽁으로 놀고먹는 건 아니라~"
10053050-137 = "……아~ 근데 나는 아니겠다. 내가 여깄는 줄 아는 건, 누님뿐이고."
10053050-138 = "……아니, 그렇지 않을 가능성도 있어."
10053050-139 = "엥?"
10053050-140 = "만약 누군가 악의를 품고 코노카 군을 미행하고 있었다면, 오히려 홀로 외지에 나오는 이때를 기다리고 있지 않았을까?"
10053050-141 = "물론 이 가설이 성립하기 위해서는, 그 상대에게 상당한 인내심과 집념, ……그리고 무엇보다 깊은 원한이 필요하겠지."
10053050-142 = "아니, 아무리 그래도 나 그 정도로 원한 살 만한 짓은~"
10053050-146 = "……쫌 했을지도?"
10053050-147 = "했어?!"
10053050-148 = "아니~ 뭐~ 공무 집행이란 게 하다 보면~ 어쩌다 다치는 사람도 좀 나오고 그러는 거지~"
10053050-149 = "발키리가 그래도 돼?! 키보토스 진짜 괜찮은 거야?!"
10053050-150 = "괜찮아. 정당방위야, 정당방위."
10053050-155 = "────일곱 죄수."
10053050-162 = "소문은 들어본 적 있어. 출신 모교에서 선도를 포기해, 총학생회의 특수 부대가 체포, 그 후 교정국으로 이송되었다가 탈옥했다는 일곱 명의 흉악범."
10053050-163 = "만약 그들이 코노카 군이 아니라 공안국…… 즉, 발키리 경찰학원을 타겟으로 하고 있다면?"
10053050-164 = "어쩌면 우리는 미증유의 위기에 처한 걸지도 몰라……!"
10053050-169 = "너무 비약하는 거 아닐까……?"
10053050-174 = "으음~ 어쩌면, 가능성 있을지도."
10053050-175 = "진짜……?"
10053050-176 = "용의주도하고, 끈질기고, 이상할 정도로 발키리를 증오하던 죄수."
10053050-177 = "짠- 하고 떠올라 버려서."
10053050-178 = "…………."
10053050-179 = "…………."
10053050-181 = "아~ 다행이다~"
10053050-182 = "어?"
10053050-183 = "아니, 난 또, 뭔 귀신 나타났다는 줄."
10053050-184 = "탈옥수면 간단하지. 그냥 다시 잡아서 깜빵에 넣으면 되는 거잖아!"
10053050-185 = "……아, 깜빵이란 말은 취소. 교정국."
10053050-186 = "너무 쉽게 말하는 거 아니야……?"
10053050-187 = "그 일곱 죄수라면 나도 들어봤을 정도인데."
10053050-188 = "어쭈, 그러셔? 일곱 죄수는 들어보셨는데, 공안국은 못 들어보셨다?"
10053050-189 = "앗. 미안, 그런 뜻은……."
10053050-190 = "에이, 또 뭘 사과하고 그래! 농담이야, 농담!"
10053050-194 = "어쨌거나, 이 누님이 보장한다! 몇 놈이 덤비든 지켜줄 테니까, 너무 걱정 말고!"
10053050-195 = "이걸로 문제 해결! 아~ 괜히 쫄았네~"
10053050-196 = "……."
10053050-200 = "……."
