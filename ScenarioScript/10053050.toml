[translation]
10053050-1 = "第5話;逼近山莊的不祥身影"
10053050-6 = "我回來了……"
10053050-11 = "再也動不了了……"
10053050-12 = "我也是……"
10053050-13 = "[ns1] 「大家應該都累了，先休息一下吧。」\n[ns2] 「晚餐就交給我來準備……」"
10053050-18 = "[ns3] 「身，身體動不了……？」\n[ns4] 「難道是時間停止了嗎……！？」"
10053050-24 = "那應該只是肌肉痠痛吧。"
10053050-25 = "既然大家都累成這樣，晚餐就由我來準備吧。"
10053050-26 = "謝，謝謝。"
10053050-27 = "不過先說好，待會不管端出什麼都不準抱怨哦？"
10053050-28 = "……你確定會做菜嗎？"
10053050-29 = "不就是把東西烤一烤煮一煮嗎？#n這點小事輕輕鬆鬆啦～"
10053050-33 = "你的回答一點也不讓人放心耶！？先等一下！"
10053050-34 = "是不是應該追過去看看啊……感覺超級不安的……"
10053050-35 = "那個，翼？"
10053050-40 = "……"
10053050-44 = "……已經睡著了？"
10053050-45 = "這也難怪……畢竟今天一直在運動……"
10053050-46 = "會累也是很正常的……哈啊……"
10053050-47 = "我也好睏……"
10053050-48 = "……"
10053050-53 = "（咔噹！）"
10053050-57 = "……！？#n嚇，嚇我一跳。"
10053050-58 = "不知不覺就睡著了……"
10053050-59 = "……"
10053050-60 = "木乃香？是木乃香對吧？"
10053050-61 = "……"
10053050-63 = "[ns5] 「怎麼了，木乃香？」\n[ns6] 「需要幫忙嗎？」"
10053050-66 = "別，別開玩笑了！快點進來！"
10053050-67 = "……"
10053050-68 = "我都已經發現了啦！#n怎麼還在做這種幼稚的惡作劇啊？簡直就跟我的前輩們一樣……"
10053050-70 = "……"
10053050-71 = "老，老師……？"
10053050-72 = "[s7] 「嗯，交給老師我吧。」\n[s8] 「我去確認一下。」"
10053050-75 = "不，不對。我也一起去。"
10053050-76 = "感覺不太對勁……老師就待在我後面吧。"
10053050-80 = "有某個人……就在這扇門的另一邊……"
10053050-86 = "…………"
10053050-92 = "姐姐我回來囉！！！"
10053050-93 = "！？！？＠＃！＠＃！"
10053050-102 = "怎麼了？為什麼打我？為什麼要打我！？"
10053050-103 = "笨蛋！為什麼要做這種奇怪的惡作劇啦！#n我真的差點就要被你嚇死了耶！"
10053050-104 = "……？？？老師，他怎麼了？"
10053050-105 = "[s9]「 剛才在門前的……」\n[s10] 「不是木乃香嗎？」"
10053050-108 = "咦？這又是什麼意思？#n我明明才剛回……"
10053050-109 = "啊～所以果然不是我看錯了啊。"
10053050-110 = "咦！？什，什麼意思？"
10053050-111 = "沒有啦～就是我剛才端著湯過來的時候，看見有人從山莊裡面走出去而已。"
10053050-112 = "可是大家明明都在裡面，我才以為是我自己看錯了。"
10053050-113 = "所，所以是真的有人在嗎！？除了我們幾個之外！？"
10053050-114 = "既然不是只有我一個人感覺到，應該就是這樣沒錯吧？"
10053050-115 = "比起這個先吃飯吧，把所長也叫起來。"
10053050-116 = "現在應該有比吃飯更重要的事吧！？"
10053050-117 = "哎～哪有什麼事情是比吃飯更重要的，大家不都是為了吃飯而活著的嗎？#n所長，快起來吧～"
10053050-119 = "（就這麼在尷尬的氣氛中吃起了晚餐）"
10053050-120 = "（出乎意料的是，木乃香的料理相當好吃……雖然菜色莫名有股大叔的氣息就是了）"
10053050-123 = "原來如此……在我睡著的時候發生了那種事啊。"
10053050-124 = "……我姑且確認一下。"
10053050-125 = "在場有人曾經跟其他人結怨的嗎？"
10053050-126 = "怎麼可能會有！！！"
10053050-128 = "啊，我有耶～？"
10053050-130 = "咦！？"
10053050-132 = "我想想……上次有人跑來報仇大概是2週前的事……"
10053050-133 = "差不多也該再有一兩個人找上門來了吧～？"
10053050-134 = "這是在開玩笑吧？"
10053050-135 = "沒有啊？我是說認真的。"
10053050-136 = "畢竟我在公安局也不是白吃白喝的嘛～"
10053050-137 = "啊～不過我想應該不是衝著我來的才對。#n因為知道我在這裡的，就只有大姐頭一個人而已。"
10053050-138 = "……不，這恐怕很難說。"
10053050-139 = "咦……？"
10053050-140 = "假如有人一直帶著惡意跟蹤著木乃香君……#n不就會看準你獨自來到偏遠地帶的時機下手嗎？"
10053050-141 = "當然這個假設要成立的話，除了相當程度的耐心與執念之外……#n最重要的是，對方必須對你帶有非常深的怨恨。"
10053050-142 = "再怎麼說，我應該也沒做過會讓人恨成那樣的事情啦～"
10053050-146 = "……頂多也就一點點吧？"
10053050-147 = "竟然有嗎！？"
10053050-148 = "哎呀～執行公務的過程中，難免會有幾個人受傷嘛～"
10053050-149 = "女武神可以這樣嗎！？#n奇普托斯真的沒問題嗎！？"
10053050-150 = "放心放心～那都是正當防衛啦，正當防衛。"
10053050-155 = "────七罪人。"
10053050-162 = "我曾經聽說過有關他們的傳聞。據說他們是被母校放棄管教……#n雖然一度遭到聯邦學生會特殊部隊的逮捕，後來卻成功從矯正局越獄的七名重刑犯。"
10053050-163 = "如果他們的目標並非木乃香君而是公安局……也就是女武神警察學園呢？"
10053050-164 = "或許現在的我們，正面臨著前所未有的危機也說不定……！"
10053050-169 = "會不會是我們想太多了……？"
10053050-174 = "唔嗯……搞不好有可能哦。"
10053050-175 = "真的假的……？"
10053050-176 = "行事周到又糾纏不休，並且異常憎恨著女武神的囚犯……"
10053050-177 = "確實可以想到是誰呢。"
10053050-178 = "…………"
10053050-179 = "…………"
10053050-181 = "啊～太好了～"
10053050-182 = "咦？"
10053050-183 = "沒有啦，我本來還以為是有鬼怪出現了呢。"
10053050-184 = "如果是越獄犯的話就簡單多了，只要把他們抓回監獄裡就行了嘛！"
10053050-185 = "……啊，我收回「監獄」這個說法，應該是矯正局才對。"
10053050-186 = "說得也太輕鬆了吧……？"
10053050-187 = "七罪人的名號，就連我都聽說過耶。"
10053050-188 = "哦？是嗎？明明聽過七罪人，卻不知道我是公安局的人啊？"
10053050-189 = "啊，抱歉。我不是那個意思……"
10053050-190 = "哎呀，道什麼歉啦！剛才只是開開玩笑而已！"
10053050-194 = "總之你們別擔心！姐姐我保證，不管來了多少人都會保護你們的！"
10053050-195 = "這樣問題就解決了！#n啊～害我白擔心了呢～"
10053050-196 = "……"
10053050-200 = "……"
