[translation]
10053050-1 = "第5話;逼近山莊的不祥身影"
10053050-6 = "我回來了……"
10053050-11 = "再也動不了了……"
10053050-12 = "我也是……"
10053050-13 = "[ns1] 「大家都累了，休息一下吧。」\n[ns2] 「晚餐我來準備……」"
10053050-18 = "[ns3] 「身，身體動不了……？」\n[ns4] 「難道是時間停止了嗎……！？」"
10053050-24 = "只是肌肉痠痛吧。"
10053050-25 = "大家看起來都很累，晚餐就我來準備吧。"
10053050-26 = "謝，謝謝。"
10053050-27 = "不過不管端出什麼都不能說吃不下喔？"
10053050-28 = "……你確定會做菜嗎？"
10053050-29 = "做菜這種事烤一烤煮一煮就好了不是嗎？簡單，簡單～"
10053050-33 = "回答的完全不讓人放心啊！？ 等一下！"
10053050-34 = "要追上去嗎……超級不安的……"
10053050-35 = "那個，翼？"
10053050-40 = "……"
10053050-44 = "睡著了……"
10053050-45 = "也是……今天一直在運動……"
10053050-46 = "是我也會累……哈啊……"
10053050-47 = "我也好睏……"
10053050-48 = "……"
10053050-53 = "（咔噹！）"
10053050-57 = "……！？#n嚇，嚇死我了。"
10053050-58 = "不知不覺睡著了……"
10053050-59 = "……"
10053050-60 = "木乃香？是木乃香對吧？"
10053050-61 = "……"
10053050-63 = "[ns5] 「怎麼了，木乃香？」\n[ns6] 「需要幫忙嗎？」"
10053050-66 = "別，別開玩笑了！快進來！"
10053050-67 = "……"
10053050-68 = "我已經知道了！怎麼這麼幼稚？做這種我前輩才會做的事……"
10053050-70 = "……"
10053050-71 = "老，老師……"
10053050-72 = "[s7] 「嗯，交給我吧。」\n[s8] 「我去確認一下。」"
10053050-75 = "不，不對。我也一起去。"
10053050-76 = "感覺有點不對勁，老師待在我後面。"
10053050-80 = "有誰在這扇門的另一邊……"
10053050-86 = "…………"
10053050-92 = "久等啦！！！"
10053050-93 = "！？！？＠＃！＠＃！"
10053050-102 = "嗯？不是，為什麼打我？為什麼要打我啊！？"
10053050-103 = "笨蛋！為什麼搞這種奇怪的惡作劇！嚇死我了！"
10053050-104 = "……？？？老師，他怎麼了？"
10053050-105 = "[s9]「 剛才在門前的……」\n[s10] 「不是木乃香嗎？」"
10053050-108 = "咦？你在說什麼？我剛才……"
10053050-109 = "啊，也就是說我沒有看錯啊。"
10053050-110 = "咦！？那是什麼意思？"
10053050-111 = "就是，我端著湯過來的時候看到有人出去了。"
10053050-112 = "但是大家都在裡面，所以我以為是我看錯了。"
10053050-113 = "也，也就是說，真的有人嗎！？除了我們以外！？"
10053050-114 = "嗯，不只我感覺到，所以應該是吧？"
10053050-115 = "比起這個先吃飯吧，把所長也叫起來。"
10053050-116 = "現在不是有比吃飯更重要的事嗎！？"
10053050-117 = "哎呀，哪有什麼比吃飯更重要的，都是為了吃飯而活著的啊。所長，起來～"
10053050-119 = "（就這樣在尷尬的氣氛中吃起了晚餐。）"
10053050-120 = "（……出乎意料的是木乃香做的菜還挺好吃的，雖然菜單有點重口味。）"
10053050-123 = "原來如此…… 在我睡著的時候發生了那種事啊。"
10053050-124 = "……稍微問一下。"
10053050-125 = "這裡面有人做過讓人懷恨在心的事嗎？"
10053050-126 = "怎麼可能有！！！"
10053050-128 = "我有喔～？"
10053050-130 = "咦！？"
10053050-132 = "讓我想想……之前說要報仇找上門的傢伙大概2週前……"
10053050-133 = "差不多應該要再有一兩個人找上門了吧～？"
10053050-134 = "開玩笑的吧？"
10053050-135 = "當然不是。"
10053050-136 = "我在公安局也不是白吃白喝的～"
10053050-137 = "嗯……但應該不是我，知道我在這裡的只有大姐。"
10053050-138 = "不，也不一定。"
10053050-139 = "咦……？"
10053050-140 = "如果有人懷著惡意一直跟蹤木乃香君，不就是正在等待你獨自來到偏僻地方的這個時機嗎？"
10053050-141 = "當然，要讓這個假設成立，對方需要有相當的耐心和執念……最重要的是深深的怨恨。"
10053050-142 = "不過再怎麼說，我應該沒做過那種讓人這樣懷恨的事──"
10053050-146 = "……可能有一點？"
10053050-147 = "竟然有嗎！？"
10053050-148 = "不是嘛～像是執行公務什麼的～難免會有人受傷的時候啊～"
10053050-149 = "女武神可以這樣嗎！？奇普托斯真的沒問題嗎！？"
10053050-150 = "沒問題啦，因為是正當防衛，正當防衛。"
10053050-155 = "────七罪人。"
10053050-162 = "聽傳聞說是被出身學校放棄管教，#n被聯邦學生會特殊部隊逮捕之後被移送到矯正局又越獄的七名凶惡犯。"
10053050-163 = "如果他們的目標不是木乃香君而是公安局……也就是女武神警察學園呢？"
10053050-164 = "也許我們正陷入前所未有的危機……！"
10053050-169 = "是不是太誇張了……？"
10053050-174 = "嗯……也許有可能喔。"
10053050-175 = "真的假的……？"
10053050-176 = "行事周到、執著、異常地憎恨女武神的囚犯。"
10053050-177 = "確實可以想到是誰。"
10053050-178 = "…………"
10053050-179 = "…………"
10053050-181 = "啊～太好了～"
10053050-182 = "咦？"
10053050-183 = "我還以為是什麼鬼出現了。"
10053050-184 = "如果是越獄犯就簡單了，抓起來再關進監獄就好了！"
10053050-185 = "……啊，監獄這個說法收回，是矯正局。"
10053050-186 = "說得太輕鬆了吧……？"
10053050-187 = "那七名囚犯連我都知道呢。"
10053050-188 = "哦？是嗎？知道七罪人卻不知道我是公安局的？"
10053050-189 = "啊，抱歉，我不是那個意思……"
10053050-190 = "哎呀，道什麼歉啦！開玩笑的，開玩笑！"
10053050-194 = "總之我保證！不管來了多少人姐姐我都會保護你們的，別太擔心！"
10053050-195 = "這樣問題就解決了！啊～白擔心了～"
10053050-196 = "……"
10053050-200 = "……"
