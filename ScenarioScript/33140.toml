[translation]
33140-1 = "제14화;어둠 속의 빛"
33140-5 = "우오오오오오오오----------------------------"
33140-10 = "드, 등장 확인했습니다……. 저, 저게 바로 그……."
33140-11 = "저게 그 <전술 병기>인가. 그냥 괴물이군."
33140-12 = "(휘릭, 휘리릭- 휘익, 휘릭) ……."
33140-13 = "<교의>를 바탕으로 만든…… 실패작? 그렇다면 그 인형은 실패한 거야, 공주님?"
33140-14 = "(도리도리)"
33140-15 = "(휘릭, 휘리릭- 휘익, 휘릭, 휘이익)"
33140-16 = "……어려운 말은 됐어. 실패작이지만, <전술 병기>는 맞다는 거지?"
33140-17 = "지금쯤이면 성도회와 저 <전술 병기>의 정체, 그리고 우리의 다음 목표도 밝혀졌겠지."
33140-22 = "이미 늦었어."
33140-23 = "대기 중인 부대에게 연락을 취해라."
33140-24 = "지금부터 트리니티로 진격한다."
33140-26 = "트리니티 자치구의 버려진 유적지"
33140-31 = "트리니티 지하 카타콤의 어딘가"
33140-36 = "트리니티 자치구의 지하 하수도"
33140-41 = "……이제 진격 명령을……."
33140-42 = "…………."
33140-43 = "리더?"
33140-44 = "왜, 왜 그러시나요?"
33140-45 = "……우리가 이 건물을 얼마나 오래 비웠었지?"
33140-46 = "약 3시간 정도……?"
33140-47 = "……."
33140-48 = "그 녀석이다. 그 녀석이 여기에 있어."
33140-50 = "그 녀석?"
33140-51 = "(스윽, 스으윽-)"
33140-52 = "네? 아, 아즈사 쨩이?"
33140-56 = "히, 히이이이이익-?!"
33140-57 = "부비트랩?! 어느 틈에?!"
33140-58 = "자, 잠깐만요?! 여, 여기에도……."
33140-62 = "------!"
33140-68 = "움직이지 마!!"
33140-69 = "……!"
33140-70 = "!!"
33140-71 = "……."
33140-72 = "이 부비트랩은 우리를 당황하게 만들려고 하는 것이다. 그 녀석의 특기는 상대의 허를 찌르는 것."
33140-73 = "그것만큼은 정말 훌륭했지. 그러니 여기서는 침착하게……."
33140-77 = "꺄아아아앙, 아니에요! 시간차 폭발이에요-!! 여기서 벗어나야……!"
33140-81 = "히요리!"
33140-85 = "크, 크으윽……."
33140-86 = "죄, 죄송합니다…… 역시 너무 고통스럽네요. 아프네요…… 으으…… 삶이란 왜 이리……."
33140-91 = "……."
33140-92 = "……."
33140-93 = "……."
33140-94 = "히요리부터 노렸어. 저격수부터 처치했다는 건……."
33140-95 = "……난전으로 이끌겠다는 건가?"
33140-99 = "(딸칵, 딸칵)"
33140-100 = "!!!"
33140-102 = "수류탄이!! 위다! 천장이야!!"
33140-106 = "아직 숨어있었구나!! 시라스 아즈사!!"
33140-113 = "도망치게 둘 것 같으냐!!"
33140-114 = "리더. 쫓아갔다간 그 녀석이 원하는 대로……."
33140-118 = "……어쩔 수 없네. 공주님, 히요리는 어때?"
33140-119 = "(스윽, 휘릭) ……."
33140-120 = "그런가."
33140-121 = "(스윽, 스으윽 휘릭, 휘리릭-)"
33140-122 = "아즈사가 작정했다면…… 이건 장기전이 될 거라고?"
33140-129 = "……리더의 총소리야. 교전을 시작했나 본데."
33140-133 = "……."
33140-134 = "어쩔 수 없겠지. 우리도 움직이자. 공주님."
33140-135 = "……."
33140-140 = "그쪽이냐--!!"
33140-144 = "그래, 좋은 판단이다! 시라스 아즈사! 너는 나를 이길 수 없어!"
33140-145 = "그렇게 도망치면서,"
33140-149 = "내 허를 찌르는 것 말곤 방법이 없겠지!!"
33140-151 = "하아, 하아…… 다음 코너를 돌아서……."
33140-158 = "크읏-?!"
33140-159 = "(철컥)"
33140-163 = "크, 크윽!"
33140-164 = "……."
33140-165 = "아츠코……."
33140-166 = "(휘릭, 휘리리릭-)"
33140-167 = "거절이야."
33140-172 = "콰아아아아아아앙---!!"
33140-173 = "……?! ……!!"
33140-177 = "아즈사!!"
33140-178 = "기다려, 리더. 이대로 가다간 끝이 없어."
33140-179 = "성도회를 불러서 수색 섬멸전으로 돌려야 해."
33140-180 = "……."
33140-181 = "(도리도리)"
33140-182 = "…….성도회는 트리니티와 게헨나의 분쟁에만 개입한다. 시라스 아즈사는 트리니티 학생이 아니라고 판단할 수도 있어."
33140-183 = "……그런가? 꽤 귀찮은 구조네."
33140-184 = "(끄덕)"
33140-185 = "오히려 아리우스 스쿼드라고 판단해버린다면……."
33140-186 = "뭐, 이해했어. 계율이라는 건 해석하기 나름이라는 거군. 하긴, 그렇게 해서 얻은 힘이니까 그런 페널티도 있을 수 있겠지."
33140-187 = "그래, 오히려 이쪽이 맞아."
33140-188 = "저 녀석의 모든 전투 방식과 습관, 사고방식…… 모두 다 내가 가르쳤다. 이 내가 아니면 쓰러트리지 못하겠지."
33140-189 = "계속 쫓는다."
33140-193 = "……흠. 나는 반대쪽으로 가겠어. 공주님, 너는 다른 길로 쫓아."
33140-194 = "……."
33140-195 = "(쿠쿠쿠쿠쿠쿠쿠쿠쿠----)"
33140-196 = "뭐지? 지진……? 아니, 설마……."
33140-197 = "이쪽 층 전체에……?"
33140-198 = "콰아아아아아아앙---!!"
33140-199 = "크, 크윽-! 어느새 이런 트랩을……! 위층이 붕괴……! 뛰어!"
33140-201 = "콰아아아아아아아아앙---!!"
33140-203 = "크, 쿨럭…… 쿨럭……."
33140-204 = "못 움직이겠……."
33140-205 = "아즈사아아아아아아----!!!"
33140-210 = "……쿨럭."
33140-228 = "체크메이트다. 아즈사."
33140-229 = "……큭."
33140-232 = "애썼지만 무리였다. 네 녀석의 모든 습관과 생각, 사고방식은 이미 다 꿰뚫고 있어."
33140-233 = "헛된 저항이었던 거다."
33140-234 = "언제부터……?"
33140-235 = "?"
33140-238 = "언제부터 아리우스가 순항 미사일을 가지고 있었던 거야……?"
33140-239 = "언제부터 저런 불가사의한 힘을 다루게 된 거야……?"
33140-240 = "그래…… 생각해보면…… <헤일로를 부수는 폭탄>이라는 것도……."
33140-244 = "……."
33140-245 = "아즈사. 네가 어째서 패배했는지 알고 있나?"
33140-246 = "나약하기 때문이다."
33140-247 = "……."
33140-248 = "<살인자>를 결정하는 것이 무엇인 것 같으냐?"
33140-249 = "그것은 <살해 의지>의 유무다."
33140-251 = "경전에 나오는 최초의 살인자는 그저 돌멩이 하나로 사람을 죽였다고 하지."
33140-252 = "그런 것이다. 아즈사. 의지만 있으면 도구는 상관없는 것이다. 중요한 것은 오직 거기에 담긴 의지뿐."
33140-253 = "그래, 이런 것들은 우리의 증오를 증명하기 위한 도구…… 그 이상도 이하도 아니야."
33140-256 = "사오리……"
33140-257 = "……그 증오는 대체 누구의 것이야?"
33140-258 = "……?!"
33140-259 = "그 증오라는 건…… 나는 그저 <학원>에서 배웠을 뿐이야. 나는 그런……."
33140-260 = "헛되다."
33140-265 = "나약하구나. 시라스 아즈사. 그 나약함은 질병이다. 그것이 너를 옭아매고 갉아먹는다."
33140-269 = "그래, 이런 상황에도 몸에서 떼지 못하는 그 인형……. 그것처럼 말이다."
33140-270 = "!!"
33140-271 = "친구가 준 첫 선물?"
33140-273 = "헛되다."
33140-320 = "헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다."
33140-354 = "헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다."
33140-387 = "헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다. 헛되다."
33140-388 = "크, 크아아…… 으아……. 아아아……!"
33140-389 = "헛되다. 시라스 아즈사."
33140-390 = "우정? 그 헛된 것부터 부숴주지. 누구였지? 히후미였나?"
33140-395 = "(도리도리) ……."
33140-396 = "……비켜. 공주님."
33140-397 = "……아아. 힘 조절은 하고 있어. 저 녀석에 대해선 잘 알고 있으니까. 그러니……."
33140-407 = "아즈사!! 또 도망치려고-,"
33140-412 = "……."
33140-413 = "……놓쳤나."
33140-417 = "상관없겠지. 녀석은 다시 여기로 올 수밖에 없을 거다."
33140-418 = "……?"
33140-424 = "어째서냐고? 이 소중한 <우정>의 증거를 흘리고 갔으니까."
33140-425 = "……."
33140-426 = "아즈사는 반드시 이걸 되찾으러 올 것이다. 반드시 말야."
33140-427 = "(휘릭, 휘릭) ……?"
33140-428 = "어째서냐고? ……그래. 어둠 속에서 빛을 발견한 벌레는 이제 그것 없이는 살 수 없게 되어버리지."
33140-429 = "이런 하찮은 물건이 아즈사의 마음을 지탱하는 [ruby=희망]불빛[/ruby]이었을 것이다."
33140-430 = "그 녀석은 이걸 포기할 수 없어. 반드시 돌아온다."
33140-431 = "그때 강제로라도 포획해서, 이 세계의 진실을 알려주겠어."
33140-433 = "……그래, 강제로라도 말이지."
33140-438 = "……응?"
33140-439 = "뭐지……? 안에 뭔가……."
33140-446 = "………!!"
33140-447 = "이건…… 세이아 습격 때 줬던……"
33140-448 = "피, 피해!! 공주님!!! 이건……!!"
33140-449 = "……!!!"
33140-461 = "……."
33140-462 = "…………."
33140-463 = "………………흑."
33140-464 = "……으흐흑. 으흐흑. ……으흑."
33140-465 = "으흑…… 미안해. 히후미…… 미안……."
33140-466 = "나는…… 이제…… 진짜로……. 으흑…… 으흐흐흐흑……."
33140-468 = "……으흐흑. 으흑. 으흐흑……. 모두 미안해……. 으흐흐흑, 으흐흐흐흐흑……."
33140-471 = "다음화;다섯 번째 화두의 대답"
