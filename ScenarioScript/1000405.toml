[translation]
1000405-1 = "타인의 취향"
1000405-2 = "게헨나 변두리의 작은 쇼핑몰"
1000405-6 = "……."
1000405-7 = "아, 안녕……. 선생."
1000405-8 = "[s1] \"한낮의 히나 쨩이다!\"\n[s2] \"파란 하늘 아래의 히나 쨩!\""
1000405-9 = "그렇게까지 대단한 일은 아니거든?"
1000405-10 = "그렇게까지 대단한 일은 아니거든?"
1000405-11 = "유령을 본 것처럼 반응하지 마."
1000405-12 = "저번에 낮에 보자고 약속……했었으니까……."
1000405-13 = "[s] \"바쁜 건 괜찮아?\""
1000405-14 = "……아아. 물론. 나라고 해서 맨날 일만 하고 있는 건 아니야."
1000405-15 = "일정을 조정하면 3시간 정도는 어떻게든 낼 수 있고……."
1000405-16 = "[s3] \"3시간?\"\n[s4] \"그것밖에 안 돼?\""
1000405-17 = "어……?"
1000405-18 = "어……?"
1000405-19 = "부, 부족한 건가…… 그걸로……?"
1000405-20 = "나, 나는 그 정도면 충분할 줄 알고……. 쇼핑……이라는 건……."
1000405-21 = "[s] \"괜찮아. 어떻게든 되겠지. 가자!\""
1000405-22 = "아, 으, 으응……."
1000405-24 = "(히나와 함께 쇼핑몰로 들어갔다.)"
1000405-27 = "(사람이 별로 없네…….)"
1000405-28 = "(이 사람은 아마도 일부러 이런 곳을…….)"
1000405-29 = "(정말이지…….)"
1000405-30 = "……그래서, 중요한 할 일이라는 게 뭐야?"
1000405-31 = "[s5] \"딱히 없는데?\"\n[s6] \"그냥 데이트?\""
1000405-32 = "……."
1000405-33 = "……."
1000405-34 = "역시 그런 걸 줄 알았어."
1000405-36 = "캐릭터 악세서리 가게"
1000405-37 = "여긴 악세서리를 파는 곳이네……."
1000405-38 = "이상한 동물 캐릭터들이 잔뜩 있긴 하지만……."
1000405-39 = "응? 마음에 드는 게 있냐고?"
1000405-40 = "아니. 난 이런 건 별로 안좋아해서."
1000405-41 = "귀엽다고 좋아하는 학생들은 꽤 있던데, 나는 잘 모르겠어. 이 녀석들, 이름도 모르는 걸."
1000405-42 = "그럼 다른 데로 갈까?"
1000405-44 = "오락실"
1000405-45 = "전자오락실이네……."
1000405-46 = "해본 적이 있냐고? 아니. 별로 관심없어."
1000405-47 = "시끄럽고 번쩍거리는 것투성이에. 사람은 붐비고."
1000405-48 = "즐거워하는 사람들이 있다는 건 알아. 그냥 내 취향이 아닐 뿐이야."
1000405-49 = "그럼, 다른 데로 가보자."
1000405-51 = "옷가게"
1000405-52 = "스트리트 패션복을 파는 가게……."
1000405-53 = "주말에 외출할 때 이런 화려한 옷을 입는 학생들도 많긴 하지……"
1000405-54 = "……마음에 드는 게 있냐고?"
1000405-55 = "아니. 딱히."
1000405-56 = "필요도 없는 옷을 굳이 사야 할 필요는 없잖아?"
1000405-57 = "교복이 있는데 굳이 사복을 입어야 할 이유도 없고."
1000405-58 = "[s7] \"그래도 하나 골라볼래?\"\n[s8] \"이 중에 마음에 드는 건?\""
1000405-59 = "……?"
1000405-60 = "……?"
1000405-61 = "……으으음."
1000405-62 = "흐으음……."
1000405-64 = "……흐으으음."
1000405-66 = "……자, 잘 모르겠어."
1000405-67 = "미, 미안."
1000405-69 = "매장 안 패밀리 레스토랑"
1000405-70 = "(잠시 쉴 겸 해서 근처의 패밀리 레스토랑으로 왔다.)"
1000405-71 = "……."
1000405-72 = "………."
1000405-73 = "…………."
1000405-74 = "[s] \"왜 그래, 히나 쨩?\""
1000405-75 = "응……?"
1000405-76 = "아, 아니……. 오늘 기대했던 건 이런 게 아니었던 거 같아서……."
1000405-77 = "내가…… 뭔가……. 망쳐버린 느낌이야……."
1000405-78 = "난…… 재미없는 인간이거든……. 하아. 나도 알아."
1000405-79 = "[s9] \"오히려 히나다워서 좋은데?\"\n[s10] \"그런 부분이 히나답다고 할까.\""
1000405-82 = "……."
1000405-83 = "(또 그렇게 나를 배려해줘서…….)"
1000405-84 = "(정말이지…….)"
1000405-85 = "주문하시겠습니까?"
1000405-86 = "아…… 으, 응. 나는 블랙 커피. 시럽, 밀크 없이."
1000405-87 = "선생은 뭘…… 응?"
1000405-88 = "왜 그래, 선생?"
1000405-89 = "[s11] \"히나는 어른스럽구나, 해서.\"\n[s12] \"한결 같은 어른 취향이구나 해서.\""
1000405-90 = "……뭐? 어, 어른?"
1000405-91 = "……뭐? 어, 어른?"
1000405-92 = "……."
1000405-93 = "아하하하- 무슨 소리야? 어른은 당신이잖아."
1000405-94 = "나는 꼬맹이라고. 키도 작고 불만투성이에, 귀엽지 않은."
1000405-96 = "(당신의 그런……)"
1000405-97 = "(어른스러운 면모를 동경하고 있는 아이일 뿐인데…….)"
1000405-100 = "오늘도 나 때문에 재미없었을 거고. ……그러니까 그렇게 말해주지 않아도 돼."
1000405-101 = "[s13] \"아니. 오늘은 히나의 웃는 얼굴을 봤으니까,\"\n[s14] \"아주 만족스러운 하루였어.\""
1000405-102 = "……"
1000405-103 = "……"
1000405-104 = "……으, 으응."
1000405-108 = "(얼른 주문이나 해줬으면…….)"
