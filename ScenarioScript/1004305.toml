[translation]
1004305-1 = "모닥불 곁에서 어른거리는 마음에"
1004305-3 = "이것으로 준비는 전부 끝났습니다."
1004305-4 = "모두 수고하셨습니다!"
1004305-10 = "[ns] \"후우, 간신히 끝났구나.\""
1004305-11 = "(여러 소동이 있긴 했지만, 그래도 최종적으로는 별 탈 없이 축제의 준비를 끝마칠 수 있었다.)"
1004305-15 = "(잠시 여유가 생긴 참에 와카모에게 모모톡의 답장을 보냈다.)"
1004305-16 = "[s] \"<일 전부 끝났어. 와카모는 어디야?>\""
1004305-20 = "(평소와 달리, 제법 오랜 시간을 기다렸는데도 어째서인지 와카모에게서 답장은 도착하지 않았다.)"
1004305-21 = "[s] \"와카모에게서 답장이 없다니, 별일이네…….\""
1004305-25 = "이런 아무래도 날씨가 심상치 않군요."
1004305-26 = "바람이 거센 걸 보니, 파도가 거칠어질 모양입니다."
1004305-30 = "(문득 막연한 불안감이 느껴졌다.)"
1004305-34 = "[ns] \"……잠시 나갔다 오겠습니다.\""
1004305-35 = "앗, 샬레의 선생님? 비바람이 강해지고 있는데요. 잠시만요!"
1004305-48 = "(그렇게 막연한 불안감에 젖어 얼마나 주변을 돌아다니며 찾았을까.)"
1004305-52 = "[ns] \"하아하아……. 찾았다…….\""
1004305-55 = "어라, 선생님. 오셨군요♡"
1004305-58 = "[ns] \"……와카모, 여기서 뭐 하고 있어?\""
1004305-59 = "네?"
1004305-60 = "그야 이 와카모, 당연히 당신을 기다리고 있었답니다♡"
1004305-61 = "[s] \"이 날씨에, 그냥 이곳에서 기다리고 있었다고……? 어째서…….\""
1004305-62 = "우후훗, 일부러 그런 질문을 하신다니, 당신께서도 참으로 짓궂으셔라."
1004305-63 = "그야 말할 필요도 없는 이야기이지요……."
1004305-64 = "당신과 제가 <약속>하였으니까요."
1004305-65 = "<……지금은 잠시 바쁘니, 조금만 기다려 달라.>"
1004305-66 = "당신께서 그렇게 말씀해 주셨다면, 당연히도 이 와카모."
1004305-67 = "그 말씀대로 비가 오는 곳이든, 눈이 오는 곳이든, 당신을 기다리는 것이 당연지사."
1004305-68 = "그러한 <약속>이니까요."
1004305-69 = "[s] \"약속……. 그러고 보니 저번에 폭죽 창고에서도…….\""
1004305-72 = "우후훗, 당신께 약속을 드렸으니까요. 오늘 하루를 특별하게 만들어드리겠다고."
1004305-73 = "그러니 계속해서 저희를 방해하는 이 장애물……."
1004305-74 = "네에-! 불꽃놀이 자체를, 날려버리겠어요!"
1004305-77 = "[ns] \"그래서 와카모는 약속을 지키려고…….\""
1004305-78 = "네, 그렇습니다마는."
1004305-79 = "저…… 혹시, 와카모가…… 실수를 했을까요?"
1004305-80 = "당신께 폐가 될 만한 일을, 저질러 버렸……다던가……?"
1004305-81 = "[s1] \"아냐, 실수라면 내가 했어. 괜히 이런 곳에서 기다리게 만들고.\"\n[s2] \"와카모에게 좀 더 제대로 설명을 해야 했는데.\""
1004305-82 = "네?"
1004305-83 = "네?"
1004305-84 = "아니요. 이런 기다림쯤이야, 이 와카모에겐 아무것도 아닌-"
1004305-92 = "읏?! 서, 선생님……?"
1004305-95 = "[ns3] \"……괜찮을 리가, 없잖아.\"\n[ns4] \"몸이 이렇게 차가워졌는데……!\""
1004305-96 = "선생님……."
1004305-97 = "선생님……."
1004305-98 = "당……신……."
1004305-99 = "……뜨거워요."
1004305-100 = "[s] \"맞다. 와카모 잠깐만 기다려줘!\""
1004305-101 = "앗, 네, 네엣……?"
1004305-108 = "이건…… 모닥불……?"
1004305-109 = "[s5] \"우선 돌아가기 전에, 여기서 잠깐만 차가운 몸부터 녹일래?\"\n[s6] \"그동안 와카모 곁에 앉아 있을 테니까.\""
1004305-115 = "넷, 네에……♡"
1004305-121 = "그, 그럼, 실례하겠습니다."
1004305-124 = "[wa:200]― 후훗, [wa:2150]정말 따듯하네요……."
1004305-127 = "― 물론 [wa:1500]모닥불 탓도 [wa:650]있겠습니다만……."
1004305-130 = "[wa:1300]― 당신의 목소리, [wa:1950]그 한 마디 한 마디가……."
1004305-133 = "― 지금은 [wa:900]오직 저만을 위해,"
1004305-135 = "― 자아내진 말이라 생각하면……."
1004305-138 = "[wa:850]― ……아직 저는,"
1004305-140 = "― 여러모로 [wa:1000]부족한 몸이기에."
1004305-143 = "― 이렇게 당신 곁에 [wa:250]있으면서, [wa:2450]잔뜩 [wa:800]폐를 끼치고"
1004305-145 = "― 또다시 [wa:1200]잘못을 [wa:550]저지를지도 [wa:750]모른답니다."
1004305-148 = "[wa:500]― 그럼에도, [wa:2000]제가 [wa:1350]이렇게 당신의……"
1004305-150 = "― 선생님 곁에 있어도, [wa:2500]괜찮을까요……?"
1004305-153 = "[ns] \"응. 물론. 얼마든지.\""
1004305-154 = "[wa:400]― 감사합니다……."
1004305-156 = "― 그런 [wa:300]당신이기에, [wa:2300]저는……."
1004305-160 = "(그렇게 와카모의 얼어붙은 몸이 녹을 때까지. 함께 앉아 모닥불의 빛이 어른거리는 바다를 지켜보았다.)"
