[translation]
1005002-1 = "코코나 쨩이 아니에요. 교관이라구요!"
1005002-2 = "산해경 매화원"
1005002-5 = "코코나 쨩~ 나 이거 갖고 싶어~"
1005002-6 = "코코나 쨩~ 오늘 간식은 뭐야?"
1005002-7 = "코코나 쨩이 아니라 코코나 교관!"
1005002-8 = "코코나 쨩~ 이거 모르겠어. 알려 줘."
1005002-9 = "있잖아, 코코나 쨩. 정말 리만 제타 함수의 근이 소수 계량 함수의 진동을 결정할까?"
1005002-10 = "코코나 쨩이라고 부르지 말라고 몇 번을 말해야겠어?"
1005002-11 = "그리고 마지막 질문은 대체 뭐야……"
1005002-12 = "[s1] \"고생이 많네.\"\n[s2] \"매화원의 교관이란 굉장하구나……\""
1005002-13 = "앗, 선생님!"
1005002-14 = "앗, 선생님!"
1005002-15 = "모두 선생님께 인사해야지?"
1005002-16 = "안녕하세요, 선생님~"
1005002-17 = "정말이지, 선생님에게는 잘만 선생님이라고 부르면서."
1005002-18 = "왜 저한테는 코코나 쨩이라고만 부르는 걸까요?"
1005002-19 = "앗, 이래서는 안 돼요."
1005002-20 = "어엿한 숙녀이자 한 명의 교관으로서."
1005002-21 = "믿음직스러운 모습을 보여 드리고자 선생님을 초대한 건데……!"
1005002-22 = "[s] \"약간 못 미더운 점도 있지만, 충분히 믿음직스러운데?\""
1005002-23 = "약간 못 미더운 점이라뇨!"
1005002-24 = "아뇨, 이런 일로 쉽게 화내서는 안 되죠."
1005002-25 = "숙녀가 사소한 일에 흔들리는 모습을 보여선 안 되니까요."
1005002-26 = "숙녀가 편식하는 건 괜찮은 거야, 코코나 쨩?"
1005002-27 = "수, 숙녀라도 싫어하는 것 한두 개 정도는 있는 법이니까 괜찮아!"
1005002-28 = "그럼 우리도 싫어하는 거 안 먹어도 돼?"
1005002-29 = "그건 안 돼! 골고루 먹어야지!"
1005002-30 = "왜 코코나 쨩은 되는데 우린 안 돼? 이상해~"
1005002-31 = "그건 내가 교관이니까 그런 거야!"
1005002-32 = "교관일수록 모범을 보여야 하는 거 아냐, 코코나 쨩?"
1005002-33 = "그, 그건 그렇긴 한데……!"
1005002-34 = "선생님도 보고만 있지 말고 뭔가 한마디 해 주세요!"
1005002-38 = "[ns3] \"코코나 교관님 말씀 잘 들어야지, 얘들아.\"\n[ns4] \"코코나 교관님도 이제 편식하지 않을 거야.\""
1005002-39 = "선생님이 코코나 쨩을 교관님이라고 불렀어~"
1005002-40 = "선생님이 코코나 쨩을 교관님이라고 불렀어~"
1005002-41 = "어…… 하지만 코코나 쨩은 코코나 쨩인데……"
1005002-42 = "하지만 선생님이 그렇게 불렀으니, 그게 맞는 거 아닐까?"
1005002-43 = "그럼…… 코코나 교관인 거야? 아무리 그래도 교관님은 이상한걸……"
1005002-44 = "그래! 난 코코나 교관이라고. 몇 번이나 말했잖아?"
1005002-45 = "코코나 교관……?"
1005002-46 = "코코나 교관!"
1005002-47 = "[s] \"기뻐 보이네, 코코나 교관님.\""
1005002-48 = "그, 그렇게까지는요?"
1005002-49 = "하지만… 에헴. 이걸로 확실히 아셨겠죠?"
1005002-50 = "제가 확실한 매화원의 교관이라는 걸요."
1005002-51 = "코코나 교관~ 나 화장실 가고 싶어~"
1005002-52 = "코코나 교관~ 나 가족이 보고 싶어~ 언제 와?"
1005002-53 = "자, 잠깐 기다려!"
1005002-54 = "하여튼 아이들이란…… 한번 제멋대로 움직이면 말을 안 듣는다니까……"
1005002-55 = "[s] (코코나도 아이 중 한 명이 아니냐고 묻고 싶지만……)"
1005002-56 = "……표정이 왜 그러시죠, 선생님?"
1005002-57 = "아무것도 아니라고요? 그보다…… 수고가 많다고요?"
1005002-58 = "뭘요. 아이들을 한 명의 훌륭한 원생으로 길러내는 것은 산해경 교관의 책무니까요."
1005002-59 = "이 정도 일로 투정을 부릴 수는 없다구요."
1005002-60 = "코코나 교관~ 나 간식 빨리 먹고 싶어."
1005002-61 = "아, 하지만 코코나 교관이 만든 간식은 싫어. 맛없으니까."
1005002-62 = "너희들, 간식 시간은 아직 멀었거든?"
1005002-63 = "그리고 두고 봐. 언젠가 슌 언니보다 더 맛있는 요리를 만들고 말 테니까."
1005002-64 = "그때 모두 후회하게 해 줄 거야!"
1005002-65 = "와~ 코코나 쨩이 화났어~"
1005002-66 = "왜 다시 코코나 쨩으로 돌아온 거냐구!"
