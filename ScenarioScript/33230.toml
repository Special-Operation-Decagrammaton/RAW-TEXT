[translation]
33230-1 = "제23화;고성당의 지하"
33230-2 = "……끝났어. 우리의 패배야."
33230-3 = "……항복이에요. 더는……."
33230-4 = "……."
33230-5 = "아직이야……."
33230-6 = "아직 고성당의 지하에……. 남은 방법이……."
33230-15 = "사오리……!!"
33230-16 = "폐허에 고성당 지하로 통하는 통로가 남아있는 것 같아요!"
33230-17 = "거기서 무언가……, 아직 위험한 무언가를 하고 있다면…… 사오리를 막아야 해요!"
33230-23 = "아, 아직도 이런 힘이……."
33230-24 = "아직 움직일 수 있는 건 나니까…… 내가 가겠어."
33230-25 = "아, 아즈사 쨩……? 그, 그치만…… 혼자서……?"
33230-26 = "아니. 사오리를 막을 뿐이야. 돌아올게."
33230-27 = "[s] \"내가 함께 갈게.\""
33230-28 = "선생님……. 응. 선생님과 함께라면 안심할 수 있어."
33230-29 = "아즈사 쨩, 그러니까……!!"
33230-30 = "나는 두 번 다시 도망치지 않을 거야."
33230-35 = "다녀올게, 히후미. 하나코. 코하루."
33230-36 = "네!"
33230-37 = "기다리고 있을게요."
33230-38 = "조, 조심해!"
33230-42 = "[ns] \"가자! 마지막 싸움이야!\""
33230-45 = "……아즈사."
33230-46 = "사오리. 이제 끝내자."
33230-47 = "그래, 좋다. 이게 마지막 전투라면, 모든 것을 걸어봐라."
33230-48 = "나에게 정면으로 덤벼서 승리할 수 있을 거라고 생각했나!!"
33230-49 = "아니. 난 혼자가 아냐."
33230-51 = "……!! [USERNAME] 선생!!"
33230-52 = "그래…… 좋다! 여기서 모두 다 해치워주마!! 너도, 저 어른도!"
33230-53 = "그리고 마침내, 모든 것이 헛된 이 세계에서……. 그 진실을……."
33230-58 = "[ns] \"아즈사. 가서 이기고 와.\""
33230-59 = "응. 선생님."
