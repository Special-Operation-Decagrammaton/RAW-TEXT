[translation]
10016090-1 = "제9화;황륜대제의 주인공"
10016090-2 = "안녕하세요, 크로노스 채널의 시청자 여러분! 화려했던 황륜대제도 어느덧 종막에 이르고 있습니다!"
10016090-3 = "이제 남은 경기는 황륜대제의 피날레라고 할 수 있는, <학원 대항 계주>뿐!"
10016090-4 = "이 경기를 끝으로 황륜대제의 종합 우승을 차지하게 되는 학교가 어디인지 가려지게 됩니다!"
10016090-5 = "그렇다고는 하지만 보통 마지막 계주가 시작될 즈음에는 종합 우승을 차지하는 학원이 어디일지, 윤곽이 어느 정도 드러나게 되는데요……"
10016090-6 = "현재, 종합 우승이 유력한 1위 학원은 어디인가요?"
10016090-7 = "여러분, 놀라지 마세요. 현재 종합 점수 1위를 차지하고 있는 학원은……"
10016090-8 = "트리니티, 게헨나, 밀레니엄 학원이 동점입니다!"
10016090-9 = "네에에?! 설마 1점의 차이도 없이 동점이란 말씀이신가요?"
10016090-10 = "그렇습니다! 기존 대운동회에서는 보통 결승을 앞두고 트리니티와 게헨나의 맞대결이 이루어졌었는데요."
10016090-11 = "이번 황륜대제에서는 밀레니엄 학원이 예상외의 선전을 하며, 마지막까지 삼파전이 이루어지고 있습니다!"
10016090-12 = "<학원 대항 계주>를 주목해야 할 이유가 하나 더 생긴 셈이네요."
10016090-14 = "그럼 마지막까지 저희 크로노스 채널과 함께하세요!"
10016090-16 = "과연. 이번 마지막 계주로 종합 우승의 승자가 결정되는 셈이군요."
10016090-17 = "계주에 출전하는 선수 구성에 더욱 신중을 기울이지 않으면……"
10016090-18 = "저기, 그 소식 들었어? 선도부의 히나 부장이 실종 상태래."
10016090-19 = "정말? 선도부에 무슨 일이라도 생긴 건가?"
10016090-20 = "다른 사람도 아니고 그 선도부장이니, 누군가가 해코지를 한 건 아니겠지만……"
10016090-21 = "그보다 최종 계주, 위험한 거 아니야? 히나 부장이 직접 나가지 않으면 누가 게헨나의 주자가 될까?"
10016090-22 = "그러게…… 종합 우승은 물 건너간 게 아닐까."
10016090-23 = "트리니티를 꺾을 절호의 기회였는데……"
10016090-24 = "게헨나 선도부의 히나 부장이 실종……?"
10016090-25 = "좋은 소식은 아니지만, 게헨나에서 손꼽히는 우수한 재원이 최종 계주에 불참하게 되었으니……"
10016090-26 = "트리니티로서는 종합 우승을 차지할 절호의 기회로군요."
10016090-27 = "발이 빠른 선수들을 우선 배치해 다른 학교의 주자들과 거리를 벌린 다음, 리드를 이어가면 충분히 승산이 있겠어요."
10016090-28 = "지금 참가할 수 있는 선수는 '방과후 디저트부'의 카즈사 씨와 '자경단'의 스즈미 씨……"
10016090-29 = "……이만하면 충분하겠네요."
10016090-30 = "그리고 가장 중요한 마지막 주자는…… 츠루기에게 부탁하면 되겠네요!"
10016090-32 = "트리니티 선수 대기실"
10016090-33 = "……아니, 나는 계주에 나가지 않을 거야."
10016090-34 = "어, 어째서인가요?!"
10016090-35 = "설마 아까의 경기 중에 부상이라도……"
10016090-36 = "아니…… 다친 곳은 없어."
10016090-37 = "하지만 이번 대운동회에서 나는 충분히 뛰었으니까."
10016090-38 = "이번에는 다른 선수에게 기회를 주는 게 맞다고 생각해."
10016090-39 = "혹시, 츠루기…… 지친 건가요?"
10016090-40 = "아니. 지친 건 아니지만……"
10016090-41 = "대운동회의 헌장에도 쓰여 있잖아? <황륜대제>는 '모든 학생들이 함께 즐기며 만들어가는 모두의 축제'라고."
10016090-42 = "체력이 조금 뛰어나다고 내가 모든 기회를 독차지하는 건 좋지 못하다고 생각해."
10016090-43 = "이번 대운동회에서 적극적으로 경기에 참가하고 싶었지만, 아직 기회를 얻지 못한 학생이 있을지도 모르니까."
10016090-44 = "그건……"
10016090-45 = "더욱이 계주의 마지막 주자는 모두의 시선을 한 몸에 받게 되니까……"
10016090-46 = "그런 시선은…… 조금 부담스러워……"
10016090-47 = "사정은 이해했습니다만. 경기가 얼마 남지 않은 이 시점에서 새로운 선수를 어디서 구해야 할지……"
10016090-49 = "………새로운 선수?"
10016090-50 = "하스미, 네가 직접 나가면 되잖아?"
10016090-51 = "네에?!"
10016090-52 = "계주의 마지막 주자로, 제가요?"
10016090-53 = "……응. 왜?"
10016090-54 = "츠루기, 지금은 여유를 부릴 시간이 아닙니다."
10016090-55 = "이번 계주가 종합 우승 학교를 가리는 중요한 경기라는 사실은 인지하고 계신 건가요?"
10016090-56 = "다들 조금이라도 더 발이 빠른 선수를 내보내지 못해서 안달이 난 상황인데—"
10016090-57 = "말씀 중에 실례하겠습니다만……"
10016090-58 = "저도 츠루기 선배의 말에 동의합니다."
10016090-59 = "……마시로까지!"
10016090-60 = "도대체 왜 다들……"
10016090-61 = "왜 다들 저를 망신 주지 못해 안달인 건가요?"
10016090-63 = "마, 망신이라뇨?"
10016090-64 = "그럴 생각은 아니었는데……"
10016090-66 = "다들 알고 계시겠지만…… 저는 발이 빠르지 않습니다."
10016090-67 = "트리니티나 밀레니엄에서 어떤 선수가 주자로 나온다 하더라도 달리기에서는 이길 자신이 없습니다."
10016090-68 = "그런데 학원 대항 계주처럼 중요한 경기에서 제 실책으로 트리니티가 종합 우승을 놓친다면……"
10016090-69 = "그 책임을 어떻게 감당하란 말인가요?"
10016090-70 = "……그게 그렇게 중요한 일인가요?"
10016090-72 = "당연하지요!"
10016090-76 = "선배. 저는 이번 대운동회에 참가하기 전에 <황륜대제>의 역사와 이념에 대해 알아보았습니다."
10016090-77 = "오랜 역사를 지닌 이 체육제는 키보토스의 학생들이 자신의 한계와 가능성을 시험해보는 장으로서 기능해왔지요."
10016090-78 = "하지만 모두가 가진 신체적 특성이 다르기에, 황륜대제는 매번 모두에게 공정하도록 룰을 계속 수정해오며 모두의 축제로 거듭나 왔습니다."
10016090-79 = "그런데 경기의 승패 때문에 타고난 신체적 조건으로 선수를 구별해서, 특정 선수에게만 많은 기회를 제공한다면……"
10016090-80 = "그것은 올바른 황륜대제라고 할 수 있을까요?"
10016090-81 = "그것이 올바른 정의라고 말할 수 있을까요?!"
10016090-82 = "그, 그건 그렇지만……"
10016090-87 = "뭐— 그와는 별개로 하스미 선배가 경기에 참가했으면 하는 이유는 또 있지만요."
10016090-88 = "하스미 선배. 오늘 하루 종일 실행위원 업무를 하시느라 정작 경기에는 참여하지 못하셨지요?"
10016090-89 = "그 누구보다 오늘의 축제를 위해 땀 흘려 일하셨는데, 정작 카메라 앞에서는 단 한 번도 주목받지 못하신 것 같아서……"
10016090-90 = "그렇기 때문에 <황륜대제>의 클라이맥스라 할 수 있는 학원 대항 계주에서는 하스미 선배가 가장 빛났으면 좋겠습니다."
10016090-91 = "마지막 경기에서는 하스미님이 뛰는 모습을 보고 싶어요!"
10016090-92 = "저, 저도 그렇게 생각해요……!"
10016090-100 = "나는 오히려 하스미 부부장의 사격 실력이 더 놀라웠는걸?"
10016090-104 = "하스미 공과 함께 할 경기를 할 수 있다면 적이든 아군이든 즐거울 테니까요!"
10016090-108 = "\"새로운 경험을 하면 분명 즐거울 거야.\""
10016090-110 = "……다들 왜 이렇게 제멋대로인지."
10016090-111 = "알겠습니다. 트리니티의 마지막 주자로는 제가 나서지요."
10016090-112 = "하지만 체력이 나쁘다고 해서 설렁설렁 뛸 생각은 없습니다."
10016090-113 = "이왕 이렇게 된 이상, 제 손으로 트리니티의 종합 우승을 쟁취할 테니까요!"
10016090-115 = "그래. 그걸로 충분해."
10016090-116 = "우리는 응원석에서 너를 응원할게."
10016090-117 = "파이팅입니다, 하스미 선배!"
10016090-120 = "자, 방금 세 번째 주자가 출발했습니다!"
10016090-121 = "각 학교의 마지막 주자 여러분도 트랙으로 올라와 주세요!"
10016090-126 = "……어라, 하스미 부부장?"
10016090-127 = "……유우카?"
10016090-128 = "하스미 부부장이 여기에 있다는 말은…… 부부장이 트리니티의 마지막 주자라는 뜻?"
10016090-129 = "네, 네…… 그럼 유우카도 밀레니엄의 마지막 주자로……?"
10016090-130 = "그래, 맞아……. 어휴."
10016090-131 = "사실 달리기에는 자신이 없었는데, 세미나의 학생들이 다들 무슨 꿍꿍이인지 내가 마지막 주자로 나가지 않으면 참가하지 않겠다고 고집을 부려서 말이야."
10016090-132 = "모처럼의 종합 우승 기회인데 다들 왜 이렇게 제멋대로인지……!"
10016090-137 = "훗, 후후……."
10016090-138 = "어, 어라? 나 방금 뭔가 우스운 이야기를 했나?"
10016090-139 = "아뇨. 그냥 유우카도 고생이 많다 싶어서요."
10016090-140 = "……하지만 그렇다고 해서 봐 드리지는 않겠지만요."
10016090-141 = "그, 그건 나도 마찬가지야!"
10016090-142 = "기왕 이렇게 된 이상 밀레니엄의 종합 우승을 위해 전력으로 뛸 테니까!"
10016090-143 = "그 마음가짐만큼은 훌륭합니다만, 이번 황륜대제의 종합 우승은 트리니티의 차지가 될 겁니다."
10016090-147 = "말씀드리는 순간, 세 번째 주자들이 반환점에 들어오고 있습니다!"
10016090-154 = "우으…… 달리느라 남은 힘을 모두 써버렸어……"
10016090-155 = "난 여기까지야……."
10016090-156 = "배턴, 전달받았습니다!"
10016090-165 = "배턴을 전달받은 네 번째 주자들이 출발합니다!"
10016090-166 = "자, 잠깐 아직 나는 배턴을…… 으, 으앗?!"
10016090-171 = "게헨나의 주자, 준코 선수! 배턴에 정신이 팔려 시작하자마자 넘어졌습니다!"
10016090-172 = "아아, 이런 실책을! 이것으로 게헨나가 종합 우승으로부터 멀리 밀려나고 말았네요!"
10016090-173 = "앗, 하스미 공! 여기서 또 뵙게 되는군요!"
10016090-174 = "하아, 하아아앗—!"
10016090-175 = "오오, 엄청난 기세네요! 이즈나도 지지 않겠습니다!"
10016090-176 = "질 수…… 없으니까아아—!"
10016090-177 = "저도…… 마찬가지입니다아아—!"
10016090-178 = "우헤, 청춘이구만~"
10016090-179 = "이 아저씨도 어쩐지 조금 두근거리는걸……"
10016090-180 = "호시노 선배! 터치 끝났으면 방해하지 말고 트랙에서 나가!"
10016090-182 = "(하아, 하아…… 결승점까지는 앞으로 얼마나 남았죠?)"
10016090-183 = "(호흡 때문에 시야가 흐려져서…… 다른 주자들이 보이질 않아요…….)"
10016090-184 = "(하지만 사람들의 응원을 받으며 달리고 있는 지금이, 정신만큼은 오늘 그 어떤 때보다 맑은 것 같아요.)"
10016090-185 = "(이것이 흔히 말하는 [ruby=러너스 하이]무아의 경지[/ruby]……)"
10016090-186 = "(몸은 한계에 다다를 것 같지만, 다리를 내디딜 때마다 기쁜 감정이 넘쳐흘러서……)"
10016090-187 = "(이대로라면 얼마든지 달릴 수 있겠어요……!)"
10016090-189 = "……하스미 선수, 결승점을 통과합니다!"
10016090-190 = "……해냈다!"
10016090-196 = "하스미 선수, 6등입니다—"
10016090-197 = "……네?"
10016090-198 = "간발의 차긴 하지만 5등인 유우카 선수보다 살짝 늦게 들어오셨어요."
10016090-199 = "아쉬우시겠지만 멋진 경기였습니다. 수고 많으셨어요!"
10016090-203 = "제, 제가 6등……? 그럼 우승은……"
10016090-204 = "준코 선수. 넘어지긴 했지만, 엄청난 속도로 선두 주자들을 추격— 대역전극을 펼치며 1위로 입장했습니다!"
10016090-205 = "이건 정말 한 편의 드라마라고밖에 표현할 수 없겠네요!"
10016090-207 = "봤지? 다들 봤지! 내가 1등으로 도착했다니까!"
10016090-208 = "역시 계획대로네요. 저는 준코 양이 1등으로 도착할 거라고 믿고 있었답니다!"
10016090-209 = "어머나…… 아까 준코 씨가 넘어졌을 때 '이래서 미식연구회를 믿는 게 아니었는데—'라고 했던 분이 잘도 말씀하시네요."
10016090-211 = "……그 후련한 표정을 보아하니, 아까 갖고 있던 고민을 말끔히 떨쳐낸 모양이군요."
10016090-212 = "역시. 오늘 <황륜대제>의 주인공은 준코 씨였습니다."
10016090-213 = "그럼 이제 이 <만능 식권>으로 뭐든지 먹을 수 있는 거지?"
10016090-214 = "음식이 떨어지기 전에 빨리 먹으러 가자!"
10016090-216 = "결국 이렇게 되었나요……."
10016090-223 = "하아…… 그렇게 악착같이 달려놓고 5등이라니……"
10016090-224 = "이러니까 마지막 주자로 나가고 싶지 않았던 건데……"
10016090-228 = "수고 많으셨어요, 유우카."
10016090-229 = "하스미 부부장도 수고했어……."
10016090-231 = "그럼 마지막 경기도 끝났으니 발표하겠습니다!"
10016090-232 = "이번 황륜대제에서 최종적으로 종합 우승을 차지한 학교는……"
10016090-234 = "게헨나입니다!"
