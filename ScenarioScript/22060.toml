[translation]
22060-1 = "제6화;이상한 기계 1"
22060-2 = "(어느 날, 베리타스로부터 한 통의 연락이 도착했다.)"
22060-10 = "[ns] \"응? 다들 무슨 일이야?\""
22060-11 = "그게 말이지. 선생님! 우리가 진짜 <엄청난 걸> 발견했어!"
22060-12 = "어쩌면 키보토스 역사에 한 획을 그을 엄청난…… 말 그대로 역사적인 발견일지도 몰라!"
22060-13 = "[s] \"……역사적인 발견?\""
22060-14 = "마키, 아무리 그래도 너무 호들갑이잖아."
22060-15 = "하레의 말이 맞습니다. 마키. 특이한 걸 발견한 건 맞지만."
22060-16 = "평소 밀레니엄 학구에서 발견되는 다양한 물건들을 고려해본다면, 통계적으로 우리가 발견한 물건도 잡동사니일 확률이 높겠죠."
22060-17 = "아니~ 그래도~ 로망을 가지는 게 좋지 않아? 다들 어디서도 본 적 없는 물건이라고 했고."
22060-18 = "뭐, 그건……"
22060-19 = "마키의 말이 맞지만요……."
22060-20 = "[s] \"대체 뭘 발견했길래, 그래?\""
22060-21 = "으음…… 선생님, 말로 설명하기는 어려워."
22060-22 = "마키의 말대로 어디서도 본적 없는…… 생전 처음 보는 물건들입니다. 선생님."
22060-23 = "저희만으로는 판단하기가 어렵다고 생각되어, 혹시 몰라 선생님께서 직접 와서 봐주셨으면 합니다."
22060-24 = "그래서 말이지만, 선생님, 시간 괜찮을까?"
22060-25 = "[s] \"뭐, 그런 거라면야. 얼마든지.\""
22060-26 = "응, 그럼 베리타스 부실에서 기다리고 있을게."
22060-27 = "좋아! 선생님이 온다고 했으니! 파티다!"
22060-28 = "네, 지금 바로 피자를 주문하도록 하죠."
22060-29 = "그러니까…… 다들 너무 호들갑이라니까……."
22060-32 = "(그리하여 베리타스의 부실 앞에 도착했을 때였다.)"
22060-33 = "앗! 아리스! 지금 막 선생님을 발견했습니다!"
22060-41 = "……응?"
22060-42 = "아, 안녕하세요……."
22060-44 = "안녕! 선생님!"
22060-45 = "……어라? 근데 선생님이 여긴 어쩐 일이야?"
22060-46 = "[s] \"안녕, 베리타스의 호출을 받았거든. 게임개발부도?\""
22060-47 = "응! 마키가 뭔가 재미있는 걸 발견했다길래!"
22060-49 = "혹시 게임을 만드는데 영감을 주지 않을까 싶어서요."
22060-50 = "중요한 이벤트일지도 몰라, 특별히 오늘은 유즈도 왔습니다!"
22060-51 = "네…… 조, 좋은 아이디어를…… 얻을 수만 있다면…… 여기까지 오는 건…… 좀……"
22060-52 = "……많이, 힘들긴 했지만……."
22060-53 = "조금만 더 가면 돼! 유즈!"
22060-54 = "응! 힘내!"
22060-56 = "유즈가 쓰러지지 않도록! 아리스가 꼭 붙잡아주겠습니다!"
22060-57 = "모, 모두 고마워……."
22060-58 = "[s] \"좋아, 그럼 빨리 들어가 볼까?\""
22060-63 = "아! 왔나 보다! 들어와!"
22060-71 = "우리 왔어!"
22060-72 = "중간에 합류한 새로운 파티 멤버. 선생님도 함께입니다."
22060-74 = "아, 마침 다들 늦지 않게 도착했네."
22060-75 = "안녕~ 게임개발부 친구들! 그리고 선생님까지~!"
22060-76 = "(꾸벅)"
22060-77 = "[s] \"다들 안녕.\""
22060-79 = "그래서 새로 발견했다는 게 뭐야? 하레 선배."
22060-80 = "아, 그거라면……"
22060-81 = "이거야."
22060-91 = "(하레가 보여준 물건은 다소 기묘하게 생긴 로봇이었다.)"
22060-92 = "(그것도 하나만 있는 것이 아니라, 이미 베리타스의 부실 이곳저곳에는 총 다섯 대의 로봇이 놓여있었다.)"
22060-93 = "[s] \"이건…… 로봇, 인가? 어디서 난 거야?\""
22060-95 = "모두 밀레니엄 학구 외곽에서 발견한 물건입니다."
22060-96 = "게다가 여기 있는 게 전부가 아니야. 선생님. 우리가 갔던 외곽 지역엔 못해도 스무 대는 더 있더라고."
22060-97 = "[s] \"어째 생긴 게…….\""
22060-98 = "꼭 깊은 심해에서 살다가 바닷가로 떠밀려온 대왕오징어 같지?"
22060-99 = "뭐, 겉모습으로만 본다면 로봇이라고 하지 못할 것도 없긴 하지만……."
22060-100 = "그래도 이상하지? 여태까지 밀레니엄에서 만들어진 드론 중에 이렇게 생긴 물건은 없지 않았어?"
22060-101 = "제법 개성적인 생김새이긴 해요."
22060-102 = "이걸 두고 개성적이라고 해야 할지…… 어째 조금……."
22060-107 = "[ns] (개성적이라기보다는, 기괴하다는 느낌이…….)"
22060-108 = "까, 깜짝 놀랐다! 어쩐지 생각한 거랑 엄청 다른데?"
22060-110 = "코미디 장르를 기대하면서 버튼을 눌렀더니…… 갑자기 호러 장르가 튀어나왔다는 느낌……?"
22060-111 = "정말 밀레니엄에서 만들어진 로봇……인 걸까?"
22060-112 = "상태는 어때요? 하레 선배."
22060-113 = "작동 정지 상태……? 그럼 혹시 잘만 하면 다시 작동시킬 수 있을까요?"
22060-115 = "…………."
22060-117 = "그거라면 우리 쪽에서도 이미 만져봤어."
22060-118 = "기체의 표면은 상처 하나 없이 멀쩡해서, 혹시 다시 움직일 수 있나 살펴봤거든."
22060-119 = "하지만 아무것도 찾을 수가 없던 거 있지?"
22060-120 = "[s] \"아무것도?\""
22060-121 = "네, 여기 있는 물건들 전부 전원 버튼은 물론. 외부로 연결할 수 있는 연결 포트조차 찾지 못했습니다."
22060-122 = "그 이전에 아예 내부를 열어볼 수 있는 이음새조차 보이지 않아."
22060-123 = "이래서야 작동하지 않는 게 단순 전원 문제인지, 아니면 소프트웨어적인 문제가 있는 건지."
22060-124 = "하다못해 정말로 고장이 난 게 맞긴 한 건지. 아예 알 수가 없어서……."
22060-130 = "그래서 선생님을 부른 거야."
22060-131 = "네, 혹시 위험한 물건이라고 판단되면 샬레의 도움을 받을까 했습니다."
22060-135 = "그런 의미에서 게임개발부를 같이 부른 건…… 좀 아니었다 싶지만 말이야. 마키."
22060-136 = "에헷~ 뭐, 겸사겸사란 걸로~ 신기한 건 다 같이 보는 쪽이 재미있잖아?"
22060-141 = "…………."
22060-146 = "어때, 선생님? 뭔가 알 수 있겠어?"
22060-147 = "[s] \"……글쎄. 잘 모르겠는데.\""
22060-148 = "아아~ 틀렸나~ 선생님이라면 혹시 알지도~? 라고 생각했었는데……."
22060-149 = "역시 이런 괴상한 물건이라면 히마리 부장이 제일 빠삭할 텐데…… 부장, 오컬트라든가 그런 괴상한 거 좋아했고."
22060-150 = "오컬트라, 으음……."
22060-151 = "아니면 치히로 부부장이 파바밧! 하고 순식간에 정보를 찾아준다거나?"
22060-152 = "자리에 없는 사람을 찾아도 어쩔 수 없으니까요."
22060-153 = "자리에 없다고 할까……. 히마리 부장의 경우엔 아예 얼굴을 본 것조차 오래됐지만."
22060-155 = "……아."
22060-159 = "응? 아리스? 왜 그래?"
22060-162 = "아리스……"
22060-163 = "아리스……… 이거, 본 적이 있습니다."
22060-164 = "아리스 쨩……?"
22060-166 = "이건……."
22060-180 = "어?! 불 들어왔는데?!"
22060-181 = "뭐?"
22060-182 = "어?! 뭐야뭐야?!"
22060-188 = "이 소리는…… 언니?"
22060-189 = "언니 가방에 들어 있던 게임기 소리 아냐?"
22060-190 = "뭐?"
22060-196 = "어, 진짜네? 이제까지 아무리 전원을 눌러도 작동하지 않던 게? 왜?"
22060-198 = "자, 잠깐만 얘들아. 아리스 쨩의 상태가…… 이상해."
22060-199 = "아리스……?"
22060-200 = "………………"
22060-204 = "<<<나의………>>>"
22060-206 = "[ns] \"응? 아리스?\""
22060-208 = "<<<나의 소중한……… >>>"
22060-211 = "\"………기동 준비.\""
22060-212 = "…………어? 아리스?"
22060-221 = "우와왓! 뭐야?! 갑자기 왜 움직이는 거야?! 코타마 선배. 뭐 했어?!"
22060-222 = "아닙니다. 마키. 저는 아무것도……."
22060-223 = "……잠깐 조심해! 뭔가 느낌이 이상해!"
22060-225 = "<<<나의 소중한……… □□여.>>>"
22060-227 = "[ns] \"대체 이건……\""
22060-229 = "\"……코드네임 <AL-1S> 기동 완료.\""
22060-236 = "\"현 시간부로 프로토콜 ATRAHASIS를, 실행합니다.\""
22060-237 = "[ns] \"……!\""
