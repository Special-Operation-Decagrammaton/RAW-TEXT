[translation]
2001503-1 = "멋진 레이디가 되고 싶어!"
2001503-2 = "(카에데의 초대를 받아, 수행부의 부실을 방문했다.)"
2001503-3 = "앗! 선생님! 어서 와!"
2001503-4 = "[s] \"그래서 좋은 걸 발견했다니 뭐야?\""
2001503-5 = "응! 선생님! 나, 이래 봬도 매일 같이 멋진 레이디가 되기 위해 단련에 단련을 거듭하고 있잖아?"
2001503-6 = "얼마 전엔 카레에서 피망을 남기지 않고 다 먹는 데 성공했고!"
2001503-7 = "[s] \"카에데, 노력했구나!\""
2001503-8 = "에헤헷! 그래서 이번엔 또 멋진 레이디가 되기 위해 새로운 방법이 뭐 없을까 고민하다가."
2001503-9 = "마침 생각난 김에 인터넷으로 검색해봤거든."
2001503-10 = "[s1] \"과연, 인터넷 검색인가……!\"\n[s2] \"카에데는 요즘 아이구나!\""
2001503-11 = "응~ 그치? 좀 더 칭찬해도 좋다구~? 하여간 그렇게 검색해봤더니 말이야~!"
2001503-12 = "응~ 그치? 좀 더 칭찬해도 좋다구~? 하여간 그렇게 검색해봤더니 말이야~!"
2001503-13 = "멋진 레이디란, 그 어떤 상황에서도 당황하지 않고 여유를 가진 사람을 말하는 거라지. 뭐야?!"
2001503-14 = "[s] \"그런……가?\""
2001503-15 = "후! 후! 후! 그런데 놀랍게도 마침! 나! 그런 거에 엄청 자신 있거든!"
2001503-16 = "어떤 상황에서도 당황하지 않고 평정을 유지하는 수행부의 마스코트! 그게 바로 나야! 선생님!"
2001503-17 = "핫?! 그렇다는 건 설마……… 나, 눈치채지 못한 사이에 이미?!"
2001503-18 = "[s] \"그럼 카에데가 말했던 세기의 대발견이라는 게…….\""
2001503-19 = "맞아! 선생님! 난 이미 멋진 레이디가 된 걸지도 몰라!"
2001503-20 = "[s] \"과연! 그런 결론이란 말이지!\""
2001503-21 = "하지만 역시 이런 건, 나 혼자서 말해봐야 증명할 수 없는 거잖아?"
2001503-22 = "그래서 오늘 이렇게 선생님을 부른 건, 내가 그 멋진 레이디가 되었다는 걸 보여주기 위해서야!"
2001503-23 = "자! 선생님! 날 당황하게 해봐! 어떤 상황에서도 당황하지 않는 멋진 레이디의 모습을 보여줄게!"
2001503-24 = "선생님과 나의 일대 승부야!"
2001503-25 = "[s3] \"승부……?\"\n[s4] \"재밌어 보이니까. 좋아! 승부다!\""
2001503-26 = "응! 렛츠- 고!"
2001503-27 = "응! 렛츠- 고!"
2001503-29 = "(그리하여 카에데를 당황하게 만들기 위한 승부(?)가 시작되었다.)"
2001503-31 = "자! 선생님! 얼마든지 도전해도 좋아! 나- 절대로 당황하지 않을 거니까!"
2001503-32 = "[s] \"그럼 카에데, 오늘 선물로 가져온 딸기 쇼트케이크 말인데.\""
2001503-33 = "뭐?! 선생님! 그런 걸 가져왔던 거야?!"
2001503-34 = "[s] \"아쉽지만, 케이크 위에 놓인 딸기는 내가 먹을게.\""
2001503-35 = "따, 딸기……? 그, 그건……. 어, 엄청 중요한……… 쇼트케이크의 꽃……"
2001503-36 = "[s5] \"농담이야. 케이크는 여기에 둘게.\"\n[s6] \"하지만 카에데. 지금 당황했지?\""
2001503-37 = "……핫?! 아, 아냐! 그냥! 응! 그냥! 선생님 혼자 딸기를 다 먹어버리면 그……."
2001503-38 = "……핫?! 아, 아냐! 그냥! 응! 그냥! 선생님 혼자 딸기를 다 먹어버리면 그……."
2001503-39 = "맞아! 혹시 배탈이 나지 않을까 걱정했을 뿐이니까!"
2001503-40 = "하나도 당황, 안 했으니까!"
2001503-41 = "자! 다음! 다음이야!"
2001503-43 = "(그 뒤로도 카에데와 불꽃 튀기는 치열한 신경전(?)은 계속되었다.)"
2001503-45 = "[ns] \"카에데, 냉장고에 남아있는 푸딩 말인데.\""
2001503-46 = "어?! 냉장고에 있는 푸딩이라면, 오른쪽 맨 위 칸에 있는 <스위트 캬라멜 푸딩>?!"
2001503-47 = "그거 일부러 남겨둔 건데! 아, 으……. 아, 아니!"
2001503-48 = "서, 선생님이…… 어, 어떻게든 먹고 싶다면……. 우, 우으……."
2001503-49 = "[s] \"으, 응…….\""
2001503-51 = "[ns] \"카에데가 잔뜩 모은 보물이 담겨 있는 이 철제 상자 말인데.\""
2001503-52 = "아앗! 선생님! 그건 조심히 다뤄야 해! 엄청 귀중한 물건이 들어있으니까!"
2001503-53 = "바로 요전 번에 렛서팬더 강가에서 발견한 완전 매끈한 조약돌도 들어있거든!"
2001503-54 = "아, 모처럼이니까 한번 볼래? 대단하다구? 이제까지 본 적 없을 정도로 매끈한 게-"
2001503-64 = "[ns] \"……해서 여기까지 왔습니다만.\""
2001503-65 = "후우……. 후우……. 흐, 흥! 굉장하네! 선생님! 제법이야!"
2001503-66 = "아슬아슬하게 날 당황하게 만들 뻔했네! 물론 전혀 안 통했지만!"
2001503-67 = "[s] \"과연 안 통한 거로 치는 거구나…….\""
2001503-68 = "어쨌거나 멋진 레이디는 당황하지 않는다! 라는 설……!"
2001503-69 = "오늘 실험해본 결과! 역시 선생님! 나는 나도 모르는 새에 멋진 레이디가 되어버린 걸지도 모르겠어……! 엣-헴!"
2001503-70 = "응? 앗! 벌써 시간이 이렇게!"
2001503-71 = "[s] \"왜 그래? 카에데? 무슨 일 있어?\""
2001503-72 = "아, 응! 오늘 저녁에 TV에서 <가면 드라이버> 시리즈의 특별방송이 있다고 했거든!"
2001503-73 = "얍, 꾹!"
2001503-74 = "TV앞에 있는 모든 드라이버에게 고한다!"
2001503-75 = "<세상이 원할 때! 가면 드라이버는 반드시 운전한다!>"
2001503-76 = "올해로 기념비적인 <가면 드라이버> 15주년 신 시리즈 개시! 그걸 위한 특별 히어로쇼 개최 예정! 현장에서 직접 <가면 드라이버>를 만나볼 기회! 지금 당장 예매하세요!"
2001503-80 = "!!"
2001503-81 = "우……."
2001503-82 = "[s] \"……우?\""
2001503-83 = "우와아아아앗!!"
2001503-84 = "서, 선생님! <가면 드라이버>의 특별 히어로쇼래! 직접 가면 드라이버를 만날 수 있다니!"
2001503-85 = "예매! 예매해야 해!"
2001503-86 = "………!"
2001503-87 = "우와앙?! 서, 선생님! 인터넷 예매 사이트가 먹통이야?! 어떡해?!"
2001503-88 = "[s] \"으응, 잠깐. 대신 예매해줄 테니까.\""
2001503-89 = "앗! 고마워! 선생님! 좋아해!"
2001503-96 = "[ns] \"그래그래……… 역시 멋진 레이디의 길은 힘든 걸지도…….\""
2001503-97 = "……우잉?"
