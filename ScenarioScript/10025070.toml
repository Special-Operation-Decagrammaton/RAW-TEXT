[translation]
10025070-1 = "제7화;한밤의 바비큐"
10025070-5 = "……그래서."
10025070-6 = "이 수상한 낚시꾼이 미유 너한테 낚시를 가르쳐 달라고 했다고?"
10025070-7 = "수, 수상하다니! 나는 수상한 사람이 아니거든?"
10025070-8 = "낚시하는 법도 제대로 모르는 낚시꾼이……?"
10025070-9 = "그건 그러니까……"
10025070-11 = "애초에 낚시를 하는 모습도 거의 보지 못한 것 같지만……"
10025070-13 = "그건 그렇지만……"
10025070-15 = "게다가 어젯밤에는 바닷가에서 수상한 주문을 외우고 있었고……"
10025070-17 = "………"
10025070-18 = "……역시 더는 숨길 수 없겠군."
10025070-19 = "사실…… 나는 전문 낚시꾼이 아니라, 인터넷에서 낚시 채널을 운영하고 있는 영상 제작자야."
10025070-20 = "혹시 인터넷에서 <백곰의 낚시 TV>라는 채널, 들어 본 적 없어?"
10025070-25 = "못 들어 본 것 같네요……"
10025070-31 = "지금 찾아보니 구독자 수가 1000명 정도 되는 것 같네."
10025070-32 = "……1000명이면 많은 거야?"
10025070-33 = "SRT 특수학원이 폐교되기 전에 공식 홍보 채널 구독자 수가 그 정도였던 것 같은데……"
10025070-35 = "지, 지금은 작은 채널이지만 곧 온라인 알고리즘을 타고 금방 성장할 예정이니까……!"
10025070-36 = "그런데 낚시하는 법을 모르는데, 어떻게 낚시 채널을 운영할 수 있어?"
10025070-37 = "그게 그러니까…… 요즈음은 인터넷이 발달해서, 직접 낚시를 하지 않더라도 여러 가지 대리 체험을 할 수 있거든."
10025070-38 = "낚시 장비 언박싱이라든가, 낚시 게임 실황이라든가, 아쿠아리움 감상이라든가……"
10025070-39 = "그럼 낚시 채널이라고 할 수 없잖아……"
10025070-40 = "그게, 안 그래도 요새 방송에서 그런 이야기를 하는 시청자들이 점차 늘어나서……"
10025070-41 = "내 낚시 실력을 두고 말싸움을 벌이다 무심코 직접 바다에 가서 대물을 낚고 인증하겠다고 공약을 걸어 버렸거든."
10025070-42 = "하지만 대물은 커녕 피라미를 낚아 본 경험도 없으니…… 단기간에 대물을 낚을 수 있는 방법을 찾다가 결국 이곳 야토우라 마을을 찾아오게 되었어."
10025070-43 = "야토우라 마을에 낚시를 잘하게 되는 비결이라도 있는 건가요……?"
10025070-44 = "그게…… 어느 수상한 사이트에서 보았는데, 이 마을에는 물고기를 마음대로 다룰 수 있는 신비한 존재가 바닷속에 살고 있다고 하더라고."
10025070-45 = "그래서 밑져야 본전이지만, 그 존재들에게 제물을 바치거나 기도를 올리면 나 같은 초보자라도 대물을 낚을 수 있지 않을까 싶어서……"
10025070-52 = "……결국 어제의 그 주문은 풍어를 기원하는 기도 같은 것이었군요."
10025070-53 = "신비한 존재들이 물고기를 몰아준다 하더라도, 낚시를 못하면 무슨 소용이야? 물고기를 낚는 건 결국 스스로의 몫이라고."
10025070-55 = "그, 그래서 다른 어부들에게 낚시를 가르쳐 달라고 했지만, 모두 거절을 당해서……"
10025070-56 = "부탁이야. 이대로 돌아갔다가는 웃음거리가 되고 말 거라고. 제발 내게 낚시하는 법을 알려줘……!"
10025070-57 = "큰 물고기라면 몰라도, 전갱이는 낚기 쉬운 생선이니까……"
10025070-58 = "전갱이 낚시라도 괜찮다면 알려드릴게요."
10025070-59 = "고마워! ……아니, 감사합니다, 스승님!"
10025070-60 = "스, 스승님……?"
10025070-62 = "그런데 하필이면 왜 밤에 다시 모인 거야?"
10025070-63 = "갑작스럽게 일정이 바뀌는 바람에 아직 저녁도 못 먹었는데……"
10025070-64 = "미, 미안…… 하지만 전갱이를 낚으려면 이 시간대가 제일 좋아서……"
10025070-65 = "해가 저물고 나면 전갱이들이 작은 물고기를 노리고 연안으로 몰려들어서, 낮보다 더 쉽게 전갱이를 낚을 수 있어."
10025070-66 = "……그렇군요! 그럼 낚싯줄은 얼마나 길게 잡으면 좋을까요?"
10025070-67 = "그, 그러니까…… 수심에 따라 다르지만 전갱이를 유인할 수 있을 정도로……"
10025070-68 = "전갱이를 유인하려면 어떻게 낚싯대를 흔들어야 하죠?"
10025070-69 = "미끼가 살아 있는 것처럼 보이도록 적절하게……"
10025070-71 = "물고기가 미끼를 물면 릴은 어떻게 감아야 하죠?"
10025070-72 = "주, 줄이 끊어지지 않을 정도로 적당히……?"
10025070-79 = "……역시 미유는 다른 사람을 가르치는 데에는 별로 소질이 없네."
10025070-80 = "워낙 성격이 내성적인 데다가 기술도 본능적으로 익히는 편이니까……"
10025070-81 = "초보자에게는 무엇이 어려운지 설명하는 것도 쉽지 않을걸."
10025070-82 = "이 상태로 한 마리라도 잡을 수 있으려나……?"
10025070-87 = "……신경 쓰지 않으려 했지만, 그 꼴은 더는 못 봐주겠군."
10025070-93 = "어르신……?"
10025070-100 = "물고기들에게 공짜 밥을 퍼줄 생각이 아니라면 낚싯대 이리 내."
10025070-101 = "물고기를 낚는 법이라면 내가 직접 가르쳐 줄 테니."
10025070-102 = "하, 하지만 저번에는 외지인을 가르쳐 줄 시간은 없으시다고……"
10025070-103 = "흥…… 어딘가의 외지인이 귀찮은 일을 다 해치워 버려서, 남는 시간에 오지랖을 부리는 것뿐이니 신경 쓰지 마."
10025070-104 = "자, 그 비싼 낚싯대는 내버려 두고 이걸 써."
10025070-105 = "어라, 이 낚싯대는 릴이 없네요? 게다가 엄청나게 가벼워……"
10025070-106 = "초보자에게는 구조가 간단한 민장대만 한 것도 없지. 자, 한 번 멀리 던져 봐."
10025070-111 = "봉돌이 가라앉기 시작하면 미끼가 살아있는 것처럼 해류를 따라 천천히 낚싯대를 움직이다가……"
10025070-116 = "지금이다, 당겨!"
10025070-121 = "우왓, 엄청나게 끌어당기고 있는데요?"
10025070-122 = "바늘이 빠지지 않도록 같은 방향으로! 상대가 지칠 때까지 버티는 거야!"
10025070-123 = "앞으로 조금 더………"
10025070-130 = "……잡았다!"
10025070-132 = "우와, 엄청나게 큰 녀석인데?"
10025070-133 = "이렇게 큰 전갱이는 처음 봤어……"
10025070-135 = "대, 대단해…… 내 손으로 직접 물고기를 잡았어……!"
10025070-137 = "감사합니다, 어르신!"
10025070-138 = "겨우 전갱이 가지고 호들갑을 떨기는……"
10025070-139 = "여하튼, 앞으로도 그렇게 계속 스스로의 한계를 인지해 나가면서 싸우면 되는 거야."
10025070-141 = "흔히들 낚시는 바다와의 싸움이 아니라, 스스로와의 싸움이라고 하니까—"
10025070-147 = "윽……"
10025070-148 = "눈치 없기는, 바보 사키."
10025070-149 = "꼭 이렇게 좋은 분위기에 부끄러운 소리로 초를 쳐야겠어?"
10025070-150 = "……부, 불가항력이잖아! 벌써 점심을 먹은 지 한나절이 넘게 지났고……"
10025070-152 = "그러고 보니 벌써 저녁 시간이 한참 지났네요."
10025070-153 = "아까 저희가 잡은 전갱이도 더해서 다 같이 바로 요리해 먹을까요?"
10025070-154 = "나는 찬성!"
10025070-156 = "나도…… 찬성이야."
10025070-158 = "후후, 이 전갱이를 어떻게 먹어야 잘 먹었다고 소문이 날까?"
10025070-159 = "회로 먹는 것도 좋지만 구이도 나쁘지 않을 것 같고……"
10025070-161 = "……고작 전갱이만 구워 먹어서 성이 차겠어?"
10025070-167 = "자, 이것도 가져가서 곁들여 먹어."
10025070-169 = "……이건?"
10025070-170 = "새벽 조업 때 같이 잡힌 잡어들이야. 상품성은 좀 떨어지지만, 맛은 괜찮을 거야."
10025070-171 = "가, 감사합니다……"
10025070-172 = "우와…… 고등어에 농어, 조개, 심지어 문어까지……?"
10025070-173 = "이, 이렇게 비싼 해산물을 잔뜩 받아도 괜찮은 걸까요……?"
10025070-175 = "비싼 것도 밖에서 사 먹을 때나 그런 거지, 이 마을에서 잡어는 처치 곤란일 정도로 넘쳐난다고."
10025070-176 = "그러니 부담 갖지 말고 편하게 가져가."
10025070-178 = "감사합니다!"
10025070-187 = "우와…… 석쇠에 올리자마자 맛있는 냄새가 잔뜩 나……"
10025070-188 = "생선 특유의 이 감칠내는…… 정말 참기가 어렵네!"
10025070-197 = "저기, 여기서 멋대로 불 피우시면 안 되거든요……?"
10025070-198 = "[s] \"뭔가 맛있는 냄새가 나네.\""
10025070-200 = "아, 선생님이랑…… 아침에 보았던 발키리 학생이네."
10025070-201 = "그보다 여기서 불 피우면 안 되었던 거야?"
10025070-202 = "어촌계의 허가를 받으면 큰 문제는 없지만…… 아, 어르신이 여기 계시니 상관없겠네요."
10025070-209 = "[ns1] \"안 그래도 뭔가를 구워 먹는 것 같아서……\"\n[ns2] \"매점에서 몇 가지 부재료를 더 가져왔어.\""
10025070-212 = "부재료?"
10025070-213 = "어디 보자, 가지랑 버섯. 버터와 마늘…… 그리고 레몬?"
10025070-214 = "기름진 버터와 알싸한 마늘로 조미된 생선에…… 레몬으로 마무리를 하면……"
10025070-215 = "무조건 맛있을 게 분명하잖아!"
10025070-216 = "뭐하고 있어, 모에! 빨리 생선 위에 버터 올려!"
10025070-217 = "안 그래도 서두르고 있거든? 보채지 좀 마!"
10025070-219 = "후후, 자리가 무르익는 것 같으니 나도 가지고 온 비장의 안주를 꺼내야겠군."
10025070-220 = "비장의 안주……? 그게 뭔데?"
10025070-221 = "바로…… 말린 쿠사야지."
10025070-223 = "으악…… 어르신, 이런 장소에 쿠사야를 가지고 오면 어떻게 해요!"
10025070-224 = "쿠사야가 뭐 어때서? 구워 먹는 생선이라면 쿠사야만 한 것도 없다고."
10025070-225 = "하지만 쿠사야는 냄새나고…… 다른 염장 생선에 비하면 맛도 별로 없잖아요?"
10025070-226 = "……뭐? 쿠사야가 맛이 없다는 건 제대로 안 먹어봐서 그런 거야!"
10025070-227 = "이 기회에 내가 한 번 직접 구워 줄 테니, 먹어보라고."
10025070-232 = "윽, 냄새…… 열을 가하니까 냄새가 더 심하게 나잖아요!"
10025070-233 = "익숙해지면 이 정도의 냄새는 평범한 축이야. 호들갑 떨기는……"
10025070-239 = "으으…… 쿠사야의 향이 너무 강해서 다른 채소에서도 비린내가 나는 것 같아……"
10025070-240 = "이 파멸적인 향기…… 너무 강렬해서 한 입만 먹어도 한동안 몸에서 비린내가 빠지지 않을 것 같아……"
10025070-241 = "하지만 그렇기에 더욱 파멸적일지도…… 하아, 하아……"
10025070-242 = "……너, 그 쿠사야 먹을 거면 오늘 같은 침대 쓸 생각하지 마."
10025070-243 = "……야박하게 구네. 냄새가 그렇게 신경 쓰이면 함께 익숙해지면 되는 거 아냐?"
10025070-245 = "자, 사키도 한 입 먹어봐."
10025070-246 = "으악, 저리 치워!"
10025070-248 = "(이후, 심야의 바닷가에서 다 같이 생선을 구워 먹으며 즐거운 한때를 보냈다.)"
