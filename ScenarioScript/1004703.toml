[translation]
1004703-1 = "당신에게 보여주고 싶은 것"
1004703-2 = "아, 여기. 선생님."
1004703-3 = "[s] \"그래서 치세가 보여주고 싶은 게 있다고?\""
1004703-4 = "응, 굉장한 풍경……."
1004703-5 = "뭔가, 잔뜩 반짝이고 있어서-"
1004703-6 = "선생님도 꼭 봤으면 해서-"
1004703-7 = "응, 이럴 게 아니라."
1004703-8 = "가자- 선생님."
1004703-12 = "여기- 이쪽이야~"
1004703-27 = "[ns] \"꽤 먼 곳까지 걸어왔는데 이곳에 대체 무엇이…….\""
1004703-28 = "선생님, 자, 여기야."
1004703-32 = "……."
1004703-33 = "[s] \"이건…… 거북이? 아니, 거북이 군단……?\""
1004703-34 = "(그곳에 있는 건 꽤나 많은 숫자의……. 아니, 그야말로 군단이라 불러도 손색이 없는 거북이 떼였다.)"
1004703-35 = "(아무래도 갯바위 너머에 마련된 이곳은, 거북이들이 단체로 잠시 쉬어 가는 쉼터 비슷한 곳인 모양이었다.)"
1004703-37 = "굉장하지~?"
1004703-38 = "[s] \"그, 그러게…….\""
1004703-39 = "해변 이곳저곳을 돌아다니면서 반짝임을 찾다가-"
1004703-40 = "마침 발견한 장소야."
1004703-44 = "으음~ 이런 곳에 거북이 씨들이 잔뜩 모여 있다는 건……."
1004703-45 = "다들 용궁에서 찾아온 걸까?"
1004703-46 = "[s] \"……용궁이라니?\""
1004703-47 = "거북이 씨들은 원래 다들 용궁에서 찾아오는 거잖아?"
1004703-48 = "다 같이 이렇게 바다에 흔들흔들~ 헤엄쳐서-"
1004703-49 = "용궁에서 바다 밖으로 찾아온 거북이 씨는-"
1004703-50 = "나중에 은혜를 입은 사람에게, 감사하다면서 보답으로 용궁으로 데려가 준대-"
1004703-51 = "[s] \"아, 그건 좀 메르헨틱한 이야기……\""
1004703-52 = "그렇게 용궁으로 데려가서 강제로 선물을 강매한다고, 니야 부장이 그랬어."
1004703-53 = "[s] \"으, 으응……?\""
1004703-54 = "즉 여기 있는 거북이 씨들은 전부……."
1004703-55 = "용궁의 보물상자를 강매할, 어리숙한 사람을 찾고 있는 걸지도-"
1004703-56 = "[s] \"순식간에 엄청난 광경이 되어버렸어!\""
1004703-58 = "아, 거북이 씨- 움직인다~"
1004703-59 = "선생님, 어때~? 모두가 햇빛을 받아 반짝반짝-"
1004703-60 = "거북이 씨들의 등껍질이 전부 반짝이고 있어."
1004703-61 = "[s] \"그러게, 꽤 장관인걸.\""
1004703-62 = "응. 이 풍경을- 선생님에게도 보여주고 싶었어."
1004703-63 = "굉장하고, 내 마음에 들어서."
1004703-64 = "선생님이 어떻게 느낄지, 궁금해서-"
1004703-65 = "[s] \"응. 치세가 왜 보여주고 싶어 했는지 알 거 같아. 정말로……\""
1004703-70 = "아."
1004703-71 = "[s] \"아, 치세? 괜찮…….\""
1004703-74 = "[ns] \"자, 잠깐?! 치세 님?! 그, 옷, 옷이 말이지……?!\""
1004703-75 = "[wa:1000]― 선생님? [wa:1700]왜 그래?"
1004703-77 = "― 얼굴이 [wa:800]빨간데-?"
1004703-80 = "[ns] \"나는 괜찮은데, 그것보다 치세의 수영복이…….\""
1004703-81 = "[wa:750]― 괜찮다면, [wa:1600]상관없지만-"
1004703-83 = "― 그보다 선생님 [wa:2750]여기 봐봐. [wa:1550]여기."
1004703-86 = "[wa:850]― 거북이 씨의 [wa:750]등껍질은~"
1004703-88 = "― 엄청 딱딱한데-"
1004703-91 = "― 사실 [wa:500]꼬리 부분은,"
1004703-93 = "[wa:50]― 말랑말랑해. [wa:2950]말랑말~랑 [wa:1650]"
1004703-96 = "[wa:1150]― 어때? [wa:1650]선생님도 만져볼래?"
1004703-98 = "― 말랑말랑하다구."
1004703-101 = "― 선생님? [wa:2000]여기야- [wa:1700]여기?"
1004703-104 = "[ns] \"아니, 보고 싶지만, 지금은 살짝 곤란하다고나 할까!\""
1004703-105 = "[wa:950]― 지금은 살짝 곤란해……?"
1004703-107 = "― ……왜? [wa:1550]어째서? [wa:1550]선생님~?"
1004703-110 = "(그 뒤로 어떻게든 무사히 치세의 수영복을 고쳐주는 데 성공했다.)"
1004703-112 = "[ns1] \"자, 이걸로 끝!\"\n[ns2] \"큰일이 되기 전에 수습했다!\""
1004703-115 = "앗, 옷, 풀려 있었구나. 몰랐어."
1004703-116 = "고마워~ 선생님."
1004703-117 = "방금~ 선생님의 얼굴."
1004703-118 = "귀여워서 재미있었어~"
1004703-119 = "[s] \"뭐…… 치세가 즐겁다면, 그걸로 됐지만…….\""
1004703-120 = "응~ 오늘은 즐거운 일이 잔뜩이네~"
1004703-121 = "[s] \"그럼, 이 광경이 혹시 치세가 찾던 반짝임이야?\""
1004703-122 = "응? 글쎄~"
1004703-123 = "……분명 이 풍경도 반짝이고 있지만."
1004703-124 = "응, 내가 찾고 있는 거랑은 조금 다를지도-"
1004703-125 = "하지만 즐거웠으니까 괜찮아."
1004703-126 = "[s] \"그래? 그럼 다행이네.\""
1004703-127 = "응~!"
1004703-129 = "(그 뒤로도 잠시 동안 거북이들이 모여 있는 쉼터에서 치세와 함께 시간을 보냈다.)"
