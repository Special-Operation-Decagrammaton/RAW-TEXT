[translation]
1011705-1 = "걸 온 앤 어드벤처"
1011705-2 = "(일단 히카리가 있다는 곳으로 향했다.)"
1011705-8 = "[ns] \"오늘은 뭐 하고 있어, 히카리?\""
1011705-10 = "선생님- 히카리 지금 왕 위험-"
1011705-14 = "[ns] \"하지만 주변에 아무것도 없는데……\""
1011705-15 = "선생님- 여기는 지금 용암지대야-"
1011705-16 = "하얀색 부분은 바위- 안전 구역-"
1011705-17 = "나머지는 전부 용암- 빠지면 사망-"
1011705-21 = "[ns1] \"아앗……!\"\n[ns2] \"그러고 보니, 나도 이러고 놀았었던 기억이……!\""
1011705-24 = "선생님- 거기 지금 용암."
1011705-25 = "빨리 대피해야 해-"
1011705-28 = "(히카리의 말을 듣고 황급히 하얀 보도블록 위로 올라왔다.)"
1011705-30 = "잘했어- 목숨을 건졌어-"
1011705-31 = "이제 저쪽 사거리까지 살아남아야 해- 알았지-?"
1011705-32 = "[s] \"좋아. 한번 해보자고.\""
1011705-39 = "빨간 곳은 하늘섬이니까 세이프-"
1011705-40 = "떨어지면 아웃-"
1011705-44 = "[ns] \"큭, 여기에는 빨간 블록이 없는데……!\""
1011705-45 = "저 가게 앞에- 빨간 양탄자 보여-?"
1011705-46 = "저기 밟으면 생존-"
1011705-47 = "[s] \"내가 저기까지 뛸 수 있을까?\""
1011705-48 = "선생님- 못 뛰면 끝이야-"
1011705-49 = "[s] \"큭……! 해주겠어!!\""
1011705-57 = "[ns] \"우, 우왓!\""
1011705-61 = "어이쿠!"
1011705-62 = "[s] \"죄, 죄송합니다……!!\""
1011705-63 = "뭐, 뭐 하시는 거예요……? 들어가시려고요?"
1011705-64 = "[s] \"아…… 아뇨, 그게……\""
1011705-69 = "빨간색-"
1011705-70 = "빨간색 안 밟으면 죽어-"
1011705-74 = "여기는 하늘섬이야- 빨간색만 밟아야 살 수 있어-"
1011705-75 = "엑?"
1011705-76 = "아……"
1011705-77 = "아하, 뭔지 알겠구만."
1011705-78 = "나도 어릴 때 많이 했었지. 모험 놀이."
1011705-79 = "허허, 그럼 떨어지지 않게 조심해요~"
1011705-84 = "[ns] \"……부, 부끄러워졌어……\""
1011705-85 = "선생님- 부끄러움은 한순간-"
1011705-86 = "생존이 더 중요해-"
1011705-87 = "[s] \"그건 그렇긴 한데……\""
1011705-91 = "[ns] \"에잇, 모르겠다. 쭉 가보자!\""
1011705-92 = "점프- 점프-"
1011705-106 = "(그렇게 동심으로 돌아가, 히카리와 한참 동안 모험을 즐기며 샬레 앞까지 도달했다.)"
1011705-108 = "후- 오늘 최고 오래 생존했어- 뉴 레코드-"
1011705-109 = "[s3] \"재밌었다…… 이제 사무실로 돌아가야지.\"\n[s4] \"그러고 보니 히카리는 어디 가던 길이었어?\""
1011705-115 = "몰라- 까먹었어-"
1011705-116 = "[s] \"그래도 되는 건가……\""
1011705-117 = "응- 노데스 클리어로 만족-"
1011705-118 = "선생님은 여덟 번 사망- 처음 치곤 잘했어-"
1011705-119 = "[s] \"고맙습니다. 처음은 아니지만요.\""
1011705-120 = "……"
1011705-121 = "하지만 히카리 더 못 움직여-"
1011705-122 = "길 끊겼어- 이동 불가."
1011705-123 = "[s5] \"그러고 보니……\"\n[s6] \"이 앞으로는 같은 색의 보도블럭 뿐이네.\""
1011705-126 = "히카리 꼼짝 못 해- 사망 확정."
1011705-127 = "지금까지 즐거웠어- 뒤는 맡길게-"
1011705-128 = "하지만 히카리를 잊지 말아줘-"
1011705-132 = "[ns] \"히카리는 내가 구한다!\""
1011705-134 = "(움직이지 못하는 히카리를 안아 들고 사무실로 향했다.)"
1011705-135 = "우와- 왕 든든-"
1011705-137 = "(히카리는 그렇게 샬레에서 또 한참 동안 놀다가 돌아갔다.)"
