[translation]
10035050-1 = "제5화;괴생물체, 안 보입니다……."
10035050-3 = "에~ 그러니까, 지금 파도풀을 이용 중이신 손님 여러분은 얼른 밖으로 나와주시기 바랍니다~"
10035050-4 = "자, 자, 밀지 말고 안전하게."
10035050-5 = "무슨 일이냐면, 그게……."
10035050-6 = "음, 나도 솔직히 긴가민가한데……."
10035050-7 = "어쨌든 도망치라구~"
10035050-13 = "아이쿠!"
10035050-14 = "미, 밀지 마시고! 천천히 대피해 주세요!"
10035050-15 = "무엇보다 안전이 중요합……"
10035050-19 = "아이쿠!"
10035050-24 = "모두 물에서 나와라!"
10035050-25 = "질서 있게 대피하도록!"
10035050-27 = "무슨 일이지? 이용객들을 왜 대피시키는 거야?"
10035050-28 = "몰라! 하지만 급한 일인 모양이야!"
10035050-29 = "그럼 일단 대피시켜!"
10035050-33 = "스톱! 스톱!"
10035050-34 = "지금 뭐 하는 겁니까?"
10035050-35 = "보고도 안 하고 이용객들을 풀에서 몰아내다니?"
10035050-36 = "긴급한 사고라도 생긴 겁니까?"
10035050-38 = "앗! 파크 사장님!"
10035050-39 = "아닙니다! 사고는 아니지만, 사고의 위험이 있어서……!"
10035050-40 = "당신들은 발키리에서 파견 온…… 아니, 그보다 사고의 위험이라고요!"
10035050-41 = "파도 생성 시설에 문제라도 생긴 겁니까?"
10035050-42 = "아니면 수질 오염 검사기 경보?"
10035050-43 = "그게……."
10035050-44 = "후부키, 내가 보고하겠다."
10035050-45 = "발키리 경찰학교에서 파견되어 현재 라이프가드로 근무 중인 오가타 칸나입니다."
10035050-46 = "금일 11시 20분경 파도풀 내에 정체 미상의 괴물체가 있다는 것을 확인했습니다."
10035050-47 = "파크 이용객들의 안전 유지에 우려가 있다고 판단되어 부득이하게 임의 조치했습니다."
10035050-48 = "괴물체?"
10035050-49 = "나 참, 그래, 어떻게 생긴 녀석이었습니까?"
10035050-50 = "물 속이라서 자세히 보지는 못했지만……."
10035050-51 = "커다란 아가리에, 굵은 네 개의 다리, 단단해 보이는 몸통."
10035050-52 = "가장 비슷한 생물은—"
10035050-53 = "악어라고 생각됩니다."
10035050-55 = "악어, 라고?"
10035050-59 = "워터파크에 악어가 어디 있나!"
10035050-61 = "히익!"
10035050-62 = "우왓, 말투가 바뀌었네."
10035050-64 = "여긴 해변이나 강도 아니고, 무려 워터파크란 말이다!"
10035050-65 = "악어는커녕 금붕어 한 마리도 안 나오는 곳이라고!"
10035050-66 = "발키리에서 파견 왔다고 해서 기대했더니만, 오히려 영업 방해를 하다니!"
10035050-67 = "저는 본 대로 보고했습니다."
10035050-68 = "제가 거짓말이라도 한다는 말씀이십니까?"
10035050-69 = "히, 히익! 무, 무섭게 쳐다보지 마! 아, 아니, 말게!"
10035050-70 = "자, 자네가 헛것이라도 본 거겠지!"
10035050-71 = "그딴 말도 안 되는 이유로 손님들을 불안에 떨게 만들고, 대피시켰단 말이야!"
10035050-72 = "하수구의 악어 같은 도시 괴담이라도 믿는 건가?"
10035050-73 = "파크에 끼친 손해는—"
10035050-74 = "[s1] \"잠깐만요, 사장님.\"\n[s2] \"진정하시죠, 사장님.\""
10035050-77 = "음?"
10035050-78 = "당신은 누군데 참견이지?"
10035050-79 = "흠? 샬레의 선생님?"
10035050-80 = "그리고 지금은 이용객으로 방문했다고……요?"
10035050-81 = "아이쿠, 이런, 몰라뵈어서 죄송합니다!"
10035050-82 = "오셨으면 진작 말씀을 주시지……좀 더 편의를 봐 드렸을 텐데……헤헤."
10035050-83 = "[s] \"괜찮습니다. 그보다, 학생들의 말을 한 번 더 생각해 주시죠.\""
10035050-85 = "[ns] \"확신 없이 행동할 만큼 책임감 없는 학생들이 아닙니다.\""
10035050-86 = "……!"
10035050-87 = "하지만 너무 터무니없는 주장이잖습니까."
10035050-88 = "[s3] \"어차피 손님들도 다 대피했으니…….\"\n[s4] \"만일을 위해 한 번 조사해 보는 게 좋지 않을까요?\""
10035050-91 = "흠, 손님들을 안심시킬 필요도 있으니까……."
10035050-92 = "그렇게 하지요."
10035050-93 = "악어는 없을 거라 생각하지만, 경비원들을 동원해 한 번 수색하겠습니다."
10035050-94 = "[s] \"받아들여 주셔서 감사합니다.\""
10035050-95 = "하지만 만약 아무것도 나오지 않는다면……."
10035050-96 = "당신들."
10035050-97 = "실외 푸드코트의 타코야키 당번으로 보내 버리겠습니다."
10035050-103 = "파크 운영에 피해를 끼쳤으니 그만한 책임을 지셔야죠?"
10035050-104 = "제, 제발 그것만은……!"
10035050-105 = "이봐! 경비와 라이프가드들을 동원해서 파도풀을 수색해!"
10035050-106 = "악어—푸흡!—가 있을지도 모르니 조심하도록!"
10035050-111 = "……감사합니다, 선생님."
10035050-112 = "도움을 주는 것이 라이프가드인데, 도움을 받고 말았습니다."
10035050-113 = "[s5] \"신경 쓰지 마.\"\n[s6] \"학생을 돕는 것이 내 역할이니까.\""
10035050-116 = "그래도 다행이네요. 저만큼이나 많은 경비원들이 수색에 나섰으니, 악어를 금방 발견할 수 있을 겁니다!"
10035050-117 = "진짜 있다면 말이지만……."
10035050-118 = "거짓말이 아니다, 후부키."
10035050-119 = "내 눈으로 똑똑히 봤다. 커다란 그림자가 물속을 유영하는 것을."
10035050-120 = "본관도 국장님을 믿습니다!"
10035050-121 = "분명 금방 발견될 거예요!"
10035050-127 = "타코야키 사세요, 타코야키…… 맛있는 타코야키입니다……."
10035050-129 = "우아악…… 내가 타코야키를 굽는 건지 타코야키가 나를 굽는 건지 모르겠어어……."
