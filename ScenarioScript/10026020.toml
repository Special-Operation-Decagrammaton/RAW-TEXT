[translation]
10026020-1 = "제2화;좋은 게 좋은 것"
10026020-2 = "그렇게 돼서……."
10026020-3 = "즉 이 자리는……. 사쿠라코 씨와 우이 씨의 화해를 위한, 뜻깊은 자리라는 거죠."
10026020-4 = "물론, 경전 사건의 당사자인 선생님도 당연히 함께 하시는 거구요."
10026020-5 = "……이해되시죠? 선생님?"
10026020-6 = "[s] \"………….\""
10026020-8 = "[ns1] \"이, 일단 잘 어울리네. 응…….\"\n[ns2] \"……??? 지금 걸로 뭘 이해하라는……?\""
10026020-11 = "후후……. 역시 좀 더 자세한 설명이 필요하겠네요."
10026020-12 = "이곳은 시스터후드가 트리니티 근해의 섬에서 발견했던 유적지……."
10026020-13 = "어떤 곳인지, 목적이 무엇인지. 지금까지 몇 번이나 조사와 연구 시도가 있었지만."
10026020-15 = "시스터후드조차 해독하기 어려운 고문자나 유적의 형태 탓에 줄곧 방치되고 있었거든요."
10026020-17 = "그러니 여기 계신 우이 씨의 뛰어난 고문자 해독 능력과 고고학 지식을 바탕으로……."
10026020-18 = "이곳의 정체를 밝혀내면 되는 거예요! 그러면 모두에게 해피엔딩~♡"
10026020-19 = "……그런 이야기랍니다. 선생님. 충분한 설명이 되셨을까요?"
10026020-20 = "[s3] \"……과연. 그런 약속이구나.\"\n[s4] \"대충은 이해한 것 같기도…….\""
10026020-23 = "하, 하나코 씨……. 그런데 어째서 모두 수영복……. 섬에서 유적지를 연구하는 임무인데 굳이 수영복일 필요는……."
10026020-24 = "게다가 하나코 씨는 어딘가 수영복……이라기에는, 조금 다른 것 같기도……."
10026020-26 = "어머? 히나타 씨. 그런 사소한 건 넘어가죠♡"
10026020-27 = "사소할 리가 없잖아!!"
10026020-28 = "코하루 쨩?"
10026020-29 = "뭐야, 이거! 갑자기 출동이라느니 이상한 소리를 하고 데려온 데가 이상한 섬이고!"
10026020-30 = "나는 왜 온 거야? 영문을 모르겠거든?!"
10026020-31 = "응…… 그치만 코하루 쨩과 저는 여름 바다에 놀러도 못 갔으니…… 그게 계속 신경이 쓰였거든요."
10026020-32 = "그래서 이번 기회엔 반드시 코하루 쨩도 같이 놀았으면 해서……."
10026020-33 = "역시 놀러 온 거였어?!"
10026020-34 = "아니면 정의실현부의 엘리트로서, 모두를 감시하기 위해……라는 건 어떨까요? 그건 괜찮을 지도?"
10026020-35 = "태연하게 '이런 거면 어때?'라고 말하지 말라고! 무, 물론 그야 나는 엘리트로서 그런 사명이 있지만……!"
10026020-36 = "으으…… 그렇지만 이렇게 외딴 섬에서 수영복 차림으로 며칠이나 다 같이 함께 있는다니……."
10026020-37 = "……."
10026020-38 = "이렇고 저렇고 그런…… 서, 설마 그런 짓까지도……?!"
10026020-40 = "네?"
10026020-41 = "그 정도 이벤트는 나도 책으로만 봤는데…… 서, 설마 하나코, 넌 거기까지 노리고……!"
10026020-42 = "사, 사형!! 음란한 건 전부 사형!!"
10026020-43 = "으응. 저는 잘 모르겠는데 코하루 쨩이 지금 무슨 생각을 하고 있는지 알려주실래요?"
10026020-44 = "뭐?! 무, 뭘 알려주라는 거야?!"
10026020-45 = "음란한 거라니, 구체적으로 어떤 거죠? 자세히 알려주실 수 있나요? 기왕이면 실습도 할 수 있도록 직접 알려주실래요?"
10026020-46 = "표, 표정이 이상해! 텐션이 높은 변태가 됐잖아!"
10026020-47 = "응, 여름이니까요."
10026020-48 = "여, 영문을 모르겠어. 오, 오지 마! 가까이 오지 마!!"
10026020-49 = "이런거죠. 에잇-♡"
10026020-53 = "으아아아-! 사, 살려줘! 선생님! 으아아- 잘못했어요- 용서해 주세요……."
10026020-54 = "[ns] \"다들 즐거워 보이네.\""
10026020-55 = "아니, 대체 왜……. 왜 이렇게 된 거지……. 이게 무슨 상황이야……."
10026020-56 = "난 그저 진실을 밝히려 했을 뿐인데……. 왜 이런 뙤약볕 아래까지 끌려 나와서는……."
10026020-57 = "옷도……. 관심 없어서 알아서 해 달랬더니 이, 이런……. 이런 꼴의 옷을……."
10026020-61 = "아닌가……? 어쩌면……. 이건 기회일지도……. 여기라면……."
10026020-62 = "시스터후드……. 그 전신인 성도회 유적의 정체를 밝혀내서 부정할 수 없는 증거를……."
10026020-63 = "……음? 뭐라고 하셨나요? 우이 씨? 아니……."
10026020-64 = "코.제.키.선.배?"
10026020-65 = "히, 히이이이! 가, 갑자기 튀어나오지 좀 마세요. 놀랐잖아요!?"
10026020-66 = "아, 아무것도 아니에요……! 그냥 혼잣말이었어요!!"
10026020-68 = "그, 그래도 이걸로 모든 게 잘 해결될 수 있는 거니까요! 사쿠라코 님도 허락해 주셨고……."
10026020-69 = "함께 힘내서 조사해요! 우이 씨라면 하실 수 있어요!"
10026020-70 = "히나타 씨……."
10026020-71 = "네, 맞아요. 우이 씨라면 해내실 수 있을 거라 믿고 있어요! 저도……. 미력하나마……."
10026020-72 = "우이 씨의 옆에서! 있는 힘껏 도울 테니까요!!"
10026020-73 = "키에에엑! 쿨럭, 쿨럭!!"
10026020-75 = "……!? 우, 우이 씨!? 갑자기 왜 그러시나요, 우이 씨……!?"
10026020-76 = "그, 그만! 그런 순진무구한 분위기! 아무것도 모른다는 해맑음!!"
10026020-77 = "나는 여기까지 와서도 뒤를 캘 생각이나 하고 있었는데……! 당신은……!!"
10026020-79 = "부담스러워……. 너무 가까이는……. 태생적으로 무리……!!"
10026020-80 = "네, 네?!!? 태생적으로 무리!?!?"
10026020-81 = "아, 아니. 히나타 씨가 나쁘다는 게 아니라……. 이건 그러니까……. 크윽……."
10026020-82 = "……아무튼 절대 히나타 씨 잘못은 아니에요. 이건 전적으로 제 쪽의 문제. 믿어주세요……."
10026020-83 = "하아, 하아…… 후우……."
10026020-84 = "……미안해요, 히나타 씨도 선생님도……."
10026020-85 = "사실 이것도 다 저 때문에 일어난 일인데……. 제가 그런 짓을 저지르지만 않았어도……."
10026020-86 = "당연히 여러분 입장도 생각했어야 했는데, 경전에 눈이 팔려서 그 생각을 못 했었네요."
10026020-87 = "[s5] \"괜찮아. 다음부터 안 그러면 되지.\"\n[s6] \"실수 정도는 할 수 있는 거니까.\""
10026020-90 = "맞아요. 사쿠라코 자매님이 딱히 저희에게 책임을 물으셨던 것도 아니고……."
10026020-91 = "선생님 말씀대로, 누구나 실수는 하는 법이니까요. 앞으로 조심하면 되죠!"
10026020-92 = "어차피 저도 우이 씨께 도움을 받았던 몸……."
10026020-93 = "이번에는 제가 도와드릴 차례라고 생각하면, 오히려 기쁘거든요!"
10026020-94 = "크으으윽!! 커흐윽흑……! 끅!!"
10026020-95 = "우이 씨……!?"
10026020-96 = "[s7] \"……과연, 의외로 둘은 상극이었네.\"\n[s8] \"사이가 좋은 것과는 또 별개의 문제로군.\""
10026020-99 = "재미있는 반응이시네요. 뭔가 알 것 같기도 하고……."
10026020-100 = "후우……. 후……."
10026020-101 = "네, 뭐……. 알겠어요. 어차피 이렇게 된 이상……."
10026020-102 = "여러분을 봐서라도……. 할 수 있는 데까지는 해 보겠어요……. 그럼 되겠죠……?"
10026020-103 = "……네! 고마워요, 우이 씨!!"
10026020-104 = "그, 그러니까 그거 좀 그만……! 그만하라고……!!"
10026020-105 = "됐으니까 진짜로 도와줄 생각이라면, 우선 여기 짐이나 좀 들어줘요……!"
10026020-106 = "……네?"
10026020-107 = "이것들은 다 무슨 짐이냐고요? 아. 이건……. <유적 조사 키트>라고 봐 주시면 될 거 같아요."
10026020-108 = "이래 봬도 연구를 위해 온 거니까요. 필요한 도구가 많거든요."
10026020-109 = "고대어 사전이라든가, 탁본을 뜨기 위한 잉크라든가, 오염물질을 제거하는 시약이라든가……."
10026020-110 = "그게 막상……. 많으면 보기보다 무거워서, 가방이 이렇게……."
10026020-111 = "윽……."
10026020-112 = "굉장하네요! 그럼 이건 제가 들어드릴게요. 우이 씨."
10026020-113 = "영-차."
10026020-115 = "……?"
10026020-116 = "뭐지? 지금 그걸……. 한 손으로 든 거예요?"
10026020-117 = "음? 네? 어……. 그럼 안 되나요? 뭔가 다른 취급 방식이라든가……."
10026020-118 = "아, 아뇨. 그냥 좀 놀라서……. 저는 양손으로도 못 들어서 질질 끌고 다니는 것들이라……."
10026020-119 = "아하. 그런 거라면 걱정하지 마세요. 이래 봬도 성당 물품 관리담당이니까요!!"
10026020-120 = "그런 문제인가……. 뭐……. 본인이 괜찮다면 다행이지만……."
10026020-124 = "……저기, 히나타 씨."
10026020-125 = "……네? 우이 씨!"
10026020-126 = "지금 하는 말……. 저도 제가 히나타 씨에게 이러면 안 된다고는 생각하지만……."
10026020-127 = "일단 일을 진행하기 위해서는 어쩔 수 없어 보여서요. 그러니까……. 나쁘게 듣지 말고 문자 그대로 이해해 줬으면 해요."
10026020-128 = "……가능하겠어요?"
10026020-129 = "네? 무, 무슨 말씀이신지……. 그거야, 물론……."
10026020-130 = "……정말 고마워요. 히나타 씨. 그럼 그……. 이제부터……. 저희……."
10026020-134 = "부담스러우니, 조금만 떨어져서 걷죠……. 2m 정도만……."
10026020-138 = "……네?"
10026020-139 = "네, 네!?!?"
10026020-141 = "진짜로 나쁜 뜻은 아니니까요……. 아까도 말씀드렸듯……. 오롯이 제 쪽 문제니까요. 네……."
10026020-142 = "그럼 먼저 갑니다……. 아무래도 짐들을 계속 들고 다닐 순 없으니, 우선 적당한 지반을 찾아, 조사 캠프를 만들게요."
10026020-143 = "거기를 거점으로 움직이죠……. 히나타 씨……. 거리를 유지하면서 따라와 주세요……."
10026020-149 = "……2m."
10026020-154 = "우, 우이 씨……? 우이 씨, 어째서……! 어째서……!"
10026020-158 = "[ns] \"적응엔 시간이 좀 걸리겠네, 둘 다…….\""
10026020-161 = "[ns9] \"코하루는 괜찮아?\"\n[ns10] \"괜히 이런 일에 말려들게 해서 미안해.\""
10026020-164 = "따, 딱히!? 괜찮아! 뭐, 이제 들어보니 아예 놀러 온 것도 아니네!!"
10026020-165 = "유적을 조사하러 온 거지? 자, 자세히는 모르겠지만…… 뭔가 중요한 일인 거지?"
10026020-166 = "그럼 정의실현부의 엘리트인 내가 도와주는 게 당연하잖아! 그럼, 그럼!"
10026020-167 = "……그치만 외딴섬에……. 수영복 차림으로…… 게다가 하나코까지……."
10026020-168 = "……."
10026020-169 = "사형--!!"
10026020-170 = "[s] \"네?!\""
10026020-171 = "이렇게 된 이상! 내가 똑바로 감시할 테니까!!"
10026020-172 = "정의실현부의 엘리트로서! 트리니티의 명예를 지키기 위해!!"
10026020-173 = "[s] \"……응원할게. 코하루.\""
10026020-175 = "(그렇게 모두가 함께 하는 섬의 유적 탐사가 시작되었다.)"
