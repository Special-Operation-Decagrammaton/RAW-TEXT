[translation]
12140-1 = "제14화;아비도스 공방전 1"
12140-8 = "그만둬!! 이 녀석들!!"
12140-9 = "……."
12140-10 = "……."
12140-12 = "카이저 이사, 위치 확인되었습니다!"
12140-14 = "이런, 이런. 우리가 학교로 찾아가려고 했는데, 여기까지 마중을 나와준 건가?"
12140-15 = "이게 무슨 짓이죠? 기업이 도시를 공격하다니, 아무리 당신들이 소유자라고 해도 이럴 권리는 없을 텐데요!"
12140-16 = "게다가 학교는 아직 저희 아비도스의 것입니다! 이것은 명백한 불법 행위! 총학생회에 불법행위를 규탄할 거예요!"
12140-17 = "……호시노 선배는 어디에 있지? 스카웃 같은 건 처음부터 거짓말이었던 거군."
12140-18 = "호시노 선배를 돌려줘! 이 나쁜 놈들아!!"
12140-19 = "……큭. 큭큭."
12140-20 = "총학생회에 규탄? 재미있는 소리를 하는군."
12140-21 = "너희들의 처지를 몇 번이나 총학생회에 탄원하지 않았던가? 그래서 그들이 움직인 적이 있었던가?"
12140-22 = "……."
12140-23 = "없을 거다. 총학생회는 지금 움직이지 못하니까."
12140-24 = "아니면, 다른 누가 도와준 적이 있었나? 다른 학원들은? 아니었을 거다."
12140-25 = "너희는 언제나 혼자였다."
12140-26 = "……."
12140-27 = "……."
12140-28 = "……."
12140-29 = "……."
12140-31 = "아비도스의 마지막 학생회 타카나시 호시노가 자퇴했기에, 아비도스 학생회는 이제 사라졌다."
12140-32 = "너희는 이제 아무 것도 아니다."
12140-33 = "……!!"
12140-34 = "!!"
12140-35 = "이제 공식적인 동아리도, 공식적인 학생회도, 자치구도 없는 아비도스는 학원도시의 학교로서 자립이 불가능하다고 판단,"
12140-36 = "이 자치구의 주인인 우리 카이저 코퍼레이션이 학교를 인수해주겠다."
12140-37 = "그래, 새롭게 세워질 학교의 이름은 카이저 사립 직업훈련 학원이 좋겠군."
12140-38 = "!!"
12140-39 = "뭐……? 무, 무슨 소리야? 그게?"
12140-40 = "무슨 헛소리야?! 학생회는 없더라도…… 아비도스엔 대책위원회가 있잖아!! 우리가 있다고!!"
12140-42 = "……. 그, 그런……."
12140-43 = "……아야네 쨩?"
12140-44 = "대책위원회는 공식적으로 허가를 받은 동아리가 아니야……."
12140-45 = "……뭐?!"
12140-46 = "만들어질 때 이미 학생회가 없었으니까……."
12140-47 = "뭐, 뭐……?!"
12140-48 = "그래. 비공인된 동아리 따위 정식 서류에 승인도 나 있지 않지. 너희는 유령에 불과하다."
12140-49 = "하지만 기뻐해도 괜찮다. 이제 그 지긋지긋한 빚갚기에서는 해방될 테니까 말야."
12140-52 = "무, 무슨 짓이야?! 약속이 다르잖아!!"
12140-53 = "어째서 아비도스를 공격하는 거야!! 어째서!!"
12140-56 = "……."
12140-57 = "아뇨. 약속은 지켰습니다. 호시노 씨."
12140-58 = "그 빚은 탕감해 드렸습니다. 확실하게 약속한 만큼."
12140-59 = "하지만 당신이 자퇴해버려서, 애석하게도 아비도스 학교에는 더 이상 공식적인 학생회가 남아있지 않은 것 같군요."
12140-60 = "……!!"
12140-61 = "우리가 왜 이런 시시한 기업의 부동산 사기 행각을 지원했다고 생각합니까?"
12140-62 = "키보토스의 자치구의 땅을 뺏어봤자, 블랙 마켓 같은 무법지구가 하나 더 늘어나는 것에 불과합니다."
12140-63 = "그런 곳이야 이 키보토스엔 시시할 정도로 많죠."
12140-64 = "하지만…… 이 아비도스에 기업이 주인인 새로운 학원이 탄생하게 된다면……?"
12140-65 = "그렇게 되면 과연 이 키보토스에 어떤 변화가 생기게 될까?"
12140-66 = "……!!"
12140-67 = "……아아. 그러나 이것은 단순한 여흥거리에 불과합니다. 호시노 씨."
12140-68 = "저희의 목표는 처음부터 당신이었습니다."
12140-69 = "당신에게 계약서를 쓰게 하는 것. 모든 권리를 이양받는 것."
12140-70 = "그 이해관계가 일치했기에 카이저와 협력했던 것뿐입니다."
12140-71 = "카이저 PMC와 종신 계약? ……그런 얘기를 한 적은 없습니다. 오해를 하셨다면 죄송하군요."
12140-72 = "당신같은 키보토스 최고급의 신비를 손에 넣어서 그런 식으로 소모할 생각은 없습니다."
12140-75 = "호시노는 연구하고 분석해서 파악한다. 즉, 실험용으로 쓴다."
12140-76 = "이것이야말로 우리들이 관측하고픈 흥미로운 실험입니다."
12140-77 = "그러니 너무 애석하게 생각하지 마시길."
12140-83 = "……."
12140-84 = "그렇구나."
12140-85 = "지금까지……."
12140-87 = "나는…… 또 어른에게 속아버린 거구나."
12140-89 = "……."
12140-90 = "…… 미안해. 모두들. 내가 다 망쳐버렸어."
12140-91 = "시로코 쨩. 노노미 쨩. 세리카 쨩. 아야네 쨩……."
12140-92 = "유메 선배……."
12140-93 = "……."
12140-94 = "미안해……."
12140-95 = "……."
12140-96 = "나는……."
12140-98 = "…………."
12140-99 = "선생님……."
12140-102 = "……."
12140-103 = "지금까지 우리들이 한 노력들은……."
12140-104 = "응? 설마 진심이었던 거냐?"
12140-105 = "몇백년 동안 빚을 갚을 셈이었다고?"
12140-106 = "적당히 하다가 포기할 때 자신은 최선을 다 했다고 변명하기 위한 핑계거리인줄 알았는데."
12140-107 = "……!!"
12140-108 = "대체 너희들은 왜 버티고 있었던 거지? 대체 왜?"
12140-109 = "……네놈들. 뚫린 입이라고 감히……."
12140-112 = "응전한다."
12140-113 = "그치만……."
12140-114 = "……싸운다고 해서…… 뭐가 달라지죠?"
12140-115 = "아야네 쨩?!"
12140-116 = "지금도 엄청난 숫자의 병력이 이쪽으로 진격하고 있어요……."
12140-117 = "설령, 싸워서 이긴다고 해도…… 그다음은…… 어떻게 해야하죠……."
12140-118 = "학교가 없어지면…… 싸우는 의미가 없어져 버려요. 학교를 어떻게든 되찾는다고 해도, 우리의 빚은 사라지지 않아요……."
12140-119 = "……아야네 쨩."
12140-120 = "아야네……."
12140-121 = "이미 거래된 땅도 돌아오지 않아요…… 호시노 선배도 없고…… 학생회도 없는 상태에서 우리 같은 비공인 동아리가……."
12140-122 = "대체 무엇을……."
12140-123 = "어째서……."
12140-124 = "어째서 우리들만……. 이렇게……. 호시노 선배……."
12140-125 = "아야네 쨩……."
12140-126 = "……."
12140-127 = "……."
12140-128 = "콰콰콰콰콰콰아아아아아앙--!!"
12140-129 = "?!"
12140-131 = "그읏-!? 북쪽에서 대규모 폭발이!"
12140-132 = "합류 중이던 브라보 소대, 포, 폭발에 휘말려서- 사라졌습니다?!"
12140-133 = "무, 뭐?!"
12140-134 = "콰콰콰콰콰콰콰콰콰아아아아아앙--!!"
12140-135 = "동쪽에서 합류 중이던 마이크 소대가!! 대량의 C4 폭발에……!!?"
12140-136 = "뭐, 뭐냐?! 여기엔 아비도스 놈들 말고 다른 놈들은 없을 텐데……?!"
12140-141 = "뭐하는 거야. 이 바보 녀석들."
12140-142 = "……?!"
12140-152 = "눈에는 눈. 이에는 이. 인정사정 보지 않고 고고하게 인외마경의 길을 걷는다."
12140-155 = "그게 수영복 복면단의 모토 아니었나?"
12140-156 = "……아, 다, 당신은?!"
12140-157 = "목표가 보이지 않고, 방법도 찾을 수 없고, 하는 일도 모조리 실패에 실패."
12140-158 = "인정 받지도 못하고, 앞으로 기다리고 있는 건 역경과 고난 밖에 없다……"
12140-160 = "그딴 게 무슨 상관이야!!!!"
12140-161 = "아, 아으……?"
12140-162 = "그런 하찮은 것 따위에 얽매여서 동료가 위기에 처했는데, 바보처럼 보고만 있겠다는 거냐!!"
12140-163 = "정말 한심하기 짝이 없군!"
12140-164 = "이야, 아루 쨩. 좀 봐 주라고. 안경 쨩은 히스테리 심한 타입이니까. 그럴 수도 있는 거야."
12140-165 = "네, 네……?!"
12140-166 = "아하하~ 그치만 귀여운 안경 쨩을 울려버린 죄는 꽤 크다고? 그러니까……."
12140-170 = "쳐 죽여버려야겠어-!!!"
12140-171 = "후후후. 후후후후후후. 저는 준비되었어요, 아루 님. 아직 폭탄은 잔뜩 있으니……."
12140-172 = "하아…… 라멘 먹으러 다시 왔다가 어째서 이런 꼴이……."
12140-173 = "매설해둔 폭약으로 적의 증원은 차단해두었다. 그 사이 적의 지휘관을 무력화시켜 지휘 체계를 와해시킨다."
12140-174 = "그러면 이 병력은 지휘체계를 상실하게 될 거다. 원래는 선도부에게 쓸 전술이었지만……."
12140-176 = "좋아. 지금부터 진정한 무법자의 싸움을 보여주지."
12140-177 = "시작해, 하루카."
12140-178 = "(꾸욱-)"
12140-179 = "콰콰콰콰아아아아아아아아아앙-!!"
12140-180 = "콰콰아아아아아아앙-!!"
12140-181 = "콰콰콰콰아아아아아아앙-!!"
12140-183 = "아, 아아아?!"
12140-187 = "자아, 협업이다! 선생!"
12140-188 = "저 [ruby=대책위원회]바보 녀석들[/ruby]에게 하드보일드가 뭔지 가르쳐 주자고!"
12140-189 = "[ns] \"응! 가자, 흥신소!\""
