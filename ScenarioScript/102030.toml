[translation]
102030-1 = "제3화;작전 준비 1"
102030-2 = "제1 거짓된 성소"
102030-3 = "아비도스 사막 지구"
102030-5 = "제1 거짓된 성소 작전 담당 오쿠소라 아야네입니다."
102030-6 = "모두들 지정된 위치로 이동하셨나요? 제1 부대, 응답 바랍니다."
102030-10 = "응, 아야네 쨩. 우리는 준비 완료야."
102030-11 = "응응! 지금 대기중이에요."
102030-13 = "네. 확인했습니다. 호시노 선배는요?"
102030-15 = "응, 아저씨도 준비 완료."
102030-16 = "그건 그렇고 저게 <거짓된 성소>라는 거지, 아야네 쨩?"
102030-17 = "네. 맞아요. 저걸 부수기 위해선…… <비나>를 이쪽으로 유인해야만 해요."
102030-19 = "그래. 그 유인을 위한 <미끼>역할은 우리 흥신소가 맡는다. 모두들 이해했지?"
102030-20 = "네, 네!! 지금부터 이 고장 난 열차를 폭주시켜서 장렬하게 산화하는 거죠?! 이, 이해했습니다! 죽을까요? 열심히 죽겠습니다!!"
102030-21 = "아하하하. 하루카 쨩, 의욕 넘치네."
102030-22 = "아니, 죽으면 안 되지……, 하루카. 제2부대는 비나의 시선을 끌어주다가 1부대와 합류해서 협공하는 역할이야."
102030-23 = "열차의 윗부분을 통해 이동해야 하는 위험한 임무니까, 다치지 않는 게 가장 중요해."
102030-24 = "흥. 가장 위험한 포지션은 우리 흥신소 68의 몫이지. 그게 바로 하드보일드라구."
102030-25 = "쿠후후훗. 엄청 재미있겠다. 롤러코스터 같은 느낌일지도?"
102030-26 = "뭐어, 말해두겠지만. 이 열차들은 우리가 마음껏 사용하다가 날려버릴 거야."
102030-27 = "나중에 딴말하기 없기야?"
102030-31 = "응, 신경 쓰지 마세요. 어차피 지금은 사용하지도 않는 고철들이니까. 게다가……."
102030-33 = "저 사막횡단열차야말로 아비도스의 몰락을 가속시킨 사업……."
102030-34 = "그게 이렇게 세계를 구하는 일에 사용될 수 있다면……"
102030-35 = "저에겐 그보다 더 기쁜 일은 없을 거예요♧"
102030-36 = "노노미 선배……."
102030-37 = "설마 이 사막횡단열차가 네프티스 그룹 소유였다니……"
102030-38 = "게다가……."
102030-42 = "자아, 자아. 이쪽은 적당히 준비 완료~"
102030-44 = "네! 샬레 컨트롤 0호, 응답 바랍니다! 제1 성소는 스탠바이 완료입니다!"
102030-46 = "네. 확인했습니다. 마키 쨩, 그쪽은 어때요?"
102030-49 = "문제없어. 그치만 한 가지만 당부하면……"
102030-50 = "비나의 입에서 발사되는 레이저는 절대로 닿지도 말아야 해."
102030-51 = "바위조차도 증발시켜버리는 초고온의 레이저라고 하니까."
102030-56 = "제2 성소는 현재 상황 어떤가요?"
102030-58 = "제2 거짓된 성소"
102030-59 = "밀레니엄 폐허 지구"
102030-61 = "응. 제2 성소의 작전 담당 이즈미모토 에이미야."
102030-62 = "지금부터 밀레니엄 폐허 군수공장 내부에 위치한 헤세드를 공략할 예정이고……."
102030-63 = "군수공장의 정면을 가로막고 헤세드가 만들어내는 무한한 병력을 저지하는 방어 부대와,"
102030-64 = "수송기로 상공 3km까지 이동해, 고공강하로 공장 중심부까지 이어진 환풍구로 침투하는 강하 부대가 준비 중이야. 그리고……."
102030-65 = "네. 강하 부대 편성 결정은 났나요? 어느 쪽이 수송기에 타는 거죠?"
102030-66 = "응…… 그게 말이지……. 문제가 조금 있어."
102030-67 = "네? 무슨 문제가……?"
102030-69 = "너 말야, 말귀를 못 알아듣는 거냐? 앙?"
102030-70 = "킥킥킥."
102030-71 = "킥킥킥킥……."
102030-72 = "으, 으음……."
102030-73 = "으…… 곤란하지 말임다……."
102030-74 = "C&C의 더블오와 정의실현부 부장이 의견을 좁히지 못하고 있거든."
102030-75 = "……."
102030-77 = "부장님. 슬슬 시간이……. 이러고 있을 때가 아닌데……."
102030-78 = "좀 있어 봐! 이 자식이 열받게 하잖아, 아오! 빡치네, 진짜!"
102030-82 = "하아…… 그쪽도 정의실현부장님을 좀 말려주시면……."
102030-83 = "아아, 그건 무리임다. 저 상태의 츠루기 선배는 아무도 말릴 수 없거든요."
102030-84 = "그런데 왜 싸우는 거야? 그냥 간단하게 더 강한 쪽이 정면을 맡으면 되는 거잖아?"
102030-85 = "아, 아스나 선배! 그건 금지어!!"
102030-86 = "아…… 망했다."
102030-92 = "……야, 너. 밖으로 나와."
102030-96 = "……킥킥킥킥킥."
102030-100 = "우와-! 싸움이다!! 엄청 재밌어졌네! 구경가자-!"
102030-104 = "하아. 결국 이렇게 되었나……."
102030-105 = "저희도 가보죠."
102030-110 = "음……"
102030-111 = "뭐 어쩔 수 없네요."
102030-118 = "에이미 양? 무슨 일이 벌어지고 있는 거죠?"
102030-119 = "……두 사람 싸우러 나가버렸어."
102030-120 = "……."
102030-129 = "헤에- 대단해. 저 정의실현부장."
102030-130 = "접근전에서 네루 선배에게 밀리지 않다니……. 처음 봤다."
102030-131 = "그 트리니티의 츠루기니까요. <트리니티의 전략병기>라는 별명도 있을 정도니……."
102030-133 = "오, 굉장하지 말임다. 츠루기 선배의 모습에 위축되지 않는 분은 오랜만에 보네요."
102030-141 = "키키킥……."
102030-142 = "키아아아아아아아-!!"
102030-147 = "크하하하-!!! 좋아, 다음은 이거다!!"
102030-160 = "아하하하- 부장 엄청 즐거워 보여."
102030-161 = "그렇군. 최근에 이런저런 일들이 있었으니…… 스트레스가 꽤 쌓여 있었던 건가."
102030-162 = "으음. 츠루기 선배도 오늘따라 텐션이 높네요."
102030-164 = "크하핫, 나쁘지 않은데?! 그치만 이게 전부는 아니겠지? 대미지는 나보다 더 많이 받았잖아?"
102030-166 = "킥킥킥…… 그딴 건……."
102030-167 = "……방금 다 나았다."
102030-168 = "……크하하핫-! 과연, 그렇게 나와줘야지!!"
102030-169 = "캬아아아아아아아-!!"
102030-170 = "잠깐! 지금 두 사람 다 뭐 하는 거야!!"
102030-173 = "앗……. 유우카……."
102030-174 = "계획대로 팀을 나누라고 했지, 누가 치고받고 싸우라고 한 거야? 애들도 아니고!"
102030-175 = "미안해요, 여러분. 이걸 말리려면 역시 유우카 쨩밖에 없을 거 같아서……."
102030-176 = "……."
102030-177 = "끄응…… 한창 재밌어지려는 타이밍에……."
102030-179 = "응? 그치만 누가 더 강한지 정하지 않으면 팀을 나눌 수 없잖아?"
102030-180 = "무슨 소리야! 강아지들도 아니고!"
102030-181 = "좋아, 그럼 두 사람!"
102030-182 = "아앙?"
102030-183 = "?"
102030-184 = "가위바위보로 정해!"
102030-188 = "뭐라고?! 그딴 걸로 정할 수가 있겠냐!"
102030-189 = "시끄러! 시간 없다고! 이대로라면 계획이 틀어지잖아."
102030-190 = "칫…… 알겠어."
102030-196 = "자…… 가위……"
102030-197 = "……바위."
102030-198 = "……보!"
102030-200 = "……."
102030-201 = "결정났네."
102030-203 = "모모이! 미도리! 유즈! 긴급 퀘스트입니다! 던전 공략이에요!"
102030-204 = "아, 알고 있으니까 너무 호들갑 떨지 마, 아리스! 중요한 작전이라고 하니까."
102030-205 = "언니…… 괘, 괜찮을까?"
102030-206 = "으, 으응…… 선생님이 여기에 최강의 팀들이 모인다고 했으니까 괜찮을지도……."
102030-207 = "네! 아리스도 들었습니다! 그러니까, 이번에는 엄청 강한 분들이 동료로 함께 싸웁니다! 그러니까 괜찮습니다!"
102030-208 = "으응……, 엄청 강한 동료들……"
102030-209 = "그중 하나가 특수부대였지?"
102030-216 = "여기가 슬럼피아인가? 꽤나 으스스한 분위기인걸."
102030-217 = "RABBIT 소대, 목표 지점에 방금 막 도착, 본대에 합류했습니다."
102030-219 = "와, 왔다! SRT야……!"
102030-220 = "아, 안녕하세요……."
102030-222 = "네. 오늘은 잘 부탁드리겠습니다, 여러분."
102030-223 = "그리고 RABBIT 3, RABBIT 4. 각자 위치를 보고해 주세요."
102030-224 = "RABBIT 3. 현재 공중 지원 스탠바이 완료. 명령 대기중. 거긴 어때, 미유?"
102030-225 = "RABBIT 4, 으, 응. 시야도 불량하고…… 바람도 남동 방향에서 35노트라서…… 별로 좋은 환경은 아니야……."
102030-226 = "그, 그래도…… 저격하는데 큰 문제는 아니니까……."
102030-232 = "이 정도면 열대성 저기압급 풍속인데 문제가 아니라고?"
102030-234 = "와, 왔다! 엄청 강한 동료 두 번째……! 게헨나의 선도부장 소라사키 히나……!"
102030-235 = "자, 잘 부탁드립니다."
102030-237 = "저격수. 지금 목표물과의 거리는 어느 정도지?"
102030-238 = "네, 네?! 저…… 저, 저요? 여, 여기요? 아…… 약 950m 정도……."
102030-239 = "화기 제원은?"
102030-240 = "RABBIT 39식 저격용 소총입니다……! 탄환은 7.62mm×53mmR을 사용하고, 그, 급탄은 5발 내부 탄창이고, 초, 총기 번호는……."
102030-242 = "저기……."
102030-244 = "……아, 미안해. 별 뜻은 없었어."
102030-245 = "유효사거리의 2배 정도 거리에서, 그것도 이런 악조건에서도 저격이 가능하다니 대단한 실력이네."
102030-246 = "네, 네……? 어, 어라……? 그, 그런가요?"
102030-247 = "으아아…… 가, 감사합니다……?"
102030-248 = "미유는 1980m에서의 저격도 성공한 적이 있습니다."
102030-249 = "……그렇겠네. 저격수의 실력만 봐도 알 수 있겠어. 아마 지금보다도 더 성장하겠지."
102030-250 = "선생님이 중요한 순간 RABBIT 소대를 의지했다는 것도, 함께 샬레를 탈환했다는 것도…… 허언이 아니었겠군."
102030-252 = "뭐, 딱히 대단한 건 아니라고 생각하지만……."
102030-253 = "그리고……."
102030-257 = "네가 바로 그 텐도 아리스인가……."
102030-258 = "(밀레니엄에서 발생했다던 그 사건의…….)"
102030-263 = "빰빠라빰빰-! 만렙 고인물이 동료로 합류했습니다!!"
102030-264 = "……."
102030-265 = "우, 우와?! 아, 아리스……!?"
102030-266 = "죄, 죄송해요! 우리 아리스 쨩이 눈치가 없어서 그만……."
102030-267 = "아리스, 선생님에게 들은 적이 있습니다! 게헨나의 선도부장님에 대해서요!"
102030-269 = "……선생님이? 나를?"
102030-270 = "(소근소근) 게헨나 선도부장은 엄청 무서운 사람이라서 마음에 안 드는 건 가차 없이 없애버린다는 소문을 들은 적 있어……."
102030-271 = "(소근소근) 무, 무서워…… 잘못하다간…… 호, 혼날지도……."
102030-272 = "아닙니다! 선생님은 선도부장님이 엄청 좋은 분이라고 하셨습니다!"
102030-273 = "그, 그런가……?"
102030-274 = "선생님이?"
102030-278 = "……. 그리고?"
102030-279 = "그리고…… 선생님이 가장 의지할 수 있는 사람 중 하나라고 하셨습니다! 엄청 믿음직하다고요!"
102030-280 = "그러니까, 선도부장님과 함께 파티를 맺을 수 있어서 무척 영광이라고 생각합니다! 아리스는 무척 기쁩니다!"
102030-281 = "음……."
102030-285 = "……아니, 아무것도 아냐."
102030-286 = "제3 성소 스탠바이 완료. RABBIT 소대, 게임개발부, 모두 대기 중. 작전 담당 확인 바란다."
102030-287 = "아, 그러고 보니 이번 작전 담당이……."
102030-292 = "제3 성소 작전 담당…… 하, 하나오카 유즈입니다……"
102030-293 = "어, 어째서 내가……."
102030-294 = "유즈 쨩, 힘내!"
102030-295 = "맞아! 이건 유즈만이 할 수 있는 작전이니까!"
102030-297 = "확인했습니다. 유즈 씨, 잘 부탁드립니다."
102030-299 = "네, 네에……. 으으……."
102030-301 = "다음화;작전 준비 2"
