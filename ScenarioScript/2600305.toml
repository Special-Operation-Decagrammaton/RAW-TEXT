[translation]
2600305-1 = "언제나 어디서나 세리나"
2600305-2 = "(업무가 많은 날이었다. 하루 종일 열 댓 곳의 건물을 오가야 하는 일이었다.)"
2600305-3 = "(아직도 세 군데가 갈 곳이 남아 있었으니, 서둘러 다음 빌딩으로 향해야 했다.)"
2600305-4 = "[s1] (엘리베이터를 타고 내려간다.)\n[s2] (계단을 통해 내려간다.)"
2600305-5 = "우우우웅-. 띵-!"
2600305-8 = "………덜커덩!! 쿠웅-!!"
2600305-9 = "아, 아. 입주자 여러분들께 사과말씀 드립니다. 현재 갑작스러운 정전으로 인해……"
2600305-10 = "[s3] (수동으로 문을 열고 나간다)"
2600305-13 = "……털푸덕!! 쿵!!"
2600305-14 = "(빠른 걸음으로 계단을 타고 내려가기 시작했다.)"
2600305-19 = "덜커덕!! 털썩-! 쿵 쿵 쿵!! 쿠웅!"
2600305-20 = "아, 아. 입주자 여러분들께 사과말씀 드립니다. 현재 갑작스러운 정전으로 인해……"
2600305-23 = "……선생님?"
2600305-24 = "선생님! 다치셨어요!?"
2600305-25 = "[s] \"……?\""
2600305-28 = "정신 차리세요, 선생님! 괜찮으세요?"
2600305-29 = "저예요, 세리나! 알아보시겠어요?"
2600305-30 = "잠시만요. 우선 다치신 곳이 있는지부터……!"
2600305-33 = "……"
2600305-34 = "……후우. 다행이네요. ……무릎이랑 팔이 까지시긴 했지만, 크게 다치진 않으셨네요."
2600305-35 = "어지러우신 건 그냥 갑작스러운 상황에 놀라셔서 그래요. 괜찮으실 거예요."
2600305-36 = "일단은 까진 무릎과 손부터 치료를 하시고……"
2600305-37 = "[s4] \"고마워.\"\n[s5] \"하나도 안 따갑네. 역시 세리나야.\""
2600305-38 = "말씀은 고맙지만, 부탁이니 제게 감사 받을 일을 그만 만들어 주세요."
2600305-39 = "……다치신 상황에서 그렇게 말 해 주셔도 하나도 안 기뻐요."
2600305-40 = "정말, 그러기에 제가 문제가 생기실 때 문자라도 달라고 그렇게 말씀을 드렸는데!"
2600305-41 = "네? 정전이랑 그건 다른 일 아니냐고요? 그게 무슨 말씀이세요!"
2600305-42 = "선생님께서 곤란하신 일이면 그게 피로든 부상이든 정전이든, 다 제 일인 거죠!"
2600305-43 = "앞으로는 좀 더 필요하실 때마다 미리 절 불러주시라고요. 그럼 이런 일도 없을 테니……"
2600305-46 = "아우, 이것 봐. 조금만 더 늦게 왔으면 상처에 흉 질 뻔 했네, 큰일날 뻔 했어……"
2600305-47 = "부리나케 달려왔으니 망정이지……"
2600305-48 = "……네?"
2600305-49 = "그걸 어떻게 알고 찾아왔냐……고요?"
2600305-50 = "……"
2600305-51 = "그, 그그, 글쎄요? 그, 그건…… 그냥 어쩌다가……? 우연히 지나가다가……?"
2600305-52 = "지, 지금 그런 게 뭐가 중요해요!? 또 말 돌리는 환자! 나쁜 버릇!!"
2600305-53 = "네? 오히려 제가 말을 돌리는 거 아니냐고요? 아, 아아, 아니거든요? 절대 아니거든요!?"
2600305-54 = "아, 아무튼!! 아무튼 앞으론 무슨 일 생기기 전에 꼭 먼저 불러주세요!"
2600305-55 = "아시겠죠? 약속이에요! 꼭 연락하기예요!"
2600305-56 = "치, 치료도 다 끝났으니 저는 그럼 이만……!"
2600305-59 = "(뭐라고 더 대꾸하기도 전에 세리나는 다시 재빨리 어둠 속으로 사라져버렸다.)"
2600305-60 = "(잠시 후 전기는 돌아왔고, 그날 일정도 모두 무사히 마무리 지을 수 있었다.)"
2600305-61 = "(하지만 이후 찾아본 그 건물의 CCTV 기록에서는, 어디서도 세리나를 찾아볼 수 없었다.)"
