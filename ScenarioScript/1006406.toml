[translation]
1006406-1 = "스트레스 해소법"
1006406-2 = "(……새해부터 키보토스 곳곳에서 벌어지는 사건을 해결하느라, 숨 가쁘게 돌아다녀야 했다.)"
1006406-4 = "선생님. 하네츠키로 공을 주고받을 때 백핸드 스매시로 치는 건 룰 위반일까요……?"
1006406-5 = "보통은 쉐이크핸드 그립으로 채를 잡기에 탁구를 치듯 스매시를 넣었더니 친구가 엄청나게 화를 내서요……."
1006406-6 = "[s1] \"대답하기 어려운 문제네…….\"\n[s2] \"일단은 함께 고민해 보도록 하자…….\""
1006406-10 = "(해결하기 어려운 고민 상담부터, 의도치 않은 시비까지 휘말리는 바람에……)"
1006406-12 = "당신 뭐야? 당신이 무슨 자격으로 남의 일에 참견하고 다니는 거야?"
1006406-13 = "내가 아르바이트 학생에게 월급으로 얼마를 주든 무슨 상관이야?"
1006406-14 = "뭐, 샬레의 선생님……?"
1006406-15 = "알 게 뭐야. 샬레의 선생님이든, 총학생회장이든, 내 사업을 방해하고 다니면……"
1006406-16 = "끔찍한 꼴을 당할 줄 알아!"
1006406-17 = "[s] \"지, 진정하시고 일단 말씀을……\""
1006406-19 = "(일을 마칠 즈음에는 완전히 녹초가 되어버리고 말았다…….)"
1006406-22 = "……어라, 선생?"
1006406-23 = "이런 곳에서 마주치다니 우연이네. 잘 지내……"
1006406-27 = "……는 것처럼 보이지는 않네. 뭔가 힘든 일이라도 있었던 거야?"
1006406-28 = "[s3] \"안녕, 카요코……\"\n[s4] \"오늘따라 지치는 일이 많이 있어서……\""
1006406-29 = "……으음, 그거 큰일이네."
1006406-30 = "……으음, 그거 큰일이네."
1006406-31 = "샬레의 선생님도 고생이 많아. 줄 수 있는 게 위로의 말뿐이라 미안하네."
1006406-32 = "[s] \"위로의 말만으로도 충분해…… 고마워.\""
1006406-34 = "[ns] \"그나저나 카요코는 어디에 가는 길이었어?\""
1006406-35 = "아, 나는 근처에서 좋아하는 밴드의 공연이 있어서."
1006406-36 = "<화악기 클럽>이라고 들어본 적 있어?"
1006406-37 = "샤미센이나 북, 고토와 같은 전통 악기로 현대식 팝을 연주하는 밴드 그룹인데……"
1006406-38 = "전통 악기로 연주하는 현대식 팝이 제법 독특해서 자주 참가하고 있어."
1006406-39 = "[s5] \"화악기로 연주하는 현대식 팝이라……\"\n[s6] \"뭔가 힐링이 될 것 같은 느낌이네.\""
1006406-40 = "응. 화악기 특유의 독특한 음색이 스트레스를 싹 풀어주는 느낌이라……"
1006406-41 = "응. 화악기 특유의 독특한 음색이 스트레스를 싹 풀어주는 느낌이라……"
1006406-42 = "저, 괜찮다면 선생도 공연에 함께 갈래?"
1006406-43 = "다른 흥신소 멤버들은 다른 볼일이 있다고 해서…… 마침 여분의 표를 갖고 있던 참이었거든."
1006406-44 = "[s7] \"응, 좋아!\"\n[s8] \"오늘의 나도 힐링이 필요하던 참이었거든.\""
1006406-45 = "후후, 다행이네."
1006406-46 = "후후, 다행이네."
1006406-47 = "그럼 이쪽으로 따라와. 공연장은 이 앞에 있어."
1006406-50 = "(이후, 카요코의 안내를 받아 화악기 공연장에 도착했지만……)"
1006406-51 = "(카요코가 말한 '힐링'의 의미는 생각과는 조금 달랐다……)"
1006406-53 = "어둠의 다크가 깔린 키보토스— 죽음의 데스를 느껴라—"
1006406-54 = "이것은 파괴의 디스트로이! 이 세상을 끝내기 위한 디 엔드—!"
1006406-60 = "(공연이 끝난 뒤……)"
1006406-62 = "아, 정말 즐거운 공연이었어……"
1006406-63 = "특히 마지막에 샤미센 연주자가 이빨로 현을 물어뜯으며, 태고를 머리로 두들겼을 때는 정말 전율이 느껴질 정도였다니까."
1006406-64 = "[s] \"으응…….\""
1006406-65 = "으음……"
1006406-66 = "혹시 선생에게는 조금 자극이 강한 공연이었으려나?"
1006406-67 = "어쩐지 공연을 보고 난 뒤에 더 지친 것 같아 보여서…… 왠지 미안하네."
1006406-68 = "[s9] \"그게 아니라……\"\n[s10] \"록 음악의 텐션에 맞추어 환호를 하다 보니 몸이 지쳐버려서……\""
1006406-71 = "[ns] \"하지만 카요코의 말처럼 스트레스는 확실히 풀린 것 같아!\""
1006406-73 = "……그렇게 말해주니 기쁘네."
1006406-74 = "하지만 녹초가 될 정도로 지쳤다는 것은 사실이니까. 오늘은 이만 샬레로 돌아가 쉬는 게 좋겠어."
1006406-75 = "……오늘도 어울려 줘서 고마워, 선생."
1006406-76 = "다음에는, 컨디션이 좋을 때 같이 공연을 보러 오자. 그럼 분명 더 즐거울 거야."
