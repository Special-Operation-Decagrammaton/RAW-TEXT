[translation]
3302-1 = "멀리 휘두르며 2"
3302-10 = "헉, 헉…… 열…… 넷!"
3302-11 = "자, 조금만 더 힘내자고요. 레이 양."
3302-12 = "앞으로 한 개만 더…… 한 개만 더하면 이번 세트도 끝이니까요!"
3302-13 = "헉…… 하나, 둘, 셋……"
3302-18 = "……열다섯!"
3302-19 = "잘하셨습니다!"
3302-20 = "그리고 앞으로 마지막 한 개!"
3302-21 = "잠깐만요! 방금 카운트가 마지막이라고 하셨잖아요?"
3302-22 = "어째서 은근슬쩍 카운트가 하나 더 늘어난 건가요!"
3302-23 = "에이, 아무리 지쳤다고 하지만 아직 한 개는 더하실 수 있잖아요."
3302-24 = "지금의 고통스러운 자극이 내일의 근성장으로 이어지는 법……"
3302-25 = "눈 딱 감고 한 번만 더 몸을 움직이면, 내일은 더 멋진 근육을 손에 넣으실 수 있습니다!"
3302-26 = "그 말은 아까도 하셨잖아요!"
3302-27 = "그러고 보니 어느새 은근슬쩍 세트도 하나 더 늘어났어……"
3302-28 = "이대로는…… 더는 못해요!"
3302-29 = "좋습니다. 그럼 휴식입니다!"
3302-30 = "수분을 충분히 보충한 뒤, 땀이 식기 전에 다음 운동으로 넘어가죠!"
3302-40 = "후우……"
3302-41 = "……그보다 이 운동, 야구에 도움이 되긴 하는 건가요?"
3302-42 = "아무리 반복해도 팔이나 어깨 근육이 자극되기보다는, 허벅지와 종아리가 더 당기는 느낌인데……"
3302-43 = "걱정 마세요. 버피 테스트는 팔과 다리는 물론이고 신체를 지탱하는 코어 근육까지 강화하는 전신 운동이니까요."
3302-44 = "이 버피 테스트만 꾸준히 해도 근육 단련은 물론이고 심폐 지구력도 강화할 수 있답니다!"
3302-45 = "특히 레이 양은 심폐지구력을 비롯한 기초 체력이 다소 약화되어 있으니, 특정 부위만 자극하는 운동보다는 이런 전신 운동이 더욱 효과적이지요."
3302-46 = "하지만……"
3302-47 = "저는 홈런을 치고 싶은 거지, 기초 체력을 키우는 게 목적이 아니라고요."
3302-48 = "유명한 슬러거 중에는 팔 근육을 집중적으로 단련해서, 정작 심폐지구력은 평범한 사람보다 훨씬 낮은 경우도 흔히 있는데……"
3302-52 = "……레이 양."
3302-53 = "레이 양은 어째서 홈런이 치고 싶으신 건가요?"
3302-54 = "그야 당연히…… 멋지니까요."
3302-55 = "홈런은 야구 경기의 꽃이나 다름없잖아요?"
3302-56 = "평범한 안타도 득점으로 이어지지 못하는 경우가 허다한데, 스윙 한 번으로 경기의 판도를 뒤바꿀 수 있다니……"
3302-57 = "홈런을 동경하는 건 타자로서 당연한 일이지요."
3302-58 = "야구부에 들어오기로 결심한 순간부터 줄곧 생각했습니다."
3302-59 = "언젠가 멋진 홈런을 쳐서 경기를 승리로 이끌겠다고!"
3302-63 = "그럼 다른 사람이 홈런을 치는 모습을 마지막으로 보았던 것은 언제였나요?"
3302-64 = "그건 아마…… 작년 시즌이 끝나고 친구들과 함께 공립 야구장에 갔을 때였을 거예요."
3302-65 = "지금도 담장을 넘어가던 그 아름다운 포물선이 잊혀지지 않네요."
3302-66 = "그 덕분에 큰 점수 차로 끌려가던 홈 팀은 역전을 거두고 승리를……"
3302-67 = "……아니, 경기 자체는 패배로 마무리되었던가?"
3302-72 = "(……어라? 이상하다……)"
3302-73 = "(그때 보았던 경기장의 풍경이…… 흐릿하니 잘 떠오르지가 않아.)"
3302-74 = "(홈런이 그리는 아름다운 포물선만큼은 선명하게 기억하고 있는데, 경기의 내용만큼은 좀처럼 떠오르지가 않아서……)"
3302-76 = "……오늘 트레이닝은 이것으로 일단 종료할까요."
3302-77 = "아, 네. 수고하셨습니다."
3302-78 = "레이 양, 혹시 오늘 저녁에 야구 경기가 열리는 곳이 있나요?"
3302-79 = "오늘은 월요일이니까 정규 시즌 경기는 없지만…… 게헨나 자치구 외곽의 2군 스타디움에서 2군 리그 경기가 예정되어 있네요."
3302-80 = "그럼 지금부터 함께 야구를 보러 가죠!"
3302-81 = "네? 갑자기……?!"
3302-82 = "트레이닝 일정을 급히 축소하면서 시간이 잔뜩 남아버렸으니까요."
3302-83 = "남은 트레이닝 시간은 현장 견학으로 대체하겠습니다!"
3302-91 = "아니, 이렇게 된 이상…… 게헨나 자치구까지 뛰어서 경기를 보러 갈까요?"
3302-93 = "그랬다가는 오늘 내로 경기장에 도착하지도 못한다고요!"
