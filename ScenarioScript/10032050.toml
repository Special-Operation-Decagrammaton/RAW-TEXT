[translation]
10032050-1 = "제5화;능숙한 듯 서투르게"
10032050-7 = "……흥신소 68……."
10032050-13 = "……조마에 사오리."
10032050-14 = "대비책이라는 게 설마……."
10032050-15 = "……하아."
10032050-16 = "이건 진짜로 성가시게 돼버렸네, 사장."
10032050-21 = "……누구……?"
10032050-22 = "누구냐니……. 조마에 사오리잖아."
10032050-23 = "전 아리우스 출신의 학생 용병."
10032050-24 = "일전에도 한 번 붙어서 그렇게 고생해 놓고, 벌써 잊은 거야?"
10032050-25 = "조마에 사오리……? 어……."
10032050-26 = "………음?"
10032050-27 = "조, 조마에 사오리!? 그, 그때 그 우리 돈 떼먹은 녀석들과 싸웠을 때 엄청 강했던 그 수상한 헬멧단……!!?"
10032050-28 = "응, 맞아. 하루카 쨩이 제대로 인사를 하고 왔던 그놈들이 고용한 용병."
10032050-29 = "거짓말!! 분위기가 전혀 다르잖아!? 그때랑은 같은 사람이라고 볼 수 없다고!!"
10032050-30 = "그건 우리들도 마찬가지지만 말이지~."
10032050-31 = "그땐 정말 난장판이었는데~. 엄~청 힘들었다고!"
10032050-37 = "……이 상황만큼은 피하고 싶었는데, 하필이면 그쪽이 상대라니."
10032050-38 = "정신 바짝 차려야겠군. 일말의 방심도 하지 않겠다."
10032050-40 = "들었어? 엄청 진지하게 임하겠다는데, 아루 쨩?"
10032050-41 = "왜!?!"
10032050-42 = "일이니까 당연하잖아."
10032050-48 = "……음?"
10032050-49 = "잠깐. 그 옆에는……."
10032050-50 = "[s1] \"안녕, 사오리.\"\n[s2] \"예쁜 드레스네. 무슨 일로 왔어?\""
10032050-53 = "……음?"
10032050-54 = "……선생?"
10032050-55 = "…………?"
10032050-56 = "……!?!? 서, 선생!?"
10032050-57 = "여, 여기서 선생이라고……!? 어째서 이런 곳에……!?"
10032050-58 = "……뭐……?"
10032050-59 = "나……? 뭐 하고 있었냐고……?"
10032050-60 = "무, 물론 일이다만……."
10032050-61 = "이곳에서 대기하고 있다가, 유사시 특정 인물을 경호하는 일을 맡았지."
10032050-62 = "그래서 잠입 겸, 이렇게 제공받은 드레스를……."
10032050-63 = "……드레스……."
10032050-67 = "이, 이건 아니다!! 이건 내 게 아니다!"
10032050-68 = "아니, 내 옷은 맞지만!! 내가 구한 게 아니다!"
10032050-69 = "아니, 내가 고른 게 맞긴 하지만……! 어디까지나 일을 위해……!"
10032050-70 = "절대 이런 게 좋아서 골랐다는 게 아니고! 아, 아니. 아닌 건 아니지만!"
10032050-71 = "뭐랄까, 이건 그냥 그……. 상황에 맞게 하기 위해……! 그러니까……!!"
10032050-78 = "……갑자기 횡설수설 하는데?"
10032050-79 = "그러게. 기억하고 있던 이미지랑 조금 다른 느낌이……."
10032050-80 = "저런 녀석이었나……."
10032050-82 = "그, 그러는 선생이야말로 무슨 일로 이런 곳에……!!"
10032050-83 = "…응?"
10032050-84 = "교재용 BD를 만들어? ……총학생회에서 시킨 일이라고?"
10032050-85 = "그런가……. 선생도 일 때문에 온 거로군."
10032050-86 = "후후. 피차 고생이 많다."
10032050-87 = "이봐! 뭐 하는 거냐!? 왜 사이좋게 대화 같은 걸 하고 앉아 있는 건데!?"
10032050-88 = "이러고 있을 때가 아니란 말이다!! 어서 날 안전한 곳으로 데려가야지!!"
10032050-89 = "아, 아아. 나도 모르게 잠시 한눈을 팔았다."
10032050-90 = "그런 관계로……. 미안하다, 선생. 우선은……."
10032050-102 = "……하던 일을 마저 해야 할 것 같군."
10032050-103 = "의뢰인을 안전한 곳으로 데려다준 뒤에, 따로 연락하도록 하지. 그럼 이만……."
10032050-112 = "……!!"
10032050-113 = "…………!"
10032050-115 = "뭐야, 뭐야. 설마 그냥 그대로 가려고?"
10032050-116 = "아무래도 그건 이쪽이 좀 서운하지 않겠어?"
10032050-118 = "선생님이랑만 대화하고 이쪽은 완전히 패스라니."
10032050-119 = "우리도 나름대로 열심히 쫓아왔는데 말이야~. 그런 식으로 무시하는 건 좀 너무하잖아?"
10032050-120 = "처음 보는 사이도 아니고……."
10032050-121 = "……우리 사이에 말이지."
10032050-123 = "……흥신소 68……."
10032050-124 = "지금 이런 상황에서 너희들과 충돌하고 싶은 마음은 없다만……."
10032050-126 = "완전히 이쪽이 할 말인데."
10032050-127 = "그렇게 생각한다면 좋은 방법이 있어."
10032050-128 = "의뢰인을 두고 가. 그러면 우리도 더 이상 덤비지 않을 테니까."
10032050-130 = "과연……."
10032050-134 = "……유감이지만, 그 제안은 받아들이기 힘들 것 같군."
10032050-135 = "일단은 신뢰를 기반으로 먹고사는 일을 하는 중이라서 말이지."
10032050-136 = "……받은 의뢰는 제대로 완수해야, 다음 일도 받을 수 있거든."
10032050-138 = "…………."
10032050-139 = "……우……."
10032050-140 = "우와……."
10032050-141 = "거기서 감탄하면 안 되잖아, 사장."
10032050-142 = "[s3] \"뭐, 이해는 해.\"\n[s4] \"멋있는 건 멋있는 거지.\""
10032050-148 = "이쪽도 유감이네. 의뢰를 받은 이상 물러설 수 없는 건 마찬가지라서 말이지~."
10032050-149 = "넘겨줄 생각이 없다면……."
10032050-154 = "으아아아아아아아-!!!"
10032050-157 = "……끝까지 가는 수밖에."
10032050-158 = "……역시 그렇게 되는 건가."
10032050-159 = "시간이 촉박하다. 시간을 벌 테니 곧바로 뛰어, 의뢰인."
10032050-160 = "뛰어……?"
10032050-161 = "……혹시 나한테 한 말이냐?"
10032050-162 = "당연하지. 여기 의뢰인은 당신밖에 없잖나. 엄호할 테니 먼저 뛰라고."
10032050-167 = "……뛰어!!"
10032050-168 = "……!!!!"
10032050-174 = "놔둘 거 같냐고~!"
10032050-175 = "하, 하루카, 괜찮은 거야? 혹시 아까 다친 데라도……."
10032050-180 = "아루님의 계획을 방해하지 말란 말이다아아-!!!!"
10032050-192 = "……괜찮네."
