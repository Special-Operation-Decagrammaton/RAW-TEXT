[translation]
13020-1 = "제2화;불청객"
13020-5 = "콜록, 콜록. 으, 먼지……."
13020-6 = "이제 여기만 옮기면 되나?"
13020-7 = "네. 이게 마지막 창고예요. 하필이면 이런 때에 창고 이전이라니……."
13020-8 = "콜록, 콜록…… 그런데 여긴 엄청 오랫동안 방치되어 있었나 보네요."
13020-9 = "그러게? 뭐 하는 곳이지?"
13020-10 = "산학협력에 관계된 비문 수거실이라는데……. 어쨌든 중요한 문서들을 보관한 곳인가 보네요."
13020-11 = "아니, 옛날엔 중요했을지 몰라도 지금은 아니겠지. 중요한 문서면 이렇게 뒀을 리가 없잖아?"
13020-12 = "뭐 어쨌든 시작하자. 이 서류 박스들을 서류 파쇄실로 옮기는 거야."
13020-13 = "박스 안에 뭐가 있는지 안 뜯어봐도 되나요?"
13020-14 = "에이~ 시간도 없는데 뭘 그렇게까지 해. 서둘러."
13020-15 = "네. ……어, 어라?"
13020-20 = "으어어? 뭐, 뭐야? 피, 피해요! 선반 기둥이 부러졌……."
13020-21 = "뭐, 뭐야?! 뭘 건든 거야?"
13020-22 = "제가 건든 게 아니에요! 멀쩡하던 게 갑자기……!"
13020-27 = "우와…… 다칠 뻔했다……."
13020-28 = "뭐, 뭐야? 갑자기 강철 선반이 왜 부러지는 거야……."
13020-29 = "하아. 이걸 어떻게 치우라고……."
13020-30 = "응? 이건 또 뭐지……?"
13020-34 = "재수가 없으려니까. 근데 뭐야, 그건?"
13020-35 = "박스 안에 있던 서류 같은데……"
13020-36 = "매매계약서……? 아비도스 고등학교……?"
13020-37 = "으음?"
13020-53 = "여기가……."
13020-59 = "저 사람이……. 그 부학생회장……."
13020-60 = "……."
13020-61 = "이제 혼자 남았으면서…… 어째서 아직도……."
13020-62 = "……흐응?"
13020-69 = "이상하네…… 시선이 느껴졌는데……."
13020-70 = "……."
13020-71 = "뭐어, 기분 탓인가……."
13020-73 = "하아……."
13020-74 = "……. 크, 큰일날 뻔했어요……."
13020-75 = "이 거리에서 그런 게 느껴지나요……? 후아…… 이야기는 듣긴 했지만 정말로……."
13020-76 = "무슨 이야기를 들었길래?"
13020-78 = "……네, 호시노라는 분은……."
13020-82 = "?!"
13020-84 = "흐응? 뭐야, 내 이름도 알고 있어?"
13020-86 = "아, 그, 그게…… 저……."
13020-87 = "누구야, 너는? 나한테 볼일 있어?"
13020-88 = "저, 저는……."
13020-89 = "그게 아니면 다른 자치구의 학교에서 염탐하러 온 거야? 소속과 학년을 대."
13020-90 = "나에 대해 뭔가 알고 있는 것 같으니까, 잘 알고 있겠지? 나는 나보다 연상이라고 봐주거나 그러지 않아."
13020-91 = "……네? 아, 아니에요. 저, 저는……."
13020-92 = "가만…… 그 학교 마크…… 어디서 본 적 있는데……."
13020-93 = "네. 저, 저도…… 아, 아비도스 자치구의 학생이에요……."
13020-94 = "그리고 여, 연상 아니에요, 중학생이에요. 곧 졸업하지만……."
13020-98 = "헤에~? 중학생이라고……? 정말로? 나보다 선배 같은데?!"
13020-99 = "아, 아하하……."
13020-100 = "……. 맞아, 기억났어. 그거, 사립 네프티스 중학교였지?"
13020-101 = "아, 그, 그건……."
13020-102 = "그치만 뭔가 이상한데? 네프티스 본사는 이미 자치구 밖으로 이전한 지 오래잖아. 거기 소속의 학교도 모두 폐교됐을 텐데."
13020-103 = "……."
13020-104 = "저희 중학교도 제가 졸업하고 나면 폐교될 거예요……. 제가 마지막 졸업생이라서……."
13020-108 = "……사립 네프티스 중학교."
13020-109 = "네프티스 기업 휘하의 초엘리트 사립 학교."
13020-110 = "분명 네프티스 기업의 후계자가 초등학교인가 중학교인가에 있었다고 들었는데……. 흐음~ 그렇구만."
13020-112 = "……."
13020-113 = "아직 자치구를 떠나지 않았었나 보네. 이자요이 노노미 씨?"
13020-117 = "아니면 곧 떠날 예정이려나? 뭐든 상관없지만."
13020-118 = "그 악독한 네프티스의 영애님이 나한테 무슨 볼일이 있는 거야? 응? 아니면 이 학교에 볼일이 있는 건가?"
13020-119 = "저, 저는……."
13020-120 = "하지만 조심해야 할 거야? 만약 네프티스가 이 학교에 손아귀를 뻗으려고 하는 거라면……."
13020-121 = "……!!?"
13020-122 = "아무리 네프티스 영애님이라고 해도 네 헤일로는 무사하지 못할 거니까."
13020-123 = "죄…… 죄송해요……. 저는……."
13020-124 = "저는……."
13020-135 = "……너무 심했나."
13020-137 = "……."
13020-138 = "네프티스……."
13020-139 = "[s] \"네프티스 그룹이라면…….\""
13020-140 = "아야네 쨩, 대체 뭐야? 네프티스라는 녀석들이 우리 채권을 사들인 게 무슨 문제가 되는 거야?"
13020-141 = "그건……."
13020-142 = "세인트 네프티스 컴퍼니, 네프티스 그룹은……."
13020-144 = "……아주 오래 전부터 아비도스를 거점으로 성장해 왔던 토착 기업이야. 한때는 키보토스에서 가장 잘나가는 회사였을 때도 있었을걸?"
13020-145 = "정말? 그런 기업이 아비도스에?!"
13020-146 = "아니, 그게 아니라 아비도스가 그만큼 대단했던 거야."
13020-148 = "네 맞아요. 아비도스는…… 예전에는 키보토스에서 가장 강력하고 거대한 학원이었다고 해요."
13020-149 = "모든 학원들이 이곳을 두려워하고 또 선망해 온……. 가장 오래된 역사를 가진 가장 강력하고 위대한 학원……. 그게 예전의 우리 아비도스였다고 해요."
13020-150 = "뭐, 기상 이변이 발생하기도 전의, 아주 오래 전 이야기지만요~♧"
13020-151 = "……세인트 네프티스 컴퍼니는, 그런 아비도스의 전성기를 함께 해온 토착 기업이었어요."
13020-153 = "하지만…… 결과적으로 기상 이변으로 사막화가 가속되면서, 네프티스의 운명은 아비도스와 함께 몰락해 갔어요."
13020-155 = "그러다 <사막횡단철도>라는 실패한 사업을 위해 무리하게 자본을 끌어모았다가…… 파산 직전까지 몰려버렸고요."
13020-158 = "결국 사업은 중단되고, 무리하게 끌어모은 자본은 곧 경제 위기라는 폭탄이 되어서 몰락해 가는 아비도스에 돌이킬 수 없는 타격을 주었고……."
13020-159 = "그것이 연쇄효과를 일으켜서, 학생들과 주민들이 아비도스를 떠나기 시작했고…… 아비도스 학생회는 무리하게 빚을 내기 시작했고……."
13020-161 = "그리고 결국…… 네프티스도 모든 사업을 청산하고 아비도스를 떠나버렸죠."
13020-162 = "뭐어~ 그렇지. 내가 1학년일 때부터 네프티스는 자치구에서 거의 보이지 않았으니까."
13020-164 = "결국 네프티스 녀석들이 벌인 사업 때문에 우리 자치구가 망했다는 거잖아?!"
13020-165 = "그건 아니야, 세리카 쨩. 네프티스는 아비도스가 망한 이유 중의 하나일 뿐이야."
13020-166 = "응, 아니에요. 네프티스의 그 실책만 아니었어도 아비도스는 이 위기를 극복할 기회가 많이 있었을 거예요."
13020-167 = "결과적으로 아비도스의 몰락에 쐐기를 박은 건 네프티스가 맞아요."
13020-168 = "네프티스는 아비도스의 가해자…… 몰락의 주동자들…… 그리고……."
13020-169 = "바로 저희 가문의 기업이기도 해요."
13020-174 = "뭐, 뭐? 뭐라고?!"
13020-175 = "……."
13020-176 = "저는…… 세인트 네프티스 그룹의 영애예요."
13020-177 = "[s] \"노노미…….\""
13020-181 = "……. 역시."
13020-182 = "아, 아야네 쨩? 아, 알고 있었던 거야? 이걸?"
13020-183 = "아니……. 선배의 황금 카드를 생각해 보면 어느 정도는 눈치챌 수 있으니까……. 게다가……."
13020-185 = "저 사막횡단철도야말로 아비도스의 몰락을 가속시킨 사업……."
13020-186 = "그게 이렇게 세계를 구하는 일에 사용될 수 있다면…… 저에게 그보다 더 기쁜 일은 없을 거예요♧"
13020-187 = "……."
13020-189 = "노노미 선배가 버려져 있던 사막횡단철도의 기동 시스템에 접속하는 걸 보고 확신했어요."
13020-190 = "그, 그래? 나만 몰랐던 거야? 호시노 선배도 알고 있었고?"
13020-195 = "아…… 다행이다. 시로코 선배는 몰랐구나."
13020-196 = "으, 으음."
13020-197 = "하지만 어, 어째서 숨긴 거야, 선배?"
13020-199 = "그, 그건……."
13020-200 = "아니…… 생각해 보면 딱히 먼저 말할만한 내용은 아니지……? 미안, 내가 너무 무신경하게 물어봤나 봐."
13020-201 = "아니에요, 세리카 쨩……."
13020-202 = "그러고보면 네프티스 그룹이 아비도스를 떠났는데도 노노미 선배는 여기 계속 남아 있어 준 거구나?"
13020-203 = "……."
13020-205 = "그럼 지금 상황을 일단 정리해 보겠습니다!"
13020-206 = "카이저 코퍼레이션은 오늘 자신들이 확보하고 있는 아비도스 부채의 약 45%를 부채 시장을 통해 팔아치웠어요."
13020-207 = "그 결과, 아비도스에 새로운 채권자들이 엄청나게 생겨났고…… 카이저는 이 거래로 막대한 수익을 남겼을 겁니다."
13020-208 = "그리고 <세인트 네프티스>가 아비도스의 기반 시설 산업을 담보로 대출한 DLB(Derivative Linked Bond)의 채권을 집중적으로 사들인 것을 확인했습니다."
13020-209 = "그것도 원래 금액의 4~5배 이상으로요……."
13020-210 = "네. 하지만 어째서 그런 거래를 했는지는…… 지금부터 확인해 봐야 해요."
13020-211 = "아야네 쨩, 네프티스가 매수한 DLB 채권의 담보 권리를 분석해 줄래요?"
13020-212 = "아, 네……!"
13020-216 = "……해당 채권의 담보는 아비도스 자치구의 특정 시설 및 인프라의 소유권 및…… 개발권, 부수적 시설물의 모든 권리를 포함하고 있어요……."
13020-217 = "토지 소유권을 제외한 모든 권리네요. 하긴, 토지 소유권은 여전히 카이저에게 있을 테고……"
13020-218 = "그 <특정 시설>에는 어떤 것이 포함되어 있죠?"
13020-219 = "어…… 물류 이동을 목적으로 한 교통 인프라와 거기에 귀속된 부가 시설이에요……."
13020-220 = "물류 이동 교통 인프라……? 그런 게 자치구에 아직 남아 있던가?"
13020-225 = "……<사막횡단철도>."
13020-226 = "뭐어?!"
13020-227 = "거기 해당하는 인프라는 그것밖에 없어요……."
13020-228 = "그, 그치만 노노미 선배. 그건 완공도 되지 않은 채 방치된 폐허나 마찬가지잖아……? 그걸 이렇게 비싼 가격에 샀다고……?"
13020-229 = "게다가 네프티스는 자신들이 주도한 사업을 지금에 와서 몇 배나 비싼 값으로 되사들였다는 뜻이기도 해요……."
13020-230 = "왜? 무슨 목적으로?"
13020-232 = "……그걸 모르겠어요. 대체 왜 그런……."
13020-233 = "서, 설마……!?"
13020-238 = "설마…… 거기서 석유 같은 게 발견된 거 아냐?"
13020-243 = "없어없어. 세리카 쨩. 그런 게 있었으면 아비도스가 이런 꼴이 되지도 않았겠지."
13020-244 = "아, 아니면 요즘 유행한다는 희토류 같은 게 발견됐다거나…… 게르마늄 같은……."
13020-245 = "으헤~ 이상한 데서 귀엽다니까, 세리카 쨩은. 돈 될만한 건 예전에 이 아저씨가 이미 다 찾아봤지."
13020-246 = "그치만 아무것도 없더라구. 석유도, 비싼 지하자원도, 희귀광물도, 게르마늄도. 우리 자치구에는 전혀 없어. 그리고 게르마늄은 싸지 않나?"
13020-248 = "그, 그러면 걔들이 왜 저런 짓을 한 거야?"
13020-249 = "그걸 모르겠단 말이지. 으음."
13020-254 = "경고음?"
13020-255 = "뭐, 뭐야 갑자기?!"
13020-257 = "침입자예요! 자치구에 폭발 반응!!"
13020-258 = "설마 카이저 코퍼레이션이……?!"
13020-259 = "아, 아니에요! 폭발의 패턴은…… 공격용이라기보단……."
13020-260 = "공사용 폭탄 같은 건가? 발굴지 쪽이야, 아야네 쨩?"
13020-261 = "아뇨, 위치도 발굴지 쪽이 아니라…… 전혀 다른 쪽이에요. 잠시만요!"
13020-265 = "……"
13020-266 = "확인했습니다! 다, 다른 학교의 학생들이에요……! 수십 명에다가…… 저희가 처음 보는 학교예요!"
13020-267 = "뭐어?!"
13020-269 = "확인했습니다! 저들은……!!"
13020-278 = "파햐햐하핫-! 좋은데?"
13020-280 = "다음화;하이랜더 철도학원"
