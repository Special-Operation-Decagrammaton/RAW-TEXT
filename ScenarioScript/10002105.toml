[translation]
10002105-1 = "제10화;수박깨기 2"
10002105-3 = "으아아……."
10002105-4 = "분해…… 비록 난 이렇게 쓰러지지만……"
10002105-5 = "이 세상에 음식 가지고 장난치는 사람들을 절대 용서하지 못했던……."
10002105-6 = "그런 사람이 여기에 있었다는 걸 알아주길 바라……."
10002105-12 = "……하아. 하아."
10002105-13 = "……."
10002105-14 = "뭐, 뭐죠. 이 기분은……. 이 개운하지 못한 기분은……."
10002105-15 = "이겼지만 이긴 것 같은 기분이 들지 않습니다……."
10002105-16 = "음식을 향한 마음은 이 분이 저희보다 더 올곧았던 게 아닌가 싶습니다……"
10002105-17 = "아니, 그쪽이 아니라……."
10002105-19 = "(이후 이즈미와 함께 바다의 집으로 돌아가서, 놀이에 쓴 수박도 맛있게 나눠 먹었다.)"
