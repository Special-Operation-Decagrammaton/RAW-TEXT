[translation]
10015035-6 = "……사보타주는 계획대로 잘 진행되고 있겠지?"
10015035-7 = "문제없어. 신소재개발클럽의 복합 폭발 물질이 <황륜대제>에서 쓰기로 한 로봇을 박살 내는 걸 직접 내 두 눈으로 확인했으니까."
10015035-8 = "아예 처음부터 새로 만들지 않는 이상, 개회식 전까지 로봇을 수리하는 건 불가능할 거야."
10015035-9 = "잘했어. 교내의 서버를 해킹해서 전산 장애를 일으키는 계획 쪽은 어때?"
10015035-10 = "그게…… 준비한 해킹툴이 서버의 보안 시스템에 막혀서 전부 무력화됐어……."
10015035-11 = "뭐? 그 해킹툴을 준비하는 데 얼마가 든 줄 알아?"
10015035-12 = "어쩔 수 없잖아? 상대는 그 베리타스의 부부장이라고?"
10015035-13 = "세미나의 임원들조차 보안과 관련된 문제에서는 한 수 접고 들어가는 상대를 우리 같은 초짜가 어떻게 상대해?"
10015035-14 = "큿…… 하는 수 없지. 전산망을 이용한 사보타주는 포기하는 수밖에……"
10015035-15 = "하지만 이것만으로 세미나의 의지를 꺾기에는 아직 한참 모자라는데…… 다른 방법은 없을까?"
10015035-16 = "저기. 대신이라긴 뭣하지만, 공업 실습실 쪽에서 이런 걸 발견했는데……"
10015035-23 = "이 '로봇'이라면 아직 보안 클라우드에 등록되지 않았을 테니 해킹툴을 사용할 수 있지 않을까?"
10015035-24 = "나쁘지 않네. 그보다 엔지니어부는 어느새 이런 '전투용 로봇'을 개발한 거지?"
10015035-25 = "출처는 아무래도 좋아. 이 로봇을 해킹하는 데 성공한다면 직접 손을 쓰지 않고도 대운동회를 중단시킬 수 있을 거야."
10015035-26 = "대운동회를 열심히 준비해 온 세미나의 학생들에게는 미안하지만 어쩔 수 없지……"
10015035-27 = "더 이상의 '피해자'를 늘리지 않기 위해서라도……"
10015035-29 = "<대운동회>는 중단되어야 해!"
