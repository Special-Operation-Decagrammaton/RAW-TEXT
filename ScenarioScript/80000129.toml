[translation]
80000129-1 = "I hate cheap chocolate"
80000129-7 = "……."
80000129-8 = "선생님은…… 안 계시나……."
80000129-9 = "다, 다행일지도……."
80000129-14 = "으으…… 이런 걸로 정말 괜찮을까……."
80000129-15 = "……그래도…… 선생님은……."
80000129-20 = "[ns] \"안녕, 아오바.\""
80000129-22 = "우, 우와앗?! 서, 선생님?!"
80000129-23 = "어, 언제부터 계셨던 건가요……?!"
80000129-24 = "소, 소파에……?"
80000129-25 = "누, 누워계셨었구나…… 전혀 몰랐어요……."
80000129-26 = "으, 으…… 그럼 저, 저는 그럼 이, 이만……."
80000129-27 = "[s1] \"벌써 가는 거야?\"\n[s2] \"응……? 이건…….\""
80000129-34 = "앗, 아앗……!! 그, 그건……."
80000129-38 = "그, 저기, 그건……"
80000129-39 = "펴, 평소에 선생님께 많이 신세 지고 있으니까요……!"
80000129-40 = "오, 오늘은 그런 고마움을 전하고 싶어서……!!"
80000129-41 = "그치만, 그런 걸로 괜찮을까 싶기도 해서……"
80000129-42 = "수제, 라거나! 좀 더 정성이 들어간 쪽을 하고 싶었는데……!"
80000129-43 = "매일매일 잔업이 있고…… 끝나면 가게도 문을 닫고…… 그러다 보니……"
80000129-44 = "죄, 죄송해요…… 그렇게 아무 데서나 구할 수 있는 싸구려 간식이라……."
80000129-45 = "[ns] \"엄청 기뻐, 아오바.\""
80000129-48 = "예?!"
80000129-49 = "이, 이런 건데도요……?"
80000129-50 = "[s3] \"많이 신경 써서 준비해 준 거잖아.\"\n[s4] \"그리고 여기까지 와줬고.\""
80000129-53 = "……."
80000129-54 = "그, 그렇게 말씀해 주셔서……"
80000129-55 = "……."
80000129-56 = "감사해요오……."
80000129-57 = "[ns] \"이 쪽지는…….\""
80000129-58 = "앗, 아아아아!!!"
80000129-59 = "그, 그건! 나중에 호, 혼자 계실 때 보세요!!!"
80000129-60 = "지, 지금은 안 돼요!!!"
80000129-61 = "[s] \"아, 알겠어……!\""
80000129-62 = "헉, 허억……."
80000129-69 = "그, 그럼…… 용무도 마쳤고…… 이만 도, 돌아가 보겠습니다……."
80000129-70 = "다, 다음에 또 뵈어요, 선생님……!"
80000129-75 = "[ns] \"잠깐, 아오바!\""
80000129-79 = "무, 무슨 일이시죠?!"
80000129-80 = "[s] \"모처럼이니까 잠깐 쉬다 가면 어때?\""
80000129-81 = "엑…… 예, 옛?"
80000129-82 = "아…… 바, 바쁜 건 아닌데요……!"
80000129-83 = "그, 그래도! 그래도 되나…… 해서요……."
80000129-84 = "'컨디션 유지도 작업자의 덕목'……?"
80000129-85 = "[s5] \"아오바, 조금 피곤해 보여서.\"\n[s6] \"마침 여기에 편안한 소파도 있거든!\""
80000129-88 = "우, 우웃……!"
80000129-89 = "……확실히, 그간 조금 무리한 것 같은 기분도……."
80000129-90 = "……으음……."
80000129-97 = "그, 그럼…… 실례하겠습니다……."
80000129-99 = "(그렇게 늦게까지 아오바를 편히 쉬게 했다.)"
80000129-100 = "하, 항상 신경 써 주셔서 감사합니다……."
80000129-101 = "……덕분에……"
80000129-102 = "내일도, 모레도, 힘낼 수 있을 것 같아요."
80000129-106 = "어쩌면…… 앞으로도요……."
