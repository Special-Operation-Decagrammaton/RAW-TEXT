[translation]
10052135-3 = "돌파했어!"
10052135-4 = "……정말로, 저게 무너지기는 하는군요."
10052135-5 = "보셨습니까, 선생님? 아리스, 해냈습니다! 리턴 매치 성공입니다!"
10052135-6 = "가, 강하는 역시 무서워요……. 우우우……."
10052135-8 = "어쨌든 모두 무사했으니까, 다 괜찮았던 거 아닐까? 우헤헤!"
10052135-9 = "이제 케이 쨩만 오면 될 것 같아요, 선생님. 부탁드릴게요."
10052135-15 = "[ns] \"그러면 우리도 내려갈까?\""
10052135-19 = "[ns] \"……왜 그래, 케이 쨩? 표정이 조금 복잡해 보이는데?\""
10052135-20 = "그냥, 조금, 건방지다는 생각이 들어서요. 이름 없는 신들의 힘을 빌려 가서 하고 있다는 게 결국 이런 거라니……."
10052135-21 = "저 때만 해도 말이죠……. 저였다면……!"
10052135-22 = "[s] \"아, 나왔구만. '나 때는 말이야'로 시작하는 그거.\""
10052135-26 = "……지금 저보고 저 자신의 경험만을 일반화하여."
10052135-27 = "그것만이 옳다고 주장하며 남을 가르치려 드는 꽉 막힌 애라고 깎아내리는 거예요?!"
10052135-28 = "[s] \"그렇게까지는 말한 적 없는데…….\""
