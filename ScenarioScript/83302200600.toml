[translation]
83302200600-6 = "전화 받았어. 선생님. 그렇지 않아도 문의하고 싶은 게 있었는데."
83302200600-7 = "[ns] \"미식연구회가 후우카를 납치해 갔어.\""
83302200600-8 = "역시…… 선생님 쪽이 좀 더 정보가 빠르구나. 이미 그 부분을 캐치하고 있었다니."
83302200600-9 = "[ns] \"그래서 히나가 부디 도와줬으면 해서 말인데……\""
83302200600-10 = "응. 처음부터 그럴 생각이었어."
83302200600-11 = "그럼 선생님, 미식연구회가 도망간 방향을 알려줄래?"
83302200600-18 = "고마워, 바로 현장으로 향할게."
