[translation]
2004205-1 = "캠핑의 묘미"
2004205-2 = "밀레니엄 인근 캠핑장"
2004205-6 = "후우, 텐트는 이것으로 정리된 것 같고……"
2004205-7 = "이제 남은 건 느긋하게 캠핑을 즐기는 일만 남았네!"
2004205-8 = "도와줘서 고마워, 선생님. 역시 이런 야외 활동에 필요한 장비를 정비하는 건 익숙지 않단 말이지……"
2004205-9 = "[s] \"괜찮아. 어려운 일도 아니었고.\""
2004205-11 = "[ns] \"그보다 그 게임 아이템을 얻으려면 어떻게 해야 해?\""
2004205-12 = "우선은 이번에 배포되는 특수 몬스터인 <불면증 까마귀>는 설정상 낮에는 자느라 활동하지 않기 때문에 저녁에만 획득할 수 있어."
2004205-13 = "온라인 커뮤니티의 정보에 따르면 특정 장소에서 저녁 7시 즈음에 통신 기능을 켜면 획득할 수 있다고 하는데—"
2004205-14 = "[s] \"저녁 7시? 하지만 지금은 2시밖에 안 됐잖아?\""
2004205-15 = "그러니까 겸사겸사 캠핑을 온 거지!"
2004205-16 = "이 캠핑장은 가파른 산 중턱이 있기 때문에, 저녁 7시 즈음에 올라오려면 길이 어두워서 꽤나 위험하거든."
2004205-17 = "그래서 미리 이곳에 자리를 깔아두고 기다리다가, 시간이 되면 바로 <불면증 까마귀>를 잡는 거야."
2004205-18 = "후후, 어때. 완벽한 계획이지?"
2004205-19 = "[s1] \"나쁘진 않은 계획이지만……\"\n[s2] \"7시까지 무얼 하면서 기다리려고?\""
2004205-22 = "괜찮아. 핸드폰만 있다면 시간을 보내는 거야 쉬운 일이니까."
2004205-23 = "어디, 그럼 미리 핸드폰에 저장해 둔 영화라도 보면서 저녁까지 기다릴까—"
2004205-28 = "어라? 배터리 부족?!"
2004205-29 = "이상하네…… 분명 어제저녁에 제대로 충전기를 꽂아 두었었는데."
2004205-30 = "설마 제대로 충전이 안 된 건가? 남은 배터리가 5% 밖에 없어……"
2004205-34 = "서, 선생님. 혹시 충전기나 예비 배터리 안 갖고 있어?"
2004205-35 = "[s] \"나도 별도의 배터리는 없는데……\""
2004205-39 = "으앙, 중요한 날에 이런 치명적인 실수를 하다니."
2004205-40 = "물론 핸드폰을 꺼두었다가 7시 즈음에 핸드폰을 다시 켠다면 아이템을 다운받을 수 있겠지만……"
2004205-41 = "핸드폰이 없으면 그때까지 무얼 하면서 기다리라고!"
2004205-42 = "[s3] \"가끔은 핸드폰을 손에서 놓고 자연을 즐겨보는 게 어떨까.\"\n[s4] \"그림이라도 그릴래?\""
2004205-45 = "……아니. 오늘은 게임할 생각으로 머리가 가득 차서 이렇다 할 영감도 떠오르질 않는걸."
2004205-46 = "으으, 하는 수 없지."
2004205-47 = "일단은 치히로 선배처럼 명상이라도 하면서 휴일을 보내보는 수밖에……"
2004205-49 = "(잠시 후.)"
2004205-51 = "지~루~해~"
2004205-52 = "선생님, 지루해~ 지루하다고~"
2004205-53 = "그렇게 오랫동안 멍때리고 있었는데, 시간이 10분밖에 흐르지 않았다니. 믿겨지지가 않아!"
2004205-54 = "뭔가 재미있는 거 없어? 이대로 가다가는 지루해서 말라 죽고 말 거야~"
2004205-55 = "[s] \"하지만 나도 책 이외에 가지고 온 게 정말 없는걸.\""
2004205-57 = "[ns] \"가지고 있는 장비라고 해도 캠핑 관련 용품뿐이라.\""
2004205-58 = "어디……"
2004205-59 = "자가발전 충전식 손전등은…… 이걸 하루 종일 돌려봤자 재미있을 것 같진 않고."
2004205-60 = "핸드폰과 연결할 수 있는 블루투스 스피커는…… 핸드폰을 켤 수 없으면 쓸모가 없고."
2004205-61 = "이 휴대용 TV는…… 이 근처에서는 잡히는 전파가 거의 없을 테고."
2004205-65 = "……응? 그러고 보니 이 휴대용 TV, 뭔가 낯이 익은데?"
2004205-66 = "[s] \"전에 당번 활동을 할 때 가져갔었잖아?\""
2004205-68 = "[ns] \"그때도 심심하다며 뭔가를 열심히 만져보던데.\""
2004205-69 = "아아…… 그때 그 TV구나!"
2004205-70 = "그럼 좋은 방법이 있지!"
2004205-75 = "전에 설치해 둔 커스텀 펌웨어를 실행시키고, 단말을 재조정하면…… 됐다!"
2004205-79 = "[ns] \"휴대용 TV 화면에 우주 괴물이……?!\""
2004205-80 = "맞아! 기억나, 선생님?"
2004205-81 = "내가 예전에 <BOOM> 챌린지에 푹 빠졌을 때 샬레의 여러 전자기기에 <BOOM>을 설치했었잖아?"
2004205-82 = "[s] \"아, 그 고전 게임 말이구나.\""
2004205-84 = "[ns] \"냉장고 화면에서 게임이 켜졌을 때는 깜짝 놀랐었지……\""
2004205-85 = "음, 그건 조금 심했던 것 같지만……"
2004205-86 = "하여튼 그때 <BOOM>을 설치했던 전자기기 중에는 이 휴대용 TV도 있었거든."
2004205-87 = "다시 말해, 지금 이 휴대용 TV는 <BOOM>을 실행할 수 있는 전용 게임기나 다름없지!"
2004205-88 = "[s] \"그래서 저녁까지 계속 <BOOM>을 하려고?\""
2004205-89 = "아니, 아니. 아무리 그래도 몇 시간이나 <BOOM>을 계속하는 건 어렵겠지."
2004205-90 = "이미 여러 차례나 클리어한 게임이고, 그래픽도 단순한 고전 게임이니까."
2004205-91 = "일단은 30분 정도만 가볍게 플레이해 볼까……?"
2004205-95 = "(그리고 마키는 휴대용 TV를 들고 텐트 안으로 들어갔다.)"
2004205-96 = "(하지만 그 말이 무색하게도 마키는 몇 시간 동안 텐트 밖으로 나오지 않았다.)"
2004205-98 = "(약 5시간 후……)"
2004205-101 = "[ns] 마키를 부르러 텐트 안으로 들어간다."
2004205-107 = "[wa:420]― [log=마키 캠핑]우으, [wa:980]우으으…… [/log]"
2004205-109 = "― [log=마키 캠핑]또 같은 지점에서 죽어버렸어……[/log]"
2004205-112 = "[ns] \"마키, 아직도 게임 하고 있는 거야?\""
2004205-114 = "[ns] \"시간 거의 다 됐는데—\""
2004205-116 = "[wa:640]― [log=마키 캠핑]패드를 [wa:1020]조작하는 게 생각보다 어려워서……[/log]"
2004205-119 = "[wa:720]― [log=마키 캠핑]이제 마지막 보스만 남았는데,[wa:40] [/log]"
2004205-121 = "― [log=마키 캠핑]같은 곳에서 실수를 반복한단 말이지.[/log]"
2004205-124 = "[ns] \"이미 해 본 게임이라 금방 질릴 것 같다고 하지 않았어……?\""
2004205-126 = "[wa:780]― [log=마키 캠핑]평소와 다르게 난이도가 올라서…… [wa:2360]그런 걸까.[wa:40] [/log]"
2004205-128 = "― [log=마키 캠핑]묘한 승부욕이 생기더라고.[/log]"
2004205-131 = "[wa:640]― [log=마키 캠핑]주변에 즐길 거리도 없다 보니……[/log]"
2004205-133 = "― [log=마키 캠핑]더 게임에 집중하게 된달까. [/log]"
2004205-136 = "― [log=마키 캠핑]설마, [wa:1160]이게 말로만 듣던 캠핑의 묘미라는 건가?[/log]"
2004205-139 = "[ns] \"곧 약속한 시간인데 괜찮아?\""
2004205-141 = "[wa:550]― [log=마키 캠핑]엣! 벌써 시간이 그렇게?! 어쩌지……[/log]"
2004205-144 = "[wa:750]― [log=마키 캠핑]선생님, [wa:1260]다시 한 판만…… [wa:1470]이번이 진짜 마지막이니까……[/log]"
2004205-146 = "― [log=마키 캠핑]조금만 기다려줘![/log]"
2004205-154 = "드디어 깼다! 클리어했어, 선생님!"
2004205-155 = "이렇게 <BOOM>을 몰두해서 플레이한 게 얼마 만인지…… 역시 캠핑에서만 즐길 수 있는 감성이 있네."
2004205-156 = "그보다 뭔가 중요한 걸 잊고 있는 기분인데……"
2004205-157 = "아, 맞다! 핸드폰 켰어야 했는데!"
2004205-158 = "선생님, 지금 몇 시야?"
2004205-159 = "[s] \"7시 30분……?\""
2004205-160 = "공지한 시간에서 벌써 30분이나 지났잖아?! 혹시 늦은 건 아니겠지……?"
2004205-161 = "나와라, <불면증 까마귀>!"
2004205-162 = "<SYSTEM> '불면증 까마귀'는 어디론가 날아가 버렸다……"
2004205-163 = "으앙, 정말 늦었잖아!"
2004205-164 = "이 특수 몬스터를 잡기 위해 일부러 휴일에 캠핑장까지 찾아온 건데, 게임에 빠져 시간을 놓치고 말다니……"
2004205-165 = "이래서 캠핑장에서는 안심할 수가 없다니까!"
2004205-166 = "하지만 여기까지 와서 아무 성과도 없이 돌아갈 수는 없지."
2004205-167 = "자, 선생님. 지금부터 옆에서 시간을 재 줘."
2004205-168 = "이렇게 된 이상 이 휴대용 TV로 <BOOM> 스피드런 신기록에 도전하는 거야!"
2004205-170 = "(이후, 마키와 함께 밤늦게까지 게임을 즐기며 시간을 보냈다.)"
