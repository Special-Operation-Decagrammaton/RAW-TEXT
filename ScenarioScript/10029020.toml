[translation]
10029020-1 = "제2화;이 동네의 상식"
10029020-2 = "……그렇게 해서……."
10029020-3 = "……우리가 세 사람을 위한 키보토스의 '상식'을 만든 것이지. 세 명에게 가장 알맞을 총을 말이야."
10029020-4 = "꽤 설레는 작업이었어. 시간 가는 줄 모르고 열중했다고."
10029020-5 = "'다른 세계에서 온 초능력자를 위한 총'이라니. 어지간해선 얻기 힘든 기회잖아?"
10029020-6 = "솔직히 '초능력자'라는 말에 반신반의하는 상태이긴 하지만……"
10029020-7 = "뭐, 다른 사람도 아닌 '전지'의 말이야. 의심하는 것보단 기대하는 쪽이 현명하겠지."
10029020-8 = "그럼 우선……."
10029020-9 = "자. 받아. 이쪽이 전기 능력자를 위한 총. 나머지 두 자루는 선생님에게 맡길게."
10029020-10 = "어, 으, 으응……? 응……."
10029020-16 = "뭐, 뭐야. 진짜 총이야? ……나더러 이걸 들라고?"
10029020-17 = "아무리 그래도 좀……."
10029020-19 = "사양할 필요 없어. 거부감이 있다는 건 들었지만, 말했듯 이곳과 그곳의 개념은 다른 면이 많으니까."
10029020-20 = "애초에 지금 미코토의 머리 위에 나타나 있는 헤일로도, 우리처럼 총에 맞아도 괜찮은 것도."
10029020-21 = "모두 미코토가 있던 곳에선 없던 개념이라고 하지 않았어? 미코토 스스로."
10029020-22 = "그, 그건 물론 이해했지만……."
10029020-23 = "으음……."
10029020-24 = "……뭐, 그래. 어쩔 수 없나. 그렇다면 그런 줄 알아야지."
10029020-25 = "그건 그렇고, 설마 이거 나 주겠다고 굳이 새로 만든 거야? 뭔가 좀 미안해지는데……."
10029020-26 = "이런 것까지 받다니, 괜히 지금까지의 태도가 조금 민망해진달까……."
10029020-27 = "……응?"
10029020-28 = "……? 이 총에 들어와 있는 불은……."
10029020-33 = "……응? 선생님, 뭐라고?"
10029020-34 = "혹시나 해서 묻는데, 다른 이상한 기능이 들어있는 것은 아니냐고……?"
10029020-38 = "……그럴 리가 없잖아."
10029020-39 = "[s1] \"조금 전의 간극은 뭐야!?\"\n[s2] \"뭔가 있지!? 분명 뭔가 있잖아!?\""
10029020-42 = "이상한 기능이라니요!! 당치도 않습니다! 굉장한 거라고요!!"
10029020-43 = "사용자의 재능을 이끌어낼 수 있는 유틸리티 총이거든요! 이 <레일건>이라는 건!!"
10029020-44 = "……? 레일건……?"
10029020-45 = "잠깐. 지금 레일건이라고……."
10029020-46 = "물론 일반적인 총기로써도 사용할 수 있는 총이지만, 그 총에는 아주 특별한 기능이 추가돼 있답니다! 바로 전자기력을 이용해서 탄을 발사할 수 있는 기능!!"
10029020-48 = "그야말로 전기 능력자를 위한 안성맞춤의 총!!"
10029020-52 = "사용자가 진짜로 체내에서 전기를 생성해 낼 수 있다면……! 의 이야기지만……요!!"
10029020-53 = "무, 물론 딱히 처음 보는 사람을 의심하는 건 아니지만……."
10029020-54 = "아무래도 너무 생소한 이야기긴 하니까 말이야. 공학자로서, 곧이곧대로 받아들이는 건 조금 무리가 있거든. 기분 나쁘다면 사과할게."
10029020-56 = "아니. 뭐, 괜찮아. 처음 겪는 반응도 아니고."
10029020-57 = "그리고 이 총도 고맙긴 하지만……. 딱히 쏠 생각은 없는데. 그냥 들고만 다니려고 온 거라……."
10029020-58 = "쏘게 될 거야. 그리고 그래도 별문제는 없지만."
10029020-59 = "특히나 선생님이 동행한다면, 거의 공무라고 인식되는 일일 테니까."
10029020-60 = "너무 태연하게 말하잖아……. 물론 오는 길에도 몇 번이나 총싸움이 일어나는 걸 봤지만서도……."
10029020-61 = "……다시 생각해 보니 진짜 꿈 아닐까. 이런 게 현실일 리 없는데. 이것도 전부 인디언 포커의 내용이라든가."
10029020-62 = "총격전이 당연한 세계라니……. 말이 되나 이게……."
10029020-63 = "또 초능력자가 그런 말을……."
10029020-64 = "아무튼 이제 총들도 구했으니, 부장이 '설비'에 대해 조사하는 동안 우리는 남은 두 사람을 찾으러 가야 해."
10029020-65 = "아. 그러고 보니 그거 말이지……."
10029020-66 = "혹시 남은 두 사람이 어떤 사람인지, 미리 한 번 물어봐도 될까? 혹시 내가 아는 사람일 수도 있잖아."
10029020-67 = "뭐, 아니면 아예 또 다른 세계에서 온 사람일 수도……."
10029020-68 = "똑같은 교복을 입은 긴 금발 머리의 여학생과."
10029020-69 = "조금 다른 교복을 입은 검은 머리의 여학생."
10029020-71 = "금발머리 쪽은 리모컨 같은 걸 들고 있었어."
10029020-72 = "금발 장발……? 토키와다이 교복……?"
10029020-73 = "……리모컨……?"
10029020-77 = "……아."
10029020-78 = "……하아."
10029020-79 = "진짜냐. 많고 많은 녀석들 중에 하필 그 녀석인가……."
10029020-80 = "……'그 녀석'이라니? 아는 사이야?"
10029020-81 = "……한쪽은 대충. 아마 맞는 것 같아."
10029020-82 = "그리고 진짜 그 녀석이라면, 아무래도 빨리 찾는 편이 나을 것 같은데."
10029020-83 = "……응? 무슨 뜻이냐고?"
10029020-84 = "그 녀석, 사람을 조종하는 능력 같은 게 있어서 말이야. 무슨 짓을 할지 모르거든."
10029020-85 = "마인드 컨트롤 능력……!? 그런 게 실존한단 말이야? 그런 이야기는 못 들었는데!"
10029020-86 = "알았다면 당연히 총에도 뇌파 증폭 장치 같은 걸……!!"
10029020-87 = "[s3] \"아니, 아니. 괜찮으니까…….\"\n[s4] \"몰라서 다행이었다고 해야 하나.\""
10029020-90 = "과연, 옮기는 동안에는 눈치채지 못했어. 그런 쪽의 능력이라면 티가 안 날 만도 하네."
10029020-91 = "그래도 찾는 건 그리 어렵지 않은 것 같아."
10029020-92 = "……응. 부장이 이미 찾았대."
10029020-93 = "응? 뭐, 뭐야. 벌써? 어떻게……."
10029020-94 = "도시 안의 CCTV들을 조금만 찾아도 어렵지 않지. 말했듯이, 눈에 확 띄니까 말이야."
10029020-95 = "총도 없이 거리를 활보하고 있는 학생이라니……."
10029020-96 = "차라리 헐벗고 다니는 학생 쪽이 훨씬 많다고 봐야죠! 통계적으로도! 실제로도 그렇고요!"
10029020-97 = "진짜 대체 뭐 하는 동네야 여긴……."
10029020-98 = "아무튼 그럼 바로 출발하면 되나? 이……."
10029020-102 = "이 동네의 '상식'이라는 걸 들고?"
10029020-103 = "[s5] \"보기보다 적응력이 빠르네.\"\n[s6] \"좋아. 그럼 바로 가볼까.\""
10029020-106 = "……응."
10029020-107 = "출발이야."
