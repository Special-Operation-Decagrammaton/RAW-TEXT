[translation]
10035130-1 = "후일담;밀레니엄 엔지니어부의 실수 2"
10035130-2 = "(……그리하여, 레저용 메카 악어의 시운전이 있던 날.)"
10035130-6 = "응, 본체의 최종 조정은 완료. 행동 프로그램만 업로드하면 끝나."
10035130-7 = "네! 연료 탱크도 충분합니다!"
10035130-8 = "모형 수조에도 물을 채워 뒀으니 언제든지 시작할 수 있어요!"
10035130-10 = "좋아, 그럼 프로그램 업로드를 시작한다."
10035130-11 = "어라? 프로그램 쪽은 아직 미흡하다고 하지 않았어?"
10035130-12 = "뭐어, 납기 기한을 맞추려면 어느 정도 타협은 필요한 법이지."
10035130-13 = "어제 인터넷에서 적당한 행동 프로그램을 찾았으니, 이거면 무리 없이 작동할 거야."
10035130-14 = "이것으로 레저용 메카 악어는 진정한 완성인 셈이지."
10035130-24 = "아, 움직인다."
10035130-34 = "주위를 둘러보네……. 본능 알고리즘 때문인 것 같아."
10035130-35 = "음, 자연스러운 행동을 위해 본능 알고리즘의 우선순위를 높게 책정했으니 말이지."
10035130-36 = "꼬리도 흔드네요!"
10035130-37 = "참고로 말씀드리자면, 악어가 꼬리를 흔드는 것은 공격, 혹은 위협을 위한 것이라는 연구 결과가 있습니다!"
10035130-41 = "……공격?"
10035130-42 = "……위협?"
10035130-43 = "어, 어라?!"
10035130-51 = "우악! 제가 한 달 동안 공들여 만든 제트부스터 커피머신이!"
10035130-57 = "내가 만든 초음속 물로켓 발사대도……!"
10035130-58 = "이, 이상하다?! 어째서 난동을 부리는 거냐!"
10035130-59 = "설계대로 수조 속으로 들어가!"
10035130-64 = "헉?!"
10035130-72 = "수, 수조가 부서졌어!"
10035130-73 = "물! 피해요! 구석으로!"
10035130-79 = "푸읍!"
10035130-80 = "아, 악어의 전원을 꺼!"
10035130-81 = "우와악! 마구 몸부림쳐대서 가까이 갈 수가 없는데요?!"
10035130-82 = "칫! 이렇게 된 이상 천둥이를……!"
10035130-83 = "선배, 이미 늦은 것 같아."
10035130-89 = "자, 작업실 벽을 뚫고 나가 버렸다……."
10035130-90 = "저 파워, 저 스피드…… 설계 이상의 퍼포먼스인걸."
10035130-91 = "하는 행동도 설계를 벗어났지만 말이죠……."
10035130-92 = "이제 어떻게 하죠……?"
10035130-97 = "이게 무슨 소리야! 폭탄이라도 터뜨린 거야?!"
10035130-101 = "이 목소리는……."
10035130-108 = "근처 지나가다가 큰 소리가 들려서 와 봤는데, 역시 너희들이었네."
10035130-109 = "작업실이 왜 물바다가 되어 있는 거야? 벽면에 있는 저 커다란 구멍은 뭐고?"
10035130-110 = "치, 치히로……."
10035130-112 = "발명품 실험은 신중해서 하라고 말했잖아. 가까운 곳에 중요한 서버실이 있다고!"
10035130-113 = "이번에도 별것 아닌 걸로 이 지경까지 온 거면, 그대로 세미나에 보고하겠어."
10035130-114 = "그, 그게……."
10035130-118 = "우, 우리가 한 게 아니다."
10035130-121 = "(발뺌했어?!)"
10035130-123 = "그, 그래! 우리 잘못이 아냐!"
10035130-124 = "그렇지, 히비키? 우린 전혀 관계없지?"
10035130-125 = "아, 그, 무, 물론이지……."
10035130-126 = "그래, 앞으로도 열심히 하자!"
10035130-131 = "그걸 누가 믿어!"
10035130-132 = "됐어. 물어본 내가 잘못이지."
10035130-137 = "앗, 태블릿으로 작업실 서버를……!"
10035130-143 = "뭐야, 이 악어는."
10035130-144 = "……큭!"
10035130-145 = "어쩔 수 없지. 이렇게 된 이상 털어놓을 수밖에……."
10035130-153 = "메카 악어가 갑자기 난동을 부리며 뛰쳐나갔다……?"
10035130-154 = "애초에 설계에 결함이 있던 거 아냐?"
10035130-155 = "그럴 리가 없어!"
10035130-156 = "마이스터의 자존심을 걸고, 꽃꽂이 겸 해양 레저용 메카 악어에는 어떤 결함도 없다!"
10035130-157 = "그럼 업로드한 프로그램 쪽이겠네."
10035130-161 = "화, 확실히 소프트웨어 쪽은 조금 부족했을지도……모르지만……."
10035130-165 = "……역시, 이쪽이 문제였네."
10035130-166 = "네? 알고리즘이 잘못되었나요?"
10035130-167 = "아니, 너희 계획대로라면 레저용 프로그램이 업로드되어야 했지만…… 서버 기록을 보니 업로드된 건 건물 철거 로봇용 프로그램인걸."
10035130-172 = "어째서 그게 업로드된 건데요?"
10035130-174 = "그게, 인터넷에서 다운받은 프로그램에 문제가 있었던 것 같은데……."
10035130-176 = "이 프로그램, 비인가 프로그램이잖아. 출처도 불분명하고, 목적도 알 수 없어."
10035130-177 = "보안에 관심을 가지라고 내가 누누히 말했건만……!"
10035130-178 = "보안 의식이 엉망이니 이런 일이 벌어지지!"
10035130-183 = "그렇구나! 비인가 프로그램을 사용하면 안 되겠어!"
10035130-184 = "우리 모두 안전한 정품 프로그램을 구매하여 사용하도록 하자!"
10035130-185 = "네! 밀레니엄 엔지니어부는 깨끗한 소프트웨어 사용을 권장합니다!"
10035130-186 = "빠라밤빰."
10035130-191 = "어딜 공익광고로 적당히 넘어가려고!"
10035130-192 = "일단 일을 수습해야 할 거 아냐!"
