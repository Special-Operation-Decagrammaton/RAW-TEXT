[translation]
80000133-1 = "전생이 떠오를 때까지"
80000133-2 = "(샬레의 사무실에서 한창 업무를 보고 있던 어느 날…….)"
80000133-7 = "안녕, 선생……."
80000133-8 = "[s] \"오, 카노에! 무슨 일이야?\""
80000133-9 = "이히히히……."
80000133-10 = "내가 연락한 이유…… 선생이라면 이미 알고 있을 텐데……?"
80000133-11 = "선생과 나는…… 운명의 붉은 실로 이어져 있으니까……."
80000133-12 = "[s] \"혹시…… 초콜릿?\""
80000133-13 = "정—답."
80000133-14 = "그것도 평범한 초콜릿이 아닌, 아주 귀여운 초콜릿 머핀이야……."
80000133-15 = "내 애정이 담긴 특별한 재료를, 연금술 가마에 녹여 만들었지."
80000133-16 = "어때? 먹어볼래……?"
80000133-17 = "[s] \"응! 카노에의 요리는 맛있으니까!\""
80000133-18 = "그래. 그 대답을 기다렸어."
80000133-19 = "히히, 이히히힛……!"
80000133-20 = "[s1] \"으음, 그런데 곧 외근이 있어서 지금은 좀 애매한데.\"\n[s2] \"돌아갈 때쯤에 합류해서 느긋하게 먹어도 될까?\""
80000133-23 = " ……지금이 좋아."
80000133-24 = "[s] \"지, 지금? 하지만 30분 정도밖에 시간이…….\""
80000133-25 = "걱정하지 마……."
80000133-26 = "이럴 줄 알고…… 모든 준비를 끝냈으니까."
80000133-27 = "까악! 까아아악……!"
80000133-28 = "[ns] \"이, 이 소리는……?!\""
80000133-34 = " ……이렇게 될 줄 알았어."
80000133-35 = "히히…… 역시 나는 유능한 여자니까."
80000133-36 = "[s] \"어, 언제 온 거야?!\""
80000133-37 = "그건 중요한 게 아니야."
80000133-38 = "중요한 건…… 내가 선생의 앞에 있다는 사실뿐."
80000133-39 = "자, 눈을 감아줄래……?"
80000133-40 = "(뭔가 기대에 가득 찬 눈빛이다.)"
80000133-41 = "(잠자코 시키는 대로 해보자.)"
80000133-46 = "히히……. 조금만 기다려……."
80000133-50 = "까악~ 까아아악~!"
80000133-53 = "애옹~ 애오오옹~!"
80000133-54 = "[ns] \"동물들 소리가 더 늘어난 것 같은데……?\""
80000133-55 = "냄새를 맡고 모여든 건가……."
80000133-56 = "이 특별한 머핀은…… 선생만을 위한 건데……."
80000133-57 = "일단 나가렴. 너희들 것은 나중에 따로 줄 테니까……."
80000133-63 = "자. 이제 됐어. 눈 떠도 좋아……."
80000133-68 = "선생님……."
80000133-69 = "[ns3] \"부, 분위기가……?\"\n[ns4] \"귀여운 카노에 모드인가……!\""
80000133-72 = "자, 받아 줘. 선생님을 향한 내 마음이야."
80000133-77 = "카노에는…… 어떻게든 선생님께 초콜릿을 선물하고 싶었어."
80000133-78 = "이렇게 하면 분명 전생의 기억이 떠오를 거야."
80000133-79 = "초콜릿을 나눠 먹었던, 그 추억도……."
80000133-80 = "그러니까, 어서 먹어줘."
80000133-81 = "나의, 특별한 머핀……!"
80000133-82 = "[s] \"……!!!\""
80000133-83 = "(무언가에 홀린 듯 카노에의 초콜릿 머핀을 입에 넣었다……!)"
80000133-88 = "어때? 맛있어?"
80000133-89 = "[s] \"환상적인 맛이야……!!\""
80000133-90 = "아아……!"
80000133-91 = "역시 선생님! 좋아해 줄 거라 생각했어!"
80000133-96 = " ……."
80000133-97 = "……히히. 이히히히."
80000133-98 = "나를, 흡수해 줬어……. 이걸로 의식은 완료."
80000133-99 = "이제 선생은 영원히 내 거야……! 이히히히힛……!"
80000133-100 = "자…… 말해봐. 내가 누구지?"
80000133-101 = "나는 전생에 선생의 뭐였지……?"
80000133-102 = "[ns5] \"귀여운 아기 고양이……!\"\n[ns6] \"똑똑한 작은 까마귀……!\""
80000133-106 = "……의식을 완성하기엔 숫자가 부족했던 건가."
80000133-107 = "그렇다면, 떠오를 때까지 먹는 거야……."
80000133-108 = "이런 일을 대비해, 잔뜩 만들어 뒀으니까."
80000133-110 = "(이후 외근을 갈 때까지 카노에와 초콜릿 머핀을 먹으며 즐거운 시간을 보냈다.)"
80000133-111 = "(아쉽게도 전생의 기억은 떠오르지 않았다…….)"
80000133-117 = "하지만…… 괜찮아……."
80000133-118 = "이렇게 몇 번만 더 반복하면……."
80000133-119 = "히히…… 이히히힛……!"
