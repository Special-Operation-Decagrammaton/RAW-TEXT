[translation]
2601705-1 = "디버그 패치"
2601705-2 = "(붉은겨울에 업무차 방문 후, 사용하지 않는 외장하드를 들고 라나를 보러 갔다.)"
2601705-5 = "선생님, 안녕하십니까. 라나입니다."
2601705-6 = "[s1] \"안녕, 라나!\"\n[s2] \"이 당근하고 고구마는 뭐니? 숙제하고 있니?\""
2601705-9 = "아닙니다, 물리 토큰 인증키 복제 작업을 하고 있었습니다."
2601705-10 = "무슨 일로 오셨는지요."
2601705-11 = "[s3] \"라나에게 선물을 주려고 왔단다!\"\n[s4] (외장하드를 건네준다.)"
2601705-17 = "감사합니다. 아주 기쁩니다."
2601705-18 = "……."
2601705-19 = "……선생님께서 선물로 와 주신 것은 이해했습니다만, 이 묵직한 물건은 무엇인지 여쭤봐도 되겠습니까."
2601705-20 = "[ns] \"엥……?\""
2601705-23 = "그렇군요. 제가 데이터 저장용으로 사용하는 카세트테이프와 비슷한 물건이군요. 용량이 아주 커서 놀랐습니다."
2601705-24 = "그런데 이것은 왜……."
2601705-25 = "[s5] \"패치하고 버그 때문에 공간이 부족하댔잖니?\"\n[s6] \"이거면 조금이라도 도움이 될까 해서!\""
2601705-28 = "아, 그렇군…… 요……?"
2601705-32 = "……죄송합니다. 사실, 전혀 이해를 못 하고 있습니다."
2601705-33 = "이해하지 못했으면서 거짓말하는 것이 더 실례일 것 같기에 솔직하게 말씀드렸습니다."
2601705-38 = "아, 버그군요."
2601705-39 = "마침 잘됐습니다. 패치와 버그에 관련이 있는 물건이라면 이걸 어떻게 사용하는지 알려주시면 감사하겠습니다."
2601705-40 = "[s7] \"물론이지! 솔직하게 물어봐 줘서 기쁘단다!\"\n[s8] \"옆에서 잘 지켜볼게!\""
2601705-43 = "그럼 바로, 버그를 잡겠습니다."
2601705-44 = "먼저, 컴퓨터를 끄고 서버를 내리겠습니다."
2601705-49 = "이게 문제였군요. 거기 있는 긴 핀셋을 건네주시겠습니까."
2601705-50 = "[s9] \"핀셋……?\"\n[s10] (일단 핀셋을 건네준다.)"
2601705-61 = "아, 찾았습니다."
2601705-65 = "가장 흔한 버그군요. 나방이었습니다. 릴레이에 끼어 있는 걸 무사히 꺼냈습니다."
2601705-66 = "[s] \"나방이니까, 버그가 맞구나…….\""
2601705-67 = "네. 컴퓨터가 따듯하다 보니 곤충이 자주 끼이곤 합니다."
2601705-68 = "수거한 곤충을 공책에 테이프로 붙이고, 버그 리포트를 작성합니다."
2601705-69 = "'패널 F, 릴레이 70 지점. 나방 한 마리. 디버그 완료.'"
2601705-70 = "그리고, 프로그램 패치도 함께 하겠습니다."
2601705-74 = "천공카드에 잘못 뚫은 구멍을 패치로 막으면 됩니다."
2601705-75 = "이렇게, 버그를 잡은 공책과 패치된 천공카드를 모으다 보니 183호에 공간이 부족해졌습니다."
2601705-76 = "[s11] \"정말 말 그대로 버그 잡고 패치했구나!\"\n[s12] \"생각보다 더 힘든 일이었어……!\""
2601705-79 = "네. 엄청 힘들고 번거롭습니다. 그것은 자명한 사실입니다."
2601705-80 = "오래된 기술이어서 최적화하는 것도 힘들고 성능도 매우 부족합니다만,"
2601705-81 = "이런 것들이 익숙하고 재밌습니다. 나름의 장점이 있습니다."
2601705-82 = "그리고, 눈에 보이면 불안하지 않고 안심이 됩니다."
2601705-83 = "음. 버그 패치의 과정은 이렇습니다. 선생님께서 모처럼 선물해 주신 아까의 물건을 활용해 보려고 합니다만."
2601705-84 = "사용법 가르침, 부탁드립니다."
2601705-85 = "[s] \"음…… 어디부터…… 설명해 볼까…….\""
2601705-87 = "(라나에게 외장하드의 사용법에 대해서 가르쳐주었다.)"
2601705-88 = "(라나는 금방 사용법을 이해했고, 반드시 활용하겠다고 다짐했다.)"
