[translation]
2002115-1 = "중요한 일, 중요한 물건."
2002115-2 = "중요한 일이 생겼다고 말씀드리기는 했지만……."
2002115-3 = "저에게는 중요하지만, 선생님에게는 그렇지 않을지도 모른다는 생각이 들었어요."
2002115-4 = "혹시, 제가 괜한 일을 벌이고 있는 건 아닐까요?"
2002115-5 = "[s1] \"그럴 리가! 학생에게 중요한 일이라면.\"\n[s2] \"선생님에게도 당연히 중요한 일이지!\""
2002115-8 = "저, 정말요?"
2002115-9 = "에헤헤. 감사합니다, 선생님!"
2002115-10 = "그런데 정작 그 중요한 일이 뭐냐고요? 그건 바로……."
2002115-14 = "선물 주머니를 채우는 거예요!"
2002115-15 = "선물을 거의 다 나누어 준 나머지, 이제 남은 게 거의 없어졌거든요."
2002115-16 = "그렇지만 언제, 어디서 누군가가 선물이 필요하다고 할 지 모른다고 생각하니……."
2002115-17 = "이대로 있어서는 안 된다는 생각이 들었어요!"
2002115-18 = "물론 선물을 마음껏 나누어 주어서, 모두에게 도움이 된 건 기뻤지만요!"
2002115-19 = "[s3] (그만큼 선물을 나누어 주었으면)\n[s4] (이제 이미 충분한 것 같지만…….)"
2002115-25 = "그러면, 선생님! 이제부터 같이 선물 주머니를 채우러 가 봐요!"
2002115-32 = "아, 선생님! 마침 여기 좋은 게 있네요! 한 번 봐요!"
2002115-33 = "[s] \"이건……. 실내 운동 기구?\""
2002115-34 = "네! 뭐니 뭐니 해도 건강이 최고잖아요? 그러니까 건강에 도움이 되는 운동 기구도, 훌륭한 선물이 될 수 있죠!"
2002115-38 = "여기 아령하고, 이쪽 케틀벨하고……. 아, 피부에 좋다는 콜라겐 캡슐도 있네요. 종합비타민제도 있고요."
2002115-39 = "실례합니다! 여기부터 여기까지 전부 구매할 수 있을까요?"
2002115-44 = "선생님, 선생님! 여기도 좋은 게 있어요! 보세요!"
2002115-45 = "[s] \"이건…… 마사지기잖아?\""
2002115-46 = "네! 피로를 푸는데 도움이 되고, 혈액순환을 원활하게 도와준다고 하죠."
2002115-47 = "그러고 보니 지압기와 수면 보조제도 있네요!"
2002115-48 = "특히 이 멜라토닌이 들어갔다는 수면 보조제는, 잠들기 두 시간 전에 복용하면 최적의 효과를 보여준다고 쓰여 있어요!"
2002115-49 = "[s] \"뭔가…… 슬슬…… 불안해지는데?!\""
2002115-53 = "네? 갑자기 왜 그러시나요, 선생님?"
2002115-57 = "[ns] \"이런 곳까지 와야 하는 거야?!\""
2002115-58 = "무슨 말씀이세요, 선생님. 선물이란 누가, 언제, 어디에서 필요하다고 할지 모르는 거라구요."
2002115-59 = "그 말을 조금 다르게 생각해 보면, 선물을 구입할 수 있는 장소 역시 언제, 어디를 가리지 않고 있을 수 있다는 거고요!"
2002115-63 = "어디 보자……. 이 좌판에는……. 아, 있네요! 쑥뜸과 부항기, 발바닥 패치에 지압 슬리퍼."
2002115-64 = "미세전류가 흘러 관절을 보호해 준다는 팔꿈치 보호대와 공기주입식 목 견인기, 원적외선 게르마늄 온열 찜질기도 있어요!"
2002115-65 = "가능한 모든 곳을 찾아다니는 보람이 있네요. 선생님!"
2002115-66 = "[s] \"그런 걸까?! 정말로 그런 걸까?!?!\""
2002115-69 = "[ns] \"여기는 정말로 아닌 것 같은데!\""
2002115-70 = "무슨 말씀이세요, 선생님! 산타클로스가 모든 곳을 다니며, 누구 한 명 소외당하는 사람이 생겨나지 않도록 구석구석 살피는 것처럼."
2002115-71 = "저희도 산타클로스를 본받아 할 수 있는 모든 걸 시도해 봐야 하는 거라구요!"
2002115-75 = "어디 보자……. 여기에서 선물이 될 만한 게……."
2002115-79 = "아! 있네요! 음양탕 제조기와 전자파 흡수 인공 선인장, 해독 주스 병……."
2002115-80 = "그리고 전기톱도 있어요!"
2002115-81 = "[s] \"전기톱은 왜?!?!\""
2002115-82 = "네? 그야 전기톱인걸요? 당연한 것 아닌가요?"
2002115-88 = "이봐, 이봐."
2002115-97 = "요즘 여기저기에서 건강용품들을 대량으로 사 가는 녀석들이 있다는 소문을 들었는데……."
2002115-98 = "그게 바로 너희들이었구만. 이거, 남의 장사를 그렇게 방해하면 곤란하지!"
2002115-100 = "네? 저희는 그저 사람들에게 도움이 될 물품들을, 제값을 주고 구매하고 있는 것뿐인데요?"
2002115-102 = "말이 안 통하는구만! 바로 그게 문제라는 거다!"
2002115-103 = "너희들이 모든 물건을 정가에 사 가는 바람에, 싸게 사서 비싸게 팔아넘기려는 우리들의 계획이 모두 엉망이 되어 버렸잖아!"
2002115-104 = "[s] \"애초에 그런 짓을 하면 안 되는 거 아냐?!\""
2002115-105 = "그것도 모자라서 이제는 옳은 소리까지 실컷 해 주고 계시는구만……."
2002115-112 = "기분이 나빠졌어!"
2002115-114 = "옳은 소리는, 바로 그렇기 때문에 아무짝에도 도움이 안 된다는 걸, 확실하게 깨닫게 해 주마!"
2002115-121 = "사람들에게 건강과 행복을 나누어 주려는 산타클로스의 뜻을 방해하는 것도 모자라서……."
2002115-128 = "그걸 멋대로 이용하고 악용하려 하다니! 못됐어요! 나빴어요!"
2002115-129 = "산타클로스는 나쁜 애들한테는 선물을 주지 않을 거예요!"
2002115-134 = "뭐어? 너 아직도 산타를 믿냐? 그건–"
2002115-135 = "어, 잠깐. 지금 저거 뭔가 위험해 보이지 않냐……?"
2002115-137 = "하지만 걱정하지 마세요! 산타클로스를 대신해서, 제가 여러분들을 착하게 만들어 드릴게요!"
2002115-147 = "(하나에는……. 보고 있는 쪽이 놀라울 정도로, 불량배들을 '착하게' 만들었다.)"
2002115-150 = "(그것도 모자라, 하나씩 꼼꼼하게 선물까지 전달해 주었다…….)"
2002115-155 = "선생님! 보세요! 드디어 우리가 선물 주머니를 다시 완성했어요!"
2002115-160 = "에헤헤. 이걸로 모두가, 행복하고 건강한 시간을 보낼 수 있게 되면 좋겠네요!"
2002115-164 = "[ns] \"으, 응. 그러면, 좋겠네…….\""
2002115-166 = "(마냥 밝게 웃는 하나에의 눈부신 미소는.)"
2002115-167 = "(바라보는 모두를 정화시킬 만큼 맑고 깨끗했다.)"
