[translation]
10020035-19 = "크, 크윽……!!"
10020035-20 = "기, 기다려! 너는…… 대체 누구야?"
10020035-21 = "다시 도망쳤어요……."
10020035-26 = "호, 호시노 선배…… 대체 지금……."
10020035-27 = "우리가 알고 있는 시로코 쨩이 아니라니, 무슨 말이죠, 그게?"
10020035-29 = "……."
10020035-30 = "시로코 쨩은…… 그런 눈빛을 하지 않아."
10020035-31 = "그 눈빛은……. 그건……."
10020035-40 = "기다렸지? 지금 히마리 선배의 도움으로 방주 4구역의 통신망을 해킹하는 데 성공했어!"
10020035-41 = "4구역이라면……."
10020035-42 = "시로코의 신호가 포착된 곳이야. 있어봐, 곧 화면을 연결할 테니까."
10020035-52 = "여, 여기는……."
10020035-62 = "시, 시로코 선배?!"
10020035-63 = "시로코 쨩……?"
10020035-64 = "응. 드디어 찾아주었구나. 선생님, 모두들. 기다리고 있었어."
10020035-65 = "[ns] \"시로코?! 괜찮아?! 다친 데는 없는 거야?!\""
10020035-68 = "응. 자전거를 타고 학교로 돌아가는 중에…… 정체를 알 수 없는 적에게 납치돼 버렸어."
10020035-69 = "인질이 되는 건 세리카나 당하는 거라 생각하고 방심해 버렸던 것 같아. 미안. 면목이 없어."
10020035-70 = "뭐, 뭐?! 잠깐, 시로코 선배? 그건 무슨 뜻이야? 내가 뭐?!"
10020035-71 = "그치만 구해주러 올 거란 건 이미 알고 있었으니까. 단지 오랫동안 갇혀 있어서 몸이 좀 둔해졌을 뿐이야."
10020035-72 = "딱히 나한테 위해를 가하지 않는 걸로 봐서는, 목적은 내가 아니라 몸값 협상인 것 같아."
10020035-73 = "이야~ 그런데 시로코 쨩, 인질이면 인질답게 얌전히 있어야지, 그 모습은 뭐야? 무슨 속셈인 거야?"
10020035-74 = "아, 이거? 이건 언제나 가방에 넣어 다니니까. 기회란 준비된 자에게 찾아오는 법이니까."
10020035-75 = "조금 전부터 여기가 공격받고 있다는 걸 깨달았거든. 그러면 탈출할 때…… 타이밍을 봐서 주변의 적당히 값나가는 걸……."
10020035-80 = "거, 거기서도……. 그런 계획을……."
10020035-81 = "으, 으음……."
10020035-82 = "이야~ 시로코 쨩은 언제나 위기 속에서 기회를 찾아내는 아가씨란 말이지."
10020035-83 = "……그치만 말야. 시로코 쨩, 이 아저씨가 뭐라고 그랬지?"
10020035-94 = "으응……."
10020035-95 = "우리가 나쁜 방식에 조금씩 익숙해지다간…… 나중엔 이런 게 아무렇지도 않게 되어버린다고……."
10020035-96 = "그리고 그런 식으로 지켜낸 학교는 우리들의 진짜 학교가 될 수 없다고……."
10020035-98 = "……."
10020035-99 = "……. 시로코 쨩."
10020035-100 = "시로코 선배……. 진짜 선배야……."
10020035-101 = "으헤~ 잘 알고 있네, 시로코 쨩."
10020035-102 = "일단 거기 얌전히 있어. 거기가 어딘지 아니까, 곧 구하러 갈게."
10020035-103 = "응."
10020035-104 = "못다 한 이야기는 만나서 하자고. 시로코 쨩이 없는 동안 진짜 많은 일들이 있었거든? 진짜 눈물 없이는 들을 수 없거든?"
10020035-105 = "응. 기다리고 있을게."
10020035-106 = "호시노 선배. 그리고 모두들. 선생님. 나는 모두가 구하러 올 거라는 걸 알고 있었어."
10020035-107 = "[s] \"………………응. 당연하지.\""
10020035-108 = "그럼…… (치익) 여기서……, ……리고 있을……."
10020035-112 = "……."
10020035-113 = "시로코 쨩……."
10020035-114 = "……자아. 그럼 고민할 것도 없이, 다음 지역으로 가자고."
10020035-115 = "시로코 쨩이 갇혀 있는 4구역이야. 거기로 가는 거야."
10020035-116 = "네! 지금도 많이 혼란스럽지만……"
10020035-117 = "응! 무슨 상황인지 파악하는 것보다 시로코 쨩을 구하는 게 먼저예요!"
10020035-119 = "기다려, 선배! 금방 갈 테니까!"
10020035-121 = "이제 남은 건 하나뿐입니다. 방주의 최후의 구역…… 중앙의 4구역만 남았습니다."
10020035-122 = "이제 여기만 점령하면…… 방주의 관제시스템을 장악할 수 있어요."
10020035-123 = "그럼 아트라하시스의 방주도 끝이야! 자폭 시퀀스를 가동시킬 거니까!"
10020035-128 = "진짜 시로코 씨가 갇혀 있는 곳은 제4구역의 폐쇄된 섹터예요."
10020035-129 = "하지만 이곳으로 통하는 게이트를 열려면, 방주 상층부의 <특별 구역>으로 잠입해서 그곳의 통제실을 파괴해야 해요."
10020035-130 = "특별 구역……."
10020035-131 = "네. 그곳은 물리적으로 방주와 분리된 곳이라, 저희의 방주 해킹이 영향을 받지 않는 장소예요."
10020035-132 = "즉, 누군가가 <특별 구역>으로 가서 그곳의 통제실을 파괴해야 시로코 쨩이 갇힌 곳을 열 수 있다는 거네요?"
10020035-133 = "네. 그러면 시로코 씨가 있는 제4구역의 섹터가 개방될 겁니다."
10020035-137 = "……뭐, 그거라면 역시 우리가 갈 수밖에 없겠지."
10020035-138 = "선생님은 그동안 <차원엔진>을 파괴하고, 제4구역을 점령하는 거야!"
10020035-139 = "시로코 쨩이 탈출할 수 있도록 주변을 정리해 둬야지."
10020035-140 = "[s] \"알겠어, 조심해, 모두들.\""
10020035-142 = "네! 걱정하지 마세요."
10020035-143 = "응! 잘 부탁해!"
10020035-144 = "그럼…… 우리는 <특별 구역>으로 출발할게. 조금 이따가 봐."
10020035-148 = "이제 우리가 앞두고 있는 건 아트라하시스의 방주 점령전의 최후의 싸움이겠군요……."
10020035-149 = "네. 그렇네요. 이게 마지막……."
10020035-150 = "그래서 말인데…… 적들도 이게 마지막이라는 걸 이해하고 있는 것 같아."
10020035-151 = "모모카 쨩……?"
10020035-156 = "우리 주변으로 엄청난 숫자의 적들이 몰려오고 있어."
10020035-157 = "네, 네?!"
10020035-159 = "……다시 한번 우트나피쉬팀의 방어가 필요하겠군요."
10020035-163 = "후후, 그건 걱정 마시길."
10020035-165 = "이곳의 방어는 저희가 맡고 있을 테니까요."
10020035-166 = "어쩔 수 없잖아? 여기까지 왔는데."
10020035-167 = "그렇죠, 와장창이라면 맡겨주세요-★"
10020035-168 = "그런데 우주 식량은 언제 먹을 수 있는 거야……?"
10020035-170 = "이쪽은 저희가…… 어떻게든 막고 있을게요."
10020035-171 = "네. 이쪽은 저희에게 맡겨주세요, 선생님."
10020035-172 = "아리스 쨩…… 몸은 괜찮은 거야?"
10020035-174 = "네. 아직 정상적인 컨디션은 아니지만, 모두와 함께 싸울 정도는 됩니다!"
10020035-175 = "그래도 무리하면 안 돼, 아리스!"
10020035-177 = "네!"
10020035-179 = "선생님, 그럼 마지막 남은 최후의 점령전도…… 잘 부탁드리겠습니다."
