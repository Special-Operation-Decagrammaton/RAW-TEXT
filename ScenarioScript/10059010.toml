[translation]
10059010-1 = "제1화;예술 평의회의 초대"
10059010-2 = "[ns] \"평의회장이라면…… 와일드헌트의 학생회장?\""
10059010-3 = "그렇답니다."
10059010-4 = "언젠가 이렇게 만날 날을 기다리고 있었어요."
10059010-5 = "우리 학원에서 말썽을 피웠던 어른을 직접 마주하면 어떤 기분이 들까…… #n라는 말씀을 하셨던 건 비밀입니다."
10059010-6 = "후후후, 마법진 사건은 정말 인상 깊었답니다?"
10059010-7 = "정말 여. 러. 가. 지. 의미로요."
10059010-8 = "[s] \"그땐 실례가 많았습니다!\""
10059010-9 = "괜찮습니다. 마나미 님은 마음이 넓으시니까요."
10059010-10 = "그럼 소개를 이어가죠. #n계속 절 돕고 있는 이쪽은 쿠온지 카논."
10059010-11 = "예술 평의회의 모든 것을 기록하는 서기관이랍니다."
10059010-12 = "그렇습니다. 저는 모든 것을 기록합니다."
10059010-13 = "지금의 이 만남도, 선생님이 우리를 바라보며 눈을 깜빡인 횟수까지 기록할 예정입니다."
10059010-14 = "[s] \"응? 그런 것까지?\""
10059010-15 = "뭐든 꼼꼼하게 기록하는 게 저의 특기거든요."
10059010-16 = "그것은 전부 <기억의 호수> 덕분."
10059010-17 = "……기억의 호수. 그것은 이 안대 너머에 자리 잡은 삼라만상의 레코드."
10059010-18 = "오직 저만이 발을 담글 수 있는 경계 너머의 심상이죠."
10059010-22 = "[ns1] \"………….\"\n[ns2] (오늘은 평소보다 정신을 똑바로 차려야 할 것 같다…….)"
10059010-28 = "아아. 이야기가 길었네요. 이제 곧 공연이 시작되려는 모양입니다."
10059010-29 = "담소는 여기까지 하도록 하죠. 공연 중에 떠드는 것은 예의가 아니니."
10059010-30 = "그럼 부디 즐거운 관람 되시길."
10059010-33 = "(그렇게 마나미, 카논과 함께 발레 갈라 콘서트를 관람했다.)"
10059010-34 = "(티아라를 쓴 아름다운 발레리나들과, 감미로운 음악. 거기에 환상적인 무용이 조화된…….)"
10059010-35 = "(그야말로 꿈과 환상의 무대였다.)"
10059010-43 = "후후, <갈라 콘서트>라는 개념은 정말 훌륭하네요."
10059010-44 = "그것은 마치 <축제>와도 같은 스테이지."
10059010-45 = "여러 작품의 가장 찬란한 순간을 모아, 관객을 매료시키는 꿈의 무대."
10059010-46 = "물론 작품의 이야기가 전부 담긴 일반 공연도 좋습니다만……."
10059010-47 = "그러면 여기서 질문."
10059010-48 = "선생님은 일반 공연과 갈라 콘서트 둘 중 어느 쪽을 선호하시나요?"
10059010-49 = "[s3] \"작품의 스토리를 전부 즐길 수 있는 일반 공연.\"\n[s4] \"작품의 하이라이트를 두루 즐길 수 있는 갈라 콘서트.\""
10059010-52 = "흠, 과연."
10059010-53 = "이걸로 선생님의 취향을 알아낸 것 같습니다, 마나미 님."
10059010-57 = "[ns] \"뭐, 뭔가 잘못 대답한 건 아니지?\""
10059010-58 = "후후, 그럴 리가요."
10059010-59 = "사실 어느 쪽을 선택해도 큰 의미는 없어요."
10059010-60 = "예술은 정답이 없는 영역. 사람의 숫자만큼이나 다양한 관점이 있으니까요."
10059010-61 = "[s] \"마나미는 어느 쪽을 선호해?\""
10059010-62 = "으음…… 저는 일반 공연 쪽을 조금 더 선호하는 것 같네요."
10059010-63 = "이야기의 시작과 끝을 아름다운 춤으로 감상할 수 있는 것이 정말 좋거든요."
10059010-64 = "그중에서도 <장난감 병정과 발레리나 인형>이라는 작품을 가장 좋아해요."
10059010-65 = "원전은 외다리 장난감 병정과 발레리나 인형의 슬픈 이야기지만……."
10059010-66 = "해피 엔딩으로 각색된 버전이 이곳에서 공연된 적이 있죠."
10059010-67 = "평단에서도 아름다운 춤으로 표현된 희극의 반전이 정말 매력적이라 평가하고 있답니다."
10059010-68 = "[s] \"오오, 나도 보고 싶어졌어.\""
10059010-69 = "하지만 마나미 님. 그 작품은……."
10059010-70 = "네. 저도 알고 있답니다."
10059010-74 = "안타깝게도 그 작품은…… 당분간 공연장에서 보긴 힘들 거예요."
10059010-75 = "작품의 구상과 주연을 함께한 발레리나가, 심각한 발목 부상으로 은퇴하고 말았거든요."
10059010-76 = "외다리 병정이 나오는 이야기에서 그런 부상을 입다니……. 아이러니하다고 할까요."
10059010-77 = "그 발레리나 외엔 작품을 완벽히 소화해 내는 사람이 없어서 공연도 잠정 중단 상태랍니다."
10059010-78 = "[s] \"그건…… 너무 안타깝네.\""
10059010-82 = "……네."
10059010-83 = "이 세상에 영원한 건 없는 거예요."
10059010-84 = "찬란히 빛나는 별도, 언젠가 사그라지는 법……."
10059010-89 = "그렇기에 저는 수집을 통해 빛나는 순간을 박물관에 보관하고 있답니다."
10059010-90 = "<장난감 병정과 발레리나 인형>도, 마지막 상영분이 저의 박물관에 보관되어 있어요."
10059010-91 = "언제 기회가 된다면 함께 감상하도록 해요."
10059010-92 = "기회가 된다면, 말이에요."
10059010-93 = "[s] (기회가 안 되면 어림도 없다는 뜻이구나…….)"
10059010-94 = "후후, 외부인과 이렇게 담소를 나눠보는 것도 정말 오랜만이네요."
10059010-95 = "덕분에 즐거웠습니다. 진심으로요."
10059010-96 = "이번엔 정말로 즐겁다는 말씀입니다. 오해하시면 안 됩니다."
10059010-97 = "네. 이걸로 선생님을 향한 경계심이 조금 풀린 것 같네요."
10059010-98 = "[s] \"여, 역시 경계하고 있었구나…….\""
10059010-99 = "학원에서 말썽을 부렸던 사람을 쉽게 믿을 수는 없잖아요? #n……뭐, 그때는 아주 약간의 가산점을 얻긴 하셨지만요."
10059010-100 = "그래서 이번 기회에 좀 더 점수를 얻을 기회를 드리고자 합니다만…… #n어떠신가요?"
10059010-101 = "명예 회복의 기회…… 원하시나요?"
10059010-102 = "[s] \"말씀만 해주십시오……!\""
10059010-103 = "후후, 적극적인 모습이 보기 좋네요."
10059010-104 = "그럼 카논 서기관. 준비된 그것을."
10059010-109 = "[ns] \"이건…… 초대장?\""
10059010-110 = "네. 평의회장의 이름으로 보내는 정식 초대장입니다."
10059010-111 = "[s5] \"초대장을 미리 준비했다는 건……\"\n[s6] \"내가 여기 올 걸 알았다는 이야기?\""
10059010-114 = "후후, 저는 그저 오늘 공연을 즐기러 왔을 뿐이랍니다."
10059010-115 = "초대장 같은 건 만일을 대비해 항상 준비하고 있답니다."
10059010-116 = "이걸로 겨우 올린 점수를 다시 잃으셨군요. 안타깝게 됐습니다."
10059010-117 = "[s] \"으윽……!\""
10059010-118 = "아무튼 초대장을 드렸으니 공식적인 자리에서 만나 이야기를 이어 나가죠."
10059010-119 = "분명, 감각을 공유하는 즐거운 시간이 되겠지요."
10059010-121 = "(도대체 어떤 부탁을 하려는 걸까.)"
10059010-122 = "(불안을 안고 맞이한 다음 날.)"
10059010-127 = "……."
10059010-128 = "(정문에 엄청난 위압감을 풍기는 사감대 학생이 서 있다…….)"
10059010-129 = "응? 외부인? 뭐 하는 사람이니?"
10059010-130 = "[s] \"샬레의 [USERNAME] 선생님입니다만…….\""
10059010-131 = "으음, 당신이구나."
10059010-132 = "뭔가 긴장한 표정이네."
10059010-133 = "사감대 간부와 만나는 건 처음이니?"
10059010-134 = "[s] \"가, 간부라면 미리아와 만나보긴 했는데…….\""
10059010-135 = "아? 그 귀여운 친구?"
10059010-136 = "그랬구나. 참 훌륭한 대원이지."
10059010-137 = "난 코지로 사요."
10059010-138 = "와일드헌트의 사감대장이야."
10059010-139 = "[s] (어쩐지 분위기가 범상치 않더라니……!!)"
10059010-140 = "평의회에서 선생을 데려오라더라."
10059010-141 = "마법진 사건 때는 부재중이라 못 봤는데, 이렇게 보게 되네?"
10059010-142 = "그때 만났다면 더 좋았을 것을."
10059010-143 = "반성실에서 진득하게 <대화>하는 거, 엄청 좋아하니까."
10059010-144 = "[s] \"그, 그렇구나!\""
10059010-145 = "일단 검문검색은 생략할게."
10059010-146 = "정식 초대를 받고 온 손님이 수상한 물건을 반입할 리는 없을 테니까."
10059010-147 = "그렇지?"
10059010-148 = "[s] \"무, 물론이지!\""
10059010-149 = "뭐, 사실은 반입해도 상관없어."
10059010-150 = "이 기회에 반성실에서 그때 못한 이야기를 나누는 것도 좋을 테니."
10059010-151 = "[s] \"수상한 물건은 없으니까 안심해!\""
10059010-152 = "응. 일단 믿을게."
10059010-153 = "아무튼 이쪽이야. 다들 기다리고 있어."
10059010-159 = "평의회는 이 본관에 있어."
10059010-160 = "아…… 그러고 보니 본관에 들어가는 건 처음이겠구나?"
10059010-161 = "후후, 긴장할 것 없어."
10059010-162 = "조금이라도 허튼짓하면 나한테 혼나겠지만, 선생이라면 그러지 않을 거잖아?"
10059010-163 = "[s] \"무, 물론이지!\""
10059010-168 = "평의회장. 선생님을 데려왔어."
10059010-169 = "아아, 수고하셨어요. 어서 들어오세요."
10059010-173 = "자, 그럼 안으로……."
10059010-178 = "[ns] \"이곳이 바로……?\""
10059010-179 = "반갑습니다, 선생님."
10059010-180 = "이곳이 바로 <예술 평의회>. 와일드헌트의 중심부입니다."
10059010-181 = "벽면의 태피스트리도 그에 걸맞은 학원의 대표작이죠."
10059010-182 = "무려 <창세의 초상> 원본이니까요."
10059010-183 = "네. 이 작품을 짊어진다는 건, 학원의 모든 것을 짊어진다는 것."
10059010-184 = "때문에 우리 평의회 임원들은 무거운 책임감을 지고 학원을 운영해 나가고 있답니다."
10059010-185 = "자, 지금부터 그 임원들을 소개해 드리죠."
10059010-186 = "먼저, 저의 왼쪽에 있는 카논 서기관부터."
10059010-189 = "안녕하십니까. 어제 만났던 서기관 카논입니다."
10059010-190 = "오늘은 부디 마나미 님에게 높은 점수를 얻으시길."
10059010-193 = "후후…… 카논 님도 참……."
10059010-194 = "안녕하세요. 저는 운린인 우라라. 평의회의 부회장이에요."
10059010-195 = "화사하게 피어난 꽃처럼, 지금 이 순간이 서로에게 소중히 기억되면 좋겠네요."
10059010-199 = "[ns] \"갑자기 어디선가 장미 향기가……?\""
10059010-200 = "후후…… 아마도 제가 가꾸는 장미 화원 때문일 거예요. #n그 향기가 남아 있었던 모양이네요."
10059010-201 = "아무튼 반갑습니다. 평의회에 어서 오세요."
10059010-202 = "[s] \"응! 모두 반가워!\""
10059010-205 = "찾아오시느라 고생 많으셨습니다."
10059010-206 = "약소하지만, 대접을 해드리고자 합니다."
10059010-207 = "우라라 부회장. 선생님께 그것을."
10059010-212 = "조금 별나다고 생각하실 것도 같지만……."
10059010-213 = "최근 키보토스 전역에서 유행 중인 프리미엄 우유예요."
10059010-214 = "건강에도 좋다고 하니, 선생님 마음에 들었으면 좋겠네요."
10059010-219 = "[ns7] (이야기만 들어도 치유되는 기분이다……!)\n[ns8] \"오오…… 고마워! 잘 마실게!\""
10059010-227 = "[ns] \"이거 정말 좋은데? 샬레에도 들여놔야겠다.\""
10059010-229 = "우라라 부회장은 저를 도와 학원의 다양한 업무를 처리하고 있답니다."
10059010-230 = "오늘의 다과도 우라라 부회장이 준비했죠. 부디 편하게 즐겨주시길."
10059010-234 = "해석하자면…… 제가 아끼는 부회장의 정성이 담겼으니 남기면 용서 안 한다는 뜻입니다."
10059010-238 = "으으음…… 괜찮아요."
10059010-239 = "남기신다면…… 선생님의 취향을 제대로 파악 못 한 제 잘못이니까……."
10059010-240 = "[s9] \"아, 아니야! 마침 배가 고프던 참이었어!\"\n[s10] \"뭐든 주는 대로 다 먹을게……!\""
10059010-243 = "후후…… 그렇게 말씀해 주시니, 은혜로운 비에 기뻐하는 화초의 기분이 느껴지네요."
10059010-244 = "자, 이걸로 인사는 다들 나눈 것 같으니 슬슬 본안으로 들어가죠."
10059010-245 = "먼저 오늘 선생님을 뵙고자 한 이유를 말씀드리겠습니다."
10059010-246 = "최근, 저희는 학원 내에서 불온한 세력의 움직임을 감지했습니다."
10059010-247 = "학생들의 문제라면 내부적으로 처리를 했겠습니다만, 이번엔 뭔가 달라요."
10059010-248 = "이에 공식적으로 샬레의 선생님께 의뢰합니다."
10059010-252 = "평의회를 도와, 학원에 숨은 어둠을 찾아 주셨으면 합니다."
