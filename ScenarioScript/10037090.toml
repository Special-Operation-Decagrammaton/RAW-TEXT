[translation]
10037090-1 = "제9화;한달음에 산을 오르니."
10037090-4 = "–산해경과 그 전통의 이름으로, 현 현룡문의 문주, 류우게 키사키를 논핵(論劾)한다!"
10037090-13 = "……!"
10037090-23 = "어, 어?! 우리는 왜……?!"
10037090-24 = "체리노 쨩. 일단 저희들 뒤로……!"
10037090-25 = "그, 그래! 이봐! 우리는 방문단이라고! 무슨 짓을 하려는 거냐!"
10037090-31 = "……훌륭하게 나를 포위했구나. 카구야. 그렇다면 이제 어쩔 것인가?"
10037090-36 = "문주님?!"
10037090-38 = "기다려라, 현룡문! 그리고 스스로에게 물어보아라!"
10037090-39 = "너희들이 지키려는 것이, 키사키 문주인가, 산해경인가!"
10037090-41 = "무슨 말을 하고 싶은 것인가. 카구야 부장……?"
10037090-43 = "너희들도 눈이 있고 귀가 있다면 알 수 있을 터! 현룡문은 본디 산해경의 전통과 가치를 수호하는 조직이다!"
10037090-44 = "그러나 그 현룡문의 수장인 키사키 문주가, 과연 산해경의 전통과 가치를 수호하는 자인가?"
10037090-45 = "과거에는 분명 그러했을지도 모른다! 그때의 키사키 문주는 모두의 존경과 충성을 받아 마땅한 자였다!"
10037090-46 = "그러나 지금은 어떠한가? 과거의 키사키 문주와, 지금의 키사키 문주가 과연 동일인인가?"
10037090-47 = "나는 그렇게 생각하지 않는다. 보아라! 키사키 문주가, 지금의 산해경에 불러일으킨 '변화'를!"
10037090-52 = "어? 우, 우리……?!"
10037090-54 = "확실히…… 붉은겨울의 학생들을 산해경에 직접 초대하신 것은……."
10037090-55 = "하지만 문주님인데……?"
10037090-56 = "그렇지만 현룡문의 문주가 산해경을 지키려 하지 않는다면……?"
10037090-58 = "역시, 생각만큼 현룡문 부원들이 적극적으로 움직여 주지는 않는군요."
10037090-59 = "만에 하나 문주의 논핵에 적극적으로 나서 주지 않을까, 하는 기대를 해 보기도 했습니다만……."
10037090-61 = "아니. 이 정도면 충분하다."
10037090-62 = "무엇보다 우리의 목적은 길을 엇나가고 계신 문주님을 올바른 길로 되돌리는 것이고."
10037090-63 = "이런 방법을 사용하면서까지 우리의 의지로…… 충언과 고언을 전해드리는 것이다."
10037090-64 = "그 사실을 잊지 않도록 해라. 우리는 반역을 꾀하는 자들이 아니라, 충심을 보이려는 자들이라는 것을."
10037090-65 = "문주! 몸을 피해야 하는 것이다! 이곳은 위험한 것이다!"
10037090-67 = "나를 걱정해 주어서 고맙구나. 사야."
10037090-68 = "하지만…… 이곳을 벗어나 어디로 갈 수 있단 말이냐. 후후."
10037090-69 = "조직의 수장이란 본디, 하늘에 바쳐지는 제물 같은 것이니 말이다."
10037090-75 = "……지키려는 것이 문주인가, 산해경인가. 라……."
10037090-76 = "훗. 내 답은 처음부터 정해져 있었다. 문주님께 다가가려는 자는……."
10037090-87 = "내 시체를 밟고서 지나가라!"
10037090-92 = "미나……? 그대도 어서 몸을 피하는 것이……?"
10037090-93 = "후……. 문주님을 버리고 도망치라니, 그거야말로 촌스러운 권유로군요."
10037090-97 = "산해경 전체를 적으로 돌린다 해도, 저는 문주님을 지키겠습니다."
10037090-102 = "음. 좋은 표정이다. 미나 집행부장."
10037090-108 = "뭐지……?"
10037090-113 = "다른 학원의 사정에 간섭하거나 끼어들 생각은 없었지만……."
10037090-114 = "미나 집행부장에게만 멋있는 역할을 맡길 수는 없지 않은가!"
10037090-115 = "……그런 이유로 좋은 것인가, 마리나 위원장?"
10037090-116 = "문주님께는 여러모로 신세를 지기도 했고 말이지."
10037090-117 = "대접받은 팬케이크는, 버터 수프와 함께 되돌려 드려야 하는 법이니까!"
