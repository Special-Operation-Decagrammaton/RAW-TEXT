[translation]
212020-1 = "제2화;치나츠"
212020-3 = "3학년 선배들은 대부분 변했다고 했죠. 부장님과 아코 행정관처럼……."
212020-4 = "……그럼, 혹시 선배도……."
212020-5 = "……확인해 봐야겠어요."
212020-20 = "세나 선배님, 안녕하세요."
212020-24 = "치나츠."
212020-25 = "오랜만이군요."
212020-26 = "종종 찾아뵈었어야 했는데. 죄송해요."
212020-27 = "많이 바쁜 것 알고 있습니다. 저도 마찬가지였고요."
212020-28 = "그런가요."
212020-33 = "……응급의학부도 전쟁을 준비하고 있나 보군요."
212020-34 = "후후, 물론이죠."
212020-35 = "이 전쟁이야말로 우리 모두의 숙원이니까요."
212020-36 = "……."
212020-37 = "……치나츠도 그렇겠지요?"
212020-41 = "드디어 선도부가 게헨나 외부에 그 힘을 보여줄 때가 되었는걸요."
212020-42 = "세나 선배님, 저는……."
212020-43 = "저는 기억하고 있습니다."
212020-44 = "어떤…… 것을요?"
212020-45 = "치나츠가 선도부로 가겠다고 했던 순간을."
212020-46 = "그, 그건……."
212020-47 = "분명 '가만히 둘 수 없어서'였지요…… 그 이유가."
212020-48 = "……기억하고 계셨군요."
212020-49 = "네. 치나츠였으니까요."
212020-53 = "네……?"
212020-54 = "기대되는 후배였거든요. 언젠가 응급의학부 부장이라는 자리를 맡을 수도 있겠다고 생각한, 유능한 후배."
212020-55 = "……그, 그런 이야기는 처음 듣네요."
212020-56 = "저도 처음 해봤습니다. 아시겠지만 제가 원래 그리 말이 많은 성격도 아니고요."
212020-57 = "선배님께서 그렇게 높게 평가해 주고 계신 줄은…… 정말 몰랐습니다."
212020-58 = "그런 후배가 동아리를 옮기겠다고 했을 때, 아닌 척했지만 꽤 충격이었습니다."
212020-59 = "……."
212020-63 = "이 응급의학부에서는 저 아이의 꿈을 이룰 수 없었을까?"
212020-64 = "우리에게 문제가 있었던 걸까? 그렇다면 어떻게 하면 해결할 수 있을까?"
212020-65 = "이런 생각들을, 그 당시에는 꽤 많이 했던 것 같습니다."
212020-66 = "그, 그런……"
212020-67 = "저는, 응급의학부가 부족하기 때문에 선도부로 가고자 했던 것이 아닙니다."
212020-68 = "다만, 부상자가 발생할 때마다 빠르게 대처할 수 있는 방법을 고민하다 보니……."
212020-69 = "후후…… 네. 알고 있습니다."
212020-70 = "……세나 선배님……."
212020-71 = "간단한 겁니다. 치나츠가 하고자 했던 것을 우리가, 제가 이루어 주지 못했어요."
212020-72 = "여러 가지 이유가 있겠습니다만, 굳이 말할 것도 없는 이야기입니다."
212020-73 = "우리 모두 선택을 했고, 이제는 서로의 자리를 잡은 상태니까요."
212020-74 = "저는, 지금의 치나츠가 자랑스럽습니다."
212020-78 = "……고맙습니다, 선배님."
212020-79 = "제가 여기서 죄송하다고 말씀드리는 것은, 선배님에 대한 모욕이겠지요."
212020-80 = "언제나 최선을 다하고, 할 수 있는 일을 했던 선배님이니까요. 똑똑히 기억하고 있어요."
212020-81 = "저도 선배님이 항상 자랑스러웠고, 지금도 그러합니다."
212020-82 = "그렇게 생각해 준다면 고마울 뿐입니다. 치나츠."
212020-83 = "그러니……."
212020-89 = "이제부터도 더욱 잘 부탁드립니다."
212020-90 = "키보토스 정복에 있어서 선도부의 역할은 정말 중요할 테니까요."
212020-91 = "명실공히 게헨나 최고의 무력 집단인 선도부가 전투를 원활하게 지속하기 위해서는 치나츠가 크게 힘을 내야 합니다."
212020-92 = "선도부장 또한 치나츠에게 거는 기대가 클 거예요. 물론 저도 그렇고요."
212020-93 = "서, 선배님……."
212020-94 = "……자신이 없는 건가요?"
212020-98 = "아, 아뇨. 그게 아니고……."
212020-99 = "응급조치, 전시 환자 이송, 긴급 상황에서의 대처 및 보급, 간이 수술."
212020-100 = "모두 응급의학부에서 가르친 것들입니다. 거기에 치나츠의 경험이 더해졌겠지요."
212020-101 = "네. 그래서, 저는 걱정하지 않습니다."
212020-102 = "치나츠를 믿기 때문입니다."
212020-103 = "…………."
212020-104 = "세나 선배."
212020-105 = "네. 말씀하세요."
212020-106 = "만약 전쟁이 일어나고, 게헨나가 키보토스를 파괴한다면……"
212020-107 = "그건 정말로 선배가 바라는 일일까요?"
212020-108 = "선배는 그런 게헨나를 자랑스럽게 여길 수 있는 사람인가요……?"
212020-109 = "……위대함에는 희생이 따르는 법이지요."
212020-110 = "분명 많은 사상자가 발생할 거예요."
212020-111 = "게헨나뿐만 아니라, 다른 학원 학생들도요. 심지어 관련 없는 사람들도 다치고 상처 입겠지요."
212020-112 = "선배는…… 정말 그런 것을 원하시나요?"
212020-116 = "솔직히 말씀드리면……"
212020-117 = "……."
212020-118 = "저 개인적으로 그런 것을 선호하지는 않습니다."
212020-119 = "하지만 제 개인의 호오와는 관계없이, 반드시 필요한 일이라는 점은 확실하죠."
212020-120 = "어떤 것이요? 게헨나가 일으키는 정복 전쟁이요?"
212020-121 = "네. 그 자체가 의료 행위니까요."
212020-122 = "그건…… 무슨 말씀이시지요?"
212020-123 = "지금의 난립한 학원 질서를 감안하면, 그 위에 세워진 키보토스야말로 긴급하게 치료가 필요한 부상자라 할 수 있을 겁니다."
212020-124 = "게헨나에 의한 통일, 그리고 강력한 질서의 확립이야말로 키보토스를 치료할 유일한 방법이지요."
212020-125 = "사상자를 말씀하셨지요. 그것은 수술 중 발생하는 출혈과 같습니다."
212020-126 = "출혈이 무서워서 수술을 포기한다면, 환자는 돌이킬 수 없게 됩니다.#n아시잖아요? 치나츠."
212020-130 = "……고민이 많아 보이네요, 치나츠."
212020-131 = "선배……."
212020-132 = "……."
212020-133 = "아, 필수 약품 리스트를 정리하다가 손을 놓고 있었네요."
212020-134 = "그럼…… 다음에 또 보죠. 치나츠."
212020-135 = "……네. 또 오겠습니다. 세나 선배."
212020-141 = "치나츠."
212020-145 = "네?"
212020-149 = "부디, 옳은 방향으로 마음을 이끌어나갈 수 있기를 바라겠습니다."
212020-153 = "……네. 그렇게 하겠습니다."
212020-155 = "세나 선배……."
212020-156 = "그 맑은 눈. 저를 믿어주는 그 눈은 그대로인데."
212020-160 = "……."
212020-162 = "반드시, 반드시…… 이전의 선배들로 돌려놓겠어요."
212020-164 = "다음화;재흥위원회의 반응"
