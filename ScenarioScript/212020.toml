[translation]
212020-1 = "第2話;千夏"
212020-2 = ""
212020-3 = "聽說3年級的前輩們大多都變了。#n就像委員長和亞子行政官一樣……"
212020-4 = "那麼，難道前輩也……"
212020-5 = "……得確認一下才行。"
212020-6 = ""
212020-8 = ""
212020-12 = ""
212020-14 = ""
212020-15 = ""
212020-17 = ""
212020-18 = ""
212020-19 = ""
212020-20 = "瀬奈前輩，您好。"
212020-21 = ""
212020-23 = ""
212020-24 = "千夏。"
212020-25 = "好久不見了呢。"
212020-26 = "我應該常來拜訪您才對，很抱歉。"
212020-27 = "我知道你很忙。我也一樣。"
212020-28 = "是嗎……"
212020-29 = ""
212020-33 = "……看來急救醫學部也在準備戰爭呢。"
212020-34 = "呵呵，當然。"
212020-35 = "因為這場戰爭，正是我們所有人的夙願。"
212020-36 = "……"
212020-37 = "……千夏也是這麼想的吧？"
212020-38 = ""
212020-40 = ""
212020-41 = "風紀委員會終於到了向格黑娜外部展現力量的時候了。"
212020-42 = "瀬奈前輩，我……"
212020-43 = "我還記得。"
212020-44 = "記得……什麼？"
212020-45 = "千夏說要去風紀委員會的那一刻。"
212020-46 = "那，那是……"
212020-47 = "理由應該是「沒辦法置之不理」……對吧？"
212020-48 = "……原來您還記得啊。"
212020-49 = "是的。因為是千夏的事。"
212020-50 = ""
212020-52 = ""
212020-53 = "什麼……？"
212020-54 = "因為你是我很看好的後輩。#n一個讓我覺得或許有一天能接下急救醫學部部長職位的優秀後輩。"
212020-55 = "……我，我還是第一次聽到這種話。"
212020-56 = "我也是第一次說。#n你也知道，我本來就不是話多的人。"
212020-57 = "我真的不知道……前輩對我的評價有這麼高。"
212020-58 = "那樣的後輩說要轉去別的社團時……雖然我裝作若無其事，其實相當震驚。"
212020-59 = "……"
212020-60 = ""
212020-62 = ""
212020-63 = "在這個急救醫學部，就無法實現那孩子的夢想嗎？"
212020-64 = "是我們有什麼問題嗎？如果是的話，該怎麼做才能解決呢？"
212020-65 = "那時候，我好像經常在想這些事。"
212020-66 = "怎，怎麼會……"
212020-67 = "我並不是因為急救醫學部有所不足，才想去風紀委員會的。"
212020-68 = "只是，在思考每次出現傷患時能迅速應對的方法時……"
212020-69 = "呵呵……是的。我知道。"
212020-70 = "瀬奈前輩……"
212020-71 = "很簡單。千夏想做的事，我們……我沒能幫你實現。"
212020-72 = "原因有很多吧，但那也不是什麼需要特地說出口的事。"
212020-73 = "因為我們都做出了選擇，現在也都各自找到了自己的位置。"
212020-74 = "我為現在的千夏感到驕傲。"
212020-75 = ""
212020-77 = ""
212020-78 = "……謝謝您，前輩。"
212020-79 = "我在這裡向您道歉的話，對前輩來說應該是一種侮辱吧。"
212020-80 = "前輩總是竭盡全力，做自己能做的事。#n這些我都記得很清楚。"
212020-81 = "我也一直以前輩為傲，現在也是如此。"
212020-82 = "你能這麼想，我很感激，千夏。"
212020-83 = "所以……"
212020-84 = ""
212020-86 = ""
212020-87 = ""
212020-89 = "今後也請多多指教。"
212020-90 = "因為在征服奇普托斯這件事上，風紀委員會的角色非常重要。"
212020-91 = "風紀委員會是名副其實格黑娜最強的武力集團，#n為了讓戰鬥順利持續下去，千夏必須好好努力才行。"
212020-92 = "風紀委員長應該也對千夏寄予厚望。當然，我也是。"
212020-93 = "前，前輩……"
212020-94 = "……你沒有信心嗎？"
212020-95 = ""
212020-97 = ""
212020-98 = "啊，不是。不是那樣的……"
212020-99 = "急救處置、戰時傷患運送、緊急狀況的應對與補給、簡易手術。"
212020-100 = "這些全都是在急救醫學部教過的。#n而且現在還加上了千夏自己的經驗吧。"
212020-101 = "沒錯。所以我並不擔心。"
212020-102 = "因為我相信千夏。"
212020-103 = "…………"
212020-104 = "瀬奈前輩。"
212020-105 = "是。請說。"
212020-106 = "如果戰爭爆發，格黑娜毀了奇普托斯的話……"
212020-107 = "那真的是前輩希望的事嗎？"
212020-108 = "前輩能為那樣的格黑娜感到驕傲嗎……？"
212020-109 = "……偉大總是伴隨著犧牲。"
212020-110 = "一定會出現很多傷亡的。"
212020-111 = "不只是格黑娜，其他學園的學生也是。#n甚至連無關的人都會受傷吧。"
212020-112 = "前輩……真的希望那種事發生嗎？"
212020-113 = ""
212020-115 = ""
212020-116 = "老實說……"
212020-117 = "……"
212020-118 = "我個人並不喜歡那種事。"
212020-119 = "但與我個人的好惡無關，這確實是必要的事。"
212020-120 = "什麼事？格黑娜發動的征服戰爭嗎？"
212020-121 = "是的。因為那本身就是一種醫療行為。"
212020-122 = "那是……什麼意思呢？"
212020-123 = "考量到現今群雄割據的學園秩序，#n建立在這之上的奇普托斯，完全能稱得上是急需治療的傷患。"
212020-124 = "由格黑娜統一，並確立強大的秩序──這才是治療奇普托斯唯一的方法。"
212020-125 = "你剛才提到了傷亡吧。#n那就和手術中發生的出血一樣。"
212020-126 = "如果因為害怕出血而放棄手術，患者就會陷入無法挽回的地步。#n你應該明白吧？千夏。"
212020-127 = ""
212020-129 = ""
212020-130 = "……你看起來有很多煩惱呢，千夏。"
212020-131 = "前輩……"
212020-132 = "……"
212020-133 = "啊，必備藥品清單才整理到一半呢。"
212020-134 = "那麼……下次再見吧，千夏。"
212020-135 = "……好的。我會再來的，瀬奈前輩。"
212020-136 = ""
212020-138 = ""
212020-140 = ""
212020-141 = "千夏。"
212020-142 = ""
212020-144 = ""
212020-145 = "是？"
212020-146 = ""
212020-148 = ""
212020-149 = "希望你能引導自己的心，朝正確的方向前進。"
212020-150 = ""
212020-152 = ""
212020-153 = "……好的。我會的。"
212020-155 = "瀬奈前輩……"
212020-156 = "那雙清澈的眼睛……那雙相信我的眼睛明明還是沒變。"
212020-157 = ""
212020-159 = ""
212020-160 = "……"
212020-162 = "我一定，一定……會讓前輩們變回原來的樣子。"
212020-164 = "下一話;再興委員會的反應"
