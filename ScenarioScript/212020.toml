[translation]
212020-1 = "第2話;チナツ"
212020-3 = "ほとんどの3年生が影響を受けている……委員長やアコ行政官のように……。"
212020-4 = "それなら、もしかすると……。"
212020-5 = "……確かめなければ。"
212020-20 = "セナ先輩、おはようございます。"
212020-24 = "チナツ。"
212020-25 = "久しぶりですね。"
212020-26 = "ご無沙汰になってしまい、すみません。"
212020-27 = "忙しさは分かっています。こちらも似たようなものですよ。"
212020-28 = "そう、ですか……。"
212020-33 = "……救急医学部も、戦いの準備をしているんですね。"
212020-34 = "もちろんです。"
212020-35 = "これこそ、私たち全員の宿願ですから。"
212020-36 = "宿願……？"
212020-37 = "……チナツも、そうでしょう？"
212020-41 = "風紀委員会の力をゲヘナの外に示す時が来たのです。"
212020-42 = "私は……。"
212020-43 = "チナツ。私は覚えています。"
212020-44 = "何を……ですか？"
212020-45 = "チナツが風紀委員会へ行くと言った時のことです。"
212020-46 = "そ、それは……。"
212020-47 = "理由は、「放っておけなくて」でしたよね。"
212020-48 = "そんなことまで……。"
212020-49 = "もちろんです。チナツのことですから。"
212020-53 = "……はい？"
212020-54 = "期待していましたから。#nいずれ、部長を任せられるかもしれない、と。"
212020-55 = "今まではそんな話、一度も……。"
212020-56 = "それはそうでしょう。いま初めて言いましたから。"
212020-57 = "先輩がそこまで評価してくださっていただなんて……。"
212020-58 = "だからこそ……部を移ると聞かされた時は衝撃を受けました。#n表に出さないよう取り繕ってはいましたが。"
212020-59 = "……。"
212020-63 = "[ruby=ここ]救急医学部[/ruby]では望みを叶えてあげられなかったのだろうか？"
212020-64 = "私たちに問題があったのだろうか？#nだとしたら、どうすれば解決できたのだろうか。"
212020-65 = "当時は、そんなことをずいぶんと考えました。"
212020-66 = "そ、そんな……。"
212020-67 = "不満があったから部を移ろうとしたのではなくて……。"
212020-68 = "負傷者が出るたび、もっと早く対処できる方法を考えているうちに……。"
212020-69 = "ふふ。#n……ええ、分かっています。"
212020-70 = "セナ先輩……。"
212020-71 = "[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby]では、チナツに最良な場所にはなれなかった。"
212020-72 = "いろいろ理由はあるでしょう。ですが、あえて言葉にするような話でもありません。"
212020-73 = "私たちは選択をし、それぞれの場所を得て。#nそして今、ここにいるのですから。"
212020-74 = "私はチナツを誇りに思います。"
212020-78 = "……ありがとうございます。"
212020-79 = "ここで私が「申し訳ない」と言うのは……先輩に対する侮辱なのでしょうね。"
212020-80 = "先輩はいつだって最善を尽くして、自分にできることを懸命にやってきました。"
212020-81 = "私だって先輩を尊敬してきましたし、今も変わりません。"
212020-82 = "私は良い後輩を持ちましたね。"
212020-83 = "だから――"
212020-89 = "これからも、どうぞよろしくお願いします。"
212020-90 = "名実ともにゲヘナ最強の武力集団。風紀委員会の役割は大きいのですから。"
212020-91 = "なにせ戦闘の継続は、チナツの働きにかかっています。"
212020-92 = "風紀委員長も、チナツに期待しているでしょう。"
212020-93 = "先輩……。"
212020-94 = "……不安ですか？"
212020-98 = "いえ……そうではなくて……。"
212020-99 = "応急処置、簡易手術、患者の搬送、緊急時の対応と補給。#nどれも救急医学部で教えたことです。"
212020-100 = "今はそこに、チナツ自身の経験も加わっている。"
212020-101 = "ですから、私は心配していません。"
212020-102 = "チナツを信じています。"
212020-103 = "…………。"
212020-104 = "セナ先輩。"
212020-105 = "はい。"
212020-106 = "もしもゲヘナがキヴォトスを破壊するとして……。"
212020-107 = "それは……先輩が望むことなんですか？"
212020-108 = "先輩は、そんなゲヘナを誇れるんですか……？"
212020-109 = "……偉大さには、犠牲が伴うものです。"
212020-110 = "きっと多くの負傷者が出ます。"
212020-111 = "ゲヘナだけじゃない。多くの市民まで傷つき、苦しむはずです。"
212020-112 = "先輩は……本当にそんなことを望んでいるんですか？"
212020-116 = "そうですね……。"
212020-117 = "……。"
212020-118 = "私個人としては、そういった事は好みません。"
212020-119 = "ですが、個人の好き嫌いを越えて、[ruby=・]必[/ruby][ruby=・]要[/ruby][ruby=・]な[/ruby][ruby=・]こ[/ruby][ruby=・]と[/ruby]だと理解しています。"
212020-120 = "攻撃を行うことが、ですか？"
212020-121 = "ええ。キヴォトスに対する医療行為ですから。"
212020-122 = "言っている意味が分かりません。"
212020-123 = "キヴォトスは、乱立した学園秩序の上に成り立っています。#nこれを救急患者と呼ばずして何と呼びましょう。"
212020-124 = "ゲヘナによる統一。#nそして強力な秩序の確立こそが、キヴォトスを治療する唯一の方法なのです。"
212020-125 = "先ほど、負傷者の話をしましたね。それは手術中に起こる出血と同じです。"
212020-126 = "出血が怖いからと手術を諦めれば、患者は取り返しのつかないことになる。#nチナツなら分かっていますよね？"
212020-130 = "……よほど悩んでいるようですね。"
212020-131 = "先輩……。"
212020-132 = "……。"
212020-133 = "薬品整理が途中でした。"
212020-134 = "今日のところはこれくらいで。……また次の機会に。"
212020-135 = "……はい。また伺います。"
212020-141 = "チナツ。"
212020-145 = "はい？"
212020-149 = "どうか、正しい道へ進めるよう願っています。"
212020-153 = "……ありがとうございます。"
212020-155 = "セナ先輩……。"
212020-156 = "私を信じてくださる、澄んだ瞳。あの目は変わっていないのに。"
212020-160 = "なのに……。"
212020-162 = "必ず……元に戻してみせます。"
212020-164 = "次回;ゲヘナ再興委員会の反応"
