212020-1 = "Episode 2;Chinatsu"
212020-2 = ""
212020-3 = "So, the third-years changed. I've already confirmed the shift in Hina and Ako..."
212020-4 = "Oh, Sena..."
212020-5 = "I should see for myself."
212020-6 = ""
212020-8 = ""
212020-12 = ""
212020-14 = ""
212020-15 = ""
212020-17 = ""
212020-18 = ""
212020-19 = ""
212020-20 = "Good morning, Sena."
212020-21 = ""
212020-23 = ""
212020-24 = "Chinatsu."
212020-25 = "It's been a while."
212020-26 = "My sincere apologies. I should've visited you more often."
212020-27 = "We've both been busy. Duty always calls, doesn't it?"
212020-28 = "Indeed it does."
212020-29 = ""
212020-33 = "...Sena, I can't help but notice that the Medical Emergency Club is also...prepping for battle."
212020-34 = "Fufu, of course we are."
212020-35 = "This war has been our long-cherished desire, after all."
212020-36 = "..."
212020-37 = "...You agree, don't you, Chinatsu?"
212020-38 = ""
212020-40 = ""
212020-41 = "The time has come for the Prefect Team to bring the storm to the world outside Gehenna."
212020-42 = "Sena, I..."
212020-43 = "I still recall it."
212020-44 = "\"Recall\"...what?"
212020-45 = "The afternoon. That moment when you told me that you'd join the Prefect Team."
212020-46 = "W-Well..."
212020-47 = "...You said you \"couldn't stand idly by and do nothing.\""
212020-48 = "...So you remembered."
212020-49 = "Yes. Because they were your words, Chinatsu."
212020-50 = ""
212020-52 = ""
212020-53 = "Huh...?"
212020-54 = "I had such high hopes for you. You were a capable wunderkind underclassman who had the potential to one day become Medical Emergency Club President."
212020-55 = "...Th-This is all news to me."
212020-56 = "That's because I never said it aloud. You know I'm not one to chat."
212020-57 = "I honestly...did not know you held me in such high regard."
212020-58 = "When you revealed that you wanted to join a different club, I was quite shocked, though I tried not to show it."
212020-59 = "..."
212020-60 = ""
212020-62 = ""
212020-63 = "\"Why couldn't her dreams be realized in the Medical Emergency Club?\""
212020-64 = "\"Were we the problem? Was I? If so, how can I resolve it?\""
212020-65 = "For a time, I thought about these things quite often."
212020-66 = "Th-That's..."
212020-67 = "I didn't want to join the Prefect Team because there was anything wrong with the Medical Emergency Club."
212020-68 = "I would see these injuries and continuously wonder if there was a better way to not only respond to them, but PREVENT them..."
212020-69 = "Fufu... Yes. I am aware."
212020-70 = "...Sena..."
212020-71 = "It's simple. We, or rather, I, failed to deliver what you wanted."
212020-72 = "Though there may be various reasons, the truth is evident."
212020-73 = "Now we've all made our choices, and settled into our respective places."
212020-74 = "I am proud of who you've become, Chinatsu."
212020-75 = ""
212020-77 = ""
212020-78 = "...Thank you, Sena."
212020-79 = "If I were to apologize here, I fear it would come off as insulting."
212020-80 = "You...always tried so fervently. You worked so hard to make things right. I remember it vividly."
212020-81 = "I was proud of you too. I still am."
212020-82 = "I am grateful that you think of me that way, Chinatsu."
212020-83 = "And..."
212020-84 = ""
212020-86 = ""
212020-87 = ""
212020-89 = "I look forward to us working together more."
212020-90 = "While we provide medical support, the Prefect Team will be essential in our glorious conquest of Kivotos."
212020-91 = "You're going to have to play a major role in Gehenna's most formidable combat force. You'll manage combat operations, after all."
212020-92 = "The Head Prefect will have high expectations of you. As will I."
212020-93 = "S-Sena..."
212020-94 = "...Are you not feeling confident?"
212020-95 = ""
212020-97 = ""
212020-98 = "N-No. That's not it..."
212020-99 = "Rapid aid, wartime patient transportation, emergency response and supply distribution, and minor procedures..."
212020-100 = "You learned all this in the Medical Emergency Club. When you add that to your extensive experience with the Prefect Team..."
212020-101 = "I have no reason to worry."
212020-102 = "Because I believe in you, Chinatsu."
212020-103 = "..."
212020-104 = "Sena."
212020-105 = "Yes?"
212020-106 = "If war really breaks out and Gehenna destroys Kivotos..."
212020-107 = "Would you be satisfied?"
212020-108 = "Would you be proud of a Gehenna that did that?"
212020-109 = "...Glory comes from sacrifice."
212020-110 = "There will be many casualties."
212020-111 = "Not only from Gehenna, but from other academies as well. Even civilians, innocent people, will be hurt."
212020-112 = "Is that...what you really want?"
212020-113 = ""
212020-115 = ""
212020-116 = "To be honest..."
212020-117 = "..."
212020-118 = "I personally would not enjoy such losses."
212020-119 = "However, regardless of my personal preferences, some things are necessary."
212020-120 = "What is? This war of conquest that Gehenna is waging?"
212020-121 = "That's right. Because that in itself is a medical procedure."
212020-122 = "What...do you mean by that?"
212020-123 = "Consider the current, perilous state of relations between academies. They function like competing organs draining the greater body, Kivotos."
212020-124 = "And the only way to cure Kivotos is to excise the unnecessary and unify it under Gehenna's gestalt order. It is the only viable way for the body to survive."
212020-125 = "You mentioned casualties. They will be much like the bleeding that occurs during surgery."
212020-126 = "If you fear bleeding and abandon the surgery mid-way, the patient will die. You know this well, Chinatsu."
212020-127 = ""
212020-129 = ""
212020-130 = "...You seem to have a lot on your mind."
212020-131 = "Oh, Sena..."
212020-132 = "..."
212020-133 = "Ah, I've lost track of time. I should be organizing the medicine."
212020-134 = "Then... I'll see you later, Chinatsu."
212020-135 = "...Yes. I shall return, Sena."
212020-136 = ""
212020-138 = ""
212020-140 = ""
212020-141 = "Chinatsu."
212020-142 = ""
212020-144 = ""
212020-145 = "What?"
212020-146 = ""
212020-148 = ""
212020-149 = "I sincerely hope that you will lead your heart in the right direction."
212020-150 = ""
212020-152 = ""
212020-153 = "...Yes. I shall."
212020-155 = "Sena..."
212020-156 = "Those clear eyes. Those eyes that trusted me...they look the same."
212020-157 = ""
212020-159 = ""
212020-160 = "..."
212020-162 = "I will... I VOW...to bring her back."
