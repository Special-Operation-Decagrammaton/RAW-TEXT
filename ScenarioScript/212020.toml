[translation]
212020-1 = "ตอนที่ 2;ชินัตสึ"
212020-2 = ""
212020-3 = "รุ่นพี่ชั้นปีที่ 3 ส่วนใหญ่เปลี่ยนไปสินะคะ อย่างท่านประธานกับเจ้าหน้าที่อาโกะ..."
212020-4 = "ถ้าอย่างนั้น หรือว่ารุ่นพี่ก็..."
212020-5 = "ต้องไปดูให้แน่ใจแล้วค่ะ..."
212020-6 = ""
212020-8 = ""
212020-12 = ""
212020-14 = ""
212020-15 = ""
212020-17 = ""
212020-18 = ""
212020-19 = ""
212020-20 = "รุ่นพี่เซนะ สวัสดีค่ะ"
212020-21 = ""
212020-23 = ""
212020-24 = "ชินัตสึ"
212020-25 = "ไม่ได้เจอกันนานเลยนะคะ"
212020-26 = "ฉันควรแวะมาหาบ้างแท้ๆ ขอโทษนะคะ"
212020-27 = "ฉันรู้ว่าชินัตสึงานยุ่งมากค่ะ ตัวฉันเองก็เหมือนกัน"
212020-28 = "อย่างนั้นเหรอคะ"
212020-29 = ""
212020-33 = "ดูเหมือนว่าหน่วยแพทย์ฉุกเฉินก็กำลังเตรียมพร้อมสำหรับสงครามเหมือนกันสินะคะ..."
212020-34 = "ฮุฮุ แน่นอนค่ะ"
212020-35 = "สงครามครั้งนี้คือความปรารถนาอันยาวนานของพวกเราทุกคนค่ะ"
212020-36 = "..."
212020-37 = "ชินัตสึก็คงคิดเหมือนกันใช่มั้ยคะ...?"
212020-38 = ""
212020-40 = ""
212020-41 = "ในที่สุดก็ถึงเวลาที่คณะกรรมการวินัยจะได้แสดงอำนาจให้ภายนอกเกเฮนน่าได้เห็นแล้วนี่คะ"
212020-42 = "รุ่นพี่เซนะ ฉัน..."
212020-43 = "ฉันยังจำได้ค่ะ"
212020-44 = "เรื่อง... อะไรเหรอคะ?"
212020-45 = "ช่วงเวลาที่ชินัตสึบอกว่าจะไปเข้าคณะกรรมการวินัยค่ะ"
212020-46 = "นะ... นั่นมัน..."
212020-47 = "เหตุผลตอนนั้นก็คือ 'ปล่อยไว้เฉยๆ ไม่ได้' ใช่มั้ยล่ะคะ..."
212020-48 = "ยังจำได้อยู่สินะคะ..."
212020-49 = "ค่ะ ก็เพราะเป็นชินัตสึนี่คะ"
212020-50 = ""
212020-52 = ""
212020-53 = "คะ...?"
212020-54 = "เพราะชินัตสึเป็นรุ่นน้องที่ฉันคาดหวังไว้น่ะค่ะ เป็นรุ่นน้องมากความสามารถที่ฉันเคยคิดว่า สักวันหนึ่งอาจได้รับตำแหน่งหัวหน้าหน่วยแพทย์ฉุกเฉินเลยด้วย"
212020-55 = "ระ... เรื่องแบบนั้นฉันเพิ่งเคยได้ยินเป็นครั้งแรกเลยค่ะ"
212020-56 = "ฉันเองก็เพิ่งพูดเป็นครั้งแรกค่ะ อย่างที่รู้ ฉันไม่ใช่คนพูดมากอยู่แล้ว"
212020-57 = "ฉันไม่เคยรู้เลยค่ะ... ว่ารุ่นพี่จะเห็นคุณค่าในตัวฉันมากขนาดนั้น"
212020-58 = "ตอนที่รุ่นน้องคนนั้นบอกว่าจะย้ายชมรม ถึงฉันจะทำเป็นไม่รู้สึกอะไร แต่จริงๆ ก็ตกใจมากค่ะ"
212020-59 = "..."
212020-60 = ""
212020-62 = ""
212020-63 = "หน่วยแพทย์ฉุกเฉินแห่งนี้ไม่อาจทำให้ความฝันของเด็กคนนั้นเป็นจริงได้เหรอ?"
212020-64 = "พวกเรามีอะไรบกพร่องหรือเปล่า? ถ้าอย่างนั้นต้องทำยังไงถึงจะแก้ไขได้?"
212020-65 = "ตอนนั้นฉันคิดเรื่องพวกนี้อยู่บ่อยครั้งเลยค่ะ"
212020-66 = "ระ... เรื่องแบบนั้น..."
212020-67 = "ฉันไม่ได้อยากไปคณะกรรมการวินัยเพราะหน่วยแพทย์ฉุกเฉินมีอะไรขาดตกบกพร่องนะคะ"
212020-68 = "เพียงแต่ พอคิดหาวิธีที่จะเข้าช่วยเหลือได้อย่างรวดเร็วทุกครั้งที่มีผู้บาดเจ็บทีไร..."
212020-69 = "ฮุฮุ... ค่ะ ฉันรู้"
212020-70 = "รุ่นพี่เซนะ..."
212020-71 = "เรื่องนั้นเรียบง่ายมากค่ะ สิ่งที่ชินัตสึต้องการจะทำ พวกเรา... และตัวฉันเองไม่สามารถช่วยทำให้เป็น#nจริงได้"
212020-72 = "คงมีเหตุผลหลายอย่าง แต่เป็นเรื่องที่ไม่จำเป็นต้องยกมาพูดให้มากความค่ะ"
212020-73 = "พวกเราทุกคนต่างก็เลือกทางของตัวเอง และตอนนี้ก็มีที่ทางของตัวเองกันแล้ว"
212020-74 = "ฉันภูมิใจในตัวชินัตสึตอนนี้ค่ะ"
212020-75 = ""
212020-77 = ""
212020-78 = "ขอบคุณค่ะ รุ่นพี่..."
212020-79 = "ถ้าฉันกล่าวขอโทษในตอนนี้ ก็คงเป็นการดูหมิ่นรุ่นพี่สินะคะ"
212020-80 = "รุ่นพี่เป็นคนที่ทุ่มเทเต็มที่และทำทุกสิ่งที่ทำได้อยู่ตลอด ฉันจำได้ชัดเจนเลยละค่ะ"
212020-81 = "ฉันเองก็ภูมิใจในตัวรุ่นพี่มาตลอด และตอนนี้ก็ยังเป็นเช่นนั้นค่ะ"
212020-82 = "ถ้าคิดกับฉันแบบนั้น ฉันก็มีแต่ต้องขอบคุณค่ะ ชินัตสึ"
212020-83 = "เพราะงั้น..."
212020-84 = ""
212020-86 = ""
212020-87 = ""
212020-89 = "ต่อจากนี้ก็ขอฝากตัวด้วยอีกครั้งนะคะ"
212020-90 = "บทบาทของคณะกรรมการวินัยในการพิชิตคิโวทอสจะสำคัญอย่างยิ่งเลยละค่ะ"
212020-91 = "คณะกรรมการวินัยคือหน่วยกำลังรบที่แข็งแกร่งที่สุดของเกเฮนน่าทั้งในนามและความเป็นจริง เพื่อให้การต่อสู้เป็นไปอย่างราบรื่น ชินัตสึจะต้องออกแรงให้มากค่ะ"
212020-92 = "ประธานกรรมการวินัยเองก็คงคาดหวังในตัวชินัตสึไว้สูงค่ะ แน่นอนว่าฉันเองก็เช่นกัน"
212020-93 = "ระ... รุ่นพี่..."
212020-94 = "ไม่มั่นใจเหรอคะ...?"
212020-95 = ""
212020-97 = ""
212020-98 = "มะ... ไม่ใช่ค่ะ ไม่ใช่อย่างนั้น..."
212020-99 = "การปฐมพยาบาล เคลื่อนย้ายผู้ป่วยในภาวะสงคราม การรับมือและส่งเสบียงในสถานการณ์ฉุกเฉิน การผ่าตัดเบื้องต้น"
212020-100 = "ทั้งหมดเป็นสิ่งที่หน่วยแพทย์ฉุกเฉินเคยสอนค่ะ และชินัตสึก็มีประสบการณ์ของตัวเองเสริมด้วย"
212020-101 = "ค่ะ เพราะงั้นฉันเลยไม่กังวลอะไรค่ะ"
212020-102 = "ฉันเชื่อมั่นในตัวชินัตสึค่ะ"
212020-103 = "..."
212020-104 = "รุ่นพี่เซนะ"
212020-105 = "ค่ะ เชิญพูดได้เลย"
212020-106 = "ถ้าเกิดสงคราม แล้วเกเฮนน่าทำลายคิโวทอส..."
212020-107 = "นั่นเป็นสิ่งที่รุ่นพี่ปรารถนาจริงๆ เหรอคะ?"
212020-108 = "รุ่นพี่จะยังภาคภูมิใจในเกเฮนน่าแบบนั้นได้จริงๆ เหรอคะ...?"
212020-109 = "ความยิ่งใหญ่ย่อมมาพร้อมกับการเสียสละค่ะ..."
212020-110 = "มันจะต้องมีผู้เสียชีวิตและบาดเจ็บจำนวนมากเลยนะคะ"
212020-111 = "ไม่ใช่แค่เกเฮนน่า นักเรียนจากโรงเรียนอื่นๆ ก็ด้วย แม้แต่ผู้ที่ไม่เกี่ยวข้องก็ต้องได้รับบาดเจ็บ และได้รับบาดแผลนะคะ"
212020-112 = "รุ่นพี่... ต้องการให้เกิดเรื่องแบบนั้นจริงๆ เหรอคะ?"
212020-113 = ""
212020-115 = ""
212020-116 = "ถ้าจะให้พูดตามตรงแล้วละก็..."
212020-117 = "..."
212020-118 = "โดยส่วนตัวแล้ว ฉันไม่ได้ชื่นชอบเรื่องแบบนั้นค่ะ"
212020-119 = "แต่ไม่ว่าตัวฉันจะชอบหรือไม่ก็ตาม เรื่องนี้มันจะต้องเกิดขึ้นอย่างแน่นอนค่ะ"
212020-120 = "เรื่องอะไรเหรอคะ? สงครามพิชิตที่เกเฮนน่าจะก่อขึ้นน่ะเหรอคะ?"
212020-121 = "ค่ะ เพราะสงครามคือการรักษาพยาบาลในตัวมันเอง"
212020-122 = "เรื่องนั้น... หมายความว่ายังไงคะ?"
212020-123 = "พอพิจารณาระเบียบที่แตกกระจัดกระจายของหลายๆ โรงเรียนในปัจจุบันแล้ว คิโวทอสที่ก่อร่างขึ้น#nบนความไร้ระเบียบนั้นต่างหาก คือผู้บาดเจ็บที่จำเป็นต้องได้รับการรักษาอย่างเร่งด่วนค่ะ"
212020-124 = "การรวมเป็นหนึ่งภายใต้เกเฮนน่า และการสถาปนาระเบียบที่เข้มแข็งต่างหาก คือหนทางเดียวที่จะรักษาคิโวทอสได้ค่ะ"
212020-125 = "เมื่อกี้ชินัตสึพูดถึงผู้เสียชีวิตกับบาดเจ็บสินะคะ สิ่งเหล่านั้นก็เหมือนเลือดที่ออกระหว่างการผ่าตัดค่ะ"
212020-126 = "ถ้ากลัวเลือดออกจนล้มเลิกการผ่าตัด อาการของผู้ป่วยก็จะทรุดหนักจนไม่อาจแก้ไขได้อีก#nชินัตสึก็รู้อยู่แล้วไม่ใช่เหรอคะ?"
212020-127 = ""
212020-129 = ""
212020-130 = "ดูเหมือนจะมีเรื่องให้กังวลใจมากเลยนะคะ ชินัตสึ..."
212020-131 = "รุ่นพี่..."
212020-132 = "..."
212020-133 = "อ๊ะ ฉันกำลังจัดรายการยาที่จำเป็นอยู่แท้ๆ แต่เผลอหยุดมือไปเสียแล้วค่ะ"
212020-134 = "ถ้างั้น... ไว้เจอกันใหม่นะคะ ชินัตสึ"
212020-135 = "ค่ะ แล้วฉันจะมาใหม่นะคะ รุ่นพี่เซนะ..."
212020-136 = ""
212020-138 = ""
212020-140 = ""
212020-141 = "ชินัตสึ"
212020-142 = ""
212020-144 = ""
212020-145 = "คะ?"
212020-146 = ""
212020-148 = ""
212020-149 = "ฉันหวังว่าชินัตสึจะนำทางหัวใจของตัวเองไปในทิศทางที่ถูกต้องได้นะคะ"
212020-150 = ""
212020-152 = ""
212020-153 = "ค่ะ ฉันจะทำอย่างนั้น..."
212020-155 = "รุ่นพี่เซนะ..."
212020-156 = "แววตาที่ใสบริสุทธิ์คู่นั้น แววตาที่เชื่อมั่นในตัวฉันยังคงไม่เปลี่ยนไปเลย"
212020-157 = ""
212020-159 = ""
212020-160 = "..."
212020-162 = "ไม่ว่ายังไง ฉันจะต้อง... ต้องทำให้เหล่ารุ่นพี่กลับมาเป็นเหมือนเมื่อก่อนให้ได้ค่ะ"
212020-164 = "ตอนต่อไป;ปฏิกิริยาของคณะกรรมการฟื้นฟู"
