[translation]
10053085-3 = "……핫?!"
10053085-4 = "어떻게 된 거지? 분명, 싸움이 일어났던 것까지는 기억이 나는데."
10053085-8 = "응. 너, 싸움 시작하자마자, 혼자 미끄러져서 기절했어."
10053085-9 = "중요한 순간에, 면목이 없군……."
10053085-10 = "그렇다는 것은…… 이 녀석들 전부를, 레나 군 혼자서 해치웠다는 건가?"
10053085-11 = "아니, 왜 그렇게 되는데……. 당연히 대부분 코노카가 했지."
10053085-12 = "응? 농담치고는 짓궂은걸."
10053085-18 = "자~"
10053085-19 = "그러면, 이제 어떻게 혼을 낼까~?"
10053085-24 = "자, 잠깐만! 우리는 항복했잖아! 혹시 비무장한 민간인을 때린다든지, 그런 건 아니지?!"
10053085-25 = "? 당연히 때리지, 뭔 소리래."
10053085-26 = "바, 발키리가 그래도 되는 거야?!"
10053085-27 = "응, 너희 같은 애들한테는 그래도 돼. 이걸 못하면 발키리 안 했지."
10053085-28 = "그리고, 그동안 괴롭힌 것도 있으니까, 그걸로 쌤쌤이 치자고."
10053085-29 = "잠깐! 무슨 소리야! 우리가 괴롭히다니…… 억울해!"
10053085-30 = "전화선이랑, 다리 끊은 거, 너네 아냐?"
10053085-31 = "아…… 그건 우리가 맞긴 한데……."
10053085-32 = "솔직히, 용역 탱크까지 끌고 와서 공격해놓고 억울하다는 건 좀 그렇긴 하다?"
10053085-33 = "넌 누구 편이야!"
10053085-34 = "어쭈, 이것들이 시트콤 찍어?"
10053085-35 = "레나야, 마법 본 적 없댔지? 내가 지금 하나 보여줄게."
10053085-41 = "이건 솔직해지는 마법이라는 거야. 와, 진짜 신기하다, 그치?"
10053085-51 = "아, 아니……요! 진짜로! 하늘에 맹세코!"
10053085-52 = "일단, 부국장을 유인하려고 츠치노코 소문을 퍼트린 것까지는 맞긴 한데……요."
10053085-53 = "진짜로, 진짜로 다른 건 더 안 했단 말이야……요."
10053085-55 = "……잠깐, 방금 뭐라고?"
10053085-56 = "츠치노코 소문을 퍼트린 게 너희라고?"
10053085-58 = "응? 갑자기 뭐야? 너는?"
10053085-60 = "츠치노코가, 없다는 거야?"
10053085-62 = "……? 무슨 당연한 소리를…… 츠치노코 같은 게 어딨어."
10053085-63 = "미신을 잘 믿는 부국장이라면 낚일 줄 알고, 적당히 지어내서 인터넷에 퍼트린 거지."
10053085-64 = "뭐? 이 자식들이 죽을라고, 진짜!!!"
10053085-65 = "아니, 근데요! 상식적으로, 요즘 누가 츠치노코 같은 걸 믿는다고……."
10053085-66 = "그렇다고 속은 쪽이 잘못이라는 것도 진짜 전형적인 가해자 발언이긴 하다."
10053085-67 = "아니, 아까부터 너 누구 편이냐고!"
10053085-73 = "……."
10053085-74 = "……그렇구나. 츠치노코는 존재하지 않는구나."
10053085-75 = "츠바사……?"
10053085-76 = "츠치노코를, 외계인을 찾아낸다면, 어쩌면 그 까다로운 <세미나>도 우리 부를 다시 볼지 모른다고 생각했는데."
10053085-77 = "그러면 다시 함께 부 활동을 할 수 있을지도 모른다고……."
10053085-78 = "……."
10053085-82 = "……아, 아니야! 이런 일이야, 충분히 예상했던 거고!"
10053085-83 = "꼭 츠치노코를 찾아야만 동아리를 부활시킬 수 있는 것도 아니니까…… 응!"
10053085-84 = "[s1] \"좋아, 오늘도 츠치노코를 찾으러 가볼까.\"\n[s2] \"곧 해가 뜰 거 같으니까.\""
10053085-87 = "응? 아니, 선생님. 조금 전에 들었잖아. 츠치노코는 존재하지 않는다고……."
10053085-92 = "응, 분명히 들었어. 자기들이 퍼트렸다고 했지."
10053085-93 = "근데, 착각하지 마. 나는 처음부터 츠치노코 안 믿었거든?"
10053085-94 = "그러니까 바뀐 건 아무것도 없어."
10053085-95 = "레나 군……."
10053085-100 = "아씨…… 내가 이런 전개 좋아하는 건 또 어떻게 알고."
10053085-101 = "어이, 너희들."
10053085-103 = "넵?!"
10053085-104 = "오늘 일은 없던 걸로 해줄 테니까, 일손 좀 거들어야겠다."
10053085-105 = "아니, 츠치노코는 없는……."
10053085-106 = "말귀를 알아먹게 되는 마법이 왼 주먹이었던가, 오른 주먹이었던가……."
10053085-107 = "아, 아닙니다!! 다들 츠치노코를 찾자고!! 산장 주변부터 샅샅이 뒤지는 거다!"
10053085-108 = "비늘 하나도 놓치지 마!"
10053085-114 = "음……."
10053085-115 = "그래도, 역시 이상한데……."
10053085-116 = "[s3] \"왜 그래, 레나?\"\n[s4] \"뭔가 걸리는 점이라도 있어?\""
10053085-119 = "그래서 결국, 사진에 찍혔던 사람은 누구야?"
10053085-120 = "응? 그야 당연히, 전화선 끊고 도망치던 게 우연히 찍힌 거 아니야?"
10053085-121 = "처음에는 나도 그렇게 생각했는데……."
10053085-122 = "쟤네 중에 하얀 옷 입은 애가 없잖아."
10053085-123 = "……엥?"
10053085-127 = "뭐, 뭔가요?! 당신들!"
10053085-128 = "뭐야, 이 녀석. 우리가 싸우는 동안 계속 여기 숨어 있었던 건가?"
10053085-129 = "엄청 수상한데?"
10053085-131 = "[ns5] \"어라, 이 목소리는……?\"\n[ns6] \"설마……?\""
10053085-135 = "부장?!"
10053085-142 = "아, 아하하……. 안녕하세요? 오랜만이네요."
10053085-143 = "[s7] \"미라이가…… 부장……?\"\n[s8] \"설마 했지만, 츠바사의 동아리는…….\""
10053085-150 = "어라? 말하지 않았던가?"
10053085-151 = "나는 <유사과학부>의 부원이야. 엄밀하게 따지자면, '전 부원'이지만……"
10053085-152 = "우리 미라이 부장과는 이미 아는 사이 같네."
10053085-157 = "그, 안다고 할까……? 모르는 편이 나았을 것 같기도……."
10053085-158 = "……유사과학부? 미라이 부장? 들어본 이름인데?"
10053085-159 = "저기~ 혹시나 오해하지 마시라고, 미리 말씀드리자면~"
10053085-160 = "이번에는 진짜로 나쁜 의도 없거든요?"
10053085-161 = "아니, 물론! 평소에도 딱히 나쁜 의도로 접근한 적은 없지만……."
10053085-163 = "아, 기억났다. 수배서에서 봤네. 맞네, 사기꾼이잖아."
10053085-165 = "사, 사, 사기꾼이라뇨! 아직 검증되지 않은 영역의 응용과학을 상품화하여 판매하는 발명가일 뿐이라고요!"
10053085-166 = "……? 게르마늄 팔찌, 옥장판 같은 거 파는 거 아냐?"
10053085-167 = "저희 동아리의 효자 상품이기는 한데……."
10053085-168 = "사기꾼 맞네."
10053085-169 = "그보다 내가 유사과학부한테까지 원한 산 적이 있던가?"
10053085-170 = "네? 무슨 뚱딴지같은 소린가요?"
10053085-171 = "너, 나한테 복수하려고 여기 온 거 아니야?"
10053085-172 = "복수요? 그런 돈도 안 되고, 시간도 아까운 짓을 왜 하나요?"
10053085-173 = "당신도, 세상 모든 것이 자기중심으로 돌아간다고 생각하는 그런 사람인가요? 그거 과대망상증 초기거든요?"
10053085-174 = "그럼 왜 여기 있는데?"
10053085-175 = "그건…… 조금 말하기 곤란하다고 할까……."
10053085-176 = "레나야~ 매직 타임~"
10053085-180 = "잠깐만요! 뭐예요! 다가오지 마세요! 말할게요! 말하면 되잖아요!"
10053085-181 = "이래서 야만적인 체육계는 싫다니까……."
10053085-182 = "일단, 엄밀히 따지면 저도 피해자거든요!"
10053085-183 = "……? 오케이. 더 지껄여봐."
10053085-184 = "그게 말이죠오~……. 이거는 츠바사한테는 비밀로 해줬으면 하는데요……."
10053085-188 = "우연히 아는 사람에게, 그 아이가 잘 모르는 사람들하고 여행을 간다고 들어서……."
10053085-189 = "나쁘다는 뜻은 아니지만, 츠바사는 좀 유별난 편이잖아요? 진지하게 '믿는 쪽'이다 보니, 사회성이 좀 떨어진달까……."
10053085-190 = "그래서, 걱정이 돼서 뒤를 밟았다?"
10053085-191 = "아니, 저도 딱히 이런 시골에 오래 머무를 생각은 없었다고요?! 잘 지내는 것까지만 보고 곧바로 돌아가려 했는데!"
10053085-192 = "무슨 이놈의 촌구석은 핸드폰도 안 되고!"
10053085-193 = "돌아가려 하니까 다리는 끊겨 있질 않나!"
10053085-194 = "게다가 같이 있는 사람은 무슨 발키리 사람이고!!"
10053085-195 = "제가 얼마나 고생한 줄 알아요?!"
10053085-197 = "완전히 적반하장……."
10053085-199 = "그냥 들어와서 도와달라 하면 되잖아?"
10053085-200 = "어떻게 그래요! 저도 나름 부장인데! 존경받는 입장이란 말이라고요!"
10053085-202 = "그 말을 하는 시점에서, 별로 존경스럽지는 않은 거 같은데……."
10053085-203 = "그러면, 결국, 이 사진에 찍혀 있던 하얀 인물은……."
10053085-204 = "무슨 사진이요? ……아, 그거 저네요. 갑자기 창문을 열어서 얼마나 놀랐는지."
10053085-205 = "이 무슨 허무한 결말……."
10053085-210 = "누님, 이 녀석은 어떻게 할까요? 묶어둘까요?"
10053085-211 = "네? 갑자기요?!"
10053085-212 = "아니, 너, 사기꾼이라며. 심지어 수배서에도 실려 있다며."
10053085-213 = "조금 전의 가슴 아픈 일화를 듣고도 그럴 생각이 드나요?! 당신들에게는 사람의 마음이 없는 건가요?!"
10053085-218 = "음……. 뭐, 내비둬."
10053085-219 = "난 별로 성실하지 않아서, 수배서 구석에 있는 잡범 이름 하나하나까지 기억하지 않거든? 그리고 휴가 중이고."
10053085-220 = "부원이 걱정되어서 쫓아왔다는 부장? 이름은, 글쎄, 모르겠네."
10053085-221 = "[s] \"정말로, 괜찮아?\""
10053085-222 = "뭔 소림까, 당연히 안 되죠. 원칙대로면 바로 체포임다."
10053085-224 = "윽……!"
10053085-229 = "근데요."
10053085-230 = "저는 원래 규칙 같은 거 안 지킴다."
10053085-231 = "아, 이거 누님께는 비밀로 부탁드림다?"
10053085-232 = "봐, 봐주겠다고요?"
10053085-233 = "봐주는 게 아니라, 못 본 셈 치는 거고……."
10053085-234 = "그러다가 나중에 뒤통수 치는 거는……."
10053085-235 = "……? 아씨, 한 번 봐줬으면 눈치껏 사려야지. 뭘 잘했다고 자꾸 말대꾸를?"
10053085-236 = "아, 아니요……. 죄송합니다."
10053085-239 = "저기, 뭔가 엄청 길게 대화하는 것 같던데……."
10053085-240 = "아, 아뇨! 그냥! 그, 뭐라고 할까!"
10053085-241 = "아, 츠치노코! 저도 츠치노코를 찾으러 와서요! 그래서 한동안 이 산장에 머무를까 하고……."
10053085-242 = "어, 진짜?! 그러면 예전처럼 다시 부 활동할 수 있는 거야?"
10053085-243 = "아, 아니요. 그거는 조금 어렵다고 할까…… 일단, 저는 도망자 신세고, 유사과학부는 제대로 찍혀 있어서……."
10053085-247 = "그래도, 뭐."
10053085-248 = "앞으로 가끔, 이렇게 얼굴 정도는 보러 올지 모르겠네요."
10053085-253 = "……!"
10053085-254 = "……어쩌면."
10053085-255 = "지금까지 츠치노코를 찾는 모험이야말로, 진정한 츠치노코였을지도."
10053085-260 = "……? 그게 뭔 소리래?"
