10053085-74 = "อย่างนี้สินะ... สึจิโนโกะไม่มีอยู่จริงสินะ"
10053085-75 = "สึบาสะ...?"
10053085-76 = "ฉันนึกว่าถ้าเจอสึจิโนโกะหรือมนุษย์ต่างดาวละก็ <เซมิน่า> ที่จู้จี้จุกจิกก็อาจจะมองชมรมของเราใหม่#nก็ได้น่ะ"
10053085-77 = "และถ้าอย่างนั้นก็อาจกลับมาทำกิจกรรมของชมรมด้วยกันได้อีกครั้ง..."
10053085-78 = "..."
10053085-79 = ""
10053085-81 = ""
10053085-82 = "ชะ... ช่างเถอะ! เรื่องแบบนี้น่ะฉันพอคาดการณ์ไว้แล้วละ!"
10053085-83 = "ไม่ใช่ว่าฉันต้องตามหาแต่สึจิโนโกะเพื่อฟื้นฟูชมรมกลับมาสักหน่อย... อื้อ!"
10053085-84 = "[s1] \"งั้นวันนี้เราก็ไปตามหาสึจิโนโกะด้วยกันเถอะ\"\n[s2] \"งั้นเราก็ไปตามหาสึจิโนโกะก่อนจะมืดค่ำกันเถอะ\""
10053085-87 = "หืม? อะไรน่ะ คุณครู ก็เพิ่งได้ยินไปเมื่อกี้เองไม่ใช่เหรอ สึจิโนโกะไม่มีอยู่จริงหรอก..."
10053085-88 = ""
10053085-90 = ""
10053085-91 = ""
10053085-92 = "อื้อ ได้ยินเต็มสองหูเลยละ พวกนั้นบอกว่าเป็นคนปล่อยข่าวลือไปเอง"
10053085-93 = "แต่ก็อย่าเข้าใจผิดนะ ฉันไม่ได้เชื่อในสึจิโนโกะตั้งแต่แรกอยู่แล้ว"
10053085-94 = "เพราะงั้นก็ไม่ได้มีอะไรเปลี่ยนแปลงหรอก"
10053085-95 = "เรนะ..."
10053085-96 = ""
10053085-98 = ""
10053085-99 = ""
10053085-100 = "ให้ตายสิ... รู้ได้ยังไงนะว่าฉันชอบพล็อตแบบนี้"
10053085-101 = "นี่ พวกเธอ"
10053085-103 = "คะ?!"
10053085-104 = "ฉันจะหยวนๆ ให้ว่าเรื่องวันนี้ไม่เคยเกิดขึ้น แต่คงต้องให้มาช่วยงานอะไรหน่อยแล้วละ"
10053085-105 = "แต่ว่า สึจิโนโกะมันไม่มีอยู่จริง..."
10053085-106 = "เวทมนตร์ที่ทำให้คนพูดรู้เรื่อง มันต้องออกหมัดซ้ายหรือหมัดขวาก่อนนะ..."
10053085-107 = "มะ... ไม่มีอะไรค่ะ!! ทุกคน มาตามหาสึจิโนโกะกัน!! เริ่มจากหาตามพื้นที่รอบๆ บ้านพักก่อนเลย!"
10053085-108 = "หาให้ทุกระเบียดนิ้วเลยล่ะ แค่เกล็ดอันเดียวก็อย่าให้หลุดรอดสายตาไปได้!"
