10053085-114 = "อืม..."
10053085-115 = "ถึงยังไงมันก็แปลกอยู่ดีนะ..."
10053085-116 = "[s3] \"ทำไมเหรอ เรนะ?\"\n[s4] \"ตะหงิดใจเรื่องไหนเหรอ?\""
10053085-119 = "ถ้างั้นคนที่ติดมาในรูปถ่ายคือใครเหรอ?"
10053085-120 = "หืม? ก็น่าจะเป็นคนที่ตัดสายโทรศัพท์แล้ววิ่งหนีไป แล้วบังเอิญโดนกล้องจับภาพได้หรือเปล่า?"
10053085-121 = "ตอนแรกฉันก็คิดอย่างนั้นเหมือนกัน..."
10053085-122 = "แต่ในบรรดาคนพวกนั้น ไม่มีใครใส่ชุดสีขาวเลยไม่ใช่เหรอ?"
10053085-123 = "เอ๋...?"
10053085-124 = ""
10053085-126 = ""
10053085-127 = "อะ... อะไรกันคะ?! พวกคุณ!"
10053085-128 = "อะไรของเธอเนี่ย มาซ่อนตัวอยู่ที่นี่ตลอดเวลาที่พวกเรามีเรื่องกันเลยเหรอ?"
10053085-129 = "ทำตัวน่าสงสัยนะ?"
