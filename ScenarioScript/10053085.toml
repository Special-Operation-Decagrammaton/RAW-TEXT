10053085-142 = "อ่า... อะฮ่าฮ่า... สวัสดีค่ะ ไม่ได้เจอกันนานเลยนะคะ"
10053085-143 = "[s7] \"มิไร... คือหัวหน้าชมรมงั้นเหรอ...?\"\n[s8] \"อย่าบอกนะว่าชมรมของสึบาสะก็คือ...\""
10053085-146 = ""
10053085-148 = ""
10053085-149 = ""
10053085-150 = "เอ๋? ฉันยังไม่ได้บอกหรอกเหรอ?"
10053085-151 = "ฉันคือสมาชิก <ชมรมวิทยาศาสตร์เทียม> น่ะ แต่ถ้าจะพูดให้ถูกต้อง ก็ต้องบอกว่าเป็น 'อดีตสมาชิก'..."
10053085-152 = "ดูเหมือนจะรู้จักหัวหน้ามิไรอยู่แล้วเลยนะ"
10053085-153 = ""
10053085-155 = ""
10053085-156 = ""
10053085-157 = "เอ่อ จะบอกว่ารู้จักดีมั้ยนะ...? บางทีการไม่รู้จักน่าจะดีกว่าด้วย..."
10053085-158 = "ชมรมวิทยาศาสตร์เทียม...? หัวหน้ามิไร? เหมือนเคยได้ยินชื่อนี้มาแล้วเลย?"
10053085-159 = "เอ่อ~ ฉันขอแจ้งให้ทราบล่วงหน้านะคะ เผื่อว่าจะเข้าใจผิดกันน่ะค่ะ~"
10053085-160 = "ครั้งนี้ฉันไม่ได้มีเจตนาร้ายอะไรเลยนะคะ"
10053085-161 = "ไม่สิ! แน่นอนว่าปกติฉันก็ไม่เคยเข้าหาใครด้วยเจตนาร้ายอยู่แล้ว..."
10053085-163 = "อ้อ นึกออกแล้ว เคยเห็นจากใบประกาศจับนี่เอง ใช่แล้วละ เธอคือมิจฉาชีพสินะ"
10053085-165 = "มะ... มะ... มาหาว่าเป็นมิจฉาชีพได้ไงคะ! ฉันก็แค่นักประดิษฐ์ที่เอาวิทยาศาสตร์ประยุกต์ที่ยังไม่ได้รับ#nการพิสูจน์มาทำเป็นสินค้าออกจำหน่ายเท่านั้นเองค่ะ!"
10053085-166 = "แต่ที่เธอขายคือกำไลเจอร์เมเนียมกับพวกเสื่อหินหยกไม่ใช่เหรอ...?"
10053085-167 = "นั่นคือสินค้าตัวทำเงินหลักของชมรมเราเลยละ..."
10053085-168 = "เป็นมิจฉาชีพจริงด้วย"
10053085-169 = "แต่ที่สำคัญกว่านั้น ฉันเคยไปก่อเรื่องอะไรให้ชมรมวิทยาศาสตร์เทียมแค้นเคืองด้วยเหรอ?"
10053085-170 = "คะ? ถามอะไรโง่ๆ แบบนั้นล่ะคะ?"
10053085-171 = "เธอไม่ได้มาที่นี่เพื่อแก้แค้นฉันหรอกเหรอ?"
10053085-172 = "แก้แค้นเหรอคะ? ฉันจะไปทำเรื่องที่ทั้งเสียเวลาและไม่ได้เงินทำไมคะ?"
10053085-173 = "หรือคุณก็เป็นพวกที่คิดว่าทุกอย่างในโลกหมุนรอบตัวคุณคะ? นั่นเป็นอาการเริ่มแรกของโรคเพ้อฝัน#nเกินจริงเลยนะคะ?"
10053085-174 = "แล้วทำไมเธอถึงมาอยู่ที่นี่ล่ะ?"
10053085-175 = "เรื่องนั้น... มันค่อนข้างยากที่จะตอบ..."
10053085-176 = "เรนะ~ ได้เวลาเมจิคไทม์~"
10053085-177 = ""
10053085-179 = ""
10053085-180 = "เดี๋ยวก่อนค่ะ! ได้ไงคะ! อย่าเข้ามาใกล้นะคะ! ฉันจะบอกให้เองค่ะ! แค่บอกก็จบเรื่องใช่มั้ยคะ!"
10053085-181 = "เพราะอย่างนี้ละฉันถึงได้เกลียดพวกชอบใช้กำลัง..."
10053085-182 = "อย่างแรกเลย ถ้าพูดกันตามตรง ฉันก็เป็นเหยื่อคนหนึ่งเหมือนกันนะคะ!"
10053085-183 = "โอเค ไหนลองพูดต่อซิ"
10053085-184 = "คือว่า เรื่องนี้น่ะ~ ฉันอยากให้เก็บเป็นความลับต่อสึบาสะน่ะค่ะ..."
10053085-185 = ""
10053085-187 = ""
10053085-188 = "ฉันบังเอิญได้ยินจากคนรู้จักว่าสึบาสะจะไปเที่ยวกับกลุ่มคนที่ไม่ค่อยรู้จักดีนัก..."
10053085-189 = "ฉันไม่ได้บอกว่ามันไม่ดีหรอกนะคะ แต่สึบาสะออกจะพิเศษกว่าคนอื่นอยู่ไม่ใช่เหรอคะ? พอเป็นคนที่ 'เชื่ออะไรเป็นตุเป็นตะ' ทักษะการเข้าสังคมก็เลยไม่ค่อยดีเท่าไร..."
10053085-190 = "ก็เลยเป็นห่วงจนแอบตามมางั้นเหรอ?"
10053085-191 = "เปล่าหรอกค่ะ ฉันก็ไม่ได้คิดจะอยู่ในชนบทแบบนี้นานๆ หรอกค่ะ! ฉันแค่จะมาดูว่าทุกอย่างเรียบร้อยดี#nหรือเปล่า แล้วก็จะกลับไปเลยแท้ๆ!"
10053085-192 = "แต่ที่บ้านนอกๆ นี่ก็ดันไม่มีสัญญาณโทรศัพท์เลย!"
10053085-193 = "แล้วพอจะกลับ สะพานก็ดันมาขาดอีก!"
10053085-194 = "แถมคนที่อยู่ด้วยก็ยังเป็นคนจากวัลคิรี่!!"
10053085-195 = "รู้มั้ยคะว่าฉันลำบากแค่ไหน?!"
10053085-197 = "ทำผิดแล้วยังจะมาโวยวายอีกนะ..."
10053085-199 = "แค่เข้ามาหาแล้วขอให้ช่วยก็ได้ไม่ใช่เหรอ?"
10053085-200 = "จะทำแบบนั้นได้ยังไงล่ะคะ! ฉันเป็นถึงหัวหน้าชมรมทั้งทีนะ! ฉันคือคนที่ควรได้รับความเคารพแท้ๆ!"
10053085-202 = "ดูจากที่พูดมาแล้ว ฉันว่าคุณไม่น่าเคารพเท่าไรนะ..."
10053085-203 = "งั้นสรุปว่ารูปร่างสีขาวที่อยู่ในรูปถ่ายก็คือ..."
10053085-204 = "รูปอะไรเหรอคะ? อ่า... นั่นคือฉันเองสินะคะ ฉันตกใจมากเลยละตอนที่จู่ๆ หน้าต่างก็เปิดออก"
10053085-205 = "เป็นตอนจบที่ไร้ประโยชน์อะไรแบบนี้เนี่ย..."
10053085-206 = ""
10053085-208 = ""
10053085-209 = ""
10053085-210 = "ลูกพี่คะ เอายังไงกับยัยนี่ดีคะ? จับมามัดไว้เลยมั้ยคะ?"
10053085-211 = "คะ? จู่ๆ จะเอาแบบนี้เลยเหรอคะ?!"
10053085-212 = "ก็เธอเป็นมิจฉาชีพไม่ใช่เหรอ แถมยังอยู่ในใบประกาศจับอีก"
10053085-213 = "เพิ่งได้ฟังเรื่องราวที่บีบคั้นหัวใจของฉัน แล้วยังคิดจะทำแบบนั้นอยู่อีกเหรอคะ?! พวกคุณไม่มีหัวใจกันบ้างเลยหรือไง?!"
10053085-214 = ""
10053085-216 = ""
10053085-217 = ""
10053085-218 = "อืม... ปล่อยไปเถอะ"
10053085-219 = "พอดีฉันมันเป็นพวกขี้เกียจซะด้วย ก็เลยจำชื่อนักโทษรายย่อยที่อยู่ในใบประกาศจับไม่ได้ทั้งหมดน่ะ แล้วตอนนี้ก็อยู่ระหว่างลาพักร้อนด้วย"
10053085-220 = "หัวหน้าที่เป็นห่วงสมาชิกชมรมจนแอบตามมาดูงั้นเหรอ? คนนั้นชื่อว่าอะไรนะ อืม ไม่รู้เลยแฮะ"
