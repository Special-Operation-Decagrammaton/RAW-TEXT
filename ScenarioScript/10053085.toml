[translation]
10053085-3 = "……！？"
10053085-4 = "怎麼回事？我記得戰鬥開始了……"
10053085-8 = "嗯，戰鬥一開始，你就自己滑倒昏過去了。"
10053085-9 = "偏偏在關鍵時刻……真是慚愧……"
10053085-10 = "也就是說……這些傢伙全部都是玲奈君一個人解決的嗎？"
10053085-11 = "蛤？為什麼會變成那樣……怎麼想都是木乃香吧。"
10053085-12 = "嗯？這玩笑開得有點過分了哦。"
10053085-18 = "好～"
10053085-19 = "接下來要怎麼教訓你們呢～？"
10053085-24 = "等，等一下！我們投降了不是嗎！#n你難道要對手無寸鐵的平民出手嗎，不可能吧！？"
10053085-25 = "嗯？當然會啊，說什麼傻話呢。"
10053085-26 = "女，女武神可以這樣嗎！？"
10053085-27 = "嗯，對你們這種人可以，不能的話我早就不當女武神了。"
10053085-28 = "而且你們之前搞了我們那麼多次，這樣就扯平吧。"
10053085-29 = "等等！你在說什麼！我們什麼都沒做──冤枉啊！"
10053085-30 = "電話線和橋不是你們弄斷的嗎？"
10053085-31 = "啊……那確實是我們……"
10053085-32 = "說實話，連傭兵坦克都開來了還說冤枉是有點那個？"
10053085-33 = "你到底站哪邊的！？"
10053085-34 = "你們是在說相聲嗎！？"
10053085-35 = "玲奈，你不是說沒見過魔法嗎？我現在給你展示一個。"
10053085-41 = "這是會讓人變誠實的魔法，哇～真的很神奇，對吧？"
10053085-51 = "不，不是我們──！真的！我對天發誓！"
10053085-52 = "首先，為了引誘副局長散布槌之子的謠言是真的……"
10053085-53 = "但是其他事情真的都不是我們……"
10053085-55 = "等等……你剛才說什麼？"
10053085-56 = "散布槌之子謠言的是你們？"
10053085-58 = "嗯？突然怎麼了？你是誰？"
10053085-60 = "槌之子……不存在嗎？"
10053085-62 = "說什麼理所當然的話……？哪有什麼槌之子。"
10053085-63 = "想說相信迷信的副局長會上當就隨便編了個謠言放到網路上。"
10053085-64 = "什麼！？你們這些傢伙是想死嗎！？"
10053085-65 = "但，但是！按常理來說，現在誰還相信什麼槌之子……"
10053085-66 = "話雖如此，被騙的一方也有錯，這也確實是加害者的典型發言。"
10053085-67 = "你從剛才開始到底是站哪邊的！？"
10053085-73 = "……"
10053085-74 = "原來如此……槌之子不存在啊……"
10053085-75 = "翼……？"
10053085-76 = "我原本想說如果能找到槌之子或是外星人的話，那個難搞的「研討會」也許會重新看待我們社團。"
10053085-77 = "這樣的話或許能再一起進行社團活動……"
10053085-78 = "……"
10053085-82 = "……沒，沒事！這種事我早就預料到了！"
10053085-83 = "不一定非得找到槌之子才能復活社團嘛……嗯！"
10053085-84 = "[s1] 「好，今天也去找槌之子吧。」\n[s2] 「太陽也快出來了。」"
10053085-87 = "嗯？你們剛才沒聽到嗎？說是槌之子不存在……"
10053085-92 = "嗯，確實聽到了，說是自己散布的。"
10053085-93 = "但是別誤會，我從一開始就不相信槌之子。"
10053085-94 = "所以根本沒影響。"
10053085-95 = "玲奈君……"
10053085-100 = "唉……你們怎麼知道我喜歡這種展開呢。"
10053085-101 = "喂，你們。"
10053085-103 = "是！！"
10053085-104 = "今天的事就當沒發生過，來幫個忙吧。"
10053085-105 = "可是槌之子根本不存──"
10053085-106 = "能聽話的魔法是左拳還是右拳來著……"
10053085-107 = "啊，不是啦！！大家一起找槌之子！！從山莊周圍開始徹底搜查！"
10053085-108 = "一片鱗片都不要放過！"
10053085-114 = "嗯……"
10053085-115 = "仔細想想還是很奇怪……"
10053085-116 = "[s3] 「怎麼了，玲奈？」\n[s4] 「有什麼在意的地方嗎？」"
10053085-119 = "結果照片裡的人是誰？"
10053085-120 = "嗯？那當然是切斷電話線逃跑時偶然拍到的不是嗎？"
10053085-121 = "一開始我也是這麼想的……"
10053085-122 = "但他們之中沒有穿白色衣服的人啊。"
10053085-123 = "……咦？"
10053085-127 = "等，等一下！！你們是誰啊！！"
10053085-128 = "這傢伙是怎樣，我們打架的時候一直躲在這裡嗎？"
10053085-129 = "超級可疑的。"
10053085-131 = "[ns5] 「咦？這個聲音……？」\n[ns6] 「難道……？」"
10053085-135 = "部長！？"
10053085-142 = "啊，啊哈哈……你好？好久不見呢。"
10053085-143 = "[s7] 「未來是……部長……？」\n[s8] 「雖然有預感，但翼的社團是……」"
10053085-150 = "咦？我沒說過嗎？"
10053085-151 = "我是「疑似科學部」的成員，嚴格來說，是「前成員」……"
10053085-152 = "沒想到老師和未來部長已經認識了。"
10053085-157 = "該說認識……還是不認識比較好……？"
10053085-158 = "疑似科學部……？未來部長？好像在哪聽過……"
10053085-159 = "那個……以防萬一，我先說一下～"
10053085-160 = "我這次真的沒有惡意哦？"
10053085-161 = "不對！平時當然也沒有惡意……"
10053085-163 = "啊，想起來了，我在通緝令上看過，不會錯，是騙子。"
10053085-165 = "騙，騙，騙子什麼的！我只是把尚未驗證領域的應用科學商品化後銷售的發明家而已！"
10053085-166 = "不就是賣鍺手環、玉石床墊之類的嗎……？"
10053085-167 = "那確實是我們社團的暢銷商品……"
10053085-168 = "那就是騙子啊。"
10053085-169 = "話說回來，我什麼時候跟疑似科學部結過仇了？"
10053085-170 = "蛤？你在說什麼？"
10053085-171 = "你不是為了向我報仇才來這裡的嗎？"
10053085-172 = "報仇？我為什麼要做那種不賺錢又浪費時間的事？"
10053085-173 = "你也是那種認為全世界都以自己為中心轉的人嗎？那是誇大妄想症初期哦？"
10053085-174 = "那你為什麼在這裡？"
10053085-175 = "那個……有點難以啟齒……"
10053085-176 = "玲奈～魔法時間到囉～"
10053085-180 = "等一下！你幹嘛！別過來！我說！我說就是了！"
10053085-181 = "所以才討厭這種野蠻的體育系……"
10053085-182 = "首先，嚴格來說我也是受害者！"
10053085-183 = "……？OK，繼續說。"
10053085-184 = "那個……希望可以幫我對翼保密……"
10053085-188 = "這是偶然從認識的人那裡聽說的，聽說那孩子要和不太認識的人去旅行……"
10053085-189 = "不是說這樣不好，但翼比較特別吧？因為是認真的相信那些東西所以社交能力比較差……"
10053085-190 = "所以你因為擔心就跟過來了？"
10053085-191 = "我也沒打算在這種鄉下地方待很久啊！？原本只想確認他過得好就馬上回去！"
10053085-192 = "但這什麼鬼地方連信號都沒有！"
10053085-193 = "想回去的時候橋又斷了！"
10053085-194 = "而且同行的人還是女武神的人！！"
10053085-195 = "你知道我有多辛苦嗎！？"
10053085-197 = "完全是做賊喊抓賊……"
10053085-199 = "直接來說要幫忙不就好了？"
10053085-200 = "怎麼可能做得到！？我好歹也是部長！是受人尊敬的立場耶！"
10053085-202 = "在說出那句話的瞬間好像就已經不太受到尊敬了吧……"
10053085-203 = "所以這照片裡的白色人影是……"
10053085-204 = "什麼照片？……啊，那是我，突然開窗嚇了我一跳。"
10053085-205 = "這什麼奇怪的結局……"
10053085-210 = "大姐，這傢伙怎麼辦？綁起來嗎？"
10053085-211 = "咦？這麼突然！？"
10053085-212 = "你不是騙子嗎？還上了通緝令。"
10053085-213 = "聽了剛才那麼令人心痛的故事還這樣想嗎！？你們沒有人心嗎！？"
10053085-218 = "嗯……算了，不管他了。"
10053085-219 = "我也不是那麼認真的人，不會去記住通緝令角落裡小角色的名字，而且我正在休假中。"
10053085-220 = "擔心成員而追來的部長？叫什麼來著？嗯，不知道呢。"
10053085-221 = "[s] 「真的可以嗎？」"
10053085-222 = "說什麼呢，當然不行，按原則來說應該立即逮捕。"
10053085-224 = "唔……！"
10053085-229 = "但是呢……"
10053085-230 = "我本來就不遵守什麼規則。"
10053085-231 = "啊，這個請對大姐保密哦？"
10053085-232 = "你，你要放過我嗎？"
10053085-233 = "不是放過，是當作沒看到……"
10053085-234 = "但是如果之後變心的話……"
10053085-235 = "嘖，放你一馬就該識相點，怎麼那麼多話？"
10053085-236 = "呃，好的……對不起。"
10053085-239 = "那個……你們好像聊了很久……"
10053085-240 = "沒，沒什麼啦！只是！那個，怎麼說呢！"
10053085-241 = "啊，槌之子！我也是來找槌之子的！所以想在這個山莊住一段時間……"
10053085-242 = "咦！？真的嗎！？那能像以前一樣重新進行社團活動了嗎？"
10053085-243 = "那，那個有點困難……首先，我是逃犯的身份，疑似科學部也被盯上了……"
10053085-247 = "不過……嗯。"
10053085-248 = "以後可能會偶爾像這樣來露露臉。"
10053085-253 = "……！"
10053085-254 = "也許……"
10053085-255 = "到目前為止尋找槌之子的冒險本身，才是真正的槌之子吧。"
10053085-260 = "那是什麼意思……？"
