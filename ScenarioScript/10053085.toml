[translation]
10053085-2 = ""
10053085-3 = "หืม...?!"
10053085-4 = "นี่มันอะไรกัน? ฉันจำได้ว่าเกิดการต่อสู้ขึ้น แต่หลังจากนั้น..."
10053085-5 = ""
10053085-7 = ""
10053085-8 = "อื้อ ทันทีที่เกิดการต่อสู้ เธอก็ลื่นล้มจนหมดสติไปคนเดียว"
10053085-9 = "น่าละอายใจจังที่เอาแต่เป็นแบบนี้ในช่วงเวลาสำคัญๆ..."
10053085-10 = "ถ้างั้นก็แปลว่า... เรนะจัดการเจ้าพวกนั้นทั้งหมดด้วยตัวเองเลยเหรอ?"
10053085-11 = "ไม่หรอก ทำไมถึงเป็นแบบนั้นล่ะ... ส่วนใหญ่เป็นฝีมือของโคโนกะต่างหาก"
10053085-12 = "หืม? พูดเรื่องตลกอะไรเนี่ย"
10053085-13 = ""
10053085-15 = ""
10053085-17 = ""
10053085-18 = "เอาละ~"
10053085-19 = "ถ้างั้นจะให้ดัดนิสัยยังไงดีน้า~?"
10053085-20 = ""
10053085-22 = ""
10053085-23 = ""
10053085-24 = "ดะ... เดี๋ยวก่อน! พวกเราก็ยอมแพ้ให้แล้วไง! เธอคงไม่ทำร้ายชาวเมืองที่ไม่มีอาวุธหรอกใช่มั้ย?!"
10053085-25 = "พูดอะไรเหลวไหล ก็ต้องโดนอยู่แล้วสิ"
10053085-26 = "วะ... วัลคิรี่ทำแบบนี้ได้ด้วยเหรอ?!"
10053085-27 = "อื้อ ได้อยู่แล้ว ถ้าเป็นกับเด็กอย่างพวกเธอน่ะ แล้วถ้าทำไม่ได้ ฉันก็ไม่มาอยู่วัลคิรี่หรอก"
10053085-28 = "แล้วที่ผ่านมาพวกเธอก็แกล้งฉันไว้เยอะเหมือนกัน งั้นครั้งนี้ก็ถือว่าหายกันก็แล้วกันนะ"
10053085-29 = "เดี๋ยวก่อน! พูดอะไรน่ะ! พวกฉันไปแกล้งเธองั้นเหรอ... ไม่ยุติธรรมเลย!"
10053085-30 = "ก็เรื่องสายโทรศัพท์กับสะพานที่ขาด... ไม่ใช่ฝีมือพวกเธอหรอกเหรอ?"
10053085-31 = "อ่า... นั่นเป็นฝีมือของพวกเราก็จริง..."
10053085-32 = "แต่เอาเข้าจริงๆ ถ้าถึงกับเล่นใหญ่เอารถถังรับจ้างไปโจมตีคนอื่น แล้วมาบอกว่าตัวเองไม่ได้รับ#nความยุติธรรม มันก็เกินไปหน่อยนะ?"
10053085-33 = "นี่เธออยู่ข้างใครกันแน่น่ะ!"
10053085-34 = "ดูเข้าสิ นี่พวกเธอกำลังถ่ายละครกันอยู่เหรอ?"
10053085-35 = "เรนะ เคยบอกไว้ว่าไม่เคยเห็นเวทมนตร์ใช่มั้ย? ฉันจะร่ายให้ดูตอนนี้เลย"
10053085-36 = ""
10053085-38 = ""
10053085-39 = ""
10053085-41 = "นี่คือเวทมนตร์ที่ทำให้ยอมพูดความจริงในใจออกมา ว้าว น่าทึ่งจังเลย ว่ามั้ยๆ?"
10053085-42 = ""
10053085-50 = ""
10053085-51 = "มะ... ไม่นะ... คะ! จริงๆ นะ! ฉันขอสาบานต่อหน้าฟ้าดินเลย!"
10053085-52 = "จริงอยู่ที่พวกฉันปล่อยข่าวลือเรื่องสึจิโนโกะเพื่อหลอกล่อรองหัวหน้ากรมฯ... ค่ะ"
10053085-53 = "แต่นอกจากนั้นแล้ว พวกฉันไม่ได้ทำอะไรเลยจริงๆ นะ... คะ"
10053085-55 = "เดี๋ยวก่อน เมื่อกี้ว่าอะไรนะ...?"
10053085-56 = "พวกเธอปล่อยข่าวลือเรื่องสึจิโนโกะงั้นเหรอ?"
10053085-58 = "หืม? จู่ๆ ก็เป็นอะไรของเธอเนี่ย?"
10053085-60 = "ไม่มี... สึจิโนโกะงั้นเหรอ?"
10053085-62 = "มันก็แน่อยู่แล้วไม่ใช่เหรอ... จะไปมีสึจิโนโกะหรืออะไรพรรค์นั้นได้ยังไง?"
10053085-63 = "พวกฉันรู้ว่าคนที่เชื่อเรื่องงมงายอย่างรองหัวหน้ากรมฯ ต้องติดกับแน่ๆ ก็เลยไปแต่งเรื่องมั่วๆ ไว้ในอินเทอร์เน็ตยังไงล่ะ"
10053085-64 = "ว่าไงนะ? ยัยพวกนี้นี่ อยากตายหรือไง จริงๆ เลย!!!"
10053085-65 = "เดี๋ยวสิคะ แต่ตามหลักความเป็นจริงแล้ว! สมัยนี้ยังมีใครเชื่อเกี่ยวกับสึจิโนโกะอีกเหรอ..."
10053085-66 = "แต่การบอกว่าคนที่โดนหลอกเป็นฝ่ายผิด มันเป็นคำพูดคลาสสิกของพวกผู้ร้ายเลยนะ"
10053085-67 = "นี่ ตั้งแต่เมื่อกี้แล้วนะ นี่เธอเป็นฝ่ายไหนกันแน่เนี่ย!"
10053085-68 = ""
