10053085-243 = "ปะ... เปล่าค่ะ เรื่องนั้นมันค่อนข้างยากอยู่นะคะ... อย่างแรกเลย ตอนนี้ฉันอยู่ในสภาพผู้หลบหนี แล้วชมรมวิทยาศาสตร์เทียมก็โดนหมายหัวไว้แล้วด้วย..."
