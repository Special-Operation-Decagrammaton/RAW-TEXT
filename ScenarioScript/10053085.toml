10053085-230 = "ปกติแล้วฉันไม่ค่อยทำตามกฎระเบียบหรอกค่ะ"
10053085-231 = "อ๊ะ เรื่องนี้ขอให้เก็บเป็นความลับกับคุณพี่ให้ด้วยทีนะคะ"
10053085-232 = "จะ... จะปล่อยผ่านให้เหรอคะ?"
10053085-233 = "ไม่ได้ปล่อยผ่าน แต่แค่ทำเป็นไม่รู้ไม่เห็นตั้งแต่แรก..."
