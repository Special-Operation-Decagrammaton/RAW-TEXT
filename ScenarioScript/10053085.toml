[translation]
10053085-2 = ""
10053085-3 = "……哈！？"
10053085-4 = "怎麼回事？我明明記得戰鬥開始了……"
10053085-5 = ""
10053085-7 = ""
10053085-8 = "嗯，是啊。不過戰鬥一開始，你就自己滑倒昏過去了。"
10053085-9 = "偏偏在關鍵時刻……真是慚愧……"
10053085-10 = "也就是說……這些傢伙全部都是玲奈君一個人解決的嗎？"
10053085-11 = "不是，為什麼會變成那樣啦……當然大部分都是木乃香解決的啊。"
10053085-12 = "嗯？這個玩笑實在有點過分了呢。"
10053085-13 = ""
10053085-15 = ""
10053085-17 = ""
10053085-18 = "好～"
10053085-19 = "接下來該怎麼教訓你們呢～？"
10053085-20 = ""
10053085-22 = ""
10053085-23 = ""
10053085-24 = "先，先等一下！我們不是已經投降了嗎！#n總不至於連手無寸鐵的平民都要打吧！？"
10053085-25 = "你在說什麼傻話，當然要打啊。"
10053085-26 = "女，女武神可以這樣嗎！？"
10053085-27 = "嗯，對付你們這種人就沒問題。#n要是不行的話，我早就離開女武神了。"
10053085-28 = "而且你們之前做了那麼多惡作劇，這樣也算是扯平了吧。"
10053085-29 = "等等！你在說什麼！#n對你們惡作劇是什麼意思……冤枉啊！"
10053085-30 = "電話線和橋不是你們弄斷的嗎？"
10053085-31 = "啊……那些確實是我們做的沒錯……"
10053085-32 = "老實說，連坦克都開出來了還喊冤，多少有點說不過去吧？"
10053085-33 = "你到底是哪一邊的啊！？"
10053085-34 = "喂喂，現在是在說相聲嗎？"
10053085-35 = "玲奈，你之前不是說沒有見過魔法嗎？#n我現在示範一個給你看吧。"
10053085-36 = ""
10053085-38 = ""
10053085-39 = ""
10053085-41 = "這是「能讓人變誠實的魔法」哦。是不是很神奇？"
10053085-42 = ""
10053085-50 = ""
10053085-51 = "不，不是我們……！真的不是！我可以對天發誓！"
10053085-52 = "雖然散佈槌之子的謠言，引誘副局長上鉤的確實是我們沒錯……"
10053085-53 = "可是真的，真的只有這樣而已……"
10053085-55 = "等等……你剛才說什麼？"
10053085-56 = "槌之子的謠言是你們散佈的？"
10053085-58 = "嗯？怎麼突然問這個？而且你是誰啊？"
10053085-60 = "所以槌之子……並不存在嗎？"
10053085-62 = "這還需要問嗎……？#n世界上怎麼可能會有什麼槌之子啊。"
10053085-63 = "我們只是覺得迷信的副局長八成會上當，所以才隨便編了個謠言傳到網路上而已。"
10053085-64 = "什麼！？你們這些傢伙真的想找死啊！？"
10053085-65 = "可，可是！從常理來說，現在哪有人會相信槌之子這種東西……"
10053085-66 = "不過「被騙的人也有錯」的確是典型的加害者發言哦。"
10053085-67 = "喂！你從剛才開始到底是哪一邊的啊！？"
10053085-68 = ""
10053085-70 = ""
10053085-71 = ""
10053085-72 = ""
10053085-73 = "……"
10053085-74 = "原來如此……槌之子並不存在啊……"
10053085-75 = "翼……？"
10053085-76 = "本來以為如果能找到槌之子或外星人的話，#n或許那個難搞的「研討會」也會重新審視我們社團的說……"
10053085-77 = "這樣一來，說不定就能再次跟大家一起進行社團活動了……"
10053085-78 = "……"
10053085-79 = ""
10053085-81 = ""
10053085-82 = "……沒，沒關係！這種事我早就預料到了！"
10053085-83 = "而且也不是非得找到槌之子才能讓社團復活嘛……嗯！"
10053085-84 = "[s1] 「好，今天也去找槌之子吧。」\n[s2] 「太陽也快要出來了。」"
10053085-87 = "嗯？可是……老師和大家不是也聽到了嗎？#n槌之子實際上是不存在的……"
10053085-88 = ""
10053085-90 = ""
10053085-91 = ""
10053085-92 = "嗯，確實聽到了。他們說那是編造出來的謠言。"
10053085-93 = "不過你可別誤會了。我打從一開始就不相信什麼槌之子。"
10053085-94 = "所以……那對我來說根本沒有影響。"
10053085-95 = "玲奈君……"
10053085-96 = ""
10053085-98 = ""
10053085-99 = ""
10053085-100 = "唉……你們怎麼知道我就喜歡這種展開呢。"
10053085-101 = "喂，你們幾個。"
10053085-103 = "是，是！？"
10053085-104 = "今天的事情我可以當作沒發生過，你們就留下來幫點忙吧。"
10053085-105 = "可是槌之子根本不存──"
10053085-106 = "「能讓人學會聽話的魔法」是左拳還是右拳來著……"
10053085-107 = "沒，沒什麼！！大家一起來找槌之子吧！！#n從山莊周圍開始徹底搜查！"
10053085-108 = "連一枚鱗片都不能放過！"
10053085-109 = ""
10053085-111 = ""
10053085-112 = ""
10053085-113 = ""
10053085-114 = "唔嗯……"
10053085-115 = "仔細想想還是有點奇怪……"
10053085-116 = "[s3] 「怎麼了，玲奈？」\n[s4] 「有什麼在意的事嗎？」"
10053085-119 = "所以到頭來，照片裡的人到底是誰呢？"
10053085-120 = "嗯？不就是某個傢伙在切斷電話線逃跑的時候，碰巧被我們給拍到了嗎？"
10053085-121 = "我一開始也是這麼想的……"
10053085-122 = "可是他們之中，根本沒有人穿著白色的衣服啊。"
10053085-123 = "……咦？"
10053085-124 = ""
10053085-126 = ""
10053085-127 = "等，等一下！？你們是誰啊！！"
10053085-128 = "這傢伙是怎樣，我們打架的時候一直躲在這裡嗎？"
10053085-129 = "未免太可疑了吧？"
10053085-130 = ""
10053085-131 = "[ns5] 「咦？這個聲音是……？」\n[ns6] 「難道說……？」"
10053085-135 = "部長！？"
10053085-136 = ""
10053085-140 = ""
10053085-141 = ""
10053085-142 = "啊，啊哈哈……大家好呀？好久不見了呢。"
10053085-143 = "[s7] 「未來是……部長……？」\n[s8] 「雖然早有預感，不過翼的社團該不會是……」"
10053085-146 = ""
10053085-148 = ""
10053085-149 = ""
10053085-150 = "咦？我之前沒有說過嗎？"
10053085-151 = "我是「疑似科學部」的部員。#n雖然嚴格來說，應該是「前部員」才對……"
10053085-152 = "沒想到老師和未來部長已經認識了呢。"
10053085-153 = ""
10053085-155 = ""
10053085-156 = ""
10053085-157 = "與其說是認識……感覺不認識的話還比較幸福一點……"
10053085-158 = "疑似科學部……還有未來部長？#n總覺得好像在哪裡聽過……"
10053085-159 = "那個～保險起見，我先澄清一下～"
10053085-160 = "我這次真的沒有惡意哦？"
10053085-161 = "啊，當然平時的我也沒有惡意啦……"
10053085-163 = "啊～我想起來了。#n之前有在通緝令上看過……是個騙子對吧？"
10053085-165 = "騙，騙，騙子什麼的也太難聽了吧！#n我只是把未經驗證的應用科學商品化，並且加以販售的發明家而已！"
10053085-166 = "你不是在販賣什麼鍺手環，或者玉石床墊之類的東西嗎……？"
10053085-167 = "那些確實是我們社團的暢銷商品……"
10053085-168 = "所以就是騙子嘛。"
10053085-169 = "話說回來，我什麼時候得罪過疑似科學部了啊？"
10053085-170 = "什麼意思？怎麼突然說這種莫名其妙的話？"
10053085-171 = "你不是為了向我報仇才跑來這裡的嗎？"
10053085-172 = "報仇？我為什麼要做那種既不賺錢又浪費時間的事啊？"
10053085-173 = "莫非你也是那種「認為全世界都以自己為中心轉動」的人嗎？#n那可是誇大妄想症的初期症狀哦？"
10053085-174 = "那你為什麼會出現在這裡？"
10053085-175 = "這，這個嘛……稍微有點難以啟齒……"
10053085-176 = "玲奈～魔法時間到囉～"
10053085-177 = ""
10053085-179 = ""
10053085-180 = "等一下！你要做什麼！別過來！#n我說！我說就是了嘛！"
10053085-181 = "所以我才討厭跟這種野蠻的體育系打交道啊……"
10053085-182 = "首先，嚴格來說我也是受害者！"
10053085-183 = "……？#nOK，繼續說吧。"
10053085-184 = "事情是這樣的……麻煩幫我向翼保密哦……"
10053085-185 = ""
10053085-187 = ""
10053085-188 = "我偶然從認識的人口中，聽說了那孩子要跟不太認識的人去旅行的事……"
10053085-189 = "雖然不是說這樣不好，但是翼這孩子稍微有點特別對吧？#n畢竟他屬於認真「相信」的那種類型，社交能力相對沒那麼好……"
10053085-190 = "所以你就因為擔心而跟過來了嗎？"
10053085-191 = "我一開始也沒打算在這種鄉下地方待太久啊！？#n本來想在確認他過得好不好之後馬上回去的……"
10053085-192 = "結果這個鬼地方居然連訊號都沒有！"
10053085-193 = "想回去的時候橋又斷了！"
10053085-194 = "而且同行的人還是女武神的人！！"
10053085-195 = "你知道我有多辛苦嗎！？"
10053085-197 = "完全是做賊的人喊抓賊嘛……"
10053085-199 = "直接出面找我們幫忙不就好了？"
10053085-200 = "怎麼可能做得到！#n我好歹也是個部長！處於受人尊敬的立場耶！"
10053085-202 = "在說出那句話的瞬間，感覺就已經不值得尊敬了吧……"
10053085-203 = "所以，那張照片裡的白色人影就是……"
10053085-204 = "照片……？啊～是我沒錯。#n突然開窗真是嚇了我一跳呢。"
10053085-205 = "這樣的結局也太空虛了吧……"
10053085-206 = ""
10053085-208 = ""
10053085-209 = ""
10053085-210 = "大姐，這傢伙該怎麼處置？要先綁起來嗎？"
10053085-211 = "咦？這麼突然！？"
10053085-212 = "你不是騙子嗎？而且還上了通緝令耶。"
10053085-213 = "聽完那麼令人鼻酸的故事還說這種話！？#n你們難道沒有人心嗎！？"
10053085-214 = ""
10053085-216 = ""
10053085-217 = ""
10053085-218 = "唔嗯……算了，隨他去吧。"
10053085-219 = "反正我本來就沒有多勤奮，根本不可能記住寫在通緝令角落的小角色叫什麼名字嘛？#n而且我現在還在休假。"
10053085-220 = "擔心部員而追來的部長？#n名字我好像已經忘記了呢。"
10053085-221 = "[s] 「真的可以嗎？」"
10053085-222 = "怎麼可能，當然是不行啊。#n按照規定應該立即逮捕才對。"
10053085-224 = "唔……！"
10053085-225 = ""
10053085-228 = ""
10053085-229 = "不過呢……"
10053085-230 = "我這個人啊，本來就不太理會什麼規定的。"
10053085-231 = "啊，這點麻煩幫我向大姐頭保密哦？"
10053085-232 = "你，你要放過我嗎？"
10053085-233 = "不是放過，是當作沒看見……"
10053085-234 = "可是，萬一你之後改變心意的話……"
10053085-235 = "喂，都已經放你一馬就識相一點，哪來那麼多問題啊？"
10053085-236 = "好，好的……我很抱歉。"
10053085-238 = ""
10053085-239 = "那個……你們好像聊了很久……"
10053085-240 = "沒，沒什麼啦！只是，那個……該怎麼說呢！"
10053085-241 = "啊，槌之子！我也是來找槌之子的！#n所以才打算在這個山莊稍微住一段時間……"
10053085-242 = "咦！？真的嗎！？#n所以能像以前一樣進行社團活動了嗎？"
10053085-243 = "沒，沒有。那個目前還有點困難……#n畢竟我現在的身分依舊是逃犯，疑似科學部也被盯上了……"
10053085-244 = ""
10053085-246 = ""
10053085-247 = "不過……嗯。"
10053085-248 = "以後可能還會像這樣，偶爾出來露露臉吧。"
10053085-249 = ""
10053085-251 = ""
10053085-252 = ""
10053085-253 = "……！"
10053085-254 = "或許……"
10053085-255 = "至今為止追尋槌之子的這場冒險，才是真正的槌之子也說不定。\n這場為了尋找槌之子而經歷的冒險，才是真正的槌之子也說不定呢。"
10053085-256 = ""
10053085-258 = ""
