10053085-240 = "ปะ... เปล่าค่ะ! ไม่มีอะไรค่ะ! เอ่อ จะว่ายังไงดีนะ!"
10053085-241 = "อ้อ สึจิโนโกะ! ฉันก็มาตามหาสึจิโนโกะเหมือนกันค่ะ! ก็เลยคิดว่าจะพักที่บ้านพักหลังนี้หน่อย..."
