[translation]
10008130-1 = "제13화;다 함께 새해 소원을"
10008130-2 = "(새해 첫날부터 수많은 소동이 있었지만, 시간이 지나면서 차츰 대강의 혼란은 수습이 되기 시작했다.)"
10008130-6 = "오늘 하루 있었던 대사건! 대길전의 진실!"
10008130-7 = "그리고 검은거북파라는 조직에 관한 진실까지!"
10008130-8 = "그 진실에 대해! 오늘 이렇게 혼란을 바로잡기 위해 새해 첫날부터 출동하여 열심히 활약 중이신 게헨나 선도부원의 답변을 들어보도록 하겠습니다!"
10008130-12 = "이번 사건에 대해 어떻게 생각하시나요?!"
10008130-13 = "응? 이, 인터뷰라고?"
10008130-14 = "아니, 그보다……. 난 이제 그만 돌아가서 쉬고 싶은데……."
10008130-16 = "(크로노스 스쿨 보도부에 의해 검은거북파의 범죄에 대한 진상은 곧 전파를 타고 키보토스 전역에 폭로되었다.)"
10008130-17 = "(게헨나 선도부의 활약으로 검은거북파 조직의 보스까지 잡히며 검은거북파는 대부분의 병력이 괴멸되어 뿔뿔이 흩어지게 되었고.)"
10008130-18 = "(그렇게 모든 것들이 다시 정상으로 돌아가게 되었다.)"
10008130-22 = "아니! 인정할 수 없어!"
10008130-23 = "맞아! 새전함이 전부 거짓이었다니! 그 말을 듣고 납득할 수 있겠냐?!"
10008130-24 = "새로운 헬멧을 사려는 우리의 꿈! 물어내!"
10008130-28 = "……어째서 무녀 알바생이 이런 뒷정리까지 해야 하는 거냐고……."
10008130-29 = "[s] \"뭐, 도와줄 테니까.\""
10008130-33 = "으으! 진짜……!"
