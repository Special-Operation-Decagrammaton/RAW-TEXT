[translation]
10012040-1 = "제4화;선생님을 구하러 왔답니다"
10012040-2 = "어떻게 된 거야? 이야기했던 거랑 다르잖아!!"
10012040-4 = "뭐라고 변명이라도 해 보라고! 왜 말이 없어?"
10012040-5 = "강하다는 소문은 다 헛소문이었던 거야? 사실 그냥 사기꾼이었던 거야? 엉?"
10012040-11 = "듣고 있는 거 같지도 않은데요……."
10012040-12 = "이건 뭐, 거의 우리가 돌봐 줘야 할 상태 같은걸……."
10012040-16 = "……."
10012040-17 = "선생님……. 선생님이 어째서 여기에 계신 걸까요……?"
10012040-18 = "분명 여기는……. 소유권을 차지하기 위해 이런저런 집단들이 몰려든 곳이라 들었는데……."
10012040-19 = "어이, 듣고 있어? 듣고 있냐고! 와카모!!"
10012040-20 = "선생님께서 그런 일에 가담하실 리는 없고……. 그렇다면……."
10012040-21 = "설마……. 선생님께서……. 납치라도 당하신 걸까요……?"
10012040-23 = "이봐. 또 뭐라고 혼자 중얼거리고 있는 거야?"
10012040-25 = "……!!"
10012040-26 = "……가능해요. 상냥하신 선생님이라면 못된 여우들에게 속아 충분히 있을 수 있는 일……!"
10012040-27 = "……와카모!!"
10012040-28 = "……야 해요……."
10012040-29 = "……응? 뭐라고?"
10012040-30 = "……가야 해요……. 선생님을……."
10012040-31 = "구해야 합니다……!!"
10012040-33 = "……? 무슨 말이지? 선생님? 선생님이라면……."
10012040-34 = "아까 거기서 본 어른 말하는 건가?"
10012040-35 = "그게 무슨 소리야? 그 사람은 적이잖아? 적을 왜 구하러 가?"
10012040-37 = "……? 네?"
10012040-38 = "지금 뭐라고 하셨죠? 누가 적……이라고요?"
10012040-39 = "설마 그건……. 선생님에 대한 이야기……인가요?"
10012040-40 = "응?? 당연하지, 달리 누가 있어?"
10012040-46 = "어라, 잠깐만요. 뭔가 분위기가 이상해지지 않았나요……?"
10012040-47 = "그러게. 지금까지의 어벙한 느낌과는 많이 다른 것 같기도……."
10012040-48 = "그게 무슨 소리야?"
10012040-49 = "……어어? 너, 갑자기 왜 그런 눈으로 날……."
10012040-51 = "후후, 후후후……."
10012040-52 = "선생님에 대해……. 그런 식으로 말하시는 건……."
10012040-53 = "아무래도……. 이건 계도가 필요하겠군요."
10012040-55 = "……응? 계도?"
10012040-56 = "계도가 무슨 뜻이야?"
10012040-58 = "후후……."
10012040-62 = "……지금부터 제가……."
10012040-72 = "그 가여운 머리에 직접 새겨드리도록 하죠."
10012040-85 = "쏴아아아아-!!"
10012040-91 = "……후. 여기 구해 왔어. 소라와 전복……. 미역도 있어."
10012040-92 = "지, 진짜 엄청난 양……. 이런 거 보면 진짜 대단하다니까."
10012040-93 = "수고하셨어요, 선배. 여기 따오신 것들 보관할 통이에요."
10012040-94 = "응……. 고마워."
10012040-99 = "……그나저나 저희들, 어느새 다시 여기로 돌아왔네요."
10012040-100 = "직전에 그런 일이 있었는데도……."
10012040-102 = "그러게요. 설마 우리 말고도 사람이 있었을 줄이야……."
10012040-103 = "오히려 그런 일들이 있었으니까 다 같이 온 거잖아. 또 급습 같은 거 당하면 어쩌려고."
10012040-104 = "그 녀석들만 없었다면 전기실 팀 따로, 식량 팀 따로 나뉘었을 테지만……."
10012040-105 = "정말이지, 헬기 추락에 리조트 복구에 이번에는 싸움질이라니. 산 넘어 산이네."
10012040-106 = "우리도 굳이 '다시 여기로' 와서 일정을 강행하고 있고……."
10012040-108 = "…………."
10012040-109 = "……괜찮을까요? 그 와카모라는 사람, 평범한 사람은 아닌 것 같은데……."
10012040-110 = "아니. 일정대로 진행하면 돼. 괜히 바꿀 필요 없어."
10012040-111 = "또 찾아오면, 또 상대해 주면 그만."
10012040-112 = "그, 그렇게 간단한 문제만은 아닐지도……."
10012040-113 = "……다시 다녀올게."
10012040-122 = "……으음……."
10012040-123 = "……어쩔 수 없어. 저기까지 간 선배는 막기 힘든 거 알잖아."
10012040-124 = "[s1] \"……뭔가 피하면 지는 거라고 생각하는 거 같네.\"\n[s2] \"시로코답다면 시로코답달까…….\""
10012040-127 = "뭐 어때~. 젊을 땐 원래 다 그런 거야. 일부러 힘든 길로 가기도 하는 법이라고-."
10012040-128 = "낚싯대가 없으면 다이빙으로 잡아 오면 된다……라고까지 하셨었죠……."
10012040-129 = "그래도 덕분에 실제로 이렇게 많이 구해 왔으니까요. 물고기도 잡고, 전복도 따고……."
10012040-130 = "게다가 어쩌면 그 분들과도 대화로도 잘 해결될 수도 있는 일 아닐까요?"
10012040-131 = "리조트는 넓으니까요! 사이 좋게 나눠서 같이 쓴다던가……?"
10012040-132 = "이미 두 번이나 한바탕해 놓고 이제 와서 그게 될까 싶지만 말이지."
10012040-133 = "그치만 아예 불가능한 이야기는 아닐지도……."
10012040-134 = "친하게……까진 어렵더라도, 서로의 장소를 정한다던가 하는 식으로 말이죠."
10012040-135 = "조금 마음에 걸리는 건……. 그 와카모라는 사람인데……."
10012040-136 = "[s3] \"마음에 걸리는 거?\"\n[s4] \"걱정되는 거라도 있어?\""
10012040-137 = "아뇨. 그냥 조금……. 기분 탓일 지도 모르겠지만……."
10012040-138 = "아뇨. 그냥 조금……. 기분 탓일 지도 모르겠지만……."
10012040-139 = "시로코 선배와 그 사람을 대면시키는 게, 그렇게 좋은 일은 아닐 거 같아서……."
10012040-140 = "여기 있었구나, 이 녀석들!"
10012040-141 = "……아."
10012040-142 = "[s5] \"훌륭한 타이밍인걸.\"\n[s6] \"뭐도 제 말 하면 온다더니…….\""
10012040-143 = "뭐야, 진짜 또 온 거야? 질리지도 않는 모양이네."
10012040-144 = "뭐야, 진짜 또 온 거야? 질리지도 않는 모양이네."
10012040-145 = "……저 사람이야? 그 와카모라는……."
10012040-146 = "이제 걱정 마세요, 선생님! 저 와카모가……. 당신을 구하러 왔답니다!!"
10012040-147 = "……응. 저 사람이야."
10012040-148 = "……어라."
10012040-149 = "그런데 뭔가 방금……. 말이 이상하지 않았……어?"
10012040-150 = "……? 그러게? 선생님을 '구하러 왔다'니……?"
10012040-156 = "정체 불명의 악당들에게 붙잡혀서, 납치된 인질로 이렇게 먼 곳까지 끌려 오시다니……."
10012040-157 = "저 와카모가 곁에 있었다면 애당초 이렇게 되지 않았을 텐데!"
10012040-158 = "늦어서 송구하기 그지없습니다."
10012040-159 = "하지만 이제라도,"
10012040-160 = "이 제가 선생님을 구해드리겠어요."
10012040-168 = "……엉?"
10012040-169 = "……아아. 그런 거였어? 우리 납치범이었구나?"
10012040-170 = "으헤~. 이 아저씨는 그것도 모르고 있었구만."
10012040-171 = "맞아요~. 사실 무서운 사람들이라구요~☆"
10012040-172 = "뭘 납득하고 앉았어!? 쓸데없는 소리 하지 말라고!! 오해를 키우잖아!!"
10012040-174 = "자, 잠깐만요! 여러분! 다짜고짜 싸우기 전에 우선 대화를……!"
10012040-175 = "맞아요! 리조트는 넓으니까, 다 같이 즐겨도 충분한 공간이……."
10012040-177 = "……대화?"
10012040-178 = "우후훗……. 대화……. 좋지요. 대화……. 대화……."
10012040-179 = "전원 공격하세요!! 선생님은 제가 직접 구해드리겠습니다!!!"
10012040-180 = "……대화는!?"
10012040-182 = "와, 와아……! 고, 공격! 공겨어어억-."
10012040-183 = "고, 공겨억……!"
10012040-184 = "저희 어쩌다가 이렇게 돼 버린 거죠, 대장……?"
10012040-185 = "모, 몰라. 시끄러워……! 일단 시키는 대로 해!"
10012040-186 = "공격! 공겨어어억-!!"
