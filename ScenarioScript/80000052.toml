[translation]
80000052-1 = "스컬맨 변신!"
80000052-5 = "……왔군. 선생님. 미행은 없겠지?"
80000052-10 = "응? 어째서 이런 곳으로 불러낸 거냐고?"
80000052-11 = "간단한 이유야. 무방비한 상태가 되는 걸, 적에게 들킬 수는 없기 때문이지."
80000052-12 = "무, 물론 너무 그런 걸 신경 쓸 필요 없다는 걸 선생님이 늘 말해주긴 했지만……."
80000052-13 = "그래도 지금은 달라. 그런 걸 신경 쓰지 않는 걸 신경 쓰는 것 또한……. 하고 싶지 않으니까."
80000052-14 = "……뭐, 뭔가 말하고 보니 이상하군. 이해가 돼? 선생님……?"
80000052-15 = "[s1] \"물론 이해하고 있어.\"\n[s2] \"알지, 알지. 그런 느낌.\""
80000052-16 = "으음. 정말 이해한 건가……."
80000052-17 = "으음. 정말 이해한 건가……."
80000052-18 = "음. 뭐, 아무래도 상관없어. 요지는 보다 사적이고 은밀한 환경을 구축하고 싶었던 거니까."
80000052-19 = "그리고 다행히도 목표한 분위기는 잘 구축된 것 같아. 그럼 이제……."
80000052-23 = "……선생님. 이걸 받아줬으면 해."
80000052-25 = "[s3] \"이건……!\"\n[s4] \"이건……?\""
80000052-26 = "……훗."
80000052-27 = "……훗."
80000052-28 = "역시 아무리 선생님이라도 놀라는군. 선생님이라면 알아줄 거라 생각했어."
80000052-29 = "이……. 죽음의 사신, 스컬맨의 귀여움을……!"
80000052-30 = "오늘 같은 날이니 특별히 주는 거야. 이건 한정품이라, 더 구할 수 없는 거라고 했으니까."
80000052-31 = "선생님이 아니라면 누구에게도 양보하지 않았을 테지만……. 그래도 선생님께는 그동안 많은 걸 받았으니까."
80000052-32 = "알았지? 아주 귀하게 구한 거라고. 선생님이라면 그 가치를 알아봐 줄 거라 믿고 있어."
80000052-33 = "……응? 어……?"
80000052-37 = "서, 선생님!?"
80000052-38 = "뭐, 뭐 하는 거야! 그렇게 순식간에 먹어버리면……!"
80000052-39 = "말했잖아! 이제는 구할 수 없는 초콜릿이라고! 그게 끝이란 말이야! 좀 더 살펴봤어야……!"
80000052-40 = "[s5] \"크크, 이걸로 오늘은 내가 스컬맨이다!\"\n[s6] \"후후……. 스컬맨은 이 안에 있다!\""
80000052-41 = "……!?"
80000052-42 = "……!?"
80000052-43 = "서, 선생님……?"
80000052-44 = "……."
80000052-45 = "……풋."
80000052-46 = "푸훗. 푸후훗……."
80000052-47 = "……이해했다. 그렇군. 역시 선생님께 가져온 보람이 있었어."
80000052-48 = "좋아. 그럼 그렇게 된 이상, 오늘 하루는 선생님이 나의 스컬맨이 돼줘야겠어."
80000052-49 = "……그럼 돌아가자. 스컬맨."
80000052-50 = "선생님이 스컬맨이 된 이상, 더는 이렇게 은신해 있을 필요도 없을 테니까."
80000052-56 = "(이후 아즈사를 따라가, 한동안 어울려주며 시간을 보냈다.)"
