[translation]
10038045-4 = "정문으로부터의 보고입니다. 습격 인원은 둘. 아직까지는 큰 문제가 없다고 합니다."
10038045-9 = "그런가. 여기도 문제는 없다. 이것으로…… 일단, 완성이다."
10038045-10 = "이것이……?!"
10038045-11 = "그래……. 이것이다. 이것을 위해 나는 여기에 돌아왔으니……."
10038045-12 = "길었구나. 정말로 길었어."
10038045-13 = "그렇, 다면. 저에게도……?"
10038045-14 = "아하. 그것을 기다리고 있었느냐? 쿡쿡쿡쿡……"
10038045-15 = "걱정하지 말거라. 그것은 분명히 우리의 약속이었지. 그리고 나는 약속을 지키는 사람이다."
10038045-19 = "선단(仙丹)은, 분명히 네 몫까지 만들어 두었으니 말이다."
10038045-21 = "이것으로, 저희는 선인(仙人)으로 보다 한 걸음……!"
10038045-22 = "그렇지. 모든 것을 초월한 선인(仙人)이 되는 것. 그것이 우리 연단방의 설립 목표였다."
10038045-23 = "심지어 그 사야마저도 그 목표를 잊지 않고 있었던 모양이었으니."
10038045-27 = "……."
10038045-28 = "그러고 보니, 산해경은 지금 월영제가 한창이던가?"
10038045-29 = "한창…… 까지는 아닙니다. 원래대로라면 축제 준비로 부산했어야 했겠지만……."
10038045-30 = "그렇군, 그렇군. 나의 어린이 병 때문에 어수선한 분위기라는 의미인가. 의도한 대로이기는 하지만 말이지."
10038045-31 = "……."
10038045-32 = "공교롭구나. 그렇게 생각되지 않는가?"
10038045-36 = "어떤 부분이…… 말씀이십니까?"
10038045-37 = "월영제에는, 또 다른 구전이 전해지지."
10038045-38 = "달로 떠났던 선인(仙人)이 이 땅으로 돌아와, 덕을 베풀고 도를 일깨운 뒤 다시 떠난다는 이야기 말이다."
10038045-39 = "거기에는 잘 알려지지 않은 다른 측면도 숨어 있지. 너는 알고 있는가?"
10038045-40 = "……가르침을 청합니다."
10038045-41 = "뭐, 대단한 이야기는 아니다. 그저 결과적으로 세상에 평지풍파를 일으킨 선인(仙人)을, 결국 괴롭히고 핍박한 끝에 내쫓았다는 정도의 이야기지."
10038045-42 = "그렇다면, 선인(仙人)이 다시 달로 돌아간 것은, 어쩌면……?"
10038045-43 = "그런 것이지. 땅에서의 삶이 흡족했다면, 무엇 때문에 다시 돌아갔겠는가."
10038045-44 = "이야기가 지나치게 길어졌구나. 그러면 선단(仙丹)을 복용해 보도록 할까."
10038045-49 = "심려치 말거라. 내가 먼저 복용하도록 할 테니까."
10038045-54 = "그러면 저도……."
10038045-65 = "읏……?!"
10038045-71 = "후우……. 약효도 지나치면, 독이 되는 법이라 하지……."
10038045-77 = "버텨내지 못하였는가……. 그것은 유감이구나."
10038045-78 = "후후. 후후후후……."
10038045-82 = "아아, 느껴진다. 피가 온몸을 돌고, 활력이 샘솟기 시작하는구나."
10038045-83 = "슬슬 진짜 손님이 도착했을 시간이니, 연단방의 주인 된 자로서 직접 마중을 나가야겠지."
10038045-87 = "기다리고 있었다. 키사키."
10038045-88 = "부탁이니, 나를 너무 실망시키지는 말아 다오."
