[translation]
221130-1 = "제13화;마지막 항해"
221130-10 = "안녕하세요, 크로노스 채널의 시청자 여러분! 카자마키 마이입니다!"
221130-11 = "이른 새벽 시간입니다만, 저희는 현재 오디세이아의 선단이 정박 중인 아오하마 항의 부두에 나와 있는데요!"
221130-12 = "저희 크로노스 보도부에서 극비 입수한 정보에 의하면, 오디세이아 해양학원의 학생회라 할 수 있는 <아일랜드>가 단독으로 출항 준비를 하고 있다고 합니다!"
221130-13 = "그 말이 사실이라는 것을 증명하기라도 하듯, 기함 <올림포스 호>는 현재 출항 준비를 위해 현문을 철거하고, 닻을 올린 상태입니다."
221130-14 = "정기 항해에서 돌아온 오디세이아의 선박이 한 달도 되지 않아 다시 출항을 하는 것은, 그간의 기록에서도 전례를 찾을 수 없는 특별한 경우입니다!"
221130-15 = "이로 인해 SNS에서는 출항 이유를 두고 여러가지 추측이 쏟아지고 있는데요……"
221130-16 = "혹시 얼마전 오디세이아 학원을 특별 방문했던 샬레의 선생님과 총학생회장과 관련이 있는 건 아닐까요?"
221130-17 = "오디세이아 학원에서 정식 발표가 나올 때까지 알 수는 없겠지만, 저희는 이곳에서 계속 취재를 이어가며 새로운 정보가 들어오는 대로—"
221130-21 = "(소근) 선배, 속보입니다."
221130-25 = "앗, 말씀드리는 순간 속보입니다!"
221130-26 = "방금 크로노스 호에서 항만관리국에 정식으로 출항 사유를 전달했다고 합니다."
221130-27 = "이번 출항의 목적은 다름 아닌…… <친구의 배웅을 위해> 라는데—"
221130-31 = "……응? 배웅이라니, 이게 무슨 소리죠?"
221130-32 = "오디세이아 학생 중 누군가 따로 바다에 나갈 일이 생기기라도 한 걸까요……?"
221130-34 = "아일랜드 기함 <크로노스 호>, 제 1 선교"
221130-37 = "출항 5분전!"
221130-43 = "현 시각을 기하여 함내 방송 현문에서 함교로 이동."
221130-49 = "현문 철거 완료했습니다!"
221130-50 = "좋아, 총원 계류삭 걷어."
221130-51 = "총원, 계류삭 걷어!"
221130-56 = "출항!"
221130-66 = "역시 방파제를 넘어가기만 해도 바다의 색이 확 달라지네."
221130-71 = "………냐아."
221130-75 = "보이지, 새미?"
221130-76 = "바다야. 네가 늘 지켜보던 그 키보토스의 바다."
221130-77 = "물론 항해 때와는 달리 올림포스 호 근처에 있던 다른 배들이 보이지 않으니, 평소의 풍경과는 조금 다르겠지만……"
221130-78 = "일단은 이걸로 봐 줄 수 없을까?"
221130-83 = "………끼잉."
221130-84 = "왜 자꾸 현측 창문을 열고 싶어 하는 거야?"
221130-85 = "그러니까 그곳에는 망망대해만 있지 아무것도 없다니까—"
221130-89 = "어라? 저 배는……"
221130-94 = "함장님, 여객관리부 기함, <골든 엘리시움>에서 교신 중계 요청입니다!"
221130-98 = "호출 승인해."
221130-103 = " ……교신 연결 요청 승인되었습니다. 바로 6번 채널로 전환하겠습니다."
221130-109 = "여기는 <골든 엘리시움>. 여객관리부 부장 센고쿠 미츠키입니다."
221130-110 = "이야기는 들었습니다. 아일랜드에서 새미에게 마지막 선물로 익숙한 풍경을 보여 주려 하신다면서요?"
221130-111 = "그렇다면 저희 <골든 엘리시움>도 빠질 수 없지요."
221130-112 = "새미가 평생을 항해하며 마주하던 바다의 풍경에 <골든 엘리시움>의 황금빛 선교가 없다면, 위화감을 느낄지도 모르니까요."
221130-113 = "그런 의미에서…… 사후 허락이 되어 버리긴 했지만, 여객관리부의 출항 허가를 부탁드립니다."
221130-114 = "하지만…… 여객관리부는 입항한 이후로 계속 손님을 받고 있었잖아?"
221130-115 = "손님의 일정을 확인하지도 않고, 멋대로 바다에 나가도 괜찮은 거야?"
221130-116 = "잠깐인 걸요. 게다가 손님들도 잠깐 바닷바람을 쐬고 오시면 기분 전환이 되지 않을까요?"
221130-117 = "단 한 건의 클레임도 없을 거라는 데 여객관리부의 이번 달 부비를 모두 걸겠습니다!"
221130-122 = "……좋아. 허가한다."
221130-124 = "함장님, 이어서 <로도스> 호에서도 교신 중계 요청입니다."
221130-125 = "8번 채널로…… 전환합니다."
221130-131 = "여기는 로도스! 트라이던트의 통신 당직, 코모리 스미카입니다!"
221130-132 = "머, 멋대로 교신에 끼어들어서 죄송합니다. 하지만 트라이던트 측에서도 꼭 전하고 싶은 말이 있어서……"
221130-133 = "너무해요, 함장! 새미의 배웅을 가는 데 트라이던트는 빼놓으시다니!"
221130-134 = "바다를 수놓은 오디세이아 흰 제복 사이에서 트라이던트의 검은 제복이 보이지 않는다면 새미도 아쉬워하겠지요."
221130-135 = "새미의 안전한 배웅을 위해 저희 트라이던트도 함께하겠습니다."
221130-136 = "자, 잠깐. 다들 진정해 주세요! 오늘 통신 당직은 저라니까요?!"
221130-137 = "그, 그런 의미에서…… 함장님. 로도스 호를 포함한 트라이던트의 순찰선에도 출항 허가를 부탁드립니다!"
221130-141 = "좋아, 함께 가자."
221130-142 = "……그 외에 다른 동아리의 선박도 속속 출항 허가를 부탁하고 있습니다."
221130-143 = "아무래도 새미가 위화감을 느낄 일은 없을 것 같네요."
221130-144 = "그러게. 다행이야."
221130-148 = "새미, 보이지? 네가 사랑하는 이 학원의 학생들이."
221130-150 = "……냐아."
221130-151 = "그래, 그래. 네 지정석이 저쪽에 있지? 저쪽으로 가자."
221130-158 = "……바닷 바람이다."
221130-159 = "해가 뜨고 습한 공기가 따스하게 달아오르면, 너는 이곳에서 비릿한 바닷 바람을 마주하며 학원을 내려다보는 걸 좋아했었지."
221130-162 = "어때, 새미. 언제나처럼 익숙하고 편안한 풍경이니?"
221130-163 = "………."
221130-167 = "(오디세이아 학생들의 배려 덕분에.)"
221130-168 = "(새미는 언제나의 바다 위에서, 낯 익은 풍경을 눈에 담은 채, 익숙한 사람들의 품 속에서.)"
221130-176 = "(……만족스러운 표정으로 눈을 감았다.)"
221130-181 = "(……그렇게 새미의 마지막 항해가 끝났다.)"
221130-183 = "다음화;빈 자리의 존재감"
