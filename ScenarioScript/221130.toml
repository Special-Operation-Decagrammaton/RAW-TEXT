221130-10 = "3;마이;03;안녕하세요, 크로노스 채널의 시청자 여러분! 카자마키 마이입니다!\n#3;em;[반짝]\n#3;hophop\n#3;a"
221130-11 = "3;마이;01;이른 새벽 시간입니다만, 저희는 현재 오디세이아의 선단이 정박 중인 아오하마 항의 부두에 나와 있는데요! "
221130-12 = "3;마이;00;저희 크로노스 보도부에서 극비 입수한 정보에 의하면, 오디세이아 해양학원의 학생회라 할 수 있는 <아일랜드>가 단독으로 출항 준비를 하고 있다고 합니다!\n#3;m2"
221130-13 = "3;마이;99;그 말이 사실이라는 것을 증명하기라도 하듯, 기함 <올림포스 호>는 현재 출항 준비를 위해 현문을 철거하고, 닻을 올린 상태입니다."
221130-14 = "3;마이;03;정기 항해에서 돌아온 오디세이아의 선박이 한 달도 되지 않아 다시 출항을 하는 것은, 그간의 기록에서도 전례를 찾을 수 없는 특별한 경우입니다!\n#3;em;[재잘]\n#3;hophop\n#3;m4"
221130-15 = "3;마이;02;이로 인해 SNS에서는 출항 이유를 두고 여러가지 추측이 쏟아지고 있는데요……"
221130-16 = "3;마이;01;혹시 얼마전 오디세이아 학원을 특별 방문했던 샬레의 선생님과 총학생회장과 관련이 있는 건 아닐까요?\n#3;em;[?]"
221130-17 = "3;마이;99;오디세이아 학원에서 정식 발표가 나올 때까지 알 수는 없겠지만, 저희는 이곳에서 계속 취재를 이어가며 새로운 정보가 들어오는 대로—"
