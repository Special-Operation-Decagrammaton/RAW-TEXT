[translation]
10042020-1 = "제2화;어떠한 법칙"
10042020-4 = "안녕하세요, 선생님."
10042020-5 = "이런 식으로 만나 뵙게 될 줄은 몰랐습니다만, 정말로 반갑습니다. 기쁘네요."
10042020-6 = "그래서, 뭐야? 일이라는 게. 게헨나의 선도부원을 둘이나 불렀으니, 그만한 사건이겠지?"
10042020-7 = "시시한 일이라면……. 아니, 물론 그래도 해결은 하겠지만, 선생님에게는 한 소리 해 줄 테니까!"
10042020-8 = "[s1] \"그게 말이지, 참…….\"\n[s2] \"설명하기 기묘한 일이라고나 할까…….\""
10042020-17 = "치, 치나츠 씨. 이오리 씨……."
10042020-19 = "뭐야, 급양부? 이건 좀 의외인데……?"
10042020-20 = "네. 온천개발부나 미식연구회라면 차라리 알기 쉽겠습니다만, 급양부 여러분들과 관련된 사건이라고요?"
10042020-21 = "실례가 되지 않는다면, 전후 사정을 간단히 들려주시면 좋겠습니다."
10042020-22 = "그게 말이야……."
10042020-24 = "……."
10042020-25 = "어……. 그러니까, 요리를 하다 태어난 괴생명체가 스스로 탈출했다고?"
10042020-26 = "[s] \"믿기 힘들겠지만…….\""
10042020-27 = "……아니, 잠깐."
10042020-28 = "그러고 보니 뭔가 그런 일이 전에도 있었던 거 같고……."
10042020-29 = "만마전에서 파티를 열었을 때……였죠, 분명."
10042020-30 = "이 외에도 간간히 신고받았던 일이긴 합니다만……."
10042020-31 = "그럼 뭐야, 결국 이건…… 신종 테러라고 할 수 있는 건가?"
10042020-32 = "게헨나에는 다양한 테러리스트들이 있지만……. 급양부가 테러를 저지를 줄은 몰랐는데."
10042020-33 = "테, 테러리스트!? 하루나랑 같은 취급……!?!?"
10042020-34 = "테러라기에는 사고……가 아닐까요."
10042020-35 = "생각해 보니, 그동안 급양부라고 해서 너무 주의를 기울이지 않고 있었던 것 같기도 해."
10042020-36 = "급양부 위생평가일에, 뭔가 수상한 오렌지 주스를 먹기도 했었고 말이지……?"
10042020-37 = "?!"
10042020-38 = "그, 그건. 그러니까……!"
10042020-39 = "이오리. 그래도 급양부 분들은 항상 선의로 움직여 주시는 고마운 분들이에요."
10042020-40 = "뭐, 좋아. 나도 급식에는 꽤 신세를 지고 있고."
10042020-41 = "뭐야, 결국 변변찮은 일이었잖아. 이 정도는 나 혼자서도 충분히 처리할 수 있다고."
10042020-42 = "다들 안전한 곳에서 잘 보고 있어. 특히…… 선생님."
10042020-43 = "……선생님한테까지 무슨 일이 생기면, 나도 조금 곤란하니까."
10042020-44 = "[s] \"아아…… 이오리가 나를 그렇게…….\""
10042020-45 = "무, 무슨 소리 하는 거야! 그런 거 아니거든?!"
10042020-46 = "아무튼, 최대한 빨리 끝내고 돌아올 테니까 말이지!"
10042020-50 = "[log]그렇게 이오리가 장담한 순간![/log]"
10042020-53 = "[log]어떤, 강렬하고 날카로운 예감 같은 것이, 머릿속을 스친다![/log]"
10042020-57 = "[ns5] \"이, 이오리?\"\n[ns6] \"잠시만! 잠깐만 기다려 봐!\""
10042020-60 = "그럼, 다녀온다!"
10042020-65 = "……가 버렸네요."
10042020-66 = "그렇다고는 해도, 잠시만 기다려 보라는 선생님의 말을 듣는 것도, 나쁘지는 않은 선택이었을 텐데 말입니다."
10042020-67 = "저는 조금 더 사정 청취를 하고 싶은데, 괜찮으실까요. 급양부 여러분?"
10042020-68 = "히잉, 죄송해요. 히이잉……."
10042020-69 = "의기소침할 필요는 없다고 생각합니다."
10042020-70 = "네…… 감사해요. 치나츠 씨."
10042020-71 = "……너무 풀이 죽어 있으면, 현장에 대해 정확한 서술을 할 수 없는 법이니까요."
10042020-72 = "그런 쪽의 의미였나요?!"
10042020-73 = "……후후."
10042020-74 = "너무 걱정하지 않아도 된다는 뜻입니다."
10042020-76 = "……제가 알고 있는 것은, 전부 말씀드린 것 같아요."
10042020-77 = "그렇군요. 급양부의 휴일. 후우카 씨의 외출과 주리 씨의 아르바이트."
10042020-78 = "유난히 바빴던 카페 일과 갑작스럽게 시작해야 했던 주방 일. 그리고 평소와는 다르게 제법 잘 되었던 요리……."
10042020-79 = "네, 네에! 맞아요!"
10042020-80 = "으음……"
10042020-81 = "솔직히 아직도 완전히 이해했다고는 말씀드리기 어렵겠지만……."
10042020-82 = "그, 그런……."
10042020-83 = "뭐, 그래도 문제가 생긴 건 생긴 거고, 그 전에 아르바이트를 잘했다고 하셨으니까."
10042020-84 = "역시 이건 그냥 단순히 '사고'라고 할 수 있겠네요."
10042020-85 = "그, 그런 걸까요? 그렇게 생각해 주시면 감사한데……."
10042020-86 = "카페 창고에서 폭발이 발생했다고도 말씀해 주셨지만."
10042020-87 = "그건 뭐, 여기서는 언제나 일어나는 사소한 일에 지나지 않는 것일 거고요."
10042020-88 = "[ns7] (사소한 일이구나…….)\n[ns8] (여기…… 게헨나…….)"
10042020-91 = "아무튼, 이제 슬슬 이오리가 결과를 내었을 시간이 되었을 것 같네요."
10042020-92 = "연락을 해 보도록 하겠습니다. 잠시만 기다려 주세요."
10042020-97 = "……?"
10042020-98 = "어라? 이오리? 연락을 받지 않는 건가요? 다시 한번……."
10042020-103 = "……드문 일이네요. 하지만…… 네. 언제나 우리가 알고 있는 대로만 일이 흘러가는 것은 아닐 테니까요."
10042020-104 = "설마……?"
10042020-105 = "어디, 다시 한번……."
10042020-110 = "이렇게까지 연락을 받지 않는다고요……?"
10042020-111 = "……."
10042020-112 = "선생님? 주리 씨? 그 이해할 수 없는 생명체……."
10042020-113 = "그것에게 최초로 습격당한 카페의 손님분은, 어떻게 되었다고 하셨죠?"
10042020-114 = "그게, 얼굴이 소스 범벅이 된 채 기절해 버리셨어요……."
10042020-115 = "그렇군요……."
10042020-116 = "[ns] \"치나츠, 괜찮아?\""
10042020-117 = "네. 저의 기존 입장을, 약간이지만 수정해야 할 것 같습니다."
10042020-118 = "구체적으로 말씀드리자면, 전면 부정에서 반신반의 정도로요."
10042020-119 = "이상한 일입니다. 이오리는 언제나 충실하고 성실하니까요."
10042020-120 = "웬만한 일이 일어나지 않고서는 즉각 연락을 받고는 하죠. 그런데, 세 번이나 연락을 받지 않는다는 것은……."
10042020-121 = "[s] \"혹시 모르니까, 내가 전화해 볼게.\""
10042020-122 = "네. 부탁드리겠습니다."
10042020-128 = "받지 않네……?"
10042020-129 = "그, 그럴 수가……!"
10042020-130 = "[s9] \"뭐……. 여기선 그런 전개겠지…….\"\n[s10] \"이런 장르에서 혼자 떨어졌으니…….\""
10042020-133 = "……? 그게 무슨 말씀이신가요, 선생님……?"
10042020-134 = "저기, 저기요! 일단은 우리, 이오리 씨를 찾아보는 게 어떨까요?"
10042020-135 = "그래요, 선생님. 뭔가 심상치 않다는 느낌이 들어요……."
10042020-136 = "저, 선생님? 어느 정도 선생님께서 느끼고 계신 바가 있을 것으로 보이는데요. 선생님의 생각은 어떠신가요?"
10042020-137 = "[s11] \"어쩌면 이오리도 지금쯤 소스 범벅이…….\"\n[s12] \"이오리 무침이 돼 버렸을지도…….\""
10042020-140 = "네, 네에?!?!?!"
10042020-141 = "이오리 무침…… 이요?"
10042020-144 = "게헨나치고는 꽤나 구석인 데다 으슥한 거리까지 들어왔습니다만……."
10042020-145 = "오늘 길에 군데군데, 초록색 점액 같은 것이 묻어 있었죠……?"
10042020-146 = "아?! 저, 저쪽이요! 저기 좀 보세요!!! 이오리 씨가 초록 점액에 범벅이 된 채 기절해 있어요!"
10042020-149 = "[ns] \"으앗? 이오리, 괜찮아?!\""
10042020-150 = "음……. 잠시. 우선 체크를 좀……."
10042020-155 = "……생명에는 지장이 없군요. 그나저나 뭔가 참 독특한 냄새가……"
10042020-156 = "좀 끈적거리기도 하고……. 이 냄새, 내일까지는 빠지지 않을지도……."
10042020-157 = "그, 그게 전부야? 지금 의식을 잃었는데?!"
10042020-158 = "아뇨. 이오리와 일을 하면서 이런 일은 자주 있는지라……."
10042020-159 = "……그래도, 만일을 위해 전문가의 소견도 들어보는 게 좋겠군요."
10042020-160 = "[s] \"전문가……?\""
10042020-161 = "치나츠 씨 말고, 또 다른 전문가 말씀이신가요……?"
10042020-162 = "네. 이런 분야와 관련해서, 확실하게 믿을 수 있는 분을 알고 있습니다."
10042020-163 = "……동시에, 조금 특이한 사람이기도 하지만요."
10042020-165 = "……과연. 그런 이유로 저를 부르셨던 거군요. 이해했습니다."
10042020-166 = "하지만 치나츠의 소견대로, 괜찮습니다. 제가 보기에도……."
10042020-167 = "……그저 소스가 입맛에 맞지 않았던 모양인 것 같군요."
10042020-168 = "……!? 소, 소스……? 입맛……? 그런 이유로도 기절할 수 있나요!?"
10042020-169 = "…………."
10042020-170 = "……많이 안 맞았나 봅니다."
10042020-171 = "이유가 달라지지 않았어!!"
10042020-175 = "[ns13] \"그, 그런 거라면 다행이긴 하네. 응!\"\n[ns14] \"그리고 미안해! 비번인 줄 몰랐어!\""
10042020-178 = "[ns] \"……그리고, 사복 정말 잘 어울린다!\""
10042020-179 = "괜찮습니다. 응급의학부는 언제든 상황에 대기해야 하니까요."
10042020-180 = "그리고 사복에 대한 감상은, 솔직하게 기뻐하도록 하겠습니다."
10042020-181 = "이 시체…… 이오리는, 저희 응급의학부원에게 인계하도록 하죠."
