[translation]
10045050-1 = "제5화;탈락의 고비에서"
10045050-4 = "[ns] \"……쿄—!\""
10045050-6 = "[ns] \"키쿄……!\""
10045050-9 = "코, 콜록! 콜록, 콜록……!!"
10045050-13 = "키쿄!"
10045050-18 = "선생님……?"
10045050-19 = "[s1] \"깨어나서 정말 다행이야.\"\n[s2] \"물이 깊지 않아서 정말 다행이었어.\""
10045050-22 = "코, 콜록……!"
10045050-23 = "도, 도대체…… 어떻게 된 거야? 경기는? 물에 빠진 뒤로는 기억이……."
10045050-24 = "경기는 이미 끝났어. 결승 진출자는 치세 씨와 이즈나 씨."
10045050-25 = "우리는…… 전원 탈락이야."
10045050-26 = "……!!"
10045050-27 = "설마, 나 때문에……?"
10045050-28 = "그런 거 신경 쓰지 마! 동료를 구하는 건 당연한 거니까."
10045050-29 = "내 탓이야……."
10045050-30 = "물을 무서워한다는 걸 먼저 말했더라도……. 이런 일은 없었을 텐데."
10045050-32 = "키쿄 선배가 물을 싫어하는 게 아니라…… 무서워한다고요?"
10045050-33 = "……야외 활동을 안 좋아하다 보니 물가에는 갈 일이 없었어."
10045050-34 = "당연히 수영도 못하고, 깊은 물에 들어가는 건 더 못 해."
10045050-35 = "하지만…… 백화요란의 작전참모인 내가 그런 걸 못 한다고 차마 말할 수가 없었어."
10045050-36 = "다들 미안. 전부 나 때문이야. 내가 괜히 자존심을 내세우는 바람에……."
10045050-37 = "괜찮다니까? 따지고 보면 이건 내 잘못도 있어."
10045050-38 = "키쿄랑은 소꿉친구인데 그런 것도 제대로 몰랐다니……."
10045050-39 = "나야말로 미안해."
10045050-40 = "내가 미안하다니까?"
10045050-41 = "아니, 내가 나빴다니까!"
10045050-42 = "나라고!"
10045050-43 = "나야……!"
10045050-45 = "후후, 역시 두 분은 정말 사이가 좋으시군요."
10045050-46 = "키쿄 선배. 저희는 괜찮으니 너무 부담 가지지 마시어요."
10045050-47 = "소녀는 선배가 무사한 것만으로도 다행이라 생각한답니다."
10045050-48 = "……날 원망하지 않는 거야?"
10045050-50 = "이번 대회는 단합이 목적이었잖아? 그 목적이라면 충분히 달성했다고 봐."
10045050-51 = "그렇사와요. 그러니 너무 자책하지 마시어요."
10045050-52 = "하지만……."
10045050-54 = "[ns] \"걱정 마! 아직 기회가 있으니까!\""
10045050-55 = "기회? 무슨 기회?"
10045050-56 = "[s3] \"그건 나중의 즐거움으로 남겨둘게.\"\n[s4] \"다들 비치발리볼 경기장에서 다시 보자!\""
10045050-59 = "……?"
10045050-62 = "백야수상제에 참가해 주신 여러분! 어느덧 대회도 막바지네요."
10045050-63 = "하지만 이렇게 끝을 향해 가고 있다니 아쉬워요. 여러분들도 그렇죠?"
10045050-67 = "자, 이런 여러분의 성원에 힘입어 추가 경기를 편성했습니다! 그것은 바로……!"
10045050-68 = "패자부활전!"
10045050-69 = "장애물 달리기에서 탈락한 여덟 분이 2인 1팀으로 비치발리볼을 진행!"
10045050-70 = "마지막에 승리한 팀이 추가로 최종 라운드에 진출하게 됩니다!"
10045050-71 = "축제는 아직 많이 남았으니 모두 힘내세요!"
10045050-72 = "[ns] \"그럼~ 무작위로 선정된 대진을 발표하겠습니다~!\""
10045050-74 = "[log]비치발리볼 제1경기![/log]"
10045050-77 = "VS"
10045050-81 = "오호, 키쿄와 팀이라니. 게다가 첫 상대도 나쁘지 않은데?"
10045050-82 = "……."
10045050-84 = "으으으, 왜 하필 쟤네야?!"
10045050-85 = "정신 차려! 우리도 충분히 가능성이 있다고!"
10045050-87 = "[ns] \"이어서~ 다음 대진!\""
10045050-89 = "[log]비치발리볼 제2경기![/log]"
10045050-92 = "VS"
10045050-96 = "오오, 나구사 선배와 한 팀이라니! 어떻게 이런 우연이!"
10045050-97 = "선배와 함께라면 우승임에 틀림없사와요!"
10045050-98 = "응. 같이 힘내자."
10045050-100 = "어, 어쩌죠? 상대가 너무 강해요!"
10045050-101 = "후후, 자신감을 가지세요. 우리도 충분히 강하니까요."
10045050-102 = "수행 상대로 정말 부족함이 없겠어요."
10045050-104 = "와아, 정말 흥미로운 대진이 이루어졌네요!"
10045050-105 = "그럼 잠시 휴식을 취한 뒤 제1경기를 시작하겠습니다!"
10045050-106 = "[ns] \"모두 채널 고정 잊지 말아줘……!\""
10045050-108 = "(……어찌 됐든 우리 중에서 절반은 떨어지게 돼.)"
10045050-109 = "(이런 상황에서 만약 나 때문에 또 렌게가 탈락한다면…….)"
10045050-110 = "(…….)"
10045050-111 = "(내가…… 잘 해야 해.)"
10045050-112 = "(이번 경기는 물에서 하는 것도 아니니까, 잘할 수 있을 거야.)"
10045050-113 = "(마침 첫 번째 상대는 어렵지 않아. 렌게 혼자서도 쓰러뜨릴 수 있겠지.)"
10045050-114 = "(그런데 어째서…….)"
10045050-115 = "(……어째서 안 좋은 느낌이 계속 드는 거지?)"
