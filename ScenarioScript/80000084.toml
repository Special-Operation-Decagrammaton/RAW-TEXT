[translation]
80000084-1 = "그것은 마치 럽코처럼"
80000084-2 = "(발렌타인 데이가 찾아온 바로 그날. 이른 아침부터 미치루가 샬레에 찾아왔다.)"
80000084-4 = "선생 공, 오늘은 발렌타인 데이잖아?"
80000084-5 = "[s] \"응, 그렇지?\""
80000084-6 = "그런 특별한 날을, 우리 <소녀인법첩 미치룻치>도 그냥 흘려보내면 안 된다고 생각해."
80000084-7 = "요컨대 오늘 같은 날엔 역시 우리도……"
80000084-8 = "발렌타인 데이와 관련된 콘텐츠를 올릴 필요가 있지 않을까……?!"
80000084-9 = "시대의 흐름에 맞춰야 하지 않을까……?!"
80000084-10 = "하고 생각했는데. 어떻게 생각해. 선생 공?!"
80000084-11 = "[s] \"맞는 말이지만, 애당초 미치루의 채널은 닌자 관련 채널…….\""
80000084-12 = "요즘엔 닌자도 초콜릿을 좋아한다고?!"
80000084-13 = "[s] \"좋아하고 아니고의 문제야?!\""
80000084-14 = "우냐악- 업계에서 살아남기 위해서라면 그런 사소한 건 괜찮으니까!"
80000084-15 = "그러니 도와주라~ 서언~새앵~고옹~"
80000084-16 = "발렌타인 데이 콘텐츠를 찍어서……! 이번에야말로 우리 <소녀인법첩 미치룻치>를 널리 알리고 싶으니까!"
80000084-17 = "응? 응?"
80000084-18 = "[s] \"뭐, 도와주는 건 괜찮은데…….\""
80000084-19 = "그, 그래?!"
80000084-20 = "역시 선생 공이 최고야!"
80000084-21 = "어려운 상황에 부닥친 학생이 있으면, 돕는 것도 주저하지 않는 그 배포!"
80000084-22 = "내가 눈여겨본 차기 닌자 두령다워!"
80000084-23 = "[s1] \"갑자기 닌자 두령이 되어도 곤란하지만 말이야……. 어쨌거나……\"\n[s2] \"그래서 무슨 콘텐츠를 찍으려고? 계획은 있어?\""
80000084-24 = "아, 그거라면 괜찮아!"
80000084-25 = "아, 그거라면 괜찮아!"
80000084-26 = "마침 이럴 때를 대비해서 내가 완벽한 기획 아이템과 대본을 짜왔으니까!"
80000084-27 = "[s] \"어라? 곤란하다고 말한 것 치고는 의외로 준비성이 철저…….\""
80000084-28 = "……엉?"
80000084-29 = "앗, 아앗! 으냐앗?!"
80000084-30 = "그, 그, 그, 그러니까……!"
80000084-31 = "위기의 상황에서도 미치루 부장에겐 빈틈이 없다! 라는 걸로……"
80000084-32 = "하, 하여간 선생 공은! 촬영감독인 내 지시를 따르기만 하면 되니까……!"
80000084-33 = "[s] \"그래그래, 알았어.\""
80000084-34 = "(조, 좋았어…… 이것으로 선생 공을 밀어붙이는 데는 성공했으니까…….)"
80000084-35 = "(아, 앞으로 몇 단계의 계획만 진행하면……!)"
80000084-36 = "자, 그럼 시작하자!"
80000084-38 = "(그리하여 미치루의 지시로 발렌타인 데이 기념 콘텐츠 찍기……가 시작되었는데.)"
80000084-39 = "가장 먼저 찍어볼 건 골목 모퉁이를 달리던 두 사람이 살짜-쿵! 부딪치는 장면부터야."
80000084-40 = "[s] \"미안, 미치루. 시작부터 영문을 모르겠는데.\""
80000084-41 = "훗훗훗. 무엇을 숨기랴!"
80000084-42 = "지금부터 우리가 찍을 건 발렌타인 데이 기념 콘텐츠!"
80000084-43 = "이름하야 <발렌타인 데이에 어울리는 러브코미디 시추에이션을 체험해봤다!> 콘텐츠니까 말이야!"
80000084-44 = "[s] \"이미 닌자 성분은 하나도 없는 게……?\""
80000084-45 = "앗, 그, 그건……!"
80000084-46 = "아! 그래! 정확히 말하자면 평범한 러브코미디 시추에이션이 아니라……."
80000084-47 = "<닌자 럽코 시추에이션>이니까! 응! 그러니 완전 문제없음!"
80000084-48 = "[s] \"뭐, 미치루가 그리 말한다면야…….\""
80000084-49 = "자! 그럼 내가 반대쪽 모퉁이에서 달려올 테니까."
80000084-50 = "선생 공도 내가 신호를 보내면 여기서 뛰어야 해?"
80000084-55 = "자, 그럼 지금!"
80000084-59 = "(그렇게 미치루의 신호를 받고 골목 모퉁이로 천천히 달리기 시작했을 때였다.)"
80000084-66 = "으랏차아앗!!"
80000084-71 = "(모퉁이에서 부딪치게 되는 순간! 선생 공이 눈치채지 못하도록, <물건>을 선생 공의 주머니로 던지면……!)"
80000084-72 = "……는?! 자, 잠깐?! 왜 바닥에 바나나 껍질이?!"
80000084-73 = "우, 우와아앗?!"
80000084-77 = "[ns] \"미, 미치루! 괜찮아?!\""
80000084-79 = "우엥~! 누구야?! 골목 바닥에 바나나 껍질 같은 쓰레기를 버린 사람이!"
80000084-80 = "위험하잖아! 골목 모퉁이 살짜쿵 콩! 이벤트를 할 수가 없잖아!"
80000084-81 = "[s] \"아니, 그게 아니더라도 역시 위험하다고 생각해.\""
80000084-82 = "여기서 선생 공은 정론을?!"
80000084-83 = "으으음…… 화, 확실히…… 시추에이션치고는 조금 올드하고 데인저러스……"
80000084-84 = "좋았어! 그럼 다음……! 다음이야!"
80000084-85 = "다음 이벤트로 가겠어!"
80000084-87 = "(그 뒤로도 미치루와 함께 다양한 <러브코미디 시추에이션>…… 아니 <닌자 럽코 시추에이션>에 도전을 하게 되었다.)"
80000084-89 = "자, 여기선 선생 공이 감기에 걸려 아프단 설정이니까!"
80000084-90 = "흠흠……"
80000084-91 = "[USERNAME] 선생 공 군! 이야기 들었어! 아프다며~?"
80000084-92 = "여기 감기에 특효약인 이걸…… 내가 특별히 선생 공 군만을 위한 <스페셜 죽>을 만들었으니까……!"
80000084-93 = "[s] \"저기, 미치루가 만들었다는 죽……. 새까맣게 타버린 거 같은데…….\""
80000084-95 = "[ns] \"그보다 이거 탄내랑 같이 달콤한 냄새가 나는데…… 죽 맞아?\""
80000084-96 = "아차! 소꿉친구 간병 컨셉을 우선시한 나머지…… 재료의 조합을 고려 못했어!"
80000084-97 = "다, 다음이야!"
80000084-99 = "[USERNAME] 선생 공 선배! 이번 대회에서 우리가 우승만 하면……!"
80000084-100 = "나……! 선생 공 선배만을 위한 특별한 <물건>을……! 저 나무 아래 타임캡슐에 묻어 놨으니까……!"
80000084-101 = "[s] \"미안, 미치루! 의욕이 너무 앞선 나머지 상황극의 설정을 잘 모르겠어!\""
80000084-102 = "으엑~! 이, 이걸로도 안 된다구?!"
80000084-103 = "그, 그럼 다음……!"
80000084-105 = "다음이니까아~!"
80000084-106 = "(그렇게 계속해서 미치루가 준비했다는 대본의 상황극을 반복했지만.)"
80000084-107 = "(그럴 때마다 다양한 실패…… 혹은 방해를 받아가며…….)"
80000084-108 = "(좀처럼 만족스러운 영상은 찍지 못한 채…… 어느덧 저녁이 찾아왔다.)"
80000084-110 = "끄응………"
80000084-111 = "[s] \"미치루, 괜찮아?\""
80000084-112 = "괜…… 괜찮………"
80000084-113 = "아냐…… 역시 조금 무리를 한 탓일까…… 한 발짝도 못 움직이겠어~~"
80000084-114 = "[s] \"응. 그럼 일단 쉬자. 자판기에서 음료수 뽑아올 테니까.\""
80000084-115 = "으, 응…… 부탁해…… 선생 고옹……."
80000084-119 = "으………"
80000084-120 = "으앙~! 결국~! 전부 다 실패해버렸어~!"
80000084-121 = "모처럼의 발렌타인 데이를 맞이해…… 내가 준비한 비장의 계획……"
80000084-122 = "……선생 공이 눈치채지 못하도록 자연~스럽게 초콜릿을 전하자! 작전이……!"
80000084-123 = "[s3] \"역시나…… 그런 이유로 불렀던 거였구나.\"\n[s4] \"뭐, 대충 그럴 거 같기는 했지만.\""
80000084-124 = "……엉?"
80000084-125 = "……엉?"
80000084-126 = "서, 서, 서, 선생 고오오옹?! 왜?! 여기에?!"
80000084-127 = "으, 음료수는?!"
80000084-128 = "[s] \"아니, 그…… 미치루가 뭘 마실지 물어보려고 돌아왔던 건데.\""
80000084-129 = "그래서 다, 다, 다, 다 들었다고……?!"
80000084-130 = "[s] \"응.\""
80000084-131 = "으, 으으…… 으으……!"
80000084-132 = "이제 나도 몰라! 될 대로 되라지!"
80000084-133 = "맞아! 오늘 이렇게 선생 공을 불러서 콘텐츠를 찍자고 한 건……"
80000084-134 = "실은 초콜릿을 전하고 싶어서였어!"
80000084-135 = "평소에 우리 인법연구부를 여러모로 도와주는 선생 공에게……"
80000084-136 = "가, 가, 가, 감사 인사를 표하고 시펴스니카!"
80000084-137 = "[s] \"미, 미치루 괜찮아……?\""
80000084-138 = "으으, 주, 중요한 곳에서 혀를 씹어버렸다아!"
80000084-139 = "[s] \"하지만 미치루, 초콜릿 정도는 평범하게 줘도…….\""
80000084-140 = "뭐어?! 어떻게 그런 무시무시한 말을 할 수 있는 거야. 선생 공?!"
80000084-141 = "아무렇지도 않게 발렌타인 데이 기념 초코를 선물하라니……!"
80000084-142 = "그런 달콤쌉싸름한 러브코미디 이벤트를 매, 매, 매, 맨정신으로 할 수 있을 리가 업쟎햐?!"
80000084-143 = "그런 게 가능한 건 저쪽 편의 사람! 강심장! 우리랑 완전 연이 없는 부류라구?!"
80000084-144 = "[s] \"뭔가 엄청나게 편견이 들어간 듯한 발언…….\""
80000084-145 = "우으으……"
80000084-146 = "하지만 다 들켜버렸고…… 이미 뭐가 뭔지…… 나도 모르겠고……"
80000084-147 = "이런 괜한 일로…. 선생 공을 끌어들였으니…… 선생 공도 분명 화가……."
80000084-148 = "[s] \"아니, 그렇지 않아. 오히려 오늘 하루 미치루의 모습을 보니 재미있었고.\""
80000084-149 = "그, 그래? 그럼 다행……"
80000084-150 = "……이 아니라! 뭔가 훈훈한 말인 것 같아서 넘어갈 뻔했지만."
80000084-151 = "우갸악! 그냥 내가 허둥지둥하던 게 재미있었을 뿐이란 소리잖아?!"
80000084-152 = "으으…… 진짜 나도 모르겠다! 이미 벌어진 거!"
80000084-153 = "자, 선생 공! 여기!"
80000084-158 = "평소의 감사를 담아…. 직접 주문제작한 초콜릿이니까! 받아!"
80000084-159 = "[s] \"……응. 고마워.\""
80000084-160 = "우냐아악~! 오늘 하루는 정말…… 나답지 않게 무슨 고생을 한 건지……"
80000084-161 = "운치도 뭐도 없는…… 이런 엔딩이라니……"
80000084-162 = "……아니, 오히려 이런 게 나다운 엔딩……이려나아……."
80000084-163 = "[s] \"하지만 미치루.\""
80000084-164 = "……우으? 선생 공, 왜?"
80000084-165 = "[s] \"저녁놀 아래에서 퉁명스럽게 건네주는 초콜릿이라니.\""
80000084-167 = "[ns] \"이거야말로 러브코미디 시추에이션의 정석 아니야?\""
80000084-168 = "……어?"
80000084-172 = "…………아, 하, 하하……."
80000084-173 = "우냐악………!@##$!@#$"
80000084-177 = "[ns] \"아…… 도망가버렸다.\""
80000084-179 = "(그렇게 미치루는 사라졌지만.)"
80000084-180 = "(그럼에도 여전히 미치루가 전해준 초콜릿에선 은은하고 따스한 온기가 느껴졌다.)"
