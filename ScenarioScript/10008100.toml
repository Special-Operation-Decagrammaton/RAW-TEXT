[translation]
10008100-1 = "제10화;반격 개시!"
10008100-4 = "흐음. 모든 게 순조롭군요."
10008100-5 = "새전함도 무사히 되찾았고 여전히 카이텐져는 도주하면서 남들의 이목을 끌어주는 상황……."
10008100-6 = "하하하! 그러니 이쯤에서 저희 검은거북파는 상황을 정리하고 빠지기만 하면……."
10008100-11 = "보, 보스! 큰일입니다!"
10008100-12 = "무슨 일인가요? 노크도 없이 들어 오시다니 예의가 아니잖습니까?"
10008100-13 = "그, 그게 아니라 지금 TV를 보셔야 합니다!"
10008100-21 = "크로노스 스쿨 보도부의 저 시논! 현재 문제의 현장에서 긴급 속보를 전해드리고 있습니다!"
10008100-23 = "지금 대길전은 그야말로 난리가 난 상황! 저길 보십시오!"
10008100-28 = "뭐야, 처음부터 새전함이 전부 사기였다고?!"
10008100-29 = "이게 어떻게 된 거야? SNS에서 유명하다던 그 소문은 뭔데?"
10008100-30 = "내 돈 돌려줘!"
10008100-35 = "어쩌다 이렇게 된 것인가!"
10008100-36 = "그 이유는 조금 전에 SNS에 올라온 이 영상을 봐주시기 바랍니다!"
10008100-39 = "하하하! 말씀하신 대로 꼬리는 언젠가 잡히게 되겠지요. 하지만 그 전에 도망치면 그만 아니겠습니까?"
10008100-40 = "그야 당신들처럼 SNS에서 빌면 이루어진다는 바이럴 마케팅 같은 걸 믿어주는 바보들이 세상천지에 가득한 이상."
10008100-41 = "이 장사는 불패의 장사입니다. 앞으로도 얼마든지 계속할 수 있지요! 하하하!"
10008100-44 = "보신 것처럼 이 발언으로 인해 파문은 일파만파 확산 중! 과연 이게 어찌 된 일인 걸까요?"
10008100-45 = "대길전의 소문은 정말 거짓말이었을까요?"
10008100-46 = "저희 크로노스 스쿨 보도부는 그 진상을 확인하기 위해, 직접 행사장의 관리인을 찾아……!"
10008100-53 = "이……."
10008100-54 = "이게 어찌 된 일입니까?!"
10008100-57 = "이야~ 그야말로 난장판이네~"
10008100-58 = "모두들 화가 잔뜩 난 모양이에요~☆"
10008100-59 = "쿠흐흣."
10008100-60 = "이제야 좀 축제 같은 느낌이 나네! 응! 마음에 들어!"
10008100-65 = "무츠키, 대체 어느 틈에 그런 걸 찍어둔 거야……."
10008100-66 = "응? 그거? 뭐, 그때 그 인간. 우리 앞에서 잘난 듯이 떠들어댔잖아? SNS에 속은 놈이 바보라는 둥의 이야기."
10008100-67 = "확실히 그런 이야기를 하긴 했었지."
10008100-68 = "아하핫~ 우리 앞에서 감히 아루 쨩과 흥신소를 무시하다니 말이야. 그래서 찍어뒀지. 나중에 쓸만하겠다 싶어서."
10008100-69 = "그리고 봐봐. 정말 재미있어졌잖아?"
10008100-70 = "무츠키……."
10008100-71 = "[s] \"이것이 무츠키 퀄리티…….\""
10008100-77 = "사람이 많이 몰려드는 만큼 대길전은 현재 계속해서 마찰이 빚어지고 있는 상황이에요!"
10008100-78 = "이러면 정문으로 들어가려고 해도, 인파로 혼잡하니까. 아무래도 적의 보스를 붙잡는 건 어려워 보여."
10008100-79 = "……그거라면 내게 좋은 방법이 있어."
10008100-80 = "대길전으로 들어가기 위한 입구는 정문과 뒷문. 총 두 군데야. 만약 정문을 밀어서 뚫는 데 성공하기만 한다면."
10008100-81 = "검은거북파 녀석들은 당연히 뒷문 쪽으로 도주를 시도할 거야."
10008100-82 = "바로 그때를 노리면……."
10008100-84 = "과연! [ruby=前]전[/ruby] 아르바이트생이기에 가질 수 있는 통찰이란 거네!"
10008100-85 = "굳이 전 아르바이트생이라고 부르는 말이 가슴을 찌르는데?!"
10008100-86 = "[s] \"그럼 역할을 분담하자. 우선…….\""
10008100-88 = "이야~ 정문을 우리들이 맡을 테니 후문은 흥신소 아이들이 맡는다. 이거지?"
10008100-89 = "세리카 쨩에겐 저쪽을 부탁할게~"
10008100-90 = "네~ 알겠습니다! 선생님!"
10008100-91 = "맡겨만 줘."
10008100-92 = "새전함의 원한, 반드시 갚아주겠어."
10008100-94 = "으, 응! 그쪽은 부탁할게!"
10008100-95 = "이쪽도 선생님과 함께 적장의 목을 칠 테니까!"
10008100-96 = "뭐, 그게 사장의 말이라면"
10008100-97 = "네, 넵!"
10008100-98 = "쿠흐흐흣~ 돌격~!"
