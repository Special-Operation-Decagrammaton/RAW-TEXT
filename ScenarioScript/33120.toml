[translation]
33120-1 = "제12화;가중되는 혼란 2"
33120-2 = "선생님의 상태는요!"
33120-3 = "현재 구호기사단의 구호실에 있습니다! 단원의 말에 따르면 피를 많이 흘렸지만, 응급처치가 잘 되어 있어서……."
33120-4 = "무사하신 건가요!"
33120-5 = "네, 네…… 다행히 생명에는 지장이 없지만…… 의식을 되찾지 못하고 있는……."
33120-6 = "선생님……."
33120-10 = "발사체의 분석 결과 나왔습니다! 램제트 엔진이 아닙니다!"
33120-11 = "!!"
33120-12 = "램제트가 아니면…… 게헨나는 현재 키보토스에 존재하지 않는 기술을 손에 넣었다는 건가요?"
33120-13 = "현재 발사 위치를 추적 중입니다……!!"
33120-14 = "……게헨나가 쏜 건가요?!"
33120-15 = "……아, 아닙니다. ……. 위치는……"
33120-16 = "자, 자세한 위치는 특정할 수 없지만…… 트, 트리니티 자치구 내부에서 발사되었습니다!!"
33120-17 = "……!!"
33120-18 = "고성당 폭발 당시의 CCTV 영상 복구작업 완료했습니다!! 현재 고성당에서 게헨나와 교전 중인 시스터들의 보고와 일치합니다!!"
33120-20 = "바로 재생하겠습니다!!"
33120-35 = "……이건 대체."
33120-36 = "선생님…… 모두들…… 대체 어떤 것과 싸우고 있었던 거죠……?"
33120-37 = "저, 저건…… 저 복장은……."
33120-38 = "……. <유스티나 성도회>예요……."
33120-39 = "네? 무, 무슨……?!"
33120-40 = "……."
33120-41 = "하, 하나코 씨……."
33120-42 = "…………."
33120-48 = "…………………………………."
33120-53 = "성도회…… 에덴조약…… 티파티의 습격……"
33120-61 = "……아리우스 스쿼드……. 제1차 공의회……. 고성당……. 발사체의 위치…… 쿠데타의 비정상적인 기습 시간……"
33120-67 = "……지하의 카타콤…… 어뮤즈 파크의 괴소문…… 아리우스 자치구의 위치……"
33120-77 = "……계율의 수호……. 수호자…… 에덴조약…… 에덴조약……. 에덴조약……. 에덴……"
33120-80 = "……."
33120-81 = "하, 하나코 씨……? 괘, 괜찮으세요?!"
33120-82 = "……."
33120-83 = "……만에 하나."
33120-84 = "수십 개의 비약을 전제로 했지만…… 설마…… 만에 하나 이게 진짜라면……."
33120-85 = "……. 이걸 해결할 수 있는 방법은 존재하지 않아요……."
33120-86 = "……네?"
33120-87 = "트리니티와 게헨나는 키보토스의 지도에서 사라지게 될 거예요……."
33120-89 = "그 옛날 1차 공의회 이후에 아리우스가 그렇게 되었던 것처럼……."
33120-91 = "다음화;닿을 수 없는 저쪽"
