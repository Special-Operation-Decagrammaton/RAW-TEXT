[translation]
10008010-1 = "제1화;새해맞이 행사장에서"
10008010-5 = "(새해를 맞이하여 요즘 SNS에서 유행한다는 새해맞이 행사장을 방문했다.)"
10008010-6 = "(인터넷에서도 유명하기로 유명한 뜨거운 핫플레이스였던 덕분인지, 행사장은 발 디딜 틈 없이 인파로 가득했다.)"
10008010-7 = "[s] \"새해구나…….\""
10008010-8 = "앗! 선생님이다!"
10008010-9 = "새해 복 많이 받아! 선생님!"
10008010-10 = "응……?"
10008010-11 = "새, 새, 새, 새해 복 많이 받으세요. 서, 선생님……!"
10008010-12 = "어라. 안녕, 새해 복 많이 받아. 선생."
10008010-13 = "[s] \"다들 안녕. 모두 새해 복 많이 받아.\""
10008010-14 = "후후, 새해 복 많이 받도록 해. 선생님."
10008010-15 = "그런데 선생님이 여긴 어쩐 일이야?"
10008010-17 = "선생님도 새해부터 할 일이 없어서 여기서 빈둥거리고 있었구나?"
10008010-18 = "아마 샬레 업무의 일환이겠지. 고생이 많네. 선생."
10008010-19 = "[s] \"응. 그보다 모두 멋진 차림이네.\""
10008010-21 = "……후후후. 이걸 알아보다니, 선생님도 제법이잖아?"
10008010-22 = "최고급 비단에 장인이 손수 한 땀 한 땀 수놓은 고급스러운 문양! 균형과 조화를 추구하면서도 그 안에 파격을 품은 고져스한 디자인!"
10008010-23 = "이 미학을 알아보다니, 역시 우리 흥신소의 동업자 자격이 있어!"
10008010-24 = "쿠흐흣, 뭐, 동네 가게에서 렌탈한 거지만~"
10008010-25 = "……!?"
10008010-26 = "……."
10008010-27 = "[s1] \"뭐, 다들 잘 어울린다고 생각해.\"\n[s2] \" 으응, 어찌 되었든 간에 다들 예쁘다고 생각해.\""
10008010-28 = "헤에……."
10008010-29 = "헤에……."
10008010-30 = "……엄청 스트레이트한 칭찬이네."
10008010-31 = "가, 가, 가, 가, 감사합니다……."
10008010-32 = "흐, 흠! ……뭐어, 우리 흥신소가 특별히 갖춰 입은 전투복이니까 말이야."
10008010-33 = "[s] \"전투복?\""
10008010-34 = "어, 어쨌거나 우리는 행사장 안쪽에 볼일이 있는 참인데……."
10008010-35 = "그, 어때 선생님. 같이 가지 않을래?"
10008010-36 = "그래, 어차피 선생님도 할 거 없잖아? 같이 가자~"
10008010-37 = "[s] \"새해 소원 빌기인 거지? 그래. 같이 가자.\""
10008010-44 = "해피 뉴 이어~! 안녕하세요! TV 앞의 시청자 여러분! 모두 새해 복 많이 받으세요!"
10008010-45 = "크로노스 스쿨 보도부의 아이돌 리포터! 카와루 시논! 인사드립니다!"
10008010-46 = "자아~ 혹시 이곳이 어딘지 아시겠나요? 알게 되면 아마 여러분도 깜-짝 놀라실 것이라 자신만만!"
10008010-47 = "최근 키보토스에서도 모르는 사람이 없을 정도로 유명해진 곳!"
10008010-48 = "네! '빌면 이루어진다'는 캐치프레이즈로 유명한 <대길전>의 행사장에 나와 있답니다! 박수! 짝짝짝!"
10008010-49 = "오늘은 이 자리에 특별한 게스트를 모셨습니다."
10008010-50 = "<대길전>의 관리인을 모셔보겠습니다!"
10008010-55 = "하하하. 안녕하십니까. <대길전>의 새해맞이 행사 관리인입니다."
10008010-56 = "네! 안녕하세요! 그럼 바로 본론입니다."
10008010-57 = "이곳 행사장은 '새해에 소원을 빌면 이루어지는 영험한 곳'이라며 현재 SNS상으로도 무척이나 유명한 곳인데요. 이에 대해 어떻게 생각하시나요?"
10008010-58 = "하하하. 그게 정말일지 아닐지는 저희로서도 말씀드리기 어려운 부분입니다."
10008010-59 = "다만 그런 말이 나온다는 건, 그만큼 여러분께서 <대길전>의 축제를 즐겨 주시는 덕분이 아닐까. 그렇게 생각하고 있답니다."
10008010-60 = "앗! 그럼, 말이 나온 김에 이곳 <대길전>의 새해맞이 행사는 다른 곳의 행사와 무엇이 다르고 또 특별한지, 직접 관리인에게서 이야기를 들어보고 싶군요!"
10008010-61 = "흠흠. 그렇군요. 우선 저희의 새해맞이 행사는 인텔리하고도 스마트한 운영으로……."
10008010-64 = "후후. 격조했습니다. 저번에는 신세를 졌습니다."
10008010-65 = "이번 사업도 무사히 총학생회의 눈을 피해서 다행이군요……."
10008010-66 = "그렇지 않아도 최근 저희 업체에서 인수합병한 거래업체가……."
10008010-67 = "하긴 저희 또한 이번에 체결한 산해경의 학원 지구 건설계약이……."
10008010-68 = "[s] \"시끌벅적하네.\""
10008010-69 = "후후후. 압력이 느껴지지 않아? 저러면서 서로를 탐색하고 있는 거야."
10008010-70 = "총만 쏘지 않을 뿐이지, 전투를 치르고 있는 거라고."
10008010-71 = "우리도 이렇게 화려하게 등장해주었으니 분명 눈에 띄겠지. 우리를 주시하는 뜨거운 시선들이 느껴지지? 자, 모두 몸가짐에 신경 쓰도록 해."
10008010-72 = "응? 잘 모르겠는데."
10008010-73 = "후후후. 긴장을 놓치지 마. 자아, 선생님, 좀 더 가슴을 펴도 좋아. 이 흥신소 68의 위광에 샬레가 묻어가는 걸 허락해 줄 테니……."
10008010-78 = "네에, 화장실은 저기입니다~"
10008010-79 = "오미쿠지는 이쪽에서 뽑을 수 있어요!"
10008010-80 = "[s] \"세리카?\""
10008010-81 = "응……?"
10008010-82 = "선생님?!"
10008010-83 = "새, 새해 복 많이 받아……."
10008010-85 = "너는……."
10008010-86 = "앗, 아비도스의 알바 쨩이다."
10008010-88 = "게다가 흥신소 녀석들까지……? 뭐야? 어째서 너희들이 여기 있는 거야?"
10008010-89 = "[s] \"세리카, 오늘은 여기서 무녀 아르바이트야?\""
10008010-90 = "아, 응. 여기 시급이 꽤 짭짤하거든. 쉬는 날이라고 놀기만 하면 돈을 모을 수 없으니까."
10008010-91 = "[s] \"여전히 성실하구나. 세리카 쨩은.\""
10008010-92 = "헤헤. 칭찬해도 아무것도 나오지 않거든, 선생님?"
10008010-93 = "뭐, 이만한 시급의 알바 자리를 찾는 것도 쉬운 게 아니라서."
10008010-94 = "……그러니까 흥신소, 네 녀석들 무슨 속셈인진 모르겠지만, 이번에도 여기를 폭탄으로 날려버릴 셈이라면 진짜 가만두지 않을 거야."
10008010-95 = "그, 그럴 리가 없잖아?! 우리가 뭐, 틈만 나면 아무거나 폭파하고 다니는 줄 알아?!"
10008010-96 = "그냥 평범하게 새해맞이 행사에 온 거라구!"
10008010-97 = "……뭐어, 역시 그렇겠지."
10008010-98 = "어쨌거나 너희들도 소원을 빌려고 온 거지?"
10008010-99 = "[s] \"응? 바로 알아봤네?\""
10008010-100 = "최근 SNS를 보고 찾아왔다는 사람이 엄청 늘어나서 말이야."
10008010-101 = "새전함 쪽으로 안내해줄게."
10008010-105 = "이쪽이야."
10008010-106 = "우후후. 고마워, 알바 쨩."
10008010-111 = "자, 여기야."
10008010-116 = "엄청난 줄이네……."
10008010-117 = "우리 차례가 되려면 꽤 기다려야 할 거 같아."
10008010-118 = "……있잖아. 뭔가 그 새전함 이상하지 않아? 대놓고 '금고'라고 쓰여 있는데?"
10008010-119 = "여기 사장님의 특별 지시야. 소원을 빌러 오는 사람들이 너무 많다 보니 현금을 주체 못해서 금고처럼 만들었다고 하던데?"
10008010-120 = "으, 으음……."
10008010-121 = "뭔가 '빌면 이루어진다' 라는 소문 때문에 인파가 장난 아니게 모이고 있거든."
10008010-122 = "흥. 그만큼 상술에 놀아나는 사람들이 많단 거지. 시시한 이야기야."
10008010-123 = "흐응. 그치만 실제로 몇명이나 소원을 성취했다고 감사 인사를 하러 왔었단 말이지. 내 눈으로 똑똑히 봤어."
10008010-124 = "지, 진짜로……?"
10008010-125 = "밑져야 본전 아냐? 그래서 나도 알바비 받은 걸로 가볍게 소원을 빌어보려고."
10008010-126 = "자아, 그럼 난 이만 가볼게. 다들 얌전히 있다가 가."
10008010-127 = "선생님도 나중에 봐."
10008010-132 = "흐, 흐음……."
10008010-135 = "'빌면 이루어진다' 라니, 정말일까요?"
10008010-136 = "전 믿어요! 실제로 소원을 성취한 사람들이 제 주변에도 있어요."
10008010-137 = "하긴, 제 주위에도 분명……."
10008010-139 = "흐, 흐으음……."
10008010-145 = "(아루 쨩이 동요하기 시작했어.)"
10008010-146 = "(…….)"
10008010-148 = "하지만 이게 진짜라면, 그만큼 위험합니다."
10008010-149 = "네? 위험하다고요?"
10008010-150 = "수많은 사람들이 새전함에 돈을 넣고 소원을 빌었을 테니, 새전함엔 그만큼의 염원이 쌓여 있을 겁니다."
10008010-151 = "그 염원이 이루어지기도 전에 저 새전함에 [ruby=不淨]부정[/ruby]함이 묻는다면……."
10008010-152 = "묻는다면……?"
10008010-153 = "빌었던 소원들이 그대로 뒤집혀서 이루어지게 되겠지요!"
10008010-154 = "아니, 설마 그런 일이 일어날 리가……."
10008010-155 = "뭘 모르시는군요. 그렇게 방심하다간 일이 벌어졌을 때 모든 걸 그르치고야 말 겁니다! 언제나 조심! 또 조심해야 하는 법!"
10008010-156 = "과, 과연……! 이거 단순한 장난으로 임하면 안 되겠군요……!"
10008010-161 = "저기, 사장. ……너무 신경 쓰지 마."
10008010-162 = "흐응? 카요코 과장. 무슨 소릴 하는 거야."
10008010-163 = "이 내가 그런 근거도 없는 미신에 휘둘릴 거라고 생각한 거야?"
10008010-164 = "어차피 단순한 확률의 이야기야."
10008010-165 = "이만큼 많은 사람들이 몰린다면 그중에 어쩌다 소원이 이루어진 사람도 있을 수 있겠지."
10008010-166 = "그런 착각들이 쌓여서 소문이 된 거라고."
10008010-167 = "아니면, 흥행을 위해 연기자들을 모아서 그런 얘기를 퍼트렸을 수도 있고."
10008010-168 = "그런 상술도 파악하지 못해서야, 한 사업체를 이끈다고 할 수 있겠어?"
10008010-173 = "……."
10008010-174 = "헤에……."
10008010-177 = "[ns] \"그럼 소원을 빌 차례네.\""
10008010-182 = "후후후, 이제 우리 차례인가."
10008010-183 = "쿠, 쿨하게 거액의 현금을 내는 멋진 모습……!"
10008010-184 = "흐응~ 새삼스럽지만 이런 거에 정말 의미가 있는 거야?"
10008010-185 = "아루 쨩의 말대로 새전을 넣는다고 딱히 우리 평판이 올라갈 거 같지도 않고, 사람은 많고 시끄럽고."
10008010-186 = "상황이 사장이 생각했던 것이랑은 많이 다른 것 같지만……. 뭐, 온 김에 소원이라도 빌고 가는 걸로 만족해야지."
10008010-190 = "사장이 준비해두라고 했던 현금. 5만 엔."
10008010-191 = "와앗, 5만 엔?!"
10008010-192 = "카, 카요코? 그, 그 정도로 거액을 준비하라는 얘기는 아니었는데?!"
10008010-193 = "이게 거액이면…… 대체 어떤 위엄을 보여주려고 했던 거야……."
10008010-194 = "아니, 뭐, 됐어. 원래 신작 앨범들을 사려고 모아두었던 거지만. 새해 소원을 빌 때 쓰는 것도 나쁘지 않겠다. 싶어서 말이야."
10008010-199 = "……."
10008010-201 = "으, 으윽……."
10008010-202 = "그, 그럼 다음은 저예요!"
10008010-203 = "지난 몇 개월 동안 심야 공사장에서 잠을 줄여가며 일해 모은……."
10008010-204 = "30만 엔이에요!"
10008010-205 = "뭐어?!"
10008010-206 = "?!"
10008010-207 = "뭐, 뭐라고……?"
10008010-208 = "저 같은 쓰레기가 아루 님과 다른 분께 도움이 되려면 이런 방법밖에 없어서……"
10008010-209 = "매일매일 토하고 싶을 만큼 힘들었지만…… 몇 번이고 죽고 싶었지만……."
10008010-210 = "이 하찮은 돈이 드디어 도움이 될 수 있다니! 너무 기뻐요."
10008010-212 = "자, 잠까아안?!"
10008010-216 = "앗, 들어가 버렸다……."
10008010-217 = "……."
10008010-218 = "(중얼중얼) ……."
10008010-220 = "……네! 소원, 확실하게 빌었습니다!"
10008010-221 = "저기, 그걸로 정말 괜찮아? 하루카 쨩……?"
10008010-222 = "네? 괜찮냐니요……?"
10008010-223 = "이렇게 도움이 될 수 있어서 오히려 영광이에요."
10008010-228 = "……."
10008010-229 = "[s] \"뭐, 이번엔 내 차례려나.\""
10008010-233 = "[ns] 새전함에 돈을 넣는다."
10008010-236 = "[ns] ……."
10008010-237 = "자, 그럼 다음은 아루 쨩 차례야."
10008010-238 = "으, 으으음……."
10008010-239 = "……훗. 좋아."
10008010-243 = "헤에……"
10008010-244 = "아루 쨩이 무슨 얘길 하려는 거였는지 조금은 알 것 같아. 저런 모습을 보여주라는 거였구나."
10008010-245 = "과연 사장. 저러고 있으니 확실히 분위기가 사는데."
10008010-246 = "거액을 아무렇지도 않게, 라는 건 저런 위압감을 말하는 것이었나."
10008010-247 = "아루 님…… 위엄이 넘치세요……."
10008010-248 = "……훗."
10008010-251 = "(무, 무거워! 엄청 무거워!!)"
10008010-252 = "(5만 엔?! 카요코, 자기 취미를 참아가며 그런 거액을 만든 거야?)"
10008010-253 = "(하루카?! 30만 엔이라고?! 언제 심야 공사장 알바를 하고 있었던 거야?!)"
10008010-254 = "(매일 아침에 얼굴이 안 좋아 보였던 건 그것 때문이었어?! 그, 그런 돈을 이런 데에…….)"
