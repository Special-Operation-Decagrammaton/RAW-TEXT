[translation]
10026050-1 = "제5화;조사 포인트 C. 버려진 레몬 농장"
10026050-2 = "(포인트 C는 산 중턱의 넓은 평지로, 레몬 나무들이 빼곡하게 자라 있는 곳이었다.)"
10026050-3 = "(오랫동안 방치된 나무들이 무성하게 자라, 한 치 앞도 제대로 보이지 않았다.)"
10026050-7 = "[ns1] \"어라. 설마 미아가 된 건가……?\"\n[ns2] \"포인트들이 하나같이 복잡한 구조네.\""
10026050-10 = "어라, 선생님? 거기 계셨나요……?"
10026050-15 = "[ns] \"하나코?\""
10026050-16 = "선생님도 길을 잃으셨나 보네요. 하긴 나무가 워낙 무성하기도 하고요."
10026050-17 = "사실 이 정도면 이미 레몬 농장이 아니라 레몬 숲이라고 불러야 하지 않을지……."
10026050-18 = "후후……."
10026050-19 = "……네?"
10026050-20 = "……'농장'이라는 걸 어떻게 아냐고요……?"
10026050-21 = "그야……."
10026050-25 = "……어라. 그러……네요?"
10026050-26 = "음-. 여기선 뭐라고 해야 할까요? 그냥 직감……인 걸로?"
10026050-27 = "어떻게……. 그 부분은 대충 안 될까요?"
10026050-28 = "으으음-. 역시 믿지 않으시는 얼굴이시네요. 그렇다고 다시 캐묻거나 따지지도 않으시고……."
10026050-29 = "그러고 보면 선생님께서는 처음부터 뭔가 의도라든가……. 살피시는 느낌이었는데 말이죠."
10026050-30 = "물어보실 게 많지 않으신가요? 왜 이런 자리를 마련했는지, 코하루 쨩은 왜 데리고 왔는지 등등. 여러 가지로."
10026050-31 = "이대로……. 괜찮으세요? 이런 식으로 슬그머니 넘어가도?"
10026050-32 = "[s3] \"그야 뭐, 괜찮겠지? 하나코의 일이니까.\"\n[s4] \"궁금하긴 하지만, 의심하지도 않으니까.\""
10026050-35 = "어라라……."
10026050-36 = "이건 또 예상외의 반응이……. 그렇다고 그렇게 대답하실 거라고는 생각하지 못했는데 말이에요."
10026050-37 = "어쩌면 저, 생각보다 훨씬 더 큰 신뢰를 받고 있던 걸지도?"
10026050-38 = "그럼 일단 지금은 이대로 넘어가고, 다음에 '기회'가 되면 다시 분위기를 봐서……"
10026050-39 = "[s] \"…….\""
10026050-41 = "[ns7] \"하지만 말하고 싶으면 얼마든지 말해도 좋아.\"\n[ns8] \"그래도 이렇게까지 했는데, 그냥 넘어가는 건 서운하겠지?\""
10026050-44 = "…………."
10026050-45 = "후후……."
10026050-46 = "……선생님……. 역시……. 기대를 저버리지 않는 분이라고 해야 할까요."
10026050-47 = "음-. 그러네요. 이러면 또 바통이 저에게 넘어온 건가요?"
10026050-48 = "이런 방식은 그리 익숙하지 않지만……."
10026050-49 = "그래도 모처럼 그렇게 말씀해 주셨으니……. 이번에는 말씀대로, 그래 볼까요?"
10026050-50 = "응. 여름이니까요."
10026050-54 = "어디 보자. 제가 먼저 맞춰 볼게요. 아마도 선생님께서는……."
10026050-55 = "제가 이 모든 상황을, 우이 씨나 코하루 쨩을 위해서 준비했다고 생각하시겠죠."
10026050-56 = "선생님께 따로 설명 드리지 않았음에도 걱정하지 않으시는 부분이나, 절 믿어준다고 하신 것들만 봐도 말이에요."
10026050-57 = "먼 곳의 휴양지 같은 섬. 사실상 바캉스나 다름없는 이런 공간."
10026050-58 = "유적 탐사라고는 하지만, 수영복을 입고 다 같이 여름을 보내는 거나 다름없는 상황."
10026050-59 = "실제로 코하루 쨩도 내심 바랐던 것이고, 우이 씨도 마침 곤란함에 빠져 있었고……."
10026050-60 = "모든 걸 한 번에 해결할 수 있는, '상황 해결을 위한 장치'로 딱 맞는 계획."
10026050-61 = "……네."
10026050-62 = "결과적으로 그것들은 모두……. 다 맞는 이야기라고도 할 수 있겠고요."
10026050-63 = "그리고 선생님께서도, 어느 정도 예상하고 계셨을 거라고 생각한 부분들."
10026050-64 = "…………."
10026050-65 = "그렇지만……. 선생님."
10026050-66 = "이건 좀……. 만약에, 만약의 이야기지만요."
10026050-70 = "어쩌면 이런 자리가 필요했던 건……. 코하루 쨩이나 우이 씨만이 아니었다."
10026050-71 = "……라고 하면 어떨까요?"
10026050-72 = "[s9] \"……하나코?\"\n[s10] \"그렇다는 말은…….\""
10026050-75 = "그야, 음……. 사실 어떻게 보면 자연스러운 이야기기도 하잖아요?"
10026050-76 = "누가 뭐래도 일단은 한창때의, 또래 여고생이고."
10026050-77 = "주변에서 어떻게 보는가와는 관계없이……. 그 본인 또한 한 편으로는 평범한 소녀."
10026050-78 = "때로는 코하루 쨩이나 다른 사람들처럼……. 천진난만하게 바랄 때가 있고, 원할 때가 있다."
10026050-79 = "굳이 누군가를 위해서 했다는 건……. 스스로에게도 편한 변명. 혹은 자신을 위한 명분."
10026050-81 = "그치만 사실 내심, 속으로는. 그저 본인 또한 같이하고 싶었다."
10026050-84 = "……전에 같이 가지 못했던 것이 아쉬웠다."
10026050-86 = "라는 쪽의 이야기도 불가능하진 않으니까요. 후후."
10026050-87 = "[s] \"…….\""
10026050-88 = "으음-. 말씀이 없으시네요. ……역시 좀 어색한 이야기일까요? 그런 아이에게는?"
10026050-89 = "그래요. 아쉽지만, 어쩌면 어울리지 않는 이야기였을지도 모르겠어요."
10026050-90 = "[s11] \"아니, 하나코도 이젠 꽤 여유가 생겼구나 싶어서.\"\n[s12] \"어느덧 그런 말도 할 수 있게 되다니, 정말로 기쁜걸.\""
10026050-93 = "…………."
10026050-94 = "으음. 그런가요?"
10026050-95 = "……어라……. 생각해 보니 확실히 그럴지도요."
10026050-96 = "하지만 이런 곳까지 와서, 이렇게 모처럼 정말로 둘밖에 없는 상황이 돼서까지……."
10026050-97 = "평소 같은 농담이나 실없는 이야기로 시간을 허비하고 싶지는 않았거든요. 그런 건 밖에서도 얼마든지 할 수 있고."
10026050-98 = "아무튼 그런 관계로, 선생님."
10026050-99 = "앞으로도 조금 더……. 지금처럼. 이번 일처럼."
10026050-100 = "조금은 더 욕심을 내 봐도 괜찮을까요?"
10026050-101 = "[s] \"응.\""
10026050-102 = "……어라, 즉답?"
10026050-103 = "너무 대답이 빠른데요? 그렇게 쉽게 대답해 버리셔도……. 정말 괜찮으신 건가요?"
10026050-104 = "어쩌면 이건 선생님의 생각보다 훨씬 더, 부담스러운 부탁일지도 모른다고요?"
10026050-105 = "[s13] \"응. 여름이니까.\"\n[s14] \"뭐, 한창때의 또래 여고생이니까.\""
10026050-108 = "……후후."
10026050-109 = "좋아요. 그럼 이다음은, 저도 조금 더 기대해 보도록 할게요."
10026050-110 = "……알고 계시죠? 이래 봬도 꽤 기억력은 좋은 편이니까요."
10026050-114 = "지금 해주신 약속, 잊지 않을 거라고요♡"
10026050-119 = "(이후 하나코와 좀 더 레몬 농장 사이를 거닐다 베이스캠프로 돌아갔다.)"
10026050-123 = "(그리고 단지 둘이 함께 있었다는 이유로, 코하루에게 몇 번이나 사형 선고를 들어야 했다.)"
