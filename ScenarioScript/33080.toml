[translation]
33080-1 = "제8화;불과 재의 날 2"
33080-10 = "……한두 명이 아니에요. 주변으로…… 수십……, 아니, 수백 명 규모의……?"
33080-18 = "!!"
33080-21 = "따라잡았다. 그리고 성도회의 미메시스도 확인했어."
33080-22 = "……드디어 조약에 조인한 것인가. 그리고 그 인형과의 거래도 잘 진행되었나 보네. 아츠코."
33080-27 = "히, 히익……!!"
33080-28 = "나, 나무 인형이 움직인다……!!"
33080-30 = "……무례하군. 나를 부를 때는 예술에 대한 경의를 담아 마에스트로라고 칭해라."
33080-31 = "……."
33080-32 = "아니, 어차피 너희들은 예술이 무엇인지 이해하지도 못하겠지. 너희는 내 대화상대가 될 자격에 한참 못 미친다."
33080-33 = "지성도, 품격도, 경험도, 모두 부족하다……. 키보토스의 학생이란 고작 이 정도인가. 너무나 실망스럽군."
33080-34 = "그럼에도 내가 너희들을 돕는 것은 저 수호자들의 위엄, 그것을 [ruby=미메시스]복제[/ruby]할 수 있다는 것에 흥미가 있었을 뿐이다."
33080-35 = "계명을 수호하는 자의 혈통…… 그 로열블러드의 계율이 동작하는 것을 지켜볼 수 있었던 것은 행운이지만……."
33080-36 = "……."
33080-37 = "그걸로 나의 실험은 조금 더 숭고에 다다를 수 있겠지."
33080-38 = "……그래. 너희들 따위에게 설명을 계속해봤자 의미없겠군. 자, 그럼 약속대로 나에게 트리니티의 지하에 있다는 교의(敎義)로 안내해라."
33080-39 = "(휘릭) ……."
33080-43 = "그쪽인가……."
33080-51 = "키아아아아아아아아앗-!!"
33080-66 = "……하아. 하아."
33080-67 = "……끝이 없어요. 이건, 이 자들은…… 도무지……."
33080-68 = "어, 어쩌죠……? 최, 최소한 선생님만이라도 탈출을……."
33080-74 = "……!! 이건……."
33080-75 = "이쪽이야!"
33080-76 = "[ns] \"히나……!!\""
33080-77 = "선도부장……!!"
33080-78 = "히요리, 히나를 저지하지 못했나?"
33080-79 = "콜록, 콜록……. 죄, 죄송해요…… 막지 못했어요……. 성도회가 현현하기도 전에…… 저희를 쓰러트리고 지나가버렸……."
33080-83 = "정의실현부! 선생님을 이쪽으로 보내! 시간이 없어!"
33080-84 = "……."
33080-85 = "……."
33080-86 = "……알겠습니다."
33080-87 = "선생님, 저희가 적을 막는 동안 저쪽으로 후퇴해주세요! 선도부장의 안내를!"
33080-89 = "[s] \"너희는?!\""
33080-91 = "저희는 선생님의 퇴로를 지킵니다."
33080-92 = "네. ……선도부장의 저 행동은 그것을 상정하고 있습니다……. 불쾌하지만, 지금은 그것 말고는 답이 없네요."
33080-93 = "[s] \"하지만…….\""
33080-94 = "선생님! 지금 트리니티의 수뇌부는 모두 괴멸 상태입니다! 시스터후드도, 티파티도 없는 지금……."
33080-95 = "선생님께마저 문제가 생긴다면…… 상황은 더욱 걷잡을 수 없게 되어버릴 겁니다!"
33080-96 = "[s] \"……!!\""
33080-97 = "그러니까 선생님은 반드시 무사하셔야 합니다! 부디!"
33080-98 = "선생님, 서둘러. 시간이 없어!"
33080-99 = "선생님."
33080-100 = "부, 부탁드려요, 선생님……!"
33080-101 = "[s] \"……….\""
33080-105 = "[ns] 히나에게로 달려간다."
33080-107 = "선도부장! 선생님을 부탁드립니다!"
33080-115 = "……물론이야."
33080-116 = "선생, 지금 저 괴물들을 상대할 수 있는 방법은 없어…… 지금은 포위망을 뚫고 탈출하는 것만이 유일한……."
33080-117 = "큭."
33080-118 = "[s] \"히나, 상처가…….\""
33080-119 = "이 정도는 괜찮아……. 자, 선생, 나를 따라 와. 떨어지지 말고."
33080-120 = "지금부터 퇴로를 열겠어."
