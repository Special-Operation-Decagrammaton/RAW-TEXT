[translation]
1012906-1 = "소녀가 쫓아온 반짝임"
1012906-2 = "(스즈미가 알려준 장소로 왔다.)"
1012906-3 = "(트리니티 내에 있는 한산한 유원지였다.)"
1012906-6 = "(10분이 지나자, 스즈미가 왔다.)"
1012906-10 = "선생님, 늦어서 죄송합니다!!"
1012906-11 = "정말로 죄송합니다."
1012906-12 = "[s1]\"아니야 나도 방금 왔어!\"\n[s2]\"괜찮아, 괜찮아.\""
1012906-15 = "관대하게 받아주셔서 감사합니다……."
1012906-16 = "이, 이 옷은 그러니까, 오늘 지각하게 된 사유와 관련이 있습니다만……."
1012906-17 = "실은 어제……."
1012906-18 = "과로했었는지, 실수로 사인펜과 빨랫감을 함께 세탁해 버려서……."
1012906-19 = "……무사했던 것은 이 옷뿐이었습니다."
1012906-20 = "무, 물론……! 유원지에는 미리 전화로 양해를 구했습니다."
1012906-21 = "오늘은 별도의 행사가 없기에, 배역으로 오해받을 일은 없을 겁니다."
1012906-22 = "[s3]\"속상했을 텐데, 와줘서 고마워.\"\n[s4]\"미리 연락도 하고, 침착하게 잘 해냈구나!\""
1012906-25 = "이런 확인은 중요…… 하니까요."
1012906-26 = "(……선생님께 다음에 뵙자고 말씀드리고 싶지 않았기도 하고요.)"
1012906-27 = "(오늘도, 뵙고 싶었으니까…….)"
1012906-28 = "[s5]\"엄청 예쁜걸, 멋져!\"\n[s6]\"마침 놀이공원에 잘 어울리는 옷이라 생각해!\""
1012906-31 = "그, 그렇습니까. 다행입니다."
1012906-33 = "(스즈미와 함께 놀이공원을 즐겼다.)"
1012906-34 = "(의상 덕분에 어린아이들에게 인기가 많았다.)"
1012906-38 = "받아라, 기가 라이트닝!!"
1012906-39 = "괴수가 더 나타났어!!"
1012906-40 = "저건…… 무대 공연이군요."
1012906-41 = "괴수군단과의 대결전…… 그렇군요, 히어로 쇼네요."
1012906-42 = "……."
1012906-44 = "(스즈미는 한참 동안 가만히 서서 무대를 보았다.)"
1012906-51 = "앗,"
1012906-52 = "실례했습니다. 너무 시간을 끌었지요."
1012906-53 = "[s]\"무언가 고민이라도 있니?\""
1012906-54 = "고민…… 이라면 고민일지도 모릅니다."
1012906-55 = "사람들은 누군가를 구해내는 영웅의 이야기를 좋아하는군요."
1012906-56 = "저 히어로도, 지금 제가 입고 있는 마법소녀도 그런 이야기입니다."
1012906-57 = "모두가 그 영웅을 바라는 것은, 영웅이 실제로는 없기 때문이겠지요."
1012906-58 = "……이런 생각을 하고 있었습니다."
1012906-59 = "[s7]\"영웅은 지금 내 앞에도 있는데?\"\n[s8]\"영웅의 옷을 입고, 영웅으로 행동했는걸.\""
1012906-64 = "그런가요?"
1012906-65 = "……."
1012906-66 = "스스로가 영웅이라고 재고 싶지는 않았습니다만,"
1012906-67 = "선생님께서 그렇게 불러주시는 것은, 싫지 않습니다."
1012906-68 = "항상, 선생님은 진심으로 절 대해주시니까요."
1012906-69 = "상대의 호의를 순수하게 받아들일 수 있다는 것은, 이렇게 기쁘군요."
1012906-70 = "[s9]\"스즈미가 진짜로 멋지니까!\"\n[s10]\"스즈미가 정말로 멋지니까!\""
1012906-73 = "함께 해주셔서 감사합니다."
1012906-74 = "재미없는 이야기만 했어도, 상냥하게 보아주셔서 감사합니다."
1012906-75 = "아, 벌써 밤이……."
1012906-81 = "이제는 여기에서도, 별을 잡을 수 있을 것만 같아요."
