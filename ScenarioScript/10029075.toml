[translation]
10029075-1 = "제7화;학원 도시 최강의 정신계 능력"
10029075-6 = "뭐, 뭐야? 이게! 대체 이것들은 다 뭐 하는 녀석들이야!?"
10029075-7 = "대체 어디서 튀어나온 녀석들이냐고!? 게다가 왜 자기들끼리도 싸우고 있는 건데!?"
10029075-8 = "뭐, 뭐야!? 여긴 대체 어디야!? 우린 왜 여기 있는 거지!?"
10029075-9 = "우선 주변을 장악해!!"
10029075-10 = "거슬리는 놈들은 모두 제압하고, 이곳을 조사한 뒤 위에 보고한다!!"
10029075-12 = "어……. 여긴 밀레니엄 쪽 폐허 아냐!? 어째서 우리가 이런 곳에 있는 거지……!?"
10029075-13 = "……!! 너희는……!!"
10029075-14 = "……? 저 녀석들은 카이저 PMC의……."
10029075-15 = "그렇군, 잘은 모르겠지만 놈들이 여기 괜히 있진 않겠지. 일단 다 쓸고 생각한다!!"
10029075-16 = "전원 전투준비!!"
10029075-18 = "웃기지 말라고! 이쪽은 무슨 허수아비인 줄 알아!? 전부 연장 챙겨!! 일단 먹고, 무슨 일인지는 그다음이다!!"
10029075-24 = "서, 설마……."
10029075-25 = "설마 또 다른 세계!? 그럼 지금……. 시공이 뒤섞인 건가요!?"
10029075-26 = "[s1] \"뭐, 일단은 다 이쪽 친구들이지만…….\"\n[s2] \"그렇게 보여도 할 말은 없다만…….\""
10029075-29 = "……네? 전부 여기 사람들이라고요?"
10029075-33 = "……저 사람들이 전부!?!?"
10029075-37 = "……꽤나 개성 넘치는 친구들이 많은 곳이네, 여기는."
10029075-38 = "이제 어떻게 할 거야, 미사카 씨? 이대로라면 수리는커녕 설비의 흔적도 안 남겠는걸?"
10029075-39 = "자꾸 남 일처럼 굴래!? 너도 못 돌아간다고!!"
10029075-40 = "선생님!! 뭐라도 좋으니까 좀 방법 없어!? 전부 선생님 친구들이라며!?"
10029075-41 = "……뭐?"
10029075-42 = "친구는 아니라고? ……오히려 싸워 본 적이 있는 상대들?"
10029075-43 = "……적이었냐!!!"
10029075-44 = "아으으으……! 왜 하필이면 이런 타이밍에……!!"
10029075-50 = "……? 선생님? 날 불렀어?"
10029075-51 = "……응? 설비를 정상적인 상태로 돌릴 수 있겠냐고? 그거야 해 볼 수는 있겠지만……."
10029075-52 = "시간이 조금 걸릴 거야. 그동안 설비가 공격이라도 당했다간, 그때에는 정말 어떻게 될지 장담할 수 없어."
10029075-53 = "지금도 이미 충분히 부작용이 넘치는 상태니까요! 게다가 수리를 마치면 그건 그것대로 또 설비가 작동해서 모두를……."
10029075-55 = "그건 괜찮아. 수리하는 과정에서 칩을 넣은 상태로 수리를 마치면 그만이니까."
10029075-56 = "수리가 끝남과 동시에 부장이 조작한 대로 기계의 알고리즘이 바뀌는 거지. 문제없어."
10029075-57 = "문제는……."
10029075-58 = "[s3] \"저쪽 난장판을 잠시라도 멈추는 거네.\"\n[s4] \"수리하는 동안만이라도 모두를 막아내는 거네.\""
10029075-64 = "……하아."
10029075-65 = "그렇게나 피하려 했는데, 결국엔 이렇게 되는 걸까나……?"
10029075-66 = "처음 보는 곳에서 이렇게 인상력 남기는 쪽은 흥미가 없는데……."
10029075-67 = "…………."
10029075-68 = "……얼마면 돼? 3분? 아니, 5분 정도면 어떻게든 할 수 있겠지?"
10029075-69 = "[s7] \"……쇼쿠호?\"\n[s8] \"얼마면 되냐니……?\""
10029075-72 = "당연히 '멈추고 있을 시간'의 이야기지. 얼마나 길면 되냐고."
10029075-73 = "……!! 쇼쿠호……!"
10029075-74 = "그런 표정 짓지 마, 미사카 씨. 이쪽은 딱히 좋아서 하는 건 아니거든."
10029075-75 = "하지만 미사카 씨의 말대로, 돌아가지 않으면 곤란한 건 모두 마찬가지니까?"
10029075-76 = "그런 의미에서 아주, 아주 조금은……."
10029075-77 = "보여주는 수밖에 없겠네."
10029075-87 = "……?? 무, 무슨……?"
10029075-88 = "사람들이……. 모두 멈췄어……?"
10029075-89 = "시간 정지……? 아, 아니야. 사람들만 멈춘 건가요!?"
10029075-90 = "……과연. 이해했어."
10029075-91 = "미코토가 말했던 초능력이라는 게 이거였구나. 이거라면 효율적으로 진행할 수 있어."
10029075-96 = "……저기……."
10029075-97 = "칭찬은 고맙지만……. 이왕이면 그것보다 빨리 수리부터 진행해 주지 않겠어……?"
10029075-98 = "여기선 평소보다 집중력을 유지하기가……. 힘들거든……? 머리도 아프고……."
10029075-99 = "이쪽은 무식하게 부수기만 하면 끝인 누구와 달리, 꽤 섬세력이 있어서 말이지……."
10029075-101 = "……? 그거 내 이야기지?"
10029075-102 = "하지만 맞는 말이야. 서둘러야 해."
10029075-103 = "그리고 기계들은 멈추지 않았으니까, 그 부분은 계속 우리가 상대해야 하고."
10029075-104 = "그래도 전보다는 수가 절반 넘게 줄어든 거나 다름없으니……. 가능하겠지?"
10029075-105 = "뭐, 이 정도라면 가능하지! 그럼 수리 쪽은? 할 수 있겠어?"
10029075-107 = "후후. 뭔가 기대받고 있네, 우리."
10029075-108 = "응. 이런 느낌이라면……. 못 해내면 곤란하니까."
10029075-109 = "반드시 해내 보이죠! 5분! 충분합니다!!"
10029075-111 = "다시 한번 모두 힘내 보죠!! 이제 진짜 다 온 거 같으니까요!!"
10029075-112 = "[s9] \"좋아. 그럼 시작하자!\"\n[s10] \"마지막까지 힘내 보자!!\""
10029075-116 = "……응!!"
