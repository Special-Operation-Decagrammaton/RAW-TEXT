[translation]
3703-1 = "怪しいリミナルスペース（２）"
3703-2 = "こんなの絶対誰かのイタズラだから！#n調査終わり！1階に下りてさっさと帰ろ！！"
3703-4 = ""
3703-5 = ""
3703-6 = ""
3703-7 = "なんで反応しないの！？"
3703-8 = "「異常現象を調べる」ってルールを満たしてないからかも……。"
3703-10 = ""
3703-11 = "調査をしなければ帰してくれなさそうですね。"
3703-12 = "ふふ。どんな異常があるのか楽しみです。"
3703-13 = "では近くの部屋から行ってみましょう。"
3703-19 = ""
3703-20 = "これは……さみしい部屋ですね。"
3703-21 = "変わったことは無さそうだけど――"
3703-23 = ""
3703-25 = "――って、なんでこのパソコン電源ついてるの！？"
3703-26 = "スリープ状態を解除してみましょうか？"
3703-27 = "私はやりたくないわよ……？"
3703-28 = ""
3703-29 = "えいっ。"
3703-33 = "うわぁっ！？なんか真っ赤なんだけどっ！？"
3703-34 = "……部屋を出よう。急いで。"
3703-39 = "おお……一瞬ですがビックリしました。"
3703-40 = "ふふ。この要領で部屋を調べていけばいいのですね？"
3703-41 = "実に面白いです。"
3703-42 = "シャーッ！何が面白いのよ！失敗したら永遠に8階をさまようことになるんだよ！？"
3703-43 = "うぅ……やっぱついてくるんじゃなかった……。"
3703-44 = "異常現象があったら上の階に行くんでしたよね？"
3703-45 = "うん……行こうかぁ。"
3703-52 = "怪しげな建物・5階廊下"
3703-55 = ""
3703-56 = ""
3703-57 = "おおっ？この階はすでに雰囲気が出てますね！"
3703-58 = "イヒッ……今にも何か飛び出してきそうだねぇ。"
3703-59 = "……！！"
3703-60 = "レナちゃん、私の後ろにどうぞ。守ってあげますから。"
3703-61 = "別に怖くないけど！？"
3703-62 = "さて、ここには何があるんでしょうか？"
3703-64 = ""
3703-67 = "……あれ？部屋は綺麗ですね。"
3703-68 = "他にも特に何もなさそうですし……。"
3703-69 = "では隣の部屋に行ってみましょう。"
3703-73 = "あら……こちらも綺麗ですね。"
3703-74 = "古い廊下と、綺麗な部屋……。"
3703-76 = "他の部屋も同様に綺麗だった。"
3703-77 = "隅々まで調べてもこれといった異変は起きなかった。"
3703-79 = "さあ、選択の時間です。"
3703-80 = "目立つ異変こそありませんでしたが、強いて言えば廊下と部屋の様子は違っていました。"
3703-81 = "これを「異常現象」と定義するか否か、という話でしょうか。"
3703-82 = "リミナルスペースは元々が違和感を感じさせる場所ですし、難しいですね。"
3703-83 = "レナちゃんは……どう思う？"
3703-84 = "難しいなら下にしない？8階に行ったらゲームオーバーなんでしょ？私ヤだよ。"
3703-85 = "では下がるということで。もう一度4階に行きましょう！"
3703-92 = "怪しげな建物・4階廊下"
3703-94 = ""
3703-95 = "なにこれ！？さっきと全然違うじゃん！？"
3703-96 = "ふふ……外が見えないのでは、状況がまったく分かりませんね。"
3703-97 = "うあああああ……！"
3703-99 = "こうして、リミナルスペース脱出のための冒険が続いた。"
3703-101 = "怪しげな建物・6階廊下"
3703-102 = ""
3703-103 = ""
3703-104 = ""
3703-109 = ""
3703-110 = ""
3703-112 = "怪しげな建物・2階の部屋"
3703-113 = ""
3703-114 = ""
3703-116 = ""
3703-118 = "怪しげな建物・3階の部屋"
3703-119 = ""
3703-120 = ""
3703-123 = ""
3703-124 = ""
3703-125 = ""
3703-127 = "怪しげな建物・7階の部屋"
3703-129 = ""
3703-130 = ""
3703-132 = ""
3703-133 = ""
3703-134 = ""
3703-136 = "異常現象は絶え間なく発生し続け――"
3703-137 = "オカルト研究会一同は、ついに7階のエレベーターで最後の選択を迫られていた。"
3703-139 = "怪しげな建物・7階のエレベーター"
3703-140 = "もうやだ～っ！いよいよエレベーターの電気まで消えたんだけど！？"
3703-141 = "8階行きのボタンだけが動くみたいだねぇ……。"
3703-142 = "やっぱり、怪しい影の仕業かなぁ……？"
3703-143 = "何の影！？"
3703-144 = "分からない……すぐ逃げちゃったから。"
3703-145 = "ひぃぃっ……！！"
3703-146 = "やっぱついてくるんじゃなかった！おとなしく寮で寝てればよかったんだ！！"
3703-147 = "終わりよ……もう全部終わり……！！"
3703-148 = "怖がる必要はありません！これでオカルトの実在を証明できたのですから！"
3703-149 = "私たちの冒険はここからです！"
3703-150 = "こんな冒険求めてないのにぃ……！"
3703-151 = "だって聞いてないもん！「リミナルスペース」が本当にあるなんて！！"
3703-152 = "出して！ここから出してよぉーーっ！！"
3703-154 = ""
3703-155 = ""
3703-156 = "残された選択肢は1つ――"
3703-157 = "上に行きましょう。#nこの先に待ち受けるは絶望か希望か……まだ分かりませんから。"
3703-158 = "8階で終わりなんでしょ？#nそしたら永遠にさまようって……！！"
3703-159 = "私は怖くありません。#n今回の事件はみんなのハートを強くする。そう信じておりますので。"
3703-161 = ""
3703-162 = ""
3703-163 = "どんな時も恐れず、冷静に立ち向かう心こそ――"
3703-164 = "――「ブレイブ」。"
3703-165 = "……ですから！"
3703-166 = "シャーッ！みんなおかしいんじゃないの！？"
3703-167 = "ふふ。#nそれでは……上へ参ります。"
3703-174 = "怪しげな建物・8階廊下"
3703-176 = "……やっぱり雰囲気ありますね。今にも何かが飛び出してきそうです。"
3703-177 = "で、ど、どうするの？"
3703-178 = "対策なら……あるよぉ。"
3703-179 = "にゅふふ。こんな時に備えて退魔のまじないを用意してきました。"
3703-180 = "そういうのがあるなら早くやって！？"
3703-181 = "これは特殊なまじないなので、使えるのは1度きり。#nここぞという時のために、大事に大事に取っておいたんです。"
3703-182 = "今がその時だと思う……。"
3703-183 = "……はい。私もそう思います。"
3703-185 = ""
3703-186 = "覚悟は決まりました。みなさん、準備はいいですか？"
3703-187 = "ふふ、もちろんです。"
3703-188 = "そ、それで何とかなるのよね！？"
3703-189 = "これは紛れもなく悪魔の仕業……！#nツムギは悪魔の誘き出しをお願いします！"
3703-190 = "誘き出し……「あれ」のことですね。"
3703-191 = "カノエ先輩は私と一緒に悪魔の退治を！"
3703-192 = "イヒッ……任せてぇ。"
3703-193 = "最後に、レナちゃんは応援で勇気づけてください……！"
3703-195 = ""
3703-196 = "応援？どうすればいいの？"
3703-197 = "かわいいネコのモノマネです！"
3703-198 = "なんで！？"
3703-199 = "元気が出るからです！"
3703-200 = "私もぉ……。"
3703-201 = "私もです。"
3703-203 = ""
3703-204 = "うぅぅ……もう！分かった！とことんやってやろうじゃないの！！"
3703-205 = "では、私から始めます。"
3703-207 = ""
3703-209 = "いい感じです！次はレナちゃん！"
3703-211 = ""
3703-212 = "み、みゃ～！みゃあみゃああ～……！！"
3703-214 = ""
3703-215 = ""
3703-216 = "あはぁ……元気出てきた……。"
3703-217 = "はい……マナが満ちてきました……。"
3703-218 = "にゃああ～お……！！"
3703-219 = "（シャーッ！何なのよこれ！）"
3703-220 = "これで発動条件は整いました！"
3703-221 = "悪魔よ、出てきなさい！私たちがお相手します！"
3703-226 = ""
3703-228 = ""
3703-230 = "あれは……さっき見た影……。"
3703-231 = "ついに姿を現しましたね！"
3703-232 = "それじゃあ、いくよぉ……。"
3703-234 = ""
3703-235 = "アブラ……！"
3703-236 = "カダブラ――！"
3703-247 = ""
3703-248 = ""
3703-250 = ""
3703-251 = "やりました！"
3703-252 = "――って、ただの銃と閃光弾じゃん！"
3703-253 = "ですが倒せましたよ？"
3703-254 = "もう降参したらどうかなぁ……？勝負はついたと思うよ。"
3703-257 = "くぅっ……！"
3703-259 = ""
3703-260 = "誠に申し訳ございませんでしたーっ！！#nお願いだからセットだけは壊さないでぇ……！"
3703-262 = ""
3703-263 = "せ、セット……？"
3703-265 = "事件の全容はこうだった――"
3703-267 = "撮影用のセット……これ全部ですか？"
3703-268 = "はい。#n私たちは監督になることを夢見て、CGを排除した超写実主義で映像を作っています。"
3703-269 = "その理想を実現すべく、志を共にする仲間と作ったのがここのセットです。"
3703-270 = "セットの点検をしていたら皆さんがいらしたので……。"
3703-271 = "最初は、少し出来栄えを確認しようとしただけだったのですが……#nえへへ……皆さんの反応があまりにも良くって、ついここまで。"
3703-272 = "あのエレベーターはどうやったの？連続で起きた異常現象は！？"
3703-273 = "詳細は営業秘密ですが、こちらを見ていただくのが早いかと。"
3703-277 = "じゃじゃーん。"
3703-278 = "これで操作していたのですね。#nずっと感じていた違和感の正体はこれですか。"
3703-279 = "シャーッ！！ずっとからかわれてたってこと……！？"
3703-280 = "オカルトじゃなかったねぇ。"
3703-281 = "にゅふふ。構いません。"
3703-282 = "まるで魔法のような、楽しい時間でしたから！"
3703-283 = "はい、私も楽しかったです。"
3703-284 = "やはり私たちを待ち受けるのは、絶望ではなく希望でしたね。"
3703-285 = "一瞬だけでも、みんなして信じてたって事実が絶望的じゃない！？"
3703-286 = "ふふっ。ご好評のようで何よりです。"
3703-287 = "はい、私の連絡先をお渡ししておきます。何かあればご連絡ください。"
3703-288 = "それと、今日の録画は映画制作の資料として使わせていただきます！"
3703-289 = "資料！？ダメ！絶対消して！！"
3703-290 = "もちろん、タダでとは言いません。#n……これを。"
3703-291 = "お金で釣るつもり？バカにしないでよ！"
3703-293 = ""
3703-294 = "――と言うには、なかなか良い金額だった。"
3703-296 = "それでは皆さん、お気をつけて！"
3703-298 = "1階に下りるエレベーターの中――"
3703-299 = "はあ……何でこんな目に……。"
3703-300 = "次は絶対騙されないんだから。"
3703-302 = ""
3703-303 = ""
3703-304 = ""
3703-305 = ""
3703-306 = "何よその表情！#n言いたいことがあるなら、はっきり言えばいいじゃない。"
3703-308 = ""
3703-309 = "にゃー……。"
3703-311 = ""
3703-312 = "にゃあ～"
3703-313 = "みゃあ～お。"
3703-314 = "だーっ！それはもう忘れてってば～～っ！！"
3703-318 = "怪しげな建物・4階"
3703-319 = ""
3703-320 = "な、なに？なんで4階に止まるの？"
3703-321 = "故障でしょうか？まあ、こんなこともありますよ。"
3703-329 = "怪しげな建物の外"
3703-332 = ""
3703-333 = ""
3703-334 = ""
3703-335 = "はぁ……やっと出られた……。"
3703-336 = "本物のリミナルスペースだと思ってたので……途中からビクビクでした！"
3703-337 = "噂に忠実と言いますか、見事な再現性でした。#nね、レナちゃん？"
3703-338 = "私に聞かないで！もう思い出したくもないんだから！"
3703-339 = "イヒッ……帰ったらおいしいもの食べようねぇ。"
3703-340 = "……あっ！#nそういえばさっき、4階でエレベーターが止まったじゃないですか。"
3703-341 = "廊下の向こうに立っていた血まみれの女の子、見ました？"
3703-342 = "とても上手なメイクでしたね。あれには私も少しばかり驚きました。"
3703-343 = "ふんっ、あんなの全然怖くないけど？結局作り物でしょ？"
3703-344 = "ん……？なんだか変だね。"
3703-346 = ""
3703-348 = ""
3703-349 = "どうされました？何か忘れ物でも？"
3703-350 = "聞きたいことがあるんだけど……4階にさ、血まみれの女の子っていたかなぁ？"
3703-352 = ""
3703-353 = "はい？そんな演出は使ってないですよ。"
3703-355 = ""
3703-356 = ""
3703-357 = "……だってぇ。"
3703-359 = ""
3703-360 = ""
3703-361 = "あらま。"
3703-362 = "ホンモノってことですか！？#nおお……やっぱりオカルトは存在しました……！！"
3703-363 = "う、ウソだ！お願い！ウソって言って！！"
3703-365 = "とある建物の4階で目撃された、血に染まった少女。"
3703-366 = "それは「境界」に呼び寄せられた異次元の存在だったのだろうか――"
3703-367 = "わーーーっ！ウソウソウソウソ！そんなの全部ウソ～～っ！！！"
3703-368 = "怪しいリミナルスペース"
