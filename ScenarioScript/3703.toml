[translation]
3703-1 = "수상한 리미널 스페이스 2"
3703-2 = "여, 역시 이건 누군가의 장난이 분명해! 다시 1층으로 내려가자!"
3703-7 = "아, 안 되잖아?!"
3703-8 = "<이상 현상을 조사한다>라는 룰을 따르지 않아서 그런 걸지도……."
3703-11 = "일단 조사를 해봐야 한다는 거군요."
3703-12 = "그럼 어서 시작하죠. 어떤 이변이 기다리고 있을지 기대되네요."
3703-13 = "뉴후후, 우선 가까운 방부터 들어가 볼까요?"
3703-20 = "어라? 썰렁한 방이네요."
3703-21 = "따, 딱히 특별한 건 없어 보이는……."
3703-25 = "……게 아니라, 이 노트북은 왜 혼자 켜져 있는 거야?"
3703-26 = "대기화면을 해제해 볼까요?"
3703-27 = "나, 나는 만지기 싫으니까 선배들이 해."
3703-29 = "에잇."
3703-33 = "으, 으아아! 이 빨간 불은 뭐야?!"
3703-34 = "……어서 밖으로 나가자."
3703-39 = "오오…… 순간이긴 했지만 살짝 놀랐어요."
3703-40 = "후후, 이런 식으로 방을 조사하면서 이상 현상을 발견하는 거군요?"
3703-41 = "흥미롭네요."
3703-42 = "샤아악! 뭐가 흥미롭다는 거야! 잘못하면 영원히 방황한다잖아!"
3703-43 = "으으, 역시 분위기에 휩쓸려서 따라오는 게 아니었어……."
3703-44 = "이상 현상을 발견했을 땐 위층으로 올라가는 거였죠?"
3703-45 = "응……. 올라가자."
3703-52 = "수상한 빌딩 5층 복도"
3703-57 = "오~? 여기는 복도부터 분위기가 심상치 않은데요?"
3703-58 = "히히, 분위기 마음에 들어…… 금방이라도 뭐가 튀어나올 것 같아……"
3703-59 = "……!!"
3703-60 = "자아, 레나 쨩은 제 뒤에 있어요. 지켜드릴 테니까요."
3703-61 = "나, 나는 하나도 안 무섭거든!"
3703-62 = "자, 그럼 여기는 뭐가 나오려나요?"
3703-67 = "……엥? 복도랑 다르게 방 안은 상당히 깔끔하네요?"
3703-68 = "그 외엔 딱히 특별한 건 없어 보이고……."
3703-69 = "그럼 바로 옆방을 조사해 볼까요?"
3703-73 = "어머나……. 이쪽도 깔끔해 보이는 곳이네요."
3703-74 = "흐으음…… 낡은 복도와 깔끔한 방이라……."
3703-76 = "다른 방들도 모두 깔끔한 장소였다."
3703-77 = "꼼꼼히 조사했지만, 전부 특별한 이변은 발생하지 않았다."
3703-79 = "이제 선택의 시간이군요."
3703-80 = "특별한 이변은 없었지만, 복도와 방에서 느껴지는 분위기의 위화감."
3703-81 = "그 위화감을 <이상 현상>이라 정의해도 괜찮을지에 대한 문제예요."
3703-82 = "리미널 스페이스는 애초에 위화감을 강하게 느끼는 공간이니, 조금 애매하네요."
3703-83 = "레나 쨩은…… 뭐가 맞는 것 같아……?"
3703-84 = "애, 애매한 거라면 내려가자. 난 올라가기 싫어. 8층에 도착하면 게임오버라며?"
3703-85 = "그러면 이번엔 내려가보죠. 다시 4층으로 돌아가 보는 거예요!"
3703-92 = "수상한 빌딩 4층 복도"
3703-95 = "뭐, 뭐, 뭐야? 갑자기 분위기가 왜 이래?! 아까 봤던 4층이랑 다르잖아?!"
3703-96 = "후후, 밖이 보이지 않으니 어떤 상황인지 도무지 알 수가 없네요."
3703-97 = "으아아아아……!"
3703-99 = "이후 리미널 스페이스를 탈출하기 위한 모두의 모험이 계속되었다."
3703-101 = "수상한 빌딩 6층 복도"
3703-112 = "수상한 빌딩 2층의 어느 방"
3703-118 = "수상한 빌딩 3층의 어느 방"
3703-127 = "수상한 빌딩 7층의 어느 방"
3703-136 = "빌딩에서는 이상 현상이 끊이질 않았다……."
3703-137 = "결국 7층의 엘리베이터 안. 모두가 최후의 선택을 하게 되는데……."
3703-139 = "수상한 빌딩 7층의 엘리베이터"
3703-140 = "으아아아, 이젠 엘리베이터 불도 꺼졌어!"
3703-141 = "8층으로 가는 버튼만…… 작동하는 모양이야……."
3703-142 = "역시 이상한 그림자의 소행인가……."
3703-143 = "이, 이상한 그림자? 무슨 그림자?!"
3703-144 = "나도 몰라. 보자마자 도망쳤으니까……."
3703-145 = "히이이익……!"
3703-146 = "아아아, 역시 선배들을 따라오는 게 아니었어! 그냥 기숙사에서 잠이나 잘걸……!"
3703-147 = "망했어……! 망했다구……!!"
3703-148 = "겁먹지 말아요, 레나 쨩! 이걸로 오컬트가 실존하는 게 증명됐잖아요?"
3703-149 = "우리의 진짜 모험은 지금부터 시작이에요!"
3703-150 = "아아아아, 난 이런 모험하고 싶지 않았어……!!"
3703-151 = "리미널 스페이스가 진짜로 있었다니……!"
3703-152 = "내보내줘! 내보내 달라구!!"
3703-156 = "이제 남은 선택지는 하나뿐."
3703-157 = "여러분. 올라가죠. 이 앞에 기다리고 있는 것이 절망일지, 희망일지는 아직 모르는 일이니까요."
3703-158 = "8층으로 가면 끝이라며! 영원히 헤매는 거라며……!"
3703-159 = "저는 두렵지 않아요. 이 일이 모두의 마음을 강하게 해 줄 거라 믿어 의심치 않으니까."
3703-163 = "어떠한 상황도 두려움 없이 의연하게 마주하는 것. 그것이 바로—"
3703-164 = "—'용기'."
3703-165 = "……이니까요!"
3703-166 = "샤아아악! 하여간 다들 머릿속이 이상해……!!"
3703-167 = "후후, 그럼 올라가겠습니다."
3703-174 = "수상한 빌딩 8층 복도"
3703-176 = "오…… 역시 수상한 분위기네요. 금방이라도 뭐가 튀어나올 것 같아요."
3703-177 = "이, 이제 어떡해? 뭔가 방법 없어?"
3703-178 = "방법이라면…… 있지."
3703-179 = "뉴후후, 그래요. 이런 날이 올 줄 알고 퇴마 관련 주문을 준비해 왔죠."
3703-180 = "그런 게 있었으면 진작 써봤어야지!"
3703-181 = "이건 특수한 주문이라 단 한 번밖에 사용할 수 없어요. 그래서 웬만하면 사용하지 않으려 했는데……."
3703-182 = "이젠 아낄 때가 아니야……."
3703-183 = "……네. 맞아요."
3703-186 = "전 각오 됐어요! 모두 준비되었나요?"
3703-187 = "후후, 물론이죠."
3703-188 = "뭐, 뭔지는 모르겠지만 일단 어떻게든 해보라고!"
3703-189 = "이건 틀림없는 악마의 짓……. 그러니 츠무기는 그 악마의 유인을 부탁해요!"
3703-190 = "유인이라면…… <그걸> 하라는 뜻이군요."
3703-191 = "카노에 선배는 저와 같이 악마의 퇴치를!"
3703-192 = "히히…… 맡겨 줘……."
3703-193 = "마지막으로 레나 쨩은 옆에서 용기의 응원을……!"
3703-196 = "요, 용기의 응원? 그게 뭔데?"
3703-197 = "귀여운 고양이 흉내요!"
3703-198 = "여, 여기서 왜 그 흉내를 내라는 거야……!!"
3703-199 = "들으면 힘이 나니까요!"
3703-200 = "나도……."
3703-201 = "저도요~"
3703-204 = "으아아아, 젠자아아앙……! 해주겠어! 해주겠다고……!!"
3703-205 = "그럼, 저부터 시작할게요."
3703-209 = "오오, 바로 이거예요! 이제 레나 쨩의 차례입니다!"
3703-212 = "애, 애옹! 애오오오옹……!!"
3703-216 = "아아…… 기운이 샘솟아……."
3703-217 = "귀여워……. 마나가 차올라……."
3703-218 = "야오오옹……!!"
3703-219 = "(샤아아악! 대체 무슨 짓이야, 이게!)"
3703-220 = "자! 이것으로 완벽한 술식이 갖춰졌어요!"
3703-221 = "이제 나오세요, 악마! 우리가 상대해 드리겠습니다!"
3703-230 = "저건…… 아까 내가 봤던 그림자……."
3703-231 = "드디어 나타났군요, 이 악마!"
3703-232 = "그럼 가보자고……."
3703-235 = "아브라……!"
3703-236 = "카다브라—!"
3703-251 = "해치웠어요!"
3703-252 = "뭐야! 그냥 총격이랑 섬광탄이었잖아!"
3703-253 = "하지만 쓰러뜨렸죠?"
3703-254 = "거기 너…… 항복해. 우리의 승리야."
3703-257 = "크, 으으으으윽……. 당신들……."
3703-260 = "제가 잘못했으니까 세트장은 부수지 말아 주세요……!"
3703-263 = "세, 세트장……?"
3703-265 = "사건의 전모는 이러하였다……."
3703-267 = "……그러니까 여기는 영화 촬영용 세트장이었다고요?"
3703-268 = "네. 저는 CG를 배제한 극사실주의 묘사를 탐구하는 감독 지망생."
3703-269 = "저와 뜻을 같이하는 동료들과 이상을 실현하기 위해 이 영화 세트장을 만들었죠."
3703-270 = "이곳의 설비를 점검하던 중 여러분이 들어오길래, 얼마나 실감 나는 연출이 가능할지 잠깐 확인을 해보려 했던 건데……."
3703-271 = "에헤헤, 여러분 반응이 너무 좋아서 저도 모르게 여기까지 와버렸네요."
3703-272 = "그, 그럼 엘리베이터는 어떻게 한 거야? 계속 일어났던 이상한 현상은?!"
3703-273 = "자세한 건 영업비밀입니다만, 이 방을 보시면 어렴풋이 이해되겠죠."
3703-277 = "짜잔—."
3703-278 = "이걸로 조작을 하고 계셨던 거군요. 역시 이상하다 싶었어요."
3703-279 = "샤아아악! 감히 날 속였겠다아아아……!!"
3703-280 = "오컬트가…… 아니었네……."
3703-281 = "뉴후후. 그래도 상관없어요."
3703-282 = "마치 마법과도 같은 즐거운 시간이었으니까!"
3703-283 = "네, 저도 즐거웠어요."
3703-284 = "역시 우릴 기다리고 있던 건 절망이 아니라 희망이었네요."
3703-285 = "모두가 속아 넘어갔다는 것 자체가 절망이라고……!"
3703-286 = "후후, 아무튼 다들 즐거우셨던 것 같아 다행이군요."
3703-287 = "자, 여기 저의 연락처입니다. 혹시라도 필요한 일 있으면 연락 주시고요."
3703-288 = "오늘의 일은 앞으로의 영화 제작에 좋은 참고 자료로 쓰도록 하겠습니다."
3703-289 = "뭐? 참고? 아, 안 돼! 폐기야! 무조건 폐기야……!!"
3703-290 = "물론 공짜는 아니죠. 자, 여기 오늘 수고비입니다."
3703-291 = "돈으로 사겠다고? 날 모욕할 셈이야?"
3703-294 = "……라고 말하기엔 썩 괜찮은 금액이었다."
3703-296 = "그럼 모두 안녕히 돌아가시길!"
3703-298 = "그리하여 1층으로 내려가는 엘리베이터 안……."
3703-299 = "하아……. 이게 무슨 고생이야."
3703-300 = "내가 진짜 또 속으면 바보다, 바보."
3703-306 = "다들 그 표정 뭐야? 무슨 말이 하고 싶은데!"
3703-309 = "야옹……."
3703-312 = "야옹~"
3703-313 = "야아옹~"
3703-314 = "아악! 잊어줘! 부탁이니까 제발 잊어줘……!!"
3703-318 = "수상한 빌딩 4층"
3703-320 = "뭐, 뭐야? 왜 또 4층에서 멈추는데?"
3703-321 = "으음, 고장인가요? 일단 문을 닫고 내려가 보죠."
3703-329 = "수상한 빌딩 외부"
3703-335 = "하아아아, 드디어 탈출이야……."
3703-336 = "이야~ 진짜 리미널 스페이스에 빠진 줄 알았어요. 중간에는 저도 겁이 났지 뭐예요."
3703-337 = "상황이 그럴싸해서 정말 흥미진진했네요. 그렇죠, 레나 쨩?"
3703-338 = "묻지 마! 난 생각하기도 싫어!"
3703-339 = "히히…… 이제 돌아가서 맛있는 거나 먹자고……."
3703-340 = "아, 참. 그러고 보니 우리 방금 내려올 때 엘리베이터가 4층에서 멈췄었잖아요."
3703-341 = "그때 복도 끝에 피투성이 소녀가 서 있었는데…… 다들 보셨나요?"
3703-342 = "네. 상당히 리얼한 분장이었어요. 저도 살짝 놀랄 만큼요."
3703-343 = "흥, 난 하나도 안 놀랐거든? 다 가짜잖아."
3703-344 = "응? 잠깐…… 조금 이상한데."
3703-349 = "오, 무슨 일이시죠? 놓고 간 게 있나요?"
3703-350 = "그게 말이야…… 혹시 4층에 피투성이 소녀도 있었어?"
3703-353 = "네? 피투성이 소녀요? 그런 연출은 사용한 적 없는데요?"
3703-357 = "……그렇다는데?"
3703-361 = "어머나."
3703-362 = "진짜였다고요?! 오오……! 역시 오컬트는 실존했어!!"
3703-363 = "거, 거짓말! 제발 거짓말이라고 해줘!!"
3703-365 = "수상한 빌딩 4층에서 목격된 피투성이 소녀."
3703-366 = "그건 경계의 공간에 이끌린, 진짜 이차원의 존재는 아니었을까."
3703-367 = "으아아아, 거짓말! 전부 거짓말이야아……!!"
3703-368 = "수상한 리미널 스페이스"
