[translation]
84303100200-6 = "숨바꼭질을 좋아하는 손님이네! 다음엔 어디로 숨을 꺼야? 꼭 먼저 찾아내야지!"
84303100200-8 = "죄송해요. 신기한 게 많아서…… 이것저것 구경하고 길을 새느라 늦어졌네요."
84303100200-10 = "차라리 그런 거라면 오히려 다행이지만……"
84303100200-11 = "……아니, 괜찮겠지. 우리라고 그쪽을 감시하려는 의도가 아니니까."
84303100200-12 = "그래도 너무 오래 떨어지거나 무슨 일 있을 거 같을 땐 연락해 줘."
84303100200-14 = "후후, 그쪽이 관리하는 입장에서는 더 힘든 방식일 텐데…… 배려해 주시는군요. 감사해요."
84303100200-18 = "……응?"
84303100200-21 = "(리오의 연락……?)"
84303100200-24 = "어라, 또 전화가…… 죄송해요, 잠시."
84303100200-26 = "신경 쓰지 마."
84303100200-27 = "우린 여기 그대로 있을 테니, 통화가 끝나면 찾아와줘."
84303100200-29 = "알겠어요, 그렇게 할게요."
