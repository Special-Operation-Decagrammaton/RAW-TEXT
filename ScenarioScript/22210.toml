[translation]
22210-1 = "제21화;그 이름, 뜻하기를."
22210-2 = "[ns] \"네루! 부탁해!\""
22210-4 = "……네루 선배! 어떤 공격도 저의 <무장>에는 통하지 않습니다!"
22210-5 = "그렇게 다친 몸으로 이 이상의 저항을 해봤자 무의미할 뿐입니다!"
22210-6 = "………하."
22210-7 = "그딴 거, 알까 보냐."
22210-8 = "이미 나는 마음먹었단 말이지."
22210-9 = "여기서 네놈을 쓰러트리고."
22210-11 = "귀찮은 건 질색이야."
22210-12 = "꼬맹이를 구하러 가는 건……"
22210-13 = "네 녀석을 쓰러트리고 난 '다음'이라도 늦지 않아."
22210-15 = "꼬맹이를 데리러 갈 거라고 말이지!"
22210-16 = "자, 후배! 선배들의 2차 리벤지 매치다!"
22210-17 = "아스나!!"
22210-18 = "……?!"
22210-19 = "응! 아하핫! 돌격이야……!"
22210-23 = "이런 가벼운 공격 따위……!"
22210-33 = "……?! 전부, 피했어……?!"
22210-34 = "응! 야생의 감? 이라고 해야 하나?"
22210-35 = "카린."
22210-39 = "시야 밖의, ……저격!"
22210-44 = "그런 식으로 연이어 공격해봤자……!"
22210-56 = "……아카네! 이대로 밀고 들어간다! 박살 내버려!"
22210-57 = "네! 부장님!"
22210-67 = "연이은 공세로 문을 부수고 타워 내부까지 침입을……?"
22210-68 = "대체 어떻게……?"
22210-70 = "…………그게 말처럼 쉬울 리가……."
22210-71 = "그렇네요. 쉽지 않아 보인다고 할까, 오히려……."
22210-72 = "아하핫~! 작전치고는 너무 엉망진창인 거 아냐?"
22210-74 = "그, 그렇죠. 역시 제 이야기는 없던 걸로……."
22210-75 = "아니, 하겠어."
22210-76 = "이, 이런 작전을 말인가요?!"
22210-78 = "……괜찮겠어? 말은 이렇게 했지만, 우리가 이제까지 한 모든 이야기는 결국 가설에 지나지 않아."
22210-79 = "하, 그런 거라면 잘 알고 있어. 하지만 다른 누구도 아닌, 저 이마 깐 녀석의 작전이야."
22210-80 = "이, 이마……?"
22210-81 = "위기의 순간 속에서도 친구를 위해서라면 주눅 들지 않고 배짱을 부리는 기개."
22210-82 = "그런 모습을 보여준 녀석의 작전이 마음에 들지 않을 리가 없잖아?"
22210-83 = "앗! 네루 선배! 유즈에 대해 잘 알고 있네!"
22210-84 = "역시…… 평소에 유즈한테 게임에서 많이 당해서 그런가?"
22210-85 = "지금 그런 이야기가 왜 나와?! 임마?!"
22210-86 = "하지만 부장님, 그런 몸으로는 역시……!"
22210-87 = "아앙? 뭔 소리야. 저쪽이 걸어준 기대를 배신해서야…… 어디 가서 고개나 들 수 있겠냐고."
22210-88 = "이런 것쯤이야 기합으로 극복 가능해. 기합으로."
22210-89 = "그래서, 너희들은? 억지로 하라는 말은 안 해."
22210-90 = "우리는……"
22210-91 = "……어쩔 수 없죠. 리더의 결정이라면."
22210-92 = "응! 우리 꼬마 부장 말이면! 당연히 따라야지!"
22210-94 = "하지만 정말 괜찮은 거야? C&C만으로 그 작전을 진행하는 게……"
22210-95 = "네, 부장님이 그렇게 결정하셨다면야."
22210-96 = "……더구나 또 싸우게 된다면, 저번과는 좀 다를 예정이니까요."
22210-97 = "[s] \"모두가 그렇게 말한다면…… 알았어.\""
22210-98 = "……다들 그 엉망진창인 작전에 동의한 거지?"
22210-99 = "그렇다면 마침 딱 알맞은 장소가 있어."
22210-100 = "그곳은……."
22210-120 = "[ns] \"이대로 조금만 더……! 목표가 코앞이야!"
22210-123 = "(무모해.)"
22210-124 = "(이건 절대로 합리적인 선택이 아니야.)"
22210-125 = "(C&C는 물론, 샬레의 선생은 이미 토키의 <무장>에게 한 번 패배했어. 그건 불변의 사실.)"
22210-126 = "(그러니 합리적으로 생각해본다면…… 자연스럽게 다음에 취할 전략은 정면돌파가 아닌 우회하는 작전일 터.)"
22210-127 = "(만약 이것이…… 샬레의 [USERNAME] 선생이 짜낸 작전이라면…….)"
22210-131 = "토키!! <무장>의 주포 사용을 허가하겠어!!"
22210-132 = "예스, 맴."
22210-136 = "중앙 타워로 급속도로 전력이 모이고 있어! 모두 조심……!"
22210-147 = "[ns1] \"방금…… 그건……. 레이, 저……?\"\n[ns2] \"이런 걸…… 숨기고 있었다고……?\""
22210-153 = "(뭐지…… 방금 전 나는…….)"
22210-154 = "(분명 승률이나 데이터에 기반한 판단이 아니라…….)"
22210-155 = "(불길한 기분이 들었다는 이유로……. 판단을 변경한 건가……?)"
22210-156 = "(그런…… 아냐. 내가 그런 비합리적인 판단을 할 리가…… 단순한 감각의 착오일 뿐이야.)"
22210-157 = "[s] \"……리오.\""
22210-158 = "……여기까지야."
22210-159 = "<무장>을 통해 확정된 결과. 데이터로 산출된 미래는 그 누구도 뒤집을 수 없으니까."
22210-160 = "샬레의 선생. 당신이라면 <무장>에게 패배한 시점에서 알았을 텐데. 우리를 이길 승률 따윈 제로란 것을."
22210-161 = "그런데도 무얼 믿고, 우리를 이길 수 있다 판단하여 찾아온 건지 이해가 되질 않아."
22210-162 = "무의미해. 비합리적이기 짝이 없어."
22210-163 = "만약 그런 사소한 착각을 이유로, 만신창이가 된 학생들을 덤벼들게 한 거라면."
22210-164 = "……진심으로 실망이야."
22210-165 = "[s] \"그건…….\""
22210-166 = "선생님께선 그런 지휘를 내리신 적 없어요."
22210-167 = "아카네?"
22210-168 = "아니, 애당초 그 인식은 처음부터 정정할 필요가 있겠네요."
22210-169 = "저희는 딱히 승률이나 데이터를 믿고 싸운 게 아니에요."
22210-170 = "……뭐?"
22210-173 = "부장님."
22210-174 = "앙? 왜 불러."
22210-175 = "이미 말씀드렸다시피 치히로 양이 말했던 작전이 성공할 가능성은 무척 낮아요."
22210-176 = "그런데 그런 만신창이의 몸으로……."
22210-177 = "알 게 뭐야."
22210-178 = "승률이니 가능성이니, 그딴 자질구레한 건 신경 안 써."
22210-179 = "그런 건 어차피 너나 선생한테 맡기면 어떻게든 될 문제고."
22210-181 = "중요한 건 구하고 싶냐, 마냐. 그거뿐이잖아?"
22210-185 = "……후훗."
22210-186 = "역시나 전부터 생각했던 거지만, 부장님 조금 변했네요."
22210-187 = "……아마도 그건."
22210-188 = "그 아이들과 만났던, 그날 이후부터……."
22210-192 = "그건 그렇고…… 납치된 친구를 구하기 위해 다 함께 모험을 떠난다."
22210-193 = "그렇네요…… 이건 마치."
22210-194 = "게임의 주인공 같네요."
22210-196 = "친구를 구하고 싶다. 네, 단지 그뿐."
22210-197 = "……."
22210-198 = "아 참, 그러고 보니 리오 회장. 설마 잊은 건 아니겠죠?"
22210-199 = "네루 선배의 또 다른 이름과 그것이 가진 의미를."
22210-200 = "콜사인 더블오."
22210-201 = "그 이름이야말로 저희 밀레니엄의, <승리의 아이콘>이라는 것을 말이에요."
22210-202 = "………?!"
22210-208 = "잡았다."
22210-210 = "레이저 주포를 정면에서 맞고도 움직일 수 있다고……?!"
22210-211 = "공교롭게도 이전에 한번 비슷한 걸 당해본 적이 있어서 말이야!"
22210-215 = "지금 막 중앙타워의 화물 엘리베이터를 해킹했어!"
22210-216 = "[ns] \"네루!! 지금이야!\""
22210-223 = "엘리베이터……? 저들의 목적지가 바로……?!"
22210-225 = "모모이가 예전에 말했던 아이디어인데."
22210-226 = "어?! 나?!"
22210-227 = "엘리베이터를 활용하면…… 어쩌면……."
22210-229 = "……!!!"
22210-230 = "무장의 결점……! 설마 그런 방법으로……?!"
22210-232 = "토키! 거기서 나와!! 저 아이들은……!"
22210-233 = "엘리베이터로 중력을 역전시켜서 무장의 회피 시스템을 마비시킬 셈이야!!"
22210-234 = "아니, 늦었어."
22210-240 = "내가 예전에 말한 적 있었지?"
22210-242 = "근접전. 그 간격으로 들어가면 날 이길 수 있는 녀석 따윈 이 키보토스에 없다고."
22210-245 = "……."
22210-246 = "아…… 너한테 한 적은 없었나? 뭐 상관 없지만."
22210-251 = "지금이야! 엘리베이터를 작동시켜! 속도는……!"
22210-252 = "중력 가속도 10배로!!"
22210-261 = "……회피시스템 마비."
22210-262 = "………자, 그럼 어디."
22210-263 = "이제 치트 없이 공평하게 싸워보자고? 후배?"
22210-268 = "하아…… 망했군요."
22210-283 = "퉷……"
22210-284 = "하, 별것도 아닌 게 말이야."
22210-291 = "이것이……."
22210-292 = "밀레니엄 최강의……."
22210-294 = "더블오……."
22210-297 = "다음화;왕녀를 위한 파반느 1"
