[translation]
62080-1 = "8화;포르타 파시스 2"
62080-4 = "비의…… 뭐요?"
62080-5 = "아주 그냥 내버려두면 귀신이나 원혼까지 부르겠네요, 진짜……."
62080-6 = "부장님!"
62080-7 = "우에으……."
62080-12 = "확실히 그건…… 들은 적 없는 정보군."
62080-13 = "그럴 거야. 나도 처음에는 그냥 학교 전설이나 괴담 같은 것이라고 생각했는데……."
62080-14 = "이건, 아마도 나만 알고 있는 일이겠지만."
62080-15 = "베아트리체는, <에덴 조약>이 이루어지기 얼마 전, 포르타 파시스의 기록 보관소를 다녀온 적이 있었어."
62080-16 = "나 이외의 누구에게도 알리지 않고, 말이야."
62080-21 = "!"
62080-22 = "네……?"
62080-27 = "하, 하지만 거기는 아무도 갈 수 없는 곳이었는데……."
62080-28 = "베아트리체가 그런 걸 신경 쓸 성격이었다고 생각하니?"
62080-29 = "그건, 그렇긴 했네요……."
62080-30 = "베아트리체에게는 많은 비밀이 있었지만, 그것도 그중 하나였지."
62080-31 = "……? 그렇다면, 그때 유스티나 성도회의 미메시스가 현현된 것 역시도……?"
62080-32 = "어떨까. 진실은 이제 알기 어려운 것이 되었지만."
62080-33 = "……관련성이 낮지는 않았을 거라고, 이제는 짐작해 볼 수 있지 않을까?"
62080-34 = "그리고 모두 알다시피, 그 뒤로 아리우스에서는 이상 현상이 점차 늘어나기 시작했어."
62080-35 = "네……. 기억나네요. 언젠가부터 본 적 없는 것들이 마구 생겨 있었고, 적어도 무기만이라면…… 제법 풍족하게 보급되기도 했고……."
62080-36 = "그때는 별로 이상하다는 생각을 못 했고, 역시 어른은 다르구나…… 어른은 대단하구나…… 그렇게만 생각했는데……."
62080-37 = "[s] \"…….\""
62080-38 = "하지만 여기에서는 '늘어나기 시작했다'는 부분이 중요해."
62080-39 = "응……? 그렇다는 건, 혹시……?"
62080-40 = "맞아."
62080-41 = "아리우스에서는 원래, 이따금 이상한 일들이 그냥 일어나곤 했어."
62080-43 = "……어떤 학원이든 괴담 같은 것은 전해지기 마련이겠지만, 아리우스는 그 정도가 더 심했다."
62080-44 = "아리우스를 나가 보니 알겠더라고. 그건 '조금' 수준이 아니었다는 걸 말이야."
62080-49 = "[ns] \"그건…… 어째서?\""
62080-50 = "정확한 이유는, 나도 잘 몰라. 하지만."
62080-51 = "……."
62080-52 = "내 생각에, 여기는 그냥 그런 땅이 되어 버린 것 같아."
62080-53 = "아리우스에서는 원래, '무언가'가 있었어."
62080-54 = "한탄, 원한, 울분, 분노, 체념…… 여기는 그런 것들이 모인 거리지."
62080-55 = "아주 강한 마음이나 생각은, 언젠가 어떤 형태로든 실현된다고 하잖아?"
62080-56 = "그, 그건 그냥 비유 같은 표현…… 아니었나요오……."
62080-57 = "하지만 우리는 이미 유스티나 성도회나 바르바라 같은 것을 보았지?"
62080-58 = "……그랬지. 하지만 그것은 마담…… 베아트리체의 소행이라고만 생각했다."
62080-59 = "그것마저도 어쩌면, 아리우스에 흐르고 있었던…… 이면의 '진실'을, 무의식중에 바라보지 않으려 했던 것이었나……."
62080-60 = "거기까지는 판단하지 않으려고 해. 하지만 가끔 나는 무섭다는 생각이 들어."
62080-61 = "아까도 이야기했던 한탄과 원한, 울분과 분노, 그리고 체념……. 그 밑바닥에는 도대체, 무엇이 있는 걸까."
62080-62 = "그런 걸 상상하는 것만으로…… 나는, 두려워."
62080-63 = "……."
62080-64 = "우우우……."
62080-69 = "……계시록에 대한 이야기를 하죠. 여러분."
62080-70 = "어쨌든 가장 중요한 것…… 지금 아리우스에서 일어나고 있는 '무언가'의 핵심은, 그것 같으니까요."
62080-71 = "응. 고마워, 시미코 씨."
62080-72 = "천만에요. 아츠코 씨."
62080-73 = "계시록은, 트리니티에도 아리우스에도 전해져 내려오는, 경전의 마지막 장입니다."
62080-74 = "어차피 두 학원의 경전은 같은 것이에요. 그 해석에 차이를 보였던 것일 뿐, 둘은 원래 하나였으니까요."
62080-75 = "다만 트리니티에서 계시록은…… 일종의 참고 자료 같은 것으로 사용되는 정도였어요……."
62080-76 = "교훈서나 조언서, 잠언서 이상으로는…… 중요하게 다루어지지 않았죠……."
62080-77 = "하지만 아리우스에서는, 계시록에 대한 연구가 특별히 많이 이루어졌다."
62080-78 = "……거기에는, 세상의 멸망에 대한 내용들이 담겨 있었으니까."
62080-79 = "[s] \"그렇다는 건……!\""
62080-80 = "그건, 아리우스가 세상의 멸망을 바랐기 때문이냐고?"
62080-81 = "……."
62080-82 = "솔직하게 말할게, 선생님. 바로 그래."
62080-83 = "미, 미미미미미, 미사키, 씨?!?!"
62080-84 = "왜 그렇게 놀라고 그래. 사실이잖아. 그리고 어차피 선생님 앞이니까 이야기하는 거야."
62080-86 = "……이해할 수 있을 것 같네요."
62080-87 = "마을로부터 따스함을 얻지 못한 아이는, 따스함을 얻기 위해 마을을 불태우겠죠."
62080-88 = "더 이상 잃을 것이 없는 사람에게, 세상의 멸망은 어쩌면 구원으로 다가올지도 모르는 일이고요."
62080-89 = "왜냐하면 그건 적어도, 모두가 공평해졌다는 느낌을 줄 수 있으니까요……."
62080-90 = "한 개인에게 있어, 자신의 소멸과 세계의 종말은 결과적으로 같은 의미라는 말이 있지?"
62080-91 = "그렇다면 어느 순간부터, 그 앞뒤를 바꾸어 생각하게 되는 것도, 충분히 가능한 일이 아닐까 해."
62080-93 = "네. 사람은 종종, 무언가에 너무 몰두하다 보면, 수단과 목적을 쉽게 혼동하고는 하죠……."
62080-94 = "……."
62080-95 = "……."
62080-96 = "계시록에는 세 번의 일곱 천사가 등장해요. 그 모두를 통틀어, <계시록의 천사>라고 하죠."
62080-98 = "그건 아리우스에서 유독 중시했던 계시록에서 비롯된."
62080-99 = "공포와 고통 같은 감정에 바탕을 둔 괴담, 소문, 풍문 같은 것이라고 생각했지만……."
62080-100 = "……이야기했던 것이지만, 아주 강한 마음이나 생각은, 언젠가 어떤 형태로든 실현된다고 하니까 말이지."
62080-102 = "계시록에 기록된, 세상의 종말을 가져오는 세 천사 집단."
62080-103 = "그중 첫 번째가 <봉인을 떼는 천사> 일곱 명, 그다음이 <나팔을 부는 천사> 일곱 명, 마지막이 <대접을 쏟는 천사> 일곱 명이야."
62080-104 = "모두, 나팔 소리가 들렸다고 했지? 나도 마찬가지였어. 그렇다면 이건, <나팔을 부는 천사> 일 거야."
62080-105 = "들렸던 나팔 소리는, 여러 이야기를 종합해 보면 네 번."
62080-106 = "그리고 그건 우리가 들었던, 하늘에서 들려왔던 목소리와도 일치해."
62080-107 = "<이 외에도 세 천사의 불 나팔소리를 인함이로다>. 말이지."
62080-108 = "[s] \"일곱 천사의 나팔이 전부 소리를 내면, 어떻게 되는 거야?\""
62080-109 = "후후. 글쎄?"
62080-110 = "만에 하나 계시록대로의 내용이 전부 그대로 현실화된다면."
62080-111 = "다음은 진노의 금 대접을 든, 일곱 천사의 순서일 거야."
62080-112 = "그게 전부 차례대로 땅에 쏟아지고 나면, 지금의 세상은 멸망하고……."
62080-113 = "신실한 자들을 위한 새로운 세상이 내려올 거라고, 배워 왔어."
62080-114 = "……응. 계시록대로라면, 말이지."
62080-115 = "하지만 그게 정말, 그 일곱의 나팔 부는 천사였을까?"
62080-116 = "그게 다른 것일 가능성이 있다고 생각하는 건가?"
62080-120 = "……어떨까. 지금은 사실 아무것도 확실하게 이야기할 수 없잖아?"
62080-121 = "아리우스는 원래 무언가가 있었고, 무언가가 일어나는 땅이었으니까."
62080-127 = "저, 정말로 와 버렸다……."
62080-128 = "으아…… 으아아아……"
62080-130 = "모두, 조용히. 그냥 건물일 뿐입니다. 동요하지 마세요."
62080-132 = "네, 넷."
62080-134 = "우리의 목적지는 이곳, 포르타 파시스 지하에 자리하고 있다는 기록 보관소입니다."
62080-135 = "거기에는 아리우스의 '진실'이 잠자고 있다고 했으니."
62080-136 = "그렇다면, 지금 일어나는 '나팔 부는 천사'에 대한 실마리도, 어쩌면 알 수 있겠죠."
62080-137 = "문제는 모두 아시다시피, 이곳은 100년도 더 넘게 잠겨 있었다는 것인데요……"
62080-139 = "서, 선배? 문이, 열려 있는데요……?"
62080-141 = "뭐라고요!? 그렇다는 건, 누군가가 이미……?"
62080-145 = "좋습니다. 차라리 잘 되었어요."
62080-146 = "닫힌 문을 여는 자는, 그 끝에서 자신에 대한 것을 잃어버리게 된다고 했지만."
62080-147 = "……이미 누군가가 먼저 문을 열어 주었으니, 걱정거리가 하나 줄어든 셈이겠네요."
62080-149 = "그러면 정말로 우리……."
62080-150 = "이 아래로, 내려가는…… 건가, 요?"
62080-152 = "……."
62080-153 = "아뇨. 가는 것은 저 혼자입니다."
62080-154 = "정말로, 뭔가 무서운 일이 일어날지도 모르잖아요?"
62080-156 = "……!"
62080-157 = "아, 알겠어요. 선배……."
62080-158 = "그러면 저희는, 무엇을 하면 될까요……?"
62080-160 = "이곳에 진지를 구축해 주세요."
62080-162 = "진지, 요?"
62080-164 = "네. 구축법은 다들 잘 알고 있을 것이라고 생각합니다."
62080-165 = "단, 바깥으로부터의 공격과……."
62080-166 = "……안쪽으로부터의 공격 모두에 대응할 수 있는 방식으로요."
62080-168 = "그건……!"
62080-169 = "만에 하나 선배가, 어떻게 되기라도 할 때를 대비해서……?"
62080-171 = "두 번 말하게 하지 마세요."
62080-173 = "!!!"
62080-174 = "아, 알겠습니다!"
62080-179 = "[ns] \"나팔 소리에 차이가 있었다고?\""
62080-180 = "네. 나팔 소리가 들렸던 아이들과……."
62080-181 = "……."
62080-182 = "들리지 않았던 아이들이, 나뉘었어요."
62080-183 = "그건, 무슨 기준으로?"
62080-184 = "거기까지는 알 수 없었어요……. 저는 들렸던 쪽이었고……."
62080-185 = "……."
62080-186 = "스바루 선배는, 못 들었던 쪽이었을 거예요……."
62080-187 = "……흑……."
62080-188 = "가, 갑자기 왜 울고 그래……."
62080-189 = "죄송해요. 죄송, 해요……. 하지만……."
62080-190 = "역시, 어제 무슨 일이 있었구나."
62080-191 = "?!?!"
62080-192 = "미안해. 그렇게 당황하게 만들려던 것은 아니었어."
62080-193 = "그렇지만…… 괜찮다면, 무슨 일이 있었는지 이야기해 줄 수 있을까?"
62080-194 = "왜 너만 선생님을 찾아왔고, 다른 아이들은 소식도 없이 사라져 버린 건지."
62080-195 = "그리고 너는 어떻게 그 아이들이 포르타 파시스로 향했다는 것을 알 수 있었던 것인지."
62080-196 = "[s] \"아츠코, 그건…….\""
62080-197 = "응?"
62080-198 = "……."
62080-199 = "그렇구나. 마이아의 마음이 내킬 때까지 기다려 주겠다고 했구나, 선생님은."
62080-201 = "(마이아는 그대로 쪼그려 앉아, 사시나무 떨듯이 온몸을 떨기 시작했다…….)"
62080-202 = "(누구도 쉽사리 말을 걸기 어려워하고 있었을 때…….)"
62080-204 = "저, 저기……. 선생님에게라면, 이야기해도 괜찮다고 생각해요오……."
62080-205 = "히요리……?"
62080-206 = "쉿. 삿 쨩."
62080-207 = "죄, 죄송해요. 저는 말을 잘 못해서……. 염치도 없다는 말도 자주 듣고……. 헤, 헤헤……."
62080-208 = "그래도, 아, 아주 힘들고…… 괴롭고…… 슬픈 일이 있었던 것 같은데……."
62080-209 = "그럴 때는, 누구에게라도 좋으니, 말이 나오는 대로 털어놓고 나면…… 편해, 지거든요……?"
62080-210 = "누구에게, 라도요……?"
62080-211 = "네, 네! 이럴 때는 선생님이겠죠……. 아, 저기, 저희가 불편하시다면, 자리를 비켜 드릴게요……."
62080-213 = "……우리도 잠시 전화를 끊든가 하면 되겠군요."
62080-214 = "네. 이런 일은 그래야 하는 법이니까요."
62080-216 = "괜찮아요! 선생님이라면…… 믿을 수 있는, 분이거든요. 적어도 저에게는 그랬어요……."
62080-217 = "뭐든 이야기하면, 어떤 식으로든 최선을 다해서 도와주시니까……. 위장약도 주시고, 잡지도 사 주시고……."
62080-218 = "그, 그렇다고 해서 모든 걸 다 알아서 해 주시지도 않아요……! 어느 정도는, 우리가 스스로 해내야만 하는 수준까지만……."
62080-219 = "……저는 가끔 그게 아쉽기는 한데요……."
62080-220 = "그래도 그렇게 해야, 학생이 나중에 스스로 일어서는 법을 배울 수 있다고 하시니까……."
62080-221 = "으으, 말이 잘 안 나오는데……. 아, 아무튼간에요! 이런 건……."
62080-222 = "……혼자서 품고 괴로워해 봤자, 고통만…… 늘어나더라구요……."
62080-223 = "우, 우리 학원 아이들은, 특히 남에게 뭘 부탁하거나, 이야기하는 걸 잘 못하니까……. 저도 그랬었고……. 지금도 조금은, 그러고 있고……."
62080-224 = "그, 그래서 조금, 도움이 될까 해서요……! 헤, 헤헤……."
62080-226 = "히요리 씨……."
62080-232 = "그러면, 스, 슬슬 비켜 드릴까요? 역시 너무 많은 사람이 들으면, 부끄러워지는 일이라는 것도, 세상에는 잔뜩 있으니까요?"
62080-233 = "뭐, 그래. 우리는 하는 김에 밖에 뭐 없나 돌아보고 오면 되겠네."
62080-234 = "그래. 그렇게 하도록 하지."
62080-236 = "잠시, 만요!"
62080-238 = "응?"
62080-239 = "네, 네에……?"
62080-241 = "……."
62080-242 = "모두에게, 이야기드리고 싶어요……."
62080-244 = "……굳이 그렇게 무리할 필요는……."
62080-245 = "간신히 용기를 내셨는데, 괜찮지 않을까요. 선배?"
62080-246 = "나라면 안 그럴 거야……."
62080-251 = "[ns] \"괜찮겠니?\""
62080-252 = "……네."
62080-253 = "많은 분의 생각을 들어야…… 저도, 어떻게 해야 할지 더 확실하게 결심할 수 있을 것 같아요……!"
62080-255 = "(마이아는, 천천히 어젯밤에 있었던 일들을 조심스럽게 이야기하기 시작했다.)"
62080-256 = "(……우리 중 누구도 쉽사리, 그리고 함부로 입을 열 수 없었다…….)"
62080-258 = "……."
62080-259 = "……."
62080-260 = "……."
62080-261 = "우, 우앙! 우아아앙~!!!"
62080-266 = "히, 히요리? 그렇게 울어 버리면……."
62080-267 = "하지만! 이건 너무하잖아요! 너무 슬프잖아요! 이런 걸 듣고 어떻게 그냥 있어요! 와아아아아아앙~!!!"
62080-274 = "히, 히히히히, 히요리 씨?! 저기, 이러시면……?!"
62080-275 = "우애애애애애애애애~"
62080-276 = "저도, 간신히, 안 울고 있는……. 데……."
62080-277 = "바로 그래서란 말이에요오오오오오오~!!!"
62080-279 = "히요리는 역시, 상냥하구나."
62080-280 = "그래…… 언제나 그랬지. 미사키?"
62080-281 = "아, 아무것도 아니야. 이쪽 보지 마."
62080-282 = "후훗. 이럴 때는 굳이 울음을 참지 않아도 되는데."
62080-283 = "아니라고!"
62080-285 = "[ns] \"솔직하게 이야기해 줘서, 정말 고마워.\""
62080-286 = "아, 아니에요. 오히려 들어 주셔서…… 모든 분께, 감사드립니다……."
62080-287 = "그렇지만 어째서, 나팔 소리가 들렸다가 안 들렸다가 한 걸까요?"
62080-288 = "……이건 순수하게, 지금까지 들은 정보들로부터 이끌어낸 추론일 뿐이지만……."
62080-289 = "나팔 소리를 들은 집단과 그렇지 못한 집단 사이에…… 어떤 공통되는 구분선이 있었던 것 같긴 하네요……."
62080-290 = "그게…… 뭔가요?"
62080-291 = "그건, 선생님의 수업입니다."
62080-292 = "네? 수업, 이요……? 하지만 수업은 모두 다 같이 들었는데……."
62080-293 = "수업은 들었다고 다 들은 게 아니에요. 책을 읽었다고 다 읽은 게 아닌 것처럼 말이죠."
62080-294 = "……바깥사람들은 한 번만 건성으로 읽고, 그게 세상의 진리인 양 떠들고 다니거나."
62080-295 = "………아예 책을 무슨 벽이나 책장의 장식용으로 취급하는 부류도 있는데……!"
62080-296 = "애초에 책이란 건! 저자와 독자 사이에 이루어지는 대화라고요! 그런 걸 대충 읽어서 소통이 될 리가 없잖아!"
62080-298 = "조금 더! 이 아이들에 대한 존중을 보이라고, 존중을!"
62080-300 = "선배? 이야기가 다른 곳으로 새고 있는데요?"
62080-302 = "헤으아?!"
62080-303 = "죄, 죄송합니다. 아무튼…… 독서가 그런 것처럼, 수업도 마찬가지예요."
62080-304 = "공부라는 것은 애초에 내가 아닌 무언가, 내가 모르고 있던 지식을 내 안으로 받아들이는 과정이죠."
62080-305 = "수업은 그 공부를 도와주는, 스승에 의한 가르침의 절차이고요."
62080-306 = "그러니, 백날 수업을 들어 봤자, 그걸 한 귀로 듣고 한 귀로 흘려보내거나……."
62080-307 = "수업 시간이 끝나자마자 모두 잊어버릴 작정이라면, 그 수업은 아예 이루어지지 않은 것이나 마찬가지라는 거죠."
62080-308 = "아……!"
62080-309 = "물론 이건 추측입니다. 그리고 이 추측에 대해 증언해 줄 수 있는 사람은 당신뿐이죠."
62080-310 = "하지만 제가 보기에, 나팔 소리를 들었던 학생들…… 즉, 계시록대로라면 '세계 멸망의 징조'를 포착했던 사람들은."
62080-311 = "'아리우스 바깥의 지식'을, 저항 없이 받아들일 수 있었던 학생들."
62080-312 = "다시 말해, '새로운 사고방식'에 저항감이 적었던 학생들이었을 거예요."
62080-313 = "어떻게 생각하시나요?"
62080-314 = "맞아요! 그랬던 것 같아요! 대단하세요, 우이 씨!"
62080-315 = "아, 아뇨……. 그냥, 나름대로 멋대로 짐작해 본 것뿐이고……."
62080-316 = "순수한 칭찬은 감사히 받아들이는 편이 좋다고, 평소에도 몇 번이나 말씀드렸던 것 같은데요?"
62080-317 = "히으아?!"
62080-318 = "그, 그리고 그런 식으로 '아리우스 바깥'을 받아들이기 시작했다면……."
62080-319 = "아마도, '지금의 아리우스'에 대해서는 의문을 품기 시작했을 가능성 역시, 상당히 높겠죠……."
62080-320 = "……지식은, 사람을 스스로 변하게 만드는, 아주 강력한 요인 중 하나이니까요……."
62080-325 = "그렇다면, 지금의 아리우스에 의문을 갖기 시작했다는 것은……?"
62080-326 = "네."
62080-327 = "그 아이들도 늦든 빠르든, 여기 이분처럼……."
62080-328 = "기존의 아리우스를 바꾸고 싶지 않아 하는 학생들에게, 언제든 '적'으로 몰릴 수 있다는 뜻이겠죠."
62080-330 = "그렇다면 나팔 부는 천사는, 어쩌면……?"
62080-331 = "그건 모를 일이죠. 어쩌면 정말로, 계시록의 그 천사들일 수도 있고요……?"
62080-332 = "하지만 다른 해석의 가능성 역시, 열렸다고 볼 수 있지 않을까요……?"
62080-333 = "'바깥'에 대한 아리우스 학생들의…… 적대감이나 불안감, 분노, 뭐 그런 것들이 모여서 만들어낸……."
62080-334 = "하나의, 어떤 '현상' 같은 것일 수도……"
62080-335 = "……."
62080-336 = "확실히, 우이 씨 말대로야. 그럴 가능성도 상당히 높을 것 같아."
62080-337 = "하지만 우이 씨? 만일 나팔 부는 천사가 그런 것이라면……."
62080-338 = "거기에 담겨 있는 것은, 우이 씨가 생각하고 있는 것보다."
62080-340 = "상상도 할 수 없을 만큼, 무겁고 깊은 것일 수도 있어."
62080-342 = "다음화;Apocrypha"
