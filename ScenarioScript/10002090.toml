[translation]
10002090-1 = "제9화;수박깨기 1"
10002090-2 = "이번 리스트는 '수박 깨기'입니다!"
10002090-3 = "깜빡하고 수박을 안 챙겨 왔었는데 바다의 집 주인 분께서 몇 박스나 싸게 팔아 주셨어요. 다행이네요. 이걸로 문제없어요."
10002090-8 = "……수박은 평범한 거겠지?"
10002090-9 = "아, 아하하…… 문제없어 보여요. 게다가 수박 깨기에 쓸 거니……."
10002090-10 = "그럼 문제는 없겠네. 수박 깨기라면 나도 잘 알아."
10002090-11 = "그렇습니다. 해변 놀이의 정석이니까요."
10002090-12 = "음…… 방망이는 어디에 있습니까?"
10002090-13 = "응?"
10002090-14 = "수박 깨기를 하려면 야구 배트나 각목 같은 게 있어야 하잖아요?"
10002090-15 = "어라…… 그러고 보니 그것도 깜빡했네요……."
10002090-21 = "(철컥)"
10002090-23 = "(퍼어엉-!!)"
10002090-25 = "수, 수박이?!"
10002090-26 = "무슨 소리야? 수박 깨기는 총으로 쏘는 거잖아?"
10002090-27 = "그게 아니에요, 아즈사 쨩! 수박 깨기라고요, 수박 깨기! 수박 쏘기가 아니잖아요!"
10002090-28 = "게다가 수박 깨기는 눈을 가리고 하는 게 수박 깨기의 본질인데, 그럼 눈을 가리고 쏠 건가요, 아즈사 쨩은!?"
10002090-29 = "과연. 그런 로컬 룰인가. 그것도 문제없다."
10002090-39 = "으아아……!! 수, 수박이……!"
10002090-45 = "과연. 훌륭한 지정사수입니다. 아즈사 씨."
10002090-46 = "하지만, '저격'이라고 한다면, 저 또한 그 말석을 차지하고 있는 몸인지라."
10002090-51 = "(퍼어엉-!!)"
10002090-52 = "……과연."
10002090-53 = "대물저격총으로 그정도로 정밀한 조준이 가능하다는 건 높이 사고 있어."
10002090-54 = "그렇다면 다음은……."
10002090-55 = "좋습니다. 어떤 도전이든 피하지 않겠습니다. 아즈사 씨."
10002090-62 = "생각지도 않은 데에서 자극받은 사람이 생겨버렸어요……!"
10002090-63 = "괜찮은 걸까요? 정말 이대로 괜찮은 걸까요, 선생님??"
10002090-64 = "[s] \"이것도 괜찮다고 생각해.\""
10002090-65 = "아, 아아아……."
10002090-69 = "……수박…… 목표지점에 두고 왔어요……"
10002090-70 = "정말로 괜찮겠어요? 거리가 500미터가 넘는데……. 이젠 제 눈엔 제대로 보이지도 않아요."
10002090-71 = "문제없어. 수도 없이 쏴 본 거리야."
10002090-72 = "아, 아니…… 눈을 가리고 쏜다는 거에 대한 이야기였는데요……"
10002090-73 = "이래 뵈어도 저격수입니다. 이 정도 패널티는 감수할 수 있어야죠."
10002090-74 = "눈을 가리고 쏘는 걸 패널티로 활동하는 저격수가 있었나요……?"
10002090-75 = "늘 새로운 것에 대한 도전을 멈추지 말아야합니다."
10002090-76 = "특히 저 같이 정의를 추구하는 저격수라면 더욱."
10002090-77 = "아우…… 두 사람 모두 뭔가 의도치 않게 불이 붙은 느낌이……"
10002090-78 = "어쩔 수 없는 거려나요……?"
10002090-79 = "그, 그럼 선생님께서 진행을……?"
10002090-80 = "……음?"
10002090-81 = "[s] \"……왜 그래?\""
10002090-82 = "어…… 어디 갔지? 수박……?"
10002090-83 = "수박이…… 저기 뒀던 수박이 사라졌어요! 어레? 어째서?"
10002090-84 = "혹시 벌써 누가 쏘신 건…… 아, 아니죠. 그러면 소리가 들렸을 테니……"
10002090-85 = "어떻게 된 거지?"
10002090-86 = "어?"
10002090-87 = "바다의 집 주인 분?!"
10002090-95 = "뭐하는 거야!!"
10002090-96 = "아까운 음식을 가지고 장난을 치다니!! 이런 짓이 용납될 거 같아?!"
10002090-97 = "음식을 가지고 장난치는 사람은 절대 용서 못해! 응징이야!"
10002090-99 = "네?! 그런 대사를 그쪽이 하는 건가요?!"
10002090-100 = "……방해인가. 바다의 집 주인."
10002090-101 = "좋아. 걸어오는 싸움은 피하지 않는다."
10002090-102 = "아니, 또 왜 이런 전개가……."
