[translation]
83304600200-9 = "거기 선도부! 멈추어라!"
83304600200-16 = "마코토……? 무슨 일이지?"
83304600200-17 = "그건 오히려 이 몸이 묻고 싶은 말이야. 너흰 지금 뭘 하는 거지?"
83304600200-18 = "저희는 지금 막 훈련을 마치고 복귀하는 중이었는데요. 마코토 의장."
83304600200-19 = "훈련을 마치고? 복귀를? 벌써?"
83304600200-20 = "……벌써라니, 무슨 의미죠?"
83304600200-21 = "그 정도 훈련량으로는 턱없이. 터무니없이."
83304600200-22 = "너무나도 부족하단 말이다!"
83304600200-24 = "………."
83304600200-25 = "지금부터 시작될 게헨나 파티가 얼마나 중요한지는 알고 있는 게냐?!"
83304600200-26 = "중요한 파티인 만큼, 어느 때, 어떤 순간에 불상사가 일어날지 아무도 예측할 수 없어!"
83304600200-27 = "그러니 거기에 맞춰 충분한 훈련을 통해 대비를 하는 게 맞지 않겠냐. 이 말씀이시지!"
83304600200-28 = "즉! 부족해! 아직 부족하다! 지금까지 훈련한 것의 2배, 아니 3배는 더 훈련을 해줘야겠어!"
83304600200-29 = "너희의 훈련이 충분하지 않은 나머지…… 우리의 이부키마저 상처를 입었단 말이다! 그런 불상사가 다시 일어나도록 내버려둘 순 없지!"
83304600200-30 = "아니, 그 무슨 말도 안 되는 억지를……!"
83304600200-31 = "애당초 이부키 양이 다친 건 순전히 당신 때문……!"
83304600200-32 = "잔말은 됐다! 만마전의 권한으로 네 녀석들의 훈련량을 늘릴 테니 그리 알아두도록!"
83304600200-34 = "그래. 좋아."
83304600200-35 = "부장님?!"
83304600200-36 = "말씨름으로 시간을 낭비하고픈 생각은 없어."
83304600200-37 = "그쪽의 요구대로 훈련량을 늘려 재훈련을 하도록 하겠어."
83304600200-38 = "하! 진작에 그렇게 나오셔야……"
83304600200-39 = "하지만 이번이 끝이야. 만약 여기서 더 토를 달았다간."
83304600200-45 = "이쪽도 가만히 있을 생각은 없으니까."
83304600200-46 = "읏?! 그, 그래! 마, 맘대로 하라고! 어쨌거나 이 마코토 님을 실망시키지 말도록!"
