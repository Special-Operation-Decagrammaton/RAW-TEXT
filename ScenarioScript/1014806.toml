[translation]
1014806-1 = "アウスフルークレリンと夏の巡回？"
1014806-3 = "（シャーレに向かう途中、巡回中の虎丸と遭遇した）"
1014806-4 = "[ns] \"やあ、イロハ。\""
1014806-5 = "（……）"
1014806-6 = "[ns] \"……イロハ？\""
1014806-7 = "（……）"
1014806-8 = "（虎丸に違いないのだが、返事がない）"
1014806-9 = "うーん……。"
1014806-10 = "まあ、いいか。"
1014806-11 = "先生、中まで来てもらえます？"
1014806-12 = "鍵は開いてるので。"
1014806-13 = "[s1] \"いいけど……。\"\n[s2] （戦車の中に入る）"
1014806-24 = "[ns3] \"……え？\"\n[ns4] \"どうして……？\""
1014806-27 = "止むにやまれぬ事情がありまして。"
1014806-28 = "こんな暑いのに、エアコンが故障したんです。"
1014806-29 = "修理しようにも、部品が届くまで1週間以上かかるそうで……。"
1014806-30 = "とはいえ巡回しないわけにもいきませんし……。"
1014806-31 = "[s5] \"それで、水着。\"\n[s6] \"服を脱いじゃっていいの？\""
1014806-34 = "巡回は1人なので。"
1014806-35 = "誰に見られるでもなし、気にすることもないかと。"
1014806-36 = "[s] \"私がいるよ？\""
1014806-37 = "……黙っていてくれれば問題ないですよね？"
1014806-38 = "それに――"
1014806-42 = "先生にとって、悪い事でもないのでは？"
1014806-43 = "……あの。#n今さらそうやって顔を背けられると……。"
1014806-47 = "私だって恥ずかしいんです、けど……。"
1014806-48 = "……。"
1014806-49 = "……なるほど。"
1014806-53 = "だんまりを決め込むと。"
1014806-54 = "それなら仕方ありません。"
1014806-55 = "このまま海まで行きましょうか。"
1014806-59 = "そもそも、先生が教えてくれたんですから。"
1014806-60 = "夏と言えば海。海と言えば戦車だと。"
1014806-61 = "[s7] \"イロハ？\"\n[s8] \"巡回中だったんじゃ……？\""
1014806-64 = "大丈夫ですよ。1日くらい。"
1014806-65 = "それでは――"
1014806-69 = "サボるとしましょうか。"
1014806-75 = "（そのまま海に連れていかれた）"
1014806-76 = "（シャーレに戻れたのは翌日の昼過ぎだった）"
