[translation]
1014806-1 = "歸來的少女？"
1014806-3 = "（在前往夏萊辦公室的途中，遇到了正在巡邏的虎丸）"
1014806-4 = "[ns] 「嗨，伊呂波。」"
1014806-5 = "（……）"
1014806-6 = "[ns] 「……伊呂波？」"
1014806-7 = "（……）"
1014806-8 = "（……明明是虎丸沒錯，裡面卻沒有任何回應）"
1014806-9 = "……唔嗯。"
1014806-10 = "真傷腦筋呢。"
1014806-11 = "老師，可以請你進來裡面嗎？"
1014806-12 = "艙門我已經打開了。"
1014806-13 = "[s1] 「……？」\n[s2] 進入戰車"
1014806-16 = ""
1014806-22 = ""
1014806-24 = "[ns3] 「……？」\n[ns4] 「……為什麼穿泳裝？」"
1014806-27 = "啊，這個你就別提了。"
1014806-28 = "現在天氣這麼熱，結果冷氣居然壞掉了。"
1014806-29 = "本來想要修理，可是零件也要等一個多禮拜才會送到。"
1014806-30 = "話雖如此，也不能不巡邏……"
1014806-31 = "[s5] 「不是，就算這樣，一般人會脫掉嗎？」\n[s6] 「……不對，好像真的會脫？」"
1014806-34 = "反正平常都是我一個人巡邏。"
1014806-35 = "又沒有人會看到，其實也無所謂吧？"
1014806-36 = "[s] 「可是我看到了啊？」"
1014806-37 = "所以只要老師不說出去，就沒有人會知道了吧？"
1014806-38 = "而且……"
1014806-39 = ""
1014806-41 = ""
1014806-42 = "對老師來說，這反而是賺到了吧？"
1014806-43 = "哼嗯，你怎麼突然把頭轉開了？"
1014806-44 = ""
1014806-46 = ""
1014806-47 = "……其實這副模樣，我也挺害羞的。"
1014806-48 = "……"
1014806-49 = "……原來如此。"
1014806-50 = ""
1014806-52 = ""
1014806-53 = "你打算在這種時候行使緘默權嗎？"
1014806-54 = "那就沒辦法了。"
1014806-55 = "要不要就這樣去海邊？"
1014806-56 = ""
1014806-59 = "當初不就是老師告訴我的嗎？"
1014806-60 = "說到夏天和戰車……就是海邊了。"
1014806-61 = "[s7] 「那個，伊呂波同學……？」\n[s8] 「你剛才不是在巡邏嗎……？」"
1014806-64 = "沒關係的。就一天而已。"
1014806-65 = "那麼，我們就一起……"
1014806-66 = ""
1014806-68 = ""
1014806-69 = "偷懶一下吧？"
1014806-70 = ""
1014806-72 = ""
1014806-75 = "（結果就這樣被戰車載去了海邊……）"
1014806-76 = "（……回到夏萊辦公室時，已經是隔天的午後了）"
