[translation]
1014806-1 = "เด็กสาวที่กลับมา?"
1014806-3 = "(ระหว่างทางไปสำนักงานชาเล่ต์ คุณครูได้เจอโทระมารุที่กำลังลาดตระเวน)"
1014806-4 = "[ns] \"สวัสดี อิโรฮะ\""
1014806-5 = "(...)"
1014806-6 = "[ns] \"อิโรฮะ...?\""
1014806-7 = "(...)"
1014806-8 = "(คุณครูมั่นใจว่าเป็นโทระมารุแน่ๆ แต่ไม่มีเสียงตอบกลับมาจากข้างในเลย)"
1014806-9 = "อืม..."
1014806-10 = "ลำบากแล้วสิคะ"
1014806-11 = "คุณครู ช่วยเข้ามาข้างในหน่อยได้มั้ยคะ?"
1014806-12 = "ฉันเปิดฝาช่องทางเข้าออกไว้แล้วค่ะ"
1014806-13 = "[s1] \"...?\"\n[s2] (เข้าไปข้างในรถถัง)"
1014806-16 = ""
1014806-22 = ""
1014806-24 = "[ns3] \"...?\"\n[ns4] \"ทำไมใส่ชุดว่ายน้ำล่ะ...?\""
1014806-27 = "อ่า เรื่องนั้น อย่าให้พูดเลยค่ะ"
1014806-28 = "อากาศร้อนขนาดนี้ แอร์ดันมาเสียซะได้"
1014806-29 = "ถ้าจะซ่อม ก็ต้องรออะไหล่ส่งมานานเกินหนึ่งสัปดาห์อีก"
1014806-30 = "แต่จะไม่ลาดตระเวนก็ไม่ได้ด้วย..."
1014806-31 = "[s5] \"แต่ปกติก็ถอดเสื้อผ้าแบบนี้เลยเหรอ?\"\n[s6] \"ไม่สิ... หรือว่าถอดเป็นปกติอยู่แล้วจริงๆ?\""
1014806-34 = "ยังไงปกติฉันก็ลาดตระเวนคนเดียวอยู่แล้วค่ะ"
1014806-35 = "ไม่มีใครเห็น ก็ไม่เป็นไรนี่คะ?"
1014806-36 = "[s] \"ก็เห็นอยู่นี่ไง?\""
1014806-37 = "แต่ถ้าคุณครูไม่พูดออกไป ก็ไม่มีใครรู้นี่คะ?"
1014806-38 = "แล้วก็"
1014806-39 = ""
1014806-41 = ""
1014806-42 = "คุณครูเองก็ได้ประโยชน์ไม่ใช่เหรอคะ?"
1014806-43 = "หืม ทำไมจู่ๆ ถึงหันหน้าหนีล่ะคะ?"
1014806-44 = ""
1014806-46 = ""
1014806-47 = "คือ... ฉันเองก็เขินอยู่เหมือนกันนะคะที่อยู่ในสภาพนี้"
1014806-48 = "..."
1014806-49 = "อย่างนี้นี่เอง..."
1014806-50 = ""
1014806-52 = ""
1014806-53 = "จะใช้สิทธิ์ที่จะไม่พูดตอนนี้สินะคะ?"
1014806-54 = "ถ้างั้นก็ช่วยไม่ได้ค่ะ"
1014806-55 = "ไปทะเลกันมั้ยคะ?"
1014806-56 = ""
1014806-59 = "คุณครูเป็นคนบอกฉันเองตั้งแต่แรกนี่คะ?"
1014806-60 = "ที่บอกว่าฤดูร้อน รถถัง... ก็ต้องทะเลยังไงล่ะคะ"
1014806-61 = "[s7] \"เอ่อ คุณอิโรฮะ...?\"\n[s8] \"ตอนนี้กำลังลาดตระเวนอยู่ไม่ใช่เหรอ...?\""
1014806-64 = "ไม่เป็นไรหรอกค่ะ แค่วันเดียวเอง"
1014806-65 = "ถ้างั้น เรามา"
1014806-66 = ""
1014806-68 = ""
1014806-69 = "โดดงานด้วยกันเลยมั้ยคะ?"
1014806-70 = ""
1014806-72 = ""
1014806-75 = "(สุดท้ายคุณครูก็ได้นั่งรถถังไปถึงทะเล...)"
1014806-76 = "(กว่าจะได้กลับมาที่สำนักงานชาเล่ต์ ก็ปาไปหลังเที่ยงวันของวันรุ่งขึ้นแล้ว...)"
