[translation]
1014806-1 = "돌아온 프로일라인?"
1014806-3 = "(샬레 집무실로 향하던 도중, 순찰 중인 토라마루와 마주쳤다.)"
1014806-4 = "[ns] \"안녕, 이로하.\""
1014806-5 = "(…….)"
1014806-6 = "[ns] \"……이로하?\""
1014806-7 = "(…….)"
1014806-8 = "(……토라마루가 분명한데, 안에서는 아무 대답도 돌아오지 않는다.)"
1014806-9 = "……음."
1014806-10 = "곤란한데요."
1014806-11 = "선생님, 혹시 안으로 들어와 주시겠어요?"
1014806-12 = "해치는 열어뒀거든요."
1014806-13 = "[s1] \"……?\"\n[s2] (탱크 안으로 들어간다.)"
1014806-24 = "[ns3] \"……?\"\n[ns4] \"……어째서 수영복?\""
1014806-27 = "아, 그게요. 말도 마세요."
1014806-28 = "이 날씨에 에어컨이 고장났지 뭐예요."
1014806-29 = "고치려고 보니까, 부품 배송에는 일주일이 넘게 걸리고."
1014806-30 = "그렇다고 순찰을 안 할 수도 없고……."
1014806-31 = "[s5] \"아니, 그래도 보통, 벗던가?\"\n[s6] \"……아니, 벗는 거 같기도?\""
1014806-34 = "어차피 평소에 순찰은 혼자서 도니까요."
1014806-35 = "보는 사람도 없고 괜찮잖아요?"
1014806-36 = "[s] \"제가 봤는데요?\""
1014806-37 = "그러니까, 선생님만 입 다물면 아무도 모르는 거잖아요?"
1014806-38 = "그리고."
1014806-42 = "선생님께서는 오히려 이득, 아닌가요?"
1014806-43 = "흐응, 갑자기 왜 고개를 돌리시나요?"
1014806-47 = "……아니, 이 모습은 저도 꽤 부끄럽거든요."
1014806-48 = "……."
1014806-49 = "……과연."
1014806-53 = "여기서 묵비권인가요?"
1014806-54 = "그러면, 어쩔 수 없네요."
1014806-55 = "갈까요, 바다까지?"
1014806-59 = "애초에 선생님이 저한테 알려준 거잖아요?"
1014806-60 = "여름, 탱크, ……그러면 바다라고."
1014806-61 = "[s7] \"저기, 이로하 씨……?\"\n[s8] \"지금 순찰 중이었던 게……?\""
1014806-64 = "괜찮아요. 하루 정도는."
1014806-65 = "그러면 같이."
1014806-69 = "땡땡이 쳐버릴까요?"
1014806-75 = "(결국, 그대로 탱크에 실린 채로 바다까지 가게 되었다…….)"
1014806-76 = "(……샬레의 집무실에 돌아온 것은, 다음 날 점심이 지나서였다.)"
