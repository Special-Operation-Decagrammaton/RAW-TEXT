[translation]
1014806-1 = "Return of the Fraulein?"
1014806-3 = "On the way to the Schale office, I ran into Toramaru out on patrol."
1014806-4 = "[ns] \"Hi, Iroha.\""
1014806-5 = "..."
1014806-6 = "[ns] \"...Iroha?\""
1014806-7 = "... ..."
1014806-8 = "While it was definitely Toramaru, I didn't get a response from its owner at first."
1014806-9 = "Um."
1014806-10 = "This is a problem."
1014806-11 = "Sensei, come inside for a sec."
1014806-12 = "The hatch is open."
1014806-13 = "[s1] \"...?\"\n[s2] Enter the tank."
1014806-16 = ""
1014806-22 = ""
1014806-24 = "[ns3] \"...?\"\n[ns4] \"...Why are you in a swimsuit?\""
1014806-27 = "Don't even get me started."
1014806-28 = "It's hot as hell, and my AC broke."
1014806-29 = "The parts I need for repair are going to take over a week to get here."
1014806-30 = "And I can't stop going on patrol just because it's hot."
1014806-31 = "[s5] \"Is STRIPPING DOWN really a normal reaction, though?!\"\n[s6] \"...Actually, maybe it sort of is...\""
1014806-34 = "I almost always patrol solo anyway."
1014806-35 = "Why does it matter if no one ever sees?"
1014806-36 = "[s] \"But I did! I saw you!\""
1014806-37 = "But it's just you. So as long as you don't spill the beans, I'm in the clear."
1014806-38 = "Besides."
1014806-39 = ""
1014806-41 = ""
1014806-42 = "Isn't this technically a win for you?"
1014806-43 = "Eh? Why are YOU looking away?"
1014806-44 = ""
1014806-46 = ""
1014806-47 = "...Should I be the one who's embarrassed here?"
1014806-48 = "..."
1014806-49 = "...I see."
1014806-50 = ""
1014806-52 = ""
1014806-53 = "So this is where you exercise your right to remain silent?"
1014806-54 = "Well, it is what it is!"
1014806-55 = "Want to go to the beach?"
1014806-56 = ""
1014806-59 = "I remember a certain teacher telling me..."
1014806-60 = "Summer plus tank equals beach, right?"
1014806-61 = "[s7] \"That sounds great and all, but...\"\n[s8] \"Weren't you in the middle of patrol...?\""
1014806-64 = "Skipping patrol for one day won't cause the collapse of Gehenna."
1014806-65 = "So..."
1014806-66 = ""
1014806-68 = ""
1014806-69 = "Wanna play hooky with me?"
1014806-70 = ""
1014806-72 = ""
1014806-75 = "I agreed, and she drove us all the way to the beach in Toramaru."
1014806-76 = "...I didn't make it back to Schale until noon the next day."
