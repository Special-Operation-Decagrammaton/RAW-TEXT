1001302-17 = "(츠루기가 엄청난 속도로 도망가버렸다.)"
1001302-18 = "[s3] ……재미있으니까 쫓는다.\n[s4] ……걱정되니까 쫓는다."
1001302-23 = "하아…… 하아……."
