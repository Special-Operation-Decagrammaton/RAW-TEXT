1001302-57 = "[s11] 멀쩡해 보인다…….\n[s12] \"츠루기는 튼튼하구나…….\""
1001302-58 = "메, 메시지는…… 무슨 말을 보내야 할지 몰라서……"
1001302-59 = "메, 메시지는…… 무슨 말을 보내야 할지 몰라서……"
1001302-60 = "5시간 정도…… 고민하다가……."
