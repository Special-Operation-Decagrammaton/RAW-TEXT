1001302-106 = "[s15] 진정하라며 머리를 쓰다듬어준다.\n[s16] 머리를 쓰다듬어서 안심시킨다."
1001302-111 = "(스윽)"
1001302-112 = "……아?"
1001302-114 = "(쓰담쓰담쓰담)"
1001302-115 = "[s] 괜찮으니까 편하게 연락하라고 한다."
1001302-116 = "……."
1001302-117 = "(화-악)"
1001302-118 = "아…… 네……."
1001302-119 = "아, 알겠습니다……."
1001302-120 = "[s] \"그치만 건널목에선 주변을 잘 살피고 건너야 해.\""
1001302-121 = "며, 명심하겠습니다……."
1001302-122 = "[s] \"츠루기 쨩이 다치면 안되니까. 알았지?\""
1001302-123 = "……아, 으…… 네."
1001302-124 = "(얼굴이 새빨개진 채로 다소곳이 인사하는 츠루기였다.)"
1001302-127 = "(물론 폐를 끼친 역무원 님껜 엎드려 사죄했다.)"
