1001302-63 = "[s13] \"5시간을?!\"\n[s14] \"츠루기?!\""
1001302-68 = "(츠루기가 선생님에게 메시지 보내기 5시간 전)"
1001302-69 = "……."
1001302-71 = "(팔락)"
1001302-72 = "(특집 기사! 어른과의 연애에 성공할 수 있는 7가지 방법!)"
1001302-73 = "(상대는 어른! 도발적인 메시지로 관심을 끌어라!)"
1001302-74 = "(아이처럼 취급되지 않는 것이 중요!)"
1001302-75 = "(상대와의 거리 유지! 다가오면 도망치고, 멀어지면 다가가는 일정한 거리감을 유지해야 하는 게 핵심!)"
1001302-76 = "……."
1001302-77 = "(모르겠어…… 도발적인 메시지라는 게 뭐지……?!)"
1001302-78 = "(적들에게 하듯이 하면 되는 건가…….)"
1001302-79 = "케케케케케, 키헤헤헤헤헤헤-!"
1001302-80 = "……."
1001302-81 = "(……그럴 리가 없잖아아.)"
1001302-82 = "(뭐냐, 어떻게 해야 하지……?)"
1001302-83 = "(선생님에게 잘보이려면…….)"
1001302-85 = "(토독토독) 격.조.했.습.니.다. 소.생. 켄.자.키.츠.루.기……"
1001302-86 = "아니잖아!! 도발적이지가 않아!!"
1001302-87 = "다시……."
1001302-89 = "(5시간 뒤)"
1001302-90 = "키아아아아아악-! 어떻게 써야할지 모르겠다아아아!!!"
1001302-91 = "키아아아아아악-! 캬아아아악-"
1001302-92 = "아아아악- 캬아아아오오아……."
1001302-93 = "(삐빅-)"
1001302-94 = "(음성 받아쓰기 완료. 전송되었습니다.)"
1001302-95 = "갸아아……."
1001302-96 = "……."
1001302-97 = "캬아아아아아악?!?!"
1001302-99 = "……."
1001302-100 = "[s] \"그렇게 된 거구나.\""
1001302-101 = "죄, 죄송합니다아아아-! 폐를, 폐를 끼쳤습니다아!!"
1001302-102 = "[s] \"괜찮아.\""
1001302-103 = "……괘, 괜찮습니까?"
1001302-104 = "그치만 정체불명의 메시지를 보내버렸는데……."
