[translation]
2005703-1 = "率先踏出的步伐"
2005703-2 = "……在開始之前，請容我再確認一次。"
2005703-3 = "首先，在老師和我戴上C&C專用的超小型對講機後，我會進入教室之中。"
2005703-4 = "並且用與平時略有不同的樣子……接近班上的同學們。"
2005703-5 = "接著再根據昨天我們兩個模擬過的劇本進行對話……"
2005703-6 = "老師則實時監聽我的情況，並從旁提供我建議或指示。"
2005703-7 = "這就是「友好相處吧：替身訓練」。"
2005703-11 = "……"
2005703-12 = "真的沒問題嗎……？"
2005703-13 = "[s1] 「雖然已經提過很多次……」\n[s2] 「事到如今，我們也只能硬著頭皮上了……」"
2005703-16 = "您說的對。我相信老師。"
2005703-21 = "（老實說，我其實很想告訴他別太相信我）"
2005703-22 = "（畢竟女高中生之間的對話，實在是太難了……！）"
2005703-37 = "哎呀，是朱音同學。"
2005703-38 = "早，早安……朱音，同學。"
2005703-45 = "早安呀！叫我朱音「同學」讓我有點傷心呢！#n希望你們能叫得更親近一點！"
2005703-47 = "……！！！？？？"
2005703-48 = "……！？！？！？"
2005703-50 = "（老師，這樣真的沒問題嗎……？）"
2005703-51 = "[s] （就算不對，也要抱著「一定沒問題」的信念繼續往前走……！）"
2005703-52 = "（我知道了……）"
2005703-55 = "你，你今天好像很有活力呢。朱音……同學？"
2005703-56 = "就，就就，就是說啊。#n而且這好像是第一次看到你沒戴眼鏡呢。"
2005703-58 = "因為想稍微改變一下形象，所以就嘗試戴上了隱形眼鏡！"
2005703-59 = "還有，怎麼又叫我朱音「同學」呢！#n真是的，那樣會讓我有點難過的哦？"
2005703-64 = "啊，肯定是這樣吧！#n你是不是從生活健康部拿了什麼東西？"
2005703-65 = "他們最近好像開發了新的荷爾蒙調節劑，說是可以改善性格和促進新陳代謝……"
2005703-66 = "……名字叫什麼來著？#n總之又是那種號稱能把人改造得更健康、更有活力的奇怪理論。"
2005703-67 = "到了那種地步，簡直就跟傳聞中的疑似科學部沒什麼兩樣了嘛……"
2005703-68 = "還是有點不一樣啦……畢竟生活健康部是真的會讓人產生改變。"
2005703-69 = "說的也是。感覺確實更差勁呢。"
2005703-74 = "（明明是和老師兩個人絞盡腦汁寫出來的劇本……）"
2005703-75 = "（非常抱歉。我再次感受到自己果然不擅長這種事呢……)"
2005703-76 = "[s] （別這麼說……這肯定是我的問題……）"
2005703-77 = "（可是……現在該怎麼辦呢……？）"
2005703-78 = "[s] （總之……先這樣提議看看吧！）"
2005703-83 = "那，那個！今天放學後……要不要一起去春葉原？"
2005703-84 = "我聽說今天那裡有聯名活動哦。"
2005703-86 = "春葉原……？"
2005703-87 = "咦……？"
2005703-89 = "（……）"
2005703-90 = "（果然……這可能也有點勉強，老師……）"
2005703-96 = "嚇我一跳！朱音同學也會去春葉原啊！"
2005703-97 = "我要去我要去！"
2005703-99 = "……"
2005703-100 = "好的！"
2005703-106 = "啊，上課了……沒辦法，回座位吧。"
2005703-107 = "放學後馬上出發吧？#n我好像也很久沒去春葉原了呢。"
2005703-108 = "你兩週前才去過吧……"
2005703-109 = "兩週已經夠久了！"
2005703-111 = "（和朱音一起悄悄地鬆了一口氣……）"
2005703-112 = "（重新感受到，沒有什麼是比大人試圖預測女高中生的對話更傻的事了……）"
2005703-122 = "到了！春葉原！"
2005703-123 = "要先去哪裡呢？"
2005703-124 = "當然是遊戲中心啊！這次一定要刷新排名！"
2005703-125 = "那種地方晚點再去啦……#n朱音……同學想去哪裡呢？"
2005703-130 = "（老，老師？這種時候該怎麼辦……？）"
2005703-131 = "[s] （唔嗯……！遇到不知道如何是好的時候就該……！）"
2005703-135 = "那我們……要不要先去吃點東西？"
2005703-137 = "哦，不錯耶！先補充燃料再開始對吧？"
2005703-138 = "我午餐吃得有點多耶……不過算了！"
2005703-147 = "這次一定要去遊戲中心！"
2005703-148 = "真的很堅持呢……"
2005703-149 = "那當然！誰叫那個叫做UZQueen的傢伙，每次都明目張膽地刷新第1名的紀錄！#n我今天一定要超過他才行！"
2005703-150 = "啊。"
2005703-151 = "啊。"
2005703-157 = "……朱音同學也知道UZQueen嗎？"
2005703-161 = "因，因為各種原因，不知不覺就知道了……"
2005703-162 = "嗯……雖然挑戰是自由的……"
2005703-163 = "唉……明知道不可能卻還要挑戰，是不是應該阻止一下比較好啊……"
2005703-164 = "啊哈哈哈……"
2005703-179 = "需要二次補充能量……我要吃這個！聽說這個布丁是新品！"
2005703-180 = "焦糖紫蘇風味……？#n這東西真的沒問題嗎？會不會是那種坑人的商品啊？"
2005703-182 = "（這個商品，不就是曾經因為「怪味恐攻嫌疑」而收到「清掃委託」的……）"
2005703-183 = "（雖然最終得出的結論是那名老闆沒有惡意，只是把人生都賭在了紫蘇上而已……)"
2005703-184 = "（那位紫蘇老闆的熱情，還真是不容小覷呢……）"
2005703-190 = "……"
2005703-191 = "……"
2005703-196 = "怎，怎麼了嗎……？"
2005703-198 = "朱音醬，你唱歌也太好聽了吧！"
2005703-199 = "就是說啊……耳朵都快要融化了……"
2005703-201 = "哎，哎呀。這樣我會害羞的……"
2005703-205 = "這款化妝品很適合你這種膚質哦。#n來……怎麼樣呀？"
2005703-206 = "真的耶……你看看這個顯色！"
2005703-207 = "朱音醬，你對化妝品很了解呢！"
2005703-208 = "（畢竟在執行「任務」時經常需要偽裝嘛……）"
2005703-215 = "啊～玩得真開心！"
2005703-216 = "對啊，感覺都快累癱了呢。#n不過……"
2005703-217 = "……"
2005703-219 = "……？"
2005703-221 = "朱音醬，已經可以了哦。"
2005703-222 = "嗯。你今天一整天都在勉強自己吧？"
2005703-227 = "啊……"
2005703-228 = "全都被看出來了嗎……？"
2005703-230 = "怎麼可能看不出來嘛。"
2005703-231 = "雖然覺得應該是有什麼原因……"
2005703-233 = "……"
2005703-234 = "還請兩位稍等。#n因為很久沒戴隱形眼鏡的關係，眼睛有點痛。"
2005703-239 = "這樣就感覺比較習慣了呢。雖然沒戴眼鏡的樣子也很新鮮啦。"
2005703-240 = "嗯，這才是我們認識的朱音醬。"
2005703-241 = "所以……發生什麼事了？"
2005703-243 = "！？"
2005703-244 = "啊，如果不方便說的話不用勉強。反正也還挺新鮮有趣的。"
2005703-245 = "那個……"
2005703-246 = "……"
2005703-247 = "因為聽了「老師」的建議，所以我決定……"
2005703-248 = "試著主動接近他人。"
2005703-250 = "哦……原來是這樣啊。"
2005703-255 = "（聽著朱音開心的聲音，悄悄關掉了對講機的電源）"
2005703-256 = "（並且……）"
2005703-260 = "（決定短時間內都不要再嘗試「青春期女高中生日常對話模擬」這種大冒險了……）"
