[translation]
2005703-1 = "먼저 나아가는 발걸음"
2005703-2 = "……시작하기 전에, 마지막으로 확인해 보도록 할게요."
2005703-3 = "우선 선생님과 제가, C&C 전용의 초소형 무전기를 착용하고, 저는 교실로 들어갑니다."
2005703-4 = "그리고 평소와는 조금 더 다른 모습으로…… 반 아이들에게 다가가는 거죠."
2005703-5 = "어제 저희 둘이 거의 밤을 새우면서 시뮬레이션해 본 대본을 바탕으로 대화를 진행하며……."
2005703-6 = "선생님은 그런 제 상황을 실시간으로 들으시면서, 저에게 조언이나 지시를 내리는 거죠."
2005703-7 = "이른바 <친해지길 바래: 아바타 훈련>."
2005703-11 = "……."
2005703-12 = "정말로, 괜찮을까요……?"
2005703-13 = "[s1] \"이미 했던 말을 반복하는 것이겠지만…….\"\n[s2] \"여기까지 온 이상, 우린 할 수밖에 없어…….\""
2005703-16 = "네. 선생님만 믿겠습니다."
2005703-21 = "(솔직히 너무 믿지 말라고 말하고 싶기는 했다.)"
2005703-22 = "(여고생끼리의 대화라니, 너무 어려운 문제다……!)"
2005703-37 = "어라, 아카네 씨다."
2005703-38 = "아, 안녕……. 아카네, 씨."
2005703-45 = "둘 다 안녕! 그리고 아카네 '씨' 라니, 조금 섭섭하네! 조금 더 편하게 불러 줬으면 해!"
2005703-47 = "……???!!!"
2005703-48 = "……?!?!?!"
2005703-50 = "(……정말, 이게 맞는 걸까요. 선생님……?)"
2005703-51 = "[s] (맞지 않더라도, 맞을 거라는 믿음을 가지고 나아가자……!)"
2005703-52 = "(알겠습니다…….)"
2005703-55 = "오, 오늘은 뭔가 활기차네. 아카네…… 씨?"
2005703-56 = "그, 그그, 그러게. 안경 벗은 건 처음 보는 것 같아."
2005703-58 = "조금 이미지 체인지를 해 볼까 해서! 렌즈를 껴 봤어!"
2005703-59 = "그리고 또 아카네 '씨' 라니! 아이참! 그러면 나, 조금 서운해져 버릴지도?"
2005703-64 = "아, 이거 분명 그거구나! 혹시 생활건강부에서 뭔가 받았어?"
2005703-65 = "거기 요즘 새 호르몬 조절제를 만들어서, 성격을 개선하고 신진대사를 활성화시키는 것으로……."
2005703-66 = "뭐라더라? 아무튼 사람을 더 건강하고 활기차게 개조할 수 있다는 이상한 소리 또 하고 있던데."
2005703-67 = "……그 정도면, 말로만 듣던 유사과학부와 뭐가 다른 걸까……."
2005703-68 = "다르긴 하지…… 생활건강부 애들은 정말로 뭔가 사람에게 변화를 만들어 버리잖아."
2005703-69 = "그러네. 오히려 질이 더 안 좋은 것일지도 모르겠어."
2005703-74 = "(선생님과 둘이서 머리를 맞대며 쓴 대본이었는데…….)"
2005703-75 = "(죄송해요. 역시 전 이런 부분에 서투르다고, 새삼 느끼게 되네요…….)"
2005703-76 = "[s] (아니야……. 이건 분명 내가 문제였던 걸 거야…….)"
2005703-77 = "(그런데…… 이제 어떡하죠……?)"
2005703-78 = "[s] (일단……. 이렇게 제안해 보자!)"
2005703-83 = "그, 그것보다 말이지! 우리…… 오늘 수업 끝나고, 하루하바라에 가지 않을래?"
2005703-84 = "오늘 거기에서 콜라보레이션 행사가 있다던데."
2005703-86 = "하루하바라……?"
2005703-87 = "어라……?"
2005703-89 = "(…….)"
2005703-90 = "(역시…… 이건 조금 무리였을지도 모르겠네요, 선생님…….)"
2005703-96 = "놀랐어! 아카네 씨도 가는구나, 하루하바라!"
2005703-97 = "갈래, 갈래!"
2005703-99 = "……."
2005703-100 = "응!"
2005703-106 = "아, 수업 시작됐네……. 어쩔 수 없지."
2005703-107 = "끝나고 바로 출발하는 거지? 하루하바라도 뭔가 오랜만이네."
2005703-108 = "너 2주일 전에도 갔잖아……."
2005703-109 = "2주일이면 충분히 오랜만이야!"
2005703-111 = "(아카네와 함께 조용히 안도의 한숨을 내쉬며…….)"
2005703-112 = "(……새삼스럽게, 여고생의 대화를 어른이 예측하려는 것만큼, 바보 같은 일도 없을 거라는 사실을 절감했다…….)"
2005703-122 = "왔다, 하루하바라!"
2005703-123 = "어디부터 갈래?"
2005703-124 = "당연히 게임 센터지! 이번에야말로 순위 갱신해 주겠어!"
2005703-125 = "그런 데는 좀 나중에 가라……. 아카네…… 씨는 어디 갈래?"
2005703-130 = "(서, 선생님? 이럴 때는 어쩌죠……?)"
2005703-131 = "[s] (으, 음……! 이것저것 다 헷갈릴 때는! 우선!)"
2005703-135 = "그러면 우리, 뭐 좀 먹지 않을래?"
2005703-137 = "오, 그거 좋네! 연료 보충하고 시작하는 거지?"
2005703-138 = "점심을 좀 많이 먹긴 했는데…… 에이, 몰라!"
2005703-147 = "이번에야말로 게임 센터다!"
2005703-148 = "정말 꾸준하구나……."
2005703-149 = "당연하잖아! UZQueen인지 뭔지 번번이 보란 듯이 1위 갱신하고 있는데, 오늘은 꼭 따돌려 주겠어!"
2005703-150 = "아."
2005703-151 = "아."
2005703-157 = "……아카네 씨도 알아? UZQueen?"
2005703-161 = "어, 어쩌다 보니? 여러 가지로……?"
2005703-162 = "뭐…… 도전은 자유겠지만……."
2005703-163 = "하아…… 불가능에 굳이 도전하려는 걸, 말려야 하나 말아야 하나……."
2005703-164 = "아하하하……."
2005703-179 = "2차 에너지 보충이 필요해…… 나 이거 먹을래! 이 푸딩 신상품이래!"
2005703-180 = "캐러멜 차조기 맛……? 이거 정말 괜찮은 거 맞아? 한 명만 걸려라 상품 아냐?"
2005703-182 = "(이 상품은 분명, <이상한 맛 미각 테러 의혹>으로 '청소 의뢰'를 받았던 일이었는데…….)"
2005703-183 = "(사실 그 공장 사장님에게 악의는 없었고, 그저 차조기에 인생을 건 분이었다는 결론으로 마무리되었죠…….)"
2005703-184 = "(정말로 그 차조기 사장님, 열정은 엄청나시네요…….)"
2005703-190 = "……."
2005703-191 = "……."
2005703-196 = "왜, 왜 그래……?"
2005703-198 = "아카네 쨩, 노래 잘한다!"
2005703-199 = "그러게……. 귀가 녹는 줄 알았어……."
2005703-201 = "아, 아이참. 너무 그러면 부끄럽다구……."
2005703-205 = "그 피부에는 이 화장품이 잘 맞을 거야. 자…… 어때?"
2005703-206 = "진짜야……. 발색 깔리는 거 봐!"
2005703-207 = "아카네 쨩, 화장 정말 잘하는구나!"
2005703-208 = "(아무래도 '임무'에서 '위장'할 일이 많다 보니…….)"
2005703-215 = "아, 잘 놀았다!"
2005703-216 = "그러게. 기운이 다 빠질 정도네. 그런데……."
2005703-217 = "……."
2005703-219 = "……?"
2005703-221 = "아카네 쨩. 이제 괜찮아."
2005703-222 = "응. 오늘 하루 종일 뭔가, 무리하더라."
2005703-227 = "아……."
2005703-228 = "……전부, 보였…… 나요?"
2005703-230 = "안 그럴 수가 없잖아. 아무리 그래도."
2005703-231 = "무슨 사정이 있겠거니 생각하긴 했는데……"
2005703-233 = "……."
2005703-234 = "잠시만요. 렌즈를 끼는 게 간만이어서, 조금 눈이 아프네요."
2005703-239 = "이제 좀 익숙하네. 안경 안 쓴 모습도 신선했지만."
2005703-240 = "응. 이게 우리가 알던 아카네 쨩이라는 느낌."
2005703-241 = "그래서…… 무슨 일이 있었던 거야?"
2005703-243 = "?!"
2005703-244 = "아, 말하기 어려우면 안 말해도 되니까. 신선해서 재미있었어."
2005703-245 = "그건……."
2005703-246 = "……."
2005703-247 = "'선생님'의 말씀을 듣고, 제가 다른 분들께……"
2005703-248 = "'먼저' 다가가기로, 해 보았거든요."
2005703-250 = "아하…… 그런 거였구나."
2005703-255 = "(아카네의 즐거워하는 목소리를 들으며, 조용히 무전기의 전원을 껐다.)"
2005703-256 = "(그리고…….)"
2005703-260 = "(<사춘기 여고생의 일상 대화 시뮬레이션> 같은 대모험은, 당분간 안 하기로 했다…….)"
