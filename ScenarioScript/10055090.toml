[translation]
10055090-1 = "제9화;소금물의 꿈"
10055090-2 = "정말로, 면목이 없습니다!!"
10055090-4 = "저는 말렸는데! 저희 선원들이! 틀림없이 해적이라 착각하고 멋대로 사격을 개시해서……."
10055090-5 = "그런데, 설마!"
10055090-6 = "그 유~명한~! 샬레의 선생님과! 게헨나에서 오신 만마전의 임원분들일 줄이야!"
10055090-7 = "[s1] \"괘, 괜찮아.\"\n[s2] \"에취!\""
10055090-10 = "아이고! 선생님, 괜찮으신가요?! 다들 빨리 담요랑, 수건 있는 거 전부 꺼내 오세요!"
10055090-11 = "[s3] \"나는 괜찮아.\"\n[s4] \"다른 학생들부터 챙겨줘.\""
10055090-14 = "네, 네, 물론입죠. 다섯 분 모~두~! 무사히 구출해서 안정을 취하고 계십니다!"
10055090-15 = "만마전 분들께는 그, 모쪼록, 잘 좀 말씀 부탁드리고자……."
10055090-16 = "[s5] \"다섯 명……?\"\n[s6] \"아니, 그 배에는 분명히…….\""
10055090-19 = "……아, 선생님께서도 보셨군요."
10055090-20 = "다들 입을 모아서, 분명히 사람이 더 있다고 말하고 있는데요……."
10055090-21 = "[s7] \"설마…… 실종된 거야?!\"\n[s8] \"학생들이 바다에?!\""
10055090-24 = "아뇨! 천부당만부당합니다! 트라이던트에서 전력을 다해 수색하고 있습니다요, 네네!"
10055090-25 = "정~말로~! 오해하지 말아 주셨으면 하는데요!"
10055090-29 = "그런데…… 그, 정말 이상하게 들리겠지만."
10055090-30 = "사라졌다고 해야 할까요……?"
10055090-32 = "사람은커녕, 침몰한 배조차 사라졌습니다."
10055090-33 = "마치 처음부터 존재하지 않은 것처럼. 판자 조각 하나 없이."
10055090-40 = "……아아, 선생."
10055090-41 = "물어보러 온 거지. 내가 '그것'의 정체에 대해 짐작하고 있다고."
10055090-42 = "반쯤은 사실이야."
10055090-43 = "그 말은, 반은 아직 추측의 영역이라는 거야. 정보로써 가치는 없는 수준이지."
10055090-44 = "……그렇지만, 왜 그렇게 신경 쓰는 거야?"
10055090-45 = "[s9] \"그 아이들, 학생들이었어.\"\n[s10] \"그러니까…….\""
10055090-48 = "……학생이라 해도, 결국은 처음 본 남이잖아?"
10055090-49 = "선생이 생각하는 건, 여전히 잘 모르겠네."
10055090-50 = "하지만, 선생한테 빚을 지워두는 건, 나와 만마전에게는 꽤 의미가 큰 일이니까."
10055090-51 = "좋아, 말해줄게. 오직 내가 알고 있는 '정보'만을."
10055090-55 = "……이건, 우리하고는 아무 관계 없는 먼 과거의 이야기지만."
10055090-56 = "한때, 게헨나 학원이 야심차게 해양 진출을 꿈꾸던 시기가 있었어. 일종의 해양학원을 분교로 세우려 했던 거지."
10055090-57 = "당시 학생회장은 자기 이름을 딴 범선을 만들었고, 학생들을 모집해서 진수식을 강행했지."
10055090-58 = "그리고, 어떻게 되었을 거 같아?"
10055090-59 = "출항과 동시에 침몰."
10055090-60 = "원인 자체는 알려진 것과 달리 복합적이었어. 즉, 가라앉을 수밖에 없는 배였던 거지."
10055090-61 = "그야 당연한 결과지. 배 한 척 만들어본 적 없는 학교에서, 갑자기 대형 범선을 만들겠다고 될 리가 없지."
10055090-62 = "하지만, 가장 유명한 원인이자, 결정타가 되었다고 한 사건은……."
10055090-63 = "진수 기념으로 일제 사격한 측면의 축포였어."
10055090-64 = "첫 사격 이후로, 그렇게 배는 가라앉았고, 게헨나 해양학원 계획은 그렇게 폐기되었지."
10055090-69 = "[ns] \"그때, 우리가 봤던 교표는…….\""
10055090-70 = "맞아. 게헨나 해양학원에서 사용하기로 되어 있던 교표야."
10055090-71 = "게헨나 학원의 것과 비슷하기도 하고, 해양학원 자체가 흑역사로 지워졌으니까, 이걸 구분할 줄 아는 사람은 지금 시대에 거의 없어. 실제로 마코토 쨩도 착각했고."
10055090-72 = "[s11] \"하지만 그 배는 가라앉았다며?\"\n[s12] \"학원도 사라졌다 했고.\""
10055090-75 = "그래, 맞아. 그러니까 이상한 거지."
10055090-76 = "존재할 리 없는 배. 존재할 리 없는 교표. 그런 것이 갑자기 우리 앞에 운명처럼 나타난 거야. 즉……."
10055090-80 = "즉……."
10055090-81 = "그건, 진짜 유령선……?"
10055090-86 = "[ns13] \"사츠키?!\"\n[ns14] \"정신 차려, 사츠키이-!!!\""
10055090-90 = "거기 아무도 없나?!"
10055090-94 = "여기 음료가 다 떨어졌다!"
10055090-95 = "아, 그리고 체리가 맛이 좋더군. 가장 신선한 것으로 담아서 가져와라."
10055090-100 = "우리 좀 전까지 싸우고 있지 않았던가……?"
10055090-101 = "저 사람은 뭔데 자연스럽게 상전 노릇이야……?"
10055090-102 = "거기 떠들 시간에 손발을 움직여라!"
10055090-103 = "네, 넵!"
10055090-109 = "……."
10055090-110 = "……."
10055090-111 = "이로하 선배!"
10055090-113 = "까, 깜짝이야."
10055090-114 = "이부키. 그리고, 선생님?"
10055090-115 = "실은, 있지. 이부키, 알고 있어."
10055090-116 = "이로하 선배. 마코토 선배랑 화해하고 싶은 거지?"
10055090-120 = "네?"
10055090-121 = "이부키랑 선생님이랑 여기서 응원해 줄게!"
10055090-122 = "자, 이부키가 도와줄게!"
10055090-128 = "자, 잠깐만요, 이부키!"
10055090-130 = "……."
10055090-131 = "……누가 저런 사람이랑."
10055090-132 = "안하무인에, 제멋대로에, 고집만 세고."
10055090-134 = "응? 누구냐?"
10055090-136 = "이로하……? 거기 서서 뭐 하는 거지?"
10055090-137 = "……마코토 선배."
10055090-138 = "다 됐고, 두 개만 물어볼게요."
10055090-139 = "……."
10055090-140 = "처음 유령선에 탔을 때, 이렇게 말했죠."
10055090-142 = "정 불안하면 따라오지 않아도 상관없다. 배에 남아 있고 싶다면 그렇게 해라."
10055090-143 = "대신 뒤따를 사람은 이 몸을 따라오도록. 내가 앞장서겠다."
10055090-145 = "그래, 말했었지."
10055090-146 = "……그때, 정말로 아무도 따라가지 않았으면, 어쩌려고 그랬어요?"
10055090-147 = "고작 그게 궁금했던 건가?"
10055090-148 = "간단하다. 나도 두 개로 답해주마."
10055090-149 = "첫째, 아무도 따르지 않았다면, 혼자서 해결했을 거고."
10055090-150 = "둘째, 사람들이 이 몸을 따르지 않을 리가 없다, 고."
10055090-151 = "……그게 대답인가요?"
10055090-152 = "완전 엉망진창…… 애초에 두 대답이 서로 상충하잖아요."
10055090-153 = "우리는 그런 엉터리 계획에 휘말린 건가요?"
10055090-154 = "그러는 이로하, 너도 나를 따라온 사람 중 하나일 텐데?"
10055090-155 = "그건……."
10055090-159 = "……."
10055090-160 = "두 번째 질문이에요."
10055090-161 = "유령선은, 누가 봐도 위험해 보였어요. 실은, 마코토 선배도 알고 있었죠?"
10055090-162 = "근데 거기에 왜 뛰어든 거예요?"
10055090-163 = "……."
10055090-164 = "……그럴 줄 알았어요. 역시, 아무 생각 없었던 거죠?"
10055090-165 = "기대했던 내가 바보 같아……."
10055090-166 = "아니, 그건……."
10055090-167 = "그렇지 않다."
10055090-168 = "네?"
10055090-169 = "이유는, 분명 있다. 하지만……."
10055090-170 = "……또 거짓말인가요? 그게 선배의 특기였죠."
10055090-171 = "아니다. 그저……."
10055090-172 = "어디 가서, 이 몸이 이런 말을 했다는 걸, 절대 말하지 마라."
10055090-176 = "……했으니까."
10055090-177 = "네?"
10055090-181 = "아니, 그…… 이 몸이 멋지게 상황을 전부 해결하면……."
10055090-182 = "이로하가 사과하지 않을까 하고……."
10055090-184 = "……."
10055090-185 = "……?!"
10055090-186 = "진짜, 말도 안 돼!"
10055090-187 = "그런 부끄러운 이야기를 뻔뻔히 잘도 하네요?!"
10055090-188 = "그러니까 말했잖나! 절대 말하지 말라고!"
10055090-189 = "진짜 믿을 수가 없네요! 애초에 일이 터진 원인도……."
10055090-192 = "이부키는, 대단하네요."
10055090-193 = "응?"
10055090-194 = "저는 불안해서 두 사람을 떼어놓고 싶었는데, 붙여 놓으니까 거짓말처럼 전부 해결되네요."
10055090-195 = "이부키는 이렇게 될 줄 알았던 거죠?"
10055090-196 = "응! 그야, 이로하 선배느은~"
10055090-197 = "마코토 선배를~ 진짜~ 진짜~! 좋아하는걸~!"
10055090-198 = "……."
10055090-199 = "아하하! 명답이네요! 역시 이부키는 천재네요!!"
10055090-200 = "거기 시끄러워요! 뒤에서 다 들리거든요?!"
10055090-201 = "이크?!"
10055090-202 = "이부키, 퇴각입니다!"
10055090-203 = "와아! 퇴각!"
10055090-208 = "하여간……."
10055090-209 = "……누가 저런 사람을."
10055090-210 = "안하무인에, 제멋대로에, 고집만 세고."
10055090-222 = "그래도 뭐……."
10055090-223 = "가끔은, 아주 가끔은."
10055090-225 = "꽤 멋지죠. 그 사람."
10055090-226 = "출항! 만마선～마코토 의장님의 화려한 피서～"
