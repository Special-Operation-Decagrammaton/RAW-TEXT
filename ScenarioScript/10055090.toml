[translation]
10055090-1 = "第9話;塩水の夢"
10055090-2 = "誠に、申し訳ございませんでした！！"
10055090-4 = "わ、私は止めたんです！なのに船員が「絶対に海賊だ」と言って聞かなくて……勝手に戦闘を始めて……。"
10055090-5 = "なのに、まさかのまさか！"
10055090-6 = "か～の有名なシャーレの先生と～！ゲヘナの万魔殿の皆様が、はるばるここまでいらっしゃったなんて！！"
10055090-7 = "[s1] \"だ、大丈夫。\"\n[s2] \"へっっくしゅん！！\""
10055090-10 = "だ、大丈夫ですか先生！？みんな急いでブランケットとかタオルとか、もうありったけ持って来てください！！"
10055090-11 = "[s3] \"私は大丈夫だよ。\"\n[s4] \"他のみんなをお願い。\""
10055090-14 = "ええ、ええ！もちろんです！5人ぜ～いん無事救出が終わり、皆さん安定した状態でいらっしゃいますよ。"
10055090-15 = "万魔殿の皆さんにはこう、何卒よろしく……。"
10055090-16 = "[s5] \"……5人？\"\n[s6] \"あの船には他にも……。\""
10055090-19 = "……あ、先生も見たんですね。"
10055090-20 = "皆さん口を揃えて「他にも人がいる」と言っていたのですが……。"
10055090-21 = "[s7] \"もしかして行方不明！？\"\n[s8] \"みんな海に！？\""
10055090-24 = "いえ、滅相もない！トライデントで総力を挙げて捜索中ですので！"
10055090-25 = "その……ほんと～に、誤解はしないでいただきたいのですが……。"
10055090-29 = "えっと、おかしなことを言っているように聞こえるかもしれませんが。"
10055090-30 = "……全員、消えてしまった、といいますか。"
10055090-32 = "人どころか、沈没した船さえも無くなってしまいました。"
10055090-33 = "まるで最初から存在なんてしなかったように……板の一枚も見つからないのです。"
10055090-40 = "……ああ、先生。"
10055090-41 = "聞きに来たんでしょ？私が「アレ」の正体について、何か知っているんじゃないかと。"
10055090-42 = "半分は正解よ。"
10055090-43 = "つまりもう半分はまだ推測の段階で、情報としては価値がない。"
10055090-44 = "ただ……どうしてそこまで気にするのかしら？"
10055090-45 = "[s9] \"あの子たちも、生徒だったから？\"\n[s10] \"だから……。\""
10055090-48 = "生徒とはいえ、所詮初対面の人間でしょう？"
10055090-49 = "先生の考えている事は未だによく分からないわ。"
10055090-50 = "まあでも、先生に借りを作るのは万魔殿にとってもそれなりに意味があるし……。"
10055090-51 = "いいわ、教えてあげる。私だけが知っている「情報」を、ね。"
10055090-55 = "……これは私たちとは何の関係もない、遠い昔の話だけど。"
10055090-56 = "ある時、ゲヘナ学園が海洋進出を夢見ていた時期があったの。一つの海洋学園を分校として作ろうとしていてね。"
10055090-57 = "当時の生徒会長は自分の名前を船につけ、生徒たちを集め、進水式を行なった。"
10055090-58 = "そして……どうなったと思う？"
10055090-59 = "出航と同時に沈没。"
10055090-60 = "原因はたくさんあったわ。まぁ、結局のところ沈むのが運命の船だったわけ。"
10055090-61 = "当然の結果よね。船なんて作ったこともない学園が、突然大型帆船を作ろうって言うんだもの。"
10055090-62 = "でも……最も有名な原因であり、一番の要因じゃないかと言われていたのは……。"
10055090-63 = "進水式で行われた、一斉祝砲。"
10055090-64 = "そのまま船は沈み、ゲヘナ海洋学園計画は白紙になった。"
10055090-69 = "[s] \"あの時、私たちが見た校章は……。\""
10055090-70 = "そう、ゲヘナ海洋学園で使うはずだったものよ。"
10055090-71 = "でもマコトちゃんも区別ついてなかったし、分かる人はもうほとんどいないと思うわ。#nただでさえゲヘナ学園の校章に似てるのに、#nそもそも海洋学園の存在は黒歴史としてなかったものにされてしまったのだから。"
10055090-72 = "[s11] \"でもその船は沈んだんだよね？\"\n[s12] \"学園も無くなって。\""
10055090-75 = "そうよ。だからおかしな話なの。"
10055090-76 = "存在するはずのない船と校章。#nそれが私たちの目の前に、現れたんだから。"
10055090-80 = "……つまり。"
10055090-81 = "あれは、本当の幽霊船……。"
10055090-86 = "[ns13] \"サツキ！？\"\n[ns14] \"気をしっかりして！！サツキぃ～～！！\""
10055090-90 = "そこ、誰か居ないのか？"
10055090-94 = "ドリンクのおかわりだ。"
10055090-95 = "ああそれと、チェリーが美味だった。一番新鮮なものを持ってくるように。"
10055090-100 = "……うちら、さっきまで戦ってなかったっけ？"
10055090-101 = "あいつ何者だ？偉そうに……。"
10055090-102 = "そこ！手を動かさんか！"
10055090-103 = "は、はいっ！！"
10055090-109 = "……。"
10055090-110 = "……。"
10055090-111 = "イロハ先輩！"
10055090-113 = "び、ビックリした。"
10055090-114 = "イブキと……先生？"
10055090-115 = "実はね、イブキ知ってるよ。"
10055090-116 = "イロハ先輩、マコト先輩と仲直りしたいんだよね？"
10055090-120 = "えっ？"
10055090-121 = "イブキと先生、応援しててあげる！"
10055090-122 = "はい、イブキが助けるね！"
10055090-128 = "ま、待ってくださいイブキ！"
10055090-130 = "……。"
10055090-131 = "……誰があんな人と。"
10055090-132 = "わがままで自分勝手で、強引で……。"
10055090-134 = "ん？誰だ。"
10055090-136 = "イロハ……？そこで何をしている。"
10055090-137 = "……マコト先輩。"
10055090-138 = "単刀直入に、二つ聞きたいことがあります。"
10055090-139 = "……。"
10055090-140 = "最初、幽霊船に乗る時こう言いましたよね。"
10055090-142 = "不安なら無理についてこなくとも良い。船に居たければ好きにするがいい。"
10055090-143 = "こちらに来たい者だけ私の後に続け。#nこのマコト様が先導してやろう。"
10055090-145 = "ああ、そうだ。"
10055090-146 = "あの時……誰もついていかなかったら、どうするつもりだったんですか？"
10055090-147 = "そんなことが気になるのか？"
10055090-148 = "答えはシンプルだ。私も二つ答えを出してやろう。"
10055090-149 = "一つ、誰もいなければ私一人で解決していた。"
10055090-150 = "二つ、この私に人がついてこないはずがない、とな。"
10055090-151 = "……それが答えなんですか？"
10055090-152 = "本当にめちゃくちゃ……というかその二つの答え、矛盾してるじゃないですか。"
10055090-153 = "私たちはそんなデタラメな計画に巻き込まれてたんですか？"
10055090-154 = "そういうイロハ、お前も結局は私についてきただろう？"
10055090-155 = "それは……。"
10055090-159 = "……。"
10055090-160 = "二つ目の質問です。"
10055090-161 = "あの幽霊船は、誰が見ても危険なものでした。でもマコト先輩も気付いてましたよね？"
10055090-162 = "なのになぜあそこに飛び込んだんですか？"
10055090-163 = "……。"
10055090-164 = "……そうだと思いました。やっぱり何も考えてなかったんですよね？"
10055090-165 = "期待してた私がバカだった……。"
10055090-166 = "いやそれについては……。"
10055090-167 = "そうではない。"
10055090-168 = "え？"
10055090-169 = "理由は、ある……しかし。"
10055090-170 = "……またウソですか？先輩の特技でしたね、それ。"
10055090-171 = "いいや……違う。"
10055090-172 = "ただ、これは他の奴には言いふらすな。絶対にだ。"
10055090-176 = "……だから。"
10055090-177 = "え？"
10055090-181 = "いやその……私がすべて綺麗に解決すれば……。"
10055090-182 = "イロハが謝るのでは、と思ってな……。"
10055090-184 = "……。"
10055090-185 = "……！？"
10055090-186 = "ウソですよね！！？"
10055090-187 = "そんなこと、よく口に出せましたね！？"
10055090-188 = "だから言っただろう！絶対に言うなと！"
10055090-189 = "ほんと、あり得ないですよ！？そもそも発端は全部――"
10055090-192 = "イブキちゃんはすごいね。"
10055090-193 = "うん？"
10055090-194 = "私は不安に思ってあの二人を引き離したのに……#n二人にさせた途端、何もかもうまくいった。"
10055090-195 = "イブキちゃんは、最初から分かってたんだよね？"
10055090-196 = "うん！だってイロハ先輩は～"
10055090-197 = "マコト先輩のこと、だーーーいすきだもん～！"
10055090-198 = "……。"
10055090-199 = "あはははっ！その通り！やっぱりイブキちゃんは天才だね！！"
10055090-200 = "そこうるさいですよ！全部聞こえてます！？"
10055090-201 = "あわわっ！"
10055090-202 = "イブキちゃん、退却するよ！！"
10055090-203 = "わ～たいきゃーく。"
10055090-208 = "まったく……。"
10055090-209 = "誰があんな人……。"
10055090-210 = "わがままで自分勝手で、強引で……。"
10055090-222 = "でもまあ……。"
10055090-223 = "たまには……本当、たまに。"
10055090-225 = "ちょっと格好いいですよね、マコト先輩。"
10055090-226 = "出航！万魔船　マコト議長の華麗なる避暑"
