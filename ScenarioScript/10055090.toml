[translation]
10055090-1 = "ตอนที่ 9;ความฝันของน้ำเค็ม"
10055090-2 = "ฉันรู้สึกละอายใจจริงๆ ค่ะ!!"
10055090-3 = ""
10055090-4 = "ฉันห้ามแล้วนะคะ! แต่ลูกเรือของเราเข้าใจผิดว่าพวกคุณเป็นโจรสลัดก็เลยเปิดฉากยิงกันเองโดยพลการ..."
10055090-5 = "แต่คิดไม่ถึงเลยค่ะ..."
10055090-6 = "ว่าจะเป็นคุณครูของชาเล่ต์ผู้มีชื่อเสียงโด่งดังกับเหล่าคณะกรรมการแพนเดโมเนียม โซไซตี้จากเกเฮนน่า!"
10055090-7 = "[s1] \"มะ... ไม่เป็นไรหรอก\"\n[s2] \"ฮัดชิ้ววว!\""
10055090-10 = "ตายแล้ว! ไม่เป็นไรใช่มั้ยคะ คุณครู?! ทุกคน รีบเอาผ้าห่มกับผ้าขนหนูทั้งหมดที่มีมาเร็วค่ะ!"
10055090-11 = "[s3] \"ครูไม่เป็นไร\"\n[s4] \"ช่วยดูแลนักเรียนคนอื่นก่อนเถอะ\""
10055090-14 = "ค่ะ ได้ค่ะ แน่นอนค่ะ ทั้งห้าคนได้รับการช่วยเหลืออย่างปลอดภัยแล้ว ตอนนี้กำลังพักผ่อนอยู่ค่ะ!"
10055090-15 = "ส่วนทางแพนเดโมเนียม โซไซตี้ เอ่อ... ยังไงก็ขอฝากคุณครูช่วยพูดให้หน่อยนะคะ..."
10055090-16 = "[s5] \"ห้าคน...?\"\n[s6] \"ไม่สิ บนเรือลำนั้นน่ะ...\""
10055090-19 = "อ่า คุณครูก็เห็นเหมือนกันสินะคะ..."
10055090-20 = "ทุกคนยืนยันเป็นเสียงเดียวกันเลยค่ะว่ามีคนเยอะกว่านั้น..."
10055090-21 = "[s7] \"หรือว่าหายตัวไปแล้ว...?!\"\n[s8] \"พวกนักเรียนตกไปในทะเลเหรอ?!\""
10055090-24 = "ไม่ใช่นะคะ! ไม่ใช่แน่นอนค่ะ! ทางไทรเดนต์กำลังค้นหากันอย่างสุดกำลังเลยค่ะ!"
10055090-25 = "จริงๆ นะคะ~! ได้โปรดอย่าเข้าใจผิดเลยค่ะ!"
10055090-26 = ""
10055090-28 = ""
10055090-29 = "แต่ว่า... คือ... มันอาจฟังดูแปลกๆ ไปสักหน่อย"
10055090-30 = "แต่จะบอกว่าหายไปเลยได้มั้ยนะ...?"
10055090-32 = "ไม่ใช่แค่คนนะคะ แม้แต่เรือที่จมลงไปก็หายไปด้วยค่ะ"
10055090-33 = "เหมือนไม่เคยมีอยู่ตั้งแต่แรก ไม่เหลือแม้แต่เศษไม้สักชิ้นเลย"
10055090-40 = "อ่า ครู..."
10055090-41 = "คงจะมาถามฉันเพราะคิดว่าฉันพอจะเดาได้ว่า ‘สิ่งนั้น’ คืออะไรสินะ"
10055090-42 = "ก็ถูกครึ่งหนึ่งนั่นละ"
10055090-43 = "หมายความว่าอีกครึ่งหนึ่งยังเป็นแค่การคาดเดา ยังไม่มีค่าพอจะใช้เป็นข้อมูลได้หรอก"
10055090-44 = "ว่าแต่ว่า... ทำไมถึงสนใจขนาดนั้นล่ะ?"
10055090-45 = "[s9] \"เด็กพวกนั้นก็เป็นนักเรียนนะ\"\n[s10] \"ก็เป็นเด็กนักเรียนนี่นา...\""
10055090-48 = "ถึงจะเป็นนักเรียน แต่สุดท้ายก็เป็นคนอื่นที่เพิ่งเจอกันครั้งแรกไม่ใช่เหรอ?"
10055090-49 = "ฉันก็ยังไม่เข้าใจความคิดของครูอยู่ดี"
10055090-50 = "แต่การทำให้คุณครูติดหนี้บุญคุณไว้ได้ ก็มีความหมายกับฉันและแพนเดโมเนียม โซไซตี้มากทีเดียว"
10055090-51 = "เอาเถอะ ฉันจะเล่าให้ฟังเฉพาะ 'ข้อมูล' ที่ฉันรู้ก็แล้วกัน"
10055090-52 = ""
10055090-54 = ""
10055090-55 = "ถึงจะเป็นเรื่องเมื่อนานมาแล้วที่ไม่ได้เกี่ยวอะไรกับพวกเราเลยก็เถอะ"
10055090-56 = "ช่วงหนึ่งที่โรงเรียนเกเฮนน่ามีความทะเยอทะยานอยากขยายอาณาเขตไปสู่ทะเล จนถึงขั้นคิดจะตั้งโรงเรียนสาขาที่เน้นด้านการเดินเรือขึ้นมาเลยละ"
10055090-57 = "ประธานสภานักเรียนในตอนนั้นสร้างเรือใบที่ตั้งชื่อตามตัวเอง จากนั้นก็รวบรวมนักเรียนแล้วดึงดัน#nจัดพิธีปล่อยเรือลงน้ำจนได้"
10055090-58 = "หลังจากนั้น คุณครูคิดว่าเกิดอะไรขึ้นล่ะ?"
10055090-59 = "เรือจมทันทีที่ออกจากท่าเลยน่ะสิ"
10055090-60 = "จริงๆ แล้วมีหลายสาเหตุประกอบกัน ไม่ใช่อย่างที่เล่ากันมาหรอก พูดง่ายๆ ก็คือ เป็นเรือที่ยังไงก็ต้องจมอยู่แล้วนั่นแหละ"
10055090-61 = "มันก็ต้องเป็นอย่างนั้นอยู่แล้ว โรงเรียนที่ไม่เคยสร้างเรือสักลำ จู่ๆ จะมาสร้างเรือใบขนาดใหญ่ได้ยังไงล่ะ"
10055090-62 = "แต่สาเหตุของการจมที่เป็นที่พูดถึงและพูดว่ากันว่าเป็นตัวการที่ทำให้จมก็คือ..."
10055090-63 = "การยิงปืนใหญ่ด้านข้างเรือพร้อมกันเพื่อฉลองการปล่อยเรือลงน้ำน่ะ"
10055090-64 = "หลังยิงครั้งแรก เรือก็จมลงไปแบบนั้นเลย และแผนสร้างโรงเรียนการเดินเรือเกเฮนน่าก็ถูกยกเลิกไป"
10055090-67 = ""
10055090-69 = "[ns] \"งั้นตราโรงเรียนที่พวกเราเห็นตอนนั้นก็คือ...\""
10055090-70 = "ใช่ เป็นตราที่เตรียมไว้ใช้สำหรับโรงเรียนการเดินเรือเกเฮนน่าน่ะ"
10055090-71 = "มันคล้ายกับตราของโรงเรียนเกเฮนน่า แล้วโรงเรียนการเดินเรือก็ถูกลบออกจากหน้าประวัติศาสตร์ของ#nเกเฮนน่า เพราะมันเป็นอดีตที่ไม่อยากจดจำ สมัยนี้เลยแทบไม่มีใครแยกตราออกหรอก ขนาดมาโคโตะจังเอง ก็ยังเข้าใจผิดเลย"
10055090-72 = "[s11] \"แต่เห็นบอกว่าเรือลำนั้นจมไปแล้วนี่นา?\"\n[s12] \"โรงเรียนก็ไม่มีแล้วไม่ใช่เหรอ\""
10055090-75 = "ใช่แล้ว เพราะงั้นถึงได้น่าแปลกไงล่ะ"
10055090-76 = "เรือที่ไม่ควรมีอยู่ ตราโรงเรียนที่ไม่ควรมีอยู่ จู่ๆ ก็ปรากฏตรงหน้าพวกเรา ราวกับโชคชะตาลิขิตไว้..."
