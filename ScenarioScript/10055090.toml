10055090-134 = "Huh? Who's there?"
10055090-135 = ""
10055090-136 = "Iroha...? What are you doing here?"
10055090-137 = "...Makoto."
10055090-138 = "Never mind all that. I have two questions for you."
10055090-139 = "..."
10055090-140 = "When you first left for the ghost ship, do you remember what you said?"
10055090-141 = ""
10055090-142 = "If you're too worried, you don't have to come. If you want to stay on the boat, then stay."
10055090-143 = "Anyone who wants to come with me, follow along. I'll lead the way."
10055090-144 = ""
10055090-145 = "Yes. Those were my words."
10055090-146 = "...What would you have done if no one had followed you?"
10055090-147 = "That's what you wanted to know?"
10055090-148 = "Simple questions, with simple answers."
