10055090-107 = ""
10055090-108 = ""
10055090-109 = "……"
10055090-110 = "……"
10055090-111 = "伊呂波前輩！"
10055090-113 = "嚇，嚇我一跳。"
10055090-114 = "伊吹……還有老師？"
10055090-115 = "其實啊，伊吹知道哦。"
10055090-116 = "伊呂波前輩，你想跟真琴前輩和好對吧？"
10055090-117 = ""
10055090-119 = ""
10055090-120 = "咦？"
10055090-121 = "伊吹和老師會在這裡幫你加油的！"
10055090-122 = "來，伊吹來幫你！"
10055090-123 = ""
10055090-125 = ""
10055090-126 = ""
10055090-127 = ""
10055090-128 = "等，等一下，伊吹！"
10055090-129 = ""
10055090-130 = "……"
10055090-131 = "……誰要跟那種人和好啊。"
10055090-132 = "目中無人、任性妄為，又固執得要命。"
10055090-134 = "嗯？是誰？"
10055090-135 = ""
10055090-136 = "伊呂波……？你站在那裡做什麼？"
10055090-137 = "……真琴前輩。"
10055090-138 = "我就開門見山地說了──我想問你兩件事。"
10055090-139 = "……"
10055090-140 = "最初要登上幽靈船的時候，你是這麼說的吧。"
10055090-141 = ""
10055090-142 = "要是真的會怕，不跟來也無所謂。想留在船上就隨你們高興。"
10055090-143 = "想跟來的人就跟在本大人後面。就由我真琴大人來帶路吧。"
10055090-144 = ""
10055090-145 = "沒錯，我是說過。"
10055090-146 = "……那時候要是真的沒人跟過去，你打算怎麼辦？"
10055090-147 = "你居然好奇這種事？"
10055090-148 = "很簡單。我也給你兩個答案吧。"
10055090-149 = "第一，要是沒人跟來就由本大人自己解決。"
10055090-150 = "第二，大家不可能不追隨本大人。"
10055090-151 = "……這就是你的回答嗎？"
10055090-152 = "真是亂七八糟……而且這兩個回答根本自相矛盾嘛。"
10055090-153 = "我們就是被捲進了這種胡來的計畫裡嗎？"
10055090-154 = "雖然伊呂波你嘴上這麼說，當時不也跟著本大人來了嗎？"
10055090-155 = "那是……"
10055090-156 = ""
10055090-158 = ""
10055090-159 = "……"
10055090-160 = "第二個問題。"
10055090-161 = "那艘幽靈船不管怎麼看都很危險。其實真琴前輩也察覺到了吧？"
10055090-162 = "既然如此，你又為什麼要衝進去呢？"
10055090-163 = "……"
10055090-164 = "……我就知道。你果然什麼都沒想吧？"
10055090-165 = "對你抱有期待的我真是個笨蛋……"
10055090-166 = "不，關於那件事……"
10055090-167 = "不是那樣的。"
10055090-168 = "咦？"
10055090-169 = "理由確實有。只是……"
10055090-170 = "……又在說謊嗎？那可是前輩的拿手絕活呢。"
10055090-171 = "我沒有說謊。只是……"
10055090-172 = "本大人說過這種話的事，絕對不准說出去。"
10055090-173 = ""
10055090-175 = ""
10055090-176 = "……才這麼做的。"
10055090-177 = "咦？"
10055090-178 = ""
10055090-180 = ""
10055090-181 = "就是，那個……要是本大人帥氣地擺平一切……"
10055090-182 = "伊呂波說不定就會來道歉了……"
10055090-184 = "……"
10055090-185 = "……！？"
10055090-186 = "真的假的，太扯了吧！"
10055090-187 = "這麼丟臉的話，你還真敢厚著臉皮說出口耶！？"
10055090-188 = "所以我剛才不是說過了嗎！絕對不准說出去！"
10055090-189 = "真是難以置信！尤其事情的起因根本就是……"
10055090-191 = ""
10055090-192 = "伊吹醬真厲害呢。"
10055090-193 = "嗯？"
10055090-194 = "我因為擔心而想把他們兩個分開……#n沒想到讓他們獨處之後，一切就像騙人一樣全都解決了呢。"
10055090-195 = "伊吹醬早就知道會變成這樣了吧？"
10055090-196 = "嗯！因為伊呂波前輩他～"
10055090-197 = "最～最～最喜歡真琴前輩了嘛～！"
10055090-198 = "……"
10055090-199 = "啊哈哈！答得好！伊吹醬果然是天才呢！！"
10055090-200 = "那邊很吵耶！後面全都聽得到好嗎！？"
10055090-201 = "糟了！？"
10055090-202 = "伊吹醬，撤退！"
10055090-203 = "哇啊！撤退！"
