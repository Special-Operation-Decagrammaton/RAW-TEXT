10055090-155 = "That's..."
10055090-156 = ""
10055090-158 = ""
10055090-159 = "..."
10055090-160 = "My second question."
10055090-161 = "That ghost ship looked dangerous to anyone who saw it. You knew that too, didn't you, Makoto?"
10055090-162 = "Why did you run on board?"
10055090-163 = "..."
10055090-164 = "...I knew it. You really didn't think it through at all, did you?"
