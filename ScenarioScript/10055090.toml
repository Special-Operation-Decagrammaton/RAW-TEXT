[translation]
10055090-1 = "第9話;鹽水之夢"
10055090-2 = "真的非常抱歉！！"
10055090-3 = ""
10055090-4 = "我有試著阻止他們！可是我們的船員一口咬定你們是海盜，所以就擅自開火了……"
10055090-5 = "不過，萬萬沒想到！"
10055090-6 = "居然是那～位～鼎鼎大名的夏萊的老師！以及從格黑娜遠道而來的萬魔殿幹部們！"
10055090-7 = "[s1] 「沒，沒關係。」\n[s2] 「哈啾！」"
10055090-10 = "哎呀！老師你沒事吧！？#n大家快去把毯子和毛巾全部拿過來，有多少拿多少！"
10055090-11 = "[s3] 「我沒事。」\n[s4] 「先照顧其他學生吧。」"
10055090-14 = "是的是的，那是當然。#n他們五位全～都已經平安獲救，目前正在休息！"
10055090-15 = "萬魔殿那邊，還請老師務必幫我們美言幾句……"
10055090-16 = "[s5] 「五個人……？」\n[s6] 「不對，那艘船上明明還有……」"
10055090-19 = "……啊，原來老師也看到了。"
10055090-20 = "大家都異口同聲地說，明明還有其他人……"
10055090-21 = "[s7] 「難道……他們失蹤了！？」\n[s8] 「學生們掉進海裡了！？」"
10055090-24 = "不不不，絕對沒有這種事！#n三叉戟正在全力進行搜索，是的是的！"
10055090-25 = "真～的～！希望你千萬別誤會……"
10055090-26 = ""
10055090-28 = ""
10055090-29 = "不過……雖然這麼說聽起來可能很奇怪。"
10055090-30 = "該說是消失了嗎……？"
10055090-32 = "別說是人了，連沉沒的船都消失了。"
10055090-33 = "就好像從一開始就不存在一樣，連一片木板都找不到。"
10055090-40 = "……啊啊，老師。"
10055090-41 = "你是來問我的吧？問我是不是猜到了「那個」的真面目。"
10055090-42 = "說對了一半。"
10055090-43 = "也就是說，另一半還停留在推測階段，還算不上有價值的情報。"
10055090-44 = "不過……你為什麼會這麼在意呢？"
10055090-45 = "[s9] 「那些孩子們也是學生啊。」\n[s10] 「所以……」"
10055090-48 = "就算是學生，說到底也只是初次見面的陌生人吧？"
10055090-49 = "我還是不太懂老師在想什麼呢。"
10055090-50 = "不過讓老師欠我一份人情，對我和萬魔殿來說的意義可不小。"
10055090-51 = "好吧，我就告訴你。不過只限我所知道的「情報」。"
10055090-52 = ""
10055090-54 = ""
10055090-55 = "……雖然這是很久以前的事，跟我們毫無關係。"
10055090-56 = "曾經有一段時期，格黑娜學園雄心勃勃地夢想進軍海洋，#n打算以分校的形式建立一所海洋學園。"
10055090-57 = "當時的學生會長打造了一艘以自己為名的帆船，並募集學生強行舉辦了下水典禮。"
10055090-58 = "然後……你猜結果怎麼樣？"
10055090-59 = "才剛出航就沉沒了。"
10055090-60 = "跟外界所知的不同，真正的原因相當複雜。#n說穿了，那就是一艘注定要沉的船。"
10055090-61 = "這也是理所當然的。#n一所連艘船都沒造過的學園突然說要打造大型帆船，怎麼可能會成功嘛。"
10055090-62 = "不過其中最有名，也被認為是致命一擊的事件……"
10055090-63 = "就是為了慶祝下水，從側舷一齊發射的禮砲。"
10055090-64 = "第一輪禮砲過後，船就這麼沉了，格黑娜海洋學園計畫也就此作廢。"
10055090-67 = ""
10055090-69 = "[ns] 「那時候，我們看到的校徽是……」"
10055090-70 = "沒錯。那是原本預定在格黑娜海洋學園使用的校徽。"
10055090-71 = "它跟格黑娜學園的校徽很像，海洋學園本身又被當成黑歷史抹消……#n所以現在幾乎沒有人分得出來。實際上就連真琴醬也搞錯了。"
10055090-72 = "[s11] 「可是你不是說那艘船已經沉了嗎？」\n[s12] 「學園也已經不在了。」"
10055090-75 = "沒錯。所以才奇怪啊。"
10055090-76 = "不可能存在的船。不可能存在的校徽。#n那些東西像命運的安排一般突然出現在我們面前，這就代表……"
10055090-77 = ""
10055090-79 = ""
10055090-80 = "代表……"
10055090-81 = "那是真正的幽靈船……？"
10055090-82 = ""
10055090-84 = ""
10055090-86 = "[ns13] 「皐月！？」\n[ns14] 「振作一點，皐月～！！！」"
10055090-90 = "那邊沒人在嗎！？"
10055090-91 = ""
10055090-93 = ""
10055090-94 = "這裡的飲料都喝完了！"
10055090-95 = "啊，還有櫻桃很好吃。挑最新鮮的端上來。"
10055090-96 = ""
10055090-98 = ""
10055090-99 = ""
10055090-100 = "我們剛剛不是還在打仗嗎……？"
10055090-101 = "那傢伙到底是誰啊，怎麼這麼自然地擺起架子來了……？"
10055090-102 = "那邊的！有空聊天不如動手做事！"
10055090-103 = "是，是的！"
