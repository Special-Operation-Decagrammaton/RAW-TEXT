10055090-175 = ""
10055090-176 = "It was because..."
10055090-177 = "Yes?"
10055090-178 = ""
10055090-180 = ""
10055090-181 = "Well, I thought...if I managed to solve everything in spectacular fashion..."
10055090-182 = "...then maybe you'd apologize to me."
