[translation]
10055090-1 = "Episode 9;Saltwater Dream"
10055090-2 = "I am truly, deeply sorry!"
10055090-3 = ""
10055090-4 = "While I did everything I could to stop them, my crew was utterly convinced that you were pirates and opened fire!"
10055090-5 = "But none of us could have imagined this!"
10055090-6 = "I can't believe it was THE Sensei aboard! And Gehenna's esteemed Pandemonium Society!"
10055090-7 = "[s1] \"D-Don't worry about it.\"\n[s2] \"Achoo!\""
10055090-10 = "Oh dear! Oh dear! Are you getting sick, Sensei? Bring towels! Blankets! Everything we have, stat!"
10055090-11 = "[s3] \"No, don't. I'm completely fine.\"\n[s4] \"Take care of my students first.\""
10055090-14 = "Naturally, of course! We've rescued all five of them, and they are safely recuperating as we speak!"
10055090-15 = "And, um... I'd really appreciate it if you could put in a good word for us with the Pandemonium Society..."
10055090-16 = "[s5] \"Five...?\"\n[s6] \"No, there were two more...\""
10055090-19 = "...Ah. So you saw them too, Sensei."
10055090-20 = "Everyone keeps insisting there were definitely more people aboard..."
10055090-21 = "[s7] \"Do you mean to say...they're missing?!\"\n[s8] \"They were left behind in the ocean?!\""
10055090-24 = "No, absolutely not! Trident is already conducting a full-scale search for them!"
10055090-25 = "Please, please don't misunderstand what I'm about to say!"
10055090-26 = ""
10055090-28 = ""
10055090-29 = "I know it's going to sound beyond weird..."
10055090-30 = "But it's almost like...they vanished."
10055090-32 = "Not just these supposed students. The ship itself vanished too."
10055090-33 = "It didn't sink. We couldn't find a sail, a cannon, or even a plank of wood. It's like it never existed."
10055090-40 = "...Ah, Sensei."
10055090-41 = "You came to consult with me on the matter of the ghost ship, yes? I'm the most likely to have some idea of what it was, after all."
10055090-42 = "You are...somewhat right to think so."
10055090-43 = "I do have intel. But much of it is speculation."
10055090-44 = "...But why are you seeking answers, Sensei?"
10055090-45 = "[s9] \"They were students too.\"\n[s10] \"So...\""
10055090-48 = "...Even if they were students, they weren't YOUR students, were they?"
10055090-49 = "I still have trouble understanding the way you see things sometimes."
10055090-50 = "Still, having you owe us a favor would be quite valuable to both me and the Pandemonium Society."
10055090-51 = "So I'll tell you what I know, speculation and all."
10055090-52 = ""
10055090-54 = ""
10055090-55 = "...Mind you, this is ancient history. It has little to do with us."
10055090-56 = "There was once a time when Gehenna Academy had ambitious plans to expand to the seas. They intended to establish a maritime branch school."
10055090-57 = "So the student council president at the time built a sailing ship, named it after herself, and gathered many students for a ceremony for its first sail."
10055090-58 = "And what do you think happened?"
10055090-59 = "It sank immediately."
10055090-60 = "Contrary to many popular tellings of this story, there were several glaring issues from the get-go."
10055090-61 = "Most obviously, Gehenna was not an academy that had ever sailed the waters. How would they magically be able to build a functioning vessel of that size? Their venture was doomed before it even began."
10055090-62 = "But the most well-known incident that sealed the coffin shut, so to speak..."
10055090-63 = "...was a commemorative volley they fired to celebrate."
10055090-64 = "The ship sank with its very first volley, and the Gehenna Maritime School project was abandoned."
10055090-67 = ""
10055090-69 = "[ns] \"Then the school emblem we saw...\""
10055090-70 = "Right. It was originally intended for Gehenna Maritime School."
10055090-71 = "It's similar enough to Gehenna's, and the Maritime School itself isn't known to today's students. It was considered a failure and an embarrassment and stricken from the history books. It isn't surprising Makoto mistook it for our own."
10055090-72 = "[s11] \"But you said that ship sank, right?\"\n[s12] \"And the school disappeared too.\""
10055090-75 = "Exactly. Which is where conjecture comes in."
10055090-76 = "A ship that should no longer exist. An emblem that was eradicated from history. Like the hands of fate played their cards, it mysteriously appears before us..."
10055090-77 = ""
10055090-79 = ""
10055090-80 = "Which means..."
10055090-81 = "...it really was a ghost ship?!"
10055090-82 = ""
10055090-84 = ""
10055090-86 = "[ns13] \"Satsuki?!\"\n[ns14] \"Stay with me, SATSUKIII!\""
