[translation]
10030050-1 = "제5화;저녁 준비"
10030050-6 = "……생각보다 오래 걸렸네. 얼마나 멀리까지 찾으러 갔었던 거야?"
10030050-7 = "텐트 앞에서 혼자서 기다리려니 지루해서—"
10030050-18 = "다들…… 그 모습은 뭐야? 숲속에서 다 같이 달리기 경주라도 했어?"
10030050-21 = "뭐, 달리기를 한 것만큼은 사실이지만……"
10030050-22 = "……구체적으로 설명하자면 조금 이야기가 길어지게 될 것 같네."
10030050-23 = "조금 전, 숲 한 가운데에 갔다가 특훈을 나온 스미레 부장과 만났습니다."
10030050-28 = "아아."
10030050-29 = "[s] \"……어째서 바로 납득하는 거야?!\""
10030050-30 = "아, 미안. 스미레 부장의 이름을 들으니 어쩐지 짐작이 가서……."
10030050-31 = "무슨 엉뚱한 상상을 하고 있는지는 모르겠지만, 스미레 부장에게 쫓긴 게 아니거든?"
10030050-32 = "평범하게 트레이닝 부의 신입 부원과 함께 야외 활동에 대한 이야기를 나누고 있었습니다만……"
10030050-34 = "갑자기 그 앞에 큰 곰이 나타난 거야!"
10030050-39 = "고, 곰이라고?!"
10030050-40 = "괘, 괜찮은 거야? 혹시라도 캠핑장을 습격하기라도 하면……"
10030050-41 = "걱정 마. 지금은 멀리 도망쳤으니까."
10030050-46 = "이번에는 다행히 트레이닝 부가 발 빠르게 유인해 준 덕분에 간신히 떨쳐내는 데 성공했지만……"
10030050-47 = "앞으로도 가급적 숲 가까이에는 가지 않는 게 좋겠어.#n곰 이외의 또 다른 맹수가 나타날지도 모르니까."
10030050-48 = "그나저나 트레이닝 부는 그런 난리를 겪고도 야외 훈련을 계속할 생각인가 봐?"
10030050-49 = "음, 일단 장소를 옮기긴 하겠지만 특훈은 그만두지 않을 예정이래."
10030050-50 = "내년 시즌이 시작되기 전까지 체력을 전력으로 끌어올리려면 1분 1초가 아쉽다던가."
10030050-51 = "레이, 생각했던 것보다 훨씬 더 야구에 진심이었던 모양이군요."
10030050-52 = "내년에는 밀레니엄 야구부가 활약하는 모습을 기대해도 괜찮으려나?"
10030050-56 = "[ns] \"뭔가 내가 본 기억하고는 조금 다른 것 같은데……\""
10030050-60 = "더는 못 버텨요!"
10030050-61 = "홈런을 쉽게 칠 수 있는 비결을 알려주신다더니, 야구와는 상관없는 특훈만 계속하고…… 곰에게 쫓겨 도망치기나 하고!"
10030050-62 = "이런 부활동, 그만두겠어요!"
10030050-68 = "레이 양이 퇴부를 희망한다면 그걸 막을 수는 없겠지만……"
10030050-69 = "일단 한 번 특훈을 시작한 이상, 트레이닝이 끝나기 전까지 레이 양을 보내드릴 수는 없습니다."
10030050-70 = "[ruby=쿨 다운]마무리 운동[/ruby] 없이 갑자기 트레이닝을 중단하면 근육통이나 혈액 고착을 유발할 수도 있으니까요!"
10030050-71 = "트레이닝부의 가입 여부를 떠나 밀레니엄 피트니스 센터의 안전책임자로서 위험한 운동을 하는 '회원님'을 그대로 내버려둘 수는 없습니다!"
10030050-72 = "막는다고 누가 못 돌아갈 줄 알고요?"
10030050-73 = "선배가 제 앞을 가로막는다면, 억지로라도 선배를 쓰러트리고 돌아갈 테니까요!"
10030050-74 = "바로 그 자세입니다, 레이 양."
10030050-75 = "엑."
10030050-76 = "지금까지는 곰 선생님이 스피드 트레이닝의 지도를 해주셨으니……"
10030050-81 = "지금부터는 제가 직접 레이 양의 파워 트레이닝을 진행하겠습니다!"
10030050-82 = "우는 소리를 내도 훈련은 멈추지 않는다고요?"
10030050-88 = "우으…… 우으으……"
10030050-89 = "트레이닝 부, 진짜 싫어!"
10030050-92 = "……그나저나 이제 뭐 하지? 아직 오후 4시밖에 안 되었는데."
10030050-93 = "뭐? 그 난리를 겪고 돌아왔는데 아직 시간이 그것밖에 안 지나갔다고?"
10030050-94 = "……역시 야외에 있을 때는 평소보다 시간이 천천히 흘러가는 것 같습니다."
10030050-95 = "그러게. 부실에서는 게임 두 세 판만 해도 하루가 금방 끝나버렸는데."
10030050-96 = "……이게 그 특수 상대성 이론이라는 녀석인가?"
10030050-97 = "아니, 상대성 이론은 그럴 때 쓰는 이론이 아니거든."
10030050-103 = "뭐하기는. 이제 저녁 준비해야지."
10030050-108 = "벌써?!"
10030050-109 = "아직 점심 먹은 지 3시간밖에 지나지 않았는데……?"
10030050-110 = "설마 부부장, 며칠 사이에 먹는 양이 늘어난 게—"
10030050-112 = "배가 고파서 서두르는 게 아니거든?!"
10030050-113 = "실내와 달리 야외에서 요리를 하려면 불을 피우는 것부터 식재료를 손질하는 것까지 미리 해 둬야 할 일이 잔뜩 있으니까."
10030050-114 = "해가 지기 전에 요리를 완성하려면 지금부터 부지런히 준비해 두는 편이 좋아."
10030050-115 = "오히려 평소에 너희들이 보여주었던 손재주를 생각하면 지금도 너무 늦은 게 아닐까 걱정될 정도인데……"
10030050-116 = "치이, 식재료 손질이라고 해도 가져온 채소를 씻고 손질하는 게 전부잖아?"
10030050-117 = "그런 단순 작업쯤이야 마음만 먹으면 금방이라고."
10030050-120 = "가져온 채소도 감자나 양파처럼 평범한 것뿐이고……"
10030050-121 = "여럿이서 함께 손질하면 금방 끝낼 수 있을 것 같은데."
10030050-123 = "의욕만큼은 충분한 것 같아서 다행이네."
10030050-124 = "그럼 너희들은 여기 있는 채소들을 씻어서 껍질을 벗기고 한입 크기로 먹기 좋게 잘라줘."
10030050-125 = "나는 그 사이에 캠프 맞은편에서 불을 피우고 있을게."
10030050-126 = "맡겨만 달라고!"
10030050-132 = "(약 1시간 뒤……)"
10030050-135 = "으으, 으으읏……"
10030050-139 = "우왓?!"
10030050-144 = "마키, 괜찮아? 손 안 다쳤어?"
10030050-148 = "응, 다행히. 다치진 않았는데……"
10030050-149 = "뭐야, 이 당근. 그렇게 힘을 주어 눌렀는데도 여전히 멀쩡하잖아?"
10030050-150 = "도대체 심지가 얼마나 단단하면, 칼로도 잘리질 않는 거야?"
10030050-151 = "[s1] \"캠핑용 나이프는 주방용에 비해 날이 무디고, 크기가 작은 편이니까……\"\n[s2] \"어지간한 힘으로는 쉽게 다루기 어려울 거야.\""
10030050-158 = "[ns3] \"당근을 자르는 건 내가 할게.\"\n[ns4] \"마키는 대신 껍질을 벗기는 일을 맡아줘.\""
10030050-163 = "으음, 그럼 부탁할게. 선생님……"
10030050-164 = "코타마 선배는 어때? 감자 껍질은 다 깎았어?"
10030050-170 = "아뇨. 이제야…… 겨우 3개째입니다……"
10030050-171 = "울퉁불퉁한 감자의 표면을 얇게 깎아 내는 게 생각보다 어려워서……"
10030050-172 = "벌써부터 손목이 욱신거리기 시작해서, 칼에 좀처럼 힘이 들어가질 않습니다……."
10030050-173 = "게다가 이 주변에는 온수 시설도 없어서…… 차가운 계곡물에 채소를 씻는 것도 꽤나 고역이야."
10030050-174 = "으으, 계곡물에 손을 담글 때마다 손끝이 얼어붙는 것 같아……."
10030050-175 = "치히로 선배의 말처럼 생각했던 것 보다 시간이 오래 걸리는 걸……"
10030050-176 = "……그보다 이렇게까지 해가면서 저녁을 꼭 직접 만들어 먹어야 하는 거야?"
10030050-184 = "채소 손질은 다 끝났어?"
10030050-189 = "아, 아직……"
10030050-190 = "저희에게 시간과 예산을 조금만 더 주신다면……"
10030050-192 = "예산……?"
10030050-193 = "저기, 치히로 선배."
10030050-194 = "혹시, 이번에 챙겨온 짐 중에 컵라면이나 레토르트 카레 같은 즉석식품은 없어?"
10030050-195 = "비상시를 대비해 몇 개 가져오긴 했지만…… 그건 왜?"
10030050-199 = "그럼 저녁밥으로 대신 그걸 먹자!"
10030050-200 = "캠핑장은 인터넷도 안 되고, 편의점도 없고, 불편한 것들이 한가득인데…… 밥만큼은 편하게 먹어도 괜찮잖아?"
10030050-201 = "안 돼."
10030050-202 = "안 그래도 평소에 인스턴트 식품을 너무 먹어서 문제라고 했었는데, 여기까지 와서 또 즉석 식품을 먹겠다고?"
10030050-203 = "으, 으윽……"
10030050-204 = "오기 전에도 말했었지만, 이번 캠핑은 평소의 생활에서 벗어나 건강한 하루를 보내는 데 목적이 있으니까."
10030050-205 = "조금 귀찮더라도 오늘은 제대로 된 요리를 해 먹자. 식재료 손질도 내가 마저 도와줄 테니까."
10030050-206 = "하지만 제대로 된 요리라고 해도 이런 야외에서 만들 수 있는 건 한정되어 있잖아?"
10030050-207 = "카레라이스라든가, 볶음밥이라든가……"
10030050-208 = "후후, 완성된 요리를 보고 나면 마키도 그런 소리는 하지 못할걸."
10030050-214 = "캠핑을 떠나기 전에 미리 오늘에 어울리는 특별한 재료를 준비해 왔거든."
10030050-221 = "특별한 재료……?"
