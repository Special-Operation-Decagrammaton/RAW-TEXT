[translation]
10035160-1 = "후일담;국장 없는 공안국의 하루"
10035160-4 = "칸나 국장님께서 부재중이시니, 부국장님께서 대리 업무를 수행하셔야 합니다."
10035160-9 = "에휴우……."
10035160-10 = "누님을 워터파크로 보내드린 건 좋은데, 업무 생각을 못 했구만."
10035160-14 = "우선 결재 서류에 도장부터 부탁드립니다."
10035160-15 = "알았어, 알았어."
10035160-16 = "누님의~~도장~~아아~~어디에에~있느냐아아~~"
10035160-22 = "아, 찾았다."
10035160-27 = "……찾기는 찾았는데, 이 많은 서류를 언제 다 결재한다냐."
10035160-28 = "에휴, 내 팔자야."
10035160-29 = "흐음, 공안국 식음시설 개축 계획, 오케이."
10035160-30 = "지하 취조실 창문 설치 요청."
10035160-31 = "이건 뭐야? 기각."
10035160-32 = "가츠동 주문 업체 변경 요청. 오케이."
10035160-37 = "(생각보다 빠르시군……)"
10035160-38 = "(이거라면 오늘 안에 끝낼 수 있겠어.)"
10035160-43 = "아유, 하기 싫어."
10035160-45 = "얼마나 하셨다고?!"
10035160-46 = "서류 업무는 정말 안 맞는단 말이지. 좀이 쑤셔서 못 견디겠네."
10035160-47 = "하지만 부국장님, 오늘까지 마쳐야 하는 서류들입니다."
10035160-48 = "뭐, 그건 아는데 말야……."
10035160-52 = "솔직히 너도 지루하지?"
10035160-53 = "네, 네?!"
10035160-54 = "짜아식, 부끄러워하기는. 그치? 너도 사무실에 앉아서 서류만 들여다보는 건 싫지?"
10035160-55 = "아, 아닙니다!"
10035160-56 = "이, 이것도 엄연히 공안국의 업무고……."
10035160-57 = "이 형님 눈을 속일 순 없다고."
10035160-58 = "여름에 사무실에만 있기는 싫은 거지?"
10035160-59 = "……네?"
10035160-60 = "아, 이거 어쩔 수 없네!"
10035160-61 = "부하 직원의 고충을 들어주는 것 또한 부국장의 업무잖아?"
10035160-65 = "아, 아, 현 회선에 대기 중인 인원은 모두 잘 들을 것."
10035160-67 = "오후에는 오랫동안 미뤄 왔던 공안국 필수 전투 수영 실습을 실시한다!"
10035160-68 = "갑자기요?!"
10035160-80 = "음!"
10035160-81 = "발키리 경찰학교가 자랑하는 야외 수영 훈련장!"
10035160-82 = "칸나 누님도 절찬리에 여름을 즐기고 있는바, 우리도 질 수 없잖냐!"
10035160-83 = "화끈하게 200번 왕복으로 가자고!"
10035160-84 = "짜식들아, 준비됐냐!"
10035160-86 = "엥? 200번 왕복이라니, 농담하시는 거죠?"
10035160-87 = "부국장님은 가능하실지 몰라도 우리한테는 무리인데요!"
10035160-89 = "앙? 뭐라고?"
10035160-90 = "대 공안국 요원들이 패기가 그렇게 없어서 되겠나?"
10035160-91 = "인마, 그거 잠깐 팔다리 깔짝깔짝하면 되는 거 아냐!"
10035160-97 = "아, 예……."
10035160-99 = "목소리가 작다!"
10035160-102 = "네, 부국장님!"
10035160-104 = "그래, 이 정도는 해야지!"
10035160-105 = "얼른 끝내고 밖에서 돈코츠 라멘 한 그릇씩 하자고! 마늘 토핑 팍팍 넣어서! 내가 낼 테니까!"
10035160-106 = "난 케이크나 마카롱이 더 좋은데……."
10035160-107 = "쉿, 부국장님 취향이니 그러려니 해."
10035160-109 = "거기 잡담 금지!"
10035160-110 = "그럼 내가 앞장설 테니, 돌입하—"
10035160-116 = "어, 어라?"
10035160-118 = "어라, 새카만 색의 고양이가 나왔다가……사라졌네."
10035160-119 = "부국장님, 앞장서신다면서요?"
10035160-121 = "어……그게……."
10035160-127 = "(검은 고양이는 불운의 상징…….)"
10035160-128 = "(그러고 보니 오늘 아침 식사에도 완두콩이 딱 4알…….)"
10035160-129 = "(게다가 저번 주에 발견했던 네잎클로버를 오늘 청소 중에 잃어버렸지…….)"
10035160-130 = "(불길해…….)"
10035160-131 = "(불길해불길해불길해불길해불길해!)"
10035160-134 = "나……나는 안 들어간다."
10035160-139 = "네? 그게 무슨 말씀이세요?"
10035160-140 = "그럼 우리끼리만 훈련하라고요?!"
10035160-141 = "애초에 부국장님이 시작하신 훈련이잖아요!"
10035160-143 = "아, 아무튼 못 들어가! 무슨 일이 일어날 줄 알고!"
10035160-144 = "하려면 너희들끼리 해!"
10035160-149 = "어쩌지? 또 징크스 때문에 그러시는 것 같은데."
10035160-150 = "뭘 어째? 우리끼리만 고생할 순 없지."
10035160-155 = "에잇!"
10035160-166 = "뭐, 뭐 하는 거냐 이것들아!"
10035160-168 = "파, 팔다리를 붙잡고 그대로……?!"
10035160-180 = "짜식들, 잡히면 가만 안 둔다!"
10035160-181 = "우왓! 부국장님이 온다! 도망쳐~"
10035160-187 = "부국장님! 여깁니다! 여기!"
10035160-197 = "(공안국의 여름날은 그렇게 흘러간다…….)"
