[translation]
1001805-1 = "부끄럼쟁이의 아르바이트 1"
1001805-2 = "게임개발부 부실"
1001805-3 = "휴우…… 계속 부원들의 신세만 지고 있을 수는 없는데…… #n정말 큰일이네요."
1001805-4 = "[s] \"무슨 걱정이라도 있어?\""
1001805-5 = "아, 선생님."
1001805-6 = "다름이 아니라 게임개발부의 신작 개발을 앞두고 개발비가 부족해서요……."
1001805-7 = "부원들 모두가 개발비를 보태기 위해 아르바이트를 하고 있는데, 저는 사람이 무서워서 일을 알아보러 밖에 나가지도 못하는 처지라……."
1001805-8 = "명색이 게임개발부의 부장인데 힘이 되어 줄 수 없는 게 너무 속상해요."
1001805-9 = "부원들을 도울 수 있는 좋은 방법이 없을까요?"
1001805-10 = "[s] \"내가 아는 아르바이트 자리를 소개해줄까?\""
1001805-11 = "……네? 아, 아, 아르바이트요?!"
1001805-12 = "무리예요! 사람들과 말도 제대로 못 하는데!"
1001805-13 = "……."
1001805-14 = "물론 사람들 앞에 나서는 건…… 무섭지만……"
1001805-15 = "……네. 계속 도망칠 수는 없으니까요."
1001805-16 = "선생님이 소개해주시는 아르바이트라면…… #n아마 괜찮을 거예요!"
1001805-18 = "<엔젤 24>, 키보토스 센트럴점"
1001805-19 = "다음 날, 키보토스 시내 중심가의 <엔젤 24> 편의점 점내."
1001805-21 = "무리예요……!"
1001805-22 = "아르바이트를 하겠다고는 했지만 편의점 점원 같은 접객 업무라는 말은 듣지 못했다고요!"
1001805-23 = "선생님을 믿었는데…… 믿었었는데……!"
1001805-24 = "[s] \"내가 옆에서 계속 같이 도와줄 테니 너무 걱정하지 마.\""
1001805-25 = "저, 정말요? 아르바이트를 하는 동안 계속 곁에 머물러 주실 건가요?"
1001805-26 = "선생님이 도와주신다면 조금은 버틸 수 있을 것 같지만……."
1001805-27 = "으으, 그래도 무서운 손님이 오면 어쩌죠……?"
1001805-30 = "유즈 양, 계산대 앞의 빈 매대에 과자를 진열해 줄래?"
1001805-31 = "네, 네, 넷? 으, 으, 음료수 말씀이신가요?"
1001805-32 = "아니, 음료수가 아니라 과자 말이야. 음료수는 냉장고에 이미 채워놨으니까……"
1001805-33 = "네, 넵! 으, 으, 음료수를 매대에 채워둘게요!"
1001805-36 = "(한숨) 저 아이, 괜찮으려나……."
1001805-38 = "잠시 후."
1001805-39 = "가라아게 도시락 하나 데워서 주세요."
1001805-40 = "저는 이번 달 신간 만화 잡지 한 부 주세요."
1001805-41 = "네, 네!"
1001805-42 = "따뜻하게 데운 만화 잡지와 햄버거 도시락 나왔습니다!"
1001805-43 = "제가 주문한 건 가라아게 도시락인데……"
1001805-44 = "만화 잡지는 데워서 주실 필요는 없는데요……."
1001805-45 = "으, 으앗?! 죄, 죄송합니다! 그, 금방 바꿔드릴게요!"
1001805-46 = "저기, 주문이요—."
1001805-50 = "(으으, 사람들이 너무 많아…… 무서워…… 도망치고 싶어…….)"
1001805-51 = "(하지만 선생님께서 도와주시고 계시는 데다가, 게임개발부 부원들에게 폐를 끼치지 않으려면 여기서 도망쳐서는 안 돼……!)"
1001805-52 = "(조금만…… 조금만 더……!)"
1001805-55 = "자, 잠시만 기다려주세요! 그, 금방 도와드릴게요!"
1001805-57 = "수, 수고하셨습니다……."
1001805-58 = "[s] \"유즈도 수고했어.\""
1001805-59 = "그, 그렇지 않아요……."
1001805-60 = "우우…… 하루 종일 실수만 하고…… 손님들에게 폐만 끼치고…… 저는 역시 아르바이트 같은 건 할 수 없는 외톨이에 못난 아이일 뿐이에요……."
1001805-61 = "[s] \"그렇지 않아. 유즈는 열심히 노력했으니까.\""
1001805-62 = "하지만……."
1001805-65 = "수고 많았어, 유즈 양."
1001805-66 = "이야, 오늘은 평소보다 손님이 많았는데…… 새로운 아르바이트 학생이 와주어서 얼마나 도움이 되었는지 몰라."
1001805-67 = "그, 그게 정말인가요?"
1001805-68 = "물론 실수가 잦기는 했지만, 바로 사과를 하고 대처를 해주었으니까."
1001805-69 = "손님들도 유즈 양의 성실한 모습에 만족한 눈치였어."
1001805-70 = "다행이다…… 저라도 도움이 될 수 있었군요……."
1001805-71 = "그래서 말인데…… 다음 주 주말에도 가게 앞에서 대규모 행사가 예정되어 있거든."
1001805-72 = "그때도 아르바이트를 하러 다시 와 줄래?"
1001805-73 = "……히익! 더는 무리에요!"
