[translation]
10043005-1 = "프롤로그;전통과 역사"
10043005-7 = "야구 팬 여러분. 안녕하십니까? 지금부터 코기 브레이브스와 아비시니안 레이더스의 대결, 함께하시겠습니다."
10043005-8 = "오늘도 이렇게 성황리에 경기장을 찾아 주신 모든 팬 여러분께, 감사의 말씀을 올립니다."
10043005-16 = "곧 경기가 시작됩니다! 함성과 박수로 맞아 주시길 바랍니다!"
10043005-22 = "[ns] \"엄청난 열기네…….\""
10043005-23 = "그럼요! 이 경기야말로 전통을 자랑하는 코기 브레이브스와 아비시니안 레이더스 사이의 시라토리 시리즈……."
10043005-24 = "친선 매치이지만, 그 열기는 웬만한 프로 야구급으로 뜨거운 경기니까요!"
10043005-25 = "우선 코기 브레이브스는, 코기전자의 실업 야구팀이에요."
10043005-26 = "그리고 아비시니안 레이더스는, 카네사키 항구를 거점으로 하는 상인회의 실업 야구팀이고요."
10043005-27 = "처음에는 물품을 공급하는 상인회와, 그걸 납품받아 제품을 만드는 전자 회사 사이의 친선 경기로 시작한 시리즈였지만……."
10043005-28 = "지금은, 어엿한 시라토리구의 명물 시합 중 하나로 인정받았죠!"
10043005-29 = "양 팀이 얼마나 열정적이냐면, 친선 매치임에도 불구하고 사회인 유망주를 서로 가장 먼저 있는 대로 끌어모으려 애쓰기까지 하거든요!"
10043005-30 = "덧붙여서 말씀드리자면, 저는 코기 브레이브스의 팬입니다! 뭔가, 조금, 밀레니엄 야구부와 묘한 동질감이 느껴지기도 해서 말이죠."
10043005-34 = "힘내라, 브레이브스! 오늘도 응원하고 있다고!"
10043005-39 = "야구장을 찾는 것은 저로서는 흔치 않은 일입니다만, 트레이너와 함께라고 생각하니 더욱 각별해지는군요."
10043005-40 = "다만 이 열정을 조금 더 다른 곳에…… 예를 들자면 건강과 활력을 위한 트레이닝에 사용한다면 더욱 좋겠지만요."
10043005-41 = "선배…… 경기장에서까지 트레이닝 이야기인가요……."
10043005-42 = "물론입니다, 레이 양. 뭐든지 체력이 뒷받침되어야 다른 일을 할 수 있는 법입니다."
10043005-43 = "가령 저 야구 선수들도, 우리가 알지 못하는 곳에서 엄청난 단련과 훈련을 반복하고 있겠지요!"
10043005-47 = "음…… 네. 아마도 그럴 거예요."
10043005-48 = "[s] \"어라? 레이의 목소리에 어딘가, 자신이 없는 듯한 기색이?!\""
10043005-52 = "그, 그렇게 들렸나요. 선생님?!"
10043005-53 = "……사실 그런 느낌을 받으셨어도, 어쩔 수 없는 부분이 있을 것 같긴 한데 말이죠……."
10043005-54 = "어째서, 냐고요?"
10043005-58 = "……."
10043005-59 = "혹시 선생님. 이 시라토리 시리즈의 역대 전적에 대해, 알고 계시는가요?"
10043005-60 = "아, 네. 그야 모르시는 게 더 자연스러우시겠지만……."
10043005-67 = "흠? 검색해 보니 정말로 역사가 오래된 경기이긴 한 것 같군요. 그런데 그 결과가……."
10043005-69 = "스, 스미레 선배?! 음…… 아뇨. 어차피 인터넷 조금만 찾으면 나오는 일이고, 먼저 말을 꺼낸 건 저이기도 하고…… 네에."
10043005-70 = "[s] \"전적이 어떻길래?\""
10043005-71 = "189전 189패, 라고 하는군요."
10043005-72 = "[s] \"전패?! 그것도 200전 가까이?!\""
10043005-73 = "그, 그게 말이죠! 사실 결과만 보면 그렇긴 하지만!"
10043005-74 = "뭐라고 해야 하나, 스포츠에서도 물론 결과는 중요하긴 한데요! 참여하는 것 자체에 의의가 있다는 말도 있고!"
10043005-75 = "어쩌다 보니…… 네…… 번번이 그런 결과가, 되어 버리곤 하지만."
10043005-76 = "항상 한 끗 차이로 패배한단 말이죠, 이게! 1점이나 2점 차이로!"
10043005-77 = "될 것 같으면서 안 되고, 안 될 것 같다가도 어떻게든 끈덕지게 따라붙고. 그래서 다음 경기를 기대하게 하고!"
10043005-78 = "그래서 코기 브레이브스의, 팬들 사이에서 불리는 별명은, 추격 코기!"
10043005-79 = "하지만 결국 '추격'한다는 것이로군요, 레이 양."
10043005-83 = "좀! 선배! 그게 사실이긴 한데요! 못 따라잡는 거긴 한데!"
10043005-84 = "……아무튼 말이죠. 그래서 그렇게 번번이 패배하면서도, 다음 경기를 기대하게 만드는 마력이 있다고나 할까……."
10043005-85 = "이번에는 이렇게 됐지만, 다음에는 어쩌면! 기필코! 반드시!"
10043005-89 = "그러니까 오늘도 응원할게! 힘내라! 지지 마!"
10043005-93 = "[ns] \"......야구란, 무엇일까…….\""
10043005-94 = "……아무것도, 아니죠."
10043005-95 = "모든 것이기도 하고요!"
10043005-96 = "그렇다면 역시 보다 많은 트레이닝을……."
10043005-100 = "모든 걸 트레이닝으로 귀결시키지 말자고요!"
10043005-101 = "[s] \"히, 힘내라. 브레이브스……?\""
10043005-105 = "감사합니다, 선생님! 역시 선생님도 숨은 추격 코기의 팬이셨군요?!"
10043005-106 = "아뇨, 제가 보기에도 그건 조금 아닌 것 같습니다만……."
10043005-111 = "네! 지금 카메라에 잡히신 거기 세 명 일행 여러분! 사진 타임입니다. 축하드립니다!"
10043005-115 = "이건 뭔가요?"
10043005-116 = "어? 사진 타임? 여기에서 우리가?"
10043005-117 = "아, 선생님이나 선배는 모르겠군요. 그러니까 일종의 게임 같은 건데……."
10043005-118 = "경기 중간에 무작위로 카메라에 잡힌 관객들은, 서로 가까이 붙어서 포즈를 잡아야 한다는 규칙이에요."
10043005-122 = "화면을 확대해 드리겠으니, 가까이 붙어서 좋은 모습을 보여 주세요!"
10043005-123 = "과연. 야구장에는 이런 문화가 있었군요. 흥미롭습니다. 트레이너."
10043005-124 = "후후, 그러면 사양하지 않고."
10043005-129 = "그러면, 저도……."
10043005-130 = "헤헤……. 잘 부탁드립니다. 선생님."
10043005-144 = "네! 좋은 장면을 연출해 주신 일행분들께 감사드립니다! 그러면 다시 경기로 돌아가도록 하죠!"
10043005-150 = "아, 말씀드리는 순간 아비시니안 레이더스, 안타를 쳤군요. 역시 오늘도 한발 앞서나가는 모양입니다."
10043005-153 = "저, 저것은……?"
10043005-154 = "내가 본 것이 틀리지 않았다면, 샬레의 선생? 그 사람이 어째서 우리 경기에……?"
10043005-155 = "아니……. 아니야. 이것은 어떻게 보면, 하늘이 내려준 기회일 수도 있지."
10043005-160 = "지금 우리에게 당면한 이 문제를, 어떻게든 해 보기 위해서는……!"
