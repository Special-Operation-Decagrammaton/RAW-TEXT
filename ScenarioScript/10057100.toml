[translation]
10057100-1 = "제10화;친구를 찾아서"
10057100-6 = "선생님. 손, 놓으시면 안 됩니다."
10057100-7 = "[s] \"잘 잡고 있어. 안나는 괜찮니?\""
10057100-10 = "네, 잘 잡고 있어요."
10057100-11 = "눈보라 때문에 한 치 앞도 안 보여요……. 선생님, 라나하고 183호로 돌아가주세요. 에리나는 제가 찾아서 데려올게요."
10057100-12 = "딱 잘라서, 거절!"
10057100-15 = "……라나가 거절한다는 말도 할 줄 알았구나."
10057100-16 = "친구는 함께하는 거야. 그러니까, 나도 같이 갈 거야."
10057100-17 = "[s] \"라나, 100점!\""
10057100-18 = "후훗, 100점은 처음 받아봅니다."
10057100-19 = "그렇긴 하겠지. 하하……."
10057100-20 = "그렇지만, 에리나가 지금 어느 방향으로 간지도 모르니…… 어떻게 해야……."
10057100-24 = "안나?"
10057100-25 = "쉿, 잠시만. 소리 좀 들어볼게."
10057100-28 = "……."
10057100-30 = "(콜록, 콜록……)"
10057100-31 = "……들린다. 기침 소리."
10057100-33 = "(콜록, 콜록……)"
10057100-34 = "선생님, 이쪽이에요!! 먼저 갈게요!!"
10057100-39 = "안나, 같이 가!"
10057100-42 = "에리나-!!"
10057100-43 = "대답해줘!! 제발!!!"
10057100-44 = "으앗!!"
10057100-48 = "아야야, 눈밭에 돌부리가……."
10057100-51 = "에리나!!!"
10057100-52 = "……."
10057100-54 = "에리나……."
10057100-55 = "……맞아. 내가 연료를 다 난로에 넣고 없애버렸어."
10057100-56 = "어차피 전차가 완성될 거라고 생각 안 했어. 그야…… 저번에도 보란 듯이 실패해서 여기에 왔으니까."
10057100-57 = "한 번의 실패는 운이 없으면 일어날 수 있다고 생각했었지."
10057100-58 = "그렇지만, 여기 와서도 몇 번이고 실패했어……."
10057100-59 = "어느새, 나에게 실패는 '우연'에서 '필연'이 된 거야."
10057100-60 = "자신 있다고, 할 수 있다고 큰소리치면서 거짓말했지만…… 누구보다 내가 잘 알았어."
10057100-61 = "지금의 나는 '뭘 해도 실패할 거'란 걸. 늘 그랬듯이 말이야."
10057100-63 = "……."
10057100-65 = "그래서, 헛바람 들 필요 없이 당장 오늘만, 내일만 따듯하게 사는 게 더 낫다고 생각했어."
10057100-66 = "연료를 아껴봤자, 어차피 전차가 움직일 리 없으니까."
10057100-69 = "……."
10057100-71 = "다른 사람들이 보는 앞에서 부서지는 전차를 보는 게 무서웠어."
10057100-72 = "지난 일이라서 괜찮을 거라 생각했는데, 문득 떠오르면 등에 땀이 나서 따가워."
10057100-73 = "전차가 완성되면…… 이번에는 붉은겨울 광장이 아니라 키보토스 전체가 보는 앞에서 망신당하게 돼……."
10057100-74 = "다시 전차를 만드는 게 무서웠어. 그런데, 네가 전차대회 포스터를 보고 '전차를 만들자'는 바보 같은 소리를……."
10057100-75 = "그런 말만 안 했으면……."
10057100-78 = "잘 알지도 못하면서!"
10057100-79 = "잘 알지도 못하면서 그렇게나 주절거리고, 맨날 싸우면서도 날 치켜세우고, 날 믿어주고."
10057100-80 = "……그런 거, 좋을 수밖에 없잖아. 과학자들이라면. 아니, 누구라도 당연히 좋잖아."
10057100-81 = "그러면, 절망했던 게 아무렇지도 않았던 것처럼 느껴져서……."
10057100-82 = "괴로웠던 기억은 어디에도 가지 않는데, 나는 도망도 칠 수 없게 된다고!"
10057100-84 = "선생님……."
10057100-85 = "[s1] \"괜찮아, 라나.\"\n[s2] \"친구들을 지켜보자.\""
10057100-89 = "……."
10057100-91 = "우리가 의견이 맞지 않아서, 진척이 느릴 때 몰래 안심했었어."
10057100-92 = "다 괜찮을 거라고 생각했어. '아쉽지만, 다음에 하지 뭐.'라고, 얼버무릴 수 있을 거라 생각했어."
10057100-93 = "새로운 도전 따위 하지 않고, 이미 지나간 자랑거리나 꺼내보면서 지내고 싶었어."
10057100-94 = "……그래야 했는데, 선생님이 오셨어."
10057100-95 = "……정말로 기적이 일어나는 건, 생각 못 했어."
10057100-96 = "……."
10057100-97 = "볼트 하나하나 딱 들어맞을 때마다, 용접이 깔끔하게 붙을 때마다…… 나는 무서웠어."
10057100-98 = "완벽하고 빠르게 현실이 되어가는구나. 결국 망가지고 웃음거리가 될 완벽한 미래가 다가와버리는구나."
10057100-99 = "……라고, 불안했어. 바보같이. 진짜, 바보같이. 바보. 완전 바보, 멍청이."
10057100-100 = "……당연히, 너희와 선생님을 탓하는 게 아니야."
10057100-101 = "오롯이 내 잘못이야. 큰 실패가 무서워서 작은 실패를 바랐던. 니키 안나의 잘못."
10057100-102 = "있잖아, 에리나……."
10057100-107 = "……도망쳐서, 미안해."
10057100-108 = "무서운 걸 무섭다고 말하지 못해서, 미안해."
10057100-109 = "그래서, 모든 걸 혼자 멋대로 망쳐버려서 미안해."
10057100-110 = "전부…… 전부, 미안해……."
10057100-112 = "……."
10057100-113 = "저기, 에리나……."
10057100-118 = "이-잉-!!"
10057100-119 = "에, 에엑?!"
10057100-123 = "바보! 바보오!! 바보오~!!!"
10057100-124 = "너, 진~짜 짜증 나! 콜록, 처음부터 지금까지 계속 최악이야!"
10057100-125 = "알지도 못한다고?! 콜록!"
10057100-126 = "실패는 너 혼자만 해본 줄 알아?!"
10057100-127 = "실패했으면 까짓거 재수 없었네, 하고 넘어가면 되는 거잖아? 허세를 부릴 거면 끝까지 부리란 말야! 왜 자신감이 그렇게 없는 건데?"
10057100-128 = "재능이 있는 너를 자랑해야지, 금속쪼가리 따위는 아무래도 좋은 거잖아!!"
10057100-129 = "그게 이해가 안 돼서 처음부터 싫었고, 안 고친다면 아마 앞으로도 계~속 싫을 거야!"
10057100-130 = "너는……. 틈만 나면 자랑하는 공식 부장이잖아? 아니라고 해도 친구잖아?"
10057100-131 = "그러면 부장답게 당당하고, 친구답게 기운도 차려달란 말야!!"
10057100-135 = "그랬…… 구나……. 나는……."
10057100-139 = "전차 만들자고 했을 때, '그러자'고 대답해서, 엄청 기뻤어."
10057100-140 = "같이 멋지게 성공해서, 지나간 실패에게 '꼴 좋다!'라고 하고 싶었다고!"
10057100-141 = "너도 그렇게 생각할 줄 알았어, 그런데……. 그런데에……. 쿨쩍,"
10057100-142 = "끅, 끄윽……."
10057100-143 = "콜록……. 나는 제일 가까이에서 있었는데도, 전혀 몰랐어……."
10057100-144 = "전차 만드는 게 짐이 될 거라고는 생각도 못 했어……. 부추기고 밀어주면, 그러면 힘이 날 거라고 생각했어……."
10057100-145 = "나는……. 그런 사람이니까……."
10057100-146 = "내, 내가 더…… 미안, 미안해애애애……."
10057100-148 = "흐어어엉-"
10057100-150 = "내가 잘못했어-"
10057100-151 = "나도 잘못했어-"
10057100-152 = "에리나-"
10057100-153 = "흐어엉- 다, 다가오지 마……. 에, 에……. 에엣……."
10057100-155 = "푸헤읏취히이!!!"
10057100-157 = "끄아아악!!! 또 눈에 들어갔어!! 크아악!!!"
10057100-158 = "재채기 나오니까 다가오지 말라고 하려 했다고, 으아앙-"
10057100-165 = "[ns3] \"마침 눈폭풍도 그쳤네…….\"\n[ns4] \"모두들, 괜찮니?\""
10057100-168 = "네에, 선생님. 죄송해요. 멀리까지 오셨는데 고생만 하시고……."
10057100-169 = "라나도, 모두 미안해. 내가 다 망쳤어, 모두 노력했는데."
10057100-170 = "신경 쓰지 마, 다음에 꼭 나가면 되는 거잖아."
10057100-171 = "다음엔 꼭 나가는 거다? 고민 있어도 숨기지 말고, 다음에는 꼭 나가자-"
10057100-172 = "으아앙- 수염과학훈장에 걸고 맹세할게-"
10057100-173 = "또 훈장타령이나 하고, 으아앙-"
10057100-177 = "재채기…… 눈물, 상호작용."
10057100-181 = "라나?"
10057100-182 = "라나, 노력해 줬는데 미안. 돌아가서 쉬자."
10057100-184 = "……."
10057100-185 = "쉰다니?"
10057100-189 = "출전 못 해. 기름이 정말 한 방울도 없어……."
10057100-190 = "만약에 기름이 있어도, 산길을 돌아서 내려가야 하니까 한참 걸릴 거야."
10057100-191 = "지금 출발해도 제시간에 못 간다니까?"
10057100-193 = "……셋, 다섯. 셋, 둘……."
10057100-194 = "강아지호가 몇 톤이지? 연료 무게는 빼고."
10057100-196 = "응? 그러니까 지금 상태에서는……. 10.1톤 정도야."
10057100-198 = "포의 포구초속하고 발사 시 운동에너지는?"
10057100-200 = "포구초속은 초당 680미터에, 포탄은 6.1kg이니까. 1.53 메가줄이네."
10057100-201 = "근데 이건 왜? 그 나뭇가지는 뭐야?"
10057100-203 = "배터리 필요 없는 계산기."
10057100-206 = "……음. 역시 되네. 충분해."
10057100-210 = "전원, 승차!"
