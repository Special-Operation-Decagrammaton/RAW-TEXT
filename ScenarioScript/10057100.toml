[translation]
10057100-1 = "第10話;友達を捜しに"
10057100-6 = "先生。手、離さないでください。"
10057100-7 = "[s] \"ちゃんと握ってるよ。アンナは大丈夫？\""
10057100-10 = "ええ。ちゃんと握っています。"
10057100-11 = "足元も見えないほど、吹雪が……。#n先生、ラナと一緒に183号に戻ってください。エリナは私が連れて帰ります。"
10057100-12 = "断固、拒否します！"
10057100-15 = "……ラナが「拒否する」だなんて、初めて聞いた。"
10057100-16 = "友達はいつも一緒。だから、私も行く。"
10057100-17 = "[s] \"ラナ、100点！\""
10057100-18 = "ふふっ、初めて100点をもらいました。"
10057100-19 = "そ、そうね。あはは……。"
10057100-20 = "だけど、今エリナがどの方向にいるのかも分からないし……どうしたら……。"
10057100-24 = "アンナ？"
10057100-25 = "しーっ。ちょっと聞いて。"
10057100-28 = "……。"
10057100-30 = "（げほっ……）"
10057100-31 = "……誰かが咳してる。"
10057100-33 = "（げほっ、ごほっ……）"
10057100-34 = "先生、こっちです！先に行きますね！！"
10057100-39 = "アンナ、一緒に行こう！"
10057100-42 = "エリナー！！"
10057100-43 = "返事して！！お願い！！！"
10057100-44 = "うわっ！！"
10057100-48 = "あいたたた、石が……。"
10057100-51 = "エリナ！！！"
10057100-52 = "……。"
10057100-54 = "エリナ……。"
10057100-55 = "……燃料は、わざと使い切ったの。"
10057100-56 = "どうせ完成なんてするはずないって決めつけてた。#nだって……私は大失敗して、ここに来たんだから。"
10057100-57 = "最初は……失敗するのは運が悪いからだと思ってた。"
10057100-58 = "それなのに、ここに来ても失敗ばかり……。"
10057100-59 = "いつしか、私にとって失敗は「偶然」から「必然」になった。"
10057100-60 = "自信がある、何でもできるって大口叩いてたけど……自分が一番よく分かってた。"
10057100-61 = "今の私は「何をしても失敗する」って。"
10057100-63 = "……。"
10057100-65 = "だから無駄な期待はせず、ただ毎日温かく過ごすほうがいいと思ったの。"
10057100-66 = "燃料を節約したって、どうせ戦車が動くはずないんだから。"
10057100-69 = "……。"
10057100-71 = "みんなの目の前で壊れる戦車を見るのが怖かった。"
10057100-72 = "過去のことだから大丈夫って考えるようにしてたけど、ふと思い出すと体が震えるの。"
10057100-73 = "戦車が完成したら……今度はレッドウィンターの広場じゃなくて、#nキヴォトス全体が見ている前で恥をかくことになる……。"
10057100-74 = "また戦車を作ることが怖かった。#nエリナがポスターを見て「戦車を作ろう」なんて……。"
10057100-75 = "あんなこと言わなければ……。"
10057100-78 = "何も知らないくせに！"
10057100-79 = "何も知らないくせに……毎日喧嘩しても、私を信じてくれて。"
10057100-80 = "……そんなの、嬉しいに決まってるじゃない。#n科学者なら……いえ、誰だってそう。"
10057100-81 = "絶望してたこと全部、何でもないように思えてきて……。"
10057100-82 = "辛かった記憶は、消えないのに……いつの間にか、逃げることすらできなくなってた！"
10057100-84 = "先生……。"
10057100-85 = "[s1] \"大丈夫だよ、ラナ。\"\n[s2] \"もう少し見守ろう。\""
10057100-89 = "……。"
10057100-91 = "意見が合わなくて作業が進まなかった時は、内心ほっとしてた。"
10057100-92 = "「今回は残念だったけど、次頑張ろう」って言って、はぐらかせるから。"
10057100-93 = "新しい挑戦なんてしないで、昔の自慢話だけで過ごしたかったの。"
10057100-94 = "……そうしたら先生が来た。"
10057100-95 = "……本当に奇跡が起きるなんて、思ってなかった。"
10057100-96 = "……。"
10057100-97 = "ボルトが1つはまるたび……溶接がきれいにくっつくたび……私は怖かった。"
10057100-98 = "現実が……戦車が壊れて笑いものになる未来が、確実に近づいているって――"
10057100-99 = "不安だった。自分でも呆れちゃうくらいに……本当に、最悪。"
10057100-100 = "……もちろん、みんなや先生のせいじゃない。"
10057100-101 = "大きな失敗を怖がって、小さなミスをしてしまった……仁木アンナが悪いの。"
10057100-102 = "ねえ、エリナ……。"
10057100-107 = "……逃げて、ごめん。"
10057100-108 = "正直に怖いって言えなくて、ごめん。"
10057100-109 = "それで全てを台無しにして、ごめん。"
10057100-110 = "全部……全部、ごめん……。"
10057100-112 = "……。"
10057100-113 = "あの、エリナ……。"
10057100-118 = "びえええーん！！！"
10057100-119 = "え、ええっ！？"
10057100-123 = "バカッ！バカぁ！！バカぁ～！！！"
10057100-124 = "アンナって、ほんっとイラつく！げほっ、初めて会ったときからずっとサイアク～！"
10057100-125 = "何も知らないって！？ごほっ！"
10057100-126 = "失敗したのは、自分だけだって思ってるの！？"
10057100-127 = "失敗したら「運が悪かった」ってテキトーに流せばいいじゃん！#n威張るなら、最後まで威張り通してよ！なんで自信を持たないの！？"
10057100-128 = "アンナが誇るべきなのは自分自身でしょ！？ちっぽけな勲章なんてどうでもいい！！"
10057100-129 = "そこが意味分かんなくて、はじめっからイヤだった！#n直さないんなら、これからもず～っとイヤ！"
10057100-130 = "アンナは……隙あらば自慢する学級委員長で、友達でしょ？#n否定したって、友達なのは変わらないからね。"
10057100-131 = "学級委員長だから堂々として欲しいし、友達だから元気出して欲しいの！"
10057100-135 = "そう、だったんだ……なのに、私は……。"
10057100-139 = "戦車を作ろうって誘った時……「やろう」って言ってくれて、すっごく嬉しかった。"
10057100-140 = "一緒にかっこよく成功して、過去の失敗に「ざまあみろ！」って言いたかったんだよ！"
10057100-141 = "アンナもおんなじだと思ってた！なのに……それなのに……！！ズルズル。"
10057100-142 = "うっ、ううっ……。"
10057100-143 = "ごほっ……。私はアンナの一番近くにいたのに、全然分からなかった……。"
10057100-144 = "戦車作りを重荷に感じてたなんて、思いもしなかった……。#n煽れば、ムキになってやる気が出るって……。"
10057100-145 = "私が……そういう人間だから……。"
10057100-146 = "わ、私こそ……ごめん、ごめんねえええ……。"
10057100-148 = "うわあああああん！！！"
10057100-150 = "ごめんねえええ！！"
10057100-151 = "私もごめえええん！！"
10057100-152 = "エリナー……。"
10057100-153 = "うわあああん……こ、来ないで……へっ、へっ……へえっ――"
10057100-155 = "ぶえっくしょん！！！"
10057100-157 = "もう！！また目に入ったじゃないの！"
10057100-158 = "くしゃみが出るから来ないでって言ったのにぃ～！うえ～ん！"
10057100-165 = "[ns3] \"ちょうど吹雪も収まったね……。\"\n[ns4] \"みんな、大丈夫？\""
10057100-168 = "ええ、先生。すみません。遠くまで来ていただいたのに、ご迷惑ばかり……。"
10057100-169 = "ラナもごめんね。みんなで頑張ったのに、私が全部台無しにしちゃった。"
10057100-170 = "気にしなくていいよ。また出ればいいんだし。"
10057100-171 = "これからは悩みがあったら隠さず話すこと！そして、次は絶対みんなで出場するよ！"
10057100-172 = "うわ～ん！第一級髭勲章をかけて誓います！"
10057100-173 = "また勲章、勲章って！うえ～ん！"
10057100-177 = "くしゃみ……なみだ……相互作用。"
10057100-181 = "ラナ？"
10057100-182 = "頑張ってくれたのにごめんね。戻って休もう。"
10057100-184 = "……。"
10057100-185 = "休まないよ？"
10057100-189 = "ラナ、もう出場はできないの。燃料が一滴も残ってないから……。"
10057100-190 = "もしあっても、山道を戻ってまた下ると時間がかかるし。"
10057100-191 = "今からじゃ間に合わないって。"
10057100-193 = "……3、5。3、1……。"
10057100-194 = "子犬号は何トン？燃料分は抜いて。"
10057100-196 = "えっと、今の状態だと……10.1トンぐらい。"
10057100-198 = "初速と発射時の運動エネルギーは？"
10057100-200 = "初速は秒速680メートル、砲弾は6.1キロだから約1.53メガジュール。"
10057100-201 = "それがどうしたの？その枝はなに？"
10057100-203 = "バッテリー不要の電卓。"
10057100-206 = "……ふむ。やっぱり大丈夫。"
10057100-210 = "全員、乗車！"
