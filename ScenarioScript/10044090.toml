10044090-112 = "네, 네에. 바로 그거예요……!"
10044090-113 = "어차피 지금 선택할 수 있는 수단도 딱히 없고, 그 방법이면 화, 확실히 멈추긴 멈출 거예요."
10044090-114 = "열차는 엉망이 되고…… 선로도 갈려 나갈 테고…… 원상복구에 비용 꽤나 들겠지만……!!"
10044090-115 = "지, 지금은 그 방법뿐이에요……!"
10044090-116 = "진짜 미친 소리 같네."
10044090-120 = "좋아! 해보자고!!"
