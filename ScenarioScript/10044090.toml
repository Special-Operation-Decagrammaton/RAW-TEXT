[translation]
10044090-1 = "제9화;브레이크? 그게 뭔가요"
10044090-5 = "아오바, 뭔가 방법 없어?"
10044090-7 = "예, 예?! 저한테 물으셔도……"
10044090-8 = "엔지니어잖아- 우리는 운행만 할 줄 알고 기계는 잘 몰라-"
10044090-9 = "주, 중요할 때 쓸모 없……"
10044090-10 = "아앗, 이게 아니라……! 그치만 저도 이런 상황에서는 딱히……!"
10044090-11 = "제동 레버가 지금 완전히 망가졌다구요…… 비상 장치까지 먹통이에요."
10044090-12 = "아마 아까 전투 때문에 민감한 부분이 파괴된 것 같은데…… 하아……"
10044090-13 = "안- 돼-?"
10044090-14 = "이대로라면, 멈추지 않고 계속해서 질주하겠지……"
10044090-15 = "화물 배송이고 뭐고, 한참 먼 종점까지 가버릴 테고."
10044090-16 = "그러면 임무 완전 실패!! 고생한 보람도 없이 망하는 거지! 파햐햐!!"
10044090-17 = "전원- 징계 확정-"
10044090-19 = "그, 그 생고생을 하면서 여기까지 왔는데……"
10044090-20 = "결말이 이럴 줄 알았으면 무슨 짓을 해서라도 이 임무 안 맡았을 텐데……"
10044090-21 = "으으……!! 간부님들이랑 엮여서 좋을 일이 없는데도!! 멍청한 나! 과거의 나!"
10044090-22 = "과거로 돌아간다면 몽키스패너로 내 머리를 때려서라도 못 가게 할 텐데!!"
10044090-23 = "왜, 왠지 일이 좀 해결되나 했더니만, 역시 기대하면 안 됐던 거예요……"
10044090-24 = "그래도 그렇지…… 이렇게 마지막까지 와서 이러는 게 어딨어……"
10044090-25 = "[ns1] \"진정하고, 해결 방법을 찾아보자.\"\n[ns2] \"아직 우리가 생각해 내지 못한 게 있을 거야.\""
10044090-28 = "선생님- 주변 건물에 거미줄을 쏴서 강제로 멈추면-"
10044090-29 = "[s] \"미안하지만 그런 거 안 나오거든……\""
10044090-30 = "그럼- 철로 아래로 내려가서 몸으로 멈추는 건-?"
10044090-31 = "[s] \"나를 초인으로 봐주는 건 고맙지만, 물리적으로 힘들어……\""
10044090-32 = "우우…… 선생님 가냘파…… 지켜줘야 해……"
10044090-33 = "그래요…… 어떻게든 방법을 찾아봐야지……"
10044090-34 = "지금 우리가 뭘 갖고 있는지부터 파악해 보죠."
10044090-35 = "나 초코바 하나 있어. 아껴 먹으려고 했는데."
10044090-36 = "필요 없으니까 넣어둬요……"
10044090-37 = "일단 건드릴 수도 없는 화물이랑 공구 몇 가지……"
10044090-38 = "쓸모도 없는 총…… 실탄……"
10044090-39 = "아까 전투에서 굴러들어 온 폭탄들……"
