10044090-174 = "네에…… 다행히요……"
10044090-175 = "완~전! 아주 멀쩡해!"
10044090-176 = "히카리, 선생님 지켰어- 칭찬 칭찬해-"
10044090-179 = "이, 이거 어떡하지……"
10044090-180 = "저기, 모두 괜찮으신가요……?"
10044090-181 = "파햐햐, 정시 도착! 안전 배송! 완벽하지!"
10044090-182 = "안전 배송……?"
10044090-183 = "……열차는 부서지고…… 선로도 엉망진창이지만……"
10044090-184 = "예에…… 도착은 했네요…… 하하……"
10044090-185 = "어, 어쨌든 화물 인계 증명서를 가져올 테니 잠시만 기다려주세요."
10044090-190 = "그, 그것만 하면 우리 일은 끝나는 거죠……?"
10044090-191 = "응- 완전 대성공-"
10044090-192 = "대, 대성공은 무슨…… 이렇게 사고를 쳤는데 수습 생각은 안 하시나요……"
10044090-193 = "하아, 돌아가서 얼마나 깨질지 벌써 걱정되네요. 인생은 왜 항상 이런 걸까……"
10044090-195 = "크핫핫! 근무하시느라 고생 많으십니다!!"
10044090-196 = "뭐야?"
10044090-200 = "도착지에서 기다리고 있으면 때맞춰 올 줄 알았지."
10044090-201 = "너희 하이랜더 녀석들은 시간 맞추기를 좋아하니까 말야!"
10044090-202 = "엄청 쌈빡하게 들어오던데!!"
10044090-203 = "그러게! 살짝 무서울 정도였어~"
10044090-204 = "조용! 어쨌든 우리를 잊었다고는 못 하겠지?"
10044090-209 = "우리 팬- 맞지-?"
10044090-210 = "누가 팬이라는 거야?! 우리는 전국 트랜스포터 연맹, 줄여서 부릉부릉질주연합이다!!"
10044090-212 = "뭐, 뭘 어떻게 줄여야 그런 이름이 되는 건가요……?"
10044090-213 = "키보토스의 배달, 배송 업계를 꽉 움켜쥐고 유통계의 거물이 될 예정이시다 이거야!"
10044090-214 = "크으, 이 원대한 야망! 소속감이 솟아오르는구나!"
10044090-216 = "그게 뭐 어떻다는 거야? 응원해달라고?"
10044090-217 = "아니! 그 첫걸음부터 꼬였다고!"
10044090-218 = "바로 네 녀석들 때문에! 너희들이 운송한 그 화물!!"
10044090-219 = "무, 무슨 소리예요?"
10044090-220 = "그건 원래 우리 일감이었으니까!"
10044090-221 = "하지만 난폭 운전이 걱정된다면서 너희 하이랜더에게 넘어가 버렸지!"
10044090-222 = "다, 당연한 거 아니에요……?"
10044090-223 = "누가 귀중품 운송을 폭주족 라이더한테 맡기고 싶어 하겠어요……!"
10044090-225 = "뭐어? 우리를 우습게 보는 거야?"
10044090-231 = "피자도 엉망진창으로 배달해 놓고 말야. 화물이든 뭐든 신뢰가 가겠냐구~"
10044090-232 = "에잇! 시끄러워! 어쨌든 저 화물은 우리가 가져간다!!"
10044090-234 = "그리고 의뢰인에게 부릉부릉질주연합의 이름으로 운송 완료 사인을 받아낸다면……!"
10044090-235 = "그 화물의 최종 운송자는 바로 우리가 되는 것이다!!"
10044090-236 = "저게 대체 뭔 소리예요…… 무슨 억지를 부리고 있는 건지, 정말……"
10044090-237 = "선생님- 숨겨둔 힘 보여줘-"
10044090-238 = "여길 누르면 변신한다거나-? 이쪽을 누르면 데빌 파워 같은 거 나올지도-"
10044090-239 = "[s5] \"그런 게 가능했다면 멋졌겠지만……\"\n[s6] \"간지러워……!\""
10044090-243 = "아앙? 이 상황에서 여유를 부리는 거냐?"
10044090-244 = "쌓아온 노력이 눈앞에서 물거품이 되는 기분-"
10044090-246 = "너희들도 맛보게 해주지!!"
