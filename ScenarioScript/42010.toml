[translation]
42010-1 = "제1화;여우가 꾸는 꿈"
42010-14 = "D.U. 교외. 카이저 인더스트리 제2 탄약공장 앞"
42010-17 = "(……2년전.)"
42010-18 = "안녕하세요, 시청자 여러분! 키보토스에서 가장 빠르고 정확한 뉴스를 전해드리는 크로노스 학원 보도부입니다!"
42010-19 = "저희는 지금 카이저 인더스트리의 제2 탄약공장 앞에 나와있는데요."
42010-20 = "카이저 인더스트리의 전체 탄약 중 3할 가까이를 생산하고 있는 이 조병창에 최근 수상한 소문 하나가 퍼지고 있다고 합니다."
42010-21 = "그 소문은 바로…… 이 제2 탄약공장에서 총학생회 조례에 위배되는 대량파괴무기를 개발하고 있다는 의혹인데요!"
42010-22 = "다만 카이저 인더스트리 측이 이 사실을 강력하게 부인하고 있는 데다가, 이 사실을 입증할 수 있는 뾰족한 증거 또한 나오지 않은 상황이라. 의혹만이 계속되고 있습니다."
42010-23 = "발키리 경찰학교의 수사가 지지부진한 가운데, 또 다른 정보통에 의하면 이번에 총학생회장이 새롭게 조직한 특수조사팀을 파견했다는 소문도—"
42010-27 = "앗, 말씀드리는 순간 거대한 폭발이……!"
42010-28 = "무슨 일일까요? 설마 소문의 그 대량파괴무기가 폭발하기라도 한 걸까요?!"
42010-30 = "콜록, 콜록……"
42010-31 = "뭐 하는 거야, 오토기! 출구에 부비트랩이 있다는 이야기는 못 들었다고!"
42010-32 = "아. 그거 방금 말하려고 했는데."
42010-33 = "나가기 전에 말해줬어야지!"
42010-34 = "쿠루미 쨩은 너무 의욕이 앞선다니까……."
42010-35 = "그래도 작전이 끝난 뒤였고. 크게 다친 사람도 없어서 다행이야."
42010-37 = "방금 폭발과 함께 탄약 공장에서 한 무리의 무장한 학생들이 나타났습니다!"
42010-38 = "저들이 소문의 그 총학생회장이 조직한 특수조사팀일까요?"
42010-39 = "저, 무슨 일이 일어난 건가요? 한 말씀 부탁드리겠습니다!"
42010-41 = "아하하…… 어느새 기자들이 잔뜩 몰려왔네요……."
42010-42 = "……어쩔 수 없지. 이참에 SRT의 소개를 정식으로 하는 것도 나쁘지 않고."
42010-43 = "SRT라면…… 혹시 그 총학생회장이 조직했다는 소문의 특수부대가 여러분인가요?"
42010-45 = "키보토스의 시민 여러분께는 처음으로 인사드리는군요."
42010-46 = "SRT 특수학원, FOX 소대의 소대장. 시치도 유키노입니다."
42010-47 = "저희 SRT 특수학원은 총학생회장의 사전 활동 허가를 받은 특수 부대로, 발키리 경찰학교나 각 자치구의 선도위원들이 대응하기 어려운 D.U.의 범죄를 해결하기 위해 조직되었습니다."
42010-48 = "D.U.의 범죄를 해결한다면…… 앞으로는 SRT 특수학원이 발키리 경찰학교를 대체하게 되는 건가요?"
42010-49 = "……그렇지는 않습니다. 저희는 어디까지나 발키리 경찰학교의 손이 닿지 않는 사각지대의 범죄자나 이번처럼 선제 조치가 필요한 사건에 대응하는 팀일 뿐이니까요."
42010-51 = "그보다 지금 이곳, 제2 탄약공장에서는 무슨 일이 일어나고 있는 건가요?"
42010-52 = "이곳에 그 소문의 대량파괴무기가 있다는 게 사실인가요?"
42010-54 = "으음……"
42010-58 = "뭐…… 이번 사건에 대해서는 별도의 엠바고가 걸리지 않았으니 괜찮겠죠."
42010-59 = "수일 전, 저희는 익명의 정보원으로부터 이곳 카이저 인더스트리 제2 탄약공장에 총학생회 조례에 위배되는 강력한 폭탄이 보관되고 있다는 증거를 입수했습니다."
42010-60 = "카이저 인더스트리는 지난해 발표한 <A.N.T.I.O.C.H.>— 구형 열압력 수류탄 개량 사업으로 알려진 개발 프로젝트를 통해 탄도 미사일용 열압력 탄두를 제작하였고, 이곳에 그 시제품을 보관하고 있었습니다."
42010-62 = "뭐, 그 폭탄은 우리가 방금 무력화시켰으니 이제는 안심해도 좋아."
42010-63 = "탄도 미사일용의 열압력 탄두라면…… 위력이 얼마나 되는 건가요?"
42010-64 = "양산되지 않은 시제품이라 위력을 확신하긴 어렵습니다만……"
42010-66 = "탄두의 크기와 기존 연구 데이터를 기반으로 추측했을 때, <A.N.T.I.O.C.H> 탄두의 폭발이 영향을 끼치는 유효 반경은 수 km에 달할 것으로 추측됩니다."
42010-67 = "그, 그 정도 위력의 폭탄이라면 소대 규모의 부대가 상대하기엔 너무 위험한 물건 아닌가요?"
42010-68 = "제대로 방호복을 갖춰 입은 공병 중대를 투입한다든가……"
42010-70 = "이 정도로 위험한 폭탄이라면 보병 병력을 얼마나 투입한다 하더라도 의미가 없습니다."
42010-71 = "네. 오히려 그렇기 때문에 이런 작전에서는 저희 SRT가 나서야 하는 거죠!"
42010-72 = "저희 SRT의 소대는 소수 정예의 팀으로 구성되어 있기 때문에, 이번 작전처럼 상대가 알아차리기 전에 목표를 확보하거나 요인을 제압하는 일에 특화되어 있습니다."
42010-73 = "이번 작전만 하더라도 건물에 진입한 뒤 탄두를 확보하는 데까지 3분도 걸리지 않았으니까요."
42010-74 = "……2분 45초."
42010-75 = "중간에 갑작스러운 교전만 없었더라면 15초는 더 단축할 수 있었을 거야."
42010-76 = "아~ 쿠루미가 실수로 포인트 델타에서 다가오던 경비병에게 섬광탄이 아니라 연막탄을 던졌을 때 말이지?"
42010-77 = "실수가 아니거든? 그 녀석, 섬광 방호 효과가 있는 특수 바이저를 쓰고 있었단 말이야!"
42010-78 = "근거리에서 더블탭 사격을 하지 않았으면 역으로 이쪽이 당했을걸."
42010-79 = "그보다 오토기. 어째서 내가 돌입하기 전에 그 경비병을 처치하지 못한 거야?"
42010-80 = "아, 그게…… 장전해 둔 탄약의 숫자를 세는 걸 깜박하는 바람에……"
42010-81 = "적의 숫자를 가늠하기 어려운 상황에서 저격수가 흔히 저지르는 사소하고 앙증맞은 실수라고 할까~"
42010-82 = "작전 중의 실수에 그런 귀여운 형용사를 붙이지 마!"
42010-83 = "오토기 쨩, 쿠루미 쨩…… 기자 여러분이 보고 있으니 카메라 앞에서의 싸움은 조금……"
42010-85 = "그 말대로 이번 작전은 소수의 인원으로 신속하게 진행되었기 때문에 범인을 놓치는 일 없이 사건의 진상을 파악할 수 있었습니다."
42010-86 = "이번 작전 중 탄약공장 내에 보관된 기밀 서류에서 카이저 그룹의 고위 임원들은 물론이고, 방위실 일부 임원들의 이름도 확인할 수 있었습니다만……"
42010-87 = "이 임원들이 <A.N.T.I.O.C.H.> 프로젝트의 발족을 앞두고 금품을 수수하여 탄약공장의 안전 보고서를 허위로 기재했다는 사실이 발견되었습니다."
42010-91 = "방위실이라면…… 키보토스의 치안을 책임지는 총학생회의 기관이 아닌가요?"
42010-92 = "결과적으로는 총학생회의 치안에 허점이 있다는 것이 밝혀진 셈인데, 총학생회장의 지시를 받아 움직이는 SRT가 이런 정보를 공개해도 괜찮은 건가요?"
42010-93 = "……문제없습니다."
42010-94 = "정의란, 진리에 들어맞는 올바른 도리."
42010-96 = "SRT의 정의는, 그 어떤 상황에서도 변하지 않습니다."
42010-107 = "………."
42010-108 = "아, 유키노 쨩. 일어났구나."
42010-110 = "……지금 시각은?"
42010-111 = "키보토스 표준시로…… 0315시."
42010-112 = "말번초가 시작할 때까지는 아직 시간이 좀 남았는데. 더 자고 오지 그래?"
42010-113 = "괜찮아. 수면은 충분히 취했어."
42010-116 = "……뭔가 좋은 꿈을 꾼 모양이네."
42010-117 = "왜 그렇게 생각해?"
42010-118 = "자는 동안 미소를 짓고 있더라고."
42010-119 = "……아니. 악몽이었어."
42010-120 = "온실 속에 머무르고 있었을 때 꾸었던 달콤한 악몽."
42010-121 = "……그렇구나."
42010-124 = "FOX 4. 보고."
42010-125 = "여기는 FOX 4. 총학생회에는 현재 특이 동향 없음."
42010-126 = "지난번 하늘에서 거대한 탑이 떨어진 이후로 총학생회는 계속해서 혼란의 연속이야."
42010-127 = "특히 총학생회장 대행인 린 행정관은 가장 혼란스러운 시기에 자리를 비운 건 때문에 총학생회 내에서도 계속 비난을 받고 있어."
42010-128 = "때문에 그녀가 제시한 D.U. 종합 복구 정책도 쉽게 가결되지 않고 난항을 거듭하고 있지."
42010-129 = "뭐…… 물론 우리가 SRT 학원 폐쇄 직전 생텀타워를 공격했을 때, 린 행정관의 지지파를 중점적으로 저격한 탓에 그녀를 비호해 줄 만한 사람들이 별로 남아있지 않다는 점도 한몫했겠지만."
42010-130 = "……행정위원회 주요 부서의 현황은?"
42010-131 = "음, 다른 쪽은 전과 동일하고…… 문화실과 보건실은 지난 습격 때 다친 실장들이 복귀하지 못해서 차장들이 업무를 대행하는 중이야."
42010-132 = "업무에는 지장이 없겠지만, 행정위원회에서의 발언권은 기대하기 어려울 거야."
42010-133 = "다행이네. 계속 주시해 줘."
42010-137 = "저…… 소대장, 아니 FOX 1."
42010-138 = "그런데 혹시 말이야……"
42010-139 = "우리가 그때 습격했던 실장들의 상태가 호전되어서, 행정위원회에 복귀하면 어쩌지?"
42010-140 = "그렇게 되면…… 카야 실장이 꽤나 곤란해하겠지……?"
42010-141 = "비상 상황에 대비한 긴급 프로토콜은 전에 전파했을 텐데."
42010-142 = "'행정위원회를 구성하는 임원 중 나나가미 행정관을 지지하는 임원의 숫자는 언제나 시라누이 실장을 지지하는 임원의 숫자보다 클 수 없다.'"
42010-143 = "나나가미 행정관을 지지하는 세력이 행정위원회에 복귀하려는 것처럼 보이면 '움직일 수 없을 정도'로만 조치해."
42010-147 = "……FOX 4, 확인."
42010-152 = "FOX 3. 보고."
42010-153 = "여기는 FOX 3. 예정대로 키타야마 구의 철도 차량 기지에 EMP 폭탄을 설치해서 운행 관리 시스템을 무력화. 주요 전자 설비의 사보타주도 완료했어."
42010-154 = "EMP 폭탄은 기폭 후 바로 회수했으니, 기술자들도 당분간은 고장의 원인을 찾기 어려울 거야."
42010-155 = "여론 동향은?"
42010-156 = "우선 정확한 사고 원인이 발표되고 있지 않으니, 대부분의 시민들은 총학생회의 실수로 여기고 있는 것 같아."
42010-157 = "지금 올라오는 SNS의 게시글만 확인해 봐도 교통실장과 총학생회장 대행을 맡고 있는 린 행정관을 비난하는 여론만 잔뜩 올라오고 있어. 이야, 이거 꽤 오래 불타겠는데……"
42010-158 = "확인. FOX 3는 이어서 바로 HQ로 복귀해."
42010-162 = "저기 그런데…… 이거 정말로 괜찮은 거야……?"
42010-163 = "아까도 병원에 가려고 했는데 전철이 끊겨서 곤란해하는 시민과 마주쳤는데, 이대로 작전을 수행하면—"
42010-164 = "그 시민이 작전 진행에 무슨 방해가 되었나?"
42010-168 = "……아니야, 문제없어. FOX 3, 양호."
42010-175 = "유키노. 정말…… 우리는 이대로 괜찮은 거야?"
42010-176 = "……뭐가?"
42010-177 = "아무리 SRT 학원의 부활을 위해서라지만, 시민들에게 이렇게 직접적인 위해를 끼치는 건……"
42010-181 = "……정의롭지 않잖아."
42010-182 = "작전을 진행하는 데 있어 그런 질문은 무가치해."
42010-183 = "우리는 명령에 따라 작전을 수행하는 무기. 날 끝을 어디로 향할지 결정하는 것은 무기 자신이 아닌, 자루를 쥔 사람의 몫이다."
42010-184 = "날 끝이 어디를 향하고 있는지 인지하고 고민하는 무기는 무기로서의 가치가 없어."
42010-185 = "무엇이 옳고 그른지는…… 책임을 질 수 있는 사람만이 판단하는 거야."
42010-186 = "………."
42010-187 = "마음에 걸린다면 지금이라도 포기해도 돼. 나는…… FOX 소대는 작전을 속행할 테니까."
42010-192 = "……FOX 2, 확인했습니다."
42010-196 = "그럼 이제 남은 일은……"
42010-197 = "RABBIT 소대의 처리뿐인가."
42010-198 = "RABBIT 소대?"
42010-199 = "후배들 이야기야?"
42010-200 = "……FOX 3, FOX 4. 방금은 호출하지 않았는데."
42010-202 = "미안. 갑자기 재미있는 이야기가 들려서……"
42010-203 = "후배들을 만나러 가는 거라면 우리도 같이 가고 싶은데……"
42010-204 = "하아……"
42010-206 = "뭐, 급한 일도 다 끝났으니 오랜만에 소대원이 함께 움직이는 것도 괜찮지 않을까?"
42010-207 = "FOX 3의 작전도 끝났고, FOX 4도 D-Day 이후에는 움직일 필요가 없을 테니……"
42010-208 = "그러고 보니 RABBIT 소대는 신고식도 안 했었잖아?"
42010-209 = "신입이 들어오면 호되게 골려 주는 게 SRT의 전통이지."
