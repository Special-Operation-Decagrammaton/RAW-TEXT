[translation]
10009040-1 = "제4화;네 번째 습격!"
10009040-2 = "역시 강하게 밀고 들어가기만 하는 배드캅 전략은 한계가 있는 것 같아."
10009040-3 = "그럼 여기에선 분위기를 전환해서, 굿캅 전략으로 가자!"
10009040-4 = "좋았어!"
10009040-10 = "흠흠. 와카모. 아까 난리를 피운 것 때문에 우리가 너무 심한 소리를 한 거 같아서 말이야."
10009040-11 = "사과도 할 겸 간식으로 발렌타인 데이 축제에서 파는 마카롱을 가져왔다."
10009040-12 = "이걸 먹고 차분하게 서로의 응어리를 대화로 풀었으면 하는데, 그러니 얌전히……."
10009040-16 = "응?"
10009040-21 = "터, 텅 비었잖아?! 이, 이 녀석 어디로 튄 거야?!"
10009040-24 = "(느긋하게 세나와 함께 거리를 순찰을……)"
10009040-25 = "[s] \"잠깐, 뭔가 낌새가 이상해.\""
10009040-26 = "……예?"
10009040-27 = "[s] \"뭔가, 이 상황. 전에 어디서 본 듯한 데자뷔가…….\""
10009040-35 = "선생님!"
10009040-36 = "[s] \"네, 역시 그렇겠죠!\""
10009040-42 = "조금만 더, 네에, 조금만 더 이 손을 뻗으면 당신을 제 손으로……!"
