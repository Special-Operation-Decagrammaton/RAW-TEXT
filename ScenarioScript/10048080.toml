[translation]
10048080-1 = "제8화;진위의 교차"
10048080-2 = "와일드헌트 공터"
10048080-5 = "자애의 괴도……!"
10048080-6 = "어떻게 우리를……?!"
10048080-7 = "제가 설치한 적 없는 함정들이 수장고 주위에 수두룩하고……."
10048080-8 = "제가 사용하지 않는 기종의 연막탄들이 연달아 터지고……."
10048080-9 = "거기다 이 모든 함정이, 사감대의 동선을 세심하게 고려하여 설치되어 있더군요."
10048080-10 = "……저를 돕는 외부 세력의 존재를 알아채기에, 이 정도면 충분했죠."
10048080-11 = "그러니 감사하다는 말씀을 전하는 것이 순서이겠군요."
10048080-12 = "여러분들 덕에 저의 작업이 한결 더 수월해졌으니까요."
10048080-13 = "그, 그런가요……."
10048080-14 = "도, 도움이 되셨다니 다행이네요."
10048080-15 = "(말하는 것을 보니 그림을 훔치는 것은 성공한 것 같은데…….)"
10048080-16 = "그럼 저희는 이, 이만……."
10048080-17 = "하나 대가 없는 호의만큼 위험한 것은 없지요."
10048080-18 = "호의의 이면에 어떤 의도가 도사리고 있을지 모르니까요."
10048080-19 = "말씀해 주시죠, 여러분."
10048080-20 = "대체 어떤 이유로 저에게 도움을 베푸신 것일까요?"
10048080-21 = "그저 호의였을 뿐입니다."
10048080-22 = "호의라, 저는 그런 것을 믿지 않습니다."
10048080-23 = "타고난 선의라던가, 보편적인 교양이라던가……."
10048080-24 = "저의 세계관에 그런 것들은 존재하지 않거든요."
10048080-25 = "……꽤나 삭막하시군요."
10048080-26 = "후후, 그런 식으로 자극하려 하셔도 소용없답니다."
10048080-27 = "그리고 설령 제가 사람의 선의를 믿는다고 해도……."
10048080-28 = "여러분의 행동은 통상적인 궤를 한참 넘어섰어요."
10048080-29 = "대체 어떤 사람이 얼굴도 모르는 도둑을 위해서 이렇게 세심하게 함정을 파 놓겠습니까?"
10048080-30 = "그러니 이제 말씀해 주시죠."
10048080-31 = "……여러분의 목적과 의도가, 무엇이지요?"
10048080-37 = "(……절대로 자애의 괴도에게 우리의 의도가 드러나서는 안 돼요.)"
10048080-38 = "(위작을 떠넘기려는 우리의 의도를 알게 된다면, 우리를 가만두지 않을 테니까.)"
10048080-39 = "(……그런데 어떻게 해야 하죠?)"
10048080-40 = "(어떤 이야기로 둘러대야 이 상황을 타개할 수 있죠?)"
10048080-42 = "이런, 말씀해 주실 마음이 없으신가요."
10048080-46 = "저, 저기 그게……."
10048080-47 = "괜찮습니다."
10048080-48 = "말하지 않으시겠다면, 이 녀석이 입을 열도록 만들면 되니까요."
10048080-49 = "네?"
10048080-56 = "……그림?"
10048080-61 = "잠깐, 내 가방이 왜 열려 있어?!"
10048080-62 = "흐아악……! 괴도가 내 가방에서 그림을 가져갔어!"
10048080-63 = "언제 가져간 거야?!"
10048080-64 = "이런……!"
10048080-65 = "아까부터 그 가방에 계속 신경을 쓰고 계시더군요."
10048080-67 = "분명 그 안에 들어있던 것이 굉장히 중요하다는 의미겠지요."
10048080-68 = "자, 그럼 어디 한 번 볼까요?"
10048080-69 = "(아, 안 돼……!)"
10048080-70 = "(망했다……!)"
10048080-73 = "흐음……?"
10048080-74 = "뭡니까, 이 조악한 위조품은?"
10048080-78 = "……뭐라고요?"
10048080-79 = "당신들이 왜 <누가 자줏빛과 푸른빛을 귀여워하랴>의 위작을 가지고 있는지 묻는 겁니다."
10048080-80 = "……예?"
10048080-81 = "(지, 지, 지, 지금 무슨 소리야?)"
10048080-82 = "(위, 위, 위작이라니?)"
10048080-83 = "(의뢰인이 준 그림이 가짜라고……? 왜?)"
10048080-84 = "(그럴 수가 없는데? 어째서? 어째서? 어째서? 어째서? 어째서?)"
10048080-85 = "(으아아아아아……?!)"
10048080-89 = "(우리가 가지고 있던 그림이 위작이라고……?)"
10048080-90 = "(……아냐, 지금 자애의 괴도는 뭔가를 착각하고 있어요.)"
10048080-91 = "(수장고에서 직접 들고나온 자신의 그림을 진품으로 착각하고 있는 거예요……!)"
10048080-92 = "(사실은 수장고에 있던 것이 위작인데……)"
10048080-93 = "(……그래, 이러면 이야기가 차라리 쉬워져요.)"
10048080-94 = "(괴도는 이대로 위작을 들고 사라지고, 우리는 작전대로 이 진품을 전시회에 올리면 되니까.)"
10048080-100 = "(……하지만, 하지만 정말로 만약에…….)"
10048080-101 = "(……괴도의 말이 맞다면?)"
10048080-102 = "(우리가 가지고 있던 그림이 위작이라면?)"
10048080-103 = "(그렇다면, 진품은 영영 이 세상에서 사라지게 되는데…….)"
10048080-104 = "(대체 어느 쪽이 맞는 거죠……?)"
10048080-108 = "[ns] \"안녕, 얘들아.\""
10048080-110 = "선생님?! 여기는 어떻게……!"
10048080-111 = "[s] \"어쩐지 다들 여기에 있을 것 같아서.\""
10048080-115 = "……선생님?"
10048080-116 = "[s] \"잘 지냈니, 아키…….\""
10048080-120 = "[ns] \"……자애의 괴도님?\""
10048080-121 = "……저를 기억하고 계셨군요, 선생님."
10048080-122 = "후후……."
10048080-123 = "후, 후후, 후히, 후후후후……."
10048080-124 = "엥……?"
10048080-125 = "뭔가 기분 나쁘게 웃고 있어……!"
10048080-126 = "서, 선생님, 설마 자애의 괴도랑 아는 사이였어요……?"
10048080-127 = "[s] \"이 아이도 나의 학생이니까.\""
10048080-128 = "나의…… 학생……."
10048080-132 = "그렇다면 선생님, 하나만 여쭤볼게요."
10048080-133 = "……조금 전 자애의 괴도가 한 말들이, 전부 사실인가요?"
10048080-134 = "[s] \"사실과 거짓을 판별하는 것은 나의 몫이 아니야.\""
10048080-138 = "[ns] \"하지만 나는 나의 학생이라면 한 번 끝까지 믿어 보겠어.\""
10048080-139 = "끝까지…… 믿겠다……."
10048080-140 = "그럼, 저도 한 가지 묻겠습니다, 선생님."
10048080-141 = "저 아이들도, 선생님의 학생들인가요?"
10048080-142 = "[s] \"물론이야.\""
10048080-143 = "……후후, 역시 그렇군요."
10048080-144 = "아쉬운 대답이지만, 어쩔 수 없지요."
10048080-145 = "선생님의 그런 면모에 제가……."
10048080-146 = "……."
10048080-147 = "어쨌든, 이야기가 간결해졌군요."
10048080-148 = "선생님께서 저희 양측 발언의 진실성을 보증해 주시는 셈이 되니까요."
10048080-149 = "……즉, 이제 서로 숨기는 패 없이 진솔한 대화가 가능해진다는 것이지요."
10048080-150 = "그러니까, 수상한 조력자 여러분, 여러분께 다시 묻겠습니다."
10048080-151 = "어째서 저를 도와주셨죠?"
10048080-152 = "그리고 어째서…… <누가 자줏빛과 푸른빛을 귀여워하랴>의 위작을 가지고 계셨던 것일까요?"
10048080-157 = "……."
10048080-158 = "……우리가 가지고 있던 그림이, 위작이라고 했죠?"
10048080-159 = "예. 아주 확실하게 위작입니다."
10048080-160 = "정말인가요?"
10048080-161 = "저의 안목은, 적어도 예술의 분야에서는 절대로 틀리지 않습니다."
10048080-162 = "……."
10048080-163 = "그렇다면 저희도 말을 해드리는 것이 맞겠네요."
10048080-164 = "미, 미요, 잠깐……!"
10048080-165 = "말하는 게 맞아, 후유."
10048080-166 = "괴도의 말이 맞다면, 의뢰인이 우리를 속인 것이 되니까."
10048080-168 = "이야기해 드리죠. 저희의 목적이 무엇이었는지."
