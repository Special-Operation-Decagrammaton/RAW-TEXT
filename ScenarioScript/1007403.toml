[translation]
1007403-1 = "보는 사람이 없다면 의미도 없다"
1007403-2 = "(산책 겸 캠프 주변을 둘러보다 생각보다 깊은 곳까지 들어왔다.)"
1007403-6 = "(먼 곳에서 물소리가 들리는 것으로 보아, 근처에 폭포가 있는 것 같았다.)"
1007403-7 = "♪~♬~~♪~♬~"
1007403-8 = "[ns1] \"……노랫소리?\"\n[ns2] \"이 목소리는…….\""
1007403-11 = "♪~~~~♬♪~~♬~"
1007403-15 = "[ns] 소리가 난 쪽으로 향한다."
1007403-19 = "어라……?"
1007403-20 = "……선생님?"
1007403-23 = "[wa:300]― [log=하나코 수영복]용케도 여길 [wa:700]찾아오셨네요.[/log]"
1007403-25 = "― [log=하나코 수영복]아니면 [wa:1400]우연이신가요?[/log]"
1007403-28 = "[wa:150]― [log=하나코 수영복]선생님의 일이니까…….[/log]"
1007403-30 = "― [log=하나코 수영복]분명 어쩌다가, [wa:1720]겠군요. [/log]"
1007403-33 = "[wa:200]― [log=하나코 수영복]후후…… [wa:1660]그렇게 [wa:500]당황하지 [wa:600]마세요.[/log]"
1007403-35 = "― [log=하나코 수영복]옷은 [wa:400]제대로 [wa:1300]입고 있으니까요.[/log]"
1007403-38 = "― [log=하나코 수영복]물의 온도를, [wa:1500]느끼고 싶었어요.[/log]"
1007403-41 = "[wa:900]― [log=하나코 수영복]선생님도……. [wa:2700]이쪽으로 오실래요?[/log] [wa:700]"
1007403-44 = "[wa:300]― [log=하나코 수영복]여긴……[/log]"
1007403-46 = "― [log=하나코 수영복]트리니티의 분수 때와는 [wa:2600]정반대의 모습[wa:1240]이니까요.[wa:120] [/log]"
1007403-49 = "[wa:1200]― [log=하나코 수영복]사람 하나 없고, [wa:2500]자연적인 풍경…….[/log]"
1007403-51 = "― [log=하나코 수영복]네. [wa:2500]아무것도 치장하지 않은, [wa:3300]있는 그대로의 모습이죠.[/log]"
1007403-54 = "[wa:500]― [log=하나코 수영복]그러니까, [wa:2100]그걸 같이 [wa:1300]느꼈으면 해서요.[/log]"
1007403-56 = "[wa:100]― [log=하나코 수영복]……선생님만 [wa:2000]괜찮으시다면.[/log]"
1007403-59 = "후후. 역시 들어오지는 않으시는군요. 그러실 거라 예상하긴 했지만……."
1007403-60 = "하긴 아무리 제가 편하게 말씀드리려 해도, 선생님께서는 선생님 나름의 규칙이 있으시겠지요."
1007403-61 = "정말이지 피곤하시겠어요. 선생님께서는 이번이 처음도 아니실 텐데……."
1007403-62 = "저랑은 달리……. 이런 곳까지 와서도 전혀 달라지지 않으시다니."
1007403-66 = "저도 가끔은……. 선생님이 풀어지신 것도 좀 보고 싶었거든요."
1007403-67 = "[s3] \"딱히 불편할 게 없으니 피로할 것도 없지.\"\n[s4] \"하나코에게 보여지는 건 좀 무서운걸.\""
1007403-70 = "네, 네. 그러시겠지요. 또 그렇게 똑같은 말씀……."
1007403-71 = "사실은 저보다 더 거리를 두시는 게 선생님이 아니실까 싶은 생각이 들 정도지만……."
1007403-72 = "음? ……네?"
1007403-73 = "……'여기 와서 잘 즐기고 있는 것 같아서 다행이다'……라고요?"
1007403-74 = "선생님, 정말이지……."
1007403-75 = "…………."
1007403-76 = "아니에요. 뭔가 대꾸를 하고 싶었지만 이번에는 넘어가도록 할게요."
1007403-77 = "그러네요. 어쩌면 선생님 말씀이 맞을지도요. 이 정도면 꽤 즐기고 있다고 생각해요."
1007403-78 = "아직 조금은 남은 게 있다고 생각하긴 하지만요."
1007403-79 = "……그게 뭐냐고요? 후후. 가르쳐 드릴까요?"
1007403-80 = "그럼 이쪽으로 조금만 더 가까이 와 주시겠어요. 크게 말하기는 부끄럽거든요."
1007403-81 = "[s5] \"……?\"\n[s6] 하나코 쪽으로 다가간다."
1007403-87 = "……후후."
1007403-91 = "에잇♡"
1007403-96 = "후후후. 잔뜩 젖으셨네요, 선생님."
1007403-97 = "네. 좋아요. 이제 좋아요."
1007403-98 = "이제야 선생님도 좀……."
1007403-99 = "저와 비슷해진 것 같으니까요."
