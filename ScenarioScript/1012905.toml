[translation]
1012905-1 = "섬광불발행동"
1012905-6 = "선생님, 여기입니다."
1012905-7 = "[s]\"오, 스즈미! 딱 맞춰서 왔구나!\""
1012905-12 = "[ns]\"뷰티풀.\""
1012905-13 = "노, 놀리지 마십시오!"
1012905-14 = "분명 '현장에 어울리는 옷차림'을 입는 게 좋다고 하셔서……."
1012905-15 = "[s1]\"내가 입고 온 것 같은 걸 말하는 거였는데…….\"\n[s2]\"그치만 오히려 좋아.\""
1012905-18 = "갸아악……."
1012905-23 = "저, 저기……. 혹시 <마법소녀 헤비캘리버>의 <테르밋 화이트> 맞나요?"
1012905-27 = "앗, 네!! 맞습니다만……?"
1012905-28 = "저 완전 좋아해요!! 혹시 사진 같이 찍어도 될까요?!"
1012905-29 = "사, 사진 말입니까?"
1012905-30 = "[s]\"자연스럽게, 자연스럽게!\""
1012905-31 = "네에, 알겠습니다……?"
1012905-36 = "그 다음엔 저도 부탁드려요!!"
1012905-37 = "저도요!!"
1012905-51 = "감사합니다!! 인화해서 집에 걸어둘게요!!"
1012905-56 = "이 캐릭터, 인기가 아주 많군요……."
1012905-57 = "[s]\"스즈미가 예뻐서 그런가 봐.\""
1012905-58 = "……다시 순찰에 집중해야겠습니다."
1012905-59 = "(선생님은 또…… 예쁘다는 말을 아무렇지도 않게…….)"
1012905-69 = "어이, 카메라 멋있는데? 좀 빌려주면 안 돼?"
1012905-70 = "나중에 택배로 보내줄 테니까, 내놔봐."
1012905-72 = "아, 안되오!! 이건 소생의 중요한 카메라인데……!"
1012905-73 = "돼!"
1012905-78 = "저분들이 행사를 방해하는 사람들이었군요."
1012905-79 = "잠시 다녀오겠습니다."
1012905-86 = "거기까지입니다!"
1012905-91 = "뭐야? 코스프레냐?"
1012905-92 = "사진 찍히고 싶으면 기다리라고, 곧 카메라 뺏어줄 테니까."
1012905-93 = "방금 뺏는다고 말하셨다오!!"
1012905-94 = "빌리건 뺏기건 비슷한 거지, 짜샤!"
1012905-96 = "두 분이시군요."
1012905-97 = "한 번에 덤벼주십시오. 그편이 더 빠르니까요."
1012905-98 = "헛소리 말고 섬광탄이나 먹어!!"
1012905-107 = "뭐, 뭐 하는 거야!! 크윽, 뭔 악력이 이렇게 세!!"
1012905-108 = "섬광탄 들고 있잖아!! 손에서 터질 거야!!! 이거 놔!!"
1012905-109 = "그건 제가 도와드리겠습니다."
1012905-116 = "아, 아야야야야야!!!!"
1012905-117 = "으아악!! 손이!!"
1012905-118 = "제길 두고 보자!!"
1012905-126 = "신성한 섬광탄을 함부로 쓰지 마시길."
1012905-132 = "지금 섬광탄을 맨손으로 구겨버린 거야?"
1012905-133 = "그래서 망가져서 안 터진 거고……?"
1012905-134 = "뭔가 짜고 연극 쇼 같은 걸 한 건가?"
1012905-136 = "선생님. 목표는 달성했습니다. 귀환하시죠."
1012905-137 = "[s3]\"어, 으응…….\"\n[s4]\"네, 네엡…….\""
1012905-143 = "(스즈미와 함께 돌아왔다.)"
1012905-144 = "(사람들이 비켜줘서 인파를 헤치기 편했다.)"
