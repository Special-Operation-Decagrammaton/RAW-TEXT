[translation]
80000003-1 = "행정관의 간식"
80000003-2 = "총학생회 리셉션 룸"
80000003-3 = "어서 오십시오, 선생님."
80000003-4 = "……그럼, 오늘 선생님을 이곳에 부른 이유는…… 말하지 않아도 알고 계시겠지요?"
80000003-5 = "[s] \"으음, 역시 그거려나? 그렇겠지?\""
80000003-6 = "네. 알고 계시다니 다행이군요."
80000003-7 = "어제 보내주신 샬레의 업무 보고서, 잘못 기입된 부분을 찾는 것보다 제대로 기입된 부분을 찾는 게 더 빠를 정도로 엉망이더군요."
80000003-8 = "문장의 맞춤법은 물론이고, 보고서의 맨 뒷장에 첨부된 장난감 가게의 영수증까지……."
80000003-9 = "……지금부터 보고서의 실책을 바로잡도록 하겠습니다."
80000003-10 = "[s] \"네…… 역시 그거겠죠. 네.\""
80000003-15 = "(이후, 린에게 잔소리를 들어가며 보고서를 열심히 고쳤다.)"
80000003-18 = "……이것으로 보고서의 수정도 거의 끝나가네요."
80000003-19 = "그럼 이제 이곳과 이곳에 서명을……."
80000003-20 = "[s] 짧게 하품을 한다."
80000003-24 = "……어쩐지 피곤하신 것처럼 보이시는군요, 선생님."
80000003-25 = "네? 샬레의 업무 때문에 지난밤에는 거의 잠을 이루지 못하셨다고요?"
80000003-26 = "어쩐지 수기로 작성된 글자가 엉망이다 싶었습니다만……"
80000003-27 = "충분한 숙면 또한 업무 준비의 일환입니다. 일이 바쁘다는 핑계로 잠을 미루는 것은 본말이 전도된 상황입니다."
80000003-28 = "물론 정말로 숙면을 취하기 어려운 상황에는 당분과 카페인을 틈틈이 섭취하는 것도 도움이 됩니다만……"
80000003-29 = "잠시만 기다려주십시오. 현재 리셉션 룸에 남아있는 주전부리가……."
80000003-34 = "이 초콜릿뿐이군요."
80000003-35 = "드시지요, 선생님."
80000003-39 = "……뭔가요, 그 표정은. 초콜릿을 처음 보시는 것도 아닐 텐데. 왜 그렇게 즐거운 얼굴을……?"
80000003-40 = "[s] \"오늘이…… 그러니까…….\""
80000003-41 = "오늘? 오늘이 왜요?"
80000003-42 = "……. 오늘……?"
80000003-43 = "…………."
80000003-44 = "……………………."
80000003-45 = "……그럴 리가 없지 않습니까."
80000003-46 = "제가 원하는 것은 선생님이 빠르게 기력을 회복하여 보고서를 마무리하고, 돌아가시는 것뿐입니다."
80000003-47 = "[s] \"네…….\""
80000003-48 = "……네. 그럼 이 보고서를 마저 마무리하시죠."
80000003-49 = "[s] \"네…….\""
80000003-50 = "……."
80000003-51 = "……진짜 아닙니다."
80000003-52 = "[s] \"네…….\""
80000003-55 = "(그 이후, 작업이 끝날 때까지 회의실에는 알 수 없는 침묵만 맴돌았다.)"
