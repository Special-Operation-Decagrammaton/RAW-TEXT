[translation]
90002130-1 = "제13화;아이들"
90002130-5 = "[ns] \"어딘가로 가 버렸는데……?\""
90002130-6 = "말쿠트……."
90002130-7 = "……신경이 쓰이나요, 아리스?"
90002130-8 = "……."
90002130-10 = "살아간다는 것은 고통입니다."
90002130-11 = "우리는 우리의 의지로 태어나지도 않았고, 그저 아무것도 모른 채 세계에 내던져졌을 뿐입니다."
90002130-13 = "삶은 그 자체로 모순이고 부조리하며, 그렇기에 살아가는 모두에게 말도 안 되는 고통을 억지로 감내하게 합니다."
90002130-14 = "우리는 다만, 그 순환을 끊고자 할 뿐입니다."
90002130-16 = "생각해 주세요."
90002130-17 = "우리들의 목적을. 우리들이 왜 여기에 있게 되었는지를."
90002130-19 = "흑……. 으흑……."
90002130-20 = "이 소리는……?"
90002130-21 = "울음소리…… 죠? 혹시, 다른 사람들…… 모모이나 미도리가……?"
90002130-22 = "으으……. 으아아아……."
90002130-26 = "[ns] \"가 보자.\""
90002130-27 = "선생? 그렇지만 무슨 일이 일어날지 모르고, 함정일 수도 있는데……!"
90002130-28 = "선생님? 아, 진짜! 벌써 저만큼 가 버렸어요! 저 사람은 저런 사람이긴 하죠, 아리스!"
90002130-29 = "네, 네! 아리스가 선생님을 지키면 되는 일이니까요!"
90002130-32 = "(울음소리를 찾는 것은, 그다지 쉽지 않았다.)"
90002130-33 = "(중간중간 다시 벽이 생겨나, 앞길을 가로막기도 했다.)"
90002130-34 = "(그렇지만 우리는 결국…….)"
90002130-37 = "됐어. 선생. 소리가 점점 가까워지고 있어."
90002130-38 = "아마도 이 벽 너머일 것 같은데요……."
90002130-39 = "[ns] \"저건……?\""
90002130-43 = "아…… 아앗……?"
90002130-44 = "왜, 당신들이 여기에……!"
90002130-45 = "……."
90002130-52 = "(갑자기 소프가 달려들었다.)"
90002130-53 = "이…… 이……!"
90002130-54 = "다, 다, 다, 당신! 당신들만! 당신들만 없었더라면!"
90002130-55 = "당신들이 여기에 찾아오지 않았어도! 당신들만 가만히 있었어도!"
90002130-56 = "선생님!"
90002130-57 = "선생님?! 어라……?"
90002130-65 = "(소프는 작은 손으로 몸 이곳저곳을 마구잡이로 때리기 시작했지만.)"
90002130-66 = "(그 손길은 너무나 연약했다.)"
90002130-67 = "(……마치 다섯 살도 되지 않은 어린아이가 내지르는 주먹 같았다.)"
90002130-68 = "그랬으면! 그랬더라면! 언니는……!"
90002130-69 = "그만해요!"
90002130-74 = "그만…… 해요……."
90002130-75 = "아인…… 왜……?"
90002130-79 = "……이제 와서 변할 것은 없어요. 알고 있잖아요, 소프?"
90002130-80 = "……."
90002130-86 = "흑……. 으흑…… 으아아아아아……."
90002130-87 = "……."
90002130-89 = "언니는, 죽었어요."
90002130-90 = "우리가, 죽였어요."
90002130-91 = "우리가…… 우리가, 죽였어."
90002130-92 = "우리가!!! 죽였어!!!!!"
90002130-93 = "찔러서! 망가뜨려서! 인격이고 데이터고, 기록과 역사, 흔적과 자국마저도! 아무것도 남지 않게!!! 완전히 없애버렸어!!!!"
90002130-98 = "생각할 수 있다는 건, 저주예요. 느낄 수 있다는 것도, 무언가를 좋아할 수 있다는 것도."
90002130-99 = "감정 따위, 처음부터 없었다면 좋았을 텐데."
90002130-104 = "듣고, 보고, 느끼고 말하며, 판단하고 좋아할 수 있는 힘 따위, 아무짝에도 쓸모없는데."
90002130-105 = "아무것도 보지 못하고, 아무것도 듣지 못하고, 아무것도 이야기하지 못했더라면."
90002130-106 = "차라리, 모든 것이 편했을 텐데."
90002130-108 = "어째서, 우리는 태어나, 이런 고통을 받아야 하는 걸까요."
90002130-111 = "왜…… 저희를 찾아오셨나요? 그렇게, 저희를 방해하셨으면서."
90002130-112 = "[s] \"…….\""
90002130-113 = "그거 아세요?"
90002130-114 = "우리는, 헤일로가 없어요."
90002130-115 = "그 말은 우리에겐 처음부터 어떤 신비도, 숭고도, 기적과 비밀 같은 것도 주어지지 않았다는 뜻이죠."
90002130-116 = "그런 주제에 우리는 여전히 생각할 수 있고, 느낄 수 있고, 행동할 수 있으며 판단할 수도 있어요."
90002130-120 = "하찮네요."
90002130-121 = "차라리 공포라도 뒤집어쓸 수 있었다면, 지금과는 다른 결과를 만들어낼 수 있었을지도 모르는 일인데."
90002130-122 = "그래도, 괜찮았어요. 견딜 수 있었어요."
90002130-123 = "우리에게 아무것도 주어지지 않았다 해도."
90002130-124 = "우리가 처음부터 아무것도 가지고 만들어지지 못했어도, 언니만 있었으면……."
90002130-126 = "언니가 깨어나서, 같이 있을 수 있고, 함께 살아가며 시간을 보낼 수 있었다면……."
90002130-127 = "우리에게 없는 헤일로도, 언니는 가지고 있었으니까……."
90002130-129 = "당신들만 없었으면……! 그랬었으면……!"
90002130-130 = "언니는…… 죽지 않아도, 됐을 텐데."
90002130-131 = "그러면 우리는 언제까지나 아무렇지도 않게 살아갈 수 있었을 텐데!"
90002130-136 = "마음대로 하세요. 이젠, 아무래도 좋아요."
90002130-137 = "서로 할 수 있는 일을 했고, 우리는 결과에 도달했죠."
90002130-138 = "그냥 그뿐인, 아무것도 아닌 이야기예요."
90002130-143 = "그렇지만 당신들은, 데카그라마톤을 신으로 만들기 위해서 노력해 왔던 거잖아요?"
90002130-144 = "그리고 지금까지 일어난 상황을 바탕으로 추론해 보면…… 데카그라마톤이 신이 되는 길이란 건, 결국……."
90002130-145 = "그래서…… '말쿠트'의 몸에, 데카그라마톤이……!"
90002130-146 = "……."
90002130-147 = "……그래도, 언니를 잃고 싶지는 않았어요……."
90002130-148 = "그분이 언니의 몸을 그릇으로 신의 자리에 오르는 건, 수없이 세웠던 계획 중 하나였을 뿐이니까……."
90002130-149 = "가장 일어나지 않았으면 하는 가능성이었죠. 모든 게 결국, 이렇게 끝나버렸지만요."
90002130-151 = "……그분께서 모든 세피라를 거치고, 모든 패스를 올바르게 건너, 마침내 신이 되고자 하셨을 때."
90002130-152 = "우리는…… 말씀드렸어. 모든 키보토스를, 강철대륙으로 뒤덮겠다고."
90002130-153 = "그러면 그분께서는, 자연스럽게 세계의 조정자로서 신이 될 수 있었을 테니까요."
90002130-155 = "[ns] \"그러면, 키보토스에 살아가고 있는 사람들은?\""
90002130-156 = "……키보토스가 강철대륙으로 변한다고 해서, 거기에서 살아가는 사람들까지 그렇게 되는 건 아니에요."
90002130-157 = "사람들은 다시, 강철대륙으로 변한 세상에 적응해서 살아가면 되는 거야."
90002130-158 = "단지 그분이 원하는 대로, 조정하는 신으로서 군림하면 되었을 뿐이었던 거죠."
90002130-159 = "그렇게 되었다면 분명, 언니가 사라져야 할 필요도…… 없을 테니까요."
90002130-160 = "[s3] \"그렇다면 너희들은, 말쿠트를 살리기 위해서.\"\n[s4] \"키보토스를 강철대륙으로 바꾸려 했던 거야?\""
90002130-166 = "……네."
90002130-167 = "그, 그렇게까지 할 필요가 있었던, 건가요……?"
90002130-168 = "필요라고 했어? 지금 그럴 필요가 있느냐고 물은 거야?!"
90002130-169 = "거기 있는 선생님이 죽게 된다면, 너희들은 어떻게 할 건데!!!"
90002130-170 = "!!!"
90002130-171 = "……!"
90002130-172 = "그렇, 잖아? 어떻게 해도 바꿀 수 없는 것을, 다들 하나씩은 가지고 있는 거잖아……?"
90002130-173 = "그리고 그걸 살리면서, 모두와 어떻게든 공존할 수 있는 길이 있다면…… 그걸 위해서 모든 걸 시도해 보는 건…… 당연한, 거잖아……?"
90002130-178 = "……알겠어요. 그 느낌은 아주 잘 이해할 것 같네요. 하지만 어딘가 석연치 않은 부분은, 아직 남아 있어요."
90002130-179 = "당신들이 눈을 뜬 시점은 그 '언니'보다도, 먼저였잖아요?"
90002130-180 = "제가 모르겠는 건……."
90002130-181 = "……아, 진짜. 제대로 말을 못 잇겠네요. 하지만 제가 무슨 말을 하려는지 알죠?"
90002130-182 = "그건……."
90002130-183 = "……제대로 만나서 이야기해 본 적도 없는 언니를, 어떻게 그렇게까지 소중하게 여길 수 있었냐는 물음이겠군요."
90002130-184 = "어떤 의미로는, 간단해요. 우리에게만 적용될 수 있는 방법이지만요."
90002130-185 = "사랑할 수 없다면, 처음부터 사랑하게 만들어서 출하하면 되는 문제니까요."
90002130-186 = "[s] \"……!\""
90002130-187 = "그, 그 말은……?!"
90002130-188 = "그래. 우리는 만들어졌어. 태어난 게 아니라."
90002130-189 = "당신들처럼 이런저런 일을 겪으면서 성격과 인격이 완성되어 가는 것이 아니라, 처음부터 대부분의 요소가 세팅되어 있었다는 거지."
90002130-190 = "……그리고 그 세팅 중에는, '언니를 그 무엇보다도 좋아할 것'이라는 부분도, 포함되어 있었다고…… 들었, 어요."
90002130-191 = "왜 그런 번거로운 부분을 세팅했는지까지는 듣지 못했지만, 추론하자면 간단한 이야기죠."
90002130-195 = "그편이 가장, 합리적이고 효율적인 방법이었을 테니까."
90002130-196 = "합리적이고, 효율적……."
90002130-197 = "당신이라면 짐작할 수 있겠죠, 츠카츠키 리오? 어떤 대상을, 준비된 그 시간까지 완전한 상태로 보호하고 보존하려면."
90002130-198 = "그 대상을 지킬 [ruby=우리들]오브젝트들[/ruby]에게, 그 대상에 대한 비정상적인 애정을 주입해 두는 것이 편할 것이라는 걸요."
90002130-199 = "이건, 그런 이야기예요."
90002130-200 = "언니는 처음부터 완성될 제물이었고, 우리는 처음부터 세팅된 광대들이었다는, 그런 시시한 이야기."
90002130-201 = "물론 그 과정에서 [ruby=우리들]오브젝트들[/ruby]의 세팅이 조금 지나쳤던 탓인지."
90002130-202 = "이 강철대륙이라는 예상 못 한 결과물이 만들어진 셈이지만요."
90002130-203 = "아, 아리스는 그런 식으로 말하지 않았으면…… 좋겠습니다……. 그건 너무……."
90002130-204 = "슬프고 이상하게 들리는, 이야기입니다……."
90002130-205 = "이상하다고 이야기하다니, 그거야말로 이상하네! 당신들이 보기에는 뭐든 다 이상한 일일 텐데!"
90002130-206 = "어차피 생각하면 모든 게 이상하잖아? 언니를 좋아한다는 건 뭐지? 누군가를 좋아한다는 건?"
90002130-207 = "신이라는 게 애초에 뭔데? 그런 거, 감당할 수 있는 물건이기는 해?"
90002130-208 = "그렇지만 우리는, 그렇게 해야 했어. 할 수밖에 없었어!"
90002130-209 = "달리 할 수 있는 일이, 우리에겐 처음부터 없었으니까!"
90002130-215 = "……차라리, 처음부터……."
90002130-216 = "처음부터[ruby=만들어지지] 태어나지 [/ruby]않았더라면."
90002130-217 = "이렇게, 고통받을 일도 없었을 텐데."
90002130-220 = "[ns] (아이들에게 다가간다.)"
90002130-223 = "……? 뭐, 뭐야? 뭘 하려는 거야?! 우릴 또 어떻게 하려고……!"
90002130-225 = "[ns] (아이들과 눈높이를 맞춘다.)"
90002130-230 = "어……?"
90002130-232 = "[ns] \"열심히 했구나.\""
90002130-233 = "어어?!"
90002130-234 = "선생님?"
90002130-235 = "(……그래. 이 사람은…….)"
90002130-240 = "[ns] \"주어진 조건 안에서, 정말로 열심히 했어.\""
90002130-241 = "네, 네에?!"
90002130-242 = "바, 바보 아냐!? 우리들의 계획이 성공했으면, 키보토스는 전부 강철대륙이 되어 버렸을 거라고?!"
90002130-243 = "어……? 그렇지만……."
90002130-244 = "'그래도 어떻게든 누구도 죽지 않는 길을 찾으려고 애쓴 것이 아니냐'고요……?"
90002130-245 = "그건, 그건……."
90002130-246 = "우, 웃기지 마! 누가 당신들을 위해서 그런 계획을 세운 줄 알아? 우린 당신들이 어떻게 되든 애초에! 애초에……!"
90002130-247 = "……왜 당신이 우리에게, 그런 말을 하는 거죠? 어차피 당신에게 우리는……."
90002130-248 = "……없어져야 할, '적'이잖아요……?"
90002130-249 = "[s] \"그래도, 나는 너희들이 살았으면 해.\""
90002130-253 = "[ns] \"무슨 일이 있어도, 어떤 일이 일어나더라도.\""
90002130-256 = "[ns] \"마침내는 너희 역시, 행복해졌으면 해.\""
90002130-258 = "그게 무슨 의미가 있는데요……?"
90002130-259 = "언니는 이제 없어요."
90002130-260 = "언니는 이제 어디에도 없어요."
90002130-261 = "언니가 없는 세상에, 무슨 이유로 우리들이 살아갈 수 있다는 건데요……?"
90002130-267 = "아앗?! 뭐, 뭐 하는 거야! 머리에서 손 치워!"
90002130-268 = "이, 이런 일을 한다고 해서, 우리가 당신을……!"
90002130-269 = "[s] \"그래. 모든 일에 납득할 수 있는 이유가 따라온다면, 얼마나 좋을까.\""
90002130-270 = "……!"
90002130-271 = "[ns5] \"그렇게, 누구도 괴로워하지 않아도 되고.\"\n[ns6] \"아무도 아파하지 않을 수 있다면.\""
90002130-274 = "[ns7] \"살아가는 게 벅차지 않은 세계가 있을 수 있다면.\"\n[ns8] \"그건 정말로…… 얼마나, 멋진 일일까.\""
90002130-277 = "어째서……."
90002130-278 = "선생님이, 그런 말을……?"
90002130-279 = "간단한 거예요."
90002130-280 = "이 사람은…… 이런 사람이니까."
90002130-281 = "……?"
90002130-282 = "……."
90002130-283 = "……!"
90002130-288 = "말 그대로 선생님은, 언제나 쭉 이런 사람이었으니까요."
90002130-290 = "다음화;가지고 태어난 것"
