[translation]
1013509-1 = "흐르는 노을의 시간"
1013509-3 = "[ns] \"케이 쨩이 샬레에 왔다~!\""
1013509-4 = "호들갑 좀 떨지 마세요!"
1013509-5 = "……애초에 이게 처음도 아니잖습니까. 어차피."
1013509-6 = "[s] \"그래도 나는 반가운데~\""
1013509-7 = "……."
1013509-8 = "안 반갑다는 거, 아닙니다……."
1013509-12 = "?!?! 갑자기 달려들지 마요! 쏴 버릴 겁니다??!!"
1013509-14 = "애초에 말이죠. 샬레 업무 중 어느 정도는 의견 제안이나 합의 도출, 뭐 그런 거잖아요."
1013509-15 = "그런 거, 자기들끼리 적당히 이야기한 다음, 규칙 안에서 끝을 내면 될 텐데, 뭘 이렇게 여기까지 다 가져오고……."
1013509-16 = "거기에 어떤 부분은 그놈의 보안 때문에 종이 서류로 처리해야 한다는 것도 그래요."
1013509-17 = "물론 네트워크에 100%의 보안 같은 것은 없습니다만."
1013509-18 = "애초에 이 정도의 상위 보안 레벨을 요구하는 안건을 안 만들면 되는 거 아닌지……."
1013509-19 = "[s] \"사람이 하는 일이다 보니 말이지…….\""
1013509-20 = "그 덕에 여기가 갈려 나가고 있고요."
1013509-21 = "그래서 일이 줄어들거나, 최소한 현상 유지라도 되면 모르겠어요."
1013509-22 = "쭉 보아 왔으니 아시잖아요. 이거, 늘어나면 늘어났지 절대 줄어들 수 없다는걸요."
1013509-23 = "샬레가 문제를 잘 해결하면 해결할수록, 사방에서 더 일거리를 가지고 달려드는 꼴이라고요."
1013509-24 = "애초에 선생님, 원래 직책은 교육자잖아요?"
1013509-25 = "이게 무슨 행정 부품인가요, 학생들의 진로와 인생을 함께 고민하는 스승인가요?"
1013509-26 = "[s1] \"그러게…….\"\n[s2] \"이러다 가르치려던 거 다 잊어버리겠네…….\""
1013509-29 = "남의 일처럼 말하지 마세요, 진짜……."
1013509-30 = "이 서류는 이렇게 끝내 두겠습니다."
1013509-31 = "아뇨, 뭐. 그렇게 호들갑을 떨며 고마워하셔도……. 그냥 당번으로서 할 일이고요……."
1013509-32 = "키보토스…… 학원도시만 해도 그래요. 학생들을 한 도시에 몰아넣으면, 그야 장점도 있겠지만."
1013509-33 = "학생만큼 일명 '벗겨 먹기' 좋은 애들이 어디 있다고요? 그러니까 매일매일 말도 안 되는 사고가 터지는 거잖아요."
1013509-34 = "그리고 그와 정확히 반대로, 학생만큼 자기 통제가 안 되는 애들도 없죠."
1013509-35 = "지금은 절대로 통할 수 없는 관점이지만, 예전에는 그래서 스무 살 이전의 아이들을 온전한 인간 취급하지 않았던 때도 있었고요."
1013509-36 = "안팎으로 아주 사고투성이네요, 사고투성이. 이러니까 건축재건업이 이 도시의 영원한 1순위 유망 사업이죠."
1013509-37 = "[s] \"그렇지만 학원도시의 근간을 부정해도 말이지…….\""
1013509-38 = "끝이 안 보이니까 하는 말입니다. 끝이 안 보이니까."
1013509-39 = "진짜, 이러다 사람 하나 쓰러져 봐야 다들 제정신을 차리지."
1013509-40 = "여기요. 이건 이렇게 처리하면 될 겁니다. 여기 보조 통계 자료에요."
1013509-41 = "가끔은 숫자가 그 스스로 무언가를 증명하는 셈이니까요."
1013509-45 = "[ns] \"케이 쨩.\""
1013509-46 = "네?"
1013509-51 = "[ns] \"사랑해.\""
1013509-52 = "저리 가요! 징그러우니까!!!"
1013509-58 = "[ns] \"어떻게든 일과가 끝났구나…….\""
1013509-61 = "……괜찮아요?"
1013509-62 = "네? 제가 걱정해 주니까 싹 나은 것 같다고요? 아, 좀!"
1013509-63 = "정말이지, 걱정해서 손해 봤어요……."
1013509-64 = "네? 디너 스페셜이 맛있는 곳이 있으니까, 같이 가자고요? 액세서리 쇼핑도?"
1013509-65 = "그렇지만 선생님, 피곤하신 거 아닌가요? 조금 전에도 어딘가……."
1013509-66 = "……괜찮다구요? 그렇, 다면……."
1013509-67 = "……."
1013509-68 = "그건 그렇고, 내일 당번은 누군가요?"
1013509-69 = "[s] \"어디 보자…….\""
1013509-73 = "[ns] \"어라. 뭔가 누락됐나 봐. 아직 안 정해졌네.\""
1013509-74 = "……그래도 되는 건가요?"
1013509-75 = "내일 오전까지만 발송하면 되는 거니까 문제없다고요?"
1013509-76 = "……."
1013509-77 = "그러면, 저로 하시죠."
1013509-78 = "[s] \"뭣?!\""
1013509-79 = "무, 무슨 이상한 표정 하고 있는 거예요! 이것도 말하자면!"
1013509-80 = "그러니까…… 말하자면……"
1013509-81 = "그, 그래요! 저의 키보토스 적응 훈련이나 샬레 업무 파악, 나아가 무역 수지 적자 개선 및 관세율 조정."
1013509-82 = "회복될 기미를 보이지 않는 실질 소득 및 공교육 붕괴, 인류와 행성의 미래, 타락해 가는 세계혼의 정화 및 구원. 그리고, 그리고……."
1013509-83 = "아무튼! 그 모든 것들을 위한 훈련이자 실전, 그리고 또……!"
1013509-84 = "어쨌거나! 선생님에게도 저에게도 모두 분명히 합리적인 결정이란 겁니다! 고마운 줄 아세요!"
1013509-85 = "[s] \"합리적인 결정…… 그것은 마치…….\""
1013509-86 = "!??!"
1013509-87 = "마, 말을 조금 실수했네요……. 이런 굴욕이……!"
1013509-88 = "하여간에! 아셨죠?!"
1013509-89 = "[s] \"케이 쨩.\""
1013509-90 = "또 왜요."
1013509-91 = "[s] \"한 번만 '착하다, 착하다' 해 주고 싶은데 안 될까?\""
1013509-92 = "선생님을 죽이고 저도 죽겠어요!!!"
1013509-94 = "그러면, 수고 많으셨습니다."
1013509-95 = "……내일 또 보죠."
1013509-96 = "뭐 해요. 어서 가요. 같이 저녁 먹고……. 이것저것, 하기로 했잖아요."
1013509-97 = "[s] \"그래, 그래. 조금만.\""
1013509-99 = "(그렇게 말한 순간.)"
1013509-106 = "[ns] \"어…….\""
1013509-107 = "……?"
1013509-108 = "왜 그러세요, 선생님?"
1013509-113 = "[ns] \"……!\""
1013509-114 = "선생님?"
1013509-119 = "네? 제가 잠시 흐리게 보이거나, 잠깐 보이지 않기까지 했다고요?"
1013509-120 = "저는 쭉 여기에 있었는데……."
1013509-121 = "……."
1013509-122 = "좀 피곤하셨나 보네요. 보통 피곤하면 시력이 가장 먼저 흐려지고 그래요."
1013509-123 = "오늘 밤은 푹 쉬시죠."
1013509-126 = "[wa:2180]― [log=케이 교복]걱정하지 말아요.[/log]"
1013509-127 = "[wa:2860]― [log=케이 교복]전 사라지지 않아요.[wa:120] [/log]"
1013509-130 = "[wa:560]― [log=케이 교복]오히려 [wa:1320]그 반대죠. [/log]"
1013509-131 = "[wa:2620]― [log=케이 교복]무슨 수를 써서라도 [wa:2750]아득바득 살아남아 줄 생각이니까요.[/log]"
1013509-134 = "[wa:3530]― [log=케이 교복]선생님이 이 세계를 [wa:1130]포기하지 않는다면.[/log]"
1013509-135 = "[wa:3700]― [log=케이 교복]저 역시, 언제까지나 [wa:1870]포기하지 않을 생각이고요.[/log]"
1013509-138 = "[wa:500]― [log=케이 교복]그러니까…… [wa:2400]괜찮아요. [wa:1740]전부 괜찮아요.[/log]"
1013509-139 = "[wa:2320]― [log=케이 교복]저는, 쭉 [wa:1690]여기에 있을 거예요.[/log]"
1013509-142 = "[wa:2730]― [log=케이 교복]여기에서만 하는 말이지만…… [wa:2680]저는……[/log]"
1013509-143 = "[wa:2740]― [log=케이 교복]선생님을, [wa:2280]그렇게 싫어하지 않으니까요.[/log]"
1013509-155 = "(밀레니엄까지 바래다주느라, 평소보다는 조금 더 늦은 시간에 케이와 헤어졌다.)"
1013509-156 = "(처음에는 나란히 살짝 떨어져서 걷고 있었지만.)"
1013509-157 = "(왠지 모르게 케이가, 조금씩 새끼손가락 끝을 얽어 오고 있었다…….)"
