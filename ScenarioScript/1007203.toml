[translation]
1007203-1 = "수중 보급 작전 2"
1007203-2 = "(사키의 연락을 받고 이전의 부둣가로 나왔다.)"
1007203-6 = "후후, 후후후……"
1007203-10 = "아, 선생님. 왔구나."
1007203-11 = "[s] \"뭔가 기분이 좋아 보이네.\""
1007203-12 = "음, 오늘 오전에 오래된 창고를 정리하는 걸 거들다가 귀한 물건을 발견했거든."
1007203-13 = "바로……"
1007203-18 = "자돌폭뢰야!"
1007203-19 = "[s] \"……이게 뭐야?\""
1007203-20 = "응? 선생님은 이 무기를 처음 보는 거야?"
1007203-24 = "이건 말이지. 아주 오래전에 백귀야행 학원에서 사용하던 대전차병기로, 긴 막대 끝에 대전차 고폭탄을 달아서 근접한 전차를 격파할 수 있도록 만든 물건이야."
1007203-25 = "조작이 간편하고 제작 단가가 저렴하기 때문에 혼란이 지속되던 백귀야행 학원의 전국시대에 종종 사용되었다고 하는데……"
1007203-26 = "보다시피 전차에 근접해야만 효과를 볼 수 있기 때문에, 큰 성과는 거두지 못한 모양이야."
1007203-27 = "그래도 찌르면 폭발한다는 단순 명쾌한 구조 덕분에 묘한 마니아층이 있는 편이지."
1007203-28 = "그런데 이런 귀한 무기가 어촌 마을의 창고에 버려져 있었다니……"
1007203-29 = "게다가 주민 여러분도 버리려 했던 물건이라며, 공짜로 가져가라고 내주셨어. 오늘은 정말 운이 좋네!"
1007203-30 = "[s] \"그런데 이 무기는 어디에 쓰려고?\""
1007203-31 = "선생님, 혹시 뱅스틱이라고 들어 본 적 있어?"
1007203-32 = "뱅스틱은 잠수부들이 사용하는 긴 작살 모양의 총인데, 이 뱅스틱을 수중에서 격발하면 상어나 고래처럼 아무리 큰 어류라 하더라도 일발에 제압할 수 있어."
1007203-33 = "자돌폭뢰도 뱅스틱도 그 원리는 동일하니까……"
1007203-34 = "[s] \"설마……\""
1007203-35 = "응! 이 자돌폭뢰로 물고기를 근거리에서 기절시키는 거야!"
1007203-36 = "저번에 잠수를 하며 둘러봤는데, 바닥에 통나무만 한 크기의 물고기가 여럿 돌아다니더라고."
1007203-37 = "수중에서 손으로 그만한 크기의 물고기를 제압하는 건 어렵겠지만…… 화약의 힘을 빌린다면 그런 커다란 물고기도 쉽게 기절시킬 수 있을 거야."
1007203-38 = "[s1] \"잘 되면 좋겠지만……\"\n[s2] \"너무 위험하지 않을까?\""
1007203-41 = "괜찮아. 물론 폭약의 양은 조금 덜어내긴 해야겠지만……"
1007203-42 = "수중에서의 폭발 임무를 수도 없이 훈련해 온 SRT의 특수 요원에게 물고기를 제압하는 것 정도야 식은 죽 먹기지."
1007203-47 = "……그럼 다녀올게!"
1007203-57 = "(그리고 잠시 뒤……)"
1007203-62 = "콰과과광!"
1007203-77 = "[ns] \"사, 사키…… 괜찮아?\""
1007203-78 = "나는 괜찮은데……"
1007203-79 = "잡으려고 했던 물고기가……"
1007203-83 = "폭압에 휩쓸려 산산조각이 나고 말았어......"
1007203-84 = "……이대로는 먹을 수 없겠지."
1007203-85 = "도대체 뭐가 문제였지? 분명 거리 계산은 완벽했을 텐데……!"
1007203-86 = "[s] \"화력이 너무 강했던 거 아닐까?\""
1007203-87 = "아무래도 그랬던 모양이야. 폭발력을 줄였다지만 일단은 전차의 장갑을 관통하기 위해 제작된 물건이니……"
1007203-88 = "생선의 비늘에 직접 찌르는 건 자극이 너무 강했던 모양이네."
1007203-89 = "[s3] \"그나저나 막대로 생선을 직접 찌를 수 있다면……\"\n[s4] \"그냥 평범하게 작살을 사용하면 안 되는 거야?\""
1007203-94 = "그건 그러니까……!"
1007203-95 = "그게……"
1007203-96 = "그렇……긴 하네……"
1007203-97 = "처음부터 작살을 빌려왔더라면 이미 충분히 먹고도 남을 만큼의 물고기를 낚았을 텐데, 화력에 집중하느라 가장 기초적인 방법을 간과하다니……"
1007203-98 = "이런 바보 같은 경우가 어디에 있어—!"
1007203-100 = "(……이후 낙심한 사키를 데리고 어시장으로 가 회덮밥을 사주었다.)"
1007203-101 = "(사키는 식욕이 없어 보이기는 했지만 회덮밥 한 그릇을 남김없이 깨끗이 비웠다……)"
