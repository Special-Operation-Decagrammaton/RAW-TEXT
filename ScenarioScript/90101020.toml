90101020-86 = "อ๊ะ ยูกิโนะ"
90101020-87 = "ปู"
90101020-88 = ""
90101020-90 = ""
90101020-91 = "ว่าไงนะ...?"
90101020-92 = ""
90101020-94 = ""
90101020-95 = "จากนี้ไป เราจะไปจัดการปูกัน"
90101020-97 = "ตอนต่อไป;ปูกับถังเหล็ก"
