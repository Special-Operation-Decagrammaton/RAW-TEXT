[translation]
90101020-1 = "ตอนที่ 2;ไส้กรอกปลาผสมเนื้อปู"
90101020-2 = "กองบัญชาการกองทหาร FOX ชั้นใต้ดินชาเล่ต์"
90101020-6 = ""
90101020-7 = "FOX 2 กับ FOX 3 กลับมาแล้วค่ะ"
90101020-8 = "กลับมาแล้ว~"
90101020-9 = ""
90101020-11 = ""
90101020-12 = ""
90101020-13 = "อื้อ เหนื่อยหน่อยนะ"
90101020-14 = "จะว่าไป กลับมาช้ากว่ากำหนดเยอะเลยนะ"
90101020-15 = "เกิดปัญหาอะไรที่คลังเก็บบันทึกวัลคิรี่ที่แฝงตัวเข้าไปวันนี้เหรอ?"
90101020-16 = "เปล่าหรอก การแฝงตัวราบรื่นดี"
90101020-17 = "เพราะทั้งเข็มกลัดของสำนักความมั่นคงและบัตรนักเรียนที่พกไป ก็เลียนแบบเหมือนของจริงทุกอย่าง"
90101020-18 = "แต่ตอนกำลังกลับ พอมาถึงประตูหน้าของอาคารหลัก จู่ๆ ก็มีนักเรียนที่ดูจะเป็นคนของ#nสำนักรักษาความปลอดภัยมาสงสัยพวกเราน่ะสิ"
90101020-19 = "ไม่รู้สายตาเฉียบคมอะไรขนาดนั้น พอเห็นว่าไม่เคยเจอหน้าพวกเราที่สำนักความมั่นคงมาก่อน ก็จ้องพวกเราเขม็งแบบไม่ยอมละสายตาเลย"
90101020-20 = "อย่าบอกนะว่า... พวกสำนักความมั่นคงก็เลยจับได้เข้าน่ะ?"
90101020-21 = "เปล่าหรอก พอนิโกะชวนคุยเรื่องโดนัท พวกนั้นก็เหมือนลืมเรื่องที่สงสัยพวกเราไปหมดเลย"
90101020-22 = "แต่พอเล่นตามน้ำไปเรื่อยๆ สุดท้ายเลยต้องไปยืนต่อแถวซื้อโดนัทลิมิเต็ดของมาสเตอร์โดนัทด้วยกัน..."
90101020-23 = "เลยใช้เวลากลับกองบัญชาการนานกว่าที่คิดนิดหน่อยน่ะ ขอโทษนะ"
90101020-24 = "ไม่เห็นต้องขอโทษเลย ลำบากแย่เลยนะ"
90101020-25 = "ว่าแต่ ยูกิโนะล่ะ?"
90101020-26 = "ตั้งแต่ประธานองค์การนักเรียนเรียกไป ก็ยังไม่กลับมาเลย"
90101020-27 = "เห็นว่าจะกินมื้อเย็นแถวอาคารองค์การนักเรียนแล้วค่อยกลับมาน่ะ"
90101020-28 = "จริงด้วย จะว่าไปโอโทกิก็ยังไม่ได้กินมื้อเย็นเลยใช่มั้ย?"
90101020-29 = "คงหิวแย่เลย ฉันจะรีบไปเตรียมมื้อเย็นมาให้นะ"
90101020-30 = "ไม่เป็นไร ฉันกินอันนี้รองท้องไปแล้ว"
90101020-31 = "นั่นมัน..."
90101020-32 = "ไส้กรอกปลาผสมเนื้อปูยี่ห้อ <โยโคซุนะ> ไม่ใช่เหรอ? เธอชอบกินอันนั้นจริงๆ เลยนะ"
90101020-33 = "จริงๆ ก็ไม่ใช่ว่าชอบเป็นพิเศษหรอก แค่มันกินสะดวกดีน่ะ"
90101020-34 = "ทั้งเก็บไว้ได้นาน แถมกินแค่ชิ้นเดียวก็อยู่ท้องแล้ว ที่สำคัญ เวลากินแทบไม่มีกลิ่นหรือไม่มีเสียงเลย นั่นแหละที่ฉันถูกใจที่สุด"
90101020-35 = "ถือว่าเป็นตัวเลือกที่ดีที่สุดสำหรับสไนเปอร์... ไม่สิ สำหรับนักลอบสังหาร ที่ต้องกินอาหารโดยไม่ให้#nใครรู้ตัวอยู่ตลอดเวลาเลยละ ฮุ... ฮุ... ฮุ..."
90101020-36 = "คราวนี้หัวเราะเลียนแบบใครอีกล่ะเนี่ย...?"
90101020-37 = "ไม่ได้นะ ถึงจะสะดวกแค่ไหน แต่ก็ให้กินของแบบนั้นแทนมื้ออาหารเป็นประจำไม่ได้หรอก อยู่ในวัยกำลังโต งั้นก็ต้องกินอาหารดีๆ สิ"
90101020-38 = "รอเดี๋ยวนะ ฉันจะรีบไปหุงข้าวมาให้"
90101020-39 = "ค่า~"
90101020-40 = "ว่าแต่ ถ้าเป็นไส้กรอกปลาที่ผสมเนื้อปู มันก็น่าจะแพงมากเลยไม่ใช่เหรอ?"
90101020-41 = "อย่าบอกนะว่าแอบประหยัดค่ากระสุน เพื่อเอาเงินไปซื้อของว่างกินน่ะ?"
90101020-42 = "ไม่หรอก ไส้กรอกอันนี้ไม่ได้แพงขนาดนั้นสักหน่อย อันละไม่ถึง 100 เยนเลยด้วยซ้ำ"
90101020-43 = "ขนาดเนื้อปูกระป๋องราคาถูกยังตั้ง 1,000 เยนเลย แต่ไส้กรอกผสมเนื้อปูอันละไม่ถึง 100 เยนเนี่ยนะ?"
90101020-44 = ""
90101020-46 = ""
90101020-47 = "อ๊ะ"
90101020-48 = "อันนี้ไม่ใช่ไส้กรอกที่ใส่เนื้อปูจริงๆ แต่เป็นไส้กรอกปลา 'รส' ปูสินะ"
90101020-49 = "วะ... ว่าไงนะ?"
90101020-50 = "ดูฉลากส่วนผสมนี่สิ เห็นมั้ย ไม่มีเนื้อปูแม้แต่ 1% เลย"
90101020-51 = "มันก็แค่เนื้อปลาราคาถูกที่ปรุงด้วยสารแต่งกลิ่นหรือรส ให้ออกมารสชาติใกล้เคียงเนื้อปูก็เท่านั้นเอง"
90101020-52 = "ได้ไงกัน ไส้กรอกปูของโยโคซุนะไม่มีเนื้อปูจริงๆ อยู่เลยงั้นเหรอ..."
90101020-53 = "เมื่อกี้โลกของฉันเพิ่งพังทลายไปเลย..."
90101020-54 = "อย่าตื่นตูมไปเลยน่า เธอควรจะสงสัยตั้งแต่ตอนเห็นว่าราคามันถูกขนาดนั้นแล้วไม่ใช่เหรอ?"
90101020-55 = "ของฟรีไม่มีในโลกหรอกนะ"
90101020-56 = "จริงสิ พอพูดถึงอาหารทะเล ฉันก็นึกอะไรขึ้นมาได้"
90101020-57 = "เมื่อก่อน รุ่นน้องจากกองทหาร RABBIT เคยไปช่วยคลี่คลายคดีในหมู่บ้านชาวประมง ก็เลยได้กุ้งคุณภาพดีเป็นของตอบแทนมาเพียบเลยละ"
90101020-58 = "หืม? หมายความว่ายังไงน่ะ?"
90101020-59 = "อ่า สมัยที่พวกเราอยู่สำนักควบคุม เคยมีช่วงหนึ่งที่ D.U. ขาดแคลนกุ้งหนักมาก..."
90101020-60 = "ไม่ๆ ฉันไม่ได้ถามเรื่องกุ้งอะไรนั่นสักหน่อย!"
90101020-61 = "นิโกะ นี่เธอแอบติดต่อกับพวกรุ่นน้องอยู่คนเดียวโดยไม่บอกพวกเราเหรอ?"
90101020-62 = "ไม่ยุติธรรมเลย~ ฉันก็อยากถามไถ่สารทุกข์สุกดิบกับพวกรุ่นน้องเหมือนกันนะ"
90101020-63 = "ฉะ... ฉันไม่ได้จะแอบติดต่อคนเดียวสักหน่อย"
90101020-64 = "ก็เราใช้โทรศัพท์มือถือในสำนักควบคุมกันไม่ได้นี่นา พอมิยาโกะจังส่งจดหมายมาหาเป็นครั้งคราว แล้วฉันก็คอยตอบกลับ สุดท้ายก็เลยได้ติดต่อกันทางจดหมายมาตลอดน่ะ"
90101020-65 = "อ่า... ที่แท้ก็เป็นแบบนี้เอง"
90101020-66 = "ยุคนี้แล้วยังส่งจดหมายกระดาษอยู่อีก มิยาโกะจังนี่เอาใจใส่จริงๆ เลยนะ"
90101020-67 = "ใช่ ไม่ว่าจะอยู่ในสถานการณ์แบบไหน ความเอาใจใส่ก็ถือเป็นข้อดีใช่มั้ยล่ะ?"
90101020-68 = "ถึงบางครั้งถ้ามันมากเกินไป ก็อาจกลายเป็นข้อเสียได้ก็เถอะ"
90101020-71 = ""
90101020-72 = ""
90101020-73 = "ก็จริงนะ... ไม่มีอะไรที่จะมีแต่ด้านดีอย่างเดียวหรอก"
90101020-74 = "อ่า แต่พอรู้ว่าได้กุ้งกลับมาเป็นกอง ก็น่าอิจฉาจังเลยนะ~"
90101020-75 = "จะมีที่ไหนที่ปูขาดตลาดบ้างมั้ยนะ? งั้นคราวนี้อาจจะได้ปูฟรีก็ได้..."
90101020-76 = "คิดอะไรไม่เข้าท่าแบบนั้นน่ะ? ถึงกับหวังให้เกิดเรื่อง แค่เพราะอยากได้ของกินเนี่ยนะ"
90101020-77 = "ล้อเล่นหรอกน่า ล้อเล่น ไม่เห็นต้องถลึงตาจ้องกันขนาดนั้นเลยนี่?"
90101020-78 = "ยังไงก็เถอะ ฉันอยากกินปูจัง ไม่ใช่แบบกระป๋องหรือไส้กรอก แต่เป็นปูจริงๆ..."
90101020-79 = ""
