[translation]
90101020-1 = "제2화;게살 어육 소시지"
90101020-2 = "샬레 지하, FOX 소대 HQ"
90101020-7 = "FOX 2, FOX 3, 복귀했습니다."
90101020-8 = "다녀왔어~"
90101020-13 = "오우, 수고."
90101020-14 = "그나저나 예정보다 꽤 늦었네."
90101020-15 = "오늘 잠입 예정이었던 발키리 기록 보관소에서 무슨 문제라도 있었던 거야?"
90101020-16 = "아니. 잠입 자체는 문제없이 진행되었어."
90101020-17 = "가져간 경비국 배지도, 학생증도 진짜와 동일한 것을 준비했었으니까."
90101020-18 = "그런데 돌아오는 길에 본관 정문 앞에서 생활안전국 소속으로 보이는 한 학생이 갑자기 우릴 의심하는 거야."
90101020-19 = "눈썰미가 어찌나 좋은건지, 경비국에서는 전에 본 적이 없는 얼굴이라며 우릴 뚫어져라 쳐다보는 게 아니겠어."
90101020-20 = "설마…… 그래서 경비국 녀석들에게 들킨 거야?"
90101020-21 = "아니. 니코가 도넛 이야기로 화제를 돌리니까 언제 그랬냐는 듯 의심을 풀더라고."
90101020-22 = "다만 말을 맞추다 보니 마스터 도넛의 한정 도너츠를 사는 줄에 함께 서는 바람에……"
90101020-23 = "HQ로 돌아오는 데 시간이 좀 더 걸렸어. 미안."
90101020-24 = "미안할 것까지야. 고생 많았네."
90101020-25 = "그나저나 유키노는?"
90101020-26 = "총학생회장이 불러서 간 뒤로 아직 안 돌아왔어."
90101020-27 = "저녁도 총학생회 건물 근처에서 해결하고 온다던데."
90101020-28 = "참, 그러고보니 오토기는 아직 저녁도 못 먹었지?"
90101020-29 = "배고프겠다. 금방 저녁을 준비해줄게."
90101020-30 = "괜찮아. 난 이미 이걸로 때웠으니까."
90101020-31 = "그건……"
90101020-32 = "<요코즈나>의 게살 어육 소시지잖아? 너, 그거 엄청 좋아하네."
90101020-33 = "뭐, 좋아한다기 보다도 먹기에 편리하잖아."
90101020-34 = "유통기한도 길고, 한 개 만으로도 충분히 포만감이 생기고. 무엇보다 먹을 때 냄새나 소리가 거의 나지 않는다는 게 마음에 들어."
90101020-35 = "언제나 기척을 숨기고 식사를 해결해야 하는 저격수— 아니, 암살자의 가장 좋은 선택이라고 할까. 후, 후, 후."
90101020-36 = "……그건 또 누구 흉내를 내고 있는 거야?"
90101020-37 = "안 돼. 아무리 편리하다고 해도 식사를 다른 걸로 때우는 건 용납할 수 없어. 성장기니까 제대로 밥을 먹어야지."
90101020-38 = "잠시만 기다려 줘. 금방 밥을 지어 올 테니까."
90101020-39 = "네~"
90101020-40 = "그나저나 게살이 들어간 어육 소시지면 엄청나게 비싼 거 아냐?"
90101020-41 = "설마, 탄약값을 아껴 간식비로 쓰고 있는 건 아니겠지……?"
90101020-42 = "아냐. 이거 그렇게 안 비싸. 하나에 100엔도 안 한다고."
90101020-43 = "싸구려 게살 통조림도 1000엔은 하는데, 게살 소시지가 100엔도 안 한다고……?"
90101020-47 = "아."
90101020-48 = "이거. 진짜 게살이 아니라, 게살 '맛' 어육 소시지야."
90101020-49 = "뭐……라고?"
90101020-50 = "여기 성분표를 봐. 게살은 1%도 들어가 있지 않잖아?"
90101020-51 = "싸구려 어육에 게살 에센스를 넣어서 풍미를 비슷하게 만든 것뿐이라고."
90101020-52 = "이럴 수가. 요코즈나 게살 소시지에 진짜 게가 들어가지 않는다니……"
90101020-53 = "……방금 내 세상이 무너졌어."
90101020-54 = "호들갑 떨지 마. 처음부터 가격이 그렇게 저렴했을 때부터 의심을 했어야지."
90101020-55 = "세상에 공짜 점심은 없는 법이라잖아?"
90101020-56 = "아, 그러고보니 해산물이라고 하니 떠올랐는데."
90101020-57 = "전에 RABBIT 소대의 후배들이 어촌 마을에서 일어난 사건을 해결해 주고. 질 좋은 새우를 잔뜩 선물 받았다고……"
90101020-58 = "응? 그게 무슨 소리야?"
90101020-59 = "아. 우리가 교정국에 있었을 때의 일인데, 한 때 D.U.에서 새우 공급이 끊긴 적이 있었다고—"
90101020-60 = "아니, 새우의 이야기가 아니라!"
90101020-61 = "니코 너, 우리한테는 알리지도 않고 후배들과 혼자서 연락을 하고 있었던 거야?"
90101020-62 = "치사해~ 나도 후배들이랑 안부 주고받고 싶었는데."
90101020-63 = "트, 특별히 혼자만 연락을 하려고 한 건 아니었어."
90101020-64 = "교정국에서는 휴대 전화를 쓸 수 없잖아? 그래서 미야코 쨩이 가끔 보내오는 편지에 답장을 하다 보니 자연스럽게 펜팔을 주고 받게 되어서."
90101020-65 = "아…… 그런 거였나."
90101020-66 = "요즘 같은 시대에 종이 편지라니, 미야코 쨩도 성실하네."
90101020-67 = "맞아. 어떤 상황에서든 성실한 게 장점인 아이잖아?"
90101020-68 = "너무 과해서 가끔 단점이 될 때도 있지만."
90101020-73 = "……그러게. 무엇이든 좋은 것만 가져갈 수는 없으니까."
90101020-74 = "아아, 그나저나 새우를 잔뜩 선물 받았다니 부럽네~"
90101020-75 = "어디 게 공급에 문제가 생긴 곳은 없으려나? 그럼 이번에는 공짜 게를 선물 받을 수 있을지도 모르는데—"
90101020-76 = "그게 무슨 불순한 소리야? 먹을 것에 눈이 멀어 사건이 생기길 바란다니."
90101020-77 = "농담이야, 농담. 그렇게 도끼눈을 뜨고 볼 필요는 없잖아?"
90101020-78 = "여하튼 게 먹고 싶다, 게. 통조림이나 소시지가 아닌 진짜 게—"
90101020-86 = "아, 유키노."
90101020-87 = "게다."
90101020-91 = "……뭐?"
90101020-95 = "지금부터 게를 상대하러 간다."
90101020-97 = "다음화;게와 드럼통"
