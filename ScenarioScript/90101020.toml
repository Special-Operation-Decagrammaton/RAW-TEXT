[translation]
90101020-1 = "第2話;蟹味魚肉香腸"
90101020-2 = "夏萊地下．FOX小隊HQ"
90101020-6 = ""
90101020-7 = "FOX2、FOX3，已歸隊。"
90101020-8 = "我們回來了～"
90101020-9 = ""
90101020-11 = ""
90101020-12 = ""
90101020-13 = "哦～辛苦了。"
90101020-14 = "不過比預定時間晚了不少呢。"
90101020-15 = "今天在預定潛入的女武神記錄保管庫那邊，發生了什麼問題嗎？"
90101020-16 = "沒有，潛入本身進行得很順利。"
90101020-17 = "畢竟事先準備的警備局徽章和學生證，都是足夠以假亂真的仿製品。"
90101020-18 = "不過回程的途中在本館正門前，有個看似生活安全局所屬的學生突然對我們起疑心。"
90101020-19 = "那個人的觀察力真的很不尋常……#n說什麼之前在警備局沒見過我們這些面孔，就這樣一直死死地盯著我們不放。"
90101020-20 = "不會吧……所以被警備局那些傢伙識破了？"
90101020-21 = "那倒是沒有。#n仁子把話題轉到甜甜圈上，那個人就好像什麼事都沒發生一樣，不再懷疑我們了。"
90101020-22 = "不過為了配合對方的話題，只好一起跟著去排隊買MasterDonut的限定甜甜圈……"
90101020-23 = "所以返回HQ的時間才會延後。抱歉。"
90101020-24 = "不用道歉啦，辛苦你們了。"
90101020-25 = "話說回來，雪乃呢？"
90101020-26 = "被聯邦學生會長叫去之後還沒回來。"
90101020-27 = "他說晚餐也會在聯邦學生會大樓附近自己解決。"
90101020-28 = "對了，御伽你也還沒吃晚餐吧？"
90101020-29 = "你一定餓壞了吧，我馬上幫你準備晚餐。"
90101020-30 = "沒關係，我已經用這個解決了。"
90101020-31 = "那是……"
90101020-32 = "「橫綱」的蟹味魚肉香腸？你還真喜歡那個呢。"
90101020-33 = "嗯，與其說喜歡，不如說吃起來很方便呢。"
90101020-34 = "除了保存期限長之外，只要吃一根就能獲得足夠的飽足感……#n最重要的是，吃的時候幾乎不會產生味道或聲音，這點我很中意。"
90101020-35 = "對於總是得隱藏氣息，解決用餐問題的狙擊手──#n不，暗殺者來說簡直是最好的選擇，呵呵呵。"
90101020-36 = "……你那又是在模仿誰啊？"
90101020-37 = "不行。就算再方便，我也不能容許用那些東西隨便打發正餐。#n正值成長期就得好好吃飯才行。"
90101020-38 = "稍等一下，我馬上把飯煮好拿過來。"
90101020-39 = "好～"
90101020-40 = "話說回來，加了蟹肉的魚肉香腸不是會很貴嗎？"
90101020-41 = "該不會是省下彈藥費拿去買零食了吧……？"
90101020-42 = "才不是。這個沒那麼貴，一根連100元都不到呢。"
90101020-43 = "便宜的蟹肉罐頭都要1000元了，蟹肉香腸竟然連100元都不到……？"
90101020-44 = ""
90101020-46 = ""
90101020-47 = "啊……"
90101020-48 = "這個並不是真的加了蟹肉……而是蟹肉「風味」的魚肉香腸。"
90101020-49 = "你說……什麼？"
90101020-50 = "你看這裡的成分表，蟹肉連1%都不到吧？"
90101020-51 = "只是在便宜的魚肉裡添加了蟹肉香精，把味道做得很像而已。"
90101020-52 = "怎麼會這樣……橫綱蟹味香腸裡竟然沒有放真正的螃蟹……"
90101020-53 = "……我的世界就在剛才崩塌了。"
90101020-54 = "別大驚小怪的，從看到價格那麼便宜的時候就該懷疑了吧。"
90101020-55 = "不是說天下沒有白吃的午餐嗎？"
90101020-56 = "啊，說到水產我突然想到……"
90101020-57 = "之前RABBIT小隊的後輩們解決了漁村發生的事件，#n於是就收到了大量優質的蝦子當作謝禮呢……"
90101020-58 = "嗯？那是怎麼回事？"
90101020-59 = "啊，這是我們還在矯正局裡的事了。#n聽說D.U.的蝦子供應鏈曾經一度中斷──"
90101020-60 = "不是，我問的不是蝦子的事！"
90101020-61 = "仁子，你竟然瞞著我們私下和後輩們聯絡？"
90101020-62 = "太狡猾了～我也想和後輩們互相問候一下近況耶。"
90101020-63 = "我，我不是刻意要私下聯絡的。"
90101020-64 = "矯正局裡不是不能使用手機嗎？#n所以我會回覆都子醬偶爾寄來的信，結果自然而然地就保持書信往來了。"
90101020-65 = "啊啊……原來是這樣啊。"
90101020-66 = "在這種時代居然還會寫信，都子醬還真是認真呢。"
90101020-67 = "是啊，不管在任何情況下都很認真踏實，這正是那孩子的優點呀？"
90101020-68 = "只是有時候太過認真，反而也會變成缺點就是了。"
90101020-71 = ""
90101020-72 = ""
90101020-73 = "……是啊，畢竟不可能什麼好處都占盡嘛。"
90101020-74 = "啊啊，話說能收到一大堆蝦子當禮物還真讓人羨慕啊～"
90101020-75 = "不知道會不會有哪裡的螃蟹供應出問題呢？#n那樣的話這次說不定就能收到免費的螃蟹當作禮──"
90101020-76 = "那是什麼居心不良的話啊？你是被食物沖昏頭了吧……竟然期待有事件發生。"
90101020-77 = "開玩笑的，開玩笑的啦。用不著那樣瞪我吧？"
90101020-78 = "總之我想吃螃蟹啦，螃蟹。不是罐頭或香腸，而是真正的螃蟹～"
90101020-79 = ""
90101020-85 = ""
90101020-86 = "啊，雪乃。"
90101020-87 = "是螃蟹。"
90101020-88 = ""
90101020-90 = ""
90101020-91 = "……咦？"
90101020-92 = ""
90101020-94 = ""
90101020-95 = "接下來，我們要去對付螃蟹。"
90101020-97 = "下一話;螃蟹與鐵桶"
