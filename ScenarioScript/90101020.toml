[translation]
90101020-1 = "Episode 2;Crab and Fish Meat Sausage"
90101020-2 = "Schale Basement, FOX Squad HQ"
90101020-6 = ""
90101020-7 = "FOX 2, FOX 3 reporting back."
90101020-8 = "Heya."
90101020-9 = ""
90101020-11 = ""
90101020-12 = ""
90101020-13 = "Oh, nice job."
90101020-14 = "But why are you so late?"
90101020-15 = "Did you run into issues at the Valkyrie record archives?"
90101020-16 = "No. The infiltration was flawless."
90101020-17 = "Our Security Bureau badges and student IDs were absolutely identical."
90101020-18 = "But then some Public Safety Bureau student started eyeballing us on our way out. She was kind of blocking the door."
90101020-19 = "I guess she had sharp eyes, from the way she was staring at us. She was clearly thinking something."
90101020-20 = "Wait... The Security Bureau caught you?"
90101020-21 = "Nah. Niko threw her off and started gushing about artisanal donuts."
90101020-22 = "Naturally, I had to commit. We ended up in the line at Master's Donuts to try their limited-edition release. The line wrapped around the block."
90101020-23 = "So, that's why we're late. Sorry about that."
90101020-24 = "Don't be sorry. Good work."
90101020-25 = "I know. Hey, where's Yukino?"
90101020-26 = "She's still meeting with the General Student Council President."
90101020-27 = "And she said she'd eat over there, so we shouldn't wait up."
90101020-28 = "Oh, Otogi... You haven't had dinner yet?"
90101020-29 = "You must be hungry. I'll make you something. Hold on."
90101020-30 = "I'm fine. I've been snacking on this."
90101020-31 = "Isn't that..."
90101020-32 = "Yokozuna's crab and fish meat sausage? You're really into that, aren't you?"
90101020-33 = "Well, it's convenient."
90101020-34 = "It has a long shelf life, and I only need one to feel full. And most importantly, I like how it hardly has a smell. It's silent, too."
90101020-35 = "It's the best choice for a sniper—no, an assassin. One who must always eat in secret. Undetected."
90101020-36 = "...Was that supposed to be an impression of someone?"
90101020-37 = "You're not \"fine.\" No matter how convenient some meat stick is, I can't let you skip a meal. You're still growing, so you need to eat properly."
90101020-38 = "Wait here. I'll make you some food."
90101020-39 = "...Yes, ma'am."
90101020-40 = "By the way, wouldn't a fish sausage be super expensive if it's made with crab?"
90101020-41 = "Are you cutting into the ammo budget to buy yourself snacks?"
90101020-42 = "No. This isn't even expensive. It's less than 100 yen a pop."
90101020-43 = "A cheap can of crab costs 1,000 yen, and you're saying that crab meat sausage doesn't even cost a tenth of that? Let me see."
90101020-44 = ""
90101020-46 = ""
90101020-47 = "Ah."
90101020-48 = "This isn't real crab meat. This is crab meat \"flavored\" fish sausage."
90101020-49 = "What...?"
90101020-50 = "Look at the ingredients. \"CONTAINS LESS THAN 1% CRAB.\""
90101020-51 = "They're lying to you. They just sprayed crab essence, or whatever, on some cheap fish paste."
90101020-52 = "I can't believe it. Yokozuna's crab and fish meat sausage doesn't use real crab...?"
90101020-53 = "...My world's falling apart."
90101020-54 = "Don't be so dramatic. You should have known when you saw how cheap it was."
90101020-55 = "Ever heard the saying, \"There's no such thing as a free lunch\"?"
90101020-56 = "Speaking of seafood..."
90101020-57 = "I heard our juniors in the RABBIT Squad helped people in a nearby fishing village. They were rewarded with premium shrimp."
90101020-58 = "Hm? When was this?"
90101020-59 = "We were locked up in the Corrections Bureau at the time. But, you see, D.U.'s shrimp supply was suddenly cut off—"
90101020-60 = "No, I'm not talking about the shrimp!"
90101020-61 = "Niko, were you talking to our juniors? You didn't tell us?"
90101020-62 = "That's not fair! I wanted to see them too."
90101020-63 = "I-I didn't plan for it to be this way..."
90101020-64 = "You know the Corrections Bureau doesn't allow us to have personal phones. I was just...replying to letters that Miyako sent. It was very casual and sporadic at first, but we became pen pals."
90101020-65 = "Ah... Makes sense."
90101020-66 = "Miyako is so earnest. Imagine sitting down and actually writing a letter."
90101020-67 = "Yeah. It's one of her consistent strengths."
90101020-68 = "And it's a frequent weakness, too. She's been known to take her earnestness too far."
90101020-71 = ""
90101020-72 = ""
90101020-73 = "...Right. I suppose you can't take the good without the bad."
90101020-74 = "Ah, I'm jealous of their shrimp, though..."
90101020-75 = "Maybe we should solve some crab-related mystery. We might get a few good meals out of it."
90101020-76 = "What kind of twisted wish is that? Hoping for an incident just because you have a craving...?"
90101020-77 = "I was kidding. Spare me the glare."
90101020-78 = "Look, now I just want some crab. Not canned, not sausage, but real crab..."
90101020-79 = ""
90101020-85 = ""
90101020-86 = "Ah, Yukino. Welcome back."
90101020-87 = "Crab."
90101020-88 = ""
90101020-90 = ""
90101020-91 = "...What?"
90101020-92 = ""
90101020-94 = ""
90101020-95 = "We're taking on a crab."
90101020-97 = "Next Episode;The Crab and the Drum Barrel"
