[translation]
1006602-1 = "메이드 대 핀치!"
1006602-2 = "(황급히 게임개발부 부실로 향했다.)"
1006602-9 = "게임개발부 부실"
1006602-10 = "[ns] \"아리스?\""
1006602-11 = "용사여…… 정말로 와 버린 것인가……"
1006602-12 = "[s1] \"그야 당연하지. 아리스가 걱정되니까.\"\n[s2] \"그런데, 어디 있어?\""
1006602-15 = "돌아가게, 용사여…… 지금의 아리스는, 누구와도 만날 수 없다네……"
1006602-16 = "[s] \"정말로 무슨 일이라도 있는 거야?\""
1006602-17 = "……"
1006602-18 = "[s3] \"문제가 있다면, 같이 고민하게 해 줘.\"\n[s4] \"아리스의 힘이 되고 싶으니까.\""
1006602-29 = "선생님은 치사합니다…… 그런 말을 해 버리면 아리스도 밖으로 나올 수밖에 없습니다……"
1006602-30 = "[s] \"어…… 안녕, 아리스? 메이드복이네? 웬일이야?\""
1006602-31 = "끄앙……! 선생님이 결국 저주받은 그 단어, <메이드복>을 입에 담아 버리고야 말았습니다!"
1006602-32 = "우으, 메이드복은 아리스에겐 무리입니다! 어떻게 해도 안 되는 겁니다!"
1006602-33 = "원래는 입을 생각도 없었지만, 선생님이 온다고 해서 급히 입었던 건데……"
1006602-34 = "……그러니까 선생님은 아리스가 이렇게 된 것에 대한 책임을 져야 합니다!"
1006602-40 = "선생님! 우선 아리스를 쓰담쓰담 해 주세요!"
1006602-42 = "(일단 아리스를 쓰다듬었다.)"
1006602-43 = "(아리스의 상태가 조금 진정되었다!)"
1006602-45 = "[ns] \"아리스, 일단 무슨 일인지 설명부터 해 줄래?\""
1006602-46 = "그것은……"
1006602-50 = "[ns5] \"그러니까…… 지금 입을 수 있는 옷이\"\n[ns6] \"메이드복밖에는 남지 않았다는 거지?\""
1006602-53 = "네…… 다른 옷은 전부 세탁했고, 미도리가 디자인 참고용으로 마련한 이 메이드복밖에는, 아리스가 입을 수 있는 옷이 없는 겁니다……"
1006602-54 = "하지만 메이드복은 아리스에겐 저주받은 갑옷입니다! 전체 스테이터스에 저하 현상이 일어나고야 마는 겁니다!"
1006602-55 = "과거에 있었던 치열한 사투, 네루 선배와의 일기토, 쓰러지는 동료……"
1006602-56 = "의외로 좋은 장면, 눈물의 향연과 스틸 컷, 마지막에는 석양을 바라보며 날아가는 하늘고래, 특별 CM과 잠깐 실례하겠습니다 광고까지……"
1006602-57 = "[s7] \"아~ 뭐, 그런 일도 있었지.\"\n[s8] \"뭔가 다른 기억이 섞인 것 같은데?!\""
1006602-60 = "아무튼! 그때 이후로 메이드복과 아리스의 상성은 최악을 찍고 만 겁니다……"
1006602-61 = "벌써 제대로 몸이 움직이지 않습니다…… 팔다리가 벌벌 떨리고, 용기 대신 두려움으로 가득합니다……"
1006602-62 = "훌쩍…… 아리스는…… 이대로라면 용사로서의 역할을 수행할 수 없게 되어 버리고 맙니다……"
1006602-63 = "[s] \"그렇다면, 아리스!\""
1006602-64 = "……?"
1006602-65 = "[s] \"우리 함께 메이드복을 극복해 보자!\""
1006602-66 = "극복……이요? 어떻게……?"
1006602-67 = "기왕 메이드복을 입은 김에, 메이드로 클래스 체인지, 입니까?"
1006602-68 = "[s9] \"맞아! 클래스를 바꿔서 메이드로서 움직여 보면,\"\n[s10] \"다시 레벨도 오르고 스테이터스도 회복될 거야!\""
1006602-71 = "우우우…… 정말 가능할지는 모르겠지만…… 선생님의 말이니 믿어 보려고 합니다……"
1006602-72 = "아니, 아리스는 믿고 싶습니다!"
1006602-73 = "그렇다면 아리스는 무엇부터 하면 되는 걸까요……?"
1006602-74 = "[s] \"평소 메이드가 할 법한 일을 하는 게 어떨까?\""
1006602-75 = "메이드가 할 법한 일이요?"
1006602-79 = "메이드는…… 평소에 주로…… 청소를 하는 걸로 알고 있습니다."
1006602-80 = "그 외에도 전투, 파괴, 잠입 등의 역할도 하고 있습니다……"
1006602-81 = "네? 두 번째 것들은 아무래도 좋다고요?"
1006602-82 = "그렇다면…… 아리스, 청소부터 시작하겠습니다!"
1006602-86 = "끄앙! 치워야 할 것이 너무 많습니다!"
1006602-87 = "음료수병이 나뒹굴고, 빈 과자봉지는 여기저기 흩어져 있고, 부실에는 먼지가 가득합니다……"
1006602-88 = "이걸 과연 전부 청소할 수 있을까요. 선생님?"
1006602-89 = "[s] \"하나씩 하나씩, 차근차근 해 보자……\""
1006602-90 = "알겠습니다…… 아리스, 하나씩 차근차근 청소하겠습니다……"
1006602-92 = "선생님, 비닐봉지를 준비해 주세요. 하나로는 안 될 것 같습니다. 몇 장은 필요합니다."
1006602-94 = "끄앙! 과자봉지에서 부스러기가 쏟아졌습니다! 청소기가 필요합니다! 도움!"
1006602-96 = "콜록, 콜록! 먼지를 털었더니 먼지가 더욱 뿜어져 나오기 시작했습니다! 이럴 때는 양동이의 물을 뿌려 먼지를 가라앉혀야 합니다!"
1006602-97 = "네? 여기는 실내니까 함부로 물을 뿌려선 안 된다고요?"
1006602-98 = "그것도 그렇습니다……"
1006602-100 = "(아리스와 함께 어떻게든 부실을 청소했다……)"
1006602-106 = "……"
1006602-107 = "선생님! 드디어 청소를 완료했습니다! 부실이 깨끗해졌습니다!"
1006602-108 = "[ns] \"그리고 아리스도 몸을 잘 움직일 수 있게 된 것 같네.\""
1006602-109 = "어……? 그러고 보니……"
1006602-110 = "굉장합니다, 선생님! 아리스, 더 이상 팔다리가 떨리지 않습니다! 기분도 좋아졌습니다!"
1006602-111 = "이건, 그것이군요? 메이드로서 청소 퀘스트를 완료해서 경험치가 들어오고, 그 결과 레벨업을 하게 되어 스테이터스가 회복된 것이로군요?"
1006602-112 = "[s] \"도움이 되었다니 다행이야.\""
1006602-113 = "아닙니다! 선생님이 없었으면 아리스는 계속 스테이터스가 내려간 채로 쓰러져 있었을 겁니다."
1006602-114 = "역시 선생님은 뭐든지 알고 있는 거네요! 와아!"
1006602-116 = "(그렇게, 기뻐하는 아리스와 함께 게임을 즐겼다.)"
