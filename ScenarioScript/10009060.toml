[translation]
10009060-1 = "제6화;마지막 결착!"
10009060-2 = "교정국 남쪽 지부 제9교정시설"
10009060-8 = "경비국 분들이 이전보다 더 바쁘게 움직이는 거 같네요."
10009060-9 = "아무래도 현재 교정국 시설의 경비 수준은 이전하고 비교를 불허할 정도로 높아졌고."
10009060-10 = "여기서도 와카모가 탈옥해버린다면……."
10009060-11 = "으음, 그건 이제 그냥 실수로 끝나지 않게 될 테니까."
10009060-12 = "덕분에 경비국장이 물 샐 틈 하나 없다고 자신만만해할 정도로 방비가 단단해지긴 했지만……."
10009060-13 = "네, 밀레니엄의 학생분들이 전자 쪽 시큐리티도 체크해 주고 있으니, 이젠 육탄전뿐만 아니라 전자전에서도 최강의 보안을 자랑하게 될 테니까요!"
10009060-14 = "물론 당사자들은 도착하자마자 '여기 보안 수준, 진짜야? 정말?'하고 학을 떼는 표정을 지었지만 말이야."
10009060-15 = "으음, 전부 제대로 돌아가고 있는데. 있을 텐데 말이지……."
10009060-16 = "왜 그래요? 후부키?"
10009060-17 = "뭔가가 좀 석연치 않달까. 조금 마음에 걸리는 게 있는 듯한……."
10009060-18 = "아니, 그냥 신경이 과민해진 탓이겠지. 응."
10009060-25 = "근데, 저기, 잡혀왔을 때부터 계속 아무 말도 없는 게. 어, 엄청 무섭달까."
10009060-26 = "괜찮은 걸까요. 후부키?! (소근소근)"
10009060-27 = "차라리 아무런 말도 안 하는 게 다행일지도 모른다고. 저 녀석. 세 치 혀로 사람을 홀리는 무서운 녀석이니까. (소근소근!)"
10009060-28 = "……그런 건 다 그냥 헛소문이라고 먼저 말했던 건 후부키였잖아요……."
10009060-29 = "그, 그랬나?"
10009060-30 = "하여간!"
10009060-36 = "흠흠!"
10009060-37 = "어쨌거나 거기. 재액의 여우! 미리 경고해두겠는데."
10009060-38 = "여기까지 온 이상, 정말 이제는 딴 맘을 먹지 않는 게 좋을 거야!"
10009060-39 = "댁이 몇 번이나 탈옥한 끝에 이쪽은 시말서는 물론, 유급 휴가에, 학점에, 성과급까지 전부 깎일 판이니까! 이번에야말로 확실하게 대비해 뒀다고!"
10009060-41 = "네? 후부키. 성과급을 받은 적이 있던 가요?"
10009060-42 = "키, 키리노! 일단 여기서 필요한 건 허세라고! 허세! 경고의 의미로!"
10009060-43 = "아, 그, 그렇죠! 네! 저, 저도 위험하니까요! 그……. 이, 이번 일로 반성문을 100장이나 쓰게 되었으니까요!"
10009060-44 = "……으으, 반성문을 100장이나……."
10009060-45 = "키리노! 허세 부리기도 전에 침울해지면 어떡해!"
10009060-46 = "후우……"
10009060-47 = "뭐, 어찌 되었든 간에 이번 발렌타인 데이 축제 속에서, 잘도 문제아들을 날뛰게 만들었네."
10009060-48 = "그건 솔직한 심정으로 감탄하고 있어. 제법이잖아."
10009060-49 = "재액의 여우라는 이름은 허명이 아니다. 이건가?"
10009060-51 = "……."
10009060-52 = "역시 당신, 노리는 건 샬레의 선생이었던 거지?"
10009060-53 = "이유는? 예전에 당했던 거에 대한 복수? 아니면 그냥 치기 어린 분노? 뭐, 뭐가 되었든 간에 상관없지만."
10009060-54 = "어차피 이젠 정말로 탈출할 수 없을 거야. 이번엔 우리 발키리뿐만 아니라, 다양한 학교들이 협력해 주고 있으니까."
10009060-55 = "네! 아무리 재액의 여우 씨라고 해도, 이 정도 경비라면 더는 탈출하지 못할 거예요!"
10009060-56 = "……."
10009060-57 = "여전히 아무런 말도 없다니……."
10009060-58 = "아, 혹시 겁먹은 거야?"
10009060-59 = "하항~ 하긴 어쩔 수 없나. 간신히 교정국에서 탈옥해서 자유를 얻었다고 생각했는데 이렇게 속절없이 잡혀버렸으니까 말이지."
10009060-60 = "우리뿐만이 아니라, 모두의 시선이 교정국에 집중된 지금. 더는 도망칠 수 없는 자기 운명에 체념했다던가, 그런 느낌이려나?"
10009060-62 = "저기……. 후부키, 그 이상은 좀……."
10009060-63 = "응? 왜 그래? 키리노."
10009060-64 = "후부키가 하는 말, 거기까지 해버리면 그게, 플래그……라고 할지."
10009060-65 = "플래그?"
10009060-66 = "뭐야, 키리노. 그런 미신 같은 걸 믿는 거야?"
10009060-67 = "애당초 그런 말도 안 되는 일이 일어날 리가……."
10009060-71 = "뭐, 뭐야?!"
10009060-72 = "무, 무슨 일이죠?!"
10009060-80 = "잠깐! 거기! 교정국 감금 시설 내에 와카모가 있는 거, 확실하지?!"
10009060-81 = "응……?"
10009060-82 = "네? 넷! 여, 여기 있는데요?"
10009060-83 = "그럼 대체 이[ruby=시추에이션] 상황은 [/ruby]뭐야? 왜 축제 현장에 있는 CCTV에 <와카모>가……."
10009060-84 = "잠깐. 심지어 한 명이 아니야?"
10009060-85 = "둘, 셋, 계속 늘어난……다고?"
10009060-89 = "……!! 잠깐, 그건 설마!"
10009060-90 = "키리노! 가면 벗겨봐!"
10009060-91 = "네, 넷?"
10009060-92 = "자, 잠시만요!"
10009060-103 = "아, 들켰다……."
10009060-104 = "누, 누, 누, 누구신가요?!"
10009060-109 = "……당했어! 처음부터 복장만 같고, 대상이 바꿔치기 된 거였다고?!"
10009060-110 = "잠깐, 그럼 와카모 본인은?!"
10009060-111 = "네? 네? 네엣?!"
10009060-116 = "……설마!"
10009060-120 = "아아, 너무나도 오래 걸렸지요."
10009060-121 = "저 와카모, 계속해서 이 순간을, 이때만을 기다려왔답니다."
10009060-122 = "모두의 시선이 한 치의 빈틈 없이 교정국으로 쏠려 있는 지금이야말로."
10009060-123 = "자아, 이젠 직접 제 발로 찾아뵙겠습니다."
10009060-124 = "선.생.님♡"
