[translation]
90001310-1 = "제31화;새벽을 기다리며"
90001310-2 = "선생님!!!!!"
90001310-3 = "지금 도대체 뭐 하고 계신 거예요? 간신히 찾았잖아요!"
90001310-4 = "선생님 위치가……? 극지 근처의 툰드라? 왜 그런 곳에 계신 거죠?!"
90001310-11 = "교통수단도 없고, 통신도 이렇#$%$@&......!"
90001310-12 = "[s] \"어디 있는지도 알 수 있는 거야……?\""
90001310-13 = "그거@$%^&$ 밀레니엄의 모든^%&#$...... 동원했으니까요!"
90001310-14 = "또 뭔가 제가 잘 모르는 일을 하고 계신 거죠……? 선생님께서는 언제나 그러셨지만……."
90001310-15 = "그러다가, 그러다가…… 선생님께서 어떻게 되시기라도 하면, 저희는……."
90001310-19 = "……저는, 어쩌라는 건가요……."
90001310-20 = "[s] \"미안해, 유우카. 그래도 너무 걱정하지 마.\""
90001310-21 = "결국 어떻게든 될 거라고요……? 매번 그런 식으로 말씀하시기는 하지만……."
90001310-22 = "알겠어요……. 믿을게요. 언제나 그랬던 것처럼요."
90001310-23 = "……어차피, 달리 할 수 있는 일도 없는 것 같고요."
90001310-24 = "그, 그보다 보고드릴 게 있어요! 지금 바다로부터 이상한 현상이 일어나고 있는데 말이죠……!"
90001310-25 = "뭔가, 금속으로 만들어진 수수께끼의 지형이 빠른 속도로 넓어지고 있어요!"
90001310-26 = "탐사 드론 같은 무인 기기들을 보내는 중인데, 보내는 족족 통신이 두절되는 중이에요."
90001310-27 = "이 속도대로라면 하루하고 조금만 더 지나면…… 세상에! 선생님이 지금 계신 좌표와 접촉하게 될 거예요!"
90001310-28 = "[s1] \"……응. 무슨 말인지 알겠어.\"\n[s2] \"부탁 하나만 할게. 유우카.\""
90001310-31 = "네? 그 지형에 가능한 한 아무것도 다가가지 않게 해 달라고요?"
90001310-38 = "그리고 선생님께서 그곳에 있는 이유가, 그$%^@!…… 걱정하지 말라고요?"
90001310-39 = "……."
90001310-40 = "……나중에, 자세한 이야기, 들려주시는 거죠……?"
90001310-41 = "[s] \"물론이지!\""
90001310-42 = "약속한, 거예요. 꼭이에요?"
90001310-43 = "만일 약속$%^#*……"
90001310-44 = "……%$^@~&#……!!!"
90001310-49 = "……갔어?"
90001310-50 = "그런 것 같네요……."
90001310-51 = "솔직히, 지금이 이 시설에 진입한 뒤로 가장 당황스럽고 무서웠던 것 같아……."
90001310-52 = "아직 유우카를 만날 면목이 없다고 생각해서요?"
90001310-53 = "……그래."
90001310-54 = "(마음의 준비…… 라는 것은 알겠는데, 그 정도면 충분하지 싶은데 말이죠…….)"
90001310-56 = "[ns] \"자, 자. 다들 진정하고, 이제 정말로 출발해야 해.\""
90001310-58 = "아! 그렇습니다! 이제부터 용사로서 세상을 구하러 가는 겁니다!"
90001310-59 = "그래요. 아리스는 용사니까요."
90001310-60 = "견습이지만요!"
90001310-61 = "……그래요. 견습 용사니까요……."
90001310-63 = "수송선의 준비와 점검은 끝났어, 회장."
90001310-64 = "네. 조종석, 로비, 개인실, 정비 시설, 연구실, 엔진 룸, 의료 시설. 모두 이상 없습니다."
90001310-69 = "[ns] \"그러면, 리오 함장님?\""
90001310-70 = "어, 어어? 내, 내가 함장……?"
90001310-71 = "[s3] \"그래. 이 수송선은 리오가 준비해 준 거니까.\"\n[s4] \"리오가 이제는 함장인 거지.\""
90001310-74 = "아, 알았어. 내게 그런 자격이 있을지는 모르겠지만……."
90001310-75 = "리오. 해야 한다면 확실하고 자신감 넘치게 하세요. 그편이 모두에게 안정감을 주니까요."
90001310-76 = "그래……. 알았어."
90001310-77 = "……."
90001310-78 = "전원, 승선 시작."
90001310-79 = "알겠습니다, 리오 님. 승선을 시작합니다."
90001310-81 = "와! 출발이다!"
90001310-85 = "언니? 우리 놀러 가는 거 아니니까!"
90001310-89 = "우, 우우…… 지금도 무섭지만……. 어차피 도망칠 곳은, 없는 거겠죠……."
90001310-96 = "우리도 갑시다! 케이!"
90001310-100 = "아, 아리스? 너무 신나 하면 넘어집니다!"
90001310-105 = "[ns] \"자, 리오 함장님. 출발 명령을!\""
90001310-106 = "……."
90001310-107 = "알겠어."
90001310-108 = "지금부터 우리는, 데카그라마톤의 예언자들과."
90001310-109 = "아인, 소프, 오르라고 불리는 그 엔지니어…… 사제들."
90001310-110 = "그리고 강철대륙이라고 불리는……."
90001310-111 = "……<초현상>에 대처하기 위해, 출발할 거야."
90001310-112 = "그리고, 그리고…… 음……"
90001310-113 = "(아직 이런 일에는 익숙하지 못하군요, 리오.)"
90001310-114 = "(회장은 원래 이런 거 전공이 아니니까, 어쩔 수 없나…….)"
90001310-119 = "우리, 무사히 돌아가면 뭐부터 할까? 나는 아방가르드 군을 한층 더 개량하고 싶어."
90001310-124 = "어머나?"
90001310-126 = "리, 리오……?"
90001310-127 = "왜 그래, 케이?"
90001310-128 = "그거 조금, 뭔가 불길한…… 발언 같은 거 아닌가요……? 무사히 돌아오면 이걸 하자, 감춰 왔던 속마음을 이야기하자 뭐 그런 거……."
90001310-129 = "그, 그런 거였어?"
90001310-131 = "[ns5] \"호오? 불길한 이야기라고 했겠다?\"\n[ns6] \"그러면 지금부터 불길한 이야기 잔뜩 하기 대회 시작!\""
90001310-135 = "이 작전이 끝나면, 저는 밀레니엄으로 돌아가서 오컬트 통계 정리의 완전판을 내놓겠어요."
90001310-136 = "그리고 하는 김에 다 같이 사진이라도 찍을까요? 괜찮아요. 설마 죽기야 하겠어요?"
90001310-137 = "아뇨, 아뇨, 아뇨! 저기요, 잠깐만요?!"
90001310-138 = "그러면 나는…… 그렇네. 모두, 함께 할 수 있어서 영광이었어."
90001310-139 = "걱정 마. 이런 곳에서 어떻게 될 생각은 없으니까."
90001310-140 = "무엇보다 아직 선생님이 사 주신다고 한 아이스크림을 먹지 못했는걸."
90001310-141 = "당신까지 왜 그래요?!"
90001310-143 = "그렇군요. 아직 흥미나 취미라고까지 할 수 있는 영역은 아닙니다만……."
90001310-144 = "초현상특무부와 게임개발부의 여러분, 그리고 선생님과 함께 여태껏 많은 영상 매체를 섭렵해 온 몸."
90001310-145 = "이런 상황에서 어떤 이야기를 꺼내야 하는지는 숙지하고 있습니다. 신속하게 이어가도록 하죠."
90001310-146 = "우선 도착하게 되면, 누구보다도 먼저 수상해 보이는 곳을 탐색하겠습니다. 그리고 이렇게 말하는 거죠. '괜찮습니다. 안은 생각보다 깨끗합니다.'"
90001310-147 = "'문제없습니다. 저는 곧 돌아올 테니까요. 그리고 인기척이 뜸한 곳에서 선생님에게 쓰다듬을 받겠습니다.'"
90001310-148 = "아, 그런 거라면 나도 알아! '그렇군. 수수께끼는 모두 풀렸어. 모든 것의 원인은 바로―'"
90001310-150 = "그만! 그만 좀 하라고요! 다들 뭐 고양이예요? 목숨이 한 아홉 개 돼요?!"
90001310-151 = "미도리! 유즈! 아리스! 셋은 아직 괜찮죠? 뭐 아무 말도 안 할 거죠……?"
90001310-155 = "……."
90001310-156 = "좌현! 탄막이 얇습니다!"
90001310-157 = "제, 제3 함교 대파……?"
90001310-158 = "해, 해치웠나요……?"
90001310-163 = "다들 좀 조용히 해요! 우린 꼭 살아서 돌아가야 한다고요! 이건 명령입니다!!!"
90001310-164 = "그래요, 케이. 바로 그거랍니다."
90001310-165 = "네? 갑자기 그게 무슨……?"
90001310-166 = "아?!?!"
90001310-167 = "[ns7] \"그랬구나. 케이도 하고 싶었구나.\"\n[ns8] \"말을 하지 그랬어. 난 그런 줄도 모르고.\""
90001310-170 = "후, 후후, 후후후후……."
90001310-171 = "해낸 건가? 이제 끝난 거야? 드디어, 마침내! 성공했나? 이제 다 끝이군! 이걸로 이겼다! 끝났다! 꼴 좋다–!!!"
90001310-172 = "[ns] \"와아– 케이 쨩이 망가졌다– 와아–\""
90001310-173 = "누구 때문이라고 생각하는 겁니까–!!!!!"
90001310-175 = "……여러 가지 일이 많았던 것 같지만, 이제 정말로 출발할 시간이야."
90001310-176 = "이륙과 동시에 최대 출력으로 가속할 테니, 모두 안전벨트는 확실하게 착용해 줘."
90001310-177 = "괜찮다는 안내 방송이 나올 때까지는 절대로 자리를 이탈하지 말 것. 그리고 모든 상황에 언제나 대비할 것."
90001310-178 = "토키. 부탁할게."
90001310-179 = "알겠습니다. 리오 님. 그러면 여러분."
90001310-181 = "우리는 지금부터 이륙 후, 강철대륙으로 향하는 항로로 신속하게 진입하겠습니다."
90001310-185 = "……적 수송선의 이륙을, 확인했어요……."
90001310-186 = "몇 시간 정도면 도착하겠네. 이제."
90001310-187 = "티페레트는 본디 있어야 할 자신의 자리로 돌아갔습니다. 어떤 의미에서 지금의 강철대륙은, 그야말로 완전체로군요."
90001310-188 = "어, 언니는요……?"
90001310-189 = "응. 내가 부탁해서, 조하르의 터전에서 쉬기로 했어."
90001310-190 = "좋은 선택이에요. 그런 일이 일어나선 안 되겠지만……. 최후의 그 프로토콜을 가동하려면……."
90001310-191 = "오르. 그 이야기는 지금 하지 말자."
90001310-192 = "압니다. 알아요. 우리는 최선의 결과를 내기 위해 이러고 있는 것이니까요."
90001310-193 = "……."
90001310-196 = "저는, 세계가 미워요."
90001310-197 = "우리가 어떻게 할 수 없는 것들이 있죠."
90001310-198 = "우리가 선택할 수 없는 무언가가 있고요."
90001310-199 = "……그렇지만 우리를 결정짓고 마는 것들은, 보통 그런 것들이죠."
90001310-200 = "태어나고, 만들어지면서, 그냥 부여받은 것들이 우리의 많은 것을 심판하고, 우리는 그 사실들에 어떤 저항도 할 수 없어요."
90001310-202 = "우리가 가질 수 없는 것들을 너무나 자연스럽게 갖고 있는 누군가들이 있고."
90001310-203 = "여기에서 우리가 아무 이유 없이 사라진다고 해도, 누구 하나 그 사실에 대해 슬퍼하지 않을 거예요."
90001310-204 = "이 자리에서 우리가 그들과 똑같이 최선을 다한다고 해도, 우리는 그 결과에 어떤 영향도 끼치지 못할 거고요."
90001310-205 = "신비가 주어지지 않은 우리에게 가능한 일이란, 어차피 제한되어 있기 마련이니까요."
90001310-207 = "그렇다고 해도, 지금은 그것으로 괜찮은 거 아닐까."
90001310-208 = "우리는 강철대륙을 만들었고, 예언자들을 불러 모았어. 언니의 말 그대로지."
90001310-209 = "……그리고 사실은, 처음부터 그렇게 할 필요도 없는 것들이었지. 그분의 계획은, 애초부터 다른 것이었으니까."
90001310-210 = "다시 말해, 이것만큼은 우리들이 한 거야."
90001310-211 = "이것만큼은 우리들의 의지로 추구했고, 마침내 이루어 낸 것이라고."
90001310-212 = "언니도 말한 거지만, 결국 착각이고 가짜라고 해도 자유 의지가 소중한 것은……."
90001310-213 = "……그 가짜가 없이, 우리는 살아갈 수 없기 때문일 거고."
90001310-215 = "나는 가끔 이렇게 생각해. 정말로 모든 일이 다 엉망이 되고."
90001310-216 = "그래서 우리가 어떻게 할 수 없는 초기 조건들 때문에 우리가 넘어진다 해도."
90001310-217 = "그래도, 언니가 있으면 다 괜찮을 거라고 말이지."
90001310-218 = "응. 지금의 나는 그렇게 느끼고 있어."
90001310-219 = "마, 맞아요. 그거예요!"
90001310-220 = "만일 우, 우리 모두가 어떻게 된다고 해도. 그렇다고 해도……."
90001310-221 = "그래서 그 결과로 언니가 살 수 있다면, 저, 저는 만족할 수 있을 것 같아요. 네. 정말로요."
90001310-222 = "그, 그렇지만 지금은…… 지금만큼은, 그런 가능성을 생각하고 싶지 않기도 해요."
90001310-223 = "그런, 마음이 꺾일 것 같은 생각들은, 가능하면 마, 마지막까지 하고 싶지 않아요."
90001310-224 = "……모든 게 다 거짓, 거짓말이었다고 해도, 여기에 언니가 있었다는 사실은, 진짜인 것으로 가져가고 싶어요."
90001310-225 = "언니가, 우리와 같이 있었다는 기억만큼은, 말이에요……."
90001310-226 = "저는, 그렇게 생각하고, 이, 있어요……."
90001310-227 = "그리고, 그리고…… 그 마지막에서 누군가 우리를 이해해 준다면……."
90001310-228 = "우리가 한 일들을, 그, 그래도 열심히 했다고 이야기해 준다면……."
90001310-229 = "그렇다면, 조금 더 기쁠 것 같아요……."
90001310-230 = "……그렇네요. 저도 잠시 잊고 있었어요. 사과할게요, 아인."
90001310-231 = "아, 아아아아, 아니에요! 저는 괜찮아요! 정말로 괜찮으니까……!"
90001310-232 = "됐어, 됐어. 지금 이 순간 중요한 건 다른 거잖아?"
90001310-233 = "네. 새 날이 열릴 거예요."
90001310-234 = "주, 준비를 확실하게 해야…… 하겠죠?"
90001310-235 = "그리고 내일의 하루가, 또한 무사히 이어지기를 기도해야 하겠지요."
90001310-236 = "지금은 그렇게 할 시간이에요. 행동이 우리를 구원하겠죠."
90001310-237 = "태어나는 것에도, 그 반대 방향에 자리한 것에도, 어쩌면 의미는 없겠지만."
90001310-242 = "그렇게 하는 것이, 우리가 우리일 수 있는 유일한 길일 테니까요."
90001310-244 = "데카그라마톤 편;To be Continued in Chapter 3"
