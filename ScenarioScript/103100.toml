[translation]
103100-1 = "제10화;하늘로"
103100-12 = "좋은 소식이 있어. 선생님."
103100-13 = "일단 가장 중요한 정보인데……"
103100-14 = "오퍼레이터들의 의상이 단 하루 만에 완성되었다는 거지."
103100-15 = "[s] \"오, 오오……?!\""
103100-31 = "[ns] \"이것이 오퍼레이터 복장이구나!!\""
103100-33 = "어…… 저기…… 이 옷은 꼭 필요한 건가요?"
103100-34 = "으응♡ 우주전함의 오퍼레이터잖아요? 장르의 규칙을 지켜야 한다는 강력한 요청이 있어서……."
103100-36 = "누구의 요청인가요, 그건."
103100-37 = "우주전함은 아닌 걸로 판명 나지 않았나요……."
103100-38 = "……하아. 나는 대체 왜……."
103100-39 = "크크……. 뭐어, 운명을 받아들이라구. 그런 두꺼운 매뉴얼을 외울 수 있으면서도, 하필이면 여기 있었던 탓이니까. 운이 나빴다고 생각해."
103100-41 = "린 선배…… 코트 잘 어울려요."
103100-45 = "……어째서 저만 다른 디자인인 거죠?"
103100-46 = "[s] \"그야 린은 [ruby=캡틴]선장[/ruby] 역할이니까. 롱코트가 당연하잖아!!\""
103100-47 = "……."
103100-48 = "아하하…… 잠깐 입는 거라고 생각하면 그럭저럭 괜찮은 것 같지만……."
103100-49 = "후후. 네. 여기 계신 분들은 다차원해석을 계산하고 검증하는 중요한 역할을 맡아야 해요."
103100-50 = "게다가 이건 단순한 옷이 아니라, 착용자의 뇌파와 맥박 등등의 신체 컨디션을 탐지해서 업무 수행에 문제가 없게 서포트하는 기능이 포함되어 있거든요."
103100-51 = "그 외에도 방염, 방폭, 방수 등등…… 다양한 기능도 추가되어 있죠. 말하자면 오퍼레이터 전용 장비 같은 거죠."
103100-53 = "뭔가 쓸데없는 기능이 덕지덕지 붙은 리모컨 같은 느낌 아닌가요?"
103100-54 = "이 디자인에 방수 기능? 의미 있는 거야, 그거?"
103100-55 = "자아, 자아♡ 저희 시간이 없으니까요. 빨리 다음으로 넘어가죠."
103100-57 = "……네."
103100-64 = "지금부터 저희는 <우트나피쉬팀의 배>를 타고 키보토스 상공 75,000m에 있는 <아트라하시스의 방주>로 돌입,"
103100-65 = "방주를 점령해서 기능을 무력화시키고, 무사히 지상으로 돌아와야 합니다."
103100-66 = "이 작전에 참여하는 분들은 다음과 같습니다."
103100-71 = "오퍼레이터 우라와 하나코, 아마우 아코."
103100-75 = "오퍼레이터 오쿠소라 아야네, 하야세 유우카."
103100-79 = "오퍼레이터 오니카타 카요코. 아케보시 히마리."
103100-83 = "오퍼레이터 유라키 모모카, 이와비츠 아유무."
103100-87 = "……그리고 <우트나피쉬팀의 배>의 총괄 책임, 저 나나가미 린입니다."
103100-88 = "[s] \"잘 부탁해!\""
103100-89 = "그리고 우트나피쉬팀의 배가 발진한 뒤에, 지상에 남아 항공관제 및 기술 지원을 맡아주실 분들은……."
103100-94 = "밀레니엄 학원의 베리타스의 오토세 코타마, 오마가리 하레."
103100-98 = "코누리 마키, 카가미 치히로. 그리고……."
103100-102 = "……엔지니어부의 네코즈카 히비키, 시라이시 우타하, 토요미 코토리입니다."
103100-104 = "다음은 방주에 돌입한 뒤, 혹시 모를 습격을 방어하고, 점령 지원을 도울 분들은,"
103100-109 = "아비도스 대책위원회의 타카나시 호시노, 쿠로미 세리카, 이자요이 노노미입니다."
103100-110 = "아하하. 잘 부탁드려요."
103100-111 = "응~ 맡겨 달라구."
103100-112 = "좋아! 준비는 만전이야!"
103100-113 = "응응! 시로코 쨩을 구하러 가는 거예요."
103100-115 = "네. 대책위원회 여러분들은 스나오오카미 시로코의 신변을 확보해야 하기 위해서도 자원해 주셨습니다."
103100-116 = "그리고……."
103100-123 = "현재 이 배의 유일한 무장인 레일건의 소유자, 게임개발부의 텐도 아리스. 그리고……."
103100-131 = "사이바 모모이, 사이바 미도리, 하나오카 유즈. 점령 지원 및 혹시 모를 상황에 도움을 주시기로 했습니다."
103100-132 = "자, 잘 부탁드립니다……."
103100-134 = "하아…… 어쩔 수 없네. 내가 얘네들 챙길 수밖에."
103100-135 = "안전이 제일 중요해! 알겠지?"
103100-137 = "그리고 마지막으로……."
103100-138 = "으잉? 또 있어?"
103100-151 = "사람들의 식사를 책임질 게헨나 급양부의 아이키요 후우카와…… 미식연구회입니다."
103100-152 = "저기, 잠깐만! 이상하잖아! 흐름이 뭔가 이상하잖아!"
103100-154 = "후후후. 잘 부탁드려요. 여러분."
103100-155 = "기다려, 어째서 내가 여기 있는 거야?"
103100-156 = "영문을 모르겠어. 우주전함이라니 전혀 어울리지가 않잖아?"
103100-157 = "백번 양보해서 식사를 위해서라면…… 그래, 이해할 수도 있거든? 그런데 주리는 없고 대신 미식연구회가 왜 있는 거야?"
103100-158 = "후후후. 당연한 이야기를 하시네요. 후우카 씨."
103100-159 = "그야, 평생 먹을 수 없는 음식을 먹을 기회가 눈앞에 있기 때문이죠."
103100-161 = "평소에는 절대……?"
103100-162 = "네. 저희가 여기 있는 이유는 언제나 동일합니다."
103100-163 = "그것은 미식에 대한 탐구!!"
103100-164 = "즉, 우주에서 먹는 음식은 얼마나 맛있을까! 그것을 탐구하기 위해서입니다!!"
103100-168 = "맞아!! 우주에서 먹는 음식이라니, 엄청 신기하잖아! 언제 그런 걸 먹어보겠어!"
103100-169 = "영화에서 봤다구. 둥둥 떠다니는 주스 방울을 빨대로 빨아 먹는 거. 그거 해보고 싶었거든."
103100-171 = "그러니까 즉, 와장창★인 거죠."
103100-173 = "그렇습니다. 우주 식량이라면, 무중력을 상정한 특수한 음식."
103100-174 = "액체류의 취급은 물론, 조리가 불가능한 특수 환경, 그리고 혹시 모를 돌연변이를 막기 위한 멸균 과정 등, 고려해야 할 게 많은 심오한 장르죠."
103100-175 = "그렇기 때문에……"
103100-180 = "바로 그걸 위해서 후우카 씨가 여기 계신 겁니다!!"
103100-185 = "그러니까 어째서 나냐고……!?"
103100-186 = "혹시 몰라서 급양부 트럭도 여기에 실어두었거든요. 그러니까 후우카 씨가 없으면 안 되는 거죠."
103100-187 = "뭐?! 우리 급양 트럭도……!? 그, 그건 언제……?!"
103100-188 = "좀 더 자랑스러워해도 된다고. 산과 강은 물론이고 이제 우주까지 진출하는 거잖아?"
103100-189 = "맞아! 그 정도 경험을 해본 트럭이 어디 있겠어? 무중력인데!!"
103100-190 = "아니…… 그런 경험 필요 없거든……."
103100-191 = "[s1] (………….)\n[s2] (무중력이 되는 고도까진 올라가진 않을 거지만.)"
103100-196 = "……. 선생님. <우트나피쉬팀의 배>의 기동은 원래 생텀 타워의 힘으로만 가능하다고 합니다."
103100-197 = "카이저 PMC가 이 배를 발굴한 직후, 생텀 타워를 장악하려고 했던 것도 그 이유 때문이었겠죠."
103100-198 = "생텀 타워가 파괴된 지금, 이것을 기동할 수 있는 존재는 <싯딤의 상자>를 소유하고 있는 선생님, 당신뿐입니다."
103100-199 = "[s] \"응. 알고 있어.\""
103100-200 = "……그럼 부탁드리겠습니다."
103100-202 = "……네. 저의 능력으로 이 오파츠를 깨우는 건 가능해요."
103100-203 = "하지만…… 이건 지금까지와는 다른 물건이에요. 저는 괜찮아도……."
103100-204 = "이 오파츠가 지니고 있는 힘이…… <싯딤의 상자>의 주인인 선생님에게 전해질 거예요……."
103100-205 = "[s] \"괜찮아, 아로나.\""
103100-206 = "서, 선생님의 육체는 평범한 일반인의 것이에요……! 총알 하나로도 선생님은 위험해질 수 있다구요!"
103100-207 = "[s] \"그치만 그때마다 아로나가 날 지켜주었잖아.\""
103100-208 = "그, 그치만 이건…… 그것보다 더……."
103100-212 = "다시 한번 생각해 보세요, 선생님…… 선생님의 몸에 어떤 부하가 전해질지 저도 알 수 없는데……."
103100-214 = "……하지만 그 전에 한가지 경고하겠습니다."
103100-215 = "이것을 사용하는 순간 [USERNAME] 선생, 당신의 육체는 돌이킬 수 없는 피해를 입을 겁니다."
103100-216 = "두 번 다시 이것을 사용하기 전의 상태로 돌아갈 수 없을 겁니다. ……어쩌면 죽을 수도 있겠죠."
103100-217 = "그럼에도 상관없습니까?"
103100-218 = "그 결말이 뻔히 보이더라도, 말입니까?"
103100-223 = "[ns] \"괜찮아. 아로나. 부탁할게.\""
103100-227 = "어, 어째서 그런……."
103100-229 = "……어째서 그렇게까지 하는 겁니까?"
103100-230 = "이 파멸은 막지 못합니다. 이것은 이미 아주 오래 전에 결정되었다는 것이 제 분석입니다."
103100-231 = "즉, 스나오오카미 시로코. 그녀가 이 세계에 존재한 순간부터, 결정되었다."
103100-232 = "시간은 불연속하며, 결정된 인과를 반복할 뿐."
103100-233 = "우리 모두는 그런 결정론 속의 장기말일 뿐인 겁니다."
103100-234 = "……."
103100-235 = "이것을 막고 싶었다면, 선생이여."
103100-236 = "과거로 돌아가서 시로코를 죽이기라도 했었어야죠. 큭큭큭큭……."
103100-240 = "당신은 제가 당신을 절대 이해하지 못할 거라고 말했죠. 네. 저는 아직도 이해할 수 없군요."
103100-241 = "이미 확정된 미래를 바꿀 수 있다고 생각하는 겁니까? 어째서 불가능한 미래로 나아가는 겁니까?"
103100-242 = "……그러니 지금 다시 한번 묻겠습니다."
103100-247 = "어째서?"
103100-251 = "[ns] \"…………….\""
103100-253 = "[ns3] \"어른으로서 아이를 지킨다. 선생으로서 학생을 지킨다.\"\n[ns4] \"어른의 책임을, 선생의 의무를 다해야 하니까.\""
103100-257 = "……그것이 어떤 방법이라고 할지라도,"
103100-258 = "어떤 대가를 치르더라도 말입니까?"
103100-259 = "[s5] \"그것이 어떤 방법이라고 할지라도.\"\n[s6] \"어떤 대가를 치르게 될지라도.\""
103100-262 = "……."
103100-263 = "학생을 구하러 갑니까? [USERNAME] 선생이여."
103100-268 = "[ns] \"그래.\""
103100-271 = "선생님……?"
103100-275 = "[ns] \"……린, 궁금한 게 있어.\""
103100-276 = "네? 아아…… 네. 말씀하십시오."
103100-277 = "[s] \"두 번째 화두에 대해서야.\""
103100-281 = "<이해하지 못하는 것을 통해서 이해할 수 있는가> 총학생회장이 했던 그 질문 말입니까……? 네. 기억하고 있습니다만."
103100-282 = "[s] \"……린은 그때 목적어로 어떤 걸 넣었어?\""
103100-283 = "……. 갑자기 그 질문은…… 왜……."
103100-284 = "그때 저는……."
103100-285 = "……."
103100-290 = "……린 쨩."
103100-295 = "아마도 우리는 영원히 서로를 이해하지 못할 거야."
103100-296 = "린 쨩에게 나란 존재는, 어쩌면 그런 것일지도 몰라. 이해할 수 없는 불가해한 사람……."
103100-297 = "우리는 서로 닿지 못한 채로 영원히 어긋난 길을 나아갈 수밖에 없겠지."
103100-298 = "그게 아마도 이 세계의 핵심인 것 같아."
103100-300 = "……하지만 그래도 괜찮아."
103100-301 = "상대가 이해하지 못하는 존재여도,"
103100-302 = "어쩌면 서로가 서로에게 실체가 없는 풍문 같은 것일 뿐이라고 해도."
103100-303 = "응. 서로 건너갈 수 없는 고립된 섬 사이에서 불어오는 바람 같은 것이어도……."
103100-305 = "……린 쨩. 그래서 나는 린 쨩이 완성시킨 문장이 마음에 들어."
103100-306 = "그러니 그 질문은 내가 소중히 간직하고 있을게."
103100-307 = "응…… 우리는……."
103100-312 = "[ruby=타인]이해하지 못하는 것[/ruby]을 통해서 [ruby=·]우[/ruby][ruby=·]리[/ruby][ruby=·]들[/ruby][ruby=·]을[/ruby] 이해할 수 있을까?"
103100-319 = "……. 그 대답은, 지상으로 돌아간 뒤에 말씀드려도…… 될까요?"
103100-320 = "[s] \"응. 그거면 돼. 고마워.\""
103100-325 = "[ns] \"그럼 이제 출발하자.\""
103100-333 = "[ns] 우트나피쉬팀의 기동 장치에 싯딤의 상자를 연결한다."
103100-339 = "메인 파워 기동 확인했습니다!"
103100-348 = "메인 컨트롤 시스템 구동 완료……!!"
103100-349 = "각 구역별 통신 시스템 체크, 연산 시스템 체크…… 올 클리어. 여기까진 매뉴얼대로야!"
103100-358 = "엔진 시스템 클리어."
103100-359 = "다차원해석 시스템 체크 완료. 올 클리어예요!"
103100-368 = "모든 관제 시스템 체크, 올 클리어. 됐어, 이걸로 모두 사용 가능해!"
103100-369 = "발진 준비 모두 완료! 명령 대기 중!"
103100-370 = "선생님, 발진 명령을 내려주십시오……!"
103100-371 = "[ns7] \"우트나피쉬팀의 배, 발진!!\"\n[ns8] \"우주전함, 우트나피쉬팀의 배. 발진!!\""
103100-381 = "지금부터 <우트나피쉬팀의 배>, 지상으로 상승합니다!!"
103100-396 = "고도 상승. 현재 780m……!"
103100-397 = "다차원해석 시스템은? 지금이야?"
103100-399 = "지금 계산 끝났어요, 하나코 씨."
103100-400 = "계산 완료. 다차원해석 시스템, 시작합니다!"
