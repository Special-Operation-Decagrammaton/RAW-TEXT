[translation]
2601402-1 = "일일외식록 카린"
2601402-2 = "여기서 바람 부는 방향으로 조금 더……."
2601402-3 = "아니, 반대 방향이 적당하려나……."
2601402-4 = "[s] \"카린.\""
2601402-5 = "아, 선생님."
2601402-6 = "온 줄 모르고 있었군. 미안하다."
2601402-7 = "음? 뭘 메모하고 있었냐고?"
2601402-8 = "아, 그게…… 이 광장의 저격 포인트를, 조금."
2601402-9 = "아니, 딱히 맡은 임무가 있는 건 아니고, 일종의 습관 같은 거다. 작전이 시작되면 늘 하는 일이라서……."
2601402-10 = "[s] \"그치만 오늘은 휴일이잖아?\""
2601402-11 = "뭐, 그, 그렇다만."
2601402-12 = "[s1] \"휴일에는 잘 쉬는 게 무엇보다 중요해.\"\n[s2] \"이건 압수야.\""
2601402-15 = "앗, 메, 메모지를 가져가 버리면……!"
2601402-16 = "으음…… 하지만 선생의 말도 틀린 건 아니니……."
2601402-17 = "알겠어. 그럼 오늘은 휴일이니 임무와 관련된 건 그만두지."
2601402-18 = "……그럼 뭘 해야 할지……."
2601402-19 = "[s] \"평소 임무가 끝나면 뭘 하는데?\""
2601402-20 = "뒷정리를 하고, 다음 임무를 준비한다든가."
2601402-21 = "혹은 아르바이트도 꾸준히 하고 있다만……."
2601402-22 = "[s] \"취미활동은?\""
2601402-23 = "그, 글쎄, 청소 정도?"
2601402-24 = "으음, 하지만 그것도 엄밀히 말하면 임무의 연장선이라 할 수 있으니, 취미라고 하기엔 어렵겠군……."
2601402-25 = "그러고 보면 마땅히 휴식이라고 할 만한 행동은 없는 것 같다."
2601402-26 = "[s] \"그러면 안 되지!\""
2601402-30 = "[ns] \"카린에게는 휴식이 필요해!\""
2601402-31 = "어…… 그, 그런가……?"
2601402-32 = "딱히 육체적으로 힘들거나 하진 않다만……."
2601402-33 = "응? 지금은 몰라도, 언젠가는 다 돌아오기 마련이라고?"
2601402-34 = "신경통에 목 결림, 만성피로……? 무슨 소리인지……."
2601402-35 = "뭐, 어쨌든 알겠다."
2601402-36 = "모처럼 메이드복이 아닌 교복을 입은 김에, 선생님 말대로 휴식하도록 하겠어."
2601402-37 = "다만, 어떻게 해야 할지 모르겠으니 선생님이 조금 도와줬으면 한다."
2601402-38 = "[s] \"물론, 그렇다면 우선…….\""
2601402-42 = "[ns] \"맛있는 걸 먹자!\""
2601402-45 = "축제인가…… 그렇군. 학교의 행사와 연계해서 열린 모양이지."
2601402-46 = "축제와는 그다지 인연이 없었다만……."
2601402-47 = "선생, 그럼 이곳에서 식사하는 건가?"
2601402-48 = "[s] \"길거리 노점 음식이 은근히 별미라고.\""
2601402-52 = "[ns] \"먹고 싶은 게 있으면 얼마든지 말해.\""
2601402-53 = "일단 좀 둘러봐야 알 것 같으니, 같이 한 바퀴 돌기로 하지."
2601402-55 = "맛있는 꼬치구이 있습니다~"
2601402-56 = "핫도그나 야끼소바도 있어요~"
2601402-57 = "꼬치구이도, 핫도그, 야끼소바…… 맛있어 보여."
2601402-58 = "좋아, 결정했다. 선생님, 난 저 꼬치구이를 먹겠어."
2601402-59 = "두 개 주세요."
2601402-60 = "예이! 감사합니다!"
2601402-61 = "자, 선생님 거. 받아."
2601402-62 = "[s] \"서툴러…….\""
2601402-63 = "뭐가?"
2601402-67 = "[ns] \"카린은…… 욕망을 해방하는 방식이 서툴러!\""
2601402-68 = "으, 읏?!"
2601402-69 = "가, 갑자기 그게 무슨 소리야……?"
2601402-70 = "[s] \"꼬치구이, 핫도그, 야끼소바 전부 두 개씩 주세요!\""
2601402-71 = "예이! 감사합니다~"
2601402-72 = "여기 있습니다~!"
2601402-73 = "그, 그렇게 전부 다 사 버려도 괜찮은 거야……?"
2601402-74 = "응? 모처럼 스트레스를 푸는 건데, 자제하기 시작하면 오히려 쌓여 버린다고?"
2601402-75 = "말이 안 되는 건 아닌데…… 으음……."
2601402-76 = "그럼 고맙게 받도록 할까."
2601402-77 = "저쪽의 벤치에서 먹도록 하지."
2601402-79 = "꼬치구이, 맛있다. 선생님도 먹어 봐."
2601402-80 = "야끼소바도 나쁘지 않고……."
2601402-81 = "선생님 말대로, 꼬치구이 하나만 샀다면 조금 아쉬웠을지도 모르겠어."
2601402-82 = "[s] \"후후, 여기 핫도그도 먹어보라고.\""
2601402-83 = "좋아, 그럴까."
2601402-84 = "음, 이쪽도 맛있는걸."
2601402-85 = "[s] \"다행인걸. 그럼…….\""
2601402-89 = "앗! 선생님, 조심해, 떨어뜨린다!"
2601402-94 = "자, 잡았다."
2601402-95 = "[s] \"나이스, 카린!\""
2601402-96 = "아, 근데, 그, 잡긴 잡았는데……."
2601402-99 = "[wa:400]― [log=카린 교복]서, [wa:750]선생님, [wa:820]자, [wa:500]잠깐만![/log]"
2601402-100 = "[wa:2140]― [log=카린 교복]이거 이대로 주기엔, [wa:1150]뭐랄까……![/log]"
2601402-103 = "[wa:500]― [log=카린 교복]내, [wa:2000]내 [wa:650]다리로 잡은 거라서 [wa:1890]조금…….[/log]"
2601402-104 = "[wa:2900]― [log=카린 교복]이건 [wa:300]내가 먹고, [wa:1570]선생님은 [wa:620]다른 쪽을……![/log]"
2601402-107 = "[wa:1650]― [log=카린 교복]……아.[/log]"
2601402-108 = "[wa:1400]― [log=카린 교복]이건 이미 [wa:760]내가 [wa:700]한 입 먹은…….[/log]"
2601402-111 = "[wa:550]― [log=카린 교복]아, [wa:400]아니! [wa:850]그런 의미가 [wa:750]아닌데……![/log]"
2601402-114 = "― [log=카린 교복]역시 [wa:400]이걸로…… [/log]"
2601402-115 = "[wa:1000]― [log=카린 교복]……! [wa:1460]아, [wa:300]아니아니![/log]"
2601402-118 = "[ns3] \"지, 진정해 카린. 나는 다 좋으니까…….\"\n[ns4] \"이해하고 있어. 카린만 괜찮다면 나도 괜찮으니까.\""
2601402-119 = "[wa:830]― [log=카린 교복]진짜로 [wa:700]그런 [wa:750]의도가……![/log]"
2601402-120 = "[wa:830]― [log=카린 교복]진짜로 [wa:700]그런 [wa:750]의도가……![/log]"
2601402-123 = "― [log=카린 교복]어, [wa:1410]어떤 걸 줘도, [wa:2600]뭔가……![/log]"
2601402-124 = "[wa:1940]― [log=카린 교복]으으…… [wa:1440]나는 [wa:940]어떻게 해야……![/log]"
2601402-127 = "(겨우 카린을 진정시키고 함께 핫도그를 먹었다…….)"
2601402-129 = "크, 크흠, 잠깐 당황했지만, 이제 됐어. 완전히 진정했다."
2601402-130 = "핫도그도 맛있었고."
2601402-131 = "[s] \"응, 맛있었지…….\""
2601402-132 = "큭, 선생님의 감상이 어딘가 부끄럽다만……."
2601402-133 = "어, 어쨌든 오늘은 고마웠어."
2601402-134 = "덕분에 제대로 된 휴일을 보낸 느낌이다."
2601402-135 = "다음에도, 휴식하는 법을 가르쳐 줬으면 좋겠군."
