[translation]
1006806-1 = "잘 자 레이사"
1006806-2 = "슬럼가"
1006806-3 = "(혹시나 하는 마음에, 레이사가 순찰 중이라는 슬럼가로 향했다.)"
1006806-7 = "(레이사의 말대로, 텅 빈 슬럼가에는 전혀 인기척이 느껴지지 않았다.)"
1006806-11 = "으헤헤……. 더는 못 먹습니다……. 히히……."
1006806-17 = "[ns1] 조심스레 어깨를 흔든다.\n[ns2] \"이런 데에서 자면 입 돌아가.\""
1006806-20 = "으히히……. 선생님까지……."
1006806-21 = "선생님……."
1006806-22 = "……선생님?"
1006806-23 = "……? 음?"
1006806-24 = "우와아아아아아아앗-!!!"
1006806-25 = "서, 선생님!? 선생님께서 어떻게 여기 계신 거죠!? 으, 으음!? 어라!? 엉!?"
1006806-26 = "네? 혼자 있을 거 같아서 와 보셨다고요!? 그, 그야 보통 이런 건 혼자서 하니까……."
1006806-27 = "아, 아니! 그게 아니고! 선생님께서 오실 일은 없는데요! 애초에 아마 별일 없을 거 만약의 차원에서 온 것뿐이라……!!"
1006806-28 = "[s3] \"나도 만약의 차원에서 온 거야.\"\n[s4] \"신경 쓰지 마. 놀러 왔다고 생각해.\""
1006806-31 = "그, 그런……걸로 되는 건가요……? 뭔가 이상한데……."
1006806-32 = "네? 이런 일을 자주 하는 편이냐고요? 아뇨. 자주까지는 아니고……"
1006806-33 = "자, 자꾸 말을 돌리지 마세요! 날도 추운데, 선생님께서 이런 곳에 계시다니요! 돌아가시는 겁니다! 지금 바로!!"
1006806-34 = "[s5] \"싫은데.\"\n[s6] \"그럴까 싶어 방한 도구들도 다 챙겨왔지.\""
1006806-37 = "무, 무슨 캠핑이라도 온 것처럼……."
1006806-38 = "예? 서로 졸고 있을 때 깨워주려면 두 명은 있어야 하지 않겠냐고요? 그, 그야……. 음……."
1006806-39 = "으, 으음……. 어쩔 수 없나……. 아니. 아무리 그래도 선생님이신데……."
1006806-43 = "모, 모르겠다……."
1006806-44 = "그럼 잘 부탁드립니다!!"
1006806-46 = "(그렇게 레이사와 서로의 졸음을 쫓아주며 순찰을 돌았다.)"
1006806-47 = "(예상했던 대로 다행히 아무 사건 사고도 일어나지 않아, 새벽 공기를 맞으며 귀환했다.)"
1006806-54 = "결국 아무 일도 없었군요. 후후. 뭐, 이럴 거라 예상은 했지만요."
1006806-55 = "네? 아쉽냐고요? 하하! 그럴 리가요! 이건 무조건 좋은 거잖아요!"
1006806-56 = "오히려 계속 이런 날들이 많아져서……. 자경단 일 같은 것 안 해도 되면 좋을 것입니다."
1006806-57 = "……그런 말을 했었죠. 제가 존경하는 사람 중 한 분이!"
1006806-58 = "……여, 역시 밤을 새운 게 조금 잠이 오긴 하지만……."
1006806-59 = "으흐, 흐흐……."
1006806-65 = "[ns7] 레이사를 똑바로 세워준다.\n[ns8] \"아직은 자면 안 돼, 레이사.\""
1006806-69 = "오옷! 죄송합니다! 제 정신 좀 봐요. 또 이렇게 해이해진 모습을 보여드리다니……."
1006806-70 = "그런데 선생님은……. 어쩐지 멀쩡하시네요? 피곤하지 않으신 건가요?"
1006806-71 = "네? 하루 정도는 괜찮으시다고요? 펴, 평소에 어떤 삶을 살아오신 겁니까……."
1006806-72 = "……아."
1006806-73 = "[ns9] \"……레이사?\"\n[ns10] \"왜 그래?\""
1006806-79 = "……저기 봐요, 선생님."
1006806-84 = "……해가 떠요."
1006806-87 = "[wa:1500]― ……뭔가, [wa:1400]신기한 [wa:500]기분이네요. [wa:2100]이렇게……."
1006806-89 = "[wa:600]― 누군가와 같이, [wa:1700]해 뜨는 걸 보는 건 [wa:800]처음이라서……."
1006806-92 = "[wa:1000]― 그러고 보니 [wa:1300]누군가랑 둘이서 [wa:1200]보낸 시간도……."
1006806-94 = "[wa:2000]― 어쩌면 [wa:1800]이번이 제일 길었을지도……. [wa:1800]하하."
1006806-97 = "[wa:200]― 으음……."
1006806-99 = "[wa:600]― 또 이상한 말을 [wa:1000]해버린 것 같네요……."
1006806-102 = "[wa:950]― 실은 [wa:400]지금도 [wa:700]좀 졸려서……."
1006806-104 = "[wa:1000]― 제가 [wa:900]무슨 말을 하고 있는지 [wa:1100]잘……."
1006806-107 = "[wa:200]― 그, [wa:800]그래도 [wa:200]선생님은…. [wa:2000]뭐든지 알아주시니까……."
1006806-110 = "[wa:700]― 이번에도……"
1006806-112 = "[wa:800]― 언제나처럼, [wa:1200]알아주세요. [wa:2000]헤헤……."
1006806-115 = "[wa:200]― 음……. [wa:1800]좋네요……."
1006806-118 = "[wa:800]― 선생님……. [wa:1900]감사합니다……. [wa:2000]히히……."
1006806-122 = "흐에……. 선생님……."
1006806-124 = "(결국 잠든 레이사를 업고 샬레로 돌아갔다.)"
1006806-125 = "(휴게실에서 충분히 재운 뒤, 집으로 돌려보냈다.)"
