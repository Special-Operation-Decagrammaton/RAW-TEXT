[translation]
10039050-1 = "제5화;전쟁의 서막"
10039050-3 = "하아, 하아……. 하아……. 하아……."
10039050-11 = "헉…… 헉……. 헉헉……."
10039050-17 = "자, 잠깐……! 잠깐만요……! 잠시 스톱……!!"
10039050-21 = "……? 무슨 일이시죠, 사쿠라코 님?"
10039050-22 = "아직 곡이 나오고 있는 중입니다. 의견이 있다면 한 번 다 돌고 나서 하시는 게……."
10039050-23 = "그, 그게 아니라! 이상해요. 뭔가 이상하다고요!"
10039050-24 = "지금 저희는 연습을 하고 있는 거죠? 강사님께 배웠던 춤을 맞춰 보고 있는 중이죠?"
10039050-25 = "……?"
10039050-26 = "네. 그렇습니다만, 무슨 문제라도 있습니까?"
10039050-27 = "그……. 저도 이쪽에 대해 잘 아는 사람이라곤 안 하겠습니다만, 그래도 전에 몇 번 인터넷에서 찾아본 적이 있습니다."
10039050-28 = "이런 연습 같은 걸 할 때에는, 활동하는 전문 아이돌들도 체육복이나 운동복 같은 걸 입고하더군요."
10039050-29 = "지금 저희처럼……. 이런 아이돌 복장이 아니고 말이죠."
10039050-31 = "그래서요?"
10039050-32 = "그래서……라니요? 방금 말씀드린 게 본론입니다만."
10039050-33 = "체육복이나 연습복을 입고 연습을 하는 게 훨씬 편하잖습니까. 어째서 아이돌 복장을 입고 연습을 하고 있는 거죠, 저희는?"
10039050-34 = "방금 스스로 답을 말씀하셨지 않습니까. 바로 그렇기 때문입니다."
10039050-35 = "그쪽이 '편하기' 때문이죠. 편한 만큼 제대로 된 연습이 어려울 것이고요."
10039050-36 = "네? 그게 무슨 말도 안 되는……."
10039050-37 = "사쿠라코 님. 혹 이런 말을 아십니까?"
10039050-38 = "……\"연습은 실전처럼, 실전은 연습처럼.\""
10039050-39 = "……!! 그, 그건……!!"
10039050-40 = "사쿠라코 님께서 하신 말씀의 의도는 이해했습니다. 하지만 공교롭게도 저희는 말씀하신 그런 <전문 아이돌>들이 아닙니다."
10039050-41 = "그분들은 이미 무대 의상에도 익숙하기 때문에 춤만 배우면 되는 거죠. 저희는 아니지 않습니까?"
10039050-42 = "그, 그건 그렇지만……! 아니, 그래도 뭔가 이상한데……!!"
10039050-44 = "연습은 실전처럼!!!"
10039050-45 = "크윽……!!! 정론 반복……!!"
10039050-46 = "아, 아니……!! 아무리 그래도 지금 너무 진도가 안 나가지 않습니까!"
10039050-47 = "저희에게는 남은 시간도 얼마 없는데, 이대로라면 시간 내로 다 숙지하지 못할 수도 있다고요!"
10039050-48 = "차라리 다시 마리에게 연락해서 연습에 대한 조언이나 부탁을……."
10039050-49 = "여기서 또 마리 씨를 찾는 겁니까!!"
10039050-50 = "……!?"
10039050-51 = "그러잖아도 이번 일은 거의 다 마리 씨께 맡겨 놓고, 또 마리 씨에게 도움을 구한다니 당치도 않습니다!!"
10039050-52 = "언제까지 그녀를 귀찮게 하시려는 겁니까!? 그렇게 매번 일이 생길 때마다 그녀를 곤란하게 했나요!?"
10039050-53 = "에……. 아, 아뇨. 저는 딱히 그런 뜻은……."
10039050-54 = "사쿠라코 님이 그런 뜻이건 아니건, 사쿠라코 님이 마리 씨를 부르면 그게 그것이 됩니다!"
10039050-55 = "선배이자 상급자이지 않습니까! 조금은 자신의 행동이 타인에게 무게가 된다는 걸 자각하셔야 합니다!!"
10039050-56 = "화, 확실히……. 그건 전에도 몇 번……."
10039050-60 = "그, 그럼 마리 말고 선생님께……."
10039050-61 = "또, 또! 또-!"
10039050-62 = "이, 이번에는 또 뭡니까……."
10039050-63 = "또 그렇게 금방 타인의 도움만 찾고!! 인터넷 검색으로 쉽게 얻으려 하기나 하시고!!"
10039050-64 = "주변으로부터 도움을 받기 위한 움직임도 노력이라는 걸 부정하진 않겠습니다만, 가끔은 스스로도 해답을 찾으셔야지요!!"
10039050-65 = "아시겠습니까? 저희는 이미 마리 씨와 선생님께 너무나 많은 짐을 짊어지게 해 드렸단 말입니다."
10039050-66 = "여기서부터는 저희 둘이서! 알아서! 스스로 해결해야 할 난관들입니다! 그 난관에서 도망치지 마십시오! 사쿠라코 님!!"
10039050-68 = "크윽……!!!"
10039050-69 = "그렇지만……. 말씀은 저도 십분 이해하지만……!! 이대로라면 기한 내에 완성이……!!"
10039050-70 = "물론 그렇지요."
10039050-71 = "걱정하시는 바는 저 또한 가슴 깊이 통감하고 있습니다. 하지만 그렇다 해도 더 이상 다른 분들께 폐를 끼칠 수는 없어요."
10039050-72 = "오히려 이제부터는, 다른 분들이 도움을 준다 하셔도 사쿠라코 님과 제가 거절하며 스스로의 힘으로 해내야 할 때입니다."
10039050-73 = "그래야 도와주신 분들도, 무대 위에 선 저희의 모습을 보며 흡족해하시지 않겠습니까?"
10039050-74 = "……네……."
10039050-75 = "이제부터는 다른 분들께 연락하지 마십시오, 사쿠라코 님. 아니, 오히려 연락이 온다 해도 못 본 척하십시오."
10039050-76 = "이번 일이 끝날 때까지만……입니다. 그 정도만이라도."
10039050-77 = "네……. 알겠습니다……."
10039050-78 = "흠……."
10039050-79 = "그렇지만 해결……. 해결이라고는 해도……."
10039050-80 = "저희 두 사람의 스탭이 꼬이거나 노래 박자가 안 맞는 것에 대한 해답을, 어떻게 저희들 스스로 찾을 수 있는 걸까요?"
10039050-81 = "애초에 저희들은 아이돌이라는 것에 대해 너무나도 무지합니다. 아이돌이 무엇으로 이루어졌는지도 모르죠."
10039050-82 = "……그……."
10039050-83 = "누차 말씀드렸지만, 저는 그 정도는 아닙니다. 사쿠라코 님……. 가끔이지만 아이돌 그룹의 노래도 듣고, 방송도 본다고요……."
10039050-84 = "그럼 미네 님은 아시는 겁니까? 다른 그룹에는 있지만 지금 저희 그룹에는 없는 것을?"
10039050-85 = "음……. 그, 그건……."
10039050-86 = "……? 음?"
10039050-87 = "……아."
10039050-88 = "……아?"
10039050-89 = "뭔가 생각 나신 게 있으신 건가요, 단장님?"
10039050-90 = "그게……. 음……. 잠시만요. 생각을……."
10039050-91 = "……음. 그렇네요. 확실히, 이건 유의미한 차이가 있을 수 있겠어요."
10039050-92 = "유의미한 차이……?"
10039050-93 = "그렇습니다. 사쿠라코 님. 다른 아이돌 그룹들에는 있지만 저희에겐 없는 것."
10039050-94 = "동시에 여러 사람을 묶어주고, 행동이나 스타일을 맞추거나 리드하기 위해 필요한 요소."
10039050-98 = "……바로 아이돌 그룹의 <리더>입니다."
10039050-99 = "그룹의…… 리더……?"
10039050-100 = "리더……라고 하심은……. 조직의, 아니 그룹의 지도자를 말씀하시는 걸까요?"
10039050-101 = "맞습니다. 유닛들이 너무 각자의 개성으로 흩어지거나 움직임이 따로 노는 것을 막아주고, 방향성을 제시해 주는 중요한 역할이죠."
10039050-102 = "지금까지 왜 그 생각을 못 한 건지……! 그야 리더가 없으니 당연히 그룹이 일사불란하게 움직이기 어렵겠지요."
10039050-103 = "음. 그렇죠. 확실히 조직에는 지도자가 필요하지요. 저도 납득이 가는군요."
10039050-104 = "그러면 저희 중에 누가 그룹 지도자를……. 역시 저보다 잘 아시는 미네 단장님께서……?"
10039050-105 = "아니요. 이건 그렇게 간단하게 생각할 수 있는 문제가 아닙니다."
10039050-106 = "아이돌 리더는 단순히 오래 했다거나 잘 아는 걸로 결정할 수 있는 개념이 아니거든요."
10039050-107 = "역설적으로 이 일을 처음 벌이시고, 주도적으로 진행하신 사쿠라코 님이 저보다 더 잘 맞으실 수도 있지요."
10039050-108 = "……이건 꽤 어렵군요. 당장 결정하기는 어려운 사안입니다."
10039050-109 = "조금이라도 시간을 들여서, 각자의 생각을 정리해 볼 필요가 있을 것 같습니다."
10039050-110 = "마침 사쿠라코 님도 조금 피로해 보이시는데, 쉬는 시간을 가질 겸 고민을 해 보는 게 어떻겠습니까?"
10039050-112 = "티 안 내려고 했는데 알고 계셨습니까……. 송구하네요."
10039050-113 = "알겠습니다. 그러면 그렇게 하도록 할까요."
10039050-114 = "……우선 옷은 다시 좀 갈아입고요."
10039050-123 = "……그러면 그렇게 하도록 하지요."
10039050-124 = "2시간 뒤에, 트리니티 광장 중앙 분수대 앞에서……."
10039050-125 = "네. 그러시지요. 그곳에서……."
10039050-127 = "……저희 그룹의 지도자를 결정하는 자리를 가지는 것입니다."
10039050-133 = "지도자 결정이라니……. 뭐, 틀린 말은 아니지만……."
10039050-134 = "선생님이나 다른 분들께는 비밀로……라는 것도 잘 기억하고 있습니다."
10039050-135 = "이것은 어디까지나 저희들 간의 이야기."
10039050-136 = "저희 둘 중 누가 그룹의 지도자가 될지를 결정하는 자리로……."
10039050-140 = "쭉 생각해 온 거지만, 사쿠라코 님, 표현하시는 단어들이 참……."
10039050-141 = "……? 네? 무슨 단어요……?"
10039050-142 = "아닙니다. 사소한 이야기였으니 넘어가시죠. 시간에는 엄수해 주십시오."
10039050-143 = "그럼 저는 먼저 이만……."
10039050-151 = "?"
10039050-158 = "……모처럼의 평온한 날이로군요."
10039050-159 = "날씨도 너무나 깨끗하고, [ruby=카니발]사육제[/ruby]도 순조롭게 진행되고 있고……."
10039050-160 = "올해는 왠지 다른 학우분들도 더 열심히 참여해 주시는 것처럼 보인달까."
10039050-161 = "……마치 홍차의 맛이 한 층 더 깊어지는 것만 같은 기분입니다."
10039050-162 = "아니, 어쩌면 사실이겠지요. 홍차의 맛은, 홍차 자체에만 한정되는 이야기가 아니니까요."
10039050-166 = "……하아."
10039050-167 = "이렇게 좋은 날, 미카 씨는 또 어딜 갔는지 보이지도 않고……. 뭐, 보나 마나 어딘가 바깥에서 놀러 다니고 있겠지만요."
10039050-168 = "세이아 씨도 방에서 쉰다고만 하고……. 정말 아까워요. 이런 날 정도는 초대를 하려고 했는데 말이죠."
10039050-169 = "이렇게 좋은 날인데……."
10039050-170 = "이렇게 평화롭고, 아무 일도 없는 화창한 날……."
10039050-171 = "흠……."
10039050-172 = "그러네요. 어쩌면 제가 매번 두 사람을 부르기만 해서 그러는 걸지도 모르겠어요."
10039050-173 = "가끔은 제가 직접 찾아뵈는 것도 좋겠지요."
10039050-174 = "오늘의 업무 타임만 조용히 잘 넘어간다면, 두 사람을 찾아가서……."
10039050-181 = "나기사 님!! 나, 나기사 님……!!!"
10039050-182 = "후……. 몇 번이나 말씀드리지 않습니까. 그런 식으로 점잖지 못하게 들어오지 말라고요."
10039050-183 = "여러분도 엄연한 티파티의 일원이시니, 조금 더 소속감과 에티켓을 상기하시고……."
10039050-184 = "죄송합니다, 나기사 님……."
10039050-185 = "그, 그렇지만 사안이 사안인 지라……!!"
10039050-186 = "……사안?"
10039050-187 = "무슨 일이라도 있는 건가요?"
10039050-188 = "학원제의 진행과 관련된 일이라면, 어지간한 경우 모두 지원하며 학우분들이 즐기시게 두라고 말씀드렸을 텐데요."
10039050-190 = "그게……. 그쪽이 아니라 정보원 학생에게서 보고가……."
10039050-191 = "……? 정보원……?"
10039050-192 = "네. 방금 막 입수된 첩보입니다."
10039050-193 = "시스터후드의 수장인 우타즈미 사쿠라코와, 구호기사단의 단장인 아오모리 미네가……."
10039050-194 = "2시간 뒤, 트리니티 광장에서 두 그룹의 \"통합 지도자\"를 결정하기 위한 자리를 마련한다고……!!"
10039050-198 = "……?"
10039050-199 = "……예???"
10039050-200 = " 그게 무슨 말씀이시죠? 시스터후드와……. 구호기사단……?"
10039050-201 = "통합 지도자……라니요? 그분들이 어째서 갑작스레 그런 일을 벌인다는 거죠?"
10039050-202 = "자, 자세한 건 저희도 잘……."
10039050-203 = "첩보부의 예측에 따르면, 논의 때 분위기가 마치 결투를 암시하는 듯했다고……."
10039050-204 = "……결투?"
10039050-208 = "이제 와서, 그것도 하필 이런 시기에 그분들이 통합 지도자를 뽑는다는 말이 이해가 잘……."
10039050-213 = "(……아니……. 잠시만요…….)"
10039050-214 = "(하필 이런 때……? 지금처럼 저희 티파티가 사육제 준비로 모든 힘이 분산돼 있을 때……?)"
10039050-215 = "(확실히 지금 같은 타이밍에, 저 두 조직이 새로운 연합 조직으로 거듭난다면 저희보다도 그 규모가…….)"
10039050-216 = "(………….)"
10039050-217 = "(…………………….)"
10039050-218 = "……!!!!"
10039050-220 = "아, 아니……. 아니죠. 아닙니다. 후후……."
10039050-221 = "저도 이제 예전 같은 사람이 아니니까요. 나름대로 성장하겠다고 다짐했으니까요."
10039050-222 = "잃어서는 안 되겠지요. 신뢰를, 타인에 대한 믿음을."
10039050-223 = "……직접 연락을 드려 보도록 할까요."
10039050-229 = "……안 받으시는군요, 사쿠라코 님."
10039050-230 = "그럼 미네 님은……."
10039050-236 = "……으음……."
10039050-237 = "……모모톡으로 연락을 남겨 볼까요."
10039050-238 = "\"티파티의……키리후지 나기사입니다…….\""
10039050-239 = "\"갑작스러운 일이라 죄송합니다만……. 묘한 소문이 돌고 있어…….\""
10039050-240 = "\"미네 단장님과 사쿠라코 님께서 함께 뭔가 하신다는 이야기를 들었습니다만……. 사정을 알려주실 수 있을까요……?\""
10039050-241 = "……전송……"
10039050-247 = "……? 어라……. 통화는 안 받으셨는데, 모모톡은 받으셨군요."
10039050-248 = "어떤 답변이……."
10039050-249 = "\"관심을 가져주셔서 감사합니다만…….\""
10039050-250 = "\"이건 어디까지나 저희들 간의 일입니다. 티파티는 신경 쓰지 않으셔도 좋습니다.\""
10039050-251 = "……?"
10039050-255 = "나, 나기사 님……?"
10039050-256 = "…………."
10039050-257 = "나기사 님. 어떻게 할까요? 나기사 님……?"
10039050-258 = "…………."
10039050-259 = "……미카 씨를……."
10039050-260 = "……네?"
10039050-264 = "……미카 씨를 찾아오세요. 지금 당장입니다."
10039050-266 = "(남은 시간 동안 트리니티 교내를 돌며, 학생들이 준비한 이벤트를 관람하고 있었다.)"
10039050-270 = "[ns1] (꽤 오래 돌았는데도, 한참 더 남았네.)\n[ns2] (학교의 규모만큼이나 행사도 많구나.)"
10039050-275 = "[ns3] (……? 갑자기 연락?)\n[ns4] 휴대전화를 꺼내, 연락을 받는다."
10039050-279 = "……생님……."
10039050-280 = "선생님……!"
10039050-281 = "다행이다! 연락을 받아 주셨군요……!"
10039050-282 = "[s5] \"마리……? 왜 그렇게 다급한 목소리야?\"\n[s6] \"무슨 일이야? 바람 소리가 들리는데?\""
10039050-285 = "가, 갑자기 연락드려서 죄송해요, 선생님! 그렇지만 실제로 다급한 일이라……!!"
10039050-290 = "아, 바람 소리 때문에 잘 안 들리는 건 죄송해요. 지금 오토바이를 타고 있어서……!"
10039050-294 = "[ns7] \"……예?\"\n[ns8] \"뭘 타고 있다고……?\""
10039050-297 = "괜찮으시다면 지금……. 아니, 가급적 꼭……. 말씀드릴 장소로 와 주실 수 있을까요?"
10039050-298 = "자세한 건 뵙고 나서 말씀드릴게요. 시간이 얼마 없어요!!"
10039050-299 = "정확한 상황은 저도 잘 모르겠지만……. 이상한 소문이……!!"
10039050-300 = "어쩌면……."
10039050-301 = "어쩌면 오늘……. 저희 트리니티에서……."
10039050-305 = "내전이 일어날지도 몰라요!!"
