[translation]
1013806-1 = "작은 리본"
1013806-2 = "(그날 오후.)"
1013806-3 = "(레나가 부탁한 액세서리 재료와 초코 바나나 크레이프를 들고 오컬연 기숙사로 향했다.)"
1013806-6 = "아. 어서 와, 선생님."
1013806-7 = "선배들은 오늘 좀 늦게 온댔어."
1013806-8 = "분명 예술에 숨은 오컬트를 찾겠다며 또 이상한 장난을 꾸미고 있겠지."
1013806-9 = "[s] \"레나는 왜 안 따라갔어?\""
1013806-10 = "선배들이 없는 틈에 조용히 내 작업을 하려고 했지."
1013806-11 = "그런데 가게 임시 휴업이라니…… 하아."
1013806-12 = "하여간 이 학원엔 정상인이 없어. 여기서 3년을 버텨야 한다니……."
1013806-13 = "[s] \"자! 이 초코 바나나 크레이프라도 먹으면서 기운 내!\""
1013806-14 = "사 오지 말랬더니 결국 사 왔네."
1013806-15 = "뭐, 고마워……."
1013806-20 = "이, 이거 맛있네. 어디서 사 온 거야?"
1013806-21 = "[s] \"사실 사 온 게 아니라 직접 만들었어.\""
1013806-22 = "뭐? 저, 정말?!"
1013806-23 = "[s] \"어때? 맛있지?\""
1013806-24 = "응……. 마, 맛있긴 한데……."
1013806-25 = "……."
1013806-26 = "확실히…… 맛있을…… 지도."
1013806-27 = "샤아아악! 모, 몰라! 갑자기 이상한 거 묻지 마, 이 바보!!"
1013806-33 = "(레나는 그렇게 화를 내며 말했지만, 전부 먹어주었다.)"
1013806-35 = "으, 으음. 당분도 채웠으니 이제 일할 거야."
1013806-36 = "[s1] \"액세서리 만든다고 했지?\"\n[s2] \"어떤 걸 만들 거야?\""
1013806-39 = "리본 머리핀."
1013806-40 = "[s3] \"그러고 보니 레나는 리본을 많이 달고 있던데.\"\n[s4] \"리본 좋아해?\""
1013806-43 = "뭐…… 그렇게 좋아하진 않는데……."
1013806-44 = "하나둘 달기 시작했는데 정신을 차려보니 이렇게 많아졌다고 할까."
1013806-45 = "이제 리본을 적게 달면 뭔가 찝찝하다고 할까……."
1013806-46 = "[s5] \"그러니까 부적 같은 거구나!\"\n[s6] \"역시 레나도 오컬연이었네!\""
1013806-49 = "샤아아악! 시끄러워! 그런 거 아니야!"
1013806-50 = "이건 어디까지나 패션이라고, 패션!"
1013806-51 = "[s] \"그런데 지금도 많이 달고 있는데, 또 만들려고?\""
1013806-52 = "작아서 잘 떨어지거든. 그러니까 예비로 만들어둬야 허전하지 않아."
1013806-53 = "아무튼 지금부터 작업 시작할 거니까, 이제 선생님도 일하러 가."
1013806-54 = "오늘 우리 학원에 온 것도 일 때문이었잖아."
1013806-55 = "[s7] \"아직은 괜찮아. 그러니까…….\"\n[s8] \"레나가 리본 만드는 거, 구경해도 돼?\""
1013806-58 = "……응?"
1013806-59 = "하, 하지만 이거…… 단순 반복 작업이라 재미없을 텐데?"
1013806-60 = "그래도 보고 싶다면……."
1013806-64 = "조, 좋아. 마음대로 해."
1013806-65 = "대신 방해하면 안 된다? 알겠지?"
1013806-68 = "[wa:1650]― [log=레나]있지, [wa:1390]난 어렸을 때부터 [wa:820]손재주가 좋았어. [/log]"
1013806-70 = "― [log=레나]리본 같은 걸 만들어서, [wa:1710]친구에게 주곤 했지.[/log]"
1013806-73 = "[wa:1150]― [log=레나]다들 좋아해 줘서 [wa:1420]기뻤어.[/log]"
1013806-75 = "― [log=레나]……그렇게 깨달은 거야.[/log]"
1013806-78 = "― [log=레나]이렇게 작은 것으로도,[/log]"
1013806-80 = "― [log=레나]누군가를 기쁘게 할 수 있구나, [wa:2150]라고.[/log]"
1013806-83 = "[wa:1140]― [log=레나]그래서 [wa:1080]패션 디자이너를 꿈꾸게 됐던 거야.[wa:160] [/log]"
1013806-86 = "― [log=레나]내가 디자인한 옷이라든가 [wa:1590]악세서리를,[wa:80] [/log]"
1013806-88 = "― [log=레나]모두가 즐겨주면 [wa:1720]나도 기쁘니까.[/log]"
1013806-91 = "[wa:710]― [log=레나]그런 거, 선[wa:1120]생님도 어떤 건지 이해하지?[/log]"
1013806-93 = "― [log=레나]그런 것도 있어서, [wa:660]이렇게 신경 써주는 거라고 [wa:1450]생각하는데.[/log]"
1013806-96 = "[wa:520]― [log=레나]어……?[/log]"
1013806-98 = "― [log=레나]오늘은[wa:660] 어땠냐[wa:1090]고……? [/log]"
1013806-101 = "[wa:680]― [log=레나]샤아악! [wa:940]마, [wa:240]말하게 하지 마! [wa:900]바보 선생님![/log]"
1013806-104 = "(이후 리본을 만드는 레나와 함께 다양한 이야기꽃을 피웠다.)"
1013806-110 = "아…… 벌써 시간이 이렇게 많이 흘렀네."
1013806-111 = "선생님. 이제 진짜 가봐야 하지 않아?"
1013806-112 = "[s] \"슬슬 일어나긴 해야겠네.\""
1013806-113 = "응. 오늘 업무도 힘내."
1013806-114 = "아, 참. 가기 전에……."
1013806-118 = "자. 가까이 와봐."
1013806-123 = "후후후, 리본 잘 어울리네?"
1013806-124 = "그거, 선물로 줄게."
1013806-125 = "[s9] \"오! 고마워!\"\n[s10] \"일할 때도 계속 달고 있을게!\""
1013806-128 = "으, 으응? 그렇게까지 할 필요는 없는데……."
1013806-129 = "[s] \"아니야. 레나가 처음으로 달아준 리본인걸.\""
1013806-130 = "……!"
1013806-131 = "모, 몰라! 그럼 계속 달고 다니든가!"
1013806-133 = "(이후 레나의 말대로 계속 리본을 달고 업무를 보았다.)"
1013806-134 = "(리본을 달아주며 기뻐하던 레나의 모습을 떠올리면서.)"
