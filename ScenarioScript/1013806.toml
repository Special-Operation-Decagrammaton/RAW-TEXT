[translation]
1013806-1 = "Small Ribbon"
1013806-2 = "It was the afternoon."
1013806-3 = "I headed to the Occult Society's dorm with the materials Rena asked for...and a chocolate-banana crepe."
1013806-5 = ""
1013806-6 = "Ah. Welcome, Sensei."
1013806-7 = "The others are out right now."
1013806-8 = "They're probably doing something silly, like trying to find occult symbols in a mural, or something."
1013806-9 = "[s] \"Why didn't you join them?\""
1013806-10 = "And pass up an opportunity to get some work done in peace?"
1013806-11 = "That was my plan...until I saw that the fabric shop was closed while they scrub off the unauthorized \"artwork.\""
1013806-12 = "Seriously, can anyone be normal at Wildhunt? I can't believe I have to survive three more years here."
1013806-13 = "[s] \"Here! Maybe this chocolate-banana crepe will cheer you up.\""
1013806-14 = "I told you not to, but you bought it anyway."
1013806-15 = "Well, thank you..."
1013806-16 = ""
1013806-18 = ""
1013806-19 = ""
1013806-20 = "Hmm! Th-This is good! Where'd you get it from?"
1013806-21 = "[s] \"Well, I didn't buy it. I made it myself.\""
1013806-22 = "What? R-Really?!"
1013806-23 = "[s] \"What do you think? It's good, right?\""
1013806-24 = "Yeah... I-It's good..."
1013806-25 = "..."
1013806-26 = "It's...definitely...good."
1013806-27 = "Shyaah! I don't know! Why do you have to spring all these questions? What is this, the inquisition?! Idiot Sensei!"
1013806-28 = ""
1013806-33 = "Despite her angry outburst, Rena happily finished the crepe."
1013806-34 = ""
1013806-35 = "Mmm. Now that I've had some sugar, I can start working."
1013806-36 = "[s1] \"You said you're making accessories, right?\"\n[s2] \"What are you crafting?\""
1013806-39 = "A ribbon hair clip."
1013806-40 = "[s3] \"Now that I think about it, you wear a lot of ribbons.\"\n[s4] \"Do you like them?\""
1013806-43 = "Well... It's not like I LOVE them..."
1013806-44 = "I had one at first, then I added another for balance...and then I ended up covered in them before I even realized it."
1013806-45 = "Now, I feel sort of \"off\" if I'm not wearing a bunch of them when I go out."
1013806-46 = "[s5] \"So they're like charms!\"\n[s6] \"So you ARE a true Occult Society member, after all!\""
1013806-49 = "Shyaah! Shut up! It's not like that!"
1013806-50 = "This is all about the fashion! Fashion!"
1013806-51 = "[s] \"Why are you making more when you're already wearing so many?\""
1013806-52 = "Since they're so small, I tend to lose a few if I'm out all day. So...I make a few spares, just to be safe."
1013806-53 = "I'm going to start working now, so you should start on your work, too."
1013806-54 = "Didn't you come here today because you had some business to take care of?"
1013806-55 = "[s7] \"I'm fine for now, so...\"\n[s8] \"Mind if I watch you make ribbons?\""
1013806-58 = "...Huh?"
1013806-59 = "Th-This is mundane work... So it might be pretty boring to watch."
1013806-60 = "But if you still want to observe..."
1013806-61 = ""
1013806-63 = ""
1013806-64 = "F-Fine. Feel free to."
1013806-65 = "Just don't bother me, okay?"
1013806-68 = "― [log=레나]You know, I've always been good with my hands, ever since I was a kid.[/log][wa:2020] "
1013806-70 = "― [log=레나]I would make things like ribbons and give them to my friends.[/log][wa:270] "
1013806-73 = "― [log=레나]I was happy to see that everyone liked them.[/log][wa:1370] "
1013806-75 = "― [log=레나]...And that's how I learned[/log]"
1013806-78 = "― [log=레나]that even something small[/log]"
1013806-80 = "― [log=레나]can make someone feel happy.[/log][wa:1870] "
1013806-83 = "― [log=레나]That's why I started dreaming of becoming a fashion designer. [/log][wa:860] "
1013806-86 = "― [log=레나]Because it makes me happy to see others enjoy [/log][wa:670] "
1013806-88 = "― [log=레나]the clothes and accessories I design.[/log][wa:920] "
1013806-91 = "― [log=레나]Sensei, you know how that feels, right?[/log][wa:1150] "
1013806-93 = "― [log=레나]I think that's also why you keep looking out for me.[/log][wa:1310] "
1013806-96 = "― [log=레나]Huh...?[/log][wa:400] "
1013806-98 = "― [log=레나]How was today...?[/log][wa:1550] "
1013806-101 = "― [log=레나]Shyaah! D-Don't make me say it! Idiot Sensei![/log][wa:1960] "
1013806-104 = "Afterward, I kept talking with Rena as she crafted ribbons."
1013806-110 = "Ah... Look at the time."
1013806-111 = "Sensei. Don't you have to get going? It's getting dark."
1013806-112 = "[s] \"I should head out soon.\""
1013806-113 = "Yeah. Good luck with your work...and everything."
1013806-114 = "Ah, right. Before you leave..."
1013806-115 = ""
1013806-117 = ""
1013806-118 = "Here. Come closer."
1013806-119 = ""
1013806-121 = ""
1013806-122 = ""
1013806-123 = "Heehee. This ribbon looks good on you!"
1013806-124 = "Consider it a gift! For keeping me company!"
1013806-125 = "[s9] \"Oh! Thank you!\"\n[s10] \"I'll keep it on, even while I'm working!\""
1013806-128 = "H-Huh? You don't have to go that far..."
1013806-129 = "[s] \"But it's the first ribbon Rena ever made for me.\""
1013806-130 = "...!"
1013806-131 = "Wh-Whatever! Keep it on, if you must!"
1013806-133 = "As Rena insisted, I kept wearing the ribbon while I worked..."
1013806-134 = "...continuously thinking of how happy she looked when she clipped it to me."
