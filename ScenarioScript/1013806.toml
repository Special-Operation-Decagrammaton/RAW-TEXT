[translation]
1013806-1 = "小蝴蝶結"
1013806-2 = "（當天下午）"
1013806-3 = "（拿著玲奈拜託的飾品材料和巧克力香蕉可麗餅，前往了神秘學研究會所在的宿舍）"
1013806-5 = ""
1013806-6 = "啊，老師。歡迎你。"
1013806-7 = "前輩們說今天會晚點回來。"
1013806-8 = "肯定又在策劃什麼「尋找藝術中隱藏的神秘學」之類的奇怪惡作劇吧。"
1013806-9 = "[s] 「玲奈怎麼沒跟去呢？」"
1013806-10 = "我本來打算趁前輩們不在的時候，安靜地做自己的工作……"
1013806-11 = "沒想到店家居然臨時休息……唉。"
1013806-12 = "整所學院就沒有一個人是正常的，我真的有辦法在這裡撐過3年嗎……"
1013806-13 = "[s] 「來來來！吃這個巧克力香蕉可麗餅打起精神吧！」"
1013806-14 = "結果你還是買來了啊……"
1013806-15 = "好吧……謝謝。"
1013806-16 = ""
1013806-18 = ""
1013806-19 = ""
1013806-20 = "這，這個很好吃耶！？你是在哪裡買的！？"
1013806-21 = "[s] 「其實這不是買的，而是我自己做的。」"
1013806-22 = "咦？真，真的嗎！？"
1013806-23 = "[s] 「怎麼樣？好吃吧？」"
1013806-24 = "嗯……好，好吃是好吃……"
1013806-25 = "……"
1013806-26 = "確實……還挺好吃……的吧。"
1013806-27 = "嚇啊──！我，我不知道啦！#n不要突然問奇怪的問題，你這個笨蛋！！"
1013806-28 = ""
1013806-33 = "（玲奈雖然氣噗噗地說著，卻還是把整份可麗餅都吃完了）"
1013806-34 = ""
1013806-35 = "呼……糖分也補充完了，開始工作吧。"
1013806-36 = "[s1] 「要做飾品對吧？」\n[s2] 「你打算做什麼呢？」"
1013806-39 = "我要做的是蝴蝶結的髮夾。"
1013806-40 = "[s3] 「這麼說來，玲奈戴了很多蝴蝶結呢。」\n[s4] 「你喜歡蝴蝶結嗎？」"
1013806-43 = "這個嘛……其實也沒有很喜歡啦……"
1013806-44 = "一開始也只有戴一兩個而已，結果回過神來就變得這麼多了。"
1013806-45 = "現在要是蝴蝶結不夠的話，反而會覺得有點不太對勁……"
1013806-46 = "[s5] 「就像護身符一樣呢！」\n[s6] 「果然玲奈也是神秘學研究會的成員呢！」"
1013806-49 = "嚇啊──！少囉嗦！才不是那樣！"
1013806-50 = "這只是時尚而已，時尚！"
1013806-51 = "[s] 「可是你已經戴很多了，還有需要做嗎？」"
1013806-52 = "因為體積太小的關係，蝴蝶結還挺容易不見的……#n所以我都會做一些備用的放著，以免沒戴的時候感到空虛。"
1013806-53 = "總之我現在要開工了，老師也回去忙你的工作吧。"
1013806-54 = "你今天不也是為了工作才來的嗎？"
1013806-55 = "[s7] 「現在時間還很充裕，所以……」\n[s8] 「我可以看玲奈做蝴蝶結嗎？」"
1013806-58 = "……嗯？"
1013806-59 = "可，可是……這只是單純的重複作業而已，有可能會很無聊哦？"
1013806-60 = "如果還是想看的話……"
1013806-61 = ""
1013806-63 = ""
1013806-64 = "隨，隨你高興吧。"
1013806-65 = "但是不能打擾我哦？知道嗎？"
1013806-68 = "― [log=레나]我呢，從小時候開始手就很靈活。[/log][wa:4220] "
1013806-70 = "― [log=레나]我會做蝴蝶結之類的，送給朋友。[/log][wa:2110] "
1013806-73 = "― [log=레나]大家都很喜歡，我也很開心。[/log][wa:2610] "
1013806-75 = "― [log=레나]……那時候我明白了。[/log]"
1013806-78 = "― [log=레나]就算是這麼小的東西，[/log]"
1013806-80 = "― [log=레나]也能讓人感到開心。[/log][wa:2630] "
1013806-83 = "― [log=레나]所以，我才會開始以時裝設計師為目標。[/log][wa:2620] "
1013806-86 = "― [log=레나]如果我設計的衣服或飾品，[/log][wa:2030] "
1013806-88 = "― [log=레나]能讓大家高興的話，我也會很開心。[/log][wa:1760] "
1013806-91 = "― [log=레나]那種感覺，老師應該多少能夠理解吧？[/log][wa:2030] "
1013806-93 = "― [log=레나]也是因為這樣，你才會這麼關心我。[/log][wa:2750] "
1013806-96 = "― [log=레나]咦……？[/log][wa:520] "
1013806-98 = "― [log=레나]問我今天怎麼樣……？[/log][wa:1830] "
1013806-101 = "― [log=레나]嚇啊──！別，別讓我說出口啊！笨蛋老師！[/log][wa:2960] "
1013806-104 = "（之後，和做著蝴蝶結的玲奈一起聊了很多話題）"
1013806-110 = "啊……已經過這麼久了啊。"
1013806-111 = "老師，這次真的該走了吧？"
1013806-112 = "[s] 「確實差不多該出發了呢。」"
1013806-113 = "嗯，今天的工作也加油哦。"
1013806-114 = "啊，對了。在走之前……"
1013806-115 = ""
1013806-117 = ""
1013806-118 = "來，靠近一點。"
1013806-119 = ""
1013806-121 = ""
1013806-122 = ""
1013806-123 = "呵呵呵，你還挺適合蝴蝶結的嘛？"
1013806-124 = "那個就送給你吧。"
1013806-125 = "[s9] 「嗯！謝謝！」\n[s10] 「工作的時候我也會一直戴著的！」"
1013806-128 = "咦，咦？其實也不至於做到那種程度……"
1013806-129 = "[s] 「畢竟這可是玲奈第一次幫我戴上的蝴蝶結呢。」"
1013806-130 = "……！"
1013806-131 = "不，不管你了啦！想戴就一直戴著吧！"
1013806-133 = "（之後按照玲奈說的，一直戴著蝴蝶結處理工作）"
1013806-134 = "（同時回想著玲奈幫忙戴上蝴蝶結時開心的模樣）"
