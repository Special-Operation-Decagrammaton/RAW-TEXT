[translation]
1013806-1 = "小蝴蝶結"
1013806-2 = "（當天下午）"
1013806-3 = "（拿著玲奈拜託的飾品材料和巧克力香蕉可麗餅，前往了神秘學研究會宿舍）"
1013806-6 = "啊，老師。歡迎你。"
1013806-7 = "前輩們今天說會晚點來。"
1013806-8 = "肯定又在策劃什麼……尋找藝術中隱藏的神秘學之類的奇怪惡作劇吧。"
1013806-9 = "[s] 「玲奈為什麼沒跟去？」"
1013806-10 = "我想趁前輩們不在的時候，安靜地做自己的工作。"
1013806-11 = "結果店家臨時休業……唉……"
1013806-12 = "這個學院沒有一個正常人，我能在這裡撐3年嗎……"
1013806-13 = "[s] 「好！吃這個巧克力香蕉可麗餅打起精神來！」"
1013806-14 = "都說不用買了。"
1013806-15 = "嗯……謝謝。"
1013806-20 = "這，這個很好吃耶！？在哪買的！？"
1013806-21 = "[s] 「其實不是買的，是我自己做的。」"
1013806-22 = "什麼？真，真的！？"
1013806-23 = "[s] 「怎麼樣？好吃吧？」"
1013806-24 = "嗯……好，好吃是好吃……"
1013806-25 = "……"
1013806-26 = "確實……好吃……吧。"
1013806-27 = "嚇啊啊──！我，我不知道！不要突然問奇怪的問題，你這笨蛋！！"
1013806-33 = "（玲奈雖然那樣生氣地說著，卻把全部都吃完了）"
1013806-35 = "呼……糖分也補充完了，開始工作吧。"
1013806-36 = "[s1] 「要做飾品對吧？」\n[s2] 「是要做什麼呢？」"
1013806-39 = "蝴蝶結髮夾。"
1013806-40 = "[s3] 「這麼說來，玲奈戴了很多蝴蝶結呢。」\n[s4] 「喜歡蝴蝶結嗎？」"
1013806-43 = "嗯……也沒那麼喜歡……"
1013806-44 = "一開始只是一個一個加上去，回過神來就變這麼多了。"
1013806-45 = "現在反而蝴蝶結少了就覺得哪裡不對勁……"
1013806-46 = "[s5] 「就像護身符一樣呢！」\n[s6] 「果然玲奈也是神秘學研究會的呢！」"
1013806-49 = "嚇啊啊──！吵死了！才不是那樣！"
1013806-50 = "這只是時尚，時尚！"
1013806-51 = "[s] 「但是現在已經戴很多了，還要做嗎？」"
1013806-52 = "因為太小了很容易掉，所以要做好備用的才不會覺得少了什麼。"
1013806-53 = "總之我現在要開始工作了，老師也去工作吧。"
1013806-54 = "今天來我們學院也是因為工作吧。"
1013806-55 = "[s7] 「現在時間上還可以，所以……」\n[s8] 「可以看玲奈做蝴蝶結嗎？」"
1013806-58 = "……嗯？"
1013806-59 = "但，但是這個……只是單純的重複作業，會很無聊哦？"
1013806-60 = "如果還是想看的話……"
1013806-64 = "隨，隨便你吧。"
1013806-65 = "但是不能打擾我哦？知道嗎？"
1013806-68 = "― [log=레나]我呢，從小時候開始手就很靈活。[/log][wa:4220] "
1013806-70 = "― [log=레나]我會做蝴蝶結之類的，送給朋友。[/log][wa:2110] "
1013806-73 = "― [log=레나]大家都很喜歡，我也很開心。[/log][wa:2610] "
1013806-75 = "― [log=레나]……那時候我明白了。[/log]"
1013806-78 = "― [log=레나]就算是這麼小的東西，[/log]"
1013806-80 = "― [log=레나]也能讓人感到開心。[/log][wa:2630] "
1013806-83 = "― [log=레나]所以我開始夢想成為時裝設計師。[/log][wa:2740] "
1013806-86 = "― [log=레나]如果我設計的衣服或飾品，[/log][wa:2030] "
1013806-88 = "― [log=레나]能讓大家都喜歡的話我也會很開心。[/log][wa:1760] "
1013806-91 = "― [log=레나]那種感覺，老師也大概理解吧？[/log][wa:2150] "
1013806-93 = "― [log=레나]也是因為這樣，才這麼關心我的吧。[/log][wa:2750] "
1013806-96 = "― [log=레나]咦……？[/log][wa:520] "
1013806-98 = "― [log=레나]今天怎麼樣……？[/log][wa:1910] "
1013806-101 = "― [log=레나]嚇啊──！別，別讓我說啊！笨蛋老師！[/log][wa:3040] "
1013806-104 = "（之後，和做著蝴蝶結的玲奈一起聊了很多話題）"
1013806-110 = "啊……已經過了這麼久了。"
1013806-111 = "老師，這次真的該走了吧？"
1013806-112 = "[s] 「差不多該起身了呢。」"
1013806-113 = "嗯，今天的工作也加油。"
1013806-114 = "啊，對了。在走之前……"
1013806-118 = "來，靠近一點。"
1013806-123 = "呵呵呵，蝴蝶結很適合你呢？"
1013806-124 = "那個送給你。"
1013806-125 = "[s9] 「嗯！謝謝！」\n[s10] 「工作的時候我也會一直戴著的！」"
1013806-128 = "唔，嗯嗯？也不用做到那種程度……"
1013806-129 = "[s] 「不，畢竟這是玲奈第一次給我戴的蝴蝶結。」"
1013806-130 = "……！"
1013806-131 = "不，不知道啦！那你就一直戴著吧！"
1013806-133 = "（之後照玲奈說的，一直戴著蝴蝶結工作了）"
1013806-134 = "（工作的同時想著玲奈開心的樣子）"
