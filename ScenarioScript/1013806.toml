[translation]
1013806-1 = "โบว์อันเล็ก"
1013806-2 = "(บ่ายวันนั้น)"
1013806-3 = "(คุณครูหิ้วเครปช็อกโกบานาน่ากับวัสดุทำเครื่องประดับที่เรนะฝากซื้อ และมุ่งหน้าไปยังหอพักของ#nชมรมวิจัยรหัสยศาสตร์)"
1013806-5 = ""
1013806-6 = "อ๊ะ เชิญเลย คุณครู"
1013806-7 = "พวกรุ่นพี่บอกว่าวันนี้จะกลับช้าหน่อยน่ะ"
1013806-8 = "ปากบอกว่าจะไปตามหาเรื่องลึกลับที่ซ่อนอยู่ในงานศิลปะ แต่ที่จริงแล้วคงไปวางแผนทำอะไรแปลกๆ อีกนั่นละ"
1013806-9 = "[s] \"แล้วทำไมเรนะไม่ไปด้วยล่ะ?\""
1013806-10 = "ฉันจะใช้โอกาสที่พวกรุ่นพี่ไม่อยู่มานั่งทำงานเงียบๆ น่ะ"
1013806-11 = "แต่ร้านค้าก็มาปิดชั่วคราวซะงั้น... เฮ้อ"
1013806-12 = "โรงเรียนนี้ไม่มีอะไรปกติสักอย่างเลย ไม่อยากจะคิดเลยว่าต้องทนอยู่ที่นี่ไปอีกสามปี..."
1013806-13 = "[s] \"เอาละ! กินเครปช็อกโกบานาน่าให้มีพลังดีกว่านะ!\""
1013806-14 = "บอกว่าไม่ต้องซื้อมาไง สุดท้ายก็ซื้อมาอยู่ดีสินะ"
1013806-15 = "ยังไงก็ ขอบคุณนะ..."
1013806-16 = ""
1013806-18 = ""
1013806-19 = ""
1013806-20 = "ขะ... ของเจ้านี้อร่อยจัง ซื้อมาจากร้านไหนเหรอ?"
1013806-21 = "[s] \"ที่จริงครูไม่ได้ซื้อมา แต่ทำเองน่ะ\""
1013806-22 = "ว่าไงนะ? จะ... จริงเหรอ?!"
1013806-23 = "[s] \"เป็นยังไงบ้าง? อร่อยใช่มั้ย?\""
1013806-24 = "อื้อ... กะ... ก็อร่อยอยู่หรอก..."
1013806-25 = "..."
1013806-26 = "ที่จริงมัน... อร่อยมาก... เลยต่างหาก"
1013806-27 = "ว้ากกก! มะ... ไม่รู้ด้วยแล้ว! ยะ... อย่ามาถามอะไรแปลกๆ สิ คุณครูคนบื้อนี่!!"
1013806-28 = ""
1013806-33 = "(ถึงเรนะจะพูดด้วยความหงุดหงิด แต่ก็กินเครปฝีมือคุณครูจนหมดเกลี้ยง)"
1013806-34 = ""
1013806-35 = "อะ... อืม ในเมื่อได้เติมน้ำตาลแล้ว งั้นก็มาทำงานได้แล้วละ"
1013806-36 = "[s1] \"จะทำเครื่องประดับอะไรเหรอ?\"\n[s2] \"เรนะทำเครื่องประดับแบบไหนเหรอ?\""
1013806-39 = "โบว์ติดผมน่ะ"
1013806-40 = "[s3] \"จะว่าไป เรนะก็ติดโบว์อยู่หลายอันเลยนะ\"\n[s4] \"เรนะชอบโบว์ติดผมสินะ\""
1013806-43 = "อืม... ฉันก็ไม่ได้ชอบขนาดนั้นหรอก"
1013806-44 = "ตอนแรกฉันเริ่มติดแค่อันสองอัน แต่พอรู้ตัวอีกทีก็งอกมาอีกหลายอันเลย"
1013806-45 = "แล้วตอนนี้ถ้าฉันติดโบว์แค่อันสองอัน ก็จะรู้สึกโหวงๆ แปลกๆ ด้วย..."
1013806-46 = "[s5] \"เป็นเหมือนเครื่องรางประจำตัวนี่เอง!\"\n[s6] \"สมแล้วที่เป็นสมาชิกชมรมวิจัยรหัสยศาสตร์!\""
1013806-49 = "ว้ากกก! จะบ้าเหรอ! ไม่ใช่อย่างนั้นสักหน่อย!"
1013806-50 = "แฟชั่น! นี่มันเป็นเรื่องของแฟชั่นต่างหากล่ะ!"
1013806-51 = "[s] \"ตอนนี้ก็มีโบว์เยอะแล้ว แต่ก็จะทำอีกเหรอ?\""
1013806-52 = "พอมันอันเล็ก ก็เลยหล่นหายบ่อยๆ น่ะ ฉันก็เลยอยากทำสำรองเอาไว้ จะได้ไม่รู้สึกว่ามีไม่พอ"
1013806-53 = "เอาเป็นว่าฉันจะเริ่มตั้งใจทำงานแล้ว คุณครูก็กลับไปทำงานเถอะ"
1013806-54 = "วันนี้มาที่ไวลด์ฮันต์เพราะเรื่องงานไม่ใช่เหรอ?"
1013806-55 = "[s7] \"ครูยังมีเวลาอยู่ ขอนั่งดูเรนะทำงานได้มั้ย?\"\n[s8] \"ครูขอนั่งดูเรนะทำโบว์ติดผมก่อนได้มั้ย?\""
1013806-58 = "หืม...?"
1013806-59 = "ตะ... แต่ว่า... นี่มันเป็นงานวนลูปซ้ำๆ ไม่น่ามีอะไรสนุกนะ?"
1013806-60 = "แต่ถ้าอยากดูละก็..."
1013806-61 = ""
1013806-63 = ""
1013806-64 = "กะ... ก็ได้ ตามใจแล้วกัน"
1013806-65 = "แต่ก็ห้ามมากวนฉันนะ เข้าใจมั้ย?"
1013806-68 = "― [log=레나]ฉันน่ะ เก่งงานฝีมือมาตั้งแต่เด็กๆ แล้ว[/log][wa:3300] "
1013806-70 = "― [log=레나]ฉันทำพวกโบว์ติดผมแจกเพื่อนบ่อยๆ เลย[/log][wa:1310] "
1013806-73 = "― [log=레나]พอทุกคนชอบ ฉันก็ดีใจ[/log][wa:2330] "
1013806-75 = "― [log=레나]ฉันก็เลยได้รู้ว่า...[/log]"
1013806-78 = "― [log=레나]ถึงจะเป็นของชิ้นเล็กๆ แบบนี้[/log]"
1013806-80 = "― [log=레나]ก็ทำให้ใครบางคนมีความสุขได้ด้วยสินะ[/log][wa:1590] "
1013806-83 = "― [log=레나]ฉันก็เลยฝันอยากเป็นแฟชั่นดีไซเนอร์มาตลอดเลย [/log][wa:1580] "
1013806-86 = "― [log=레나]เพราะถ้าทุกคนชอบเสื้อผ้าหรือเครื่องประดับที่ฉันออกแบบ [/log][wa:350] "
1013806-88 = "― [log=레나]ฉันก็จะมีความสุขไปด้วย[/log][wa:1520] "
1013806-91 = "― [log=레나]เรื่องแบบนี้น่ะ คุณครูพอเข้าใจใช่มั้ย?[/log][wa:1190] "
1013806-93 = "― [log=레나]พอมีเรื่องแบบนั้น ฉันก็เลยคิดว่าตัวเองใส่ใจในงานนี้มากเลยละ[/log][wa:1030] "
1013806-96 = "― [log=레나]หืม...?[/log][wa:400] "
1013806-98 = "― [log=레나]วันนี้เป็นยังไงบ้างน่ะเหรอ...? [/log][wa:990] "
1013806-101 = "― [log=레나]ว้ากก! ยะ... อย่าให้ฉันต้องพูดสิ! คุณครูคนบื้อ![/log][wa:1880] "
1013806-104 = "(หลังจากนั้นคุณครูกับเรนะก็คุยกันอย่างสนุกสนานระหว่างทำโบว์ติดผม)"
1013806-110 = "อ่า... เวลาผ่านไปขนาดนี้แล้วสินะ"
1013806-111 = "คุณครู ไม่ต้องไปทำงานหรอกเหรอ?"
1013806-112 = "[s] \"ครูก็คิดว่าน่าจะต้องไปแล้วละ\""
1013806-113 = "อื้อ ตั้งใจทำงานเข้าล่ะ"
1013806-114 = "อ้อ จริงสิ ก่อนจะไป..."
1013806-115 = ""
1013806-117 = ""
1013806-118 = "เข้ามาใกล้ๆ ฉันสิ"
1013806-119 = ""
1013806-121 = ""
1013806-122 = ""
1013806-123 = "ฮุฮุฮุ โบว์นี้เหมาะกับคุณครูจังเลยนะ"
1013806-124 = "ฉันให้เป็นของขวัญแล้วกัน"
1013806-125 = "[s9] \"โอ้! ขอบใจนะ!\"\n[s10] \"ครูจะติดโบว์นี้ไว้ตอนทำงานด้วย!\""
1013806-128 = "หะ... หืม? ไม่จำเป็นต้องทำถึงขนาดนั้นก็ได้..."
1013806-129 = "[s] \"ต้องทำสิ นี่เป็นโบว์อันแรกที่เรนะติดให้ครูเชียวนะ\""
1013806-130 = "...!"
1013806-131 = "มะ... ไม่รู้ด้วยแล้ว! งั้นก็ติดไว้ตลอดเลยนะ!"
1013806-133 = "(หลังจากนั้นคุณครูก็ติดโบว์ไว้และไปทำงาน)"
1013806-134 = "(ระหว่างทำงานก็นึกถึงภาพของเรนะติดโบว์ให้พร้อมกับรอยยิ้มบนหน้า)"
