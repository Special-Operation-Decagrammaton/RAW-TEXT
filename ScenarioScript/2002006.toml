[translation]
2002006-1 = "천재 해커의 섬세한 세미콜론"
2002006-2 = "(오늘은 평소와 달리 히마리의 은신처가 아니라, 히마리가 베리타스의 업무를 보고 있다는 장소로 초대받게 되었다.)"
2002006-8 = "안녕하세요. 선생님. 후후. 무사히 도착하셨군요."
2002006-9 = "[s] \"오늘은 은신처가 아니라. 여기야?\""
2002006-10 = "네, 오늘은 휴식이 목적이기보다 업무의 일환으로 처리할 일이 조금 있다 보니……."
2002006-11 = "그보다 본론이에요."
2002006-12 = "저, 드디어 손에 넣었답니다."
2002006-13 = "[s] \"드디어 손에 넣었다……라는 건, 앞서 말했던 보물 말이야?\""
2002006-14 = "후후후, 네. 맞아요. 보물."
2002006-15 = "그것도 저희 <해커>들 사이에선 특히나 구하기 어렵다고 정평이 나 있는…… 진짜배기를 말이지요."
2002006-16 = "대체 무슨 보물이길래, 그렇게 뜸을 들이느냐고요?"
2002006-17 = "후훗,"
2002006-18 = "부디 듣고 놀라지 마시기를……"
2002006-24 = "바로 이거랍니다!"
2002006-28 = "[ns] \"이건…… 요괴 MAX……네.\""
2002006-29 = "어머나, 그냥 요괴 MAX가 아니라고요?"
2002006-30 = "무려 스페셜 한정판. 평범한 요괴 MAX보다 100배는 더 맛있다고 알려진…… 요괴 MAX 중의 MAX예요."
2002006-31 = "[s] \"……아, 응.\""
2002006-36 = "……생각보다 반응이 약한걸요."
2002006-37 = "컴퓨터를 좋아하는 사람들 사이에선 엄청난 물건이라고 소문이 나서, 벌써 한정판에 프리미엄이 붙고 있는 엄청난 물건인데……."
2002006-38 = "베리타스 부원들도 한 번쯤 마셔보고 싶다고 얼마나 성화였던지."
2002006-39 = "[s] \"아, 혹시 그럼 히마리가 그걸 구했다는 건…… 모두를 위해?\""
2002006-40 = "후후, 가끔은 그 아이들에게도 부장으로서의 모습을 보여줘야 부끄럽지 않은 부장이라 할 수 있을 테니까요."
2002006-41 = "물론 그중에서도 이 <가슴 뜨거운 정열의 후르츠믹스맛>은, 선생님과 함께 직접 맛보고자 특별히 골라낸 물건이지만요."
2002006-42 = "[s] \"히마리가 그렇게까지 말해주니 기쁜걸.\""
2002006-43 = "자, 이러고 있을 게 아니라. 어디 얼마나 굉장한 맛인지. 한번 맛보도록 하지요. 먹고 오늘도 열심히 일하는 거랍니다."
2002006-44 = "마침 부원에게서 요괴 MAX를 더욱 맛있게 먹는 팁에 대해서도 배워 둔 참이니까요."
2002006-45 = "[s] \"어떤 방법이야?\""
2002006-46 = "바로 이거예요."
2002006-53 = "[ns] \"히, 히마리?! 왜 갑자기 음료캔을 흔드는 거야?!\""
2002006-54 = "이렇게. 후우."
2002006-60 = "음료캔을 마구 흔들면. 하아."
2002006-61 = "캔 내부에서의 요괴 MAX 반응으로. 으읏"
2002006-67 = "평범하게 먹었을 때보다. 이얍"
2002006-73 = "5배는 맛있어진다고, 부원들이. 하압!"
2002006-74 = "[s] \"아무리 봐도 장난에 속은 거 같은데?!\""
2002006-75 = "네?"
2002006-84 = "[ns] \"예상 그대로의 참극이…….\""
2002006-86 = "아……."
2002006-87 = "이, 이 정도쯤은 예상했답니다?"
2002006-88 = "하긴, 탄산음료였으니까……. 어려운 문제로군요……."
2002006-89 = "더 맛있어질 것을 기대하고 터질 것을 감수한 채 모험에 걸어보느냐……."
2002006-90 = "그저 현실에 안주한 채로, 나약한 지금으로 만족할 것인가……."
2002006-91 = "어려운 문제. 마치 저희의 인생 같네요."
2002006-92 = "[s1] \"그 정도로 심각한 이야기는 아니라고 생각해!\"\n[s2] \"자, 어쨌거나 감기에 걸리기 전에 얼른 닦자!\""
2002006-93 = "앗…… 가, 감사합니다."
2002006-97 = "앗…… 가, 감사합니다."
2002006-102 = "위는 적당히 닦아낼 수 있었습니다만……."
2002006-103 = "아…… 아무래도 아래는……."
2002006-104 = "…………으음."
2002006-105 = "[s] \"그럼 내가 닦아줄까?\""
2002006-109 = "네, 네엣? 서, 선생님께서요?"
2002006-110 = "그, 그건……."
2002006-111 = "[s] \"뭐, 히마리가 싫다면 어쩔 수 없………\""
2002006-115 = "아뇨! 조, 좋아요!"
2002006-116 = "그렇게나 저 같은 초천재 미소녀의 발을 닦고 싶다면- 저는 상관없답니다!"
2002006-117 = "……후, 후아."
2002006-121 = "……부탁, 드릴게요?"
2002006-127 = "[ns] \"……좋아, 그럼 닦는다?\""
2002006-128 = "엣-헴! 네! 얼마든지……!"
2002006-131 = "― 후후. [wa:1000]어떠신가요."
2002006-134 = "― 밀레니엄 최고 미소녀의 맨발을"
2002006-136 = "― 씻겨줄 기회라니……"
2002006-139 = "― 좀처럼[wa:300] 흔치 않은……"
2002006-141 = "― 흔치 않은 기회의……."
2002006-144 = "[wa:500]― 읏……?"
2002006-146 = "― 생각했던 것보다…… [wa:1720]뭔가 이상한 듯한……. [wa:1720]"
2002006-149 = "[wa:750]― 기묘한 게……. [wa:1350]부, [wa:1300]부끄럽다고 할지……."
2002006-151 = "― 어, [wa:1300]어째서……?"
2002006-154 = "― 마, [wa:200]말로 표현하기 [wa:600]어려운 감정이……! [wa:800]"
2002006-157 = "[wa:650]― 단순히 [wa:950]선생님이 제 발을"
2002006-159 = "― 정성스럽게 씻겨주고 있을 [wa:1000]뿐일 텐데……."
2002006-162 = "― 어째서……?"
2002006-165 = "[ns] \"그냥 비누칠을 하고 있을 뿐인데요!?\""
2002006-166 = "[wa:250] ― 후, [wa:500]후훗."
2002006-169 = "― 네, [wa:950]물론 각오는 되어 있으니"
2002006-171 = "― 신경 쓰지 마시길."
2002006-174 = "― 부디, [wa:900]마음가는대로……!"
2002006-176 = "― ……각오는, [wa:1000]되어 있을……[wa:1900]테니, [wa:1500]까요."
2002006-179 = "[ns] \"알았어, 그럼 계속할 테니까.\""
2002006-180 = "[wa:100]― 네, [wa:1300]네에."
2002006-182 = "― 그, [wa:1420]그럼……. [wa:2000]잘 부탁드립니다……."
2002006-186 = "[ns] \"자, 이걸로 닦는 건 끝!\""
2002006-187 = "읏, 으으음……."
2002006-188 = "으, 으음……. 으으음……."
2002006-189 = "[s] \"뭐야, 히마리. 혹시 아직 부족해? 좀 더 닦을 곳이……\""
2002006-193 = "아, 아뇨! 그냥, 그저……!"
2002006-194 = "……저 같은 초천재 미소녀조차 전혀 예상 못했네요……. 서로의 신체를 문질러준다는 게, 이토록이나…… 부, 부끄러운 일일 줄이야."
2002006-195 = "정말…… 선생님이랑 있다 보면, 이런 저조차 예상치 못한, 정말 많은 것들을…… 배우게 되네요. 감탄했어요."
2002006-196 = "[s] \"저기…… 무슨 말인지 도통……\""
2002006-197 = "후후, 신경 쓰실 것 없답니다."
2002006-198 = "그냥 저만의 작은……"
2002006-199 = "……네, 작고 사소한 깨달음이니까요~♪"
2002006-201 = "(그 뒤로 히마리와 함께 요괴 MAX를 마시며, 조금이나마 히마리의 일을 도왔다.)"
