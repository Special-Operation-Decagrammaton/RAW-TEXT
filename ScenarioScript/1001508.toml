[translation]
1001508-1 = "아리스의 마법"
1001508-2 = "밀레니엄 게임개발부"
1001508-3 = "선생님. 좋은 저녁입니다."
1001508-4 = "아리스는 혼자서 게임을 하고 있었습니다."
1001508-5 = "[s] \"무슨 게임 하고 있었어?\""
1001508-6 = "고전RPG입니다."
1001508-7 = "역시 RPG가 제일 재미있습니다. 다른 게임들도 재미있지만, RPG는 아리스의 마음의 고향 같은 느낌입니다."
1001508-8 = "[s] \"검과 마법……인가.\""
1001508-9 = "그렇습니다. RPG안에는 그런 것들이 있습니다."
1001508-10 = "[s] \"현실에는 없는 로망이 있지.\""
1001508-11 = "그렇게 생각하시나요?"
1001508-13 = "아리스는, 그렇게 생각하지 않습니다."
1001508-18 = "― 아리스는 키보토스에, [wa:2500]마법이 없다고 생각하지 않습니다."
1001508-21 = "― 마법은 있습니다.[wa:3300] 선생님은[wa:500] 지금,[wa:550] 아리스를 행복하게 만들었으니까요."
1001508-24 = "― 게임이 재미있는 이유는[wa:3000] 그것이[wa:750] 이 세상의 아름다움을 담고 있기 때문임을"
1001508-26 = "[wa:800]― 선생님을 통해 알게 되었습니다."
1001508-29 = "― 게임도,[wa:1350] 고양이도,[wa:1350] 친구들도……[wa:1700] 그리고[wa:1700] 이 순간도."
1001508-31 = "― 이 세상에는[wa:1070] 아름다운 것들이 많습니다."
1001508-34 = "― 아리스는 더 알고 싶습니다.[wa:3440] 선생님과 함께……"
1001508-37 = "― 이 세상을[wa:1250] 더 배우고 싶습니다!"
1001508-40 = "(아리스와 함께 다양한 RPG 얘기를 밤늦게까지 나누었다.)"
