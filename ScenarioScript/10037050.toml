[translation]
10037050-1 = "제5화;하늘에 뜬 구름은 자기 몸이 뜯긴 것을 모르니."
10037050-3 = "[ns] \"그러면 체리노와 마리나는 먼저 자러 간 거야?\""
10037050-4 = "네. 특히 체리노 서기장…… 체리노 쨩은 꽤 피곤해 보였거든요."
10037050-5 = "아무래도 빡빡한 일정이었다 보니, 무리도 아니었겠지요."
10037050-6 = "네? 저는 피곤하지 않으냐고요?"
10037050-7 = "걱정해 주시는 건가요? 감사하네요. 우후후."
10037050-8 = "물론 피곤하지 않다고 하면 거짓말이겠지만…… 조금, 여러 가지로 생각을 정리해 봐야 할 것 같아서요."
10037050-9 = "[s] \"가령, 이번 교류회에 숨겨진 저의라던가?\""
10037050-10 = "……글쎄요. 그것은 과연 어떨까요."
10037050-13 = "솔직하게 말씀드리자면, 문주님의 뜻은 어느 정도 짐작이 가고 있답니다."
10037050-14 = "물론 그것이 맞는 짐작일지 어떨지는, 저 자신도 확신할 수 없지만요."
10037050-15 = "[s] \"나는 아직도 잘 모르겠는데.\""
10037050-18 = "그러신가요? 우후후. 하지만 제 짐작이 맞는다면…… 문주님은 그런 걸 그다지 신경 쓰지 않을 듯하네요."
10037050-19 = "[s] \"토모에가 보기에, 산해경은 어땠어?\""
10037050-20 = "어머나. 지금은 꼭 산해경에 속한 사람처럼 말씀하시는군요?"
10037050-21 = "일단은 문주님께 부탁을 받고 산해경에 와 계시기 때문이라고요? 우후후. 확실히, 그건 어쩔 수 없는 부분이겠네요."
10037050-22 = "그렇네요. 산해경은…… 아름다운 곳이었어요."
10037050-25 = "인상적이고, 역사적이고…… 무엇보다 숨겨진 것들이 많아서, 흥미로웠죠."
10037050-26 = "그리고 더더욱 흥미로운 것은, 산해경 학생들은 그 숨겨진 것들을, 숨겨져 있다고 생각하지도 않고 있다는 부분이었고요."
10037050-27 = "[s] \"조금 더 자세히 이야기해 줄래?\""
10037050-30 = "이런 것입니다. 선생님."
10037050-31 = "비밀이란, 비밀이라고 인식되어야 비로소 비밀일 수 있지요."
10037050-32 = "그곳에 있는 사람들이, 그것을 인식하지도 못하고 구태여 알려고도 하지 않는다면, 비밀은 비밀일 수 없어요."
10037050-33 = "그저 아직 알려지지 않은, 존재도 정체도 모르는 무언가일 뿐이죠."
10037050-34 = "산해경에는, 외부인인 저희들이 그저 둘러보는 것만으로도 알 수 있을 만큼 숨겨진 것들이 많아 보였지만……."
10037050-35 = "산해경의 학생들은, 그 사실조차 자각하고 있지 못한 것처럼 보였거든요."
10037050-36 = "물론 이것은 어디까지나 하루 정도만 산해경을 둘러본, 저의 짧은 견문일 수도 있지만요? 우후후."
10037050-37 = "[s] \"키사키에 대해서는 어떻게 생각해?\""
10037050-38 = "문주님은…… 멋진 분이죠. 네. 정말로요."
10037050-39 = "왜 그렇게 진심으로 따르는 학생들이 많은지도 어느 정도 알 것 같고요."
10037050-40 = "아, 물론 체리노 쨩만큼 귀엽지는 않지만요. 오히려 지나치게 원숙하다고 할까요? 약간, 부자연스러움을 느낄 만큼 말이지요."
10037050-41 = "처음부터 사람들의 위에 서는 것이 당연했다는 것마냥 매사에 능숙하고, 사리에 맞는 판단을 내릴 줄 알고……."
10037050-42 = "이렇게까지 말씀드리고 나니, 새삼 그때 부자연스러운 모습을 보이신 이유가 사뭇 궁금해지기는 하네요."
10037050-43 = "[s] \"그때?\""
10037050-44 = "네. 그때. 오후의 산해경 순방에, 어째서 함께 하시지 않으셨는가, 하는 문제 말이죠."
10037050-45 = "[s] \"아…….\""
10037050-46 = "손님을 초대한 안주인이, 그 손님을 자신의 영역에 직접 안내하지 않는다는 것은 어딘가 부자연스럽지 않을까요?"
10037050-47 = "더군다나 그것이 문주님처럼, 예의와 경우를 아는 분이라면 말이죠."
10037050-48 = "도저히 피할 수 없는 사정이 있다고는 말씀하셨지만……."
10037050-49 = "그 시점에서, 이것은 매우 실례되는 생각이겠습니다만, 오히려 어딘가가 석연치 않다고 생각하게 되는 것은, 저뿐만은 아닐 거라고 믿습니다."
10037050-55 = "선생님은 어떻게 생각하시는지……. 우후후. 대답하지 않으셔도 될 것 같네요. 표정이 이미 말씀을 대신하고 있으니까요."
10037050-56 = "그렇게 티가 났냐고요? 어떨까요. 저는 다른 학생들보다 이런 문제에는 조금 민감한 편이어서요."
10037050-57 = "[s] \"그리고 보면, 산해경의 학생들은 어땠어?\""
10037050-58 = "매우 흥미로운 주제를 꺼내셨군요."
10037050-62 = "물론 저희가 오늘 만난 산해경 학생들이라고 하면, 미나 집행부장과 카구야라고 하는 그분과 루미 상인회장, 매화원 여러분……."
10037050-63 = "그리고 산해경 순방 중에 스쳐 지나갔던 다른 학생들 정도이겠습니다만."
10037050-64 = "……."
10037050-65 = "그렇군요. 제 감상은."
10037050-69 = "누군가 불을 붙이면 화르륵, 불타오를 짚단 같은 것이 떠올랐다고나 할까요."
10037050-70 = "[s] \"무슨…… 의미야?\""
10037050-71 = "대부분의 결과에는, 징후가 따르게 마련이죠."
10037050-72 = "산해경의 학생들은, 겉으로는 평온해 보였지만……."
10037050-73 = "저는 그 이면에 숨어 있는 팽팽한 긴장감이나…… 공포 같은 감정을, 약간이지만 느꼈답니다."
10037050-74 = "큰 사고가 하나 일어난다면, 그 전에 같은 원인으로 발생한 작은 사고가 29건, 같은 원인으로 일어날 뻔한 잠재적 사고가 300여 건 정도 있다는 통계적 결과도 있고요."
10037050-75 = "[s] \"흐음……. 그 정도인가?\""
10037050-76 = "물론 저의 지나친 느낌일 뿐일 수도 있지요."
10037050-77 = "그렇지만 저는…… 그리고 저희 붉은겨울은, 그런 분위기에는 조금 민감한 편이거든요."
10037050-81 = "어째서냐고요?"
10037050-85 = "……."
10037050-86 = "그야, 붉은겨울에서는 평균적으로 일주일에 1~2회 정도는 쿠데타가 발생하곤 하니까요."
10037050-94 = "……."
10037050-95 = "'충의(忠義)의 이름으로, 산해경에 일어나고 있는 징후에 대해 이야기하고 싶다'는 말을 듣고 찾아왔지만……."
10037050-96 = "기묘한 곳이로구나. 산해경에 속해 있지만 산해경이 아닌, 학생도 시설물도 없는 최외곽의 부지."
10037050-97 = "이런 장소가 있었다는 것을 알고 있는 사람이란, 도대체……."
10037050-102 = "보통 사람은 아닐 것이라는 말을 하고 싶은가?"
10037050-106 = "누구……?"
10037050-112 = "길은 어두우나, 빛이 가려지지는 않은 밤이다. 그렇지 아니한가?"
10037050-113 = "당신은……? 신타니 카이?! 어째서 여기에??!!"
10037050-114 = "호오. 나를 여태 기억하고 있을 줄이야. 그것은 조금 놀랍군."
10037050-115 = "……그렇다. 다른 모두가 잊었어도, 잊게 되었어도…… 누군가는 과거를 기억해야 한다."
10037050-116 = "쿡쿡쿡…… 여전하구나. 카구야. 나는 애초에 사람들의 얼굴 같은 것은 그다지 기억하지 않는 편이다만, 그럼에도 기억에 남는 자들이 있더군."
10037050-117 = "경극부는 여전히 활동중인가? 뭐, 이미 그렇다고 들어 알고는 있다만."
10037050-118 = "남의 동아리 활동까지 신경 써 줄 만큼, 상황이 나쁘지 않은 모양인데?"
10037050-119 = "쿡쿡쿡. 나를 걱정해 주는 것이냐? 이것 참, 여기에서 고맙다는 말을 꺼내야 할지 고민하게 될 줄은 몰랐는데 말이다."
10037050-120 = "그럴 일은 없다. 당신의 퇴학 결정이…… 적어도 결과만을 보자면, 잘못되었다고 생각하고 있지도 않고."
10037050-121 = "'결과만을 보자면' 인가? 꽤 많은 의미를 내포하고 있는 말처럼 들리는데."
10037050-122 = "……문주님은 정상적인 절차를 거치지 않고, 당신을 직권으로 추방시켰지. 그리고 당신과 관련되었던 모든 기록을 말소시켰고."
10037050-123 = "옛 추억이라도 떠올릴 작정인가? 기억나는군……. 쿡쿡쿡. 그리 퇴학당하지 않았다면 진작에 졸업했을 터였겠지만, 이렇게 학적 자체가 말소되어서 말이다."
10037050-124 = "교정국에도 잠시 신세를 지기도 했고, 그 이후로는 마치 존재하지만 존재하지 않는 유령처럼…… 키보토스의 외곽을 떠도는 처지가 되기는 했지."
10037050-125 = "……의외로군. 그 신타니 카이가 신세 한탄을 할 줄은."
10037050-126 = "그렇게 들렸단 말인가? 이거, 내 언변도 무뎌진 모양이군."
10037050-127 = "왜 나를 불러냈지?"
10037050-128 = "지금의 산해경에 대해 나누고 싶은 이야기가 있어서, 일까."
10037050-129 = "당신이 작금의 산해경에 대해 무엇을 안다는 거지?"
10037050-130 = "쿡쿡쿡……. 과거의 망령은 간섭하지 말고 사라지라는 말인가? 날카롭구나."
10037050-131 = "하기야, 산해경이면서 산해경이 아닌 내가 무엇을 말할 수 있겠는가."
10037050-135 = "단지, 붉은겨울로부터 방문단이 도착해, 산해경에 조용한 파문이 일어나고 있다는 것 정도만을 알고 있을 뿐."
10037050-140 = "어떻게 그 사실을……?!"
10037050-142 = "산해경은 나를 잊었다. 그 정도는 알고 있지. 하지만 나는 산해경을 잊지 않았다. 잊을 수 없었기 때문이지."
10037050-143 = "……산해경의 사정에 대해 알 수 있는, 나름의 방법을 가지고 있다는 뜻이로군……."
10037050-144 = "쿡쿡쿡…… 붉은겨울의 방문단 앞에서 경극 공연을 했다고 들었는데 말이다? 어떤 기분이었나, 카구야?"
10037050-145 = "……대답하지 않겠다."
10037050-146 = "그것으로 좋다. 그 자체로 이미 훌륭한 대답이 되었으니. 굴욕적이었겠군. 그렇지 않나?"
10037050-147 = "……!"
10037050-148 = "전통의 가치도 경극의 의미도 모르는 자들에게, 알아주지도 못할 최선을 다하며 자신의 모든 것을 부딪쳐야 한다……"
10037050-149 = "잘 알지, 잘 알아. 다른 모두는 모른다 해도, 나는 그 기분을 안다."
10037050-151 = "추방된 자가, 문주님의 결정과 판단에 왈가왈부하지 마라!"
10037050-153 = "호오. 그렇지만 너는 바로 그 키사키의 결정과 판단에 의심을 품기 시작하지 않았는가?"
10037050-154 = "그러하지 않았다면, 이 자리까지 나아왔을 리도 없었을 테니 말이다."
10037050-155 = "……!!!"
10037050-160 = "보이는군. 산해경에 일어나기 시작한 파문이, 그리고 그것이 불러올 결과까지도."
10037050-161 = "이대로라면 경극조차도 흘러간 시대의 유물이 되어, 마침내는 아무도 찾지 않게 되겠지."
10037050-162 = "변화란 그러한 것이다. 강물이 바위를 깎아내듯이, 금방은 보이지 않지만 확실하고 지속적으로 모든 것을 바꾸어 버리는 법."
10037050-167 = "경극의 가치와 의미를 무시하지 마라!"
10037050-168 = "무시하지 않다마다. 다른 모두가 경극을 무시하고 폄하하더라도, 적어도 한 명은 그 경극과 전통을 지켜야 하지 않겠는가?"
10037050-170 = "……나보고, 그걸 하라고?"
10037050-171 = "달리 누가 있겠나?"
10037050-172 = "왜 나지?"
10037050-173 = "그야, 산해경의 전통 가치와 의미를 가장 잘 이해하고 있는 것은, 언제나 경극부였잖나."
10037050-174 = "……적어도 내가 산해경에 재적 중이었을 때에는, 그러했을 텐데 말이다?"
10037050-175 = "……!"
10037050-176 = "……다들 전통, 전통하고 쉽게들 이야기하곤 하지……."
10037050-177 = "하지만 그것이 얼마나 중요한지, 확실하게 이해하고 있는 자는 지극히 드물어."
10037050-178 = "우리는 과거로부터 이어진 것들과, 거기에서 유래한 인간의 역사를 존중해야 한다! 현재는 과거 위에 뿌리를 내리고 서 있는 것이므로!"
10037050-179 = "이러니저러니 해도 현무상회가 가장 큰 문제야."
10037050-182 = "그 녀석들은……! 요리와 상업이라는 핑계를 대고, 독버섯처럼 여기저기에 닥치는 대로 포자를 뿌려 대고 있어!"
10037050-183 = "문주님도 현무상회에 대한 책임에서는 완전히 자유로우실 수 없어……. 왜 그 녀석들을 그렇게 방치하고 있으신 거지?"
10037050-184 = "그 녀석들이 어떤 위기를 초래하고 있는지, 충분히 알고 계실 만큼 영민하신 분이!"
10037050-187 = "샬레의 선생님이라는 자도 경계의 대상이었지만, 그것도 모자라 이번 붉은겨울의 방문단까지……."
10037050-188 = "쿡쿡쿡쿡……."
10037050-190 = "잘 들었다. 하지만 모름지기 경극부라면 경극으로 이야기해야 하지 않을까?"
10037050-191 = "전통을 진정으로 지키고 싶다면, 거기에서부터 시작해야 하지 않을까 하는 말이다."
10037050-192 = "무슨, 의미냐."
10037050-193 = "그렇지. 예를 들자면 이런 거다. 새로운 내용의 경극을 하나 해 보는 것은 어떨까."
10037050-198 = "그리고 그 경극 무대에서, 어떤 행동을 시도해 보는 거지……."
10037050-205 = "……?! 무, 무슨 말을 하는 거냐, 신타니 카이! 애초에 그럴 수 있는 권한이 나와 경극부에게 있을 리가……!"
10037050-207 = "재미있는 말을 해 주는군. 경극부장."
10037050-208 = "산해경 전통의 이름으로, 지금까지 그 전통을 가장 진지하게 지켜 왔던 경극부에게 자격이 없다면, 도대체 누구에게 있다는 것인가."
10037050-209 = "……!"
10037050-210 = "뭐, 이것도 결국 따지고 보면, 산해경에서 쫓겨난 자의 헛소리에 지나지 않을지도 모르지만 말이다?"
10037050-211 = "우리가, 새로운 경극을 하게 된다면……. 그것이 실패한다면……."
10037050-212 = "흥미롭군. 성공과 실패를 논하는 것이, 충의(忠義)의 길인가?"
10037050-213 = "……!!!"
10037050-214 = "쿡쿡쿡. 이거, 경극부장도 속세에 물들었구나. 그렇지, 그렇지……. 모든 것은 변화하기 마련이지. 그렇지 않은가?"
10037050-215 = "함부로 이야기하지 마라! 모두가 잊는다 해도, 그것을 기억하는 자가 있다면……!"
10037050-216 = "그래. 바로 그 의기다. 그 패기를 기다렸다. 뭐, 너무 걱정하지 마라. 판을 마련하는 것은 내가 조금 도와주지."
10037050-220 = "어떻게……?"
10037050-221 = "쿡쿡. 쫓겨난 자에게는 쫓겨난 자의 방법이 있는 법이다."
10037050-222 = "……이 일은 너와는 관계없다. 신타니 카이."
10037050-223 = "어디까지나 우리 경극부가, 산해경에 대한 충의(忠義)로서 행하는 일일 뿐. 그것만큼은 확실히 해 두겠어!"
10037050-224 = "아무렴. 그래야지. 그렇고말고."
10037050-229 = "쿡쿡쿡……. 이로서 무언가가 움직이기 시작하겠군."
10037050-237 = "쭉 듣고 있었습니다만, 무엇을 원하십니까. 카이 님."
10037050-238 = "불씨."
10037050-240 = "불씨…… 요?"
10037050-241 = "그래. 불씨. 그것이 초라한 것이어도, 어둠 속에서 확실하게 빛나는 불씨."
10037050-242 = "그리고 가능하다면 가장 큰 불로 자라날, 작으면서도 강력한 불씨를."
10037050-243 = "너는 어떻지?"
10037050-249 = "……연단방이, 진정한 부장을 되찾기를 바랍니다."
10037050-250 = "여전히 그 대답뿐이구나. 그렇기에 아직도 유일하게 나를 따르고 있는 것이겠지만."
10037050-251 = "사야 부장…… 아니, 야쿠시 사야는 연단방의 부장에 어울리지 않습니다. 무엇보다 당신에 비해 능력도, 자질도 부족합니다."
10037050-252 = "연단방은 진정한 주인을 되찾아야 합니다. 그뿐입니다."
10037050-253 = "그런가."
10037050-258 = "그렇다면 긴히 해 주어야 할 것이 있는데 말이다."
10037050-259 = "명을 기다리고 있습니다."
10037050-260 = "그것이 너의 내일을 가로막을 것이라 해도?"
10037050-261 = "어차피 지금의 연단방에서, 저는 내일을 찾지 못하고 있으니까요."
10037050-266 = "좋다. 그렇다면 연단방으로 돌아가…… 그 일을 해 두어라."
10037050-267 = "말씀대로 하겠습니다."
