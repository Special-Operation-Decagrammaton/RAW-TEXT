10054110-26 = "Especially you, Kokona dearest. I'm very proud of you."
10054110-27 = "E-Eh?! Where's this coming from, Shun?"
10054110-28 = "[s] \"You were a very impressive young lady out there.\""
10054110-29 = "O-Oh, geez. You too, Sensei?!"
10054110-30 = "And of course I was! Because I've been a proper lady from the beginning!"
10054110-31 = "[s] \"Of course you have been! I just got to see it in action today!\""
10054110-32 = ""
10054110-34 = ""
10054110-35 = ""
10054110-36 = ""
10054110-37 = ""
10054110-38 = ""
10054110-40 = "Kokona received endless head pats as we all showered her with praise."
10054110-41 = ""
10054110-42 = ""
10054110-43 = ""
10054110-44 = ""
10054110-46 = "She was blushing a little, but her bright smile showed how happy she was."
10054110-50 = ""
10054110-51 = "...That's what I mean! Those kids don't understand how important establishing good habits early on is!"
10054110-52 = "Coddling a child doesn't mean loving them! The opposite, actually. "
10054110-53 = "I'm worried that's being lost with the newest generation!"
10054110-54 = "When I was young, Shun..."
10054110-55 = "Shun..."
10054110-56 = "[s] \"...What's wrong?\""
10054110-57 = "N-Nothing at all! It's just... Shun can be...really scary when she's mad."
10054110-58 = "But she only gets angry if she really has to! Like she did today."
10054110-59 = ""
10054110-61 = ""
10054110-63 = "I was just thinking, I never thought I'd be able to go on a trip with her like this again."
10054110-64 = "We did this kind of stuff a lot when I was younger, but after Shun became an instructor, she didn't have a lot of free time."
10054110-65 = "That's why...I decided to study hard and become an instructor too!"
10054110-66 = "[s] \"And you've done a great job.\""
10054110-67 = "I-It was a total breeze! This kind of stuff comes naturally to me!"
10054110-68 = "I remember how Shun would scold me to get more sleep whenever I studied too much."
10054110-69 = "Funnily enough, I think we've had even less time to spend together ever since I became an instructor."
10054110-70 = "I don't mind it at all, though."
10054110-71 = "Because...You're here too..."
10054110-72 = "[s] \"I'm so proud of you, Miss Kokona.\""
10054110-73 = "(Wh-Whoa! Sensei just addressed me with so much respect!)"
10054110-74 = "Heehee! That's right! I'm a proper young lady!"
10054110-75 = "[s] \"That's right! You're the best, our little Kokona!\""
10054110-76 = "Ugh! You're treating me like a kid again!"
10054110-77 = "But earlier, you were treating me just like one of the older students!"
10054110-78 = "[s] \"Hmmm... Was I?\""
10054110-79 = "Yes! You were!"
10054110-80 = ""
10054110-83 = ""
10054110-84 = "Oh my, Sensei. Kokona."
10054110-85 = "Shun!"
10054110-86 = "Fufufu. Are you two on a date, this late at night?"
10054110-87 = "A d-d-d-date?!"
10054110-88 = ""
10054110-89 = "[ns] \"Yup! That's what it is!\""
10054110-90 = "Sensei?!"
10054110-91 = "Now I'm rather jealous. Do you mind if this older sister rudely butts in?"
10054110-92 = "...!"
10054110-93 = "F-Fine! Only because it's you!"
10054110-94 = "Thank you, Kokona dearest."
10054110-96 = "The three of us walked along the riverbank, with Kokona in the middle."
10054110-97 = "She seemed content as she held our hands and swung them back and forth."
10054110-98 = ""
10054110-99 = "Now this I wasn't expecting to see."
10054110-100 = "I can second that.#nHm? What are we doing out here?"
10054110-101 = "We're preparing something every summer vacation needs! Fireworks!"
10054110-102 = "Wow! Yay! Fireworks!"
10054110-103 = "Right? Let's light it up!"
10054110-109 = "How's it going, everyone?"
10054110-110 = "Hello, mister! It's going perfectly. Thank you again for your help!"
10054110-111 = "The pleasure's all mine! This is the locals' favorite spot to shoot off fireworks. It reflects off the river just right here."
10054110-112 = "Oh my. How exciting."
10054110-113 = "Let's all watch together!"
10054110-114 = "From the bottom of my heart, thank you. For treasuring our little valley here."
10054110-115 = "W-We should be thanking you for your hospitality."
10054110-116 = "...Also to the Black Tortoise Promenade, for believing and investing in us."
10054110-117 = "Oh? And here I thought we'd gotten away with it. How did you know?"
10054110-118 = "Hoho... We are merchants, after all. We have our ways of getting information."
10054110-119 = "...We do apologize for hiding it from you."
10054110-120 = "Let bygones be bygones. I'm sure you all had good reason, and life goes on."
10054110-121 = "Exactly... Things come, and things go. That's just the way things are."
10054110-122 = "Be it goods or money, things either circulate or are left to rot."
10054110-123 = "Just like water."
10054110-124 = "Ahaha! A good point. The freshness of this valley made me forget that could happen."
10054110-125 = "You all are the ones who preserved and revitalized our home. Without you, those Peep Syndicate kids..."
10054110-126 = "That's not true. Even without those kids' interference, this valley would've faded into a distant memory, preserved only in the flow of the river's current."
10054110-127 = "We may have been the one to make the investment, but nothing would've happened without Genryumon's cooperation."
10054110-128 = "That being said, I can't take all the credit here."
10054110-130 = "E-Eh? Us? Not Genryumon, but Madam Kisaki is the one who...! "
10054110-131 = "Wh-Where is she, actually? Madam? Madam Kisaki?"
10054110-132 = ""
10054110-134 = ""
10054110-135 = "...And here the rumors said that the Black Tortoise Promenade and Genryumon fought like cats and dogs."
10054110-136 = "Well, that still holds true in more ways than one."
10054110-137 = "But you hope it'll be different one day?"
10054110-138 = "Operating a successful business means building strong bridges, not burning them."
10054110-139 = "Aha, that's why you credited them in front of that Mina girl. Quick on the uptake, as always."
10054110-140 = "I think I'll have to refrain from commenting here."
10054110-141 = "...You're frighteningly business savvy, I have to say. You have a bright future ahead of you."
10054110-142 = "You flatter me! I'm still a student, so I have a long way to go."
10054110-144 = "Oh my. It's starting."
10054110-145 = "Wow...!"
10054110-151 = "There's still so much you all have to experience here!"
10054110-152 = "Like upstream valley rafting, the limestone cave tour, early morning bamboo boating..."
10054110-153 = "We're planning on squeezing in everything we can tomorrow."
10054110-154 = "You're back already?!"
10054110-155 = "Yes, I tracked down Madam Kisaki. She said she'll be here soon."
10054110-156 = "Ah, darn. Fireworks should be the finale to your trip, not smack dab in the middle."
10054110-157 = "The middle, the end... No matter the timing, fireworks are an entertaining display, are they not?"
10054110-158 = "You're late, Kisaki."
10054110-160 = "Fufu. My apologies. I laid down for a short repose. "
10054110-161 = "Now, now. Our academy president is such a sleepyhead!"
10054110-162 = "Vacations are meant for rest, are they not?"
10054110-163 = ""
10054110-165 = "[ns] \"...Kisaki?\""
10054110-166 = "What is the matter, Sensei? Hm? You wish to check in on my health?"
10054110-167 = "...I did promise you we would discuss this later. I suppose that is now."
10054110-168 = "..."
10054110-169 = "Please do not worry. "
10054110-170 = "I do not seek to mislead you. My condition is exactly as I say."
10054110-171 = "The events of earlier were, in fact, a result of my health improving."
10054110-172 = "[s] \"What...does that mean?\""
10054110-173 = "You see..."
10054110-174 = "..."
10054110-175 = "...My body was feeling rather stronger than usual, and I was swept away in the whirlwind of excitement."
10054110-176 = "Taking my medication slipped my mind entirely."
10054110-177 = "[s] \"...What?\""
10054110-178 = "Enough with your judgmental look! I did not skip it entirely!"
10054110-179 = "As soon as I realized, I did take it immediately. However, the medication's timing is an essential element..."
10054110-180 = "[s] \"...\""
10054110-181 = "So I apologize. Saya has been forced to scold me for forgetting in the past as well."
10054110-182 = "It is not entirely unheard of for one to slip on daily routines... Taking my medication, completing my stretches... I am only human, after all."
10054110-183 = "[s] \"I'm going to be really upset with you if you forget again, okay?\""
10054110-184 = "*sigh* Your sentiments mirror Saya's almost exactly. And I do understand where it comes from."
10054110-185 = "I shall exercise more caution moving forward."
10054110-186 = "Hm? You require proof of my promise? "
10054110-187 = "It would seem I must earn your trust back. What shall I do?"
10054110-188 = "Excuse me? You wish for me to call Saya and tell her what happened?!"
10054110-189 = "[s] \"It's for your own good, Kisaki!\""
10054110-190 = "While Instructor Kokona did say something of the sort..."
10054110-191 = "...Hm? I must set an example for the other students if I wish to be a good leader? While that is true...!"
10054110-192 = "Well..."
10054110-193 = "I suppose I have no rebuttal."
