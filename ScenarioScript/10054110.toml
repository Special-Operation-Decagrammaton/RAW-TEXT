[translation]
10054110-1 = "第11話;煙火"
10054110-2 = ""
10054110-3 = "嗚哇啊啊！？"
10054110-4 = "為什麼……到底為什麼啊！"
10054110-5 = "你，你們給我記住……！下次一定要讓你們嚐嚐真正的苦頭！！！"
10054110-6 = ""
10054110-8 = ""
10054110-9 = "你們這群臭小鬼──！！！"
10054110-10 = "跑得也太快了吧？已經跑那麼遠了。"
10054110-11 = "唔唔……現在的孩子真的是……！"
10054110-12 = ""
10054110-14 = ""
10054110-15 = "[ns] 「大家都沒受傷吧？」"
10054110-16 = "嗯，大家都沒事。"
10054110-19 = "[ns] （妃姬呢……？）"
10054110-20 = "唯一令人掛懷的，是雛鳥組那群孩子們的品行教養呢……"
10054110-21 = "唉……只能盼望他們將來能夠結下善緣了。"
10054110-22 = "……"
10054110-23 = "老師，不必太過操心。"
10054110-24 = "此番風波，妾身亦有幾分過失。"
10054110-25 = "大家都辛苦了。"
10054110-26 = "尤其是心菜醬，真的很了不起呢。"
10054110-27 = "咦？怎，怎麼突然這麼說，旬姐姐？"
10054110-28 = "[s] 「沒錯。完全就是出色的淑女呢，太厲害了。」"
10054110-29 = "真是的，怎麼連老師也這樣。"
10054110-30 = "而且我不是說過了嗎？我早就是個出色的淑女了！"
10054110-31 = "[s] 「沒錯沒錯！感覺又重新體會到這件事了呢！」"
10054110-32 = ""
10054110-34 = ""
10054110-35 = ""
10054110-36 = ""
10054110-37 = ""
10054110-38 = ""
10054110-40 = "（眾人一邊摸著心菜的頭，一邊盡情地誇獎他）"
10054110-41 = ""
10054110-42 = ""
10054110-43 = ""
10054110-44 = ""
10054110-46 = "（心菜雖然感到害羞，卻露出了無比清澈的笑容！）"
10054110-50 = ""
10054110-51 = "──所以說！那些孩子也是一樣，應該要從小培養好習慣才行。"
10054110-52 = "我覺得一味地溺愛，反而是不為孩子著想的表現。"
10054110-53 = "大家最近好像都忘記了這個道理，真的很讓人擔心！"
10054110-54 = "就連我小時候也曾經被姐姐……"
10054110-55 = "被姐姐……"
10054110-56 = "[s]「……還好嗎？」"
10054110-57 = "當，當然！完全沒問題！旬姐姐生起氣來……確實是有點可怕……"
10054110-58 = "但是反過來說，只要不做會惹他生氣的事就沒問題了！"
10054110-59 = ""
10054110-61 = ""
10054110-63 = "……真是不可思議。沒想到還會有像這樣和姐姐一起出來玩的日子。"
10054110-64 = "以前姐姐會經常陪我玩，可是在姐姐當上教官之後就很少有這種機會了。"
10054110-65 = "所以……這也是我想成為教官的其中一個原因。"
10054110-66 = "[s] 「看來你真的很努力呢。」"
10054110-67 = "這，這也沒什麼啦？反正對我來說根本不是什麼大不了的事！"
10054110-68 = "……不過之前努力讀書的時候，姐姐倒是經常嘮叨說一天至少要睡七個小時才行。"
10054110-69 = "只是等我真的當上教官之後才發現，彼此反而變得更沒有時間相處了呢……"
10054110-70 = "不過，我現在也很滿足。"
10054110-71 = "而且老師也像這樣……陪在我身邊。"
10054110-72 = "[s] 「心菜真了不起呢。」"
10054110-73 = "（咦……？老師沒有叫我心菜醬！？）"
10054110-74 = "哼哼，看來你總算看出我的真本事了呢！"
10054110-75 = "[s] 「對啊對啊！我們心菜醬最棒了！」"
10054110-76 = "啊啊！又叫我心菜醬了！"
10054110-77 = "剛才明明有好好叫我名字的說……！"
10054110-78 = "[s] 「有嗎～？」"
10054110-79 = "明明就有！"
10054110-80 = ""
10054110-83 = ""
10054110-84 = "哎呀。老師，心菜醬。"
10054110-85 = "旬姐姐！"
10054110-86 = "唔呵呵。這麼晚了，難道是在約會嗎？"
10054110-87 = "約，約約約，約會！？"
10054110-88 = ""
10054110-89 = "[ns] 「嗯，剛才正在和心菜約會呢。」"
10054110-90 = "老師！？！？"
10054110-91 = "哎呀哎呀，真羨慕呢。#n那麼可以讓不解風情的姐姐稍微打擾一下嗎？"
10054110-92 = "……！"
10054110-93 = "好，好吧！看在是旬姐姐的份上，就特別讓你加入吧！"
10054110-94 = "謝謝你，心菜醬。"
10054110-96 = "（就這樣和旬一起把心菜夾在中間，三人漫步在夜路上）"
10054110-97 = "（心菜牽著我們的手，時不時盪起手臂鞦韆，玩得非常起勁）"
10054110-98 = ""
10054110-99 = "哦？這組合還真難得啊。"
10054110-100 = "確實很難得呢。#n嗯？問我們在做什麼？"
10054110-101 = "哼……當然是在準備夏天不可或缺的煙火大會囉！"
10054110-102 = "煙火！好厲害！！！"
10054110-103 = "對吧？來盛大地放一場煙火吧！"
10054110-109 = "進行得還順利嗎？"
10054110-110 = "您好，老人家。託您的福一切順利。"
10054110-111 = "這樣啊……這裡是欣賞煙火的絕佳地點。#n煙火倒映在夜晚的水面上一定會非常壯觀。"
10054110-112 = "哎呀，那真是令人期待呢。"
10054110-113 = "一起看完再走吧！"
10054110-114 = "謝謝你們……真的很謝謝你們，這麼地享受這個地方。"
10054110-115 = "別這麼說。應該感謝的反而是我們才對……"
10054110-116 = "……其中也包含了出資贊助這裡的感謝啊，玄武商會的各位。"
10054110-117 = "哎呀，原本打算隱瞞到最後一刻的呢。您是怎麼知道的？"
10054110-118 = "哈哈哈……地方商人也有地方商人的消息來源啊。"
10054110-119 = "……一開始沒有向您坦白，真是抱歉。"
10054110-120 = "別說笑了。#n凡事都有它的理由……到頭來不過是流轉往復罷了。"
10054110-121 = "是啊……人情與緣分本就應該如此。"
10054110-122 = "無論物資還是金錢，如果沒有流通遲早會腐壞。"
10054110-123 = "水也是一樣的道理。"
10054110-124 = "啊哈哈！說的也是，我差點就忘記了。#n這裡本來就是如此美麗的溪谷呢。"
10054110-125 = "……謝謝你們拯救了這個地方。還有雛鳥組那些孩子的事也是。"
10054110-126 = "不，就算沒有那些孩子……#n如果這裡還是像以前那樣一成不變，遲早也會被世人漸漸遺忘吧"
10054110-127 = "玄武商會是因為看中了這裡的發展潛力而決定投資，#n不過要是少了玄龍門的協助，這一切恐怕也難以實現。"
10054110-128 = "從這個角度來看，這次玄龍門的功勞也不小呢。"
10054110-130 = "咦，咦咦……！？可，可是……#n不對，這種情況下理應由門主大人親自受此功勞才是……！"
10054110-131 = "但，但是門主大人究竟到哪裡去了！？#n門主大人──！門主大人──！"
10054110-132 = ""
10054110-134 = ""
10054110-135 = "……我聽說玄武商會和玄龍門的關係，似乎稱不上融洽。"
10054110-136 = "其實現在也沒有多少變化哦。"
10054110-137 = "是希望能一點一點地改善嗎？"
10054110-138 = "畢竟做生意總是得避免與人結怨嘛。"
10054110-139 = "原來如此……所以才會在美奈那孩子面前刻意說那種話嗎？"
10054110-140 = "誰知道呢？這個部分就容我暫時保密了。"
10054110-141 = "……已經是個大人物了啊。#n前途真是令人期待……不，或者該說令人畏懼吧。"
10054110-142 = "哈哈哈，您過獎了。#n我終究只是一名學生，還有很多東西等著我慢慢學習呢。"
10054110-144 = "哎呀，看來已經開始了呢。"
10054110-145 = "哇啊……！"
10054110-151 = "話說回來，這裡其實還有很多值得體驗的特色活動。"
10054110-152 = "例如上游溪谷的泛舟、石灰洞窟的導覽、竹筏遊河之類的……"
10054110-153 = "嗯，我們打算從明天開始盡情享受一番。"
10054110-154 = "這麼快就回來啦！？"
10054110-155 = "唔嗯……因為門主大人說很快就會過來。"
10054110-156 = "那不就變成在移動途中欣賞煙火了嗎……真是的。"
10054110-157 = "那又何妨？無論何時，欣賞煙火皆是令人愉悅之事啊。"
10054110-158 = "你遲到囉，妃姬。"
10054110-160 = "呵呵。抱歉，稍微午睡了一會。"
10054110-161 = "我們的門主大人變成貪睡蟲啦～！"
10054110-162 = "若是前來渡假還不放鬆身心，豈不就本末倒置了嗎？"
10054110-163 = ""
10054110-165 = "[ns] 「……妃姬？」"
10054110-166 = "怎麼了，老師。#n嗯？妾身是否真的沒事？"
10054110-167 = "……是啊。關於此事，妾身早已決定與老師詳談了呢。"
10054110-168 = "……"
10054110-169 = "無須操心。"
10054110-170 = "不，這絕非虛言，希望汝能相信妾身。#n畢竟事出有因……"
10054110-171 = "此次變故，反而是狀況稍有起色而產生的後果……"
10054110-172 = "[s]「那是……什麼意思？」"
10054110-173 = "唔呣……換言之……"
10054110-174 = "……"
10054110-175 = "由於自覺氣色略有好轉便一時鬆懈……沉溺於玩樂……"
10054110-176 = "……結果不慎疏忽了服藥的時間。"
10054110-177 = "[s] 「……咦？」"
10054110-178 = "別，別用那種眼神盯著妾身！妾身也並非完全忘了服藥！"
10054110-179 = "雖有急忙挽救……但藥效終究仍是遲了些……"
10054110-180 = "[s]「…………」"
10054110-181 = "妾，妾身這不是認錯了嗎？#n說來慚愧，妾身先前也曾經因為漏服藥物而被沙耶訓斥了一番。"
10054110-182 = "然而每日按時服藥也好，堅持鍛鍊也罷……#n人生在世，難免會有疏忽的時候不是嗎……"
10054110-183 = "[s] 「要是再忘記吃藥，我真的會生氣哦……？」"
10054110-184 = "唔……連訓話的內容都與沙耶如出一轍。#n也罷，畢竟是妾身有錯在先……"
10054110-185 = "唉，妾身明白了……往後定會多加留意。"
10054110-186 = "……嗯？需要約定的證明？"
10054110-187 = "唔呣，好吧。此番要求倒也合理。#n那麼，妾身該做什麼呢？"
10054110-188 = "什麼！？要妾身親自向沙耶坦白此事！？#n再，再怎麼說這實在是……！"
10054110-189 = "[s] 「這全都是為了妃姬著想啊！」"
10054110-190 = "心，心菜教官確實曾有此言，可話雖如此……！"
10054110-191 = "妾身若不能為眾人表率將難以服眾？#n確，確實有幾分道理……！"
10054110-192 = "唔，唔呣……"
10054110-193 = "終究無計可施了嗎……"
10054110-194 = ""
10054110-196 = ""
10054110-197 = ""
10054110-198 = ""
10054110-199 = "妃姬門主！避暑……我是說查核進行得還順利嗎？#n鍊丹術研究會這邊不必擔心哦！"
10054110-200 = "什麼？有話要對我說？"
10054110-201 = ""
10054110-203 = "……門主？"
10054110-204 = "唔……！等等，沙耶。#n這其中有著不得已的原因……！"
10054110-205 = "門主，我以前確實這麼說過吧。"
10054110-207 = "對於不遵從醫囑的病患而言，根本不存在什麼「不得已的原因」！！！！！"
10054110-208 = ""
10054110-210 = ""
10054110-211 = ""
10054110-212 = ""
10054110-213 = "門主為什麼總是會挑在這種奇怪的地方偷懶呢！"
10054110-214 = "回來之後我會親自過去拜訪，知道了吧？"
10054110-215 = ""
10054110-217 = ""
10054110-218 = "唔……"
10054110-219 = "[ns] 「做得好，妃姬。辛苦了。」"
10054110-220 = "老師多少也有些責任吧！？"
10054110-221 = "……不對。這一切終究是源自妾身的過失……"
10054110-222 = "[s] 「好了。來，靠過來一點。」"
10054110-223 = ""
10054110-225 = ""
10054110-226 = ""
10054110-227 = ""
10054110-228 = "……"
10054110-229 = "再多摸摸妾身一會吧……"
10054110-231 = "（直到妃姬重新打起精神為止，又多花了一點時間）"
10054110-232 = ""
10054110-233 = ""
10054110-234 = ""
10054110-235 = ""
10054110-236 = ""
10054110-237 = ""
10054110-238 = ""
10054110-239 = ""
10054110-240 = ""
10054110-241 = ""
10054110-242 = ""
10054110-243 = ""
10054110-244 = ""
10054110-246 = "山川把盞對清瀾，"
10054110-247 = "與君同酌一杯歡。"
10054110-249 = "揚手相迎初升月，"
10054110-250 = "對影相看成五人。"
10054110-252 = "此間勝景皆成醉，"
10054110-253 = "同遊終有別離歎。"
10054110-255 = "古道依依臨水遠，"
10054110-256 = "遙望銀河定重逢。"
