[translation]
10054110-1 = "11화;불꽃놀이"
10054110-3 = "으아아앙?!"
10054110-4 = "어째서…… 왜!"
10054110-5 = "기, 기억해 둬……! 다음에는 정말로 쓴 맛을 보여 줄 테니까!!!"
10054110-9 = "너희들–!!!"
10054110-10 = "엄청나게 빠른데? 벌써 저만큼 멀어졌어."
10054110-11 = "으으……. 정말이지 요즘 애들은!"
10054110-15 = "[ns] \"다들 다친 데 없지?\""
10054110-16 = "음. 나는 끄떡없다."
10054110-19 = "[ns] (키사키는……?)"
10054110-20 = "유일하게 걱정되는 것이라면, 그 병아리파라는 아이들의 버르장머리겠다만……."
10054110-21 = "후우. 어떻게든 어딘가와 좋은 인연이 있기를 바랄 수밖에 없겠구나."
10054110-22 = "……."
10054110-23 = "너무 걱정 말거라, 선생."
10054110-24 = "이번 일은, 어느 정도 내 과실도 있다고 해야 할 것이니까."
10054110-25 = "모두, 고생 많으셨습니다."
10054110-26 = "특히 코코나 쨩, 정말 대단했어요."
10054110-27 = "어, 어? 가, 갑자기 왜 그래, 슌 언니."
10054110-28 = "[s] \"맞아. 멋진 레이디의 모습, 대단했어.\""
10054110-29 = "아, 아이참. 선생님까지 왜 그러세요."
10054110-30 = "그리고 말씀드렸잖아요? 저는 이미 어엿한 레이디라구요!"
10054110-31 = "[s] \"그래, 그래! 새삼 알게 된 것 같아서!\""
10054110-40 = "(코코나의 머리를 쓰다듬으며, 모두 마음껏 코코나를 칭찬해 주었다.)"
10054110-46 = "(코코나는 부끄러워하면서도, 정말로 맑은 웃음을 보여 주었다!)"
10054110-51 = "–그러니까요! 그 애들도 그랬지만, 어렸을 때부터 버릇을 잘 들여야 하는 거예요."
10054110-52 = "저는 너무 오냐오냐해 주기만 하면, 오히려 애를 아끼지 않는 거라고 봐요."
10054110-53 = "요즘 다들 그걸 잊어버리고 있는 것 같기도 해서 걱정이라니까요!"
10054110-54 = "저만 해도 어릴 때, 언니한테……."
10054110-55 = "……언니, 한테……."
10054110-56 = "[s] \"……괜찮아?\""
10054110-57 = "그, 그럼요! 아무렇지도 않아요! 슌 언니, 화가 나면…… 여러 가지로 조금, 무섭지만……."
10054110-58 = "반대로 화나게 할 일만 하지 않으면 괜찮으니까요!"
10054110-63 = "……신기하네요. 언니랑 이렇게 놀러 오는 날이, 또 오다니."
10054110-64 = "예전에는 언니가 자주 놀아 줬지만, 교관이 되고 나서부터는 조금 어려워졌거든요."
10054110-65 = "그래서…… 저도 교관이 되려고 한 것이기도 하지만요."
10054110-66 = "[s] \"진짜로 열심히 노력했던 거네.\""
10054110-67 = "그, 그 정도는요? 어차피 저에게는 대단한 일도 아니었는걸요!"
10054110-68 = "……하지만 공부할 때 언니가, 아무리 그래도 하루에 일곱 시간은 자야 한다고 잔소리를 많이 하긴 했죠."
10054110-69 = "막상 이렇게 교관이 되고 나니까, 서로 더 시간이 없어져 버린 것 같지만……."
10054110-70 = "그래도, 지금도 좋아요."
10054110-71 = "이렇게 선생님도…… 계시고요."
10054110-72 = "[s] \"코코나는 정말 대견하구나.\""
10054110-73 = "(어라……? 선생님이 코코나 쨩이라고 안 불렀어?!)"
10054110-74 = "흐흥, 이제서야 제 진면목을 알아보시는 거네요!"
10054110-75 = "[s] \"그럼, 그럼! 우리 코코나 쨩 최고!\""
10054110-76 = "아, 지금 또 코코나 쨩이라고 하셨어요!"
10054110-77 = "조금 전에는 그냥 불러 주셔 놓고서는……!"
10054110-78 = "[s] \"그랬던가~?\""
10054110-79 = "그랬어요!"
10054110-84 = "어머나. 선생님, 코코나 쨩."
10054110-85 = "슌 언니!"
10054110-86 = "우후후. 늦은 시간에 데이트 중이셨나요?"
10054110-87 = "데, 데데데, 데이트?!"
10054110-89 = "[ns] \"응. 코코나랑 데이트 중이었어.\""
10054110-90 = "선생님?!?!"
10054110-91 = "어머나, 어머나. 부럽네요. 그러면 눈치 없는 언니도 조금 끼어도 될까요?"
10054110-92 = "……!"
10054110-93 = "조, 좋아! 슌 언니니까 특별히 봐 줄게!"
10054110-94 = "고마워요, 코코나 쨩."
10054110-96 = "(그렇게, 슌과 함께 코코나를 사이에 두고 길을 걸었다.)"
10054110-97 = "(코코나는 우리 둘의 손을 잡은 채, 이따금 팔 그네를 타며 매우 신을 냈다.)"
10054110-99 = "어라, 이건 또 드문 조합인데?"
10054110-100 = "정말로 그렇군. 음? 뭘 하고 있었느냐고?"
10054110-101 = "훗……. 여름이면 빼놓을 수 없는, 불꽃놀이 준비다!"
10054110-102 = "불꽃놀이! 대단해요!!!"
10054110-103 = "그렇지? 엄청나게 터트려 보자고!"
10054110-109 = "잘 되어 가고 있는가?"
10054110-110 = "안녕하세요, 어르신! 덕분에 아무 문제 없습니다."
10054110-111 = "그래……. 이 자리가 불꽃놀이 명당이지. 밤 강물에 불꽃이 비춰, 아주 멋지게 보일 게야."
10054110-112 = "어머나. 그거 정말 기대되네요."
10054110-113 = "같이 보고 가요!"
10054110-114 = "고맙구나. 정말로 고마워. 이곳을…… 이렇게 즐겨 줘서 말이다."
10054110-115 = "아, 아니……. 그런 인사는 오히려 우리 쪽에서 해야 하는 것이 아닐까 하는데……."
10054110-116 = "……여기에 자금을 투자해 준 곳이, 자네들 현무상회였다는 사실까지 포함해서 말이지."
10054110-117 = "이런. 마지막까지 들키고 싶지 않았는데 말이죠. 어떻게 아셨나요?"
10054110-118 = "허허허……. 지역 상인에게는, 지역 상인 나름의 소문이 들어오게 마련이니까."
10054110-119 = "……처음부터 말씀드리지 않아서, 죄송해요."
10054110-120 = "무슨 말을 하는 겐가. 다 그렇게 이유가 있고…… 돌고 도는 것이지."
10054110-121 = "그래……. 돌고 돌아야 하는 것이고 말고."
10054110-122 = "물자든 돈이든, 순환하지 않으면 썩기 마련이니까요."
10054110-123 = "물도 마찬가지란다."
10054110-124 = "아하하! 그렇네요. 제가 잊고 있었습니다. 그렇지 않아도 여기는 이렇게나 멋진 계곡인데 말이죠."
10054110-125 = "……이곳을 살려줘서 고맙구나. 그 병아리파라는 아이들에 관한 것도……."
10054110-126 = "아니, 그 아이들이 없었더라도 이곳은…… 지금까지와 같았다면, 서서히 잊혀서 사라져 갔겠지."
10054110-127 = "현무상회는 잠재 가능성을 보고 출자를 결심한 것이었습니다만, 현룡문의 협조가 없었다면 그것도 어려웠겠죠."
10054110-128 = "그런 의미에서 이번 일은 현룡문에게도 상당한 공이 있다고 봐야 할 겁니다."
10054110-130 = "어, 어어……?! 하, 하지만…… 아니다. 이런 경우는 문주님께서 응당 공을 받으셔야……!"
10054110-131 = "하, 하지만 문주님은 지금 어디에 계시는 거지?! 문주님–! 문주님–!"
10054110-135 = "……현무상회와 현룡문은, 그다지 사이가 좋지 않다고 들었는데 말이지."
10054110-136 = "사실 지금도 크게 다르지는 않아요."
10054110-137 = "조금씩 나아지기를 바란다는 건가?"
10054110-138 = "장사를 하려면 척을 지지 말아야 하지 않겠습니까."
10054110-139 = "확실히 그렇지. 아하…… 그래서 미나라는 아이 앞에서, 일부러 그런 말을 한 것인가?"
10054110-140 = "어떨까요? 그 부분은 구태여 말씀드리지 않는 것으로 하겠습니다."
10054110-141 = "……벌써 거물이구만, 자네. 후일이 기대될 정도야. 아니, 두려울 정도라고 해야 하려나."
10054110-142 = "하하하. 과찬입니다, 어르신. 학생이 해 봐야 어디까지 하겠습니까. 아직 배울 게 많은 입장인걸요."
10054110-144 = "어머나. 시작된 모양이네요."
10054110-145 = "와아……!"
10054110-151 = "그렇지만 아직 이곳의 명물은 많이 남아 있는데 말이지."
10054110-152 = "상류 계곡 레프팅이라든가, 석회 동굴 투어라든가, 대나무 배 유람이라든가……."
10054110-153 = "음. 그것도 전부 내일부터 실컷 즐길 예정이다만."
10054110-154 = "자네, 돌아온 겐가?!"
10054110-155 = "으음. 문주님께서 곧 여기로 오신다고 하셨으니 말이지."
10054110-156 = "그러면 일정 도중에 불꽃놀이를 하는 셈이군……. 그것 참."
10054110-157 = "괜찮지 않은가? 불꽃놀이는 언제 해도 즐거운 것이니."
10054110-158 = "늦었다구, 키사키."
10054110-160 = "후후. 미안하구나. 조금 낮잠을 잤더니 말이다."
10054110-161 = "잠꾸러기가 다 되셨구만~ 우리 문주님은!"
10054110-162 = "무얼. 휴양지에 와서 쉬지 못한다면, 그야말로 주객전도가 아니겠느냐."
10054110-165 = "[ns] \"……키사키?\""
10054110-166 = "왜 그러는가, 선생. 음? 정말로 괜찮은 것 맞냐고?"
10054110-167 = "……그래. 이 문제에 대해서는, 선생과 이야기를 나누기로 했지."
10054110-168 = "……."
10054110-169 = "걱정하지 말거라."
10054110-170 = "아니, 빈말로 하는 것이 아니다. 믿어 주었으면 한다. 그것도 그럴 것이……."
10054110-171 = "이번 일은, 오히려 역설적으로 상태가 조금 좋아져서 일어난 것이니…… 말이다."
10054110-172 = "[s] \"무슨…… 의미야?\""
10054110-173 = "그것이 말이다. 그러니까……."
10054110-174 = "……."
10054110-175 = "……조금 몸의 상태가 가벼워졌다고 느껴서, 너무…… 노는 데 집중한 나머지……."
10054110-176 = "………약의 때를, 그만 놓치고 말았던 것이다."
10054110-177 = "[s] \"…………뭐?\""
10054110-178 = "그, 그런 표정으로 쳐다보지 말아 다오! 그리고 먹지 않았던 것도 아니다!"
10054110-179 = "황급히 복용하였으나……. 역시, 약효가 조금 늦게 돌아서 말이지……."
10054110-180 = "[s] \"………….\""
10054110-181 = "그, 그러니 사죄하지 않았는가. 사실 이전에도 가끔…… 약을 빼먹었다가 사야에게 혼난 적이 있기도 하였다."
10054110-182 = "……매일 제 시간에 약을 먹는 것도, 매일같이 체조를 하는 것도…… 사람이 살다 보면, 소홀해질 수 있는 일이 아닌가……."
10054110-183 = "[s] \"한 번만 더 빼먹으면, 진심으로 화낼 거야……? \""
10054110-184 = "윽……. 사야와 똑같은 소리를 하는구나. 그래, 어쩔 수 없는 것이겠지……."
10054110-185 = "알겠다, 알겠다……. 앞으로는 정말 주의하도록 하마."
10054110-186 = "……음? 그 약속에 대한 증빙이 필요하다고?"
10054110-187 = "흐음, 알겠다. 그 정도는 받아들여야겠지. 내가 무엇을 하면 되겠는가."
10054110-188 = "뭐라? 내가 사야에게 직접 그 사실을 고하라는 것인가?! 아, 아무리 그래도 그것은……!"
10054110-189 = "[s] \"이게 다 키사키를 위한 거야!\""
10054110-190 = "부, 분명 코코나 교관이 그렇게 이야기한 바가 있기는 하다만!"
10054110-191 = "내가 모두의 모범이 되지 않으면 영이 서지 않게 된다고? 그. 그것은 분명 맞는 말이나……!"
10054110-192 = "으, 으음……."
10054110-193 = "어쩔 수, 없는 것인가……."
10054110-199 = "키사키 문주! 피서…… 감사는 잘 진행되고 있는 것이냐? 연단방은 걱정하지 않아도 좋은 것이다!"
10054110-200 = "뭐? 내게 할 말이 있다고?"
10054110-203 = "……문주?"
10054110-204 = "으, 윽……! 기다려 다오, 사야. 여기에는 그럴 만한 이유가……!"
10054110-205 = "예전에도 나님이 비슷한 말을 한 것이다, 문주."
10054110-207 = "의사의 말을 듣지 않은 환자에게, '그럴 만한 이유' 같은 것은 없는 것이다!!!!!"
10054110-213 = "문주는 꼭 이상한 부분에서 게으름을 부리려고 하니 말이다!"
10054110-214 = "돌아오면 나님이 직접 찾아갈 테니까! 그렇게 알고 있는 것이다!"
10054110-218 = "우으……."
10054110-219 = "[ns] \"잘했어, 키사키. 잘했어.\""
10054110-220 = "선생에게도 약간의 원인은 있을 것이다만?!"
10054110-221 = "……아니다. 사실 모든 것은 내 실책에서 기인한 것이 맞으니……."
10054110-222 = "[s] \"자, 자. 이리 가까이 와.\""
10054110-228 = "……."
10054110-229 = "조금 더 쓰다듬거라……."
10054110-231 = "(키사키가 다시 기운을 차릴 때까지, 시간이 조금 더 걸리기는 했다.)"
10054110-246 = "산과 강 아래에 한 잔을 들고"
10054110-247 = "그대와 함께 잔을 나누도다."
10054110-249 = "손을 들어 떠오른 달을 맞이하니"
10054110-250 = "그림자까지 합하여 모두가 다섯이구나."
10054110-252 = "이 경치가 우리를 취하게 하였으니"
10054110-253 = "함께 서로 즐기고, 마침내 흩어지리라."
10054110-255 = "길은 강 아래 계속해서 이어지고"
10054110-256 = "아득한 은하수에서, 분명 다시 만날 것이니."
