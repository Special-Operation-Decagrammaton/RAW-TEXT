10054110-182 = "ทั้งต้องกินยาให้ตรงเวลาทุกวัน ทั้งทำกายบริหารเป็นประจำ... พอใช้ชีวิตไปเรื่อยๆ ก็อาจเผลอละเลย#nเรื่องพวกนี้ได้ไม่ใช่หรือ..."
