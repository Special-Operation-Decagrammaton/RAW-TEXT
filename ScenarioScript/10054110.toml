10054110-20 = "My main concern is that those Peep Syndicate children failed to learn their lesson."
10054110-21 = "*sigh* I can only hope that we one day meet on better terms."
10054110-22 = "..."
10054110-23 = "Please do not worry so, Sensei."
10054110-24 = "I hold a certain amount of responsibility here."
