10054110-186 = "หืม...? ต้องการหลักฐานยืนยันคำสัญญานั้นอย่างนั้นหรือ? "
10054110-187 = "อืม เข้าใจแล้ว ถ้าเป็นคำขอเพียงเท่านี้ก็ยอมรับได้ แล้วเราต้องทำสิ่งใดหรือ?"
10054110-188 = "ว่ายังไงนะ? ให้เราบอกความจริงเรื่องนั้นกับซายะด้วยตัวเอง?! ตะ... แต่การทำเช่นนั้นมัน...!"
10054110-189 = "[s] \"ทั้งหมดนี้ก็เพื่อคิซากินะ!\""
10054110-190 = "นะ... แน่นอนว่าผู้ฝึกสอนโคโคน่าเคยพูดแบบนั้นไว้อยู่ก็จริง!"
10054110-191 = "แต่หากเราไม่ทำตัวเป็นแบบอย่างให้กับทุกคน เราก็จะไม่น่าเชื่อถืออย่างนั้นหรือ?#nระ... เรื่องนั้นก็จริงอยู่หรอก...!"
