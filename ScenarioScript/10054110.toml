[translation]
10054110-1 = "ตอนที่ 11;ดอกไม้ไฟ"
10054110-2 = ""
10054110-3 = "ง่าาา?!"
10054110-4 = "ทำไม... เพราะอะไรกัน!"
10054110-5 = "จะ... จำไว้ให้ดี...! คราวหน้าจะสั่งสอนให้รู้ซึ้งจริงๆ แน่!!!"
10054110-6 = ""
10054110-8 = ""
10054110-9 = "พวกเธอ!!!"
10054110-10 = "เร็วมากเลยนะ หนีไปไกลขนาดนั้นแล้ว"
10054110-11 = "ฮึ่ย... ให้ตายสิ เด็กสมัยนี้นี่นะ!"
10054110-12 = ""
10054110-14 = ""
10054110-15 = "[ns] \"ทุกคนไม่มีใครได้รับบาดเจ็บใช่มั้ย?\""
10054110-16 = "อื้อ ฉันไม่เป็นอะไรเลย"
10054110-19 = "[ns] (แล้วคิซากิล่ะ...?)"
10054110-20 = "หากจะมีเรื่องที่น่าเป็นห่วง ก็คงเป็นความประพฤติของเด็กๆ แก๊งลูกเจี๊ยบนั่น..."
10054110-21 = "เฮ้อ คงทำได้เพียงหวังว่าเด็กพวกนั้นจะได้เจอคนดีๆ ที่ไหนสักแห่งสินะ"
10054110-22 = "..."
10054110-23 = "อย่ากังวลมากไปเลย ครู"
10054110-24 = "เรื่องที่เกิดขึ้นครั้งนี้ จะว่าไปเราเองก็มีส่วนผิดอยู่บ้างเหมือนกัน"
10054110-25 = "ทุกคนเหนื่อยกันมากเลยนะคะ"
10054110-26 = "โดยเฉพาะโคโคน่าจัง เก่งมากเลยค่ะ"
10054110-27 = "เอะ... เอ๋? จะ... จู่ๆ เป็นอะไรไปน่ะ พี่ชุน"
10054110-28 = "[s] \"ใช่แล้ว เป็นกุลสตรีที่ยอดเยี่ยมมากเลย\""
10054110-29 = "ธะ... โธ่ คุณครูก็เป็นไปกับเขาด้วยเหรอคะ"
10054110-30 = "แล้วฉันก็บอกไปแล้วไม่ใช่เหรอคะ? ฉันเป็นกุลสตรีเต็มตัวมาตั้งนานแล้วค่ะ!"
10054110-31 = "[s] \"จ้าๆ! ครูแค่รู้สึกได้อีกครั้งว่าเป็นแบบนั้นจริงๆ น่ะ!\""
10054110-32 = ""
10054110-34 = ""
10054110-35 = ""
10054110-36 = ""
10054110-37 = ""
10054110-38 = ""
10054110-40 = "(ทุกคนพากันลูบหัวโคโคน่า พร้อมกับกล่าวชมเธอกันอย่างเต็มที่)"
10054110-41 = ""
10054110-42 = ""
10054110-43 = ""
10054110-44 = ""
10054110-46 = "(แม้จะเขินอายอยู่บ้าง แต่โคโคน่าก็เผยรอยยิ้มอันสดใสออกมา!)"
10054110-50 = ""
10054110-51 = "นั่นน่ะสิคะ! เด็กพวกนั้นเองก็เหมือนกัน ต้องอบรมให้มีนิสัยที่ดีตั้งแต่ยังเล็กค่ะ"
10054110-52 = "ฉันคิดว่าถ้าเอาแต่โอ๋และตามใจเด็กมากเกินไป กลับจะเป็นการไม่ใส่ใจเด็กอย่างแท้จริงค่ะ "
10054110-53 = "ช่วงนี้ดูเหมือนทุกคนจะลืมเรื่องนั้นกันไป ฉันถึงได้เป็นห่วงอยู่นี่ไงคะ!"
10054110-54 = "แม้แต่ตอนที่ฉันยังเด็ก ก็เคยถูกพี่..."
10054110-55 = "ถูกพี่..."
10054110-56 = "[s] \"ไม่เป็นไรใช่มั้ย...?\""
10054110-57 = "นะ... แน่นอนค่ะ! ฉันไม่เป็นอะไรเลย! พี่ชุนน่ะ เวลาโกรธขึ้นมา... ก็น่ากลัวอยู่หลายด้านเลยค่ะ..."
10054110-58 = "แต่กลับกัน ถ้าไม่ทำอะไรให้พี่เขาโกรธก็ไม่เป็นไรค่ะ!"
10054110-59 = ""
10054110-61 = ""
10054110-63 = "เหลือเชื่อเลยนะคะ... ไม่นึกเลยว่าจะมีวันที่ได้มาเที่ยวกับพี่ชุนแบบนี้อีกครั้ง"
10054110-64 = "เมื่อก่อนพี่ชุนมาเล่นกับฉันบ่อยๆ แต่พอเป็นผู้ฝึกสอนแล้วก็หาโอกาสมาเล่นด้วยกันยากนิดหน่อยค่ะ"
10054110-65 = "ฉันก็เลย... ถึงได้พยายามเป็นผู้ฝึกสอนด้วยเหมือนกันค่ะ"
10054110-66 = "[s] \"แปลว่าพยายามอย่างหนักมาตลอดเลยสินะ\""
10054110-67 = "ระ... เรื่องแค่นั้นเอง ยังไงสำหรับฉันก็ไม่ใช่เรื่องใหญ่อะไรอยู่แล้วค่ะ!"
10054110-68 = "แต่ตอนที่ฉันอ่านหนังสือ พี่ก็คอยบ่นเตือนอยู่บ่อยๆ ว่าถึงยังไงก็ควรนอนให้ได้อย่างน้อยวันละ#nเจ็ดชั่วโมงค่ะ..."
10054110-69 = "พอได้มาเป็นผู้ฝึกสอนจริงๆ ดูเหมือนว่าเราสองคนจะยิ่งมีเวลาให้กันน้อยลงกว่าเดิม"
10054110-70 = "แต่ถึงอย่างนั้น ฉันก็ชอบที่เป็นอยู่ตอนนี้เหมือนกันค่ะ"
10054110-71 = "แล้วก็มีคุณครู... อยู่ด้วยกันแบบนี้ด้วย"
10054110-72 = "[s] \"โคโคน่านี่น่าภูมิใจจริงๆ เลยนะ\""
10054110-73 = "(เอ๋...? คุณครูไม่ได้เรียกว่าโคโคน่าจังแล้วหรอกเหรอ?!)"
10054110-74 = "ฮึ่ม ในที่สุดก็เห็นความสามารถที่แท้จริงของฉันแล้วสินะคะ!"
10054110-75 = "[s] \"แน่นอนๆ! โคโคน่าจังของเราเก่งที่สุดเลย!\""
10054110-76 = "อ๊ะ เมื่อกี้เรียกโคโคน่าจังอีกแล้วนะคะ!"
10054110-77 = "ทั้งที่เมื่อกี้เรียกแค่ชื่อฉันเฉยๆ แท้ๆ...!"
10054110-78 = "[s] \"จริงเหรอ~?\""
10054110-79 = "จริงค่ะ!"
10054110-80 = ""
10054110-83 = ""
10054110-84 = "ตายจริง คุณครู โคโคน่าจัง"
10054110-85 = "พี่ชุน!"
10054110-86 = "ฮุฮุฮุ มาออกเดตยามดึกกันอยู่เหรอคะ?"
10054110-87 = "ดะ... ดะดะดะ... เดตเหรอ?!"
10054110-88 = ""
10054110-89 = "[ns] \"อื้อ ครูกำลังออกเดตกับโคโคน่าอยู่\""
10054110-90 = "คุณครู?!?!"
10054110-91 = "แหม แหม น่าอิจฉาจังเลยค่ะ ถ้าอย่างนั้น ขอพี่สาวที่ไม่ค่อยรู้จังหวะคนนี้ร่วมวงด้วยสักหน่อยได้มั้ยคะ?"
10054110-92 = "...!"
10054110-93 = "กะ... ก็ได้! เพราะเป็นพี่ชุนหรอกนะ จะยอมให้เป็นกรณีพิเศษก็ได้!"
10054110-94 = "ขอบคุณนะคะ โคโคน่าจัง"
10054110-96 = "(จากนั้น คุณครูก็เดินไปตามทางพร้อมกับชุน โดยมีโคโคน่าอยู่ตรงกลาง)"
10054110-97 = "(โคโคน่าจับมือของทั้งสองคนไว้ บางครั้งก็โหนแขนแกว่งตัวเล่นเป็นพักๆ อย่างสนุกสนาน)"
10054110-98 = ""
10054110-99 = "เอ๋ นี่ก็เป็นการรวมตัวที่ไม่ค่อยได้เห็นเลยนะ?"
10054110-100 = "จริงด้วยนะ หืม? พวกเรากำลังทำอะไรกันอยู่น่ะเหรอ?"
10054110-101 = "ฮุ... ก็กำลังเตรียมดอกไม้ไฟ สิ่งที่ขาดไม่ได้ในฤดูร้อนไง!"
10054110-102 = "ดอกไม้ไฟ! สุดยอดเลยค่ะ!!!"
10054110-103 = "ใช่มั้ยล่ะ? ไว้มาจุดกันให้ดังสนั่นไปเลย!"
10054110-109 = "ทุกอย่างราบรื่นดีมั้ย?"
10054110-110 = "สวัสดีค่ะ คุณลุง! ต้องขอบคุณมากนะคะ พวกเราไม่เจอปัญหาอะไรเลยค่ะ"
10054110-111 = "อื้อ... ตรงนี้เป็นจุดชมดอกไม้ไฟชั้นเยี่ยมเลย แสงดอกไม้ไฟจะสะท้อนบนผิวน้ำยามค่ำคืน จะออกมาสวยงามมากเลยละ"
10054110-112 = "อุ๊ย อยากเห็นเร็วๆ แล้วเลยค่ะ"
10054110-113 = "อยู่ดูด้วยกันก่อนแล้วค่อยกลับกันนะคะ!"
10054110-114 = "ขอบใจนะ ขอบใจทุกคนจริงๆ ที่สนุกสนาน... กับสถานที่แห่งนี้กันแบบนี้"
10054110-115 = "มะ... ไม่สิ... คำขอบคุณแบบนั้น พวกเราต่างหากล่ะที่ควรเป็นฝ่ายพูด..."
10054110-116 = "รวมถึงเรื่องที่ว่า... ย่านการค้าเทพเต่าดำของพวกเธอเป็นผู้ลงทุนให้ที่นี่ด้วย"
10054110-117 = "แย่ละ อุตส่าห์ตั้งใจว่าจะไม่ให้ความแตกแท้ๆ รู้กันได้ยังไงเหรอคะ?"
10054110-118 = "ฮ่าฮ่าฮ่า... พ่อค้าแม่ค้าในพื้นที่ย่อมได้ข่าวลือจากแวดวงของตัวเองอยู่แล้ว"
10054110-119 = "ขอโทษที่ไม่ได้บอกตั้งแต่แรกนะคะ..."
10054110-120 = "พูดอะไรอย่างนั้น ทุกสิ่งล้วนมีเหตุผลของมัน... และย่อมหมุนเวียนกลับมาหากันทั้งนั้น"
10054110-121 = "อื้อ... ทุกสิ่งต้องหมุนเวียนต่อไป"
10054110-122 = "ไม่ว่าจะเป็นสิ่งของหรือเงินทอง หากไม่หมุนเวียนก็ย่อมเน่าเสียค่ะ"
10054110-123 = "น้ำก็เหมือนกันนั่นแหละ"
10054110-124 = "อะฮะฮ่า! นั่นสินะคะ ฉันลืมเรื่องนั้นไปเสียสนิทเลย ทั้งๆ ที่ที่นี่เป็นหุบเขาที่งดงามตั้งขนาดนี้"
10054110-125 = "ขอบใจที่ช่วยชุบชีวิตสถานที่แห่งนี้นะ... รวมถึงเรื่องของเด็กๆ แก๊งลูกเจี๊ยบนั่นด้วย..."
10054110-126 = "ไม่สิ ต่อให้ไม่มีเด็กพวกนั้น ที่นี่เองก็... ถ้ายังคงเป็นเหมือนที่ผ่านมา ก็คงค่อยๆ ถูกลืมเลือนหายไป#nในที่สุด"
10054110-127 = "ย่านการค้าเทพเต่าดำตัดสินใจลงทุนเพราะมองเห็นศักยภาพของที่นี่ แต่ถ้าไม่ได้รับความร่วมมือจาก#nมังกรดำแล้วละก็ เรื่องนี้ก็คงเกิดขึ้นได้ยากเหมือนกันค่ะ"
10054110-128 = "ในแง่นั้น เรื่องครั้งนี้ก็ต้องถือว่ามังกรดำมีส่วนช่วยอย่างมากเช่นกันค่ะ"
10054110-130 = "เอะ... เอ๋...?! ตะ... แต่ว่า... ไม่สิ ในกรณีนี้ ท่านประมุขย่อมต้องได้รับความดีความชอบ... "
10054110-131 = "วะ... ว่าแต่ตอนนี้ท่านประมุขอยู่ที่ไหนกันน่ะ?! ท่านประมุข! ท่านประมุข!"
10054110-132 = ""
10054110-134 = ""
10054110-135 = "ได้ยินมาว่าย่านการค้าเทพเต่าดำกับมังกรดำไม่ค่อยลงรอยกันเท่าไรนี่นา..."
10054110-136 = "ที่จริงตอนนี้ก็ไม่ได้แตกต่างจากที่ว่ามากนักหรอกค่ะ"
10054110-137 = "หมายความว่าก็หวังให้ความสัมพันธ์ของทั้งสองฝ่ายค่อยๆ ดีขึ้นงั้นเหรอ?"
10054110-138 = "ถ้าจะทำการค้า ก็ไม่ควรสร้างศัตรูไม่ใช่เหรอคะ?"
10054110-139 = "นั่นมันก็จริงอยู่หรอกนะ อ้อ... เพราะงั้นถึงได้จงใจพูดแบบนั้นต่อหน้าเด็กที่ชื่อมินะใช่มั้ย?"
10054110-140 = "คิดว่ายังไงล่ะคะ? แต่เรื่องนั้นฉันขอไม่พูดถึงเป็นพิเศษแล้วกันค่ะ"
10054110-141 = "แม่หนูคนนี้เป็นผู้ใหญ่แล้วสินะ อนาคตช่างน่าจับตามองจริงๆ ไม่สิ ต้องบอกว่าน่าหวาดหวั่นเลย#nหรือเปล่านะ"
10054110-142 = "ฮ่าฮ่าฮ่า ชมกันเกินไปแล้วค่ะ คุณลุง นักเรียนอย่างฉันจะทำได้สักแค่ไหนกันเชียว ฉันยังมีเรื่องต้องเรียนรู้อีกมากค่ะ"
10054110-144 = "ตายจริง ดูเหมือนจะเริ่มแล้วนะคะ"
10054110-145 = "ว้าว...!"
10054110-151 = "แต่ที่นี่ยังมีกิจกรรมสนุกๆ ให้ทำอีกตั้งเยอะเลยนะ"
10054110-152 = "ทั้งล่องแก่งในหุบเขาต้นน้ำ ทัวร์ถ้ำหินปูน หรือจะล่องเรือไม้ไผ่ชมวิว..."
10054110-153 = "อื้อ ตั้งแต่พรุ่งนี้ไป ฉันตั้งใจว่าจะสนุกกับทั้งหมดนั่นให้เต็มที่เลย"
10054110-154 = "พวกเธอ กลับมากันแล้วเหรอ?!"
10054110-155 = "อื้อ ท่านประมุขบอกว่าจะมาที่นี่ในอีกไม่ช้าน่ะ"
10054110-156 = "ถ้าอย่างนั้น ก็เท่ากับว่าจะได้ชมดอกไม้ไฟระหว่างกำหนดการสินะ... จริงๆ เลยเชียว"
10054110-157 = "ก็ดีไม่ใช่หรือ? ดอกไม้ไฟน่ะ ไม่ว่าจะชมตอนไหนก็สนุกทั้งนั้น"
10054110-158 = "มาช้านะ คิซากิ"
10054110-160 = "ฮุฮุ ขอโทษนะ พอดีเรานอนกลางวันมานิดหน่อยน่ะ "
10054110-161 = "ท่านประมุขของเรา~ กลายเป็นคนขี้เซาไปแล้วสินะ~!"
10054110-162 = "ไม่หรอก หากมาถึงสถานที่พักผ่อนแล้วแต่กลับไม่ได้ผ่อนคลายเลย ก็ถือว่าผิดวัตถุประสงค์ไม่ใช่หรือ"
10054110-163 = ""
10054110-165 = "[ns] \"คิซากิ...?\""
10054110-166 = "เป็นอะไรไปเล่า ครู หืม? เราไม่เป็นไรจริงๆ หรือเปล่าน่ะหรือ?"
10054110-167 = "จริงสินะ... เรื่องนี้เราตกลงไว้แล้วว่าจะพูดคุยกับครู"
10054110-168 = "..."
10054110-169 = "อย่ากังวลไปเลย "
10054110-170 = "เปล่าหรอก เราไม่ได้พูดไปตามมารยาท เราอยากให้ครูเชื่อเรานะ เพราะที่จริงแล้ว..."
10054110-171 = "เรื่องครั้งนี้เกิดขึ้นได้เพราะอาการของเราดีขึ้นเล็กน้อยแล้วต่างหาก..."
10054110-172 = "[s] \"หมายความว่า... ยังไง?\""
10054110-173 = "เรื่องนั้นน่ะ คือว่า..."
10054110-174 = "..."
10054110-175 = "เรารู้สึกว่าร่างกายเบาสบายขึ้นเล็กน้อย ก็เลย... เที่ยวเล่นเพลิน..."
10054110-176 = "จนเผลอลืมเวลากินยาไปเสียได้..."
10054110-177 = "[s] \"ว่าไงนะ...?\""
10054110-178 = "ยะ... อย่ามองเราด้วยสีหน้าแบบนั้นสิ! แล้วเราก็กินยาไปแล้วด้วยนะ!"
10054110-179 = "เรารีบกินไปแล้ว... แต่ฤทธิ์ยามาช้าไปหน่อยก็เท่านั้น..."
10054110-180 = "[s] \"...\""
