[translation]
103110-1 = "제11화;처음의 이야기"
103110-11 = "……내 실수였어요."
103110-16 = "내 결정들. 그리고 그로 인해 초래된 모든 상황들."
103110-21 = "결국 이 결과에 도달하고서야 당신이 옳았다는 걸 깨닫다니……."
103110-22 = "……그러니 염치없지만 부탁드리겠습니다."
103110-27 = "[USERNAME] 선생님."
103110-32 = "어차피 제 말을 잊어버리게 될 테지만, 그래도 상관없겠죠."
103110-33 = "아무것도 기억나지 않아도, 당신은 아마 같은 상황에서 똑같은 선택을 하실 테니……."
103110-38 = "그러기에 아마…… 중요한 것은 경험이 아니라, 선택."
103110-39 = "당신만이 가능한 선택들."
103110-44 = "책임을 지는 사람에 대해 얘기한 적이 있었지요."
103110-45 = "그때의 저는 알지 못했지만…… 지금은 이해할 수 있습니다."
103110-49 = "어른. 책임과 의무, 그리고 그 너머에 있는 당신의 선택."
103110-50 = "그것이 의미하는 바까지도."
103110-59 = "― ……."
103110-65 = "― 그러니까, [wa:900]선생님."
103110-71 = "― 내가 믿을 수 있는 어른인 [wa:1800]당신만이,"
103110-77 = "― 이 뒤틀리고 일그러진 종착지가 아닌"
103110-82 = "― 이 뒤틀리고 일그러진 종착지가 아닌 다른 결과를……"
103110-88 = "― 그곳으로 이어지는 선택지를……"
103110-93 = "― 찾을 수 있을 겁니다."
103110-97 = "그러니까, 선생님.#n부디……."
103110-101 = "우리들과의 인연을,"
103110-102 = "우리들과의 추억…… 함께 해 온 그 모든 날들을…… 부디……."
103110-115 = "뭐, 뭐야?!"
103110-116 = "다차원해석 시스템 에러 발생……!!"
103110-117 = "<우트나피쉬팀>의 확률적 중첩 상태가……! 방주와 불일치하고 있어요!"
103110-118 = "뭐?! 시스템이 고장 난 거야?!"
103110-119 = "아, 아니에요…… 이건……."
103110-121 = "그쪽이 아니야! 값에서 벗어난 건 <아트라하시스의 방주>다!!"
103110-130 = "리, 리오 회장?!"
103110-132 = "……!!"
103110-133 = "마, 말도 안 돼……. 서, 설마……."
103110-134 = "<아트라하시스의 방주> 쪽의 상태가 바뀌었다고요! 설마, 우리가 계산한 값에서 벗어나려고……?!"
103110-135 = "……우리가 인지하고 있는 다차원이 아닌, 뭔가 새로운 축을 하나 더 세운 거야."
103110-136 = "2차원의 존재에게 3차원을 아무리 설명해봤자 이해할 수 없는 것처럼……."
103110-137 = "뭐, 뭐라고……."
103110-138 = "그렇다는 건…… 다차원해석을 능가하는 계산이 언제든지 가능했다는 건가요……?"
103110-139 = "설마…… 지금까지의 분석이 전부……."
103110-143 = "소용없었다는 얘기……?"
103110-145 = "다음화;빛의 자격 1"
