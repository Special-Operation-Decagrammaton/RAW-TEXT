[translation]
90101010-1 = "제1화;원한은 잊지 않는다"
90101010-2 = "카네사키 항구 제 4 부두"
90101010-5 = "헉, 헉, 헉……"
90101010-6 = "저 녀석들, 돌아버린 거 아냐?"
90101010-7 = "그래. 머리가 어떻게 되어버린 게 분명해. 제 정신이 아니고서야, '그런 것'에 손을 댈 리가 없잖아?"
90101010-8 = "물론 나도 돈을 갚는 게 조금 늦긴 했지만…… 고의는 아니었지만……"
90101010-9 = "그래도 고작 그런 푼돈 때문에 이 정도로 일을 벌이는 게 말이나 되긴 하냐고!"
90101010-10 = "푼돈이라…… 확실히 큰 돈은 아니긴 하지."
90101010-15 = "하지만 그런 푼돈조차 준비하지 못해서 도망 다니는 녀석이 할만한 소리는 아닌 걸."
90101010-16 = "힉, 히익……?!"
90101010-17 = "죄, 죄송합니다. 방금 한 그 말은—"
90101010-18 = "아, 사과할 필요는 없어."
90101010-19 = "어차피 방금 한 말이 본심이든, 거짓이든 우리에게는 아무런 상관도 없거든."
90101010-20 = "그저 우리는 조직의 돈을 떼어먹은 괘씸한 녀석에게 본보기를 보여주고 싶을 뿐이야."
90101010-21 = "보, 본보기라니…… 설마……"
90101010-22 = "아, 혹시 알고 있었나? 그럼 설명이 빠르겠네."
90101010-27 = "자, 지금부터 너는 이 드럼통 안에 있는 녀석들을 상대해 줘야겠어."
90101010-28 = "이 녀석들은 무척이나 탐욕스러워서 주린 배를 채울 때까지 멈추지 않거든."
90101010-29 = "과연 이번에는 얼마나 버틸 수 있을까?"
90101010-33 = "자, 잠깐. 그거, 설마 진짜는 아니겠지?"
90101010-34 = "정말…… 그 드럼통 안에, 소문의 그 \"괴물 게\"가 있는 건 아니겠지?!"
90101010-35 = "글쎄."
90101010-36 = "그건 지금부터 확인해 보면 되지 않을까."
90101010-41 = "잠깐 기다려 줘. 빌린 돈의 3배…… 아니, 5배를 낼테니까!"
90101010-47 = "제발 '게 드럼통'에는 넣지 말아줘!"
90101010-49 = "다음화;게살 어육 소시지"
