[translation]
90101010-1 = "ตอนที่ 1;ความแค้นจะไม่มีวันถูกลืม"
90101010-2 = "ท่าเทียบเรือที่ 4 ท่าเรือคาเนะซากิ"
90101010-4 = ""
90101010-5 = "แฮ่ก... แฮ่ก... แฮ่ก..."
90101010-6 = "เจ้าพวกนั้นเสียสติไปแล้วเรอะ?"
90101010-7 = "ใช่สิ สมองต้องเพี้ยนไปแล้วแน่ๆ ถ้ายังมีสติดีอยู่ ก็คงไม่มีทางไปแตะต้อง 'ของแบบนั้น' หรอก จริงมั้ยล่ะ?"
90101010-8 = "มันก็จริงอยู่ที่ฉันคืนเงินช้าไปนิดเดียว... แต่ไม่ได้จงใจให้มันเป็นแบบนั้นสักหน่อย..."
90101010-9 = "แต่จะมาก่อเรื่องใหญ่โตขนาดนี้เพียงเพราะเงินเล็กน้อยแค่นั้น มันสมเหตุสมผลที่ไหนกัน!"
90101010-10 = "เศษเงินงั้นเหรอ... ก็จริง มันไม่ใช่เงินจำนวนมากนักหรอก"
90101010-11 = ""
90101010-14 = ""
90101010-15 = "แต่คนที่ไม่มีปัญญาหาเศษเงินแค่นั้นมาคืนจนต้องหนีหัวซุกหัวซุน ก็ไม่น่าจะมีสิทธิ์พูดแบบนั้นนะ"
90101010-16 = "ฮะ... เฮือก...?!"
90101010-17 = "ขะ... ขอโทษด้วย ที่พูดไปเมื่อกี้น่ะ..."
90101010-18 = "อ้อ ไม่ต้องขอโทษหรอก"
90101010-19 = "ต่อให้คำพูดเมื่อกี้จะมาจากใจจริงหรือเป็นแค่คำโกหก สำหรับพวกฉันมันไม่มีความหมายอะไรทั้งนั้น"
90101010-20 = "พวกฉันแค่อยากทำให้ไอ้คนที่เบี้ยวเงินได้รู้ซึ้งถึงผลของการกระทำ เพื่อเป็นตัวอย่างก็เท่านั้นเอง"
90101010-21 = "ปะ... เป็นตัวอย่างงั้นเหรอ... หรือว่า.."
90101010-22 = "อ้อ รู้อยู่แล้วงั้นเหรอ? งั้นก็คุยกันง่ายหน่อย"
90101010-23 = ""
90101010-25 = ""
90101010-26 = ""
90101010-27 = "เอาละ จากนี้ไปแกต้องรับมือกับพวกที่อยู่ในถังเหล็กนี่"
90101010-28 = "เจ้าพวกนี้ตะกละมาก พวกมันจะไม่หยุดจนกว่าจะได้กินอิ่มหรอก"
90101010-29 = "มาดูกันว่าครั้งนี้แกจะทนได้นานสักแค่ไหน"
90101010-30 = ""
90101010-33 = "ดะ... เดี๋ยวก่อน นั่นคง... ไม่ใช่ของจริงหรอกใช่มั้ย?"
90101010-34 = "ในถังเหล็กนั่น... คงไม่ได้มี 'ปูปีศาจ' ที่ลือกันอยู่จริงๆ ใช่มั้ย?!"
90101010-35 = "ก็นั่นน่ะสิ"
90101010-36 = "เห็นแล้วเดี๋ยวก็คงรู้เองนั่นแหละ"
90101010-37 = ""
90101010-40 = ""
90101010-41 = "ขอเวลาอีกเดี๋ยวนะ เงินที่ยืมไป ฉันจะหามาคืนให้ 3 เท่า... ไม่สิ 5 เท่าเลย!"
90101010-42 = ""
90101010-45 = ""
90101010-46 = ""
90101010-47 = "ขอร้องละ อย่าจับฉันโยนลง 'ถังปู' นั่นเลยนะ"
90101010-49 = "ตอนต่อไป;ไส้กรอกปลาผสมเนื้อปู"
