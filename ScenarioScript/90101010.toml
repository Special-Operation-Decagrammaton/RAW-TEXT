[translation]
90101010-1 = "第1話;怨恨永不消逝"
90101010-2 = "鐘崎港第4碼頭"
90101010-4 = ""
90101010-5 = "呼，呼，呼……"
90101010-6 = "那些傢伙，該不會是瘋了吧？"
90101010-7 = "沒錯，腦子肯定有問題。#n除非精神不正常，不然怎麼可能去碰「那種東西」呢？"
90101010-8 = "當然我還錢是稍微晚了一點……但也不是故意的……"
90101010-9 = "就算是這樣，為了那麼一點小錢就把事情鬧到這種地步，這合理嗎！"
90101010-10 = "小錢啊……確實算不上什麼大錢。"
90101010-11 = ""
90101010-14 = ""
90101010-15 = "但是連那點小錢都拿不出來，只會四處逃命的傢伙可沒資格說那種話啊。"
90101010-16 = "噫，噫噫……！？"
90101010-17 = "非，非常抱歉。剛才那句話──"
90101010-18 = "啊，沒必要道歉。"
90101010-19 = "畢竟對我們而言，你剛才說的那些是真是假其實都無所謂。"
90101010-20 = "我們只是想拿你們這些「借了組織的錢卻賴帳」的可惡傢伙來殺雞儆猴罷了。"
90101010-21 = "殺，殺雞儆猴……難道說……"
90101010-22 = "哦？難道你已經知道了嗎？那事情就好說了。"
90101010-23 = ""
90101010-25 = ""
90101010-26 = ""
90101010-27 = "接下來你得去對付一下這個鐵桶裡的傢伙們。"
90101010-28 = "這些傢伙非常貪婪，不填飽肚子是不會停下來的。"
90101010-29 = "這次究竟能撐多久呢？"
90101010-30 = ""
90101010-33 = "等，等一下。那該不會是真的吧？"
90101010-34 = "那個鐵桶裡……不會真的有傳聞中的「怪物螃蟹」吧！？"
90101010-35 = "誰知道呢。"
90101010-36 = "那種事，你接下來自己確認一下不就知道了嗎。"
90101010-37 = ""
90101010-40 = ""
90101010-41 = "等一下！欠的錢我會還3倍……不，我會還5倍！"
90101010-42 = ""
90101010-45 = ""
90101010-46 = ""
90101010-47 = "求求你不要把我丟進「螃蟹鐵桶」裡啊──！"
90101010-49 = "下一話;蟹味魚肉香腸"
