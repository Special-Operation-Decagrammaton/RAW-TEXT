[translation]
2005605-1 = "Teahouse Brawl"
2005605-3 = "...Early morning."
2005605-4 = "I had to go meet with Koyuki at the arcade, so I put down my work for the moment and headed out."
2005605-9 = "Sensei! Sensei! It's still totally empty! We've got to grab a spot NOW!"
2005605-10 = "...Is what I would say if I was a sucker! But I already saved us spots! Come, sit, sit."
2005605-14 = "[ns1] \"Um... Why are you in your pajamas again...?\"\n[ns2] \"Who wears their pajamas to an arcade...?\""
2005605-17 = "...? Huh?"
2005605-18 = "Oh! I literally RAN here the second I woke up, duh!"
2005605-19 = "I didn't have time for menial stuff like changing! I'm serious! This place is going to overrun before you know it!"
2005605-20 = "They already made three announcements this morning, saying they had to turn away people who'd been waiting in line all night. That's how popular it is!"
2005605-21 = "So sit down already! Please? How many times do I have to tell you not to sweat the small stuff?"
2005605-22 = "...? Huh?"
2005605-23 = "Saving spots is just as bad as staying up all night...? ...Really?"
2005605-28 = "NO! I think that not being able to play this is even worse!"
2005605-29 = "[ns] Refuse to back down and scold her sternly."
2005605-30 = "O-Okay! I get it, I get it! I promise I won't do it again!"
2005605-31 = "But there's no one here yet anyway! So can you let it slide, pleaaase?"
2005605-32 = "[s] \"Just this once, okay?\""
2005605-33 = "Nihaha! That's my Sensei!"
2005605-34 = "All righty, we've already wasted too much time! Did you get a chance to look over all the strategy guides I sent you?"
2005605-35 = "Ah?! You've memorized most of them? That's my Sensei, times two! With the power of friendship..."
2005605-36 = "We're going to be the first to climb all 12 floors! That's our end goal!"
2005605-37 = "Now..."
2005605-38 = "...Here we go!!"
2005605-40 = "And so, Koyuki and I steeled our resolve and began playing the newly released game, Teahouse Brawl."
2005605-41 = "For two hours, we struggled with blood, sweat, and tears, inserting coin after coin in our desperate attempt to defeat it."
2005605-46 = "We made it...to the fifth floor...just once. The twelfth seemed like an impossible, faraway dream, but we kept up our futile chase."
2005605-49 = "― [log=코유키 파자마]Ahh! Why would you use that then?! [/log][wa:1740] "
2005605-51 = "― [log=코유키 파자마]I told you to do it AFTER I went![/log][wa:780] "
2005605-54 = "[ns3] \"No way! Your idea won't work at all!\"\n[ns4] \"BEFORE is right! I already explained it to you!\""
2005605-57 = "― [log=코유키 파자마]Are you trying to undermine my flawless plan?![/log][wa:1770] "
2005605-59 = "― [log=코유키 파자마]When I even got up early and saved a spot just for you, Sensei!![/log][wa:440] "
2005605-62 = "― [log=코유키 파자마]...Huh? That's a different issue entirely?[/log][wa:2060] "
2005605-64 = "― [log=코유키 파자마]If I really want to go there... Sensei's the one who spent more coins...?[/log][wa:940] "
2005605-67 = "― [log=코유키 파자마]Hmm... Well, that IS true, but... [/log][wa:2600] "
2005605-69 = "― [log=코유키 파자마]All righty, let's call it even! Temporary truce![/log][wa:1290] "
2005605-72 = "[ns5] \"What matters is that we beat this game!\"\n[ns6] \"Our goal is the same! We're allies!!\""
2005605-75 = "― [log=코유키 파자마]Right! This next run is going to be the one! I just feel it!! [/log][wa:1300] "
2005605-77 = "― [log=코유키 파자마]...Nihaha![/log]"
2005605-80 = "― [log=코유키 파자마]...Nihahaha...[/log][wa:800] "
2005605-83 = "So Koyuki and I teamed up one last time and put in our final coin."
2005605-84 = "We worked in perfect tandem, flying through the levels and setting a record!!"
2005605-88 = "Until we hit the 7th floor...and were forced to admit defeat."
2005605-91 = "Ugh... Ughhhh..."
2005605-92 = "How is this possible? No... Niha...ha..."
2005605-93 = "This game is garbage... What indie company made this trash...? Ugh..."
2005605-97 = "Still, good work, Sensei. Even though we only made it to the 7th floor, I had a lot of fun."
2005605-98 = "Someday, we'll get another chance..."
2005605-102 = "...Huh?"
2005605-103 = "Sensei? Why'd you just take out your wallet?"
2005605-104 = "Hey, what are you doing...? That..."
2005605-105 = "Th-That card...!! No way...!!"
2005605-106 = "[ns7] \"...We're winning.\"\n[ns8] \"I'm buying the console version, and we're winning.\""
2005605-109 = "..."
2005605-110 = "...!!"
2005605-111 = "Y-You're buying the console version?! Th-That was an option this whole time?!"
2005605-112 = "It's really expensive, you know!! I... I see. This is the power of being grown up."
2005605-116 = "I'll follow you for the rest of my life, Sensei! Today, we're going all the way to the end!!"
2005605-117 = "To the game store!!"
2005605-119 = "We went to the game store and bought the deluxe edition of Teahouse Brawl."
2005605-120 = "Koyuki and I spent 11 hours straight in the Schale break room playing."
2005605-124 = "And then we finally won."
