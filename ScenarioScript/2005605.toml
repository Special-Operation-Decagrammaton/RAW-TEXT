[translation]
2005605-1 = "喫茶店快打"
2005605-3 = "（……一大清早）"
2005605-4 = "（把工作暫時擱在一邊，和小雪約好去附近的遊樂場）"
2005605-9 = "老師你來了！現在還沒有人！"
2005605-10 = "……不對，位子已經占好了！來，快坐下！！"
2005605-14 = "[ns1] 「不是，但這身打扮是怎麼回事……」\n[ns2] 「來遊樂場穿睡衣？這是什麼組合？」"
2005605-17 = "……咦？"
2005605-18 = "啊，這個嗎？因為起床就直接衝出來了……"
2005605-19 = "哪有時間換衣服！？這個很快就會大排長龍的！"
2005605-20 = "今天早上光是通宵排隊的人被趕走的公告就發了三次呢。就是這麼有人氣！"
2005605-21 = "好啦好啦！所以快點坐下！每次都說別在意小事的老師怎麼這種時候特別計較！"
2005605-22 = "……咦？"
2005605-23 = "提前占位跟通宵排隊一樣不好……嗎？"
2005605-28 = "不能玩的話才是更不好的事情吧！！！！！"
2005605-29 = "[ns] 好好地教訓他不對的地方"
2005605-30 = "好，我知道了！以，以後不會這樣了……！"
2005605-31 = "但，但反正現在也沒人……今天就放過我吧……！"
2005605-32 = "[s] ……告訴他下不為例"
2005605-33 = "尼哈哈哈！！對嘛對嘛！"
2005605-34 = "那開始吧，攻略都看過了吧？我之前發給你了。"
2005605-35 = "啊，都記住了？太好了！這次老師和我聯手……"
2005605-36 = "成為首個12樓通關者！要抱著這樣的覺悟挑戰！！"
2005605-37 = "那就……"
2005605-38 = "……出發！！"
2005605-40 = "（就這樣和小雪下定決心，開始挑戰新出的《喫茶店快打》）"
2005605-41 = "（花了將近兩個小時，將所有硬幣都投進去挑戰……）"
2005605-46 = "（結果別說是12樓了，就連5樓也只到過一次，可說是慘敗連連……）"
2005605-49 = "― [log=코유키 파자마]啊啊！為什麼現在放那招啊！！ [/log][wa:2540] "
2005605-51 = "― [log=코유키 파자마]明明說過要在我之後才放的啊！[/log][wa:1540] "
2005605-54 = "[ns3] 「不對啦小雪。那個順序本來就是錯的。」\n[ns4] 「我再說明一次哦。這個是──」"
2005605-57 = "― [log=코유키 파자마]你打算毀掉我完美的作戰嗎！？[/log][wa:3050] "
2005605-59 = "― [log=코유키 파자마]我都為了老師早起占位子了耶！！[/log][wa:2400] "
2005605-62 = "― [log=코유키 파자마]……咦？那跟這是兩回事？[/log][wa:3260] "
2005605-64 = "― [log=코유키 파자마]真要說的話，老師那邊出的代幣更多……？[/log][wa:3100] "
2005605-67 = "― [log=코유키 파자마]唔嗯……那倒是沒錯啦……[/log][wa:3480] "
2005605-69 = "― [log=코유키 파자마]唔……休戰吧！暫時休戰！[/log][wa:2730] "
2005605-72 = "[ns5] 「是啊。重要的是要通關。」\n[ns6] 「目標是一樣的！我們是夥伴啊！！」"
2005605-75 = "― [log=코유키 파자마]說的也是！下次絕對會順利的！[/log][wa:3220] "
2005605-77 = "― [log=코유키 파자마]……尼哈哈！[/log]"
2005605-80 = "― [log=코유키 파자마]……尼哈哈。[/log][wa:1120] "
2005605-83 = "（之後和再次團結一心的小雪一起投入了最後的硬幣）"
2005605-84 = "（就這樣難得配合默契打出了最高紀錄……）"
2005605-88 = "（但還是無法跨越高聳的7樓之牆）"
2005605-91 = "嗚，嗚嗚……嗚嗚嗚……"
2005605-92 = "這說得過去嗎。不……尼哈……唉……"
2005605-93 = "真是垃圾遊戲……不，這根本不算遊戲。這……"
2005605-97 = "嗚嗚……辛苦了老師。雖然只到了7樓，但還是很開心。"
2005605-98 = "改天再找機會復仇……"
2005605-102 = "……嗯？"
2005605-103 = "老師？為什麼突然從口袋裡拿出錢包……"
2005605-104 = "不是，你現在在做什麼……？那個……"
2005605-105 = "那，那張卡……！！難道……！！"
2005605-106 = "[ns7] 「……要贏。」\n[ns8] 「家用版也同時發售了。買那個吧。」"
2005605-109 = "………………"
2005605-110 = "……！！！"
2005605-111 = "要，要買家用版！？真，真的……！！有這種方法！？"
2005605-112 = "可是那個超貴的……啊，原來如此。這就是大人的力量……！！"
2005605-116 = "一輩子追隨您，老師！今天一定要通關！！"
2005605-117 = "向遊戲店衝刺吧～！！！"
2005605-119 = "（就這樣去遊戲店買了《喫茶店快打》豪華版，帶回夏萊休息室）"
2005605-120 = "（之後和小雪一起連續奮戰了大約11個小時……）"
2005605-124 = "（……最終，我們終於勝利了）"
