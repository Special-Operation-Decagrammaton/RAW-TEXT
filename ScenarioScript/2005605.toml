[translation]
2005605-1 = "喫茶店快打"
2005605-3 = "（一大清早……）"
2005605-4 = "（把工作暫時擱在一邊，前往了跟小雪約好的附近的遊樂場）"
2005605-5 = ""
2005605-9 = "你來啦，老師！#n現在還沒有人，進去馬上就能搶到位置哦！"
2005605-10 = "……不對，其實我已經占好位置了！來，快坐下吧！！"
2005605-11 = ""
2005605-14 = "[ns1] 「不是，你這身打扮是怎麼回事……」\n[ns2] 「穿著睡衣來遊樂場？這是什麼組合？」"
2005605-17 = "……咦？"
2005605-18 = "啊，這個嗎？#n沒有啦，因為我起床之後就直接衝過來了……"
2005605-19 = "根本沒有時間換衣服好嗎！？#n要是不快點的話，這裡很快就會大排長龍的！"
2005605-20 = "驅趕夜排隊伍的公告，光是今天早上就已經發了三次耶！#n這款遊戲的人氣就是這麼誇張！"
2005605-21 = "來來來！快點坐下！#n我不是每次都說不用在意那種雞毛蒜皮的小事嗎！"
2005605-22 = "……咦？"
2005605-23 = "提前占位跟通宵排隊一樣是不好的行為……？"
2005605-24 = ""
2005605-26 = ""
2005605-28 = "玩不到這款遊戲才不好吧！！！！！"
2005605-29 = "[ns] 毫不退讓地斥責他的不對"
2005605-30 = "我，我知道了啦！#n以，以後不會再這樣了……！"
2005605-31 = "反，反正現在也沒有其他人，今天就放過我這一次嘛！？"
2005605-32 = "[s] ……告訴他下不為例"
2005605-33 = "尼哈哈哈！！這樣才對嘛！"
2005605-34 = "那就開始吧！#n之前發給你的攻略都看過了吧？"
2005605-35 = "啊，都記住了是嗎？太好了！#n這次老師和我聯手……"
2005605-36 = "一定可以成為最先通關第12層的玩家！抱著這樣的心態加油吧！！"
2005605-37 = "那麼……"
2005605-38 = "開始吧！！"
2005605-40 = "（就這樣和小雪鼓起幹勁，開始挑戰新出的《喫茶店快打》）"
2005605-41 = "（雖然花了將近兩個小時，投入所有硬幣進行挑戰……）"
2005605-45 = ""
2005605-46 = "（結果別說是第12層了，就連第5層也只抵達過一次，可說是慘敗連連……）"
2005605-49 = "― [log=코유키 파자마]啊啊！為什麼現在放那招啊！！ [/log][wa:2540] "
2005605-51 = "― [log=코유키 파자마]明明說過要在我之後再放的啊！[/log][wa:1540] "
2005605-54 = "[ns3] 「什麼啦？那個順序本來就是錯的啊！？」\n[ns4] 「哪有，這樣才是對的啦！剛才不是說過了嗎！！」"
2005605-57 = "― [log=코유키 파자마]你打算毀掉我完美的作戰嗎！？[/log][wa:3050] "
2005605-59 = "― [log=코유키 파자마]我都為了老師早起占位子了耶！！[/log][wa:2400] "
2005605-62 = "― [log=코유키 파자마]……咦？那個跟這個是兩回事？[/log][wa:3180] "
2005605-64 = "― [log=코유키 파자마]真要說的話，老師出的代幣比較多……？[/log][wa:3140] "
2005605-67 = "― [log=코유키 파자마]唔嗯……那倒是沒錯啦……[/log][wa:3480] "
2005605-69 = "― [log=코유키 파자마]唔……休戰吧！暫時休戰！[/log][wa:2730] "
2005605-72 = "[ns5] 「是啊。重要的是要突破關卡。」\n[ns6] 「目標是一樣的！我們是夥伴啊！！」"
2005605-75 = "― [log=코유키 파자마]說的也是！我下次絕對會發揮得更好的！[/log][wa:3060] "
2005605-77 = "― [log=코유키 파자마]……尼哈哈！[/log]"
2005605-80 = "― [log=코유키 파자마]……尼哈哈。[/log][wa:1120] "
2005605-83 = "（之後和小雪重整旗鼓，投入了最後的代幣）"
2005605-84 = "（即便難得默契十足地創下了最高紀錄……）"
2005605-85 = ""
2005605-88 = "（可惜還是無法跨越高聳的第7層之牆）"
2005605-91 = "唔，唔唔……"
2005605-92 = "不是，這像話嗎……尼哈……唉……"
2005605-93 = "根本是款爛遊戲……不對，這根本不算遊戲……"
2005605-94 = ""
2005605-96 = ""
2005605-97 = "老師你也辛苦了。#n雖然只到了第7層，不過我還是很開心。"
2005605-98 = "改天我們再找機會復仇……"
2005605-99 = ""
2005605-102 = "……嗯？"
2005605-103 = "老師？為什麼突然從口袋裡拿出錢包……"
2005605-104 = "等等，你現在在做什麼……？"
2005605-105 = "那，那張卡是……！！難道說……！！"
2005605-106 = "[ns7] 「……要贏。」\n[ns8] 「反正也有家用版，就買那個吧。」"
2005605-109 = "………………"
2005605-110 = "……！！！"
2005605-111 = "要，要買家用版！？#n確，確實還有這招沒錯……！"
2005605-112 = "可是那個超貴的……#n原，原來如此。這就是大人的力量嗎……！！"
2005605-113 = ""
2005605-115 = ""
2005605-116 = "我會一輩子追隨你的，老師！#n今天就跟它拚到底吧！！"
2005605-117 = "向著遊戲店全速前進～！！！"
2005605-119 = "（就這樣前往遊戲店，將《喫茶店快打》豪華版買回了夏萊的休息室）"
2005605-120 = "（之後和小雪一起連續奮戰了大約11個小時……）"
2005605-123 = ""
2005605-124 = "（……最終，我們贏得了這場勝利）"
