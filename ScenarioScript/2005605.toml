[translation]
2005605-1 = "ศึกเดือดร้านชา"
2005605-3 = "(เช้าตรู่...)"
2005605-4 = "(คุณครูละมือจากงานที่กำลังทำอยู่ แล้วมุ่งหน้าไปยังร้านเกมใกล้ๆ ที่นัดกับโคยูกิไว้)"
2005605-5 = ""
2005605-9 = "มาแล้วเหรอคะ คุณครู! ตอนนี้ยังไม่มีใครมาเลยค่ะ! ถ้าเป็นตอนนี้ละก็จะต้องจองที่ได้แน่ๆ ค่ะ!"
2005605-10 = "ฉันจองที่นั่งเอาไว้แล้วละค่ะ! มานั่งตรงนี้สิคะ!!"
2005605-11 = ""
2005605-14 = "[ns1] \"เดี๋ยวสิ ทำไมถึงใส่ชุดนั้น...\"\n[ns2] \"ใส่ชุดนอนมาร้านเกม? การผสมผสานแบบไหนเนี่ย?\""
2005605-17 = "......? คะ?"
2005605-18 = "อ๋อ นี่น่ะเหรอคะ? เปล่าหรอกค่ะ ฉันแค่ตื่นนอนแล้วก็รีบออกมาเลยน่ะ"
2005605-19 = "จะเอาเวลาที่ไหนมาเปลี่ยนเสื้อผ้าล่ะคะ?! อีกไม่นานคงจะมีคนมาต่อแถวยาวมากแน่ๆ เลยค่ะ!!"
2005605-20 = "แค่ช่วงเช้ามืดที่ผ่านมาก็มีประกาศไล่คนที่พยายามมานอนรอต่อคิวก่อนตั้งสามรอบแล้วนะคะ มันเป็นที่นิยมมากเลยนะคะ"
2005605-21 = "เอาละๆ รีบๆ มานั่งเถอะค่ะ! ต้องให้บอกทุกครั้งเลยนะคะว่าปล่อยเรื่องเล็กๆ น้อยๆ ไปบ้างก็ได้น่ะ"
2005605-22 = "...? คะ?"
2005605-23 = "จะบอกว่ามาจองที่นั่งล่วงหน้าแบบนี้ก็แย่พอๆ กับมารอทั้งคืน... งั้นเหรอคะ?"
2005605-24 = ""
2005605-26 = ""
2005605-28 = "แต่การที่ไม่ได้เล่นเกมนี้น่ะ มันแย่ซะกว่าอีกนะคะ!!!!"
2005605-29 = "[ns] อบรมสั่งสอนต่อโดยไม่ลดละ"
2005605-30 = "ขะ... เข้าใจแล้วค่ะ! คะ... คราวหน้าจะไม่ทำแบบนี้แล้วค่ะ...!"
2005605-31 = "ตะ... แต่ว่าตอนนี้ไม่มีคนเลยนี่นา วันนี้ช่วยมองข้ามไปก่อนไม่ได้เหรอคะ?!"
2005605-32 = "[s] บอกว่าวันนี้จะยอมให้ก่อน..."
2005605-33 = "อุวะฮะฮ่า! ต้องอย่างนี้สิคะ!"
2005605-34 = "งั้นมาเริ่มกันเลยดีกว่าค่ะ ได้ลองคิดกลยุทธ์การเคลียร์ด่านคร่าวๆ มาแล้วใช่มั้ยคะ? ฉันส่งไปบอกแล้วนี่คะ"
2005605-35 = "อ๋อ จำได้หมดแล้วใช่มั้ยคะ? สุดยอดเลยค่ะ! ถ้ารวมพลังเราสองคนละก็..."
2005605-36 = "จะต้องไปถึงชั้น 12 เป็นทีมแรกได้แน่นอนค่ะ! มาลุยกันด้วยความมุ่งมั่นเถอะค่ะ!!"
2005605-37 = "เอาละ..."
2005605-38 = "ลุยละนะคะ!!"
2005605-40 = "(คุณครูและโคยูกิเล่นเกม <ศึกเดือดร้านชา> กันอย่างมุ่งมั่นและดุเดือด)"
2005605-41 = "(ทั้งสองคนทุ่มเหรียญที่มีอยู่เล่นเกมนานเกือบสองชั่วโมง)"
2005605-45 = ""
2005605-46 = "(นอกจากจะไปไม่ถึงชั้นที่ 12 แล้ว ชั้นที่ 5 ยังผ่านไม่ได้เลยด้วยซ้ำ...)"
2005605-49 = "― [log=코유키 파자마]โอ๊ย! ทำไมถึงใช้ตอนนี้กันล่ะคะ!! [/log][wa:1820] "
2005605-51 = "― [log=코유키 파자마]บอกแล้วไงว่าให้ฉันใช้ก่อน! คุณครูค่อยใช้น่ะค่ะ![/log][wa:220] "
2005605-54 = "[ns3] \"พูดอะไรของเธอน่ะ? บอกแล้วว่ามันผิดตั้งแต่สมมติฐานเลยน่ะ?!\"\n[ns4] \"เดี๋ยวสิ แบบนี้ต่างหากที่ถูก! พูดไม่ฟังเลยนะ!!\""
2005605-57 = "― [log=코유키 파자마]คิดจะปฎิเสธแผนการอันสมบูรณ์แบบของฉันเหรอคะ?![/log][wa:1850] "
2005605-59 = "― [log=코유키 파자마]ฉันอุตส่าห์ตื่นตั้งแต่เช้า เพื่อมาจองที่ให้คุณครูเลยนะคะ!![/log][wa:680] "
2005605-62 = "― [log=코유키 파자마]คะ...? เรื่องนั้นกับเรื่องนี้ มันคนละเรื่องกันเหรอ?[/log][wa:1700] "
2005605-64 = "― [log=코유키 파자마]ถ้าพูดแบบนั้น ทางคุณครูเป็นฝ่ายออกเหรียญมากกว่างั้นเหรอคะ?[/log][wa:1540] "
2005605-67 = "― [log=코유키 파자마]อืม... แต่ถึงอย่างนั้นก็เถอะ...[/log][wa:2720] "
2005605-69 = "― [log=코유키 파자마]งั้นถือว่าเสมอกันแล้วกันนะคะ! สงบศึกก่อนแล้วกัน![/log][wa:1290] "
2005605-72 = "[ns5] \"นั่นสินะ สิ่งสำคัญคือการเคลียร์ให้ได้ต่างหาก\"\n[ns6] \"เป้าหมายของพวกเราเหมือนกัน! ถือว่าเป็นฝ่ายเดียวกัน!!\""
2005605-75 = "― [log=코유키 파자마]ใช่แล้วค่ะ! คราวหน้าจะต้องไปได้สวยแน่นอนค่ะ!![/log][wa:1980] "
2005605-77 = "― [log=코유키 파자마]วะฮ่าฮ่า...![/log]"
2005605-80 = "― [log=코유키 파자마]วะฮ่าฮ่าฮ่า...![/log][wa:760] "
2005605-83 = "(หลังจากนั้นคุณครูกับโคยูกิก็ร่วมมือกันอีกครั้ง และใช้เหรียญทั้งหมดที่เหลืออยู่)"
2005605-84 = "(ถึงจะทำสถิติสูงสุดได้ด้วยการเล่นเข้าขากันอย่างยอดเยี่ยมก็ตาม...)"
2005605-85 = ""
2005605-88 = "(แต่ก็ผ่านไปได้แค่ชั้น 7 เท่านั้น)"
2005605-91 = "ฮือออ.... ฮือออ...."
2005605-92 = "เป็นไปได้ยังไงกัน เรื่องแบบนี้... วะ... ฮะ... ฮะ... ฮ่า..."
2005605-93 = "เป็นเกมที่ห่วยแตกจริงๆ ค่ะ... ไม่สิ ไม่ใช่เพราะเกมหรอก..."
2005605-94 = ""
2005605-96 = ""
2005605-97 = "ยังไงก็ขอบคุณมากนะคะ คุณครู ถึงจะไปได้แค่ชั้น 7 แต่ก็สนุกมากเลยค่ะ"
2005605-98 = "เอาไว้ถ้ามีโอกาสหน้า..."
2005605-99 = ""
2005605-102 = "หืม...?"
2005605-103 = "คุณครู? ทำไมถึงล้วงกระเป๋าเงินออกมาล่ะคะ..."
2005605-104 = "เดี๋ยวก่อนค่ะ คิดจะทำอะไรคะ...?"
2005605-105 = "บะ... บัตรนั่น...!! หรือว่า...!!"
2005605-106 = "[ns7] \"มาชนะกันเถอะ...\"\n[ns8] \"เกมเวอร์ชั่นคอนโซลวางขายแล้ว เลยว่าจะซื้ออันนั้นน่ะ\""
2005605-109 = "......"
2005605-110 = "......!!!!"
2005605-111 = "คะ... คุณครูจะซื้อเวอร์ชั่นคอนโซลเหรอคะ?! จะ... จะเอาอย่างนั้นจริงเหรอคะ?!"
2005605-112 = "แต่ว่ามันแพงมากเลย... นะ... นั่นสินะคะ เพราะงั้นก็เลยต้องใช้อำนาจของผู้ใหญ่...!!"
2005605-113 = ""
2005605-115 = ""
2005605-116 = "ฉันจะติดตามคุณครูไปตลอดชีวิตเลยค่ะ! วันนี้ก็จะขอลุยให้สุดๆ เลยด้วยค่า!!"
2005605-117 = "ไปร้านขายเกมกันเลย~!!!"
2005605-119 = "(หลังจากนั้นทั้งสองคนก็ไปที่ร้านขายเกม และซื้อ <ศึกเดือดร้านชา> กลับไปเล่นกันต่อที่ชาเล่ต์)"
2005605-120 = "(คุณครูกับโคยูกิใช้เวลาเล่นเกมนี้ด้วยกันอีกเกือบ 11 ชั่วโมง...)"
2005605-123 = ""
2005605-124 = "(และก็ชนะได้ในท้ายที่สุด...)"
