[translation]
10050010-1 = "제1화;2+1"
10050010-6 = "……."
10050010-7 = "……."
10050010-8 = "이거 이래도 되나요, 트리니티……?"
10050010-9 = "화, 확실히 이건 예상 밖이네요. 이렇게 타 학교 자치구에 아무 제재도 없이 들어올 수 있다니……."
10050010-10 = "흐음. 여차하면 검문, 감시, 뇌물에 이은 탈출과 암약까지도 생각하고 있었는데 말이죠."
10050010-11 = "……그런 뒤숭숭한 걸 생각하고 있었나요, 부장님……?"
10050010-12 = "무슨 말씀을. 계획을 세울 때는, 항상 최악의 가능성을 고려해 봐야 하는 법이라고요?"
10050010-13 = "원칙적으로는 동의 드리는 바인데요……."
10050010-14 = "아무튼, 너무 아무렇지도 않게 들어올 수 있어서, 이게 현실인가 하는 생각마저 들 정도네요."
10050010-15 = "현실이든 아니든 우리는 이 재고를 처리…… 판매해야 해요."
10050010-16 = "만일 이게 가상현실이라면, 가상화폐라도 잔뜩 가지고 돌아가겠어요!"
10050010-23 = "어머나? 평안하신가요. 처음 뵙는 분들 같은데, 누구시죠?"
10050010-24 = "어, 어떻게 하죠. 부장님?!"
10050010-25 = "……."
10050010-26 = "안녕하십니까! 이야~ 이것도 인연이라고 할 수 있는 걸까요. 우리는 붉은겨울 연방학원에서 온…… 그렇네요! 트리니티를 견학하러 온 학생들입니다!"
10050010-27 = "그, 그렇게 대놓고 이야기해도 되는 걸까요?!"
10050010-28 = "냉정해져요. 타카네. 기껏해야 최악의 경우라고 해도 추방밖에 더 당하겠어요?"
10050010-29 = "오히려 무언가를 숨기는 척하다가, 더 큰 오해를 사는 게 진짜 문제라고요."
10050010-30 = "붉은겨울! 그렇군요. 정말로 반가워요. 트리니티에 잘 오셨습니다. 이야기는…… 네. 약간 전해 들었어요."
10050010-31 = "언제나 극한의 추위 속에서 곰과 싸우며, 신체를 극한까지 단련하는 분들이라면서요?"
10050010-32 = "우리, 그런 식으로 안 지내는데요……."
10050010-33 = "그런가 보다 합시다. 말 맞춰요, 말."
10050010-34 = "네, 네에! 그보다 저희는, 이렇게 말도 없이 트리니티 종합학원에, 어떻게 보면 무례를 무릅쓰고 들어온 것이나 다름없는데……."
10050010-35 = "괜찮으신, 걸까요……?"
10050010-36 = "어머나. 무슨 말씀을. 괜찮답니다. 얼마든지 편하게 계시다 가셔요."
10050010-37 = "물론 트리니티 종합학원이 조금 폐쇄적인 면이 있다는 소문이 있고, 그 소문의 어떤 부분은 사실이기도 했지만……."
10050010-38 = "저희도 늘 그런 것은 아니랍니다. 가능한 한 변화하려 하고 있죠."
10050010-39 = "오히려 3대 학원의 한 축으로서, 더욱 많은 외부 학생분에게 친절해지려 노력하고 있으니까요."
10050010-40 = "안내 감사합니다! 그런데 혹시, 책이나 이야기 같은 거 좋아하시는지요?"
10050010-41 = "책 말씀이신가요? 네. 취미 정도로 가끔 읽기도 하고, 익숙하답니다. 채플 시간에도 경전을 읽어야 하고 말이죠."
10050010-42 = "무엇보다 키보토스에서 출판되는 웬만한 책은, 트리니티 중앙 도서관에도 배치되어 있으니까요."
10050010-43 = "그거 정말 듣던 중 반가운 말씀이로군요! 그런 의미에서 저희가 조금…… 특별할 수도 있는 책을 가져와 봤는데 말이에요."
10050010-48 = "한번, 어떠십니까? 몇 페이지 정도만 읽어 보지 않으시겠어요?"
10050010-49 = "네? 그야 뭐…… 오히려 제 쪽에서 감사하다고 말씀을 드려야 할 것 같기도 한데요."
10050010-50 = "그러면, 어디……."
10050010-55 = "이, 이 내용은?!?!"
10050010-56 = "하와와……."
10050010-62 = "도대체 어떻게 된 거죠, 부장님?"
10050010-63 = "어떻게 된 거냐니, 오히려 그건 내가 묻고 싶은 말인데요……."
10050010-64 = "일단 깨워서 다시 말을 걸도록 하죠. 자, 여기 캄포트 조금 드셔 보세요. 227호 특제랍니다."
10050010-65 = "으읏……?! 가, 감사합니다. 정신이 번쩍 드네요. 그보다 그 책……."
10050010-66 = "……."
10050010-67 = "그, 뭐라고 말씀드려야 할까요. 저는 그렇게 싫지 않기는 했는데……."
10050010-68 = "더 솔직히 말하자면…… 좋기도, 한데……."
10050010-69 = "그, 여러모로…… 좀 강하네요……."
10050010-70 = "네? 이게요……?"
10050010-71 = "(어라……? 혹시 트리니티에서는, 이 정도로도……?)"
10050010-72 = "그런가요? 그렇겠지요! 하지만 그렇다고 해서 크게 문제가 될 부분은 없을 겁니다!"
10050010-73 = "제일 중요한 부분들은 묘사되지 않았을 테니까요! 당연할 겁니다! 왜냐하면 제가 전부 검열…… 편집했으니까요!"
10050010-74 = "그, 그건 맞는 말 같긴 했는데요."
10050010-75 = "저기, 그래서 오히려 더……. 강하게, 느껴지는 부분이 있다고나, 할까요……."
10050010-76 = "뭘 좀 아시는군요. 손님. 감사합니다."
10050010-77 = "(손님……?)"
10050010-78 = "원래 말이죠. 이런 것은, 이른바 적당히 가리는 것이 더 중요한 법이니까요."
10050010-79 = "……창작자란 분들은, 자주 폭주하는 나머지, 그만 끝까지 가 버리는 경향이 있기는 합니다만……. 그거야말로 하나만 알고 둘은 모르는 행위라고요!"
10050010-80 = "문화 매체에서 가장 중요한 것은, 상상의 여지를 남겨 두는 것이니까요!"
10050010-81 = "그, 그런가요?!"
10050010-82 = "네. 왜냐하면 사람의 상상력에는 한계가 없기 때문이죠. 바로 그렇기 때문에! 상상력의 수위는 한도가 없는 법!"
10050010-83 = "상상의 여지를 적당히 남겨 주면 남겨 주는 만큼! 그 수위 역시 스스로 한계를 뚫고 돌파하기 마련입니다!"
10050010-84 = "드, 듣고 보니 확실히!"
10050010-85 = "……조금 전에, 검열했다고 말씀하시지 않았나요. 부장님?"
10050010-86 = "편집입니다."
10050010-87 = "하지만……."
10050010-88 = "뭐, 엄밀히 따지자면 검열 비슷한 걸 하기는 했지만, 어쩌겠어요. 사무국에서 하라는데."
10050010-89 = "하지만 알아 두세요, 타카네! 물건을 팔려면…… 검열이라는 사항까지 이용할 줄 알아야 하는 법이라는 걸!"
10050010-90 = "즉, 검열을 빌미로 적당한 부분을 편집해서, 오히려 상품성을 극대화했다는 말씀이신가요……?"
10050010-91 = "바로 그겁니다. 위에는 지시대로 검열을 이행했다고 둘러댈 수 있고!"
10050010-92 = "상품을 소비하는 입장에서는 오히려 만족스러운 결과물을 얻을 가능성도 있죠!"
10050010-93 = "바로 여기, 이 트리니티 학생분이 그 증거입니다!"
10050010-94 = "하, 하와와……."
10050010-98 = "……."
10050010-99 = "역시 부장님이세요! 이럴 때 한해서 믿음직스러우시다니까요!"
10050010-100 = "저, 저기. 그래서 말인데요……. 다음 권, 없을까요……?"
10050010-101 = "있고 말고요! 얼마든지 있답니다, 손님! 그리고 혹시 마음에 드신다면 주위 분들에게 조심스럽게 권유해 보는 것도 어떠실까 하는데요!"
10050010-102 = "햐읏?!"
10050010-103 = "책은 물리적인 한계를 갖는 문화 매체……. 한 권의 책이 동시에 이곳과 저곳에 존재할 수는 없는 법이죠."
10050010-104 = "그런 의미에서 똑같은 걸 한 권 더 사시는 건 어떨지!"
10050010-105 = "그렇지만, 어째서 같은 걸 두 개씩이나……?"
10050010-107 = "그야, 한 권은 자기 몫으로, 다른 한 권은 친우분들께 빌려드려야 하지 않겠어요?"
10050010-108 = "같은 문화를 공유하는 것으로, 보다 넓고 친밀한 교우 관계를 다지는 것도 얼마든지 가능할 것이고요?"
10050010-109 = "드, 듣고 보니……!"
10050010-110 = "그런데 말이에요. 정말 그것만으로 괜찮겠습니까. 손님?"
10050010-111 = "책이라는 물건은, 보다 보면 헤지고 닳아서 망가지는 법이니 말이에요……?"
10050010-112 = "아!"
10050010-113 = "그런 분들을 위해, 여기 포장도 뜯지 않은 신품 책이 있답니다?"
10050010-114 = "만일을 위해 보관용으로 구매하면 좋지 않을까 하는데, 어떠신가요?"
10050010-115 = "익히 알고 계실지도 모르겠지만, 이런 건 원래 소장용, 감상용, 포교용으로 세 권을 사는 것이 일반적인 상식이니까요."
10050010-116 = "(그런 상식이, 있었나……?)"
10050010-117 = "하, 하지만 그러면 결국 같은 책을 세 권이나 사게 되는 결과가 나오지 않나요……?"
10050010-118 = "그런 손님을 위해, 지금이라면 2+1 합본 세트로 15% 할인가에 제공해 드립니다!"
10050010-119 = "주세요."
10050010-120 = "감사합니다! 주위에도 많이 알려 주세요!"
10050010-126 = "그래서, 어떤가요. 타카네?"
10050010-127 = "여러모로 드릴 말씀이 있는 것 같기도 하지만……."
10050010-128 = "어쩔 수 없네요. 이럴 때의 부장님 능력은 인정할 수밖에 없는 것 같아요."
10050010-129 = "그거면 충분합니다. 힛. 힛. 히."
10050010-133 = "그러면, 본격적으로 가 보도록 할까요. 이 트리니티를 우리들의 색으로 물들여 보자고요!"
10050010-135 = "……혹시 알고 계신가요? 요즘 트리니티에서…… 유행하고 있는 그 이야기……."
10050010-136 = "트리니티에서 유행하는 것이라면 여러 가지가 있겠습니다만……. 어떤 것을 뜻하시나요?"
10050010-137 = "그것은……"
10050010-138 = "어머나……."
10050010-139 = "운이 좋게도 저에게 후속권이 있는데, 어떻게 하시겠어요?"
10050010-140 = "괜찮으시다면 오늘, 실례하여도 될까요?"
10050010-141 = "저는 기뻐요. 같은 아름다움을 향유할 수 있는 친우분이 늘어난다는 것은……."
10050010-143 = "괜찮으신가요? 이런 이야기를…… 접하셔도."
10050010-144 = "……환멸 하셨나요?"
10050010-145 = "그럴 리가요. 아름다움은 누구에게나 기쁨을 베풀어 주는 법이지요."
10050010-146 = "그렇다면, 자매님의 은혜에 기대어서……."
10050010-155 = "이것은……?"
10050010-156 = "실망스러울지도 모르겠습니다만, 이런 전개라면 어떠했을까…… 하고 저 나름대로 생각하여 만들어 본 책이랍니다."
10050010-157 = "무, 물론 원작의 그것에는 결코 미치지 못하겠습니다만……."
10050010-158 = "감사히 읽겠습니다. 자리를 함께해 주시길 부탁드려도 될까요?"
10050010-159 = "네. 기꺼이."
10050010-171 = "……좋은 찻잎이군요."
10050010-172 = "네. 이번에는 제법 고생했답니다. 나기사 님."
10050010-177 = "그래 보여요. 맛과 향, 모두 흠잡을 곳이 없네요. 다즐링 베이스로 블렌딩한 얼 그레이죠?"
10050010-178 = "은은한 청포도 향 위로 스파이시하게 스스로를 주장하는 시트러스 향이 인상적이에요. 베르가못 오일이 신선하다는 증거이겠죠."
10050010-179 = "다시 한번, 이렇게 좋은 차를 구해 주셔서 고마워요."
10050010-180 = "천만에요. 나기사 님께서 마음에 드신다니 다행입니다."
10050010-183 = "평화롭군요……. 치유되는 기분이에요."
10050010-184 = "선생님께서 이 자리에 계셨다면 더 좋았겠지만……. 그래도, 만족할 줄 알아야겠지요."
10050010-186 = "그러고 보니 요즘 트리니티에 재미있는 책이 유행한다고 들었는데, 알고 있나요?"
10050010-187 = "재미있는 책…… 아, 네! 마침 저도 그 책을 구해서 가지고 있답니다!"
10050010-188 = "아직 내용을 보지는 못했지만, 다들 호평인 듯하니 좋은 책이 아닐까요?"
10050010-189 = "어머나. 그건 반가운 소식이군요."
10050010-190 = "그런데 조금 이상한 부분이 있기는 해요."
10050010-191 = "그 책에 대한 이야기만 나오면, 뭔가 자기들끼리 비밀스럽게 할 이야기가 있다는 듯이, 두세 분이서 자리를 피하곤 하거든요."
10050010-192 = "후후. 학생들 사이에 우애와 친교를 다지는 것은, 오히려 권장해야 할 일이겠지요."
10050010-193 = "특히 그렇게 재미있는 것이라면, 마음이 맞는 사람끼리 더더욱 나누고 싶기 마련이지 않을까요? 저는 충분히 이해할 수 있다고 보이네요."
10050010-194 = "네. 그렇겠지요? 저도 그렇게 생각한답니다."
10050010-195 = "저에게도 그 책을 보여주시겠어요? 아무래도 호기심이 생기는 것은, 어쩔 수가 없네요.."
10050010-196 = "네. 나기사 님. 여기 있습니다."
10050010-200 = "그러면, 어디 어디……."
10050010-205 = "……?"
10050010-209 = "?!?!?!"
10050010-215 = "나, 나기사 님? 나기사 님?!?!"
