[translation]
80000137-1 = "이건 박물관으로 가야 해!"
80000137-2 = "(샬레에서 업무를 보던 중, 라브의 기운이 느껴졌다.)"
80000137-3 = "(라브가 지나갈 법한 골목으로 가 보았다.)"
80000137-5 = "샬레 인근 뒷골목"
80000137-10 = "……음, 좋아."
80000137-11 = "앗, 앞머리 조금 빗을까……."
80000137-12 = "[ns1]\"라!\"\n[ns2]\"브!\""
80000137-18 = "우, 우와아악!! 깜짝이야!!"
80000137-19 = "놀랐잖아!! 기습인 줄 알고 쏠 뻔했다고!!"
80000137-20 = "뭐야, 일하는 시간 아니야?! 샬레에 있던 거 아니었어?"
80000137-21 = "[s]\"라브가 근처에 온 것 같길래!\""
80000137-22 = "그건 대체 무슨……. 하아, 됐다. 너무 반가워하는 거 아니냐고, 정말이지……."
80000137-23 = "마침 잘 됐다, 안 그래도 지금 샬레에 가던 길이었거든."
80000137-24 = "줄 게 있어서 직접 찾아오셨다- 이 말이야!"
80000137-25 = "[s3]\"직접 짠 모자?\"\n[s4]\"교환 일기?\"\n[s5]\"중학교 졸업 앨범?\""
80000137-29 = "왜 그런 걸 갖고 싶어 하는 건데?!"
80000137-30 = "그보다, 바빠서 달력도 못 보는 거야? 걱정되게……."
80000137-34 = "자!"
80000137-35 = "직접 만드는 건 여유도 없고 자신도 영 없어서."
80000137-36 = "편의점에서 산 초콜릿이지만 이걸로 참으라구."
80000137-37 = "내 것하고 선생 거, 두 개 샀으니까, 어디 보자……. 암냐……."
80000137-41 = "으디브즈…… 어히둬허하……."
80000137-46 = "으, 으으므?"
80000137-47 = "[s6]\"아파?\"\n[s7]\"열나?\"\n[s8]\"배고파?\""
80000137-51 = "므하!! 정신 사납네, 진짜! 초콜릿 물고 있어서 대답 못 한다고!"
80000137-52 = "분명 두 개 사서 가방에 넣어뒀는데, 이거 하나밖에 없어."
80000137-53 = "아까 시비 걸렸을 때 싸우다가 떨어뜨렸나 봐, 치이……."
80000137-54 = "[s]\"마음만으로도 충분해!\""
80000137-55 = "에이, 안되지. 그래도 날이 날인데, 아쉽잖아."
80000137-56 = "끄응……."
80000137-60 = "선생, 내가 입에 물긴 했지만, 이거라도 나눠 먹을래?"
80000137-65 = "지금 손이 좀 더러우니까, 선생이 깨끗한 쪽 쪼개서 먹어."
80000137-66 = "쪼개는 선 따라서 잘 자를 수 있지?"
80000137-70 = "[ns]\"맡겨만 줘!\""
80000137-71 = "아아, 아쉽네. 큰맘 먹고 두 개나 산 건데."
80000137-72 = "응, 딱 절반으로 쪼개면 되겠……."
80000137-78 = "……."
80000137-79 = "일 연락인가 보네?"
80000137-80 = "[s] \"으응, 그렇긴 한데…….\""
80000137-84 = "얼른 가 봐. 기다리게 하지 말고."
80000137-85 = "누군가 선생이 필요한 거잖아?"
80000137-86 = "[s]\"미안, 라브! 다음에 꼭 놀러 와!\""
80000137-90 = "뛸 때는 앞에만 보고 뛰어! 위험하잖아?!"
80000137-97 = "……나 참."
80000137-98 = "……다음에, 라니."
80000137-99 = "……꼭 놀러 오라고 했으니, 각오하라고."
80000137-100 = "그럼, 자판기나 뒤지러 가볼까."
80000137-106 = "초콜릿, 어디 갔지?"
80000137-110 = "내가 입에 물었던 건데……?"
80000137-111 = "선생이 그대로 들고 갔잖아……?!"
