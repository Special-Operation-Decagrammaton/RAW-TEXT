[translation]
10057110-1 = "第11話;ただし全ての摩擦は無視するものとする"
10057110-2 = "183号車庫"
10057110-4 = "先生。よろしければ運転をしていただけますか？"
10057110-5 = "ギアはニュートラルにしておき、車体が一方に偏らないようにお願いします。"
10057110-6 = "ブレーキは絶対に踏んではいけません。"
10057110-7 = "[s] \"分かった！\""
10057110-11 = "ラナ、燃料がないのにどうするつもりなの？"
10057110-12 = "残念なのは分かるけど……十分頑張ったし、もう休んでも……。"
10057110-14 = "早く乗って、砲弾を装填して。"
10057110-15 = "この戦車は作用反作用の法則で動くから。"
10057110-19 = "……！"
10057110-26 = "よいしょ！"
10057110-28 = "どういうこと！？アンナもどうして乗ってるの？"
10057110-29 = "引き上げるから、手をつかんで！"
10057110-30 = "う、うわあっ！"
10057110-34 = "砲弾装填！"
10057110-35 = "ちょっと、何なの～？"
10057110-36 = "化学者なのに分からないの？作用反作用の法則！"
10057110-37 = "作用と反作用！"
10057110-38 = "作用と反作用……。"
10057110-42 = "まさか、砲撃の反動で動かすってこと！？"
10057110-44 = "駐退距離、確保。"
10057110-45 = "砲尾、確保！"
10057110-46 = "車庫の中で砲撃したら183号はどうなるの～！"
10057110-47 = "どうせ……。"
10057110-51 = "もうボロボロでしょ！"
10057110-52 = "撃て！"
10057110-64 = "ほんとに壊れちゃった！！！あれでもみんなで過ごした家なのに～！！"
10057110-66 = "よしっ！ちゃんと反動で後進してるわ！履帯もしっかり回ってる！"
10057110-67 = "直属研究所に復帰したら、こういう交通手段も研究してみようかな？"
10057110-68 = "次弾、装填。"
10057110-69 = "了解！"
10057110-72 = "もう一発！？"
10057110-73 = "撃て！"
10057110-76 = "速くなった！？"
10057110-77 = "砲弾もちゃんと飛んで安心した～！#nそれにしても遠くまでいくなあ……。"
10057110-78 = "装薬にジフェニルアミンを添加したのがよかったのかも。#n古い火薬だから不発になるかと思ってた。"
10057110-81 = "でも、あっちの方向って何があったっけ？"
10057110-84 = "吹雪が止んで、少し暖かくなったね。"
10057110-85 = "それにしても……こうしてみんなを呼び出して、何の話だろ？"
10057110-88 = "レッドウィンターの諸君！今日は栄えあるゲヘナカップの予選だ！"
10057110-95 = "これより、諸君の士気を高める銅像の除幕式を行う！"
10057110-96 = "レッドウィンターがゲヘナカップを制するのだ！"
10057110-99 = "私たちの士気と生徒会長の銅像が、どう関係あるの？"
10057110-100 = "しっ、しーっ！聞こえちゃったらどうするの！？"
10057110-103 = "あれ、山から何か飛んできて――"
10057110-109 = "お、おいらの銅像が爆発した！？"
10057110-113 = "革命……なの？"
10057110-114 = "今？ここで？"
10057110-117 = "革命だ！！"
10057110-118 = "反乱分子め！この輝かしい場で革命だと！！"
10057110-119 = "親衛隊！！親衛隊！！！"
10057110-122 = "？？？"
10057110-123 = "マリナ、まさかお前の仕業なのか？窓ガラスと銅像の件で罰を与えたからか？"
10057110-126 = "もう、知らない……。"
10057110-129 = "革命の敵、連河チェリノの糾弾を開始する！！"
10057110-130 = "やっぱりお前か！！"
10057110-132 = "何だろ？学園の方騒がしくない……？"
10057110-133 = "ラナ、このまま続けて撃つの？砲弾も残り少ないんだけど……。"
10057110-134 = "これで山の下の競技場まで行くのなら、あと数百発は必要よ。"
10057110-138 = "ううん。あと一発でいい。"
10057110-140 = "一発？"
10057110-142 = "うん。あと一発で、位置エネルギーが十分な斜面まで行く。"
10057110-144 = "さっぱり理解できないんだけど、どういうこと？"
10057110-147 = "あ、あれ！！前！！ううん！！後ろ！！後ろ？？後ろにー！！！"
10057110-148 = "アンナも急にどうしたの……。"
10057110-151 = "く！！！下ってる！！！後ろに！！違う、前に！！！"
10057110-152 = "坂！！激坂！！！後ろに！！ううん、前かな？やっぱ、後ろに！！！"
10057110-154 = "うん。"
10057110-155 = "行こう。"
10057110-159 = "うわあああああっ！！！"
10057110-162 = "きゃあああああっ！！！"
10057110-163 = "これ、いけるんだ。"
10057110-164 = "ちょっとぉ！！失敗する可能性があったってこと！？"
10057110-165 = "うん。97％ぐらい。"
10057110-166 = "実行する確率じゃないってぇ！？"
10057110-167 = "その代わり、成功率は3％もある。"
10057110-168 = "「も」じゃなくて「しか」！！！"
10057110-171 = "きゃああああああああっ！！！"
10057110-173 = "レッドウィンター・戦車競技場"
10057110-175 = "うーむ……おかしいですね。まだ誰も来ないなんて。"
10057110-176 = "事務局側から連絡はありませんでしたか？"
10057110-177 = "先ほどこちらから連絡してみたんですが、応答がありませんでした。#n何があったのやら……。"
10057110-181 = "うぅ……。寒すぎて予選が中止になったんじゃないですか？"
10057110-182 = "え？これくらいなら暖かいほうですが……。"
10057110-185 = "ん？あれは何でしょう？"
10057110-186 = "あれは……雪崩かな？"
10057110-190 = "どれどれ……。"
10057110-198 = "きゃあああああっ！！！"
10057110-201 = "え～っ……？"
10057110-202 = "チアキ書記、あれは何でしょうか？"
10057110-203 = "うーん、これはなんというか――"
10057110-204 = "遊園地の絶叫アトラクション……？"
10057110-207 = "こ、こっちに来るー！！！"
10057110-214 = "う、うぁ……。"
10057110-215 = "天国も寒くて雪だらけ……どこにも楽園なんてないのね……。"
10057110-216 = "いや、ここは地獄でしょ。事務局いるし……。"
10057110-218 = "あの……失礼ですが、どのような用件で……。"
10057110-221 = "……あれ？先生じゃないですか！"
10057110-222 = "こんなところで会えるなんて、思ってもみませんでした！"
10057110-223 = "でも、ど～して戦車の操縦席にいるんです？"
10057110-224 = "[s] \"チ……チア、キ……？こ、こんにちは……。\""
10057110-228 = "これ、戦車……？いや、装甲車か……？"
10057110-232 = "失礼……な……。"
10057110-233 = "これ……参加申込書……ううっ、吐き気が……。"
10057110-236 = "あはは……めっちゃ強く握ってたみたいですね。文字が……。"
10057110-237 = "チーム名は何ですか？"
10057110-241 = "「183号特別クラス」です！"
10057110-242 = "アンナ、エリナ、ラナ。それと顧問にシャーレの先生！"
10057110-243 = "戦車も準備してきました。"
10057110-246 = "参加を申し込みます！！"
