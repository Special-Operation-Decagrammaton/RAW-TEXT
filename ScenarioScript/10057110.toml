[translation]
10057110-1 = "제11화;단, 모든 마찰은 무시한다."
10057110-2 = "183호 차고"
10057110-4 = "선생님. 운전석을 맡아 주시면 감사하겠습니다."
10057110-5 = "기어는 중립으로 빼 두시고, 전차가 한쪽으로 치우치지 않게만 부탁드립니다."
10057110-6 = "브레이크는 절대로 밟으시면 안 됩니다."
10057110-7 = "[s] \"일단 오케이!\""
10057110-11 = "라나, 기름이 없는데 어떻게 할 생각이야?"
10057110-12 = "아쉬운 건 알겠지만…… 고생 많았으니 이제 좀 쉬어도……."
10057110-14 = "얼른 올라타서 포탄 장전해."
10057110-15 = "이 전차는, 상호작용의 법칙으로 움직일 거야."
10057110-19 = "……!"
10057110-26 = "영차!"
10057110-28 = "무슨 말을 하는 거야? 너는 왜 올라타는 거고?"
10057110-29 = "잡아줄 테니까, 얼른 타!"
10057110-30 = "우, 우와앗!"
10057110-34 = "일발 장전!"
10057110-35 = "뭔데? 뭐 하는 건데?"
10057110-36 = "화학자라서 까먹은 거야? 상호작용의 법칙!"
10057110-37 = "작용과 반작용!"
10057110-38 = "작용과 반작용……."
10057110-42 = "너희, 설마 포 사격 반동으로 움직이려고?!"
10057110-44 = "주퇴거리 확보-"
10057110-45 = "포미 확보!"
10057110-46 = "차고 안에서 포를 쏘면 183호는 어떡하-"
10057110-47 = "뭐……."
10057110-51 = "오래 쓰긴 했잖아?"
10057110-52 = "쏴!"
10057110-64 = "무너졌잖아!!! 그래도 우리가 살던 집인데에!!"
10057110-66 = "좋아! 반동으로 후진하고 있어! 궤도가 굴러가네!"
10057110-67 = "직속 연구소로 복직되면 이런 교통수단도 연구해 볼까?"
10057110-68 = "차탄 장전."
10057110-69 = "알았어!"
10057110-72 = "한 발 더 쏘려고?!"
10057110-73 = "쏴!"
10057110-76 = "더 빨라졌어!"
10057110-77 = "다행히 포는 일단 정상인가 보네, 멀리도 날아간다……."
10057110-78 = "장약에 디페닐아민 첨가해두길 잘했다아- 휴우, 묵은 화약이라 불발날 줄 알았어."
10057110-81 = "응 그런데, 저기가 어느 방향이더라?"
10057110-84 = "눈보라 불더니 이젠 좀 따듯하네."
10057110-85 = "또 무슨 말을 하려고 다 불러 모은 거래?"
10057110-88 = "붉은겨울의 제군들! 오늘은 영광스러운 게헨나 컵의 예선날이다!"
10057110-95 = "제군들의 출정을 응원하며, 사기진작을 위한 새로운 동상 제막식이 있겠다!"
10057110-96 = "붉은겨울이 게헨나 컵을 제패할 것이다!"
10057110-99 = "우리 사기하고 학생회장 동상하고 무슨 관계야."
10057110-100 = "쉬, 쉬잇!! 조용히 해! 누가 들을라!"
10057110-103 = "뭐야 저거, 산에서 뭐가 날아오는데?"
10057110-109 = "이, 이 몸의 동상이 폭발했잖아?!"
10057110-113 = "혁명…… 인가?"
10057110-114 = "지금? 여기서?"
10057110-117 = "혁명이다!!"
10057110-118 = "이 반동 녀석들! 이런 영광스러운 자리에서 혁명이라니!!"
10057110-119 = "친위대!! 친위대!!!"
10057110-122 = "???"
10057110-123 = "마리나. 설마 네가 그런 게냐? 유리창하고 동상 때문에 징계를 준다는 이유로?"
10057110-126 = "에라이, 모르겠다……."
10057110-129 = "혁명의 적, 렌카와 체리노를 규탄한다!!"
10057110-130 = "역시 그럴 줄 알았다!!"
10057110-132 = "뭐지? 학교 쪽이 소란스러운 것 같은데……."
10057110-133 = "라나, 계속 이대로 쏘는 거야? 남은 탄이 많지 않은데……."
10057110-134 = "이걸로 산 밑에 있는 경기장까지 가려면 수백 발은 필요할 거야."
10057110-138 = "아니. 앞으로 한 발이야."
10057110-140 = "한 발?"
10057110-142 = "응. 위치에너지가 충분한 경사면까지. 단 한 발."
10057110-144 = "가끔 라나가 하는 말은 잘 모르겠어, 그게 무슨 말인데?"
10057110-147 = "저, 저기!! 앞에!! 아니!! 뒤? 뒤에?? 뒤에!!!"
10057110-148 = "갑자기 왜 호들갑이야, 나 참……."
10057110-151 = "내!!! 내리막길!!! 뒤에!! 아니, 앞에!!!"
10057110-152 = "엄청 급경사인 내리막길!!! 뒤에!! 아니, 앞인가? 아니, 뒤에!!!"
10057110-154 = "응."
10057110-155 = "가자."
10057110-159 = "으아아아악!!!!"
10057110-162 = "꺄아아아아아아악!!!"
10057110-163 = "이게 되는구나."
10057110-164 = "끄아앙!!! 실패할 확률이 있던 거야?!"
10057110-165 = "응. 97% 정도."
10057110-166 = "실패할 확률, 엄청 높잖아!!!"
10057110-167 = "성공할 확률도 3%. 그 정도면 거저야."
10057110-168 = "그런 게 어디 있어어어어어!!!"
10057110-171 = "꺄아아아아악!!!"
10057110-173 = "붉은겨울 전차경기장"
10057110-175 = "으음, 이상하네요. 아직 아무도 안 왔다니."
10057110-176 = "사무국 측에서 별도로 연락이 있었나요?"
10057110-177 = "그게, 안 그래도 방금 연락해 봤는데 대답이 없네요. 무슨 일이 났는지."
10057110-181 = "우으, 엄청엄청엄청 추운데, 예선 취소된 거 아닐까요?"
10057110-182 = "이 날씨면 아까 눈 폭풍만 빼면 따듯한 편입니다만……."
10057110-185 = "응? 저게 뭐죠?"
10057110-186 = "흐음…… 눈사태인가?"
10057110-190 = "어디……"
10057110-198 = "꺄아아아아아악!!!"
10057110-201 = "엥……?"
10057110-202 = "치아키 서기님, 뭔가요 저게?"
10057110-203 = "뭐라 설명하긴 힘든데……."
10057110-204 = "놀이공원에 있는 엄청엄청엄청 무서운 놀이기구……?"
10057110-207 = "여, 여기로 온다!!!"
10057110-214 = "으, 으아아……."
10057110-215 = "천국도 춥고 눈밭이구나……. 도망친 곳에 낙원은 없네……."
10057110-216 = "아냐, 여기 지옥인가 봐. 사무국이 있잖아……."
10057110-218 = "저기…… 실례지만 무슨 일로……."
10057110-221 = "어? 얏호! 선생님!"
10057110-222 = "여기서 만나다니, 진짜진짜진짜 예상도 못 했어요!"
10057110-223 = "……그런데 왜 전차 운전석에서 나오시는 거예요?"
10057110-224 = "[s] \"안녕, 치아……. 키……. 우욱…….\""
10057110-228 = "이게 뭐죠? 전차……? 아니, 장갑차? 대체 뭐지……?"
10057110-232 = "실례…… 에…… 요……."
10057110-233 = "여기, 예선전 참가 신청서 있……. 우욱, 토할 것 같아……."
10057110-236 = "아하하…… 엄청엄청엄청 세게 쥐고 계셨나 보네요, 글씨가……."
10057110-237 = "팀 이름이 어떻게 되시죠?"
10057110-241 = "183호 특별반이에요!"
10057110-242 = "안나, 에리나, 라나. 그리고 고문에 샬레의 선생님!"
10057110-243 = "전차도 챙겨왔습니다."
10057110-246 = "참가 신청합니다!!"
