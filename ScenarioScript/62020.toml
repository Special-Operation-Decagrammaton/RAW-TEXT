[translation]
62020-1 = "제2화;나팔 소리"
62020-3 = "받아 가세요, 받아 가세요!"
62020-4 = "아직 물품은 많아요! 차례차례 줄 서 주세요!"
62020-11 = "이것저것 많은데, 이게 다 뭔가요……?"
62020-13 = "우선 이것은 영양 부족 치료식입니다"
62020-18 = "여러분의 메디컬 체크 결과, 전반적으로 영양실조…… 까지는 아니고, 영양 부족 현상이 광범위하게 관측되었습니다."
62020-19 = "……그런 것 치고는 어째서인지, 포화지방과 당분 섭취량은 약간 높은 편이었습니다만……."
62020-20 = "어쨌든, 그런 영양 부족 현상을 해결하기 위해 제작된 치료식이죠. 고소하고 은은한 단맛이 포인트입니다."
62020-21 = "한 팩당 500kcal이며, 일반인에게는 부피에 비해 다소 높은 칼로리겠지만……"
62020-22 = "영양 부족 현상에는, 오히려 최적화된 음식이라고 할 수 있죠."
62020-23 = "부드러워서 먹기도 쉽고, 보존성과 영양 가치도 높습니다. 비타민과 무기 염류, 식이섬유까지도 포함되어 있고요."
62020-24 = "하루에 2~3개 정도 드시면, 충분할 겁니다."
62020-26 = "가, 감사합니다……."
62020-27 = "이건 오수 정화 빨대예요! 물을 정화해 주는 휴대용 필터죠. 빨대를 물웅덩이에 대고, 물을 빨아 마시면 된답니다!"
62020-28 = "미생물을 효과적으로 걸러주고, 특히 박테리아 제거율은 99.9%에 달해요!"
62020-29 = "세균에 오염된 물을, 마실 수 있는 물로 바꾸어주는 역할을 한다고 볼 수 있죠."
62020-30 = "저희가 나누어 드리는 개인용의 경우, 필터 사용 가능량은 약 700리터까지도 문제없답니다!"
62020-31 = "단, 바이러스나 화학물질, 소금물이나 중금속을 제거하지 못하니까 너무 남용은 하지 말아 주시고요."
62020-32 = "주의점은…… 첫째. 물을 천천히 마셔야 한다는 점."
62020-33 = "둘째. 바닷물이나 진흙이 많이 섞인 물은 정수가 안 된다는 점. 이 정도가 있겠네요!"
62020-35 = "그럼 이제, 비 올 때마다 물을 받으러 다니거나……. 고인 물을 그냥 마시고 배탈 날 일도 없다는 건가요……?"
62020-36 = "구급상자도 있답니다. 언제, 어디에서 무슨 일이 닥칠지 모르니까, 구급약은 필수품이죠."
62020-37 = "총 30종의 각종 응급 비품이 들어가 있답니다."
62020-38 = "30종이나요?!"
62020-39 = "네. 구급약은 물론, 소형 손전등과 건전지, 응급 매뉴얼, 핫팩에 비상용 은박 담요까지 포함된……."
62020-40 = "저희 봉사 동아리의 표준 구급상자예요."
62020-42 = "이 정도가 표준이라니…… 대단하네……."
62020-45 = "놀랍군. 임시 구호소에서까지 수업인 건가……."
62020-46 = "[s] \"배움의 길에는 원래, 끝도 없고 제한도 없는 법이란다.\""
62020-47 = "그, 그렇군……."
62020-48 = "하지만 이게 정말 다 쓸모가 있을까요?"
62020-49 = "특히 수학이라든가, 2차 함수나 미적분이라든가……."
62020-50 = "[s1] \"어쩌면 수학 자체는 크게 필요하지 않을 수도 있지만.\"\n[s2] \"수학적으로 사고하는 방식은, 도움이 될걸?\""
62020-53 = "그게 무슨 말씀이세요? 수학적으로 사고하는 방식이라뇨?"
62020-55 = "그건 나도 호기심이 생기는데? 가르쳐 주세요, 선생님."
62020-56 = "흠…… 수학은 숫자라는 단어를 사용하는 하나의 언어 체계다? 뭐, 그건 난 조금 알 것 같네."
62020-57 = "수학은 정확한 표현을 위해, 많은 모호성을 제거해 상황을 숫자로 서술하고."
62020-58 = "그 결과, 수학을 공부하는 사람은, 문제의 원인과 과정, 결과를 명확하게 정의하고 설명할 수 있게 된다?"
62020-59 = "그리고 여러 가지 근거와 명제가 모여, 이런 결과가 나온다고 논리적으로 생각할 수 있게 되기도 한다는 거구나."
62020-61 = "네……? 언뜻 보면 무질서한 것처럼 보이는 요소들에서, 질서와 규칙을 찾을 수 있게 되기도 하고요……?"
62020-62 = "그런데…… 그래서 좋은 게 뭔가요?"
62020-63 = "[s3] \"여차할 때, 다른 사람을 설득하기 쉬워진단다.\"\n[s4] \"사람은 딱딱 떨어지는 걸 좋아하니까.\""
62020-68 = "[ns5] \"그래서 수학적 사고방식에 익숙해지기 위해서라도.\"\n[ns6] \"수학을 공부하는 게 좋은 거야.\""
62020-71 = "[ns7] \"그러면 가끔 다른 사람에게, 내 말을 듣게 할 수도 있고.\"\n[ns8] \"어떨 때는 잘난 체도 할 수 있으니까!\""
62020-74 = "오오……."
62020-75 = "……."
62020-76 = "그건, 나름대로 괜찮은 것 같아요."
62020-77 = "……."
62020-81 = "그때도, 제가, 그렇게 생각할 수 있었다면……."
62020-82 = "그런 경험을, 하지 않을 수 있었을까요……?"
62020-83 = "무슨 경험?"
62020-87 = "그, 그건……."
62020-97 = "아리우스? 아…… 그 에덴 조약이던가 뭔가 하던 때에 소란스러웠던 애들?"
62020-98 = "그런 문제아들이, 이런 곳에 버젓이……?"
62020-99 = "……이래서 못 배운 아이들은……."
62020-100 = "애초에 멀쩡한 학원에서 그 정도로 사고를 치려고 했겠냐고."
62020-104 = "조금, 여러 가지 일이 있었어요."
62020-105 = "아리우스, 바깥에서, 요……."
62020-110 = "……."
62020-111 = "흐, 흐에에…… 역시, 역시 무서워요……. 어른 무서워요……. 세상 무서워요……."
62020-112 = "어라……? 그런데 생각해 보니 선생님도 어른이네요……?"
62020-113 = "[s9] \"그래. 그렇지…….\"\n[s10] \"한 사람의 어른으로서, 사과할게.\""
62020-118 = "네? 서, 서서서서, 선생님이…… 그러실 필요는……."
62020-119 = "그러실, 필요는……."
62020-123 = "……훌쩍. 흑……."
62020-124 = "……그래. 바깥이라는 게 좀 그렇긴 해."
62020-125 = "그래도, 그건 네 잘못이 아니야."
62020-126 = "미, 미사키, 씨……."
62020-127 = "뭐, 나쁜 건 모두 그 어른들과 세상이라고 하면, 구분은 차라리 편해지겠지만……."
62020-128 = "세상이란 게 또, 그렇게 단순하게 둘로 나뉘는 것이 아니기도 하지."
62020-129 = "……."
62020-130 = "무시해 버려. 그런 것들. 멍청한 어른들 같은 건 머리에서 지워 버리고."
62020-131 = "자기가 받아들일 수 있는 것만 받아들이면서 살면 돼."
62020-132 = "그 정도만 견디기에도, 세상은 충분히 끔찍하니까."
62020-133 = "나도 예전에는 이런 세상 왜 사나 싶었는데……."
62020-134 = "……."
62020-135 = "선생님이 어떻게 해 보라고 해서, 그냥 살아 보고 있는 중이고."
62020-141 = "……후훗."
62020-142 = "헤, 헤헷……."
62020-143 = "음."
62020-148 = "……뭔데? 다들. 지금 좀 기분 나빠지려고 하는데?"
62020-149 = "[s] \"우리 미사키…… 많이 컸구나……. 흑흑…….\""
62020-153 = "선생님은 가만히 있어! 또 신나서 우는 척하지 말고!"
62020-154 = "……하여튼, 선생님이 제일 문제라니까……. 너도 이 사람 조심해."
62020-155 = "네, 네에……? 그런, 건가요?"
62020-156 = "그래. 이 사람이 하여튼 제일 문제야. 진짜 나쁜 사람이라니까."
62020-157 = "희망이란 걸 멋대로 줘 놓고, 그게 완전히 거짓말인 것도 아니라는 것까지 보여 주고 그러니까."
62020-158 = "……그냥 다 거짓말이면, 진작에 포기할 수 있었을 텐데."
62020-159 = "이럴 거면 평생 책임져야 할 텐데, 그건 죽어도 안 하겠지."
62020-160 = "아무튼, 그런 사람이니까, 조심하는 편이 좋아."
62020-161 = "그, 그렇군요……."
62020-162 = "[s] \"어? 그럼 평생 책임지면 되는 거야?\""
62020-165 = "이상하게 들리는 소리 좀 하지 마, 이 인간아!!!"
62020-170 = "……."
62020-171 = "'헛되고 헛되니, 모든 것이 헛되도다.'"
62020-172 = "삿 쨩?"
62020-173 = "[s] \"……?\""
62020-174 = "지겹도록 들은 말이고, 지겹도록 잘못 해석된 말이기도 했지."
62020-175 = "그냥, 모든 것은 결국 지나갈 것이니까, 적당히 하라는 이야기 정도였을 뿐인데."
62020-176 = "우리도 너도, 결국 다 지나가게 될 거다."
62020-177 = "나중에 돌아보면, 그때는 그런 일도 있었다고, 아무렇지도 않게 생각할 수 있게 될지도 모르지."
62020-178 = "물론 그런 날이 오지 않을 수도 있겠지만……."
62020-179 = "확정된 미래라는 것은 없으니까, 너무 한쪽으로 치우쳐서 생각하는 것도, 좋은 버릇은 아닐 거야."
62020-180 = "……확정시켜야 하는 미래는, 계약서에 적힌 금액 정도일 테니까."
62020-182 = "후훗. 그러게. 그건 정말 중요하지."
62020-183 = "헤, 헤헤……."
62020-190 = "?!"
62020-192 = "!!!"
62020-193 = "[s11] (나팔 소리……?)\n[s12] (이걸로 아마, 네 번째……?)"
62020-198 = "자, 잠시만요! 지금 바깥에, 뭔가 큰일이 났어요!"
62020-203 = "모두, 너무 당황하지 마세요! 공황에 빠지면 더 위험합니다!"
62020-209 = "무슨 일이지?"
62020-214 = "조마에 사오리……!"
62020-215 = "……."
62020-216 = "저기입니다."
62020-227 = "저게…… 뭐지?!"
62020-228 = "……모르겠어요. 갑자기 나타났는데……. 공격이 통하기는 하는 것 같지만, 효과적이지는 않아요."
62020-232 = "(이 느낌, 확실해……. 그 나팔소리가 들렸을 때 나타난, '그것'과 아주 비슷한 느낌이야……!)"
62020-233 = "(저건, 설마……?)"
62020-234 = "저게 대체 뭐야……? 나팔 소리가 들리더니, 저런 게……? 그것도 넷이나……?"
62020-235 = "응? 나팔 소리라니? 나는 아무 소리도 안 들렸는데?"
62020-236 = "뭐라고? 그렇게 큰 소리가 안 들렸단 말이야? 너 귀에 조금 이상 있는 거 아냐?"
62020-237 = "서, 선배는요? 선배는 들렸어요? 나팔 소리?"
62020-242 = "아뇨, 저도……. 어떤 소리 같은 건 못 들었는데요……."
62020-244 = "그것 봐!"
62020-245 = "이상하다……?"
62020-255 = "으아아악?! 저거, 이리로 오고 있어요!"
62020-267 = "모두 저희의 뒤로 피해 주십시오!"
62020-269 = "우왓?!"
62020-275 = "괜찮으세요? 어디 다친 분 없으시죠?"
62020-276 = "저희는 준비됐어요! 단ㅈ…… 선배!"
62020-278 = "좋습니다. 이제부터……."
62020-279 = "……."
62020-283 = "저희, 이름 없는 봉사 활동 동아리가! 모두를 지키겠습니다!"
62020-285 = "우리도 가자."
62020-286 = "이젠 거의 반사적이네……. 그럴 것 같긴 했는데."
62020-287 = "모교를 지키는 셈 치는 거다. 저것들의 정체가 무엇이든 간에."
62020-292 = "……."
62020-293 = "모, 모두 조심하세요오……."
