[translation]
2003905-1 = "둥지 위로 날아간 새"
2003905-2 = "샬레 오피스"
2003905-5 = "[ns] \"그러면, 오늘도 잘 부탁할게.\""
2003905-6 = "음. 맡겨만 다오."
2003905-24 = "[ns] \"끝났다–!\""
2003905-25 = "후후. 그렇게 기쁜가?"
2003905-26 = "음? 일을 좋아하는 사람은 없을 거라고? 그건…… 나 역시 마찬가지다만……."
2003905-27 = "아무튼 좋다. 선생이 기뻐하는 모습을 보니, 나까지 마음이 편안해지는구나."
2003905-28 = "어차피 다음의 일정 같은 것은 짜여져 있지 않을 테지? 선생도 조금 몸을 쉬는 것이 어떨까 한다만."
2003905-29 = "으, 음? 마치 내가 이 장소의 주인이 된 것 같았다고? 아무리 그래도 그것은 조금 곤란하지 않을까."
2003905-30 = "각자에게는…… 각자에게 있어야 하는 장소가 있을 테니 말이다."
2003905-32 = "(키사키는 그렇게, 창문으로 바깥의 경치를 바라보기 시작했다.)"
2003905-35 = "음? 경치, 말인가? 아니, 뭐, 특별히……."
2003905-36 = "아무 생각 없이, 그냥 보고 있을 뿐이다만."
2003905-38 = "(키사키는 아무렇지도 않은 듯이 이야기했지만.)"
2003905-39 = "(그것은 어쩐지…… 처음 보는 풍경에 푹 빠진.)"
2003905-40 = "(그런, 아이처럼 느껴지고 있었다…….)"
2003905-43 = "[ns] \"키사키.\""
2003905-44 = "음? 무슨 일인가, 선생."
2003905-45 = "[s] \"우리, 옥상에 가 볼래?\""
2003905-46 = "으, 음? 샬레 건물의 옥상, 말인가?"
2003905-47 = "그런 곳은 갑자기 어째서……. 그, 바람도 강할 터이고, 위험할지도 모르는데……?"
2003905-48 = "나와 같이 옥상에서 풍경을 바라보고 싶다고……?"
2003905-49 = "……."
2003905-50 = "아, 알겠다. 선생이 그리하길 원한다면, 내가 거절할 이유는 없겠지……."
2003905-52 = "(키사키와 함께 옥상으로 올라가는 엘리베이터를 탔다.)"
2003905-57 = "웃……!"
2003905-58 = "역시, 바람이 조금 강하구나. 눈이 부시기도 하고."
2003905-59 = "이런 곳에서, 도대체 뭘 하려는 것인가. 선생……?"
2003905-60 = "[s1] \"그냥, 날씨가 좋잖아!\"\n[s2] \"땡땡이치고 소풍 가기는 조금 그렇지만!\""
2003905-66 = "그런가……."
2003905-67 = "후후. 정말 그럴지도 모르겠구나."
2003905-79 = "신기한, 기분이구나."
2003905-80 = "분명 보고자 하면 산해경에서도, 얼마든지 볼 수 있는 풍경일 터인데."
2003905-81 = "이곳에서 이렇게 바라보는 것만으로도, 이렇게."
2003905-84 = "이렇게……."
2003905-85 = "……."
2003905-86 = "조금 더, 먼 곳으로 나가 볼 수 있다면……."
2003905-87 = "[s] \"그러면, 그러자.\""
2003905-88 = "?!?!"
2003905-89 = "드, 들린 것인가. 선생!?"
2003905-90 = "[s] \"우리 둘뿐이니까.\""
2003905-91 = "……!"
2003905-92 = "……의외로, 좋지 않은 취미를 갖고 있구나……!"
2003905-93 = "[s] \"싫어?\""
2003905-94 = "……!!!"
2003905-95 = "[s] \"나는 기대되는데.\""
2003905-96 = "기억해 두겠다, 선생……."
2003905-97 = "흠, 흠……."
2003905-98 = "싫다고는 아직, 한마디도 하지 않았다만."
2003905-99 = "[s3] \"응. 같이 여기저기.\"\n[s4] \"더 먼 곳을 찾아가 보자.\""
2003905-102 = "……."
2003905-103 = "기대해도, 되겠지. 선생?"
2003905-104 = "[s] \"얼마든지.\""
2003905-110 = "(키사키가 말없이 옆으로 다가왔다.)"
2003905-111 = "(키사키의 시선은 먼 곳을 향하고 있었지만.)"
2003905-112 = "(조금씩, 우리들의 손가락 끝이 서로에게 닿고 있었다.)"
