[translation]
10018020-1 = "제2화;후우카의 골목식당"
10018020-7 = "대단하시네요……"
10018020-12 = "공기 후드, 가스 버너, 튀김기, 오븐…… 전부 잔때가 끼기 쉬운 것들뿐인데."
10018020-13 = "모두 어제 산 것처럼 깨끗해요."
10018020-17 = "재료 관리도 꼼꼼하게 되어 있네요…… 냉장 보관이나 개별 포장도, 잘 구분되어 있고요."
10018020-18 = "야채에 흠집이 좀 많은 것 같긴 한데, 이건 구입처의 문제이려나요."
10018020-19 = "가용 기간이 긴 조미료라고 해도, 일정 기한이 넘으면 처분해 버리시는군요?"
10018020-20 = "네. 위생 관리를 철저히 하지 않으면 신용을 잃게 되니까요. 음……무슨 문제라도 있었나요?"
10018020-21 = "아, 아뇨!"
10018020-22 = "주방 상태는 깨끗해요. 완벽하다고 해도 될 정도네요."
10018020-23 = "그런데…… 양념은 지금 쓰고 있는 조합으로만 사용하시나요?"
10018020-24 = "네. 네에. 제가 전수받은 것은 그것뿐이라서……"
10018020-25 = "음…… 어쩌면 이게 첫 번째 문제인지도 모르겠네요."
10018020-26 = "재료를 모두 비슷한 양념으로 처리하고 있다……"
10018020-27 = "그리고 조금 전부터 느낀 건데요."
10018020-28 = "네…… 뭐가 문제일까요?"
10018020-29 = "식재료를 전부 냐오푸드에서 공급받는다고 하셨죠?"
10018020-30 = "예. 달리 선택지가 없는 것도 있고……"
10018020-31 = "그 식재료들의 품질이, 조금 좋지 않아 보이는 것 같아서요."
10018020-35 = "……역시, 그런가요."
10018020-39 = "사실 냐오푸드와 공급 계약을 한 뒤로,"
10018020-40 = "음식 맛이 변했다는 단골손님들의 불만사항이 들어오곤 했답니다."
10018020-41 = "하지만 냐오푸드가 공급을 전부 독점해 버려서…… 저희도 달리 방법이 없었죠."
10018020-42 = "식재료 공급이 문제라면, 저희가 도와 드릴 수 있겠어요, 선배!"
10018020-44 = "그렇네."
10018020-45 = "여기서 거리는 조금 멀겠지만……"
10018020-52 = "……그런 이유로, 부탁드릴게요. 점장님."
10018020-53 = "후우카 쨩의 부탁이라면야 얼마든지 들어 줘야지."
10018020-54 = "이걸로 새 단골이 생겨 준다면야 우리도 이익이고!"
10018020-55 = "자, 잘 부탁드립니다……"
10018020-56 = "힘내요, 주인장. 어려울 땐 돕고 살아야지."
10018020-58 = "게헨나 학생들의 급식은 우리가 책임지고 있으니, 품질에는 자신 있다고!"
10018020-60 = "너무 신세만 지는 것은 아닌지……"
10018020-61 = "마음 쓰지 마세요. 해 봐야 알겠지만."
10018020-62 = "저희 모두가 도와 드리기로 한 거니까요."
10018020-63 = "믿고 맡겨도 될 겁니다, 주인장! 후우카 쨩의 솜씨는 내가 보증할 수 있으니까!"
10018020-64 = "[s] \"그 부분에 있어서는 저도 보증을……\""
10018020-65 = "이것 보라고! 샬레의 선생님도 그렇다 하시지 않습니까!"
10018020-67 = "아하하하……"
10018020-73 = "음? 야, 저기 저 사람, 혹시 그 여주인 아냐?"
10018020-74 = "맞는 것 같은데? 여기엔 무슨 일이지? 왜 삐약슈퍼와 거래하는 거냐고."
10018020-78 = "설마……?"
10018020-83 = "그럼 식재료도 새롭게 공수했으니, 다시 요리를 시작해 볼까요?"
10018020-84 = "주리. 재료들을…… 다듬기만 해 줄래?"
10018020-85 = "네, 맡겨만 주세요. 선배!"
10018020-89 = "물론 익숙한 방법이 있으시리라 생각하지만……"
10018020-90 = "이런 식으로, 잔열을 사용해 소스를 버무리면―"
10018020-94 = "고기가 코팅이 되어서, 맛과 식감이 달라지거든요."
10018020-95 = "일종의 캐러멜라이즈라고 할까요."
10018020-96 = "아…… 그런 방법이……!"
10018020-100 = "국을 끓일 때, 재료를 한 번 살짝 볶은 다음 물을 넣어 보세요."
10018020-101 = "보다 깊은 맛을 낼 수 있거든요."
10018020-102 = "하지만 볶는 시간 조절을 잘못하면, 탁한 맛이 나지 않을까요?"
10018020-103 = "그런 위험성도 분명히 있죠."
10018020-104 = "일종의 도전이라고 할까요?"
10018020-106 = "애초에 요리는 도전이지만요!"
10018020-109 = "대량 조리는 그냥 힘든 거예요."
10018020-110 = "재료 양은 사람 수만큼 곱하면 되는데, 화력은 그렇게 할 수 없으니까요."
10018020-111 = "방법이 있을까요?"
10018020-112 = "자주 살펴보고 저어 줄 수밖에요."
10018020-113 = "하지만 너무 많이 저어도 재료가 상해 버리니……"
10018020-114 = "정말 정성 밖에는 없군요……"
10018020-118 = "이렇게 몇 종류의 신 메뉴를 완성했어요."
10018020-119 = "그럼 다음은 이 메뉴가 성공적인지 평가해 줄 사람이 필요한데……"
10018020-120 = "……하루나?"
10018020-122 = "기다리고 있었답니다."
10018020-123 = "그러면, 어디."
10018020-128 = "……"
10018020-132 = "(서, 선배. 뭔가 엄청 긴장되네요.)"
10018020-133 = "(긴장도 긴장인데, 뭔가 복잡한 기분이네.)"
10018020-134 = "[s] (\"그 의견에는 나도 동의하고 싶어……\")"
10018020-141 = "흐음. 잘 먹었습니다."
10018020-142 = "결과는……"
10018020-144 = "(꿀꺽……)"
10018020-145 = "[ns] (\"뭐든 좋으니까 폭발만큼은 참아 줘, 하루나……\")"
10018020-152 = "합격입니다."
10018020-155 = "와!"
10018020-156 = "휴우……"
10018020-158 = "미식의 관점에서도 흠잡을 데 없는 요리였어요."
10018020-159 = "이런 요리를 저 혼자서만 맛본다니 아까운 일이죠."
10018020-163 = "모두들, 들어오겠어요?"
10018020-172 = "하루나의 보증이 붙은 요리라니, 기대되네요★"
10018020-173 = "드디어 맛볼 수 있는 거야? 맛있는 냄새가 나서 참느라 힘들었다구!"
10018020-177 = "그럼, 어디 한번……!"
10018020-186 = "주인장 나와!"
10018020-187 = "누가 맘대로 거래처를 바꿔도 된다고 했지?"
10018020-188 = "이건 계약 위반이라고. 알고는 있냐?"
10018020-189 = "햣하! 위약금이다! 손해배상이다! 채무불이행이다!"
10018020-196 = "앗, 야! 조심해!"
10018020-207 = "내…… 내 요리……"
10018020-208 = "아직 맛보지도 못했는데!!!"
10018020-209 = "어머나★ 이건 큰일이네요."
10018020-211 = "뭐, 뭐야. 이 녀석."
10018020-212 = "거, 거기에 있었던 네 잘못이잖아. 조심하라고!"
10018020-213 = "[s] \"아마 소용없겠지만, 일단 도망치는 걸 추천하고 싶네.\""
10018020-223 = "용서 못 해, 너희들!"
