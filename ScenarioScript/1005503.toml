[translation]
1005503-1 = "능청맞게"
1005503-8 = "(……조난을 당했다.)"
1005503-14 = "(……!?)"
1005503-26 = "[ns1] \"무, 무슨……!\"\n[ns2] \"고, 곰이 나타났다?!\""
1005503-30 = "……곰?"
1005503-36 = "곰이라니? 곰이 어디에 있다는 거야?"
1005503-40 = "안녕, 선생님. 오랜만이네."
1005503-41 = "그나저나 선생님은 왜 이런 곳에 있어? 여기는 구교사도 학교 쪽도 아닌데……."
1005503-42 = "[s3] \"아……. 시구레구나.\"\n[s4] \"휴우……. 긴장했어.\""
1005503-45 = "왜 사람을 보고 그런 표정을 짓는 거야. 실례라고, 그거."
1005503-46 = "응? 내가 곰인 줄 알았다고?"
1005503-47 = "아하하……. 어쩐지 대답하기 곤란하네. 이 근처에서는 실제로 곰이 나오기도 하니까."
1005503-48 = "그보다 다시 묻는 거지만, 어째서 이런 외진 곳에 있는 거야?"
1005503-51 = "길을 잃었다고? 4시간째 방황하고 있다고……?"
1005503-55 = "이런…… 손발이 얼음장 같네."
1005503-56 = "그러니까 붉은겨울 학원에 오기 전에는 날 불러 달라고 말한 건데……."
1005503-57 = "선생님, 붉은겨울 학원은 평범한 사람이 상상할 수 있는 것 이상으로 넓다고. 마음만 먹고 야지에 숨어 버리면 사무국 사람들도 찾지 못할 정도니까."
1005503-58 = "그래도 나랑 만나서 다행이야. 하마터면 큰일 날 뻔했어."
1005503-59 = "……응? 나는 괜찮냐고?"
1005503-60 = "나야 당연히 이 주변의 길 정도는 다 알고 있지. 늘 지나다니는 곳이라서 말이야."
1005503-61 = "나무 열매도 찾아보고, 사냥도 해야 하고……. 이 근방에는 자주 나오는 편이야."
1005503-62 = "물론 학원으로 돌아가는 길도 정확히 알고 있긴 하지만……."
1005503-63 = "그래도 선생님, 지금 상태로 눈길을 걷는 건 좀 어려울 것 같아. 거리가 꽤 되거든."
1005503-64 = "계속 이렇게 체온이 떨어진 상태로 이동한다면 동상에 걸릴지도 몰라."
1005503-65 = "[s] \"나는 괜찮아.\""
1005503-66 = "……어허. 괜찮지 않다니까. 아무리 선생님이라도 설원에 대해서는 내가 더 잘 알고 있으니까 억지 부리지 마."
1005503-67 = "봐. 몸부터 덜덜 떨고 있잖아."
1005503-68 = "방한 도구를 준비하든, 체온을 높이든…… 현상을 해결하지 않으면 이대로 보내줄 순 없어."
1005503-69 = "……응? 지금 해결할 수 있는 좋은 방법이 있냐고?"
1005503-70 = "그야 뭐, 갖고 있는 방법이 있기는 한데……."
1005503-74 = "……후후."
1005503-78 = "역시 가장 확실한 방법은 보드카를 마셔서 체온을……."
1005503-79 = "[s5] \"그건 절대 안 돼!\"\n[s6] \"다른 방법은 없는 거야?\""
1005503-80 = "흐음. 별로야? 난 꽤 괜찮은 방법이라고 생각했는데……."
1005503-81 = "흐음. 별로야? 난 꽤 괜찮은 방법이라고 생각했는데……."
1005503-82 = "맘에 들지 않는다면……. 어디 보자……. 다른 방법이……."
1005503-91 = "허그—"
1005503-92 = "……는 어때? 체온을 나누는 것만큼 확실한 방법도 없거든."
1005503-93 = "상황이 상황이니 나야 괜찮은데, 선생님만 괜찮다면 방해되는 옷도 좀 치우고……."
1005503-94 = "[s7] \"스톱, 스톱! 거기서 정지!!\"\n[s8] 필사적으로 거절하고 다른 방법을 묻는다."
1005503-97 = "흐음. 정말이지 꽉 막힌 사람이라니까."
1005503-98 = "알았어, 알았어. 농담이야. 선생님이라면 그런 식으로 반응할 줄 알았으니까."
1005503-99 = "……응? 여태까지 선생님을 놀렸던 거냐고?"
1005503-100 = "글쎄, 어떨까……"
1005503-101 = "그래도 지금은 괜찮지 않을까? 애초부터 내 충고를 듣지 않은 선생님이 나쁜 거니까."
1005503-102 = "가이드 없이 붉은겨울 학원을 방황하면 위험할 수도 있으니까, 오기 전에는 꼭 연락을 하라고 그렇게 당부했는데……"
1005503-103 = "선생님에게 무슨 일이 생기면 걱정할 학생들이 엄청나게 많다는 걸 기억하라고."
1005503-104 = "[s9] \"으음……. 알았어. 그건 미안해.\"\n[s10] \"다음부터는 제대로 연락할게.\""
1005503-107 = "후후. 좋아. 그렇게 약속해 준다면 나도 이번은 그냥 넘어가 줄게."
1005503-108 = "하지만 다음번에도 또 이렇게 위험한 행동을 한다면……."
1005503-109 = "그때에는 지금처럼 멈춰 주지 않을 거니까. 두 방법 모두 다 당하게 될 줄 알아. 알았지?"
1005503-113 = "[ns] \"알겠습니다…….\""
1005503-114 = "음. 그럼 장난은 일단 여기까지 하고……."
1005503-118 = "……자. 내 등에 업혀, 선생님. 번화가까지 바래다줄게."
1005503-119 = "응? 무거울 거라고? 아하하. 무슨 말이야, 선생님."
1005503-120 = "이쪽은 커다란 사슴이나 곰도 사냥해서 들고 다닐 수 있는 학생이라고."
1005503-121 = "어른 한 사람 업는 것 정도는 운동도 안 되니까 크게 걱정하지 마."
1005503-122 = "그럼……."
1005503-123 = "……슬슬 가볼까?"
1005503-125 = "(이후, 시구레의 등에 업혀 번화가까지 이동했다.)"
1005503-126 = "(도착할 즈음에는 몸도 다 녹아 안전하게 샬레까지 돌아올 수 있었다.)"
