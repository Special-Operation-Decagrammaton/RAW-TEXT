[translation]
10051005-1 = "프롤로그;라멘과 음모"
10051005-3 = "[log]닌자라면, 기억할지어다.[/log]"
10051005-6 = "[log]면은 극태면으로![/log]"
10051005-8 = "[log]토핑으로 돼지비계 추가![/log]"
10051005-12 = "[log]그리고 고추기름으로 마무리![/log]"
10051005-15 = "백귀야행 모처의 라멘집"
10051005-16 = "이것이, 닌자가 라멘을 즐기는 새로운 방식!"
10051005-17 = "시, 신 닌자 정식이에요!"
10051005-18 = "모두 오래 기다리셨습니다, 닌닌!"
10051005-19 = "지금부터 <소녀인법첩 미치룻치>! 닌자와 라멘 편!"
10051005-20 = "시작합니다!!!"
10051005-21 = "엇, 잠깐만 잠깐만!"
10051005-22 = "우리 카메라가 살짝 기울어진 것 같지 않아?"
10051005-23 = "삼각대 문제인가……?"
10051005-24 = "네? 죄, 죄송해요! 제가 좀 더 신경을 써야 했는데……!"
10051005-25 = "응? 아니 아니, 카메라 설치는 내가 했는데."
10051005-26 = "괜찮아요! 다시 찍으면 더 멋지게 찍을 수 있을 테니까!"
10051005-27 = "그럼 모두 다시 한번 더……."
10051005-29 = "와장창!!"
10051005-32 = "어이 사장! 수프의 점도가 왜 이래! 너무 묽어서 면과 충분히 밀착되지 않잖아!"
10051005-33 = "거기다 면의 익힘도 충분하지 않아!"
10051005-34 = "맞아! 이래서는 면과 수프 사이의 균형이 깨진다고!"
10051005-35 = "저기, 저희 라멘은 몇 년째 똑같은 레시피인데……."
10051005-36 = "아니 그보다, 마음에 안 든다고 밥상을 엎으시면 어떡합니까?!"
10051005-37 = "다른 손님들께 피해가 가잖습니까!"
10051005-42 = "어디선가 날아온 라멘이 우리 카메라를 덮쳤어요……!"
10051005-43 = "흐…… 흐에에에……."
10051005-44 = "망했다……!"
10051005-45 = "부, 부장님, 이 일을 어떻게……."
10051005-46 = "……."
10051005-50 = "(으아아, 저 진상 녀석들……! 내가 나서야 하나……?)"
10051005-51 = "(……잠깐만, 근데 내가 쟤들이랑 싸워서 이길 수가 있나?)"
10051005-55 = "(아니지, 나도 혼자가 아니잖아?)"
10051005-56 = "(츠쿠요와 이즈나가 있는데……!)"
10051005-57 = "……자고로 닌자란, 어떤 궁지에 몰리더라도……."
10051005-58 = "불의함 앞에서 물러나지 않는 법……!"
10051005-59 = "쟤 뭐라는 거야?"
10051005-60 = "부장님……?"
10051005-64 = "그러니 받아라! 인법, <반짝반짝 파이어의 술>!"
10051005-72 = "……방금 뭐였지?"
10051005-73 = "총격……이 아니라 폭죽이네?"
10051005-74 = "이건 무슨…… 번쩍거리기만 하지 따끔하지도 않잖아?"
10051005-75 = "하지만 감히 싸움을 걸었겠다……!"
10051005-76 = "야 근데 인법이 대체 뭐야?"
10051005-77 = "그건 나도 모르……."
10051005-85 = "제, 제 뒤로 물러나 계세요!"
10051005-86 = "고, 고맙습니다!"
10051005-95 = "윽……."
10051005-96 = "시선을 끌어놓고…… 비겁하게 뒤통수를 치다니……."
10051005-101 = "후후, 시선을 끈 뒤에 뒤를 잡는다!"
10051005-102 = "이것이 바로 <반짝반짝 파이어의 술>의 진정한 활용!"
10051005-103 = "과연, 닌자 셋으로 호랑이도 잡을 수 있다는 전략이 바로 이것이었군요!"
10051005-104 = "물론이지!"
10051005-105 = "……아니, 맞나?"
10051005-106 = "저기, 그런데 여러분……."
10051005-107 = "응?"
10051005-108 = "카, 카메라에 묻은 국물을 다 닦았는데……."
10051005-110 = "카메라가 켜지지 않아요……!"
10051005-111 = "……."
10051005-112 = "……."
10051005-114 = "흐아아악……!"
10051005-118 = "호오……."
10051005-119 = "기민하고 전술적인 움직임, 거기다 그 와중에도 라멘집 점장의 안전까지 챙기다니."
10051005-120 = "그야말로 호위 작전에 최적화된 움직임……"
10051005-121 = "인법연구부 여러분의 실력은 익히 알고 있었지만, 이런 면모는 또 새롭군요."
10051005-122 = "잠깐만, 그렇다면……"
10051005-123 = "'그 임무'에 인법연구부 분들을 투입하는 것도 괜찮을지도……?"
