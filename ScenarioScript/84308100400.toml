[translation]
84308100400-5 = "(리오에게 게임개발부의 상황을 설명해 주었다.)"
84308100400-8 = "……그런 상황이었습니다. 별다른 특이 사항은 없었네요."
84308100400-9 = "그래도 다행이야. 누군가가 악의를 가지고 접근했다거나 사고가 난 것에 비하면, 훨씬 더 양호한 상황이었으니까."
84308100400-10 = "그건 그렇고……"
84308100400-11 = "……? 그런데 네루는 어디 있지? 분명 같이 나가지 않았어?"
84308100400-15 = "아, 음…… 그건 말이죠……."
84308100400-16 = "……????"
84308100400-17 = "뭐, 곧 도착할 거예요. 저와는 달리……"
84308100400-21 = "\"조금은 훈계가 필요하겠어\"라고 말했거든요."
84308100400-26 = "으, 으음……."
