[translation]
10020015-5 = "제1구역의 <차원엔진>을 파괴하는 데 성공했어!!"
10020015-13 = "[ns] \"기, 기다려!!\""
10020015-14 = "시, 시로코 씨는 후퇴…… 모습을 감췄어요……."
10020015-15 = "[ns] \"……………….\""
10020015-17 = "시로코 쨩이 도망쳤다고요……."
10020015-18 = "네……. 선생님이 손쓸 새도 없이……."
10020015-20 = "뭐어, 괜찮아."
10020015-21 = "시로코 쨩이 이리저리 이동하면서 우리를 방해하겠다면, 우리는 더욱 확실하게 이 방주를 부숴버리면 돼."
10020015-22 = "그러다 보면 결국 마지막에는 어쩔 수 없이 우리 앞에 모습을 드러낼 수밖에 없을 거니까."
10020015-23 = "그때야말로 제대로 된 대화를 해주는 거지."
10020015-24 = "여긴 도망칠 곳도 없는 고립된 장소잖아? 말하자면 독 안에 든 쥐라고. 시로코 쨩은."
10020015-25 = "그, 그건 그렇긴 한데……. 어쩐지 전부터 계속 동물에 비유하고 있지 않아?"
10020015-33 = "현재 점령전의 상황은 나쁘지 않아."
10020015-34 = "제1구역을 성공적으로 점령했고, <차원엔진>도 파괴하는데 성공. 이 정도면 시작치곤 괜찮은 성과지."
10020015-35 = "무엇보다 중요한 건 우리가 방주의 약 1/4을 점령했다는 거야. 즉, 이 방주의 연산 기능을 그만큼 우리 것으로 만들었다는 거지."
10020015-36 = "네. 저희는 좀 더 많은 일들이 가능해질 거예요."
10020015-37 = "먼저 이 주변에서 습격해 오는 적들의 방어가 좀 더 쉬워질 거야. 지금부터 적들은 우리가 구축한 방어 시스템을 먼저 상대해야 할 거니까."
10020015-39 = "후아…… 다행이야. 한숨 돌렸네."
10020015-40 = "그리고 방주의 다음 구역으로 진입할 수 있게 되었어요."
10020015-41 = "제2구역 말이지? 꽤 순조롭잖아."
10020015-43 = "……. 그래도 마지막까지 방심해선 안 되겠죠."
10020015-44 = "그럼 선생님, 아트라하시스의 방주의 제2구역으로 진입하겠습니다."
10020015-45 = "계속해서 지휘를 부탁드립니다!"
