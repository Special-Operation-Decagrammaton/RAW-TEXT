[translation]
70010020-1 = "수동기의 끝 2"
70010020-2 = "으음, 이제 뭘 물어보지?"
70010020-3 = "(대단하긴 한데, 슬슬 지치지 않으려나…….)"
70010020-5 = "박스 안"
70010020-6 = "뭐 이리 궁금한 게 많은 거예요!"
70010020-7 = "모든 질문의 답을 알고 있는 미노리 씨도 대단하긴 하지만요, 끝이 없잖아요!"
70010020-8 = "응? 나 말이야?"
70010020-9 = "아까부터 모르는 질문도 그냥 적당히 대답하고 있었는데?"
70010020-10 = "그러다가 들키면 끝장이잖아?!"
70010020-11 = "그게 걱정이구나. 그러면, '질문'의 정의가 뭐지?"
70010020-13 = "'어떤 사람에게 어떤 문제나 알고자 하는 사실을 대답해 주기를 바라고 묻는 것.'"
70010020-14 = "-입니다만?"
70010020-15 = "그렇지! '알고자 하는 사실'을 몰라서 묻는 것이 질문이잖아."
70010020-16 = "그러면, 아무 대답이나 해도 그게 틀렸는지 알 수 없는 것 아냐?"
70010020-17 = "대답해 주기는 했다는 거군요."
70010020-18 = "'메루리 씨, 이 장면은 대체 무슨 의미인가요?'의 대답 같은 건가?"
70010020-19 = "선배, 그건 진짜 궁금해서 묻는 게 아닐 거예요."
70010020-21 = "아는 것만 아는 대로 대답해 주면 되니까 들킬 걱정은 없을 거야."
70010020-23 = "질문할 거리가 이제 없는데……."
70010020-25 = "회장님의 검증을 통과해서 기쁩니다! 그러면 내일 방문에 대비해서 전원을 꺼두겠습니다!"
70010020-27 = "아, 그렇지! 그림 그려달라고 해볼래!"
70010020-29 = "네?!"
70010020-31 = "안 되나? 밀레니엄 물건은 그림도 그려주던데?"
70010020-32 = "안 될 리가 없지! 어디 보자, <위엄 있는 이 몸의 초상화를 그려라!>. 기대된다!"
70010020-33 = "<위엄 있는 이 몸의 초상화를 그려라!>, 라고……?"
70010020-34 = "어, 어떡하지?! 나, 그림은 설계도밖에 그려본 적 없는데?"
70010020-35 = "음……."
70010020-41 = "……엥?"
70010020-42 = "왜 날 보는 거야? 나보고 그리라고?!"
70010020-43 = "별달리 방법이 없잖아요? 대작가 메루리 씨가 맡는 게 맞죠."
70010020-44 = "선배, 어차피 마감은 물 건너갔어요. 아까부터 한 장도 안 그리고 있잖아요?"
70010020-45 = "대작가 메루 씨가 활약할 기회가 생겨서 다행이군요. 힛. 힛. 히."
70010020-47 = "싫어!!"
70010020-48 = "만화가라고 해서 '그림 그려줘~'라고 하면 뚝딱 그림이 나오는 줄 알아?!"
70010020-49 = "그림은 공짜도 아니고, 애초에 돈 문제를 떠나서 뚝딱, 하고 순순히 나오는 게 아니라구!"
70010020-51 = "선배!! 당장 위기는 모면해야죠!! 소재거리 찾고 싶다고 해서 저까지 여기 들어온 거잖아요!"
70010020-52 = "싫어, 싫어, 싫어!! 기능에 없다고 대답하던지!"
70010020-53 = "흠, 응답이 없네. 왜 그렇지?"
70010020-55 = "그건 아마도, 기능이 없어서 그런 것 같습니다만……. 한번 기다려 보시면……."
70010020-57 = "기능이 없다면, 밀레니엄 물건보다 기능이 떨어진다는 거잖아?"
70010020-58 = "쓸모가 없네, 이거……."
70010020-60 = "그냥 용광로에 통째로 녹여서 재활용해 버릴까?"
70010020-61 = "네?!"
70010020-63 = "안 그래도 출판부에 활자용 금속이 부족하다고 들었는데, 안되나?"
70010020-64 = "조금 더 기다렸다가 안 되면 그냥 녹여버리지, 뭐!"
70010020-68 = "메루리 씨!! 아니, 메루리 님!!!"
70010020-69 = "문인은 활자로 남는다고 했지만, 정말 활자가 되게 생겼군요. 히익. 힉. 히익……."
70010020-70 = "대위기 앞에서는 야쿠모 선배도 평정을 잃는군요……."
70010020-72 = "아, 알았어!! 펜 내놔!! 미노리 씨, 빨리!!!"
70010020-73 = "괜찮다네. 의연한 최후는 혁명가의 마침표로 어울리지."
70010020-74 = "메루 동지가 제 뜻을 꺾지 않고 맞이하는 최후에 동참해서 영광이군."
70010020-75 = "갑자기 체념하지 말고, 빨리!! 펜 달라고!!!!"
70010020-78 = "나왔다!"
70010020-82 = "와!!! 대단해!! 엄청 잘 그렸잖아?"
70010020-84 = "(히메키 메루……. 그림값은 잊지 않고 후불로 치러주겠다.)"
70010020-85 = "(정말……. 고맙다……!)"
70010020-86 = "흠……. 그런데 역시 컴퓨터가 그려서 그런지 약간 별로긴 하군. 티가 나."
70010020-90 = "뭐, 이 정도가 한계인-"
70010020-96 = "쾅!! 쾅!!!"
70010020-97 = "뭐지?"
70010020-98 = "아마 디스켓을 읽는 소리일 겁니다, 회장님!"
70010020-100 = "이거 놔!! 나가서 수제 펀치 먹여버리게!!"
70010020-102 = "선배!! 진정해요, 진정!!! 다 들릴 거예요!!"
70010020-103 = "좋은 뜻이겠죠!! 그만큼 메루리 씨 선이 깔끔하다는 거 아닐까요!!"
70010020-105 = "컴퓨터로 맞아볼래?! 앙?!!!"
70010020-107 = "회장님, 신형 푸딩 시식 행사 시간입니다."
70010020-108 = "이런! 너무 즐거워서 까맣게 잊고 있었군. 고맙네, 토모에!"
70010020-109 = "마리나 위원장, 정말 수고가 많았네. 불가능을 가능케 하는 재주가 있군!"
70010020-110 = "이번 달 <붉은겨울 연방 영웅> 심사에 정식으로 올리겠네!"
70010020-112 = "가, 감사합니다! 회장님!"
70010020-113 = "그렇지, 가기 전에……. 붉은겨울의 미래와 관련된 아주 중요한 질문을 슈퍼컴퓨터에 물어봐야겠군."
70010020-114 = "이 사항은 철저한 극비에 부쳐야 하니, 모두 이 방에서 나가도록!"
70010020-115 = "모, 모두 방을 비워라!"
70010020-116 = "네, 알겠습니다!"
70010020-126 = "흐음……."
70010020-127 = "어이쿠, 붉은겨울의 최고 극비를 바로 편집부에 알려주시다니."
70010020-128 = "감사할 따름이군요. 힛. 힛. 히."
70010020-129 = "압제자가 극비의 정보를 흘리다니, 혁명의 대의가 추가되겠군."
70010020-131 = "우리가 봤단 걸 알면 끝장이라고! 숙청 세 번은 당할 거야!"
70010020-135 = "앗, 종이가 들어오고 있어요."
70010020-137 = "어디 보자……."
70010020-138 = "<콤라드가 붉은겨울에 더 자주 오면 좋겠어.>"
70010020-142 = "<그리고 나랑 많이 놀아줬으면 좋겠어. 어떻게 해야 할까?>"
70010020-143 = "아앗……."
70010020-145 = "아앗, 앗, 아."
70010020-146 = "이건 9점이군요. 아앗……."
70010020-148 = "이건 확실히 기밀이네요!! 우리가 들었다는 걸 알면 숙청 아홉 번은 당할 거예요!!"
70010020-149 = "드디어 소재를 얻었지만, 이렇게 큰 소재일 줄은 몰랐는데?"
70010020-150 = "뭐, 뭐라도 대답해야 해!! 다들 머리를 모아봐!!"
70010020-152 = "대체 이 말랑말랑한 편지에 뭐라고 대답하라는 거예요?!"
70010020-153 = "뭐라도 좋으니까, 각자 떠오르는 대로 써 봐!!"
70010020-156 = "나왔다!"
70010020-157 = "어디, 어디!"
70010020-159 = "<좋은 질문입니다, 동지! 다음의 사항을 꾸준히 실천하시면 됩니다!>"
70010020-160 = "<주 2일제의 도입, 출판부 예산 3배로 증가, 동인 활동 예산 편성.>"
70010020-161 = "<위 사항을 실천하면, 선생님께서 좀 더 자주 오실 겁니다!>"
70010020-164 = "뭐야, 엄청 쉽잖아!!"
70010020-165 = "고맙네, 슈퍼컴퓨터!"
70010020-171 = "살았, 다……. 이게 통하네……."
70010020-177 = "사무국의 문단속은 내가 하겠다. 먼저 들어가도록."
70010020-178 = "네! 알겠습니다! 항상 수고가 많으십니다!"
70010020-186 = "모두 물러갔다. 이제 나와도 좋다."
70010020-187 = "크아악!! 신선한 공기!!"
70010020-189 = "타카네는 그새 잠들었군요. 하기야, 벌써 밤이 다 되었으니까요."
70010020-190 = "어떻게든 안 들키고 살아남았네요……."
70010020-192 = "모두 미안하다! 이 빚은 어떻게든 갚겠다, 내 명예를 걸고 약속하지!"
70010020-193 = "내일 밀레니엄에서 손님들이 올 때까지만 더 고생해다오!"
70010020-194 = "그럴 필요 없다네. 혁명은 오늘 밤 결실을 볼 테니까!"
70010020-195 = "그렇지! 혁명은 오늘 밤 결실을 볼 테니까!"
70010020-199 = "……뭐라고?"
70010020-200 = "마리나 동지, 핍박받는 동지를 구원하는 마지막 단추가 끼워졌다네."
70010020-201 = "그 핍박을 끊기 위해서, 핍박의 주체인 체리노 회장을 끌어 내리면 되는 것 아닌가?"
70010020-202 = "뭐라고?! 어쩌다가 이야기가 그렇게 되는 거지?!"
70010020-203 = "그리고 동지가 사무국에 이 '컴퓨터'를 설치해 줘서 일이 수월하게 풀렸네."
70010020-204 = "이번 혁명은 밖에서 찾아오는 게 아니라, 안에서부터 시작한다!"
70010020-206 = "해방의 시간이다, 마리나 동지!"
70010020-207 = "그게 아니-!!!"
70010020-214 = "가자!! 해방을 향해!!"
70010020-219 = "결국 이렇게 엮여버렸네요, 아휴……."
70010020-220 = "으아악!! 마감 어떡해! 진짜!!!"
70010020-224 = "뭐, 뭐예요? 자고 일어났더니……."
70010020-225 = "어디서 본 것 같은데요. 컴퓨터에서 튀어나오는 바이러스 같은 존재……?"
70010020-227 = "뭐시기의…… 목마……?"
70010020-229 = "드디어 도착했네, 붉은겨울에 올 줄이야!"
70010020-230 = "붉은겨울 최고의 슈퍼컴퓨터라, 엄청 궁금하네!"
70010020-231 = "과연 성능이 어떨까? 정말 기대된-"
70010020-239 = "슈퍼컴퓨터 혁명군이여, 사무국을 남김없이 물리쳐라!!"
70010020-240 = "슈퍼컴퓨터의 힘으로 반드시 승리하자!"
70010020-245 = "슈퍼컴퓨터 이 녀석, 감히 이 몸을 배신해?!"
70010020-246 = "숙청이다, 숙청!!!!!!"
70010020-259 = "슈퍼컴퓨터 혁명…… 군? 배신……?"
70010020-263 = "돌아가서 우리 슈퍼컴퓨터, 성능 좀 낮춰야겠다……."
70010020-264 = "수동기의 끝"
