[translation]
201020-1 = "ตอนที่ 2;วันหยุดของหัวหน้าฝ่ายบริหาร 2"
201020-2 = "ด้านหน้าอาคารองค์การนักเรียน"
201020-3 = "(เช้าวันหยุดสุดสัปดาห์ คุณครูไปที่อาคารองค์การนักเรียนเพื่อพบกับริน)"
201020-4 = "(ภาพของรินที่ยืนรออยู่ที่ด้านหน้าอาคารนั้น...)"
201020-5 = ""
201020-7 = ""
201020-8 = "[ns] \"ริน...?\""
201020-9 = "เข้าใจผิดแล้วค่ะ..."
201020-10 = "ฉันพอจะเดาได้ว่าคุณครูคิดอะไรอยู่ แต่ทั้งหมดนี้เป็นเรื่องเข้าใจผิดค่ะ ขอเวลาฉันอธิบาย..."
201020-11 = "[s] \"ครูมีเวลาฟังรินอธิบายอยู่แล้ว\""
201020-12 = "เช้าวันนี้หลังตื่นนอน ฉันตั้งใจจะสวมชุดเครื่องแบบออกมาตามปกติ..."
201020-13 = "แต่อาโออิ ไม่สิ... หัวหน้าฝ่ายการเงินบอกว่า 'ถ้าใส่ชุดนั้นออกไปก็ไม่ต่างจากออกไปทำงานเลย' แล้วก็เก็บเครื่องแบบของฉันไป..."
201020-14 = "ฉันก็เลยต้องสวมชุดลำลองออกมาค่ะ... ช่วยเข้าใจกันด้วยนะคะ"
201020-15 = "[s1] \"ก็ไม่เห็นเป็นไรเลยนี่นา?\"\n[s2] \"ชุดลำลองก็เหมาะดี น่ารักจะตาย!\""
201020-18 = "......"
201020-19 = "ขอย้ำอีกครั้งนะคะ... ฉันไม่ถือว่านี่เป็นการเดตค่ะ"
201020-20 = "[s] \"ไม่เป็นไรหรอก ยังไงครูก็คิดว่าเป็นการเดตอยู่ดี\""
201020-21 = "คุณครู...!"
201020-22 = "เฮ้อ... ฉันจะทำเป็นไม่ได้ยินคำพูดเมื่อกี้แล้วกันค่ะ"
201020-23 = "เพราะถ้าคอยมาตามรับมุกตลกของคุณครูทีละมุก วันหยุดที่มีก็คงหมดลงก่อนเราจะได้คุยกันจบพอดี#nน่ะสิคะ"
201020-24 = "แล้ววันนี้ตั้งใจจะไปที่ไหนเหรอคะ...?"
201020-25 = "[s] \"เอ๋? ครูต้องเป็นคนเลือกสถานที่เหรอ?\""
201020-26 = "แน่นอนค่ะ ก็คนที่ชวนออกมาข้างนอกด้วยกันในวันหยุดแบบนี้คือคุณครูนี่คะ"
201020-27 = "อย่าบอกนะคะว่า..."
201020-28 = "ถ้าไม่ได้วางแผนอะไรไว้เป็นพิเศษ ฉันจะกลับห้องแล้วนะคะ..."
201020-29 = "[s3] \"ปะ... เปล่านะ ครูต้องวางแผนมาแน่นอนอยู่แล้ว!\"\n[s4] \"ครูวางแผนการเดตด้วยมุมมองคนที่คุ้นชินกับพื้นที่ไว้แล้ว!\""
201020-32 = "มุมมองคนที่คุ้นชินกับพื้นที่เหรอคะ..."
201020-33 = "ถึงคุณครูจะมาอยู่ที่คิโวทอสนานพอสมควรแล้ว แต่ฉันคิดว่าฉันใช้ชีวิตอยู่ในเขต D.U. มานานกว่า#nคุณครูนะคะ..."
201020-34 = "แต่ว่าได้ลองสัมผัสเขต D.U. ในมุมมองของคุณครูบ้างก็คงไม่แย่เท่าไรค่ะ"
201020-35 = ""
201020-37 = ""
201020-38 = ""
201020-39 = "ถ้างั้นเราไปกันเลยมั้ยคะ"
201020-41 = "ตรอกชานเมืองรามินิทาวน์ เขตชิราโทริ"
201020-43 = ""
201020-44 = "ที่นี่คือ...?"
201020-45 = "[s5] \"ตรอกของกินแห่งรามินิทาวน์น่ะ\"\n[s6] \"แหล่งรวมสตรีทฟู้ดหลากชนิดเลยละ\""
201020-48 = "ฉันรู้ว่ารามินิทาวน์ขึ้นชื่อว่าเป็นแหล่งรวมร้านอร่อย แต่ว่า... พอได้มาเห็นด้วยตาตัวเองแบบนี้แล้ว รู้สึกว่าที่นี่คึกคักกว่าที่คิดไว้มากเลยค่ะ"
201020-49 = "ตั้งแต่แผงลอยที่ตั้งเรียงรายแน่นทุกซอกซอย ไปจนถึงฝูงคนที่ยืนต่อแถวยาวเหยียดออกมาถึง#nริมถนนใหญ่"
201020-50 = "ถ้ามีผู้คนพลุกพล่านขนาดนี้ คงต้องใช้กำลังคนจำนวนมากในการรักษาความปลอดภัย และป้องกันอุบัติเหตุ"
201020-51 = "กลับไปแล้วฉันจะติดต่อสถาบันวัลคิรี่เพื่อหารือเรื่องการจัดสรรกำลังคนในพื้นที่..."
201020-52 = "[s] \"ครูบอกแล้วไงว่าวันนี้ให้พักเรื่องงานไว้ก่อน...\""
201020-53 = ""
201020-55 = ""
201020-56 = "โอ้ คุณครูของชาเล่ต์นี่?"
201020-57 = "วันนี้ก็มากินข้าวคนเดียวอีกแล้วเหรอ? งั้นมื้อกลางวันมากินที่ร้านเราสิ จะแถมให้จุกๆ เลย"
201020-58 = "[s7] \"สวัสดีคุณเจ้าของร้าน ไม่ได้เจอกันนานเลยนะ\"\n[s8] \"วันนี้มากินข้าวกับนักเรียนน่ะ\""
201020-61 = "อะไรนะ? พานักเรียนมากินข้าวในตรอกโทรมๆ แบบนี้เหรอ?"
201020-62 = "เวลาแบบนี้ควรจะพาไปกินที่ภัตตาคารหรูๆ ไม่ใช่มาร้านสตรีทฟู้ดแบบนี้สิ"
201020-63 = "ถึงคุณครูจะเป็นคนฮอตในหมู่นักเรียนก็เถอะ แต่พามากินมื้อกลางวันที่ร้านริมทางแบบนี้เนี่ย ดูเหมือนไม่ใส่ใจเลยนะ"
201020-64 = "ถ้าเอาแต่ทำตัวไม่รู้เรื่องรู้ราวแบบนี้... ระวังจะถูกเหม็นหน้าล่ะ! ฮ่าฮ่าฮ่า!"
201020-65 = "[s] \"จะจำไว้ให้ขึ้นใจเลย...\""
201020-66 = "(ดูเหมือน... คุณครูจะสนิทสนมกับพลเมืองในย่านนี้พอสมควรเลยนะ)"
201020-67 = ""
201020-69 = "[ns] \"วันนี้มีเมนูแนะนำอะไรบ้าง?\""
201020-70 = "อืม... เมนูแนะนำประจำวันคือยากิโซบะทะเลเครื่องแน่น พอดีเมื่อเช้าได้หมึกสดๆ จากท่าเรือคาเนะซากิมาเพียบเลย"
201020-71 = "[s] \"งั้นขอยากิโซบะทะเลสองที่แล้วกัน!\""
201020-72 = "ได้เลย!"
201020-73 = ""
201020-75 = ""
201020-79 = ""
201020-80 = "เอ้า ยากิโซบะทะเลสองที่ได้แล้ว! รีบกินก่อนที่มันจะเย็นล่ะ"
201020-81 = "ขะ... ขอบคุณค่ะ"
201020-82 = ""
201020-84 = ""
201020-85 = "จะว่าไป... ฉันไม่ได้กินยากิโซบะมานานมากเลยค่ะ"
201020-86 = "[s9] \"ครูสั่งอาหารไปโดยไม่ได้ถามรินจังก่อนเลยด้วย...\"\n[s10] \"ขอโทษนะ รินจังไม่ชอบยากิโซบะรึเปล่า?\""
201020-89 = "เปล่าค่ะ ฉันไม่ได้ไม่ชอบหรอกค่ะ"
201020-90 = "แต่ปกติฉันต้องกินข้าวตอนทำงาน เลยกินแต่อาหารสำเร็จรูปที่กินได้ง่ายและรวดเร็วค่ะ"
201020-91 = "อาหารประเภทเส้นทิ้งไว้แป๊บเดียวก็อืดและเย็นชืดได้ง่าย... โดยเฉพาะอาหารแผงลอยที่ผัดเสิร์ฟร้อนๆ อย่างยากิโซบะ ฉันแทบไม่มีโอกาสได้กินเลยล่ะค่ะ"
201020-92 = "แต่ตอนที่ประธานองค์การนักเรียนยังอยู่..."
201020-93 = "เธอเป็นคนที่ต่อให้งานยุ่งแค่ไหนก็หาเวลาออกไปหาของว่างกินได้เสมอ ช่วงนั้นเลยได้ออกมากินอาหารสตรีทฟู้ดอยู่บ่อยๆ ค่ะ"
201020-94 = ""
201020-96 = ""
201020-97 = "เป็นรสชาติที่ชวนให้คิดถึงจังเลยนะคะ ดีจังที่ไม่ต่างไปจากรสชาติที่เคยทานเมื่อก่อนเลย"
201020-98 = "งั้นเหรอ? ได้ยินแบบนี้ฉันก็ดีใจนะ ก็มันยากที่จะเดาเหมือนกันนะว่าพวกนักเรียนสมัยนี้ชอบรสชาติ#nแบบไหนกันน่ะ"
201020-99 = "ไม่นานมานี้ยังนึกว่าฮิตใส่เครื่องเทศเผ็ดๆ กันอยู่เลยแท้ๆ แต่เดี๋ยวนี้ดูเหมือนจะนิยมเอาชีสมาโปะ#nอาหารแทนซะแล้ว"
201020-100 = "กระแสความชอบเปลี่ยนเร็วมาก จนฉันกำลังกังวลอยู่เลยว่าจะต้องเปลี่ยนสูตรแล้วรึเปล่าน่ะ"
201020-101 = "จริงอยู่ว่าการปรับตัวให้เข้ากับยุคสมัยจะเป็นเรื่องสำคัญ แต่ดิฉันคิดว่าการรักษาและสืบทอดคุณค่าที่#nไม่เคยเปลี่ยนเอาไว้ ก็เป็นสิ่งสำคัญเช่นกันค่ะ"
201020-102 = "เพราะแม้ในสังคมที่เปลี่ยนแปลงอย่างรวดเร็ว อาจมีใครบางคนที่โหยหาอดีตที่ไม่เปลี่ยนแปลงก็ได้ค่ะ"
201020-103 = "พอได้ยินเธอพูดแบบนี้แล้ว ฉันก็รู้สึกดีขึ้นมานิดหน่อยเลยแฮะ ฮ่าฮ่าฮ่า!"
201020-104 = ""
201020-106 = ""
201020-107 = "ว่าแต่ว่าเธอ... เคยมาที่ร้านเรารึเปล่า? หน้าดูคุ้นๆ อยู่นะ..."
201020-108 = "เอ่อ คือฉัน..."
201020-109 = "[s11] \"นี่คือรินจังไงล่ะ!\"\n[s12] \"หัวหน้าฝ่ายบริหารขององค์การนักเรียน รินจังไงล่ะ!\""
201020-110 = "เรียกใครว่ารินจังคะ"
201020-112 = "อ๊ะ พอนึกดูแล้วเหมือนเคยเห็นในช่องข่าวของโครโนสนี่นา? คนที่เป็นรักษาการแทนประธานองค์การนักเรียนตอนออกแถลงการณ์ฉุกเฉิน!"
201020-113 = "สงสัยเพราะใส่ชุดสวยๆ ออกมาเดตแบบนี้เลยจำไม่ได้ละมั้ง ฮ่าฮ่า!"
201020-114 = "ก็บอกแล้วไงคะว่าไม่ใช่เดต..."
201020-115 = "จริงสิ ไหนๆ ก็ได้เจอคนขององค์การนักเรียนแล้ว ฉันมีเรื่องที่อยากถามอยู่น่ะ..."
201020-116 = "ช่วงนี้ระบบประปาของเขต D.U. ไม่ค่อยเสถียรเลย มีปัญหาอะไรรึเปล่าน่ะ?"
201020-117 = "เมื่อวานก็ถูกตัดน้ำกะทันหันโดยไม่ประกาศแจ้งล่วงหน้าด้วย เกือบขายของไม่ได้ทั้งวันเลย"
201020-118 = "ต้องขออภัยอย่างสูงสำหรับความไม่สะดวกที่เกิดขึ้นจากงานของทางองค์การนักเรียนค่ะ"
201020-119 = "เนื่องจากการซ่อมแซมแซงก์ทัมทาวเวอร์ที่ดูแลระบบสาธารณูปโภคของคิโวทอสยังไม่เสร็จสมบูรณ์ การจ่ายไฟและน้ำประปาจึงยังติดขัดอยู่บ่อยๆ ค่ะ"
201020-120 = "ตอนนี้ทางเรากำลังเพิ่มกำลังคนเพื่อจัดการเรื่องนั้นอยู่ ยังไงก็ต้องขอความกรุณาโปรดเข้าใจด้วยนะคะ"
201020-121 = "พะ... พอได้ยินเธอพูดแบบนั้นแล้ว ฉันรู้สึกผิดเลยแฮะ..."
201020-122 = ""
201020-124 = ""
201020-125 = "[ns] \"เอ๋? แซงก์ทัมทาวเวอร์ยังซ่อมแซมไม่เสร็จอีกเหรอ?\""
201020-126 = "ถึงจะซ่อมแซมตัวโครงสร้างอาคารเสร็จหมดแล้ว... แต่ยังไม่สามารถกู้คืนระบบควบคุมที่เป็นหัวใจ#nของแซงทัมทาวเวอร์ได้ค่ะ ตอนนี้เลยใช้อุปกรณ์ทดแทนชั่วคราวไปก่อนค่ะ"
201020-127 = "อย่างที่ฉันเคยบอกไปค่ะ ระบบควบคุมแซงทัมทาวเวอร์เป็นสิ่งประดิษฐ์เหนือธรรมชาติที่มีแค่#nประธานองค์การนักเรียนเท่านั้นที่ใช้งานได้ค่ะ เพราะงั้นการบำรุงรักษากับการสร้างขึ้นใหม่จึงเป็นปัญหา#nคนละระดับกันเลยค่ะ"
201020-128 = "ถึงจะโชคดีที่เตรียมระบบสำรองสำหรับดูแลโครงสร้างพื้นฐานเอาไว้ได้ แต่ถ้าเทียบกับความสามารถ#nในการควบคุมของแซงทัมทาวเวอร์เดิม ก็ยังเทียบกันไม่ได้เลยค่ะ..."
201020-129 = "[ns13] (แย่ละ รินจังเข้าโหมดทำงานอีกแล้ว...)\n[ns14] (ต้องรีบเปลี่ยนเรื่องคุยแล้ว...)"
201020-132 = "[ns] \"ตอนนี้กินอิ่มแล้ว เราไปหาอะไรดูกันมั้ย?\""
201020-133 = "แถวนี้มีอะไรน่าสนใจบ้างเหรอคะ?"
201020-134 = "[s15] \"ได้ยินว่ามีหนังเรื่องใหม่ที่ฮิตในหมู่นักเรียนอยู่นะ\"\n[s16] \"รู้จักหนังเรื่อง <การผจญภัยครั้งใหญ่ของซูโป> มั้ย?\""
201020-137 = "ถ้าซูโปละก็... หมายถึงมาสคอตลูกสุนัขที่ชนะการประกวดตัวละครที่จัดโดยสำนักจัดการถนน และฝ่ายคมนาคมของเขต D.U. สินะคะ"
201020-138 = "ดูเหมือนตัวละครจาก <MOMO FRIENDS> ที่เป็นที่นิยมในเขต D.U. มีจุดที่ไม่เหมาะจะนำมาใช้ใน#nงานทางการ จึงจัดประกวดขึ้นเพื่อเลือกตัวละครขึ้นใหม่..."
201020-139 = "แต่ด้วยเหตุผลบางอย่าง ดูเหมือนความนิยมจะต่ำกว่าที่คาดไว้จนหลายหน่วยงานวิจารณ์ว่าเป็น#nการสิ้นเปลืองงบประมาณโดยใช่เหตุ..."
201020-140 = "[s17] \"ทะ... ทุกคนย่อมมีความชอบที่ต่างกันนี่นา...?\"\n[s18] \"ถ้าไปดูเองก็อาจจะชอบก็ได้!\""
201020-143 = "ค่ะ ไหนๆ ก็มาแล้ว ลองไปสังเกตปฏิกิริยาของผู้คนในโรงหนังก็เป็นเรื่องที่ดีเหมือนกันค่ะ"
201020-144 = "[s] \"ครูบอกว่าให้เลิกคิดเรื่องงานไง...!\""
201020-146 = "(แต่ถึงอย่างนั้น รินก็ยังคงกังวลเรื่องงานอยู่ดี...)"
201020-148 = "ด้านหน้า โรงภาพยนตร์ในตัวเมือง D.U."
201020-149 = "[ns19] \"เป็นหนังที่จริงจังกว่าที่คิดอีกนะ คิดว่ายังไงบ้าง?...\"\n[ns20] \"รินคิดว่ายังไงบ้างเหรอ?\""
201020-152 = "อืม ถ้าถามความเห็นของฉัน..."
201020-153 = "เมื่อเทียบกับขนาดของโรงภาพยนตร์แล้ว รู้สึกว่าทางออกตรงเส้นทางอพยพจะค่อนข้างแคบไป#nหน่อยค่ะ"
201020-154 = "ทางเดินแคบอาจทำให้เกิดคอขวดระหว่างการอพยพได้ คงต้องส่งคำขอให้ปรับปรุงพื้นที่เพื่อขยาย#nทางหนีไฟในภายหลังแล้วละค่ะ"
201020-155 = "[s] \"นี่คิดถึงเรื่องนั้นเหรอเนี่ย?!\""
201020-157 = "(ถึงจะพยายามพารินเดินเที่ยวในตัวเมืองเพื่อดึงความสนใจ...)"
201020-159 = "คุณครู เสื้อผ้าที่ซื้อเมื่อกี้ได้เก็บใบเสร็จไว้รึเปล่าคะ?"
201020-160 = "ต่อให้ใช้จ่ายเงินสดซื้อของส่วนตัวก็ควรขอใบเสร็จไว้สำหรับทำบัญชีและลดหย่อนภาษีนะคะ "
201020-161 = "คะ? ถ้าเก็บใบเสร็จไว้แล้วถูกเจอเข้าละก็ จะมีคนเดือดร้อนภายหลังเหรอคะ...?"
201020-162 = "คงไม่ได้หมายถึงเจ้าหน้าที่ฝ่ายการเงินของเราหรอกใช่มั้ยคะ?"
201020-164 = ""
201020-165 = "ซุโมโมะ ตอนนี้ฉันอยู่ที่เขตกลางอาโอบะค่ะ..."
201020-166 = "ได้ยินว่าเซอุนทาวเวอร์ตรงนี้มีกำหนดจะรื้อถอนไปตั้งแต่เดือนที่แล้ว ทำไมถึงยังถูกปล่อยทิ้งไว้แบบนี้ล่ะคะ?"
201020-167 = "คะ...? การรื้อถอนล่าช้าเพราะการต่อรองค่าใช้จ่ายกับผู้รับเหมายังไม่เสร็จงั้นเหรอคะ?"
201020-168 = "ฉันไม่เข้าใจค่ะว่าทำไมปัญหาร้ายแรงขนาดนี้ถึงไม่ถูกรายงานมาล่วงหน้า"
201020-169 = "กรุณาส่งรายงานคำชี้แจงเหตุการณ์ที่เกิดขึ้นอย่างละเอียดภายในวันอังคารหน้าด้วยนะคะ..."
201020-170 = ""
201020-171 = "(ดูเหมือนว่ารินจะมัวแต่พะวงเรื่องงานขององค์การนักเรียน จนไม่ได้พักผ่อนในวันหยุดอย่างเต็มที่)"
