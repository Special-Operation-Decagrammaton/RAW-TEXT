201020-285 = "NANAGAMI RIN, PERFECT!"
201020-286 = ""
201020-287 = "[ns31] \"...A PERFECT?!\"\n[ns32] \"Are you SURE you've never played before?\""
201020-290 = "I did tell you when we first got here... This is my first time at an arcade."
201020-291 = "And no, I've never played this genre of game before either. But all you need to do is enter the attack and block inputs at the right time, no?"
201020-292 = "It's easier than working at the General Student Council, that's for certain. I have to be ready to react to anything, at any time."
201020-293 = "[s33] \"You say that like it's so easy...\"\n[s34] \"You might have the potential to be a genius gamer...\""
201020-296 = "You flatter me. Even if I have some crude talent, I'm sure someone who was actually good at video games would laugh at the notion."
201020-297 = "For example..."
201020-298 = ""
201020-300 = ""
201020-301 = "...Sensei. It's a bit early, but could I make my request right now?"
201020-302 = "[s35] \"I don't mind...\"\n[s36] \"But are you sure? There are a lot of people around us.\""
201020-305 = "Just what are you thinking?!"
201020-306 = "...I'd like to ask you to accompany me somewhere."
201020-307 = "There's someone I want to talk to."
201020-309 = "Next Episode;The Queen's Gambit"
