[translation]
201020-1 = "第2話;首席行政官的假日（２）"
201020-2 = "聯邦學生會大樓前"
201020-3 = "（週六早上，前往聯邦學生會大樓與琳碰面）"
201020-4 = "（在大樓前見到的琳的模樣是……）"
201020-5 = ""
201020-7 = ""
201020-8 = "[ns] 「琳……？」"
201020-9 = "……這是誤會。"
201020-10 = "我大概知道您在想什麼，但這全都是誤會。#n請給我一點時間解──"
201020-11 = "[s] 「那就麻煩你解釋一下吧。」"
201020-12 = "今天早上在宿舍起床後，我原本想和平常一樣穿制服出門……"
201020-13 = "但是碧──更正，是財務室長說「穿那樣出門根本和工作沒兩樣」，#n然後就把制服全都收走了……"
201020-14 = "……所以我只好迫於無奈穿著便服出來，還請您見諒。"
201020-15 = "[s1] 「這樣不是也挺好的嗎？」\n[s2] 「便服很適合你。很可愛哦！」"
201020-18 = "…………"
201020-19 = "……再重申一次，我並不認為這是約會。"
201020-20 = "[s] 「沒關係，反正我已經認定是約會了。」"
201020-21 = "老師……！"
201020-22 = "唉……剛才那句話，我就當作沒聽見吧。"
201020-23 = "要是對老師的每個玩笑都一一回應，恐怕難得的假日就要比對話還早結束了。"
201020-24 = "……所以今天的行程是要去哪裡呢？"
201020-25 = "[s] 「咦？連地點都要我來決定嗎？」"
201020-26 = "那是當然的。#n畢竟提議要在難得的假日一起在外面度過閒暇時光的人，正是老師您啊。"
201020-27 = "難不成……"
201020-28 = "如果您沒有事先安排好行程的話，那我就要回房間去──"
201020-29 = "[s3] 「不，不是的。我就知道會這樣，所以擬定了周密的計畫呢！」\n[s4] 「我以在地人的視角，準備了最棒的約會行程！」"
201020-32 = "在地人的視角……"
201020-33 = "老師來到奇普托斯確實有了一段時間。#n不過在D.U.生活的時間，我想應該是我比較久才對……"
201020-34 = "……不過，親身感受一下老師眼中的D.U.應該也不錯吧。"
201020-35 = ""
201020-37 = ""
201020-38 = ""
201020-39 = "那麼，我們出發吧。"
201020-41 = "白鳥區．拉米尼鎮外圍巷弄"
201020-43 = ""
201020-44 = "這裡是……？"
201020-45 = "[s5] 「這裡是拉米尼鎮的美食街。」\n[s6] 「在這裡可以一口氣品嚐到各種攤販美食。」"
201020-48 = "雖然知道拉米尼鎮是餐飲店家密集的著名美食小鎮……#n實際看見之後才發覺，比我想像中還要繁華許多呢。"
201020-49 = "擠滿巷道的攤販，沿著道路大排長龍的人潮……"
201020-50 = "……人流量這麼高的話，想必需要在治安管理和事故預防方面投入不少人力吧。"
201020-51 = "回去之後我得聯絡女武神警察學園，針對這一帶的人力配置進行商討──"
201020-52 = "[s] 「不是說今天不要去想工作的事嗎……」"
201020-53 = ""
201020-55 = ""
201020-56 = "哦，這不是夏萊的老師嗎？"
201020-57 = "今天也是一個人來吃飯嗎？#n既然如此，午餐就在我們店裡吃了再走吧？#n我可以給你很多折扣哦！"
201020-58 = "[s7] 「你好，好久不見。」\n[s8] 「今天是和學生一起來吃飯的。」"
201020-61 = "什麼？帶著學生來這種簡陋的美食街吃飯？"
201020-62 = "這種時候，應該去那種會端出昂貴套餐料理的高級餐廳才對吧！"
201020-63 = "就算老師再怎麼受學生歡迎，帶人家到攤販吃午餐也太不用心了吧？"
201020-64 = "老是這樣不會看場合的話……小心有朝一日會被討厭的哦！哈哈哈！"
201020-65 = "[s] 「我會銘記在心……」"
201020-66 = "（看樣子……老師和市民們相處起來也毫無隔閡呢）"
201020-67 = ""
201020-69 = "[ns] 「今天有什麼推薦的菜色嗎？」"
201020-70 = "唔嗯……今天推薦的是加滿海鮮的海鮮炒麵。#n我早上才從鐘崎港進了一大批新鮮的花枝呢。"
201020-71 = "[s] 「那就麻煩來兩份海鮮炒麵！」"
201020-72 = "好嘞！"
201020-73 = ""
201020-75 = ""
201020-79 = ""
201020-80 = "來，兩份海鮮炒麵！快趁熱吃吧。"
201020-81 = "謝，謝謝您。"
201020-82 = ""
201020-84 = ""
201020-85 = "……這麼說來，我也好久沒吃炒麵了呢。"
201020-86 = "[s9] 「啊，我沒有和你商量就擅自點餐了……」\n[s10] 「抱歉。你該不會不喜歡炒麵吧？」"
201020-89 = "不，我並不討厭。"
201020-90 = "只是平時得在忙碌的業務中抽空用餐，所以都是以能快速簡單解決的即食食品為主。"
201020-91 = "像麵條這種放久就容易糊掉，尤其是炒麵這類現點現做的攤販小吃……#n我好像幾乎沒什麼機會吃到。"
201020-92 = "不過在聯邦學生會長還在的時候……"
201020-93 = "他是那種再怎麼繁忙，也會特地抽出時間去買零食的人。#n所以那時候我倒是經常吃攤販小吃呢。"
201020-94 = ""
201020-96 = ""
201020-97 = "讓人懷念的味道……和以前吃過的一模一樣，真令人高興。"
201020-98 = "是嗎？那可真是令人欣慰啊。#n最近實在是越來越難掌握學生們喜歡的口味了。"
201020-99 = "前陣子才流行不管三七二十一地加辣，最近好像又流行用起司把食物整個蓋滿……"
201020-100 = "流行變化得太快，我正煩惱著是不是該換個食譜了呢。"
201020-101 = "當然，適應變化確實很重要。#n不過我認為守護並保存那些不變的價值，也是同樣重要的事情。"
201020-102 = "……因為在這瞬息萬變的時代，或許也會有人正在懷念著那些未曾改變的風景呢。"
201020-103 = "能聽到學生這麼說，又讓我重新有了活力呢。哈哈哈！"
201020-104 = ""
201020-106 = ""
201020-107 = "……話說回來，同學你以前是不是也有來過我們店裡？#n總覺得有點眼熟……"
201020-108 = "啊，我是──"
201020-109 = "[s11] 「這位是琳醬！」\n[s12] 「是聯邦學生會的首席行政官！」"
201020-110 = "誰是琳醬啊。"
201020-112 = "啊，這麼說來，我之前在克洛盧斯頻道上看過你。#n就是緊急記者會時的那位聯邦學生會長代理嘛！"
201020-113 = "大概是因為難得的約會打扮得漂漂亮亮，我才一時之間沒認出來呢。哈哈哈！"
201020-114 = "所以說這並不是──"
201020-115 = "對了。難得遇到聯邦學生會的人，我有件事想順便請教一下……"
201020-116 = "最近D.U.的供水設施偶爾會不太穩定，是出了什麼問題嗎？"
201020-117 = "昨天也是突然毫無預警地停水，害我整天的生意差點要做不成了。"
201020-118 = "因為聯邦學生會的事務為您帶來不便，我深感抱歉。"
201020-119 = "由於管理奇普托斯基礎設施的聖所之塔尚未完全修復，#n所以時常會有電力和自來水供應不穩定的情況。"
201020-120 = "我們已經針對此事增派管理人力，還請多多包涵。"
201020-121 = "你，你這麼客氣，反倒讓我有點過意不去了……"
201020-122 = ""
201020-124 = ""
201020-125 = "[ns] 「咦？聖所之塔的修復不是已經完成了嗎？」"
201020-126 = "建築物的結構本身雖然已經全部修復完畢……#n不過作為聖所之塔本質的控制系統，至今仍未找到修復的方法。#n目前只能設置替代設備作為臨時措施。"
201020-127 = "誠如我先前所說，聖所之塔的控制系統是唯有聯邦學生會長才能操作的超常之物。#n對其進行維護保養和重新建設，完全是不同層面的問題。"
201020-128 = "所幸我們已經增設了能夠管理基礎設施的替代系統……#n但是和聖所之塔原有的控制能力相比，依舊遠遠不及……"
201020-129 = "[ns13] （糟糕，琳不知不覺又進入工作模式了……）\n[ns14] （得趕快轉移話題才行……）"
201020-132 = "[ns] 「肚子也填飽了，接下來要不要去看點什麼呢？」"
201020-133 = "這附近有什麼值得觀賞的表演嗎？"
201020-134 = "[s15] 「聽說最近有一部剛上映的電影，在學生之間掀起了話題。」\n[s16] 「片名叫《咻啵的大冒險》，你有聽過嗎？」"
201020-137 = "咻啵的話……#n是在D.U.道路管理局和交通室主辦的角色徵選比賽中脫穎而出的小狗吉祥物吧。"
201020-138 = "聽說是因為D.U.隨處可見的「Momo好友」不太適合在公文中使用，#n所以才會透過公開徵選的方式，選出一個相對中規中矩的角色……"
201020-139 = "然而其人氣卻莫名低於預期，導致各部門似乎都在私底下批評是在浪費行政資源。"
201020-140 = "[s17] 「畢，畢竟感想因人而異嘛……？」\n[s18] 「說不定親眼看了會覺得還不錯哦！」"
201020-143 = "是啊。趁這個機會，親自到電影院確認一下市民們的反應似乎也不錯。"
201020-144 = "[s] 「所以說別再去想工作的事了……！」"
201020-146 = "（可惜在那之後，琳看起來還是持續掛心著工作……）"
201020-148 = "D.U.市區電影院前"
201020-149 = "[ns19] 「沒想到內容比想像中還要嚴肅呢……」\n[ns20] 「琳的感想如何？」"
201020-152 = "這個嘛，就我個人看來……"
201020-153 = "以放映廳的規模而言，通往逃生通道的出口寬度似乎窄了一點。"
201020-154 = "狹窄的通道在避難時可能會成為瓶頸。#n日後應該提出改善要求，透過重新配置設施來確保逃生通道的暢通。"
201020-155 = "[s] 「你在意的是那裡！？」"
201020-157 = "（為了轉移話題，繼續帶他到市區各處逛逛……）"
201020-159 = "老師，您剛才買的衣服有記得索取收據嗎？"
201020-160 = "即便是以個人名義使用現金結帳，建議您還是索取用於節稅或核銷的收據比較好。"
201020-161 = "什麼？您說要是收據被某個人發現會很困擾……？"
201020-162 = "您指的該不會是我們財務室的幹部們吧？"
201020-164 = ""
201020-165 = "李，我目前人在青葉中心區……"
201020-166 = "這裡的星雲塔明明上個月就預定要拆除了，為什麼現在還原封不動地被擱置在這裡？"
201020-167 = "……什麼？你說和業者的費用協商尚未完成，所以拆除工程延期了？"
201020-168 = "這麼重大的問題為何沒有事先呈報，我實在無法理解。"
201020-169 = "……請在下週二之前提交一份報告書給我。"
201020-170 = ""
201020-171 = "（琳因為掛心著聯邦學生會的事務，看起來完全沒能好好享受假日）"
201020-173 = "[ns21] （雖然原本沒打算來這裡……）\n[ns22] （但為了讓琳無暇顧及其他的事情，這也是沒辦法的！）"
201020-176 = "老師，這裡是……？"
201020-178 = "[ns] 「是遊戲中心哦！」"
201020-180 = "[ns23] 「說到假日的約會行程，當然少不了遊戲中心。」\n[ns24] 「琳以前有來過遊戲中心嗎？」"
201020-181 = "都說了不是約會……算了，我已經懶得糾正了。"
201020-182 = "……這麼說來，遊戲中心對我來說有點陌生呢。#n在進入聯邦學生會之前，我也沒有造訪遊戲中心的經驗。"
201020-183 = "沒有，我是第一次來遊戲中心。#n在進入聯邦學生會之前也不曾來過。"
201020-184 = "[s] 「為什麼！？」"
201020-185 = "就算您問我為什麼……也只能說單純沒有什麼緣分吧。"
201020-186 = "我既不擅長玩遊戲，也沒有特別感興趣。"
201020-187 = "而且遊戲對學業或學生會的業務沒有任何幫助，#n我只是判斷沒有必要特地花時間去研究而已。"
201020-188 = "[s25] 「原來琳也有不擅長的事情啊。」\n[s26] 「既然如此……」"
201020-191 = ""
201020-194 = "[ns27] 「……那就用《學生快打2》來一決勝負吧！」\n[ns28] 「輸的人要聽贏的人一個要求！」"
201020-197 = "什麼？這也未免太突然了……"
201020-198 = "而且這個條件對我來說不是單方面的不利嗎？#n我可是連這款遊戲的操作方式都不太清楚呢。"
201020-199 = "[s29] 「你打算逃跑嗎？七神琳。」\n[s30] 「如果怕輸的話，不如就乾脆爽快地承認吧。」"
201020-202 = "就算您這樣挑釁我也沒用的。"
201020-203 = ""
201020-206 = "而且也沒有必要特地加上這種賭注吧。#n如果只是單純地享受遊戲，沒有懲罰反而比較不會有負擔……"
201020-207 = "什麼？您說要是不加點賭注的話，我似乎就不會認真玩遊戲？"
201020-208 = "唉……您真是操心過頭了。#n連玩遊戲的態度都要斤斤計較，簡直就和某人一樣……"
201020-209 = ""
201020-210 = "琳醬，琳醬。要不要一起玩黑白棋？#n我在備品倉庫裡找到了一副舊的黑白棋耶！"
201020-211 = "那就來一決勝負吧！輸的人要請喝飲料哦！"
201020-212 = "嗯？可是不這樣的話，琳醬你每次都會隨便敷衍我嘛。"
201020-213 = "為了逼出琳醬的全力，一定要有懲罰才行！"
201020-214 = ""
201020-215 = "唔哇啊啊……棋盤上一轉眼就被黑色棋子填滿了！"
201020-216 = ""
201020-217 = ""
201020-218 = "……如果是常識範圍內的命令，我倒是無所謂。"
201020-219 = "[s] 「常識範圍內是指……？」"
201020-220 = "顧名思義，就是指常識範圍內的賭注。#n像是請喝飲料、代為處理業務等等……"
201020-221 = "即使老師您再怎麼經常做出奇特的行為……#n應該也不至於提出要學生舔腳，或者用四肢爬行這種不合常理的要求吧。"
201020-222 = ""
201020-225 = "如果有適度的獎懲機制，或許確實能為娛樂增添一點樂趣……"
201020-226 = "既然難得來一趟遊戲中心，我就奉陪一局吧。"
201020-227 = ""
201020-229 = ""
201020-230 = ""
201020-231 = "那麼第一局就先當作練習，順便熟悉一下操作方法……"
201020-232 = ""
201020-233 = "「ROUND 1, FIGHT！」"
201020-234 = ""
201020-236 = ""
201020-237 = ""
201020-238 = "……原來如此。這樣可以使用技能……"
201020-239 = ""
201020-241 = ""
201020-242 = ""
201020-243 = "……這樣做就能讓攻擊無效化了呢。"
201020-244 = "……原來如此。"
201020-245 = ""
201020-246 = "「[USERNAME], WIN！」"
201020-247 = "……請繼續吧。"
201020-248 = ""
201020-249 = "「ROUND 2, FIGHT！」"
201020-250 = "在拉開距離的狀態下施加適當的牽制……"
201020-251 = ""
201020-253 = ""
201020-254 = ""
201020-255 = "再從下段趁虛而入的話……"
201020-256 = ""
201020-258 = ""
201020-259 = ""
201020-260 = ""
201020-261 = ""
201020-262 = "「七神琳, WIN！」"
201020-263 = "「FINAL ROUND！」"
201020-264 = ""
201020-266 = ""
201020-267 = ""
201020-268 = "……"
201020-269 = ""
201020-271 = ""
201020-272 = ""
201020-273 = ""
201020-274 = "…………"
201020-275 = ""
201020-277 = ""
201020-278 = ""
201020-279 = ""
201020-280 = ""
201020-281 = ""
201020-282 = ""
201020-283 = ""
201020-284 = ""
201020-285 = "「七神琳, PERFECT WIN！」"
201020-286 = ""
201020-287 = "[ns31] 「我慘敗了嗎……！？」\n[ns32] 「琳，你真的是第一次玩這款遊戲嗎？」"
201020-290 = "剛才應該也跟您提過，這是我第一次來到遊戲中心。"
201020-291 = "這類的遊戲雖然也是第一次接觸……#n不過只要抓準時機按下攻擊和防禦的指令就可以了，並沒有想像中那麼困難。"
201020-292 = "與必須即時處理各種陳情的聯邦學生會事務相比……#n這款遊戲反而相當有彈性，甚至可以說是游刃有餘。"
201020-293 = "[s33] 「真是可怕的天賦啊……」\n[s34] 「說不定琳擁有天才玩家的資質……」"
201020-296 = "您過獎了。就算我擁有一點天賦，#n在真正擅長遊戲的人眼裡，也只是不值一提的程度而已。"
201020-297 = "舉例來說……"
201020-298 = ""
