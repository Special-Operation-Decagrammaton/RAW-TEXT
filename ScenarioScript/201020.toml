[translation]
201020-1 = "Episode 2;The Chief Officer's Day Off 2"
201020-2 = "Front of General Student Council Building"
201020-3 = "As promised, I headed to the General Student Council building on Saturday morning to meet Rin."
201020-4 = "I found her waiting outside the building..."
201020-5 = ""
201020-7 = ""
201020-8 = "[ns] \"Rin...?\""
201020-9 = "...Please let me explain."
201020-10 = "I realize the implications you are probably drawing from my outfit, but I assure you they're incorrect."
201020-11 = "[s] \"Please explain, then.\""
201020-12 = "I woke up and had fully intended to put on my usual uniform."
201020-13 = "But, Aoi—no, the Chief of Finance—stole all the uniforms from my closet. She insisted that I needed to fully separate myself from work this weekend."
201020-14 = "So I was essentially forced to meet with you in my civilian clothes. I hope you understand."
201020-15 = "[s1] \"Oh, I don't see a problem with it at all!\"\n[s2] \"That outfit looks so cute on you!\""
201020-18 = "..."
201020-19 = "I would like to emphasize that this is NOT a date."
201020-20 = "[s] \"You can do that! But that's how I'm seeing it.\""
201020-21 = "Sensei...!"
201020-22 = "*sigh* I'm choosing to ignore that comment."
201020-23 = "If I were to react to every single one of these jokes of yours, we would end up spending my entire weekend off on this stoop."
201020-24 = "...So where are we going today?"
201020-25 = "[s] \"Huh? Was I supposed to plan that?\""
201020-26 = "Of course. You're the one who invited me to spend our day off together, Sensei."
201020-27 = "Don't tell me..."
201020-28 = "If you haven't planned anything in particular, I'll go back to my room to get some work done."
201020-29 = "[s3] \"A-Are you kidding me? I have a minute-by-minute itinerary scheduled!\"\n[s4] \"Today's date: Kivotos from a local's perspective!\""
201020-32 = "A \"local\"...?"
201020-33 = "I know you've been here for a while now, but I do believe I've lived in D.U. significantly longer than you have, Sensei."
201020-34 = "Well, I suppose seeing the district through your eyes may not be the worst use of time."
201020-35 = ""
201020-37 = ""
201020-38 = ""
201020-39 = "Shall we?"
201020-41 = "Outer Alley in Ramini Town, Shiratori City"
201020-43 = ""
201020-44 = "Where is this...?"
201020-45 = "[s5] \"It's a food street in Ramini Town.\"\n[s6] \"There's all different kinds of cuisines here!\""
201020-48 = "I've seen the reports of Ramini Town's recent profit margins...but it's different seeing it in person. You can feel the energy from all the hustle and bustle."
201020-49 = "The entire alley is food stalls now, which are causing long lines that stretch all the way to the main road."
201020-50 = "...I didn't realize how congested it is here. We'll need to allocate more resources to facilitate foot traffic."
201020-51 = "Let me make a note to reach out to Valkyrie and ask them to deploy personnel to this location—"
201020-52 = "[s] \"The whole point of today is to NOT think about work, Rin.\""
201020-53 = ""
201020-55 = ""
201020-56 = "Oh! Sensei!"
201020-57 = "Alone again? I'll give you a special discount for today—come in, come in!"
201020-58 = "[s7] \"Hello, it's been a while.\"\n[s8] \"I actually have a student with me today.\""
201020-61 = "What? You're taking a student out, and you brought her to this dump?"
201020-62 = "She deserves better than some street food! Take her out to a nice restaurant!"
201020-63 = "Don't take advantage of your popularity and make sure to treat your students right!"
201020-64 = "That kind of mindset is going to get you in trouble one day! Hahaha!"
201020-65 = "[s] \"I'll take that into consideration...\""
201020-66 = "(Sensei fits right in with everyone. The citizens treat them like any other local.)"
201020-67 = ""
201020-69 = "[ns] \"Let's see... What's the daily special?\""
201020-70 = "Hm... I'd recommend the seafood yakisoba. We got a real fresh shipment of squid from Kanesaki Port this morning."
201020-71 = "[s] \"We'll have two seafood yakisoba, then!\""
201020-72 = "Coming right up!"
201020-73 = ""
201020-75 = ""
201020-79 = ""
201020-80 = "Here you go! Two seafood yakisoba. Eat while it's hot!"
201020-81 = "Th-Thank you."
201020-82 = ""
201020-84 = ""
201020-85 = "...I actually haven't had yakisoba in a while."
201020-86 = "[s9] \"Ah. I ordered without even asking you.\"\n[s10] \"Sorry about that. Do you not like yakisoba?\""
201020-89 = "No, no. It's not that."
201020-90 = "I usually work while I eat, so I tend to go for meals that are easy to prepare and eat."
201020-91 = "I rarely have a chance to eat things like yakisoba. Noodles get soggy quickly, and they're best eaten as soon as they're made."
201020-92 = "But when the General Student Council President was here..."
201020-93 = "She was the type to take a break for a quick snack, no matter how busy it was. Now that I think about it, we had street food like this a lot."
201020-94 = ""
201020-96 = ""
201020-97 = "So it's nostalgic, more than anything. I'm glad it still tastes the same."
201020-98 = "Does it? It's hard to figure out what students like to eat nowadays, so it sure fills my heart to hear that!"
201020-99 = "I swear it was just yesterday that everything was about making things as spicy as humanly possible! But now, the trend seems to be to drown everything in cheese."
201020-100 = "I've been debating if I need to change up my recipe to keep up with the times."
201020-101 = "While there's value in adapting to change, it's equally important to preserve our culture and values."
201020-102 = "...Because there will always be those who miss those steadfast times."
201020-103 = "You sure know how to soothe an old soul. Hahaha!"
201020-104 = ""
201020-106 = ""
201020-107 = "Now that I'm getting a good look at you, your face looks awfully familiar! I usually never forget a customer's face!"
201020-108 = "Ah, I'm..."
201020-109 = "[s11] \"This is Rinny!\"\n[s12] \"She's the General Student Council's Chief Officer!\""
201020-110 = "Don't call me Rinny."
201020-112 = "Ah, that's it! I've seen you on the emergency press conference on Kronos. The Acting President, right?"
201020-113 = "You're dressed up so nice for your date! That's why I didn't recognize you. Haha!"
201020-114 = "It's not a date..."
201020-115 = "Perfect timing. I've been having some trouble with something lately. Maybe you could help."
201020-116 = "Has there been something wrong with the D.U.'s water supply? It's been turning off as it pleases lately!"
201020-117 = "I almost closed at a loss yesterday because the water got cut off in the middle of the day. Without a single word of warning!"
201020-118 = "On behalf of the General Student Council, I sincerely apologize for the inconvenience."
201020-119 = "We're still working on restoring the Sanctum Tower, which is largely responsible for managing infrastructure in Kivotos. Until it's fully repaired, you may continue to experience similar outages."
201020-120 = "We've recently increased the number of personnel working on the Tower, so I'd like to ask for your continued understanding."
201020-121 = "O-Of course. I feel a bit bad for complaining now."
201020-122 = ""
201020-124 = ""
201020-125 = "[ns] \"Huh? I thought the restoration efforts were all done.\""
201020-126 = "Structurally, the building itself is. But the Sanctum Tower is meaningless without its operating system, which is where we're having the most trouble. We've installed some temporary measures to restore power and water to the citizens for the time being."
201020-127 = "The Sanctum Tower's operating system is like much of the other supernatural technology in Kivotos—and the General Student Council President was the only one who knew how it worked. While we were able to maintain it in her absence, rebuilding it from scratch is a different matter entirely."
201020-128 = "While the temporary system we've installed has been functioning well enough, it falls short when compared to the original control system's capabilities."
201020-129 = "[ns13] \"(Oh no. Rin's work mode has been activated)\"\n[ns14] \"(I need to steer us away from work, by any means necessary!)\""
201020-132 = "[ns] \"Now that we're done eating, do you want to go watch something?\""
201020-133 = "Did you have something specific in mind?"
201020-134 = "[s15] \"A new movie just released that students have been really enjoying.\"\n[s16] \"Have you heard of 'Shuppo's Grand Adventure'?\""
201020-137 = "\"Shuppo\"... That puppy mascot that won the character competition hosted by the D.U. Road Management Bureau and the Transportation Office?"
201020-138 = "According to reports, they selected the \"safest\" option as the winner, as there were too many issues with using Momo Friends characters in official documents."
201020-139 = "However, it never really caught on with students, so there's been a lot of criticism across departments that it was a waste of resources."
201020-140 = "[s17] \"Y-You never know until you try, right?\"\n[s18] \"Maybe it's just one of those things you have to see in person?\""
201020-143 = "Hm... Okay. It'll be a good opportunity to evaluate its effect and possible improvements in person."
201020-144 = "[s] \"PLEASE stop thinking about work!!\""
201020-146 = "But work seemed to be the only thing Rin was capable of thinking about."
201020-148 = "Front of Movie Theater in D.U."
201020-149 = "[ns19] \"The movie was more serious than I expected...\"\n[ns20] \"What did you think of it, Rin?\""
201020-152 = "Hm. I thought..."
201020-153 = "The aisle leading to the emergency exit was narrow in comparison to the size of the screening hall."
201020-154 = "Narrow walkways like that can cause bottlenecking during an evacuation, endangering citizens' safety. I'll need to send a ticket to the establishment later to rectify that and ensure their building is up to code across the board."
201020-155 = "[s] \"That's what you got out of it?!\""
201020-157 = "I'd hoped she would be able to snap out of \"work mode\" as we continued our day, but..."
201020-159 = "Sensei, did you ask for a receipt for those clothes?"
201020-160 = "Even if it's cash, or for personal use, please keep the receipt for your taxes. "
201020-161 = "What? You're hiding your shopping habits from a certain someone?"
201020-162 = "Surely you don't mean anyone from the Treasurer's Office, do you?"
201020-164 = ""
201020-165 = "Sumomo, I'm currently in Aoba Central..."
201020-166 = "Seiun Tower was scheduled to be demolished last month, wasn't it? Why am I still seeing it here?"
201020-167 = "...To summarize, demolition was delayed because cost negotiations with the contractor came to a standstill?"
201020-168 = "This matter should have been reported to me as soon as it happened."
201020-169 = "...Please submit a detailed report on what happened by next Tuesday."
201020-170 = ""
201020-171 = "Everywhere we went, Rin still prioritized her work over enjoying her day off."
201020-173 = "[ns21] \"(This wasn't in my original plans...)\"\n[ns22] \"(But it looks like I have to resort to drastic measures!)\""
201020-176 = "...What is this?"
201020-178 = "[ns] \"We're at an arcade!\""
201020-180 = "[ns23] \"No weekend date is complete without an arcade!\"\n[ns24] \"Have you been to an arcade before, Rin?\""
201020-181 = "This isn't a date... I'm getting tired of correcting you on that point."
201020-182 = "...But no. Even before I joined the General Student Council, I'd never been to one."
201020-183 = "No, this would be my first time. Even before I joined the General Student Council, I'd never been to one."
201020-184 = "[s] \"How is that humanly possible?\""
201020-185 = "Is that so shocking? I never saw a reason to."
201020-186 = "I've never had much interest in video games, nor am I particularly good at them."
201020-187 = "And they're not useful for my studies or work. So I saw no advantage in investing time into them."
201020-188 = "[s25] \"So even you have your weaknesses, Rin.\"\n[s26] \"In that case...\""
201020-191 = ""
201020-194 = "[ns27] \"...Fight me in Student Fighter 2!\"\n[ns28] \"The winner gets to ask one thing of the loser!\""
201020-197 = "What? You can't be serious..."
201020-198 = "And the odds are stacked too highly in your favor. I don't know how to play."
201020-199 = "[s29] \"So you're running away, Nanagami Rin?\"\n[s30] \"If you're afraid of losing, just say it!\""
201020-202 = "Schoolyard taunts don't work on me."
201020-203 = ""
201020-206 = "Anyways, there's no need for bets. If we're trying to have fun, I would rather play without any looming penalties."
201020-207 = "Hm? You didn't think I would enjoy it if the stakes were too low?"
201020-208 = "*sigh* Please don't worry about that. You sound just like her..."
201020-209 = ""
201020-210 = "Rinny, Rinny! Wanna play Reversi? I found an old Reversi box in the storage room!"
201020-211 = "Let's make a bet! The loser buys the winner a drink!"
201020-212 = "Huh? But you never play seriously if I don't put some kind of stakes on it, Rinny."
201020-213 = "I want you to be as invested as I am!"
201020-214 = ""
201020-215 = "Waaah?! I swear all I did was blink, and you filled the entire board with black stones!"
201020-216 = ""
201020-217 = ""
201020-218 = "...Fine. I'll take the bet, as long as the request is within reasonable bounds."
201020-219 = "[s] \"What does 'reasonable' mean to you?\""
201020-220 = "Exactly as it sounds. Like buying the winner a drink, or doing their work..."
201020-221 = "While there are plenty of rumors about you, I'm sure you wouldn't actually ask a student for something absurd, like licking your feet or getting down on all fours."
201020-222 = ""
201020-225 = "A reward of some kind could make the game more interesting, I suppose."
201020-226 = "We're already here, so I may as well make the most of it."
201020-227 = ""
201020-229 = ""
201020-230 = ""
201020-231 = "But let me use the first round to get used to the mechanics."
201020-232 = ""
