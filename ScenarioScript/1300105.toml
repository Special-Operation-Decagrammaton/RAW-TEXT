[translation]
1300105-1 = "달밤, 특별한, 하이쿠짓기"
1300105-2 = "(문자를 받고 공원으로 찾아오자 마침 치세가 보였다.)"
1300105-4 = "(부스럭)"
1300105-5 = "(부스럭부스럭)"
1300105-6 = "[s] \"……치세? 수풀 안에서 뭐하고 있어?\""
1300105-7 = "냐옹?"
1300105-8 = "으응…… 지금 난 치세가 아니야. 선생님."
1300105-9 = "난, 고양이야. 야옹……."
1300105-10 = "[s] \"고양이……?\""
1300105-11 = "이렇게 수풀 속에서. 고양이가 되는 거야."
1300105-12 = "고양이의 기분……."
1300105-13 = "고양이가 되어야 해~"
1300105-14 = "[s] \"갑자기 고양이는 왜?\""
1300105-15 = "나, 시상이 필요해."
1300105-16 = "하이쿠, 지어야 하니까."
1300105-17 = "[s1] \"시상?\"\n[s2] \"하이쿠?\""
1300105-18 = "응. 시상. 좀 더, 이렇게."
1300105-19 = "응. 시상. 좀 더, 이렇게."
1300105-20 = "마음에 꾸욱, 하고 와닿는 하이쿠를 짓고 싶어."
1300105-21 = "마감, 얼마 안 남았으니까."
1300105-23 = "(한동안 치세어를 해석해가며 이야기를 들어본 결과. 무슨 일인지 알게 되었다.)"
1300105-26 = "[ns3] \"그러니까 추후 있을 음양부 홍보 행사의 일환으로.\"\n[ns4] \"홍보관에 전시하기 위한 하이쿠가 필요하다, 이거지?\""
1300105-27 = "(끄덕)"
1300105-28 = "(끄덕)"
1300105-29 = "하이쿠를, 읊어라. 야."
1300105-30 = "[s] \"하긴, 치세의 음양부는 그런 업무를 주로 하고 있었지.\""
1300105-31 = "하지만 선생님. 이머전시."
1300105-32 = "머릿속이 새하얘서 아무것도 안 떠올라."
1300105-33 = "그래서 말인데."
1300105-34 = "시상을 떠올릴 수 있도록, 오늘 하루. 도와줘."
1300105-35 = "응?"
1300105-36 = "[s] \"물론이지. 도와줄게.\""
1300105-37 = "으응~ 고마워. 선생님."
1300105-38 = "그럼 먼저, 선생님과 만난 기념으로."
1300105-39 = "고양이가 된 기분을 하이쿠로 표현하자면……."
1300105-41 = "냐#n앙#n냐#n아#n앙"
1300105-43 = "고#n양#n이#n되#n어"
1300105-45 = "즐#n거#n운#n기#n분"
1300105-49 = "[ns] \"이것이, 치세의 하이쿠…….\""
1300105-50 = "좀 더, 선생님과 함께 있으면 좀 더 많이 떠오를 거 같아."
1300105-51 = "응, 가자, 선생님."
1300105-56 = "(개굴개굴개굴.)"
1300105-57 = "개구리 울음소리가 들려."
1300105-58 = "[s] \"그러게, 근처에 개구리가 제법 많나 봐.\""
1300105-59 = "개구리 씨가 날 부르고 있어. 선생님."
1300105-60 = "[s] \"으, 응?\""
1300105-61 = "개굴개굴."
1300105-62 = "개굴. 개굴……? (갸웃)"
1300105-63 = "(개굴개굴개굴!!!)"
1300105-64 = "[s] \"치세의 부름에 개구리들이 답을 해줬어?!\""
1300105-65 = "아."
1300105-66 = "개구리 씨가 준 시상."
1300105-67 = "하이쿠야. 선생님."
1300105-69 = "개#n굴#n개#n구#n리"
1300105-71 = "강#n끄#n트#n머#n리#n에#n서"
1300105-73 = "개#n구#n리#n폴#n짝"
1300105-76 = "어때, 개구리 씨들도 좋아해줄까?"
1300105-77 = "(개굴개굴개굴!!!!)"
1300105-78 = "[s] \"엄청 좋아하는 것……같은데?\""
1300105-79 = "다행이네~♪"
1300105-82 = "어서오십셔!!"
1300105-83 = "[s] \"이번에는 편의점이야?\""
1300105-84 = "응……."
1300105-85 = "편의점은 알록달록 예쁘니까."
1300105-86 = "좋은 게, 떠오를지도."
1300105-87 = "[s] \"음, 하지만 시상이 떠오를 만한 게 딱히…….\""
1300105-88 = "아."
1300105-89 = "선생님, 이거 봐."
1300105-90 = "말차맛 라무네, 특별 출시래."
1300105-91 = "[s] \"마, 말차맛?\""
1300105-92 = "말차맛, 라무네. 과자. 알록달록……."
1300105-93 = "떠올랐어. 선생님."
1300105-94 = "[s] \"편의점에서 또 하나가!\""
1300105-97 = "편#n의#n점#n에#n는"
1300105-99 = "과#n자#n가#n잔#n뜩"
1300105-101 = "행#n복#n한#n고#n민"
1300105-104 = "어때, 선생님?"
1300105-105 = "[s5] \"으음, 하이쿠, 라는 게 그런 느낌이었나?\"\n[s6] \"그래도 치세가 지었으니, 내가 보기엔 멋진 하이쿠야.\""
1300105-106 = "으음, 하지만, 이것만으로는, 부족해. 선생님."
1300105-107 = "으음, 하지만, 이것만으로는, 부족해. 선생님."
1300105-108 = "부족한 거. 으음~"
1300105-110 = "(그런 식으로 치세와 함께 하루를 꼬박 이곳저곳을 돌아다녔다.)"
1300105-111 = "(몇 개나 되는 하이쿠를 짓고, 또 지었지만.)"
1300105-112 = "아냐, 뭔가. 부족해. 선생님."
1300105-113 = "조금 더, 마음에 꾹 하고 오는, 그런 게 있었으면……"
1300105-114 = "(치세는 만족하지 못한 듯 계속해서 고개를 도리질 칠 뿐이었다.)"
1300105-116 = "(그렇게 어느덧 해가 저물었다.)"
1300105-118 = "[ns7] \"오늘 제법 많이 돌아다녔네.\"\n[ns8] \"어때, 이제 좋은 시상이 좀 떠올랐어?\""
1300105-119 = "……."
1300105-120 = "……."
1300105-121 = "잘, 모르겠어. 선생님."
1300105-122 = "선생님하고 하루 종일 돌아다니면서, 많은 걸 떠올렸는데."
1300105-123 = "아직도 부족한 것, 같아."
1300105-124 = "왜일까?"
1300105-125 = "[s] \"으음, 어렵네.\""
1300105-126 = "으응."
1300105-127 = "[s] \"하지만 그래도 오늘 하루 즐거웠어.\""
1300105-128 = "……즐거워?"
1300105-129 = "[s9] \"치세의 하이쿠를 들으면서,\"\n[s10] \"오늘 하루 즐겁게 산책할 수 있었으니까.\""
1300105-130 = "즐겁게, 산책……."
1300105-131 = "즐겁게, 산책……."
1300105-132 = "……즐거움."
1300105-133 = "아."
1300105-134 = "[s] \"치세?\""
1300105-135 = "파앗. 하고 왔어."
1300105-136 = "돌아가서, 지어야 해."
1300105-140 = "[ns] \"자, 잠깐만?! 치세?!\""
1300105-142 = "백귀야행 연합학원 제3구교사."
1300105-143 = "(무언가 떠올랐다며 빠르게 달려간 치세를 쫓아 얼마나 달렸을까.)"
1300105-144 = "[s] \"여긴 백귀야행의 구교사?\""
1300105-145 = "선생님, 여기야. 여기."
1300105-150 = "[wa:500]― 어서 와, [wa:1850]선생님."
1300105-152 = "― 여기 [wa:1350]조용해서…"
1300105-155 = "― 하이쿠 짓기에 [wa:1950]딱 좋아 [wa:100]"
1300105-158 = "[wa:350]― 오늘 [wa:800]선생님과 같이 있어서…"
1300105-160 = "― 무척 [wa:650]즐거웠어."
1300105-163 = "― 그래서 나, [wa:2200]깨달았어."
1300105-165 = "[wa:50]― 내가 [wa:800]짓고 싶었던 하이쿠, [wa:3850]그건……."
1300105-168 = "― 오늘 [wa:950]계속 느꼈던 [wa:1600]이 마음을"
1300105-170 = "― 담은 거라는 걸."
1300105-173 = "날#n저#n물#n어#n도"
1300105-175 = "지#n금#n도#n계#n속#n되#n네"
1300105-177 = "둘#n의#n발#n소#n리"
1300105-180 = "[wa:450]― ……선생님과 함께라면, [wa:3050]앞으로도 얼마든지-"
1300105-182 = "― 하이쿠를 지을 수 있을 것 같아."
1300105-185 = "― 다음에도, [wa:1900]또 같이 하자?"
1300105-188 = "[wa:150]― 아……. [wa:1650]선생님 [wa:1700]저기 봐봐."
1300105-191 = "[ns] \"응? 저기라면……. 달은 왜?\""
1300105-192 = "[wa:1200]― 달이, [wa:1500]아름답네."
1300105-195 = "[ns] \"자, 잠깐만 치세. 그 말 뜻은…….\""
1300105-196 = "― 정말, [wa:2200]아름다워……."
1300105-199 = "[ns] \"응, 진짜 있는 그대로 아름답다는 뜻이구나…….\""
1300105-201 = "[ns11] \"그러게, 치세 말대로 정말…….\"\n[ns12] \"달이 아름다운걸.\""
1300105-205 = "(그렇게 치세와 둘이 앉아, 한동안 달구경을 하며 시간을 보냈다.)"
