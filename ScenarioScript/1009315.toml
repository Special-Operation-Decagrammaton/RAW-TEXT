[translation]
1009315-1 = "努力，回憶，還有……"
1009315-2 = "（因為在意綺羅羅的MomoTalk，姑且先來了格黑娜）"
1009315-3 = "（話說回來……）"
1009315-7 = "噗嗡嗡嗡翁！"
1009315-8 = "不能再快了嗎！？沒趕上就完蛋了！！"
1009315-9 = "我們一定要比回收車早到！！"
1009315-15 = "[ns]「不是吧，摩托車怎麼騎那麼快……」"
1009315-17 = "[ns]「……綺羅羅好像坐在後座上！？」"
1009315-18 = "（於是，先朝著摩托車離開的方向跑去）"
1009315-20 = "廢紙倉庫前"
1009315-21 = "哈啊啊……終於到了！"
1009315-22 = "大家，謝謝你們哦！"
1009315-23 = "不用謝啦，我們本來也是要往這個方向。"
1009315-24 = "而且是綺羅羅醬的請求，這點小事不算什麼！"
1009315-25 = "希望你能找到想找的東西！"
1009315-26 = "嘿嘿，真的很謝謝你們！"
1009315-27 = "那我們先走啦！"
1009315-31 = "嗯……來是來了，但是該怎麼辦呢……"
1009315-32 = "嗯？這不是綺羅羅嗎？"
1009315-33 = "啊！管理員大叔！"
1009315-34 = "你來這麼偏僻的廢紙倉庫做什麼？"
1009315-35 = "呃，那個……"
1009315-36 = "原來如此，因為在整理房間，所以把裝書的箱子暫時放到外面，結果被清潔員收走了啊。"
1009315-37 = "嗯！！"
1009315-38 = "而且裡面有我非常非常珍惜的書……"
1009315-39 = "真不走運啊……"
1009315-40 = "那就沒辦法了！"
1009315-44 = "來！"
1009315-45 = "我把廢紙倉庫的門打開，你快找找看吧！"
1009315-46 = "哇……！"
1009315-47 = "快進去吧！20分鐘後回收車就會來把廢紙全部收走！"
1009315-48 = "嗯！真的很謝謝你，大叔！！"
1009315-60 = "唉……"
1009315-61 = "到底在哪裡啊……"
1009315-62 = "[s]「你在找什麼？」"
1009315-63 = "就是……用來讀書的普通線圈筆記本……"
1009315-64 = "啊，普通這個詞收回！封面是我很用心裝飾過的！"
1009315-65 = "[s]「是啊，從封面就能感受到美感。」"
1009315-66 = "嗯？"
1009315-71 = "啊！對！就是那個！"
1009315-72 = "真的很謝謝你，老師！！"
1009315-73 = "……"
1009315-78 = "老師！？為什麼在這裡！？"
1009315-79 = "因為在意剛才的MomoTalk所以來找我了嗎！？"
1009315-80 = "哇啊啊……感覺給你添了很大的麻煩……！"
1009315-81 = "抱歉！老師！！"
1009315-82 = "[s1]「話說這本筆記本……」\n[s2]「總覺得很眼熟……」"
1009315-85 = "嗯！當然眼熟啦！"
1009315-86 = "這是和老師兩個人讀書時用的筆記本啊！"
1009315-87 = "[s]「啊……！」"
1009315-88 = "那個……其實已經用完了，就算扔掉也沒關係，但是……"
1009315-89 = "為了背公式重複寫了好幾遍的記憶，還有絞盡腦汁解題的記憶，還有……"
1009315-90 = "……嗯，因為裝著這些回憶，所以實在捨不得丟掉！"
1009315-91 = "[ns]（翻閱筆記本的頁面）"
1009315-97 = "（筆記本上滿滿的都是學習的痕跡）"
1009315-98 = "（可以讓人感受到盡了很大的努力）"
1009315-100 = "[ns]「真的很努力呢，綺羅羅。」"
1009315-101 = "嘿嘿嘿，老師這麼說讓我有點不好意思呢。"
1009315-102 = "畢竟我不是那種頭腦很好的人，所以當然要加倍努力才能跟上大家……"
1009315-103 = "[s]「其實世界上有很多連理所當然的事都做不到的人……」"
1009315-104 = "咦……真的嗎？"
1009315-105 = "嘿嘿，我好像變得更有自信了呢！"
1009315-107 = "（和綺羅羅聊天時，不經意地繼續翻著筆記本的頁面）"
1009315-114 = "（然後……）"
1009315-116 = "[ns]「這是……塗鴉？」"
1009315-117 = "啊……！"
1009315-118 = "不是，那，那個是……！"
1009315-119 = "[s3]「讀書的時候畫的圖最好看……」\n[s4]「這不是理所當然的嗎！？」"
1009315-125 = "老師也懂啊！"
1009315-126 = "沒錯，做題目的時候，藝術靈感會突然湧現呢！"
1009315-127 = "而且因為只能畫在剩下的狹窄空間裡……"
1009315-128 = "[s]「怎麼可以畫得這麼小又仔細！」"
1009315-129 = "對吧～！"
1009315-130 = "什麼嘛，原來老師跟我一樣啊？"
1009315-131 = "我們有相似的地方呢！"
1009315-132 = "[s]「說起來，這一頁還畫了肖像畫呢？」"
1009315-136 = "[ns]「不過總覺得有點眼熟……」"
1009315-137 = "嗯？什麼？肖像畫？"
1009315-138 = "……"
1009315-139 = "……啊。"
1009315-140 = "啊啊……！"
1009315-145 = "（綺羅羅突然撲過來搶走了筆記本）"
1009315-150 = "那，那個……呃，我……那，那個……"
1009315-154 = "老師，我先走了！！"
1009315-159 = "（就這樣綺羅羅以驚人的速度消失了）"
1009315-160 = "（伴隨著一張紅得發燙的臉……）"
