[translation]
1009315-1 = "ความพยายาม ความทรงจำ และ..."
1009315-2 = "(คุณครูข้องใจกับข้อความ MOMOTALK ของคิราระ จึงไปหาที่เกเฮนน่า)"
1009315-3 = "(แต่ว่า...)"
1009315-7 = "บรื้นนนนนน!"
1009315-8 = "บิดให้มากกว่านี้อีก! ห้ามไปถึงช้าเด็ดขาด!!"
1009315-9 = "เราต้องไปให้ถึงก่อนรถเก็บขยะนะ!!"
1009315-15 = "[ns] \"อะไรกัน ทำไมถึงขี่มอเตอร์ไซค์เร็วขนาดนั้น...\""
1009315-17 = "[ns] \"แต่เหมือนจะเห็นคิราระจะนั่งซ้อนท้ายอยู่เลยนะ...?!\""
1009315-18 = "(คุณครูรีบวิ่งตามมอเตอร์ไซค์ไป)"
1009315-20 = "หน้าโกดังเศษกระดาษ"
1009315-21 = "ฮู่ว... ถึงแล้ว!"
1009315-22 = "ทุกคน ขอบใจนะ!"
1009315-23 = "ไม่เป็นไรหรอก ยังไงนี่ก็เป็นทางผ่านของพวกเราอยู่แล้ว"
1009315-24 = "อีกอย่างนะ ถ้าเป็นคำขอของคิราระจัง ฉันก็ยินดีทำให้ตลอดเลย!"
1009315-25 = "ขอให้หาของเจอนะคะ คิราระจัง!"
1009315-26 = "ฮิฮิ ขอบใจทุกคนมากเลยนะ!"
1009315-27 = "งั้นพวกเราไปก่อนละ!"
1009315-31 = "อืม... แต่พอมาถึงก็ไม่รู้ว่าต้องทำยังไงนะเนี่ย..."
1009315-32 = "หืม? ใครกันน่ะ ใช่หนูคิราระหรือเปล่า?"
1009315-33 = "อ๊ะ! คุณลุงผู้ดูแลโกดัง!"
1009315-34 = "มาทำอะไรที่โกดังเศษกระดาษที่อยู่ห่างไกลแบบนี้ล่ะ?"
1009315-35 = "อึก... เอ่อ คือว่า..."
1009315-36 = "อ้อ... กำลังจัดห้องตัวเองอยู่ ก็เลยเอากล่องใส่หนังสือไปวางไว้นอกห้องเดี๋ยวหนึ่ง แต่ชมรมทำความสะอาดก็มาเก็บไปทิ้งสินะ?"
1009315-37 = "อื้อ!!"
1009315-38 = "แต่ในนั้นมีสมุดเล่มหนึ่งที่ฉันหวงแหนมากๆ เลยน่ะสิ..."
1009315-39 = "เรื่องเป็นอย่างนี้สินะ..."
1009315-40 = "ถ้างั้นก็ช่วยไม่ได้!"
1009315-44 = "เอ้า!"
1009315-45 = "ลุงจะเปิดประตูโกดังให้ ลองเข้าไปหาข้างในดูนะ!"
1009315-46 = "ว้าว...!"
1009315-47 = "รีบเข้าไปหาเร็วเข้า! เดี๋ยวอีก 20 นาทีรถขยะก็จะมาขนเศษกระดาษพวกนี้ไปทิ้งแล้ว!"
1009315-48 = "อื้อๆ! ขอบคุณมากนะลุง!!"
1009315-60 = "เฮ้อ..."
1009315-61 = "อยู่ตรงไหนเนี่ย..."
1009315-62 = "[s] \"หาอะไรอยู่เหรอ?\""
1009315-63 = "มันเป็น... สมุดโน้ตสันเกลียวธรรมดาๆ ที่ฉันใช้จดตอนเรียนน่ะ..."
1009315-64 = "อ๊ะ ขอถอนคำพูดที่บอกว่ามันธรรมดาๆ! ฉันตกแต่งปกสมุดโน้ตไว้ออกจะน่ารัก จะเรียกว่าธรรมดาไม่ได้หรอก!"
1009315-65 = "[s] \"นั่นสินะ แค่เห็นปกก็รู้สึกได้ถึงเซนส์ด้านความงามเลย\""
1009315-66 = "หืม?"
1009315-71 = "เฮือก! ใช่แล้ว! นี่ละ เล่มนี้เลย!"
1009315-72 = "ขอบคุณจริงๆ นะ ครู!!"
1009315-73 = "..."
1009315-78 = "ครู?! ทำไมถึงมาอยู่ที่นี่ล่ะคะ?! "
1009315-79 = "อ่านข้อความ MOMOTALK แล้วกังวล ก็เลยมาหางั้นเหรอ?!"
1009315-80 = "อ่าาา... เหมือนฉันทำให้ครูลำบากไปด้วยเลย...!"
1009315-81 = "ขอโทษนะ! ครู!!"
1009315-82 = "[s1] \"จะว่าไป สมุดโน้ตนี้มันคุ้นๆ จัง...\"\n[s2] \"จะว่าไป สมุดโน้ตนี้มันคุ้นตาจังเลยนะ...\""
1009315-85 = "อื้อ! ก็ต้องคุ้นอยู่แล้วละ!"
1009315-86 = "ก็มันเป็นสมุดที่ฉันใช้จดโน้ตตอนติวหนังสือเดี่ยวกับครูไง!"
1009315-87 = "[s] \"อ้อ...!\""
1009315-88 = "คือ... ที่จริงฉันก็ใช้จดไปจนไม่มีหน้าว่างแล้ว จะทิ้งไปก็ยังได้..."
1009315-89 = "แต่มันมีทั้งความทรงจำตอนเขียนสูตรคณิตวนไปจนกว่าจะจำได้ แล้วก็ความทรงจำตอนแก้โจทย์ยากๆ ด้วย..."
1009315-90 = "ก็นะ มันเป็นสมุดที่บันทึกความทรงจำอะไรแบบนั้นน่ะ! ฉันก็เลยทำใจทิ้งไม่ลง!"
1009315-91 = "[ns] พลิกหน้ากระดาษดู"
1009315-97 = "(สมุดเล่มนี้เต็มไปด้วยร่องรอยของการตั้งใจเรียน)"
1009315-98 = "(มากพอที่จะทำให้คุณครูรู้สึกได้ถึงความพยายามอย่างสุดความสามารถ)"
1009315-100 = "[ns] \"คิราระพยายามอย่างหนักจริงๆ เลยนะ\""
1009315-101 = "แหะๆๆ พอได้ยินครูพูดแบบนี้ก็น่าอายนิดหน่อยนะ"
1009315-102 = "บอกตามตรงว่าฉันหัวไม่ดีเท่าไร ก็เลยต้องพยายามมากกว่าคนอื่น..."
1009315-103 = "[s] \"โลกนี้มีคนที่ทำเรื่องที่คนอื่นมองว่าธรรมดาไม่ได้อยู่ถมเถไปนะ...\""
1009315-104 = "เอ๋... จริงเหรอ?"
1009315-105 = "แหะๆ รู้สึกเหมือนฉันเป็นคนพิเศษขึ้นมาเลย! "
1009315-107 = "(ระหว่างที่คุยกับคิราระ คุณครูก็พลิกกระดาษดูไปเรื่อยๆ)"
1009315-114 = "(และเจอกับ...)"
1009315-116 = "[ns] \"โอ๊ะ มีวาดรูปเล่นด้วย\""
1009315-117 = "อ๊าย?!"
1009315-118 = "เปล่านะ คือว่ามัน...!"
1009315-119 = "[s3] \"รูปที่วาดเล่นตอนเรียนนี่ละออกมาสวยที่สุดแล้ว!\"\n[s4] \"รูปที่วาดเล่นตอนติวหนังสือนี่ละออกมาสวยที่สุดแล้ว!\""
1009315-125 = "ครูก็รู้ด้วยสินะ!"
1009315-126 = "อย่างที่ว่าเลยเนอะ? ตอนเราแก้โจทย์ ความคิดสร้างสรรค์มันจะผุดขึ้นมาแบบที่เราไม่รู้ตัวเลยนี่นา"
1009315-127 = "พอเป็นอย่างนั้น ฉันก็เลยต้องวาดรูปในพื้นที่ว่างที่เหลืออยู่นิดหน่อยในหน้ากระดาษ..."
1009315-128 = "[s] \"แล้วก็จะวาดอย่างพิถีพิถันได้เต็มหน้าเลย!\""
1009315-129 = "ใช่เลย!"
1009315-130 = "อะไรเนี่ย ครูก็เหมือนฉันเปี๊ยบเลยนี่นา?"
1009315-131 = "เรามีส่วนที่คล้ายกันอยู่สินะ!"
1009315-132 = "[s] \"จะว่าไป หน้านี้มีวาดรูปเหมือนไว้ด้วยแฮะ?\""
1009315-136 = "[ns] \"แต่ทำไมถึงดูคุ้นๆ...\""
1009315-137 = "หืม? พูดเรื่องอะไรน่ะ? รูปเหมือนงั้นเหรอ? "
1009315-138 = "..."
1009315-139 = "อ่า..."
1009315-140 = "อ๊ะ...!"
1009315-145 = "(คิราระรีบเข้ามาคว้าสมุดโน้ตไป)"
1009315-150 = "เอ่อ คือว่า บะ... แบบว่า ฉันน่ะ... เอ่อ... เอาเป็นว่า..."
1009315-154 = "ฉันขอกลับก่อนนะ! ครู!!"
1009315-159 = "(แล้วคิราระก็หายตัวไปอย่างรวดเร็ว)"
1009315-160 = "(พร้อมใบหน้าที่แดงก่ำอย่างเห็นได้ชัด...)"
