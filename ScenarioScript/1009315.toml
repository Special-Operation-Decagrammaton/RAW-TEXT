[translation]
1009315-1 = "Effort, Memories, And..."
1009315-2 = "Kirara's MomoTalks concerned me, so I headed over to Gehenna."
1009315-3 = "However..."
1009315-7 = "Vroooom!"
1009315-8 = "Pedal to the metal! We can't be late!!"
1009315-9 = "We have to beat that garbage truck!"
1009315-15 = "[ns] \"Just how fast are they going on a motorcycle...?\""
1009315-17 = "[ns] \"...Wait, wasn't that KIRARA in the back seat?!\""
1009315-18 = "And so, I ran after the motorcycle."
1009315-20 = "Front of Paper Waste Storage"
1009315-21 = "Phew... We're here!"
1009315-22 = "Thanks, y'all!"
1009315-23 = "No biggie! We were headed out here anyway!"
1009315-24 = "And even if we weren't, we never mind doing a favor for a friend."
1009315-25 = "I hope you find what you're looking for, Kirara!"
1009315-26 = "Heehee! Thanks so much, everyone!"
1009315-27 = "We'll be off then!"
1009315-31 = "Um... So I managed to get here... But what now?"
1009315-32 = "Hm? Who's there? Miss Kirara?"
1009315-33 = "Ah! Mister Storage Guy!"
1009315-34 = "And what's a student like you doing at a paper waste facility?"
1009315-35 = "Well... You see..."
1009315-36 = "To summarize, you left a box of your books outside your door while cleaning your room, and the janitorial staff mistakenly took it?"
1009315-37 = "You got it! A+!"
1009315-38 = "And, you see, I had a reaaally important notebook in that box..."
1009315-39 = "I see..."
1009315-40 = "It can't be helped then!"
1009315-44 = "Here!"
1009315-45 = "I'll open up the storage for you, so go look for it!"
1009315-46 = "Whoa...!"
1009315-47 = "But you gotta hurry! The garbage truck is comin' in 20 minutes!"
1009315-48 = "Yup, yup! Thanks so much, mister!"
1009315-60 = "Ugh..."
1009315-61 = "Just where could it be...?"
1009315-62 = "[s] \"What are you looking for?\""
1009315-63 = "Um... It's just an ordinary spiral notebook. I use it for studying."
1009315-64 = "Ah! Wait! It's not ordinary at all, actually. Because I decorated it all super-cute on the outside!"
1009315-65 = "[s] \"Mm, yes. This cover does scream 'Kirara.'\""
1009315-66 = "I know! Wait—what?"
1009315-71 = "Oh! Yes! That's it!"
1009315-72 = "Thank you so, so much, Teach!!!"
1009315-73 = "..."
1009315-78 = "Wait, TEACH?! What are you doing here?! "
1009315-79 = "I worried you with my MomoTalks?"
1009315-80 = "Ack...!! I caused a scene over nothing!"
1009315-81 = "Sorry, Teach!!"
1009315-82 = "[s1] \"Anyways, something about this notebook...\"\n[s2] \"I feel like I've seen this before...\""
1009315-85 = "Yes! You have!"
1009315-86 = "Do ya remember when you helped me study that one time? This is the notebook I was using then!"
1009315-87 = "[s] \"Ah...! Now I remember!\""
1009315-88 = "I actually filled up all the pages...so technically it kinda, like, has no use anymore."
1009315-89 = "But that also means it's filled with my memories of copying down formulas a million times to memorize them, and struggling with practice problems, and, and...!"
1009315-90 = "Just lots of memories! So I didn't want to just throw it out!"
1009315-91 = "[ns] Flip through the notebook."
1009315-97 = "Nearly every page was filled with evidence of her diligent studying."
1009315-98 = "You could feel her effort swelling out from the pages."
1009315-100 = "[ns] \"You worked very hard, Kirara.\""
1009315-101 = "Heehee, it's a bit embarrassing to hear that from you, Teach."
1009315-102 = "The thing is, I'm not that smart or anything, so I gotta work harder to make up for that! Duh!"
1009315-103 = "[s] \"Not everyone would think that way, though.\""
1009315-104 = "Eh... Really?"
1009315-105 = "Heehee! That kinda makes me feel special! "
1009315-107 = "I mindlessly flipped through the pages of Kirara's notebook as we chatted."
1009315-114 = "And then..."
1009315-116 = "[ns] \"Oh, doodles.\""
1009315-117 = "Eh?!"
1009315-118 = "A-Ah! Wait! You see...!"
1009315-119 = "[s3] \"Isn't getting good at doodling...\"\n[s4] \"...a natural side effect of studying?\""
1009315-125 = "You totally get it, Teach!"
1009315-126 = "Right? Right? Don't you also feel your inner artist blooming when you have to solve problems?"
1009315-127 = "But there's only so much space to draw, since you're studying and all..."
1009315-128 = "[s] \"So you end up doodling all these teeny tiny things!\""
1009315-129 = "So true!"
1009315-130 = "You're just like me, Sensei!"
1009315-131 = "We had something in common this whole time!"
1009315-132 = "[s] \"Wooow, you're even drawing portraits!\""
1009315-136 = "[ns] \"Hm, who is this meant to be...?\""
1009315-137 = "Hm? What do you mean? A portrait? "
1009315-138 = "..."
1009315-139 = "...Ah."
1009315-140 = "Ah...!"
1009315-145 = "Without explanation, Kirara lunged at me and snatched the notebook away."
1009315-150 = "W-Well, y-you know, I, um..."
1009315-154 = "Gotta go! Bye, Teach!!"
1009315-159 = "I didn't know Kirara could move as fast as she did while leaving the room."
1009315-160 = "Her face was bright red..."
