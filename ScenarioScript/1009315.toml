[translation]
1009315-1 = "노력, 추억, 그리고……."
1009315-2 = "(키라라의 모모톡이 신경 쓰여서, 일단 게헨나로 왔다.)"
1009315-3 = "(그런데…….)"
1009315-7 = "부와아아앙!"
1009315-8 = "더 밟아! 늦으면 안 된다고!!"
1009315-9 = "우리가 수거 차량보다 더 빨리 도착해야 해!!"
1009315-15 = "[ns]\"아니, 오토바이로 무슨 저렇게 과속을…….\""
1009315-17 = "[ns]\"……그런데 키라라도 뒷좌석에 앉아 있던 것 같은데?!\""
1009315-18 = "(해서, 일단 오토바이가 간 방향으로 달려갔다.)"
1009315-20 = "폐지 창고 앞"
1009315-21 = "후아아…… 도착했다!"
1009315-22 = "모두 고마워!"
1009315-23 = "뭘, 우리도 어차피 이쪽 방향으로 가던 중이었을 뿐인데 뭘."
1009315-24 = "그리고 키라라 쨩 부탁이라면 이 정도쯤은 얼마든지 들어줄 수 있지!"
1009315-25 = "찾으려던 것, 꼭 찾길 바라요, 키라라 쨩!"
1009315-26 = "헤헷, 모두 진짜 진짜 고마워!"
1009315-27 = "그러면 우리는 먼저 가볼게!"
1009315-31 = "으음…… 막상 일단 오긴 했는데, 어떻게 해야 하지……"
1009315-32 = "음? 이게 누구야, 키라라 양 아냐?"
1009315-33 = "앗! 관리인 아저씨!"
1009315-34 = "그런데 이런 외진 폐지 창고에는 무슨 일이야?"
1009315-35 = "읏…… 저기, 그게……."
1009315-36 = "……아하, 방 정리를 하느라 책이 든 상자를 잠깐 밖에 내놨는데, 청소부가 수거해 갔다는 거지?"
1009315-37 = "응!!"
1009315-38 = "그런데 그 안에 내가 정말정말 아끼는 책이 들어 있어서 말이야……."
1009315-39 = "그런 일이 있었구먼……."
1009315-40 = "그렇다면 어쩔 수 없지!"
1009315-44 = "자!"
1009315-45 = "폐지 창고 문을 열어줄 테니, 일단 뒤져보도록 해!"
1009315-46 = "와……!"
1009315-47 = "어서 들어가 봐! 20분 뒤면 수거 차량이 와서 폐지를 다 가져갈 거야!"
1009315-48 = "응응! 진짜 고마워, 아저씨!!"
1009315-60 = "흐우우……."
1009315-61 = "대체 어디 있는 거지……"
1009315-62 = "[s]\"뭘 찾고 있는데?\""
1009315-63 = "그…… 공부할 때 썼던 평범한 스프링 노트 연습장인데……."
1009315-64 = "아, 평범하다는 말은 취소! 표지는 내가 정말 심혈을 기울여서 예쁘게 꾸며 놨거든!"
1009315-65 = "[s]\"그러게, 표지에서 미적인 센스가 느껴져.\""
1009315-66 = "응?"
1009315-71 = "헉! 맞아! 그거야, 그거!"
1009315-72 = "진짜진짜 고마워, 쌤!!"
1009315-73 = "……."
1009315-78 = "선생님?! 왜 여기 계세요?!"
1009315-79 = "모모톡이 신경 쓰여서 찾아왔다고?!"
1009315-80 = "우아아아……. 뭔가 엄청나게 폐를 끼쳐 버린 느낌인데……!"
1009315-81 = "미안해! 쌤!!"
1009315-82 = "[s1]\"그나저나 이 노트…….\"\n[s2]\"뭔가 익숙한데…….\""
1009315-85 = "응! 당연히 익숙할 수밖에 없지!"
1009315-86 = "쌤이랑 단둘이서 공부할 때 썼던 연습장이니까!"
1009315-87 = "[s]\"아……!\""
1009315-88 = "그…… 사실은 끝까지 다 쓴 연습장이라 버려도 되긴 하는데……."
1009315-89 = "공식 외우느라고 몇 번이고 반복해서 써 내려갔던 기억이나, 끙끙거리면서 문제를 풀었던 기억이나, 그리고 또……"
1009315-90 = "……뭐, 그런 추억들이 담겨 있어서 말이야! 차마 못 버리겠는 거 있지!"
1009315-91 = "[ns]연습장 페이지를 넘겨본다."
1009315-97 = "(연습장은 공부의 흔적으로 빼곡히 채워져 있었다.)"
1009315-98 = "(최선을 다해 열심히 했다는 게 느껴질 정도로.)"
1009315-100 = "[ns]\"정말 많이 노력했구나, 키라라.\""
1009315-101 = "에헤헤, 쌤이 그렇게 말해주니 뭔가 부끄러운데."
1009315-102 = "사실 말이야 나, 머리가 엄청 좋은 편도 아니니까, 당연히 그만큼 노력해야 하는 것도 맞고……."
1009315-103 = "[s]\"세상에는 당연한 것을 못 하는 사람이 수두룩하단다…….\""
1009315-104 = "엥…… 정말로?"
1009315-105 = "헤헤, 나, 뭔가 특별해진 느낌이네!"
1009315-107 = "(키라라와 이야기를 나누며, 무심코 연습장의 페이지를 계속 넘겼다.)"
1009315-114 = "(그리고…….)"
1009315-116 = "[ns]\"오, 낙서다.\""
1009315-117 = "히얏?!"
1009315-118 = "아니 그, 그게 말이지……!"
1009315-119 = "[s3]\"공부할 때 그림이 제일 잘 그려지는 건…….\"\n[s4]\"원래 당연한 일 아닌가?!\""
1009315-125 = "선생님도 아는구나!"
1009315-126 = "그치그치? 문제들을 풀다 보면, 갑자기 막 예술성이 샘솟는다니까?"
1009315-127 = "거기다 글을 쓰고 남은 좁은 공간에 그릴 수밖에 없다 보니까……."
1009315-128 = "[s]\"뭔가 엄청 빽빽하고 자세하게 그리게 되지!\""
1009315-129 = "역시!"
1009315-130 = "뭐야뭐야, 선생님도 나랑 똑같잖아?"
1009315-131 = "우리, 닮은 구석이 있었네!"
1009315-132 = "[s]\"그러고 보니 이 페이지에는 초상화도 그렸네?\""
1009315-136 = "[ns]\"그런데 어딘가 익숙한…….\""
1009315-137 = "응? 갑자기 무슨 말이야? 초상화라니?"
1009315-138 = "……."
1009315-139 = "……아."
1009315-140 = "아……!"
1009315-145 = "(키라라가 갑자기 달려들어 노트를 낚아챘다.)"
1009315-150 = "저, 저기, 그, 그게, 나 있잖아, 저기, 그……"
1009315-154 = "먼저 갈게! 쌤!!"
1009315-159 = "(그렇게 키라라는 엄청난 속도로 사라졌다.)"
1009315-160 = "(엄청나게 빨갛게 물든 얼굴과 함께…….)"
