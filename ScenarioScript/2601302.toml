[translation]
2601302-1 = "보이지 않아도 남는 것"
2601302-2 = "아, [USERNAME] 선생님."
2601302-3 = "안녕하세요."
2601302-4 = "[s1] \"아츠코, 즐거워 보이는걸.\"\n[s2] \"아츠코, 신나 보이는걸.\""
2601302-7 = "그렇게 보여?"
2601302-8 = "평소와 다름없다고 생각했는데……."
2601302-9 = "표정에 드러났나 봐."
2601302-10 = "맞아. 사실 조금 들뜬 상태. 축제의 열기 때문이려나."
2601302-11 = "<무법자 해변>에서는 도망 다니지 않아도 된다는 것도 그렇고……."
2601302-12 = "응, 그리고 카메라도 있잖아?"
2601302-13 = "사진을 찍는 건 즐거워."
2601302-14 = "소중한 순간을, 잘라내서 담아 둘 수 있는 게."
2601302-15 = "그래서 오늘은, 좋은 사진을 찍을 수 있는 장소를 찾고 싶어."
2601302-16 = "같이 가 줄래, 선생님?"
2601302-17 = "[s] \"물론이지.\""
2601302-18 = "응, 그럼 가자."
2601302-20 = "우선은 이것저것 가리지 않고 찍어 보려고 해."
2601302-21 = "블랙마켓에서 운 좋게 구한 디지털카메라거든."
2601302-22 = "구식이지만 성능은 나쁘지 않아."
2601302-23 = "앗, 잠깐만, 선생님."
2601302-24 = "저 광고판, 느낌 있는걸."
2601302-25 = "[s] \"광고판이?\""
2601302-26 = "응, 야끼소바, 빙수, 옥수수라고 적힌 글씨……."
2601302-27 = "나중에 사진으로 보면 지금의 달콤한 냄새와 지글지글 소리, 그리고 맛도 기억나겠지."
2601302-28 = "좋은 추억이 될 것 같아."
2601302-31 = "그럼 다음 소재를 찾으러 가 보자."
2601302-33 = "바닷가 산책…… 상쾌한걸."
2601302-34 = "앗, 선생님, 발 조심해. 소라게를 밟을 뻔했어."
2601302-35 = "[s] \"이런, 큰일 날 뻔했네.\""
2601302-36 = "후후, 귀여운 소라게인걸."
2601302-37 = "자아, 구해준 보답이야. 얌전히 사진을 찍히세요."
2601302-41 = "응, 이제 됐어. 잘 가, 소라게야."
2601302-42 = "해변은 위험하니까 바다로 돌아가렴."
2601302-43 = "사진을 보면 이 일도 전부 생생하게 기억나겠지? 그걸 위한 사진들이니까."
2601302-44 = "또 뭘 찍으면 좋을까?"
2601302-46 = "(이후, 아츠코와 함께 해변가와 축제 현장을 돌아다니면서 사진을 찍었다.)"
2601302-48 = "어느새 시간이 이렇게……."
2601302-49 = "[s3] \"노을이 멋진걸.\"\n[s4] \"오늘의 마지막 사진으로 한 장 찍는 건 어때?\""
2601302-52 = "응, 좋아. 그럼 어디……으음……."
2601302-53 = "앗!"
2601302-58 = "카메라가……?!"
2601302-59 = "응, 다행히 모래가 부드러워서 부서지지 않았네."
2601302-60 = "아, 배터리 커버가 열려 있어."
2601302-61 = "모래, 안 들어갔으면 좋겠는데……."
2601302-62 = "……어?"
2601302-63 = "[s] \"배터리 넣는 소켓이……비어 있네.\""
2601302-67 = "앗…… 맞아, 아침에 배터리를 넣고 온다는 걸, 지금까지 깜빡하고 있었어."
2601302-68 = "어쩐지 화면이 안 나온다 했어. 낡은 물건이라 원래 이런 줄 알았는데……."
2601302-69 = "그렇다면 하루 종일 선생님이랑 찍은 사진은……."
2601302-70 = "[s] \"하나도, 남지 않았겠지.\""
2601302-74 = "……오늘, 정말 즐거웠는데, 다 소용없었던 걸까."
2601302-75 = "배터리 하나 챙기지 못해서, 아무것도 남기지 못하게 되다니."
2601302-76 = "광고판도, 소라게도, 이런저런 추억들이 전부 사라져 버린 거잖아."
2601302-77 = "선생님이랑 남긴 추억들이."
2601302-78 = "[s] \"……그렇지 않아.\""
2601302-79 = "그렇지……않다고?"
2601302-80 = "하지만, 사진이 하나도 남지 않았는걸."
2601302-81 = "나중에 사진을 보면서 추억을 되새기려고 했는데……."
2601302-82 = "[s] \"사진이 없어도 기억에는 남으니까.\""
2601302-85 = "[ns] \"함께 축제를 즐긴 건 변하지 않는 사실이잖아?\""
2601302-87 = "……그렇구나."
2601302-88 = "즐거웠던 기억은, 선생님과 내 머릿속에 또렷하게 남아 있어."
2601302-89 = "이렇게 선생님과 이야기하는 시간도, 절대로 잊지 않을 거야."
2601302-90 = "고마워, 선생님. 또 하나 배웠어."
2601302-91 = "[s] \"다음에는 나도 여분의 배터리를 가지고 올게.\""
2601302-92 = "후후."
2601302-93 = "응, 그러면 다음에도 같이 축제를 돌아보자, 선생님."
2601302-94 = "그때는 실수하지 않을 테니까."
