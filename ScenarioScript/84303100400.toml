[translation]
84303100400-6 = "통화 끝난 거야?"
84303100400-7 = "진짜로 돌아왔네! 어딘가 숨어서 '자 이제 찾아봐요!'라고 모모톡 보낼 줄 알았는데!"
84303100400-8 = "……비꼬는 게 아니라 진짜 순수한 의도야. 제발 그대로 받아들여 줘."
84303100400-10 = "알고 있어요. 두 분께는 계속해서 폐를 끼치고 있네요. 다음에 사례라도 할 수 있다면 반드시 해드리고 싶습니다."
84303100400-11 = "아니, 그런 걸 바라는 건 아니니까……. 진짜 줘도 곤란해지고."
84303100400-12 = "아무튼 그래서, 이제부터는 어디를 볼 생각이야? 따로 생각해 둔 곳이 없다면, 근처부터 돌아보도록 할까."
84303100400-13 = "아니면 다른 트리니티 학생들의 대열에 합류하는 것도 나쁘지 않겠지. 안전하기도 하고."
84303100400-14 = "감사해요. 하지만 말씀하셨던 대로, 지금은 개인적으로 흥미가 있는 곳이 따로 있어요."
84303100400-15 = "두 분은 혹시 게임개발부가 어딘지 알고 계신가요?"
84303100400-16 = "게임개발부? 아아. 거긴……."
84303100400-17 = "응! 당연히 알고 있지!!"
84303100400-18 = "그런데 거기는 왜? 게임개발부 부실을 말하는 거야, 게임 시연장을 말하는 거야?"
84303100400-19 = "네? 부실? 시연장……? 음……"
84303100400-21 = "아니, 엑스포 중이니까 지금은 당연히 시연장을 물어보는 거잖아. 선배."
84303100400-26 = "(이런…… 리오에게 조금 더 정확하게 물어볼 걸 그랬군요.)"
84303100400-27 = "(말씀대로 보통은 여기서 시연장을 말한 거겠지만……)"
84303100400-28 = "……부실부터 부탁드릴게요. 부원분들과 개인적으로 말씀드릴 것도 있고 말이에요."
84303100400-32 = "……응? 부실? 정말로 부실이었어?"
84303100400-33 = "아, 혹시 무리한 요구였을까요?"
84303100400-34 = "아니, 그런 건 아닌데…… 뭐. 상관은 없겠지. 개인적인 방문이라면 굳이 우리가 동행하는 것도 부담스러울 테고."
84303100400-35 = "위치만 가르쳐줄게. 여기서 멀지 않으니까, 찾아가는 것도 금방일 거야."
84303100400-36 = "정말 감사해요. 금방 다녀오겠습니다."
84303100400-38 = "응! 신경 쓰지 마, 우리도 여기저기 돌아다니고 있을 테니까!"
84303100400-39 = "무슨 일 있으면 꼭 말해주고."
