[translation]
10039020-1 = "제2화;아이돌의 길: 의상"
10039020-2 = "……과연, 그렇게 된 거로군요?"
10039020-6 = "그런 거라면 정말 제대로 찾아오셨어요, 두 분!!"
10039020-7 = "아이돌이라고 하면, 역시 비주얼이죠! 귀여움은 정의니까요!! 귀여우면 해결되니까요!!!"
10039020-8 = "[s1] \"……!? 노, 노노미……!?\"\n[s2] \"굉장한 의욕……!?!?\""
10039020-11 = "비, 비주얼……? 그렇……군요?"
10039020-12 = "어라……? 어째서 놀라시는 건가요? 두 분도 알고 찾아오신 줄 알았는데……."
10039020-13 = "아이돌 때문에 오신 거라고 하셨잖아요? 저희가 준비 중이라는 걸 알고 오신 거죠?"
10039020-14 = "필요한 게 있으시다면 뭐든 말씀만 주세요. 모처럼 선생님께 도움이 될 수 있는 기회라니, 다들 기쁘게 거들어 줄 테니까요!"
10039020-15 = "……!"
10039020-16 = "감사합니다! 그렇게 흔쾌히 말씀해 주시다니, 어떻게 감사의 말씀을 드려야 할지……."
10039020-20 = "그, 그런데 저기……. 이건 외람된 말씀이라 죄송하지만……."
10039020-21 = "다른 분들은……. 지금은 다들 바쁘신 시간대일까요? 노노미 씨 외에는 안 계시는 듯해서……."
10039020-22 = "아……. 그건 말이죠~."
10039020-26 = "후후. 마침 잘됐네요."
10039020-27 = "두 분. 혹시 괜찮으시다면, 한 가지 도와주실 수 있을까요?"
10039020-28 = "[s3] \"갑자기 퀘스트?\"\n[s4] \"무슨 일이라도 있는 거야?\""
10039020-31 = "그렇다고도 할 수 있지요. 아이디어 자체는 좋았지만, 다들 부끄럼쟁이라서요."
10039020-32 = "……??"
10039020-33 = "아이디어……? 부끄럼쟁이……?"
10039020-34 = "자, 자! 자세한 것은 가면서 설명 드릴게요."
10039020-35 = "어쩌면 조금은 뛰어야 할지도 모르는 일인데……. 혹시 괜찮으실까요?"
10039020-36 = "무, 물론이죠! 그러잖아도 도움받기만 할 수는 없다고 생각하고 있었어요!"
10039020-37 = "돕겠습니다. 꼭 돕게 해 주세요!"
10039020-38 = "어머나, 이렇게 든든한 대답이! 고마워요~."
10039020-39 = "……선생님도, 괜찮으시죠? 도와주신다는 걸로 이해하고 있을게요?"
10039020-40 = "[s5] \"뭐, 뭐……. 그래.\"\n[s6] (묘하지만 일단 고개를 끄덕인다.)"
10039020-43 = "응응! 좋아요☆ 이걸로 문제 해결이겠네요! 자, 그럼 두 분 모두 저를 따라와 주세요!"
10039020-44 = "출바알~☆"
10039020-52 = "예상대로 고전하고 있었군요, 시로코 쨩. 괜찮아요?"
10039020-53 = "응. 만만치 않아. 상상 이상."
10039020-54 = "솔직히……. 이 정도로 거센 저항을 본 건 오랜만이야. 카이저 PMC와 싸울 때보다 버거워."
10039020-55 = "호시노 선배는요?"
10039020-56 = "……저쪽에."
10039020-58 = "으, 으헤……. 으헤헤헤……. 미안해, 후배들……. 나는 여기까지야……."
10039020-64 = "으음……. 호시노 선배까지 쓰러지다니. 확실히 보통 상황은 아니네요."
10039020-65 = "[ns7] \"호, 호시노!? 쓰러져 있어……!?\"\n[ns8] \"이, 이게 대체 무슨 상황이야!?\""
10039020-68 = "교, 교전 상황……!? 전투 중이신 건가요, 두 분은!?"
10039020-69 = "……노노미? 이 사람은……?"
10039020-70 = "이 복장, 트리니티의……."
10039020-72 = "맞아요. 선생님과 함께 저희를 도와주러 오신, 시스터후드의 마리 씨라고 해요."
10039020-73 = "그리고 그……. 음, 상황을 설명하자면 말이죠……."
10039020-74 = "절대, 절대로 못 해!! 나는 인정할 수 없어, 이런 거!!"
10039020-78 = "[ns9] \"……이 목소리는……?\"\n[ns10] \"응? 세리카……?\""
10039020-82 = "어라, 선생도 왔구나. 으헤……."
10039020-83 = "이거, 이거. 백주 대낮부터 못 볼 꼴을 보이고 말았는걸."
10039020-84 = "우리 귀여운 후배들이 꽤 앙칼져서 말이야. 설득을 해 보려고 했는데, 오히려 우리 쪽이 된통 당하고 있었네."
10039020-88 = "……응? 뭐냐고? 그야……."
10039020-89 = "응! 아이돌이죠!"
10039020-94 = "……? 예?"
10039020-95 = "아이돌……? ……이요?"
10039020-96 = "죄, 죄송하지만 지금 이 상황이랑 아이돌이 무슨 관계인지 잘……."
10039020-97 = "그게 말이지, 이번에 트리니티에서 큰 학원제를 하잖아? 거기서 아이돌 행사도 하고."
10039020-98 = "그래서 이번에야말로 노노미 쨩이 아이돌 그룹을 만들어서 신청해 보자- 했었거든."
10039020-99 = "……예의 '약속'도 있고 해서 말이지~."
10039020-100 = "마침 그룹 신청도 2인조 그룹용 신청밖에 남지 않아서, 여기서는 전의 '약속'대로……."
10039020-101 = "……2인조 1학년 그룹. 모두 잘 기억하고 있어."
10039020-105 = "[ns11] \"아~ 완전히 이해했어.\"\n[ns12] \"그렇지. 그런 약속을 했었지.\""
10039020-108 = "정말이지 곤란하다니까, 젊은 아이들의 혈기란~ 그때는 분명히 그렇~게나 호언장담을 해줬으면서 말이야."
10039020-109 = "안 그래? 세리카 쨩? 아야네 쨩?"
10039020-111 = "그, 그건……! 그렇긴 하지만!!"
10039020-112 = "그렇다고 해서 진짜로!! 설마 '그런 옷'까지 입을 줄은……!!"
10039020-113 = "맞아요!! 그런 이야기는 없었잖아요! 무리라고요, 그런 거!!"
10039020-115 = "[ns] (……'그런 옷'……?)"
10039020-117 = "그런가요? 하지만 저희가 준비한 복장도, 엄연히 실제로 아이돌들이 입는 복장 중 하나잖아요?"
10039020-118 = "다른 옷이라고 해도 마찬가지일걸요? 애초에 아이돌 복장이라는 게, 눈에 띄기 위한 옷이니까요."
10039020-119 = "그, 그래도……!!"
10039020-120 = "뭐, 사실 단순히 부끄러워서 받아들이는 데에 시간이 걸리는 거라고 생각되긴 하지만요☆"
10039020-121 = "곤란해. 아이돌 기획서는 기한 내에 제출해야 하니까. 의상 기획서에 올릴 사진을 찍으려면 시간이 얼마 없어."
10039020-122 = "들었지, 아야네!? 조금만 버텨! 여기서 며칠만 더 버티면 된다고!!"
10039020-123 = "알고 있어요! 절대로 질 수는 없다고요!!"
10039020-124 = "아무리 그렇다고 아야네 쨩, 헬기까지 동원해서 이런 농성을 할 줄이야."
10039020-125 = "어지간히 부끄러운 모양이야. 으헤……."
10039020-126 = "아무래도 격렬한 세리카 쨩이랑 아야네 쨩과는 달리, 저희는 세게 나갈 순 없고……."
10039020-130 = "하지만 선생님의 지휘와 시스터 님의 도움이 있다면, 보다 평화롭고 빠르게 끝낼 수 있지 않을까요? 후후"
10039020-132 = "네, 네!?"
10039020-133 = "아, 그. 그게……. 그……. 저, 저는……!"
10039020-134 = "들었지, 두 사람? 그런 의미에서……. 이번에는 좀 부탁한다고?"
10039020-135 = "……'약속'이잖아. 안 그래?"
10039020-136 = "응. 약속은 중요해. 지킬 건 지켜야지."
10039020-140 = "[ns13] \"……과연. 약속은 약속이지.\"\n[ns14] \"스스로 한 약속은 지켜야지.\""
10039020-143 = "……!"
10039020-144 = "스스로 한 약속……."
10039020-145 = "……그렇죠. 네……! 그럼 저도 여기서는 돕겠습니다……!"
10039020-147 = "응응! 그거예요! 감사합니다, 선생님!"
10039020-148 = "그럼……!"
10039020-157 = "……갑니다~☆"
