[translation]
90000040-1 = "제5화;정보수집 4 - 비나"
90000040-5 = "……오래 기다리셨어요. 비나의 움직임을 예측한 알고리즘이 완성되었어요."
90000040-6 = "비나가 출몰한 좌표 데이터를 정규화해서 출현 패턴을 분석, 가장 조우 가능성이 높은 구역들을 지정했습니다."
90000040-7 = "응. 고생했어. 부장. 그럼 이쪽으로 가면 비나를 만날 수 있는 거야?"
90000040-8 = "네. 아마 확률은 90% 이상이에요."
90000040-9 = "하지만 우리가 그쪽의 행동을 예측하기 시작했다는 것을 알게 되면, 패턴을 변경할 수도 있으니 기회는 단 한 번뿐."
90000040-10 = "빠르게 비나와 조우해서 그의 데이터를 수집합니다."
90000040-11 = "이제부터는 에이미, 그리고 선생님의 차례예요."
90000040-12 = "오케이. 그럼 출동이네."
90000040-13 = "[s] \"시작해볼까.\""
