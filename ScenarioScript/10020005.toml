[translation]
10020005-7 = "자아, 그럼 지금부터는 우리들의 차례야."
10020005-8 = "오래 기다리셨습니다~! 이번 작전의 주역 등장~!"
10020005-12 = "<방주 점령전>의 작전 브리핑을 시작하겠습니다."
10020005-18 = "이 점령전은 한마디로, 제한된 시간 안에 <방주>를 해킹해서 통제권을 빼앗는 싸움이야."
10020005-23 = "<아트라하시스의 방주>는 거대한 다차원해석연산장치…… 즉, 이 방주 전체가 일종의 컴퓨터라고 볼 수 있어."
10020005-24 = "이 구조물의 하나하나가 전부 다차원해석을 수행하는 연산장치인 거지."
10020005-25 = "그러니까 이 방주의 각 구역을 [ruby=해킹]점령[/ruby]해 나가며 방주의 통제권을 조금씩 우리 쪽으로 빼앗아 오는 것이 이 전투의 핵심이야."
10020005-26 = "즉, 땅따먹기 같은 거지!"
10020005-28 = "그래. 이 점령전은 기본적으로 상대의 영토를 점령해서 가져오는 거니까, 그 비유가 맞아."
10020005-29 = "그렇게 방주를 점령해 나가다가, 마지막엔 방주의 관제시스템까지 빼앗을 수 있으면 우리들의 승리가 되는 거지."
10020005-30 = "관제시스템이 우리 손에 들어온다면 <자폭 시퀀스>를 발동시켜서 방주를 자폭시킬 수 있거든."
10020005-31 = "물론 적들도 그걸 가만히 보고 있지는 않겠지. 점령전을 수행하면서 적들의 강력한 저항에 부딪치게 될 거야."
10020005-32 = "물론 그쪽은 전문가인 선생님이 있으니까, 큰 걱정은 하지 않지만."
10020005-33 = "[s] \"아아. 맡겨줘.\""
10020005-34 = "……. 현재 방주는 아리스의 활약으로 다차원해석을 하지 못하도록 억제된 상태야."
10020005-35 = "당연하겠지만 그걸 유지하는 데에는 한계가 있어. 제한 시간이 지나면 방주는 억제 상태에서 벗어나서 다시 다차원 속으로 숨어버릴 거야."
10020005-36 = "기껏 붙잡은 방주를 놓쳐버린다면, 두 번 다시 방주를 붙잡는 건 불가능해지겠지."
10020005-37 = "<다차원해석억제한계>까지의 시간은 별도로 표시해 둘게."
10020005-43 = "이 시간이 점령전의 타임 리미트가 될 거야."
10020005-45 = "그럼 지금부터 방주의 내부 구조를 브리핑하겠습니다."
10020005-50 = "방주는 크게 4개의 구역으로 나뉘어져 있습니다."
10020005-60 = "방주 외곽에 위치한 제1구역부터"
10020005-61 = "제2구역과"
10020005-62 = "제3구역,"
10020005-63 = "그리고 방주 중앙에 위치한 4구역."
10020005-64 = "현재 저희 우트나피쉬팀의 배는 제1구역의 내부에 침입한 상태입니다."
10020005-65 = "그러니 자연스럽게 제1구역부터 시작해서, 외곽의 제2구역과 3구역을 점령, 마지막엔 제4구역까지 점령하게 되겠죠."
10020005-66 = "각 구역마다 다차원해석을 연산하는 <차원엔진>이 설치되어 있습니다. 이것이 방주의 핵심, 다차원해석 연산장치의 코어입니다."
10020005-67 = "방주에 존재하는 4개의 차원엔진을 모두 파괴해야, 방주의 관제시스템을 장악할 수 있습니다."
10020005-69 = "그리고 우리가 방주를 자폭시키면, 이 작전은 성공하는 거죠."
10020005-70 = "키보토스는 평화를 되찾게 될 거고."
10020005-74 = "그 후에 선생님과 모두는 엔지니어부가 복구한 우트나피쉬팀의 배를 타고 지상으로 무사히 돌아오기만 하면 되는 거야."
10020005-76 = "그럼 우리들의 설명은 여기까지. 이다음부터는 <샬레>의 턴이야."
10020005-77 = "응, 선생님. 뒤를 부탁할게."
10020005-81 = "선생님 파이팅. 우리도 힘낼 테니까."
10020005-82 = "힘내십시오."
10020005-86 = "[ns] \"고마워, 베리타스. 같이 힘내자.\""
10020005-87 = "……. 설명 감사합니다. 베리타스 여러분."
10020005-88 = "그럼 지금부터……."
10020005-89 = "<아트라하시스의 방주> 점령전을 시작합니다!"
10020005-90 = "[s] \"좋아. 가보자고!\""
10020005-92 = "작전에 필요한 각종 보급품은 여기 준비해 둘 테니까 필요하면 언제든지 찾아오라구, 선생."
10020005-93 = "네! 끝까지 선생님을 지원하겠습니다."
