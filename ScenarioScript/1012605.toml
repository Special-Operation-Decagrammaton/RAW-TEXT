[translation]
1012605-1 = "갑작스러운 초대"
1012605-2 = "(잠시 후. 카노에가 기다리는 녹음실에 도착했다.)"
1012605-6 = "왔구나, 선생."
1012605-7 = "자…… 그쪽에 앉아. 장비 사용법을 알려줄 테니까."
1012605-8 = "이참에 행복한 둘만의 시간을 보내는 거야. 히히……."
1012605-9 = "[s] \"노, 녹음만 하는 거 맞지?\""
1012605-10 = "응……? 설마 녹음 말고 다른 것도 하고 싶었어?"
1012605-11 = "……그랬구나."
1012605-12 = "괜찮아…… 이미 선생을 불렀을 때부터 각오하고 있었어……."
1012605-13 = "선생이라면 내 차가운 체온을 따뜻하게 데워줄 수 있겠지."
1012605-14 = "[ns1] (식은땀이 흐른다…….)\n[ns2] (어떻게든 도망쳐야 할 것 같다.)"
1012605-22 = "이히히, 못 도망가."
1012605-23 = "[s] \"어, 어느새……!\""
1012605-24 = "선생…… 도대체 뭘 상상한 거야?"
1012605-25 = "나한테도 말해줘. 같이 즐기자고."
1012605-26 = "히히…… 이히히힛……!"
1012605-27 = "[s3] \"아, 아무것도 아니야!\"\n[s4] \"시키는 대로 열심히 할게!\""
1012605-31 = "(……이후 카노에에게 열심히 장비 사용법을 배웠다.)"
1012605-32 = "(덕분에 간단한 녹음 보조 정도는 할 수 있게 됐다…….)"
1012605-37 = "그럼 슬슬 녹음을 시작하자."
1012605-38 = "도와주는 보답으로…… 내 진짜 모습을 보여줄게."
1012605-43 = "[wa:540]― [log=카노에]선[wa:970]생님. [wa:1470]그, [wa:1380]녹음하기 전에……[/log]"
1012605-45 = "― [log=카노에]들어줬으면 하는 게 있어.[/log]"
1012605-48 = "― [log=카노에]사,[wa:670] 사실은……[/log]"
1012605-50 = "― [log=카노에]나,[wa:1260] 계속 숨기던 게 있어서…….[/log]"
1012605-53 = "― [log=카노에]나,[wa:590] 난……[wa:1580] 부끄럼쟁이에 [/log]"
1012605-55 = "― [log=카노에]말도 잘하지 못해.[/log]"
1012605-58 = "[wa:390]― [log=카노에]그걸 숨기기 위해,[/log]"
1012605-60 = "― [log=카노에]음침한 성격을 연기했었어…….[/log]"
1012605-63 = "― [log=카노에]오컬트에 빠진 것도……[/log]"
1012605-65 = "― [log=카노에]자신을 바꾸고 싶어서였어.[/log]"
1012605-68 = "[wa:1150]― [log=카노에]이 모습을 아는 건……[wa:1880] 선생님뿐이야.[/log]"
1012605-70 = "― [log=카노에]그러니까……[wa:1380] 비밀로 해줄래?[/log]"
1012605-73 = "[wa:370]― [log=카노에]서,[wa:770] 선생님을 [wa:1900]믿으니, [wa:1290]까…… [/log]"
1012605-76 = "[ns] \"이, 이게 카노에의 진짜 모습이라고……?\""
1012605-77 = "[wa:150]― [log=카노에]……히히, [wa:1020]이히히.[/log]"
1012605-79 = "― [log=카노에]선생,[wa:1390] 믿었어?[/log]"
1012605-82 = "― [log=카노에]선생은,[wa:1680] 귀여운 걸 좋아하지?[wa:40] [/log]"
1012605-85 = "[wa:550]― [log=카노에]그럼, [wa:1340]나도…… [wa:2480]좋아, [wa:1160]하는 거네?[/log]"
1012605-87 = "― [log=카노에]이힛……! [/log]"
1012605-90 = "[ns] \"카노에! 속였구나! 카노에!!\""
1012605-92 = "(……이후 열심히 카노에의 녹음을 도왔다.)"
1012605-93 = "(이번에 녹음한 것은, 열혈 스포츠물의 드라마 CD였다.)"
1012605-95 = "흐음, 이걸로 이번 녹음은 마무리됐네."
1012605-96 = "보조 수고 했어, 선생. 역시 믿음직해."
1012605-97 = "[s] \"새삼 느끼지만, 카노에는 연기 폭이 정말 넓네.\""
1012605-98 = "그래도 더 열심히 해야 해……."
1012605-99 = "요즘 성우계에서 이 정도는 다들 기본이거든."
1012605-100 = "나름 유망주라고 해도…… 긴장을 늦출 순 없어."
1012605-101 = "[s] \"카노에도 꿈을 좇는 소녀였구나.\""
1012605-105 = "응…… 나도 꿈이 있어……."
1012605-106 = "혹시 어떤 꿈인지 알아?"
1012605-107 = "[s] \"유명한 성우가 되는 꿈?\""
1012605-108 = "그것도 있지만…… 사실 그거보다 더 큰 꿈이 있어."
1012605-109 = "그건 바로……."
1012605-122 = "……전생의 인연을 되찾는 것."
1012605-123 = "히히, 선생. 아직도 기억 안 나?"
1012605-128 = "나야……. 손은 차갑지만 마음은 따뜻한 여자."
1012605-132 = "오컬트를 좋아하고 검은 고양이와 까마귀가 수상할 정도로 잘 따르는 여자."
1012605-138 = "바로 나라고……!"
1012605-139 = "[s] \"그, 그건 잘 알고 있는데요……!!\""
1012605-141 = "(……이후 흥분한 카노에를 근처의 디저트 카페에 데려가 진정시켰다.)"
1012605-146 = "(열심히 녹음한 뒤라 그런지, 당을 채우며 만족하는 모습이었다…….)"
