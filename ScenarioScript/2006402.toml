[translation]
2006402-1 = "인생은 애드리브"
2006402-2 = "(오늘은 우라라와 교류회를 가지기로 한 날이다.)"
2006402-3 = "(서둘러 약속 장소로 향했다.)"
2006402-6 = "(기다리고 있자니, 화사한 향기가 풍겨왔다)"
2006402-7 = "[ns] \"이건…… 장미 향기?\""
2006402-11 = "어라……? 선생님?"
2006402-12 = "생각보다 일찍 오셨네요?"
2006402-13 = "[s] \"중요한 약속이니까!\""
2006402-16 = "그, 그렇군요?"
2006402-17 = "[s] \"우라라도 일찍 나왔네?\""
2006402-18 = "그게, 부끄럽지만…… 심장이 주체할 수 없을 만큼 뛰어서……."
2006402-19 = "먼저 와서 마음의 준비를 하려고 했어요."
2006402-20 = "너무 대담하다고 생각하지 않으시나요?"
2006402-21 = "번화가에서 연상과 만나, 함께 영화를 본다니……. #n평소의 저라면 있을 수 없는 일이니까요."
2006402-22 = "그, 그런 의미에서 오늘 잘 부탁드립니다."
2006402-23 = "[s] \"응! 나만 믿어!\""
2006402-24 = "아…… 네."
2006402-27 = "……."
2006402-28 = "그런데 우리…… 이제 뭐 할까요?"
2006402-29 = "예정보다 일찍 만나서 영화가 시작하려면 시간이 좀 남았는데……."
2006402-30 = "카페에서 차를 마시는 것도 애매하고……. 으으음……."
2006402-31 = "[s] \"극장 안쪽의 쇼핑몰이라도 둘러볼까?\""
2006402-32 = "아, 네. 그렇게 할까요?"
2006402-36 = "(이후 우라라와 극장 안쪽의 쇼핑몰로 향했다.)"
2006402-40 = "……."
2006402-41 = "[ns1] (옆에서 봐도 알 수 있을 만큼 우라라는 긴장한 상태다.)\n[ns2] (어떻게든 해야 한다…….)"
2006402-44 = "[ns] \"우라라는 평소에도 영화를 자주 보는 편이야?\""
2006402-47 = "아…… 네."
2006402-48 = "취미로도 즐기고 있고, 학과 활동에도 도움이 되거든요."
2006402-49 = "사실은 저, 연극을 전공하고 있어요."
2006402-50 = "[s] \"오? 그랬구나?\""
2006402-51 = "후후…… 조금 의외죠? 저처럼 기가 약한 사람이 연극이라니."
2006402-52 = "그래도 맡은 배역에서는 나름 잘한다고 평가받고 있어요."
2006402-53 = "욕심을 내자면…… 악역을 연기해 보고 싶기도 해요."
2006402-54 = "조금…… 의외라고 생각하셨나요?"
2006402-55 = "[s] \"뭔가 색다른 느낌이라 좋을지도?\""
2006402-56 = "색다른 느낌……."
2006402-57 = "후후…… 그렇네요."
2006402-60 = "……."
2006402-61 = "그, 그럼…… 선생님은 영화 좋아하세요?"
2006402-66 = "(이후로 영화 이야기를 계속하며 거리를 좁혀 나갔다.)"
2006402-67 = "(잠시 후…….)"
2006402-70 = "아…… 곧 영화가 시작할 시간이네요."
2006402-73 = "슬슬 가보실까요?"
2006402-74 = "말없이 피어나지만 희망을 전하는 꽃처럼…… 이 시간이 서로에게 소중히 기억되길 바라며."
2006402-76 = "(그렇게 우라라와 함께 본 영화는…….)"
2006402-82 = "(……돌연변이 식물이 인간에게 뿌리를 내려 조종하는 내용의 호러 무비였다.)"
2006402-83 = "[ns] (우라라는 이런 영화를 좋아했구나…….)"
2006402-84 = "(영화가 끝난 뒤…….)"
2006402-86 = "한산한 어느 카페"
2006402-87 = "이번 영화 어떠셨나요? 재미있었나요?"
2006402-88 = "[s] \"으, 으응! 재미있었어!\""
2006402-89 = "후후…… 정말 다행이네요."
2006402-90 = "클래식의 영역에 발을 딛는 듯한…… 그럼에도 마니아적인 주제의 작품."
2006402-91 = "이번에 재개봉한다고 해서 누구와 볼까 고민했는데, 선생님이 좋아해 주시니 다행이네요."
2006402-94 = "아, 맞아요. #n사실 이런 걸 가져와 봤어요."
2006402-99 = "그 영화의 대본이에요. 함께 살펴보지 않을래요?"
2006402-100 = "[s] \"대, 대본까지?\""
2006402-101 = "그게…… 저는 영화나 연극의 대본을 보는 걸 좋아해요. #n영화와 대본의 내용을 비교해 보면, 의외의 부분을 발견하곤 하거든요."
2006402-104 = "혹시 부담됐다면 죄송해요. 제가 너무 들떴나 봐요."
2006402-105 = "[s] \"같이 보고 싶어. 재미있을 것 같아.\""
2006402-106 = "아, 그렇다면 저도 기뻐요."
2006402-107 = "말씀드렸듯이 저는…… 대본을 보는 걸 좋아해요."
2006402-108 = "대본과 영화를 비교해 보면, 배우들의 애드리브를 확인할 수 있거든요."
2006402-109 = "이번에 같이 봤던 영화에도 엄청난 애드리브가 있었어요."
2006402-110 = "주인공이 마지막에 돌연변이 식물 군락을 폭파할 때 기억나시나요?"
2006402-111 = "[s3] \"원격 폭파 버튼이 동작 안 해서…… 직접 수동으로 폭파했지.\"\n[s4] \"주인공이 위험을 무릅쓰고 모두를 구한 명장면이었어.\""
2006402-114 = "네. 말씀대로 손에 땀을 쥐는…… 정말 가슴 뜨거운 장면이었어요."
2006402-115 = "하지만 대본과는 큰 차이가 있죠."
2006402-118 = "대본에는 원격 폭파가 성공해서 그대로 끝나는 결말이었으니까요."
2006402-119 = "[s] \"응? 왜 결말이 다른 거야?\""
2006402-120 = "촬영장의 원격 폭파 장치가 진짜로 고장 나서 터지지 않았거든요."
2006402-121 = "하지만 일정 때문에 폭파 세트를 조정할 시간이 없었고…… #n결국 배우들이 현장에서 애드리브로 연기를 펼쳤다고 해요."
2006402-122 = "폭파도 진짜 수동으로 했다 하고요."
2006402-123 = "결국 비정상적인 결과물이라 할 수 있지만…… #n순간의 반짝임은 때론 상상 밖에서 찾아오는 법이죠."
2006402-124 = "덕분에 오늘 보았던 명장면이 만들어진 거예요."
2006402-125 = "[s] \"엄청난 비하인드가 있었구나…….\""
2006402-126 = "저도 처음 그 사실을 알았을 땐 상당히 놀랐어요."
2006402-127 = "동시에 느꼈죠. 모든 것이 대본대로 흘러가진 않는다는 것을."
2006402-128 = "그리고 그것은 창작의 세계에만 국한된 이야기가 아닙니다."
2006402-129 = "일상이라는 이름의 극장에는 항상 애드리브가 필요하죠."
2006402-130 = "와일드헌트 예술 평의회의 부회장으로서 살아간다면 더더욱…… 적당한 애드리브가 필요하답니다."
2006402-133 = "아…… 이건……."
2006402-134 = "저도 모르게 뭔가 의미심장한 이야기를 해버렸네요."
2006402-135 = "좋아하는 영화 이야기를 하다 보니 감정이 고조돼서 쓸데없는 말까지……."
2006402-139 = "이 이야기, 다른 임원분들에겐 비밀로 해주세요."
2006402-140 = "[s5] \"그렇게 할게.\"\n[s6] \"우라라도 고생이 많구나…….\""
2006402-145 = "후후……."
2006402-146 = "선생님 정도는 아니지만요."
2006402-148 = "(이후 우라라와 계속 카페에서 영화 이야기를 나누며 즐거운 시간을 보냈다.)"
2006402-149 = "(시작은 좀 어색했지만, 꽤 성공적인 교류회였다.)"
