[translation]
1003505-1 = "갑작스러운 제안"
1003505-2 = "고서관 내부"
1003505-3 = "(우이의 안내를 받아 다시 고서관에 들렀다.)"
1003505-4 = "(언제나처럼 오래된 고풍스러움과 생활감이 동시에 느껴졌다.)"
1003505-5 = "오셨군요, 선생님. 기다리고 있었습니다."
1003505-6 = "저와……. 그리고 여기……."
1003505-7 = "이 아이입니다……."
1003505-8 = "보, 봐 주세요……. 선생님. 아직은 새하얗게 비어있지만……!"
1003505-9 = "이제부터 선생님과 제가……. 함께 만들……!"
1003505-10 = "[s1] \"……뭐, 뭐라고요?\"\n[s2] \"갑자기 무슨 이야기를……!?\""
1003505-11 = "……아."
1003505-12 = "……아."
1003505-13 = "죄송합니다. 또 설명 없이 이런 식으로 말을……. 채, 책 이야기였어요. 늘 그렇듯이."
1003505-14 = "이건 그……. 페, 펜팔이라는 것……입니다……."
1003505-15 = "번갈아 가면서……. 할 말이나……. 생각이라든가…… 그, 그런 걸 적는……."
1003505-16 = "……호, 혹시 부담스러우시려나요……. 역시 좀 무리려나……."
1003505-17 = "저……. 조금이라도 좋으니……. 알고 싶어서……."
1003505-18 = "……선생님에 대해……!"
1003505-19 = "그래서……! 가, 같이 펜팔……! 서로 번갈아 가지고 있으면서……!"
1003505-20 = "……? 네?"
1003505-21 = "아, 아……. 혹시 저 또 뭔가 선생님께 큰 실수를……?"
1003505-22 = "……아."
1003505-23 = "그, 그러신가요……. 역시 가지고 다니기에는 좀……. 너무 큰 아이인가……?"
1003505-24 = "생각해 보니 당연하네요……. 아하하……. 저, 저도 참 멍청하게 그런 생각도 못 하고……."
1003505-25 = "아, 아무 생각 없이……. 크고 두꺼워야 오랫동안 선생님이랑 같이 쓸 수 있을 거라는 생각에……."
1003505-26 = "그렇게 생각하니 이 아이가 마음에 들어서 그만……."
1003505-27 = "……미안해……."
1003505-28 = "[s] \"…….\""
1003505-29 = "죄, 죄송합니다. 그럼 좀 더 작은 책으로 바꿔 올게요……. 수첩 사이즈라던가……."
1003505-30 = "……네? 굳이 안 그러셔도 된다고요?"
1003505-31 = "그, 그렇지만 방금 이 아이가 커서 들고 다니기 어려우시다고……."
1003505-32 = "저도 선생님께 그런 부담을 드리려고 했던 건 아니었거든요……."
1003505-33 = "……네?"
1003505-34 = "굳이 들고 다니지 않아도 된다고요……? 그, 그럼 어떻게 쓰시려고……."
1003505-35 = "……방명록……이요?"
1003505-36 = "펜팔 대신……?"
1003505-37 = "……아."
1003505-38 = "여기 오실 때마다……. 한 마디씩 적고 가시면 되지 않냐는 말씀이시군요."
1003505-39 = "저야 그래도 좋지만……. 괘, 괜찮으실까요? 굳이 그렇게까지 이 책으로 고집하시는 건……."
1003505-40 = "[s3] \"나도 이왕이면 이 아이랑 같이 하는 게 좋으니까.\"\n[s4] \"우이가 기대하며 골라준 아이잖아.\""
1003505-41 = "……!!"
1003505-42 = "……!!"
1003505-43 = "……아……."
1003505-44 = "……아아……. 으흑……. 으흐흑흑……!"
1003505-45 = "[s5] \"우이……!?\"\n[s6] \"갑자기 울어 버렸다!?\""
1003505-46 = "아, 죄송합니다. 선생님……. 그, 그냥 너무 그……. 뭐랄까……."
1003505-47 = "아, 죄송합니다. 선생님……. 그, 그냥 너무 그……. 뭐랄까……."
1003505-48 = "좋아서……."
1003505-49 = "이렇게까지 이해 받으며 대화하는 건 정말로 처음이라서……."
1003505-50 = "정말 감사합니다. 선생님……. 방명록……. 완성되면 보물로 삼을게요……."
1003505-51 = "……아. 그럴 것까지는 없다고요……. 아, 알겠습니다……. 그래도 감사합니다……."
1003505-52 = "흑흑……. 흑흑흑……."
1003505-54 = "(이후 울던 우이를 다독여준 뒤, 함께 방명록에 쓸 내용에 대한 잡담을 나누었다.)"
1003505-55 = "(……막상 대화 자체는 모모톡으로도 하고 있기에, 방문하고 읽은 책들에 대한 독후감 노트로 바뀌었다.)"
