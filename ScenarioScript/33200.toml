[translation]
33200-1 = "제20화;낙원의 이름 1"
33200-2 = "중앙으로 길이 열렸다. 우리는 이어서 서쪽을 친다."
33200-3 = "알겠어!"
33200-4 = "……제가 손을 거들어드리죠."
33200-5 = "하스미 씨……!"
33200-6 = "치나츠 씨. 그때 선생님을 도와서 샬레의 건물을 탈환한 이후로 전투를 함께 하는 건 오랜만이네요."
33200-7 = "키키킥……."
33200-8 = "크윽? 정의부 부장까지……."
33200-13 = "……알겠다. 신세를 지지."
33200-14 = "여어, 선도부장 쨩~ 우리도 도울게."
33200-15 = "……!! 아비도스 부회장……."
33200-16 = "이야, 호시노라고? 너무해, 저번에 한 번 붙을 뻔했잖아? 이름 정도는 외워달라고!"
33200-17 = "호시노 선배도 저쪽 이름 못 외운 거 아냐?"
33200-18 = "어…… 음. 뭐……."
33200-19 = "……잡담은 그만."
33200-21 = "간다."
33200-22 = "네!"
