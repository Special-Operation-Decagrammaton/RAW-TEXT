[translation]
90100070-1 = "第7話;正午的惡靈"
90100070-2 = "第3業務區第2地區"
90100070-4 = ""
90100070-5 = "這裡是FOX3。#n正在第一位受害者被發現的第3業務區第2地區進行探訪。"
90100070-6 = "第一位受害者是附近一間製藥公司的業務員，因此白天時也經常步行往返這一帶。"
90100070-7 = "不過除了玻璃窗反射陽光導致的刺眼之外，沒有看見會被誤認成白色稻草人的東西。"
90100070-8 = ""
90100070-11 = "甲種封閉區域內拆除現場"
90100070-12 = ""
90100070-13 = "這裡是FOX4。#n正在第三位受害者被發現的甲種封閉區域拆除現場進行搜索。"
90100070-14 = "第三位受害者是在拆除現場工作的工人。#n由於拆除現場的特性，似乎經常在沒有遮蔽物的空地上工作。"
90100070-15 = "現場到處都是被揚起的灰塵。#n別說白色稻草人了，連白色的東西都看不見。#n除了很熱之外沒有異常現象。"
90100070-16 = ""
90100070-19 = "月天場外市場"
90100070-20 = ""
90100070-21 = "這裡是FOX2。#n正在第六位受害者被發現的月天場外市場進行探訪。"
90100070-22 = "第六位受害者是在這裡的攤位販賣食物的商人。#n周圍的店家可能是因為天氣太熱都關門了，所以幾乎沒遇到什麼人。"
90100070-23 = "唔嗯……會不會是把穿白衣的觀光客誤認成稻草人了呢？"
90100070-24 = "除此之外，這裡好像也沒有什麼引人注目的地方。"
90100070-26 = "KV高速公路35號道路"
90100070-27 = ""
90100070-28 = "這裡是FOX1。#n正在第九位受害者被發現的KV高速公路35號道路進行搜索。"
90100070-29 = "聽說第九位受害者是D.U.道路管理局所屬的維修人員，在檢查橋樑時遭遇了事故。"
90100070-30 = "已經仔細確認過受害者被發現的橋樑底下了，但是……"
90100070-31 = ""
90100070-33 = ""
90100070-34 = "……果然還是不夠。"
90100070-35 = ""
90100070-37 = ""
90100070-38 = ""
90100070-39 = "什，什麼不夠？還需要再補充水分嗎？"
90100070-40 = "應該是指用來鎖定白色稻草人的線索不夠吧。"
90100070-41 = "求求你千萬別說要從第一個地區重新確認一遍這種話……"
90100070-42 = "但是──"
90100070-43 = ""
90100070-46 = "[ns1] 「嗨～這裡是夏萊EATS！」\n[ns2] 「我帶了冰涼的水和能量飲料來囉！」"
90100070-49 = "啊，老師……"
90100070-50 = "您是特地來這裡送飲料給我們的嗎？#n其實您這次也不必特地跟來的。"
90100070-51 = "[s3] 「因為感覺比想像中還要花時間。」\n[s4] 「是不是遇到什麼問題了……？」"
90100070-54 = "倒是沒有什麼大問題。#n只是缺乏能佐證受害者證詞的資訊……"
90100070-55 = "看來得再將搜索範圍擴大，重新展開探訪才行。"
90100070-56 = ""
90100070-58 = ""
90100070-59 = "嗚嗚嗚……"
90100070-60 = ""
90100070-61 = "[ns5] 「天氣這麼熱，不能晚點再調查嗎？」\n[ns6] 「至少等太陽下山後再開始也……」"
90100070-64 = "那……會有點傷腦筋。"
90100070-65 = "現場證據除了地點之外，也會隨著時間或天氣改變樣貌。"
90100070-66 = "既然受害者都是在直射陽光強烈的正午被發現，#n那麼即使在太陽下山之後進行探訪也沒有意義。"
90100070-67 = "那確實是蒐集證據最有效率的方式，不過要不要也稍微考慮一下隊員們的身體狀況？"
90100070-68 = "連續幾天都在大太陽底下作業，我想大家應該也都累了。"
90100070-69 = ""
90100070-71 = ""
90100070-72 = "……那就沒辦法了。"
90100070-73 = "大家先在附近休息吧。#n接下來的探訪就由我一個人──"
90100070-74 = "唉……"
90100070-75 = "你的老毛病又犯了。"
90100070-76 = "雪乃，你以為這樣說我們就可以安心休息嗎？#n還是你覺得我們是那種能對隊長的辛勞視若無睹的糟糕隊員？"
90100070-77 = "我，我不是那個意思……"
90100070-78 = "[ns7] 「聯邦學生會長也沒有特別訂下期限……」\n[ns8] 「要不要稍微放慢一下作戰的步調？」"
90100070-81 = "可是……在我們這麼僵持的當下，說不定又會出現新的受害者。"
90100070-82 = "要是因為我的怠慢，再次導致市民受到傷害……"
90100070-83 = "如果無法在那之前更快地做出判斷，並且承擔責任的話……"
90100070-84 = ""
90100070-86 = ""
90100070-87 = ""
90100070-88 = ""
90100070-89 = ""
90100070-90 = "等等，有個未知的對象正從高架橋交流道的方向朝這邊接近。"
90100070-91 = "從目標的動作和速度來看……好像是人？"
90100070-92 = "有人徒步橫越高架橋？#n道路管理局有預定要進行維修嗎？"
90100070-93 = "不。道路管理局的行程表上並沒有維修計畫。"
90100070-94 = "難道是傳說中的「白色稻草人」……"
90100070-95 = "在他消失到其他地方之前，我們趕快追上去看看吧。"
90100070-96 = ""
90100070-101 = ""
90100070-102 = ""
90100070-103 = "在那邊跑步的學生，就是你說的未知對象嗎？"
90100070-104 = "那個，不好意思……"
90100070-107 = ""
90100070-108 = "咦，這種地方怎麼會有人……？"
90100070-109 = "需要我幫忙嗎？"
90100070-110 = "不不不，看起來需要幫忙的應該是你那邊吧。"
90100070-111 = "這前面禁止行人通行。#n為了安全起見，建議你繞道而行。"
90100070-112 = "天氣這麼熱，你為什麼要走上這條危險的高架橋？"
90100070-113 = "要說目的的話，那當然是因為……"
90100070-114 = ""
90100070-116 = ""
90100070-117 = "正在進行道路研習囉！"
90100070-118 = "[s] 「那副打扮，是百鬼夜行聯合學園的……」"
90100070-119 = "咦，[USERNAME]老師？"
90100070-120 = "是的，我是百鬼夜行人力車部的淺草夏樹！#n自從上次祭典之後就沒見過您了呢！"
90100070-121 = "不介意的話……要不要搭乘人力車呢？"
90100070-122 = "現在的話無論要到D.U.內的任何地方，我都能用比計程車便宜的價格載您過去唷！"
90100070-123 = "[s9] 「人，人力車就不用了。」\n[s10] 「話說，我有事想問你……」"
90100070-127 = "所以……你是覺得可能會有客人想到自治區外，才會在高速公路上練習拉人力車嗎？"
90100070-128 = "是的。以最快的路線迅速將客人送達他們希望的目的地，這是載客運輸的基本原則！"
90100070-129 = "要是因為沒有事先熟悉地理環境而繞了遠路的話，可是會失去客人的信任的。"
90100070-130 = "嗯……有道理。#n我也有在計程車司機繞到不認識的路的時候，擔心車費會提高而感到不安的經驗。"
90100070-131 = "計程車跟人力車能相提並論嗎！？"
90100070-132 = "你說你叫夏樹醬對吧？#n不好意思，D.U.的高速公路上是禁止人力車通行的。#n恐怕得麻煩你繞別條路了。"
90100070-133 = "咦，真的嗎？"
90100070-134 = "嗚嗚……百鬼夜行才剛頒布禁止條例沒多久，沒想到就連D.U.也一樣。"
90100070-135 = "人力車進入高速公路很危險這種事，就算沒有條例也是常識吧……"
90100070-136 = "話說，真佩服你在這種天氣還想在高速公路上奔跑耶。#n這種熱度就算是運動選手，跑上大半天的話也會頭暈的。"
90100070-137 = "天氣是有點熱沒錯……不過沒問題！#n對於拉人力車的車伕來說，這已經是家常便飯了。"
90100070-138 = "因為人力車行駛的柏油路會直接反射熱氣，我很習慣在平均氣溫更高的地方奔跑。"
90100070-139 = "跟旺季的盛夏比起來，現在反而還算涼爽的呢！"
90100070-140 = "[s11] 「不過還是要小心中暑哦。」\n[s12] 「來，這是冰涼的飲料。夏樹醬也喝一瓶吧。」"
90100070-143 = "啊……謝謝您。"
90100070-144 = "居然在意想不到的地方收到夏萊老師招待的飲料……今天運氣真好呢。"
90100070-145 = ""
90100070-147 = ""
90100070-148 = ""
90100070-149 = "既然你說自己常常在沒有遮蔽物的炎熱道路上奔跑，我有件事想問你……"
90100070-150 = "你有沒有在路邊看過可疑的「白色稻草人」？"
90100070-151 = "白色稻草人……？"
90100070-152 = "嗯。如果要說有什麼共通點，就只有目擊者全都失去意識、引發痙攣而已……"
90100070-153 = "你說的那個，該不會是「扭來扭去」吧？"
90100070-154 = "扭來扭去……？"
90100070-155 = "啊。不過扭來扭去通常是在鄉下的田地裡被目擊，#n我從來沒聽說有人在遍布建築物的都市中心看到它……"
90100070-156 = "什麼都行。那個扭來扭去是什麼？"
90100070-157 = "抱歉對各位認真的提問給出胡鬧的回答……#n不過扭來扭去是百鬼夜行自治區內有名的一個都市傳說。"
90100070-158 = "這是相當近期才開始流行起來的怪談──#n和其他氛圍陰森的怪異不同，扭來扭去經常在晴朗且視野開闊的草原上被發現。"
90100070-159 = "從遠處看起來就像正在跳舞的白色稻草人，#n不過實際上沒有人知道它的真面目究竟是人還是稻草人。"
90100070-160 = "因為凡是走近看清它真面目的人全都會發瘋，變得和扭來扭去一樣。"
90100070-161 = "臉上掛著詭異的微笑，扭啊扭地……"
90100070-162 = "聽起來也太可怕了吧。"
90100070-163 = "畢竟是怪談嘛。就算是在百鬼夜行，會認真相信那種說法的人應該也幾乎沒有吧？#n除了我們這種人力車伕之外。"
90100070-164 = "嗯？所以夏樹同學相信扭來扭去的存在囉？"
90100070-165 = "與其說是相信怪談……不如說是能理解怪談會傳開的來龍去脈吧。"
90100070-167 = "你們想，在大熱天走在柏油路上的時候，從地上升起的陽炎……#n看起來不就像是扭來扭去的白色煙霧嗎？"
90100070-168 = "通常那種日子的氣溫會比平時還高，要是勉強拉人力車的話可是會中暑的。"
90100070-169 = "所以「如果在地平線附近看到扭動的『白色稻草人』就回家去」這句話，#n說不定意外地是很有常識的忠告呢。"
90100070-171 = ""
90100070-172 = "陽炎……"
90100070-173 = "……原來如此，是陽炎啊。"
90100070-174 = "謝謝。你幫了我們很大的忙。"
90100070-175 = "咦，咦……？#n不，不用客氣。"
