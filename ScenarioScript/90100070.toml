[translation]
90100070-1 = "Episode 7;High Noon and the Revenant"
90100070-2 = "Business District 3, Area 2"
90100070-4 = ""
90100070-5 = "FOX 3, on the line. I'm currently investigating Business District 3, Area 2. This is where the first victim was discovered."
90100070-6 = "They worked as a sales rep at a nearby pharmaceutical company. That explains why they were in this area in the middle of the day."
90100070-7 = "Aside from the glare reflecting off the sides of several glass buildings, I don't see anything that could be mistaken for a white scarecrow."
90100070-8 = ""
90100070-11 = "A-Class Closed Zone Demolition Site"
90100070-12 = ""
90100070-13 = "This is FOX 4. Currently investigating the A-Class Closed Zone's demolition site. The third victim was discovered here."
90100070-14 = "They worked as a construction worker, and it appears that the victim often had to work in open, unshaded areas."
90100070-15 = "The site is covered in dust. I don't see anything white, let alone shaped like a scarecrow. No anomalies other than the fact that it is insanely hot, over."
90100070-16 = ""
90100070-19 = "Tsukiten Outer Market"
90100070-20 = ""
90100070-21 = "FOX 2, present. Currently gathering data at the Tsukiten Outer Market. The sixth victim was recovered here."
90100070-22 = "They were a vendor at one of the street's food stalls. Shops nearby were closed on the day of the incident, likely due to the heatwave."
90100070-23 = "Hmm... Maybe they thought a tourist wearing white clothes was a scarecrow?"
90100070-24 = "Aside from that speculation, there's nothing notable here, either."
90100070-26 = "KV Highway Road 35"
90100070-27 = ""
90100070-28 = "FOX 1, reporting in. Currently searching KV Highway Road 35, where the ninth victim was found."
90100070-29 = "They were a D.U. Highway Administration engineer. Their \"incident\" occurred while they were inspecting the bridge."
90100070-30 = "I thoroughly checked the area under the bridge, where the victim was recovered..."
90100070-31 = ""
90100070-33 = ""
90100070-34 = "...It's still not enough."
90100070-35 = ""
90100070-37 = ""
90100070-38 = ""
90100070-39 = "Wh-What's \"not enough\"? Are you getting tired? Do you need a drink?"
90100070-40 = "She probably means we don't have enough clues to pinpoint the white scarecrow."
90100070-41 = "Just don't tell us we have to go over everything again..."
90100070-42 = "But—"
90100070-43 = ""
90100070-46 = "[ns1] \"Hello, this is Schale EATS!\"\n[ns2] \"I brought cold water and energy drinks!\""
90100070-49 = "Ah, Sensei..."
90100070-50 = "You came all the way here to bring us refreshments? You didn't have to do that."
90100070-51 = "[s3] \"This seems to be taking a while.\"\n[s4] \"Is there a problem...?\""
90100070-54 = "Nothing dire. We simply lack evidence. We're unable to corroborate the victims' testimonies."
90100070-55 = "We'll have to expand the investigation area."
90100070-56 = ""
90100070-58 = ""
90100070-59 = "Ugh..."
90100070-60 = ""
90100070-61 = "[ns5] \"It's scorching right now. Can't you do that later?\"\n[ns6] \"After the sun sets, at least...\""
90100070-64 = "That...would be troublesome."
90100070-65 = "On-site evidence is dependent not only on a precise location, but a precise climate."
90100070-66 = "The victims were all discovered in the middle of the day under intense direct sunlight. It would be pointless to work at night."
90100070-67 = "While I agree, could we possibly take into consideration the condition of the squad members?"
90100070-68 = "Everyone's exhausted. We've been working in the sun for days now."
90100070-69 = ""
90100070-71 = ""
90100070-72 = "...Very well."
90100070-73 = "Team, rest and recuperate nearby. I will run the next investigation solo."
90100070-74 = "*sigh*"
90100070-75 = "Old habits die hard."
90100070-76 = "Yukino, get real. Do you really think we can kick up our legs and relax if you do that? What kind of uncaring squadmates do you think we are?"
90100070-77 = "I-I did not intend to make you feel guilty."
90100070-78 = "[ns7] \"You're not working on a strict deadline...\"\n[ns8] \"Why don't we take our time with this mission?\""
90100070-81 = "But...what if someone's about to get hurt? What if there's another victim?"
90100070-82 = "If another civilian is hurt because of my negligence..."
90100070-83 = "If I can't take action and responsibility quickly enough..."
90100070-84 = ""
90100070-86 = ""
90100070-87 = ""
90100070-88 = ""
90100070-89 = ""
90100070-90 = "Hold it. An unidentified presence is incoming. They're heading from the overpass interchange."
90100070-91 = "Based on the target's movement and speed... It could be a person."
90100070-92 = "Someone's running across this long overpass? Is the Highway Administration doing maintenance?"
90100070-93 = "Not according to the schedule..."
90100070-94 = "Then could this be our \"white scarecrow\"...?"
90100070-95 = "Let's close in."
90100070-96 = ""
90100070-101 = ""
90100070-102 = ""
90100070-103 = "A student? Do you think she's...?"
90100070-104 = "Um, pardon us..."
90100070-107 = ""
90100070-108 = "Oh, there's someone here?"
90100070-109 = "Do you need help with something?"
90100070-110 = "No, no, no. I think you're the one who needs help."
90100070-111 = "Pedestrian traffic is prohibited here. We recommend taking a detour for your safety."
90100070-112 = "What are you doing on the overpass on a day like this? It's dangerous!"
90100070-113 = "What do you mean \"what\"? Clearly, I'm..."
90100070-114 = ""
90100070-116 = ""
90100070-117 = "...in the middle of on-road training!"
90100070-118 = "[s] \"Isn't that outfit Hyakkiyako's...\""
90100070-119 = "Wait, [USERNAME] Sensei?"
90100070-120 = "Yeah! It's me! Asakusa Natsuki, from the Rickshaw Club! It's been a while! You've missed a few festivals!"
90100070-121 = "If you don't mind the bumps... Would you like a rickshaw ride?"
90100070-122 = "I can get you anywhere in D.U. for way cheaper than a taxi."
90100070-123 = "[s9] \"R-Rickshaws are great.\"\n[s10] \"But, for now, I wanted to ask...\""
90100070-127 = "So... You're practicing pulling a rickshaw on the highway because you want to expand your network? You want to pull people OUTSIDE the district?"
90100070-128 = "That's right! Because I need to know how to get my customers to where they need to go. And that means getting out here and finding the fastest routes."
90100070-129 = "You'll lose a customer's trust if you stick to official roads, after all. Or worse, get lost!"
90100070-130 = "Huh... Well. Sure. I always feel nervous when a taxi driver takes a sudden detour. Sometimes I worry they're just running up the fare."
90100070-131 = "A taxi is NOT a rickshaw!"
90100070-132 = "Natsuki? I hate to break this to you, but rickshaws are banned on D.U. highways. I'm afraid you'll have to take a different route."
90100070-133 = "Eh, really?"
90100070-134 = "Ugh... Hyakkiyako banned them too. I thought things would be different in D.U., yeah?"
90100070-135 = "Regardless of the bans, you could use some common sense. How's a rickshaw supposed to merge on a highway?"
90100070-136 = "I'm more surprised that you're out HERE pulling THAT MUCH in this heat. Even athletes couldn't survive this weather."
90100070-137 = "It's a bit hot...but I'm okay! This is just another day for a rickshaw driver."
90100070-138 = "We're accustomed to running on paved roads loaded with radiant heat. You get used to the hot temperatures."
90100070-139 = "In fact, this is mild compared to our peak season in midsummer!"
90100070-140 = "[s11] \"Please watch out for heatstroke.\"\n[s12] \"Here, take a drink with you.\""
90100070-143 = "Ah... Thank you."
90100070-144 = "Getting a cold drink from Schale's Sensei... Sounds like it's my lucky day!"
90100070-145 = ""
90100070-147 = ""
90100070-148 = ""
90100070-149 = "Speaking of running on hot roads with no shade, I'd like to ask you something."
90100070-150 = "Have you witnessed a suspicious \"white scarecrow\" around the roads?"
90100070-151 = "A white scarecrow...? Like, from a field?"
90100070-152 = "Yes. We've heard that a white scarecrow has been spotted in the area. It makes people faint and have convulsions."
90100070-153 = "Oh, are you sure you're not talking about a kunekune?"
90100070-154 = "A \"kunekune\"...?"
90100070-155 = "It'd be pretty strange, though. kunekune hang near rice paddies, like out in the country. I don't think one would be here..."
90100070-156 = "Humor me. What is this \"kunekune\"?"
90100070-157 = "You seem so serious, so I know this'll sound silly. The kunekune is a bit of an urban legend. It's more of a Hyakkiyako thing."
90100070-158 = "The story's been catching fire recently. What's interesting is that, unlike most ghoulies, it doesn't haunt at night. It shows up in open grasslands on clear days."
90100070-159 = "From a distance, it looks like a dancing white scarecrow. But no one's gotten close enough to be sure WHAT it is."
90100070-160 = "...Because they say that to see its true form will make you go crazy. You'll become LIKE the kunekune."
90100070-161 = "Just lying on the floor squirming, with a creepy smile..."
90100070-162 = "What the...? That's horrifying."
90100070-163 = "Many urban legends are! No one in Hyakkiyako takes it too seriously—except rickshaw drivers."
90100070-164 = "Hm? Natsuki, does that mean that you believe in the kunekune?"
90100070-165 = "Rather than saying I believe in the legend itself... It's more like I can see how someone got the idea."
90100070-167 = "You know how the rising haze sometimes looks like squirming white smoke? How, from a distance, the asphalt looks squiggly on a really hot day?"
90100070-168 = "Temperatures tend to be dangerously high on days like that. You might get sick if you don't pace yourself on the rickshaw."
90100070-169 = "So telling people that they should head back home if they see a squirming \"white scarecrow\" near the horizon might be surprisingly helpful advice."
90100070-171 = ""
90100070-172 = "Haze..."
90100070-173 = "...I see. It was haze."
90100070-174 = "Thank you. You helped immensely."
90100070-175 = "I-Is that so...? Well, you're certainly welcome."
90100070-176 = ""
90100070-178 = ""
90100070-179 = ""
90100070-180 = "[USERNAME] Sensei. We will immediately return to HQ. Today's investigation is concluded."
90100070-181 = "[s] \"Y-Yeah. Let's head back.\""
90100070-182 = ""
90100070-184 = ""
90100070-185 = ""
90100070-186 = "[ns] \"Thanks, Natsuki. Stay cool and take care!\" "
90100070-187 = "Yes, you too! All of you, be well!"
90100070-188 = ""
90100070-193 = ""
90100070-194 = "Hmm. Those sailor girls looked familiar."
90100070-195 = "Maybe they took leave at Allied Hyakkiyako Academy once upon a time..."
90100070-197 = "Next Episode;Beyond the Haze"
