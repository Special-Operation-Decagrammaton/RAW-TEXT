[translation]
10036020-1 = "제2화;그 스쿼드의 사정"
10036020-3 = "어려운 부탁을 들어줘서 고마워, 선생님. 덕분에 이런 먼 곳까지 올 수 있었네."
10036020-4 = "무법자 해변이라니, 이런 곳이 있을 줄은 몰랐어."
10036020-5 = "늘 숨어 다녔는데, 이렇게 당당하게 걸어도 된다니 뭔가 어색한걸."
10036020-6 = "게다가 축제라니. 마치 다른 세상에 온 것만 같아."
10036020-8 = "그, 그치만 우리한테 이렇게 쉽게 행복이 허락될 리가 없어요……!"
10036020-9 = "서, 설마 이 해변 전체가 발키리의 거대한 함정수사는 아니겠죠?"
10036020-10 = "맞아요! 축제를 연다는 구실로 무법자들을 잔뜩 모아 놓고 일망타진하려는 게 확실해요!"
10036020-11 = "망했어요! 결국 꼬부랑 할머니가 될 때까지 교정국의 어두컴컴한 감옥에 갇히고 말 거예요!"
10036020-12 = "선생님이 사 주신 이 아이스크림이 최후의 만찬이 되겠네요……."
10036020-13 = "[s] \"자, 자, 히요리, 너무 걱정하지 말고…….\""
10036020-17 = "이곳에서 헬멧단 주최의 축제가 열린다는 건 확실한 정보야."
10036020-18 = "정확히는 <헬멧단 총연합회>라고 하던데…… 규모도 상당하고, 준비한 것도 많아 보여."
10036020-19 = "내가 알기로는, 발키리가 이만큼의 규모로 함정수사를 벌일 여력은 없어."
10036020-20 = "그, 그런가요? 마음을 놓아도 되는 건가요?"
10036020-21 = "……뭐, 일단은."
10036020-23 = "응, 선생님이 우리를 위험한 곳에 데려다주었을 리는 없으니까."
10036020-24 = "그렇지, 선생님?"
10036020-25 = "[s] \"물론이지.\""
10036020-26 = "후훗, 역시 믿음직스럽네."
10036020-27 = "[s1] \"모처럼이니까, 모두들 축제를 즐겼으면 좋겠어.\"\n[s2] \"아츠코도, 히요리도, 미사키도.\""
10036020-30 = "고마워, 선생님. 같이 축제를 즐기자. 사진도 많이 찍고."
10036020-31 = "헤, 헤헤, 그러면 바다의 집에서 야끼소바랑 옥수수를 먹을 수밖에 없네요…… 앗, 그럼 어쩔 수 없이 후식으로 빙수까지 먹어야겠네요…… 헤헤."
10036020-32 = "시끌벅적한 분위기는 좋아하지 않는 데다, 축제에 그다지 관심도 없지만……."
10036020-33 = "아츠코와 히요리가 좋아한다면, 어울려주는 수밖에."
10036020-34 = "히요리가 말한 바다의 집 말고도 모래성 콘테스트, 물총 서바이벌 게임, DJ 공연이 준비되어 있다고 해."
10036020-35 = "[s] \"관심 없는 것 치고는 자세하게 조사해 왔는데?\""
10036020-36 = "지금은 내가 스쿼드의 임시 리더니까, 철저히 한 것뿐이야."
10036020-40 = "……그러니까 그렇게 히죽거리지 마! 아츠코도!"
10036020-41 = "후훗, 미사키도 함께 즐기자?"
10036020-42 = "큭……."
10036020-43 = "[s3] \"우선 적당히 돌아다녀 볼까?\"\n[s4] \"우선 축제장을 한 바퀴 돌아볼까?\""
10036020-46 = "응, 가자, 선생님."
10036020-47 = "헤헤…… 드디어 축제네요……."
10036020-48 = "……하아."
10036020-51 = "야외 식당이네. 좋은 냄새가 나는걸. 맛있는 요리가 잔뜩 있는 것 같아."
10036020-52 = "선생님, 어때? 여기서 음식을 맛볼까?"
10036020-53 = "[s] \"좋아. 미사키와 히요리는 어때?\""
10036020-54 = "저, 저도 좋아요! 헤헤, 드디어 맛있는 음식을……."
10036020-55 = "……잠깐만."
10036020-59 = "왜 그래, 미사키? 눈을 비벼대고……."
10036020-60 = "……잘못 본 게 아니었어."
10036020-61 = "아츠코, 히요리, 저길 봐. 테이블 사이에서 서빙하는 사람……!"
10036020-63 = "여기 주문한 음식이다. 토스트와 계란프라이. 맛있게 먹…… 아니, 맛있게 드세요."
10036020-64 = "응? 난 분명 노른자를 반숙으로 해 달라고 했는데, 이건 다 익었잖아!"
10036020-65 = "퍽퍽해서 못 먹어! 주문한 대로 바꿔 줘!"
10036020-66 = "뭣, 그랬나?! 미안하다, 조금만 기다려라!"
10036020-67 = "여기는 시킨 지 30분이 지났는데도 음식이 안 나오는데요! 배고파 죽겠어요!"
10036020-68 = "그, 그쪽도 조치하겠다!"
10036020-69 = "여기는 음식이 잘못 나온 것 같은데요!"
10036020-70 = "미안하다! 바로 가겠다!"
10036020-82 = "삿 쨩이다……."
10036020-87 = "사오리 언니가 어째서 여기에……? 게다가 저 모습은 대체……."
10036020-88 = "[s] \"사오리가 여기 있을 줄이야…….\""
10036020-89 = "……."
10036020-90 = "나 참, 여기서 뭐 하는 거야……."
10036020-91 = "사오—"
10036020-97 = "으읍?!"
10036020-98 = "쉿, 잠깐, 두 사람 모두 조용히 하고, 여기 기둥 뒤로 숨어."
10036020-99 = "선생님도 같이야."
10036020-103 = "[ns5] \"무슨 일이야, 아츠코?\"\n[ns6] \"드, 들키면 안 되는 거야?!\""
10036020-107 = "……방해하면 안 된다고 생각해."
10036020-108 = "조마에 사오리 씨는 지금, 자아 찾기 중이니까."
10036020-110 = "저게요? 그냥 요령이 없어서 허둥지둥하는 것처럼 보이는데요……?"
10036020-111 = "……."
10036020-113 = "응, 서툴러 보여도, 절찬리에 자신을 찾아가는 중."
10036020-114 = "땀흘려 일하고, 진지하게 자기 자신을 마주하면서."
10036020-115 = "그런 삿 쨩을, 우리가 방해하면 안 될 것 같아."
10036020-117 = "그치만 인사 정도는 괜찮지 않을까요……? 이렇게 만난 것도 신기하니까……."
10036020-119 = "아니, 우리들이 나타나면 신경을 쓸 수밖에 없을 거야. 삿 쨩은 상냥하니까."
10036020-120 = "그러니까, 삿 쨩이 온전히 자기 자신에게 집중할 수 있도록 우리는 멀리서 지켜봐 주자."
10036020-122 = "네, 네에…… 그렇네요…… 사오리 언니, 지금도 엄청 정신없이 일하고 있고……."
10036020-123 = "……뭐, 가만히 놔둬도 충분히 고생하는 것 같으니까."
10036020-125 = "선생님은 어떻게 생각해?"
10036020-126 = "[s] \"모두가 그렇게 생각한다면, 나도 몸을 숨길게.\""
10036020-127 = "후후, 꼭 비밀작전 같네."
10036020-128 = "대신, 이왕 이렇게 만난 거 그냥 가기엔 어딘가 아쉬우니까, 일하는 삿 쨩의 모습을 간직할래."
10036020-130 = "리더한테 들키지 않는 거 아니었어?"
10036020-132 = "응, 그러니까 이렇게 식당 쪽으로 살짝……."
10036020-133 = "[s] \"그러다 들키겠는데…….\""
10036020-134 = "삿 쨩의 이런 모습, 엄청 레어한걸. 후후."
10036020-135 = "그럼, 찍는다."
10036020-140 = "치—즈. 후후, 삿 쨩, 바빠 보이네."
10036020-141 = "이, 이러다가 들키면…… 사오리 언니, 완전 화내는 거 아닐까요……?"
10036020-142 = "내려면 내 보라지."
10036020-143 = "어디 보자."
10036020-144 = "응, 삿 쨩의 표정, 생생해."
10036020-145 = "생각보다 잘 나왔네요……."
10036020-146 = "낡은 카메라지만 기능은 괜찮은 모양이야."
10036020-148 = "물론이지. 해변에 놀러 간다는 말을 듣고 블랙마켓에서 부품을 하나둘 모아서 장만한 물건이라구."
10036020-149 = "제대로 작동해 주지 않으면 안 돼."
10036020-150 = "해변에서 사진으로 추억 남기기라니, 헤, 헤헤, 우리한테는 과분한 사치네요……."
10036020-151 = "자, 자, 일단 여기를 벗어나자."
10036020-152 = "오래 있으면 삿 쨩이 우리를 발견할지도 몰라."
10036020-153 = "알겠어."
10036020-154 = "네, 네에……!"
10036020-159 = "……선생님."
10036020-160 = "[s] \"응?\""
10036020-161 = "역시, 도와주고 싶어."
10036020-162 = "직접 가서 거들지는 못하겠지만, 그래도…… 최소한, 사오리가 이 축제에서 즐거웠으면 해."
10036020-163 = "같이 있을 때는 언제나 고생만 했으니까, 삿 쨩의 여름을 지켜주고 싶어."
10036020-164 = "말하자면…… 응, 마니또 같은 것이려나."
10036020-165 = "[s] \"오랜만에 들어보네, 그 단어…….\""
10036020-166 = "응? 최근에 배운 단어인걸. 수호천사 같은 거라고 들었어."
10036020-167 = "그러니까 선생님, 도와줄 수 있어?"
10036020-168 = "[s] \"물론이지. 방법을 찾아보자.\""
10036020-169 = "고마워, 역시 선생님이라면 도와줄 줄 알았어."
10036020-170 = "자, 이제 얼른 가자. 미사키와 히요리가 기다리겠어."
10036020-172 = "(이후 아츠코, 미사키, 히요리와 함께 축제장을 돌아다니다가…….)"
10036020-173 = "(어디선가 지갑을 떨어뜨렸다는 사실을 알아차렸다.)"
10036020-176 = "[ns] \"이런, 아까 이쯤에서 떨어뜨린 것 같은데…….\""
10036020-186 = "[ns] \"안 보이네…….\""
10036020-188 = "이봐, 혹시 이걸 찾나?"
10036020-189 = "[s] \"?\""
10036020-191 = "아까 일하다가 이 부근에서 지갑을 주웠다만…… 뭔가 애타게 찾아다니는 것 같아서 말이다."
10036020-192 = "내 생각으로는 아마 찾고 있는 게—"
10036020-196 = "[ns] \"사, 사오리?!\""
10036020-197 = "[USERNAME] 선생……! 어떻게 여기에?"
10036020-198 = "[s] \"그, 그게…… 사정이 좀…….\""
10036020-199 = "그렇군. 하긴 선생이니 필시 해변에서 다치는 학생이 없을까 순찰이라도 돌고 있던 거겠지."
10036020-200 = "의외지만 있을 수 없는 일은 아니겠어."
10036020-201 = "아무튼 반갑다, 선생. 잘 지냈나?"
10036020-202 = "[s] \"응, 사오리도 잘 지내고 있는 것 같네.\""
10036020-203 = "선생이 신경 써 준 덕분이다."
10036020-204 = "선생에게 배운 대로 최근엔 이런저런 의뢰를 받아서, 그걸 해결하며 지내고 있다."
10036020-205 = "<무법자 해변>에 온 것도 의뢰를 받은 덕분이지."
10036020-206 = "그건 그렇고—"
10036020-210 = "……!"
10036020-211 = "선생, 잠시 이쪽으로!"
10036020-229 = "……지나간 것 같군."
10036020-230 = "갑자기 끌어당겨서 미안하다, 선생."
10036020-231 = "[s7] (앗, 사오리도 애들을 발견해 버렸네…….)\n[s8] \"역시…… 숨는 거야?\""
10036020-234 = "아츠코, 미사키, 히요리…… 아이들의 얼굴을 본 건 오랜만이야."
10036020-235 = "반갑지 않은 건 아니다. 아니, 오히려 다가가서 인사하고, 안부도 나누고 싶어."
10036020-236 = "……허나 내게 그럴 자격은 없겠지."
10036020-237 = "[s] \"…….\""
10036020-238 = "선생이 굳이 말로 하지 않아도 알고 있다. 자격 같은 건 중요하지 않다고 말하겠지."
10036020-239 = "하지만…… 난, 아직 준비가 되지 않았다고 생각한다."
10036020-240 = "이런 떳떳하지 못한 상태로 저 아이들 앞에 설 용기가…… 내게는 없어."
10036020-241 = "아츠코와 미사키와 히요리가 나를 받아들여 준다고 해도— 아니, 그 아이들이라면 분명 나를 받아들여 주겠지만,"
10036020-242 = "아무 일도 없었다는 듯 나타나는 건…… 역시 나 자신이 허락할 수 없어."
10036020-243 = "그러니 만남은…… 역시 다음으로, 조금 더 훗날로 미루고 싶은 마음이다."
10036020-244 = "……이조차도 결국엔 나의 욕심일 뿐이겠지만."
10036020-245 = "이래서야…… 못났다고 손가락질 받더라도 할 말이 없겠지."
10036020-246 = "[s] \"사오리…….\""
10036020-247 = "……그러니 선생, 염치없지만 부탁이 하나 있다."
10036020-248 = "[s] \"부탁?\""
10036020-249 = "아츠코와 미사키, 히요리…… 아이들 모두, 바다는 이번이 처음이겠지."
10036020-250 = "선생도 알다시피, 아리우스 학원에 있던 시절 이런 곳은 말로만 들었을 뿐이니까."
10036020-251 = "그러니까…… 아이들의 여름을 지켜주고 싶다."
10036020-252 = "맛있는 것도 먹고, 뛰놀고……아, 게다가 DJ공연도 있다."
10036020-253 = "헬멧단이 꽤나 공들여 준비한 축제니까, 분명 재미있을 거다."
10036020-254 = "그러니, 아츠코와 미사키와 히요리가 부디 여름을 즐길 수 있게 해 줘."
10036020-255 = "선생에게는 이미 신세를 많이 졌지만, 지금은 역시 선생밖에 도움을 청할 사람이 없다."
10036020-256 = "모습을 드러내지 않는 선에서라면 나도 힘껏 돕겠다."
10036020-257 = "아이들이 즐길 축제 준비도 빈틈없이 하겠어. 그러니……."
10036020-258 = "[s9] \"알겠어.\"\n[s10] \"사오리의 부탁을 거절하는 선택지는 없다고.\""
10036020-261 = "고맙다, 선생. 이 은혜는 잊지 않겠어."
10036020-262 = "이봐! 쉬는 시간 끝났는데 어디 간 거야!"
10036020-263 = "미안하다, 선생, 좀 더 이야기하고 싶지만……."
10036020-264 = "[s] \"괜찮아. 사오리가 필요할 때 연락할게.\""
10036020-265 = "응, 고맙다, 선생."
10036020-274 = "아이들도 아이들이지만…… 선생도 축제를 즐겨 줬으면 한다."
