[translation]
2001906-1 = "Case 4. 일일 비서, 대령했습니다."
2001906-7 = "(업무와의 사투도 7할을 넘겨 가는 무렵……)"
2001906-11 = "(잠시 숨을 돌리기 위해 기지개를 켰다.)"
2001906-15 = "[ns] \"누가 커피 한 잔만 만들어 주지 않으려나……\""
2001906-19 = "네, 여기 커피입니다. 주인님."
2001906-23 = "(그렇게 중얼거린 순간, 불쑥, 하고 커피가 내어져 왔다.)"
2001906-24 = "[ns] \"음. 고마워.\""
2001906-30 = "(설탕도 우유도 들어가 있지 않은 블랙이었다.)"
2001906-31 = "(쓴맛과 산미가 어우러진 내 취향의 맛이다.)"
2001906-32 = "(졸음과 피로를 날려버리기에는 딱 좋은 커피였다.)"
2001906-37 = "어떠셨나요, 주인님?"
2001906-38 = "[s] \"완벽한 커피였어.\""
2001906-39 = "후훗, 도움이 되어서 저도 기뻐요."
2001906-40 = "[s] \"아카네에게는 언제나 감사하고 있어.\""
2001906-41 = "감사합니다."
2001906-42 = "그렇게 말씀해 주시면, 저는……"
2001906-46 = "[ns] \"음, 어라……?\""
2001906-49 = "[ns] \"아카네에에에에에에에?!\""
2001906-52 = "네, 주인님을 위해 언제든지 봉사하는 바니걸 아카네랍니다?"
2001906-53 = "뿅뿅."
2001906-56 = "후훗…. 그렇게까지 놀라실 줄은."
2001906-57 = "그게, 사실은 주인님께서 철야 작업을 한다는 소식을 들어서 말이죠…."
2001906-58 = "제가 어떻게 도움이 되어 드릴 수 없을지 고민하다가……"
2001906-59 = "오늘은 주인님의 비서 역할을 하는 바니걸이 되어 드리기로 했답니다!"
2001906-60 = "자, 뭐든 시켜만 주세요, 주인님!"
2001906-61 = "몸의 준비든 마음의 준비든, 모두 만전이니까요!"
2001906-65 = "[ns1] \"고맙긴 한데……\"\n[ns2] \"요즘 계속 그 모습인 것 같은데, 마음에 들었어?\""
2001906-68 = "네, 네?"
2001906-69 = "저…… 그렇게 느끼셨나요?"
2001906-70 = "아하하, 그런 느낌을 받으셔도 어쩔 수 없다고 생각이 드네요. 네."
2001906-71 = "최근 이 복장이 아닌 모습을 주인님께 보여 드린 적도 없었고…."
2001906-72 = "이유를 물어도 되냐구요?"
2001906-73 = "우으…… 제 입으로 말씀드리기엔 조금 부끄럽네요."
2001906-74 = "[s] \"혹시, 토끼를 좋아하는 거야?\""
2001906-75 = "그런 건, 아니에요. 아니랍니다."
2001906-76 = "단지 조금…… 주인님이 절……"
2001906-77 = "보아, 주셨으면, 해서……"
2001906-78 = "[s] \"혹시, 나에게 바니걸 모습을 봐 줬으면 했다던가……?\""
2001906-82 = "어, 어떻게 아신 거죠?"
2001906-83 = "아우우, 이런 건 예상 밖이에요. 어떡하죠?"
2001906-84 = "…이렇게 된 이상, 숨겨도…… 소용없겠죠……?"
2001906-85 = "네…… 거의, 정답…… 이세요."
2001906-86 = "[s] \"그런 건 신경 안 써도 되는데.\""
2001906-90 = "역시…… 그렇게 말씀해 주시는군요."
2001906-91 = "감사합니다, 주인님."
2001906-92 = "하지만 전…… 주인님께 봉사하는 자로서의 신선한 모습을 보여 드리고 싶었어요."
2001906-93 = "[s] \"그래서 바니걸 복장을 입은 거고?\""
2001906-94 = "네…… 또 다른 의미의, 봉사하는 옷이니까요."
2001906-95 = "이상했나요? 마음에 드시지 않으셨나요?"
2001906-96 = "[s3] \"이상하다니, 그럴리가.\"\n[s4] \"귀여웠어!\""
2001906-101 = "……다시 한번 감사드려요. 주인님."
2001906-102 = "주인님께 도움이 될 수 있었다면…… 저는 그것으로 충분했을 텐데…."
2001906-103 = "[s] \"아카네는 어떤 모습을 하고 있어도 아카네야.\""
2001906-104 = "그렇게 생각해도…… 될까요?"
2001906-110 = "저, 조금 더 자신을 가져도 되는 걸까요?"
2001906-113 = "[wa:1100]― 죄송합니다."
2001906-115 = "[wa:200]― 이런 생각, [wa:1400]메이드로서는 [wa:1100]실격일 텐데."
2001906-118 = "[wa:50]― 저는 [wa:1300]자신감을 잃고 있었어요."
2001906-121 = "[wa:1200]― 주인님은 [wa:1700]늘 많은 것을 [wa:1000]짊어지시고,"
2001906-123 = "― 그러신데도 [wa:1200]괜찮다며 웃으시고."
2001906-126 = "[wa:1000]― 저는…… [wa:1250]전혀 그 짐을"
2001906-128 = "― 대신해서 [wa:300]들어드리지 못하고……"
2001906-131 = "[wa:950]― 그렇지만 [wa:1300]주인님의 대답으로,"
2001906-133 = "― 다시 [wa:350]자신감을 찾을 수 있을 것 같아요."
2001906-136 = "[wa:950]― 앞으로도, [wa:900]부족한 몸이지만[wa:600]"
2001906-138 = "[wa:200]― 아무쪼록 [wa:1150]잘 부탁드립니다."
2001906-141 = "― 주인님."
2001906-144 = "자, 그러면 다시 업무를 시작해 볼까요?"
2001906-145 = "청소, 빨래, 요리, 간식 준비, 번거로운 서류 처리까지."
2001906-146 = "무엇이든 말씀해 주세요!"
2001906-147 = "C&C의 메이드가 얼마나 유능한지, 다시 한번 보여 드릴 테니까요!"
2001906-148 = "뿅뿅!"
2001906-150 = "(그 후, 아카네에게 여러 가지의 봉사를 받으며 철야 근무를 무사히 마쳤다.)"
