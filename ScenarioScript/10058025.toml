[translation]
10058025-3 = "이게 무슨 일이야 대체?! 왜 우리를 쏘는 거야?!"
10058025-4 = "낸들 알아?! 갑자기 다들 미쳤나 봐!"
10058025-5 = "꺄악!!"
10058025-8 = "내 킬마크로 삼아주마!!"
10058025-9 = "쏘지 마세요!! 쏘지 마세요!! 으아앙!"
10058025-10 = "이거 반칙 아니야?! 갑자기 왜 쏘는 거냐구!!"
10058025-11 = "괜히 저항하지 말고 얌전히……."
10058025-14 = "응?"
10058025-18 = "끄악!!!!"
10058025-24 = "……."
10058025-25 = "……."
10058025-26 = "허, 허억……."
10058025-27 = "구호가 필요한 곳에 구호를!!"
10058025-29 = "이동식야전병원이 이제부터 여러분 모두를 구호하겠습니다!"
10058025-30 = "슬픕니다……. 저는 진심으로 슬픕니다! 타인에게 이유 없이 불필요한 폭력을 행사하는 이 광경……."
10058025-31 = "이것이야말로 구호가 필요한 자리!"
10058025-32 = "구호기사단은 그런 여러분 모두에게, 신념과 긍지로 기사단의 의지를 전해드리도록 하겠습니다!"
10058025-33 = "영-차! 장전했어요, 단장님!"
10058025-34 = "훌륭합니다, 세리나! 하나에, 다음 구호가 필요하신 분은 어디에 계신가요!"
10058025-35 = "사방에 계세요!"
10058025-36 = "더 가까이 몰아주세요! 저를 구호의 현장으로!"
10058025-44 = "앞에 있던 전차, 저 멀리 날아가 버렸어!!"
10058025-45 = "으아앙~! 무서워~!"
10058025-48 = "저, 저 회색 전차!!"
10058025-49 = "전에 본 1위라던 사람 아니야?!"
10058025-54 = "저번에 봤던 그 특이한 전차……."
10058025-55 = "당신들, 출발도 하지 않고 뭐 하고 있는 건가요?"
10058025-57 = "그, 그게요. 갑자기 쏘고, 싸우고 있잖아요!"
10058025-58 = "뭔가 쿠데타라도 일어난 건가요?!"
10058025-59 = "쿠데타라니…… 게헨나에서 그런 복잡한 일을 할 리가 없잖아요."
10058025-60 = "쏘, 쏘지 말아 주세요오……. 저희는 장갑도 얇아서 맛도 없어요, 으아앙-"
10058025-67 = "3시 방향 적 발포! 도탄되었습니다! 피해 없습니다!"
10058025-68 = "하아…… 잠시만요."
10058025-73 = "오옷 이로하 선수! 선제공격에 눈도 깜짝 안 하고 단 한 발의 응사로 제압했습니다!"
10058025-74 = "포탑링에 정확하게 꽂아 넣었네요! 역시 랭킹 1위!"
10058025-75 = "아프겠다아!"
10058025-80 = "당신들이 먼저 건드리지 않는다면 아무것도 안 해요. 귀찮으니까."
10058025-81 = "그보다, 본선까지 왔으면서 경기 규칙을 하나도 모르는 거예요?"
10058025-82 = "실례네요! 룰은 알거든요! 모든 과녁을 맞히고 먼저 출발선으로 돌아오면 된다고 했잖아요!"
10058025-83 = "네. 그게 유일한 룰이잖아요."
10058025-86 = "'가장 먼저'라는 건, 앞에 '다른 전차'가 없으면 된다는 거니까요."
10058025-87 = "그래서 지금, 서로 1등 못 하게 하려고 전차를 격파하는 거라구요?!"
10058025-88 = "그런 거죠. 자, 꾸물대다간 당할 거예요."
10058025-89 = "토라마루, 전차 전진."
10058025-95 = "도……."
10058025-96 = "도망쳐!!!!"
