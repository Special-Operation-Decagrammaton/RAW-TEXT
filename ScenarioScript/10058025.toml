[translation]
10058025-3 = "どうしてみんなこっちを撃ってくるの！？"
10058025-4 = "分っかんないよ！？みんな、おかしくなっちゃったんだ！"
10058025-5 = "きゃあああっ！！！"
10058025-8 = "キルマークにしてやるよ！！"
10058025-9 = "撃たないでください！撃たないでください！！うわあああん！！！"
10058025-10 = "反則～！これ反則だって～！"
10058025-11 = "往生際が悪いぞ！おとなしく……。"
10058025-14 = "ん？"
10058025-18 = "ぐはあっ！！！"
10058025-24 = "……。"
10058025-25 = "……。"
10058025-26 = "う、うあっ……。"
10058025-27 = "救護が必要な場に救護を！"
10058025-29 = "これより、移動式野戦病院にて、救護活動を開始します！"
10058025-30 = "私は悲しいです。#n理由もなく他人に暴力を行使するなんて……。"
10058025-31 = "救護が必要不可欠だと断定します。"
10058025-32 = "救護騎士団の信念と誇り、そして決意を皆さんにお伝えいたします！"
10058025-33 = "団長！次弾、装填しました！"
10058025-34 = "素晴らしいです、セリナ！ハナエ、次に救護が必要な方はどちらでしょう！"
10058025-35 = "あっちにもこっちにもいます！"
10058025-36 = "もっと近くに寄せてください！私を、救護の場に！"
10058025-44 = "私たちを攻撃してた戦車が、あんなところまで飛んでいっちゃった！"
10058025-45 = "うわあ～ん！怖いよぉ～！"
10058025-48 = "あ、あの戦車！！"
10058025-49 = "この前見た絶対王者！？"
10058025-54 = "先日の風変わりな戦車……。"
10058025-55 = "あなた方、スタートもしないで何をしてるんですか？"
10058025-57 = "聞いてください！みんなが急に砲撃を始めたんです！"
10058025-58 = "クーデターでも起きたのでしょうか！？"
10058025-59 = "クーデターだなんて……ゲヘナでそんな複雑なことは起きませんよ。"
10058025-60 = "う、撃たないでくださいぃ……。#n私たちの戦車は装甲もしょぼいし、大したことないんです。うわあああん！"
10058025-67 = "3時方向から敵の砲撃！跳弾したため被害はありません！"
10058025-68 = "はぁ……。ちょっと待っていてください。"
10058025-73 = "イロハ選手！敵の先制攻撃をものともせず、一発で制圧しました！"
10058025-74 = "砲塔リングにしっかり差し込みましたね！さすがランキング1位！"
10058025-75 = "痛そう～！"
10058025-80 = "あなた方が余計なことをしなければ、こちらからは何もしません。面倒なので。"
10058025-81 = "というか、本戦まで上がってきたのにルールも知らないんですか？"
10058025-82 = "失礼な！知ってますよ！#n全ての的を砲撃して、最初にスタートラインまで戻ってくればいいんでしょ！"
10058025-83 = "はい。それが唯一のルールです。"
10058025-86 = "[ruby=・]最[/ruby][ruby=・]初[/ruby][ruby=・]に[/ruby]というのは……#n言い換えれば、前に他の戦車がいないということです。"
10058025-87 = "それって、前を走るライバルの戦車を破壊するってことですか！？"
10058025-88 = "そういうことです。ほら、モタモタしてるとやられますよ。"
10058025-89 = "虎丸、前進！"
10058025-95 = "に……。"
10058025-96 = "逃げろー！！！"
