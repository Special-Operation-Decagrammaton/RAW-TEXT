[translation]
901010800360-6 = ""
901010800360-7 = "那麼，把目前為止推論出來的內容整理一下……"
901010800360-8 = "「卡爾帕喬家族為了散播鐵桶蟹的傳聞，大量收購螃蟹並刻意在港口滾動鐵桶。」"
901010800360-9 = "「卡爾帕喬家族在即將面臨的續約上，承受著金錢壓力。」"
901010800360-10 = "看來「鐵桶蟹」的傳聞會四處流傳，確實與卡爾帕喬家族存在緊密的關係呢。"
901010800360-11 = "沒錯。卡爾帕喬家族為了讓傳聞更加真實採取了各種手段，甚至不惜承受額外支出。"
901010800360-12 = "原因很可能是為了卡爾帕喬家族的利益，尤其是有助於承包業務的續約。"
901010800360-13 = "「殘忍對待他人的組織」這種傳聞通常會給人負面印象，#n但對於經常從事非法行為的不良集團來說，反而可能發揮正面作用。"
901010800360-14 = "而且就像鐘崎港的承包業務那樣，透過競標選定投標者時，競爭對手越少就越有利。"
901010800360-15 = "就算這項標案再怎麼有吸引力，也不會有人想被慣於用螃蟹拷問的組織給盯上吧？"
901010800360-16 = "況且實際上那種事根本沒有發生，自然也不會與女武神為敵了。"
901010800360-17 = "[s1] 「確實有道理，不過……」\n[s2] 「萬一對方矢口否認怎麼辦？」"
901010800360-20 = "確實，如果對方厚顏無恥地辯稱只是想浪費錢，我們也沒辦法追究呢。"
901010800360-21 = "即使證據確鑿，動機部分也終究只是主觀的推測……"
901010800360-23 = "關於這點請不用擔心。"
901010800360-24 = "無法以證據證明的部分，只要向當事人「直接」確認就可以了。"
901010800360-25 = "[s] 「直接確認……？」"
