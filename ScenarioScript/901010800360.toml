[translation]
901010800360-6 = ""
901010800360-7 = "เอาละ มาสรุปข้อสันนิษฐานที่เราได้จนถึงตอนนี้กัน"
901010800360-8 = "<การ์ปัชโช่ แฟมิลี่จงใจกลิ้งถังเหล็กและซื้อปูจำนวนมาก เพื่อเผยแพร่ข่าวลือเรื่องถังเหล็กใส่ปู>"
901010800360-9 = "<การ์ปัชโช่ แฟมิลี่กำลังเผชิญกับภาระทางการเงินก่อนการต่อสัญญาใหม่>"
901010800360-10 = "ดูเหมือนว่าการ์ปัชโช่ แฟมิลี่จะมีส่วนเกี่ยวข้องอย่างมากกับการแพร่ข่าวลือเรื่อง 'ปูในถังเหล็ก' นี้นะ"
901010800360-11 = "ใช่ การ์ปัชโช่ แฟมิลี่ถึงกับยอมเสียค่าใช้จ่ายที่ไม่จำเป็น แล้วก็ใช้วิธีการหลายทาง#nเพื่อทำให้ข่าวลือดูสมจริงยิ่งขึ้น"
901010800360-12 = "ส่วนเหตุผลที่ทำแบบนั้น ก็มีแนวโน้มสูงว่าเพราะมันช่วยรักษาผลประโยชน์ของการ์ปัชโช่ แฟมิลี่ โดยเฉพาะการต่อสัญญางานรักษาความปลอดภัย"
901010800360-13 = "อื้อ เพราะข่าวลือที่ว่าเป็น 'องค์กรที่ปฏิบัติต่อผู้คนอย่างโหดเหี้ยม' ปกติจะให้ภาพลักษณ์ในแง่ลบ แต่สำหรับแก๊งอันธพาลที่ก่อเรื่องอยู่เป็นประจำ มันกลับอาจส่งผลในแง่บวกก็ได้"
901010800360-14 = "อีกทั้งงานจ้างภายนอกของท่าเรือคาเนะซากิ ที่คัดเลือกมาจากการประกวดราคา ยิ่งมีคู่แข่งน้อยก็ยิ่งได้เปรียบ"
901010800360-15 = "ต่อให้งานนี้จะน่าสนใจแค่ไหน ก็คงไม่มีใครอยากไปมีเรื่องกับองค์กรที่ขึ้นชื่อว่าทรมานคนด้วยปูหรอก จริงมั้ย?"
901010800360-16 = "นอกจากนี้ เรื่องแบบนั้นก็ไม่เคยเกิดขึ้นจริง งั้นไม่จำเป็นต้องเป็นศัตรูกับวัลคิรี่ด้วย"
901010800360-17 = "[s1] \"ฟังดูก็มีเหตุผล แต่ถ้าพวกนั้นไม่ยอมรับล่ะ?\"\n[s2] \"ฟังดูก็มีเหตุผล แต่ถ้าพวกนั้นตีหน้าซื่อปฏิเสธล่ะ?\""
901010800360-20 = "ถ้าพวกนั้นหน้าด้านตีหน้าซื่อ แล้วอ้างว่าแค่อยากผลาญเงินเล่นจริงๆ ก็ไม่มีทางซักไซ้เอาความได้#nเหมือนกันนะ"
901010800360-21 = "เพราะถึงหลักฐานจะชัดเจน แต่แรงจูงใจก็ยังเป็นเพียงข้อสันนิษฐานเท่านั้น..."
901010800360-23 = "เรื่องนั้นไม่ต้องกังวลหรอก"
901010800360-24 = "ถ้าเป็นเรื่องที่พิสูจน์ด้วยหลักฐานไม่ได้ ก็แค่ไปยืนยันกับเจ้าตัว 'โดยตรง' ก็พอค่ะ"
901010800360-25 = "[s] \"โดยตรงเหรอ...?\""
