[translation]
901010800360-6 = ""
901010800360-7 = "So, to summarize what we've deduced..."
901010800360-8 = "\"The Carpaccio Family rolled drum barrels and purchased a large quantity of crabs on purpose in order to spread the frightening rumors.\""
901010800360-9 = "\"They are also facing a financial burden on account of the upcoming security contract renewal.\""
901010800360-10 = "It looks like the Carpaccio Family was deeply involved in spreading the \"crabs in a drum barrel\" rumor."
901010800360-11 = "Yeah. The Carpaccio Family went to extensive lengths to make the rumor believable, even though it cost them money."
901010800360-12 = "They did this to put their organization at an advantage. Their intimidating reputation would help eliminate competition for their contract renewal."
901010800360-13 = "Yeah. Having a cruel and brutal reputation helps people in their line of illicit \"business.\""
901010800360-14 = "For Kanesaki Port's contract work, where the bid is won through an auction, it's best to have as little competition as possible."
901010800360-15 = "No matter how appealing this bid might be, you wouldn't want to get on the bad side of people who torture others with crabs, right?"
901010800360-16 = "And since these crimes never actually happened, Valkyrie never had to step in."
901010800360-17 = "[s1] \"You have a point...\"\n[s2] \"But what if they try to play innocent?\""
901010800360-20 = "They technically did nothing illegal. We can't press the issue if all they did was waste money and time."
901010800360-21 = "Even if the evidence is solid, we're still technically guessing at their motive."
901010800360-23 = "Don't worry about that."
901010800360-24 = "Since we can't prove their motives with evidence, we can just \"directly\" verify them."
901010800360-25 = "[s] \"Directly...?\""
