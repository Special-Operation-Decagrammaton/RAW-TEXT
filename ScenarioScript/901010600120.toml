901010600120-8 = "Hello!"
901010600120-9 = ""
901010600120-11 = ""
901010600120-13 = ""
901010600120-14 = "Hey, aren't you the student who brought us inarizushi?"
901010600120-15 = "I don't suppose you're here for another promotion?"
901010600120-16 = "Unfortunately, the FOX EATS review bonanza promotional period has concluded..."
901010600120-17 = ""
901010600120-19 = ""
901010600120-20 = "But I do have lots of leftover energy drinks left from our last event! Would you like one?"
901010600120-21 = "...I ain't too proud to take a free drink."
901010600120-22 = ""
901010600120-24 = ""
901010600120-25 = "Did you catch a lot of crab today?"
901010600120-26 = "Sure did. We caught so much that I thought our ship was going to sink."
901010600120-27 = "I'd feel a lot cheerier about it if the crabs were actually worth something..."
901010600120-28 = "Right. It's such a shame that you can't get a fair price. You caught so much."
901010600120-29 = "Come to think of it, did you catch these crabs with baited traps?"
901010600120-30 = "Crabs caught in fishing nets or spring traps often have broken legs or claws, but these seem to be in great shape!"
901010600120-31 = "I'm sure you'll fetch a better price! You've put so much effort into catching pristine crab."
901010600120-32 = ""
901010600120-35 = ""
901010600120-36 = "...You're not like most kids, huh? "
901010600120-37 = "If today's youth had your kind of initiative, we wouldn't have such a hard time finding good help."
901010600120-38 = "Are you having problems hiring people?"
901010600120-39 = "It's nothing big. We're just having trouble finding a new fisher. Our new guy, Miyaguchi, just disappeared."
901010600120-40 = "I can't believe Miyaguchi ran off without a word... If I ever run into that punk again, I'll give him a good kick in the rear."
901010600120-41 = "How problematic."
901010600120-42 = "But what if this...Miyaguchi person had a good reason? Maybe something happened to him?"
901010600120-43 = "What if he had a serious illness or a sudden accident...?"
901010600120-44 = "Huh. There's no way that kid suddenly got sick."
901010600120-45 = "I'm sure he ran away because crabbing was too hard. He whined every day about how he couldn't stand it. We only asked him to maintain the equipment!"
901010600120-46 = "Is crabbing work that hard?"
901010600120-47 = "I can't say it's easy, but anyone with a strong constitution and half a brain can do it."
901010600120-48 = "I'm not lying about him, by the way. Ask the others. The whole crew knew what a whiny little noodle he was."
901010600120-49 = "Hmph. Kids nowadays..."
