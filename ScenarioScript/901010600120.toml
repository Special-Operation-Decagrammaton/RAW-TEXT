[translation]
901010600120-8 = "안녕하세요!"
901010600120-14 = "아, 그때 유부초밥을 가져다주었던 그 학생이잖아?"
901010600120-15 = "오늘도 뭐, 프로젝트인지 프로모션인지 하는 것 때문에 온 거야?"
901010600120-16 = "아뇨. 아쉽게도 <FOX EATS>의 리뷰 이벤트는 끝나버려서요……"
901010600120-20 = "대신 지난 이벤트 때 증정하고 남은 에너지 드링크라면 잔뜩 있는데, 혹시 하나 드시겠어요?"
901010600120-21 = "……공짜라면 마다할 이유가 없지."
901010600120-25 = "오늘도 게는 많이 잡으셨나요?"
901010600120-26 = "그래. 게가 하도 많이 잡혀서 배가 엎어지는 줄 알았다니까."
901010600120-27 = "게 가격이 바닥을 치지만 않았어도 좋았을 텐데."
901010600120-28 = "그러게요. 이렇게나 잔뜩 잡았는데, 제값을 받지 못한다니 아쉽네요."
901010600120-29 = "그러고 보니, 이 게들은 통발에 미끼를 놓아 잡으신 거죠?"
901010600120-30 = "어망이나 통발로 잡은 게는 다리가 부러지거나 집게가 상해 있는 경우가 많은데, 여기서 잡힌 게들은 깨끗하니 상태가 좋아 보이네요."
901010600120-31 = "게 한 마리를 잡는 데도 이렇게 정성을 들이고 계시니, 분명 게 가격도 금방 안정될 거예요."
901010600120-36 = "……학생은 요즘 젊은 사람들답지 않구만."
901010600120-37 = "요즘 젊은 사람들이 다 학생 같았더라면, 사람 구하는 데 이렇게 애를 먹지 않아도 되었을 텐데."
901010600120-38 = "뭔가 구인 관련해서 문제가 있으신가요?"
901010600120-39 = "별 건 아니야. 최근에 어선에서 일하던 미야구치라는 신입 녀석이 갑자기 사라져서, 일손을 구하는 데 어려움을 겪고 있거든."
901010600120-40 = "미야구치 녀석, 다른 사람에게 말도 없이 도망치다니…… 나중에 만나게 된다면 엉덩이를 걷어차 줘야지."
901010600120-41 = "그것 참 큰일이었네요."
901010600120-42 = "그나저나 갑자기 자취를 감추었다니, 그 미야구치라는 분께 무슨 일이 생긴 건 아니었을까요?"
901010600120-43 = "큰 병에 걸렸다거나, 사고를 당했다거나……"
901010600120-44 = "흥. 그 팔팔한 녀석이 갑자기 병은 무슨 병이야?"
901010600120-45 = "분명 게잡이 일이 힘들어서 도망친 걸 거야. 매일 어구를 손질하면서도 못 해 먹겠다고 불평을 늘어놨었거든."
901010600120-46 = "게잡이 일이 그렇게 힘든가요?"
901010600120-47 = "쉬운 일이라고는 할 수 없겠지만, 근성만 있다면 누구나 할 수 있는 일이야."
901010600120-48 = "정 의심 가면 다른 선원들에게 물어보든가. 그 녀석이 얼마나 나약한 녀석이었는지는 모두가 알고 있으니까."
901010600120-49 = "하여튼 요즘 젊은 녀석들은……"
