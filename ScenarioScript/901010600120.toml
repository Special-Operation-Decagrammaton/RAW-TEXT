[translation]
901010600120-7 = ""
901010600120-8 = "您好！"
901010600120-9 = ""
901010600120-11 = ""
901010600120-13 = ""
901010600120-14 = "嗯？這不是之前送豆皮壽司來的學生嗎？"
901010600120-15 = "今天也是為了什麼企劃還是宣傳活動來的嗎？"
901010600120-16 = "不。很可惜，「FOX EATS」的評論活動已經結束了……"
901010600120-17 = ""
901010600120-19 = ""
901010600120-20 = "不過上次活動贈送的能量飲料還剩下不少，您要不要來一罐呢？"
901010600120-21 = "……如果是免費的，那可沒有拒絕的理由啊。"
901010600120-22 = ""
901010600120-24 = ""
901010600120-25 = "今天也捕了很多螃蟹嗎？"
901010600120-26 = "是啊。數量多到我都覺得船要翻了呢。"
901010600120-27 = "要是螃蟹的價格沒有跌到谷底就好了。"
901010600120-28 = "是啊。明明捕了這麼多卻賣不到好價錢，真是可惜呢。"
901010600120-29 = "這麼說來，這些螃蟹是用蟹籠放餌捕撈的吧？"
901010600120-30 = "用漁網或蟹籠捕撈的螃蟹，常常會有蟹腳斷掉或蟹螯受損的情況……#n但是這裡的螃蟹都很完整，狀態看起來很好呢。"
901010600120-31 = "連捕撈一隻螃蟹都投入這麼多心力，螃蟹的價格一定很快就會穩定下來的。"
901010600120-32 = ""
901010600120-35 = ""
901010600120-36 = "……同學你和最近的年輕人不太一樣呢。"
901010600120-37 = "要是最近的年輕人都像你一樣，招募人手也就不用那麼費盡心力了。"
901010600120-38 = "您在招募人手方面遇到什麼問題了嗎？"
901010600120-39 = "不是什麼大事。只是最近一個原本在漁船上工作，名叫宮口的新人突然消失了……#n害我在招募人手上面傷透了腦筋。"
901010600120-40 = "宮口那傢伙，竟然給我一聲不響地烙跑……以後要是被我碰到，非得踹他屁股不可。"
901010600120-41 = "那還真是辛苦了。"
901010600120-42 = "話說回來，突然銷聲匿跡……該不會是那位叫宮口的人發生了什麼事吧？"
901010600120-43 = "像是得了重病，或是遭遇事故之類的……"
901010600120-44 = "哼。那個精力充沛的傢伙怎麼可能突然生病啊？"
901010600120-45 = "肯定是捕蟹的工作太辛苦才逃跑的，#n他每天在整理漁具的時候，都在抱怨說做不下去了。"
901010600120-46 = "捕蟹的工作有那麼辛苦嗎？"
901010600120-47 = "雖然不算輕鬆，不過任何人只要肯吃苦耐勞都能做得來。"
901010600120-48 = "如果不相信就去問問其他船員吧，大家都知道那傢伙有多軟弱。"
901010600120-49 = "真是的，最近的年輕人啊……"
