[translation]
10056105-4 = "용왕님, 1번 구역에서 폭발을 확인…… 무언가 잔뜩 달라 붙어 있습니다!"
10056105-5 = "기관실 압력 저하! 밸러스트 라인 손상!"
10056105-6 = "2번, 3번 구역도 동시에 피격…… 피해가 극심합니다!"
10056105-7 = "뭐야…… 상대는 단 네 명 뿐이잖아."
10056105-8 = "그런데 최소 10곳 이상에서 공격을 받고 있다니……"
10056105-12 = "도대체 어떤 방식으로 공격을 해 오는 거야?!"
10056105-13 = "배수 펌프도 한계입니다! 이대로는 용궁이…… 선단이 통째로 침몰하고 말 거예요!"
10056105-14 = "요, 용왕님……!"
10056105-15 = "고작…… 고작 몇 명의 잠수부 때문에…… 잠수부 따위에게……!"
10056105-19 = "루스카다…… 물 밑에 그 괴물이 있어!"
10056105-23 = "……그만, 그만!"
10056105-26 = "……방금 '그만', 이라고 하셨나요?"
10056105-27 = "그래, 그만두겠다고!"
10056105-28 = "이깟 용연향 따위…… 이런 것에 의지하지 않아도 여의 공물은 차고 넘치거든?"
10056105-29 = "네 녀석들의 지긋지긋한 숨바꼭질에 어울리는 것도 이제 지쳤다! 여는 돌아가겠어!"
10056105-30 = "[ns1] \"하아, 다행이다……\"\n[ns2] \"간신히 끝났나……\""
10056105-33 = "샬레의 선생이라고 했었지."
10056105-34 = "이번은 여의 능력을 온전히 되찾지 못하여, 특별히 물러나겠지만……"
10056105-35 = "다음 번에는 그대를 무조건 굴복시키고 말 테니까!"
10056105-36 = "[s3] \"응. 다음에 보자.\"\n[s4] \"……그동안 너무 큰 말썽은 부리지 말고.\""
10056105-39 = "무어냐, 그 무례한 말투는!"
10056105-43 = "저기…… 나나미 씨."
10056105-44 = "용왕님이라고 불러!"
10056105-45 = "네, 네! 용왕님."
10056105-46 = "오디세이아의 분쟁 조정이야 트라이던트가 해결하는 것이고…… 저희도 물 위에서 일어나는 일에 대해서는 크게 신경 쓰지 않지만요……"
10056105-50 = "만에 하나. 만에 하나라도."
10056105-51 = "다시 한 번 저희 부의 스폰서께 총구를 겨눈다면……"
10056105-52 = "그 때는 정말로 가만 두지 않을테니까요."
10056105-53 = "………윽."
10056105-54 = "전 선단, 양현 전속! 후퇴한다!"
10056105-59 = "와, 살벌한데?"
10056105-64 = "으, 으응……? 나 방금 뭔가 이상한 소리를 했었나……?"
10056105-65 = "코코로는 화나면 정말 무서우니까."
10056105-66 = "깜짝 놀라서 나도 모르게 잠수할 뻔 했어……"
10056105-67 = "나, 나는 그냥 주의를 준 것 뿐인데……"
10056105-68 = "[s] \"수고 많았어, 코코로.\""
10056105-69 = "서, 선생님도 수고 많으셨습니다!"
10056105-70 = "해적들도 떠났으니…… 이제 오디세이아 학원으로 돌아가기만 하면 되겠네요."
10056105-71 = "[s5] \"그나저나 아까 부터 신경 쓰였는데……\"\n[s6] \"우리가 타고 온 배가 안 보이는데.\""
10056105-74 = "아, 그 배라면……"
10056105-75 = "아까 고래가 점프할 때 뒤집혀 버렸어."
10056105-76 = "고래의 브리칭이 내는 충격은 수류탄 40개를 동시에 터트리는 것과 비슷하다고 하니까."
10056105-77 = "저, 정말? 어, 어쩌지……?"
10056105-78 = "으, 으아아…… 이 상황은 조난인가? 우, 우선 조난 신호를—"
10056105-79 = "진정해, 코코로."
10056105-80 = "그럴 줄 알고 이미 무선으로 아일랜드에 구조신호를 보냈으니까."
10056105-81 = "이 근처에서 기다리고 있으면 곧 구조선이 올 거야."
10056105-82 = "그, 그렇다면 다행이지만……"
10056105-83 = "해상 표류인가…… 해상에서 구조선을 기다리는 것도 정말 오랜만이네."
10056105-84 = "그럼 구조선이 올 때까지 '그거' 하면서 기다리는 거야?"
10056105-85 = "[s] \"……그거?\""
10056105-86 = "응. 이리 와, 선생님."
10056105-92 = "해상 표류시에는 흩어지는 것을 막고 체온을 유지하기 위해 딱 붙어 있는 게 안전하니까."
10056105-104 = "[ns] \"손만 잡고 있으면 안 될까……?\""
10056105-105 = "아, 안 돼요!"
10056105-106 = "바다에서 표류 중에 가장 위험한 상황은 체온이 떨어지는 것이니까요."
10056105-107 = "아, 안전을 위한 조치니……"
10056105-111 = "지금은 다이빙부 부장의 지시에 따라주세요!"
10056105-114 = "(이후, 구조선이 올 때까지 한동안 다이빙부의 학생들을 부둥켜 안은 채 바다에 떠 있었다.)"
10056105-115 = "(덕분에 추위를 느끼지는 않았지만……)"
10056105-119 = "(구조선에 탄 트라이던트의 학생들에게 이상한 오해를 살 뻔 했었다.)"
