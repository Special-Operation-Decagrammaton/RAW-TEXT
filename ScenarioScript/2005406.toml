[translation]
2005406-1 = "라이프 스태프 2"
2005406-4 = "……면목이, 없네요……."
2005406-5 = "[s1] \"괜찮아. 많이 피곤했구나.\"\n[s2] \"살다 보면 늦잠도 자 보고 그러는 거지.\""
2005406-8 = "그렇지만, 이런 시기에 이런 상황인데……."
2005406-9 = "이래서야 정말로, 여러 가지로 실격이네요. 저……."
2005406-10 = "네? 너무 자책하지 말아 주었으면 한다고요?"
2005406-11 = "오히려 지금까지 선생님이 너무 저에게 의지하기만 했으니까, 이렇게 된 것일 수도 있다고요……?"
2005406-12 = "그렇지만……."
2005406-13 = "[s3] \"이거 이거, 말이 안 통하는구만!\"\n[s4] \"오늘은 내가 히마리의 라이프 스태프를 해 줄게!\""
2005406-16 = "……네?"
2005406-17 = "선생님이, 저의……?"
2005406-18 = "그, 그렇지만 그건……!"
2005406-19 = "예전에도 다른 아이들의 도움을 받지 않았냐고요?"
2005406-20 = "그건…… 그랬죠. 우선 에이미가 많이 도와주기도 했고, 최근에는 거기에 토키도 이따금 도와주지만……."
2005406-21 = "그, 그래도요! 선생님께 도움받는다는 건, 조금 더 다른 문제라고 할까요……."
2005406-22 = "[s] \"……그렇게 싫어?\""
2005406-23 = "그럴 리가요! 오히려……!"
2005406-24 = "……오히려……."
2005406-25 = "우, 우우우……."
2005406-30 = "(좋은데…… 말로 표현이 안 될 만큼 좋은데……!)"
2005406-31 = "(딱 그만큼, 말로 표현이 안 될 정도로 부끄럽네요, 이거!)"
2005406-36 = "[ns5] \"히마리는 늘 대견하니까, 가끔 주위를 의지해 줬으면 해.\"\n[ns6] \"나로 괜찮다면, 나라든가!\""
2005406-41 = "선생님? 함부로 그런 말씀을 하시면 안 된답니다?"
2005406-42 = "저는 물론 그렇지 않지만."
2005406-43 = "가령 리오처럼 겉만큼이나 속이 시꺼먼 주제에, 머리는 그럭저럭 돌아가는 학생들에게 잘못 걸리면……."
2005406-44 = "상당히, 귀찮아지실 수도 있을 거예요?"
2005406-45 = "[s] \"그것도 재미있을 것 같네!\""
2005406-46 = "예?!?!"
2005406-47 = "하, 학생은 언제든 선생님을 귀찮게 해도 된다고요? 그것이 어떤 의미로는 학생의 특권 같은 것이니까?"
2005406-48 = "……."
2005406-49 = "정말! 자꾸 그렇게 말씀하지 말아 주세요!"
2005406-50 = "……제 인내력을, 그렇게 무의식중에 테스트하지 말아 주세요."
2005406-51 = "저도, 하려고만 한다면, 얼마든지 귀찮은 여자아이일 수도 있는데……."
2005406-52 = "[ns] \"히마리?\""
2005406-55 = "아, 아아아아아아, 아뇨! 아무것도 아니랍니다! 그럼요!"
2005406-56 = "흠흠……."
2005406-57 = "그러면, 선생님께서 말씀해 주신 것도 있고 말이죠?"
2005406-58 = "오늘은 한껏 선생님을 귀찮게 해 드리려고 하는데, 괜찮으신 거죠?"
2005406-59 = "[s7] \"크윽, 이것이 자업자득이라는 것인가……!\"\n[s8] \"어쩔 수 없지! 그 [ruby=챌린지]도전[/ruby], 받아들이겠다!\""
2005406-62 = "후후후……."
2005406-63 = "직접 말씀하신 거예요? 각오해 주세요, 선생님?"
2005406-64 = "(그렇게 히마리와의 귀찮은(?) 시간이 갑작스럽게 시작되었다.)"
2005406-67 = "아~아. 손을 좀 씻고 싶은데, '안아서' 옮겨 주실 분 안 계시려나요~?"
2005406-68 = "저는 그렇게까지 무겁지도 않을 테고? 세면대까지는 그렇게 멀지도 않을 거고?"
2005406-69 = "[ns] \"예이, 예이.\""
2005406-75 = "(그 순간…… 히마리의 따스한 숨결이 귓가를 깊이 스쳤다!)"
2005406-76 = "[ns] \"?!?!\""
2005406-77 = "어머나. 왜 그렇게 놀라시죠, 선생님?"
2005406-78 = "호흡은, 생명이 살아가기 위한, 기본 중에서도 기본적인 활동이라구요?"
2005406-80 = "(틀린 말은 아니긴 한데!)"
2005406-81 = "(어쨌든 중심을 잃지 않으려 노력하며, 히마리를 도와주었다.)"
2005406-87 = " ……."
2005406-88 = "(심장이 터지는 줄 알았어요!)"
2005406-89 = "(와, 와아……. 이거 생각보다도 훨씬 더 긴장되고…….)"
2005406-90 = "(부끄러운, 일이었네요……!)"
2005406-93 = "아~아. 이거 어떡하죠? 갑자기 팔에 힘이 잘 들어가지 않네요~?"
2005406-94 = "물론 마사지를 해 주시는 것도 감사하지만, 지금 약간 허기가 느껴져서 말이에요?"
2005406-95 = "냉장고에 보관해 둔 초콜릿 브라우니라든가~ 누가 먹여 주시지 않으려나요~?"
2005406-99 = "감사합니다. 선생님."
2005406-100 = "그러면……."
2005406-104 = "[ns] \"?!?!?!\""
2005406-105 = "후훗. 왜 그러시죠, 선생님?"
2005406-106 = "조금, 생각보다도 더 빠르게 당이 떨어지는 것 같아서."
2005406-107 = "살짝 먼저, 제 몸과 얼굴을 움직여 맛을 보았을 뿐인데요."
2005406-108 = "[s] \"그, 그래. 정말로 먹고 싶었구나…….\""
2005406-113 = "(얼굴에 불이 붙는 줄 알았어요!)"
2005406-114 = "(선생님의 얼굴이 그렇게 가까이, 가까이……!)"
2005406-115 = "(아뇨, 물론 다가간 쪽은 저이긴 한데, 그래도……!)"
2005406-116 = "……."
2005406-117 = "(그보다 선생님은, 이런 미소녀가 그 정도로 가까이 다가갔는데도, 별 느낌이 없으셨던 걸까요?)"
2005406-121 = "(아뇨, 잠깐만……. 오히려, 그랬기 때문에?)"
2005406-122 = "……."
2005406-123 = "(너무 갑작스러운 거리감 조정은, 오히려 역효과를 불러일으킬 수도 있다는 것일까요……?)"
2005406-124 = "(그래요. 이것은 마치 촉매 과잉…….)"
2005406-125 = "(반응 속도를 증가시키기 위해 촉매의 양을 늘리면, 결과를 얻기까지의 시간은 단축될 수 있지만.)"
2005406-126 = "(불필요한 부산물이 생성되거나, 반응 시스템의 안정성이 저하되는 문제점이 발생할 가능성도 올라가죠…….)"
2005406-127 = "(저 정도 되는 사람이 이런 실수를 하다니, 반성해야 할 일이네요…….)"
2005406-130 = "어머나. 어느덧 밤이 다 되었네요."
2005406-131 = "[s] \"엇? 벌써?!\""
2005406-132 = "이곳은 밤낮의 개념을 확실하게 구분 짓기 어려운 곳이다 보니, 시간관념이 흐려지기 쉽죠."
2005406-133 = "그야말로 '초현상'이 실시간으로 일어나고 있는 곳이니까요."
2005406-134 = "아~아. 안 그래도 라이프 사이클이 위험해져서 제시간에 잠들기도 힘들어졌는데, 누가 옆에서 저 좀 재워 주지 않으려나요~?"
2005406-135 = "[s] \"그, 그래도 괜찮은 거야?!?!\""
2005406-136 = "어머나?"
2005406-137 = "저는 세상 그 누구보다도 선생님을 믿고 있는데, 선생님은 혹시 아니신가요?"
2005406-138 = "[s] \"……!!!\""
2005406-140 = "[ns9] \"그렇구나. 이해했어.\"\n[ns10] \"지금의 나는, 히마리의 라이프 스태프니까!\""
2005406-144 = "(그렇게 히마리를 재워 주기 위해, 침대로 향했다.)"
2005406-145 = "(그때……!)"
2005406-146 = "에잇♪"
2005406-151 = "[ns] \"히마리?!\""
2005406-152 = "왜 그러시나요, 선생님? 재워 주신다고 하셨잖아요."
2005406-153 = "저는 말이죠~ 잠이 안 올 때면~ 누군가가 곁에 있어 줘야 잠들 수 있답니다~"
2005406-154 = "네? 에이미나 토키도 마찬가지였냐고요?"
2005406-158 = "(……사실, 그런 것은 아니었죠.)"
2005406-159 = "(………일단 에이미와 너무 가까이 밀착하면, 제가 열사병에 걸릴 것이 거의 확실하기도 하고요.)"
2005406-164 = "언제나 그렇지는 않았지만요~ 오늘처럼 잠이 안 올 때는, 어쩌면요?"
2005406-165 = "(죄송해요. 선생님.)"
2005406-166 = "(이렇게 귀찮은 여자아이가 되어 버려서…… 정말로, 죄송해요.)"
2005406-167 = "[ns11] \"어쩔 수 없네~\"\n[ns12] \"그러면 정말로, 잠들 때까지만이다?\""
2005406-170 = "네, 네에. 물론이죠!"
2005406-176 = "(히마리를 눕히고, 불을 껐다.)"
2005406-177 = "(히마리의 규칙적인 숨소리가, 마치 수면을 유도하는 자연 음향처럼 느껴졌다.)"
2005406-178 = "(분명히, 히마리가 잠들 때까지만이라고 했는데…….)"
2005406-179 = "(먼저, 잠이 오고 있는 것은……….)"
2005406-186 = "선생님……."
2005406-187 = "주무, 시나요?"
2005406-188 = "……고른 숨소리, 약간이지만 떨어진 체온, 뇌파 측정 장치에서 검출되기 시작한 세타파와 미량의 델타파……."
2005406-189 = "후훗……."
2005406-190 = "사실, 우리 중에서 가장 체력을 많이 사용하고 계신 것은 선생님이실 텐데 말이죠."
2005406-194 = "(잘 모르겠지만, 무언가가 몸에 팔을 둘러 오는 것 같은 감각이 느껴졌다…….)"
2005406-196 = "선생님."
2005406-197 = "……선생님."
2005406-198 = "우리들의……."
2005406-199 = "지금은, 저만의 선생님……."
2005406-200 = "알고 계시나요, 선생님?"
2005406-201 = "지금 저는, 정말로 나쁜 아이라는 것을요."
2005406-202 = "혹시나 눈치채셨다면, 잠과 꿈을 빌미로 잊어 주셨으면 하고."
2005406-203 = "모르고 계신다면, 가능한 한 오랫동안 몰라 주셨으면 좋겠어요."
2005406-204 = "이런 상황에서, 이런 사태 한가운데에서, 이런 생각이나 하고 있다니……."
2005406-205 = "천재 병약 미소녀고 뭐고, 정말 스스로에게 환멸이 날 지경이네요."
2005406-206 = "굳이 책임을 전가하고자 한다면, 저를 이렇게 만들어 버린 선생님께도 조금이나마 원망을 해 보고 싶습니다만……."
2005406-207 = "아뇨. 역시 그건 너무 비열한 것 같습니다."
2005406-212 = "죄송해요, 선생님."
2005406-213 = "죄송해요."
2005406-214 = "그렇지만 선생님은 지금 이 순간……."
2005406-215 = "그리고 분명 앞으로도……."
2005406-216 = "저에게 있어, 누구와도 무엇과도 바꿀 수 없는……."
2005406-217 = "그런, 소중하고 중요한 분이랍니다."
2005406-220 = "(잘 모르겠지만, 이마에 무언가 부드러운 것이 닿는 감각이 느껴졌다.)"
2005406-221 = "푹 쉬세요. 선생님."
2005406-222 = "부디, 몸조심하시고요."
