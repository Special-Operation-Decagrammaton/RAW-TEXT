[translation]
1011603-1 = "두 사람의 레슨"
1011603-2 = "(사오리가 보내준 주소에 도착하니 화려한 촬영장 세트가 나왔다.)"
1011603-6 = "선생. 이쪽이다."
1011603-7 = "[s1] \"여기가 촬영장이구나?\"\n[s2] \"엄청 멋진 장소네!\""
1011603-10 = "오늘은 촬영이 없는 날이라 마음 놓고 사용하라더군."
1011603-11 = "그러니…… 부탁한다."
1011603-12 = "나에게 춤을 알려줬으면 해."
1011603-13 = "파트너와 추는 춤이라니……. 전혀 모르겠다. 춰본 적도 없어."
1011603-14 = "[s] \"오, 그렇다면 내가 사오리의 첫 상대인 거네?\""
1011603-18 = "그런 셈이지."
1011603-19 = "내 처음이 선생이라……."
1011603-23 = "그래. 선생처럼 믿을만한 어른이 첫 상대라 다행이야."
1011603-24 = "그러니 부디 부드럽게 리드해 주길 바란다."
1011603-25 = "[s] \"무, 물론이지……!\""
1011603-26 = "응? 왜 그러지? 선생도 긴장한 건가?"
1011603-27 = "……그렇군. 솔직히 말해 나도 조금 긴장했다."
1011603-28 = "이런 넓은 방 안에서……"
1011603-29 = "서로의 숨결이 느껴질 정도로, 가깝게 있으니까 말이야……."
1011603-30 = "[s] \"이, 이야기는 그만하고 얼른 춤을 시작하자!\""
1011603-31 = "……대화를 피하려는 걸 보니 선생도 이런 상황은 익숙하지 않은 모양이군."
1011603-32 = "하지만 부탁을 들어줄 사람은 선생 정도밖에 떠오르지 않았어."
1011603-33 = "그런 의미에서 선생만 괜찮다면 촬영 때의 파트너도 부탁하고 싶은데, 괜찮은가?"
1011603-34 = "아, 부담스럽다면 거절해도 괜찮아. 무리한 요구라는 건 알고 있으니까."
1011603-35 = "[s3] \"아닙니다! 부디 하게 해 주십시오!\"\n[s4] \"내가 먼저 부탁하려던 참이었어!\""
1011603-38 = "……그래. 고맙다, 선생."
1011603-39 = "그럼 서로의 각오를 확인했으니 시작하도록 하지."
1011603-40 = "……흠, 그런데 춤이라는 건 어떻게 시작해야 하는 거지?"
1011603-41 = "응? 인사? 파트너에게 인사를 하는 것부터 춤이라고?"
1011603-42 = "그렇군. 알겠어. 배우겠다."
1011603-44 = "선생…… 아니, 파트너를 향한 인사를."
1011603-49 = "[wa:2530]― [log=사오리 드레스 비무장]이, [wa:1090]이렇게 하면 될까……?[/log]"
1011603-52 = "[wa:50]― [log=사오리 드레스 비무장]선생이 그렇게 말한다면…… [wa:2770]하지만, [wa:1150]이건 조금…….[/log]"
1011603-53 = "[wa:3070]― [log=사오리 드레스 비무장]평소라면, [wa:1260]절대 하지 않았을 자세야.[/log] [wa:800]"
1011603-56 = "[wa:2000]― [log=사오리 드레스 비무장]양손이 자유롭지 못하니, [wa:2280]조금 불안하군.[/log]"
1011603-57 = "[wa:4350]― [log=사오리 드레스 비무장]파트너를 [wa:440]신뢰하지 않는다면 [wa:1600]어렵겠어.[/log]"
1011603-60 = "[wa:590]― [log=사오리 드레스 비무장]설마 이건…… [wa:1800]그걸 증명하는 인사였던 [wa:2150]건가?[/log][wa:700]"
1011603-63 = "[wa:830]― [log=사오리 드레스 비무장]그렇다면…… [wa:1570]선생이 만족할 때까지 [wa:2380]이 자세로 있어 주지.[/log]"
1011603-66 = "[wa:1250]― [log=사오리 드레스 비무장]이것이…… [wa:2540]내 신뢰의 증거다.[/log]"
1011603-70 = "인사에도 생각보다 깊은 뜻이 있었군. 좋은 것을 배웠어."
1011603-71 = "음? 그 미묘한 웃음은 뭐지? 내가 뭔가 잘못 이해한 건가?"
1011603-72 = "……아무튼 이제 다음 단계로 넘어가지."
1011603-73 = "다음은…… 서로의 손을 잡는 거라고?"
1011603-77 = "조, 좋아! 난 얼마든지 각오가 되어있다! 와라, 선생!"
1011603-78 = "[s] \"간다! 사오리!\""
1011603-83 = "그저 가까이에서 손을 잡았을 뿐인데…… 이 떨림은 뭐지?"
1011603-88 = "그러고 보니 이렇게 손을 잡고 춤추는 모습을 파티장 경호 일을 하며 얼핏 본 적이 있다."
1011603-89 = "그걸 내가 직접 하게 될 줄이야."
1011603-90 = "……모두 선생 덕분이야."
1011603-91 = "그저 싸우는 것밖에 몰랐던 내가, 이렇게 다양한 경험을 하게 되다니."
1011603-95 = "아……."
1011603-96 = "……그래. 그랬던 거군. 방금 전에 갑자기 떨렸던 이유는……."
1011603-97 = "나도 모르게 가까워진 선생과의 거리감 때문인가."
1011603-98 = "부족한 몸이지만, 앞으로도 계속 잘 부탁한다. 선……."
1011603-103 = "자, 잠깐! 왜 갑자기 내 허리에 손을 얹는 거지?"
1011603-104 = "나, 난 아직 마음의 준비가……!"
1011603-108 = "아…… 그, 그런가? 춤을 위한 동작이었나? 오해해서 미안하다."
1011603-109 = "아무래도 나도 모르게 생각이 많아졌나 보군."
1011603-110 = "이제 나는…… 선생의 어깨에 손을 얹으면 된다고?"
1011603-111 = "후우우…… 알겠어."
1011603-112 = "가, 간다! 선생……!"
1011603-114 = "(이후로 사오리와 함께 열심히 춤을 연습했다.)"
