[translation]
90102110-1 = "第11話;駅弁"
90102110-2 = "（事件を解決して1週間ほど経った頃……）"
90102110-3 = "（外回りからの帰り道で列車に乗った）"
90102110-4 = ""
90102110-7 = ""
90102110-8 = "ご乗車の皆様、ただいまより車内検札を開始いたします。"
90102110-9 = "お客様は指定席にご着席のうえ、お手元に乗車券をご用意ください。"
90102110-12 = ""
90102110-13 = "お客様、乗車券のご提示をお願いいたします。"
90102110-14 = "[s] \"あ、ちょっと待ってくれる？\""
90102110-15 = "まさかとは思いますが……#n乗車券をお持ちでないのに、時間を稼いでいらっしゃるのでしたら――"
90102110-16 = "[s1] \"ち、違うよ！\"\n[s2] \"今回はちゃんと持ってるから！\""
90102110-19 = "そうでしたか。"
90102110-20 = "私としても、無賃乗車の輩を列車の外へ投げ捨てる手間が省けて嬉しいです。"
90102110-21 = ""
90102110-23 = ""
90102110-24 = "はい。確認いたしまし――"
90102110-25 = "……あれ？この乗車券……おかしいですね。"
90102110-26 = "[s] \"何か問題でもあるの？\""
90102110-27 = "ご覧ください。この乗車券はD.U.中央区ではなくゲヘナ行きのものです。"
90102110-28 = "誤って発券されたか、列車をお間違えになったようですね。"
90102110-29 = "[s3] \"そ、そんな……。\"\n[s4] \"それじゃあ私はどうすれば……？\""
90102110-32 = "正しい乗車券をお持ちでないなら、お客様ではありません。#nただちに列車から降りていただきます。"
90102110-33 = "非常扉を開けますので、速やかに降車いただけますか？"
90102110-34 = "[s5] \"走行中だよね！？\"\n[s6] \"それは危なすぎるでしょ！？\""
90102110-37 = "応じていただけないのであれば仕方ありません。"
90102110-38 = "直々に降車をお手伝いするしか……。"
90102110-39 = "[s] \"や、優しくして――！\""
90102110-40 = "あの……。"
90102110-41 = ""
90102110-43 = ""
90102110-44 = ""
90102110-46 = "乗車券、落としてますよ？"
90102110-47 = "[s] \"ミヤコ……？\""
90102110-48 = ""
90102110-50 = ""
90102110-51 = "しーっ……。"
90102110-52 = "今は私に合わせてください。"
90102110-53 = ""
90102110-55 = ""
90102110-56 = "確認しました。確かに、中央区までの本日分の乗車券ですね。#nただし――"
90102110-57 = "座席をお間違いのようです。#n指定されているのはこちらの生徒さんの隣ですので、すぐに移動してください。"
90102110-58 = "[s] \"わ、分かった！\""
90102110-59 = "それでは、良い旅を。"
90102110-60 = ""
90102110-62 = ""
90102110-64 = "ふふ、間一髪でしたね、先生。"
90102110-65 = "危うく放り出されるところでしたよ？"
90102110-66 = "[s7] \"本当にありがとう。\"\n[s8] \"おかげで命拾いしたよ……！\""
90102110-69 = "お気になさらず。"
90102110-70 = "先生にはお世話になっていますし、これくらい大したことでは。"
90102110-71 = "むしろ、お役に立ててよかったです。"
90102110-72 = "[s] \"それにしても、この乗車券どうしたの？\""
90102110-73 = "同行するはずだった小隊員に急用ができて、余っていたんです。"
90102110-74 = "せっかく取った切符が無駄になってしまうところだったので。"
90102110-75 = "こうして活用できたのは怪我の功名でしたね。"
90102110-76 = "[s] \"シャーレに戻ったら、すぐ切符代を送るよ。\""
90102110-77 = "あ、いえ！大丈夫です。"
90102110-78 = "ただでさえ先生には良くしていただいているんです。#nそれにどのみち、使い道を失った乗車券だったのですから。"
90102110-79 = "どうかお気になさらず――"
90102110-80 = ""
90102110-82 = ""
90102110-83 = ""
90102110-84 = "……失礼しました。"
90102110-85 = "発車時刻ぎりぎりで慌てていたので……お昼を食べ損ねてしまって。"
90102110-86 = "[s9] \"食べる？駅弁。\"\n[s10] \"さっき買ったんだけど、胃の調子が悪くてね。\""
90102110-89 = "召し上がらないのでしたら……ありがたくいただきます。"
90102110-90 = ""
90102110-91 = ""
90102110-92 = ""
90102110-93 = "列車の中でお弁当をいただくのは初めてです。"
90102110-94 = "これはこれで良い体験ですね。"
90102110-95 = "あっ、このホタテ焼売、噛むたびに旨味が広がって……とても美味しいです。"
90102110-96 = "[s11] \"口に合ったみたいでよかった。\"\n[s12] \"今度、みんなの分も買って持っていこうか。\""
90102110-99 = "そこまでしていただかなくても……。"
90102110-100 = "……[ruby=私たち]SRT[/ruby]は、先生に助けていただいてばかりですね。"
90102110-101 = "[s] \"そんなことないよ、お互い様。\""
90102110-102 = ""
90102110-105 = "[ns] \"今回の作戦だって、FOX小隊に助けられたし。\""
90102110-106 = "そういえば、この前ユキノ先輩が仰っていた作戦は無事に終わったみたいですね。"
90102110-107 = "「幼馴染が無事に戻ってきた」と、私の友人からお礼の連絡がきました。"
90102110-108 = "……いえ、そもそも先輩方が作戦に失敗するはずありませんね。#n余計な心配をしてしまったみたいです。"
90102110-109 = "[s] \"FOX小隊は一度も失敗したことないの？\""
90102110-110 = "失敗の定義として付随的な被害の発生を除けば、#n私の知る限り、作戦目標を取り逃がしたことは一度もないそうです。"
90102110-111 = "ブラックマーケットに違法武器を流通させていたリボリータ・ファミリーを壊滅させた時も、ワカモをはじめとした七囚人を逮捕した時も……。"
90102110-112 = "FOX小隊は、いつも完璧でした。"
90102110-113 = "でも、そうおっしゃるということは――先輩たちの作戦で、何か気になることでも？"
90102110-114 = "[s13] \"FOX小隊というより、ユキノかな。\"\n[s14] \"昔のことを気にしてるように見えて。\""
90102110-117 = "ユキノ先輩が……？"
90102110-118 = "先輩はいつも私たちの前では気丈に振る舞っていましたから……少し気になります。"
90102110-119 = "[s15] \"時々、過去の選択を後悔してるように見えたんだ。\"\n[s16] \"だから昔の作戦で、何かあったのかなって。\""
90102110-122 = "……。"
90102110-123 = "もしかすると……[ruby=・   ・   ・   ・]あの事件[/ruby]のことかもしれません。"
90102110-124 = "[s] \"あの事件？\""
90102110-125 = "「ユートピア」という閉鎖された遊園地を覚えていますか？#n以前、色彩侵攻の際に私たちと一緒に作戦を行った場所です。"
90102110-126 = "閉園した後は「スランピア」と呼ばれるようになり、#n数々の怪談の舞台として語られてきました。"
90102110-127 = "経営難で閉園したとされているユートピアですが、#n実はあまり知られていない事実があるんです。"
90102110-128 = "ユートピアは開園当初、多くの市民に愛されていました。#n経営状態も決して悪くなかったそうです。"
90102110-129 = "ですが……たった一度の決断によって、#n誰もが避ける忌まわしい場所へと変貌してしまった。"
90102110-130 = ""
90102110-132 = ""
90102110-134 = "皆に愛される夢と幻想の空間を現実に引きずり出した人こそ――"
90102110-135 = "ユキノ先輩なんです。"
90102110-137 = "ロア追跡編;To be Continued in Chapter 4"
