[translation]
90102110-1 = "#title;제11화;에키벤"
90102110-2 = "#na;(사건이 끝나고, 1주일 즈음 지났을 무렵……)"
90102110-3 = "#na;(샬레의 업무 차 다른 학원 자치구를 방문했다 D.U.로 돌아가기 위해 열차에 탑승했다.)"
90102110-4 = "#st;[0,0];instant;1;"
90102110-7 = "3;하이랜더 승무원;01\n#3;a"
90102110-8 = "3;하이랜더 승무원;02;손님 여러분, 지금부터 검표를 시작하겠습니다.\n#3;em;[반응]"
90102110-9 = "3;하이랜더 승무원;02;차내의 손님 여러분께서는 자리에 앉아, 소지하고 계신 승차권을 꺼내 주시기 바랍니다."
90102110-12 = "3;하이랜더 승무원;01\n#3;a\n#3;closeup\n#wait;1000"
90102110-13 = "3;하이랜더 승무원;03;반갑습니다, 손님. 소지하고 계신 표를 제시해 주시겠습니까?\n#3;em;[음표]\n#3;closeup"
90102110-14 = "[s] \"아, 잠시만 기다려 줄래?\""
90102110-15 = "3;하이랜더 승무원;05;혹시…… 표를 갖고 계시지 않은데, 시간을 끌고 계신 거라면—\n#3;closeup"
90102110-16 = "[s1] \"그, 그렇지 않아!\"\n[s2] \"이번에는 확실히 표를 갖고 있으니까!\""
90102110-19 = "3;하이랜더 승무원;02;아, 다행이네요.\n#3;closeup"
90102110-20 = "3;하이랜더 승무원;03;저 또한 무임승차한 손님을 열차 밖으로 던지는 수고를 덜 수 있어서 기쁩니다.\n#3;closeup\n#3;em;[반짝]"
90102110-21 = "#st;[0,0];instant;1;"
90102110-23 = "3;하이랜더 승무원;03\n#3;closeup\n#3;greeting\n#wait;1300"
90102110-24 = "3;하이랜더 승무원;03;네. 표 확인했습니……\n#3;closeup"
90102110-25 = "3;하이랜더 승무원;02;어라? 손님, 표에 적힌 내용이 이상한데요.\n#3;closeup\n#3;em;[?]"
90102110-26 = "[s] \"표에 무슨 문제라도 있어?\""
90102110-27 = "3;하이랜더 승무원;01;네. 여기 보시면 이 승차권의 목적지가 D.U. 중앙구가 아닌 게헨나 행으로 적혀 있습니다.\n#3;closeup"
90102110-28 = "3;하이랜더 승무원;02;아무래도 표를 잘못 발권하셨거나, 기차를 잘못 타신 모양인데요.\n#3;closeup"
90102110-29 = "[s3] \"그, 그런……\"\n[s4] \"그럼 나는 어떻게 해야해?\""
90102110-32 = "3;하이랜더 승무원;01;안타깝지만 표를 갖고 계시지 않은 손님은 열차 규정에 의거하여 조속히 하차해 주셔야 합니다.\n#3;closeup"
90102110-33 = "3;하이랜더 승무원;05;……비상문을 열어드릴 테니 직접 하차해 주시겠어요?\n#3;closeup"
90102110-34 = "[s5] \"잠깐, 지금 열차가 달리는 중이잖아?\"\n[s6] \"그건 너무 위험하잖아!\""
90102110-37 = "3;하이랜더 승무원;01;안내에 응하지 않으시니 어쩔 수 없네요.\n#3;closeup\n#3;em;[한숨]"
90102110-38 = "3;하이랜더 승무원;02;제가 직접 손님의 하차를 돕는 수밖에……\n#3;closeup"
90102110-39 = "[s] \"아, 안 돼……!\""
90102110-40 = "3;하이랜더 승무원;02\n#na;???;저기, 그 쪽의 손님?\n#3;closeup"
90102110-41 = "#st;[0,0];instant;1;"
90102110-43 = "3;하이랜더 승무원;02\n#3;closeup\n#3;em;[?]\n#3;h\n#wait;1300"
90102110-44 = "3;미야코;01\n#3;black"
90102110-46 = "3;미야코;01\n#na;???;방금 이 표를 떨어트리셨어요.\n#3;black"
90102110-47 = "[s] \"……미야코?\""
90102110-48 = "#st;[0,0];instant;1;"
90102110-50 = "3;미야코;01\n#3;a\n#3;greeting\n#wait;1300"
90102110-51 = "3;미야코;03;……쉬잇.\n#fontsize;50"
90102110-52 = "3;미야코;03;선생님. 지금은 잠자코 저와 입을 맞추어 주세요.\n#fontsize;50"
90102110-53 = "#st;[0,0];instant;1;"
90102110-55 = "3;하이랜더 승무원;02\n#3;em;[반응]\n#wait;1400"
90102110-56 = "3;하이랜더 승무원;01;확인했습니다. 이건 확실히 중앙구까지 가는 오늘자 승차권이네요."
90102110-57 = "3;하이랜더 승무원;05;다만 손님, 자리가 바뀐 것 같습니다. 이 열차표의 지정석은 이 학생의 옆 자리니 바로 자리를 옮겨 앉아 주시기 바랍니다."
90102110-58 = "[s] \"바, 바로 옮길게!\""
90102110-59 = "3;하이랜더 승무원;03;그럼 즐거운 여행 되시길.\n#3;em;[음표]"
90102110-60 = "#st;[0,0];instant;1;"
90102110-62 = "3;하이랜더 승무원;03\n#3;d\n#wait;1800"
90102110-64 = "3;미야코;07;후후, 큰일날 뻔했네요. 선생님.\n#3;em;[재잘]\n#3;a"
90102110-65 = "3;미야코;03;제가 나서지 않았더라면, 차창 너머로 던져지실 뻔 했어요."
90102110-66 = "[s7] \"정말 고마워, 미야코.\"\n[s8] \"덕분에 살았어……!\""
90102110-69 = "3;미야코;99;별 말씀을요."
90102110-70 = "3;미야코;01;평소에 선생님께서 저희 RABBIT 소대에 신경 써 주시는 것에 비하면 큰 도움도 아니었는 걸요."
90102110-71 = "3;미야코;03;오히려 선생님께 도움이 될 수 있어서 기뻐요.\n#3;em;[음표]"
90102110-72 = "[s] \"그나저나 이 승차권은 어떻게 된 거야?\""
90102110-73 = "3;미야코;02;아, 그게 지인의 부탁으로 잠시 다른 자치구에 다녀오던 길이었는데……\n#3;em;[...]"
90102110-74 = "3;미야코;01;동행했던 소대원이 갑자기 급한 일이 생기는 바람에 표가 한 장 남아 버렸거든요."
90102110-75 = "3;미야코;03;예매한 표를 쓰지 못했을 때는 조금 아깝다고 생각했는데, 이렇게 선생님을 도울 수 있게 되다니. 결과적으로는 전화위복이 되었네요."
90102110-76 = "[s] \"샬레에 돌아가면 바로 표 값을 보내줄게.\""
90102110-77 = "3;미야코;04;아, 아뇨! 괜찮습니다. #n보답을 바라고 한 일이 아니니까요.\n#3;hophop"
90102110-78 = "3;미야코;11;안 그래도 평상시에 선생님께 이것저것 편의를 제공받고 있는데, 이런 사소한 일에도 대가를 받는다면 RABBIT 소대의 소대장으로서 면목이 서지 않으니까요."
90102110-79 = "3;미야코;99;저희는 신경 쓰지 마시고 부디 편하게—"
90102110-80 = "#st;[0,0];instant;1;"
90102110-82 = "3;미야코;99\n#wait;1500"
90102110-83 = "3;미야코;08\n#3;stiff\n#3;em;[///]\n#wait;1300"
90102110-84 = "3;미야코;09;……실례했습니다."
90102110-85 = "3;미야코;04;열차 시간이 다소 촉박해서 서두르다 보니, 점심을 거르는 바람에……\n#3;em;[훌쩍]"
90102110-86 = "[s9] \"……혹시 에키벤 하나 먹을래?\"\n[s10] \"아까 역에서 사 왔는데, 지금 속이 안 좋아서.\""
90102110-89 = "3;미야코;03;드시지 않는다면…… 감사히 받겠습니다."
90102110-90 = "3;미야코;01\n#3;a"
90102110-91 = "3;미야코;01\n#3;greeting\n#wait;1300"
90102110-92 = "3;미야코;07\n#3;em;[반짝]\n#wait;1300"
90102110-93 = "3;미야코;02;다른 도시락은 평소에도 자주 먹었지만, 이렇게 열차 내에서 에키벤을 먹는 건 처음이네요."
90102110-94 = "3;미야코;03;식힌 채로 파는 도시락이라고 해서 어떤 맛일지 궁금했었는데…… 따듯한 도시락과는 다른 풍미가 있네요."
90102110-95 = "3;미야코;03;특히 이 가리비 쇼마이는 진한 감칠맛이 피 속에 농축되어 있어서, 오히려 따듯한 쇼마이보다 훨씬 더 맛있게 느껴지는 것 같아요.\n#3;em;[음표]"
90102110-96 = "[s11] \"입에 잘 맞은 것 같아서 다행이네.\"\n[s12] \"다음 번에는 다른 소대원들 것도 함께 사다줄게.\""
90102110-99 = "3;미야코;04;그, 그러실 필요는……"
90102110-100 = "3;미야코;09;……저희 SRT는 선생님께 늘 도움만 받는 것 같네요.\n#3;em;[///]"
90102110-101 = "[s] \"그렇지 않아. 나도 너희들에게 여러모로 도움을 받고 있는 걸.\""
90102110-102 = "#st;[0,0];instant;1;"
90102110-105 = "[ns] \"이번 작전에서도 FOX 소대에게 도움을 받았고……\""
90102110-106 = "3;미야코;02;그러고 보니 저번에 유키노 선배가 말씀하셨던 작전은 성공적으로 끝난 모양이네요."
90102110-107 = "3;미야코;03;전에 의뢰를 한 학생이 '친구가 무사히 돌아왔다' 며 감사의 인사를 전해왔거든요."
90102110-108 = "3;미야코;99;……아니, 애초에 FOX 소대의 선배들이라면 절대로 작전을 실패할 리가 없는데. #n괜한 걱정을 한 것 같네요.\n#3;em;[한숨]"
90102110-109 = "[s] \"FOX 소대는 단 한 번도 작전에 실패한 적이 없어?\""
90102110-110 = "3;미야코;02;네. 제가 아는 한 부수적인 피해가 발생한 것을 제외하면, 작전 목표를 놓친 적은 단 한 번도 없었다고 합니다."
90102110-111 = "3;미야코;02;와카모를 비롯한 일곱 죄수를 체포했을 때도, 블랙 마켓에 불법 무기를 유통하던 리볼리타 패밀리를 소탕했을 때도……"
90102110-112 = "3;미야코;07;FOX 소대의 선배들은 언제나 완벽히 작전을 완수했으니까요.\n#3;em;[반짝]"
90102110-113 = "3;미야코;01;그런데 그렇게 말씀하시는 걸 보니, 뭔가…… 선배들의 작전에 신경 쓰이는 부분이라도 있으셨나요?"
90102110-114 = "[s13] \"FOX 소대보다는 유키노의 일인데……\"\n[s14] \"유키노가 과거의 일을 신경 쓰고 있는 것처럼 보여서.\""
90102110-117 = "3;미야코;02;유키노 선배가요?\n#3;em;[?]"
90102110-118 = "3;미야코;06;선배는 언제나 저희 앞에서 의연한 모습만 보이셔서, 알아차리지 못했는데…… 그렇게 말씀하시니 조금 신경 쓰이네요."
90102110-119 = "[s15] \"유키노는 가끔 과거에 내린 결정을 후회하는 것처럼 보였어.\"\n[s16] \"그래서 과거의 작전 중에 무슨 일이 있었나 싶어서.\""
90102110-122 = "3;미야코;01;………"
90102110-123 = "3;미야코;11;유키노 선배가 신경 쓰는 과거의 결정이라면, 혹시 그 사건 때문일지도 모르겠네요."
90102110-124 = "[s] \"그 사건?\""
90102110-125 = "3;미야코;02;선생님. 혹시 이전 색채 침공 때 저희와 함께 작전을 진행했었던 <유토피아>라는 폐쇄된 유원지를 기억하고 계시나요?"
90102110-126 = "3;미야코;02;경영난으로 폐쇄되었다고 알려진 그 유원지는, 이후 <슬럼피아> 라는 이름으로 방치된 채 여러 괴담의 무대가 되어왔었죠."
90102110-127 = "3;미야코;11;하지만 유토피아에 대해 잘 알려지지 않은 사실이 하나 있습니다.\n#3;em;[반응]"
90102110-128 = "3;미야코;10;유토피아는 개장 당시 시민들로부터 큰 인기를 끌었고, 재정적인 문제도 거의 없었습니다."
90102110-129 = "3;미야코;06;하지만 유토피아는 단 한 차례의 결정으로 인해 모두가 기피하고 꺼려하는 공간으로 바뀌고 말았지요."
90102110-130 = "#st;[0,0];instant;1;"
90102110-132 = "3;미야코;99\n#3;em;[...]\n#wait;2500"
90102110-134 = "#na;미야코;그 때, 모두가 사랑하는 꿈과 환상의 공간을 현실로 이끌어 낸 사람이 바로—"
90102110-135 = "#na;미야코;……유키노 선배였으니까요."
90102110-137 = "#nextepisode;로어추적 편;To be Continued in Chapter 4"
