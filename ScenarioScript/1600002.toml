[translation]
1600002-1 = "잘못된 연락"
1600002-3 = "아, 오셨군요. 와 주셔서 감사합니다. 다른 게 아니라, 제가 여기 폭탄을 설치했는데……"
1600002-4 = "조금 적은 거 같기도 해서…… 이 정도면 되는지 확인을……"
1600002-5 = "……?"
1600002-6 = "[s] \"……?\""
1600002-7 = "……선생님……?"
1600002-8 = "[s] \"안녕. 하루카.\""
1600002-9 = "……?"
1600002-10 = "서, 서서, 선생님!? 선생님이 어째서 여기에……??"
1600002-11 = "네, 네네네, 네네? 부, 부부, 불렀다고요? 제, 제제가 제가 선생님을……?"
1600002-12 = "문자……요……?"
1600002-13 = "……"
1600002-14 = "……"
1600002-15 = "……!!! 죄, 죄죄! 죄죄죄 죄송합니다……! 주, 주주 죽을 죄를……!"
1600002-16 = "저, 저는 그러니까 이게……! 선생님께 보내려던 게 아니라……!"
1600002-17 = "실수……! 실수였습니다……! 이, 이걸 어떻게 해야……!"
1600002-18 = "제 실수 때문에 저 따위를 보러 선생님께서 이런 곳까지……!"
1600002-19 = "죄송합니다…… 죄, 죄송……"
1600002-20 = "죄송합니다죄송합니다죄송합니다죄송합니다죄송합니다죄송합니다죄송합니다……"
1600002-21 = "……?"
1600002-22 = "예, 예? 괜찮으시다고요……? 그보다 뭘 하고 있었냐고요……?"
1600002-23 = "그, 그건……"
1600002-24 = "……"
1600002-25 = "포, 폭탄……"
1600002-26 = "폭탄을 몰래 설치하고 있었습니다……"
1600002-27 = "[s] \"……폭탄?\""
1600002-28 = "그게 그…… 회사 의뢰로…… 내일...... 꼭 조퇴시켜야 하는 사람이 있다고 해서……"
1600002-29 = "그 사람이 여기 지나니까…… 지날 때 터뜨리려고……"
1600002-30 = "그러면…… 조퇴……시킬 수 있으니까…… 영원히……"
1600002-31 = "……네? 폭탄 설치는 누가 시켰냐고요? 아, 아뇨. 폭탄을 시킨 사람은 없어요……"
1600002-32 = "그, 그건 그냥…… 제가 알아서……"
1600002-33 = "그, 그래서 제대로 했는지 확인을 받으려고……! 확인 문자를 보낸다는 게 실수로……!"
1600002-34 = "불러내서죄송합니다죄송합니다죄송합니다……"
1600002-35 = "……네? 괜찮으시다고요……?"
1600002-36 = "아, 아. 연락 드린 게 괜찮다는 말씀이시군요…… 그렇군요……"
1600002-37 = "……에? 폭탄은 전부 다시 회수하자고요……? 으음……?"
1600002-38 = "네, 네…… 물론……! 선생님께서 그렇게 말씀하신다면야……"
1600002-40 = "(이후 하루카가 설치한 폭탄들을 모두 회수하니 그 수가 두 자릿수에 달했다.)"
1600002-42 = "다 했습니다…… 설마…… 괜한 짓이었던 걸까요……?"
1600002-43 = "……네? 여기 말고도 해 둔 곳이 있냐고요? 그, 그야…… 확실하게 없애 버리려고……"
1600002-44 = "어, 없애지는 않아도 될 거 같다고요? 나머지 폭탄들은 어디 있냐고요?"
1600002-45 = "으음…… 빌딩 지하…… 헬스클럽…… 공원……"
1600002-46 = "네, 네? 전부 해체요……? 네…… 알겠습니다……"
1600002-47 = "에, 에!? 아닙니다! 저 혼자 가면 됩니다! 서, 선생님께서 저 따위와 동행을 하시는 건……!"
1600002-48 = "[s1] \"같이 가고 싶어서 가는 거야.\"\n[s2] \"나랑 같이 가는 건 별로야?\""
1600002-49 = "……!?"
1600002-50 = "어, 어째서…… 저 따위와……"
1600002-51 = "아, 아뇨! 아뇨! 절대 그런 건 아닌데요! 절대 그럴 수 없는데요!"
1600002-52 = "……저, 정말 괜찮으시다고요……? 아니, 꼭 같이 가야 하시겠다고요……?"
1600002-53 = "아, 알겠습니다…… 선생님께서 그러시다면……"
1600002-54 = "그, 그럼 출발하겠습니다……"
1600002-56 = "……여기…… 기둥 옆…… 철거했습니다……"
1600002-57 = "[s] \"잘했어.\""
1600002-58 = "자, 잘 했다니…… 그런 말씀을……"
1600002-59 = "……!"
1600002-62 = "(하루카는 곧장 종종걸음으로 도망치듯 앞장섰다.)"
1600002-64 = "여기도……"
1600002-65 = "……아깝다…… 여기서 터뜨리면 깔끔하게 보내버릴 수 있었을 텐데……"
1600002-66 = "네? 아, 아무 것도 아니에요. 그냥 혼잣말이었어요……"
1600002-67 = "[s] \"계속 가자.\""
1600002-68 = "네, 네……"
1600002-70 = "여기도…… 전부…… 철거했습니다……"
1600002-71 = "……서, 선생님…… 저기…… 혹시 저…… 또…… 쓸 데 없는 짓을 해버린 건가요……?"
1600002-72 = "괜히 저 때문에…… 새벽까지 나와서 고생시켜드리고…… 저 따위에게 신경 쓰시느라……"
1600002-73 = "죄…… 죄송합니다…… 늘…… 다른 분들께 폐만 끼치고……"
1600002-74 = "이렇게 하면 다들 좋아하실 줄 알았는데……"
1600002-75 = "[s3] \"나름대로 재밌었어.\"\n[s4] \"밤 산책 같고 좋았어.\""
1600002-76 = "……에? 그, 그게 무슨……"
1600002-77 = "……에? 그, 그게 무슨……"
1600002-78 = "어, 어째서 그런 말을…… 저를 위해……"
1600002-79 = "에…… 좀 더 마음을 편하게 먹어도 된다……고요……?"
1600002-80 = "이런 짓들은 안해도…… 충분히 괜찮다고요……? 제가……?"
1600002-81 = "그, 그런……! 그럴 리가요! 제, 제가 그럴 리가……!"
1600002-82 = "아, 아니! 절대로! 절대로 선생님 말씀이 틀리셨다는 게 아니고, 이건 그게!"
1600002-83 = "그, 그러니까 그런…… 그런 말은……!"
1600002-84 = "……그런 말은 처음 들어봐서……!"
1600002-85 = "……"
1600002-86 = "……헤헤……"
1600002-87 = "감사합니다…… 선생님은…… 정말로 좋은 분이시네요……"
1600002-88 = "저 같은 거랑 이렇게 대화도 나눠주시고…… 동행도 해주시고…… 조언도 해주시고……"
1600002-89 = "……감사합니다…… 정말로요……"
1600002-90 = "그런 선생님이라면…… 선생님을 위해서라면…… 전부……."
1600002-91 = "……전부……."
1600002-93 = "선생님을 위해…… 거슬리는 것들은…… 제가 다 해치워버릴 수 있을 거 같아요……."
1600002-94 = "[s] \"……?\""
1600002-95 = "헤헤…… 흐흐, 흐흐흐……."
1600002-97 = "(하루카는 이후로도 연거푸 허리를 숙여 인사한 뒤, 알 수 없는 웃음기만을 흘린 채 사라졌다.)"
