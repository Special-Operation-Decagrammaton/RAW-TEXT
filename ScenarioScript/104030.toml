[translation]
104030-1 = "제3화;저항 2"
104030-2 = "하아…… 하아……."
104030-3 = "……. 포기하지 않는구나. 너는."
104030-4 = "응. 맞아."
104030-5 = "……그래. 그랬었지."
104030-6 = "[s] \"이제 어떡할 거냐고 물었지?\""
104030-11 = "[ns1] \"잘 알고 있잖아.\"\n[ns2] \"함께 힘을 합쳐서 막을 거야. 늘 그랬듯이.\""
104030-14 = "[ns] \"지금 모두가 힘을 합쳐서 노력하고 있으니까. 그걸 헛되이 할 수 없어.\""
104030-16 = "[ns] \"우리는 여기를 파괴하고, 무사히 지상으로 내려갈 거야.\""
104030-17 = "……. 응. 맞아. 선생님은 늘 그래 왔지."
104030-18 = "그런 게 가능할 리가 없다는 걸 알고 있어도."
104030-28 = "확인. 생텀 인카네이션 프로세스 상태 체크. 동결해 둔 생텀 임시 개체 활성화."
104030-34 = "지금부터 연산 가속합니다."
104030-35 = "[ns] \"…………?!\""
104030-39 = "뭐, 뭐야?! 다차원해석 억제 한계 시간이……."
104030-40 = "뭐, 뭐야 이번엔?!"
104030-42 = "한계 시간이 급격하게 줄어들고 있습니다! 억제를 유지할 수가 없어요!"
104030-43 = "으, 으아아! 줄어드는 속도가 너무 빨라! 이대로라면 통신 단말기를 파괴하기도 전에 타임 오버야!!"
104030-44 = "대체 무슨 일이……?"
104030-47 = "지금 이건……. 무언가가 다차원해석 억제를 파훼하고 있어. 적에게 새로운 연산 리소스 지원이 생긴 거야……!"
104030-49 = "지상에 이미 현현한 성소가 있는 거예요!!"
104030-53 = "지, 지상에?! 어디에?"
104030-54 = "화, 확인 중이지만…… 지금 현현 예정 상태인 6개 외에는……."
104030-55 = "적이 숨겨두고 있는 거야! 비정상적으로 통신이 재밍 된 곳을 찾아!!"
104030-56 = "키보토스 모든 곳을요……? 해킹당한 채로는 불가능해요!"
104030-57 = "……!!"
104030-63 = "……."
104030-64 = "히마리 부장, 수색 중에 새로운 성소를 발견했습니다."
104030-65 = "아직까지 알려져 있지 않은 새로운 개체입니다. 금방이라도 현현할 것 같은 상태라서 지금 당장 대응이 필요해 보입니다."
104030-66 = "좌표를 알려드릴 테니……."
104030-70 = "통신 두절. 아마 이 성소의 영향 때문인가요……."
104030-82 = "이미 현현이 시작된 건가요……?"
104030-88 = "……."
104030-89 = "이것이 적이 숨겨둔 비장의 수라면…… 지금 당장 이 현현을 멈추지 않으면 안 됩니다."
104030-90 = "하지만…… 제가 후퇴했다간……."
104030-94 = "……지금부터 파워드 슈트 시스템 <아비 에슈흐>로 강제 이행합니다."
104030-99 = "……. 이곳은 제가 어떻게든 막아보겠습니다."
104030-100 = "히마리 부장. 선생님, 그리고 모두들…… 그동안 부디……!!"
104030-106 = "잠깐만요! 억제 한계 시간이 줄어들던 게 지금 막 정상 속도로 회복됐습니다!"
104030-107 = "뭐라고……? 이해할 수 없어, 저 성소는 뭔가 불안정한 상태라는 건가? 아니면……."
104030-108 = "뭔가 이상해요. 데이터대로라면…… 어째서……."
104030-112 = "그 신호는……?!"
104030-113 = "<아비 에슈흐>의 단말과 강제 연결합니다!!"
104030-119 = "토키……!!"
104030-120 = "부장. 무장과의 강제 연결은 가능하군요. 다행입니다."
104030-121 = "토, 토키……?! 대체……."
104030-122 = "……. 리오 님. 무사하셨군요."
104030-133 = "후퇴해요, 토키!! 지금 당신 혼자서는 그 병력을 막아낼 수 없어요!!"
104030-134 = "그래, 지금 그곳으로 사람들을 보낼 테니까 도망쳐!!"
104030-139 = "……. 그럴 순 없습니다."
104030-143 = "이곳은 밀레니엄 자치구에서 굉장히 멀리 떨어져 있는 미답지입니다. 가장 가까운 곳에서도 몇 시간은 걸릴 겁니다."
104030-144 = "제가 시간을 버는 동안…… 부탁드립니다!"
104030-153 = "……!!"
104030-154 = "토키!!"
104030-159 = "미식연구회! 지금 상황은요!!!"
104030-164 = "우와아아아아아-!!"
104030-165 = "우와아아아아아아-!!"
104030-166 = "가고 있어! 최대 속도로 가고 있다구!!"
104030-167 = "그치만 생각보다 적들이 훨씬 많이 쫓아오고 있어서요~ 위기랄까~"
104030-169 = "후우카 씨, 다음 코너에서 승부수를 던져야 합니다."
104030-170 = "알고 있어!! 저 정도는 어떻게든 따돌릴 거야!"
104030-171 = "후우카 씨, 정면!! 정면에!!"
104030-176 = "우와아아아아-!?"
104030-177 = "우와아아아아아-!!"
104030-178 = "우와아아아아아아-!!"
104030-179 = "우와아아아아아아-!?"
104030-185 = "선생님……."
104030-186 = "[s] \"응. 시로코. 여기선 싸워야만 해. 모두와 함께 견뎌내는 거야.\""
104030-190 = "……응. 알겠어."
