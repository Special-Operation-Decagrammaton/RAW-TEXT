[translation]
10007005-1 = "프롤로그;227호 특별반의 어느 평범한 하루"
10007005-2 = "구교사 227호 인근 폐허"
10007005-4 = "으으, 어째서 안 빠지는 거야……."
10007005-8 = "조금만…… 조금만 더……."
10007005-13 = "노도카, 따듯한 코코아 가져왔어."
10007005-14 = "아, 시구레 쨩."
10007005-15 = "마침 손발이 얼어붙어서 따듯한 음료가 그리워지던 참이었는데…… 고마워, 잘 마실게!"
10007005-21 = "하아, 살 것 같아……."
10007005-22 = "코코아의 온기가 온 몸에 퍼져 나가서 행복해……."
10007005-23 = "본교사에 있었을 때는 이런 코코아 한 잔쯤은 언제나 손쉽게 마실 수 있었는데, 이곳에서는 더운물을 구하는 것도 쉽지가 않으니……"
10007005-24 = "우리는 언제쯤에야 본교사로 돌아갈 수 있을까?"
10007005-25 = "걱정하지 마, 노도카. 지난 축제 때 체리노 회장이 정학 조치를 풀어주기로 약속했었잖아?"
10007005-26 = "분명 참고 기다리면 금세 체리노 회장이 우리를 데리러 올 거야."
10007005-27 = "그럴 리가 없잖아! 벌써 몇 개월을 기다렸는데!"
10007005-28 = "분명 그 건방진 꼬맹이 회장은 지금쯤 우리의 존재는 잊어버린 채, 늘어지게 낮잠만 자고 있을걸?"
10007005-29 = "……이럴 줄 알았으면 지난번 구교사에 찾아왔을 때 호되게 혼내줄 걸 그랬어!"
10007005-30 = "그때의 대결에서 진 건 노도카였지만……."
10007005-31 = "……그래서 지금은 뭘 하고 있던 거야?"
10007005-32 = "이곳에 박혀 있는 썩은 기둥을 뽑아내는 중이었어."
10007005-33 = "요 며칠간 날씨가 엄청 추워진 탓에, 모닥불에 쓸 장작이 많이 부족해졌거든."
10007005-34 = "이 주변의 미화 정리도 할 겸, 버려진 나무 기둥들을 정리하고 있었어."
10007005-35 = "도와줄까?"
10007005-36 = "응, 같이 힘을 모아서 기둥을 뽑아내는 거야!"
10007005-41 = "자, 그럼 신호를 할 테니 셋에 함께 당기는 거야!"
10007005-43 = "하나, 둘……"
10007005-49 = "셋!"
10007005-56 = "콰아아아아앙!"
10007005-58 = "뭐, 뭐야? 방금 그 폭발은?"
10007005-59 = "땅 속에 묻혀 있던 지뢰? 아니면 거대 두더지의 습격?"
10007005-60 = "진정해, 노도카. 붉은겨울 학원에 거대 두더지 같은 건 살지 않는다고."
10007005-61 = "그, 그럼 방금은 뭐가 터진 거지……?"
10007005-65 = "……저기를 봐."
10007005-72 = "이, 이게 뭐야!?"
10007005-73 = "땅 속에서 물이 솟구치고 있어!"
10007005-74 = "기둥을 뽑다가 지하수의 수맥을 건드린 걸까."
10007005-75 = "어, 엄청난 기세네……."
10007005-78 = "어, 어쩌지…… 이대로 물이 계속 분출되면 이 일대가 얼음 늪이 되어 버리고 말텐데……."
10007005-79 = "뭔가, 뭔가 물줄기를 막을 만한 자재가 없으려나……?"
10007005-85 = "태울 장작도 없는 마당에 그런 자재가 남아있을 리가……."
10007005-86 = "우으…… 다 끝났어. 우리는 그저 따듯하게 겨울을 나고 싶었을 뿐인데……"
10007005-87 = "결국 우리는 모두에게 잊혀진 채 이 구교사에서 쓸쓸하게 얼어 죽고 말 거야……"
10007005-88 = "너무 낙담하지 마, 노도카. 나쁜 일만 있는 건 아닐지도 몰라."
10007005-89 = "동토의 땅에서 지하수가 터졌는데, 좋은 일이 뭐가 있다고!"
10007005-90 = "잘 봐. 이 물, 단순한 지하수가 아니야."
10007005-91 = "단순한 지하수가 아니라니, 그게 무슨 소리야?"
10007005-95 = "어라? 이 은은한 유황 냄새와 물에서 느껴지는 온기는……"
10007005-96 = "이거 설마, 온천?"
10007005-97 = "후후, 운 좋게 온천 지맥을 건드린 모양이네."
10007005-98 = "이제 목욕할 때마다 물을 데울 필요는 없겠어."
10007005-99 = "그, 그건 그렇지만……"
10007005-100 = "우리 신세에 온천이 무슨 쓸모가 있다고!"
10007005-102 = "온천이 쓸모가 없다니…… 그 말은 용납할 수 없겠는걸!"
10007005-103 = "누, 누구신가요? 서, 설마 또 곰?"
10007005-111 = "곰? 붉은겨울 학원에는 곰도 사는 거야?"
10007005-112 = "어디, 어디에 있어?"
10007005-114 = "당신들은……."
10007005-116 = "아, 소개가 늦었네."
10007005-117 = "안녕, 친구들. 오늘도 개발하기 좋은 날이지?"
10007005-118 = "우리는 온천원이 있는 곳이라면 어디든 찾아가는—"
10007005-119 = "게헨나 학원의 온천개발부야!"
10007005-125 = "게헨나 학원……?"
10007005-126 = "게헨나 학원의 학생 여러분이 여기는 어쩐 일이시죠?"
10007005-127 = "아무리 저희가 정학생 신분이라고는 하지만, 다른 학교의 학생이 붉은겨울 학원의 자치구를 침범하는 행위는 용납할 수 없어요!"
10007005-128 = "아하하~! ♪ 걱정 마, 걱정 마. 그런 골치 아픈 일에는 조금도 관심이 없으니까!"
10007005-129 = "그저 우리는 이곳에 새로운 온천이 터졌다는 이야기를 듣고 찾아온 것뿐이야."
10007005-130 = "새로운 온천이 터진 건 사실이지만……."
10007005-131 = "이, 이곳의 온천이 발견된 건 방금 전의 일인데요?"
10007005-132 = "아하하! 진짜 나이스 타이밍이네!"
10007005-133 = "역시 카스미 부장의 정보는 틀리지 않는다니까."
10007005-134 = "킁킁. 그나저나 유황 냄새가 짙게 나는 게 좋은 온천의 기운이 느껴지는걸."
10007005-135 = "온천수의 상태를 확인해 봐도 괜찮을까?"
10007005-136 = "그런 거라면야, 얼마든지 살펴보세요."
10007005-137 = "흠, 흠. 어디어디."
10007005-143 = "음, 이 온천은……"
10007005-144 = "잘은 모르겠지만 좋은 온천인 것 같아!"
10007005-145 = "그렇게 오래 고민해놓고서는, 감상이 겨우 그것뿐?"
10007005-146 = "나는 무슨 수치니, 어쩌고 함유량이니, 하는 어려운 건 잘 모르는걸. 바보니까."
10007005-147 = "하지만 좋은 향기가 폴폴 피어오르는 게, 당장이라도 옷을 벗고 뛰어들고 싶을 만큼 좋은 온천인 게 확실해! ♪"
10007005-148 = "응? 부장으로부터 건설 허가가 떨어졌다고?"
10007005-149 = "좋았어! 그럼 온천장 건설 개시다!"
10007005-155 = "대형 굴삭기에 천공 장비까지……?"
10007005-156 = "자, 자, 잠깐만요! 지금 무얼 하시려는 건가요?"
10007005-157 = "응? 아까 말한대로 이 온천을 넓혀서 온천장을 건설하려고 하는데?"
10007005-158 = "하지만 이곳은 저희 227호 특별반이 관리하는 구교사라고요!"
10007005-159 = "다른 학교, 다른 동아리가 이 구역을 멋대로 개발하는 건 용납할 수 없어요!"
10007005-160 = "하지만 이 주변에는 숲과 낡은 건물들밖에 없잖아."
10007005-161 = "혹시 이 위에 온천장 말고 다른 건물을 세우려고 했었던 거야?"
10007005-162 = "아뇨, 그런 건 아니었지만……."
10007005-163 = "후후, 그럼 우리가 이 부지에 온천장을 세워도 문제없는 거지?"
10007005-164 = "……반대해도 강행하려 했었지만!"
10007005-165 = "그런 억지가……."
10007005-166 = "자, 친구들!"
10007005-167 = "그럼 이 근처의 숲을 태우고 낡은 건물들도 싹 다 철거하자고!"
10007005-168 = "예전부터 눈 내린 나뭇가지를 통째로 태워버리고 싶었는데…… 마침 잘됐네! ♪"
10007005-177 = "……저 온천개발부라는 동아리의 학생들은 도대체 무슨 꿍꿍이인 걸까?"
10007005-178 = "어차피 이곳의 낡은 폐허는 철거할 예정이었으니, 새 건물을 지어준다면 오히려 이득이 아닐까?"
10007005-179 = "우리는 따듯한 코코아나 한 잔 더 하면서 느긋하게 지켜보자고."
10007005-180 = "그건 그렇지만…… 어쩐지 불안한데……."
10007005-185 = "이, 이게……"
10007005-186 = "이게 뭔가요?!"
10007005-187 = "보다시피, 우리가 건설한 새 온천장이야!"
10007005-188 = "후후. 생각보다 더 멋지게 건설되어서 만족스러운걸. ♪"
10007005-189 = "이건 단순한 온천장이 아니라 료칸이 포함된 대규모 온천 시설이잖아요?!"
10007005-190 = "온천장을 세워도 괜찮다고는 했지만, 이 정도 규모까지 생각하지는 않았다고요!"
10007005-191 = "공사 중에 새 온천이 여기저기서 터져 나오는 바람에 규모를 키우다 보니 그만……"
10007005-192 = "하지만 뭐 어때? 로망과 온천은 크면 클수록 좋은 법이라고!"
10007005-193 = "하지만……."
10007005-194 = "괜찮아. 어차피 이 온천장은 너희 관리구역에 건설한 시설이니까, 너희 마음대로 써."
10007005-195 = "탕 하나를 독점해서 느긋하게 온천을 즐겨도 좋지만, 여러 학생들을 불러 왁자지껄하게 즐기는 혼욕도 포기하긴 아깝지."
10007005-196 = "그렇게 말씀하셔도……."
10007005-197 = "응? 부장의 말에 따르면 이 근처에 다른 온천원이 또 있다고?"
10007005-198 = "그럼 쉬고 있을 틈이 없지."
10007005-199 = "더 많은 온천을! 더 많은 개발을!!"
10007005-200 = "우리는 근처에서 새 온천을 개발하고 있을 테니까, 시설에 문제가 생기면 언제든 불러줘!"
10007005-206 = "……정말 폭풍 같은 사람들이네."
10007005-207 = "게다가 구교사 시설이 통째로 휴양지가 되어버리다니……"
10007005-208 = "말끔한 새 시설이 생긴 건 다행이지만, 이걸 어떻게 관리해야 할지 엄두도 안 나네요."
10007005-212 = "……우선은 목욕부터 할까요?"
