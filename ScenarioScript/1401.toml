[translation]
1401-1 = "GUNS N' PEPPERS 1"
1401-2 = "엔지니어부 동아리 작업실"
1401-5 = "으음…… 구동축과 연결된 이 하부 베어링의 무게를 줄이면 이후의 속도가……."
1401-7 = "어라, 벌써 점심시간이네요. #n우타하 선배! 손이 더러워지는 엔진 정비는 오후로 미루시고 우선 식사부터 하시죠!"
1401-8 = "그렇네. 잠시만 기다려줘. 이음매의 용접이 거의 다 끝났거든. #n이 작업만 마치고 같이 학생 식당에 가서 점심을 먹자."
1401-9 = "하지만 정비에 너무 열중한 탓인지, 작업복 곳곳에 검댕이 잔뜩……."
1401-10 = "그러게. 이렇게 더러워진 작업복 차림으로 학생 식당에 들어갔다가는 다른 학생들에게 폐를 끼치겠어. ……그럼 오늘 점심도 어제처럼 작업실에서 따로 시켜 먹을까?"
1401-11 = "좋은 생각이에요! 안 그래도 햄과 치즈가 잔뜩 올라간 기름진 패스트푸드가 당기던 참이었거든요."
1401-12 = "다양한 재료를 한 번에 맛볼 수 있고, 손을 더럽히지 않고도 간편하게 나누어 먹을 수 있는 패스트푸드라면……."
1401-14 = "역시 피자 밖에 없죠!"
1401-15 = "동감이야. 작업실에서 먹는 배달 음식으로는 피자만한 게 없지."
1401-16 = "후훗, 너희들은 피자를 질리지도 않고 정말 좋아하는구나."
1401-17 = "뭐, 나도 마침 피자가 당기던 참이었으니까. #n평소에 주문하던 것처럼 페퍼로니와 치즈로 시키면 되겠지……?"
1401-20 = "안녕하세요, <카메하메 피자>입니다! 페퍼로니와 치즈 피자 하나 주문하셨죠?"
1401-21 = "네, 이쪽 테이블 위에 놓아주세요."
1401-23 = "확인했습니다. 주문 감사합니다!"
1401-25 = "하아, 이 진한 치즈 냄새…… 냄새만 맡았는데 벌써부터 배가 고파지네요~."
1401-26 = "잘 먹겠습니다……."
1401-29 = "음, 역시 피자는 페퍼로니 피자가 제일이에요! #n이 고소한 치즈와 짭짤한 페퍼로니 햄의 조화가 정말 최고라니까요!"
1401-30 = "나는 치즈 피자가 좋아…… 담백한 치즈 맛이 깔끔하게 느껴지거든."
1401-31 = "그런가? 나는 치즈가 많은 게 조금 느끼한 것 같기도…… #n코토리, 거기 차바스코 소스 좀 건네 주지 않을래?"
1401-32 = "차바스코 소스는 피자 박스에 들어있지 않았나요? 이쪽에는 없는걸요."
1401-33 = "피자 박스 안에는 치즈 가루만 잔뜩…… 아무래도 배달원이 깜박했나봐."
1401-34 = "네에? 피자에 차바스코 소스를 깜박하다니, 이 무슨 중대한 실수를!"
1401-35 = "괘씸한 배달부를 혼내줄 겸 배달 어플의 리뷰 란에 항의를 잔뜩 써 놓도록 하죠!"
1401-37 = "진정해, 코토리. 바쁜 일정 속에서 일을 하다 보면 우리도 부품을 한 두 개씩 잃어버릴 때도 있잖아? 이 정도의 실수는 너그럽게 봐주자고."
1401-38 = "게다가 부실 캐비닛에 저번에 먹다 남은 차바스코 소스가 남아있을 테니 그걸 가져오면 되는 일이야."
1401-43 = "어라? 분명 이 근처에 소스병을 놔뒀었는데…… 그게 어디로 갔지?"
1401-44 = "그 캐비닛은 잡동사니가 어지러이 쌓여 있었으니까, 누군가가 공구를 꺼내다가 치워버린 게 아닐까요?"
1401-45 = "어휴…… 하는 수 없지. 이번에는 차바스코 소스 없이 피자를 먹는 수 밖에."
1401-46 = "언제 어디서든 소스를 쉽게 꺼낼 수 있는 편리한 도구는 없을까……."
1401-49 = "………."
1401-50 = "선배. 저희는 피자를 평소에도 자주 시켜 먹으니까, 차라리 이 참에 차바스코 소스병을 항시 패용할 수 있도록 개조해보는 건 어떨까요?"
1401-51 = "소스병을? 어떻게?"
1401-52 = "예를 들자면…… 학생들이 언제나 몸에서 떼어 놓지 않는 개인화기에 차바스코 소스 분사 장치를 달아놓는다던가!"
1401-54 = "……고작 피자 때문에 총에서 총알이 아니라 차바스코 소스가 나오게 하자고?"
1401-55 = "그것 참 쓸모없고 한심하기 짝이 없는 아이디어네."
1401-56 = "……."
1401-57 = "……."
1401-58 = "당장 만들자."
1401-59 = "(끄덕)"
1401-61 = "역시 다들 좋아할 줄 알았어요!"
1401-62 = "자, 그럼 차바스코 소스병의 역설계부터 시작하도록 하죠!"
1401-64 = "……그리하여 엔지니어부 부원들은 어처구니없는 이유로 차바스코 분사 장치가 달린 총을 개발하게 된 것이다……"
