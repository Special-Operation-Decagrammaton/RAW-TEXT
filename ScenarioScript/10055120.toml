[translation]
10055120-1 = "Epilogue;Dream Battleship"
10055120-2 = "...So that's what happened."
10055120-3 = "I'm sorry. I didn't maintain the boat to the standard I should have, and you all paid the price for it."
10055120-4 = "N-No, it's all right."
10055120-5 = "You gave us plenty of warning. We were the ones who went too far out."
10055120-6 = "But, you know, just wondering..."
10055120-7 = "What's this fancy, shiny new boat doing in my dock?"
10055120-8 = "It's our compensation for your losses..."
10055120-9 = "Is it not enough?"
10055120-10 = "N-No! It's more than enough!"
10055120-11 = "That boat was on its last legs to begin with. You've gone and replaced it with something brand new, when it probably would've cost me money to junk it."
10055120-12 = "Our things aren't always valued by their price tags."
10055120-13 = "Even though it was on its last legs, you still kept it with you. After decades, it meant more to you than what it could be sold for."
10055120-14 = "We're the only ones who damaged it, so all we can do is make up for our mistake."
10055120-15 = "...You don't get students with character like yours these days."
10055120-16 = "Hanuma Makoto, was it? I won't forget that."
10055120-17 = "Kihehe! Not a single one of my people shall ever be left behind!"
10055120-18 = "This is the art of leadership, Makoto style!"
10055120-20 = ""
10055120-21 = ""
10055120-22 = ""
10055120-23 = "Still... A ship, huh..."
10055120-24 = "Makoto?"
10055120-25 = "Aren't we done here? Why are you suddenly staring out at the sea and sighing?"
10055120-26 = "...For all that happened, the Bismaru still ended up sinking."
10055120-27 = "Considering our opponent..."
10055120-28 = "Surely you didn't think we would emerge victorious?"
10055120-29 = "No, no. That's not what I mean."
10055120-30 = "While most things in life can be solved with fighting spirit, there are some times in life when no amount of fighting spirit can overcome your circumstances."
10055120-31 = "Still... It really is a shame."
10055120-32 = "A shame?"
10055120-33 = "The feeling that vibrates through your entire body! The thunderous blasts and billowing smoke that set your heart ablaze!"
10055120-34 = "Experiencing it firsthand made me realize just how powerful surface warships and their naval guns are! I've seen the true limitless potential they hold!"
10055120-35 = "The grief of losing the Bismaru still lingers!"
10055120-36 = "But we cannot dwell on things lost forever! Gehenna must look ever forward!"
10055120-37 = "Which is why I will begin plans to build Bismaru II as soon as we return!"
10055120-38 = "Come again?"
10055120-39 = "We'll build a colossal battleship, bigger than Bismaru the First! And bigger than any of Odyssey's ships!"
10055120-40 = "Well, why not?"
10055120-41 = "However, how do you intend to fund this?"
10055120-42 = "Just take it from the Prefect Team's budget! They get more than they deserve, anyway!"
10055120-43 = "Two problems solved at once! Another brilliant plan from the Great Makoto! Kihehe!"
10055120-44 = "No, what you're doing is creating a million new problems for me to solve."
10055120-45 = "Ooh! I can smell a huge scoop coming!"
10055120-46 = "Here, I've got a headline for you: Pandemonium Society Chairman Impeached."
10055120-47 = "Kihehe! Just you wait, Odyssey!"
