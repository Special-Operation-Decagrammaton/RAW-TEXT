[translation]
10055120-1 = "후일담;꿈의 전함"
10055120-2 = "……그런 일이 있었나."
10055120-3 = "미안하네. 내가 제대로 관리를 안 해서 고생을 시켰어."
10055120-4 = "아, 아뇨, 괜찮습니다."
10055120-5 = "경고는 충분히 해주셨는데, 저희 쪽에서 멀리 나간 거니까요."
10055120-6 = "……그나저나."
10055120-7 = "도대체 번쩍거리는 새 배는……?"
10055120-8 = "음, 파손한 배에 대한 보상이다만."
10055120-9 = "혹시 부족한 건가?"
10055120-10 = "아, 아니! 오히려 그 반대지!"
10055120-11 = "그 배는 암만 잘 쳐줘도 견인비나 나올까 하는 고철이었는데, 그걸 이런 최신형 배로……."
10055120-12 = "그렇다 해도, 물건의 가치는 가격만으로 정해지는 것이 아니지 않나."
10055120-13 = "수십 년의 세월을 함께한 배라면, 그럭저럭 애착도 있을 터."
10055120-14 = "그것을 우리 쪽에서 멋대로 파손하였으니, 최선의 보상을 지불할 뿐이다."
10055120-15 = "……정말, 요즘 세상에 보기 드문 인품을 가진 학생이군."
10055120-16 = "하누마 마코토라 했던가? 그 이름은 절대 잊지 않겠네."
10055120-17 = "키시싯! 한 명의 민중조차 놓치지 않는다!"
10055120-18 = "이것이 마코토 님의 제왕학이다!"
10055120-23 = "그렇다고는 해도, 배인가……."
10055120-24 = "마코토 쨩?"
10055120-25 = "볼일 끝난 거 아니야? 갑자기 왜 바다를 보면서 한숨을 쉬어?"
10055120-26 = "……이러니저러니 해도, 결국 가라앉고 말았지. 비스마루."
10055120-27 = "상대가 상대니까."
10055120-28 = "혹시 진심으로 이길 수 있었다고 생각한 거야?"
10055120-29 = "그렇지는 않다."
10055120-30 = "물론, 세상일의 대부분은 기합으로 해결할 수 있다만, 당시 상황은 기합만으로 뒤집기에는 명확한 열세였지."
10055120-31 = "다만, ……역시 아쉽군."
10055120-32 = "아쉽다?"
10055120-33 = "그 전신을 가로지르는 울림! 가슴 떨리는 폭음과 폭연!"
10055120-34 = "직접 체험하고 나서 깨달았지! 수상함과 그 위의 함포들이 얼마나 위력적이고, 또 가능성이 있는지!"
10055120-35 = "비스마루를 잃은 것은, 역시나 뼈 아픈 손실이군!"
10055120-36 = "……아니, 잃은 것을 돌아볼 때가 아니다! 우리는 나아가야만 한다!"
10055120-37 = "게헨나로 돌아가면, 곧바로 비스마루 2호의 건함 계획에 착수하겠다!"
10055120-38 = "……하아?"
10055120-39 = "비스마루 1호는 물론이고, 오디세이아의 어떤 배보다 커다란 초거대전함을 만드는 거다!"
10055120-40 = "흐응? 뭐, 좋지 않아?"
10055120-41 = "근데 우리한테 그럴 돈이 있던가?"
10055120-42 = "선도부의 예산을 삭감하면 된다! 녀석들에게는 과분할 정도의 예산이 돌아가고 있으니 말이다!"
10055120-43 = "한 번에 두 개의 문제를 해결하는 것이지! 역시 이 몸의 묘책이로군! 키시싯!"
10055120-44 = "해결되는 문제는 없고, 다른 문제가 생길 거 같네요."
10055120-45 = "오오~! 벌써부터 대특종의 예감이 드네요~!"
10055120-46 = "뭐, 만마전 의장 탄핵이라면 꽤 괜찮은 기사가 되겠죠."
10055120-47 = "키시싯! 두고 봐라, 오디세이아 놈들!"
