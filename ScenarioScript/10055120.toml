[translation]
10055120-1 = "後日談;夢之戰艦"
10055120-2 = "……原來發生過那種事啊。"
10055120-3 = "抱歉啊。是我的管理不當讓你們吃苦了。"
10055120-4 = "啊，不會，沒關係的。"
10055120-5 = "您已經提醒過我們了，是我們自己跑得太遠。"
10055120-6 = "……話說。"
10055120-7 = "這艘閃閃發亮的新船到底是……？"
10055120-8 = "嗯？這是弄壞船的賠償啊。"
10055120-9 = "難道不夠嗎？"
10055120-10 = "啊，不不！正好相反！"
10055120-11 = "那艘船再怎麼估也頂多值個拖吊費，竟然換成這種最新型的船……"
10055120-12 = "就算是這樣，東西的價值也不是只由價格決定的吧。"
10055120-13 = "既然是共度了數十年歲月的船，應該也有幾分感情才對。"
10055120-14 = "考慮到是我們把它弄壞的，支付最好的賠償也是理所當然的事。"
10055120-15 = "……這年頭很少見到人品這麼好的學生了啊。"
10055120-16 = "你說你叫羽沼真琴是吧？我絕對不會忘記這個名字的。"
10055120-17 = "嘰嘻嘻！哪怕只是一位民眾，本大人也不會忽略！"
10055120-18 = "這就是真琴大人的帝王學！"
10055120-20 = ""
10055120-21 = ""
10055120-22 = ""
10055120-23 = "不過，船啊……"
10055120-24 = "真琴醬？"
10055120-25 = "事情不是辦完了嗎？怎麼突然看著海嘆氣？"
10055120-26 = "……結果最後還是沉了啊，俾斯丸。"
10055120-27 = "畢竟是面對那種等級的對手嘛。"
10055120-28 = "你該不會真的以為能贏吧？"
10055120-29 = "倒也不是。"
10055120-30 = "當然，世上大部分的事都能靠氣勢解決，#n但當時的狀況明顯處於劣勢，光靠氣勢是扭轉不了的。"
10055120-31 = "只是……果然還是很可惜啊。"
10055120-32 = "可惜？"
10055120-33 = "那貫穿全身的震動！撼動胸口的轟鳴與硝煙！"
10055120-34 = "親身體驗過後本大人才明白！#n水面艦艇與艦上的艦砲有多麼強大，又有多少可能性！"
10055120-35 = "失去俾斯丸，果然是令人心痛的損失啊！"
10055120-36 = "……不，現在不是緬懷過去的時候！我們必須向前邁進！"
10055120-37 = "一回到格黑娜，就立刻著手俾斯丸2號的建艦計畫！"
10055120-38 = "……什麼？"
10055120-39 = "比俾斯丸1號更大是理所當然，#n要打造的是比奧德賽任何一艘船都還要巨大的超巨型戰艦！"
10055120-40 = "哼嗯？這不是挺好的嗎？"
10055120-41 = "不過我們有那種錢嗎？"
10055120-42 = "刪減風紀委員會的預算就行了！#n那群傢伙拿到的預算多到根本不配！"
10055120-43 = "一次解決兩個問題！不愧是本大人的妙計！嘰嘻嘻！"
10055120-44 = "別說解決問題了，感覺反而會冒出新的問題呢。"
10055120-45 = "哦哦～！已經有大獨家的預感了～！"
10055120-46 = "如果是「萬魔殿議長遭到彈劾」，應該會是篇不錯的報導吧。"
10055120-47 = "嘰嘻嘻！等著瞧吧，奧德賽的傢伙們！"
