[translation]
10055120-1 = "ย้อนวันวาน;เรือรบในฝัน"
10055120-2 = "เกิดเรื่องแบบนั้นเข้าให้จนได้สินะ..."
10055120-3 = "ขอโทษด้วยนะ ฉันดูแลเรือได้ไม่ดีพอเลยทำให้พวกเธอลำบาก"
10055120-4 = "มะ... ไม่เลยค่ะ ไม่เป็นไรค่ะ"
10055120-5 = "คุณเตือนพวกเรามาตั้งเยอะแล้ว แต่พวกเราดันออกไปไกลกันเองค่ะ"
10055120-6 = "ว่าแต่ว่า..."
10055120-7 = "เรือลำใหม่ที่เป็นประกายวิบวับนั่น...?"
10055120-8 = "อืม เราเอามาชดเชยเรือที่เสียหายน่ะ"
10055120-9 = "แค่นี้ไม่พองั้นเหรอ?"
10055120-10 = "ปะ... เปล่า! ตรงกันข้ามเลยต่างหาก!"
10055120-11 = "เรือลำนั้นเป็นแค่เศษเหล็กที่ต่อให้ขายได้ราคาดี ก็ยังไม่รู้จะพอจ่ายค่าลากเรือรึเปล่าเลย แต่พวกเธอกลับเอาเรือรุ่นใหม่มาทดแทนให้กันแบบนี้..."
10055120-12 = "ถึงอย่างนั้น คุณค่าของสิ่งของมันก็ไม่ได้ตัดสินกันด้วยราคาอย่างเดียวไม่ใช่หรือ?"
10055120-13 = "ถ้าเป็นเรือที่อยู่ด้วยกันมาหลายสิบปีก็คงต้องผูกพันเป็นธรรมดา"
10055120-14 = "ในเมื่อฝ่ายเราเป็นคนทำมันพัง ก็ต้องชดใช้ให้ดีที่สุดเท่านั้น"
10055120-15 = "เป็นนักเรียนที่มีจิตใจดีงามหาได้ยากในยุคนี้จริงๆ เลยนะ..."
10055120-16 = "ชื่อฮานุมะ มาโคโตะสินะ? ฉันจะไม่มีวันลืมชื่อนี้เลย"
10055120-17 = "คิกคิกคิก! เราไม่เคยละเลยพลเมืองแม้แต่คนเดียว!"
10055120-18 = "นี่คือวิถีการปกครองของท่านมาโคโตะผู้นี้ยังไงล่ะ!"
10055120-20 = ""
10055120-21 = ""
10055120-22 = ""
10055120-23 = "ถึงอย่างนั้นก็เถอะ เรื่องเรือน่ะ..."
10055120-24 = "มาโคโตะจัง?"
10055120-25 = "เสร็จธุระแล้วไม่ใช่เหรอ? ทำไมจู่ๆ มองทะเลแล้วถอนหายใจล่ะ?"
10055120-26 = "ไม่ว่ายังไง สุดท้ายก็จมไปจนได้สินะ... บิสมารุ"
10055120-27 = "ก็อีกฝ่ายเป็นพวกนั้นเลยนะ"
10055120-28 = "หรือว่าคิดจริงๆ ว่าจะชนะพวกนั้นได้?"
10055120-29 = "เราไม่ได้คิดแบบนั้นหรอก"
10055120-30 = "แน่นอนว่าเรื่องส่วนใหญ่แก้ได้ด้วยพลังใจ แต่ตอนนั้นเราเสียเปรียบชัดเจนเกินกว่าจะพลิกสถานการณ์ได้#nด้วยพลังใจเพียงอย่างเดียว"
10055120-31 = "แต่ว่า... มันก็น่าเสียดายจริงๆ นะ"
10055120-32 = "น่าเสียดาย?"
10055120-33 = "แรงสั่นสะเทือนที่สะท้านไปทั้งร่างกาย! เสียงระเบิดกึกก้องและควันโขมงที่ทำให้ใจเต้นระรัว!"
10055120-34 = "พอได้สัมผัสเองแล้วเราก็ตระหนักว่าเรือรบผิวน้ำกับปืนใหญ่บนเรือมีอานุภาพและศักยภาพมากเพียงใด!"
10055120-35 = "การสูญเสียบิสมารุนับเป็นความเสียหายที่น่าเจ็บปวดจริงๆ!"
10055120-36 = "ไม่สิ... นี่ไม่ใช่เวลามาอาลัยอาวรณ์กับสิ่งที่เสียไป! พวกเราต้องก้าวต่อไปข้างหน้า!"
10055120-37 = "กลับไปเกเฮนน่าเมื่อไร เราจะเริ่มแผนการสร้างบิสมารุลำที่ 2 ทันที!"
10055120-38 = "หา...?"
10055120-39 = "เราจะสร้างเรือรบขนาดใหญ่ที่ไม่ใช่แค่ใหญ่กว่าบิสมารุลำที่ 1 แต่ใหญ่กว่าเรือทุกลำของโอดิสซีย์ด้วย!"
10055120-40 = "หืม? แบบนั้นก็ดีนะ?"
10055120-41 = "แต่พวกเรามีเงินขนาดนั้นด้วยเหรอ?"
10055120-42 = "ก็ลดงบประมาณของคณะกรรมการวินัยซะสิ! ยังไงพวกนั้นก็ได้รับงบประมาณมากเกินความจำเป็น#nอยู่แล้ว!"
10055120-43 = "แก้ปัญหาสองอย่างได้ในคราวเดียวเลย! สมกับเป็นสุดยอดแผนการของท่านมาโคโตะผู้นี้จริงๆ! คิกคิกคิก"
10055120-44 = "ดูท่าจะไม่ได้แก้ปัญหาอะไร แต่คิดจะสร้างปัญหาใหม่ขึ้นมาแทนนะคะ"
10055120-45 = "โอ้ววว~! รู้สึกเหมือนจะได้สกู๊ปพิเศษใหญ่ตั้งแต่ตอนนี้แล้วค่ะ~!"
10055120-46 = "อืม ถ้าเป็นข่าวการถอดถอนประธานแพนเดโมเนียม โซไซตี้ก็คงเป็นสกู๊ปข่าวที่ดีทีเดียวค่ะ"
10055120-47 = "คิกคิกคิก! คอยดูเถอะ พวกโอดิสซีย์!"
