[translation]
10055120-1 = "#title;후일담;꿈의 전함"
10055120-2 = "3;어부;01;……그런 일이 있었나.\n#3;a\n#3;em;[한숨]"
10055120-3 = "3;어부;01;미안하네. 내가 제대로 관리를 안 해서 고생을 시켰어."
10055120-4 = "3;이로하;01;아, 아뇨, 괜찮습니다.\n#3;em;[반응]"
10055120-5 = "3;이로하;99;경고는 충분히 해주셨는데, 저희 쪽에서 멀리 나간 거니까요."
10055120-6 = "3;어부;01;……그나저나."
10055120-7 = "3;어부;01;도대체 번쩍거리는 새 배는……?"
10055120-8 = "3;어부;01\n5;마코토;01;음, 파손한 배에 대한 보상이다만.\n#3;m1\n#5;a"
10055120-9 = "5;마코토;02;혹시 부족한 건가?\n#5;em;[?]"
10055120-10 = "3;어부;01;아, 아니! 오히려 그 반대지!\n#3;jump"
10055120-11 = "3;어부;01;그 배는 암만 잘 쳐줘도 견인비나 나올까 하는 고철이었는데, 그걸 이런 최신형 배로……."
10055120-12 = "5;마코토;03;그렇다 해도, 물건의 가치는 가격만으로 정해지는 것이 아니지 않나."
10055120-13 = "5;마코토;99;수십 년의 세월을 함께한 배라면, 그럭저럭 애착도 있을 터.\n#5;em;[…]"
10055120-14 = "5;마코토;25;그것을 우리 쪽에서 멋대로 파손하였으니, 최선의 보상을 지불할 뿐이다."
10055120-15 = "3;어부;01;……정말, 요즘 세상에 보기 드문 인품을 가진 학생이군."
10055120-16 = "3;어부;01;하누마 마코토라 했던가? 그 이름은 절대 잊지 않겠네.\n#3;em;[?]"
10055120-17 = "5;마코토;03;키시싯! 한 명의 민중조차 놓치지 않는다!\n#5;em;[재잘]"
10055120-18 = "3;마코토;20;이것이 마코토 님의 제왕학이다!\n#5;hide\n#3;closeup"
10055120-19 = "#all;hide"
10055120-20 = "3;마코토;01\n#3;a\n#wait;1500"
10055120-21 = "3;마코토;99\n#3;m4\n#wait;1500"
10055120-22 = "3;마코토;02\n#3;em;[한숨]\n#wait;1500"
10055120-23 = "3;마코토;99;그렇다고는 해도, 배인가……."
10055120-24 = "3;마코토;99\n1;사츠키;15;마코토 쨩?\n#1;a"
10055120-25 = "1;사츠키;01;볼일 끝난 거 아니야? 갑자기 왜 바다를 보면서 한숨을 쉬어?\n#1;em;[?]"
10055120-26 = "4;마코토;06;……이러니저러니 해도, 결국 가라앉고 말았지. 비스마루.\n#3;hide"
10055120-27 = "1;사츠키;01;상대가 상대니까.\n#1;em;[...]"
10055120-28 = "1;사츠키;03;혹시 진심으로 이길 수 있었다고 생각한 거야?"
10055120-29 = "4;마코토;02;그렇지는 않다.\n#4;em;[반응]"
10055120-30 = "4;마코토;05;물론, 세상일의 대부분은 기합으로 해결할 수 있다만, 당시 상황은 기합만으로 뒤집기에는 명확한 열세였지."
10055120-31 = "4;마코토;06;다만, ……역시 아쉽군."
10055120-32 = "1;사츠키;15;아쉽다?\n#1;em;[?]"
10055120-33 = "4;마코토;21;그 전신을 가로지르는 울림! 가슴 떨리는 폭음과 폭연!\n#4;jump"
10055120-34 = "4;마코토;07;직접 체험하고 나서 깨달았지! 수상함과 그 위의 함포들이 얼마나 위력적이고, 또 가능성이 있는지!"
10055120-35 = "4;마코토;22;비스마루를 잃은 것은, 역시나 뼈 아픈 손실이군!\n#4;em;[세로선]"
10055120-36 = "4;마코토;23;……아니, 잃은 것을 돌아볼 때가 아니다! 우리는 나아가야만 한다!"
10055120-37 = "3;마코토;07;게헨나로 돌아가면, 곧바로 비스마루 2호의 건함 계획에 착수하겠다!\n#4;hide\n#1;hide\n#3;closeup\n#3;em;[!]"
10055120-38 = "5;???;01\n#5;h\n#5;hide\n#na;이로하;……하아?"
10055120-39 = "3;마코토;20;비스마루 1호는 물론이고, 오디세이아의 어떤 배보다 커다란 초거대전함을 만드는 거다!\n#3;closeup"
10055120-40 = "3;사츠키;02;흐응? 뭐, 좋지 않아?"
10055120-41 = "3;사츠키;15;근데 우리한테 그럴 돈이 있던가?\n#3;em;[?]"
10055120-42 = "3;마코토;21;선도부의 예산을 삭감하면 된다! 녀석들에게는 과분할 정도의 예산이 돌아가고 있으니 말이다!"
10055120-43 = "3;마코토;25;한 번에 두 개의 문제를 해결하는 것이지! 역시 이 몸의 묘책이로군! 키시싯!\n#3;em;[재잘]"
10055120-44 = "3;이로하;05;해결되는 문제는 없고, 다른 문제가 생길 거 같네요.\n#5;hide"
10055120-45 = "3;이로하;05\n1;치아키;03;오오~! 벌써부터 대특종의 예감이 드네요~!\n#1;a\n#1;em;[반짝]\n#3;m5"
10055120-46 = "3;이로하;06;뭐, 만마전 의장 탄핵이라면 꽤 괜찮은 기사가 되겠죠."
10055120-47 = "3;마코토;03;키시싯! 두고 봐라, 오디세이아 놈들!\n#3;closeup\n#3;em;[!]\n#1;hide"
10055120-48 = "#continued"
