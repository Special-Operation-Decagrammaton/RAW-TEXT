[translation]
80000024-1 = "가짜 나사"
80000024-2 = "샬레 생활관"
80000024-3 = "(갑자기 샬레의 불이 나가 마침 당번 활동을 하고 있던 우타하에게 도움을 요청했다.)"
80000024-10 = "후우, 드디어 해결했네."
80000024-11 = "큰 문제는 아니었어. 서킷 박스의 커버가 헐거워지면서 차단기의 버튼을 건드린 모양이야."
80000024-12 = "전선을 손봐야 할 필요는 없겠지만, 헐거워진 커버는 새로 교체해야겠어."
80000024-13 = "선생님. 잠깐 그쪽의 경첩을 손으로 고정하고 있어 줄래?"
80000024-14 = "그동안 내가 가져온 나사로 이쪽의 경첩을 고정할게."
80000024-15 = "[s] \"알겠어.\""
80000024-19 = "먼저 홈에 경첩을 끼우고, 그 위에 나사를 돌려 마무리를 하면……"
80000024-24 = "응? 나사가 깨졌잖아?"
80000024-25 = "이상한 일이네. 다른 부분도 아니고 나사가 깨지다니…… 불량품이 섞였나?"
80000024-26 = "가져온 다른 나사로 다시 한번……."
80000024-31 = "다시 나사가 또 깨졌다고?"
80000024-32 = "한 번도 아니고 두 번이나 연속으로 나사가 깨지다니, 이건 그냥 넘어갈 수 없겠네."
80000024-33 = "부품의 내구도는 사용자의 안전과도 직결될 수 있는 문제인데, 이런 불량품을 유통시키다니……"
80000024-34 = "어느 회사의 물건인지 확인해서 확실히 항의해야겠어!"
80000024-38 = "어라, 이건……?"
80000024-39 = "하하…… 결국 이쪽 문제였나."
80000024-40 = "[s] \"특별한 거라도 찾았어?\""
80000024-41 = "선생님. 내가 준 나사의 표면을 한번 손톱으로 긁어봐."
80000024-46 = "[ns] \"이건…… 초콜릿이잖아?\""
80000024-47 = "응. 그건 진짜 나사가 아니라, 나사 모양으로 포장한 초콜릿이야."
80000024-48 = "전에 코토리와 히비키가 재미있어 보인다며 당분 보충용으로 사다 놓은 걸 까맣게 잊고 있었어."
80000024-49 = "안쪽이 금속이 아닌 초콜릿으로 되어 있었으니, 힘을 받으면 깨지는 게 당연하지. 미리 발견하게 되어서 다행이야."
80000024-50 = "아무래도 엔지니어부에 돌아가서 제대로 된 나사를 다시 가져와야겠네."
80000024-55 = "음……."
80000024-56 = "선생님, 내가 다녀오는 동안 이 나사 초콜릿이라도 잠깐 먹고 있을래?"
80000024-57 = "모양은 기계 부품처럼 생기긴 했지만, 맛은 제법 나쁘지 않을 거야."
