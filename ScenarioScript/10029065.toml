[translation]
10029065-6 = "뭐야……! 아까 전보다 더 많은 거 아냐, 이거!? 진짜 끝이 없잖아!!"
10029065-7 = "당연해. 그만큼 저쪽에서도 중요한 설비니까. 나름대로 총력을 다해 지키려는 거겠지."
10029065-12 = "배리어도 여전히 건재하고……."
10029065-14 = "드론들도 계속 충원되고 있어. 상대하는 것 자체는 문제가 안 되지만……."
10029065-15 = "이대로라면 저쪽 설비의 '작동'을 막을 여유가 없겠어."
10029065-16 = "정말 조금만 나가면 되는 코 앞인데!! 여기까지 처음부터 다시 와야 한다고요!?"
10029065-17 = "아니, 또 왔을 때에도 마찬가지의 상황이 되는 건가요!? 무한 반복……!?"
10029065-18 = "그건 좀……!!"
10029065-19 = "하아아아아아앗-!!!"
10029065-23 = "……? 응? 뭐죠?"
10029065-24 = "이 소리는……."
10029065-25 = "……!! 마침 계기판에 가까이 있는 사람이!!"
10029065-26 = "……사텐 씨!?!?"
10029065-28 = "저걸 부수면 된다는 거죠!? 저것만 부수면 어떻게든 된다는 거죠!?"
10029065-29 = "그런 거라면야……! 제가……!!"
10029065-30 = "으아아아!? 자, 잠깐만요……! 아직은 총탄을 방어하는 배리어가……!!"
10029065-31 = "총탄이 안 된다면……!!"
10029065-32 = "……직접 때려 부수면 되죠!!"
10029065-33 = "하아아아앗-!!"
10029065-47 = "하아, 하아……. 하아……. 하아……."
10029065-53 = "하아, 하아……."
10029065-54 = "……초……."
10029065-55 = "총신으로 때려 부쉈어……."
10029065-56 = "뭐, 뭐죠? 방금 그 배팅 자세……? 혹시 야구 선수셨다든가……!?"
10029065-57 = "……됐……나요? 된 건가?"
10029065-58 = "뭔가 조금 조용해진 것 같기도 하고……."
10029065-59 = "[s1] \"그런……가?\"\n[s2] \"확실히 드론도 멈춘 것 같고…….\""
10029065-62 = "설마 해결된……건가? 이렇게 쉽게……?"
10029065-63 = "뭔가……."
10029065-64 = "생각보다 너무 쉽게 해결된 듯한……."
10029065-65 = "……미사카 씨."
10029065-66 = "……아."
10029065-67 = "뭔가 지금의 그 발언, 이후에 플래그가 될 것 같은 느낌이……."
10029065-72 = "……후후."
10029065-74 = "역시나였네요!!"
10029065-75 = "뭐, 뭐!?"
10029065-81 = "……정말 대단한 사람이네."
10029065-82 = "기계에서 빛이……!!"
10029065-83 = "……!"
10029065-84 = "으아아아아아아아아-!?!?"
10029065-93 = "……어라?"
10029065-95 = "……?"
10029065-96 = "……음?"
10029065-97 = "뭐……였지?"
10029065-101 = "다들 무사한 거……지? 사라진 사람 없어?"
10029065-102 = "네, 네……. 전 괜찮아요."
10029065-103 = "[s3] \"모두 무사한 거 같아.\"\n[s4] \"아무 일도 일어나지 않은 건가?\""
10029065-106 = "작동 불발……인 건가?"
10029065-107 = "적절한 타이밍에 물리적인 타격을 입혀, 제 기능을 발휘하지 못한 걸까요!?"
10029065-108 = "진짜 그대로 해결돼 버린 거라고요!?"
10029065-109 = "애초에 목적은 기기를 고치는 거였으니까, 해결이라기에는 좀……."
10029065-110 = "……아니."
10029065-111 = "……기기는 작동했어. 작동 방향이 반대로 꼬였을 뿐."
10029065-112 = "보내는 걸 멈춘 게 아니라……. 으음……."
10029065-113 = "……오히려 불러오는 쪽."
10029065-114 = "[s] \"………….\""
10029065-116 = "[ns] \"……네??\""
10029065-132 = "!?"
