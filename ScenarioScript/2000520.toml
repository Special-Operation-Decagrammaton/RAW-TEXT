[translation]
2000520-1 = "심야의 홍차"
2000520-2 = "(모처럼 휴양을 위해 바다를 찾았지만, 어째서인지 가는 곳마다 시민들의 부탁이 끊이질 않았다……)"
2000520-8 = "혹시 손님……?"
2000520-9 = "그 키보토스의 해결사로 이름난 샬레의 [USERNAME] 선생님 아니신가요……?"
2000520-10 = "[s] \"일단은 그렇습니다만……\""
2000520-11 = "이야, 그 유명한 [USERNAME] 선생님께서 저희 가게를 찾아 주실 줄이야. 정말 영광입니다!"
2000520-12 = "안 그래도 선생님께서 이 근처에 오셨다고 해서 혹시나 저희 가게에 오시지는 않을까 기대하고 있었거든요."
2000520-13 = "저희 가게에서 이번에 신메뉴를 내놓았는데, 어째서인지 학생들의 반응이 영 좋지 않아서요."
2000520-14 = "고심에 고심을 거듭했지만 요즘 학생들의 생각이라는 게 알기 어려워서……"
2000520-15 = "혹시 괜찮으시다면, 학생들과 교류가 많은 선생님께서 이 신메뉴에 대해 직접 조언해 주실 수 있으실까요?"
2000520-16 = "[s] \"제 의견이라도 괜찮으시다면야……\""
2000520-22 = "도, 도와주세요……! 해안가의 불량 학생들이 제 지갑을 빼앗아 갔어요……!"
2000520-23 = "그 지갑 안에 1주일 치 식비가 모두 들어있는데……"
2000520-24 = "이대로 지갑을 되찾지 못하면 남은 휴가 동안 마른미역만으로 배를 채워야 할지도……"
2000520-25 = "[s1] \"잠시만 기다려 주세요.\"\n[s2] \"바로 그 학생들을 찾아 지갑을 받아오겠습니다.\""
2000520-32 = "으앙, 언니~ 어디 간 거야~"
2000520-33 = "이럴 줄 알았으면 자리에서 언니를 기다릴 걸…… 우아앙……"
2000520-34 = "[s3] \"길을 잃은 거니?\"\n[s4] \"잠시만 기다리렴. 금방 언니를 찾아줄게.\""
2000520-45 = "(쏟아지는 사건들을 처리하다 보니, 어느새 시간이 훌쩍 흘러 밤이 되고 말았다……)"
2000520-47 = "(조금 늦은 해변 산책을 즐기려던 찰나……)"
2000520-59 = "[ns] \"히, 히후미……?\""
2000520-60 = "어라, 선생님? 이렇게 늦은 시간에 바닷가에는 무슨 일이신가요?"
2000520-61 = "……네? 하루 종일 사건을 해결하느라 지쳐 잠시 기분 전환을 위해 산책을 나오셨다고요?"
2000520-62 = "아하하…… 우연이네요. 저도 마침 밤바다의 공기가 마시고 싶어서 혼자 드라이브를 나온 참이었거든요."
2000520-63 = "[s5] \"이렇게 늦은 시간의 드라이빙이라니……\"\n[s6] \"조금은 위험하지 않겠어?\""
2000520-66 = "괜찮아요. 심야의 드라이브를 대비해서 여러 가지 준비물을 꼼꼼히 챙겨왔거든요."
2000520-67 = "어두운 해변을 환하게 밝혀줄 수 있는 앵그리 아델리 씨 모양의 서치라이트와……"
2000520-68 = "밤에도 체온을 따듯하게 덥혀줄 수 있는 페로로님 담요!"
2000520-69 = "그리고 혹시라도 무서운 불량 학생이 시비를 걸 때를 대비한 크루세이더용 유산탄까지—"
2000520-70 = "[s] \"마지막 물건은 없어도 괜찮을 것 같아……\""
2000520-71 = "아, 그리고 이것도 준비했어요……!"
2000520-77 = "모모프렌즈 발매 1주년 기념으로 출시된 전차용 티포트예요!"
2000520-78 = "혹시 차를 마실 일이 있을지도 몰라서 드라이브를 나올 때 티포트도 챙겨서 가져왔어요."
2000520-85 = "[ns] \"전차용 티포트……?\""
2000520-86 = "네, 전에도 말씀드렸지만, 전차에서는 온수를 쓸 일이 많으니까요."
2000520-87 = "주행 중의 티타임이라던가, 전차의 청소에 필요한 더운물이라던가……"
2000520-88 = "그리고 이렇게…… 아름다운 야경이 펼쳐진 장소에서 선생님과 우연히 마주쳤을 때라던가……."
2000520-92 = "선생님. 홍차라면 금방 준비해 드릴 수 있는데, 차 한 잔 어떠신가요?"
2000520-93 = "어두운 밤바다를 바라보며 즐기는 티타임도 제법 운치가 있을 거예요."
2000520-94 = "[s] \"그럼 한 잔 부탁할게.\""
2000520-95 = "네, 잠시만 기다려 주세요!"
2000520-100 = "(이후, 달빛이 어린 바다를 바라보며 히후미와 함께 느긋이 홍차를 즐겼다.)"
