[translation]
2600506-1 = "You are my sunshine"
2600506-2 = "(요시미가 말한 신상을 사들고, 수업 중인 트리니티의 학교 건물 1층에 도착했다.)"
2600506-3 = "(아직은 수업 종료 시간이 아니었기에, 신발장에는 아무도 없었다.)"
2600506-4 = "[s] 요시미의 신발장에 디저트를 넣어둔다."
2600506-6 = "네, 거기 변태 씨. 그대로 스톱!!"
2600506-9 = "뭐 하는 짓이야!? 아주 딱 걸렸어! 누군진 몰라도 그냥은 못 넘어갈 줄 알아!!"
2600506-10 = "이대로 붙잡아다 정의실현부에 넘겨서……"
2600506-11 = "……?"
2600506-12 = "……어라? 뭐야, 선생님? ……선생님이 여기 왜 있는 거야?"
2600506-13 = "……내 신발장에서는 뭐 하는 거고?"
2600506-14 = "[s1] \"잠시 용무가 좀 있어서.\"\n[s2] \"물론, 킁카킁카 중이었지.\""
2600506-15 = "아, 네. 그러시겠죠. 뭐 잘 알겠고요."
2600506-16 = "수업중인 여고생 신발장에 무슨 용무가 있으셨는지는 모르겠지만……"
2600506-17 = "캬악-!! 쫌!! 아 제발!!"
2600506-18 = "그런 소리 좀 하지 말라고 몇 번을 말해! 몇 번을!!"
2600506-19 = "대체 내 말을 뭘로 듣고……!"
2600506-20 = "……응? 이게 뭐야? 뭘 넣어둔 거야?"
2600506-23 = "……이건!!"
2600506-24 = "카페밀피유의 오늘 신상 <선샤인무스>잖아!!"
2600506-25 = "어, 어떻게 구했어? 아니, 그 이전에……"
2600506-26 = "이거 가져다 주려고 온 거야? 일부러 여기까지?"
2600506-27 = "선생님……"
2600506-28 = "……응? 그러는 나는 수업 시간 안 끝났는데 도중에 나왔냐고?"
2600506-29 = "실례시네! 짼 거 아니거든! 조금 일찍 끝나서 빨리 달려온 것뿐이라고!"
2600506-30 = "수업하던 강사 로봇이 복통으로 양호실에 실려가는 바람에……"
2600506-31 = "……뭐?"
2600506-32 = "……사실은 다 알면서 보고 싶어 가지고 일찍 뛰어온 거 아니냐고?"
2600506-33 = "알았겠냐!! 알았으면 이렇게 놀랬을 리도 없잖아!! 말이 되는 소리를 해라!!"
2600506-34 = "그리고 보고 싶어서라니!! 하여간 여전히 못 하는 소리가 없네, 이 인간은!!"
2600506-35 = "……"
2600506-36 = "……"
2600506-37 = "……히히."
2600506-38 = "뭐, 아무튼 좋아. 일단은 빨리 여길 나가자."
2600506-39 = "조금 있으면 다른 애들도 우르르 몰려와서 구경거리가 될 거라고. 얼레리꼴레리 하고."
2600506-40 = "아무래도 역시 그건 좀 곤란하겠지? 선생님이니까."
2600506-41 = "마침 갈 만한 곳도 생각해 놨으니까. 답례도 할 겸, 마실 건 내가 쏠 게."
2600506-42 = "[s] 요시미와 함께 나간다."
2600506-49 = "[wa:1300]― 정말이지,"
2600506-51 = "― 선생님 때문에 [wa:400]매번 놀란다고 해야 할까…….[wa:900]"
2600506-54 = "― 휘둘린다고 [wa:1100]해야 할까……."
2600506-57 = "[wa:300]― ……응? [wa:1000]뭘 그렇게 [wa:700]빤히 보는 거야?"
2600506-59 = "― 저기, [wa:800]설마 또 이상한 생각 [wa:1100]하고 있는 건 아니겠지?"
2600506-62 = "[wa:500]― 난 선생님의 [wa:1000]장난감이 아니라고."
2600506-64 = "― 적당히 하지 않으면 [wa:900]진짜로 화 낼 거야."
2600506-67 = "[wa:1000]― …아니, 뭐. [wa:1100]그렇게까지 싫다는 건[wa:2200] 아니지만…"
2600506-69 = "― 후후."
2600506-72 = "[wa:1300]― (언젠가는……)"
2600506-74 = "― (언젠가는 [wa:400]이렇게 옆에서……. [wa:3500]나란히 걷는 날도 오지 않을까…?)"
2600506-77 = "……히히."
2600506-78 = "생각해 보니 누가 이렇게 내가 바라는 걸 먼저 구해줬던 적은 처음이네."
2600506-79 = "그렇게 생각하니 선생님께 받은 이거…… 먹어 버리긴 또 조금 아까운 걸……"
2600506-80 = "하난 동아리실에 가서 디저트 영구보관용 냉동고에 모셔 둘까나."
2600506-81 = "……응?"
2600506-82 = "이제 와서 드는 생각이지만, <선샤인무스>가 무슨 맛인지 궁금하다고?"
2600506-83 = "에에? 설마 하나밖에 안 산 거야? 당연히 두 개 사서 하난 먹어봤을 줄 알았는데."
2600506-84 = "흐음……"
2600506-85 = "아닌가, 차라리 잘 된 걸지도."
2600506-86 = "지금 가려는 카페는 마실 것만 팔고, 디저트를 따로 판매하지는 않거든."
2600506-87 = "그러니까 마실 것만 거기서 시키면, 자기가 들고 온 걸 먹어도 상관없는 곳이야."
2600506-88 = "……그게 무슨 뜻이냐고?"
2600506-89 = "흐흥. 그러니까 가서 같이 먹으면 되겠다, 그런 뜻이지."
2600506-90 = "어때, 괜찮지?"
2600506-91 = "……뭐?"
2600506-92 = "하나 남은 건데 먹어버려도 괜찮냐고?"
2600506-93 = "그야…… 흠. 뭐, 어때. 원래부터 난 못 구하는 걸 선생님이 사와 준 거잖아. 본전이지."
2600506-94 = "게다가……"
2600506-95 = "다른 사람도 아니고…… 선생님이랑 같이 먹는 거니까……"
2600506-96 = "……"
2600506-98 = "왜, 왜 또 그런 표정이야! 웃지 마, 웃지 말라고! 짜증나게!!"
2600506-99 = "캬악-!! 그만, 그만!! 그만!!"
2600506-100 = "그만 하라고 하잖아아아-!!"
2600506-102 = "(이후 요시미에게 등짝을 얻어맞으며 카페로 향했다.)"
2600506-103 = "(카페에서 음료와 챙겨간 디저트를 먹은 뒤, 요시미를 돌려보냈다.)"
