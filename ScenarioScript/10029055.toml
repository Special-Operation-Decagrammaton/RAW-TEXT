[translation]
10029055-5 = "생각보다 많은데……!? 에이미는 지금까지 혼자서 이런 수를 상대했던 거야!?"
10029055-6 = "아니. 지금이 평균보다 많은 수야. 처리하는 데에는 문제가 없겠지만, 이대로라면 시간이 끌리겠어."
10029055-7 = "좀 더 강력한 화력이 있으면 좋을 것 같은데."
10029055-8 = "……강력한 화력?"
10029055-9 = "……!! 강력한 화력!?"
10029055-10 = "그렇군요, 바로 지금이에요! 지금이 기회입니다!!"
10029055-11 = "미코토 씨! 저희가 만들어 드린 레일건이에요!"
10029055-12 = "……어, 어!? 나!?"
10029055-13 = "지금쯤이면 충분히 전력이 충전됐을 거야. 그 총의 발사 모드를 레일건으로 바꾸면 돼."
10029055-15 = "말로만 듣던 휴대용 레일건. 모든 공학도의 꿈이지."
10029055-16 = "드디어 이 두 눈으로 보게 되겠군요! '손에서 나가는 레일건'을……!!"
10029055-17 = "……아하하……. 엄청 기대받고 있네요, 미사카 씨."
10029055-18 = "부, 부담스럽게 뭐 하는 거야! 알았어, 알았다고! 이 총의 모드를 바꾸면 된다고 했지?"
10029055-19 = "이, 이건가……? 이렇게 하면 되나?"
10029055-20 = "서둘러. 꽤 몰려들었으니까."
10029055-21 = "알았다고, 보채지 마……!"
10029055-25 = "……됐다!"
10029055-26 = "모드 변경 끝! ……쏜다!!"
10029055-28 = "……레!!"
10029055-30 = "일……!!"
10029055-32 = "……건!!"
10029055-36 = "[ns] \"……발사!!!\""
10029055-41 = "…………?"
10029055-42 = "……뭐지?"
10029055-43 = "……음?"
10029055-44 = "어……."
10029055-45 = "발사된 건가……? 방금?"
10029055-47 = "……나간 거야, 방금?"
10029055-48 = "뭐, 뭔가가 나간 거 같긴 한데……. 살짝……. 모깃소리 같은 게……."
10029055-49 = "펴, 평소에 보던 거랑 달리 조금 귀엽……네요."
10029055-50 = "시라이 씨가 봤다면, 어떤 반응이었을지……."
10029055-54 = "……계속 온다."
10029055-55 = "그 화력으로는 저지할 수 없겠어. 다른 전술로 서둘러 교체해야 해."
10029055-56 = "시간이 없어. 다른 수가 없다면, 일단 이 길을 폭탄으로 무너뜨리고 B 루트로 가야 해."
10029055-57 = "…………."
10029055-58 = "……쯧. 별수 없나."
10029055-62 = "[ns1] \"미사카? 그건……동전?\"\n[ns2] \"주머니에서 동전을 꺼냈어?\""
10029055-65 = "요지는 저 앞의 기계 녀석들을 쓸면 된다는 거지? 그럼 가던 길로 계속 갈 수 있는 거고?"
10029055-66 = "……다들 뒤로 나와. 컨디션이 평소만큼 좋지는 않지만……."
10029055-67 = "한 발 정도는, 집중하면 쏠 수 있을 것 같으니까."
10029055-68 = "……?"
10029055-69 = "한 발 정도는? 뭘 쏜다는 거야?"
10029055-73 = "……!!"
10029055-74 = "자, 자! 모두 뒤로 나오세요! 가까이 있으면 위험해요! 물러서세요-!"
10029055-75 = "으, 응? 알았다만……."
10029055-76 = "뭐, 뭐죠!? 이 분위기!? 갑작스러운 긴장감!?"
10029055-77 = "갑자기 중장비 다루는 듯한 분위기가 됐네."
10029055-79 = "뭐어……."
10029055-80 = "……틀린 말은 아니라고 생각하고."
10029055-82 = "……바로 간다."
10029055-87 = "……!!!"
10029055-91 = "……후우."
10029055-92 = "아으으……. 머리야."
10029055-93 = "확실히 여기서는 자주 쓸 게 못 되네. 이렇게나 머리가 아파서야……."
10029055-100 = "[ns] \"………….\""
10029055-102 = "[ns3] \"방금 그게…….\"\n[ns4] \"레일…… 건……?\""
10029055-108 = "뭔가 처음 보신 분들이라 그런지, 반응이 굉장하네요."
10029055-109 = "매번 보는 저도 놀랍긴 하지만……."
10029055-110 = "그러네. 정말이지 무식한 위력이랄까. 미사카 씨 다운 이미지랄까."
10029055-111 = "……선생님? 여러분?"
10029055-112 = "계속 멍한 얼굴이야……."
10029055-117 = "…………."
10029055-118 = "……………………."
10029055-120 = "맨손으로……. 레일건……을…… 쐈어……?"
10029055-121 = "비유가 아니라……. 진짜 '맨손'으로……?"
10029055-122 = "이게……. '초능력자'……!"
10029055-123 = "과연. 이게 바로 레일건……!"
10029055-124 = "……!?"
10029055-125 = "으, 으응!? 뭐, 뭐야. 갑자기?"
10029055-126 = "굉장하잖아요……! 어떻게 하는 거지? 손에 그런 힘이 있는 건가요!?"
10029055-127 = "코토리, 원리에 대한 호기심은 이해가 가지만 그런 질문은 자칫 실례가 될 수 있어."
10029055-128 = "그 대신이라기엔 뭐하지만……. 괜찮다면, 한 번만 더 보여줄 수 있을까? 방금의 그 기술?"
10029055-129 = "보, 보여 달라고? 이거? 한 번 더……?"
10029055-130 = "그렇게 막 쓰고 다닐 건 아니라고 생각하는데."
10029055-131 = "……아. 내 정신 좀 봐."
10029055-132 = "미안해. 우리가 부탁하는 일인데, 타인의 돈을 쓰게 만들 수는 없지."
10029055-133 = "히비키, 미안한데 혹시 동전 좀 있을까? 지금 나한테는 없어서……."
10029055-135 = "……뭐?"
10029055-136 = "으음. 있기는 한데, 하필 10엔짜리들 뿐이라……."
10029055-137 = "확실히, 동전의 크기나 가격대에 따라 위력이 바뀌는 기술이라면 지금 우리가 들고 있는 동전으로는 한계가 있겠어."
10029055-138 = "……자, 잠깐. 지금 무슨 소릴 하는 거야? 왜 이야기가 그렇게 돼?"
10029055-139 = "아니, 잠깐만! 이건 그런 문제가 아니고……!"
10029055-141 = "제가 마침 500엔짜리 동전을 가지고 있습니다!"
10029055-142 = "……!! 코토리……! 모두를 위해 그렇게 큰 희생을……!!"
10029055-143 = "저기요? 여보세요? 제 말 좀 들어보시겠어요?"
10029055-144 = "내가 쓰던 건 돈이 아니라 게임 센터 코인이거든……?"
10029055-145 = "다짜고짜 500엔이라니, 그런 아까운 짓을 왜……!"
10029055-146 = "[s5] \"괜찮아. 그냥 감동한 것뿐이야.\"\n[s6] \"원래 좀 쉽게 들뜨는 친구들이라…….\""
10029055-150 = "들리지 않으시는 모양이네요, 다들……."
10029055-151 = "잘 됐네, 미사카 씨. 이세계에서 금방 친구가 생기겠어."
10029055-153 = "잘 되긴 뭐가 잘 돼!!"
10029055-154 = "부탁해. 코토리의 저녁밥이 담긴 염원! 부족하다면 내 10엔도 함께……!"
10029055-155 = "부탁드립니다!"
10029055-156 = "받아줘, 우리의 500엔!"
10029055-157 = "510엔!"
10029055-158 = "……510엔!"
10029055-160 = "아니, 그러니까……."
10029055-164 = "……!"
10029055-165 = "……하아."
10029055-166 = "이번만이야. 일단 줘 봐, 500……."
10029055-170 = "……510엔."
10029055-171 = "……그리고 다음부터는 돈 가지고 장난치지 마."
