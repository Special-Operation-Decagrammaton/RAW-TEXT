211110-37 = "3;마코토;11;네 이 녀석, 이로하……! 그걸 어찌……!!\n#3;stiff"
211110-38 = "5;이로하;06;지금까지 봐온 세월이 있는데, 당연히 알아챈다고요. 그런 거.\n#5;em;[속상함]"
