[translation]
211110-1 = "제11화;낯선 평화"
211110-3 = "……"
211110-4 = "크읏……."
211110-10 = "요즘 마코토 쨩, 고민이 많아 보이지 않아?"
211110-11 = "네. 조용하니까 좋긴 하네요."
211110-12 = "저런 마코토 쨩은 엄청 오랜만이네. 무슨 일이 있는 걸까?"
211110-14 = "아하하, 저렇게 심각한 표정의 마코토 선배라니. 셔터 찬스겠죠?"
211110-24 = "……."
211110-25 = "와, 그 순간에도 카메라를 감지하고 포즈를 취하는 마코토 선배! 과연 만마전의 귀감!"
211110-26 = "당연한 말이다. 정점에 선 자는 언제 어디서든 미디어에 노출될 수 있으니."
211110-27 = "마코토 쨩, 왜 그렇게 심각했던 거야?"
211110-28 = "……으음…… 그것은……."
211110-32 = "그거 때문이죠?"
211110-33 = "게헨나재흥위원회라는 후배들이 요즘 주목받으니까, 위기감 느낀 거 아니에요?"
211110-37 = "네 이 녀석, 이로하……! 그걸 어찌……!!"
211110-38 = "지금까지 봐온 세월이 있는데, 당연히 알아챈다고요. 그런 거."
211110-39 = "마코토 선배, 저번에 호언장담해놓고 막상 이렇게 되니까 엄청 불안한 거죠?"
211110-41 = "뭐야, 그런 이유였어? 마코토 쨩답네."
211110-42 = "하지만 누가 주목받든 괜찮은 거 아니야? 만마전이랑은 관련 없잖아."
211110-43 = "아니, 그것은 틀린 말이다. 사츠키."
211110-44 = "저 녀석들, 재흥위원회는 게헨나 전반에 비가역적인 변화를 일으키기 위해 안간힘을 다하고 있지."
211110-45 = "그리고 이 몸이 알아본바, 그 발악은 소기의 성과를 거두고 있다."
211110-46 = "지금까지의 게헨나는 저 눈엣가시인 선도부를 제외하면 우리 만마전에 맞설 만한 영향력을 가진 단체가 없었지……."
211110-47 = "그렇기 때문에 이 몸의 통치 이념인 '무위의 치'를 펼칠 수 있었던 것인데!"
211110-48 = "그런 철학적 이념 같은 거 없었잖아요?"
211110-49 = "에이잇, 시끄럽다! 어쨌든 지금, 우리의 존재감이 근본적으로 위협당한다는 현실을 직시하도록!!"
211110-50 = "이로하! 그렇게 멍청히 서 있지 말고 당장 <그것>을 준비해라!!"
211110-54 = "그것이 뭔지도 모르겠고, 뭐 하나 준비된 게 없는데요."
211110-55 = "무어라? 그런 것쯤 알아서 척척 준비해 둬야 할 것 아니냐!!"
211110-56 = "억지는 그만두시고요……."
211110-57 = "아무튼 저들의 활동이 우리한테 안 좋을 일은 없지 않나요?"
211110-58 = "막말로 이런저런 귀찮은 일들을 우리 대신 알아서 해주고 있는데."
211110-60 = "그것도 문제다!!"
211110-61 = "저 건방진 후배 녀석들이 온 게헨나를 들쑤셔 놓고 있는 통에, 지난날 만마전의 과실이 드러날지도 모르는 상황."
211110-62 = "그간 선도부를 골탕 먹이기 위해 일부러 방치하던 것들이 수면 위로 떠오른다면 분명 귀찮아질 터!"
211110-63 = "만마전의 위신과 권력에 손상이 생기는 일은 반드시 막아야 한다는 말이다!"
211110-65 = "만마전에 그럴 만한 위신과 권력이 있었는지도 모르겠고, 욕먹는다 해도 지금까지랑 다를 것도 없잖아요?"
211110-66 = "이 마코토 님의 입지가 흔들린단 말이다-!!"
211110-67 = "네에, 선배에게는 그게 가장 중요하겠죠……."
211110-69 = "그런데 요즘 확실히 분위기가 많이 변하긴 했어요."
211110-70 = "아, 나도 느꼈어. 매점이나 급식실에서 특히."
211110-71 = "다 같이 제대로 줄을 서면 더 빠르다고 하면서, 새치기도 안 하고 마구잡이로 달려들지도 않더라."
211110-72 = "그러니까요! 곧 주간 만마전의 특집 기사로 다룰 예정이에요."
211110-73 = "기사 제목은 <게헨나에 찾아온 질서! 과연 우리의 미래는?> 정도로 하면 어떨까요?"
211110-74 = "불가!! 게헨나의 이념은 언제까지나 자유여야 할진대, 어찌 저 깃털 달린 트리니티 녀석들과 같은 소리를 하고 있단 말이냐!!"
211110-75 = "질서 따위로 학생들을 억압해 봤자 노예근성만 만들어낼 뿐이다.#n자연스럽게 이 몸 또한 만인의 위에 서는 의미가 사라지는 것이고."
211110-76 = "노예들 사이의 왕은 그저 광대일 뿐!!"
211110-77 = "우와, 이 발언 또한 기록해 둘 필요가 있겠네요!"
211110-83 = "마코토 선배, 화 많이 났어?"
211110-84 = "이, 이부키……!"
211110-85 = "아니, 화가 난 것은 아니다. 단지 아주 미세한 불안함을 느낄 뿐……!"
211110-86 = "우우…… 마코토 선배가 불안해하지 않았으면 좋겠어……."
211110-87 = "아, 아주 미세하니까! 제로…… 까지는 아니지만, 거의 제로나 마찬가지다!"
211110-88 = "이 하누마 마코토는 그 정도로 심약한 자가 아니니 안심하거라, 이부키!"
211110-89 = "응! 그럼 이부키 안심이야~"
211110-90 = "잘했어요, 이부키. 마코토 선배가 이제야 좀 조용해지겠네요."
211110-91 = "그런데~ 요즘 총을 쏘는 학생들이 줄어든 것 같아."
211110-92 = "폭탄을 터뜨리거나~ 유탄을 쏘거나 하는 학생들도 별로 못 봤어."
211110-93 = "그래. 그 재흥위원회라는 녀석들의 활동 때문에……"
211110-94 = "그래서 좋아! 이부키 깜짝깜짝 놀라거나 하는 일이 많이 없어졌어~!"
211110-95 = "그, 그렇구나…… 이부키가 좋아하는구나……."
211110-97 = "마코토 선배, 기세가 완전히 꺾였군요."
211110-98 = "확실히 요즘 조용해지긴 했죠?"
211110-99 = "기자로서 사건사고가 적어진 건 아쉽지만, 게헨나 밖으로 취재 나가는 것도 재미있으니까 저는 오케이!"
211110-100 = "크윽……!!"
211110-101 = "이, 이런 위기가 닥쳐오고 있는데 저 선도부 녀석들은 대체 뭘 하고 있느냔 말이다~~!!"
211110-104 = "……."
211110-110 = "……."
211110-111 = "……."
211110-113 = "……평화롭네요."
211110-115 = "그러게. 얼마 만에 이런 순간이야."
211110-116 = "요즘 무슨 일 있나요? 교내가 이렇게 조용할 리 없는데……."
211110-117 = "그 게헨나재흥위원회인가, 하는 동아리 덕분인 것 같아."
211110-118 = "동아리 하나가…… 그런 영향을 줄 수 있나요?"
211110-120 = "생각보다 본격적으로 활동하더군요. 문제아들을 한곳에 몰아놓기도 하고."
211110-121 = "예전에는 게헨나 전역에서 온갖 사고가 일어났는데, 이제 꽤 예측 가능해졌다고."
211110-122 = "출동한다 해도 소규모 사건인 경우가 많아서 업무 강도도 확연히 줄어들었지."
211110-123 = "확실히, 부상당하는 부원들도 줄어들었어요…… 서류 작업도 마찬가지고요."
211110-124 = "그리고 무엇보다……"
211110-130 = "부장님의 평화로운 모습을 본 지가 얼마 만인가요."
211110-131 = "항상 격무에 시달리던 히나 부장님이 저렇게 평화롭게 조는 모습이라니……."
211110-133 = "그러게~ 계속 이대로만 갔으면 좋겠네!"
211110-134 = "후후…… 이런 나날이 계속된다면, 선도부가 없어도 될지도 모르겠네요."
211110-135 = "……."
211110-137 = "……."
211110-141 = "……아. 그, 그러지는 않겠지만요!"
211110-142 = "선도부가 없는 게헨나라……."
211110-143 = "그런 미래도…… 괜찮을까요……? 부장님은 항상 은퇴하고 싶어 하셨지만……."
211110-148 = "……."
211110-151 = "……."
211110-157 = "자, 여기 정규 동아리 등록증."
211110-158 = "만마전의 인가도 받았고, 문제될 거 있어?"
211110-159 = "아니. 확실하네."
211110-160 = "야핫, 우리의 모든 활동은 정당하고 적법한 절차를 거쳐서 이뤄진다고."
211110-161 = "게헨나의 동아리치고는 상식적이네."
211110-162 = "귀찮고 짜증나도 해야지."
211110-163 = "마음 내키는 대로 해봤자, 결국 떼쓰는 어린아이와 다를 바가 없으니까!"
211110-164 = "아무튼…… 너무 소란 피우지는 말도록 해."
211110-165 = "알아서 잘할 테니까, 선도부는 선도부 나름대로 할 일을 찾아보는 게 좋을 거야."
211110-166 = "뭐?"
211110-167 = "선도부는 곧 존재의의가 사라질 동아리일지도 모르니까."
211110-168 = "그게 무슨 말이야?"
211110-169 = "어라, 이해 못 했어?"
211110-173 = "생각해 봐. 모두가 규칙을 잘 지키고, 문제아가 없는 게헨나를."
211110-174 = "그럼, 더 이상 선도부라는 단체가 있을 필요가 있을까?"
211110-175 = "……그건……"
211110-176 = "아니, 그건 아니겠지. 어떤 상황이 발생할지 모르는 일이고, 억지력이라는 건……."
211110-177 = "그러니까, 그 억지력이 전혀 필요 없는 곳이 된다면?"
211110-178 = "……."
211110-179 = "뭐어~ 아직은 그냥 목표에 지나지 않지만."
211110-180 = "……그렇다면 좋은 일이겠지만, 아무튼 지금은 아니야."
211110-181 = "소란을 피우면 우리 선도부가 찾아간다. 그것만 명심해 두라고."
211110-182 = "후후, 그럴 일 따위 만들지도 않겠지만……."
211110-183 = "있지, 내가 궁금한 건…… 너희가 찾아온 그 다음인데?"
211110-184 = "……뭐?"
211110-185 = "어떻게 되는 걸까나? 응?"
211110-186 = "하, 궁금해? 여기서 바로 보여줄 수도 있는데."
211110-187 = "응? 응? 한번 해볼래? 해볼까?"
211110-188 = "나는 찬성이야. 사실 선도부장을 제외한 다른 부원들은 영 못미덥다고 생각하던 쪽이라, 직접 검증해 볼 수 있다니 좋은 기회잖아?"
211110-189 = "……."
211110-192 = "바로 그 때문에 우리 선도부가 있는 거야. 넘지 말아야 할 선을 긋는 존재들."
211110-195 = "……아니. 관두지."
211110-199 = "어라?"
211110-200 = "이건…… 꼬리를 내린 거라고 생각해도 될까?"
211110-204 = "……아니, 굳이 이런 식으로 도발해도 소용없을 것 같은 눈빛이네."
211110-205 = "……."
211110-206 = "뭔가 이유가 있는 거겠지? 그 느슨~하고 어중간한 선도부 특유의?"
211110-207 = "마음대로 생각해."
211110-208 = "야핫. 그럼, 아쉽지만 나는 이만 돌아갈게."
211110-209 = "다음에는 오늘처럼 참지 않아도 되니까…… 또 보자구?"
211110-214 = "……."
211110-217 = "……선도부가 없어도 되는, 그런 날이 온다면…."
211110-219 = "다음화;고충해결사"
