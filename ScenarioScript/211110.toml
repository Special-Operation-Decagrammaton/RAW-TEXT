211110-118 = "แค่ชมรมเดียว... ส่งผลได้ขนาดนั้นเลยเหรอคะ?"
211110-120 = "พวกเขาทำงานกันจริงจังกว่าที่คิดค่ะ แถมยังต้อนพวกนักเรียนตัวปัญหาไปรวมไว้ในที่เดียวด้วย"
