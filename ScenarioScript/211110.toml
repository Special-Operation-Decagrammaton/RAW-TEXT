211110-174 = "งั้นองค์กรที่ชื่อคณะกรรมการวินัยยังจำเป็นต้องมีอยู่อีกมั้ยล่ะ?"
211110-175 = "เรื่องนั้นมัน..."
211110-176 = "ไม่หรอก คงไม่เป็นแบบนั้น ไม่มีใครรู้ว่าจะเกิดสถานการณ์อะไรขึ้นบ้าง และอำนาจยับยั้งน่ะ..."
211110-177 = "แล้วถ้าที่นี่กลายเป็นสถานที่ที่ไม่จำเป็นต้องมีอำนาจยับยั้งนั้นเลยล่ะ?"
