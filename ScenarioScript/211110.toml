211110-41 = "3;사츠키;02;뭐야, 그런 이유였어? 마코토 쨩답네.\n#3;em;[?]"
211110-42 = "3;사츠키;01;하지만 누가 주목받든 괜찮은 거 아니야? 만마전이랑은 관련 없잖아."
211110-43 = "3;마코토;02;아니, 그것은 틀린 말이다. 사츠키.\n#3;em;[반응]"
211110-44 = "3;마코토;01;저 녀석들, 재흥위원회는 게헨나 전반에 비가역적인 변화를 일으키기 위해 안간힘을 다하고 있지."
211110-45 = "3;마코토;00;그리고 이 몸이 알아본바, 그 발악은 소기의 성과를 거두고 있다."
211110-46 = "3;마코토;99;지금까지의 게헨나는 저 눈엣가시인 선도부를 제외하면 우리 만마전에 맞설 만한 영향력을 가진 단체가 없었지…….\n#3;em;…"
