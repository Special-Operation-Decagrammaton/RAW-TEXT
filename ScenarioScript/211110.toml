211110-48 = "5;이로하;06;그런 철학적 이념 같은 거 없었잖아요?\n#5;em;[한숨]\n#5;al\n#3;m1"
211110-49 = "3;마코토;11;에이잇, 시끄럽다! 어쨌든 지금, 우리의 존재감이 근본적으로 위협당한다는 현실을 직시하도록!!\n#3;hophop"
211110-50 = "3;마코토;05;이로하! 그렇게 멍청히 서 있지 말고 당장 <그것>을 준비해라!!"
