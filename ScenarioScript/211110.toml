211110-10 = "ช่วงนี้มาโคโตะจังดูมีเรื่องกังวลใจเยอะเลยนะ?"
211110-11 = "ค่ะ แต่เงียบแบบนี้ก็ดีเหมือนกันนะคะ"
211110-12 = "ไม่เห็นมาโคโตะจังเป็นแบบนั้นมานานมากแล้วเลย เกิดอะไรขึ้นกันนะ?"
211110-14 = "อะฮะฮ่า รุ่นพี่มาโคโตะทำหน้าจริงจังขนาดนั้นทั้งที ถือเป็นจังหวะกดชัตเตอร์สินะคะ?"
