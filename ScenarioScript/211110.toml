[translation]
211110-1 = "第11話;見知らぬ平和"
211110-3 = "……。"
211110-4 = "くっ……。"
211110-10 = "最近のマコトちゃん、ずっとあの調子じゃない？"
211110-11 = "はい。静かで助かってます。"
211110-12 = "あんな状態になるの珍しいわよね。何かあったのかしら？"
211110-14 = "深刻そうな表情……シャッターチャンスです！"
211110-24 = "……。"
211110-25 = "わぁっ、すかさずポーズを取るマコト先輩！さすがは万魔殿の鑑！"
211110-26 = "当然だ。頂点に立つ者はいかなる時もメディアに晒され得るからな。"
211110-27 = "マコトちゃん、そんなに真剣な顔してどうしたの？"
211110-28 = "それは……。"
211110-32 = "どうせ、あれのせいでしょう？"
211110-33 = "ゲヘナ再興委員会が注目されているから、危機感を覚えているのでは？"
211110-37 = "イロハ……なぜそれを……！！"
211110-38 = "そりゃ見てれば分かりますよ、そういうの。"
211110-39 = "この前あれだけ大口叩いておいて……実際にそうなると不安がるんですから。"
211110-41 = "なんだ、そんな理由？マコトちゃんらしいわね。"
211110-42 = "でも、誰が注目されててもいいんじゃないかしら。私たちとは関係ないでしょう？"
211110-43 = "いや、それは違う。"
211110-44 = "あいつらはゲヘナに不可逆の変化を起こそうと躍起になっている。"
211110-45 = "そして……その足掻きは着実に成果を上げつつある。"
211110-46 = "これまでのゲヘナには、影響力で万魔殿に張り合える組織などなかった。#nせいぜいが風紀委員会くらいだ。"
211110-47 = "だからこそ、私の統治理念たる「無為の治」を実現できていたのだ！"
211110-48 = "そんな理念、一度も聞いたことないですけど。"
211110-49 = "とにかく、我々の存在感が根本から脅かされている現実を直視するべきだ。"
211110-50 = "イロハ！今すぐ「あれ」を用意しろ！！"
211110-54 = "「あれ」が何かも分からないですし、そもそも何も準備していません。"
211110-55 = "なにぃ！？この程度は察して先回りしておくべきだろう！！"
211110-56 = "無茶言わないでくださいよ……。"
211110-57 = "そもそも、別に悪影響はないですよね？"
211110-58 = "なんなら面倒ごとを肩代わりしてくれてるようなものですし。"
211110-60 = "それが問題なのだ！！"
211110-61 = "あいつらがゲヘナ中を掻き回すせいで、我々の失態が掘り返されるかもしれんのだぞ。"
211110-62 = "風紀委員会を困らせるために放置していた諸々が表沙汰になれば……#n確実に厄介なことになる！"
211110-63 = "万魔殿の威信と権力に傷が付く事態は、絶対に防がねばならん！"
211110-65 = "威信と権力があるのか怪しいですし、叩かれたところで特に変わらなくないですか？"
211110-66 = "このマコト様の立場が揺らぐかもしれないだろう！！"
211110-67 = "先輩はそれが一番大事ですもんね……。"
211110-69 = "でも、いろいろ変化は感じるよね。"
211110-70 = "そうね。特に売店とか食堂で。"
211110-71 = "みんな並ぶようになったし、割り込みもしないもの。#n我先にって突っ込んでいく子も減ったわよね。"
211110-72 = "近々、週刊[ruby=ぱんでも]万魔殿[/ruby]でも特集を組む予定なんです！"
211110-73 = "見出しは……「ゲヘナに訪れた秩序！我々の未来は？」とかどうです？"
211110-74 = "却下だ！ゲヘナは自由であるべきなのだぞ！#n羽根の生えた連中のような思想は捨ててしまえ！"
211110-75 = "秩序だなんだと縛りつけたところで奴隷根性を育てるだけだ。#nこのマコト様が上に立つ意義も薄れてしまう。"
211110-76 = "奴隷の王など、道化に過ぎないではないか！！"
211110-77 = "わあ～！この発言も記録必須ですね！"
211110-83 = "マコト先輩……怒ってる？"
211110-84 = "い、イブキ！？"
211110-85 = "いや、怒ってなどいない。ちょっとだけ、ほんの僅かに不安なだけで……！"
211110-86 = "うぅ……マコト先輩が不安にならないといいな……。"
211110-87 = "ほ、ほんの少しだ！#nゼロ……とまではいかんが、ほとんどゼロみたいなものだ！"
211110-88 = "安心しろ、イブキ！#nマコト様はこれしきでくじけるほどヤワではない！"
211110-89 = "ほんと？じゃあイブキ安心～！"
211110-90 = "イブキ、お手柄です。マコト先輩がようやく静かになりました。"
211110-91 = "でもね～最近、銃を撃ってる子が減った気がするの。"
211110-92 = "爆弾を爆発させたり～グレネードを撃ってる子もいないよね。"
211110-93 = "そうだ……再興委員会の活動のせいで……。"
211110-94 = "イブキ、嬉しいんだ～#nビックリすることが、前より少なくなったから！"
211110-95 = "そ、そうか……イブキは喜んでいるのか……。"
211110-97 = "おぉ、完全に勢い削がれましたね。"
211110-98 = "でも、本当に静かになりましたよね？"
211110-99 = "記者としては事件も事故も減って残念ではあるんですけどね。#nゲヘナの外まで取材に行くのも楽しいので私はオーケーです！"
211110-100 = "くぅぅ……！！"
211110-101 = "危機が迫っているのに、風紀委員会は何をしているのだぁぁ～～！！"
211110-104 = "……。"
211110-110 = "……。"
211110-111 = "……。"
211110-113 = "平和ですね……。"
211110-115 = "うん。こんな時間、いつぶりだろう。"
211110-116 = "最近、何かありました？校内がこんなに静かなわけないと思うんですけど……。"
211110-117 = "ゲヘナ再興委員会のおかげらしいよ。"
211110-118 = "ただの委員会が……これだけの影響力を？"
211110-120 = "予想よりも精力的に活動しているようですよ。#n問題児を1ヶ所に集めて上手く統制しているのだとか。"
211110-121 = "前はゲヘナ中で事件が起きてたけど、最近は予測がつくようになった。"
211110-122 = "出動だって小規模な案件が多いし。仕事の負担も目に見えて減ってるよ。"
211110-123 = "負傷者が目に見えて減少しています。書類作業も同様ですね。"
211110-124 = "そして何より――"
211110-130 = "こんなに穏やかな寝顔……いつ以来でしょう。"
211110-131 = "あのヒナ委員長が居眠りできる日がくるとは……。"
211110-133 = "このまま平和だといいね。"
211110-134 = "ふふ……こんな日々が続けば、風紀委員会が必要なくなるかも――"
211110-135 = "……。"
211110-137 = "……。"
211110-141 = "あっ。いえ……そんなことは、ないと思いますけど！"
211110-142 = "風紀委員会のないゲヘナ、ですか……。"
211110-143 = "そんな未来も……悪くないのかもしれません。#n委員長は、ずっと引退したがっておられましたし……。"
211110-148 = "……。"
211110-151 = "……。"
211110-157 = "はい、活動申請書。"
211110-158 = "万魔殿の認可も取ったし、問題ないよね？"
211110-159 = "ああ。ちゃんと本物なんだな。"
211110-160 = "やはっ、うちらは正当で合法的な手続きに基づいて活動してるんだよ。"
211110-161 = "うちの部活にしては常識的だな。"
211110-162 = "面倒だしムカつくけど、やることはやらないと。"
211110-163 = "好き勝手やるってのは、駄々こねてる子どもと変わんないし。"
211110-164 = "念のため言っとくけど……騒ぎは起こさないようにな。"
211110-165 = "分かってるって。#nてか、そんなこと言ってていいの？"
211110-166 = "何？"
211110-167 = "風紀委員会の仕事、無くなっちゃうかもだから。"
211110-168 = "何が言いたい？"
211110-169 = "あれ、分かんない？"
211110-173 = "考えてみて。みんなが規則を守って、問題児なんていないゲヘナを。"
211110-174 = "そこに、風紀委員会って必要かな？"
211110-175 = "それは……。"
211110-176 = "いや、そうとも限らない。いざという時の抑止力は――"
211110-177 = "だ～か～ら～その抑止力が必要ない場所になったら？"
211110-178 = "……。"
211110-179 = "まっ、ただの目標にすぎないけどね。今はまだ。"
211110-180 = "……少なくとも、今は違う。"
211110-181 = "騒ぎを起こせば私たちが出動する。忘れるなよ。"
211110-182 = "そんなこと起こす気もないんだけどなぁ……。"
211110-183 = "ねえ。あんた達が来た後ってどうなるの？"
211110-184 = "……何？"
211110-185 = "来て、見てるだけ？違うよね？ね、どうなるのかな？"
211110-186 = "お望みなら実演してやろうか？"
211110-187 = "お。やる？やっちゃう？"
211110-188 = "委員長以外はあんまり信用してなかったし。#n腕前を直接確かめられるなんて良い機会じゃん？"
211110-189 = "……。"
211110-192 = "だからこそ、線を引くために私たちがいる。"
211110-195 = "……やめとく。"
211110-199 = "あれ？"
211110-200 = "逃げたってことでいいの？"
211110-204 = "……いや、こんな挑発したって意味なさそうな目してるね。"
211110-205 = "……。"
211110-206 = "何か理由があるんでしょ？#n緩くて中途半端な風紀委員会なりの。"
211110-207 = "好きに思えば。"
211110-208 = "やはっ。じゃあ今日はお開きかな。"
211110-209 = "次は我慢しないでくれると嬉しいな。"
211110-214 = "……。"
211110-217 = "そんな日が来たら……。"
211110-219 = "次回;お悩み解決"
