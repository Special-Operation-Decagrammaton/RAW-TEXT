[translation]
211110-1 = "第11話;陌生的和平"
211110-2 = ""
211110-3 = "……"
211110-4 = "唔……"
211110-5 = ""
211110-7 = ""
211110-9 = ""
211110-10 = "最近的真琴醬，看起來是不是煩惱很多啊？"
211110-11 = "是啊。安靜下來倒是挺好的。"
211110-12 = "那樣的真琴醬真的好久沒見到了。發生什麼事了嗎？"
211110-14 = "啊哈哈，竟然是表情那麼嚴肅的真琴前輩。這是快門時機吧？"
211110-15 = ""
211110-19 = ""
211110-21 = ""
211110-22 = ""
211110-24 = "……"
211110-25 = "哇，就連這種時候也能察覺到相機並擺出姿勢的真琴前輩！不愧是萬魔殿的楷模！"
211110-26 = "那是當然。站在頂點的人無論何時何地都有可能暴露在媒體面前。"
211110-27 = "真琴醬，你為什麼那麼嚴肅啊？"
211110-28 = "唔嗯……那是……"
211110-29 = ""
211110-31 = ""
211110-32 = "是因為那件事吧？"
211110-33 = "最近那些叫格黑娜再興委員會的後輩很受矚目，所以你有危機感了吧？"
211110-34 = ""
211110-36 = ""
211110-37 = "伊呂波你這傢伙……！為什麼會知道……！！"
211110-38 = "都看這麼多年了，那種事當然看得出來。"
211110-39 = "雖然真琴前輩上次誇下海口，結果真的變成這樣就超級不安了對吧？"
211110-41 = "什麼嘛，是這種理由啊？真像真琴醬的作風呢。"
211110-42 = "不過不管是誰受到矚目，應該都無所謂吧？跟萬魔殿又扯不上關係。"
211110-43 = "不，你說錯了，皐月。"
211110-44 = "那些傢伙──再興委員會，正竭盡全力想在整個格黑娜引發不可逆的變化。"
211110-45 = "而且根據本大人的調查，那些掙扎正逐漸取得成果。"
211110-46 = "至今的格黑娜除了那個眼中釘風紀委員會之外，#n沒有任何團體擁有足以對抗我們萬魔殿的影響力……"
211110-47 = "正因如此，本大人的統治理念「無為而治」才得以實現啊！"
211110-48 = "根本就沒有那種哲學理念吧？"
211110-49 = "嘖，吵死了！#n總之，給我正視我們的存在感正受到根本性威脅的現實！！"
211110-50 = "伊呂波！別傻站在那裡，立刻去準備「那個」！！"
211110-51 = ""
211110-53 = ""
211110-54 = "我連「那個」是什麼都不知道，而且什麼都沒準備。"
211110-55 = "什麼？那種事不是應該自己察覺，然後俐落地準備好嗎！！"
211110-56 = "請別強人所難了……"
211110-57 = "而且，他們的活動對我們也沒什麼壞處吧？"
211110-58 = "說得難聽一點，他們還主動幫我們處理了各種麻煩事。"
211110-60 = "那也是問題啊！！"
211110-61 = "那些囂張的後輩把整個格黑娜攪得天翻地覆，說不定會讓萬魔殿過去的過失曝光。"
211110-62 = "要是為了整風紀委員會而刻意放置不管的那些事浮上檯面，肯定會很麻煩！"
211110-63 = "萬魔殿的威信與權力受損這種事，絕對要阻止才行！"
211110-65 = "我是不知道萬魔殿有沒有威信與權力啦，而且就算被罵也跟以前沒什麼兩樣吧？"
211110-66 = "我真琴大人的地位可是會動搖的啊～！！"
211110-67 = "是～對前輩來說，那才是最重要的吧……"
211110-69 = "不過最近氣氛確實變了很多呢。"
211110-70 = "啊，我也感覺到了。尤其是在福利社和餐廳。"
211110-71 = "大家都說好好排隊會更快，既不會插隊也不會一窩蜂地衝上去了。"
211110-72 = "就是說啊！我打算近期在週刊萬魔殿做個特輯報導。"
211110-73 = "報導標題就訂成〈秩序降臨格黑娜！我們的未來將會如何？〉之類的怎麼樣？"
211110-74 = "駁回！！格黑娜的理念永遠都應該是自由！#n怎麼能說出跟那些長羽毛的三一傢伙一樣的話！！"
211110-75 = "就算用秩序之類的東西壓迫學生，也只會造就奴性。#n本大人站在萬人之上的意義自然也會消失。"
211110-76 = "奴隸之中的王不過是個小丑！！"
211110-77 = "哇，這番發言也得記錄下來才行！"
211110-78 = ""
211110-80 = ""
211110-82 = ""
211110-83 = "真琴前輩，你很生氣嗎？"
211110-84 = "伊，伊吹……！"
211110-85 = "不，我沒有生氣。只是感到非常細微的不安……！"
211110-86 = "嗚嗚……希望真琴前輩不要不安……"
211110-87 = "只，只是非常細微而已！#n雖然不到零……但幾乎跟零沒兩樣！"
211110-88 = "我羽沼真琴可不是那麼軟弱的人！放心吧，伊吹！"
211110-89 = "嗯！那伊吹就放心了～"
211110-90 = "做得好，伊吹。真琴前輩這下終於能安靜點了。"
211110-91 = "不過～最近開槍的學生好像變少了。"
211110-92 = "引爆炸彈～或是發射榴彈的學生也很少看到了。"
211110-93 = "沒錯。都是因為那些叫再興委員會的傢伙的活動……"
211110-94 = "所以伊吹很開心！伊吹被嚇一大跳的事變少很多了～！"
211110-95 = "這，這樣啊……伊吹很開心啊……"
211110-97 = "真琴前輩，氣勢完全被挫掉了呢。"
211110-98 = "最近確實變安靜了吧？"
211110-99 = "身為記者，事件和事故變少了是有點可惜……#n不過到格黑娜外面採訪也很有趣，所以我OK！"
211110-100 = "可惡……！！"
211110-101 = "這，這種危機都要逼近了，那些風紀委員會的傢伙到底在做什麼啊～～！！"
211110-103 = ""
211110-104 = "……"
211110-105 = ""
211110-107 = ""
211110-109 = ""
211110-110 = "……"
211110-111 = "……"
211110-113 = "……真和平呢。"
211110-115 = "就是說啊。不知道多久沒有這樣的時光了。"
211110-116 = "最近發生什麼事了嗎？校內不可能這麼安靜的……"
211110-117 = "好像是多虧了那個叫格黑娜再興委員會的社團。"
211110-118 = "一個社團……能產生那樣的影響嗎？"
211110-120 = "他們的活動比想像中還要積極。還會把問題學生集中到同一個地方。"
211110-121 = "以前整個格黑娜到處都在出事，但現在變得相當容易預測了。"
211110-122 = "就算出動也大多是小規模事件，工作強度也明顯減輕了。"
211110-123 = "確實，受傷的委員也變少了……文書工作也是。"
211110-124 = "而且最重要的是……"
211110-125 = ""
211110-127 = ""
211110-129 = ""
211110-130 = "多久沒看到委員長這麼平靜的樣子了。"
211110-131 = "總是被繁重工作折磨的陽奈委員長，竟然能那樣平靜地打瞌睡……"
211110-133 = "就是說啊～真希望能一直這樣下去！"
211110-134 = "呵呵……如果這樣的日子持續下去，說不定就算沒有風紀委員會也沒關係了呢。"
211110-135 = "……"
211110-137 = "……"
211110-138 = ""
211110-140 = ""
211110-141 = "……啊。不，不過應該不會那樣啦！"
211110-142 = "沒有風紀委員會的格黑娜啊……"
211110-143 = "那樣的未來……說不定也不錯……？#n雖然委員長一直都想退休……"
211110-144 = ""
211110-146 = ""
211110-147 = ""
211110-148 = "……"
211110-150 = ""
211110-151 = "……"
211110-152 = ""
211110-154 = ""
211110-156 = ""
211110-157 = "來，這是正式社團的登記證。"
211110-158 = "萬魔殿的許可也拿到了，有什麼問題嗎？"
211110-159 = "沒問題。確實是真的。"
211110-160 = "呀哈，我們的所有活動都是經過正當且合法的程序進行的哦。"
211110-161 = "以格黑娜的社團來說還挺有常識的嘛。"
211110-162 = "就算麻煩又煩人也得做啊。"
211110-163 = "要是隨心所欲地亂來，終究跟耍賴的小孩子沒什麼兩樣嘛！"
211110-164 = "先說好……別鬧得太過火。"
211110-165 = "我們自己會處理好，風紀委員會最好也去找找自己該做的事吧。"
211110-166 = "什麼？"
211110-167 = "因為風紀委員會說不定很快就會變成失去存在意義的社團了。"
211110-168 = "你那是什麼意思？"
211110-169 = "哎呀，你沒聽懂嗎？"
211110-170 = ""
211110-172 = ""
211110-173 = "想像一下。大家都好好遵守規則、沒有問題學生的格黑娜。"
211110-174 = "那樣的話，還有必要讓風紀委員會這種團體存在嗎？"
211110-175 = "這……"
211110-176 = "不，應該不會那樣吧。畢竟不知道會發生什麼狀況，而嚇阻力這種東西……"
211110-177 = "所以說，如果變成完全不需要那種嚇阻力的地方呢？"
211110-178 = "……"
211110-179 = "不過，現在還只是個目標而已啦。"
211110-180 = "……如果真是那樣當然是好事，但至少現在還不是。"
211110-181 = "要是鬧事，我們風紀委員會就會找上門。你只要記住這點就好。"
211110-182 = "呵呵，雖然我們根本不會讓那種事發生……"
211110-183 = "不過我倒是有點好奇……你們找上門之後呢？"
211110-184 = "……什麼？"
211110-185 = "會變成怎樣呢？嗯？"
211110-186 = "哈，好奇嗎？我也可以在這裡直接讓你見識一下。"
211110-187 = "嗯？嗯？要試試看嗎？要來嗎？"
211110-188 = "我贊成哦。其實我一直覺得除了風紀委員長以外的其他委員都不太可靠，#n能親自驗證一下不是很好的機會嗎？"
211110-189 = "……"
211110-192 = "正因如此，才需要我們風紀委員會。#n我們就是劃出那條不能跨越之線的存在。"
211110-193 = ""
211110-195 = "……不。還是算了。"
211110-196 = ""
211110-198 = ""
211110-199 = "哎呀？"
211110-200 = "這是……可以當作你夾著尾巴逃跑了嗎？"
211110-201 = ""
211110-203 = ""
211110-204 = "……不，看你的眼神，就算這樣刻意挑釁好像也沒用呢。"
211110-205 = "……"
211110-206 = "應該是有什麼理由吧？#n那種鬆～散又不上不下的風紀委員會特有的理由？"
211110-207 = "隨你怎麼想。"
211110-208 = "呀哈。那麼雖然有點可惜，我就先回去囉。"
211110-209 = "下次就不用像今天這樣忍耐了……再見囉？"
211110-210 = ""
211110-212 = ""
211110-213 = ""
211110-214 = "……"
211110-215 = ""
211110-217 = "如果不再需要風紀委員會的那一天到來的話……"
211110-219 = "下一話;疑難排解者"
