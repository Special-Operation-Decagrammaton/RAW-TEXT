211110-24 = "..."
211110-25 = "ว้าว แม้แต่ในจังหวะแบบนั้น รุ่นพี่มาโคโตะก็ยังรู้ตัวว่ามีกล้องแล้วโพสท่าให้! สมกับที่เป็นบุคคลแบบอย่างแห่งแพนเดโมเนียม โซไซตี้!"
211110-26 = "แน่นอนอยู่แล้ว ผู้ที่ยืนอยู่บนจุดสูงสุดย่อมถูกสื่อจับภาพได้ทุกที่ทุกเวลา"
211110-27 = "มาโคโตะจัง ทำไมถึงทำหน้าจริงจังขนาดนั้นเหรอ?"
211110-28 = "อืม... คือว่า..."
211110-29 = ""
211110-31 = ""
211110-32 = "เพราะเรื่องนั้นใช่มั้ยคะ?"
211110-33 = "เห็นช่วงนี้พวกรุ่นน้องที่เรียกตัวเองว่าคณะกรรมการฟื้นฟูเกเฮนน่ากำลังได้รับความสนใจ ก็เลยรู้สึกถูกคุกคามขึ้นมา ใช่มั้ยคะ?"
211110-34 = ""
211110-36 = ""
211110-37 = "ยัยอิโรฮะนี่...! รู้เรื่องนั้นได้ยังไง...!!"
211110-38 = "เราอยู่ด้วยกันมาตั้งนาน เรื่องแบบนั้นฉันสังเกตได้อยู่แล้วค่ะ"
211110-39 = "รุ่นพี่มาโคโตะ คราวก่อนคุยโวไว้เสียใหญ่โต แต่พอเอาเข้าจริงก็ไม่สบายใจสุดๆ ใช่มั้ยคะ?"
211110-41 = "อะไรกัน เพราะเหตุผลแบบนั้นเหรอ? สมกับเป็นมาโคโตะจังจริงๆ"
211110-42 = "แต่ไม่ว่าใครจะได้รับความสนใจก็ไม่เห็นเป็นไรนี่นา? ไม่เกี่ยวกับแพนเดโมเนียม โซไซตี้สักหน่อย"
211110-43 = "ไม่ เธอพูดผิดแล้วละ ซัตสึกิ"
211110-44 = "เจ้าพวกคณะกรรมการฟื้นฟูกำลังพยายามสุดกำลัง เพื่อสร้างการเปลี่ยนแปลงที่ไม่อาจย้อนคืนให้#nเกิดขึ้นทั่วทั้งเกเฮนน่า"
211110-45 = "และจากที่เราสืบมา การดิ้นรนของพวกนั้นก็เริ่มเห็นผลตามเป้าหมายแล้ว"
211110-46 = "ที่ผ่านมา ในเกเฮนน่าไม่มีองค์กรไหนมีอิทธิพลมากพอจะต่อกรกับแพนเดโมเนียม โซไซตี้ของเรา นอกจากคณะกรรมการวินัย พวกหนามยอกอกนั่น..."
211110-47 = "เพราะอย่างนั้น เราถึงสามารถใช้ปรัชญาการปกครองที่เรียกว่า 'การปกครองโดยไม่กระทำ' ได้แท้ๆ!"
211110-48 = "เราไม่เคยมีแนวคิดเชิงปรัชญาอะไรแบบนั้นนี่คะ?"
211110-49 = "ฮึ่ย หนวกหูน่า! ยังไงก็เถอะ ตอนนี้จงมองความจริงที่ว่าอิทธิพลของพวกเรากำลังถูกสั่นคลอนจาก#nรากฐานกันได้แล้ว!!"
211110-50 = "อิโรฮะ! อย่ามัวยืนเซ่ออยู่แบบนั้นสิ รีบเตรียม <สิ่งนั้น> เดี๋ยวนี้เลย!!"
211110-51 = ""
211110-53 = ""
211110-54 = "ฉันไม่รู้ว่าสิ่งนั้นคืออะไร แล้วก็ไม่มีอะไรเตรียมไว้เลยค่ะ"
211110-55 = "ว่าไงนะ? เรื่องแค่นั้นก็ควรจัดเตรียมไว้ให้พร้อมเองโดยไม่ต้องรอให้สั่งสิ!!"
211110-56 = "เลิกเอาแต่ใจทีเถอะค่ะ..."
211110-57 = "ยังไงกิจกรรมของพวกเขาก็ไม่มีอะไรเสียหายกับเราไม่ใช่เหรอคะ?"
211110-58 = "พูดกันตรงๆ เรื่องน่ารำคาญต่างๆ พวกเขาก็จัดการแทนเราให้อยู่นี่คะ"
211110-60 = "เรื่องนั้นก็เป็นปัญหาเหมือนกัน!!"
211110-61 = "เพราะเจ้าพวกรุ่นน้องจองหองนั่นเที่ยวขุดคุ้ยไปทั่วทั้งเกเฮนน่า ความผิดพลาดในอดีตของ#nแพนเดโมเนียม โซไซตี้จึงอาจถูกเปิดโปงขึ้นมาได้"
211110-62 = "ถ้าเรื่องที่พวกเราจงใจปล่อยปละละเลยไว้เพื่อเล่นงานคณะกรรมการวินัยมาตลอดถูกเปิดโปงขึ้นมาละก็ เรื่องมันต้องยุ่งยากขึ้นแน่ๆ!"
211110-63 = "จะต้องป้องกันไม่ให้บารมีกับอำนาจของแพนเดโมเนียม โซไซตี้เสียหายโดยเด็ดขาด!"
211110-65 = "ฉันไม่รู้หรอกค่ะว่าแพนเดโมเนียม โซไซตี้เคยมีบารมีกับอำนาจขนาดนั้นหรือเปล่า แล้วต่อให้ถูกด่า ก็คงไม่ต่างจากที่เป็นอยู่จนถึงตอนนี้ไม่ใช่เหรอคะ?"
211110-66 = "สถานะของท่านมาโคโตะผู้นี้กำลังสั่นคลอนเชียวนะ!!"
211110-67 = "ค่ะๆ สำหรับรุ่นพี่แล้ว นั่นสำคัญที่สุดสินะคะ..."
211110-69 = "แต่ช่วงนี้บรรยากาศเปลี่ยนไปเยอะจริงๆ นะคะ"
211110-70 = "อ๊ะ ฉันก็รู้สึกเหมือนกัน โดยเฉพาะที่ร้านค้ากับโรงอาหาร"
211110-71 = "เห็นบอกว่าถ้าทุกคนเข้าแถวกันดีๆ จะเร็วกว่า ก็เลยไม่มีใครแซงคิวหรือกรูกันเข้าไปแบบมั่วซั่วด้วย"
211110-72 = "นั่นสิคะ! อีกไม่นานแพนเดโมเนียม โซไซตี้รายสัปดาห์จะนำเรื่องนี้ไปทำเป็นบทความพิเศษค่ะ"
211110-73 = "ตั้งชื่อบทความว่า <ระเบียบที่มาเยือนเกเฮนน่า! อนาคตของเราจะเป็นเช่นไร?> ดีมั้ยคะ?"
211110-74 = "ไม่ได้เด็ดขาด!! อุดมการณ์ของเกเฮนน่าคืออิสรภาพ และมันจะเป็นแบบนั้นไปตลอด ทำไมถึงมาพูดเหมือนพวกทรีนิตี้ติดขนนกนั่นอยู่ล่ะ!!"
211110-75 = "ต่อให้ใช้สิ่งที่เรียกว่าระเบียบกดขี่นักเรียน ก็มีแต่จะสร้างจิตใจเยี่ยงทาสเท่านั้น#nและนั่นก็ทำให้การที่เรายืนอยู่เหนือคนทั้งปวงหมดความหมายไปโดยปริยายด้วย"
211110-76 = "ราชาผู้อยู่ท่ามกลางเหล่าทาสน่ะ ก็เป็นแค่ตัวตลกเท่านั้นแหละ!!"
211110-77 = "โอ้โห คำพูดนี้ก็ต้องบันทึกไว้เลยนะคะ!"
