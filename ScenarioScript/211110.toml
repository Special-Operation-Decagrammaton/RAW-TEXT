211110-83 = "รุ่นพี่มาโคโตะ โมโหมากเลยเหรอ?"
211110-84 = "อะ... อิบูกิ...!"
211110-85 = "เปล่าหรอก เราไม่ได้โมโห ก็แค่รู้สึกกังวลนิดเดียวเท่านั้น...!"
211110-86 = "ฮือ... ไม่อยากให้รุ่นพี่มาโคโตะไม่สบายใจเลย..."
211110-87 = "อ่า แต่เรากังวลแค่นิดเดียวเองนะ! ถึงจะไม่ใช่ศูนย์... แต่ก็แทบไม่ต่างจากศูนย์เลย!"
211110-88 = "ฮานุมะ มาโคโตะผู้นี้ไม่ใช่คนใจเสาะขนาดนั้น วางใจเถอะ อิบูกิ!"
211110-89 = "อื้ม! งั้นอิบูกิก็วางใจแล้ว~"
211110-90 = "ทำได้ดีมากค่ะ อิบูกิ คราวนี้รุ่นพี่มาโคโตะคงเงียบลงได้สักทีนะคะ"
211110-91 = "ว่าแต่~ ช่วงนี้รู้สึกว่านักเรียนที่ยิงปืนกันดูเหมือนจะน้อยลงนะ"
211110-92 = "แทบไม่เห็นนักเรียนที่จุดระเบิด~ หรือยิงลูกระเบิดกันเลยด้วย"
211110-93 = "ใช่ เป็นเพราะกิจกรรมของเจ้าพวกคณะกรรมการฟื้นฟูนั่น..."
211110-94 = "แบบนี้สิดีเลย! อิบูกิไม่ต้องสะดุ้งตกใจบ่อยๆ แล้ว~!"
211110-95 = "งะ... งั้นเหรอ... อิบูกิชอบสินะ..."
211110-97 = "รุ่นพี่มาโคโตะ หมดความฮึกเหิมไปเสียแล้วสินะคะ"
211110-98 = "ช่วงนี้เงียบสงบลงจริงๆ สินะคะ?"
211110-99 = "ในฐานะนักข่าว ก็ถือว่าน่าเสียดายที่เหตุการณ์วุ่นวายลดลง แต่การออกไปทำข่าวนอกเกเฮนน่าก็สนุก#nเหมือนกัน เพราะงั้นฉันโอเค!"
211110-100 = "อึก...!!"
211110-101 = "วะ... วิกฤตกำลังมาเยือนอยู่แล้วแท้ๆ เจ้าพวกคณะกรรมการวินัยมัวทำอะไรกันอยู่~~!!"
