211110-157 = "นี่ไง ใบจดทะเบียนชมรมอย่างเป็นทางการ"
211110-158 = "ได้รับอนุญาตจากแพนเดโมเนียม โซไซตี้แล้วด้วย มีอะไรที่เป็นปัญหาอีกมั้ย?"
211110-159 = "ไม่ละ เอกสารชัดเจนดี"
211110-160 = "ยะฮ่า กิจกรรมทั้งหมดของพวกเราดำเนินไปตามขั้นตอนที่ชอบธรรมและถูกต้องตามกฎระเบียบนะ"
