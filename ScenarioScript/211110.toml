211110-9 = ""
211110-10 = "Makoto seems so focused lately."
211110-11 = "Yeah. It's nice to have some peace and quiet."
211110-12 = "It's been a while since I've seen this brilliant, introspective side of Makoto. Did something happen?"
211110-14 = "Ahaha, Makoto looks so serious. This'll make a GREAT portrait!"
211110-15 = ""
211110-19 = ""
211110-21 = ""
211110-22 = ""
211110-24 = "..."
211110-25 = "Wow, Makoto sensed the camera and even struck a pose. What a Pandemonium icon!"
211110-26 = "Of course I am photogenic. Someone in my position could be exposed to the media at any given moment."
211110-27 = "Why are you looking so serious, Makoto?"
211110-28 = "...Um... Well..."
211110-29 = ""
211110-31 = ""
211110-32 = "It's because of those juniors, right?"
211110-33 = "You feel threatened because the Gehenna Heritage League has been getting more attention than you lately, right?"
211110-34 = ""
211110-36 = ""
211110-37 = "I-Iroha...! How did you...!!!"
211110-38 = "We're longtime coworkers. Of course I can read you like a book."
211110-39 = "Makoto, you scolded those girls, and now their plan is actually working. It bothers you, doesn't it?"
211110-41 = "Oh that's it? That's SO you, Makoto."
211110-42 = "But what does it matter if they're popular? All that has nothing to do with the Pandemonium Society."
211110-43 = "That's where you're wrong, Satsuki."
211110-44 = "The Heritage League is working tirelessly to bring irreversible change to Gehenna."
211110-45 = "And from what I have gathered, their relentless struggle is yielding the intended results."
211110-46 = "Besides that odious Prefect Team, there was no organization in Gehenna with enough influence to rival the Pandemonium Society. Until now..."
211110-47 = "For so long, I ruled with my philosophy of \"governance through inaction\"!"
211110-48 = "You NEVER had a philosophy!"
211110-49 = "Eeh, shut up! What do you know about statecraft? What matters is that we face a new threat to our very existence!"
211110-50 = "Iroha! Don't just stand there like an idiot. Prepare the THING!"
211110-51 = ""
211110-53 = ""
211110-54 = "I have no clue what \"the thing\" is. And you know I didn't prepare anything."
211110-55 = "What? You should have known what I'd need and prepared it proactively!"
211110-56 = "Please be reasonable..."
211110-57 = "Makoto, how do their activities even harm us?"
211110-58 = "Frankly, they're taking a lot of work off our plate. Things are running smoothly."
211110-60 = "That's a problem too!"
211110-61 = "As those arrogant juniors stir up Gehenna, they might cause unrest. They could investigate the Pandemonium Society's past."
211110-62 = "If they learn of all the times we \"resisted\" the Prefect Team, the students could turn on us."
211110-63 = "We must ensure the reputation and power of the Pandemonium Society remains whole and unblemished!"
211110-65 = "I'm not sure we have any sort of \"reputation\" or \"power.\" And so what if we're criticized? It's happened before."
211110-66 = "My position will be jeopardized!"
211110-67 = "Oh, right. How could I lose sight of what REALLY matters...?"
211110-69 = "I get it, though. I've felt a definite vibe shift."
211110-70 = "I have as well. Especially in communal areas, like the convenience store and cafeteria."
211110-71 = "Students have ceased cutting lines or rushing in, saying that \"it's more efficient to line up properly.\""
211110-72 = "Totally! I'm covering that new trend in the upcoming issue of the \"Weekly Pandemonium Society.\""
211110-73 = "I'm thinking of titling it, \"Order Has Finally Come to Gehenna! What Does Our Future Hold?\""
211110-74 = "Vetoed! Gehenna should ALWAYS be free! You sound like some feather-assed Trinity teaholic!"
211110-75 = "Suppressing students with so-called \"order\" only begets a slave mentality. And THAT renders my significance meaningless!"
211110-76 = "A king amongst slaves is naught but a clown!"
211110-77 = "Whoa, high drama! I better record this."
211110-78 = ""
211110-80 = ""
211110-82 = ""
211110-83 = "Makoto, are you mad?"
211110-84 = "I-Ibuki...!"
211110-85 = "No, I am not \"mad.\" I just experienced a passing, faint sense of unease...!"
211110-86 = "Boo... Ibuki hopes Makoto doesn't feel uneasy..."
211110-87 = "I-It's very faint! Truthfully, it's... not necessarily zero, but it's PRACTICALLY zero!"
211110-88 = "Rest assured, Ibuki! For I, Hanuma Makoto, am not so frail."
211110-89 = "Good! Then Ibuki is happy!"
211110-90 = "Nice job, Ibuki. You got Makoto to stop screaming."
211110-91 = "By the way, it seems like students are rarely firing guns now."
211110-92 = "Ibuki hasn't heard many bombs lately...or seen students throwing grenades."
211110-93 = "Right. It's all because the pesky Heritage League has been..."
211110-94 = "Which is good! Ibuki doesn't get startled or jumpy as much!"
211110-95 = "R-Right... So you like it, Ibuki...?"
211110-97 = "Makoto's out of steam..."
211110-98 = "Things do seem a lot quieter lately."
211110-99 = "As a reporter, it is a shame to have fewer incidents and accidents to cover, but now I have space to head outside Gehenna for interviews!"
211110-100 = "Ugh...!"
211110-101 = "WHAT IS THAT DESPICABLE PREFECT TEAM GOING TO DO ABOUT THIS CRISIS?!"
211110-103 = ""
211110-104 = "..."
211110-105 = ""
211110-107 = ""
211110-109 = ""
211110-110 = "..."
211110-111 = "..."
211110-113 = "...It's peaceful."
211110-115 = "Yeah. It's been a while since we've had a moment like this."
211110-116 = "Did something happen? It's quite odd for our campus to be so quiet..."
211110-117 = "Looks like it's all thanks to the Gehenna Heritage League."
211110-118 = "A single club...can have such an impact?"
211110-120 = "It was an ambitious project. They concentrated all the troublemakers in one area."
211110-121 = "While we used to deal with widespread chaos, things have grown quite predictable."
211110-122 = "Even the incidents we ARE called out for are usually minor. Overall, our workload's lightened a lot."
211110-123 = "The number of injured members has decreased...as has the paperwork."
211110-124 = "And, above all else..."
211110-125 = ""
211110-127 = ""
211110-129 = ""
211110-130 = "It's been too long since we've seen the Head Prefect at peace."
211110-131 = "To see Hina, who is always swamped with work, dozing off so peacefully..."
211110-133 = "Yeah, let's hope this trend continues."
211110-134 = "Fufu... If this trend continues, perhaps the Prefect Team will no longer be needed."
211110-135 = "..."
211110-137 = "..."
211110-138 = ""
211110-140 = ""
211110-141 = "...Ah. That's not to say that it will ever happen!"
211110-142 = "Gehenna without the Prefect Team..."
211110-143 = "Would such a future...be okay...? The Head Prefect always wanted to retire..."
211110-144 = ""
211110-146 = ""
211110-147 = ""
211110-148 = "..."
211110-150 = ""
211110-151 = "..."
211110-152 = ""
211110-154 = ""
211110-156 = ""
211110-157 = "And here's our official club registration."
211110-158 = "We received approval from the Pandemonium Society. Is there a problem?"
211110-159 = "Nope. It looks good. Quite meticulous."
211110-160 = "Yaha! And I assure you, all our activities will be carried out through fair and legitimate procedures."
211110-161 = "That's surprisingly sensible for a club in Gehenna."
211110-162 = "Even if it's a pain, you know how it is."
211110-163 = "If I were just doing whatever I want... I might as well be a toddler throwing a tantrum!"
211110-164 = "Right... Just try to stay out of trouble."
211110-165 = "We have it all handled. Oh, and the Prefect Team members should probably start exploring their options."
211110-166 = "Eh?"
211110-167 = "After all, Gehenna's not going to need you anymore."
211110-168 = "What are you talking about?"
211110-169 = "Oh, don't you get it?"
211110-170 = ""
211110-172 = ""
211110-173 = "It's just... We're making a Gehenna where everyone follows the rules. There won't BE any troublemakers."
211110-174 = "So... Why would we need the Prefect Team?"
211110-175 = "...Well..."
211110-176 = "No, that's not right. You have to be prepared for any situation, and the Prefect Team serves as deterrence—"
211110-177 = "Yeah, but what if Gehenna becomes a place where we don't need \"deterrence\" anymore?"
211110-178 = "..."
211110-179 = "Ah, it's nothing more than a lofty goal at the moment!"
211110-180 = "...It's a noble idea, but that's not Gehenna's reality right now."
211110-181 = "Just keep in mind that if you start some trouble, the Prefect Team will pay you a visit."
211110-182 = "Fufu. We'd never dream of it..."
211110-183 = "Still, now I'm curious... What exactly would you do?"
211110-184 = "...What?"
211110-185 = "What could possibly happen if you came to our doorstep? Hm?"
211110-186 = "Curious, huh? I could show you right here, you know."
211110-187 = "Oh? Hm? Really? Shall we?"
211110-188 = "I'm in. Honestly, I only have faith in the Head Prefect, and she's not here. But wouldn't this be a glorious opportunity to learn more about your team?"
211110-189 = "..."
211110-192 = "And that is why we, the Prefect Team, are here. We are those who draw the line that must not be crossed."
211110-193 = ""
211110-195 = "...No. Forget it."
211110-196 = ""
211110-198 = ""
211110-199 = "Huh?"
211110-200 = "So I take it...that you're backing down?"
211110-201 = ""
211110-203 = ""
211110-204 = "...No. I see it in your eyes. You won't be goaded into it, will you?"
211110-205 = "..."
211110-206 = "I'm sure you have your reasons. Some code, vague and inconsistent, like everything else the Prefect Team does."
211110-207 = "Think whatever you want."
211110-208 = "Yaha! If that's the case, then I better be off. Toodles."
211110-209 = "And I hate being teased like this, so don't hold back next time, all right? I really hope we meet again."
