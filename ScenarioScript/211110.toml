211110-122 = "ถึงเราจะต้องออกปฏิบัติการ แต่มันก็เป็นแค่เหตุเล็กๆ เสียส่วนใหญ่ ความหนักของงานก็ลดลงอย่างเห็นได้ชัดเลยด้วย"
