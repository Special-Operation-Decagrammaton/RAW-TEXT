[translation]
103070-1 = "제7화;우트나피쉬팀의 배 2"
103070-4 = "저기…… 어떤 것 같으세요, 엔지니어부 여러분?"
103070-5 = "……응. 완벽하게 알겠어."
103070-6 = "그, 그런가요?"
103070-7 = "그래, 우리는 이 전함의 구조를 죽어도 이해하지 못할 거라는 사실을 완벽하게 알겠어."
103070-8 = "……네, 네에?!"
103070-10 = "응. 이 전함의 연료도, 추진체도, 동작 원리도, 엔진 구조도, 설계 사상도 전혀 파악할 수 없었어."
103070-11 = "네! 이건 현존하는 지식으로는 이해할 수 없는 오파츠니까요! 저희가 이해할 수 없는 것도 어떻게 보면 당연한 거죠!"
103070-12 = "하아…… 이걸 좀 연구해 보면 우리의 숙원 사업에 도움이 되지 않을까 생각했는데……"
103070-13 = "이래서야 아무런 도움도 안 될 것 같네."
103070-15 = "그, 그 정도인가요……?"
103070-16 = "앗, 안심하세요!"
103070-17 = "작동 원리를 몰라도 조종 방법 정도는 어떻게든 알아낼 수 있으니까요!"
103070-21 = "그게 무슨 뜻이냐고요? 그런 거죠! 자동차 엔진의 구조를 전혀 몰라도 운전하는 데는 아무 문제가 없잖아요?"
103070-23 = "모든 작동 기관은 단순하게 해석하면, 인풋 데이터를 아웃풋 데이터로 변환하는 장치라고 볼 수 있어."
103070-24 = "그 변환 과정을 귀납적으로 이해할 수만 있다면, 구조를 이해하지 못해도 결과를 예측할 수 있을 거야."
103070-26 = "즉, 악셀을 밟으면 가속한다, 브레이크를 밟으면 감속한다, 핸들을 돌리면 방향이 바뀐다……."
103070-27 = "그런 정보들을 정리한다면 내부 구조를 몰라도 조종 매뉴얼을 만들 수 있어."
103070-28 = "그, 그렇군요……!"
103070-29 = "잘 부탁드립니다, 엔지니어부 여러분."
103070-39 = "흐음……."
103070-40 = "그러네요. 이걸 <우주전함>이라 부르는 건 틀린 표현이네요."
103070-41 = "네. 탑재된 무기도 없고, 비행 가능한 고도도 100,000m 정도가 한계……. 우주는커녕 대기권 밖으로만 나가도 부서져 버리겠네요."
103070-42 = "……그리고 무엇보다 특이한 건,"
103070-47 = "이 전함의 총 질량의 75% 이상이 논리 연산 장치로 되어 있다는 거예요."
103070-48 = "즉 이것은 전함이 아니라, 일종의 비행 가능한 차원위상학적 양자컴퓨터…… 라는 결론이에요."
103070-50 = "어째서 이런 게 존재하는지는 일단 넘어가도……"
103070-51 = "결국 이거라면 <아트라하시스의 방주>를 공략할 수 있다는 뜻이네요?"
103070-52 = "네. 이걸 이용한다면 <다차원해석>이 가능해져요."
103070-53 = "뿐만 아니라 이 정도의 연산 장치를 저라는 천재 해커가 사용한다면…… 이 세상에 존재하는 모든 걸 해킹할 수 있을지도 모르겠네요. 후후후……."
103070-54 = "어쩌면 저 <아트라하시스의 방주> 자체를 해킹하는 것도 가능할지도……."
103070-58 = "그렇다면, 방주를 지상으로 추락시키거나 자폭시키는 것도……?"
103070-59 = "……그러네요. 자폭까지는 힘들어도 추진 시스템만 해킹해도 방주를 지상으로 추락시킬 수 있겠네요."
103070-60 = "하지만 그러려면 저 방주의 시스템에 물리적으로 접속해야만 하겠죠."
103070-66 = "이 싸움의 실마리가 보이기 시작하네요."
103070-67 = "이 싸움은 말하자면……"
103070-68 = "다차원해석이라는 룰 [ruby=반칙]위반[/ruby]을 저지르고 있는 상대를, 차원위상학적 [ruby=치트]양자컴퓨터[/ruby]로 [ruby=해킹]상대[/ruby]한다……."
103070-69 = "반칙과 반칙의 싸움…… 아니, 해커와 해커의 싸움이라고 해야 할까……."
103070-71 = "으응…… 히마리 씨의 어깨가 무거워지겠네요? 저는 이런 쪽에는 문외한이라……."
103070-72 = "후후. 맡겨주시길."
103070-73 = "그럼 저는 먼저 다차원해석을 위한 이론 구축에 들어가겠어요."
103070-74 = "네. 도움이 필요하면 불러주세요. 저는 다른 분들께 가볼게요."
103070-82 = "……. 응?"
103070-90 = "이건 AMAS……? 언제 여기에 들어온 거죠……?"
103070-91 = "……그게 아닙니다."
103070-92 = "기계음……? 스피커 장착 모델?"
103070-93 = "그 공식을 쓴다면 양자 정보의 오차를 수정할 수 없습니다. 이온 트랩을 이용해야 합니다."
103070-98 = "……어머나? 그, 그러네요?!"
103070-99 = "천재인 제가 이런 기초적인 실수를……. 하아……."
103070-100 = "……. 며칠째 휴식을 취하지 못했으니까."
103070-101 = "그건 여기 있는 모두가 마찬가지예요."
103070-102 = "뭐, 차이점이라면 저는 병약미소녀라는 것 정도죠."
103070-103 = "그런데 이건……, 아니, 당신은……."
103070-106 = "……."
103070-111 = "저는 리오 회장이 보낸 연산지원 A.I. 입니다."
103070-113 = "……. 리오."
103070-114 = "리오가 아닙니다. 연산지원 A.I. 입니다."
103070-118 = "하긴. 그런 오물 같은 여자가 뻔뻔하게 여기 얼굴을 내비칠 리가 없겠네요. 양심이 있다면 그럴 리가 없겠죠."
103070-119 = "아리스에 대한 일은……."
103070-120 = "네. 아리스를 납치한 것도 그렇고요. 하지만 지금은 그 여자가 전혀 신경도 안 썼던 부분을 이야기해 볼까요? A.I한테 하는 혼잣말 같은 거지만."
103070-121 = "토키."
103070-125 = "리오는 토키에게 위험한 장비를 주고 온갖 위험한 일들을 시켰어요. 그 <무장>의 위험성은 분명 그 여자도 알고 있었을 텐데 말이에요."
103070-126 = "게다가 토키에겐 친구라고 부를 만한 사람이 없더군요. 왜 그런지는 알고 있을까요?"
103070-127 = "리오가 보안을 위해 그녀가 누구와도 교류하지 못하게 막았기 때문이죠."
103070-128 = "그렇지만 토키는 아무런 불평도 없이 온갖 임무를 도맡아 했더군요."
103070-129 = "결국…… 귀여운 후배를 납치하라는 임무까지도요. 하지만 그녀는 알고 있나요? 그 임무가 뜻하는 것이 무엇인지?"
103070-130 = "그, 그건……."
103070-132 = "리오는 토키에게 <사람을 죽이는 일>에 협조하게 한 거예요."
103070-134 = "생명이 아니다? 아무리 생명에 대한 관점이 다르다고 해도, 그건 절대 용서받을 수 없는 일이라는 걸 몰랐던 걸까요?"
103070-135 = "그 사실을 알게 되었을 때, 토키가 무슨 생각을 했는지 알고 있었을까요? 모든 것을 알고 있는 그 위대한 빅 시스터는!"
103070-137 = "……."
103070-138 = "그러려면 토키를 끌어들이지 말았어야죠. 트롤리 딜레마 같은 걸 꺼내 들고 잘난 척했지만 실제로 그 레버를 당겨야만 했던 건 토키였어요."
103070-139 = "……."
103070-140 = "정말이지 비겁한 여자이지 않아요? 그러다가 결국 <샬레>의 선생님에게 모든 계획이 망가져 버리자……"
103070-141 = "이번엔 '마음대로 해라.'라는 무책임한 말만 남기고 모습을 감춰버리기까지 했죠."
103070-142 = "홀로 남겨진 토키가 무슨 생각을 할지 생각해 본 적은 있나요? 그 아이가 왜 C&C에 찾아갔다가 몰래 사라졌는지 알고 있나요?"
103070-143 = "……."
103070-144 = "……후후, 그럴 리가 없겠죠. 빅 시스터는 남의 외로움이나 죄책감 같은 건 생각해 본 적도 없었을 테니까요."
103070-148 = "토키는 저를 찾아와서 부탁하더군요."
103070-149 = "무엇이든 시켜달라고. 자기가 조금이라도 도움이 되었으면 좋겠다고요."
103070-152 = "토키는 지금도 성소의 현현 가능성이 있는 곳을 찾아다니면서 혼자서 싸움을 이어가고 있어요. 자기 상처 따위는 신경도 안 쓰면서요."
103070-153 = "그녀가 왜 그렇게 필사적인지 이유를 모르겠죠?"
103070-154 = "……정말이지 그런 오물에게는 어울리지 않는 성실한 메이드이지 않아요? C&C에서 그녀를 원치 않는다면 제가 데려갈 거예요."
103070-155 = "……."
103070-156 = "슬슬 이쯤 되면 오물이라는 표현도 너무 관대하다는 느낌이 들기 시작하네요."
103070-157 = "……. 그래."
103070-158 = "……나를 환영하지 않는다는 건…… 알고 있어. 히마리……."
103070-162 = "하지만 이 오파츠를 움직이게 하기 위해선 내 도움이 필요하지 않아?"
103070-163 = "이 키보토스에서 <이름 없는 신들>의 유산에 대해 가장 잘 알고 있는……."
103070-164 = "아뇨, 필요 없어요."
103070-165 = "가장 잘 알고 있었다면 그때 세상이 멸망할 뻔하지 않았겠죠."
103070-166 = "그 사태를 막은 건 결국 아리스 본인과 게임개발부 부원들, 그리고 선생님이었어요."
103070-170 = "그러니까 당신의 도움 따윈 필요 없어요."
103070-171 = "당장 이 배에서 내리세요. 여기엔 아리스와 선생님, 그리고 게임개발부 부원들이 타고 있으니까요."
103070-172 = "알겠어."
103070-179 = "저기…… 히마리 씨?"
103070-183 = "아, 네. 무슨 일이죠?"
103070-184 = "아아, 저건 무인 드론인데, 잠깐 채팅 테스트를……."
103070-188 = "저분이 학생회장 츠카츠키 리오 씨죠?"
103070-189 = "모습을 감췄다고 들었는데 다행히 무사하셨나 보네요."
103070-190 = "……."
103070-191 = "……하나코 씨. 저는."
103070-192 = "……저분을 보니까 고대 서사시의 이야기 하나가 떠오르네요."
103070-193 = "이야기요?"
103070-194 = "네. 일종의 아이러니에 대한 우화인데…… 예언을 피하려고 하다가 예언을 이루어 버린 왕에 대한 이야기예요."
103070-195 = "왕국이 파멸할 거라는 신탁을 받은 왕은 그 운명에서 벗어나기 위해서 모든 노력을 다하지만……."
103070-197 = "결국 그 왕의 노력이 왕국을 파멸시키는 원인이었다는 결말……이겠네요."
103070-199 = "네. 왕은 그 예언이 실현되지 않기 위해 할 수 있는 모든 노력을 다하죠. 예언자를 추방하고, 신전을 부수고, 모든 관문을 봉쇄하고, 결국 전쟁까지 이어 나가지만……."
103070-200 = "결국…… 자신이 사랑했던 가족과 가신, 형제들이 모두 죽고, 왕국은 아무도 살지 못하는 폐허가 되어버렸다는 결말……."
103070-202 = "……."
103070-203 = "생각해 볼 만한 담론이네요. 확정된 운명이란 존재하는가. 결정론은 유의미한가……."
103070-204 = "네. 원래는 세이아 쨩……, 예지몽을 꾸는 제 친구와 했던 이야기지만요."
103070-205 = "왕이 운명을 피하기 위해선 어떻게 했어야 할까요? 왕은 어떤 잘못을 저질렀던 걸까요?"
103070-206 = "……."
103070-209 = "……. 간단합니다. 하나코."
103070-210 = "왕의 가장 큰 잘못은, 그가 왕이었다는 거예요."
103070-212 = "왕…… 이었던 것이요?"
103070-213 = "예언자를 추방할 수 있고, 전쟁을 일으킬 수 있는 왕이었던 것. 신탁을 들을 수 있는 왕이었던 것. 그게 왕의 가장 큰 잘못이었던 거죠."
103070-214 = "그치만 세이아 쨩…… 그 말은 곧, 왕은 어떤 잘못도 하지 않았다는 이야기이기도 해요."
103070-215 = "왕이 자신의 힘을 포기했다면…… 신탁을 들을 수 있는 자격을 포기했다면 예언은 이루어지지 않았을지도 모르죠."
103070-216 = "으응…… 그치만 그건 조금 억지 같은데요?"
103070-217 = "맞아요. 결과론적인 억지예요."
103070-218 = "이런 이야기에 답 같은 게 존재하진 않으니까요."
103070-225 = "……아아. 죄송해요."
103070-226 = "참견하려는 건 아니었어요. 타인인 제가 뭐라고 할 수 있는 문제는 아닌데……."
103070-227 = "무슨 말씀인지는 알겠어요. 지금은 조금의 가능성이라도 더 높여야 하는 상황이 맞겠죠……."
103070-228 = "……그녀에 대한 규탄은, 그래요. 이 모든 일들이 끝난 뒤에 해도 늦지 않을 테고."
103070-229 = "리오……, 아니, 지금은 연산지원 AMAS 라고 해두죠."
103070-233 = "이쪽으로 와서 제 계산을 도와주시겠어요?"
103070-238 = "……."
103070-245 = "……마치 두 번째 화두 같군요."
103070-246 = "[s] \"신경 써줘서 고마워, 하나코.\""
103070-250 = "어머나…… 수석행정관님과 선생님까지? 으, 으응……. 다 들렸었나요?"
103070-251 = "걱정은 하지 마시길. 사정은 저도 대충 알고 있습니다. 밀레니엄의 학생회장이 이곳에 있다는 건 함구하도록 하죠."
103070-252 = "네. 저분은 아무래도 자기 학생들에게도 배척받고 있는 것 같고……"
103070-253 = "저분들에게도, 그리고 우리들에게도…… 아직 풀어야 할 문제들이 많이 남아 있는 것 같네요."
103070-254 = "그러고 보니 수석행정관님? 방금…… 화두라고 하지 않았나요?"
103070-255 = "아아…… 네."
103070-256 = "별건 아니고 총학생회장에게서 들었던 겁니다. 키보토스에 떠도는 일곱 개의 이상한 질문들."
103070-260 = "정답이 있는지도, 무엇을 묻는 건지도 불명확한 일종의 선문답 같은 거였죠. 총학생회장은 그런 걸 좋아했습니다."
103070-261 = "[s] \"총학생회장은 그런 취향이었나 봐.\""
103070-262 = "네. 설명되어지지 않는 미스테리한 이야기를 좋아했죠. 오파츠라든가, 오컬트…… 그런 것들."
103070-263 = "당장 선생님의 그 <싯딤의 상자>부터가 해석이 불가능한 오파츠의 일종이니까요."
103070-264 = "[s] \"흐음.\""
103070-265 = "그 중 두 번째 화두가…… 그런 비슷한 것이었습니다."
103070-266 = "<이해하지 못하는 것을 통해서 이해할 수 있는가.>"
103070-268 = "두 번째 화두는 처음 들었어요."
103070-269 = "이해하지 못하는 것을 통해서…… 이해할 수 있는가? 그런 질문이군요? 으응……."
103070-270 = "그녀가 버릇처럼 말했던 건 여섯 번째 화두였지만…… 어쨌든 이 두 번째 화두에는 함정이 있습니다."
103070-271 = "……문장이 완성되어 있지 않죠."
103070-272 = "네. <이해되지 못하는 것>을 통해서 [ruby=.]무[/ruby][ruby=.]엇[/ruby]을 이해할 수 있는지, 목적어가 빠져 있습니다."
103070-273 = "따라서 이 문장은 애초에 질문으로 성립되지 않습니다."
103070-274 = "하지만…… 총학생회장은 이건 퀴즈가 아니니까 그래도 상관없다고 했죠. 거기에 자기가 원하는 걸 집어넣으면 된다고."
103070-275 = "거기에 무슨 뜻이 담겨있는지는 저는 알지 못합니다만."
103070-276 = "……그냥 하나코 씨의 이야기를 들으니 문득 그 질문이 떠올랐을 뿐입니다."
103070-277 = "잡담 같은 거니 신경 쓰지 마시길."
103070-279 = "으응…… 그치만 이렇게 들어버린 이상 신경 쓰이는걸요?"
103070-280 = "그러네요, 이해하지 못하는 것을 운명이라고 한다면, 그 운명을 통해서 이해할 수 있는 것은……."
103070-281 = "운명을 통해서 우리는 무엇을 이해할 수 있는 건지……. 으응……. 이 질문이 뜻하는 건 대체……."
103070-282 = "[s1] \"애초에 완성되지 않은 질문이잖아.\"\n[s2] \"게다가 무엇이든 넣어서 완성할 수 있고.\""
103070-285 = "……. 네. 답을 구하려고 하면 안 된다는 얘기죠? 화두니까."
103070-286 = "하나코 씨. 궁금한 게 하나 더 있습니다만."
103070-287 = "네, 뭔가요? 수석행정관님?"
103070-288 = "그 이야기는 어떻게 끝나나요? 왕은 결국 어떻게 되었죠?"
103070-289 = "아…… 그 왕은……."
103070-290 = "결국 자신이 왕국을 파멸시킨 원인이라는 것을 깨닫고는……."
103070-291 = "속죄할 상대도, 방법도 없고, 스스로의 죄를 긍정할 수도 없었던 왕은 결국……."
103070-292 = "비탄에 빠져……."
103070-296 = "……음, 이 얘기는 그만하죠."
103070-297 = "[s] \"……………….\""
103070-305 = "린 선배, 그리고 선생님. 작전 계획서가 완성됐어요."
103070-306 = "전체 브리핑을 하기 전에 린 선배랑 선생이 최종 확인을 해줘야 해. 얼른 브릿지로 와 줘."
103070-308 = "어머나, 드디어 작전 계획서가……."
103070-309 = "……네. 가시죠."
103070-315 = "다음화;작전 브리핑"
