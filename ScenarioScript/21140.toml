[translation]
21140-1 = "제14화;메이드 vs 마이스터즈"
21140-2 = "밀레니엄 복도"
21140-4 = "라스트 셔터 해제. 후후후! 지금 이 학생회 전용층은 내 지문으로만 이동할 수 있다구~ 자 조금만 더 가면 거울이 있는 압류품 보관소……"
21140-5 = "모모이! 엎드려!"
21140-7 = "엣?"
21140-8 = "(콰앙!)"
21140-9 = "으아아앗!"
21140-10 = "뭐, 뭐야! 방금 머리를 스친 이 엄청난 위력의 탄환은?! 벽에 주먹만한 구멍이 났잖아?!"
21140-11 = "13.97mm 대물 저격용 탄환?! 다행이다. 언니 키가 5cm만 더 컸어도 이마에 명중이었을 거야."
21140-12 = "휴우. 꼬맹이라 다행…… 일리가 있나!"
21140-13 = "아무래도 벌써 저격 포인트에 도착한 모양이네."
21140-14 = "C&C의 저격수…… 카린 선배가……."
21140-15 = "미도리! 숙여! 또 온다!"
21140-16 = "(콰과과광-!)"
21140-17 = "으아아앗!"
21140-19 = "밀레니엄 제 3교사 옥상"
21140-20 = "음. 제법이다."
21140-21 = "작고, 민첩해서 맞추기가 쉽진 않아……."
21140-22 = "하지만…… 속도와 패턴은 알겠어. 바람도 적고 사선에 엄폐도 없다. 창문이 아닌 벽을 등지면…… 안 맞을 거라 생각하는 모양이군."
21140-23 = "유감이지만, 다음에는 100% 명중한다……."
21140-24 = "그럴까?"
21140-25 = "?!"
21140-26 = "내 계산은 약간 달라. 네 탄환이 저 아이들에게 닿을 확률은, 0%야."
21140-27 = "누구냐?"
21140-30 = "(위잉- 철컹. 치킹치킹)"
21140-31 = "어?"
21140-34 = "(투다다다다!)"
21140-36 = "앗! 뭐, 뭐, 뭐야 이건!"
21140-37 = "소개하지."
21140-38 = "엔지니어부의 신작, 전천후만능형 이족보행 전투형 '의자'. 천둥의 옥좌를."
21140-40 = "아니 무슨 의자가 걸어 다녀! 그리고 캐터펄트는 왜 달고 있는 거야!"
21140-41 = "안타깝네. 로망을 모르는 사람은 이 천둥이의 매력을 이해할 수 없겠지."
21140-42 = "……그건 확실히 이해가 안 되지만 다른 부분은, 이해했다."
21140-43 = "계속 궁금했었어. 저 게임개발부 아이들이 어떻게 다른 곳도 아닌 밀레니엄 학생회 시큐리티를 돌파해서 여기까지 왔는지."
21140-44 = "저 '선생님'에게, 너희가 협력하고 있었던 건가."
21140-45 = "히마리의 정보 역시, 우리를 혼란시키기 위한 수작이었겠군."
21140-46 = "그렇다면……."
21140-52 = "!!"
21140-55 = "아앗?! 내 천둥이가!"
21140-56 = "……튼튼하긴 하군. 관통당하지 않은 채, 넘어져서 바둥거리는 걸 빼면……"
21140-57 = "총이 달린 의자라니 재미있긴 하지만……."
21140-58 = "나를 막고 싶었으면 기습을 했어야지. 이 '의자'랑 정면으로 도전하다니."
21140-59 = "어리석은 계산을 했네. 우타하."
21140-60 = "이런 엄폐물도 없는 넓은 옥상에서라면 날 이길 수 없어."
21140-61 = "……."
21140-62 = "엄폐물도 없는 옥상…… 맞는 말이야."
21140-65 = "심지어 천장조차 없지."
21140-67 = "?"
21140-69 = "(휘이이잉---)"
21140-70 = "?! 이, 이 소리는?!"
21140-71 = "(콰앙!)"
21140-73 = "크윽! 곡사포?! 대체 어디서?!"
21140-74 = "우리 히비키는 박격포로, 밀레니엄 타워 반대편에서 발사하고 있어."
21140-75 = "즉 지금 네 위치에서 히비키를 저지하고 싶다면, 벽 네 개와 천장 두 개를 관통해야 해. #n곡사포라도 쓰지 않는 이상 말이야."
21140-76 = "이, 이런?!"
21140-77 = "후후. 다시 말해줄까?"
21140-79 = "계산대로야."
21140-81 = "밀레니엄 본교사 내부"
21140-82 = "포격이 멈췄어."
21140-83 = "우타하 선배랑 히비키 쨩이야! 카린 선배를 상대하고 있는 동안 서둘러!"
21140-85 = "(쿠구구구궁!)"
21140-86 = "꺄악. 뭐, 뭐야. 지진인가?"
21140-87 = "폭발…… 같은데…… 설마?!"
21140-89 = "밀레니엄 본교사 외곽"
21140-94 = "크윽…… 강의는…… 아직 안 끝났……!"
21140-95 = "죽는 줄 알았네! 대체 그 많은 폭탄을 어디에 넣고 다닌 거야……!"
21140-98 = "후우. 학교 시설을 부수는 건 별로 내키지 않지만……."
21140-99 = "유우카. 미안해요. 셔터는 파괴했어요. 게임개발부의 현재 위치는?"
21140-100 = "방금 전까지는 카린이 막고 있었는데, 지금은 모르겠어."
21140-101 = "하지만…… 어디로 갔는지는 알아."
21140-102 = "'거울'이 있는 학생회 압류품 보관소 쪽이겠군요. 알겠어요. 승강기를 타고 그쪽으로 이동할게요."
21140-103 = "(삐빅-)"
21140-106 = "?!"
21140-107 = "유, 유우카?"
21140-108 = "설마…… 전력을 차단한 건가?!"
21140-109 = "이렇게까지……!!"
21140-111 = "밀레니엄 본교사 내부"
21140-112 = "방금 정전, 우타하 선배와 히비키가 성공한 걸까?"
21140-113 = "그렇겠지? 아, 선생님. 어두우니까 조심하세요."
21140-114 = "이 통로만 지나면……."
21140-115 = "학생회 압류품 보관소구나! 우헤헤! 드디어 도착이다!"
21140-116 = "와아~ 드디어 도착이다!"
21140-117 = "?"
21140-118 = "?!"
21140-120 = "한참 기다렸다구~"
21140-121 = "어서와 게임개발부! 그리고……! 음음! 누구였더라! 센베님이셨던가!"
21140-122 = "아, '선생님!' 기억했다! 후훗."
21140-123 = "줄곧, 기다리고 있었어~"
21140-124 = "아, 아스나 선배?! 어떻게 여기에!"
21140-125 = "그냥!"
21140-126 = "왠지 예감이랄까~ 그런 거 있잖아. 어쩐지 이쪽에서 기다리면, 선생님을! 너희를 만날 수 있을 것 같다는 그런!"
21140-127 = "그런 예감!"
21140-128 = "이 무슨…… 예측도 아니고……."
21140-129 = "자아. 그럼 바로 시작할까?"
21140-130 = "뭐, 뭐를요?"
21140-131 = "싸움! 싸움 좋지!"
21140-132 = "아, 맞다. 소개부터 해야겠네. 잘 부탁해~"
21140-133 = "난 C&C 콜사인 제로원, 아스나!"
21140-134 = "갈게!"
21140-135 = "이런!!"
21140-137 = "다음화;뻗어오는 위험"
