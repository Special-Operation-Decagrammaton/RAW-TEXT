[translation]
2600205-1 = "소녀는 극복하고 싶어."
2600205-2 = "(학생 식당에 모이기 직전에, 사전에 무슨 요리를 만들지 메뉴는 미리 결정했다.)"
2600205-3 = "(이번에 실험용으로 만들어볼 요리 메뉴는 된장국.)"
2600205-4 = "하아, 후우……."
2600205-5 = "[s] \"긴장 돼?\""
2600205-6 = "네에, 매번 요리를 실패할 때마다 원인을 찾으려고 노력해봤지만……."
2600205-7 = "저 혼자만 허둥지둥했을 뿐이지, #n이런 시도는 생각도 못 해봤거든요."
2600205-8 = "하지만 선생님과 함께 문제점을 찾을 수만 있다면……."
2600205-9 = "앞으로 실패할 일 없이, 요리에 매진할 수 있겠지요. 분명!"
2600205-11 = "그럼 우선, 재료부터 손질을……."
2600205-12 = "[s] \"잠깐! 요리에 들어가기 전에 먼저 약속하자.\""
2600205-13 = "네? 약속, 이요?"
2600205-14 = "[s] \"응, 이번에 요리를 할 때는…….\""
2600205-16 = "[s1] \"레시피에 쓰여 있지 않은 도구를 쓰지 말 것.\"\n[s2] \"레시피에 쓰여 있지 않은 재료를 쓰지 말 것.\"\n[s3] \"레시피에 쓰여 있지 않은 조리법을 시도하지 말 것.\""
2600205-17 = "과, 과연……."
2600205-18 = "과, 과연……."
2600205-19 = "과, 과연……."
2600205-20 = "이번만큼은 효율 대신, 실험에만 집중하자는 말씀이시군요."
2600205-21 = "[s] \"평소 주리는 효율의 문제라고 생각해왔구나…….\""
2600205-22 = "어쨌거나, 네! 알겠습니다."
2600205-23 = "이번엔 레시피에 쓰인 대로만 해볼게요!"
2600205-25 = "(그렇게 주리와 보조를 맞춰서 된장국을 완성했다.)"
2600205-28 = "완성했어요! 선생님!"
2600205-29 = "[s] \"좋아, 그럼 어디 한 번 주리가 만든 음식을.\""
2600205-30 = "……꿀꺽!"
2600205-38 = "[ns] \"이, 이 맛은……?!\""
2600205-39 = "어, 어떠신가요?"
2600205-40 = "[s4] \"시고, 짜고, 달고, 맵고……\"\n[s5] \"처, 처음 맛보는 된장국의 맛이 나!\""
2600205-41 = "네, 네에?!"
2600205-42 = "네, 네에?!"
2600205-43 = "어, 어째서죠?!"
2600205-44 = "[s] \"으음……! 방식을 바꿔보자!\""
2600205-45 = "(처음으로 돌아가, 이번에는 주리가 가져온 재료가 아니라, 새롭게 준비한 재료로 만들어 보기로 했다.)"
2600205-46 = "과연, 어쩌면 제가 가져온 재료 자체의 문제일 수도 있으니."
2600205-47 = "이번에는 선생님이 가져온 것으로……."
2600205-48 = "네, 알겠습니다."
2600205-49 = "다시 만들어 볼게요!"
2600205-52 = "와, 완성했어요!"
2600205-53 = "[s] \"그럼……! 합!\""
2600205-60 = "어, 어떠신가요?!"
2600205-61 = "[s] \"짜고, 달고, 맵고, 신맛이 나……!\""
2600205-62 = "네에?! 어, 어째서……?!"
2600205-63 = "[s] \"으음! 또 방법을 바꿔보자!\""
2600205-64 = "또 무, 무슨 방법이죠?!"
2600205-65 = "(이번엔 아예 각자 요리를 만들던 도중에, 도중에 바꿔서 완성해보기로 하였다.)"
2600205-66 = "[s] \"이 방법이라면……!\""
2600205-70 = "[ns] \"이번엔 아예 짠맛 밖에 안 나!\""
2600205-71 = "(쿠궁!)"
2600205-72 = "[s] \"그렇다면 이번엔 아예……!\""
2600205-73 = "(방침을 바꿔서 이번엔 아예 완성 직전까지 만든 요리를, 마지막에 주리가 끓여내면서 마무리하는 쪽으로 방법을 바꾸었다.)"
2600205-78 = "[ns] \"이하…… 동문!\""
2600205-80 = "(그 뒤로도 몇 번이고 도전했지만, 주리가 만든 음식에선 매번 기묘한 맛이 났다.)"
2600205-81 = "(심지어 전부 레시피대로 똑같이 만든 다음, 맨 마지막에만 주리가 국자를 담갔을 뿐인데도 된장국의 맛은 변모했다.)"
2600205-82 = "[s] \"……이건, 혹시 기적?\""
2600205-83 = "……."
2600205-84 = "으아아앙~! 이게 어디가 기적인가요!"
2600205-85 = "저는……."
2600205-86 = "그냥 실패하지 않고 요리를 만들고 싶을 뿐인데~!"
2600205-87 = "[s] \"으음…….\""
2600205-88 = "모처럼……."
2600205-89 = "모처럼 이렇게 선생님께서 직접 도와주러 오셨는데, 또……."
2600205-90 = "실패하는 건 자주 있는 일이지만."
2600205-91 = "그래도 오늘은 선생님이 같이 계시니까."
2600205-92 = "어떻게든 이유를 알아내서……."
2600205-93 = "이번에야말로 멋지게 요리를 완성하는 모습을 보여드리려고 했는데."
2600205-94 = "훌쩍……. 죄송해요……. 선생님……. (추욱)"
2600205-95 = "[s] \"아냐.\""
2600205-97 = "[s] \"아직, 포기하긴 일러.\""
2600205-98 = "……선생님?"
2600205-99 = "[s] \"처음부터 다시 차근차근 시도해보자.\""
2600205-100 = "……네?"
2600205-101 = "[s] \"괜찮아. 실패했다면 다시 만들면 돼.\""
2600205-103 = "[s6] \"이번 방법이 틀렸다면, 다음엔 다른 방법을 찾아보는 거야.\"\n[s7] \"지금껏 이런 식으로 주리가 노력해왔다는 걸 잘 알고 있으니까.\""
2600205-104 = "지금껏 제가 해온 노력을, 선생님께서는 다 알고, 계신다고……."
2600205-105 = "지금껏 제가 해온 노력을, 선생님께서는 다 알고, 계신다고……."
2600205-106 = "……."
2600205-107 = "선생님……!"
2600205-108 = "[s] \"응? 왜 그래?\""
2600205-109 = "네, 선생님 말씀이 맞아요……!"
2600205-110 = "제가…… 너무 약한 소리를 했어요."
2600205-111 = "저, 게헨나 급양부의 주리, 아직 지지 않았으니까요."
2600205-112 = "선생님을 위해서라도……! 아직 갈 수 있습니다, 네!"
2600205-115 = "[s] \"으, 으응? 주리야?\""
2600205-116 = "선생님의 손, 네에. 역시나 상상한 대로 무척이나……."
2600205-117 = "따듯하네요."
2600205-118 = "자아, 선생님, 곁에서 제 손을 쥐어주시겠어요?"
2600205-119 = "아예 처음부터…… 이번엔 칼을 써는 것부터, 다시 시작할게요."
2600205-120 = "그러니 제 고집에 잔뜩 어울려주세요!"
2600205-122 = "(그렇게 하루 종일 주리와 함께, 몇 번이고 요리에 도전했다.)"
