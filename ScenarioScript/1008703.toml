[translation]
1008703-1 = "아무튼 반품할 거예요!"
1008703-4 = "……자아, 나와보십시오. 고객님."
1008703-11 = "어, 어떠신가요? ……선생님?"
1008703-12 = "[s1] \"오오오……!! 엄청나게 잘 어울려!\"\n[s2] \"살짝 인정하는 게 분할 정도로 엄청 예뻐, 아코!\""
1008703-15 = "……그런가요? 선생님이 좋아하는 디자인이니까 그런 걸지도……."
1008703-16 = "사이즈는 딱 맞는 것 같은데, 어디 불편한 부분은 없으신가요?"
1008703-21 = "흐응…… 아뇨, 특별히…… 등이 좀 썰렁한 느낌이지만……."
1008703-25 = "그치만 뭐랄까…… 약간 뭔가……."
1008703-26 = "등은 원래 그런 디자인이니까 어쩔 수 없지만, 길이는 살짝 조정해야겠네요."
1008703-27 = "다시 갈아입고 오시겠어요? 바로 수선해 두겠습니다."
1008703-34 = "흐음……."
1008703-35 = "[s] \"잘 어울리던데 뭔가 신경 쓰이는 거라도 있었어?\""
1008703-39 = "신경 쓰인다기보다는……"
1008703-45 = "그…… 저기……."
1008703-51 = "응……? 선도부에서 연락이……?"
1008703-55 = "네, 행정관입니다."
1008703-61 = "네? 뭐라고요? 만마전 녀석들이 또?!"
1008703-62 = "아. 저, 저는 잠깐 개인적인 사정으로 자리를 비운 상태예요. 네, 지금 바로 출발할 거예요. 그동안 제 지시를 기다리세요!"
1008703-66 = "선생님! 죄송해요. 급한 일이 생겨서 돌아가 봐야 해요."
1008703-67 = "[s] \"무슨 일이야?\""
1008703-68 = "늘 평상시대로의 귀찮은 일이에요!"
1008703-69 = "별거 아니니까, 선생님은 신경 쓰지 않으셔도 돼요."
1008703-73 = "미안해요, 선생님! 드레스만 좀 부탁드릴게요!"
1008703-79 = "[ns] \"변함없이 선도부 일로 바쁜가 보네…….\""
1008703-83 = "어라, 고객님은요?"
1008703-84 = "[s3] \"바쁜 일이 있어서 먼저 돌아갔습니다.\"\n[s4] \"드레스는 저에게 주시면 될 것 같습니다.\""
1008703-87 = "이런이런……. 그렇군요. 수선도 끝났고 드라이클리닝까지 다 끝났으니 이대로 가져가시면 됩니다."
1008703-88 = "계산도 이미 끝났고…… 남은 건……."
1008703-92 = "아, 맞아. 깜빡한 게 있는데요."
1008703-96 = "아무래도 이런 디자인이다 보니까 이 드레스는 입을 때 전용 이너웨어를 입으셔야 합니다."
1008703-97 = "그래야 라인도 살아나고 움직일 때 불편하지 않거든요."
1008703-98 = "[s] \"아 그래서 그때…….\""
1008703-99 = "저희 가게에서는 전용 이너웨어를 따로 판매하고 있습니다만, 어떠신가요?"
1008703-100 = "디자인은 이렇습니다만."
1008703-104 = "[ns] \"……이너웨어 맞죠? 리본 끈이 아니라\""
1008703-105 = "네…… 하지만 어디까지나 옷의 맵시를 살리기 위한 용도라서……."
1008703-109 = "[ns5] 뭔가 또 화를 낼 것 같은 예감이 들지만, 그래도 사주기로 한다.\n[ns6] 미래가 약간 예상되긴 하지만 그래도 선물하기로 한다."
1008703-112 = "네. 잘 결정하신 겁니다."
1008703-113 = "이너웨어는 드레스와 함께 포장해서 드리겠습니다."
1008703-121 = "(아코는 부재중이어서 자리에 드레스를 놔두고 돌아왔다.)"
