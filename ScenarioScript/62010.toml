[translation]
62010-1 = "제1화;이름 없는 봉사 활동"
62010-3 = "구호가 필요하다는 직감을 따라, 여기에 도착했습니다!"
62010-8 = "그건 도대체 무슨 말인가요?!"
62010-9 = "[s] \"아니야……. 그럴 수 있어. 미네라면 그럴 수 있어…….\""
62010-10 = "무슨 소리예요. 이 사람들 아세요? 저는 잘 모르는데 말이죠."
62010-15 = "아, 선배! 저 사람들–"
62010-16 = "[s] \"??!!\""
62010-18 = "[ns] \"자, 잠깐만!\""
62010-28 = "[ns] \"전부 왔지?\""
62010-29 = "네, 네에……."
62010-30 = "으, 음. 무슨 일인가 했지만……."
62010-31 = "그렇습니다. 그렇게 급히 손을 잡아끌지 않으셔도, 말씀만 하시면……."
62010-32 = "그래서 무슨 일이야, 선생님?"
62010-33 = "맞아요! 선생님의 그런 표정, 처음 봤어요. 혹시 무서운 일이 있으시다면, 하나에가 응원해 드릴게요!"
62010-34 = "[s] \"우선 말이지…….\""
62010-39 = "이 학생들…… 누구인지, 알고 있느냐고요?"
62010-46 = "……구호기사단, 이라고 하는 분들이죠."
62010-47 = "트리니티의……."
62010-48 = "안녕, 구호기사단 여러분. 그때 이후로는 처음이지? 그때, 제4 성소 말이야."
62010-49 = "네, 네에……. 잘 지내셨나요. 스쿼드, 여러분……? 그때는 뭔가, 경황이 없어서……."
62010-50 = "뭔가, 대단한 복장을 입었던 수녀도 있었던 것 같은데, 지금은 같이 오지 않은 모양이네."
62010-52 = "사쿠라코 님은, 시스터후드–"
62010-57 = "사, 사쿠라코 님은 지금 조금 바쁘셔서요! 네! 그, 시험공부로요!"
62010-59 = "아, 아하……. 그 시험, 말씀이시군요……."
62010-63 = "어라……? 그러면 여러분은, 시험 준비…… 안 하셔도 되나요?"
62010-64 = "그게, 말이죠……."
62010-69 = "구호의 손길을 내미는 것 역시, 시험만큼이나 중요한 일이라고 아니 할 수 없을 것입니다!"
62010-70 = "저는 저희 자매님들은 모두, 구호와 시험 모두를 양립할 수 있을 것이라고 믿어 의심치 않습니다."
62010-71 = "그렇게 하는 것 역시 다른 의미에서 구호의 정신일 테니까요."
62010-72 = "무엇보다도 저는, 모의고사에서 언제나 1등급 성적을 놓치지 않았으니 말이죠."
62010-73 = "[s] \"그건 정말 대단하구나. 역시 미네야.\""
62010-77 = "가, 감사합니다. 선생님……."
62010-78 = "[s1] \"그래서 말인데. 여기 있는 모두에게 부탁 좀 할게.\"\n[s2] \"구호기사단과 트리니티에 대해서는, 모르는 척해 줘.\""
62010-84 = "왜요?"
62010-85 = "그렇습니다. 그 말씀은 조금 이상하군요. 구호의 길을 굳이 감출 필요가……."
62010-92 = "단장님? 여기에서는 선생님께서 말씀하시는 대로 하죠."
62010-93 = "네? 어째서인가요, 선배? 우리는 이분들을 돕기 위해서 여기에 온 거잖아요?"
62010-94 = "그, 그게…… 바로 그렇게 하기 위해서, 우리는 구호기사단이라는 사실을 숨겨야 할 것 같아요!"
62010-95 = "그런…… 가요?"
62010-96 = "네, 네에! 저기, 경전에도 있잖아요? '오른손이 하는 일을 왼손이 모르게 하라' 같은 말이요!"
62010-97 = "그 말은 근본적으로는 옳은 말입니다만, 구호기사단보다는 시스터후드 쪽에 더욱 어울리는 것이 아닐지……."
62010-98 = "선생님께서 다 뜻이 있으실 거예요!"
62010-102 = "그렇다면…… 알겠습니다. 그렇게 하도록 하겠습니다, 선생님."
62010-103 = "[s] \"고마워, 세리나! 역시 이럴 땐 세리나가 최고야!\""
62010-107 = "네? 네. 감사합니다, 선생님. 에헤헤……."
62010-109 = "……그렇군요. 가슴 한구석은 아직 납득하기 어렵습니다만, 머리로는 이해했습니다."
62010-110 = "개인적으로는, 오히려 이럴 때야말로 더욱 널리 구호의 뜻을 펼쳐서."
62010-111 = "아리우스 분들에게 저희의 진심을 전달해야 하는 것이 아닌가, 하는 심정입니다만……."
62010-112 = "[s] \"부탁이니까……. 응?\""
62010-113 = "네. 알겠습니다. 선생님의 말씀도 있고."
62010-117 = "여기에서는 가능한 한, 저희 학교와 구호기사단이라는 표현을 사용하지 않기로 하겠습니다."
62010-118 = "[s] \"다른 모두도, 괜찮지?\""
62010-128 = "네, 네에……."
62010-129 = "저, 그래서 말인데요……. 단장님……?"
62010-130 = "여기에서만, 단장님을…… '선배'라고 부르는 건 어떨까요?"
62010-131 = "단장님이라고 부르는 것만으로, 어딘가의 단체라는 느낌을 줄 수 있을지도 모르니까요."
62010-132 = "네? 그렇지만……."
62010-133 = "……아뇨. 그 부분은 확실히 그렇겠군요. 그러면, 으음."
62010-134 = "여러분. 새로운 호칭으로 저를 불러 주시겠습니까?"
62010-135 = "네! 미네 단…… 선배!"
62010-139 = "미네, 선배……."
62010-140 = "그렇게 할게요. 미네 선배……."
62010-144 = "죄, 죄송합니다! 그 호칭은 여기에서만이니까요! 너무 버릇없다고 생각하지는 말아 주세요!"
62010-145 = "아, 아뇨. 아닙니다."
62010-146 = "오히려, 친근한 느낌이 들어서, 좋을. 지도요……."
62010-151 = "대강 정리가 된 듯하니, 실례하지."
62010-152 = "구호기사단……. 아니, 아직 이름이 지어지지 않은 선의의 봉사 활동 동아리는, 구호의 뜻을 널리 펼치기 위해 아리우스 분교에 왔다."
62010-153 = "아직까지는 이 인식이 맞을까?"
62010-154 = "네. 정리 감사드려요. 사오리 씨. 하지만 스쿼드 여러분도 아리우스 소속이실 텐데……."
62010-155 = "저희가 이러고 있는 것…… 괜찮으신가요……?"
62010-156 = "괜찮아, 세리나 씨. 우리가 아리우스 소속이냐, 아니냐고 한다면 분명 아리우스 소속이겠지만……."
62010-157 = "……."
62010-158 = "지금은, 살짝 겉돌고 있는 처지니까."
62010-160 = "……겉도는 수준이면 차라리 다행이지……."
62010-161 = "저는 잘 모르겠지만, 뭔가 잘 된 거죠? 다행이에요!"
62010-162 = "후후. 하나에 씨라고 했지? 언제나 기운이 넘쳐서 좋네. 앞으로 잘 부탁해?"
62010-163 = "네!"
62010-164 = "……."
62010-165 = "세리나 씨? 하나에 씨를, 잠시 우리에게 빌려주지 않을래? 보고 있으면 우리까지 기운이 날 것 같아서. 그 대신 히요리를 줄게."
62010-167 = "네, 네에?!"
62010-168 = "네에에에에?!?!"
62010-169 = "……."
62010-170 = "자, 잘 부탁드립니다. 세리나 씨, 미네 씨……."
62010-171 = "서, 선생님? 이것도 또 다른 구호의 방식, 인 걸까요……?"
62010-173 = "어라? 저는 이제부터 어떻게 되는 건가요?"
62010-174 = "미안, 미안. 모두들 미안해. 농담이었어. 하나에 씨가 너무 밝고 올곧아서, 조금."
62010-176 = "그, 그런 것이었군요……. 네. 하나에 쨩은 그야말로 아침 나팔꽃 같으니까요."
62010-177 = "에헤헤. 저는 다 농담일 줄 알았어요……."
62010-182 = "으어어어어……."
62010-183 = "[s] \"……괜찮니?\""
62010-184 = "기 빨려요……."
62010-185 = "[s] \"그 느낌 알지…….\""
62010-189 = "[ns] \"그러면 이제부터 어떻게 할 거야?\""
62010-194 = "좋은 부분을 말씀해 주셨군요. 선생님."
62010-195 = "구호의 정신을 널리 퍼트리기 위해서는, 그 거점이 필요한 법."
62010-199 = "구호기……. 아뇨. 저희 이름 없는 봉사 활동 동아리는, 구호소 설치부터 시작하고자 합니다!"
62010-204 = "임시 구호소"
62010-206 = "수고하셨어요! 미네 선배, 선생님!"
62010-207 = "고생 많으셨어요. 선생님. 미네 선배도요."
62010-208 = "선배……."
62010-212 = "엄청 빠르게 지은 것 같다고요? 익숙하거든요!"
62010-217 = "안녕하세요. 선생님. 그리고……."
62010-224 = "……."
62010-225 = "'자원봉사자', 여러분."
62010-229 = "아, 안녕하세요. 이곳의…… 학생회장, 이신 거죠?"
62010-230 = "아뇨. 그렇게 자칭할 수 있는 정도는 아닙니다. 여기는 아리우스니까요."
62010-231 = "죄송해요. 저희는 그런 거, 잘은, 몰라서……."
62010-236 = "네……?"
62010-237 = "……?"
62010-240 = "(무언가 이야기하려는 둘을, 간신히 말렸다…….)"
62010-243 = "어라, 그러면 자원봉사를 하려는 곳에 대해 아무런 정보도 없이, 그저 느낌만으로 여기까지 오신 건가요?"
62010-244 = "그, 그건……!"
62010-245 = "……."
62010-246 = "그렇습니다. 그것이 뭔가 문제라도 될까요?"
62010-247 = "다, 단장……. 선배?!"
62010-248 = "문제…… 까지는 아니겠습니다만, 어떤 위험이 있을지도 모르고, 무슨 일을 당할지도 모르는데."
62010-249 = "그저 무턱대고, 불쌍해 보이니까 마구잡이로 들어와서, 자기만족으로 이런 일을 벌인다는 게……."
62010-250 = "어떤 의미로는 엄청나게, 용감하다 싶어서요."
62010-251 = "무슨 말씀을 하시는가 했더니, 어렵지 않은 이야기였군요."
62010-255 = "네?"
62010-256 = "그것은 모두, '구호'가 충분하지 않기에 일어나는 일들일 뿐입니다!"
62010-257 = "구호, 요……?"
62010-258 = "그렇습니다. 구호가 모자란다면 더 많은 구호를, 충분하다 못해 넘칠 정도로 투입하여."
62010-259 = "한 명이라도 더 아파하고 괴로워하는 사람을 줄이는 것!"
62010-260 = "그것이야말로 구호 활동…… 자원봉사를 하는 데에 있어, 기본이 되는 마음가짐입니다!"
62010-261 = "그 앞에서 다른 조건 같은 것은, 그야말로 사소한 문제에 불과할 뿐입니다!"
62010-263 = "아, 아하하……."
62010-264 = "역시 선배세요!"
62010-269 = "……."
62010-270 = "과연, 듣던 대로 대단한 분들이시군요."
62010-275 = "(?! 듣던, 대로……?)"
62010-279 = "트리니티의 구호기사단 여러분."
62010-280 = "[s] \"?!?!!!!\""
62010-281 = "네, 네에?! 아니에요! 저희는, 그러니까, 저희는……!"
62010-282 = "하하. 그렇게 무리하실 필요 없어요."
62010-283 = "다른 누구도 아닌 제가, '트리니티'를 눈치채지 못할 리 없으니까요."
62010-284 = "……."
62010-285 = "번거로운 연극은 서로 그만두도록 하죠. 이야기가 길어져 봤자 서로에게 좋지 않을 것 같으니까요."
62010-286 = "당신들이 이름 없는 봉사 활동 동아리를 자칭하고, 그것을 끝까지 지켜 나갈 생각이며."
62010-287 = "봉사 활동의 영역을 넘어, 아리우스를 침범하지 않으려 한다면, 저는 이 이상 일을 크게 만들지 않겠습니다."
62010-288 = "여기에 계신 분들이 '티파티'나 '시스터후드'의 끄나풀이라면 이야기가 달라지겠습니다만."
62010-289 = "구호기사단은 트리니티 내에서도 상당히 외골수인 동아리인 것으로 알고 있어서 말이죠."
62010-290 = "잘…… 아시네요?"
62010-291 = "뭘요."
62010-292 = "모두, 원래는 하나였던 학원들이었잖아요?"
62010-293 = "……!"
62010-294 = "어쨌든, 결론만이라면 그렇습니다. 비밀을 지켜 주세요. 그러면 저는 못 본 것으로 하고 넘어가겠습니다."
62010-295 = "약속해 주실 수 있으실까요?"
62010-301 = "……알겠습니다. 그런 조건이라면."
62010-302 = "감사합니다."
62010-303 = "그보다 정작 구호기사단의 단장님은 안 오신 모양이군요? 뭐, 그럴 수도 있겠죠."
62010-304 = "큰 동아리의 대표 같은 걸 하다 보면, 모든 활동에 하나하나 참여할 수는 없는 법이니까요. 사람의 몸은 하나뿐이기도 하고."
62010-305 = "?!"
62010-306 = "네? 그건……."
62010-307 = "마, 맞아요! 단장님은 지금, 다른 구호 활동으로 조금 바쁘셔서요! 저희에게 이번 일을 특별히 부탁하셨답니다! 아하하하……."
62010-308 = "그……. 네. 그렇, 지요. 그런 것으로 하겠……. 아뇨. 그런 것입니다."
62010-312 = "네? 네……. 알겠습니다. 개인적으로는 다행이라고 생각하는 부분도 있으니까요."
62010-316 = "그 단장님, 자기가 옳다고 생각하면서, 눈앞을 가로막는 것은 다 부숴버리고, 일직선 돌격밖에 할 줄 모른다면서요?"
62010-317 = "그런 분이 이런 예민한 자리에 왔다면, 무슨 일이 일어났을지 상상도 하고 싶지 않네요."
62010-321 = "……조금, 잘못, 알고 계신 것, 같군요."
62010-322 = "구호기사단의, 단장, 님은, 구호의 정신을 널리 퍼트린다는 일념으로, 다른 모든 조건을 희생할 수 있는, 분입니다……!"
62010-323 = "하하하. 그리고 보통 그런 것을, 하나는 알고 둘은 모르는 바윗덩어리라고 하죠."
62010-324 = "말씀을, 약간만, 삼가주십시오. 단지 굳은 의지로, 갑옷과 같이 무장한 것을."
62010-325 = "그렇게 쉽고도, 가벼이 폄하하는 것은, 이 자리에 없는 분에 대한, 실례가 아닐까 합니다."
62010-326 = "……구호기사단원들은 서로에 대한 신뢰와 존경이 깊다고 하니, 정말로 그런 것 같네요."
62010-327 = "알겠습니다. 이 이야기는 여기까지 하기로 하죠."
62010-328 = "제가 더 있다가는 여러분의 '봉사 활동'을 방해하게 될 듯하니, 이만 물러가겠습니다."
62010-329 = "혹시 무언가 도움이 필요하시다면, 으음……. 뭐, 부담 없이 불러 주세요."
62010-335 = "미, 미네 선배……."
62010-336 = "미네 선배……."
62010-338 = "……"
