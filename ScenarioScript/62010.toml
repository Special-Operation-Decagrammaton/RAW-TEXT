62010-393 = "아닙니다. 선생님. 선생님은 최선을 다하셨습니다. 그건 제가 보장해 드릴 수 있습니다."
62010-394 = "하지만 이번 일은……."
62010-395 = "구호기사단이라고 칭하기 이전에 트리니티인 저희가, 아리우스 분들을 이해할 수 있다고 한다면."
