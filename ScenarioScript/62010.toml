62010-397 = "그러니 이해라는 단어를 꺼내는 것 자체가, 어떻게 보면 저희의 오만일지도 모르는 일입니다."
62010-402 = "그래도 저는 아직, 저희가 서로를 이해할 수 있다고 믿고 싶습니다."
62010-403 = "그렇게 믿고 행동해야, 조금이라도 더 나은 내일을 만들 가능성이 올라갈 테니까요."
