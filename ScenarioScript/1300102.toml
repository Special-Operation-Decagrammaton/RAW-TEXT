[translation]
1300102-1 = "구름의 냄새"
1300102-2 = "(상점가에 도착하자 마침 멍하니 걷고 있는 치세가 보였다.)"
1300102-7 = "[s] \"저기 치세, 뭐하고 있어……?\""
1300102-8 = "아, 선생님. 왔어?"
1300102-9 = "[s] \"계속 왔다 갔다 하던데.\""
1300102-10 = "그게……."
1300102-11 = "나, 구름을 쫓고 있었어."
1300102-12 = "[s] \"구름?\""
1300102-13 = "아, 저기, 또 움직인다."
1300102-14 = "선생님, 쫓아가야 해."
1300102-18 = "(치세는 흐르는 구름을 따라 천천히 걷기 시작했다.)"
1300102-19 = "[s] \"앗, 잠깐만, 치세, 기다려!\""
1300102-22 = "구름……."
1300102-27 = "[ns] \"치세가 찾는다던 구름이 저거야?"
1300102-28 = "으응, 달라."
1300102-29 = "내가 찾는 구름은, 좀 더, 보드라운 느낌."
1300102-30 = "하늘하늘~ 한 거야. 선생님."
1300102-31 = "[s] \"하늘하늘…….\""
1300102-32 = "……."
1300102-36 = "[ns] \"치세, 잠깐만!\""
1300102-38 = "(그 뒤로도 계속해서 구름을 따라 움직이는 치세를 쫓아, 이곳저곳을 돌아다니기 시작했다.)"
1300102-41 = "여기도, 아니야……."
1300102-50 = "여기에도, 없어."
1300102-51 = "으음~"
1300102-53 = "[s] \"치, 치세 잠깐 멈춰 봐!\""
1300102-55 = "으응-? 선생님? 왜 그래?"
1300102-56 = "[s1] \"그, 무작정 찾으려고만 하지 말고.\"\n[s2] \"정확히 어떤 특징의 구름을 찾는 거야?\""
1300102-57 = "내가 찾는 구름의 특징……."
1300102-58 = "내가 찾는 구름의 특징……."
1300102-59 = "[s] \"그걸 설명해 주면, 둘이서 더 빠르게 찾을 수 있을 거야.\""
1300102-60 = "아~ 선생님과 둘이서 찾으면……."
1300102-61 = "그렇구나~ 더 빠르겠네."
1300102-62 = "그러니까 내가 찾고 싶은 구름의 특징……. 그건."
1300102-63 = "일단--"
1300102-64 = "[s] \"일단……?\""
1300102-65 = "보드라운 구름이었-어."
1300102-66 = "[s3] \"보드랍다. 응. 앞에서 말했었지.\"\n[s4] \"보드라운 감촉의 구름이었다고. 그리고?\""
1300102-67 = "그리고……."
1300102-68 = "그리고……."
1300102-69 = "엄청 좋은 냄새가 났어."
1300102-70 = "[s5] \"응응. 좋은 냄새가 났다, 라.\"\n[s6] \"……응? 냄새……?\""
1300102-71 = "응."
1300102-72 = "응."
1300102-73 = "스읍-하 하고 맡으면, 하늘을 두둥실 뜨는 거 같이 부들부들하고, 하늘하늘~하는 냄새였어."
1300102-74 = "[s] \"그, 좀 더 구체적으로 설명해 주지 않을래……?\""
1300102-75 = "좀 더 구체적……."
1300102-76 = "아."
1300102-77 = "이렇게 뿅뿅 하는 해님 같은 냄새였어."
1300102-78 = "[s7] \"해, 해님 같은 냄새…….\"\n[s8] \"으, 으음. 그밖에 다른 특징은?\""
1300102-79 = "그거 말고 또 다른 특징이……. 다른 특징……."
1300102-80 = "그거 말고 또 다른 특징이……. 다른 특징……."
1300102-81 = "아, 있어."
1300102-82 = "[s] \"오, 있구나! 그게 뭐야?\""
1300102-83 = "그 구름, 선생님과 비슷한 느낌이었어."
1300102-84 = "응, 선생님 같았어."
1300102-85 = "[s9] \"????\"\n[s10] \"……나, 같았다고?\""
1300102-86 = "응~ 해님같이 따끈따끈하고. 좋은 냄새도 나고~ 같이 있으면 행복한 기분도 들어서~"
1300102-87 = "응~ 해님같이 따끈따끈하고. 좋은 냄새도 나고~ 같이 있으면 행복한 기분도 들어서~"
1300102-88 = "엄청 좋아해."
1300102-89 = "[s11] \"그, 그렇구나.\"\n[s12] \"치세가 본 구름 이야기 하는 거…… 맞지?\""
1300102-90 = "응, 내가 본 구름 이야기. 맞아~"
1300102-91 = "응, 내가 본 구름 이야기. 맞아~"
1300102-92 = "오늘 이렇게나 날씨 좋으니까~ 오늘이라면 찾을 수 있지 않을까~?"
1300102-93 = "찾을 수 있었으면 좋겠는데……."
1300102-95 = "(그렇게 치세와 함께 한참을 구름을 찾아 돌아다녔지만. 마땅한 소득 없이 해가 저물었다.)"
1300102-98 = "[ns] \"구름은, 결국 못 찾았네.\""
1300102-99 = "응."
1300102-100 = "[s] \"괜찮아, 기회는 오늘만 있는 게 아니니까. 다음번에 또…….\""
1300102-101 = "(지그---시)"
1300102-102 = "[s] \"치세……?\""
1300102-103 = "(지그---------시)"
1300102-104 = "[s] \"치세, 뭘 그렇게 보고 있는 거야?\""
1300102-107 = "솜사탕……."
1300102-108 = "[s] \"솜사탕?\""
1300102-110 = "[s] \"혹시, 솜사탕이 먹고 싶은 거면……. 사줄까?\""
1300102-111 = "(끄덕)"
1300102-114 = "구매해주셔서 감사합니다!"
1300102-116 = "냠."
1300102-117 = "[s] \"어때, 맛있어?\""
1300102-118 = "응."
1300102-119 = "[s13] \"다행이다.\"\n[s14] \"구름은 못 찾았지만, 그건 다음에 다시 같이 찾으면 될 테니까.\""
1300102-122 = "응……. 하웁, 냠냠."
1300102-123 = "[s] \"근데, 결국 그 구름은 뭐였던 거야?\""
1300102-124 = "우음, 설명하기, 힘들어."
1300102-125 = "그치만, 괜찮아……."
1300102-126 = "이 구름도, 마음에 드니까."
1300102-127 = "[s] \"구름?\""
1300102-128 = "모양과, 느낌은 조금 다르지만. 선생님이 사준……."
1300102-129 = "맛있는 구름이니까."
1300102-130 = "[s] \"……?\""
1300102-131 = "아……."
1300102-132 = "양손이 끈적끈적해졌어. 선생님."
1300102-133 = "[s] \"아, 잠깐만, 치세 손을 닦을 티슈가 분명 여기 어딘가에……\""
1300102-134 = "음~ 끈적거리지 않게 남은 솜사탕은 물에 씻어서 먹어야겠다."
1300102-135 = "[s] \"……아니, 아무리 그래도 그건 아니지!\""
1300102-137 = "(직후 끈적거리는 손을 닦겠다며 달려가려는 치세를 필사적으로 막았다.)"
