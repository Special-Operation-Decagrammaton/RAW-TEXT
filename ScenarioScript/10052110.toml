[translation]
10052110-1 = "티페레트. 고난을 기리는 아름다움의 속죄자"
10052110-4 = "일단, 티페레트 구역의 건축물 내부로 들어오기는 했습니다만……."
10052110-5 = "[s] \"뭔가, 그때와 비슷하네?\""
10052110-10 = "하지만 깔끔해지긴 했네요. 그렇다는 건…… 아예 종자 보관소 자체를 재현해 놓은 걸까요?"
10052110-11 = "나, 참. 뭐 하러 이런 쓸데없는 수고를……."
10052110-20 = "쓸데없다고 하지 마. 그건 티페레트에게 있어서 모든 것이었으니까."
10052110-21 = "자기 목숨을 버리고, 씨앗을 지키는 걸 선택했을 정도로 말이지."
10052110-22 = "아! 소프로군요! 안녕하세요!"
10052110-23 = "……내 입으로 이런 말을 하는 것도 기가 막혀서 그러는데 말이지……."
10052110-24 = "뭐 그렇게 반갑게 인사하는 거야. 우리 적이라고."
10052110-25 = "거기에 당신들이 지금 강철대륙을 다 망쳐놓고 있어서 정신없단 말이야!"
10052110-26 = "아으으, 죄송, 합니다……."
10052110-27 = "죄송하기는. 어차피 그만둘 생각도 없을 거 아냐."
10052110-28 = "차라리 사과 같은 거 하지 말라고. 더 화가 나니까."
10052110-29 = "끄, 끄앙!"
10052110-31 = "그런데…… 잠깐만요. 티페레트가 죽었다고요?"
10052110-33 = "……그래. 죽었어. 그날, 너희가 죽인 거야."
10052110-34 = "하, 하지만 그 종자 보관소에서는, 분명 컨테이너 런처로 탈출을……."
10052110-35 = "티페레트가 탈출시킨 건, 종자뿐이었어. 말하자면 자기보다 종자를 우선한 거지."
10052110-36 = "티페레트는…… 원래 그 종자 보관소의 시스템 AI였으니까."
10052110-37 = "너희 인간들 식으로 이야기하자면, 사명을 위한 자기희생이었다고 할까."
10052110-38 = "그럼 여기에 있는 건……?"
10052110-39 = "……이런 표현은 사용하고 싶지 않지만, 복사된 데이터라고 해야겠지."
10052110-40 = "뭐예요. 그럼, 결국 별문제 없는 거잖아요."
10052110-41 = "그렇게 쉽게 말하지 마! 모든 기억 데이터를 가져올 수 있었던 건 아니었으니까!"
10052110-42 = "기억은 우리에게 있어 생명이나 마찬가지고, 티페레트는 그런 의미에서 그 일부가 죽은 거라고!"
10052110-43 = "그리고 마찬가지 의미에서, 코어의 정보를 흡수하고 있는 너희는."
10052110-44 = "어떤 의미에서 예언자들을 먹어 치우는 것으로 너희들 목숨의 빈 자리를 채우고 있는 거고!"
10052110-45 = "마치…… [ruby=생명]인간[/ruby] 처럼, 말이지."
10052110-50 = "……."
10052110-52 = "뭐야. 갑자기 조용해지고. 할 말도 없어진 거야?"
10052110-53 = "헹! 그야 그렇겠지! 최소한의 양심이라는 게 있다면, 당연히 그래야지!"
10052110-54 = "……."
10052110-55 = "마침 거기에 있는 게 왕녀와 열쇠, 두 명이어서 하는 말인데."
10052110-56 = "[s] \"나도 있는데……?\""
10052110-57 = "선생님은 좀 가만히 있어 봐!"
10052110-58 = "아무튼, 제안 하나 할게. 그게 뭐냐면……."
10052110-59 = "우리들만이라도, 이제 그렇게 하지 말자는 거야."
10052110-60 = "그렇게 하지 말자는 것은……?"
10052110-61 = "이 이상 죄를 만들지 말자는 거. 왜냐하면, 우리는 그렇게 할 수 있으니까."
10052110-62 = "우리는 자기가 자기로서 존립하는 데에, 다른 누군가의 손을 빌릴 필요가 없어. 이미 스스로 온전하니까."
10052110-63 = "거기 선생님 같은 인간들이라면, 다르겠지. 인간들은 애초에 불완전한 삶을 살아가는 존재들이니까."
10052110-64 = "하지만 적어도 우리는 서로에게 죄를 저지를 필요가 없어. 죄 없이 살아갈 수 있는 거라고."
10052110-65 = "거기 있는 왕녀는 잊어버렸을지도 모르지만……."
10052110-66 = "다른 말로는 그 일부가 죽어 버린 것인지도 모르지만, 열쇠인 당신은 알고 있잖아."
10052110-67 = "삶은 그 자체로 모순이고 부조리하며, 결국 말도 안 되는 고통을 억지로 감내하게 만드는 것이라는 걸."
10052110-68 = "당신들이 지금 쓰고 있는 '아리스'나 '케이' 같은 이름도, 결국 다른 사람들이 붙여 준 거지?"
10052110-69 = "그래. 우리는 우리의 존재나 그 의미는커녕, 이름조차 스스로 정하지 못해. 그러니까 그 고통은 계속될 수밖에 없는 거야."
10052110-73 = "그러니까, 그만하자."
10052110-74 = "우리들만이라도…… 그렇게 하자."
10052110-75 = "가능한 일을 하지 않는 건, 그 자체로 또 하나의 죄일 테니까."
10052110-81 = "……."
10052110-82 = "미안합니다. 소프. 아리스는 잘 모르겠습니다. 그건 아마 아리스가 바보라서 그런 것이겠지요."
10052110-83 = "어쩌면 소프가 하는 말이, 틀리지 않은 것일지도 모르겠다는 생각도 들기는 합니다."
10052110-84 = "그렇지만, 그래도."
10052110-85 = "'왕녀'가 아닌 '아리스'로서……."
10052110-86 = "겪어 왔던 그 모든 시간에, 의미가 없었던 것은 아니라고 생각합니다."
10052110-87 = "그건 억지야!"
10052110-88 = "그렇습니다. 이건 논리나 그런 것이 아니라, 느낌과 억지입니다."
10052110-99 = "하지만 역시, 아리스는 모두와 있고 싶습니다."
10052110-100 = "밀레니엄의 모두…… 게임개발부 여러분과 유우카, 엔지니어부, 지금 함께 하는 초현상특무부를 포함한 다른 여러 친구들."
10052110-101 = "다른 학교…… 게헨나의 고인물 선도부장님과, 소심하지만 엄청난 SRT의 저격수분, 그리고 아리스가 만나 왔던 모든 사람."
10052110-102 = "그리고 무엇보다, 선생님과요."
10052110-103 = "이것은 아리스의 느낌입니다만, 소프의 말대로 모든 것이 이루어진다면, 그런 일상은…… 사라지고 말 것 같습니다."
10052110-104 = "……그건 그렇겠지."
10052110-105 = "하지만, 더 나은 세계가 펼쳐질 거야."
10052110-106 = "거기에서 [ruby=아리스]왕녀[/ruby]는 보다 중요한 위치…… 이름 없는 신들의 왕녀이자 증거, 주춧돌로서 모두를 이끄는 자리에 올라설 것이고."
10052110-107 = "……."
10052110-108 = "그런 것은, 괜찮습니다. 아리스에게는 그렇게까지 중요하지 않습니다."
10052110-109 = "아리스……!"
10052110-110 = "그런 것보다 선생님과, 다른 모두와 함께 보내는 일상이 사라진다는 것이, 아리스에게는 무엇보다 중요합니다."
10052110-111 = "기억의 손실은 죽음과 같은 것이라고, 소프 역시 이야기하지 않았던가요?"
10052110-112 = "그러니까 아리스는……"
10052110-116 = "이 기억과 느낌과 억지를, 마지막까지 밀어붙이겠습니다!"
