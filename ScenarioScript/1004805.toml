[translation]
1004805-1 = "자책"
1004805-4 = "(사오리의 연락을 받은 뒤로, 불길한 생각밖에 들지 않아 곧바로 사오리를 찾기 위해 블랙마켓을 찾아왔다.)"
1004805-12 = "[ns] \"초, 총소리?!\""
1004805-13 = "거기! 여기 어쩐 일로 찾아왔는지는 모르겠지만. 조심해!"
1004805-14 = "[s] \"이게 무슨 소동이죠?!\""
1004805-15 = "지금 블랙마켓에서 흉폭하기로 유명한 왈왈멍멍파와 냐옹냐오옹파가 정면으로 붙었대!"
1004805-16 = "그런데 왈왈멍멍파가 고용한 녀석 중에 엄청난 실력자가 있다는 거 있지!"
1004805-17 = "덕분에 냐옹냐오옹파에서 엄청난 피해가 나온 모양인데."
1004805-18 = "그게 또 냐옹냐오옹파가 함정을 파서 실력자를 쓰러트렸다는 이야기가 있기도……!"
1004805-19 = "[s] \"설마, 사오리가……?!\""
1004805-23 = "아앗?! 자, 잠깐!"
1004805-24 = "지금 블랙마켓 서쪽 지구는 냐옹냐오옹파의 주력이 장악하고 있으니까! 가면 위험하다고?!"
1004805-29 = "(어디로 보나 불길하기 짝이 없는 그 이야기에, 다급해진 마음으로 사오리를 찾아 블랙마켓 거리를 달리기 시작했다.)"
1004805-39 = "[ns] \"사오리……!\""
1004805-41 = "[ns] \"사오리, 어디 있는 거야……!\""
1004805-47 = "(그렇게 얼마나 사오리를 찾아, 블랙마켓의 뒷골목을 헤매고 다녔을까.)"
1004805-50 = "하아…… 하아……."
1004805-51 = "[ns] \"……?! 이 목소리는……! 사오리!\""
1004805-62 = "[wa:950]― 선생…… [wa:1800]어째서 여기에?"
1004805-65 = "[ns] \"사오리, 너, 상처가…….\""
1004805-66 = "[wa:150]― 크윽…… [wa:750]하아아……"
1004805-69 = "― ……신경 쓰지 마. [wa:1500]자주 있는 일이니까."
1004805-72 = "[wa:650]― 그저, 내 마무리가 [wa:1900]어설펐을 뿐이야……"
1004805-74 = "― 아무것도 [wa:250]달라진 게 없는데……"
1004805-77 = "― 멋대로 착각해버린 거지. [wa:300]"
1004805-80 = "[wa:50]― 콜록, [wa:700]콜록……"
1004805-82 = "― 그런 표정 짓지 마. [wa:2350]고통은 익숙하니까."
1004805-85 = "― 지금껏 해온 것과 다를 건 없어."
1004805-87 = "― 새삼스러울 것도 없지."
1004805-90 = "[wa:500]― 지금은 [wa:400]이걸로 괜찮아……."
1004805-92 = "― 조금만 더, [wa:3100]이대로……"
1004805-96 = "[ns] \"일단 자리를 옮기자.\""
1004805-98 = "……응? 서, 선생. 잠ㄲ……"
1004805-105 = "[ns] \"우선 여기까지 오면 한시름 놔도 되겠지.\""
1004805-106 = "……또 괜히 폐를 끼쳐버렸군. 선생."
1004805-107 = "[s] \"어떻게 된 거야? 일을 받았다고는 들었지만.\""
1004805-108 = "나를 고용한 조직의 지시대로, 현장에 투입되어 항쟁을 마무리하려고 했을 뿐인데……."
1004805-109 = "그게 설마 적대 조직이 파 놓은 함정일 줄은……."
1004805-110 = "[s] \"계약서는 가지고 있어?\""
1004805-114 = "여기, 있다만……?"
1004805-120 = "[ns] \"……저기 사오리, 이 계약서의 내용대로라면…….\""
1004805-122 = "[ns] \"사오리 혼자 적대 항쟁 조직 냐옹냐오옹파를 상대해야 하는 계약인데요……?\""
1004805-123 = "……."
1004805-124 = "[s] \"설마 계약서의 내용…… 안 읽어본 거야……?\""
1004805-125 = "그…… 계약서라는 건…… 쓰기만 하면 되는 게……?"
1004805-126 = "[s] \"아니아니! 약관을 읽어보지도 않고 사인만 하면 엄청난 일이 되어버린다구?!\""
1004805-127 = "……으음?"
1004805-128 = "[ns] \"그래도 이 계약서, 내용이 제법 교묘하게 쓰여있다고 할까…….\""
1004805-132 = "(계약서에 쓰인 내용대로라면 사오리는 첫 번째 항쟁 이후, 서쪽 구역을 마무리하도록 유도하는 형태로 사태가 진행되었을 터였다.)"
1004805-133 = "[s] \"그러고 보면…….\""
1004805-135 = "아앗?! 자, 잠깐!"
1004805-136 = "지금 블랙마켓 서쪽 지구는 냐옹냐오옹파의 주력이 장악하고 있으니까! 가면 위험하다고?!"
1004805-140 = "(이곳으로 오는 길에 분명 서쪽 구역엔 냐옹냐오옹파의 주력이 진을 치고 있어 위험하다는 말을 들은 적이 있었다.)"
1004805-141 = "(이곳은 아직 서쪽 구역에서 떨어진 곳이긴 했지만, 만약 사오리가 계약서에 쓰인 내용대로 그곳으로 향해버렸다면……)"
1004805-142 = "[s3] \"즉…… 계약서를 읽었다면 더 큰 일이 벌어졌을 수도 있었다, 라는 건가.\"\n[s4] \"설마 사오리를 고용한 쪽에선 사오리가 아예 계약서도 안 읽어볼 줄은 몰랐겠지만…….\""
1004805-143 = "(이러한 정황과 사오리가 처한 상황에서 추론컨대.)"
1004805-144 = "(이러한 정황과 사오리가 처한 상황에서 추론컨대.)"
1004805-145 = "(애당초 사오리는 고용주인 왈왈멍멍파에 의해, 처음부터 버림 말 역할로서 고용된 입장인 듯했다.)"
1004805-149 = "(이 말인즉슨……)"
1004805-150 = "[s] \"이번엔 운이 좋았지만, 그래도 계약서는 제대로 읽지 않으면 안 돼. 사오리.\""
1004805-151 = "그렇군……. 또 속은 건가."
1004805-152 = "……뭐, 새삼스럽지도 않아. 자주 있는 일이니까."
1004805-153 = "[s] \"아…….\""
1004805-154 = "그래…… 특별하지도, 유난을 떨 일도 아니야. 그러니……."
1004805-155 = "[ns] \"……뭐, 그럼 어쩔 수 없지. 일단 밥이나 먹으러 갈까?\""
1004805-159 = "……밥? 선생, 무슨 소리를……?"
1004805-160 = "[s5] \"지금 사오리, 엄청 지친 상태잖아?\"\n[s6] \"지나간 일은 어쩔 수 없고, 밥이나 먹자는 거지.\""
1004805-161 = "그냥 밥을 먹자고……?"
1004805-162 = "그냥 밥을 먹자고……?"
1004805-169 = "자, 잠깐……!"
1004805-178 = "[ns] \"여기 라멘, 제법 맛있거든.\""
1004805-179 = "…………"
1004805-180 = "[s] \"이걸 다 먹고 난 뒤에, 제대로 같이 계약서에 대해 공부하자.\""
1004805-181 = "난……. 그런……."
1004805-182 = "[s] \"약속이야?\""
1004805-186 = "…………"
1004805-187 = "……알겠어."
1004805-188 = "알겠어……. 선생. 그렇게 해……."
1004805-189 = "나는…… 아직……. 그래……."
1004805-190 = "더…… 아직 배워야 할 게 많이 있을 테니까……."
1004805-192 = "(그렇게 사오리와 함께 식사를 끝내고,)"
1004805-193 = "(다음 공부를 위해 천천히 캄캄한 거리로 발걸음을 옮겼다.)"
