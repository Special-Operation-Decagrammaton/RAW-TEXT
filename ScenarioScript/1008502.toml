[translation]
1008502-1 = "디지털 노마드"
1008502-2 = "밀레니엄 학원 근교, 산림공원"
1008502-3 = "(하레의 연락을 받고 주말에 밀레니엄 학원 근교의 산림공원을 찾아왔다.)"
1008502-10 = "아, 선생님. 어서 와."
1008502-11 = "모모톡으로 말했던 것처럼 오늘은 야외에서 멋진 풍경을 바라보며 밀린 프로그래밍 작업을 마무리하려고."
1008502-12 = "나는 야외 작업에 필요한 인프라를 준비해야 해서 미리 일찍 나왔어."
1008502-13 = "금방이면 설치가 끝나니 잠시만 그 앞에서 기다려 줘."
1008502-14 = "[s] \"작업에 필요한 인프라……?\""
1008502-15 = "응. 야외에서 컴퓨터 작업을 하려면 여러 가지 전자 장비가 필요하잖아?"
1008502-16 = "클라우드 스토리지에 실시간으로 접속할 수 있는 네트워크 라우터라든가……"
1008502-17 = "배터리가 다 떨어졌을 때 급속 충전이 가능한 휴대용 파워 뱅크……"
1008502-18 = "아, 그리고 에너지 드링크를 항시 시원하게 보관할 수 있는 휴대용 냉장고도 빼놓을 수 없지."
1008502-19 = "[s] \"잠깐 작업을 하는데도 장비가 이렇게나 많이 필요해?\""
1008502-20 = "물론이야. 프로그래밍은 논리적인 사고를 요하는 묘수풀이에 가깝기 때문에, 집중에 방해가 되지 않도록 미리 최적의 환경을 조성해 두어야 하거든."
1008502-21 = "작업 중 멋진 아이디어가 떠올랐는데 장비가 불편해서 구현에 방해가 된다면, 모처럼 밖에 나온 의미가 없잖아?"
1008502-22 = "……에너지 드링크야 더 말할 필요도 없고."
1008502-23 = "마음 같아서는 평소에 쓰던 모니터와 키보드도 가져오고 싶었는데…… 짐이 너무 늘어나는 것 같아서 우선은 이 정도로 만족하려고."
1008502-27 = "[ns] (뭔가 디지털 노마드의 삶에서 꽤 멀어진 느낌이……)"
1008502-31 = "후우…… 바람이 상쾌하니 머리가 깨끗하게 정리되는 느낌인걸."
1008502-32 = "역시 조금 춥더라도 밖에 나오길 잘했어."
1008502-36 = "……그럼 바로 작업을 시작해 볼까?"
1008502-44 = "(잠시 후…… )"
1008502-49 = "……으음."
1008502-50 = "……불편해……."
1008502-51 = "[s] \"무슨 문제라도 있어?\""
1008502-52 = "아니, 작업에 큰 문제가 있는 건 아니지만……"
1008502-53 = "두꺼운 옷을 입고 야외에서 타자를 치려니 조금 손이 둔하게 느껴져서……"
1008502-54 = "그렇다고 실내처럼 얇은 옷을 입고 코딩을 할 수도 없고…… 생각보다 불편하네."
1008502-55 = "게다가 이 캠핑용 의자도, 오래 앉아 있으려니 허리가 아파와서……"
1008502-56 = "[s1] \"가볍게 스트레칭이라도 하는 게 어떨까?\"\n[s2] \"모처럼 밖에 나왔는데 일만 하고 가는 것도 아쉽잖아.\""
1008502-59 = "……그럼 선생님의 조언대로 잠깐 스트레칭이라도 할까."
1008502-63 = "으음…… 오늘은 날씨가 좋아서 그런지, 경치가 정말 아름답네."
1008502-64 = "하지만 작업하고 있을 때는 어두운 모니터에만 집중해야 하는데…… 주변 환경이 아름다워도 작업에 큰 의미가 있는 걸까……"
1008502-66 = "(잠깐 스트레칭을 한 뒤, 하레는 다시 불편한 자세로 작업을 계속했다……)"
1008502-71 = "……드디어 끝났다."
1008502-72 = "오늘 계획한 코드 작성을 모두 끝마쳤어. 이제 클라우드 서버에 동기화하기만 하면 돼."
1008502-73 = "[s] \"수고 많았어!\""
1008502-74 = "아니야. 선생님이야말로 모처럼의 휴일에 같이 어울려줘서 고마워."
1008502-75 = "여러모로 불편한 환경이었지만…… 그래도 딴짓할 거리가 없었던 탓인지 평소보다 작업 시간을 조금 더 단축한 것 같아."
1008502-76 = "일부러 무거운 장비를 가지고 밖에 나와서 작업한 보람이 조금은 있었으려나."
1008502-77 = "이제 기존 코드 위에 새로 작업한 코드를 덧붙여 업데이트하면……"
1008502-83 = "어라? 이게 왜 이러지……?"
1008502-89 = "<클라우드 서버 접속 오류. 네트워크 환경을 확인 후 다시 시도해주세요.>"
1008502-90 = "으으…… 왜 갑자기 여기서 접속 장애가……"
1008502-95 = "<클라우드 서버 접속 오류. 네트워크 환경을 확인 후 다시 시도해주세요.>"
1008502-99 = "<클라우드 서버 접속 오류——>"
1008502-106 = "<——동기화가 완료되었습니다!>"
1008502-107 = "휴, 다행이다. 인터넷이 끊긴 줄 알고 걱정했었네."
1008502-111 = "……어라?"
1008502-112 = "이거 왜 이러지……? 내가 방금 작성한 코드가 모두 사라졌어."
1008502-116 = "설마……"
1008502-123 = "[ns] \"무, 무슨 일이야?\""
1008502-124 = "……롤백 됐어."
1008502-125 = "클라우드 서버가 작업 전의 상태로 코드를 덧씌워 버렸어……"
1008502-126 = "반나절 동안의 고생이…… 순식간에 물거품으로……"
1008502-127 = "[s] \"백업이라든가, 복구할 방법은 없는 거야?\""
1008502-128 = "응……"
1008502-129 = "평소에 쓰던 컴퓨터에는 자동 백업 시스템이 있어서 방심하고 있었는데, 오늘은 클라우드 커맨드 라인에 직접 작업해 버려서……"
1008502-130 = "새로 쓰는 것 이외에 복구할 방법은 없을 것 같아……"
1008502-131 = "……평소처럼 부실에서 작업했다면 이런 일은 없었을 텐데."
1008502-135 = "앞으로 야외 작업은 절대로 하지 않을 거야!"
1008502-137 = "(이후, 낙심한 하레를 데리고 베리타스 부실로 돌아왔다.)"
