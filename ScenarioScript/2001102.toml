[translation]
2001102-1 = "아르바이트 공부"
2001102-2 = "(시간에 맞춰, 앞서 세리카와 약속한 장소에 나갔다.)"
2001102-3 = "아, 여기야. 선생님."
2001102-4 = "흠흠, 일단 오늘 이렇게 상담에 응해줘서 고마워. 선생님."
2001102-5 = "선생님은 그렇지 않아도 평소에 샬레 일로도 바쁠 텐데……."
2001102-6 = "[s1] \"세리카가 불렀는데 당연히 와야지!\"\n[s2] \"세리카에겐 몇 번이나 휘둘렸으니까. 괜찮아!\""
2001102-7 = "……응? 그게 무슨 의미야?"
2001102-8 = "[s3] \"그야 세리카는 특별하잖아?\""
2001102-9 = "내, 내가 특별……해?! 자, 잠깐만! 선생님!"
2001102-10 = "갑자기 그런 말을 해도 곤란, 하달까……! 그 말의 의미는 즉……!"
2001102-11 = "[s4] \"응! 세리카는 소중한 학생이니까!\""
2001102-12 = "…………어?"
2001102-13 = "……혹시, 선생님이 말하고 싶었던 건, 그것뿐?"
2001102-14 = "으. 으으으……!"
2001102-15 = "사, 사람이 착각할 법한 말은 함부로 하지 마! 나도 모르게 오해하게 되어버리잖아!"
2001102-16 = "아아~! 진짜!"
2001102-17 = " 자, 잠깐! 휘둘렀다니, 내가 언제……!"
2001102-18 = "……으음, 아니, 조, 조금은 확실히 그랬던 적이 있을지도 모르지만……."
2001102-19 = " 그, 그래도 그건 과거의 이야기니까! 지, 지금은 미안하다고 생각하고 있고……!"
2001102-20 = "나, 나도 반성하고 있달까……."
2001102-21 = "[s5] \"미안, 농담이야. 부르면 언제든지 올 테니까.\""
2001102-22 = "……응? 농담?"
2001102-23 = "……지금 막 살짝 반성하면서 나 자신을 되돌아보기까지 했는데?!"
2001102-24 = "잠깐이나마 지, 진심으로 미안하다고 생각했는데! 이, 이 바보……!"
2001102-26 = "으으……. 시작하기 전부터 지치는 느낌이야. 정말……."
2001102-27 = "[s] \"너무 기세를 타버렸습니다. 죄송합니다…….\""
2001102-28 = " 하아……. 진짜, 선생님도 차암……."
2001102-29 = "뭐, 됐어. 선생님이 내 상담에 응해주려고 이렇게 나와준 건 사실이고."
2001102-30 = "그, 그건 정말로 고맙다고 생각하고 있고……."
2001102-31 = "[s] \"세리카 상냥해!\""
2001102-32 = "뭐, 뭐야! 갑자기 호들갑을 떨고!"
2001102-33 = "됐어! 낯부끄러운 이야기는 여기까지! 지금부터 본론이니까!"
2001102-34 = "모모톡으로도 앞서 말했다시피 선생님을 부른 건 무녀 아르바이트에 대해 묻고 싶어서야."
2001102-35 = "그게…… 아무래도 좀 일반적인 아르바이트가 아니잖아?"
2001102-36 = "무녀 아르바이트에서 뭘 하면 좋을지 나로서도 알고 있는 게 별로 없다 보니, 선생님의 조언을 얻고 싶었는데……."
2001102-37 = "아! 일단 내 나름대로 여기, 무녀에 대해 조사를 해온 게 있거든?"
2001102-47 = "무녀에 대해 이것저것 조사하다 보니 알게 된 사실인데, 일단 무녀의 기원부터가 말이지……."
2001102-48 = "[s6] \"거기서부터 시작하는 전개?!\"\n[s7] \"세리카, 혹시 무녀 백과사전이라도 만들려는 거야?\""
2001102-49 = "으, 응……? 내가 뭔가 실수라도 했어?"
2001102-50 = "으, 응……? 내가 뭔가 실수라도 했어?"
2001102-51 = "아……. 왜 그렇게 무녀에 깊게 파고드는 거냐고?"
2001102-52 = "으음 그게 말이지……. 정말 별거 아닌 이유인데……."
2001102-53 = "그게……. 아르바이트가 예정된 행사장에서 말하길, 보다 완벽한 무녀를 행세한다면 급여를 높게 준다잖아!"
2001102-54 = "이건 의욕을 낼 수밖에 없지 않겠어?!"
2001102-55 = "[s] \"그거 세리카 답네.\""
2001102-56 = "하여간 나 혼자서는 알기 어려운 것도 많으니 부디 가르쳐줘 선생님."
2001102-57 = "보다 높은 급여를 받기 위해! 완벽한 무녀가 되기 위한 방법을 말이야!"
2001102-58 = "(세리카의 눈동자는 뜨거운 열의로 반짝거리고 있었다.)"
2001102-59 = "[s] \"으음. 무녀라면……. 역시 첫 번째는 그거겠지.\""
2001102-61 = "(근처 가게에 들러 청소도구를 빌려왔다.)"
2001102-63 = "이건……. 빗자루?"
2001102-64 = "그, 빗자루는 왜? 무녀 아르바이트와 관계가 있는 거야?"
2001102-65 = "[s8] \"무녀 하면 빗자루…!\"\n[s9] \"빗자루 하면……! 무녀랑 마녀가 5:5 정도니까!\""
2001102-66 = "으음……? 잘은 모르겠지만, 선생님이 그런 거라면 그런 거겠지."
2001102-67 = "으음……? 잘은 모르겠지만, 선생님이 그런 거라면 그런 거겠지."
2001102-68 = "그럼 이제부터 이걸로 뭘 하면 되는 건데?"
2001102-69 = "[s] \"그야 당연히 청소지요!\""
2001102-70 = "처, 청소? 설마 했는데, 정말 그런 단순한 일로 괜찮은 거야?"
2001102-71 = "아니, 아니지. 복잡하게 생각하기보다는……."
2001102-73 = "응! 선생님 말대로 일단 청소를 해볼까?"
2001102-76 = "여기서부터 천천히 쓸면……."
2001102-79 = "영차- 여엉-차-"
2001102-82 = "여기저기 널려 있는 나뭇잎이랑……. 바닥에 놓인 쓰레기도 놓치지 않고 꼼꼼하게……."
2001102-84 = "[s] \"응! 점점 자세가 나오고 있어! 세리카!\""
2001102-85 = "그, 그래? 그렇다면 다행이긴 하지만."
2001102-87 = "정말…… 이걸로 무녀 아르바이트에 대해 알 수 있는 걸까……."
2001102-89 = "(세리카의 뛰어난 활약으로 공원의 청결도가 증가했다!)"
2001102-91 = "후우. 이렇게 하면 적당히 청소는 끝났나? 자, 선생님 다음은?"
2001102-92 = "[s] \"무녀에게 있어 중요한 두 번째는…… 고헤이다!\""
2001102-93 = "고, 고헤…… 뭐?"
2001102-98 = "자, 잠깐. 선생님?"
2001102-101 = "이게…… 고헤이……. 막대기 끝에 종이를 이어 붙인 도구……인 거네."
2001102-102 = "이걸로 뭘 어떻게 하면 되는 건데?"
2001102-103 = "어……. 흔들면서 춤을 추거나, 축복을 해주면 된다……? 저기, 의미를 모르겠는데……?"
2001102-104 = "[s] \"세리카 무녀님! 축복해주세요!\""
2001102-105 = "으, 응? 갑자기 그런 말을 해도……"
2001102-107 = "이, 이렇게?"
2001102-109 = "이렇게 인가?"
2001102-110 = "……음, 역시 잘 모르겠는데."
2001102-111 = "[s] \"그리고 다음은 이거!\""
2001102-113 = "(그 뒤로도 세리카와 함께 무녀가 하는 일에 대해 이야기를 나누어 갔다.)"
2001102-114 = "무녀에게 다음으로 중요한 건……… 스, 스펠 카드?"
2001102-115 = "그다음엔, 조각나버린 특별한 구슬을 모으기 위해 여행을 떠나는 거야! 라니, 저기, 무슨 의미야?"
2001102-119 = "역시 마을을 부흥시키기 위해선 입으로 씹어서 만드는 술도 포기할 수 없다! 라니. 저기…… 선생님……?"
2001102-121 = "(그렇게 약 3시간에 걸친 열띤 토론이 끝난 뒤.)"
2001102-122 = "[s] \"후……. 보람찬 토론이었어.\""
2001102-123 = "아, 으으. 아으……."
2001102-124 = "무, 무녀로서 가져야 할 마음가짐이……."
2001102-125 = "이렇게나 다양하고…… 어려운 일이었을 줄이야……."
2001102-126 = "그, 그래도 이걸로 무녀 아르바이트의 준비는 확실한 거겠지?!"
2001102-127 = "완벽하게 마스터했다고는 할 수 없지만, 이 정도라면……!"
2001102-128 = "[s] \"어, 음. 그게. 그러니까 세리카 실은…….\""
2001102-130 = "(당황하는 세리카를 보다 못해, 진실을 이야기했다.)"
2001102-132 = "뭐? 선생님이 지금까지 이야기한 게 전부…… 게임이나 만화, 애니메이션에서 나온 이야기들이었다고……?"
2001102-133 = "[s] \"……넵.\""
2001102-134 = "………"
2001102-135 = "[s] \"세, 세리카 님?\""
2001102-137 = "선생님? 그 말은 즉……."
2001102-138 = "지금까지 날 잘도 놀렸다. 이거지?!"
2001102-139 = "우으으, 미, 믿고 있었는데! 꼼짝없이 쌀을 씹을 때, 몇 번 씹는 게 좋을지. 고민하고 있었는데!"
2001102-140 = "[s] \"죄, 죄송합니다! 면목이 없습니다!\""
2001102-141 = "우캬아아악!!"
2001102-143 = "……하아아아. 정말 말이지………."
2001102-144 = "잘 모르면, 모르겠다고 처음부터 말해줬으면 좋았잖아."
2001102-145 = "괜히 이상한 이야기를 하면서 시간만 낭비해버리고……."
2001102-146 = "[s] \"어떻게든 세리카의 도움이 되고 싶었으니까!\""
2001102-147 = "……으윽, 그렇게 말하면 나도 멋대로 화를 낼 수 없잖아. 으이구……."
2001102-148 = "하아……. 나참……."
2001102-149 = "오늘 하루 종일 선생님하고 뭘 해버린 건지……. 이래서야 상담이고 뭐고, 핑계만 대고 그냥 둘이 놀아버린 셈이잖아."
2001102-150 = "응, 단둘이……. 단둘이…… 단, 둘……."
2001102-152 = " ……핫?!"
2001102-153 = "아, 아니, 그 단둘이 놀았다는 말의 의미는 그게 그러니까. 데이트라거나, 그런 걸 말하는 게 아니라……!"
2001102-154 = "그런 오해는 저얼-대로 하면 안 되니까!"
2001102-155 = "[s] \"응! 오해 안 하니까. 걱정 안 해도 돼!\""
2001102-156 = "……."
2001102-157 = "그런 부분은 조, 조금쯤은 오해를 하라고!"
2001102-158 = "아아~! 진짜!"
2001102-160 = "(그 뒤로도 등을 때리며 화를 내는 세리카를 간신히 달래주었다.)"
