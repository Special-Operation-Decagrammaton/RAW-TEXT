[translation]
10048020-1 = "제2화;들어나 보자"
10048020-2 = "특수교역부 기숙사 내부"
10048020-5 = "[ns] \"누구를…… 아니 뭘 묻었다는 거야?\""
10048020-6 = "으아아아! 생각하시는 그거 아니에요!"
10048020-7 = "파종! 그래, 파종 얘기한 거죠, 리츠 쨩?"
10048020-8 = "응 맞아! 파종 끝났어!"
10048020-9 = "미요 쨩이 말한 곳들에 물건들 제대로 심어 놓고 왔어!"
10048020-10 = "고, 고생 많았어요……!"
10048020-11 = "수고했어, 리츠 쨩."
10048020-12 = "고마워!"
10048020-13 = "응? 근데 저분은 누구셔?"
10048020-14 = "[s] \"안녕하세요, 샬레의 선생입니다.\""
10048020-15 = "안녕하세요! 저는 우스바 리츠!"
10048020-16 = "취미는 교역! 특기는 교역!"
10048020-17 = "그리고 전공은 조각!"
10048020-18 = "[s] \"자, 잘 부탁해!\""
10048020-19 = "그러고 보니 나 뉴스에서 선생님 본 적 있어!"
10048020-20 = "알몸으로 벌판을 달렸다고……!"
10048020-21 = "[s] \"맞긴 한데……! 부정은 못 하겠는데……!\""
10048020-22 = "와일드헌트 밖에서도 그런 걸 해도 되는구나, 싶어서 신기했어!"
10048020-23 = "[s] \"와일드헌트 안에서는 그런 걸 해도 되는 거야……?\""
10048020-24 = "행위예술 하는 애들이 없는 건 아니니까요……."
10048020-25 = "선생님, 혹시 입을 옷이 별로 없는 거야?"
10048020-26 = "내가 구해다 줄까?"
10048020-27 = "[s] \"마음만 받겠습니다…….\""
10048020-28 = "그나저나 벌써 파종을 끝냈다니, 마침 잘됐네."
10048020-29 = "리츠, 파종 장소로 좀 안내해 줄 수 있어?"
10048020-30 = "응? 어렵지 않지. 그런데 왜?"
10048020-31 = "선생님께 특수교역부의 활동을 참관시켜 드리고 싶어서 말이야."
10048020-32 = "참관?"
10048020-33 = "와아! 재밌을 것 같아!"
10048020-38 = "그런데 괜찮은 거야?"
10048020-39 = "미요 쨩, 늘 보안을 강조했었잖아?"
10048020-40 = "후후, 리츠 쨩, 선생님은 어른이야."
10048020-41 = "그리고 어른은…… 한 번 제대로 물면, 돈을 엄청나게 쓴다고?"
10048020-42 = "그러니까 이쪽에서 먼저 이 정도로 신뢰의 제스처를 보여 주는 게 이득인……."
10048020-43 = "[s] \"저기요, 다 들리거든요?\""
10048020-45 = "맞아요, 당사자 앞에 두고 뭔 소리를 하는 거야……."
10048020-46 = "……그 아무튼, 결정된 일이니까, 일단 같이 움직이도록 해요, 선생님."
10048020-50 = "다들 출발하죠."
10048020-52 = "와일드헌트 공터"
10048020-56 = "첫 번째 파종 지점, 도착!"
10048020-57 = "[s] \"아까부터 묻고 싶었는데, <파종>이 뭐야?\""
10048020-58 = "미, 밀수품을 의뢰인에게 전달하는 여러 방식 중 하나예요."
10048020-59 = "미리 약속해 둔 특정한 장소에 저희가 물건을 가져다 두면, 나중에 의뢰인이 물건을 회수해 가는 방식……이죠."
10048020-60 = "그래서 파종이라고 부르는 거예요. 저희는 물건을 심고, 고객은 물건을 수확해 가니까요."
10048020-61 = "여기선…… 저 조각상 아래에 파묻어 놨을 텐데……."
10048020-62 = "어, 저기 온다. 모두 쉿."
10048020-71 = "찾았다……!"
10048020-72 = "오오, 마침내 우리의 미적 유희를 완성해 줄 마지막 조각이 손에 들어왔도다……!"
10048020-73 = "저 고객님 주문 품목이 뭐였지?"
10048020-74 = "네이팜 맛 프라이드 치킨이요."
10048020-75 = "[s] \"……그런 품목도 의뢰를 해?\""
10048020-80 = "예. 와일드헌트에서는 외부 음식 반입 기준이 굉장히 까다롭거든요."
10048020-81 = "학원 밖을 드나드는 것도 쉽지 않으니, 외식을 마음대로 하기도 어렵고……."
10048020-82 = "그래서 저희를 통해 외부의 음식을 주문하는 학생들이 많답니다."
10048020-83 = "자, 그럼 다음 장소로 이동해 볼까요?"
10048020-85 = "와일드헌트 어딘가의 숲"
10048020-86 = "(이번 파종 지점은 어느 고목의 옹이구멍이었다.)"
10048020-93 = "찾았어!"
10048020-94 = "드디어 그림을 완성할 수 있어……!"
10048020-95 = "저분은 특정 브랜드의 물감을 원하시더군요."
10048020-96 = "와일드헌트에 반입이 안 되는 물감이라서요."
10048020-97 = "[s] \"그건 또 왜……?\""
10048020-98 = "살충제 성분이 약간 들어 있는 게 몸에 안 좋다는 이유 때문에요."
10048020-100 = "(그 뒤 몇 군데의 파종 장소를 더 돌아다녔다.)"
10048020-101 = "(그렇게 참관한 밀수의 현장에선…….)"
10048020-102 = "(생각보다 위험한 물건들이 거의 없었다.)"
10048020-104 = "와일드헌트 공터"
10048020-105 = "(참관이 끝난 뒤, 근처 벤치에 앉아 잠시 쉬기로 했다.)"
10048020-106 = "진짜로 작업 끝! 오늘 특수교역부의 활동은 여기서 문 닫겠습니다!"
10048020-107 = "어때요, 선생님?"
10048020-108 = "저희의 밀수를 참관하신 소감이?"
10048020-109 = "[s1] \"이런 식으로 동아리 활동을 하고 있었구나.\"\n[s2] \"생각보다 묘하게 소소하고…….\""
10048020-112 = "후후, 그야 오늘 보신 것은 저희의 업무 중 극히 일부였으니까요."
10048020-113 = "실은 이보다 훨씬 더 방대한 수의 밀반입 루트와 물품 전달 방법을 보유하고 있답니다."
10048020-114 = "거 자랑이시네요, 진짜."
10048020-115 = "그럼 그럼, 자랑거리지."
10048020-116 = "그런데 아까부터 왜 그렇게 탐탁지 않은 표정인 거야, 미요?"
10048020-117 = "지금까지 우리가 본 것들, 전부 다 미요의 작품이잖아?"
10048020-118 = "[s] \"응……?\""
10048020-119 = "잠깐, 그, 그건……."
10048020-120 = "엄청난 수의 밀반입 루트, 수십 가지의 물품 전달 방법, 거기다 사감대와 얽힐 경우를 대비한 유사시 시나리오들까지……."
10048020-121 = "전부 다 네가 쓴 작품들이잖아, 미요."
10048020-122 = "으우우……."
10048020-123 = "부끄러우니까 그만 해……."
10048020-124 = "선생님, 우리 부장님이 괜히 부장의 직함을 달고 있는 것이 아닙니다."
10048020-125 = "저희 특수교역부가 굴러갈 수 있는 토대를 놓고, 모든 작전안을 구상하는 브레인……."
10048020-126 = "그게 바로 저희 부장님, 미요 쨩이에요."
10048020-127 = "으아아……!"
10048020-128 = "이제 그만 받아들여, 미요."
10048020-129 = "넌…… 밀수의 영혼 그 자체야……!"
10048020-130 = "맞아 맞아! 미요 쨩의 작전은 한 번도 틀린 적이 없다고!"
10048020-131 = "으아아아아아아……!"
10048020-135 = "그런 의미에서, 다시 한번 너의 힘이 필요해, 미요."
10048020-137 = "……?"
10048020-138 = "갑자기 무슨……?"
10048020-139 = "후후."
10048020-140 = "사실, 이번에 꽤 큰 건이 들어왔거든."
10048020-141 = "무려 의뢰비가……"
10048020-142 = "기각."
10048020-143 = "아니, 들어는 보라니까?"
10048020-144 = "후유가 먼저 큰 건이라고 말할 정도라면 얼마나 엄청난 의뢰일지 감도 안 잡히거든요……!"
10048020-148 = "……확실히, 틀린 말은 아니야."
10048020-149 = "쉽지 않은 난이도의 의뢰이긴 해."
10048020-150 = "하지만 네게 중요한 것은 이 의뢰 자체가 아니야, 미요."
10048020-151 = "……?"
10048020-152 = "중요한 것은……"
10048020-154 = "<큐티베리87>의 매물이 중고 거래 사이트에 떴다는 거지."
10048020-155 = "……!!"
10048020-156 = "그게 매물이 남아있다고요?!"
10048020-157 = "물론. 사이트 들어가서 확인해 봐."
10048020-162 = "[ns] \"큐티베리 87이 뭐야?\""
10048020-163 = "일명 저주받은 걸작이지요, 선생님."
10048020-164 = "너무나 시대를 앞서 나가 버리는 바람에 소비자들에게 외면받고 시장에서 사라진 비운의 명품……!"
10048020-165 = "다른 말로 그냥 오래된 타자기예요."
10048020-166 = "야!"
10048020-167 = "[s] \"타자기……?\""
10048020-171 = "예. 제가 오랫동안 찾아 헤맨 타자기예요."
10048020-173 = "취미는 타자기 수집이고요……."
10048020-175 = "[ns] \"아하…….\""
10048020-176 = "그런데 솔직히 팔리지 않을 만했어."
10048020-177 = "타자기에 지향성 대인지뢰 같은 기능은 왜 탑재해 놔서……."
10048020-178 = "멋있다고 투석기 사용 남발하는 사람한테 그런 말 듣고 싶지는 않은데요……?"
10048020-179 = "어쨌든 큐티베리 87, 사고 싶지?"
10048020-180 = "그런데…… 돈은 별로 없을 거고."
10048020-181 = "제 계좌 사정도 모르면서 무슨……."
10048020-182 = "꼭 계란을 깨트려 봐야 노른자 개수를 알 수 있는 건 아니잖아?"
10048020-183 = "세상에는 쌍란도 있거든요?"
10048020-184 = "하지만 넌 아니지."
10048020-188 = "칫……!"
10048020-189 = "인정해, 미요. 큐티베리 87을 사고 싶지만, 돈이 없잖아."
10048020-190 = "하지만 이번 의뢰만 완수한다면……"
10048020-191 = "그거 다섯 대는 사고도 남을 만한 돈이 들어올걸."
10048020-192 = "……."
10048020-196 = "……좋아."
10048020-197 = "……무슨 의뢰인지, 들어는 볼게요."
