[translation]
208-1 = "쇼는 계속되어야 한다"
208-3 = "이 유원지의 또 다른 구역에는 마술쇼를 벌이던 어뮤즈 돌이 있었다고 합니다."
208-4 = "한때는 수많은 관객 앞에서 다양한 트릭을 보여주면서 인기를 끌었을 것이라 생각하지만……."
208-5 = "지금은 과연 어떨까요?"
208-10 = "……아아. 그렇군요."
208-11 = "미메시스로 현현한 그 마술사는 아무런 관객이 없는 지금도 그 쇼를 계속 이어 나가고 있는 것 같네요."
208-12 = "글쎄요. 예술에 관객은 반드시 필요한 것일까요? 관측되지 않는 예술, 그 예술의 경지는 과연 의미가 있는 것일까요?"
208-13 = "이른바, 대중성과 예술성의 담론. 대중 예술이란 성립 가능한 가치인가요?"
208-14 = "그렇다-!"
208-15 = "……후후후. 뭐, 좋습니다. 마에스트로나 검은 양복이라면 여기서 또 다른 사유를 찾아낼 수도 있었겠지만……"
208-20 = "저는 그저 이렇게 말할 뿐입니다."
208-21 = "관객이 없는 퍼포먼스라도…… 관측되지 않는 예술이라도……."
208-22 = "[ruby=THE SHOW MUST GO ON]쇼는 계속되어야 한다[/ruby]."
208-23 = "그렇다-!"
208-24 = "……라고요."
