[translation]
10035060-1 = "제6화;악어, 나타났습니다!"
10035060-3 = "[ns1] \"덥다…….\"\n[ns2] \"더워서 녹아내릴 것 같아…….\""
10035060-6 = "……죄송합니다, 선생님."
10035060-7 = "타코야키 드시러 오세요……."
10035060-8 = "아무도 안 오시네요."
10035060-9 = "이 날씨에 굳이 따뜻한 걸 먹으러 오는 사람이 이상한 거지."
10035060-10 = "귀관들도 나 때문에……면목이 없다."
10035060-11 = "괜찮습니다! 국장님이 만드는 타코야키는 흔히 먹을 수 있는 게 아니니까요!"
10035060-12 = "그럼, 그럼. 공안국에 가서 그 '미친개'가 만든 타코야키를 먹었다고 하면 농담인 줄 알 걸."
10035060-13 = "귀관들에게는 신세만 지는군."
10035060-14 = "그리고 선생님께도……."
10035060-15 = "선생님, 방금 만든 타코야키입니다만……하나 드시겠습니까?"
10035060-16 = "지금 제가 드릴 수 있는 것은 이것밖에 없군요."
10035060-17 = "[s3] \"상품을 그냥 얻어먹기는 좀 그렇네.\"\n[s4] \"내가 살 테니, 같이 먹을까?\""
10035060-20 = "하지만, 손님들을 상대해야 하기에."
10035060-21 = "어차피 아무도 안 오는데, 뭐."
10035060-22 = "그리고 국장, 그렇게 계속 불 앞에 서 있으면 탈진하고 말 걸."
10035060-23 = "지금도 땀을 뻘뻘 흘리고 계시니 말이죠……."
10035060-24 = "……그러면 잠깐만 휴식하지."
10035060-26 = "후우, 이제 조금 살 것 같네요."
10035060-27 = "지금까지 쉬지 않고 일했으니까."
10035060-28 = "……."
10035060-29 = "[s] \"다들 수고 많았어.\""
10035060-30 = "와서 발이나 담그면 그만이라고 생각했는데, 예상과는 좀 다르네~"
10035060-31 = "이럴 바엔 평소처럼 에어컨 바람을 쐬는 게 나았을지도."
10035060-32 = "그래도 본관은 상당히 보람 있었습니다!"
10035060-33 = "시민 여러분들이 즐거워하는 모습을 바로 옆에서 지켜볼 수 있었으니까요!"
10035060-34 = "……."
10035060-35 = "[s] \"칸나는 어땠어?\""
10035060-36 = "솔직히 말씀드리자면……"
10035060-37 = "발키리에 입학한 후 이렇게 엉망진창인 날은 처음이었습니다."
10035060-38 = "사람들을 대하는 것도 실수투성이고."
10035060-39 = "심지어 착각으로 파크에 피해를 끼치기까지 하다니."
10035060-40 = "역시 사람은 제 분수에 넘치는 일을 해서는 안 되는군요."
10035060-41 = "[s] \"글쎄. 난 칸나가 잘하고 있다고 생각하는데.\""
10035060-45 = "거짓말이 서투시군요, 선생님."
10035060-46 = "제게 라이프가드의 소질이 없다는 것은 제 자신이 잘 알고 있습니다."
10035060-47 = "코노카 녀석의 말에 잠깐 마음이 흔들리지만 않았어도 이런 엉망진창이 되지는 않았을 텐데."
10035060-49 = "부국장님 말씀이세요? 그분이 무슨 말을……?"
10035060-50 = "그러고 보니 국장, 어째서 파견 인원 명단에 이름이 들어갔는지 얘기 안 해줬었지."
10035060-51 = "부국장이 부추기기라도 했어?"
10035060-52 = "……."
10035060-53 = "이제 와서 숨길 이유도 없군."
10035060-58 = "……솔직히 말하면, 그 상황에서도 무를 수는 있었다."
10035060-59 = "하지만 그 말……."
10035060-60 = "처음 생활안전국에 지원했을 때의 마음이 남아 있다면 좋은 기회일 거라는 말에, 그냥 못 이기는 척 여기까지 오고 만 거지."
10035060-61 = "바보같이 말이다."
10035060-62 = "후후, 지금까지 남아 있다면 그건 순수한 마음이 아니라 추한 미련일 터인데."
10035060-65 = "……."
10035060-67 = "아무튼 됐다."
10035060-68 = "오히려 잘된 일인지도 모르지."
10035060-69 = "내가 생활안전국의 대민 업무에 어울리지 않는다는 사실을 다시 한번 확인하는 기회가 되었으니."
10035060-70 = "[s] \"그렇지 않아.\""
10035060-71 = "네?"
10035060-72 = "[s] \"사람들을 돕고 싶다는 마음은 변하지 않은 거잖아?\""
10035060-73 = "……하지만, 미소조차 제대로 짓지 못한 제게는 힘든 일입니다."
10035060-74 = "지원 당시에도, 인상이 나쁘다는 이유로 반려당했고……."
10035060-75 = "[s] \"할 수 있는지 없는지보다는.\""
10035060-77 = "[ns] \"하고 싶은가 아닌가의 문제라고 생각해.\""
10035060-79 = "그렇, 습니까."
10035060-80 = "선생님은 언제나 그렇게 제 예상을 벗어난 말씀을 하시는군요."
10035060-81 = "[s] \"다들 그렇게 생각해.\""
10035060-85 = "[ns] \"키리노도.\""
10035060-87 = "[ns] \"후부키도.\""
10035060-89 = "[ns] \"라브도.\""
10035060-91 = "[ns] \"……음?\""
10035060-93 = "헉?!"
10035060-94 = "나, 나도 모르게 무심코……!"
10035060-98 = "기억에 있는 얼굴이군. 불량 학생 집단, 속칭 '헬멧단'의 간부, 코마카제 라브."
10035060-99 = "앗! 저 헬멧! 아까 봤습니다!"
10035060-100 = "정체를 숨기고 슬라이드를 탑승하다니!"
10035060-102 = "셋도 안 세고 내려보내서 사람 심장 떨어지게 한 건 누군데!"
10035060-103 = "칫! 발키리 녀석들, 여기까지 쫓아오다니……!"
10035060-107 = "[ns5] \"어, 자, 잠깐만!\"\n[ns6] \"튀, 튀었다?!\""
10035060-110 = "제가 가겠습니다! 후부키! 같이 가죠!"
10035060-111 = "타코야키가 이제 딱 알맞게 식은 참인데……."
10035060-117 = "잠깐, 멈춰라! 경보가 울렸다!"
10035060-118 = "헬멧단 녀석, 설마 벌써 뭔가 일을 벌인 건가?"
10035060-119 = "앗, 저, 저쪽을 보세요!"
10035060-120 = "메인 풀 쪽에……!"
10035060-128 = "꺄아아악!"
10035060-129 = "악어다! 물속에 괴물 악어가 있어!"
10035060-130 = "도망가! 다들 풀에서 나가!"
10035060-131 = "저 녀석이다!"
10035060-132 = "아까 봤던 괴물 악어!"
10035060-133 = "생긴 건 로봇에 가까운데요!"
10035060-134 = "헉! 물 밖으로 나와서 슬라이드를 뜯어먹기 시작했습니다!"
10035060-135 = "이, 이게 왜 진짜야?!"
10035060-136 = "헬멧단 녀석들, 어디서 저런 물건을 가져온 거야?"
10035060-137 = "[s] \"사람들이 위험해.\""
10035060-138 = "네! 생활안전국 경관으로서 시민들이 위험에 처하는 것을 두고 볼 수는 없죠!"
10035060-140 = "갑니다!"
