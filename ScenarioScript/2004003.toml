[translation]
2004003-1 = "사츠키는 묻고 있다."
2004003-2 = "(사츠키의 연락을 받고 얼마 지나지 않아……)"
2004003-7 = "선생, 나 왔어."
2004003-8 = "[s] \"안녕, 사츠키……\""
2004003-9 = "여전히 좁네. 샬레의 사무실."
2004003-10 = "만마전으로 온다면 광장 전체를 선생의 사무실로 내줄 수도 있는데?"
2004003-11 = "[s1] \"아니, 괜찮아.\"\n[s2] \"어디의 벌칙인 거야, 그런 건.\""
2004003-14 = "흐응, 여전히 협력하지 않을 생각이야? 물론 그럴 거라 생각했지만."
2004003-15 = "저번에 말했지? 나에겐 많은 방법이 있다고."
2004003-16 = "오늘은 그 두 번째를 선생에게 시험해 볼 생각이니까."
2004003-17 = "바로, 고문이야."
2004003-18 = "[s] \"예?\""
2004003-19 = "아, 너무 진부한 방법이라 놀랐어?"
2004003-20 = "하긴, 샬레라면 이미 널리 활용하고 있었겠지."
2004003-21 = "[s] \"아니거든! 그런 무서운 거 안 한다고!!\""
2004003-22 = "하지만 우리가 활용하는 방법은 조금 특별하거든. 아마 선생에게도 통할 거야."
2004003-23 = "자아, 자아~ 여기 앉아."
2004003-24 = "[s] \"괜찮아, 괜찮아. 사양할게.\""
2004003-25 = "야만적인 트리니티에서는 투구꽃 뿌리로 달인 차를 대접한다거나, 전기톱을 들이대는 등 흉악한 사례도 있다고 하던데."
2004003-31 = "하지만 우리 게헨나에서는 그렇게 반인륜적인 고문은 하지 않으니 안심하고."
2004003-35 = "(사츠키에게 떠밀려 의자에 앉고 말았다……)"
2004003-37 = "그럼 첫 번째 시작할게. 선생이라면 버텨낼 수 있을지도? 후후후."
2004003-42 = "(사츠키는 내 손을 가져가더니……)"
2004003-43 = "[ns] \"내, 내 손톱에 무슨 짓을……?\""
2004003-44 = "선생, 과연 참아낼 수 있을까?"
2004003-52 = "[ns3] \"……손톱을 깎아주는 거야?\"\n[ns4] \"이게 고문이라고……?\""
2004003-55 = "후후…… 아직 눈치채지 못한 거야?"
2004003-56 = "손톱을 이렇게 짧게 깎아버리면……"
2004003-57 = "예쁜 네일 아트는 불가능해진다고?"
2004003-58 = "[s] \"……!\""
2004003-59 = "평범한 학생이라면 보통 검지 손톱쯤까지 깎였을 때 어떤 정보든 실토하게 되지."
2004003-60 = "선생은 어디까지 버틸 수 있을까? 후후……!"
2004003-61 = "자아, 나는 멈추지 않을 테니까. 끝까지 가는 참사를 막고 싶다면 순순히 협력하라고."
2004003-68 = "……"
2004003-74 = "(사츠키는 그렇게 손톱을 모두 깎아주었다.)"
2004003-76 = "괜찮아, 선생? 이렇게 짧은 손톱…… 감당할 수 있겠어?"
2004003-77 = "[s] \"고마워, 사츠키. 마침 깎을 때가 되었었거든.\""
2004003-78 = "역시 선생인가. 눈 하나 깜빡이지 않고 당연한 듯 버텨내네."
2004003-79 = "하지만 이대로 포기하지는 않아. 다음은……"
2004003-82 = "자, 선생. 이걸로 갈아입어."
2004003-83 = "[ns] \"이건…… 흰 티셔츠?\""
2004003-84 = "응. 선생의 옷장에서 가져온 거야."
2004003-85 = "이번 고문에는 얼룩 하나 없는 순백의 하얀 티셔츠가 필요하거든."
2004003-88 = "(사츠키의 요청대로 흰 티셔츠로 갈아입었다.)"
2004003-90 = "후후, 그런 복장도 아주 잘 어울리네."
2004003-91 = "그럼…… 지금부터 이걸 먹도록."
2004003-92 = "[s5] \"이건……\"\n[s6] \"카레 우동……?!\""
2004003-95 = "하하, 맞아! 이 고문의 무서움을 이제 알겠어?"
2004003-96 = "앙케이트 조사 결과, [옷에 튀기지 않고 먹기 가장 어려운 음식 TOP3] 중 하나인 카레 우동을!"
2004003-98 = "그냥 옷도 아니고, 이물질이 눈에 가장 잘 띄는 순백의 흰 티셔츠를 입은 상태로 먹는 거야!! 물론 앞치마처럼 오염으로부터 옷을 보호할 수 있는 도구는 아무것도 없지!"
2004003-99 = "어때, 이 압박감? 견딜 수 있겠어? 평범한 학생들은 시도하기도 전에 극심한 스트레스를 받는다고!"
2004003-100 = "과연 선생은 어떨까!!"
2004003-106 = "[ns] \"맛있다!\""
2004003-107 = "잠시도 망설이지 않고 식사를 시작하다니, 이건 예상외야."
2004003-108 = "흰옷에 카레가 튀더라도 상관하지 않는 이 대범함…… 역시 선생인가."
2004003-112 = "(그렇게 순식간에 그릇을 싹 비웠다.)"
2004003-114 = "두 번째 고문도 실패하다니. 후후, 정말이지 얕볼 수 없는 사람이네."
2004003-115 = "하지만 나도 이제는 진심이야."
2004003-116 = "이번에는 반드시 선생의 협력을 받아낼 테니까."
2004003-117 = "[s] \"과연……\""
2004003-119 = "(사츠키는 그 후로도 이것저것 수많은 방법을 시도했지만……)"
2004003-120 = "(모두 그다지 고문이라고 느껴지지 않았다……)"
2004003-123 = "만마전 정보부의 무시무시한 고문이 전혀 먹혀들지 않다니."
2004003-124 = "선생이 이 정도로 강철 같은 심지를 가졌을 줄이야."
2004003-125 = "후, 이제 마지막 방법이네."
2004003-126 = "자아, 선생. 팔을 묶을 수 있도록 순순히 뒤로 내밀어."
2004003-127 = "무슨 짓을 하려는 건가, 라는 표정이네."
2004003-128 = "이 방법은 손을 사용하지 못하도록 하는 게 포인트거든."
2004003-134 = "후후, 그럼 준비는 끝났고……"
2004003-135 = "이제 이 화면을 봐, 선생."
2004003-136 = "[ns] \"이건…… 고양이가 나오는 재미있는 영상?\""
2004003-137 = "후후, 고양이들의 어처구니없는 움직임을 모아놓은 하이라이트 영상이야."
2004003-138 = "보다 보면 나도 모르게 웃음 짓게 되는, 귀중한 자료지."
2004003-139 = "자아…… 기대하라구? 이 클라이맥스 장면에서……"
2004003-144 = "[ns] \"아앗……!! 광고가……!!\""
2004003-146 = "[ns] \"게, 게다가 팔이 묶여있어서 스킵 버튼을 누를 수가 없어……!\""
2004003-147 = "후후, 후후훗! 어때? 어때? 이 무력한 기분!"
2004003-148 = "어서 스킵 버튼을 누르고 다음 장면을 보고 싶지? 궁금하지? 아하하!"
2004003-149 = "무려 1분짜리 광고라고? 아, 참고로 이 영상에는 30초마다 광고가 붙어있어."
2004003-150 = "[s] \"이, 이런 잔인한……\""
2004003-151 = "그야말로 악질 중의 악질!! 무시무시하지?"
2004003-152 = "앞으로 언제 끝날지 모르는 악몽 같은 시간이지만, 만약 선생이 만마전에 충성을 맹세한다면 팔을 풀어줄 수도 있는데? 후후후!"
2004003-157 = "……"
2004003-158 = "이런. 나까지 다음 장면이 궁금해져 버리다니……"
2004003-159 = "영상을 같이 보고 있다는 사실을 간과했어. 이걸 생각 못 했네."
2004003-160 = "이런 광고 따위 빨리 넘기고 싶어~~ 언제 끝나는 거야??"
2004003-162 = "(뒤에서 사츠키가 몸을 기대왔다.)"
2004003-166 = "[ns7] \"사, 사츠키……?\"\n[ns8] \"너무 가까운데……\""
2004003-169 = "후우, 후우…… 누르고 싶어~~ 광고 싫어~~"
2004003-170 = "(사츠키의 가쁜 숨이 목덜미에 고스란히 느껴진다……)"
2004003-175 = "[ns] (왜, 왠지 알지도 못하는 비밀기지의 위치를 실토하고 싶어……!)"
2004003-179 = "[ns] \"아, 광고 끝났다……\""
2004003-182 = "흐응, 고양이는 가끔 저렇게 빳빳해지곤 하는구나."
2004003-183 = "이 고문은 아무래도 안 되겠어. 나까지 궁금해지니까."
2004003-184 = "[ns] (다, 다행이다……)"
2004003-185 = "선생, 내 흉악한 고문들을 잘도 버텨냈네. 제법이야."
2004003-186 = "하지만 배운 것도 없진 않아."
2004003-187 = "다음을 기대하라고? 후후."
2004003-193 = "[ns] \"사, 사츠키?? 이거 풀어주고 가야지……!!\""
2004003-195 = "(결국 묶인 팔은 다른 당번 학생들이 풀어주었다……)"
2004003-196 = "(……이상한 소문이 또 생길 것 같다……)"
