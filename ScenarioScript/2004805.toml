[translation]
2004805-1 = "석양에 물드는 날개"
2004805-2 = "프라이빗 해변"
2004805-3 = "(조금 전 받은 메시지가 신경 쓰여, 나기사를 찾았다.)"
2004805-4 = "(……그런데 나기사의 모습이 어디에도 보이지 않았다.)"
2004805-5 = "(전화도 메시지도 받지 않고…….)"
2004805-9 = "[ns] \"……그러고 보니 저쪽은 아직 안 찾아봤던 것 같은데.\""
2004805-12 = "(해변길을 따라, 나기사를 찾아 나섰다.)"
2004805-13 = "(그렇게 얼마나 달렸을까…….)"
2004805-14 = "[ns] \"어……?\""
2004805-15 = "(나기사의 뒷모습이 보여서 걸음을 멈췄다.)"
2004805-17 = "해안가 도로"
2004805-18 = "[ns] \"……나기사?\""
2004805-20 = "서, 선생님?"
2004805-21 = "어떻게 여기까지……?"
2004805-22 = "예? 제가 걱정돼서 찾아오셨다고요?"
2004805-23 = "그, 그러실 필요까지는 없으셨는데…… 안 그래도 지금 돌아가려고……."
2004805-24 = "[s] \"어디를 가고 싶은데?\""
2004805-25 = "예?"
2004805-26 = "[s] \"가고 싶은 곳이 있다면, 함께 가 줄게.\""
2004805-27 = "……."
2004805-28 = "하하, 역시 선생님의 생각은 종잡을 수가 없군요."
2004805-29 = "도망친 학생을 잡으러 오신 줄 알았더니, 오히려 도망을 도와주시겠다니."
2004805-30 = "하지만 괜찮습니다."
2004805-31 = "저는 어디로든 가고 싶었던 것뿐이지, 어딘가로 가고 싶었던 것은 아니니까요."
2004805-35 = "말하고 보니 무슨 가출 청소년의 변명 같네요."
2004805-36 = "[s] \"뭐…… 틀린 말은 아니지.\""
2004805-37 = "후후, 그것도 그렇긴 하네요."
2004805-38 = "……."
2004805-39 = "오늘이 일정의 마지막 날인 것, 아시죠 선생님?"
2004805-40 = "이제 내일이면 저는 돌아가야 한답니다."
2004805-41 = "선베드에 드러누워 있는 나기 쨩에서, 티파티의 호스트 키리후지 나기사로, 그 일률적인 일상으로……."
2004805-42 = "……그 사실이 어쩐지, 조금 귀찮아져서, 무작정 도망쳐 봤습니다."
2004805-43 = "떨어지는 태양을 쫓아서, 무작정 서쪽으로, 서쪽으로……"
2004805-44 = "물론 당연하지만, 저의 책임을 방기할 생각은 없습니다."
2004805-45 = "제가 누리는 권리가, 제가 지고 있는 책임에서 나온다는 것은 확실히 알고 있으니까요."
2004805-46 = "그래서 선생님께도 걱정하지 말아 달라고 모모톡을 보내드린 것이고요."
2004805-47 = "그래도, 그렇지만, 역시……."
2004805-48 = "음……."
2004805-49 = "……아니에요, 예, 돌아가야죠."
2004805-50 = "하물며 태양조차도 매일 같은 자리로 다시 돌아가는데."
2004805-51 = "저희가 여기에 계속 머물 수는 없는 노릇이지요."
2004805-52 = "[s1] \"하지만 반복되는 하루들이라 해도…….\"\n[s2] \"매일매일의 내용은 바뀌잖아?\""
2004805-58 = "그래요, 그것도 맞네요."
2004805-59 = "어쩌면, 매일매일이 똑같은 것이라고 멋대로 규정 지은 것은 저일지도……."
2004805-60 = "그리고 설령, 정말로 반복되는 하루하루라 해도."
2004805-61 = "이렇게 가끔, 선생님이 찾아와 주신다면……"
2004805-62 = "뭐 그건 그것대로……"
2004805-63 = "후후."
2004805-64 = "돌아가죠, 선생님."
2004805-65 = "언젠가 다시, 이곳으로 돌아오기 위해."
