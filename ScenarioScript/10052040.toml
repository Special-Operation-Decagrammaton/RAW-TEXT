[translation]
10052040-1 = "Uniform"
10052040-2 = "으어……."
10052040-3 = "[s] \"괜찮아?\""
10052040-4 = "예상했던 것보다 더 어지러워요. 특히 왼쪽 머리가……."
10052040-5 = "[s] \"왼쪽 머리?\""
10052040-6 = "네. 그러니까 이건 비나의 코어를 수송선으로 가져와서, 활성화했기 때문인데……."
10052040-7 = "……."
10052040-8 = "괜찮아요. 이 몸이 에너지의 흐름에 익숙해지면 되는 문제니까요."
10052040-9 = "[s] \"……정말로 괜찮은 거 맞지……?\""
10052040-10 = "그렇다니까요. 지금도 나아지는 중이고, 어차피 예언자의 코어를 가져와서 활성화시킬 때마다 이런 일은 반복될 거고……."
10052040-11 = "아마도 이 신체가 [ruby=흠 있는 것]'적합하지 않은 것'[/ruby] 취급이어서 그런 것 같기도 한데 말이죠……."
10052040-12 = "아무튼 이런 식으로 코어를 활성화시킬 때마다, 수송선의 출력과 기능을 재설계해 낼 수 있을 겁니다."
10052040-13 = "그리고 그 에너지의 흐름은 지금 이 신체와 연결되어…… 결론만 말씀드리자면, 제 쪽에서 제어할 수 있을 거고요."
10052040-14 = "[s] \"잘 모르겠지만, 케이 쨩이 무리하지 않았으면 좋겠어.\""
10052040-15 = "케이 쨩 아니라니까요, 진짜."
10052040-24 = "아리스……? 이건, 뭐죠……?"
10052040-25 = "교복입니다, 케이!"
10052040-26 = "아, 아뇨. 그건 보면 아는데, 대체 어째서……."
10052040-27 = "이건 아리스가 눈을 뜨고 모두와 만났을 때, 가장 먼저 입고 있었던 옷이었으니까요!"
10052040-28 = "아리스는…… 그게 정말 좋았습니다. 그래서 케이와 그 좋았던 것을 같이 하고 싶었습니다."
10052040-32 = "어…… 혹시, 싫었나요……?"
10052040-33 = "아, 아뇨! 그럴 리가요! 오히려, 오히려……."
10052040-37 = "헤헤……."
10052040-38 = "당연한 거야. 우리 밀레니엄의 교복이야말로, 가장 합리적인 선택일 테니까."
10052040-39 = "……꼭 거기에서 한 마디 덧붙이는 게 정말 당신 답네요, 리오……."
10052040-41 = "[ns] \"학생의 전투복은 역시 교복이기도 하고!\""
10052040-42 = "무슨 말씀을 하시는 건가요, 선생님은 또……."
10052040-43 = "네? 공부라는 적을 물리치기 위한 전장이 교실이라면, 전투복은 그 교복인 것이라고요?"
10052040-44 = "……."
10052040-45 = "이번은 선생님 말이 맞다고 해 드릴게요……."
10052040-46 = "그, 그러면 제가……."
10052040-47 = "……."
10052040-48 = "네! 입어 주세요, 케이! 아리스는 보고 싶습니다!"
10052040-49 = "……!"
10052040-55 = "어, 어떻습니까……?"
10052040-56 = "와아!"
10052040-57 = "[ns] \"오…….\""
10052040-58 = "뭐, 뭔가요! 확실하게 이야기해 달라구요! 놀리는 건가요?!"
10052040-59 = "그렇지 않아……. 정말 잘 어울려. 케이 쨩."
10052040-60 = "맞아. 생각대로네. 후후. 지금 정말 귀여워."
10052040-61 = "……!!!"
10052040-62 = "고, 고맙습니다. 유즈……. 미도리도요."
10052040-66 = "괜찮아, 케이? 덥지 않아?"
10052040-67 = "그럴 리가요……."
10052040-68 = "안심하십시오, 케이. 잘 어울립니다."
10052040-69 = "어느 정도냐고 한다면, 제가 순간적으로 큐트 창백 계열 퍼펙트 미소녀의 자리에 위기감을 느꼈을 정도로 어울립니다."
10052040-70 = "……그런 자리 아무래도 좋습니다만……."
10052040-71 = "하지만 아직 퍼펙트 큐트 미소녀 메이드의 자리는 굳건하므로, 저는 꺾이지 않은 마음으로 계속해서 오늘을 살아갈 수 있겠군요."
10052040-72 = "그러니까 정말 아무래도 좋다고요……."
10052040-82 = "그, 모두……."
10052040-83 = "감사, 합니다……."
10052040-84 = "으응~? 뭐라구우~? 지금 잘 안 들렸는데에~?"
10052040-85 = "윽……!"
10052040-89 = "고, 고맙다고요! 이제 됐어요?!"
10052040-90 = "아하하하! 그럼, 그럼! 그래야지! 원래 고맙다고 할 때에는, 확실하게 전해야 하는 거거든!"
10052040-91 = "[ns] \"맞아, 맞아!\""
10052040-92 = "큭……! 하필이면 가장 맞는 말을, 가장 얄밉게 하는 두 사람에게……!"
10052040-93 = "아, 아무튼!"
10052040-94 = "이 교복을 입는 것은…… 가능한 한 제한된 상황만으로, 아껴 두도록 하겠습니다."
10052040-95 = "그건 어째서입니까, 케이?"
10052040-96 = "그건, 역시……."
10052040-97 = "……."
10052040-98 = "모두의 마음이 담긴 옷을, 함부로 상하게 하고 싶지 않아서…… 일까요."
10052040-99 = "그렇구나. 고마워, 케이 쨩."
10052040-100 = "아, 아뇨……. 고맙다고 말씀드려야 하는 것은, 제 쪽일 거고……."
10052040-101 = "그런가, 그런가! 어쩔 수 없지! 케이도 한참 부끄러워할 나이이긴 하니까!"
10052040-102 = "조용히 좀 하십쇼, 모모이!!!"
