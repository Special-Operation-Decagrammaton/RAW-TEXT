[translation]
10005065-5 = "하아, 하아……. 하아, 하아……."
10005065-6 = "으, 으윽……. 제발……. 살려줘……."
10005065-7 = "어떻게 저런 말도 안 되는 사람이 존재하는 거야? 그리고 어떻게 이렇게 잘 찾는 거야?"
10005065-8 = "급한 대로 채권 뿌려 대면서 길 막아 달라고 사람들까지 고용했는데……."
10005065-10 = "아무 의미가 없잖아! 전부 다 너무 순식간에 뚫리잖아!"
10005065-11 = "게다가 탈출선 쪽으로 가는 길들은 어째서인지 다 복도가 폭발해 있고……!"
10005065-12 = "여긴 밀레니엄도 아닌데……. 왜 여기서까지 내가 이런 일을 당해야……!"
10005065-16 = "어~이. 우리 토끼~."
10005065-17 = "어디로 숨었을까~? 크하하하하!!!"
10005065-18 = "히히야이익……!!"
10005065-19 = "하, 하지만 그것도 이제 끝이야……. 나라고 무의미한 도주를 계속하고 있었던 건 줄 알아?"
10005065-20 = "여기만 지나면 옥상이다……. 어떻게든 옥상에만 도착하면 돼……!"
10005065-21 = "그러면……. 그렇게만 되면……!"
10005065-22 = "헉, 허억……. 헉……!"
10005065-27 = "골든 플리스호 옥상 라운지"
10005065-28 = "헉, 헉……. 드디어……. 드디어!"
10005065-29 = "드디어 도착했다!! 옥상이라고, 나의 승리라고……!!"
10005065-34 = "……!?"
10005065-39 = "크하하하. 여기 있었구나."
10005065-40 = "어딜 갔나 했더니 겨우 도망쳐서 온 곳이 여기인가……. 귀여운 토끼 녀석."
10005065-41 = "시간 꽤 잘 끌어줬다. 덕분에 그래도 속이 좀 시원해졌군."
10005065-42 = "크하하하! 이제 놀 만큼 놀았으니 슬슬 돌아가야지?"
10005065-44 = "야호! 코유키-! 우리도 왔어-!"
10005065-45 = "더 이상은 도망칠 곳이 없다. 투항해라, 백토."
10005065-46 = "후훗……. 그렇게 됐답니다."
10005065-48 = "흐, 흥……. 용케도 따라오셨군요, 선배들……!"
10005065-49 = "하지만 틀렸어요. 이제 다 끝났습니다. 여기까지 온 이상, 선배들은 진 겁니다!"
10005065-50 = "그러길래 여유 부리지 말고 미리 절 잡았어야죠!"
10005065-51 = "메롱이다, 메롱! 메~롱! 니하하하하!!"
10005065-52 = "……?"
10005065-53 = "……뭐지? 드디어 맛이 가 버린 건가?"
10005065-55 = "어쩌면 정말 그런 걸지도……."
10005065-56 = "응. 가능성이 있다."
10005065-57 = "확실히 이번에는 선배가 심했으니까."
10005065-59 = "저도 나름대로 용의주도한 사람이라고요!"
10005065-60 = "이럴 때도 있겠다 싶어 거금을 들여 마련해 둔……."
10005065-61 = "개인용 탈출 드론이 있으니까요!!"
10005065-66 = "개인용……."
10005065-67 = "탈출……."
10005065-68 = "……드론?"
10005065-69 = "……?"
10005065-74 = "훗. 이 틈에 얼른 장착 완료……!"
10005065-75 = "니하하하하!! 멍청하기는! 이곳은 망망대해라구요!"
10005065-76 = "쫓아올 수 없을 걸요!?"
10005065-77 = "거기서 손가락이나 빨며 제가 날아가는 걸 구경이나 하시죠!"
10005065-78 = "그럼 저는 바빠서 이만!"
10005065-82 = "니하하하하하하하-!!"
10005065-86 = "[ns] \"…….\""
10005065-87 = "……카린."
10005065-89 = "……응."
10005065-95 = "으야아아아아아아아~~!!!"
10005065-99 = "어푸 어푸어푸! 어푸! 선배!"
10005065-100 = "선배, 살려줘요! 물……! 나 수영……! 수영 못 해……!"
10005065-101 = "어푸, 어푸……! 선……!"
10005065-102 = "선배애애~~! 어흐헝헝헝!"
10005065-106 = "[ns] \"……도와줘야겠지?\""
10005065-107 = "그야 스스로 말씀하셨듯이……. 망망대해니까요……."
10005065-108 = "맞추기도 쉽다. 특히 겨우 이런 거리라면 말이지."
10005065-109 = "……."
10005065-110 = "하아……."
10005065-111 = "우리가 저런 녀석이랑 같은 수준으로 여태 쫓아다니고 있었다니……."
10005065-112 = "정말 자존심 상한다……."
10005065-117 = "……라는 것이, 이상 작전의 전개 과정이었습니다."
10005065-118 = "혹시 궁금하신 점이라든가…… 있으실까요?"
10005065-119 = "……."
10005065-120 = "그럼 뭐야. 결국, 그 안에서 한 난장판은……."
10005065-121 = "아아. 네. 걱정하지 않으셔도 좋습니다. 말씀드렸듯, 확실히 '학교 간의 문제'가 되지 않도록 처리했으니까요."
10005065-122 = "대신 '약간의 청구비용'이 발생하긴 했지만 말이예요."
10005065-123 = "뭐……. 알고 계시듯 그 부분은 의뢰하신 쪽에서 해결해 주시는 것이 계약 사항으로……."
10005065-127 = "후……."
10005065-128 = "후우……. 후우우……. 쓰읍-후우우우……."
10005065-129 = "[s1] \"진정해, 유우카. 우선 심호흡을…….\"\n[s2] \"스마트하게는 무리였어.\""
10005065-130 = "후……. 알……알겠습니다……."
10005065-131 = "후……. 알……알겠습니다……."
10005065-132 = "선생님께서 참관하신 거라면……. 그게 최선이었……겠죠……."
10005065-133 = "……네? 백토의 처분이요?"
10005065-134 = "음……. 네. 선생님께라면 말씀드려도 되겠지요."
10005065-135 = "백토는 당연히 다시 수감시켜 뒀어요. 필요하다고 판단될 때를 제외하곤 아마 계속 거기 있을 거예요."
10005065-136 = "……아. 재탈출에 대해서는 당분간 걱정하지 않으셔도 됩니다."
10005065-137 = "직경 10m로 된 정육면체 유리방이고, 안에는 어떤 전자장비도 없으니까요."
10005065-138 = "모든 보안 시스템은 종이서류와 인력으로 관리하고 있고, 휴대폰 반입도 금지인 구역이에요."
10005065-139 = "구식 방식이긴 하지만……. 녀석에게는 오히려 이게 훨씬 더 효과적이거든요."
10005065-140 = "……생각해 보니 슬슬 식사 넣을 시간이네요."
10005065-141 = "미리 말씀드리지만 불쌍하다고는 생각하지 말아 주세요."
10005065-142 = "녀석이 지금까지 밀레니엄에 끼친 피해들에 비하면, 이것도 상냥한 편이라고요."
10005065-143 = "……하아."
10005065-144 = "어째 선생님 앞에서는 자꾸 이런 모습만 보여드리는 것 같아서 씁쓸하네요."
10005065-145 = "다음에는 좀……. 좋은 모습으로 뵐 수 있었으면 좋겠어요."
10005065-146 = "아무튼 그럼 이만……."
10005065-151 = "……으음."
10005065-152 = "아마 한동안은 세미나도 이런저런 뒷정리로 소란스러울 테니, 저희도 방해하지 않는 게 좋겠네요."
10005065-153 = "그럼 저희도 통신을 끄고……."
10005065-159 = "……이런저런 일들이 있었지만, 이번에도 어떻게든 임무를 잘 완수한 것 같군요."
10005065-161 = "뭐, 그렇지."
10005065-162 = "부장을 잘 통제해 준 것도 그렇고, 여러 부분에서 선생님의 덕을 많이 봤다."
10005065-163 = "……앙? 누가 누굴 통제했다는 거야?"
10005065-164 = "쓸데없는 소리 하지 마라."
10005065-166 = "후훗. 다시 한번 정말 감사드려요, 선생님."
10005065-167 = "비록 임무였지만……. 솔직히 조금은 즐겁기도 했답니다."
10005065-168 = "……정작 선생님께서는 어떠셨을지 모르겠지만요. 즐거우셨다면 좋겠는데……."
10005065-169 = "[s3] \"나도 재밌었어.\"\n[s4] \"언제든 또 불러줘.\""
10005065-170 = "어머……."
10005065-171 = "어머……."
10005065-172 = "후훗. 그거 정말로 반가운 이야기네요. 기쁩니다."
10005065-173 = "아무튼 그럼 이제 이번 일은 여기서 마무리 짓기로 하고, 다시 메이드복으로 갈아입을……."
10005065-177 = "준비를……?"
10005065-178 = "어라……. 그러고 보니 저희 메이드복……. 누가 챙기셨던가요?"
10005065-179 = "……? 뭘 챙겨?"
10005065-180 = "난 안 챙겼다만……."
10005065-181 = "어. 그러고 보니……."
10005065-182 = "……? 응? 뭘?"
10005065-183 = "……? 설마 아무도 안 챙기셨나요? ……그럼……."
10005065-189 = "아아아아-이잇! 설마 거길 또 가라고!?"
10005065-191 = "오-! 또 가는 거야? 이번에는 놀러 가는 거?"
10005065-192 = "지, 진정해. 선배! 이번에는 다르다. 이번에는 괜찮아!"
10005065-193 = "임무도 잠입도 아니니까 괜찮은 거다! 어차피 아스나 선배는 VIP 회원권이 있잖아?"
10005065-194 = "그걸 들고 가면 편하게 다녀올 수 있어. ……그렇지, 선배?"
10005065-195 = "……응?"
10005065-196 = "VIP 회원권? 그거 들고 있어야 해? 중요한 거였어?"
10005065-197 = "……."
10005065-198 = "……혹시나 해서 묻는 거다만, 설마 버렸어?"
10005065-199 = "응!"
10005065-200 = "……아니. 어……. 그……."
10005065-201 = "후……. 남들은 그거 한 번 뽑아보겠다고 전 재산을 털고 있었는데, 그걸 그렇게……."
10005065-202 = "카린. 다른 사람도 아니고 아스나 선배예요. 그 정도는 예상하셨어야죠."
10005065-203 = "……아무튼 그럼……. 결국 저흰 다시 처음으로 돌아간 건가요?"
10005065-204 = "메이드복은 골든 플리스호의 보관함에 있을 거고, 인제 와서 그게 저희 거라는 걸 주장할 근거는 없어졌으니……."
10005065-205 = "그렇지만 임무용 제복인 메이드복을 포기할 순 없잖아."
10005065-206 = "그렇죠. 결국, 그러니까……."
10005065-207 = "[s5] \"뭐, 다시 잠입해야겠지.\"\n[s6] \"오, 2회차야?\""
10005065-215 = "아 잠입 싫다고오오!!!!"
10005065-216 = "선상의 바니 체이서"
