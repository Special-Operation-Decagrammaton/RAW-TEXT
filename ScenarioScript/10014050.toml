[translation]
10014050-1 = "제5화;잊고 싶은 기억 속의 사람"
10014050-2 = "(………….)"
10014050-3 = "……어라. 먼저 와 계셨네요? 선생님!"
10014050-4 = "[s1] \"먼저 불렀으니까.\"\n[s2] \"아아. 여기 와서 앉아.\""
10014050-5 = "……안녕하세요! 우자와 레이사, 다시 한번 인사드립니다!"
10014050-6 = "……안녕하세요! 우자와 레이사, 다시 한번 인사드립니다!"
10014050-7 = "설마 연락처를 드리자마자 이렇게 하루 만에 불리게 될 줄이야!"
10014050-8 = "그런데……. 선생님께서 저를 무슨 일로……?"
10014050-9 = "……네?"
10014050-10 = "아아……. 오늘 일이요?"
10014050-11 = "그, 그건 이제 더는 걱정하실 필요 없습니다! 네! 저도 제대로 확인했으니까요!!"
10014050-12 = "쿄야마 카즈사는 완전히 개과천선했으며, 평범하게 좋은 사람들과 착하게 잘 지내고 있다!"
10014050-13 = "아무리 저라도 굳이 그걸 들춰낼 필요는 없죠! 그러니 이제 걱정하실 필요도 없어요!"
10014050-14 = "저도 더는 쿄야마 카즈사를 귀찮게 하지는 않을 테니까요!"
10014050-15 = "[s3] \"그런 말을 하려고 온 게 아냐.\"\n[s4] \"그럼 레이사는 그걸로 된 거야?\""
10014050-16 = "……네? 그게 무슨 말씀이신지……. 죄송하지만 이해가 잘 안 가는데……."
10014050-17 = "……네? 그게 무슨 말씀이신지……. 죄송하지만 이해가 잘 안 가는데……."
10014050-18 = "쿄야마 카즈사는 더 쓰러트릴 필요가 없는 사람이 됐고, 저도 더는 도전할 필요가 없어졌다……."
10014050-19 = "……뭐, 뭔가 더 있나요? 여기에?"
10014050-20 = "……네?"
10014050-21 = "쿄야마 카즈사에 대해, 다른 자경단이나 정의실현부에 연락한 적은 있었냐고요?"
10014050-22 = "아뇨. 딱히 그렇지는……."
10014050-23 = "……어라?"
10014050-24 = "그, 그러게요? 으음……. 따로 연락을 한 사람이 없네요. 그러고 보니 왜 그랬을까요?"
10014050-25 = "심지어 스즈미 씨에게도……. 따로 말씀드린 적은 없네요……. 이상해라."
10014050-26 = "뭐, 제가 쓰러뜨려야 할 숙적!"
10014050-27 = "……이라고 생각해서 그런 게 아닐까요? 하하하!"
10014050-31 = "……사실……. 애초에 연락할 만한 사람도 거의 없으니 그런 거지만요. 하하……."
10014050-32 = "그, 그나저나 죄송하지만……. 정말로 왜 이런 걸 계속 물으시는지, 저로서는 잘 이해가……."
10014050-33 = "혹시……."
10014050-34 = "여기 있었구나, 이상한 자경단 녀석!!"
10014050-35 = "……응?"
10014050-36 = "[ns] \"……!?\""
10014050-42 = "맞아, 이 녀석이야. 내가 똑똑히 봤다고. 이 녀석이 확실해!!"
10014050-43 = "다른 녀석들도 전부 불러! 놓치면 안 돼. 지금이 절호의 기회일 테니까!!"
10014050-44 = "[s5] \"놓치면 안 돼……?\"\n[s6] \"절호의 기회?\""
10014050-45 = "아. 뭐야, 웬 어른도 같이 있잖아……?"
10014050-46 = "아. 뭐야, 웬 어른도 같이 있잖아……?"
10014050-47 = "아니, 아무래도 상관없지. 어른은 다치기 싫으면 지금 당장 빠지라고. 우린 거기 있는 녀석한테 볼 일이 있으니까!"
10014050-48 = "……예? 저요?"
10014050-49 = "시치미 떼지 마. 이미 다 알고 왔으니까 말이야."
10014050-50 = "네 녀석……. <카스팔루그>의 정체가 누군지 알고 있지?"
10014050-51 = "……?? 카스팔루그? 어……. 그, 그야……. 그런데 그건 어째서……?"
10014050-52 = "어째서긴 뭘 어째서야! 녀석이 재기해서 새로운 그룹을 만들려 한다는 정보가 이미 쫙 퍼져 있다고!"
10014050-53 = "방과후 디저트단인가 뭔가 하는 이름이었는데 말이지. 그치? 우리 말이 맞지?"
10014050-54 = "[s7] \"……아. 설마.\"\n[s8] \"일이 이상하게 꼬였다.\""
10014050-55 = "자, 잠깐만요. 그건 오해입니다, 여러분! 그런 조직은 없어요! 잘못된 소문이라고요!"
10014050-56 = "자, 잠깐만요. 그건 오해입니다, 여러분! 그런 조직은 없어요! 잘못된 소문이라고요!"
10014050-57 = "그리고 쿄야마…… 아니 카스팔루그는……. 이제 여러분이 생각하는 그런 사람이 아니에요!"
10014050-58 = "아니 더는 없어요!"
10014050-59 = "무슨 말도 안 되는 소리야? 그런 소릴 지금 우리더러 믿으라는 거야? 우리가 바본 줄 알아?"
10014050-60 = "하하하. 그, 그렇겠죠? 사실 저도 그렇게 생각했었으니……."
10014050-61 = "……아니, 그, 그게 아니고! 그렇지만 진짜예요! 진짜 더는 당신들이랑 상관없는 일이에요!!"
10014050-62 = "처음부터 그럴 거라 생각하긴 했지만 역시 말로는 안 될 녀석이군."
10014050-63 = "얘들아!!"
10014050-68 = "자세한 건 입이 아니라 이 총구멍이 대답해 줄 테니까!!"
10014050-73 = "어, 어째서 이런 상황이……."
10014050-74 = "서, 선생님……!?"
10014050-75 = "[s9] \"아무래도 어쩔 수 없는 것 같네.\"\n[s10] \"우선 내 지휘를 들어줘, 레이사.\""
10014050-76 = "아……."
10014050-77 = "아……."
10014050-78 = "……네!!"
