[translation]
1004205-1 = "거리의 화원"
1004205-2 = "[ns] \"좋은 아침. 아츠코.\""
1004205-3 = "응, 좋은 아침. 선생님."
1004205-4 = "……응? 손에 든 건 뭐야?"
1004205-5 = "[s] \"꽃꽂이를 한다길래, 가져와 봤어.\""
1004205-6 = "……어?"
1004205-9 = "[wa:400]― 이 꽃, [wa:1800]설마……"
1004205-11 = "[wa:150]― ……가져와 [wa:1300]주었구나."
1004205-14 = "[wa:300]― 날 [wa:800]위해서…?"
1004205-16 = "[wa:50]― ……그렇구나."
1004205-19 = "[wa:500]― 소중히 간직할게. [wa:2100]"
1004205-22 = "[wa:1800]― ……굉장히 [wa:1000]기뻐."
1004205-24 = "― 고마워."
1004205-27 = "……그치만, 나 꽃꽂이를 하겠다고 한 적은 없는걸."
1004205-28 = "[s1] \"……뭐?\"\n[s2] \"그, 그랬었나……?!\""
1004205-29 = "응. 화단을 만들려고 했었어."
1004205-30 = "응. 화단을 만들려고 했었어."
1004205-31 = "[s] \"화단이구나…….\""
1004205-32 = "선생님이 준 건 화단에 심을 수 없으니까, 내가 따로 소중히 간직할게."
1004205-33 = "……후후. 응. 이건 특별하니까."
1004205-37 = "자, 화단은 이쪽이야. 선생님."
1004205-42 = "(사람들이 오가는 거리의 한쪽 구석에 화단이 꾸며져 있었다.)"
1004205-43 = "(화단 군데군데 꽃들이 심어져 있었다.)"
1004205-44 = "[ns] \"이게 화단이야?\""
1004205-45 = "응. 이번에는 이 지역에서 꽤 오랫동안 머물 계획이라고 해서."
1004205-46 = "꽃밭을 만들어도 괜찮겠다고 생각했거든."
1004205-47 = "그래서 햇볕이 잘드는 땅을 찾아서 여기다 들꽃들을 옮겨 심고 있고 있었어."
1004205-48 = "이제 막 시작했거든. 여기를 전부 꽃으로 채워보려고."
1004205-49 = "[s] \"들꽃인가…… 이건 무슨 꽃이야?\""
1004205-50 = "……나도 몰라."
1004205-51 = "[s] \"어…… 모른다고?\""
1004205-52 = "응. 그냥 꽃이야. 도시에 아무렇게나 피어있는 잡초들. 이름 같은 게 있었을지도 모르겠네. 나는 모르지만."
1004205-53 = "그대로 두면 그냥 말라 죽어버렸을 거니까, 여기다가 옮겨 심어두는 거야."
1004205-54 = "이렇게 함께 모여서 땅에 뿌리를 내리게 되면 좋을 것 같다 싶어서."
1004205-55 = "[s] \"그럼 나도 도와줄게.\""
1004205-56 = "……응. 고마워."
1004205-57 = "그럼, 이 근처에 꽃이 보이면 뿌리까지 캐서 여기로 가져다 주면 돼."
1004205-58 = "[s3] \"알겠어.\"\n[s4] \"맡겨달라고.\""
1004205-59 = "조심하지 않으면 안 돼. 뿌리가 상하면 죽어버리니까."
1004205-60 = "조심하지 않으면 안 돼. 뿌리가 상하면 죽어버리니까."
1004205-62 = "(그 뒤로 한동안 거리에 피어있는 꽃들을 찾아다녔다.)"
