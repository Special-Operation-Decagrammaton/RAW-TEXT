[translation]
1014805-1 = "出遊少女與最後的假日"
1014805-2 = ""
1014805-3 = "啊，老師。"
1014805-4 = "你來得剛剛好呢。"
1014805-5 = "沒關係的。今天本來就沒約好時間。"
1014805-6 = "那麼，我們走吧？"
1014805-7 = ""
1014805-9 = ""
1014805-14 = "哼嗯，千年EXPO啊。原來有這麼有趣的活動呢。"
1014805-15 = "啊，千年嗎？嗯，因為工作去過幾次。"
1014805-16 = "萬魔殿因為種種原因，對跟其他學園的外交還挺有興趣的。"
1014805-17 = "不過倒是沒有好好觀光過。"
1014805-18 = "而且今年的EXPO好像已經結束了……"
1014805-19 = "如果明年還有舉辦，要不要一起去看看？"
1014805-20 = ""
1014805-22 = ""
1014805-23 = "是的，就我們兩個人。"
1014805-30 = ""
1014805-31 = "……這是我第一次在這一站下車呢。"
1014805-32 = "哎呀，老師也是嗎？"
1014805-33 = "呵呵。那我們兩個都是第一次來這裡呢。"
1014805-34 = "要不要隨意走走看？"
1014805-35 = ""
1014805-37 = ""
1014805-39 = "哦，這裡的在地市場還挺熱鬧的呢。"
1014805-40 = "最近格黑娜自治區的大型賣場越來越多，這種在地的市場就變少了。"
1014805-41 = "我比較喜歡親自逛店家挑東西，所以對這種變化感到有點遺憾。"
1014805-42 = "要過去看看嗎？"
1014805-43 = ""
1014805-45 = ""
1014805-46 = ""
1014805-47 = "這裡好像是紀念品店……"
1014805-48 = "這是什麼……？"
1014805-49 = ""
1014805-51 = ""
1014805-52 = "用熱壓機壓扁的魷魚……？"
1014805-53 = "啊！不用擔心，那不是真的魷魚！"
1014805-54 = "這是本店的招牌，魷魚造型的仙貝。#n很適合當伴手禮，要不要來一個？現在還可以試吃哦！"
1014805-55 = "咦……？這不會有點惡趣味嗎……"
1014805-56 = "話說情侶會來這種地方觀光，實在挺少見的呢。"
1014805-57 = "……咦？"
1014805-58 = "啊，我是不是說錯話了？因為兩位的氣氛實在太好了……"
1014805-59 = "……沒事。"
1014805-60 = "難得來一趟，就買一盒魷魚造型仙貝吧？"
1014805-61 = "謝謝惠顧！試吃用的贈品我也一起放進袋子裡！請稍等一下！"
1014805-62 = ""
1014805-64 = ""
1014805-65 = "呵呵。你聽到了嗎？"
1014805-66 = "我的心情倒是不壞呢。"
1014805-67 = ""
1014805-69 = ""
1014805-70 = "老師覺得呢？"
1014805-72 = "（之後也和伊呂波一起逛了好幾個地方）"
1014805-73 = ""
1014805-74 = "在這間咖啡廳休息一下再走吧。"
1014805-75 = "走了太多路，腳好痠呢。"
1014805-76 = "你要喝點什麼嗎？"
1014805-77 = "啊，沒關係。你難得陪我出來，這點小錢就讓我請吧。"
1014805-78 = "咦？不用啦，你坐著就好……不是，真的沒關係。#n好啦好啦，那我自己的份自己付，這樣總可以了吧？"
1014805-79 = ""
1014805-81 = ""
1014805-85 = ""
1014805-86 = "這間咖啡廳明明挺高級的，卻沒什麼人呢。#n是因為這裡人潮比較少嗎？"
1014805-87 = "不過類似這種包場的感覺倒是挺好的。"
1014805-88 = "……真不錯呢。"
1014805-89 = "格黑娜實在太吵了。而且人又很多。"
1014805-90 = "我不是說那樣不好，只是偶爾光是面對人就會覺得累。"
1014805-91 = "每到那種時候，我就會忍不住開始想像。"
1014805-92 = "乾脆拋下一切，在這種清靜的小鎮悠閒度日算了。"
1014805-93 = "……老師不也是這樣嗎？"
1014805-94 = "據我所知，老師應該也被工作和人搞得很累了吧。"
1014805-95 = "如果是老師的話，一起生活也無妨哦？"
1014805-96 = "咦？下一個計畫嗎？"
1014805-97 = "這個嘛……"
1014805-98 = "剛才看到附近有海呢。"
1014805-99 = "雖然這裡不是觀光地區，海邊應該沒怎麼開發就是了……"
1014805-100 = "難得來了，要不要去看看？"
1014805-101 = "還有……"
1014805-102 = "我有帶泳裝來哦。"
1014805-109 = "呼……"
1014805-110 = "海風真舒服。"
1014805-111 = "這個海邊比我預期的還要棒呢。"
1014805-112 = "……老師。"
1014805-113 = "你為什麼站得那麼遠呢？"
1014805-114 = "難道是怕衣服弄濕嗎？"
1014805-115 = "呵呵，沒關係的。浪不會打到那邊。"
1014805-116 = ""
1014805-118 = ""
1014805-119 = "怎麼樣？"
1014805-120 = "近看更漂亮吧？"
1014805-121 = "……"
1014805-122 = ""
1014805-124 = ""
1014805-125 = "嘿。"
1014805-126 = ""
1014805-131 = "― [log=이로하 수영복]呵呵。[/log][wa:2160] "
1014805-133 = "― [log=이로하 수영복]真是個好表情。[/log][wa:80] "
1014805-136 = "― [log=이로하 수영복]請不要生氣。[/log][wa:160] "
1014805-138 = "― [log=이로하 수영복]這只是個可愛的惡作劇嘛。[/log][wa:160] "
1014805-141 = "― [log=이로하 수영복]沙子，暖呼呼的呢。[/log][wa:2050] "
1014805-143 = "― [log=이로하 수영복]還殘留著白天的熱度……[/log]"
1014805-146 = "― [log=이로하 수영복]……今天一整天，我過得很開心。[/log][wa:2070] "
1014805-149 = "― [log=이로하 수영복]老師也是？[/log]"
1014805-151 = "― [log=이로하 수영복]……這樣啊。[/log]"
1014805-154 = "― [log=이로하 수영복]既然如此……[/log][wa:740] "
1014805-156 = "― [log=이로하 수영복]乾脆別回去了？[/log][wa:1700] "
1014805-159 = "― [log=이로하 수영복]就這樣要是能那樣就好了……去很遠的地方。[/log][wa:8180] "
1014805-161 = ""
1014805-162 = "[ns] 「……伊呂波。」"
1014805-164 = "[ns] 「乖學生該回家了。」"
1014805-166 = "呿。"
1014805-167 = "老師果然不好對付呢。"
1014805-168 = "[s1] 「滿意了嗎？」\n[s2] 「我覺得已經陪你陪得挺久了呢～」"
1014805-171 = "……老實說，還沒有。"
1014805-172 = "人真是貪心的動物呢。"
1014805-173 = "老師果然一開始就知道今天是什麼日子了呢。"
1014805-174 = "沒錯。今天是暑假的最後一天。"
1014805-175 = "從明天開始，又要回到無聊又累人的日常了吧。"
1014805-176 = "所以我才稍微任性了一下，沒想到你會陪我到最後呢。這確實出乎意料。"
1014805-177 = "[s3] 「因為伊呂波平常都很努力啊。」\n[s4] 「因為我們是一起偷懶的夥伴嘛。」"
1014805-180 = "……你還真敢說呢。"
1014805-181 = "順帶一提，剛才說要一起離開的提議……"
1014805-182 = "到現在都還有效哦。"
1014805-183 = "當然，你現在八成會選擇拒絕……"
1014805-184 = "不過你遲早會說YES的哦？"
