[translation]
1014805-1 = "아우스플뤼글러린과 마지막 휴일"
1014805-3 = "아, 선생님."
1014805-4 = "딱 맞춰 오셨네요."
1014805-5 = "괜찮아요. 오늘은, 따로 시간이 정해진 것도 아니니까요."
1014805-6 = "그러면, 가실까요?"
1014805-14 = "흐응, 밀레니엄 엑스포라. 흥미로운 행사가 있었네요."
1014805-15 = "아, 밀레니엄이요? 뭐, 업무 건으로 몇 차례 방문한 적은 있네요."
1014805-16 = "이래저래 만마전은 타교와의 외교에 관심이 많은 편이고."
1014805-17 = "그래도 제대로 관광해 본 적은 없어요."
1014805-18 = "게다가 올해 엑스포는 이미 지나간 것 같고……."
1014805-19 = "혹시 내년에도 열린다면 같이 가보실래요?"
1014805-23 = "네, 저희 둘이서만요."
1014805-31 = "……이 역에서 내려본 거는 처음이네요."
1014805-32 = "어라, 선생님께서도 그런가요?"
1014805-33 = "후후. 그러면 저희 둘 다 여기는 처음인 거네요."
1014805-34 = "적당히 발 닿는 대로 가볼까요?"
1014805-39 = "오, 꽤 활성화된 지역 시장이네요."
1014805-40 = "최근에는 게헨나 자치구에도 대형 마트가 늘어서, 이런 로컬한 시장이 줄어들었단 말이죠."
1014805-41 = "저는 가게들을 직접 돌아다니며 물색하는 걸 즐기는 편이라 아쉬운 변화예요."
1014805-42 = "뭘 파는지 둘러볼까요?"
1014805-47 = "여기는 선물가게 같은데……."
1014805-48 = "뭐죠, 이건……?"
1014805-52 = "……프레스기로 압착한 오징어……?"
1014805-53 = "아! 괜찮아요, 그거 진짜 오징어 아니에요!"
1014805-54 = "저희 가게 명물, 오징어 모양 센베이랍니다. 선물용으로 평가가 좋은데, 하나 어떠신가요? 지금이라면 시식도 가능합니다!"
1014805-55 = "네? ……좀 악취미적 아닌가……."
1014805-56 = "그나저나, 커플 관광객이 이런 곳에 오다니, 드문 일이네요."
1014805-57 = "……네?"
1014805-58 = "앗, 혹시 제가 말실수했나요? 두 사람 분위기가 너무 좋길래……."
1014805-59 = "……아니에요."
1014805-60 = "오징어 모양 센베이, 모처럼이니까 한 박스 사볼까요?"
1014805-61 = "감사합니다! 맛보기용으로 서비스도 봉투에 담아드릴게요! 잠시만 기다려주세요!"
1014805-65 = "후후. 들으셨어요?"
1014805-66 = "저는 별로 나쁜 기분이 아닌데요."
1014805-70 = "선생님은 어떠신가요?"
1014805-72 = "(이후로도 이로하와 여러 장소를 함께 돌아다녔다.)"
1014805-74 = "잠깐 여기 카페에서 쉬었다 가죠."
1014805-75 = "너무 걸어서 다리가 아프네요."
1014805-76 = "혹시 뭐 드시겠어요?"
1014805-77 = "아, 괜찮아요. 모처럼 어울려 주신 거잖아요. 이 정도는 제가 살게요."
1014805-78 = "네? 아니, 앉아 계세요. 제가 주문하고 올 테니…… 아니, 진짜 괜찮아요. 아, 알았어요. 대신 제 몫은 제가 낼게요. 그럼 됐죠?"
1014805-86 = "꽤 고급스러운 카페인데, 사람이 없네요. 통행객이 적은 곳이라 그럴까요?"
1014805-87 = "뭐, 저희야 좋은 장소를 전세 낸 기분이라 좋지만요."
1014805-88 = "……좋네요."
1014805-89 = "게헨나는 너무 시끄럽다니까요. 사람도 많고."
1014805-90 = "나쁘다는 건 아닌데요. 가끔은 사람 그 자체에 피곤해질 때가 있어서요."
1014805-91 = "그럴 때마다 그냥 상상해 보는 거죠."
1014805-92 = "다 때려치우고 이런 한적한 동네에서 유유자적하게 지내고 싶다고."
1014805-93 = "……선생님도 비슷하지 않으신가요?"
1014805-94 = "제가 알기로, 선생님께서도 꽤나 일이나 사람에게 지쳐 있으실 텐데."
1014805-95 = "저는, 선생님까지는, 같이 살아도 괜찮은데요?"
1014805-96 = "네? 다음 계획이요?"
1014805-97 = "글쎄요……."
1014805-98 = "아까 보니까, 근처에 바다가 있더라고요."
1014805-99 = "관광지가 아니니까, 해변이 개발되어 있을 거 같진 않지만……."
1014805-100 = "모처럼이니까 보러 가지 않을래요?"
1014805-101 = "그리고."
1014805-102 = "수영복, 챙겨 왔거든요."
1014805-109 = "하아……."
1014805-110 = "바닷바람이 기분 좋네요."
1014805-111 = "기대한 것보다 좋은 해변이었어요."
1014805-112 = "……선생님."
1014805-113 = "왜 그렇게 떨어져 계시나요?"
1014805-114 = "설마 옷이 젖으실까 봐 그러세요?"
1014805-115 = "후후, 괜찮아요. 여기까지는 파도가 안 오니까요."
1014805-119 = "어때요?"
1014805-120 = "가까이서 보니 더 예쁘죠?"
1014805-121 = "……."
1014805-125 = "에잇."
1014805-131 = "[wa:2120]― [log=이로하 수영복]후훗, [/log]"
1014805-133 = "― [log=이로하 수영복]우스운 표정.[wa:40] [/log]"
1014805-136 = "― [log=이로하 수영복]화내지 마세요.[wa:40] [/log]"
1014805-138 = "― [log=이로하 수영복]그냥 장난이니까.[wa:240] [/log]"
1014805-141 = "[wa:620]― [log=이로하 수영복]모래, [wa:1310]따끈따끈하네요.[/log]"
1014805-143 = "― [log=이로하 수영복]아직 햇살의 온기가 남아 있어서…….[/log]"
1014805-146 = "[wa:360]― [log=이로하 수영복]……오늘 하루, [wa:1590]제법 즐거웠지요.[/log]"
1014805-149 = "― [log=이로하 수영복]선생님도?[/log]"
1014805-151 = "― [log=이로하 수영복]……같으신가요.[/log]"
1014805-154 = "[wa:620]― [log=이로하 수영복]차라리 이대로……[/log]"
1014805-156 = "― [log=이로하 수영복]돌아가지 [wa:1540]말까요?[wa:40] [/log]"
1014805-159 = "[wa:3610]― [log=이로하 수영복]떠날까요? [wa:1640]그러면 좋을 텐데…… [wa:2810]저 멀리.[/log]"
1014805-162 = "[ns] \"……이로하.\""
1014805-164 = "[ns] \"착한 학생은 귀가할 시간입니다.\""
1014805-166 = "쳇."
1014805-167 = "역시 선생님은 만만치 않네요."
1014805-168 = "[s1] \"만족했어?\"\n[s2] \"꽤 어울려 줬다고 생각하는데~\""
1014805-171 = "……솔직히, 아니요."
1014805-172 = "사람은 참 간사한 동물이네요."
1014805-173 = "역시 선생님께서는 처음부터 무슨 날인지 알고 계셨네요."
1014805-174 = "맞아요. 오늘은 여름휴가 마지막 날이에요."
1014805-175 = "내일부터 다시 지루하고, 피곤한 일상으로 돌아가겠죠."
1014805-176 = "조금 제멋대로 해봤는데, 끝까지 따라와 주셔서 의외였어요."
1014805-177 = "[s3] \"이로하는 평소에 노력하고 있으니까.\"\n[s4] \"같은 땡땡이 동지니까.\""
1014805-180 = "……정말로, 잘도 말씀하시네요."
1014805-181 = "참고로 아까 같이 떠나자고 한 제안."
1014805-182 = "그거 아직도 유효해요."
1014805-183 = "물론, 지금은 아니라고 하시겠지만……."
1014805-184 = "언젠가 YES라고 말하실걸요?"
