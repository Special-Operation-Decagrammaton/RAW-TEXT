1014805-90 = "Hmmm, I don't exactly hate it. I just get tired of being around people, you know?"
1014805-91 = "Sometimes, it makes me start daydreaming of other things."
1014805-92 = "I like to imagine a life that's quiet and carefree, maybe somewhere like this."
