1014805-61 = "Thank you! I'll throw in some extra samples for you too! Just a moment, please!"
1014805-62 = ""
1014805-64 = ""
1014805-65 = "Heehee. You hear what he said?"
1014805-66 = "I didn't mind. Him mistaking us for a couple and all."
1014805-67 = ""
1014805-69 = ""
1014805-70 = "How about you, Sensei?"
1014805-72 = "Iroha and I wandered around the market a while longer, visiting shops here and there when something caught our eye."
1014805-73 = ""
1014805-74 = "Is this a cafe? Let's take a break here."
1014805-75 = "My legs are tired from all that walking."
1014805-76 = "You want anything to drink?"
1014805-77 = "Eh? No, let me. I've been dragging you around all day."
1014805-78 = "Hey, Sensei! I'm serious. Lemme— Ugh. Fine. But at least let me pay for mine, okay?"
1014805-79 = ""
1014805-81 = ""
1014805-85 = ""
1014805-86 = "This place is really nice, but there's no one here. Maybe not a lot of people come this way."
1014805-87 = "Not that I'm complaining. It's like it's our private little cafe."
1014805-88 = "...This is really nice."
