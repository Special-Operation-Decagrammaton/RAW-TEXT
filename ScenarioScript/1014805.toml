1014805-34 = "Let's go wherever the wind takes us!"
1014805-35 = ""
1014805-37 = ""
1014805-39 = "Wow. There's so many people at the market."
1014805-40 = "More chain grocery stores have been opening throughout Gehenna lately, which has hit local markets like this one hard."
1014805-41 = "Which affects me personally, since I like to dillydally and explore the shops."
