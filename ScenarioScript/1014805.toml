1014805-49 = ""
1014805-51 = ""
1014805-52 = "...A squid flattened in a press...?"
1014805-53 = "Oh, no, no, no! That's not a real squid!"
1014805-54 = "It's our specialty, a squid-shaped senbei! It's very popular as a gift. Would you like one? You can even try a sample right now!"
1014805-55 = "Huh? ...Isn't that a little in poor taste?"
