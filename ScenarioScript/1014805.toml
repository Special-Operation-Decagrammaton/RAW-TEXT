[translation]
1014805-1 = "นักท่องเที่ยวหญิงกับวันหยุดสุดท้าย"
1014805-2 = ""
1014805-3 = "อ๊ะ คุณครู"
1014805-4 = "มาพอดีเลยนะคะ"
1014805-5 = "ไม่เป็นไรค่ะ วันนี้ไม่ได้กำหนดเวลาไว้เป็นพิเศษอยู่แล้ว"
1014805-6 = "ถ้างั้น ไปกันเลยมั้ยคะ?"
1014805-7 = ""
1014805-9 = ""
1014805-14 = "หืม มิลเลเนียม เอ็กซ์โปเหรอคะ? มีงานน่าสนใจแบบนั้นด้วยสินะคะ"
1014805-15 = "อ้อ มิลเลเนียมเหรอคะ? ก็เคยไปเรื่องงานมาสองสามครั้งค่ะ"
1014805-16 = "แพนเดโมเนียม โซไซตี้ค่อนข้างสนใจเรื่องการทูตกับโรงเรียนอื่นๆ อยู่เหมือนกัน"
1014805-17 = "แต่ฉันก็ยังไม่เคยไปเที่ยวชมจริงๆ จังๆ เลยค่ะ"
1014805-18 = "แถมงานเอ็กซ์โปปีนี้ก็ดูเหมือนจะจบไปแล้วด้วย..."
1014805-19 = "ถ้าปีหน้าจัดอีก เราไปด้วยกันมั้ยคะ?"
1014805-20 = ""
1014805-22 = ""
1014805-23 = "ค่ะ แค่เราสองคนเท่านั้น"
1014805-30 = ""
1014805-31 = "ฉันเพิ่งเคยลงสถานีนี้เป็นครั้งแรกเลยค่ะ..."
1014805-32 = "อ้าว คุณครูก็เหมือนกันเหรอคะ?"
1014805-33 = "ฮุฮุ ถ้างั้นเราสองคนก็เพิ่งมาที่นี่ครั้งแรกเหมือนกันสินะคะ"
1014805-34 = "ลองเดินไปเรื่อยๆ กันมั้ยคะ?"
1014805-35 = ""
1014805-37 = ""
1014805-39 = "โอ้ ตลาดท้องถิ่นคึกคักทีเดียวเลยนะคะ"
1014805-40 = "ช่วงนี้ในเขตปกครองตนเองเกเฮนน่าก็มีซูเปอร์มาร์เก็ตขนาดใหญ่เพิ่มขึ้น ตลาดท้องถิ่นแบบนี้เลย#nลดน้อยลงค่ะ"
1014805-41 = "ฉันชอบเดินเลือกดูของตามร้านด้วยตัวเอง ก็เลยรู้สึกเสียดายกับการเปลี่ยนแปลงแบบนี้ค่ะ"
1014805-42 = "ลองเดินดูมั้ยคะว่ามีอะไรขายบ้าง?"
1014805-43 = ""
1014805-45 = ""
1014805-46 = ""
1014805-47 = "ตรงนี้เหมือนจะเป็นร้านขายของฝากนะคะ..."
1014805-48 = "อะไรกัน นี่มัน...?"
1014805-49 = ""
1014805-51 = ""
1014805-52 = "ปลาหมึกที่โดนเครื่องอัดบี้จนแบน... เหรอคะ?"
1014805-53 = "อ๊ะ! ไม่ต้องห่วงนะครับ นั่นไม่ใช่ปลาหมึกจริงๆ หรอก!"
1014805-54 = "เป็นเซ็มเบรูปปลาหมึก ของขึ้นชื่อของร้านเราเอง คนที่ซื้อไปเป็นของฝากก็ชอบกันมาก สนใจสักชิ้นมั้ยล่ะครับ? ตอนนี้ลองชิมได้ด้วยนะ!"
1014805-55 = "คะ? รสนิยมพิลึกไปหน่อยหรือเปล่า..."
1014805-56 = "จะว่าไป ไม่ค่อยเห็นนักท่องเที่ยวที่เป็นคู่รักมาที่แบบนี้เลยนะครับ"
1014805-57 = "คะ...?"
1014805-58 = "อ๊ะ หรือว่าพูดอะไรผิดไป? เห็นทั้งสองคนดูเข้ากันดีมากน่ะ..."
1014805-59 = "เปล่าหรอกค่ะ..."
1014805-60 = "เซ็มเบรูปปลาหมึก... ไหนๆ ก็มาแล้ว ซื้อกลับไปสักกล่องดีมั้ยคะ?"
1014805-61 = "ขอบคุณครับ! เดี๋ยวแถมแบบลองชิมใส่ถุงไปด้วยนะ! รอสักครู่ครับ!"
1014805-62 = ""
1014805-64 = ""
1014805-65 = "ฮุฮุ ได้ยินมั้ยคะ?"
1014805-66 = "ฉันก็ไม่ได้รู้สึกแย่อะไรนะคะ"
1014805-67 = ""
1014805-69 = ""
1014805-70 = "แล้วคุณครูละคะ?"
1014805-72 = "(หลังจากนั้นคุณครูก็เดินเที่ยวที่ต่างๆ กับอิโรฮะต่อ)"
1014805-73 = ""
1014805-74 = "แวะพักที่คาเฟ่ตรงนี้สักหน่อยแล้วค่อยไปต่อเถอะค่ะ"
1014805-75 = "เดินเยอะจนปวดขาแล้วค่ะ"
1014805-76 = "ทานอะไรหน่อยมั้ยคะ?"
1014805-77 = "อ๊ะ ไม่เป็นไรค่ะ คุณครูอุตส่าห์มาเป็นเพื่อนทั้งที แค่นี้ฉันเลี้ยงเองค่ะ"
1014805-78 = "คะ? ไม่ค่ะ นั่งอยู่ตรงนี้เถอะค่ะ เดี๋ยวฉันไปสั่งเอง... ไม่ค่ะ ไม่เป็นไรจริงๆ อ่า เข้าใจแล้วค่ะ แต่ส่วนของฉัน ฉันขอจ่ายเองนะคะ แบบนี้ได้ใช่มั้ยคะ?"
1014805-79 = ""
1014805-81 = ""
1014805-85 = ""
1014805-86 = "ที่นี่เป็นคาเฟ่ที่ดูหรูทีเดียว แต่ไม่มีคนเลยนะคะ เพราะไม่ค่อยมีคนผ่านมาหรือเปล่านะ?"
1014805-87 = "รู้สึกเหมือนได้เหมาร้านบรรยากาศดีๆ เลย ฉันว่าดีนะคะ"
1014805-88 = "ดีจังเลย..."
1014805-89 = "เกเฮนน่าเสียงดังเกินไปค่ะ คนก็เยอะด้วย"
1014805-90 = "ฉันไม่ได้บอกว่าไม่ดีหรอกนะคะ แต่บางครั้งแค่อยู่กับผู้คน ฉันก็รู้สึกเหนื่อยแล้วค่ะ"
1014805-91 = "เวลาเป็นแบบนั้น ฉันก็ได้แต่ลองจินตนาการดู"
1014805-92 = "ว่าอยากทิ้งทุกอย่าง แล้วมาใช้ชีวิตสบายๆ ในย่านเงียบสงบแบบนี้"
1014805-93 = "คุณครูก็น่าจะรู้สึกคล้ายๆ กันไม่ใช่เหรอคะ...?"
1014805-94 = "เท่าที่ฉันรู้ คุณครูเองก็คงเหนื่อยกับทั้งงานทั้งผู้คนไม่น้อยเลย"
1014805-95 = "ฉันน่ะ... ถ้าเป็นคุณครูละก็ จะมาอยู่ด้วยกันก็ไม่เป็นไรนะคะ?"
1014805-96 = "คะ? ถามว่าจะไปไหนต่อเหรอคะ?"
1014805-97 = "นั่นสินะคะ..."
1014805-98 = "เมื่อกี้เห็นว่ามีทะเลอยู่ใกล้ๆ ด้วยค่ะ"
1014805-99 = "มันยังไม่ใช่แหล่งท่องเที่ยว ชายหาดก็คงยังไม่ได้พัฒนาให้เป็นที่เที่ยวด้วย..."
1014805-100 = "แต่ไหนๆ ก็มาแล้ว เราไปดูกันหน่อยมั้ยคะ?"
1014805-101 = "แล้วก็"
1014805-102 = "ฉันเอาชุดว่ายน้ำมาด้วยค่ะ"
1014805-109 = "เฮ้อ..."
1014805-110 = "ลมทะเลพัดสบายดีจังนะคะ"
1014805-111 = "เป็นชายหาดที่ดีกว่าที่คิดไว้อีกค่ะ"
1014805-112 = "คุณครู..."
1014805-113 = "ทำไมถึงออกไปอยู่ห่างขนาดนั้นล่ะคะ?"
1014805-114 = "กลัวเสื้อผ้าจะเปียกเหรอคะ?"
1014805-115 = "ฮุฮุ ไม่เป็นไรค่ะ คลื่นซัดมาไม่ถึงตรงนี้หรอกค่ะ"
1014805-116 = ""
1014805-118 = ""
1014805-119 = "เป็นไงคะ?"
1014805-120 = "พอมองใกล้ๆ แล้วสวยกว่าเดิมใช่มั้ยคะ?"
1014805-121 = "..."
1014805-122 = ""
1014805-124 = ""
1014805-125 = "นี่แหนะ"
1014805-126 = ""
1014805-131 = "― [log=이로하 수영복]ฮุฮุ [/log][wa:2080] "
1014805-133 = "― [log=이로하 수영복]ทำหน้าตลกจัง [/log][wa:10] "
1014805-136 = "― [log=이로하 수영복]อย่าโกรธสิคะ [/log][wa:10] "
1014805-138 = "― [log=이로하 수영복]ฉันแค่แกล้งเล่นเอง [/log][wa:10] "
1014805-141 = "― [log=이로하 수영복]ทรายอุ่นๆ เลยนะคะ[/log][wa:1730] "
1014805-143 = "― [log=이로하 수영복]เพราะยังมีไออุ่นของแดดหลงเหลืออยู่...[/log]"
1014805-146 = "― [log=이로하 수영복]วันนี้ทั้งวัน... สนุกไม่ใช่เล่นเลยนะคะ[/log][wa:1150] "
1014805-149 = "― [log=이로하 수영복]คุณครูก็?[/log]"
1014805-151 = "― [log=이로하 수영복]รู้สึกเหมือนกันมั้ยคะ...[/log]"
1014805-154 = "― [log=이로하 수영복]ถ้างั้นเรา...[/log][wa:460] "
1014805-156 = "― [log=이로하 수영복]ไม่กลับกันดีมั้ยคะ? [/log][wa:1180] "
1014805-159 = "― [log=이로하 수영복]ออกเดินทางกันมั้ยคะ? อยากให้เป็นแบบนั้นจัง... ได้ไปที่ไกลๆ[/log][wa:6660] "
1014805-161 = ""
1014805-162 = "[ns] \"อิโรฮะ...\""
1014805-164 = "[ns] \"ได้เวลาที่เด็กดีต้องกลับบ้านแล้วละ\""
1014805-166 = "ชิ"
1014805-167 = "คุณครูไม่ยอมกันง่ายๆ เลยนะคะ"
1014805-168 = "[s1] \"พอใจหรือยัง?\"\n[s2] \"ครูว่าก็ตามใจไปเยอะแล้วนะ~\""
1014805-171 = "ถ้าพูดตรงๆ ก็ไม่ค่ะ..."
1014805-172 = "คนเรานี่เอาใจยากจริงๆ นะคะ"
1014805-173 = "คุณครูรู้ตั้งแต่แรกแล้วสินะคะว่าวันนี้เป็นวันอะไร"
1014805-174 = "ใช่ค่ะ วันนี้เป็นวันสุดท้ายของวันลาพักร้อน"
1014805-175 = "ตั้งแต่พรุ่งนี้ ฉันก็ต้องกลับไปใช้ชีวิตประจำวันที่น่าเบื่อและเหน็ดเหนื่อยค่ะ"
1014805-176 = "ฉันลองเอาแต่ใจดูนิดหน่อย แต่ก็ไม่คิดเลยนะคะว่าคุณครูจะยอมตามใจจนถึงตอนนี้"
1014805-177 = "[s3] \"ก็ปกติอิโรฮะพยายามเต็มที่อยู่แล้วนี่นา\"\n[s4] \"ก็เราเป็นสหายอู้งานเหมือนกันไง\""
1014805-180 = "ช่างพูดจริงๆ เลยนะคะ..."
1014805-181 = "ว่าแต่ เรื่องที่ชวนออกเดินทางด้วยกันเมื่อกี้"
1014805-182 = "ข้อเสนอนั้นยังมีผลอยู่นะคะ"
1014805-183 = "แน่นอนว่าตอนนี้คุณครูก็คงยังปฏิเสธ..."
1014805-184 = "แต่สักวัน คุณครูต้องพูดว่า YES แน่ๆ ค่ะ"
