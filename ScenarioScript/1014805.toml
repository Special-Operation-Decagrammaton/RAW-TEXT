[translation]
1014805-1 = "アウスフルークレリンと夏休みの終わり"
1014805-3 = "先生。"
1014805-4 = "時間きっかりですね。"
1014805-5 = "まあ、急ぐ旅路でもありませんが。"
1014805-6 = "では、行きましょうか。"
1014805-14 = "へぇ……ミレニアム[ruby=エキスポ]EXPO[/ruby]。面白そうですね。"
1014805-15 = "……はい？#nああ、ミレニアムには業務で何度か。"
1014805-16 = "[ruby=パンデモニウム・ソサエティー]万魔殿は他校と[/ruby]の交流に関心があるほうでして。"
1014805-17 = "とはいえ、まともに観光したことはないですね。"
1014805-18 = "今年のEXPOは終わってしまったみたいですし……。"
1014805-19 = "もしも来年があるなら、ご一緒しませんか？"
1014805-23 = "もちろん、二人きりで。"
1014805-31 = "この駅……降りたことはなかったですね。"
1014805-32 = "先生もですか？"
1014805-33 = "ふふっ。では、お互い初めての場所ということで。"
1014805-34 = "気の向くままに行ってみましょうか。"
1014805-39 = "賑わってますね。"
1014805-40 = "ゲヘナじゃこういうローカルな商店街が減ってきてまして。#n大型ショッピングセンターの勢いがなんとも。"
1014805-41 = "個人的には残念です。小さなお店を見て歩くのが好きなので。"
1014805-42 = "あ。あのお店、見てもいいですか？"
1014805-47 = "お土産屋さんのようですが……。"
1014805-48 = "これは……？"
1014805-52 = "プレスされた……イカ？"
1014805-53 = "ところがどっこい、本物じゃないんです！"
1014805-54 = "うちの名物、イカ形せんべい！お一ついかがです？#nみなさん、お土産としてよく買ってイカれますよ。イカだけに！"
1014805-55 = "これ……本当に人気なんですか……？"
1014805-56 = "それにしても、デートですか？#nこんな所までいらっしゃるなんて珍しい。"
1014805-57 = "……はい？"
1014805-58 = "あっ、すみません。良い雰囲気だったので、つい……。"
1014805-59 = "……いえ。"
1014805-60 = "……せっかくなので1箱もらいます。"
1014805-61 = "イカ形せんべいお買い上げ！ありがとうございます！#n少々お待ちください！"
1014805-65 = "ふふっ。聞きました？"
1014805-66 = "悪い気はしませんね。"
1014805-70 = "先生は……どうです？"
1014805-72 = "（その後もいろいろな場所を見て回った）"
1014805-74 = "このカフェで一休みしましょうか。"
1014805-75 = "少し疲れました。たくさん歩いたので。"
1014805-76 = "なに飲みます？ご馳走しますよ。"
1014805-77 = "いえ、いいですよ、これくらい。#n付き合わせてるのは私ですし。"
1014805-78 = "え？なんでそうなるんですか。いいって言ってるのに……。#nいや、全部出す、って……自分の分は自分で出しますから――"
1014805-86 = "雰囲気は良いのにガラガラですね。人通りの少ない所にあるからでしょうか。"
1014805-87 = "まあ、貸し切りみたいで良いですけど。"
1014805-88 = "ふぅ……落ち着きますね。"
1014805-89 = "うるさすぎるんですよ、ゲヘナは。人も多いですし。"
1014805-90 = "それも悪くはないんですけど。#n……時々、疲れます。"
1014805-91 = "それで……その度に想像するんです。"
1014805-92 = "全て投げ出して、静かな場所でのんびりするのを。"
1014805-93 = "そういうの、先生もやりませんか？"
1014805-94 = "だって、大概忙しいですよね。"
1014805-95 = "やっぱり……先生なら、一緒に逃げるのも悪くないかもしれません。"
1014805-96 = "次、ですか？"
1014805-97 = "そうですね……。"
1014805-98 = "ここ、海が近いですし。"
1014805-99 = "せっかくなので、行ってみませんか？"
1014805-100 = "有名ではないので、賑わってはいないでしょうけど……。"
1014805-101 = "実は、持ってきてまして。"
1014805-102 = "水着。"
1014805-109 = "ふぅ……。"
1014805-110 = "海風が気持ち良い……。"
1014805-111 = "思ったより良い所ですね。"
1014805-112 = "……先生？"
1014805-113 = "もっとこっちに来ないんですか？"
1014805-114 = "服が濡れるとか心配してます？"
1014805-115 = "大丈夫ですよ。そこまでは波がいかないので。"
1014805-119 = "ほら。"
1014805-120 = "近くで見ると、もっときれいですよ？"
1014805-121 = "……。"
1014805-125 = "えいっ。"
1014805-131 = "[wa:2120]― [log=이로하 수영복]ふふっ。[/log]"
1014805-133 = "― [log=이로하 수영복]いい顔をしますね。[/log]"
1014805-136 = "― [log=이로하 수영복]怒らないでください。[/log]"
1014805-138 = "― [log=이로하 수영복]かわいいイタズラじゃないですか。[/log]"
1014805-141 = "[wa:620]― [log=이로하 수영복]砂、[wa:1470]温かいですよね。[/log]"
1014805-143 = "― [log=이로하 수영복]まだ昼の熱が残っていて……。[/log]"
1014805-146 = "[wa:360]― [log=이로하 수영복]……今日1日、[wa:1710]楽しかったです。[/log]"
1014805-149 = "― [log=이로하 수영복]先生も？[/log]"
1014805-151 = "― [log=이로하 수영복]……そうですか。[/log]"
1014805-154 = "[wa:620]― [log=이로하 수영복]それならいっそ……[/log]"
1014805-156 = "― [log=이로하 수영복]帰るの、[wa:1580]やめません？[/log]"
1014805-159 = "[wa:3610]― [log=이로하 수영복]このまま、[wa:1680]どこか遠くへ……[wa:3010]なんて。[/log]"
1014805-162 = "[ns] \"……イロハ。\""
1014805-164 = "[ns] \"良い子は帰る時間だよ。\""
1014805-166 = "ちぇっ。"
1014805-167 = "手強いですね。"
1014805-168 = "[s1] \"今日、楽しめた？\"\n[s2] \"明日から頑張れそう？\""
1014805-171 = "……どうでしょう。"
1014805-172 = "人間は欲張りな生き物ですから。"
1014805-173 = "って、知ってたんですね。今日がどういう日なのか。"
1014805-174 = "夏休みは今日でおしまい。"
1014805-175 = "明日からは、面倒で怠い日常に逆戻りです。"
1014805-176 = "なのでスペシャルだったのですが……。#nまさか最後まで付き合ってくれるとは。想定外です。"
1014805-177 = "[s3] \"イロハはいつも頑張ってるから。\"\n[s4] \"私たち、サボり仲間だし。\""
1014805-180 = "またそういうことを言って……。"
1014805-181 = "さっきの提案。"
1014805-182 = "しばらく有効なので。"
1014805-183 = "今は「ノー」でしょうけど……。"
1014805-184 = "いつか「イエス」になるはずです。"
