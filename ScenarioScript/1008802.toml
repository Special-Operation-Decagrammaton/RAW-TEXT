[translation]
1008802-1 = "늘어져 있는 시간"
1008802-3 = "(카요코가 말해준 곳으로 향하니, 오페라 하우스 근처의 작은 골목가가 나타났다.)"
1008802-4 = "(따로 찾아오려 하지 않으면 알 수 없을 만큼 외진 곳이었다.)"
1008802-9 = "……아, 선생."
1008802-10 = "생각보다 빨리 왔네. 이쪽이야."
1008802-17 = "[ns1] \"카요코?\"\n[ns2] \"이런 곳까지 와 있던 거야?\""
1008802-20 = "아아. 뭐……. 그렇지."
1008802-21 = "오페라 하우스 근처는 오가는 사람이 많으니까. 조용히 앉아 있기도 어렵거든."
1008802-22 = "그렇다고 일하는 중에 너무 멀리 갈 수도 없고……."
1008802-26 = "그래서 이런 곳을 찾은 거지."
1008802-27 = "선생은 그런 적 없어? 이런 걸 뭐라고 하지?"
1008802-28 = "음……."
1008802-29 = "……땡땡이?"
1008802-30 = "[s3] \"여기선 묵비권을 행사할까.\"\n[s4] \"솔직하게 대답하기 두려운 걸.\""
1008802-33 = "……후후."
1008802-34 = "충분히 대답이 됐으니, 그 이상은 말하지 않아도 돼."
1008802-35 = "그리고 너무 걱정할 필요 없어."
1008802-36 = "조금만 쉬다가, 금방 돌아갈 생각이니까."
1008802-40 = "……응?"
1008802-41 = "혹시 혼자 쉬고 싶은데 괜히 찾아온 거냐고?"
1008802-45 = "그럴 리가."
1008802-46 = "그런 거였다면 장소를 말하지도 않았겠지. 여길 선생에게 가르쳐 준 건 나잖아."
1008802-47 = "뭐……. 확실히 다른 사람들이었다면 말을 돌렸을 순 있겠지만."
1008802-48 = "걱정하지 않아도, 불편해한다거나 어려워하지는 않으니 괜찮아."
1008802-49 = "오히려 좋아하는 편이지. 이렇게 아무것도 안 하며 잡담 나누는 거."
1008802-50 = "……정확히는 그래도 되는 사람들을 말이야."
1008802-51 = "다만……."
1008802-55 = "후후……."
1008802-56 = "미안. 의외로 내 쪽에서 말이 많아지네. 이럴 생각은 아니었는데."
1008802-57 = "선생도 쉬러 왔을 텐데, 계속해서 말 걸면 온 의미가 없겠지."
1008802-58 = "그럼……."
1008802-62 = "……같이 좀 쉴까."
1008802-69 = "(이후 카요코와 말없이 저녁 하늘을 보며 시간을 보냈다.)"
1008802-70 = "(10여 분 정도. 아무 대화도 없는 시간이 흘러갔다.)"
1008802-76 = "……어라. 시간이……."
1008802-77 = "[s5] \"슬슬 돌아갈까.\"\n[s6] \"정말로 한 마디도 없었네, 우리.\""
1008802-81 = "……후후."
1008802-85 = "……그럴까."
1008802-89 = "……후후."
1008802-93 = "……그러게."
1008802-96 = "[wa:1150]― [log=카요코 드레스]……좋네.[/log]"
1008802-99 = "― [log=카요코 드레스]이렇게…….[/log]"
1008802-101 = "[wa:80]― [log=카요코 드레스]누군가와 함께 [wa:1700]멍하니 시간을 [wa:800]보내다니.[/log]"
1008802-104 = "[wa:700]― [log=카요코 드레스]……거의 [wa:400]해본 적 없는 거 같아.[/log]"
1008802-107 = "― [log=카요코 드레스]…맞아, [wa:900]항상 혼자.[/log]"
1008802-109 = "― [log=카요코 드레스]그게 좋다고 생각했었고.[/log]"
1008802-112 = "[ns7] \"나도 간만에 멍하니 있어서 편해지네.\"\n[ns8] \"주기적으로 이런 시간이 있으면 좋으련만.\""
1008802-113 = "[wa:1050]― [log=카요코 드레스]……정말?[/log]"
1008802-114 = "[wa:1050]― [log=카요코 드레스]……정말?[/log]"
1008802-117 = "― [log=카요코 드레스]후후, [wa:850]다행이다, [wa:1430]선생님도 좋아해 줘서.[/log]"
1008802-120 = "[wa:800]― [log=카요코 드레스]좋지, [wa:1800]이렇게 [wa:1200]조용히 지내는거.[/log]"
1008802-123 = "[wa:100]― [log=카요코 드레스]…아, [wa:950]그렇다고 [wa:570]평소가 싫다는 건 [wa:1080]아니지만.[/log]"
1008802-125 = "― [log=카요코 드레스]……선생님이라면 [wa:830]알겠지.[wa:280] [/log]"
1008802-128 = "[wa:630]― [log=카요코 드레스]후우…… [wa:2270]저기…….[/log]"
1008802-131 = "― [log=카요코 드레스]……조금만…….[/log]"
1008802-133 = "― [log=카요코 드레스]조금만 더… [wa:2700]여기 있어줘.[/log]"
1008802-136 = "어울려주느라 고생했어, 선생. 덕분에 간만에 즐거운 휴식이었던 것 같네."
1008802-137 = "혼자 쉬는 것보다도……. 훨씬 괜찮았어."
1008802-138 = "……응?"
1008802-139 = "일부러 그런 말 안 해줘도 좋다고? 그건 무슨 뜻이야?"
1008802-140 = "[ns9] \"말하지 않는 게 지금의 룰이잖아.\"\n[ns10] \"아마 생각하는 그런 걸 거야.\""
1008802-145 = "……아."
1008802-146 = "후후……."
1008802-147 = "선생. 항상 생각하는 거지만……."
1008802-152 = "……역시 참 재밌는 사람이네."
