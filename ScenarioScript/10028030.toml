[translation]
10028030-1 = "제3화;머리 칸으로"
10028030-5 = "오랜만이야, 선생님. 그런데 여긴 무슨 일로 왔을까?"
10028030-11 = "……그것도 깜찍한 트리니티 아가씨랑 함께 말이야."
10028030-15 = "……?"
10028030-16 = "까, 깜찍한……?"
10028030-17 = "[s] \"카스미. 초면에 그런 말은 좀…….\""
10028030-18 = "아아, 저는 괜찮아요, 선생님. 신경 쓰지 마세요."
10028030-19 = "이래 봬도 정의실현부인지라, 이 정도는 아무렇지도 않슴다~."
10028030-25 = "……호오?"
10028030-31 = "호오오오~! 뭐야, 뭐야~! 생각보다 대화가 통하잖아!!"
10028030-32 = "좋아! 그런 태도! 아주 좋아! 와하핫핫핫핫!!"
10028030-33 = "그래. 사소한 건 신경 끄자고! 우리에겐 훨씬 더 중요한 일들이 있으니까!!"
10028030-34 = "이왕 이렇게 된 거, 좋게 좋게 가야지! 좋게 좋게~."
10028030-35 = "어차피 상황을 보아하니, 우린 이제부터 동료나 다름없고 말이야!"
10028030-36 = "……적어도 이 열차에서 내리기 전까지는 말이지."
10028030-40 = "[ns1] \"……'동료'라고? ……'우리'가?\"\n[ns2] \"열차에서 내리기 전까지는……?\""
10028030-43 = "……응?"
10028030-44 = "왜 그런 반응이야? 아직 폭발의 충격에서 머리가 덜 풀렸어? 나의 말이 맞는 것 같은데?"
10028030-45 = "정리해 줄까? 둘은 여기 보관함 어딘가에 들어 있는 가방을 찾아서 내려야 된다고 했지? 난 여길 내려서 도망쳐야 하고."
10028030-46 = "열차를 멈추고. 내려야 된다는 부분에서 우리의 이해관계는 정확하게 일치하고 있잖아? 안 그래?"
10028030-50 = "음……. 그건 그렇슴다만……."
10028030-56 = "죄송하게도 카스미 씨와 저희 상황은 약간의 차이가 있는 것 같은데요."
10028030-57 = "저희는 쫓기는 몸도 아니고, 평범하게 화물칸에서 잘못 실린 가방을 되찾아 내리기만 하면 되거든요."
10028030-58 = "굳이 동행을 해야 할 필요까지는……."
10028030-59 = "어허~!! 사람이 말을 하면 끝까지 들어야지, 끝까지~."
10028030-60 = "물론 트리니티의 고상~한 아가씨가, 뿔 달린 게헨나의 나랑 엮이기 싫다는 것도 이해는 가지만~."
10028030-61 = "살다 보면 원하지 않는 일도 해야 할 때가 있는 법이에요. 안 그래?"
10028030-62 = "아가씨들이 귀여운 집에서만 살아가지고 아직 잘 모르는 모양인데~ 산다는 게 그리 단순하지가 않거든? 단순하지가."
10028030-66 = "하하하……."
10028030-67 = "그, 그렇군요. 네……. 그러면……. 카스미 씨."
10028030-68 = "어째서 저희가 함께해야 하는지……. 여쭤봐도 괜찮을까요?"
10028030-69 = "후후후. 그건 말이지~."
10028030-73 = "음? 안내 방송이……?"
10028030-74 = "……와아."
10028030-75 = "타이밍 좀 봐. 슬슬 할 거 같더니 딱 맞췄네~!"
10028030-79 = "……아, 아."
10028030-80 = "승객 여러분과 모든 승무원분들께, 열차 내 안내 방송 드립니다."
10028030-81 = "이송 중이던 화물의 일부가 폭발하는 사고가 발생하였습니다."
10028030-82 = "현재 승무원들이 수습을 위해 해당 열차 칸으로 이동 중이니, 승객 여러분께서는 객실 내 좌석에 착석하여 주시고,"
10028030-83 = "여러분의 안전을 위해, 이후로는 승무원의 지시에 따라 주시기 바랍니다."
10028030-84 = "또한 해당 화물은 위험물질인 관계로, 지금부터는 해당 물질을 처리할 수 있는 곳까지 열차가 직항으로 운행됩니다."
10028030-85 = "예정돼 있던 중간 정거장들을 생략하고, 게헨나 자치구 32-1구역의 종점에서 정차할 예정입니다."
10028030-86 = "승객 여러분의 양해를 부탁드립니다. 감사합니다."
10028030-91 = "……예?"
10028030-92 = "행선지 수정……이요? 이렇게 갑자기??"
10028030-93 = "[s3] \"뭔가 방송 내용이 이상한데……?\"\n[s4] \"실제 사실과 조금 다르지 않아?\""
10028030-99 = "……또한 지금부터 각 좌석 및 객차 간 이동은 전면 금지되며, 화장실 사용 또한 모두 금지됩니다."
10028030-100 = "긴급 상황이므로 모든 항의는 기각합니다. 좌석 이탈 시, 폭동으로 간주하고 가드가 투입됩니다. 지금까지 차장이었습니다."
10028030-101 = "[s5] \"……화장실도 가지 말라고!?\"\n[s6] \"이거 순 억지 아냐???\""
10028030-104 = "와하핫핫핫!!"
10028030-105 = "그렇지, 그렇지! 역시나 내 이럴 줄 알았다니까! 열차 녀석들도 바빠졌구만?"
10028030-106 = "조금 있으면 우르르 몰려오겠어, 아주? 이거 큰일인걸?"
10028030-107 = "……응? 대체 이 방송은 뭐냐고?"
10028030-108 = "화물의 일부가 폭발? 당연히 거짓말이지!! 선생님도 봤듯이!"
10028030-109 = "그렇지만 \"여러분 몰래 갱단에게 돈 받고 테러범을 이송 중이었는데, 탈출했으니 달릴게용~♪\"하고 방송할 순 없잖아?"
10028030-110 = "들어봐, 선생님. 일단 내가 있던 열차 맨 뒤 칸은 날 잡았던 갱단 놈들이 만든 특수 호송 차량이었어."
10028030-111 = "이 기차는 그런 걸 이 기차 맨 뒤에 달도록 허락해 준 거고 말이야."
10028030-112 = "그 커다란 걸 뭐 몰래 단 것도 아닐 테고, 그럼 그게 무슨 의미겠어? 응?"
10028030-113 = "[s7] \"이 열차가, 갱단이랑……!?\"\n[s8] \"설마 협력 관계라는 거야……?\""
10028030-116 = "와하핫!! 역시 선생님이야. 척하면 척이구만!"
10028030-117 = "결국 이 열차도 이 열차의 승무원 놈들도 전부 한통속인 거야, 그러니까 그런 호송 차량 같은 걸 뒤에 달게 놔둔 거지."
10028030-118 = "그런데 그게 공짜였을까? 그럴 리가?"
10028030-119 = "모르긴 몰라도 어마어마한 로비 자금이 들어갔겠지?"
10028030-120 = "그리고 그 와중에 그 호송 열차가 터지고, 안에 있던 내가 탈출을 했다?"
10028030-121 = "이제, 이건 뭐~. 그냥 넘어갈 수가 없구만~?"
10028030-122 = "더 이상 열차 쪽에서는 \"열차를 운행하는 일\"이 아니게 됐다고. 돈을 받았으면 돈값은 해야 한다~. 이 말이야!"
10028030-123 = "\"호송 중인 온천개발부 부장을 게헨나의 갱단 지부에 무사히 넘긴다\"가 녀석들의 목표."
10028030-124 = "그걸 위해선 수단과 방법을 가리지 않을 거야. 정거장 패싱? 이건 시작에 불과하지!"
10028030-125 = "이 열차에 이제 속력을 줄인다는 선택지는 없어. 그리고 나 또한 이 정도의 속도로 달리는 열차에서 뛰어내리는 건 무리가 있고."
10028030-126 = "지금 뛰어내리면 충격으로 한나절은 기절해 있어야 할 테니…… 그랬다간 그사이에 녀석들이 주워 갈 거거든."
10028030-127 = "그리고 그쪽 두 사람도……."
10028030-128 = "과연 괜찮을까? 이런 상황에서, 표도 없는 트리니티 학생이 협조라는 걸 받을 수 있을까?"
10028030-129 = "그 상태로 그 '가방'이라는 거……. 제때 찾을 수는 있겠어? 오늘 안에는 돌아가야 한다며?"
10028030-133 = "그래서 내가 말했잖아? 뭐든 당장 눈앞의 일들만 생각하지 말고 좀 더 멀리 봐야 하는 법이라고, 멀~리."
10028030-134 = "때로는 온실 밖으로도 좀 나가서 시원한 바깥 공기도 좀 쐬고 말이야! 와하핫핫!!"
10028030-135 = "……아하하하."
10028030-136 = "괜찮슴다. 일이 조금 꼬이긴 했지만, 네……. 뭐, 그래도 이정도는 어떻게든……."
10028030-137 = "살다 보면 이런 날도 있는 거겠……죠. 아하하."
10028030-138 = "살다 보면……."
10028030-143 = "저기다! 놈을 발견했다!!"
10028030-144 = "역시 패거리가 있었나!! 차내 병력을 모두 소집해!!"
10028030-148 = "……패거리?"
10028030-149 = "[ns] \"저희요?\""
10028030-150 = "여어~! 왔나~ 열차 친구들~!!"
10028030-151 = "아니, 잠깐만요. 저희는 이 사람과 일행이 아닌……."
10028030-152 = "여기 있는 놈들은 일단 모두 문답무용으로 끌고 가겠다!! 예외는 없다!!"
10028030-153 = "전원 돌입!!!"
10028030-154 = "이야~. 이거, 숫자가 꽤 되는데? 쉽지 않겠어~!"
10028030-155 = "이왕 이렇게 된 거, 같이 잘해보자고. 선생님!"
10028030-156 = "그리고……."
10028030-161 = "……'깜찍이 아가씨'!!"
10028030-165 = "……선생님……."
10028030-166 = "[s9] \"응. 지휘할 테니 부탁해, 이치카.\"\n[s10] \"그, 그래. 일단 상황부터 해결하자.\""
10028030-169 = "캬~! 극적인 거래 성립! 아주 드라마틱하구만! 훌륭해, 훌륭해!! 마음에 들어!!"
10028030-170 = "그럼, 잘 부탁한다고!! 나도 마냥……."
10028030-174 = "놀고만 있지는 않을 테니까 말이야! 와하하핫핫!!"
10028030-177 = "들어와! 다 들어와 이놈들아~!!"
