901010800110-18 = ""
901010800110-20 = "This is FOX 2, standing by at Point Whiskey."
901010800110-21 = "Confirming Tango 2's return after departing the designated point. Nothing new to note."
901010800110-22 = ""
901010800110-24 = ""
901010800110-25 = "...Why are they rolling a drum barrel in the middle of the night?"
901010800110-26 = "Don't tell me there are crabs or someone in there."
901010800110-27 = "Doesn't seem like it."
901010800110-28 = "After leaving the warehouse, they wandered the area, made no stops, and returned..."
901010800110-29 = "And the rolling sounded too light and even. If there were something in there, it would have sounded heavier."
901010800110-30 = "Unless this is some new strength training routine, they're up to something."
901010800110-32 = "FOX 3, can you lure the target to the back entrance?"
901010800110-33 = "No problem. I love playing tag."
901010800110-34 = "FOX 4, continue on-site monitoring. FOX 2, infiltrate the warehouse while the target is distracted."
