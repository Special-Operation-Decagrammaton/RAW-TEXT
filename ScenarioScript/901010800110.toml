[translation]
901010800110-7 = ""
901010800110-8 = "我回來了～"
901010800110-9 = "太久了吧。#n一個人守在這裡，我都快無聊死了。"
901010800110-10 = "抱歉抱歉。#n鐵桶比想像中還要重……搬運的過程花了點時間。"
901010800110-11 = "剛開始還沒掌握到訣竅的時候，光是要滾起來都很困難呢。"
901010800110-12 = "話說回來，推著空鐵桶在港口徘徊到底有什麼意義啊？"
901010800110-13 = "而且還叫我們趁人煙稀少的凌晨時段搬運……#n發出這麼吵的聲音，不是反而會被發現我們在搬鐵桶嗎？"
901010800110-14 = "上頭那些大人物在想什麼，我們怎麼可能懂？"
901010800110-15 = "我們這種底層人員，只要乖乖聽命令做事就好了。"
901010800110-16 = ""
901010800110-18 = ""
901010800110-20 = "這裡是FOX2。#n目前在Point Whisky待命中。"
901010800110-21 = "脫離指定地點的Tango2已確認歸位。#n除此之外沒有特殊狀況。"
901010800110-22 = ""
901010800110-24 = ""
901010800110-25 = "……那些傢伙在做什麼啊？大半夜的突然滾著鐵桶到處徘徊。"
901010800110-26 = "該不會……那個鐵桶裡面裝了螃蟹或是人吧？"
901010800110-27 = "看起來不像是那樣。"
901010800110-28 = "從倉庫出來之後沒有去任何地方，只在附近徘徊一段時間就直接回來了……"
901010800110-29 = "鐵桶滾動時發出的聲音很輕。#n要是裡面裝了東西，應該會發出更響亮或更沉重的聲音才對。"
901010800110-30 = "如果不是無緣無故想在半夜鍛鍊體力，想必是有什麼不可告人的陰謀吧。"
901010800110-32 = "FOX3，你可以把目標引誘到後門方向嗎？"
901010800110-33 = "交給我吧，追捕可是我的專長。"
901010800110-34 = "FOX4負責現場管制。#n接著FOX2趁目標注意力分散的空檔潛入倉庫內部。"
901010800110-36 = ""
901010800110-37 = "收到。"
901010800110-42 = ""
901010800110-43 = "這是什麼聲音？"
901010800110-44 = "是不是貓或烏鴉之類的動物跑進來了？"
901010800110-45 = "不對，我剛才明明有聽到腳步聲……"
901010800110-46 = "稍微去確認一下吧。"
901010800110-47 = ""
