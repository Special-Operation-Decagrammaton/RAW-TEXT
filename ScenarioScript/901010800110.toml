901010800110-43 = "เสียงอะไรน่ะ?"
901010800110-44 = "แมวหรืออีกาเข้ามาหรือเปล่า?"
901010800110-45 = "ไม่น่านะ เมื่อกี้ได้ยินเสียงฝีเท้าเต็มสองหูเลย..."
901010800110-46 = "ไปตรวจดูกันเถอะ"
