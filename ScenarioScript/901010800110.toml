[translation]
901010800110-8 = "다녀왔어~"
901010800110-9 = "늦었잖아. 혼자서 여기 앞을 지키느라 심심해 죽는 줄 알았다고."
901010800110-10 = "미안, 미안. 생각보다 드럼통이 무거워서…… 옮기는 데 시간이 좀 걸렸거든."
901010800110-11 = "확실히 요령이 없으면 그냥 굴리는 것도 꽤 어렵지. 처음에는."
901010800110-12 = "그런데 아무것도 안 든 드럼통을 굴리면서 항구를 배회하는 게 무슨 의미가 있는 거야?"
901010800110-13 = "게다가 인적이 드문 새벽 시간대에 드럼통을 옮기라면서, 이렇게 시끄러운 소리가 나면 우리가 드럼통을 운반하는 걸 다들 알아차리지 않을까?"
901010800110-14 = "높은 분들이 생각하는 일을 우리가 어떻게 알겠어?"
901010800110-15 = "우리 같은 말단은 그냥 시키는 말만 잘 들으면 되는 거야."
901010800110-20 = "여기는 FOX 2. 현재 포인트 위스키에서 대기 중."
901010800110-21 = "지정 포인트를 벗어났던 탱고 2의 복귀를 확인. 그 외 특이 사항은 없어."
901010800110-25 = "……저 녀석들 뭐 하는 거야? 갑자기 밤 중에 드럼통을 굴리고 다니다니."
901010800110-26 = "설마, 저 드럼통 안에 게나 사람이 들어 있는 건 아니겠지?"
901010800110-27 = "그렇게 보이지는 않는데."
901010800110-28 = "창고에서 나온 뒤 어디에도 들르지 않고 주변을 배회하다 곧장 돌아왔고—"
901010800110-29 = "드럼통이 구르면서 내는 소리가 너무 가벼워. 안에 뭔가 들어 있었다면 더 요란하거나 묵직한 소리가 났을 거야."
901010800110-30 = "쓸데없이 한밤중에 체력 단련을 하려는 게 아니라면, 뭔가 꿍꿍이가 있는 거겠지."
901010800110-32 = "FOX 3, 목표를 후문 방향으로 유인할 수 있겠나?"
901010800110-33 = "맡겨만 줘. 술래 역할이라면 내 전문이지."
901010800110-34 = "FOX 4는 현장 관제를. 그리고 FOX 2는 목표의 주의가 흐트러진 틈을 타 창고 내부로 진입하도록."
901010800110-37 = "확인."
901010800110-43 = "이게 무슨 소리지?"
901010800110-44 = "고양이나 까마귀 같은 동물이 들어온 거 아냐?"
901010800110-45 = "아니, 분명 발자국 소리가 들렸는데……"
901010800110-46 = "잠깐 확인해보자."
