[translation]
901010800110-7 = ""
901010800110-8 = "กลับมาแล้ว~"
901010800110-9 = "มาช้าจัง ฉันเฝ้าหน้าทางเข้าคนเดียวจนเบื่อจะตายอยู่แล้ว"
901010800110-10 = "โทษทีๆ ถังเหล็กหนักกว่าที่คิดน่ะ... ก็เลยใช้เวลาขนย้ายนานหน่อย"
901010800110-11 = "ก็จริงนะ ถ้าไม่รู้เทคนิค แค่กลิ้งมันเฉยๆ ก็ยากแล้ว โดยเฉพาะในตอนแรกน่ะนะ"
901010800110-12 = "แต่การกลิ้งถังเหล็กเปล่าเดินวนรอบๆ ท่าเรือ มันมีความหมายอะไรเหรอ?"
901010800110-13 = "สั่งให้ขนถังเหล็กตอนเช้ามืดที่ไม่ค่อยมีคนแท้ๆ แต่ถ้าเสียงดังขนาดนี้ คนอื่นก็รู้กันหมดน่ะสิว่าเรา#nกำลังขนถังเหล็กอยู่?"
901010800110-14 = "พวกเราจะไปรู้ได้ยังไงล่ะ ว่าพวกผู้บริหารคิดอะไรกันอยู่"
901010800110-15 = "พนักงานระดับล่างอย่างพวกเรา แค่ทำตามคำสั่งให้ดีก็พอ"
901010800110-16 = ""
901010800110-18 = ""
901010800110-20 = "FOX 2 รายงาน ฉันกำลังสแตนด์บายอยู่ที่จุดวิสกี้"
901010800110-21 = "ยืนยันว่าแทงโก้ 2 ที่ออกไปจากจุดที่กำหนดกลับมาแล้ว ไม่มีสิ่งผิดปกติอื่น"
901010800110-22 = ""
901010800110-24 = ""
901010800110-25 = "พวกนั้นทำอะไรกันน่ะ...? จู่ๆ ก็มากลิ้งถังเหล็กกลางดึกเนี่ยนะ"
901010800110-26 = "หรือว่าในถังเหล็กนั่นจะมีปูหรือคนอยู่ข้างใน?"
901010800110-27 = "ดูไม่เหมือนอย่างนั้นนะ"
901010800110-28 = "หลังออกมาจากโกดัง พวกนั้นก็ไม่ได้แวะที่ไหน เดินวนอยู่แถวนี้แล้วก็กลับทันที..."
901010800110-29 = "เสียงถังเหล็กตอนกลิ้งมันเบาเกินไป ถ้ามีอะไรอยู่ข้างใน เสียงน่าจะดังหรือหนักกว่านี้"
901010800110-30 = "ถ้าไม่ใช่การฝึกฝนร่างกายกลางดึกแบบไร้สาระ ก็คงมีแผนอะไรซ่อนอยู่แน่"
901010800110-32 = "FOX 3 ช่วยล่อเป้าหมายไปทางประตูหลังได้มั้ย?"
901010800110-33 = "วางใจฉันได้เลย ถ้าเป็นบทตัวล่อ งานถนัดฉันอยู่แล้ว"
901010800110-34 = "ให้ FOX 4 คอยควบคุมสถานการณ์ ส่วน FOX 2 ให้ฉวยจังหวะที่เป้าหมายเผลอ แล้วเข้าไปด้านในโกดัง"
901010800110-36 = ""
901010800110-37 = "รับทราบ"
