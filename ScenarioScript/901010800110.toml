901010800110-8 = "I'm back."
901010800110-9 = "You're late. I thought I was going to die of boredom out here."
901010800110-10 = "Yeah, sorry. The drum barrel was heavier than I expected... It took a while."
901010800110-11 = "I know what you mean. You have to balance it just right to get it rolling."
901010800110-12 = "By the way, what is even the point of us rolling that empty drum barrel around?"
901010800110-13 = "They tell us to roll these big, dumb drum barrels in the middle of the night, all over the empty port. Maybe they're trying to be polite? But the rolling is so loud that I'm sure everyone hears it!"
901010800110-14 = "There's no point in trying to figure out what the higher-ups are thinking."
901010800110-15 = "We just need to keep our heads down and follow orders."
