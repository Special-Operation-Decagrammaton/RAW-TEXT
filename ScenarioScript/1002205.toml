[translation]
1002205-1 = "히나와 함께 여름의 풍경을"
1002205-2 = "히나의 숙소"
1002205-4 = "후우……. 이걸로 오늘 해야 할 업무는 다 마무리된 거겠지?"
1002205-5 = "하아……."
1002205-6 = "너무 일찍 일어나서 그런 걸까…… 오후 약속에 나가기 전에 잠시 쉬어두는 편이 좋겠어……."
1002205-7 = "괜히 무리했다가, 또 그 사람을 곤란하게 만들 수는 없으니까……."
1002205-8 = "아주 조금만, 눈을 붙이면……."
1002205-20 = "(으, 으응…….)"
1002205-21 = "(으음……? 응? 나……. 얼마나…… 잔 거지?)"
1002205-22 = "(몸이 무거워…… 피로가 쌓인 걸까……. 그보다…….)"
1002205-23 = "(으읏, 으…… 하아……. 뭔가 잊고 있는 것 같은 느낌…….)"
1002205-24 = "(지금 시간이……?)"
1002205-25 = "(오후…… 6시……?)"
1002205-27 = "(분명……. 점심은 이미 지나버렸……. 아……!)"
1002205-29 = "잠깐……. 너무 늦게까지 자버렸어……!"
1002205-30 = "[s] \"히나. 잘 잤어?\""
1002205-31 = "……응?"
1002205-32 = "아……?"
1002205-33 = "……!?"
1002205-34 = "서, 선생?! 어째서 선생이. 지금, 이곳에?!"
1002205-35 = "잠깐, 그보다 어째서 깨우지 않은 거야……? 시간이 벌써……."
1002205-36 = "[s1] \"히나가 엄청 곤히 자고 있길래.\"\n[s2] \"깨우기가 미안해서.\""
1002205-37 = "선생……."
1002205-38 = "선생……."
1002205-39 = "하, 하지만 이러면……."
1002205-40 = "오늘 약속은……. 같이 놀았으면 하고 연락했던 건 내 쪽인데……."
1002205-41 = "하아……. 미안……."
1002205-42 = "……모처럼 바다에 함께 가자고, 약속까지 했는데, 내가 전부 망쳐버렸어……."
1002205-43 = "이래서야 선생을 볼 낯이 있을 리가……."
1002205-44 = "응……?"
1002205-45 = "일찍 일어나서 일 하느라 피로가 쌓였던 거 아니냐고?"
1002205-46 = "그건……. 확실히 그럴지도 몰라……. 최근 업무가 많았던 건 사실이고, 오늘은 특히 일찍 일어났던 탓도 있으니까……."
1002205-47 = "하지만."
1002205-48 = "그거랑 이건 별개야. 이번 일은 어디까지나 스스로 컨디션 조절에 실패해서 벌어진 실수니까."
1002205-49 = "핑계로 댈 만큼의 이유는 되지 않아."
1002205-50 = "미안해, 선생님. 이미 바다에 가기엔 늦은 시간이고. ……나 때문에 당신의 시간을 낭비시키기만 하고……."
1002205-51 = "이래서야……."
1002205-58 = "으응, 잠깐, 선생……?"
1002205-59 = "가, 갑자기 그렇게 손을 잡고 어쩌려고……."
1002205-60 = "[s] \"바닷가는 멀리 있지 않아.\""
1002205-61 = "멀리 있지 않다니……."
1002205-62 = "아…… 그러고보니 이 호텔 테라스에서도 바다가 내려다보인다……고 지배인이 말했었지."
1002205-63 = "합숙 훈련에는 필요가 없는 곳이라서 출입금지를 시켜뒀지만……."
1002205-64 = "[s3] \"가자!\"\n[s4] \"거기서 보는 바다, 분명 이쁠 거야.\""
1002205-65 = "……정말? 정말 그런 걸로 괜찮은 거야?"
1002205-66 = "……정말? 정말 그런 걸로 괜찮은 거야?"
1002205-67 = "…………."
1002205-68 = "그래……."
1002205-69 = "그러고 보면, 응. 선생은 늘 이런 식이었지……. 이런 것만으로도 충분하다니."
1002205-70 = "당신이 그렇게 말한다면 그런 것도 나쁘지 않을지도 모르겠어……."
1002205-71 = "그럼, 어디……"
1002205-75 = "아아……."
1002205-76 = "엣, 츄……!"
1002205-77 = "으, 응? 뭐, 뭘 그렇게 신기하다는 듯이 바, 바라보는 거야?"
1002205-78 = "지금 건 그냥……. 방금 막 잠자리에서 일어나서 그런 거니까."
1002205-85 = "이건…… 가디건? 일부러 챙겨와 준 거야?"
1002205-86 = "……으응, 그래."
1002205-87 = "(언제나, 당신은 이런 식으로 배려해주곤 했었지…….)"
1002205-88 = "고마워. 그럼, 사양하지 않고 잘 쓸게."
1002205-89 = "그럼 어디, 당신이 자신 있게 예쁘다고 말한 바다의 풍경, 같이 보러갈까?"
1002205-95 = "[wa:500]― 어째서 모두들,[wa:1450] 그렇게나 바다를 좋아하는 걸까……[wa:1800]라고,"
1002205-97 = "― 쭉 생각해왔어. [wa:250]"
1002205-100 = "[wa:150]― 다들 즐거워 보이지만……"
1002205-102 = "― 난 [wa:550]아무래도 좋아지지가 않아서……."
1002205-105 = "[wa:500]― 물속은[wa:1300] 제대로 보이지도 않고,[wa:1850] 발도 바닥에 닿지 않으면[wa:1150] 불안하고……."
1002205-107 = "― 선생도,[wa:1000] 그런 생각 해본 적 없어?"
1002205-110 = "[wa:500]― 특히[wa:1350] 밤바다라는 건,[wa:1900] 꼭[wa:550] 새카만 우물 같은 게 으스스해서……"
1002205-112 = "― 보고 있으면[wa:1250] 빨려들어갈 것만 같아,[wa:2250] 도저히[wa:500] 좋아할 수 없었는데……."
1002205-115 = "[wa:500]― 하지만…… [wa:2900]이제는, [wa:1750]모두의 기분을[wa:1850] 조금은 알 것 같아."
1002205-117 = "[wa:100]― 바다라는 건[wa:1650] 이렇게 예쁜 거였구나."
1002205-120 = "[wa:500]― 신기해…….[wa:2250] 지금까지,[wa:1000] 이런 식으로 생각 해본 적 없었는데."
1002205-123 = "― 고마워, 선생님.[wa:2400] 함께 있어줘서……"
1002205-125 = "[wa:200]― 여러 가지를,[wa:900] 가르쳐주어서."
1002205-128 = "(그렇게 둘이서 함께 불이 꺼질 때까지 반짝이는 초저녁의 바다를 바라보았다.)"
