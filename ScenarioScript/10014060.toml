10014060-5 = "싫어하는 이야기를 하러 왔다고? 그게 무슨 소리야?"
10014060-6 = "그거 혹시……."
10014060-12 = "……?"
10014060-13 = "……선생님. 이건……."
10014060-14 = "[s1] \"응. 카즈사가 생각하는 대로야.\"\n[s2] \"더는 귀찮게 하지 않겠대.\""
10014060-15 = "……어어……. 그래?"
10014060-16 = "……어어……. 그래?"
10014060-17 = "의외네……? 어째……. 생각보다 일이 잘 풀렸……다?"
10014060-18 = "그럼 이제 끝이야? 더 이상은 도전장 던지고……. 막 덤비고 그러지 않는다는 거지? 그렇지?"
10014060-19 = "…………."
10014060-20 = "뭐, 뭐어- 그렇지! 그래! 녀석도 이제 나이가 몇인데, 언제까지 그런 분위기로만 지낼 수도 없잖아?"
10014060-21 = "때가 되면 그만두는 것도 생기고, 잊을 일들도 생기고 하는 거겠지. 응. 그치?"
10014060-22 = "하하하! 이제야 나도 좀 두 다리 뻗고 잘 수 있겠네. 휴우. 잘됐다, 잘됐어."
10014060-23 = "……."
