10014060-25 = "……저기."
10014060-26 = "선생님. 그……."
10014060-27 = "혹시 말이야……. 진짜 혹시나 해서 하는 말인데……."
10014060-28 = "괜찮으면 한 가지, 뭐 좀 물어봐도 될까?"
10014060-29 = "이거 말이야, 이 도전장……."
10014060-30 = "굳이 지금처럼……. 이 늦은 시간에……. 바로 보여줘야 할 이유가…… 있었어?"
10014060-34 = "……선생님?"
10014060-35 = "[s3] \"카즈사는 역시 눈치가 빠르네.\"\n[s4] \"응. 그렇게 물어볼 것 같았어.\""
