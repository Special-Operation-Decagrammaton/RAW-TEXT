10014060-48 = "전에 말한 적이 있던가? 나는 그……. 정말이지……."
10014060-49 = "……말 많고 시끄러운 녀석들이…… 싫어."
10014060-50 = "옆에 있으면 귀가 아프고 짜증 나는 주제에, 막상 없어지고 나면 신경 쓰이게 하거든."
10014060-51 = "그런 애들일수록 왠지 너무 센 말만 골라 쓰고……. 그래서 더 약해 보이기도 하고……."
10014060-52 = "아무튼 정말 나랑은 성향이 영 안 맞아. 그래서 그런 애들이랑은 늘 사이가 안 좋나 봐."
10014060-53 = "예전에도 그랬고, 지금도 그렇고……."
10014060-54 = "……어쩌면 앞으로도 쭉…… 말이지."
10014060-55 = "……응. 그러네."
10014060-56 = "어차피 계속 그렇겠지. 이러고 살 수밖에 없는 팔자일지도."
10014060-60 = "…………."
10014060-61 = "……그래서."
10014060-63 = "……우자와 지금 어딨어."
