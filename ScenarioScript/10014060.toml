10014060-1 = "제6화;말 많고 시끄러운 녀석은 싫어"
10014060-2 = "……선생님? 무슨 일이야? 이렇게 늦은 밤에 사람을 다 불러내고."
10014060-3 = "혹시 또 상담이라든가……."
