[translation]
10039060-1 = "제6화;정상결전"
10039060-11 = "……방금 봤어? 오토바이 역주행……?"
10039060-12 = "응……. 굉장한 속도……."
10039060-13 = "……멋있다……."
10039060-14 = " ……저기, 그런데 있잖아. 방금 그 오토바이."
10039060-15 = "타고 있던 사람……. 복장이……."
10039060-16 = "어어…… 나도 봤어."
10039060-20 = "시스터 님……이었지……?"
10039060-23 = "(서둘러 달려왔기에 마리가 알려준 장소에는 때맞춰 도착할 수 있었다.)"
10039060-24 = "선생님-!!"
10039060-29 = "[ns1] \"마리……?\"\n[ns2] \"진짜 오토바이를 타고 있잖아…….\""
10039060-35 = "갑작스레 불러내서 죄송해요, 선생님! 하지만 워낙 다급한 일이라……!"
10039060-36 = "괘, 괜찮으시다면……. 함께 가 주실 수 있을까요? 트리니티 광장까지 모시도록 하겠습니다!"
10039060-37 = "선생님이 자리에 계신다면 만일의 사태도 막을 수 있을 거라……."
10039060-38 = "[s3] \"설명은 나중에. 급한 듯하니 우선 가자!\"\n[s4] 일단 오토바이 뒷좌석에 탄다."
10039060-41 = "……!!"
10039060-42 = "……출발하겠습니다! 꽉 잡아주세요!!"
10039060-50 = "뭐야, 뭐야. 무슨 일이야? 뭔데 이렇게 사람이 많아?"
10039060-51 = "못 들은 거야? 조금 있으면 여기서 결투를 한대잖아, 동아리의 통합을 걸고!"
10039060-52 = "진짜……!? 이것도 뭔가의 이벤트 같은 건가? 근데 왜 하필 오늘이야? 한창 학원제 중이잖아?"
10039060-53 = "오히려 그런 날이니까…… 일수도 있지. 모두의 앞에서 공표한다는 느낌으로."
10039060-54 = "으, 으음……? 이건 또 무슨 일일까요……."
10039060-55 = "갑자기 결투라니, 이런 이야기는 들은 적도 없는데……!?"
10039060-56 = "하지만 일리가 있는 이야기야. 통합 조직의 지도자를 선출하기에, 이보다 적합한 시기도 없지."
10039060-57 = "게다가 결투라니……. 가장 확실하고 뒷말 없는 방법이다."
10039060-58 = "무슨 소릴 하는 거야!? 말이 안 되잖아, 말이! 이런 건 이상해! 뭔가 잘못됐다고!!"
10039060-60 = "확실히……."
10039060-61 = "뭐, 그 사람들이라면 별것 아닌 일도 이정도로 크게 키울 수 있긴 하겠네요."
10039060-62 = "아니면 훨씬 더 바보 같은 상황이라거나……."
10039060-63 = "……후훗. 일단 재미있어 보이니, 조금 더 이대로 구경하는 것도 나쁘지 않아 보여요."
10039060-64 = "재, 재미있어 보인다니……."
10039060-66 = "뭐, 뭐야 대체……. 이런 이야기는 들은 적도 없다고."
10039060-67 = "정말인가? 사쿠라코 님께는 연락해 봤어?"
10039060-68 = "여, 연락은 아까부터 계속 시도하고 있어. 어째서인지 받지 않고 계시지만……."
10039060-69 = "전화는 아예 안 되고, 메시지를 보내도 답장이 없으셔. 의도적으로 안 받으시는 것 같아."
10039060-70 = "어째서……. 진짜 무슨 일 있는 거 아냐, 이거!?"
10039060-71 = "어쩌면 다른 일부 인원들에게만 떨어진 비밀 지령 같은 게 있을 수도 있겠지."
10039060-72 = "사쿠라코 님의 일이니까, 우리가 하나하나 다 인지할 수는 없잖아."
10039060-73 = "그렇지만 만약……."
10039060-74 = "만약 이게 진짜라면……. 그리고 사쿠라코 님과 미네 단장이 붙는다면……."
10039060-75 = "그런 식의 싸움으로는 승산이 없잖아!? 상대는 그 미네 단장이라고!!"
10039060-76 = "그, 그렇지. 그러니까……."
10039060-77 = "어쩌면 우리가, 뭔가 다른 공작을 준비해야 할지도……."
10039060-78 = "……!!"
10039060-80 = "뭐, 뭔가 일이 이상하게 돌아가네요?"
10039060-81 = "결투라니……. 미네 단장님이 그런 말씀을 하신 적이 있던가요?"
10039060-82 = "글쎄요. 저도 처음 듣는 이야기인데……."
10039060-83 = "뭔가 익숙한 상황인 것 같기도 하지만, 아무리 단장님이라도 이건 뭔가 이상해요."
10039060-84 = "어딘가에서 오해가 발생한 게 아닌가 싶은데……."
10039060-91 = "으, 으아아……! 지, 진정하세요. 진정하세요 기사단 분들!!"
10039060-92 = "싸우는 게 아닙니다. 저희는 지금 싸우러 모인 게 아니에요! 모두 진정을……!!"
10039060-96 = "……? 음?"
10039060-97 = "어라, 저분들은……."
10039060-102 = "……티……."
10039060-103 = "……티파티의……. 나기사 님……!?"
10039060-110 = "저, 저기…… 나기 쨩……?"
10039060-111 = "이거 맞아? 진짜 이거 맞는 거야? 아무리 생각해도 뭔가 이상한데……."
10039060-112 = "걔네들이 아무리 그래도 이런 날 이런 데에서 그런 싸움을 할 리가 없잖아. 뭔가 이야기가 잘못 퍼진 거겠지."
10039060-113 = "괜히 우리까지 여기 와 있으면 분위기가 더 이상해질 수도 있다고. 다시 한번만 생각해 보자, 응? 나기 쨩……?"
10039060-115 = "……미카 씨."
10039060-116 = "티파티는 언제나 만일의 사태에 대비하여야 합니다. 그리고 현재의 정황은 그 만일의 사태를 점점 더 또렷하게 그리고 있죠."
10039060-117 = "미카 씨는 저기 모인 시스터후드와 구호기사단의 병력들이 보이지 않는 겁니까?"
10039060-118 = "깨끗한 결투인 척하지만, 결국 수가 틀어지면 힘으로 엎으려는 플랜B일게 불 보듯 훤하지 않습니까."
10039060-119 = "이건 자칫 트리니티의 내전으로 이어질 수 있는 중대 사안입니다."
10039060-120 = "미카 씨의 말 대로, 이렇게 뜻깊은 날 그런 상황이 발생하는 것 자체가 티파티의 호스트로서 용납할 수 없는 일."
10039060-121 = "여차하면, 여기서는 미카 씨가……."
10039060-127 = "……나, 나!?"
10039060-128 = "뭐야!? 설마 내가 나가는 거야……?"
10039060-129 = "나기 쨩!? 진짜 나 싸우라는 거야!? 그런 이유로 데려온 거였어!?"
10039060-130 = "전부 트리니티 종합학원의 평화를 위해서입니다! 당신은 티파티의 무력이잖습니까!!"
10039060-131 = "아니, 아니! 아니아니아니!!!"
10039060-132 = "싫거든, 완전 싫거든, 이런 거!? 생각도 못 했거든!? 나 애초에 지금은 그런 위치도 아니고!?"
10039060-133 = "미쳤나봐, 진짜!! 제발, 나기 쨩!? 제발 정신 차려! 응!?"
10039060-134 = "안 되겠다, 이건 지금이라도 선생님한테 연락을 해서……!!!"
10039060-140 = "……."
10039060-141 = "……마침내 오셨군요, 사건의 당사자분들."
10039060-148 = "……늦지 않게 오셨군요, 사쿠라코 님."
10039060-149 = "생각은 다 되셨는지요? 시간이 부족하지는 않으셨는지?"
10039060-150 = "당연하죠. 이런 중대한 사안에 늦는다니, 있을 수 없는 일 아니겠습니까. 미네 단장님."
10039060-151 = "저희들의 새로운 지도자를 결정하는……."
10039060-153 = "이 중대한 자리에 말이죠."
10039060-159 = "그나저나 이상하군요. 평소보다 훨씬 많은 사람들이 모여 있어요."
10039060-160 = "시스터후드……자매님들도 많이 계신 것 같고 말이죠."
10039060-161 = "그렇군요. 확실히, 구호기사단 단원분들도 많이 계시네요. 무슨 일이 있는 걸까요?"
10039060-162 = "한 번 상황을 여쭤보는 것도……."
10039060-163 = "……설마설마했는데, 사실이었을 줄이야."
10039060-168 = "제 생각보다 훨씬 대담한 면들이 있으시군요, 시스터후드와 구호기사단의 두 분."
10039060-170 = "……티파티의 호스트……? 나기사 씨?"
10039060-171 = "학원제 운영 관리 업무에 한창이셔야 할 분께서, 어쩌다 이런 자리까지……?"
10039060-173 = "놀랍군요. 이 상황까지 되어서도 시치미를 떼시는 건가요? 아니면 저를 바보로 아시는 겁니까?"
10039060-175 = "……?"
10039060-176 = "……? 뭐라고요?"
10039060-178 = "티파티의 호스트로서, 정식으로 두 분께서 이곳에 있는 연유를 묻겠습니다."
10039060-179 = "어째서 지금 이 자리에 모이신 거죠? 즉시 대답해 주십시오."
10039060-180 = "……지금 그건, 분명 \"티파티의 호스트로서\" 여쭤보신 겁니까? 축제 운영위원회장이 아니라?"
10039060-181 = "……? 그렇습니다만, 무슨 문제라도 있습니까?"
10039060-182 = "……아뇨. 아닙니다."
10039060-183 = "그렇군요. 알겠습니다. 그러시다면, 답변드리도록 하죠."
10039060-187 = "\"그쪽과는 관계없는 이야기입니다. 티파티의 호스트, 키리후지 나기사 님.\""
10039060-188 = "…………."
10039060-189 = "…………!!!"
10039060-190 = "……미카 씨!"
10039060-191 = "아, 아니. 나기 쨩. 잠깐만! 이상하다니까!? 이거 진짜 아닌 거 같다고!!"
10039060-192 = "일단 조금만 더 이야기를……."
10039060-193 = "미카!!"
10039060-194 = "아아아아~!! 제발, 나기 쨩!"
10039060-195 = "으으……!! 나, 난 몰라……!! 어떻게 돼도 모르니까!!"
10039060-201 = "……뭐죠?"
10039060-202 = "지금 장전하신 겁니까? 이런 백주 대낮에, 광장 한가운데에서 모두가 보는데?"
10039060-203 = "정말로 이성을 잃어버리기라도 한 겁니까, 티파티!!"
10039060-204 = "좋습니다! 잘은 모르겠지만, 그 의사 받아드리죠!"
10039060-205 = "준비하십시오, 사쿠라코 님. 마침 다른 부원들도 와 계시는군요!"
10039060-207 = "……예? 예예!? 저요?"
10039060-208 = "어서!!"
10039060-209 = "그, 그……!? 네!? 으에에에……!?"
10039060-210 = "??? 뭐, 뭐죠? 왜 갑자기 이런 흐름이 되는 건가요?"
10039060-211 = "과연! 이 상황을 유도하셨던 거군요, 사쿠라코님!!"
10039060-212 = "총원 전투준비-!!!"
10039060-219 = "단원 전체 전투태세로-!!"
10039060-220 = "으에에에에에-!?!?"
10039060-227 = "이건 명백한 쿠데타입니다!!"
10039060-228 = "아뇨! 이건 알 수 없는 폭정에 대한 저항입니다!!"
10039060-229 = "왜 제 주변에는 이런 일만 생기는 건가요!?"
10039060-230 = "난 몰라아아아아~~~!!!"
10039060-232 = "[log=마리]\"잠깐만요!!!\"[/log]"
10039060-245 = "여러분……!!"
10039060-250 = "모두……."
10039060-251 = "싸움을, 멈춰 주세요!!"
