[translation]
1010405-1 = "Enter the……"
1010405-2 = "현무상회 본점"
1010405-4 = "뭐냐, 현무상회는! 현룡문의 감찰관이 직접 시찰을 나왔는데, 차 한잔 대접하지 않는 거냐!"
1010405-5 = "아니면 예전처럼 현룡문의 감찰관을 함정에 빠뜨리려는 것은 아니겠지?"
1010405-6 = "또 그 비슷한 일이 일어났다가는…… 이번에야말로 따끔한 맛을 보여 줄 수밖에 없을 테니까!"
1010405-9 = "……일단, 예전의 그 불미스러운 일에 대해서는 진심으로 사과를 드리겠습니다."
1010405-10 = "그리고 차를 대접하는 것은 큰 문제가 아닙니다만, 괜찮으시겠습니까?"
1010405-11 = "뭐가 말이지?"
1010405-12 = "차를 끓이려면, 위생관리평가 준비를 마쳐 둔 조리 도구를 사용해야 할 테니 말이죠."
1010405-13 = "그렇게 되면 처음부터 감찰을 다시 시작하거나, 차라리 다른 날을 정해서 재감찰을 해야 하지 않을까요?"
1010405-14 = "……!"
1010405-15 = "조, 좋아. 어차피 일정이 바쁘니, 구태여 차에 연연할 필요는 애초에 없었겠지……."
1010405-16 = "그 대신 현무상회의 민낯을 속속들이 까발려 줄 테니 말이지!"
1010405-20 = "[ns] \"어…… 이거, 위험한 거 아냐. 레이죠……?\""
1010405-21 = "트집입니다, 트집."
1010405-22 = "어차피 무슨 소리를 해도, 말꼬리를 잡고 늘어질 게 뻔하니까요."
1010405-23 = "우선 개인위생관리 상태를 점검하겠다! 손을 내밀어 보도록!"
1010405-24 = "여기 있습니다. 여러분들도."
1010405-28 = "……알겠습니다. 얼마든지 보십시오."
1010405-30 = "……깨끗하기는 하군. 손톱도 잘 깎여 있고."
1010405-31 = "요리 장갑도 준비되어 있고, 오염 분리도 이루어지고 있는 듯하고……. 칫."
1010405-32 = "맞아. 뒷문을 열어 두고 있다거나 하는 건 아니겠지!"
1010405-33 = "덥다고 함부로 문을 열어 두면, 벌레가 들어온다거나 바깥의 좋지 않은 냄새가 따라 들어올 수도 있으니 말이야!"
1010405-35 = "그 문제를 방지하기 위해 저희 현무상회에서는 주방마다 충분한 규모의 공기 순환 시스템을 설치해 두었습니다."
1010405-36 = "이렇게 시스템을 가동시키면……."
1010405-41 = "누, 누가 여기에서 그걸 가동시키라고 했어! 머리가 다 헝클어졌잖아!"
1010405-42 = "감찰에 신뢰와 확인은 중요한 문제니까요."
1010405-43 = "……좋아. 다음으로는 주방 도구와 시설물의 청결 관리 상태다!"
1010405-45 = "식재료의 유통기한은……!"
1010405-47 = "교차 오염 관리……!"
1010405-49 = "다, 담배라든가 주류 같은 비위생적인……!"
1010405-50 = "[s] \"아니, 학생이 그런 걸 할 리가…….\""
1010405-52 = "(어째서…… 다 괜찮은 거지?!)"
1010405-53 = "다 확인하셨습니까? 스스로 말씀드리는 것도 조금 그렇기는 합니다만."
1010405-54 = "특별히 문제 될 일은, 없었을 것 같은데요."
1010405-55 = "에잇! 아직이다! 현룡문의 감찰은 이 정도로 끝나지 않아!"
1010405-56 = "우선은…… 그렇지! 내가 지금 생각하고 있는 음식 메뉴를 맞혀 봐라!"
1010405-57 = "네?"
1010405-58 = "[s] \"억지 아냐?!\""
1010405-59 = "그 정도도 해내지 못해서야 뭐가 접객이냐!"
1010405-60 = "손님이 무엇을 원하고 어떤 선택을 내릴 것인지, 미리 아울러 짐작하고 대접할 수 있어야 진정으로 손님을 감동시킬 수 있을 터인데!"
1010405-61 = "……."
1010405-62 = "그리고! 어째서 식당 정문에 현룡문의 문양이 설치되어 있지 않지?"
1010405-63 = "이것은 그것인가? 현룡문에 대한 반항심을 표출하려는 것이겠지?"
1010405-64 = "돌아가자마자 현무상회가 언제나처럼 현룡문에 대한, 나아가 산해경에 대한 역심(逆心)을 품고 있다고 보고해야겠어!"
1010405-65 = "……들어주십시오. 이곳은 현무상회 거리이며, 저희는 어디까지나 그 상징으로서–"
1010405-66 = "변명 같은 건 듣고 싶지 않다고! 중요한 것은 현무상회에게 진정한 접객을 하려는 마음가짐이 존재하는지!"
1010405-67 = "그리고 산해경의 전통과 문화를 이어 나가려는 의지가 있는지를 확인하는 것이니까!"
1010405-68 = "일단은, 오늘 현룡문이 현무상회를 방문한 목적은, 위생 감찰을 위한 것이 아니었습니까?"
1010405-69 = "아직도 모르는 거냐고! 그게 위생 같은 것보다 더 중요하단 말이야!"
1010405-73 = "선생님. 이럴 때는 어떻게 해야 할까요……?"
1010405-74 = "[s] \"어…… 그, 그래. 쿵후야!\""
1010405-75 = "쿠, 쿵후 말씀이십니까?"
1010405-76 = "[s] \"쿵후에서 얻은 교훈을, 떠올려 보는 거야!\""
1010405-81 = "(쿵후의 교훈…….)"
1010405-85 = "('생각하지 마라. 느끼는 거다.' 분명히, 그런 말이 있었죠.)"
1010405-86 = "(지금 나에게 느껴지는 감정, 그것은…….)"
1010405-87 = "(극도의 부당함과…… 분노!)"
1010405-88 = "(그렇지만 분노만으로는 문제를 해결할 수 없습니다.)"
1010405-89 = "(그렇다면, 분노를 무엇으로 뛰어넘을 수 있을까요.)"
1010405-90 = "(그것은…… 더 큰 분노!)"
1010405-92 = "잘 알았습니다. 확실히, 이렇게 엉망인 상회에서 만들고 유통시키는 음식은, 산해경에서 취급되어서는 안 되겠군요."
1010405-93 = "[s] \"레이죠?!\""
1010405-94 = "흐, 흥! 뭐야. 이제서야 주제를 깨달은 거냐?"
1010405-95 = "그렇고말고요. 그러므로 이제부터 저희 현무상회는……."
1010405-96 = "어떤 간식도, 현룡문에게 납품하지 않는 것으로 하겠습니다."
1010405-97 = "뭐, 뭐라고?!?!"
1010405-98 = "특히 산해경…… 현룡문에서 암암리에 인기 있는 것으로 아는 과일 젤리, 인절미 과자, 초콜릿 크림 쿠키 같은 것들은……."
1010405-99 = "절대로! 무슨 일이 있어도! 두 번 다시 유통하지 않겠습니다!"
1010405-100 = "잠깐만! 그러면…… 그랬다가는……!"
1010405-101 = "왜 그렇게 당황하십니까? 이렇게 산해경의 전통과 문화를 지킬 생각도 없고, 진정한 접객을 하려는 마음가짐도 가지고 있지 않은 현무상회가."
1010405-102 = "그런 품목들을 함부로 취급하고 유통시키는 것도, 어딘가 이상하지 않겠습니까?"
1010405-103 = "특히 오늘의 감찰 결과를 적극적으로 고려한다면 말이지요."
1010405-104 = "그렇지 않습니까. 감찰관?"
1010405-105 = "기, 기다려! 조금만 기다려 달라고!!!"
1010405-108 = "(결국 감찰관은 레이죠에게 엎드리다시피 싹싹 빌어야 했다…….)"
1010405-110 = "이런저런 일이 있었지만, 어쨌든 감찰일을 무사히 넘기게 되었군요."
1010405-111 = "역시, 쿵후의 교훈은 도움이 되는 것 같습니다! 그렇지 않습니까, 선생님?"
1010405-113 = "(맑은 미소를 지으며, 힘차고 개운하게 이야기하는 레이죠에게.)"
1010405-114 = "(작은 한숨을 내쉬며 고개를 끄덕이는 것밖에…… 달리 할 수 있는 일은 없었다.)"
