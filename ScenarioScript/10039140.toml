[translation]
10039140-1 = "후일담;우리도 학생이야!"
10039140-4 = "(축제가 한창일 때, 한쪽 거리에 유난히 사람이 없는 것을 발견했다.)"
10039140-5 = "[ns] \"저긴 아트센터 쪽인데……\""
10039140-12 = "으으…… 저쪽에 무슨 전시회가 있다고 해서 가보려고 했더니만!"
10039140-13 = "헬멧단이 길목을 점거하고 있을 줄은……"
10039140-14 = "정말이지, 교내 한복판에 불량아들이 진을 치고 있다니! 트리니티의 질서는 어디로 간 거야?"
10039140-20 = "[ns] \"……\""
10039140-22 = "[ns] (이야기가 나오는 곳으로 가본다)"
10039140-29 = "아앙? 뭘 보는 거야? 구경났어?"
10039140-34 = "히익! 눈 마주쳤다. 빨리 가자."
10039140-39 = "참나, 헬멧단 처음 보나."
10039140-41 = "대장, 아까부터 우리를 동물원 원숭이 쳐다보듯 하는데요."
10039140-42 = "뭔가 좀 이상한데. 우리 그냥 가만히 있었잖아."
10039140-43 = "우리처럼 무시무시한 문제아들은 처음 보는 거라 쫄았나 본데! 하핫! 누가 아가씨 학교 아니랄까 봐!"
10039140-44 = "[s] \"길 한복판을 막고 있어서가 아닐까……?\""
10039140-52 = "아앙? 뭐라고?"
10039140-56 = "……어?"
10039140-58 = "샤, 샬레의 선생?!"
10039140-61 = "헉! 저, 정말이다!"
10039140-62 = "우, 우리는 아무것도 하지 않았다고!! 가만히 있었어!!"
10039140-63 = "[s] \"진정해. 선생님으로서 학생을 지도하려는 것뿐이니까.\""
10039140-65 = "지도……?"
10039140-66 = "우, 우리가 문제아들이라지만 오늘은 나쁜 짓 안 했다고!!"
10039140-67 = "[s1] \"그렇게 길을 막고 있으면 다른 학생들이 위화감을 느끼니까.\"\n[s2] \"아까부터 사람들이 계속 쳐다본 것도 그 때문일 것 같은데.\""
10039140-70 = "……으음? 그, 그런가……"
10039140-72 = "그렇지만 딱히 앉아 있을 만한 곳도 없던데?"
10039140-73 = "운동장이나 계단 같은 곳은 사람이 너무 많아서 무섭다고!"
10039140-75 = "축제라기에 모처럼 와봤더니, 이거 방문객 대접이 너무 박한 거 아니야? 쳇!"
10039140-76 = "[s] \"다들 <트리니티 사육제>를 구경하러 온 거야?\""
10039140-80 = "……뭐, 그렇다고 해둘까."
10039140-82 = "아니라고 할 수는 없지……?"
10039140-83 = "구경이랄까, 정찰이랄까……"
10039140-85 = "트리니티처럼 큰 규모의 학교는 축제 때 얼마나 대단한 것들을 하는지 구경이라도 한 번 해볼까 하고 말이지! 하하!!"
10039140-86 = "……그, 실제로 보니 뭔가 좀 대단하긴 하단 말이지……"
10039140-90 = "……그, 그건 그렇다만……"
10039140-91 = "돈도 뭣도 없어서 그냥 기웃대며 구경한 게 다지만."
10039140-93 = "노점 가판대의 음식들도 모두 맛있어 보였지……"
10039140-100 = "……"
10039140-101 = "이, 이건! 생체 반응이라 어쩔 수 없는 거라고!"
10039140-102 = "그, 그렇다! 내장을 직접 움직여서 내는 헬멧단 비전 위협의 샤우팅이라고……!"
10039140-103 = "어떠냐! 무섭지, 선생?! 하핫……!"
10039140-107 = "[ns3] \"저기, 괜찮다면\"\n[ns4] \"함께 축제를 둘러보지 않을래?\""
10039140-115 = "뭐, 뭐라고?"
10039140-116 = "[s5] \"저쪽 타코야키 가판대가 엄청 맛있어 보였는데,\"\n[s6] \"혼자라서 사 먹을 용기가 안 났지 뭐야. 같이 가줄래?\""
10039140-119 = "……"
10039140-121 = "대, 대장…… 이건 혹시 좋은 기회가 아닐까요……"
10039140-122 = "샬레의 선생이 저렇게까지 말하는데, 우리로서도 응하는 게……"
10039140-124 = "그, 그럴까……?"
10039140-125 = "안 그래도 다른 학생들은 선생과 여기저기 놀러 다니고, 맛있는 것도 자주 먹는다던데……"
10039140-126 = "우, 우리도 한 번쯤은 그런 경험을 ……"
10039140-131 = "시, 시끄러! 결정은 내가 할 테니까……!!"
10039140-136 = "[ns7] \"아앗, 저기 야키소바도 맛있겠다……\"\n[ns8] \"사격장도, 풍선 낚시도 재밌어 보여……!\""
10039140-141 = "크, 크윽……"
10039140-144 = "대장……!!"
10039140-150 = "후, 후후…… 이봐, 선생."
10039140-151 = "꼭 그렇게까지 축제를 즐기고 싶다면, 우리가 어울려주지 못할 것도 없는데?"
10039140-152 = "[s] \"응, 같이 가자.\""
10039140-157 = "우오오오!! 역시 대장!!"
10039140-158 = "믿고 있었다고!!"
10039140-159 = "아싸, 드디어 우리도 선생이랑 논다……!!"
10039140-161 = "후, 후후후…… 후후!"
10039140-163 = "(그렇게 헬멧단 학생들과 축제를 즐기러 이동했다.)"
10039140-172 = "앗, 뜨, 뜨거!! 후! 후!"
10039140-173 = "크흑, 갓 만든 타코야키가 이렇게 뜨거울 줄은 몰랐어……!!"
10039140-174 = "항상 식은 것만 먹다 보니 알 턱이 있나!"
10039140-182 = "크아악! 뜨, 뜨거웟!! 흡! 헙! 하부부!!"
10039140-183 = "[s9] \"처, 천천히 먹어도 돼……!\"\n[s10] \"다른 것도 사줄 테니까!!\""
10039140-195 = "아아~!! 아까웠다!! 한 발만 더 맞췄어도!!"
10039140-196 = "으그으윽! 그랬으면 저 상반신 사이즈의 포실포실한 인형을 얻을 수 있었을 텐데……!!"
10039140-197 = "하지만 기회는 이것으로 끝…… 이어서 하려면 크레딧이……"
10039140-201 = "[ns] \"한 번 더 할래?\""
10039140-203 = "으, 으으……"
10039140-204 = "……부, 부탁한다…… 선생……"
10039140-205 = "님……"
10039140-206 = "[s] (크레딧을 건넨다)"
10039140-214 = "오오!! 최고다, 대장! 선생님!"
10039140-215 = "맞췄다, 맞췄어! 대장이 인형을 손에 넣었다!!"
10039140-217 = "봤냐, 짜식들아!! 나, 퐁당퐁당 헬멧단의 리더 코마카제 라브! 만만한 녀석이 아니다 이거야~!! 우하핫!!"
10039140-218 = "자! 하이 파이브다!! 선생님!!"
10039140-226 = "흐흑…… 정말 좋은 이야기였어……"
10039140-227 = "나도 눈물 흘려버렸지 뭐야. 연극이란 거, 굉장하잖아!"
10039140-228 = "마지막 마비 공주의 솔로 파트, 대단했지……"
10039140-230 = "이 바보 녀석들! 그렇게 감성이 헤퍼서야 어디 헬멧단이라고 할 수 있겠냐!"
10039140-231 = "나도 연극 같은 건 처음 봤지만, 하나도 울지 않았다고!"
10039140-233 = "대장, 눈가가 빨간데요……"
10039140-234 = "마스카라 조금 번진 거 아닙니까?"
10039140-239 = "시, 시끄러워!! 가려워서 살짝 비빈 것뿐이니까……!!"
10039140-243 = "[ns11] \"다들 헬멧을 쓰고 있지만,\"\n[ns12] \"역시 그 나이대의 학생들이구나.\""
10039140-250 = "……"
10039140-251 = "그야…… 당연한 말이긴 한데……"
10039140-253 = "하지만 우리는 무서운 불량 학생들이라고? 문제아라 이거야."
10039140-254 = "[s] \"적어도 오늘만큼은 평범해져도 괜찮아.\""
10039140-258 = "[ns] \"평범한 학생들과, 평범한 선생님이 보내는 하루니까.\""
10039140-261 = "……"
10039140-264 = "……"
10039140-266 = "……뭐……"
10039140-267 = "애초에 여기 구경 올 때부터 말썽부리겠다는 마음은 딱히 없었기도 했고……"
10039140-268 = "이렇게 선생님이랑 같이 놀고 있는 것도 좀 신기한 경험이기도 하고……"
10039140-273 = "그럼…… 선생님."
10039140-278 = "오늘 하루, 우리랑 완전히 어울려달라고!!"
10039140-280 = "(그렇게 해가 지도록 헬멧단과 함께 즐거운 시간을 보냈다.)"
10039140-285 = "(……대신, 지갑이 많이 홀쭉해졌다……)"
