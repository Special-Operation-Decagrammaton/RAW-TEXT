[translation]
10017090-1 = "에필로그;크리스마스 캐럴"
10017090-5 = "결국, 함께 파티를 하게 되었네요……"
10017090-6 = "그러게요. 후훗. 참 앞날은 어떻게 될지 알 수 없는 거군요."
10017090-7 = "기억나세요? 나중에라도 한번 카페에 들러 달라고 이야기했었죠."
10017090-8 = "기억하고 말고요. 그 말대로 됐네요. 모든 게 잘 풀려서 정말 다행이에요."
10017090-9 = "한때는 어떻게 되는 건가 했습니다만, 다행입니다. 결국 정의가 승리하는 법이로군요."
10017090-10 = "그래도 저는요! 왠지 이렇게 될 것 같았어요! 왠지 모르게요!"
10017090-11 = "어머나, 하나에 씨는 긍정적이네요."
10017090-12 = "주, 주제넘었나요?!"
10017090-13 = "아뇨, 아뇨. 뭔가 보기 좋고 흐뭇하고…… 조금, 감동까지 해 버려서요."
10017090-14 = "그러지 마세요. 부끄러워요……"
10017090-15 = "[ns] \"자, 자. 미네도 한마디 해 봐.\""
10017090-20 = "제가…… 염치없이 그래도 될까요?"
10017090-21 = "선생님께서 책임져 주시겠다고요? 그렇다면 송구스러움에도 불구하고……"
10017090-22 = "어흠. 많은 일이 있었지만, 올해도 구호기사단은 스스로의 책무를 다한 것 같습니다."
10017090-23 = "구호기사단의 모두가 긍지를 가져도 될 일이겠지요."
10017090-24 = "그 의미를 이어받아 반성하고 나아가며, 보다 스스로를 갈고 닦겠습니다."
10017090-29 = "……틀린 말은 아닐지도 모르겠지만……"
10017090-30 = "일단 그런 것으로 해 두죠. 츠루기."
10017090-35 = "홍차의 세계란 건……. 의외로 깊네요. 이렇게나 많은 블렌딩이 있을 줄은……"
10017090-36 = "제가 조금 주제넘은 참견을 해도 될까요? 홍차에는 약간의 배움이 있는 몸이어서……"
10017090-37 = "미, 미네 단장님? 여, 영광이에요……!"
10017090-38 = "단장님의 솜씨는 구호기사단 제일이니까요. 아하하……"
10017090-39 = "환자분들을 돌보다 보면, 다른 많은 일에도 섬세한 지식을 가져야 하거든요!"
10017090-44 = "그 섬세함이 조금만 더 올바른 방향으로 향했으면 좋았으련만……"
10017090-45 = "……됐어."
10017090-50 = "아, 맞아요! 저희가 만든 장갑과 모자가 있어요! 나눠드릴게요!"
10017090-51 = "괘, 괜찮은 건가요?!"
10017090-52 = "조금 많이 만들었더니, 남아 버렸지 뭐예요. 받아 주세요. 크리스마스잖아요?"
10017090-53 = "정말 감사합니다…… 멋진 크리스마스네요."
10017090-54 = "에헤헤. 메리 크리스마스, 예요. 여러분!"
10017090-55 = "그렇네요. 모두, 행복한 크리스마스가 되시기를……"
10017090-56 = "한 해 동안 수고하셨습니다. 메리 크리스마스."
10017090-58 = "메리 크리스마스!"
10017090-59 = "성당의 메리 크리스마스 ~구호기사단의 선물~"
