[translation]
10042080-1 = "제8화;결실"
10042080-2 = "……결과는……."
10042080-3 = "……해치웠나요?"
10042080-4 = "아. 지금 그 대사는 조금 위험합니다만……."
10042080-8 = "돌입한다! 내가 현장을 확인하겠어!"
10042080-9 = "혹시 모르니까 선생님은 뒤에서 대기해!"
10042080-13 = "이곳은 저에게 맡겨 주세요!"
10042080-15 = "으, 으으……."
10042080-16 = "급양부원 한 명 발견! 그리고 다음은……."
10042080-18 = "……."
10042080-19 = "어……. 여기저기 초록색 소스 범벅이 되어서 정신 잃은 아코 쨩 발견. 그리고……."
10042080-25 = "지금 보면 이렇게 작은데, 그렇게까지 커졌다는 건가……."
10042080-30 = "마지막 보고. 원본 크기로 돌아간 개체 발견."
10042080-34 = "[ns] \"괜찮아, 이오리?! 그거 위험하지 않아?\""
10042080-35 = "지금은 움직이지 않아."
10042080-36 = "이런 표현이 맞을지는 모르겠지만…… 아마, 기절한 것 같아."
10042080-38 = "……."
10042080-39 = "……."
10042080-40 = "저기, 아코 쨩? 이거, 그러니까……."
10042080-41 = "가만히 있어요. 여러분은 몰라도, 저는 아직 아무것도 끝나지 않았으니까."
10042080-42 = "윽."
10042080-43 = "잘도…… 잘도 이런 게 저를, 그렇게…… 해 버렸다, 이거죠?"
10042080-44 = "휘감고, 묶고, 끈적끈적한 액체를 마구 뿌려대고, 입을…… 촉수로……. 으읏……!"
10042080-45 = "더럽혀졌어…… 더럽혀져 버렸다고요……!"
10042080-46 = "[s1] \"아, 아코? 괜찮…… 아?\"\n[s2] \"그냥 팬케이크 소스가 묻었을 뿐…….\""
10042080-49 = "아무 말 하지 마세요! 저 녀석과 저 사이의 승부는……."
10042080-50 = "이제부터 시작……!!"
10042080-51 = "?! 아코 쨩, 조심해!"
10042080-57 = "하……!? 하우어웁!?!?"
10042080-58 = "어우웁웁-?!?! 우웁-!?!?"
10042080-59 = "[ns3] \"아앗! 아코의 얼굴을……!\"\n[ns4] \"마치 이오리 때처럼 덮쳐 버렸어!!!\""
10042080-65 = "윽…… 뭔가 기시감이……."
10042080-66 = "……그 소스 맛은 정말 끔찍했어……."
10042080-70 = "그래도 지금은 다시 얌전해진 것 같은데……?"
10042080-71 = "팬 쨩……."
10042080-72 = "그래요. 그간 많은 일들이 있었지만……"
10042080-73 = "처음엔 저의 잘못으로 인해, 많은 분들이 다치게 되어 저도 어쩔 줄 모르게 되었지만."
10042080-74 = "이렇게 무사히 사건이 해결되어, 팬 쨩 또한 원래대로 되돌아왔다면……!"
10042080-75 = "……응. 그러게."
10042080-76 = "그럼 작게 돌아왔으니 이제……."
10042080-85 = "아앗?!"
10042080-86 = "[s5] \"후우카가 팬 쨩을……!\"\n[s6] \"어디선가 나타난 음식물 쓰레기통에 던져 넣었어!\""
10042080-89 = "냄비 밖으로 달아나 바닥을 기어다닌 음식은, 비위생적이니 당연히 폐기해야지."
10042080-90 = "그, 그건……! 드, 듣고 보니 맞는 말씀이긴 한데……!!"
10042080-91 = "반론의 여지가 없는 정론이군요."
10042080-92 = "…………."
10042080-94 = "그러면…… 모두 끝난 건가요?"
10042080-95 = "그래야지. 아니면 우리가 그렇게 되도록 만들어야 할 테니까."
10042080-96 = "이 이상의 소동은 솔직히 사양하고 싶고……."
10042080-100 = "[ns] \"여러 가지로 굉장한 하루였어…….\""
10042080-101 = "굉장은 무슨……! 용서할 수 없어요!!"
10042080-102 = "아코 쨩? 부활한 거야?"
10042080-103 = "부활이라뇨! 누가 들으면 제가 한 번 죽은 줄 알겠어요! 그거…… 팬 쨩인가 뭔가는 어떻게 됐죠?!"
10042080-104 = "어…… 팬 쨩이라면, 음식물 쓰레기 통에 들어간 이후로는, 더 이상 움직이지 않게 됐어요……."
10042080-105 = "……."
10042080-106 = "그건 다행이라면 다행이지만……."
10042080-107 = "……이 갈 곳 없는 분노는, 어디에 해소해야 하는 거죠……?"
10042080-108 = "[s7] \"그렇지만 아코, 괜찮아? 몸이랑 옷 여기저기가…….\"\n[s8] \"뭔가…… 샤워라도 해야 하는 거 아닐까……?\""
10042080-111 = "!!!!!"
10042080-113 = "진짜! 모든 게 다!!! 최악이에요!!!!!"
10042080-117 = "[log]그렇게, 게헨나 학원을 작은 소동으로 몰아넣은 팬 쨩 소동은,#n이런저런 소란을 남기고 무사히 마무리되었다.[/log]"
10042080-120 = "[log]……여기에서의 '작은 소동'이란,#n어디까지나 상대적인 의미임을 언급해 두고자 한다…….[/log]"
10042080-123 = "[log]며칠 후[/log]"
10042080-127 = "게헨나 급식실 주방"
10042080-128 = "주리! 양파, 양파는 준비됐어?"
10042080-129 = "네, 선배! 여기 전부 다듬어 뒀어요!"
10042080-130 = "그러면 내가 양파를 볶는 동안, 감자와 당근도 마저 부탁해!"
10042080-131 = "네! 양파를 먼저 볶아서 물기를 제거하고, 단맛을 더욱 살리시려는 거군요!"
10042080-132 = "오늘 메뉴는 아무튼 고기감자조림이니까!"
10042080-134 = "게헨나 급식실"
10042080-135 = "저기~ 이 고기감자조림, 조금 맛이 싱거운데~?"
10042080-136 = "거기에 소고기가 들어갔을 줄 알고 기대했는데, 돼지고기라니 조금 실망이야."
10042080-137 = "난 실곤약이 좋은데, 없나 보네……."
10042080-138 = "야채 절임 더 없어? 뭔가 미묘하게 양이 모자라단 말이야."
10042080-139 = "네. 오늘의 점심 식사 메뉴는 가정적인 요리로 불리는 고기감자조림."
10042080-140 = "오늘 미식연구부의 탐구 주제는, 그 고기감자조림에."
10042080-141 = "과연 어느 만큼의 가정적인 맛이 담겨 있을지를 알아보는 것입니다."
10042080-142 = "넌 진짜로 안 되니까!!!"
10042080-144 = "하아……. 오늘도 어떻게든 끝났네……."
10042080-145 = "수고하셨어요, 선배……."
10042080-146 = "정말, 언제나 이렇다니까. 일정은 바쁘지, 수고는 수고대로 들어가지."
10042080-147 = "그렇다고 해서 누가 뭐 알아주는 것도 아니지……!"
10042080-148 = "죄송해요, 선배. 제가 좀 더 도움이 되었더라면……."
10042080-149 = "아니야, 주리. 주리는 잘해 주고 있어. 주리가 있는 것만으로 얼마나 도움이 되는데."
10042080-150 = "……달리 생각하면, 주리 없이 어떻게 급양부를 운영할 수 있을지, 감이 안 잡힐 정도니까……."
10042080-151 = "그 말씀은 기쁘고 감사한데, 한편으로는 살짝 서글프기도 하네요……."
10042080-156 = "[ns] \"안녕, 주리! 후우카! 고생 많았어!\""
10042080-157 = "아, 선생님!"
10042080-158 = "선생님! 어어? 이, 이런 것까지 사 와 주실 필요는 없었을 텐데……."
10042080-159 = "네? 저희들이 고생하는 것도 알고 있으니까, 마실 것이라도 가져와 보셨다고요……?"
10042080-160 = "……감사합니다. 선생님. 저희, 선생님이 계셔서 정말 다행이에요."
10042080-161 = "선생님도 함께 드세요! 잔을 세 개 가져올게요!"
10042080-162 = "그런데, 뭔가 마실 것에 곁들일 만한 게……."
10042080-167 = "……."
10042080-168 = "저, 선배? 선생님?"
10042080-169 = "괜찮으시다면……. 사실, 제가 조금 전에 살짝 준비해 본 게 있는데요……."
10042080-170 = "무, 물론 어딘가 걱정되신다거나 불안하시다거나 두려우시다면 얼마든지 괜찮다고 말해 주셔도……!"
10042080-171 = "주리가 준비한 것?"
10042080-172 = "……."
10042080-173 = "응. 그거 나도 한 번 보고 싶네. 뭔데?"
10042080-174 = "[s] \"나도, 나도!\""
10042080-175 = "저, 정말요? 정말로…… 괜찮을까요?"
10042080-176 = "그러면 조금만 기다려 주세요!"
10042080-188 = "어라? 이건…… 팬케이크? 그것도 상당히 맛있어 보이는데?"
10042080-189 = "[ns] \"이거 정말 주리가 만든 거야?\""
10042080-190 = "네. 에헤헤……. 그 날, 카페 아르바이트를 하면서 조금 이것저것 배웠거든요."
10042080-191 = "이번에는 정말로 열심히 해서…… 어떻게든 성공시켜 봤어요."
10042080-192 = "괜찮으시면…… 드셔 주시겠어요?"
10042080-193 = "……."
10042080-197 = "선생님?"
10042080-198 = "[s] \"그래. 우리 이거 같이 먹자!\""
10042080-199 = "네, 선생님. 자, 주리도."
10042080-200 = "가, 감사합니다!"
10042080-201 = "정말로…… 감사해요……."
10042080-203 = "(그렇게 다 같이 주리의 팬케이크를 사이좋게 나누어 먹었다.)"
10042080-204 = "(확실히, 보통의 팬케이크와는 살짝 다른, 미묘한 맛이 느껴지기는 했지만.)"
10042080-205 = "(거기에는 분명히 주리의 정성과…….)"
10042080-206 = "(명백한 '사랑'이 담겨 있었다.)"
10042080-209 = "팬데믹 해저드 ~기적의 팬케이크~"
