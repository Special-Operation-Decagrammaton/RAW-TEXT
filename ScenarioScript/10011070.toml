[translation]
10011070-1 = "제7화;네 번째 관문: 트릭 하우스"
10011070-6 = "안녕~! 모두 환영해-! 이번 관문은 트릭 하우스!"
10011070-7 = "수많은 함정과 장치들로 가득한……! 소용돌이 영화촌에서 젤루 유명한 관광지야!"
10011070-8 = "그거…… 그냥 닌자 저택 아냐?"
10011070-9 = "사소한 건 신경 쓰지 마!"
10011070-10 = "어쨌거나! 내가 바로 그 관광지 <네 번째 관문: 공략! 트릭 하우스!>를 담당하고 있는 이사미 카에데! 15살! 취미는 장수풍뎅이 잡기야!"
10011070-11 = "[s] \"혹시나 했는데 역시 다음 수문장이 카에데였구나.\""
10011070-12 = "후! 후! 후! 맞아! 이미 공주님을 납치한 도당은 이 저택 안으로 도망친 상황……! 이라나 봐. 아마도!"
10011070-13 = "그래서 말인데~ 이번 관문의 통과 방법은 간단해!"
10011070-15 = "이 저택을 통과해서……"
10011070-18 = "그 안에 있는 시련을 뛰어넘어서"
10011070-21 = "골인 지점에 도착하면 통과! 란 건데!"
10011070-23 = "말만 들으면 쉽지만, 이게 또 자세히 파고들면 말이지이~!"
10011070-24 = "좋았어! 알았다고! 트릭 하우스든! 닌자 저택이든! 전부 좋다. 이거야!"
10011070-25 = "앗, 부장니임……! 자, 잠깐만요오……!"
10011070-26 = "부장! 트릭 하우스라면 역시 공략 방법을 사전에 논의하는 게 중요하다고 이즈나는……!"
10011070-27 = "괜찮아. 괜찮아. 나아가면 어떻게든 될 거야!"
10011070-28 = "어차피 이런 어트랙션 같은 건, 대충 돌파하다 보면 자연스레……!"
10011070-32 = "앗! 아직 설명 안 끝났는데!"
10011070-38 = "……어?"
10011070-39 = "[s] \"미치루, 위험……?!\""
10011070-46 = "냐하핫~ 계속해서 닥쳐오는 시련. 그 앞에서 맞서 싸워나가는 소녀들."
10011070-47 = "그리고 그 곁에 있는 당신까지."
10011070-48 = "후후…… 기대는 했지만. 이거 참."
10011070-49 = "기대한 것, 그 이상으로 풍취가 있는걸. 재미있어라. 응. 정말 재미있어."
10011070-50 = "니야 님…! 이게 어찌 된 일인가요?!"
10011070-51 = "응? 왜~? 카호-"
10011070-52 = "방금 연락이 들어왔습니다. 원래 공주님을 납치하는 역할을 맡은 용역들이, 자기들은 언제 공연에 나서면 되느냐고-"
10011070-53 = "그 말은 결국 지금 이부키 양을 데리고 있는 건 대체……?"
10011070-54 = "아, 그래? 흐음~ 이상하네. 응응. 그거참."
10011070-55 = "어떻게 된 일이려나~?"
10011070-56 = "……?! 또, 인가요. 이번엔 대체 누가 니야 님의 흥미를……"
10011070-60 = "아뇨……. 네, 알겠습니다. 여기서부터는 제가 직접 움직이도록 하지요. 그럼 물러 가보겠습니다."
10011070-65 = "냐하핫~ 카호도 차암~ 그냥 있는 그대로 즐기면 좋을 텐데. 융통성이 없네-♪"
10011070-69 = "자, 그럼 이제 당신은 어떻게 하려나~?"
10011070-70 = "이제까지 경쾌하게 답파해온 장애물들과 다르게 이번에는 좀 더 섬세하고 델리케이트한 문제이지 않을까아~?"
10011070-71 = "그런 고민 앞에서 당신은 어떤 답을 들려줄 생각인가요?"
10011070-72 = "네에-? 선생님?"
10011070-81 = "그렇게 되었으니, 이번 공연. 잘 부탁드린다고요? 인법연구부 여러분~♪"
10011070-87 = "우리 <제멋대로 망량즈>가 어떠한 원대한 목표를 가졌는지 잊지 말도록. 여기선 신속하게 진행한다. 방해꾼은 처리해."
10011070-93 = "그 수행부의 부장을 상대로? 애당초 인법연구부가 뭔데?"
10011070-94 = "인법연구부라니, 이상한 이름이네~"
10011070-102 = "(포기…… 안 해. 이건 간신히 주어진 기회야.)"
10011070-103 = "(모든 걸 해결하고……. 당당히 정식 동아리가 되어서…….)"
10011070-104 = "(이즈나와 츠쿠요의 앞에서 가슴을 펼 수 있는, 그런 기회……!)"
10011070-105 = "(그러니까 나는 기필코……!)"
10011070-114 = "……어라, 여긴……?"
10011070-115 = "[s] \"아, 미치루 괜찮아? 아무래도 함정 때문에 이리로 떨어졌나 봐.\""
10011070-116 = "……함정? 저택에? 관광지에……?"
10011070-117 = "아니아니, 역시 닌자 저택이었잖아 이거!"
10011070-118 = "핫?! 이럴 때가 아니지! 선생 공! 얼른 이곳을 빠져나가야……."
10011070-119 = "[s1] \"아, 미안…… 지금은 좀 움직이기 힘들어서…….\"\n[s2] \"아무래도 떨어질 때, 조금 발을 접질렸나 봐.\""
10011070-122 = "발을? 떨어지면서……?"
10011070-123 = "아…… 혹시, 밑에서 날 받아주느라, 그…… 선생 공은 나 때문에…… 다친 거야?"
10011070-124 = "내가 혼자 서두르느라……?"
10011070-125 = "[s] \"아냐, 딱히 미치루 때문인 게 아니라…….\""
10011070-130 = "……쳤어……."
10011070-131 = "[s] \"응? 미치루?\""
10011070-132 = "……전부 망쳤어……."
10011070-133 = "우와아아앙?! 미안, 미안해……! 내가 전부 망쳐버렸어~! 이, 이걸 어떡하지, 선생 공?!"
10011070-142 = "[ns] \"어때, 조금 진정했어?\""
10011070-143 = "……우으으…… 훌쩍. ……응."
10011070-144 = "[s3] \"그래서 미치루, 전부 망쳤다니. 무슨 이야기야?\"\n[s4] \"자세히 이야기해 줄래?\""
10011070-147 = "처음부터…… 전부 내 욕심이었어."
10011070-148 = "나…… 이부키가 납치당했을 때, 일부러 신고를 하지 않았, 어."
10011070-149 = "원래대로라면 바로 음양부랑, 백화요란에게 신고를 해서. 해결을 해야 했는데."
10011070-150 = "단지- 내 욕심 때문에……."
10011070-151 = "[s] \"정식 동아리가 될 기회를 놓치고 싶지 않았던 거지?\""
10011070-152 = "……!! 여, 역시……! 알고 있었어?"
10011070-153 = "……맞아. 그도 그럴 게……"
10011070-154 = "닌자를 널리 알리고 싶다는 건 진심이야. 하지만 그랬다간 다른 사람들에게 비웃음 받을지도 몰라."
10011070-155 = "그리 생각하면 덜덜 떨려서……. 그래서 이번 기회에, 어쨌든 먼저, 정식 동아리가 되고 싶었던 거야."
10011070-156 = "두 번 다시 없을지도 모를 이번에야말로, 어떻게든 해내고야 말겠다고 결심했던 건데-"
10011070-161 = "내겐, 닌자를 동경하면서 반짝거리는 눈으로 바라보는 이즈나랑……."
10011070-162 = "아무것도 모르던 츠쿠요를 끌어들인 책임이 있으니까."
10011070-164 = "츠쿠요라고 했었지?"
10011070-165 = "!!"
10011070-166 = "혹시 괜찮다면- 인법연구부에 들어오지 않을래?"
10011070-168 = "두 사람에게 부끄럽지 않은, 그런 선배가 되고 싶었을 뿐인데……."
10011070-169 = "이대로 공연은 실패가 되고, 기회가 날아가는 것뿐이라면 차라리 나아."
10011070-173 = "하필 내가 신고를 망설인 탓에- 망량즈에게 납치된 그 아이는……"
10011070-175 = "나 때문에 괴로운 경험을 하고, 지금 울고 있을지도 몰라."
10011070-177 = "전부 내 탓에- 상황은 악화하기만 하고."
10011070-178 = "나중에 이게 알려지면, 인법연구부에 엮여 있다는 것만으로도 사람들은 이즈나와 츠쿠요에게 손가락질할지도 몰라."
10011070-179 = "순전히 내 욕심 때문에- 그 아이들에게 큰 민폐를 끼친 거야."
10011070-180 = "아마 이즈나도 츠쿠요도……"
10011070-181 = "나 때문에 일이 이렇게 되어버린 걸 알게 되면……. 분명……. 실망할 거야."
10011070-182 = "……정말…… 정말, 나는……."
10011070-183 = "[s] \"좋았어. 발은 제법 괜찮아진 거 같아. 슬슬 움직일까?\""
10011070-184 = "잠……?! 나, 지금 엄청 진지한 이야기를 하는 중 아니었어?!"
10011070-185 = "애니메이션으로 따지면 메인 히로인이 이제껏 가슴 속에 숨겨두고 있던 엄청난 고민을 폭로하는 씬이잖아?!"
10011070-186 = "그런데 그렇게 가볍게 반응하는 거야?! 선생 공?!"
10011070-187 = "나, 운다?! 아니! 굳이 따지자면 이미 반쯤 울고 있지만……! 그래도!"
10011070-188 = "[s] \"<정식 동아리 신청서>를 내지 않았던 건, 무서웠으니까?\""
10011070-189 = "……어?"
10011070-190 = "그, 그야, 저, 정식 신청서를 낼, 수 있을 리가 없잖아!"
10011070-192 = "그도 그럴 게, 평범하게 생각해서, 이, 인법연구부라니 뭔데? 애당초 닌자라니……?"
10011070-193 = "애니메이션이나 만화에 나오는 걸 코스프레 하고 있을 뿐이고!"
10011070-194 = "이런 동아리를, 대체…… 누, 누가 인정해준다는 거야?"
10011070-195 = "닌자라니, 이런 이상한 취미를 인정해줄 리가……!"
10011070-197 = "손가락질당할 거라고? 바보 취급당할 거야!"
10011070-198 = "나뿐만 아니라. 같이 있는 모두가-"
10011070-199 = "그래서……!"
10011070-203 = "[ns5] \"그렇다면 더욱 난 미치루에게 답해줄 말이 없어.\"\n[ns6] \"미치루의 그 질문은 다른 두 사람에게 먼저 해봐야 해.\""
10011070-207 = "선생 공이 무슨 말을, 하는지…… 나는……."
10011070-208 = "[s] \"자, 슬슬 움직이자. 여기 눈물도 콧물도 닦고 말이지.\""
10011070-209 = "……알았어."
10011070-210 = "일단은 빠져나가는 게 우선이긴 하니까……."
10011070-214 = "……고마워, 선생 공."
10011070-215 = "[s] \"천만에, 그보다 여기 메이크업 번졌다.\""
10011070-216 = "뭐, 무므우무머뭣?!"
10011070-217 = "우냐아악! 수, 숙녀 앞에서, 그, 그런 말을 꼭 해야겠냐구?!"
10011070-218 = "……하아. 진짜, 뭐가 뭔지 모르겠어……"
10011070-220 = "하지만 대체 여길 나가려면 어찌해야……."
10011070-224 = "……어라?"
10011070-225 = "[s] \"왜 그래?\""
10011070-226 = "잠깐만…… 이 풍경, 어딘지 모르게 익숙해."
10011070-227 = "복도의 모양새나, 방의 배치라던가……."
10011070-228 = "이 저택의 방 배치, 이 구조는 설마…… <카마보코 돌풍전>에 나왔던……?"
10011070-229 = "이거라면 조금…… 알 수 있을지도."
10011070-230 = "선생 공, 이쪽이야!"
10011070-231 = "[ns] \"응.\""
10011070-252 = "역시 예상이 맞았어! <카마보코 돌풍전>의 닌자 저택 에피소드를 통째로 베껴온 거잖아?!"
10011070-253 = "저작권적으로 괜찮아?! 그거! 라고 투덜거리고 싶은 참이지만!"
10011070-254 = "[s] \"의외로 관광지에서 자주 볼 수 있지. 그런 케이스들.\""
10011070-255 = "으으, 나중에 담당자한테 따져줄 테다! 그보다……."
10011070-256 = "앗! 통과자다! 선생님이랑! 미치루네!"
10011070-257 = "[s] \"카에데……? 이게 어떻게 된 거야?\""
10011070-258 = "룰을 설명하기도 전에 먼저 가버려서 나도 엄청 당황했다구?"
10011070-259 = "흠흠! 통과했으니 그럼! 룰을 설명하겠습니다!"
10011070-260 = "이 저택은 안에 들어가서 미로를 돌아, 출구로 가장 먼저 나오는 사람이 도전권을 가집니다!"
10011070-262 = "도전권……?"
10011070-263 = "맞아! 도전권! 제일 먼저 도착한 사람은 말이야~!"
10011070-269 = "나 카에데가! 수문장으로서 상대해드립니다! 짝짝짝!"
10011070-270 = "이기면 그때 진짜 통과로 치니까! 그럼 간다앗!"
10011070-271 = "아니아니, 역시 그런 전개였던 거냐구?!"
10011070-272 = "[s] \"뭐, 어쩔 수 없지.\""
