[translation]
10040065-2 = "하아, 하아……. 진짜……."
10040065-3 = "진짜 다 끝나는 줄 알았어요……. 이번에는……."
10040065-4 = "[s1] \"오늘따라 뛰는 일이 많네.\"\n[s2] \"어떤 의미로는 제대로 벌받고 있네.\""
10040065-7 = "그러고 보니 베리타스 분들이랑은 연락되시나요? 지하 깊은 구간은 지난 것 같은데."
10040065-8 = "슬슬 연락이 돼야 되는 거 아닌가요?"
10040065-9 = "혹시 길을 잘못 들었다거나, 뭔가 잘못됐다거나……."
10040065-10 = "……어쩌면……!!"
10040065-16 = "아니요. 잘 들립니다. 두 분 모두 제대로 도착하신 것 같네요."
10040065-17 = "이제 그 앞의 문을 열고 지상으로 올라가시면, 세미나 소유라고 할 수 있는 토지로부터는 완전히 빠져나가는 것입니다."
10040065-18 = "그 옆쪽으로 더 나아가면 작은 길이 하나 더 있지만, 지금까지의 통계상으론 그 문이 가장 사용된 적이 적은 문입니다."
10040065-20 = "이런저런 일들이 많았지만, 그래도 어떻게든 해내긴 해내네. 수고했어, 선생님."
10040065-21 = "조금만 기다려 줘. 지금 곧 마키에게 연락해서 문을 열라고 할 테니까."
10040065-22 = "그럼 연락을……."
10040065-28 = "음? 이게 무슨 소리지……?"
10040065-29 = "[s3] \"……? 소리? 무슨 소리?\"\n[s4] \"아무 소리 안 나는데?\""
10040065-32 = "아, 아니. 그쪽이 아니라……. 이쪽의……."
10040065-39 = "으, 으응……!? 어……!?"
10040065-40 = "……어……?"
10040065-41 = "…………."
10040065-43 = "……부부장!?!?"
10040065-45 = "치, 치히로!? 치히로……! 어, 어째서 여기에……!!"
10040065-46 = "아, 아닙니다. 이, 이건 아무것도……!!"
10040065-50 = "[ns5] \"치히로라고……!?\"\n[ns6] \"무슨 일이야! 하레! 코타마……!!\""
10040065-53 = "이, 이건 말할 수 없어! 비밀 작전……! 비밀 작전이라고……!!"
10040065-54 = "설마……! 함정이었던 겁니까, 치히로!! 이런 식으로 함정을 파다니……!!"
10040065-55 = "작전 취소, 작전 취소!! 함정이야!! 모두 자리에서 피신-!!"
10040065-56 = "으아아앗-!! 강제 종료-!!!"
10040065-60 = "어……. 어, 음……."
10040065-61 = "서, 선생님……? 이건 대체……."
10040065-65 = "……! 때마침 문이……!"
10040065-66 = "어쩔 수 없어요, 선생님! 저쪽 두 분은 뭔가 일이 잘 안 풀린 것 같지만, 그래도 저희는 어떻게든……!"
10040065-67 = "마키 씨와 접선해서, 탈출……을……!"
10040065-71 = "……?"
10040065-72 = "잠깐……. ……이건?"
10040065-73 = "[s7] \"……코유키!?\"\n[s8] \"……?? 왜 그래?\""
10040065-76 = "아뇨. 뭔가……. 지금 잠깐, 느낌이 이상해서……."
10040065-77 = "아주 굉장히 불길한 느낌이……."
10040065-82 = "…………."
10040065-83 = "……후후."
10040065-84 = "후후……. 후후후후……."
10040065-85 = "그렇군요. 결국 이렇게 돼 버리는 거군요. 니하하……."
10040065-94 = "[ns9] \"……코유키!?\"\n[ns10] (밀쳐냈어……?)"
10040065-97 = "……쉿. 조용히."
10040065-98 = "아무 말씀 마세요. 거긴 어둠 속이니, 들키지 않을 거예요."
10040065-99 = "시간이 없으니 짧게만 말씀드릴게요."
10040065-100 = "선생님……."
10040065-104 = "……꼭 살아 나가요."
10040065-106 = "코유키이이이이이이-!!"
10040065-125 = "안 그래도 바빠 죽겠는데, 어!!"
10040065-129 = "연말까지 이렇게 사고를 쳐대고 말이야, 어!!"
10040065-133 = "도대체가 어!! 오늘은 진짜 가만 안 둬, 너!! 이리 와!!!"
10040065-134 = "오늘은 절대 그냥 안 넘어갈 줄 알아!!"
10040065-138 = "끼야아아아아아악-!!"
10040065-143 = "날 기억해줘어어어어-!!!"
10040065-151 = "[ns] \"………….\""
10040065-153 = "[ns11] 코타마가 말한 '다른 문'을 찾아 나선다.\n[ns12] 손을 머리 위로 모아 조의를 표하며 떠난다."
10040065-159 = "[ns] \"……?\""
10040065-161 = "[ns13] \"……? 뭐지?\"\n[ns14] \"잠깐, 방금 발소리가 하나 더…….\""
10040065-166 = "[ns] 다시 걸어 나간다."
10040065-170 = "[ns] 걷는 속력을 올린다."
10040065-179 = "[ns] 살금살금 소리 나지 않게 걷는다."
10040065-188 = "[ns] \"………….\""
10040065-190 = "[ns] 전력 질주한다."
