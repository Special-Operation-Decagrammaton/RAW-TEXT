2005805-53 = "Wow, you're so proud you got the right one."
2005805-54 = ""
2005805-57 = "[ns] \"Ow!\""
2005805-58 = "Ah...! Did you cut yourself?"
2005805-59 = "Oh, because the edge is sharp..."
2005805-60 = "I have a bandage. Let me put it on you."
2005805-61 = ""
2005805-63 = ""
2005805-64 = ""
2005805-65 = "Here, give me your hand."
2005805-66 = "Ugh... That looks like it hurts. I'm sorry for asking you to open it."
2005805-67 = "No, it's not \"fine.\" I feel really bad."
