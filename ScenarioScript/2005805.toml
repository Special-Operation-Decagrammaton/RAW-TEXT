2005805-44 = "Nice choice! It's one of my favorites."
2005805-45 = "You were totally guessing, weren't you?"
2005805-46 = "Huh? You just had \"a hunch\"?"
2005805-47 = "Cold, not carbonated, and soda over fruit juice?"
2005805-48 = "..."
2005805-49 = "Wow. You actually put a lot of thought into it."
2005805-50 = "You've got good sense, Sensei."
