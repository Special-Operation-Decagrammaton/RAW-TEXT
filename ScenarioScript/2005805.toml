[translation]
2005805-1 = "Erika, Vending Machine"
2005805-2 = "I'd finished up some work at Gehenna and decided to swing by a vending machine before I left."
2005805-4 = "[ns] \"What should I drink...?\""
2005805-6 = "Just as I was about to make my selection..."
2005805-7 = "That one's terrible."
2005805-8 = ""
2005805-11 = ""
