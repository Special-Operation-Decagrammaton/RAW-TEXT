[translation]
2005805-1 = "에리카, 자판기"
2005805-2 = "(게헨나에서 일을 마치고 돌아가던 중, 목이 말라 자판기로 향했다.)"
2005805-4 = "[ns]\"뭘 마실까…….\""
2005805-6 = "(고민 끝에 결정하려던 순간……)"
2005805-7 = "그거 별로던데."
2005805-12 = "[ns]\"오, 에리카다.\""
2005805-13 = "그거보다는 옆에 있는 거 추천."
2005805-14 = "오른쪽으로 두 칸 가서…… 어, 그거 그거."
2005805-15 = "[s]\"믿어본다?\""
2005805-16 = "응, 뭐. 괜찮을걸?"
2005805-20 = "[ns]\"진짜 믿는다?\""
2005805-21 = "일단 드셔보기나 하세요~"
2005805-25 = "[ns]\"오…… 맛있네!\""
2005805-26 = "그거 봐. 선생님 취향 맞지?"
2005805-27 = "어떻게 알았냐고? 저번에 얘기해줬잖아. 밥 먹을 때."
2005805-28 = "[s1]\"기억해 줬구나?\"\n[s2]\"감동스럽구만~\""
2005805-31 = "그때 따로 주문하는 게 인상적이었거든."
2005805-32 = "후후, 어때? 선생님은 내 취향 기억하려나?"
2005805-33 = "여기서 한번 골라 볼래?"
2005805-34 = "[s]\"이거 긴장되는데…….\""
2005805-35 = "자~ 자~ 편하게, 편하게. 부담 갖지 말고."
2005805-36 = "……."
2005805-37 = "오…… 그걸 고르는 건가."
2005805-38 = "……."
2005805-39 = "왠지 아닌 것 같았을까? 다른 쪽으로 움직이는 선생님~"
2005805-40 = "[ns]\"이, 이거다~!!\""
2005805-42 = "오……."
2005805-43 = "오오~~~"
2005805-44 = "맞췄네? 나 이거 좋아하는데."
2005805-45 = "선생님, 완전 찍은 거 아냐?"
2005805-46 = "응? 왠지 그럴 것 같았다구?"
2005805-47 = "따뜻한 것보다는 차갑게, 탄산보다는 에이드, 과일보다는 소다 쪽……?"
2005805-48 = "……."
2005805-49 = "뭐야, 완전 열심히 생각해서 고른 거였어."
2005805-50 = "센스 있구나, 선생님."
2005805-51 = "아, 혹시 괜찮으면 이거 따줄 수 있어? 나 손톱이 길어서 종종 부러지거든."
2005805-52 = "[s]\"훗, 내게 맡겨!\""
2005805-53 = "우와, 맞췄다고 의기양양한 거 봐."
2005805-57 = "[ns]\"아얏!\""
2005805-58 = "앗……! 베였어?!"
2005805-59 = "이런, 테두리 끝이 날카로워서……."
2005805-60 = "나 밴드 있으니까 금방 붙여줄게."
2005805-65 = "자, 손 줘 봐."
2005805-66 = "으…… 이렇게 다치다니, 미안해. 괜히 따달라고 해서."
2005805-67 = "괜찮긴 뭐가 괜찮아. 나 지금 엄청 미안하거든."
2005805-68 = "[s]\"에리카, 밴드도 가지고 다니는구나.\""
2005805-69 = "덜렁대다 다치는 애들이 많아서. 여고생이란 그런 법이니까."
2005805-70 = "상냥하다고? 그냥, 뭐. 평균이려나."
2005805-74 = "아…… 이거 어른이 하기에는 너무 귀여운 밴드인가?"
2005805-75 = "뭐, 어쩔 수 없지. 귀여우니까 두 배로 빨리 나을 거고."
2005805-76 = "[s]\"상관없지 않나요, 그거.\""
2005805-80 = "자, 다 됐다……."
2005805-81 = "……."
2005805-82 = "오, 뭔가……."
2005805-83 = "선생님, 나랑 손 한번 대볼래?"
2005805-84 = "응. 이렇게……."
2005805-90 = "오……."
2005805-91 = "선생님 손, 되게 따뜻하네. 예전에도 느꼈지만……."
2005805-92 = "[s]\"에리카의 손, 부드럽네.\""
2005805-93 = "……."
2005805-94 = "그, 그래? 부드럽다는 건, 좋은 거겠지? 하핫."
2005805-96 = "……."
2005805-97 = "아, 아무튼 우연히 만나서 또 음료수까지 얻어먹었네. 잘 마실게, 이거."
2005805-98 = "근데 선생님은 나 만나면 맨날 뭐 사주고, 오늘은 다치기까지 하고. 그닥 반가운 만남이 아닐지도 모르겠어."
2005805-99 = "[s]\"또 만나, 에리카.\""
2005805-100 = "……."
2005805-104 = "응! 또 만나, 선생님."
