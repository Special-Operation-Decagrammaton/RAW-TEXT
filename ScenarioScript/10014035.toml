[translation]
10014035-2 = "(그 날 저녁.)"
10014035-3 = "……어라. 일찍 와 있었네. 기다리게 해서 죄송합니다."
10014035-4 = "[s1] \"별로 안 기다렸어.\"\n[s2] \"느긋하게 있는 거 좋아하니 괜찮아.\""
10014035-5 = "음……. 뭐, 그렇게 말해주면 나야 고맙지만……."
10014035-6 = "음……. 뭐, 그렇게 말해주면 나야 고맙지만……."
10014035-11 = "항상 그렇게 말하니까 오히려 잘 모르겠는걸. 정말 괜찮은지 아닌지……."
10014035-12 = "……농담이야. 그렇든 아니든, 고맙다는 사실에는 변함없겠지."
10014035-13 = "그래서, 이 시간에 무슨 이유로 먼저 불러낸 거야? 혹시 뭔가 해결 방법이라도 떠올랐어?"
10014035-14 = "……우자와?"
10014035-15 = "그 녀석이 왜? 혹시 또 선생님께 무슨 짓이라도 한 거야?"
10014035-16 = "……응?"
10014035-17 = "직접 대화해 본 적은 있느냐고? 내가? 갑자기 그건 왜……."
10014035-18 = "뭐……. 사실 딱히 없지. 저렇게 달려드는데 어떻게 대화 같은 걸 하겠어."
10014035-19 = "게다가 그 녀석, 보고 있으면 뭔가……. 뭔가 싸우자고 하는 주제에 신이 난 것 같은 느낌까지 들어서 말이야."
10014035-20 = "그게 좀 너무 예전 느낌 그대로라 좀……. 보고 있으면 피곤해진달까."
10014035-21 = "……그런데 갑자기 그건 왜 물어? 무슨 일 있는 거야?"
10014035-22 = "……뭐?"
10014035-23 = "좀 더 확실해지면 말해주겠다고? 무슨 이야기인지 통……."
10014035-24 = "……응?"
10014035-25 = "아까 직접 찾아갔었다고? 선생님이? ……그 녀석한테?"
10014035-26 = "그래서? 혹시 뭔가 대화라도 했어? 길게……?"
10014035-27 = "설마……. 들은 말이라도 있다던가……."
10014035-28 = "[s3] \"……응. 이래저래.\"\n[s4] 들었던 이야기를 전부 들려준다."
10014035-33 = "……."
10014035-34 = "……?"
10014035-36 = "……."
10014035-37 = "…………."
10014035-38 = "……………………."
10014035-39 = "[s5] \"……저기, 카즈사. 30분째다만.\"\n[s6] \"이제 그만 고개를 드는 게 어때.\""
10014035-40 = "……후…… 쓰읍……. 후……."
10014035-41 = "……후…… 쓰읍……. 후……."
10014035-42 = "미, 미안. 선생님…… 잠시만……. 잠시만 좀 더 얼굴 좀 식히면 안 될까……."
10014035-43 = "진짜……. 진짜 그렇게 말했다고……?"
10014035-44 = "암흑가……? 짐승의 오라……?"
10014035-48 = "카스팔루그……?"
10014035-49 = "[s7] \"왜? 난 꽤 멋지다고 생각하는데.\"\n[s8] \"혹시 그 이름들이 부끄러운 거야?\""
10014035-50 = "제정신으로 하는 말은 아니지……? 놀리는 거야?"
10014035-51 = "당연하잖아아-!!!"
10014035-52 = "미쳤어, 진짜!! 그 녀석, 진짜로 그런 말을 했다고!?"
10014035-53 = "대체 왜 그러는 거야!? 왜 맨날 그런 행동을!! 그런 소리들을 해대는 건데!? 낯 뜨겁지도 않아!?"
10014035-54 = "또 다른 사람은? 설마 그 말……. 들은 사람이 더 있어?"
10014035-55 = "어, 없지? 없겠지? 제발 없다고 해 줘, 선생님! 선생님만 들었다고! 제발……!!"
10014035-59 = "……아. ……그래?"
10014035-60 = "다른 자경단원이랑……. 쓰러져 있던 스케반들……? 꽤 많이 들었네……?"
10014035-61 = "……아. 동아리 애들까지……?"
10014035-62 = "[s9] \"그건 제가 죄송합니다…….\"\n[s10] \"그건 내 잘못도 있어.\""
10014035-63 = "……으흐……."
10014035-64 = "……으흐……."
10014035-65 = "으흐흐……. 으헤헤……. 소문 다 퍼지겠네~. 이제 평생 후드 뒤집어쓰고 살아야겠네~."
10014035-66 = "[s11] \"보기 드문 표정을 짓고 있다…….\"\n[s12] \"카즈사가 망가졌다…….\""
10014035-67 = "망할……. 빌어먹을……."
10014035-68 = "망할……. 빌어먹을……."
10014035-69 = "으으흑흑……. 이제 쪽팔려서 어떻게 얼굴 들고 다니란 거야……."
10014035-70 = "난 이제 끝이야……. 이제 평생 중이병 환자로 낙인 찍혀서 놀림감이 될 거라고……."
10014035-71 = "……응?"
10014035-72 = "예전의 모습에 대해서 그렇게 생각하고 있었냐고? 나름대로 멋진 거 아니냐고?"
10014035-73 = "……선생님."
10014035-74 = "아무래도 선생님도 우자와한테 이상한 말을 들어서 좀 혼란스러운 모양인데……."
10014035-75 = "생각해 봐, 선생님. 카스팔루그니 뭐니, 결국 그래 봐야 스케반이잖아? 불량 학생이잖아?"
10014035-76 = "그냥 동네 싸움 좀 한다는 애들이었던 것뿐이라고. 대단한 것도 뭣도 아냐."
10014035-77 = "세상 물정 모르고 설치는……. 철없는 애들……."
10014035-78 = "……그래. 그러니까 더 창피한 거야, 그런 예전 일들이."
10014035-79 = "그러니까 더 잊고 싶고……. 지워버리고 싶은 거라고. 그때의 모든 일을."
10014035-80 = "어느 순간 확 깨닫게 되더라. 자기들끼리 아무리 멋진 척을 해도, 밖에서 보면 그저 유치하고 한심한 일들이라는 걸."
10014035-81 = "선생님은 좋게 말해 주려 했던 거 같지만……. 유감스럽게도 나는 바보가 아냐. 그런 말로 편해지지 않아."
10014035-82 = "말했었지? 사람이라면 누구나, 잊고 싶은 기억 하나둘 쯤은 가지고 있는 법이라고."
10014035-83 = "[s13] \"잊고 싶은 시절……이라.\"\n[s14] \"덮고 싶은 거구나, 카즈사는.\""
10014035-84 = "……하아."
10014035-85 = "……하아."
10014035-86 = "아무튼 그래, 그래도 다행이네. 선생님이 이제라도 우자와한테 잘 말해줬다고 하니……."
10014035-87 = "앞으로도 조금씩 설득해서 그만두게 하면 되겠지. 그 과정이 좀 괴롭긴 하겠지만……."
10014035-88 = "이것도 다 지나가는 과정이다 하고 생각해야지, 어쩌겠어. 그치?"
10014035-92 = "……후."
10014035-93 = "……아무래도 좋으니……. 그냥 빨리 끝나버렸으면 좋겠다."
