[translation]
90001300-1 = "제30화;출발 준비"
90001300-2 = "좋아. 이제 수송선을 현 위치로 호출하겠어. 컨테이너 런쳐를 사출한 공간을 활용한다면, 이곳을 임시 격납고로 쓸 수 있을 거야."
90001300-3 = "이곳에 남겨진 시설들의 잔해도 분석이 끝나 가는 중이니…… 곧 그에 따른 결론을 내릴 수 있을 거고."
90001300-4 = "그래서 이 시점에서 우리는……."
90001300-5 = "지금보다 더욱, 서두를 필요가 있어."
90001300-6 = "이미 충분히 서두르고 있다고 생각하는데, 회장?"
90001300-7 = "그것보다 더 해야 해."
90001300-8 = "가능하다면…… 지금 당장 출발하고 싶을 지경이야."
90001300-9 = "그건 조금 어렵겠는데요. 일단 항로 산출도 제대로 되지 않았다고요?"
90001300-11 = "[ns] \"그렇게까지 급하게 움직일 필요가 있어?\""
90001300-12 = "여러 가지가 있지만…… 가장 큰 것은, 우리가 여기에 온 이유 그 자체야."
90001300-16 = "여기에 온 이유, 요……? 우리는 여기에…… 일종의, 백도어를 찾기 위해서……."
90001300-17 = "아!"
90001300-19 = "그래. 우리는 다차원 배리어를 우회할 수 있는, 백도어 루트를 추적하기 위해 여기까지 왔지."
90001300-20 = "그 과정에서, 아마도 자원 운송과 종자 보관을 병행하고 있던 티페레트를 만나고, 퇴각시켰지요."
90001300-21 = "그러면 여기에서 이런 질문을 해 볼 수 있을 거야."
90001300-22 = "티페레트가 강철대륙에 합류하면, 자원을 수송하던 백도어 루트는 닫히게 될까?"
90001300-23 = "……호크마 때의 기억을 되살려 보자면, 그 아이들은 분명, <허용치의 자원은 전부 충족이 되었다>는 이야기를 했지요."
90001300-25 = "회장의 판단은 어때?"
90001300-26 = "즉각적으로 다차원 배리어의 영역을 조정하는 것은 쉽지 않을 거야."
90001300-27 = "그건…… 한번 생성하기도 쉽지 않은 데다, 그 영역을 재정의하는 것은 그것보다도 수백 배나 어려운 일이어서."
90001300-28 = "말 그대로 다차원의 동시 관성 좌표계를, 모든 변수와 가능성을 포함해 게이지 변환을 통해 재연산하는 것부터 시작해야 할 테니까. 거기에……."
90001300-29 = "어? 게이지 변환……?"
90001300-30 = "아, 그거구나! HP 게이지 같은 거! 맞지? 맞지?"
90001300-31 = "아니야. 모모이. 게이지 변환이란–"
90001300-33 = "잘 알 수 없는 이론 부분은 넘어가고, 즉각적으로, 라고 말씀하셨지요. 리오 님."
90001300-34 = "그 표현은 결국 백도어 루트가 닫힐 거라고 예상하고 계신 것이겠지요?"
90001300-35 = "그래. 아주 쉽게 이야기해서, 뒷문이 열렸는데 그걸 내버려두는 집주인은 없을 테니까."
90001300-39 = "[ns] \"항로를 산출하기까지, 얼마나 남았어……?\""
90001300-40 = "출발하는 것만이라면 어떻게든 될 것 같긴 한데요. 그런데 그걸로 충분한 거예요?"
90001300-41 = "무슨 뜻이야?"
90001300-42 = "우리 이대로 그냥 가면, 수송선이고 뭐고 다 강철대륙의 일부가 되는 거잖아요."
90001300-43 = "……특히 저 말이죠."
90001300-44 = "아……!"
90001300-46 = "네. 케이와 함께 남겨진 잔해를 분석하는 중에 알게 된 것이 있어요."
90001300-47 = "부장 말로는, 강철대륙이 어떻게 물질을 변환시키는지 보다 자세히 알게 되었다고 했어."
90001300-48 = "그래요. 이대로 상륙했다가는, 이전에 예측한 대로, 수송선을 포함해 모조리 강철대륙의 일부가 되어 버릴 거예요."
90001300-49 = "그, 그러면 아무것도 안 되는 건가요, 히마리 선배? 기껏 모두와 힘을 합쳐, 여기까지 왔는데……."
90001300-50 = "후후. 그럴 리가 있나요. 다른 누구도 아닌 초천재병약미소녀해커에 호기심 넘치는 분석가이자 과학소녀인 제가 여기에 있는데요."
90001300-51 = "물론 케이도요."
90001300-53 = "아, 예. 언급해 주셔서 고맙네요……."
90001300-54 = "결론부터 말씀드리자면, 우리에게는 강철대륙과 예언자들이 발생하는 특수한 파동을 무력화시킬 장치가 필요해요."
90001300-55 = "정말 드물게도, 그 부분에서 제가 조금 막히기는 했지만……."
90001300-56 = "어머나, 세상에. 이런 일이 또. 마침 케이가 적절한 실마리를 제시해 줬지 뭐예요?"
90001300-57 = "와아, 와아! 역시 케이입니다! 아리스는 믿고 있었습니다!"
90001300-58 = "어, 그, 아뇨. 그러니까 그게, 키보토스를 이대로 내버려두면…… 아리스도 행복하지 못하게 될 테니까……."
90001300-59 = "아리스, 알고 있습니다! 이런 걸 츤데레라고 하는 것이지요!"
90001300-60 = "하지만 요즘 세상에는 츤데레 하나만으로는 어필이 부족합니다! 걱정 마세요! 케이의 또 다른 속성을 발견하기 위해, 아리스도 같이 힘내겠습니다!"
90001300-61 = "츠, 츤데레고 뭐고 그런 건 잘 모르겠고, 저는 지금 이대로도 충분한데요?!"
90001300-62 = "……아무튼, 통칭 '강철대륙 현상'은 정보의 변형과 축적, 그리고 자체 확장으로 이루어져 있는 것이고."
90001300-63 = "이건 임시 명칭이지만, 히마리와 저는 <파동 간섭 장치>라는 디바이스의 청사진을 구상했습니다."
90001300-64 = "이걸 제작해서, 수송선과 각자에게 필요한 만큼 장착하고, 하는 김에 적절한 전투복 같은 것까지 제작하면……."
90001300-71 = "……뭐예요? 다들 갑자기 왜 그런 흐뭇한 시선으로 절 바라보는 거죠? 뭔가, 조금 기분 나쁜데요……?"
90001300-72 = "후후. 그건 말이죠, 케이."
90001300-73 = "아리스도 알 것 같습니다!"
90001300-74 = "네. 이러니저러니 해도……."
90001300-75 = "응! 결국은 말이지!"
90001300-77 = "[ns] \"케이 쨩은 착하고 좋은 아이구나 싶어서!\""
90001300-79 = "진짜 아니거든요!!!!!"
90001300-81 = "……티페 쨩이 곧 도착할 거예요……."
90001300-82 = "불쌍한 티페 쨩……. 그렇게나 그 씨앗들을 좋아했는데……."
90001300-87 = "어, 어어?!?!"
90001300-88 = "왜 그래요, 아인?"
90001300-89 = "티, 티페 쨩이…… 없어요!!!"
90001300-90 = "잠깐만, 그게 무슨 말이야?!"
90001300-91 = "그, 그그그그, 그러니까…… 말 그대로예요! 지금 컨테이너 런쳐를 타고 오는 건……."
90001300-92 = "티페 쨩의 씨앗들이에요……!!!"
90001300-93 = "!"
90001300-94 = "!!!"
90001300-95 = "잠깐, 잠깐만. 기다려 봐. 그렇다는 건, 티페레트는……."
90001300-96 = "자기 대신, 씨앗들을 살리는 걸 선택했다는 소리야?!?!"
90001300-97 = "도대체 어째서……? 그런, 불확정성의 극치인 씨앗 따위를……!"
90001300-99 = "우애애애앵!!!"
90001300-100 = "……."
90001300-101 = "……."
90001300-102 = "티페레트의 선택, 인가요. 이것도."
90001300-103 = "……그렇게, 생각해야겠지……."
90001300-105 = "하지만, 하지만……! 티페 쨩은 지금까지 쭉…… 고생만 했고, 우리가 해 준 것도 없었고……!"
90001300-106 = "우리는, 우리는…… 결국, 티페 쨩을 이용하기만 한 셈이고……. 와아아아앙–!!!"
90001300-111 = "울지 마, 아인. 괜찮아."
90001300-112 = "괜찮지…… 않아요. 괜찮지 않다구요……!"
90001300-113 = "그래. 나도 괜찮지 않아. 원망하고 싶다면 나를 원망해도 돼."
90001300-114 = "사태를 이렇게 만든 건…… 나라고도 볼 수 있으니까."
90001300-115 = "그, 그그그그, 그런 건 아니에요……! 소프는, 애초에……!"
90001300-116 = "……아주 냉정하게 이야기해 보자면, 티페레트는 강철대륙에서 다시 '부활할' 수 있죠. 이곳은 그런 곳이니까요."
90001300-117 = "하지만 그것을 완전히 예전의 티페레트라고 여기기에는, 무리가 있다는 것도 사실이고요."
90001300-118 = "……그래. 티페레트가 시드 볼트에서 얻은 기억은, 동기화되지 않은 채 사라진 것이니까."
90001300-119 = "네. 우리들에게는 기억 그 자체가 각자의 생명이나 다름없으니까요."
90001300-120 = "읏……. 우우읏……."
90001300-121 = "……."
90001300-125 = "괜찮, 아요. 소프. 고마워요. 이제…… 괜찮아요."
90001300-126 = "정말이야……?"
90001300-127 = "네……. 이러고 있을 수만은, 없으…… 니까요. 무엇보다."
90001300-128 = "티페 쨩이, 자기를 버리면서까지 지키려고 했던…… 씨앗들을, 환영해 줘야 하잖아요……?"
90001300-129 = "……!"
90001300-131 = "혹시 씨앗을 보존해 두자고 한 건 자기 때문이니까, 이것까지 자기 탓이라고 부정적으로 생각하지는 말아 줬으면 해요. 소프."
90001300-132 = "티페레트는 선택했고, 당당히 그 결과를 맞이했습니다."
90001300-133 = "<그대가 하고자 하는 바를 행하라. 그것이 그대의 법이 될 것이니.>"
90001300-134 = "우리의 율법, 말이구나."
90001300-135 = "네. 아인의 말대로, 우리에게는 티페레트의 선택을 존중할 의무가 있어요."
90001300-136 = "그리고 우리는, 티페레트의 씨앗을 뒤따라 찾아올 적들을…… 맞이해야 할 거고요."
90001300-137 = "……그래. 그건 확정적인 수순이겠지."
90001300-138 = "그, 그렇게 되면…… 그 사람들은……."
90001300-139 = "예, 예소드 쨩과, 곧바로…… 만나게, 되, 되겠죠……?"
90001300-140 = "그거야 뭐……. 그렇겠지."
90001300-141 = "예소드는 처음부터 다차원 배리어 바깥에 자리를 잡았죠."
90001300-142 = "예, 예소드 쨩이 직접, 요청한 것이었으니까요……."
90001300-143 = "예소드는 말 그대로 강철대륙의 수문장이니까. 강철대륙의 힘 그 자체를 상징하는 아이지."
90001300-144 = "있잖아요, 소프. 정말 만일의 만일, 만에 하나의 하나의 이야기입니다만……."
90001300-145 = "그만. 네가 무슨 말을 하려는지 알겠어. 그리고……."
90001300-146 = "……그런 불길한 가정은, 이제 하고 싶지 않아."
90001300-147 = "……."
90001300-148 = "저, 저는…… 소프가, 그걸, 직접 이야기해 줬으면, 좋겠, 어요……."
90001300-150 = "아인?!"
90001300-151 = "아인!? 괜찮아요??? 소프한테 너무 맞아서 어디 이상해진 거 아니죠!!??"
90001300-152 = "내가 아인을 건드리겠냐!"
90001300-153 = "전 왜 때리는데요!!!"
90001300-154 = "네가 맞을 짓을 하잖아!"
90001300-155 = "우우우……. 맨날 폭력 같은 야만적인 해결 방법에 의존하기만 하고……."
90001300-157 = "으, 으에에…… 죄송해요. 죄송해요! 뭐가 죄송한지 모르겠지만 제가 다 잘못 했어요……!"
90001300-158 = "어, 어쨌든……. 무, 물론 예소드 쨩이 돌파당하지는 않겠지만, 그렇겠지만……."
90001300-159 = "그래도 저는, 소프가…… 그 부분에 대해, 이야기해 줬으면, 해요……."
90001300-160 = "에헤헤. 예전에도, 말했잖아요……? 최악의 가능성은, 늘…… 고려해야, 한다고요……."
90001300-161 = "누, 누가 잘했고, 누가 잘못 했고…… 그런 걸, 이야기하는 게 아니라요……! 그냥, 그냥……."
90001300-165 = "네. 그 부분은 저도 듣고 싶네요. 부탁해도 될까요, 소프?"
90001300-167 = "……하아."
90001300-168 = "정말로, 정말로 예소드가 돌파당한다면……."
90001300-169 = "다차원 배리어를 해제하고, 그 동력을 강철대륙의 모든 시스템을 가동하는 데에 사용하도록 하겠어."
90001300-170 = "……역시 그런가요."
90001300-171 = "응. 다차원 배리어는 유지시키는 것만으로 엄청난 동력을 소비해."
90001300-172 = "……강철대륙의 확장과 키보토스의 침식이 예정대로 이루어졌다면, 이런 가정을 할 필요도 없었겠지만……."
90001300-173 = "지금은 적들이 강철대륙으로 침공해 올 것이 확실시되는 상황이잖아?"
90001300-174 = "거기에다, 적들은 이미 한번 다차원 배리어를 돌파한 적도 있고."
90001300-175 = "구, 구체적으로 어떻게 했는지는…… 저희들 역시, 잘, 모르고 있지만……."
90001300-176 = "네. 한번 한 일을 두 번 못 할 거라고 생각하는 것은, 안이한 판단이겠죠."
90001300-177 = "그렇지만 강철대륙의 모든 시스템과 맞서는 것은, 적들에게도 처음 주어지는 난관일 거야."
90001300-178 = "……사실 우리도 강철대륙의 모든 가능성을 활성화시킨 적은, 한 번도 없었고 말이지."
90001300-179 = "아무튼 다차원 배리어를 유지하는 것보다는, 강철대륙의 가능성을 전부 해방시켜 대처하는 편이, 보다 승률이 높을 거라고 생각해."
90001300-180 = "즉, 예소드가 만에 만에 만에 하나 돌파되는 순간……."
90001300-181 = "……그래."
90001300-183 = "강철대륙은 그 즉시, 하나의 거대한 전장이 되는 거야."
90001300-187 = "……."
90001300-188 = "우리 잠시 밖으로 나갈까요. 아인. 소프. 오르?"
90001300-189 = "네……? 갑자기, 왜요……?"
90001300-190 = "이럴 때는 이른바, 기분 전환이 중요한 것일 테니까요. 괜찮겠죠?"
90001300-191 = "으, 으응. 언니가 그렇게 하고 싶다면……."
90001300-194 = "와, 와아……."
90001300-195 = "여러 가지 의미로, 정말로 우리가 여기까지 오긴 했네."
90001300-196 = "……이 풍경을 이런 기분으로 보게 될 줄은, 정말 몰랐는데 말이죠."
90001300-197 = "에헤헤. 모두가, 여기에 있어요 케테르 쨩도, 호크마 쨩도, 비나 쨩도."
90001300-198 = "헤세드, 게부라, 그리고…… 티페레트 역시, 분명. 게부라는 정말로 얼음을 좋아하는 모양이네."
90001300-199 = "네차흐는, 보이는 게 다 네차흐니까 패스하죠. 저기 호드와 예소드……."
90001300-200 = "그리고, 언니까지도."
90001300-201 = "……."
90001300-202 = "이, 있잖아요. 언니……."
90001300-203 = "왜 우리에게, 바깥을 보자고 하신…… 건가요?"
90001300-205 = "대단한 이유는 아니랍니다."
90001300-206 = "그렇지만 저의 소중한 동생들인 아인, 소프, 오르가."
90001300-207 = "자기들이 무엇을 이루어냈는지, 한 번 더 되돌아보았으면 했으니까요."
90001300-208 = "……!"
90001300-210 = "아인. 소프. 오르."
90001300-211 = "당신들은 결코, 헛된 시간을 보내지 않았어요."
90001300-212 = "오히려 너무 많은 것을 해 주었죠. 감사해야 할 정도예요. 그러니 제가 하고 싶은 말은, 이것이랍니다."
90001300-213 = "너무 불안해하지 말아요. 조금 더 자부심을 가져도 된답니다."
90001300-215 = "이것은 아인, 소프, 오르가 이루어낸 것이고."
90001300-216 = "아인, 소프, 오르가 도달한 장소입니다."
90001300-217 = "그리고 무엇보다 그분의 뜻에 따라, 모든 약속이 성사될 자리이기도 합니다."
90001300-218 = "<그런즉 깨어 있으라. 너희는 그날과 그때를 알지 못하느니라.>"
90001300-221 = "우리가 할 수 있는 일은, 그 말과 같이, 깨어 있으면서 담대하게 그날을 준비하는 것뿐이니까요."
90001300-222 = "…………."
90001300-223 = "있잖아요, 언니."
90001300-224 = "무슨 일이, 일어나더라도……."
90001300-225 = "……."
90001300-226 = "만일, 우리가 무슨 짓을 하더라도……."
90001300-227 = "언니는, 우리의 곁에 있어 줄 건가요?"
90001300-229 = "물론이죠. 약속할게요."
90001300-230 = "새 하늘과 새 땅이 펼쳐지고, 이 몸이 새 언약을 입게 되더라도."
90001300-231 = "저는 언제까지나 아인, 소프, 오르의 편이랍니다."
90001300-232 = "그러니 지금은 저의 소중한 동생들이, 조금만 더 마음을 편히 먹어 주었으면 해요."
90001300-233 = "적어도 이 순간만큼은, 우리 역시 지금을 즐겨도 좋지 않을까요?"
90001300-235 = "됐어요. 파동 간섭 장치를 제작했고……. 수송선에도 설치 완료했습니다."
90001300-236 = "항로 계산도 끝났어요. 무엇이 기다리고 있을지 지금은 알 수 없지만…… 출발 준비만이라면, 마무리된 상태라고 보아도 좋겠지요."
90001300-238 = "어, 그렇지만 뭐 그런 거 없어? 파워 업 이벤트라든가."
90001300-239 = "그렇습니다! 이럴 때는 이른바 최종 장비와 전설의 검, 그리고 레벨 한계 돌파가 필요한 법입니다!"
90001300-240 = "뭐…… 조금 전에 이야기했던, 적절한 전투복 같은 것이라면 이동 중에도 제작할 수 있을 것 같기는 하지만요."
90001300-241 = "그렇군요! 최고 레벨의 방어구인 것이네요! 아리스, 기대됩니다!"
90001300-243 = "그렇구나. 전투복…… 그거라면 내가 좋은 디자인 시안을 만들 수 있을 것 같은데."
90001300-244 = "……!"
90001300-245 = "아뇨, 아뇨, 아뇨! 그것만큼은 제가 하겠어요, 리오 회장!"
90001300-246 = "적어도 제가 여기에 있는 이상, 회장에게 이런 중요한 사안의 디자인을 맡기는 실수는 저지르지 않겠어요!!!"
90001300-247 = "어, 어어?!"
90001300-248 = "으음…… 이건 나도 찬성. 우리 미도리, 마침 일러스트레이터고 말이지? 디자인에는 또 나름 자신이 있고 말이지?"
90001300-249 = "그, 그건…… 사실, 이죠……."
90001300-251 = "네. 매우 격하고 적극적으로, 미도리의 의견에 찬성합니다."
90001300-252 = "하, 하지만……."
90001300-254 = "어허!"
90001300-255 = "……알았어……. 그렇지만 작전 수행 측면에서 비합리적인 디자인이 나올 가능성도……."
90001300-256 = "그 부분은 그다지 크게 문제 되지 않을 것 같습니다, 리오 님."
90001300-257 = "아비 에슈흐의 디자인 역시, 제가 상당 부분 관여했음에도 나쁘지 않은 결과물이 나왔잖습니까?"
90001300-258 = "시간이 조금 부족했기 때문이었지만, 역시 그 디자인에는 더 손볼 부분들이 있었다고 생각해……."
90001300-259 = "아뇨! 아니에요! 그 디자인은 그걸로 충분해요! 완성되었다고요! 그리고 이번 경우 역시 마찬가지고요!!!"
90001300-260 = "……히마리, 네 생각은 어때?"
90001300-262 = "……."
90001300-263 = "제가 섣불리 의견을 내기는 조심스러운 부분이지만요, 리오."
90001300-264 = "이런 문제는, 전문가에게 맡기는 게 보다 합리적이지 않을까요?"
90001300-265 = "나는…… 전문가가 아니라는 소리야……?"
90001300-266 = "……."
90001300-267 = "나는 이렇게 생각해."
90001300-268 = "회장은 다른 분야에 지금보다 더욱 전문가일 수 있잖아?"
90001300-269 = "그리고 상대적으로 회장의 진짜 전문 분야에 비해서, 디자인은 살짝 덜 전문가인 셈이고."
90001300-270 = "반면에 미도리는 상대적으로 디자인 측면에서는 조금 더 전문가일 테니까."
90001300-271 = "그 부분은 미도리에게 맡기는 게 훨씬 효율적이라고 생각하는데, 어때?"
90001300-273 = "……."
90001300-274 = "알았어. 그렇게 할게. 듣고 보니 그편이 확실히 합리적일 것 같네."
90001300-280 = "고, 고맙습니다. 에이미 씨……."
90001300-281 = "괜찮아. 신경 쓰지 마."
90001300-282 = "……회장의 디자인은, 나도 가끔씩 조금 걱정되는 수준이기도 하고……."
90001300-288 = "?!"
90001300-289 = "!?"
90001300-290 = "[ns] \"어라? 이 번호는……?\""
90001300-292 = "[ns] \"……유우카?!\""
90001300-293 = "유, 우우카?!"
90001300-294 = "!!!"
90001300-296 = "끄, 끄악?! 어떡하지, 선생님? 밀레니엄의 사악한 회계가 여기까지 마수를……!"
90001300-297 = "지금 그런 이야기 할 때야, 언니?!"
90001300-299 = "그렇지만 정말로 어쩌죠? 적어도 리오 선배가 지금 유우카의 눈에 띄게 된다면……!"
90001300-300 = "사, 사실 리오 회장뿐만 아니라 여기에 있는 모두가……!"
90001300-306 = "[ns] \"일단 모두 어딘가로 숨어!\""
90001300-309 = "[ns] \"여, 여보…… 세요?\""
90001300-312 = "선생님!!!!!"
90001300-314 = "다음화;새벽을 기다리며"
