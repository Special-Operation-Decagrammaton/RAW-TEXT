[translation]
1002203-1 = "선도부장과 함께 서류 작업"
1002203-2 = "(히나와 모모톡을 주고 받은 뒤에 곧바로 히나가 묵고 있는 호텔방을 찾았다.)"
1002203-7 = "히나의 숙소"
1002203-10 = "응? 선생……?"
1002203-11 = "……여긴 갑자기 어쩐 일이야?"
1002203-12 = "[s1] \"바쁜 히나를 위해 놀러왔어.\"\n[s2] \"바다에 놀러 와서 일만 하면 아깝잖아.\""
1002203-13 = "고작 그런 이유 때문에 일부러 여기까지 찾아오다니……."
1002203-14 = "고작 그런 이유 때문에 일부러 여기까지 찾아오다니……."
1002203-15 = "마음은 고맙지만……. 고마운 만큼, 곤란해. 선생. 아무리 휴양지를 찾아왔다고는 해도, 우린 놀러 온 게 아니니까."
1002203-16 = "선도부의 자리를 비웠다고 해도, 여전히 처리해야 할 업무는 쌓여 있고."
1002203-17 = "이걸 전부 끝내기 전까지 딴 짓을 할 수는……."
1002203-18 = "게다가 애당초 뭐가 아깝다는 건지, 나는 전혀……."
1002203-19 = "[s] \"모처럼 수영복까지 입었잖아. 아깝지 당연히!\""
1002203-20 = "으, 으응……?"
1002203-21 = "하지만 수영복 차림……이라고 해도, 어디까지나 상황과 장소에 맞춘 것뿐이고 특별한 의미는 없다고 할까……."
1002203-22 = "[s3] \"그렇다면 도와줄게!\"\n[s4] \"둘이서 하면 더 빨리 끝날 거야! 그다음 놀러가자!\""
1002203-23 = "선생이, 날 도와준다고……?"
1002203-24 = "선생이, 날 도와준다고……?"
1002203-25 = "……후후. 정말, 별나다니까."
1002203-26 = "선생이 한 말이 전부 이해가 되는 건 아니지만. 응, 그래."
1002203-27 = "그렇게까지 말한다면, 그 도움, 고맙게 받을게."
1002203-33 = "[ns] \"저기……, 히나 양? 이건……?\""
1002203-34 = "응? 오늘 처리해야 할 업무인데?"
1002203-35 = "선도부의 하반기 운영 계획, 3차 게헨나 도로 정비 사업 보고서, 동아리 부활동 보고서와 회의록…… 그리고 이건……."
1002203-36 = "일단 이것들부터 결재가 필요한 것과 필요하지 않은 것부터 분류해주겠어?"
1002203-37 = "아, 걱정 마. 선생. 물론 이것만으로 전부 끝이 아니니까."
1002203-38 = "후후, 직접 자기 입으로 말한 만큼, 오늘 하루는 철저하게 내 업무에 어울려줘야겠어."
1002203-41 = "(하나를 해결하면 또 하나. 그걸 해결하면 또 하나씩. 끊임없이 밀려드는 서류와 필사의 사투를 벌였다.)"
1002203-42 = "(그렇게 약 5시간 정도가 흐르고 나서야.)"
1002203-45 = "자, 이것으로 마지막이야."
1002203-46 = "[s] \"서류 지옥에서 해~방~이~다~!\""
1002203-47 = "아아. 응. 그러네."
1002203-48 = "고생했어. 선생. 덕분에 예상했던 것보다 업무가 더 빨리 끝났어."
1002203-49 = "이거라면 다행히 늦지 않게 저녁은 먹을 수 있겠네."
1002203-50 = "[s] \"그런 것보다, 자! 놀러 가자!\""
1002203-51 = "아니, 저기……. 아직도 그런 소리를 하는 거야……? 농담 아니었어?"
1002203-52 = "하지만 벌써 시간도 이렇게 늦었고."
1002203-53 = "무엇보다……. 나 같은 거랑 놀아봤자 재미 같은 게 있을 리도 없을 텐데……."
1002203-54 = "[s5] \"분명 즐거울 거야. 히나와 바다에 온 거니까!\"\n[s6] \"히나와 바다에 오는 거, 엄청 기대했으니까……!\""
1002203-55 = "그, 그런 말을 해도……."
1002203-56 = "그, 그런 말을 해도……."
1002203-57 = "……그렇게 호들갑을 떨지 않아도……."
1002203-58 = "(나는 단둘이 이렇게 업무를 할 수 있던 것만으로도 충분히…….)"
1002203-59 = "[s] \"히나 쨩?\""
1002203-60 = "그, 그러니까. 곤란하니까. 그런 호칭은 그만해 줘……."
1002203-61 = "……뭐, 오늘은 늦었으니까. 바다는 얌전히 포기해."
1002203-62 = "그 대신이라고 하기엔 뭣하지만. 아직 라운지는 시간이 남아있을 거야."
1002203-63 = "자, 선생……. 저녁, 어떻게 할래?"
1002203-64 = "[s] \"음! 에스코트는 맡겨만 줘!\""
1002203-65 = "또 그렇게 요란스럽게, 하지만……."
1002203-69 = "후후……. 응, 그럼 잘 부탁해. 선생."
