[translation]
10051060-1 = "제6화;높아지는 명성"
10051060-2 = "어딘가의 뒷골목"
10051060-3 = "헤헤헤…… 드디어 손에 넣었어요!"
10051060-4 = "패션 잡지 <BiBi>와 <ron-ro>의 최신호……!"
10051060-5 = "폐지와 탄피를 모아서 팔고, 끼니는 전부 편의점 폐기 도시락으로 때우고, 수돗물만으로 목을 축이며 돈을 모은 보람이 있네요, 헤헤."
10051060-6 = "……그리고 값의 절반은 선생님이 내줬지."
10051060-7 = "그, 그래도 절반이나 제가 냈어요! 선생님도 기특하다고 해주셨다고요!"
10051060-8 = "무엇보다 이것 봐요! 심지어 <BiBi>의 이번 호에는 샤인캣 디자이너의 특집 기사도 실렸다고요!"
10051060-9 = "키보토스 패션계의 패러다임을 바꾼 천재 디자이너 말이에요!"
10051060-10 = "어? 이번에는 백귀야행 자치구에서 열린 패션쇼를 주관했었다나 봐요."
10051060-11 = "와아……."
10051060-12 = "예쁜 옷들이 정말 많네요……."
10051060-13 = "패션 모델이 되면 이런 예쁜 옷들을 마음껏 입을 수 있는 걸까요?"
10051060-14 = "물론 저처럼 작달막한 키로는 모델은 꿈도 꿀 수 없겠지만……."
10051060-15 = "글쎄…… 그런 쪽도 나름의 수요가 있지 않을까?"
10051060-16 = "에에?! 어째서 그런 취향이 존재하는 거죠?! 그게 바로 세상의 어둠인 건가요?"
10051060-17 = "뭐 그래도 역시 키가 크면 모델로서는 플러스 요소가 되는 건 맞긴 하지."
10051060-18 = "여기 <ron-ro> 특집 기사에 나온 이 오노 츠쿠요라는 신인 모델, 키가 180cm래."
10051060-19 = "거기다가 관계자들 평가도 극찬 일색이네."
10051060-20 = "어, 여기 <BiBi>에도 나와요. 이번에 갑자기 혜성처럼 데뷔한 학생 모델인데, 엄청나게 패션계의 주목을 받고 있네요."
10051060-21 = "평론가들의 평도 엄청나요. <더없이 미숙하지만 그 미숙함을 한참 벌충하고도 남을 정도의 재능이 그녀에게 있다.> <한없이 보석과 가까운 원석>……."
10051060-22 = "이렇게 재능이 넘치는 사람은…… 아마 행복하겠죠?"
10051060-23 = "꼭 그렇지만은 않을 거야."
10051060-28 = "화려하다는 것은, 그만큼 뒤에선 노력하고 있다는 이야기니까."
10051060-29 = "화려한 꽃을 피워내기 위해선, 세심하고 지난한 원예의 과정을 견뎌내야 하는 것처럼 말이야."
10051060-30 = "아츠코 쨩……."
10051060-31 = "그래서 말인데 얘들아."
10051060-32 = "혹시 내가 키우던 허브들의 이파리가 다 어디로 사라졌는지 알고 있어?"
10051060-37 = "저번에 상한 고기를 허브로 밑간할 거라고 말하는 걸 들은 것 같은데……."
10051060-43 = "……얘들아? 얘들아?!"
10051060-45 = "트리니티 학원 광장"
10051060-48 = "그러고 보니, 혹시 이번 달 <하트걸즈> 최신 호 보셨나요?"
10051060-49 = "물론이죠."
10051060-50 = "최근 들어 패션보다 라이프스타일 테마에만 치중했던 것 같아서 안타까웠는데……."
10051060-51 = "이번 최신 호부터 다시 초심을 찾아 패션 테마로 돌아온 것 같아 좋더라고요."
10051060-52 = "맞아요. 평론의 깊이도 깊어지고, 패션의 트렌드와 이슈에 대한 분석도 훨씬 풍부해지고요."
10051060-53 = "아, 그리고 이번에 데뷔한 신인 모델에 대한 평론도 인상적이었어요."
10051060-54 = "아, 그 백귀야행 출신 모델 말씀이시군요. 이름이……."
10051060-55 = "아마 오노 츠쿠요, 였지요?"
10051060-56 = "맞아요! 화보만 봐도 뿜어져 나오는 아우라가 굉장한 모델이더라고요."
10051060-57 = "업계인과 평론가들도 모두 입을 모아 극찬을 하고 있고요."
10051060-58 = "어떤 모델로 성장하게 될지 기대가 되네요."
10051060-64 = "밀레니엄 학원"
10051060-68 = "음? 뭘 보고 있는 거야?"
10051060-69 = "학술지?"
10051060-70 = "학술지라니 무슨 그런 흉흉한 말을……"
10051060-71 = "<ron-ro>의 이번 달 최신 호야."
10051060-72 = "트렌드에 뒤처지지 않기 위한 필독서라 할 수 있지."
10051060-73 = "<ron-ro>? 그게 뭔데?"
10051060-74 = "<ron-ro>를 몰라……? 유명한 패션 잡지잖아."
10051060-75 = "패션 잡지라……."
10051060-76 = "난 교복 사이즈 잴 때 이후로는 패션이란 것에 신경을 써본 적이 없는 것 같은데……."
10051060-77 = "논문 보느라 다른 텍스트는 볼 시간이 없기도 하고."
10051060-78 = "어…… 응…… 그래, 그럴 수 있지."
10051060-79 = "그런데 굉장히 집중해서 읽던 것 같은데, 뭐 재밌는 거라도 있어?"
10051060-80 = "아, 이번에 새로 데뷔한 패션모델과 관련된 평론을 읽고 있었어."
10051060-81 = "업계에 들어온 지는 얼마 되지 않았는데, 굉장히 주목을 많이 받고 있더라고."
10051060-82 = "어디 보자, 이름이…… 츠쿠요?"
10051060-83 = "오호…… 확실히 풍기는 아우라가 다르긴 하네."
10051060-89 = "크로노스 방송국 인터뷰실"
10051060-91 = "자, 그럼 지금까지 인터뷰에 협조해 주셔서 감사합니다, 츠쿠요 씨!"
10051060-92 = "네, 네에…… 저도 감사합니다아아……."
10051060-93 = "그러면 마지막 질문! 츠쿠요 씨의 앞으로의 계획을 한 줄로 말씀해 주실까요!"
10051060-94 = "예, 예?!"
10051060-95 = "저, 저는 그, 앞으로…… 그……."
10051060-99 = "……."
10051060-100 = "그, 그, 그게……."
10051060-102 = "자, 츠쿠요 씨! 긴장 푸시고요! 심호흡 한번 하고, 안에 있는 이야기를 솔직하게 말씀하시면 됩니다!"
10051060-103 = "솔…직하게……."
10051060-104 = "(찌릿)"
10051060-105 = "그, 아, 앞으로, 머, 멋진 패션모델이 되도록 최선을 다하겠습니다……?"
10051060-106 = "(끄덕)"
10051060-107 = "네! 투박하지만 솔직한 마음의 소리! 잘 들었고요!"
10051060-108 = "그럼 앞으로 츠쿠요 씨의 모델 인생에 꽃길만 펼쳐지길 바라며! 광고 듣고 가시겠습니다!"
10051060-114 = "수고했다. 첫 방송 인터뷰라 긴장했을 텐데."
10051060-115 = "저, 저기…… 이게 대체 어떻게 되어가는 상황인지……."
10051060-116 = "그래, 지금 네가 어떤 상황인지 당장은 이해하기 어렵겠지."
10051060-117 = "하지만 이 화면을 봐라. 방금 네가 나온 생방송 인터뷰를 몇 명이 봤는지, 얼마만큼의 조회수가 나왔는지, 어떤 반응들이 나왔는지."
10051060-118 = "……!"
10051060-119 = "어때? 이런 숫자는 처음 보지?"
10051060-120 = "이것이 네가 만들어낸 숫자다. 네가 이끌어낸 시선들이야."
10051060-121 = "이것이 너의 재능이다. 너 정도의 재능은, 이렇게 시대의 응답을 받는 법이지!"
10051060-122 = "하, 하지만 저는 인법연구부를……."
10051060-123 = "난 인법이 뭔지 모른다. 닌자가 뭔지도 몰라."
10051060-124 = "하지만 한 가지는 확실히 안다. 넌 최고가 될 거라는 것."
10051060-125 = "그렇지만 저는 닌자가……."
10051060-126 = "하나를 쥐려면 다른 하나는 놓아야 하는 법. 어느 쪽을 놓을 테냐?"
10051060-127 = "저는……."
10051060-128 = "답을 모르겠나? 그럼 내가 알려주지. 나를 따라와라. 그게 답이다."
10051060-129 = "그렇지만……."
10051060-134 = "그리고 조금 전 너는 수많은 시청자들 앞에서 모델이 되겠다고 공표까지 하지 않았나?"
10051060-135 = "……!"
10051060-136 = "그 공개적인 약속을, 어길 생각은 아니겠지?"
10051060-137 = "가시죠. 차량 준비해 놨습니다."
10051060-138 = "좋아, 가자."
10051060-147 = "<소녀인법첩 미치룻치> 촬영 장소"
10051060-148 = "부장! 이것 보세요! 지난주에 올린 영상 조회수가 무려 2가 늘었습니다!"
10051060-149 = "오옷! 이렇게 또 닌자의 향취에 취할 자들이 늘었군!"
10051060-150 = "츠쿠요! 츠쿠요도 이리 와서 이것 좀 봐봐!"
10051060-154 = "츠쿠요 공은 아직 안 왔습니다, 부장."
10051060-155 = "엥? 아직도?"
10051060-156 = "늦네, 츠쿠요……."
10051060-157 = "사실 아까부터 모모톡도 계속 보내 봤는데 확인을 하지 않습니다…… 닌닌……."
10051060-158 = "이상하네, 매주 이 시간마다 촬영이 있는 건 누구보다 잘 알고 있을 텐데."
10051060-159 = "설마 무슨 일이 생긴 건 아니겠지?"
10051060-160 = "냐하하, 오늘의 촬영 장소는 이곳인가요?"
10051060-161 = "응?"
10051060-162 = "어, 너는……!"
