[translation]
51170-1 = "제17화;거리를 거니는 괴담 1"
51170-2 = "등불 축제장 광장"
51170-4 = "여기! 준비 끝났어요!"
51170-12 = "무녀님의 등장입니-다!"
51170-20 = "아아! 역시 예상한 대로 잘 어울리세요! 아가씨!"
51170-22 = "어디 불편하신 데는 없나요? 혹은 뭔가 필요한 게 있다든가……."
51170-24 = "괜찮사와요. 이런 복장은 익숙하니까."
51170-25 = "후후! 네! 맞습니다! 이것이 바로 카데노코지로서 올바른 모습! 저희들이 이제나저제나 하고 바랐던 모습이랍니다!"
51170-26 = "아가씨께서 백화요란을 그만두고 이렇게 돌아와 주셔서! 이 얼마나 다행인지……!"
51170-27 = "네! 이것으로 더는 걱정할 것 없이 전부 원래대로, 올바르게 돌아가겠네요!"
51170-32 = "어흠. 유카리 양."
51170-33 = "이번 축제의 클라이맥스는 아시다시피 축제가 무르익었을 무렵- 저곳에 마련된 무대에서 <카데노코지의 무녀님>이 제의의 춤을 추는 것이에요."
51170-34 = "방송 장비도 준비되었으니, 유카리 양께서 추는 춤은 TV나 인터넷을 통해 백귀야행 전체에 중계될 예정인데……."
51170-35 = "그 춤이 가지는 의미는 송구영신……."
51170-37 = "네! 더욱 나은 내일을, 보다 멋진 미래를…… 그 너머를 바라는 의미를 가지고 추는 춤이랍니다!"
51170-38 = "아쉽게도 20년 전을 끝으로 명맥이 끊겼다고 들었는데. 이번 기회에 다시 볼 수 있다니!"
51170-39 = "저도 무척 기대가 됩니다!"
51170-44 = "그 식순과 순번이라면 여기에 정리를 해두었으니……."
51170-45 = "후후. 그거라면 걱정할 필요 없답니다. 아가씨께선 어려서부터 제의와 관련된 <춤>이라면 빠짐없이 성실히 공부하고 익혀 오셨으니까요."
51170-46 = "……그런가요?"
51170-48 = "네, 그것이 원래부터 제가 해야 했을 일이고 의무."
51170-49 = "의식의 순번이라면 전부 기억하고 있으니 걱정할 필요는 없사와요."
51170-50 = "그렇다면 다행이지만……."
51170-51 = "……정말 괜찮은, 거죠……?"
51170-52 = "네."
51170-53 = "소녀는………."
51170-54 = "소녀는, 괜찮사와요."
51170-55 = "알았어요."
51170-56 = "자, 그럼 무대로 가시죠!"
51170-61 = "네…… 이것으로 된 것이어요."
51170-66 = "전부."
51170-72 = "이런 일이 있었어."
51170-73 = "결국 진짜로 해버린 거냐…… 유카리랑 계승전이라니……"
51170-74 = "아니, 그것도 다른 누구도 아닌 너랑 했다는 시점에서 진심이냐, 싶기도 한데. 그렇다고는 해도……."
51170-75 = "……그래서, 그걸 내게 말해주는 이유가 뭐야?"
51170-76 = "…………"
51170-77 = "그 아이는 조정실에 찾아오기 전, 너와 먼저 만났었지."
51170-78 = "그러니 의리 차원에서, 그 결과에 대해 알릴 필요가 있다고 생각했을 뿐이야."
51170-79 = "유카리…… 그렇게까지 말했는데, 아직도 포기를 못 하고……"
51170-80 = "……칫! 알 게 뭐야. 나는 경고했어. 돌아가봤자 소용없다고."
51170-81 = "그러니 이제 됐어. 키쿄."
51170-82 = "…………됐다니?"
51170-83 = "그런 식으로 아직도 미련이 남아있다는 듯이…… 구차하게 연락할 필요 없단 말이야."
51170-84 = "배려라니 쓸데없어. 난…… 이미 내 청춘을 찾아 떠나기로 마음먹었으니까."
51170-85 = "더는 끝나버린 백화요란 따위에, 관심 없다. 이거야."
51170-91 = "…………………………………………그래."
51170-92 = "넌, 그랬지. 그걸 위해 떠났었지."
51170-93 = "……알았어. 잘 말해줬어. 나도 동감이야. 이야기는 이걸로 끝. 렌게, 너도 결심한 대로 어디 멋대로 하도록 해."
51170-94 = "친구 된 도리로서 적어도 앞으로 잘 먹고 잘살기를 빌어줄게."
51170-95 = "그게 어느 정도냐면…… 그래, 앞으로 10kg 정도 포동포동하게 살이 오르는 정도가 좋겠네."
51170-96 = "뭐?! 너, 잠깐……!"
51170-100 = "아니아니, 끝까지 자기가 하고 싶은 말만 하고 내빼기야?! 키쿄 녀석!"
51170-101 = "으으으으……!"
51170-102 = "너나 잘 먹고 잘살지. 그래?! 앙?!"
51170-103 = "후우…… 후우……. 나참. 진짜……."
51170-104 = "다 끝났잖아. 근데 왜 아직도……."
51170-106 = "우와아앗?!"
51170-107 = "뭐야?! 무슨 일 있어?! 렌게 선배!"
51170-108 = "렌게 쨩?"
51170-109 = "후아암?"
51170-114 = "아…… 아무것도 아냐."
51170-115 = "그냥 이쪽의 이야기……랄까. 이미 지나간 일이라고 할까."
51170-116 = "백화요란의 일, 말이죠?"
51170-117 = "그건 그런데……"
51170-118 = "아니, 이제 괜찮아! 백화요란의 일 따위…… 더는 신경 쓸까 보냐!"
51170-119 = "흠흠. 모처럼의 축제잖아? 수행부의 멤버로서 즐기기도 바쁜 마당에, 쓸데없는 데 신경 쓸 여유 같은 것도 없고."
51170-120 = "그 왜…… 축제를 힘껏 즐기는 것도 수행의 일환! 청춘은 기다려 주지 않으니 지금부터라도 밤을 달리자, 소녀여! 잖아."
51170-121 = "안 그래? 츠바키 부장, 미모리 부부장. 카에데."
51170-127 = "거짓말이 서툴러요. 렌게 쨩."
51170-129 = "응……?"
51170-132 = "백화요란 따위, 라니, 본심은 그게 아니잖아요?"
51170-133 = "맞아! 렌게 선배. 여기 와서도 계속 백화요란의 이야기를 하던 게 미련 뚝뚝이라구!"
51170-135 = "아, 아니……! 아무리 그래도 그 정도까지는……."
51170-136 = "정말로 전혀 신경 쓰지 않았다면……. 전화를 하고 나서 화를 낼 일도 없지, 않았을까?"
51170-141 = "츠바키 쨩 말이 맞아요. 렌게 쨩. 이대로 전부 끝내고 싶지 않은 거죠?"
51170-142 = "후후, 아니라고 말하고 싶겠지만. 미모리 선배는 무려 백귀야행 학원 최강의 독심술사니까! 이미 렌게 선배의 마음은 전부 읽어버렸다구!"
51170-143 = "그 앞에서 거짓말은 소용없어! 렌게 선배!"
51170-144 = "아, 아이참. 카에데 쨩! 그런 게 아니라니까요~!"
51170-150 = "……왜, 다들 그런 말을 하는 거야."
51170-151 = "이미…… 다 끝난 일이잖아."
51170-152 = "아무리 목소리를 높여도, 나구사 선배도, 부원들도…… 떠나지 말았으면 하는 사람들은 돌아오지 않고."
51170-153 = "그럴 거면 차라리…… 전부 끝내는 게 좋다고."
51170-154 = "다 내던지고…… 나도 청춘을 찾으려고 이렇게 왔을 뿐인데. 그런데…… 왜……."
51170-155 = "그런 것치고 렌게. 유카리, 그 아이에게 다정했지."
51170-156 = "내가……? 유카리에게? 그럴 리가 없잖아."
51170-157 = "그때의 난 유카리에게 상처가 되는 말만……."
51170-158 = "렌게는 기다리는 사람이 괴로울 뿐이라면, 그런 건 없어져도 상관없다. 라고 했었어."
51170-159 = "그때 렌게가 했던 말이, 실은 전부 유카리를 위해…… 후배가 상처 입지 않았으면 하는 마음에 꺼낸 배려라는 걸…… 아마 다들 알고 있을 거야."
51170-160 = "키쿄 쨩과는 소꿉친구 사이, 라고 했었죠."
51170-161 = "…………"
51170-162 = "가끔 그럴 때가 있어요. 걱정이 된 나머지 자기 본심과 다른 말을 할 때가."
51170-163 = "너무 걱정이 된 바람에, 화가 나서 나도 모르게 후회할 말을 할 때가……"
51170-164 = "저도 그런 적이 있어서 잘 알고 있는걸요."
51170-166 = "미모리 선배도?! 정말?!"
51170-167 = "후후. 네, 카에데 쨩."
51170-168 = "저도 츠바키 쨩과 소꿉친구잖아요? 우리 사이에 얼마나 많은 일이 있었는데요."
51170-169 = "그쵸? 츠바키 쨩."
51170-171 = "…………정말로 화났을 때의 미모리는, 무서워……."
51170-173 = "오오! 나두 알 거 같애! 그거!"
51170-174 = "네, 넷?!"
51170-175 = "두 사람도 차암……."
51170-179 = "그러니 렌게 쨩."
51170-184 = "……이미."
51170-185 = "난 이미 백화요란을 나와서…… 이렇게 수행부에 체험입부까지 했는데, 이제 와서 염치없이……."
51170-186 = "그래도 아직 렌게 쨩에겐 남아있는 거죠? 소중한 사람들에게 전해주고 싶은 본심이."
51170-187 = "……아직, 괜찮은 걸까……. 뻔뻔하다고, 생각하지 않을까……?"
51170-188 = "중요한 건 하고 싶냐 아니냐. 그거라고 생각해요. 렌게 쨩."
51170-189 = "미모리 부부장……."
51170-195 = "……렌게의 체험 입부는 이것으로 종료야. 이건 부장으로서의 명령."
51170-197 = "어?!"
51170-199 = "하고 싶은 일을 해야 할 때. 라는 거야. 그거라면."
51170-200 = "저희도 도와줄 테니까요."
51170-201 = "일단은 같은 수행부였던 정으로! 말이야! 그치?!"
51170-203 = "츠바키, 미모리, 카에데……."
51170-209 = "……응. 하고 싶은 거라면 있어."
51170-211 = "키쿄에게 들었어."
51170-212 = "자기가 조금, 유카리에게 심한 소리를 한 거 같다고."
51170-213 = "그래서…… 걱정된다고. 유카리를 가서 봐줬으면 좋겠다고."
51170-215 = "……자기가 하면 될 일을 남에게 시키는 점이 그 녀석 답긴 하지만."
51170-216 = "나, 유카리를 찾아서 대화를 나눠보고 싶어."
51170-219 = "네, 그럼 지금이라도 같이 만나러 가보도록 해요."
51170-220 = "좋아! 다 같이 출동인 거네!"
51170-222 = "다들 고마워."
51170-230 = "어, 폭죽이다!"
51170-231 = "등불 축제가 본격적으로 시작되었나 보네요."
51170-232 = "저희도 늦기 전에 얼른………"
51170-237 = "우와아앗! 도, 도망쳐!"
51170-242 = "무슨 일이 있나?"
51170-253 = "……어어어?! 츠바키 선배! 미모리 선배! 저, 저게 뭐야?!"
51170-254 = "!!"
51170-256 = "……뭔지는 모르겠지만 친구가 될 수 있을 것 같은 느낌은 아니네."
51170-266 = "큿……! 모두 조심해!"
51170-267 = "온다!"
51170-278 = "이, 이, 이, 이게 무슨 일이야아앗?!"
51170-284 = "우, 우냐아아악?!"
51170-297 = "부장! 괜찮으신가요?!"
51170-298 = "부장니이이임~!"
51170-300 = "아, 으, 응! 난 괜찮은데……!"
51170-301 = "그보다 축제장이 엉망으로……!"
51170-302 = "이 괴물들은 대체 어디서 튀어나온 거냐구웃?!"
51170-304 = "부장 이건…… 마치 저번에, 하늘이 붉게 물들었을 때와 같은………"
51170-305 = "네, 네에엣?! 그, 그때랑 똑같이…… 말인가요?!"
51170-306 = "부, 부장님! 이즈나 쨩! 이, 이제 어쩌면 좋죠?!"
51170-308 = "나, 나, 나도 모르겠어!"
51170-309 = "여기저기서 마구 나타나고 있어서……! 어, 어디서부터 뭘 하면 좋을지……!"
51170-314 = "(도, 도망쳐야 하나?!)"
51170-315 = "(하지만, 아직 사람들이 축제장에 남아있어서 위험……)"
51170-316 = "(그치만! 부장으로서 이즈나와 츠쿠요까지 위험에 처하게 내버려 둘 수는……!)"
51170-324 = "우와아앗?!"
51170-325 = "부장님!!"
51170-332 = "괜찮아요! 걱정할 필요 없습니다! 부장! 츠쿠요 공!"
51170-335 = "이, 이즈나?"
51170-336 = "이즈나 쨩……?"
51170-338 = "이곳 백귀야행 학원엔 마침 주군이 계시니까요!"
51170-339 = "주군은 저희, 인법연구부에게 도움을 요청하셨습니다!"
51170-345 = "그럼 거기에 응해! 이즈나는 전력을 다하겠어요!"
51170-346 = "……응! 이즈나의 말이 맞아! 일단은 여기선 사람들을 돕자!"
51170-347 = "이런 일이 벌어지면…… 선생 공이 어떻게든 해줄 테니까!"
51170-352 = "그때까지 우리 인법연구부…… 백귀야행의 특수 에이전트 요원은 위험에 빠진 사람을 돕는 거야!"
51170-354 = "네, 넷! 알겠습니다!"
51170-355 = "그럼! 작전 개시입니다! 닌닌!"
51170-365 = "카호 부부장님! 축제장 외곽에서 정체를 알 수 없는 것들이 등장해 소동을 피우고 있다고……!"
51170-366 = "서쪽 지구에서 벌어진 혼란 때문에 부상자가 속출한다는 소식이!"
51170-367 = "카호 부부장님! 상인회로부터 정체불명의 괴물이 나타났다는 신고가……!"
51170-369 = "카호 부부장님……! 대체 어떻게 해야……!"
51170-371 = "여러분 진정해 주세요! 잠시, 진정을……!"
51170-372 = "……이게, 대체……."
51170-373 = "축제장에 정체불명의 <괴이>가 나타나기 시작했다니, 이를 어찌해야……. 니야 님!"
51170-379 = "축제에 맞춰 갑작스럽게 시작된 미지의 습격…… 지금 벌어지는 사태의 전조를 예견한 단서라면……"
51170-380 = "한 가지."
51170-382 = "……화조풍월부."
51170-387 = "……그 편지는 단순히 백귀야행의 소요사태를 예고했을 뿐인, 협박이라고 판단했어."
51170-392 = "때문에 지리멸렬한 <풍문>에 샬레를 끌어들여 빚을 만드는 것은, 하책 중의 하책이라 판단했을 뿐."
51170-393 = "그런데 처음부터 나의 판단 미스……였다?"
51170-395 = "애당초 화조풍월부는 기록과 소문, 풍문으로만 남아있는 괴담에 지나지 않았을 터."
