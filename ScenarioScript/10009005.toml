[translation]
10009005-3 = "크억!"
10009005-4 = "끄, 끄아아앙?!"
10009005-10 = "다행히 응급상황이 벌어지기 전에 미리 막을 수 있었군요."
10009005-11 = "이대로 시체……"
10009005-12 = "가 아니라 부상자들은 현장을 벗어나, 병동으로 이송하도록 하지요."
10009005-13 = "도, 도와주셔서 감사합니다!"
10009005-14 = "아뇨. 저는 어디까지나 응급의학부로서 할 일을 했을 뿐, 감사를 받을 일은 전혀……."
10009005-15 = "[s] \"어라? 세나……?\""
10009005-16 = "음?"
10009005-17 = "아, 안녕하세요. [USERNAME] 선생님. 이런 곳에서 뵙다니 의외로군요."
10009005-18 = "선생님께선……. 순찰을 위해?"
10009005-19 = "아아, 샬레의 업무로군요."
10009005-20 = "……제가 이곳에 있는 이유, 말씀이십니까?"
10009005-21 = "사전에 이 근처에서 시체……."
10009005-22 = "실례, 부상자가 나올 정도의 다툼이 벌어졌단 신고를 받고 출동했습니다."
10009005-23 = "그 밖에도 응급의학부 활동의 일환으로 이 주변에서의 자율 순찰도 겸하고 있습니다만……."
10009005-24 = "[s] \"응? 응급의학부가 순찰도 해?\""
10009005-25 = "음, 발렌타인 데이란 각자가 소중한 마음을 품고 초콜릿을 준비하여 선물하는, 무척이나 특별한 날이니까요."
10009005-26 = "그건 무척이나 바람직한 행사라고 생각합니다."
10009005-27 = "[s] \"세나가 그렇게 생각하고 있었다니 조금 의외…….\""
10009005-28 = "다만 그만큼 오늘 같은 날, 키보토스에선 더욱더 주의가 필요합니다."
10009005-29 = "아까와 같은 경우처럼 특별한 초콜릿을 노린 상습적인 습격과 기습."
10009005-30 = "……그 외에도 초콜릿의 매상을 두고 상인 간에 벌어지는 암투 따위의 갈등, 특정한 정인의 마음을 얻고자 다양한 거대 세력이 항쟁을 거듭하기도 하는 등."
10009005-31 = "언제 어디서 어떤 사건이 벌어져 대량의 시체……가 아니라, 부상자가 발생할지."
10009005-32 = "한시도 긴장의 끈을 놓을 수 없는 것이 바로 키보토스의 발렌타인 데이."
10009005-36 = "응급의학부의 부장으로서 그러한 대목……"
10009005-37 = "아니, 불상사를 막고자 움직이고 있는 중이었습니다."
10009005-38 = "[s] \"아니, 아무리 그래도 그런 일이 일어날 리가…….\""
10009005-39 = "아뇨. 방심은 금물입니다."
10009005-40 = "예를 들면 지금 당장이라도-"
10009005-44 = "[ns] \"응……?\""
10009005-46 = "무, 무슨 일이여?!"
10009005-47 = "갑자기 건물 귀퉁이가 무너졌다고?!"
10009005-48 = "아, 지금 막 뉴스가……!"
10009005-50 = "긴급속보! 긴급속보입니다! D.U. 자치구의 제3번 상점가 주변에 계신 시민 여러분께 알려드립니다!"
10009005-51 = "지금 막 극악무도한 범죄자 <재액의 여우>가 나타났다는 소식입니다! 해당 상점가 근처에 계신 분께서는 피난을 서둘러 주십시오!"
10009005-52 = "[s] \"……재액의 여우?\""
10009005-59 = "……."
10009005-61 = "상점가 현장에서 예의 지명수배범 재액의 여우를 확인!"
10009005-62 = "무슨 목적을 가지고 나타났는지는 모르겠지만. 더 이상 도망칠 수는 없다! 얌전히 투항해라! 코사카 와카모!"
10009005-68 = "어라라. 또 귀찮은 날파리들이 달라붙는 건가요."
10009005-69 = "……곤란하지요. 제 앞을 가로막는 일 따윈."
10009005-79 = "크, 크아악?!"
10009005-80 = "다, 당했다~~!"
10009005-86 = "후후후♡ 네에, 겨우 이 정도로 절 막으려고 하다니, 소용없답니다."
10009005-87 = "자아, 멀지 않았지요. 제가 바라는 건 바로 이 앞에……."
10009005-95 = "……!!"
10009005-100 = "……대량의 부상자가 발생할 요소를 확인, 응급의학부 부장으로서 해당 응급 사태에 대응하도록 하겠습니다."
10009005-101 = "이 이상의 환자를 늘리는 행위, 용납할 수 없습니다."
10009005-102 = "……이번엔 발키리 학생이 아닌, 다른 분께서 가로막겠다는 건가요?"
10009005-103 = "아아, 곤란하네요. 정말 곤란해요. 어찌하여 저의 목적을 방해하려는 이들로 이렇게나 가득한지. 전 그저……"
10009005-104 = "[s] \"잠깐 기다려……!\""
10009005-109 = "빈틈 발견!"
10009005-111 = "……?!"
10009005-112 = "키리노! 바로 지금이야!"
10009005-114 = "네-네, 넵!"
10009005-118 = "재, 재, 재, 재, 재액의 여우 씨!! 가, 각오하세요!"
10009005-125 = "좋았어! 선생!"
10009005-126 = "키리노의 정면 사격으로 빈틈이 생긴 이때가 기회……!"
10009005-128 = "(털썩-)"
10009005-129 = "[s] \"……응?\""
10009005-134 = "어, 어라……?"
10009005-138 = "쓰, 쓰러트려버렸, 는데요?"
10009005-139 = "……진짜?"
10009005-144 = "응급 사태 제압 완료."
10009005-145 = "모두 고생하셨습니다."
10009005-146 = "네……??"
10009005-148 = "굉장하잖아. 키리노! 재액의 여우를 이렇게 간단하게 쓰러트리다니! 한 건 해냈다고!"
10009005-149 = "아, 네, 그, 정말로, 그게, 맞을 줄은 몰랐달까……."
10009005-150 = "어라? 진짜 왜 맞은 거죠?"
10009005-151 = "자기가 해놓고 그런 말을 하기야……?"
10009005-152 = "흐음, 뭐, 과정이야 어찌 되었든 간에,"
10009005-153 = "무려 그 무시무시한 일곱 죄수 중 하나를 붙잡은 거잖아?"
10009005-154 = "이건 자랑스럽게 어깨를 펴도 되는 일이야."
10009005-155 = "그, 그럴까요?"
10009005-156 = "[s1] \"잠깐, 와카모가 재액의 여우라니? 뭐야? 그 불길한 별명은?\"\n[s2] \"그리고 일곱 죄수란 건 또 뭐고……?\""
10009005-157 = "그러고 보니 선생은 분명…… 와카모와 구면이었지?"
10009005-158 = "그러고 보니 선생은 분명…… 와카모와 구면이었지?"
10009005-159 = "아! 저도 예전에 발키리 경찰학교의 자료에서 본 적이 있어요!"
10009005-160 = "지난 날 와카모가 교정국을 탈옥했을 당시, 그때의 혼란을 해결했던 게 [USERNAME] 선생님의 활약이었다고!"
10009005-161 = "[s3] \"아, 확실히 예전에 한 번 그랬던 적이 있었던 듯한…….\"\n[s4] \"그게 한 번만이 아니었던 듯하기도 한…….\""
10009005-162 = "으음, 무슨 소리인지 모르겠지만."
10009005-163 = "으음, 무슨 소리인지 모르겠지만."
10009005-164 = "하여간 재액의 여우라는 건, 문제아 코사카 와카모의 별명이야."
10009005-165 = "나타난 곳 어디든 폭발과 폭연을 몰고 다닌다는 의미에서 붙은 제2의 이름."
10009005-166 = "그리고 일곱 죄수란 건……."
10009005-167 = "선생님도 알다시피 과거 총학생회장의 실종 직후, 총학생회가 마비된 틈을 노려 와카모와 함께 교정국을 탈옥한 학생들을 말해요."
10009005-168 = "[s] \"그게 일곱 명이나……?\""
10009005-169 = "맞아! 지금 이 순간에도 키보토스의 뒷골목에는 와카모급의 범죄자가 숨어있다는 뜻이라고!"
10009005-170 = "그것도 무려 일곱 명이나! 그래서 부르기를 일곱 죄수!"
10009005-171 = "진짜 무시무시한 이야기지?!"
10009005-175 = "[ns] \"으, 응. 그, 그래…….\""
10009005-176 = "뭐야, 반응이 너무 약하지 않아?"
10009005-177 = "그야 갑자기 그런 말을 들으면 당황하게 되는 것도 어쩔 수 없죠. 후부키!"
10009005-178 = "하여간 그 일곱 죄수 중에서도 특히나 난폭하게 날뛰던 게, 방금 제압한 재액의 여우. 와카모란 거지."
10009005-179 = "모습을 감춘 채로 그간 어디서 뭘 하나 했더니,"
10009005-180 = "여기서 한 명을 붙잡을 줄이야."
10009005-181 = "이거, 잘하면 포상이 나올지도?!"
10009005-182 = "후부키, 또 그런 소리인가요……."
10009005-183 = "에이, 너무 딱딱하게 굴지는 마."
10009005-184 = "선생이랑 거기, 게헨나의 학생도 도와줘서 고마워!"
10009005-185 = "나중에 포상금이 나오면 한 턱 쏠 테니 기대하라고!"
10009005-186 = "아뇨. 응급의학부 부장으로서 해야 할 일을 했을 뿐입니다."
10009005-187 = "뭐야~ 이 정도는 그냥 받아도 아무도 뭐라고 안 해~"
10009005-188 = "[s] \"……그런데 뭔가 와카모, 낌새가 이상하지 않았어?\""
10009005-189 = "낌새, 말인가요?"
10009005-190 = "네. 필시 무언가 목적성을 가지고 난동을 부리고 있었다고 생각합니다만. 저희와 마주친 직후 당황하는 기색이 역력했습니다."
10009005-191 = "예상치 못한 트러블이 있었던 걸까요?"
10009005-192 = "[s] \"으음.\""
10009005-193 = "뭐, 이제 와서 생각해봐야 무슨 소용이겠어?"
10009005-194 = "그런 문제아를 상식으로 이해하려고 하는 것 자체가 소용없고."
10009005-195 = "뭣보다 체포했으니 다 끝난 일이잖아?"
10009005-196 = "[s] \"하지만…….\""
10009005-202 = "D.U. 자치구에 있는 모든 발키리 학생들에게 알린다. 현 시간부로 도주 중이던 지명수배범 <재액의 여우>를 체포하는데 성공했다!"
10009005-203 = "해당 문제아를 교정국으로 이송하기 위해 지원이 필요하므로, D.U. 자치구에 남아있는 발키리 경찰학교의 학생들은 전원 이 통신을 듣는 즉시 자치구 동쪽 지구로……."
10009005-204 = "후부키! 호출이네요! 가죠!"
10009005-205 = "엑~ 이거, 나도 가야 하는 거야? 교정국까지? 귀찮은데……."
10009005-206 = "귀찮아 할 때가 아니라구요! 후부키! 이렇게 된 거! 마지막까지 확실히 해야죠!"
10009005-207 = "으으, 하긴 안 가면 분명 시말서 행일 테니까……. 공적을 세웠는데 여기서 까먹을 수야 없지……."
10009005-211 = "그럼 다녀올게. 선생."
10009005-212 = "우리가 없어도 그동안 순찰 업무. 잘 부탁해."
10009005-213 = "다녀오겠습니다!"
10009005-218 = "그럼 소동도 마무리된 것 같으니, 저희도 순찰 업무를 계속하도록 하죠."
10009005-219 = "[s5] \"아, 응……. 같이 하는 거구나.\"\n[s6] \"그보다, 재액의 여우…… 와카모인가. 으음…….\""
10009005-223 = "(가슴 한구석에 약간의 술렁거림을 남긴 채로, 세나와 함께 발렌타인 데이의 순찰 업무를 시작했다.)"
