[translation]
32080-1 = "제8화;보이기 시작하는 희망"
32080-2 = "늦어!"
32080-3 = "아하하…… 아즈사 쨩…… 먼저 와 있었네요?"
32080-4 = "당연하지. 난 이미 해가 뜨기 전에 준비를 끝내고 여기서 예습과 복습을 하고 있었어."
32080-5 = "어머나…… 오늘따라 의욕이 넘치네요, 아즈사 쨩."
32080-6 = "당연해. 오늘도 모의 시험을 칠 거잖아?"
32080-7 = "아, 네. 맞아요. 오늘도 예정대로 시험을 칠 건데……. 시험 준비를 하고 있었던 거예요, 아즈사 쨩?"
32080-8 = "음. 평가 시험도 이틀밖에 남지 않았고, 언제까지 모두에게 걱정을 끼칠 수는 없으니까."
32080-13 = "오늘에야말로 낙제를 벗어나겠어."
32080-14 = "뭐, 뭐야…… 기합이 엄청 들어가 있어……."
32080-15 = "시험 범위의 예상 문제들도 몇 번이고 반복해서 풀어두었고. 대비는 완벽해."
32080-16 = "나, 나도 지지 않을 거니까! 정의실현부의 엘리트의 힘을 보여 주겠어!"
32080-17 = "네♡ 그럼 저도 최선을 다해서 노력할게요!"
32080-18 = "[s] \"모두들 뜨겁네.\""
32080-22 = "아, 아하하…… 그럼 이 기세를 몰아…… 모의 시험을 바로 시작해볼까요?"
32080-24 = "제3차 보충수업부 자체 모의 시험"
32080-26 = "[ns] \"그럼 시작-!\""
32080-30 = "……."
32080-33 = "응, 이건 이렇게……♡"
32080-36 = "이, 이거 알고 있는 거야……! 끄, 끄응……. 그러니까……."
32080-40 = "(모두들…… 어쩐지 시험 치는 속도가 빨라진 느낌이…….)"
32080-44 = "(시험 종료 후, 모두의 채점 결과가 나왔다.)"
32080-45 = "……선생님. 그럼 발표를."
32080-46 = "[s] 시험 결과를 확인한다."
32080-50 = "제3차 보충수업부 자체 모의 시험 결과"
32080-52 = "하나코 - 69점 [007eff](합격)[-]"
32080-54 = "아즈사 - 73점 [007eff](합격)[-]"
32080-56 = "코하루 - 61점 [007eff](합격)[-]"
32080-58 = "히후미 - 75점 [007eff](합격)[-]"
32080-60 = "해, 해냈어요?! 모, 모두 다 합격?!"
32080-61 = "지, 진짜야?! 저, 정말!?"
32080-62 = "……!! 해냈어!"
32080-63 = "어머나♡"
32080-68 = "저, 정말이에요! 아즈사 쨩, 60점이 아니라 70점을 넘겨버렸어요! 굉장해요! 엄청난 상승폭이에요!"
32080-69 = "으, 응!!"
32080-70 = "코하루 쨩!! 아슬아슬했지만, 아니, 그러니까 더 값어치있는 성적이에요! 해냈어요!"
32080-71 = "지, 진짜 내 점수야?! 정말……?"
32080-72 = "……아, 아하하하하! 봤지? 봤어? 이게 바로 나의 실력이라고!"
32080-73 = "네! 맞아요! 진짜 힘을 숨기고 있었나봐요! 진짜 엘리트예요!"
32080-74 = "하나코 쨩……. 그리고……."
32080-75 = "어머나…… 운이 좋았네요. 우후후후♡"
32080-76 = "다행이에요……. 하나코 쨩…… 아우……."
32080-77 = "히, 히후미 쨩……?"
32080-78 = "하나코 쨩에게 무슨 일이 있었는지는 모르지만…… 실력이 녹슬지 않아서 다행이에요……."
32080-79 = "히후미 쨩……."
32080-80 = "예전의 그 실력을 되찾을 수 있도록 저도 계속 도울테니까……. 아우……."
32080-81 = "응…… 저도 미안해요……. 걱정을 끼쳐서……."
32080-83 = "……해서, 약속대로 모모프렌즈 굿즈 시상식을 시작하겠습니다!"
32080-87 = "음……!! 음!"
32080-88 = "……."
32080-89 = "……."
32080-90 = "자아, 자아! 모두가 고를 기회가 있어요! 원하는 걸 가져갈 수 있다구요?"
32080-91 = "과연……! 원하는 걸……! 으음……!!"
32080-92 = "저는 사양할게요."
32080-93 = "나도 됐어."
32080-94 = "아우……."
32080-95 = "나는…… 나는 어쩌지? 나는……."
32080-96 = "고르려고 해도, 도무지…… 고를 수가 없어!"
32080-97 = "저 새카맣고 뿔이 난 것도 좋은 것 같고, 안경을 쓴 하마도 좋아 보여……!!"
32080-98 = "하마가 아니라 페로로 님은 새……."
32080-99 = "음…… 어쩌지? 둘 중에 하나를 골라야 한다면……. 아, 안돼……."
32080-100 = "……히후미, 나, 나는 무리야…… 고를 수가 없어. 히후미가 대신 골라줘……."
32080-101 = "제, 제가요?"
32080-102 = "으, 으음. 그러니까 스컬맨 님과 페로로 박사님 중에 하나를 고르는 거라면……."
32080-106 = "……."
32080-110 = "그럼 인텔리한 페로로 박사님으로!"
32080-111 = "이건가……! 과연!!! 이건가!!!"
32080-112 = "네, 페로로 박사님은 엄청 아는 것도 많고 공부도 잘한다는 설정이거든요."
32080-113 = "지금의 괄목할 만한 성장을 하고 있는 아즈사 쨩이랑 잘 어울리는 거 같아서 골라봤어요!"
32080-114 = "……그렇군. 인텔리한 박사님."
32080-115 = "무, 물론 공부를 너무 많이하는 바람에 정신을 놓아버렸다는 뒷설정도 있지만……."
32080-116 = "[s] \"마음에 들었나 봐. 아즈사.\""
32080-117 = "응, 진짜 좋아. 마음에 들어. ……헤헤헤."
32080-118 = "고마워, 히후미. 평생 소중히 간직할게."
32080-119 = "네? 아즈사 쨩, 그렇게까지 대단한 건 아니라구요? 아즈사 쨩이 해내서 받은 거잖아요."
32080-120 = "응…… 그래도…… 친구에게 받은 첫 선물이니까……."
32080-121 = "이제부터 이 하마를 히후미라고 생각하겠어!"
32080-122 = "네?! 그, 그건 좀……. 그리고 새라구요, 아즈사 쨩……! 하마가 아니라구요?"
32080-126 = "으응…… 취향의 세계는 넓네요."
32080-127 = "……기분 나빠."
32080-129 = "(모두들 사기가 충만해져서, 이후 공부는 좋은 분위기로 진행되었다.)"
32080-133 = "(그렇게 또 하루가 지나가고, 시간은 흘러……)"
32080-135 = "……드디어 내일이에요, 여러분."
32080-136 = "으응……."
32080-137 = "음. 2차 평가 시험인가."
32080-138 = "어머나…… 벌써 시간이 그렇게 되었네요. 눈 깜짝할 사이였어요."
32080-139 = "네…… 일주일이라는 짧은 시간이었지만, 그동안 저희의 노력은 헛되지 않았다고 믿습니다."
32080-140 = "모의 시험 결과…… 저희는 충분히 2차 평가 시험에서 낙제를 면할 수 있다는 것을 확인했어요!"
32080-141 = "하지만 저희는 자만하지 않고, 더 정진해야 합니다! 마지막 남은 오늘도 최선을 다하는 거예요!"
32080-142 = "당연하지. 100점을 목표로 노력하겠어."
32080-143 = "나, 나도 마찬가지야!"
32080-144 = "어머나. 그럼 저도 그런 걸로…… 후후♡"
32080-148 = "저, 저는 100점은 무리지만…… 아무튼!"
32080-149 = "자, 마지막 날도 힘내서 공부를 시작하는 거예요!"
32080-150 = "[s] \"오오-!\""
32080-153 = "……. 기다리고 있었습니다. 오랜만에 뵙는 것 같네요, 선생님."
32080-154 = "잘 지내셨습니까? 합숙은 어떠셨나요? 별일은 없으셨나요?"
32080-155 = "[s] \"이번엔 무슨 일이야?\""
32080-156 = "……후후. 합숙은 말하자면 좀 더 학생들을 철두철미하게 관찰하라는 저의 배려였습니다."
32080-157 = "어떠셨나요? 소기의 성과는 있었습니까? 무언가 알아내신 것이 있으신가요?"
32080-158 = "즉, 배신자는 누구인 것 같나요?"
32080-159 = "[s] \"나는 그것에 동의하지 않는다고 했어.\""
32080-160 = "……그러셨죠. 하지만 2차 평가시험을 앞둔 지금, 다시 한번 그 부분을 재확인하고 싶었습니다."
32080-161 = "그래서 이렇게 모신 거죠."
32080-162 = "그리고 아마 미카 씨도 접촉하신 것 같은데……."
32080-167 = "미카 씨가 뭐라고 하던가요? 무언가 알려준 게 있었나요?"
32080-169 = "다음화;검은 손길"
