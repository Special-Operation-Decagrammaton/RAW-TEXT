[translation]
84301400300-14 = "으, 으엑!? 무, 무슨 일이시죠!?"
84301400300-15 = "저희는 아무것도 몰라요! 저희가 이런 게 아니에요!"
84301400300-16 = "우리도 문제를 찾고 있어…… 조금만 기다려 줘."
84301400300-21 = "오해가 있나 보네요. 저는 여러분을 나무라거나 조사하러 온 사람이 아닙니다."
84301400300-22 = "다만 이번 일에 함께 휘말린 처지로서…… 조금만 주변을 살펴보고 싶을 뿐이지요. 그 정도는 괜찮겠죠?"
84301400300-24 = "으, 으음…… 평소라면 아무리 그래도 위험하다거나…… 만류하고 싶긴 하지만 말이죠."
84301400300-25 = "이번에는 그러기 어려운 입장이네. 어쩔 수 없지."
84301400300-26 = "그, 그래도 조심하셔야 해요. 이상한 게 있으면 꼭 저희에게 먼저 말씀해 주시고요!"
84301400300-28 = "걱정 마세요. 위험한 일은 하지 않을 테니까요."
84301400300-32 = "(……그럼 한 번 조사해 볼까요.)"
