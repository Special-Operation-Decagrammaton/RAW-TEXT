[translation]
10039110-1 = "후일담;방과후 유령의 집"
10039110-3 = "오옷…… 이곳이 트리니티 유령의 집 테마 카페……"
10039110-4 = "좋아. 우리 학교와 비교해서 얼마나 더 무서운지 보자."
10039110-5 = "기대되는데? 과연 어떨까나~"
10039110-16 = "그워어…… 어서 옵쇼……"
10039110-21 = "나는…… 프랑켄낫타인의 괴물…… 주문을 받으러 왔다아~"
10039110-22 = "어…… 하나도 무섭지 않은데……?"
10039110-23 = "그, 그러게…… 오히려 귀여울 정도……"
10039110-27 = "……"
10039110-28 = "쳇, 실패다. 그렇다면 다음 차례……"
10039110-32 = "가라, 고대의 악령이여……!"
10039110-34 = "지옥의 밑바닥에서 기어 올라온 죽음의 지배자! 대지마저 질식시키는 절망과 저주를 보여주소서……!!"
10039110-39 = "히익……!"
10039110-40 = "뭐, 뭔가 엄청난 게 나올 것 같은……!"
10039110-52 = "나츠, 이 멍청아! 그런 식으로 거창하게 소개하면 어떻게 해!"
10039110-56 = "……"
10039110-61 = "크, 크아아…… 나는 고대의 존재, 공포의 미이라……"
10039110-62 = "주문하지 않으면 저주를 받게 되리라아아……"
10039110-68 = "……이거…… 귀여운 카페였나……?"
10039110-69 = "호러 카페가 아니었던 거 아냐……?"
10039110-71 = "……"
10039110-72 = "하나도 안 통하잖아, 멍청이 나츠!!!"
10039110-73 = "크윽…… 이렇게 근본 있는 몬스터도 먹히질 않다니……"
10039110-74 = "하지만 이번에는 확실히 다를걸!"
10039110-78 = "지옥의 불길이 타오르고, 끔찍한 포효가 세계를 뒤흔든다! 사악한 그림자가 모든 것을 삼키리니!"
10039110-80 = "나와라, 지옥의 마수!! <카스팔루그>!!"
10039110-86 = "그 이름 부르지 말라고!! 그냥 늑대인간이잖아!!"
10039110-87 = "어이…… '그냥 늑대인간'으로 만족하는 거냐? 그렇게 적당한 마음가짐으로 살아갈 셈이야? 고유명사가 있어야 그 무게감도 늘어나는 법!"
10039110-91 = "이거 놓고 어서 가서 주문이나 받아라, 지옥의 마수……!!"
10039110-96 = "일단 너부터 죽이고 시작해야겠다!!"
10039110-110 = "슬랩스틱 카페였나……?"
10039110-111 = "흠, 이 정돈가……"
10039110-114 = "야, 이거 맞아? 손님들이 실망하고 있는데?"
10039110-115 = "괜찮아. 사실 우리가 기대치를 낮춰둘수록 좋단 말이지."
10039110-116 = "'진짜'는 따로 있으니까."
10039110-122 = "유령의 집이라는 이름 때문에 너무 기대가 컸나 봐."
10039110-123 = "뭐, 어쩔 수 없지. 여기는 여기대로의 맛이 있을 테니까."
10039110-124 = "원래 이런 건 놀이공원에나 가야 제대로 즐길 수 있고……"
10039110-125 = "일단 왔으니 디저트라도 주문해 볼까? 뭐가 있지?"
10039110-126 = "저희, 주문할게요~! 메뉴판 있나요?"
10039110-133 = "응?"
10039110-138 = "뭐, 뭐야……"
10039110-148 = "……"
10039110-150 = "……"
10039110-152 = "저, 저기……"
10039110-157 = "……"
10039110-158 = "그…… 주, 주문을……"
10039110-167 = "으, 으아악!!"
10039110-168 = "도, 도망쳐!!!"
10039110-173 = "……"
10039110-174 = "도, 도망가셨는데……? 그냥 나츠가 말한 대로 서 있었을 뿐인데……"
10039110-175 = "훌륭해. 아주 훌륭해."
10039110-176 = "느슨해진 방과후 유령의 집에 긴장감을 불어넣는 존재…… 그것이 바로 가면살인마 미스 민트."
10039110-177 = "감정을 잃은 듯한 무표정, 결코 멈추지 않는 발걸음, 묵직하게 휘둘러지는 배-트."
10039110-179 = "심장을 조여오는 공포 그 자체지."
10039110-180 = "나, 나츠…… 이게 맞아……?"
10039110-181 = "응. 이게 맞아. 확실해."
10039110-183 = "맞긴 뭐가 맞아!! 명색이 카페인데, 주문하기 전에 손님이 도망가면 어떻게 해?!"
10039110-184 = "그런 게 중요해? 지금의 아이리는 흡사 마이어 마이크스의 뒤를 잇는 차세대 호러의 아이콘 그 자체……!!"
10039110-185 = "이 오합지졸인 유령의 집 카페에서 유일하게 자기 몫을 해내고 있는 사람이야!"
10039110-186 = "자기 몫은 무슨, 손님 쫓아내는 할당제라도 있는 거냐고!!"
10039110-187 = "이대로 가면 매출 제로!! 개판이잖아! 우리가 준비한 음료와 디저트는 어떻게 할 건데?!"
10039110-188 = "이 호러, 이 공포를 이겨낸 자만 주문할 수 있다……!!"
10039110-190 = "허들 너무 높지 않냐!!"
10039110-199 = "[ns] \"아이리, 대단했어……\""
10039110-203 = "서, 선생님?! 언제부터 보고 계셨나요?!"
10039110-204 = "[s1] \"고대의 악령이었던가……\"\n[s2] \"지옥의 마수였던가……\""
10039110-210 = "크, 크악!! 뭘 멍하니 구경하고 섰던 거야!!! 잊어버려!!!"
10039110-211 = "그 얘기 한 번만 더하면 날려버린다!!"
10039110-213 = "선생님이 보기에는 어때? 이 카페, 괜찮아?"
10039110-214 = "[s] \"응. 귀엽고 좋아.\""
10039110-216 = "[ns3] \"그런데 아이리는 정말로 무섭네. 으응.\"\n[ns4] \"그 표정과 포즈, 소품의 조화가……\""
10039110-220 = "그, 그런가요…… 뭔가 기분이 좋은 것 같으면서도 미묘한……"
10039110-221 = "칭찬이야, 칭찬. 그것도 최상급의."
10039110-222 = "'공포'의 재능…… 제법이잖아, 아이리? 역시 부장의 자격이 있어."
10039110-223 = "그, 그런 거 아니라니까……"
10039110-228 = "아무리 해도 어설픈 크아앙, 밖에 할 수 없는 나로서는 조금 부럽달까……"
10039110-229 = "[ns] \"한번 해줘, 요시미!\""
10039110-233 = "시, 시끄러워!! 죽어!!"
10039110-235 = "하아, 말 나온 김에. 이래서는 안 된다고. 우리 테마는 유령의 집이란 말이지."
10039110-236 = "사람이 넷인데 아이리만 공포스러워서는 말이 안 되잖아?"
10039110-237 = "어이, 너희들. 각자 담당한 캐릭터의 해석이 부족한 거 아냐?"
10039110-242 = "뭐어?"
10039110-243 = "또 무슨 말을 하려는 건데?"
10039110-245 = "아무리 급조한 소품과 복장일지라도 캐릭터를 표현해내는 것은 너희의 몫."
10039110-246 = "사실 원전 캐릭터를 따지고 보면 아이리보다 너희가 더 무서워야 한다고. 그동안 만들어진 창작물에서의 킬 카운트만 세어봐도 너희가 압도적으로 높을걸?"
10039110-247 = "그, 그렇다고 해도……"
10039110-249 = "어째서 너희는 유령의 집에서 '귀여움'을 표현하려 하는가?!"
10039110-253 = "아직도 괴물이 아닌, 여고생으로 대접받고자 하는가!!"
10039110-254 = "누가 그렇대냐!! 귀여움받고 싶은 생각 따위 없다고!!"
10039110-255 = "그렇다면 더 연구해! 어떻게 하면 공포감을 줄 수 있을지 연구하고 탐구하라고!"
10039110-256 = "다, 닥쳐! 너야말로 그 어설픈 분장으로 사람들을 무섭게 할 수 있을 거라고 생각해?!"
10039110-257 = "프랑켄슈타인의 괴물은 이 라인업에서 최약체니까 말이지. 별로 사람들 해치지도 않았고."
10039110-258 = "가만 듣자 하니 아까부터 순 궤변이야, 이 자식!"
10039110-259 = "크윽, 분하다! 내 정론에 반박할 수 없으니 무력을 동원하는구나!"
10039110-265 = "이 녀석 묶어! 거꾸로 매달아두는 편이 더 무서울 테니까!"
10039110-271 = "프랑켄슈타인의 괴물은 굴하지 않는다! 창조주를 넘어 궁극의 디저트를 찾을 때까지!!"
10039110-278 = "얘, 얘들아…… 진정하고 생각해 보자."
10039110-279 = "우리 목적이 손님을 무섭게 하는 거였던가……?"
10039110-284 = "어……? 그게 아니었나?"
10039110-286 = "지금 우리가 하고 있는 건 '유령의 집'이 아니라, 유령의 집이라는 테마를 가진 '카페'잖아."
10039110-287 = "꼭 무서운 방향으로 접근해야 하는 건 아니라고 생각해."
10039110-288 = "……과연."
10039110-289 = "……테마에만 몰두하다 보니 나도 모르게 생각이 매몰되었던 건가……"
10039110-290 = "응. 귀여운 유령도 얼마든지 있을 수 있고……"
10039110-295 = "잠깐. 이걸 왜 지금 고민하고 있는 거야? 처음 준비할 때부터 컨셉 잡고 가야 했던 거 아냐?"
10039110-296 = "어허! 처음부터 완벽함을 추구하다가는 될 일도 안 되는 법이야!"
10039110-297 = "아니, 이거 너 때문이라고! 네가 자꾸 이상한 컨셉을 가져오니까……!"
10039110-298 = "야!! 그래서 뭐, 이제 어떻게 할 건데?!"
10039110-304 = "[ns] \"다들 건강해 보여서 다행이야……\""
10039110-307 = "(방과후 유령의 집은 귀여운 노선으로 전환해 방문객들에게 호평을 받았다.)"
10039110-311 = "(아이리의 분장은 호러 매니아들 사이에서 상당히 컬트적인 인기를 끌었다고 한다……)"
