[translation]
80000135-1 = "달달하고 단단한"
80000135-2 = "샬레 사무실"
80000135-4 = "잘 지내셨습니까, 선생님!"
80000135-5 = "좋은 물건 전해 드리러 왔습니다!"
80000135-6 = "[s]\"……거래 마치고 오는 길이야?\""
80000135-7 = "예, 와일드헌트 고객님들의 의뢰품을 구매하러 잠깐 외출 좀 했죠."
80000135-8 = "그래도 오늘의 거래는 꽤 편했습니다. 구매할 품목이 딱 하나뿐이었거든요."
80000135-9 = "선생님도 한번 보시겠습니까?"
80000135-15 = "(뭐라 말하기도 전에 후유는 가방을 열어 내용물을 보여주었다.)"
80000135-16 = "(가방 안에는, 개별 포장된 수상한 구슬들이 한가득 들어있었다.)"
80000135-17 = "[ns]\"이건……?\""
80000135-18 = "후후, 보시다시피 이것들은……."
80000135-19 = "[s]\"폭탄?\""
80000135-20 = "예, 폭탄입니……."
80000135-21 = "아니! 사탕! 사탕입니다!"
80000135-22 = "저희 특수교역부를 뭐라고 생각하시는 건가요, 선생님!"
80000135-23 = "폭발물은 생각보다 돈이 안 된다고요! 구매 의뢰도 잘 안 들어오고."
80000135-24 = "[s]\"아, 그런 이유였어……?\""
80000135-25 = "예. 가정상비용 탄약이랑 수류탄만 좀 모아도 수제 폭탄 만드는 건 어렵지 않으니까요."
80000135-26 = "[s]\"그런데, 그 사탕들은 왜 금지 품목인 거야?\""
80000135-27 = "이것들은 곱스토퍼(gobstopper)라는 이름의 사탕입니다."
80000135-28 = "99% 설탕으로 만들어진 지극히 단순한 구조이지만……."
80000135-29 = "이 사탕의 핵심은 '단단함'에 있죠."
80000135-30 = "녹인 설탕을 한 겹 한 겹 꽉꽉 압착해 만든 물건이라, 엄청나게 단단하거든요."
80000135-31 = "……그리고 그 단단함 때문에 금지 품목에 올랐죠."
80000135-32 = "[s]\"응……?\""
80000135-33 = "이 사탕을 씹다가 치아가 부러진 학생들이 몇 있었거든요."
80000135-34 = "그것 때문에 사감대가 이 사탕의 반입을 금지시켰습니다."
80000135-35 = "[s]\"앗…….\""
80000135-36 = "하지만 굉장히 오랫동안 입에 문 채로 예술 활동에 집중할 수가 있어서, 지금도 이 사탕의 수요는 상당하답니다."
80000135-37 = "덕분에 저희도 꽤 짭짤하게 수입을…… 아 이게 중요한 게 아니지."
80000135-42 = "자, 여기 있습니다, 선생님."
80000135-44 = "(후유가 내민 것은, 다른 사탕들보다도 월등하게 큰…….)"
80000135-45 = "(야구공보다도 커다란 사탕 한 알이었다.)"
80000135-47 = "[ns]\"이건……?\""
80000135-48 = "말씀드렸잖아요, 좋은 물건 전해 드리러 왔다고."
80000135-49 = "한정판 특대형 초콜릿 곱스토퍼랍니다, 선생님."
80000135-50 = "오늘, 바, 발렌타인 데이잖아요?"
80000135-51 = "[s]\"오오, 고마워, 후유 쨩!\""
80000135-52 = "……헤헤."
80000135-53 = "[s1]\"그런데 이 정도 크기면…… 부숴서 먹어야 하나?\"\n[s2]\"망치를 어디에 뒀더라…….\""
80000135-56 = "아, 그런 건 필요 없습니다, 선생님."
80000135-60 = "[ns] \"……총?\""
80000135-62 = "탕!"
80000135-66 = "자, 편히 드시죠, 선생님!"
80000135-67 = "[s] \"고…… 고마워!\""
80000135-69 = "(한 조각 입에 넣어본 사탕은…….)"
80000135-70 = "(생각 이상으로 맛이 좋았다.)"
80000135-71 = "[ns] \"맛있어……!\""
80000135-72 = "그렇죠? 그렇죠?"
80000135-73 = "이거, 나름 한정판이라고 상당히 신경 써서 만들었더라고요!"
80000135-74 = "[s] \"자, 여기. 후유 쨩도 하나 먹어.\""
80000135-79 = "헉……! 그, 넵……!"
80000135-81 = "……정말이네요. 초콜릿 맛이 달고 진해요."
80000135-82 = "[s] \"거기다 엄청 단단해서 오랫동안 먹을 수도 있고.\""
80000135-83 = "예. 오랫동안 달콤할 수 있죠."
80000135-84 = "……덕분에 좀 더 오랫동안 저를 떠올릴 수도 있을 테고요."
80000135-88 = "아, 시간 좀 봐. 전 이만 가보겠습니다!"
80000135-95 = "으우우……."
80000135-96 = "미쳤나봐미쳤나봐미쳤나봐……!"
80000135-97 = "더 오랫동안 나를 떠올리라니…… 그런 낯부끄러운 소리를 잘도……!"
80000135-98 = "하, 하지만, 그래도, 그래도……."
80000135-99 = "자, 잘한 거겠……나?"
80000135-103 = "모, 몰라!"
