[translation]
10007045-1 = "제4화;수상한 거래"
10007045-2 = "으윽~ 당해버렸다~"
10007045-3 = "어떻게 얻어낸 모처럼의 기회인데…… 온천 영업을 방해하는 행위는 용서할 수 없어요!"
10007045-4 = "자, 메루 쨩의 망상이 담긴 스케치는 모두 압수예요!"
10007045-5 = "안 돼…… 돌려줘……."
10007045-10 = "어디보자…… <T 비서실장의 비밀 수염 컬렉션>……."
10007045-11 = "<H 부부장과 A 행정관의 비밀 연애>…… <밀레니엄 Y 회계의 은밀한 취미>……?"
10007045-12 = "이, 이게 뭔가요. 메루 쨩!"
10007045-13 = "그동안 이런 시선으로 다른 학생들을 보아왔던 건가요?"
10007045-14 = "……심지어 다른 학교의 학생을 대상으로 그린 내용까지 있어!"
10007045-15 = "이런 위험한 망상을 그린 책이 외부에 유출되었다가는 소란 수준이 아니라 학교 간의 분쟁이 일어날지도 모른다고요!"
10007045-16 = "이런 위험한 책은 세상에 존재해서는 안 돼요! 모조리 처분해버리겠어요!"
10007045-17 = "그, 그러지 마! 그 만화를 그리는 데 필요한 자료 조사를 하느라 얼마나 힘들었는데!"
10007045-18 = "그러지 말고 한 번만 못 본 척해주면 안 될까?"
10007045-19 = "……대신 이걸 줄게!"
10007045-24 = "이건…… [USERNAME] 선생님이 그려진 그림?"
10007045-25 = "망원경 너머로만 바라보던 선생님의 모습이 이렇게나 멋지게…… 하아, 하아……."
10007045-26 = "헉? 제가 지금 무슨 상상을?!"
10007045-27 = "후후, 그 그림이 마음에 든 모양이네."
10007045-28 = "원한다면 그림은 얼마든지 더 그려줄 수도 있어."
10007045-29 = "노도카 쨩이 원하는 구도로, 노도카 쨩이 원하는 만큼……."
10007045-30 = "선생님의 멋진 모습이 그려진 그림이 잔뜩……."
10007045-35 = "흠, 흠! 어쩔 수 없네요. 지식해방전선은 과거 자유를 위해 함께 싸웠던 동지이기도 하고, 이렇게나 '성의'를 보여주셨으니…… 이번 한 번 만큼은 봐 드릴게요."
10007045-36 = "……대신 이 만화들이 붉은겨울 학원에서 제작되었다는 건 절대 알려져서는 안 돼요! 자칫했다가는 이곳이 전쟁터가 되고 말 거예요!"
10007045-37 = "걱정하지 마. 회지를 낼 때는 필명을 쓰고 철저하게 신분을 숨긴 채로 참가할 테니까."
10007045-38 = "후후, 이걸로 이번 겨울의 <코미센>도 문제없겠네!"
10007045-39 = "이걸로 모두가 해피 엔딩이에요!"
10007045-40 = "[s] \"아니, 나는 해피하지 않은데…….\""
10007045-41 = "어라? 선생님, 아직 저희 <227호 온천장>의 서비스에 만족하지 못하신 건가요?"
10007045-42 = "……어쩔 수 없네요."
10007045-48 = "그럼 탕은 충분히 즐기신 것 같으니, 지금부터는 정원을 산책하실 수 있도록 안내해 드리겠습니다!"
10007045-49 = "[s] \"그러니까 제발 느긋하게 탕을 즐기게 내버려 둬!\""
10007045-51 = "(이후, 노도카에게 등을 떠밀려 쫓겨나듯 탕을 빠져나왔다…….)"
