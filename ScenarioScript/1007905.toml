[translation]
1007905-1 = "이심전심"
1007905-2 = "(어쩐지 다급하게 불러낸 미사카를 찾아, 근처의 큰 게임 센터로 찾아갔다.)"
1007905-3 = "(미사카는 게임 센터의 경품 인형들이 즐비한 선반 앞에서 인형들을 바라보고 있었다.)"
1007905-10 = "이, 이건……. 이건 대체……."
1007905-11 = "[s1] \"……미사카?\"\n[s2] \"뭘 보고 있는 거야?\""
1007905-14 = "이건 대체……. 무슨……."
1007905-15 = "……무슨 캐릭터인 거지……? 설마 불량품인가?"
1007905-16 = "이런 걸 그대로 방치…… 아니 전시까지 하고 있다니……."
1007905-21 = "[ns3] \"……아.\"\n[ns4] \"으음. 확실히, 처음 볼 땐 으레 그런 반응이지.\""
1007905-24 = "으, 응?"
1007905-25 = "워, 원래 이런 거라고? 이게 완성품? 정말로?"
1007905-26 = "뭔가, 좀……. 놀라운 디자인이네. 여러 의미로……."
1007905-27 = "……응? 종류가 더 있다고? 이, 이런 게……?"
1007905-28 = "어디……."
1007905-35 = "우, 우와……. 정말이네……. 하, 하하……."
1007905-36 = "……응? 뭐라고?"
1007905-37 = "여기만 있는 게 아니라고? 상점가에 가면 더 있어……?"
1007905-38 = "이곳에선 나름대로 인지도가 있는 캐릭터……!? 이게!? 그게 정말이야!?"
1007905-39 = "그, 그렇구나……. 으음……."
1007905-40 = "……선생님."
1007905-41 = "역시, 이곳은 이세계가 맞는 것 같아. 처음으로 실감이 확 들고 있어."
1007905-42 = "[s5] \"여기 와서 제일 놀란 얼굴이네.\"\n[s6] \"그, 그 정도의 반응인가…….\""
1007905-45 = "뭐, 뭐어……. 아니. 괜찮아. 어느 세계든 그곳만의 미학이라는 게 있을 거고……."
1007905-46 = "여긴 여기의 룰이 있는 걸 테니까. 내가 뭐라 말하는 것도 우스운 이야기고……."
1007905-47 = "응? 그런 건 아니라고?"
1007905-48 = "……아. 여기서도 호불호가 갈리는 캐릭터라고?"
1007905-49 = "과연……."
1007905-50 = "[s7] \"조금은 괴짜 취향 취급이기도 하지.\"\n[s8] \"싫어하는 사람도 꽤 많아서, 타박받기도 해.\""
1007905-53 = "그, 그렇군……. 괴짜 취급……. 타박……."
1007905-54 = "음…………."
1007905-58 = "[ns9] \"……미사카?\"\n[ns10] \"뭔가 분위기가 바뀌었어?\""
1007905-61 = "……아, 아냐. 그냥 좀……."
1007905-62 = "음……. 뭔가 기시감이 드는데……."
1007905-63 = "……아."
1007905-64 = "……게코타."
1007905-65 = "[s11] \"게코타?\"\n[s12] \"뭔가 다른 이름이 나왔다.\""
1007905-68 = "그렇구나……"
1007905-69 = "과연, 그런 거였어."
1007905-70 = "선생님. 어쩌면 나는 방금 엄청난 잘못을 저지를 뻔한 걸지도 몰라."
1007905-71 = "이 캐릭터들…… 당장의 내 눈에는 이해가 안 가도, 누군가에게는 분명 소중하고 귀여운 디자인인 거겠지."
1007905-72 = "떠올려 보면, 나도 학원 도시에서 이해받지 못하는 시선을 감내해야 했던 경우가 있었으니……."
1007905-73 = "어쩌면 이 녀석……이름이 뭐라고 그랬지?"
1007905-74 = "……페로로? 모모프렌즈?"
1007905-75 = "이 모모프렌즈의 페로로라는 녀석도……. 어쩌면 이 세계의 게코타와 같은 느낌일지도."
1007905-76 = "……음."
1007905-77 = "……그렇게 생각하니, 조금 귀여운 것 같기도 하고."
1007905-78 = "[s13] \"그렇게 갑자기!?\"\n[s14] \"귀엽달까, 동병상련의 정 아냐, 그거!?\""
1007905-81 = "아, 아무려면 어때! 좋은 게 좋은 거잖아!"
1007905-82 = "결정했어. 이왕 여기까지 왔고. 이것도 어쩌면 운명이니까."
1007905-83 = "나 나름대로의 리스펙트를 한다는 느낌으로 하나쯤 사주는 성의를 보여야지."
1007905-84 = "경품들 말고……. 옆에 따로 파는 것도 하나 있네."
1007905-88 = "으음……. 그래. 이걸로 골랐다. 선생님! 결제는 어디서 하면 돼?"
1007905-89 = "……대신 사 준다고? 그, 그래도 괜찮아……?"
1007905-90 = "응? ……괜찮아?"
1007905-91 = "……오히려 정말로 그걸로 괜찮냐고?"
1007905-95 = "으, 으음……. 글쎄……."
1007905-96 = "이, 일단 가지고 다니다 보면 정도 들고 하지 않을까? 친해질 수 있도록 노력해 볼 테니까!"
1007905-97 = "[s15] \"거기에 '노력'까지 들이는 건가.\"\n[s16] \"뭔가 끈끈한 동맹의 기운이.\""
1007905-100 = "좋아……."
1007905-101 = "아, 앞으로 잘 지내보자! 페로로!!"
1007905-104 = "[wa:500]― [log=미사카]으으으으음~~~.[/log]"
1007905-107 = "[wa:300]― [log=미사카]계속 보다 보니,[/log]"
1007905-109 = "― [log=미사카]조금 [wa:820]귀여워 보이는 것 [wa:1840]같기도…….[/log]"
1007905-112 = "[wa:500]― [log=미사카]그래서, [wa:970]이건 돼지야……?[/log]"
1007905-114 = "― [log=미사카]아니면 하마?[/log]"
1007905-117 = "― [log=미사카]……뭐!? [wa:200]새!? [wa:810]거짓말이지!?[/log]"
1007905-120 = "[ns17] \"아니, 굳이 따지면 역시 새 쪽이잖아…….\"\n[ns18] \"부리도 달려 있고, 날개도 있는걸.\""
1007905-124 = "[wa:500]― [log=미사카]그, [wa:560]그야 그렇지만…….[/log]"
1007905-126 = "― [log=미사카]하하……. [wa:1500]뭐, [wa:730]아무래도 좋나. [/log]"
1007905-129 = "[wa:500]― [log=미사카]뭐랄까, [wa:1300]잘 생각해 보니……. [/log]"
1007905-131 = "― [log=미사카]이거 [wa:610]선생님이 준 [wa:1010]선물인 거잖아.[/log]"
1007905-134 = "[wa:800]― [log=미사카]……[wa:700]소중히 할게.[/log]"
1007905-136 = "― [log=미사카]고마워, [wa:440]선생님.[/log]"
1007905-139 = "(그렇게 미사카가 고른 굿즈를 대신 결제해 주었다.)"
1007905-140 = "(게임 센터를 빠져나오는 순간에도, 신기해하는 얼굴로 여기저기 훑어보았다.)"
