1015306-1 = "#title;평범한 비밀 기지!"
1015306-2 = "3;히후미 레이싱;01\n#3;a\n#3;greeting\n#wait;1500"
1015306-3 = "3;히후미 레이싱;17;시험 삼아서 칠해봤는데요…….\n#3;em;…"
1015306-4 = "3;히후미 레이싱;09;어떤 것 같으세요, 선생님……?"
1015306-5 = "3;히후미 레이싱;02;1번, 2번, 3번, 4번 중에서 어느 게 기존 도색하고 제일 똑같은 것 같나요?"
1015306-6 = "[s] \"다 똑같은 것 같은데……?\""
1015306-7 = "3;히후미 레이싱;04;아우우……! 역시 그렇죠?\n#3;stiff\n#3;em;[땀]"
1015306-8 = "3;히후미 레이싱;15;분명 다 다른 색이라고 하는데 제가 보기에도 똑같은 색으로 보여서……."
1015306-9 = "3;히후미 레이싱;06;부분 도색이라서 기존 색하고 잘 어울려야 하는데 말이에요……."
1015306-10 = "[s] \"조금 색감 차이가 나도 괜찮지 않아?\""
1015306-11 = "3;히후미 레이싱;02;그렇긴 해요, 하지만 제가 보기에는 다 똑같아 보여서 제 문제인 줄 알고 선생님 의견이 필요했어요.\n#3;em;[반응]"
1015306-12 = "3;히후미 레이싱;13;다 똑같은 색으로 보이면, 오히려 괜찮을지도 모르겠어요! 에헤헤-"
1015306-13 = "3;히후미 레이싱;09;그러면, 조색하고 한 번에 빨리 칠하는 편이 좋으니까, 선생님도 같이 칠해주세요!\n#3;jump"
1015306-14 = "[s] \"맡겨줘!\""
1015306-18 = "3;히후미 레이싱;17;휴…….\n#3;a\n#3;greeting"
1015306-19 = "3;히후미 레이싱;03;감사합니다! 선생님께서 도와주셔서, 금방 끝났어요!\n#3;em;[반짝]"
1015306-20 = "3;히후미 레이싱;13;이걸로 크루세이더 쨩이 말끔해졌어요!"
1015306-21 = "[s] \"전차를 소중히 여기는 모습, 대호감!\""
1015306-22 = "3;히후미 레이싱;09;물론이죠. 빌렸으니까요."
1015306-23 = "3;히후미 레이싱;12;빌렸을 때보다 깨끗하게 해서 돌려주는 건 중요해요! 에헤헤…….\n#3;stiff"
1015306-24 = "3;히후미 레이싱;02;앗, 그러고 보니 페인트가 마를 때까지 잠시 쉬다 가도 괜찮을까요?\n#3;em;[반응]"
1015306-25 = "[s] \"물론이지!\""
1015306-26 = "3;히후미 레이싱;13;감사합니다!\n#3;em;[음표]\n#3;greeting"
