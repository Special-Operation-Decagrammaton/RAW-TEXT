[translation]
1015306-1 = "평범한 비밀 기지!"
1015306-3 = "시험 삼아서 칠해봤는데요……."
1015306-4 = "어떤 것 같으세요, 선생님……?"
1015306-5 = "1번, 2번, 3번, 4번 중에서 어느 게 기존 도색하고 제일 똑같은 것 같나요?"
1015306-6 = "[s] \"다 똑같은 것 같은데……?\""
1015306-7 = "아우우……! 역시 그렇죠?"
1015306-8 = "분명 다 다른 색이라고 하는데 제가 보기에도 똑같은 색으로 보여서……."
1015306-9 = "부분 도색이라서 기존 색하고 잘 어울려야 하는데 말이에요……."
1015306-10 = "[s] \"조금 색감 차이가 나도 괜찮지 않아?\""
1015306-11 = "그렇긴 해요, 하지만 제가 보기에는 다 똑같아 보여서 제 문제인 줄 알고 선생님 의견이 필요했어요."
1015306-12 = "다 똑같은 색으로 보이면, 오히려 괜찮을지도 모르겠어요! 에헤헤-"
1015306-13 = "그러면, 조색하고 한 번에 빨리 칠하는 편이 좋으니까, 선생님도 같이 칠해주세요!"
1015306-14 = "[s] \"맡겨줘!\""
1015306-18 = "휴……."
1015306-19 = "감사합니다! 선생님께서 도와주셔서, 금방 끝났어요!"
1015306-20 = "이걸로 크루세이더 쨩이 말끔해졌어요!"
1015306-21 = "[s] \"전차를 소중히 여기는 모습, 대호감!\""
1015306-22 = "물론이죠. 빌렸으니까요."
1015306-23 = "빌렸을 때보다 깨끗하게 해서 돌려주는 건 중요해요! 에헤헤……."
1015306-24 = "앗, 그러고 보니 페인트가 마를 때까지 잠시 쉬다 가도 괜찮을까요?"
1015306-25 = "[s] \"물론이지!\""
1015306-26 = "감사합니다!"
1015306-31 = "으음……."
1015306-32 = "역시 전차 안은 덥네요……."
1015306-33 = "무시동 에어컨이 있긴 하지만, 고장 나서 시원한 바람이 전혀 안 나와요……."
1015306-34 = "그렇다고 바깥은……."
1015306-40 = "바람은 잘 부는데, 의외로 나무 그늘이 적어서 햇빛이 강하네요……."
1015306-42 = "으음……."
1015306-43 = "아! 그렇지!"
1015306-44 = "선생님! 잠시 기다려주세요! 멋진 비밀 기지를 만들어 드릴게요!"
1015306-48 = "영-차!"
1015306-51 = "(히후미는 전차에 올라타 포탑을 뒤로 돌리더니…….)"
1015306-54 = "(포신에 깃발을 걸쳐 그럴듯한 그늘을 만들었다.)"
1015306-59 = "[wa:2000]― [log=히후미 레이싱]하아~ [wa:1680]전차, [wa:1320]차가워서 기분 좋네요…….[/log]"
1015306-61 = "― [log=히후미 레이싱]역시 [wa:760]그늘은 시원하네요…….[/log]"
1015306-64 = "― [log=히후미 레이싱]전차로 만든 비밀 기지, [wa:1930]어떠신가요 선생님?[/log]"
1015306-67 = "[wa:1360]― [log=히후미 레이싱]……아주 조용하네요. [/log]"
1015306-70 = "― [log=히후미 레이싱]엔진을 끈 전차는,[wa:40] [/log]"
1015306-72 = "― [log=히후미 레이싱]언제 그랬냐는 듯이 [wa:1200]조용해져요.[wa:160] [/log]"
1015306-75 = "― [log=히후미 레이싱]숨소리나 맥박까지 [wa:2020]들릴 정도로 [wa:1350]조용해서…….[/log]"
1015306-78 = "[wa:570]― [log=히후미 레이싱]저는 이 공간을 정말 좋아해요.[/log]"
1015306-80 = "― [log=히후미 레이싱]세상에 [wa:861]저희만 있는 기분이라고 할지…….[/log]"
1015306-83 = "― [log=히후미 레이싱]아, [wa:990]아하하! [wa:1120]저 같은 평범한 아이와 [wa:590]단둘이 있으셔도,[wa:120] [/log]"
1015306-85 = "― [log=히후미 레이싱]딱히 재미없으실 텐데…….[wa:40] [/log]"
1015306-88 = "[ns1] \"히후미는 나에게 있어서 아주 특별해.\"\n[ns2] \"누구와도 바꿀 수 없는 특별함이 있단다.\""
1015306-91 = "[wa:400]― [log=히후미 레이싱]네? [wa:590]앗, [wa:340]아앗! 그, 그……! [wa:640]어……! [/log]"
1015306-93 = "― [log=히후미 레이싱]아, 아하하…… [wa:1080]선생님께는 [wa:1520]매번 응원받게 [wa:1450]되네요.[/log]"
1015306-96 = "― [log=히후미 레이싱]아, [wa:660]아아- [wa:970]왠지 더워졌네요![wa:160] [/log]"
1015306-98 = "― [log=히후미 레이싱]페, [wa:400]페인트, [wa:530]어서 마르면 좋을 텐데-[/log]"
1015306-101 = "[wa:2030]― [log=히후미 레이싱](어[wa:790]떡하죠 아우우- 심장 소리, [wa:1770]들려버릴 거예요!)[wa:240] [/log]"
1015306-103 = "― [log=히후미 레이싱](음악이라도 틀어둘걸! [wa:1310]시동이라도 걸어둘거얼-!)[wa:80] [/log]"
1015306-106 = "― [log=히후미 레이싱](아우우, [wa:1110]부끄러워-!)[wa:40] [/log]"
1015306-110 = "(히후미는 피곤했는지 뒤로 돌아서 웅크렸다.)"
1015306-113 = "(시원한 비밀 기지의 그늘 속에서 나도 깜빡 잠이 들었다.)"
