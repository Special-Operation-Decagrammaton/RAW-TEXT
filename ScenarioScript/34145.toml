[translation]
34145-4 = "[ns] \"미카……!!\""
34145-5 = "미카……! 설마 여기까지 쫓아온 건가."
34145-6 = "안녕, 응, 나도 반갑지 뭐야. 사오리."
34145-7 = "선생님이 지휘하는 스쿼드를 어떻게 이길 수 있을까 고민해봤는데……. 으응…… 딱히 좋은 아이디어가 떠오르지 않아서 말야."
34145-8 = "일단 한번 부딪쳐볼까? 하는 느낌으로 와 봤는데……."
34145-9 = "……. 역시 좋은 방법은 아니었던 것 같아."
34145-11 = "여전히 강하네, 선생님은."
34145-13 = "다음화;남은 것"
