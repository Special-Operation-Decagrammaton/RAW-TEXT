[translation]
10043090-1 = "제9화;마무리 운동"
10043090-2 = "(뜨거웠던, 정말로 뜨거웠던 승리의 날이 그렇게 지나가고.)"
10043090-3 = "(아쉽게도 시간은 흘러, 어김없이 다음 날이 찾아왔다.)"
10043090-9 = "밀레니엄 육상 트랙"
10043090-12 = "아, 선생님! 안녕하세요!"
10043090-13 = "[s] \"이 산더미 같은 야구용품들은……. 다 뭐야?!\""
10043090-14 = "아, 이거요? 코기 브레이브스에서, 온갖 야구용품을 사은품으로 보내 줬더라고요!"
10043090-15 = "그리고 제가 바라기만 한다면, 전속 대타나 선수로 계약을 추진하고 싶다고도 이야기해 주셨지만……."
10043090-16 = "그건 거절했습니다!"
10043090-17 = "[s] \"역시 그건 부담되겠지. 응.\""
10043090-21 = "무슨 말씀이세요, 선생님? 저는 밀레니엄 야구부의 4번 타자, 노마사 레이라고요!"
10043090-22 = "이제부터 밀레니엄 야구부를 중흥으로 이끌 중책을 맡은 몸으로, 다른 데에 시선을 돌려서는 안 되잖아요!"
10043090-23 = "[s] \"아, 그런 이야기였구나. 응…….\""
10043090-24 = "하지만 사은품으로 보내 주신 이 야구용품들은, 감사히 밀레니엄 야구부의 장비로 사용하도록 하겠습니다."
10043090-25 = "……야구의 얼마 안 되는 단점이라고 해야 할지, 장비가 조금 비싸거든요."
10043090-26 = "그보다, 정말로 믿기지 않네요. 제가 그 자리에서……"
10043090-27 = "진짜로! 홈런을 쳤다니요!"
10043090-28 = "연습 경기나 시범 경기에서는 물론, 훈련 중에서도 홈런을 친 적은 없었는데 말이죠!"
10043090-29 = "[s] \"그랬었구나…….\""
10043090-33 = "선생님? 왜 거기에서 어딘가 측은함마저 느껴지는 표정으로 저를 바라보시는 건가요?"
10043090-34 = "저는 새로 태어났다고요! 어제 일로 확실히 깨달았어요!"
10043090-35 = "말하자면 마침내 잠재력을 터트린 진격의 샛별! 각성하고야 만 유망주가 되고야 만 것이죠!"
10043090-36 = "지켜봐 주세요, 선생님! 오늘은 분명 지금까지와 다를 테니까요!"
10043090-40 = "기다려라, 밀레니엄제 피칭&히팅 머신 엔지니어부 에디션!"
10043090-41 = "네가 아무리 빅데이터에 근거한 투구 패턴과, 분간하기도 힘든 15종의 변화구를 자유자재로 구사한다고 해도!"
10043090-42 = "오늘의 나는, 그 모두를 남김없이 담장 너머로 넘겨줄 테니까!!!"
10043090-47 = "(그렇게 자신만만하게 훈련장으로 향한 레이는…….)"
10043090-65 = "(당연하게도, 장렬하게 패배하고 말았다.)"
10043090-69 = "어째서?!?!?!"
10043090-74 = "아니, 못 치는 일은 있을 수 있는데! 그건 부정하지 않겠는데!"
10043090-75 = "도대체 뭐 때문에 종합 타율까지 8푼에서 7푼 9리로 떨어져 버린 거냐고! 거기서 더 떨어질 게 어디 있다고!"
10043090-76 = "[s] \"음…… 어깨에 힘이 너무 들어갔다던가?\""
10043090-77 = "그거 선수에게 큰 관심 없는 코치가, 아무 생각 없이 첫 마디로 던지기 좋은 조언 중 하나잖아요!!!"
10043090-82 = "여기 계셨군요. 트레이너. 레이 양도 안녕하십니까."
10043090-83 = "선배……?"
10043090-85 = "[ns1] \"안녕. 스미레. 그런데…….\"\n[ns2] \"왜 아직도 그 옷이야?\""
10043090-88 = "아, 이 옷 말씀이군요. 트레이너."
10043090-89 = "그 물음에 대답드리기 위해서는, 역시 어제 경기에 대한 이야기를 꺼내지 않을 수가 없겠네요."
10043090-93 = "어제 경기의 열정과 감동은…… 저에게도 분명히, 하나의 큰 울림으로 다가왔습니다."
10043090-94 = "저 자신도 모르는 사이에, 그만 뜨겁게 감동하고 말았을 정도였죠."
10043090-95 = "그 열기를 아직도 잊고 싶지 않다는 마음이 들었기에, 오늘은 이 복장으로 여기에 나와 본 것입니다."
10043090-96 = "물론 평소의 트레이닝복에 비하면, 조금 불편한 부분이 있기도 합니다만……."
10043090-97 = "때로는 데이터나 통계보다도, 더욱 중요하게 작용하는 무언가가 있는 것이 아닐까요?"
10043090-98 = "[s] \"확실히 그럴 수 있지.\""
10043090-99 = "네. 트레이너."
10043090-100 = "거기에, 어제 일로 저는 또 한 가지 중요한 것을 배운 것 같습니다."
10043090-105 = "운동을 너무 좋아하는 것도, 때로는 독이 될 수 있다는 사실 말이지요."
10043090-109 = "[ns] \"너는 누구냐! 우리의 스미레를 돌려줘!\""
10043090-113 = "……아뇨, 그, 분명히 저는 트레이너의 오토하나 스미레입니다만……."
10043090-114 = "하지만 어제의 그 모든 소동도, 야구라는 스포츠를 지나치게 좋아한 나머지, 변질되어 버린 팬심에서 일어난 것이었잖습니까?"
10043090-115 = "비유하자면 마치, 오버 트레이닝 같은 것이죠."
10043090-116 = "이따금 간과하는 것이기는 합니다만, 오버 트레이닝 역시 근손실을 유발하는 주된 요소 중 하나이지 않습니까."
10043090-117 = "오히려 그 사실을 이제 와서 깨달았다는 것이…… 저답지 않다면 저답지 않은 부분이라고도 말씀드릴 수 있겠네요."
10043090-118 = "[s3] \"응……. 확실히 우리 스미레가 맞구나.\"\n[s4] \"그래도 그런 점까지 스미레답다면 스미레다워.\""
10043090-121 = "후훗. 네. 감사합니다, 트레이너."
10043090-125 = "크아아아앗!!!"
10043090-126 = "일어났습니까, 레이 양. 기운을 되찾은 것 같아서 다행이군요."
10043090-127 = "네, 그래요! 맞습니다, 선배!"
10043090-128 = "밀레니엄의 4번 타자로서! 밀레니엄 야구부를 중흥으로 이끌 중책을 맡은 몸으로써!"
10043090-129 = "언제까지나 주저앉아 있을 수는 없는 일이니까요!"
10043090-130 = "좋습니다, 레이 양. 바로 그 자세입니다!"
10043090-131 = "그런 레이 양을, 어제처럼 응원하기 위해서……."
10043090-136 = "……어라?"
10043090-137 = "선배, 이게 그냥 제 착각일 뿐이었으면 하는데요. 저 지금 뭔가 엄청나게 안 좋은 예감이 들거든요?"
10043090-138 = "아뇨, 아뇨. 안 좋은 예감 같은 것이 들 리가 없습니다. 제가 레이 양에게 도움 되지 않을 일을 떠올릴 리가 없지 않나요."
10043090-143 = "그러니 다시 오늘부터, 제가 레이 양의 파워 트레이닝 및 지구력 트레이닝을 특별 코스로 진행해 드리도록 하겠습니다!"
10043090-148 = "……네?"
10043090-149 = "아니, 거기에서 왜 그런 결론이……."
10043090-150 = "아니, 생각해 보니 선배는 모든 결론을 기승전트레이닝으로 내리는 사람이긴 한데……."
10043090-154 = "……!"
10043090-163 = "어디 가시나요, 레이 양."
10043090-164 = "아니요, '회원님'?"
10043090-165 = "……."
10043090-170 = "으아아아아!"
10043090-171 = "트레이닝부! 정말! 싫어어어어!!!"
10043090-174 = "[ns5] \"그러면 나는 두 걸음…… 아니, 세 걸음 정도 떨어진 자리에서.\"\n[ns6] \"레이와 스미레를 진심으로 응원하도록 할까!\""
10043090-179 = "무슨 말씀이신가요, 트레이너."
10043090-180 = "아뇨, '회원님'."
10043090-181 = "회원님도, 함께입니다."
10043090-182 = "[s] \"!!!!\""
10043090-184 = "[ns] \"트레이닝부–\""
10043090-187 = "–너무해애애애애!!!!!"
10043090-188 = "Pray-Ball! ~노려라! 만루 홈런~"
