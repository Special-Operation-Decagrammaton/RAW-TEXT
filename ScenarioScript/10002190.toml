[translation]
10002190-1 = "후일담;익스트림 스포츠"
10002190-2 = "비치발리볼은 두 사람이 팀을 이루어 모래사장 위에서 진행하는 일종의 배구……."
10002190-3 = "하지만 트리니티의 체육 수업에서는 6인 배구만 진행해봐서, 비치발리볼 룰은 잘 모르겠네요."
10002190-4 = "그렇다고 저희끼리 팀을 나누자니 사람이 부족하고……."
10002190-5 = "그래서 이번에는 특별히 불량배 여러분께 상대를 부탁드릴게요!"
10002190-11 = "아앙? 우리더러 너희들 공 놀이에 어울려 달라고?"
10002190-12 = "아무리 전투 후에 붙잡힌 몸이라지만, 자존심이 있지!"
10002190-13 = "우리가 그런 우스꽝스러운 놀이에 어울려 줄리가……."
10002190-20 = "……있지요! 하고 싶어요! 하게 해주세요!"
10002190-21 = "하, 하하…… 저, 저는 예전부터 비치발리볼이 너무 하고 싶었어요. 와~"
10002190-22 = "여럿이서 하는 비치 발리볼~ 너무 기대된다. 우와~"
10002190-24 = "이렇게 흔쾌히 허락해 주시다니……"
10002190-25 = "정말 감사합니다!"
10002190-26 = "그럼 바로 경기를 시작해볼까요?"
10002190-29 = "네트도 설치했으니, 그럼 경기를 시작해 볼까요?"
10002190-30 = "그럼 서브는 츠루기 씨에게 부탁드릴게요!"
10002190-36 = "쳇, 어린아이도 벌벌 떤다는 우리들이 어쩌다가 이런 꼴을……."
10002190-37 = "뭐…… 공놀이만이라면 어려운 일도 아니니, 적당히 놀아주다가 도망칠까."
10002190-39 = "아, 그쪽으로 서브 온다."
10002190-45 = "끄악!"
10002190-48 = "?!"
10002190-49 = "뭐, 뭐야? 공습인가!"
10002190-50 = "아니…… 단순히 배구공이 날아왔을 뿐인데……."
10002190-55 = "츠루기 씨. 다음 서브를 부탁드릴게요."
10002190-62 = "끄아아악!"
10002190-67 = "또 당했어!"
10002190-68 = "이, 이건 평범한 비치발리볼이 아니야……"
10002190-69 = "그저 일방적인 폭력일 뿐이라고!"
10002190-71 = "폭력을 멈춰!"
10002190-75 = "(이후, 츠루기의 서브는 불량배들이 모두 행동불능 될 때까지 계속되었다.)"
