[translation]
10016005-1 = "프롤로그;불타는 개회식"
10016005-2 = "스타디움 방송실"
10016005-3 = "안녕하세요, 크로노스 채널의 시청자 여러분!"
10016005-4 = "저희는 지금 키보토스 육상 대회의 성지라 할 수 있는 <애슬레틱 스타디움>의 중계석에 나와 있습니다!"
10016005-5 = "이른 아침임에도 불구하고 이곳, 애슬레틱 스타디움에는 많은 학생 여러분이 찾아와주셨는데요."
10016005-6 = "그 이유는 바로…… 후후, 저희가 말씀드리지 않아도 다들 알고 계시겠지요?"
10016005-7 = "네, 바로 오늘 열리는 키보토스 대운동회— <황륜대제>에 참가하기 위해서입니다!"
10016005-8 = "2년마다 열리는 이 <황륜대제>는 트리니티와 게헨나, 밀레니엄 등 여러 학원의 학생들이 한자리에 모여 경쟁을 치르는, 키보토스에서도 보기 드문 대형 축제입니다."
10016005-9 = "더욱이 이번 <황륜대제>는 밀레니엄 학원의 주관으로 보내 드리고 있기 때문에 학생들의 박진감 넘치는 경기뿐만 아니라 밀레니엄의 새로운 발명품 등 다양한 볼거리가 준비되어 있습니다."
10016005-10 = "시청자 여러분 중에는 개인 사정으로 인해 기숙사나 학원 자치구 내에서 이 방송을 보고 계신 분들도 있으실 텐데요……"
10016005-11 = "회장에 직접 방문하지 못하셨더라도 전혀 아쉬워하실 필요가 없습니다!"
10016005-12 = "저희 크로노스 채널에서 Full HD 해상도로 대운동회를 단독 중계해 드리고 있으니까요!"
10016005-13 = "시시각각 업데이트되는 황륜대제의 다양한 광경을 시청하고 싶으시다면 지금 바로 <크로노스 채널>에 접속하셔서 좋아요와 구독, 그리고 알림 설정을……"
10016005-18 = "이런, 실행위원회로부터 항의가……"
10016005-19 = "아무래도 설명은 잠시 뒤에 계속해야겠네요."
10016005-20 = "그럼 지금부터 학생 여러분의 뜨거운 함성과 환호와 함께—"
10016005-21 = "키보토스 대운동회를 시작—"
10016005-22 = "하겠습니다!"
10016005-30 = "이야— 올해는 연초부터 흉흉한 사건들이 잇달아 터지는 바람에 대운동회도 열리지 못할 줄 알았는데…… 다행스럽게도 무사히 개최되었네요."
10016005-31 = "밀레니엄 학원이 보유하고 있는 우수한 기술력의 도움을 받은 덕분일까요?"
10016005-32 = "네. 이번 <황륜대제>는 '밀레니엄 학원의 박람회'라고 불러도 손색이 없을 만큼, 밀레니엄 사이언스 스쿨의 최첨단 과학기술이 아낌없이 사용되었습니다."
10016005-33 = "덕분에 사람의 손으로 세우기 어려운 이런 대형 구조물이나, 안내용 로봇 등도 단기간에 준비할 수 있었다고 합니다만……"
10016005-34 = "……하지만 들리는 소문에 의하면, 밀레니엄 학원 내에서도 개최를 확신하기 어려울 정도의 여러 가지 문제가 발생했다고 하는데요."
10016005-35 = "개회식을 하루 앞두고 일부 경기 종목이 조정된 게 그 증거라고 합니다."
10016005-36 = "도대체 어떤 문제가 있었던 걸까요?"
10016005-37 = "안타깝게도 밀레니엄 학원의 보안이 삼엄하여 그 진상에 도달하지는 못했습니다만……"
10016005-38 = "저희 취재진은 취재 도중 충격적인 사실을 하나 발견하게 되었습니다."
10016005-39 = "이번 대운동회의 경기 종목을 조정하도록 제안한 사람이 다름 아닌……"
10016005-40 = "다름 아닌……?"
10016005-41 = "바로, 샬레의 선생님이라고 합니다!"
10016005-42 = "샬레의 선생님이요?"
10016005-43 = "언제나 사건을 몰고 다니는 그 샬레의 선생님이 대운동회의 준비에 관여하였다니……"
10016005-44 = "수상하기 짝이 없는— 아니, 드문 일이네요!"
10016005-45 = "그렇습니다! 어쩐지 특종의 향기가……"
10016005-50 = "이런. 다시 실행위원회로부터 항의가……"
10016005-51 = "앗. 말씀드리는 순간 개회식의 마지막 차례인 대운동회 선서를 하기 위해 선수 대표들이 단상에 입장하고 있습니다!"
10016005-52 = "이번 황륜대제의 선수 대표는…… 아비도스 고등학교의 '오쿠소라 아야네' 선수와 트리니티 종합학원의 '우라와 하나코' 선수로군요."
10016005-53 = "잠시 모두, 단상에 주목하시죠!"
10016005-56 = "으으…… 이렇게 많은 사람 앞에 서는 건 처음이라, 조금 긴장되네요……."
10016005-57 = "실수로라도 말을 더듬으면 어쩌죠……"
10016005-58 = "너무 긴장하지 마세요, 오쿠소라 양."
10016005-59 = "다른 학생들을 대표했다고는 하지만, 선서란 결국 자신의 결의를 타인 앞에서 고백하는 일."
10016005-60 = "타인의 시선에 얽매이지 말고 스스로에게 솔직해지면 되는 거예요."
10016005-61 = "카메라 너머에 있는 상대를 당근이나 오이라고 생각하시면, 조금은 부담이 가벼워질지도……?"
10016005-65 = "하나코 씨는 정말 대단하시네요. 이런 상황에서도 당황하지 않고 침착하게 말을 고르시다니, 역시 트리니티의 아가씨답다고 할까……."
10016005-66 = "저도 모르게 어쩐지 동경하게 되어버리네요. 하하……"
10016005-67 = "어머나. 그렇게 말씀해 주시니 영광이네요."
10016005-69 = "(후우…… 긴장하지 말고 침착하게……)"
10016005-70 = "모든 선수를 대표하여 선서합니다!"
10016005-71 = "모든 선수를 대표하여 선서합니다~"
10016005-72 = "이번 <황륜대제>에 참가한 선수 전원은……"
10016005-73 = "이번 <황륜대제>에 참가한 선수 전원은……"
10016005-74 = "정당한 스포츠 정신에 입각하여……"
10016005-75 = "'개인의 솔직한 욕망'에 입각하여……"
10016005-76 = "경기에 전념할 것을……"
10016005-77 = "'몸의 대화'에 전념할 것을……"
10016005-81 = "잠깐만요, 하나코 씨. 방금 하신 말들은 선서문에 없는데요…… 잘못 읽으신 게 아닌가요?"
10016005-82 = "후후, 아까도 말씀드렸잖아요? 타인의 시선에 얽매이지 말고 스스로에게 솔직해지라고."
10016005-83 = "이번 대운동회는 여러 학원의 학생들이 무기를 내려놓고 맨몸으로 부딪히며 친교를 나누는 우애의 장……"
10016005-84 = "그러니까 다시 말하자면……"
10016005-85 = "■■나 다름없잖아요?"
10016005-89 = "그, 그게 무슨……"
10016005-90 = "자, 잠깐만요, 하나코 씨! 그보다 마이크, 아직 켜져 있다고요?!"
10016005-91 = "신경 쓰지 마세요. 어차피 이 너머에 있는 상대는 당근이나 오이일 뿐이니까요."
10016005-92 = "전부터 종종 생각했어요. 서로 몸을 부딪쳐 친교를 나누다니, 대운동회는 꽤나 음란한 축제가 아닐까 하고…… 후후."
10016005-93 = "……저 학생, 지금 무슨 소리를 하는 거야?!"
10016005-94 = "하지만 저는 좋은 방법이라고 생각해요. 소속이나 편견에 사로잡혀 서로를 이해하지 못할지라도, 몸은 솔직할지도 모르잖아요?"
10016005-95 = "키보토스의 모든 학생들이 함께 사이좋게 ■■ ■■를 한다면 '평화의 제전'이라는 그 취지도 거짓말은 아니—"
10016005-96 = "당장 단상에서 끌어 내려!"
10016005-97 = "트리니티는 대체 무슨 생각으로 저런 학생을 대표로—"
10016005-98 = "후후…… ■■, ■■, 모두 ■■ 하는 거예요!"
10016005-99 = "격렬하게, 더 격렬하게— ■■, ■■, ■■—!"
10016005-105 = "(소근) ……방금 거, 방송 사고였죠?"
10016005-106 = "트리니티 학원의 대표로 나온 학생이 모두가 지켜보는 앞에서, 방송에도 내보내지 못할 수위의 말을 마구 내뱉다니, 이거 완전히……"
10016005-108 = "특종이네요!"
10016005-109 = "녹음실, 방금 그 장면 찍었죠? 지금 바로 정리해서 호외 기사를……"
10016005-114 = "……네? 잠시만요. 조금 전의 영상은 내보낼 수 없다니, 그게 무슨 말씀이신가요?"
10016005-115 = "분명 대운동회에서 촬영한 모든 영상은 저희 크로노스 스쿨에서 독점 중계가 가능하다고 약속해 주셨잖아요?"
10016005-116 = "약속을 지켜 주시지 않는다면, 지난번에 붉은겨울 학원 자치구에서 입수한 모 동인지의 내용이 사실이었다고 폭로하는 수밖에—"
10016005-117 = "우왓. 그 발언은 그대로 내보내면 곤란하다고요, 선배!"
10016005-121 = "자, 잠시 소란이 있었지만 저희 크로노스 채널의 <황륜대제> 독점 중계는 계속됩니다!"
10016005-125 = "모두 채널, 고정해주세요!"
