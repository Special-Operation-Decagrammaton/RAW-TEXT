[translation]
32180-1 = "제18화;그런 세계 2"
32180-2 = "시스터후드가……."
32180-3 = "하나코, 네가……!"
32180-4 = "……맞아요. 저도 계약을 하나 했을 뿐."
32180-5 = "계약……?"
32180-6 = "당신이 알 필요는 없어요. 미카 씨. 그리고……."
32180-11 = "오늘도 평화와 안녕이 그대와 함께하기를. ……콜록."
32180-12 = "……죄송해요. 폐를 끼치러 왔습니다."
32180-13 = "시스터후드. 지금까지의 관습을 깨고 티파티의 내분에 개입하겠습니다."
32180-14 = "티파티 미소노 미카 씨. 다른 티파티 멤버의 상해 교사 및 상해 미수로 시스터후드의 자율규제에 들어가겠습니다."
32180-17 = "어라…… 그러니까, 시스터후드의 사쿠라코 쨩이지?"
32180-18 = "아하하. 시스터후드랑은 처음 싸워보네. 응. 이게 너희가 준비한 비장의 카드야?"
32180-19 = "대체 어떻게 시스터후드를 움직이게 만든 거야? 하나코 쨩?"
32180-20 = "너는 시스터후드들과 친했었지? 대체 뭘 대가로 지불한 거야? 저 수상쩍은 녀석들이 아무 이득없이 움직일 리가 없는데 말야."
32180-21 = "……."
32180-22 = "……재미있겠네. 해치워야 할 사람들이 더 늘어나는 건 귀찮지만."
32180-23 = "……. 동요하고 있군요, 미카 씨."
32180-24 = "아니, 어차피 호스트가 되면 대성당도 청소하려고 했으니까, 응. 귀찮은 일을 한꺼번에 한다고 생각하지 뭐."
32180-29 = "좋아. 그럼 다시 해볼까?"
32180-33 = "미카 씨! 더 싸울 생각인가요? 당신에게 승산은 없습니다. 총을 버리세요!"
32180-34 = "응, 그럴지도. 하지만 여기까지 와서 순순히 항복할 수는 없잖아?"
32180-36 = "갈 수 있는 데까지 가는 수밖에 없어."
