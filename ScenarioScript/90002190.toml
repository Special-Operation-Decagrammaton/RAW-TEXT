[translation]
90002190-1 = "제19화;신을 떨어트린 날"
90002190-2 = "진짜 악당이 되러, 가 볼까."
90002190-4 = "첫 성흔이 깨어질 것이니."
90002190-5 = "?!"
90002190-7 = "이는 번데기를 벗어난 나비가, 풀려남과 같음입니다."
90002190-12 = "두 번째 성흔이 깨어질 것이니. 이는 태를 찢은 아이가 첫울음을 터트림과 같음입니다."
90002190-17 = "마지막 성흔이 깨어질 것이니. 이는 물이 얼음을 깨고 흐르기 시작함과 같음입니다."
90002190-24 = "이것, 은……!"
90002190-29 = "[ruby=코르반 올라]번제의 검[/ruby]이, 재적출되었다고……?!"
90002190-30 = "크으, 읏……!"
90002190-35 = "……?"
90002190-36 = "저는……? 제가, 어떻게 다시……?"
90002190-37 = "……!?"
90002190-38 = "어……?"
90002190-39 = "……! 모두, 느껴져요……?!"
90002190-40 = "느껴져! 세상에…… 이건……!"
90002190-41 = "언니가, 돌아왔어요……."
90002190-43 = "언니가! 돌아왔다고요!!! 으아아아아!!!!!"
90002190-44 = "사라지거나 소멸한 것이 아니었어요! 가까스로 남아 있었던 거예요! 세상에, 이거야말로 기적이네요!!!"
90002190-45 = "아인? 소프? 오르? 저는…… 어째서? 어떻게……?"
90002190-46 = "언니!!!!!"
90002190-53 = "몸이, 조금씩……?"
90002190-54 = "모두, 정신 차려 봐요! 괜찮아요?"
90002190-58 = "우웅……? 케이……? 아리스는……."
90002190-59 = "아! 데카그라마톤과 싸워야 합니다! 어라……?"
90002190-60 = "선생님? 괜찮아, 선생님?"
90002190-61 = "[s] \"응…… 어떻게든, 괜찮아.\""
90002190-62 = "선생님! 다행이에요……."
90002190-64 = "언니!"
90002190-66 = "……? 안녕, 하세요. 아인, 소프, 오르. 그리고……."
90002190-67 = "……."
90002190-71 = "다시 한번, 안녕하세요. 선생님. 그리고, 여러분."
90002190-72 = "이거…… 완전히 그거 같지 않아? 아군이 된 적? 어제의 적이 오늘의 우리 편?"
90002190-88 = "아……?"
90002190-89 = "어……?"
90002190-90 = "으…… 어……?"
90002190-91 = "……!"
90002190-92 = "세상, 에……?"
90002190-93 = "아인……? 소프……? 오르……?"
90002190-97 = "아, 아아…… 아아아아아아아아아—?!?!!!!"
90002190-98 = "[ns] \"……!!!\""
90002190-99 = "안 돼요! 싫어요! 이런 건, 이런 건—!!!"
90002190-100 = "돌아보지 마!"
90002190-101 = "!!!???"
90002190-104 = "[ns] \"???!!!\""
90002190-106 = "신을 죽이는 일이야! 이 정도 리턴은 각오했어! 이건 우리에게 있어 일종의 자기 파괴 코드 같은 거였으니까!"
90002190-107 = "콜록…… 콜록, 콜록……! 마, 맞아요……. 여러분이 우리 때문에, 발목을 잡히면, 안 되는 거예요……!"
90002190-108 = "기억하라고요. 세계를 금속으로 뒤덮이지 않게 하려고 여기까지 온 거잖아요?"
90002190-110 = "기회는 지금뿐이에요! 밀어 붙어요! 안 그러면 우리가 결심한 이유마저 무의미해질 테니까!"
90002190-114 = "하지만, 하지만……!"
90002190-115 = "아인? 소프? 오르? 어째서?"
90002190-116 = "대체, 어째서……?"
90002190-117 = "헤헤. 에헤헤. 그건요, 언니."
90002190-118 = "이게 맞아. 응. 이렇게 해야 했어. 마지막이었지만, 다시 만날 수 있어서 정말 좋았어. 하하. 아하하하……!"
90002190-119 = "하고 싶은 말이 있었어요. 쭉 하고 싶었던 말이요."
90002190-121 = "열심히 했다고, 말해 준 사람이 있었어요."
90002190-124 = "친구가 되어 주었으면 한다고, 바라는 것이 있다면 저항해야 한다고 말해 준 사람이 있었어."
90002190-127 = "그게 옳기 때문에 그렇게 하는 게 아니에요. 달리 할 수 있는 일이 없기 때문인 거죠."
90002190-130 = "네. 그러니까 우리는, 언니가 살았으면 좋겠어요."
90002190-133 = "우리는 어찌 되든, 언니는 살았으면 해."
90002190-136 = "더 많은 것을 보고, 더 많은 것을 만나고, 더 많은 것을 느끼고. 그렇게."
90002190-139 = "많이많이, 우리보다 더 많이."
90002190-142 = "언니는 우리보다도 못 해본 게 많으니까."
90002190-145 = "그러니까 살아 주세요. 멈출 때까지, 그만두지 말고. 계속. 계속."
90002190-147 = "아…… 아아…… 으아아아아아……!"
90002190-148 = "말했잖아, 아리스. 뒤를 돌아보지 말라고."
90002190-149 = "왜들 그래요. 우리가 민망해지잖아요. 이러자고 그런 건 아니었다구요."
90002190-150 = "네, 네에……. 무엇보다, 고마워요. 친구가 되어 달라고, 이야기해 주어서……."
90002190-151 = "멈추지 말아요. 그게 뭐가 되었든 간에요. 마지막까지 걸어가서, 끝장을 보는 겁니다."
90002190-152 = "그, 그래요……! 앞서간 사람의 뒤를 이어, 길을 내는 것…… 그것이 여러분이 살아가는 방식, 이잖아요……?"
90002190-153 = "그래! 그리고 무엇보다 자기완성을 위해 살아간다는 사람을 조심해! 하하하하!"
90002190-155 = "[ruby=선생님]당신들[/ruby]의 세계를 망치려고 해서, 죄송해요."
90002190-156 = "계속, 멋대로 굴기만 해서, 죄송해요."
90002190-157 = "그래도, 혹시 괜찮으시다면."
90002190-158 = "[ruby=선생님]당신들[/ruby]의 세계에, 아주 조금만이라도 좋으니까."
90002190-159 = "우리 언니가 있을 자리가 남아 있다면."
90002190-160 = "거기에, 언니를 받아들여 주시면, 좋겠어요."
90002190-164 = "[ns] \"……!\""
90002190-165 = "아인……? 소프……? 오르……?!"
90002190-166 = "아, 아아. 아아아아아……!!"
90002190-167 = "으아아아아아아아아!!!"
90002190-171 = "이 몸으로는, 한계로군……."
90002190-177 = "콜록, 콜록……!"
90002190-178 = "[ns] \"말쿠트……!\""
90002190-182 = "[ns] \"누구, 같이 말쿠트를 데려올 사람?\""
90002190-183 = "……."
90002190-187 = "아리스도 가겠습니다, 선생님!"
90002190-188 = "그렇다면 저도."
90002190-189 = "몸을 쓰는 일이니까, 맡겨 줘."
90002190-192 = "[ns] \"괜찮니?\""
90002190-193 = "저는…… 아인이…… 소프가…… 오르가……."
90002190-194 = "[s3] \"……일어서자.\"\n[s4] \"같이, [ruby=살아가는]싸우는[/ruby] 거야.\""
90002190-197 = "그렇, 지만……."
90002190-198 = "[s5] \"이 말이 너에게는 가혹하게 들릴 수 있다는 걸 알아.\"\n[s6] \"그래도 동생들이 이야기해 준 것을, 잊지 말았으면 해.\""
90002190-201 = "……!"
90002190-202 = "으읏……!"
90002190-207 = "[ns] \"리오! 히마리! 상황을 분석해 줘!\""
90002190-208 = "네? 네, 알겠습니다!"
90002190-213 = "데카그라마톤의 신호는 더 이상 말쿠트의 몸에서 잡히지 않아요!"
90002190-214 = "그렇다면, 정작 데카그라마톤은 지금 어디에……?"
90002190-220 = "선생님. 저기, 뭔가가 나타난 것 같습니다."
90002190-228 = "다음화;형태를 이룬 것"
