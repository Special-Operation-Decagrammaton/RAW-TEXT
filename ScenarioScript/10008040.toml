[translation]
10008040-1 = "제4화;몰려드는 방해꾼들"
10008040-6 = "캬하핫! 새전함은 우리 거다!"
10008040-7 = "새전함만 손에 넣는다면……!"
10008040-8 = "우리가 평소에 마음속에 고이 간직해 두었던 그 꿈을 드디어……!"
10008040-10 = "귀찮으니까 썩 비켜!!"
10008040-14 = "아, 아니, 저, 전투 파트도 없이 이렇게 허무하게……. 켁!"
10008040-22 = "앗, 찾았다! 새전함을 쫓는 녀석들이야!"
10008040-23 = "케케케. 새전함을 탈취해서 이번에 새로 나온 중장비를 사는……!!"
10008040-27 = "마, 말도 안 끝났는데……."
10008040-32 = "하아하아……."
10008040-33 = "사장, 역시 뭔가 좀 분위기가 이상하달까. 이거……."
10008040-37 = "헤에? 이번에 또 뭐야?"
10008040-38 = "저기다!"
10008040-39 = "놓칠까 보냐!"
10008040-40 = "전부 돌겨어억!!"
10008040-42 = "자, 잠깐, 이번에는 이 녀석들 한꺼번에 전부 몰려오는데?!"
10008040-43 = "또?!"
