[translation]
10013055-2 = "(그렇게 이어진 연전은 그야말로 치열하기 짝이 없었다.)"
10013055-3 = "(무시퀸 배틀리스트로서 잔뼈가 굵은 전문가들의 정확한 조언과……!)"
10013055-4 = "부장! 무시퀸에서 가장 중요한 포지션의 카드는 <마법 카드>입니다!"
10013055-6 = "아냐아냐! 피나! 진짜로 중요한 건 자신이 깊게 믿고 의지할 수 있는 파트너! 에이스 몬스터라고!"
10013055-8 = "(위기가 닥쳐오더라도 좌절하지 않고, 믿고 의지하는 동료를 향해 건네는 뜨거운 응원……!)"
10013055-16 = "아앗……! 내, 라이프가 벌써 제로에 가깝게……! 위, 위험해!"
10013055-17 = "괜찮아요! 아직 기회라면 있어요! 다음 턴, 역전을 노리는 거예요! 시즈코 쨩!"
10013055-18 = "네! 위기에 처한 사장님의 그 얼굴! 분명 특정 취향의 손님들에겐 엄청 잘 먹혀들 거예요! 저 우미카! 놓치지 않고 잘 찍고 있으니까! 힘내세요!"
10013055-19 = "미모리야 그렇다 쳐도, 우미카의 말은 응원도 뭣도 아닌 거 아냐?!"
10013055-28 = "(그러한 치열한 접전을 이어온 끝에 마침내 우리는 무시퀸 대회의 결승전에 올랐다…….)"
10013055-32 = "후후후, 첫 참가인 주제에 여기까지 올라오다니, 생각보다 꽤나 실력이 있는 모양이구나!"
10013055-33 = "하지만 나의 완벽한 덱 앞에서 너희들의 카드는 통하지 않는다!"
10013055-34 = "이곳에 나의 에이스 카드……! <다이아몬드 무지개 개미>를 소환!"
10013055-39 = "저, 저것은……!"
10013055-40 = "무시퀸의 최강 카드 중 하나라고 불리는……! 그 몬스터야!"
10013055-42 = "핫핫핫~! 공격! <다이아몬드 아래턱 커터!>"
10013055-55 = "아아앗……! 가, 강해! 이젠, 정말…… 더는…… 끄, 끝이야……."
10013055-62 = "아직 포기하긴 일러요! 시즈코 쨩! 카드를 믿고! 자신을 믿고! 동료들을 믿는 거예요!"
10013055-63 = "미, 미모리……!"
10013055-65 = "이, 이 장면은……! 카에데!"
10013055-67 = "응! 맞아! 피나! 무시퀸 378화에 나왔던 명장면……! 쓰러지려는 동료를 붙잡아주면서! 동료가 서로 힘을 합치는 바로 그 씬이야!"
10013055-74 = "………드로우!"
10013055-76 = "여기서부터는 바야흐로 기적이 일어나는 전개가……!"
10013055-84 = "아, 필요한 카드가 안 나왔네요."
10013055-85 = "뭐, 뭐어엇?! 당연히 이기는 전개, 아니었어?!"
10013055-86 = "으아아앙~! 카드의 정령이 대답해주지 않았어~!"
10013055-88 = "핫핫핫! 기적은 쉽게 일어나지 않기 때문에 기적인 법이지!"
10013055-89 = "도전자들이여……! 여기까지로구나! 이것으로 나의 승리……!"
10013055-97 = "뭐, 뭐지?! 네놈은 누구냐……?!"
10013055-100 = "응, 다음은 내 차례야."
10013055-101 = "[s] \"치, 치세?! 갑자기 게임에 난입해도 되는 거야?!\""
10013055-103 = "앗! 아냐! 선생님……! 이건 단순한 난입이 아니라 무시퀸만의 스페셜 룰……!"
10013055-104 = "위기의 순간 <또 하나의 나> 참전 룰입니다!"
10013055-106 = "그러니 즉 세이---프!"
10013055-107 = "[s] \"역시! 룰을 잘 모르겠어! 무시퀸!\""
10013055-113 = "여기선…… 이 카드를 쓰고,"
10013055-117 = "응……. 이 몬스터- 소환할게~"
10013055-126 = "뭣, 고작 3장의 카드만으로…… 필드가 역전되었어……!"
10013055-127 = "마, 맞아! 치세는 주로 카드 게임에 강했어! 카루타도 엄청 잘했고!"
10013055-128 = "[s] \"그거…… 장르가 다르지 않아?\""
10013055-129 = "그럼 이것으로 마무리- 필살기야~"
10013055-141 = "마, 말도 안 돼~!"
10013055-146 = "무시퀸 대회의 최종 우승자는……!!"
10013055-151 = "도전자! 카와와! 시즈코……!"
10013055-155 = "의 대타!"
10013055-159 = "와라쿠 치세!"
10013055-160 = "무려! 챔피언의 100연속 우승 기록을 깬! 새로운 전설이 탄생하는 순간입니다!"
10013055-166 = "[ns] \"끄, 끝났네…….\""
10013055-167 = "시즈코 쨩! 치세 쨩! 굉장해요!"
10013055-168 = "마지막 치세 공이 등장할 때…… 이즈나도! 저도 모르게 감동했어요!"
10013055-170 = "아, 으, 응…… 되돌아보니, 대체 난 뭘 하고 있는 거지……? 싶긴 하지만……."
10013055-171 = "이것이 저희! 백귀야행의 힘입니다!"
10013055-172 = "좋겠다! 무시퀸 대회 우승 상품이라니~ 좋겠다아~!"
10013055-174 = "새로운 챔피언의 탄생이다!"
10013055-175 = "<전> 챔피언은 얼른 비켜! 방해되잖아!"
10013055-176 = "아앗! 이 녀석들?! 내가 졌다고 바로 내치기냐아아아~!?"
10013055-177 = "뭐, 그런 룰이긴 했지마는! 설마 내가 질 줄은 전혀 몰랐지만!"
10013055-179 = "자! 그럼! 새로운 챔피언에게! 저희 <골든 플리스>호 측에서 준비한 상품을 수여하도록 하겠습니다!"
10013055-181 = "잠깐만. 그 쪽에게 묻고 싶은 게 있어."
10013055-182 = "……응? 묻고 싶은 거라니?"
10013055-183 = "질 줄 몰랐다……라는 엄청난 자신감이야 둘째치고서라도,"
10013055-184 = "그 <리조트 사용권>의 계약서까지 걸면서 이런 대회를 연 이유가 뭐야?"
10013055-185 = "엉? 이유……? 그거라면 별거 없어. 그야……."
10013055-186 = "우리는 게임이나 내기가 좋으니까!"
10013055-187 = "그걸 위해서라면 이 바다 어디든 항해하고! 찾아가고! 게임한다!"
10013055-189 = "봤지? 마침 인터넷에서 이곳 근처 섬의 <리조트 사용권>이라는 걸 싸게 구한 김에-"
10013055-190 = "[s] \"이쪽도 인터넷에서 산 거였구나!\""
10013055-191 = "기왕 이 섬에 배를 정박하고, 사람들이 찾아오기 쉽도록 무시퀸 대회를 열면 재밌겠다. 그렇게 생각했을 뿐이야."
10013055-192 = "까놓고 말해서 <리조트 사용권>을 빼앗기더라도 우리는 그냥 배를 끌고 다른 곳으로 떠나면 그만이고!"
10013055-193 = "앗! 전 챔피언! 약아 빠졌어!"
10013055-194 = "아직 예정된 대회는 많이 남아 있으니까. 바로 떠나는 건 반대라고!"
10013055-195 = "니들이 직접 말하기야?!"
10013055-196 = "[s] \"처음부터 그런 노림수가…… 모두가 협조적인 거 같진 않지만.\""
10013055-197 = "즉 재미있으니까. 이런 식의 대회를, <서비스>를 기획했다. 라는 거구나."
10013055-198 = "……그래, 그렇단 말이지."
10013055-199 = "그렇다면 한 가지, 제안이 있어."
10013055-200 = "이곳에서 계속 대회를 열어주지 않을래?"
10013055-201 = "응?"
10013055-202 = "[s] \"시즈코……?\""
10013055-203 = "이러니저러니 해도 여기서 진행되고 있는 대회는 꽤 많은 손님을 끌어모으는 모양이고……."
10013055-204 = "이런 종류의 카드 게임도…… 피나가 예전에 말한 것도 있고 해서 조금은 관심이 있기도 했으니까……."
10013055-205 = "그리고, 그, 뭐야……. 조금 전의 대회에서 그 뜨거운 열기로……. 좀 깨달은 바도, 있다고나 할까……."
10013055-206 = "앗! 그렇다면 그 말씀은……! 부장!"
10013055-207 = "무시퀸은 굉장해! 내가 더 대단한 걸 알려줄 수도 있어!"
10013055-209 = "우후후, 모두 기쁜가 보네요."
10013055-210 = "이런 것도…… 우리 백야당에서 서비스로 취급하는 것도, 뭐 나쁘지 않을 거 같다. 그렇게 생각했을 뿐이야!"
10013055-211 = "그 말은, 즉 우리와 계약을 하자?"
10013055-212 = "그쪽만 좋다면-의 이야기지만."
10013055-213 = "아! 물론 앞으로는 대회를 연다고 해도, 진 사람의 카드를 빼앗는 건 금지! 어디까지나 엔터테인먼트의 형식으로 룰을 손보게 할 거니까!"
10013055-215 = "뭐, 아직 게임을 좀 더 해도 된다면……."
10013055-216 = "나쁠 건 없지?"
10013055-217 = "좋아, 계약하겠어!"
10013055-218 = "앗, 하지만 그러면 새로운 챔피언은, 새로운 챔피언이 아니게 되나?"
10013055-219 = "아…… 저, 전 챔피언! 환영해!"
10013055-220 = "역시 우리에겐 <전> 챔피언뿐이야!"
10013055-221 = "이 녀석들이~~!"
10013055-226 = "[ns] \"응, 시즈코. 이번에도 잘됐네.\""
10013055-227 = "뭐, 뭔가요. 선생님의 그런 뜨뜻미지근한 시선은……."
10013055-228 = "그냥 이게 더 효율적이라고 생각했을 뿐이니까요!"
10013055-229 = "[ns] \"또 이렇게 계약한 프랜차이즈가 늘어난 거네.\""
10013055-231 = "네……. 그러니 이 기세로 계속해서 가겠어요!"
10013055-232 = "다음으로 향해야 할 곳은 바로-"
