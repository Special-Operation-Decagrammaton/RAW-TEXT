[translation]
10016130-1 = "후일담;게헨나 선도부 편"
10016130-10 = "……히나 부장님!!"
10016130-17 = "그동안 어디 계셨던 건가요. 계속 찾고 있었다고요!"
10016130-18 = "중요한 경기를 앞두고 갑자기 사라지셔서 저희가 얼마나 놀랐는지 아세요?"
10016130-19 = "음…… 그게 그러니까—"
10016130-20 = "연락을 해도 받질 않으시고, 다른 선도부원들에게 물어보아도 다들 곤란한 표정으로 대답을 회피해서……"
10016130-21 = "혹시라도 만마전의 너구리들이 부장님께 무슨 수작을 부린 건 아닌지 걱정했다고요!"
10016130-22 = "잠깐, 아코. 그런 게 아니니까 진정하고—"
10016130-23 = "물론 만마전의 임원 모두가 달려든다 하더라도 히나 부장님의 털끝 하나도 건드릴 수 없었겠지만……"
10016130-24 = "물론 이 사실을 의심하거나, 부장님을 과소평가한 건 절대 아니지만요!"
10016130-28 = "혹여라도 부장님께 무슨 일이라도 생겼더라면 저는——!"
10016130-34 = "……아코."
10016130-35 = "……네, 네?!"
10016130-37 = "진정해. 천천히 설명해 줄 테니까."
10016130-38 = "네, 네…… 죄송합니다."
10016130-40 = "일단…… 미안해. 갑자기 말도 없이 자리를 비워서."
10016130-41 = "의도는 아니었다지만, 아코에게 무리하게 일을 떠맡긴 점에 대해서는 사과할게."
10016130-42 = "무리한 일이라니……"
10016130-43 = "부장님께서 그렇게 말씀하시니 오히려 부끄럽네요."
10016130-44 = "평소에 부장님께서 맡고 계신 격무에 비하면 오늘 제가 대신 처리한 일은 사소한 수준이었는 걸요."
10016130-45 = "대운동회를 방해하는 여러 종류의 문제아들을 단속하고, 부장님께서 출전하실 예정이었던 경기의 출전 순서를 조정하는 정도……"
10016130-46 = "……역시 폐를 끼쳐버렸네. 미안해."
10016130-47 = "그보다 경기가 진행되는 동안 어디에 계셨던 건가요?"
10016130-48 = "실행위원회 사무실은 물론이고, 부장님께서 가실 만한 장소는 다 찾아보았는데……"
10016130-49 = "그게…… 트리니티 구호기사단과 응급의학부가 공동으로 운영하는 합동의료본부에 있었어."
10016130-50 = "장내에서 발견한 다른 환자를 데려다주느라……."
10016130-51 = "합동의료본부요? 혹시 어디 다치시기라도 하신 건가요?"
10016130-52 = "피부에 흉터라도 생긴다면 큰일이니, 어서 상처를—"
10016130-56 = "아코, 진정해."
10016130-58 = "다시 말하지만, 다른 환자를 데려다주기 위해 합동의료본부를 방문했다가, 갑자기 그곳에 대규모 테러가 예고되는 바람에 잠시 머무르고 있던 것뿐이야."
10016130-59 = "휴식이 필요할 만큼 다친 것도 아니고, 실제로 테러가 발생하지도 않았으니, 걱정은 하지 않아도 괜찮아."
10016130-60 = "대규모 테러 예고요?"
10016130-61 = "이상하네요. 하루 종일 다른 실행위원들과 있었지만, 그런 이야기는 듣지 못했었는데……"
10016130-62 = "뭐…… 실행위원회에는 전달되지 않았겠지. 세나의 핑계에 가까웠으니까."
10016130-63 = "여하튼 덕분에 의료본부에서 머무르며 휴식도 충분히 취하고, 가볍게 진찰도 받고 왔어."
10016130-64 = "덕분에 지금은 오히려 평소보다 컨디션이 훨씬 더 좋을 정도야."
10016130-65 = "그렇다면 다행이지만……"
10016130-66 = "그나저나 내가 없는 동안 선도부원들만으로 해결하기 어려운 문제는 없었어?"
10016130-67 = "듣자 하니 전차가 경기장에 난입하거나, 게헨나가 종합 우승을 차지하는 등 여러 가지 일이 있었다고 들었던데……"
10016130-68 = "네. 부장님이 자리를 비우신 사이에 여러 가지 문제가 계속해서 터지긴 했지만, 해결에 오랜 시간이 걸리지는 않았습니다."
10016130-69 = "불량 학생을 선도하는 문제는 다른 실행위원들에게 부탁해서 함께 단속을 했고……"
10016130-70 = "출전 명단의 빈자리는 미식연구회의 학생들에게 대신 출전을 부탁드렸습니다."
10016130-71 = "다른 학생에게…… 부탁을?"
10016130-72 = "네. 미식연구회의 준코 씨, 단속 때마다 발 빠르게 도망치던 걸 기억하고 계시지요?"
10016130-73 = "그동안 발이 빠르다는 생각은 해왔었지만, 마지막에 예상 이상의 활약을 해 주신 덕분에 게헨나가 종합 우승을 차지할 수 있게 되었지요."
10016130-74 = "……미식연구회 같은 문제 동아리의 손을 빌리는 건 달갑지 않지만, 그렇다고 해서 만마전에게 시비를 잡힐 빌미를 만드는 건 더더욱 사양이니까요."
10016130-75 = "아니, 그게 아니라……"
10016130-76 = "아코가 다른 학생들과 협력해서 문제를 처리했다고?"
10016130-77 = "……네. 뭔가 문제라도……?"
10016130-78 = "아아. 아니. 아무것도 아니야."
10016130-79 = "예전의 아코였더라면, 일이 아무리 많더라도 무리하게 혼자서 일을 다 떠안았을 텐데……"
10016130-81 = "다른 사람에게 부탁까지 해가며 일을 처리하는 걸 보면 아코도 많이 달라졌구나, 싶어서."
10016130-82 = "히나 부장님께 '달라졌다'는 말을 듣는다고 해도 뭔가 복잡한 기분인데요……"
10016130-83 = "……응?"
10016130-84 = "아, 아무것도 아니에요!"
10016130-88 = "안내 말씀드립니다. 잠시 후, <후야제>에서 진행될 캠프파이어의 점화를 진행할 예정입니다."
10016130-89 = "캠프파이어 주변에서 포크 댄스에 참여하고자 하시는 학생 여러분은 잠시 뒤에 중앙 필드로 모여 주시기 바랍니다."
10016130-90 = "다시 한번 안내 말씀드립니다……"
10016130-91 = "여하튼, 오늘은 이래저래 너무 혼자 오래 내버려 둔 것 같아서 미안하네."
10016130-92 = "아코, 잠시 뒤에 캠프파이어 보러 가지 않을래?"
10016130-93 = "저, 정말이신가요?"
10016130-94 = "춤을 추는 건 무리겠지만, <후야제> 정도는 고생한 아코랑 같이 구경 가는 것도 좋을 것 같아서."
10016130-100 = "그럼 가볼까?"
10016130-106 = "……네!"
