[translation]
1000708-1 = "영원한 추억"
1000708-2 = "키보토스의 번화가"
1000708-4 = "학생, 거기 빨간 머리 학생!"
1000708-5 = "응? 나 말이야?"
1000708-6 = "그래, 저번에 이 근처의 벽에 스프레이로 벽화를 그리고 있던 그 학생 맞지?"
1000708-7 = "어…… 그게……"
1000708-8 = "다름이 아니라 그 벽의 주인이 나라서 말이야."
1000708-9 = "죄송합니다!"
1000708-11 = "본의는 아니었어요, 너무 벽이 지저분해서 그만—"
1000708-12 = "그러니 제발 경찰서만큼은!"
1000708-13 = "경찰서라니, 혼을 내려고 하는 게 아니야."
1000708-14 = "안 그래도 그 벽은 지나가는 사람들이 자꾸 쓰레기를 버리거나 나쁜 낙서를 해서 골치를 앓고 있었거든."
1000708-15 = "그런데 학생이 그 벽에 멋진 벽화를 그려준 덕분에 쓰레기도 크게 줄었고, 낙서도 많이 없어졌어. 정말 고마워."
1000708-16 = "그, 그, 그저 하고 싶어서 한 일인걸요. #n하, 하하……!"
1000708-17 = "그래서 말인데, 괜찮다면 다른 벽에도 그림을 그려주지 않을래?"
1000708-18 = "너무 무리한 부탁이라고 생각되면 거절해도 상관없지만……"
1000708-19 = "할 게요! 절대로 할 게요!"
1000708-21 = "후후, 그래서 이 멋진 회벽을 마음껏 칠해도 좋다는 허가를 받았단 말씀!"
1000708-22 = "남의 눈치를 안 보고 마음대로 벽에 그림을 그릴 수 있다니, 이런 기회는 유명 그래피티 라이터들에게도 흔치 않다고!"
1000708-23 = "[s] \"벌써부터 마키가 어떤 그림을 그릴지 기대가 되는 걸.\""
1000708-24 = "무슨 소리야, 선생님. #n저번에 나랑 같이 그림을 그려주겠다고 약속 했잖아?"
1000708-25 = "선생님도 같이 그리자. #n자, 내 페인트 스프레이를 빌려줄게."
1000708-26 = "[s] \"어떻게 그림을 그려야 할까……\""
1000708-27 = "어렵지 않아. #n마음 가는 대로 선을 긋고 색을 칠하는 거야."
1000708-29 = "잘못 그림을 그린다 하더라도 얼마든지 덮어 씌울 수 있으니까…… #n걱정하지 말고 페인트를 들자."
1000708-32 = "[wa:2000]― 자, [wa:700]이만하면 괜찮지 않을까?"
1000708-34 = "― 선생님이 보기엔 어때?"
1000708-37 = "[wa:500]― 치잇…… [wa:1000]왜 그렇게 반응이 미적지근 한 거야?"
1000708-40 = "― 좀 더 예술혼을 불태워서 평가해 보라고!"
1000708-42 = "― ……."
1000708-45 = "― 선생님은 뭘 그린 거야?"
1000708-47 = "― 으음…….[wa:500]"
1000708-50 = "― 푸하하! [wa:700]이게 뭐야, [wa:800]완전 웃겨!"
1000708-53 = "[wa:700]― 높아서 무섭지 않냐고? [wa:3800]괜찮아, [wa:1000]선생님이 옆에 있으니까."
1000708-56 = "[wa:1000]― 필요하다면 언제든 나를 불러줘."
1000708-58 = "― 벽도, 선생님도, [wa:1200]멋지게 칠해줄 테니까!"
1000708-61 = "선생님과의 추억을 기념할 수 있도록 이 벽이 영원히 남아있었으면 좋겠네."
1000708-63 = "……랄까. 방금 한 말은 잊어줘!"
