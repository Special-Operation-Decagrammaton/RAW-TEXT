[translation]
2600206-1 = "미숙하더라도 할 수 있는 것."
2600206-2 = "게헨나 제8번 학생식당"
2600206-3 = "(어느덧 시간이 지나 주말이 찾아왔다.)"
2600206-4 = "(사전에 주리와 약속한 대로 시간에 맞춰 학생식당을 찾았다.)"
2600206-10 = "어머, 와주셨군요. 선생님! 기다리고 있었어요!"
2600206-11 = "[s1] \"기다리게 했네. 늦어서 미안해.\"\n[s2] \"근데 주리가 손에 들고 있는 그건 뭐야?\""
2600206-14 = "네? 아, 이거 말씀이신가요?"
2600206-19 = "후훗, 삽이랑 낫. 그리고 망치예요!"
2600206-20 = "[s] \"……그런 걸 왜?\""
2600206-21 = "그야 삽으로 푹! 하고 파묻고, 낫으로 삭- 하고 베고, 또 망치로 쾅! 하고 두드려서 박으려고 그런 거죠!"
2600206-22 = "아! 물론 준비해둔 도구는 이것만이 아니에요!"
2600206-23 = "그 밖에도 여러 가지로 다양한 도구를 준비해 두었으니까……."
2600206-28 = "선생님께선 혹시 도구가 부족하진 않을까. 하는 걱정은 하지 않으셔도 괜찮답니다!"
2600206-29 = "이번 작업은, 저 주리만 믿어 주시면 되니까요!"
2600206-30 = "[s] \"아니아니, 대체 무슨 '작업'을 하려고……?!\""
2600206-31 = "네? 그야 물론……."
2600206-32 = "텃밭 가꾸기인데요?"
2600206-34 = "(주리의 뒤를 따라 도착한 게헨나 학생식당의 뒤편.)"
2600206-35 = "(그곳엔 커다란 텃밭이 펼쳐져 있었다.)"
2600206-36 = "후후, 어떠신가요?"
2600206-37 = "이곳이 바로 저희 급양부가 자랑하는 텃밭이랍니다!"
2600206-38 = "[s3] \"와……. 굉장하네.\"\n[s4] \"그런데 왜 식당 뒤편에 이런 텃밭이……?\""
2600206-41 = "아무래도 저희 급양부는 늘 예산도 부족한 데다, 급식에 사용하기 위한 식자재 공급에 차질을 빚을 때가 많다 보니……."
2600206-42 = "이런 식으로 저희가 힘을 합쳐 텃밭에서 식재료를 수급하고는 해요."
2600206-43 = "특히나 게헨나 학원의 부지는 말이죠~"
2600206-49 = "바로 근처에 화산을 끼고 있기 때문에, 그 땅이 엄청 비옥하거든요!"
2600206-50 = "씨앗을 심고 틈틈이 잘 관리해주기만 하면, 어머나. 놀라워라!"
2600206-56 = "모두가 함께 기른 맛있는 채소가 이렇게나 한가득!"
2600206-57 = "후훗, 굉장하지 않나요?!"
2600206-58 = "[s5] \"응, 굉장한 것도 굉장한 거지만.\"\n[s6] \"주리도 엄청 즐거워 보이는걸.\""
2600206-61 = "아, 아으으……. 그, 그런가요?"
2600206-62 = "후후……, 네에, 선생님의 말씀대로 요리도 요리지만, 전 이렇게 텃밭을 가꾸는 것도 무척 좋아해요."
2600206-63 = "아무래도 전 아직 미숙하다 보니까, 모두가 한 입만 맛봐도 고개를 끄덕여줄 만큼 멋진 요리를 만들지는 못하지만……."
2600206-64 = "그렇다면 좀 더 식재료를 더욱 신경 쓰자! 고 생각해서."
2600206-65 = "좋은 식재료는 따로 요리하지 않아도 그 자체로 맛있는 법이잖아요?"
2600206-66 = "물론 요리 쪽을 포기한 것은 아닙니다만, 맛있는 식재료를 기를 수 있으면 더더욱 많은 사람이 기뻐해 주시지 않을까~하고 생각했거든요!"
2600206-67 = "[s] \"응, 주리는 대단하네.\""
2600206-68 = "네? 대단……한가요? 저, 저는 그냥 평범한걸요?"
2600206-69 = "요리가 미숙한 만큼 이런 부분에서 노력하자고 생각했을 뿐이고……."
2600206-70 = "가, 갑자기 선생님께서 치, 칭찬을 해주셔도……."
2600206-71 = "으, 으우우……."
2600206-72 = "자, 자아! 이럴 때가 아니에요!"
2600206-73 = "텃밭을 가꾸기 전에, 먼저 서, 선생님을 위해 햇볕 대책의 일환으로 밀짚모자랑 팔토시, 그리고 선크림까지 준비했으니까요! 이거, 사용해주세요!"
2600206-78 = "그……, 그럼 지금부터 작업을 시작할까요? 선생님!"
2600206-81 = "[wa:600]― 앗, [wa:1100]이것 좀 보세요. [wa:500]선생님."
2600206-84 = "― 새빨갛게 [wa:700]익은 [wa:500]토마토."
2600206-85 = "[wa:800]― 정말 [wa:500]맛있어 [wa:300]보이지 않나요?"
2600206-88 = "[wa:200]― 엣헴. [wa:1200]이것도 다 [wa:400]급양부로서의 [wa:1000]성과예요."
2600206-89 = "[wa:1500]― 정성껏 [wa:900]키운 [wa:300]보람이 [wa:300]있네요!"
2600206-92 = "[wa:500]― 아, [wa:1000]저쪽에 있는 토마토도 [wa:900]탐스럽게 익어서……."
2600206-95 = "[ns] \"어라? 어디?\""
2600206-96 = "― 그게, [wa:1800]아, [wa:1000]저기, [wa:1200]있는 건데요."
2600206-97 = "[wa:2000]― 그게……. [wa:2000]어쩐지, [wa:1000]조금 [wa:800]거리가……?"
2600206-100 = "[wa:600]― 이렇게나 [wa:300]가까우면, [wa:2100]저기, [wa:1800]저……."
2600206-103 = "[wa:800]― (아, [wa:1500]선생님의 [wa:1100]냄새가…….)"
2600206-104 = "[wa:2500]― (어, [wa:900]어째서인지 [wa:500]갑자기, [wa:1100]가슴이 [wa:400]콩닥 콩닥[wa:400]거리는데요……!?)"
2600206-107 = "[ns] \"응? 주리. 얼굴이 새빨간데. 괜찮아?\""
2600206-108 = "[wa:300]― 괘, [wa:700]괜찮답니다, [wa:1100]네! [wa:1000]걱정하지 않으셔도……!"
2600206-111 = "[wa:1100]― 다만 [wa:400]그게 [wa:1200]뭐랄까요, [wa:2700]그러니까……."
2600206-112 = "[wa:2300]― 뭔가 [wa:500]얼굴이 [wa:400]뜨거워져서, [wa:2300]그게……! [wa:2400]우으……!"
2600206-115 = "(그렇게 얼마나 텃밭을 가꾸고 있었을까.)"
2600206-116 = "(항상 무언가를 할 때는 진지하던 주리의 시선이 어째선지 이리저리 흔들렸다.)"
2600206-117 = "[ns] \"저기, 주리 양……?\""
2600206-118 = "(펴, 평소와 같은 텃밭 가꾸기일 텐데……. 선생님이 가까워지니까. 가슴이 멋대로 콩닥콩닥.)"
2600206-119 = "그, 그러니까. 그게, 아, 아으."
2600206-120 = "하, 하우우……?!"
2600206-121 = "저, 저어~! 텃밭에 뿌릴 물을 가져올 테니까. 잠시, 시, 실례할게요오-!"
2600206-126 = "(그 뒤로 어째선지 한참 동안 돌아오지 않는 주리를 기다리며 나 홀로 텃밭을 가꾸었다.)"
