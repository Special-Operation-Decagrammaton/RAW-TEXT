[translation]
1004115-1 = "손때 묻은 추억"
1004115-2 = "(미사키가 보낸 모모톡이 걱정되어 밖으로 나섰다.)"
1004115-7 = "그, 그러니까 학생증은 집에 두고 왔다고……."
1004115-8 = "야간에 공원에 들어와서 노숙하는 사람들이 있다는 신고가 들어온단 말야."
1004115-9 = "신원이 보증되지 않으면 발키리에 신고할 수밖에 없어!"
1004115-10 = "큭……!"
1004115-11 = "[s] \"무슨 일인가요?\""
1004115-15 = "앗, 샬레의 선생님이시군요. 이 시간에 무슨 일로?"
1004115-16 = "서, 선생님?"
1004115-19 = "네? 이 학생을 데리러 오셨다고요? 오늘 당번이라?"
1004115-20 = "이런, 선생님의 손님이었다니, 미리 말을 하지 그러셨어요?"
1004115-21 = "[s] \"그럼 이 학생은 내가 데려가도 되겠죠?\""
1004115-22 = "네, 그러시죠."
1004115-23 = "늦은 시간에 수고가 많으십니다."
1004115-30 = "……또 신세를 져 버렸네."
1004115-31 = "[s1] \"다행이다. 이 근처에서 뭐 하고 있었어?\"\n[s2] \"미사키, 뭐 잃어버렸어?\""
1004115-34 = "……늘 메고 다니던 가방을 잃어버렸어."
1004115-35 = "어제 노숙했던 곳이 이 공원 주변이라 찾으러 왔는데, 경비한테 딱 걸려 버려서……."
1004115-36 = "[s3] \"찾는 거, 도와줄게.\"\n[s4] \"이 주변은 매일 다녀서 잘 아니까.\""
1004115-39 = "그럴 필요 없어. 내가 잃어버린 물건이니까."
1004115-40 = "나 혼자 찾을 테니까, 선생님은 들어가."
1004115-41 = "[s5] \"하지만 혼자라면 또 경비한테 걸릴지 몰라.\"\n[s6] \"하지만 인원이 많아지면 빨리 찾을 수 있잖아?\""
1004115-44 = "그, 그건 확실히……."
1004115-48 = "……하아, 알겠어. 내가 갔던 곳을 알려줄 테니, 그곳을 중심으로 찾는 게 좋을 거야."
1004115-52 = "따라와."
1004115-60 = "여긴 없는 모양이야."
1004115-63 = "이곳도 없고……."
1004115-66 = "여기도……."
1004115-70 = "이곳도……."
1004115-74 = "[ns] \"잠깐만! 저쪽에……!\""
1004115-83 = "저기 있다……!"
1004115-93 = "맞아, 여기에 둔 후에 갑자기 순찰대와 마주치는 바람에 도망치느라 잊어버리고 있었어."
1004115-94 = "다행히 그대로 있네."
1004115-95 = "……고마워, 선생님. 신세를 졌어."
1004115-96 = "[s] \"가방이 무사한지 확인하는 게 좋겠어.\""
1004115-100 = "옷, 지갑, 치약과 칫솔은 이상 없고……"
1004115-104 = "……아."
1004115-105 = "[s] \"왜 그래? 없어진 물건이 있어?\""
1004115-106 = "……아냐. 신경 쓰지 마."
1004115-107 = "그냥, 결국 이런 곳에서 잃어버릴 정도의 물건인 거겠지."
1004115-115 = "어, 어라, 선생님, 손에 든 그건……."
1004115-116 = "[s7] \"미사키의 물건이야?\"\n[s8] \"잃어버렸다는 게 이거야?\""
1004115-123 = "마, 맞아. 이리 줘."
1004115-128 = "[ns] \"의외인걸, 미사키가 인형을 가지고 다니다니.\""
1004115-132 = "……하아."
1004115-137 = "이건 어릴 때 사오리가 만들어 준 거야. 굴러다니던 나무토막을 주머니칼로 깎아서."
1004115-138 = "어린이들한테는 애착을 가질 만한 물건이 필요한 법이니까."
1004115-139 = "어릴 때 자주 가지고 놀던 장난감, 그뿐이야. 지금에 와서는 별 의미 없는 잡동사니고."
1004115-140 = "가방에 넣어서 가지고 다니는 것도 버릇이 되어서니까."
1004115-141 = "이 정도면 대답이 됐지?"
1004115-142 = "[s] \"미사키의 소중한 물건이구나.\""
1004115-143 = "……내 말을 듣기는 한 거야?"
1004115-144 = "그렇게 말한다면, '소중했던' 물건이라고 하는 편이 정확하겠지."
1004115-148 = "아무튼, 오늘은 도와줘서 고마워."
1004115-152 = "또 연락할게."
