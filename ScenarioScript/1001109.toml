[translation]
1001109-1 = "달콤한 오후의 낮잠"
1001109-5 = "매화원 휴게실"
1001109-7 = "어머나, 선생님. 잠은 제대로 주무시고 계신가요? 얼굴에 피로가 가득하네요."
1001109-8 = "아무리 샬레의 일이 바쁘다고는 하지만, 잠은 푹 주무셔야 해요."
1001109-9 = "맞다. 마침 매화원의 아이들은 야외활동을 하러 나간 참이니, 휴게실에서 잠깐 눈을 붙이시는 게 어떠신가요?"
1001109-10 = "괜찮아요. 아이들이 돌아오기 전에는 깨워드릴 테니 부디 가볍게 한 잠 주무세요."
1001109-13 = "자꾸 거절만 하시면… 제가 주무실 때까지 억지로 껴안고 재워 버릴 거예요!"
1001109-15 = "후후, 그래요. 가벼운 낮잠은 건강에도 좋답니다. #n자, 이불을 깔아드릴 테니 여기에 누우세요."
1001109-19 = "제가 선생님이 잘 주무실 수 있도록 자장가를 불러 드릴게요."
1001109-20 = "자장, 자장, 우리 선생님, 잘도 잔다. #n자장, 자장……"
1001109-23 = "눈이 서서히 감긴다……"
1001109-27 = "― 어머, [wa:1500]일어나셨군요."
1001109-30 = "― 오늘은… [wa:1500]정말 즐거웠어요. [wa:2200]후후."
1001109-33 = "― 어머, [wa:1500]아이들이 돌아올 시간이네요."
1001109-35 = "― 슬슬 돌아가 보셔야 하지 않으시겠어요?"
1001109-38 = "― 아니…… [wa:2000]후훗. [wa:1200]좀 더 쉬세요, [wa:2300]선생님."
1001109-40 = "― 오늘 수업은 [wa:1300]제가 대신 할게요."
1001109-43 = "― 아아…… [wa:2500]귀여워라…… [wa:1800]후훗."
1001109-46 = "피로한 건 이제 좀 괜찮으신가요?"
1001109-47 = "[s] \"응, 잘 잤어. 이제 일어날게.\""
1001109-48 = "안돼요, 선생님. 조금 더 누워 계세요."
1001109-49 = "이 귀중한 기회를…… 아니, 모처럼의 휴식을 방해받고 싶지는 않으니까요."
1001109-50 = "저도 어젯밤 잠을 설친 탓일까요. 어쩐지, 이렇게 계속 누워있고 싶네요."
1001109-51 = "맞다, 이번에는 선생님께서 자장가를 불러주시겠어요?"
1001109-52 = "제가 잠들 때까지 머리를 토닥이면서…… 계속 선생님의 따듯한 목소리를 들려주세요."
1001109-53 = "아 참. 그러고보니 아이들이 곧 돌아올 텐데, 정말로 잠들어버리면 안 되겠지요?"
1001109-56 = "후후, 하지만 오늘만큼은 조금 게으름을 부려볼게요."
1001109-57 = "선생님 앞에서는 저도 한 사람의 잠꾸러기 학생에 불과하니까요."
