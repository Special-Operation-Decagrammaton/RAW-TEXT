[translation]
1004606-1 = "이즈나와 함께 손을 잡고서"
1004606-2 = "(역시 말을 꺼내지 말았어야 했나. 라고 생각하며, 이즈나와 만나기로 한 약속 장소로 향했다.)"
1004606-3 = "앗! 주군! 여기! 여기예요!"
1004606-6 = "[ns] \"아, 응. 이즈나. 오래 기다렸어?\""
1004606-7 = "앗, 아뇨! 전혀요!"
1004606-8 = "아, 음, 그럼, 오늘은 어, 어떻게 할까요? 바다에서 할 수 있는 일……"
1004606-9 = "으음~! 여름에 걸맞은 닌자 수련도 좋지만! 네! 역시 바닷가에만 있는 건 조금 아까울지도 몰라요!"
1004606-13 = "이번엔 아예 인법 수련 말고-"
1004606-14 = "여름 맛집을 찾는다거나, 그런 일을 해보는 것도……!"
1004606-15 = "[s] \"저기, 혹시 말이야.\""
1004606-16 = "네? 주군?"
1004606-17 = "[s] \"이즈나는 바다에서 수영하는 거 싫어해?\""
1004606-21 = "네, 네엣……?!"
1004606-22 = "[s1] \"답하기 곤란하다면 하지 않아도 괜찮지만, 그냥 왠지 피하고 있는 것 같아서…….\"\n[s2] \"혹시 이즈나에게 싫은 일을 억지로 권하는 게 아닐까. 해서 말이야.\""
1004606-25 = "주군, 그게……."
1004606-26 = "[s] \"말하기 싫으면 신경 쓰지 마. 괜한 이야기를 물어서 미ㅇ….\""
1004606-27 = "아, 아, 아니에요! 주군! 싫다거나, 그런 게 아니라……!"
1004606-28 = "이즈나는 그게…… 수영을 싫어하는 게 아니라……."
1004606-32 = "우, 우아아앙! 주군……! 죄송해요!"
1004606-33 = "[s] \"응? 이, 이즈나?\""
1004606-34 = "그게…… 저 이즈나……! 따, 딱히 숨기려는 생각은 아니었는데……!"
1004606-36 = "(그 후, 어떻게 된 건지 이즈나에게서 자초지종에 대해 들을 수가 있었다.)"
1004606-38 = "[ns] \"수영을 할 줄 몰라서 그랬다……고?\""
1004606-39 = "네, 네에……."
1004606-40 = "이즈나…… 아무래도 무, 물에 좀처럼 익숙해지지를 못해서……."
1004606-41 = "이제껏 몇 번이나 수영해보려고 시도는 해봤지만……."
1004606-42 = "눈이랑 귀랑 코로 바닷물이 들어오면 저도 모르게 깜짝깜짝 놀라버리고는 해서……."
1004606-43 = "그때마다 바닷물이- 짠맛이-"
1004606-44 = "우, 우와앙…… 주군! 이즈나가 미리 말씀을 드렸어야 했는데……!"
1004606-45 = "괜히 말을 빙빙 돌리면서 주군을 걱정시키는 바람에……!"
1004606-46 = "죄, 죄송해요오……. 주군……."
1004606-47 = "[s] \"아냐, 괜찮아. 그런 거라면 전혀 신경 안 써.\""
1004606-49 = "[ns] \"다만 궁금한 게…….\""
1004606-50 = "……네? 궁금한 거, 요?"
1004606-51 = "[s] \"응, 굳이 수영 못하는 걸 숨길 필요가 있었나. 싶어서.\""
1004606-52 = "아, 그건……."
1004606-56 = "주군, 이즈나는, 키보토스 최고의 닌자를 꿈꾼다고……."
1004606-57 = "몇 번이나 주군께 말했었지요……?"
1004606-58 = "[s] \"응. 그랬지\""
1004606-59 = "그런데 그런 최고의 닌자를 꿈꾸는 이즈나가, 수영을 하지 못한다고 하면……."
1004606-60 = "그게, 그러니까. 아무래도……."
1004606-61 = "그게 주, 주, 주군을…… 실망시키지는 않을까-하고 생각하면, 이즈나, 무서워져서……."
1004606-62 = "[s3] \"그런 거였구나……. 괜찮아. 이즈나.\"\n[s4] \"세상엔 수영을 할 줄 아는 사람도, 못하는 사람도 있는 법이니까.\""
1004606-65 = "그, 그러신가요……?"
1004606-66 = "에헷……. 에헤헷. 다, 다행이다아……."
1004606-67 = "주군께서 그렇게 말씀해주신다면 이즈나도 안심이 되어요!"
1004606-68 = "아! 그래도 오늘 주군의 말씀을 듣고, 이즈나, 결심했어요!"
1004606-69 = "[s] \"결심……?\""
1004606-70 = "네! 아무리 무섭고 익숙하지 않다고 해도, 도망치기만 하면 바뀌는 건 없는 법!"
1004606-71 = "키보토스 제일의 닌자를 목표로 하는 몸으로서……."
1004606-75 = "역시 물은 극복해야만 한다고 생각해요!"
1004606-76 = "[s] \"아, 그렇다는 건……?\""
1004606-77 = "그런 의미에서 주군! 잠시만 기다려 주세요!"
1004606-78 = "[s] \"……응?\""
1004606-85 = "짜잔! 여기, 준비해왔습니다! 주군!"
1004606-89 = "[ns] \"이게 다 뭐야?\""
1004606-90 = "이즈나, 줄곧 피해오긴 했지만."
1004606-91 = "그래도 언젠가 이런 날이 올 거라고 생각은 했어요……."
1004606-92 = "물을 극복하기 위해, 물과 싸워야만 할 날이 올 것이라고!"
1004606-93 = "[s] \"아, 그건 물론 기특한데 말이야…….\""
1004606-94 = "이건 그때가 왔을 때를 대비해 준비한 닌자 도구들이에요!"
1004606-95 = "주군주군! 이거 보세요! 신기하게 생겼죠?!"
1004606-96 = "이건 닌자들이 물 위를 걸을 때 쓰는 신발이구요~"
1004606-100 = "그리고 이 통!"
1004606-101 = "이건 닌자들이 물속에 있어도 숨을 쉴 수 있게 해주는 대나무 통이에요!"
1004606-102 = "아! 그리고 이건 닌자들이 물 위를 빠르게 이동하게 해주는-"
1004606-103 = "간이용 전자식 자동 스크루 모터가 달린 물건인데……!"
1004606-104 = "[s] \"잘 모르겠지만, 닌자 도구 굉장해……!\""
1004606-106 = "수영을 못하더라도 닌자라면 닌자만의 방식으로 극복하면 되는 법!"
1004606-107 = "자! 주군! 그럼 이걸 이용해서! 이즈나 물을 극복해보겠습니다!"
1004606-109 = "(그렇게 이즈나의 눈물겨운 바다 극복기가 시작되었다.)"
1004606-111 = "가장 먼저 써볼 건 이 물 위를 걷게 해주는 신발이에요!"
1004606-113 = "그럼 이즈나! 갑니다!"
1004606-120 = "[ns] \"이, 이즈나. 괜찮아?!\""
1004606-122 = "이, 이즈나……"
1004606-123 = "무, 물 위에 전혀 설 수가 어, 없었어요!"
1004606-124 = "이즈나의 수련이, 아직 부족하기 때문인가요?!"
1004606-125 = "[s] \"신발이 밀레니엄제가 아니면 아무래도 힘들지 않을까…….\""
1004606-126 = "우으읏, 그, 그래도! 신발로는 극복할 수 없더라도, 이즈나는 포기하지 않아요!"
1004606-127 = "다음엔 물속에서 숨을 쉬게 해주는 대나무 통이……!"
1004606-131 = "이즈나! 갑니다!"
1004606-137 = "(부글부글부글부글………)"
1004606-138 = "[s] \"이, 이즈나아아?!\""
1004606-140 = "푸화아앗!"
1004606-145 = "주, 주구운~~~~"
1004606-146 = "물속에서 눈을 뜨는 건 엄청 힘든 일이었군요?!"
1004606-147 = "이즈나, 눈이 아파서 대나무 통을 놓쳐버렸어요……."
1004606-148 = "[s] \"그, 그래? 일단 눈을 씻고 올까……?\""
1004606-149 = "그, 그래도 포기하지 않고! 다음 닌자 도구를 활용해서……!"
1004606-151 = "(그 뒤로도 이즈나는 몇 번이나 닌자 도구를 이용해 바다를 극복하려고 노력했지만.)"
1004606-152 = "우, 우와아앙?! 주군?!"
1004606-157 = "(안타깝게도 그 시도는 전부 실패로 돌아가고야 말았다.)"
1004606-159 = "훌쩍……. 닌자 도구로 물을 극복하는 건……. 전부…… 실패해버렸어요……."
1004606-160 = "주군…… 이즈나는…… 물을 극복할 수 없는 닌자예요……."
1004606-161 = "이래서는 키보토스 최고의 닌자는…… 절대로…… 우으……"
1004606-162 = "[s] \"자, 그럼 이즈나. 지금부터 수영 연습을 할까?\""
1004606-163 = "……네?"
1004606-164 = "[s5] \"닌자 도구나 인법으로 극복할 수 없다면…….\"\n[s6] \"배워서 극복하면 된다고 생각해. 수영이라면 가르쳐줄 테니까.\""
1004606-167 = "주군께서…… 직접, 수영을……?"
1004606-168 = "[s7] \"응, 수영이라면 자신 있으니까. 얼마든지 맡겨줘!\"\n[s8] \"전문가는 아니지만, 이즈나를 위해 전력을 다할게!\""
1004606-171 = "네, 네엣……"
1004606-172 = "그럼, 부, 부탁드립니다. 주, 주구운……."
1004606-174 = "(그리하여 인법이나, 닌자 훈련과는 전혀 상관없는 평범한 수영 강습이 시작되었다.)"
1004606-176 = "처음엔, 주군의 손을 잡고……. 물속에 머리를 담그는 것부터 시작……인가요?"
1004606-177 = "[s] \"응. 가장 먼저 필요한 건, 물에 익숙해지는 거니까.\""
1004606-178 = "네, 넵! 이즈나! 그럼……! 도전을!"
1004606-180 = "여기서 주군의 손을 잡고서, 물속에 머리를……!"
1004606-181 = "물속에 머리를……! 머리…… 머리……."
1004606-182 = "주, 주군의 손을 잡고 말인가요?!"
1004606-183 = "[s] \"응? 왜 그래? 이즈나. 뭔가 마음에 걸리는 거라도 있어?\""
1004606-184 = "아, 아뇨! 이즈나! 가, 갑니다!"
1004606-190 = "[ns] \"어때, 조금은 익숙해진 거 같아?\""
1004606-191 = "푸하앗. 네, 네엣. 그, 조, 조금은……"
1004606-192 = "그, 그보다도, 그게, 주군의 손이…… 그러니까."
1004606-193 = "[s] \"다음은 물에 익숙해진 채로 물장구를 쳐보자.\""
1004606-194 = "네, 네엡!"
1004606-196 = "(그 뒤로도 이즈나의 수영 연습은 천천히 계속되었다.)"
1004606-204 = "(손을 꼭 잡은 채 물속에 머리를 담그고, 물장구를 치고,)"
1004606-209 = "(고개를 들어 숨을 쉬는 연습을 하는 등등.)"
1004606-221 = "(수영에 필요한 여러 가지를 익히는 과정에서.)"
1004606-224 = "[ns] \"다음은 자세를 잡아줄 테니까. 물에 뜨는 감각을 익혀보자.\""
1004606-228 = "주, 주군?! 히, 히야아앙?!"
1004606-235 = "[ns] \"이즈나?! 갑자기 균형을 잃고 빠지다니. 괘, 괜찮아?!\""
1004606-236 = "부글부글부글…… 괘, 괜찮아요…… 주, 주군이 그게, 갑작스럽게 허리를…… 부글부글………"
1004606-243 = "[ns] \"벌써 시간이 이렇게…… 오늘은 이 정도로 해둘까.\""
1004606-244 = "후아아…… 고, 고생하셨습니다아. 주, 주군……."
1004606-245 = "[s] \"응, 이즈나도 고생했어. 시간도 늦었으니, 이만 돌아가자.\""
1004606-246 = "네, 넷……!"
1004606-250 = "(수영 연습이 끝나고 숙소로 돌아가는 길.)"
1004606-257 = "오늘…… 주군과 했던…… 수영 연습………"
1004606-258 = "아직도 손이랑……. 허리에……."
1004606-262 = "………."
1004606-263 = "[s] \"오늘은 미안해. 이즈나.\""
1004606-264 = "네, 넷……?"
1004606-265 = "[s9] \"오늘, 괜히 억지로 수영 연습을 밀어붙인 바람에 피곤하지?\"\n[s10] \"이즈나, 평소답지 않게 굉장히 피곤해 보이는 것 같아서…….\""
1004606-268 = "아, 주군, 이즈나는 전혀……."
1004606-269 = "네……? 걸음걸이를 보면 알 수 있다……?"
1004606-270 = "싫은데도, 억지로 어울리게 해서…… 미안하다, 는 말씀……이신가요?"
1004606-271 = "[s11] \"응. 그러니 수영 연습은 오늘로 끝. 이라는 걸로 해둘까.\"\n[s12] \"앞으로는 오늘 배운 걸 토대로 이즈나 혼자 연습하면 될 테니까.\""
1004606-274 = "주군, 그 말씀은……."
1004606-275 = "주군과 연습하는 건, 오늘이 마지막이라는 뜻……?"
1004606-276 = "[s] \"해도 지고 있고, 자, 그럼 돌아갈…….\""
1004606-277 = "아니! 아니에요! 이즈나는!"
1004606-278 = "전혀! 그런 게 아니에요! 주군!"
1004606-279 = "[s] \"이, 이즈나?!\""
1004606-280 = "오히려, 이즈나에게 오늘은, 말씀하신 그 반대였어요!"
1004606-281 = "부담이라거나, 피곤하다거나 하는 생각 대신……!"
1004606-282 = "이즈나는, 이즈나는……!"
