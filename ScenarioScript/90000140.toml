[translation]
90000140-1 = "제15화;빙해 1"
90000140-4 = "[ns] \"결국 여기까지 와버렸구나…….\""
90000140-8 = "네. 겨우 도착한 것 같네요."
90000140-9 = "꽤 추운 날씨이지만, 그래도 바람이 불지 않아서 움직이는 데 문제는 없습니다. 어느 쪽이냐면 견딜만한 정도일까요."
90000140-10 = "전혀 아닌데요. 엄청 춥거든요? 바다가 얼어붙을 정도잖아요? 극한지잖아요?"
90000140-11 = "[s] \"꽤 준비 많이 했구나, 히마리.\""
90000140-12 = "네. 저 같은 청초병약계열의 미소녀에게 추위는 최악의 적이니까요. 아치 에너미 같은 거예요. 숙적 같은 거예요."
90000140-13 = "덕분에 방열 슈트를 개조해서 두 겹이나 껴입었거든요? 덕분에 지금 몸이 엄청 둔해진 느낌이 들지만, 그래도 추운 것보단……."
90000140-14 = "안녕~"
90000140-20 = "왠지 평소보다 몸이 가벼운 느낌이야. 역시 시원해서 그런가?"
90000140-30 = "응. 컨디션 최고조야. 문제없어."
90000140-31 = "에이미…… 지금까지 말할 타이밍을 놓쳐서 그러는데요. 뭔가 이상한 걸 깨닫거나, 혹은 스스로를 돌아보거나 뭐 그런 건 없었나요?"
90000140-32 = "응? 뭐? 어떤 거?"
90000140-41 = "아아, 이 복장?"
90000140-42 = "이건 선생님이랑 나랑 같이 고민한 결과물이야. 나름 신경 쓴 건데?"
90000140-43 = "선생님……?"
90000140-44 = "선생님?"
90000140-45 = "[s1] \"말하자면 길어…. 나에게 묻지 말아줘…….\"\n[s2] \"으응…… 뭐, 어쩌다보니…….\""
90000140-48 = "……그렇군요. 동료가 즐겁다면 저도 문제없습니다."
90000140-49 = "게다가 이렇게 쾌활해진 에이미는 오랜만에 보는 것 같으니까요. 좋은 게 좋은 것이라고 배웠습니다."
90000140-50 = "그렇게 쉽게 납득해버려도…… 아니, 이젠 아무래도 상관없으려나……."
90000140-51 = "하아…… 일단 여기까지 왔으니까 임무에 집중하죠. 얼른 끝내고 밀레니엄으로 돌아가는 거예요."
90000140-52 = "자, 저희는 데카그라마톤의 신호를 추적해서 여기까지 왔어요. 우리들의 목표는 간단합니다. 이곳을 샅샅이 뒤져서 이상한 것이 있는지 확인하는 것."
90000140-53 = "두 분이 이 주변을 수색하는 동안 저와 선생님은 이 극한지의 안전한 곳을 찾아 임시로 머물 베이스캠프를 확보해 두겠습니다."
90000140-54 = "응, 알았어."
90000140-55 = "예스, 맴."
