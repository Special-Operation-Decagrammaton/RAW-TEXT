[translation]
1012502-1 = "마법의 그림"
1012502-5 = "어서 오세요, 마스터!"
1012502-6 = "[s] \"안녕, 에리!\""
1012502-7 = "함께 휴식을 취하면서 무엇을 할까 고민했습니다."
1012502-8 = "그랬더니 마도서가 알려주더군요."
1012502-9 = "오늘은 아틀리에에서 함께 그림을 그리면 좋다고요!"
1012502-10 = "[s1] \"오, 에리와 같이 그림이라니.\"\n[s2] \"마법 같은 그림이 되려나?\""
1012502-13 = "마스터와 함께라면 분명 엄청난 작품이 탄생하겠죠."
1012502-14 = "자, 그럼 어서 아틀리에로 이동합시다!"
1012502-24 = "오늘은 주제를 정하지 않고 자유롭게 회화에 도전해 보려 합니다."
1012502-25 = "즉…… 화가로서 순수한 감성과 충동을― #n마법처럼 발산하는 것입니다!"
1012502-26 = "오늘처럼 마나가 공명하는 날은…… #n감성을 중시하는 편이 좋을 것 같아서요."
1012502-27 = "자! 잘 지켜봐 주세요!"
1012502-31 = "[ns] \"……타로카드? 그림 그리는 게 아니었어?\""
1012502-32 = "말씀드렸듯이 마법적으로 예술을 표현하기 위해서죠."
1012502-33 = "뉴후후…… 운명을 고하는 아르카나의 첫번째는……?!"
1012502-37 = "음. 정방향의 탑이군요."
1012502-38 = "이 카드는 파괴와 파멸을 의미하죠. 그렇다는 건……."
1012502-39 = "캔버스를 파괴할 것 같은 강한 터치를 하라는 뜻!"
1012502-40 = "자! 갑니다!!"
1012502-49 = "[ns] \"오오…… 엄청난 기세다..\""
1012502-50 = "뉴후후. 이제 다음 터치를 결정해 보죠."
1012502-54 = "다음에 저를 이끄는 것은……!"
1012502-58 = "으음? 역방향의 사신?"
1012502-59 = "이것은 변화하지 않는 고착된 상태를 말하는 건데……."
1012502-63 = "그렇군요! 그 말은 다시 한번 강한 터치를 하라는 뜻!"
1012502-72 = "[ns] \"그, 그렇게 거세게 그려도 괜찮아……?\""
1012502-73 = "괜찮습니다! 저는 마법의 힘을 믿으니까요!"
1012502-74 = "설령 캔버스가 찢어진다 하더라도 #n그것은 '힘의 표현'…… 훌륭한 예술이라구요! #n두려워할 필요는 없습니다!"
1012502-75 = "자! 그럼 계속해서 가보겠습니다!!"
1012502-77 = "(그 후에도 타로카드는 에리를 격렬한 붓질로 계속 이끌었다.)"
1012502-86 = "(그렇게 잠시 후…….)"
1012502-89 = "오오, 이건?"
1012502-93 = "정말 마법 같은 작품이네요! 제가 이걸 그렸다니!"
1012502-94 = "[s] \"보여줘, 보여줘!\""
1012502-98 = "자! 공개합니다! 저와 마스터의 마나 공명으로 만들어낸 궁극의 역작!"
1012502-103 = "(분위기 있는 그림이 나왔다……!)"
1012502-104 = "제목은 <영원히 몰아치는 폭풍>!"
1012502-105 = "이 마법을 사용할 수 있다면 10서클 마법인 세계창조도 불가능은 아니겠죠!"
1012502-106 = "[s3] \"……10서클이 뭔진 모르겠지만 대단해 보이긴 하네.\"\n[s4] \"정말 역동적이고 멋진 그림이야……!\""
1012502-109 = "뉴후후, 그렇죠?"
1012502-110 = "예술은 폭발이라는 말이 저절로 떠오르는 작품이에요!"
1012502-111 = "역시 마스터를 부르길 잘했네요. #n저 혼자서는 이런 그림 못 그렸을 거예요."
1012502-112 = "이 기세라면 다가오는 실기 시험에서도 분명 좋은 성적을 낼 수 있겠죠!"
1012502-116 = "아, 이런. 마나를 너무 많이 소모했나 봐요."
1012502-117 = "마스터! 마나 충전을 부탁드립니다!"
1012502-118 = "[s5] \"마, 마나 충전?\"\n[s6] \"간식을 달라는 거겠지?\""
1012502-122 = "[ns] 사감대의 검문을 통과한 쿠키들을 꺼낸다."
1012502-124 = "이야, 정말 맛있어 보이는 쿠키네요!"
1012502-125 = "그런데 이를 어쩌죠? 물감이 손에 잔뜩 묻어 있는데."
1012502-126 = "뉴후후, 어쩔 수 없이 마스터가 직접 먹여주셔야 할 것 같네요."
1012502-127 = "[s] \"그, 그렇구나.\""
1012502-132 = "역시 마스터와는 말이 잘 통한단 말이죠."
1012502-133 = "그럼 잘 먹겠습니다!"
1012502-137 = "이야, 역시 마스터가 직접 마나를 충전해 주니 힘이 나네요."
1012502-138 = "[s] \"설마 이걸 노렸다거나……?\""
1012502-139 = "뉴후후, 그럴 리가요."
1012502-140 = "이것 또한 마법의 인도겠지요."
1012502-142 = "(이후 에리에게 계속 마나를 충전해 주며 즐거운 시간을 보냈다.)"
