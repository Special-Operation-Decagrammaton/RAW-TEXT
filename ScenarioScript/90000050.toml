[translation]
90000050-1 = "제6화;정보수집 5 - 폐허"
90000050-2 = "폐허? 거기가 어디야?"
90000050-3 = "어머나, 에이미? 모르시나요? 소문에 늦은 편이군요."
90000050-4 = "총학생회가 출입을 금지하고 있는 미지의 지역이에요. 버려진 채 오랫동안 방치된 도시라서 <폐허>라고 부르고 있죠."
90000050-5 = "그 도시의 기원이나 정체에 대해서는 어떤 것도 알려져 있지 않아요. 연구 자체가 금지된 지역이라……."
90000050-6 = "나는 처음 들어. 리오 회장도 그런 이야기는 해준 적 없었는데."
90000050-7 = "……과연. 리오라면 그럴 수도 있겠죠. 그 사람은 자기가 진짜로 중요하게 생각하는 건 아무에게도 알려주지 않거든요."
90000050-8 = "리오는 폐허에 굉장히 관심이 많아요. 과연, 정보를 독점하려는 빅 시스터답달까."
90000050-9 = "하지만 그럼에도 폐허에 대한 소문은 밀레니엄의 학생들에 암암리에 퍼져 있는 상태죠."
90000050-10 = "선생님도 알고 계시지 않나요? 그곳을?"
90000050-11 = "[s1] \"뭐. 그럭저럭.\"\n[s2] \"음. 글쎄.\""
90000050-14 = "아리스는……."
90000050-18 = "……아니. 이건 그만두죠. 지금 임무와는 관계가 없을 뿐더러, 길고 긴 이야기가 될 것 같으니."
90000050-23 = "……이 이야기는 다음 기회가 있다면 이어서 하도록 하고."
90000050-25 = "다시 본론으로. ……말하자면 <폐허>는 트리니티의 <카타콤>이나, 게헨나 힌놈 화산의 <어비스> 같은 것이라고 볼 수 있겠죠."
90000050-26 = "정보가 유실됐거나, 탐험되지 않은, 키보토스의 미스터리한 지역 중 하나……."
90000050-27 = "저는 이곳이 어쩌면 키보토스에서 사라지고 잊혀진 것들이 모이는…… 일종의 하수구 같은 곳일지도 모른다고 생각해요."
90000050-30 = "하수구…… 정화조…… 히마리 선배는 그런 단어를 좋아하는구나?"
90000050-31 = "그렇게 '왜 그리 지저분한 걸 좋아하는 거야?' 같은 얼굴로 보지 말아줄래요? 비유예요. 비유. 저의 청초한 이미지를 이상하게 만들지 말아줄래요?"
90000050-32 = "비유라면 다른 단어도 많았을 거라고 생각해."
90000050-33 = "그건 말이죠. 에이미. 세상에는……."
90000050-34 = "[s] \"자, 자. 본론.\""
90000050-35 = "……네."
90000050-36 = "또 이야기가 엉뚱한 데로 튀잖아. 이게 다 부장 때문이야."
90000050-37 = "제가 죄가 많은 여인인 건 인정하지만…… 이번엔 절대로 에이미 때문이잖아요? 그리고 선생님이 눈치를 주고 있으니까 대충 그런 걸로 하고."
90000050-38 = "대충 그런 건 아니지만. <폐허>에 우리의 다음 타깃이 있는 거야?"
90000050-39 = "네. 네 번째 예언자, <헤세드>가 바로 폐허 어딘가에 숨어 있다고 생각합니다."
90000050-40 = "<헤세드>인가……."
90000050-42 = "데카그라마톤은 군수 공장의 생산 컨트롤 AI와 접촉해서 자신의 예언자로 삼았고, 그래서 무한한 병력을 손에 넣었던 거죠."
90000050-43 = "즉, 헤세드는 데카그라마톤의 군단을 생산하는 <군수 공장> 그 자체."
90000050-44 = "헤세드야말로 데카그라마톤 군단의 핵심 전력이라고 볼 수 있을 거예요."
90000050-46 = "하지만 이 광활한 폐허에서 그 <군수 공장>의 위치를 찾는 건 불가능에 가까우니, 일단 정보 수집부터 시작합니다."
90000050-47 = "즉, 폐허에 있는 데카그라마톤 병력이 다음 타깃인 거네?"
90000050-48 = "네. 그 병력들에게서 데이터를 수집, <헤세드>의 위치를 추적합니다."
90000050-49 = "응. 이해했어."
90000050-50 = "폐허로 향하는 길은 제가 확보해둔 곳이 있어요. 그곳을 통해 진입해서 임무를 시작해보도록 하죠."
90000050-51 = "그럼 출발해볼까."
