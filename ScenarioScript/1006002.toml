[translation]
1006002-1 = "쌓여가는 모리모리군"
1006002-2 = "(메구의 다급한 부름에 안내받은 장소로 향했다.)"
1006002-6 = "(한적한 골목길의 편의점 옆에서, 곤란한 얼굴로 쭈그리고 앉아 있던 메구를 발견했다.)"
1006002-10 = "……아."
1006002-11 = "선생님-!!"
1006002-12 = "[s1] \"안녕, 메구.\"\n[s2] \"뭔가 목소리에서 긴박함이 느껴지네.\""
1006002-13 = "그게 말이지……. 실은 지금 대단히 곤란한 상황에 처해 있어!"
1006002-14 = "그게 말이지……. 실은 지금 대단히 곤란한 상황에 처해 있어!"
1006002-15 = "이대로라면 파산……! 파산이야! 나의 얇은 지갑이 파산하고 말 거야!!"
1006002-16 = "……응? 무슨 말이냐고?"
1006002-17 = "그러니까……."
1006002-24 = "이거랑 관련된 이야기인데……."
1006002-28 = "[ns3] \"아이스크림……?\"\n[ns4] \"<모리모리군>?\""
1006002-29 = "응. 그리고 이쪽이……."
1006002-30 = "응. 그리고 이쪽이……."
1006002-34 = "[ns5] \"……아이스크림……?\"\n[ns6] \"……모리모리……군? …들?\""
1006002-37 = "응!"
1006002-38 = "정확히는……. 모리모리군'이었던' 녀석들이지!"
1006002-39 = "아까 전부터 계속 실패하고 있어. 이럴 줄은 몰랐는데, 모리모리군을 먹는 건 보통 일이 아니었던 거야."
1006002-40 = "만만치 않아! 모리모리군은 보기보다 섬세한 녀석이었던 거야!!"
1006002-41 = "확 하면 화륵! 하고 녹아버린다고!!"
1006002-42 = "……응? 확? 화륵은 뭐고 실패는 또 뭐냐고?"
1006002-43 = "음……."
1006002-48 = "으음! 이걸 어떻게 설명해야 하지?"
1006002-49 = "일단 있었던 일을 차근차근 설명해 보라고?"
1006002-53 = "응응!"
1006002-56 = "그러니까, 시작은 아까 전 모리모리군을 먹으려고 저기 저 편의점에서 하나 산 것부터야."
1006002-57 = "모리모리군은 맛있지만……. 가끔씩 굉장히 딱딱하거든."
1006002-58 = "이가 들어가지 않을 정도로 말이지."
1006002-59 = "왜냐면……. 너무 단단하게 얼어 있으니까! 얼어 있는 정도가 지나치니까!"
1006002-60 = "그렇다면 어떻게 해야 할까? 나는 진지하게 고민했지."
1006002-61 = "그리고 생각해 낸 거야. 너무 단단하게 얼었다면, 반대로 녹이면 된다는 것을! 나는 바보지만, 그래도 그 정도는 알거든!"
1006002-62 = "그래서……."
1006002-66 = "[ns7] \"……잠깐. 그래서…….\"\n[ns8] \"설마 그 '녹였다'라는 게…….\""
1006002-69 = "응! 역시 똑똑한 선생님이야."
1006002-70 = "바로 예상해 버리는구나?"
1006002-74 = "이 <메그마 파워>로……!!"
1006002-75 = "[s9] \"아니아니아니아니아니!!\"\n[s10] \"잠깐잠깐잠깐잠깐잠깐!!\""
1006002-78 = "……? 선생님? 갑자기 왜 그래? 그런 다급한 얼굴로."
1006002-79 = "응? 이번에는 그렇게 하지 말자고? 왜?"
1006002-80 = "똑같은 걸 반복해 봐야 결과가 똑같다……?"
1006002-85 = "……과연! 듣고 보니 그러네! 맞아, 그래서 지금까지 저렇게 쌓여 있었던 거지!!"
1006002-86 = "역시 선생님이야!"
1006002-87 = "이야~. 똑똑한 사람들은 뭐가 달라도 다르다니까."
1006002-88 = "음……. 그치만 곤란한 건 여전해. 모리모리군의 단단함은 내 이로 뚫을 수 없고, 그렇다면 먹을 수 없다는 것도 마찬가지니까."
1006002-89 = "뭔가 방법이 없을까……."
1006002-93 = "선생님! 선생님은 똑똑하니까, 뭔가 방법을 알고 있겠지? 가르쳐줘!"
1006002-94 = "부탁이야~! 이대로라면 나는 모리모리군을 먹을 수 없어!"
1006002-95 = "……음? 뭐라고?"
1006002-96 = "이 모리모리군은 언제 샀냐고?"
1006002-97 = "그야 선생님한테 연락할 때쯤부터……."
1006002-98 = "[s] \"그렇다면 지금은 괜찮을 거야.\""
1006002-99 = "……? 그게 무슨 말이야?"
1006002-100 = "응? 지금 먹어 보라고?"
1006002-101 = "음……. 그치만 이가 아플 텐데……."
1006002-105 = "……응! 아니야."
1006002-106 = "똑똑한 선생님의 말이잖아?"
1006002-107 = "선생님이 한 말이니까 괜찮겠지……?"
1006002-111 = "그럼……."
1006002-112 = "간다~~!!"
1006002-119 = "……!? 어라……?"
1006002-125 = "들어간다……! 들어가! 이가 들어가고 있어!"
1006002-126 = "음~!!! 맛있어! 모리모리군! 시원해!!"
1006002-127 = "어떻게 된 거지?"
1006002-128 = "선생님이 오니까 부드러워진 거야? 그런 거야, 모리모리군!?"
1006002-129 = "[s11] \"으음……. 시간으로 녹였다! 라고 해두자, 일단.\"\n[s12] \"때로는 화력보다 인내가 필요한 법…….\""
1006002-132 = "오……."
1006002-136 = "……전혀 이해 못 했다."
1006002-137 = "그치만 뭔가 괜히 대단한 것 같은 말이야!"
1006002-138 = "역시 선생님은 똑똑한 사람이구나!"
1006002-139 = "음음! 기뻐! 덕분에 모리모리군을 먹을 수 있게 됐잖아~."
1006002-140 = "그러니까……. 음!"
1006002-144 = "……자! 선생님도 한 입?"
1006002-148 = "[ns13] \"메구가 다 안 먹어도 돼?\"\n[ns14] \"어라, 나 주는 거야? 괜찮아?\""
1006002-151 = "당연하지!"
1006002-152 = "선생님이 아니었으면 이 모리모리군도 저 모리모리군들'이었던' 것들로 더해져버렸을 거야."
1006002-153 = "어찌됐든 선생님이 와 준다고 말해준 덕분에 이렇게 된 거니까. 같이 나누는 게 맞잖아?"
1006002-157 = "자! 사양 말고 먹어, 선생님도 덥지? 자, 자~!"
1006002-163 = "히히! 어때?"
1006002-164 = "선생님도 맛있지? 모리모리군!"
1006002-168 = "……그럼, 하나 더 먹을까?"
1006002-170 = "(이후 모리모리군을 더 먹기 위해 함께 편의점으로 돌아갔다.)"
1006002-171 = "(하지만 그동안 이미 메구가 너무 많이 사버려서, 모리모리군은 더 이상 남아 있지 않았다…….)"
1006002-172 = "으아아아아~~!!! 모리모리구우우운~!!!"
