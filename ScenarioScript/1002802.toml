[translation]
1002802-1 = "심야에 할 일"
1002802-2 = "(무슨 일을 벌일지 모르는 아스나가 걱정되어 코인 세탁소를 찾아갔다.)"
1002802-5 = "(24시 세탁소였지만, 모두 잘 시간이라 그런지 주변은 고요했다.)"
1002802-6 = "……부우우웅-."
1002802-7 = "(세탁소 안에서 세탁기 돌아가는 소리가 들려왔다.)"
1002802-8 = "[s] 소리가 난 곳으로 향한다."
1002802-15 = "……응?"
1002802-16 = "……방금 뭔가 소리가……?"
1002802-17 = "[s1] \"……아스나?\"\n[s2] \"정말 여기 있었네.\""
1002802-18 = "……?"
1002802-19 = "……?"
1002802-22 = "[wa:650]― 어라? [wa:1250]이런 시간에 [wa:550]웬일이야, [wa:750]주인님?"
1002802-25 = "― ……나? [wa:1350]나야 보는대로 [wa:1300]빨래하러 왔지!"
1002802-28 = "[wa:500]― ……빨래하러 왔는데 [wa:1350]왜 그 모습이냐고?"
1002802-31 = "― 그야 [wa:1200]나머지는 [wa:900]전부 다 빨고 있으니까."
1002802-33 = "― 지금은 속옷까지 다 빨아서, [wa:1450]다른 게 없는 걸?"
1002802-36 = "[wa:1000]― 에~. [wa:1250]거짓말 아닌데?"
1002802-38 = "― 그럼 [wa:450]직접 보고 [wa:1350]확인해볼래?"
1002802-41 = "[ns3] \"아니. 아니야. 내가 잘못했어.\"\n[ns4] \"정말로 그냥 빨래하러 온 거였구나.\""
1002802-44 = "[wa:650]― 아하하, [wa:700]얼굴 빨개!"
1002802-46 = "― 근데 [wa:350]그럼 주인님은 [wa:800]여기 왜 온 거야?"
1002802-49 = "― ……응? [wa:750]나 보러 왔다고? [wa:1700]이 시간에?"
1002802-52 = "[wa:800]― 신난다! [wa:1430]마침 혼자 있기 [wa:550]지루하던 참이었는데!"
1002802-54 = "― 고마워, [wa:750]주인님!! [wa:1450]자, 그럼 [wa:450]뭐 하고 놀까?"
1002802-59 = "사실은 이런 데에서 주인님이랑 만날 거라곤 생각도 못 했는데 말이야."
1002802-60 = "혹시 아까 보낸 연락 때문에 온 거야? 역시 그런 거지? 보내길 잘한 거지?"
1002802-61 = "그 연락 받고……."
1002802-62 = "……!"
1002802-63 = "흐음……."
1002802-64 = "[s5] \"……아스나?\"\n[s6] \"갑자기 진지한 얼굴이 됐다!?\""
1002802-65 = "으음……. 아니. 잠시만……."
1002802-66 = "으음……. 아니. 잠시만……."
1002802-67 = "아무래도 내가 선생님을 갑자기 '콜'해버린 것 같아서. 좀 미안해지는 걸."
1002802-68 = "[s7] \"……콜?\"\n[s8] \"딱히 작전상황 같은 건 아닐 텐데…….\""
1002802-69 = "응. 콜사인을 부르면 응답하는 거야!"
1002802-70 = "아하하하! 그치, 그건 그렇지."
1002802-71 = "그냥 느낌이 그렇다는 거였어. 빙 둘러서 말했는데도 딱 알아차리고 와줬으니까 말이야."
1002802-72 = "……아, 맞다!! 세탁기 돌려야지. 내 정신 좀 봐."
1002802-79 = "(아스나는 빨래 통 안의 빨래들을 세탁기 안으로 털어놓고 버튼을 눌렀다.)"
1002802-84 = "(옆에서 예약으로 돌아가고 있던 다른 세탁기들처럼 아스나의 세탁기도 작동하기 시작했다.)"
1002802-87 = "흠~."
1002802-88 = "근데 진짜로 이렇게 새벽에도 부르면 뿅 하고 나타날 줄 알았으면, 낮에 할 걸 그랬다."
1002802-89 = "선생님도 잠은 자야 하니까 말이지. 그렇잖아?"
1002802-90 = "……응?"
1002802-91 = "아스나도 선생님이 필요하면 와주니까, 선생님도 그렇게 해준 것뿐이라고?"
1002802-92 = "……오……."
1002802-93 = "대단해!! 우리 그런 사이인 거야? 응? 그런 거야, 주인님?"
1002802-94 = "응? 그런 사이가 뭐냐고?"
1002802-95 = "응? 방금 주인님이 말하지 않았어? 서로 불러주면 나와 주는 사이라고."
1002802-96 = "좋아-. 그럼 주인님도 주인님 빨래할 때 불러, 아스나는 언제라도 찾아갈 테니까!"
1002802-97 = "아니면 아스나 빨래할 때 한 번에 같이 해줄 수도 있는데. 그렇게 해 줄까? 그게 편하지?"
1002802-98 = "……응? 괜찮다고? 주인님이 잘못했다고?"
1002802-99 = "아하하하! 왜 사과하는 거야? 반응을 종잡을 수가 없네! 재밌다!"
1002802-100 = "아하하하하!!"
1002802-102 = "(이후 아스나의 빨래가 끝나고 나서도 계속 앉아서 이야기를 나누었다.)"
1002802-103 = "(……그리고 샬레로 돌아오니 이미 아침 해가 뜨고 있었다.)"
