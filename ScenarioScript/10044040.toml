[translation]
10044040-1 = "제4화;그 열차에는"
10044040-2 = "하아……"
10044040-3 = "여기도 없을 줄이야-"
10044040-5 = "버스까지 탔는데…… 아, 아니야…… 기대 안 했어. 기대 안 했어……"
10044040-6 = "[ns] \"그런데……\""
10044040-8 = "[ns] \"그 열차에는 대체 어떤 화물이 실려 있는 거야?\""
10044040-13 = "엥? 말 안 했던가?"
10044040-14 = "선생님한테 말한 적 없어-"
10044040-15 = "생각해 보니까 그러네?"
10044040-17 = "지, 지금까지 아무것도 모르는 상태로 도와주고 계셨던 건가요……"
10044040-18 = "[s1] \"급하다길래……\"\n[s2] \"학생이 부르면 달려와야지.\""
10044040-21 = "와, 와아…… 이런 사람도 있구나……"
10044040-22 = "파햐햐, 역시 시원시원하다니까."
10044040-23 = "잘 들어, 선생님. 그 화물 열차에 뭐가 실려 있냐면……"
10044040-28 = "우리도 몰라!"
10044040-29 = "[s] \"으응……?\""
10044040-31 = "우리한테 화물이 뭔지는 중요하지 않거든."
10044040-32 = "정해진 시간에- 정해진 곳까지 운송한다-"
10044040-33 = "이것만 지키면 되는데, 굳이 화물이 뭔지 알 필요는 없지."
10044040-34 = "[s] \"그런가?!\""
10044040-36 = "뭐, 뭘 긍정하고 계세요……! 아니잖아요, 아무리 생각해 봐도!!"
10044040-37 = "자기가 뭘 운송하는지는 알아야 할 거 아니에요??"
10044040-38 = "사실 알려줬는데, 안 들었어."
10044040-39 = "응- 한 귀로 듣고 한 귀로 흘림-"
10044040-40 = "아주 자랑이네요!!"
10044040-41 = "그~러~니~까~ 아무래도 상관없다고~"
10044040-42 = "알아도- 몰라도- 달라질 건 없어~ 할 일을 하는 것뿐-"
10044040-43 = "으으…… 그, 그럼 결국 간부님들도 시키는 일만 한다, 이거예요?"
10044040-44 = "그게 나빠-?"
10044040-45 = "나쁜…… 나, 나쁘다고 할만한 건지는 잘 모르겠지만……"
10044040-46 = "내가 뭘 할지는 내가 결정하고 싶지 않나요……?"
10044040-47 = "흐응~ 뭐 틀린 말은 아닌데."
10044040-48 = "그치만 너도 시키는 일을 하러 온 거잖아?"
10044040-49 = "그, 그건……"
10044040-50 = "지금도 딱히 네가 결정해서 움직이는 건 아닌 것 같은데!"
10044040-51 = "큭…… 누, 눈치는 좋아가지고 아픈 부분을 찌르다니……"
10044040-52 = "사, 사실 저도 딱히 그렇게 살고 있진 않지만, 그러고 싶다는 거죠……!"
10044040-53 = "내가 왜 이런 걸 말하고 있는 거야? 어쨌든요!"
10044040-54 = "저야 그냥 일개 엔지니어니까 그런 삶을 꿈꾸기만 할 뿐! 이루기는 불가능하다고 생각하고 있지만……!"
10044040-55 = "두, 두 분은 간부잖아요? 충분히 자기가 결정할 수 있는 위치 아니에요?"
10044040-57 = "간부 위에도 간부 있어- 더 높은 사람-"
10044040-58 = "우리도 그냥 중간관리자라고."
10044040-60 = "그, 그런……"
10044040-61 = "물론 너무 재미없을 것 같으면 안 한다고 하겠지만?"
10044040-62 = "아무것도 안 하는 게 더 재미없잖아. 그러니까 그냥 하는 거야."
10044040-63 = "……간부들도 다 똑같네요…… 그, 그럼 나는 뭘 바라보고 살아야……"
10044040-64 = "그냥 살아~ 사는 데 이유가 어딨어-"
10044040-65 = "[ns3] \"삶의 담론이 오가고 있다……\"\n[ns4] \"어쨌든 안의 화물이 뭔지는 아무도 모르는구나.\""
10044040-68 = "응- 엄청 엄청 중요하다고 한 것만 기억나-"
10044040-69 = "선생님 궁금해-? 살짝 열어볼까-?"
10044040-70 = "그, 그럼 안 되잖아요……?"
10044040-71 = "운송하는 게 뭔지 알아야 한다는 건 너였잖아?"
10044040-72 = "그거랑 이거는 다르죠! 비, 비밀 유지 뭐 그런 거 있잖아요……!"
10044040-73 = "몰라! 그런 얘기는 못 들었는데? 파햐햐!"
10044040-74 = "어때, 어때? 선생님! 열어 볼래?"
10044040-75 = "함부로 열어보진 말자고? 에이, 재미없어."
10044040-76 = "우우…… 왠지 불안한 느낌이 들지만…… 벼, 별일 없겠죠……"
10044040-84 = "뭐해, 히카리?"
10044040-85 = "옆에 있는 역에 연락해 봤는데- 우리 열차 거기 있나 봐-"
10044040-86 = "응?? 뭘로??"
10044040-87 = "무전기- 잠깐 빌렸어-"
10044040-88 = "파햐햐! 센스 좋은데, 히카리!"
10044040-89 = "새, 생각해 보니 그런 방법이 있었네요."
10044040-90 = "하지만 또 출발해 버리면 답이 없는데……"
10044040-91 = "꼭 잡고 있으라고 해야지. 바꿔줘, 히카리!"
10044040-96 = "아, 아. 잘 들리나? 거기 담당 하이랜더 역무원?"
10044040-97 = "아…… 네, 네에. 맞긴 한데요……"
10044040-98 = "CCC의 타치바나 노조미야~ 그쪽에 도착한 화물 열차 하나 있지?"
10044040-99 = "그거 우리 건데, 시스템 오류인지 뭔지 자꾸 발차가 돼서 말이야."
10044040-100 = "못 움직이게 좀 잡고 있어 줘. 금방 갈 테니까."
10044040-101 = "아…… 저희 역에는 그렇게 큰 화물 열차를 계속 세워둘 수가 없는데요……"
10044040-102 = "아직 여객 열차들도 계속 운행 중이고……"
10044040-103 = "아니, 꼭 잡고 있어야 해. 아니면 대형 사고거든!"
10044040-104 = "대체 무슨 일이시길래…… 아, 아니…… 그리고 지금 가뜩이나 여기서 라이……"
10044040-105 = "엄-청 중요한 화물 열차야- 장난 아니야-"
10044040-106 = "예?"
10044040-107 = "하아…… 그 열차에, 엄~~청나게 중요한 물건이 실려 있다고!!"
10044040-108 = "지금 발차 시스템 오류 때문에 이리저리 떠돌아다니고 있는 상황이고!!"
10044040-111 = "……"
10044040-112 = "알았지?? 어이, 듣고 있어? 진짜 중요하다니깐?"
10044040-113 = "저, 저기요…… 이분들이 좀 미덥지는 못하지만 지금 한 말은 사실이에요……"
10044040-114 = "어…… 아니, 그게……"
10044040-120 = "지금…… 크로노스 라이브 촬영 중이었는데……"
10044040-124 = "특종이다!!!"
10044040-125 = "여러분! 들으셨습니까!!"
10044040-131 = "이곳에 있는 화물 열차에!! 어마어마한 무언가가 실려있다는데요!!"
10044040-132 = "키보토스를 좌지우지할 수 있을 정도로 대단한 물건일까요?!"
10044040-133 = "과연! 그 물건의 정체는?!"
10044040-134 = "저희가 끝까지 추적해서 보도하도록 하겠습니다!!"
10044040-137 = "[ns] \"……\""
10044040-139 = "이거…… 어……"
10044040-143 = "하하, 망했다."
