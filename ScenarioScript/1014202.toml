[translation]
1014202-1 = "물총놀이"
1014202-2 = "(어느 무더운 날. 나구사를 만나기 위해 백화요란 분쟁조정위원회를 찾아갔다.)"
1014202-6 = "응? 선생님?"
1014202-7 = "연락도 없이 오다니, 무슨 일이야?"
1014202-8 = "[s] \"……물총놀이 하고 있을 줄 알았는데.\""
1014202-9 = "……일단은 훈련의 일종이니까."
1014202-10 = "그리고, 더울 때만 하고 있어."
1014202-11 = "물론 오늘도 덥긴 하지만"
1014202-12 = "……."
1014202-13 = "그 아쉬워하는 표정은 뭐야?"
1014202-14 = "아니, 그보다 왜 손에 물총을 들고 있어?"
1014202-15 = "[s] \"수영복도 챙겨왔지!\""
1014202-16 = "설마 선생님…… 나랑 물총놀이를 하려고 샬레에서 여기까지 온 거야?"
1014202-17 = "[s1] \"더위에 괴로워하는 나구사를 상상했더니…….\"\n[s2] \"나도 괴로워져서…….\""
1014202-20 = "……."
1014202-21 = "역시 선생님은 생각보다 엉큼한 점이 있구나."
1014202-22 = "으으음, 그래도 여기까지 찾아온 손님을 그냥 돌려보내는 건 예의가 아니니……."
1014202-23 = "후우우……."
1014202-24 = "……알겠어. 조금만 기다려. 오늘은 당분간 나 말곤 없을 테니까."
1014202-25 = "[s] \"얏호!\""
1014202-27 = "(잠시 후. 수영복 차림으로 마당에 모였다.)"
1014202-31 = "선생님. 각오는 됐겠지?"
1014202-32 = "[s3] \"나구사야말로!\"\n[s4] \"지는 사람이 빙수 사는 거야!\""
1014202-35 = "선생님은 일반인이니까, 백화요란식 사격술은 사용하지 않을게."
1014202-36 = "팔도 왼쪽만 쓰겠어."
1014202-37 = "일방적인 게임은 재미없으니까."
1014202-38 = "[s] \"후회하게 될걸?\""
1014202-39 = "후후, 과연 어떨까?"
1014202-40 = "그럼…… 시작하자."
1014202-48 = "(결과는…….)"
1014202-54 = "[ns] \"나의 완패구나…….\""
1014202-55 = "얼른 다녀와. 기다리고 있을게."
1014202-57 = "(결국 약속대로 빙수를 사러 갔다 왔다…….)"
1014202-61 = "(잠시 후…….)"
1014202-63 = "[ns] \"응? 아직도 수영복 차림이었네?\""
1014202-64 = "아, 그게…… 덥기도 하고…… 선생님에게 물어보고 싶은 것도 있어서."
1014202-65 = "아무튼 빙수부터 먹자. 기다리고 있었어."
1014202-74 = "[ns] \"빙수, 시원해서 좋네.\""
1014202-75 = "응. 덕분에 더위가 가셨어."
1014202-76 = "그나저나 갑자기 선생님이 찾아와서 물총놀이를 하자니, 깜짝 놀랐어."
1014202-77 = "더위를 식히기 위해 정원에서 물놀이를 한다니……."
1014202-78 = "그렇게 신경 쓰이는 이야기였을까?"
1014202-79 = "물놀이라면 보통 바다나 워터파크를 떠올릴 테니까."
1014202-80 = "하지만…… 그런 곳에 가는 건 왠지 마음이 편치 않아서."
1014202-81 = "응? 어째서냐고?"
1014202-82 = "그게……."
1014202-83 = "그러니까……."
1014202-88 = "내 수영복 차림이 너무 눈에 띄어서……."
1014202-89 = "사람들 눈이 부시면 어쩌나 하고."
1014202-90 = "[s] \"…….\""
1014202-91 = "선생님에게 물어보고 싶은 것도 그거였어."
1014202-92 = "선생님. 나…… 너무 눈에 띄지 않을까?"
1014202-93 = "[s] \"………….\""
1014202-94 = "……선생님?"
1014202-95 = "[s] \"하하하! 역시 나구사는 재미있구나!\""
1014202-96 = "으, 응……?"
1014202-97 = "[s5] \"걱정하지 마! 나구사 때문에 사람들이 괴로워하진 않을 테니까!\"\n[s6] \"오히려 예쁘다고 해줄 거야!\""
1014202-100 = "그런가? 으으음……."
1014202-101 = "어째서 나는……."
1014202-102 = "바라만 봐도 눈부신 소녀가 되어버린 걸까……."
1014202-104 = "(나구사의 고민은 빙수를 다 먹을 때까지 계속되었다…….)"
