[translation]
1014202-1 = "Water Gun Fight"
1014202-2 = "One hot day, I visited the Hyakkaryouran Resolution Council to meet Nagusa."
1014202-5 = ""
1014202-6 = "Oh? Sensei?"
1014202-7 = "I wasn't aware of your intention to visit. Did something happen?"
1014202-8 = "[s] \"...I thought you would be having a water gun fight.\""
1014202-9 = "...That is a training drill."
1014202-10 = "It is intended for hot days only."
1014202-11 = "Although, I suppose the temperatures are high today."
1014202-12 = "..."
1014202-13 = "Why do you look so disappointed?"
1014202-14 = "Furthermore, are those water guns in your possession?"
1014202-15 = "[s] \"I brought swimsuits too!\""
1014202-16 = "Sensei, do you mean to say that you traveled all the way from Schale to Hyakkiyako...in order to challenge me to a water fight?"
1014202-17 = "[s1] \"As I imagined you suffering in heat...\"\n[s2] \"It's like I felt the agony myself...\""
1014202-20 = "..."
1014202-21 = "You truly have a cunning side, Sensei."
1014202-22 = "Hmm, but I suppose it is not good manners to send off a guest like this..."
1014202-23 = "*sigh*"
1014202-24 = "Understood. It is only me here, so I will require a few moments."
1014202-25 = "[s] \"YAY!\""
1014202-27 = "A little while later, we both dressed in our swimsuits and met in the yard."
1014202-30 = ""
1014202-31 = "Are you ready for defeat, Sensei?"
1014202-32 = "[s3] \"Are YOU ready, Nagusa?\"\n[s4] \"Loser buys shaved ice!\""
1014202-35 = "I will refrain from fighting you with the marksmanship the Hyakkaryouran is well-known for."
1014202-36 = "I will also use just my left hand."
1014202-37 = "I believe in a fair fight, after all."
1014202-38 = "[s] \"You'll regret that decision!\""
1014202-39 = "Fufu, we shall see."
1014202-40 = "Then... Let us begin."
1014202-41 = ""
1014202-43 = ""
1014202-48 = "The result was..."
1014202-49 = ""
1014202-53 = ""
1014202-54 = "[ns] \"I got destroyed...\""
1014202-55 = "Please fetch the shaved ice. I will wait for you here."
1014202-57 = "As promised, I went to buy the shaved ice..."
1014202-58 = ""
1014202-61 = "A short while later..."
1014202-62 = ""
1014202-63 = "[ns] \"Oh! You're still in your swimsuit!\""
1014202-64 = "The weather demanded it. And I have something I wish to ask you as well."
1014202-65 = "But first, let us enjoy this shaved ice."
1014202-66 = ""
1014202-68 = ""
1014202-69 = ""
1014202-70 = ""
1014202-71 = ""
1014202-73 = ""
1014202-74 = "[ns] \"The perfect food for hot weather!\""
1014202-75 = "Indeed. It's as if the heat is melting away."
1014202-76 = "I was rather surprised by this sudden water gun challenge."
1014202-77 = "A water gun fight in the garden to best the heat..."
1014202-78 = "Would this perhaps draw too much attention?"
1014202-79 = "I suppose the beach or the water park is considered the norm for such activities."
1014202-80 = "However, I find discomfort in the thought."
1014202-81 = "Hm? Why, you ask?"
1014202-82 = "Because..."
1014202-83 = "I suppose..."
1014202-84 = ""
1014202-86 = ""
1014202-87 = ""
1014202-88 = "Dressed in a swimsuit, I may haplessly draw the attention of all."
1014202-89 = "I could even blind them by accident."
1014202-90 = "[s] \"...\""
1014202-91 = "That was the subject of my question for you, as well."
1014202-92 = "Do you believe...I stand out too much, Sensei?"
1014202-93 = "[s] \"...\""
1014202-94 = "...Sensei?"
1014202-95 = "[s] \"Hahaha! You really are funny, Nagusa!\""
1014202-96 = "H-Huh...?"
1014202-97 = "[s5] \"Don't worry! You won't blind anyone!\"\n[s6] \"They'll just think you're pretty!\""
1014202-100 = "Is that so?"
1014202-101 = "They would simply compliment me?"
1014202-102 = "Perhaps I have evolved into a girl who dazzles with just a glance?"
1014202-104 = "Nagusa continued to ponder the topic as she finished her shaved ice."
