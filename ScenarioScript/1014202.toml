[translation]
1014202-1 = "水槍戰"
1014202-2 = "（某個炎熱的日子。為了見名草而前往了百花繚亂紛爭調停委員會）"
1014202-5 = ""
1014202-6 = "嗯？老師？"
1014202-7 = "沒有聯絡就過來，有什麼事嗎？"
1014202-8 = "[s] 「……我還以為你們正在玩水槍呢。」"
1014202-9 = "……畢竟這也是訓練的一種。"
1014202-10 = "而且，我們只會在天氣炎熱的時候做這種訓練。"
1014202-11 = "雖然今天是很熱沒錯。"
1014202-12 = "……"
1014202-13 = "為什麼你的表情看起來這麼失望？"
1014202-14 = "不，比起這個……你手裡為什麼拿著水槍？"
1014202-15 = "[s] 「泳裝我也帶來了哦！」"
1014202-16 = "難道說……老師是為了跟我打水槍戰，特地從夏萊跑到這裡來的？"
1014202-17 = "[s1] 「一想到名草飽受酷熱煎熬的樣子……」\n[s2] 「我也跟著難受了起來……」"
1014202-20 = "……"
1014202-21 = "果然老師比想像中還要別有心思呢。"
1014202-22 = "唔嗯……不過把特地來訪的客人就這樣打發回去也有失禮節……"
1014202-23 = "呼……"
1014202-24 = "……好吧，麻煩你稍等一下。#n反正今天暫時只有我一個人。"
1014202-25 = "[s] 「呀呼～！」"
1014202-27 = "（過了一會，我們穿著泳裝聚集在院子裡）"
1014202-30 = ""
1014202-31 = "老師，做好覺悟了嗎？"
1014202-32 = "[s3] 「名草才是！」\n[s4] 「輸的人要請吃刨冰哦！」"
1014202-35 = "考慮到老師是一般人，我不會使用百花繚亂式射擊術。"
1014202-36 = "也只會使用左手。"
1014202-37 = "畢竟單方面的勝負很無趣嘛。"
1014202-38 = "[s] 「到時候可別後悔哦？」"
1014202-39 = "呵呵，這恐怕還很難說呢？"
1014202-40 = "那麼……開始吧。"
1014202-41 = ""
1014202-43 = ""
1014202-48 = "（結果……）"
1014202-49 = ""
1014202-53 = ""
1014202-54 = "[ns] 「是我完敗了呢……」"
1014202-55 = "那就麻煩你快去快回了。我會在這裡等你。"
1014202-57 = "（於是按照約定去買了刨冰回來……）"
1014202-58 = ""
1014202-61 = "（過了一會……）"
1014202-62 = ""
1014202-63 = "[ns] 「嗯？你怎麼還穿著泳裝？」"
1014202-64 = "啊，那個……畢竟天氣很熱……而且我還有件事想詢問老師。"
1014202-65 = "總之先吃刨冰吧。我期待好久了呢。"
1014202-66 = ""
1014202-68 = ""
1014202-69 = ""
1014202-70 = ""
1014202-71 = ""
1014202-73 = ""
1014202-74 = "[ns] 「刨冰真涼快啊。」"
1014202-75 = "嗯。多虧如此，暑氣都消除了。"
1014202-76 = "話說回來，老師突然跑來說要打水槍戰，真是嚇了我一跳。"
1014202-77 = "為了消暑在庭院裡玩水……"
1014202-78 = "有那麼讓人在意嗎？"
1014202-79 = "說到玩水，確實都會想到海邊或水上樂園。"
1014202-80 = "可是……我總覺得去那種地方有點不太自在。"
1014202-81 = "嗯？你問為什麼？"
1014202-82 = "那個……"
1014202-83 = "就是……"
1014202-84 = ""
1014202-86 = ""
1014202-87 = ""
1014202-88 = "我穿泳裝的樣子太引人注目了……"
1014202-89 = "我擔心會因此刺傷別人的眼睛。"
1014202-90 = "[s] 「……」"
1014202-91 = "其實我剛才想問老師的也是這件事。"
1014202-92 = "老師……我是不是太耀眼了？"
1014202-93 = "[s] 「…………」"
1014202-94 = "……老師？"
1014202-95 = "[s] 「哈哈哈！名草果然很有趣呢！」"
1014202-96 = "咦，咦……？"
1014202-97 = "[s5] 「別擔心！沒有人會因為名草感到痛苦的！」\n[s6] 「反而會誇你漂亮呢！」"
1014202-100 = "是嗎？嗯……"
1014202-101 = "為什麼我……"
1014202-102 = "會變成光是看著就令人目眩的少女呢……"
1014202-104 = "（名草的煩惱就這樣一直持續到刨冰吃完為止……）"
