[translation]
1014202-1 = "เล่นปืนฉีดน้ำ"
1014202-2 = "(ในบ่ายที่ร้อนจัดของวันหนึ่ง คุณครูแวะไปหานางุสะที่คณะไกล่เกลี่ยข้อพิพาท เฮียกกะเรียวรัน)"
1014202-5 = ""
1014202-6 = "หืม? คุณครู?"
1014202-7 = "มาแบบไม่บอกกันก่อนเลย มีเรื่องอะไรเหรอ?"
1014202-8 = "[s] \"เหมือนกำลังเล่นปืนฉีดน้ำอยู่เลยนะ...\""
1014202-9 = "เรียกว่าเป็นส่วนหนึ่งของการฝึกซ้อมน่ะ..."
1014202-10 = "แล้วฉันก็ทำแบบนี้แค่ตอนอากาศร้อนด้วย"
1014202-11 = "และแน่นอนว่าวันนี้อากาศร้อน..."
1014202-12 = "..."
1014202-13 = "ทำไมถึงทำหน้าผิดหวังแบบนั้นล่ะ?"
1014202-14 = "ไม่สิ ที่สำคัญกว่านั้นคือ ทำไมคุณครูถึงเอาปืนฉีดน้ำมาด้วย?"
1014202-15 = "[s] \"ชุดว่ายน้ำครูก็เอามานะ!\""
1014202-16 = "อย่าบอกนะว่า... คุณครูเดินทางมาจากชาเล่ต์เพื่อจะเล่นปืนฉีดน้ำกับฉันที่นี่น่ะ?"
1014202-17 = "[s1] \"พอนึกว่านางุสะทรมานจากอากาศร้อน ครูก็ทรมานไปด้วย...\"\n[s2] \"ครูไม่อยากให้นางุสะต้องทรมานกับอากาศร้อนคนเดียวน่ะ\""
1014202-20 = "..."
1014202-21 = "คุณครูนี่มีเล่ห์เหลี่ยมมากกว่าที่คิดจริงๆ ด้วย"
1014202-22 = "อืม... แต่จะให้แขกที่อุตส่าห์เดินทางมาไกลจนถึงที่นี่กลับไปก็จะเป็นการเสียมารยาท..."
1014202-23 = "ฮู่ว..."
1014202-24 = "ก็ได้... งั้นรอเดี๋ยวนะ ยังไงวันนี้ก็ไม่มีใครอื่นนอกจากฉันอยู่แล้ว"
1014202-25 = "[s] \"ยะฮู้ว!\""
1014202-27 = "(หลังจากนั้นไม่นาน คุณครูกับนางุสะก็มาที่ลานในชุดว่ายน้ำ)"
1014202-30 = ""
1014202-31 = "คุณครู เตรียมใจไว้แล้วใช่ไหม?"
1014202-32 = "[s3] \"นางุสะนั่นแหละที่ต้องเตรียมใจ!\"\n[s4] \"คนแพ้ต้องเลี้ยงน้ำแข็งไสนะ!\""
1014202-35 = "ในเมื่อคุณครูเป็นคนธรรมดา งั้นฉันจะไม่ใช้ศาสตร์ยิงปืนของเฮียกกะเรียวรันแล้วกัน"
1014202-36 = "ฉันจะใช้แค่แขนซ้ายเท่านั้น"
1014202-37 = "ก็เกมที่ไม่ยุติธรรมมันไม่สนุกนี่เนอะ"
1014202-38 = "[s] \"แล้วอย่าเสียดายทีหลังนะ?\""
1014202-39 = "ฮุฮุ ผลจะออกมาเป็นยังไงนะ?"
1014202-40 = "ถ้างั้นก็... มาเริ่มกันเลย"
1014202-41 = ""
1014202-43 = ""
1014202-48 = "(และผลลัพธ์ก็คือ...)"
1014202-49 = ""
1014202-53 = ""
1014202-54 = "[ns] \"ครูแพ้ราบคาบเลย...\""
1014202-55 = "รีบไปซื้อมาเลย แล้วฉันจะรอนะ"
1014202-57 = "(สุดท้ายคุณครูก็ต้องไปซื้อน้ำแข็งไสตามที่สัญญาไว้...)"
1014202-58 = ""
1014202-61 = "(หลังจากนั้นไม่นาน...)"
1014202-62 = ""
1014202-63 = "[ns] \"หืม? ยังใส่ชุดว่ายน้ำอยู่อีกเหรอ?\""
1014202-64 = "อ่า... ก็อากาศมัน... ยังร้อนอยู่... แล้วฉันก็มีเรื่องอยากถามคุณครูด้วย"
1014202-65 = "เอาเป็นว่าเรามากินน้ำแข็งไสกันก่อนเถอะ ฉันกำลังรออยู่พอดี"
1014202-66 = ""
1014202-68 = ""
1014202-69 = ""
1014202-70 = ""
1014202-71 = ""
1014202-73 = ""
1014202-74 = "[ns] \"น้ำแข็งไสอร่อยและสดชื่นดีจัง\""
1014202-75 = "อื้อ กินแล้วหายร้อนเลยละ"
1014202-76 = "จะว่าไป ฉันประหลาดใจมากเลยละที่จู่ๆ คุณครูก็มาหาฉันและชวนเล่นปืนฉีดน้ำ"
1014202-77 = "ได้มาเล่นน้ำคลายร้อนในสวนด้วยกันเฉยเลย..."
1014202-78 = "มันเป็นเรื่องที่ทำให้คุณครูเก็บมาใส่ใจขนาดนั้นเลยเหรอ?"
1014202-79 = "พอบอกว่าเล่นน้ำ คนอื่นก็จะนึกถึงทะเลหรือไม่ก็สวนน้ำ"
1014202-80 = "แต่ว่า... ฉันไม่ค่อยสบายใจที่จะไปสถานที่แบบนั้นน่ะ"
1014202-81 = "หืม? ทำไมน่ะเหรอ?"
1014202-82 = "คือว่า..."
1014202-83 = "แบบว่า..."
1014202-84 = ""
1014202-86 = ""
1014202-87 = ""
1014202-88 = "ก็เวลาใส่ชุดว่ายน้ำ ฉันจะสะดุดตามาก..."
1014202-89 = "ฉันกังวลว่าจะทำให้คนอื่นแสบตาเอาน่ะ"
1014202-90 = "[s] \"...\""
1014202-91 = "แล้วนั่นเป็นสิ่งที่ฉันอยากถามคุณครูเหมือนกัน"
1014202-92 = "คุณครู ฉัน... ดูเตะตาเกินไปหรือเปล่า?"
1014202-93 = "[s] \"......\""
1014202-94 = "คุณครู...?"
1014202-95 = "[s] \"ฮ่าฮ่าฮ่า! นางุสะนี่ตลกจังเลยนะ!\""
1014202-96 = "หะ... หืม?"
1014202-97 = "[s5] \"ไม่ต้องห่วงนะ! ไม่มีใครเดือดร้อนเพราะนางุสะหรอก!\"\n[s6] \"ครูว่าคนอื่นจะชมว่าสวยมากกว่านะ!\""
1014202-100 = "งั้นเหรอ? อืม..."
1014202-101 = "ทำไมฉันถึง..."
1014202-102 = "เป็นเด็กสาวที่แค่ใครมองมาก็ทำคนนั้นแสบตาไปหมดเลยนะ..."
1014202-104 = "(นางุสะเล่าความกังวลให้ฟังจนกระทั่งกินน้ำแข็งไสหมด...)"
