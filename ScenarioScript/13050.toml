[translation]
13050-1 = "제5화;사막횡단철도"
13050-2 = "입장- 승리 모션-"
13050-3 = "뭐야, 좁잖아? 우린 어디 앉으면 돼? 저긴가?"
13050-8 = "……."
13050-10 = "간부님들, 함부로 남의 부실 뒤지지 마. 냉장고 찾지 말고 적당히 거기 앉아."
13050-11 = "……의자에서 뛰는 것도 안 돼."
13050-12 = "저, 저기……."
13050-13 = "……실례하겠어. 여기가 아비도스 학교의 대책위원회부실이지?"
13050-26 = "……뭘 하려는 건지는 모르겠지만 지금은 참아, 시로코 선배."
13050-27 = "……아니, 딱히."
13050-29 = "네. 저희가 대책위원회입니다."
13050-30 = "제대로 찾아온 건 맞아. 그러니까 본론으로 바로 가보자고. 하이랜더 간부님들."
13050-35 = "이 과자 먹어도 돼?"
13050-36 = "뭐야, 여긴 손님한테 차도 한잔 안 내 주는 거야?"
13050-38 = "아…… 차는, 잠시만요."
13050-39 = "됐어. 금방 갈 거니까."
13050-40 = "우우-?"
13050-41 = "분위기 파악 좀 해 간부님들. 어차피 대접받을 입장이 아닌 것 정도는 알고 있어야지."
13050-42 = "자기들 땅을 되찾기 위해 그 거대 기업 카이저와도 싸워온 자들이야."
13050-43 = "우리는 지금 언제 터져도 이상할 게 없는 화약고 안에 들어와 있는 거니까."
13050-50 = "음……."
13050-52 = "하지만 걱정하지 마. 싸우면 내가 다 이기니까."
13050-60 = "시로코 선배, 릴렉스, 릴렉스!"
13050-66 = "아니 난 딱히……."
13050-67 = "딱히가 아니잖아. 열이 머리까지 뻗쳤잖아. 뭘 아닌척 하는 거야?"
13050-68 = "으, 으응……."
13050-72 = "[ns1] \"자자, 본론으로 들어가 보자, 스오우.\"\n[ns2] \"대책위원회에게 설명할 게 있는 거지?\""
13050-75 = "그래."
13050-76 = "당신이 그 샬레의 선생님이지? 아까는 실례했어."
13050-77 = "일단 지금부터 상황을 설명하겠지만…… 그 설명은 우리가 아니라 다른 사람이 할 거야."
13050-78 = "(치익) ……확인 끝났어. 안전하니까 들어와도 돼."
13050-79 = "콜록, 콜록. 다행이군요. 여기 모래 먼지가 지독해서 말이죠."
13050-80 = "그래. 한시라도 있고 싶지 않았는데. 빨리 들어가지."
13050-81 = "뭐, 뭐야? 이 녀석들은?"
13050-82 = "말조심하는 게 좋을걸? 일단 너희의 채권자들이니까."
13050-83 = "채권자라면……."
13050-84 = "뭐? 비, 빚쟁이……? 지금 빚쟁이를 여기 부른 거야?!"
13050-85 = "세리카 쨩…… 조금만 조용히……."
13050-86 = "맞아요. 이번에 DLB채권을 매수한 사람들인가 보네요……."
13050-87 = "[s] \"뭐, 일단은 이야기를 들어보는 수밖엔 없겠지.\""
13050-88 = "네……."
13050-90 = "……."
13050-92 = "실례하겠네."
13050-93 = "흠. 여기가 아비도스 학생회실인가. 생각보다 훨씬 좁군."
13050-94 = "처음 뵙겠습니다. 우리가 이번 사업에 투자한 사모펀드의 책임자들입니다. 즉, 아비도스 학교의 새로운 채권자들이죠."
13050-95 = "그리고 제가 바로 채권자들의 이익을 대변하는 채권단의 대표입니다."
13050-97 = "아, 안녕하세요……."
13050-98 = "뭐야? 그치만 채권을 구매한 건 네프티스라며? 당신들 네프티스 소속인 거야? 그렇게 안 보이는데?"
13050-100 = "아아, 물론 채권을 매수한 당사자는 네프티스가 맞습니다. 엄청난 금액을 지불하고서 <사막횡단철도>의 권리를 확보했죠."
13050-101 = "하지만 그 돈은 네프티스 혼자서 충당한 게 아냐. 여러 집단에서 투자금을 받아서 산 거라고."
13050-102 = "그래. 일종의 사모펀드를 만든 거지. 그리고 우리가 그 펀드에 투자한 사람들이고."
13050-104 = "사모펀드(私募fund)?"
13050-105 = "소수의 투자자들을 모아서 비공개로 운영하는 투자그룹을 뜻해요……."
13050-107 = "그렇습니다. 저희 사모펀드에 가입되어 있는 투자자들은 저희 말고도 많이 있습니다."
13050-108 = "여기 있는 사채노동조합과 전당포연합, 그리고 압류품경매길드, 젤라틴구미, 자코흥업, 그리고……."
13050-110 = "수상쩍은 녀석들밖에 없잖아……."
13050-111 = "어흠! 흠흠!"
13050-112 = "하하하. 네, 뭐. 인정합니다. 저 또한 암흑가에서 장물을 굴리던 사람이거든요."
13050-113 = "그렇기 때문에 네프티스가 채권을 구매하는 간판 역할을 한 것이죠. 저희는 눈에 띄면 좋은 입장이 아닌지라."
13050-114 = "……."
13050-115 = "점점 더 수상해지고 있는데……."
13050-116 = "어…… 음……."
13050-120 = "[ns3] \"죄송합니다만, 여러분이 아비도스의 채권자라는 걸 증명할 수 있는 게 있습니까?\"\n[ns4] \"수상하다는 건 아니지만, 이런 건 확실하게 하고 가는 게 서로 좋으니까요.\""
13050-123 = "뭐? 우리를 의심하는 거냐!"
13050-124 = "불쾌하군."
13050-125 = "자아, 자자. 진정들 하시고. 여기서는 어른들끼리의 대화답게……."
13050-127 = "(치익) ……저분들은 채권자가 맞습니다. 제가 보증하겠습니다."
13050-128 = "어라, 또 누구……?"
13050-129 = "지, 집사님……?"
13050-130 = "노노미 선배? 아는 사람이야?"
13050-131 = "네…… 네프티스 그룹의 간부이자 저를 돌봐주셨던 집사님이세요……."
13050-133 = "오랜만입니다. 아가씨. 이렇게 인사드리게 되어 죄송합니다."
13050-137 = "제가 상황을 설명하겠습니다. 저희가 채권을 구매하기 위해 사모펀드를 구성해서 자금을 충당했었어요."
13050-138 = "그러니 저분들의 신분은 이 사모펀드의 증명서를 통해 확인하실 수 있으실 겁니다. 자, 이쪽으로 사본을 전달드릴 테니 확인 부탁드리겠습니다."
13050-139 = "아, 네…… 확인하겠습니다."
13050-140 = "……네, 맞아요. 사모펀드의 소속과 권리관계를 보면…… 이분들은 틀림없이 저희 채권의 권리를 가지고 있어요."
13050-142 = "흠흠!"
13050-143 = "자, 이제 됐겠지?"
13050-144 = "[s] \"……네. 실례했습니다.\""
13050-146 = "뭐야…… 그럼 진짜 빚쟁이들이 맞았던 거네."
13050-147 = "세리카 쨩…… 조금만 조용히……."
13050-148 = "후후. 의심이 풀렸다면 됐습니다. 그럼 이어서 설명하겠습니다."
13050-149 = "저희가 여러분들을 찾아온 건 다름이 아니라…… 채권단으로서 채무자인 여러분들과 한가지 논의를 하기 위해서입니다."
13050-150 = "사막횡단철도…… 때문인가요."
13050-152 = "……."
13050-154 = "호오…… 과연. 네. 당연히 이런저런 것들을 찾아보셨겠죠."
13050-155 = "맞습니다. 단도직입적으로 말하자면, 저희는 사막횡단철도 전체의 권리를 확보하는 게 목적입니다."
13050-160 = "(끄덕) 흠흠."
13050-161 = "그걸 위해 <사모펀드>가 존재하는 거지."
13050-163 = "저희가 카이저에게서 채권을 폭리에 가까운 금액으로 구매한 이유가 바로 사막횡단철도의 모든 권리를 확보하기 위해서였죠."
13050-164 = "그리고 거기엔 미완성된 철로의 개발 권리도 포함되어 있죠. 따라서 방금 전 있었던 하이랜더 학원의 개발 행위도 문제가 없습니다."
13050-165 = "그렇다니까. 우리가 공사를 시작한 건 채권 확보 이후였거든? 정당한 개발이었거든?"
13050-166 = "응- 문제-없음-"
13050-170 = "……얌전히 앉아 있어. 간부님들."
13050-171 = "저기…… 그치만 왜 하필 사막횡단철도를……."
13050-172 = "저기, 집사님? 이건 무슨 일인 거죠? 왜 이런……."
13050-173 = "글쎄요…… 저로서는 곤란한 상황이랄까…… 그게 그러니까……."
13050-174 = "자아, 자아. 이해합니다. 네프티스의 영애님."
13050-175 = "사막횡단철도…… 확실히 네프티스와 아비도스에겐 아픈 손가락일 테죠. 이것 때문에 아비도스의 몰락이 가속화되었으니까요."
13050-176 = "아뇨, 대답해 주세요! 집사님! 네프티스는 무슨 생각인 거죠?"
13050-177 = "애초에 시작부터가 잘못된 사업이었어요. 사막화로 몰락해 가는 자치구에 거대한 교통 인프라를 건설한다……?"
13050-178 = "아비도스는 교통의 요지도 아니고 지하자원이 있는 자치구도 아닌데, 모래밖에 없는 이런 황량한 자치구에 교통망을 연결해 봤자……!"
13050-179 = "결국 자금 확보에 실패해서 완성되지 못하고 중단된 계획…… 아비도스의 몰락을 앞당겼을 뿐인 네프티스의 원죄……!"
13050-180 = "그걸 지금 와서 다시 원하는 이유가 뭐죠? 그렇게 큰 지출을 감수하면서까지……?"
13050-182 = "어째서? 지금 거기에 무슨 의미가 있는 거죠?! 네프티스는 대체 무슨 생각을……!!"
13050-183 = "진정해. 노노미 쨩."
13050-184 = "노노미 선배……."
13050-188 = "……그렇군요. 자, 그럼 본격적인 이야기를 해볼까요. 저희가 여기 찾아온 진짜 목적을 말씀드리겠습니다."
13050-189 = "하지만, 그 전에."
13050-190 = "죄송하지만, 지금부터는 책임자와만 이야기하고 싶군요."
13050-191 = "어디보자. <아비도스 학생회>만 남고 다른 분들은 자리를 비켜주시겠습니까?"
13050-192 = "자, 우리는 나가자."
13050-193 = "자, 잠깐만? 밀지 마?"
13050-194 = "우오오- 진짜? 이렇게 빨리 퇴장-하게 될-줄-은-"
13050-198 = "저도 이만 퇴장하겠습니다."
13050-203 = "……네?! 그, 그럼 네프티스는……."
13050-204 = "네프티스의 대표로는 스오우 감독관이 남아주세요."
13050-205 = "……뭐? 정말로?"
13050-206 = "네. 문제없습니다. 그는 하이랜더의 학생이지만 지금은 네프티스에 고용되어 있습니다."
13050-207 = "CCC와는 별개로, 완전히 저희 쪽 사람이니 신뢰해 주셔도 괜찮습니다."
13050-208 = "그럼…… 저는 바쁜 일이 있어서……."
13050-212 = "……."
13050-217 = "뭐야 이거……."
13050-218 = "……."
13050-219 = "으음……."
13050-220 = "[s] \"…………….\""
13050-222 = "응? 뭐 하시죠? <아비도스 학생회> 만 남아달라고 했는데…… 타카나시 호시노 씨 외엔 전부 나가주셨으면 좋겠습니다만……."
13050-224 = "뭐? 아, 아냐! 우리가 아비도스 학교의 학생회가 맞는데?"
13050-225 = "네! <대책위원회>가 아비도스의 학생회입니다! 여기 계신 고문 선생님의 승인도 받은 정식 학생회예요!"
13050-226 = "[s] \"맞아. 내가 승인한 거니 문제없어.\""
13050-227 = "……그렇군요. 흐음."
13050-228 = "그치만 이상한데요……? <아비도스 학생회>는 분명 호시노 씨만 소속되어 있는 걸로 되어 있는데…… 그럼 <대책위원회>라는 학생회가 더 존재하는 겁니까?"
13050-229 = "네? 그, 그건……."
13050-231 = "……. 아. 아, 알겠어. 내가 둘 다 소속되어 있는 상태라서 그런 거 같은데……."
13050-232 = "그치만 <아비도스 학생회>는 이름만 있을 뿐이고, 진짜 학생회는 <대책위원회>가 맞아."
13050-233 = "흐음…… 그렇군요. 좀 복잡하긴 하지만 이해했습니다."
13050-234 = "자아, 그렇다면 이걸 봐주십시오."
13050-239 = "이건……."
13050-240 = "얼마 전, 하이랜더 학원의 문서 창고에서 서류 하나가 발견되었습니다."
13050-242 = "아비도스의 전임 학생회장 쿠치나시 유메가 작성한 친필 계약서입니다."
13050-248 = "……!!"
13050-250 = "다음화;매매계약서"
