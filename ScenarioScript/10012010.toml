[translation]
10012010-1 = "제1화;정말 한 치 앞도 모른다"
10012010-2 = "……라는 것이 아침까지의 상황이었어요."
10012010-3 = "뭔가 너무 좋은 일들만 이어져서 오히려 불안하긴 한데……."
10012010-4 = "[s1] \"과연……. 연달아 많은 일이 있었네.\"\n[s2] \"헬기에 1등 당첨이라니. 완전 행운이잖아!\""
10012010-5 = "그, 그러게요. 말씀드리면서도 스스로 좀……. 당황스러운 느낌이……."
10012010-6 = "그, 그러게요. 말씀드리면서도 스스로 좀……. 당황스러운 느낌이……."
10012010-10 = "뭐…… 살다 보면 이런 일도 있는 거지. 이 아저씨도 조금 놀라긴 했지만 말이야."
10012010-11 = "응응! 분명 그동안 착하고 성실하게 살아온 모두에게 보답이 내려온 걸 거예요! 잘됐네요, 잘 됐어~."
10012010-12 = "……음? 선생님?"
10012010-13 = "아, 잘된 일이라서 축하 파티 겸 초대한 거냐고요?"
10012010-14 = "물론이지. 선생님은 우리 대책위원회의 고문 선생님이니까. 이런 정보는 공유해야 해."
10012010-15 = "뭐……. 물론 단지 그런 정보 공유의 이유만으로 초대한 건 아니지만 말이지."
10012010-16 = "응? 뭔가 더 있냐고? 그건……."
10012010-18 = "사실 세리카 쨩이 당첨되었다는 상품이, 리조트 사용권이었거든요. 아하하……."
10012010-22 = "나, 난들 알았냐고! '1등'이라는 말에 헐레벌떡 뛰어온 것뿐이야!!"
10012010-23 = "진정해, 세리카 쨩. 좋은 게 좋은 거잖아~."
10012010-24 = "생각해 봐. 리조트 사용권이라니, 우리가 언제 한 번 이런 호사를 누려 보겠어?"
10012010-25 = "맞아요! 이왕 이렇게 됐으니, 헬기도 있겠다 다 같이 리조트로 휴가를 다녀오기로 한 거죠!!"
10012010-26 = "지금까지 다들 학교를 위해 열심히 달려오기만 했잖아요? 한 번쯤은 이런 휴식도 필요하다고요."
10012010-28 = "……네. 의견이 이렇게 모여서 선생님께 연락을 드렸던 거예요."
10012010-29 = "으음. 그러니까 그……. 만약 선생님께서만 괜찮으시다면……."
10012010-30 = "[s3] \"같이 데려가 주는 거야?\"\n[s4] \"덕분에 나도 호강하겠네.\""
10012010-31 = "물론이야."
10012010-32 = "물론이야."
10012010-33 = "그리고 좀 먼 곳에 있으니까…… 인솔하는 어른도 있는 편이 좋겠지."
10012010-34 = "선생~. 설마 이렇게 귀여운 학생들을 그냥 보내지는 않겠지? 좋은 게 좋은 거라고?"
10012010-35 = "……괘, 괜찮지……? 선생님……? 응? 괜찮잖아……?"
10012010-36 = "[s5] \"물론이야. 나야 오히려 고맙지.\"\n[s6] \"와! 인생 정말 한 치 앞도 모르는 거구나!\""
10012010-37 = "와아-! 좋아요! 그럼 이걸로 결정-☆"
10012010-38 = "와아-! 좋아요! 그럼 이걸로 결정-☆"
10012010-39 = "응. 바로 준비할게."
10012010-40 = "저, 저도 얼른 헬기 정비할게요!"
10012010-47 = "으헤-. 다들 분주하구만. 수영복부터 챙기러 간 건가~? 청춘이야, 청춘."
10012010-48 = "응? 나? 의외로 즐거워 보인다고?"
10012010-49 = "……먼 곳까지 가는데 귀찮지 않냐고?"
10012010-50 = "……무슨 말이야, 선생. 휴양지라고, 휴양지."
10012010-51 = "'따듯한 햇볕' 아래에 늘어지게 누워있을 곳이라고. 여기처럼 '뜨거운 햇볕'이 아니잖아. 사양할 리가 없지."
10012010-52 = "이야-. 정말……. 살다 보니 이런 날이 다 오는구나. 에헤헤……."
10012010-53 = "정말……."
10012010-55 = "한 치 앞도 모르는 거야, 인생이란……."
10012010-62 = "?"
