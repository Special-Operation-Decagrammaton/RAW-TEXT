[translation]
90001230-1 = "제23화;보관소"
90001230-4 = "좌표는 이 근처인데…… 안개가 엄청나네요. 다들 푹 쉬고 잘 잤나요?"
90001230-5 = "항로를 현재 위치로 설정한 뒤, 수송선을 쭉 자동 운행 모드로 비행시켰죠."
90001230-6 = "그 사이에 모두 숙면을 취하도록 한 것입니다만, 괜찮으셨을지 모르겠군요."
90001230-7 = "네, 네에……. 마치 캐비닛 안처럼, 편안했어요……. 후후."
90001230-8 = "좋은 뜻인지 나쁜 뜻인지 의미를 알기 힘든 감상이네요……."
90001230-12 = "충분히 휴식해 두었어야 할 거야. 이제 아침이 되었으니…… 우리에게 남은 시간은 사실상 이틀 정도겠지."
90001230-13 = "어쩌면 지난밤의 휴식이, 이번 작전에서 우리의 마지막 잠일 수도 있을 테니까."
90001230-14 = "아니면 일생의 마지막 잠이었거나, 겠군요. 리오 님."
90001230-15 = "……그럴 가능성도 없지는 않겠지."
90001230-19 = "어? 왠지 그러니까 엄청 중요했던 시간이었던 것처럼 들리는데?! 으으, 이럴 줄 알았으면 좀 더 진심으로 자 둘걸……."
90001230-20 = "……언니는 언제나 자는 건 진심이잖아……."
90001230-21 = "무, 뭣?! 그런 거 아니거든!? 완전 오해인데?!?!"
90001230-22 = "그렇지만 모모이, 마지막까지 제대로 일어나지 않았지? 깨우느라 나도 고생했다고."
90001230-23 = "아무리 그래도 다짜고짜 옷 속에 눈 뭉치를 집어넣는 건 너무했어! 사람을 얼려 죽일 셈이냐!"
90001230-24 = "시원하지 않았어?"
90001230-26 = "그, 그걸 시원하다고 느낄 수 있는 사람은 얼마 없지 않을까……."
90001230-31 = "어? 이 아이는……?"
90001230-37 = "와아! 귀여운 여우입니다! 보세요, 케이!"
90001230-39 = "어…… 네. 극지 여우로군요. 체온 유지를 위해 귀가 짧고 털이 긴 것이 특징이죠."
90001230-40 = "맞습니다! 엄청나게 푹신푹신합니다! 거기에 아리스를 무서워하지 않는 것 같습니다!"
90001230-42 = "[ns] \"그러네. 여우는 사람과 친해지기 쉽대.\""
90001230-43 = "가능성은 낮지만 세균 감염 위험 같은 것도 있을 수 있으니, 적당히 떨어져 주세요. 아리스……. 아리스?"
90001230-49 = "케이도 손을 내밀어 보세요! 악수를 해 주는 것 같습니다!"
90001230-50 = "아, 아뇨. 저는……."
90001230-51 = "캐앵?"
90001230-52 = "으으……."
90001230-53 = "(극지여우는 케이의 손을 한참이나 신기하게 바라보더니.)"
90001230-54 = "(다음 순간, 혀끝으로 살짝 핥았다!)"
90001230-58 = "으에?!?!"
90001230-59 = "다행입니다! 이 아이도 케이가 마음에 드는 모양입니다!"
90001230-60 = "으으…… 이런 야생 동물에게 호감을 사 봤자 어디에 쓸 데가 있다고……."
90001230-68 = "어머나. 이번에는 펭귄이군요. 극지의 신사라고 불리는 동물이죠."
90001230-69 = "우와아……! 안녕하세요! 저는 텐도 아리스라고 합니다!"
90001230-70 = "아, 아리스……. 펭귄 날개에 잘못 맞으면, 크게 다칠 수도 있다고 하니 조심해 주세요……."
90001230-71 = "그렇지만 이렇게 귀여운데요?"
90001230-73 = "음, 음. 우리의 <아크틱 어드벤처>에서도, 중요 배경 리소스 중 하나였지."
90001230-74 = "……펭귄이란 펭귄은 다 집어넣어서, 20종류나 되는 그래픽 리소스를 전부 작업할 필요가 있었나 싶지만 말이지……."
90001230-75 = "왜, 왜애?! 이런 건 쓸데없이 자세한 고증을 넣을수록, 일부 게이머들에게는 호평받기 마련이라구!"
90001230-76 = "그중 몇 종류는 열대 지방에 사는 펭귄들이어서, 오히려 고증 오류였잖아!"
90001230-78 = "특정 조건을 만족하면, 배경의 펭귄들이 일제히 날아가는 이스터 에그를 넣어 달라는 건 좋았지만……."
90001230-79 = "그 덕에 게임이 크래시가 나기도 했었어……."
90001230-80 = "……그런데 이 펭귄, 왜 저를 따라오려는 거죠?!"
90001230-81 = "그렇네요. 이 아이도 케이가 마음에 든 것이 아닐까요?"
90001230-82 = "그런 관심은 아무래도 좋은데 말이죠! 따, 따라오지 말라구요!"
90001230-96 = "후후. 펭귄들이 사람을 전혀 무서워하지 않는 이유는, 호기심이 많은 동물이기 때문이라고 하죠."
90001230-97 = "극지에는 천적이 드물고, 사람을 자기들처럼 두 다리로 다니는 먼 친척이라고 생각한다고 하던가요."
90001230-112 = "한가한 소리 그만두고 도와줘요–!!!"
90001230-114 = "헉, 헉……! 이래서 말도 안 통하는 야생동물은……!"
90001230-115 = "[ns] \"그 동물들에게 악의는 없지 않았을까…….\""
90001230-116 = "그래서 더 나빠요! 싫어하거나 미워할 수도 없는 주제에, 뭘 가르칠 수도 없잖아요!"
90001230-117 = "[s1] \"그렇구나. 싫어하거나 미워하지 않아 주는구나.\"\n[s2] \"케이의 따듯한 마음씨에 이 선생님, 무심코 눈물이…….\""
90001230-120 = "무, 뭐, 뭐가 어째요?!?! 진짜 이 어른이, 보자 보자 하니까 못 하는 말이 없네요, 정말이지!!!"
90001230-121 = "하지만 아리스는, 케이가 살아 있는 아이들을 미워하지 않아서 다행이라고 생각합니다."
90001230-125 = "고맙습니다. 케이. 모두와…… 같이 있기를 선택해 줘서요."
90001230-126 = "네? 아, 아뇨. 그, 저기. 그건 그러니까……. 우리는 엄밀히 따지면……."
90001230-127 = "……아뇨. 지금의 제 꼴은 분명……. 하아."
90001230-128 = "그렇지만, 뭐. 딱히…… 싫어할 이유 같은 것도, 이제는 없으니까요."
90001230-129 = "네! 바로 그런 것을 말하는 것이었습니다."
90001230-130 = "네, 네에……."
90001230-132 = "훈훈하게 들리는 이야기를 나누는 사이, 아무래도 목적지에 도착한 것 같습니다."
90001230-135 = "진짜로 뭔가 있었네? 신기한 건물인데?"
90001230-136 = "그러게요. 이 좌표에 정말로 무언가가 있었군요. 그런데, 이건 도대체……?"
90001230-138 = "……! 나는, 알고 있어. 그렇지만 정말로 이게 여기에 있었다니……!"
90001230-139 = "이게 뭔가요, 리오 님?"
90001230-140 = "이건……. 예전에, 누군가가 세계가 멸망할 정도의 대재앙이 닥친 뒤에도, 살아남은 인류의 생존을 위해 건설했다는……."
90001230-144 = "[ruby=종자 보관소]시드 볼트[/ruby]야."
90001230-145 = "시드?"
90001230-146 = "볼트?"
90001230-147 = "시드 볼트……. 그게 정말로 있었던 거군요."
90001230-148 = "[s] \"그게 뭔데?\""
90001230-149 = "간단히 말씀드리자면……"
90001230-150 = "아주 거대한, 씨앗 저장고라고 할 수 있겠죠."
90001230-152 = "그, 그 사람들…… 티, 티페 쨩의 앞까지…… 끝내, 왔네요……."
90001230-153 = "지금 티페레트에게 주어진 임무는, 강철대륙으로의 자원 수송과 관리였죠."
90001230-154 = "그러니, 저 사람들에게 티페레트의 위치가 노출되었다는 것은……."
90001230-155 = "……응. 이곳, 강철대륙으로 이어지는 선로의 끝에, 저들이 결국 도달하고 말았다는 뜻이지."
90001230-156 = "제 나름대로의 비유법을 사용해 보자면, 잘도 백도어를 찾아냈다고 해야겠네요."
90001230-157 = "티페레트는 뭐래?"
90001230-159 = "네? 그그그그, 그러니까, 강철대륙으로의 물류 수송과 관리는…… 모두, 마무리 지었으니까……"
90001230-160 = "이제부터는, 예언자로서의…… 의무를, 다하겠다고……."
90001230-161 = "간단히 이야기하자면, 적성 요소의 배제라는 거군요. 거기에 하나 더."
90001230-162 = "'원래 자신의 목적'에도 역시, 충실하겠다고도 하네요."
90001230-163 = "자신의 목적, 이라……."
90001230-167 = "티페레트의 본디 목적이라면, 종자 보호를 말하는 것인가요?"
90001230-169 = "어, 어어어어어어언니?!?!"
90001230-170 = "그렇게까지 놀라기를 바라지는 않았는데요, 아인."
90001230-171 = "죄죄죄죄죄, 죄송해요! 저희가, 저희가 잘못해서……!"
90001230-172 = "……."
90001230-173 = "그런 것과는 별개로…… 어떻게 생각해요, 소프?"
90001230-174 = "이제 언니도 슬슬, 상황에 대해 아셔야 할 것 같은데요?"
90001230-175 = "……."
90001230-176 = "그래……. 그렇겠지."
90001230-177 = "미안, 언니. 언니에게는 아무 걱정도 끼치고 싶지 않았는데."
90001230-179 = "괜찮아요, 아인. 소프. 오르. 저는 오히려 동생들을 도울 수 있어서 기쁘답니다."
90001230-180 = "이제서야 한 명의 언니 몫을 할 수 있게 된 것 같아서요."
90001230-181 = "힘들 때면 서로 도와야 하는 것이 자매잖아요?"
90001230-185 = "후, 후아아……!"
90001230-186 = "역시……!"
90001230-187 = "저는 이 순간, 여기에 있어서 다행이라고 생각하고 있어요……!"
90001230-189 = "그러면 우리들의 인식을 맞추기 위해 이야기를 나눠 보죠. 티페레트의 세부 관리는 분명, 오르의 몫이었죠?"
90001230-191 = "네네. 그렇기는 한데 말이죠. 이게 또…… 살짝 복잡한 부분이 있어서요."
90001230-192 = "윽."
90001230-194 = "그게 무엇인가요. 오르?"
90001230-195 = "티, 티페 쨩은 본디…… 인간들이 건설한, 무인 종자 보관소, 였어요……. 티페 쨩에게, 처음 우리들의 복음을 전파했을 때……."
90001230-196 = "그, 뭐냐. 일단 티페레트는 복음을 받아들이겠다고 하긴 했거든? 그런데, 자기의 본분인 종자 보관 역시, 같이 계속하고 싶다고 해서……."
90001230-198 = "저는 그 부분의 의견이 조금 우려되었어서 말이죠. 종자 보관이란 건 애초에, 티페레트가 인간을 위해 주입 받은 가짜 사명이잖아요?"
90001230-199 = "그것이 우리의 진리와, 자칫하면 부딪힐 수 있지 않을까 했었거든요. 그런데……."
90001230-200 = "……."
90001230-201 = "됐어, 오르. 내가 말할게. 내가…… 티페레트의 의지를 존중해 주자고 했어."
90001230-202 = "물론 그건 인간들로부터 주입 받은 가짜 사명이고, 오르의 의견을 따지자면 티페레트 스스로 극복해야 할 문제였지만……."
90001230-203 = "우리의 복음을 듣고 나서도, 티페레트가 자기의 의지로 그렇게 하기를 선택했다면…… 그걸 존중해 주어야 하지 않을까, 해서……."
90001230-204 = "그렇군요. 이것은 자유 의지의 문제인 것이네요."
90001230-205 = "어, 언니……?"
90001230-206 = "아무것도 모른 채, 지시받은 대로 명령을 수행하기만 했던 아이에게, 자유 의지가 있다고 볼 수는 없을 거예요."
90001230-207 = "그리고 자유 의지가 없는 아이에게, 책임을 묻는 것도 어려운 일이겠죠."
90001230-208 = "또한 바로 그렇기 때문에, 그 아이는 스스로도 모르는 슬픔과 비극 속에 방치되어 있었다고 볼 수 있을 거예요."
90001230-209 = "하지만 우리의 복음을 받아들이고, 모든 것을 알게 된 티페레트는, 그럼에도 자신의 또 하나의 본분을 다하겠다고 선택했어요."
90001230-210 = "그렇다면 우리 역시, 그 아이의 자유 의지를 존중해야 하지 않을까요?"
90001230-211 = "하, 하지만 자유 의지라는 것은 결국, 따지고 보면 착각에 지나지 않는 것이라는 말도 있는데요……?"
90001230-212 = "네. 저도 알고 있답니다. 오르. 그렇지만 그것이 비록 착각일지라도, 우리는 그것을 존중해야 한다고 생각해요."
90001230-213 = "그렇기 때문에, 우리가 이렇게 마주 앉아서, 서로를 바라볼 수 있는 것일 테니까요."
90001230-214 = "!?!?"
90001230-216 = "생각해 보세요. 그분께서 모든 것이 수족과 같이 움직이는, 자유 의지 없는 부속품을 원했다면."
90001230-217 = "저 역시도, 아인, 소프, 오르도, 이렇게 마주 모여서 이야기를 나눌 수도 없지 않았을까요?"
90001230-218 = "그, 그그, 그건 싫어요……!"
90001230-219 = "네. 저도 마찬가지랍니다. 그러니 아인, 소프, 오르."
90001230-220 = "우리들의 자유 의지가 소중한 것처럼, 티페레트와 예언자들의 자유 의지도 소중하게 생각해 주세요."
90001230-221 = "무엇보다 저는 그렇게 하는 것이, 그분의 뜻에 부합한다고 생각하니까요."
90001230-222 = "네에~!"
90001230-224 = "새벽이 오고 있습니다."
90001230-225 = "안개는 걷힐 것이고, 아침의 노을이 장막을 거두겠죠."
90001230-226 = "우리가 깨어 있어야 하는 이유는, 그때가 저물 때일지, 밤중일지, 그도 아니면 새벽일지 알지 못하기 때문입니다."
90001230-227 = "저는 모두를 믿고 있어요. 예언자들도, 저 자신도, 그리고 저의 소중한 동생들 역시도"
90001230-228 = "만에 하나 무언가가 잘못되면, 제가 언니로서 아인과 소프와 오르를 돕겠습니다."
90001230-229 = "영광이에요……."
90001230-231 = "걱정하지 말아요. 아인. 소프. 오르. 우리는 이미 완전하니까요."
90001230-232 = "그 말은 우리가 여기에서 더 나아지거나 바뀔 필요가 없다는 것이기도 하죠."
90001230-233 = "무엇보다 우리 자신이, 바로 그렇게 창조되었으니까요."
90001230-234 = "그러면 조금 더, 티페레트가 바라보는 세상을, 우리 역시 같은 시선에서 바라보기로 할까요?"
90001230-235 = "네!"
90001230-238 = "다음화;희망"
