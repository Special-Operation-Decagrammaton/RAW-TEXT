[translation]
1703-1 = "무인 병동의 유령 씨 3"
1703-2 = "성 테레사 종합병원 4층 무인 병동"
1703-3 = "네에? 유령 씨는 사실 유령이 아니었다고요?"
1703-4 = "그렇다니까! 아까 전부터 그렇게 말하고 있었잖아!"
1703-5 = "하지만 분장이나 연기가 너무나도 진짜 같아서…… 정말 유령인줄만 알았어요."
1703-6 = "그럼 어째서 유령 씨는 병원을 배회하고 계셨던 건가요? #n어두운 무인 병동에서 혼자 술래잡기라도 하셨던 건가요?"
1703-7 = "그런 시시한 이유로 유령 흉내를 낼 것 같으냐! #n내가 이 병원에 숨어든 이유는 사람들이 도망친 틈을 타 물건을 훔치기 위해서 였다고!"
1703-8 = "훔친다고요? 도둑질은 나쁜 일이라구요!"
1703-9 = "그, 그런 건 나도 알고 있어! 하, 하지만 잃어버린 아버지의 유품을 찾기 위해서는 어쩔 수가 없었는 걸……!"
1703-10 = "아버지의 유품이요? 그걸 왜 병원에서 찾고 계신가요?"
1703-11 = "그, 그게 그러니까…… 우리 아버지는 작년에 이 병원에서 수술을 받으셨거든. 그런데 그 때 실수로 아버지의 목걸이를 병원에 두고 나오는 바람에…… 유품을 잃어버리고 말았어."
1703-12 = "나도 다른 환자들에게 폐를 끼치고 싶지는 않았지만…… 병원에서 나를 도통 들여보내주질 않아서 도저히 방법이 없었다고!"
1703-14 = "그런 사정이 있었다면야…… 어쩔 수 없네요."
1703-15 = "그럼 저희도 같이 유품을 찾는 걸 도와 드릴게요!"
1703-17 = "저, 정말이야? 유령 흉내를 내며 도둑질을 하려 했던 나를 도와주겠다고……?"
1703-18 = "딱한 사정이 있는 사람이라면 누구든 가리지 않고 돕는 것이 저희 구호기사단의 좌우명이니까요. #n대신 다른 귀중품에는 절대 손대시면 안 돼요!"
1703-19 = "그야 물론이지! 아버지의 목걸이를 발견하면 바로 돌아가겠다고 약속할게!"
1703-20 = "자, 하나에 쨩. 그럼 이곳에 버려진 귀중품이 없는지 함께 찾아보도록 하죠!"
1703-22 = "네, 선배!"
1703-25 = "선배, 여기 선반 위에 철제 상자가 있어요! #n뭔가 귀중품이 잔뜩 담겨 있어서…… 같이 좀 들어주세요!"
1703-26 = "자, 잠깐만 기다려주세요!"
1703-28 = "영차—! #n어휴, 무거워라……. 이 안에 무어가 들었기에 이렇게 무거운 걸까요?"
1703-29 = "……그 금고를."
1703-30 = "이리 내놔!"
1703-34 = "가, 갑자기 이게 무슨 짓인가요. 유령 씨!"
1703-35 = "하하하, 속았구나! 이 멍청이들!"
1703-36 = "애초부터 아버지의 유품 같은 건 존재하지도 않았다고! 내가 이 병원에 침입한 이유는 유흥비로 쓸 돈을 마련하기 위해서 였지!"
1703-37 = "그것도 모르고 바보같이 나를 돕다니. 역시 트리니티의 학생들은 순진하구만! 하하하!"
1703-38 = "네에? 사람의 호의를 역으로 이용하다니…… 정말 너무해요!"
1703-39 = "너무하기는! 속는 녀석이 바보지, 속이는 사람에게는 아무런 책임도 없다고!"
1703-40 = "그럼 이 금고는 내가 가져가마!"
1703-43 = "서, 선배! 괜찮으신가요?"
1703-44 = "괘, 괜찮아요. 그보다 유령 씨가 훔쳐간 금고를 빨리 되찾아야……."
1703-45 = "걱정 마세요, 선배. #n저 상자는 평범한 금고가 아니라 병원에서 쓰는 고압멸균기거든요!"
1703-46 = "……네? 고압멸균기요?"
1703-47 = "귀중한 장비가 잔뜩 담겨 있다는 점만 두고 본다면 금고나 다름없지만, 저 안에는 고압의 증기도 가득 차 있거든요. 강제로 문을 열기라도 한다면 통째로 쾅! 하고 터져 버릴거예요!"
1703-48 = "콰앙!"
1703-49 = "으아아아악!"
1703-50 = "…………."
1703-51 = "…………."
1703-52 = "하나에 쨩. 앞으로 그런 정보는 더 빨리 말해주세요. #n사람이 다쳤잖아요."
1703-53 = "네에—."
1703-55 = "성 테레사 종합병원 병실"
1703-56 = "다음 날, 아침."
1703-57 = "여러분, 구호기사단이 도착했어요!"
1703-58 = "좋은 아침이에요, 여러분. 지난 밤에는 잘 주무셨나요?"
1703-59 = "아니……. 어제는 위층에서 밤새도록 소음이 이어져서 한숨도 자지 못했어……."
1703-60 = "한동안 요란한 총소리가 이어지더니, 마지막에는 무언가 폭탄 같은 게 터졌다니까! 난리도 그런 생난리가 따로 없었어!"
1703-61 = "그러고보니 어젯밤에는 간호사들 대신 두 사람이 당직을 섰다며? 뭔가 수상한 사람은 없었어?"
1703-62 = "그, 글쎄요……. 저희는 유령이 나온다는 말에 무서워서 4층 근처에는 가까이 가지도 않았거든요. #n포, 폭탄은 잘 모르겠네요."
1703-63 = "그게 뭐야. 밤늦게까지 병원에서 일을 하면서 유령 같은 걸 무서워하면 어떻게 해?"
1703-64 = "하지만 그 점이 또 세리나 쨩 다워서 귀엽다니까. 하하! #n그 쪽의 신입도 그렇게 생각하지?"
1703-65 = "그, 그렇네요. 하하하……."
1703-66 = "어머, 유령 씨. 여기에 계셨군요."
1703-67 = "어제는 말없이 사라지셔서 한참 찾아다녔다고요!"
1703-68 = "뭐야, 하나에 쨩. 오늘 아침에 입원한 이 신입 환자랑 아는 사이였어?"
1703-69 = "신입 주제에 하나에 쨩을 이미 알고 있다니…… 괘씸하잖아!"
1703-70 = "그나저나 유령이라니, 괴상한 별명이네. 왜 유령이라는 별명이 붙은 거야?"
1703-71 = "아, 그게 말이죠. 유령 씨는 그동안 4층의 무인 병동에서 몰래 유령 흉내를 냈던 그—"
1703-72 = "그, 그, 그게 아니라! 유령처럼 무섭게 생겼다고 해서 붙은 별명일 뿐이에요!"
1703-73 = "뭐야, 시시하게. 뭔가 거창한 사연이 있나 했더니만……."
1703-75 = "너, 너희들, 도대체 정체가 뭐야?! #n어째서 입원한 곳까지 따라오며 나를 계속 괴롭히는 거냐고?!"
1703-76 = "저희의 정체요? 저희는 환자가 있는 곳이라면 어디든 찾아가는 구호기사단이랍니다."
1703-77 = "저희는 유령 씨를 괴롭히려는 게 아니라 치료하려는 거예요! #n무서워하실 필요는 조금도 없어요!"
1703-78 = "하지만 너희들, 어제의 일로 앙심을 품고선……."
1703-79 = "앙심이라뇨? 환자 분께서 저희의 실수 때문에 다치셨으니, 빨리 회복하실 수 있도록 도와드리려는 것 뿐이에요."
1703-83 = "다만…… 제 주사는 조금 따끔할 테니 각오하세요?"
1703-90 = "자, 잘못했어! 그러니 아픈 주사만큼은…… #n제발 용서해 줘—!"
1703-91 = "무인 병동의 유령 씨"
