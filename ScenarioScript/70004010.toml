[translation]
70004010-1 = "주인 잃은 선물 1"
70004010-5 = "아, 선생님. 안 그래도 방금 막 샬레 건물에 도착한 참이야."
70004010-6 = "……응. 오늘은 유난히 말썽을 부리는 아이들이 많았거든. #n조금 뛰었더니 목이 조금 말라서 마실 것 좀 사서 올라가려고."
70004010-7 = "혹시, 선생님 것도 하나 필요해?"
70004010-11 = "……후후. 선생님이라면 그렇게 말할 줄 알았어."
70004010-12 = "알겠어. 금방 올라갈게. 오늘 당번 활동도 기대하고 있을게."
70004010-16 = "구입하신 물건은 에너지 드링크 두 병과 블랙커피 한 캔 맞으실까요? 총 420엔입니다."
70004010-17 = "응. 계산은 카드로 해도 괜찮을까?"
70004010-21 = "……고마워.#n아, 봉투는 괜찮아. 바로 마실 거니까."
70004010-26 = "(수상해……)"
70004010-30 = "아, 선생님. 혹시 올해 크리스마스 케이크는 주문했어?"
70004010-31 = "……응? 케이크는 필요 없다고? 혹시 선생님은 치킨을 먹는 쪽이야?"
70004010-32 = "올해 크리스마스도 바빠서 저녁은 대충 때울 것 같다니…… 그건 좀 슬픈 일이네."
70004010-37 = "선생님, 방금 모모톡으로 보낸 주소 한번 봐 봐. #n배달을 전문으로 하는 조각 케이크 전문점인데, 전에 먹어보니 꽤 괜찮았거든."
70004010-38 = "아무리 바쁘더라도 달콤한 디저트 하나 정도는 챙길 수 있잖아? 크리스마스인데."
70004010-39 = "구입하신 물건은 다쿠아즈 하나와 푸딩 두 개, 초콜릿 바움쿠엔 하나 맞으실까요?"
70004010-40 = "아, 죄송. 잠시만요. 여기, 우유도 하나 추가할게요."
70004010-41 = "다해서 780엔입니다. 봉투 필요하신가요?"
70004010-42 = "네, 감사합니다~"
70004010-47 = "(아무리 생각해도……)"
70004010-50 = "선~생~님~ 이 영수증은 도대체 뭔가요?"
70004010-51 = "시치미 떼셔도 소용없어요! 어제 세미나에 제출하신 영수증 목록에 로봇 장난감 구매 영수증이 포함되어 있었다고요!"
70004010-52 = "분명 지난달에도 업무 지출 보고서에 게임 영수증을 섞어서 제출하셨으면서—"
70004010-56 = "네? 스스로를 위한 크리스마스 선물이었다고요?"
70004010-57 = "그렇다고 해도 어째서 업무 보고서에 사적인 영수증이 포함된 건가요?"
70004010-58 = "……안 되겠어요. 지금 올라가서 가계부를 확인할 테니, 그대로 기다리고 계세요!"
70004010-59 = "저…… 구입하신 물건은 9mm 권총탄 30발과 스피드 로더 하나, 맞으신가요?"
70004010-60 = "아, 미안. 계산대를 앞에 두고 너무 큰 소리를 냈네."
70004010-61 = "응. 이것만 부탁할게. 가격은 다해서 1810엔 맞지?"
70004010-62 = "네. 혹시 봉투는—"
70004010-68 = "……가버리셨네."
70004010-72 = "(역시 수상해……!)"
70004010-75 = "오늘도 샬레에 다녀간 학생이 10명—"
70004010-76 = "아니, 편의점에 들르지 않은 학생까지 더하면 20명은 되려나?"
70004010-77 = "선생님의 일을 도우러 온 당번 학생은 어쩔 수 없다 하더라도, 특별한 일정도 없는데 일부러 샬레를 찾아오다니…… 수상해."
70004010-78 = "들리는 소문에 의하면 샬레의 선생님은 학생들의 고충을 해결해 주고, 위기에 빠진 시민들을 내버려두지 않는 친절한 어른이라고 하지만."
70004010-79 = "다른 한편으로는 수영장에서 알몸으로 헤엄을 쳤다던가, 학생의 발을 핥았다던가— 하는 흉흉한 소문도 함께 들려오는데……"
70004010-80 = "이런 수상한 소문이 있는데도, 어째서 다들 일부러 선생님을 만나러 오는 걸까?"
70004010-81 = "……어쩌면, 샬레의 선생님은 수상한 방법으로 학생들을 유혹하고 있을지도 몰라."
70004010-82 = "소문으로 전해지는 샬레의 수상한 물건 중에 사람을 조종할 수 있는 최면 도구 같은 게 있을지도 모르고—"
70004010-83 = "[s] \"무슨 최면 도구 말이야?\""
70004010-84 = "서, 선생님?! 어, 언제 오셨나요?"
70004010-85 = "어, 어서 오세요! 엔젤 24입니다!"
70004010-86 = "[s1] \"안녕, 소라.\"\n[s2] \"무슨 생각을 그렇게 하고 있었어?\""
70004010-87 = "아, 아무것도 아니었어요! 그냥 요새 SNS에서 유행하는 소문 같은 걸 읽던 중이라……"
70004010-88 = "아, 아무것도 아니었어요! 그냥 요새 SNS에서 유행하는 소문 같은 걸 읽던 중이라……"
70004010-89 = "[s3] \"SNS 소문 중에는 재미있는 게 많지.\"\n[s4] \"다만 허황된 게 가끔 있으니 너무 믿지는 마.\""
70004010-90 = "네, 넵! 주의할게요."
70004010-91 = "네, 넵! 주의할게요."
70004010-92 = "[ns] \"그나저나 요새 많이 바빠 보이네.\""
70004010-93 = "네. 이번 주는 평소보다 손님들이 많이 방문하셔서, 조금 정신이 없는 것 같네요."
70004010-94 = "……아무래도 곧 연말이고, 크리스마스니까요. 케이크나 조각 치킨 같은 주전부리들이 잘 팔리는 것 같아요."
70004010-95 = "[s] \"그러게. 벌써 한 해가 거의 끝나버렸네…….\""
70004010-99 = "선생님께서 구입하신 물건은…… 민트 껌 한 통과 레몬 젤리 하나 맞으신가요?"
70004010-100 = "이 레몬 젤리는 지금 프로모션 기간 중이라, 구입하시면 비타민 드링크 하나를 서비스로 드리고 있어요. 같이 챙겨 드릴게요."
70004010-101 = "[s] \"그건 소라에게 줄게.\""
70004010-102 = "네, 네? 저한테요……?"
70004010-103 = "[s5] \"응. 오늘 고생 많았잖아. 소라가 마셔.\"\n[s6] \"같은 빌딩 쓰는 주민끼리 돕고 살아야지.\""
70004010-104 = "아, 네…… 가, 감사합니다."
70004010-105 = "아, 네…… 가, 감사합니다."
70004010-106 = "(……역시 [USERNAME] 선생님은 수상한 어른이긴 하지만……)"
70004010-107 = "저, 선생님. 사실 하나 여쭈고 싶었던 게—"
70004010-112 = "저, 죄송합니다. 혹시 요괴 MAX 커피 맛은 재고가 없나요?"
70004010-113 = "네, 네? 요괴 MAX 커피 맛이요……?"
70004010-114 = "분명 재고가 남아 있었을 텐데…… 잠시만요. 금방 창고에 가서 확인을—"
70004010-119 = "[ns] \"다녀와. 손님 응대가 먼저니까.\""
70004010-120 = "네……! 그, 그럼 실례하겠습니다!"
70004010-125 = "(……하지만 그 이후로도 엔젤 24에는 계속해서 쉴 새 없이 손님이 몰려들었다.)"
70004010-127 = "하아…… 이제야 한숨 돌렸네."
70004010-128 = "정말 고된 하루였어. 매장 청소할 시간도 없을 정도로 이렇게 손님이 많았던 날은 처음인 것 같아……"
70004010-129 = "결국 어째서 학생들이 선생님을 찾아오는지에 대해서는 묻지 못했네."
70004010-130 = "일단 그건 다음에 생각하고 매장 청소부터 할까……"
70004010-138 = "언제나 행복을 전하는~♪ 해피, 해피 엔젤 24~♪"
70004010-145 = "어라, 이건……"
70004010-146 = "……선물? 누가 두고 간 거지?"
70004010-147 = "샬레를 방문한 학생 중 누군가가 선생님께 드리려던 걸 놓고 간 걸까?"
70004010-148 = "일단은 가게 앞에 분실물 안내 공지를 써 붙여야—"
70004010-152 = "……아니야. 그랬다가는 큰 소란이 일어날지도 몰라."
70004010-153 = "키보토스 대부분의 학생들이 선생님께 호감을 갖고 있는 상황에, 누군가가 자신의 마음을 먼저 선생님께 전하려 했다는 걸 모두가 알게 된다면……"
70004010-154 = "심지어 그 선물의 주인이 학원의 높으신 분이었다면…… 자칫 학원 간의 항쟁으로 발전할지도!"
70004010-155 = "하, 하지만 어쩌지? 이걸 모른 척할 수도 없고…… CCTV의 사각에 놓여 있어서 누가 가져왔는지도 확인이 어려우니……"
70004010-159 = "역시 직접 물어보는 수밖에 없겠어."
70004010-160 = "오늘 가게에 방문한 손님들의 얼굴은 대충 기억하고 있으니까…… 다른 사람에게 들키지 않게, 잃어버린 물건이 없는지 한 사람씩 물어보는 거야."
70004010-162 = "키보토스의 평화를 위해서라도, 이 선물의 주인은 꼭 찾아내야 해!"
