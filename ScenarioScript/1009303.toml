[translation]
1009303-1 = "거침없이 다가오는 키라라 씨"
1009303-10 = "쌤, 안냥안냥………………"
1009303-11 = "하아……"
1009303-12 = "[ns1] \"평소보다 엄청 텐션 떨어져 있는데!\"\n[ns2] \"키라라가 이렇게 기죽은 모습은 처음인데?!\""
1009303-18 = "아하하, 평소처럼 하려고 했는데, 티 났으려나……."
1009303-19 = "그게, 모모톡으로 말했듯이 시험을 완전히 망쳐 버렸거든."
1009303-20 = "성적에 큰 관심은 없지만, 그래도 낙제만큼은 늘 피해 왔단 말야."
1009303-21 = "역시 조금 충격이었달까……?"
1009303-22 = "[s] \"시험 문제가 어렵게 나온 거야?\""
1009303-23 = "아니…… 문제 난이도보다는……."
1009303-24 = "사실은 내가 시험 범위를 착각했어!"
1009303-25 = "[s] \"시험 범위를?\""
1009303-26 = "그게 말이야~ 시험을 앞두고 친구들하고 모여서 열심히 공부하자고…… 파자마 파티를 열었는데."
1009303-27 = "[s] \"그건 엄청 키라라답네!\""
1009303-28 = "그렇게 해서 모여서 같이 수다를 떨고 합심해서 열심히 시험공부를 하고."
1009303-29 = "이만하면 완벽해~! 하는 정도로 열심히! 또 잘했다고 생각했는데……."
1009303-30 = "막상 시험 당일날…… 시험지를 열어보니까…… 처음부터 시험 범위를 착각하고 있었던 거 있지?!"
1009303-31 = "[s] \"아…… 가끔 있지, 그런 일…….\""
1009303-32 = "결국 그거 때문에 시험에서 낙제해 버렸지 뭐야. 너무해~!"
1009303-33 = "아무튼아무튼!"
1009303-34 = "공부 좀 가르쳐 주라! 응? 보충 시험, 일주일 뒤란 말야."
1009303-35 = "혼자서 하면 졸릴 것 같고, 그렇다고 또 친구들을 부르면 떠들면서 놀 것 같고……."
1009303-36 = "역시 쌤밖에 부탁할 사람이 없는걸!"
1009303-37 = "[s3] \"알았어. 도와줄게.\"\n[s4] \"좋아, 즉석 과외 시작이다!\""
1009303-43 = "고마워, 쌤! 진짜진짜 열심히 할게!"
1009303-45 = "(그런 이유로, 샬레 휴게실에서 키라라의 개인 과외를 시작했다…….)"
1009303-53 = "와아, 그렇구나! 그 공식에 대입하면 완전 쉬운 거였네!"
1009303-54 = "쌤은 어떻게 알았어?"
1009303-55 = "[s] \"답지를 봤으니까?\""
1009303-56 = "뭐야! 반칙 아냐?"
1009303-57 = "아하핫! 농담이야, 농담."
1009303-62 = "[ns] (음……?)"
1009303-63 = "다음 문제도 가르쳐 주라! 쌤이 설명해 주니까 혼자 공부할 때보다 더 잘 되는 느낌이야!"
1009303-64 = "다음 문제는 도형을 옆으로 돌려 보면 쉽다, 고?"
1009303-65 = "어디어디?"
1009303-69 = "어라? 정말 몸을 돌리니까 답이 보이네…… 신기하다!"
1009303-70 = "아하핫! 이걸 놓치다니 이런 실수를~"
1009303-71 = "[s] (으음, 키라라가 옆에 딱 붙어서……. 으으음~)"
1009303-75 = "쌤."
1009303-76 = "[s] \"……응?\""
1009303-78 = "손 크기, 나보다 큰 것 같은데 한 번 포개 봐도 돼?"
1009303-79 = "자, 펜은 잠깐 놓고~"
1009303-83 = "응, 손을 쫙 펴고, 이렇게 손바닥을 맞대면……."
1009303-84 = "어라? 비슷하네?"
1009303-85 = "아하핫! 그래도 나보다 체온은 좀 더 높을지도? 따뜻해서 기분 좋아!"
1009303-86 = "[ns] (역시나 스스럼없는 거리감……!)"
1009303-90 = "왜 그래, 쌤? 그렇게 당황한 얼굴로 눈을 동그랗게 뜨고. 뭔가 있어?"
1009303-91 = "아하핫! 혹시……."
1009303-92 = "창밖에서 날아가는 UFO라도 봤다든가~?!"
1009303-93 = "[s] \"아니, 그…… 키라라. 조금은…… 많이 가까운 것 같아서 말이야.\""
1009303-94 = "뭐가? 보충시험 합격이?"
1009303-95 = "[s5] \"그, 그렇네. 아니, 아무것도 아니야.\"\n[s6] (그래, 키라라는 순수하게 시험공부를 하려는 거니까…….)"
1009303-98 = "아하핫! 걱정 마! 쌤이 가르쳐준 만큼 나도 결과로 보답할 테니까!"
1009303-99 = "그러니까 다음 문제 해설 부탁해!"
1009303-101 = "(과외는 그대로 잘 마무리되었지만……)"
1009303-102 = "(아무렇지도 않게 거리감을 좁혀 오는 키라라에게 휘둘리느라, 시간이 어떻게 지나갔는지 기억이 나지 않았다.)"
