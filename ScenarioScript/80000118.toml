[translation]
80000118-1 = "S+의 크레이프"
80000118-2 = "(또 낙제 위기라는 키라라의 메시지를 받고, 게헨나의 조리실습실로 갔다.)"
80000118-4 = "이쪽이야, 쌤!"
80000118-5 = "헤헤, 이번에는 말이지 선생님, 나……."
80000118-6 = "조리 실습 과목에서 낙제 위기랍니다!"
80000118-7 = "[s] \"낙제가 코앞인데 텐션이 높아……!\""
80000118-8 = "그게 말이야, 분명 정성은 빈틈없이 담았는데, 기술적인 문제라고 해야 할까……."
80000118-9 = "반죽이 자꾸 찢어지거나, 구겨지거나, 난리도 아니더라고."
80000118-10 = "아? 메뉴가 뭐냐고?"
80000118-11 = "그건 바로…… 초콜릿 크레이프!"
80000118-12 = "얇게 구워서 말아 낸 크레이프에 풍성하게 초콜릿을 담아내는 게 핵심이야!"
80000118-13 = "그런데 반죽을 굽는 단계부터 실패해 버려서……."
80000118-14 = "[s] \"좋아, 그러면, 같이 문제를 해결해 볼까?\""
80000118-15 = "응응! 좋아, 선생님!"
80000118-17 = "(그 뒤로 키라라와 함께 크레이프의 문제를 해결해 나갔다.)"
80000118-18 = "(반죽의 농도를 다시 맞추고, 불의 세기도 조절해 보고, 팬의 상태도 다시 점검했다.)"
80000118-19 = "(그렇게 여러 차례의 시행착오 끝에, 동그랗고 깔끔한 크레이프를 부쳐 낼 수 있었다.)"
80000118-21 = "이것 봐 선생님! 드디어 찢어지지 않고 매끈하게 부쳐졌어!"
80000118-22 = "자 그럼, 초콜릿 크림을 얹고, 이렇게 접어서 말아낸 뒤에……."
80000118-23 = "초콜릿과 초코 아이스크림과 초코 과자를 이렇게 듬뿍 얹으면……!"
80000118-28 = "짜잔! 선생님을 위한 발렌타인 초콜릿 크레이프! 완성!"
80000118-29 = "그럼 채점 부탁할게!"
80000118-30 = "[s] \"응? 채점?\""
80000118-31 = "응! 사실 이 과목의 담당 교사는 선생님이거든! 수강자는 나 혼자!"
80000118-32 = "사실 발렌타인데이 기념으로 선생님한테 직접 만든 크레이프를 주고 싶어서 말이야, 헤헷."
80000118-33 = "그래서, 어때 어때? 낙제는 면할 정도의 맛이야? 성적은? A+?"
80000118-34 = "[s] \"음…… 아니.\""
80000118-35 = "에에?"
80000118-36 = "[s] \"이 정도면…… S+는 받아야지……!\""
80000118-37 = "아하핫! 고마워, 선생님!"
80000118-39 = "(그렇게 크레이프 위에 소복이 쌓인 초콜릿을 키라라와 나눠 먹었다.)"
