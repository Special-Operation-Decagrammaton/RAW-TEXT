[translation]
10048030-1 = "제3화;누가 자줏빛과 푸른빛을 귀여워하랴"
10048030-2 = "하루 전……."
10048030-4 = "와일드헌트 자치구 밖 어느 카페"
10048030-7 = "저기, 그쪽이…… <특수교역부>의 영업 실장님, 맞으시죠?"
10048030-11 = "후후, 그렇습니다."
10048030-12 = "일단 앉으시죠."
10048030-13 = "아, 예."
10048030-14 = "그런데…… 뭐든지 입수해 준다는 게 정말인가요?"
10048030-15 = "네. '교역'이 제 일이니까요."
10048030-16 = "그리고 뭐 전적은…… 여태까지 실패가 없었다, 정도로 말해 두죠."
10048030-17 = "오오……!"
10048030-18 = "그나저나 무슨 의뢰인지 궁금하네요. 지금까지 와일드헌트의 외부인이 저희에게 의뢰한 적은 한 번도 없었거든요."
10048030-19 = "해서, 바로 본론으로 들어가죠. 무엇을 원하시는지?"
10048030-20 = "으음, 이런 것을 교역……이라고 하기에는 약간 어폐가 있습니다만, 일단 말씀드리겠습니다."
10048030-24 = "……저는, 와일드헌트 내에 있는 그림 한 점을 밖으로 밀반출하고 싶습니다."
10048030-26 = "……."
10048030-30 = "……이 이야기는 못 들은 것으로 하겠습니다."
10048030-31 = "저기 잠깐만요, 일단 끝까지 들으시고……!"
10048030-32 = "끝까지 들을 게 뭐가 있습니까! 그건 그냥 절도잖아요!"
10048030-33 = "그런 일은 특수교역부가 아니라 절도부나 괴도부에 의뢰하세요!"
10048030-34 = "그런 동아리도 있어요?!"
10048030-35 = "있겠습니까?!"
10048030-36 = "그럼 일단 제 말을 한 번만 들어주세요……! 끝까지 듣고 판단하셔도 늦지 않지 않습니까!"
10048030-43 = "……좋아요, 일단 말씀해 보세요."
10048030-45 = "……저는 화가입니다."
10048030-46 = "지금은 그럭저럭 이름값이 높아져서 먹고사는 데에 지장은 없지만……"
10048030-47 = "……젊은 시절에는 그렇지 않았죠."
10048030-48 = "그 시절에는 정말 먹고 살기 위해 별의별 일들을 다 했습니다."
10048030-49 = "그리고 그렇게 했던 일 중에……."
10048030-51 = "……위작 제작도 있었습니다."
10048030-52 = "위작……이요?"
10048030-53 = "예. 비싼 그림의 위작을 제작하여 비싸게 팔아 치우는 작업이었죠."
10048030-54 = "먹고 살기 위해 했던 다른 일들은 조금도 부끄럽지 않지만……."
10048030-55 = "……위작을 그린 일만큼은, 평생 제 마음속에 지워지지 않는 부끄러움으로 남아 있습니다."
10048030-56 = "저는, 이런 저의 과거를 바로잡고 싶습니다."
10048030-57 = "……근데 그 사연과 이번 의뢰 사이에 무슨 상관이 있는 거죠?"
10048030-58 = "이번에 와일드헌트에서 <베로니카 특별전>이 열리죠?"
10048030-59 = "그 전시회에…… 제가 제작한 위작도 전시될 예정입니다."
10048030-60 = "……!"
10048030-61 = "그러니까, 베로니카 재단이 소유한 그림 중에, 의뢰인님이 그린 위작이 섞여 있다는 말씀이죠?"
10048030-62 = "예. 베로니카 측은 그것을 진품으로 생각하고 있습니다."
10048030-63 = "어떤 그림인데요?"
10048030-64 = "그것은 바로……"
10048030-67 = "[log=시민 동물6 의뢰인]<누가 자줏빛과 푸른빛을 귀여워하랴>입니다.[/log]"
10048030-70 = "그 그림의 위작을 제작했다고요?!"
10048030-71 = "오, 바로 알아들으시는군요."
10048030-72 = "대부분의 사람은 그림 사진을 보여줘도 잘 모르던데……."
10048030-73 = "와일드헌트 학생이면 모를 수가 없죠."
10048030-74 = "미술사를 배우다 보면 무조건 한 번은 짚고 넘어가는 그림이니까요."
10048030-75 = "……후후, 오랜만에 교양 있는 분과 대화하게 되니 마음이 한결 편하군요."
10048030-76 = "대다수 대중은 이런 기초적인 지식조차 갖지 않은 경우가 태반이라……."
10048030-77 = "……어쨌든, 저는 과거 <누가 자줏빛과 푸른빛을 귀여워하랴>의 위작을 그렸었고, 그 위작은 <베로니카 특별전>에 전시될 겁니다."
10048030-78 = "그렇다면…… 의뢰인님은 저희가 그 그림을 빼내어 오길 원하시는 거죠?"
10048030-79 = "그렇습니다."
10048030-80 = "솔직히 말씀드리죠. 매우 힘듭니다."
10048030-81 = "그림을 빼내어 오는 거야 어떻게 한다고 쳐도, 이후에 와일드헌트 전체가 발칵 뒤집힐 거예요."
10048030-82 = "위작인지 아닌지를 떠나서, 일단 도난 사건이 벌어진 것이니……."
10048030-83 = "차라리 재단 측에 접선해서 위작임을 밝히시는 것이 낫지 않겠습니까?"
10048030-84 = "저에게는 그 그림의 진품이 있습니다."
10048030-88 = "……네?"
10048030-89 = "저는 얼마 전 지하 경매장에서 <누가 자줏빛과 푸른빛을 귀여워하랴>의 진품을 구했습니다."
10048030-90 = "바로 이것입니다."
10048030-94 = "……!"
10048030-95 = "위작을 밖으로 빼내고, 이 진품을 그 자리에 가져다 놓아주십시오."
10048030-96 = "그렇다면 큰 소란 없이 넘어갈 수 있을 겁니다."
10048030-97 = "아니 이러면 정말로 재단 측에 말해서 진품을 넘기는 쪽이 나을 텐데……."
10048030-98 = "저는 위작을 그린 화가로 남고 싶지 않습니다."
10048030-99 = "……하지만 제가 저질렀던 잘못은 바로잡고 싶고요."
10048030-100 = "물론 무지한 대중은 위작이든 진품이든 구별을 못 할 겁니다."
10048030-101 = "그래도, 저는 이렇게라도 저의 부끄러운 과거를 털어내고 싶습니다."
10048030-102 = "가능…… 하실까요?"
10048030-106 = "……솔직히, 여전히 마음에 걸리는 부분이 있습니다."
10048030-107 = "만약, 전시회에 있는 그림이 위작이 아니라 진품이라면요?"
10048030-108 = "저를 믿지 못하시나요?"
10048030-109 = "믿을 근거가 부족하다, 정도라고 말해 두죠."
10048030-110 = "어쨌거나, 그렇게 되면 저희는 진품 그림을 빼돌리고 위작으로 바꿔치기 하는 일을 저지르는 것이 됩니다."
10048030-111 = "물론 저는 회화 전공이 아니긴 합니다."
10048030-112 = "다만 저도 예술을 하는 입장이기에, 이는 솔직히 받아들이기 어려운 의뢰입니다."
10048030-113 = "그러면 이렇게 하시죠."
10048030-114 = "전시회에서 빼낸 그림은, 특수교역부가 마음대로 처분하십시오."
10048030-115 = "소장하시든, 불태우시든, 폐기하시든 말이죠. 세상에 공개되지만 않는다면, 마음대로 다루셔도 됩니다."
10048030-116 = "네……?!"
10048030-117 = "생각해 보세요. 현재 베로니카가 가진 것이 정말 진품이라면, 제가 감히 이런 제안을 할까요?"
10048030-118 = "그것이 확실한 위작이기에, 이런 제안을 드릴 수 있는 겁니다."
10048030-119 = "어떻습니까, 이 정도면 저의 진심을 믿기에 충분하실까요?"
10048030-120 = "……."
10048030-122 = "[log]다시, 현재.[/log]"
10048030-125 = "[ns] \"그런 의뢰를 받았구나…….\""
10048030-126 = "그래서, 뭐라고 답했는데요?"
10048030-128 = "후후."
10048030-134 = "잠깐 이건……."
10048030-135 = "<누가 자줏빛과 푸른빛을 귀여워하랴>……?! 진짜?!"
10048030-136 = "오……."
10048030-137 = "예쁘네."
10048030-138 = "신기하네요. 이 그림을 전시장 벽이 아니라 이런 곳에서 보게 되다니……."
10048030-139 = "그나저나 이거…… 진짜 진품이에요?!"
10048030-140 = "물론."
10048030-141 = "그런데 잠깐만."
10048030-142 = "이걸 후유가 갖고 있다는 건…… 설마 그 의뢰를 수락한 건가요?!"
10048030-143 = "……아니."
10048030-144 = "응?"
10048030-145 = "아무리 내가 영업 실장이라지만 이 정도의 일을 단독으로 결정할 수는 없지."
10048030-146 = "의뢰인한테는 부장님과 의논해 본 뒤에 답을 준다고 말해 뒀어."
10048030-147 = "그럼 이 그림은 왜……?"
10048030-148 = "……의뢰인이 나한테 반강제로 던지고 갔어."
10048030-149 = "그래서 만약 네가 거절한다면 다시 접선해서 돌려주려고."
10048030-150 = "……."
10048030-151 = "그래도 다시 생각해 봐, 미요."
10048030-152 = "전시회에서 물건을 빼돌린다는 것이 조금 마음에 걸리기는 하지만……."
10048030-153 = "이건 위작을 진품으로 바꿔 놓는 일이야. 도의적으로 문제가 될 부분은 없어."
10048030-154 = "그리고 무엇보다, 여기 계산기 좀 봐 봐."
10048030-155 = "이번 의뢰의 보상으로 내가 얼마를 계약했냐면……."
10048030-159 = "헛……!"
10048030-160 = "어때? 엄청나지?"
10048030-162 = "흐에에……!"
10048030-163 = "이 정도면 카라카라 채석장의 최상급 대리석도 살 수 있겠어!"
10048030-164 = "[s] \"엄청난 액수……!\""
10048030-165 = "후후, 보아라, 이것이 바로 특수교역부 영업 실장님의 협상 능력인 것이다……!"
10048030-166 = "저기 근데 후유, 알고는 있죠?"
10048030-167 = "응? 뭘?"
10048030-168 = "선생님…… 아직 여기에 계신 거……."
10048030-172 = "왜 계셨어요?!"
10048030-173 = "[s] \"떠난 적도 없어……!\""
10048030-174 = "어, 그, 그게……."
10048030-175 = "아니지! 우리가 위축될 게 뭐가 있어!"
10048030-176 = "선생님도 전후 사정 다 들으셨잖아요!"
10048030-177 = "전후 사정이고 뭐고 돈을 위해서 물건을 몰래 훔치는 의뢰라는 것은 변함없잖아요……."
10048030-178 = "선생님께서 이런 일을 가만히 놔두실 리도 없고……."
10048030-179 = "[s] \"아니, 난 괜찮은데.\""
10048030-180 = "네?!"
10048030-181 = "[s1] \"도의적으로 옳다고 생각해서 그 의뢰를 받은 거잖아?\"\n[s2] \"그렇다면 한 번 믿어 보려고.\""
10048030-186 = "[ns] \"물론 옆에서 지켜보기는 할 거지만.\""
10048030-187 = "서, 선생님……."
10048030-188 = "선생님까지 그렇게 말씀하시면……."
10048030-189 = "흐우우……."
10048030-193 = "떠올려라, 미요!"
10048030-194 = "큐티베리 87이 저 어둠 속에서 너를 기다리고 있어!"
10048030-195 = "그 입 좀 다물어 봐요!"
10048030-199 = "(……그래, 이번 한 번, 딱 이번 한 번만 하고 손 씻는 거야.)"
10048030-203 = "좋아요."
10048030-204 = "……그 의뢰, 수락하죠."
10048030-208 = "……한 번 써 볼게요, 이번 작품."
