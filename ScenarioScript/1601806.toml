[translation]
1601806-1 = "대장의 손길"
1601806-2 = "선생, 매번 뛰어오는 거 안 지쳐?"
1601806-3 = "넘어지면 어쩌려고 그래."
1601806-4 = "[s] \"우리 소중한 학생을 기다리게 할 수는 없지!\""
1601806-5 = "(우, 우리 소중한 학생…….)"
1601806-6 = "따, 딱히 별건 없구."
1601806-7 = "그냥 주변 산책이나 같이 하자, 날도 좋으니까."
1601806-9 = "그래서, 걔가 당당하게 내 앞에 서더니 말하는 거야."
1601806-10 = "'대장! 날 쓰러뜨리고 가!'라면서!"
1601806-11 = "크으, 그걸 직접 봤어야 했는데!"
1601806-13 = "그리고, 한번은 내 헬멧이 망가졌는데 말이야."
1601806-14 = "녀석들이 돈도 없으면서 그걸 돈 모아서 수리해 왔더라구!"
1601806-15 = "가끔 그런 기특한 구석도 있어!"
1601806-17 = "그때, 막 엄청나게 두들겨 맞고 온 거야."
1601806-18 = "그래서 내가, '그 짜식들 어딨어!! 내가 아주 박살을-'"
1601806-19 = "오? 저게 뭐지?"
1601806-20 = "[s] \"오리 같은데?\""
1601806-21 = "오, 저게 오리구나. 난 거위하고 구분을 잘 못해서 궁금했어."
1601806-22 = "근데 쟤 카리스마 있다."
1601806-23 = "새끼들도 뒤에 여섯 마리나 데리고 다니네."
1601806-24 = "[s1] \"그런데 저 오리들……\"\n[s2] \"하수구 창살 위로 가는데?\""
1601806-27 = "그러게?"
1601806-28 = "앗!! 새끼 오리들이 빠져버렸잖아!"
1601806-29 = "아기들이 작다는 걸 조심했어야지! 으이구!"
1601806-30 = "하, 어쩔 수 없네."
1601806-31 = "선생. 저거, 창살 좀 들어줘."
1601806-40 = "[wa:1880]― [log=라브]하나, [wa:600]둘, [wa:770]셋, [wa:740]넷, [wa:770]다섯, [wa:700]여섯. [wa:1260]좋아! [/log]"
1601806-42 = "― [log=라브]여섯 마리 전부 다 구했네![/log]"
1601806-45 = "― [log=라브]엄마 말을 잘 들어야지,[wa:280] [/log]"
1601806-47 = "― [log=라브]알겠니?[wa:40] [/log]"
1601806-50 = "[wa:1690]― [log=라브]엄마 오리도 이젠 괜찮아 보이고,[/log]"
1601806-52 = "― [log=라브]이걸로 [wa:810]한 건 해결,[wa:820] 이네![/log]"
1601806-55 = "[ns] \"라브는 마냥 학생 같진 않네.\""
1601806-56 = "[wa:700]― [log=라브]뭐,[wa:590] 뭐뭐뭐,[wa:460] 뭔 소리하는 거야!!![/log]"
1601806-58 = "― [log=라브]선생,[wa:960] 그거 좀 실례 아냐?[wa:80] [/log]"
1601806-61 = "― [log=라브]으에?[wa:1540]…… 앗! [wa:2240]그[wa:1020]러니까…….[/log]"
1601806-64 = "[ns] \"헬멧단을 이끄는 모습이 비슷하단 건데.\""
1601806-65 = "[wa:880]― [log=라브]아,[wa:270] 아! [wa:1000]역시[wa:250] 그런 의미지! [/log]"
1601806-68 = "― [log=라브]물론 [wa:480]리더는 [wa:620]그런[wa:200] [/log]"
1601806-70 = "― [log=라브]포용적인 면모가 있어야지![wa:40] [/log]"
1601806-73 = "[wa:1540]― [log=라브](선생은 [wa:910]말실수를 많이 하는 건지,) [/log]"
1601806-75 = "― [log=라브](일부러 이러는 건지……)[/log]"
1601806-78 = "― [log=라브](실수여도 열받고,) [/log]"
1601806-80 = "― [log=라브](노린 거면 더 열받아!)[wa:160] [/log]"
1601806-83 = "― [log=라브](……진짜로 [wa:1840]노리고 그러는 [wa:940]건…… [wa:1120]아니겠지……?)[wa:40] [/log]"
1601806-87 = "읏차, 이 정도 풀밭이면 괜찮겠지."
1601806-88 = "발밑도 조심해서 다니라구!"
1601806-89 = "자 그러면, 어디까지 이야기했더라?"
1601806-90 = "우리 애들하고 불량배랑 3 대 100으로 싸운 거 이야기했었어?"
1601806-91 = "[s] \"근데, 그 헬멧 그대로 써도 괜찮은 거야?\""
1601806-95 = "[ns3] \"아까 헬멧에 담은 오리들이 빠진 곳…….\"\n[ns4] \"하수구…… 아니었나?\""
1601806-98 = "!!!"
1601806-99 = "선생 미워!!"
1601806-104 = "(이후, 라브는 헬멧을 재빨리 벗어들고 저멀리 도망가 버렸다…….)"
