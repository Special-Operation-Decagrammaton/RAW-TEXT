[translation]
90000155-3 = "방금 저것은……."
90000155-4 = "데카그라마톤의 예언자가 확실해. 아마…… 데이터상으로는 5번째 예언자, <게부라>인 것 같아."
90000155-5 = "하지만 저 예언자는…… 지금까지와는 전혀 다른 전투 양상이에요."
90000155-6 = "지금까지의 모든 예언자들은 오직 자기 스스로의 힘으로 싸워왔어요. 그 스스로들이 독립된 개체들이었으니까요."
90000155-7 = "하지만 저 5번째 예언자는…… 마치…… 엄청나게 정교한 전투 시스템의 지원을 받고 있는 느낌이었어요. 마치, 잘 훈련된 군인을 보는 듯한……."
90000155-8 = "정답!! 맞아! 맞췄어! 바로 그거야. 꽤 하잖아? 어디 보자…… 아케보시 히마리?"
90000155-12 = "짝짝짝. 대, 대단해요. 그런데 생각지도 못한 데이터도 얻었어요. 응…… <아비 에슈흐>? 이렇게 읽는 거 맞나요? 맞죠? 아, 아닌가……?"
90000155-13 = "……!!"
90000155-14 = "맞습니다. 별 상관없지만, 그래도 여기엔 그 금지된 기술이 포함되어 있습니다. 가서 연구해 봐요."
90000155-18 = "[ns] \"………너희들은 누구지?\""
90000155-19 = "……어라?"
90000155-20 = "어, 어라??"
90000155-21 = "어라라???"
90000155-23 = "그 녀석이다. 불가해한 상자의 주인."
90000155-24 = "그 어른이네요. 샬레의 지배자."
90000155-25 = "그 사람이에요. 선생님이라는 직책의. 뭐, 상관없지만."
90000155-26 = "그렇네요. 저희의 소개를 해야 하나요? 저는 아인."
90000155-27 = "나는 소프!!"
90000155-28 = "본인은 오르."
90000155-30 = "우리는 존재하지 않는 존재자."
90000155-31 = "우리는 무한히 존재하는 비존재자."
90000155-32 = "우리는 현현되지 않은 빛이자 영원."
90000155-33 = "우리는 데카그라마톤을 섬기는 자."
90000155-34 = "우리는 빛을 향해 이어지는 길을 준비하는 자."
90000155-35 = "그리고 우리는 최후의 왕국을 준비하는 자."
90000155-39 = "[ns] \"데카그라마톤의……!!\""
90000155-41 = "그분은 이제 없지만…… 저희는 그분이 남긴 최후의 명령을 따르는 존재……."
90000155-42 = "즉, 예언자들을 서포트하는 엔지니어이자, 과학자 같은 거라고 생각하면 돼!"
90000155-43 = "여기서 선생님을 만나는 것은 원래 계획이 아니었지만. 이젠 아무래도 상관없어졌습니다. 돌아가도록 하죠."
90000155-45 = "돌아간다고……?"
90000155-46 = "벌써? 게부라 쨩의 전투 데이터는 아직 모자란데……?"
90000155-47 = "아니아니아니! 그건 그냥 날뛰게 내버려 두면 돼! 빙해에서 필요한 것들은 얼추 마무리되었다는 뜻이니까!"
90000155-48 = "그러네요. 이걸로 <언니>를 완성시키는 데 필요한 조건은 다 갖추어졌습니다. 게부라는 여기서 남은 역할을 마무리하도록 두죠."
90000155-49 = "그러네요. <언니>를 위해서라면……."
90000155-50 = "그렇게 됐어. 갑작스럽지만 반가웠어."
90000155-51 = "그치만 곧…… 다시 보게 될 겁니다."
90000155-52 = "기, 기다리세요! 잠깐만!! 다, 당신들은……."
90000155-59 = "……."
90000155-62 = "다음화;다섯 번째 예언자"
