[translation]
1601405-1 = "이부키와 함께 직업 체험을!"
1601405-4 = "안녕, 선생님!"
1601405-5 = "모모톡으로 말한 대로, 말해주러 왔어!"
1601405-6 = "[s1] \"응, 기다리고 있었어.\"\n[s2] \"선생님의 일에 대해 궁금한 거야?\""
1601405-9 = "사실은, 최근에 학교에서 장래히……? 조사서를 받았어!"
1601405-10 = "여기!"
1601405-14 = "[ns] \"<장래 희망 조사서>?\""
1601405-15 = "응! 맞아! 그런 이름이었어!"
1601405-16 = "나중에 이부키가 크면 어떤 일을 하고 싶은지 써서 가져오면 된대!"
1601405-17 = "그래서 제일 먼저 생각난 선생님한테 물어본 거야!"
1601405-18 = "[s] \"장래 희망이라……. 이부키는 커서 어떤 일을 하고 싶어?\""
1601405-19 = "음…… 사실, 이부키는 아직 생각해 본 적이 없어."
1601405-20 = "그래서 샬레에 오는 동안 이부키가 어떤 일을 할 수 있을지, 어떤 일을 하면 재미있을지 생각해 봤는데……."
1601405-21 = "생각하고 생각해도 도저히 모르겠어."
1601405-22 = "[s] \"얼른 정하려고 조급해할 필요는 없어. 이부키에겐 아직 시간이 많으니까.\""
1601405-23 = "우으…… 그으래?"
1601405-24 = "하지만………"
1601405-25 = "[s3] \"하지만 그래도 계속 고민된다면, 지금부터 찾으러 가 보는 건 어떨까?\"\n[s4] \"선생님이 도와줄게.\""
1601405-28 = "와! 정말?"
1601405-29 = "응! 그럼 이부키도 선생님이랑 같이 여러 가지를 해볼래!"
1601405-32 = "안녕하세요! 이부키입니다!"
1601405-33 = "안녕, 네가 이부키구나."
1601405-34 = "[s] \"시간 내줘서 고마워. 잘 부탁해.\""
1601405-35 = "네, 선생님. 미리 연락받은 대로 경찰 업무에 대해 대략 설명해 주도록 하겠습니다."
1601405-36 = "응! 열심히 들을게!"
1601405-37 = "우리는 시민들의 안전을 위해 각종 순찰과 범죄자 체포, 단속을 하고 있지."
1601405-38 = "경찰 업무를 하기 위해서는 무엇보다도 투철한 정의감과 책임감이 필요해!"
1601405-39 = "자, 여기 경찰 모자를 써 봐."
1601405-43 = "응! 이러니까 꼭 경찰이 된 것 같아!"
1601405-44 = "범인을 체포하겠습니다! 헤헤."
1601405-47 = "사람들에게 맛있는 요리를 대접하는 것이 우리의 일이지."
1601405-48 = "손님의 만족한 미소야말로 내게 가장 큰 기쁨이야!"
1601405-49 = "이부키도 요리사가 될 수 있을까?"
1601405-50 = "물론! 끈질긴 인내와 센스만 있다면 누구든지 훌륭한 요리사가 될 수 있어!"
1601405-51 = "자, 여기 어린이용 칼로 재료를 한 번 썰어 볼래?"
1601405-52 = "응! 선생님, 조금만 기다려! 이부키가 맛있는 요리를 만들어 줄게!"
1601405-55 = "이부키 님도 알고 계시다시피, 전차 조종은 여럿이서 호흡을 맞춰야 하는 까다로운 일입니다."
1601405-56 = "이부키도 알고 있어! 이로하 선배가 하는 걸 옆에서 봤어! 같이 타기도 했고!"
1601405-57 = "그렇다면 이야기가 빠르겠군요. 그럼 오늘은 전차장 역할을 맡아보시겠습니까?"
1601405-58 = "이부키가 가고 싶은 대로 갈 수 있는 거야? 좋아! 해 볼래!"
1601405-61 = "(이부키와 여러 가지 직업들을 탐색하다 보니 어느새 해가 질 시간이 되었다.)"
1601405-63 = "[ns5] \"오늘 어땠어, 이부키?\"\n[ns6] \"어떤 게 가장 마음에 들었어?\""
1601405-66 = "음……."
1601405-67 = "사실, 아직 잘 모르겠어!"
1601405-68 = "[s] \"하긴 하루 만에 결정하기는 힘들지…….\""
1601405-69 = "그치만……."
1601405-70 = "응, 조금은 알 것 같기도 해!"
1601405-71 = "[s] \"잘 모르겠지만 알 것 같다니……?\""
1601405-72 = "그럼 오늘은 이만 돌아갈게, 선생님!"
1601405-73 = "여러 가지를 배울 수 있게 해줘서 고마웠어! 다음에 또 봐~!"
