[translation]
1011202-1 = "버스 안에서"
1011202-3 = "(오늘은 밀레니엄으로 바로 출근하는 날.)"
1011202-4 = "(출퇴근 시간대라 버스 안이 꽤 붐빌 것 같다……)"
1011202-15 = "[ns] \"윽…… 사람 많아……\""
1011202-19 = "(안쪽으로 들어가려고 조금씩 움직이던 때……)"
1011202-24 = "어? 주인님?"
1011202-25 = "[s] \"이 목소리는……\""
1011202-28 = "와! 진짜 주인님이네~? 아하하!"
1011202-29 = "[s1] \"아스나, 안녕!\"\n[s2] \"그런데 오늘은 교복?\""
1011202-32 = "응! 오늘은 부활동 없는 날이거든."
1011202-36 = "아, 주인님에게는 이 옷이 오히려 낯설겠구나?"
1011202-37 = "[s] \"아무래도 그렇지.\""
1011202-41 = "후후. 어때, 주인님? 잘 어울려?"
1011202-46 = "주인님……?"
1011202-47 = "뭐, 뭐지…… 저 사람……"
1011202-51 = "[ns3] \"으, 으응! 잘 어울려, 아스나……!\"\n[ns4] \"그런데 그 주인님이라는 명칭이 조금……\""
1011202-57 = "아하, 그렇구나."
1011202-58 = "지금은 나도 메이드가 아니니까."
1011202-59 = "그럼 선생님! 이라고 부르면 되겠지?"
1011202-64 = "서, 선생님……?"
1011202-65 = "그럼 학생한테 자기를 주인님이라고 부르게 한 거야……?"
1011202-69 = "[ns5] \"……\"\n[ns6] (오해가 커지고 있다……)"
1011202-77 = "아, 아. 승객 여러분께 알려드립니다."
1011202-82 = "곧 급커브 구간이지만, 속도를 줄이기 귀찮으니 이대로 관성 드리프트를 시행할 예정입니다."
1011202-83 = "[ns] \"예??\""
1011202-87 = "모두 손잡이를 꽉 잡아주시고, 각자 안전에 유의하시기를 바랍니다."
1011202-91 = "아하하, 꽉 잡아! 선생님!"
1011202-98 = "[ns] \"우와아아앗?!\""
1011202-105 = "히이익!!"
1011202-111 = "선생님, 괜찮아?"
1011202-112 = "[s] \"으, 응! 버텨냈어……\""
1011202-113 = "하핫, 재미있다! 그치! 사람들이 다 한쪽으로 쏠리고 난리 났어!"
1011202-114 = "분명 버스인데 롤러코스터 같은 기분이 나!!"
1011202-115 = "[s] \"그러게! 그런 느낌이 들면 안 될 텐데!!\""
1011202-119 = "[ns] \"……\""
1011202-120 = "(드리프트의 영향 때문에 아스나와 너무 밀착해 버렸다……)"
1011202-121 = "[ns] \"저기, 아스나…… 너무 가까워서 불편하지 않아……?\""
1011202-122 = "응?"
1011202-123 = "아니! 나는 지금이 좋은데?"
1011202-127 = "선생님을 이렇게 가까이에서 보는 건 오랜만이네! 후후."
1011202-128 = "[s] \"그, 그렇지만…… 너무 붙으면 곤란……\""
1011202-132 = "[ns7] (필사적으로 공간을 만들어본다)\n[ns8] \"흐읍!!!\""
1011202-135 = "아하하!!"
1011202-136 = "뭐야, 선생님. 그 표정! 웃겨!!"
1011202-137 = "[s] \"선생으로서 최선을 다하는 중이야.\""
1011202-138 = "선생님, 나 움직이기 편하게 해주려고 그러는 거야?"
1011202-139 = "나는 지금도 괜찮은데. 선생님한테 기대 있으니까 편해. 하핫."
1011202-140 = "[s] \"그게 문제란다……\""
1011202-141 = "우와, 심장 소리 들린다. 선생님. 쿵쿵쿵쿵- 엄청 빨리 뛰어~!"
1011202-143 = "(그렇게 10년 같은 10분이 지나……)"
1011202-144 = "(목적지에서 간신히 하차할 수 있었다.)"
