[translation]
10046005-1 = "프롤로그;쏘 배드 하드 새드 스토리"
10046005-21 = "[log]<지금까지의 이야기>[/log]"
10046005-25 = "중요한 가방이 하나 있어서, 그것을 가지고 티파티로 가주기만 하면 되는 일이거든요. 오늘 안으로."
10046005-26 = "다만 그게 지금 트리니티 자치구로부터 꽤 떨어진 곳에 있는 상황이라……."
10046005-32 = "와하하핫핫핫!!"
10046005-37 = "오랜만이야, 선생님. 그런데 여긴 무슨 일로 왔을까?"
10046005-38 = "키누가와 카스미……?"
10046005-42 = "현상수배범이잖슴까, 게헨나의……."
10046005-45 = "(그러나 모종의 경위로, 가방은 온천개발부 부장이자 수배범, 키누가와 카스미의 손에 들어가고 만다.)"
10046005-49 = "뭐-야!? 이 구성은?!!?"
10046005-50 = "이 열차, 게헨나 행 열차 아니었어!? 어째서 트리니티의 정의실현부가 여기 있는 거지?"
10046005-51 = "그리고 카스미라고……!?"
10046005-52 = "카스미……!? 카스미!? 선생님, 설마 지금까지 카스미랑 동행하고 있던 건 아니겠지!? 아니라고 말해!!"
10046005-55 = "(게헨나 선도부의 난입으로 상황은 더욱 복잡하게 얽히고 만다. 그리고…….)"
10046005-59 = "이거면 저 트리니티 녀석이랑 선생님은 내 말을 들을 수밖에 없고~? 그치, 아가씨~?"
10046005-60 = "자아, 자. 이제 잘 보라고. 저 친구가 어떤 결정을 하는지? 분명히 이 찻잔……? 요강? 어쨌든 이거 때문에 너를 쏠 거거든?"
10046005-61 = "그렇지? 우리 정의실현부의……. 뭐였더라?"
10046005-62 = "……니카 쨩?"
10046005-63 = "아무튼 이거 깨지면 안 되잖아? 응?"
10046005-69 = "…………."
10046005-70 = "아오~!! 진짜!! 아까부터 진짜 가방, 가방! 그놈의 가방……!!"
10046005-71 = "…………."
10046005-72 = "대체 무슨 놈의 가방 하나 가지고 그렇게……!!"
10046005-82 = "……오!"
10046005-83 = "하핫! 하하핫!!"
10046005-84 = "와하핫핫핫핫!!!!"
10046005-85 = "봐라, 봐라! 내가 뭐라고 했어? 그러기에 몇 번이나 이야기했잖아?"
10046005-86 = "저 친구는 말이야~. 이 가방을 주기 전까지는 절대로……."
10046005-87 = "나한테……."
10046005-95 = "게흑……!?"
10046005-102 = "…………아."
10046005-103 = "……쏴 버렸다."
10046005-105 = "(……그렇게 트리니티와 게헨나를 가로지른 열차 사건은 파국으로 막을 내렸다.)"
10046005-113 = "이거, 이거. 선생님이 꼭! 만나달라는 사람이 있길래, 누군가 했더니~"
10046005-114 = "천하의 [ruby=・]이[/ruby][ruby=・]치[/ruby][ruby=・]카[/ruby] [ruby=・]쨩[/ruby]께서 몸소 납실 줄이야."
10046005-115 = "…………."
10046005-116 = "대단하신 정의실현부의 엘리트께서, 선생님까지 동원해 가면서 말이지."
10046005-117 = "설마 나 하나 잡자고 납시었을 리는 없고…… 대체 어떤 대~단한 용건이 있으실까? 응?"
10046005-118 = "…………."
10046005-119 = "……십쇼."
10046005-123 = "응~?"
10046005-127 = "한 번만 도와주십쇼. 부탁드림다."
10046005-133 = "허?"
10046005-134 = "핫, 하핫! ……와하하핫!!"
10046005-135 = "세상에, 세상에나~ 무슨 바람이 불었길래, 우리 이치카 쨩 입에서 그런 말이 나왔을까?"
10046005-136 = "당연히 도와야지, 물론 돕고말고. 우리가 남도 아닌데, 그렇지?"
10046005-137 = "…………."
10046005-138 = "근데 말이지~ 우리 깜찍이도 힘깨나 쓰지 않던가? 응? 열차 때도, 혼자서 전~부 처리했잖아?"
10046005-139 = "근데 나는 알다시피 선량한 민간인이고. 건에 따라서는~ 내가 도움이 될지를 모르겠네?"
10046005-140 = "……그때 일은."
10046005-141 = "제 잘못임다."
10046005-142 = "한 번만 용서해 주십쇼."
10046005-143 = "……아, 아. 과연. 그렇게 들렸나?"
10046005-144 = "전에 내가 했던 말, 기억해? 너와 나는 닮았다고."
10046005-148 = "그리고 나는 아무리 작은 원한도 잊지 않지."
10046005-149 = "날 미워하지 않았던가? 뭐가 널 그리 바꿔놨을까?"
10046005-150 = "…………."
10046005-151 = "오? 이거 봐라? 하나도 바뀌지 않았네. 여전히 날 향한 증오가 보여."
10046005-152 = "…………."
10046005-153 = "좋아, 좋아…… 아주 재밌어. 그러고도 나한테 꿇었다는 거지? 대체 뭣 때문에?"
10046005-157 = "자세히 들어보실까?"
