[translation]
2005402-1 = "라이프 스태프"
2005402-8 = "[ns] \"!?!?!!!!!\""
2005402-11 = "후후. 안녕히 주무셨나요. 선생님."
2005402-12 = "어떠셨나요? 이 초천재병약미소녀 라이프 스태프가 보내 드리는, 모닝콜은요."
2005402-13 = "[s] \"일단 잠은 확실하게 깼네!\""
2005402-14 = "그렇군요. 시스템 아키텍처대로 구현되는 아웃풋을 바라보는 것은, 개발자의 즐거움 중 하나죠."
2005402-15 = "그러면 오늘의 업무, 시작하도록 할까요?"
2005402-19 = "[ns] \"이건……?\""
2005402-20 = "상쾌한 하루의 시작을 위해, 스트레칭부터 시작하도록 하죠."
2005402-21 = "물론 그 AMAS는 리오의 결과물이지만, 지금은 상황이 상황인 만큼 공용으로 사용해도 될 것이고요."
2005402-22 = "선생님의 스트레칭을 보조해 드리기 위해서, 제 나름대로 개조와 개량, 개선을 거쳤답니다?"
2005402-23 = "그러면, 선생님? 우선 허리를 쭈~욱."
2005402-30 = "[ns1] \"!?!?!!!!!\"\n[ns2] \"아파!!!!!\""
2005402-35 = "후후. 조금만 참으세요, 선생님. 좋은 약은 입에 쓰다고 하는 말도 있고요."
2005402-39 = "세수도 하셔야죠? 제가 즐겨 사용하는 클렌징 워터도 준비해 드렸답니다?"
2005402-40 = "밤사이 분비된 피지와 땀을 씻어내기 딱 좋을 거예요."
2005402-41 = "아침의 약해진 피부를 너무 자극하지 않도록, 충분히 순한 클렌징 워터니까 피부 자극은 걱정하지 마세요."
2005402-52 = "혹시나 했더니 오늘도 같은 옷이네요……."
2005402-53 = "물론 저희가 처해 있는 상황을 고려해 보면, 다양한 의복 같은 것은 아무래도 사치에 가까운 것이라고 할 수 있겠습니다만……."
2005402-54 = "그래도 기본적인 부분…… 이런 비유를 그렇게까지 좋아하지는 않습니다만, '사람 구실'을 할 정도는 되어야겠지요."
2005402-55 = "스팀으로 금방 주름을 펴 드리도록 할게요."
2005402-59 = "이제 집무 공간으로 가실 차례네요. '전지'인 제가, 최적화된 루트를 골라 드리죠."
2005402-60 = "바닥에 화살표를 출력해서 길을 안내해 드릴 테니, 잘 따라오시면 된답니다?"
2005402-61 = "[s] \"……그냥 조금만 걸어가면 되는 거 아니야……?\""
2005402-62 = "……."
2005402-63 = "그게, 달라요."
2005402-64 = "[ns] \"어디가……?\""
2005402-65 = "……."
2005402-66 = "아무튼 다르답니다!"
2005402-70 = "어서 오세요. 선생님. 기다리고 있었어요."
2005402-71 = "후후. 이렇게 친절한 초천재병약미소녀해커이자 라이프 스태프는, 지금 여기 말고는 어디에서도 찾을 수 없으실 테니까요?"
2005402-72 = "[s] \"응……. 그래……. 마음 고마워……\""
2005402-73 = "마음……?"
2005402-74 = "괜찮겠죠. 마음 가는 길은 쭉 곧은 길이라는 말도 있고요."
2005402-75 = "어쨌든, 앞으로도 이번처럼 계속해서 선생님의 생활 어시스턴트를 해 드릴 생각이니, 그렇게 알아 두시면 좋을 거예요."
2005402-76 = "[s] \"저기, 내 의사는?\""
2005402-77 = "……."
2005402-78 = "그런……. 선생님께서 설마, 리오가 독점하던 여기의 시스템을 절반 정도 해킹…… 전자적 협상을 통해 가져와서."
2005402-79 = "그 리소스를 선생님 본인의 더 나은 생활을 위해 사용하려는, 한 학생의 기특한 마음을 물리칠 정도로 매정한 분이셨다니……."
2005402-80 = "히마리, 쇼크……."
2005402-81 = "절벽 위에 애처롭지만 고고하게 피어난 한 송이 꽃을, 그저 그렇게 해 보고 싶다는 이유만으로 꺾어서 가져가려는 어린아이마냥……."
2005402-82 = "그렇지만 그 손길이 선생님의 손길이라면, 저는 허리가 끊어지는 아픔과 고통을 무릅쓰더라도 참아내 보이겠지만요……?"
2005402-83 = "[s] \"고마워, 히마리! 정말 엄청나게 도움이 됐어!\""
2005402-84 = "후후. 역시 그러실 줄 알았답니다."
2005402-85 = "덧붙여서 오늘의 점성술에 따르면, 당분간은 붉은색의 기운이 우리를 감쌀 것이라고 하기에."
2005402-86 = "모니터의 배경 색조를 붉은색으로 바꿔 보았답니다?"
2005402-87 = "[ns] \"눈이 너무 아프니까 부적 정도로 참아 줘!\""
