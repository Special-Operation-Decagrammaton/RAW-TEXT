[translation]
2002-1 = "늘 이런 식입니다"
2002-2 = "(방과 후. 방과후 디저트부 부원들이 나란히 강변을 거닐고 있다.)"
2002-7 = "그러고 보니 조금 있으면 연휴네. 4일이나 연달아 쉬는데, 다들 뭐 할지 생각해 놨어?"
2002-8 = "아니. 그냥 있을 건데. 아무것도 하지 말라고 있는 게 연휴잖아."
2002-9 = "……음. 뭐, 그래. 넌 그럴 거 같았다만……."
2002-10 = "……? 무슨 의미야."
2002-11 = "아니, 뭐. 그냥 그렇다고"
2002-12 = "요, 요시미 쨩은 다른 계획이라도 있어?"
2002-13 = "나는 좀 놓쳤던 수업 진도라도 따라가 놓으려고 하는데……."
2002-14 = "아니, 뭐. 나도 대단한 게 있는 건 아니고, 연휴니까 이벤트도 많고 해서 디저트 탐방이나 가볼까 하는데……."
2002-20 = "……헉!"
2002-22 = "……?"
2002-24 = "아……아아……!!"
2002-25 = "……?"
2002-26 = "……? 나, 나츠 쨩? 갑자기 왜 그래?"
2002-30 = "단 거 먹고싶다."
2002-32 = "깜짝 놀랐잖아! 무슨 일 있는 줄 알았네!!"
2002-34 = "나, 나츠 쨩. 우리 방금 전까지 다 같이 카페 밀피유에서 먹다가 오는 길이잖아……?"
2002-35 = "NO. 그거랑 이것은 별개. 나는 한창 때의 성장기 여고생. 지속적인 당분 투여 필수."
2002-36 = "어디서 또 이상한 말투를 배워 와가지고는……."
2002-37 = "아니거든~. 말투는 그쪽이 훨씬 이상하거든~."
2002-38 = "……."
2002-40 = "됐고. 그래서 요점이 뭐야? 2차 가자고? 갈 거면 나도 가고."
2002-41 = "요시미 쨩. 2차라니 또 태연하게 아저씨 같은 단어선정을……."
2002-42 = "누, 누가 아저씨라는 거야! 누가!"
2002-43 = "2차라……. 흠……."
2002-44 = "나쁘지 않지만, 조금 밋밋한 감도 없지 않은 걸."
2002-45 = "뭔가 좀 더 파격적인 거 없을까?"
2002-46 = "……파격적인 거……?"
2002-47 = "그래."
2002-48 = "이를테면……."
2002-50 = "……<전설의 디저트 찾는 모험>이라든가……!!"
2002-56 = "자, 자. 해산~. 오늘 부활동은 여기까지~."
2002-57 = "요시미 쨩, 아까 말했던 2차나 같이 갈까?"
2002-58 = "으, 으응!? 아까는 아저씨 같다고 뭐라 하지 않았어, 그거……!?"
2002-60 = "……."
2002-61 = "뭐야……. 모처럼 사람이 의견을 냈는데, 다들 협조적이지 못하군."
2002-62 = "협조를 바랬던 거였냐!? 방금 그런 말을 해 놓고!?"
2002-63 = "이미 조사도 다 끝내 놨다고. 한 번쯤 들어보는 것도 나쁘진 않잖아? 그치?"
2002-64 = "아니, 괜찮은데……."
2002-65 = "트리니티 자치구로부터 꽤 떨어진 야산에 어떤 동굴이 있는데……!"
2002-66 = "이미 시작됐어……."
2002-67 = "여름에도 영하의 기온을 유지해서 그 동굴에는 고드름이 일년 내내 열린다고 해."
2002-68 = "그런데 그 고드름이 사실은……."
2002-69 = "동굴 위에서 자라고 있는, 설탕 단풍나무의 뿌리로부터 흘러나온 수액이 얼어붙은 거라는 거야!"
2002-70 = "말하자면 천연 메이플 시럽인 셈이지! 엄청 궁금하지 않아?"
2002-71 = "또 어디서 그런 이상한 소리를 주워들은 거야……."
2002-72 = "이상한 소리라니? 제대로 '월간 스윗&건'의 미스테리란에 올라와 있는 내용이라고. 보여줄까?"
2002-73 = "미스테리란이라고 스스로 밝혔어!?"
2002-74 = "그러니까, 가보자! 천연으로 만들어진 메이플 아이스크림을 찾아가는 거야! 응? 친구들? 궁금하지 않아?"
2002-75 = "아니. 안 가! 누가 연휴에 그런 걸 따라 간다는 거야!?"
2002-76 = "진심이야? 지, 진짜로 안 갈 생각인 거야……? 이런 정보를 들어놓고……?"
2002-77 = "말했잖아!? 나는 다른 이벤트도 있고, 아이리는 밀린 진도도 따라가야 한다고 했고……."
2002-78 = "남은 거라곤……."
2002-82 = "어이, 은근슬쩍 엮지 마."
2002-83 = "나도 제대로 '아무것도 안 한다'는 일정이 있는 거거든."
2002-84 = "……라고 하시네요."
2002-85 = "봐! 없잖아? 갈 사람."
2002-86 = "말도 안 돼……. 진짜로? 아무도 여기에 관심이 생기지 않는단 말이야……?"
2002-87 = "메이플 시럽 고드름이잖아……? 엄청난 거잖아! 이 감성, 이 로망을 몰라주는 거야……?"
2002-88 = "뭐……. 사실 메이플 시럽이라면 당장 저기 저쪽 편의점에도 있으니까."
2002-89 = "그럴 수가……!"
2002-90 = "이런 현실이……."
2002-91 = "이런 현실이 있단 말이냐……!?"
2002-92 = "이래선 안 돼……! 한창때의 여고생들이 기업 행사나 시험 따위에 빠져 있다니……!"
2002-93 = "아니. 오히려 여고생의 본분이잖아."
2002-94 = "이제 보니 나츠는 요시미 네가 자꾸 태클 잘 걸어주니까 저러는 건가 싶기도 하고……."
2002-95 = "그, 그렇군……. 그렇구나……. 다들 관심이 없구나 난 그것도 모르고……."
2002-96 = "흑흑……흑……."
2002-97 = "……."
2002-103 = "……으음……. 나, 나츠 쨩. 정 그러면……."
2002-104 = "……잠깐!! 흐, 흔들리지 마, 모두들!"
2002-105 = "동요하면 안 돼, 너희들! 저것도 다 우릴 끌어들이려는 수작이란 거 다 알잖아!?"
2002-106 = "이번에야말로 어림도 없어, 나츠! 우리가 매번 그렇게 넘어가 줄 거라고 생각하면 오산이라고!"
2002-108 = "……흑흑……흑……."
2002-109 = "……."
2002-113 = "흐음. 아쉽군. 이 정도면 통할 거라 생각했는데."
2002-115 = "아하하하……."
2002-116 = "아무튼 이것 봐! 이렇다니까!!"
2002-117 = "자! 그렇게 됐으니 오늘은 이만 해산!!"
2002-118 = "응~. 그럼 나중에 봐~."
2002-119 = "……그럼 나도 간다. 바이."
2002-127 = "……흠……."
2002-128 = "……."
2002-130 = "(그날 밤.)"
2002-134 = "뭐, 뭐야. 이 오밤중에 무슨 일이야! 갑자기 불러내고……?"
2002-135 = "나, 나도 몰라."
2002-136 = "자려는데 아이리가 다급히 불러서……."
2002-140 = "요, 요시미 쨩. 카즈사 쨩! 나츠 쨩……. 나츠 쨩이……!"
2002-141 = "나츠 쨩이……!!!"
2002-147 = "흐윽……. 흑흑……. 다들……!!"
2002-149 = "뭐, 뭐야. 왜 울어, 나츠!?"
2002-150 = "지금 어디야!?"
2002-152 = "그……. 메이플 동굴……."
2002-153 = "아무도 안 간다길래 혼자 왔는데……."
2002-154 = "아무래도 역시……. 길을 잃은 것 같아서……."
2002-156 = "……엉?"
2002-157 = "……."
2002-158 = "……."
2002-160 = "도와줘……. 도와줘, 나의 친구들……."
2002-161 = "으허어엉~~. 여기가 어딘지 모르겠어……."
2002-165 = "설마 이대로 친구를 버리진 않겠지……?"
2002-166 = "응?"
2002-171 = "……후……."
2002-172 = "……."
2002-173 = "여, 역시 가야 하겠지. 이건……?"
2002-174 = "……못 살겠다. 정말……."
2002-176 = "(이후 나츠를 구하기 위해 다같이 나츠가 말한 동굴을 찾아갔다.)"
2002-177 = "(동굴에는 놀랍게도 정말로 메이플 시럽으로 된 고드름이 자라나고 있었다.)"
2002-178 = "(방과후 디저트부 부원들은 그곳에서 다같이 고드름을 맛봤고, 배탈로 연휴를 날렸다.)"
2002-179 = "늘 이런 식입니다"
