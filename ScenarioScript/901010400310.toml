[translation]
901010400310-7 = "啊，你看那個。#n那邊有賣今天早上剛捕撈回來的螃蟹耶。"
901010400310-8 = "我剛好也有點餓了……午餐就吃螃蟹料理如何？"
901010400310-9 = "唔嗯……螃蟹料理我有點……"
901010400310-10 = "怎麼了？"
901010400310-11 = "要吃螃蟹的話，不就得自己把堅硬的殼剝開嗎？"
901010400310-12 = "我之前挑蟹肉的時候手被蟹螯割傷，結果痛苦了好一陣子……"
901010400310-13 = "那倒是，螃蟹的缺點就是吃起來很麻煩呢。"
901010400310-14 = "既然這樣，午餐就多看看幾家再決定吧。"
