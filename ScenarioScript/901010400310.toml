[translation]
901010400310-7 = "오, 저것 봐. 오늘 아침에 갓 잡아온 게를 판매하고 있대."
901010400310-8 = "안 그래도 출출하던 참인데…… 점심으로 게 요리 어때?"
901010400310-9 = "으음…… 나는 게 요리는 조금."
901010400310-10 = "왜?"
901010400310-11 = "게는 살을 먹으려면 단단한 껍질을 직접 발라내야 하잖아?"
901010400310-12 = "전에 게살을 바르다가 집게에 손이 베이는 바람에 한동안 고생했다고."
901010400310-13 = "그건 그래. 게는 먹기 불편한 게 단점이지."
901010400310-14 = "그럼, 점심 메뉴는 좀 더 둘러보고 결정하자."
901010400310-20 = "(어쩌면 이곳에서 사건의 실마리를 찾을 수 있을지도 모르겠어.)"
901010400310-21 = "(잠깐 사장님에게 도움의 손길을 건네 보도록 할까?)"
