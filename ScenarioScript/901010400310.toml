[translation]
901010400310-7 = "โอ๊ะ ดูนั่นสิๆ ทางนั้นกำลังขายปูที่เพิ่งจับมาได้เมื่อเช้านี้กันอยู่เลย"
901010400310-8 = "ไหนๆ ก็กำลังหิวอยู่พอดี... มื้อกลางวันวันนี้กินเมนูปูกันมั้ย?"
901010400310-9 = "อืม... ฉันขอผ่านเมนูปูดีกว่า"
901010400310-10 = "ทำไมล่ะ?"
901010400310-11 = "ก็ถ้าจะกินเนื้อปู ต้องแกะเปลือกแข็งๆ เองไม่ใช่เหรอ?"
901010400310-12 = "เมื่อก่อนฉันเคยแกะปูแล้วโดนก้ามปูบาดมือ ก็เลยต้องลำบากอยู่พักใหญ่เลยละ"
901010400310-13 = "ก็จริงนะ ข้อเสียของปูคือมันกินลำบากนี่แหละ"
901010400310-14 = "ถ้างั้นมาเดินดูร้านอื่นก่อน แล้วค่อยตัดสินใจแล้วกันว่าจะกินอะไรเป็นมื้อกลางวันดี"
901010400310-15 = ""
901010400310-17 = ""
901010400310-19 = ""
901010400310-20 = "(บางทีเราอาจจะพบเบาะแสของคดีจากที่นี่ก็ได้)"
901010400310-21 = "(ลองเข้าไปช่วยเจ้าของร้านสักหน่อยดีมั้ยนะ?)"
