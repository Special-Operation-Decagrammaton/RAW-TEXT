[translation]
83300500200-5 = "오늘 하루 고생하셨습니다. 부장님."
83300500200-6 = "이것저것 정보를 수집하고 취합해 본 결과. 역시나 저희의 예상대로 만마전에서 파티를 여는 건 사실인듯해요."
83300500200-7 = "다만 그 규모나 형태가, 예년과 뭔가 다르다. 라는 느낌이란 거군."
83300500200-8 = "네. 원래도 방심할 수 없는 치들이긴 하지만. 조금 걱정되네요."
83300500200-12 = "어쨌거나 오늘은 늦었으니. 푹 쉬시고, 부디 좋은 밤 되세요. 부장님."
83300500200-13 = "응. 아코도 푹 쉬어."
