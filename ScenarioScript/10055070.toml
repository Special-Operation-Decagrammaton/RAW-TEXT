[translation]
10055070-1 = "第7話;Fools in August"
10055070-2 = "……今日は霧がひどいな。"
10055070-3 = "こんな日に見回りなんて……。"
10055070-4 = "まあどうせ何もないでしょ。"
10055070-5 = "今日は特に申請もなかったし、AISにも何もないし。"
10055070-6 = "適当に見て……。"
10055070-10 = "……んん？"
10055070-11 = "ちょっと、こっちに双眼鏡ちょうだい。"
10055070-13 = "…………。"
10055070-15 = "スターボードにて、報告！"
10055070-19 = "……。"
10055070-20 = "…………。"
10055070-21 = "スターボード、どうしました？"
10055070-22 = "報告を続けてください。"
10055070-23 = "あ、スミカちょうどいいところに！"
10055070-24 = "「キャプテン」です！"
10055070-25 = "キャプテンって、別にくじ引きで決めたのに……。"
10055070-26 = "キャ・プ・テン・っ！"
10055070-27 = "分かった分かった、キャプテン。"
10055070-28 = "ほんと肩書きとか好きだよね……。"
10055070-29 = "というか、なんで途中で報告をやめたんですか？"
10055070-30 = "居眠りしてて見間違えたとか……じゃないですよね？"
10055070-31 = "あ、そうそう。"
10055070-36 = "いや……でも、これって。"
10055070-37 = "あんたも見たでしょ？"
10055070-38 = "いやそうだけど……でも有り得ないじゃん？"
10055070-39 = "ちょっと、コソコソしないでください！"
10055070-40 = "このハルピュイア号で起きること全部、キャプテンは把握しないといけないんですから！！"
10055070-45 = "……らしいよ？"
10055070-46 = "えー……はあ、じゃあ言っちゃうよ？"
10055070-50 = "スターボードにて、報告！"
10055070-51 = "帆船1隻、方位010度！距離1000ヤード！"
10055070-52 = "真正面から本船に接近中！"
10055070-57 = "……あの。私のことが嫌いなのは分かりますが。"
10055070-58 = "部長でも副部長でもない私がキャプテンになって気に食わないのは分かります。#nでも見回りに毎回お二人が同行できるわけじゃありません。"
10055070-59 = "だから私は航海の安全のために、たとえ～皆さんに嫌われたと～しても！#nこの役割を担おうと……。"
10055070-60 = "いや、変人扱いしないで！？"
10055070-61 = "自分の目で確かめてよ！"
10055070-67 = "……いや、どうせ何もな――"
10055070-72 = "……？"
10055070-73 = "何ですかあれ？"
10055070-78 = "だから帆船だって。"
10055070-79 = "なんですか帆船って！？"
10055070-80 = "はあ？知らないの？昔の軍艦！大砲も載ってるやつ！"
10055070-81 = "そうじゃなくて！！というか1000ヤード！？目の前じゃないですか！"
10055070-82 = "あんな船がすぐそこにあるのに誰も気づかなかったんですか！？"
10055070-83 = "こんなひどい霧の中で、これ以上見えないよ。"
10055070-84 = "そうだ、レーダーは？レーダーはどうしたんですか！"
10055070-85 = "レーダーにはまだ何の信号もありません！"
10055070-90 = "……動力なし？無線封鎖？"
10055070-91 = "……軍艦って言っていたよね？"
10055070-92 = "つまり……大砲を装備した軍艦が、エンジンを切ったまま向かって来てるってこと？"
10055070-93 = "……。"
10055070-94 = "……キャプテン、どうする？"
10055070-99 = "なんでよりによって私がキャプテンの日にこんなことが？いっそのこと何も知りませんとか言っちゃう？いやでもキャプテンなのに知らないというのも責任者として……。"
10055070-100 = "あ、そうだ！まだ敵だと決まったわけじゃないんですよね？"
10055070-101 = "無線通信はどうですか？"
10055070-102 = "それがさっきからやってみてるけど、応答なし。"
10055070-103 = "サーチライトで警告は？"
10055070-104 = "だいぶ前からやってるけど反応なし。"
10055070-105 = "右に舵切ろうか？"
10055070-106 = "そ、それはダメです！"
10055070-107 = "1000ヤードしかないのに無理に舵を切って傾いたら……？それに攻撃でもされたら沈没……！悠久のハルピュイア号が私の責任によって！？それだけはダメ……！！"
10055070-108 = "キャプテン！音声をキャッチしました！"
10055070-109 = "船長帽らしきものを被った人の声です。"
10055070-110 = "おお！今そっちに行きます！"
10055070-111 = "いや、やっぱ時間ないのでデッキに流してください！"
10055070-115 = "まあ、どうせただの誤解だと思いますけど～"
10055070-116 = "だってオデュッセイアですよ？ど～このバカが海で私たちに喧嘩を売るんですか？"
10055070-118 = "真の海賊がやることと言えば一つ！"
10055070-119 = "キヴォトス中の金銀財宝を略奪するのだ！ヨーホホ！"
10055070-121 = "…………。"
10055070-123 = "…………。"
10055070-124 = "……いや待てよ。"
10055070-125 = "相手は旧式の船に乗ったただの寄せ集め海賊。一方こちらは精鋭部隊トライデント。今ここで奴らを打ちのめせば当然功績は私に……！"
10055070-126 = "キャプテン？"
10055070-127 = "すぅー……はぁー……。"
10055070-128 = "総員、戦闘配置へ！海賊を掃討します！！"
10055070-130 = "アイアイキャプテン！！"
10055070-139 = "くそっ、海軍の奴ら、もう匂いを嗅ぎつけて！？"
10055070-140 = "海軍ってなんですか！？本当の海賊でもないのに！？"
10055070-141 = "そんなことはどうだっていい！#n今マコト様の船がハチの巣にされているのだぞ！"
10055070-142 = "やられっぱなしでたまるか！"
10055070-143 = "諸君！これより私の指示に従って応戦する！"
10055070-149 = "……何をしている？"
10055070-151 = "いや、その……戦うったって。"
10055070-152 = "どうやって？"
10055070-154 = "この船には立派な大砲がついていただろう？"
10055070-155 = "無理です。"
10055070-156 = "さっき言おうとしたんですが、この船の大砲、中まで完全に錆びついてます。"
10055070-157 = "表面だけ綺麗にすればいいって話じゃありません。"
10055070-158 = "……そうか、お前たちもそれを知っててじっとしていたのか。"
10055070-160 = "はい……実はこの船、武装はないです。"
10055070-161 = "それにあっしら、戦ったこともないです、キャプテン。"
10055070-167 = "理解した。"
10055070-168 = "お前らがどれだけ愚か者なのかをな！！"
10055070-174 = "大砲が錆びている？それがどうした！"
10055070-175 = "だからって船が海の藻屑になるのをただ見てるつもりか！？"
10055070-177 = "いやだって……。"
10055070-178 = "ダメなものはダメだし……。"
10055070-180 = "できない理由か？やらない理由なのか？"
10055070-181 = "戦ったこともないと言っていたな。なら大砲が使えるかどうかも分からないのだろう。"
10055070-182 = "なのに使う前から諦めるだと？それでもお前らは船乗りか！？"
10055070-183 = "気合いが足りない！そもそも火器ってもんは気合いがあればなんとかなる！"
10055070-184 = "いやそんなデタラメ……。"
10055070-185 = "自分を信じられないなら私を信じろ！"
10055070-186 = "大砲は絶対に使えるはずだ！"
10055070-187 = "みな所定の位置に移動！装填、発射準備！"
10055070-192 = "……でも無理なもんは無理ですよ、キャプテン。"
10055070-193 = "この船の大砲は……。"
10055070-195 = "お前らがやらないなら構わん！"
10055070-196 = "[ruby=われわれ]万魔船[/ruby]がやる！"
10055070-198 = "う、うん！？私たち！？"
10055070-199 = "あっ、はいはい！私やってみたいです！大砲の装填！"
10055070-200 = "イブキも手伝う！"
10055070-201 = "私はやめとくわね？みんな頑張って頂戴。"
10055070-204 = "何をバカげた……。"
10055070-205 = "[s] \"イロハもやらない？\""
10055070-206 = "……でも、やるまでずっとああなんでしょうから。"
10055070-207 = "あの人には目の前で見せないと。できないものはできないって。"
10055070-208 = "どうせ勘違いなのに。説明すればいいものを……。"
10055070-209 = "本当めんどくさくて、イライラする人。"
10055070-211 = "よいしょ、よいしょ！"
10055070-212 = "よいしょ、よいしょ！"
10055070-213 = "どう？イブキ力になれてる？"
10055070-214 = "はい！おかげですごく軽いです！"
10055070-216 = "はあ……このタイプは、まず火薬を入れればいいんでしたっけ。"
10055070-220 = "あっ、ダメだよ！イロハ先輩！"
10055070-221 = "最初は火薬袋を入れないと！"
10055070-225 = "あううう……！"
10055070-226 = "あっ、イブキ！重い物は私が持ちますから！"
10055070-227 = "い、イロハ先輩！ありがとう！まだイブキの力じゃ……。"
10055070-230 = "次は砲弾！こうやってひもの束を入れて固定して……。"
10055070-231 = "最後に火薬を入れて火をつけるの！"
10055070-232 = "おお……すごく詳しいんですね。"
10055070-233 = "うん！いっぱい勉強したんだ！"
10055070-235 = "……。"
10055070-236 = "……。"
10055070-238 = "諸君、装填はできたか！"
10055070-240 = "はあ、一応……。"
10055070-242 = "返事が小さい！"
10055070-244 = "はい、キャプテン！"
10055070-245 = "あとは火をつけたらドカーン！って発射するよ！"
10055070-247 = "さすがじゃないか、素晴らしい！"
10055070-248 = "最初の一撃は私の号令に合わせて撃つ！"
10055070-249 = "狙うはあの忌々しい海軍どもの船！"
10055070-251 = "無駄だって。"
10055070-252 = "できるわけないのに、バッカみたい……。"
10055070-254 = "ヨーホホ！見ているがいい！"
10055070-255 = "このマコト様が奇跡を起こして見せよう！"
10055070-259 = "よーい……。"
10055070-270 = "――撃て！！！"
10055070-273 = "……は？"
10055070-274 = "そんな、あり得ない……。"
10055070-275 = "わあ！すごい音！"
10055070-276 = "イブキもやってみる！えいっ！"
10055070-280 = "ヨーホホ！やっぱり気合いの問題だったな。"
10055070-282 = "……大砲が使えた？"
10055070-283 = "あの日以来、二度と発射されなかった大砲が……。"
10055070-285 = "諸君、反撃はここからだ！次を装填しろ！！"
10055070-291 = "アイアイ！キャプテン！！！"
