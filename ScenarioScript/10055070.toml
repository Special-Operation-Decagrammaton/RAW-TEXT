10055070-217 = ""
10055070-219 = ""
10055070-220 = "啊，不行！伊呂波前輩！"
10055070-221 = "一開始要先放入裝有定量火藥的火藥袋！"
10055070-222 = ""
10055070-224 = ""
10055070-225 = "啊嗚嗚嗚……！"
10055070-226 = "啊啊！伊吹醬，重的東西我來拿！"
10055070-227 = "啊，謝謝你，伊呂波前輩！#n伊吹的力氣還拿不動……"
10055070-229 = ""
10055070-230 = "接下來是砲彈！然後像這樣塞入麻繩團固定砲彈……"
10055070-231 = "最後在點火孔放入火藥，接著再點火就好了！"
10055070-232 = "哦，哦哦……你懂得真多呢，伊吹？"
10055070-233 = "嗯！因為伊吹學了很多哦！"
