[translation]
10055070-1 = "제7화;Fools in August"
10055070-2 = "……오늘 안개가 심한데."
10055070-3 = "하필 이런 날씨에 견시 당번이냐."
10055070-4 = "뭐, 별일이야 있겠어."
10055070-5 = "오늘은 딱히 신고된 선박도 없고, AIS에도 아무것도 안 잡히고."
10055070-6 = "적당히 슥 둘러보고……."
10055070-10 = "둘러보고……?"
10055070-11 = "잠깐, 쌍안경 이리 줘 봐."
10055070-13 = "………."
10055070-15 = "우현! 견시 보고!"
10055070-19 = "……."
10055070-20 = "…………?"
10055070-21 = "우현, 뭐해요?"
10055070-22 = "왜 보고를 하다가 말아요?"
10055070-23 = "아, 마침 잘 왔어, 스미카!"
10055070-24 = "캡틴, 이겠죠!"
10055070-25 = "캡틴은 무슨…… 그냥 제비뽑기로 역할 나눈 거잖아."
10055070-26 = "캡틴!"
10055070-27 = "알았어, 알았으니까, 캡틴."
10055070-28 = "하여간 진짜 감투 좋아한다니까……."
10055070-29 = "그보다, 견시 보고를 도중에 멈추는 경우가 어딨어요?"
10055070-30 = "설마…… 졸아서 잘못 봤다거나, 그런 건 아니겠죠?"
10055070-31 = "아, 그게 말이지."
10055070-36 = "……아, 근데, 이게 맞나?"
10055070-37 = "너도 봤잖아."
10055070-38 = "보긴 했는데…… 아니, 좀 말이 안 되잖아."
10055070-39 = "잠깐, 둘이서만 쑥덕거리지 말아요!"
10055070-40 = "이 하르피아 호에서 일어나는 모든 일은 캡틴이 알고 있어야 한다고요!"
10055070-45 = "……그렇다는데?"
10055070-46 = "에이씨, 그러면 진짜 말한다?"
10055070-50 = "우현! 견시 보고!"
10055070-51 = "범선 1척! 방위 010도! 거리 1000야드!"
10055070-52 = "본선 충돌경로! 곧장 접근 중입니다!"
10055070-57 = "……하아, 여러분. 저를 싫어하는 건 알아요."
10055070-58 = "물론, 부장님도, 부부장님도 아닌 제가 캡틴을 맡은 게 아니꼽겠죠. 하지만 모든 순찰마다 두 분이 동행할 수 있는 건 아니에요."
10055070-59 = "그러기에, 저는 항해의 안전을 위해, 설~령~! 여러분께 미움받더라도 이 역할을 자처하기로……."
10055070-60 = "아니거든?! 누굴 이상한 사람으로 만들고 있어!"
10055070-61 = "직접 확인해 보라고!"
10055070-67 = "……아니, 어차피 아무것도 없……."
10055070-72 = "……?"
10055070-73 = "??? 뭐야, 저거???"
10055070-78 = "그러니까, 범선이라니까."
10055070-79 = "범선이 뭔데요?!"
10055070-80 = "그, 있잖아! 옛날 군함! 대포 실려 있고!"
10055070-81 = "누가 그걸 모른대요?! 아니, 그보다도! 1000야드?! 바로 코앞이잖아요?!"
10055070-82 = "저만한 배가 가까이 올 때까지 아무도 모른 거예요?"
10055070-83 = "물안개가 심해서 1000야드 바깥은 안 보여."
10055070-84 = "맞아! 레이더! 레이더는 어쩌고요?!"
10055070-85 = "레이더에는 아직까지 아무 신호도 안 잡힙니다!"
10055070-90 = "……무동력? 전파침묵?"
10055070-91 = "……범선은 군함이랬지?"
10055070-92 = "그러니까, 대포까지 달린 군함이 물안개 속에서 엔진을 끄고, 우리 쪽으로 접근하고 있다?"
10055070-93 = "……."
10055070-94 = "……캡틴, 어쩔까?"
10055070-99 = "아니, 어째서 하필이면 그 많은 날 중에서 내가 선장일 때 이런 일이, 차라리 아무것도 모른다고 잡아뗄까? 아니, 그렇지만 캡틴을 맡은 시점에서 모르면 모른 것대로 책임 소지가……."
10055070-100 = "앗, 맞다! 아직 적이라고 확인된 거 아니잖아요?"
10055070-101 = "무전 통신은 어때요?"
10055070-102 = "그게, 아까부터 무전 호출 중인데, 응답 없습니다!"
10055070-103 = "탐조등으로 충돌 경고는?"
10055070-104 = "한참 전부터 하고 있는데, 무반응."
10055070-105 = "지금이라도 우현 변침할까?"
10055070-106 = "그, 그건 안 돼요!"
10055070-107 = "1000야드밖에 안 남았는데 무리하게 변침했다가 기울기라도 하면…… 심지어 공격당하기라도 하면 그대로 침몰……?! 유구한 하르피아 호가 내 책임으로……?! 그것만큼은 안 돼……!"
10055070-108 = "캡틴! 음탐실에서 결과 나왔습니다!"
10055070-109 = "육안상으로는 선장모로 보이는 걸 쓴 사람의 음성인데요."
10055070-110 = "오오! 제가 지금 그쪽으로……."
10055070-111 = "아니, 시간 없으니까 그냥 갑판으로 틀어줘요!"
10055070-115 = "……랬지만~ 뭐, 오해로 끝나겠죠~"
10055070-116 = "오디세이아라고요? 세~상에 어느 바보가 바다에서 우리한테 싸움을 걸겠어요?"
10055070-118 = "진정한 해적이 해야 하는 일이라면 단 하나뿐!"
10055070-119 = "키보토스의 모든 금은보화를 노략하는 것이다! 요호호호!"
10055070-121 = "…………."
10055070-123 = "…………."
10055070-124 = "……아니, 잠깐."
10055070-125 = "상대는 구식 함선에 타고 있는 오합지졸 해적들. 반면 이쪽은 정예 트라이던트 부원. 지금 여기서 해적을 제거한다면, 공훈은 당연히 지휘관인……!"
10055070-126 = "캡틴?"
10055070-127 = "스읍, 하아……."
10055070-128 = "총원, 전투 배치!!! 해적을 소탕합니다!!!"
10055070-130 = "아이 아이 캡틴!"
10055070-139 = "제길! 해군 놈들, 벌써 냄새를 맡았나?!"
10055070-140 = "아니, 뭔 해군이에요?! 진짜 해적도 아닌데?!"
10055070-141 = "사소한 문제로 따지고 들지 마라! 지금 이 몸의 배가 벌집이 되고 있단 말이다!"
10055070-142 = "이대로 당하고만 있을쏘냐!"
10055070-143 = "선원들, 주목! 지금부터 이 몸의 지시에 따라 응전한다!"
10055070-149 = "……뭐냐? 멀뚱히 서서?"
10055070-151 = "아니, 그, 싸우라고 해도……."
10055070-152 = "어떻게요?"
10055070-154 = "어떻게라니? 이 배에는 훌륭한 대포가 달려 있지 않나!"
10055070-155 = "불가능해요."
10055070-156 = "아까 하려던 말인데요. 이 배의 대포, 속까지 완전히 녹슬었어요."
10055070-157 = "겉 부분만 닦는다고 해결될 문제가 아니었어요."
10055070-158 = "……과연. 그걸 알고, 너희들도 가만히 있던 건가."
10055070-160 = "네…… 이 배는 사실상 무장이 없어요."
10055070-161 = "그리고 우리는 싸워본 적도 없고요, 캡틴."
10055070-167 = "이해했다."
10055070-168 = "너희들이 얼마나 어리석은지 말이다!!!"
10055070-174 = "대포에 녹이 슬었다! 그게 뭐 어쨌다는 거냐!"
10055070-175 = "손 놓고 너희들의 배가 침몰할 때까지 기다리겠다는 거냐?!"
10055070-177 = "아니, 그렇지만……."
10055070-178 = "안 되는 건, 안 되는 거고……."
10055070-180 = "안 되는 것이냐? 안 하는 것이냐?"
10055070-181 = "조금 전에 싸워본 적도 없다고 말했지. 그렇다면 대포가 나가는지 안 나가는지도 모르는 상태겠군."
10055070-182 = "그런데 쏘기도 전에 지레짐작하고 포기하다니, 그러고도 너희가 뱃사람이냐!"
10055070-183 = "기합 부족이다! 애초에 화기란 것은 기합만 있으면 어떻게든 나간다!"
10055070-184 = "아니, 그건 말이……."
10055070-185 = "너희를 못 믿겠다면, 이 몸을 믿어라!"
10055070-186 = "대포는 반드시 나간다!"
10055070-187 = "다들 제자리로 이동! 장전하고, 발사 준비!"
10055070-192 = "……아니, 그래도 아닌 건 아니에요, 캡틴."
10055070-193 = "이 배의 대포는……."
10055070-195 = "너희들이 안 하겠다면 상관없다!"
10055070-196 = "우리 만마선 임원들이 수행할 테니까!"
10055070-198 = "으, 응?! 우리?!"
10055070-199 = "앗, 저요! 해보고 싶어요! 대포 장전!"
10055070-200 = "이부키도 도울게!"
10055070-201 = "아, 그러면 나는 빠질게. 다들 열심히 해?"
10055070-204 = "무슨 바보 같은……."
10055070-205 = "[s] \"이로하도 안 할 거야?\""
10055070-206 = "……그래도, 안 하면 할 때까지 계속 우기겠죠."
10055070-207 = "저 사람한테는, 직접 보여줘야 해요. 안 되는 게 안 된다는 걸."
10055070-208 = "어차피 오해인데, 그냥 설명하고 끝내면 될 것을……."
10055070-209 = "정말 귀찮고, 짜증 나는 사람."
10055070-211 = "영차! 영차!"
10055070-212 = "영차! 영차!"
10055070-213 = "어때? 이부키, 도움 돼?"
10055070-214 = "네! 덕분에 엄청 가벼워요!"
10055070-216 = "하아…… 전장식 대포는, 장전하려면 일단 화약을 넣으면 되던가요?"
10055070-220 = "앗, 안돼! 이로하 선배!"
10055070-221 = "처음에는 정해진 화약이 담긴 화약 주머니를 넣어야 해!"
10055070-225 = "아우우우……!"
10055070-226 = "아앗! 이부키 쨩, 무거운 거는 제가 들게요!"
10055070-227 = "아, 고맙습니다, 이로하 선배! 아직 이부키 힘으로는 못 들겠어……."
10055070-230 = "그다음에는 대포알! 그리고 이렇게 노끈 뭉치를 넣어서 대포알을 고정하고……."
10055070-231 = "마지막에 점화구에 화약을 넣고, 불을 붙이는 거야!"
10055070-232 = "오, 오오…… 대단히 잘 아네요, 이부키?"
10055070-233 = "응! 잔뜩 공부했으니까!"
10055070-235 = "……."
10055070-236 = "……."
10055070-238 = "선원들이여! 장전은 되었나!"
10055070-240 = "네, 뭐……."
10055070-242 = "대답이 작다!"
10055070-244 = "네, 캡틴!"
10055070-245 = "이제 붙을 붙이면 빵야! 하고 발사될 거야!"
10055070-247 = "과연, 훌륭하다, 훌륭해!"
10055070-248 = "초탄은 이 몸의 구령에 맞춰 일제 사격한다!"
10055070-249 = "목표는 저 가증스러운 해군 놈들의 배!"
10055070-251 = "의미 없는 짓이야."
10055070-252 = "될 리가 없는데, 뭘 저렇게 바보처럼……."
10055070-254 = "요호호! 보고 있어라!"
10055070-255 = "이 몸이 기적을 보여줄 테니까 말이다!"
10055070-259 = "준비……!"
10055070-270 = "───발사!!!"
10055070-273 = "……하아?"
10055070-274 = "무슨 말도 안 되는……?"
10055070-275 = "와아! 엄청난 소리!"
10055070-276 = "이부키도 쏴볼래! 에잇!"
10055070-280 = "요호호! 역시 기합 문제였군!"
10055070-282 = "……대포가, 쏴졌다?"
10055070-283 = "그날 이후로, 다시는 나가지 않았던 대포가……."
10055070-285 = "반격은 이제 시작이다! 선원들! 다시 장전하라!"
10055070-291 = "아이 아이!!! 캡틴!!!"
