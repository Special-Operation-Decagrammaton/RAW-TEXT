[translation]
10055070-1 = "第7話;Fools in August"
10055070-2 = "……今天霧好濃啊。"
10055070-3 = "偏偏挑這種天氣值瞭望班啊。"
10055070-4 = "算了，反正也不會出什麼事吧。"
10055070-5 = "今天沒有特別申報的船隻，AIS上也什麼都沒偵測到。"
10055070-6 = "隨便看一下就……"
10055070-7 = ""
10055070-9 = ""
10055070-10 = "看一下……？"
10055070-11 = "等等，把望遠鏡給我。"
10055070-13 = "…………"
10055070-14 = ""
10055070-15 = "右舷！瞭望報告！"
10055070-16 = ""
10055070-18 = ""
10055070-19 = "……"
10055070-20 = "…………？"
10055070-21 = "右舷，怎麼了？"
10055070-22 = "為什麼報告到一半就停了？"
10055070-23 = "啊，你來得正好，澄華！"
10055070-24 = "是船長才對吧！"
10055070-25 = "什麼船長嘛……明明只是抽籤分配的職務而已。"
10055070-26 = "叫．我．船．長！"
10055070-27 = "知道了，知道了啦，船長。"
10055070-28 = "真是的，就這麼喜歡頭銜啊……"
10055070-29 = "先不說這個了，瞭望報告只講到一半是什麼意思啊？"
10055070-30 = "該不會……是打瞌睡看錯了之類的吧？"
10055070-31 = "啊，是這樣的。"
10055070-32 = ""
10055070-34 = ""
10055070-35 = ""
10055070-36 = "不過……這樣對嗎？"
10055070-37 = "你也看到了吧。"
10055070-38 = "看是看到了……可是這實在有點說不通吧。"
10055070-39 = "喂，你們兩個別在那邊竊竊私語！"
10055070-40 = "這艘赫爾皮亞號上發生的所有事，船長都必須掌握才行！"
10055070-41 = ""
10055070-44 = ""
10055070-45 = "……他是這麼說的哦？"
10055070-46 = "吼唷，那我真的要說了哦？"
10055070-47 = ""
10055070-49 = ""
10055070-50 = "右舷！瞭望報告！"
10055070-51 = "帆船1艘！方位010度！距離1000碼！"
10055070-52 = "正處於與本船碰撞的航線上直線逼近！"
10055070-53 = ""
10055070-56 = ""
10055070-57 = "……唉，各位。我知道你們討厭我。"
10055070-58 = "既不是部長也不是副部長的我當上船長，你們會看不順眼也很正常。#n可是話雖如此，並不是每次巡邏兩位都能同行。"
10055070-59 = "所以為了航海安全，就～算～會被各位討厭，我也決定主動擔下這個職務……"
10055070-60 = "才不是咧！？別把人說得像怪人一樣！"
10055070-61 = "你自己看啦！"
10055070-62 = ""
10055070-64 = ""
10055070-65 = ""
10055070-66 = ""
10055070-67 = "……不是，反正什麼都沒──"
10055070-68 = ""
10055070-70 = ""
10055070-71 = ""
10055070-72 = "……？"
10055070-73 = "那是什麼？？？"
10055070-74 = ""
10055070-76 = ""
10055070-77 = ""
10055070-78 = "就說是帆船了。"
10055070-79 = "帆船是什麼啦！？"
10055070-80 = "就是那個啊！以前的軍艦！上面載著大砲的那種！"
10055070-81 = "誰說我不知道了！？等等，1000碼！？那不就近在眼前了嗎！？"
10055070-82 = "那麼大的船都這麼接近了，居然沒有人發現嗎？"
10055070-83 = "霧太濃了，視野就只有1000碼而已。"
10055070-84 = "對了！雷達！雷達那邊呢！？"
10055070-85 = "雷達直到現在都還沒偵測到任何訊號！"
10055070-86 = ""
10055070-88 = ""
10055070-89 = ""
10055070-90 = "……無動力？無線電靜默？"
10055070-91 = "……你說帆船是軍艦對吧？"
10055070-92 = "也就是說……一艘裝有大砲的軍艦，在霧中關掉引擎朝我們接近？"
10055070-93 = "……"
10055070-94 = "……船長，怎麼辦？"
10055070-95 = ""
10055070-97 = ""
10055070-98 = ""
10055070-99 = "為什麼那麼多天不挑，偏偏挑我當船長的時候發生這種事啊？#n乾脆裝作什麼都不知道好了？可是既然當了船長，不知道還是有不知道的責任……"
10055070-100 = "啊，對了！還沒確定對方是敵人吧？"
10055070-101 = "無線電通訊呢？"
10055070-102 = "從剛才就一直在用無線電呼叫，但對方都沒有回應！"
10055070-103 = "用探照燈發出碰撞警告呢？"
10055070-104 = "早就在做了，可是沒有反應。"
10055070-105 = "要不要現在往右轉舵？"
10055070-106 = "那，那可不行！"
10055070-107 = "要是在只剩1000碼的情況下硬是轉向導致船身傾斜……#n更別說要是被攻擊，就會直接沉沒……！？#n悠久的赫爾皮亞號要因為我而……！？唯獨這個絕對不行……！"
10055070-108 = "船長！聲納室的結果出來了！"
10055070-109 = "是個戴著像是船長帽的人的聲音。"
10055070-110 = "哦哦！我現在就過去……"
10055070-111 = "不，沒時間了，直接轉到甲板上播吧！"
10055070-112 = ""
10055070-114 = ""
10055070-115 = "……反正～應該只是誤會吧～"
10055070-116 = "我們可是奧德賽耶？世上哪～有笨蛋會在海上找我們打架啊？"
10055070-118 = "真正的海盜該做的事只有一件！"
10055070-119 = "那就是掠奪奇普托斯所有的金銀財寶！喲呵呵呵！"
10055070-120 = ""
10055070-121 = "…………"
10055070-123 = "…………"
10055070-124 = "……不對，等一下。"
10055070-125 = "對方是搭乘舊式船艦的烏合之眾海盜，而我們這邊則是精銳的三叉戟部員。#n要是現在剿滅海盜，功勞當然是屬於身為指揮官的……！"
10055070-126 = "船長？"
10055070-127 = "嘶，呼……"
10055070-128 = "全員，進入戰鬥配置！！！準備掃蕩海盜！！！"
10055070-130 = "[ruby=Aye aye, captain]是的，船長[/ruby]！"
10055070-131 = ""
10055070-133 = ""
10055070-138 = ""
10055070-139 = "可惡！海軍那些傢伙，已經聞到風聲了嗎！？"
10055070-140 = "不是，什麼海軍啊！？我們又不是真的海盜！？"
10055070-141 = "別拘泥這種小問題！#n現在本大人的船都快被打成蜂窩了！"
10055070-142 = "怎麼能就這樣任人宰割！"
10055070-143 = "船員們注意！現在起依照本大人的指示應戰！"
10055070-144 = ""
10055070-147 = ""
10055070-149 = "……怎麼了？都愣在那裡做什麼？"
10055070-151 = "不是，那個，就算叫我們戰鬥……"
10055070-152 = "要怎麼打啊？"
10055070-154 = "什麼怎麼打？這艘船上不是裝著出色的大砲嗎！"
10055070-155 = "不可能的。"
10055070-156 = "我剛才就想說了，這艘船的大砲已經連內部都完全生鏽了。"
10055070-157 = "這不是只把外表擦乾淨就能解決的問題。"
10055070-158 = "……原來如此。你們是因為知道這點，才一直按兵不動的嗎。"
10055070-160 = "是的……這艘船實際上沒有武裝。"
10055070-161 = "而且我們也從來沒打過仗，船長。"
10055070-162 = ""
10055070-164 = ""
10055070-165 = ""
10055070-166 = ""
10055070-167 = "我明白了。"
10055070-168 = "明白你們有多愚蠢了！！！"
10055070-169 = ""
10055070-172 = ""
10055070-174 = "大砲生鏽了？那又怎麼樣！"
10055070-175 = "你們難道打算袖手旁觀，等著自己的船沉下去嗎！？"
10055070-177 = "可，可是……"
10055070-178 = "不行的事就是不行……"
10055070-180 = "是做不到？還是不想做？"
10055070-181 = "你們剛才說從來沒打過仗對吧。#n那就代表你們根本不知道大砲到底能不能發射。"
10055070-182 = "連發射都還沒試過就自以為是地放棄，這樣還算是船員嗎！"
10055070-183 = "是氣勢不夠！火器這種東西只要有氣勢，總會有辦法發射的！"
10055070-184 = "不是，這也太沒道理了……"
10055070-185 = "要是不相信自己，就相信本大人吧！"
10055070-186 = "大砲一定能發射！"
10055070-187 = "全員回到崗位！裝填，準備發射！"
10055070-188 = ""
10055070-191 = ""
10055070-192 = "……不行的事就是不行啦，船長。"
10055070-193 = "這艘船的大砲……"
10055070-195 = "你們不做也無所謂！"
10055070-196 = "就由我們萬魔船的幹部來執行！"
10055070-198 = "嗯！？我們！？"
10055070-199 = "啊，我來我來！我想試試看裝填大砲！"
10055070-200 = "伊吹也來幫忙！"
10055070-201 = "啊，那我就不參加了。大家加油哦？"
10055070-202 = ""
10055070-203 = ""
10055070-204 = "真是愚蠢……"
10055070-205 = "[s] 「伊呂波也不做嗎？」"
10055070-206 = "……要是不做的話，他大概會一直吵到我們做為止吧。"
10055070-207 = "對付那個人就是要直接做給他看，好讓他知道不行就是不行。"
10055070-208 = "反正只是場誤會，直接解釋清楚不就好了……"
10055070-209 = "真是個麻煩又煩人的人。"
10055070-210 = ""
10055070-211 = "嘿咻！嘿咻！"
10055070-212 = "嘿咻！嘿咻！"
10055070-213 = "怎麼樣？伊吹有幫上忙嗎？"
10055070-214 = "有！多虧了伊吹，變得超輕的！"
