[translation]
90100110-1 = "Episode 11;Rumors and Inscrutability"
90100110-2 = "General Student Council Executive Office"
90100110-3 = ""
90100110-4 = "Good news, Squad Leader Yukino."
90100110-5 = "Victims of the white scarecrow, also known as the \"kunekune,\" have started waking up."
90100110-6 = "Besides complaints of mild muscle soreness, most appear to be in good health."
90100110-7 = "The hospitals stated that they do not know why the patients' conditions had suddenly improved, but..."
90100110-8 = "I suspect it is because your FOX Squad successfully resolved the anomalies, correct?"
90100110-9 = ""
90100110-11 = ""
90100110-12 = ""
90100110-13 = "President, do you fully trust everything written in our report?"
90100110-14 = "Wasn't it written by you, Squad Leader Yukino? Additionally, Schale's Sensei vouched for it..."
90100110-15 = "...So there's no reason not to trust it."
90100110-16 = "As I stated in the report, we were honestly not sure what we were fighting during the mission."
90100110-17 = "Our \"Lore\" enemies were enigmas with neither clear causes nor clear weaknesses."
90100110-18 = "We simply tried everything we could. Fortunately, we stumbled upon a workable solution."
90100110-19 = "But your attempt at a solution saved countless people."
90100110-20 = ""
90100110-22 = ""
90100110-23 = "That's...not important."
90100110-24 = ""
90100110-26 = ""
90100110-27 = "No... I'm sorry. I don't mean to imply that I don't care about people."
90100110-28 = "Many mysterious things happen in Kivotos. But...to have this number of casualties..."
90100110-29 = "People will rightfully want answers. They'll want to know what caused these people to fall ill and why. They'll assign blame, and even..."
90100110-30 = ""
90100110-32 = ""
90100110-33 = "...turn their sights on you."
90100110-34 = ""
90100110-36 = ""
90100110-37 = ""
90100110-38 = "Yukino."
90100110-39 = "Can you guess what I'm thinking right now?"
90100110-40 = "You...think my concerns are unfounded?"
90100110-41 = "Nope! Incorrect."
90100110-42 = "Right before you came into my office, Oki dropped off some snacks that I've never seen before."
90100110-43 = "This one has a sweet yet somehow nostalgic citrus aroma. The package doesn't say what's in it. I paired it with tea."
90100110-44 = "I was actually thinking about its contents while speaking with you."
90100110-45 = "I must apologize for my absentmindedness."
90100110-46 = "N-No. It's fine."
90100110-47 = "I didn't notice at all... I also drift off sometimes."
90100110-48 = "Yes. It is fairly common for something trivial to invade one's thoughts."
90100110-49 = "Children so easily confess things like this, but...it is rare among people like us, isn't it?"
90100110-50 = "No one wants to be perceived as rude or strange, after all."
90100110-51 = "Ultimately, one doesn't gain much through so openly revealing their feelings."
90100110-52 = "People are wont to hide their emotions to preserve their relationships. Ultimately, that's what makes it so hard for one person to understand another. Conflicts are inevitable."
90100110-54 = "...I wonder if these anomalies in Kivotos are born from that fundamental barrier in communication."
90100110-55 = "What if there were a way to speak into people's hearts...? Possibly through something beyond words or text?"
90100110-57 = ""
90100110-58 = "I don't understand."
90100110-59 = "Are you suggesting that the kunekune was delivering a message?"
90100110-60 = "Fufu. You know it did, Squad Leader Yukino."
90100110-62 = "You wrote it in your report. One must \"avoid outdoor activities on hot days.\""
90100110-63 = "Just by existing, this \"kunekune\" served as an active warning to people who venture outside on a scorching summer day."
90100110-64 = ""
90100110-65 = "But people were hurt. Are you saying that the message was worthwhile?"
90100110-66 = "In a way... Yes."
90100110-67 = ""
90100110-69 = ""
90100110-70 = "Squad Leader Yukino, I still have some of the snacks I mentioned earlier. Would you like some?"
90100110-71 = "If we try this treat and consider its ingredients together..."
90100110-72 = ""
90100110-74 = ""
90100110-75 = ""
90100110-76 = "...Perhaps we will be able to understand each other better."
90100110-78 = ""
90100110-79 = "It's so hot..."
90100110-80 = ""
90100110-82 = ""
90100110-83 = ""
90100110-84 = "Hey, Niko. Why are we waiting outside?"
90100110-85 = "Can't we wait in the lobby until Yukino's done with her meeting?"
90100110-86 = "Ah, that's..."
90100110-87 = "Huh. You're quite brave, Kurumi."
90100110-88 = "We've fought quite a few Student Council members. Are you willing to risk making eye contact with them?"
90100110-89 = "Ugh... Fine, I get it."
90100110-90 = "We're also on parole. It's probably best to keep a low profile."
90100110-91 = "Just try to bear it. You're tough enough."
90100110-92 = "But seriously, why are we standing in the middle of the plaza like this? In direct sunlight!"
90100110-93 = "Can't we at least go to a cafe or get some drinks from the machine?"
90100110-94 = "No. Yukino has the credit card."
90100110-95 = "Why? Niko, I thought you handled expenses!"
90100110-96 = "The mission covered our per diem... She said she had to bring the card for the debriefing. You know she does things by the book."
90100110-97 = "Ah, fine. Whatever."
90100110-98 = ""
90100110-100 = ""
90100110-101 = "It's so hot... I want to go back to Schale. Just let me get underground. I don't care if it's in a hidden den."
90100110-102 = "Is that so? Do you think that's wise, broadcasting in public that you live at Schale?"
90100110-103 = "Honestly. It's not like anyone's out here. Who cares?"
90100110-104 = "Huh? Aren't you...?"
90100110-105 = "Look! I was talking about Schale, but I wasn't saying I live there! I mean...who would? It's...an administrative building!"
90100110-106 = "...What are you talking about?"
90100110-107 = ""
90100110-109 = ""
90100110-111 = ""
90100110-112 = "It's been a while, Hyperade."
90100110-113 = "Oh... Yes."
90100110-114 = "Yup. Hey, everyone. I'm Erika...from Gehenna Academy. It's cool to catch you again."
90100110-115 = "O-Oh. Absolutely. What a coincidence."
90100110-116 = "They're making you peddle drinks out here? It must be a long way from Hyacinth Academy."
90100110-117 = "Y-Yes! And these are my associates. They also...sell drinks."
90100110-118 = "So, about what happened earlier..."
90100110-119 = ""
90100110-121 = ""
90100110-122 = "...I'm sorry. I lied to you. I gave you a fake MomoTalk account."
90100110-123 = "I know. I checked on it and you were gone."
90100110-124 = "And then I learned that Hyperade didn't exist. Kirara was shaken up. She thought I talked to an electrolyte-fueled ghost."
90100110-125 = "But it looks like you're alive. So, that's a relief."
90100110-126 = ""
90100110-128 = ""
90100110-129 = "I'm sorry..."
90100110-130 = "Nah. There's nothing to be sorry about."
90100110-131 = "We all have our secrets. I just happened to catch you on a day that you were hiding something."
90100110-132 = "...Aren't you upset?"
90100110-133 = "Not really. It was no skin off my nose. Honestly, meeting you was fun."
90100110-134 = "I kept thinking... \"Who was that girl?\" And \"Why was she giving out non-existent drinks?\" and \"What's the secret recipe?\""
90100110-135 = "I spent a few weeks speculating. It was entertaining."
90100110-136 = "I'm sure you had your reasons, and you didn't hurt anyone. I assume you just know something I don't."
90100110-137 = "A lie requires a lot of dedication, right?"
90100110-138 = ""
90100110-140 = ""
90100110-141 = ""
90100110-142 = "Thank you for understanding."
90100110-143 = "By the way, if you're just standing out here... How about we all go to that cafe and hang? "
90100110-144 = "They make a mean lemonade."
90100110-145 = "The thing is, we forgot our wallets..."
90100110-146 = "Please. Consider it my treat."
90100110-147 = ""
90100110-149 = ""
90100110-150 = "I just... I need to know one thing, if you don't mind."
90100110-151 = ""
90100110-153 = ""
90100110-154 = "What should we do, Niko? I think she's onto us."
90100110-155 = "...Should I throw a smoke bomb and we make a run for it?"
90100110-156 = "Y-You better not!"
90100110-157 = ""
90100110-159 = ""
90100110-160 = ""
90100110-161 = "What was in that drink, anyway? That Hyperade?"
90100110-162 = "I wanted my friends to try it, but...nothing in the stores comes close."
90100110-163 = "Oh, that's easy! Mix 500ml of water with a Beluga vitamin tablet and..."
90100110-164 = "Otogi! Stop spilling the beans! She said she wants to buy us drinks! Keep your negotiation power."
90100110-165 = "Oh, you seem like a fun bunch."
90100110-166 = "Let's get to the cafe and out of the sun, huh?"
90100110-167 = ""
90100110-169 = ""
90100110-170 = ""
90100110-171 = "Yes, you're right."
90100110-173 = "...After all, it's dangerous to stand in the sun on a hot day like this."
