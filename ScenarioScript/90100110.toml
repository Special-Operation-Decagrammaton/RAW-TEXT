[translation]
90100110-1 = "제11화;소문과 불가해"
90100110-2 = "총학생회장 집무실"
90100110-4 = "좋은 소식이 있습니다, 유키노 소대장."
90100110-5 = "하얀 허수아비— 통칭, '쿠네쿠네'에게 습격당했던 피해자들이 깨어나기 시작했습니다."
90100110-6 = "일부 피해자가 너무 오래 누워있었던 탓에 가벼운 근육통을 호소하는 것을 제외하면, 대부분 건강에도 큰 이상이 없는 모양입니다."
90100110-7 = "정신을 잃었을 때와 마찬가지로 병원에서는 피해자들의 상태가 갑자기 호전된 이유를 알지 못한다고 했지만……"
90100110-8 = "역시 FOX 소대 여러분이 성공적으로 괴이를 퇴치해 준 덕분이 아닐까요?"
90100110-13 = "회장께서는 저희가 올린 보고서의 내용을 모두 신뢰하십니까?"
90100110-14 = "네, 유키노 소대장이 쓴 보고서잖아요? 게다가 샬레의 선생님의 보증도 있었으니—"
90100110-15 = "……신뢰하지 않을 이유가 없지요."
90100110-16 = "보고서를 통해 이미 보고 드렸습니다만, 저희 또한 아직까지도 이번 작전에서 무엇을 상대했는지 솔직히 실감하지 못하고 있습니다."
90100110-17 = "[ruby=로어]상대[/ruby]는 원인도 대책도 명확하지 않은 불가해."
90100110-18 = "저희는 그저 할 수 있는 바를 모두 시도했고, 운 좋게 파훼법을 찾아 해결된 것뿐입니다."
90100110-19 = "결국은 그 시도가 많은 인명을 구했지만요."
90100110-23 = "결과는…… 중요하지 않습니다."
90100110-27 = "아니…… 인명이 어찌되어도 상관없다는 뜻은 아니었습니다."
90100110-28 = "키보토스에서 불가해한 사건이 벌어지는 게 드문 일이 아니라지만, 이렇게 수많은 인명 피해를 수반한 불가해는 흔치 않았습니다."
90100110-29 = "일상에 통제할 수 없는 변수가 존재한다는 사실을 알게 된다면, 사람들은 불안에 빠질 겁니다. 범인을 찾고, 동기를 찾고, 책임을 지우고, 더 나아가……"
90100110-33 = "당신에게 총구를 돌릴 수도 있습니다."
90100110-38 = "유키노 양."
90100110-39 = "혹시 제가 지금 무슨 생각을 하고 있는지 알아맞혀 보시겠어요?"
90100110-40 = "제 걱정이 기우라 생각하십니까?"
90100110-41 = "땡! 오답입니다."
90100110-42 = "사실은, 유키노 양이 집무실에 들어오기 직전에 오키 양이 처음 보는 다과를 선물로 주고 갔었거든요."
90100110-43 = "차와 곁들여 먹으니 뭔가 달콤하면서도 낯익은 시트러스 향이 느껴졌는데…… 어떤 재료로 만들었는지 포장지에 전혀 쓰여있지 않아서요."
90100110-44 = "유키노 양과 대화를 나누면서도 한편으로는 계속 그 다과의 내용물을 생각하고 있었답니다."
90100110-45 = "이 건에 대해서는 사과를 드려야겠네요."
90100110-46 = "아, 아뇨. 그건 괜찮습니다."
90100110-47 = "저는 전혀 눈치채지 못했고…… 저 또한 가끔 그런 때가 있으니까요."
90100110-48 = "네. 아무래도 상관없는 사소한 일이 하루의 생각을 지배하는 경우는 생각보다 자주 있는 '흔한 일'이지요."
90100110-49 = "하지만 어린 아이라면 모를까. 사회생활을 하는 사람이라면 그 생각을 솔직하게 입 밖으로 털어놓는 경우는 거의 없어요."
90100110-50 = "상대에게 실례가 될까 봐, 혹은 자신을 이상하게 생각할까 봐."
90100110-51 = "애초에 자신의 솔직한 심상을 드러내어 얻을 수 있는 것이 많지 않기에."
90100110-52 = "사람들은 마음을 감춘 채 관계를 이어 나가고, 결국 인간은 서로의 마음을 완벽하게 이해할 수 없지요. 대부분의 오해는 이 때문에 발생합니다."
90100110-54 = "……결국 이 키보토스의 괴이라는 것도 그런 소통의 부재가 만들어 낸 현상이 아닐까 싶어요."
90100110-55 = "미처 말이나 글로 표현되지 못한, 사람들의 마음이 흘러나와 전해진 메시지."
90100110-58 = "이해할 수 없군요."
90100110-59 = "사람을 혼란에 빠트리고, 아무 말도 하지 못하게 만드는 환각이 무슨 메시지를 갖고 있단 말입니까?"
90100110-60 = "후후, 그 메시지는 유키노 소대장의 입으로 이미 들었는걸요."
90100110-62 = "'무더운 날에는 야외활동을 자제할 것.'"
90100110-63 = "이 '쿠네쿠네'는 존재하는 것만으로도 무더운 여름날 야외를 오가는 사람들에게 충분한 경고가 되었겠지요."
90100110-65 = "……고작 그것 때문에."
90100110-66 = "네, 고작 그것 때문에."
90100110-70 = "유키노 소대장, 혹시 괜찮으시다면 아까 말한 다과가 남았는데 하나 드시겠어요?"
90100110-71 = "이 다과를 먹고 그 재료에 대해 고민해 본다면……"
90100110-76 = "어쩌면 우리는 조금 더 서로를 잘 이해할 수 있게 될지도 모르겠네요."
90100110-79 = "더워……."
90100110-84 = "저기, 니코. 어째서 우리만 밖에서 대기하고 있는 거야?"
90100110-85 = "유키노가 면담 마치고 돌아올 때까지 우리도 건물 안에서 기다리면 안 돼?"
90100110-86 = "아, 그건—"
90100110-87 = "오. 생각보다 대담한데, 쿠루미."
90100110-88 = "너는 학생회 건물 안에 들어갔다가, 전에 우리한테 두들겨 맞은 총학생회 간부와 우연히 마주치더라도 아무렇지 않은 거야?"
90100110-89 = "윽…… 그건 곤란하지만……"
90100110-90 = "일단 우리는 가석방된 몸이니까. 얼굴을 알지도 모르는 총학생회 건물에 들어가는 건 곤란하다고 생각했어."
90100110-91 = "조금 덥더라도 잠시만 기다려 줘."
90100110-92 = "하지만 굳이 이렇게 볕이 강한 광장 한 가운데에서 기다리고 있을 필요는 없잖아? 작전 중도 아닌데."
90100110-93 = "저기, 우리 카페 같은 곳에서 시원한 음료라도 마시면서 기다리면 안 돼?"
90100110-94 = "안 돼. 작전 지원 카드가 들어 있는 지갑은 지금 유키노가 갖고 있으니까."
90100110-95 = "왜? 그동안 지갑 관리는 니코가 하고 있었잖아?"
90100110-96 = "작전 보고에 지출 결의도 포함되어 있었으니까…… 카드도 같이 가져가야 한다고 했거든."
90100110-97 = "아아, 그럼 어쩔 수 없네."
90100110-101 = "더워…… 빨리 샬레로 돌아가고 싶다."
90100110-102 = "누가 들으면 샬레가 네 집인줄 알겠다."
90100110-103 = "들을테라면 들으라지. 이런 더운 날씨에 지나다니는 사람이 얼마나 있다고—"
90100110-104 = "어라? 너희는……"
90100110-105 = "아, 아니! 그러니까 내 말은 샬레에 가고 싶다는 뜻이었지, 거기가 집이라는 소리는 아니었—"
90100110-106 = "……무슨 소리를 하는 건지 모르겠네."
90100110-112 = "오랜만이야, 아르바이트 양."
90100110-113 = "아. 그 때 만났던……"
90100110-114 = "응. 게헨나 학원의 에리카야. 여기서 또 만나게 되네."
90100110-115 = "아, 아하하…… 그러게요. 정말 신기한 인연이네요."
90100110-116 = "이번에도 아르바이트 일을 하던 중이었던 거야? 히아신스 학원은 여기서 꽤 떨어져 있는데."
90100110-117 = "네, 네! 친구들과 아르바이트를 하던 중이었어요."
90100110-118 = "그러니까 그 때는……"
90100110-122 = "……죄송합니다. 사실 거짓말을 했어요. 그 때 알려드린 모모톡은 가짜 주소였어요."
90100110-123 = "응, 그렇더라. 돌아가서 모모톡을 다시 확인했더니 없는 계정이라고 떠서 깜짝 놀랐어."
90100110-124 = "게다가 그 <하이퍼 에이드>라는 음료수도 실제로는 존재하지 않는 음료수더라. 그 말을 들은 키라라가 귀신을 만난 게 아니냐며 한동안 호들갑을 떨긴 했지만."
90100110-125 = "그래도 허깨비는 아니었구나. 다행이야."
90100110-129 = "죄송합니다……"
90100110-130 = "아니야. 미안할 게 뭐 있어."
90100110-131 = "사람마다 숨기고 싶은 건 있는 법이고, 우연히 그 때는 내가 숨기고 싶은 모습과 마주쳤던 모양이지."
90100110-132 = "……화내지 않으시는 건가요?"
90100110-133 = "글쎄. 특별히 손해 본 것도 없었고, 오히려 내게는 즐거운 경험이었는걸?"
90100110-134 = "그 때 내가 만난 사람은 누구였을까. 왜 그 자리에서 존재하지 않는 음료수를 나누어 주고 있었던 걸까—"
90100110-135 = "상상의 나래를 펼쳐가며, 지난 몇 주간은 꽤 즐거운 시간을 보냈어."
90100110-136 = "게다가 네게도 사정이 있었을 텐데, 알지도 못하면서 성을 내고 싶지는 않아."
90100110-137 = "왜, '거짓말에도 헌신이 필요하다'는 말도 있잖아?"
90100110-142 = "이해해 주셔서 감사합니다."
90100110-143 = "그나저나 특별한 예정이 없다면 이 앞에 있는 카페에서 잠깐 이야기나 하지 않을래?"
90100110-144 = "저기 있는 카페에서 파는 특제 에이드가 꽤나 일품이거든."
90100110-145 = "사실 그게 우리는 마침 지갑을 두고 와서……"
90100110-146 = "아, 그런 거라면 내가 사도 괜찮은데."
90100110-150 = "혹시 마음에 걸린다면 이것만큼은 솔직하게 답해줄 수 없을까?"
90100110-154 = "어떡하지, 니코? 아무래도 우리의 정체를 캐려는 모양인데."
90100110-155 = "……이야기가 길어지기 전에 연막을 뿌리고 도망칠까? 연막탄이라면 있어."
90100110-156 = "그, 그건 안 돼!"
90100110-161 = "—전에 먹었던 <하이퍼 에이드>. 그거 어떻게 만드는지 알려 줘."
90100110-162 = "내 친구에게도 맛보여 주고 싶었는데 비슷한 맛이 나는 음료수를 도통 찾을 수가 없더라고."
90100110-163 = "그거라면 쉽지! 시중에서 파는 벨루가 비타민 한 알에 물 500ml를 타고—"
90100110-164 = "잠깐, 오토기. 얻어먹기도 전에 정보를 불면 어떡해? 협상 테이블에 앉기 전까지는 정보를 통제해야지."
90100110-165 = "후후, 너희들 진짜 생각보다 재미있네. 수다 떨 보람이 있겠어."
90100110-166 = "그럼 어서 움직일까? 오늘은 볕이 강하니까."
90100110-171 = "네. 그러게요."
90100110-173 = "……더운 날 볕 아래에 오래 있는 건 위험하니까요."
