[translation]
90100110-1 = "第11話;傳聞與不可解"
90100110-2 = "聯邦學生會長辦公室"
90100110-3 = ""
90100110-4 = "有個好消息，雪乃小隊長。"
90100110-5 = "被白色稻草人──通稱「扭來扭去」襲擊的受害者們開始甦醒了。"
90100110-6 = "除了部分受害者因為躺了太久而有輕微的肌肉痠痛之外，#n多數人的健康狀況似乎沒有太大的異常。"
90100110-7 = "雖然就和失去意識時一樣，醫院表示並不清楚受害者們的狀態為何會突然好轉……"
90100110-8 = "在我看來，想必是因為FOX小隊的各位成功擊退了怪異吧？"
90100110-9 = ""
90100110-11 = ""
90100110-12 = ""
90100110-13 = "會長您完全相信我們提出的報告書嗎？"
90100110-14 = "是的，這可是雪乃小隊長寫的報告書啊？#n而且還有夏萊的老師作為擔保……"
90100110-15 = "……我沒有理由不相信。"
90100110-16 = "雖然在報告書中也有提及……#n老實說，我們至今依然無法切實體會到這次作戰中對付的究竟是什麼。"
90100110-17 = "[ruby=怪談]對手[/ruby]是個原因與對策都不明確的不可解之物。"
90100110-18 = "我們只是嘗試了所有能做的事，然後幸運地找到了破解方法才得以解決。"
90100110-19 = "然而從結果上來說，那些嘗試確實拯救了許多人的性命。"
90100110-20 = ""
90100110-22 = ""
90100110-23 = "結果……並不重要。"
90100110-24 = ""
90100110-26 = ""
90100110-27 = "不……我的意思並不是人命如何都無所謂。"
90100110-28 = "雖說在奇普托斯發生不可解的事件並不稀奇，#n但是像這樣伴隨著大量人命傷亡的不可解事件卻十分少見。"
90100110-29 = "一旦得知日常之中存在著無法掌控的變數，人們便會陷入不安。#n尋找犯人、尋找動機、追究責任，甚至可能更進一步……"
90100110-30 = ""
90100110-32 = ""
90100110-33 = "將槍口轉向您也說不定。"
90100110-34 = ""
90100110-36 = ""
90100110-37 = ""
90100110-38 = "雪乃同學。"
90100110-39 = "你願不願意猜猜看……我心裡正在想些什麼呢？"
90100110-40 = "您認為我的擔憂只是杞人憂天嗎？"
90100110-41 = "可惜！答錯了。"
90100110-42 = "其實就在雪乃同學進辦公室之前，扇喜同學送了我一份從沒見過的茶點當禮物。"
90100110-43 = "配著茶一起吃，感覺有股香甜又似曾相識的柑橘香氣……#n可是包裝紙上完全沒寫是用什麼材料做的。"
90100110-44 = "所以在和雪乃同學交談的同時，我也一直在思考那份茶點的內容物呢。"
90100110-45 = "關於這件事，我得向你道個歉才行。"
90100110-46 = "沒，沒關係。"
90100110-47 = "我完全沒有察覺到……而且我偶爾也會有那種時候。"
90100110-48 = "是啊。一些無關緊要的瑣事支配了一整天的思緒……#n這種「尋常事」其實比想像中還要常見呢。"
90100110-49 = "不過小孩子姑且不論，有社會經驗的人往往不會把那種想法坦率地說出口。"
90100110-50 = "可能是擔心會對對方失禮，也可能擔心對方會認為自己是個奇怪的人。"
90100110-51 = "而且坦露自己的真實想法，能得到的東西本來就不多。"
90100110-52 = "所以人們才會隱藏真心維繫著關係，最終依然無法完全理解彼此的內心。#n大部分的誤會也都是由此而生。"
90100110-54 = "……就連這奇普托斯的怪異，或許也是這種溝通缺失所造就的現象也說不定。"
90100110-55 = "那是未能以言語或文字表達出來，從人們心中流淌而出的訊息。"
90100110-57 = ""
90100110-58 = "我無法理解。"
90100110-59 = "那種會讓人陷入混亂、變得無法言語的幻覺之中，究竟能蘊含什麼樣的訊息呢？"
90100110-60 = "呵呵。那則訊息，我已經從雪乃小隊長口中聽見了哦。"
90100110-62 = "「避免在炎熱的日子裡進行戶外活動」。"
90100110-63 = "這個「扭來扭去」光是存在，#n就足以對在炎炎夏日往來戶外的人們構成充分的警告了吧。"
90100110-64 = ""
90100110-65 = "……就只是因為這樣。"
90100110-66 = "是的，就只是因為這樣。"
90100110-67 = ""
90100110-69 = ""
90100110-70 = "雪乃小隊長。如果不介意的話，剛才提到的那份茶點還有剩……你要不要嚐嚐看呢？"
90100110-71 = "如果吃了這份茶點，並思考一下它的材料……"
90100110-72 = ""
90100110-74 = ""
90100110-75 = ""
90100110-76 = "或許我們就能稍微更理解彼此了呢。"
90100110-78 = ""
90100110-79 = "好熱……"
90100110-80 = ""
90100110-82 = ""
90100110-83 = ""
90100110-84 = "我說仁子，為什麼只有我們在外面待命啊？"
90100110-85 = "在雪乃結束面談回來之前，我們不能也在建築物裡面等嗎？"
90100110-86 = "啊，那是因為──"
90100110-87 = "哦～你比我想像中還大膽嘛，胡桃。"
90100110-88 = "想進到大樓裡就代表，你就算碰巧撞見之前被我們暴打一頓的幹部也無所謂囉？"
90100110-89 = "唔……那是會很困擾沒錯……"
90100110-90 = "畢竟我們現在是假釋之身。#n我覺得進入不清楚內部構造的聯邦學生會大樓有點不妥。"
90100110-91 = "就算有點熱，也請再稍微忍耐一下吧。"
90100110-92 = "可是也沒必要特地在陽光這麼強的廣場中央等吧？#n現在又不是在作戰。"
90100110-93 = "不能去咖啡廳之類的地方，邊喝冰涼的飲料邊等嗎？"
90100110-94 = "不行。因為裝著作戰支援卡片的錢包，現在在雪乃那裡。"
90100110-95 = "為什麼？錢包以前不都是仁子保管的嗎？"
90100110-96 = "因為作戰報告裡也包含了支出決議……所以他說卡片也得一起帶過去。"
90100110-97 = "啊啊，那就沒辦法了。"
90100110-98 = ""
90100110-100 = ""
90100110-101 = "好熱……好想快點回夏萊哦。"
90100110-102 = "要是被別人聽到的話，搞不好會以為夏萊是你家呢。"
90100110-103 = "要聽就聽吧。#n這種大熱天是能有多少人經過──"
90100110-104 = "咦？你們是……"
90100110-105 = "不，不是！#n我只是在表達想去夏萊而已，沒有說那裡是我家的意──"
90100110-106 = "……我不太懂你的意思呢。"
90100110-107 = ""
90100110-109 = ""
90100110-111 = ""
90100110-112 = "好久不見了，打工同學。"
90100110-113 = "啊，是當時遇到的……"
90100110-114 = "嗯，我是格黑娜學園的繪里香。#n沒想到會在這裡再次見面呢。"
90100110-115 = "啊，啊哈哈……是啊。真是奇妙的緣分呢。"
90100110-116 = "這次也是在打工途中嗎？#n風信子學園離這裡應該還挺遠的才對。"
90100110-117 = "是，是的！我正在和朋友們一起打工。"
90100110-118 = "所以那個時候……"
90100110-119 = ""
90100110-121 = ""
90100110-122 = "……對不起，其實我說了謊。#n當時告訴你的MomoTalk也是假的帳號。"
90100110-123 = "嗯，我想也是。#n回去之後發現MomoTalk顯示帳號不存在的時候，我還嚇了一跳呢。"
90100110-124 = "而且實際上也不存在那個叫做「Hyper Aid」的飲料。#n聽說這件事的綺羅羅還大驚小怪了好一陣子，說我是不是遇到鬼了呢。"
90100110-125 = "不過你並不是幻影，真是太好了。"
90100110-126 = ""
90100110-128 = ""
90100110-129 = "非常抱歉……"
90100110-130 = "沒事沒事。沒什麼好道歉的啦。"
90100110-131 = "任何人都會有想隱藏的事，當時我只是碰巧撞見了你想隱藏的樣子而已。"
90100110-132 = "……你不生氣嗎？"
90100110-133 = "這個嘛……畢竟我也沒吃什麼虧，對我來說反而是段愉快的經驗呢。"
90100110-134 = "那時候我遇到的人究竟是誰、為什麼會在那種地方分送不存在的飲料──"
90100110-135 = "像這樣盡情發揮想像力，讓我這幾週過得還挺愉快的哦。"
90100110-136 = "而且你肯定也有你的苦衷，我不想在一無所知的情況下亂發脾氣。"
90100110-137 = "不是有句話說「謊言也需要奉獻」嗎？"
90100110-138 = ""
90100110-140 = ""
90100110-141 = ""
90100110-142 = "謝謝你的諒解。"
90100110-143 = "話說回來，如果你們沒有特別的安排，要不要去前面那間咖啡廳稍微聊一下？"
90100110-144 = "那間咖啡廳賣的特製氣泡飲還挺不錯的哦。"
90100110-145 = "那個……其實我們剛好把錢包忘在家裡了……"
90100110-146 = "這樣的話，要我請客也沒關係哦。"
90100110-147 = ""
90100110-149 = ""
90100110-150 = "如果覺得過意不去的話，希望你可以老實回答我一個問題。"
90100110-151 = ""
90100110-153 = ""
90100110-154 = "怎麼辦，仁子？#n他看起來好像想打探我們的真實身分。"
90100110-155 = "……要不要趁話題拉長之前用煙霧彈逃走？#n我身上有煙霧彈哦。"
90100110-156 = "那，那可不行！"
90100110-157 = ""
90100110-159 = ""
90100110-160 = ""
90100110-161 = "──之前喝過的「Hyper Aid」。告訴我那個要怎麼做吧。"
90100110-162 = "我想讓我朋友也喝喝看，卻怎麼也找不到味道相近的飲料。"
90100110-163 = "那個的話很簡單哦！#n只要把1錠市面上賣的白鯨維他命加進500ml的水裡──"
90100110-164 = "等等，御伽。你怎麼還沒被請客就把情報說出來了啊？#n在坐上談判桌之前都要管控好機密啦。"
90100110-165 = "呵呵，你們真的比我想像中還有趣呢。#n看來很值得跟你們聊聊。"
90100110-166 = "那麼我們快點走吧？#n今天陽光還挺強的呢。"
90100110-167 = ""
90100110-169 = ""
90100110-170 = ""
90100110-171 = "嗯，說的也是。"
90100110-173 = "……畢竟大熱天在太陽底下待太久是很危險的。"
