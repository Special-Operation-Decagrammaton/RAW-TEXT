[translation]
90100110-1 = "ตอนที่ 11;ข่าวลือและเรื่องที่เข้าใจยาก"
90100110-2 = "สำนักงานประธานองค์การนักเรียน"
90100110-3 = ""
90100110-4 = "ฉันมีข่าวดีค่ะ หัวหน้ากองยูกิโนะ"
90100110-5 = "ผู้เสียหายเคราะห์ร้ายที่โดนหุ่นไล่กาสีขาว... หรือที่เรียกกันว่า 'คุเนะคุเนะ' เริ่มฟื้นคืนสติแล้วค่ะ"
90100110-6 = "ถ้าไม่นับผู้เสียหายบางส่วนที่บ่นว่าปวดกล้ามเนื้อเล็กน้อยเพราะนอนหมดสติไปเป็นเวลานาน โดยภาพรวมแล้วทุกคนก็มีสุขภาพปกติดีค่ะ"
90100110-7 = "แต่ก็เช่นเดียวกับตอนที่หมดสติไป ทางโรงพยาบาลเองก็ยังไม่รู้สาเหตุว่าทำไมจู่ๆ อาการของผู้เสียหายถึงได้ดีขึ้น..."
90100110-8 = "แต่นี่คงเป็นเพราะกองทหาร FOX ปราบสิ่งลึกลับนั่นได้สำเร็จนะคะ?"
90100110-9 = ""
90100110-11 = ""
90100110-12 = ""
90100110-13 = "ท่านประธานเชื่อในสิ่งที่ระบุไว้ในรายงานที่พวกฉันส่งไปทั้งหมดเลยเหรอคะ?"
90100110-14 = "ค่ะ ก็มันเป็นรายงานที่หัวหน้ากองยูกิโนะเขียนนี่คะ? แถมยังมีการรับรองจากคุณครูของชาเล่ต์อีก..."
90100110-15 = "ฉันไม่มีเหตุผลใดที่จะไม่เชื่อเนื้อหาในนั้นหรอกค่ะ..."
90100110-16 = "ถึงจะบอกในรายงานไปแล้ว แต่พูดตามตรงว่า จนถึงตอนนี้พวกฉันก็ยังไม่เข้าใจอย่างแท้จริงว่า สิ่งที่เผชิญหน้าในปฏิบัติการครั้งนี้คืออะไรกันแน่"
90100110-17 = "[ruby=ตำนาน]ฝ่ายตรงข้าม[/ruby]คือสิ่งที่ไม่อาจเข้าใจได้ ทั้งสาเหตุและวิธีรับมือก็ไม่ชัดเจน"
90100110-18 = "พวกฉันเพียงแค่ลองทุกวิธีที่พอจะทำได้ แล้วบังเอิญโชคดีที่พบวิธีรับมือ ก็เลยคลี่คลายสถานการณ์ได้ก็เท่านั้นค่ะ"
90100110-19 = "ท้ายที่สุดแล้ว ความพยายามนั้นก็ช่วยชีวิตผู้คนไว้ได้มากมายค่ะ"
90100110-20 = ""
90100110-22 = ""
90100110-23 = "ผลลัพธ์... ไม่ใช่สิ่งสำคัญค่ะ"
90100110-24 = ""
90100110-26 = ""
90100110-27 = "ไม่ค่ะ… ฉันไม่ได้หมายความว่าจะปล่อยให้ผู้คนเป็นตายร้ายดียังไงก็ได้"
90100110-28 = "แม้ในคิโวทอสจะเกิดเหตุการณ์ที่อธิบายไม่ได้อยู่บ่อยครั้ง แต่ปรากฏการณ์ลึกลับที่สร้างความเสียหาย#nแก่ผู้คนเป็นวงกว้างแบบนี้ มันแทบไม่เคยเกิดขึ้นมาก่อนค่ะ"
90100110-29 = "หากผู้คนตระหนักได้ว่ามีปัจจัยที่ไม่สามารถควบคุมได้ในชีวิตประจำวัน พวกเขาก็จะตกอยู่ในภาวะวิตก#nกังวลค่ะ พวกเขาจะเริ่มหาตัวคนร้าย หาแรงจูงใจ หาคนมารับผิดชอบ และยิ่งไปกว่านั้น..."
90100110-30 = ""
90100110-32 = ""
90100110-33 = "พวกเขาอาจหันกระบอกปืนมาที่คุณก็ได้ค่ะ"
90100110-34 = ""
90100110-36 = ""
90100110-37 = ""
90100110-38 = "ยูกิโนะ"
90100110-39 = "ลองเดาดูมั้ยคะว่าตอนนี้ดิฉันกำลังคิดอะไรอยู่?"
90100110-40 = "คิดว่าฉันกำลังกังวลเกินเหตุอยู่หรือเปล่าคะ?"
90100110-41 = "ติ๊ด! ผิดค่ะ"
90100110-42 = "ความจริงแล้ว ก่อนที่ยูกิโนะจะเข้ามาในสำนักงาน โอคิเพิ่งเอาขนมที่ฉันไม่เคยเห็นมาก่อนมาฝากค่ะ"
90100110-43 = "พอกินคู่กับชา ฉันก็ได้กลิ่นหอมหวานปนกลิ่นซิตรัสที่คุ้นเคย... แต่บนห่อไม่ได้ระบุส่วนผสมอะไรไว้เลยค่ะ"
90100110-44 = "ถึงจะกำลังคุยกับยูกิโนะอยู่ ในใจฉันก็ยังมัวแต่คิดว่าขนมนั่นทำมาจากอะไรกันแน่ค่ะ"
90100110-45 = "เรื่องนี้ฉันต้องขอโทษด้วยนะคะ"
90100110-46 = "มะ... ไม่เป็นไรค่ะ"
90100110-47 = "ฉันไม่ทันสังเกตเลย... เพราะบางครั้งฉันก็เป็นแบบนั้นเหมือนกันค่ะ"
90100110-48 = "ค่ะ การที่เรื่องเล็กน้อยที่ดูเหมือนไม่มีอะไร กลับวนเวียนอยู่ในหัวเราทั้งวัน เป็น 'เรื่องที่เกิดขึ้นบ่อย' กว่าที่คิดนะคะ"
90100110-49 = "สำหรับเด็กเล็กก็อาจเป็นอีกเรื่อง แต่สำหรับคนที่ใช้ชีวิตอยู่ในสังคม แทบไม่มีใครพูดความคิดเหล่านั้นออกมาตรงๆ หรอกค่ะ"
90100110-50 = "เพราะกลัวว่าจะเสียมารยาทกับอีกฝ่าย หรือกลัวว่าจะถูกมองว่าแปลก"
90100110-51 = "และต่อให้เปิดเผยความรู้สึกที่แท้จริงของตัวเองออกมา ก็ใช่ว่าจะได้อะไรกลับมามากนักค่ะ"
90100110-52 = "ผู้คนต่างใช้ชีวิตร่วมกันโดยเก็บซ่อนความในใจเอาไว้ และท้ายที่สุด มนุษย์ก็ไม่มีวันเข้าใจความในใจ#nของกันและกันได้อย่างสมบูรณ์ค่ะ ความเข้าใจผิดส่วนใหญ่ก็เกิดขึ้นเพราะเหตุนี้ค่ะ"
90100110-54 = "ฉันว่าบางทีปรากฏการณ์ประหลาดในคิโวทอสเอง... ก็อาจเกิดจากการที่ผู้คนไม่อาจสื่อสาร และเข้าใจกันได้อย่างแท้จริงก็ได้ค่ะ"
90100110-55 = "ราวกับเป็นข้อความที่เกิดจากความในใจของผู้คน ซึ่งไม่เคยถูกถ่ายทอดออกมาด้วยคำพูดหรือตัวอักษร"
90100110-57 = ""
90100110-58 = "เป็นสิ่งที่ไม่อาจเข้าใจได้เลยค่ะ"
90100110-59 = "จะบอกว่าภาพหลอนที่ทำให้ผู้คนสับสนและพูดอะไรไม่ออก มีข้อความอะไรแฝงอยู่งั้นเหรอคะ?"
90100110-60 = "ฮุฮุ ข้อความนั้นน่ะ ฉันได้ยินจากปากของหัวหน้ากองยูกิโนะไปแล้วค่ะ"
90100110-62 = "\"ในวันที่อากาศร้อนจัด ควรหลีกเลี่ยงการทำกิจกรรมกลางแจ้ง\""
90100110-63 = "เพียงแค่มี 'คุเนะคุเนะ' อยู่ ก็เพียงพอที่จะเป็นคำเตือนสำหรับผู้คนที่ต้องออกไปข้างนอกในวันที่ร้อน#nอบอ้าวของฤดูร้อนแล้วค่ะ"
90100110-64 = ""
90100110-65 = "เพียงเพราะแค่เรื่องนั้นน่ะเหรอคะ..."
90100110-66 = "ใช่ค่ะ เพียงเพราะเรื่องแค่นั้นเอง"
90100110-67 = ""
90100110-69 = ""
90100110-70 = "หัวหน้ากองยูกิโนะ ฉันยังมีขนมที่พูดถึงเมื่อกี้เหลืออยู่ ถ้าไม่รังเกียจละก็ อยากจะลองสักชิ้นมั้ยคะ?"
90100110-71 = "ถ้าได้ชิมขนมนี้ แล้วลองคิดถึงส่วนผสมของมัน..."
90100110-72 = ""
90100110-74 = ""
90100110-75 = ""
90100110-76 = "บางทีเราอาจเข้าใจกันมากขึ้นอีกนิดก็ได้ค่ะ"
90100110-78 = ""
90100110-79 = "ร้อนจัง..."
90100110-80 = ""
90100110-82 = ""
90100110-83 = ""
90100110-84 = "นี่ นิโกะ ทำไมพวกเราต้องมายืนรออยู่ข้างนอกด้วยล่ะ?"
90100110-85 = "ระหว่างรอให้ยูกิโนะคุยธุระเสร็จ เราเข้าไปรอข้างในอาคารไม่ได้เหรอ?"
90100110-86 = "อ่า เรื่องนั้นน่ะ..."
90100110-87 = "โอ้ เธอนี่กล้าหาญกว่าที่คิดอีกนะ คุรุมิ"
90100110-88 = "ถ้าเข้าไปในอาคารขององค์การนักเรียน แล้วบังเอิญเจอผู้บริหารองค์การนักเรียนที่เคยโดนพวกเรา#nทำร้ายเข้า เธอจะโอเคเหรอ?"
90100110-89 = "อึก... แบบนั้นก็คงลำบากเลย..."
90100110-90 = "ตอนนี้เราก็อยู่ในสถานะพักโทษด้วย ฉันคิดว่ามันคงไม่เหมาะที่จะเข้าไปในอาคารองค์การนักเรียน ที่อาจจะมีคนจำหน้าพวกเราได้กันน่ะ"
90100110-91 = "ถึงจะร้อนไปบ้าง แต่ก็อดทนรออีกหน่อยเถอะนะ"
90100110-92 = "แต่ก็ไม่เห็นจะต้องมายืนรอกลางลานที่แดดเปรี้ยงขนาดนี้เลยไม่ใช่เหรอไง? ไม่ได้อยู่ระหว่างปฏิบัติการสักหน่อย"
90100110-93 = "เราไปนั่งที่คาเฟ่ แล้วดื่มอะไรเย็นๆ ระหว่างรอกันไม่ได้เหรอ?"
90100110-94 = "ไม่ได้หรอก ก็ตอนนี้กระเป๋าสตางค์ที่มีบัตรสนับสนุนปฏิบัติการ ดันอยู่กับยูกิโนะน่ะสิ"
90100110-95 = "ทำไมล่ะ? ปกตินิโกะเป็นคนถือกระเป๋าสตางค์ไม่ใช่เหรอ?"
90100110-96 = "เห็นว่ารายงานปฏิบัติการมีเรื่องการอนุมัติค่าใช้จ่ายรวมอยู่ด้วย... ก็เลยเอาบัตรติดตัวไปด้วยน่ะ"
90100110-97 = "อ่า ถ้างั้นก็ช่วยไม่ได้นะ"
90100110-98 = ""
90100110-100 = ""
90100110-101 = "ร้อนจัง... อยากรีบกลับไปที่ชาเล่ต์แล้ว"
90100110-102 = "ถ้าใครมาได้ยินเข้า คงนึกว่าชาเล่ต์เป็นบ้านของเธอแล้วละ"
90100110-103 = "จะได้ยินก็ได้ยินไปสิ อากาศร้อนขนาดนี้ จะมีคนเดินผ่านไปผ่านมาสักกี่คนกันเชียว..."
90100110-104 = "เอ๋? พวกเธอคือ..."
90100110-105 = "มะ... ไม่ใช่นะ! ฉันหมายถึงอยากกลับชาเล่ต์ต่างหาก ไม่ได้บอกว่าที่นั่นเป็นบ้าน..."
90100110-106 = "พูดเรื่องอะไรไม่เห็นเข้าใจเลย..."
90100110-107 = ""
90100110-109 = ""
90100110-111 = ""
90100110-112 = "ไม่ได้เจอกันนานเลยนะ เด็กพาร์ทไทม์"
90100110-113 = "อ่า คนที่เคยเจอตอนนั้น..."
90100110-114 = "อื้อ ฉันเอริกะจากสถาบันเกเฮนน่าไง ได้มาเจอกันที่นี่ด้วยสินะ"
90100110-115 = "อ่า อะฮะฮ่า... นั่นสินะคะ เป็นเรื่องบังเอิญที่น่าทึ่งจริงๆ เลยนะคะ"
90100110-116 = "ครั้งนี้ก็กำลังทำงานพาร์ทไทม์อยู่อีกแล้วเหรอ? โรงเรียนไฮยาซินธ์อยู่ห่างจากที่นี่ตั้งไกลแท้ๆ"
90100110-117 = "ค่ะ ค่ะ! ฉันกำลังทำงานพาร์ทไทม์กับเพื่อนๆ ค่ะ"
90100110-118 = "คือว่า ตอนนั้น..."
90100110-119 = ""
90100110-121 = ""
90100110-122 = "ขอโทษด้วยค่ะ... จริงๆ แล้วตอนนั้นฉันโกหกน่ะค่ะ MOMOTALK ที่ให้ไปตอนนั้นเป็นบัญชีปลอมค่ะ"
90100110-123 = "อื้อ ก็ว่าอยู่ วันนั้นพอกลับไปลองเช็ก MOMOTALK อีกครั้ง มันก็ขึ้นว่าไม่มีบัญชีนี้อยู่ ทำเอาตกใจหมดเลย"
90100110-124 = "แถมเครื่องดื่มที่ชื่อ <ไฮเปอร์ เอด> ก็ไม่มีอยู่จริงด้วย คิราระถึงกับแตกตื่นอยู่พักหนึ่ง แล้วบอกว่าฉันต้องไปเจอผีมาแน่ๆ"
90100110-125 = "แต่ยังไงก็ไม่ใช่ผีสินะ โล่งอกไปที"
90100110-126 = ""
90100110-128 = ""
90100110-129 = "ต้องขอโทษด้วยค่ะ..."
90100110-130 = "ไม่เป็นไร ไม่มีอะไรต้องขอโทษหรอก"
90100110-131 = "ทุกคนต่างก็มีเรื่องที่ไม่อยากให้ใครรู้กันทั้งนั้น วันนั้นฉันคงบังเอิญไปเจอด้านที่เธอไม่อยากให้ใครเห็น#nก็เท่านั้นเอง"
90100110-132 = "ไม่โกรธฉันเหรอคะ...?"
90100110-133 = "อืม จริงๆ แล้วฉันเองก็ไม่ได้เสียหายอะไร แถมมันยังเป็นประสบการณ์ที่สนุกสำหรับฉันด้วยนี่นา?"
90100110-134 = "คนที่ฉันได้เจอในตอนนั้นคือใครกันนะ? ทำไมถึงมาแจกเครื่องดื่มที่ไม่มีอยู่จริงอยู่ตรงนั้นนะ?"
90100110-135 = "ช่วงหลายสัปดาห์ที่ผ่านมา ฉันสนุกกับการปล่อยจินตนาการโลดแล่นไม่น้อยเลยละ"
90100110-136 = "อีกอย่าง เธอเองก็คงมีเหตุผลของเธอ ฉันไม่อยากโกรธทั้งที่ยังไม่รู้อะไรเลยหรอก"
90100110-137 = "ก็มันมีคำพูดที่ว่า \"ต่อให้เป็นคำโกหก ก็ยังต้องใช้ความทุ่มเทอยู่ดี\" ใช่มั้ยล่ะ?"
90100110-138 = ""
90100110-140 = ""
90100110-141 = ""
90100110-142 = "ขอบคุณที่เข้าใจนะคะ"
90100110-143 = "ว่าแต่ ถ้าไม่มีธุระอะไรต่อ เราแวะไปนั่งคุยกันที่คาเฟ่ข้างหน้าสักหน่อยมั้ย? "
90100110-144 = "เครื่องดื่มผลไม้ผสมโซดาสูตรพิเศษของคาเฟ่ตรงนั้นอร่อยมากเลยละ"
90100110-145 = "พอดีพวกฉันลืมเอากระเป๋าสตางค์มาน่ะ..."
90100110-146 = "อ๋อ ถ้างั้นให้ฉันเลี้ยงก็ได้นะ"
90100110-147 = ""
90100110-149 = ""
90100110-150 = "แต่ถ้ามันทำให้ไม่สบายใจละก็ อย่างน้อยครั้งนี้ก็ช่วยบอกกันตรงๆ เถอะนะ"
90100110-151 = ""
90100110-153 = ""
