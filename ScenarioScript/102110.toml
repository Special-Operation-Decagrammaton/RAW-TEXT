[translation]
102110-1 = "제11화;자치구 방어 작전 - 게헨나"
102110-2 = "이제 저희 차례예요. 준비는 모두 완료되었나요?"
102110-11 = "네, 언제든지 시작할 수 있는 상태예요. 명령 대기중이에요."
102110-12 = "그런데, 아코 쨩. 부장은 어딜 간 거야?"
102110-13 = "히나 부장님은 지금 성소 공략전에 참가하셨어요. 선도부의 대표로 말이에요."
102110-14 = "선도부의 대표로……? 나머지는 다 여기 있는데?"
102110-15 = "자꾸 그렇게 부장님께 의지하려고만 하니까! 게헨나 선도부는 히나만 없으면 오합지졸이라느니, 상대해 볼만 하다느니 그런 소릴 듣는 거잖아요!"
102110-17 = "뭐, 뭐? 난 그냥 부장이 어디 갔냐고 물어보기만 했는데……?"
102110-18 = "자꾸 그렇게 귀찮게 구니까 부장님이 싫어하시는 거잖아요! 이번 기회에 오합지졸이 아니라는 걸 증명하는 거예요, 알겠죠, 이오리!"
102110-19 = "끄응……."
102110-20 = "(……그건 저희가 약한 게 아니라, 부장님이 너무 강해서 생기는 인상이겠지만요.)"
102110-21 = "하아…… 그런데 이런 상황인데도 만마전의 마코토 의장은 대체 뭘 하고 있는 거죠……?"
102110-29 = "후후후후. 고생이 많네, 선도부."
102110-30 = "다, 당신은…… 만마전의 사츠키 의원?"
102110-31 = "네 녀석들……"
102110-32 = "자아, 자아. 진정하라고."
102110-33 = "모처럼 이런 상황인데, 여기서 싸우면 너희가 곤란하지 않아?"
102110-35 = "큭……."
102110-36 = "만마전은 뭐하다가 지금 나타난 거죠? 그리고 마코토 의장은요?"
102110-37 = "응, 마코토 쨩은 지금 아주 중요한 일이 있어서 부재중이야. 뭐, 걔는 신경 쓰지 말고."
102110-38 = "……당신들, 또 무슨 음모를 꾸미고 있는 거죠? 뭘 방해하려고……!"
102110-39 = "아아, 정말이지. 우리를 뭘로 보는 거야? 우리 만마전에게 제일 중요한 게 뭐겠어?"
102110-40 = "무위도식……?"
102110-41 = "바로 유권자들이거든? 지금까지 우린 게헨나 학생들의 안전을 위해서 이리저리 힘쓰고 있었다구!"
102110-42 = "……. 무슨 말도 안 되는 소릴……."
102110-44 = "사실입니다. 행정관."
102110-45 = "세나 부장……?"
102110-47 = "사츠키 의원과 만마전의 인원들이 대피소로 학생들을 유도해 주었습니다. 덕분에 시간을 아낄 수 있었습니다."
102110-48 = "다만, 그 방법이 조금……."
102110-50 = "키라라 쨩, 아까 봤어? 그거?"
102110-51 = "응, 동전에 실 매달아서 흔들흔들? 실제로는 처음 봤어. 그게 최면이라는 거지?"
102110-52 = "응, 그런가 봐. 완전 웃겼어. 전혀 소용없었지만."
102110-53 = "후후후. 어쨌든 재미있어서 따라와 버렸네."
102110-55 = "……최면? 또 무슨 이상한 오컬트 단어가……."
102110-56 = "정말이지, 오컬트가 아니라 과학이거든? 나의 NK 울트라 프로젝트는 말야!"
102110-57 = "뭐, 지금 너희들은 이해하기 어렵겠지만. 후후후, 하지만 이게 완성되면…… 이제 곧 모두가……."
102110-58 = "아니, 헛소리는 이제 됐고!"
102110-62 = "……그래서, 만마전이 여기 온 이유는 저희와 함께 싸우기 위해서, 라고 이해하면 될까요?"
102110-63 = "하하하하! 그럴 리가 없잖아. 그냥 지나가는 길에 응원해 주려고 온 건데?"
102110-72 = "자아, 지금부터 강해진 것 같은 기분이 든다~ 그리고 만마전에 충성을 다하고 싶은 충동이 든다~"
102110-76 = "자아~ 자아~"
102110-85 = "……쳇. 효과 없나."
102110-86 = "……하아."
102110-90 = "게헨나 자치구 방어전, 시작하겠습니다."
