[translation]
13035-3 = "우와아앗-!? 이 녀석들 엄청 강해……?!"
13035-4 = "와장창- 당했어……."
13035-8 = "게다가 포위당했는데…… 이거 납기일이 위험해질지도……."
13035-9 = "핀치- 공사 망했어-"
13035-11 = "뭐야, 이 녀석들. 강한 건지 약한 건지 감이 잘 안 오는데……."
13035-13 = "……일단은 무의미한 전투는 그만하고, 본론으로 들어갔으면 하는데요."
13035-14 = "하이랜더 철도학원이 아비도스에서 뭘 하고 있었던 거죠? 목적이 뭔가요?"
13035-15 = "어느 정도는 알고 있지 않나?"
13035-23 = "감독관-!!"
13035-24 = "헬프- 살해당해 버려- 도와-줘-"
13035-26 = "누구……? 같은 하이랜더 학생……?"
13035-27 = "헤에~ 구하러 온 거야? 같은 편?"
13035-29 = "……. 아니. 딱히 같은 편은 아니야."
13035-31 = "뭐라고?!"
13035-32 = "당했어- 배신당했어-"
13035-34 = "……아니, 일단은 구하러 온 것은 맞지만…… 저 녀석들과 같은 편이라고 생각하진 말아줘."
13035-35 = "나는 아사기리 스오우. 하이랜더 철도학원의 이사회 직속 감리감독관이다."
13035-36 = "감리감독관……?"
13035-37 = "높으신 분들의 심부름꾼 같은 거라고 보면 돼. 그리고 거기 멍청……"
13035-38 = "쌍둥이들은 타치바나 히카리, 노조미. 중앙관제센터(Central Control Center)의 간부들이고."
13035-39 = "즉, 서로 감시하고 속이는 관계 같은 거지."
13035-41 = "맞아! 공사의 적! 납기일을 엉망진창으로 만드는 악당이라고! 감리라는 것들은!!"
13035-42 = "그런데 너 뭔가 말하려다 취소하지 않았어? 뭔가 엄청 기분 나쁜 말을?!"
13035-43 = "끄덕끄덕!"
13035-48 = "우리 학원은 점조직에 가까운 구조라서, 같은 학원이라도 너희들처럼 사이좋게 지내지는 않아."
13035-49 = "각각 관리하는 철도 노선, 지역별로 파벌이 생성되어 있으니까."
13035-50 = "뭐, 어쨌든."
13035-51 = "상황이 이렇게 된 건 일을 순서대로 하지 않은 저 녀석들의 책임이긴 하지만, 감독관으로서 사과하지."
13035-52 = "……."
13035-53 = "하지만 너희들도 대충 눈치채지 않았나? 지금 아비도스의 사막횡단철도의 개발권은 우리에게 있어."
13035-55 = "네?! 아니에요! 그건……."
13035-56 = "그건 네프티스 기업이에요! 하이랜더 학원이 아니라……!!"
13035-58 = "그 말이 그 말이야."
13035-59 = "우리 하이랜더 철도 학원은 기업형 학원이라, 다른 사기업들과 산학협력(industry-academia cooperation)이 흔한 편이야."
13035-60 = "즉, 지금 우리 하이랜더는 네프티스와 같은 권한과 의무를 가지지. 그건 당신도 잘 알고 있지 않아, 이자요이 노노미 아가씨?"
13035-65 = "아는 사람이야?"
13035-66 = "아, 아뇨……. 그치만……."
13035-68 = "아무튼, 지금은 그 멍청이들을 놔주겠어? 정식으로 아비도스 학교에 방문해서 지금 상황을 설명할 테니까."
13035-69 = "……그, 그건."
13035-70 = "……보내줘."
13035-78 = "살았다!"
13035-79 = "무서웠-어-"
13035-80 = "궁금한 게 있다면 정리해 둬. 자세한 이야기는 잠시 후에 하도록 하지."
13035-81 = "그럼 돌아가자."
13035-86 = "가버렸어……."
13035-90 = "……."
13035-91 = "뭐어, 우리도 돌아가자고. 저쪽에서 먼저 상황을 설명하러 온다고 했으니까."
13035-92 = "[ns] 대책위원회실로 돌아간다."
13035-97 = "다음화;흘러간 것들"
