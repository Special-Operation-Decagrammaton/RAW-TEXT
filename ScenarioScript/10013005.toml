[translation]
10013005-1 = "프롤로그;여름은 아직 끝나지 않은 채로"
10013005-9 = "앗, 도착했어요. 선생님!"
10013005-10 = "[s1] \"헬기로 여기까지 데려다줘서 고마워.\"\n[s2] \"아야네도 바쁠 텐데. 수고했어.\""
10013005-13 = "아뇨! 별말씀을요!"
10013005-14 = "모두에게 선생님을 샬레까지 안전하게 모셔 드리고 온다고 약속했으니까요."
10013005-15 = "자, 이러고 있을 게 아니라. 짐을 가지고 얼른 샬레의 사무실로……."
10013005-19 = "어라……? 선생님, 샬레 입구 앞에 누군가가……."
10013005-20 = "[s] \"응?\""
10013005-26 = "어라~ 선생님. 혹시 휴가를 다녀오시는 참이신가요?"
10013005-27 = "후후후~ 그것도 이렇~게나 귀여운 아이와 함께~?"
10013005-28 = "네, 네엣?! 귀, 귀여……?!"
10013005-29 = "어머나~ 마치 카호와 처음 만났을 때가 생각나는 풋풋한 반응~"
10013005-30 = "우후후~ 귀여워라~"
10013005-31 = "[s] \"어라, 니야……?\""
10013005-32 = "니야 씨, 선생님도 그렇고, 타교의 학생분까지 당황하고 계시잖아요. 지금은 따로 급한 일이 있어 찾아뵌 거니까……."
10013005-33 = "실례했네요~ 그냥 무척 재미있는 광경이다 싶어서~"
10013005-34 = "[s] \"거기에 미모리도 함께라니, 의외의 조합……\""
10013005-35 = "잡담은 이 정도로 해두고."
10013005-36 = "선생님. 백귀야행의 학생으로서 정식으로 용무가 있어 찾아뵈었답니다~"
10013005-37 = "우와아앙~! 선생님! 큰일이 나버렸습니다!"
10013005-38 = "부장이……! 부장과 우미카가……!"
10013005-39 = "[s] \"피나까지, 무슨 소리야? 시즈코에게 무슨 일이라도 생긴 거야?\""
10013005-40 = "그게…… 아무래도 시즈코 쨩이 곤경에 처한 모양이에요."
10013005-41 = "[s] \"알았어. 그럼 일단 백야당으로 가서 시즈코에게 자세한 이야기를…….\""
10013005-42 = "아, 시즈코 양이라면 지금 백야당에 없답니다."
10013005-43 = "부장은 바다에 갔습니다!"
10013005-44 = "[s] \"……바다?\""
10013005-45 = "네, 전해 듣기로는 현재 마츠리부의 부장이 가 있는 곳의 이름이 분명……."
10013005-46 = "……<로스트 파라다이스 리조트> 라고 하는 곳이었던가요?"
10013005-47 = "[s] \"<로스트 파라다이스 리조트>……? 어디선가 들어본 듯한…….\""
10013005-49 = "저희가 있던, 그곳…… 말인가요?"
10013005-50 = "[s] \"……응?\""
10013005-55 = "네! 여러분, 도착했어요."
10013005-58 = "응. 도착했어~"
10013005-59 = "이곳이로군요. <로스트 파라다이스 리조트>라는 곳이……."
10013005-60 = "정확히 말하자면 조금 다르지만요……."
10013005-61 = "[s] \"아비도스 건으로 바쁠 텐데, 고마워. 아야네가 데려다줘서 살았네.\""
10013005-62 = "네? 아, 아뇨. 저도 마침 돌아가 봐야 했으니까요. 이렇게 선생님과 다시 같이 오게 될 줄은 몰랐지만요……."
10013005-66 = "모두 무사히 도착하신 모양이네요~♪"
10013005-67 = "[s] \"그러는 니야는 정작 오지 않았지만 말이야…….\""
10013005-68 = "냐하핫~ 물론 저와 여름 바다를 거닐고 싶어하시는 선생님의 뜨~겁고 열렬한 마음은 이해하지마안~"
10013005-69 = "저 니야, 음양부 부장된 몸으로서 함부로 자리를 비울 순 없기에"
10013005-70 = "대신이랄까. 그 자리엔 치세와 미모리 씨도 함께 계시옵사오니, 제게 보내주실 애정은 그 두 분에게 전달 부탁드리옵지요~"
10013005-71 = "[s] \"뭐, 그런 걸로 해두자.\""
10013005-72 = "아하하……."
10013005-73 = "응, 니야 부장 대신, 힘낼게-"
10013005-75 = "선생님! 죄송합니다-! 피나도! 마음 같아선 부장이 위기란 걸 알고, 그곳까지 함께 달려가고 싶었지만!"
10013005-76 = "피나에겐……! 백야당의 구역을 지켜야 하는 사명이……!"
10013005-77 = "[s] \"으응, 괜찮아. 여긴 우리에게 맡겨줘.\""
10013005-78 = "네! 선생님……! 아니! 두목!"
10013005-79 = "마츠리 부의 부장이라면, 그곳에 있는 <바다의 집>에 있을 거예요."
10013005-80 = "[s] \"<바다의 집>이란 말이지…….\""
10013005-89 = "[ns] \"으, 응?!\""
10013005-90 = "선생님! 저쪽에서 소란이에요!"
10013005-94 = "가, 강해! 역시나 이것이 <로스트 파라다이스 리조트>에서 리조트 사냥을 기획한 흑막의 힘인가!"
10013005-95 = "우습게 볼 수 없구나! 백귀야행 학원의 마츠리운영관리부!"
10013005-97 = "그! 러! 니! 까! 당신네들이 무슨 소리를 하는지, 전혀 모르겠다니까?!"
10013005-98 = "맞아요! 갑자기 쳐들어와서 장사를 방해하기나 하고!"
10013005-99 = "오늘만 해도 벌써 다섯 번째 습격이에요!"
10013005-101 = "이런 와중에도 모른 척하기라니 역시 뒤로 음흉한 꿍꿍이를 가진 흑막답군!"
10013005-103 = "지금은 비록 후퇴하지만! 우리가 이대로 끝날 거라고 생각하지 마라!"
10013005-107 = "뭔가…… 이겼는데도 전혀 개운한 기분이 아니야?!"
10013005-108 = "[s] \"시즈코?\""
10013005-110 = "시즈코 쨩……!"
10013005-111 = "안녕~~ 너구리 씨~~"
10013005-116 = "앗?! 선생님이랑…… 다른 사람들까지?"
10013005-117 = "주군!"
10013005-118 = "샬레의 선생님께서 방문을?"
10013005-119 = "[s] \"저기…… 무슨 일이 있는 거야?\""
10013005-120 = "으……."
10013005-121 = "우와아앙~! 선생님~! 하루 종일 진짜 난리도 아니었어요-!"
10013005-123 = "백야당 로스트 파라다이스 리조트 지점"
10013005-124 = "주군께서 직접 찾아와주시다니-!"
10013005-125 = "앗! 혹시 이즈나의 활약을 지켜보러 오신 건가요?! 닌닌!"
10013005-126 = "[s] \"따로 볼일이 있었달까……. 이즈나까지 여기 있는 건 좀 의외네.\""
10013005-127 = "이즈나는 시즈코 공의 부탁으로 호위 임무를 진행하고 있었어요!"
10013005-128 = "필시! 시즈코 공이 미래에 키보토스 최강의 닌자가 될 이즈나의 가능성을 알아본 거예요!"
10013005-129 = "응……?"
10013005-130 = "아니, 난 그냥 닌자의 가능성에 대해 좀 깨달았달까"
10013005-131 = "홍보 효과를 위해서라고 할까."
10013005-132 = "네엣?! 이즈나의 진가를 알아보고 닌자로서 임무를 맡긴 게 아니었나요!?"
10013005-133 = "(시무룩)"
10013005-134 = "[s] \"이즈나는 귀엽고 멋지니까. 아르바이트생도 어울려!\""
10013005-135 = "앗?! 주군?! 그런 건가요?! 에헤헷-!"
10013005-137 = "[s3] \"그건 그렇고 니야와 피나에게 들었어.\"\n[s4] \"백야당의 모두가, 시즈코랑 우미카가 곤경에 처한 것 같다고.\""
10013005-141 = "앗~ 말씀대로 곤경이라면 곤경이겠네요~ 그도 그럴게~"
10013005-142 = "……선생님! 벌써 다섯 번이에요! 고작 반나절 만에 문제아들에게 습격을 받은 횟수가!"
10013005-143 = "[s] \"그건 고생이었겠네…….\""
10013005-144 = "네~ 오늘 가게를 오픈하자마자, 문제아분들이 몰려들어서는 <최종 권리자를 쓰러트리겠다>라느니, <리조트 사냥이다!> 라느니 하면서 외치시던 게"
10013005-145 = "혹시 제가 모르는 축제의 일종이었던 걸까요?"
10013005-146 = "아니아니아니! 그럴 리 없지!"
10013005-147 = "[s] \"주최자…… 거기에 리조트 사냥이라면…….\""
10013005-149 = "저기……."
10013005-153 = "혹시 시즈코 씨도 <리조트 사용권>에 당첨되어서 여기 오신 건가요?"
10013005-154 = "응? 아니, 우리는……."
10013005-155 = "후후- 저희 마츠리운영관리부는 이곳 <로스트 파라다이스 리조트의 사용권>을 정식으로 구매해서 찾아왔어요!"
10013005-156 = "네. 어디까지나 사업의 일환으로……."
10013005-157 = "[s] \"당첨이 아니라 구매……? 그 허점투성이의 계약서를……?\""
10013005-158 = "네? 허점투성이……? 무슨, 말씀이신가요?"
10013005-159 = "[s] \"응?\""
10013005-160 = "……??"
10013005-165 = "……저기 뭔가, 아무래도 서로 오해가 있는 모양이에요."
10013005-166 = "아야네 양. 알고 계신 게 있지 않으신가요?"
10013005-167 = "선생님과 먼저 이곳에 계셨다고 들었는데요."
10013005-168 = "저기, 그게 말이죠. 저도 이걸 어떻게 설명해야 할지……."
10013005-169 = "선생님께선 이미 이곳에 와 계셨다……?"
10013005-170 = "[s] \"일단 시즈코. 이곳 군도 전체에서 <리조트 사냥>이란 게 일어나고 있어.\""
10013005-171 = "수영복 불량배들이 말했던, 그거 말인가요……?"
10013005-172 = "계약서에 허점이 있어서, 그 권리를 가졌다고 주장하는 사람들이 모두 이 군도에서 치고받고 싸우고 있다……?"
10013005-173 = "(여전히 혼란스러워하는 시즈코를 위해, 현재 이곳에서 벌어지고 있는 일에 대한 자세한 내막을 설명하기 시작했다.)"
10013005-174 = "[s] \"시즈코가 가지고 있는 사용권엔 이런 조항이 있을 거야.\""
10013005-176 = "(본 계약서의 계약자는, <로스트 파라다이스 리조트>의 '사용 권한'을 얻는다.)"
10013005-177 = "(상기한 '사용 권한'이란 리조트의 모든 토지, 물품 및 설비 일체의 권한과 그로 인해 창출된 모든 수익과 자원 또한 소유할 수 있는 것으로서)"
10013005-178 = "(계약서의 소유자는 그 모든 권리를 '절대적'으로 보장받는다.)"
10013005-179 = "……네. 이건 계약서니까. 그건 당연한……"
10013005-180 = "[s] \"문제는 그 계약서, 수영복 불량배를 포함해 가지고 있는 사람이 더 있을 거야.\""
10013005-181 = "(아비도스에서 세리카가 당첨되어 그 <리조트 사용권>을 가지게 된 일, 그리고 헬멧단 또한 같은 걸 가지고 있었단 사실을 이야기했다.)"
10013005-182 = "(그리고 그것이 처음엔 마치 섬 하나에 국한된 사용권처럼 포장되었지만, 실제로는 이곳 <로스트 파라다이스 리조트> 군도 전체의 권리를 포함하고 있는 계약서란 것까지 전부.)"
10013005-183 = "즉 선생님의 말씀대로라면, 이곳 <로스트 파라다이스 리조트>에는 저희 말고도 같은 계약서를 가진 다수의 분들이 모여 있고."
10013005-184 = "계약서의 허점을 뒤늦게 깨닫고는, 각자 서로가 가진 걸 빼앗기 위해 <리조트 사냥>이라는 이름으로 와장창하고 있단 말씀이로군요?!"
10013005-185 = "아니아니아니, 저기, 영문을 모르겠는……데요? 그보다 선생님은 어떻게 그런 걸-"
10013005-186 = "[s] \"바로 직전까지 아야네랑 현재진행형으로 그 사건에 휘말리고 있었거든.\""
10013005-190 = "[ns] (그러고 보면 아직 아비도스 아이들도 이 군도에 있을 텐데……)"
10013005-197 = "앗! 또 적습인가요?!"
10013005-202 = "우와아앙~! 이걸로 여섯 번째라구?! 이번엔 또 누구얏?!"
10013005-208 = "이리 오너라~"
10013005-209 = "모두 다 함께 등장이에요☆"
10013005-210 = "[s] \"앗, 잠깐?! 너희들……?!\""
10013005-212 = "드디어 찾았어! 이 <리조트 사냥>의 원흉!"
10013005-213 = "너희가 백귀야행 학원의 마츠리운영관리부지?! 우릴 속이고 고생시킨 대가를 톡톡히 치르게 해주겠어!"
10013005-214 = "응. 정의의 심판이야."
10013005-215 = "후후☆ 정의의 심판이에요~"
10013005-217 = "그럼 모두~ 해치울까~?"
10013005-218 = "간다앗!"
10013005-220 = "아…………"
10013005-221 = "아아아앗?! 서, 서, 선배들?!?!"
10013005-227 = "[ns] \"……이젠 대체 뭐가 뭔지…….\""
10013005-233 = "그러니까……"
10013005-234 = "이게 대체 무슨 상황인 거냐구우우우?!?!"
