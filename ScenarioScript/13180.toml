[translation]
13180-1 = "제18화;혼란과 혼란"
13180-13 = "하하하. 이걸로 겨우 시원해졌네요."
13180-18 = "이, 이럴 수가……. 우리가 준비한 병력을 저, 전부……."
13180-19 = "카이저PMC의 힘이 이렇게나……."
13180-20 = "말도 안 돼!! 네프티스가 카이저와 손을 잡았다고?!"
13180-21 = "무슨 말도 안 되는 소리야, 이게! 둘은 원수지간이잖나?!"
13180-23 = "뭐, 맞습니다. 그랬었죠."
13180-24 = "하지만 카이저가 아무런 대가 없이 <사막횡단철도>의 채권을 내놓았을 거라고 생각한 겁니까?"
13180-25 = "저희와 물밑에서 거래를 해왔기 때문에 그런 게 가능했던 겁니다."
13180-26 = "그, 그렇다고 해도 자신들의 영애님을 인질로 잡고 아비도스를 협박하다니!"
13180-27 = "아뇨, 말해두겠지만, 저희는 영애님에게 딱히 불만이 있는 것은 아닙니다."
13180-28 = "네프티스가 계속 모셔야 할 분인데 그럴 리가 없잖습니까?"
13180-29 = "다만 기업이 모시는 만큼 영애님 또한 기업에게 지불해야 할 의무가 있는 것뿐이죠."
13180-30 = "그러니 타카나시 호시노가 여기까지 무사히 도착해서 취소 선언을 해주기만 하면 모든 게 다 해결되는 겁니다."
13180-31 = "그러면 영애님은 졸업 때까지 아비도스에 남아서 행복한 생활을 이어갈 수 있을 테고, 저희는 열차포의 소유권을 얻게 되는 거구요."
13180-33 = "네프티스……? 카이저가 아니라?"
13180-34 = "흐음? 카이저는 열차포에 관심 없습니다만. 그러니 저희와의 거래에 응했겠죠."
13180-35 = "그러고 보니 제가 배신할 거란 정보는 어떻게 미리 안 겁니까?"
13180-36 = "그, 그건……."
13180-38 = "내가 알려줬으니까."
13180-39 = "스오우……?!"
13180-45 = "무슨 소릴……?! 서, 설마!! 우릴 배신한 겁니까!"
13180-47 = "아니, 아니. 그건 아닐세."
13180-57 = "카, 카이저 프레지던트……?!"
13180-63 = "이 친구는 원래 카이저 PMC 소속이니까 말일세."
13180-64 = "전(前) PMC라고 해줘. 지금은 은퇴했으니까."
13180-66 = "스오우……!! 학원 없이 떠도는 불량배 따위를 구해줬더니……! 은혜를 이렇게……!"
13180-68 = "당신들이 도움을 준 건 하나도 없었잖아?"
13180-69 = "자아 자아, 바쁘니까 우정을 나누는 건 다음에 하세나. 지금은 일을 해야지."
13180-70 = "처리해라."
13180-95 = "으, 으으……."
13180-96 = "크, 크윽……."
13180-98 = "수고 많았네 제군들. 덕분에 채권으로 큰 이익을 낼 수 있었다네."
13180-99 = "하지만 웬 굴러들어 온 횡재인가 했는데 역시 세상에 공짜 점심은 없는 법인가 보군."
13180-100 = "프레지던트. 이게 그 정보입니다."
13180-101 = "어디."
13180-105 = "후후. 열차포라. 재미있군."
13180-106 = "왜 미리 얘기해주지 않았나. 이런 멋진 게 아비도스에 숨겨져 있었다고 말야."
13180-108 = "으윽……."
13180-114 = "열차포라…… 그 우주 전함처럼 황당무계한 것이 아니어서 오히려 더 실감이 난달까."
13180-115 = "전략부의 분석대로라면, 이것은 확실히 비대칭 전력 병기가 될 수 있을 거라고 합니다."
13180-116 = "그렇군. 그 검은 양복과도 연락이 끊긴 지 오래. 이제 새로운 힘을 얻을 방편은 없다고 생각했는데. 이거라면……."
13180-117 = "네. 이것이 있다면…… 전에 하지 못했던 그것을……."
13180-118 = "……그런가. 아직 폐기되지 않고 남아 있는 게 있었나. 그 뇌제의 유산이."
13180-119 = "좋아. 열차포는 우리가 가진다."
13180-121 = "뭐?!"
13180-128 = "지금 당장 측량반을 보내서 <열차포>의 은닉 장소를 찾아내도록. 사막횡단철도의 노선 어딘가에 있을 거다."
13180-129 = "알겠습니다."
13180-130 = "아니, 열차포를 찾아낸다고 해도 그 소유권은 당신들에게 없습니다!"
13180-131 = "흐음?"
13180-132 = "카이저는 채권을 <사모펀드>에게 팔아버렸으니까!"
13180-133 = "따라서 열차포의 권리는 전 학생회장이 남긴 계약서를 어떻게 처분하느냐에 따라 결정될 뿐입니다! 카이저가 아니라!"
13180-134 = "이런이런. 나를 어떻게 생각하는 건가. 자네."
13180-135 = "나에게 계약서와 법리 해석을 가르치려는 건가? 이 카이저 코퍼레이션의 총수에게?"
13180-136 = "그, 그러니……"
13180-137 = "내가 그 속셈을 모를 거라고 생각하나? 자네들이 왜 사모펀드를 구성해서 채권단 총회를 열었는지?"
13180-139 = "으, 으으……."
13180-140 = "내가 자네들 대신 한번 설명해 보겠네."
13180-141 = "이 총회를 통해 확정할 수 있는 미래는 모두 세 가지가 있었을 걸세."
13180-142 = "첫째. 매매계약의 주체인 <아비도스 학생회>의 대표가 12시 전까지 총회에 참석해서 과거의 매매 계약을 유지하겠다는 공증을 한다."
13180-143 = "그럼 이 매매계약은 계속 효력을 유지하고, 열차포는 계약 주체인 <아비도스 학생회>로 넘어가겠지."
13180-144 = "이건 자네들이 절대 바라지 않는 미래겠지만 말일세."
13180-146 = "……."
13180-147 = "……."
13180-149 = "둘째. 매매계약의 주체인 <아비도스 학생회>의 대표가 와서 사실 이 학생회는 권한이 없는 가짜였다는 것을 고백하고 매매 계약이 원천 <무효>였다는 것을 공증한다."
13180-150 = "그럼 열차포의 권리는 계약 이전의 소유자였던 <네프티스>에게로 넘어갔겠지."
13180-151 = "이게 바로 네프티스가 원했던 미래였겠지. 안그런가?"
13180-152 = "……."
13180-153 = "그걸 위해 자신들의 영애를 납치해서 호시노에게 협박을 하기까지…… 이야, 이건 솔직히 나도 감탄했다네."
13180-154 = "나보다도 더 제대로 된 기업가의 모습이 아닌가. 기업이 모시던 영애를 납치한다고? 하하하하. 정말 대단하군."
13180-155 = "그, 그건……."
13180-156 = "이야, 역시 아비도스 출신은 다르다고 할까. 그 네프티스도 할 때는 해주는구만. 이건 정말 재미있었다네."
13180-157 = "……으윽."
13180-158 = "그리고 셋째. 계약서의 효력이 종결되는 오늘 12시까지 계약 주체인 <아비도스 학생회>의 대표가 총회에 출석하지 않거나,"
13180-159 = "혹은 출석해서 계약을 유지하지 않겠다는 입장을 표명한다."
13180-160 = "……이렇게 되면 계약 주체의 의지에 따라 이 매매 계약은 이대로 <종결>되었다는 것을 공증하게 되겠지."
13180-161 = "매매 계약의 종결 즉시 열차포는 <아비도스 기반 시설>으로서의 지위를 되찾으며, 따라서 자동적으로 DLB채권의 담보물로 재설정된다."
13180-163 = "그러면 [ruby=・]현[/ruby][ruby=・]재[/ruby] DLB채권을 소유하고 있는 <사모펀드>에게 그 소유권이 넘어가게 되는 거지."
13180-164 = "이게 바로 <사모펀드>가 목표로 했던 미래겠지."
13180-171 = "각자 푼돈을 모아서 고용한 용병들로 여기를 12시까지 지킨 이유도 이것이고."
13180-172 = "……하지만 그럼 이런 의문이 들지 않나? 왜 굳이 총회가 필요했던 것일까?"
13180-173 = "매매계약서는 2년의 유예 기간이 지나버리면 효력이 상실되는 것은 분명하잖아."
13180-174 = "그렇다면 굳이 이렇게 번거롭게 채권단 총회를 열어서 <공증>이란 행위를 하지 않더라도 12시가 지나면 되는 건데……."
13180-175 = "왜 굳이 <사모펀드>는 이렇게 채권단 총회를 열어서, 아비도스에 찾아가 개최 사실을 알려주기까지 한 걸까?"
13180-176 = "왜 자네들은 이렇게 <공증>이라는 행위에 집착한 걸까?"
13180-181 = "……너희는 나중에 우리가 열차포의 존재를 알게 되었을 때를 두려워했던 거다."
13180-183 = "……그건."
13180-185 = "그래서 총회를 열어 공증을 받는 행위로 그것을 미연에 방어하려고 했던 거야."
13180-186 = "그렇지? 사모펀드 여러분? 내가 두려워서 이런 짓을 벌인 거잖나? 응?"
13180-192 = "하하하, 내가 정곡을 찔렀나?"
13180-193 = "하하하하하하하하!"
13180-195 = "자. 그럼 수고 많았네, 제군들. 이제 여기를 주목해 주시게."
13180-201 = "이, 이건……? 이 서류는……?"
13180-202 = "이, 인수합병 동의서?! 내 ZYAKO흥업의……?"
13180-203 = "전당포연합이 카이저 그룹의 자회사로 협입된다고……?"
13180-205 = "그렇다네. 지금부터 내가 자네들의 회사를 인수할 걸세."
13180-206 = "아, 물론 가격은 후하게 쳐줄 걸세. 1000엔 어떤가?"
13180-208 = "뭐, 뭐라고?!"
13180-209 = "무, 무슨 말도 안 되는 소리를……!!?"
13180-216 = "으, 으으……."
13180-217 = "자아, 걱정하지 말게나. M&A는 나의 특기라네. 우리 카이저가 수도 없이 반복해 온 게 바로 이거거든."
13180-220 = "카이저의 엠블럼이 왜 문어인지 아나?"
13180-223 = "문어발처럼 수많은 자회사를 거느리고 있기 때문이지. 하하하하-!"
13180-224 = "자아, 금방 끝날 걸세. 눈 깜빡할 사이에 자네들은 우리 카이저 그룹의 일원이 되는 거지."
13180-225 = "자아, 동의해 주겠나? 펜은 여기 있네."
13180-226 = "이, 이런 폭거를……."
13180-227 = "……이럴 수가. 애초에 이 일에 손을 대는 게 아니었어……."
13180-235 = "좋아, 다 정리되었군. <사모펀드>의 구성원들 대부분이 마침내 카이저 그룹의 일원이 되었어! 축하할 일이지 않은가?"
13180-236 = "이걸로 <사모펀드>는 내 것이 된 거야. 아, 그러니 채권단 대표도 내가 맡도록 하지. 문제 있나?"
13180-238 = "으…… 으으……. 아, 알겠습니다……."
13180-240 = "자아, 그럼 수고 많았네, 제군들."
13180-241 = "적당히 한쪽 구석에 찌그러져 있게나. 총회가 끝날 때까진 자리를 지켜줘야 하니까."
13180-255 = "……정리하자면 12시까지 이곳을 지켜내면 열차포는 내 소유가 된다, 그거군."
13180-256 = "뭐, 그거 말고도 열차포를 빼앗을 방법은 많이 있긴 하지만, 지금은 사모펀드가 깔아놓은 이 판이 가장 깔끔해 보이는군."
13180-257 = "좋아. 어울려주도록 할까. 제너럴. 12시까지 아비도스의 진격을 막아내라."
13180-258 = "알겠습니다."
13180-260 = "방심하지 마라. 특히 그 타카나시 호시노는 검은 양복이 탐내던 인재다. 분명 평범한 녀석은 아닐 거야……."
13180-262 = "걱정하지 마십시오. 프레지던트. 저는 방심하다가 실패하는 머저리와는 다르니까요."
13180-264 = "과연! 내가 신뢰하는 인재야. 그럼 맡기겠네!"
13180-266 = "네."
13180-271 = "……준비해라, 출격한다."
13180-275 = "그럼 남은 사원들은 열차포가 숨겨진 위치를 찾아내도록. 시간은 걸릴 테지만 우리의 정보력으로는 불가능하진 않을 거다."
13180-276 = "네! 알겠습니다!"
13180-280 = "그럼 확인해 보도록 할까. 아비도스의 실력을."
13180-286 = "어, 어째서 보스에게서 연락이 오지 않는 거지?"
13180-287 = "뭔가 상황이 이상하게 돌아가고 있는데?"
13180-291 = "저, 저기……!?"
13180-302 = "좋아. 잔챙이들은 정리하고 여기에 진지를 구축한다."
13180-303 = "샬레와 아비도스의 진격을 막는 거다!"
13180-310 = "현재 시각 AM. 10 : 4X"
13180-313 = "주변에 새로운 병력 확인! 카, 카이저 PMC예요!"
13180-314 = "카이저PMC……?"
13180-315 = "중앙역 쪽으로 대규모의 PMC병력들이 몰려들고 있어요……! 봉쇄 중인 사모 펀드의 병력과 교전 중!"
13180-316 = "뭐, 뭐가 어떻게 돌아가고 있는 거야……."
13180-318 = "사모펀드 사이에 내분이 일어난 건가?"
13180-319 = "아뇨…… 카이저는 애초에 참가하지 않았는데…… 잘 이해하긴 힘들지만 뭔가 상황이 바뀌고 있는 것 같아요."
13180-320 = "게다가……"
13180-325 = "어라?!"
13180-331 = "우-와- 큰일 났-어-"
13180-332 = "이, 이거 대체 무슨 일이야……. 철도 공사는 포기하고 도망쳐야 하는 상황……?"
13180-333 = "도망- 못 갈듯-?"
13180-335 = "사모펀드의 병력 확인!"
13180-337 = "히, 히익!"
13180-338 = "살려주세요! 저, 저희는 아무것도 몰라요!"
13180-340 = "근처 폐쇄 역에서…… 하이랜더 학원이 카이저에게 포위당해 있어요?"
13180-342 = "뭐어? 그 녀석들이?"
13180-343 = "호시노 선배는?"
13180-348 = "카이저?"
13180-355 = "후후후. 드디어 찾았군. 타카나시 호시노."
13180-361 = "……비켜!!"
13180-368 = "카이저 PMC의 특수부대원들이에요!! 호시노 선배가……!"
13180-369 = "선생님. 어떡하지?"
13180-370 = "[s1] \"괜찮아. 상대가 제너럴이라면 호시노는 문제없을 거야.\"\n[s2] \"우리는 하이랜더를 구하러 가자.\""
13180-375 = "현재 시각 AM. 10 : 5X"
