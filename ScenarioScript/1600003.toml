1600003-63 = "(총탄에 터진 화분에서 날아든 진흙과 잎파리가 얼굴 한가득 튀어 덮쳤다.)"
1600003-64 = "(시야가 완전히 가려져 있다. 앞이 보이지 않는다.)"
