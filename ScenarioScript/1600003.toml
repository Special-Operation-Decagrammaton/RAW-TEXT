[translation]
1600003-1 = "잘못된 소통"
1600003-2 = "서, 선생님! 저, 정말로 와주셨군요……!"
1600003-3 = "그, 그…… 우선 와 주셔서 감사합니다…… 저 같은 것의 부탁에도 이렇게 친절하게……"
1600003-4 = "그…… 다름이 아니라…… 저번의 일도 있고 제 나름대로 보답을……"
1600003-5 = "아, 아닙니다. 시간도 바쁘실 텐데 질질 끄는 민폐를 끼칠 순 없겠죠…… 바, 바로……"
1600003-8 = "바, 바로…… 드리겠습니다…… 이거…… 상납품입니다……"
1600003-9 = "[s] \"……화분?\""
1600003-10 = "네, 네…… 잡초 화분입니다…… 제가 만든…… 받아주세요……"
1600003-11 = "……"
1600003-12 = "여, 역시 죄송합니다……! 다시 생각해 보니 쓸 데도 없고 값어치도 없는 물건인데……!"
1600003-13 = "이, 이딴 것도 선물이라고……!!"
1600003-14 = "죄송합니다죄송합니다죄송합니다죄송합니다죄송합니다죄송합니다죄송합니다……"
1600003-15 = "……네?"
1600003-16 = "잘 꾸며진 거 같아서 좋으시다고요……? 저, 정말이신가요……?"
1600003-17 = "……그것보다 왜 꽃이나 다른 게 아닌 잡초를 가꾸었냐고요?"
1600003-18 = "그, 그건……"
1600003-19 = "헤, 헤헤…… 그건…… 제 취미가 잡초를 가꾸는 것이라……"
1600003-20 = "잡초는…… 보다 보면 약간의 그…… 동질감도 느끼고…… 저 같아서……"
1600003-21 = "딱히 쓸 데도 없고…… 다른 분들 귀찮게 하고 민폐만 끼친다거나……"
1600003-22 = "무가치한 주제에 여기저기서 얼굴 들이미는 거라든가…… 그런 부분들이……"
1600003-23 = "저, 저랑 닮은 거 같아서…… 보고 있으면…… 전우애……가 느껴진달까……"
1600003-24 = "[s1] \"그렇지만 지금 이렇게 예쁜 걸.\"\n[s2] \"시원한 느낌도 들고, 좋지 않아?\""
1600003-25 = "……ㄴ, 네?"
1600003-26 = "……ㄴ, 네?"
1600003-27 = "서, 선생님…… 그게 무슨 말씀……"
1600003-28 = "[s3] \"항상 한 결 같은 점도 나는 마음에 들고.\"\n[s4] \"늘 주변에 있을 수 있다는 것도 장점이고.\""
1600003-29 = "……"
1600003-30 = "……"
1600003-31 = "……선생님……?"
1600003-34 = "(무, 무슨 말씀을 하시는 거지……? 서, 설마 내, 내 이야기……?)"
1600003-35 = "(서, 선생님께서…… 내 칭찬을 해 주고 계신 건가, 지금……!?)"
1600003-36 = "(아, 아냐…… 그럴 리가 없잖아, 이 멍청한 버러지……! 또 혼자 착각이나 해대고……!)"
1600003-37 = "(……그치만…… 그치만……)"
1600003-38 = "(그치만 이렇게 둘 밖에 없는 데에서 하신 말씀이라면…… 어쩌면 분명히……!)"
1600003-39 = "(맞을지도……!!)"
1600003-40 = "……부스럭."
1600003-41 = "……?"
1600003-42 = "부스럭 부스럭. 꼬물꼬물……"
1600003-43 = "……버…… 벌레……?"
1600003-44 = "화분 흙속에서…… 벌레들이……"
1600003-45 = "……"
1600003-46 = "……못……해……요."
1600003-47 = "용서 못 해요…… 누가 허락했죠……? 누가 그 자리에 들어가도 된다고 했죠……?"
1600003-48 = "선생님께 드릴 상납품 속에…… 멋대로 자리를 틀고 앉아 있다니……!"
1600003-49 = "용서 못 해……"
1600003-50 = "[s] \"……하루카?\""
1600003-51 = "용서못해용서못해용서못해용서못해용서못해용서못해……!"
1600003-52 = "[s] \"하루카 잠깐……\""
1600003-53 = "죽여드리겠어요 벌레자식분들-!!"
1600003-55 = "철컥! 타아앙-!!"
1600003-56 = "콰지직!!"
1600003-57 = "철퍽!"
