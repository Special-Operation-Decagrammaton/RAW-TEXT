1600003-67 = "(……?)"
1600003-68 = "(……다시 눈을 떴을 땐, 이미 하루카의 모습을 어디에서도 찾아볼 수 없었다.)"
1600003-69 = "(그리고 바닥에는 박살 난 화분조각과 진흙, 벌레들이 흩뿌려져 있을 뿐이었다.)"
