[translation]
10008080-1 = "제8화;위기일발! 2"
10008080-8 = "[ns] \"계속해서 끊임없이 몰려들고 있어.\""
10008080-9 = "흐응~ 이대로는 끝이 없겠는데?"
10008080-10 = "아루 쨩? 어떡할 거야?"
10008080-11 = "아, 아루 님……!"
10008080-12 = "저기, 이거 너무 많지 않아……?"
10008080-13 = "밸런스 붕괴인가 뭔가 하는 거 아냐……?"
10008080-15 = "하하!"
10008080-16 = "키보토스의 뒷골목을 주름잡고 있는 저희 검은거북파에게, 이 정도는 아무것도 아닙니다!"
10008080-26 = "우, 우와앗!!"
10008080-27 = "더, 더는 무리야!"
10008080-28 = "……크윽."
10008080-36 = "흐음. 이쪽은 대강 정리가 되었군요."
10008080-37 = "보스! 큰일입니다! 전투 중에 혼란을 틈타 카이텐져가 전부 도주했습니다!"
10008080-38 = "아아~ 그런 거라면 내버려 둬도 괜찮습니다. 어차피 새전함은 다시 우리 손에 들어온 참이고……."
10008080-39 = "뭣보다 여전히 카이텐져가 새전함을 가진 줄로 알고 있는 멍청이들은 다시 그 뒤꽁무니를 쫓을 테니 한동안 눈속임 역할도 맡아줄 테지요."
10008080-40 = "그 사이에 저흰 예정대로 사업을 마무리하면 그만입니다. ……남은 건, 여기 쓰러져 계신 분들의 처우입니다만."
10008080-41 = "[s] \"이런 짓을 해봤자 금세 꼬리가 잡힐 거야.\""
10008080-42 = "하하하! 말씀하신 대로 꼬리는 언젠가 잡히게 되겠지요. 하지만 그 전에 도망치면 그만 아니겠습니까?"
10008080-43 = "여기에서 정체를 들켰다 한들, 다음번엔 다른 지역을 찾아가 판을 깔면 그만입니다."
10008080-44 = "다음은 어디로 할까요? 백귀야행? 와일드헌트?"
10008080-45 = "아하. 순진한 아가씨들로 가득한 트리니티도 좋겠지요."
10008080-47 = "와오- 자신만만하네?"
10008080-48 = "그야 당신들처럼 SNS에서 빌면 이루어진다는 바이럴 마케팅 같은 걸 믿어주는 바보들이 세상천지에 가득한 이상."
10008080-49 = "……!!"
10008080-50 = "이 장사는 불패의 장사입니다. 앞으로도 얼마든지 계속할 수 있지요! 하하하!"
10008080-51 = "보스! 새전함을 전부 차에 실었습니다!"
10008080-52 = "그럼 저희는 이만 돌아가 볼까요? 새해 첫 아침이 찾아오기 전에 일을 마무리하려면 서둘러야겠지요."
10008080-53 = "자, 잠깐! 기다려……!"
10008080-54 = "그럼 조원 여러분. 성가신 뒤처리는 여러분에게 맡기도록 하겠습니다."
10008080-55 = "그리고 당신들. 부디 이런 일에 섣불리 고개를 들이밀고 만 것을, 마지막까지 후회하시길."
10008080-62 = "크크큭. 보스의 말 잘 들었지?"
10008080-63 = "감히 주제도 모른 채 끼어들다니 말이야!"
10008080-64 = "자, 그럼 여기서 어떻게 요리를 해줄까!"
10008080-66 = "이, 이제 어떡하지?!"
10008080-67 = "아하핫. 위기일발! 이란 느낌~?"
10008080-68 = "……크읏! 선생님……!"
10008080-75 = "[ns1] \"………!!\"\n[ns2] \"모두 진정해. 괜찮아.\""
10008080-76 = "뭐? 이런 상황에서 선생님 무슨 말을……."
10008080-77 = "뭐? 이런 상황에서 선생님 무슨 말을……."
10008080-82 = "뭐, 뭐 하는 놈이냐?!"
10008080-83 = "으음~ 뭐 하는 놈이냐고 물어보면 말이지~"
10008080-85 = "이 목소리는……!"
10008080-90 = "이야~ 사랑하는 후배 및 기타 등등을 구하기 위해 등장한 히어로라고나 할까~?"
10008080-91 = "[s] \"호시노!\""
10008080-92 = "선생님의 열렬한 환영~ 이 아저씨도 조금 기쁜걸~"
10008080-96 = "자, 그럼 일단 방해물부터 치워버리자구~"
