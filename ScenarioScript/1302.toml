[translation]
1302-1 = "회장 동지는 언제나 옳다 2"
1302-5 = "……그런 관계로, 그대가 페로로가 되어 주어야겠다."
1302-7 = "뭐가 '그런 관계'인가요?! 아무리 생각해도 결론이 이상하잖아요!"
1302-9 = "구교사에서 나오라기에 드디어 정학 기간이 끝난 줄 알고 기뻐했는데……"
1302-10 = "대뜸 저더러 페로로가 되라니, 이게 무슨 뚱딴지같은 제안인가요?"
1302-11 = "거짓말은 하지 않았다. 제안만 들어준다면 앞으로 그대는 본교사에서 편안히 지낼 수 있을 것이다. 푸딩도 두 개씩 지급하겠다고 약속하지."
1302-12 = "……다만 한동안은 이 페로로 인형 탈을 쓰고 말끝에 '페로~' 라는 어미를 붙여야 하겠지만 말이야."
1302-13 = "그런 바보 같은 일에 동참할 리가 없잖아요!"
1302-14 = "그보다 어째서 제가 이 인형 탈을 써야 하나요? 가짜 페로로 흉내를 내는 것뿐이라면 다른 보안위원들에게 시키셔도 되잖아요?"
1302-15 = "그건 무리다. 이 인형 탈의 내부는 보안 위원들이 들어가기에는 너무 좁거든."
1302-16 = "그대처럼 작고 날렵한 꼬맹이가 아니라면 실행할 수 없는 작전이다."
1302-17 = "사람을 두고 꼬맹이라니, 그게 지금 부탁하는 사람의 자세인가요?!"
1302-18 = "……애초에 가상의 캐릭터를 학교에 전입 시켜 온다는 게 말이 될 리가 없잖아요."
1302-19 = "아무리 회장의 명령이라지만 위원장도 안되는 건 안 된다고 딱 잘라 말씀하시라고요!"
1302-20 = "그, 그건 그렇지만……"
1302-22 = "아니지, 노도카 동지. 그대는 지금 체리노 회장이 틀렸다고 주장할 셈인가?"
1302-23 = "보안위원장 앞에서 그런 불손한 발언을 내뱉다니, 숙청당하고 싶은 게냐!"
1302-25 = "흥, 어차피 이미 정학 중인 몸이라 그런 협박은 먹히지 않는다고요!"
1302-26 = "여하튼! 바보 같은 인형 옷을 입고, 바보 같은 말버릇을 써야 한다니. 본교사로 복귀시켜준다고 해도 그런 일은 사양하겠어요!"
1302-27 = "끄응……."
1302-28 = "이 방법은 쓰려 하지 않았지만…… 하는 수 없군."
1302-30 = "보안위원, 그 물건을 들고 오게!"
1302-46 = "어라? 이건…… <르와조 블뢰>의 최고급 푸딩이잖아요?"
1302-47 = "한 개에 1,000엔이나 한다는 이 최고급 푸딩으로 저를 매수할 생각이신가요?"
1302-48 = "무, 무, 물론 마음이 동하지 않는 건 아니지만…… 이, 이, 이 정도의 물건으로 제 결심을 흔들 수 있다고 생각하셨다면 오산……"
1302-50 = "무슨 소리를 하는 건가, 그대는."
1302-51 = "이 물건은 회유책이 아니라, 그대의 의지를 꺾어버리기 위한 극악무도한 고문 도구다!"
1302-53 = "푸딩으로 고문을 한다고요? 그게 무슨……"
1302-54 = "냠."
1302-56 = "머, 먹었다?!"
1302-57 = "그, 그렇군요. 오랫동안 달콤한 디저트를 먹지 못한 제 앞에서, 맛있는 음식을 먹는 모습을 보여 괴롭힐 생각이군요."
1302-58 = "하지만 이 정도의 괴로움은 아무렇지도……."
1302-59 = "그럭저럭 평범하군."
1302-63 = "버, 버렸다??!!!"
1302-64 = "지, 지금 뭐 하시는 짓이신가요? 그 비싼 푸딩을 한 입만 먹고 던져 버리시다니!"
1302-65 = "후후, 이곳에 오기 전부터 그대에 대한 조사는 이미 모두 마쳤다."
1302-66 = "구교사에서의 오랜 생활로 절약이 몸에 밴 그대에게는 음식을 먹지 못하는 것보다 음식이 낭비되는 꼴을 지켜보는 게 더 괴로운 일이겠지."
1302-67 = "자, 이 이상 괴로운 일을 당하고 싶지 않다면 순순히 내게 협력하는 게 좋을 거야!"
1302-68 = "이 어쩜 극악무도한…… 역시 체리노 회장의 파수견, 피도 눈물도 없는 마리나 위원장다운 행동이네요."
1302-69 = "하지만 이 정도의 고문에는 굴하지 않아요! 무슨 일이 있어도 그런 우스꽝스러운 차림은 하지 않을 테니까요!"
1302-70 = "과연 붉은겨울의 학생답게 기개 있는 모습이로군. 하지만 그 결심이 언제까지 이어지는지 두고 볼까?"
1302-72 = "자, 보안위원들. 이어서 다음 물건을 가져오도록!"
1302-74 = "(그 이후로도 마리나의 고문은 계속되었다…….)"
1302-77 = "흐음. 이게 바로 노도카 동지가 아끼는 천체 망원경인가…… 과연 소문대로 앞에 커다랗고 훌륭한 렌즈가 달려 있군."
1302-78 = "만약 이 망원경을 맨손으로 마구 만져 렌즈 위에 지문을 찍는다면…… 동지는 어떤 반응을 보이려나?"
1302-79 = "지, 지금 무슨 짓을 하려는 건가요? 당장 그만두지 못하시겠어요?!"
1302-82 = "그다음은 간지럼이다! 사무국에서 특별히 공수해 온 이 부드러운 깃털로 목덜미를 잔뜩 간지럽혀주마!"
1302-84 = "(간질간질간질…….)"
1302-85 = "으햣? 우헷, 우헤헤헷!"
1302-86 = "아, 알겠다고요! 크큭…… 시, 시키는 대로 할 테니까…… 간지럼을 멈춰주세요! 으하핫!"
1302-87 = "아직 멀었어! 페로로는 그런 소리로 울지 않는다고!"
1302-90 = "오, 마침 여기에 민트초코를 얹은 파인애플 튀김이 있군. 한 번 먹어보겠나?"
1302-92 = "주, 죽여주세요……."
1302-95 = "으으, 으으으……."
1302-96 = "후우. 이만하면 충분한 것 같군."
1302-97 = "자, 다시 한번 묻지. 그대는 누구지?"
1302-98 = "노도…… 아니. 페, 페로로입니다."
1302-99 = "곰도, 토끼도 아닌 페로로입니다. 페로페로……."
1302-101 = "훌륭해, 바로 그 자세야!"
1302-102 = "이만하면 문제없이 체리노 회장님을 속일…… 아니, 보고드릴 수 있겠어!"
1302-103 = "이 가짜 페로로를 사무국에 편입시키고 <특별 황금 수염 훈장>를 받아, 사무국의 더 높은 자리를 향해 나아가는 거야!"
1302-105 = "자, 노도…… 아니, 페로로 동지. 지금 바로 체리노 회장님을 알현하러 가도록 하지."
1302-106 = "붉은겨울 학원을 위한 중대한 임무를 수행하는 자리인 만큼, 한 치의 실수도 없게 주의하도록!"
1302-107 = "페, 페로……."
