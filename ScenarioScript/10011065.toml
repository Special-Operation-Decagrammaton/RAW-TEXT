[translation]
10011065-8 = "후후후. 네, 여러분! 합격입니다! 통과예요."
10011065-12 = "무, <무념무상의 인법>! 서, 성공이에요!"
10011065-13 = "츠쿠요 공! 대단해요!"
10011065-14 = "……다, 다행이다아……."
10011065-16 = "뭐, 독심술이라고 해도 대충 남의 의중을 읽고 행동한 정도-라고 생각은 하지만요."
10011065-17 = "조금 전의 해프닝도 그런 이야기의 연장, 이었던 모양이고."
10011065-18 = "[s] \"미모리는 착한 아이고, 모두를 잘 챙겨주는 타입이니까.\""
10011065-19 = "아이참…… 선생님도 그런 말씀을……"
10011065-20 = "엣-헴, 그야 이벤트의 일환으로 독심술사를 자처하고 있을 뿐이고."
10011065-21 = "정말로 사람의 마음을 읽을 수 있을 리가 없잖아요?"
10011065-22 = "자, 그럼 인법연구부 여러분. 다시 한번 통과 축하드립니다."
10011065-23 = "토, 통과한 거지?! 그럼 얼른-"
10011065-24 = "아 참, 미치루 쨩."
10011065-25 = "……아, 응?"
10011065-26 = "주최자가 아닌 단순한 협력자라고는 해도, 어트랙션 담당자로서 참가자에게 이런 말을 해선 안 되는 일일지도 모르지만……."
10011065-27 = "그래도 말해둘게요."
10011065-28 = "미치루 쨩의 상냥함은 멋지다고 생각하지만……. 미치루 쨩이 생각하는 것보다 다들 강하다고 생각해요."
10011065-29 = "……어? 강, 해?"
10011065-30 = "후후, 네. 그렇답니다."
10011065-31 = "그게 무슨 뜻………"
10011065-32 = "통과죠? 그럼 이러고 있을 때가 아니에요. 선생님. 그리고 다른 분들도."
10011065-33 = "바로 움직이도록 하죠."
10011065-34 = "아, 으, 응……."
10011065-35 = "네, 모두 힘내세요~! 아 참 그리고!"
10011065-39 = "그리고 선생님, 점심부터 그런 생각을 하시는 것은, 그게……."
10011065-40 = "[s3] \"그러니까 오해입니다!\"\n[s4] \"그 이야기라면 나중에 제대로 대화를 나눠보자?!\""
