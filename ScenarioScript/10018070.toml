[translation]
10018070-1 = "제7화;그렇다면 대결이다!"
10018070-3 = "……그런 일이 있었군요."
10018070-4 = "어째 점점 일이 커지는 느낌인데…… 이거 괜찮은 거 맞지?"
10018070-5 = "하지만 포기할 생각은 없습니다."
10018070-6 = "중간에 그만둘 거면, 시작하지 않는 게 나아요."
10018070-11 = "응! 먹다가 그만둔 음식은, 보통 버리게 되니까!"
10018070-12 = "하루나는 그런 의미로 말한 게 아닌 것 같지만요."
10018070-14 = "아무튼 좋습니다. 이것은 일종의 시련이군요."
10018070-15 = "궁극의 맛을 찾는 우리에게 내려진 하나의 시련……"
10018070-16 = "그 시련을 돌파한 후에 맛보는 것은, 무엇과도 비교할 수 없는 미식임에 분명하겠지요."
10018070-22 = "지금부터 미식연구회는, 냐오푸드로 향하겠습니다."
10018070-31 = "회장님. 보고 사항이 있습니다."
10018070-32 = "뭇후후후. 무엇인가?"
10018070-33 = "미식연구회가 냐오모토 푸드 본사로 향하고 있습니다."
10018070-37 = "무엇이? 어떻게 이 위치를 알아차렸지?!"
10018070-38 = "회사 홈페이지를 통해서랍니다."
10018070-39 = "뭣이! 누가 홈페이지에 주소를 써 놓으라고 지시했나!"
10018070-40 = "회장님이십니다."
10018070-45 = "왜 그걸 성실하게 하라는 대로 적어 둔 것인가!"
10018070-46 = "아니…… 명령은 명령대로 정확히 수행하라 하셨잖아요……"
10018070-51 = "……"
10018070-52 = "뭇후후후후……"
10018070-53 = "회사 홈페이지까지 들여다보며 친히 이곳을 방문한 열성 고객을,"
10018070-54 = "아무 환대 없이 돌려보내는 것도 예의가 아니겠지. 뭇후후후후."
10018070-55 = "어째 말씀이 바뀌신 것 같습니다만."
10018070-56 = "시끄럽다! 예비대! 응전을 준비하라!"
10018070-57 = "그래도 되는 겁니까?"
10018070-59 = "상관없다! 이곳은 냐오푸드의 본사다!"
