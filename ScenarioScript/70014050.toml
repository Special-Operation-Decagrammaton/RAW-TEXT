[translation]
70014050-1 = "藥師的徬徨（５）"
70014050-2 = "……"
70014050-3 = "老師。身為教育者，理應回答受教者的問題對吧？"
70014050-4 = "[s] 「大致上可以這麼說……？」"
70014050-5 = "很好。"
70014050-6 = "那麼老師對我許下的「約定」，就麻煩你現在履行吧。"
70014050-7 = "[s] 「現在？」"
70014050-8 = "沒錯。"
70014050-9 = "首先，希望老師不加掩飾、毫無隱瞞地……把真實的想法告訴我。"
70014050-10 = "在老師眼中，我是個什麼樣的學生？"
70014050-11 = "[s] 「是個非常，非常，非常，非常難搞的問題學生。」"
70014050-12 = "嗯，嗯……當然是這樣沒錯，但你回答得還真快啊……"
70014050-13 = "問我為何突然問這種問題？"
70014050-14 = "就像我不在乎其他人一樣，我也不在乎其他人怎麼看待我。"
70014050-15 = "至少直到最近……我認為自己一直是這樣活過來的。"
70014050-16 = "但是現在……"
70014050-17 = "……"
70014050-18 = "對我而言，不確定是件壞事。"
70014050-19 = "不完美的東西、正被削蝕的東西……乃至於日漸鈍化或損壞的東西也是同理。"
70014050-20 = "成形之物越是走向扭曲，不確定性也會隨之增長。"
70014050-21 = "正因如此，我認為[ruby=我等]人類[/ruby]理應朝著那彼端……懷抱著超越之願前行。"
70014050-22 = "[s] 「你指的是仙丹嗎？」"
70014050-23 = "沒錯，仙丹。除此之外，幾乎沒有東西能引起我的興趣。"
70014050-24 = "所謂神仙就是能夠超越極限，以及理應能立於極限之上的人。"
70014050-25 = "你有思考過這個問題嗎，老師？"
70014050-27 = "如果生活在地上的人類能夠克服一切，那麼人類究竟能夠抵達什麼樣的地方呢。"
70014050-28 = ""
70014050-29 = "這個疑問，也正是我投身此「業」的根本原因。"
70014050-30 = "一直以來，我對於自己持續探究著人類一事抱有些許的自負。"
70014050-31 = "至少跟其他人有關的事，我自認能在一定程度上有所掌握。"
70014050-32 = "然而從某個時候開始……我卻變得連自己的事也無法看透了。"
70014050-33 = "[s] 「某個時候？」"
70014050-34 = "是啊。準確來說──"
70014050-35 = ""
70014050-38 = "[log]不要讓我放棄你。[/log]"
70014050-41 = ""
70014050-42 = "就是從那一刻開始的。"
70014050-43 = "[s]「……」"
70014050-44 = "老師。我想請你告訴我，那句話究竟是什麼意思？"
70014050-45 = "老師你……是帶著什麼樣的意圖，向我說出那句話的？"
70014050-46 = "[s] 「誡啊，你聽我說。」"
70014050-47 = "……？"
70014050-48 = "[s] 「或許我這個人的某些部份，是永遠不會改變的。」"
70014050-49 = "不會改變……？"
70014050-50 = "[s1] 「我無論何時都想幫助[ruby=學生們]你們[/ruby]。」\n[s2] 「然而，那也是只憑我自己一人無法辦到的事。」"
70014050-51 = ""
70014050-52 = ""
70014050-54 = "那是……什麼意思？"
70014050-55 = "嗯？如果學生拒絕一切，老師終究什麼也做不了？"
70014050-56 = ""
70014050-58 = ""
70014050-59 = "……你倒是說了句有意思的話呢。"
70014050-60 = "即使學生執意拒絕……身為老師不也應該堅持到底，不放棄學生嗎？"
70014050-61 = "那不正是所謂身為「教育者」的理想嗎？"
70014050-62 = "[s] 「這麼說並沒有錯。」"
70014050-63 = ""
70014050-66 = "[ns3] 「但是，如果你始終選擇拒絕……」\n[ns4] 「那麼我也無能為力。」"
70014050-69 = ""
70014050-70 = "……是嗎。"
70014050-71 = "就像任何藥劑都引發不了化學反應，已經損壞的身體一樣……是吧。"
70014050-72 = "[s5] 「沒錯。但是……我有必須[ruby=引導]幫助[/ruby]你的義務。」\n[s6] 「所以，我希望誡也能給我一個機會。」"
70014050-73 = ""
70014050-74 = ""
70014050-77 = "[ns] 「給我一個能夠[ruby=培育]幫助[/ruby]你的機會。」"
70014050-78 = "……"
70014050-79 = "你知道「悔毒之歎」這個詞嗎，老師？"
70014050-80 = "意思是對無法挽回的事情不斷後悔。"
70014050-81 = "真是句軟弱的話。就像「人性本善」這種說法一樣。"
70014050-82 = "抱著半吊子的心態，可是連山腰都爬不上去的。"
70014050-83 = "……一直以來我都是這麼想的。#n然而……"
70014050-86 = ""
70014050-87 = "……看來問題果然是那時候的事啊。"
70014050-88 = "當時我原以為只是件無足輕重的小事……"
70014050-89 = "如果用材料來比喻，大概就是內在的某處悄悄產生了一道肉眼看不見的細微裂痕吧。"
70014050-90 = "[s] 「你把自己說得就像個物質似的……？」"
70014050-91 = "在大多數情況下，人與物並無不同。至少我是這麼認為的。"
70014050-92 = "生命的開端不過是化學反應，人類的存在只是記憶資訊的影子。"
70014050-93 = "靈魂並不存在，精神也不過是神經細胞的火花。"
70014050-94 = "所謂的藥學，同樣只是扭曲或整流那股流動的過程。"
70014050-95 = "……無論他人還是自己，對我來說都只是物品而已。"
70014050-96 = "……"
70014050-97 = "他人的悲傷，果然是我難以明白的概念。#n雖然腦袋能夠理解，心卻無法感受。"
70014050-98 = "他人的痛苦也是一樣。#n大家都說會為某人一同落淚，但實際上哭的終究是自己。"
70014050-99 = "人與人之間，確實存在著根本上無法觸及的距離。"
70014050-100 = "而我對那股距離感的感受，又比旁人更為深切……我是這麼想的。"
70014050-101 = "[s] 「你為什麼……會產生哪種想法呢？」"
70014050-102 = "……誰知道呢。"
70014050-103 = ""
70014050-105 = ""
70014050-106 = "要是能明白這點，我或許也能過上稍微「普通」一點的生活吧。"
70014050-107 = "根據我自己的分析……或許我生來就是如此。"
70014050-108 = "不，應該說是被造成那樣的才對。"
70014050-109 = "[s] 「被造……？」"
70014050-110 = "這是生物學上的比喻。#n所有生命，不都是由細胞構成、創造出來的產物嗎？"
70014050-112 = "世上的某些人就是這樣開始的，老師。"
70014050-113 = "雖然絕非多數，卻特別無法理解他人的人。"
70014050-114 = "他人的思考方式、情感、行為準則……#n無法以直覺感受那些東西，必須逐一用理論分析才能逐漸明白的人。"
70014050-115 = ""
70014050-116 = "在那樣的人之中，我的這種傾向似乎又更加顯著。"
70014050-117 = "其中不存在理由和原因。#n我只是……打從一開始就是那樣的人。"
70014050-118 = "只是因為種種原因，朝著強化那種傾向的方向成長而已。"
70014050-119 = "我至今仍不太明白「幫助他人的行為會回饋到自己身上」的這種概念。"
70014050-120 = "雖然知道那種事有可能發生，卻不太喜歡這麼做。"
70014050-121 = "因為那實在太耗費時間。是缺乏效率的過程。"
70014050-122 = "[s] 「所以你才一直用力量讓人屈服嗎？」"
70014050-123 = "沒錯，正是如此。"
70014050-124 = "因為那樣既快速又直接，能夠立刻得到我想要的結果。然而……"
70014050-125 = "……我不明白。像這樣產生「無法理解」的感覺，實在是久違了。"
70014050-126 = "似乎遺漏了什麼，卻怎麼也想不出來。"
70014050-127 = "針對這個部分給出答案，或許就是老師最後必須跟我一同遵守的「約定」吧。"
70014050-128 = "[s] 「既然如此，要不要試著學習看看？」"
70014050-129 = ""
70014050-131 = ""
70014050-132 = "你說……學習？"
