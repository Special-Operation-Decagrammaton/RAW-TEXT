[translation]
70014050-1 = "เส้นทางอันสับสนของหมอยา 5"
70014050-2 = "..."
70014050-3 = "ครู ผู้สอนย่อมต้องตอบคำถามของผู้เรียนใช่มั้ย?"
70014050-4 = "[s] \"โดยทั่วไปก็ถือว่าใช่นะ...?\""
70014050-5 = "ดีละ"
70014050-6 = "งั้นตอนนี้ก็จงทำตาม 'คำมั่น' ที่ครูให้ไว้กับฉัน"
70014050-7 = "[s] \"ตอนนี้เหรอ?\""
70014050-8 = "ใช่"
70014050-9 = "ก่อนอื่น ฉันอยากให้ครูบอกความคิดที่แท้จริงออกมาตรงๆ... โดยไม่บิดเบือนหรือปิดบัง"
70014050-10 = "ในสายตาครู ฉันเป็นนักเรียนแบบไหน?"
70014050-11 = "[s] \"เป็นเด็กมีปัญหาที่รับมือยากมากๆๆๆ เลยละ\""
70014050-12 = "อะ... อืม แน่นอนว่าคงเป็นแบบนั้น แต่ตอบได้รวดเร็วเสียจริงนะ..."
70014050-13 = "ทำไมจู่ๆ ฉันถึงถามแบบนั้นน่ะเหรอ?"
70014050-14 = "ฉันไม่ได้สนใจว่าคนอื่นจะมองฉันยังไง พอๆ กับที่ฉันไม่สนใจคนอื่น"
70014050-15 = "อย่างน้อยจนถึงเมื่อไม่นานมานี้... ฉันก็คิดว่าตัวเองใช้ชีวิตมาแบบนั้น"
70014050-16 = "แต่ว่าตอนนี้..."
70014050-17 = "..."
70014050-18 = "สำหรับฉันแล้ว ความไม่แน่นอนเป็นสิ่งไม่ดี "
70014050-19 = "สิ่งที่ไม่สมบูรณ์ สิ่งที่ค่อยๆ สึกกร่อนไป... สิ่งที่นับวันยิ่งทื่อหรือพังลงก็ด้วย"
70014050-20 = "ยิ่งสิ่งที่เป็นรูปเป็นร่างบิดเบี้ยวไป ความไม่แน่นอนก็ยิ่งเพิ่มขึ้น"
70014050-21 = "เพราะอย่างนั้น ฉันคิดว่า[ruby=เรา]มนุษย์[/ruby]ควรมุ่งไปสู่สิ่งที่อยู่เหนือไปกว่านั้น... และเดินหน้าโดยปรารถนาจะก้าวข้ามขีดจำกัด"
70014050-22 = "[s] \"หมายถึงน้ำอมฤตเหรอ?\""
70014050-23 = "ใช่ น้ำอมฤต นอกจากสิ่งนั้นแล้ว มันก็แทบไม่มีอะไรอื่นดึงดูดความสนใจของฉันได้"
70014050-24 = "เทพเจ้าหมายถึงผู้ที่ก้าวข้ามขีดจำกัด และคู่ควรจะยืนอยู่เหนือขีดจำกัดนั้น"
70014050-25 = "เคยคิดมั้ย ครู?"
70014050-27 = "หากมนุษย์ที่อาศัยอยู่บนผืนดินสามารถเอาชนะสิ่งเหล่านั้นทั้งหมดได้ มนุษย์จะไปได้ไกลถึงเพียงไหนกันนะ"
70014050-28 = ""
70014050-29 = "ข้อสงสัยนั้นเป็นเหตุผลพื้นฐานที่ทำให้ฉันก้าวเข้าสู่สายงานนี้"
70014050-30 = "จนกระทั่งตอนนี้ ฉันก็เคยภาคภูมิใจว่าตัวเองเฝ้าศึกษาค้นคว้าเกี่ยวกับมนุษย์มาโดยตลอด"
70014050-31 = "อย่างน้อยถ้าเป็นเรื่องของคนอื่น ฉันก็เคยคิดว่าตัวเองเข้าใจได้ในระดับหนึ่ง"
70014050-32 = "แต่ว่าตั้งแต่เมื่อไรก็ไม่รู้... ฉันกลับไม่เข้าใจแม้กระทั่งตัวเองเสียแล้ว..."
70014050-33 = "[s] \"ตั้งแต่เมื่อไรก็ไม่รู้เหรอ?\""
70014050-34 = "ใช่ ถ้าจะพูดให้ชัดก็คือ"
70014050-35 = ""
70014050-38 = "[log]ทำให้ครูไม่อยากยอมแพ้ในตัวเธอเถอะนะ[/log]"
70014050-41 = ""
70014050-42 = "นับตั้งแต่วินาทีที่ได้ยินคำนั้น"
70014050-43 = "[s] \"...\""
70014050-44 = "ครู ฉันอยากถามตรงนี้เลย คำพูดนั้นมันหมายความว่าอะไรกันแน่?"
70014050-45 = "ที่ครู... พูดแบบนั้นกับฉัน มันหมายความว่ายังไง?"
70014050-46 = "[s] \"นี่ ไค\""
70014050-47 = "...?"
70014050-48 = "[s] \"บางทีสำหรับครูแล้ว มีบางสิ่งที่ไม่ว่าเมื่อไรมันก็ไม่เปลี่ยนแปลงไปอยู่น่ะ\""
70014050-49 = "สิ่งที่ไม่เปลี่ยนแปลง...?"
70014050-50 = "[s1] \"ครูอยากช่วย[ruby=นักเรียน]พวกเธอ[/ruby]อยู่เสมอเลยนะ\"\n[s2] \"แต่เรื่องนั้นก็เป็นสิ่งที่ครูทำด้วยกำลังของครูเพียงคนเดียวไม่ได้\""
70014050-51 = ""
70014050-52 = ""
70014050-54 = "นั่น... หมายความว่ายังไง?"
70014050-55 = "หืม? ถ้านักเรียนปฏิเสธทุกอย่าง สุดท้ายคนเป็นครูก็ทำอะไรไม่ได้เลยงั้นเหรอ?"
70014050-56 = ""
70014050-58 = ""
70014050-59 = "...พูดได้น่าสนใจดีนี่"
70014050-60 = "แต่ต่อให้นักเรียนปฏิเสธจนถึงที่สุด แต่ถ้าเป็นครูแล้วละก็ ครูไม่ควรจะยอมแพ้ในตัวนักเรียนจนถึง#nวินาทีสุดท้ายหรือเปล่า?"
70014050-61 = "นั่นคือสิ่งที่เรียกว่าอุดมคติของ 'ครูผู้สอน' ไม่ใช่เหรอ?"
70014050-62 = "[s] \"ที่พูดมาก็ไม่ผิดหรอก\""
70014050-63 = ""
70014050-66 = "[ns3] \"แต่ถ้าเธอยังคงปฏิเสธครูจนถึงที่สุด... ครูก็ทำอะไรไม่ได้เลย\"\n[ns4] \"แต่ถ้าไคยังคงปฏิเสธครูจนถึงที่สุด ครูก็ทำอะไรไม่ได้เลยเหมือนกัน\""
70014050-69 = ""
70014050-70 = "งั้นสินะ..."
70014050-71 = "เหมือนกับร่างกายที่พังเสียแล้ว ที่ไม่ว่าจะใช้วัตถุดิบยาชนิดใด ก็ไม่ก่อให้เกิดปฏิกิริยาเคมีใดๆ... สินะ"
70014050-72 = "[s5] \"ใช่ ครูก็เลย... อยากให้เธอให้โอกาสครู\"\n[s6] \"ใช่ ครูเลยอยากให้ไคให้โอกาสครูดูน่ะ\""
70014050-73 = ""
70014050-74 = ""
70014050-77 = "[ns] \"โอกาสที่ครูจะได้[ruby=หล่อหลอม]ช่วยเหลือ[/ruby]เธอไง ไค\""
70014050-78 = "..."
70014050-79 = "ครูรู้จักคำว่า 'คร่ำครวญเมื่อสายเกินแก้' หรือเปล่า?"
70014050-80 = "หมายถึงการเอาแต่สำนึกเสียใจกับสิ่งที่ต่อให้จะเสียใจไปมันก็ไม่มีประโยชน์แล้วน่ะ"
70014050-81 = "ช่างเป็นคำพูดที่อ่อนแอ ไม่ต่างจากคำพูดที่ว่ามนุษย์เป็นสิ่งมีชีวิตที่ดีงามมาแต่กำเนิด"
70014050-82 = "เพราะด้วยความมุ่งมั่นแบบครึ่งๆ กลางๆ แม้แต่ครึ่งทางขึ้นเขาก็ยังไปไม่ถึง"
70014050-83 = "ที่ผ่านมาฉันคิดแบบนั้นมาตลอด... แต่ว่า..."
70014050-86 = ""
70014050-87 = "ดูเหมือนเรื่องในตอนนั้นจะเป็นปัญหาจริงๆ สินะ..."
70014050-88 = "ตอนนั้นฉันคิดว่าไม่ใช่เรื่องสำคัญอะไร..."
70014050-89 = "แต่ถ้าลองเปรียบตัวเองเป็นวัสดุ ก็คงมีรอยร้าวเล็กๆ ที่มองไม่เห็นเกิดขึ้นตรงไหนสักแห่งในตัวฉัน"
70014050-90 = "[s] \"พูดถึงตัวเองเหมือนเป็นวัตถุเลยนะ…?\""
70014050-91 = "ก็โดยมากแล้วมนุษย์ไม่ได้ต่างจากสิ่งของ อย่างน้อยฉันก็ปฏิบัติต่อมนุษย์แบบนั้น"
70014050-92 = "จุดเริ่มต้นของชีวิตเป็นเพียงปฏิกิริยาเคมี ส่วนการดำรงอยู่ของมนุษย์ก็เป็นแค่เงาของข้อมูลความทรงจำ ก็เท่านั้น"
70014050-93 = "วิญญาณไม่มีอยู่จริง ส่วนจิตใจก็เป็นเพียงประกายไฟที่เกิดจากเซลล์ประสาท"
70014050-94 = "แม้แต่สิ่งที่เรียกว่าเภสัชศาสตร์ ก็เป็นเพียงกระบวนการหนึ่งที่ใช้เบี่ยงเบนหรือปรับกระแสนั้นให้เป็น#nระเบียบเท่านั้น"
70014050-95 = "สำหรับฉันแล้ว... ไม่ว่าจะเป็นคนอื่นหรือตัวฉันเอง ก็ล้วนแล้วแต่เป็นสิ่งของทั้งสิ้น"
70014050-96 = "..."
70014050-97 = "ความเศร้าของผู้อื่นก็ยังเป็นแนวคิดที่ฉันไม่เข้าใจอยู่ดี ถึงสมองจะเข้าใจได้ แต่หัวใจกลับไม่รู้สึกถึงมัน"
70014050-98 = "ความเจ็บปวดของผู้อื่นก็เช่นกัน แม้ทุกคนจะบอกว่าแค่ร่วมหลั่งน้ำตาไปกับใครสักคน แต่สุดท้ายก็เป็นการร้องไห้จากความรู้สึกของตัวเองอยู่ดี"
70014050-99 = "ระหว่างผู้คน มันมีระยะห่างที่โดยพื้นฐานแล้วไม่อาจเอื้อมถึงกันได้อยู่จริงๆ"
70014050-100 = "และฉันก็เคยคิดว่า... ตัวเองรับรู้ระยะห่างนั้นได้ชัดเจนกว่าคนอื่น"
70014050-101 = "[s] \"ทำไม... ถึงคิดแบบนั้นขึ้นมาล่ะ?\""
70014050-102 = "ไม่รู้สิ..."
70014050-103 = ""
70014050-105 = ""
70014050-106 = "ถ้าฉันเข้าใจเรื่องนั้นได้ ฉันเองก็คงใช้ชีวิตที่ 'ธรรมดา' กว่านี้ได้บ้างไปแล้วละ"
70014050-107 = "แต่จากที่ฉันวิเคราะห์ ฉันคงจะ... เกิดมาเป็นแบบนั้น"
70014050-108 = "ไม่สิ ถูกสร้างมาให้เป็นแบบนั้นมากกว่า"
70014050-109 = "[s] \"ถูกสร้างมา...?\""
70014050-110 = "มันเป็นการเปรียบเทียบเชิงชีววิทยาน่ะ ชีวิตทุกชีวิตล้วนเป็นผลลัพธ์ที่ถูกสร้างขึ้นจากเซลล์ไม่ใช่เหรอ?"
70014050-112 = "บนโลกนี้มีคนที่เริ่มต้นมาอย่างนั้นอยู่นะ ครู"
70014050-113 = "แม้จะมีอยู่ไม่มาก แต่มันก็มีคนที่ไม่สามารถเข้าใจผู้อื่นได้เป็นพิเศษอยู่นะ"
70014050-114 = "คนประเภทที่ไม่อาจรับรู้วิธีคิด อารมณ์ และหลักการขับเคลื่อนการกระทำของผู้อื่นได้โดยสัญชาตญาณ แต่ต้องวิเคราะห์สิ่งเหล่านั้นทีละอย่างตามหลักทฤษฎี จึงจะค่อยๆ เข้าใจได้..."
70014050-115 = ""
70014050-116 = "ในบรรดาคนแบบนั้น ดูเหมือนฉันจะมีแนวโน้มนั้นเด่นชัดกว่าคนอื่นอยู่สักหน่อย"
70014050-117 = "เรื่องนั้นไม่มีเหตุผล ไม่มีต้นเหตุ ฉันก็แค่... เป็นมนุษย์แบบนั้นมาตั้งแต่แรก"
70014050-118 = "เพียงแต่ด้วยปัจจัยหลายอย่าง ฉันจึงเติบโตมาในทิศทางที่ทำให้แนวโน้มแบบนั้นเด่นชัดยิ่งขึ้นเท่านั้น"
70014050-119 = "ถึงตอนนี้ฉันจะยังไม่ค่อยเข้าใจแนวคิดที่ว่า ความช่วยเหลือที่มอบให้ผู้อื่นจะวนอ้อมไปไกล ก่อนย้อนกลับมาหาตัวเองก็ตาม"
70014050-120 = "ฉันรู้ว่าเรื่องแบบนั้นอาจเกิดขึ้นได้ แต่ก็ไม่ได้ชอบนักหรอก"
70014050-121 = "ที่สำคัญที่สุดคือ มันใช้เวลานาน เป็นกระบวนการที่ไร้ประสิทธิภาพน่ะ"
70014050-122 = "[s] \"ก็เลยใช้วิธีทำให้อีกฝ่ายยอมจำนนด้วยกำลังมาตลอดเหรอ?\""
70014050-123 = "ใช่ เป็นแบบนั้น"
70014050-124 = "เพราะวิธีนั้นรวดเร็ว เห็นผลทันที และทำให้ฉันได้ผลลัพธ์ที่ต้องการในทันที แต่ว่า..."
70014050-125 = "ไม่รู้สิ... นานมากแล้วจริงๆ ที่ฉันไม่ได้รู้สึกว่า 'ไม่อาจรู้ได้' แบบนี้"
70014050-126 = "เหมือนฉันพลาดอะไรบางอย่างไป แต่ก็ไม่อาจรู้ได้เสียทีว่าสิ่งนั้นคืออะไร"
70014050-127 = "การหาคำตอบให้เรื่องนี้ ในท้ายที่สุดคงเป็น 'คำมั่น' ระหว่างเราที่ครูต้องรักษาสินะ "
70014050-128 = "[s] \"ถ้างั้น ลองเรียนดูมั้ย?\""
70014050-129 = ""
70014050-131 = ""
70014050-132 = "เรียน... งั้นเหรอ?"
