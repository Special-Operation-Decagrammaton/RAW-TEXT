[translation]
70014050-1 = "The Apothecary Wanderings 5"
70014050-2 = "..."
70014050-3 = "Sensei. As an educator, you have to answer your students' questions, right?"
70014050-4 = "[s] \"Generally speaking, I suppose so...?\""
70014050-5 = "Good."
70014050-6 = "Now is the time to fulfill the \"promise\" you made to me, Sensei."
70014050-7 = "[s] \"Now?\""
70014050-8 = "Indeed."
70014050-9 = "First, I'd like you to share your honest thoughts, just as they are...without any ambiguity or reservations."
70014050-10 = "In your eyes, what kind of student am I?"
70014050-11 = "[s] \"A really, really, really, really difficult one to handle.\""
70014050-12 = "Hm, ahem. I suppose so, but that was a very quick answer..."
70014050-13 = "Why did I suddenly \"ask that out of the blue\"?"
70014050-14 = "Just as I don't care about others, I don't care how others view me."
70014050-15 = "At least until recently...that was true. That's how I've lived my life."
70014050-16 = "But now..."
70014050-17 = "..."
70014050-18 = "Uncertainty has always bothered me. "
70014050-19 = "Things that are imperfect, things that are chipped away...and, furthermore, things that degrade over time are no different."
70014050-20 = "As established structures become increasingly distorted, uncertainty is bound to grow."
70014050-21 = "That is why I believe that humans must move toward what lies beyond...hoping for transcendence."
70014050-22 = "[s] \"You're talking about the potion?\""
70014050-23 = "That's right, the potion. Almost nothing else has caught my interest."
70014050-24 = "A sage is one who has transcended limits and is worthy of standing above them."
70014050-25 = "Have you ever thought about that, Sensei?"
70014050-27 = "If humans living on this planet are capable of overcoming such limits, just how far could we go?"
70014050-28 = ""
70014050-29 = "That question was also the fundamental reason why I entered this line of work."
70014050-30 = "Up until now, I at least maintained a sense of pride in researching the nature of humanity."
70014050-31 = "I thought I had a pretty good understanding...at least when it came to other people."
70014050-32 = "...But at some point... I found I was unable to understand even myself."
70014050-33 = "[s] \"When was that?\""
70014050-34 = "Right. To be precise..."
70014050-35 = ""
70014050-38 = "[log]Let me have faith in you.[/log]"
70014050-41 = ""
70014050-42 = "From that moment."
70014050-43 = "[s] \"...\""
70014050-44 = "I'd like to ask you right now. What did you mean by that?"
70014050-45 = "Sensei... What did you mean when you said that to me?"
70014050-46 = "[s] \"You know, Kai...\""
70014050-47 = "...?"
70014050-48 = "[s] \"I suppose that is something about me that will never change.\""
70014050-49 = "That will \"never change\"...?"
70014050-50 = "[s1] \"No matter what, I always want to help my students.\"\n[s2] \"But that's not something I can do on my own.\""
70014050-51 = ""
70014050-52 = ""
70014050-54 = "What...do you mean?"
70014050-55 = "Hmm? If a student rejects every attempt, does that mean the teacher is powerless?"
70014050-56 = ""
70014050-58 = ""
70014050-59 = "...How interesting."
70014050-60 = "Even if a student refuses intervention to the very end, shouldn't a proper teacher never give up on them?"
70014050-61 = "Isn't that the dream of a so-called \"educator\"?"
70014050-62 = "[s] \"You're not wrong.\""
70014050-63 = ""
70014050-66 = "[ns3] \"But even so, if you end up refusing me...\"\n[ns4] \"There's...nothing I can do.\""
70014050-69 = ""
70014050-70 = "...I see."
70014050-71 = "Like a broken body that doesn't respond to any medicine or chemical reaction you try to trigger..."
70014050-72 = "[s5] \"That's right. But I...have a duty to help you.\"\n[s6] \"So, I hope you'll give me the chance to, Kai.\""
70014050-73 = ""
70014050-74 = ""
70014050-77 = "[ns] \"The chance for me to help you, I mean.\""
70014050-78 = "..."
70014050-79 = "Have you heard the phrase \"Sigh of Bitter Regret,\" Sensei?"
70014050-80 = "It means to continuously regret something, even though it's too late to do anything about it. It's...a trap, in a way."
70014050-81 = "It's a naive sentiment, and just as hollow as saying that humans are inherently good."
70014050-82 = "You need more than a half-hearted attitude to climb past even the foot of a mountain."
70014050-83 = "...Until now, I had always thought that way. But..."
70014050-86 = ""
70014050-87 = "...It seems that what happened back then was the root of the problem."
70014050-88 = "At the time, I thought it was no big deal, but..."
70014050-89 = "If we're talking materially, I suppose a microscopic crack, one too small to see, must have formed somewhere inside me."
70014050-90 = "[s] \"You talk about yourself as if you were an object.\""
70014050-91 = "Well, in most cases, people aren't any different from objects. At least, that's how I treat them."
70014050-92 = "The beginning of life is nothing more than a chemical reaction, and human existence is merely the shadow of memory."
70014050-93 = "There is no such thing as a soul, and the mind is nothing more than a spark of nerve cells."
70014050-94 = "Pharmacy, too, is solely a process that alters or regulates that flow."
70014050-95 = "...To me, whether it's other people or myself, we're all nothing more than objects."
70014050-96 = "..."
70014050-97 = "The sorrow of another is a difficult concept to grasp. While I can understand it intellectually, it doesn't resonate with me emotionally."
70014050-98 = "The same goes for the suffering of others. People may say they're shedding tears for someone else, but in the end, they're really just crying for themselves."
70014050-99 = "There is undeniably a distance between people that is fundamentally unable to be overcome."
70014050-100 = "And I thought that...I sensed that distance more keenly than anyone else."
70014050-101 = "[s] \"Why...did you come to believe that?\""
70014050-102 = "...Who knows?"
70014050-103 = ""
70014050-105 = ""
70014050-106 = "If I were able to answer, maybe I could have lived a slightly more \"normal\" life."
70014050-107 = "But based on my analysis, I suppose... I was probably just born this way."
70014050-108 = "No, I must have been made this way."
70014050-109 = "[s] \"Made...?\""
70014050-110 = "Well, it's a biological analogy. After all, isn't all life the creation of cells?"
70014050-112 = "There are people in this world who start out like that, Sensei."
70014050-113 = "They are by no means the majority, but they are the ones who, in particular, fail to understand others."
70014050-114 = "The way others think, their emotions, their motivations... Some people can't intuitively sense these things and must analyze them, one by one, to understand them."
70014050-115 = ""
70014050-116 = "Even within this category of people, I think I was more prone to it."
70014050-117 = "There's no reason for it. There's no cause either. I was just...that type of person from the start."
70014050-118 = "For various reasons, I've also grown up in a way that has strengthened that tendency."
70014050-119 = "I still don't quite understand the idea that helping others will somehow come full circle and return to you."
70014050-120 = "I know that something like that could happen, but I don't particularly embrace the idea. There are so many variables. "
70014050-121 = "Above all, even if it were true... It would take a long time. It's an inefficient process."
70014050-122 = "[s] \"Is that why you use force to subdue people?\""
70014050-123 = "Yes. I think you've caught on."
70014050-124 = "It's fast, direct, and I achieve the results I want right away. Still..."
70014050-125 = "...I don't know, and that bothers me. It's been ages since I've felt a sense of \"not knowing.\""
70014050-126 = "I feel like I'm missing something, but I can't figure out what it is."
70014050-127 = "Properly answering this question will ultimately become the \"promise\" that you and I must keep, Sensei. "
70014050-128 = "[s] \"In that case, why not give studying a try?\""
70014050-129 = ""
70014050-131 = ""
70014050-132 = "Studying?"
