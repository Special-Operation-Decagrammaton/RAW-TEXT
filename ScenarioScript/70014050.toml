70014050-44 = "3;카이;99;선생. 이 자리에서 묻고 싶다. 그 말은 도대체 어떤 의미였지?"
70014050-45 = "3;카이;05;선생은…… 어떤 의미로 그 말을, 나에게 한 것인가?"
70014050-46 = "[s] \"있잖아, 카이야.\""
