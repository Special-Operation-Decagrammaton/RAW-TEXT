70014050-1 = "#title;약사의 방황길 5"
70014050-2 = "3;카이;01;…….\n#3;a\n#3;em;[…]"
70014050-3 = "3;카이;05;선생. 교육자는, 피교육자의 질문에 응당 답해야 하겠지?"
70014050-4 = "[s] \"대체적으로는 그렇게 볼 수 있지……?\""
70014050-5 = "3;카이;99;좋다."
70014050-6 = "3;카이;02;선생이 나에게 맺은 '약조'를, 지금 갚도록 해라."
70014050-7 = "[s] \"지금?\""
70014050-8 = "3;카이;01;그래."
70014050-9 = "3;카이;02;우선 흐림이나 감춤 없이, 선생의 솔직한 생각을…… 그대로 이야기해 주었으면 한다."
70014050-10 = "3;카이;05;선생이 보기에, 나는 어떤 학생이지?"
70014050-11 = "[s] \"아주, 아주, 아주, 아주 다루기 힘든 문제아지.\""
70014050-12 = "3;카이;04;으, 으음. 물론 그렇겠지만, 참으로 빠른 대답이군…….\n#3;stiff\n#3;em;[땀]"
70014050-13 = "3;카이;02;왜 갑자기 그런 질문을 한 것이냐고?"
70014050-14 = "3;카이;99;나는 내가 타인에 대해 신경 쓰지 않는 만큼, 타인이 나를 어떻게 여기든 신경 쓰지 않는다."
70014050-15 = "3;카이;05;적어도 최근까지는…… 그렇게 살아왔다고, 생각한다."
70014050-16 = "3;카이;01;하지만, 지금은……."
70014050-17 = "3;카이;06;…….\n#3;em;[…]"
70014050-18 = "3;카이;01;불확실한 것은, 나에게 있어서 나쁜 것이다. "
70014050-19 = "3;카이;02;불완전한 것, 깎여 나가는 것…… 나아가 나날이 무뎌지거나 망가지는 것 역시 마찬가지다."
70014050-20 = "3;카이;99;형태를 이룬 것이 어그러져 갈수록, 불확실성은 증가하기 마련이니까."
70014050-21 = "3;카이;05;그렇기에 [ruby=우리]인간[/ruby]은 그 너머를 향해…… 초월을 바라며 나아가야 한다고 생각한다."
70014050-22 = "[s] \"선단?\""
70014050-23 = "3;카이;00;그렇다, 선단. 그것 이외에 나의 흥미를 끄는 것은 거의 없었다.\n#3;em;[음표]"
70014050-24 = "3;카이;02;선인이란 한계를 뛰어넘은 자, 그리고 한계 위에 마땅히 설 수 있는 자를 의미하는 것이다."
70014050-25 = "3;카이;01;생각해 본 적 있는가, 선생?"
70014050-26 = "#all;hide"
70014050-27 = "#na;카이;땅 위를 살아가는 인간이 능히 그 모든 것을 극복할 수 있다면, 인간은 어디까지 도달할 수 있는 것일까."
70014050-28 = "3;카이;01\n#3;a"
70014050-29 = "3;카이;99;그 의문이, 내가 이 업(業)에 뛰어든 근본적인 이유이기도 했다."
70014050-30 = "3;카이;00;인간에 대한 탐구를 계속해 왔다는 자부심 정도는, 지금까지 가지고 있었다."
70014050-31 = "3;카이;05;적어도 타인에 대한 것이라면, 어느 정도 파악했다고 생각하고 있었지."
70014050-32 = "3;카이;99;……하지만 어느 순간부터…… 나는, 나 자신에 대한 것조차 잘 알 수 없게 되고 말았다.\n#3;em;[한숨]"
70014050-33 = "[s] \"어느 순간?\""
70014050-34 = "3;카이;05;그래. 정확히는."
