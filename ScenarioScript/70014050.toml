70014050-77 = "[ns] \"내가, 너를 [ruby=길러낼]도울[/ruby] 수 있는 기회를 말이야.\""
70014050-78 = "3;카이;99;……."
70014050-79 = "3;카이;02;회독지탄(悔毒之歎)이라는 말을 알고 있는가, 선생?"
70014050-80 = "3;카이;99;뉘우쳐도 이미 소용없는 것을, 계속해서 뉘우치려 한다는 뜻이지."
70014050-81 = "3;카이;01;무른 말이다. 마치 인간은 본디 선한 존재라는 말만큼이나."
70014050-82 = "3;카이;05;어중간한 마음가짐으로는, 산의 중턱조차 오르지 못하기 때문이다."
70014050-83 = "3;카이;99;……지금까지는 계속, 그렇게 생각하고 있었다. 그러나…….\n#3;em;[…]"
70014050-84 = "#all;hide"
70014050-85 = "#wait;2000"
70014050-86 = "3;카이;99\n#3;a"
70014050-87 = "3;카이;05;……역시 그때의 일이 문제였던 듯 하군."
70014050-88 = "3;카이;06;그때는 대수롭지 않은 일이었다고 생각했으나……."
70014050-89 = "3;카이;99;소재로 치자면, 눈에 보이지 않는 미세한 균열이, 내 안쪽 어딘가에 생겨난 것이었겠지.\n#3;em;[한숨]"
70014050-90 = "[s] \"스스로를 꼭 물질처럼 이야기하네……?\""
70014050-91 = "3;카이;00;뭐, 대개의 경우 인간은 사물과 다르지 않다. 적어도 나는 그렇게 취급하지."
70014050-92 = "3;카이;01;삶의 시작은 화학 반응에 지나지 않고, 인간 존재는 다만 기억 정보의 그림자일 뿐이다."
70014050-93 = "3;카이;02;영혼은 존재하지 않으며, 정신 역시 신경 세포의 스파크에 불과해."
70014050-94 = "3;카이;05;약학이라는 것 역시, 그 흐름을 비틀거나 정류하는 하나의 과정에 지나지 않는다."
70014050-95 = "3;카이;99;……나에게는, 타인이든 나 자신이든 사물에 지나지 않아."
70014050-96 = "3;카이;99;…….\n#3;em;[…]"
70014050-97 = "3;카이;02;타인의 슬픔이라는 것은, 역시 잘 알 수 없는 개념이다. 여전히 머리로는 이해할 수 있지만, 가슴으로는 와닿지 않아."
70014050-98 = "3;카이;01;타인의 고통 역시 마찬가지다. 다들 누군가의 눈물을 함께 흘린다고는 하지만, 결국 자신의 울음을 우는 것이지."
70014050-99 = "3;카이;05;사람 사이에 근본적으로 닿을 수 없는 거리라는 것은, 분명히 존재한다."
70014050-100 = "3;카이;02;그리고 나는 그 거리감을 남들보다 더 잘 느끼고 있다…… 고 생각했다."
70014050-101 = "[s] \"왜…… 그런 식으로 생각하게 되었어?\""
70014050-102 = "3;카이;06;……글쎄."
70014050-103 = "#st;[0,0];instant;1;"
70014050-104 = "#clearST"
70014050-105 = "3;카이;99\n#wait;1000"
70014050-106 = "3;카이;00;그걸 알 수 있었다면, 나도 조금은 더 '보통의' 삶을 살 수 있었을지도 모르지."
70014050-107 = "3;카이;99;하지만 내가 분석하기에 나는 아마도……. 그렇게 태어났던 것이다."
70014050-108 = "3;카이;05;아니, 그렇게 만들어졌던 것이었을 터다."
70014050-109 = "[s] \"만들어졌다……?\""
70014050-110 = "3;카이;99;뭐, 생물학적인 비유다. 모든 생명은 세포로부터 만들어지고 창조된 결과물이 아닌가."
70014050-111 = "#all;hide"
70014050-112 = "#na;카이;세상에는 그렇게 시작하는 사람들이 있다, 선생."
70014050-113 = "#na;카이;결코 다수는 아니지만, 유독 타인에 대한 것을 이해하지 못하는 사람들."
70014050-114 = "#na;카이;타인의 사고방식, 감정, 행동 원리……. 그런 것들을 직감적으로 느끼지 못하고, 하나하나 이론적으로 분석해야만 알아 갈 수 있는 사람들."
70014050-115 = "3;카이;99\n#3;a"
70014050-116 = "3;카이;02;그런 사람 중에서도, 나는 조금 더 그 성향이 강했던 것 같다."
70014050-117 = "3;카이;01;거기에 이유는 없다. 까닭도 없다. 나는 그저…… 처음부터 그런 인간이었던 것이고."
70014050-118 = "3;카이;05;여러 가지 이유로, 그런 성향이 강해지는 쪽으로 자라 왔을 뿐이지."
70014050-119 = "3;카이;99;여전히 타인에게 도움을 주고, 그 도움이 크게 빙 돌아, 자신에게 돌아온다는 개념에 대해서는 잘 모르겠다."
70014050-120 = "3;카이;02;그런 일이 일어날 수 있다는 것을 알고는 있지만, 그다지 선호하지는 않는다. "
70014050-121 = "3;카이;05;무엇보다 시간이 오래 걸리니까 말이지. 비효율적인 과정이다."
70014050-122 = "[s] \"그래서 힘으로 굴복시키는 방법을 사용해 왔던 거야?\""
70014050-123 = "3;카이;99;그래. 그런 식이었다."
70014050-124 = "3;카이;00;그건 빠르고, 즉각적이며, 내가 원하는 결과를 곧바로 얻을 수 있으니까. 그러나……."
70014050-125 = "3;카이;99;……모르겠군. 이렇게 '알 수 없다'는 느낌이 드는 것은, 실로 오랜만이다.\n#3;em;[속상함]"
70014050-126 = "3;카이;06;무언가를 놓친 것 같은데, 그게 무엇인지 좀처럼 알 수 없다."
70014050-127 = "3;카이;05;이 부분에 대한 답을 내놓는 것이, 최종적으로 선생이 나와 지켜야 할 '약조'가 되는 것이겠지. "
70014050-128 = "[s] \"그렇다면, 공부를 해 보는 건 어떨까?\""
