[translation]
52270-1 = "제27화;끝내 붙잡은 옷자락"
52270-11 = "결국 여기까지 도달했구나, 나구사."
52270-12 = "아야메, 나는……"
52270-13 = "구태여 무슨 말을 하고 싶은 건지 설명할 필요는 없어."
52270-14 = "네가 나눈 모든 대화는 여기서 계속[ruby=히토츠메] 눈 [/ruby]으로 지켜보고 있었으니까."
52270-15 = "이해니, 불가해니…… 정말 웃기지도 않는 촌극이야."
52270-16 = "네가 무슨 말을 하더라도 내가 너를 이해할 일은 없을 거야."
52270-17 = "어차피 나는 너를, 사람들을 이해하고 싶지도 않거든."
52270-18 = "아야메. 나는 네 이해를 바라고 여기에 온 게 아니야."
52270-22 = "그럼?"
52270-23 = "네가 짊어지고 있는, 마지막 책임을 넘겨받기 위해 왔어."
52270-27 = "……백화요란 분쟁조정위원회의 위원장, 나나카도 아야메."
52270-28 = "백화요란의 업무를 등한시하고 학생들을 위험에 빠트린 책임을 물어 귀관에게는 위원장의 자격이 없다고 판단."
52270-33 = "……너에게 계승전을 신청한다."
52270-40 = "언제나 울기나 했던 주제에 꽤나 건방져졌네."
52270-41 = "자, 잠깐. 혼자서 상대해도 괜찮겠어?"
52270-42 = "그, 그렇사와요! 아야메 선배가 상대라면 모두 함께 상대하는 편이……"
52270-44 = "여럿이서 함께 덤빈다고 해서 결과가 달라지지는 않을 거야."
52270-45 = "렌게와 유카리에게는 선생님의 호위를 부탁할게."
52270-46 = "그리고…… 백화요란 계승전에는 조건이 필요하잖아?"
52270-47 = "계승전이 공평한 잣대로 이루어진 의식임을 입증해 줄, 백화요란 소속 외의 참관인 1명과……"
52270-48 = "계승전이 정당히 이루어졌음을 보증해 줄 백화요란 소속의 간부급 부원 1명."
52270-52 = "키쿄, 선생님. 계승전의 증인을 부탁해."
52270-56 = "……알겠어."
52270-58 = "[ns] \"기꺼이 증인이 되어줄게.\""
52270-63 = "쓸데없는 절차를 중시하는 건 여전하구나."
52270-64 = "하지만…… 그래, 알았어. 매듭을 짓는 건 중요하니까."
52270-69 = "백화요란 분쟁조정위원회 부장, 나나카도 아야메."
52270-70 = "도전자 고료 나구사의 계승전 신청을 받아들이도록 하겠어."
52270-82 = "………윽!"
52270-83 = "………."
52270-84 = "대단해…… 나구사 선배가 그 아야메 부장과 호각으로 맞서고 있잖아?"
52270-85 = "근소한 차이긴 하지만, 이대로 승부를 이어 나간다면…… 승산이 있을지도 모르는 것이와요!"
52270-95 = "(어째서…… 어째서 압도할 수 없는 거지?)"
52270-96 = "(나구사 따위가. 나구사 따위에게……)"
52270-98 = "……왜 그렇게 필사적인 거야?"
52270-102 = "필사적이라고……?"
52270-103 = "전력을 다하고 있는 건 네 쪽이 아니었던가? 허세를 부리긴."
52270-104 = "아니…… 네 움직임, 네 호흡, 네 표정을 통해 알 수 있어."
52270-105 = "이전에 대련을 할 때와는 달리, 행동 하나하나에 패배해서는 안 된다는 절박함이 묻어나고 있으니까."
52270-106 = "져줄 생각이었더라면 처음부터 계승전에 응하지도 않았을 거야."
52270-107 = "아직도 부장의 자리에 미련이 남아 있었던 거야?"
52270-108 = "그랬더라면 모든 걸 내려놓고 돌아왔으면 좋았을 것을."
52270-109 = "내려놓으라고……?"
52270-110 = "지위도, 욕망도, 간절함도 내려놓으면…… 내게 무엇이 남는데?"
52270-114 = "아무도 이해하지 못하고, 아무에게도 인정받지 못한다면, 나는 무엇을 위해 살아가야 하는데!"
52270-119 = "……이유가 꼭 필요해?"
52270-120 = "그냥…… 그냥 살아 있어도 괜찮잖아."
52270-122 = "그냥 날이 좋아서, 볕을 머금은 마루의 따스함이 좋아서, 야시장에서 풍겨오는 음식 냄새가 좋아서……"
52270-123 = "일상의 사소한 모든 것이 내일을 기대하기에 충분한데, 그렇게 필사적으로 이유를 찾을 필요는 없잖아."
52270-127 = "나는 네가 있기만 해도 충분했는데……"
52270-128 = "나는……"
52270-132 = "……안 본 사이 꽤나 성장했구나, 나구사. 혓놀림만으로 나를 흔들리게 하다니."
52270-141 = "더 이상 그런 헛된 술수는 통하지 않아."
52270-147 = "내 가치는 이것으로 증명해 보일 테니까."
52270-161 = "하아…… 다 끝나버렸네."
52270-165 = "축하해, 나구사. 이제 네가 부장이야."
52270-166 = "그렇게 수백 번을 도전해도 한 번을 이기지 못하더니, 끝내 네가 이겼구나."
52270-167 = "축하할만한 일이야. 가슴을 펴고 기뻐해도 좋아."
52270-173 = "그런데 왜……"
52270-174 = "……그런 표정으로 울고 있는 거야."
52270-176 = "……미안해, 아야메."
52270-179 = "정말 미안해, 아야메."
52270-180 = "그동안 네 시선을 외면하고 있어서, 네 절규에 귀를 기울이지 않아서……"
52270-184 = "줄곧 내밀고 있던 그 손을 알아차리지 못해서 미안해."
52270-185 = "괴로웠을 너에게 기대기만 해서 미안해."
52270-186 = "언제나 부족한 나지만, 너에 비하면 보잘것없는 나지만, 그 손만큼은 절대 놓지 않을게."
52270-187 = "너의 괴로움과 함께 있을게……"
52270-191 = "정말, 정말 미안해. 아야메……"
52270-196 = "……역시, 나는."
52270-197 = "너의 그 우는 얼굴이 제일 싫었어."
52270-201 = "다음화;함께 꽃이 피길 기다리며"
