[translation]
10059050-1 = "제5화;대대적인 수색"
10059050-2 = "(다음 날. 예술 평의회에 모여 정보를 취합했다.)"
10059050-3 = "(그리고 동일한 인물이 이 사건에 개입했을 가능성을 확인했다.)"
10059050-5 = "[ns1] \"지금까지 만난 적 없던 일곱 죄수.\"\n[ns2] \"배금의 브로커…….\""
10059050-8 = "블랙마켓 쪽에서 활동하는 유명한 죄수라고 해요……."
10059050-9 = "불법적인 상품 유통을 중개하고 수수료를 받아 잇속을 챙긴다는데……."
10059050-10 = "그 외에도 철도 운송을 이용한 다양한 불법 사업을 하는 것으로 보여요."
10059050-11 = "이번엔 어째선지 프리미엄 우유 유통에도 손을 대고 있다는 소문인데……."
10059050-12 = "아직까지는 소문뿐이라 발키리도 조사에 난항을 겪는 모양이더라고요……."
10059050-13 = "……제가 입수한 것과 같은 정보군요. 이 정보가 사실이라면 그 브로커라는 인물은……."
10059050-14 = "[s3] \"우유 유통망을 이용해 작품을 빼돌려서…….\"\n[s4] \"블랙마켓의 자금 세탁에 활용한 건가?\""
10059050-17 = "구체적인 정황은 아직 수면 위로 떠오르지 않았지만, 그럴 확률이 높은 것 같습니다."
10059050-18 = "우리 학원은, 자애의 괴도에 이어서 또 다른 일곱 죄수와 싸워야 하는 것이군요."
10059050-19 = "일단 학원 내의 유제품 통제에 들어가긴 했습니다만, 이건 본질적인 해결책이 아닙니다."
10059050-20 = "불법적인 일에 와일드헌트의 이름이 이용됐다는 현실은 변하지 않으니까."
10059050-21 = "지금은 확실한 물증이 필요합니다."
10059050-22 = "그러니…… 본격적으로 내부의 수색을 시작하죠."
10059050-23 = "분명 누군가가 브로커와 결탁해 학생들을 꼬드겼을 거예요."
10059050-24 = "그게 아니라면 우리 와일드헌트의 학생들이, 돈에 눈이 멀어 작품과 명예를 팔아 치울 리가 없어요."
10059050-25 = "우라라 부회장. 즉시 사감대를 집합시키세요."
10059050-26 = "기숙사 구석구석, 개미 한 마리까지 남김없이 조사해 확실한 증거를 확보하는 겁니다."
10059050-27 = "저, 그게…… 마나미 님. 죄송하지만 이런 대규모 불심검문은 학생들의 엄청난 반발이……."
10059050-28 = "이건 학원의 위신이 걸린 문제입니다. 더 이상 미루어 둘 수는 없어요."
10059050-29 = "불만의 목소리가 나오거든, 모두 저의 뜻이라 하세요."
10059050-30 = "학원의 명예를 위해서라면, 저의 평판 따위 어찌 되든 상관없습니다."
10059050-31 = "……으, 으으으."
10059050-35 = "네…… 알겠어요. 사감대를 집합시킬게요."
10059050-41 = "[ns] \"정말로 괜찮은 거야?\""
10059050-42 = "……괜찮습니다."
10059050-43 = "이걸로…… 우리 학원과 학생들을 지킬 수만 있다면."
10059050-52 = "불심검문이다! 다들 머리에 손 올리고 천천히 밖으로 나와!"
10059050-53 = "어머나. 이런 일은 처음이네요."
10059050-54 = "샤아아악! 선배들! 또 무슨 사고를 친 거야?!"
10059050-55 = "이히히…… 잘 모르겠는데……."
10059050-56 = "설마…… 평의회장 박물관 침투 계획이 들킨 건가요?"
10059050-57 = "응? 무슨 말을 중얼거리는 거야?"
10059050-58 = "수상하군. 바로 몸수색에 들어가겠어."
10059050-59 = "거기 너! 모자부터 벗어!"
10059050-60 = "네? 뭐, 뭘 벗으라고요?!"
10059050-61 = "이, 이런 파렴치한! 발가벗으라는 말을 아무렇지도 않게 하다니……!"
10059050-62 = "헛소리하지 말고, 빨리 벗어요!"
10059050-68 = "꺄, 꺄아아악……!!"
10059050-71 = "그…… 정말 죄송해요……. 저도 이러고 싶진 않았는데……."
10059050-72 = "하지만 평의회장님의 명령이라……."
10059050-73 = "부회장까지 온 걸 보면…… 역시 들킨 건가. 이럴 땐……."
10059050-77 = "정말 죄송해요. 잘못했어요. 한 번만 용서해 주세요……!"
10059050-78 = "불쌍한 척해도 소용없어! 싹 다 잡아가……!"
10059050-79 = "후후, 어쩔 수 없네요. 가서 잘 설명을 해드리는 수밖에."
10059050-80 = "으으으, 내가 어쩌다 정말……."
10059050-82 = "한편, 다른 곳에서도……."
10059050-85 = "미, 미요 쨩? 어째서 네 방에 금지된 고카페인 음료가 있는 거야……?"
10059050-86 = "아, 저……. 이, 이건 그러니까 그게……!"
10059050-87 = "이, 이건 작품 활동 때문에 빈 캔만 들여온 거야!"
10059050-88 = "마, 맞아요! 금지된 품목을 재활용해서, 새로운 예술로 탄생시키는 프로젝트를 진행 중이었죠!"
10059050-89 = "으음…… 빈 캔만 들여온 거니?"
10059050-90 = "그럼 문제없겠네."
10059050-91 = "문제가 왜 없어요! 하여간 일 대충 한다니까!"
10059050-92 = "일단 봐 버린 이상 어쩔 수 없어."
10059050-93 = "다들 따라와. 더 큰 문제가 생기는 걸 막기 위해서라도."
10059050-94 = "재빨리 전부 마셔서 다행인가……."
10059050-95 = "쉬잇!"
10059050-96 = "우으으으…… 미안해요, 히로미 쨩……."
10059050-102 = "뭐, 뭐야? 내가 뭘 잘못했다고 끌고 가는 거야?!"
10059050-103 = "이런 불온서적을 숨겨두고 있었으면서 뻔뻔한 반응이구나."
10059050-104 = "불온서적이라니? 그 예술적인 만화책이?"
10059050-105 = "이 수상한 만화책이 어딜 봐서 예술적이라는 거야!"
10059050-106 = "뭐? 너, 이거 아직 안 봤지? 봤다면 그런 말 절대 못 해!"
10059050-107 = "아슬아슬하게 검열과 편집을 줄타기하는 명작 중의 명작이라고!"
10059050-111 = "……정말?"
10059050-112 = "그렇게 말하니까…… 갑자기 궁금하긴 한데……."
10059050-117 = "에그머니나……!!"
10059050-118 = "잠깐만요! 같이 잡혀가기 싫으면 얼른 덮어요!"
10059050-119 = "미, 미안!"
10059050-124 = "자! 이상한 수작 부리지 말고 순순히 따라오세요! #n하나라도 수상하면 다 잡아 오라는 평의회장님 명령이니까!!"
10059050-125 = "으으으……! 지가 평의회장이면 다야?! 이건 횡포라고!!"
10059050-127 = "(이후로도 계속 대규모 수색이 이어졌다.)"
10059050-129 = "마나미 님. 여러 보고가 들어오고 있습니다만, 아직 배금의 브로커와 연관된 것은 없습니다."
10059050-130 = "대부분이 사소한 것들."
10059050-131 = "특이 사항은 마나미 님의 박물관에 침입을 꾀한 자들이 있다는 것 정도입니다만."
10059050-132 = "4동 404호 분들인가요?"
10059050-133 = "그렇습니다."
10059050-134 = "그분들의 다음 목표가 제 박물관이 될 거라는 건 이미 알고 있었습니다."
10059050-135 = "숨겨진 것에 강한 호기심을 느끼는 분들이니까요. #n그 밖에 특이 사항은 없었나요?"
10059050-136 = "그 외에…… 예상대로 학생들의 반발이 큰 모양입니다."
10059050-137 = "일단 말씀대로 사감대가 강제 진압을 하고 있습니다만……."
10059050-138 = "계속 진행하세요. 예상했던 사항입니다."
10059050-139 = "지금은 다른 것보다 조사가 먼저예요. 어떻게든 브로커와 결탁한 인물을 찾아야 합니다."
10059050-140 = "[s] \"마나미. 정말 만일인데 말이야.\""
10059050-145 = "[ns5] \"브로커와 결탁해 학생들을 부추긴 인물이 없다면…….\"\n[ns6] \"돈에 눈이 먼 학생들 스스로가 자초한 위기였다면…….\""
10059050-148 = "……작품을 팔아넘긴 학생들을 엄벌하는 수밖에 없겠죠."
10059050-149 = "다시는 이와 같은 일이 일어나지 않도록 말이에요."
10059050-150 = "……."
10059050-152 = "……이상이 마나미 님의 뜻이니, 계속 조사를 부탁드립니다. 우라라 님."
10059050-157 = "(으으, 이렇게 계속 학생들을 자극하면 좋지 않은데…….)"
10059050-158 = "(이런 대규모 조사가 이어지면 '그분'의 안전도 위험하고…….)"
10059050-163 = "(……어쩔 수 없네요. 이쪽도 행동에 나서는 수밖에.)"
10059050-164 = "(죄송해요, 마나미 님.)"
10059050-165 = "(명령을, 어겨야겠어요.)"
10059050-169 = "저기…… 사감대 여러분? 급한 용무가 생겨서 잠시 자리를 비워야 할 것 같아요."
10059050-170 = "혹시 무슨 일이 생기면 바로 연락하세요."
10059050-171 = "네! 걱정 말고 다녀오세요!"
10059050-178 = "……네. 저예요."
10059050-179 = "죄송하지만 이번 일에 대해…… 당신과 이야기를 나누고 싶어요."
10059050-180 = "아…… 네. 감사해요. 그럼 그 장소에서 기다리고 있을게요."
10059050-187 = "아, 먼저 도착해 계셨군요."
10059050-188 = "죄송해요. 갑작스러운 연락이었을 텐데."
10059050-192 = "아니에요. 마침 저도 당신과 이야기를 나누고 싶었으니까."
10059050-193 = "통화 기록이 남지 않는 안전한 곳에서 말이에요."
10059050-194 = "후후, 그랬군요. 마음이 일치해서 다행이네요……."
10059050-195 = "그럼…… 단도직입적으로 말할게요."
10059050-196 = "죄송하지만, 비밀리에 부탁을 하나 드리고 싶어요."
10059050-197 = "사감대의 미리아 님이 아닌……."
10059050-199 = "[log=우라라]자애의 괴도.[/log]"
10059050-201 = "[log=우라라]키요스미 아키라 님에게.[/log]"
