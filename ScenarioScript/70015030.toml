[translation]
70015030-1 = "イブキ家出事件（３）"
70015030-5 = "い、いらっしゃい。ここが私たちの事務所よ……。今お茶を出すわね。"
70015030-6 = "はい。結構なお点前よね。"
70015030-10 = "それ、後半はもらった側のセリフだから。"
70015030-18 = "わ～！カッコいい！！"
70015030-22 = "ふふ、気に入りましたか……イブキ……。"
70015030-23 = "うん！大人がお仕事する場所って感じ！"
70015030-27 = "え、ええ！そうでしょう！"
70015030-28 = "（今月は家賃を払えててよかったわ……下手したらテントを見せる羽目に……）"
70015030-32 = "……外では何度かお会いしましたが、ここに来るのは初めてですね。"
70015030-33 = "そうだね。#n……本音を言えば、アコがここに来るような機会は来ないで欲しかったけど。"
70015030-34 = "ええ、そうですね。その逆も然り、です。"
70015030-35 = "ふっ。"
70015030-36 = "でも、そんな機会が来ちゃったからね……ゆっくりしていってよ。"
70015030-37 = "……。"
70015030-38 = "ここが、あなたが見つけた居場所なんですね。"
70015030-42 = "……うん。"
70015030-43 = "……どう？"
70015030-44 = "……手狭ですし、ごちゃごちゃしていて気が散りますが……。"
70015030-45 = "まあ、悪くないですね。"
70015030-46 = "……そう。"
70015030-50 = "おねえちゃん！イブキ、これ読んでみる！"
70015030-51 = "え、ええ。難しいけど、読めるかしら？"
70015030-52 = "うん！い、いちにち……一日一悪、だよね？"
70015030-53 = "せ、正解よ……。"
70015030-54 = "どういう意味なの？"
70015030-55 = "そ、それは……！"
70015030-56 = "アルちゃん、まさか子どもに教えちゃうのー？"
70015030-57 = "うっ……！"
70015030-58 = "うん？イブキ、まだ子どもだけど色んなの知ってるよ！"
70015030-59 = "くふふっ、そう？じゃあ、アルちゃ……うちの社長が教えても大丈夫だね。"
70015030-60 = "うん！教えて、アルおねえちゃん！"
70015030-61 = "え、えーっと……これはね……。"
70015030-62 = "……一日一つ、悪いことをする……という意味よ……。"
70015030-63 = "……。"
70015030-64 = "我が便利屋の座右の銘よ！#n何も恐れず、何にも縛られないハードボイルドなアウトローなの……！"
70015030-65 = "（い、言っちゃった！怖がらせちゃったらどうしよう……！？）"
70015030-69 = "うん？"
70015030-70 = "だ、だから、私たちは悪党なの！すごく怖い人なのよ！"
70015030-71 = "おねえちゃんたちは、悪党じゃないよ？"
70015030-76 = "みんな、すっごく優しいもん！"
70015030-77 = "一人で寂しかったイブキと一緒に遊んでくれて……。"
70015030-78 = "えっと、それは……。"
70015030-79 = "お菓子もいっぱい買ってくれて、シーソーとブランコにも乗せてくれたよ。"
70015030-80 = "おててだって、つないでくれたよね？"
70015030-81 = "……。"
70015030-82 = "うん！やっぱりおねえちゃんたちは悪党じゃない！"
70015030-83 = "くふふっ。だってさ、アルちゃん？"
70015030-84 = "ぐぬぬ……。"
70015030-85 = "……たしかに、昔よりはマシになりましたね。"
70015030-86 = "……！"
70015030-87 = "トラブルメーカーで、私たちと衝突することはありますが……。"
70015030-88 = "一線は、越えない人たちだと思っています。"
70015030-89 = "そ、そう言われると複雑だけど……。"
70015030-90 = "あれ？それってつまり、もう私たちを捕まえないってこと？"
70015030-91 = "まさか。一線を越えたら即刻逮捕です。"
70015030-92 = "ちぇ～。"
70015030-94 = "あっ！これ、イブキ上手だよ！ハルカおねえちゃん、一緒にしよう？"
70015030-95 = "バランスゲームですか？……いいですよ、えへへっ。"
70015030-101 = "ふぅ……。えーっと……あなたもお客様なのだから、ゆっくりしていってちょうだい。"
70015030-102 = "何か飲むかしら？"
70015030-103 = "ありがとうございます。では、コーヒーで。"
70015030-104 = "砂糖とミルクは？"
70015030-105 = "？いえ、そのままブラックでお願いします。"
70015030-106 = "え？ええ、分かったわ……。"
70015030-107 = "砂糖もミルクもなし……！？#nあんな苦いのをそのままなんて……か、カッコいいじゃない……！"
70015030-109 = "（時間が経ち……）"
70015030-112 = "やったー！今回はイブキの勝ち～！！"
70015030-113 = "す、すごいです、イブキ。他のルールでもやってみますか？"
70015030-114 = "やるー！"
70015030-119 = "……なんだか、癒されますね。"
70015030-120 = "と、ところで、イブキはずっとここにいていいのかしら？#n万魔殿が探してると思うんだけど……？"
70015030-124 = "それなら、そろそろ着くころでしょう。"
70015030-125 = "な？なにが？"
70015030-126 = "先ほどイブキちゃんの居場所を教えたので、もう間もなくかと……。"
70015030-127 = "だ、誰に！？"
70015030-128 = "もちろん、万魔殿にです。"
70015030-129 = "な、なんですってえ！？"
70015030-130 = "これはちょーっとマズいんじゃない？"
70015030-131 = "わ、私たちの住所を勝手に晒してどういうつもり！？#nしかも、よりによって万魔殿に……！"
70015030-132 = "晒すって……ここのことなんて、とっくに知ってますよ？"
70015030-133 = "え？"
70015030-134 = "風紀委員会も、万魔殿も……それくらいは当然把握しています。"
70015030-135 = "あなた達だって、秘密裏に活動しているわけでもないでしょうに。"
70015030-136 = "あ。"
70015030-137 = "そういえば、そうね……？"
70015030-138 = "部活としては不認可だけど、事業者登録はしてるからね。"
70015030-139 = "い、いや！それとこれは別でしょ！というか、万魔殿がここに来るってことは……！"
70015030-144 = "イブキィー！！"
70015030-152 = "イブキィー！！！"
70015030-153 = "ま、マコト先輩！"
70015030-154 = "イブキ！私が悪かった！この通りだ！！許してくれぇ！！！"
70015030-155 = "マコト先輩……だ、大丈夫……？"
70015030-156 = "わー、すっごい顔。"
70015030-157 = "マコト議長……！"
70015030-158 = "あ、アル様！ど、どうしましょう……！？や、やっぱり殺しますか？"
70015030-159 = "お、落ち着きなさい、ハルカ！"
70015030-169 = "お邪魔するわね。"
70015030-170 = "初めまして、便利屋68の皆さん！イブキちゃんがここにいると聞いて参りました！"
70015030-171 = "……失礼します。"
70015030-172 = "万魔殿の、役員が全員……。"
70015030-177 = "あ、アル様～！！"
70015030-178 = "アルちゃん！深呼吸、深呼吸！！"
70015030-180 = "い、イブキ……本当に悪かった……もう二度としない……。"
70015030-181 = "……本当？"
70015030-182 = "ああ！本当だ！"
70015030-183 = "じゃあ、イブキのプリンだけじゃなくて……。#nみんなのプリンも勝手に食べないって約束して。"
70015030-184 = "ぐっ！そ、それは……。"
70015030-185 = "……分かった。約束しよう。"
70015030-189 = "はい、ゆびきりげんまん～"
70015030-190 = "……フッ。嘘ついたら針千本だな。"
70015030-191 = "うん！えへへ。"
70015030-192 = "マコト先輩のこと、許すね。"
70015030-196 = "ほ、本当か……！ああ、まるで海のように広大な心だ……！"
70015030-197 = "では、万魔殿へ帰ろう。謝罪の気持ちとしてプリンも10個買っておいたからな。"
70015030-198 = "わ～！あ、でも……おねえちゃんたちにご挨拶しないと。"
70015030-199 = "お、おねえちゃんたち、だと……？"
70015030-200 = "うん！イブキと遊んでくれて、お菓子も買ってくれたの！"
70015030-205 = "フッ、便利屋68か……。"
70015030-206 = "わ、私たちを知っているの？"
70015030-207 = "キシシッ……当然だろう。[ruby=りくはちま]陸八魔[/ruby]アル。#nお前たちは要注意人物だからな。"
70015030-208 = "名前まで……！"
70015030-209 = "だが……。"
70015030-210 = "この[ruby=はぬま]羽沼[/ruby]マコト様は、お前たちに指図するつもりはない。"
70015030-211 = "えっ……。"
70015030-212 = "お前たちが行っているものも、自由の一つ。"
70015030-213 = "学籍がどうなっていようが、生徒が己の夢を叶えることは奨励すべきだ。"
70015030-214 = "……！！"
70015030-215 = "アルちゃん、これって……？"
70015030-216 = "その上独自のビジネス手腕を持っているとくれば、もうこれ以上言うことはない。"
70015030-217 = "この寛大なマコト様は、多少の違法行為は見逃すということだ。キシシッ。"
70015030-218 = "我々万魔殿は、あの頑固な風紀委員会とは違うからな！"
70015030-219 = "はあ？せっかく助けてあげたのに、どこまで恩知らずなんですか！"
70015030-220 = "マコト先輩！アコ先輩がイブキを探しにここまで来てくれたんだよ～！"
70015030-221 = "……そういえば、イブキの居場所を教えてくれたのは#n[ruby=あまう]天雨[/ruby]アコ行政官だったか……。"
70015030-222 = "……。"
70015030-223 = "……。"
70015030-224 = "今のは忘れろ！"
70015030-225 = "忘れるわけないでしょう！？"
70015030-228 = "このたびは……本当にありがとうございました。"
70015030-229 = "い、いえ……当然のことをしたまでよ。"
70015030-230 = "謙遜しなくてもいいのに。#nイブキちゃんは私たちの大切な後輩なんだから、感謝されて当然よ。"
70015030-231 = "くふふっ、それなら遠慮なく感謝されるね～！"
70015030-235 = "この机……少し古そうね。万魔殿で使っているものでよかったらあげましょうか？"
70015030-236 = "え、ええ？本当？"
70015030-237 = "原木を使った机なんだけど、趣味じゃないなら言ってね。"
70015030-238 = "（ここですぐ受け取ってしまうのはカッコ悪いわね……まずは一回断って……）"
70015030-242 = "うーん、どうかしら。この事務所はインテリアにこだわっているから――"
70015030-243 = "やっぱりそうよね。失礼したわ。"
70015030-244 = "あ、あれ？"
70015030-247 = "……。"
70015030-248 = "……。"
70015030-249 = "久しぶりだな……[ruby=おにかた]鬼方[/ruby]カヨコ。"
70015030-253 = "……元気そうで何より。"
70015030-254 = "当然だ。ゲヘナのトップとして、重大な責任と使命を背負っているからな。キシシッ。"
70015030-255 = "相変わらずみたいだね。"
70015030-256 = "ふん。今日はイブキの件で、期せずしてここに来たわけだが……。"
70015030-257 = "こうして直接会ったからには、一つ聞きたいことがある。"
70015030-258 = "……。"
70015030-259 = "何故万魔殿に来なかった？本来なら、お前も所属すべきだっただろう。"
70015030-260 = "……前の生徒会とは全然違うらしいね。"
70015030-261 = "無論だ。このマコト様がいる限り、昔のようになることはありえない。"
70015030-262 = "……それならいい。"
70015030-263 = "もう部外者なんだから、私の考えなんてどうでもいいでしょ。"
70015030-264 = "万魔殿の議長はあんたで、ゲヘナはあんたが作っていくんだから。"
70015030-265 = "キキッ、そうか……そうだな。"
70015030-266 = "それに、私の居場所はここだから。"
70015030-267 = "ハードボイルドを目指すけど生まれつきお人よしな社長、いたずら好きでも#nやる時はやる室長、そしてたまに心配になるけど繊細で純粋な社員……。"
70015030-268 = "そんなみんながいる……この便利屋68こそが、私の居場所だよ。"
70015030-269 = "……ふむ。"
70015030-270 = "ならいい、キシシッ。"
70015030-271 = "うん。"
70015030-273 = "あ、そうだ。皆さん、イブキちゃんと一緒に写真撮りませんか？"
70015030-274 = "ええ！？しゃ、写真……ですか？"
70015030-275 = "はい！これも何かの縁ですし！イブキちゃんはどうです？"
70015030-276 = "うん！イブキもおねえちゃんたちと写真撮りたい～！！"
70015030-277 = "くふふっ、面白そ～！ほら、カヨコちゃんも早く～！"
70015030-278 = "……うん。"
70015030-280 = "では！こちらに立ってください！"
70015030-281 = "こ、ここでいいの？"
70015030-282 = "じゃあ撮りますよ～！"
70015030-283 = "はい！チーズ！"
70015030-291 = "……今回は世話になったな、便利屋68。"
70015030-292 = "キキッ、引き続きこのマコト様が見ていることを忘れるなよ！"
70015030-293 = "うっ……。"
70015030-294 = "さあ、行くぞ！"
70015030-299 = "お邪魔したわね。"
70015030-300 = "写真、あとで送りますね～！"
70015030-301 = "おねえちゃんたち、ありがとう！絶対にまた遊ぼうね！"
70015030-302 = "わ、私も楽しかったです……また会いましょう、イブキ！"
70015030-303 = "まったね～！くふふっ。"
70015030-308 = "……。"
70015030-309 = "……何か言いたそうだね。"
70015030-310 = "ええ……。"
70015030-311 = "これだけは伝えておいたほうがいいと思いまして。"
70015030-312 = "……まさか。"
70015030-316 = "……「嵐」の動きが確認されました。"
70015030-317 = "……！！"
70015030-318 = "あなたは今、この手の情報収集に不利な立場にいますから。"
70015030-319 = "……うん、ありがとう。"
70015030-320 = "……気をつけてください。もう昔のようなことはしたくありません。"
70015030-321 = "私もだよ。……アコも気を付けて。"
70015030-322 = "ふっ、お互い様ですね。"
70015030-323 = "では、また。"
70015030-327 = "…………。"
70015030-329 = "うっ……げほっ、げほっ！や、やっぱり苦い！！"
70015030-330 = "どしたの、アルちゃん？急にブラックコーヒーなんか飲んで。"
70015030-331 = "あ、アル様……！大丈夫ですか！？#nこのコーヒーが原因ですね！撃ちましょうか！？"
70015030-332 = "……。"
70015030-333 = "ふふっ。"
70015030-335 = "社長、牛乳でも飲んで落ち着いて。"
70015030-336 = "うぅ……！"
70015030-337 = "イブキ家出事件"
