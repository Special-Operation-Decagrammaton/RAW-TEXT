70015030-129 = "ว่าไงนะ~~~?!?!"
70015030-130 = "เอ๋ แบบนี้ก็อาจจะงานเข้าน่ะสิ"
70015030-131 = "ดะ... เดี๋ยวสิ บอกฐานที่ตั้งของพวกเราไปโดยพลการได้ยังไง?! แถมยังบอกกับพวกแพนเดโมเนียม โซไซตี้อีก...!!"
70015030-132 = "คะ? เปล่าสักหน่อยค่ะ ที่อยู่ของพวกคุณน่ะ น่าจะรู้กันมาตั้งนานแล้วนะคะ"
70015030-133 = "หืม?"
70015030-134 = "เรื่องแค่นี้ทั้งคณะกรรมการวินัย และแพนเดโมเนียม โซไซตี้ ก็ต้องมีข้อมูลอยู่แล้วค่ะ"
70015030-135 = "พวกคุณไม่ได้ทำงานกันอย่างลับๆ สักหน่อย แถมที่นี่ก็เป็นสถานประกอบการด้วย"
70015030-136 = "อ่า"
70015030-137 = "คิดดูแล้วก็จริงด้วยนะ...?"
70015030-138 = "แค่ไม่ได้รับอนุญาตเรื่องชมรม แต่เราก็จดทะเบียนธุรกิจด้วยนี่นะ"
70015030-139 = "มะ... ไม่สิ! ยังไงเรื่องนั้นกับเรื่องนี้ก็คนละเรื่องกัน! พวกแพนเดโมเนียม โซไซตี้จะมาที่นี่เลยนะ...!"
