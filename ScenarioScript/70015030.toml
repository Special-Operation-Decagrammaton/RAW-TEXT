70015030-307 = ""
70015030-308 = "……"
70015030-309 = "……有話想說嗎？"
70015030-310 = "是的，我猶豫了很久……"
70015030-311 = "但我覺得這件事還是告訴你比較好。"
70015030-312 = "……難道說。"
70015030-313 = ""
