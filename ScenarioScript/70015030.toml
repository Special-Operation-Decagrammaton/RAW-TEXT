70015030-54 = "แปลว่าอะไรเหรอ?"
70015030-55 = "อ๊ะ คะ... คือว่า...!!"
70015030-56 = "ประธาน จะบอกความหมายจริงๆ เหรอ? อิบูกิยังเด็กอยู่เลยนะ จะดีเหรอ?"
70015030-57 = "อึก...!!"
70015030-58 = "หืม? อิบูกิยังเด็กก็จริง แต่เรื่องที่ควรรู้ อิบูกิก็รู้ทุกอย่างนะ!"
