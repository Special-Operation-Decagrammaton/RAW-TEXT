[translation]
70015030-1 = "이부키 가출사건 3"
70015030-5 = "자…… 어, 어서들 오라구."
70015030-6 = "귀한 곳에 누추한 분들을 모시게 되어 미안하지만……."
70015030-10 = "반대야, 사장."
70015030-18 = "와아~!! 멋있어!!"
70015030-22 = "후후, 마, 마음에 드나요…… 이부키……."
70015030-23 = "응, 응! 사무실이야~ 어른들이 일하는 곳!!"
70015030-27 = "오홋홋! 그렇지? 그렇게 보이지? 멋지지?"
70015030-28 = "(이번 달에는 월세를 제때 내서 다행이야…… 하마터면 텐트에서 맞이할 뻔했잖아…….)"
70015030-32 = "그간 밖에서는 꽤 마주쳤지만, 여기에 와보는 건 처음이네요."
70015030-33 = "……웬만하면 올 일이 없기를 바랐지만 말이야."
70015030-34 = "네, 그랬겠죠. 그 반대도 마찬가지고요."
70015030-35 = "훗."
70015030-36 = "아무튼 일이 이렇게 되었으니…… 편히 있다 가도록 해."
70015030-37 = "……."
70015030-38 = "여기가, 당신이 찾은 보금자리인가요."
70015030-42 = "……아아."
70015030-43 = "감상은?"
70015030-44 = "……좁고, 잡동사니도 많이 쌓여있는 데다가, 이래저래 정신없는 공간이지만……"
70015030-45 = "뭐, 나쁘지 않네요."
70015030-46 = "……그래."
70015030-50 = "언니! 예쁜 아루 언니! 이부키가 이거 읽어볼게!"
70015030-51 = "으응? 이, 읽을 수 있으려나?"
70015030-52 = "응! 일…… 일일…… 일, 일일일악(一日一惡) 맞지?!"
70015030-53 = "마, 맞아……."
70015030-54 = "무슨 뜻이야?"
70015030-55 = "앗, 그, 그게……!!"
70015030-56 = "사장, 설마 말할 셈이야? 이부키는 아직 아이인데, 괜찮을까?"
70015030-57 = "으읏……!!"
70015030-58 = "응? 이부키, 아직 아이지만 알 거는 다 알아!"
70015030-59 = "쿠후후, 그래? 그럼 아루 쨩, 아니, 우리 사장이 알려줘도 괜찮겠네?"
70015030-60 = "응!! 이부키 들을 준비됐어~!"
70015030-61 = "이, 이건…… 이건……"
70015030-62 = "……하루에 한 가지 악을 실천한다…… 라는 뜻이야……."
70015030-63 = "……."
70015030-64 = "우, 우리 흥신소의 좌우명이지! 우리는 그 어떤 것도 두려워하지 않고 어떤 것에도 얽매이지 않는 하드보일드 무법자니까……!!"
70015030-65 = "(저, 저질렀다! 우리를 무서워하면 어떡하지……!!)"
70015030-69 = "응?"
70015030-70 = "그러니까, 우리는 아, 악당이라는 거지!! 무시무시한……!!"
70015030-71 = "언니들, 악당 아닌데?"
70015030-76 = "착한 언니들이잖아?"
70015030-77 = "불안해하던 이부키한테 와서 달래주고, 놀아줬어."
70015030-78 = "어, 그건 그러니까……."
70015030-79 = "맛있는 것도 잔뜩 사주고, 놀이터에서 시소랑 그네도 태워주고."
70015030-80 = "손도 계속 잡아줬는걸."
70015030-81 = "……."
70015030-82 = "응! 좋은 언니들, 착한 언니들이야! 악당 아니야!"
70015030-83 = "쿠후후…… 사장. 이부키 쨩의 말, 어떻게 생각해?"
70015030-84 = "……으음……."
70015030-85 = "……확실히 당신들, 예전보다는 사고치는 일이 줄긴 했죠."
70015030-86 = "……!"
70015030-87 = "골칫덩이에다, 우리와도 종종 부딪히지만……"
70015030-88 = "그래도 선을 넘는 사람들은 아니라고 생각해요."
70015030-89 = "그, 그러려나……."
70015030-90 = "어라? 이건 앞으로도 우리를 잡아가지는 않겠다는 선언?"
70015030-91 = "그럴 리가요. 선을 넘을 경우에는 얄짤 없을 겁니다만?"
70015030-92 = "네에, 네에~"
70015030-94 = "우와! 이거~ 이부키 잘해! 하루카 언니, 이부키랑 이거 하자!"
70015030-95 = "배, 밸런스 게임인가요…… 좋아요. 내려드릴게요. 헤헷."
70015030-101 = "이, 일단…… 손님으로 왔으니 편하게 있도록 해."
70015030-102 = "뭔가 마실 거라도?"
70015030-103 = "아, 그럼 커피로 부탁할게요."
70015030-104 = "좋아. 설탕과 프림은? 몇 스푼씩?"
70015030-105 = "네? 그런 걸 넣을 리가 없잖아요. 그냥 블랙으로 부탁드려요."
70015030-106 = "어? 아? 아, 알았어……."
70015030-107 = "설탕과 프림을 안 넣는다고……? 그 쓴 걸 그대로……? 머, 멋지잖아……?"
70015030-109 = "(시간이 흘러……)"
70015030-112 = "와아~! 이번에는 이부키의 승리! 헤헤~!!"
70015030-113 = "대, 대단해요. 헤헷. 그럼 다, 다음에는 다른 규칙으로 해볼까요?"
70015030-114 = "응응! 무슨 규칙인지 하루카 언니가 알려주세요!"
70015030-119 = "……뭔가 정화되는 기분이네요."
70015030-120 = "그, 그런데 여기 계속 있어도 괜찮아? 만마전은 이부키를 찾고 있을 텐데……?"
70015030-124 = "아, 안 그래도 올 때가 되었겠네요."
70015030-125 = "응? 뭐가?"
70015030-126 = "아까 이부키가 여기 있다고 전달했으니, 지금쯤 도착할 때가……"
70015030-127 = "누, 누구? 누구한테?!"
70015030-128 = "누구긴 누구예요. 만마전이죠."
70015030-129 = "뭐어어어?!?!"
70015030-130 = "어라. 이건 위험할지도?"
70015030-131 = "아, 아니, 우리의 근거지를 함부로 노출시키면 어떻게 해?! 그것도 만마전에게……!!"
70015030-132 = "예? 아뇨. 여기 주소야 이미 진작에 다 알고 있죠?"
70015030-133 = "응?"
70015030-134 = "선도부도, 만마전도 그 정도 정보는 갖고 있는 게 당연하잖아요."
70015030-135 = "당신들이 뭐 비밀리에 활동하고 있는 것도 아니고, 나름 사업장인데."
70015030-136 = "아."
70015030-137 = "생각해보니 그렇네……?"
70015030-138 = "비인가 동아리일 뿐이지, 사업자 등록은 했으니까."
70015030-139 = "아, 아니! 아무튼 그거랑 이건 다르지! 만마전이 여기에 온다는 건……!"
70015030-144 = "이부키이이이이이이이~~~~!!!!!"
70015030-152 = "이부키이이이~~~!!!"
70015030-153 = "으아~ 마코토 선배~!!"
70015030-154 = "이부키!! 내가 잘못했다!! 미안하다, 이부키!! 용서해다오!!"
70015030-155 = "마, 마코토 선배…… 수, 숨막혀……."
70015030-156 = "우와, 엄청난 얼굴."
70015030-157 = "마, 마코토 의장……!!"
70015030-158 = "사, 사장님! 어, 어떻게 할까요…… 죽일까요? 죽여야 하나요? 죽이나요?"
70015030-159 = "아니! 아니야! 진정해, 하루카! 잠시 대기!"
70015030-169 = "자아~ 실례, 실례~"
70015030-170 = "하핫, 안녕하세요! 여기에 이부키가 있다고 들어서요!"
70015030-171 = "……실례합니다……."
70015030-172 = "마, 만마전 임원들이 모두……."
70015030-177 = "사, 사장님~~!!"
70015030-178 = "사장! 사장! 정신차려!"
70015030-180 = "이, 이부키…… 진심으로 미안하다…… 내 다시는 그러지 않으마……."
70015030-181 = "……정말이야?"
70015030-182 = "그럼! 참말이고 말고."
70015030-183 = "이부키의 푸딩 뿐만 아니라, 냉장고에 있는 푸딩이 누구 꺼라도 뺏어먹지 않는다고 약속해. 마코토 선배."
70015030-184 = "큭! 그, 그건……"
70015030-185 = "……아, 알았다. 약속하마."
70015030-189 = "자~ 손가락 걸고~"
70015030-190 = "……도장도 찍었다."
70015030-191 = "응! 헤헤."
70015030-192 = "마코토 선배, 용서할게."
70015030-196 = "저, 정말이냐……! 이부키! 어찌 이렇게 마음이 넓은 것이냐……!"
70015030-197 = "그, 그럼 이제 만마전으로 돌아가자. 사죄의 의미로 푸딩을 열 개나 사두었다."
70015030-198 = "아, 이부키 언니들이랑 인사하고."
70015030-199 = "어, 언니들……?"
70015030-200 = "응! 이부키랑 같이 놀아주고, 맛있는 것도 사주고, 같이 있어준 언니들이야."
70015030-205 = "아아. 너희들이라고 들었지. 흥신소68."
70015030-206 = "우, 우리를 알아?"
70015030-207 = "키시싯…… 당연하지 않나. 리쿠하치마 아루. 너희는 요주의 인물들이니까."
70015030-208 = "이름까지……!"
70015030-209 = "허나……"
70015030-210 = "이 몸, 하누마 마코토 님은 너희를 터치할 생각이 없다."
70015030-211 = "엣……."
70015030-212 = "너희가 행하고 있는 것 또한 자유의 한 갈래."
70015030-213 = "학적이 어찌되었든 학생이 자신의 꿈을 펼치는 것은 독려할 만한 일이지."
70015030-214 = "……!!"
70015030-215 = "오…… 사장……? 이거?"
70015030-216 = "게다가 독자적인 사업 수완까지 갖추었다면 더 말해 무엇하리."
70015030-217 = "이 마코토 님께서는 넓은 아량으로 다소 불법적인 일도 용인한다는 말이다. 키시싯."
70015030-218 = "왜냐하면 우리 만마전은 저 고리타분한 선도부가 아니니까!"
70015030-219 = "뭐라고요? 도와줬더니 그런 말이나 하고, 배은망덕하기 그지없군요!"
70015030-220 = "마코토 선배~ 아코 선배가 이부키를 찾아서 여기까지 와줬어~"
70015030-221 = "앗…… 마, 맞다. 제보를 준 것도 아마우 아코 선임행정관이었지……."
70015030-222 = "……."
70015030-223 = "……."
70015030-224 = "방금 한 말은 취소다!"
70015030-225 = "하? 엎질러진 물이거든요?!"
70015030-228 = "아무튼…… 감사합니다. 이부키를 보호해주셔서."
70015030-229 = "아, 아니. 뭐…… 해야 할 일을 한 것뿐이니까."
70015030-230 = "흐응~ 이부키는 우리의 소중한 후배니까. 감사받을 일이 맞아."
70015030-231 = "쿠후후, 감사하겠다면 사양은 안 할게."
70015030-235 = "아. 이 책상, 조금 낡아보이는데. 만마전에서 사용하는 사양으로 하나 보내줄까?"
70015030-236 = "으응? 저, 정말?"
70015030-237 = "원목으로 만든 고풍스러운 중역 책상인데, 취향이 아니라면 사양해도 괜찮아~"
70015030-238 = "(여기서 넙죽 받으면 멋지지 않을 테니까…… 여기서는 머리에 힘을 주고……!)"
70015030-242 = "아아, 글쎄. 아무래도 우리 사무실은 만마전과는 인테리어 스타일이 달라서. 어, 어떠려나~"
70015030-243 = "흐응, 그렇겠네. 생각해보니 안 어울릴 것 같고. 실례했어."
70015030-244 = "하, 한 번만 권하는 거야?"
70015030-247 = "……."
70015030-248 = "……."
70015030-249 = "오니카타 카요코…… 오랜만이군. 키시싯."
70015030-253 = "그래…… 잘 지내는 것 같네."
70015030-254 = "게헨나의 톱으로서 막중한 책임감과 사명감을 어깨에 짊어지고 있지. 키킥."
70015030-255 = "……여전하구나, 너는."
70015030-256 = "흥, 오늘은 이부키의 가출이라는 초특급 사건이 발생하는 바람에 만마전 임원들까지 모두 함께 움직이게 되었다만……"
70015030-257 = "이렇듯 마주치게 된 건 모처럼이니, 소감을 듣고 싶은데."
70015030-258 = "……."
70015030-259 = "만마전 말이다. 본래라면 너도 있었어야 할 자리니까."
70015030-260 = "……이전의 학생회와는 많이 다르다고 들었어."
70015030-261 = "이 몸이 있는 한, 절대로 이전처럼 돌아가지 않을 것이다."
70015030-262 = "그거면 됐어."
70015030-263 = "이제는 외부인인 내 시선은 중요하지 않지."
70015030-264 = "만마전의 의장은 너고, 게헨나는 네가 만들어가야 하는 곳이니까."
70015030-265 = "……키킥. 그런가. 그렇군."
70015030-266 = "그리고, 내가 있어야 할 곳은 여기거든."
70015030-267 = "하드보일드를 꿈꾸지만 타고난 천성은 숨길 수 없는 사장, 짖궂은 장난을 치지만 할 때는 하는 실장, 그리고 종종 불안할 때가 많지만 섬세하고 순수한 사원이 있는……"
70015030-268 = "이 엉망진창 흥신소가, 내가 있을 자리야. 내가 선택한."
70015030-269 = "……그래."
70015030-270 = "그거면 됐다. 키시싯."
70015030-271 = "응."
70015030-273 = "아, 그렇지. 이부키 쨩과 함께 다같이 사진 한 방. 어때요?"
70015030-274 = "예?! 사, 사진…… 이요?"
70015030-275 = "네에~! 이것도 인연이니까요! 이부키 쨩, 어때요?"
70015030-276 = "응! 응응! 이부키, 언니들이랑 사진 찍을래~!!"
70015030-277 = "쿠후후, 그것도 나름 재미있겠네. 과장, 이쪽으로 와!"
70015030-278 = "……이런."
70015030-280 = "자, 자! 다들 이쪽에 서시고!"
70015030-281 = "어, 어떻게? 여기?"
70015030-282 = "자~ 찍어요, 찍습니다!"
70015030-283 = "활짝 웃으면서! 개구리 뒷~다리~~"
70015030-291 = "크큭…… 이번에는 신세를 졌군, 흥신소68."
70015030-292 = "그럼, 계속 지켜보고 있으마."
70015030-293 = "우웃…… 부담스러워……."
70015030-294 = "자, 가자!"
70015030-299 = "다들 안녕~"
70015030-300 = "사진 나오면 여기로 보내드릴게요~!"
70015030-301 = "언니들, 정말정말 고마웠어! 다음에 또 같이 놀자! 꼭~!!"
70015030-302 = "저, 저도 즐거웠어요…… 이부키, 또 만나요."
70015030-303 = "다음에 또 놀러와~! 쿠후후."
70015030-308 = "……."
70015030-309 = "……할 말이 있는 거야?"
70015030-310 = "네, 고민했는데……"
70015030-311 = "이 말은 해두는 게 좋을 것 같아서요."
70015030-312 = "……혹시."
70015030-316 = "……<폭풍>의 움직임이 감지되었어요."
70015030-317 = "……!!"
70015030-318 = "아무래도 당신은 이런 정보의 획득에 상대적으로 불리할 것 같아서 한 말이니, 흘려듣지 않는 게 좋을 거예요."
70015030-319 = "……그래. 정보 고마워."
70015030-320 = "……조심하도록 해요. 또 예전 같은 짓을 하고 싶지는 않거든요."
70015030-321 = "나도 마찬가지야. 당신도…… 몸조심하도록 해."
70015030-322 = "훗. 피차일반이네요."
