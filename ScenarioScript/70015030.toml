[translation]
70015030-1 = "伊吹離家出走事件（３）"
70015030-4 = ""
70015030-5 = "來……歡，歡迎光臨。"
70015030-6 = "讓各位卑微的客人光臨這麼尊貴的地方，真是不好意思……"
70015030-7 = ""
70015030-9 = ""
70015030-10 = "你說反了，社長。"
70015030-11 = ""
70015030-13 = ""
70015030-14 = ""
70015030-15 = ""
70015030-16 = ""
70015030-17 = ""
70015030-18 = "哇啊～！！好帥！！"
70015030-19 = ""
70015030-21 = ""
70015030-22 = "呵呵，喜，喜歡嗎……伊吹……"
70015030-23 = "嗯，嗯！是事務所耶～大人工作的地方！！"
70015030-24 = ""
70015030-26 = ""
70015030-27 = "哦呵呵！對吧？看起來很像吧？很帥氣吧？"
70015030-28 = "（幸好這個月有準時繳房租……差點就要在帳篷裡招待客人了……）"
70015030-29 = ""
70015030-31 = ""
70015030-32 = "雖然之前在外面碰過幾次面，但來到這裡還是第一次呢。"
70015030-33 = "可以的話，我還真希望你永遠沒機會來呢。"
70015030-34 = "是啊，想必是吧。#n反過來也是一樣。"
70015030-35 = "哼。"
70015030-36 = "既然事情都變成這樣了……就放輕鬆待一下再走吧。"
70015030-37 = "……"
70015030-38 = "這裡就是你找到的容身之處啊。"
70015030-39 = ""
70015030-41 = ""
70015030-42 = "……嗯。"
70015030-43 = "感想呢？"
70015030-44 = "雖然又窄，又堆滿了雜物，各方面都是個亂糟糟的地方……"
70015030-45 = "不過還挺不錯的。"
70015030-46 = "……這樣啊。"
70015030-47 = ""
70015030-49 = ""
70015030-50 = "姐姐！漂亮的亞瑠姐姐！伊吹來唸看看這個！"
70015030-51 = "嗯？唸，唸得出來嗎？"
70015030-52 = "嗯！一……一日……一，一日一惡，對吧！？"
70015030-53 = "對，對……"
70015030-54 = "那是什麼意思？"
70015030-55 = "啊，那，那是……！！"
70015030-56 = "社長，你該不會打算說吧？#n伊吹還是個孩子，這樣好嗎？"
70015030-57 = "嗚……！！"
70015030-58 = "嗯？伊吹雖然還是小孩，但該知道的都知道！"
70015030-59 = "咯呵呵，是嗎？#n那亞瑠醬，不對，我們家社長告訴你也沒關係囉？"
70015030-60 = "嗯！！伊吹準備好聽了～！"
70015030-61 = "這，這是……這是……"
70015030-62 = "是一天實踐一件惡行……的意思……"
70015030-63 = "……"
70015030-64 = "這，這是我們便利屋的座右銘！#n因為我們是無所畏懼、不受任何束縛的冷酷硬派法外之徒……！！"
70015030-65 = "（糟，糟了！要是他害怕我們怎麼辦……！！）"
70015030-66 = ""
70015030-68 = ""
70015030-69 = "嗯？"
70015030-70 = "所以說，我們是壞，壞人啦！！#n很可怕的……！！"
70015030-71 = "姐姐們不是壞人呀？"
70015030-72 = ""
70015030-74 = ""
70015030-75 = ""
70015030-76 = "明明就是善良的姐姐們啊？"
70015030-77 = "在伊吹不安的時候過來安慰伊吹，還陪伊吹玩。"
70015030-78 = "呃，那是因為……"
70015030-79 = "還買了好多好吃的，在遊樂場陪伊吹玩蹺蹺板和盪鞦韆。"
70015030-80 = "而且還一直牽著伊吹的手呢。"
70015030-81 = "……"
70015030-82 = "嗯！是很好的姐姐們，善良的姐姐們！才不是壞人！"
70015030-83 = "咯呵呵……社長。#n伊吹醬說的話，你覺得怎麼樣？"
70015030-84 = "唔嗯……"
70015030-85 = "……你們惹麻煩的次數確實比以前少了。"
70015030-86 = "……！"
70015030-87 = "雖然是一群麻煩人物，也常跟我們起衝突……"
70015030-88 = "但我認為你們不是會越界的人。"
70015030-89 = "是，是這樣嗎……"
70015030-90 = "哎呀？這是在宣告以後也不會抓我們了？"
70015030-91 = "怎麼可能。#n越界的話我可是不會手下留情的哦？"
70015030-92 = "好～好～"
70015030-93 = ""
70015030-94 = "哇！這個～伊吹很會玩！遙香姐姐，跟伊吹一起玩這個吧！"
70015030-95 = "平，平衡遊戲嗎……好的。#n我幫你拿下來。耶嘿嘿。"
70015030-96 = ""
70015030-98 = ""
70015030-99 = ""
70015030-100 = ""
70015030-101 = "總，總之……你是來作客的，就放輕鬆吧。"
70015030-102 = "要喝點什麼嗎？"
70015030-103 = "啊，那麻煩給我咖啡。"
70015030-104 = "好。砂糖和奶精呢？各要幾匙？"
70015030-105 = "咦？怎麼可能加那種東西。#n麻煩直接給我黑咖啡。"
70015030-106 = "咦？啊？我，我知道了……"
70015030-107 = "不加砂糖跟奶精……？#n那麼苦的東西直接喝……？好，好帥啊……？"
70015030-109 = "（時間流逝……）"
70015030-111 = ""
70015030-112 = "哇啊～！這次是伊吹贏了！耶嘿嘿～！！"
70015030-113 = "好，好厲害。耶嘿嘿。#n那，那下次換個規則來玩好嗎？"
70015030-114 = "嗯嗯！請遙香姐姐告訴伊吹是什麼規則！"
70015030-115 = ""
70015030-117 = ""
70015030-118 = ""
70015030-119 = "……總覺得心靈被淨化了呢。"
70015030-120 = "不，不過伊吹一直待在這裡沒關係嗎？#n萬魔殿應該在找他吧……？"
70015030-121 = ""
70015030-123 = ""
70015030-124 = "啊，說到這個，差不多也該到了吧。"
70015030-125 = "嗯？什麼？"
70015030-126 = "剛才我已經通知對方伊吹醬在這裡，這時候應該也快到了……"
70015030-127 = "是，是誰？通知誰！？"
70015030-128 = "還能是誰，當然是萬魔殿啊。"
70015030-129 = "什麼～～～！？"
70015030-130 = "哎呀。這下說不定不妙了？"
70015030-131 = "等，等一下，怎麼可以隨便洩露我們的根據地！？#n而且還是給萬魔殿……！！"
70015030-132 = "咦？這裡的地址我們早就知道了啊？"
70015030-133 = "嗯？"
70015030-134 = "不管是風紀委員會還是萬魔殿，掌握這種程度的情報也是理所當然的。"
70015030-135 = "你們又不是在祕密行動，好歹也是個營業場所。"
70015030-136 = "啊。"
70015030-137 = "這麼說來確實是這樣……？"
70015030-138 = "只是社團未經認可而已，營業登記還是有做的。"
70015030-139 = "不，不對！總之那個跟這個是兩回事！萬魔殿要來這裡的話……！"
70015030-141 = ""
70015030-144 = "伊吹～～～～！！！！！"
70015030-145 = ""
70015030-148 = ""
70015030-149 = ""
70015030-151 = ""
70015030-152 = "伊吹～～～！！！"
70015030-153 = "嗚啊～真琴前輩～！！"
70015030-154 = "伊吹！！是我不好！！對不起，伊吹！！原諒我吧！！"
70015030-155 = "真，真琴前輩……喘，喘不過氣了……"
70015030-156 = "哇，好誇張的表情。"
70015030-157 = "真，真琴議長……！！"
70015030-158 = "社，社長！怎，怎麼辦……要殺掉嗎？該殺掉嗎？要殺嗎？"
70015030-159 = "不！不行！冷靜點，遙香！先待命！"
70015030-160 = ""
70015030-162 = ""
70015030-166 = ""
70015030-167 = ""
70015030-168 = ""
70015030-169 = "好啦～打擾了，打擾了～"
70015030-170 = "哈哈，你們好！聽說伊吹醬在這裡！"
70015030-171 = "打擾了……"
70015030-172 = "萬，萬魔殿的幹部全都……"
70015030-173 = ""
70015030-175 = ""
70015030-177 = "社，社長～～！！"
70015030-178 = "社長！社長！振作點！"
70015030-180 = "伊，伊吹……我真的很抱歉……我再也不會那樣了……"
70015030-181 = "……真的嗎？"
70015030-182 = "當然！千真萬確。"
70015030-183 = "不只是伊吹的布丁，冰箱裡不管是誰的布丁都不能搶來吃。#n要跟伊吹約好哦，真琴前輩。"
70015030-184 = "唔！那，那個……"
70015030-185 = "……我，我知道了。我答應你。"
70015030-186 = ""
70015030-188 = ""
70015030-189 = "來～打勾勾～"
70015030-190 = "……章也蓋好了。"
70015030-191 = "嗯！耶嘿嘿。"
70015030-192 = "伊吹原諒真琴前輩了。"
70015030-193 = ""
70015030-195 = ""
70015030-196 = "真，真的嗎……！#n伊吹！你的心胸怎麼能這麼寬大……！"
70015030-197 = "那，那我們回萬魔殿吧。#n為了表示歉意，我買了整整十個布丁。"
70015030-198 = "啊，伊吹要跟姐姐們道別。"
70015030-199 = "姐，姐姐們……？"
70015030-200 = "嗯！是陪伊吹玩、買好吃的給伊吹、一直陪著伊吹的姐姐們。"
70015030-201 = ""
70015030-203 = ""
70015030-204 = ""
70015030-205 = "啊啊，我聽說了。#n就是你們對吧，便利屋68。"
70015030-206 = "你，你認識我們？"
70015030-207 = "嘰嘻嘻……這不是理所當然的嗎。陸八魔亞瑠。#n你們可是需要特別注意的人物。"
70015030-208 = "連名字都……！"
70015030-209 = "不過……"
70015030-210 = "我羽沼真琴大人並沒有打算干涉你們。"
70015030-211 = "咦……"
70015030-212 = "你們所做的事，也是自由的一種形式。"
70015030-213 = "不管學籍如何，學生實現自己的夢想都是值得鼓勵的事。"
70015030-214 = "……！！"
70015030-215 = "哦……社長……？這是……？"
70015030-216 = "要是還具備獨到的經營手腕的話，那就更沒什麼好說的了。"
70015030-217 = "我真琴大人胸襟寬大，多少有些違法的事也會容許。嘰嘻嘻。"
70015030-218 = "因為我們萬魔殿，可不是那個死板的風紀委員會！"
70015030-219 = "什麼？人家都幫了你還說這種話，真是忘恩負義到了極點！"
70015030-220 = "真琴前輩～亞子前輩為了找伊吹，特地來到這裡了哦～"
70015030-221 = "啊……對，對了。#n提供消息的好像也是天雨亞子首席行政官……"
70015030-222 = "……"
70015030-223 = "……"
70015030-224 = "剛才說的話不算！"
70015030-225 = "什麼？覆水難收了好嗎！？"
70015030-227 = ""
70015030-228 = "這次……真的很謝謝你們保護了伊吹。"
70015030-229 = "不，不會。我們只是做了該做的事而已。"
70015030-230 = "哼嗯～伊吹醬是我們重要的後輩嘛。#n被感謝也是應該的。"
70015030-231 = "咯呵呵，既然要謝的話，那我就不客氣囉。"
70015030-232 = ""
70015030-234 = ""
70015030-235 = "啊。這張桌子看起來有點舊了呢。#n要不要送你們一張萬魔殿同款的桌子？"
70015030-236 = "唔嗯？真，真的嗎？"
70015030-237 = "是用原木做的古典風格主管辦公桌，不合你們喜好的話拒絕也沒關係哦～"
70015030-238 = "（在這裡馬上收下的話就不帥氣了……這時候要沉住氣……！）"
70015030-239 = ""
70015030-241 = ""
70015030-242 = "嗯……畢竟我們事務所的裝潢風格跟萬魔殿不太一樣。#n不，不知道適不適合呢～"
70015030-243 = "哼嗯，也是呢。#n仔細想想好像也不搭，是我失禮了。"
70015030-244 = "只，只問一次而已嗎？"
70015030-246 = ""
70015030-247 = "……"
70015030-248 = "……"
70015030-249 = "鬼方佳世子……好久不見了啊。嘰嘻嘻。"
70015030-250 = ""
70015030-252 = ""
70015030-253 = "是啊……看來你過得不錯。"
70015030-254 = "身為格黑娜的頂點，肩上可是扛著重大的責任感與使命感。嘰嘻嘻。"
70015030-255 = "……你還是老樣子呢。"
70015030-256 = "哼，今天因為發生了伊吹離家出走這種超特級事件，#n連萬魔殿的幹部們都一起出動了……"
70015030-257 = "難得像這樣碰面了，我想聽聽你的感想。"
70015030-258 = "……"
70015030-259 = "我是說萬魔殿。#n那本來也該是你的位置。"
70015030-260 = "……聽說跟以前的學生會差很多。"
70015030-261 = "只要有本大人在，絕對不會再回到以前那樣。"
70015030-262 = "那就好。"
70015030-263 = "現在我已經是外人了，我的看法並不重要。"
70015030-264 = "萬魔殿的議長是你，格黑娜是要由你來打造的地方。"
70015030-265 = "嘻嘻。是嗎……是這樣啊。"
70015030-266 = "而且我該待的地方是這裡。"
70015030-267 = "有嚮往冷酷硬派卻藏不住天生本性的社長、愛惡作劇但該做時會做的室長，#n還有常常讓人不安卻細膩又純真的社員……"
70015030-268 = "這個亂七八糟的便利屋，就是我該待的地方。這是我自己的選擇。"
70015030-269 = "……是嗎。"
70015030-270 = "那就好。嘰嘻嘻。"
70015030-271 = "嗯。"
70015030-272 = ""
70015030-273 = "啊，對了。大家跟伊吹醬一起拍張照吧，怎麼樣？"
70015030-274 = "咦！？拍，拍照……嗎？"
70015030-275 = "是～的！這也是一種緣分嘛！伊吹醬覺得怎麼樣？"
70015030-276 = "嗯！嗯嗯！伊吹想跟姐姐們一起拍照～！！"
70015030-277 = "咯呵呵，那應該也挺有趣的。#n課長，過來這邊！"
70015030-278 = "……真是的。"
70015030-280 = "來，來！大家請站到這邊來！"
70015030-281 = "要，要怎麼站？這裡嗎？"
70015030-282 = "來～要拍了，要拍囉！"
70015030-283 = "笑得燦爛一點！西瓜甜不甜～～"
70015030-284 = ""
70015030-291 = "嘻嘻……這次受你們照顧了啊，便利屋68。"
70015030-292 = "那麼，本大人會繼續盯著你們的。"
70015030-293 = "嗚……好有壓力……"
70015030-294 = "好，走吧！"
70015030-295 = ""
70015030-297 = ""
70015030-298 = ""
70015030-299 = "大家再見～"
70015030-300 = "照片洗好之後會寄到這裡來哦～！"
70015030-301 = "姐姐們，真的真的很謝謝你們！#n下次再一起玩吧！一定要哦～！！"
70015030-302 = "我，我也玩得很開心……伊吹，再見了。"
70015030-303 = "下次再來玩哦～！咯呵呵。"
