70015030-94 = "ว้าว! อันนี้น่ะ อิบูกิเล่นเก่งนะ! พี่ฮารุกะ มาเล่นอันนี้กับอิบูกิกัน!"
70015030-95 = "กะ... เกมตัวต่อสินะคะ... ได้ค่ะ เดี๋ยวหยิบลงมาให้นะคะ แหะๆ"
