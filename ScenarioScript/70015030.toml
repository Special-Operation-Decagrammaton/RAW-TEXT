70015030-199 = "พะ... พี่ๆ...?"
70015030-200 = "อื้ม! พวกพี่ๆ ที่เล่นกับอิบูกิ ซื้อของอร่อยๆ ให้ แล้วก็อยู่เป็นเพื่อนอิบูกิไง"
70015030-201 = ""
70015030-203 = ""
70015030-204 = ""
70015030-205 = "อ่า เราได้ยินแล้วละว่าเป็นพวกเธอ หน่วยรับจ้างสารพัด 68"
70015030-206 = "ระ... รู้จักพวกเราด้วยเหรอ?"
70015030-207 = "คิกคิกคิก... เราต้องรู้จักอยู่แล้ว ริคุฮาชิมะ อารุ พวกบุคคลที่ต้องเฝ้าระวัง"
