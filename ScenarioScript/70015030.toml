70015030-60 = "อื้อ!! อิบูกิพร้อมฟังแล้ว~!"
70015030-61 = "นะ... นี่มัน... มัน..."
70015030-62 = "หมายความว่า... ทำเรื่องร้ายๆ... วันละหนึ่งเรื่องน่ะ..."
70015030-63 = "..."
70015030-64 = "มะ... มันเป็นคติประจำใจของหน่วยรับจ้างสารพัดของเรา! เพราะพวกเราเป็นคนนอกกฎหมายร้ายกาจ#nที่ไม่กลัวสิ่งใดและไม่ยอมให้สิ่งใดมาผูกมัด...!!"
70015030-65 = "(พะ... พูดออกไปแล้ว! ถ้าเธอกลัวพวกเราขึ้นมาจะทำยังไงเนี่ย...!!)"
70015030-66 = ""
70015030-68 = ""
70015030-69 = "หืม?"
70015030-70 = "สรุปก็คือ พะ... พวกเราเป็นวายร้ายไงล่ะ!! วายร้ายที่น่ากลัวๆ มากด้วย...!!"
70015030-71 = "พี่ๆ ไม่ใช่วายร้ายสักหน่อย?"
