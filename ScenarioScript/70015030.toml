70015030-228 = "ยังไงก็... ขอบคุณนะคะ ที่ช่วยดูแลอิบูกิ"
70015030-229 = "มะ... ไม่หรอก ก็... แค่ทำสิ่งที่ควรทำเท่านั้นเอง"
70015030-230 = "อืม~ อิบูกิเป็นรุ่นน้องคนสำคัญของเรา พวกเธอสมควรได้รับคำขอบคุณแล้วละ"
