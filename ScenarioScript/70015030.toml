70015030-211 = "เอ๋..."
70015030-212 = "สิ่งที่พวกเธอทำก็เป็นเสรีภาพรูปแบบหนึ่งเหมือนกัน"
70015030-213 = "ไม่ว่าสถานะในโรงเรียนจะเป็นยังไง การที่นักเรียนได้ทำตามความฝันก็เป็นเรื่องที่ควรสนับสนุน"
70015030-214 = "...!!"
70015030-215 = "โอ้... ประธาน...? แบบนี้...?"
70015030-216 = "แถมยังมีหัวทางธุรกิจด้วย เรายังจะต้องพูดอะไรให้มากความอีก"
70015030-217 = "สรุปก็คือท่านมาโคโตะผู้นี้ใจกว้างพอจะยอมรับเรื่องที่ผิดกฎเล็กๆ น้อยๆ ได้ยังไงล่ะ คิกคิกคิก"
70015030-218 = "เพราะแพนเดโมเนียม โซไซตี้ของเราไม่ใช่คณะกรรมการวินัยหัวโบราณคร่ำครึพวกนั้นไงล่ะ!"
70015030-219 = "ว่าไงนะคะ? พวกเราอุตส่าห์ช่วยแล้วยังพูดแบบนั้นได้ยังไงกันคะ ไม่สำนึกบุญคุณเลยจริงๆ!"
70015030-220 = "รุ่นพี่มาโคโตะ~ รุ่นพี่อาโกะตามหาอิบูกิจนมาถึงที่นี่เลยนะ~"
