70015030-317 = "……！！"
70015030-318 = "畢竟你在取得這類情報上相對不利，我才告訴你的。#n最好別當成耳邊風。"
70015030-319 = "……嗯，謝謝你的情報。"
70015030-320 = "……還請多加小心。#n我可不想再做以前那樣的事了。"
70015030-321 = "我也一樣。你也……要多保重。"
70015030-322 = "哼。彼此彼此呢。"
70015030-323 = "那麼，下次見。"
