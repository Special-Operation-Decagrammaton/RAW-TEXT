70015030-50 = "พี่สาว! พี่อารุคนสวย! อิบูกิขออ่านอันนี้นะ!"
70015030-51 = "หืม? อะ... อ่านได้เหรอ?"
70015030-52 = "อื้อ! ระ... ร้าย... วะ... วันละ... ครั้ง... ถูกมั้ย?!"
