70015030-74 = ""
70015030-75 = ""
70015030-76 = "เป็นพวกพี่สาวที่ใจดีต่างหาก"
70015030-77 = "เข้ามาหาอิบูกิที่กำลังกลัว คอยปลอบใจ แถมอยู่เล่นเป็นเพื่อนด้วย"
70015030-78 = "เอ่อ นั่นมันก็..."
70015030-79 = "ซื้อของอร่อยๆ ให้ตั้งเยอะ แล้วก็พาไปเล่นกระดานหกกับชิงช้าที่สนามเด็กเล่น..."
70015030-80 = "แถมยังจับมืออิบูกิไว้ตลอดเลยด้วย"
70015030-81 = "..."
70015030-82 = "อื้อ! เป็นพี่สาวแสนดี พี่สาวใจดี! ไม่ใช่วายร้ายหรอก!"
70015030-83 = "ฮุฮุฮุ... ประธาน คิดยังไงกับที่อิบูกิจังพูดล่ะ?"
70015030-84 = "อืม..."
70015030-85 = "มันก็จริงที่ช่วงหลังพวกคุณก่อเรื่องน้อยลงกว่าเมื่อก่อนนะคะ..."
70015030-86 = "...!"
70015030-87 = "ถึงจะเป็นตัวปัญหา แถมยังมีเรื่องกับพวกเราอยู่บ่อยๆ ก็เถอะ..."
70015030-88 = "แต่ฉันคิดว่าพวกคุณไม่ใช่คนที่จะทำอะไรเกินขอบเขตค่ะ"
70015030-89 = "งะ... งั้นเหรอ..."
70015030-90 = "อ้าว? นี่เป็นการประกาศว่าต่อไปจะไม่จับพวกเราแล้วรึเปล่า?"
70015030-91 = "จะเป็นแบบนั้นได้ยังไงคะ ถ้าทำเกินขอบเขตเมื่อไร พวกเราก็ไม่มีผ่อนผันหรอกนะคะ"
70015030-92 = "จ้า จ้า~"
