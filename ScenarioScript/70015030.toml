70015030-330 = "亞瑠醬，怎麼突然喝起黑咖啡了？咯呵呵！"
70015030-331 = "社，社長……！！#n您，您沒事吧！這，這杯咖啡有問題嗎！要開槍嗎！？"
70015030-332 = "……"
70015030-333 = "哈哈。"
