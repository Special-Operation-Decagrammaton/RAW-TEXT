[translation]
70015030-1 = "Ibuki Runaway Incident 3"
70015030-4 = ""
70015030-5 = "W-Well... Welcome in."
70015030-6 = "I apologize for bringing such humble guests to this distinguished place..."
70015030-7 = ""
70015030-9 = ""
70015030-10 = "You've got that backwards, Boss."
70015030-11 = ""
70015030-13 = ""
70015030-14 = ""
70015030-15 = ""
70015030-16 = ""
70015030-17 = ""
70015030-18 = "Wow! This is so cool!"
70015030-19 = ""
70015030-21 = ""
70015030-22 = "Heehee... D-Do you like it, Ibuki...?"
70015030-23 = "I do, I do! It's like a real office! Like ones grownups work in!"
70015030-24 = ""
70015030-26 = ""
70015030-27 = "Ohoho! That's exactly what it looks like, doesn't it? I mean, it IS!"
70015030-28 = "(Thank goodness we paid the rent on time this month...or we would've been hosting them in a tent.)"
70015030-29 = ""
70015030-31 = ""
70015030-32 = "You know, we've had a handful of run-ins, but this is my first time actually stepping foot in here."
70015030-33 = "...I personally hoped you'd never have a reason to."
70015030-34 = "Yes, I figured. The feeling was mutual."
70015030-35 = "Hmph."
70015030-36 = "Well, we're here, so you might as well make yourself comfortable."
70015030-37 = "..."
70015030-38 = "So this is the place you found for yourself."
70015030-39 = ""
70015030-41 = ""
70015030-42 = "...Yup."
70015030-43 = "Any thoughts?"
70015030-44 = "...Cramped, cluttered, dusty, and chaotic."
70015030-45 = "...It's not bad."
70015030-46 = "Thanks."
70015030-47 = ""
70015030-49 = ""
70015030-50 = "Aru! Pretty Aru! Ibuki wants to read this!"
70015030-51 = "Eh? Y-You can read that?"
70015030-52 = "Duh! One... The characters are hard! One...Evil Deed a Day, right?"
70015030-53 = "Th-That's right..."
70015030-54 = "What does it mean?"
70015030-55 = "W-Well, that's...!"
70015030-56 = "Hold up, Boss. Were you about to tell her? You think it's okay to tell a kid something like that?"
70015030-57 = "Ugh...!"
70015030-58 = "Ibuki might be a kid, but that doesn't mean Ibuki won't get it!"
70015030-59 = "Kufufu, really? Then Aru... I mean, our boss can explain it to you! Go on, Aru!"
70015030-60 = "Yeah! Ibuki wanna know!"
70015030-61 = "W-Well... It means..."
70015030-62 = "It means...to do one evil deed every day..."
70015030-63 = "..."
70015030-64 = "I-It's our motto! We're hard-boiled outlaws who fear nothing and are bound by nothing...!"
70015030-65 = "(I-I said it! What if she gets scared of us now...?!)"
70015030-66 = ""
70015030-68 = ""
70015030-69 = "Huh?"
70015030-70 = "Because we're bad guys! Really scary, bad ones!"
70015030-71 = "You're not bad at all."
70015030-72 = ""
70015030-74 = ""
70015030-75 = ""
70015030-76 = "Everyone was so nice to Ibuki."
70015030-77 = "Ibuki was so scared and sad and lonely when you found me. Everyone played with Ibuki and cheered her up!"
70015030-78 = "U-Um, that was..."
70015030-79 = "And you bought Ibuki yummy things to eat, and we played on the seesaw and swings together!"
70015030-80 = "Throughout all that, you never let go of Ibuki's hand."
70015030-81 = "..."
70015030-82 = "That's how Ibuki knows! You're friends! You're really nice and not bad at all!"
70015030-83 = "Kufufu... Boss, what do you think about what Ibuki said?"
70015030-84 = "...Hmm..."
70015030-85 = "...You have cooled off a lot recently."
70015030-86 = "...!"
70015030-87 = "Don't get me wrong, you still cause us trouble, and we've fought on opposite sides of the line more than once..."
70015030-88 = "...but I've never known you to be unprincipled people."
70015030-89 = "I-Is that so...?"
70015030-90 = "Oho? So are you going to finally stop chasing us down?"
70015030-91 = "That's not what I said at all. We'll never ease up on rule breakers."
70015030-92 = "Yeah, yeah."
70015030-93 = ""
70015030-94 = "Oh, oh! Look! Ibuki is good at this one! Haruka, let's play this together!"
70015030-95 = "A balance game...? Sure. I'll get it down for you. Heehee."
70015030-96 = ""
70015030-98 = ""
70015030-99 = ""
70015030-100 = ""
70015030-101 = "W-Well, while you're our guest, make yourself at home."
70015030-102 = "Would you like something to drink?"
70015030-103 = "Ah, then I'll have coffee, please."
70015030-104 = "Do you want sugar? Creamer?"
70015030-105 = "Why would you ask such a thing? Nothing in it. Black, please."
70015030-106 = "E-Eh? A-All right..."
70015030-107 = "No sugar or creamer...? She drinks it that bitter...? Th-That's kind of cool..."
70015030-109 = "A little later..."
70015030-111 = ""
70015030-112 = "Yay! Ibuki wins this time! Heehee!"
70015030-113 = "A-Amazing. Heehee. Th-Then shall we try a different set of rules next?"
70015030-114 = "Yeah! Haruka, teach Ibuki the new rules!"
70015030-115 = ""
70015030-117 = ""
70015030-118 = ""
70015030-119 = "...This is surprisingly pleasant."
70015030-120 = "B-But how long can Ibuki even stay here? I'm sure the Pandemonium Society is still looking for her!"
70015030-121 = ""
70015030-123 = ""
70015030-124 = "Speaking of, they should be here any minute now."
70015030-125 = "Any what now?"
70015030-126 = "I let them know as soon as Ibuki decided to stay. I can't imagine it'll take them much longer."
70015030-127 = "Wh-Who exactly? Who, specifically, did you \"let know\"?"
70015030-128 = "Who do you think? The Pandemonium Society, of course."
70015030-129 = "WHAAAAAAT?!"
70015030-130 = "Ah. This took a turn."
70015030-131 = "Y-You just gave away our hideout?! And to THEM? We trusted you!"
70015030-132 = "What? No, no. Did you really think they didn't know?"
70015030-133 = "Huh?"
70015030-134 = "Seriously? Of course the Pandemonium Society and Prefect Team know about your office."
70015030-135 = "You're a public business, not some underground black market shop."
70015030-136 = "Ah."
70015030-137 = "When you put it that way... That's true."
70015030-138 = "We're an unauthorized club. But an official business..."
70015030-139 = "Wait, no! I'm getting distracted!! You said the Pandemonium Society was coming here—"
70015030-141 = ""
70015030-144 = "IBUKIIIIII!"
70015030-145 = ""
70015030-148 = ""
70015030-149 = ""
70015030-151 = ""
70015030-152 = "IIIBUKI!!"
70015030-153 = "WAAAH! Makoto!"
70015030-154 = "Ibuki! I was wrong! I'm sorry, Ibuki! Please forgive me!"
70015030-155 = "M-Makoto... I-Ibuki can't breathe..."
70015030-156 = "Wow, what an expression!"
70015030-157 = "Ch-Chairman Makoto...!"
70015030-158 = "B-Boss! W-What should we do...? Should I kill her? Do I need to kill her? Should I?!"
70015030-159 = "NO! Absolutely not! Stand down, Haruka! Stand down!"
70015030-160 = ""
70015030-162 = ""
70015030-166 = ""
70015030-167 = ""
70015030-168 = ""
70015030-169 = "Well then, pardon us."
70015030-170 = "Haha, hello! We heard Ibuki was here!"
70015030-171 = "...'Scuse us."
70015030-172 = "The Pandemonium Society top brass...all in our office..."
70015030-173 = ""
70015030-175 = ""
70015030-177 = "B-Boss!"
70015030-178 = "Boss! Boss! Get a hold of yourself!"
70015030-180 = "I-Ibuki... I'm truly sorry... I promise I'll never do it again..."
70015030-181 = "...Do you MEAN it?"
70015030-182 = "Of course! I mean it from the bottom of my heart!"
70015030-183 = "If you do, then promise Makoto will only eat Makoto's pudding. Not Ibuki's, not Iroha's, no one's."
70015030-184 = "Ugh! Th-That's..."
70015030-185 = "...A-All right. I promise."
70015030-186 = ""
70015030-188 = ""
70015030-189 = "Okay, pinky promise!"
70015030-190 = "...And the promise is sealed."
70015030-191 = "Yeah! Heehee."
70015030-192 = "Okay. Makoto is forgiven!"
70015030-193 = ""
70015030-195 = ""
70015030-196 = "R-Really...?! Ibuki! You are so generous...and so kind!!"
70015030-197 = "Th-Then let's head back to the Pandemonium Society. I bought ten puddings to make it up to you."
70015030-198 = "Oh, but Ibuki needs to say goodbye to her new friends!"
70015030-199 = "N-New friends?"
70015030-200 = "Yeah! They played with Ibuki, bought Ibuki yummy things, and kept her company!"
70015030-201 = ""
70015030-203 = ""
70015030-204 = ""
70015030-205 = "Ah, so it was you. Problem Solver 68."
70015030-206 = "Y-You know us?"
70015030-207 = "Kihehe... Of course I do, Rikuhachima Aru. You're all persons of interest, after all."
70015030-208 = "E-Even my name?!"
70015030-209 = "However..."
70015030-210 = "I, the Great Makoto, have no intention of interfering with you."
70015030-211 = "Huh...?"
70015030-212 = "What you're doing is its own form of freedom."
70015030-213 = "Whatever your enrollment status may be, students should be encouraged to pursue their dreams."
70015030-214 = "...!!"
70015030-215 = "Oh... Boss...? Is this...? "
70015030-216 = "And if the results of your business speak for themselves, then who can take that away from you?"
70015030-217 = "I am a generous leader, willing to overlook a little illegality when the situation calls for it. Kihehe."
70015030-218 = "Because the Pandemonium Society isn't like that stuffy old Prefect Team!"
70015030-219 = "WHAT?! We helped you look for Ibuki for hours, and THAT'S what we get as gratitude?!"
70015030-220 = "Makoto! Ako came all this way to help Ibuki!"
70015030-221 = "Ah... R-Right. Senior Administrator Amau Ako was the one who told us where Ibuki was..."
70015030-222 = "..."
70015030-223 = "..."
70015030-224 = "I take back what I just said!"
70015030-225 = "Huh? You can't just take it back and consider it settled!"
70015030-227 = ""
70015030-228 = "Anyway... Thank you for looking after Ibuki."
70015030-229 = "N-No, well... I just did what anyone would have."
70015030-230 = "Regardless, Ibuki is precious to us. So thank you."
70015030-231 = "Kufufu, if you want to thank us, we won't keep rejecting ya!"
70015030-232 = ""
70015030-234 = ""
70015030-235 = "Ah, I see this desk is a bit dated. Would you like me to send you one from Pandemonium headquarters?"
70015030-236 = "Huh? R-Really?"
70015030-237 = "It's an elegant executive desk made of solid wood. However, don't feel pressured to say yes if that isn't your aesthetic."
70015030-238 = "(It wouldn't look cool if I accepted it right away... I need to play it cool here...!)"
70015030-239 = ""
70015030-241 = ""
70015030-242 = "Ah, well. Our office does have a different interior style from the Pandemonium Society, so... I'm not sure."
70015030-243 = "Hmm, you're right. Now that I think about it, it probably wouldn't fit in here. My apologies, I should have been more thoughtful."
70015030-244 = "W-Wait, you're not going to insist?"
70015030-246 = ""
70015030-247 = "..."
70015030-248 = "..."
70015030-249 = "Onikata Kayoko... It's been a while. Kihehe."
70015030-250 = ""
70015030-252 = ""
70015030-253 = "Yeah... You seem to be doing well."
70015030-254 = "Naturally. As the leader of Gehenna, I bear a tremendous burden of responsibility and duty. Kiheh."
70015030-255 = "...You haven't changed at all."
70015030-256 = "Hmph. Ibuki running away was such a major emergency that every Pandemonium Society member had to mobilize today..."
70015030-257 = "However, this is a rare chance. I'd like to speak with you."
70015030-258 = "..."
70015030-259 = "What do you think of the Pandemonium Society now? Do you ever long for the spot that was meant for you?"
70015030-260 = "...I've heard you've turned things around from the old student council's era."
70015030-261 = "As long as I'm here, that's how it'll stay."
70015030-262 = "I'm happy to hear that."
70015030-263 = "I'm just a normal student. My opinions don't matter."
70015030-264 = "You're the chairman of the Pandemonium Society, and Gehenna is yours to mold as you please."
70015030-265 = "...Kekeke. I see. So that's how it is."
70015030-266 = "Besides, this is where I belong."
70015030-267 = "Here, I have a hard-boiled boss who can't help but defer to her kind nature, a reliable manager who keeps things lively with her jokes, and an employee who worries you but in the most endearing way possible..."
70015030-268 = "It's chaotic and rough, but Problem Solver 68 is where I belong. It's the home I chose for myself."
70015030-269 = "...Good."
70015030-270 = "That's good enough for me. Kihehe."
70015030-271 = "Yeah."
70015030-272 = ""
70015030-273 = "Oh, right. How about we all take a picture with Ibuki?"
70015030-274 = "Huh?! A-A picture?"
70015030-275 = "Yes! We did meet through a twist of fate, after all! What do you think, Ibuki?"
70015030-276 = "Yeah! Ibuki wants to take a picture with everyone!"
70015030-277 = "Kufufu, that sounds fun! C'mere, Kayoko! You get in!"
70015030-278 = "...Ugh."
70015030-280 = "All right, everyone! Stand over here!"
70015030-281 = "L-Like this? Here?"
70015030-282 = "All right, here we go! Taking the picture! "
70015030-283 = "Big smiles! Say cheeeese!"
70015030-284 = ""
70015030-291 = "Heh... We owe you one this time, Problem Solver 68."
70015030-292 = "Don't forget, I'll be keeping an eye on you."
70015030-293 = "Ugh... That's a lot of pressure..."
70015030-294 = "Now, then!"
70015030-295 = ""
70015030-297 = ""
70015030-298 = ""
70015030-299 = "Goodbye, all!"
70015030-300 = "I'll send you our pic when it's ready!"
70015030-301 = "Bye-bye, everyone! Thanks for everything! We'll play again soon! Promise!"
70015030-302 = "I-I had a lot of fun... See you again, Ibuki."
70015030-303 = "Come visit us again! Kufufu."
70015030-304 = ""
70015030-306 = ""
70015030-307 = ""
70015030-308 = "..."
70015030-309 = "...Is there something you want to say?"
70015030-310 = "Yes. I wasn't sure whether to say this, but..."
70015030-311 = "I thought it would be better to tell you."
70015030-312 = "You don't mean..."
70015030-313 = ""
