[translation]
10048005-1 = "프롤로그;낯선 천장 아래서"
10048005-5 = "어느 낯선 방"
10048005-7 = "(낯선 천장이 보였다.)"
10048005-8 = "(이곳이 어디인가, 하는 의문이 가장 먼저 떠올랐다.)"
10048005-15 = "(내부 구조로 보아 기숙사의 내부로 추측되었다.)"
10048005-19 = "(다행히 몸은 구속되어 있지 않은 상태.)"
10048005-20 = "(오히려 소파에 뉘어 둔 데다가 이불까지 덮어 두었다.)"
10048005-21 = "(데려다 놓은 이들에게 적의가 있는 것 같지는 않은 상황.)"
10048005-26 = "(다만 머리에 지끈거리는 통증은 계속 남아있었다.)"
10048005-27 = "(대체 무슨 일이 벌어졌던 것일까.)"
10048005-32 = "깨, 깨어나셨군요."
10048005-36 = "[ns] \"누구시죠……?\""
10048005-37 = "예? 저요?"
10048005-38 = "그, 어, 그게…… 그렇죠, 모르시는 게 당연히 정상이겠죠."
10048005-39 = "제 이름은 사쿠라이 미요. 와일드헌트 예술학원에서 문학을 전공하고 있어요."
10048005-40 = "나이는 16세, 2학년이고요……."
10048005-41 = "생일은 8월 24일이고, 키는 155cm고……."
10048005-42 = "취미는 타자기 수집이고요……."
10048005-43 = "그리고 허리둘레는……."
10048005-44 = "……."
10048005-45 = "……정말 이런 것까지 궁금하세요?"
10048005-46 = "[s1] \"그쪽이 먼저 털어놨잖아요?!\"\n[s2] \"궁금하긴 한데……!\""
10048005-47 = "그, 그렇긴 한데……."
10048005-48 = "그, 그게 중요한 게 아니잖아요, 이 이상한 사람!"
10048005-49 = "궁금하긴 한 건가요……!"
10048005-50 = "역시 소문대로 이상한 사람……!"
10048005-51 = "[ns] \"그런데 대체 이곳은…….\""
10048005-53 = "아, 이곳은 특수교역부의 부실이에요."
10048005-54 = "[s] \"특수교역부……?\""
10048005-55 = "예. 와일드헌트의 범법 조직입니다."
10048005-56 = "[s] \"대체 뭐 하는 조직이길래……?\""
10048005-60 = "……밀수요."
10048005-61 = "[s] \"밀수?!\""
10048005-62 = "그나저나 그쪽은…… 샬레의 선생님, 맞으시죠?"
10048005-63 = "[s] \"응, 맞아.\""
10048005-64 = "그렇다면 다소 갑작스러울 수 있겠지만……."
10048005-65 = "……혹시, 저의 고민을 들어주실 수 있으신가요?"
10048005-66 = "[s] \"학생의 고민이라면, 얼마든지 들어줄 수 있어.\""
10048005-70 = "여, 역시 이것도 듣던 대로……."
10048005-71 = "그, 그렇다면……."
10048005-72 = "저기, 사실…… 저는 말이죠."
10048005-73 = "이 특수교역부를, 폐부시키고 싶어요."
10048005-74 = "[s] \"폐부……?\""
10048005-75 = "예. 특수교역부의 활동을, 이제 그만 멈추게 하고 싶어요."
10048005-76 = "……계속해서 교칙을 위반하는 것이, 너무나 마음이 불편해요."
10048005-77 = "그래서 염치없는 일이지만…… 도움을 부탁드려도 될까요……?"
10048005-78 = "[s3] \"물론이지.\"\n[s4] \"그러면 특수교역부의 부장을 만나봐야 할 것 같아.\""
10048005-81 = "아, 그런 문제라면 저에게 말씀해 주시면 돼요."
10048005-82 = "[s5] \"아니, 부장을 한번 직접 만나보고 싶어서.\"\n[s6] \"정확히 무엇을 하는 동아리인지 알고 싶기도 하고.\""
10048005-85 = "아."
10048005-89 = "그…… 제가 부장인데요."
10048005-94 = "[ns] \"……뭐라고요?\""
