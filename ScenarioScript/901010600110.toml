901010600110-16 = ""
901010600110-17 = "FOX 3 and FOX 4 are stationed at Point Sierra."
901010600110-18 = "I'm on the lookout and will remotely support FOX 2, just like last time."
901010600110-20 = "...Copy that."
901010600110-21 = "Today's mission objective is to discern the whereabouts of subject \"Miyaguchi,\" the missing fisherman. We were unable to learn anything about him during our last outing."
901010600110-22 = "Most people affiliated with the port seemed indifferent to the crab barrel rumors last time. Keep an eye out today. We could be overlooking something."
901010600110-24 = "Roger!"
901010600110-27 = "By the way, FOX 1. Did you learn anything new during your personal investigation yesterday?"
901010600110-28 = "My investigation...?"
901010600110-29 = "Yeah. You stepped out in the afternoon because you wanted to look into something."
901010600110-30 = "I assumed it was related to the mission, but I could be mistaken... Was I wrong?"
901010600110-31 = "Ah... Right, yesterday."
901010600110-32 = "It was nothing. Strictly a personal matter."
901010600110-34 = "Oooh... A \"personal\" matter."
901010600110-35 = "...Is there a problem, FOX 3?"
901010600110-36 = "Not at all. I've just never heard of you caring about \"personal matters\" before. And on your day off...?"
901010600110-37 = "Is there a reason for this change of heart?"
901010600110-38 = "Maybe Yukino changed because [USERNAME] Sensei is watching..."
901010600110-39 = "...That's enough idle chatter. Focus on the mission."
901010600110-40 = "It's on you, FOX 2."
901010600110-41 = "Fufu. Then I'll get started!"
