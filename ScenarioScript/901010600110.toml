[translation]
901010600110-7 = "FOX 2, 방금 포인트 알파에 진입했습니다."
901010600110-11 = "확인. 다른 소대 인원도 이어서 보고할 것."
901010600110-17 = "FOX 3, FOX 4도 포인트 시에라에 도착."
901010600110-18 = "지난번처럼 주위를 경계하며 FOX 2를 원격으로 지원할게."
901010600110-20 = "……확인."
901010600110-21 = "오늘 작전의 목표는 지난 잠입 때 확인하지 못했던 실종된 어부, 미야구치의 행방을 파악하고 소문의 근원을 조사하는 것이다."
901010600110-22 = "대부분의 항만 관계자는 소문에 대해 무관심해 보였지만, 놓치고 있는 점이 있을지도 모르니 주의 깊게 살펴보도록."
901010600110-24 = "확인!"
901010600110-27 = "그나저나 FOX 1, 어제 조사에서는 특별히 새로운 증거를 찾지 못했던 거야?"
901010600110-28 = "어제 조사……?"
901010600110-29 = "응. 어제 조사해 보고 싶은 것이 있다며 오후에 자리를 비웠었잖아."
901010600110-30 = "그래서 드럼통 게와 관련된 증거를 찾으러 혼자 움직인 줄 알았는데…… 아니었어?"
901010600110-31 = "아…… 어제의 일, 말인가."
901010600110-32 = "아무것도 아니었어. 지극히 개인적인 일이었으니까."
901010600110-34 = "헤에~ 개인적인 일이라."
901010600110-35 = "……왜 그런 반응이지, FOX 3?"
901010600110-36 = "아니. FOX 1이 휴일에 '진짜 개인적인 일'로 자리를 비우는 건 처음 보는 것 같아서."
901010600110-37 = "최근에 무슨 심경의 변화라도 있었던 거 아니야?"
901010600110-38 = "유키노가 변한 건, [USERNAME] 선생님이 왔기 때문이려나—"
901010600110-39 = "—작전과 상관없는 사담은 여기까지 하지."
901010600110-40 = "그럼, FOX 2. 잘 부탁한다."
901010600110-41 = "후후, 그럼 시작할게."
