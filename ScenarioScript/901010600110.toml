[translation]
901010600110-6 = ""
901010600110-7 = "FOX2，已進入Point Alpha。"
901010600110-8 = ""
901010600110-10 = ""
901010600110-11 = "收到。請其他小隊成員也依序回報。"
901010600110-12 = ""
901010600110-14 = ""
901010600110-16 = ""
901010600110-17 = "FOX3、FOX4同樣已抵達Point Sierra。"
901010600110-18 = "我會像上次一樣警戒周圍，遠距離支援FOX2。"
901010600110-20 = "……收到。"
901010600110-21 = "今天的作戰目標是掌握上次潛入時未能確認的失蹤漁夫「宮口」的行蹤，#n同時調查傳聞的根源。"
901010600110-22 = "雖然大部分的港口相關人員似乎都對傳聞漠不關心，#n但或許會有我們遺漏的地方，請務必仔細留意。"
901010600110-24 = "收到！"
901010600110-27 = "話說回來FOX1，昨天的調查沒有發現什麼新的線索嗎？"
901010600110-28 = "昨天的調查……？"
901010600110-29 = "嗯。你昨天不是說有事想調查，下午離開了一陣子嗎？"
901010600110-30 = "所以我以為你是獨自去找和鐵桶蟹有關的線索了……難道不是嗎？"
901010600110-31 = "啊……你是說昨天的事嗎。"
901010600110-32 = "沒有什麼特別的，只是極為私人的事而已。"
901010600110-34 = "哼嗯～私人的事啊。"
901010600110-35 = "……你那是什麼反應，FOX3？"
901010600110-36 = "沒有啦。我只是覺得這好像還是第一次看到FOX1在休假的時候，#n為了「真正私人的事」離開而已。"
901010600110-37 = "最近是不是有什麼心態上的轉變？"
901010600110-38 = "雪乃會有所改變，是因為[USERNAME]老師來了的緣故──"
901010600110-39 = "與作戰無關的閒聊就到此為止吧。"
901010600110-40 = "那麼FOX2。接下來就交給你了。"
901010600110-41 = "呵呵，那我就開始囉。"
