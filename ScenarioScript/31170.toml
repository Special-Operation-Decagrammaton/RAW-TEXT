[translation]
31170-1 = "제17화;트리니티의 배신자"
31170-2 = "나기 쨩이 이런 시설까지 지원해주고, 보충수업에 꽤 제대로 지원해주고 있는 것 같네."
31170-3 = "잘 되어가? 몰래 다른 짓하고 있는 건 아니지? 응? 가령 학생들과 함께 수영장에서 파티라던가. 응, 그런 느낌으로!"
31170-4 = "[s] \"……….\""
31170-5 = "……."
31170-6 = "그렇게 경계할 필요까진 없잖아, 선생님. 응, 나도 이래 봬도 섬세해서, 상처받는다구."
31170-7 = "식사는 제대로 하고 있어? 괜찮으면 내가 맛있는 음식이라도 좀 보내줄까? 케이크나 홍차 같은 거?"
31170-11 = "……후후후. 알겠어."
31170-12 = "선생님도 서론이 긴 건 별로 안 좋아하던가……. 그러면 바로 본론으로 들어갈게."
31170-13 = "아. 그 전에 먼저…… 내가 여기 온 건 나기 쨩도 모르는 일이야. 자, 봐. 수행원도 없이 이렇게 혼자 왔다니까?"
31170-14 = "……."
31170-15 = "……. 선생님. 나기 쨩에게 거래를 제안받았지?"
31170-16 = "[s] \"거래……?\""
31170-17 = "트리니티의 배신자를 찾는 거, 말야."
31170-18 = "[s] \"……….\""
31170-19 = "……. 하아. 그렇구나…… 예상했던 대로네. 정말이지, 나기 쨩도 참."
31170-20 = "선생님에게 제대로 된 정보를 주지도 않고, 다짜고짜 배신자를 찾아내라- 라고 한 거야? 정말로?"
31170-21 = "이유도, 목적도 제대로 밝히지 않고? 왜 보충수업부가 이 조합인지 나기 쨩이 알려줬어?"
31170-22 = "정말이지…… 아무것도 알려주지 않고 선생님에게 큰 짐을 지워버렸네."
31170-23 = "[s] \"그 제안은 내가 거절했어.\""
31170-24 = "……응? 거절? 왜?"
31170-25 = "자신의 학생들을 의심하고 싶지 않아서? 아니면……?"
31170-26 = "[s] \"트리니티의 배신자를 찾는 건 내 역할이 아니야.\""
31170-27 = "……헤에."
31170-28 = "응, 그렇구나……. 선생님은 <샬레>의 소속이지. 말하자면 트리니티와는 무관계한 제3자."
31170-29 = "트리니티라는 세계를 중심에 두고 있는 우리들로써는 조금 이해하기 어려울 수도 있겠지만."
31170-30 = "……재미있네. 응. 맞는 말이야. 신선한 관점. 그래서 거절한 거구나."
31170-31 = "그러면 선생님은 누구의 편이야?"
31170-32 = "트리니티의 편이 아니라면…… 게헨나? 총학생회? 아니면 그 누구의 편도 아닌……."
31170-33 = "[s] \"나는 그냥 학생들의 편이야.\""
31170-34 = "……."
31170-35 = "……. 으, 으응."
31170-36 = "학생들의 편…… 응. 그렇구나…… 이 대답은 예상하지 못했어……."
31170-37 = "……."
31170-38 = "저, 저기……. 그렇……다는 건……"
31170-39 = "선생님은…… 내 편이기도 하다는 뜻……도 될까? 저기, 나도…… 이래봬도 학생이고……. 응."
31170-40 = "[s] \"필요하다면 미카의 편이 되어줄게.\""
31170-41 = "……."
31170-42 = "우와…… 뭔가 대단한 말을 아무렇지도 않게 해버리는 구나, 선생님은……."
31170-43 = "이게 어른의 화법? 뻔하지만 조금 기쁠지도……. 에헤헤헤."
31170-44 = "하지만…… 동시에 그건 그 누구의 편도 아니라는 얘기이기도 하잖아? 나는 그런 거에 넘어가진 않아."
31170-45 = "응. 그러니까, 나는 내 관점에서 선생님과 거래를 제안하겠어."
31170-46 = "[s] \"거래……?\""
31170-51 = "보충수업부 안의 배신자가 누군지 알려줄게."
31170-52 = "[s] \"……!!\""
31170-53 = "단, 그건 어디까지나 나기 쨩이 찾고 있는 <트리니티의 배신자>야. 퇴학시키려고 안간힘을 쓰고 있는 바로 그 당사자지."
31170-54 = "실제로는 훨씬 더 복잡하고 커다란 문제가 펼쳐져 있지만……."
31170-55 = "이대로 선생님이 나기 쨩에게 휘둘리는 걸 두고 보기만 해선 예의가 아니니까."
31170-56 = "……알고 있어? 선생님을 보충수업부의 담임으로 초대한 게 바로 나였다는 걸?"
31170-57 = "[s] \"미카가……?\""
31170-58 = "응. 나기 쨩은 계속 반대했지만 말야. 빚을 지워뒀는데 이렇게 쓸 순 없다나? 어디 신세 진 거라도 있나 봐, 선생님."
31170-59 = "……."
31170-60 = "나는 트리니티도, 게헨나도 아닌 제3자의 입장이 필요했어."
31170-64 = "……아아. 배신자 얘기를 하고 있었지."
31170-65 = "보충수업부의 배신자는,"
31170-69 = "시라스 아즈사야."
31170-75 = "늦었군."
31170-76 = "……."
31170-81 = "준비는 잘 되어가나?"
31170-82 = "……아직까진 계획대로야."
31170-84 = "[ns] \"아즈사라고……?\""
31170-85 = "그래. 그 아이는 사실 트리니티 출신이 아니야."
31170-86 = "오래전에 트리니티의 연합에서 갈라져 나온 <아리우스 분교> 출신의 학생이야."
31170-87 = "……학생이라. 아니, 그런 표현은 조금 잘못되었을지도."
31170-88 = "아즈사가 학생이라고 할 수 있을까? 애초에 <배움>이라는 경험이 배제되어 있는데."
31170-89 = "[s] \"이 사실을 내게 알려주는 이유가 뭐야?\""
31170-90 = "……."
31170-91 = "……아마 선생님은 나기 쨩에게도 비슷한 질문을 했겠지? 나기 쨩은 뭐라고 대답했는지 모르겠지만."
31170-92 = "응, 이런 저런 이유는 차치하고, ……핵심을 말하자면."
31170-101 = "그 아이를 지켜주었으면 해."
31170-103 = "에덴조약 편;To be Continued in Chapter 2"
