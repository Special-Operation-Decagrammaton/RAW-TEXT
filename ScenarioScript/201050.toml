201050-26 = "Ah, Rin... No, Chief Officer. There you are."
201050-27 = "I heard you didn't return to your room last night. Did you get so stressed from being away from work that you pulled an all-nighter here?"
201050-28 = "That defeats the entire purpose of you taking a break."
201050-29 = "That's hardly the issue right now. This stranger—"
201050-30 = "...Anyways, what did you need from me, President?"
