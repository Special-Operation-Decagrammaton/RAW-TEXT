201050-132 = "หน่วยงานสืบสวนที่มีอำนาจเหนือกฎหมายและอยู่เหนือกฎของโรงเรียนต่างๆ สินะคะ"
201050-133 = "องค์กรที่มีอำนาจดำเนินการในระดับนี้ได้ ย่อมต้องได้รับอนุญาตจากประธานองค์การนักเรียนอย่างแน่นอน"
