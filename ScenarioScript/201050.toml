[translation]
201050-1 = "ตอนที่ 5;ข้อผิดพลาดของความทรงจำ"
201050-2 = ""
201050-3 = "คุณคือ... ประธานองค์การนักเรียนเหรอคะ?"
201050-4 = "ใช่ค่ะ... ทำไมจู่ๆ ถึงมีท่าทีแบบนี้ล่ะคะ ริน?"
201050-5 = "ฉันยอมรับว่าหายหน้าไปนาน แต่ก็ไม่เห็นต้องทำเหมือนกับฉันเป็น 'คนแปลกหน้า' เลยนี่คะ..."
201050-6 = "ไม่ค่ะ ฉันไม่รู้จักคุณ"
201050-8 = "ริน..."
201050-9 = "หรือว่าคุณยังติดใจเรื่องที่จู่ๆ ฉันก็หายตัวไปเหรอคะ?"
201050-10 = "ไม่ว่าฉันจะพูดอะไรไปก็คงเหมือนกับแก้ตัว แต่ถ้าจะให้อธิบายเรื่องราวที่ผ่านมา..."
201050-11 = "ฉันไม่ได้พูดเป็นนัยเพื่อตัดพ้อคุณเลย แต่ต้องการสื่อความตามที่พูดไปเลยค่ะ"
201050-12 = "ฉันไม่เคยรู้จักคุณ ทั้งใบหน้าและเสียงของคุณ... ฉันจำไม่ได้เลยว่าเคยเห็นหรือเคยได้ยินมาก่อนเลยค่ะ"
201050-13 = "แต่คุณกลับมาอ้างสิทธิ์ว่าเป็นประธานองค์การนักเรียน..."
201050-14 = "ถ้ามีใครขอให้คุณมาแกล้งฉันละก็ กรุณาหยุดเถอะค่ะ เพราะนี่ไม่ใช่เรื่องที่จะทำให้ฉันหัวเราะได้เลย"
201050-15 = "ดูเหมือนจะมีปัญหาเกิดขึ้นจริงๆ สินะคะ..."
201050-16 = "ทีมพิธีการ ช่วยเรียกอาโออิ... ไม่สิ เรียกหัวหน้าฝ่ายการเงินมาที่นี่ได้มั้ยคะ?"
201050-17 = "ฉันมีเรื่องจะหารือเกี่ยวกับอาการของหัวหน้าฝ่ายบริหารค่ะ"
201050-18 = "(...คนคนนี้คิดอะไรอยู่กันแน่?)"
201050-19 = "(ถ้าคนอื่นมาถึง ตัวตนจริงของเธอคงถูกเปิดเผยแท้ๆ แต่ในสถานการณ์แบบนี้ กลับเรียกหัวหน้าฝ่ายการเงินมาได้อย่างหน้าตาเฉยเนี่ยนะ)"
201050-20 = ""
201050-22 = ""
201050-25 = ""
201050-26 = "อ๊ะ รุ่นพี่ริน... ไม่สิ หัวหน้าฝ่ายบริหารมาอยู่ที่นี่เอง"
201050-27 = "เมื่อวานพอได้ยินว่าไม่ได้กลับที่พักทันทีก็เลยเป็นห่วงอยู่แท้ๆ... อย่าบอกนะว่าพอหมดวันหยุด ก็มาโต้รุ่งอยู่ที่นี่เลยน่ะ?"
201050-28 = "แบบนี้วันหยุดก็เสียเปล่าน่ะสิ"
201050-29 = "ตอนนี้เรื่องนั้นไม่สำคัญแล้วละค่ะ มีคนนอกที่ฉันไม่เคยเห็นหน้ามาก่อนอยู่ที่นี่ด้วย..."
201050-30 = "ว่าแต่เรียกมามีอะไรเหรอ 'ประธานองค์การนักเรียน'?"
201050-31 = "คะ...?"
201050-32 = "อาโออิ เมื่อกี้เรียกคนคนนี้ว่าอะไรนะคะ..."
201050-33 = "เมื่อกี้ฉันพูดอะไรผิดเหรอ?"
201050-34 = "ฉันก็แค่ทักทายประธานองค์การนักเรียนตามปกติเองนี่นา..."
201050-35 = "แม้แต่อาโออิก็ด้วย... "
201050-36 = "คุณไม่รู้สึกแปลกเลยเหรอคะที่คนคนนี้มาอยู่ในตำแหน่งประธานองค์การนักเรียนน่ะ?"
201050-37 = "รุ่นพี่รินนั่นแหละกำลังพูดอะไรอยู่?"
201050-38 = "คนที่อยู่ตรงนี้..."
201050-39 = "ก็คือประธานองค์การนักเรียนของพวกเรานะ"
201050-40 = ""
201050-42 = ""
201050-43 = ""
201050-44 = "หืม...? ประธานองค์การนักเรียน? ประธานองค์การนักเรียนก็หน้าตาแบบนี้มาตั้งนานแล้วไม่ใช่เหรอ?"
201050-45 = "ถึงจะรู้สึกว่าสีหน้าดูเปลี่ยนไปนิดหน่อยก็เถอะ... แต่ก็ไม่รู้สินะ~"
201050-46 = ""
201050-47 = "จำได้อยู่แล้วสิ จะลืมผมสีแพลทินัมบลอนด์หนาๆ ที่เหมือนกับมันฝรั่งทอดรสไข่ปลาเมนไทโกะนั่นได้#nยังไงกันล่ะ?"
201050-48 = "ในความทรงจำของรุ่นพี่ริน ผมของประธานเป็นสีฟ้ารึไง?"
201050-49 = "จำผิดเพราะคำว่าแพลทินัมรึเปล่า?"
201050-50 = ""
201050-51 = "รูปลักษณ์ของประธานองค์การนักเรียนเหรอ? ก็ต้องจำได้อยู่แล้วสิ!"
201050-52 = "ผมสีชมพู ดวงตาสีเขียว..."
201050-53 = "ไม่ๆ นั่นมันอดีตผู้รักษาการแทนคายะนี่นา  แล้วประธานองค์การนักเรียนหน้าตาเป็นยังไงนะ...?"
201050-54 = "อืม... ผมดำรึเปล่านะ?"
201050-55 = ""
201050-56 = "ระ... รุ่นพี่... ถึงจะถามซ้ำๆ ฉันก็ตอบไม่ได้หรอกค่ะ"
201050-57 = "ในสายตาฉัน ประธานองค์การนักเรียนไม่ได้เปลี่ยนไปเลย เธอยังดูเหมือนเดิมทุกอย่างเลยค่ะ"
201050-58 = ""
201050-60 = ""
201050-61 = "หรือว่า... ถึงจะเสียมารยาทไปสักหน่อย..."
201050-62 = "ช่วงนี้รุ่นพี่ฝืนตัวเองมากเกินไป จนทำให้ความทรงจำสับสนรึเปล่าคะ?"
201050-63 = ""
201050-64 = "ใจเย็นลงบ้างแล้วรึยังคะ...?"
201050-65 = "ดูไม่เหมือนรินอย่างที่เคยเป็นมาเลยนะคะ"
201050-66 = ""
201050-68 = ""
201050-69 = "ทำไม... ทุกคนถึงจำกันไม่ได้ล่ะคะ?"
201050-70 = "ทั้งที่อยู่ด้วยกันมาตั้งนาน... ทำไมทุกคนถึงจำประธานองค์การนักเรียนไม่ได้คะ?"
201050-71 = "ไม่สิ ตัวคุณที่ทุกคนเชื่อว่าเป็นประธานองค์การนักเรียน... แท้จริงแล้วเป็นใครกันแน่?"
201050-72 = "... บางทีอาจเป็นความผิดของฉันเองก็ได้ค่ะ"
201050-73 = "เพราะการที่ฉันหายตัวไป ทำให้คุณต้องรับภาระหนักมากเกินไป"
201050-74 = "ความทรงจำของคนเราเปลี่ยนแปลงได้จากความเครียดหรือความเหนื่อยล้าที่มากเกินไป เพราะฉะนั้น ต่อให้รินจำฉันไม่ได้..."
201050-75 = "ไม่ค่ะ ฉันไม่ได้สติเลอะเลือนอะไรเลย"
201050-76 = "ต่อให้คนอื่นจะจำไม่ได้... แต่ร่องรอยและบันทึกต่างๆ ที่เธอทิ้งไว้ยังคงเหลืออยู่นี่คะ"
201050-77 = "อย่างน้อยที่สุด แค่รูปถ่ายที่ถ่ายร่วมกับประธาน..."
201050-78 = ""
201050-80 = ""
201050-81 = ""
201050-82 = ""
201050-83 = "ทำไมกัน...?"
201050-84 = "รูปที่ถ่ายด้วยกัน... ประธานกลับหายไป...?"
201050-85 = "ขอโทษนะคะ ริน"
201050-86 = "ตอนนี้ฉันกลับมาแล้ว ไม่ต้องกังวลเรื่องงานจนเกินไปแล้วละค่ะ"
201050-87 = "ใช้โอกาสนี้พักผ่อนต่ออีกสักหน่อยเถอะนะคะ"
201050-88 = "รูปนี้มันควรจะ..."
201050-89 = ""
