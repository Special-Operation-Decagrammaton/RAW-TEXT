201050-11 = "That wasn't a passive aggressive comment because I'm angry. I meant it exactly as I said it."
201050-12 = "I don't know you. I have no memories of someone like you in my life at all."
201050-13 = "I know the President's face. So for you to claim to be her..."
201050-14 = "If this is a prank on someone's behalf, or something more sinister, I do NOT find it funny."
201050-15 = "...I really wanted to avoid this."
201050-16 = "Protocol Team, can you call Aoi... No, the Chief of Finance here right now?"
201050-17 = "Tell her it's about a concern I have about the Chief Officer's condition."
