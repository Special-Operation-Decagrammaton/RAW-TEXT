201050-96 = ""
201050-97 = "คุณครู [USERNAME]...!"
201050-98 = "มาได้จังหวะพอดีเลยค่ะ ฉันอยากขอความคิดเห็นจากคุณครูด้วยค่ะ"
201050-99 = "คุณครูคิดว่านักเรียนคนนี้หน้าตาเหมือนประธานองค์การนักเรียนรึเปล่าคะ?"
201050-100 = ""
201050-103 = "[ns3] \"ประธานองค์การนักเรียน...?\"\n[ns4] \"ขอโทษนะ แต่ครูไม่เคยเห็นหน้าเธอมาก่อนเลย...\""
201050-106 = "คิดแล้วเชียว...!"
201050-107 = "ฉันคิดว่าจะต้องมีใครสักคนที่จำประธานองค์การนักเรียนตัวจริงได้ค่ะ"
201050-108 = "ความทรงจำของฉัน... ประธานองค์การนักเรียนที่ฉันจำได้ คงไม่ได้ผิดไปใช่มั้ยคะ?"
201050-109 = "[s5] \"ใจเย็นๆ ก่อนนะ ริน\"\n[s6] \"นักเรียนคนนี้เองก็ดูจะลำบากใจอยู่เหมือนกัน\""
