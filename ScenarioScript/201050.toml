201050-3 = "You... The General Student Council President...?"
201050-4 = "Of course I am... What's going on, Rin?"
201050-5 = "I know I've been away for a long time, but I am hardly a stranger..."
201050-6 = "No. You are a stranger. Who are you?"
201050-8 = "...Rin."
