[translation]
201050-1 = "第5話;記憶的謬誤"
201050-2 = ""
201050-3 = "你是……聯邦學生會長？"
201050-4 = "是這樣沒錯……為什麼這麼問呢，琳？"
201050-5 = "就算我確實離開了一段時間，你也沒必要把我當成「初次見面的人」對待吧……"
201050-6 = "不。我不認識你。"
201050-8 = "……琳。"
201050-9 = "難道是我突然消失的事，讓你一直耿耿於懷嗎？"
201050-10 = "雖然無論我現在說什麼聽起來都像是藉口，但只要向你說明這段期間的來龍去脈──"
201050-11 = "我並不是在用修辭性的表達來代替埋怨，而是字面上的意思。"
201050-12 = "我不認識你。#n無論是你的長相還是聲音……我都沒有印象。"
201050-13 = "然而你竟然以那張陌生的臉孔自稱是聯邦學生會長……"
201050-14 = "如果你是受人委託來捉弄我的話，請你就此停手。#n這種玩笑實在是讓人笑不出來。"
201050-15 = "……看來似乎是出了什麼問題呢。"
201050-16 = "禮賓組，能請你們現在馬上把碧……不，把財務室長找來嗎？"
201050-17 = "我想跟他聊聊首席行政官的狀況。"
201050-18 = "（……這個人到底在想什麼？）"
201050-19 = "（明明其他人過來就會導致身分穿幫，居然還若無其事地把財務室長找來……）"
201050-20 = ""
201050-22 = ""
201050-25 = ""
201050-26 = "啊，琳前輩……不，首席行政官。原來你在這裡啊。"
201050-27 = "昨天聽說你沒有直接回宿舍，我還很擔心呢……#n難不成假期一結束，你就在這裡工作了一整晚嗎？"
201050-28 = "這樣難得的休假不就失去意義了嗎？"
201050-29 = "現在不是說這個的時候，這裡有個我沒見過的──"
201050-30 = "……話說，您這次找我過來有什麼事嗎，「聯邦學生會長」？"
201050-31 = "……咦？"
201050-32 = "碧，你剛才說這個人是誰……？"
201050-33 = "我剛才有說錯什麼嗎？"
201050-34 = "我只不過是跟以往一樣和聯邦學生會長說話而已……"
201050-35 = "連碧也……"
201050-36 = "你不認為這個人坐在聯邦學生會長的位置上很奇怪嗎？"
201050-37 = "突然說這些的琳前輩比較奇怪吧？"
201050-38 = "眼前的這個人……"
201050-39 = "就是我們的聯邦學生會長啊。"
201050-40 = ""
201050-42 = ""
201050-43 = ""
201050-44 = "唔嗯……聯邦學生會長？#n聯邦學生會長不是本來就長那樣嗎？"
201050-45 = "雖然給人的印象是有點不太一樣……但我不覺得有什麼問題耶～"
201050-46 = ""
201050-47 = "當然記得囉。#n那頭像明太子口味洋芋片一樣豐盈的白金色頭髮，我怎麼可能會忘記呢？"
201050-48 = "在琳前輩的記憶裡，聯邦學生會長的頭髮是藍色的……？"
201050-49 = "是不是前輩你記錯了啊？"
201050-50 = ""
201050-51 = "聯邦學生會長的模樣？我當然記得啊！"
201050-52 = "有著粉紅色頭髮和綠色眼睛……"
201050-53 = "不對，這是香耶前代理的特徵吧。#n聯邦學生會長是什麼樣子來著……？"
201050-54 = "唔嗯……是黑髮嗎？"
201050-55 = ""
201050-56 = "前，前輩……就算您一直問我，我也不太清楚。"
201050-57 = "在我看來，聯邦學生會長還是跟以前一模一樣呀。"
201050-58 = ""
201050-60 = ""
201050-61 = "雖然這麼說可能有點失禮……"
201050-62 = "會不會是前輩最近太勉強自己，導致記憶出現了某種混亂呢？"
201050-63 = ""
201050-64 = "……稍微冷靜下來了嗎？"
201050-65 = "總覺得今天的琳和平常不太一樣呢。"
201050-66 = ""
201050-68 = ""
201050-69 = "為什麼……大家都不記得了呢？"
201050-70 = "明明相處了那麼長的時間……為什麼大家都不記得聯邦學生會長了呢？"
201050-71 = "不對，被所有人視為聯邦學生會長的你……究竟是誰？"
201050-72 = "……這或許是我的責任也說不定。"
201050-73 = "都是因為我離開了崗位，才讓你背負了如此沉重的責任。"
201050-74 = "人的記憶，有時也會因為過度的壓力或疲勞而輕易產生偏差。#n所以就算琳不記得我──"
201050-75 = "不。我的記憶沒有出錯。"
201050-76 = "就算大家都不記得了……他所留下的痕跡與記錄依然存在。"
201050-77 = "至少和會長一起拍的照片是不可能──"
201050-78 = ""
201050-80 = ""
201050-81 = ""
201050-82 = ""
201050-83 = "怎麼會……？"
201050-84 = "明明是和會長一起拍的照片……會長的身影卻消失了……？"
201050-85 = "……對不起，琳。"
201050-86 = "既然我已經回來，你暫時就不需要太擔心業務方面的事了。"
201050-87 = "趁這個機會，再去休息幾天吧。"
201050-88 = "這張照片明明……"
201050-89 = ""
201050-93 = "[ns1] 「早安，琳醬！」\n[ns2] 「昨晚睡得好嗎？」"
201050-96 = ""
201050-97 = "[USERNAME]老師……！"
201050-98 = "您來得正好。我也想請教老師的意見。"
201050-99 = "在老師您的眼中，這位學生看起來也是聯邦學生會長嗎？"
201050-100 = ""
201050-103 = "[ns3] 「聯邦學生會長……？」\n[ns4] 「抱歉，我沒見過這個人……」"
201050-106 = "……果然沒錯！"
201050-107 = "我一直相信，至少還會有一個人記得真正的聯邦學生會長。"
201050-108 = "我的記憶……我所記得的聯邦學生會長，並不是虛假的吧？"
201050-109 = "[s5] 「先冷靜下來，琳。」\n[s6] 「那位學生看起來也挺為難的。」"
201050-112 = ""
201050-115 = "[ns] 「總之，先聽聽對方怎麼說吧。」"
201050-116 = "哎呀……"
201050-117 = "琳居然會如此依賴大人，真是難得呢。"
201050-118 = "雖然對墨守成規的琳來說是個好的轉變，總覺得有股莫名的失落感呢。呵呵。"
201050-119 = "[s] 「……可以先請你自我介紹一下嗎？」"
201050-120 = "好的。初次見面。"
201050-121 = "我是負責管理這座學園都市奇普托斯的聯邦學生會會長。"
201050-122 = "雖然自己說這種話有點難為情，不過我在奇普托斯還算有點知名度。#n只要是奇普托斯的居民，應該幾乎都認得我才對……"
201050-123 = "然而您卻對我感到陌生，真是個新奇的反應呢。"
201050-124 = "難道說，您是從奇普托斯外面來的人嗎？"
201050-125 = "方便的話，我也想聽聽您的自我介紹。"
201050-126 = "[s] 「我是夏萊的[USERNAME]老師。」"
201050-127 = "夏萊……？"
201050-128 = "請問，「夏萊」是從事什麼工作的組織呢？"
201050-129 = "[s7] 「夏萊是擁有超法規權限的聯邦搜查部。」\n[s8] 「主要的任務是負責傾聽並解決學生們的煩惱。」"
201050-132 = "擁有凌駕於學園之上的超法規權限的搜查機關啊。"
201050-133 = "……擁有這種權限的機關若要展開活動，想必需要獲得聯邦學生會長的許可吧。"
201050-134 = ""
201050-136 = ""
201050-137 = "不過，我並不記得自己曾經許可過那樣的組織進行活動……"
201050-138 = "看來這並不是一句「不記得」就能輕鬆帶過的事呢。"
201050-139 = "[s] 「……咦？」"
201050-140 = ""
201050-144 = "[ns] 「……不會吧！？」"
201050-146 = "下一話;超人的回歸"
