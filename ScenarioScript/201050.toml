201050-116 = "ตายจริง..."
201050-117 = "ได้เห็นรินพึ่งพาผู้ใหญ่แบบนี้ เป็นเรื่องหายากนะคะเนี่ย"
201050-118 = "ฉันคิดว่าเป็นการเปลี่ยนแปลงที่ดีสำหรับรินที่เข้มงวดนะคะ แต่ก็แอบรู้สึกเสียใจยังไงไม่รู้ ฮุฮุ"
201050-119 = "[s] \"ก่อนอื่นก็... ช่วยแนะนำตัวหน่อยได้มั้ย\""
201050-120 = "ยินดีที่ได้รู้จักนะคะ"
201050-121 = "ฉันดำรงตำแหน่งหัวหน้าขององค์การนักเรียน และเป็นผู้รับผิดชอบการบริหารคิโวทอส เมืองแห่งการศึกษานี้ค่ะ"
201050-122 = "ถึงจะน่าอายที่ต้องพูดออกมาเอง แต่ฉันค่อนข้างเป็นที่รู้จักอย่างกว้างขวางในคิโวทอส ถ้าเป็นพลเมืองของคิโวทอสละก็ คิดว่าส่วนใหญ่จะรู้จักฉันดีค่ะ..."
201050-123 = "การที่คุณแสดงออกว่าไม่คุ้นเคยใบหน้าของฉันแบบนี้ เป็นเรื่องน่าสนใจมากเลยนะคะ"
201050-124 = "หรือว่ามาจากข้างนอกคิโวทอสเหรอคะ?"
201050-125 = "ถ้าไม่ว่าอะไร ฉันก็อยากให้คุณแนะนำตัวด้วยเช่นกันค่ะ"
