[translation]
201050-1 = "제5화;기억의 오류"
201050-3 = "당신이…… 총학생회장이라고요?"
201050-4 = "그렇습니다만…… 갑자기 왜 그러는 건가요, 린?"
201050-5 = "물론 제가 오랫동안 자리를 비우긴 했지만, 그렇게 '처음 보는 사람'처럼 대할 필요는……"
201050-6 = "아니요. 저는 당신을 모릅니다."
201050-8 = "……린."
201050-9 = "혹시 제가 갑자기 사라졌던 것 때문에 계속 마음을 쓰고 있었나요."
201050-10 = "무슨 말을 하더라도 변명이 될 수는 없겠지만, 그간의 경위에 대해 설명을 드리자면—"
201050-11 = "수사적인 표현으로 원망을 대신하는 게 아니라, 문자 그대로의 뜻입니다."
201050-12 = "저는 당신을 모릅니다. 당신의 얼굴도 목소리도…… 전에 본 기억이 없습니다."
201050-13 = "그런데 그 낯선 얼굴로 총학생회장을 자칭하다니……"
201050-14 = "혹시라도 누군가의 부탁을 받고 저를 놀리는 거라면 그만 둬 주세요. 도저히 웃을 수 있는 화제가 아니니까."
201050-15 = "……아무래도 무언가 문제가 있는 모양이군요."
201050-16 = "의전팀, 지금 바로 아오이…… 아니, 재무실장을 불러주시겠어요?"
201050-17 = "수석행정관의 상태와 관련하여 할 이야기가 있습니다."
201050-18 = "(……이 사람은 도대체 무슨 생각이죠?)"
201050-19 = "(다른 사람이 도착한다면 정체가 바로 들통날 텐데, 이 상황에 태연하게 재무실장을 부르다니.)"
201050-26 = "아, 린 선배…… 아니, 수석행정관. 여기 있었구나."
201050-27 = "어제는 바로 숙소에 돌아가지 않았다고 해서 걱정했었는데…… 설마 휴가가 끝나자마자 여기서 밤을 샌 거야?"
201050-28 = "이래서야 모처럼 휴가를 준 보람이 없잖아."
201050-29 = "지금 그게 중요한 게 아닙니다. 여기에 처음 보는 외부인이—"
201050-30 = "……그보다 이번은 무슨 일로 부른 거야, '총학생회장'?"
201050-31 = "……네?"
201050-32 = "아오이, 방금 이 사람을 뭐라고……"
201050-33 = "방금 뭔가 말 실수라도 했어?"
201050-34 = "나는 예전처럼 평범하게 총학생회장에게 말을 건 것 뿐인데……"
201050-35 = "아오이 마저……"
201050-36 = "당신도 이 사람이 총학생회장의 자리에 있는 것이 이상하지 않단 말인가요?"
201050-37 = "린 선배야 말로 무슨 소리를 하는 거야?"
201050-38 = "여기에 있는 이 사람이……"
201050-39 = "우리의 총학생회장이야."
201050-44 = "으응……? 총학생회장? 총학생회장은 원래부터 저 얼굴이지 않았어?"
201050-45 = "인상이 조금 바뀐 것 같긴 하지만…… 난 모르겠어~"
201050-47 = "당연히 기억하고 말고. 명란 맛 감자칩 같은 저 풍성한 백금발을 잊어버릴 리가 없잖아?"
201050-48 = "린 선배의 기억 속에서는 총학생회장의 머리가 푸른색이었다고……?"
201050-49 = "백금이라는 말 때문에 착각한 거 아냐?"
201050-51 = "총학생회장의 모습? 당연히 기억하고 있지!"
201050-52 = "분홍색 머리에 초록색 눈동자를 지닌……"
201050-53 = "아니, 이건 카야 전 대행의 특징인데. 총학생회장은 어떻게 생겼더라……?"
201050-54 = "그러니까…… 흑발, 이었던가?"
201050-56 = "서, 선배님…… 그렇게 계속 물어보셔도 저는 잘 모르겠어요."
201050-57 = "제가 보기에 총학생회장은 하나도 변치 않은, 예전 그대로의 모습인 걸요."
201050-61 = "혹시…… 실례되는 말일지도 모르지만……"
201050-62 = "최근 너무 무리하신 탓에 무언가 기억에 혼란이 온 게 아닐까요?"
201050-64 = "……조금은 진정이 되었나요?"
201050-65 = "어쩐지 평소의 린 답지 못한 모습이네요."
201050-69 = "어째서…… 다들 기억하지 못하는 거죠?"
201050-70 = "그렇게 오랜 시간 함께해 왔으면서…… 어째서 다들 총학생회장을 기억하지 못하는 거죠?"
201050-71 = "아니, 모두가 총학생회장이라고 여기고 있는 당신은…… 도대체 누구인 거죠?"
201050-72 = "……어쩌면 제 책임일지도 모릅니다."
201050-73 = "제가 자리를 비운 탓에 당신에게 너무 큰 책임을 짊어지게 했으니까요."
201050-74 = "사람의 기억은 과한 스트레스나 피로 등으로도 쉽게 변질되기도 합니다. 그러니 린이 저를 기억하지 못한다 하더라도—"
201050-75 = "아니요. 착각한 게 아닙니다."
201050-76 = "사람들이 기억하지 못한다 하더라도…… 그녀가 남긴 흔적이, 기록이 남아있으니까요."
201050-77 = "하다못해 회장과 함께 찍은 사진만 하더라도……"
201050-83 = "어째서……?"
201050-84 = "회장과 함께 찍은 사진에서…… 회장의 모습이 사라져 있어……?"
201050-85 = "……미안해요, 린."
201050-86 = "제가 돌아왔으니 당분간은 업무에 크게 신경 쓸 일은 없을 겁니다."
201050-87 = "이 기회에 조금 더 휴가를 갖도록 하세요."
201050-88 = "……분명히 이 사진은……"
201050-93 = "[ns1] \"좋은 아침, 린 쨩!\"\n[ns2] \"어젯밤은 푹 잘 잤어?\""
201050-97 = "[USERNAME] 선생님……!"
201050-98 = "마침 잘 오셨습니다. 선생님께도 의견을 여쭈고 싶습니다."
201050-99 = "혹시 선생님의 눈에도 이 학생이 총학생회장으로 보이시나요?"
201050-103 = "[ns3] \"총학생회장……?\"\n[ns4] \"미안하지만 처음보는 얼굴인데……\""
201050-106 = "……역시!"
201050-107 = "진짜 총학생회장을 기억하는 사람이 한 사람은 남아있을 거라 생각했습니다."
201050-108 = "제 기억이…… 제가 기억하고 있는 총학생회장이 틀린 건 아니겠지요?"
201050-109 = "[s5] \"일단 진정해, 린.\"\n[s6] \"이 쪽의 학생도 곤란해하고 있잖아.\""
201050-115 = "[ns] \"우선은 상대의 이야기를 먼저 들어보자.\""
201050-116 = "어머……"
201050-117 = "린이 이렇게 어른을 의지하다니, 드문 일이네요."
201050-118 = "고지식한 린에게는 좋은 변화라고 생각하지만, 어쩐지 조금 서운할지도. 후훗."
201050-119 = "[s] \"……먼저 자기 소개를 부탁해도 괜찮을까?\""
201050-120 = "그럼, 처음 뵙겠습니다."
201050-121 = "저는 이곳 학원도시 키보토스를 관리하는 총학생회의 회장직을 맡고 있습니다."
201050-122 = "제 입으로 이런 말씀을 드리는 건 부끄럽지만, 키보토스에서는 얼굴이 꽤 알려 있는지라. 키보토스의 주민들이시라면 대부분 저를 알고 있을 거라 생각합니다만……"
201050-123 = "제 얼굴이 낯설게 느껴지신다니 신기한 반응이네요."
201050-124 = "혹시 귀하께서는 키보토스 밖에서 오신 분이신가요?"
201050-125 = "괜찮으시다면 그 쪽의 소개도 듣고싶습니다만."
201050-126 = "[s] \"나는 샬레의 [USERNAME] 선생이라고 해.\""
201050-127 = "샬레……?"
201050-128 = "저, <샬레>는 무슨 일을 하는 조직이죠?"
201050-129 = "[s7] \"샬레는 초법적인 권한을 지닌 연방 수사 동아리야.\"\n[s8] \"학생들의 고민을 들어주거나 해결해주는 일을 하고 있어.\""
201050-132 = "학원을 초월하는 초법적인 권한을 지닌 수사 기관이라."
201050-133 = "……이 정도의 권한을 지닌 기관이 활동하기 위해서는 분명 총학생회장의 허가가 필요하겠지요."
201050-137 = "다만 제게는 그런 조직의 활동을 허가한 기억이 없습니다만……"
201050-138 = "아무래도 기억에 없다는 말 만으로 가볍게 넘어갈 사안은 아닌 것 같은데요."
201050-139 = "[s] \"………응?\""
201050-144 = "[ns] \"……정말로?!\""
201050-146 = "다음화;초인의 귀환"
