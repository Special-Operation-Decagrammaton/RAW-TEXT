70013020-46 = ""
70013020-47 = ""
70013020-48 = "เอ๋? นั่นมัน <น้องวัชพืช> นี่นา"
70013020-49 = "น้องวัชพืช?"
70013020-50 = "อื้อ ฉันเห็นเขาชอบดูแลวัชพืชข้างถนนอยู่ตลอด ก็เลยเรียกว่าวัชพืชจังน่ะ "
70013020-51 = "แล้วชื่อจริงล่ะ?"
70013020-52 = "ไม่รู้หรอก พอลองเข้าไปทักก็ไม่ยอมคุยด้วยเลย"
70013020-53 = "รู้สึกว่า... เป็นเด็กที่พิลึกดีแฮะ"
70013020-55 = ""
70013020-56 = ""
70013020-57 = ""
70013020-59 = "แหะ... แหะๆ "
70013020-60 = "โตขึ้นกว่าเมื่อวานนิดหน่อยแล้วนะคะ ใบก็ดูแข็งแรงขึ้นแล้ว..."
70013020-61 = "วันนี้ฉันจะมารดน้ำให้ค่ะ คงจะหิวน้ำกันแล้วสินะ..."
70013020-62 = ""
70013020-64 = ""
70013020-65 = "แหะๆ... แหะๆๆ..."
70013020-66 = ""
70013020-71 = ""
70013020-73 = "หายหน้าไปทั้งวัน มาหลบอยู่ที่นี่เองเหรอ?"
70013020-75 = "ปะ... เปล่านะคะ! ฉันไม่ได้หลบเลยนะคะ...!"
70013020-76 = "ไม่ได้หลบอะไรล่ะ! แล้วทำไมถึงมานั่งอยู่ในตรอกมืดๆ แบบนี้?"
70013020-77 = "คะ... คือว่าเด็กคนนี้..."
70013020-78 = "หืม? อย่าบอกนะว่า <เด็กคนนี้> ที่พูดถึงน่ะ หมายถึงวัชพืชพวกนี้?"
70013020-80 = "น่าตลกเป็นบ้า วัชพืชห่วยๆ พวกนี้มันมีค่าที่ไหนกัน!"
70013020-81 = "ถ้ามีเวลาทำเรื่องไร้สาระแบบนี้ ก็รีบไปหาเงินส่วยที่ค้างอยู่มาให้ฉันซะ!"
70013020-82 = "เด็กๆ! ขยี้วัชพืชพวกนี้ให้เละเลย!"
70013020-83 = "อ๊ะ อ๊าาา...!"
70013020-84 = "ขะ... ขอโทษค่ะ! อย่าทำแบบนั้นเลยนะคะ...!!"
70013020-85 = ""
70013020-88 = ""
70013020-89 = ""
70013020-90 = ""
70013020-91 = ""
70013020-95 = "อะ... อย่าทำนะ! หยุดเถอะค่ะ! มะ... มาลงที่ฉันแทนเถอะ...! ขอร้องละ...! ขอร้องละค่ะ...!!"
70013020-96 = "ขอมาทั้งทีก็จัดให้!"
70013020-97 = "วะฮ่าฮ่าฮ่าฮ่าฮ่า...!!"
70013020-98 = ""
70013020-102 = ""
70013020-103 = "ฮุฮุ ตอนนี้เข้าใจรึยัง? เธอไม่มีวันขัดขืนพวกเราได้หรอก"
70013020-104 = "ถ้าเข้าใจก็รีบไปหาเงินมาได้แล้ว!"
70013020-105 = "ไม่งั้นคราวหน้า หน้าตาอัปมงคลของเธอ... ได้อัปลักษณ์กว่าเก่าแน่...!"
70013020-106 = ""
70013020-110 = ""
70013020-111 = ""
70013020-112 = ""
70013020-113 = "อะ... อะไรน่ะ! ใครกัน...!"
70013020-115 = ""
70013020-117 = "......"
70013020-119 = "เธอ...! รู้รึเปล่าว่าเพิ่งยิงปืนใส่ใคร?!"
70013020-121 = "ไม่รู้"
70013020-122 = "อืม แต่ก็คงไม่ใช่คนดีเด่นอะไรหรอกมั้ง"
70013020-123 = "ดูจากการที่เอาแต่รังแกคนที่อ่อนแอกว่าในที่แบบนี้น่ะ"
70013020-125 = "ยะ... ยะ... ยัยเด็กนี่...!!"
70013020-126 = ""
70013020-128 = ""
70013020-129 = ""
70013020-130 = "หืม? นี่คิดจะมีเรื่องกับพวกเราเหรอ? พวกเรามีคนเยอะกว่านะ?"
70013020-131 = ""
