70013020-138 = "ปะ... ไปกันเถอะ!"
70013020-139 = "ฝะ... ฝากไว้ก่อนเถอะ...!!"
70013020-140 = ""
70013020-142 = ""
70013020-143 = ""
70013020-144 = ""
70013020-145 = ""
70013020-146 = "เธอน่ะ ไม่เป็นไรใช่มั้ย?"
70013020-147 = "......"
70013020-148 = ""
70013020-150 = ""
70013020-152 = ""
70013020-153 = "เจ้าพวกนั้นเหยียบต้นไม้ที่เด็กคนนี้ดูแลอยู่... เละหมดเลย..."
70013020-155 = "......"
70013020-156 = "ไม่เป็นไรหรอกน่า อย่าห่วงเลย! อย่างน้อยพวกเราก็ไล่เจ้าพวกนั้นไปได้แล้วละ"
70013020-157 = "จะไม่เป็นไร... ได้ยังไงล่ะคะ"
70013020-158 = "เจ้าพวกนั้น... เดี๋ยวก็คงกลับมาอีก..."
70013020-159 = "ขอโทษนะคะ... ฉันขอโทษด้วยจริงๆ..."
70013020-160 = ""
70013020-162 = ""
70013020-163 = "ที่ปกป้อง... เอาไว้ไม่ได้..."
70013020-165 = "......"
70013020-166 = "เจ้าพวกนั้นคอยรังแกเธออยู่ใช่มั้ย?"
70013020-167 = "พวกเราจะจัดการให้เอง ว่าแต่ว่าเธอชื่ออะไรน่ะ?"
70013020-168 = ""
70013020-170 = ""
70013020-171 = "ขอโทษด้วยค่ะ... แต่ฉันคงบอกไม่ได้"
70013020-172 = "อย่าพยายามที่จะรู้อะไรเลยดีกว่าค่ะ"
70013020-173 = "ถ้าเข้ามาพัวพันกับคนน่ารังเกียจอย่างฉัน... ทุกคนคงไม่ปลอดภัยแน่ๆ ค่ะ"
70013020-175 = "ทำไมถึงพูดแบบนั้นกัน..."
70013020-176 = "เอาเป็นว่าตอนนี้พวกเรากลับกันก่อนเถอะ"
70013020-177 = "เด็กคนนั้นไม่ได้อยู่ในสภาพที่พร้อมจะคุยด้วยหรอก"
70013020-178 = "ถ้าขืนยังไล่ต้อนแมวที่ปีนขึ้นที่สูงไปเรื่อยๆ... เดี๋ยวมันจะกระโดดลงจากต้นไม้ไปนะ"
70013020-179 = "......"
70013020-180 = "เข้าใจแล้ว ตอนนี้พวกเราจะกลับก่อนแล้วกัน"
70013020-182 = "......"
70013020-183 = "ไว้เจอกันใหม่นะ วัชพืชจัง!"
70013020-184 = "น้อง... วัชพืช?"
70013020-185 = "อ๊ะ...! ทะ... โทษที! ฉันลืมตัวน่ะ..."
70013020-186 = "ต้นไม้ที่อุตส่าห์ดูแลมาถูกทำแบบนั้นไปแล้ว... ขอโทษจริงๆ ฉันเผลอไม่ระวังคำพูดเอง"
70013020-187 = "......"
70013020-188 = "ไม่หรอกค่ะ ไม่เป็นไรเลยค่ะ..."
70013020-189 = "เพราะตัวฉันก็เหมือนกับวัชพืชน่ะ... แหะๆๆ..."
70013020-190 = "มันคงเป็นชื่อเล่นที่เหมาะกับฉันที่สุดแล้ว..."
70013020-191 = "แหะๆๆ..."
70013020-192 = ""
70013020-194 = ""
70013020-195 = "มะ... เหมือนฉันจะทำพลาดไปเลยแฮะ"
70013020-197 = "คงปล่อยเรื่องนี้ไปไม่ได้จริงๆ ด้วย"
70013020-198 = "จะทำงานฟรีรึไง?"
70013020-199 = "ฟะ... ฟรีอะไรกันล่ะ?!"
70013020-200 = "ฉันก็แค่ไม่อยากเห็นนักเลงกลุ่มอื่นมาอาละวาดในเขตของเราก็เท่านั้น เหตุผลของฉันมีแค่นั้น ไม่มีเรื่องอื่น"
70013020-201 = "อืม งั้นก็ตกลงตามนั้น"
70013020-202 = "แต่ว่าอารุจัง เธอจะวางแผนช่วยคนที่ไม่รู้แม้กระทั่งชื่อได้ยังไงเหรอ?"
70013020-203 = ""
70013020-205 = ""
70013020-206 = "ระ... เรื่องนั้น..."
70013020-207 = "ฉันพอจะเดาได้แล้วละ ตามมาสิ"
70013020-209 = ""
70013020-210 = ""
70013020-211 = ""
70013020-212 = ""
70013020-214 = "การรวบรวมข้อมูลของคาโยโกะดำเนินต่อไปอีกพักใหญ่"
70013020-215 = "หลังจากนั้นไม่นาน..."
70013020-216 = ""
70013020-217 = "ทุกคนมาทางนี้หน่อย ฉันพอรู้เรื่องมาบ้างแล้วละ"
70013020-218 = ""
70013020-220 = ""
70013020-221 = "โอ้โฮ สมกับเป็นคาโยโกะจังเลยนะ รู้อะไรมาเหรอ? รีบบอกมาเร็วๆ สิ!"
70013020-222 = "พวกที่รังแกเด็กคนนั้นไม่ใช่นักเลงธรรมดาๆ หรอกนะ"
70013020-223 = "ฉันลองตรวจสอบดูก็พบว่าเกี่ยวข้องกับองค์กรมาเฟียกลุ่มหนึ่งน่ะ"
70013020-224 = "พวกนักเลง... กับมาเฟีย?"
70013020-225 = "อื้อ พวกมาเฟียใช้นักเลงพวกนั้นมารีดไถเงินจากนักเรียนอยู่"
70013020-226 = "พวกนักเลงที่เราเจอเป็นแค่ลูกกระจ๊อกปลายแถวน่ะ"
70013020-227 = "ต่อให้จัดการเจ้าพวกนั้นได้แต่ถ้าไม่จัดการพวกมาเฟียที่อยู่เบื้องหลัง ก็อาจจะเกิดเรื่องแบบเดิมขึ้นอีก"
70013020-228 = "อืม เรื่องใหญ่กว่าที่คิดอีกนะ"
70013020-229 = "แล้วองค์กรมาเฟียนั่นชื่ออะไรล่ะ?"
70013020-230 = "ได้ยินมาว่าชื่อนี้น่ะ"
70013020-232 = "ริกาโตนี แฟมิลี่"
