[translation]
70013020-1 = "วัชพืชมิอาจเติบโตเพียงลำพัง 2"
70013020-2 = "[i][log]ย้อนกลับไปในสมัยที่ฮารุกะยังอยู่คนเดียว...[/log][/i]"
70013020-5 = "ฮุฮุ งานครั้งนี้ก็ผ่านไปได้อย่างสวยงาม"
70013020-6 = "แต่ว่านะ อารุจัง"
70013020-7 = "งานตามหาแมวเนี่ย มันห่างไกลจากคำว่าวายร้ายมากเลยไม่ใช่รึไง?"
70013020-8 = "ระ... เรื่องนั้น... "
70013020-9 = "มะ... ไม่ใช่สักหน่อย! มันเกี่ยวข้องกันสุดๆ เลยต่างหาก!"
70013020-10 = "เราส่งแมวที่ออกจากบ้านเพื่อไปตามหาอิสรภาพกลับคืนไปให้เจ้าของเชียวนะ"
70013020-11 = "การพรากอิสระของแมวไปแบบนี้ มันร้ายกาจสุดๆ เลยไม่ใช่รึไง?"
70013020-12 = ""
70013020-14 = ""
70013020-15 = ""
70013020-16 = "ฮุฮุฮุ งั้นเหรอ?"
70013020-17 = "เฮ้อ... ถ้าพูดแบบนั้นก็คงจะใช่ละมั้ง"
70013020-18 = "ว่าแต่ว่าคาโยโกะจัง ทำไมแมวตัวนั้นถึงปีนขึ้นไปบนต้นไม้สูงๆ ทั้งที่ปีนลงมาเองไม่ได้กันนะ?"
70013020-19 = "แถมก็น่าจะรู้ว่ามันอันตรายแท้ๆ"
70013020-20 = "ทำไมถึงมาถามฉันเรื่องนั้นล่ะ...?"
70013020-21 = "ก็คิดว่าคาโยโกะจังน่าจะรู้น่ะ?"
70013020-22 = "......"
70013020-23 = "อืม ก็อาจจะถูกสุนัขหรือแมวตัวอื่นวิ่งไล่มา จนเผลอปีนขึ้นไปสูงโดยไม่รู้ตัวก็ได้"
70013020-24 = "คงคิดแค่ว่าจะต้องหนีก่อน เลยประเมินสถานการณ์ได้ไม่ดีเท่าไร"
70013020-25 = "ที่น่าแปลกคือเรื่องแบบนี้เกิดขึ้นได้บ่อยๆ ในชีวิตประจำวันของเรา"
70013020-26 = "ทั้งที่รู้ว่าเป็นสิ่งที่ผิด... แต่ก็ทำได้แค่วิ่งหนีไปทางนั้น..."
70013020-27 = "พอได้สติอีกที ก็ถลำลึกเกินไปจนย้อนกลับไม่ได้แล้ว"
70013020-28 = "ฉันเคยเจอคนแบบนั้นมาเยอะทีเดียว"
70013020-29 = "โอ้ว คาโยโกะจัง... นึกไม่ถึงเลยนะว่าจะได้ฟังเรื่องจริงจังแบบนี้น่ะ"
70013020-30 = "นั่นสินะ ฉันก็คิดไม่ถึงเหมือนกัน"
70013020-32 = "ฮุฮุฮุ เอาเป็นว่าตอนนี้หาเงินมาได้แล้ว พวกเราไปกินราเม็งกันเถอะ"
70013020-33 = "วันนี้สั่งไซซ์พิเศษเลยก็ได้นะ!"
70013020-34 = "ว้าว! อารุจังเลี้ยงงั้นเหรอ? งั้นฉันขอเพิ่มหมูชาชูด้วยได้มั้ย?"
70013020-35 = "ดะ... ได้อยู่แล้ว หน่วยรับจ้างสารพัดที่ฉันจะก่อตั้ง เป็นบริษัทที่ดูแลสวัสดิการพนักงานอย่างดีนี่นา"
70013020-36 = "แต่นั่น... มันก็ยังห่างไกลกับคำว่าวายร้ายอยู่ดีไม่ใช่รึไง?"
70013020-37 = "ช่างเถอะน่า ฉันบอกว่าจะเลี้ยงก็กินๆ เข้าไปเถอะ!"
70013020-38 = ""
70013020-40 = ""
70013020-41 = ""
70013020-42 = ""
