[translation]
70013020-1 = "雜草不會獨自綻放（２）"
70013020-2 = "[i][log]那是遙香還是獨自一人的時候……[/log][/i]"
70013020-5 = "哼哼，這次的工作也非常成功呢。"
70013020-6 = "不過，亞瑠醬……"
70013020-7 = "找貓咪這種事，跟硬派的壞蛋差得有點遠吧？"
70013020-8 = "這，這個嘛……"
70013020-9 = "才，才沒有那回事！這之間可是有著非常密切的關係！"
70013020-10 = "我們把為了尋求自由而離家出走的貓咪，又送回了主人身邊耶？"
70013020-11 = "剝奪貓咪的自由，這不是很像壞蛋嗎？"
70013020-12 = ""
70013020-14 = ""
70013020-15 = ""
70013020-16 = "咯呵呵，是這樣嗎～？"
70013020-17 = "唉……你都這麼說了，那就當作是那樣吧。"
70013020-18 = "話說回來，佳世子醬。#n那隻貓為什麼要爬到自己下不來的樹上去呢？"
70013020-19 = "牠應該很清楚那樣很危險才對。"
70013020-20 = "……那種事你為什麼要問我？"
70013020-21 = "總覺得，如果是佳世子醬的話好像會知道？"
70013020-22 = "……"
70013020-23 = "大概是被狗或其他貓追著跑，不知不覺就爬上去了吧？"
70013020-24 = "可能是因為拚命想逃跑，所以沒辦法好好判斷狀況吧。"
70013020-25 = "這種情況在我們的日常裡，其實也意外地經常發生。"
70013020-26 = "明知道是錯誤的路，卻因為只顧著逃跑……"
70013020-27 = "等回過神來，已經踏上了無法回頭的路。"
70013020-28 = "那種人，我見過不少。"
70013020-29 = "哦～佳世子醬。#n沒想到你會這麼認真的回答耶？"
70013020-30 = "……是啊，連我自己也沒想到。"
70013020-32 = "哼哼哼。#n總之錢也賺到了，我們去吃拉麵吧。"
70013020-33 = "今天就算點大碗的也沒關係哦！"
70013020-34 = "哇哦～！亞瑠醬要請客嗎？那我可以加叉燒嗎？"
70013020-35 = "當，當然可以。#n我想打造的便利屋，是連員工福利都會確實照顧到的公司啊。"
70013020-36 = "……那也跟硬派的壞蛋差得有點遠吧？"
70013020-37 = "我說要請客的時候，你們只要老老實實地吃就對了！"
70013020-38 = ""
70013020-40 = ""
70013020-41 = ""
70013020-42 = ""
70013020-44 = ""
70013020-45 = ""
70013020-46 = ""
70013020-47 = ""
70013020-48 = "咦？是「雜草醬」耶。"
70013020-49 = "雜草醬？"
70013020-50 = "嗯。因為他總是在路邊照顧雜草，所以就叫他雜草醬。"
70013020-51 = "原本的名字呢？"
70013020-52 = "不知道耶？就算問了，他也不肯說。"
70013020-53 = "感覺……是個奇特的孩子呢。"
70013020-55 = ""
70013020-56 = ""
70013020-57 = ""
70013020-59 = "……耶嘿，耶嘿嘿。"
70013020-60 = "比昨天又長大了一點呢。#n葉子也充滿了活力……"
70013020-61 = "我今天是來澆水的哦。#n想說你應該差不多渴了吧……"
70013020-62 = ""
70013020-64 = ""
70013020-65 = "耶嘿……耶嘿嘿嘿……"
70013020-66 = ""
70013020-71 = ""
70013020-73 = "整天都不見人影，原來躲在這種地方啊？"
70013020-75 = "不，不是的！我沒有躲……！"
70013020-76 = "還說沒有！那為什麼要待在這種陰暗的巷子裡？"
70013020-77 = "那，那是因為這孩子……"
70013020-78 = "嗯？你剛剛難道是把這株雜草叫做「這孩子」？"
70013020-80 = "真是笑死人了，不就是株雜草而已嗎！"
70013020-81 = "有空做這種沒用的事，不如先把拖欠的保護費拿來啊！"
70013020-82 = "你們兩個！先把那株雜草給我踩爛！"
70013020-83 = "啊，啊啊……！"
70013020-84 = "對，對不起！求求你們……！！"
70013020-85 = ""
70013020-88 = ""
70013020-89 = ""
70013020-90 = ""
70013020-91 = ""
70013020-95 = "不，不行！請住手！要，要踩就踩我吧……！！#n求求你們……！求求你們……！！"
70013020-96 = "既然你這麼想要，那就如你所願！"
70013020-97 = "呀哈哈哈哈哈……！！"
70013020-98 = ""
70013020-102 = ""
70013020-103 = "哈哈，現在搞清楚了吧？你是絕對無法反抗我們的。"
70013020-104 = "聽懂的話就快點把保護費拿來！"
70013020-105 = "要是不照做，下次就換你那張討人厭的──！！"
70013020-106 = ""
70013020-110 = ""
70013020-111 = ""
70013020-112 = ""
70013020-113 = "什，什麼！？到底是哪來的傢伙……！？"
70013020-115 = ""
70013020-117 = "……"
70013020-119 = "你……！你知道你剛剛開槍打的是誰嗎！？"
70013020-121 = "不知道。"
70013020-122 = "反正也不會是什麼了不起的傢伙吧。"
70013020-123 = "畢竟會在這種地方欺負弱小就足以說明一切了。"
70013020-125 = "你，你這傢伙……！！"
70013020-126 = ""
70013020-128 = ""
70013020-129 = ""
70013020-130 = "哼嗯～？你現在是在挑釁我們嗎？人數可是我們這邊佔優勢哦？"
70013020-131 = ""
70013020-133 = ""
70013020-134 = ""
70013020-135 = "……"
70013020-137 = "（那，那個眼神……不，不太妙……！）"
70013020-138 = "我，我們走！"
70013020-139 = "你，你們給我等著瞧……！！"
70013020-140 = ""
70013020-142 = ""
70013020-143 = ""
70013020-144 = ""
70013020-145 = ""
70013020-146 = "你還好嗎？"
70013020-147 = "……"
70013020-148 = ""
70013020-150 = ""
70013020-152 = ""
70013020-153 = "那些傢伙，把這孩子照顧的草……踩得一蹋糊塗……"
70013020-155 = "……"
70013020-156 = "好，好了！打起精神！我們已經幫你趕走那些傢伙了。"
70013020-157 = "不好……一點也不好。"
70013020-158 = "他們一定……還會再來的……"
70013020-159 = "對不起……真的很對不起……"
70013020-160 = ""
70013020-162 = ""
70013020-163 = "我沒能……保護好你……"
70013020-165 = "……"
70013020-166 = "看來那些傢伙一直在纏著你、欺負你吧？"
70013020-167 = "我們來幫你解決。你叫什麼名字？"
70013020-168 = ""
70013020-170 = ""
70013020-171 = "……對不起，我不能說。"
70013020-172 = "請不要試圖去了解任何事情。"
70013020-173 = "要是跟我這種惹人厭的人扯上關係……你們一定也會遭遇不幸的。"
70013020-175 = "為什麼要說那種話……"
70013020-176 = "……總之先回去吧。"
70013020-177 = "那孩子，現在不是能用言語勸說的狀態。"
70013020-178 = "要是不斷逼迫身處危險邊緣的貓……牠很有可能會不顧一切往下跳的。"
70013020-179 = "……"
70013020-180 = "我知道了，現在就先這樣吧。"
70013020-182 = "……"
70013020-183 = "那之後再見囉，雜草醬！"
70013020-184 = "雜草醬……？"
70013020-185 = "啊……！對，對不起！我不小心就……"
70013020-186 = "你照顧的草都變成那樣了……真的很抱歉！我不是故意的！"
70013020-187 = "……"
70013020-188 = "……不，沒關係。"
70013020-189 = "因為我就像雜草一樣……耶嘿嘿……"
70013020-190 = "那才是最適合我的綽號……"
70013020-191 = "耶嘿嘿嘿……"
70013020-192 = ""
70013020-194 = ""
70013020-195 = "嗚嗚……我好像搞砸了。"
70013020-197 = "……果然還是沒辦法就這樣放著不管。"
70013020-198 = "你打算做白工嗎？"
70013020-199 = "什，什麼做白工！！"
70013020-200 = "我只是不想看到我們的地盤上有其他不良份子撒野而已。#n就只是這樣，沒有別的目的。"
70013020-201 = "好好好，就當作是那樣吧。"
70013020-202 = "可是亞瑠醬，我們連那孩子的名字都不知道，你打算怎麼幫助他？"
70013020-203 = ""
70013020-205 = ""
70013020-206 = "這，這個……"
70013020-207 = "……我有頭緒，跟我來。"
70013020-209 = ""
70013020-210 = ""
70013020-211 = ""
70013020-212 = ""
70013020-214 = "（佳世子的情報蒐集持續了好一陣子）"
70013020-215 = "（一段時間後……）"
70013020-216 = ""
70013020-217 = "你們兩個過來這邊，我查到了一些情報。"
70013020-218 = ""
70013020-220 = ""
70013020-221 = "哦～不愧是佳世子醬。#n你查到了什麼？快告訴我們！"
70013020-222 = "欺負那孩子的傢伙們，果然不是普通的不良份子。"
70013020-223 = "調查之後發現，他們跟某個黑手黨有關聯。"
70013020-224 = "不良份子……跟黑手黨？"
70013020-225 = "嗯。黑手黨利用不良份子，從學生們身上榨取金錢。"
70013020-226 = "我們遇到的那些不良份子，只是最底層的小嘍囉。"
70013020-227 = "就算解決那些傢伙，只要不想辦法解決黑手黨，同樣的事還是會再次發生。"
70013020-228 = "哼嗯～比想像中還要嚴重呢？"
70013020-229 = "所以那個黑手黨的名字是……？"
70013020-230 = "黑手黨的名字是──"
70013020-232 = "利加托尼家族。"
