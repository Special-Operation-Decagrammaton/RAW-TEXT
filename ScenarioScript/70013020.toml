[translation]
70013020-1 = "잡초는 홀로 피지 않는다 2"
70013020-2 = "[i][log]때는 하루카가 아직 혼자였던 시절…….[/log][/i]"
70013020-5 = "후후, 이번 일도 매우 성공적이었어."
70013020-6 = "하지만 아루 쨩."
70013020-7 = "고양이 찾아주기는 하드보일드한 악당과는 거리가 먼 거 아니야?"
70013020-8 = "그, 그건……."
70013020-9 = "아, 아니야! 아주아주 밀접한 관계가 있어!"
70013020-10 = "자유를 찾아 집을 나간 고양이를 다시 주인에게 보내버린 거라고?"
70013020-11 = "고양이의 자유를 빼앗다니, 이 얼마나 악당 같아?"
70013020-16 = "쿠후후, 그런가~?"
70013020-17 = "하아……. 뭐, 그렇다면 그런 거겠지."
70013020-18 = "그런데 카요코 쨩. 그 고양이, 왜 혼자 내려오지도 못하는 높은 나무에 올라갔던 걸까?"
70013020-19 = "위험하다는 것 정도는 잘 알고 있을 텐데."
70013020-20 = "……그걸 왜 나한테 묻는 건데?"
70013020-21 = "왠지 카요코 쨩이라면 알 것 같아서?"
70013020-22 = "……."
70013020-23 = "뭐, 개나 다른 고양이들에게 쫓기다 자기도 모르게 올라갔던 게 아닐까?"
70013020-24 = "일단 달아나야 한다는 생각에 제대로 상황 판단이 안 됐던 거겠지."
70013020-25 = "의외로 이런 경우는 우리 일상에서도 흔하게 일어나."
70013020-26 = "잘못된 길이라는 걸 알면서도, 그저 도망만 치다가……."
70013020-27 = "정신을 차려보니 이미 돌이킬 수 없는 길에 들어선 거지."
70013020-28 = "그런 사람들, 꽤나 많이 봤어."
70013020-29 = "오오, 카요코 쨩. 여기서 그런 진지한 이야기가 나올 줄은 몰랐는데?"
70013020-30 = "……그러게. 나도 몰랐어."
70013020-32 = "후후후. 아무튼 돈도 벌었으니, 라멘이나 먹으러 가자."
70013020-33 = "오늘은 곱빼기로 시켜도 좋아!"
70013020-34 = "와우! 아루 쨩이 사는 거야? 그럼 나 차슈도 추가해도 돼?"
70013020-35 = "무, 물론이지. 내가 만들려는 흥신소는 사원들 복지도 확실히 챙기는 회사니까."
70013020-36 = "……그건 하드보일드 악당과는 거리가 먼 거 아니야?"
70013020-37 = "됐으니까 사준다고 할 때 잠자코 먹기나 해!"
70013020-48 = "어라? <잡초 쨩>이다."
70013020-49 = "잡초 쨩?"
70013020-50 = "응. 항상 길거리에서 잡초를 돌보고 있더라고. 그래서 잡초 쨩이야."
70013020-51 = "이름은?"
70013020-52 = "모르는데? 말 걸어도 이야기 안 해주더라고."
70013020-53 = "뭔가…… 특이한 아이네."
70013020-59 = "……헤, 헤헤."
70013020-60 = "어제보다 조금 더 컸네요. 이파리도 힘이 넘치고……."
70013020-61 = "오늘은 물을 주러 왔어요. 슬슬 목이 마를 테니까……."
70013020-65 = "헤헤…… 헤헤헤……."
70013020-73 = "하루 종일 안 보이더니, 이런 곳에 숨어 있었네?"
70013020-75 = "아, 아니에요! 숨은 거 아니에요……!"
70013020-76 = "아니긴 뭐가 아니야! 그럼 왜 이런 어두운 골목에 있어?"
70013020-77 = "그, 그건 이 아이 때문에……."
70013020-78 = "응? 설마 지금 이 잡초를 <아이>라고 부른 거야?"
70013020-80 = "웃기고 있어. 이딴 잡초가 뭐라고!"
70013020-81 = "쓸데없는 짓 할 시간에 밀린 상납금이나 더 가져오란 말이야!"
70013020-82 = "얘들아! 저 잡초부터 밟아!"
70013020-83 = "아, 아아……!"
70013020-84 = "죄, 죄송해요! 그러니까 제발……!!"
70013020-95 = "아, 안 돼요! 그만해 주세요! 차, 차라리 저를……!! 제발……! 제발……!!"
70013020-96 = " 소원이라면 그렇게 해주지!"
70013020-97 = "캬하하하하핫……!!"
70013020-103 = "후후, 이제 잘 알겠지? 넌 절대 우릴 거스를 수 없어."
70013020-104 = "알아들었으면 당장 상납금부터 가져와!"
70013020-105 = "안 그랬다간 다음엔 그 재수 없는 얼굴을……!!"
70013020-113 = "뭐, 뭐야! 대체 어떤 녀석이……!"
70013020-117 = "……."
70013020-119 = "너……! 지금 누굴 쏜 건지 알고 있어?!"
70013020-121 = "몰라."
70013020-122 = "뭐, 대단한 녀석은 아니겠지."
70013020-123 = "이런 곳에서 약한 녀석이나 괴롭히고 있는 걸 보면 말이야."
70013020-125 = "이, 이 자식……!!"
70013020-130 = "흐응? 지금 우리한테 싸움 거는 거야? 머릿수도 이쪽이 더 많은데?"
70013020-135 = "……."
70013020-137 = "(저, 저 눈빛은…… 위, 위험해……!)"
70013020-138 = "가, 가자!"
70013020-139 = "두, 두고 보라고……!!"
70013020-146 = "얘. 괜찮아?"
70013020-147 = "……."
70013020-153 = "저 녀석들, 이 아이가 돌보던 풀을…… 다 짓뭉개 놨어……."
70013020-155 = "……."
70013020-156 = "기, 기운 내! 일단 그 녀석들은 우리가 쫓아내 줬으니까."
70013020-157 = "괜찮지…… 않아요."
70013020-158 = "분명…… 또 올 테니까……."
70013020-159 = "……죄송해요. 정말로, 죄송해요……."
70013020-163 = "지켜주지…… 못했어요……."
70013020-165 = "……."
70013020-166 = "보아하니 그 아이들, 널 따라다니면서 괴롭히는 거지?"
70013020-167 = "우리가 해결해 줄게. 너, 이름이 뭐니?"
70013020-171 = "……죄송합니다. 말할 수 없어요."
70013020-172 = "아무것도 알려고 하지 마세요."
70013020-173 = "저처럼 기분 나쁜 녀석이랑 엮였다간…… 분명 여러분도 무사하지 못할 테니까."
70013020-175 = "왜 그런 말을……."
70013020-176 = "……일단은 물러나자."
70013020-177 = "저 아이, 우리가 말로 어떻게 할 수 있는 상태가 아니야."
70013020-178 = "위험한 곳에 올라간 고양이를 계속 몰아세우면…… 아래로 뛰어내릴 거야."
70013020-179 = "……."
70013020-180 = "알겠어. 지금은 일단 물러날게."
70013020-182 = "……."
70013020-183 = "그럼 나중에 또 보자, 잡초 쨩!"
70013020-184 = "잡초…… 쨩?"
70013020-185 = "아……! 미, 미안! 나도 모르게……."
70013020-186 = "돌보던 풀이 그렇게 됐는데…… 정말로 미안! 내가 부주의했어!"
70013020-187 = "……."
70013020-188 = "……아니에요. 괜찮아요."
70013020-189 = "저는 잡초 같은 거니까……. 헤헤……."
70013020-190 = "그게 저에게 가장 잘 어울리는 별명이니까……."
70013020-191 = "헤헤헤……."
70013020-195 = "으으, 내가 뭔가 실수한 것 같은데."
70013020-197 = "……역시 그냥 내버려둘 수는 없겠어."
70013020-198 = "공짜로 일하려고?"
70013020-199 = "고, 공짜라니!"
70013020-200 = "나는 우리 구역에서 다른 불량배가 날뛰는 걸 보기 싫을 뿐이야. 그게 이유. 다른 목적은 없어."
70013020-201 = "그래. 그런 걸로 해두자."
70013020-202 = "그런데 아루 쨩. 이름도 모르는 아이를 어떻게 구해주려고?"
70013020-206 = "그, 그건……."
70013020-207 = "……짐작 가는 게 있어. 따라와."
70013020-214 = "한참 동안 카요코의 정보 수집이 이어졌다."
70013020-215 = "잠시 후……."
70013020-217 = "다들, 이쪽으로 와. 알아낸 게 있어."
70013020-221 = "오오, 역시 카요코 쨩. 뭔데? 어서 알려줘!"
70013020-222 = "그 아이를 괴롭히던 녀석들, 역시나 평범한 불량배가 아니었어."
70013020-223 = "확인해 보니 어떤 마피아 조직과 연결되어 있더라."
70013020-224 = "불량배가…… 마피아와?"
70013020-225 = "응. 마피아가 불량배를 이용해 학생들에게서 돈을 뜯고 있었던 거지."
70013020-226 = "우리가 만났던 그 불량배들은 말단 중의 말단이야."
70013020-227 = "그 녀석들을 쓰러뜨려도, 모체인 마피아를 손보지 않는 한 같은 일이 또 일어나겠지."
70013020-228 = "흐음, 생각보다 심각한 일이었네?"
70013020-229 = "그래서, 그 마피아 조직의 이름은?"
70013020-230 = "이런 이름이었어."
70013020-232 = "리가토니 패밀리."
