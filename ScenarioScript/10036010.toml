[translation]
10036010-1 = "제1화;바다, 사오리, 그리고……."
10036010-6 = "오케이! 스톱! 커다란 짐부터 내리자고!"
10036010-7 = "시간도 별로 없고, 할 일은 산더미니까 빨리빨리 하자!"
10036010-8 = "네, 선배님!"
10036010-9 = "우리 둘만으로는 일손이 부족할 텐데…… 어이, 거기 알바생!"
10036010-14 = "……음? 나 말인가?"
10036010-15 = "표정이 안 좋은데 어디 아파? 혹시 아침인데 벌써 일사병?"
10036010-16 = "아, 아니다. 단지……."
10036010-17 = "이렇게 대낮에 당당하게 행동하는 게, 조금 마음에 걸렸을 뿐이다."
10036010-18 = "이곳에 다른 학원의 치안 병력이 들이닥칠 우려는 없는 건가?"
10036010-19 = "뭐야, 여기 처음 와 보는 거야?"
10036010-20 = "여긴 <무법자 해변>이잖아. 우리 같은 녀석들을 위한 자유의 땅!"
10036010-21 = "자유의…… 땅?"
10036010-25 = "이 해변은 세 개나 되는 학원 자치구가 절묘하게 중첩된 곳이라서, 소동이 벌어져도 어디 한 군데가 출동하기에 되게 애매한 곳이거든~"
10036010-26 = "맞아. 출동했다간 단번에 무력시위가 되어버릴 테니까. 즉 말하자면 회색지대라는 거지."
10036010-27 = "뭐, 발키리 같은 녀석들이라면 출동할 수도 있겠지만. 그 녀석들 원래 좀 느리잖아?"
10036010-28 = "발키리 참새가 떴을 땐 이미 축제도 다 끝나고 난 다음일걸? 히히."
10036010-30 = "그렇군. 그래서 헬멧단 같은 문제아 집단도 마음 놓고 활동할 수 있는 건가……."
10036010-32 = "뭐얏?! 문제아 집단?!"
10036010-34 = "음, 아니었나……? 그렇다면 사과하지."
10036010-36 = "그걸 사과받으면 우리가 뭐가 되는데!"
10036010-37 = "으음! 당연히 가슴 펴고 당당히 자랑할 수 있는 문제아 집단인 건 맞지만!"
10036010-39 = "어쨌든 이 짐들을 옮기면 되는 건가? 나도 돕도록 하지."
10036010-44 = "우왓, 커다란 철봉 세 개를 한꺼번에……!"
10036010-45 = "이거 생각지도 못한 고급 인력인걸."
10036010-47 = "어디에 놓으면 되지?"
10036010-49 = "아, 해변에 2미터 간격으로 배치하면 돼!"
10036010-54 = "좋아, 모두 옮겼다."
10036010-55 = "그다음은……."
10036010-58 = "거기 알바생! 혹시 여기 좀 도와줄 수 있어?"
10036010-59 = "천막 조립하는 데 힘이 들어서 말야!"
10036010-60 = "지금 가겠다."
10036010-62 = "읏차!"
10036010-63 = "그쪽을 조금 더 들어라……흐읍!"
10036010-67 = "휴, 됐다. 고마워, 알바생! 덕분에 핫도그 장사를 시작할 수 있겠어!"
10036010-68 = "인사는 됐다. 계약서에는 경호 업무 이외에도 헬멧단 업무에 협조적으로 응하라는 내용이 있었지."
10036010-69 = "계약서의 계약은 지켜야 하니, 당연한 일이다."
10036010-70 = "그래? 성실하다고 할지, 별난 녀석이네. 너."
10036010-71 = "별나다……?"
10036010-72 = "이봐! 여기도 좀 도와줘!"
10036010-73 = "비치발리볼 경기장을 만들어야 하는데 일손이 필요해!"
10036010-74 = "음, 알겠다."
10036010-79 = "……휴우. 근처의 작업은 완료인가."
10036010-80 = "그럼 이제 경호 대상이 도착하기를 기다리는 게 순서겠군."
10036010-84 = "아……."
10036010-89 = "(그러고 보니 언젠가 그런 말을 들은 적이 있었다.)"
10036010-90 = "(땅이 끝나는 곳에는 바다가, 끝을 알 수 없을 만큼 깊고 넓은 바다가 펼쳐져 있다고.)"
10036010-91 = "(머리로는 알고 있었지만, 직접 본 것은 이번이 처음인가…….)"
10036010-92 = "……."
10036010-100 = "……."
10036010-101 = "평화롭군……."
10036010-102 = "아츠코, 미사키, 히요리, 아즈사……."
10036010-103 = "이런 풍경은 다른 모두와 함께……."
10036010-105 = "[log](그 시각 무법자 해변 어딘가…….)[/log]"
10036010-111 = "이것 봐, 선생님! 진짜 게야. 귀엽다, 그치?"
10036010-112 = "[s] \"응, 귀엽네.\""
10036010-116 = "아츠코, 그러다 아이스크림 흘리겠어. 조심해."
10036010-119 = "잠깐 햇볕에 뒀을 뿐인데, 제 건 이미 다 녹아 버렸어요! 으아아앙!"
