[translation]
901010600410-6 = ""
901010600410-7 = "งืม... งืม..."
901010600410-8 = "FOX 4?"
901010600410-9 = "ใส่วิปครีมเยอะๆ บนสตรอว์เบอร์รีชอร์ตเค้ก..."
901010600410-10 = "(กระซิบ) โอโทกิ..."
901010600410-11 = "ฮุฮุ... เค้กมีตั้งเยอะแยะ..."
901010600410-12 = ""
901010600410-14 = ""
901010600410-15 = "นี่แหนะ"
901010600410-16 = ""
901010600410-21 = ""
901010600410-22 = "อึก... อึก... อะ... เอาปลาอาจิใส่ชอร์ตเค้กไม่ได้นะ!"
901010600410-23 = ""
901010600410-26 = ""
901010600410-27 = "ฝันประหลาดอะไรเนี่ย...? ได้กินชอร์ตเค้กปลาอาจิในฝันเนี่ยนะ..."
901010600410-28 = ""
901010600410-31 = ""
901010600410-32 = "ฉันกลับมาแล้ว FOX 4"
901010600410-33 = "อื้อ นิโกะ... ไม่สิ FOX 2 เองเหรอ?"
901010600410-34 = "ขอโทษที พอดีเหนื่อยนิดหน่อยเลยงีบไปน่ะ"
901010600410-35 = "ปฏิบัติการวันนี้ เจอเรื่องเหนื่อยอะไรมาเหรอ?"
901010600410-36 = "เปล่าหรอก แค่เมื่อคืนหลังเข้าเวรเฝ้าระวังเสร็จ ฉันก็กลับไปนอนต่อ แต่นิสัยการนอนของ FOX 3 น่ะ แย่มาก..."
901010600410-37 = "ฉันเลยพลิกตัวไปมาจนนอนไม่เต็มอิ่มเลย ฮ้าวว..."
901010600410-38 = "ฮุฮุ คงเหนื่อยน่าดูเลยนะ"
901010600410-39 = "แต่รออีกนิดจนกว่าจะรายงานปฏิบัติการเสร็จก่อนนะ เดี๋ยวฉันจะทำปลาอาจิทอดอร่อย ๆ เป็นมื้อเย็นให้"
901010600410-40 = "โอ้ ปลาอาจิทอดก็ดีนะ กลิ่นคาวที่ได้กลิ่นเมื่อกี้มาจากปลาตรงนี้เองสินะ"
901010600410-41 = "งั้นก่อนจะไปเตรียมมื้อเย็น เรามาเริ่มสรุปรายงานแบบเร็วๆ กันเลยมั้ย?"
