901010600410-10 = "（小聲）御伽──"
901010600410-11 = "呵呵……蛋糕還有很多呢……"
901010600410-12 = ""
901010600410-14 = ""
901010600410-15 = "嘿咿。"
901010600410-16 = ""
901010600410-21 = ""
901010600410-22 = "唔，唔唔唔……鮮，鮮奶油蛋糕上不可以放竹筴魚……！"
901010600410-23 = ""
901010600410-26 = ""
901010600410-27 = "……這是什麼奇怪的夢啊？#n我竟然會夢到自己正在吃放了一堆竹筴魚的鮮奶油蛋糕……"
901010600410-28 = ""
901010600410-31 = ""
901010600410-32 = "我回來了，FOX4。"
901010600410-33 = "啊，是仁子──FOX2啊。"
901010600410-34 = "抱歉，我有點累就小睡了一下。"
901010600410-35 = "今天作戰期間發生了什麼棘手的事嗎？"
901010600410-36 = "沒有。只是昨天站哨結束想回去睡覺的時候，FOX3的睡相實在是太差了……"
901010600410-37 = "翻來覆去的害我整晚沒睡好。#n呼啊……"
901010600410-38 = "呵呵，那一定很累吧。"
901010600410-39 = "不過在作戰報告結束之前再稍微等一下吧，晚餐我會做美味的炸竹筴魚給你吃的。"
901010600410-40 = "哦，炸竹筴魚不錯耶。#n剛才聞到的魚腥味原來是從這裡來的啊。"
901010600410-41 = "那麼在準備晚餐之前，先快速地把報告整理一下吧。"
