[translation]
901010600410-7 = "음냐, 음냐……"
901010600410-8 = "FOX 4?"
901010600410-9 = "딸기 쇼트 케이크 위에, 휘핑 크림을 잔뜩 얹어서……"
901010600410-10 = "(소근) 오토기—"
901010600410-11 = "후후…… 케이크는 잔뜩 있으니까……"
901010600410-15 = "에잇."
901010600410-22 = "으으, 으으으…… 쇼, 쇼트 케이크에 전갱이는 안 돼!"
901010600410-27 = "……이게 무슨 괴상한 꿈이람? 전갱이가 잔뜩 들어간 쇼트 케이크를 먹는 꿈이라니……"
901010600410-32 = "나 왔어, FOX 4."
901010600410-33 = "아, 니코— FOX 2 였구나."
901010600410-34 = "미안, 조금 피곤해서 눈 좀 붙이고 있었어."
901010600410-35 = "오늘 작전 중에 무슨 힘든 일이라도 있었던 거야?"
901010600410-36 = "아니. 다만 어젯밤에 경계 근무를 마치고, 다시 잠들려 했는데 FOX 3의 잠버릇이 너무 심해서……"
901010600410-37 = "뒤척이다가 새벽 잠을 설쳐버렸거든. 하아암……"
901010600410-38 = "후후, 피곤하겠네."
901010600410-39 = "그래도 작전 보고가 끝날 때까지는 조금만 기다려 줘. 저녁으로 맛있는 전갱이 튀김을 해 줄 테니까."
901010600410-40 = "오우, 전갱이 튀김 좋지. 아까 맡았던 비린내가 여기서 나던 거였구나."
901010600410-41 = "그럼 저녁 준비에 앞서, 빠르게 보고 정리부터 시작할까?"
