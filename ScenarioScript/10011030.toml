[translation]
10011030-1 = "제3화;닌자라고 하면 공주님?"
10011030-2 = "(공연이 시작되기 약 30분 전…….)"
10011030-3 = "[ns] \"여기가 무대의 뒤편이구나.\""
10011030-8 = "기, 긴장되네요."
10011030-9 = "이즈나도 두근두근! 가슴이 떨리는 느낌이에요!"
10011030-11 = "우냐핫. 다들 뭘 그렇게 긴장하고 그래~ 공연을 돕는 거라고 해봤자, 뭐 어려운 일이 있으려고."
10011030-12 = "그건 그렇고…… 서, 선생님. 지, 직접 이런 자리를 마련해주셔서, 그, 가, 가, 감사합니다!"
10011030-13 = "네! 주군이 마련해주신…… 저희 인법연구부가 활약할 무대예요!"
10011030-14 = "[s1] \"내가 직접 동아리 인가를 내려줄 수 없으니, 음양부에게 부탁한 것뿐이야.\"\n[s2] \"아무래도 미치루는 정식 동아리 신청서를 내지 못하는 이유가 있는 거 같고.\""
10011030-17 = "윽……! 그건……"
10011030-18 = "……그, 그냥……"
10011030-19 = "어, 어쨌거나! 여기서 닌자로서! 멋진 활약을 보여주면 될 일이니까!"
10011030-20 = "응! 이 이야기는 이걸로 끝!"
10011030-21 = "네, 넷! 저, 여, 여, 열심히 할게요! 머, 멋진 닌자처럼!"
10011030-22 = "이즈나도 지지 않겠어요! 닌닌!"
10011030-23 = "[s] \"다들 닌자를 정말 좋아하는구나.\""
10011030-24 = "이제 와서 그런 말?! 인법연구부니까 당연한 거지만!"
10011030-25 = "네! 좋아해요! 최고의 닌자가 되고 싶어요!"
10011030-26 = "저, 전 아, 아직 닌자에 대해, 자, 잘은 모르지만요……."
10011030-27 = "츠쿠요도 차암- 닌자란 최고로 쿨하고 힙하니까. 좋아할 수밖에 없는 거라고~"
10011030-28 = "난 그런 닌자를 키보토스 전체에 알리고 싶어. 그러기 위해 동영상 채널도 운영하고 있는걸."
10011030-29 = "[s] \"제법 의욕적이네.\""
10011030-30 = "지금은 비록 구독자 수도 얼마 안 되는 작은 채널이지만. 꾸준히 닌자를 알리다 보면, 언젠가 분명히 많은 게 바뀔 테니까!"
10011030-31 = "절대로 포기하지 않아! 왜냐하면"
10011030-32 = "포, 포기하지 않는 것이-"
10011030-33 = "닌자의 철칙이니까요~! 닌닌!"
10011030-34 = "[s] \"그래서 오늘 돕는다는 <와라쿠 공주님>은 무슨 공연이야?\""
10011030-35 = "아, 와라쿠 공주님은 영화촌에서도 자랑하는 <체험형 이벤트>야."
10011030-39 = "줄거리는 이래. 치세 님은 어느 훌륭한 가문의 공주님으로,"
10011030-43 = "어느 날 가문의 위세를 탐낸 도당들에게 납치를 당하게 돼."
10011030-47 = "그리고 바로 그때 공연을 지켜보는 관객들."
10011030-55 = "즉 '우리들'이 주인공이 되어 공주님을 구해내기 위해 영화촌 곳곳에 마련된 장애물과 시련을 뛰어넘어, 공주님을 구해내는 거야."
10011030-57 = "줄거리 자체는 간단하지만, 학원 측에서 준비한 어트랙션을 클리어하는 재미, 연극 속에서 내가 직접 주인공이 되었다는 체감……."
10011030-58 = "그리고 구해내는 과정 자체가 관객들 사이에 경쟁이 되면서 스릴 넘치게 된다는 점 등등."
10011030-59 = "이런 여러 가지가 합쳐져서 영화촌에서 가장 인기 있는 이벤트가 된 거지."
10011030-60 = "저, 저는 중계방송으로 며, 몇 번 봤을 뿐이지만요오……."
10011030-61 = "그런 걸 직접 도울 수 있다니, 분명 재미있을 거예요!"
10011030-62 = "후후. 맞아. 이걸 도울 수 있게 된 시점에서 두근거리지 않는다면 거짓말……"
10011030-63 = "잠깐?! 생각해보니 <와라쿠 공주님>의 공주 역할은, 치, 치세 님이잖아?!"
10011030-64 = "이거 잘만 하면…… 치, 치세 님에게 사인을 받을 기회 아냐?!"
10011030-65 = "과, 과연! 부, 부장님! 으, 음양부의 관계자라는 역할을 이용해……. 평소 바라 마지않던 걸 손에 넣는 것이로군요!"
10011030-66 = "이것이…… 닌자……! 여, 역시 부장님이세요!"
10011030-67 = "……?"
10011030-68 = "저기…… 츠쿠요. 그거 칭찬 맞지……?"
10011030-69 = "아니, 치세 님의 사인을 받을 수 있다면 당연히 받을 거지만!"
10011030-75 = "진행 도우미 여러분, 준비 부탁드립니다."
10011030-76 = "곧바로 와라쿠 공주님의 공주 역할 배우분께서 도착하실 예정입니다."
10011030-80 = "[ns] \"아, 드디어 시작하려나 봐.\""
10011030-86 = "치, 치세 님……! 저, 예전부터 줄곧 그…… 치, 치세 님의 패, 패, 팬……!"
10011030-88 = "응~! 알았어! 이부키! 힘낼게~!"
10011030-90 = "………으잉?"
10011030-91 = "게, 게헨나의 학생분……?"
10011030-93 = "후후. 이번 학원 간의 교류회 이벤트에서 적극적으로 협조해주신 점, 감사드립니다. 마코토 의장님."
10011030-95 = "키키키킷!! 뭐, 감사할 것까지야!"
10011030-96 = "오히려 감사라면 내가 해야 할 지경이라고! 음양부!"
10011030-97 = "이번 교류회를 통해서 필시 증명이 될 테지. 게헨나 학원에서도 즐겁고, 흥미로우며, 재미있는 이벤트."
10011030-98 = "그래! 평생의 추억이 될 수 있는 이벤트를 개최할 수 있을 정도의 영향력과 추진력을 가진 건……"
10011030-99 = "다름 아닌 나! 마코토 님이라는 게 말이야! 키키키킷!!!"
10011030-100 = "냐하핫- 그럼 바로 그 영향력에 한 줌 더 득이 될 법한, 네에- 그러한 명안이 있사온데."
10011030-101 = "후후, 어디 한번 들어보시겠나요?"
10011030-102 = "오오?"
10011030-104 = "그렇게 되어서 주역이 바뀌었다?"
10011030-105 = "자기 입으로 엄청 중요한 공연이라고 했으면서, 그렇게 마음대로 바꿔도 되는 거야?"
10011030-106 = "어? 이부키, 공주님 하면 안 돼……?"
10011030-107 = "……이부키, 잘못한 거야?"
10011030-108 = "[s] \"아니, 딱히 이부키의 잘못이라는 게 아니라.\""
10011030-115 = "우, 우와아앗……?"
10011030-116 = "앗, 불이 갑자기……! 설마 적습인가요……?!"
10011030-117 = "[s] \"잠깐, 모두 진정해. 아마 별일 아닐……\""
10011030-119 = "우……."
10011030-120 = "우……?"
10011030-121 = "우으으…… 왜 갑자기 불을 끄는 거야? 이부키는 이런 거 싫어……."
10011030-122 = "이부키가 잘못해서 그래? 아무것도 안 보여……. 무서워……."
10011030-123 = "이로하 선배애…… 마코토 선배애…… 흐윽……."
10011030-125 = "(우와앗, 크, 큰일 났다……!)"
10011030-126 = "(여, 여기서 혹시 울려버리고, 고, 공연까지 망쳐버리면 모처럼 주어진 기회가……!)"
10011030-127 = "(이, 일단 어떻게든 달래야…….)"
10011030-129 = "괜찮아! 이건 단순한 트러블일 뿐이니까! 그치, 선생 공?!"
10011030-130 = "[s] \"아, 응. 그렇지.\""
10011030-131 = "훌쩍…… 응……? 투러불?"
10011030-132 = "맞아! 게다가 우리랑 선생 공이 있으니까! 전혀 불안해할 거 없다고!"
10011030-133 = "선생님……은 알아. 근데 언니들은……? 누구야?"
10011030-135 = "네! 이즈나와 츠쿠요 공! 그리고 부장! 저희는 셋이서 하나!"
10011030-141 = "모두가 최강의 닌자를 꿈꾸는 인법연구부예요!"
10011030-143 = "닌……? 자?"
10011030-144 = "아니, 그 닌자란 건 일종의 비유라고 할까. 그러니까-"
10011030-145 = "거짓말, 이야……?"
10011030-146 = "으엑~! 또 그렇게 되나……!"
10011030-147 = "아뇨! 거짓말이 아니에요!"
10011030-151 = "저희는 최강의 닌자를 꿈꾸는 인법연구부! 그리고 닌자는 엄청 강하니까요!"
10011030-152 = "그러니 무서워할 거 없어요. 게헨나의 학생……. 아니, 이부키 쨩."
10011030-153 = "어떤 일이 있더라도 반드시 저희 인법연구부가-"
10011030-154 = "닌자가 공주님인 이부키 쨩을 지켜줄 테니까요! 그렇죠. 부장님?"
10011030-155 = "[s] \"닌자가 원래 공주님을 지켜주는 존재였나……?\""
10011030-157 = "그런 말을 하면 이야기가 복잡해진다구. 선생 공?! 작품에 따라 다르니까!"
10011030-158 = "……흐윽, 훌쩍……."
10011030-159 = "아니! 지금은 이럴 때가 아니라- 마! 맞아! 지켜줄게!"
10011030-160 = "우으…… 하, 하지만……."
10011030-161 = "으음, 역시 말만으로는 부족한가. 그럼 이걸 어찌해야……."
10011030-165 = "아, 맞다!"
10011030-169 = "자! 여기! 그래도 불안하다면 이건 어때!"
10011030-170 = "[s] \"……또 새로운 닌자 굿즈가….\""
10011030-178 = "……와아!"
10011030-180 = "(됐다! 먹혔어!)"
10011030-183 = "이게 뭐야? 언니? 이부키 궁금해!"
10011030-184 = "어때?! 멋있지?"
10011030-185 = "후후…… 듣고 놀라지 마시라! 이건 <닌자 닌페로 씨>의 주인공! 닌페로 씨!"
10011030-186 = "이면세계에 존재하는 모든 가짜 닌자 악당들을 물리치는 최강의 닌자. 닌자 중의 닌자야!"
10011030-187 = "아하하! 이상해! 이상하게 생겼어! 이 날개는 뭐야? 당겨도 돼?"
10011030-188 = "우와앗! 조심해주라! 그거 한정판이니까……!"
10011030-196 = "흠흠! 하여간……. 자, 이번 공연 중에는 여기 닌페로 씨를 빌려줄게."
10011030-203 = "닌페로 씨와 우리 닌자들이, 공주님인 그대가 위기에 처한다면"
10011030-204 = "그 어떤 상황이라도 구해주러 나타나겠소이다! 그러니 걱정 말도록! 어린 공주여!"
10011030-205 = "……이부키랑, 약속하는 거야?"
10011030-206 = "물론이지! 닌자의 철칙 그 세 번째!"
10011030-207 = "<닌자란! 자고로 한번 약속한 것은 반드시 지키는 법!>"
10011030-208 = "[s] \"그렇대. 이부키는 좋겠네.\""
10011030-209 = "……응! 알았어! 고마워! 다들!"
10011030-210 = "별말씀을요!"
10011030-211 = "에, 에헤헷……."
10011030-216 = "앗, 불이……."
10011030-218 = "다행히 바로 해결됐나 봐요."
10011030-219 = "봐봐. 별일 아닐 줄 알았어."
10011030-224 = "잠시 트러블이 있던 점 죄송합니다! 그럼 바로 공주님 입장하겠습니다!"
10011030-228 = "앗! 이부키 공! 힘내세요!"
10011030-229 = "다, 다녀오세요……."
10011030-230 = "열심히 해!"
10011030-232 = "응! 닌자 언니들! 선생님! 이부키 다녀올게!"
10011030-236 = "이, 이부키 쨩. 다, 다행이에요."
10011030-237 = "그러게…… 크, 큰일 나는 줄 알았다아……."
10011030-238 = "이걸로 진짜 공연이 시작되는 거네요!"
10011030-239 = "응…… 이대로 별일 없이 무사히 공연이 끝나면 좋겠……."
10011030-248 = "어라? 우리 말고도 새로운 도우미들인가?"
10011030-253 = "[ns] \"아니, 잠깐. 너희들은……\""
10011030-258 = "우리 <제멋대로 망량즈>가 어떠한 원대한 목표를 가졌는지 잊지 말도록. 여기선 신속하게 진행한다. 방해꾼은 처리해."
10011030-260 = "\"\"오케이!!\"\""
10011030-263 = "네, 네엣? 처, 처, 처리라니. 부, 부장니이임~?!"
10011030-264 = "부, 부장……!? 주군?! 어, 어쩌죠?!"
10011030-265 = "우, 우와아아앗?! 뭐, 뭐야아앗?!"
