[translation]
1012603-1 = "소녀의 목소리"
1012603-2 = "(평소처럼 업무를 처리하던 어느 때…….)"
1012603-6 = "[ns] \"모르는 번호다…….\""
1012603-7 = "(……일단 받는다.)"
1012603-11 = "어라? 연결됐어……?"
1012603-12 = "아, 안녕하세요? [USERNAME] 선생님이신가요?"
1012603-13 = "[s] \"응. 안녕.\""
1012603-14 = "와아! 정말로 [USERNAME] 선생님이야! 헤헤헷……."
1012603-15 = "선생님. 죄송하지만 잠깐 통화 가능하실까요?"
1012603-16 = "[s] \"가능한데…… 넌 누구니?\""
1012603-17 = "아! 죄송해요! 부, 부끄러워서 말씀드릴 수가 없어요……!"
1012603-18 = "사실은 저…… 오래전부터 선생님을 지켜봐 왔거든요."
1012603-19 = "선생님은 저를 모르시겠지만, 저는 선생님을 잘 알고 있어요."
1012603-20 = "항상 상냥하게 학생들을 돌보는 모습에 저도 모르게 빠져들어서……."
1012603-21 = "그, 그래서 말인데요. 저랑 만나 주실 수 있을까요?"
1012603-22 = "선생님과 단둘이 만나는 거, 예전부터 소원이었어요!"
1012603-23 = "[s] (……곤란한 부탁이다.)"
1012603-24 = "으으으…… 여, 역시 무리일까요……?"
1012603-25 = "[s1] (……일단 만나서 잘 타일러 봐야겠다.)\n[s2] \"알았어. 샬레 근처의 공원에서 보자.\""
1012603-28 = "와아! 정말 감사해요! 그럼 기다리고 있을게요!"
1012603-34 = "(서둘러 업무를 마치고 약속한 공원으로 나갔다.)"
1012603-37 = "[ns] \"여기 어딘가에 그 아이가 있을 텐데…….\""
1012603-38 = "애옹~ 애오오옹~"
1012603-39 = "까악~ 까아아악~"
1012603-40 = "[ns] \"……이 공원에 이렇게 고양이랑 까마귀가 많았나?\""
1012603-41 = "난 밖에 나가면…… 이상하게 검은 고양이랑 까마귀가 주변에 모이더라고……"
1012603-45 = "녀석들의 울음이 들린다면, 내가 왔다는 신호야."
1012603-46 = "[s] \"카노에가 왜 여기에……?\""
1012603-47 = "선생……. 기다리고 있었어."
1012603-48 = "[ns3] (뭔가 이상한 느낌이 든다…….)\n[ns4] (만약을 위해 퇴로를 확보하자…….)"
1012603-51 = "이히히, 못 도망가."
1012603-52 = "잡아와. 얘들아."
1012603-53 = "애옹! 애오오옹!!"
1012603-54 = "까악! 까아아악!!"
1012603-67 = "(……결국 얼마 못 가 고양이와 까마귀에게 잡히고 말았다.)"
1012603-69 = "[ns] \"뭐, 뭐가 어떻게 된 거야? 난 학생을 만나러 왔을 뿐인데!\""
1012603-70 = "그 학생이 바로 나야……."
1012603-74 = "안녕하세요, 선생님! 이렇게 나와 주셔서 정말 감사해요!"
1012603-75 = "헤헤헷, 이렇게 저의 소원이 이루어졌네요!"
1012603-76 = "[s5] \"그, 그 아이가 카노에였다고……?\"\n[s6] \"와, 완전히 다른 목소리가 나오는데?!\""
1012603-79 = "눈치챘겠지만…… 난 연기자. 그중에서도 성우 전공이거든."
1012603-80 = "이번엔 귀여운 소녀를 연기해 봤지."
1012603-81 = "그걸 듣고 좋아라 나오다니……. 선생은 그쪽 취향이었구나."
1012603-82 = "[s] \"나, 난 적당히 타일러서 돌려보낼 생각이었어!\""
1012603-86 = "그렇구나. 전생부터 사랑하던 날 위해 다른 여자는 거절하려 했구나……."
1012603-87 = "히히, 역시 우리는 천생연분……. 그 마음 잘 알겠어."
1012603-88 = "[s] \"그런 전생 없다니까요!\""
1012603-89 = "아무튼 선생을 이대로 돌려보낼 순 없지……."
1012603-90 = "사실 내가 선생을 부른 건…… 다른 이유 때문이야."
1012603-94 = "오늘은 내가 담당한 ASMR 발매일이거든."
1012603-95 = "선생에게도…… 평가를 듣고 싶어."
1012603-96 = "[s] \"카노에가 녹음한 캐릭터의…… ASMR이라고?\""
1012603-97 = "응. 이 세계에서는 나름 유망주거든."
1012603-98 = "히히, 궁금하지? 들어볼래?"
1012603-104 = "자, 이 이어폰을 껴봐."
1012603-106 = "(이어폰을 낀 뒤, 조용히 눈을 감고 오디오를 들어보았다.)"
1012603-114 = "(……무뚝뚝한 컨셉의 소녀가 부끄러워하며 자장가를 불러주는 내용이 나왔다.)"
1012603-116 = "[ns] \"……이, 이것도 카노에의 목소리?\""
1012603-117 = "그, 그래. 내 목소리였다."
1012603-118 = "역시 나처럼 무뚝뚝한 아이가 불러주는 자장가는 취향이 아니었나……?"
1012603-119 = "[s] \"아. 아니야! 너무 잘 어울려!\""
1012603-123 = "히히, 그랬구나……. 고마워……."
1012603-124 = "보답으로 그 ASMR을 선물로 줄게."
1012603-125 = "[s] \"정말 카노에의 목소리라고는 상상도 못 했어.\""
1012603-126 = "원한다면 다른 목소리도 연기 할 수 있어."
1012603-127 = "괴물이나 귀신…… 심지어 환경음도 가능해."
1012603-128 = "선생은…… 어떤 목소리가 좋아?"
1012603-129 = "말만 해. 난 뭐든 가능하니까."
1012603-130 = "뭐. 든. 지. 말이야."
1012603-131 = "히히…… 이히히히……."
1012603-133 = "(……이후 카노에의 다양한 목소리를 들으며 강제로 휴식을 즐겼다.)"
1012603-134 = "(주변에 모여든 고양이와 까마귀들도 휴식을 즐기는 눈치였다…….)"
