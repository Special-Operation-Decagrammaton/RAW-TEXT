[translation]
1008805-1 = "어린애의 오기처럼 보이겠지만"
1008805-2 = "(흥신소에서 받았던 자료를 돌려주러 사무실에 들렀다.)"
1008805-10 = "……어라, 선생. 여긴 무슨 일이야?"
1008805-11 = "[s1] \"카요코? 그 옷은……?\"\n[s2] \"어라. 드레스?\""
1008805-14 = "아니. 내가 먼저 물었는데……."
1008805-15 = "……응?"
1008805-16 = "자료를 돌려주러 왔다고?"
1008805-17 = "아아. 전에 빌려줬던 그 건이구나. 이렇게 빨리 돌려줄 줄은 몰랐는데."
1008805-18 = "그건 저기 책상 위에 올려 둬. 이후로는 내가 알아서 정리할 테니."
1008805-22 = "……??"
1008805-23 = "아……. 이 옷……?"
1008805-27 = "한 번 그냥 넘어간 건데, 그걸 구태여 또 묻는 거야……?"
1008805-28 = "하아……. 알았어. 대답하지 않으면 오히려 분위기가 이상해질 것 같으니."
1008805-29 = "뭐……. 대단한 건 아니고. 일 때문에 입은 거야."
1008805-30 = "최근 흥신소에 이런 거 입을 일이 많이 늘었달까……."
1008805-31 = "뭐, 이왕 이런 옷도 구했으니, 할 수 있는 게 늘어난 건 좋은 일이지."
1008805-32 = "물론 대체로……."
1008805-33 = "……아니, 지금까진 전부 허탕이긴 하지만."
1008805-34 = "[s3] \"카요코도 고생이 많네.\"\n[s4] \"……힘내.\""
1008805-39 = "별로. 하기 싫다거나 고되다고 느끼는 건 아니라서 괜찮아."
1008805-40 = "……응?"
1008805-41 = "의외로 그다지 싫어하는 분위기가 아니라고?"
1008805-42 = "그야 뭐……."
1008805-43 = "어떤 옷을 입느냐는 사실 불만도 없고 나쁘게 생각하지도 않아."
1008805-44 = "나랑은 어울리지 않는 것 같다고 했지만, 그게 옷 자체가 싫다는 뜻은 또 아니고."
1008805-45 = "그리고 선생님이 전에……."
1008805-50 = "전에 선생님이 해줬던 '잘 어울린다'는 말……. 빈말은 아니었으면 좋겠네."
1008805-51 = "내심 그 말을 믿기로 해서……. 지금 이러고 있는 거기도 하니까 말이야."
1008805-56 = "[ns5] \"물론이지. 정말 멋진걸. \"\n[ns6] \"절.대.진.심-이지.\""
1008805-61 = "정말……. 예상한 대로의 대답."
1008805-62 = "…………."
1008805-63 = "……후후."
1008805-64 = "선생. 그러고 보니, 아침에 보냈던 모모톡. 혹시 기억하고 있어?"
1008805-65 = "나중에 시간 좀 내줄 수 있냐고 물어봤던 거."
1008805-66 = "괜찮다면 이왕 이렇게 된 거, 오늘 저녁이라도 괜찮아? 저녁 식사 정도로."
1008805-67 = "마침 옷도 이런 상태겠다……."
1008805-68 = "……이번에는 내가 살 테니까."
1008805-69 = "[s7] \"식사라면 내가 사야지.\"\n[s8] \"얻어먹는 건 익숙지 않은데.\""
1008805-72 = "아니."
1008805-73 = "안돼. 이번에는 내가 사야 해. 그래야만 그러는 의미가 있어."
1008805-74 = "굳이 그럴 필요 없다고?"
1008805-75 = "그렇게 말할 줄 알았지."
1008805-76 = "그럼 나도 여기서는 선생님이 했던 말을 돌려주도록 할까."
1008805-81 = "내가 마음 편하려면 어쩔 수 없어. 학생이란 그런 생물이야, 선생님."
1008805-85 = "[ns9] \"음. 과연…….\"\n[ns10] \"그렇게 나오시겠다…….\""
1008805-86 = "……후후."
1008805-87 = "……후후."
1008805-88 = "아무래도 외통수인 것 같네."
1008805-89 = "딱히 대단한 걸 기대하거나 바라는 건 아니니까. 정말로 그냥 한 끼 식사일 뿐."
1008805-90 = "진지하게 생각할 필요 없어. 그냥 내 오기라고 생각하고, 적당히 어울려줘."
1008805-91 = "……그래. 지금은 그거면 충분해."
1008805-95 = "더 이상 부정하거나 말 돌리지 않는 걸 보니……. 받아들여 준 걸로 봐도 되겠지?"
1008805-96 = "다행이네. 그렇게 순순히 받아주는 점이 선생의 단점이자 장점이니까."
1008805-97 = "……고마워, 선생."
1008805-98 = "그럼……."
1008805-104 = "……그때를 기대할게."
