[translation]
80000111-1 = "청춘을 위한 전력투구"
80000111-2 = "샬레 집무실"
80000111-3 = "선생님도 알고 있다시피 오늘은 발렌타인 데이야."
80000111-4 = "[s] \"아, 응. 그랬지.\""
80000111-5 = "발렌타인 데이라는 건 문자 그대로 청춘의 중심…… 그 자체로 The 청춘! 이라고 불러도 손색이 없는 기념일……."
80000111-6 = "그게 어느 정도냐 하면 <1년 365일 중에서 어느 날이 가장 청춘스러운 날이라고 생각해?>라는 질문을 받았을 때."
80000111-7 = "대충 <입학식>, <졸업식>, <크리스마스 이브>, <여름 불꽃놀이 축젯날>, <새해가 찾아온 신년 첫날>, <학원 축제를 앞두고 밤새는 날>과 함께 답의 하나로 거론되더라도 전혀 이상하지 않은──"
80000111-8 = "청춘의 대표적인 기념일 중 하나라 할 수 있는 게, 또 발렌타인 데이니까."
80000111-9 = "[s] \"대표라고 치기엔 생각보다 답의 종류가 엄청 많은 거 아냐……?\""
80000111-10 = "어…… 그거라면 딱히 이상할 것도 없지?"
80000111-11 = "마음먹기에 따라선, 우리 같은 <청춘 수행자>에겐 매일이 청춘이라 해도 과언이 아닌걸."
80000111-12 = "참고로 누가 나한테 저런 질문을 한다면, 나는 망설일 것도 없이 이렇게 답할 거야."
80000111-13 = "바로 <오늘>이야말로 가장 청춘스러운 날이라고!"
80000111-14 = "선생…… 아니, 스승님과 <청춘 활동>을 하는 내게 있어선 매일이 청춘이나 다름없으니까."
80000111-15 = "[s1] \"앞에서 이야기한 모든 전제를 상쾌하게 부정하는 듯한 답변!\"\n[s2] \"아니, 렌게의 그 말은 물론 엄청 기쁘긴 하지만!\""
80000111-18 = "어쨌든 간에…… 중요한 건 말이야."
80000111-19 = "청춘 이벤트에서 이렇게나 중요한 발렌타인 데이라는 날에, 그저 가만히, 얌전히, 멍~하니 앉아있기만 해서는 우리 <청춘 사제관계>의 이름이 울 거라는 사실이야."
80000111-20 = "그렇다면 오늘 해야만 하는 일은 하나밖에 없지 않겠어?"
80000111-21 = "[s] \"해야만 하는 일이라는 건…….\""
80000111-22 = "스승님과 함께 <청춘 활동>에 매진하는 <청춘 경력자>로서……."
80000111-23 = "나는 오늘을 선생님이 절대로 잊지 못할 최고의 발렌타인 데이로 만들고 싶어!"
80000111-24 = "그러니 결심했어."
80000111-25 = "내 목표에 어울리는 엄청나게 멋진 <발렌타인 초콜릿>을 만들어…… 스승님에게 선물하겠다고."
80000111-26 = "어때? 스승님! 나의 계획이!"
80000111-27 = "[s] \"렌게가 그렇게까지 말해주니까. 엄청 기쁜걸.\""
80000111-28 = "그치~? 아하핫."
80000111-29 = "지금까지 스승님이 내게 가르쳐준 수많은 청춘 이벤트를 경험치로 삼아서……."
80000111-30 = "나 후와 렌게의 전력투구, 보여줄 테니까. 기대해 줘!"
80000111-31 = "[s] \"응. 렌게가 그렇게까지 말해준다면야……\""
80000111-32 = "응! 그럼 아디오스! 스승님!"
80000111-36 = "[ns] \"기대할게……라고 말하기도 전에 이미 가버렸네.\""
80000111-38 = "(그렇게 호기로운 렌게의 외침이 있고 난 뒤, 샬레에서 얌전히 기다리는 입장이 되었지만.)"
80000111-42 = "(아무래도 현실은 그렇게 호락호락하지 않았다.)"
80000111-45 = "(렌게가 떠나간 뒤로 3시간 후…….)"
80000111-50 = "[ns] \"렌게. 전화 받았어. 혹시 초콜릿이 완성…….\""
80000111-54 = "아, 미안. 스승님! 아무래도 초콜릿을 만드는 데 시간이 좀 걸릴 거 같아서 미리 전화했어."
80000111-55 = "작업 과정은 순조로우니까. 조금만 더 기다려 줘!"
80000111-56 = "[s] \"아, 응. 알았어. 렌게도 너무 무리하진 말고.\""
80000111-57 = "그런 거라면 걱정 마. 슬슬 감을 잡아가고 있으니까. 그럼!"
80000111-62 = "(렌게의 전화가 있고 나서 또 3시간 후…….)"
80000111-66 = "[ns] \"아, 렌게. 혹시 초콜릿이…….\""
80000111-67 = "스승님, 바로 그 초콜릿 때문에 전화한 건데."
80000111-68 = "미안. 스승님! 정말 조금! 조금만 더! 있으면 될 것 같아. 거의 성공했다고 할까."
80000111-69 = "내가 보기에 지금 공정의 완성도는 대충 80%…… 아니, 78%…… 아니 67…… 그래, 넉넉잡아서 50% 정도 완성된 느낌이거든!"
80000111-70 = "[s] \"한순간에 30%가 날아가지 않았어? 렌게?!\""
80000111-71 = "괜찮아! 그 왜, 시작이 반이라는 말이 있잖아?"
80000111-72 = "[s] \"심지어 그 절반도 의심하게 만드는 발언……!\""
80000111-73 = "괘, 괜찮아! 아직 오늘이란 날은 남아있으니까."
80000111-74 = "그럼! 스승님! 완성되면 연락할 테니까!"
80000111-79 = "(그리고 또 3시간 후…….)"
80000111-83 = "[ns] \"전화 받았…….\""
80000111-84 = "미안! 스승님! 조금만……! 조금만 더 기다려 주라!"
80000111-85 = "방금 막 중탕에 대해서 알게 된 참이거든!"
80000111-86 = "어쩐지! 초콜릿이라는 건 바로 불에 녹이면 안 되는 물건이었구나! 새로 또 하나 배웠네!"
80000111-87 = "청춘이란 늘 배움의 연속인걸!"
80000111-88 = "[s] \"아, 으, 으응…….\""
80000111-89 = "그럼 스승님…… 끝나면 바로 연락할 테니까! 바로……!"
80000111-96 = "(렌게의 마지막 전화가 있었던 뒤로 또 3시간 뒤…….)"
80000111-100 = "[ns] \"이번엔 전화가 없네……. 렌게, 괜찮은 걸까.\""
80000111-101 = "(잠시 전화를 기다릴까 고민했지만)"
80000111-105 = "[ns] \"어디, 가볼까.\""
80000111-109 = "백화요란 주방"
80000111-110 = "[ns] \"불이 전부 꺼져 있네…….\""
80000111-111 = "(그렇게 렌게가 있을 만한 장소를 찾아 얼마나 서성이고 있었을까.)"
80000111-115 = "으읏, 아무리 해도 초콜릿의 형태가…… 이대로는 시간이……."
80000111-116 = "[s] \"……렌게?\""
80000111-120 = "서, 선생님……? 어째서 선생님이 여기에……."
80000111-121 = "아…… 전화가 없는 게 걱정이 되어서 이곳까지 왔다고……."
80000111-122 = "………크읏"
80000111-123 = "미안! 선생님! 그게 말이야……!"
80000111-127 = "[ns] \"좀처럼…… 마음대로 초콜릿을 만들 수 없었다?\""
80000111-128 = "면목이 없어. 선생님……."
80000111-129 = "오늘이란 날을, 최고의 발렌타인 데이로 만들기 위해, 어떻게든 내가 만들 수 있는…… 최강의 발렌타인 초콜릿을 만들고 싶었던 건데……."
80000111-130 = "미안……! 그렇게나 큰소리를 쳤는데, 결국 이런 늦은 시간까지 선생님을 기다리게 만들기나 하고."
80000111-131 = "……하긴 요리도 제대로 못 하는 내가 초콜릿을 제대로 만들 수 있을 리가, 없지."
80000111-132 = "아하하…… 주제도 모르고 선생님 앞에서 호기롭게 외쳤던 내 자신이 엄청 부끄러워……."
80000111-137 = "미안…… 꼴사납지……?"
80000111-138 = "이럴 줄 알았으면, 차라리 처음부터 초콜릿을 주자는 생각 같은 건……."
80000111-139 = "[s] \"아니, 그건 절대로 그렇지 않아. 렌게.\""
80000111-140 = "선생……님?"
80000111-141 = "[s3] \"렌게가 자신감 넘치는 모습으로 초콜릿을 선물해 주겠다고 말했을 때.\"\n[s4] \"엄청 기뻤어. 렌게가 나를 위해 결심해 준 거였으니까.\""
80000111-144 = "그러니…… 겨우 초콜릿을 만드는 데 실패했다는 걸로, 실망은 하지 않는다고?"
80000111-145 = "오히려……."
80000111-146 = "[s] \"실패를 경험하는 것도 청춘의 일부라고? 실패했다면 다시 도전하면 돼.\""
80000111-148 = "[ns] \"필요하다면 얼마든지 도와줄게. 나는 렌게의 스승님이잖아?\""
80000111-149 = "선생…… 아니, 스승님……"
80000111-153 = "……응!"
80000111-154 = "아무래도 계속해서 실패만 한 바람에, 나도 모르게 쪼오끔 약한 마음을 먹은 모양이야."
80000111-155 = "그거야말로 나답지 않은데 말이지!"
80000111-156 = "흠흠."
80000111-157 = "……그럼 염치없지만. 스승님."
80000111-158 = "초콜릿 만들기. 도와주지 않을……래?"
80000111-159 = "[s] \"응. 물론이야.\""
80000111-165 = "(그리하여 렌게와 함께 뜨거운 냄비 앞에서 얼마나 시간을 보냈을까…….)"
80000111-169 = "아…… 드, 드디어 이것으로……."
80000111-174 = "다행히 오늘 하루가 지나기 전에 스승님 덕분에 와, 완성했어……!"
80000111-175 = "[s] \"후우, 다행이네. 렌게.\""
80000111-176 = "아……… 응, 정말 고마워. 스승님."
80000111-177 = "정말 매번 스승님의 가르침이 없으면 어쩔 뻔했나. 하고 스스로도 감탄하고 있다니까."
80000111-178 = "스승님이 있어 줘서 정말, 다행이야……."
80000111-179 = "아! 이러고 있을 게 아니라. 같이 만든 입장에서 이런 말을 하긴 좀 그렇지만."
80000111-180 = "스승님! 오늘이 지나기 전에 이 초콜릿……."
80000111-181 = "[s] \"응, 같이 먹을까?\""
80000111-186 = "(그렇게 렌게와 힘을 합쳐 만든 초콜릿의 맛은, 무척이나 따듯하고 달콤했다.)"
