[translation]
200002-1 = "第2話;聯邦學生會長的信"
200002-4 = ""
200002-5 = "奇普托斯的市民朋友們，大家好。"
200002-6 = "我是聯邦學生會統領室的室長，同時兼任聯邦學生會長代理職務的七神琳。"
200002-7 = "最近因槍枝走火事故而造成市民意外受傷的事件接連發生。"
200002-8 = "槍枝只要受到輕微衝擊就有可能因此擊發，還請務必隨時注意不要將槍口朝向他人。#n並且，即使已卸下彈匣也請務必確認彈膛內是否有子彈殘留。"
200002-9 = "最後，請養成定期保養槍枝的習慣，避免槍管膛線卡入異物。#n此外也請勿使用，或者推薦他人使用未經聯邦學生會核准的非法兵工廠生產的彈藥。"
200002-10 = "各位微小的實踐，都將有助於打造更安全的奇普托斯。"
200002-11 = "以上是來自奇普托斯聯邦學生會的通知。"
200002-12 = ""
200002-20 = "「本公益廣告由奇普托斯聯邦學生會與克洛盧斯報導局共同製作」"
200002-21 = "「廣告相關洽詢，請聯絡克洛盧斯報導局」"
200002-22 = ""
200002-23 = "卡！OK了！"
200002-24 = "……辛苦了。"
200002-25 = ""
200002-27 = "聯邦學生會長代理辦公室"
200002-29 = "辛，辛苦了。前輩！"
200002-30 = "大家為了播出的準備都辛苦了。"
200002-31 = "今天預定要錄製的影片，這樣就全部結束了嗎？"
200002-32 = "嗯。新的道路交通法施行宣導公告，還有鼓勵民眾繳稅的CM錄製也全都結束了。"
200002-33 = "謝謝你協助財務室的工作，前輩。"
200002-34 = ""
200002-36 = ""
200002-37 = ""
200002-38 = "哎呀～真厲害呢，前輩。#n那麼長的台詞竟然一個字都沒唸錯，直接一鏡過關。"
200002-39 = "換作是我，肯定會因為太在意鏡頭而一直結巴的吧。"
200002-40 = "說不定前輩其實有當藝人的天分哦……？"
200002-41 = "我其實也沒有很喜歡在鏡頭前拋頭露面。"
200002-42 = "話說回來，為什麼連統領室以外其他部門的宣傳影片都得由我出演呢？"
200002-43 = "各部門的政策宣傳由室長們親自拍攝，應該會比我更有效果才對。"
200002-45 = "那，那是因為……"
200002-46 = "這不是理所當然的嗎？畢竟聯邦學生會的代表人物就是琳行政官啊。"
200002-47 = "站在市民的立場，與其讓不熟悉的室長來說明新政策，#n不如由大眾熟悉的聯邦學生會長代理親自說明，應該比較容易讓人接受吧。"
200002-48 = "以前這種宣傳CM，也都是由聯邦學生會長親自出演的。#n或許會讓你感到有些不便，還請你多多諒解。"
200002-50 = "……說的也是。這些原本就是聯邦學生會長的工作。"
200002-51 = "這麼說來，聯邦學生會長一直都很喜歡拍照呢。#n總是說著如果要留下回憶的話，照片是最好的選擇。"
200002-52 = "果然身居高位的話，就必須懂得享受站在鏡頭前的感覺嗎……？"
200002-53 = ""
200002-55 = ""
200002-56 = "說到照片，我突然想起了一件事。"
200002-57 = "步，你還記得這封信是從哪裡收到的嗎？"
200002-58 = "咦，咦咦！？"
200002-60 = "啊……是我從方舟回來時交給您的那封信呢。"
200002-61 = "那個……很抱歉。#n我也只是從信箱裡把東西拿回來而已……所以來源和寄件人都不太清楚。"
200002-62 = "難，難道裡面寫了什麼不好的內容……？"
200002-63 = ""
200002-64 = "不。裡面並沒有什麼特別的內容。"
200002-65 = "只是這封信上的筆跡和聯邦學生會長的很相似……"
200002-66 = "聯邦學生會長嗎？"
200002-67 = "聯邦學生會長？"
200002-68 = "聯邦學生會長的信！？"
200002-69 = ""
200002-71 = ""
200002-72 = ""
200002-73 = "……請大家先冷靜下來。這件事還沒有經過查證。"
200002-74 = "只是信封外側寫的「給琳醬」這幾個字，和聯邦學生會長的筆跡很相似而已……"
200002-75 = "但是信封裡卻沒有寫下任何內容。"
200002-76 = "取而代之的是……信封裡裝著幾張似乎是聯邦學生會長拍攝的照片。"
200002-80 = "雖然大部分我都有印象……"
200002-82 = "啊哈哈，這是什麼時候拍的啊？#n沒想到琳前輩也有過這種時期呢～"
200002-83 = "……桃香。"
200002-84 = "這是兩年前，聯邦學生會長剛就任時的照片呢。"
200002-85 = "啊，我也記得。#n當時還因為是歷代最年輕的聯邦學生會長而蔚為話題呢。"
200002-87 = "這是夏季合宿時拍的照片吧？"
200002-88 = "……是的。不過我給大家看這些照片，並不是為了回憶往事……"
200002-91 = "而是因為這張照片。"
200002-92 = "……黑白照片？"
200002-93 = "這張照片我也是第一次看到呢……"
200002-94 = "是不是用了什麼特別的濾鏡或特殊處理才印出來的？"
200002-95 = "也許是吧。現在幾乎都是以數位方式輸出……#n即使是底片相機，也幾乎不會使用黑白底片了。"
200002-96 = ""
200002-97 = "不過讓我在意的是這張照片的拍攝地點。"
200002-98 = "我所認識的聯邦學生會長，每天都忙於處理繁重的工作。#n大部分的時間都待在聯邦學生會的大樓內，就連假日也很少走出D.U.。"
200002-99 = "然而這座能看見水平線的巨大湖泊……據我所知，在D.U.裡並不存在這樣的地方。"
200002-100 = "有沒有人知道這個地點在哪裡呢？"
200002-103 = "誰知道呢……？"
200002-105 = "下一話;奇妙的夢"
