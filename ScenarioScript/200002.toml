[translation]
200002-1 = "Episode 2;General Student Council President's Letter"
200002-4 = ""
200002-5 = "Good afternoon, citizens of Kivotos."
200002-6 = "This is Nanagami Rin, your Chief of Supervisory Office and Acting General Student Council President."
200002-7 = "I'm addressing you today about the recent rise in citizen injuries from accidental firearm discharges."
200002-8 = "Please remember that a firearm is a deadly weapon and should never be pointed at anyone unless you intend to shoot. Additionally, always practice good gun safety and ensure the chamber is empty after removing your magazine."
200002-9 = "Keep your firearm free from foreign matter to prevent barrel fouling, and do not use or purchase any ammunition manufactured by sellers not authorized by the General Student Council."
200002-10 = "The small choices you make help keep Kivotos safe."
200002-11 = "This message was brought to you by the General Student Council."
200002-12 = ""
200002-20 = "\"This public service announcement is endorsed by the Kivotos General Student Council and Kronos School of Journalism.\""
200002-21 = "\"Please contact the Kronos School of Journalism for all ad-related inquiries.\""
200002-22 = ""
200002-23 = "Cut! Great take!"
200002-24 = "...Thank you for your hard work."
200002-25 = ""
200002-27 = "Acting General Student Council Executive Office"
200002-29 = "E-Excellent job, Rin."
200002-30 = "Thank you for arranging the logistics."
200002-31 = "Is that the last one for the day?"
200002-32 = "Yes. We've filmed everything we needed for the new Traffic Act enforcement notice and the infomercial encouraging tax payment."
200002-33 = "I appreciate you helping out the Treasurer's Office in this way."
200002-34 = ""
200002-36 = ""
200002-37 = ""
200002-38 = "Wooow! I'm shocked you managed all that in one take, Rin."
200002-39 = "I definitely would've tripped up on my words with a camera in my face."
200002-40 = "Maybe you missed your calling to be an actress?"
200002-41 = "I wouldn't say I enjoy being in front of a camera."
200002-42 = "That being said, I was curious... Why am I doing the recording for other departments? Of course I'll handle the Supervisory Office's work, but..."
200002-43 = "I believe the message would be more effective if the chiefs of their respective departments promoted their policies themselves."
200002-45 = "W-Well, that's—"
200002-46 = "That's exactly why it needs to be you. The public sees you as the face of the General Student Council, Chief Officer Rin."
200002-47 = "The citizens will receive news more favorably, regardless of if it's bad or good, from a familiar face, rather than from some nondescript chief whose name they don't even know."
200002-48 = "The General Student Council President also participated in these promotional videos during her tenure. So I hope you can bear the inconvenience of it all."
200002-50 = "...I see. The General Student Council President's work."
200002-51 = "Looking back, the General Student Council President did enjoy taking photos at every opportunity. She said there was no better way to preserve memories."
200002-52 = "I suppose being comfortable in front of the camera is another necessity of being in a position of power."
200002-53 = ""
200002-55 = ""
200002-56 = "Speaking of cameras..."
200002-57 = "Ayumu, do you remember where this letter came from?"
200002-58 = "Wh-What?!"
200002-60 = "Ah... The one I delivered to you when we returned from the Ark."
200002-61 = "My apologies! It was mixed up with a lot of other mail, so it'd be difficult to confirm the sender's identity..."
200002-62 = "W-Was it hate mail?"
200002-63 = ""
200002-64 = "No, no. Nothing like that. "
200002-65 = "It's only that...the handwriting was similar to the president's—"
200002-66 = "The General Student Council President's?"
200002-67 = "You said the General Student Council President?"
200002-68 = "The President wrote you a letter?!"
200002-69 = ""
200002-71 = ""
200002-72 = ""
200002-73 = "...Please calm yourselves. Nothing is confirmed."
200002-74 = "Only the \"To Rinny\" written on the outside of the envelope looked familiar."
200002-75 = "But there was no actual letter enclosed."
200002-76 = "Instead, there were several photos. Although they did seem to have been taken by her."
200002-80 = "I remember most of them, in fact..."
200002-82 = "Ahaha, when's this one from? I can't believe that's you, Rin."
200002-83 = "...Momoka."
200002-84 = "This was from two years ago. Just after the General Student Council President was elected."
200002-85 = "Ah, I remember that. It was a big deal across the news stations because she was the youngest president in history."
200002-87 = "This one's from our summer camp, right?"
200002-88 = "...Yes. But my purpose in showing you these wasn't to reminisce on old memories."
200002-91 = "This was my purpose."
200002-92 = "Why's it in black and white?"
200002-93 = "I don't think I've ever seen this one before..."
200002-94 = "It could have been printed with a special filter or had some post-processing done to it."
200002-95 = "Seeing as most prints are digital these days, that would be the most likely. Film is too rare, and black and white film even more so."
200002-96 = ""
200002-97 = "What concerns me is where this was taken."
200002-98 = "The General Student Council President I knew was always completely swamped, so she practically lived in the General Student Council building. Even on her days off, she wouldn't venture outside of D.U."
200002-99 = "This lake...and the background... I've never seen it before."
200002-100 = "Does anyone recognize the location?"
200002-103 = "No, I don't think so..."
200002-105 = "Next Episode;A Weird Dream"
