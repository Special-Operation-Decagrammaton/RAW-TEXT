[translation]
200002-1 = "ตอนที่ 2;จดหมายของประธานองค์การนักเรียน"
200002-4 = ""
200002-5 = "สวัสดีค่ะ ชาวเมืองคิโวทอสทุกท่าน"
200002-6 = "ดิฉัน นานากามิ ริน หัวหน้าสำนักงานบริหารและรักษาการประธานองค์การนักเรียนค่ะ"
200002-7 = "ระยะนี้เกิดเหตุพลเมืองหลายรายได้รับบาดเจ็บจากอุบัติเหตุปืนลั่นค่ะ"
200002-8 = "เนื่องจากปืนสามารถลั่นได้แม้เพียงการกระแทกเบาๆ จึงควรระวังอย่าให้ปากกระบอกปืนอยู่ใกล้คน และตรวจสอบให้แน่ใจว่าได้ถอดแม็กกาซีนออกแล้วทำให้กระสุนอยู่ในรังเพลิงก่อนยิง"
200002-9 = "แม้ได้รับแรงกระแทกเพียงเล็กน้อยก็อาจทำให้อาวุธปืนลั่นได้ จึงควรหันปากกระบอกปืนออกจากผู้อื่น#nเสมอ ถอดแม็กกาซีนออก พร้อมตรวจสอบรังเพลิงทุกครั้งค่ะ"
200002-10 = "การลงมือทำในสิ่งเล็กๆ น้อยๆ ของทุกคนจะทำให้คิโวทอสปลอดภัยค่ะ"
200002-11 = "และนี่คือประกาศจากองค์การนักเรียนคิโวทอสค่ะ"
200002-12 = ""
200002-20 = "<การประชาสัมพันธ์นี้ร่วมจัดทำโดยองค์การนักเรียนคิโวทอสและสำนักข่าวโครโนส#nเพื่อสาธารณประโยชน์ภายในคิโวทอส>"
200002-21 = "<หากต้องการสอบถามข้อมูลหรือขอคำปรึกษาด้านการโฆษณาประชาสัมพันธ์#nกรุณาติดต่อสำนักข่าวโครโนส...>"
200002-22 = ""
200002-23 = "คัต! เท่านี้ก็ OK แล้วค่ะ!"
200002-24 = "ขอบคุณทุกคนมากค่ะ..."
200002-25 = ""
200002-27 = "สำนักงานรักษาการแทนประธานองค์การนักเรียน"
200002-29 = "ทะ... ทำได้ดีมากเลยค่ะ  รุ่นพี่!"
200002-30 = "ขอบคุณทุกคนที่ทุ่มเทอย่างหนักเตรียมการออกอากาศนะคะ"
200002-31 = "วิดีโอที่มีกำหนดถ่ายทำวันนี้มีแค่เท่านี้ใช่มั้ยคะ?"
200002-32 = "อื้อ ก็อัดวิดีโอประกาศบังคับใช้กฎหมายจราจรฉบับใหม่กับวิดีโอรณรงค์การชำระภาษีเสร็จแล้วนี่นะ"
200002-33 = "ขอบคุณที่ให้ความร่วมมือกับฝ่ายการเงินนะ รุ่นพี่"
200002-34 = ""
200002-36 = ""
200002-37 = ""
200002-38 = "อ่า~ สุดยอดเลย รุ่นพี่  บทยาวขนาดนั้นยังพูดไม่ผิดเลยสักคำ แถมยังผ่านในเทคเดียวอีก"
200002-39 = "ถ้าเป็นฉันคงจะเขินกล้องจนพูดติดๆ ขัดๆ ไม่เลิกแน่"
200002-40 = "บางทีรุ่นพี่อาจมีพรสวรรค์ด้านการแสดงก็ได้นะเนี่ย...?"
200002-41 = "ฉันไม่ได้สนุกกับการมายืนอยู่หน้ากล้องแบบนี้หรอกนะคะ"
200002-42 = "จะว่าไป ทำไมฉันถึงต้องไปอยู่ในคลิปโปรโมตของหน่วยงานอื่นที่ไม่ใช่ฝ่ายบริหารด้วยล่ะคะ?"
200002-43 = "ให้หัวหน้าของแต่ละหน่วยงานมาประชาสัมพันธ์นโยบายด้วยตัวเอง น่าจะได้ผลดีมากกว่าให้ฉันทำ#nอีกนะคะ"
200002-45 = "คะ... คือว่าเรื่องนั้น..."
200002-46 = "คำตอบมันก็แน่นอนอยู่แล้วไม่ใช่รึไง? ก็เจ้าหน้าที่รินคือภาพลักษณ์ขององค์การนักเรียนไงล่ะ"
200002-47 = "ในมุมมองของประชาชน การได้ฟังนโยบายใหม่จากรักษาการประธานองค์การนักเรียนที่คุ้นหน้าคุ้นตา#nดีอยู่แล้ว ย่อมสบายใจกว่าฟังจากหัวหน้าแต่ละหน่วยที่ไม่รู้จักเลยน่ะ"
200002-48 = "ที่จริง ประธานองค์การนักเรียนก็เคยปรากฏตัวในวิดีโอประชาสัมพันธ์แบบนี้มาแล้ว#nอาจจะทำให้ลำบากใจไปบ้าง แต่ก็ช่วยเข้าใจหน่อยนะ"
200002-50 = "อย่างนี้นี่เอง... งานของประธานองค์การนักเรียนสินะคะ"
200002-51 = "จะว่าไป ประธานองค์การนักเรียนก็ชอบถ่ายรูปอยู่เสมอเลย และพูดบ่อยๆ ว่า รูปถ่ายเป็นวิธีที่ดีที่สุดในการเก็บรักษาความทรงจำ"
200002-52 = "การจะก้าวไปสู่ตำแหน่งที่สูงขึ้น ก็คงต้องรู้จักสนุกกับการยืนหน้ากล้องด้วยสินะคะ"
200002-53 = ""
200002-55 = ""
200002-56 = "พูดถึงเรื่องกล้องแล้วเลยนึกขึ้นมาได้"
200002-57 = "อายูมุ จำได้รึเปล่าคะว่าได้รับจดหมายฉบับนี้มาจากที่ไหน?"
200002-58 = "คะ... คะ?!"
200002-60 = "อ่า... จดหมายที่ฉันมอบให้ตอนที่กลับมาจากเรืออะทราฮาซิสสินะคะ"
200002-61 = "คือว่า... ขอโทษด้วยค่ะ ฉันหยิบมาจากตู้จดหมาย... เลยไม่ทราบพิกัดที่ส่งหรือชื่อผู้ส่งเลยค่ะ ขอโทษนะคะ..."
200002-62 = "ระ... หรือว่าเนื้อหาข้างในมีอะไรที่ไม่ดี..."
200002-63 = ""
200002-64 = "เปล่าหรอกค่ะ เนื้อหาในจดหมายไม่ได้มีอะไรพิเศษเลย "
200002-65 = "เพียงแค่ลายมือในจดหมายฉบับนี้ ดูคล้ายกับลายมือของประธานองค์การนักเรียนมาก..."
200002-66 = "ประธานองค์การนักเรียนเหรอคะ?"
200002-67 = "ประธานองค์การนักเรียน?"
200002-68 = "ประธานองค์การนักเรียนเขียนจดหมายส่งมาเหรอ?!"
200002-69 = ""
200002-71 = ""
200002-72 = ""
200002-73 = "ทุกคนใจเย็นๆ ก่อนนะคะ... เรื่องนี้ยังไม่ได้รับการยืนยันแน่ชัดหรอกค่ะ"
200002-74 = "ตัวหนังสือ 'ถึงรินจัง' ที่เขียนอยู่บนซองคล้ายกับลายมือของประธานองค์การนักเรียนก็จริง..."
200002-75 = "แต่ในจดหมายกลับไม่มีข้อความอะไรเขียนไว้เลย"
200002-76 = "แต่กลับมีรูปถ่ายที่ดูเหมือนประธานองค์การนักเรียนเป็นคนถ่ายใส่อยู่ในซองแทนค่ะ"
200002-80 = "ส่วนใหญ่จะเป็นภาพจากช่วงเวลาที่ฉันจำได้..."
200002-82 = "อะฮ่าฮ่า ถ่ายไว้ตั้งแต่เมื่อไรกันเนี่ย? รุ่นพี่รินก็เคยมีช่วงเวลาดีๆ แบบนี้ด้วยสิน้า~"
200002-83 = "โมโมกะ..."
200002-84 = "รูปพวกนี้เป็นรูปที่ถ่ายไว้เมื่อสองปีก่อน ตอนที่ประธานเพิ่งเข้ารับตำแหน่งค่ะ"
200002-85 = "อ๊ะ ฉันก็จำได้ค่ะ ตอนนั้นเป็นที่พูดถึงกันทั่วเลยเรื่องการเข้ารับตำแหน่งของประธานองค์การนักเรียน#nที่อายุน้อยที่สุดในประวัติศาสตร์"
200002-87 = "รูปนี้ถ่ายตอนเข้าค่ายฤดูร้อนใช่รึเปล่านะ?"
200002-88 = "ค่ะ... แต่เหตุผลที่ฉันให้ทุกคนดูรูปพวกนี้ไม่ใช่เพราะอยากระลึกความหลังหรอกนะคะ..."
200002-91 = "แต่เป็นเพราะรูปนี้ต่างหากค่ะ"
200002-92 = "รูปขาวดำ...?"
200002-93 = "ฉันก็เพิ่งเคยเห็นรูปนี้เป็นครั้งแรกค่ะ..."
200002-94 = "อาจใส่ฟิลเตอร์พิเศษหรือเอาไปแต่งรูปก่อนล้างรูปออกมารึเปล่า?"
200002-95 = "คงจะเป็นอย่างนั้นค่ะ สมัยนี้ส่วนใหญ่ใช้วิธีพิมพ์รูปแบบดิจิทัลกัน และต่อให้เป็นรูปจากกล้องฟิล์ม ก็แทบไม่มีกล้องที่ใช้ฟิล์มขาวดำแล้วด้วยค่ะ"
200002-96 = ""
200002-97 = "สิ่งที่ฉันติดใจมากที่สุดคือสถานที่ที่ถ่ายรูปนี้ค่ะ"
200002-98 = "ประธานองค์การนักเรียนที่ฉันรู้จักมักจะง่วนอยู่กับงานทั้งวัน เพราะงั้นเลยมักจะใช้เวลาส่วนใหญ่อยู่ที่#nอาคารองค์การนักเรียน แม้แต่วันหยุดก็แทบจะไม่ออกไปนอกเขต D.U. เลย"
200002-99 = "แต่ทะเลสาบกว้างใหญ่ที่มองเห็นเส้นขอบฟ้าแบบนี้... เท่าที่ฉันรู้ มันไม่มีอยู่ในเขต D.U. ค่ะ"
200002-100 = "มีใครพอจะรู้บ้างมั้ยคะว่าสถานที่นี้อยู่ที่ไหน?"
200002-103 = "นั่นสินะ..."
200002-105 = "ตอนต่อไป;ฝันประหลาด"
