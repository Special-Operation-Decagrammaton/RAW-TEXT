[translation]
51080-1 = "제8화;청춘(?)에 매진하는 소녀 2"
51080-5 = "저기…… 선생님? 이분들은?"
51080-6 = "[s] \"아, 이쪽은 수행부, 그리고 이쪽은 백화요란의 유카리야.\""
51080-8 = "오오! 백화요란……!"
51080-9 = "어, 근데 백화요란이라면 들어본 거 같은데……."
51080-10 = "후후, 처음 뵙겠습니다. 미모리예요."
51080-11 = "헉! 맞다!"
51080-12 = "안녕! 난 카에데! 멋진 레이디를 목표로 하고 있어!"
51080-13 = "안녕~"
51080-15 = "네, 안녕하시어요. 소녀의 이름은 유카리. 뵙게 되어 반갑사와요!"
51080-16 = "그러고 보면 수행부 여러분의 소문은 익히 들어 잘 알고 있사와요……."
51080-17 = "평소에도 거리에서 자경단 활동을 하신다고……."
51080-18 = "네, 어쩌다 보니 츠바키 쨩이랑 카에데 쨩과 함께……."
51080-19 = "아하하. 백화요란 분들께서 보시면 어떻게 생각할지는 모르겠지만……."
51080-20 = "아뇨! 과연! 훌륭한 활동이어요!"
51080-21 = "그런가요? 후후, 그럼 다행이네요."
51080-22 = "[s] \"그보다 수행부가 여긴 어쩐 일이야?\""
51080-24 = "아! 그거라면! 선생님. 우리 말이지! 축제 준비를 돕고 있었어!"
51080-25 = "응, 이번에도 마츠리부에서 의뢰가~ 들어와서 말이야~"
51080-26 = "<백귀야행 등불 축제>가 무사히 열릴 수 있도록 사전에 시설의 점검처럼 필요한 준비를 부탁받았답니다."
51080-27 = "특히 이번 축제는 어어어어엄~청 중요한 축제라. 꼭 도와줬으면 한다고 마츠리부 부장이 말하던 거 있지!"
51080-29 = "(그 뒤로 전해 들은 이야기는 음양부에서 들었던 것과 비슷한 맥락의 이야기였다.)"
51080-31 = "축제가 시작되면 <등불 축제>라는 이름에 걸맞게 거리는 불을 붙인 제등으로 가득해지고……."
51080-33 = "축제의 끝에 이르면 송구영신……이라고 해서-"
51080-34 = "네, 미래를 향한 소망과 함께, 힘들었던 과거의 기억을 등불에 담아 강가에 띄워 보낸다."
51080-35 = "그런 과정을 통해 새롭게 마음을 다독이는 축제. 라고 시즈코 쨩은 말했었죠."
51080-36 = "선생님. 기억하지……? 예전에 있었던 하늘이 새빨개졌던 일."
51080-40 = "그때 이후로 학원도 뒤숭숭한 느낌이었고 하니까."
51080-41 = "나름대로 신경 쓰고 있었나 봐……. 시즈코."
51080-43 = "그러니 그 분위기를 반전! 흥겨운 축제로 이겨내기 위해! 마츠리부 부장은 이번 축제를 다시 열려고 노력하는 거래! 선생님!"
51080-44 = "다 같이 축제를 즐기면서 안 좋은 기억은 송구? 어쩌고로 등불에 흘려보내는 거야! 굉장하지?"
51080-45 = "거기다 축제 맨 끝에서는 어어어어엄청 대단한 무녀님이 무대에서 노래를 부르고 춤을 춘다고 들었어!"
51080-46 = "부럽다아~ 나도 해보고 싶다아~"
51080-47 = "[s] \"무녀라면…… 혹시 이번에도 치세가……?\""
51080-48 = "아니요. 듣기로는 20년 전의 <등불 축제>에서도 제의를 담당했던 유서 깊은 가문의 사람이 맡는다고 들었어요."
51080-49 = "분명 엄청 대단한 사람이겠지~? 무지 이쁜 사람일 거야! 얼른 보고 싶네! 선생님!"
51080-55 = "어쨌거나 지금 이러는 와중에도 시즈코 쨩, 피나 쨩, 우미카 쨩까지. 다들 노력해서 준비하는 중이니."
51080-56 = "저희 수행부도 있는 힘껏 도와야죠."
51080-57 = "[s] \"다들 고생하는구나.\""
51080-63 = "……과연, 그런 것이로군요."
51080-64 = "그건…… 참으로…… 참으로……."
51080-70 = "훌륭한 마음가짐! [ruby=Excellent]엑서얼~란투[/ruby]인 것이어요!"
51080-72 = "네, 네엣?"
51080-73 = "괴로운 기억을 지닌 모두를 위해 축제를 다시 열고자 하는 그 행동!"
51080-74 = "과연…… 시즈코 양이라고 했던가요?"
51080-75 = "그 분께서는 참으로 훌륭한 마음가짐과 자세를 가진 분이시로군요!"
51080-77 = "앗, 네에. 정말 그렇답니다."
51080-78 = "헌데…… 유카리 양."
51080-79 = "네?"
51080-80 = "……혹시 저희, 어디서 만난 적이 있었을까요? 유카리 양의 낯이 익은 느낌이라……."
51080-84 = "앗, 그, 그거라면……!"
51080-85 = "오늘은! 네! 어쩐지 날씨가 무척이나 후덥지근하네요!"
51080-86 = "건강에 조심을 하지 않으면 안되겠사와요!"
51080-87 = "네? 아, 그, 그럴까요?"
51080-92 = "저기저기! 그보다 선생님!"
51080-93 = "이번 축제에서 만약 괴로운 기억을 등불로 띄워 보낸다면…… 선생님은 뭘 띄워 보내고 싶어?!"
51080-99 = "(그렇게 신나 하는 카에데를 비롯해 모두와 함께 담소를 나누고 있을 때였다.)"
51080-107 = "찾았다! 백화요란 녀석들……!"
51080-108 = "저번엔 잘도 우리를 엉망진창으로 만들어줬겠다!"
51080-114 = "……누구……시지요?"
51080-117 = "리더! 저기, 그때 그 녀석이 아닌데요……?"
51080-118 = "으으음! 상관없어! 어차피 저 물빛 하오리를 보면 같은 동아리일 거 아냐!"
51080-119 = "그럼 똑같이 갚아주면, 그 녀석을 향한 복수가 될 거라니깐!"
51080-121 = "과연 명안이십니다! 리더!"
51080-126 = "상대는 망량즈……"
51080-127 = "이유는 모르겠지만, 축제 시즌만 되면 난동을 부리는 아이들이에요!"
51080-128 = "또 문제를 일으키려는 거야? 그럼 가만 안 둬!"
51080-137 = "……위험해!"
51080-149 = "[ns] \"다들 괜찮아……?!\""
51080-151 = "헤헹! 방해자는 꺼지시지!"
51080-159 = "………겠사와요……"
51080-161 = "응?"
51080-163 = "이런 곳에서 난동을…… 그것도 아무런 죄도 없는 수행부 여러분께 횡포라니!"
51080-168 = "그 난폭한 행동! 절대로 용서하지 않겠사와요!"
51080-170 = "오! 해보겠다는 거냐!"
51080-172 = "네! 저 유카리!"
51080-179 = "백화요란의 엘리~트로서! 당신들을 쓰러트리겠사와요!"
51080-181 = "덤벼드는 그 용기는 가상하지만!"
51080-183 = "우리들은 망량즈!"
51080-192 = "이 숫자를 너 혼자 감당할 수 있을까!"
51080-194 = "읏……!"
51080-218 = "이, 이건 혹시……!"
51080-220 = "누, 누구냐?!"
51080-222 = "……잠깐 자리를 비운 사이에 무슨 소란인가 했더니 말이야."
51080-229 = "그 이상 난동을 부릴 생각이라면 어디 한 번 해보지 그래."
51080-234 = "……이 목소리는, 설마!"
51080-241 = "내 청춘 활동을 방해하려는 녀석이 있다면, 이 후와 렌게가 상대해 주마."
51080-246 = "……렌게 선배?!"
51080-248 = "에잇! 쳐, 쳐라……!"
