[translation]
10010105-1 = "제10화;끝내지 못한 이야기 2"
10010105-11 = "(……피로가 풀렸는지 눈이 알아서 다시 떠졌다.)"
10010105-12 = "……아. 일어나셨군요, 선생님."
10010105-19 = "생각보다 일찍 일어나셨네요……. 혹시 작업하는 소리에 깨신 건 아니죠……?"
10010105-20 = "옆에 분은……. 잠꼬대까지 하며 아주 잘 주무시고 계신데 말이죠."
10010105-22 = "으헤……. 간지러워요……. 으헤헤……."
10010105-23 = "……아까 전부터 계속 저 상태네요."
10010105-24 = "대체 무슨 꿈을 꾸시는 건지……. 몇 시간 전까지만 해도 죽을상이었으면서……."
10010105-25 = "[s1] \"……고생이 많네. 우이.\"\n[s2] \"작업은 잘 돼 가고 있어?\""
10010105-28 = "……뭐, 그렇죠……."
10010105-29 = "그렇지만 맡겨 달라고……. 제 입으로 말씀드린 거니까요. 그럼 해드리는 거죠……."
10010105-30 = "실은 이미……. 거의 다 했어요……. 앞으로 한 시간 안에 완료할 수 있을 거 같아요."
10010105-31 = "[s3] \"……그게 가능해? 물리적으로……?\"\n[s4] \"괜히 마술사라 불리는 게 아니었네.\""
10010105-34 = "그, 그런 식으로 띄워 주셔도 더 나오는 건 없어요……."
10010105-35 = "물론 칭찬 듣는 걸 싫어하진 않지만……. 아니, 별로 들은 적도 없지만……."
10010105-36 = "아무튼……. 네. 감사합니다……."
10010105-37 = "……."
10010105-38 = "뭐……. 음……. 이건 있잖아요……."
10010105-39 = "그냥……. 작업하는 동안……. 너무 조용하면 심심하니 그냥 하는 잡담 정도로 들어주세요……."
10010105-40 = "……사실 케이크 건은……. 약간의 심술이었어요. 알고 계셨을 수도 있지만……."
10010105-41 = "갑자기 쳐들어와서 그런 엄청난 것을 요구받았다 보니, 홧김에 내뱉은 조건이었죠."
10010105-42 = "솔직하게 말씀드리자면, 제대로 구해 올 수 있을 거라 기대도 하지 않고 있었고요."
10010105-43 = "……그런데 진짜로 구해 오시더라고요. 케이크도, 복원 재료들도……."
10010105-44 = "……뭐, 그렇다고 이제 와서 갑자기 '다른 사람들을 좋게 보도록 노력하겠습니다' 같은 입에 발린 소리는 아니지만……."
10010105-45 = "……음……."
10010105-46 = "[s5] \"우이도 나름대로 노력하고 있으니까.\"\n[s6] \"히나타 때문에 조금 너그러워진 거야?\""
10010105-47 = "……글쎄요. 그런 걸까요? ……모르겠네요."
10010105-48 = "……글쎄요. 그런 걸까요? ……모르겠네요."
10010105-49 = "왜일까요? 딱히 저분과 갑자기 가까워진 것도 아닌데 말이죠."
10010105-51 = "……그치만……. 네. 예전 같으면 여기서 한숨 자라는 말 따위, 절대 하지 않았을 거예요."
10010105-52 = "……스스로도 그런 말을 했다는 게 신기하긴 해요."
10010105-56 = "게다가 이런 늦은 시간에……. 이렇게……."
10010105-57 = "다른 사람과 대화를 하고 있을 날이 올 줄이야……."
10010105-59 = "……어쩌면 스스로도 몰랐던 자신의 무른 면을 본 걸지도 모르겠어요.."
10010105-60 = "……그러니까……. 어쩌면."
10010105-61 = "……그 무른 부분. ……지금 같은 느낌을 조금 더 진지하게 대면해 보면……."
10010105-62 = "그럼 나중에는……. 저도……."
10010105-63 = "흐아아아아아아암……."
10010105-65 = "……."
10010105-69 = "……어라. 저 왜 여기서 일어났죠……."
10010105-70 = "아. 맞다. 복원 준비……. 가져다 드리느라……. 그랬었죠……. 에헤헤……."
10010105-71 = "어……. 그러고 보니 벌써 시간이……. 밤이네요……?"
10010105-72 = "……아. 그러고 보니 기숙사……. 점호 시간도 지나버렸겠네요……."
10010105-73 = "……? 기숙사 점호 시간……?"
10010105-74 = "히나타씨. 잘 주무셨……."
10010105-76 = "……점호 시간!?"
10010105-77 = "……깜짝이야."
10010105-78 = "[ns7] \"히나타……?\"\n[ns8] \"큰일 난 거야?\""
10010105-79 = "크, 크크, 크 큰일이에요, 선생님! 저, 점호! 점호 시간 지나버렸어요!"
10010105-80 = "크, 크크, 크 큰일이에요, 선생님! 저, 점호! 점호 시간 지나버렸어요!"
10010105-81 = "어, 얼마나 지났죠……? 시, 시계. 시계……!"
10010105-82 = "……저기, 히나타 씨. 지금은 작업 중이니까 좀 조용히……."
10010105-83 = "두, 두 시간……!? 두 시간이면 이미 다 체크됐겠죠!? 이미 저 없는 거 다들 알게 됐겠죠!?"
10010105-84 = "저기, 기숙사 점호 정도로 그렇게 호들갑 좀 떨지 마세요. 게다가 저 지금 작업 중이니까 좀 조용히……."
10010105-85 = "그, 그, 그렇지만……! 다른 일도 아니고 자다가 점호에 늦다니! 다른 시스터 분들이 아시면 뭐라고 하실 지……!"
10010105-86 = "그러니까 시스터후드의 사정에 대해서는 알 바가 아니라고요……. 일단 조용히 좀……."
10010105-88 = "……."
10010105-90 = "이, 일단 기숙사 사감님께 연락부터……."
10010105-91 = "조용히 하라고 했잖아!!"
10010105-92 = "히이이익-!?"
10010105-93 = "[s9] \"음. 드디어 터졌군.\"\n[s10] \"그 정도면 많이 참았지.\""
10010105-94 = "책 보는 곳에선 조용히 하라고 대체 몇 번이나 말을 해야 해요!? 엉!?"
10010105-95 = "책 보는 곳에선 조용히 하라고 대체 몇 번이나 말을 해야 해요!? 엉!?"
10010105-96 = "우, 우이 씨……!? 이, 이건……. 그, 그러니까 저도 모르게……."
10010105-97 = "죄, 죄송합니다……!"
10010105-102 = "휴대폰 알람 소리는 진동으로!!!"
10010105-103 = "네, 네……! 지금 바로 바꿀게요. 지금 바로……!!"
10010105-104 = "……바로……?"
10010105-108 = "……어?"
10010105-110 = "……이번에는 또 뭐죠?"
10010105-111 = "……어……."
10010105-112 = "자, 잠깐만요. 죄송합니다……. 그……. 방금 온 그 메시지 연락……. 내용 때문에……."
10010105-113 = "성당에서 온 메시지네요. 읽어 볼게요."
10010105-114 = "……? 성당……?"
10010105-115 = "'참고사항으로 알려 드립니다. 내일 아침 있을 예정이었던……. 경전 공개 및 낭독 행사'……."
10010105-116 = "……."
10010105-117 = "[s11] \"히나타……?\"\n[s12] \"행사가……?\""
10010105-118 = "'참석 귀빈들의 의견이 만장일치로 통일되어……. 일정을 앞당겨 곧바로 진행하게 되었습니다.'"
10010105-119 = "'참석 귀빈들의 의견이 만장일치로 통일되어……. 일정을 앞당겨 곧바로 진행하게 되었습니다.'"
10010105-120 = "……'행사 개최 시간은 오늘 밤 자정입니다.'"
10010105-121 = "……오늘 자정?"
10010105-122 = "오늘 자정……."
10010105-124 = "……오늘 자정."
10010105-131 = "……딱 한 시간 뒤네요……."
