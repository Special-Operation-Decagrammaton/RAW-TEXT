[translation]
1013202-1 = "다시, 모델이에요!"
1013202-2 = "패션쇼장 무대 뒤편"
1013202-4 = "(그만두었다던 모델 일을 츠쿠요가 다시 시작했다는 것이 마음에 걸려서, 참관을 가보기로 했다.)"
1013202-5 = "아, 선생님! 여기예요!"
1013202-6 = "이, 이곳에 들어오시는 데 문제는 없으셨죠?"
1013202-7 = "[s]\"응, 직원분께서 친절하게 안내해 주셨어.\""
1013202-8 = "헤헤, 다, 다행이에요."
1013202-9 = "사실 제, 제가 직원분들께 미리 말씀드려 두었거든요."
1013202-10 = "어, 엄청난 분이 오실 예정이니까, 잘 부탁드린다고요……."
1013202-11 = "[s]\"제가요?!\""
1013202-12 = "그, 그나저나 이렇게 무대 뒤에서 뵈니까 신기한 기분이에요."
1013202-13 = "뭐, 뭔가 비밀스럽게 만나는 기분도 들고…… 헤헤."
1013202-14 = "[s1] \"진짜 그런 거 같네.\"\n[s2] \"패션쇼 준비는 잘 되어가고 있어?\""
1013202-17 = "아, 예! 의상 착용은 끝났고, 워킹 자세를 점검하던 중이었어요."
1013202-18 = "오늘 신은 구두의 굽 높이가 조금 생소해서 발에 미리 익혀 두려고요."
1013202-19 = "[s]\"오…… 방금 굉장히 전문가 같았어, 츠쿠요!\""
1013202-23 = "아, 아니에요!"
1013202-24 = "저, 저보다 훨씬 더 경력도 길고 프로페셔널한 분들도 많은걸요……!"
1013202-25 = "그리고 무엇보다, 저는 오늘이 정말 마지막 모델 활동이기도 하고……."
1013202-26 = "그, 그런데 선생님이 보시기에는 어떠신가요?"
1013202-32 = "이 드레스, 그, 저, 저한테 잘 어울리나요?"
1013202-33 = "[s3] \"그런 무의미한 질문을!\"\n[s4] \"모델 츠쿠요 님이 소화하지 못할 옷이 있을 리가 없잖아!\""
1013202-36 = "흐, 흐에에에……."
1013202-37 = "그, 그, 그렇게 띄우지 마세요……."
1013202-38 = "그, 그래도 좋게 봐주셔서 감사해요, 선생님. 헤헤……."
1013202-39 = "[s]\"그러고 보니, 어쩌다 다시 모델 일을 하게 된 거야?\""
1013202-40 = "아, 며칠 전에 샤인캣 에이전시를 통해 이 패션모델 일을 전해 받았어요."
1013202-41 = "처음에는 거절하려고 했는데……."
1013202-42 = "들어 보니까 하루짜리 단기 아르바이트이기도 해서 별 부담도 없을 것 같고……."
1013202-43 = "무엇보다, 그……."
1013202-45 = "……패션쇼 주최 측에서, 저에게 거절할 수 없는 조건을 제시해 와서요."
1013202-46 = "[s]\"……거절할 수 없는 조건?\""
1013202-47 = "예."
1013202-48 = "사실 저는 이미 한 번 모델 일을 그만둔 적이 있기도 했고……"
1013202-49 = "그래서 모델 일을 다시 하게 되는 것이 부담되기는 했지만……."
1013202-50 = "……조건을 듣는 순간, 이 일을 맡기로 마음을 바꾸게 되었어요."
1013202-51 = "[s]\"대체 무슨 조건이었길래……?\""
1013202-52 = "아, 그건……."
1013202-56 = "준비해 주세요. 10분 뒤에 시작합니다."
1013202-57 = "엇, 벌써 시간이……!"
1013202-58 = "다녀올게요, 선생님!"
1013202-64 = "(아무리 생각해도 뭔가 수상하다는 느낌을 지울 수가 없어서…….)"
1013202-65 = "(최대한 근처에서 츠쿠요를 지켜보기로 했다.)"
1013202-67 = "패션쇼 행사장"
1013202-69 = "(잠시 뒤, 패션쇼가 시작되었다.)"
1013202-85 = "(츠쿠요는 맡은 역할을 훌륭히 해냈고…….)"
1013202-86 = "(……패션쇼는 시작부터 끝까지 아무런 문제 없이 평화롭게 진행되었다.)"
1013202-92 = "패션쇼장 바깥"
1013202-93 = "(그렇게 패션쇼가 끝난 뒤, 행사장 밖에서 츠쿠요를 만났다.)"
1013202-97 = "아, 선생님!"
1013202-98 = "죄송해요, 제가 좀 늦었죠?"
1013202-99 = "[s]\"아냐, 나도 나온 지 얼마 안 됐어.\""
1013202-100 = "저, 정말요?"
1013202-101 = "헤헤…… 다행이네요."
1013202-102 = "그, 그럼 이제 패션쇼 아르바이트도 다 끝났으니까……"
1013202-104 = "어이, 거기, 스탑."
1013202-108 = "예……?"
1013202-109 = "이봐, 츠쿠요 씨, 그냥 이렇게 가 버리면 안 되지……!"
1013202-110 = "네……?"
1013202-111 = "우리가 나눈 약속이 있지 않나."
1013202-112 = "우리가 맺었던 근로 계약, 혹시 까먹은 것은 아니겠지?"
1013202-113 = "앗……! 그러고 보니 급하게 나오느라 잊고 있었어요!"
1013202-114 = "[s]\"설마 거절할 수 없는 조건이라는 게……!\""
1013202-118 = "호오, 그쪽도 알고 있나?"
1013202-119 = "그래, 맞아. 나는 그 조건으로 츠쿠요라는 걸출한 모델을 섭외할 수 있었지."
1013202-120 = "그것은 바로……."
1013202-124 = "시바견왕왕 감독의 13번째 영화, <닌자는 일곱 번 산다>의 시사회 팸플릿!"
1013202-125 = "[s]\"……엥?\""
1013202-126 = "상당한 수작이지만, 당시 여러 문제 때문에 시사회 자체가 워낙 소규모로 열려서 현재는 남은 시사회 팸플릿이 거의 없지."
1013202-127 = "하지만 당시 그 시사회를 주관했던 것이 바로 우리 회사……!"
1013202-128 = "그래서 모델료와 더불어! 회사 창고에 남아 있던 이 팸플릿까지 넘기는 것을 조건으로, 츠쿠요 씨가 계약해 주셨던 것이다!"
1013202-129 = "[s]\"……그런 거였어?!\""
1013202-131 = "예! 이런 희귀한 팸플릿을 부실에 걸어 놓는다면, 부장님과 이즈나 쨩도 분명 좋아할 테니까요!"
1013202-132 = "헤헤, 까먹고 갈 뻔했는데 다행이네요."
1013202-133 = "이것 때문에 다시 모델 일을 한 거였는데 말이에요."
1013202-134 = "아, 그런데 말이야, 츠쿠요 씨."
1013202-135 = "이렇게 된 거, 차라리 업계로 완전히 복귀하는 건 어때?"
1013202-136 = "……예?"
1013202-137 = "사실 얼마 전 패션 컨퍼런스에서 샤인캣 디자이너님과 개인적으로 대화를 나눌 일이 있었는데……."
1013202-138 = "아직도 은근히 츠쿠요 씨에 대한 미련이 남아있는 것 같더라고."
1013202-139 = "그, 그런……."
1013202-140 = "물론, 저, 정말로 감사한 말씀이긴 하지만……."
1013202-144 = "솔직히, 그때로 돌아가는 건 너무 무서워요……"
1013202-145 = "지옥의 트레이닝…… 야채밖에 없지만 그마저도 거의 안 주는 식단…… 긴장을 풀 수 없는 모든 순간들……."
1013202-146 = "하긴, 하이패션 모델 일은 재능만 있다고 버텨낼 수 있는 영역이 아니긴 하지……."
1013202-147 = "내가 실례를 했군."
1013202-148 = "아, 아니에요! 오히려 좋게 봐주셔서 감사해요!"
1013202-149 = "그러면, 나는 먼저 들어가 보지."
1013202-153 = "흐우우, 뭔가 죄송스러워지네요……."
1013202-158 = "그, 그게, 사실, 최근 며칠 동안 몸매를 다시 가꾸느라 밥을 제대로 못 먹어서……!"
1013202-159 = "[s]\"가자, 츠쿠요. 맛있는 식당을 알고 있으니까.\""
1013202-160 = "서, 선생님……?"
1013202-161 = "제, 제가 그런 걸 먹어도……."
1013202-162 = "[s5] \"일하지 않은 자, 먹지도 말라.\"\n[s6] \"그러니 일을 했으면, 먹어야지!\""
1013202-165 = "아앗……!"
1013202-166 = "그, 그렇다면……."
1013202-167 = "자, 잘 먹겠습니다, 선생님!"
1013202-169 = "(예상보다 식비가 조금 더 나오긴 했지만…….)"
1013202-170 = "(츠쿠요의 웃는 얼굴을 보니, 그런 건 아무래도 좋았다.)"
