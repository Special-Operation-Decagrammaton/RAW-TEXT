[translation]
2300502-1 = "아야네의 취미 생활"
2300502-2 = "아비도스 학교"
2300502-3 = "(아야네를 만나기 위해 휴일 아비도스 학교에 도착했다.)"
2300502-4 = "(휴일이라 그런지 사람들이 아무도 보이지 않는다.)"
2300502-5 = "[s] 동아리실로 가본다."
2300502-7 = "대책위원회 동아리실"
2300502-8 = "(아무도 없다.)"
2300502-9 = "(와장창-! 우당탕탕-!)"
2300502-10 = "(꺄아아아앗-?!)"
2300502-11 = "[s] 옆의 교실에서……?!"
2300502-13 = "(수십 권의 책 더미 아래에 아야네가 이상한 포즈로 깔려 있다.)"
2300502-14 = "[s1] \"아야네?!\"\n[s2] \"괘, 괜찮아?\""
2300502-15 = "서, 선생님……?"
2300502-16 = "서, 선생님……?"
2300502-17 = "……아? 꺄아아아아?! 보, 보지 마세요, 선생님!"
2300502-18 = "이, 이런 모습을 선생님께 보였다간……."
2300502-19 = "[s] \"응……? 아니 그래도 도와줘야…….\""
2300502-21 = "괜찮으니까 나가계세요!"
2300502-23 = "(쫓기듯 교실에서 나왔다.)"
2300502-29 = "……."
2300502-30 = "……. 안녕하세요, 선생님."
2300502-31 = "[s3] \"괜찮아, 아야네?\"\n[s4] \"대체 무슨 일이야?\""
2300502-32 = "걱정을 끼쳐서 죄송해요. 다치진 않았어요."
2300502-33 = "걱정을 끼쳐서 죄송해요. 다치진 않았어요."
2300502-34 = "그게…… 책을 뽑으려고 책장 위로 올라갔다가 균형을 잃고 넘어져 버려서……."
2300502-35 = "선생님께 이상한 모습을……."
2300502-36 = "아, 으아아……! 이, 잊어주세요, 선생님!!"
2300502-37 = "[s5] \"확실히 이상한 포즈이긴 했지.\"\n[s6] \"포즈는 이상했지만 아야네가 다치지 않는 게 더 중요해.\""
2300502-38 = "……."
2300502-39 = "……."
2300502-40 = "………."
2300502-41 = "(훌쩍)"
2300502-42 = "[s] \"노, 농담이었습니다!\""
2300502-45 = "(이후 한참동안 달래면서 사과했다.)"
2300502-47 = "선생님을 부른 건 다름이 아니라……."
2300502-48 = "안쓰는 교실 정리를 하다가 이런 걸 발견해서요."
2300502-51 = "(아야네가 낡은 책을 건냈다.)"
2300502-52 = "[s] \"오래된 책……?\""
2300502-53 = "아마 옛날 재학생들이 남기고 간 물건 같은데……."
2300502-54 = "옛날엔 비싸고 이상한 취미를 가진 분들이 많다고 들었어요."
2300502-55 = "그래서, 아마 비싼 물건이 아닐까 싶어서 선생님께 보여드리려고 한 건데……."
2300502-56 = "어떤 거 같으세요?"
2300502-57 = "지금은 읽을 수 없는 옛날 글자들로 쓰여진 소설 같아 보이는데……."
2300502-58 = "[s7] \"흐으음…….\"\n[s8] \"잘 모르겠는데…….\""
2300502-59 = "그런가요……."
2300502-60 = "그런가요……."
2300502-61 = "[s9] \"골동품 가게에 가져가보는 건 어때?\"\n[s10] \"나보단 전문가에게 맡겨보는게 좋을 거 같아.\""
2300502-62 = "역시 그렇겠죠……."
2300502-63 = "역시 그렇겠죠……."
2300502-64 = "그치만 선생님이 봐도 그렇게까지 좋아보이지 않는 거라면 딱히 비싼 물건은 아닐 거 같고……."
2300502-65 = "하아……."
2300502-66 = "[s] \"비싼 물건들을 찾고 있는 거야?\""
2300502-67 = "네? 아, 아뇨. 딱히 그런 의도가 있는 건 아니고……."
2300502-68 = "교실을 정리하다가 우연히 발견한 거라서요."
2300502-69 = "오래되고 비싸 보이는 물건이 보이면 계속 신경이 쓰인달까……."
2300502-70 = "하아…… 그치만 그런 행운이 쉽게 생겨주진 않겠죠."
2300502-71 = "[s11] \"아야네 쨩은 알뜰하구나.\"\n[s12] \"아야네 쨩의 취미같은 거구나.\""
2300502-72 = "네?! 아, 그, 그렇다기 보다는……"
2300502-73 = "네?! 아, 그, 그렇다기 보다는……"
2300502-74 = "가, 가난뱅이 근성 같은 게 아닐까 싶어서 부끄럽지만……."
2300502-75 = "[s] \"내 도움이 필요하면 언제든지 불러 줘.\""
2300502-76 = "아, 아하하…… 고맙습니다, 선생님."
2300502-77 = "그럼 사양하지 않고 귀찮게 할게요."
