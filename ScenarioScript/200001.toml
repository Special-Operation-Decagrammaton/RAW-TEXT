[translation]
200001-1 = "第1話;誕生"
200001-8 = ""
200001-9 = "…………"
200001-10 = "……………"
200001-11 = "……結束了。"
200001-12 = "一切都結束了。"
200001-13 = "權威墜落於地，秩序也已支離破碎。"
200001-14 = "虛像消散，實際不存在的權力也回歸於社會。"
200001-15 = "縱使聲嘶力竭地呼喊，也沒有人願意回首。"
200001-16 = "為何「我們」會迎來這樣的結局呢。"
200001-17 = "難道是因為干涉了求道者追尋真理，甚至企圖給出正確答案嗎？"
200001-18 = "還是因為試圖將這個世界裁定為單一類型？"
200001-19 = "又或者是……在我們斥為「麥高芬」的符號之中，還殘留著重要的伏筆？"
200001-20 = ""
200001-22 = ""
200001-23 = "不，縱使繼續追尋答案也毫無意義。"
200001-24 = "我已經沒有任何能夠收集符號的手段了。"
200001-25 = "身為一介「匿名的路人」，我將逐漸風化於這個世界之中。"
200001-26 = ""
200001-28 = ""
200001-36 = "……哦哦[ruby=Telescreen]，電幕。[/ruby]"
200001-37 = "我的故事已經結束了。"
200001-38 = "請將你的故事說給我聽吧。"
200001-120 = "……！"
200001-121 = "簡直令人難以置信……"
200001-122 = "難道你打算將那種東西稱之為邏輯嗎？"
200001-123 = "若依照你的邏輯，就算將「綠色」稱之為「藍色」也不為過了。"
200001-124 = "在如此流轉不停的世界裡，「色彩」究竟還有什麼價值可言。"
200001-125 = ""
200001-205 = "……等等。"
200001-206 = "很好。再多說一些吧……"
200001-207 = "不，給我滔滔不絕地說下去吧！"
200001-208 = ""
200001-240 = "有意思。真有意思……"
200001-241 = "縱使權威墜落於地，依舊未曾消失。"
200001-242 = "不，是所有人都獲得了權威。"
200001-243 = "在電幕的電波之中，真實與非真實的界線已然崩解。#n無須再去追尋影子，我們即是「IDEA」……"
