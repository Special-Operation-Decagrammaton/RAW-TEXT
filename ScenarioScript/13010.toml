[translation]
13010-1 = "제1화;프롤로그"
13010-4 = "드디어 찾았군."
13010-5 = "게마트리아에서 축출되어 파묻히고 봉인된 우리들의 [ruby=OB]옛 동료[/ruby]여."
13010-7 = "괴로워…… 괴로워……."
13010-8 = "아니, 너의 고행은 이제 끝이다. 깨어나라, <지하생활자>."
13010-9 = "……."
13010-10 = "……. 이 목소리는."
13010-11 = "<익명의 행인>, 그대인가요……."
13010-12 = "아니, <프랜시스>라고 불러라. 이번에는 말이지."
13010-13 = "아니…… 아무래도 상관없습니다. 그냥 절 내버려두세요……."
13010-14 = "무슨 이유로 저를 찾아왔는지는 모르겠지만…… 관심 없으니까요. 히히히……."
13010-15 = "그게 무엇이든…… 소인은 이제 더 이상……."
13010-18 = "게마트리아가 궤멸됐다."
13010-19 = "……."
13010-20 = "그게 무슨 뜻이 온 지……?"
13010-22 = "게마트리아는 이제 사라졌다. 해체, 혹은 해산했다고 볼 수 있지."
13010-23 = "원인은 결국 단 하나."
13010-24 = "샬레의 [USERNAME] 선생이라는 존재가 있었기 때문이다. 그자가 인과와 장르를 뒤틀었다."
13010-25 = "현재로선 그자를 상대하는 건……."
13010-26 = "……쉿."
13010-31 = "……흐음."
13010-32 = "그렇군요. [ruby=룰북]코덱스[/ruby]가 갱신되었군요."
13010-40 = "새로운 세계…… 그래, 느껴집니다. 이 세계의 이물감이."
13010-41 = "판본이 바뀌고, 규칙이 바뀌었다면…… 이것은 또 새로운 캠페인이 시작된 것이겠군요."
13010-42 = "그, 그렇군요……. 히히히. 그렇다면 이야기가 다르죠."
13010-43 = "이, 이, 이번 판본은 또 소인에게 어떤 깨달음을 줄지……."
13010-44 = "어디…… [USERNAME]입니까……?"
13010-45 = "이자가 이번 캠페인의 보스라고요……? 어디어디……."
13010-46 = "새로운 코덱스는……"
13010-52 = "학원도시……?"
13010-58 = "거기에 선생……?"
13010-60 = "뭐, 뭐야…… 이러면 난이도가 꽤 어, 어, 어렵잖아요……? 이런 거라면……."
13010-64 = "……하지만 그게 무엇이든 반드시 공략법은 존재하기 마련이죠. 어디 보자……. 맹점, 약점, 결점…… 뭐든 좋으니……."
13010-65 = "그자를 우습게 보지 마라. 지하생활자."
13010-69 = "네가 이 세계를 어떻게 인식하는지는 관심 없다. 하지만 그렇게 보드게임 같은 것으로만 이 세계를 규정한다면 올바른 승리에 도달할 수 없다."
13010-70 = "……."
13010-71 = "내가 답을 알려주마. 그 자에게서 승리할 수 있는 방법은 바로……."
13010-77 = "방해하지 마!!! 쓰레기가!!!!"
13010-82 = "죽음을 모르는 네놈 따위가! 어, 어어?!?"
13010-83 = "나의 고통을, 고독을, 공포를 이해라도 할 수 있다는 거냐!!"
13010-84 = "방해하지 마라!! <익명의 행인>! 이것은 온전히 나의 캠페인이다!!"
13010-85 = "오직 이 고행을 통해서 내가 어떤 깨달음에 도달할 수 있는지만이 중요하다!!"
13010-86 = "그걸 네가 방해하면 안 되지이---!!!!"
13010-91 = "내 캠페인에 멋대로 개입하지 말라고오오----!!"
13010-102 = "하아…… 하아……."
13010-103 = "승리…… 승리…… 왜 다들 그런 것 따위에 집착하는 거지?"
13010-104 = "결과는 이미 정해져 있잖아!! 우리는 언젠가 죽는다! 그건 변하지 않아!"
13010-105 = "결국 모두 패배할 운명이란 말이다!! 중요한 건 그게 아니라고!"
13010-106 = "그래…… 중요한 것은 오직 과정…… 과정에서 내가 무엇을 경험하고 무엇을 깨닫는지만이 유의미하다."
13010-107 = "네놈들 따위가, <게마트리아>라는 숭고한 구도의 이름을 참칭하다니! 이, 이름이……"
13010-108 = "아깝잖아아-!!!"
13010-110 = "하아…… 하아……."
13010-111 = "지, 지, 진정하자. 진정해야 해……."
13010-112 = "지금부터 무엇을 할지…… 저, 정하지 않으면 안 되겠죠……."
13010-116 = "게, 게, 게마트리아가 궤멸되었다고?"
13010-117 = "아니, 진정한 게마트리아는 바로 나."
13010-118 = "이제부터 제가 게마트리아의 진정한 모습을 보여줘야만 하겠군요……."
13010-119 = "히히히. 좋습니다. 좋아요. 우선은 이 세계를 알아봐야겠군요……. 새로운 코덱스. 새로운 캠페인……."
13010-120 = "아아. 네. 그렇다면 소인의 구도는 [ruby= ・]거[/ruby][ruby= ・]기[/ruby][ruby= ・]서[/ruby][ruby= ・]부[/ruby][ruby= ・]터[/ruby] 시작되어야 하겠군요."
13010-122 = "……아비도스."
13010-123 = "그 강대한 신비들이 최초로 탄생했던 그 제국은 과연…… 이번 코덱스에서는 어떤 형태일지 궁금하군요……."
13010-125 = "좋아요. 기대가 됩니다."
13010-130 = "부디…… 저를 실망시키지 말아주시길."
13010-136 = "이것 봐! 호시노 쨩!"
13010-138 = "옛날 학생회가 아비도스 대(大) 오아시스에 엄청난 걸 묻어뒀대!!"
13010-139 = "네? 엄청난 거요?"
13010-140 = "응! 불꽃놀이에 쓰는 소재인데, 희귀 광물로 만든 폭죽 같은 건가 봐."
13010-141 = "여기다 강한 온도로 자극을 주면 플라즈마로 된 불꽃이 발생해서, 하늘을 멋지게 수놓는 기술이래."
13010-142 = "이것 봐, 이런 모양의 불꽃도 있어! 귀엽지?"
13010-146 = "원래는 이걸 축제 때 사용할 예정이었는데…… 어째서인지 제대로 작동하지 않아서 남은 걸 그냥 호수에 버렸다고 해."
13010-147 = "……흐음."
13010-148 = "굉장하지 않아? 100g에 백만 엔도 더 하는 광물이 포함된 물건을 그냥 고장 났다고 호수에 버렸다는 게."
13010-149 = "과연 아비도스 학생회라고나 할까……. 돈이 넘쳐나서 오리털로 만든 체육 매트를 쓰던 분들이라고 할까……."
13010-150 = "그 재산의 100분의 1이라도 우리에게 주면 좋았겠지만……. 힝……."
13010-151 = "……하지만 그 오아시스는 말라버린 지 오래잖아요."
13010-152 = "응. 그렇지?"
13010-153 = "지금은 그냥 모래 평원인데, 거기에 그런 건 눈 씻고 봐도 없었잖아요. 무슨 말을 하고 싶은 거예요?"
13010-154 = "후. 후. 후. 호시노 쨩은 하나만 알고 둘은 모르는구나?"
13010-155 = "그 당시 호수가 있던 시절의 이야기니까, 이건 엄청 오래전에 있었던 일인 거잖아?"
13010-156 = "무슨 얘길 하고 싶은 거예요?"
13010-157 = "즉, 그 비싼 폭죽은…… 사실은 말라버린 오아시스……"
13010-158 = "그 모래 평원 아래에 묻혀 있는 거야."
13010-162 = "비싼 광물이 말라버린 대 오아시스 바닥 아래에 묻혀 있다? 그 말이에요?"
13010-163 = "응!"
13010-167 = "……유메 선배. 지금 무슨 말을 하는 건지 아시나요?"
13010-169 = "어…… 그건……."
13010-173 = "이러고 있을 때가 아니란 거예요! 지금 당장 찾으러 가야 한다는 뜻이라고요!"
13010-174 = "응, 맞아! 내 말이 그거야! 지금부터 보물찾기야!"
13010-175 = "으헤~ 좋아요, 당장 가요! 선배!"
13010-176 = "응! 이제 우린 부자가 되는 거야, 호시노 쨩!"
13010-187 = "호시노 쨩…… 저기……."
13010-188 = "말하지 마요, 선배! 나도 지금 느끼고 있으니까!"
13010-189 = "그렇지? 나만 느끼는 거 아니지? 그럼 이제 슬슬 이거 멈춰야 할까?"
13010-190 = "조, 조금만 더 파보고요……?"
13010-191 = "……미안. 망한 것 같아. 호시노 쨩."
13010-192 = "크, 크으윽……."
13010-194 = "있지…… 호시노 쨩…… 우리, 어디서부터 잘못된 걸까……?"
13010-195 = "선배가 이상한 계획을 들고 왔을 때부터 아닐까요?"
13010-196 = "힝…… 호시노 쨩도 좋아했으면서 내 탓인 걸까……? 그런 걸까……?"
13010-197 = "……저, 저도 알고 있으니까 굳이 그 부분을 지적하지 않아도 돼요!"
13010-202 = "지금 생각해 보니까 수영복을 굳이 입을 필요도 없었던 것 같고……."
13010-203 = "……역시 뭔가 의도가 있었던 건 아니었군요?! 그럼 대체 왜 입자고 한 거예요?"
13010-204 = "어…… 혹시 땅을 파다가 뻐엉, 하고 지하수가 터질 때를 대비해서……."
13010-205 = "그럴 확률이 있긴 했어요?!"
13010-207 = "그걸로 사막화도 짠, 하고 전부 해결되었습니다! 하는 해피엔딩이……."
13010-208 = "그럴 리가 없잖아요!"
13010-209 = "히잉……"
13010-211 = "으응. 반성의 의미로 오늘 있었던 일을 적어두지 않으면……."
13010-212 = "자, 잠깐. 선배? 뭘 적고 있는 거죠?"
13010-213 = "이 바보짓을 기록해 두겠다고요? 부끄러우니까 하지 마요!"
13010-214 = "그치만 학생회장으로서의 의무랄까…… 그래야 나중에 호시노 쨩에게 도움이 될 거고……."
13010-215 = "애초에 실패의 기록밖에 없잖아요, 거기에! 게다가 그런 너덜한 수첩 따위를 누가 받는다고요! 저는 새로 살 거라고요!"
13010-216 = "힝……."
13010-222 = "대책위원회실"
13010-223 = "자, 그럼 아비도스 대책위원회 정기 회의를……."
13010-224 = "……시작하려고 했는데, 한 사람이 안 보이는데요?"
13010-228 = "응응! 언제나 보이지 않는 한 명이~☆"
13010-229 = "응. 호시노 선배가 없어."
13010-230 = "뭐야, 또 어딜 간 거야? 설마 또 어딘가에 숨어서 자고 있는 거 아냐?"
13010-231 = "아까 봤는데 옆 교실에서 자고 있었어."
13010-232 = "뭐어? 그럼 데려왔어야지, 시로코 선배! 회의 시작인데!"
13010-233 = "으, 으응…… 깨우기가 좀 그래서……."
13010-234 = "왜? 또 헤실헤실 거리면서 자고 있어서?"
13010-235 = "이해해요. 시로코 쨩은 호시노 선배에게 무르니까요."
13010-236 = "지금 데리고 올게."
13010-237 = "아. 그럼 저도 같이 가요, 시로코 쨩."
13010-242 = "……뭐야, 그렇게 다들 몰려갈 필요는 없잖아."
13010-243 = "아하하…… 다들 호시노 선배를 좋아하니까……."
13010-246 = "호시노 선배. 회의 시작해."
13010-247 = "응응, 이제 일어날 시간이에요~☆"
13010-248 = "……어라?"
13010-255 = "호시노 선배?"
13010-261 = "깨어 있었구나?"
13010-262 = "……아아."
13010-263 = "……. 그러네……. 회의가 있었지?"
13010-264 = "미안미안. 이 아저씨 늙어가지고 자꾸 깜빡깜빡한단 말이지."
13010-265 = "으응."
13010-266 = "어라? 나이 차이 얼마 안 나잖아, 그런 태클은 없는 거야~?"
13010-267 = "자아자아~ 얼른 가자고~ 아야네 쨩 화나면 무서우니까."
13010-271 = "같이 가. 선배."
13010-275 = "……."
13010-282 = "[ns] \"그럼 다 모였네.\""
13010-283 = "네. 선생님. 그럼 모두 모였으니까, 바로 회의를 시작하겠습니다."
13010-284 = "먼저 최근 아비도스 자치구를 둘러싼 상황 중에 특이한 동향이 있어서 공유하겠습니다."
13010-285 = "특이한 동향?"
13010-286 = "무슨 일이 있었나요?"
13010-288 = "……네. 아직까지는 주의가 필요한 정도지만……."
13010-289 = "무슨 일인가요, 아야네 쨩?"
13010-290 = "먼저, 발단은 카이저 그룹입니다."
13010-292 = "모두 아시다시피, 카이저 코퍼레이션은 최근까지 아비도스 사막에서 발굴 작업을 하고 있었죠."
13010-293 = "우리는 지금까지 카이저가 거기서 무엇을 찾고 있었는지 전혀 알지 못했지만……."
13010-297 = "뭐…… 결국 그런 물건이었다는 게 밝혀졌지."
13010-298 = "산산조각이 나버렸지만요……."
13010-300 = "네. 우트나피쉬팀은 결국 성층권 위에서 파괴되었고, 그 잔해나 흔적조차도 찾아볼 수 없게 되었죠."
13010-301 = "그리고 카이저는 그 전함이 파괴된 시점에서 더 이상 아비도스 사막을 점거하고 있을 이유가 없어져 버렸던 것 같아요."
13010-302 = "카이저는 자신들이 머물고 있던 사막에서 점차적으로 퇴거를 진행, 지금 그곳은 텅 빈 폐허가 되어버렸습니다."
13010-304 = "응. 그런 일이 있었지. 발굴지에서 퇴거하는 걸 직접 확인도 했었어."
13010-305 = "맞아. 엄청 속 시원했어. 두 번 다시 아비도스에 어슬렁거리지 말라고!"
13010-306 = "그치만 그런다고 카이저에 지고 있던 아비도스의 빚이 사라진 건 아니라서……."
13010-308 = "네…… 저희 학교의 빚 자체는 카이저가 가지고 있어요. 저희의 상황이 달라진 것은 아무것도 없죠……."
13010-310 = "게다가 카이저 코퍼레이션의 프레지던트는 아비도스 사막보단 새롭게 짓는 생텀 타워에 더 관심을 가지고 있는 것 같고……."
13010-312 = "하지만 여기서부터가 본론이에요."
13010-313 = "본론……."
13010-314 = "응."
13010-315 = "무슨 일인가요, 아야네 쨩?"
13010-317 = "결론부터 말하자면, 카이저 그룹은 저희 아비도스의 빚을 채권으로 전환해서 부채시장(Debt Market)에 팔아 치우려고 하고 있어요."
13010-318 = "네? 채권으로요……?"
13010-322 = "부채시장……? 그, 그게 무슨 뜻이야?"
13010-323 = "우리에게 빚을 받을 권리를 유가 증권화해서……."
13010-324 = "……즉, 우리에게 빚을 받아낼 권리를 다른 사람들에게 팔아버리겠다는 거야."
13010-325 = "뭐?! 그럼 뭐가 어떻게 되는 거야?"
