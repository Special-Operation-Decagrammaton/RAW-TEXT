13010-340 = "……뭐, 싼값에 팔아치우겠다는 걸지도 모르겠네."
13010-341 = "그, 그럼 우리가 갚아야 하는 빚도 줄어드는 거야?"
13010-342 = "그건 아냐. 세리카 쨩. 권리를 싸게 파는 거지, 우리 빚이 줄어드는 건 아니니까……."
13010-343 = "즉, 100만 엔을 받아낼 권리를 90만 엔에 사는 것일 뿐, 우리 빚인 100만 엔은 바뀌지 않는 거야."
13010-344 = "나, 나도 이해했다고! 더 설명하지 않아도 돼, 시로코 선배!"
13010-345 = "으응……."
13010-349 = "아야네 쨩. 카이저가 우리 빚의 얼마나 채권으로 바꾼 거야? 설마 전부는 아닐 테고."
13010-350 = "네. 현재 공시된 금액으로는…… 카이저 코퍼레이션이 보유한 아비도스 부채의 약 45% 정도예요……."
