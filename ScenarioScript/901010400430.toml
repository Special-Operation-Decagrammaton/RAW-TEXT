[translation]
901010400430-6 = ""
901010400430-7 = "ถ้าจะให้สรุปเรื่องการจับปูและราคาปูที่ตรวจสอบมาจากท่าเรือวันนี้ละก็..."
901010400430-8 = "แม้ว่าราคาปูตามร้านค้าปลีกแทบไม่เปลี่ยนแปลงเท่าไร แต่ดูเหมือนว่าราคาขายส่งในพื้นที่ประมง#nจะลดลงอย่างมากเพราะจับปูกันได้เยอะขึ้น"
901010400430-9 = "ชาวประมงที่ทำงานบนเรือจับปูถึงกับต้องลดจำนวนรอบการออกเรือเลยละ"
901010400430-10 = "หืม? ฉันยังไม่ค่อยเข้าใจเท่าไร..."
901010400430-11 = "ถ้าราคาปูลดลง ก็ยิ่งต้องจับให้ได้มากขึ้นแล้วขายให้เยอะที่สุด เพื่อให้ได้เงินเพิ่มไม่ใช่เหรอ?"
901010400430-12 = "FOX 3 นี่เธอมองเห็นแค่เรื่องตรงหน้าจริงๆ เลยนะ"
901010400430-13 = ""
901010400430-15 = ""
901010400430-16 = "อาหารทะเลมีความต้องการของตลาดจำกัด แถมยังเก็บไว้ได้ไม่นาน ถ้ามีของออกมามากเกินไป ก็กลับจะยิ่งขาดทุนน่ะสิ"
901010400430-17 = "แล้วถ้าต้องลดราคาขายแบบไม่คิดหน้าคิดหลังให้ดี สุดท้ายก็อาจจะคืนทุนไม่ได้ แถมยังต้องทิ้งปูส่วนใหญ่ไปอีก"
901010400430-18 = "จ้าๆ เธอน่ะมองการณ์ไกลที่สุดเลย"
901010400430-20 = "สรุปก็คือ ช่วงนี้ราคาปูตกฮวบจนชาวประมงกำลังเดือดร้อนสินะ"
901010400430-21 = "แล้วยิ่งมีข่าวลือแง่ลบอย่างเรื่อง <ปูในถังเหล็ก> แพร่กระจายออกไป ผู้คนก็น่าจะยิ่งหลีกเลี่ยงการกินปูด้วย"
901010400430-22 = "คนที่ปล่อยข่าวลือนี้เกี่ยวข้องกับราคาปูในแง่ไหนกันนะ?"
901010400430-23 = ""
901010400430-25 = ""
901010400430-26 = ""
901010400430-29 = ""
901010400430-30 = "#Q;쿠루미;คนที่ปล่อยข่าวลือนี้เกี่ยวข้องกับราคาปูในแง่ใด?\n[as1] เป็นคนที่ได้ประโยชน์เมื่อราคาปูตกลง\n[as2] เป็นคนที่ได้ประโยชน์เมื่อราคาปูสูงขึ้น\n[as3] เป็นคนที่ไม่เกี่ยวข้องกับราคาปู"
901010400430-31 = "นั่นสิ ก่อนหน้านี้ฉันก็พูดไว้แล้วไม่ใช่เหรอ? ว่าอาจเป็นข่าวลือที่ปล่อยโดยพวกพ่อค้าที่อยากซื้อปู#nในราคาถูกก็ได้"
901010400430-32 = "ถ้าวัตถุดิบราคาถูกลง ก็อาจทำกำไรได้มากขึ้นก็จริง..."
901010400430-33 = "แต่ข่าวลือนี้ไม่ได้ทำให้แค่ราคาปูตกเท่านั้น แต่ยังทำให้ความต้องการซื้อปูลดลงด้วย ถ้างั้นในระยะยาวพวกพ่อค้าเองก็จะขาดทุนเหมือนกัน"
901010400430-34 = "อีกอย่าง ตอนนี้ชาวประมงก็ลดจำนวนรอบการออกเรือแล้ว ราคาปูก็น่าจะไม่ตกไปกว่านี้แล้วละ"
901010400430-35 = "อืม... งั้นเหรอ"
901010400430-36 = "คุณครู ลองคิดดูอีกครั้งมั้ย?"
901010400430-37 = ""
901010400430-39 = ""
901010400430-40 = ""
901010400430-43 = "ลองคิดตามนะ ข่าวลือนี้กำลังจะทำให้ราคาปูตกลงไปอีก แล้วทำไมถึงสรุปได้แบบนั้นล่ะ?"
901010400430-44 = "คุณครู... เมื่อกี้ตอนพวกเราคุยกันอยู่ คุณครูไม่ได้แอบหลับใช่มั้ย?"
901010400430-45 = "ลองคิดให้จริงจังกว่านี้แล้วค่อยตอบใหม่นะ"
901010400430-46 = ""
901010400430-48 = ""
901010400430-49 = ""
901010400430-52 = ""
901010400430-54 = ""
901010400430-55 = "เป็นคนที่ไม่เกี่ยวข้องกับราคาปู...? ทำไมล่ะ?"
901010400430-56 = "ฉันก็เห็นด้วยกับความเห็นนั้นค่ะ..."
901010400430-57 = "ในสถานการณ์ที่ราคาขายส่งของปูกำลังลดลงอย่างต่อเนื่อง การมาปล่อยข่าวลือที่อาจกระทบต่อ#nความต้องการของตลาด ย่อมหมายความว่าคนที่ปล่อยข่าวลือนั้นไม่น่าจะเกี่ยวข้องกับราคาปูค่ะ"
901010400430-58 = "มีความเป็นไปได้สูงว่าคนที่ปล่อยข่าวลือจะเป็นบุคคลที่สาม ที่ได้รับผลประโยชน์จากเรื่องที่ไม่เกี่ยวข้อง#nกับราคาปูค่ะ"
901010400430-59 = "ยิ่งสืบก็ยิ่งงงแฮะ ทั้งที่ไม่ได้ประโยชน์อะไรเป็นพิเศษ แต่กลับเที่ยวปล่อยข่าวลือเสียๆ หายๆ เกี่ยวกับปูเนี่ยนะ"
901010400430-60 = "หรือว่า... คนที่ปล่อยเรื่องตำนานเมืองนี้เป็นคนแรกจะเป็นคนที่แพ้ปู?"
901010400430-61 = "ตอนเด็กคงเคยกินอาหารที่มีเนื้อปูแล้วเกิดอาการแพ้หนัก ก็เลยผูกใจเจ็บกับการประมงและจำหน่าย#nปูไปเลย"
901010400430-62 = "นั่นดูเป็นการคาดเดาที่เกินเหตุไปหน่อยหรือเปล่า?"
