[translation]
901010400430-6 = ""
901010400430-7 = "There was a discrepancy between the crab catch volume and the expected market prices..."
901010400430-8 = "While the retail prices haven't changed much, the wholesale prices have plummeted because of a seemingly unsustainably large catch volume."
901010400430-9 = "It's reached a point where crabbers are considering cutting down on their fishing trips."
901010400430-10 = "Hm? I don't get it..."
901010400430-11 = "If the crab prices have dropped, then shouldn't they catch and sell more crabs to make a bigger profit?"
901010400430-12 = "You're so short-sighted, FOX 3."
901010400430-13 = ""
901010400430-15 = ""
901010400430-16 = "When it comes to seafood, an oversupply means LESS money. The demand is limited and the shelf life is extremely short."
901010400430-17 = "If you just sell them for cheap, you'll not only fail to break even, but you'll end up throwing away most of the crab."
901010400430-18 = "Yeah, yeah. It must be nice to be so very worldly and wise."
901010400430-20 = "The recent drop in crab prices has put fishermen in a dire financial situation."
901010400430-21 = "Additionally, the \"crabs in a drum barrel\" rumor worsens matters, making people even less likely to desire crab."
901010400430-22 = "Someone spread this rumor for a reason. But what would they have to do with crab prices?"
901010400430-23 = ""
901010400430-25 = ""
901010400430-26 = ""
901010400430-29 = ""
901010400430-30 = "#Q;쿠루미;Someone spread this rumor for a reason. But what would they have to do with crab prices?\n[as1] \"They must profit when the crab price drops.\"\n[as2] \"They must profit when the crab price spikes.\"\n[as3] \"They must be unrelated.\""
901010400430-31 = "That's what I've been saying. A store owner could spread the rumor because they want to buy crab for cheap."
901010400430-32 = "But if crab prices go down, they'd make less profit..."
901010400430-33 = "Off-putting rumors would not only drop prices, but also demand. So the store owners would ultimately take a loss."
901010400430-34 = "If fishermen are already cutting back on trips, then the prices aren't getting any lower."
901010400430-35 = "Ugh... Maybe you're right."
901010400430-36 = "Sensei, can you reconsider?"
901010400430-37 = ""
901010400430-39 = ""
901010400430-40 = ""
901010400430-43 = "...No? This rumor would only plummet prices. How did you conclude the opposite?"
901010400430-44 = "Sensei... You weren't dozing off when we were talking, were you?"
901010400430-45 = "Please take this more seriously."
901010400430-46 = ""
901010400430-48 = ""
901010400430-49 = ""
901010400430-52 = ""
901010400430-54 = ""
901010400430-55 = "Just completely unrelated...? No profit motive? Why do you think that?"
901010400430-56 = "...I agree, actually."
901010400430-57 = "We have a rumor that jeopardizes the demand for crab while wholesale prices are plummeting. That must mean that the rumor-spreaders don't care about the prices."
901010400430-58 = "They are likely a third party profiting from a source completely unrelated to crab prices."
901010400430-59 = "I'm even more confused. So, these people are just ruining the crab market for no reason?"
901010400430-60 = "Maybe they have a shellfish allergy."
901010400430-61 = "In a tragic tale, they fell deathly ill after eating a crab in their youth. And now, they've sworn to have their revenge."
901010400430-62 = "Aren't you being a little dramatic?"
