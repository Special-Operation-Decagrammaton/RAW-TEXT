[translation]
901010400430-7 = "항구에서 직접 확인한 게의 어획량과 가격에 대해 정리하자면……"
901010400430-8 = "소매점에서 판매하는 게 가격은 크게 변하지 않았지만, 산지에서는 게 어획량이 늘어서 도매가가 큰 폭으로 떨어졌나봐."
901010400430-9 = "그 때문에 게잡이 배에서 일하는 어부들은 조업 나가는 횟수를 줄여야 할 정도인가 봐."
901010400430-10 = "응? 뭔가 이해가 잘 가지 않는데……"
901010400430-11 = "게 가격이 떨어졌다면, 한 마리라도 더 잡아서 팔아야 한 푼이라도 더 이득을 볼 수 있는 거 아냐?"
901010400430-12 = "FOX 3, 너는 정말 한 치 앞 밖에 볼 줄 모르는구나."
901010400430-16 = "수산물은 수요는 한정되어 있는데 비해, 보존 기간이 짧기 때문에 매물이 많으면 오히려 손해를 본다고."
901010400430-17 = "무작정 값을 내려서 팔았다가는 본전도 못 뽑고 대부분의 게를 버리게 될 걸."
901010400430-18 = "그래, 그래. 너는 시야가 넓어서 좋겠다."
901010400430-20 = "여하튼 최근에는 게 가격이 폭락해서 어부들이 곤란해하고 있단 말이지."
901010400430-21 = "여기에 더해 <드럼통 속의 게> 같은 부정적인 소문이 퍼지면 사람들은 더욱 게를 기피하게 되겠지."
901010400430-22 = "이 소문을 낸 사람은 게의 가격과 어떤 상관이 있는 사람일까?"
901010400430-30 = "이 소문을 낸 사람은 게의 가격과 어떤 상관이 있는 사람일까?\n[as1] 게의 가격이 떨어지면 이득을 보는 사람이다.\n[as2] 게의 가격이 오르면 이득을 보는 사람이다.\n[as3] 게의 가격과는 상관없는 사람이다."
901010400430-31 = "그래. 내가 전에 말했잖아? 싸게 게를 매입하고 싶어하는 상인들이 낸 소문일지도 모른다고."
901010400430-32 = "물론 원재료가 저렴해지면 그만큼 차익을 볼 수 있겠지만……"
901010400430-33 = "이 소문은 단순히 게의 가격을 떨어트리는 것 뿐만 아니라, 수요도 떨어트리기 때문에 상인들도 장기적으로는 손해를 보게 될 거야."
901010400430-34 = "게다가 어부들이 조업 횟수를 줄이고 있으니 이 이상으로 가격이 떨어지지는 않을 거야."
901010400430-35 = "끄응…… 그런가."
901010400430-36 = "선생님, 한 번 더 고민해 볼래?"
901010400430-43 = "아니. 이 소문 때문에 가격이 더 떨어지게 생겼는데, 어째서 그런 결론에 도달한 거야?"
901010400430-44 = "선생님…… 혹시 방금 전에 우리가 말하고 있었을 때 졸고 있던 거 아니지?"
901010400430-45 = "좀 더 진지하게 고민하고 답해줘."
901010400430-55 = "게의 가격과는 상관없는 사람……? 어째서?"
901010400430-56 = "……저도 그 의견에 동의합니다."
901010400430-57 = "게의 도매가가 꾸준히 떨어지고 있는 상황에서, 수요에 영향을 끼칠 수 있는 위험을 감내하고 악소문을 냈다는 건 소문을 낸 장본인이 게의 가격과는 무관한 사람이라는 뜻이겠지요."
901010400430-58 = "소문을 낸 장본인은 게의 가격과 상관없는 곳에서 이득을 보는 제삼자일 가능성이 높습니다."
901010400430-59 = "조사할수록 더 알쏭달쏭해지는데. 특별한 이득도 보지 않으면서, 게와 관련된 나쁜 소문을 퍼트리고 다니는 사람들이라니."
901010400430-60 = "설마…… 처음 괴담을 퍼트린 사람에게는 게 알레르기가 있는 게 아닐까?"
901010400430-61 = "어릴적 게살이 들어간 음식을 먹었다가 크게 탈이 나서, 게 산업 전반에 앙심을 품게 된거지."
901010400430-62 = "아무리 그래도 그건 너무 과한 억측 아니야?"
