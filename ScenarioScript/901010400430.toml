[translation]
901010400430-6 = ""
901010400430-7 = "我整理了在港口親自確認到的螃蟹漁獲量與價格……"
901010400430-8 = "零售店販售的螃蟹價格雖然沒有明顯的變化……#n不過在產地方面似乎因為螃蟹的漁獲量增加，導致批發價出現了大幅度的下跌。"
901010400430-9 = "因此在捕蟹船上工作的漁夫們，似乎甚至得減少出海作業的次數。"
901010400430-10 = "嗯？我有點不太能理解耶……"
901010400430-11 = "如果螃蟹的價格下跌，不是應該多捕幾隻來賣才能多賺一點利潤嗎？"
901010400430-12 = "FOX3，你還真是只見樹木不見森林呢。"
901010400430-13 = ""
901010400430-15 = ""
901010400430-16 = "水產因為需求有限且保存期限較短，所以貨量太多反而會導致虧損。"
901010400430-17 = "要是一味地降價出售，最後可能連成本都賺不回來，還得把大部分的螃蟹報廢呢。"
901010400430-18 = "是是是。你見多識廣真令人羨慕啊。"
901010400430-20 = "總而言之，最近螃蟹價格暴跌，漁夫們正在為此感到為難。"
901010400430-21 = "除此之外，要是「鐵桶蟹」這種負面傳聞散播出去，人們將會更加排斥螃蟹吧。"
901010400430-22 = "散播這則傳聞的人，和螃蟹的價格有什麼關聯呢？"
901010400430-23 = ""
901010400430-25 = ""
901010400430-26 = ""
901010400430-29 = ""
901010400430-30 = "#Q;쿠루미;散播這則傳聞的人，和螃蟹的價格有什麼關聯呢？\n[as1] 螃蟹價格下跌能因此獲利的人。\n[as2] 螃蟹價格上漲能因此獲利的人。\n[as3] 與螃蟹價格無關的人。"
901010400430-31 = "沒錯，就像我之前說的。#n這可能是想低價收購螃蟹的商人們散播的傳聞。"
901010400430-32 = "原物料變便宜固然能賺取相應的差價沒錯……"
901010400430-33 = "但是這則傳聞不僅會讓螃蟹的價格下跌，還會讓需求也跟著下降……#n所以長期來看，商人們也會蒙受損失才對。"
901010400430-34 = "而且漁夫們正在減少出海作業的次數，接下來價格應該不會再繼續往下跌了。"
901010400430-35 = "唔嗯……是這樣嗎。"
901010400430-36 = "老師，要不要再仔細想想呢？"
901010400430-37 = ""
901010400430-39 = ""
901010400430-40 = ""
901010400430-43 = "不是。這則傳聞會讓價格繼續下跌，你為什麼會得出那種結論呢？"
901010400430-44 = "老師……我們剛才在報告的時候，你該不會在打瞌睡吧？"
901010400430-45 = "請你認真思考之後再回答。"
901010400430-46 = ""
901010400430-48 = ""
901010400430-49 = ""
901010400430-52 = ""
901010400430-54 = ""
901010400430-55 = "與螃蟹價格無關的人……？為什麼？"
901010400430-56 = "……我也同意老師的觀點。"
901010400430-57 = "螃蟹批發價持續下跌的情況下，還願意承擔可能影響市場需求的風險而散播傳聞……#n由此看來，當事人應該是與螃蟹價格無關的人吧。"
901010400430-58 = "散播傳聞的當事人，很有可能是在與螃蟹價格無關之處獲利的第三者。"
901010400430-59 = "越是調查反而越是難以理解呢。#n竟然會有人在沒有特別得到利益的情況下，到處散播和螃蟹有關的負面傳聞。"
901010400430-60 = "該不會……最初散播怪談的人對螃蟹過敏吧？"
901010400430-61 = "小時候吃了含有蟹肉的食物後身體嚴重不適，所以就對整個螃蟹產業懷恨在心。"
901010400430-62 = "再怎麼說，那個猜測也太過牽強了吧？"
