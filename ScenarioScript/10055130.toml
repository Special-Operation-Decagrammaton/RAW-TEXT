[translation]
10055130-1 = "後日談;來自海上的吵鬧信使"
10055130-2 = ""
10055130-3 = ""
10055130-4 = "來，來了……格黑娜學園。"
10055130-5 = ""
10055130-7 = ""
10055130-8 = "該說不愧是奇普托斯三大學園之一嗎……從建築到地板全都閃閃發亮……"
10055130-9 = ""
10055130-11 = ""
10055130-12 = ""
10055130-13 = "還，還～算是布置得挺不錯的校園啦。"
10055130-14 = "不過還是比不上奧德賽的「奧林帕斯號」就是了……"
10055130-15 = ""
10055130-17 = ""
10055130-18 = ""
10055130-19 = "……太丟臉了，還是別東張西望了吧。"
10055130-20 = "話雖如此，部長還真是愛操心呢。"
10055130-21 = "學園之間的問題明明交給島嶼處理就好了，居然還特地要我親自登門道歉……"
10055130-22 = "算了，多虧這樣才能上岸，就往好處想吧。"
10055130-23 = "跑腿本身也是很快就能辦完的簡單差事……"
10055130-24 = "說不定時間會稍～微有點餘裕，第一次來也可能在回去的路上稍～微迷個路……"
10055130-25 = "而且格黑娜的生態園區剛～好有多樣又獨特的植被，是昆蟲收藏家之間公認的勝地！"
10055130-26 = "搞不好會非常偶～然地遇見珍貴的昆蟲……哼哼哼……"
10055130-27 = "啊，現在不是想這些的時候，得趕快把差事辦完才行！"
10055130-29 = ""
10055130-30 = "那個～不好意思～"
10055130-31 = "嗯？你是……？"
10055130-32 = "我是奧德賽海洋高中派來的外交使節，名叫小森澄華。"
10055130-33 = "外，外交使節？"
10055130-34 = "啊，不用想得那麼複雜。我只是想問個路而已。"
10055130-35 = "我要見的那位是……"
10055130-36 = ""
10055130-38 = ""
10055130-39 = "……咦咦咦？這麼說來，我還不知道對方叫什麼名字耶。"
10055130-40 = "那個，格黑娜的人很多，要找一個連名字都不知道的人可能有點……"
10055130-41 = "那你知道對方有什麼特徵嗎？"
10055130-42 = "啊，這個就簡單了。是格黑娜一位地位非常高的人。"
10055130-43 = "地位很高的人啊。"
10055130-45 = ""
10055130-46 = "還有，對方有一頭令人印象深刻的銀色長髮。"
10055130-47 = "嗯？"
10055130-48 = "還有！對方非常擅長戰鬥。"
10055130-49 = "啊啊，那肯定沒錯了。"
10055130-50 = ""
10055130-52 = ""
10055130-53 = ""
10055130-54 = "那是我們的陽奈委員長，空崎陽奈委員長。"
10055130-55 = ""
10055130-56 = "原來如此～是空崎陽奈委員長啊。我會記住的。"
10055130-57 = "話說，要去哪裡才能見到他呢？"
10055130-58 = "唔嗯，這個嘛……"
10055130-59 = "我其實不太建議你在這個時期去找委員長……"
10055130-60 = "……？"
10055130-61 = "總之，我先告訴你位置吧。#n從這邊……"
10055130-68 = "欣嫩火山94-13地區．山腳"
10055130-69 = ""
10055130-70 = ""
10055130-71 = "呼……！呼……！呼……！"
10055130-72 = "好熱！好燙！我到底是在受什麼罪啊……！"
10055130-73 = "話說，這根本不是普通人一天之內能到的距離吧！？#n還好是我才辦得到……！"
10055130-74 = "沒想到我會這麼想念蔚藍的大海……"
10055130-75 = "咦，真稀奇。"
10055130-76 = ""
10055130-77 = "一般人很少會跑來這種地方的。"
10055130-78 = "你該不會是來找我們的吧？"
10055130-79 = ""
10055130-81 = ""
10055130-82 = "啊啊，終於有人了……！"
10055130-83 = "是的，我有位一定得見的人。#n是空崎陽奈委員長……"
10055130-84 = "啊啊，你是說委員長啊。#n委員長！有客人來了！"
10055130-85 = "嗯？在這種時期？"
10055130-86 = ""
10055130-88 = ""
10055130-89 = "風紀委員會的地獄夏季集訓，大家應該都知道才對。"
10055130-90 = "在這種時期還特地辛苦跑來，肯定有很重要的理由吧。"
10055130-91 = "……"
10055130-92 = "……？"
10055130-93 = "請問你是哪位？"
10055130-94 = "你剛才不是叫我嗎？#n我就是空崎陽奈。"
10055130-95 = "你不是萬魔殿的領袖嗎！？"
10055130-96 = "！？"
10055130-98 = "（之後，澄華就帶著死魚眼下山了）"
10055130-99 = "（……至於陽奈則因為被誤認成真琴而有點鬱悶）"
