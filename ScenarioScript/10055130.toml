[translation]
10055130-1 = "ย้อนวันวาน;ผู้ส่งสารจอมเอะอะแห่งท้องทะเล"
10055130-2 = ""
10055130-3 = ""
10055130-4 = "มะ... มาถึงจนได้นะคะ สถาบันเกเฮนน่า"
10055130-5 = ""
10055130-7 = ""
10055130-8 = "สมกับเป็นหนึ่งในสามโรงเรียนใหญ่แห่งคิโวทอส... ตั้งแต่ตัวอาคารไปจนถึงวัสดุปูพื้น ช่างอลังการดีจริงๆ..."
10055130-9 = ""
10055130-11 = ""
10055130-12 = ""
10055130-13 = "กะ... ก็นะ เป็นโรงเรียนที่ตกแต่งได้ดีทีเดียวเลยค่ะ"
10055130-14 = "ถึงอย่างนั้นก็ยังเทียบกับ <เรือโอลิมปัส> ของโอดิสซีย์ไม่ได้หรอกค่ะ..."
10055130-15 = ""
10055130-17 = ""
10055130-18 = ""
10055130-19 = "เดินมองนู่นนี่มากไปก็น่าอาย พอแค่นี้ดีกว่าค่ะ"
10055130-20 = "ถึงอย่างนั้น หัวหน้าก็ช่างกังวลเกินไปซะจริงๆ เลยนะคะ"
10055130-21 = "ปัญหาระหว่างโรงเรียนก็ปล่อยให้ไอแลนด์จัดการก็ได้แท้ๆ แต่กลับให้มาขอโทษถึงที่ด้วยตัวเองเนี่ยนะ..."
10055130-22 = "แต่ก็เพราะแบบนั้นพวกเราเลยได้ขึ้นฝั่งกันนะคะ มองในแง่ดีดีกว่าค่ะ"
10055130-23 = "ธุระที่ให้มาทำก็ไม่ใช่เรื่องยาก คงใช้เวลาไม่นาน..."
10055130-24 = "อาจจะเหลือเวลานิดหน่อย... แล้วก็เป็นครั้งแรกที่มาที่นี่ ตอนกลับอาจเดินหลงทางไปนู่นนี่นิดหน่อย#nก็ได้นะ..."
10055130-25 = "แล้วก็นะ! เขตธรรมชาติของเกเฮนน่ามีพืชพรรณหลากหลายไม่เหมือนใคร จนเป็นแหล่งขึ้นชื่อ#nในหมู่นักสะสมแมลงเลยละ!"
10055130-26 = "อาจจะบังเอิญ... เจอแมลงหายากเข้าก็ได้นะ ฮุฮุฮุ..."
10055130-27 = "อ๊ะ ไม่ใช่เวลาที่จะมาทำแบบนี้แล้วสิ ต้องรีบไปทำธุระให้เสร็จเร็วที่สุด!"
10055130-29 = ""
10055130-30 = "คือ~ ขอโทษนะคะ~"
10055130-31 = "หืม? เธอเป็นใครน่ะ...?"
10055130-32 = "ฉันชื่อโคโมริ สุมิกะ มาในฐานะทูตจากโรงเรียนการเดินเรือโอดิสซีย์ค่ะ"
10055130-33 = "ทะ... ทูตจากต่างโรงเรียนเหรอ?"
10055130-34 = "อ้อ ไม่ต้องคิดมากหรอกค่ะ ฉันแค่อยากถามทางก็เท่านั้นเอง"
10055130-35 = "คือว่าคนที่ฉันจะไปพบ..."
10055130-36 = ""
10055130-38 = ""
10055130-39 = "เอ๊ะ... เอ๋? จะว่าไปแล้ว ฉันไม่รู้ชื่อคนคนนั้นนี่นา..."
10055130-40 = "คือ... เกเฮนน่ามีคนเยอะ จะหาคนที่ไม่รู้แม้แต่ชื่อก็คงลำบากหน่อย..."
10055130-41 = "พอจะมีลักษณะเด่นอะไรบ้างมั้ยคะ?"
10055130-42 = "อ้อ ถ้าเรื่องนั้นละก็ง่ายเลยค่ะ เป็นคนตำแหน่งสูงมากๆ ในเกเฮนน่าค่ะ"
10055130-43 = "คนตำแหน่งสูงๆ เหรอ"
10055130-45 = ""
10055130-46 = "แล้วก็มีผมยาวสีเงินที่สะดุดตาค่ะ"
10055130-47 = "อืม?"
10055130-48 = "แล้วก็เป็นคนที่ต่อสู้เก่งมากเลยค่ะ!"
10055130-49 = "อ๋อ ถ้างั้นก็คงเป็นคนคนนั้นไม่ผิดแน่ค่ะ"
10055130-50 = ""
10055130-52 = ""
10055130-53 = ""
10055130-54 = "คงเป็นประธานฮินะของพวกเรา ท่านประธานโซระซากิ ฮินะค่ะ"
10055130-55 = ""
10055130-56 = "อ๋อ~ ท่านประธานโซระซากิ ฮินะงั้นเหรอคะ ฉันจะจำไว้ให้ขึ้นใจเลยค่ะ"
10055130-57 = "ว่าแต่ว่า ถ้าจะไปพบท่านประธานต้องไปที่ไหนเหรอคะ?"
10055130-58 = "อ่า เรื่องนั้นน่ะ..."
10055130-59 = "จริงๆ ช่วงนี้ไม่ค่อยแนะนำให้ไปพบเท่าไรนะคะ..."
10055130-60 = "...?"
10055130-61 = "เอาเป็นว่าฉันจะบอกสถานที่ให้ก็แล้วกันค่ะ เดินตรงไปทางนั้น..."
10055130-68 = "เชิงภูเขาไฟฮินนอม เขต 94-13"
10055130-69 = ""
10055130-70 = ""
10055130-71 = "แฮ่ก...! แฮ่ก...! แฮ่ก...!"
10055130-72 = "ร้อน! ร้อนจะตายอยู่แล้ว! ทำไมต้องมาลำบากมาที่แบบนี้ด้วยเนี่ย...!"
10055130-73 = "ว่าแต่ว่าระยะทางไกลขนาดนี้ คนทั่วไปไม่มีทางมาถึงภายในวันเดียวหรอกนะคะ?! ยังดีที่เป็นฉัน..."
10055130-74 = "ไม่คิดเลยว่าจะคิดถึงท้องทะเลสีครามขนาดนี้..."
10055130-75 = "เอ๊ะ มีเรื่องแปลกๆ เกิดขึ้นด้วยแฮะ"
10055130-76 = ""
10055130-77 = "นานๆ ทีถึงจะมีคนทั่วไปมาถึงที่แบบนี้นะเนี่ย"
10055130-78 = "มาตามหาพวกเรางั้นเหรอ?"
10055130-79 = ""
10055130-81 = ""
10055130-82 = "อ่า ในที่สุดก็เจอคนแล้ว...!"
10055130-83 = "ค่ะ ฉันจะต้องพบท่านประธานโซระซากิ ฮินะให้ได้น่ะค่ะ..."
10055130-84 = "อ๋อ มาหาประธานนี่เอง ประธาน! มีคนมาหาน่ะ!"
10055130-85 = "หืม? เวลาแบบนี้น่ะเหรอ?"
10055130-86 = ""
10055130-88 = ""
10055130-89 = "เรื่องค่ายฝึกฤดูร้อนนรกของคณะกรรมการวินัยทุกคนก็น่าจะรู้กันอยู่แล้วนี่"
10055130-90 = "ถ้าอุตส่าห์ลำบากมาหาถึงที่นี่ก็คงมีเหตุผลสำคัญมากสินะ"
10055130-91 = "......"
10055130-92 = "...?"
10055130-93 = "คุณเป็นใครคะ?"
10055130-94 = "เมื่อกี้เธอก็เรียกฉันเองไม่ใช่รึไง 'โซระซากิ ฮินะ' น่ะ"
10055130-95 = "ไม่ใช่ประธานของแพนเดโมเนียม โซไซตี้เหรอคะ?!"
10055130-96 = "?!"
10055130-98 = "(หลังจากนั้น สุมิกะก็เดินลงจากภูเขาด้วยแววตาเลื่อนลอย)"
10055130-99 = "(ส่วนฮินะก็ซึมนิดหน่อยที่ถูกเข้าใจผิดว่าเป็นมาโคโตะ...)"
