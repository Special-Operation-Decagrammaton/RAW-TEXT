[translation]
10055130-1 = "후일담;바다의 요란법석한 전령"
10055130-4 = "와, 와 버렸습니다. 게헨나 학원."
10055130-8 = "역시 키보토스 삼대 학원이라고 할까…… 건물부터, 무슨 바닥재까지 휘황찬란……."
10055130-13 = "뭐, 뭐~어, 제법 잘 꾸며진 캠퍼스네요."
10055130-14 = "그렇다 해도 오디세이아의 <올림푸스 호>에 비할 바는 아니지만요……."
10055130-19 = "……부끄러우니까 너무 두리번거리지는 말죠."
10055130-20 = "그렇다고는 해도, 부장님께서도 참 걱정이 많으시다니까요."
10055130-21 = "학원 간 문제는 아일랜드에 맡겨두면 될 텐데, 굳이 찾아가서 사과를 전하라니……."
10055130-22 = "뭐, 덕분에 육지에 올라왔으니까, 좋게 생각할까요."
10055130-23 = "심부름 자체는 금방 끝낼 만한 간단한 것이고……."
10055130-24 = "어쩌면 시간이 살~짝 남을 테고, 초행길이니 돌아가다 살~짝 길을 헤맬 수도 있을 테고……."
10055130-25 = "그리고 마침~! 게헨나의 비오톱은 다양하고 독특한 식생으로 곤충 수집가들 사이에서 알아주는 명소!"
10055130-26 = "아주 우~연히~! 귀중한 곤충과 마주치게 될 수도…… 후후후……."
10055130-27 = "아, 이럴 때가 아니라, 한시라도 빨리 심부름을 마쳐야겠네요!"
10055130-30 = "저~ 실례합니다~"
10055130-31 = "응? 너는……?"
10055130-32 = "저는 오디세이아 해양학원에서 외교 사절로 방문한 코모리 스미카라고 합니다."
10055130-33 = "외, 외교 사절?"
10055130-34 = "아, 너무 어렵게 생각하지 않으셔도 괜찮아요. 그저 길을 여쭙고 싶을 뿐이니까요."
10055130-35 = "제가 만나야 하는 분이……."
10055130-39 = "……어라라라? 그러고 보니, 이름을 모르는군요."
10055130-40 = "그, 게헨나에는 사람이 많아서, 이름도 모르는 사람을 찾는 것은 조금……."
10055130-41 = "혹시 특징이라도 모르시나요?"
10055130-42 = "아, 그거라면 간단합니다. 게헨나의 아주 높으신 분이거든요."
10055130-43 = "높으신 분이라."
10055130-46 = "그리고, 인상적인 긴 은발을 가지셨고."
10055130-47 = "응?"
10055130-48 = "또! 아주 싸움에 능하신 분이었답니다."
10055130-49 = "아아, 그러면 틀림없네요."
10055130-54 = "그건 저희 히나 부장, 소라사키 히나 부장님입니다."
10055130-56 = "아하~ 소라사키 히나 부장님이시군요. 명심해 두겠습니다."
10055130-57 = "그나저나, 그분은 어디로 가야 만나 뵐 수 있을까요?"
10055130-58 = "어, 그게 말이죠……."
10055130-59 = "사실 이 시기에는 만나러 가는 걸 별로 추천하지 않는데……."
10055130-60 = "……?"
10055130-61 = "일단, 위치는 알려드릴게요. 이쪽으로 가시면……."
10055130-68 = "힌놈 화산 94-13지구 산기슭"
10055130-71 = "헤엑……! 헤엑……! 헤엑……!"
10055130-72 = "더워! 뜨거워! 이게 무슨 생고생……!"
10055130-73 = "그보다, 보통 사람은, 하루만에 올 수 있는 거리조차 아니잖아요?! 저였기에 망정이지……!"
10055130-74 = "푸른 바다가 이렇게 그리워질 줄은……."
10055130-75 = "어라, 별일이 다 있네."
10055130-77 = "일반인이 이런 곳까지 오는 일은 드문데."
10055130-78 = "혹시 우리를 찾아온 거야?"
10055130-82 = "아아, 마침내, 사람이……!"
10055130-83 = "네, 꼭 만나 뵈어야 하는 분이 있어서요. 소라사키 히나 부장님이라고……."
10055130-84 = "아아, 부장 말이네. 부장! 손님이 왔는데!"
10055130-85 = "응? 이런 시기에?"
10055130-89 = "선도부의 지옥 하계 합숙에 대해서는 다들 알 텐데."
10055130-90 = "이 시기에 굳이 고생하면서 찾아왔다면 분명 대단한 이유겠지."
10055130-91 = "……."
10055130-92 = "……?"
10055130-93 = "누구세요?"
10055130-94 = "조금 전에 날 불렀잖아. 소라사키 히나라고."
10055130-95 = "만마전의 부장님이 아니라고요?!"
10055130-96 = "?!"
10055130-98 = "(그후, 스미카는 죽은 눈으로 산을 내려갔다.)"
10055130-99 = "(……그리고, 히나는 마코토로 착각 당한 것에 살짝 우울해했다.)"
