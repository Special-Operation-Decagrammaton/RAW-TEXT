10055130-1 = "Epilogue;Rowdy Herald of the Ocean"
10055130-2 = ""
10055130-3 = ""
10055130-4 = "I-I'm really here... I made it to Gehenna Academy..."
10055130-5 = ""
10055130-7 = ""
10055130-8 = "I guess that's what you'd expect from one of Kivotos's three major academies... Everything from the buildings to the tiles is dazzling..."
10055130-9 = ""
10055130-11 = ""
10055130-12 = ""
10055130-13 = "Wow, wow, wow. It's a real nice campus."
10055130-14 = "Although it still can't hold a candle to Odyssey's ship, the Olympos."
10055130-15 = ""
10055130-17 = ""
10055130-18 = ""
10055130-19 = "...This is embarrassing. I should stop looking around so much."
10055130-20 = "Still, our president is such a worrywart."
10055130-21 = "Since it had to do with another academy, Island could have just handled it. But nooo, she had to make me come all the way here to apologize!"
10055130-22 = "On the bright side, I guess I got to come ashore."
10055130-23 = "And it's not like it's a super time-consuming task."
10055130-24 = "If I get it done fast enough, maybe I can get a little lost on the way back... It'd make sense, since it's my first time here..."
10055130-25 = "And as luck would have it, Gehenna's biotope is famous among insect collectors for its diverse and unusual plant life!"
10055130-26 = "Who knows! Maybe I'll get lost and happen upon a rare insect... Fufufu..."
10055130-27 = "Eek! But that's not going to happen if I don't finish my task quickly!"
10055130-29 = ""
10055130-30 = "Um, excuse me."
10055130-31 = "Eh? Who're you?"
10055130-32 = "My name is Komori Sumika. I'm here as a diplomatic envoy from Odyssey Maritime Academy."
10055130-33 = "A diplomatic envoy?"
10055130-34 = "Oh, please do not worry. I was only hoping you could help direct me."
10055130-35 = "The person I'm looking for is..."
10055130-36 = ""
10055130-38 = ""
10055130-39 = "...Umm. Come to think of it, I don't know her name."
10055130-40 = "Gehenna's a pretty big school, girlie. You're going to have a hard time finding her without a name."
10055130-41 = "Can you describe her at all?"
10055130-42 = "Oh, that's easy. She's someone very important at Gehenna."
10055130-43 = "Someone important..."
10055130-45 = ""
10055130-46 = "And she has striking, long silver hair."
10055130-47 = "Hmm?"
10055130-48 = "Oh, and she's an incredibly strong fighter!"
10055130-49 = "Ah, there's only one person that could be."
10055130-50 = ""
10055130-52 = ""
10055130-53 = ""
10055130-54 = "That must be our Head Prefect, Sorasaki Hina."
10055130-55 = ""
10055130-56 = "I see. Head Prefect Sorasaki Hina. I'll remember that."
10055130-57 = "By the way, where should I go if I want to meet her?"
10055130-58 = "Um, well..."
10055130-59 = "Honestly, I wouldn't really recommend going to see her around this time of year..."
10055130-60 = "...?"
10055130-61 = "I'll tell you where she is, at least. If you head this way..."
10055130-68 = "Hinnom Volcano, District 94-13 Foothills"
10055130-69 = ""
10055130-70 = ""
10055130-71 = "*pant* *pant*! *gasp*!"
10055130-72 = "I'm literally being cooked! It's burning hot down here! Why do I have to go through this?!"
10055130-73 = "And if it were anyone else, they'd be burnt to a crisp by now! What if some other envoy besides me tried to come find Sorasaki Hina?!"
10055130-74 = "I never thought I'd miss the blue sea this much..."
10055130-75 = "Huh. Now that's unusual."
10055130-76 = ""
10055130-77 = "Most ordinary students don't wander this far down here."
10055130-78 = "Were you looking for us?"
10055130-79 = ""
10055130-81 = ""
10055130-82 = "Oh my gosh! Finally! I found you!"
10055130-83 = "Yes, there's someone I absolutely need to meet. Head Prefect Sorasaki Hina..."
10055130-84 = "Oh, the Head Prefect. Head Prefect! You have a visitor!"
10055130-85 = "Huh? At this time of year?"
10055130-86 = ""
10055130-88 = ""
10055130-89 = "Most people don't like to visit while the Prefect Team is conducting its summer boot camp. Something about \"severe conditions\"..."
10055130-90 = "If you went through all this trouble to come here now, you must have an important reason."
10055130-91 = "..."
