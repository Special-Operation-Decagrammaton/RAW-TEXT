[translation]
10055130-1 = "後日談その4;海の賑やかな伝令者"
10055130-4 = "き、来ちゃいました、ゲヘナ学園……。"
10055130-8 = "さすがはキヴォトス三大学園といいますか……外壁から床材までピカピカです。"
10055130-13 = "ま、まあまあ！こんなもんですよね。"
10055130-14 = "オデュッセイアの「オリュンポス号」の相手にはなりませんから！"
10055130-19 = "……恥ずかしいからあまりキョロキョロしないようにしよ。"
10055130-20 = "とはいえ、部長ってば心配性なんだから。"
10055130-21 = "学園間の問題は「アイランド」に任せればいいのに、なんでわざわざ謝罪なんか。"
10055130-22 = "まあ……おかげで陸に来れたし、いっか。"
10055130-23 = "お使いの内容自体は簡単なものだし……。"
10055130-24 = "ちょ～っと時間が余るかもしれないし～初めての場所で、道に迷うかもしれないし～……。"
10055130-25 = "ちょ～ど！ゲヘナのビオトープは独特な植生の名所で種類豊富！昆虫コレクターたちの間でも大人気の場所！"
10055130-26 = "ええ……ぐ～ぜん！貴重な昆虫とお会いできるかもしれない……ふっふっふ……。"
10055130-27 = "あっ、こうしている場合じゃない。早くお使いを終わらせましょう！"
10055130-30 = "あのー突然すみませんー。"
10055130-31 = "ん？あなたは……？"
10055130-32 = "私、オデュッセイア海洋高等学校から派遣された、外交使節の[ruby=こもり]小森[/ruby]スミカと申します。"
10055130-33 = "が、外交使節？"
10055130-34 = "ああ、そう難しい顔しなくて大丈夫です。ただ道を聞きたいだけでして。"
10055130-35 = "お会いしたい方は――"
10055130-39 = "……あれ？そういえばお名前を知らないんでした。"
10055130-40 = "えっと、ゲヘナにはいっぱい人がいるから、名前を知らないんじゃちょっと……。"
10055130-41 = "何か特徴とかはないですか？"
10055130-42 = "あ、それなら簡単です。ゲヘナのすごく偉い人なんです。"
10055130-43 = "偉い人……。"
10055130-46 = "あと、印象的な銀色の髪です。"
10055130-47 = "……ん？"
10055130-48 = "あと！すごく強い人です。"
10055130-49 = "ああ、それなら間違いありません。"
10055130-54 = "私たちの委員長、[ruby=そらさき]空崎[/ruby]ヒナさんですね。"
10055130-56 = "なるほど、空崎ヒナさん。覚えておきます。"
10055130-57 = "その方はどこに行けば会えますか？"
10055130-58 = "あ、ええっと……。"
10055130-59 = "実はこの時期は、あまり会うのはオススメしないというか……。"
10055130-60 = "……？"
10055130-61 = "一応場所は言っておきますね。ここから――"
10055130-68 = "ヒノム火山94-13地区・麓"
10055130-71 = "ぜぇ……ぜぇ……ぜぇ……！"
10055130-72 = "暑い！熱い！！なんで私がこんな……！！"
10055130-73 = "というか常人はこんなとこ1日で来れませんよ！？私だからできたワケで……！"
10055130-74 = "青い海がこんなにも恋しくなるなんて……。"
10055130-75 = "あれ？珍しいな。"
10055130-77 = "一般人がこんなとこまで来るなんて、そうそうないぞ。"
10055130-78 = "もしかして私たちに用？"
10055130-82 = "ああ、やっと人が……！"
10055130-83 = "はい、ぜひお会いしたい方がいまして。空崎ヒナさん、という人で……。"
10055130-84 = "ああ、委員長？委員長、お客さんだよ。"
10055130-85 = "ん？この時期に？"
10055130-89 = "風紀委員の夏の合宿訓練……それなりに有名だと思ってたけど。"
10055130-90 = "それでもってことは、きっと急用なんでしょうね。"
10055130-91 = "……。"
10055130-92 = "……。"
10055130-93 = "どちらさまで？"
10055130-94 = "……？私を呼んだのでしょう？空崎ヒナよ。"
10055130-95 = "万魔殿の、トップじゃ……ない！？"
10055130-96 = "！？"
10055130-98 = "（そしてスミカは白目で下山したのであった）"
10055130-99 = "（一方……マコトと間違われ、憂鬱なヒナだった）"
