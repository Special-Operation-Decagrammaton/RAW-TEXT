[translation]
1001020-1 = "유비무환?"
1001020-2 = "아비도스 자치구 거리"
1001020-3 = "(행정 처리 문제로 아비도스 고등학교에 방문하게 되었다.)"
1001020-11 = "선생님? 여긴 무슨 일이야?"
1001020-12 = "아…… 학교에 갈 일이 있어?"
1001020-13 = "음. 그렇구나. 나도 학교로 가는 중이었어."
1001020-14 = "그런데 여기에는 무슨 일이냐고?"
1001020-15 = "음……"
1001020-16 = "……"
1001020-17 = "우연이야."
1001020-18 = "……"
1001020-19 = "……우연이야."
1001020-20 = "[s] \"그러면…… 학교까지 같이 갈까?\""
1001020-21 = "응……"
1001020-26 = "[ns] \"뭔가, 예전 일이 생각나네.\""
1001020-27 = "예전 일?"
1001020-28 = "아…… 선생님이 쓰러져 있었을 때?"
1001020-29 = "[s] \"시로코 덕분에 살았었지……\""
1001020-30 = "음, 그건……"
1001020-31 = "아니야. 선생님이 그렇게 생각해 준다면……"
1001020-32 = "그것 말고도 신세를 많이 졌다고?"
1001020-33 = "그건…… 어떻게 생각해야 할지 모르겠네."
1001020-34 = "나는 선생님이 있어 주는 것만으로도……"
1001020-35 = "음…… 아니, 아니야."
1001020-36 = "자전거가 있는데 걸어가게 해서 미안하다고?"
1001020-37 = "음…… 별로 신경 쓰이지 않는데."
1001020-38 = "그렇게 무거운 자전거도 아니고. 이 정도는……"
1001020-39 = "(시로코와 함께 이런저런 이야기를 하며 학교를 향해 걸었다.)"
1001020-47 = "[ns1] \"어라, 시로코?\"\n[ns2] \"뭔가가…… 이쪽으로 오고 있는데?!\""
1001020-50 = "응? 아……"
1001020-51 = "괜찮아. 선생님. 내 드론이야."
1001020-55 = "(시로코가 익숙한 솜씨로 드론을 회수해 가방에 넣었다.)"
1001020-56 = "[s] \"드론이 있었구나……\""
1001020-57 = "응…… 우연히 가지게 되어서. 조금 개조를……"
1001020-58 = "[s] \"……우연히?\""
1001020-59 = "음. 우연히."
1001020-60 = "응? 왜 그런 눈으로 보는 거야?"
1001020-61 = "[s3] \"아무것도 아니야……\"\n[s4] \"시로코를 믿을게……\""
1001020-64 = "드론의 용도가 뭐냐고?"
1001020-65 = "음…… 라이딩 할 때 GPS를 포착하거나, 촬영하는 용도로 쓰고 있어."
1001020-66 = "[s] \"그런 거라면야 문제는 없겠지.\""
1001020-68 = "그-러-니-까. 잠깐 여기 들러 주기만 하면 된다니까?"
1001020-69 = "하는 김에 돈도 좀 써 주면 좋고. 크케케케."
1001020-70 = "으어어엉…… 하지만 더 이상 돈이 없는 걸요……!"
1001020-71 = "웃기지 마! 마른걸레도 쥐어짜면 물이 나오는 법이라고!"
1001020-72 = "으어어엉…… 이번은 제발 봐주세요……"
1001020-74 = "……음."
1001020-80 = "(시로코가 갑자기 드론을 작동시켰다.)"
1001020-84 = "앗, 따가! 앗, 따가! 뭐야, 이건!"
1001020-85 = "미, 미사일? 어디에서 날아오는 거지?!"
1001020-86 = "도, 도망치자!"
1001020-91 = "[ns] \"촬영용 드론이라고 하지 않으셨나요, 시로코 씨?!\""
1001020-92 = "음…… 그건……"
1001020-93 = "만일의 사태에 대비해서…… 미사일도 쏠 수 있도록……"
1001020-94 = "[s] \"자그마하게 붙인 추가 기능일 뿐이라고?!\""
1001020-95 = "……응."
1001020-97 = "그렇게 대단한 일도 아니라니까? 당신, 속고만 살았어?"
1001020-98 = "그래! 잠깐 와서 이 각서에 사인만 좀 해 주면 되는 일이라고!"
1001020-99 = "하, 하지만 각서라는 건……"
1001020-100 = "……!"
1001020-105 = "우와아아앗?! 미사일이다?!"
1001020-106 = "누, 누군지는 모르지만 두고 보자!"
1001020-108 = "그러니까, 잠깐 엔진만 좀 빌리겠다는 거라고. 분명히 돌려준다니까?"
1001020-109 = "물론 그 엔진이 원래대로의 상태일지는…… 우리도 모르겠지만. 하하하하!"
1001020-110 = "음!"
1001020-116 = "미, 미사일 폭격이다!"
1001020-117 = "우리 머신이 다 망가지겠어! 도망쳐!"
1001020-119 = "[ns] \"……촬영용 드론 맞지?\""
1001020-120 = "……응. 미사일은…… 부가 기능이고. 일종의 방호 모드니까……"
1001020-121 = "[s] \"……부가 기능을 쓸 일이…… 참 많네.\""
1001020-122 = "……응."
1001020-123 = "[s5] \"있잖아, 시로코.\"\n[s6] \"드론을…… 마구잡이로 사용하지는 않을 거지?\""
1001020-126 = "응…… 아무 때나 방호 모드를 작동시키는 건 아니야……"
1001020-127 = "무엇보다 방호 모드를 추가한 이유는……"
1001020-131 = "은행을 털 때, 만에 하나 있을지 모를 충돌 사태를 대비하기 위해서니까."
1001020-135 = "[ns] \"더더욱 안 됩니다!\""
