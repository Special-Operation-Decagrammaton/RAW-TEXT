[translation]
1009503-1 = "현장학습 시간이에요, 선생님."
1009503-2 = "(약속 시간보다 15분 정도 일찍 도착했다.)"
1009503-3 = "(그렇게 미도리를 기다리고 있으려니…….)"
1009503-7 = "안녕하세요, 선생님!"
1009503-11 = "[ns] \"미도리? 여기서까지 메이드복인 거야?!\""
1009503-12 = "와! 선생님께서 이번에는 놀라 주셨어요!"
1009503-13 = "[s] \"포인트가 거기냐!\""
1009503-14 = "그렇지만 선생님. 이건 당연한 거예요."
1009503-15 = "지금의 저는, 선생님만의 메이드잖아요?"
1009503-16 = "[s] \"그 설정, 이어지고 있는 거였나…….\""
1009503-17 = "물론이죠."
1009503-18 = "[s] \"너무 상큼한 대답에 할 말을 잃을 것 같아!\""
1009503-19 = "어쨌든 저는 선생님만의 메이드이고."
1009503-20 = "고용인의 외출을 수행해야 하는 입장이에요."
1009503-21 = "따라서 그에 어울리는 복장을 하고 오는 것은, 아주 자연스러운 일이라고 할 수 있겠죠."
1009503-22 = "선생님께서도 그렇게 생각하지 않으세요?"
1009503-23 = "[s] \"나는 이제 아무것도 모르겠어…….\""
1009503-24 = "아, 부정하지는 않으시는군요! 동의하신 것으로 알아도 되는 거죠?"
1009503-25 = "그리고…… 그러니까 말이죠……."
1009503-26 = "선생님께서도, 드레스 코드를 맞춰 보면 좋을 것 같다고 생각했어요!"
1009503-27 = "이거야말로 우수한 메이드의 준비성이라고 할 수 있지 않을까요?"
1009503-28 = "[s] \"점점 이야기가 먼 곳으로 가고 있는 것 같은데?!\""
1009503-29 = "괜찮아요. 저만 믿으세요!"
1009503-33 = "아무튼 그런 이유로 선생님께서는 옷을 갈아입어 주셨으면 해요!"
1009503-34 = "자, 자. 여러 가지 가져왔어요. 프록코트와 실크햇 그리고 지팡이도 있고."
1009503-35 = "버슬 드레스와 깃털 모자, 그리고 양산도 있으니까요!"
1009503-36 = "악세서리가 부족하다면 모노클과 장식용 부채를 비롯해서 정말 많은 것이 준비되어 있답니다?"
1009503-37 = "걱정하지 마시고, 저에게 모든 걸 맡겨 주세요!"
1009503-38 = "[s1] \"어째서인지 커다란 캐리어를 가지고 있더라니!\"\n[s2] \"캐리어의 용도는 그것이었던 건가!\""
1009503-41 = "그럼요. 당연하죠!"
1009503-42 = "자, 어서 갈아입어 보세요. 선생님을 수행하게 해 주세요!"
1009503-43 = "무엇보다 모실 만한 주인을 모시는 것은 메이드의 보람인걸요."
1009503-44 = "저, 선생님이 멋진 옷을 입는 걸 보고 싶어요!"
1009503-45 = "메이드이자 일러스트레이터로서의 보람이 될 거예요!"
1009503-46 = "[s3] \"그런데 말이지…… 일단, 우선.\"\n[s4] \"이 옷들, 치수는 맞는 거야?\""
1009503-49 = "그건 걱정하지 않으셔도 될 거예요."
1009503-50 = "이미 밀레니엄의 여러 곳에서 전문적인 협찬과 조언을 받았거든요."
1009503-51 = "꼭 사진을 남겨서, 공유해 달라고 부탁도 받았어요."
1009503-52 = "그러니까, 선생님?"
1009503-60 = "어서요……?"
1009503-62 = "(간신히 미도리를 말릴 수 있었지만, 미도리가 조금 토라지려고 해서 달래는데 고생했다.)"
1009503-63 = "(캐리어를 보관소에 맡긴 뒤, 마침내 미술관으로 향했다…….)"
1009503-73 = "대단하네요……. 전시관도 복도도 컨셉에 맞춰 구성해 놓은 것 같아요."
1009503-74 = "정말, 여러 가지로 엄청나네요."
1009503-75 = "여기 좀 보세요. 선생님. 드레스의 넉넉한 품과 잘록하게 들어간 허리가 참 대조적이에요."
1009503-76 = "저 허리를 유지하거나 만들어내려고, 아주 강력한 보정용 옷을 입었다는데……."
1009503-77 = "상상만 해도 정신이 아찔해지는 것 같네요……."
1009503-78 = "그리고 또 생각해 보면 말이죠? 저런 옷을 혼자서 입을 수는 없었을 거란 말이에요?"
1009503-79 = "제가 알고 있는 게 맞다면, 옷을 한 번 제대로 입는 데에도."
1009503-80 = "도와줄 사람이 서너 명은 필요했다고 하던데요……."
1009503-81 = "[s] \"패션이란, 뭘까…….\""
1009503-82 = "모든 것이죠!"
1009503-83 = "[s] \"그 정도야?!\""
1009503-84 = "……생각해 보면 그 정도까지는 아닐지도 모르겠네요……."
1009503-85 = "그, 그렇지만 의식주라고 하잖아요? 그러니까 패션이란, 사람들이 생각하는 것보다도 더욱, 상당히, 중요한 것이지 않을까요?"
1009503-86 = "맞아요! 일러스트레이터인 저에게는 특히 더 그래요."
1009503-87 = "사람이 어떤 옷을 입느냐는 것은, 자신을 어떤 식으로 드러내려는지와도 연관이 있는 거니까요."
1009503-88 = "그런 의미에서, 선생님도 좀 더 패션에 신경을 쓰셔야 한다고 저는 생각합니다!"
1009503-89 = "[s] \"그 충고는 생각해 볼게……?\""
1009503-90 = "생각해 보겠다, 정도가 아니에요. 선생님! 이건 정말로 중요한 문제라구요!"
1009503-91 = "안 되겠어요. 지금이라도 당장 캐리어를 되찾아서 옷을 갈아입고 오는 게 어떨까요?"
1009503-92 = "[s] \"진정하자, 미도리. 응?\""
1009503-93 = "역시 안 되나요? 어떻게 해도요?"
1009503-94 = "네? 지금 나갔다 들어오면, 결국 입장표를 두 번 사야 하는 결과가 될 거라구요?"
1009503-95 = "그 말씀을 듣고 보니, 그렇겠네요……."
1009503-99 = "그러고보니 고전 복식들의 형식이나 디자인이……."
1009503-100 = "미묘하게 메이드 복장과 비슷한 듯, 다른 듯 한 부분이 있는 것 같네요."
1009503-101 = "가령 여기의 보닛이라든가 스커트형 드레스, 리본 같은 것 말이죠."
1009503-102 = "[s] \"확실히, 그 말을 듣고 보니 그런 것 같네.\""
1009503-103 = "좀 더 여기저기 둘러봐요. 선생님."
1009503-104 = "여기에서라면 저, 뭔가 영감을 좀 더 받을 수 있을 것 같아요!"
1009503-113 = "(미도리에게 끌려, 결국 전시장을 전부 순회했다.)"
1009503-114 = "(관람을 마치자, 어느덧 저녁이 되어 있었다.)"
1009503-117 = "오늘, 감사했어요. 선생님. 이런 전시회도 소개해 주시고."
1009503-118 = "무엇보다 오늘의……"
1009503-119 = "데이트…… 무척 즐거웠어요."
1009503-120 = "[ns] \"어? 마지막 말은 잘 못 들었어.\""
1009503-124 = "괘, 괜찮아요. 아무것도 아니에요!"
1009503-125 = "그, 그런 것보다, 어서 돌아가죠! 제가 마지막까지 잘 수행해 드릴게요!"
1009503-126 = "[s] \"응. 고마워.\""
1009503-130 = "그런데, 선생님."
1009503-137 = "역시, 한 번만 옷 입어 주시면 안 될까요……?"
1009503-138 = "[s] \"봐주라…….\""
1009503-139 = "선생니임~"
1009503-141 = "(유난히 가깝게 달라붙는 미도리와 함께, 늦은 저녁 길을 무사히 돌아왔다…….)"
