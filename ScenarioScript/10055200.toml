[translation]
10055200-1 = "MSDC：如泡沫般消逝的白日夢鬥士"
10055200-2 = ""
10055200-3 = "夏萊的老師。"
10055200-4 = "沒錯，是我。前凱薩PMC的董事。前章魚銀行的職員。"
10055200-5 = "……現在什麼都不是，就只是我而已。"
10055200-6 = "不過如果老師還願意稱呼我為凱薩PMC董事，#n那麼至少在此刻，我就會是那樣的存在。"
10055200-7 = "畢竟這個世界的本質，是由老師決定的。"
10055200-8 = "我想你差不多也察覺到了。"
10055200-9 = "這只不過是一場白日夢──如同浮上海面的泡沫般消逝的故事。"
10055200-10 = "……沒錯，就像我的處境一樣。"
10055200-11 = "我曾身為凱薩集團這家大企業的董事，將財富與權力握在手中……"
10055200-12 = "但如今全都如泡沫般消失了。"
10055200-13 = "明白嗎？世間萬物就是如此毫無意義、虛幻無常。"
10055200-14 = "……抱歉，我又在自怨自艾了。"
10055200-15 = "接下來你要面對的對手，是毫無邏輯的夢境巔峰，也是龐大惡夢的集合體。"
10055200-16 = "牠的名字是Megaton Super Dangerous Crab，簡稱MSDC。"
10055200-17 = "……老師啊。這是酷暑帶來的一場春日之夢。#n一旦過去就再也不會回來。"
10055200-18 = "換作是你，會在這裡找到什麼樣的價值？"
