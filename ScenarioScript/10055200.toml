[translation]
10055200-1 = "เมซูเดค นักรบฝันกลางวันที่จะแตกสลายดั่งฟองคลื่น"
10055200-2 = ""
10055200-3 = "ครูจากชาเล่ต์"
10055200-4 = "ใช่แล้ว ฉันเอง อดีตกรรมการไคเซอร์ PMC อดีตพนักงานขายภาคสนามของธนาคารทาโกะไงล่ะ"
10055200-5 = "ถึงตอนนี้ฉันจะไม่ได้มีตำแหน่งอะไร"
10055200-6 = "แต่ถ้าครูยังเรียกฉันว่ากรรมการไคเซอร์ PMC อย่างน้อยฉันก็จะยังเป็นอย่างนั้นอยู่"
10055200-7 = "เพราะในโลกนี้ ครูคือผู้กำหนดแก่นแท้ของทุกสิ่งตั้งแต่แรกอยู่แล้วไงล่ะ"
10055200-8 = "คงเริ่มสังเกตเห็นแล้วสินะ"
10055200-9 = "นี่เป็นเพียงฝันกลางวันเรื่องหนึ่ง... เป็นแค่เรื่องราวที่จะเลือนหายไปเหมือนฟองคลื่นที่ลอยขึ้นมา#nบนผิวน้ำทะเล"
10055200-10 = "ใช่... เหมือนสภาพของฉันนี่แหละ"
10055200-11 = "ครั้งหนึ่งฉันเคยเป็นกรรมการของบริษัทยักษ์ใหญ่อย่างไคเซอร์กรุ๊ป มีทั้งความมั่งคั่ง มีทั้งอำนาจอยู่ในมือ..."
10055200-12 = "แต่แล้วทุกอย่างก็หายไปเหมือนฟองคลื่น"
10055200-13 = "เข้าใจหรือยัง? ทุกสิ่งในโลกช่างไร้ความหมายและว่างเปล่าเช่นนี้เอง"
10055200-14 = "เอาเถอะ ฉันดันเผลอคร่ำครวญถึงชีวิตตัวเองไปอีกแล้ว"
10055200-15 = "คู่ต่อสู้ที่คุณจะเผชิญต่อจากนี้ คือจุดสูงสุดของความฝันอันไร้เหตุผล เป็นศูนย์รวมของฝันร้ายอันยิ่งใหญ่"
10055200-16 = "ชื่อของมันคือ เมกะตัน ซูเปอร์ เดนเจอรัส แคร็บ หรือเรียกสั้นๆ ว่าเมซูเดคไงล่ะ"
10055200-17 = "คุณครูเอ๋ย... นี่เป็นเพียงฝันชั่วครู่ที่เกิดจากความร้อนอบอ้าว เมื่อปล่อยให้ผ่านไปแล้ว ก็คงไม่หวนกลับมาให้นึกถึงอีก"
10055200-18 = "แต่ถ้าเป็นคุณละก็ จะค้นพบคุณค่าอะไรจากที่นี่กันได้บ้างนะ?"
