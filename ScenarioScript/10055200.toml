[translation]
10055200-1 = "#title;메슈데크, 물거품처럼 꺼질 백일몽의 투사"
10055200-2 = "3;카이저 이사(?);01\n#3;a\n#wait;1500"
10055200-3 = "3;카이저 이사(?);01;샬레의 선생."
10055200-4 = "3;카이저 이사(?);01;그래, 나다. 전 카이저 PMC의 이사. 전 문어 은행의 현장 영업사원.\n#3;em;[...]"
10055200-5 = "3;카이저 이사(?);01;……지금은 아무것도 아닌, 그저 나다."
10055200-6 = "3;카이저 이사(?);01;그래도 아직 선생이 날 카이저 PMC 이사라 불러준다면, 지금 이 순간만큼은 그렇게 되겠다."
10055200-7 = "3;카이저 이사(?);01;애초에 이 세계에서 본질은 선생이 결정하는 것이니 말이야.\n#3;em;[반응]"
10055200-8 = "3;카이저 이사(?);01;슬슬 눈치챘으리라 본다만."
10055200-9 = "3;카이저 이사(?);01;이것은 그저 하나의 백일몽─── 해수면에 오른 물거품처럼 사라질 뿐인 그런 이야기."
10055200-10 = "3;카이저 이사(?);01;……그래, 마치 이 내 신세 같지."
10055200-11 = "3;카이저 이사(?);01;한때 카이저 그룹이라는 대기업의 이사로서, 부와 권력을 모두 쥐었다만……."
10055200-12 = "3;카이저 이사(?);01;전부 물거품처럼 사라지고 말았지.\n#3;em;[한숨]"
10055200-13 = "3;카이저 이사(?);01;알겠나? 세상만사가 이처럼 무의미하고 허망한 것이다."
10055200-14 = "3;카이저 이사(?);01;아니, 또 신세 한탄을 하고 말았군.\n#3;greeting"
10055200-15 = "3;카이저 이사(?);01;지금부터 그대가 만날 상대는, 개연성 없는 꿈의 절정. 거대한 악몽의 총체."
10055200-16 = "3;카이저 이사(?);01;그 이름은, 메가톤 슈퍼 데인저러스 크랩. 줄여서 메슈데크."
10055200-17 = "3;카이저 이사(?);01;……선생이여. 이것은 무더위가 보여주는 일장춘몽. 한 번 흘려보내고는, 두 번 다시 되돌아볼 일 없겠지.\n#3;em;[...]"
10055200-18 = "3;카이저 이사(?);01;자네라면 여기서 어떤 가치를 찾아내겠나?"
