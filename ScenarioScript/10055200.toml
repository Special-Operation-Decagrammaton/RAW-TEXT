[translation]
10055200-1 = "Megasuperkrab, Daydreams Fade Like Foam"
10055200-2 = ""
10055200-3 = "Schale's Sensei."
10055200-4 = "Yes, it's me. Former Director of Kaiser PMC. Former field sales representative for Octopus Bank."
10055200-5 = "...Now, I am nothing. Simply myself."
10055200-6 = "But if you still call me the Director, Sensei, then for this moment, that is what I shall be."
10055200-7 = "After all, in this world, it is YOU who determines the essence of things."
10055200-8 = "I imagine you've begun to realize that by now."
10055200-9 = "This is nothing more than a daydream. A story that will simply vanish, like a bubble reaching the surface of the sea."
10055200-10 = "...Yes. Much like my own fate."
10055200-11 = "Once, as Director of the great Kaiser Group, I held wealth and power in my hands..."
10055200-12 = "And now, nothing. Foam on the waves, washed away."
10055200-13 = "Do you understand? Everything in this world is just as meaningless and fleeting."
10055200-14 = "Ah, but there I go, lamenting my lot in life again."
10055200-15 = "The foe you are about to face is the culmination of an impossible dream. The embodiment of a vast nightmare."
10055200-16 = "It is called the Megaton Super Dangerous Crab. Megasuperkrab, for short."
10055200-17 = "...Listen, Sensei. This is but a fleeting dream conjured by the summer heat. Once it passes, there will be no reason to look back upon it, not ever."
10055200-18 = "What value do you find in such a place?"
