[translation]
10055200-1 = "메슈데크, 물거품처럼 꺼질 백일몽의 투사"
10055200-3 = "샬레의 선생."
10055200-4 = "그래, 나다. 전 카이저 PMC의 이사. 전 문어 은행의 현장 영업사원."
10055200-5 = "……지금은 아무것도 아닌, 그저 나다."
10055200-6 = "그래도 아직 선생이 날 카이저 PMC 이사라 불러준다면, 지금 이 순간만큼은 그렇게 되겠다."
10055200-7 = "애초에 이 세계에서 본질은 선생이 결정하는 것이니 말이야."
10055200-8 = "슬슬 눈치챘으리라 본다만."
10055200-9 = "이것은 그저 하나의 백일몽─── 해수면에 오른 물거품처럼 사라질 뿐인 그런 이야기."
10055200-10 = "……그래, 마치 이 내 신세 같지."
10055200-11 = "한때 카이저 그룹이라는 대기업의 이사로서, 부와 권력을 모두 쥐었다만……."
10055200-12 = "전부 물거품처럼 사라지고 말았지."
10055200-13 = "알겠나? 세상만사가 이처럼 무의미하고 허망한 것이다."
10055200-14 = "아니, 또 신세 한탄을 하고 말았군."
10055200-15 = "지금부터 그대가 만날 상대는, 개연성 없는 꿈의 절정. 거대한 악몽의 총체."
10055200-16 = "그 이름은, 메가톤 슈퍼 데인저러스 크랩. 줄여서 메슈데크."
10055200-17 = "……선생이여. 이것은 무더위가 보여주는 일장춘몽. 한 번 흘려보내고는, 두 번 다시 되돌아볼 일 없겠지."
10055200-18 = "자네라면 여기서 어떤 가치를 찾아내겠나?"
