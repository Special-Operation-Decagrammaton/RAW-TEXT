[translation]
2600705-1 = "조급했던 이유"
2600705-2 = "(아야네의 부탁대로 공구상자와 나사를 들고 나섰다.)"
2600705-3 = "(그리 멀지도 않았고, 다 같이 추락했던 지점이라 위치도 기억하고 있었다.)"
2600705-8 = "(………….)"
2600705-9 = "(분명 작업 중일 텐데, 아무 소리도 들리지 않는다.)"
2600705-13 = "[ns] \"……아야네?\""
2600705-14 = "…………으……."
2600705-15 = "……으으……."
2600705-16 = "[ns] \"……아야네!?\""
2600705-24 = "죄송합니다, 선생님……. 설마 불러 놓고 제가 기절할 줄은……."
2600705-25 = "하긴 생각해 보면 당연한 일이겠네요. 휴양지라고는 해도 더운 여름날인데……."
2600705-26 = "헬기도 금속 재질이라 복사열도 심하고, 뙤약볕에 계속 작업하면……. 왜 진작 그 생각을 못 했는지……."
2600705-27 = "죄송합니다……."
2600705-28 = "[s1] \"이런 날 밖에서 혼자 작업하면 안 돼.\"\n[s2] \"컨디션 관리, 조심해야지.\""
2600705-29 = "네에……."
2600705-30 = "네에……."
2600705-31 = "……음?"
2600705-32 = "그러고 보니 선생님, 손에 드신 그건……."
2600705-33 = "아아. 그랬었죠. 제가 부탁드린 나사들이랑……."
2600705-34 = "감사합니다, 선생님. 이제 괜찮아요. 이리 주시면 제가 마저 끝낼게요."
2600705-35 = "……네?"
2600705-36 = "선생님도 같이하시겠다고요? 헬기 수리를……?"
2600705-37 = "굳이 안 그래 주셔도 되는데……. 이 정도는 혼자……."
2600705-38 = "아, 아니면 오늘은 여기까지만 할까요? 그냥 돌아가서 좀 쉬고……."
2600705-39 = "……네?"
2600705-40 = "그게 아니라 저 대신이요……?"
2600705-41 = "그, 그건 좀……. 가지고 와 주신 것만 해도 감사한데 굳이 작업까지……."
2600705-45 = "……뭔가 거절하면 안 될 거 같은 분위기네요."
2600705-46 = "감사합니다."
2600705-52 = "선생님. 그럼 부탁드릴게요!"
2600705-54 = "(이후 아야네와 함께 헬기 수리를 계속해서 진행했다.)"
2600705-55 = "(하루 만에 끝날 작업은 아니었기에 저녁이 돼서도 다 끝나지 않았지만, 확실히 진전은 있어 보였다.)"
2600705-60 = "……음……. 그래도 이 정도면 꽤 진행한 거 같은데……."
2600705-61 = "확실히 좀 괜찮아진 거 같아요."
2600705-65 = "그럼 오늘은 여기까지 할까요? 선생님."
2600705-66 = "[s3] \"그럴까. 이 정도면 괜찮겠지.\"\n[s4] \"응. 확실히 나아 보이네.\""
2600705-67 = "아, 물론 보이기에는 저래도, 아직 완전 수리까지는 한참 멀었지만요. 아하하……."
2600705-68 = "아, 물론 보이기에는 저래도, 아직 완전 수리까지는 한참 멀었지만요. 아하하……."
2600705-69 = "……네?"
2600705-70 = "……헬기가 아니라 제 이야기였다고요? 그게 무슨 말씀이신지……."
2600705-71 = "[s5] \"아야네가 만족한 것 같아 보이니까.\"\n[s6] \"도중에 돌아가면 찝찝해할 거고.\""
2600705-76 = "선생님……. 역시, 뭔가 이상하다 싶었는데……."
2600705-77 = "그래서 일부러……. 굳이 좀 더 하고 가자고 하신 거군요."
2600705-78 = "어쩐지 뭔가 폐를 끼치면 안 된다고 늘 생각하는데, 오히려 그런 부분까지도 배려받는 느낌이네요."
2600705-79 = "늘 마지막엔 감사하면서도 이래도 괜찮은 건가 싶고……."
2600705-80 = "……네? 괜찮다고요? ……선생님이니까?"
2600705-81 = "……하하."
2600705-82 = "선생님. ……그 말씀 너무 자주 하신다고 생각하지 않으세요?"
2600705-83 = "……그래도 감사합니다. 말씀대로, 오늘은 돌아가서도 속이 좀 편하겠어요."
2600705-84 = "그리고 또……."
2600705-85 = "네……? 잠시 옆에 서 보라고요? 어째서……."
2600705-86 = "……기념사진?"
2600705-87 = "무, 무슨……! 괘, 괜찮아요! 사진이라니, 그런……!"
2600705-88 = "[s7] \"기분을 내는 것도 중요해.\"\n[s8] \"사진 한번 없이 수리만 하다 가려고?\""
2600705-89 = "어……. 그, 그런 건……. 음……."
2600705-90 = "어……. 그, 그런 건……. 음……."
2600705-94 = "후후……. 네."
2600705-100 = "그렇게 말씀하신다면 어쩔 수 없네요."
2600705-103 = "[wa:4000]― 으음, [wa:1450]저는 여기"
2600705-105 = "― 옆에서 찍히면 [wa:1450]될까요……?"
2600705-108 = "[wa:100]― 이런 식으로……. [wa:1100]괜찮아 보이나요?"
2600705-111 = "[wa:1000]― 어, [wa:650]어떻게 해야 [wa:500]헬기가 잘 보일까요……?"
2600705-114 = "― 죄송합니다,"
2600705-116 = "― 이런 건 [wa:850]익숙하지 않아서……."
2600705-119 = "[wa:1200]― 저기…… [wa:1550]선생님?"
2600705-121 = "― 수리 [wa:500]기념사진이라면……. [wa:50]"
2600705-124 = "― 좀 더 [wa:650]헬기를 중심으로 [wa:800]찍는 편이 좋지 않을까요……?"
2600705-127 = "[wa:200]― ……예? [wa:900]헬기가 아니라, [wa:1550]제 기념 사진이요…?"
2600705-130 = "― 그, [wa:650]그랬던 건가요!? [wa:1450]으에에!?"
2600705-133 = "[wa:950]― 그, [wa:500]그건 좀……. [wa:1350]아니, [wa:800]싫다는 건 아니지만……!"
2600705-136 = "[wa:500]― 왠지 갑자기, [wa:1300]얼굴이 뜨거워지는데요……."
2600705-139 = "뭔가 사진 한 장 찍는데 시간을 한참 들였네요……."
2600705-140 = "감사합니다, 선생님. 오늘은 여러모로 운이 좋은 날인가 봐요."
2600705-141 = "……대신이라고 하긴 뭐하지만 그만큼 이 헬기, 선생님을 위해서도 많이 쓸 테니까요!"
2600705-142 = "필요하실 땐 언제든 불러만 주세요! 바로 날아가겠습니다!"
2600705-143 = "[s9] \"헬기를 그렇게 자주 띄울 수 있는 거야?\"\n[s10] \"괜찮겠어? 연료도 만만치 않을 텐데…….\""
2600705-148 = "……어……."
2600705-149 = "……어라. 듣고 보니……."
2600705-150 = "아……아하하……. 아하하하……."
2600705-151 = "……음……."
2600705-153 = "너, 너무 자주는 안 돼요……."
