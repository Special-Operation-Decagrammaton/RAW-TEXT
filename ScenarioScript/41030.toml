[translation]
41030-1 = "제3화;그 소대원들의 사정"
41030-3 = "취조 기록 : 977-R-1"
41030-5 = "담당 취조관 : 발키리 경찰학교 3학년, 오가타 칸나"
41030-7 = "조사 용의자 : SRT 특수학원 1학년, 소라이 사키"
41030-12 = "발키리 경찰학교 본관, 지하 취조실"
41030-14 = "……이름."
41030-15 = "……."
41030-16 = "이름!"
41030-17 = "어째서 물어보는 거야? 이름 정도는 묻지 않아도 이미 알고 있을 텐데."
41030-18 = "귀관에게 질문은 허가하지 않았다."
41030-19 = "다시 한번 묻지. 이름은?"
41030-20 = "……소라이 사키."
41030-21 = "소속은?"
41030-22 = "SRT 특수학원 RABBIT 소대 소속이었지. 당신들이 멋대로 폐쇄 결정을 내리기 전까지는."
41030-23 = "……말투가 불손하군. 지금 네 처지를 이해하고 있는 건지 의심스러운데."
41030-24 = "계속 그렇게 아니꼬운 말투로 대답을 이어간다면, 내가 왜 발키리 경찰학교의 '미친개' 라 불리는지 직접 두 눈으로 확인하게 될 거야."
41030-25 = "하아, 지금 협박하는 거야? SRT에게 그런 블러핑이 먹힐 거라 생각했다니…… 어쩐지 조금 실망스럽네."
41030-26 = "익히 알고 있겠지만. SRT 학원의 학생들은 작전 중 기밀을 취급하는 경우도 적지 않기 때문에 포로로 잡혔을 때를 대비한 훈련도 사전에 철저히 받지."
41030-27 = "당신이 알고 있는 심문 방법을 모두 사용하더라도 별 소득은 없을 거야."
41030-31 = "학생회로부터 넘겨받은 자료를 보니, 귀관은 SRT 학원에서도 꾸준히 우수한 성적을 거두어 온 재원이더군."
41030-32 = "필기 시험 점수는 만점에 가깝고, 모의 환경에서 시행한 실기 시험도 무난히 통과."
41030-33 = "학업 생활 중에도 사소한 교칙 위반 하나 저지르지 않았을 정도로 귀관은 훌륭한 모범생이었다."
41030-34 = "……그런데 그런 모범생이 어째서 발키리 경찰학교로 편입해 오는 걸 거부하고 무력 투쟁이라는 거친 수단을 사용한 거지?"
41030-35 = "……발키리 경찰학교는 SRT 학원이 아니니까."
41030-36 = "그건 제대로 된 대답이 아니야. 똑바로 이야기해!"
41030-37 = "SRT 특수학원의 학생들은 발키리 경찰학교의 학생들과는 달리, 방과 후에도 엄격한 규칙 아래서 일상을 보내지."
41030-38 = "정시에 기상하여 침구를 정리하고, 학교에서는 훈련을 받고, 방과 후에도 기숙사 내에서 개인 정비에 힘을 쏟는 등…… 언제나 긴장의 끈을 놓지 않는 항재전장의 의식이 SRT를 SRT답게 만드는 거야."
41030-39 = "하지만 발키리 경찰학교의 일상은 어때?"
41030-40 = "가장 규율이 엄격하다는 공안국의 학생들조차도 시민에게 위화감을 주어서는 안 된다는 이유로 일과가 끝나면 사복을 입고 자유롭게 하고 싶은 일을 하지."
41030-41 = "나는…… 목장에 방목된 양치기 [ruby=발키리] 개 [/ruby]로 살아가느니, 목줄이 매였더라도 긍지만큼은 잊지 않은 [ruby=SRT]늑대[/ruby]로 살아가겠어."
41030-42 = "……그게 귀관의 대답인가."
41030-43 = "그나저나 하나 더 묻겠는데."
41030-44 = "교전 도중 카제쿠라 양이 불필요하게 탄환을 낭비해가며 방송용 드론을 격추했을 때, 귀관은 어째서 그 행동을 말리지 않았지?"
41030-45 = "귀관 정도의 모범생이 방어전에서의 탄약이 얼마나 가치 있는 자원인지 모르지는 않았을 텐데."
41030-46 = "그것도 SRT의 규율과 관련이 있는 행동이었나?"
41030-47 = "어, 그건 그러니까……"
41030-48 = "훈련 때는 탄약을 아끼느라 한 번도 해보지 못했던 전탄 사격을 관측해 볼 기회가 있었으면 좋겠다 싶어서……."
41030-52 = "소"
41030-54 = "라"
41030-56 = "이"
41030-60 = "사"
41030-62 = "키"
41030-64 = "부  적  합"
41030-68 = "취조 기록 : 977-R-2"
41030-70 = "담당 취조관 : 발키리 경찰학교 1학년, 나카츠카사 키리노"
41030-72 = "조사 용의자 : SRT 특수학원 1학년, 카제쿠라 모에"
41030-76 = "……카제쿠라 모에 양, 맞으시죠?"
41030-77 = "응, 맞아."
41030-78 = "그나저나 이 귀찮은 선문답은 언제까지 해야 하는 거야?"
41030-79 = "물어볼 걸 다 물어봤다면 슬슬 밖에 내보내 주었으면 좋겠는데. 당분 보충용으로 챙겨 둔 사탕이 떨어져 간다고."
41030-80 = "안 됩니다! 취조가 모두 끝날 때까지 보내 드릴 수는 없습니다!"
41030-81 = "게다가 사탕이라니. 당신은 중범죄를 저질러 체포된 용의자라고요?"
41030-82 = "협조적으로 나오지 않으면 가지고 계신 그 사탕도 모두 압수할 거예요!"
41030-83 = "치이…… 귀찮게시리."
41030-84 = "단도직입적으로 여쭈겠습니다. 카제쿠라 양, 어째서 그날 공원을 점거하고 경찰의 지시에 불응하신 건가요?"
41030-85 = "처음부터 무기를 버리고 순순히 투항하셨더라면 일이 이렇게까지 커지지는 않았을 텐데요."
41030-86 = "……SRT를 떠나고 싶지 않았으니까."
41030-87 = "으음…… 확실히 본관도 발키리 경찰학교를 막상 떠나라 하면 쉽게 따르지는 못할 것 같네요."
41030-88 = "고락을 함께한 동료들과의 추억은 소중하니까요. 이 점은 참작하여 선처를—"
41030-89 = "아니. 동료들과는 헤어져도 딱히 상관없었는데?"
41030-90 = "오히려 RABBIT 소대의 소대원들과는 빨리 헤어지고 싶을 정도야."
41030-91 = "사키는 매일 잔소리만 하지, 미유는 걸핏하면 울기나 하지…… 지긋지긋해."
41030-92 = "네? 그, 그럼 어째서 학원을 떠나고 싶지 않으셨던 건가요?"
41030-93 = "그야 당연히 학원에 잔뜩 남아 있는 무기들 때문이지!"
41030-94 = "무기라면 발키리 경찰학교에도 충분히 있는데요?"
41030-95 = "에이, SRT 특수학원의 무기들은 발키리의 장난감들과는 차원이 다르다고!"
41030-96 = "도심 한 블록을 통째로 태워버릴 수 있는 소이탄이라든가…… 전차의 장갑을 통째로 관통하는 대전차 미사일이라든가!"
41030-97 = "이렇게 강력한 화력을 지닌 무기들을 마음껏 쓸 수 있는 곳은 SRT 특수학원뿐일 거야!"
41030-98 = "SRT 학원에서도 마음껏 쓰시면 안 돼요!"
41030-99 = "(그, 그러고 보니 카제쿠라 양은 지난번 소동이 벌어졌을 때, 포탄을 무차별로 난사해 주변 상가를 반파시켰었죠…….)"
41030-100 = "업무는 조금 다르긴 해도 SRT와 발키리, 두 학교 모두 시민의 안전을 지키기 위해 만들어진 조직이잖아요?"
41030-101 = "그런데 오로지 무기를 쓰는 데에만 정신이 팔려 계시다니……"
41030-102 = "카제쿠라 양은 시민의 안전이 어떻게 되든 상관없으신 건가요?!"
41030-103 = "응."
41030-107 = "하아……."
41030-111 = "카"
41030-113 = "제"
41030-115 = "쿠"
41030-117 = "라"
41030-121 = "모"
41030-123 = "에"
41030-125 = "부  적  합"
41030-128 = "취조 기록 : 977-R-3"
41030-130 = "담당 취조관 : 발키리 경찰학교 1학년, 네무가키 후부키"
41030-132 = "조사 용의자 : SRT 특수학원 1학년, 카스미자와 미유"
41030-136 = "어, 그러니까…… 이름이……"
41030-137 = "카, 카스미자와 미유예요. SRT 특수학원 1학년이고…… RABBIT 소대에서 저격 임무를 맡고 있어요……."
41030-138 = "나이는 15살이고요, 생일은 7월 12일…… 그, 그리고 취미는 조약돌 모으기입니다."
41030-139 = "아니, 그런 것까지 말해줄 필요는 없는데……."
41030-140 = "저, 저는 앞으로 어떻게 되는 건가요?"
41030-141 = "지난번에 공원에서 경찰들을 상대로 심한 짓을 해버렸으니…… 분명히 끔찍한 고문을 받게 되겠죠……?"
41030-142 = "하루 종일 같은 노래를 들려준다든가, 밤새도록 간지럼을 태운다든가……!"
41030-143 = "제, 제발 용서해주세요! 아, 알고 있는 건 다 말할 테니까요!"
41030-144 = "아니, 아니. 귀찮게 그런 짓까지 할 생각은 애초부터 없었으니까."
41030-145 = "말할 마음이 들었다면, 어째서 우리 학교로 전학 오는 것을 거부하고 공원에서 그 난리를 피웠는지 이유나 좀 알려주면 좋겠는데."
41030-146 = "그건…… 새로운 학교로 전학을 가야 한다는 게 너무 무서워서요……."
41030-147 = "왜? 우리 학교에는 불량 학생도 없는데?"
41030-148 = "다른 학생이 아니라…… 문제는 저 때문이에요."
41030-149 = "저는, 누군가와 새로 친해지는 게 무서워요……."
41030-150 = "사실 지금도 소대원 모두와 그렇게 친하지는 않지만…… 그래도 최소한 미야코 쨩은 저를 가끔 챙겨 주기는 해요."
41030-151 = "하지만 RABBIT 소대를 떠나 새 학교의, 새로운 부서에 속하게 된다면……"
41030-152 = "분명 저 같은 모지리에게는 아무도 말을 걸어주지 않을 테고…… 결국 저는 길가의 돌멩이처럼 방치되어 모두에게 잊히겠죠……."
41030-153 = "그럴 바에는 공원에서 노숙을 하는 게 더 나아요……."
41030-154 = "신기한 성격이네. 사람을 만나는 게 무서운 거야?"
41030-155 = "사람이 무섭다기보다는…… 사람들에게서 잊히는 게 무서워요."
41030-156 = "이대로 모두에게 잊혀 혼자가 되어버린다면…… 그렇게 생각하면, 견딜 수가 없어서……."
41030-157 = "기껏 이 성격을 고치기 위해 SRT 특수학원에 지원한 건데, 이제는 학교가 통째로 사라지게 되었다니…… 저는 어쩌면 좋죠……?"
41030-158 = "그런 거라면 발키리 경찰학교에도 괜찮은 부서가 하나 있지."
41030-159 = "우리 생활안전국으로 와! 편입 시험도 어렵지 않고, 사람도 많지 않거든."
41030-160 = "거기에 귀찮은 일도 거의 내려오지 않으니, 사람을 만나기 싫어하는 게으름뱅이에게는 이만한 부서도 어디 없지."
41030-161 = "저, 정말인가요?"
41030-162 = "생활안전국에 가면 낯선 사람을 만나지 않고 조용히 학교를 다닐 수 있을까요?"
41030-163 = "어…… 아예 만나지 않는 건 어렵지 않을까?"
41030-164 = "일단은 생활안전국이니까, 가끔 들어오는 이상한 민원들을 처리하기도 해야 하거든."
41030-168 = "……그럼 안 갈래요."
41030-172 = "카"
41030-174 = "스"
41030-176 = "미"
41030-178 = "자"
41030-180 = "와"
41030-184 = "미"
41030-186 = "유"
41030-188 = "부  적  합"
41030-192 = "취조 기록 : 977-R-4"
41030-194 = "담당 취조관 : 샬레, [USERNAME] 선생"
41030-196 = "조사 용의자 : SRT 특수학원 1학년, 츠키유키 미야코"
41030-200 = "……그때의 선생님이시군요."
41030-201 = "[s1] \"안녕, 미야코.\"\n[s2] \"내가 와서 놀랐어?\""
41030-202 = "선생님이 여기 오셨다는 건, 저를 심문할 담당 취조관이 선생님이라는 뜻이시겠군요."
41030-203 = "……솔직히, 조금 놀랐습니다. 선생님이 직접 오실 거라 생각지는 못했거든요."
41030-204 = "선생님이 여기 오셨다는 건, 저를 심문할 담당 취조관이 선생님이라는 뜻이시겠군요."
41030-205 = "취조관이 누구든 상관없습니다. 제가 할 대답은 이미 정해놓았으니까요."
41030-206 = "부디 편하신 대로 질문을."
41030-207 = "[s] \"지내기에 불편하지는 않아?\""
41030-208 = "그건 예상 외의 질문이군요."
41030-209 = "괜찮습니다. 설령 불편한 점이 있다 하더라도 포로로 잡힌 몸이니 불평할 수는 없는 노릇이지요."
41030-210 = "아니면…… 제 처우를 개선해주시는 대가로 뭔가 제안하실 생각이셨나요?"
41030-211 = "혹여라도 제 마음을 돌려 볼 계획을 세우고 계셨더라면, 포기하시는 게 좋을 겁니다."
41030-212 = "선생님께서 무슨 제안을 하시더라도 SRT를 향한 저희의 결심은 변치 않을 테니까요."
41030-213 = "[s] \"어째서 발키리 경찰학교로 전학을 가고 싶지 않은 거야?\""
41030-214 = "……질문이 잘못된 것 같습니다만."
41030-215 = "전학을 가는 장소가 발키리 경찰학교라서 싫었던 게 아닙니다."
41030-216 = "SRT를 떠나는 것 자체가 싫었기 때문입니다."
41030-217 = "[s] \"그럼, 어째서 SRT 학원을 떠나고 싶지 않은 거야?\""
41030-218 = "……SRT 학원에서만 수행할 수 있는 '정의'가 있으니까요."
41030-219 = "[s] \"정의……?\""
41030-220 = "사실 이렇게 정의를 직접 입에 담는 것은 꽤 부끄러운 일인지도 모릅니다."
41030-221 = "아마 선생님이 만났던 학생 중에서도 정의를 말하는 학생이 꽤 있었겠지요."
41030-222 = "트리니티나 게헨나…… 멀리 갈 것도 없이, 이곳 발키리 경찰학교의 학생들도 자신의 행동들이 정의라 믿고 있습니다."
41030-223 = "……하지만 저는 그들의 정의는 진짜 정의가 아니라고 생각합니다."
