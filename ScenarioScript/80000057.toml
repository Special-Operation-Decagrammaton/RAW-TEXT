[translation]
80000057-1 = "익숙해진 모습"
80000057-2 = "(늦은 밤, 업무 도중 잠시 들를 일이 있어서 휴게실로 향했다.)"
80000057-8 = "[ns1] \"……?\"\n[ns2] 불을 켜서 확인한다."
80000057-15 = "(불이 켜지자 발치에 떨어져 있던 무언가의 모습이 눈에 들어왔다.)"
80000057-25 = "[ns] \"…….\""
80000057-27 = "[ns3] \"세리나.\"\n[ns4] \"숨어 있지 않아도 돼.\""
80000057-30 = "아, 아하하……. 안녕하세요. 선생님……."
80000057-31 = "쉬시는 동안 드시면 좋겠다 싶어서……. 살짝 놔두고만 가려고 했던 건데……."
80000057-32 = "다, 당분은 머리도 힘 나게 해 주니까요! 이런 때일수록 도움이 될 거 같아서, 그래서……!"
80000057-33 = "무, 물론 오늘이 발렌타인 데이라는 이유도 있긴 하지만……요."
80000057-34 = "……사, 사실 그쪽 이유가 좀 더 큽니다……. 네……. 아하하……."
80000057-35 = "호, 혹시 민폐…… 였을까요? 그랬다면 죄송해요……."
80000057-36 = "……네?"
80000057-37 = "괜찮으시다고요……? 우, 우선 앉으라고요? 어, 어째서……."
80000057-38 = "온 김에 뭐라도 마시고 가라고요……?"
80000057-39 = "서, 선생님……? 뭔가 그……. 오늘은 전혀 개의치 않아 하시는 느낌이네요……?"
80000057-40 = "[s5] \"슬슬 익숙해질 때도 됐으니까.\"\n[s6] \"세리나를 경계할 이유는 없으니까.\""
80000057-41 = "그, 그렇군요. 저야 이해해 주신다면 정말로 감사하지만……."
80000057-42 = "그, 그렇군요. 저야 이해해 주신다면 정말로 감사하지만……."
80000057-44 = "……아. 바로 드시네요. 그 초콜릿."
80000057-45 = "네? 아. 당분 섭취라고요……? 네. 그렇죠……. 일부러 좀 영양도 좋은 걸로 가져왔어요."
80000057-46 = "입맛에는 맞으신 모양이네요. 다행이네요!"
80000057-50 = "그, 그럼 전 이만……. 다음에 또, 필요하실 때 찾아오는 것으로……."
80000057-51 = "[s] \"세리나.\""
80000057-52 = "네, 네!? 왜, 왜 그러세요, 선생님?"
80000057-53 = "[s7] \"돌아갈 땐 그냥 정문으로 나가도 돼.\"\n[s8] \"고마워. 잘 먹을 게.\""
80000057-54 = "……."
80000057-55 = "……."
80000057-56 = "……후후. 후후후……."
80000057-57 = "……네, 선생님. 선생님도 너무 무리하진 마세요."
80000057-60 = "……다음에 또 뵙겠습니다."
