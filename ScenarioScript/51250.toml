[translation]
51250-1 = "제25화;지금 당신에게"
51250-13 = "읏…………"
51250-14 = "……도망갔나."
51250-15 = "방금 그건 대체 뭐였던 거야? 가지고 있던 책을 찢더니 그 순간………"
51250-17 = "굉장한 소리가 나서, 소녀 깜짝 놀라버렸사와요……!"
51250-18 = "[s] \"어쩌면 그것도 백물어의 일종일지도…….\""
51250-19 = "으으음, 덕분에 쫓아가기엔 이미 그른 모양이고……."
51250-20 = "그보다 이상한 걸 무진장 가지고 있잖아! 화조풍월부라니 대체 뭐 하는 녀석들인 거야?"
51250-21 = "[s1] \"일단 지금은 부상 치료부터 하자!\"\n[s2] \"다들 괜찮아? 다친 데는 없어?\""
51250-26 = "으음, 나는 괜찮은데. 유카리는?"
51250-27 = "소녀도 튼튼하니 괜찮사와요!"
51250-28 = "[s] \"키쿄랑 나구사는…….\""
51250-34 = "………"
51250-35 = "………"
51250-37 = "으으음……."
51250-43 = "나구사 선배…… 아까 했던 말……"
51250-47 = "아, 응……"
51250-51 = "………아니, 아무것도 아니야."
51250-52 = "…………그래………"
51250-57 = "…………"
51250-58 = "[s] \"………….\""
51250-62 = "(소근소근) 선생님, 이제 와서 관계자인 내 입으로 말하기도 좀 그렇다고 생각하지만 말이야."
51250-63 = "(소근소근) 저 두 사람…… 지금 분위기 무지 어색하지 않아?"
51250-64 = "[s] \"(소근소근) 일부러 말하지 않으려고 했는데, 말해버리는 거야?!\""
51250-65 = "하, 하지만!"
51250-66 = "일단 원흉이 되는 녀석은 쓰러트리……진 못했어도 어쨌든 도망가 버렸고!"
51250-67 = "여기서는 곧바로 해피엔딩! 까진 아니더라도, 슬슬 돌아가는 분위기가 되어야 하는 거 아니냐구……!"
51250-68 = "계속 여기 서 있을 수도 없고…… 그, 선생님이 어떻게든 해주라……!"
51250-69 = "[s] \"아니, 그렇게 말해도 나라고 방법이 있을 리가………\""
51250-75 = "흠흠."
51250-76 = "나구사 선배. 키쿄 선배. 렌게 선배. 그리고 선생님."
51250-82 = "[ns] \"유카리?\""
51250-87 = "필시 오늘 하루, 여기까지 오는 동안 정말 많은 일들이 있었사와요."
51250-88 = "때문에 많은 분들께 폐를 끼치고…… 도움을 받은 덕에, 네, 소녀도 마침내 여기까지 올 수 있었구나."
51250-89 = "정말로 운 좋게……. 이렇게 다른 분들과 함께 다시 마주할 수 있게 되었구나. 하고 생각했답니다."
51250-90 = "그 부분에 대해선 정말로 감사를 드리어요."
51250-95 = "아니야. 유카리. 오히려 그런 말이라면……"
51250-96 = "마지막까지 포기하지 않고 있어 준 유카리에게, 도리어 우리가 고맙다고 할까."
51250-97 = "………유카리, 나야, 말로……."
51250-98 = "[s] \"응. 그런 거라면, 역시 모두가 노력한 덕분이니까.\""
51250-103 = "네, 게다가 모처럼 이렇게 여러분과 다시 모였으니까요."
51250-104 = "저, 여러분 앞에서 나구사 선배에게 전하고 싶은 말이 있사와요!"
51250-112 = "저 유카리…… 나구사 선배에게 계승전을 신청하겠사와요!"
51250-116 = "[ns] \"…………네?\""
51250-121 = "어?! 이런 타이밍에, 이런 순간에 계승전을 한다고?!"
51250-122 = "네! 매듭을 짓는 건 중요하니까요!"
51250-123 = "렌게 선배와 키쿄 선배도 잊지 않으셨겠지요! 소녀는 원래부터 나구사 선배에게 계승전을 청하기 위해 이 자리까지 왔었다는 것을!"
51250-124 = "분명…… 그건 그렇지만……."
51250-125 = "[s] \"하지만, 갑자기 계승전이라고 해도 나구사는………\""
51250-131 = "그래. 알았어."
51250-133 = "진짜루?!"
51250-134 = "……선배?"
51250-136 = "매듭을 짓는 건 중요하니까."
51250-140 = "백화요란 분쟁조정위원회 부장 대리, 고료 나구사……."
51250-141 = "도전자 카데노코지 유카리의 계승전 신청을 받아들이도록 하겠어."
51250-145 = "……네!"
51250-155 = "[ns] \"그럼…… 시-작!\""
51250-172 = "끼야아앙?!"
51250-177 = "[ns] \"아…… 저기, 승자는…… 백화요란 부장 대리, 고료 나구사!\""
51250-179 = "우와, 그야말로 눈 깜짝할 새에 승패가 났네."
51250-180 = "……이럴 줄 알고는 있었지만. 뭐, 나구사 선배가 상대라면, 이게 당연한 결과겠지."
51250-185 = "……혹시, 내가 실수를 한 걸까?"
51250-186 = "[s3] \"아니, 승부의 세계는 냉정한 법이니까.\"\n[s4] \"유카리도 너무 실망하지 말고…….\""
51250-194 = "유카리! 바로 부활이어요!"
51250-195 = "[s] \"전혀 실망하지 않았구만. 이 아가씨!\""
51250-196 = "네? 실망?"
51250-197 = "훗훗, 선생님. 무슨 말씀이어요."
51250-198 = "온 힘을 다해 전력으로 도전했고 깔끔하게 패배했다."
51250-199 = "그야말로 완벽한 승패의 결과. 그렇다면 소녀 또한 여기에 납득하지 못할 이유가 없사와요."
51250-200 = "네, 당연한 결과! 라는 것이어요!"
51250-201 = "그저 이를 통해, 다시 한번 나구사 선배야말로 제가 존경하는 선배라는 걸 새삼 확인했을 뿐!"
51250-202 = "그, 그래……?"
51250-203 = "네!"
51250-206 = "그렇다면 다행이긴…… 한데. 뭐랄까."
51250-207 = "말 그대로 유카리답네."
51250-208 = "[s] \"응, 그러게.\""
51250-210 = "에헤헷! 자, 다들 이러고 있을 게 아니라! 어서 돌아가도록 하여요!"
51250-217 = "백화요란으로……"
51250-218 = "저희들의 집으로!"
51250-229 = "다음화;소원을 담아"
