[translation]
13430-1 = "제43화;에필로그 2"
13430-3 = "감사합니다, 다음에 또 오세요~!"
13430-9 = "네, 다음 두 분 이쪽에 앉아주세요!"
13430-10 = "아, 어서 오세요. 지금은 대기하셔야 하고, 30분 정도? 여기 이름 적어주세요."
13430-11 = "세리카 씨, 이쪽도 치워주겠어?"
13430-12 = "네에~ 갑니다!"
13430-17 = "[ns] \"바쁘네. 세리카.\""
13430-18 = "응. 최근 사람들이 많아지기 시작한 거 같아."
13430-19 = "그러게요. 시내에 못 보던 가게도 좀 많아진 느낌이고……."
13430-20 = "응, 저희에겐 좋은 일인 거 같아요!"
13430-25 = "그치만 사람들이 많아질수록 트러블도 많아지는 법이라서 말야. 하암- 덕분에 잠을 더 못 자고 있달까-"
13430-26 = "뭐, 아직까지는 허용범위지만."
13430-27 = "도둑이야!!"
13430-32 = "에잇, 비켜! 비켜-!!"
13430-36 = "공사 대금이 든 지갑을……! 도둑이야!!"
13430-38 = "내가 갈게!"
13430-43 = "앗, 시로코 선배! 라면 식기 전에 돌아와야 해!"
13430-44 = "시로코 쨩……!"
13430-45 = "괜찮아, 괜찮아. 시로코 쨩 요즘 엄청 빨라서 저 정도라면 금세 따라잡을걸?"
13430-49 = "[ns] \"…………….\""
13430-50 = "……선생님? 왜 그러세요?"
13430-51 = "[s] \"……나도 갈게.\""
13430-52 = "네?"
13430-54 = "크흐흐…. 여기까지 왔으면……."
13430-61 = "……."
13430-68 = "[ns] \"시로코!!\""
13430-69 = "선생님……?"
13430-70 = "……. 들켜버렸나."
13430-72 = "……."
13430-75 = "……. 음. 그럼 나는 지갑을 돌려주고 올 테니까."
13430-76 = "도망가지 않아. 내 움직임은 너에게 읽히고 있으니까."
13430-77 = "하긴, 당연하네. 너는 나니까."
13430-78 = "……. 응. 그럼 선생님."
13430-79 = "[s] \"응. 시로코. 나는 이쪽 시로코와 잠깐 얘기하고 갈 테니까.\""
13430-85 = "(해롱해롱)"
13430-90 = "……오랜만, 은 아니네. 선생님."
13430-91 = "[s] \"그동안 아비도스 자치구에 있었던 거야?\""
13430-92 = "응…… 잘 알고 있는 곳이 여기밖에 없으니까."
13430-93 = "어디서 지내고 있었냐면…… 아비도스의 빈집들 여기저기."
13430-94 = "수도나 전기가 들어오는 곳도 찾아보면 의외로 많거든."
13430-95 = "[s] \"그렇구나. 건강은 괜찮아? 식사는? 곤란한 건 없어?\""
13430-96 = "매일 체력 단련도 하고 있고, 버려진 폐품을 주워서 이런저런 물건을 조립해서 팔거나 가끔씩 이렇게 자경단 활동도 하고……."
13430-97 = "……혼자 지내는 건 오래전부터 익숙했어. 선생님."
13430-109 = "[ns1] \"저기 가서 라면 먹지 않을래?\"\n[ns2] \"모두 네 안부를 궁금해하고 있어. 시로코.\""
13430-115 = "……아니. 괜찮아."
13430-116 = "무슨 표정으로 모두를 봐야 할지 잘 모르겠어……."
13430-117 = "[s] \"그럼 다음에라도 같이 보자.\""
13430-118 = "……."
13430-119 = "궁금하지 않아?"
13430-120 = "[s] \"어떤 게?\""
13430-121 = "나에게 무슨 일이 있었고, 어떤 일들이 펼쳐졌는지."
13430-122 = "어째서 묻지 않는 거야, 선생님?"
13430-123 = "[s] \"알만큼은 아니까, 그 이상은 의미 없지 않을까?\""
13430-124 = "……그런가."
13430-125 = "[s] \"그리고 그런 걸 물으면 시로코를 괴롭히는 게 되는 거잖아?\""
13430-129 = "……. 그러네."
13430-130 = "그래도 조금은 알게 된 게 있어. 선생님."
13430-131 = "호시노 선배가 어째서 자신의 본질이 반전된 상태에서 다시 원래대로 돌아올 수 있었는지."
13430-132 = "[s] \"……….\""
13430-133 = "애초에 나와는 달리 불완전한 상태였기도 하고, <색채>가 아닌 다른 무언가를 통해 전환된 것이기도 했지만……."
13430-134 = "하지만 선배는 결국 자신의 본질이었던, 자신의 일부를 버렸던 거야. 그래서……"
13430-135 = "……앞으로 나아갈 수 있었던 거겠지."
13430-138 = "색채로 완전히 반전된 존재를 원래대로 되돌릴 수 있는 방법 같은 건 이 세상엔 존재하지 않아."
13430-139 = "그건 죽은 사람을 되살리지 못하는 것과 마찬가지로 당연한 이 세상의 법칙이라네."
13430-140 = "허나……. 그럼에도 불구하고 누군가를 구하고 싶은 것이라면…… 나를 찾아주게나, 선생."
13430-143 = "[ns] \"하지만, 나는 죽은 사람을 되살리지 못해.\""
13430-149 = "[ns3] \"그러니까 이제 쿠즈노하를 쫓는 것은 그만둘 거야.\"\n[ns4] \"대신 바로 내 앞에 도움이 필요한 시로코에게 손을 내밀겠어.\""
13430-153 = "하지만 내가 여기에 있으면 분명 큰 문제가 생길 거야. 선생님. 한 세계에 시로코는 하나뿐이어야 하니까……."
13430-154 = "[s] \"아니. 무슨 문제가 생기더라도…… 내가 어떻게든 해 볼게.\""
13430-158 = "……훗."
13430-159 = "[s] \"시로코가 웃었다?\""
13430-160 = "자주 듣던 이야기네."
13430-161 = "응. 여기는…… [ruby=어른]선생님[/ruby]이 지켜주고 있는 곳이니까."
13430-165 = "프레나파테스와 선생님이 두 사람으로 느껴지지 않아."
13430-166 = "하긴, 그것도 당연한 이야기네. 시로코가 나이듯이."
13430-167 = "[s] \"맞아. 나는 언제나 나야.\""
13430-168 = "응. 그러네. 언제나 같은 상황에서 같은 선택을 하는…… 선생님은 늘 그래왔으니까."
13430-172 = "[ns] \"시로코. 이걸 받아.\""
13430-179 = "……이건, 스마트폰……?"
13430-180 = "……오랜만이네."
13430-181 = "[s] \"그러니까 내 손이 닿는 곳에 계속 있어 줘. 시로코.\""
13430-185 = "……응. 고마워."
13430-186 = "슬슬 모두가 걱정할 테니까, 이만 가 볼게. 선생님."
13430-187 = "……연락할게."
13430-196 = "[ns] \"시로코!\""
13430-198 = "[ns] \"그러고 보니, 뭔가 변했어. 너도.\""
13430-199 = "……?"
13430-200 = "[s5] \"내가 장담할 수 있어. 너도 달라졌어. 분명히, 어떤 부분이!\"\n[s6] \"아주 조금이지만, 너도 앞으로 나아간 게 맞아!\""
13430-206 = "……응. 나도 알고 있어."
13430-209 = "이 고통도 그 행복도 모두 내 삶의 일부였던 거야."
13430-210 = "그러니까 아마도……."
13430-213 = "그러니까 아마도 나도…… 괜찮을 거야."
13430-219 = "(치익) 목표 확인! 눈으로 확인 가능한 거리까지 접근했습니다!"
13430-220 = "아니, 설명하지 않아도 이미 잘 보이거든, 아야네 쨩?"
13430-227 = "저번에 한번 싸웠었죠? 그때는 사막 한가운데였지만~"
13430-228 = "(치익) 네, 하지만 조금 달라요, 그때는 색채에……."
13430-229 = "아니! 설명은 아무래도 됐어! 어쨌든 저걸 그대로 놔뒀다가는 아비도스 시가지가 엉망진창이 되는 거잖아!"
13430-230 = "응. 그러니 바로 제압한다."
13430-231 = "(치익) 측면을 우회해서 접근하겠습니다! 제가 엄호할 테니 돌입해 주세요!"
13430-232 = "알겠어."
13430-233 = "빠르게 돌격이에요~♧"
13430-234 = "우와아아-! 그런데 호시노 선배는 어디 간 거야?!"
13430-235 = "(치익) 네? 호시노 선배는……."
13430-236 = "(치익) 이 아저씨는 이미 도착해 있다고."
13430-237 = "뭐?! 언제 도착한 거야?"
13430-238 = "이 녀석의 정면 쪽이야. 빨리 와~ 이 아저씨는 늙어서 오래 버티질 못한다구~"
13430-239 = "응. 최대한 빨리 갈게."
13430-242 = "호시노 선배! 기다렸지?"
13430-243 = "앗?!"
13430-246 = "늦었어."
13430-248 = "……!!"
13430-249 = "당신은……."
13430-250 = "우와, 도와주러 온 거야, 또 다른 시로코 선배?"
13430-251 = "응. 하지만 도와주는 건 이번뿐만이야."
13430-252 = "자아, 지금은 전투에 집중하라고. 빠르게 처치할 거니까."
13430-253 = "응. 그럼, 포메이션 B."
13430-259 = "……. 아니, 그런 포메이션 약속한 적 없지 않아……?"
13430-260 = "응응! 저는 준비 완료예요~♧"
13430-261 = "장난칠 시간 없습니다! 비나가 이쪽의 존재를 알아차렸어요!"
13430-262 = "……. 말이랑 행동이 일치하지 않잖아, 아야네 쨩……."
13430-266 = "으, 으음……."
13430-267 = "그리고 아까부터 뭔가 불안한 강아지처럼 안절부절못하지 말라고, 시로코 선배……."
13430-271 = "이 복면은 줄 순 없어. 이건 소중한 거니까."
13430-276 = "자아, 모두들 집중할 시간이야."
13430-289 = "호시노"
13430-290 = "[7cd0ff]대책위원회[-]"
13430-291 = "[log=호시노]좋아, 그럼 가보자고.[wa:1500] 아비도스 학생들.[/log]"
