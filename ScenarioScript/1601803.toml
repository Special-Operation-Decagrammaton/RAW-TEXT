[translation]
1601803-1 = "대장의 무게"
1601803-2 = "(라브와 함께 상점가에 갔다.)"
1601803-3 = "흐으으음…… 으으음……."
1601803-4 = "고민되네에……."
1601803-5 = "[s1] \"이게 뭔데?\"\n[s2] \"콩고물 같은 거야?\""
1601803-8 = "콩고물이 아니야, 헬멧단의 필수품이지."
1601803-9 = "이거, 호두 껍데기를 가루 낸 거야."
1601803-10 = "헬멧을 새로 도색하면 기존 도색을 다 사포로 까거든."
1601803-11 = "그러면 맨들맨들해서 빛도 잘 반사되니까, 원래처럼 오돌토돌하게 해줘야 해."
1601803-12 = "[s] \"까칠하지 않은 헬멧도 있었잖아?\""
1601803-13 = "그렇긴 한데, 용도가 다르다구."
1601803-14 = "싸울 때 쓰는 헬멧은 거칠게, 멋 내고 싶을 때는 광택을 내는 거야."
1601803-15 = "아무튼, 그 질감을 주려고 헬멧에 뿌려서 붙이는 호두 껍데기야."
1601803-16 = "문제는 30방짜리로 할지, 50방짜리로 할지인데……."
1601803-17 = "[s]\"전부 똑같은 거 아니야?\""
1601803-18 = "이러니까 초짜는 안 돼! 좀 더 자세히 보라고!"
1601803-19 = "이번 달도 개털이니까 하나만 사야 하는데 끙……."
1601803-26 = "엥?"
1601803-27 = "저 자식, 퐁당퐁당 헬멧단 두목 녀석 아니야?"
1601803-28 = "옆에는 샬레의 선생도 있는데?"
1601803-29 = "어이, 바가지!!"
1601803-30 = "이제 헬멧단 때려치우고 샬레하고 노냐?"
1601803-34 = "뭐?"
1601803-35 = "졸개들은 어디에다 두고 다니냐?"
1601803-36 = "야, 이대로 해치워 버릴까?"
1601803-37 = "……하아."
1601803-38 = "선생. 잠깐만 상대할게."
1601803-39 = "[s] \"왜 양말을 벗어서 총에 씌우는 거야?\""
1601803-40 = "뭐야, 왜 저러는 거야?"
1601803-41 = "무서워서 제정신이 아닌가 본데?"
1601803-42 = "지금, 이 언니가 총알값도 아껴야 하거든."
1601803-43 = "좋은 기회잖냐. 그러니까 조용히 쇼핑만 하다 가라."
1601803-44 = "이게 헛소리하네,"
1601803-45 = "작살내버려!!!"
1601803-60 = "커헉!!!"
1601803-65 = "비겁하게 총으로 때리다니, 이 자식……!"
1601803-66 = "이리 내!!"
1601803-77 = "야, 양말이!!"
1601803-78 = "그러게, 총을 왜 잡았어. 양말이 벗겨지면 자빠진다구."
1601803-79 = "아, 안돼!!!"
1601803-80 = "돼!!"
1601803-90 = "하, 진짜 귀찮네."
1601803-91 = "코마카제 라브!! 이 자식, 잘도 우리 구역에서!!"
1601803-92 = "수류탄이나 먹어!"
1601803-93 = "야, 이러면 안 돼!"
1601803-94 = "흡!!"
1601803-100 = "으아악!!"
1601803-105 = "이런 상황에서는 직구로 빠르게 던져야지."
1601803-106 = "다 데려와!! 반드시 잡아낸다!!!"
1601803-114 = "뭐, 뭔 녀석이 저렇게 세? 으윽……."
1601803-115 = "후퇴!! 후퇴!!!!"
1601803-119 = "짜식들 진짜 귀찮게……."
1601803-120 = "하루 다 공쳐버렸잖아!!!"
1601803-121 = "다음에 걸리면 진짜 걸어서 못 돌아갈 줄 알아!!!"
1601803-122 = "히유…… 지친다, 지쳐."
1601803-123 = "선생, 괜찮아? 다친 곳은 없고?"
1601803-124 = "[s3] \"괜찮아! 아무 문제 없어!\"\n[s4] \"매일 이러는 거야?\""
1601803-127 = "오늘은 좀 심하긴 했는데, 맨날 이렇지, 뭐."
1601803-128 = "불량배들하곤 당연히 사이가 안 좋고, 헬멧단끼리도 견제가 일상이야."
1601803-129 = "이렇게 한번 본때를 보여주면 당분간은 조용할 거야."
1601803-130 = "[s] \"라브는 엄청 강하네!\""
1601803-131 = "헹, 당연한 소리를."
1601803-132 = "헬멧단 대장은 괜히 하는 게 아니라구!"
1601803-133 = "[s] \"헬멧단원들한테도 믿음직한 리더야!\""
1601803-134 = "선생, 과찬이네. 헤헤……."
1601803-135 = "[s] \"알고보면 마음씨도 착해!\""
1601803-136 = "자, 잠깐……!"
1601803-137 = "[s] \"뾰족뾰족 이도 귀여워!!\""
1601803-138 = "시끄러!!"
1601803-140 = "(이후, 두들겨 맞으면서 라브를 잔뜩 칭찬했다.)"
