212160-129 = "ถ้าตั้งค่าความถี่คลาดเคลื่อน ปฏิบัติการก็ล้มเหลว ถ้าสมมติฐานใช้ไม่ได้ผล ปฏิบัติการก็ล้มเหลว และถ้าส่งสัญญาณไม่ได้ ปฏิบัติการก็ล้มเหลวค่ะ"
