212160-13 = "[ns] \"！？\""
212160-14 = "緊急事態だ！全隊員出動！"
212160-15 = "何だって……！！"
212160-16 = "繰り返す！全隊員、戦闘態勢で出動しろ！"
212160-17 = "！！"
212160-18 = ""
212160-20 = ""
212160-21 = ""
212160-22 = "[ns] \"何が……起きたんだ……？\""
212160-24 = "[ns] \"……ん？この振動は！？\""
212160-31 = "[ns] \"うわっ！？\""
212160-33 = "[ns] \"けほっ、けほっ！\""
212160-34 = ""
212160-36 = ""
212160-37 = "おやおや、温泉かと思ったら他のものを掘り当ててしまったな。"
212160-38 = "[s] \"カスミ！\""
212160-39 = "ハーッハッハッハ！なに、予想通りだ。やはりここにいたか！"
212160-40 = "部長、トンネル開通っす！"
212160-41 = "上出来だ！諸君、ご苦労だった！"
212160-42 = "しっかしこれ、床下の備えがまるでなっていないじゃないか。#n我々の存在もずいぶん甘く見られていたようだねぇ？"
212160-43 = "あるいは、完全に操り人形になったとでも思っていたのかね。#nなんにせよ、こうして鼻を明かすのは気持ちがいいな！"
212160-44 = "さあ、先生！"
212160-45 = "脱獄だ！！"
212160-46 = "[s] \"来てくれてありがとう！\""
212160-47 = "ハーッハッハッハ。先生を助けるんだ。断るわけにもいかんだろう？"
212160-48 = "それに――"
212160-49 = "メグをあんなふうにした連中に、一泡吹かせてやりたくてね。"
212160-50 = ""
212160-52 = ""
212160-53 = "ささ、積もる話はあとにしよう。見つかる前にずらかるぞ！"
212160-56 = ""
212160-57 = "襲撃……！？"
212160-58 = "どこから来たんだ？いったい誰が！？"
212160-59 = ""
212160-62 = ""
212160-64 = ""
212160-66 = "ぐあっ！"
212160-67 = "うああっ！！"
212160-68 = ""
212160-70 = ""
212160-74 = ""
212160-75 = "ごめん、先輩……！"
212160-76 = "ちょっと休んでてくださいっ！"
212160-77 = "目指すは作戦会議室！ゲヘナ本館まで駆け抜けるぞ！"
212160-78 = "派手に注意を引けばいいんだよね！"
212160-79 = "ちょっと怖いけど……私たちがやらなきゃ！"
212160-80 = "はい。私たちは、線を守る者ですから。"
212160-81 = "線を越えた人は連れ戻す！それが私たちなんだ！私たちの委員長だろうと関係ない！！"
212160-83 = "（30分前……） "
212160-84 = "これから作戦の概要を説明します。"
212160-85 = "主力として戦闘を担うのは、イオリさんとチナツさん、風紀委員会の皆さんです。#n便宜上、このチームを戦闘班と呼びます。"
212160-86 = "戦闘班の最大の役目は、風紀委員長に放送室の異変を察知させないことです。#n作戦開始と同時に騒ぎを起こして、敵の視線を引きつけてください。"
212160-88 = "戦闘班が目指すのは、作戦会議室があるゲヘナ本館です。"
212160-89 = "あそこには万魔殿の精鋭戦力に加えて、風紀委員長が常駐しています。"
212160-90 = "もしも放送室の異変を察知されたとしても、可能な限り足止めしてください。"
212160-92 = "イオリちゃん、チナツちゃん。ちゃんとできる？"
212160-93 = "あ、からかってんじゃないよ。#n自分とこの委員長に銃を向けられるのかって聞いてるの。"
212160-94 = "……やるしかない。"
212160-95 = "やらねばなりません。"
212160-96 = "たとえ委員長に私たちの叫びが届かなくても、抵抗し続けます。"
212160-97 = "狙って、撃って、戦う。負けたって、伝えなきゃいけないことがあるんだ。"
212160-98 = "……お願いします。"
212160-99 = "次に技術班。戦闘班が引きつけている間に放送室へ侵入して作業を進めます。"
212160-100 = ""
212160-102 = ""
212160-103 = ""
212160-104 = "技術班は、サツキ先輩、エリカさん、キララさんです。"
212160-105 = "エリカさんとキララさんが、遠隔操作システムをごまかす細工を行い、#nサツキ先輩が妨害周波数を解析した後に学園全体へ送信します。"
212160-106 = "その間も放送室の警備は厳重なままだと思われます。#n予備戦力が抜けたとしても、散発的な戦闘は起こるはずです。"
212160-107 = "その相手をするのがマユミさん、カレンさん、ゲヘナ再興委員会の皆さんです。"
212160-108 = "任せて。"
212160-109 = "カレンがいるなら安心だし、私たちも全力で戦うよ。"
212160-110 = "それからチアキ。"
212160-111 = "は～い！"
212160-112 = "先生を現場まで案内する役割です。"
212160-113 = "戦闘班が注意を引きつけている間に、温泉開発部が先生を脱出させます。"
212160-114 = "途中で引き継いで、指揮を必要とする場所まで安全にお連れしてください。"
212160-115 = "まっかせてください！"
212160-116 = "決して簡単な任務じゃありません。"
212160-117 = "先生の顔は広く知られています。#n最悪の場合、向こう側の生徒と何度も交戦する可能性があります。"
212160-118 = "それをかいくぐって、絶対に先生を守ってください。"
212160-119 = "ふっふっふ、心配ご無用です！記者の端くれとして、隠密は得意分野ですから！"
212160-120 = ""
212160-122 = ""
212160-123 = "……そしてエリカさん、キララさん、サツキ先輩。"
212160-124 = ""
212160-126 = ""
212160-127 = "三人がこの作戦の要です。"
212160-128 = "妨害周波数を設定し、学園全体へ送信できるかどうかで勝敗が決まります。"
212160-129 = "周波数がズレても失敗、送信ができなくても失敗、#nそもそも仮説が間違っていても失敗です。"
212160-130 = "私たちの勝利条件は、戦闘班が持ちこたえている間に洗脳を解くこと。"
212160-131 = ""
212160-133 = ""
212160-134 = "こうして口にすると絶望的ですね……。"
212160-135 = "イロハちゃん。"
212160-136 = ""
212160-138 = ""
212160-139 = "……はい。"
212160-140 = ""
212160-142 = ""
212160-143 = "心配いらないわ。私は失敗しないもの。"
212160-144 = ""
212160-145 = "いいえ、私だけじゃない。この作戦に関わる誰ひとり、失敗なんてしない。"
212160-146 = ""
212160-147 = "守りたい人のための戦いなのだから。必ず勝つのよ。"
212160-148 = ""
212160-149 = "……先輩、いつからそんなに頼もしくなったんですか？"
212160-150 = "あら、私は昔から頼もしかったでしょう？"
212160-151 = "ふふ、大丈夫だよ。きっと何とかしてみせるから。"
212160-152 = "うん！キラキラっとやっちゃうよ！"
212160-153 = ""
212160-155 = ""
212160-156 = ""
212160-157 = "……はい。よろしくお願いします。"
212160-158 = "イロハは全体の調整をお願い。あなたが私たちの目よ。"
212160-159 = "オペレーションは任せてください。"
212160-160 = "それでは――"
212160-161 = ""
212160-163 = ""
212160-164 = "ゲヘナ奪還作戦を開始します。"
212160-167 = ""
212160-168 = ""
212160-169 = "いたぞ！反逆者どもだ！"
212160-170 = "全員攻撃！退くな！"
212160-171 = ""
212160-173 = ""
212160-180 = "うわぁっ！！"
212160-181 = ""
212160-184 = ""
212160-185 = ""
212160-186 = "よっし、順調に集まってきてる……！"
212160-187 = "敵の数は増えていますが、これくらいなら持ちこたえられます。"
212160-188 = "……委員長は？まだ出てこないのか？"
212160-189 = "依然として本館内部にいると確認できています！"
212160-190 = "……了解！作戦通り進めるぞ！"
212160-191 = "行きましょう、イオリ。"
212160-192 = "待ってろ……委員長……っ！"
