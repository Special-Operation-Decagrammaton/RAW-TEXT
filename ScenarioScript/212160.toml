212160-39 = "วะฮะฮ่า! ว่าแล้วเชียวว่าต้องอยู่ที่นี่!"
212160-40 = "หัวหน้าคาสุมิ ภารกิจขุดอุโมงค์ใต้ดินมาถึงคุกของคณะกรรมการวินัยเสร็จสิ้นแล้วค่ะ!"
212160-41 = "ยอดเยี่ยม ยอดเยี่ยมมาก! แหม~ ทุกคนเหนื่อยกันแย่เลยนะ"
212160-42 = "ว่าแต่ว่าทางนั้นไม่ได้เตรียมรับมือพวกเราไว้เลยนี่นา ท่าทางจะประเมินชมรมพัฒนาออนเซ็น#nต่ำเกินไปนะ?"
212160-43 = "คิดว่าพวกเรากลายเป็นหุ่นเชิดไปแล้วเหรอไง? ก็นะ การได้ตลบหลังอย่างเจ็บแสบแบบนี้#nก็สนุกไปอีกแบบเหมือนกัน"
212160-44 = "เอาเป็นว่า..."
212160-45 = "คุณครู เรามาแหกคุกกันเถอะ!!"
212160-46 = "[s] \"ขอบใจที่มานะ คาสุมิ ทุกคนจากชมรมพัฒนาออนเซ็นด้วย\""
212160-47 = "ฮ่าฮ่า นี่เป็นงานที่ได้ช่วยคุณครูนี่นา จะให้ปฏิเสธได้ยังไงล่ะ?"
212160-48 = "แล้วก็..."
212160-49 = "อยากทำให้เจ้าพวกที่ทำแบบนั้นกับเมกุได้ลิ้มรสชาติขมๆ ดูบ้างน่ะ"
