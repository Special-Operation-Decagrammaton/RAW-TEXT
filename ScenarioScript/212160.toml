212160-13 = "[ns] 「！？」"
212160-14 = "緊急狀況！全體部員出動！"
212160-15 = "你說什麼……！！"
212160-16 = "再重複一次！全體部員進入戰鬥態勢出動！"
212160-17 = "！！"
212160-18 = ""
212160-20 = ""
212160-21 = ""
212160-22 = "[ns] 「發生什麼事了……」"
212160-24 = "[ns] 「嗯？這個震動是……！？」"
212160-31 = "[ns] 「嗚哇啊！？」"
212160-33 = "[ns] 「咳咳，咳咳……」"
212160-34 = ""
212160-36 = ""
212160-37 = "喲，看看這是誰啊？"
212160-38 = "[s] 「佳澄！」"
212160-39 = "哈～哈哈哈！果然在這裡啊！"
212160-40 = "佳澄部長，通往風紀委員會監獄的地道挖好了！"
212160-41 = "太棒了，太棒了！哎呀～大家辛苦了。"
212160-42 = "不過這裡完全沒有防範我們嘛。#n看來是太小看溫泉開發部的存在了啊？"
212160-43 = "以為我們已經完全變成傀儡了嗎？#n不過像這樣漂亮地擺他們一道，也挺有意思的呢。"
212160-44 = "那麼……"
212160-45 = "老師，我們越獄吧！！"
212160-46 = "[s] 「謝謝你來救我，佳澄。還有溫泉開發部的大家。」"
212160-47 = "哈哈，事關拯救老師，我怎麼能推辭呢？"
212160-48 = "而且……"
212160-49 = "我也想讓那些把惠搞成那樣的傢伙嘗嘗苦頭。"
212160-50 = ""
212160-52 = ""
212160-53 = "好了好了，老師，我們快點出去吧。#n得趁被發現之前趕快走！"
212160-56 = ""
212160-57 = "怎，怎麼回事？#n居然突然遭到襲擊……！"
212160-58 = "從哪裡來的？是誰！？"
212160-59 = ""
212160-62 = ""
212160-64 = ""
212160-66 = "唔！"
212160-67 = "啊啊！！"
212160-68 = ""
212160-70 = ""
212160-74 = ""
212160-75 = "對不起了，前輩們……！"
212160-76 = "請你們先暫時休息一下吧！"
212160-77 = "好，我們快點趕往作戰會議室所在的格黑娜本館吧！"
212160-78 = "嗯！這是要吸引敵人注意的作戰！"
212160-79 = "雖然有點可怕……！但我們不做還有誰會做？"
212160-80 = "沒錯。因為我們是守護界線之人。"
212160-81 = "引導越過界線的人回歸正途就是我們的職責！#n就算那個人是我們的委員長也一樣！！"
212160-83 = "（30分鐘前……）"
212160-84 = "現在開始說明作戰概要。"
212160-85 = "伊織同學、千夏同學和風紀委員們將作為主力負責戰鬥，所以就稱為戰鬥組。"
212160-86 = "作戰一開始，戰鬥組就會製造騷動來吸引敵人的目光。"
212160-88 = "戰鬥組的最終目標，是作戰會議室所在的格黑娜本館。"
212160-89 = "那裡除了萬魔殿的精銳兵力之外，還有風紀委員長隨時待命。"
212160-90 = "戰鬥組最大的任務，是不讓風紀委員長察覺廣播室的異變。#n就算被察覺了也要拖住他，不讓他前往廣播室。"
212160-92 = "伊織醬、千夏醬，你們做得到嗎？"
212160-93 = "我不是在開玩笑，是在問你們能不能把槍口對準自己的委員長。"
212160-94 = "……只能做了。"
212160-95 = "我們必須這麼做。"
212160-96 = "就算我們的吶喊傳不到委員長心裡，也會繼續抵抗下去。"
212160-97 = "瞄準、開槍、戰鬥。就算會輸，也有非傳達不可的事。"
212160-98 = "……拜託了。"
212160-99 = "趁戰鬥組吸引目光的期間，技術組會潛入廣播室進行作業。"
212160-100 = ""
212160-102 = ""
212160-103 = ""
212160-104 = "技術組由皐月前輩、繪里香同學和綺羅羅同學負責。"
212160-105 = "繪里香同學和綺羅羅同學負責操作機器，讓廣播設備不受遠端操控也能發送電波。#n接著由皐月前輩設定干擾頻率，再發送到整個學園。"
212160-106 = "這段期間廣播室的戒備仍然很森嚴。#n即使預備隊被調走，也還是會發生零星的戰鬥。"
212160-107 = "這部分就由真由美同學、香蓮同學和再興委員會的成員們負責。"
212160-108 = "交給我吧。"
212160-109 = "有香蓮在就不用擔心了，不過我們也會盡全力戰鬥的。"
212160-110 = "還有千秋。"
212160-111 = "是～！"
212160-112 = "千秋則負責把脫逃的老師帶到激戰區。"
212160-113 = "趁目光集中在戰鬥組身上時，溫泉開發部會協助老師脫逃。"
212160-114 = "請你把老師安全地帶到需要指揮的地方。"
212160-115 = "請交給我吧！"
212160-116 = "這絕對不是簡單的任務。"
212160-117 = "格黑娜的所有學生都認得老師的臉。#n最糟的情況下，可能會和察覺老師脫逃的對方學生多次交戰。"
212160-118 = "你必須在這種情況下安全地把老師帶過來。"
212160-119 = "那點請不用擔心！#n身為週刊萬魔殿的記者，我對隱密行動可是很有一套的！"
212160-120 = ""
212160-122 = ""
212160-123 = "還有繪里香同學、綺羅羅同學，以及皐月前輩。"
212160-124 = ""
212160-126 = ""
212160-127 = "拜託你們了。#n三位的任務真的非常重要。"
212160-128 = "這次作戰的勝負，取決於能不能在時間內設定好干擾頻率，並發送到整個學園。"
212160-129 = "頻率設定有誤是失敗，假說行不通是失敗，無法發送也是失敗。"
212160-130 = "只要能在戰鬥組撐住的期間解除洗腦，就是我們的勝利。"
212160-131 = ""
212160-133 = ""
212160-134 = "這樣說出來，感覺成功率還真低呢……"
212160-135 = "伊呂波醬。"
212160-136 = ""
212160-138 = ""
212160-139 = "……是。"
212160-140 = ""
212160-142 = ""
212160-143 = "別擔心。我不會失敗的。"
212160-144 = ""
212160-145 = "無論這次作戰還是我們都不會失敗。"
212160-146 = ""
212160-147 = "畢竟這是為了守護重要之人的戰鬥。#n我們一定要贏。"
212160-148 = ""
212160-149 = "……前輩，你是從什麼時候開始變得這麼可靠的？"
212160-150 = "哎呀，我一直都很可靠的啊。"
212160-151 = "呵呵，伊呂波醬，別擔心。#n我們會想辦法的。"
212160-152 = "嗯！我們會閃亮亮地大顯身手哦！"
212160-153 = ""
212160-155 = ""
212160-156 = ""
212160-157 = "……好的。拜託你們了。"
212160-158 = "伊呂波，整個戰場的協調就拜託你了。#n你就是我們的眼睛。"
212160-159 = "好的。指揮調度就交給我吧。"
212160-160 = "好了，那麼……"
212160-161 = ""
212160-163 = ""
212160-164 = "格黑娜奪還作戰，開始。"
212160-167 = ""
212160-168 = ""
212160-169 = "在那裡！是那群叛徒！"
212160-170 = "全員攻擊！不准後退！"
212160-171 = ""
212160-173 = ""
212160-180 = "嗚啊！！"
212160-181 = ""
212160-184 = ""
212160-185 = ""
212160-186 = "很好，目光一直集中在我們身上……！"
212160-187 = "雖然敵方兵力在增加，但還應付得來。"
212160-188 = "……委員長呢？還沒出現嗎？"
212160-189 = "已確認陽奈風紀委員長還在本館內部！"
212160-190 = "……了解！按照作戰計畫進行！"
212160-191 = "走吧，伊織。"
212160-192 = "委員長……！"
