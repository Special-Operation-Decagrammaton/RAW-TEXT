212160-90 = "The combat team's priority is to prevent the Head Prefect from noticing our actions in the broadcasting room. If she becomes alerted, then the team must prevent her from interfering."
212160-92 = "Iori. Chinatsu. You think you can do this?"
212160-93 = "I'm not teasing, you know. I'm asking if you can aim the barrel at your own president."
212160-94 = "...We have to."
