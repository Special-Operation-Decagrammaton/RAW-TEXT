[translation]
212160-1 = "제16화;게헨나 탈환 작전 1"
212160-13 = "[ns] \"?!\""
212160-14 = "긴급 상황이다! 전 부원 출동!"
212160-15 = "뭐라고……!!"
212160-16 = "다시 한번 전파한다! 전 부원 전투태세로 출동!"
212160-17 = "!!"
212160-22 = "[ns] \"무슨 일이…….\""
212160-24 = "[ns] \"응? 이 진동은……?!\""
212160-31 = "[ns] \"우와앗?!\""
212160-33 = "[ns] \"콜록, 콜록…….\""
212160-37 = "여어, 이게 누구야?"
212160-38 = "[s] \"카스미!\""
212160-39 = "와하핫! 역시 여기에 있었구만!"
212160-40 = "카스미 부장, 선도부 감옥까지 땅굴 파기 임무 완료임다!"
212160-41 = "훌륭하다, 훌륭해! 이야~ 다들 고생했어."
212160-42 = "그나저나 이거 우리에 대한 대비가 전혀 안 되어 있구만.#n온천개발부의 존재를 너무 무시한 모양인데?"
212160-43 = "완전히 꼭두각시가 되었다고 생각한 건가?#n뭐, 이렇게 야무지게 뒤통수를 치는 것도 나름 꽤 재미있단 말이지."
212160-44 = "아무튼……"
212160-45 = "선생님, 탈옥하자!!"
212160-46 = "[s] \"와줘서 고마워, 카스미. 온천개발부의 모두들.\""
212160-47 = "하핫, 선생님을 구하는 일인데 사양할 수는 없잖아?"
212160-48 = "그리고……"
212160-49 = "메구를 그렇게 만든 녀석들에게 쓴맛을 보여주고 싶어서 말이지."
212160-53 = "자, 자. 얼른 나가자, 선생님. 들키기 전에 서둘러야 해!"
212160-57 = "뭐, 뭐야? 갑자기 습격이라니……!"
212160-58 = "어디서 온 거지? 누가?!"
212160-66 = "큭!"
212160-67 = "아악!!"
212160-75 = "미안해, 선배들……!"
212160-76 = "잠깐 쉬고 계십쇼!"
212160-77 = "자, 빠르게 작전회의실이 있는 게헨나 본관까지 가자!"
212160-78 = "응! 시선 끌기 작전이야!"
212160-79 = "조금 무섭지만……! 우리가 안 하면 누가 하겠어?"
212160-80 = "네. 우리는 선을 지키는 자들이니까요."
212160-81 = "선을 넘은 사람들을 선도하는 게 우리야! 그게 설령 우리의 부장일지라도!!"
212160-83 = "(30분 전……)"
212160-84 = "지금부터 작전 개요를 설명하겠습니다."
212160-85 = "이오리 씨와 치나츠 씨, 선도부원 분들이 주력으로 전투를 진행할 예정이므로, 전투팀이라 지칭합니다."
212160-86 = "작전이 시작되면 이 전투팀이 소란을 일으키면서 시선을 끌 겁니다."
212160-88 = "전투팀의 최종 목표는 작전회의실이 있는 게헨나 본관입니다."
212160-89 = "그곳에는 만마전의 정예 병력을 포함해 선도부장이 상시 대기 중이지요."
212160-90 = "전투팀의 가장 큰 목표는 선도부장이 방송실의 이변을 알아채지 못하게 하고, 알아챈다 하더라도 방송실로 향하지 못하도록 묶어두는 역할입니다."
212160-92 = "이오리 쨩. 치나츠 쨩. 할 수 있겠어?"
212160-93 = "놀리는 게 아니라, 너희의 부장에게 총을 겨눌 수 있겠냐는 말이야."
212160-94 = "……해야지."
212160-95 = "해야 합니다."
212160-96 = "부장님에게 우리의 외침이 닿지 않을지라도, 계속해서 저항할 겁니다."
212160-97 = "겨누고, 쏘고, 싸운다. 패배할지라도 전하지 않으면 안 되는 게 있어."
212160-98 = "……부탁합니다."
212160-99 = "이렇게 전투팀이 시선을 끄는 동안, 기술팀이 방송실에 침투해서 작업을 진행합니다."
212160-104 = "기술팀은 사츠키 선배, 에리카 씨, 키라라 씨가 되겠습니다."
212160-105 = "에리카 씨와 키라라 씨가 방송 장비의 원격 연결과 상관없이 전파를 송신할 수 있도록 기계를 조작하고, 사츠키 선배가 방해 주파수를 설정한 뒤 학원 전체에 송신합니다."
212160-106 = "이때 방송실의 경계는 여전히 삼엄한 상태니까, 예비대가 빠진다 해도 산발적인 전투는 발생할 겁니다."
212160-107 = "그것을 마유미 씨와 카렌 씨, 재흥위원회 부원분들이 담당합니다."
212160-108 = "맡겨줘."
212160-109 = "카렌이 있으니 걱정 없지만, 우리도 최선을 다해 싸울 거야."
212160-110 = "그리고 치아키."
212160-111 = "네에~!"
212160-112 = "치아키에게는 탈출한 선생님을 격전지까지 안내해 오는 임무가 있습니다."
212160-113 = "전투팀에 시선이 집중된 사이, 온천개발부가 선생님을 탈출시킬 거예요."
212160-114 = "선생님을 지휘가 필요한 곳까지 안전하게 모셔와 주세요."
212160-115 = "맡겨주세요!"
212160-116 = "결코 쉬운 임무가 아니에요."
212160-117 = "게헨나의 모든 학생들이 선생님의 얼굴을 알고 있으니, 최악의 경우에는 선생님이 탈출했다는 사실을 알아챈 저쪽 학생들과 수차례의 교전이 발생할 수도 있겠죠."
212160-118 = "그 사이에서 안전하게 선생님을 모셔와야 해요."
212160-119 = "그건 걱정 마세요! 주간 만마전의 기자로서, 조용히 움직이는 데에는 도가 텄으니까요!"
212160-123 = "……그리고 에리카 씨, 키라라 씨. 사츠키 선배."
212160-127 = "부탁합니다. 세 분의 역할이 정말 중요해요."
212160-128 = "이 작전은 시간 안에 방해 주파수를 설정하고, 학원 전체에 송신할 수 있느냐 없느냐로 승패가 갈리게 돼요."
212160-129 = "……주파수 설정이 어긋나도 실패, 가설이 통하지 않아도 실패, 송신이 불가능해도 실패합니다."
212160-130 = "전투팀이 버텨주는 동안 세뇌를 풀 수 있다면 우리의 승리입니다."
212160-134 = "……이렇게 말하니 성공률이 정말 낮아 보이지만……"
212160-135 = "이로하 쨩."
212160-139 = "……네."
212160-143 = "걱정 마. 나는 실패하지 않아."
212160-145 = "이 작전도, 우리도 모두 실패하지 않아."
212160-147 = "지키고 싶은 자들의 싸움이잖아? 반드시 이겨."
212160-149 = "……선배, 언제부터 이렇게 든든해진 거죠?"
212160-150 = "어머, 나는 항상 든든했다구."
212160-151 = "후후, 이로하 쨩. 걱정하지 마. 어떻게든 해볼 테니까."
212160-152 = "응! 반짝반짝하게 한번 가볼게."
212160-157 = "……네. 잘 부탁드려요."
212160-158 = "이로하는 전체 전장의 조율을 부탁해. 네가 우리의 눈이야."
212160-159 = "네. 오퍼레이팅은 맡겨주세요."
212160-160 = "자. 그럼……"
212160-164 = "게헨나 탈환 작전, 시작합니다."
212160-169 = "저기다! 반역자들이다!"
212160-170 = "모두 공격! 물러서지 마라!"
212160-180 = "으악!!"
212160-186 = "좋아, 우리에게 계속 시선이 몰리고 있어……!"
212160-187 = "병력이 늘어나고 있지만, 감당할 수 있습니다."
212160-188 = "……부장은? 아직 나타나지 않았나?"
212160-189 = "히나 선도부장은 아직 본관 내부에 있는 것으로 파악되었습니다!"
212160-190 = "……알겠어! 작전대로 진행한다!"
212160-191 = "가죠, 이오리."
212160-192 = "부장……!"
