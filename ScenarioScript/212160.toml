212160-75 = "ขอโทษด้วยนะ พวกรุ่นพี่...!"
212160-76 = "ช่วยพักกันไปก่อนสักเดี๋ยวนะคะ!"
212160-77 = "เอาละ รีบไปยังอาคารหลักของเกเฮนน่าที่มีห้องประชุมปฏิบัติการกันเถอะ!"
212160-78 = "อื้ม! นี่คือปฏิบัติการดึงดูดความสนใจ!"
212160-79 = "ถึงจะน่ากลัวไปบ้าง...! แต่ถ้าพวกเราไม่ทำ แล้วใครจะทำกันล่ะ?"
212160-80 = "ค่ะ เพราะพวกเราคือผู้ที่คอยรักษาเส้นขอบเขตไม่ให้ใครก้าวข้าม"
212160-81 = "การชี้นำคนที่ก้าวล้ำเส้นกลับมาเป็นหน้าที่ของพวกเรา! ต่อให้คนนั้นจะเป็นประธานของพวกเราเองก็ตาม!!"
212160-83 = "(30 นาทีก่อน...)"
212160-84 = "ต่อจากนี้จะขออธิบายภาพรวมของปฏิบัติการค่ะ"
212160-85 = "คุณอิโอริ คุณชินัตสึ และสมาชิกคณะกรรมการวินัยจะรับหน้าที่เป็นกำลังหลักในการต่อสู้ ก็เลยจะเรียกกลุ่มนี้ว่าทีมต่อสู้ค่ะ"
212160-86 = "เมื่อปฏิบัติการเริ่มขึ้น ทีมต่อสู้จะสร้างความวุ่นวายเพื่อดึงดูดความสนใจเอาไว้ให้ค่ะ"
212160-88 = "เป้าหมายสุดท้ายของทีมต่อสู้คืออาคารหลักของเกเฮนน่า หรือก็คือที่ตั้งของห้องประชุมปฏิบัติการค่ะ"
212160-89 = "ที่นั่นมีประธานกรรมการวินัยประจำการอยู่ตลอด พร้อมกับกองกำลังชั้นยอดของแพนเดโมเนียม โซไซตี้"
212160-90 = "เป้าหมายสำคัญที่สุดของทีมต่อสู้คือ ไม่ให้ประธานกรรมการวินัยสังเกตเห็นความผิดปกติด้านใน#nห้องกระจายเสียง และต่อให้สังเกตเห็น ก็ต้องตรึงไว้ไม่ให้มุ่งหน้าไปยังห้องกระจายเสียงค่ะ"
212160-92 = "อิโอริจัง ชินัตสึจัง จะทำไหวใช่มั้ย?"
212160-93 = "ไม่ได้ถามเล่นๆ นะ ฉันหมายถึงพวกเธอจะหันกระบอกปืนเข้าหาประธานของตัวเองได้หรือเปล่า"
212160-94 = "ต้องทำสิ..."
212160-95 = "ต้องทำค่ะ"
212160-96 = "ต่อให้เสียงเรียกร้องของพวกเราไปไม่ถึงท่านประธาน พวกเราก็จะต่อต้านต่อไปค่ะ"
212160-97 = "เล็ง ยิง และต่อสู้ ต่อให้ต้องพ่ายแพ้ ก็ยังมีบางสิ่งที่จำเป็นต้องส่งไปให้ถึง"
212160-98 = "ฝากด้วยนะคะ..."
212160-99 = "ระหว่างที่ทีมต่อสู้กำลังดึงดูดความสนใจ ทีมเทคนิคจะแทรกซึมเข้าไปดำเนินงานในห้องกระจายเสียงค่ะ"
212160-100 = ""
212160-102 = ""
212160-103 = ""
212160-104 = "ทีมเทคนิคได้แก่รุ่นพี่ซัตสึกิ คุณเอริกะ และคุณคิราระค่ะ"
212160-105 = "คุณเอริกะกับคุณคิราระจะปรับอุปกรณ์ให้ส่งคลื่นออกไปได้โดยไม่ขึ้นอยู่กับการเชื่อมต่อระยะไกลของ#nอุปกรณ์กระจายเสียง จากนั้นรุ่นพี่ซัตสึกิจะตั้งค่าความถี่รบกวนและส่งไปทั่วทั้งโรงเรียนค่ะ"
212160-106 = "ถึงตอนนั้นการรักษาความปลอดภัยรอบห้องกระจายเสียงก็น่าจะยังคงเข้มงวดอยู่ ต่อให้กองกำลังสำรองถอนออกไปแล้ว ก็คงเกิดการปะทะกันบ้างประปรายค่ะ"
212160-107 = "ส่วนนั้นจะให้คุณมายูมิ คุณคาเรน สมาชิกคณะกรรมการฟื้นฟูจะเป็นผู้รับผิดชอบค่ะ"
212160-108 = "ปล่อยให้เป็นหน้าที่พวกฉันได้เลย"
212160-109 = "มีคาเรนอยู่ก็หายห่วง แต่พวกเราเองก็จะสู้ให้เต็มที่เหมือนกัน"
212160-110 = "แล้วก็จิอากิ"
212160-111 = "ค่าา~!"
212160-112 = "จิอากิมีภารกิจนำทางคุณครูที่หลบหนีออกมาไปยังสนามรบค่ะ"
212160-113 = "ระหว่างที่ความสนใจมุ่งไปยังทีมต่อสู้ ชมรมพัฒนาออนเซ็นจะช่วยพาคุณครูหลบหนีออกมา"
212160-114 = "ฝากพาคุณครูไปยังจุดที่ต้องการการสั่งการอย่างปลอดภัยด้วยค่ะ"
212160-115 = "วางใจฉันได้เลยค่ะ!"
212160-116 = "นี่ไม่ใช่ภารกิจง่ายๆ เลยค่ะ"
212160-117 = "นักเรียนทุกคนในเกเฮนน่ารู้จักใบหน้าของคุณครู ในกรณีเลวร้ายที่สุด อาจต้องปะทะหลายๆ ครั้งกับ#nนักเรียนฝ่ายนั้นที่รู้ตัวว่าคุณครูหนีออกมาแล้วก็ได้ค่ะ"
212160-118 = "คุณต้องพาคุณครูฝ่าการปะทะเหล่านั้นมาอย่างปลอดภัยค่ะ"
212160-119 = "เรื่องนั้นไม่ต้องห่วงค่ะ! ในฐานะนักข่าวของแพนเดโมเนียม โซไซตี้รายสัปดาห์ ฉันเชี่ยวชาญเรื่องการเคลื่อนไหวอย่างเงียบเชียบอยู่แล้ว!"
