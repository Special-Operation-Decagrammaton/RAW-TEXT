[translation]
10045005-1 = "프롤로그;백화요란의 단합대회"
10045005-4 = "끝없이 맑고 푸른 하늘에, 따가운 태양. #n여름은 바로 여기에 있다."
10045005-5 = "이것은, 모두의 우정과 청춘이 담긴 이야기."
10045005-8 = "내가 왜 여기에 있지……?"
10045005-9 = "평소라면 이런 날엔 방에서 병법서를 읽으며 유유자적한 시간을 보내고 있었을 텐데."
10045005-10 = "어쩌다 내가 바다에……."
10045005-11 = "선배들과 푸른 바다! 하얀 구름! 그리고 시원한 수영복! 제가 계속 꿈꿔왔던 상황이어요!"
10045005-12 = "자! 느긋하게 있을 때가 아니어요! 빨리! 빨리 물가로 가요!"
10045005-13 = "나는 괜찮아. 너희끼리 해."
10045005-17 = "에이, 왜 그래? 단합대회잖아? 너도 좋다고 했으면서."
10045005-18 = "단합대회에는 동의했지만, 바다에 오는 건 동의한 적 없어."
10045005-20 = "키쿄 선배는…… 소녀와 바다에 오는 게 싫으셨던 건가요……?"
10045005-22 = "그, 그런 게 아니야. 나는 단지……."
10045005-23 = "……단지 야외 활동이 싫을 뿐이야."
10045005-29 = "인도어파였죠, 키쿄 선배는."
10045005-30 = "하지만 여기까지 와서 바다를 즐기지 않는다는 것은 언어도단, 이어요!"
10045005-36 = "자 키쿄 선배! 이제 가시죠!"
10045005-37 = "으으음……."
10045005-38 = "에이. 냅둬라, 냅둬. 싫다는 사람 억지로 끌고 가는 것도 안 좋아."
10045005-39 = "그럼 먼저 들어가 있을 테니 언제든 마음 바뀌면 따라오라고!"
10045005-43 = "후후후. 소녀, 선배를 기다리고 있겠사와요!"
10045005-47 = "……후우."
10045005-51 = "……미안. 단합대회 장소를 다른 곳으로 잡을 걸 그랬어."
10045005-52 = "아니야. 다들 여기 오고 싶어 했잖아."
10045005-53 = "모처럼 분위기가 무르익었는데, 내 고집으로 찬물을 끼얹을 수는 없잖아?"
10045005-54 = "후후, 그랬구나. 고마워."
10045005-55 = "그래도 준비 운동 정도는 해두는 게 좋을 거야."
10045005-56 = "곧 시작될 테니까."
10045005-57 = "백귀야행의, 여름의 풍물시……."
10045005-59 = "[log=나구사 수영복]백야수상제[/log]"
10045005-65 = "(……정말 어쩌다 이렇게 된 걸까.)"
10045005-66 = "(분위기에 떠밀려 수상 이벤트에 참가하다니.)"
10045005-67 = "(수영이라곤 전혀 못 하는 내가 어쩌다……!)"
10045005-72 = "정말 운이 좋았어. 참가자가 많아 추첨을 돌려야 했는데 우리 모두 뽑혔을 줄이야."
10045005-73 = "……그래. 우리 모두 뽑히는 건 예상 밖이었지."
10045005-74 = "(적어도 나는 추첨에서 떨어졌으면 했는데…….)"
10045005-75 = "키쿄? 괜찮아? 무슨 고민 있어?"
10045005-76 = "……기책을 생각 중이었어."
10045005-77 = "화려하게, 무조건 승리를 거머쥘 기책을."
10045005-79 = "그렇구나."
10045005-80 = "그럼 믿고 있을게. 키쿄가 생각해 내는 기책을."
10045005-81 = "그래…… 생각해 내야만 해."
10045005-85 = "백화요란의 작전참모가 물을 무서워한다는 걸 들킬 순 없으니까……!"
