1014502-153 = "[ns] \"สนุกมั้ย?\""
1014502-154 = "อืม"
1014502-155 = "รู้สึกปลอดโปร่งขึ้นอย่างบอกไม่ถูกเลย"
1014502-156 = "บางที... สิ่งที่เราปรารถนา อาจเป็นช่วงเวลาเช่นนี้ก็ได้"
1014502-157 = "ช่างตรงตามคำกล่าวนั้นเสียจริง"
1014502-158 = "ที่ว่ามนุษย์นั้น แม้แต่ตัวเองก็ยังไม่รู้แน่ชัดว่าตัวเองปรารถนาสิ่งใด"
1014502-159 = "ครู"
1014502-160 = "วันนี้... ขอบคุณมากจริงๆ ที่ยอมตามใจเรานะ"
1014502-161 = "[s] \"ไม่เป็นไรเลย\""
1014502-162 = "ฮุฮุ"
1014502-163 = "ใช่แล้ว เป็นเช่นนั้น"
1014502-164 = "เฉพาะ 'วันนี้' เท่านั้นน่ะนะ"
1014502-165 = "[s] \"หืม...?\""
1014502-167 = "(คิซากิยิ้มราวกับได้เล่นสนุกมาก ก่อนจะเดินเข้าที่พักไปก่อน)"
