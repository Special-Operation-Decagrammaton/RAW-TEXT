[translation]
1014502-1 = "긴장을 푸는 하루"
1014502-2 = "(키사키와 약속한 장소에, 조금 먼저 도착했다.)"
1014502-3 = "(날씨가…… 참 좋다는 생각을 하고 있었다.)"
1014502-8 = "먼저 와 있었는가, 선생."
1014502-9 = "후후, 이거 면목이 없군. 먼저 만남을 청한 자가, 오히려 뒤늦고 말다니."
1014502-11 = "(키사키에게 평범하게 인사하려다가…… 조금, 장난을 쳐 보기로 했다!)"
1014502-13 = "[ns1] \"별말씀을요. 오늘도 문주님을 뵙게 되어 무한한 영광입니다.\"\n[ns2] \"어디로 모시면 좋을까요?\""
1014502-16 = "……일단, 여기에서는 문주라고 불리고 싶지 않구나. 그리고 또한……."
1014502-17 = "……."
1014502-18 = "선생."
1014502-19 = "우리는 지금, 휴식을 취하기 위해 이곳에 온 것이 분명하겠지?"
1014502-20 = "그래."
1014502-21 = "그렇다면 지금의 나는, 현룡문의 문주가 아니라……."
1014502-22 = "그저 평범한 고등학교 3학년생의, 류우게 키사키라고 볼 수 있지 않을까 한다만?"
1014502-23 = "[s3] \"그건 그런데…….\"\n[s4] \"미안. 화났구나.\""
1014502-26 = "아니, 아니다. 화가 났다니 당치도 않구나."
1014502-27 = "물론 조금 전 한 말이 선생의 농담이었다는 것도, 충분히 알고 있고."
1014502-28 = "하지만 역시……."
1014502-29 = "오늘만이라도, 조금이나마 어깨의 힘을 빼고 싶어서 말이다."
1014502-30 = "그러니 여기에 있는 동안이라도…… 나를 그저 산해경의 3학년생, '키사키'로 대해 주지 않겠는가?"
1014502-31 = "물론 나 역시 그렇게 행동할 것이다."
1014502-32 = "그러니 선생 역시 그에 상응하는 모습을 보여 주었으면 한다"
1014502-33 = "나도 선생에게서…… 그저 평범한 '학생' 취급을 받고 싶기도 하고 말이지?"
1014502-34 = "[s] \"알았어!\""
1014502-36 = "(먼저 장난을 친 것도 있고, 오늘은 키사키의 요구를 그대로 따라 주기로 했다!)"
1014502-37 = "(……그렇게 다짐하기는 했는데…….)"
1014502-39 = "맛있게 먹은 건 좋은데……. 이 접시 어떻게 하지? 기름과 양념으로 엉망이 됐네……."
1014502-40 = "뭐 어때! 사방이 모두 물인데, 여기서 설거지해 버리자!"
1014502-44 = "무엇을 하는 것인가, 저 사람들은……. 계곡에서 설거지라니, 지나치게 자기들만 생각하는 행위이지 않은가."
1014502-45 = "명백히 처벌의 대상이 될 수 있는 일이다. 지정된 곳에서 설거지를 하거나, 물티슈로 닦은 다음 집에 돌아가서 설거지를 하는 것이 법도일 터인데……!"
1014502-46 = "하아……. 여기가 산해경이었다면, 적당히 이야기로 타이르는 것으로 충분할 터인데."
1014502-47 = "[s] \"하지만…… 우리가 직접 뭐라고 하는 것도 조금 그렇지?\""
1014502-48 = "허나, 선생. 이렇게 법도에 어긋나는 일을, 그저 두고 보는 것도 도리가 아니지 않겠는가."
1014502-49 = "음? 선생에게 생각이 있다는 것인가?"
1014502-51 = "(상인회에서 운영하는 계곡 관리팀에게, 이 일을 문의했다.)"
1014502-54 = "자, 자. 이러시면 안 됩니다. 모두가 즐기는 계곡이지 않습니까."
1014502-55 = "쳇……. 몰래 무사히 끝낼 수 있을 것 같았는데."
1014502-56 = "누가 몰래 신고라도 했나……. 세상에 자기만 잘난 줄 아나 보지?"
1014502-57 = "텄다, 텄어. 다른 데 가자."
1014502-59 = "텐트를 이런 곳에 설치하고 있는 것인가……."
1014502-60 = "하아……. 분명 이렇게 물 가까이에는 텐트를 치지 말라고 경고 표지가 설치되어 있는데 말이다."
1014502-61 = "이 모든 게 당사자의 안전을 위한 것인데, 왜 알지 못하는가. 아니, 알면서도 무시하는 것인가."
1014502-62 = "모든 규정은 아픈 기억으로 만들어진다는 말도 있을 터인데."
1014502-64 = "(다시 계곡 관리팀에게 이 일을 문의했다.)"
1014502-67 = "여기에 텐트를 설치하시면 안 됩니다! 물이 넘치기라도 하면 큰일 난다고요!"
1014502-68 = "하지만 여기가 제일 터가 좋은데……."
1014502-69 = "거 되게 빡빡하네. 우리 일은 우리가 책임질 수 있다고."
1014502-70 = "(그 순간 갑자기 불어난 물살이 텐트를 덮쳤다!)"
1014502-74 = "우와아악?!?!"
1014502-76 = "서, 선생?! 어서 돕도록 하자!"
1014502-81 = "(관광객들은 무사히 구출되었다…….)"
1014502-82 = "(키사키의 마음씀씀이는 분명 세심하고 너그러웠지만, 평범한 고등학교 3학년생의 모습으로는 보이지 않았다.)"
1014502-84 = "저렇게 높은 위치에서 다이빙을 하려 하다니……!"
1014502-85 = "계곡물 속은 깊은 것처럼 보이다가도 그렇지 않기도 하고."
1014502-86 = "얕은 것처럼 느껴지는 데도, 몇 미터나 될 수도 있을 터인데……!"
1014502-88 = "(계곡 관리팀에게 이 일을 문의했다.)"
1014502-96 = "(키사키는 가는 곳마다 관광객들이 제멋대로 행동하는 모습에 신경을 쓰고, 그때마다 계곡 관리팀에게 문의했지만…….)"
1014502-97 = "(그건 역시, 어떻게 봐도 편하게 휴가를 즐기는 고등학생의 모습은 아니었다…….)"
1014502-99 = "휴우, 어째서인지 조금 피곤하구나. 어째서일까……."
1014502-100 = "[s] \"있잖아, 키사키.\""
1014502-101 = "음? 왜 그러는가, 선생."
1014502-102 = "조금 더 편하게 있어도 좋다……?"
1014502-103 = "흐음, 나는 제법 그렇게 하려고 했던 것 같은데 말이다."
1014502-104 = "[s5] \"응, 응. 알고 있어.\"\n[s6] \"하지만 뭐, 조금 더 내려놓고 그래도 되니까.\"\n[s7] \"더 어리광을 부린다든가 말이지!\""
1014502-108 = "누군가 민폐를 끼친다면, 선생이 직접 나서 줄 테니까, 말인가?"
1014502-109 = "흐음……."
1014502-110 = "……."
1014502-111 = "그러니까 선생의 말은, 가령……."
1014502-113 = "(키사키가 갑자기 한 손으로는 손을 잡으며, 다른 손으로는 팔짱을 껴 왔다!)"
1014502-115 = "이렇게 해도 괜찮다는 뜻이렷다?"
1014502-116 = "후후, 왜 그렇게 놀라는가. 선생."
1014502-117 = "더 내려놓고 편하게 지내라고 한 것은, 선생 쪽이 아니었던가."
1014502-119 = "……."
1014502-120 = "그래, 그렇구나."
1014502-121 = "이제야 조금, 선생의 말이 이해가 간다. 그리고……."
1014502-122 = "……."
1014502-123 = "확실히 오늘, 내가 어떤 모습이었는지 되돌아볼 수 있게 된 것 같구나."
1014502-124 = "이것 참, 면목 없는 일이다."
1014502-125 = "평범한 고등학생으로 보내고 싶다고 먼저 이야기를 꺼낸 자가."
1014502-126 = "평소와 다름없는 언행을 보였다면, 그것이야말로 모순인 것이었겠지."
1014502-127 = "[s8] \"무의식적인 것이었을 테니까!\"\n[s9] \"습관이란 어렵지, 응!\""
1014502-131 = "그렇지. 몸에 오래 밴 습관이라는 것은, 누군가가 옆에서 도와주지 않으면 좀처럼 떨쳐내기 어려운 것이니까."
1014502-132 = "……나도, 처음부터 이런 식으로 말하고 행동했던 것은 아니었다만……."
1014502-133 = "그것참, 몸에 맞지 않는 옷을 너무 오래 입으면, 어느 사이엔가 그 옷에 적응해 버리고 만다는 말은."
1014502-134 = "슬프게도, 어느 정도의 진실을 담고 있었던 듯하구나."
1014502-135 = "그러면, 선생."
1014502-136 = "나머지 반나절 정도라도 좋으니……."
1014502-137 = "내 곁에서, 내가 '평범하게' 다닐 수 있도록 도와주길 바란다."
1014502-153 = "[ns] \"즐거웠어?\""
1014502-154 = "음."
1014502-155 = "뭔가, 후련하구나."
1014502-156 = "……내가 바랐던 것은, 어쩌면 이런 시간이었을지도 모르고 말이다."
1014502-157 = "참으로 그 말 그대로구나."
1014502-158 = "사람은 자신이 무엇을 바라는지, 자신도 정확히 모른다는 이야기 말이다."
1014502-159 = "선생."
1014502-160 = "오늘…… 내 어리광에 어울려 줘서, 정말로 고마웠다."
1014502-161 = "[s] \"천만에.\""
1014502-162 = "후후."
1014502-163 = "그래, 그렇다."
1014502-164 = "'오늘은', 말이다."
1014502-165 = "[s] \"어……?\""
1014502-167 = "(키사키는 즐거웠다는 듯이 웃으며, 먼저 숙소로 들어갔다.)"
