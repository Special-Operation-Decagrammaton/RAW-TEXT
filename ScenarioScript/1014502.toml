[translation]
1014502-1 = "放鬆的一天"
1014502-2 = "（比約定時間稍早，抵達了與妃姬約好的地方）"
1014502-3 = "（就在心想今天天氣真不錯的時候……）"
1014502-4 = ""
1014502-7 = ""
1014502-8 = "汝已先行抵達了啊，老師。"
1014502-9 = "呵呵，明明是妾身提出邀約卻姍姍來遲，還真是失禮了呢。"
1014502-10 = ""
1014502-11 = "（本來想和平常一樣向妃姬打招呼……但是決定稍微捉弄他一下！）"
1014502-12 = ""
1014502-13 = "[ns1] 「不敢當。今日得以拜見門主大人，實乃無上光榮。」\n[ns2] 「且問門主大人，今日欲移駕何處？」"
1014502-16 = "……妾身並不希望連這種場合都被稱為門主。此外……"
1014502-17 = "……"
1014502-18 = "老師。"
1014502-19 = "吾等之所以造訪此地，無疑是為了放鬆身心對吧？"
1014502-20 = "沒錯。"
1014502-21 = "既然如此，如今的妾身便不是玄龍門門主……"
1014502-22 = "而是一介平凡無奇的3年級學生龍華妃姬，不是嗎？"
1014502-23 = "[s3] 「是這樣沒錯……」\n[s4] 「抱歉讓你生氣了。」"
1014502-26 = "汝言重了。妾身並未因此動怒。"
1014502-27 = "方才那番話不過是老師的玩笑，這點妾身自然心中有數。"
1014502-28 = "然而……"
1014502-29 = "妾身終究還是盼望，至少能在今日稍微卸下肩上的重擔。"
1014502-30 = "在此停留期間……能否以山海經3年級學生「妃姬」的方式對待妾身呢？"
1014502-31 = "當然，妾身同樣會如此行事。"
1014502-32 = "希望老師也能以相同的態度回應。"
1014502-33 = "畢竟妾身……其實也想被老師當成平凡的「學生」對待啊。"
1014502-34 = "[s]「我知道了！」"
1014502-36 = "（考慮到剛才先捉弄了他，今天就配合妃姬的要求吧！）"
1014502-37 = "（雖然下定了這樣的決心……）"
1014502-39 = "東西是還挺好吃的……可是這些盤子要怎麼辦啊？#n都被油和醬料弄得髒兮兮的了……"
1014502-40 = "有什麼好煩惱的！反正周圍到處都是水，就在這裡把餐具洗一洗吧！"
1014502-41 = ""
1014502-43 = ""
1014502-44 = "那些人究竟在做什麼……竟然在溪流之中清洗餐具，未免太過自私自利了。"
1014502-45 = "此舉顯然已觸犯規範，足以論處。#n理應於指定之處清洗，或暫以濕巾擦拭，待返家後再行清洗才合乎規矩啊……！"
1014502-46 = "唉……若換作是在山海經，只需以言語稍作勸誡便已足夠。"
1014502-47 = "[s] 「不過……由我們出面指責，好像也不太妥當？」"
1014502-48 = "可是老師，眼見如此踰矩之事卻不聞不問，這也不合道理吧？"
1014502-49 = "嗯？老師心中已有主意嗎？"
1014502-51 = "（向商會經營的溪谷管理事務所通報了這件事）"
1014502-54 = "喂喂喂，怎麼能在溪裡洗碗呢。這裡可是大家共同享受的溪谷啊。"
1014502-55 = "嘖……本來以為能偷偷搞定的說。"
1014502-56 = "到底是哪個愛管閒事的人跑去檢舉啊……自以為多高尚是不是？"
1014502-57 = "算了算了，我們去別的地方吧。"
1014502-59 = "居然有人將營帳設於此處……"
1014502-60 = "唉……明明早已立下告示，不得於臨水之處設帳紮營了。"
1014502-61 = "這些規定無一不是為了遊客的安危著想，為何不明白呢。#n不……難不成是明知故犯嗎。"
1014502-62 = "俗話說「所有的規章都源自慘痛的教訓」就是這個道理啊。"
1014502-64 = "（再次向溪谷管理事務所通報了這件事）"
1014502-67 = "不可以在這裡搭帳篷！萬一溪水暴漲的話可是會出大事的！"
1014502-68 = "可是這裡的位置最好……"
1014502-69 = "何必多管閒事啊。我們自己的事，我們自己會負責啦。"
1014502-70 = "（就在這時，突然暴漲的水流沖向了帳篷！）"
1014502-71 = ""
1014502-74 = "嗚哇啊啊！？！？"
1014502-76 = "老，老師！？趕緊前去協助吧！"
1014502-81 = "（遊客們平安地獲救了……）"
1014502-82 = "（妃姬那細膩的心思，怎麼看都不像是個平凡的高三學生）"
1014502-84 = "打算從那種高處躍入水中……！？"
1014502-85 = "溪水有可能看似深邃卻並非如此。"
1014502-86 = "反之看似淺薄之處也可能深達數米啊……！"
1014502-88 = "（向溪谷管理事務所通報了這件事）"
1014502-89 = ""
1014502-90 = ""
1014502-91 = ""
1014502-92 = ""
1014502-93 = ""
1014502-94 = ""
1014502-96 = "（妃姬一路上都對遊客們恣意妄為的舉動十分掛心，#n　每當發現問題都得向溪谷管理事務所通報……）"
1014502-97 = "（不管怎麼看，都不像是正在悠閒享受假期的高中生該有的模樣……）"
1014502-98 = ""
1014502-99 = "呼……莫名感到有些疲憊啊。究竟是為何呢……"
1014502-100 = "[s] 「那個……妃姬。」"
1014502-101 = "嗯？怎麼了嗎，老師。"
1014502-102 = "再放鬆一些也無妨……？"
1014502-103 = "呼呣，妾身自認已盡力為之了。"
1014502-104 = "[s5] 「嗯，我知道。」\n[s6] 「不過，你可以再多放鬆一點也沒關係。」\n[s7] 「比方說……再多撒撒嬌之類的！」"
1014502-108 = "若有人滋擾生事，老師會親自出面是嗎？"
1014502-109 = "呼呣……"
1014502-110 = "……"
1014502-111 = "所以老師言下之意……"
1014502-113 = "（妃姬突然用一隻手挽住我的手臂，同時用另一隻手牽了過來！）"
1014502-115 = "是即便這麼做也無妨嗎？"
1014502-116 = "呵呵，為何如此訝異？"
1014502-117 = "要妾身更加放鬆的，不正是老師嗎？"
1014502-119 = "……"
1014502-120 = "原來如此啊。"
1014502-121 = "妾身這才稍稍明白老師的用意。與此同時……"
1014502-122 = "……"
1014502-123 = "也得以回顧今日的自身究竟是什麼模樣。"
1014502-124 = "這可真是教人無地自容。"
1014502-125 = "明明是妾身提出要以平凡學生的身分度日……"
1014502-126 = "若言行舉止仍與平日毫無二致，無疑是自相矛盾吧。"
1014502-127 = "[s8] 「畢竟那都是下意識的舉動嘛。」\n[s9] 「習慣這種東西是很難改變的。」"
1014502-130 = ""
1014502-131 = "是啊。深植於身的習慣，若無人從旁協助便難以輕易擺脫。"
1014502-132 = "……妾身的言行，也並非生來便是如此。"
1014502-133 = "唉，俗話說「不合身之衣若久著於身，終將順應成自然」……"
1014502-134 = "即便說來有些感傷，但其中似乎蘊含著幾分真實呢。"
1014502-135 = "那麼，老師。"
1014502-136 = "儘管只是剩下的半日也無妨……"
1014502-137 = "還請老師陪伴著妾身，協助妾身「平凡地」度過這段時光。"
1014502-138 = ""
1014502-139 = ""
1014502-140 = ""
1014502-141 = ""
1014502-142 = ""
1014502-143 = ""
1014502-144 = ""
1014502-152 = ""
1014502-153 = "[ns] 「玩得開心嗎？」"
1014502-154 = "唔呣。"
1014502-155 = "總覺得似乎心頭舒暢了許多。"
1014502-156 = "……妾身所期盼的，或許正是此般無憂無慮的時光也說不定。"
1014502-157 = "誠如這番話所說──"
1014502-158 = "人往往連自身渴望著何物都未必明白啊。"
1014502-159 = "老師。"
1014502-160 = "今日願意配妾身的任性……妾身由衷感謝。"
1014502-161 = "[s]「不用客氣。」"
1014502-162 = "呵呵。"
1014502-163 = "是啊……"
1014502-164 = "至少「今日」是如此呢。"
1014502-165 = "[s] 「咦……？」"
1014502-167 = "（妃姬帶著非常愉悅的笑容，先一步返回了住處）"
