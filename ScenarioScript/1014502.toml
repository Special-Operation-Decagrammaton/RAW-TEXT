[translation]
1014502-1 = "วันที่ผ่อนคลาย"
1014502-2 = "(คุณครูมาถึงสถานที่ที่นัดพบกับคิซากิก่อนเวลาเล็กน้อย)"
1014502-3 = "(ระหว่างที่กำลังคิดว่า... วันนี้อากาศดีจริงๆ)"
1014502-4 = ""
1014502-7 = ""
1014502-8 = "มาถึงก่อนแล้วหรือ ครู?"
1014502-9 = "ฮุฮุ ช่างน่าละอายเสียจริง เราเป็นฝ่ายเอ่ยปากชวนแท้ๆ แต่กลับมาช้ากว่าเสียได้"
1014502-10 = ""
1014502-11 = "(คุณครูกำลังจะทักทายคิซากิตามปกติ... แต่คิดว่าลองแกล้งเล่นสักหน่อยดีกว่า!)"
1014502-12 = ""
1014502-13 = "[ns1] \"นับเป็นเกียรติอย่างหาที่สุดไม่ได้ที่ได้เข้าเฝ้าท่านประมุข\"\n[ns2] \"ท่านประมุขประสงค์จะไปยังที่แห่งใดหรือ?\""
1014502-16 = "อย่างแรกเลยนะ เราไม่อยากถูกเรียกว่าประมุขที่นี่ แล้วก็..."
1014502-17 = "..."
1014502-18 = "ครู"
1014502-19 = "เรามาที่นี่เพื่อพักผ่อนกันไม่ใช่หรือ?"
1014502-20 = "อื้อ "
1014502-21 = "เช่นนั้น ตัวเราในยามนี้ก็ไม่ใช่ประมุขแห่งมังกรดำ..."
1014502-22 = "เป็นเพียงแค่ริวเกะ คิซากิ นักเรียนมัธยมปลายชั้นปีที่ 3 ธรรมดาๆ คนหนึ่งต่างหาก"
1014502-23 = "[s3] \"ก็จริงอยู่ ขอโทษนะ...\" \n[s4] \"ขอโทษที โกรธครูสินะ\""
1014502-26 = "ไม่... ไม่หรอก เราไม่ได้โกรธสักหน่อย"
1014502-27 = "เรารู้ดีว่าเมื่อกี้ครูแค่หยอกเล่นน่ะ"
1014502-28 = "แต่ว่า..."
1014502-29 = "อย่างน้อยในวันนี้ เราก็อยากปล่อยตัวปล่อยใจบ้างน่ะ"
1014502-30 = "เพราะงั้น อย่างน้อยระหว่างอยู่ที่นี่... ช่วยปฏิบัติต่อเราในฐานะ 'คิซากิ' นักเรียนชั้นปีที่ 3 แห่งซานไห่จิงธรรมดาคนหนึ่งได้หรือไม่?"
1014502-31 = "แน่นอนว่าเราก็จะประพฤติตัวเช่นนั้นเหมือนกัน"
1014502-32 = "เพราะงั้น เราก็หวังว่าครูจะวางตัวให้สอดคล้องกันด้วย"
1014502-33 = "เราเองก็อยากให้ครู... ปฏิบัติต่อเราเหมือนเป็น 'นักเรียน' ธรรมดาคนหนึ่งบ้างเหมือนกันนะ?"
1014502-34 = "[s] \"เข้าใจแล้ว!\""
1014502-36 = "(คุณครูคิดว่าตัวเองผิดที่เป็นฝ่ายแกล้งก่อน วันนี้เลยตัดสินใจว่าจะทำตามคำขอของคิซากิ)"
1014502-37 = "(แต่ถึงจะตั้งใจไว้อย่างนั้นก็ตาม...)"
1014502-39 = "ได้กินของอร่อยมันก็ดีอยู่หรอก... แต่จะทำยังไงกับจานดีล่ะ? ทั้งเครื่องปรุง ทั้งน้ำมัน เยิ้มไปหมดเลย..."
1014502-40 = "ไม่เห็นจะเป็นไรเลย! แถวนี้ก็มีแต่น้ำทั้งนั้น ล้างมันตรงนี้เลยก็แล้วกัน!"
1014502-41 = ""
1014502-43 = ""
1014502-44 = "คนพวกนั้นกำลังทำอะไรกันน่ะ... มาล้างจานในหุบเขาเช่นนี้ ช่างเป็นการกระทำที่เห็นแก่ตัวเกินไปจริงๆ"
1014502-45 = "เป็นเรื่องที่ต้องลงโทษอย่างไม่ต้องสงสัย ต้องล้างจานในจุดที่กำหนด หรือเอาทิชชู่เปียกเช็ดก่อน แล้วค่อยกลับไปล้างที่บ้านสิ ถึงจะถูกต้อง...!"
1014502-46 = "เฮ้อ... หากที่นี่เป็นซานไห่จิงละก็ แค่เรียกมาตักเตือนด้วยวาจาก็น่าจะฟังกันแล้ว"
1014502-47 = "[s] \"แต่ว่า... ถ้าเราเข้าไปว่าอะไร ก็ดูจะไม่ค่อยดีหรือเปล่า?\""
1014502-48 = "แต่ว่า ครู การปล่อยผ่านเรื่องผิดครรลองเช่นนี้ไปเฉยๆ ก็ไม่ใช่สิ่งที่ควรทำไม่ใช่หรือ?"
1014502-49 = "หืม? หรือว่าครูมีแผนอะไร?"
1014502-51 = "(คุณครูเข้าไปสอบถามเรื่องนี้กับทีมดูแลหุบเขาที่สมาคมพ่อค้าเป็นผู้ดูแล)"
1014502-54 = "นี่พวกคุณ ทำแบบนี้ไม่ได้นะครับ ที่นี่เป็นหุบเขาที่ทุกคนมาใช้ร่วมกันนะครับ"
1014502-55 = "ชิ... กะว่าจะล้างจานเงียบๆ ให้ไม่มีใครเห็นแท้ๆ"
1014502-56 = "มีใครแอบไปแจ้งงั้นเหรอ... คงคิดว่าตัวเองดีเลิศเหลือเกินสินะ?"
1014502-57 = "หมดสนุกแล้ว ไปที่อื่นกันเถอะ"
1014502-59 = "มาตั้งเต็นท์ในที่แบบนี้หรือ..."
1014502-60 = "เฮ้อ... ทั้งที่มีป้ายเตือนชัดเจนว่าอย่ากางเต็นท์ใกล้น้ำเช่นนี้แท้ๆ"
1014502-61 = "ทั้งหมดนี้ก็เพื่อความปลอดภัยของตัวเองด้วย เหตุใดจึงไม่เข้าใจกันนะ ไม่สิ หรือว่ารู้อยู่แก่ใจ แต่ก็ยังจงใจเมินเฉยกันแน่"
1014502-62 = "มีคำกล่าวที่ว่า \"กฎทุกข้อถือกำเนิดจากความทรงจำอันเจ็บปวด\" แท้ๆ"
1014502-64 = "(คุณครูเข้าไปสอบถามเรื่องนี้กับทีมดูแลหุบเขาอีกครั้ง)"
1014502-67 = "กางเต็นท์ตรงนี้ไม่ได้นะครับ! ถ้าน้ำเอ่อขึ้นมา จะอันตรายนะครับ!"
1014502-68 = "แต่ตรงนี้ทำเลดีที่สุดเลยนะ..."
1014502-69 = "เข้มงวดชะมัด นี่มันเรื่องของพวกเรา พวกเรารับผิดชอบกันเองได้อยู่แล้วน่า"
1014502-70 = "(ทันใดนั้น กระแสน้ำที่เพิ่มสูงขึ้นอย่างกะทันหันก็ซัดเข้าใส่เต็นท์!)"
1014502-71 = ""
1014502-74 = "อ๊ากกกก?!?!"
1014502-76 = "คะ... ครู?!! รีบไปช่วยกันเถอะ!"
1014502-81 = "(นักท่องเที่ยวได้รับการช่วยเหลืออย่างปลอดภัย...)"
1014502-82 = "(ความใส่ใจของคิซากินั้นละเอียดอ่อนและเอื้อเฟื้ออย่างไม่ต้องสงสัย แต่ก็ดูไม่เหมือนนักเรียนมัธยม#nชั้นปีที่ 3 ธรรมดาเลย)"
1014502-84 = "คิดจะกระโดดน้ำจากที่สูงถึงเพียงนั้นเชียวหรือ...!"
1014502-85 = "น้ำในหุบเขาบางครั้งดูเหมือนจะลึก แต่แท้จริงอาจไม่เป็นเช่นนั้นก็ได้"
1014502-86 = "และแม้จะดูเหมือนตื้น ก็อาจลึกได้ตั้งหลายเมตรนะ...!"
1014502-88 = "(คุณครูเข้าไปสอบถามเรื่องนี้กับทีมดูแลหุบเขา)"
1014502-89 = ""
1014502-90 = ""
1014502-91 = ""
1014502-92 = ""
1014502-93 = ""
1014502-94 = ""
1014502-96 = "(ไม่ว่าคิซากิจะไปที่ไหน เธอก็คอยกังวลกับพฤติกรรมตามอำเภอใจของเหล่านักท่องเที่ยว และต้องไปสอบถามทีมดูแลหุบเขาทุกครั้งไป...)"
1014502-97 = "(ซึ่งไม่ว่าจะมองยังไง ก็ไม่ใช่ท่าทีของนักเรียนมัธยมปลายที่กำลังพักผ่อนอย่างสบายใจเลย...)"
1014502-98 = ""
1014502-99 = "เฮ้อ... ไม่รู้ทำไม เราถึงรู้สึกเหนื่อยขึ้นมานิดหน่อย เหตุใดกันนะ..."
1014502-100 = "[s] \"นี่ คิซากิ\""
1014502-101 = "หืม? มีอะไรหรือ ครู?"
1014502-102 = "ให้เราทำตัวสบายกว่านี้อีกสักหน่อยก็ได้...?"
1014502-103 = "อืม... เราก็คิดว่าตัวเองพยายามทำเช่นนั้นอยู่แล้วนะ"
1014502-104 = "[s5] \"อื้อๆ ครูก็เห็นอยู่\"\n[s6] \"แต่จะปล่อยวางมากกว่านี้อีกหน่อยก็ได้นะ\"\n[s7] \"อย่างเช่น ทำตัวเป็นเด็กให้มากกว่านี้อีกหน่อยไง!\""
1014502-108 = "หากมีใครสร้างความเดือดร้อน ครูก็จะออกหน้าให้เอง... เช่นนั้นหรือ?"
1014502-109 = "ฮืม..."
1014502-110 = "..."
1014502-111 = "เช่นนั้น คำที่ครูพูด ก็อย่างเช่น..."
1014502-113 = "(จู่ๆ คิซากิก็ใช้มือข้างหนึ่งจับมือของคุณครูไว้ แล้วใช้อีกข้างคล้องแขนเข้ามา!)"
1014502-115 = "หมายความว่า เราทำเช่นนี้ก็ได้สินะ?"
1014502-116 = "ฮุฮุ ทำไมถึงตกใจขนาดนั้นเล่า ครู"
1014502-117 = "คนที่บอกให้เราปล่อยวางและทำตัวสบายๆ ให้มากกว่านี้ ก็คือครูไม่ใช่หรือ?"
1014502-119 = "..."
1014502-120 = "อย่างนี้นี่เอง เข้าใจแล้ว"
1014502-121 = "ในที่สุดเราก็พอเข้าใจคำพูดของครูแล้ว แล้วก็..."
1014502-122 = "..."
1014502-123 = "ดูเหมือนว่าวันนี้ เราจะได้หันกลับมามองตัวเองเสียที ว่าตัวเองเป็นเช่นไร"
1014502-124 = "ช่างน่าละอายจริงเชียว"
1014502-125 = "ทั้งที่เราเป็นฝ่ายเอ่ยปากก่อน ว่าอยากใช้เวลาอย่างนักเรียนมัธยมปลายธรรมดาแท้ๆ"
1014502-126 = "แต่หากยังแสดงกิริยาวาจาไม่ต่างจากปกติ นั่นก็ย่อมเป็นความขัดแย้งในตัวเอง"
1014502-127 = "[s8] \"คงเป็นการทำตามนิสัยที่เคยชินโดยไม่รู้ตัวน่ะ!\"\n[s9] \"นิสัยที่เคยชินมันไม่ได้แก้ง่ายๆ นี่นา อื้ม!\""
1014502-130 = ""
1014502-131 = "จริงด้วย นิสัยที่ฝังติดตัวมานาน หากไม่มีใครคอยช่วยอยู่เคียงข้าง ก็ยากที่จะสลัดทิ้งได้"
1014502-132 = "อันที่จริง... ตัวเราเองก็ไม่ได้พูดจาและวางตัวเช่นนี้มาตั้งแต่แรกหรอก..."
1014502-133 = "คำกล่าวที่ว่า หากสวมเสื้อผ้าที่ไม่พอดีตัวนานเกินไป สุดท้ายก็จะค่อยๆ ปรับตัวเข้ากับมันไปเอง"
1014502-134 = "น่าเศร้านะที่ดูเหมือนจะมีความจริงอยู่ไม่น้อยเลย"
1014502-135 = "เช่นนั้น ครู"
1014502-136 = "แม้จะเหลือเวลาเพียงครึ่งวัน..."
1014502-137 = "เราก็อยากให้ครูอยู่ข้างกาย และช่วยให้เราใช้เวลาได้อย่าง 'ธรรมดา'"
