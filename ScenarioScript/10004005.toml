[translation]
10004005-1 = "프롤로그;천사들과 함께하는 삶"
10004005-2 = "산해경 인근 도자기 공방"
10004005-3 = "여러분~ 오늘은 산해경에서 제일가는 도자기 장인이신, '네코타' 선생님의 도자기 공방에 현장학습을 나왔어요."
10004005-4 = "특별히 현장학습을 허락해주신 네코타 선생님께 다시 한번 감사를 드리며, 도자기가 어떻게 만들어지는지 함께 배우도록 해요!"
10004005-5 = "네~!"
10004005-6 = "네코타 선생님, 오늘 공방 현장학습을 허가해주셔서 정말 감사합니다."
10004005-7 = "아닐세, 그렇게 어려운 일도 아니었는걸."
10004005-8 = "어린 아이는 학원의 미래. 오히려 이번 현장학습으로 매화원의 아이들이 새로운 꿈을 갖게 된다면 내가 더 기쁠걸세."
10004005-9 = "후후, 그렇지요. 아이들의 꿈과 미래는 소중하니까요."
10004005-10 = "그럼 어디부터 먼저 견학을 해 볼까요?"
10004005-13 = "네코타 선생님, 이 진흙 컵은 뭔가요?"
10004005-14 = "오오, 그건 이번 전시회에 출품할 새로운 형태의 도자기로……"
10004005-15 = "아하하, 표면이 말랑말랑 부드러워 보여~!"
10004005-16 = "에잇~!"
10004005-18 = "10시간 걸려 만든 도자기 원형에 손자국이!!"
10004005-19 = "여, 여러분! 네코타 선생님의 작품에 손을 대면 안 돼요!"
10004005-20 = "죄, 죄송합니다. 아이들을 좀 더 확실히 인솔했어야 하는데……."
10004005-21 = "으으… 아니, 괜찮네. 어차피 깨질 때를 대비해서 여분의 원형을 만들어 두었으니까……."
10004005-23 = "……그, 그보다 저기 가마 위에 올라가 있는 것도 매화원 학생들 아닌가?!"
10004005-24 = "와~ 높다, 높아!"
10004005-25 = "여, 여러분! 가마 위는 위험하니까 올라가면 안 돼요!"
10004005-26 = "으앙, 언니! 얘가 저한테 자꾸 진흙공을 던져요!"
10004005-27 = "하지만 얘가 먼저 저한테 수류탄을 던졌다고요!"
10004005-28 = "치, 친구에게 진흙공이나 수류탄을 던지면 안 돼요!"
10004005-32 = "여기가 도자기를 굽는 가마인가?"
10004005-33 = "응, 그런데 어쩐지 불이 약해 보여……."
10004005-34 = "좋아, 우리가 네코타 선생님을 도와주자!"
10004005-38 = "가마에 백린 연막탄을 던지면 안 돼요!!"
10004005-39 = "아아, 가마가…… 내 공방이…… 불타고 있어……!"
10004005-40 = "슌 언니, 나 화장실~!"
10004005-41 = "나는 집에 갈래~"
10004005-44 = "모두, 마음대로 움직이지 말고 지시를 따라주세요!"
