[translation]
10015010-1 = "1화;밀레니엄의 마이스터"
10015010-2 = "밀레니엄 공업 실습실"
10015010-3 = "대운동회 준비를 위해 가장 먼저 해결해야 할 문제는……"
10015010-4 = "역시 파손된 응원 로봇을 수리하는 일이겠지요."
10015010-5 = "유우카 쨩은 '사소한 폭발'이라고 말했었지만, 로봇의 파손 상태는 사소하지 않은 것 같네요."
10015010-6 = "최악의 경우에는 수리를 하는 것보다 새로 처음부터 만드는 게 빠를지도……"
10015010-7 = "[s] \"내일 아침까지 가능할까……?\""
10015010-8 = "통상의 경우는 불가능하다고 답하겠습니다만…… 이번에는 괜찮습니다."
10015010-9 = "어떠한 고장이라도 단시간에 수리하는, 밀레니엄 제일의 '마이스터' 집단을 불렀으니까요."
10015010-10 = "바로…… <엔지니어부> 여러분입니다!"
10015010-17 = "후후, 기계의 제작과 수리와 관련된 일이라면 저희에게 맡겨주세요!"
10015010-18 = "응원용 로봇의 수리라면 간단한 일이니까……."
10015010-19 = "우리가 갖고 있는 장비를 모두 동원한다면 반나절로도 충분하지."
10015010-21 = "갑작스러운 부탁이었는데 선뜻 들어주셔서 감사합니다. 엔지니어부 여러분."
10015010-22 = "덕분에 수리에 관한 문제는 한시름 놓을 수 있게 되었네요."
10015010-23 = "뭘 이 정도 가지고."
10015010-24 = "엔지니어부 또한 밀레니엄 학원의 일원. 성공적인 대운동회 개최를 위해서라면 어떤 협력도 아끼지 않을게."
10015010-25 = "……오히려 그동안 대운동회를 준비하면서 세미나가 어째서 우리에게 도움을 요청하지 않았는지가 더 의아할 정도인걸."
10015010-26 = "애초에 로봇의 제작을 우리에게 맡겨주었더라면, 어지간한 폭발에는 끄떡도 없을 정도의 튼튼한 로봇을 만들어 주었을 텐데……"
10015010-28 = "………."
10015010-30 = "……아마 그동안 엔지니어부가 납품해 온 물건들 때문이 아닐까요?"
10015010-31 = "……우리가 납품한 물건?"
10015010-32 = "그동안 엔지니어부에서 만들어 온 물건에 결함은 없었을 텐데……"
10015010-33 = "결함이라기보다는, 예상치 못했던 추가 기능 때문에 사고가 벌어진 경우가 몇 번 있었죠."
10015010-34 = "예를 들자면, 세미나 공용 휴게실의 커피 머신에 달린 커다란 드릴이라든가……"
10015010-36 = "그건 드릴이 아니라 커피 원두 분쇄용 그라인더예요!"
10015010-37 = "다이아몬드만큼이나 단단한 경도의 톱날이 내장되어 있기 때문에, 많은 양의 원두도 순식간에 갈아낼 수 있답니다!"
10015010-38 = "미화 정비용 자동 청소기에 달린 화염방사기라든가……?"
10015010-39 = "이동식 청소기가 흡입할 수 있는 쓰레기에는 한계가 있으니까……"
10015010-40 = "타는 쓰레기는 그 자리에서 소각하는 게 처리하기에 더 편리해."
10015010-41 = "뭐, 저도 인상적이고 재미있는 발상이라고 생각했지만, 유우카 쨩은 그렇게 생각하지 않은 모양이라서요."
10015010-42 = "게다가 그 추가 기능 때문에 세미나의 임원이 커피를 마시려다 휴게실의 벽에 커다란 구멍을 낸 사고도 있었고……"
10015010-43 = "본래 새로운 기술을 정착시키기 위해서는 대가를 지불해야 하는 법……"
10015010-44 = "비용과 실패를 두려워해서는 패러다임의 전환을 이뤄낼 수 없다고!"
10015010-45 = "후후. 저도 그 생각에는 십분 공감하지만, 유우카 쨩이 그 말을 들으면 눈에 불을 켜고 영수증을 들고 달려올 테니 이 이야기는 여기서의 비밀로 하도록 하죠."
10015010-47 = "그럼 일단은 우선 파손된 응원 로봇의 상태부터 확인해 볼까?"
10015010-48 = "으음…… 이거 생각보다 상태가 심각한데요. 폭발로 인한 충격 때문에 축이 통째로 망가져서 관절부를 모두 교체해야겠어요."
10015010-49 = "게다가 회로 기판도 통째로 불에 그을려서, 처음부터 납땜 작업을 해야겠어……."
10015010-50 = "우발적인 사고라고 들었는데 하필이면 수리하기 어려운 바이탈 파트만 의도한 것처럼 집중적으로 파손되다니……"
10015010-51 = "……단순한 폭발 사고라고 하기에는 의심스러운 부분이 많은걸."
10015010-53 = "저도 의심스러운 부분은 있습니다만. 지금으로서는 물증도, 증거를 조사할 시간도 없으니까요."
10015010-54 = "이 문제는 축제를 진행하며 천천히 조사해보도록 하죠."
10015010-55 = "……그래서 수리에는 얼마나 시간이 소요될 것 같나요?"
10015010-56 = "수리를 한다면 개회식 시간에 맞추어 아슬아슬하게 끝낼 수 있을 것 같지만……"
10015010-57 = "아예 새로 만들게 해준다면 3시간 내로 완성해볼게."
10015010-58 = "네? 아예 새로 처음부터 로봇을 만드시겠다고요?"
10015010-59 = "세미나의 입장에서는 상관없습니다만…… 비용과 시간은 괜찮으신가요?"
10015010-60 = "그건 괜찮아요. 안 그래도 마침 신형 전차를 개조하기 위해 준비한 부품이……"
10015010-66 = "……아니, 마침 '예비 부품'이 남아있던 참이라서요!"
10015010-67 = "후후, 엔지니어부 여러분이 먼저 의욕적으로 작업에 임해 주시니 저도 기쁘네요."
10015010-68 = "다만, 로봇을 처음부터 설계하시겠다면 몇 가지 조건이 있습니다."
10015010-70 = "……조건?"
10015010-71 = "네. 갑작스럽게 부탁드리긴 했지만, 일단 이 응원 로봇도 세미나의 이름으로 발주하는 '상품'이니까요."
10015010-72 = "상품을 발주하는 클라이언트로서 몇 가지 희망 사항을 요청하는 정도는 괜찮겠지요?"
10015010-73 = "너무 무리한 부탁만 아니라면."
10015010-74 = "첫 번째 조건은…… 튼튼할 것."
10015010-75 = "지난번 응원 로봇이 불의의 사고로 파손된 만큼, 새로 제작하는 응원 로봇은 어지간한 외부 충격에도 견딜 수 있을 만큼 튼튼했으면 좋겠네요."
10015010-76 = "그거라면 안심해도 좋아. 엔지니어부에서 만든 로봇들은 튼튼하기로 정평이 나 있으니까."
10015010-81 = "으음…… 아연 강판과 세라믹을 덧대 복합 장갑을 만드는 게 좋으려나요?"
10015010-82 = "복합 장갑을 쓰는 게 방호력은 나쁘지 않겠지만 충전재가 많아지면 로봇의 크기가 불필요하게 커질 수 있으니까……"
10015010-83 = "강판을 압연해서 구조를 균질화하는 방식은 어떨까……?"
10015010-85 = "두 번째 조건은…… 어떤 지형이든 자유롭게 오르내릴 수 있을 것."
10015010-86 = "회장에는 계단을 포함하여 바퀴로 지나갈 수 없는 지형이 많이 있으니까요. 어떤 상황에서도 고립되지 않고 이동할 수 있는 능력이 있었으면 좋겠습니다."
10015010-88 = "까다롭긴 하지만…… 그것도 어렵진 않아. 괜찮아."
10015010-91 = "역시 사족 보행형 로봇으로 제작해야 할까요? 자세 제어 학습에 걸리는 시간을 고려하면 너무 시간이 오래 걸릴 것 같은데……"
10015010-92 = "……그럴 때는 무한궤도를 쓰면 돼."
10015010-93 = "바퀴 위에 궤도를 붙여 접지력을 높인 무한궤도라면, 높은 경사나 장애물이 있어도 손쉽게 돌파할 수 있으니까……"
10015010-94 = "[s] \"뭔가 불길한 예감이……\""
10015010-96 = "그리고 가장 중요한 마지막 조건입니다만…… 기한 내에 완성시킬 것."
10015010-97 = "……기한이라면?"
10015010-98 = "알고 계시겠지만 대운동회의 개최까지 이제 시간이 얼마 남지 않았습니다."
10015010-99 = "작품의 완성도는 들인 시간에 비례한다고 하지만, 아무리 좋은 작품이라도 제시간에 선보이지 못한다면 의미가 없으니까요."
10015010-100 = "그야 당연하지. 마감 엄수는 프로의 기본 소양이니까."
10015010-101 = "엔지니어부의 명예를 걸고서라도 기한 내에 완벽한 응원 로봇을 만들어 보이겠어."
10015010-102 = "후후, 그렇게 말씀해 주시니 든든하네요."
10015010-103 = "[s] \"내가 도와줄 일은 없는 거야?\""
10015010-104 = "음, 문제없어. 이 정도 규모의 로봇을 만드는 건 우리 세 사람이 그동안 자주 해 온 일이니까."
10015010-106 = "오히려 로봇 제작에는 날카로운 공구를 많이 사용하기 때문에 선생님이 곁에 계시면 위험할 수도 있어요."
10015010-107 = "……그러니 선생님은 노아 선배와 다른 학생들을 도와줘."
10015010-109 = "그럼 저와 선생님은 다른 업무를 처리하기 위해 잠시 자리를 비우겠습니다."
10015010-110 = "3시간 뒤에 다시 엔지니어부 부실을 방문할 예정이니, 그때까지 수리를……"
10015010-111 = "아니, 로봇의 제작을 잘 부탁드리겠습니다."
10015010-118 = "후후. 세미나의 의뢰로 로봇을 만드는 건 정말 오랜만이네요."
10015010-119 = "게다가 대운동회에서 사용되는 응원 로봇이라면 키보토스의 모든 학생 앞에서 저희의 발명품을 선보일 기회잖아요?"
10015010-120 = "그러니 저희가 새로 개발한 신기술을 잔뜩 시험해 보도록 하죠!"
10015010-121 = "나는 전에 개발한 자이로 센서의 안정성을 시험해 보고 싶어……"
10015010-122 = "자, 자. 다들 진정해."
10015010-123 = "우선, 이번 작업을 시작하기에 앞서 모두에게 할 말이 있어."
10015010-126 = "키보토스 대운동회는 2년에 한 번 열리는 전 키보토스 규모의 이벤트……"
10015010-127 = "이 행사를 성사하기 위해 그동안 세미나의 임원들이 들인 노력은 이루 말할 수 없을 정도지."
10015010-128 = "아무리 기술의 발전을 위해서라지만, 우리의 사욕을 챙기기 위해 이들의 노력을 물거품으로 만들어 버린다면 그건 염치없는 일이야."
10015010-129 = "그러니 이번만큼은 대운동회의 성공을 위해서 우리도 조금은 배려하도록 하자."
10015010-130 = "으음…… 그렇다면 어쩔 수 없네요."
10015010-131 = "우리도 그 정도까지 눈치 없는 사람들은 아니니까……"
10015010-132 = "……오늘은 부장의 말을 따를게."
10015010-133 = "다들 이해해줘서 고마워."
10015010-134 = "자, 그럼 우선 가볍게……"
10015010-135 = "전면에 15mm 기관포부터 설치해 볼까?"
10015010-138 = "네!"
