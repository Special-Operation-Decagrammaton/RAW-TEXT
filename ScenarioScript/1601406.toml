[translation]
1601406-1 = "이부키와 함께 산수 교실!"
1601406-2 = "(이부키의 연락을 받고 게헨나 학원의 만마전 휴게실로 향했다.)"
1601406-7 = "앗! 선생님! 와줘서 고마워!"
1601406-8 = "기다리고 있었어!"
1601406-9 = "[s1] \"이부키가 하고 싶은 걸 정했어?\"\n[s2] \"이부키가 좋아하는 걸 찾았어?\""
1601406-12 = "응! 저번에 선생님이랑 여기저기 다녀온 뒤에, 계속 생각했어."
1601406-13 = "이것도 재미있어 보이고, 저것도 재미있어 보여서 고르기가 쉽지 않았어……."
1601406-14 = "경찰도 되고 싶고, 요리사도 되고 싶고, 전차장도 되고 싶고……."
1601406-15 = "그런데 있잖아, 선생님? 신기한 일이 있었다?"
1601406-16 = "마구마구 생각하다 보니, 선생님이 떠오르는 거야!"
1601406-17 = "[s] \"내가?\""
1601406-18 = "응! 선생님은 이부키의 마음을 이해해 주기도 하고,"
1601406-19 = "샬레를 놀이공원으로 만들기도 하고,"
1601406-20 = "이부키가 뭘 하고 싶은지. 여러 가지 가르쳐 주기도 했었고!"
1601406-21 = "그래서……."
1601406-22 = "이부키도, 언젠가 선생님처럼 되고 싶다고 생각했어!"
1601406-23 = "[s] \"이부키 선생님이라…… 기대되는걸?\""
1601406-24 = "헤헤, 정말?"
1601406-25 = "그래서 말인데, 선생님한테 보여주고 싶은 게 있어!"
1601406-26 = "사실 이걸 보여주려고 선생님을 초대한 거야!"
1601406-27 = "[s] \"뭔데? 궁금한걸?\""
1601406-28 = "이쪽이야!"
1601406-31 = "이부키의 산수 교실에 초대합니다!"
1601406-34 = "[wa:900]― [log=이부키]오늘은 [wa:750]이부키가 선생님이야![/log]"
1601406-35 = "[wa:2800]― [log=이부키]지금부터……[wa:1390] 산수 수업을 하겠습니다![/log]"
1601406-38 = "[wa:800]― [log=이부키]이부키,[wa:640] 산수는[wa:480] 자신 있어![/log]"
1601406-41 = "― [log=이부키]어제[wa:260] 시험에서 100점을 맞아서[/log]"
1601406-42 = "[wa:1360]― [log=이부키]칭찬 도장도 받았어~![wa:160] [/log]"
1601406-45 = "[ns] \"굉장해. 역시 이부키 선생님!\""
1601406-46 = "[wa:800]― [log=이부키]에헤헤…… [wa:1630]그럼 [wa:340]선생님에게,[/log]"
1601406-47 = "[wa:1410]― [log=이부키]이부키 선생님의[wa:1210] 문제입니다![wa:160] [/log]"
1601406-50 = "― [log=이부키]여기! [wa:530]아이스크림 2개랑[/log]"
1601406-51 = "[wa:1290]― [log=이부키]푸딩 1개가 있습니다.[/log]"
1601406-54 = "[wa:100]― [log=이부키]전부 [wa:350]몇 개일까요~?[/log]"
1601406-57 = "[ns] \"둘이 합쳐서…… 총 3개……?\""
1601406-58 = "[wa:1200]― [log=이부키]때앵-! [wa:580]아깝다![/log]"
1601406-59 = "[wa:1990]― [log=이부키]정[wa:540]답[wa:310]은~[/log]"
1601406-62 = "[ns] \"과연, 정답은……?\""
1601406-63 = "[wa:900]― [log=이부키]'간식이 3개나 있으면 [wa:2200]너무 행복해~' [wa:2660]야![/log]"
1601406-66 = "― [log=이부키]아! [wa:820]먹고 나면,[/log]"
1601406-67 = "[wa:1230]― [log=이부키]양치하는 거 잊지 마![/log]"
1601406-70 = "― [log=이부키]이부키는 말야, [wa:1070]매일 3번,[/log]"
1601406-71 = "[wa:1190]― [log=이부키]제대로 [wa:200]양치질하고 있어![/log]"
1601406-75 = "이부키의 수업은 어땠어, 선생님?"
1601406-76 = "[s] \"멋진 선생님의 멋진 수업이었어.\""
1601406-77 = "헤헤, 정말?"
1601406-78 = "응, 언젠가 이부키가 선배들만큼, 선생님만큼 크면 말야."
1601406-79 = "그때는 꼭, 선생님 같은 어른이 되고 싶어!"
1601406-80 = "[s] \"이부키라면 꼭 될 수 있을 거야.\""
1601406-81 = "정말~?"
1601406-82 = "에헤헷, 응! 고마워, 선생님!"
1601406-92 = "이부키! 잔뜩 노력할게~!"
1601406-94 = "(이후로도 한동안, 작은 교실에서 이부키 선생님의 수업을 들었다.)"
