[translation]
12050-1 = "제5화;각자의 이야기들 2"
12050-2 = "카이저 컨스트럭션……? 카이저 그룹이요……?!"
12050-3 = "아비도스 자치구가 카이저의 소유라고요?!"
12050-4 = "그럼 시바세키 라멘집도……?"
12050-5 = "……네. 라멘집 건물도 이미 카이저 그룹의 소유였어요……. 퇴거 명령도 이미 예전에 내려진 상태였다고……"
12050-6 = "그래서 이제 마스터는 가게를 접기로 했대요……. 언젠가는 벌어질 일이었다고……."
12050-7 = "……."
12050-8 = "……!!"
12050-9 = "뭐어-?!"
12050-10 = "그, 그런……. 라멘집이……."
12050-11 = "……그 뿐만 아니라 이미 사막이 되어버린 아비도스의 본관과, 그 주변의 황야 수천만 평,"
12050-12 = "그리고 아직 사막화가 진행되지 않은 시내의 건물과 토지까지…… 거의 대부분의 소유가 넘어가 있었어요……."
12050-13 = "소유권이 아직 넘어가지 않은 건 이 학교 본관과 주변 일부 밖에……."
12050-14 = "그, 그치만, 이런 일이 어떻게 가능한 거죠? 학원 자치구의 토지가 거래 가능할 리가……."
12050-15 = "대체 누가 그런 짓을……."
12050-16 = "……아비도스 학생회, 겠지."
12050-17 = "……!"
12050-18 = "학교 자산의 의결권은 학생회가 가지고 있으니까. 그게 가능한 건 학생회 뿐일 거야."
12050-19 = "……네. 맞아요. 거래의 주체는 아비도스 전 학생회였어요."
12050-20 = "그러나…… 아비도스 학생회는 이미 2년 전에 없어졌잖아요……."
12050-21 = "……네. 그래서 학생회가 없어진 뒤에는 더이상의 거래는 없었어요."
12050-22 = "그런가……. 2년전이라면……."
12050-23 = "무슨 짓을 한 거야, 그 학생회 놈들은!!"
12050-24 = "학교의 땅을 팔아? 그것도 카이저 컴퍼니에?!"
12050-25 = "학교의 주인은 학생이라고! 어째서 그런 짓을……!!"
12050-26 = "……."
12050-27 = "이런 큰 일이 있었는데도 저희는 전혀 모르고 있었다니……."
12050-28 = "……자치구는 학교의 것. 너무 당연한 상식이라, 우리는 학교의 빚에만 신경쓰고 있었지 학교의 자산에는 전혀 신경쓰지 않았어요."
12050-29 = "제가 조금만 더 빨리 알아차렸다면……."
12050-30 = "……아니. 알았다고 해도 소용없었겠지."
12050-31 = "이건 아야네 쨩이 입학하기도 전…… 아니, 대책위원회가 생기기도 전의 일이니까."
12050-32 = "호시노 선배. ……뭔가 알고 있는 게 있어?"
12050-33 = "아. 맞아요! 호시노 선배도 아비도스 학생회였죠?"
12050-34 = "어? 진짜? 그랬어?"
12050-35 = "네. 직책도 부학생회장이었다고……. 최후의 학생회의……."
12050-37 = "……아아. 뭐. 그렇긴 한데. 2년 전이라면 나도 직접 만나본 선배들은 아냐."
12050-38 = "내가 학생회에 들어갔을 때는 이미 전임 임원은 전부 사퇴한 뒤였거든."
12050-39 = "재학생 숫자도 두자리 이하로 떨어져 있었고, 교직원도 하나도 없고, 수업은 끊긴지 오래."
12050-40 = "학생회실도 텅텅 빈 창고 같은 곳이었고, 전임자들이 남긴 건 서류 한 장도 없었지. 사막화를 피해 학교 건물을 몇번이나 옮기던 때였으니까."
12050-41 = "최후의 학생회라고 해봤자 신임 학생 회장과 나뿐이었고."
12050-42 = "……학생 회장은 무턱대고 학생회를 떠안은 전교 꼴찌의 바보에다가, 나는 성격 나쁜 신입생."
12050-43 = "이야, ……모든 게 엉망진창이었지."
12050-44 = "전교 꼴지가 학생 회장이었다고……? 어떻게 생겨먹은 학생회인 거야……?"
12050-45 = "성적과 역할은 별개의 것이야. 세리카."
12050-46 = "세리카 쨩도 성적은 좀……."
12050-47 = "아, 알고 있어!! 갑자기 내 성적 얘기가 왜 나오는 거야!! 그냥 해본 얘기라고!"
12050-48 = "으헤~ 아냐. 맞는 말이야. 이름만 학생회였지 그냥 바보들의 모임이었으니까."
12050-49 = "얼떨결에 학생회에 가입해서…… 이야, 그때 엄청 이리저리 돌아다녔는데."
12050-50 = "그것도 모르고 말이지……. 바보였다니까, 진짜."
12050-51 = "……."
12050-52 = "호시노 선배……."
12050-53 = "……. 호시노 선배가 자책할 일은 아니야."
12050-54 = "실제로 학생회가 해산되고나서도, 아비도스에 대책위원회가 생길 수 있었던 건 호시노 선배 덕분이니까."
12050-55 = "으응……?"
12050-56 = "……호시노 선배가 게으른 건 맞지만, 중요한 순간에는 언제나 가장 먼저 앞장 서 왔어."
12050-57 = "네. 세리카 쨩이 행방불명되었을 때도 가장 먼저 선생님에게 도움을 청한 게 호시노 선배였고……."
12050-58 = "그랬던가? 기억이 잘……."
12050-59 = "[s] \"그래, 맞아.\""
12050-60 = "어…… 진짜?!"
12050-61 = "호시노 선배는 글러먹었지만 존경할 수 있는 사람이라고 생각해."
12050-62 = "그건 칭찬인지 욕인지 잘 모르겠는데……."
12050-63 = "뭐, 뭐지?! 갑자기 시로코 쨩이 낯뜨거운 대사를 하고 있어?! 아저씨는 이런 분위기는 엄청 불편한데-?!"
12050-64 = "……. 음. 그냥. 이 얘기를 하고 싶었던 것뿐이야."
12050-65 = "……으, 으음?"
12050-66 = "……."
12050-68 = "……그럼 전 학생회는 왜 땅을 카이저에 팔았던 걸까요?"
12050-69 = "뻔하지. 카이저와 한패였던 거야."
12050-70 = "아뇨…… 그건 아닐 거예요."
12050-71 = "아아. 나도 잘 알지 못하는 선배들이었지만, 그래도 학교를 위해 애썼던 사람들은 맞을 거야."
12050-72 = "아마도 그건, 빚을 갚으려고 한 거겠지……."
12050-73 = "빚을……."
12050-74 = "네. 저도 그렇게 생각해요. 그때도 이미 학교의 빚은 어마어마한 상태였으니까."
12050-75 = "하지만 헐값에 넘긴 거라 원금은커녕, 불어나는 이자도 감당하지 못했을 테고……."
12050-76 = "그렇게 계속 땅을 팔아 넘긴 건가요……."
12050-77 = "그게 뭐야……. 이상하잖아 그거……."
12050-78 = "[s] \"토지 강탈 수법의 일종이야.\""
12050-79 = "응? 선생님, 그게 뭐야?"
12050-80 = "[s] \"아비도스는 질 나쁜 함정에 걸린 거였어.\""
12050-81 = "으, 으응?"
12050-82 = "……아아."
12050-83 = "과연, 그런가."
12050-84 = "……아비도스에 돈을 빌려준 것도 카이저였지."
12050-85 = "……!!"
12050-86 = "그렇다는 건……."
12050-87 = "카이저 론이 학교에 감당하지 못할 돈을 빌려주고, 불어나는 이자를 땅을 팔게 해서 갚게 한다."
12050-88 = "……네. 아마 처음엔 쓸모없는 사막과 황야의 땅을 팔라고 했겠죠……."
12050-89 = "어차피 사막화로 인해 쓸모 없는 땅. 그런 제안이라면 누구라도 혹했을 거예요……."
12050-90 = "하지만 그런 헐값으로 팔아봤자 빚은 줄어들지 않고, 넘어가는 땅은 점점 더 많아지며……"
12050-91 = "아비도스 자치구는 천천히 카이저의 것이 된다……."
12050-92 = "그래. 이건 그런 방식이었구나."
12050-93 = "……그렇다면, 애초에 아비도스에 돈을 빌려준 것 자체가…… 땅을 빼앗기 위해서……."
12050-94 = "아주 오래 전부터 준비해둔 함정이었던 거네. 이미 수십 년 전부터……."
12050-95 = "그 정도로 거대한 규모의 계획이었던 거야……."
12050-96 = "그게 뭐야!! 단순히 카이저 놈들 손에 놀아난 것뿐이잖아!"
12050-97 = "그 학생회라는 녀석들이 대체 얼마나 무능했길래……!! 그 녀석들이 이런 사기에 속지만 않았어도……!!"
12050-98 = "[s] \"아니, 그건 아니야.\""
12050-99 = "선생님……?"
12050-100 = "[s] \"나쁜 건 속인 녀석들이야. 속은 걸 비난해선 안돼.\""
12050-101 = "……."
12050-102 = "……."
12050-103 = "……아, 아니. 나도 알고 있다고! 나, 나도 가끔 게르마늄 팔찌 같은 걸 사니까! 누구보다 잘 알아! 나쁜 건 속인 녀석들이라는 걸!"
12050-104 = "그치만……."
12050-105 = "어쩐지 분해……. 어째서……."
12050-106 = "이렇게 고통받고 있는 아비도스에 어째서 이렇게까지 심한 짓을……."
12050-107 = "세리카 쨩……."
12050-108 = "[s] \"…….\""
12050-109 = "……."
12050-110 = "……."
12050-111 = "……고통받고 있는 사람들은 절박해지거든."
12050-112 = "응?"
12050-113 = "그리고 절박한 사람들은…… 무엇이든 하려고 하니까."
12050-114 = "으헤~ 누구에게 들었던 말이야. 그냥 그런 거야. 세리카 쨩."
12050-116 = "학교의 빚…… 아비도스가 처한 상황. 그리고 우리가 선생님과 함께 찾아낸 실마리들."
12050-117 = "이 모든 게 지금 연결이 되기 시작했어요."
12050-118 = "카이저 코퍼레이션은 학생회가 사라지고 나서 더이상 땅을 구입할 수 있는 방법이 없게 되자……."
12050-119 = "아직 가지지 못한 마지막 땅인 이 학교를 빼앗기 위해서, 폭력단을 고용해 우리를 괴롭혀 온 거였어요!"
12050-120 = "결국 카이저 코퍼레이션이 원한 것은…… 돈이 아니라, 땅이었던 거예요!"
12050-122 = "하지만…… 어째서 땅일까요?"
12050-123 = "아비도스의 자치구는 대부분이 황야와 사막, 모래로 뒤덮인 폐허인데……."
12050-124 = "그, 그러게요…… 이런 곳의 땅을 빼앗는다고 해서 무슨 이득이 있을 것 같진 않은데……."
12050-125 = "[s] \"거기에 대해선 내가 들었던 정보가 있어.\""
12050-126 = "……선생님?"
12050-127 = "[s] 히나에게 들었던 정보를 들려준다."
12050-130 = "……. 샬레의 선생."
12050-131 = "이건 아직 판데모니움도, 티파티도 모르고 있는 정보이지만."
12050-132 = "……당신에겐 알려줘야 할 것 같다는 생각이 들었어."
12050-133 = "아비도스의 버려진 사막……. 거기에 카이저 코퍼레이션이 무슨 짓을 벌이고 있는 것 같아."
12050-135 = "버려진 사막에……."
12050-136 = "카이저가……."
12050-137 = "무슨 짓을 벌이고 있다고요……?"
12050-138 = "그, 그걸 어떻게 게헨나의 선도부장이……."
12050-139 = "어째서 선생님에게……?"
12050-140 = "답답하네! 그럼 뭘 망설여!"
12050-141 = "아비도스의 사막은 우리 자치구잖아! 가보면 되잖아!"
12050-142 = "거기에 뭐가 있는지 궁금하면, 두 눈으로 직접 확인해보면 되는 거야!"
12050-143 = "……음."
12050-144 = "……이야, 세리카 쨩. 간만에 정답이야. 굳세게 자라줬구나. 이 엄마는 기쁘단다. 감동이야."
12050-148 = "뭐야, 이 분위기는! 뭔가 응원받고 있는 것 같잖아!"
12050-149 = "아, 아하하……."
12050-150 = "네. 세리카 쨩 말이 맞아요."
12050-153 = "[ns1] \"그럼 바로 출발하자.\"\n[ns2] \"아비도스 사막으로.\""
12050-158 = "네!"
12050-161 = "……선생님."
12050-162 = "출발하기 전에, 잠깐만 시간을 내 줘."
12050-163 = "……상담할 게 있어."
12050-164 = "[s] 시로코를 따라간다."
12050-168 = "……."
12050-169 = "이거."
12050-170 = "[s] 시로코가 내민 종이를 받는다."
12050-171 = "……호시노 선배의 가방에서 발견한 거야."
12050-175 = "[ns] \"탈퇴서…… 대책위원회 타카나시 호시노……?\""
12050-176 = "(끄덕) ……."
12050-177 = "대책위원회의 탈퇴서야."
12050-178 = "아무에게도 말하지 않았어……. 하지만 호시노 선배는 알고 있을 거야. 내가 자기 가방을 뒤졌다는 걸."
12050-179 = "[s] \"어째서 가방을……?\""
12050-180 = "……어제 선도부의 습격을 받았을 때. 선배가 그렇게 오래 자리를 비운 적은 없었어."
12050-181 = "아무리 생각해도 납득이 되지 않아서, 선배의 가방을 뒤졌더니 저런게 나왔어."
12050-182 = "……미안해. 납득이 안되면 바로 범죄냐! 하고 혼내도."
12050-183 = "[s3] \"……혼내는 건 조금 이따가.\"\n[s4] \"일단은 비밀로 하고 있어.\""
12050-184 = "응…… 호시노 선배…… 뭔가 우리에게 숨기고 있는 게 있는 거 같아."
12050-185 = "응…… 호시노 선배…… 뭔가 우리에게 숨기고 있는 게 있는 거 같아."
12050-188 = "……."
12050-190 = "다음화;아비도스 사막으로 1"
