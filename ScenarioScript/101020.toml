[translation]
101020-1 = "제2화;파국"
101020-3 = "백일몽 속의 어딘가"
101020-5 = "……."
101020-6 = "……."
101020-7 = "당신은…… 게다가 여기는 대체……."
101020-8 = "잠깐. 자네…… 몸이……"
101020-12 = "자네, <색채>와 조우했군?"
101020-16 = "헌데 이상하군……. 색채와 조우했으면서도 이 정도의 정신을 유지할 수 있다니……."
101020-17 = "색채라는 건……."
101020-18 = "그것은 말하자면 키보토스 외부에서 도래하는 이해할 수 없는 힘."
101020-19 = "그 자체가 인격이나 의지를 가진 것인지는 알 수 없지만……"
101020-20 = "중요한 건 그것이 이 키보토스의 주민들에게는 치명적인 독이라는 게지."
101020-21 = "색채에 노출된 사람은 육체는 뒤틀리고 정신은 조각나버리게 된다네."
101020-22 = "키보토스의 주민이라면 다행히 죽지는 않겠지만…… 그 이후엔 존재가 왜곡되어 전혀 다른 존재가 되어버리지."
101020-23 = "하지만, 색채가 이 키보토스를 찾아내는 일은 불가능에 가까워."
101020-24 = "해변의 모래밭에서 소금 한 조각을 찾아내는 일이랄까. 기적, ……그래, 나쁜 기적과도 같은 일이지."
101020-25 = "게다가 자네의 몸 상태를 보면 그 색채와 완전하게 접촉한 건 아닌 것 같은데……. 무슨 일이 있었던 겐가?"
101020-26 = "그건……."
101020-27 = "아, 가만히 있어보게. 내가 확인해보지."
101020-36 = "어디 보자……. 잠깐 실례하겠네. 트리니티의 예언자여."
101020-37 = "……."
101020-42 = "당신은 <의식>에 휘말렸으니까요. 키보토스 외부로 통하는 창문에 얼굴을 내민 거나 다름없죠."
101020-43 = "당신의 존재는 마치 어둠 속의 등불처럼 눈에 띄었을 겁니다."
101020-46 = "……<그것>에게 말이죠."
101020-47 = "<그것>에게 노출된 당신의 [ruby=mystery]신비[/ruby]는 [ruby=terror]공포[/ruby]로 반전되고, 그 이면의 원리가 당신을 지배하기 시작한 것이죠."
101020-49 = "……누군가 색채를 이용해서 자신을 변화시키려고 했었군."
101020-50 = "그자는 색채를 이곳으로 부르는 의식을 치렀지만 그 의식은 불완전했고…… 다행히 그 의식은 취소되었군."
101020-51 = "……그렇구만. 자네는 색채와 직접 조우한 건 아니었어."
101020-52 = "자네는 <백일몽> 속에서, <의식>이라는 창문을 통해 그것을 훔쳐본 것뿐."
101020-53 = "그러니 자네는 아직 무사할 수 있었던 거지."
101020-54 = "……."
101020-55 = "하지만 그것도 시간문제. 자네의 정신은 지금 여기에 있지만 자네의 육체는 지금도 붕괴되고 있을 터."
101020-56 = "그, 그런……! 저는 지금 중요한 일이 있습니다! 지금 저의 친구가…… 그리고……"
101020-57 = "이, 이걸 막을 방법은 없나요?"
101020-58 = "없어."
101020-62 = "……원래였다면 말야."
101020-63 = "하지만 지금 자네에겐 하나의 행운이 뒤따랐네. 바로 백귀야행의 대 예언가인 나, 쿠즈노하를 만난 것이지."
101020-64 = "……. 쿠즈노하."
101020-65 = "내가 자네를 무사히 돌려보내 주겠네. 하지만 거기엔 대가가 있어."
101020-66 = "대가……?"
101020-67 = "자네를 구성하는 본질 중 하나를 버려야 하네. 그래, 자네의 경우엔 그 미래를 보는 힘이겠지."
101020-68 = "색채는 우리의 본질을 왜곡시키지. 아니, 수면 아래에 있던 것을 끄집어낸다고 해야 할까? 어느 쪽이든 지금의 자기 자신이 아니게 되는 건 마찬가지겠지만."
101020-69 = "그렇게 하면 자네는 색채의 침식에서 벗어날 수 있을 게야."
101020-70 = "자아, 어떻게 하겠나? 이 거래에 응하겠나? 트리니티의 예언자여."
101020-76 = "하겠어요."
101020-77 = "과연. 망설임이 없구만. 친구를 위해서인가. 좋구만. 좋네."
101020-79 = "……그럼 작별이라네, 세이아. 아, 돌아가서 나를 찾으려고 하진 말게. 나는 더 이상 거기에 없으니까."
101020-83 = "……!?"
101020-84 = "아아, 마지막으로 예지의 꿈이 주마등처럼 흘러 지나갈지도 몰라. 조금만 참게나."
101020-87 = "아아아아아……!!"
101020-97 = "게마트리아의 회의실"
101020-100 = "실례. 볼일이 있어서 조금 늦었군요."
101020-104 = "……."
101020-105 = "……."
101020-106 = "……."
101020-107 = "……다 모이신 것 같군요."
101020-109 = "그럼 회의를 시작하시죠."
101020-110 = "무명사제의 유산이 얼마 전에 관측되었습니다."
101020-111 = "……."
101020-112 = "제 부족함에 먼저 사과를 드리죠. 검은 양복, 그 <무명사제>라는 것은 정확히 무엇인가요?"
101020-113 = "베아트리체에게 제공한 로열블러드 보호 기술, 고성당을 파괴했던 순항 미사일…… 그것들이 무명사제들의 기술로 알고 있습니다."
101020-114 = "현존하는 기술을 능가하는 초과학……의 무언가로 이해하고 있는데요."
101020-115 = "간단히 말하자면, 키보토스 이전에 존재했던 이 세계의 주인들이다."
101020-116 = "흐음……?"
101020-118 = "키보토스의 신비 아래에 퇴적되어 흔적만 남아 있어야 할 계몽 이전의 숭고…… <이름 없는 신>과 그들을 숭배하는 무명사제들……."
101020-119 = "거대한 돌, 나무, 태풍과 번개 같은…… 말하자면 태초의 신비와 공포랄까요. 그렇기에 그들은 자연을 모사한 형태로 현현하는 것으로 보입니다."
101020-120 = "그리고 그들을 숭배하는 무명사제들은…… 그들이 무슨 짓을 꾸미는지는 알 수 없지만, 적어도 이 키보토스에 우호적인 입장은 아니겠죠."
101020-121 = "그들은 모습을 감췄지만, 그들의 기술 자체는 아직 이 땅에 남아 있습니다. 그리고 저는 그들의 유산에는 흥미가 많습니다."
101020-122 = "비싸게 거래되기 때문이죠. 큭큭큭……"
101020-123 = "……."
101020-124 = "하지만 최근에 관측된 것은 그런 작은 소일거리 같은 게 아니었습니다."
101020-125 = "<방주>가 관측되었죠. 한순간이긴 했지만."
101020-126 = "관측이라고? 그것은 관측되는 개념인가? 물체가 아니라 현상이라는 건가?"
101020-127 = "그건……."
101020-128 = "흥미로운 질문입니다. 저 역시 <방주>라는 것은 실존하는 물체라고 생각했는데…… 아무래도 그런 것이 아니었던 모양입니다."
101020-129 = "카이저 그룹을 이용해 아비도스 사막을 파헤치고 있었던 것도…… 아무래도 헛수고였던 것 같습니다. 저는 단단히 착각하고 있었던 거죠."
101020-130 = "만약 <방주>라는 것이 모든 신비를 총체적으로 아우르는 추상적 관념이라면……."
101020-131 = "……아니, 이건 논의를 너무 벗어나는군요. 다시 본론입니다."
101020-132 = "사라졌어야 할 <무명사제>의 병력들과 유산이 다시 관측되기 시작하는 것…… 이것은 확실히 저희가 상정한 것에서 벗어났습니다."
101020-133 = "샬레의 출현, 키보토스 최고 신비의 확보 실패, 유일했던 아리우스 영지 박탈, 데카그라마톤의 죽음……."
101020-134 = "그리고 이제 무명사제들의 유산인 <방주>의 관측까지……."
101020-135 = "원래 계획대로였다면 지금은 아니었을 겁니다. 훨씬 더 미래…… 어쩌면 영원히 오지 않을 미래였을지도 모릅니다."
101020-136 = "하지만 그 사이 통제할 수 없는 변수들이 발생했고, 지금 우리가 맞이한 현재는 우리의 계획과는 너무나 멀리 벗어나 버렸습니다."
101020-137 = "그뿐 아니라……."
101020-139 = "그래. 색채가 이곳을 발견했다. 베아트리체, 귀하가 벌인 그 의식 때문에."
101020-140 = "……."
101020-142 = "귀하가 행한 의식, 그건 <색채>와 접촉하는 것이었다. 그것이 초래할 위험은 인지하고 있었나?"
101020-143 = "정확히는 접촉하는 게 아니라, 색채의 힘을 이용하려는 것이었죠. 마담은 그걸 불러오려 한 것은 아니었습니다."
101020-144 = "그래! 색채의 힘을 이용해 자신이 더 위대해지려 했지! 고작 그런 저열한 목적을 위해 그 불가해한 개념을……."
101020-146 = "말조심하세요, 나무 인형."
101020-147 = "……."
101020-148 = "예술가는 언제나 자기 작품이 자신보다 위대해지길 바라면서도, 타인의 목적은 평가절하하는군요. 그 오만함이 예술가의 본질인가요?"
101020-149 = "진정하시죠, 마담."
101020-150 = "너도 마찬가지다. 데칼코마니."
101020-151 = "……."
101020-152 = "액자의 그림 따위에게 복화술 하는 게 너의 그 허상과 비실재의 은유라는 건가요? 내가 볼 땐 서커스장의 광대 짓과 다를 게 없어 보이는데."
101020-153 = "그렇다-!!"
101020-154 = "……화내지 마십시오, 데칼코마니. 우리는 그녀가 받은 모욕을 이해해주어야 합니다."
101020-156 = "자아. 어른답게 행동하시죠. 베아트리체는 그저 색채를 이용하려고 했을 뿐이고, 그것을 이 키보토스로 불러올 계획은 아니었을 겁니다."
101020-157 = "색채 또한 이곳을 발견했다고 단정 지을 수는 없습니다. 제가 알기론 꿈속에서 벌어진 사태."
101020-158 = "그래요. 그 모든 게 샬레의 [USERNAME] 선생이 나타난 뒤에 벌어진 일들이에요. 그자의 존재가 이 모든 뒤틀림의 기점이라는 걸 모두 알고 있지 않나요?"
101020-159 = "……."
101020-160 = "……."
101020-161 = "……마담."
101020-162 = "제가 몇 번이나 말했듯, 최대한 빨리 그자를 제거했어야 했어요."
101020-163 = "……이곳이 학원 도시라는 개념으로 존재하는 한, [USERNAME] 선생님의 존재는 저희를 능가할 수밖에 없습니다."
101020-164 = "그것이 이 이야기의 장르…… 아니, 쉽게 말하자면 이 세계의 법칙입니다. 저희가 이 세계에 머무는 한 그 규칙을 거스를 수……."
101020-165 = "그딴 작법론은 아무래도 상관없어요!!"
101020-166 = "……."
101020-168 = "그래요. 제가 전전긍긍하는 여러분들에게 해답을 보여드리죠. 무명사제도, 샬레도, 방주도 모두 한 번에 해결하는 궁극의 해답을."
101020-169 = "……무슨?"
101020-170 = "사실은, 색채는 이미 이곳을 발견했어요."
101020-171 = "……!!"
101020-172 = "!?"
101020-173 = "!!"
101020-177 = "정확히는, 제가 알려주었죠. 색채는 이미 이 키보토스로 오고 있는 중이에요."
101020-178 = "……."
101020-194 = "이제 선생님을 지키는 수단은 더 이상 없어."
101020-196 = "[USERNAME] 선생님."
101020-197 = "이걸로……"
101020-198 = "이걸로 전부…… 끝나게 될 거야."
101020-199 = "[ns] \"시로코……?\""
101020-203 = "……생님?"
101020-205 = "아로나의 교실"
101020-206 = "선생님? 괜찮으세요?"
101020-207 = "무슨 일이 신가요? 또 그 꿈을 꾸신 거예요?"
101020-208 = "[ns1] 아로나를 이리저리 살펴본다.\n[ns2] 아로나가 다치지 않았는지 이곳저곳 살펴본다."
101020-211 = "어, 어라……?"
101020-212 = "뭐, 뭐죠? 신체 검사인가요? 어라, 어라라……?"
101020-213 = "네? 총에 맞은 상처요?"
101020-214 = "우, 우와아아- 전 괜찮아요, 그런 적 없어요! 세 번이나 맞은 적은 더욱 없다구요! 선생님!"
101020-215 = "저는 멀쩡해요! 엄청 건강하니까, 으아아-"
101020-216 = "[ns] \"……응. 그러네.\""
101020-218 = "[ns] \"아로나가 다치지 않아서 다행이야.\""
101020-219 = "……."
101020-220 = "걱정하지 마세요. 선생님. 저는 멀쩡하니까요."
101020-221 = "그냥 나쁜 꿈을 꾼 거잖아요. 그러니까 괜찮아요."
101020-224 = "모든 색이 사라진 세계."
101020-225 = "거기서 일그러진 헤일로를 한 소녀가 선생님에게 총을 겨누고 있었죠."
101020-226 = "흐릿한 이미지였지만, 거기서 선생님은 죽게 됩니다."
101020-227 = "[s3] \"………….\"\n[s4] \"무시무시한 이야기네.\""
101020-230 = "……."
101020-231 = "어째서 선생님이 저와 동일한 예지몽을 꾼 건지는 모르겠지만……."
101020-232 = "아마도 선생님은 꿈속에서 저를 몇 번이나 만나왔기 때문에, 그 영향을 받은 건지도 모르겠네요……."
101020-233 = "[s] \"그럼 그게 언제 벌어질 일인지는 모르는 거야?\""
101020-234 = "네……. 저는 예지몽 능력을 잃은 뒤, 이제는 파편처럼 흩어진 몇몇 환시만을 볼 수 있을 뿐……."
101020-235 = "하지만 그것이 제가 예전에 경고했던, 바로 그 <키보토스의 멸망>과 관계가 있는 것은 분명할 듯합니다."
101020-236 = "[s] \"키보토스의 멸망…….\""
101020-240 = "하늘에서 6개의 거대한 탑이 낙하하고, 세상은 붉게 물듭니다."
101020-241 = "키보토스의 6개 전역에 흩어져 세워진 그 탑은 이 키보토스를 붕괴시키고 파멸로 이끌게 됩니다."
101020-243 = "[ns] \"……….\""
101020-244 = "걱정하지 마세요, 선생님. 무슨 일이 벌어지더라도 제가 선생님을 지켜드릴 거니까요!"
101020-245 = "[s5] \"응. 늘 신세 지고 있어. 아로나.\"\n[s6] \"언제나 고마워. 아로나.\""
101020-248 = "……에헤헤. 좀 더 고마워해 주셔도 돼요."
101020-249 = "응, 그럼 선생님. 오늘은 어떤 업무를 하실 계획이신가요?"
101020-250 = "[s] 오늘의 계획을 말한다."
101020-251 = "……총학생회의 린 씨에게요?"
101020-252 = "하, 하지만…… 린 씨가 이 말을 믿어줄까요?"
101020-253 = "[s7] \"응. 린이라면 믿어 줄거야.\"\n[s8] \"린 쨩은 성실하니까.\""
101020-256 = "……알겠습니다. 선생님이 그렇다면 이해했어요."
101020-257 = "린 씨는 조금 무섭지만…… 그럼 저도 열심히 응원할게요! 선생님!"
101020-262 = "하아……."
101020-268 = "……."
101020-269 = "훗……."
101020-274 = "총학생회실"
101020-277 = "……."
101020-278 = "멸망……이라고 하셨습니까?"
101020-279 = "[s] \"전혀 믿지 않는 표정?!\""
101020-280 = "……. 그러니까, 예지몽……인 거군요?"
101020-281 = "[s] \"그, 그렇습니다만…….\""
101020-282 = "선생님이 꾼 꿈……속에서 말이죠. 흐음…… 키보토스가 멸망한다……라."
101020-283 = "증거도 없고, 그게 언젠지도 모르고요?"
101020-284 = "그렇군요……. 멸망이라……."
101020-285 = "[s] \"그, 그래도 린 쨩이 알고는 있어야 할 것 같아서…….\""
101020-286 = "……누가 린 쨩입니까."
101020-287 = "[s] \"죄, 죄송합니다.\""
101020-290 = "……."
101020-291 = "네. 알겠습니다. 선생님."
101020-292 = "총학생회에 있는 데이터나 기록을 뒤져보도록 하죠. 그 비슷한 사례나 다른 예시들이 있는지도 찾아보겠습니다."
101020-293 = "[s] \"……응?\""
101020-294 = "그리고 그 백귀야행 자치구의 학생부도 찾아보도록 하죠. 백귀야행 쪽은 학생부 DB가 잘 구축되어 있진 않지만. 실마리라도 찾아볼 수 있다면 다행이겠군요."
101020-295 = "[s] \"이 말을 믿어주는 거야?\""
101020-296 = "……믿고 말고 할 문제도 아니죠. 선생님도 이게 사실인지 아닌지 모르지 않습니까."
101020-297 = "하지만 오히려 이런 믿지 못할 내용을 전하기 위해 저를 찾아온 것이니…… 이건 최소한 선생님의 진심은 맞겠죠."
101020-298 = "당신은 총학생회장이 선택한 사람. 그러니 저는 그저 준비하고 대응할 뿐입니다."
101020-299 = "그게 총학생회장에 대한 예의이기도 하니까요."
101020-300 = "[s] \"고마워, 린 쨩!\""
101020-301 = "……. 하지만 다른 총학생회 학생을 설득하기 위해서는 실제 증거들이 필요할 거예요. 그쪽을 확보해 주시면 일이 더 수월하겠군요. 선생님."
101020-302 = "제가 이쪽에 너무 많은 신경을 쓰진 못하겠지만…… 할 수 있는 만큼은 찾아보도록 하죠."
101020-303 = "조만간 연락을 드리도록 하겠습니다."
101020-304 = "그럼 전 다른 일이 있어서 이만."
101020-306 = "다음화;일상 속의 균열 1"
