[translation]
10025060-1 = "제6화;안개가 걷힌 뒤에"
10025060-2 = "(다음 날, 아침…….)"
10025060-12 = "……오늘도 허탕이구만."
10025060-13 = "자, 자. 다들 정박했으면 빨리 홋줄 감고 쥐 마개 설치해."
10025060-14 = "볕이 더 뜨거워지기 전에 아수라장이 된 덕장을 정리하려면 서둘러야 하니까."
10025060-15 = "저기…… 어르신, 덕장은 이미 깨끗하게 치워져 있는데요."
10025060-16 = "……뭐? 그새를 못 참고 다른 도둑고양이가 다녀가기라도 했나?"
10025060-17 = "그게 아니라 저희가 조업을 다녀온 사이에 누군가가 덕장을 청소해 둔 것 같아요."
10025060-18 = "그 외에도 고장 난 시설이나 망가진 안전장치도 모두 고쳐진 것 같은데……"
10025060-23 = "………누가?"
10025060-29 = "……이만하면 문제없겠지."
10025060-30 = "모에, 이제 다시 아래 분전반 체크해 봐. 제대로 연결했다면 이제 불이 들어올 거야."
10025060-31 = "알았어—"
10025060-44 = "자, 잠깐. 그 위에서 뭐 하시는 건가요?"
10025060-45 = "그 전봇대와 연결된 전선에는 수만 볼트의 전류가 흐르고 있다고요!"
10025060-46 = "위험하니까 빨리 내려오세요……!"
10025060-47 = "걱정 마, 걱정 마. 미리 전기가 흐르지 않는 걸 확인하고 작업하던 중이었으니까."
10025060-48 = "작업……?"
10025060-49 = "다 끝났으니까, 금방 내려갈게."
10025060-59 = "모에, 이제 다시 한번 차단기 올려 봐."
10025060-65 = "정상 작동 확인…… 역시 합선으로 인해 차단기가 내려간 것뿐이었네."
10025060-66 = "해풍에 노출되는 전선은 노후화되기 쉬우니까. 조금이라도 높은 전압이 걸리면 과부하가 걸려서 차단기가 내려가 버리지."
10025060-67 = "우선은 삭은 전깃줄을 새것으로 교체하고 배전반에 슨 녹을 닦았어."
10025060-68 = "나중에 다시 전문가에게 정식으로 확인을 받아야겠지만, 당분간은 이것만으로도 새벽 조업에 문제는 없을 거야."
10025060-70 = "……어, 어떻게 수리하신 건가요?"
10025060-72 = "응? 배전반 수리라고 해도 야전에서 전력선이나 통신선 가설하는 거랑 크게 다르지 않잖아?"
10025060-73 = "키보토스 학생들이라면 가설 분전 정도는 다 할 수 있는 줄 알았는데……"
10025060-74 = "그런 잡기를 익히는 건 SRT에서도 너 정도밖에 없거든……?"
10025060-76 = "S…… 뭐라고요?"
10025060-78 = "아, 아무것도 아니야……!"
10025060-79 = "그보다 이 선착장은 난간도, 가드레일도 없어서 위험해 보이는데…… 이대로 방치해도 괜찮은 거야?"
10025060-81 = "저희도 난간을 착각해 물에 빠지는 사람들이 종종 있었던 지라, 안전 펜스라도 걸어보려고 했지만……"
10025060-82 = "그럼 배를 계류하고 어획물을 운반하는 데 문제가 생긴다고 해서요."
10025060-83 = "여러모로 노력해 봤지만, 안 되는 건 안 되더라고요."
10025060-85 = "으음…… 그래도 눈에 띄는 경고 표시 정도는 해 두고 싶은데……"
10025060-86 = "아, 모에. 혹시 야광 도료 좀 갖고 있어?"
10025060-87 = "응, 야간전에 사용하는 축광 페인트가 조금 남아있긴 한데…… 그건 왜?"
10025060-88 = "난간을 따라 야광 도료를 발라 두면 밤에도 경계가 잘 보일 테니, 실수로 물에 빠지는 일은 크게 줄어들 거야."
10025060-89 = "저 쪽 부두부터 여기 계선주까지 페인트를 칠해두자."
10025060-90 = "칫, 군용 페인트는 싸지도 않은데……"
10025060-91 = "짠돌이처럼 굴지 마. 평소에는 그보다 더 비싼 무기도 고민없이 사들이는 주제에……"
10025060-92 = "그럼 우리는 잠시 페인트를 가지러 다녀올게."
10025060-94 = "참. 그리고 아직 가로등에 접지는 안 되어 있으니까, 전봇대에 다른 주민들이 가까이 오지 못하도록 지켜봐 줘!"
10025060-96 = "………네."
10025060-105 = "……아."
10025060-106 = "안녕하세요, 어르신. 오늘은 날씨가 좋네요."
10025060-107 = "……온 마을을 멋대로 제멋대로 개조해 두었더군."
10025060-108 = "덕장의 낡은 지지대부터 고장 난 가로등까지……"
10025060-109 = "모두 새것으로 갈아 두어서 위화감이 느껴질 정도야."
10025060-110 = "죄, 죄송합니다. 저희는 그저 낡은 구조물이 위험하고 불편해 보여서……"
10025060-111 = "혹시 방해가 되었을까요?"
10025060-112 = "아니, 아무 문제도 없다. 오히려 다른 주민들은 좋아하는 눈치였고……"
10025060-113 = "변화를 싫어하고 오래된 것을 불편하지 않게 여기는 사람은 늙은 노인 뿐이지."
10025060-117 = "……저, 어제는 죄송했습니다."
10025060-118 = "아무리 공포에 질려 제대로 된 사고를 하지 못했다지만, 마을 주민 여러분께 실례되는 말을 했습니다."
10025060-119 = "좀 더 침착하게 주민 여러분의 의견을 들어봤어야 했는데……"
10025060-120 = "어쩔 수 없어. 사람이 통제할 수 있으면 그건 더 이상 공포라고 할 수 없으니까."
10025060-121 = "……게다가 이 마을이 수상하다는 건 그리 틀린 평가도 아니지."
10025060-122 = "우리가 일부러 그렇게 보이기를 희망해 왔으니까."
10025060-123 = "그 말은 혹시……"
10025060-124 = "……<깊은 곳의 존재들>에 대한 이야기를 하려는 게 아니야."
10025060-125 = "그동안 찾아온 외지인들은 알 수 없는 옛이야기를 조금 들은 것만으로도 공포에 질려 마을을 떠나버렸으니까."
10025060-126 = "사람이 찾아오지 않는 마을은 정체되었고, 변화가 없으니 평생 해 온 일을 부정할 필요도 없었지."
10025060-127 = "그 공포가 마을을 조금씩 좀먹어 가는 줄도 모르고 말이야."
10025060-128 = "……하지만 제가 보기에는 여전히 예쁜 마을이라고 생각해요."
10025060-129 = "마음에도 없는 소리를 하기는."
10025060-130 = "……그나저나 지금은 무얼 하고 있는 거지?"
10025060-131 = "원숭이 손 매듭을 새로 묶고 있었어요."
10025060-132 = "부둣가에 있던 히빙라인이 삭아서, 무게추가 빠질 것 같아서……"
10025060-133 = "손재주가 좋군. 누구에게 따로 배웠나?"
10025060-134 = "아, 이런 매듭법은 학원에서 특수—"
10025060-136 = "……특수?"
10025060-137 = "아, 아뇨. 그러니까…… 수, 수예부 소속이었거든요."
10025060-139 = "수예부에서 원숭이 손 매듭 묶는 법을 가르쳐 준다고?"
10025060-143 = "뭐…… 이해하긴 어렵지만, 세상의 모든 일을 한눈에 이해할 수는 없는 법이니까."
10025060-144 = "……이 마을처럼 말이죠?"
10025060-148 = "빨리 새우가 예전처럼 많이 잡혔으면 좋겠네요."
10025060-149 = "……그러게 말이야."
10025060-157 = "7피트 길이의 루어 낚시대에 소형 스피닝 릴……"
10025060-158 = "줄은 0.8호 나일론 줄이면 충분할 테고……"
10025060-159 = "마지막으로 탄피를 개조해서 만든 메탈 지그를 사용하면……"
10025060-167 = "저기……"
10025060-169 = "우, 우앗?! 어, 언제 오셨나요?"
10025060-170 = "아까 전부터 있었는데……"
10025060-171 = "죄, 죄송합니다. 다른 사람이 제 존재를 알아차리지 못할 때는 많아도, 그 반대의 경우는 거의 없어서……"
10025060-172 = "아니야. 집중하고 있는데 방해해서 오히려 내가 미안해."
10025060-173 = "아, 아뇨…… 괜찮습니다……"
10025060-175 = "(이 사람은 분명 어제 바닷가에서 수상한 주문을 외우던 그 낚시꾼……)"
10025060-176 = "(다가가기도 전에 상대가 먼저 말을 걸어오다니, SRT의 대원으로서 이 기회를 놓치지 않고 정보를 알아내야 해!)"
10025060-177 = "(하지만 어쩐지 어제의 일이 자꾸 떠올라서…… 무서워서 먼저 말을 걸지 못하겠어……)"
10025060-179 = "여기서 무슨 낚시를 하던 중이었어?"
10025060-180 = "저, 전갱이를…… 낚던 중이었어요."
10025060-181 = "다른 소대원들이 마을을 정비하는 동안 저녁 거리로 쓸 생선을 몇 마리 잡아 오기로 했거든요."
10025060-182 = "평소처럼 폐기 도시락으로 식사를 대체해도 좋았겠지만, 이 마을에는 편의점 같은 시설이 없어서……"
10025060-183 = "……소대원? ……폐기 도시락?"
10025060-184 = "아, 그게…… 그러니까……"
10025060-189 = "앗…… 잠시만요. 방금 찌가 움직였어요."
10025060-190 = "전갱이는 소음에 예민하니 잠시만 목소리를 낮추어 주세요."
10025060-191 = "으, 응……"
10025060-192 = "바늘이 빠지지 않도록…… 줄을 천천히 당기면……"
10025060-198 = "……낚았다!"
10025060-199 = "우와, 엄청난 크기네…… 30cm는 넘는 것 같아!"
10025060-201 = "과, 과찬이세요. 아마 20cm밖에 되지 않는 것 같지만……"
10025060-202 = "이만한 걸 세 마리 정도 더 낚으면, 오늘 저녁 반찬으로는 충분하겠네요."
10025060-203 = "앞으로 세 마리나 더 낚을 예정이라고? 이렇게 큰 녀석으로……?"
10025060-204 = "네. 전갱이라면 평소에도 한 번에 대여섯 마리 정도는 잡았던 지라……"
10025060-205 = "무, 무슨 문제라도 있나요?"
10025060-209 = "저기, 어제부터 누차 폐를 끼치는 것 같아서 미안하지만……"
10025060-210 = "내게 낚시를 가르쳐 주지 않을래?"
10025060-212 = "네, 네……?!"
