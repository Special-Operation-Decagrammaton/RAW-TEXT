[translation]
1011203-1 = "매점 데이트"
1011203-6 = "(밀레니엄에서 업무를 처리하고 나오니 점심시간이었다.)"
1011203-10 = "[ns] \"배가……\""
1011203-12 = "[ns] \"고프다!\""
1011203-16 = "(뭘 먹을까 한참 고민했지만……)"
1011203-23 = "[ns] \"배고플 때는 역시 매점이지.\""
1011203-24 = "(그렇게 안쪽을 둘러보고 있었다.)"
1011203-28 = "[ns] \"응? 저건……\""
1011203-38 = "[ns1] \"아스나, 안녕!\"\n[ns2] \"점심 메뉴 고르러 온 거야?\""
1011203-43 = "아, 선생님!!"
1011203-44 = "안녕, 안녕!!"
1011203-45 = "아하하, 선생님을 매점에서 만날 줄이야. 신기하다."
1011203-46 = "[s] \"그러게. 오니까 아스나가 있었어.\""
1011203-47 = "응! 아스나 점심으로 뭘 먹을지 고민하고 있었어."
1011203-52 = "여기, 이 메론빵이랑~"
1011203-56 = "이 야키소바빵 중에서 뭘 먹어야 할까?"
1011203-57 = "으음, 아스나에게는 너무 어려운 문제야."
1011203-58 = "[s] \"꼭 하나만 먹어야 할까?\""
1011203-62 = "어? 그렇네?"
1011203-63 = "두 개 다 사면 되는 거잖아? 그런 방법이 있었어. 아하하!"
1011203-64 = "한번에 빵을 두 개나 먹어본 적은 없지만! 어떻게든 되겠지!"
1011203-68 = "선생님, 선생님! 아스나랑 점심 같이 먹어줄 거지?"
1011203-69 = "[s] \"아아…… 물론이지.\""
1011203-71 = "(아스나와 함께 먹을 점심을 골라 밖에 나왔다.)"
1011203-76 = "아스나 것까지 계산해 버리다니~ 나도 지갑 있는데~"
1011203-77 = "[s3] \"모처럼 만났으니까.\"\n[s4] \"이 정도는 사게 해줘.\""
1011203-80 = "흐응~ 그래! 다음에는 내가 살 테니까."
1011203-84 = "아, 저기 앉자! 아스나가 자주 앉는 벤치야."
1011203-93 = "헤헤, 여기 어때?"
1011203-94 = "[s5] \"응, 좋네. 햇빛도 적당히 들어오고.\"\n[s6] \"명당이야.\""
1011203-97 = "그렇지? 종종 여기 앉아서 멍~ 하니 있으면 기분 좋아."
1011203-101 = "아, 빵."
1011203-104 = "선생님이 사준 메론빵이랑 야키소바빵~!"
1011203-108 = "근데 뭐부터 먹지……? 뭘 먼저 먹는 게 좋을까?"
1011203-109 = "[s7] \"메론빵!\"\n[s8] \"야키소바빵!\""
1011203-112 = "좋아~! 헤헷."
1011203-113 = "선생님이랑 있으니까, 아스나에게 어려운 일들이 엄청 쉬워지는 느낌!"
1011203-114 = "아하하, 앞으로도 항상 이렇게 선생님이 결정해 주면 좋겠다."
1011203-115 = "[s] \"아스나가 직접 결정하는 게 더 재밌을걸?\""
1011203-116 = "그런가? 흠……"
1011203-120 = "그럴지도?"
1011203-121 = "응! 그러면 한 입씩 번갈아 가면서 먹을래! 그렇게 결정!"
1011203-125 = "잘 먹겠습니다!"
1011203-131 = "아하하, 맛있어!"
1011203-132 = "선생님이랑 먹어서 더 맛있는 것 같아!!"
1011203-134 = "(아스나는 결국 배부르다며 빵을 반씩 남겼다……)"
1011203-138 = "(남은 빵은 버리기 아까워서 모두 내가 먹어 치웠다.)"
