[translation]
2003402-1 = "목적을 달성하는 방법"
2003402-2 = "그리하여……."
2003402-3 = "새해 음식 많이 먹기 대회에, 참가하려 합니다!"
2003402-4 = "참가 자격 확인, 참가 신청서 접수, 대회 장소 및 음식 품목까지……."
2003402-5 = "사전 준비는 모두 끝마쳐 두었어요."
2003402-6 = "우후후. 올해도 두근거리네요★"
2003402-7 = "[s] \"올해도?\""
2003402-8 = "네. 올해도."
2003402-9 = "[s] \"……여러 가지가 함축된 말처럼 들리네…….\""
2003402-10 = "어머나. 무슨 말씀인지 잘 모르겠는데요★"
2003402-11 = "그러면, 선생님. 가시죠."
2003402-12 = "[s] \"어, 나도?\""
2003402-13 = "네네. 함께 지켜봐 주신다면 정말 기억에 남는 대회가 될 테니까요."
2003402-14 = "아니면 선생님은…… 배고픈 제자의 부탁을 매몰차게 거절하시는 분인가요?"
2003402-15 = "[s] \"'배고픈' 이구나…….\""
2003402-16 = "그럼요. 이 대회를 위해서 아침도 반 그릇밖에 안 먹었는걸요."
2003402-17 = "그건 정말로 큰일인 것 같다고요? 후훗. 그런가요?"
2003402-19 = "……정말로, 오셨군요. 와니부치 아카리 씨."
2003402-20 = "정말로 송구스럽습니다만…… 저희 주최측에서는 아카리 씨의 이번 대회 참가를 정중히 거절드리려 합니다."
2003402-21 = "거듭 사과드립니다만, 부디 양해를 부탁드리겠습니다."
2003402-22 = "어머나?"
2003402-28 = "[ns] \"합당한 이유라도 있습니까?\""
2003402-29 = "……죄송합니다."
2003402-30 = "아카리 씨께서는 작년의 우승자셨죠."
2003402-31 = "네에. 그랬었죠. 그렇지 않아도 포만감을 느끼기 쉬운 곤약을, 한층 더 튀겨내서 더더욱 배부름을 느끼기 쉽도록 했던 것이 인상적이었어요."
2003402-32 = "재작년의 우승자 역시 아카리 씨였고요."
2003402-33 = "아, 기억나네요. 포만감이 높은 감자와 계란을 으깨서 뭉친 뒤, 생선살과 섞어 특제 어묵을 만들어 주셨었죠."
2003402-34 = "그리고 이대로라면 올해의 우승자도 아마, 아카리 씨로 결정되겠지요……."
2003402-35 = "어머나. 그렇지만 해보지 않으면 모르는 것 아닐까요?"
2003402-37 = "[ns1] (어떤 경우에는 굳이 해보지 않아도…….)\n[ns2] (알 수 있는 것이 있는 것 같지만…….)"
2003402-40 = "역시, 죄송합니다. 저희 상점가의 새해 음식 많이 먹기 대회는……."
2003402-41 = "기본적으로 더 많은 사람이 음식을 맛보고 즐겨 주시고, 나아가 상점가의 홍보에 기여했으면 하는 취지에서 시작된 것입니다만."
2003402-42 = "아카리 씨가 참가하는 순간……. 우승은 아카리 씨가 될 것이 너무 명확하므로."
2003402-43 = "주최 측에서는 본래의 목적인 상점가 홍보를 달성하기 어려울 것이라고 판단했습니다."
2003402-44 = "우승자가 정해진 대회는…… 아무래도 관심이 가지 않게 될 테니까요."
2003402-46 = "흐응……."
2003402-47 = "그 대신 저희 상점가에서 엄선한, 최고급 새해 도시락 10인분을 드릴 테니, 이것으로 저희의 사정을 고려해 주시면 안 될까요?"
2003402-48 = "부탁드리겠습니다……."
2003402-49 = "……."
2003402-50 = "그렇지만 저는 최고급 새해 도시락을 먹기 위해서 온 것이 아니에요."
2003402-51 = "곤약 튀김이나 계란감자 어묵처럼, 많이 먹기 대회에서 참가자들의 배를 최대한 빨리 부르게 하기 위한 꼼수 음식–실례, 별식을 먹어 보기 위해서 온 것이니까요."
2003402-52 = "그, 그것은……!"
2003402-53 = "후후……. 올해의 별식으로는 무엇이 준비되어 있을까요? 기대되네요★"
2003402-54 = "[s] \"자, 자. 방금 떠오른 생각이 하나 있는데 말이야…….\""
2003402-55 = "네?"
2003402-56 = "어머?"
2003402-59 = "과연……. 작년 챔피언인 저의 타이틀 방어전 느낌으로."
2003402-60 = "아카리 씨와 다른 도전자 전원의 많이 먹기 대회…… 라는 것이군요?!"
2003402-61 = "그, 그렇지만 괜찮으실까요? 아무리 아카리 씨라고 하셔도, 여덟 명이나 되는 도전자 전원과 겨룬다는 것은……!"
2003402-62 = "어머나. 이것은 또 매우 재미있는…… 아뇨. 도전 욕구를 불러일으키는 말을 들은 것 같네요."
2003402-63 = "괜찮아요. 처음부터 승리가 목적인 것은 아니었으니까요."
2003402-64 = "작년에도 마찬가지였고, 재작년에도 그랬었죠."
2003402-65 = "그랬습니까?!"
2003402-66 = "[ns] (아카리라면 그럴 수 있지…….)"
2003402-67 = "네. 저는 좋아요. 올해의 '별식'이 무엇일지도 기대가 되고요."
2003402-68 = "자, 잠시만요. 한 번만 더 주최 측에 문의해 보고 오겠습니다. 잠시만 기다려 주세요!"
2003402-72 = "후훗."
2003402-73 = "선생님 덕분에, 올해에도 신선한 경험을 해볼 수 있게 되었네요."
2003402-74 = "[s] \"……조금은, 봐줬으면 해?\""
2003402-75 = "네? 무슨 말씀인지 잘 모르겠는데요~★"
2003402-78 = "그러면 지금부터! 저희 상점가의…… 새해 음식 많이 먹기 대회를 개최하도록 하겠습니다!"
2003402-79 = "올해의 새해 음식 많이 먹기 대회는, 조금 이례적으로…… '챔피언에 도전하라!' 라는 테마로 이루어지게 되겠습니다!"
2003402-81 = "우선 챔피언을 소개합니다! 3관왕에 도전하는 와니부치 아카리 선수!"
2003402-85 = "후후. 안녕하세요. 여러분. 잘 부탁드립니다."
2003402-86 = "그리고 그에 맞서는 8인의 도전자–!"
2003402-98 = "시작되었습니다! 맹렬하게 접시를 비워가는 도전자들! 그에 비해 챔피언은 비교적 여유 있는 모습을 보여 주고 있습니다!"
2003402-100 = "으음~ 올해의 별식은 토란과 콩을 갈아 넣은 대형 계란말이인가요. 과연……."
2003402-101 = "뭐, 별식뿐만 아니라 다른 새해 음식들도 준비되어 있으니, 하나하나 먹어 보도록 하죠."
2003402-108 = "아~! 도전자들! 조금씩 페이스가 느려지고 있습니다!"
2003402-114 = "그에 반해 아카리 선수! 시작부터 지금까지, 조금도 먹는 속도의 변화가 느껴지지 않는군요! 무엇이 닥쳐오든 물러서지 않겠다는 자세! 이것이야말로 관록일까요!"
2003402-115 = "청어알도 연어 다시마 말이도 맛이 잘 스며들었고 좋네요. 마음에 들어요."
2003402-116 = "조금 목이 메어 오기 시작했으니까, 장국으로 입을 씻어 볼까요?"
2003402-130 = "도전자들! 하나둘씩 포기하기 시작했습니다! 무리는 하지 말아 주십시오! 구급차는 대회장 뒤편에 준비되어 있습니다!"
2003402-136 = "놀랍습니다, 아카리 선수! 그저 묵묵히 먹고, 먹고, 또 먹을 뿐! 이 선수의 위장에 한계란 있는 것인가! 그 위장은 도대체 무엇으로 이루어져 있는가!"
2003402-137 = "어머나. 다들 벌써 다 드신 건가요? 이렇게나 많이 남아 있는데……."
2003402-138 = "그렇다면 저분들 몫으로 돌려진 음식도, 저에게 가져와 주시겠어요?"
2003402-139 = "모처럼 마음껏 먹을 수 있는 대회에 참가했는데, 남기는 것도 아까운 일 아닐까요?"
2003402-147 = "네, 네에! 결과가 나왔습니다!"
2003402-148 = "모두가 중간부터 짐작할 수 있으셨겠지만…… 올해의 우승자는! 와니부치 아카리 선수입니다! 3관왕입니다!"
2003402-149 = "후후……. 다행히도 상점가의 홍보와 선전이라는 대회의 취지도, 그럭저럭 잘 달성된 것 같군요."
2003402-150 = "저도 충분히 먹을 수 있어서 만족스러웠고……. 이것도 다 선생님의 명안 덕분이네요★"
2003402-152 = "아이고, 감사드립니다. 선생님. 아카리 씨. 저희의 생각이 짧았던 탓에, 하마터면 큰 실례를 저지를 뻔했습니다."
2003402-156 = "그런데…… 조금 전부터 제 핸드폰이 묘하게 요란해진 것 같은데요. 혹시 짐작 가는 부분이라도 있으신가요……?"
2003402-157 = "[s3] \"그게, 중간부터 대회를 지켜보시던 분들이.\"\n[s4] \"인터넷에 이 대회 광경을 업로드하셨는데…….\""
2003402-160 = "네? 그게 상상 이상의 조회수를 이끌어내, 지금 인터넷 전역으로 송출되고 있다고요?"
2003402-161 = "예?!"
2003402-162 = "……."
2003402-163 = "와아. 잘됐네요. 이걸로 한층 더 상점가 홍보가 활발하게 이루어지겠어요."
2003402-165 = "그, 그렇지만 그것이, 무슨 부가 효과를 불러일으킬지, 도저히 예측할 수가……!"
2003402-167 = "후훗."
2003402-172 = "세상 사, 다 그런 것 아니겠어요★"
2003402-174 = "(맑고 깨끗한 아카리의 웃음은, 보기에 따라서는 살짝 서늘하게도 느껴졌다…….)"
