[translation]
13330-1 = "제33화;현현"
13330-6 = "……."
13330-9 = "……유…… 메…… 선……"
13330-12 = "[ns] \"대체 호시노에게 무슨 일이 벌어진 거야……!!\""
13330-13 = "지, 지금 호시노 씨는……."
13330-14 = "……존재가 반전되었습니다."
13330-15 = "이제 호시노 씨는…… 더 이상……."
13330-17 = "바, 방법이 없는 건가요?!"
13330-21 = "……. 부정. 없습니다."
13330-22 = "[ns] \"………!!!!\""
13330-23 = "그, 그럴 수가……."
13330-24 = "불가능합니다. 그건 죽은 자를 되살리는 방법이 없는 것과도 같은 의미입니다……."
13330-25 = "[ns] \"호시노……!!\""
13330-29 = "그래, 그 열차포는 미끼였다. 처음부터 끝까지."
13330-30 = "나의 목표는 바로 저 아비도스의 최고의 신비. 새벽의 호루스."
13330-31 = "여섯번째 화두. 존재한 적 없는 진실은 진실인가? 저것이 그 화두의 대답이다."
13330-32 = "언젠가 우리는 죽는다. 그것은 결정되어 있는 확고한 진실."
13330-33 = "하지만 우리는 그것을 알지 못한다. 우리에게 죽음은 아직 존재한 적이 없기 때문이다."
13330-34 = "우리가 인식할 수 있는 것은 오직 타인의 죽음뿐. 그렇기 때문에 우리는 죽음에 대해 어떤 이해도 해석도 불가능하다!! 그게 죽음이다!"
13330-35 = "……하지만 동시에 저 호시노의 고통을 통해 깨닫게 된 비의가 있다."
13330-36 = "우리는 이미 죽음과 흡사한 개념을 알고 있었던 것이다."
13330-37 = "고통."
13330-38 = "나의 고통은 타인이 알지 못한다. 타인의 고통은 내가 알지 못한다. <고통>. 그것이야말로 죽음과 같은 관념."
13330-39 = "……그래, 이것은 <고통>을 통해 반전되는 신비. 즉, 공포의 현현이다."
13330-43 = "신성 중의 신성. 가장 오래되고 가장 위대한 신들의 원전이자 근원. 호루스."
13330-46 = "……. 호시노 씨를 막아야 합니다. 아로나 선배. 선생님."
13330-47 = "네?"
13330-48 = "지금 타카나시 호시노 씨는 호루스라는 존재로 반전되었습니다. 저 존재를…… 그대로 놔두면…… 필연적으로 그 본질에 이끌려…… 이 세계를…… 전복시킬 것입니다."
13330-50 = "즉…… 이대로라면 호시노 씨에 의해 이 세계가 멸망하게 됩니다."
13330-51 = "……!!"
13330-52 = "[ns] \"…………!!!!\""
13330-59 = "……. 선……"
13330-60 = "……유…… 메……."
13330-62 = "……!!?"
13330-63 = "……. 호시노 선배."
13330-64 = "호, 호시노 선배……!? 저, 저게 호시노 선배야……?!"
13330-65 = "대, 대체…… 무슨 일이……."
13330-69 = "[ns] \"히나!!\""
13330-73 = "선……생님……."
13330-74 = "[s] \"히나! 괜찮아?!\""
13330-78 = "……호시……노……를…… 막지…… 못……."
13330-83 = "[ns] \"………!!!\""
13330-88 = "우, 우와앗-?!"
13330-89 = "……. 수……, ……첩……."
13330-91 = "호시노 선배! 정신 차려!"
13330-99 = "꺄아아악-!?"
13330-102 = "[ns] \"호시노----!!\""
13330-103 = "……."
13330-108 = "선생님!! 조심하세요!! 저 공격은 저희도 막을 수가……!!"
13330-109 = "선배! 손을……!!"
13330-120 = "[ns] (틀렸어…… 아무것도 할 수 없어…….)"
13330-125 = "[ns] (나는 아무것도 하지 못했어…….)"
13330-127 = "[ns] (……아무것도.)"
13330-129 = "[ns1] (죽은 사람을 되살리는 것도)\n[ns2] (이미 벌어진 일을 되돌리는 것도 나는 불가능해.)"
13330-133 = "[ns] (나는 무력해…… 프라나.)"
13330-136 = "오, 오오오-!"
13330-137 = "우오오오오오오---!!"
13330-138 = "그런가, 이번에는 자네인가!"
13330-139 = "그래, 원초의 신격, 호루스. 그래, 그 호루스의 숙적. 대적자. 이 세계의 창생을 두고 격돌했던 신화의 존재."
13330-140 = "자네가 호루스의 신격에 응하여 나타났구나!!"
13330-141 = "<세트의 분노>여!!"
13330-154 = "비록 룰이 개정되기 전의 텍스쳐지만, 상관없다. 그래!"
13330-155 = "<세트의 분노>와 <새벽의 호루스>의 격전!! 이것은 세계의 창생을 두고 벌이는 신들의 충돌!!"
13330-156 = "자아, 이 나에게 신화를 보여다오, 세트와 호루스의 격돌! 이것이야말로 가장 강대하고 가장 찬란한, 이야기되어야 할 [ruby=신화]신비와 공포의 이야기[/ruby]!!"
13330-160 = "존재한 적 없는 진실은 진실인가?"
13330-161 = "그 불가해한 질문에 저 신비는, 저 공포는 이렇게 대답하고 있는 것이다!!"
13330-162 = "분명히 관측되는 진실이지만, 그것은 어디까지나 내가 경험한 적 없는 진실. 경험할 수 없는 진실."
13330-163 = "우리는 타인의 고통을 알지 못한다! 그렇기 때문에 이 진실은 영원히 해석되지 못한다! 그래, 그렇다, 그것이다!"
13330-164 = "이 세계는 파멸하게 된다."
13330-165 = "그러한 운명의 세계였다. 우리는 타인의 고통을 이해하지 못하기에, 멸망당해 마땅한 존재인 것이다."
13330-168 = "아아, 그래, 검은 양복. 네가 하지 못한 것을 내가 대신 이루어주었다."
13330-169 = "네가 보고 싶었던 광경이 바로 이런 것이었겠지?"
13330-173 = "이 세계의 멸망 말이다."
13330-177 = "상황 확인. [USERNAME] 선생님. 이대로라면 이 세계는 멸망하게 됩니다."
13330-178 = "[s] 그걸 어떻게 막지?"
13330-179 = "답변. ……. 호시노 씨의 헤일로를 파괴해야만 합니다."
13330-185 = "[ns] 그건 안돼."
13330-186 = "호시노 씨는 현재 공포로 반전되어 있는 상태입니다. 저 가공할 신성에 맞먹는 신성이 있어야만 그녀를 저지할 수 있습니다."
13330-187 = "[s] 다른 방법이 있을 거야."
13330-188 = "……하지만 그조차도 역부족입니다."
13330-189 = "저 <공포>에 필적하는 <공포>가 있어야만……."
13330-190 = "[s] 그건 안돼."
13330-191 = "선생님. 이대로라면 선생님은……."
13330-196 = "쿨럭, 쿨럭…… 시로코 선배……."
13330-197 = "도망……쳐요……."
13330-198 = "시로코 쨩……."
13330-202 = "유……메…… 선……, ……배……."
13330-212 = "……."
13330-213 = "이제 알 것 같아."
13330-214 = "내가 약했기 때문에…… 이렇게 된 거니까."
13330-215 = "지금 호시노 선배를 막을 수 있는 건 나뿐이야."
13330-216 = "내가 막아야 해."
13330-221 = "아야네도, 노노미도, 세리카도, 호시노 선배도, 선생님도. 모두…… 다. 내가 구해야만 해."
13330-226 = "응, 이해했어. 나는…… [ruby=.]그[/ruby][ruby=.]걸[/ruby] [ruby=.]위[/ruby][ruby=.]해[/ruby] [ruby=.]여[/ruby][ruby=.]기[/ruby] [ruby=.]존[/ruby][ruby=.]재[/ruby][ruby=.]하[/ruby][ruby=.]는[/ruby] [ruby=.]거[/ruby][ruby=.]니[/ruby][ruby=.]까[/ruby]."
13330-232 = "<색채>가 관측되었어요!!"
13330-233 = "어, 어째서……?! 지금 이 순간에……?!"
13330-234 = "서, 선생님은요?!"
13330-235 = "확인. 선생님은 의식을 잃으셨습니다. 맥박, 위험 수치까지 떨어지고 있습니다. 심장 박동 패턴 불안전."
13330-237 = "선생님의 목숨이 위험합니다……! 아로나 선배……!!"
13330-238 = "……!!"
13330-242 = "내가 막아야 해……!"
13330-248 = "내가."
13330-272 = "……저기."
13330-273 = "……선생님? 이제 슬슬 일어나셔야……."
13330-274 = "[USERNAME] 선생님?"
13330-281 = "다음화;사과"
