[translation]
10028050-1 = "제5화;지옥행 급행열차"
10028050-10 = "……그……. 저기 말이야."
10028050-11 = "설마 그럴 일이야 없다고 생각하지만……."
10028050-12 = "만에 하나……."
10028050-13 = "만에 하나라도 선생님이랑 저 트리니티 정의실현부 녀석이……."
10028050-14 = "\"테러리스트와의 협상에 응하는 일\"……같은 건, 없다고 믿어도 되겠지? 그렇지?"
10028050-15 = "와하핫핫핫!! 이오리~. 우리 이오리쨩~."
10028050-16 = "그거 알아? 너는 지금 이 안에 든 게 뭔지 모르니 그런 속 편한 소리를 하고 있는 거야."
10028050-17 = "이건 단순한 물건이 아니라고. 트리니티의 '교보'라고?"
10028050-18 = "심지어 대충만 들어도……."
10028050-32 = "트리니티라는 거대한 학원 자체의 정치에 영향을 줄 정도로 말이지."
10028050-33 = "……으, 응? 교, 교보……? 트리니티의 교보……?"
10028050-34 = "그런 게 왜 여기에……."
10028050-35 = "자, 자! 그러니 괜히 일을 복잡하게 만들지 말고~."
10028050-36 = "이왕 이렇게 된 거, 우리 다 같이……. 좀 더 솔직해지는 게 어때? 모두의 희망찬 엔딩은 의외로 멀리 있지 않을지도 모르잖아?"
10028050-37 = "이오리? 일단 열차를 멈추고 이 열차에 있는 승무원이랑 갱단 녀석들을 잡아가면 되지? 그게 당초의 목표였잖아?"
10028050-38 = "나 같은 건, 당장 오늘이 아니라도 얼마든지 잡으러 다닐 수 있잖아~. 아니, 오히려 그게 평소의 낙 아닌가?"
10028050-39 = "트리니티 아가씨 쪽은? 이 가방? 가지고 다음 역에 편안~하게 내리면 되고 말이야."
10028050-40 = "그리고 나……?"
10028050-41 = "그리고 나는 그냥……. 여러분이 신경만 안 써주면 되거든? 알아서 사라질 테니까."
10028050-42 = "들었지? 지금 여기서, 우리가 한바탕 해야 할 이유는 없다~ 이 말이야. 응? 내 말이 틀려?"
10028050-43 = "우연히 같이 타고 있던 나를 눈감아줬다는 사실? ……겨우 그 정도?"
10028050-44 = "거~참. 왜들 이러시나~. 하루 이틀 일 하는 사람들도 아닌데……."
10028050-45 = "원래 세상 일이라는 게 그렇게 딱딱 맞아떨어지지만은 않는다고. 다들 알잖아? 그치?"
10028050-46 = "자! 어때, 이오리? 오늘은 이쯤에서 서로 갈 길 가는 게……?"
10028050-47 = "내가 보기에는……."
10028050-48 = "……그다지 나쁘지 않아 보이는데?"
10028050-49 = "무슨 말도 안 되는 소릴 하고 있어!! 아예 못 봤으면 모를까, 널 보고도 내가 그냥 넘어가라고!?"
10028050-50 = "그리고 트리니티의 일은 내 공무 수행이랑 아무 상관 없다고!! 나는 지금 내 일을 하는 게 중요하다니까!?"
10028050-54 = "…………."
10028050-55 = "…………후…………."
10028050-56 = "[s1] \"……???\"\n[s2] \"이치카……?\""
10028050-60 = "흐응~. 그런가? 모르겠는데~?"
10028050-61 = "그거야말로 선도부의…… 아니, 이오리쨩의 사정 아닌가~?"
10028050-62 = "뭐라고 말해도 지금 가방은 나한테 있고……."
10028050-63 = "이거면 저 트리니티 녀석이랑 선생님은 내 말을 들을 수밖에 없고~? 그치, 아가씨~?"
10028050-64 = "…………."
10028050-65 = "같은 말 계속 반복하게 하지 마! 그건 그거고 이건 이거라고! 우리가 알 바가 아니라고!!"
10028050-66 = "내가 뭐 감금시킨다고 한 것도 아니잖아? 일이 이렇게 터졌으니 사정 조사만 좀 하자는 건데, 뭐가 그렇게 불만이야!?"
10028050-67 = "…………."
10028050-68 = "자아, 자. 이제 잘 보라고. 저 친구가 어떤 결정을 하는지? 분명히 이 찻잔……? 요강? 어쨌든 이거 때문에 너를 쏠 거거든?"
10028050-69 = "그렇지? 우리 정의실현부의……. 뭐였더라?"
10028050-70 = "……니카 쨩?"
10028050-71 = "아무튼 이거 깨지면 안 되잖아? 응?"
10028050-72 = "…………."
10028050-73 = "아오~!! 진짜!! 아까부터 진짜 가방, 가방! 그놈의 가방……!!"
10028050-74 = "…………."
10028050-75 = "대체 무슨 놈의 가방 하나 가지고 그렇게……!!"
10028050-86 = "……오!"
10028050-87 = "……하핫……."
10028050-88 = "하핫! 하하핫!!"
10028050-89 = "와하핫핫핫핫!!!!"
10028050-90 = "봐라, 봐라! 내가 뭐라고 했어? 그러기에 몇 번이나 이야기했잖아?"
10028050-91 = "아이고~, 이오리. 이오리~. 우리 어리석은 이오리~!!"
10028050-92 = "왜 계속 지는 싸움을 골라서 하니~. 결국 이 싸움은 내가 이길 수밖에 없다니까?"
10028050-93 = "저 친구는 말이야~. 이 가방을 주기 전까지는 절대로……."
10028050-94 = "나한테……."
10028050-100 = "게흑……!?"
10028050-112 = "[ns] \"……?\""
10028050-114 = "[ns] \"……!?!?!?!?\""
10028050-118 = "…………아."
10028050-119 = "……쏴 버렸다."
10028050-120 = "하하. 이게 뭐람."
10028050-121 = "죄송함다~! 좀 짜증 나서 저도 모르게 그만~."
10028050-122 = "그만……. 그……. 으음~……."
10028050-126 = "……하하!"
10028050-127 = "[ns3] \"이치카아아아아아-?!?!\"\n[ns4] \"가방이, 가방이……!! 내용물이……!?\""
10028050-130 = "아하하하! 그러네요, 떨어졌네요!"
10028050-131 = "뭐……."
10028050-132 = "그런데 어쩌겠슴까? 이미 저질러 버린 거. 안은 나중에 확인해 보죠?"
10028050-133 = "이젠 저도 잘 모르겠고요. 아마 망했겠죠. 네. 그렇겠죠."
10028050-134 = "그러니 이왕 이렇게 된 거."
10028050-135 = "저만 이러면 좀 억울하니, 다른 분들도……."
10028050-145 = "……다 같이, 저랑 지옥으로 가 주시겠슴까?"
10028050-154 = "아하하하하! 아하, 아하하! 아하하하하하!!!!!!"
10028050-155 = "뭐, 뭐야!? 저 녀석…… 으아아아~!!"
10028050-156 = "통제가 안 돼! 누가 저 녀석 좀 막아 봐!!"
10028050-157 = "꺄아아아 미친 사람이다아아아아!!!"
