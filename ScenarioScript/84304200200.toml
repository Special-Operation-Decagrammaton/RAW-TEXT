[translation]
84304200200-5 = "자, 그러면 대충 상황은 정리됐고……."
84304200200-7 = "크윽……."
84304200200-8 = "뭐, 뭐야…… 대체 넌 누구냐……!"
84304200200-9 = "누구길래……!!"
84304200200-17 = "……힉."
84304200200-19 = "진짜 전형적인 대사네. 너희들은 이런 대사 배우는 학원이라도 같이 다니는 거냐?"
84304200200-20 = "그리고 얻어맞고 진 주제에 뭐가 잘났다고 선 질문이야? 질문은 내가 먼저 던지는 게 맞지 않겠어?"
84304200200-21 = "너희들이야말로 누구냐? 여긴 뭐 하러 와서 남의 학교 행사를 망치려 들어?"
84304200200-27 = "대답 여하에 따라서는……."
84304200200-32 = "아, 악의는 없어요! 우리라고 딱히 이 학교에 악감정을 가지고 있는 건 아니라고요!"
84304200200-33 = "맞아요. 그냥 알바, 알바니까……!!"
84304200200-35 = "……알바?"
84304200200-36 = "누구한테서 받은 알바인데? 뭐라고 받았는데?"
84304200200-38 = "에……. 그건 말 못 하죠. 여기서 바로 말해버리는 건 너무 의리 없……."
84304200200-46 = "다음. 너."
84304200200-47 = "히이이이이이-!!"
84304200200-48 = "몰라요, 진짜 몰라요!! 저희도 정확히 걔가 뭐 하는 앤지 모른다고요!"
84304200200-49 = "그냥 연락을 받고, 해달라는 거 해 주면 돈을 준다기에……!!"
84304200200-55 = "아, 전화 왔다."
84304200200-56 = "……받을까요?"
84304200200-57 = "스피커 폰으로."
84304200200-64 = "아, 아. 아-. 여보세요? 들리시나요?"
84304200200-65 = "잘 안 먹히나…… 어때요? 일은 잘 돼 가나요?"
84304200200-66 = "아, 으. 응. 말했던 피트니스 센터 쪽은 다 했어. 이제 보수 보내 주는 거야?"
84304200200-67 = "아. 물론이죠! 아이고, 부담스러운 일이었을 텐데, 고생 많으셨습니다! 바로 입금을……."
84304200200-68 = "……아!"
84304200200-69 = "그러고 보니 건수가 하나 더 있는데 말이죠. 혹시 그것도 함께 진행해 주실 수 있을까요?"
84304200200-70 = "물론 그것도 보수는 함께 쳐 드릴 테니까요!"
84304200200-71 = "응!? 하나 더……? 왜, 왜? 다 한 거 아니었어?"
84304200200-72 = "그게 말이죠, 이게 원래 큰 일을 하려다 보면 이런저런 이슈가 터지는지라……."
84304200200-73 = "돼, 됐어. 우리는 여기까지! 여기까지만 할 테니 일단 한 거만이라도 입금해 줘. 지금 바로!!"
84304200200-74 = "……????"
84304200200-75 = "어라? 이상하네요. 이건 좀 예상외의 반응인걸요? 당연히 기뻐하실 줄 알았더니."
84304200200-76 = "예상보다 시킨 일이 버거우셨나요? 아니면 갑작스레 중요한 약속이라도 생기신 걸까요?"
84304200200-77 = "그것도 아니면……."
84304200200-79 = "……적에게 잡힌 마당에, 눈앞에서 더 죄를 늘리고 싶지는 않은 기분이신가요?"
84304200200-80 = "……!!!"
84304200200-81 = "……!"
84304200200-82 = "아이고, 이것 참. 그 반응……. 그냥 한 번 찔러본 건데 역시나 정답이었던 모양이군요?"
84304200200-83 = "대단히 유감스럽지만…… 알고 계시죠? 저희의 계약. 작업 도중 걸려서 잡히거나 할 경우에는……"
84304200200-84 = "비밀 유지 조항에 어긋나기 때문에 계약은 파기. 비용은…… 드릴 수 없답니다?"
84304200200-85 = "뭐, 뭐라고!? 그런 말도 안 되는……! 이쪽은 여태까지 얼마나 고생을 했는데!!"
84304200200-86 = "그러게나 말이에요. 정말로 안타까운 이야기지요. 그렇게 돼선 안 되겠죠?"
84304200200-87 = "너무 걱정하진 마세요. 이쪽도 귀신은 아니니까, 그런 여러분을 위해 다시 한번 기회를 드릴 생각이거든요."
84304200200-88 = "계약상으로는 이쪽이 일방적으로 봐주는 게 돼버리겠지만…… 말씀하셨던 대로, 그간 꽤나 고생하셨으니까요."
84304200200-89 = "무슨 말을 하려고……."
84304200200-90 = "아, 물론 이것도 꽤나 어려운 조건이긴 하겠죠. 쉬운 일은 아닐 거예요."
84304200200-91 = "그렇잖아요? 제 예상이 틀리지 않았다면, 여러분을 붙잡고 있는 사람은 C&C의 미카모 네루일 텐데."
84304200200-93 = "……!!!"
84304200200-94 = "어떻게 알았어."
84304200200-95 = "하하, 이 일을 하다 보면 모를 수가 없긴 하거든요. 워낙 유명인이시기도 하고."
84304200200-96 = "하지만 그렇네요. 한동안 이런 쪽으로는 잠잠하다고 생각했는데, 아직도 츠카츠키 리오 회장의 오른팔 역할을 하고 있었을 줄이야."
84304200200-97 = "……? 뭐?"
84304200200-98 = "아니, 무슨 소릴 하는 거야? 나는 그 녀석의 오른팔 같은 거 한 적 없는데?"
84304200200-99 = "음? 그런가요? 아아, 그러면 단순한 협력 관계였나 보군요?"
84304200200-100 = "어이쿠, 제 정신 좀 보세요. 이거 사과해야겠네요. 저는 당신과 그 사람이 친구인 줄 알았거든요."
84304200200-101 = "하하, 그렇죠. 하긴 그렇겠죠. 하기사 세상에 누가……."
84304200200-102 = "그런 사람과 같은 편 먹고 싶어 하겠어요. 그렇죠?"
84304200200-103 = "그렇게까지 말한 적은 없는데."
84304200200-104 = "아무튼 지금은 그런 게 중요한 때가 아니네요! 거기 있는 사람들…… 그래 봬도 이번 일은 같이하기로 한 동료니까요."
84304200200-105 = "아무리 붙잡혔다고 한들, 일단 이번 일은 함께하기로 한 계약 관계."
84304200200-106 = "그걸 홱 버려버리는 것도……. 비즈니스 마인드로서는 어울리지 않고 말이죠. 저는 누구와 달라서 말이에요."
84304200200-110 = "……? 이 소리는……."
84304200200-111 = "응? 뭐지, 이 소리? 뭔가 삑삑거리는데……"
84304200200-116 = "……!! 폭탄!!"
84304200200-122 = "콜록, 콜록……!! 언제 이런 곳에 폭탄을……!!"
84304200200-123 = "이 틈입니다!! 여러분! 모두 퇴각!!"
84304200200-128 = "……!!! 아, 야!! 일어나, 일어나!! 도망치자!!"
84304200200-132 = "으, 응!? 어라……?! 웬 폭발!?"
84304200200-133 = "깜짝이야……!! 에, 나 기절해 있었나?"
84304200200-134 = "그런 소리 할 때가 아니라고! 일단 뛰어!!!"
84304200200-139 = "이 자식들, 쪼잔한 수를……!!!"
84304200200-140 = "거기 서지 못해!!"
