[translation]
1000506-1 = "한밤중의 순찰자"
1000506-2 = "아비도스 외곽 시내"
1000506-4 = "(밤 거리에서 우연히 호시노를 마주쳤다.)"
1000506-5 = "헤에? 선생?"
1000506-6 = "무슨 일이야? 이런 시간에 여기서?"
1000506-7 = "[s1] \"산책 중이었어.\"\n[s2] \"순찰 중이었어.\""
1000506-9 = "으헤, 아비도스의 밤은 무섭다고, 선생. 혼자서 이렇게 돌아다녀도 괜찮은 거야?"
1000506-11 = "으헤, 아비도스의 밤은 무섭다고, 선생. 혼자서 이렇게 돌아다녀도 괜찮은 거야?"
1000506-12 = "다른 학원들과는 달리 무법지대라구? 이러다가 불량배들이라도 만나면……."
1000506-13 = "나? 나는…… 음…… 그러니까…… 대충 순찰, 아니, 산책이랄까……."
1000506-14 = "아, 여기 계셨군요!"
1000506-15 = "아, 어, 어어?"
1000506-16 = "좀 전에 불량배들에게서 도와주신 학생분……! #n감사 인사를 드릴려고 했는데 갑자기 사라져버려서……."
1000506-17 = "감사합니다. 학생이 아니었다면 이번달 임대료를 전부 빼앗길 뻔 했어요……."
1000506-18 = "아, 아니……. 나, 나는 그냥……."
1000506-19 = "아아. 아비도스의 학생이시군요. #n밤마다 순찰을 다닌다는 소문은 들었지만 실제로 이렇게 만나게 될 줄은."
1000506-20 = "고맙습니다, 학생!"
1000506-21 = "……."
1000506-23 = "하아……."
1000506-24 = "[s] \"한밤중에 순찰을 다니고 있었어?\""
1000506-25 = "이건 어쩌다 그랬을 뿐이고…… 음……."
1000506-26 = "……뭔가 변명을 할수록 수렁에 점점 더 빠지는 기분이 드는데."
1000506-27 = "선생, ……부끄러우니까 모른 척 해주지 않을래. 지금도 사실 엄청 부끄러울 뿐이고 말이지……."
1000506-28 = "[s] \"호시노는 솔직하지 못하구나?\""
1000506-29 = "으아-! 이 아저씨를 놀리는 게 재밌어?"
1000506-31 = "……엄청 재밌다는 표정이잖아?!"
1000506-32 = "[s] \"자는 시간을 쪼개서까지 무리하진 마.\""
1000506-33 = "……. 에헤헤."
1000506-34 = "잠이 많은 건 원래 내 습관이야. 음, 딱히 무리를 하고 있는 것도 아니고."
1000506-35 = "……걱정해주는거야? 이 아저씨를 걱정해주는 건 역시 선생뿐인가아아-?"
1000506-36 = "으헤헤."
1000506-39 = "(호시노가 팔짱을 끼고 매달려 왔다.)"
1000506-40 = "앗, 그러고보니 갑자기 지병인 빈혈이……!"
1000506-41 = "어지러우니까 집까지 부축 좀 해줬으면 좋겠어. 선생."
1000506-42 = "자아, 어서 가자고. 자아. 가녀린 학생의 부탁이니까-"
1000506-44 = "(지나가던 사람이 있어서 금방 팔짱을 풀긴 했지만, 호시노와 함께 사이좋게 집으로 돌아갔다.)"
