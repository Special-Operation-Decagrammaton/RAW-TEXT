[translation]
2002103-1 = "특훈! 노려라, 산타!"
2002103-2 = "그래서 말이죠, 선생님!"
2002103-3 = "진정한 산타가 되기 위해 필요한 것이 또 무엇인지 생각해 봤는데요……!"
2002103-4 = "[s1] \"왠지 불안한 예감이 들기 시작했어……\"\n[s2] \"우리가 할 수 있는 거지? 그렇지?\""
2002103-5 = "아이, 참. 그렇게 불안해하지 마시고요."
2002103-6 = "아이, 참. 그렇게 불안해하지 마시고요."
2002103-7 = "당장 여기에서도 할 수 있는 일이란 말이에요."
2002103-8 = "[s] \"어째서인지 더 불안해지기 시작했어……\""
2002103-9 = "아무튼 제 결론은, 파쿠르였어요!"
2002103-10 = "네! 바로 그거예요! 맨몸으로 장애물을 극복하고, 벽을 오르고, 자기 자신을 뛰어넘는 운동이요!"
2002103-11 = "벽을 자유자재로 타고 올라가, 굴뚝으로 선물을 전해주고, 다시 무사히 빠져나오려면,"
2002103-12 = "파쿠르 같은 몸놀림이 꼭 필요할 거예요!"
2002103-13 = "그런 의미에서 선생님, 우리 같이 파쿠르 훈련을 해 보지 않으시겠어요?"
2002103-14 = "[s] 도망친다."
2002103-15 = "어허, 선생님! 도망치지 마세요! 어른이시잖아요!"
2002103-16 = "[s] \"하지만 파쿠르를 하기에 마땅한 장소도…… 없잖아?\""
2002103-17 = "파쿠르 연습은 어디에서나 가능하다고요!"
2002103-18 = "가령 여기 샬레 하우스만 해도…… 의외로 좋네요."
2002103-19 = "벽도 그다지 높지 않고, 튼튼한 구조물들도 많이 설치되어 있어요!"
2002103-20 = "산타는 어떤 상황에서도 포기하지 않으니까, 저도 포기하지 않고 도전할 거예요!"
2002103-21 = "자, 선생님. 제가 먼저 올라가 볼게요. 선생님도 따라 해 보시는 거예요?"
2002103-27 = "(말을 마치자마자 하나에는 벽을 타고 올라가기 시작했다.)"
2002103-32 = "(그러나 벽을 타는 하나에의 움직임은 어딘가…… 불안하고 위태로워 보였다.)"
2002103-33 = "여기에서 손을 이렇게, 그리고 다리를 저쪽으로……"
2002103-34 = "꺄악?!"
2002103-39 = "(떨어지는 하나에를 간신히 두 팔로 받아냈다.)"
2002103-41 = "[ns] \"거 봐, 위험하댔잖아……\""
2002103-42 = "하지만 선생님이 이렇게 받아주셨잖아요?"
2002103-43 = "선생님이 이렇게 지켜보고 계시는 이상, 저는 아무것도 두렵지 않아요!"
2002103-44 = "자, 선생님. 다음 장소로 가 보죠!"
2002103-49 = "(하나에는 막무가내로 나를 끌고 이곳저곳을 옮겨 다녔다……)"
2002103-51 = "여긴 쉽지 않겠네요…… 건물 벽도 매끈하게 가공되어 있고, 손이나 다리를 뻗을 곳도 마땅치 않아요."
2002103-52 = "하지만 이 정도에 굴한다면, 산타를 자처할 수도 없겠죠!"
2002103-53 = "[s] \"부탁이니까 자처하지 않으면 안 될까?!\""
2002103-54 = "미끄러지지 않도록 특수 장갑을 끼고…… 다리를 뻗을 곳을 주의하며……"
2002103-55 = "하나씩, 조심해서……!"
2002103-57 = "트리니티 건물들은 장식이 많아서, 상대적으로 오르내리기에는 편하겠네요."
2002103-58 = "하지만 만에 하나 장식을 손상시킨다면 큰일이 벌어질 테니,"
2002103-59 = "좀 더 신중하고 조심스럽게 움직일 필요가 있겠어요!"
2002103-60 = "[s] \"애초에 올라가지 않으면 장식이 손상될 일도 없을 텐데?!\""
2002103-62 = "균형을 잃지 않게 주의하면서…… 한곳에 너무 오래 머물지 말고……"
2002103-63 = "팔다리에 의지하기보다는 전신을 사용한다는 느낌으로……"
2002103-64 = "보세요, 선생님! 저 잘하고 있죠?"
2002103-65 = "[ns] \"앞을 봐, 하나에! 앞!\""
2002103-67 = "오래된 거주 구역"
2002103-68 = "이곳이야말로 가장 실전에 가까운 장소가 되겠네요."
2002103-69 = "집이 좀 낡았고, 자칫하면 깨지기 쉬운 구조물들도 어느 정도 있지만……"
2002103-70 = "그런 장애물을 극복하는 것이 파쿠르이고, 산타죠!"
2002103-71 = "[s] \"언제부터 산타가 그런 의미로 쓰이게 된 거지?!\""
2002103-73 = "(그 뒤로도 하나에는 차례차례 장소들을 정복해 나갔다……)"
2002103-74 = "(몇 번인가는 정말로 큰일이 날 뻔했지만, 다행히 마지막까지 아무 사고도 일어나지 않았다……)"
2002103-76 = "해냈어요! 도와주셔서 감사해요, 선생님!"
2002103-77 = "[s] \"위장이 쓰려……\""
2002103-78 = "이제야 비로소 제가 입고 있는 산타복에 부끄럽지 않을 수 있을 것 같아요!"
2002103-79 = "그리고 다음으로 도전할 것은……"
2002103-80 = "네? 아직도 도전할 것이 남았냐고요?"
2002103-81 = "당연하죠! 진정한 산타의 길에 다다르기 위해선 아직도 할 게 많다구요!"
2002103-82 = "역시 다음 목표는 '마하 2 이상의 속도로 하늘을 날기' 로 정하겠어요!"
2002103-83 = "어디로 가야 관련된 조언을 얻을 수 있을까요, 선생님? 역시 밀레니엄 분들께 여쭤봐야 할까요?"
2002103-84 = "듣기로는 거기의 엔지니어부 분들이 그렇게 대단하시다던데……"
2002103-85 = "[s] \"그것만은 제발 그만두자!\""
