[translation]
10017040-1 = "제4화;구호 익스프레스"
10017040-6 = "키보토스 시내"
10017040-7 = "평화롭군요."
10017040-8 = "순찰에서도 별다른 이상은 발견되지 않았고, 곧 성야가 찾아오겠지요."
10017040-9 = "……"
10017040-10 = "때로 두려워집니다. 도움이 필요한 사람들이 어딘가에 있는데도."
10017040-11 = "아직 알지 못한다는 이유로, 그 외침들을 묵살하고 있는 것은 아닌지."
10017040-12 = "신념과 긍지를 가슴에. 구호가 필요한 곳에 구호를."
10017040-14 = "아, 단장님! 어서 오세요……"
10017040-15 = "기다리고 있었어요! 네…… 정말로요."
10017040-17 = "세리나, 하나에. 수고가 많았습니다. 이제 저도 합류하지요."
10017040-18 = "선생님에게도, 감사드립니다."
10017040-19 = "그런데…… 둘 다 상당히 풀이 죽어 있는 것 같군요."
10017040-20 = "무슨 일이라도 있었나요?"
10017040-22 = "그게 말이에요, 단장님……"
10017040-23 = "어쩌면…… 진정한 구호가 필요한 사람들이 있었는데도, 저희가 제대로 도와드리지 못한 것 같아서……"
10017040-24 = "[s] \"어떻게든 괜찮다고 이야기해 주려고 했는데, 어렵네……\""
10017040-26 = "……구호가 필요한 곳에 구호를. 저희의 모토 중 하나이기도 하지요."
10017040-27 = "자세한 사정을 들어 봐야겠군요."
10017040-32 = "그게 정말인가요, 선생님?"
10017040-33 = "정의실현부가 그녀들의 치킨을 빼앗았고, 기댈 곳이 없었던 그녀들이,"
10017040-34 = "저희 구호기사단에게 하소연이라도 들어 달라고 했다는 것이?"
10017040-35 = "[s1] \"응…… 뭐, 일단은?\"\n[s2] \"처량하게 돌아서 걸어가는데, 보고 있기 참 그랬지……\""
10017040-39 = "저희가 뭔가 도와드릴 것이 없느냐고 물어봤지만……"
10017040-40 = "마음의 상처가 크셨나 봐요. 그저 기억하기만 해 달라고……"
10017040-42 = "그 마음은 백번 이해합니다. 세상에는 단지 기억되기만을 바라는 사람도 얼마든지 있지요."
10017040-43 = "목소리를 내도 닿지 않고, 누군가 자신들의 목소리를 들어 주기만이라도 바라는 사람들……"
10017040-44 = "아아, 어찌 이런 일이. 제가 너무 늦었던 모양이군요. 저를 마음껏 비난하셔도 좋습니다."
10017040-45 = "아, 아니에요. 단장님!"
10017040-46 = "그렇지만, 정의실현부가 왜 그런 일을 했을까요……?"
10017040-47 = "그분들께 듣기로는, 부장인 츠루기 님과 부부장인 하스미 님, 그리고 마시로 씨까지 계셨던 합동 작전이었다던데……"
10017040-48 = "[s3] \"하지만 뭔가 더 깊은 사정이 있었던 게 아닐까?\"\n[s4] \"그 셋이 아무 이유도 없이 누군가를 괴롭힐 것 같지는 않은데……\""
10017040-51 = "어라……? 선생님께서 그렇게 말씀하시니 또 그런 것 같은 느낌도 드네요……?"
10017040-52 = "하지만 그렇다기엔 치킨을 빼앗긴 분들의 사정이……"
10017040-54 = "세리나, 하나에. 그리고 선생님께도. 이건 이야기해둬야 하겠군요."
10017040-55 = "정의의 편을 표방한다고 해서 언제나 옳은 일을 하리라고 믿는 것은 위험합니다."
10017040-56 = "오히려 그렇기에 놓칠 수 있는 것들이 생기고, 불쌍한 사람들이 생겨나기 마련이니까요."
10017040-57 = "아시겠습니까? '구호'는…… 언제 어느 때라도, 누구에게나 주어져야 합니다!"
10017040-59 = "네, 넷! 단장님!"
10017040-60 = "알겠어요, 단장님!"
10017040-61 = "[s] \"미네는 엄격하구나……\""
10017040-63 = "엄격하다거나 부드럽다거나, 그런 문제가 아닙니다. 선생님."
10017040-64 = "중요한 것은 지금, 이 순간 '구호'가 필요한 장소가 어디인지 분간하는 것."
10017040-65 = "그리고 그 장소에 필요한 '구호'를 가지고 기꺼이 나아갈 용기를 가지는 것!"
10017040-69 = "지금 여기에서 누구보다 우리의 '구호'가 필요한 것은……"
10017040-70 = "바로, 정의실현부입니다!"
10017040-72 = "네에?!"
10017040-73 = "정의…… 실현부요?"
10017040-74 = "[s] \"저기…… 그건 어떤 논리야……?\""
10017040-76 = "구호는 단순히 물질적인 것에 한정되어서는 안 됩니다!"
10017040-77 = "사랑하는 사람들이, 그리고 뜻을 함께하는 동료가 길을 엇나갔을 때,"
10017040-78 = "그것을 가슴 아파하며 바로잡아 주는 것 역시 구호."
10017040-79 = "그리하여 문제의 원인을 제거하는 것이 또한 진정한 의미에서의 구호라고 할 수 있겠지요."
10017040-80 = "세리나, 하나에. 그리고 선생님."
10017040-81 = "저는 이제부터 정의실현부로 향할 겁니다."
10017040-83 = "다, 단장님?!"
10017040-84 = "어, 어어……"
10017040-85 = "[s5] \"잠깐, 잠깐만!\"\n[s6] \"정의실현부는 왜?!\""
10017040-89 = "당연히 이번 일의 진상을 알아내기 위해서죠."
10017040-90 = "진상을 알아내서 어떻게 할 생각이냐고요?"
10017040-91 = "말씀드렸듯이, 정의실현부에게 정의를 되찾아 줄 생각입니다."
10017040-92 = "그것이, 구호기사단이 친애하는 '동료'에게 줄 수 있는…… 최대한의 '구호'일 것입니다!"
10017040-93 = "하, 하지만 지금 정의실현부는, 카페를 빌려서 송년회를 열고 있는 중일 텐데요……?"
10017040-94 = "……"
10017040-95 = "그렇다면 더욱 잘 됐군요."
10017040-96 = "자신들의 행위에 책임도 지지 않고 여유롭게 크리스마스를 즐기고 있다니!"
10017040-97 = "정의라는 이름이 목을 놓아 통곡할 것입니다!"
10017040-98 = "저, 단장님? 단장님??"
10017040-99 = "들으세요, 세리나. 하나에."
10017040-100 = "이 자리를 지켜도 좋고, 저를 따라와 주셔도 좋습니다."
10017040-101 = "어느 쪽이든 구호를 위한 길. 그것은 당신들의 판단에 맡기겠습니다."
10017040-102 = "하지만 저는 정의실현부로 향하겠습니다."
10017040-103 = "신념과 긍지를 가슴에! 구호가 필요한 곳에 구호를!"
10017040-109 = "[ns] \"어, 어떡하지?!\""
10017040-110 = "어쩌죠, 선배? 단장님이 벌써…… 저만큼이나 멀리……"
10017040-111 = "[s] \"우리도 일단 따라가자!\""
10017040-112 = "네, 네!"
