[translation]
10001030-1 = "제3화;구교사 227호 특별반"
10001030-2 = "붉은겨울 학원 설산"
10001030-5 = "으으, 벌써 한 시간이나 걸었는데……"
10001030-6 = "구교사는 커녕 건물 코빼기도 안 보이잖아!"
10001030-7 = "구교사는 얼마나 더 가야 도착할 수 있는 거야?"
10001030-8 = "붉은겨울 학원의 부지는 키보토스의 학원 중에서도 넓기로 유명하니까요. 부지 외곽까지 걸어가려면 조금 더 시간이 필요합니다."
10001030-9 = "하지만~ 그렇게 말해도 못하는 건 못 하는 거라고!"
10001030-10 = "으읏…… 이제는 다리가 아파서 한 발자국도 못 걷겠어!"
10001030-11 = "그럼 잠시 쉬었다가 갈까요?"
10001030-13 = "아니, 그럴 필요는 없다. 이 몸에게 좋은 수가 있거든!"
10001030-17 = "콤라드, 업어줘!"
10001030-18 = "[s1] 체리노를 등에 업는다.\n[s2] 못 들은 체한다."
10001030-22 = "모르는 척하지 말고!"
10001030-23 = "업어주지 않는다면 억지로라도 업힐 테다!"
10001030-29 = "으, 으읏…… 새, 생각보다 높아서 무서워……."
10001030-30 = "하지만 아까보다 훨씬 멀리까지 보이는 데다가, 공기도 더 상쾌한 느낌이군!"
10001030-31 = "이것이 마리나나 토모에가 지켜보는 세상의 모습인가……."
10001030-33 = "어머나, 정말 멋진 모습이네요!"
10001030-35 = "마치 나무에 매달린 원숭이 같아서 귀엽…… 아니, 위엄이 넘치십니다!"
10001030-36 = "그, 그런가? 헤헤헤……."
10001030-37 = "기념으로 사진 한 장만 찍어도 괜찮을까요?"
10001030-39 = "얼마든지 찍으라고! 이 높이면 화면에서 머리가 잘릴 걱정도 없으니까!"
10001030-50 = "보세요, 체리노 쨩. 선생님께 업힌 덕분에 키가 큰 것처럼 사진이 나왔어요!"
10001030-51 = "어디, 어디……."
10001030-54 = "오오, 정말이잖아!"
10001030-55 = "후후후, 만족스럽군. #n나중에 사무국에 복귀하더라도 이대로 계속 등에 업힌 채로 업무를 보아야겠어."
10001030-56 = "그럼 이 몸이 키가 작다고 무시하는 학생들도 없어지겠지? 하하하!"
10001030-57 = "정말 멋진 생각이십니다, 체리노 회장님."
10001030-58 = "다른 사람의 등에 올라탄 채 근엄하게 지시를 내리신다면, 붉은겨울의 학생들도 회장님의 높아진 시선에 분명 감탄을 금치 못하겠지요."
10001030-59 = "그렇지? 사무국에 복귀한다면 마리나에게 바로 업어 달라고 해야겠어!"
10001030-60 = "물론 그 전에 쿠데타를 일으킨 죄는 엄중히 숙청해야겠지만!"
10001030-61 = "한 달 동안 토끼 사육장에서 먹이를 주게 할까? #n아니, 토끼는 귀여우니까 벌이 되지 않아! 좀 더, 좀 더 무시무시한 벌을 내려야……."
10001030-64 = "[ns] \"히, 힘들어…….\""
10001030-65 = "어머나, 선생님? 어디 불편하신 곳이라도 있으신가요?"
10001030-66 = "설마…… 깃털보다 더 가벼운 저희 회장님의 무게가 부담스러운 건 아니시겠지요?"
10001030-67 = "아니면 샬레의 선생님이나 되시는 분이 다리가 아픈 회장님을 버려두고 혼자 도망치실 셈은 아니시겠지요?"
10001030-68 = "[s] \"그런 건 아니지만…….\""
10001030-70 = "무얼 꾸물거리는 거야, 콤라드. 이러는 사이에도 마리나가 뒤쫓아오고 있을지도 모른다고!"
10001030-71 = "빨리 발을 움직여서 구교사로 가자고!"
10001030-72 = "이랴, 이랴!"
10001030-74 = "이후, 한 시간 가까이 체리노를 업은 채로 산길을 걸었다……."
10001030-76 = "붉은겨울 학원 구교사"
10001030-78 = "드디어 도착했습니다, 회장님. 이곳이 구교사입니다."
10001030-79 = "지금은 더 이상 사용되지 않지만, 과거 붉은겨울 학원의 학생들이 면학에 힘쓰며 청춘을 불살랐던 영광스러운 장소이지요."
10001030-80 = "그런 것 치고는 낡고 지저분한 폐허처럼 보이는데……"
10001030-81 = "게다가 분위기도 으스스한 게 어쩐지 곰이 나올 것만 같아."
10001030-82 = "정말로 앞으로는 여기서 지내야 해, 토모에?"
10001030-83 = "물론 언젠가는 다시 사무국으로 돌아가야지요."
10001030-84 = "하지만 지금은 마리나 위원장에게 쫓기는 신세이니 당장은 어렵네요."
10001030-85 = "다만 체리노 회장님께서 열심히 노력해주신다면 더 빨리 돌아갈 수 있을 겁니다!"
10001030-86 = "그, 그래?"
10001030-87 = "역시 이 몸의 힘이 없으면 아무것도 해결할 수 없는 모양이군!"
10001030-88 = "좋아, 그럼 이곳을 우리의 새로운 근거지로 삼아 사무국을 되찾는 거다!"
10001030-90 = "누구 마음대로 그런 결정을 내리시는 건가요!"
10001030-91 = "이, 이런 외진 곳에 누구냐? 서, 설마 곰인가?"
10001030-99 = "고, 곰이라고요? 어, 어디에 곰이 있나요?"
10001030-100 = "진정해, 노도카. 그저 겁에 질린 체리노 회장이 착각한 것뿐이야."
10001030-102 = "누가 겁을 먹었단 말이냐!"
10001030-103 = "그보다 그대들은……."
10001030-104 = "흥, 이제야 저희를 알아보시는 건가요?"
10001030-106 = "……누구?"
10001030-107 = "네? 정말로 저희를 잊고 계셨단 말인가요? 믿을 수가 없어요!"
10001030-108 = "이 가혹한 구교사의 환경 속에서 하루하루 힘겹게 버티면서도, 체리노 회장께서 언젠가는 신교사로 다시 불러 주실 거라고 믿고 기다리고 있었는데!"
10001030-109 = "하지만 그렇게 말해도 기억이 나지 않는걸……."
10001030-110 = "토모에 비서실장, 붉은겨울 학원 구교사에도 동아리가 있었던가?"
10001030-111 = "공식적으로는 존재하지는 않습니다만, 구교사에는 <227호 특별반>이라고 하여 붉은겨울 학원 내에서 정학 조치를 받은 학생들이 임시로 지내게 되는 시설이 있습니다."
10001030-112 = "임시 시설이라고? #n그런데 어째서 이 학생들은 신교사로 복귀하지 않고 이곳에 계속 있는 거지?"
10001030-113 = "그 복귀 명령을 내릴 수 있는 분이 회장님이십니다."
10001030-114 = "……아, 기억났다! 전에 교내에서 콤라드를 몰래 망원경으로 스토킹하다가 걸려서 정학을 맞은 그 변태잖아?"
10001030-115 = "사무국의 일이 하도 바빠서 깜빡 잊고 있었네."
10001030-116 = "사람을 얼어붙은 북쪽의 땅으로 쫓아내 놓고서는 깜빡했다니요! #n그게 무슨 무책임한 말씀이신가요!"
10001030-117 = "저희가 이곳에서 <생존>하느라 얼마나 고생했는 줄 아세요?"
10001030-118 = "간식은 물론이고 배를 채울 수 있는 식사조차도 제대로 배급되지 않고!"
10001030-119 = "혹한의 추위를 이겨낼 만한 제대로 된 난방기구도 없고—"
10001030-120 = "밤에는 이불 속에서 벌레가 나오고!"
10001030-121 = "가끔은 굶주린 곰이 교사 안쪽을 배회하기도 하고—"
10001030-122 = "뭐, 뭐라? 정말로 곰이 나온단 말이냐?"
10001030-123 = "토, 토모에. 아무래도 이 구교사는 안 되겠어. 다, 다른 장소를 찾으면 안 될까?"
10001030-124 = "안 돼요, 체리노 쨩. 이럴 때일수록 붉은겨울 학원의 지도자다운 근엄한 면모를 보여주어야 한다고요."
10001030-125 = "하지만 곰은 무서운걸……."
10001030-126 = "여하튼 체리노 회장께서 이렇게 직접 찾아오셨으니, 이제 저희는 구교사에서 벗어날 수 있는 건가요?"
10001030-127 = "어어, 그게……."
10001030-128 = "유감스럽지만 지금 저희에게는 여러분의 정학을 취소해 드릴만 한 권한이 없습니다."
10001030-129 = "어, 어째서인가요?"
10001030-130 = "체리노 회장님은 지금 쿠데타로 학생회장의 자리에서 실각하여 도망치는 중이시거든요."
10001030-131 = "이게 다 마리나 녀석 때문이다! 녀석이 쿠데타를 일으키지만 않았더라면 이 몸이 사무국에서 도망쳐 이런 지저분한 장소에 올 일도 없지 않았느냐!"
10001030-133 = "뭐야, 그럼 지금의 체리노 회장은 아무런 권력도 없는 평범한 꼬맹이라는 소리잖아요?"
10001030-134 = "……좋다 말았네."
10001030-135 = "으읏! 누가 꼬맹이라는 것이냐!"
10001030-136 = "아무리 권력을 잃었다지만, 이 몸은 붉은겨울 학원의 서기장이자 미화부장이자 청소부장인…… 온갖 거창한 직책들은 다 맡고 있는 위대한 체리노이시다!"
10001030-137 = "이 권위의 상징인 수염이 보이지 않느냐!"
10001030-139 = "그런 가짜 수염, 아무도 신경 쓰지 않는다고요!"
10001030-141 = "뭐, 뭐라……?"
10001030-145 = "토, 토모에. 이 수염이 가짜라는 사실을 어째서 학생들이 알고 있는 것이냐?"
10001030-147 = "노도카 양이 어림잡아 한 이야기일 테니, 신경 쓰지 않으셔도 괜찮아요."
10001030-148 = "그, 그래! 아무것도 모르면서 함부로 말하지 말거라, 이 에로 꼬맹이!"
10001030-149 = "휴일마다 높은 곳에 올라가 망원경으로 선생님을 관음하며 흥분하는 변태 주제에!"
10001030-150 = "누, 누구더러 에로 꼬맹이라는 건가요?"
10001030-151 = "그렇게 말하는 체리노 회장이야말로 구교사로 오는 내내 선생님께 업혀 계셨잖아요?"
10001030-152 = "부, 부럽게시리……"
10001030-153 = "체리노 회장이 더 에로 꼬맹이예요!"
10001030-154 = "그건 나와 콤라드의 유대를 보여주는 행위였을 뿐이니라! 그렇게 생각하는 네 녀석이야말로 더 에로 꼬맹이다!"
10001030-155 = "적어도 이 몸은 선생님을 스토킹하지는 않았느니라!"
10001030-156 = "스토킹이라뇨! 그건 선생님을 존경하는 학생으로서 해야 할 당연한 일과였다고요!"
10001030-157 = "저보다 키도 작은 꼬맹이 주제에!"
10001030-158 = "이 몸보다 나이도 어린 꼬맹이 주제에!"
10001030-159 = "[s] \"초등학생의 싸움처럼 되어버렸네…….\""
10001030-160 = "어머, 어머. 두 분 모두 정말 기운차시네요. 후후."
10001030-161 = "하지만 마리나 위원장이 사무국을 점거한 이때에, 저희들끼리 싸우기만 해서는 아무것도 해결할 수 없답니다."
10001030-162 = "특별반의 여러분도 구교사에서 벗어나고 싶으시다면 부디 저희에게 힘을 보태주세요."
10001030-163 = "하지만 이런 건방진 꼬마와 손을 잡으라니……"
10001030-164 = "저는 사양하겠어요!"
10001030-165 = "이 몸도 마찬가지이니라! 이런 에로 꼬맹이와는 동지가 될 수 없느니라!"
10001030-166 = "두 분 모두 의견을 굽힐 생각이 없으신 것 같으니…… 이것 참 곤란하네요."
10001030-171 = "누가 더 꼬맹이인지 시비를 가리는 거라면 마침 좋은 방법이 있지!"
10001030-172 = "시구레 쨩?"
10001030-173 = "예로부터 진정한 어른은 말술을 마시고도 취하지 않는다는 말이 있잖아?"
10001030-174 = "그러니 <많이 마시기 대회>를 통해 누가 진짜 어른인지, 꼬맹이인지 결정하는 거야!"
10001030-175 = "시구레 양. 아무리 이곳이 구교사라지만, 학생이 술을 마시는 건 붉은겨울 학원의 교칙에 어긋나는 일이에요!"
10001030-176 = "물론 진짜 술을 마시자는 건 아니야."
10001030-177 = "대신 준비한 건 이반 쿠팔라 축제를 맞아 내가 특별히 만들어 둔 특제 캄포트야!"
10001030-178 = "다만 구교사의 냉장 설비가 부족해서 일부가 살짝 발효되기는 했지만……."
10001030-179 = "뭔가 수상쩍은데……."
10001030-180 = "겁이 난다면 참가하지 않아도 괜찮아, 체리노 회장."
10001030-181 = "물론 겁쟁이라는 오명은 피할 수 없겠지만."
10001030-182 = "누, 누가 겁쟁이라는 것이냐! 이깟 음료수쯤은 얼마든지 마셔줄 수 있느니라!"
10001030-183 = "저, 저도 마찬가지예요! 아무리 못하더라도 체리노 회장에게는 지지 않아요!"
10001030-184 = "좋아, 지난가을에 담가둔 캄포트가 빛을 발할 때로군!"
10001030-186 = "곧이어 시구레가 시큼한 냄새가 나는 과일 음료수를 가져왔다."
10001030-193 = "저…… 시구레 쨩. 이거 정말로 술 아닌 거 맞지?"
10001030-194 = "기, 기억났어. 그러고 보니 이 학생은 전에 배급용 캄포트에 보드카를 섞다가 정학을 받았던 그……."
10001030-195 = "자자, 잡담을 할 시간은 없다고."
10001030-196 = "그럼 준비하시고,"
10001030-197 = "시합, 시작!"
