[translation]
901010400130-6 = ""
901010400130-9 = ""
901010400130-11 = "สวัสดีค่ะ...!"
901010400130-12 = ""
901010400130-14 = ""
901010400130-15 = "ตกใจหมด จู่ ๆ จะตะโกนทำไมเนี่ย?"
901010400130-16 = "ถ้าฉันตกใจจนทำเครื่องมือหล่นระหว่างทำงานขึ้นมา จะรับผิดชอบยังไง!"
901010400130-17 = "แหะๆ... ขอโทษด้วยค่ะ พอดีฉันอยากรีบเอาข่าวใหญ่มาบอกทุกคน ก็เลยรีบร้อนไปหน่อยค่ะ"
901010400130-18 = ""
901010400130-21 = ""
901010400130-22 = "ข่าวใหญ่เหรอ...?"
901010400130-24 = "ใช่ค่ะ ทำงานกันจนบ่ายแบบนี้ คงหิวกันแล้วใช่มั้ยคะ?"
901010400130-25 = "<FOX EATS> ของเรามีโปรโมชันพิเศษมาฝากทุกคนค่ะ!"
901010400130-26 = "แค่ร่วมตอบแบบสอบถามของ <FOX EATS> ตอนนี้..."
901010400130-27 = ""
901010400130-29 = ""
901010400130-30 = "ก็รับข้าวกล่องจากร้าน <เต้าหู้ทอดโยชิโนะ> ชื่อดังไปได้เลยค่ะ ฟรีเลยนะคะ!"
901010400130-31 = "เชิญเลยค่ะ มาร่วมตอบแบบสอบถามแล้วรับข้าวกล่องฟรีไปได้เลยค่ะ!"
901010400130-33 = "ฟังดูน่าสงสัยแฮะ..."
901010400130-34 = "นั่นสิ ของฟรีไม่มีในโลกไม่ใช่เหรอ... มีแผนอะไรแอบแฝงอยู่หรือเปล่า?"
901010400130-36 = "แน่นอนว่ามีเงื่อนไขเล็กๆ น้อยๆ อยู่นิดหน่อยค่ะ..."
901010400130-37 = "แบบสอบถามนี้จะนำไปใช้เพื่อพัฒนาผลิตภัณฑ์และบริการของ <FOX EATS> และอาจมีการเปิดเผย#nข้อมูลแก่บุคคลที่ 3 เพื่อใช้ในการสำรวจความนิยมและประชาสัมพันธ์ผลิตภัณฑ์บางรายการค่ะ ข้อมูลจากแบบสอบถามจะถูกเก็บไว้เป็นเวลา 36 เดือนนับจากวันที่ตอบแบบสอบถาม และถ้าหากว่ามีข้อ..."
901010400130-39 = "พอแล้ว...! โอเคๆ เข้าใจแล้ว!"
901010400130-40 = "พอได้ยินเธอพล่ามข้อความประชาสัมพันธ์ที่เต็มไปด้วยถ้อยคำสวยหรูแบบนั้น ดูเหมือนว่าบริษัทการตลาดที่ไหนสักแห่งกำลังผลาญเงินไปกับเรื่องไร้สาระอีกแล้วสินะ"
901010400130-41 = "แต่ก็เอาเถอะ อาหารไม่ได้ผิดอะไรนี่นา งั้นขอรับไว้ก็แล้วกัน"
901010400130-42 = "ฉันก็กำลังหิวอยู่พอดีด้วย"
901010400130-43 = "ขอลองหน่อยซิ..."
901010400130-44 = ""
901010400130-46 = ""
901010400130-47 = ""
901010400130-48 = ""
901010400130-49 = "โอ้ ไม่เลวเลยนะ..."
901010400130-50 = "ซูชิเต้าหู้หวานอันนี้อร่อยจริงๆ เลย ข้าวก็ร่วนกำลังดี เต้าหู้ทอดก็ชิ้นหนา ถูกใจเลย "
901010400130-51 = "แต่ถ้าจะมีอะไรที่ติดใจอยู่สักอย่างละก็..."
901010400130-53 = "อ๊ะ มีอะไรที่ไม่ถูกใจหรือเปล่าคะ?"
901010400130-54 = "คำติชมอย่างตรงไปตรงมาจะเป็นประโยชน์ต่อการปรับปรุงบริการ <FOX EATS> มากเลยค่ะ เชิญบอกได้เต็มที่เลยนะคะ!"
901010400130-55 = "เครื่องที่ใส่มานี่คือปูอัดเหรอ...?"
901010400130-56 = "เต้าหู้ทอดอร่อยขนาดนี้ แต่ดันใช้ปูอัดแทนเนื้อปูจริง น่าเสียดายอยู่เหมือนกันนะ"
901010400130-57 = ""
901010400130-59 = ""
901010400130-60 = "เอ๋~? แต่ 'เนื้อปูแท้ๆ' ราคาแพงมากเลยไม่ใช่เหรอคะ?"
901010400130-61 = "เท่าที่เคยได้ยินมา ปูแพงถึงขนาดที่ต้องจ่ายค่าแรงที่หาได้ทั้งวัน ถึงจะซื้อได้สักตัวหนึ่งเลย..."
901010400130-62 = "นั่นมันเรื่องตั้งแต่เมื่อไรแล้ว? ราคาปูตกฮวบมาตั้งหลายเดือนแล้วนะ"
901010400130-64 = "ใช่ ราคามันตกจนแทบไม่คุ้มค่าน้ำมัน ทุกวันนี้พวกเรายังคิดกันอยู่เลยว่าควรลดจำนวนวันที่ออกเรือ#nหรือเปล่า"
901010400130-66 = "งั้นเหรอคะ? แต่ปูที่วางขายตามตลาดกับซูเปอร์มาร์เก็ตก็ยังแพงอยู่เลยนะคะ..."
901010400130-67 = "ถ้าไม่เชื่อก็ลองไปดูที่โกดังสินค้าตรงโน้นสิ ปูที่ขายไม่ออกกองอยู่เป็นภูเขาเชียวละ"
901010400130-68 = "อย่างนี้เองสินะคะ... เข้าใจแล้วค่ะ ฉันจะเอาความคิดเห็นของพวกคุณส่งต่อให้ทางร้านค่ะ"
901010400130-69 = "อ้อ จริงสิ มีอีกเรื่องหนึ่งที่ฉันอยากขอถามหน่อยค่ะ"
901010400130-70 = "ไม่ทราบว่าเคยได้ยินเรื่อง <ปูในถังเหล็ก> บ้างมั้ยคะ?"
901010400130-71 = "ปูในถังเหล็ก...? มีผู้ประกอบการที่ขนส่งปูด้วยถังเหล็กด้วยเหรอ?"
901010400130-73 = "ที่อื่นจะทำยังไงก็ไม่รู้ แต่พวกเราส่งปูด้วยลังไม้กันน่ะ ลองไปดูที่โกดังสินค้าสิ"
901010400130-74 = "ได้ค่ะ ขอบคุณที่ให้ความร่วมมือตอบแบบสอบถามนะคะ"
901010400130-75 = "ขอให้มีช่วงบ่ายที่ดีค่ะ!"
