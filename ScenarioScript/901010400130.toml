[translation]
901010400130-11 = "……안녕하세요!"
901010400130-15 = "깜짝이야. 갑자기 왜 소리를 지르는 거야?"
901010400130-16 = "작업 중에 실수라도 해서 공구를 놓치기라도 했으면 어쩌려고!"
901010400130-17 = "헤헤…… 죄송해요. 여러분을 위한 빅 뉴스를 전달하고 싶어서 서두르다 보니 마음이 급해져서요."
901010400130-22 = "……빅 뉴스?"
901010400130-24 = "네. 점심 시간이 살짝 지난 오후까지 일하시다보면 시장하시죠?"
901010400130-25 = "그런 여러분을 위해, 저희 <FOX EATS>에서 특별 프로모션을 준비했답니다!"
901010400130-26 = "지금 저희 <FOX EATS>에서 진행하는 설문에 참여하시면 무려……"
901010400130-30 = "인기 있는 유명 유부 초밥 가게, <요시노 유부>의 도시락을 무료로 증정하고 있답니다!"
901010400130-31 = "자. 바로 설문에 참여하고 공짜 도시락, 받아가세요!"
901010400130-33 = "……뭔가 수상한데."
901010400130-34 = "맞아. 세상에 공짜는 없다는데…… 무슨 꿍꿍이가 있는 거 아냐?"
901010400130-36 = "물론 사소한 조건이 몇 가지 있습니다만……"
901010400130-37 = "본 설문조사는 <FOX EATS>의 제품 및 서비스 개선을 위해 사용되며, 특정 제품에 대한 선호도 조사 및 홍보를 목적으로 제 3자에게 제공될 가능성이 있습니다. 설문 결과는 설문 시점에서 36개월 간 보존되며, 위 내용에 이의가 있을 경우 <FOX EATS>의 고객상담센터에 내방하셔서—"
901010400130-39 = "그만……! 알았어, 알았으니까!"
901010400130-40 = "그렇게 미사여구가 가득한 안내문을 지껄이는 걸 보니, 또 어디 마케팅 기업에서 쓸데없는 데 돈을 쓰고 있는 모양이구만."
901010400130-41 = "뭐 음식에는 죄가 없으니 사양하진 않겠지만."
901010400130-42 = "안 그래도 배가 고팠던 참이기도 했고."
901010400130-43 = "어디……"
901010400130-49 = "오, 이건 제법……"
901010400130-50 = "정말 맛있는 유부초밥인걸? 밥도 고슬고슬하고 유부도 두툼하니 마음에 들어."
901010400130-51 = "하나 마음에 걸리는 게 있다면……"
901010400130-53 = "앗, 뭔가 걸리는 부분이 있으신가요?"
901010400130-54 = "솔직한 평가는 <FOX EATS>의 음식 서비스를 개선하는 데 큰 도움이 되니, 부담갖지 말고 말씀해 주세요!"
901010400130-55 = "……여기 들어간 이 고명은 게맛살인가?"
901010400130-56 = "이렇게 맛있는 유부에 가짜 게살을 쓰다니, 조금 아쉽구만."
901010400130-60 = "어라~? 하지만 '진짜 게살'은 엄청나게 비싸지 않나요?"
901010400130-61 = "들리는 말에 의하면 하루 일당을 써야 게 한 마리를 살 수 있을 정도로 비싼 식재료라고 들었는데—"
901010400130-62 = "그게 언제적 이야기야? 게 값이 바닥을 친지가 벌써 몇 개월이 넘었는데."
901010400130-64 = "맞아. 얼마나 가격이 헐한지, 기름 값도 안 나와서 요새는 조업 나가는 횟수를 줄여야 하나 고민하고 있을 정도라고."
901010400130-66 = "그런가요? 시장이나 마트에서 파는 게의 값은 여전히 비싼 것 같은데……"
901010400130-67 = "의심가면 한 번 저기 물류 창고 쪽에 가 봐. 안 팔린 게가 산처럼 쌓여 있으니."
901010400130-68 = "그렇군요…… 알겠습니다. 주신 피드백은 확실히 가게에 전달해 두겠습니다."
901010400130-69 = "아, 참. 그리고 하나 더 여쭤보고 싶은 게 있는데요."
901010400130-70 = "혹시 <드럼통 속의 게>에 대해 들어보신 적이 있으신가요?"
901010400130-71 = "드럼통 속의 게……? 게를 드럼통에 담아 수송하는 업자도 있나?"
901010400130-73 = "다른 곳은 어떨지 몰라도 우리는 게를 나무 상자에 담아서 납품해. 물류 창고에 가면 볼 수 있을 거야."
901010400130-74 = "알겠습니다. 설문에 응해주셔서 대단히 감사합니다."
901010400130-75 = "그럼 좋은 오후 되세요!"
