[translation]
901010400130-6 = ""
901010400130-9 = ""
901010400130-11 = "...Excuse me!"
901010400130-12 = ""
901010400130-14 = ""
901010400130-15 = "Ah! Why are you yelling?"
901010400130-16 = "I almost dropped a tool!"
901010400130-17 = "Heehee... I'm sorry. I was just so excited because I have such big news to share!"
901010400130-18 = ""
901010400130-21 = ""
901010400130-22 = "...Big news?"
901010400130-24 = "Yes. Lunch was hours ago, and you've been working the whole time! You must be hungry!"
901010400130-25 = "Which is why FOX EATS prepared a special promotion just for you!"
901010400130-26 = "If you participate in a short survey from FOX EATS right now..."
901010400130-27 = ""
901010400130-29 = ""
901010400130-30 = "You'll get a complimentary bento from \"Yoshino Inarizushi\"! Eat real neato with Yoshino!"
901010400130-31 = "All you need to do is answer a couple questions. Just a few minutes, and you'll earn a FREE bento! INSTANTLY!"
901010400130-33 = "...Something's fishy."
901010400130-34 = "Yeah. They say nothing's free in this world... You're up to something, aren't you?"
901010400130-36 = "Not at all. Naturally, there are a few minor conditions..."
901010400130-37 = "This survey is used by FOX EATS to improve product and services, and survey results may be shared to third parties for promotional purposes. Survey results will be retained for 36 months. For any inquiries, please contact FOX EATS' customer service to—"
901010400130-39 = "Stop... I got it, I got it!"
901010400130-40 = "Based on the way she rattled that off, it looks like some upstart marketing firm's burning through their money again."
901010400130-41 = "That said, she mentioned free food."
901010400130-42 = "And I just so happen to be hungry."
901010400130-43 = "Let's see..."
901010400130-44 = ""
901010400130-46 = ""
901010400130-47 = ""
901010400130-48 = ""
901010400130-49 = "Huh, this is..."
901010400130-50 = "Now THAT'S some good inarizushi! The rice has great texture, and the fried tofu is just the right thickness."
901010400130-51 = "But still..."
901010400130-53 = "Ah, is something bothering you?"
901010400130-54 = "Your honest feedback is incredibly helpful! FOX EATS always seeks to improve our service, so please share your honest opinion."
901010400130-55 = "...Did they put a crab stick in here?"
901010400130-56 = "It's a bit of a shame that they sullied such delicious tofu with fake crab meat."
901010400130-57 = ""
901010400130-59 = ""
901010400130-60 = "Huh? I thought that was common. Isn't genuine crab prohibitively expensive?"
901010400130-61 = "From what I heard, crab is a luxury. I heard its so pricey that a single crab would cost my whole day's wage!"
901010400130-62 = "That's old news, kid. Crab prices are way down. Like on the ocean floor."
901010400130-64 = "Yeah. Their prices are so low that we're considering cutting back on our fishing runs. We barely make enough to cover the cost of fuel."
901010400130-66 = "Is that so? But it feels like crab is always so expensive at the market."
901010400130-67 = "That's a store. THIS is the real world. If you're so skeptical, take a look in that warehouse. You'll find a mountain of unsold crab."
901010400130-68 = "I see... I understand. I will make sure your feedback reaches...the restaurant."
901010400130-69 = "Oh, this reminds me! Since you all work here, I'm curious."
901010400130-70 = "Have you heard of something like...\"crabs in a drum barrel\" before?"
901010400130-71 = "\"Crabs in a drum barrel\"...? Are there people who deliver crabs in a drum barrel?"
901010400130-73 = "I don't know about other places, but we send our crabs out in wooden crates. Look in the warehouse. You'll see."
901010400130-74 = "Interesting. Thank you for participating in the survey."
901010400130-75 = "Have a wonderful afternoon!"
