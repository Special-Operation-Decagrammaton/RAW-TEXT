[translation]
901010400130-6 = ""
901010400130-9 = ""
901010400130-11 = "……您好！"
901010400130-12 = ""
901010400130-14 = ""
901010400130-15 = "……嚇我一跳。#n為什麼要突然喊這麼大聲啊？"
901010400130-16 = "萬一作業中失手沒拿穩工具，掉下去了怎麼辦！"
901010400130-17 = "耶嘿嘿……不好意思。#n為了想盡快將這個重大消息告訴大家，結果太心急了……"
901010400130-18 = ""
901010400130-21 = ""
901010400130-22 = "……重大消息？"
901010400130-24 = "是的。從早上一直工作到下午，肚子是不是餓了呢？"
901010400130-25 = "為了這樣的各位，我們「FOX EATS」準備了特別的促銷活動哦！"
901010400130-26 = "現在只要參加我們「FOX EATS」舉辦的問卷調查……"
901010400130-27 = ""
901010400130-29 = ""
901010400130-30 = "就會免費贈送人氣名店「吉野豆皮」的豆皮壽司便當哦！"
901010400130-31 = "來吧。請馬上參加問卷調查，領取免費便當吧！"
901010400130-33 = "……總覺得有點可疑啊。"
901010400130-34 = "沒錯，都說天下沒有白吃的午餐……你是不是有什麼企圖啊？"
901010400130-36 = "當然是有幾個小小的條件啦……"
901010400130-37 = "本問卷調查將用於「FOX EATS」產品及服務之改善。並且可能為特定產品之偏好調查及宣傳目的而提供予第三方。#n問卷結果自填寫時起保存36個月，若對以上內容有異議，#n請蒞臨「FOX EATS」客服──"
901010400130-39 = "夠了……！知道了，知道了啦！"
901010400130-40 = "看你這麼滔滔不絕地唸著一堆華麗辭藻的說明，#n看來又是哪家行銷公司在沒用的地方亂花錢了。"
901010400130-41 = "反正食物是無辜的，我們就不拒絕了。"
901010400130-42 = "而且我們也正好肚子餓了。"
901010400130-43 = "我看看……"
901010400130-44 = ""
901010400130-46 = ""
901010400130-47 = ""
901010400130-48 = ""
901010400130-49 = "哦哦，這還真不錯……"
901010400130-50 = "真是好吃的豆皮壽司啊！#n米飯粒粒分明，豆皮也厚實飽滿……我很喜歡。"
901010400130-51 = "唯一讓我有點在意的是……"
901010400130-53 = "哎呀，有什麼讓您在意的地方嗎？"
901010400130-54 = "您真實的評價，對於改善「FOX EATS」的餐飲服務將會有莫大的幫助。#n所以請不用有所顧慮，儘管告訴我們！"
901010400130-55 = "……這裡面放的配料是蟹肉棒嗎？"
901010400130-56 = "居然在這麼好吃的豆皮上用假蟹肉，實在是有點可惜啊。"
901010400130-57 = ""
901010400130-59 = ""
901010400130-60 = "咦～？但是「真正的蟹肉」不是非常昂貴嗎？"
901010400130-61 = "聽說螃蟹是要花上一整天的薪水才買得起一隻的昂貴食──"
901010400130-62 = "那是什麼時候的事了啊？#n螃蟹價格崩盤都已經持續好幾個月了。"
901010400130-64 = "對啊，價格低到連油錢都賺不回來。#n我們最近甚至在煩惱，是不是該減少出海捕撈的次數了呢。"
901010400130-66 = "是這樣嗎？可是市場和超市賣的螃蟹價格好像還是很貴……"
901010400130-67 = "不相信的話就去那邊的物流倉庫看看吧。#n賣不出去的螃蟹堆得跟山一樣高呢。"
901010400130-68 = "原來如此……我明白了。#n您提供的寶貴意見，我會確實轉達給店裡的。"
901010400130-69 = "啊，對了。還有另外一件事想請教兩位。"
901010400130-70 = "請問兩位有聽說過「鐵桶蟹」嗎？"
901010400130-71 = "鐵桶蟹……？難道有把螃蟹裝在鐵桶裡運送的業者嗎？"
901010400130-73 = "別的地方我不清楚，但我們都是把螃蟹裝在木箱裡出貨的。#n只要去物流倉庫的話就能看到了。"
901010400130-74 = "我明白了，非常感謝兩位協助填寫問卷。"
901010400130-75 = "那麼，祝兩位有個美好的午後時光！"
