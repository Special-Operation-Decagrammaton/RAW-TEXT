[translation]
10052015-3 = "……."
10052015-4 = "………."
10052015-5 = "봐, 봐봐봐봐봐봐, 봤어, 미도리?! 방금 그거? 조금 전 그거?!"
10052015-6 = "봤어……. 엄청났어! 그리고 막 꿈틀거리고, 그리고……!"
10052015-7 = "우리…… 무사히 돌아갈 수 있는 거겠지……?"
10052015-8 = "그건 걱정하지 마. 선생님이 있으니까, 무사할 거야."
10052015-9 = "응. 아마도."
10052015-10 = "어, 어떻게 그렇게 태연할 수 있는 건가요……?"
10052015-11 = "으음, 여러 가지 이유가 있겠지만."
10052015-12 = "역시, 예전에 만나 봤기 때문일까?"
10052015-14 = "[ns] \"그런데, 비나의 코어는?\""
10052015-15 = "네. 그 부분 말입니다만, 뭐라고 해야 할까요……."
10052015-16 = "결론부터 말씀드리자면, 저 대공동 아래로 내려가야 할 것 같습니다. 코어의 반응이 거기에서 검출되고 있어요."
10052015-17 = "끄엑?! 이걸 내려가라고!?"
10052015-18 = "다, 다른 예언자들도…… 이렇게 해야 하는 걸까요. 선생님?"
10052015-19 = "그건 아닐 겁니다. 이 비나만 특수케이스인 모양이에요. 이것도 어떤 의미로는 보안 대책이라고 해야겠군요."
10052015-20 = "으, 응……. 그야말로, 물리적인 보안 대책이네……."
10052015-21 = "그렇다고는 해도, 바닥도 보이지 않는 이 구덩이를, 암벽을 타듯이 내려가라는 건 너무 비효율적이야……."
10052015-22 = "부장. 수송선에 소형 지원기 있지? 그거 좀 보내 줘."
10052015-23 = "그럴 줄 알고, 이미 출발시켜 두었답니다."
10052015-24 = "……리오가 굳이 자기가 가겠다고 고집을 부려서, 직접 몰고 가는 중이지만요."
10052015-25 = "회장이?"
10052015-26 = "네. 추가 조사 결과에 따르면…… 네트워크만으로는 돌파할 수 없는 클러스터와 방화벽이 설치되어 있어요. 그래서……."
10052015-27 = "……자기가 직접 내려가는 게, 가장 합리적인 방법일 거라더군요."
10052015-28 = "……리오답네요."
10052015-31 = "(곧 소형 지원기가 도착했고, 리오 역시 모습을 드러냈다.)"
10052015-32 = "(……리오는 우리들의 '역시나……' 라는 표정에, 고개를 갸웃거릴 뿐이었다.)"
