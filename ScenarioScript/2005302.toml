[translation]
2005302-1 = "닌자 소녀는 치료가 필요해"
2005302-2 = "백귀야행의 제38번 구교사의 어느 교실"
2005302-3 = "(부상이 걱정돼서, 백귀야행으로 미치루를 찾아갔다.)"
2005302-6 = "에엣? 선생 공?!"
2005302-7 = "정말로 온 거야?!"
2005302-8 = "[s]\"어디가 다친 거야, 미치루?!\""
2005302-9 = "아니, 그, 그게 말이지……"
2005302-10 = "부상을 입은 건 맞긴 하지만, 그게……"
2005302-11 = "……내가 입은 부상이 아니라서."
2005302-12 = "[s]\"응?\""
2005302-13 = "그…… 다친 건 내 옷이거든……."
2005302-14 = "정확히는 내 드레스가 찢어진 건데……."
2005302-15 = "이것 봐, 꽤 크게 찢어졌다고?"
2005302-16 = "[s]\"아니 이건 또 어쩌다가…….\""
2005302-17 = "그, 그게 말이지……."
2005302-18 = "인법 ‘참나무 꾸물꾸물의 술’을 훈련하다가 나무에서 떨어지는 바람에……."
2005302-19 = "[s1] \"그러니까 요약하자면…….\"\n[s2] \"나무 타다가 옷이 찢어졌다는 거지?\""
2005302-22 = "우냐앗! 그걸 그렇게 요약하면 어떡해!"
2005302-23 = "그렇게 말하면 내가 무슨 장난치다가 옷 찢어먹은 것 같잖아?!"
2005302-24 = "장난 맞지 않느냐고?"
2005302-25 = "아, 아냐! 이것도 엄연한 인법 수련의 일환! 수련을 장난으로 치부하면 안 되지!"
2005302-26 = "끄으응……."
2005302-27 = "그래, 역시 선생 공은 아직 닌자에 대한 이해가 부족해."
2005302-28 = "그런 의미에서 나와 함께 가야겠어."
2005302-29 = "함께 이 드레스를 치료하면서, 내가 친히 닌자 강의를 해주지!"
2005302-31 = "(그렇게, 미치루와 수선집으로 동행하게 되었다.)"
2005302-33 = "백귀야행 상점가"
2005302-35 = "……그러니까 말이야, 닌자가 시커먼 옷만 입는다는 것은 일종의 편견이라는 거지."
2005302-36 = "얼굴까지 덮는 까만 옷은 어디까지나 야간 작전의 용도."
2005302-37 = "낮에는 그런 옷이 더 눈에 띄기 때문에, 그냥 평상복을 더 많이 입었다고."
2005302-38 = "닌자의 기본은 어디까지나 눈에 띄지 않는 것이니까 말이야."
2005302-39 = "요약하자면, 자신이 처한 상황에 가장 어울리는 옷을 입는 게 닌자 복식의 정석!"
2005302-40 = "예를 들어, 임무를 수행해야 하는 장소가 파티장이라면? 그렇다면 이렇게 드레스를 입는 게 맞지."
2005302-41 = "반대로 야간 작전의 상황이라면, 앞서 말한 그런 까만 옷을 입는 게 맞고."
2005302-42 = "한편 전승에 따르면, 심지어 어떤 닌자는 야간 작전에서 완벽한 위장과 신속성을 얻기 위해 옷 대신 맨몸에 먹물만 바르기도 했다고 하더라고."
2005302-43 = "그리고 이런 것 말고도 최근 작품에는 광학미채 닌자복이라는 새로운 개념도 등장하기도 했는데……."
2005302-53 = "[ns]\"그나저나 미치루, 여기가 수선집 아니야?\""
2005302-54 = "오! 벌써 도착했네!"
2005302-55 = "어서 오세요. 무엇을 도와드릴까요?"
2005302-56 = "아, 찢어진 드레스를 수리하고 싶은데요."
2005302-57 = "예, 그럼 수선할 드레스를 이쪽에 올려주세요."
2005302-58 = "아, 수선할 드레스가, 그러니까……."
2005302-62 = "……내가 입고 있네."
2005302-64 = "수선 맡길 옷을 입고 와 버렸어……!"
2005302-66 = "저기, 수선하려면 옷을 벗어서 주셔야 하는데……"
2005302-67 = "그…… 에에……. 나 여벌 옷은 안 가져왔는데……."
2005302-68 = "혹시 입은 상태로 수선할 방법은……."
2005302-69 = "……직접 재봉틀 위로 올라가시려고요?"
2005302-70 = "우, 우냐아앗……."
2005302-71 = "으아아, 기껏 왔는데 이렇게 다시 돌아가야 한다니……!"
2005302-72 = "……아니, 방법이 없는 것은 아니야."
2005302-73 = "드레스는 벗어서 드리고, 나는 닌자 복장으로 갈아입으면 되니까……!"
2005302-74 = "[s]\"방금 여벌 옷은 없다고 하지 않았어?\""
2005302-75 = "괜찮아 괜찮아!"
2005302-76 = "전승 속의 어느 닌자가 그러했듯, 맨몸에 검은 먹물을 바르면 되니까……!"
2005302-77 = "[s]\"……부끄럽지 않겠어?\""
2005302-78 = "후후, 그거야 닌자라면……."
2005302-79 = "……."
2005302-83 = "다, 당연히 그건 안 되지!"
2005302-84 = "절대 안 돼!"
2005302-85 = "서……."
2005302-86 = "선생 공! 변태!!"
2005302-87 = "[s3] \"제가요?!\"\n[s4] \"억울해……!\""
2005302-91 = "(결국, 미치루는 근처 옷 가게에서 운동복을 사서 갈아입은 뒤 드레스를 맡겼다.)"
2005302-92 = "(……당연히 계산은 어른의 몫이었다.)"
