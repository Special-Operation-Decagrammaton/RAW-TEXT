[translation]
901010800330-6 = ""
901010800330-7 = "อย่างแรกเลย เรื่องคู่มือที่พบตรงทางเข้าโกดัง..."
901010800330-8 = "ถึงข้อมูลส่วนใหญ่จะเป็นแค่แนวทางการรักษาความปลอดภัยทั่วไป แต่ก็มีเนื้อหาแปลกๆ อยู่ข้อหนึ่ง"
901010800330-9 = "นั่นก็คือคำสั่งที่ว่า \"ให้กลิ้งถังเหล็กเดินวนรอบท่าเรือเป็นประจำในช่วงเช้ามืด\""
901010800330-10 = "อันที่จริง ก่อนแฝงตัวเข้าไปในโกดัง เราก็เห็นสมาชิกขององค์กรกำลังกลิ้งถังเหล็กอยู่จริงๆ"
901010800330-11 = "พวกผู้บริหารของการ์ปัชโช่ แฟมิลี่คิดอะไรอยู่ ถึงได้สั่งให้ทำเรื่องประหลาดแบบนั้นนะ?"
901010800330-12 = "ถ้าจะยกตัวอย่างคล้ายๆ กันเท่าที่ฉันรู้..."
901010800330-13 = "ได้ยินมาว่าเมื่อก่อนที่โอดิสซีย์ ถ้านักเรียนไม่พอใจอะไร ก็จะไปกลิ้งลูกกระสุนปืนใหญ่บนดาดฟ้า#nกลางดึกเพื่อประท้วงสภานักเรียน"
901010800330-14 = "นี่ก็น่าจะเป็นการกระทำที่มีจุดประสงค์คล้ายกันหรือเปล่า?"
901010800330-15 = "เพื่อประท้วงหรือข่มขู่งั้นเหรอ? แล้วจะข่มขู่ใครล่ะ?"
901010800330-16 = "ท่าเรือตอนเช้ามืดก็แทบไม่มีคนอยู่แล้ว ต่อให้กลิ้งถังเหล็กเสียงดังแค่ไหน จะมีสักกี่คนที่ได้เห็นกัน?"
901010800330-18 = "แต่ถ้ามีคนเห็นภาพพฤติกรรมประหลาดๆ นั้นแม้เพียงคนเดียว ข่าวลือก็คงแพร่สะพัดอย่างรวดเร็วเลยละ"
901010800330-19 = "งั้นจุดประสงค์ก็คือการสร้างข่าวลืองั้นเหรอ..."
901010800330-20 = "ถ้างั้น เหตุผลที่การ์ปัชโช่ แฟมิลี่กลิ้งถังเหล็กตอนเช้ามืดก็คือ..."
901010800330-21 = ""
901010800330-23 = ""
901010800330-24 = ""
901010800330-27 = ""
901010800330-28 = "#Q;오토기;ถ้างั้น เหตุผลที่การ์ปัชโช่ แฟมิลี่กลิ้งถังเหล็กตอนเช้ามืดก็คือ...\n[as1] \"เพื่อขนของไปยังสถานที่อื่น\"\n[as2] \"เพื่อฝึกความแข็งแรงของสมาชิก\"\n[as3] \"เพื่อปล่อยข่าวลือเกี่ยวกับถังเหล็ก\""
901010800330-29 = "ไม่ใช่สิ คำสั่งไม่ใช่ให้ขนถังเหล็กไปที่ไหน แต่ให้เดินกลิ้งมันไปรอบๆ ท่าเรือต่างหาก"
901010800330-30 = "อีกอย่าง ถ้ามีจุดประสงค์เพื่อขนของจริง จะต้องเลือกเวลาตอนเช้ามืดทำไมล่ะ?"
901010800330-31 = "มันต้องมีเหตุผลที่น่าเชื่อถือกว่านั้นแน่"
901010800330-32 = ""
901010800330-34 = ""
901010800330-36 = ""
901010800330-37 = ""
901010800330-40 = "อืม ถ้ากลิ้งถังเหล็กหนักๆ ก็ถือว่าได้ออกกำลังกายอยู่หรอก..."
901010800330-41 = "แต่ถ้าจะฝึกความแข็งแรง ใช้อุปกรณ์ออกกำลังกายจริงๆ น่าจะได้ผลกว่านะ"
901010800330-42 = "เอาถังเหล็กขึ้นสนิมมาออกกำลังกาย เดี๋ยวก็ได้บาดเจ็บกันพอดี"
901010800330-43 = ""
901010800330-45 = ""
901010800330-46 = ""
901010800330-49 = "ใช่ จะพูดให้ถูกก็คือ เพื่อเผยแพร่ข่าวลือเกี่ยวกับ 'ถังเหล็กใส่ปู' ต่างหาก"
901010800330-50 = "ถึงจะเป็นช่วงเช้ามืดที่ไม่ค่อยมีคนเท่าไร แต่ถ้ากลิ้งถังเหล็กเสียงดัง สุดท้ายก็ต้องมีคนเห็นเข้าสักคน"
901010800330-51 = "ในเมื่อช่วงนี้กำลังมีข่าวลือเรื่องถังเหล็กใส่ปูแพร่ไปทั่วท่าเรือคาเนะซากิ ถ้ามีคนเห็นสมาชิกของ#nการ์ปัชโช่ แฟมิลี่ขนถังเหล็กตอนดึก คนก็ต้องคิดไปในทางเดียวกันอยู่แล้วไม่ใช่เหรอ?"
901010800330-52 = "\"การ์ปัชโช่ แฟมิลี่กำลังขนปูปีศาจอยู่\""
901010800330-53 = "แต่มีภาพลักษณ์ว่าขายปูปีศาจแบบนั้น มันจะส่งผลดีต่อธุรกิจได้จริงๆ เหรอ?"
901010800330-54 = "ถ้าเป็นฉัน คงไม่อยากแม้แต่จะคุยกับคนพวกนั้นเลยละ..."
901010800330-55 = "ถ้าเป็นคนธรรมดาก็คงใช่"
901010800330-56 = "แต่สำหรับพวกนักเลงที่คอยข่มขู่ผู้คนและก่อเรื่องอยู่เป็นประจำ ข่าวลือแบบนั้นอาจกลับกลายเป็น#nภาพลักษณ์ในเชิงบวกก็ได้นะ?"
901010800330-57 = "อ้อ เหมือนเครื่องหมายคิลมาร์กที่บอกจำนวนคนที่สังหารได้บนรถถังน่ะเหรอ?"
901010800330-58 = "ถึงในคดีนี้จะไม่มีผู้เสียชีวิตจริงๆ ก็เถอะ"
