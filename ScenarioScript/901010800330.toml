[translation]
901010800330-7 = "먼저, 창고 입구에서 발견한 가이드 매뉴얼에는……"
901010800330-8 = "대부분은 평범한 경비 지침만 적혀있었지만, 이상한 내용이 하나 있었어."
901010800330-9 = "바로 \"주기적으로 새벽에 드럼통을 굴리며 항만을 배회하라\"는 지침이었지."
901010800330-10 = "실제로 창고에 잠입하기 직전에 드럼통을 굴리는 조직원을 확인했어."
901010800330-11 = "카르파초 패밀리의 간부들은 도대체 무슨 생각으로 그런 기행을 지시한 걸까?"
901010800330-12 = "내가 아는 한 가장 비슷한 사례라면……"
901010800330-13 = "예전 오디세이아에서는 학생들이 불만이 생기면 학생회에 항의하는 의미로 한밤중에 갑판 위에서 포탄을 굴렸다고 하더라."
901010800330-14 = "이것도 비슷한 목적에서 한 행동이 아닐까?"
901010800330-15 = "항의나 위협 용도로? 누구를 위협한다는 건데?"
901010800330-16 = "애초에 사람도 거의 없는 새벽 항만에서 시끄럽게 드럼통을 굴려 봤자, 몇이나 그 광경을 보겠어?"
901010800330-18 = "하지만 단 한 사람이라도 그 기괴한 모습을 본다면, 금방 입소문을 타겠지."
901010800330-19 = "목적은 입소문이라는 건가……"
901010800330-20 = "그럼 아마도 카르파초 패밀리가 새벽에 드럼통을 굴린 이유는—"
901010800330-28 = "그럼 아마도 카르파초 패밀리가 새벽에 드럼통을 굴린 이유는—\n[as1] \"다른 장소로 물건을 운반하기 위해서.\"\n[as2] \"조직원들의 체력 단련을 위해서.\"\n[as3] \"드럼통과 관련된 소문을 퍼뜨리기 위해서.\""
901010800330-29 = "아니. 지시는 드럼통을 어딘가로 운반하라는 게 아니라, 굴리며 배회하라는 명령이었다니까?"
901010800330-30 = "그리고 물건을 운반할 목적이었다면, 굳이 새벽을 택할 이유가 있었겠어?"
901010800330-31 = "분명 좀 더 그럴싸한 이유가 존재할 거야."
901010800330-40 = "음, 확실히 무거운 드럼통을 굴리면 운동은 되겠지만……"
901010800330-41 = "체력을 단련할 거라면 제대로 된 운동 장비를 쓰는 게 낫겠지."
901010800330-42 = "이런 녹슨 드럼통으로 운동하다간 자칫 다칠 수도 있어."
901010800330-49 = "맞아. 정확히 말하자면 '게 드럼통'과 관련된 소문이겠지."
901010800330-50 = "인적이 드문 새벽이라도 시끄럽게 드럼통을 굴리면, 결국 누군가의 눈에는 띄게 될 거야."
901010800330-51 = "최근 카네사키 항구를 중심으로 게 드럼통 소문이 퍼지고 있는 상황에서, 카르파초 패밀리 조직원이 밤늦게 드럼통을 운반하는 모습이 눈에 띈다면 사람들이 무슨 생각을 할지는 뻔하잖아?"
901010800330-52 = "\"카르파초 패밀리가 괴물 게를 운반하고 있다.\""
901010800330-53 = "그런데 괴물 게를 취급한다는 이미지가 사업에 도움이 될까?"
901010800330-54 = "나라면 그런 녀석들과는 말도 섞고 싶지 않을 텐데……"
901010800330-55 = "평범한 사람이라면 그렇겠지."
901010800330-56 = "하지만 사람을 협박하고 불량한 일을 수시로 저지르는 주먹패들에게는, 오히려 그런 괴담이 더 긍정적인 이미지로 작용하지 않았을까?"
901010800330-57 = "아, 전차에 그려 넣는 킬 마크 같은 건가?"
901010800330-58 = "이번 사건에서 실제로 희생된 사람은 없지만 말이야."
