[translation]
901010800330-6 = ""
901010800330-7 = "Now, starting with the guide manual found at the warehouse's entrance..."
901010800330-8 = "It mostly contained ordinary patrol guidelines, but there was a strange rule handwritten in the back."
901010800330-9 = "It was a requirement to \"roll a drum barrel once around the port.\""
901010800330-10 = "This was confirmed. We witnessed a member of the \"family\" rolling a drum barrel before I infiltrated the warehouse."
901010800330-11 = "Why were the leaders of the Carpaccio Family asking their employees to do this?"
901010800330-12 = "This reminds me of a case..."
901010800330-13 = "I've heard that Odyssey students once rolled artillery shells across the ship's deck in the middle of the night. It was to protest their student council."
901010800330-14 = "Maybe this could be a similar statement?"
901010800330-15 = "If so, it's confusing. Who is it threatening? What does it mean?"
901010800330-16 = "It's not much of a statement if no one sees you do it. And midnight at the port is pretty vacant."
901010800330-18 = "True. But if even a single person witnesses something so bizarre, word would spread quickly."
901010800330-19 = "So they wanted to spread rumors..."
901010800330-20 = "That means the Carpaccio Family was rolling drum barrels in the middle of the night to..."
901010800330-21 = ""
901010800330-23 = ""
901010800330-24 = ""
901010800330-27 = ""
901010800330-28 = "#Q;오토기;That means the Carpaccio Family was rolling drum barrels in the middle of the night to...\n[as1] \"Move things to different locations.\"\n[as2] \"Make their members physically train.\"\n[as3] \"Spread rumors about drum barrels.\""
901010800330-29 = "No. The order was explicitly to roll the drum barrel around, not to move it somewhere specifically."
901010800330-30 = "And if their goal was only to move stuff, why would they only do it during the dead of night?"
901010800330-31 = "I'm sure there's a better reason."
901010800330-32 = ""
901010800330-34 = ""
901010800330-36 = ""
901010800330-37 = ""
901010800330-40 = "Hm, I'm sure rolling a heavy drum barrel is a decent workout..."
901010800330-41 = "But gym equipment would be much more efficient for building muscle."
901010800330-42 = "You could even get injured from exercising with a rusty drum barrel. Or worse, contract tetanus."
901010800330-43 = ""
901010800330-45 = ""
901010800330-46 = ""
901010800330-49 = "Right. A rumor about \"drum barrel crabs,\" to be precise."
901010800330-50 = "Even if it's late at night, someone's bound to notice you if you're continuously making a racket by rolling a drum barrel."
901010800330-51 = "With the rumors of drum barrel crabs floating around the port, it's obvious what people would assume if they saw a Carpaccio Family member rolling a barrel around in the dark."
901010800330-52 = "\"The Carpaccio Family is moving monster crabs.\""
901010800330-53 = "Why would they want people to think that? It doesn't sound good for business."
901010800330-54 = "I wouldn't want to associate with someone who does stuff like that."
901010800330-55 = "Most people wouldn't."
901010800330-56 = "But an urban legend like that would make them seem more dangerous. They're already thugs. They thrive on having a frightening reputation."
901010800330-57 = "Ah, so like people carving their kill count on the side of their tank?"
901010800330-58 = "Right. Though, thankfully, this is considerably less lethal."
