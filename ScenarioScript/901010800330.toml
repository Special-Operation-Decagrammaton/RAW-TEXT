[translation]
901010800330-6 = ""
901010800330-7 = "關於在倉庫入口發現的指南手冊……"
901010800330-8 = "雖然大部分都只寫著普通的警備指示，但有一項奇怪的內容。"
901010800330-9 = "那就是「定期於午夜推著鐵桶在港口徘徊」的指示。"
901010800330-10 = "實際上在潛入倉庫之前，我們就已經確認到了推著鐵桶的組織成員。"
901010800330-11 = "卡爾帕喬家族的幹部們，究竟是出於什麼目的才會下達那種怪異的指示呢？"
901010800330-12 = "據我所知，最接近的案例是……"
901010800330-13 = "以前奧德賽的學生如果對學生會感到不滿，就會在深夜於甲板上滾動砲彈表達抗議。"
901010800330-14 = "這會不會也是出於類似的目的呢？"
901010800330-15 = "表達抗議……？是要抗議誰啊？"
901010800330-16 = "而且在幾乎沒有人的深夜港口滾著鐵桶製造噪音，又有多少人能看到呢？"
901010800330-18 = "但是就算只有一個人看到那副詭異的景象，消息很快就會傳開了吧。"
901010800330-19 = "目的是製造傳聞嗎……？"
901010800330-20 = "那麼卡爾帕喬家族在深夜滾動鐵桶的目的，恐怕是……"
901010800330-21 = ""
901010800330-23 = ""
901010800330-24 = ""
901010800330-27 = ""
901010800330-28 = "#Q;오토기;那麼卡爾帕喬家族在深夜滾動鐵桶的目的，恐怕是……\n[as1] 為了把貨物搬運到其他地方。\n[as2] 為了鍛鍊組織成員的體能。\n[as3] 為了散播與鐵桶有關的傳聞。"
901010800330-29 = "不對。那項指示不是叫他們把鐵桶搬運到某處，而是命令他們滾著鐵桶徘徊吧？"
901010800330-30 = "而且目的如果是搬運貨物，有必要刻意選在深夜執行嗎？"
901010800330-31 = "肯定還有更合理的原因才對。"
901010800330-32 = ""
901010800330-34 = ""
901010800330-36 = ""
901010800330-37 = ""
901010800330-40 = "唔嗯……滾動沉重的鐵桶確實可以當作鍛鍊沒錯……"
901010800330-41 = "但是要鍛鍊體力的話，使用像樣的運動器材會更好吧。"
901010800330-42 = "用那種生鏽的鐵桶運動，一不小心可是會受傷的。"
901010800330-43 = ""
901010800330-45 = ""
901010800330-46 = ""
901010800330-49 = "沒錯，準確來說是和「鐵桶蟹」有關的傳聞。"
901010800330-50 = "就算是人煙稀少的凌晨，只要滾動鐵桶製造巨大聲響，遲早會引起他人的注意。"
901010800330-51 = "最近以鐘崎港為中心，正在散播著鐵桶蟹的傳聞。#n在這種情況下，如果卡爾帕喬家族的成員在深夜搬運鐵桶的模樣被人看見……#n大家會怎麼想，應該很明顯吧？"
901010800330-52 = "「卡爾帕喬家族正在搬運怪物螃蟹。」"
901010800330-53 = "不過經手怪物螃蟹的形象，真的會對生意有幫助嗎？"
901010800330-54 = "換作是我，才不想和那種傢伙扯上關係……"
901010800330-55 = "如果是普通人，確實是那樣沒錯。"
901010800330-56 = "不過對於那些威脅他人，經常惹事生非的不良集團來說……#n那種傳聞反而具有正面效果吧？"
901010800330-57 = "啊，就像畫在戰車上的擊殺記號那樣嗎？"
901010800330-58 = "雖然在這次的事件當中，實際上並沒有任何受害者就是了。"
