[translation]
83301300300-6 = "마코토. 할 이야기가 있어."
83301300300-11 = "키키킥! 이 몸은 너와 할 이야기 따윈 없다!"
83301300300-12 = "네게도 피해를 준 온천개발부를 쫓는 일인데도 말이야?"
83301300300-13 = "흥! 제아무리 그런 일일지라도! 내 손으로 선도부를 돕다니!"
83301300300-14 = "그야말로 언어도단! 있을 수 없는 일이다!"
83301300300-15 = "……그래, 그럴 줄 알고는 있었지만."
83301300300-20 = "(마코토가 아니라면, 정보를 알고 있을 만한 사람은……)"
