[translation]
84312101302-5 = "아, 이야기는 들었어. 어떻게 감사해야 할지 모르겠네."
84312101302-10 = "덕분에 아방가르드 군도, 메카 악어도 모두 큰 문제로 번지지 않았으니까요!"
84312101302-11 = "괜찮다고만 하신다면, 뭐든 필요한 것 하나를 만들어 주고 싶을 정도야."
84312101302-13 = "보상을 바라고 한 일은 아니니까요. 일이 잘 진행됐다면, 그 자체로도 충분히 기쁘네요."
84312101302-14 = "아냐. 하지만 우리로서는 그냥 넘어갈 수 없는 문제야. 역시 뭐라도 답례를 하고 싶은데……"
84312101302-15 = "뭐가 좋을까? 토스트기? 전자동 필통? 공중비행 리모콘?"
84312101302-16 = "으음. 뭐든 새로 만들려면 시간이 좀 걸리겠네. 당장은 천둥이 같은 의자밖에 없지만…… 천둥이 신형이라도 하나 만들어서 보내줄까……"
84312101302-17 = "……의자요?"
84312101302-18 = "응? 왜? 의자가 필요해?"
84312101302-19 = "아, 아뇨. 그런 건 아니에요. 그저, 좀……"
84312101302-20 = "의자……라고 하면 좀 떠오르는 친구가 있어서, 순간 생각해 본 것뿐이에요."
