[translation]
901010400220-6 = "Um..."
901010400220-7 = "Ah, aren't you the delivery student from earlier?"
901010400220-8 = "Did you find that missing sack of sawdust?"
901010400220-9 = "Yes, it was in a vacant alley with some other supplies."
901010400220-10 = "If I were to guess... Maybe someone thought it was a trash bag? There were a few in the area, right over there."
901010400220-11 = ""
901010400220-13 = ""
901010400220-14 = "Really? That's a relief... Thank you so much!"
901010400220-15 = "We were worried that we'd have to throw out all these crabs... You're a lifesaver!"
901010400220-16 = "Not at all. I'm just glad to help!"
901010400220-17 = "By the way, why are crabs packed in sawdust? It sounds rather...dry. "
901010400220-18 = "It's for transportation. Crabs are weak to shock."
901010400220-19 = "Even with these hard shells, the slightest shake or bump can kill a crab."
901010400220-20 = "So that's why we spread a thick layer of sawdust around them. It cushions their shells and absorbs shock."
901010400220-21 = "And you had a point! We wet it, too. Since sawdust also retains moisture, it's even better for transporting crabs. Keeps them...relatively comfortable, and all that."
901010400220-23 = "I see...! How fascinating."
901010400220-24 = "Oh right. By the way, have you ever heard of transporting crabs in a drum barrel?"
901010400220-25 = "Crabs in a drum barrel...? I've never heard of it before."
901010400220-26 = "Oh, really? I wonder why. It seems so much more stable than a crate..."
901010400220-27 = "That might be... But drum barrels are way too heavy."
901010400220-28 = "The higher the weight, the higher the shipping costs. So, there's no reason to use a drum barrel instead of a cheap wooden crate, don't you think?"
901010400220-29 = "On top of that, if you pack a drum barrel with crabs, the air wouldn't circulate. The ones at the bottom would suffocate. Ugh...brutal."
901010400220-30 = "I see... After hearing that, it sounds like the story of \"crabs in a drum barrel\" is something only a \"person ignorant of the biology of crabs\" would believe."
901010400220-31 = "Are you seriously telling me people are out there gossiping about crab logistics? I guess they must be bored."
901010400220-32 = "Fufu, everyone has different interests, after all."
901010400220-33 = "Oh, right. I almost forgot."
901010400220-34 = ""
901010400220-36 = ""
901010400220-37 = "As a token of appreciation for your fascinat—well, your INSIGHTFUL story, I'd like to offer you this inarizushi bento from \"Yoshino Inarizushi.\" It's a huge hit on FOX EATS!"
901010400220-38 = "I-I couldn't possibly! How can I take food from you when you were the one hauling sawdust?"
901010400220-39 = "All part of the job, ma'am! Think of it as a special promotion."
901010400220-40 = "If anything... If you could leave a positive review on social media and tag us, it'd mean the world!"
901010400220-41 = "Of course I will. Thank you so much! It looks great!"
901010400220-42 = "Have a nice day!"
