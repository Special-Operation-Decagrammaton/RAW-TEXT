[translation]
901010400220-6 = "คือว่า..."
901010400220-7 = "อ๊ะ พนักงานส่งอาหารเมื่อกี้นี่นา?"
901010400220-8 = "เจอกระสอบขี้เลื่อยที่หายไปแล้วเหรอ?"
901010400220-9 = "ค่ะ มันถูกทิ้งไว้ที่ลานโล่งตรงนั้น ที่เอาไว้กองวัสดุที่ไม่ใช้แล้วค่ะ"
901010400220-10 = "ดูเหมือนว่าจะมีคนเข้าใจผิดคิดว่าเป็นถุงขยะ ก็เลยเอาไปกองรวมไว้ค่ะ"
901010400220-11 = ""
901010400220-13 = ""
901010400220-14 = "จริงเหรอ? โล่งอกไปที... ขอบใจมากเลยนะ!"
901010400220-15 = "ฉันกำลังกลุ้มเลยว่าคงต้องทิ้งปูตั้งเยอะแยะพวกนี้เสียแล้ว... ขอบใจที่มาช่วยไว้นะ!"
901010400220-16 = "ไม่เป็นไรค่ะ ฉันก็ดีใจที่ได้ช่วยเหมือนกันค่ะ"
901010400220-17 = "ว่าแต่ทำไมต้องขนส่งปูโดยใส่ไว้ในขี้เลื่อยด้วยล่ะคะ? "
901010400220-18 = "ก็เพราะปูบอบบางต่อแรงกระแทกน่ะสิ"
901010400220-19 = "ถึงปูจะมีกระดองแข็ง แต่แค่ถูกเขย่าหรือได้รับแรงกระแทกนิดหน่อย ก็จะตายได้ง่ายๆ เลยละ"
901010400220-20 = "เวลาขนส่งปู เราก็เลยต้องปูขี้เลื่อยที่หาได้ง่ายจากลานขนถ่ายสินค้าลงไปหนาๆ เพื่อช่วยลดแรงกระแทกน่ะ"
901010400220-21 = "แถมขี้เลื่อยยังอุ้มน้ำได้ดี เลยเหมาะสำหรับใช้ขนส่งปูที่เป็นสัตว์น้ำด้วย"
901010400220-23 = "อย่างนี้นี่เองสินะคะ...! เป็นเรื่องที่น่าสนใจมากเลยค่ะ"
901010400220-24 = "อ้อ จริงสิ ว่าแต่เคยได้ยินว่ามีคนขนส่งปูในถังเหล็กบ้างหรือเปล่าคะ?"
901010400220-25 = "ปูในถังเหล็กงั้นเหรอ...? ไม่เคยได้ยินมาก่อนเลย"
901010400220-26 = "แล้วมีเหตุผลอะไรมั้ยคะ ที่ไม่ควรขนปูด้วยถังเหล็ก?"
901010400220-27 = "ไม่นะ ก็ไม่ถึงกับทำไม่ได้หรอก... แต่ถังเหล็กมันหนักเกินความจำเป็นสำหรับการขนปูน่ะสิ"
901010400220-28 = "ยิ่งน้ำหนักเพิ่ม ค่าขนส่งก็ยิ่งพุ่งขึ้นเป็นเท่าตัว แล้วจะมีเหตุผลอะไรให้ใช้ถังเหล็ก ทั้งที่มีลังไม้ที่ราคาถูกกว่าล่ะ?"
901010400220-29 = "แถมถ้าอัดปูลงในถังเหล็กจนแน่น อากาศก็จะถ่ายเทไม่สะดวก ปูที่อยู่ก้นถังก็คงตายหมดแน่..."
901010400220-30 = "จริงด้วย... พอได้ฟังแบบนี้แล้ว เรื่อง <ปูในถังเหล็ก> ก็คงเป็นเรื่องที่มีแต่คนไม่รู้เรื่องปูเท่านั้นที่จะ#nหลงเชื่อนะคะ"
901010400220-31 = "เดี๋ยวนี้เรื่องแค่นั้นก็เป็นประเด็นให้คนพูดถึงกันด้วยเหรอ? จริงๆ เลย... สงสัยทุกคนจะว่างกันมากสินะ"
901010400220-32 = "ฮุฮุ ก็แต่ละคนมีสิ่งที่สนใจแตกต่างกันนี่คะ"
901010400220-33 = "อ๊ะ จริงสิ เกือบลืมไปเลยค่ะ"
901010400220-34 = ""
901010400220-36 = ""
901010400220-37 = "เพื่อเป็นการตอบแทนที่เล่าเรื่องน่าสนใจให้ฟัง... นี่จะเรียกว่าเป็นของตอบแทนได้มั้ยนะ แต่ฉันขอมอบ#nข้าวกล่องเต้าหู้ทอดจากร้าน <เต้าหู้ทอดโยชิโนะ> ที่กำลังได้รับความนิยมใน <FOX EATS> ให้นะคะ!"
901010400220-38 = "อ๊ะ ไม่ต้องหรอก! ยังไม่ได้ตอบแทนที่ช่วยหากระสอบขี้เลื่อยให้เลย จะให้รับข้าวกล่องไปอีกได้ยังไง..."
901010400220-39 = "ไม่เป็นไรค่ะ ยังไงนี่ก็เป็นของแจกในช่วงโปรโมชันอยู่แล้วค่ะ"
901010400220-40 = "ถ้าอยากตอบแทนจริงๆ... ไว้ช่วยเขียนรีวิวในโซเชียลให้พวกเราสักหน่อยก็พอค่ะ!"
901010400220-41 = "ได้อยู่แล้ว ขอบใจมากนะ ฉันจะกินให้อร่อยเลย!"
901010400220-42 = "ค่ะ ขอให้เป็นวันที่ดีนะคะ!"
