[translation]
901010400220-6 = "那個……"
901010400220-7 = "啊，這不是剛才那位外送員同學嗎？"
901010400220-8 = "難道你找到那些不見的木屑袋了？"
901010400220-9 = "是的，被丟棄在集中堆放廢料的空地上了。"
901010400220-10 = "看樣子是有人誤認為垃圾袋，就把它們集中在一起了。"
901010400220-11 = ""
901010400220-13 = ""
901010400220-14 = "真的嗎？太好了……真是太感謝你了！"
901010400220-15 = "我正擔心這麼多的螃蟹是不是全都得報廢呢……多虧了你，得救了！"
901010400220-16 = "別客氣，我也很高興能夠幫上忙。"
901010400220-17 = "不過，為什麼要把螃蟹放進木屑裡運送呢？"
901010400220-18 = "那是因為螃蟹很怕受到衝擊。"
901010400220-19 = "雖然螃蟹有著堅硬的外殼，但只要稍微搖晃或受到衝擊就很容易死掉。"
901010400220-20 = "所以在運送螃蟹的時候，會像這樣鋪上大量在裝卸區容易取得的木屑來減緩衝擊。"
901010400220-21 = "而且木屑還有吸收水分的特性，用來運送螃蟹這種水中生物就更加合適了。"
901010400220-23 = "原來如此……！真是有趣的知識呢。"
901010400220-24 = "話說回來，請問您有聽說過把螃蟹裝進鐵桶裡運送的傳聞嗎？"
901010400220-25 = "裝在鐵桶裡的螃蟹……？我還是第一次聽說呢。"
901010400220-26 = "有什麼不可以把螃蟹裝進鐵桶裡的原因嗎？"
901010400220-27 = "不，倒也不是不行啦……只是鐵桶和螃蟹相比實在是太重了。"
901010400220-28 = "重量增加運費就會翻倍，實在沒有理由放著便宜的木箱不用，特地用鐵桶吧？"
901010400220-29 = "而且把螃蟹硬是塞滿鐵桶的話空氣會不流通，底部的螃蟹恐怕會死光吧……"
901010400220-30 = "確實……聽您這麼一說……#n「鐵桶蟹」是只有「不瞭解螃蟹特性的人」才會相信的傳聞呢。"
901010400220-31 = "最近連那種無聊的傳聞也能成為話題了嗎？#n真是的……看來大家都閒得沒事做啊。"
901010400220-32 = "呵呵，畢竟每個人感興趣的事情各不相同嘛。"
901010400220-33 = "哎呀，這麼說來我差點忘記了。"
901010400220-34 = ""
901010400220-36 = ""
901010400220-37 = "雖然這麼說或許有點奇怪，不過作為您分享有趣故事的謝禮……#n這是我們「FOX EATS」大受歡迎的「吉野豆皮」的豆皮壽司便當，請您收下！"
901010400220-38 = "啊，不用啦！我都還沒報答你幫我找到木屑袋，怎麼可以再收下便當呢……"
901010400220-39 = "請不用放在心上，我們本來就在做促銷活動呀。"
901010400220-40 = "如果您真的覺得過意不去……之後只要在SNS上幫我們寫個好評就可以了！"
901010400220-41 = "那當然沒問題。真的很謝謝你，我會好好享用的！"
901010400220-42 = "好的，祝您有個美好的一天！"
