[translation]
1301303-1 = "무언가를 모으는 이유"
1301303-2 = "블랙마켓"
1301303-3 = "(어쩌다 보니, 블랙마켓에서 순찰 업무를 보조하게 되었다……)"
1301303-7 = "협력 감사드립니다. 선생님."
1301303-8 = "덕분에 오늘도 무사히 순찰을 마칠 수 있었습니다."
1301303-9 = "[s] \"으, 응. 별로 한 것도 없지만 말이야.\""
1301303-10 = "무슨 말씀이신가요. 선생님이 계시는 것만으로도 저희에겐 큰 도움이 된답니다."
1301303-11 = "무엇보다, 선생님이 나타난다는 소문이 도는 날이면, 문제아들이 자취를 감추고 아무 사건도 일으키지 않으려 하니 말이죠!"
1301303-12 = "물론…… 그런데도 문제를 발생시키는 겁 없는 문제아들도 있기 마련입니다만."
1301303-13 = "이렇게 말이죠. 자, 이리 나오세요!"
1301303-20 = "후에에에에에에엥……"
1301303-21 = "[ns] \"모미지?!\""
1301303-23 = "어라, 선생님. 아는 학생이신가요?"
1301303-24 = "그, 그렇군요. 알겠습니다. 그렇다면 여기…… 아키이즈미 모미지 학생의 신변은 선생님께 양도하도록 하겠습니다."
1301303-25 = "뭐, 후속 과정이 줄어드는 셈이니 저로서도 좋은 일이긴 하죠."
1301303-29 = "그러면 선생님! 사후 계도 및 인도 잘 부탁드리겠습니다!"
1301303-33 = "가, 감사해요. 선생님!"
1301303-34 = "이대로 붉은겨울에 인도되었다면…… 블랙마켓에 허가 없이 드나들었다는 혐의로……"
1301303-35 = "최소 2주일은 햇볕도 들지 않는 화장실 청소 숙청형에 처해졌을 거예요……"
1301303-36 = "[s1] \"그렇지만 모미지가 불법 거래를 하고 있었다니……\"\n[s2] \"선생님은 조금 실망했단다……\""
1301303-39 = "아, 아니에요! 그, 블랙마켓에 온 건…… 맞지만……"
1301303-40 = "절대 나쁜 짓이나 불법 거래 같은 걸 하러 온 건 아니에요! 믿어 주세요……!"
1301303-41 = "그럼 왜 여기까지 왔냐고요? 그건……"
1301303-45 = "루리엘 님의, 구작 판본 중 하나가, 여기에서만 거래된다고 해서……"
1301303-46 = "네…… 맞아요. 제가 콜렉팅하는 중이라고 말씀드렸던……"
1301303-47 = "[s] \"으음…… 그러면 찾던 판본은 구했어?\""
1301303-48 = "네! 여기, 이렇게 거의 원본대로의 상태인 것으로 구했어요!"
1301303-49 = "에헤헤. 여러모로 위험하고 무서운 일인 데다 예산도 많이 들어가는 일이었지만……"
1301303-50 = "그래도, 이렇게 구할 수 있어서 다행이에요……"
1301303-51 = "네? 그렇게 귀한 판본이냐고요?"
1301303-52 = "음…… 관점에 따라서는 그럴 수도 있지만, 보통은 거의 찾지도 않을 판본이긴 해요."
1301303-53 = "루리엘 님이 아직 유명하지 않았을 때 출간했던 두 번째 작품이거든요. 그래서 판본의 수 자체가 적죠."
1301303-54 = "진짜 팬이 아니면…… 찾지도 않을 책이죠."
1301303-55 = "[s3] \"왠지 알 것 같네.\"\n[s4] \"수요는 적지만, 오히려 고가로 거래되는 그런 종류구나.\""
1301303-58 = "맞아요! 잘 아시네요. 선생님."
1301303-59 = "네? 선생님도 하나에 10만 엔이나 하는 변신 로봇을 산 적도 있다고요?!"
1301303-60 = "후아아아…… 단위가 다르시네요…… 이것이 어른의 힘? 어른의 무서움……?"
1301303-61 = "[s5] \"자아…… 교육에 좋지 않은 이야기는 일단 넘어가고.\"\n[s6] \"모미지는 그 루리엘 님의 모든 굿즈를 모으는 거야?\""
1301303-64 = "그건 아니예요. 그냥…… 판본만 모으는 거죠. 일종의 제한적인 콜렉팅이라고나 할까요."
1301303-65 = "이유요? 음…… 그건……"
1301303-69 = "우선, 저는 지식해방전선의 부원이에요. 지식을 모으기 위해…… 다른 무엇보다 서적류를 우선적으로 모으죠."
1301303-70 = "그리고 오래된 판본일수록 낡고 해져서, 가치 없어 보이는 물건으로 분류되어 버려지는 경우가 많은데."
1301303-71 = "저는 어쩐지…… 그런 것들일수록 더욱…… 애착이 가거든요."
1301303-72 = "그, 왜, 책이란 건 원래 읽히기 위해 만들어지는 거잖아요?"
1301303-73 = "[s] \"이 선생님, 오랜만에 좋은 이야기를 들었어……\""
1301303-74 = "그, 그렇다고 울먹이시면 제가 곤란해지는데요?!"
1301303-75 = "그리고 예산 문제도 어느 정도 있어요."
1301303-76 = "물론 제 관심을 끄는 파생 굿즈도 있기는 하지만……"
1301303-77 = "붉은겨울 학생들은, 생활면에서, 그, 여러모로 그다지 풍족하지 못한 경우가 많거든요."
1301303-78 = "선택과 집중을 잘 하지 않으면…… 이래저래 고달파지죠……"
1301303-79 = "그러다 보니 어느새, 저에게 가장 만족감이 높은 판본 위주로 콜렉팅을 하게 된 것 같아요."
1301303-80 = "그리고 말이에요. 사실 여건이 허락될 때마다 사무국에 추가 장서와 판본을 신청하곤 하는데……"
1301303-81 = "그 요청 대부분이 기각되곤 해서 슬프기도…… 화가 나기도 해요!"
1301303-82 = "아무리 붉은겨울 학원의 도서관이, 조금 동떨어진 자리에 위치해 있지만!"
1301303-83 = "그래서 찾는 학생도, 규모에 비해 적은 편이기는 하지만!"
1301303-84 = "가끔씩이라도 도서관을 찾아 주는 학생들을 위해 장서를 늘리고 싶은데!"
1301303-85 = "하아…… 인생이란 좀처럼 생각대로 되지 않더라구요……"
1301303-86 = "[s] \"으흠? 지금 장서와 판본을 같이 신청한다고 했지?\""
1301303-87 = "그, 그런데요?!"
1301303-88 = "[s7] \"거기에는 모미지 양의 사리사욕도 약간 들어가 있는 것이 아닌가요~\"\n[s8] \"장서를 신청하면서 콜렉팅도 동시에 완성하려는 사리사욕이!\""
1301303-96 = "잘못했어요…… 후에에에엥……"
1301303-97 = "사무국과 도서관을 제 개인의 사리사욕으로 이용하려 하다니……"
1301303-98 = "역시 사서로서도, 지식해방전선의 부원으로서도 실격이겠죠……?"
1301303-99 = "분명 이 사실을 들키게 되면, 아무도 저를 용서하지 않을 거예요……"
1301303-100 = "[s] \"괜찮아. 괜찮아.\""
1301303-101 = "정말요……?"
1301303-107 = "그러면 선생님은…… 이걸로, 저와 공범이신 거네요? 에헤헤……"
1301303-109 = "(왠지 부끄러워하면서도 행복해하는 모미지의 손을 잡고, 붉은겨울로 돌아왔다.)"
