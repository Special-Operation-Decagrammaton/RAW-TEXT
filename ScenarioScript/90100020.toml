[translation]
90100020-1 = "ตอนที่ 2;ช่วงเวลาของยอดคนกับจิ้งจอก"
90100020-5 = ""
90100020-6 = "ร้อน~ จัง~"
90100020-7 = "ทำไมอากาศถึงร้อนขนาดนี้แล้วนะ? ยังเหลืออีกตั้งหลายเดือนกว่าจะถึงฤดูร้อนแท้ๆ"
90100020-8 = "อีกอย่าง สนามกีฬาของสำนักควบคุมก็แย่สุดๆ ไปเลย นอกจากจะมีไอร้อนแผ่ขึ้นมาเต็มๆ แล้ว ยังไม่มีร่มเงาให้ไปหลบแดดเลยด้วย..."
90100020-9 = "หรือว่าสำนักควบคุมจะเสียดายเงินจนไม่ยอมติดหลังคากันแดดให้พวกนักโทษนะ?"
90100020-10 = ""
90100020-12 = ""
90100020-13 = ""
90100020-14 = "เหตุผลน่าจะเพราะไม่อยากให้นักโทษพ้นสายตาของผู้คุมมากกว่านะ"
90100020-15 = "ถ้ามีสิ่งก่อสร้างที่ทำให้เกิดเงา ก็จะเกิดจุดบอดที่ผู้คุมมองไม่เห็น และถ้ามีใครวางแผนหลบหนีออกมา#nจากที่นั่นละก็ คงเป็นเรื่องใหญ่เลยใช่มั้ยล่ะ"
90100020-16 = "ได้ยินมาว่าก่อนที่วาคาโมะจะแหกคุกออกไป มีผู้สมรู้ร่วมคิดแอบเอาอุปกรณ์สำหรับใช้ในการหลบหนี#nมาส่งให้เธอที่หลังร่มเงาของต้นไม้ด้วย"
90100020-17 = "อึก... ฉันไม่ถูกชะตายัยนั่นตั้งแต่แรกเห็นเลย"
90100020-18 = "ตอนจับตัวได้น่าจะสั่งสอนให้เข็ดหลาบไปเลย จะได้ไม่คิดแหกคุกอีกเป็นครั้งที่สอง!"
90100020-19 = ""
90100020-22 = ""
90100020-23 = "ใจเย็นๆ ก่อน คุรุมิ ตามหลักแล้ว จะใช้กำลังเกินกว่าเหตุกับผู้ต้องสงสัยไม่ได้นะ"
90100020-24 = "ฉันก็รู้อยู่หรอก... แต่พอตอนนี้มาติดแหง็กอยู่ในสำนักควบคุมเอง เรื่องที่เคยเกิดขึ้นก่อนหน้านี้ก็เลย#nผุดขึ้นมาในหัว เลยยิ่งหงุดหงิดเข้าไปใหญ่"
90100020-25 = "จะว่าไป... แล้วนิโกะไม่ร้อนเหรอ? ระหว่างที่วิ่งด้วยกัน ดูเหมือนเหงื่อไม่ออกสักหยดเลยนะ"
90100020-26 = "ก็ไม่รู้สิ สงสัยเพราะฉันไม่ได้เป็นคนขี้ร้อน อากาศวันนี้ก็เลยเย็นสบายสำหรับฉันนะ"
90100020-27 = "แปลกจัง... เราได้รับการฝึกให้รับมือกับอากาศร้อนมาเหมือนกันแท้ๆ แต่ทำไมความสามารถในการ#nทนความร้อนของเราถึงต่างกันได้ขนาดนี้ล่ะ?"
90100020-28 = "หรือสุดท้ายแล้วมันเป็นเรื่องของพื้นฐานร่างกายที่ติดตัวมาตั้งแต่เกิดมากกว่ากัน?"
90100020-29 = "ไม่รู้สิ เป็นเพราะ 'อันนั้น' ของคุรุมิเล็กกว่าของนิโกะหรือเปล่า? "
90100020-30 = "อะไรของฉันที่เล็กงั้นเหรอ!"
90100020-31 = "หูไงล่ะ หู#nคิดอะไรอยู่เนี่ย...?"
90100020-32 = "ว่ากันว่าส่วนปลายของร่างกายจะตอบสนองต่อการเปลี่ยนแปลงของอุณหภูมิได้ดีไม่ใช่เหรอ?"
90100020-33 = "นิโกะมีหูสัตว์ที่ใหญ่ ก็เลยน่าจะระบายความร้อนได้ง่ายน่ะ"
90100020-34 = "ก็จริงนะ... พออากาศร้อนๆ แบบนี้ ฉันรู้สึกว่าหูจะร้อนเร็วกว่าส่วนอื่นของร่างกายเลยละ"
90100020-35 = "แต่พอเป็นฤดูหนาว หูก็เย็นง่ายจนปวดหู ทำให้ทำกิจกรรมกลางแจ้งลำบากเหมือนกัน"
90100020-36 = "งั้นเหรอ... ถ้ามันมีความแตกต่างกันขนาดนั้น ก็คงช่วยไม่ได้สินะ"
90100020-37 = "แต่ยังไงฉันก็ชอบฤดูหนาวมากกว่าฤดูร้อนนะ ฤดูร้อนทีไร เหงื่อชอบออกตรงหน้าอกจนรำคาญทุกที"
