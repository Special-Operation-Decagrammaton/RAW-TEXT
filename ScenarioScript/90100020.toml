90100020-61 = ""
90100020-62 = ""
90100020-63 = "จะว่าไป ตั้งแต่มาที่สำนักควบคุม ยูกิโนะก็แทบไม่ได้คุยกับพวกเราเลยนะ เอาแต่หมกมุ่นกับการออกกำลังกายทั้งวันเลย"
