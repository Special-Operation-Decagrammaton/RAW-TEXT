[translation]
90100020-1 = "第2話;超人與狐狸的時光"
90100020-5 = ""
90100020-6 = "好～熱～"
90100020-7 = "為什麼一大早就熱成這樣啊？#n明明距離夏天還有好幾個月的說。"
90100020-8 = "而且矯正局的運動場真是爛透了。#n地面反射的熱氣直直往上竄，又連一點能躲太陽的陰影處都沒有……"
90100020-9 = "是覺得幫收容囚犯的矯正局搭個遮陽棚都嫌浪費錢嗎？"
90100020-10 = ""
90100020-12 = ""
90100020-13 = ""
90100020-14 = "跟這個理由比起來，我覺得避免獄警的視線被遮擋還比較有可能吧？"
90100020-15 = "畢竟只要有能夠產生陰影的建築，就會出現獄警看不到的死角。#n萬一有人在那種地方策劃越獄的話，那可就糟了。"
90100020-16 = "聽說若藻越獄之前，就是在樹蔭後面從共犯那裡拿到了需要的工具。"
90100020-17 = "唔唔……我從第一次見到那傢伙的時候就看他不順眼了。"
90100020-18 = "當初制伏他之後就該好好教訓他一頓，讓他再也不敢萌生越獄的念頭才對！"
90100020-19 = ""
90100020-22 = ""
90100020-23 = "冷靜點，胡桃。#n對嫌犯的過度制伏，原則上是被禁止的。"
90100020-24 = "這點我當然也知道……可是實際進到矯正局又想起之前的事，感覺更讓人火大了。"
90100020-25 = "……話說仁子你不熱嗎？#n一起跑步的這段期間，你好像連一滴汗都沒流耶。"
90100020-26 = "唔嗯……可能是因為我的體質不太怕熱吧。#n今天這種程度的天氣，對我來說還挺涼爽的。"
90100020-27 = "真奇怪……我們明明是一起接受酷暑訓練的，耐熱能力怎麼會相差這麼多呢？"
90100020-28 = "難道真的是先天的體質有差嗎？"
90100020-29 = "這個嘛……會不會是因為胡桃的「那個」比仁子小的關係？"
90100020-30 = "你說什麼東西小啊！"
90100020-31 = "是耳朵啦，耳朵。#n……你想到哪裡去了啊？"
90100020-32 = "不是都說身體末端對氣溫變化的反應特別敏感嗎？"
90100020-33 = "仁子他的獸耳比較大，所以散熱效率才會比較好吧。"
90100020-34 = "確實……在炎熱的夏日裡，頭頂上的耳朵好像會比其他部位更快變熱呢。"
90100020-35 = "不過冬天的時候也會因為耳朵冷到發痛的關係，不太適合在戶外活動就是了。"
90100020-36 = "原來如此……如果有那種差異的話也沒辦法了。"
90100020-37 = "不過相較之下，我還是喜歡冬天。#n夏天胸口老是會悶出一堆汗，實在很不舒服。"
90100020-38 = ""
90100020-40 = ""
90100020-41 = ""
90100020-42 = "…………嘖。"
90100020-43 = "你剛剛咂嘴了吧！"
90100020-44 = "沒有啊？"
90100020-45 = "騙人！你剛剛明明嘖了一聲！"
90100020-46 = ""
90100020-48 = ""
90100020-49 = ""
90100020-50 = "……雪乃還在跑步呢。"
90100020-51 = "雪乃，你要跑到什麼時候啊。#n運動時間馬上就要結束了──"
90100020-52 = ""
90100020-54 = ""
90100020-56 = ""
90100020-57 = ""
90100020-58 = "……我再跑一圈就進去。"
90100020-59 = ""
90100020-61 = ""
90100020-62 = ""
90100020-63 = "話說雪乃進入矯正局之後好像就不太跟我們說話，整天只顧著埋頭運動呢。"
90100020-64 = "是有什麼想一個人思考的問題嗎？"
90100020-71 = ""
90100020-72 = "……我想應該不少吧。"
90100020-73 = "……這倒是沒錯。"
90100020-74 = "雖然認真運動是好事，只希望他別把身體搞壞了……"
90100020-77 = ""
90100020-78 = ""
90100020-79 = "（光是在這裡虛度光陰，是無法為我的過錯負責的）"
90100020-80 = "（為了成為一個能負起責任的大人，我必須學得更多、更加努力、更加信任他人）"
90100020-81 = "（可是……）"
90100020-83 = "要為你們的決定負起責任啊！"
90100020-84 = "什麼為了市民的作戰嘛！我就是因為那場作戰才蒙受損失的耶！"
90100020-85 = ""
90100020-87 = "憑什麼只有我得犧牲啊？為什麼那個例外偏偏是我！？"
90100020-88 = "……還不如乾脆放任事故發生算了。"
90100020-89 = ""
90100020-91 = "我跟你們沒什麼好談的！#n去把更高層的──能負起責任的人帶來！"
90100020-92 = ""
90100020-93 = "（在面臨那個抉擇的當下，究竟怎麼行動才是正確的……我至今依然無法斷定）"
90100020-94 = "（這真的是像老師說的那樣，隨著時間流逝就能解決的問題嗎？）"
90100020-95 = "（還是說這股力量，是[ruby=聯邦學生會長]唯有超人才能[/ruby]背負的重擔呢）"
90100020-96 = "5，5020號……"
90100020-97 = "囚，囚犯編號5020號……！"
90100020-98 = ""
90100020-99 = "矯正局長好像很拚命地在叫誰呢？"
90100020-100 = "那不是雪乃的編號嗎？"
90100020-101 = "雪乃，在叫你哦？"
90100020-104 = ""
90100020-105 = "……抱歉，雪乃同學。#n我知道你還不習慣這個編號，不過這畢竟是矯正局的方針。"
90100020-106 = "……失禮了。#n我一時太專注於運動，因此沒注意到。"
90100020-107 = "請問有什麼事嗎？"
90100020-108 = "是會面請求。能請你立刻換上乾淨的衣服過來嗎？"
90100020-109 = "……會面？我記得今天的會面時間應該已經結束了才對。"
90100020-110 = "雖然是這樣沒錯，不過該說這並不是一般的會面請求嗎……"
90100020-111 = ""
90100020-113 = ""
90100020-114 = "……聯邦學生會長希望與你會面。"
90100020-115 = "聯邦學生會長……？"
90100020-119 = ""
90100020-120 = "……不好意思，請容我再確認一次。"
90100020-121 = "那位失蹤的聯邦學生會長……真的回來了嗎？"
90100020-122 = "是的。由於他毫無預告地突然歸來，就連女武神警察學園也發生了不小的騷動……"
90100020-123 = "不過多虧他迅速處理了積壓的工作，許多這段期間懸而未決的問題都得到了解決。"
90100020-124 = "照這樣下去，矯正局或許也能逐漸有所改善……"
90100020-125 = ""
90100020-127 = ""
90100020-128 = "（如果會突然像這樣回來的話，我們究竟又是為了什麼才……）"
90100020-129 = "當，當然在女武神警察學園之中，還有幾個更急需改善的部門就是了。#n尤其在防衛室長的事情之後──"
90100020-130 = ""
90100020-132 = ""
90100020-133 = "……啊，對不起。#n我一不小心就……"
90100020-134 = "別這麼說，沒關係的。"
90100020-135 = ""
90100020-143 = "聯邦學生會長，我把您交代的雪乃──不，囚犯編號5020號帶來了。"
90100020-144 = "好的，請進。"
90100020-145 = "（……是個陌生的聲音）"
90100020-146 = "（不，與其說是陌生……不如說好像有股不太像聯邦學生會長的違和感）"
90100020-147 = "（我記憶中的聯邦學生會長……有著什麼樣的聲音呢？）"
90100020-148 = "（他的模樣……我想不起來了）"
90100020-149 = ""
90100020-153 = ""
90100020-154 = "聯邦學生會長辦公室"
90100020-155 = ""
90100020-156 = ""
90100020-157 = "好久不見了，雪乃小隊長。"
90100020-158 = ""
90100020-160 = ""
90100020-161 = "你是……"
90100020-162 = ""
90100020-164 = ""
90100020-165 = ""
90100020-166 = ""
90100020-167 = ""
90100020-169 = "……聯邦學生會長。"
90100020-170 = "一段時間不見，您給人的印象似乎改變了不少呢。"
90100020-171 = "是嗎？最近好像經常聽到類似的說法呢。"
90100020-172 = "不過這也難怪，畢竟我確實離開了崗位一段時間。"
90100020-173 = ""
90100020-175 = ""
90100020-176 = ""
90100020-177 = "請坐吧。這場談話會需要一些時間。"
90100020-179 = "……在離開期間發生的事，我都已經在報告中聽說了。"
90100020-180 = "香耶防衛室長曾借助FOX小隊的力量，企圖發動政變對吧。"
90100020-181 = "…………是的。"
90100020-182 = "沒關係。我並沒有想責怪雪乃小隊長的意思。"
90100020-183 = "反而是我……應該向各位道歉才對。"
90100020-184 = "因為我的突然消失，導致奇普托斯發生了各種事件與事故，還讓許多人陷入了混亂。"
90100020-185 = "即便有人在過程中做出了錯誤的選擇……我也沒有立場去追究那些責任。"
90100020-187 = "……都是我的失誤。"
90100020-188 = ""
90100020-189 = "……我無顏以對。"
90100020-190 = "尤其對於SRT特殊學園的各位隊員，我更是感到萬分的抱歉。"
90100020-191 = "是我的缺席引發了圍繞SRT指揮權的爭議，進而讓學園走向了遭到關閉的結局……"
90100020-192 = "……我記得是叫RABBIT小隊吧。"
90100020-193 = "讓那些剛入學沒多久的一年級學生們，經歷了痛苦的遭遇呢。"
90100020-194 = "在聯邦學生會的公務告一段落之後──#n我也會努力讓SRT特殊學園復活，並盡可能讓隊員們都能接受最好的教育。"
90100020-195 = ""
90100020-197 = ""
90100020-198 = "您願意如此的話，我也別無所求了。"
90100020-199 = "……但是。"
90100020-200 = "即便如此，也不代表各位對市民造成的傷害會就此消失。"
90100020-201 = "為了讓政變成功而破壞基礎建設、襲擊聯邦學生會幹部、企圖在市中心引爆炸彈……#n這些都是不折不扣的重罪。"
90100020-202 = "如果私自赦免這些罪行，或許能減輕我的愧疚感……#n然而這也將使我們更難挽回市民們失去的信任。"
90100020-203 = "哪怕是為了恢復SRT原有的宗旨，這件事也絕不能輕易帶過。這點還請各位諒解。"
90100020-204 = "早在犯下罪行的那一刻起，我就已經做好了接受任何懲罰的覺悟。"
90100020-205 = "只是……其他隊員們，不過是忠實地執行我這個小隊長的命令罷了。"
90100020-206 = "就算要加重我的處分也無妨……能不能請您放過其他隊員，不追究他們的責任呢。"
90100020-207 = "……雪乃。想把所有責任一肩扛起，是你的壞習慣之一。"
90100020-208 = "正如世上的所有結果都不是源自單一的原因，社會的問題也無法只歸咎於某一個人。"
90100020-209 = "這個現實是所有人都分擔了一些責任，並且各盡其職所得到的結果。"
90100020-210 = "……當然，我自己也同樣無法擺脫那份責任的枷鎖。"
90100020-211 = "因此這場事態的代價，必須由所有人共同承擔才行。"
90100020-212 = ""
90100020-214 = ""
90100020-215 = ""
90100020-216 = "……以前在執行作戰時，曾經因為應對恐攻嫌犯失敗而導致無辜市民被捲入戰火。"
90100020-217 = "當時受害的市民們向SRT究責，而所有責任都在身為現場指揮官的我身上。"
90100020-218 = "然而聯邦學生會長卻表示一切都是自己的錯，並沒有向我們追究任何責任。"
90100020-219 = "如果世上的所有問題都不是一個人所能承擔的……#n那麼會長一直以來又為何要獨自背負SRT的力量呢？"
90100020-220 = "當時……是因為我還有餘裕。"
90100020-221 = "那時的我，擁有足以包容各位過錯的餘裕、地位和責任。"
90100020-222 = "受我之託執行任務的人陷入了困境，卻在有餘力救助的情況下對其究責……#n這實在稱不上是一個領導者該有的樣子。"
90100020-223 = "要這麼說的話，我其實也──"
90100020-224 = "不過現在的你，已經疲憊到連背負自己的罪過都感到吃力了。"
90100020-225 = "等你將來變得更加從容，寬容到足以背負他人罪過的時候，再來償還這筆債也不遲。"
90100020-226 = "現在就請你接受我的任性吧，雪乃。"
90100020-227 = ""
90100020-229 = ""
90100020-230 = "……聯邦學生會長的意思我明白了。"
90100020-231 = "但是光是留在矯正局反省，無法挽回SRT失去的名譽。"
90100020-232 = "只要能夠洗刷過錯，無論什麼我都願意做。#n請下達指示吧。"
90100020-233 = ""
90100020-235 = ""
90100020-236 = ""
90100020-237 = "……要直接赦免恐怕有困難，不過提供再次為市民服務的機會倒不成問題。"
90100020-238 = ""
90100020-240 = ""
90100020-241 = "雪乃，你是否曾聽說過所謂的「[ruby=Lore]怪談[/ruby]」呢？"
90100020-242 = "那是透過學生們的口耳與各種媒介流傳，無從得知依據與出處的虛無故事。#n傳承……以及鬼故事。"
90100020-243 = "是現實中不可能存在、令人難以置信──#n卻又具備莫名的說服力而得以不斷流傳、獲得生命力並延續下去的故事。"
90100020-245 = "比如說，存在著一班開往現實中不存在的異界車站的列車……"
90100020-247 = "又比如在深夜打開收音機，就會傳來光是聽見就會遭到詛咒的聲音……"
90100020-249 = "再比如依照特定順序搭乘廢棄大樓的電梯，就會再也無法歸來……"
90100020-250 = ""
90100020-251 = "……你似乎不覺得驚訝呢。#n是因為已經習慣可怕的故事了嗎？"
90100020-252 = "對連真偽都無法確認的虛構故事投入感情，是件沒有效率的事。"
90100020-253 = "是的。「怪談」原本只是不值一提，也不會對現實造成影響的荒唐故事……"
90100020-254 = "然而，最近聲稱實際遭遇了這些「怪談」的報告正在增加。"
90100020-255 = "而且並不只是單純的目擊情報，而是確實發生了因為怪談受到實際損害的案例。"
90100020-256 = "因為怪談受到傷害……？"
90100020-257 = "主張遭遇了怪談的學生，大多在查明真相之前就變得無法言語或消失無蹤了。"
90100020-258 = "倘若只是單純的恐怖攻擊或失蹤事件，本來應該委託女武神警察學園處理……#n可是現在就連事件的規模都無法掌握。"
90100020-259 = "因此，行政委員會判斷必須在這個「都市怪談」進一步擴散之前，#n將搜查工作移交給上級組織來進行。"
90100020-260 = "在一般治安組織無法應對的情況下，如果必須進行迅速且超越法規的搜查……"
90100020-261 = ""
90100020-263 = ""
90100020-264 = ""
90100020-265 = "……就輪到SRT出場了。"
90100020-266 = "正是如此。"
90100020-267 = "不過誠如剛才所說，這只是我以聯邦學生會長身分提出的建議，而不是命令或指示。"
90100020-268 = "目前不僅無法得知對手是誰……#n在最壞的情況下，各位也可能會面臨和那些受害者相同的結局。"
90100020-269 = ""
90100020-273 = ""
90100020-275 = "如果在找出怪談之前就先被怪談找上──下一個變成怪談的就會是你。"
90100020-276 = "即便如此，你也願意投入這場作戰嗎？"
90100020-277 = ""
90100020-278 = "是的。"
90100020-279 = "因為我們還背負著必須償還的債。"
90100020-280 = ""
90100020-282 = ""
90100020-283 = ""
90100020-284 = "很好。那麼我馬上將聯邦學生會至今蒐集到的怪談情報分享給各位。"
90100020-285 = "希望各位能以此為基礎蒐集怪談真相的情報，並掃除這蔓延於奇普托斯的威脅。"
90100020-286 = "……除此之外還有一件事。#n這並不是以聯邦學生會長，而是我以個人身分提出的請求。"
90100020-287 = ""
90100020-289 = ""
90100020-290 = "還請各位務必平安歸來。"
90100020-291 = "這一點還請您放心。"
90100020-292 = "迅速放棄沒有勝算的戰鬥並撤退，也是特殊部隊的職責之一。"
90100020-294 = "不過在作戰開始之前，我有一件事想請教您。"
90100020-295 = "好的，你請說。"
90100020-296 = "雖然這次作戰是以非官方形式進行的任務，#n不過為了確保據點或補給彈藥，我們需要一個能與外部接洽的後援組織。"
90100020-297 = "在SRT以往的作戰之中，這個角色都是由聯邦學生會長來擔任。#n然而在如今這種無法公開表明身分的情況下，我們該委託哪個組織擔任後援呢？"
90100020-298 = "這麼說也對。考量到現在的情況，如果由我來負責支援FOX的話，#n可能會讓人產生「聯邦學生會已經正式承認SRT特殊學園復活」的印象。"
90100020-299 = "不過幸運的是，奇普托斯正好有個能夠代替那個角色的組織。"
