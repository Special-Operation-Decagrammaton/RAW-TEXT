90100020-194 = "ฉันจะเร่งสะสางงานขององค์การนักเรียนให้เรียบร้อย แล้วจะพยายามฟื้นฟูสถาบันพิเศษ SRT ขึ้นมาอีกครั้ง เพื่อให้ทุกคนได้รับการศึกษาที่ดีที่สุดค่ะ"
90100020-195 = ""
90100020-197 = ""
90100020-198 = "ถ้าช่วยทำอย่างนั้นให้ ฉันก็คงไม่มีอะไรจะขอไปมากกว่านี้แล้วค่ะ"
