90100020-109 = "มาเยี่ยมเหรอคะ...? แต่เท่าที่ฉันรู้ วันนี้หมดเวลาเยี่ยมแล้วนี่คะ"
90100020-110 = "มันก็จริงอยู่หรอกค่ะ แต่นี่ไม่ใช่การขอเข้าเยี่ยมทั่วไปน่ะค่ะ..."
