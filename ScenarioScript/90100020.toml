[translation]
90100020-1 = "Episode 2;Between a Superhuman and a Fox"
90100020-5 = ""
90100020-6 = "It's so hoooooot!"
90100020-7 = "How is it already so disgusting? Summer's not for a few more months."
90100020-8 = "And the Corrections Bureau's yard is the worst. There's no shade, everything's outside, and it's so blazing that I can SEE the heat lines rise from the ground."
90100020-9 = "This is cruel and unusual punishment. What, they have this giant facility and don't have the budget for a flimsy shade canopy?"
90100020-10 = ""
90100020-12 = ""
90100020-13 = ""
90100020-14 = "I think it's more so the guards can keep an eye on us."
90100020-15 = "Structures cast shadows, you know. That means blind spots. And THAT means more opportunities for inmates to escape."
90100020-16 = "I heard the whole reason Wakamo broke out was because someone smuggled tools and stowed them behind a tree."
90100020-17 = "Ugh... I never liked her."
90100020-18 = "I should've taught her a REAL lesson and made it so she wouldn't even DREAM of busting out."
90100020-19 = ""
90100020-22 = ""
90100020-23 = "Calm yourself, Kurumi. There are valuable and necessary laws preventing us from deploying excessive force."
90100020-24 = "Yeah... But now that we're stuck in the Corrections Bureau, I can't help but think about her. Between that and the heat, I might be a little grumpy, okay?"
90100020-25 = "...Niko, how are you not hot? You haven't even broken a sweat!"
90100020-26 = "Hmm... I generally run pretty cold, I guess. It's actually pretty balmy out here."
90100020-27 = "...Weird. We all went through the same extreme-heat training, so how do we have such different tolerances?"
90100020-28 = "Maybe it's genetics."
90100020-29 = "I wonder. Maybe it's because your \"assets\" are smaller than Niko's?"
90100020-30 = "What \"assets\"?!"
90100020-31 = "Ears. Your ears... What did you think I was talking about?"
90100020-32 = "They say extremities are the most sensitive to temperature changes, right?"
90100020-33 = "Since Niko has such fluffy satellite dish ears, maybe that helps her dissipate heat."
90100020-34 = "Come to think of it... My upper ears tend to heat up faster than the rest of my body during the summer."
90100020-35 = "And in winter, my ears get so cold that they start hurting, which makes it hard to stay outside."
90100020-36 = "I see... I guess there's no helping it, then."
90100020-37 = "But still, I prefer winter over summer. I hate how my chest gets so sweaty and gross."
90100020-38 = ""
90100020-40 = ""
90100020-41 = ""
90100020-42 = "...Tsk."
90100020-43 = "Did you just click your tongue at me?"
90100020-44 = "No way! Wasn't me."
90100020-45 = "Liar! I heard you! A click and a \"tsk.\" What are you trying to say?"
90100020-46 = ""
90100020-48 = ""
90100020-49 = ""
90100020-50 = "...And Yukino is still running laps."
90100020-51 = "Yukino, when are you going to take a break? Rec time's almost over!"
90100020-52 = ""
90100020-54 = ""
90100020-56 = ""
90100020-57 = ""
90100020-58 = "...One more lap."
90100020-59 = ""
90100020-61 = ""
90100020-62 = ""
90100020-63 = "You know, Yukino's barely talked to us since we got locked up. She just works out all day."
90100020-64 = "Maybe she needs some alone time to gather her thoughts."
90100020-71 = ""
90100020-72 = "...Well, there's a lot for her to think about."
90100020-73 = "...I suppose so."
90100020-74 = "I'm happy to see her feeling so motivated to train, but I hope she doesn't hurt herself."
90100020-77 = ""
90100020-78 = ""
90100020-79 = "(I can't waste my time here. I must be responsible.)"
90100020-80 = "(I need to learn more, try harder, and learn to trust others. It's time to grow up.)"
90100020-81 = "(But...)"
90100020-83 = "Take responsibility for your actions!"
90100020-84 = "Who are you to call this \"a mission for the people\"?! Do you know how much I lost because of your self-indulgence?"
90100020-85 = ""
90100020-87 = "Why am I singled out to suffer? Why am I the exception?!"
90100020-88 = "...Perhaps you should have just let the accident play out."
90100020-89 = ""
90100020-91 = "I've got nothing more to say to you! Bring someone capable! Someone higher up! I need someone who can take responsibility!"
90100020-92 = ""
90100020-93 = "(...I'm still not sure what I should have done.)"
90100020-94 = "(Would it have solved itself in time, as Sensei insisted?)"
90100020-95 = "(Or was it too much power? Was it a burden that only a superhuman like the President could bear? Was it always beyond my capability?)"
90100020-96 = "Miss...5-5020...?"
90100020-97 = "P-Please, Inmate 5020...! Pardon me, but may I have a moment?"
90100020-98 = ""
90100020-99 = "The director's looking for someone."
90100020-100 = "Isn't that Yukino's number?"
90100020-101 = "Yukino, hey. She wants you. Pull over."
90100020-104 = ""
90100020-105 = "...I'm sorry, Miss Yukino. I understand that you have a lovely name and are not...accustomed to answering to an identification number. Unfortunately, it's Bureau policy for public announcements."
90100020-106 = "...My apologies, Director. I got carried away with my workout."
90100020-107 = "How may I help you?"
90100020-108 = "You have a guest. Could you please freshen up, then allow me to escort you to her?"
90100020-109 = "...A guest? But I thought visiting hours were over."
90100020-110 = "That's quite accurate. But this isn't ANY visitor, Miss Yukino."
90100020-111 = ""
90100020-113 = ""
90100020-114 = "...This is the General Student Council President."
90100020-115 = "THE General Student Council President...?"
90100020-119 = ""
90100020-120 = "Director, if I may ask..."
90100020-121 = "It's really her? The General Student Council President is back?"
90100020-122 = "Yes. It's been...quite the hullabaloo at Valkyrie. She's returned suddenly after her extended absence. It's caught all of us by surprise."
90100020-123 = "She's already hard at work and is as brilliant as always. She's done wonders for our backlog."
90100020-124 = "Perhaps she should help us at the Corrections Bureau next..."
90100020-125 = ""
90100020-127 = ""
90100020-128 = "(If she was going to return on a whim like this, then why did we go through all that trouble...?)"
90100020-129 = "O-Of course, every department at Valkyrie needs attention and care. Above all, we must address the Chief of Defense..."
90100020-130 = ""
90100020-132 = ""
90100020-133 = "...Ah, my apologies. I was rambling on, as usual."
90100020-134 = "Don't worry about it."
90100020-135 = ""
90100020-143 = "General Student Council President. Yukino, Inmate No. 5020, is here, as you requested."
90100020-144 = "Come in."
90100020-145 = "(...It's an unfamiliar voice.)"
90100020-146 = "(No, rather than \"unfamiliar\"... Something feels off. It's uncanny. THIS is the General Student Council President?)"
90100020-147 = "(What did she sound like, again?)"
90100020-148 = "(I can't even remember her face.)"
90100020-149 = ""
90100020-153 = ""
90100020-154 = "General Student Council Executive Office"
90100020-155 = ""
90100020-156 = ""
90100020-157 = "Good to see you, Squad Leader Yukino."
90100020-158 = ""
90100020-160 = ""
90100020-161 = "You are... Yes..."
90100020-162 = ""
90100020-164 = ""
90100020-165 = ""
90100020-166 = ""
90100020-167 = ""
90100020-169 = "...the General Student Council President."
90100020-170 = "It's been a while. You have a different air about you."
90100020-171 = "Is that so? I've been hearing that a lot lately."
90100020-172 = "Well, I suppose it's because I've been away for so long. I've changed, and so has Schale."
90100020-173 = ""
90100020-175 = ""
90100020-176 = ""
90100020-177 = "Have a seat. We have much to discuss."
90100020-179 = "...I've been catching up on the reports. A lot of history has been made in my absence."
90100020-180 = "Like how the FOX Squad helped Chief of Defense Kaya stage a coup."
90100020-181 = "...Correct."
90100020-182 = "Don't worry. I'm not here to scold you, Squad Leader Yukino."
90100020-183 = "In fact, I...owe you an apology."
90100020-184 = "I'm the one who disappeared without a word. I left everyone with improper guidance, and countless accidents and miscommunications erupted as a result."
90100020-185 = "It was my responsibility. Yes, many students made incorrect choices while I was gone. But I can't hold them accountable for any of it."
90100020-187 = "...Because it was my mistake."
90100020-188 = ""
90100020-189 = "...I have no excuse for my abandonment."
90100020-190 = "And I feel especially sorry to the squad members of SRT Academy."
90100020-191 = "SRT was left weakened and aimless in my absence, which ultimately led to the dissolution of the academy..."
90100020-192 = "...Who were those girls left behind? The RABBIT Squad?"
90100020-193 = "First-year students, yes. I caused them a lot of grief."
90100020-194 = "Once I finish my General Student Council duties, reviving SRT Academy will be my priority. I want those students to receive the best possible education."
90100020-195 = ""
90100020-197 = ""
90100020-198 = "That's all I could ever hope for."
90100020-199 = "...However."
90100020-200 = "That does not erase the damage you've caused to the Kivotos civilians."
90100020-201 = "Sabotaging infrastructure, sniping the General Student Council officers, and attempting to detonate a bomb in the heart of the city, all for an attempted coup... These are serious crimes, Yukino."
90100020-202 = "Pardoning you might mitigate my personal sense of guilt, but the public will not forget so easily. We've already damaged their trust in us."
90100020-203 = "I ask for your understanding. We can't take this matter lightly, even as we focus on restoring SRT."
90100020-204 = "I knew what I was doing. From the start, I was prepared to receive the appropriate punishment, regardless of its weight."
90100020-205 = "But... My squad members were only following my orders. I led the squad."
90100020-206 = "You may hold me completely accountable. And, while I realize the optics of the situation, I only ask you treat my squad members with mercy."
90100020-207 = "...Yukino. Trying to take all the responsibility again? That's a bad habit of yours."
90100020-208 = "Just as outcomes and consequences don't stem from a single cause, societal problems cannot be traced back to a singular scapegoat."
90100020-209 = "Everyone shares their slice of responsibility. Everyone fulfills their respective roles."
90100020-210 = "...And of course, I am no exception."
90100020-211 = "Therefore, we ALL must share the burden of guilt and the responsibility to rebuild."
90100020-212 = ""
90100020-214 = ""
90100020-215 = ""
90100020-216 = "...Once, I failed to properly respond to a suspected terrorist attack. Civilians were caught in the crossfire."
90100020-217 = "The people rightfully wanted to hold SRT accountable. I was the commander on site, and so I surrendered myself, taking full responsibility."
90100020-218 = "But you, General Student Council President, blamed yourself instead. You resolved the situation and did not hold me accountable."
90100020-219 = "You say that one person, alone, cannot bear the responsibility for all the world's problems... Then why had you shouldered the burden of SRT's power all on your own?"
90100020-220 = "It's because... I had the capacity for it at the time."
90100020-221 = "Back then, I had enough headspace, social capital, and responsibility to take the blame."
90100020-222 = "A good leader would never hold a subordinate responsible for carrying out a mission. You worked at my request, and I had the means to assist you."
90100020-223 = "In that case, I too—"
90100020-224 = "No, Yukino. You're too exhausted. The guilt is weighing you down."
90100020-225 = "One day, your head will feel lighter. And I assure you it won't be too late for you to assist others and repay your debts."
90100020-226 = "But for today, I have a request."
90100020-227 = ""
90100020-229 = ""
90100020-230 = "...I'm listening, General Student Council President."
90100020-231 = "We can't regain SRT's honor by sitting in the Corrections Bureau and ruminating on our regrets."
90100020-232 = "I will do anything to atone for my mistakes. Please give me your orders."
90100020-233 = ""
90100020-235 = ""
90100020-236 = ""
90100020-237 = "...While a pardon may be difficult, I CAN provide you with an opportunity to serve our citizens."
90100020-238 = ""
90100020-240 = ""
90100020-241 = "Tell me, Yukino. Have you heard of \"Lore\"?"
90100020-242 = "It's a larger term for baseless rumors, stories, and urban legends passed down from student to student. While they once spread through word-of-mouth, the internet has led to a renewed interest in this brand of folklore."
90100020-243 = "Lore encompasses stories that cannot possibly exist in our reality. And yet, these stories stay alive and spread because, while they're fantastical, they carry a grain of truth."
90100020-245 = "Like a train headed to an otherworldly station..."
90100020-247 = "Or an untraceable voice on a mystery radio station that curses anyone who hears it..."
90100020-249 = "Or an elevator that, if you board and exit following a specific procedure, makes it impossible to ever return..."
90100020-250 = ""
90100020-251 = "...You don't seem surprised. Are you a connoisseur of these scary stories?"
90100020-252 = "No. I find it counterproductive to let myself indulge in such fictions."
90100020-253 = "Of course. I initially agreed that Lore sounded preposterous. It seems to have no impact on reality, a frivolous distraction from real issues."
90100020-254 = "However, multiple students have claimed to have witnessed instances of Lore lately."
90100020-255 = "Worse so, others assert that they have been attacked by such Lore manifestations."
90100020-256 = "This so-called \"Lore\" is hurting people?"
90100020-257 = "Yes. Several students have mysteriously disappeared after encountering these alleged creatures. Others...have lost their ability to speak."
90100020-258 = "Valkyrie could handle this if it were a distinguishable act of terrorism or a missing person incident. However, this is much more complex. And it requires discretion."
90100020-259 = "The Board of Administration concluded that the investigation must be transferred to a higher-level organization. We need professionals to step in before these urban legends cause widespread harm and panic."
90100020-260 = "We require a fast, extrajudicial investigation. Basically, I need a dedicated team that can step beyond the limits of ordinary law enforcement..."
90100020-261 = ""
90100020-263 = ""
90100020-264 = ""
90100020-265 = "...You need SRT."
90100020-266 = "As you've said, Squad Leader."
90100020-267 = "However, as I've already mentioned, this is a suggestion. It's not a command or an order."
90100020-268 = "We do not know what we're up against, and you may face terrible, otherworldly danger."
90100020-269 = ""
90100020-273 = ""
90100020-275 = "If whatever's out there bests you, you may become Lore yourself."
90100020-276 = "That is the mission. Do you choose to accept?"
90100020-277 = ""
90100020-278 = "Yes."
90100020-279 = "We have debts to clear."
90100020-280 = ""
90100020-282 = ""
90100020-283 = ""
90100020-284 = "Excellent. I will share our Lore research with you right away."
90100020-285 = "We need you to gather information on what these \"Lore\" instances truly are. You need to understand this enemy, and then you must eliminate it."
90100020-286 = "...Also, Yukino. This is my personal request, and not an order from the General Student Council President."
90100020-287 = ""
90100020-289 = ""
90100020-290 = "Please come back safely."
90100020-291 = "Without a doubt."
90100020-292 = "We trust in our instincts. It's also our responsibility to know when to retreat from an unwinnable fight."
90100020-294 = "I have an additional request, if I may."
90100020-295 = "Yes?"
90100020-296 = "While this is a covert and unofficial mission, we need additional resources. My squad is not enough. We need aid to help us secure a base of operations and secure ammunition."
90100020-297 = "While you, the General Student Council President, backed SRT's missions, it sounds like you cannot do that publicly anymore, not while under so much scrutiny."
90100020-298 = "An excellent point. If I publicly endorse the FOX Squad right now, the press may conclude that I condone your actions and intend to revive SRT. For obvious reasons, I'm not ready to announce that yet."
90100020-299 = "Fortunately, there is another organization in Kivotos that can aid you."
90100020-300 = "An investigative body that possesses authority and resources comparable to those of the General Student Council, yet holds a unique status..."
90100020-301 = "Schale."
90100020-302 = ""
90100020-304 = ""
90100020-306 = "...Excuse me?"
90100020-308 = "Next Episode;A Squad Marches on Its Stomach"
