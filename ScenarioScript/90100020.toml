90100020-122 = "ค่ะ ประธานองค์การนักเรียนกลับมาอย่างกะทันหันโดยไม่บอกล่วงหน้า ที่สถาบันฝึกตำรวจวัลคิรี่ก็เลย#nเกิดความวุ่นวายเล็กๆ อยู่พักหนึ่ง..."
90100020-123 = "แต่ก็ต้องขอบคุณที่ท่านช่วยสะสางงานที่คั่งค้างได้อย่างรวดเร็ว ปัญหาหลายอย่างที่ค้างคามาตลอด#nก็เลยได้รับการแก้ไขค่ะ"
