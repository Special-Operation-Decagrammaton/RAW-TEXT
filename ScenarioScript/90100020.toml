90100020-98 = ""
90100020-99 = "หัวหน้าสำนักควบคุมกำลังเรียกใครอยู่น่ะ?"
90100020-100 = "นั่นหมายเลขของยูกิโนะไม่ใช่เหรอ?"
90100020-101 = "ยูกิโนะ หัวหน้าสำนักควบคุมเรียกเธออยู่นะ?"
90100020-104 = ""
90100020-105 = "ขอโทษนะคะ... ยูกิโนะ ฉันรู้ว่าคุณยังไม่ชินกับการเรียกด้วยหมายเลข แต่นี่เป็นระเบียบของสำนักควบคุมน่ะค่ะ"
90100020-106 = "ขอโทษที่เสียมารยาทค่ะ... เมื่อกี้ฉันเอาแต่โฟกัสกับการออกกำลังกาย"
90100020-107 = "มีเรื่องอะไรเหรอคะ?"
