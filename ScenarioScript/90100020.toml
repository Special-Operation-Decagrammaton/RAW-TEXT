90100020-190 = "ฉันรู้สึกเสียใจเป็นพิเศษกับทุกคนในสถาบันพิเศษ SRT ค่ะ"
90100020-191 = "เพราะฉันไม่อยู่ ก็เลยเกิดข้อถกเถียงเกี่ยวกับอำนาจในการควบคุมปฏิบัติการของ SRT จนสุดท้ายก็ลงเอยด้วยการยุบสถาบันไป..."
90100020-192 = "ทางนั้นชื่อว่ากองทหาร RABBIT หรือเปล่านะคะ..."
