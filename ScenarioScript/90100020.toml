90100020-73 = "ก็จริงอยู่หรอก..."
90100020-74 = "ออกกำลังกายเยอะๆ มันก็ดีอยู่หรอก แต่หวังว่าจะไม่หักโหมจนไปทำลายสุขภาพของตัวเองนะ..."
90100020-77 = ""
90100020-78 = ""
90100020-79 = "(แค่ใช้ชีวิตอยู่ที่นี่ไปวันๆ คงไม่อาจชดใช้ความผิดที่ฉันก่อไว้ได้)"
90100020-80 = "(การจะเป็นผู้ใหญ่ที่มีความรับผิดชอบ เราต้องเรียนรู้ให้มากขึ้น พยายามให้หนักขึ้น และไว้วางใจผู้อื่นมากขึ้น)"
90100020-81 = "(แต่ว่า...)"
90100020-83 = "พวกเธอต้องรับผิดชอบต่อการตัดสินใจของตัวเองสิ!"
90100020-84 = "นี่น่ะเหรอปฏิบัติการเพื่อชาวเมือง? ฉันต่างหากที่เป็นฝ่ายเสียหายจากปฏิบัติการครั้งนั้น!"
90100020-85 = ""
90100020-87 = "ทำไมต้องเป็นฉันคนเดียวที่ต้องเสียสละ? แล้วทำไมฉันถึงต้องเป็นข้อยกเว้นนั้นด้วย?!"
90100020-88 = "ถ้าปล่อยให้เกิดเรื่องไปซะตั้งแต่แรกก็คงจะดีกว่า..."
90100020-89 = ""
90100020-91 = "ฉันไม่มีอะไรจะคุยกับพวกเธอ! ไปเรียกคนที่ตำแหน่งสูงกว่านี้มา! ฉันจะคุยกับคนที่รับผิดชอบเรื่องนี้ได้!"
90100020-92 = ""
90100020-93 = "(จนถึงตอนนี้ก็ยังไม่รู้เลยว่า... ตอนนั้นที่ฉันต้องเลือก ฉันควรเลือกทำแบบไหนถึงจะถูกต้อง)"
90100020-94 = "(เรื่องนี้จะคลี่คลายได้เองเมื่อเวลาผ่านไปอย่างที่คุณครูบอกหรือเปล่านะ?)"
90100020-95 = "(หรือว่าพลังนี้จะเป็นภาระหนักอึ้งที่มีเพียง[ruby=ประธานองค์การนักเรียน]ยอดคน[/ruby]เท่านั้นที่สามารถแบกรับได้)"
90100020-96 = "หมายเลข 5... 5020..."
