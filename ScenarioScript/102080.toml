[translation]
102080-1 = "제8화;자치구 방어 작전 - 붉은겨울"
102080-4 = "이번엔 저희 차례군요. 모두들, 부탁합니다."
102080-11 = "좋아! 돌격! 돌격이다!!"
102080-18 = "동지들! 가자! 노동자의 권리를 위하여!"
102080-20 = "푸딩을 위하여!"
102080-25 = "……그러고 보니 체리노 회장님은 따로 처리해야 할 일이 있다고 자리를 비우셨는데, 걱정되네요."
102080-26 = "혹시 대피소에 먼저 가신 걸까요……."
102080-28 = "자아, 대피소는 여기, 구교사에 마련되어 있어요!"
102080-29 = "응? 들은 거랑 다른데요? 여긴 폐허잖아요. 온천은요?"
102080-30 = "그, 그건…… 사정이 있어서……. 폐업이랄까……."
102080-31 = "네에? 그런 거였어요? 기대하고 있었는데!"
102080-32 = "그치만 모미지. 이런 곳에 갇혀 있다 보면 좋은 아이디어들이 잔뜩 나오게 될지도 모른다구?"
102080-33 = "여기서 한적하게 있으면서 겸사겸사 다음 <코미센>에 낼 회지 준비를 하는 거지. 후후후."
102080-34 = "과연…… 통조림이라는 것이군요! 이해했어요!"
102080-39 = "노도카 쨩. 체리노 회장 봤어?"
102080-40 = "응? 아니. 여기 안 왔는데."
102080-41 = "이번에 만나면 특별반의 처우에 대해 따지려고 했는데……."
102080-42 = "그래?"
102080-43 = "그럼 어디 간 거지……?"
