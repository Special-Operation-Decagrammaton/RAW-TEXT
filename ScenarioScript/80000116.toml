[translation]
80000116-1 = "격에 어울리는 선물"
80000116-2 = "(발렌타인 데이 당일날 아침, 마코토로부터 연락이 도착했다.)"
80000116-7 = "키시싯. 오늘은 발렌타인 데이……."
80000116-8 = "친구, 연인, 지인 등등…… 수많은 인간관계로 얽혀 있는 이들끼리 친애의 의미를 담아 초콜릿을 주고받는 기념일이다."
80000116-9 = "그런 거 전부 제과 회사의 음모 아냐? 라는 지적도 있긴 하다만은."
80000116-10 = "크크큭! 시대의 흐름, 잠깐의 여흥, 재치 있는 이벤트를 두고 그런 소리를 지껄여 봐야 즐길 줄도 모르는 재미없는 인간이란 평가를 받기 십상이다."
80000116-11 = "이런 여흥마저 빈틈없이 챙길 줄 알아야, 비로소 우수한 리더, 참된 조직의 장이라 할 수 있겠지."
80000116-12 = "뭐어, 실제로 우리 만마전에서도 연례행사의 일환으로 발렌타인 데이가 되면 외부 곳곳에 만마전의 이름으로 초콜릿을 선물하고는 하니까 말이야."
80000116-13 = "그래서 말이다만, 선생. 오늘 시간은 있나?"
80000116-14 = "오늘 하루 당신에게 최고의 초콜릿을 선물하고자 한다만."
80000116-15 = "[s] \"응. 시간이라면 괜찮아.\""
80000116-16 = "키시시싯. 그런가? 그렇다면 다행이군."
80000116-17 = "그럼 선물을 준비한 장소를 알려주도록 하지. 그곳에서 기다리고 있겠다! 선생이여!"
80000116-24 = "[ns] \"그래서 마코토가 준 주소에 적힌 장소로 오긴 했는데…….\""
80000116-29 = "키시시싯. 왔는가. 선생."
80000116-30 = "[s1] \"안녕. 마코토. 그런데…… 어째서 드레스 차림이야……?\"\n[s2] \"더군다나 이곳은 파티홀……이지?\""
80000116-33 = "아아, 이건 전부 선생을 위해 준비한 것들이다."
80000116-34 = "응……? 무슨 준비냐고?"
80000116-35 = "키시시싯. 입 아프게 두말해서 무엇하겠나."
80000116-36 = "당연히 발렌타인 데이를 위한 준비인 게 당연하지!"
80000116-37 = "발렌타인 데이…… 흔히들 보통은 친애의 대상에게 초콜릿을 선물하는 날……이라고는 하지만, 이 몸은 생각했다."
80000116-38 = "발렌타인 데이라고는 해도 그냥 그렇게 초콜릿만 선물하고 끝내기에는……."
80000116-39 = "──솔직히 별로 재미없지 않나?"
80000116-40 = "아니, 재미를 떠나서라도 선물만 주고 마는 건 전혀 서프라이즈하지도 않고, 임팩트도 없고. 또한……"
80000116-41 = "너무나도…… 배포가 작은 것 아닌가……! 라고 말이지!"
80000116-42 = "[s] \"……평범한 거면 충분하지 않아?\""
80000116-43 = "전혀! 부족할 뿐이다!"
80000116-44 = "그래서 생각했지. 그런 평범한 것을 뛰어넘어, 이 마코토 님에게 어울리는 발렌타인 데이 선물이란 무엇일까."
80000116-45 = "어떠한 선물을 택해야, 범인들과 비교되는 이 몸만의 스페셜한 선물을 준비할 수 있을 것인가!"
80000116-46 = "고민하고 생각하고 궁리하고 궁구한 끝에──"
80000116-47 = "키시시싯! 마침내 이 몸은 떠올려 내고야 만 것이다!"
80000116-48 = "그래. 이 몸쯤 된다면 발렌타인 데이엔 단순히 초콜릿만 선물하고 끝날 게 아니라, 아예 게헨나 특제 파티홀을 준비하여 선생만을 위한……."
80000116-49 = "발렌타인 데이 이벤트. 그 자체를 선물하자고!"
80000116-50 = "[s] \"그렇게 준비해 준 건 엄청 고맙긴 한데. 살짝 부담스러워!\""
80000116-51 = "키킥! 사양할 거 없다."
80000116-52 = "게다가, 아직 이번 발렌타인 데이의 주역은 소개조차 하지 않았지 않느냐…… 저것을 봐라!"
80000116-57 = "[ns] \"이건…… 초콜릿으로 만든 분수……?\""
80000116-58 = "아아, 그래. 그 말대로다."
80000116-59 = "이 정도 레벨은 되어야 조금은 이 마코토 님에게 어울리는 규모의 선물이라 할 수 있지."
80000116-60 = "크크큭…… 어떤가. 선생. 진심으로 놀라고 기뻐해도 좋다고?"
80000116-61 = "무려 게헨나 최고급 카카오를 사용해 만든…… 게헨나…… 아니, 이 키보토스에 단 하나밖에 없는 진짜배기 초콜릿 분수니까!"
80000116-62 = "[s3] \"……으응. 솔직히 깜짝 놀랐다고 할까. 전혀 예상외라고 할까.\"\n[s4] \"진짜 마코토답네! 하고 충격을 받은 점도 적잖이 있지만.\""
80000116-65 = "[ns] \"그래도 마코토가 날 위해 준비해 준 선물이라니. 엄청 기뻐.\""
80000116-66 = "으으음?!"
80000116-67 = "[s] \"……응? 마코토? 왜 그래?\""
80000116-68 = "아니, 순간…… 선생의 말을 듣고 나니…… 가슴 한쪽에 불가사의한…… 그런 느낌이 드는 게……"
80000116-69 = "키시싯. 그런가. 이것은………"
80000116-70 = "……아무래도 이번 발렌타인 데이를 준비하며 쌓인 피로 때문인 모양이야!"
80000116-71 = "하여간 모처럼 준비한 발렌타인 데이 선물이니, 직접 즐기지 않으면 손해겠지."
80000116-72 = "[s] \"근데 초콜릿 분수라니, 어디서부터 뭘 어떻게 해야 할지…….\""
80000116-73 = "훗, 뭔가. 어찌해야 할 줄 모르는 것인가. 선생."
80000116-74 = "키키킥. 좋아. 그럼 여기에선 이 몸이 초콜릿 분수를 어떻게 즐기면 좋을지 시범을 보이도록 해볼까."
80000116-79 = "우선 내가 먹고 싶은 과자 종류를 골라서…… 아, 보통은 마시멜로를 가장 추천하니, 초심자라면 이것부터 고르는 게 좋을 테지."
80000116-80 = "그래서 이렇게 손에 든 마시멜로를 흐르는 초콜릿 분수에 맞춰, 천천히 찍으면……."
80000116-85 = "……응?"
80000116-86 = "[s] \"앗! 마코토…… 조심……!\""
80000116-87 = "푸화아아아아악!!!"
80000116-88 = "으, 으허어억?! 뭣, 뭐냐?! 무슨 일이냐?!"
80000116-89 = "자, 잠깐! 기다……!"
80000116-93 = "푸허어어어억?!"
80000116-101 = "……이게 대체…… 어째서? 배터리 과열로 인한 머신의 폭주……?"
80000116-102 = "선생이 오기 전에 5시간이나 넘게 리허설을 했던 것이 문제인가?"
80000116-103 = "아니면…… 나의 위엄을 알리기 위해, 기존 머신의 출력을 내 마음대로 5배 정도 업그레이드한 쪽이……?"
80000116-104 = "[s5] \"폭주하는 것도 당연해 보이는 이유들이네!\"\n[s6] \"그보다 마코토…… 괜찮아?!\""
80000116-107 = "크, 크큭…… 크큭……"
80000116-108 = "아아, 이건 아무것도 아니야."
80000116-109 = "초콜릿 방울이 조금 튄 것 정도로 호들갑 떨 필요는 없다."
80000116-110 = "[s] \"조금 정도가 아니긴 한데…… 드레스 밑단까지 흠뻑 젖었고.\""
80000116-111 = "아니! 괜찮고말고! 이 마코토 님이 고작 초콜릿 분수를 뒤집어쓴 것 정도로 타격을 받을 리 있겠나!"
80000116-112 = "오히려 방금 초콜릿을 뒤집어쓰는 것으로 확실해진 게 하나 있을 정도지!"
80000116-113 = "[s] \"확실해진 것이라면……?\""
80000116-117 = "역시 이 몸이 준비한 초콜릿 분수야."
80000116-118 = "업계 최고의 초콜릿을 써서 그런지, 두말할 것 없이 달콤하고 맛있군!"
80000116-119 = "[s] \"엄청나게 긍정적인 마인드! 아니, 그게 또 마코토다운 부분이지만!\""
80000116-120 = "자, 이럴 게 아니라. 여기, 여기다. 샬레의 선생."
80000116-121 = "이 오른손, 검지를 핥아보지 않겠나."
80000116-122 = "마침 마시멜로를 찍으려다가 손을 초콜릿에 푹 담가버린 참이다. 이거라면 내 말이 무슨 뜻인지 확실하게 알 수 있을 테지!"
80000116-123 = "자아! 나의 검지를 핥는 거다! 샬레의 선생이여!"
80000116-124 = "[s] \"아니아니, 괜찮아. 평범하게 먹게 해줘!\""
80000116-125 = "……음? 그래?"
80000116-126 = "그렇게까지 거절할 필요는…… 그, 없지 않나……? 살짝 상처가 될 정도다만."
80000116-127 = "어쨌거나…… 아직 발렌타인 데이는 끝나지 않았다!"
80000116-128 = "초콜릿 분수는 내가 준비한 이벤트의 일각일 뿐. 진정한 발렌타인 이벤트는 지금부터가 시작이니까!"
80000116-129 = "바로 옷을 갈아입고 오도록 하마! 선생!"
80000116-130 = "키시시싯! 이렇게 된 거…… 오늘 하루, 이 마코토 님이 준비한 특별 발렌타인 데이 이벤트를 잔뜩 만끽하게 해주마!"
80000116-131 = "집으로 돌아가기 전까지가 발렌타인 데이다!"
80000116-135 = "[ns] \"그래…… 모처럼의 발렌타인 데이니까.\""
80000116-137 = "[ns] \"마코토가 준비해 준 이벤트, 기대할게.\""
80000116-142 = "(예상 밖의 일들로 인해, 조금 놀라긴 했지만. 그래도 마코토가 준비해준 초콜릿들을 맛보며 함께 즐거운 시간을 보냈다.)"
