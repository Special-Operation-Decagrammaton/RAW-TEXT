[translation]
90001100-1 = "제10화;이름 없는 신들의 유산"
90001100-2 = "지금까지 우리는 빙해에서 호크마의 흔적을 쫓아 여기까지 왔고, 여기의 화산 지대에서 호크마가 무언가를 하고 있었다는 것……."
90001100-3 = "그리고 아마도 자원을 채취해서, 어딘가로 수송하고 있을 것이라는 사실까지를 알아냈어요."
90001100-4 = "그래. 그걸 위한 수송 철도까지 즉석에서 제작해, 어딘가로 자원을 보내고 있었어. 그곳 주위에도 시설이 남아 있는 것으로 보여."
90001100-5 = "그러면 제가 그 시설을 정찰하고 오겠습니다. 괜찮으시겠지요. 리오 님, 히마리 부장?"
90001100-6 = "그래. 부탁할게. 토키."
90001100-14 = "그렇다면 나도 도울까?"
90001100-15 = "아뇨. 에이미에게는 따로 부탁하고 싶은 일이 있어요."
90001100-16 = "뭔데?"
90001100-17 = "이 근처에 남은 데카그라마톤의 잔존 기지 시설을 분석하는 거죠."
90001100-18 = "샘플을 더 모아 와 달라는 거구나."
90001100-19 = "정확해요. 이런 경우에 샘플은 많으면 많을수록 좋으니까요."
90001100-27 = "……? 뭘 하려는 거죠, 리오?"
90001100-30 = "응? 샘플을 추가로 수집한다고 하지 않았어?"
90001100-31 = "그래서……. 도와주겠다는 거군요?"
90001100-32 = "……굳이 거기까지 말할 필요가 있나 싶어. 비합리적이고."
90001100-33 = "좋아요. 이렇게 된 거 빨리 끝내 버리죠. 시작할까요?"
90001100-34 = "[s] \"이러니저러니 해도…….\""
90001100-38 = "[ns] \"사이 좋구나!\""
90001100-39 = "완전 아니거든요?!"
90001100-40 = "완전히 잘못 봤어. 선생."
90001100-46 = "샘플의 양은 이걸로 충분해, 부장?"
90001100-47 = "네. 충분해요, 에이미. 분석도…… 이제 거의 끝나 가고 있고요. 결과는 잘 전송되고 있나요. 리오?"
90001100-48 = "문제없어. 그리고 나 역시 결론을 내릴 수 있을 것 같아."
90001100-49 = "그건 조금 들어 보고 싶군요. 한 번 이야기해 보세요."
90001100-50 = "이건 중요한 사항이라고 생각해. 현장에서도 확인할 수 있는 것이겠지만……."
90001100-51 = "여기에는, 물질의 재구축이 일어난 흔적이 있어."
90001100-52 = "확실히, 확인했어요. 그리고 우리는 이미 이 힘과 마주한 적이 있죠."
90001100-53 = "[s] \"응? 그런 적이 있다고?\""
90001100-54 = "네. 선생님. 아트라하시스의 방주…… 기억하시나요?"
90001100-55 = "거기에서 아리스와, 케이라고 불리는 개체…… 아이에게 일어난 일을요."
90001100-67 = "[ns] \"아……!\""
90001100-69 = "그런 거야. 선생."
90001100-70 = "네. 그런 것이죠."
90001100-71 = "물질의 재구축은, 이름 없는 신들의 힘 중에서도 대표적인 것이야."
90001100-72 = "호크마의 본체는 확인할 길이 없어 알 수 없지만, 최소한 이 툰드라 지대의 자원 채취 및 운송 시설들, 어쩌면 병력까지도……."
90001100-73 = "네. 바로 그 물질 재구축…… 이름 없는 신들의 힘을 이용하여 만들어진 것들이에요."
90001100-74 = "그리고 여기에서, 우리의 가설은 마침내 거의 확정 단계에 도달하게 된 것 같군요."
90001100-75 = "[s] \"확정 단계?\""
90001100-76 = "네. 이것으로 모든 조각이 맞추어졌다고 볼 수 있겠죠. 그건–"
90001100-84 = "아스마 토키, 지금 막 복귀했습니다. 보고드립니다."
90001100-85 = "화산 지대로부터 이어진 급조 철로를 확인했으며, 중간중간 소수의 방어 병력이 잔존하고 있는 것 역시 확인했습니다."
90001100-86 = "[s] \"응. 수고 많았어. 토키.\""
90001100-87 = "네. 당연합니다. 선생님께서는 조금 더 적극적이고 과감하게 저를 칭찬해 주셔야 합니다."
90001100-93 = "구체적으로는 머리 쓰다듬기, 가벼운 포옹, 허리를 두 손으로 감싸 주기 등이 있습니다."
90001100-96 = "선생님? 갑자기 왜 그렇게 당황하시죠?"
90001100-97 = "토키……?"
90001100-100 = "포기해, 회장. 이게 토키의 본성인지, 변한 건지 모르겠지만. 지금의 토키는 이래."
90001100-101 = "……이야기를 이어가죠. 선생님."
90001100-102 = "[s] \"그, 그래! 모든 조각이 맞추어졌다는 건 뭐야?\""
90001100-103 = "……시무룩, 입니다."
90001100-104 = "지금까지 초현상특무부가 빙해에 도착하기 전 상대해 온 데카그라마톤의 예언자들은, 비나, 헤세드, 호드의 3개체……."
90001100-105 = "그 3개체 모두, 이름 없는 신들의 힘과는 아무런 관련도 없었습니다."
90001100-106 = "그런데 빙해에 도착한 이후 상대한 게부라와 호크마에 한해서는, 이름 없는 신들의 힘의 흔적이 남겨졌다는 거죠."
90001100-107 = "용암 위에 떠 있는 배라는 초현실적인 광경도…… 그것과 연관이 있는 것인지도 모르겠고요."
90001100-108 = "[s1] \"확실한 건, 데카그라마톤과 예언자들이.\"\n[s2] \"이미 이름 없는 신들의 힘을 활용 중이라는 거구나?\""
90001100-111 = "네. 그것만은 확실한 사실로 보여집니다."
90001100-112 = "문제는 그것으로 무엇을 하려느냐는 것인데……."
90001100-116 = "??!! 리오, 지금 이건……?!"
90001100-117 = "그래. 이쪽에서도 확인했어."
90001100-123 = "무슨 일이야, 부장? 뭔가 일어났어?"
90001100-124 = "무언가 발견하셨습니까. 리오 님? 저희에게도 공유를……."
90001100-138 = "말씀드리죠. 이 정도면 제법…… 상당한 비상사태가 될 것으로 보입니다."
90001100-139 = "결론부터 말하자면, 새로운 예언자의 신호야."
90001100-140 = "그렇지만 지금까지와는 궤를 달리하는……."
90001100-145 = "엄청나게, 강력한 신호입니다."
90001100-147 = "다음화;막다른 길"
