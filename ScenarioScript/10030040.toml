[translation]
10030040-1 = "제4화;곰과 함께 춤을"
10030040-3 = "후우…… 이만큼 깊이 들어왔다면 보는 사람은 없겠지요."
10030040-7 = "그럼 이쯤에서…… 숨겨온 녹음기를 꺼내 볼까요."
10030040-11 = "출발하기 전에 부부장이 열심히 소지품 검사를 하긴 했지만, 설마 신발 밑창에 소형 녹음기가 숨겨져 있을 거라고는 생각지 못했을 겁니다."
10030040-12 = "고감도 마이크만 사용한다면 얼마든지 소형화가 가능한 것이 녹음기기의 장점이니까요. 후후……"
10030040-13 = "물론 제대로 된 크기의 녹음기에 비하면 다소 음질이 떨어지기는 하지만, 선생님과 함께하는 귀중한 시추에이션을 녹음하지 않고 넘어갈 수는 없으니……"
10030040-21 = "마이크 감도 및 노이즈 컷 세팅 완료……"
10030040-22 = "조정도 끝났으니 일단은 우선은 주변의 환경음이라도 가볍게 녹음해 볼까요."
10030040-28 = "ASMR 영상에서만 듣던 자연의 소리를 직접 귀로 들으니 뭔가 신선한 느낌이네요……"
10030040-33 = "바람이 나무 사이를 스치고 지나가는 소리……"
10030040-38 = "새들이 뛰놀며 정답게 지저귀는 소리……"
10030040-41 = "갸오오……"
10030040-42 = "흉포한 맹수가 울부짖는 소리……"
10030040-47 = "……맹수 소리?"
10030040-52 = "갸오오오—!"
10030040-58 = "히, 히이익……?!"
10030040-62 = "[ns] \"……이쪽에서 코타마의 비명 소리가 났어!\""
10030040-68 = "코타마 선배, 무슨 일이야! 괜찮아?"
10030040-69 = "저, 저기 저쪽에서……"
10030040-70 = "저쪽에……? 저쪽에 뭐가 있었는데?"
10030040-75 = "사나운 맹수의 울부짖음이 들렸습니다……!"
10030040-80 = "사나운 맹수라고……?"
10030040-83 = "[ns] \"설마 저기 보이는 그림자가……\""
10030040-88 = "갸오오오오……!"
10030040-94 = "자, 좀 더 배에 힘을 주고 큰 목소리로 힘차게!"
10030040-95 = "으읏……"
10030040-100 = "이만하면 충분하잖아요! 응원할 때도 이 정도로 소리를 지른 적 없는데!"
10030040-101 = "하도 소리를 질렀더니 이제는 목이 다 아플 정도라고요……"
10030040-102 = "애초에 함성을 지르는 게 야구와 무슨 상관이 있다고."
10030040-103 = "그렇지 않습니다, 레이 양."
10030040-107 = "힘껏 함성을 내지르기 위해서는 충분한 폐활량이 뒷받침되어야 하니까요."
10030040-109 = "어떤 운동을 하더라도 튼튼한 심폐 능력은 필수! 이는 야구라 해도 예외가 아닙니다!"
10030040-110 = "내년 시즌에는 더 좋은 성적을 거둘 수 있도록 지금부터 부지런히 심폐지구력을 단련하자고요!"
10030040-112 = "몇 번이나 말씀드렸지만 제게 필요한 건 장타를 칠 수 있는 근력이지, 심폐지구력 같은 건 필요 없다고요!"
10030040-113 = "으으…… 트레이닝부에 가면 홈런을 쉽게 칠 수 있게 될 거라는 선배들의 말을 믿지 말 걸 그랬어……"
10030040-114 = "그보다 훈련을 할 거라면 이런 깊은 산 속까지 올라올 필요는 없잖아요?"
10030040-115 = "게다가 이 시기는 야생 동물들이 막 겨울잠에 들어가는 시기인데, 이렇게 함성을 지르다가 진짜 곰이 나타나기라도 한다면……"
10030040-116 = "그런 사소한 문제 때문에 모처럼의 특훈을 중단할 수는 없지요."
10030040-117 = "설마…… 레이 양의 야구에 대한 열정은 그뿐이었던 겁니까?"
10030040-118 = "야구에 대한 열정이랑은 상관없잖아요!"
10030040-119 = "[s] \"……사나운 맹수는 아닌 것 같네.\""
10030040-123 = "어라, 트레이너. 그리고 베리타스의 부원 여러분까지……?"
10030040-125 = "오랜만이야, 스미레 부장."
10030040-126 = "그리고 그 옆에는…… 처음 보는 얼굴이네. 트레이닝 부의 새로운 부원인가?"
10030040-128 = "네, 일단 임시로 체험 입부 중이긴 하지만요."
10030040-130 = "아, 레이 쨩이다."
10030040-131 = "다행이다…… 방금 들은 건 사나운 맹수가 아니라 레이의 목소리였군요."
10030040-132 = "베리타스 부원들……? 여기서 보다니 드문 일이네."
10030040-133 = "[s] \"혹시 아는 학생이야?\""
10030040-134 = "네. 레이는 밀레니엄 야구부의 4번 타석을 맡고 있는 주전 타자입니다."
10030040-135 = "경기에 등판할 때마다 밀레니엄 교내 스포츠 게시판을 뜨겁게 달구는 인기 선수니, 밀레니엄 학생이라면 모를 수가 없지."
10030040-136 = "헤헤…… 그렇게 말해 주니 조금은 부끄럽네……"
10030040-137 = "지난 시즌에는 다른 의미로 게시판을 뜨겁게 불태우긴 했지만."
10030040-141 = "그게, 지난 시즌은 그러니까…… 타율이 조금 낮긴 했지만……"
10030040-142 = "이번 겨울 특훈을 거치고 나면 다음 시즌에는 사이클링 히트도 어렵지 않을 테니까!"
10030040-144 = "이렇게 추운 시기에 특훈이라니…… 대단한 열정이네."
10030040-145 = "체육계 학생들의 발상은 역시 이해하기 어렵습니다……"
10030040-147 = "그나저나 베리타스 부원들은 이 깊은 숲에 무슨 일로 온 거야?"
10030040-148 = "평소에는 부실 밖으로 나오는 일도 거의 없으면서……"
10030040-150 = "일단 우리는 새해 첫 일출을 보러 이곳 히가시알프스에 캠핑을 나왔는데……"
10030040-151 = "코타마 선배가 갑자기 이 숲에 볼일이 있다고 해서 말이야."
10030040-152 = "설마…… 숲에서 위험한 장난이라도 치고 있었던 건 아니겠지?"
10030040-157 = "그, 그렇지 않습니다!"
10030040-158 = "저는 그저 가져온 녹음기의 시험을 위해 환경음을 녹음하려고……"
10030040-162 = "……앗."
10030040-163 = "……이럴 줄 알았어. 가방 밖에 숨겨 온 전자기기가 있을 것 같다 싶더니만……"
10030040-167 = "자, 숨겨 온 녹음기는 이리 줘. 그대로 두었다가는 선생님의 프라이버시를 침해할 위험이 있으니까."
10030040-168 = "큿…… 겨울 산을 배경으로 한 [USERNAME] 선생님의 새로운 오디오 레코드를 만들 수 있는 기회였는데……"
10030040-169 = "[s1] (새로운 오디오 레코드……?)\n[s2] (뭔가 무서운 이야기가 들린 것 같은데……)"
10030040-173 = "그나저나 부원들끼리 새해 첫 일출을 보러 캠핑을 나오다니, 멋진 연휴 일정이로군요."
10030040-174 = "모처럼의 기회니 모두들 아름다운 자연의 풍경을 충분히 눈에 담아 갔으면 좋겠네요."
10030040-176 = "칫…… 자연의 풍경이라면 실내에서도 충분히 즐길 수 있는데."
10030040-177 = "그렇습니다. 서라운드 입체 음향 스피커를 사용하면 실내에서도 바깥의 소리를 생생하게 감상할 수 있으니까요."
10030040-178 = "실내에서도 얼마든지 멋진 일출을 볼 수 있는데, 굳이 귀찮게 밖에 나와야 해?"
10030040-180 = "아무리 그래도 야외에서만 즐길 수 있는 감성이라는 게 또 있잖아?"
10030040-181 = "차가운 새벽바람을 견디며 산을 오른 뒤에 마주하는 따스한 햇살의 감촉이라든가……"
10030040-182 = "그런 것도 실내에서 충분히 재현할 수 있거든?"
10030040-183 = "차가운 냉기가 올라오는 부실에서 담요를 두른 채 트레킹 다큐멘터리를 보면 몰입감이 엄청나다고!"
10030040-184 = "그 상태로 먹는 따끈한 컵라면도 빼놓을 수 없지요."
10030040-185 = "으음. 그 감성과는 조금 다르다고 할까……"
10030040-190 = "물론 요즈음은 인터넷이 발달했기 때문에 가기 어려운 지역의 풍경도 방에 앉아서 쉽게 감상할 수 있는 시대가 되었지요."
10030040-191 = "의자를 조정할 필요도 없이, 손가락을 움직이는 것만으로도 해가 지는 광경을 몇 번이고 다시 감상할 수 있으니까요."
10030040-192 = "……하지만 그래도 산의 정상에서 마주하는 특유의 풍경은, 직접 체험해 보지 않고서는 온전히 이해할 수 없다고 생각합니다."
10030040-193 = "어째서~? 보는 위치가 다를 뿐이지, 눈에 들어오는 풍경 자체는 똑같을 텐데."
10030040-194 = "방 안에서 보는 풍경에는 '그 장소'에 도달할 때까지의 힘든 여정이 포함되어 있지 않으니까요."
10030040-195 = "운동도 그렇지만, 고행 없이 얻어낸 보상과 경험은 그만큼 쉽게 사라지는 법이거든요."
10030040-196 = "게임으로 치자면…… 레벨 업 없이 치트로 적을 쓰러트리는 느낌?"
10030040-197 = "으음…… 그렇게 말하니 어떤 느낌인지 알 것 같기도……"
10030040-198 = "하지만 그 찰나의 풍경을 위해 하루 종일 고생을 하고 싶지는 않은걸."
10030040-199 = "일부러 밖에서 고생을 하지 않아도 실내에는 더 재미있는 게 잔뜩 있고."
10030040-200 = "확실히 실내에서 즐기는 여가에는 간편하고 자극적인 것이 많긴 하지만……"
10030040-201 = "때로는 자극을 멀리하고 휴식을 갖는 것이 성장에 더 큰 도움이 될 때도 있으니까요."
10030040-202 = "그런 의미에서 이번 특훈도 자극적인 근력 운동 대신, '가벼운' 유산소 운동 위주로 진행하는 게 어떨까요?"
10030040-203 = "그렇게 말씀하셔도…… 스미레 선배의 특훈은 조금도 가볍지 않거든요?!"
10030040-216 = "……트레이닝 부가 어떤 훈련을 하는지는 상관없지만, 여기서 이렇게 계속 소란을 피워도 괜찮은 거야?"
10030040-217 = "이 근처는 곰이 나온다는 소문이 있는데, 이렇게 소란을 피우다 겨울잠에서 깬 곰이 나타나기라도 하면—"
10030040-229 = "……아."
10030040-230 = "……아."
10030040-239 = "크아아아아!"
10030040-244 = "[ns] \"……곰이 나타났다!\""
10030040-245 = "그러니까 아까 말했었잖아요, 선배! 이 숲에서 소리를 지르면 곰이 나올 거라고!"
10030040-246 = "……오히려 좋은 기회로군요."
10030040-250 = "레이 양. 저 곰을 야수라고 생각하고 주루 플레이 훈련을 하는 건 어떨까요?"
10030040-251 = "전력으로 달려오는 야수로부터 태그를 당하지 않도록 빠르게 도망치는 겁니다!"
10030040-253 = "그거 말 되네. 곰에게 태그를 당하면 여러모로 아웃일 테니까."
10030040-254 = "지금 농담할 때가 아니거든?!"
10030040-260 = "크아아아앙!"
10030040-261 = "자자, 레이 양. 런 앤드 히트 작전입니다! 좀 더 집중해 주세요!"
10030040-262 = "아니, 정말 야구 훈련과는 이제 진짜 상관없잖아!"
