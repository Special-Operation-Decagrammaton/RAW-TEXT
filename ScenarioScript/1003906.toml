[translation]
1003906-1 = "RABBIT 4, 휴식합니다."
1003906-2 = "코우사기 공원 인근 산책로"
1003906-3 = "(미유가 바닥에 쭈그려 앉은 채 무언가를 고르고 있다.)"
1003906-4 = "으음…… 이 돌은 아니야……."
1003906-5 = "이 돌도 아니고……."
1003906-6 = "[s] \"무얼 하고 있는 거야?\""
1003906-10 = "서, 서, 서, 서, 선생님?!"
1003906-11 = "어, 어, 어느 틈에 가까이 오신 건가요?"
1003906-12 = "누군가가 가까이 다가오는 소리는 듣지 못했는데……."
1003906-13 = "서, 설마 선생님도 제 존재감이 옮아 다른 사람에게 인식되지 않게 되어 버린 건……."
1003906-14 = "[s] \"일부러 발소리를 죽인 것뿐이야.\""
1003906-15 = "아아…… 그, 그렇다니 다행이네요."
1003906-16 = "선생님이 갑자기 저처럼 존재감이 사라지신 줄 알고 정말 놀랐어요……."
1003906-17 = "만약 선생님마저 다른 사람의 눈에 보이지 않게 된다면……."
1003906-18 = "샬레의 당번 업무를 할 때 자동문을 열어줄 사람이 없을 테니까요……."
1003906-19 = "[s] \"……고작 그런 이유로 곤란해한 거야?\""
1003906-23 = "[ns] \"그나저나 무얼 하고 있었어?\""
1003906-24 = "그게, 그러니까……"
1003906-25 = "길가에 떨어진 조약돌을, 줍고 있었어요."
1003906-26 = "조약돌을 수집하는 건 제 취미라서요……."
1003906-27 = "[s] \"그래? 희귀한 모양의 돌이라도 있었어?\""
1003906-28 = "아, 아뇨. 딱히 특이한 모양의 돌을 찾는 건…… 아니에요."
1003906-29 = "제가 찾는 건 아무도 신경 쓰지 않고, 아무도 지켜보지 않는……"
1003906-30 = "사람들의 발에 채 굴러다니는, 그런 평범한 조약돌이에요."
1003906-31 = "그런 조약돌의 모습을 보고 있으면, 뭔가……."
1003906-32 = "뭔가 남의 일처럼 느껴지지 않는다고 할까……."
1003906-33 = "그런 걸, 발견해주고 싶어서……."
1003906-34 = "[s] \"어떤 느낌인지 조금은 알 것 같아.\""
1003906-35 = "저, 정말요……?"
1003906-36 = "선생님께서도 제 기분을 이해하신다니, 조금 기쁘네요……."
1003906-37 = "서, 선생님. 그럼 저와 같이…… 이 근처의 조약돌을 줍지 않으실래요?"
1003906-38 = "이 근처에는 모나지 않고 평범한 돌이 많아서 자주 오거든요……."
1003906-39 = "[s] \"좋아.\""
1003906-42 = "(근처에서 무난하게 생긴 돌을 하나 미유에게 건넸다.)"
1003906-43 = "이 돌은……."
1003906-44 = "선생님, 이건 평범한 조약돌이 아니에요…… 깨진 벽돌의 일부에요."
1003906-45 = "이것은 이미 역할을 다한 돌이기 때문에 평범하다 할 수 없어요……."
1003906-46 = "[s] \"그럼 이건?\""
1003906-47 = "이건 평범하다고 말하기에는 표면이 너무 예쁘게 잘 다듬어져 있어요……."
1003906-48 = "이런 조약돌이라면 돌에 관심이 없는 사람이라도 한 번쯤은 눈길을 주었을 거예요……."
1003906-49 = "[s] \"그럼 이건…….\""
1003906-50 = "이건 이 근처에서는 잘 보이지 않는 화강암 소재의 화산석……."
1003906-51 = "선생님, 어째서 아까 전부터 평범하지 않은 돌만 가져오시는 건가요……?"
1003906-52 = "희귀한 돌이 눈에 쉽게 띄는 건 알겠지만, 그렇지 않은 돌도 있는데……"
1003906-53 = "……좀 더 진지하게 골라주세요!"
1003906-54 = "[s] \"생각보다 엄격하구나…….\""
1003906-56 = "(이후, 해가 질 때까지 미유와 함께 열심히 조약돌을 골랐다.)"
