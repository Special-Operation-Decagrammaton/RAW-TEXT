[translation]
10032010-1 = "제1화;일 때문에 왔지"
10032010-5 = "[ns1] \"사람 많네…….\"\n[ns2] (돌아가고 싶다…….)"
10032010-8 = "이런 곳에는 어쩐 일이야? 선생님."
10032010-13 = "설마 여기서 선생님을 만나게 될 줄이야……. 놀랐어. 조금 예상 외인 걸."
10032010-14 = "그래도 놀란 건 서로 피차일반인가 보네. 나쁘지 않아."
10032010-15 = "[s3] \"아루……?\"\n[s4] \"어째서 여기에…….\""
10032010-18 = "바로 묻는 거야? 그런 것도 선생님답다면 선생님답지만……."
10032010-19 = "뭐, 나도 선생님 상대로 딱히 숨길 이유는 없으니……."
10032010-20 = "……역시 일 때문이지."
10032010-21 = "무슨 일이냐고? 아무리 그래도 그건 조금 말하기 어려운 걸. 이번 의뢰는 조금 특별해서 말이야."
10032010-22 = "의뢰인의 정보도, 타깃의 정보도 극비에 진행돼야 하는, 아주 중요한 일."
10032010-23 = "내용에 대해서는 아무리 경영 고문인 선생님이라도……."
10032010-27 = "시, 신뢰할 수 없는 건 아니지만! 그래도 지금은 말할 순 없달까……! 보안 상의 이유로!!"
10032010-28 = "그것보다 선생님이야말로 무슨 일이야? 이런 공연에 관심이 있는 줄은 몰랐는데……."
10032010-29 = "볼 때가 없는 건 아니지만 지금은 아니라고? 그러면……?"
10032010-30 = "일 때문이라고? ……선생님도?"
10032010-31 = "……무슨 일?"
10032010-32 = "[s5] \"나는 말해야 되는 거야?\"\n[s6] \"물어볼 거면 아루도 대답을…….\""
10032010-35 = "……?"
10032010-36 = "……!!"
10032010-37 = "아, 아니. 그러니까 이건……. 어……. 그런 뜻이 아니라……."
10032010-38 = "……농담이라고? 말할 수 있는 일이라고?"
10032010-39 = "……자료 조사?"
10032010-40 = "이번 공연 작품과 오페라 하우스에 대한 교육용 BD를 만들러 왔어……?"
10032010-41 = "왜 선생님이 그런 일을……."
10032010-42 = "[s7] \"왜냐니, 그야 선생님이니까…….\"\n[s8] \"총학생회에서 시켰거든. 하라면 해야죠, 뭐.\""
10032010-43 = "아, 그, 그러네. 참……. 미안. 그런 의미로 물은 건 아니었어."
10032010-44 = "뭔가 굉장히 솔직한 발언이네……."
10032010-45 = "뭐, 상황은 대충 알았어. 그런 이유에서라면야 이쪽도 안심이네."
10032010-46 = "마침 조금 시간이 남을 타이밍이기도 하고, 모처럼이기도 하니……."
10032010-47 = "선생님만 괜찮다면, 내가 한 바퀴 안내해 주도록 할까? 이 오페라 하우스 내부."
10032010-48 = "이상하게 생각할 거 없어. 완벽한 일 처리를 위해, 내부 구조는 이미 철저하게 파악해 두었거든."
10032010-49 = "선생님의 '오페라 하우스 견학'을 돕는 것 정도야 우습지."
10032010-54 = "어때, 선생님? 생각 있어? ……아니면 괜한 참견일까?"
10032010-59 = "(……좋아. 계획은 완벽해. 아주 자연스러워.)"
10032010-60 = "(내가 선생님을 마크하는 동안, 다른 아이들이 납치한 타깃을 오페라하우스 밖으로 내보내는 거야.)"
10032010-61 = "(괜히 우리 임무 내용을 들켰다가 선생님한테 싫은 소리 들을지도 모르니까 말이지. 그리고…….)"
10032010-62 = "(……그리고 겸사겸사…….)"
10032010-67 = "[ns] \"즉, 이건 데이트 신청 같은 거구나?\""
10032010-72 = "데, 데, 데이트……?"
10032010-73 = "아, 아니. 그런 걸 의도한 건 아니지만……"
10032010-74 = "그, 그렇게 볼 수도 있으려나…… 그, 그치만……!"
10032010-75 = "……아, 아니!"
10032010-76 = "착각하지 말라구? 이건 어디까지나 경영 고문의 일을 도와주려는 비즈니스적인 의도니까!"
10032010-77 = "[s9] \"나야 고맙지.\"\n[s10] \"든든한걸. 잘 부탁해, 아루.\""
10032010-87 = "……후후. 좋아."
10032010-88 = "하지만 선생님, 알고 있겠지? 나 같은 하드보일드한테 빚지는 건 가벼운 일이 아니라고."
10032010-89 = "오늘을 기억하도록 해. 언젠가는 꼭 갚아야 할 날이 올 테니까."
10032010-90 = "그럼 어디부터 갈까? 이 오페라 하우스의 어느 곳이든 잘 알고 있으니 말만 하라고, 선생님!"
10032010-95 = "(어차피 준비는 다 끝났고 타깃이 오려면 시간도 조금 남았으니까, 약간 여유를 부리는 건 문제없겠지. 후후.)"
10032010-96 = "(게다가 모처럼이잖아? 요즘 선생님 얼굴 보기가 좀 힘든 것 같기도 하고……. )"
10032010-103 = "후후……."
10032010-104 = "……그럼 어디부터 가고 싶어? 말만 하라고, 선생님."
10032010-107 = "과연, 무대 뒤편부터 보고 싶은 거였어?"
10032010-108 = "하긴 웬만한 경우가 아니고서야 직접 보기 어려운 곳이긴 하지. 탁월한 선택이야."
10032010-109 = "보통이라면 여기 온 것 자체만으로도 관리자들에게 쫓겨나기 십상이겠지만……."
10032010-110 = "다른 사람도 아니고 선생님이니까. 오히려 찾아가서 잘 부탁하면 좋은 설명을 들을 수 있을지도 모르지."
10032010-111 = "연출자나 무대 관리자를 찾아가서 말 걸어보면 될 거야."
10032010-112 = "……응?"
10032010-113 = "내부 구조는 그렇다 치고, 어떻게 그 사람들을 다 구분할 수 있냐고?"
10032010-114 = "그, 그야 이번 일을 위해서……."
10032010-118 = "사, 사소한 건 신경 쓰지 말자고! 중요한 건 덕분에 내가 선생님을 안내해 줄 수 있다는 거잖아?"
10032010-119 = "어디 보자……. 어디 있을까? 지금쯤이면 한창 바쁠 때일 텐데."
10032010-120 = "분명 이 근처에 있을……."
10032010-126 = "텐데……?"
10032010-133 = "……음?"
10032010-134 = "[s11] \"위에서 무슨 소리가……\"\n[s12] \"무슨 진동이지……?\""
10032010-137 = "……진동? ……위에서?"
10032010-146 = "서, 선생님!!"
10032010-154 = "선생님!? 괜찮아, 선생님!? 혹시 어디 다친 데라도……!!"
10032010-155 = "아, 아……? 괜찮다고? 전혀 다친 데 없어?"
10032010-156 = "……후우우우우……. 십 년 감수했네……."
10032010-157 = "(그나저나 천장이 무너져 내릴 줄이야……. 하필 마지막 포인트에서…….)"
10032010-158 = "이럴 줄 알았다면 다른 데부터 데려가는 거였는데……"
10032010-159 = "……응?"
10032010-160 = "그게 무슨 이야기냐고? 무슨 이야기냐니……."
10032010-164 = "아, 아니! 아니야! 그러니까 선생님. 이건 말이지! 그……! 그런 게 아니고……!!"
10032010-165 = "그러니까……!"
10032010-166 = "이 자식들, 치사하게 급습을 해!? 우리가 그리 쉽게 당해줄 줄 알았어!?"
10032010-167 = "당해주세요당해주세요당해주세요당해주세요당해주세요당해주세요!!"
10032010-168 = "아루님의 계획이란 말이야! 잔말 말고 얌전히 당하라고오오오오-!!"
10032010-169 = "……아."
10032010-178 = "자, 잠깐. 하루카……! 사장이 조용하고 은밀하게 처리해야 한다고 했잖아……!"
10032010-180 = "쿠후후……. 생각보다 더 화끈하게 흘러가는데?"
10032010-181 = "이러다가 선생님에게 우리 모습을 들키기라도 하면 큰일……."
10032010-184 = "……어라."
10032010-189 = "으, 으응……?"
10032010-190 = "어……? 선……."
10032010-193 = "……생……님……?"
10032010-194 = "[s13] \"……안녕.\"\n[s14] \"꽤나 화려한 등장들이시네.\""
10032010-197 = "아……. 선생님……?"
10032010-198 = "혹시 전부 다 들었어? 방금 전의 처리 어쩌고 하는 말……?"
10032010-202 = "아차차……."
10032010-203 = "이거, 조금 위기일지도……."
10032010-207 = "하아……. 그러니까 조심해야 한다고 말했는데……."
10032010-208 = "……그래서."
10032010-209 = "결국 들켜버렸는데, 이제 어떻게 하지? 사장."
10032010-210 = "……사장?"
10032010-213 = "……소용없어. 봐. 아루 쨩, 벌써 저렇게 굳어 버렸잖아."
10032010-214 = "아, 아루님! 아루님 어째서……!"
10032010-215 = "어째서냐니……."
10032010-217 = "이 자식들, 가만두지 않겠다!!"
10032010-221 = "감히 우리 보스를 납치하겠다고!? 하룻강아지 범 무서운 줄 모르고……!"
10032010-222 = "전부 연장 챙겨!! 이 녀석들 모두 붙잡아서, 배후를 불 때까지 두들겨 줘야 하니까!!"
10032010-235 = "하, 하룻강아지……!? 하룻강아지라고!? 지금 아루님을 감히 그 따위로 부른 거야!?"
10032010-236 = "……음."
10032010-237 = "선생. 미안하지만……. 아무래도 먼저 해결해야 할 일이 있는 것 같은데."
10032010-238 = "그러게. 어차피 다 들켰고, 일도 이렇게 돼 버렸으니……."
10032010-239 = "혼내는 건 나중에 해주면 안 될까, 선생님? 우선……."
10032010-240 = "[s15] \"응. 이야기는 나중에.\"\n[s16] \"우선 지휘할 테니 들어줘.\""
10032010-243 = "쿠후후. 거래 성립이네."
10032010-244 = "고마워, 선생. 그럼……."
10032010-245 = "……빨리 끝내자."
10032010-249 = "다 죽여드리겠어요오오오오-!!!"
