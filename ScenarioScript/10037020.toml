[translation]
10037020-1 = "제2화;나뉘어진 물이 하나로 모이니."
10037020-3 = "오오……. 여기가……!"
10037020-5 = "산해경이군요!"
10037020-6 = "과연. 조사해 두었던 대로의 느낌이네요."
10037020-7 = "토모에, 토모에! 저기 봐! 저 지붕! 뭔가 신기하게 생겼어!"
10037020-13 = "(저 학생들이 요즘 소문이 자자한……!)"
10037020-14 = "(말로만 들었는데, 정말로 와 버렸을 줄이야……!)"
10037020-18 = "응? 뭔가, 다들 우리를 쳐다보고 있는데?"
10037020-19 = "모두들 체리노 회장님의 위엄에 놀람을 감추지 못하고 있는 것이겠지요! 역시 회장님이십니다!"
10037020-20 = "그, 그런가? 헤헷. 에헤헷."
10037020-22 = "흐음, 이 분위기는……? 과연, 그런 것이로군요."
10037020-23 = "(생각보다는 조금만 더, 다른 방식으로 마음의 준비를 해 두는 것이 좋을지도 모르겠네요.)"
10037020-31 = "문주님께 아뢸 것이 있습니다."
10037020-36 = "붉은겨울 연방학원의 방문자들이, 지금 막 정문에 도달했다는 소식입니다."
10037020-37 = "……그러한가."
10037020-41 = "누차 이야기했던 것이지만, 여기에서 다시 한번 말해 두겠다."
10037020-42 = "금번의 교류회는, 산해경에게 있어서도 붉은겨울에게 있어서도 중요한 의미를 갖게 될 행사일 터."
10037020-43 = "그 맞이와 모심에 있어, 하나의 미숙함도 있어서는 안 될 것이야."
10037020-45 = "명심하겠습니다, 문주님!"
10037020-46 = "저희 역시 이 일의 중대함을, 가슴속 깊이 새기고 있습니다!"
10037020-48 = "……좋다."
10037020-49 = "그러하다면 산해경과 붉은겨울의 교류회를 맞아, 첫 번째 명을 내리겠다."
10037020-54 = "방문객들을 '현룡문의 방식'으로 극진히 모셔라."
10037020-59 = "명을 받들겠습니다, 문주님!"
10037020-60 = "결코 문주님의 이름에, 흠이 가지 않도록 하겠습니다!"
10037020-61 = "[s] (다들 조금 지나치게 긴장하고 있는 것 같은데…….)"
10037020-67 = "시작되었군요. 문주님."
10037020-68 = "그래. 그렇구나."
10037020-69 = "……."
10037020-73 = "선생. 잠시, 이리 가까이 와 다오."
10037020-79 = "(키사키의 말대로, 가까이 다가갔다.)"
10037020-80 = "부탁이 있노라. 선생."
10037020-81 = "조금 전 나간 아이들이…… 어떻게 일을 하고 있는지, 살펴보아 줄 수 있겠는가?"
10037020-82 = "물론 그 아이들을 믿지 못하는 것은 아니지만……."
10037020-83 = "그저, 나의 못난 노파심이라고 생각해 다오."
10037020-84 = "[s] (조용히 고개를 끄덕인다.)"
10037020-89 = "저, 문주님? 시키실 일이 있었다면 선생님이 아닌 저에게 시키셨어도……?"
10037020-90 = "(……미나에게 이런 일을 시켰다가는, 만에 하나의 일이겠지만, 사태를 더욱 키워 버렸을 수도 있었을 터이니…….)"
10037020-91 = "그대에게는 더욱 중요한 일이 있지 아니한가?"
10037020-92 = "네? 더욱 중요한 일이라 하심은……?"
10037020-93 = "현룡문의 문주를 보위하는 일 말이다."
10037020-97 = "……! 그, 그랬습니다! 믿고 맡겨만 주십시오, 문주님! 제가 있는 한, 어느 누구도 문주님께는 손끝 하나 대지 못하도록 하겠습니다!"
10037020-98 = "그래. 언제나 믿고 있다. 의지가 되는구나."
10037020-99 = "문주님……!"
10037020-100 = "(……부디 아무 사고도 나지 않으면 좋으련만…….)"
10037020-109 = "문주님께서는 '현룡문의 방식'으로 극진히 모시라고 하셨어."
10037020-110 = "그렇다면, 역시 그것밖에 없겠지?"
10037020-111 = "물론이지! 달리 뭐가 있을 수 있다는 거야!"
10037020-112 = "후후후……. 각오해라. 진정한 산해경의 방식이 무엇인지, 똑똑히 보여 줄 테니까……!"
10037020-113 = "교류회를 맞이하신 문주님의 첫 명령이다!"
10037020-114 = "절대로 실망시켜 드릴 수 없지! 가자!"
10037020-120 = "취조 기록 : 092-H-8"
10037020-122 = "담당 취조관 : 익명의 현룡문 부원"
10037020-124 = "조사 용의자 : 붉은겨울 연방학원 3학년, 렌카와 체리노"
10037020-129 = "이름은?"
10037020-130 = "아니아니아니, 잠깐만! 마리나는? 토모에는? 모두 어디로 가 버린 거야?"
10037020-131 = "나는 분명 여행…… 아니, 교류회라고 듣고 왔는데?! 그런데 어째서……? 그, 그건가! 쿠데타인가? 함정이었나?!"
10037020-133 = "시끄럽다! 지금 이름을 묻고 있지 않나!"
10037020-134 = "시끄러운 것은 너희들 쪽이다! 이 몸은 붉은 겨울의 학생회장이자, 미화부장이자, 서기장이자 청소부장이자, 체육부장, 청소부장, 선도부장, 급식부장."
10037020-135 = "그리고 이달의 최우수 푸딩 시식가로 선정된 데다 카스텔라 생산 공정을 직접 지휘하는 체리노 님이니까!"
10037020-136 = "……자기소개가 조금 긴 듯하지만, 아무튼 이름을 말했군. 어…… 다시 생각해 보니 소속까지도 술술 늘어놓은 것 같고."
10037020-137 = "그나저나 소속은 또 왜 이렇게 많아……."
10037020-138 = "좋아. 다음으로…… 취미는?"
10037020-139 = "듣자 듣자 하니 무엄하구나! 분명 교류회의 초청장을 보낸 것은 산해경 쪽이었을 터……!"
10037020-140 = "붉은겨울은 이 일을 기억할 것이다! 무슨 일로 이 몸을 이런 곳으로 끌고 온 것이냐!"
10037020-142 = "왜 이런 곳으로 '안내'했느냐고 물었나? 그것은 문주님께서 친히……."
10037020-146 = "'현룡문의 방식'으로 극진히 모시라는 명을 내리셨기 때문이다!"
10037020-147 = "현룡문의 방식이라는 게 도대체 뭔데?!"
10037020-151 = "[ns] (……이거.)"
10037020-153 = "[ns] (완전 망했네……?)"
10037020-156 = "[ns] \"헉, 헉……! 키사키? 키사키 쨩? 지금 좀 큰일 났는데!\""
10037020-157 = "무슨 일인가, 선생? 잠깐……. 선생의 표정과 목소리에서 유추되는 것이 있노라."
10037020-158 = "……무슨 일이 일어나고 있는 것인지, 솔직하게 이야기해 다오."
10037020-161 = "(키사키에게 빠르고 간결하게 지하 취조실에서 목격한 것을 전달했다.)"
10037020-165 = "……하아……."
10037020-166 = "알았다. 수고해 주었구나, 선생. 일단은 이 혼란과 무례를 수습해야 할 터인데……."
10037020-167 = "지금 당장 나의 말을…… 아니, 아니다. 내 손수 그 아이들에게 전해, 명하겠다."
10037020-168 = "방문객들을 '중요한 손님'으로서 모시라고 말이다."
10037020-172 = "……."
10037020-173 = "(크, 큰일 날 뻔했다. 나 같았어도 분명 취조실로 모조리 끌고 갔을 테니까……!)"
10037020-175 = "선생. 잠시, 이리 가까이 와 다오."
10037020-180 = "(키사키의 말대로, 가까이 다가갔다.)"
10037020-181 = "다시, 부탁이 있노라. 선생."
10037020-182 = "[s] (다 알겠다는 듯이, 조용히 고개를 끄덕인다.)"
10037020-183 = "그래……. 그렇구나. 감사를 표하마."
10037020-184 = "이야기가 빠르게 통하는 말벗이란, 진정으로 좋은 것이로구나……."
10037020-188 = "미나."
10037020-193 = "네, 네네네네넷! 문주님?"
10037020-194 = "그대라면…… 조금은, 다르게 대처했겠지?"
10037020-195 = "무무무무무, 물론입니다, 문주님! 제, 제제제제, 제가, 저런 허술한 실수를 할 리가……!"
10037020-196 = "……그래. 그런 것으로 하마."
10037020-201 = "으으으……. 문주님께 조용한 목소리로 혼나고 말았어……."
10037020-202 = "그건 문주님께서 정말로 화나셨다는 뜻이지. 으으으……."
10037020-203 = "그, 그래도! 이번에 제대로 대처하면 너그럽게 넘어가 주신다고 하셨으니까!"
10037020-204 = "맞아! 이러고 있을 때가 아니야!"
10037020-205 = "중요한 손님으로서 모셔라…… 그건 차라리 알기 쉽지!"
10037020-206 = "또다시 실망시켜 드릴 수는 없어! 가자!"
10037020-216 = "취조실도 모자라, 이제는 감옥이야?!"
10037020-221 = "으, 으음……. 이런 장소는, 여러 가지 이유로 저에게는 익숙합니다만……."
10037020-222 = "……어떻게 된 일일까요. 교류회 요청 자체가 혹시 처음부터 우리들을 함정에 빠트리기 위한 술책이었다는 것일까요?"
10037020-223 = "이것이 산해경의 검은 군주의 모략……?"
10037020-225 = "시끄럽다! 무슨 음모를 가지고 산해경에 발을 들였는지 자백하는 것이 좋을 것이다!"
10037020-226 = "그렇게 하지 않는다면……!"
10037020-232 = "헉……?! 설마, 그것은?!"
10037020-233 = "왜, 왜 그러는 것인가. 마리나 위원장?"
10037020-235 = "아무리 먼 곳에서 온 붉은겨울의 방문자들이라고 해도…… 이 동물이 무엇인지는 알고 있겠지!"
10037020-236 = "그렇다. 우리 산해경의 명물, 판다다!"
10037020-237 = "너희들이 순순히 음모를 이야기하지 않는다면……."
10037020-238 = "이 아기 판다가 맛있게 먹고 있는 죽순을, 이 자리에서 빼앗아 버리겠다!"
10037020-243 = "그, 그 무슨 사악한……! 아기 판다에게는 죄가 없잖아! 놓아줘!"
10037020-244 = "판다를…… 곰을…… 그것도 아기를 괴롭히다니! 너희들의 피는 무슨 색이냐–!"
10037020-246 = "그게 싫다면 어서 음모를 털어놓으라고! 후후후…… 이렇게, 맛있게 먹고 있는 죽순을 약간 잡아당기는 것만으로도……!"
10037020-251 = "뀨우우–?!"
10037020-252 = "싫어어어어어어어어–!"
10037020-256 = "[ns] (또 망했는데!?)"
10037020-264 = "무, 문주님?!"
10037020-265 = "[s1] \"안 돼, 키사키! 키사키 쨩! 정신 차려야 해!\"\n[s2] \"교류회는 이제 막 시작되었을 뿐이라고!\""
10037020-270 = "……그래. 그랬지. 시의적절한 조언이었다. 선생."
10037020-271 = "미나."
10037020-272 = "네, 넷! 문주님!"
10037020-273 = "가서 직접 전해라. 붉은겨울의 방문객들을…… '현룡문의 문주를 모시듯 모시라'고."
10037020-274 = "그, 그 말씀은……!?"
10037020-275 = "어서. 시간이 없다."
10037020-279 = "신속하게 받들겠습니다!"
10037020-283 = "……한 가지, 묻고 싶은 것이 있다. 선생."
10037020-284 = "[s] \"……응. 뭐든지 물어봐.\""
10037020-285 = "내가…… 말을 잘 못하는 편인가?"
10037020-286 = "명을 정확하고 올바르게 내리지 못하는 것인가?"
10037020-287 = "[s] \"그건 아니라고 생각해…….\""
10037020-288 = "그렇다면 도대체 왜 우리 학생들은 매번 이러는 것인가……. 선생은 그 이유를 알고 있는가?"
10037020-289 = "[s] \"…….\""
10037020-290 = "부탁이다……."
10037020-291 = "제발 말 좀 들어라. 잘 좀……."
10037020-295 = "도대체 뭐야! 교류회라는 소식을 듣고 왔더니…… 산해경 녀석들……!"
10037020-296 = "자, 자. 진정해요. 체리노 쨩……. 아니, 체리노 서기장님. 대범함과 관대함을 보이셔야죠."
10037020-297 = "아무래도 이런저런 '사소한' 오해들이 있었던 모양이고, 지금은 오해들이 풀린 모양이니까요."
10037020-299 = "그것을 사소하다고 표현하는 겁니까, 토모에 비서실장님……."
10037020-300 = "무엇보다 판다를…… 그것도 아기 판다를 그렇게나 냉혹하게……!"
10037020-301 = "후훗. 표현에는 여러 가지 의미가 내포되기 마련이니까요."
10037020-302 = "거기에 이 오해에 대한 영수증은, 나중에 어떤 식으로든 청구할 수 있을 것 같기도 하고요."
10037020-307 = "일단은 산해경의 현룡문에서 사과의 뜻으로 제공해 준 것들을, 즐겨 보기로 하죠."
10037020-308 = "확실히, 우리가 입고 온 붉은겨울의 제복은 여기선 조금 덥기는 했지."
10037020-312 = "자아, 팔 들어 보세요. 체리노 쨩?"
10037020-322 = "붉은겨울의 방문객들께서 육화각에 오르십니다!"
10037020-323 = "모두, 진심으로 환영의 뜻을 담아 붉은겨울의 방문객들을 맞이하십시오!"
10037020-333 = "으으……. 이, 이것으로 좋은가……? 무엇보다 어깨가…… 다리가……!"
10037020-338 = "[ns] \"누구…… 세요?!\""
10037020-342 = "서, 선생이 왜 여기에……! 그보다 나를 알아보지 못하는 건가?! 선생도 이곳에서 무언가 큰 일을 당한 것인가??!!"
10037020-343 = "[s] \"아니, 그런 의미가 아니었는데?!\""
10037020-344 = "뭣……?! 너무 어울려서, 다른 사람인 줄 알았다고……? 에에이, 말을 지나치게 돌려서 하지 말라고! 헷갈리잖나!"
10037020-345 = "자, 자. 마리나 위원장. 그것은 선생님 방식의 칭찬이었어요."
10037020-346 = "[s3] \"……토모에는, 뭐라고 해야 하나…….\"\n[s4] \"원래부터 그 옷이었다는 느낌이 들 만큼 어울려!\""
10037020-349 = "어머나. 감사합니다. 선생님."
10037020-350 = "후후. 예전부터 눈여겨보고는 있었습니다만, 시의적절한 말씀을 때 맞춰 하신다는 점에서, 선생님께서도 훌륭한 선동의 자질을 가지고 계신단 말이죠?"
10037020-351 = "[s] \"안 합니다…….\""
10037020-356 = "으으음……! 왠지 모르게 샘이 나는군……! 콤라드! 이 몸도 여기에 있단 말이다!"
10037020-357 = "[s5] \"와, 정말 딱 맞네, 체리노!\"\n[s6] \"특히 그 땋은 머리와 겉옷이!\""
10037020-360 = "그, 그런가? 헤헤헷……. 역시 콤라드는 보는 눈이 있군!"
10037020-364 = "어? 콧수염은 어디로 갔냐고……? 뭐, 뭐라?! 토모에!"
10037020-370 = "……아무 일도 없었다. 그렇지, 토모에?"
10037020-371 = "그렇습니다, 서기장님."
10037020-376 = "(……저 가짜 콧수염은, 붉은겨울의 문화인 것인가……?)"
10037020-377 = "(다행이로다. 교류회를 열기로 한 것은 옳은 결정인 듯하구나. 이토록 견문을 넓힐 일이 많으니.)"
10037020-379 = "산해경에 방문한 것을 환영하노라."
10037020-387 = "또한 초청을 받아들여 준 것에 대해 감사를 표하겠다. 붉은겨울의 체리노 서기장. 토모에 비서실장. 마리나 위원장."
10037020-388 = "나는 산해경의 학생회에 해당하는, 현룡문의 문주를 맡고 있는 류우게 키사키라고 한다."
10037020-390 = "처음 뵙겠습니다. 키사키 문주님."
10037020-394 = "자, 체리노 쨩? 위엄을 보일 시간이에요. 사전에 알려 드린…… 아뇨, 연습하신 대로……."
10037020-395 = "그, 그런가?! 조, 좋아……!"
10037020-400 = "성대한 환영에 감사를 표하지, 키사키 문주."
10037020-401 = "내가 바로 붉은 겨울의 학생회장이자, 미화부장이자, 서기장이자 청소부장이자, 체육부장, 청소부장, 선도부장, 급식부장."
10037020-403 = "그리고 이달의 최우수 푸딩 시식가로 선정된 데다 카스텔라 생산 공정을 직접 지휘하는 체리노 님이다!"
10037020-408 = "(듣는 이의 혼을 빼앗아 가 버릴 만큼 장황한 자기소개…… 는 그렇다 쳐도, '성대한 환영'인가……. 그 빚을 결코 잊지 않겠다는 뜻이로구나.)"
10037020-409 = "(어쩔 수 없지. 빌미를 제공한 것은 우리 쪽이었으니.)"
10037020-410 = "(기세 싸움은 이미 시작되었구나. 알고는 있었으나, 얕볼 수 없는 자로다. 체리노 서기장.)"
10037020-412 = "어때, 어때? 토모에? 나 안 틀리고 잘했지?"
10037020-413 = "잘했어요, 체리노 쨩. 위엄을 제대로 보였네요."
