[translation]
1002820-1 = "토끼 꼬리 소동"
1002820-2 = "(약속 장소도 정하지 않은 아스나를 찾아 밀레니엄으로 향했다.)"
1002820-3 = "야호~! 주인님! 여기야, 여기~!!"
1002820-4 = "(광장에 도착하자마자, 멀리서 주변의 눈길을 한 몸에 받고 있던 아스나를 발견했다.)"
1002820-5 = "기다리고 있었어, 주인님!! 아스나를 찾아온 거지? 그런 거지?"
1002820-6 = "주인님 표정만 봐도 알 수 있다고! 아스나 기뻐!!"
1002820-7 = "……응?"
1002820-8 = "무슨 일로 불렀냐고?"
1002820-9 = "흐으음~. 뭐였더라?"
1002820-10 = "……음! 잊어버렸어!! 별로 중요한 일은 아니었던 것 같기도?"
1002820-11 = "[s1] \"으, 응. 별일 없는 거 같아 차라리 안심이다만…….\"\n[s2] \"언제나의 아스나 쨩이구나. ……다행이야.\""
1002820-12 = "아하하하하!! 뭐야, 그게? 주인님 반응은 항상 재미있네!!"
1002820-13 = "아하하하하!! 뭐야, 그게? 주인님 반응은 항상 재미있네!!"
1002820-14 = "……응? 이 복장? 간만인데, 또 입은 이유가 있냐고?"
1002820-15 = "글쎄? 그냥 특별한 이유가 있어서 입은 건 아닌데? 입어보고 싶은 생각이 들어서 입어 봤지."
1002820-16 = "어차피 아스나의 옷이잖아? 그치? 주인님이야말로 그건 갑자기 왜 물어보는 거야?"
1002820-17 = "꼬리? 아아, 뒤에 이거? 수류탄으로 쓰는 걸 본 적이 있었다고?"
1002820-18 = "응응! 그런 적 있지! 여기서 뽑아 던지면, 사람들이 깜짝 놀란다고. 재밌는 반응이야."
1002820-19 = "……응? 지금도 수류탄이냐고?"
1002820-23 = "흐응~. 글쎄? 어떨까? 주인님은 어떤 쪽이라고 생각해?"
1002820-24 = "뭣하면 지금 여기서……. 한번 확인해 볼래?"
1002820-29 = "……오옷!!"
1002820-30 = "아하하하!! 아쉽네! 주인님~ 아스나의 꼬리를 낚아채려 한 거야? 안돼, 안 돼! 확인하기 전에 맞춰야지~."
1002820-31 = "아니면 뭐야? 혹시 술래잡기? 주인님이 술래인 거야!?"
1002820-32 = "좋아, 아스나는 도망칠게! 쫓아와 보라구~!!"
1002820-37 = "(손에 고리 모양의 핀이 남아 있다…….)"
1002820-41 = "[ns] \"………….\""
1002820-43 = "[ns3] \"아, 안전핀이……!?!?\"\n[ns4] \"아스나!! 아스나 잠깐만!! 멈춰!!\""
1002820-47 = "아하하하! 주인님 느려~! 아스나는 재빠른 토끼입니다!!"
1002820-52 = "(이후 필사적으로 아스나를 쫓아다녔지만, 결국 따라잡지 못하고 체력이 다해 쓰러졌다.)"
1002820-54 = "(숨을 헐떡이며 바닥에 쓰러져 있자 잠시 후 아스나가 먼저 찾아왔다.)"
1002820-55 = "주인님, 뭐해~? 벌써 지친 거야? 이제 술래잡기는 끝?"
1002820-56 = "……어라? 주인님, 표정이 왜……."
1002820-57 = "……응? 뭐라고?"
1002820-58 = "수류탄……?"
1002820-59 = "지금 수류탄 안 들고 있는데?"
1002820-60 = "……주인님? 왜 그런 표정을 짓고 있는 거야?"
1002820-61 = "이건 그냥 토끼 꼬리라구?"
1002820-62 = "[s5] \"……?? 수류탄이…… 아니라고…?\"\n[s6] \"그렇지만 분명 안전핀이…….\""
1002820-63 = "……안전핀? ……무슨 안전핀?"
1002820-64 = "……안전핀? ……무슨 안전핀?"
1002820-65 = "……어라? 그건 내 열쇠고리잖아?"
1002820-66 = "주인님, 설마…… 열쇠고리를 안전핀이라고 생각한 거야?"
1002820-70 = "……풉!!"
1002820-71 = "푸하하하!! 주인님도 참 생각이 별나다니까!! 정말 아스나를 늘 재밌게 해주네!!"
1002820-72 = "응? 정말이냐고? 진짜 안전한 거냐고?"
1002820-73 = "물론이지! 아스나가 주인님께 거짓말한 적은 없지 않아?"
1002820-74 = "……응?"
1002820-75 = "그래도 여기까지 왔으니, 직접 확인하지 않으면 억울할 거 같다고? 아하하하! 그게 뭐야~."
1002820-76 = "흐응~. 음~. 그러면 어떻게 할까~. 아스나 고민!"
1002820-77 = "……음! 좋아~."
1002820-78 = "그럼 오늘은 아스나랑 열심히 놀아준 주인님을 위해, 아스나가 특별히! 토끼의 꼬리를 만지게 해줄게!!"
1002820-85 = "자, 자. 주인님, 아스나의 꼬리입니다~. 만져 보도록 해. 진짜 꼬리지? 그렇지?"
1002820-86 = "아하하!! 그만! 그만해, 주인님! 간지러워~!!"
1002820-87 = "[s7] \"휴우……. 응……. 진짜 그냥 꼬리구나…….\"\n[s8] 한숨을 쏟아낸 뒤 쓰러진다."
1002820-93 = "……응? 주인님?"
1002820-94 = "주인님?"
1002820-95 = "자는 거야, 주인님??"
1002820-99 = "……응!"
1002820-100 = "그럼 나도 옆에서 좀 자야지!!"
1002820-105 = "(이후 체력이 회복돼 다시 깨어났을 땐 캠퍼스 한복판에서 아스나와 나란히 누워 있었다.)"
1002820-109 = "(주변에서 범상치 않은 시선들이 느껴져 얼른 아스나를 깨워 자리를 빠져나갔다…….)"
