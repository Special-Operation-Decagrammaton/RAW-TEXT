[translation]
10011085-4 = "선생님의 지휘가 있으면…… 여기까지 싸울 수, 있단 건가요……?"
10011085-5 = "하지만 여러분, 어째서 그렇게까지 하는 건가요?"
10011085-6 = "정식 동아리가 되는 방법은. 공연 이외에도 얼마든지."
10011085-7 = "답은 간단해요."
10011085-11 = "저는 부장님이 결정한 걸 따르고 싶을 뿐이에요."
10011085-15 = "부장님이 어떤 생각을 하건 간에, 저도."
10011085-16 = "네! 이즈나도 그래요!"
10011085-17 = "네! 저희는 부장님이 결정한 걸 따를 뿐이에요. 왜냐하면-"
10011085-21 = "우리는 <인법연구부>니까!"
10011085-22 = "……!"
10011085-23 = "그야…… 이런 저라도…… 보인다구요!"
10011085-24 = "평소에도! 부장님이 어떤 생각을 하시는지……!"
10011085-27 = "얄팍하고, 욕심 많고, 허세도 많고."
10011085-28 = "어쩔 수 없는 사람이라는 생각을 많이 해요."
10011085-29 = "언제나…… 언제나… 대책도 없고!"
10011085-31 = "그래도 닌자를 좋아해서,"
10011085-32 = "어떻게든 저희를 위해 노력하려는 것도 전부……!"
10011085-36 = "바로 그런 부장님이기 때문에……!"
10011085-41 = "츠쿠요라고 했었지?"
10011085-42 = "너- 키 무진장 크네-"
10011085-43 = "!!"
10011085-44 = "아, 그, 그게, 그러니까. 전……!"
10011085-45 = "그건 닌자로서 최강이란 소리잖아!"
10011085-46 = "혹시 괜찮다면-"
10011085-50 = "어때? 내가 만든 최강의 동아리! 인법연구부에 들어오지 않을래?"
10011085-56 = "좋아하고! 존경하고 있는 거니까!"
10011085-57 = "그러니 부장님의 결정을 따르겠어요! 공연을 성공시키고! 정식 동아리가 되겠어요!"
10011085-58 = "이부키 공과의 약속을! 반드시 관철하는 거예요!"
10011085-59 = "네! 그것이- 닌자니까!"
10011085-60 = "……그렇죠? 부장님?"
10011085-62 = "츠쿠요- 나는……!"
10011085-63 = "그것이 닌자……라고……"
10011085-71 = "[ns] \"……응? 이 소리는…….\""
10011085-78 = "모두 무사하신가요?"
10011085-79 = "[s] \"이로하?!\""
10011085-80 = "응! 닌자 저택 안에서 헤매고 있길래! 데려왔어!"
10011085-81 = "그런데 저택 밖으로 나오자마자 어쩐지 탱크가 있는데 말이야! 또 그걸 타고 가자고 해서~ 그게-!"
10011085-82 = "……저택 안에서 길을 헤매면서 빙글빙글 돌다가 깨달았어요."
10011085-83 = "뭘 순진하게, 그리고 정직하게 두 다리로 뛰고 있었던 건지. 차라리 처음부터 이랬으면 좋았을 것을."
10011085-84 = "……이대로 추격전이 흐지부지되도록 내버려 두지 않겠어요. 이부키는 제 손으로 구하겠어요."
10011085-85 = "추격전, 아직 다들 포기하지 않은 거죠?"
10011085-86 = "자, 잠시만요?!"
10011085-90 = "부장님!"
10011085-91 = "부장!"
10011085-95 = "[s] \"미치루.\""
10011085-102 = "……으아아앗! 나, 나도 모르겠다! 좋아! 가자고!"
