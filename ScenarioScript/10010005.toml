[translation]
10010005-1 = "프롤로그;경전 이송 작전!"
10010005-12 = "와 주셔서 정말로 감사합니다, 선생님. 갑작스러운 부탁이었는데도……."
10010005-13 = "그치만 덕분에 안심했어요! 선생님께서 와주신다면 저희에게도 큰 영광인 거라……."
10010005-14 = "[s1] \"나는 괜찮아. 신경 쓰지 마.\"\n[s2] \"괜찮아. 그보다 무슨 일이 있는 거야?\""
10010005-15 = "그, 그게 말이죠……."
10010005-16 = "그, 그게 말이죠……."
10010005-17 = "일단 이걸 보여 드릴게요."
10010005-23 = "[ns3] \"나무 상자 안에 책이 들었어……?\"\n[ns4] \"오래된 책이구나. 유물 같은 거야?\""
10010005-24 = "네. 맞아요. 이번에 트리니티 발굴지구에서 새롭게 발견된……. 아주 중요한 역사적인 경전이에요."
10010005-25 = "네. 맞아요. 이번에 트리니티 발굴지구에서 새롭게 발견된……. 아주 중요한 역사적인 경전이에요."
10010005-26 = "이 책 때문에 신 퀴니섹스툼 공의회에서 선포된 규범이 새로운 해석이 가능해졌다고 하더라고요."
10010005-27 = "이제 시스터들의 경전 학습 과정이 바뀌어야 할지도 모를 정도로…… 엄청난 대발견인 거죠."
10010005-28 = "[s] \"……그러니까, 좋은 거지?\""
10010005-29 = "네? 네! 맞아요. 죄송해요, 제가 설명이 부족했네요."
10010005-30 = "엄청 좋은 소식인 거죠. 시스터후드 뿐만 아니라, 트리니티 학원에도."
10010005-31 = "아, 아무튼 이 책이 발견되어서 학원 전체가 마치 축제가 벌어진 것 같은 분위기예요."
10010005-32 = "책의 발견을 축하하는 공식적인 채플 행사도 있을 예정이고, 거기서 사쿠라코 님이 이 경전의 초반 부분을 강독하실 예정이기도 해서……."
10010005-40 = "사쿠라코 님의 고대어 발음을 들어보셨나요? 정말로 아름답답니다. 후후."
10010005-46 = "트리니티의 다른 학생들을 초대하는 행사이니만큼, 저희 시스터들도 이 행사를 망치지 않기 위해 이리저리 노력하고 있고……."
10010005-48 = "그래서 선생님께도 그 행사에 참석해서 자리를 빛내 주셨으면 해서…… 그래서 초대를 드리게 되었어요."
10010005-49 = "초대에 응해주셔서 감사합니다. 선생님."
10010005-50 = "[s] \"그런 거라면 얼마든지 참석해야지.\""
10010005-51 = "네. 채플 행사장도 트리니티 외곽의 오래된 성당에서 하기로 했거든요. 트리니티 학생분들도 수백 명이나 참석할 수 있는 큰 공간이고……."
10010005-52 = "오래된 경전을, 오래된 고성당 유적지에서……. 그런 느낌……?"
10010005-57 = "저는 이 경전을 보관하고 있다가, 행사 전까지 그 고성당 유적에 가져다 두는 중요한 역할을 맡은 거예요."
10010005-61 = "……어라?"
10010005-62 = "오랫동안 안 열어서 먼지가……."
10010005-63 = "뭐, 먼지야 금방 털어내면 되죠. 이렇게 탁탁 흔들면……."
10010005-70 = "……?"
10010005-71 = "……어……."
10010005-72 = "[s5] \"……산산조각 났는데요…….\"\n[s6] \"페이지 단위로 분해됐다…….\""
10010005-78 = "꺄아아아아앗-!?!?"
10010005-79 = "무, 무무, 무무, 무슨……. 무슨 일이……!! 이게 무슨……!!"
10010005-80 = "[s7] \"지, 진정해. 히나타!!\"\n[s8] \"우선 진정하고 상황을……!\""
10010005-81 = "아, 아니에요! 아, 아직! 아직 괜찮아요! 아직 종이가 그저 다 분해돼서 떨어졌을 뿐이잖아요!?"
10010005-82 = "아, 아니에요! 아, 아직! 아직 괜찮아요! 아직 종이가 그저 다 분해돼서 떨어졌을 뿐이잖아요!?"
10010005-83 = "다, 다시……! 다시 주워서 붙여 놓으면……!"
10010005-91 = "이렇게 다시 잡아서……!"
10010005-97 = "부, 부서졌다!! 어, 어째서!? 종이가 부서졌다고요……!?"
10010005-98 = "어째서 잡는 대로 종이들이 다 부서지는 거죠!? 조, 종이잖아요!! 찌그러지는 것도 아니고 왜……!?"
10010005-99 = "네, 네……!? 오래돼서 그럴 수도 있다고요!? 아, 아니에요! 아니라고요! 그럴 수 있을 리 없어요!"
10010005-100 = "히, 히이이익! 손에 붙었어!! 손의 땀 때문에 잉크가 번지고 있어요!!"
10010005-101 = "이, 일단 모아서……. 어떻게든 모아서……!! 손으로 긁어모아서……!"
10010005-108 = "어, 어째선지 바닥의 쓰레기 모으는 느낌으로 변해가고 있는 거 같지만……! 그래도……!"
10010005-112 = "으, 으으……!! 으으으……!?"
10010005-118 = "……."
10010005-119 = "[ns] \"…….\""
10010005-120 = "……그……."
10010005-121 = "……음……. 어……."
10010005-122 = "서, 선생님……."
10010005-127 = "……어쩌죠? 이제……."
