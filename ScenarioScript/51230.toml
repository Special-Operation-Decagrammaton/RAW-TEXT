[translation]
51230-1 = "제23화;꾸며낸 거짓말"
51230-7 = "선생님……! 저쪽에 쓰러져 있는 사람이……!"
51230-10 = "[ns] \"유카리?!\""
51230-20 = "[ns] \"큭……! 여기에도 괴물들이……!\""
51230-23 = "여기까지 쫓아온 건가요. 샬레의 선생님과……… 나구사."
51230-25 = "슈로……."
51230-26 = "[s] \"……슈로, 횡포는 거기까지야.\""
51230-30 = "유카리를 돌려받겠어."
51230-35 = "……하."
51230-36 = "아핫."
51230-37 = "아하하하하하핫!!"
51230-41 = "진짜, 짜증 나."
51230-47 = "그러고 보면…… 풍문으로 들어본 적이 있어요."
51230-48 = "샬레의 선생이란 사람은, 어떤 일이든 해결해 주는 사람."
51230-49 = "이곳 키보토스에서 벌어지는 일들이라면, 그 무엇이든 사사건건 머리를 들이미는─── 천하의 얼간이라고."
51230-50 = "그 결과…… 샬레의 선생님과, 나구사 쨩까지 유카리를 구하겠다. 그런 마음으로 달려왔다. 이건가요?"
51230-51 = "저의 <백물어>는 이제 마침표만 찍으면 완성이 되는 단계까지 왔어요."
51230-52 = "그런데, 여기서 날 방해하려고 하다니. 웃기네요. 정말 짜증 날 정도로 웃겨요."
51230-53 = "샬레의 선생. 당신이란 작자도 그렇지만…… 특히나 웃기는 쪽은……"
51230-57 = "나구사 쨩. 당신이에요."
51230-59 = "……읏!!"
51230-61 = "다른 누구도 아닌 네 녀석이 말하는 건가요? 유카리를 돌려달라고?"
51230-62 = "그 말은…… 설마 지금 당신은 여기 있는 무녀님을 구하겠다는 생각을 하고 왔다는 건가요? 네? 나구사 쨩?"
51230-63 = "어쩜 그런 말을 아무렇지 않게 할 수 있는 건가요?"
51230-64 = "혹시 동료들이 등을 떠밀어줬나요?"
51230-65 = "무녀님을 구할 사람은 당신밖에 없다며, 힘이 나는 말로 응원을 해줬던가요?"
51230-66 = "………그렇다면 그거참 이상하네요. 다들 모르고 있나 봐요?"
51230-67 = "정작 네놈이, 이미 [ruby=・]아[/ruby][ruby=・]야[/ruby][ruby=・]메[/ruby][ruby=・]는[/ruby] [ruby=・]구[/ruby][ruby=・]할[/ruby] [ruby=・]수[/ruby][ruby=・]도[/ruby] [ruby=・]없[/ruby][ruby=・]었[/ruby][ruby=・]던[/ruby] [ruby=・]얼[/ruby][ruby=・]간[/ruby][ruby=・]이[/ruby]란 사실을 말이에요."
51230-72 = "아…… 알겠다. 여전히 모두에게 전부 밝히지 않은 거죠?"
51230-73 = "그때 대설원에서 어떤 일이 있었는지. 그 진실에 대해서."
51230-74 = "[s] \"나구사, 들을 필요 따윈 없어.\""
51230-75 = "아뇨. 들을 필요 있어요. 오히려 선생님은 듣는 쪽이 좋을걸요?"
51230-76 = "지금 당신 옆에 서서 제 잘난 듯이, 마치 소중한 후배를 구하겠다는 듯이 달려온 나구사 쨩이."
51230-77 = "실은 그럴 생각도, 실력도, 아무것도 없는 거짓말쟁이라는 건. 알고 있는 쪽이 좋지 않겠어요?"
51230-83 = "아직도 기억하고 있어요. 나구사 쨩."
51230-86 = "그 손. 아야메에게 닿지 못했잖아요?"
51230-87 = "애당초 나구사 쨩은, 그런 깜냥을 가진 이가 아니었으니까."
51230-89 = "그저 아야메를 따라 할 뿐인 따라쟁이. 아야메의 곁에 있던 나머지, 스스로가 아야메에게 어울리는 우등생이라 착각한 얼간이."
51230-91 = "그래서 그 결과가 어쨌더라?"
51230-92 = "아, 맞다. 그 오른팔이었죠?"
51230-93 = "…………그만."
51230-94 = "그 팔, 움직일 수 없잖아요? 다 알고 있어요. 아야메에게 뻗으려다 거절당한 오른팔은, 진즉 황혼에 잡아 먹혔으니까."
51230-95 = "호기롭게 소중한 소꿉친구를 구하겠다고 달려들었다가, 무서워진 나머지 눈앞에서 아야메를 구하기를 포기했으니까."
51230-96 = "아니야. 나는……."
51230-101 = "아직도 기억해요. 그때 황혼에 잠겨 들어가던 아야메가."
51230-102 = "백물어가 되어버린 아야메가 당신을 향해 했던 말이."
51230-103 = "분명 그때, 아야메는 이렇게 말했었죠."
51230-104 = "그만……!"
51230-106 = "<나구사, 나는 처음부터 널 친구라고 생각해 본 적도 없었어.> 라고."
51230-112 = "네, 실로 통쾌한 말이었어요."
51230-113 = "아무것도 못 하는 얼간이 나구사 쨩이 보여준 추태에, 한순간 기대심을 품었지만 결국엔 실망해버린 그녀가 쏘아붙인 말."
51230-114 = "아아, 그때의 아야메가 어떤 심정이었을지. 절절히 이해가 되어요. 그도 그럴 게……"
51230-115 = "애당초 구하러 온 것이 네놈이 아니었다면."
51230-116 = "좀 더 제대로 된 인간이었으면…… 비극을 막을 수 있었을지도 모르는데."
51230-117 = "그렇게 생각하지 않나요?"
51230-119 = "[ns] \"슈로……!\""
51230-123 = "제 이야기를 방해하지 말아 주세요. 저, 괴담가 야부키 슈로가 이야기를 하고 있잖아요."
51230-135 = "[ns] \"크, 윽, 으읍?!\""
51230-136 = "제아무리 샬레의 선생일지라도, 백물어들에게 제압된 상태에서는 입도 벙긋 못하겠죠."
51230-137 = "그 입, 닥치고 있으라고요. 샬레의 선생님."
51230-139 = "선생님……!"
51230-140 = "따지고 보면 처음부터 이 모든 비극은, 나구사 당신이 있었기에 벌어진 일이에요."
51230-141 = "제 말이 너무하다고 생각하시나요? 비약이라고 생각하시나요?"
51230-142 = "그렇다면 증거를 보여드릴게요."
51230-144 = "저의 괴서를 통해, 당신에게."
51230-160 = "(기대에 부응하는 것이 당연하고.)"
51230-161 = "(기대감에 답하는 것이 마땅하며.)"
51230-162 = "(기대 어린 눈빛에 미소 짓는 것이 자연했다.)"
51230-165 = "그 이름은 카데노코지 유카리."
51230-166 = "백귀야행에서도 명문으로 이름 높은 카데노코지의 여식."
51230-167 = "카데노코지로서 올곧게 있어라."
51230-168 = "그것이 제가 따라야 할 사명이자 의무."
51230-169 = "…………알고 있사와요."
51230-170 = "그것이 제가 해야만 하는 일이라는 것은."
51230-175 = "하지만."
51230-176 = "나구사 선배와 만난 그때."
51230-177 = "저는 처음으로 해야만 하는 일이 아닌, 하고 싶은 일이 있다는 걸 알게 되었사와요."
51230-181 = "네, 저는 백화요란이 되고 싶사와요!"
51230-188 = "아니야…… 유카리."
51230-189 = "나는, 네가 생각하는 것처럼…… 대단한 사람이 아니야."
51230-194 = "나는…… 단지, 진짜가 될 수 없는 거짓을……"
51230-195 = "모두를 속이기 위한 가면을 쓰고 있었을 뿐이야……."
51230-200 = "전부. 거짓말에 불과했을 뿐인데……."
51230-211 = "내가, 여기 있었기에."
51230-212 = "아야메의 곁에 서기 위해 <나구사>라는 소녀를 연기하고 거짓말을 반복해 온 끝에……."
51230-213 = "유카리까지 백화요란이 되고자 생각해 버린 까닭에…… 그래서……."
51230-215 = "맞아요. 나구사 쨩. 이제야 좀 알겠나요? 나구사 쨩이 손을 뻗은 모든 것은 망가지는 거예요."
51230-216 = "전부가 네놈 탓. 아야메가 황혼에 떨어진 것도, 유카리가 백물어가 된 것도 전부."
51230-221 = "이건 전부 네놈이 자신의 분수도 모르고 아야메의 곁에 서려고 했기에 벌어진 일."
51230-222 = "자기에게 어울리지도 않는 <역할>을 연기하려고 했기에 벌어진 비극."
51230-223 = "그걸 알아두라고요."
51230-225 = "모든 일은……… 나 때문에………. 내가, 거짓된 <가면>을 쓴 까닭에…… 전부………"
51230-226 = "내가. 망가트리고야 말았어."
51230-227 = "나 때문에 전부……."
51230-229 = "[ns] \"………! ……나, 구사!\""
51230-230 = "흥. 다들 나구사도 제압해 두도록 하세요."
51230-239 = "[ns] \"………!!!\""
51230-241 = "딱 좋아요."
51230-242 = "마음이 꺾인 인간은, 그 자체로 괴담으로 승화하기 좋으니까."
51230-243 = "나구사 쨩, 당신도 제가 귀엽게 다뤄드릴게요. 기대하라구요."
51230-244 = "하아……"
51230-245 = "드디어, 마침내 끝났나요."
51230-248 = "후후, 아하, 아하하핫."
51230-249 = "그래요. 그거면 충분해요."
51230-250 = "분수를 알고. 이해해 주면 충분하다고요."
51230-251 = "모든 것은 전부 저의 의도대로."
51230-254 = "반목하게 만들고, 싸우게 만들기 위해 필요했던 모든 재료들."
51230-255 = "거기엔, 그 대단하다는 샬레의 선생까지 저의 수단으로, 장기말로 이용했어요."
51230-259 = "아아, 보세요. 코쿠리코 님. 제가 만들어 낸 <백물어>를……"
51230-260 = "자아, 전부 부서져 버려. 서로를 헐뜯고 욕하고 비방하고 모략하고…… 끝내 칼끝을 겨눠 망가지면 되는 거야."
51230-262 = "이로써 저는 백귀야행을 불태우는 <백물어>를, 아름다운 풍류를 완성했어요. 코쿠리코 님."
51230-266 = "자, 이다음엔 카타시로를 만들어 낸 무녀님 쪽을 회수하면……."
51230-271 = "[ns] \"………!!!\""
51230-273 = "윽?!"
51230-282 = "상처투성이가 되어가면서까지 환량백물어들을 밀쳐내고 어디로 달려가는가 싶었더니……."
51230-283 = "빈틈을 타 유카리를 구해내면 무언가 상황을 반전시킬 수 있다고 생각한 건가요?"
51230-284 = "───착각도 적당히 해야지."
51230-285 = "알고 있어요. 샬레의 선생은 우리들과 달리, 손짓 한 번으로 바닥을 나뒹구는 약하기 짝이 없는 존재라는 걸."
51230-287 = "[ns] \"……!\""
51230-292 = "그러니까 소용없다고!"
51230-298 = "하아? 지금 무슨 짓을 하는 건가요?"
51230-299 = "혹시 어디 고장 나기라도 한 건가요?"
51230-300 = "그렇게까지 해서 유카리를 구하고 싶다는 건가요?"
51230-302 = "[ns] \"………하압!\""
51230-309 = "……이해가 안 돼."
51230-310 = "당신도 알고 있잖아요?"
51230-311 = "지금 저기, 축제의 거리에서 날뛰는 저 괴물 <얼굴 없는 카타시로>를 태어나게 한 것이 바로 유카리란 것을."
51230-312 = "모두를 미워하고 불태우고, 전부 내던지고 싶다고 생각한 장본인."
51230-313 = "그래요. 당신이 대견하다고 생각했던 백화요란의 1학년생은 처음부터 없었어요."
51230-314 = "유카리조차도 자신의 편의를 위해, 당신을 속이고서…… 백화요란을 되돌리고자 하는 기특한 학생을 연기했을 뿐."
51230-315 = "전부 다 거짓말에 거짓말에 거짓말을 한 인간들뿐."
51230-316 = "가련한 히로인도 뭣도 아닌 그것을, 그렇게 바닥에 내팽개쳐지면서까지. 왜 당신은 구하려고 하는 건가요?"
51230-317 = "그런 아무런 가치도 없는 거짓부렁 따위를 왜……!"
51230-318 = "[s1] \"……그래. 누군가는 거짓말을 했을지도 몰라.\"\n[s2] \"속내가 들키는 게 무서워,\"\n[s3] \"겉을 꾸민 채 위선적인 모습을 연기했을지도 몰라.\""
51230-322 = "잘 알고 계시잖아요."
51230-323 = "맞아요! 전부 다 거짓말. 진심 따윈 속에 꽁꽁 숨긴 채! 구역질 나는 거짓말만 반복해 오고 있는데!"
51230-324 = "[s] \"……응, 그건 그렇지만.\""
51230-326 = "[ns] \"딱히 상관없잖아?\""
51230-330 = "………네?"
51230-331 = "[s4] \"거짓말을 하고, 위선을 떨고,\"\n[s5] \"거짓된 자신을 연기하는 게 뭐, 어때서?\""
51230-334 = "당신, 무슨 말을……"
51230-335 = "[ns] \"그런 건 정말로, 단순하게 말하자면…….\""
51230-339 = "[ns] \"누구에게나 있는, 평범한 일이잖아.\""
51230-341 = "……………………………………………………………하아?"
51230-348 = "다음화;평범한 일"
