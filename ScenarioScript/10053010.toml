[translation]
10053010-1 = "제1화;오해와 오해"
10053010-2 = "그동안 빌어먹게 신세 많이 졌슴다!"
10053010-7 = "이번에는 또 뭐냐?"
10053010-8 = "오늘, 저는 여행을 떠날 검다."
10053010-9 = "만약 일주일 후에도 제가 돌아오지 않는다면, 그대로 사라졌다 생각하고 찾지 말아주십……."
10053010-10 = "그나저나 옆에 분은 뉘심까? 첨 뵙는 거 같은데."
10053010-11 = "좀 전에 네가 소리치면서 들어오지 않았다면, 내가 먼저 소개할 예정이었다."
10053010-12 = "이분께서는 샬레의 [USERNAME] 선생님이시다."
10053010-13 = "선생님, 이 양아치가 저희 공안국의 부국장, 시마 코노카입니다."
10053010-16 = "오오! 이분이! 이야기는 누님께 매번 들었슴다!"
10053010-17 = "……? 근데, 선생님께서는 왜 수갑을 차고 계심까?"
10053010-18 = "[s1]\"그…… 오해하지 말아줬으면 하는데.\"\n[s2]\"서로 간의 사소한 오해가 있었다고 할까.\""
10053010-25 = "블랙마켓에서 특정 학생의 중학교 졸업 앨범을 밀거래하다 적발되었는데, 뭐가 오해라는지 잘 모르겠습니다만……."
10053010-26 = "뭐, 그래도 선생님이시니, 그렇게 불순한 의도는 없으셨을…… 거라……."
10053010-27 = "……………."
10053010-28 = "일단, 피해 학생에게 연락하여, 사정 설명 후에 상황 파악하여 조치하도록 하겠습니다."
10053010-29 = "[s3] \"괜찮아! 나는 떳떳하니까!\"\n[s4] \"이오리라면 이해해 줄 거야!\""
10053010-32 = "하아…… 선생님께서도 엄연한 공인의 신분이시니, 이렇게 눈에 띄는 일은 자중해 주셨으면 합니다만."
10053010-33 = "그보다, 코노카."
10053010-34 = "여행은 갑자기 또 무슨 소리냐?"
10053010-35 = "아, 그게 말임다."
10053010-36 = "오해하지 마셨으면 하는데요."
10053010-40 = "일주일 안에, 반드시 츠치노코를 잡아야 함다!!"
10053010-45 = "……오늘 난 대체 뭘 오해하면 안 되는 거냐?"
10053010-46 = "일단, 예의상 물어보겠다만, 츠치노코는 내가 생각하는 그 츠치노코인가?"
10053010-47 = "맞슴다! 그 츠치노코임다!"
10053010-48 = "……전설의 동물 아니냐?"
10053010-49 = "그렇슴다! 매년 거액의 현상금을 건 대회를 열지만, 목격담만 무성할 뿐 누구도 포획하지 못했다는 미발견 생물계의 레전드!"
10053010-50 = "알려진 누적 현상금만 총액 1억엔! 걸어다니는, 아니, 기어다니는 황금이라 불러도 과언이 아님다!"
10053010-51 = "……그래."
10053010-52 = "다음은, 조금 민감한 질문일 수도 있다만."
10053010-53 = "혹시 급전이 필요한 상황인가?"
10053010-54 = "네? 에이, 누님도 저를 뭘로 보시고. 제가 뭐 돈 때문에 움직이는 사람임까?"
10053010-55 = "분명, 그렇지는 않지."
10053010-56 = "그렇다면…… 역시, 또 징크스 때문인가."
10053010-57 = "어차피, 저 연차도 쌓이지 않았슴까?"
10053010-58 = "아, 걱정하지 마라. 딱히 멈추려는 건 아니니까."
10053010-59 = "어느 쪽인가 하면, 너는 과할 정도로 일하고 있다. 먼저 쉬겠다고 말하면, 굳이 말릴 이유는 없지."
10053010-60 = "다만……."
10053010-61 = "다만?"
10053010-62 = "간다면 선생님과 함께 가라."
10053010-63 = "네?"
10053010-64 = "[s] \"……네? 저요?\""
10053010-65 = "선생님, 잠깐 괜찮겠습니까?"
10053010-69 = "이번 여행 동안 코노카와 동행해 주신다면, 오늘 건은 더 조사하지 않고 보내드리겠습니다."
10053010-70 = "[s5] \"사, 사법 거래인가?!\"\n[s6] \"나는 무고해! 이오리와 통화시켜줘!\""
10053010-73 = "아니요. 그런 것은 아닙니다. 이건, 제 개인적인 부탁입니다."
10053010-74 = "……딱히, 코노카가 문제아라는 것은 아닙니다. 물론, 행실에 문제가 없다고는 못하겠지만……."
10053010-75 = "보기보다 성실한 성격에, 2학년으로 부국장을 달 만큼 실력도 출중하죠. 저와는 달리 친화성이 좋아 부하들의 신임도 받고 있고요."
10053010-76 = "다만, 한 가지 일에 관해서는, 유독 눈이 돌아ㄱ…… 과민 반응을 보여서요."
10053010-79 = "바로 <미신>입니다."
10053010-84 = "이야~ 설마 그 유명하신 선생님께서 동행해 주실 줄이야~"
10053010-85 = "사고 예방이라니, 누님께서도 과잉보호란 말이죠."
10053010-86 = "저도 참 사랑받는 녀석임다!"
10053010-87 = "안 그렇슴까? 하~! 하하하~!"
10053010-88 = "[s7] \"그, 그렇네!\"\n[s8] ('당할까 봐'가 아니라, '칠까 봐'이지만…….)"
10053010-91 = "그러고 보니 일행한테 말해두는 거 깜빡했네요."
10053010-92 = "아, 맞슴다. 이번 여행은 혼자 가는 게 아니라서요."
10053010-93 = "<구루밍>하고, <모 소장>이랑 같이 감다."
10053010-94 = "[s9] \"구루밍, 모 소장……?\"\n[s10] \"개성적인 이름이네…….\""
10053010-97 = "아, 이름 아임다. 아이디임다, 아이디."
10053010-98 = "[s11] \"인터넷에서 만난 사람들인 거야?\"\n[s12] \"혹시 위험한 사람이면 어쩌게…….\""
10053010-101 = "예?"
10053010-102 = "………………."
10053010-103 = "푸핫! 크하하하하핫!!!"
10053010-104 = "아씨, 죄송함다~ 너무 웃었네……."
10053010-105 = "근데 선생님, 저 누군지 못 들으셨슴까?"
10053010-106 = "그 위험한 놈들 잡는 놈이 접니다."
10053010-107 = "……뭐, 그렇지만. 이번 멤버는 처음 보는 사이는 아니라서요."
10053010-108 = "실은, SNS에서 만나고, 몇 번 정모한 적 있거든요."
10053010-109 = "혹시 선생님은 흥미 없으심까?"
10053010-110 = "도시전설의 목격담이나 신비한 체험담 위주로 올리는 SNS인데요."
10053010-111 = "처음에는 사건 모니터링 용도로 사용했는데요. 이게 꽤나 물건이라……."
10053010-116 = "아, 도착했네요. 이거는 이따 얘기하시죠."
10053010-125 = "햐…………."
10053010-126 = "듣기는 했지만, 진짜 시골이네요."
10053010-131 = "아, 왔다."
10053010-132 = "……? 한 사람이 더 있는 것 같은데?"
10053010-133 = "어라, 진짜네."
10053010-137 = "저기, 혹시……."
10053010-142 = "어, 어?! 뭐야?! 선생님이 왜 여기 있어?!"
