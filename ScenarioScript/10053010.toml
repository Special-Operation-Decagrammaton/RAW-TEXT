[translation]
10053010-1 = "ตอนที่ 1;ความเข้าใจผิดคูณสอง"
10053010-2 = "ที่ผ่านมาฉันติดหนี้บุญคุณไว้ซะเยอะเลยค่ะ!"
10053010-7 = "แล้วคราวนี้อะไรอีกล่ะ?"
10053010-8 = "วันนี้ฉันจะเดินทางไปเที่ยวค่ะ"
10053010-9 = "ถ้าฉันไม่กลับมาในหนึ่งสัปดาห์ ก็คิดซะว่าฉันหายตัวไปแล้ว แล้วก็ไม่ต้องตามหาฉันนะคะ..."
10053010-10 = "จะว่าไป คนข้างๆ คือใครเหรอคะ? เหมือนเพิ่งเคยเห็นเป็นครั้งแรกเลย"
10053010-11 = "ฉันก็ว่าจะแนะนำให้รู้จักอยู่หรอก แต่พอเธอเข้าห้องมาแล้วก็เริ่มตะโกนอะไรเสียงดังเลยไม่ใช่เหรอ"
10053010-12 = "นี่คือคุณครู [USERNAME] จากชาเล่ต์"
10053010-13 = "คุณครูคะ อันธพาลคนนี้คือชิมะ โคโนกะ รองหัวหน้ากรมความมั่นคงสาธารณะของเราค่ะ"
10053010-16 = "โอ้ว! คุณครูเองเหรอคะ! คุณพี่เล่าเรื่องของคุณครูให้ฉันฟังบ่อยเลยค่ะ!"
10053010-17 = "ว่าแต่... ทำไมคุณครูถึงใส่กุญแจมือมาล่ะคะ...?"
10053010-18 = "[s1] \"เอ่อ... อย่าเพิ่งเข้าใจครูผิดนะ\"\n[s2] \"พอดีมีเรื่องเข้าใจผิดกันนิดหน่อยน่ะ\""
10053010-25 = "มีรายงานว่าพบเห็นการลักลอบซื้อขายอัลบั้มภาพจบการศึกษาของนักเรียนม.ต้นคนหนึ่งในตลาดมืด แล้วฉันก็ไม่เข้าใจเลยค่ะว่ามันเป็นความเข้าใจผิดยังไง..."
10053010-26 = "แต่ในเมื่อคนคนนั้นเป็นคุณครู ก็น่าจะไม่มีเจตนาร้ายอะไร... หรือเปล่า..."
10053010-27 = "..."
10053010-28 = "เอาเป็นว่าฉันจะติดต่อไปอธิบายสถานการณ์ให้นักเรียนที่ได้รับผลกระทบฟัง แล้วจะประเมินสถานการณ์และดำเนินการอย่างเหมาะสมค่ะ"
10053010-29 = "[s3] \"ทำอย่างนั้นได้เลย! ครูไม่หวั่นอยู่แล้ว!\"\n[s4] \"อิโอริต้องเข้าใจครูอยู่แล้วละ!\""
10053010-32 = "เฮ้อ... คุณครูเป็นบุคคลสาธารณะนะคะ จะทำเรื่องสะดุดตาอะไรก็ระมัดระวังหน่อยสิ"
10053010-33 = "แต่ที่สำคัญกว่านั้น โคโนกะ"
10053010-34 = "จู่ๆ จะไปเที่ยวงั้นเหรอ หมายความว่ายังไงน่ะ?"
10053010-35 = "อ้อ เรื่องนั้นน่ะค่ะ"
10053010-36 = "หวังว่าจะไม่เข้าใจฉันผิดนะคะ แต่ว่า..."
10053010-40 = "ฉันต้องจับสึจิโนโกะให้ได้ภายในหนึ่งสัปดาห์ค่ะ!!"
10053010-45 = "อย่าเข้าใจผิด... วันนี้ทำไมฉันถึงได้ฟังแต่ประโยคนี้นะ?"
10053010-46 = "ฉันขอถามตามมารยาทก่อนนะ สึจิโนโกะที่เธอพูดถึง คือสึจิโนโกะที่ฉันคิดหรือเปล่า?"
10053010-47 = "ใช่แล้วค่ะ! สึจิโนโกะนั่นละค่ะ!"
10053010-48 = "มันไม่ใช่สัตว์ในตำนานหรอกเรอะ...?"
10053010-49 = "ใช่ค่ะ! ถึงจะมีการจัดงานล่าค่าหัวด้วยเงินรางวัลจำนวนมหาศาลเป็นประจำทุกปี แต่จนถึงตอนนี้ก็มีแค่ข่าวลือการพบเห็นเท่านั้น ยังไม่เคยมีใครจับสัตว์ในตำนานตัวนั้นได้สักคน! "
10053010-50 = "ตอนนี้เงินรางวัลสะสมมากถึงร้อยล้านเยนแล้วนะคะ! จะบอกว่าสึจิโนโกะเป็นทรัพย์สมบัติที่เดินได้ ไม่สิ บอกว่าเป็นทรัพย์สมบัติที่เลื้อยได้ก็ยังได้เลยค่ะ!"
10053010-51 = "อืม..."
10053010-52 = "ต่อไปเป็นคำถามที่ออกจะละเอียดอ่อนหน่อยนะ"
10053010-53 = "นี่เธอตกอยู่ในสถานการณ์ที่ต้องใช้เงินด่วนหรือเปล่า?"
10053010-54 = "คะ? นี่คุณพี่เห็นฉันเป็นคนยังไงคะ ฉันเป็นคนที่ลุกขึ้นมาทำอะไรเพราะเงินเหรอคะ?"
10053010-55 = "ก็ไม่ใช่หรอก"
10053010-56 = "ถ้างั้นก็... เป็นเพราะเชื่อในลางร้ายอะไรอีกงั้นเหรอ?"
10053010-57 = "ยังไงฉันก็มีวันลาพักร้อนเหลือนี่คะ?"
10053010-58 = "อ้อ เรื่องนั้นน่ะไม่ต้องห่วง ฉันไม่ได้จะห้ามไม่ให้ไปหรอก"
10053010-59 = "จะว่าไปแล้ว เธอเองก็โหมงานหนักอยู่ตลอด ถ้าวันหนึ่งมาบอกว่าอยากพักผ่อนบ้าง ฉันก็ไม่มีเหตุผลอะไรที่จะไม่อนุมัติ"
10053010-60 = "แต่ว่า..."
10053010-61 = "แต่ว่า?"
10053010-62 = "ถ้าจะไป ก็ให้คุณครูไปด้วย"
10053010-63 = "คะ?"
10053010-64 = "[s] \"หา...? ครูเนี่ยนะ?\""
10053010-65 = "ขอฉันคุยด้วยสักเดี๋ยวได้มั้ยคะ คุณครู?"
10053010-69 = "ถ้าคุณครูยินดีร่วมทางไปกับโคโนกะในครั้งนี้ ฉันจะไม่สอบสวนคดีลักลอบซื้อขายสินค้าที่เจอมาวันนี้ แล้วจะยอมปล่อยตัวให้ค่ะ"
10053010-70 = "[s5] \"จะ... เจรจาต่อรองคำรับสารภาพเหรอ?!\"\n[s6] \"จะยัดข้อหาครูเหรอ? ขอโทรคุยกับอิโอริหน่อยสิ!\""
10053010-73 = "ไม่ค่ะ ไม่ใช่อย่างนั้นหรอก นี่เป็นคำขอส่วนตัวของฉันน่ะค่ะ"
10053010-74 = "แล้วก็... ใช่ว่าโคโนกะจะเป็นเด็กเจ้าปัญหาหรืออะไรหรอกค่ะ ถึงฉันจะพูดไม่ได้ว่าโคโนกะไม่เคยมี#nพฤติกรรมที่ก่อปัญหาเลยก็เถอะ..."
10053010-75 = "แต่เห็นอย่างนั้นเธอก็เอาการเอางาน ความสามารถก็โดดเด่นจนได้ขึ้นเป็นรองหัวหน้ากรมฯ ภายในสองปีเลยนะคะ ต่างจากฉันตรงที่เธออัธยาศัยดี ก็เลยได้รับความไว้วางใจจากผู้ใต้บังคับบัญชา"
10053010-76 = "แต่ก็มีอยู่เรื่องหนึ่งที่ทำให้โคโนกะงมงายจนสมองไหล... ฉันหมายถึงแสดงปฏิกิริยาเกินเหตุน่ะค่ะ"
10053010-79 = "และนั่นก็คือ <ความเชื่อเรื่องโชคลาง> ค่ะ"
10053010-84 = "โอ้โห~ ไม่เคยคิดเลยนะว่าคุณครูคนดังจะมาร่วมทางกับฉันด้วย~"
10053010-85 = "ให้มาป้องกันอุบัติเหตุงั้นเหรอ คุณพี่นี่ละก็ เป็นห่วงเป็นใยฉันมากเกินไปแล้วนะคะ"
10053010-86 = "มีแต่คนเอ็นดูฉันนะคะเนี่ย!"
10053010-87 = "ว่ามั้ยคะ? ฮ่า~! ฮ่าฮ่าฮ่า~!"
10053010-88 = "[s7] \"นะ... นั่นสินะ!\"\n[s8] (คงกลัวว่าจะมา 'ก่อเรื่อง' มากกว่า 'เจอเรื่อง' น่ะสิ...)"
10053010-91 = "จะว่าไป ฉันลืมบอกเพื่อนร่วมทริปคนอื่นไปเลยค่ะ"
10053010-92 = "อ่า ใช่ค่ะ พอดีครั้งนี้ไม่ใช่การแบกเป้เที่ยวคนเดียวน่ะค่ะ"
10053010-93 = "<คุรุมิง> กับ <หัวหน้าศูนย์> จะมาด้วยค่ะ"
10053010-94 = "[s9] \"คุรุมิง... หัวหน้าศูนย์...?\"\n[s10] \"เป็นชื่อที่แปลกดีนะ...\""
10053010-97 = "อ้อ ไม่ใช่ชื่อจริงๆ หรอกค่ะ เป็นชื่อไอดีน่ะค่ะ"
10053010-98 = "[s11] \"เป็นคนที่รู้จักในอินเทอร์เน็ตเหรอ?\"\n[s12] \"เป็นพวกมิจในอินเทอร์เน็ตหรือเปล่า...?\""
10053010-101 = "คะ?"
10053010-102 = "..."
10053010-103 = "ฮะฮ่า! ฮ่าฮ่าฮ่าฮ่า!!!"
10053010-104 = "อ่า ขอโทษทีค่ะ~ พอดีมันโดนเส้นฉันน่ะ..."
10053010-105 = "แต่จะว่าไป คุณครูไม่เคยได้ยินกิตติศัพท์ของฉันมาก่อนเหรอคะ?"
10053010-106 = "ฉันคนนี้ละค่ะ ตำรวจที่สยบพวกอันธพาลได้"
10053010-107 = "แต่ก็นะ... ถึงยังไงเพื่อนร่วมทริปครั้งนี้ก็ไม่ใช่คนแปลกหน้าเสียทีเดียวหรอกค่ะ"
10053010-108 = "อันที่จริงเราก็เจอกันในโซเชียล แล้วก็นัดเจอตัวจริงกันมาบ้างแล้วค่ะ"
10053010-109 = "คุณครูไม่สนใจเรื่องแบบนี้เหรอคะ?"
10053010-110 = "นี่เป็นแพลตฟอร์มโซเชียลมีเดียที่คนส่วนใหญ่มาโพสต์เรื่องราวจากประสบการณ์ตรงเกี่ยวกับ#nตำนานเมืองหรือประสบการณ์ลึกลับต่างๆ ค่ะ"
10053010-111 = "ตอนแรกฉันก็เล่นเพื่อติดตามเหตุการณ์ต่างๆ ก็เท่านั้น แต่ว่ามันน่าสนใจขึ้นทุกวันๆ..."
10053010-116 = "อ๊ะ มาถึงแล้วสินะ เรื่องนี้ไว้ค่อยคุยต่อทีหลังนะคะ"
10053010-125 = "เฮ้อ..."
10053010-126 = "ถึงจะเตรียมตัวเตรียมใจมาบ้างแล้ว แต่ที่นี่ก็ชนบทจ๋าเลยนะคะ"
10053010-131 = "อ๊ะ มาแล้ว"
10053010-132 = "เหมือนจะมีมาเพิ่มอีกคนเลยนะ...?"
10053010-133 = "เอ๋ จริงด้วยแฮะ"
10053010-137 = "เอ่อ คือว่า..."
10053010-142 = "หะ... หา?! อะไรกัน?! ทำไมคุณครูถึงมาอยู่ตรงนี้ด้วยล่ะ?!"
