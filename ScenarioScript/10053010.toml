[translation]
10053010-1 = "第1話;誤解與誤會"
10053010-2 = "這段時間承蒙照顧了！"
10053010-7 = "這次又怎麼了？"
10053010-8 = "我從今天開始要出門旅行。"
10053010-9 = "如果一週之後還沒回來，就當作我消失了不用來找──"
10053010-10 = "話說旁邊那位是誰？#n好像沒看過。"
10053010-11 = "要不是你剛才大吼大叫地衝進來，我本來打算先向你介紹的。"
10053010-12 = "這位是夏萊的[USERNAME]老師。"
10053010-13 = "老師，這個小混混是我們公安局的副局長，志真木乃香。"
10053010-16 = "哦哦！你就是那位老師啊！我經常聽大姐提到你呢！"
10053010-17 = "不過……老師為什麼戴著手銬？"
10053010-18 = "[s1]「那個……希望你不要誤會。」\n[s2]「應該說是彼此之間有點小小的誤會。」"
10053010-25 = "老師他在黑市非法交易學生的中學畢業紀念冊時被當場查獲……#n我是不清楚這其中究竟能發生什麼誤會啦……"
10053010-26 = "不過畢竟是老師，應該是沒有什麼不純的動機才對……"
10053010-27 = "……………"
10053010-28 = "我會先聯絡受害學生說明情況，再決定該如何處理。"
10053010-29 = "[s3] 「沒問題！我問心無愧！」\n[s4] 「伊織他肯定會理解我的！」"
10053010-32 = "唉……老師也算是公眾人物，希望您能克制這種引人注目的言行。"
10053010-33 = "比起這個，木乃香。"
10053010-34 = "旅行是什麼意思？"
10053010-35 = "喔，是這樣的。"
10053010-36 = "希望大姐你聽了不要誤會。"
10053010-40 = "我必須在一週之內抓到槌之子！！"
10053010-45 = "……我今天到底不能誤會什麼啊？"
10053010-46 = "先禮貌性地問一下，槌之子是我想的那個槌之子嗎？"
10053010-47 = "沒錯！就是那個槌之子！"
10053010-48 = "……那不是傳說中的動物嗎？"
10053010-49 = "是的！聽說每年都會舉辦高額獎金的比賽，但目前都只有目擊傳聞，#n沒有人捕獲過，牠是未被發現的生物界傳說！"
10053010-50 = "現在已知的累積懸賞金總額為1億日元！#n可以說是會走路的，不，是會爬行的黃金也不為過！"
10053010-51 = "……原來如此。"
10053010-52 = "接下來，可能是有點敏感的問題。"
10053010-53 = "你是不是急需用錢？"
10053010-54 = "什麼？大姐頭你也太小看我了吧。#n我是那種會為了錢行動的人嗎？"
10053010-55 = "確實不太像。"
10053010-56 = "那……果然又是因為迷信嗎。"
10053010-57 = "反正我年資也累積了不少吧？"
10053010-58 = "喔，別擔心。我不是要阻止你。"
10053010-59 = "真要說的話，你確實有點工作過度了。如果你要休息，我沒有理由阻止。"
10053010-60 = "但是……"
10053010-61 = "但是……？"
10053010-62 = "要去的話就和老師一起去。"
10053010-63 = "什麼？"
10053010-64 = "[s] 「……什麼？我嗎？」"
10053010-65 = "老師，方便過來一下嗎？"
10053010-69 = "如果您能在這次旅行中陪伴木乃香，今天的事情我就不再追究，直接放您走。"
10053010-70 = "[s5] 「這，這是司法交易嗎！？」\n[s6] 「我是無辜的！讓我和伊織通話！」"
10053010-73 = "並不是，這是我個人的請求。"
10053010-74 = "……也不是說木乃香是問題學生。當然也不是說行為上沒問題……"
10053010-75 = "雖然外在看起來是比實際上還認真的性格，2年級就能當上副局長，實力也很出色。#n不像我，他親和力好也受到下屬的信任。"
10053010-76 = "只是，對於某一件事特別會失去理智……會有過度反應。"
10053010-79 = "也就是「迷信」。"
10053010-84 = "哎呀～沒想到那位有名的老師會陪我一起來旅行～"
10053010-85 = "說什麼以防萬一，大姐也太過保護了。"
10053010-86 = "我也太受寵愛了吧～"
10053010-87 = "老師也這麼覺得吧？啊哈哈～！"
10053010-88 = "[s7] 「是，是啊！」\n[s8] （與其說是擔心「被害」，不如說是擔心「肇事」……）"
10053010-91 = "啊，對了。"
10053010-92 = "這次旅行我不是一個人去。"
10053010-93 = "是和「Guruming」還有「某所長」一起去。"
10053010-94 = "[s9] 「Guruming，某所長……？」\n[s10] 「名字挺有個性的……」"
10053010-97 = "不是名字，是ID啦，ID。"
10053010-98 = "[s11] 「是在網路上認識的人嗎？」\n[s12] 「萬一是危險人物怎麼辦……」"
10053010-101 = "咦？"
10053010-102 = "………………"
10053010-103 = "噗哈！哈哈哈哈哈！！！"
10053010-104 = "啊，抱歉～笑過頭了……"
10053010-105 = "但是老師，你以為我是誰？"
10053010-106 = "我的工作可是負責抓那種危險的傢伙耶。"
10053010-107 = "而且這次的成員也不是第一次見面。"
10053010-108 = "雖然是在SNS上認識的，不過之前就有見過幾次面。"
10053010-109 = "老師有沒有興趣？"
10053010-110 = "這是一個主要在分享都市傳說目擊談和神秘體驗的SNS。"
10053010-111 = "一開始是用來監控事件的，但這東西意外的很厲害──"
10053010-116 = "哦，到了。等會再說吧。"
10053010-125 = "哇…………"
10053010-126 = "雖然有聽說過，但真的是鄉下呢。"
10053010-131 = "喔，來了。"
10053010-132 = "嗯……？好像多了一個人？"
10053010-133 = "咦，真的耶。"
10053010-137 = "那個，請問……"
10053010-142 = "咦？呃！？為什麼！？為什麼老師在這裡！？"
