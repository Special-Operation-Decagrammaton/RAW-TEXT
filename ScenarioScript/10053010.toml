[translation]
10053010-1 = "第1話;誤會與誤會"
10053010-2 = "這段時間承蒙照顧了！"
10053010-3 = ""
10053010-5 = ""
10053010-6 = ""
10053010-7 = "這次又怎麼了？"
10053010-8 = "我從今天開始要出門旅行。"
10053010-9 = "如果一週後還沒回來就當作我消失了，不用來找──"
10053010-10 = "話說旁邊那位是誰啊？#n之前好像從來沒見過。"
10053010-11 = "要不是你剛才大吼大叫地衝進來，我本來打算先向你介紹的。"
10053010-12 = "這位是夏萊的[USERNAME]老師。"
10053010-13 = "老師，這個小混混是我們公安局的副局長，志真木乃香。"
10053010-14 = ""
10053010-16 = "哦哦！原來這位就是老師啊！#n我經常聽大姐頭提到你的事呢！"
10053010-17 = "不過……老師為什麼會戴著手銬？"
10053010-18 = "[s1]「那個……希望你不要誤會。」\n[s2]「應該說彼此之間有點小小的誤會。」"
10053010-21 = ""
10053010-23 = ""
10053010-24 = ""
10053010-25 = "老師他在黑市非法交易學生的中學畢業紀念冊時被當場查獲……#n雖然不清楚其中究竟能發生什麼誤會……"
10053010-26 = "不過畢竟是老師，應該不是為了什麼不純的動機才對……"
10053010-27 = "……………"
10053010-28 = "我會先聯絡受害學生說明情況，再決定該如何處理。"
10053010-29 = "[s3] 「沒問題！我問心無愧！」\n[s4] 「伊織他肯定會理解我的！」"
10053010-32 = "唉……老師畢竟是名公眾人物，希望您能克制這種引人注目的言行。"
10053010-33 = "不過話又說回來……木乃香。"
10053010-34 = "旅行是什麼意思？"
10053010-35 = "啊，事情是這樣的。"
10053010-36 = "希望大姐頭聽了不要誤會。"
10053010-37 = ""
10053010-40 = "我必須在一週之內抓到槌之子才行！！"
10053010-41 = ""
10053010-43 = ""
10053010-44 = ""
10053010-45 = "……今天到底有多少事情是我不能誤會的？"
10053010-46 = "姑且確認一下，槌之子是我想的那個槌之子嗎？"
10053010-47 = "對對對！就是那個槌之子！"
10053010-48 = "……那不是傳說中的動物嗎？"
10053010-49 = "沒錯！雖然每年都會舉辦獎金高昂的比賽，卻總是只有目擊的傳聞……#n從來沒有被人成功捕獲過，堪稱是未確認生物界的傳說！"
10053010-50 = "目前已知的累積懸賞金總額高達1億元！#n要說牠是會走路的──不，是會爬行的黃金也不為過！"
10053010-51 = "……原來如此。"
10053010-52 = "那麼，接下來的問題可能有點敏感……"
10053010-53 = "你是不是急需用錢？"
10053010-54 = "咦？哎唷，大姐頭把我當成什麼人了啊？#n我像是那種會為了錢行動的人嗎？"
10053010-55 = "這個嘛……確實不太像。"
10053010-56 = "既然如此……果然又是因為迷信嗎。"
10053010-57 = "反正我也已經累積不少特休沒用了吧？"
10053010-58 = "啊，不用擔心。我沒有要阻止你的意思。"
10053010-59 = "真要說的話，你反而有點操勞過度了。#n既然你主動提出想要休息，我也沒有理由阻止你。"
10053010-60 = "不過……"
10053010-61 = "不過……？"
10053010-62 = "要去的話就跟老師一起去吧。"
10053010-63 = "什麼？"
10053010-64 = "[s] 「……咦？我嗎？」"
10053010-65 = "老師，方便借一步說話嗎？"
10053010-67 = ""
10053010-68 = ""
10053010-69 = "如果您願意在這次旅行中陪著木乃香，今天的事情我就不再追究下去。"
10053010-70 = "[s5] 「這，這是司法交易嗎！？」\n[s6] 「我是無辜的！讓我和伊織通話！」"
10053010-73 = "不是那樣的。這只是我個人的請求。"
10053010-74 = "之所以這麼做，不代表木乃香是個問題兒童。#n當然，他的言行也並非完全沒有問題就是了……"
10053010-75 = "和外表相比認真許多的個性、僅僅2年級就能當上副局長的優秀實力──#n與我不同擅長跟其他人打交道，因此深受下屬的信任。"
10053010-76 = "然而，唯獨在面對某件事情時會失去理智……或者說反應過度。"
10053010-77 = ""
10053010-79 = "那就是「迷信」。"
10053010-82 = ""
10053010-84 = "哎呀～沒想到那位有名的老師會陪我一起來旅行～"
10053010-85 = "說什麼以防萬一，大姐頭也太過度保護了吧。"
10053010-86 = "我還真是備受寵愛呢～"
10053010-87 = "老師也這麼覺得吧？啊哈哈～！"
10053010-88 = "[s7] 「就，就是說啊！」\n[s8] （與其說是擔心「被害」，不如說是擔心「肇事」……）"
10053010-91 = "這麼說來，我好像忘記跟旅伴先說一聲了。"
10053010-92 = "啊，這次旅行我不是自己一個人去哦。"
10053010-93 = "是和「Gurumin」還有「某所長」一起去。"
10053010-94 = "[s9] 「Gurumin和某所長……？」\n[s10] 「名字還挺有個性的呢……」"
10053010-97 = "不是名字是ID啦，ID。"
10053010-98 = "[s11] 「所以是在網路上認識的人嗎？」\n[s12] 「萬一是危險人物怎麼辦……」"
10053010-101 = "咦？"
10053010-102 = "………………"
10053010-103 = "噗，啊哈哈！啊哈哈哈哈！！！"
10053010-104 = "抱歉抱歉～不小心笑得太誇張了……"
10053010-105 = "不過老師，你沒聽說過我是做什麼的嗎？"
10053010-106 = "我的工作就是負責抓住那種危險的傢伙啊。"
10053010-107 = "而且，我跟這次的成員也不是第一次見面了。"
10053010-108 = "雖然是在SNS上認識的，不過之前就有見過幾次。"
10053010-109 = "老師有沒有興趣呀？"
10053010-110 = "那是個以都市傳說的目擊情報和神祕體驗為主題的SNS哦。"
10053010-111 = "一開始是用來監控事件的，沒想到意外地有用……"
10053010-112 = ""
10053010-114 = ""
10053010-115 = ""
10053010-116 = "啊，我們到了。#n剩下的待會再聊吧。"
10053010-117 = ""
10053010-124 = ""
10053010-125 = "哇…………"
10053010-126 = "雖然有聽說過，還真的是鄉下呢。"
10053010-127 = ""
10053010-129 = ""
10053010-130 = ""
10053010-131 = "啊，來了。"
10053010-132 = "嗯……？怎麼好像多了一個人？"
10053010-133 = "咦，真的耶。"
10053010-134 = ""
10053010-136 = ""
10053010-137 = "那個，請問……"
10053010-138 = ""
10053010-140 = ""
10053010-141 = ""
10053010-142 = "咦！？為什麼！？#n老師為什麼會在這裡！？"
