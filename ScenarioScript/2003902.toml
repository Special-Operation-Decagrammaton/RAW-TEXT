[translation]
2003902-1 = "구중궁궐의 숨바꼭질"
2003902-2 = "현룡문 내실"
2003902-4 = "그리하여, 지금은 유폐된 상태나 다름없다는 것이다!"
2003902-5 = "[s1] \"갑자기 밑도 끝도 없이?!\"\n[s2] \"도대체 무슨 일로!?\""
2003902-8 = "음. 그것은 현룡문 내부의 이런저런 복잡하고 설명하기 귀찮…… 힘든 정치적인 문제와."
2003902-9 = "나아가 현무상회와의 세력적 갈등, 산해경의 키보토스에서의 학원적으로서의 입지와 위신."
2003902-10 = "그 외에 기준금리의 지속적 상승, 멈추지 않는 증세, 회복될 기미를 보이지 않는 실질 소득 및 공교육 붕괴…… 그 모든 문제들이 한 데 뒤엉켜."
2003902-11 = "도저히 탈출구가 보이지 않는 갈등 상황의 극에 다다른 결과물이라고 할 수 있겠지."
2003902-12 = "[s] \"전혀 모르겠습니다.\""
2003902-13 = "음. 그럴 게다."
2003902-14 = "[s] \"거기서 그런 대답을 하셔도.\""
2003902-15 = "때로는 이해보다 행동이 중할 때가 있는 법이다. 그렇지 아니한가?"
2003902-16 = "시선은 하늘을 향하고, 발걸음은 태산과 같이. 하여."
2003902-17 = "이 순간부터 선생에게는, 교육자로서 나와 함께 이 상황을 타개할 의무가 부여되었다고 볼 수 있는 것이겠지!"
2003902-18 = "[s] \"요컨대, 여기에서 데리고 나가달라는 뜻……?\""
2003902-19 = "음. 이야기가 빠르게 통하는 말벗이란 역시 좋은 것이로구나."
2003902-20 = "허나 현룡문 그 자체라고도 볼 수 있는 육화각을, 아무 준비 없이 몰래 빠져나가는 것도 쉬운 일은 아닐 터."
2003902-21 = "그리하여, 나름대로 준비한 것이 있노라."
2003902-25 = "[ns] \"그것은 설마……!\""
2003902-26 = "그러하다. 이것이다."
2003902-34 = "자, 그러면 조용히 빠져나가 보도록 하자."
2003902-37 = "어떻게든 내실에서 이곳까지는 무사히 도달했다만……."
2003902-38 = "오히려 이 장소가 더욱 위험한 것은 아니냐고?"
2003902-39 = "음…… 뼈 아픈 지적이지만, 선생의 말대로다. 이곳은 육화각의 최중심지이자 그 자체라고도 할 수 있는 자리."
2003902-40 = "특히 이곳은 정해진 시간에 순번제로 순찰이 이루어지고 있으니……."
2003902-45 = "어라……? 이 시간의 순찰 당번은 나일 텐데?"
2003902-46 = "어떻게 된 거지? 혹시 일정표를 착각한 건가?"
2003902-47 = "아니…… 이곳까지 들어와 순찰을 담당할 만한 현룡문 부원이, 그런 기초적인 실수를 저지를 리 없어!"
2003902-48 = "내가 모든 부원의 신상을 파악하고 있는 것은 당연히 아니지만, 너는 누구냐! 혹시 현무상회의 밀정인가!?"
2003902-49 = "으, 으음……!"
2003902-50 = "[ns] (키사키가…… 위험해!)"
2003902-52 = "[ns3] \"아, 그게! 내 호위 역이라고 할까 안내 역이라고 할까!\"\n[ns4] \"대충 그런 역할이야! 그래!\""
2003902-55 = "아, 선생님? 그러고 보니 선생님까지 계셨군요……."
2003902-56 = "죄, 죄송합니다! 알아보지도 못했다고 그렇게 실망하지는 말아 주세요! 순찰 순번에 이상이 생긴 건 아닌지, 그 부분에 너무 집중하는 바람에……!"
2003902-57 = "어라? 그런데 생각해 보니 또 이상하군요. 선생님께서…… 다른 곳도 아니고 이 육화각 안에서, 저희 현룡문의 호위까지 받을 일이 있었습니까?"
2003902-58 = "[s] \"그건…… 그러니까……!\""
2003902-59 = "호위를 가장한, 일종의 보안 대책입니다."
2003902-60 = "보안 대책……? 아!"
2003902-61 = "그렇다면 이것은, 문주님으로부터의 직접적인 기밀 지시 사항……?"
2003902-62 = "그렇습니다."
2003902-63 = "그, 그러면 실례했습니다. 선생님!"
2003902-64 = "이제 어느 정도 익숙해지셨을지도 모를 일이지만, 현룡문을 부디 마음껏 즐기시기 바랍니다!"
2003902-68 = "어떻게든 넘어간 모양이구나. 후후."
2003902-69 = "고생 많았다. 선생. 이대로 계속 들키지 않고 육화각을 빠져나갈 수 있다면……."
2003902-70 = "그때야말로, 우리의 승리라고 할 수 있겠지."
2003902-72 = "(그렇게, 키사키의 유폐 탈출(?)을 위한 여정은 계속되었다…….)"
2003902-75 = "[ns] \"저쪽에서 경비 담당이 오고 있어!\""
2003902-76 = "현룡문 부원이 선생을 수행 중이라는 소식은, 지금쯤 육화각 전체에 퍼졌겠지……."
2003902-77 = "바꾸어 말해, 선생을 수행하는 현룡문 부원은 육화각 외부로 나가기 어렵다는 뜻이 되기도 한다."
2003902-78 = "그렇다면 여기에서는 다른 수단을 사용해야겠구나."
2003902-88 = "아니?! 현무상회 녀석이 어째서 이런 곳까지!"
2003902-89 = "당장 이곳에서 나가지 못할까!"
2003902-90 = "후후. 예상대로구나. 어서 도망치도록 할까."
2003902-96 = "어떻게든 육화각을 빠져나왔다만."
2003902-97 = "현무상회 부원이, 이곳 육화각 거리를 거닌다는 것도 어색하게 보일 테지."
2003902-98 = "누구에게도 의심받지 않으면서도, 선생과 함께 있는 것이 자연스러워 보이는 역할이 필요한 시기로구나."
2003902-99 = "[s] \"그렇지만, 그런 것이 가능할까?!\""
2003902-100 = "후후. 그야 물론 있다마다. 그것은 바로……."
2003902-108 = "안녕하세요, 선생님! 키키예요! 오늘은 선생님과 함께 매화원 바깥을 산책하는 날인 거죠?"
2003902-109 = "[s5] \"………….\"\n[s6] \"그래…… 그런 걸로 하자…….\""
2003902-112 = "와–아! 역시 키키는 선생님이 제일 좋아요!"
2003902-119 = "아, 선생님? 이곳에는 어쩐 일로…… 아하, 그렇군요. 매화원 아이들과 놀아 주고 계셨네요."
2003902-120 = "수고가 많으십니다. 그리고 너도 선생님께 너무 떼쓰면 안 된다?"
2003902-121 = "걱정 마세요! 슌 교관님도 똑같은 말씀을 하셨거든요!"
2003902-122 = "[s7] \"…………………….\"\n[s8] \"너무…… 걱정…… 말고…….\""
2003902-125 = "네. 그러면 잘 부탁드리겠습니다."
2003902-126 = "(……어라? 그런데…….)"
2003902-127 = "(지금 뭔가, 등줄기에 엄청난 오한이……??)"
2003902-130 = "[ns] \"이제…… 슬슬 괜찮은 것 같은데……?\""
2003902-131 = "음."
2003902-137 = "후후. 고생 많았다. 선생."
2003902-138 = "이번의 탈출 놀이…… 아니, 유폐 해제에 많은 도움을 주어 고맙구나."
2003902-139 = "음? 정말로 유폐된 것이 맞았느냐고?"
2003902-140 = "……."
2003902-141 = "어째서 그런 것을 묻는 것인가, 선생?"
2003902-142 = "육화각에서도, 주위 거리에서도, 특별히 현룡문 부원들이 나를 찾는 것 같지는 않았다……?"
2003902-146 = "그래. 선생에게 모든 것을 숨기려 해 보았자, 큰 소용은 없는 것이겠지."
2003902-147 = "모든 것은 나의 상황극이었다."
2003902-148 = "그렇지만 간만에, 참으로 즐겁게 놀 수 있었던 것 같구나."
2003902-149 = "[s9] \"그렇…… 다는, 것은?!\"\n[s10] \"속였구나, 키사키! 속였구나!\""
2003902-152 = "후후. 결과적으로는 그렇게 된 셈이지."
2003902-153 = "하지만 말이다, 선생. 현룡문의 문주……. 아니, 각 학원의 학생회장들은 어떤 의미에서……."
2003902-154 = "그 스스로, 학원에 자기 자신을 유폐시킨 처지라고도 볼 수 있지 않겠느냐?"
2003902-155 = "그런 의미에서 나는, 가끔이라도 좋으니 누군가가 그 학생회장들의 처지를, '교육적'인 의미에서 지도해 주어야 한다고도 생각하는 바이고?"
2003902-156 = "[s] \"에에잇! 거기에서 교육적 지도라는 마법의 단어를!\""
2003902-157 = "후후. 그렇지만 어떤 의미에서 이번 일은, 나 자신의 흥미를 위해 선생을 이용했다고도 충분히 보여질 수 있는 일."
2003902-158 = "걱정하지 말거라. 이번 일에 대한 보충은, 어떤 방식으로든 분명히 행할 터이니–"
2003902-159 = "[s] \"아니? 나도 재미있었는데.\""
2003902-160 = "그, 그러한가……?"
2003902-161 = "참으로 선생은 이따금 내가 어찌할 수 없는 언행을 보여주는구나……."
2003902-162 = "그러면, 선생."
2003902-163 = "오늘은 이대로…… 나와 어울려 줄 수 있겠는가?"
2003902-165 = "문주님–! 문주님–! 어디 계십니까–! 문주님–!"
2003902-169 = "이제서야 현룡문에서도 문주의 부재가 알려진 모양이구나."
2003902-170 = "……뭐어, 이렇게 될 거라고 생각하기는 했다만."
2003902-175 = "그러면, 선생. 가도록 하지."
2003902-176 = "[s] \"엥? 어디를?\""
2003902-177 = "그야, 당연히 현룡문이 아니겠느냐."
2003902-178 = "후후. 아직 나와 어울려 달라는 권유는 유효하다만?"
2003902-179 = "물론…… 선생이 굳이 내 권유를 거절하고 돌아간다고 하면, 나로서는 막을 수단도 명분도 없을 것이다만……."
2003902-180 = "[s] \"키사키는 치사해!\""
2003902-181 = "후후. 알고 있다. 무릇 문주란 사용할 수 있는 것은 모두 적재적소에 사용해야 하는 법이지."
2003902-182 = "자아."
2003902-183 = "남은 시간 동안…… 잘 부탁하겠다. 선생."
2003902-185 = "(그렇게 키사키와 함께, 현룡문으로 유폐(?) 당하고야 말았다…….)"
