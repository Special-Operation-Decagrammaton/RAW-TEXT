[translation]
1802-1 = "정의실현부의 휴무일 2"
1802-2 = "트리니티 교내 정원"
1802-3 = "(순문학 독서 감상 동아리 점심 회동)"
1802-4 = "이번에 새로 발매된 요시모토 선생님의 시집, 읽어 보셨나요?"
1802-5 = "물론이에요. 이별을 겪은 여인의 마음을 어쩜 그렇게 절절하게 묘사하셨는지…… 읽으면서 정말 감격했어요."
1802-6 = "……."
1802-7 = "참, 그러고보니 이번 달 말에 노가미 선생님의 새로운 에세이가 발매된다고 하더군요."
1802-8 = "어머나, 그게 정말인가요? 전작을 워낙 재미있게 읽었던지라, 벌써부터 기대가 되네요."
1802-9 = "…………."
1802-10 = "저…… 마시로 님은 어떻게 생각하시나요? 최근에 재미있게 읽은 책이라도 있으신가요?"
1802-11 = "저, 저 말입니까? 최근에 읽은 것이라면 <정의란 이것이다>라는 책을……."
1802-12 = "<정의란 이것이다>……? 그건 어떤 책인가요? 시집? 에세이? 아니면 소설인가요?"
1802-13 = "그, 그게 그러니까 정의를 실현하기 위한 여러가지 사례를 적은……."
1802-14 = "아하, 철학서로군요. 언제나 진지한 마시로님께 잘 어울리는 멋진 책이네요."
1802-15 = "괜찮으시다면 조금만 내용을 소개해주시지 않겠어요?"
1802-16 = "정의를 요약하는 것은 어려운 일이라…… 으음……."
1802-19 = "(우으. 괴로워…… 빨리 원래의 정의실현부로 돌아가고 싶어…….)"
1802-20 = "(다른 선배들은 잘 하고 계시려나…….)"
1802-22 = "(홍차 동아리 비정기 교류회)"
1802-23 = "어머나, 차를 끓이시는 게 정말 능숙하시네요, 하스미 님."
1802-24 = "이렇게 맛있는 홍차는 처음 마셔보는 것 같아요."
1802-25 = "차의 맛은 물의 온도와 시간에 따라 예민하게 달라지니까요."
1802-26 = "기본을 충실하게 지키며 시간을 엄수해야 맛있는 차를 즐길 수 있답니다."
1802-27 = "하스미 님은 정말이지 정의실현부답게 행동에서 기품이 넘쳐 흐르시는 것 같아요."
1802-28 = "맞아요. 말씀에도 품위가 있고, 옷차림도 세련되시고……!"
1802-29 = "과찬의 말씀이세요. 저도 아직 부족한 점이 많은걸요."
1802-30 = "그나저나 이 찻잎은 유난히 향이 좋네요. 어디서 가져온 찻잎인가요?"
1802-31 = "그 찻잎은 지난번에 게헨나 학원에서 교류 선물로 보내온 물건이랍니다. 쉽게 구하기 어려운 홍차라 <티파티>에서 조금 나누어 주셨어요."
1802-32 = "……게헨나요?"
1802-33 = "그런 쓰레기들이 선물해준 물건인 줄도 모르고 정성을 들여 차를 우리고 있었다니……"
1802-34 = "차라리 구정물로 입을 헹구는 게 개운하겠어요!"
1802-35 = "남은 찻잎은 낙엽과 함께 태워버리도록 하세요. 쓰레기를 달여 마실 수는 없으니까요."
1802-37 = "역시 정의실현부의 부부장님. 게헨나와 관련된 일이라면 가차없으시네요."
1802-38 = "무, 무서워……."
1802-40 = "(방과후 디저트부의 월요일 정기 모임)"
1802-41 = "……."
1802-42 = "……."
1802-43 = "………."
1802-46 = "……."
1802-47 = "(부, 불편해…….)"
1802-48 = "(이거 뭐야?! 왜 정의부 부장이 우리랑 같이 있는 거야?!)"
1802-49 = "(나한테 물어봐도 모르거든…….)"
1802-50 = "하아……."
1802-51 = "(한숨 쉬잖아?! 어쩌라는 거야?!)"
1802-52 = "(그, 그러니까 나한테 물어봐도……!)"
1802-54 = "(마, 말을 걸어볼까?)"
1802-55 = "(미쳤어?! 잡아먹힐지도 몰라!!)"
1802-57 = "(뭐?! 저, 정말?!)"
1802-58 = "(아무리 그래도 그건 아니지…….)"
1802-59 = "……."
1802-60 = "캬아아아아아아악-!!"
1802-61 = "(히이이익-!)"
1802-62 = "(!!?)"
1802-63 = "(으, 으아아?! 뭐, 뭐야?! 왜 저러는데?)"
1802-64 = "(몰라! 내가 어떻게 알아……!)"
1802-65 = "………."
1802-66 = "……………."
1802-67 = "(아, 잠잠해졌다.)"
1802-68 = "게……"
1802-69 = "게헤헤헤헤헤헤헤헤헤헷-------."
1802-73 = "(무, 무서워…… )"
1802-74 = "(영문을 모르겠어…….)"
1802-75 = "(집에 가고 싶다…….)"
1802-77 = "트리니티 교내 정원"
1802-78 = "(다음 날.)"
1802-79 = "(하루 동안의 휴무가 끝난 뒤, 정의부원들이 정원에 모였다.)"
1802-80 = "평범한 트리니티의 학생들처럼 품위 있게 대화를 나누는 것이 이토록 어려운 일일 줄이야…… 전에는 미처 몰랐어요."
1802-81 = "……저는 어쩐지 홍차 모임 이후 절 피하는 분들이 생긴 것 같은 기분이……."
1802-82 = "츠루기 선배? 선배는 어떠셨어요?"
1802-83 = "……?"
1802-84 = "아아."
1802-85 = "아주 즐거운 모임이었다."
1802-86 = "다들 좋아해줘서, 다행이었어."
1802-87 = "히히, 히힛-"
1802-88 = "키히히히히히히히힛-!"
1802-89 = "……."
1802-90 = "흐음. 진짜 즐거웠던 거 같네요."
1802-91 = "……정말인가요."
1802-92 = "뭐, 나기사 씨의 계획에 놀아난 건 조금 싫지만. 츠루기의 기분이 풀렸다면 이건 이거대로 다행……. 전화위복이네요."
1802-93 = "츠루기의 편안한 얼굴을 보니까 안심이 되네요."
1802-94 = "그거…… 디저트부도 분명 같은 생각이겠죠?"
1802-97 = "이히히히히히히히힛-!"
1802-98 = "정의실현부의 휴무일"
