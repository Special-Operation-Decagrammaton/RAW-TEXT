[translation]
70006010-1 = "미식과 쿠키. 그리고 구호 1화"
70006010-2 = "아…… 배고프다. 우리 오늘 점심은 뭐 먹어?"
70006010-3 = "점심 메뉴라. 정말이지 깊은 고찰이 필요한 사항이군요."
70006010-7 = "난 모두와 먹는 거라면 뭐든 좋아!"
70006010-8 = "그렇다면 역시 무한 리필이네요."
70006010-10 = "근데 나 지갑 사정이 별로 안 좋은데……. 요즘 무한 리필 너무 비싸."
70006010-11 = "그렇다면 싼 가격에 양이 많고 퀄리티도 높은 메뉴를 찾아야겠군요."
70006010-13 = "우후후, 그런 거라면 하나 떠오르는 게 있는데요?"
70006010-14 = "설마…… 그거야?"
70006010-15 = "그거구나!"
70006010-16 = "네, 그거랍니다★"
70006010-18 = "그렇군요. 알겠습니다. 여러분의 뜻이 그러하다면……."
70006010-19 = "오늘도 급양부의 후우카 씨에게 ‘부탁’을 하러 가죠."
70006010-20 = "잠깐만. 그건……."
70006010-21 = "항상 ‘부탁’이 아니었던 것 같은데?!"
70006010-23 = "준코 씨. 부탁에도 여러 종류가 있는 거랍니다. 오해하면 안 돼요."
70006010-24 = "에헤헤, 난 부탁이든 뭐든 후우카가 만들어주면 전부 좋아!"
70006010-26 = "하아, 진짜 못 말려……."
70006010-30 = "응? 잠시만요."
70006010-31 = "이건…… 주리 씨?"
70006010-35 = "네. 쿠로다테 하루나입니다. 무슨 일이시죠?"
70006010-39 = "안녕하세요, 하루나 씨. 다름이 아니라 확인해 보고 싶은 게 있어서요."
70006010-40 = "혹시 후우카 선배 그쪽에 계신가요?"
70006010-42 = "후우카 씨라면 저희도 이제 만나러 가려던 참이었습니다만……."
70006010-43 = "근데 그거 우리한테 물어봐도 되는 거야?"
70006010-45 = "아, 연락이 안 되면 항상 여러분과 같이 계셨던 거 같아서요."
70006010-46 = "오늘은 아니었나 보네요."
70006010-47 = "대체 어디 가신 거지? 식용유가 다 떨어져서 새 걸 찾아야 하는데……."
70006010-48 = "아, 그거라면 주방 입구의 찬장 안쪽에 있을 거예요."
70006010-49 = "주방 입구의 찬장 안쪽……."
70006010-56 = "아, 찾았어요! 정말 감사합니다!"
70006010-58 = "뭐야? 뭔데? 왜 그런 것도 알고 있는데?"
70006010-59 = "우후후, 글쎄요?"
70006010-61 = "아무튼 덕분에 문제를 해결했네요. 감사합니다."
70006010-62 = "그럼 오늘도 선배를 잘 부탁드려요!"
70006010-66 = "……자연스럽게 우리한테 후우카를 찾아달라고 부탁하는 느낌이네."
70006010-67 = "흠, 후우카 씨가 주리 씨와 연락이 안 된다니, 대체 무슨 일일까요?"
70006010-68 = "설마 누가 후우카를 납치한 거야?"
70006010-69 = "만약 그렇다면 용서할 수 없네요."
70006010-70 = "그렇습니다. 우리가 아닌 누군가가 후우카 씨를 데려가는 건 있을 수 없는 일."
70006010-71 = "그런 이유로 지금부터 후우카 씨의 안전을 위한 수색 작업을 시작하겠습니다."
70006010-73 = "응! 후우카를 구해서 맛있는 요리를 해달라고 하자!"
70006010-75 = "결국 우리에게 협력하라는 거잖아?!"
70006010-76 = "우후후, 납치가 아니라 부탁이라니까요."
70006010-78 = "에헤헤, 그럼 일단 출발~!"
70006010-92 = "킁킁……."
70006010-93 = "으음, 이쪽에서 왠지 익숙한 냄새가 나는데?"
70006010-94 = "응! 분명 맛있는 냄새야!"
70006010-95 = "맛있는 냄새도 나긴 한데, 그거보다 더 익숙한 냄새랄까……?"
70006010-97 = "그렇다면 후우카 씨의 냄새가 틀림없네요."
70006010-98 = "와아! 준코는 후우카의 냄새도 알고 있는 거구나!"
70006010-99 = "무, 무슨 소릴 하는 거야……!"
70006010-105 = "냄새는 잘 모르겠지만 이쪽의 발자국을 보니 후우카 씨가 왔던 게 분명하네요."
70006010-106 = "평소에 후우카 씨가 즐겨 신는 신발의 모양이에요."
70006010-107 = "이 많은 발자국 중에서 그걸 구별할 수 있다고……?"
70006010-108 = "후우카 씨는 특별하니까요★"
70006010-110 = "평소 상점을 이용하던 후우카 씨의 패턴을 봐도 오늘은 샬레 주변인 이쪽의 상점가에 들렀을 가능성이 높죠."
70006010-111 = "분명 애용하던 가게가 이 근처에……"
70006010-112 = "다들 스토커가 따로 없잖아……!"
70006010-113 = "응? 잠깐. 저쪽에 있는 저 사람은……?"
70006010-119 = "……진짜로 여기 있었네."
70006010-120 = "자유롭게 식자재를 구매하고 있는 모습이네요. 납치를 당한 건 아닌 것 같아요."
70006010-121 = "하지만 이대로 내버려두면 위험하니 저희가 후우카 씨를 데려가야겠네요."
70006010-123 = "응, 응! 위험해지기 전에 우리가 보호하는 거야!"
70006010-124 = "……하아. 이제는 태클 거는 것도 힘들다."
70006010-135 = "너, 너희들 뭐야?! 여기는 어떻게 알고……!"
70006010-136 = "어머나, 왜 그렇게 놀라시나요, 후우카 씨?"
70006010-137 = "‘우리 사이’에 말이에요."
70006010-138 = "후우카~! 오늘 점심은 뭐~야~?"
70006010-140 = "주리 씨가 걱정하고 계셨어요."
70006010-141 = "주리가? 아……."
70006010-142 = "신경 쓸 게 많아서 연락이 온 줄도 몰랐네. 나중에 사과해야겠다."
70006010-143 = "신경 쓸 게 많아? 오늘은 평소보다 특별한 걸 만드는구나! 기대돼!"
70006010-144 = "뭐 특별하다면 특별한데……."
70006010-145 = "너희들, 오늘은 포기하는 게 좋을 거야. 여기서 날 납치하면 진짜 큰일 날걸?"
70006010-147 = "네? 설마 선도부의 히나 씨가 주변에 있기라도 한 건가요?"
70006010-148 = "앗! 다들 조심해!"
70006010-156 = "이 공격은 대체……."
70006010-170 = "당신들은…… 트리니티의 구호기사단?"
70006010-171 = "죽기 전까지 두들겨 패고 치료해 준다는 지독한 녀석들이잖아!"
70006010-172 = "저도 ‘미네가 부수고 기사단이 치료한다.’라는 소문을 들어본 적이 있네요."
70006010-174 = "뭐, 뭐야? 왜 저런 사람들이 후우카랑 있는데?!"
70006010-175 = "구호가 필요한 곳에 구호를!! 후우카 씨, 무사하십니까?"
70006010-177 = "설마, 소문이 다른 학교까지 퍼져있을 줄이야……."
70006010-178 = "에헤헤, 다치시더라도 말끔히 치료해 드릴 테니 너무 걱정 마세요!"
70006010-180 = "다친다는 걸 전제로 말하지 말라고!"
70006010-181 = "여러분의 이야기는 후우카 씨에게 들었습니다."
70006010-182 = "궁지에 몰린 약자를 수호하는 것 역시 구호의 일환."
70006010-183 = "구호기사단 단장 아오모리 미네…… 갑니다！"
70006010-222 = "고마워요, 아카리 씨. 덕분에 피했네요."
70006010-223 = "이거 위험해 보이네요★"
70006010-224 = "으아아, 아파! 무지 아파!"
70006010-225 = "하, 하루나! 어떻게 할 거야?!"
70006010-226 = "짧은 공방이었지만…… 고민할 것도 없네요."
70006010-230 = "여러분. 일단 후퇴!"
70006010-234 = "역시 그렇게 되는군요★"
70006010-240 = "놓치지 않습니다……!"
70006010-251 = "부상자가 발생했네요. 서둘러 치료해야겠어요."
70006010-252 = "자아, 움직이면 아프니까 가만히 계세요."
70006010-253 = "으아앙! 하루나! 아카리! 준코! 나도 같이 가! 버리고 가지 마……!"
70006010-255 = "미안해, 이즈미! 기억할게!"
70006010-256 = "으아아아앙! 복수할 테다! 죽어서 복수할 거야!!"
70006010-260 = "곤경에 처한 동료를 두고 가는 것…… 그것은 또한 동료로서의 도리를 저버리는 것."
70006010-261 = "그러한 여러분들의 정신에도, 저희 구호기사단은 결코 구호를 멈추지 않을 것입니다!"
70006010-262 = "맞아! 다 잡아버려!"
70006010-263 = "네가 말하는 거냐고!"
70006010-264 = "……어라?"
70006010-273 = "……구호의 이름으로 이렇게나 무자비한 제압이라니."
70006010-274 = "현장에서 치유하면 된다는 생각이 정말 무섭네요★"
70006010-276 = "자아, 준코 씨? 어서 다친 곳을 보여주세요."
70006010-277 = "아앗……! 여기는 좀 심하네요! 환부를 도려내야겠어요!"
70006010-279 = "노, 농담이지? 농담 맞지?!"
70006010-280 = "으으, 배만 안 고팠더라도 안 잡혔을 텐데……."
70006010-281 = "그런 말 하면서 내 팔 핥지 마……!"
70006010-283 = "……낙오된 두 분은 어쩔 수 없군요. 일단 후퇴하고 뒷일을 도모해야……."
70006010-287 = "……아카리 씨?"
70006010-288 = "아무래도, 저는 여기까지인가 봐요……."
70006010-289 = "하루나를 보호하다 부상을…… 뒤를 부탁해요……."
70006010-290 = "우후훗……."
70006010-295 = "아카리 씨……!"
70006010-300 = "이제 당신만 남았군요."
70006010-304 = "후후…… 후후후……."
70006010-305 = "저항해도 소용이 없겠군요. 항복입니다."
70006010-306 = "그나저나 놀랍네요. 대단하다는 건 알고 있었지만 이렇게 빨리 저희를 제압하실 줄이야."
70006010-307 = "과연, 부수기 담당의 미네 씨."
70006010-309 = "부, 부수기 담당이라니. 그건 잘못된 소문입니다!"
70006010-310 = "아무튼 저는 어떻게 되든 좋으니 동료들은 제대로 치료를 부탁드립……."
70006010-313 = "아, 이 상처는 전기톱을 써야 할 거 같은데요?"
70006010-314 = "으아아아앙……!"
70006010-315 = "하나에 쨩. 너무 그렇게 겁을 주면 안 돼요. 진짜라고 생각하잖아요."
70006010-316 = "응? 진짜였는데요?"
70006010-318 = "무서워! 저 해맑은 미소가 더 무서워!"
70006010-319 = "우후후, 대 핀치네요. 이럴 때일수록 체력을 보충해야……."
70006010-324 = "으아아, 왜 아카리도 내 팔을 핥는 거야!"
70006010-327 = "……제대로 치료를 부탁드립니다."
70006010-328 = "걱정할 필요 없습니다. 저 둘도, 어엿한 구호기사단이니까요."
70006010-329 = "가끔 크게 데어보는 것도, 좋은 약이 될 수도 있잖아?"
70006010-331 = "그러고 보니 궁금하군요. 왜 구호기사단 여러분들이 후우카 씨와 함께 있는 거죠?"
70006010-332 = "그, 그건……."
