[translation]
10034050-1 = "제5화;아이리를 위해"
10034050-4 = "[ns1] \"연락을 안 받는다고?\"\n[ns2] \"며칠간 나오질 않았다고?\""
10034050-7 = "아, 으, 으응……. 오늘로서 이틀째라……."
10034050-9 = "하루 정도는 그럴 수 있다 생각했는데, 아니 그래도……."
10034050-10 = "역시 연락까지 안 받는 건 좀 이상하잖아."
10034050-11 = "……반응을 보니, 선생님도 연락 못 받은 것 같은데."
10034050-12 = "설마 선생님도 모르는 거야? 지, 진짜 정의실현부에 신고라도 해야 하는 거 아냐, 이거?"
10034050-13 = "……짚이는 거라도 있다거나, 그런 것도 없어? 전혀……?"
10034050-14 = "[s3] \"……뭔가 이상한 점은 없었어?\"\n[s4] \"떠오르는 게 있다면 뭐라도 좋으니 말해줘.\""
10034050-17 = "그, 글쎄……? 그렇게 말해도……. 그다지 이상한 점은……."
10034050-18 = "딱히 싸우거나 그런 게 있었던 것도 아니고, 연습도 어설프긴 했지만 나름대로 진행되고 있었으니까."
10034050-19 = "솔직히 이런 상황은……. 상상도 못 했지. 다른 사람도 아니고 아이리의 일이니까 더더욱."
10034050-21 = "……차라리 내가 이틀 빠졌다 하면 다들 그러려니 했을 텐데 말이지."
10034050-22 = "그렇지. 나츠였다면……."
10034050-26 = "……아니, 왜 자기가 그걸 알고 있는 거야. 자기 입으로 할 말이야, 그게?"
10034050-27 = "애초에 알고 있으면 평소에 왜 그러는……."
10034050-28 = "전체적으로 눈에 띌 만한 건 없었지만, 이상한 게 있긴 했어."
10034050-29 = "…………?"
10034050-30 = "……뭐?"
10034050-31 = "미세하긴 했지만……. 있긴 했지. 어쩌면 그게 문제였을지도."
10034050-32 = "……이상한 거? 뭐야? 뭐 있었어, 우리?"
10034050-33 = "그렇게 딱 찍어 말할 만큼 거슬리는 일은 아니었으니까."
10034050-34 = "어쩌면 그냥 내 기분 탓이었을지도 몰라. 혹시나 해서 하는 말이지만, 너무 믿진 말고."
10034050-35 = "그래도 좋다면……. 음……. 뭐랄까……."
10034050-36 = "요 며칠의 아이리는……. 전과는 다르게……."
10034050-37 = "어딘가 잘 안 풀린다는 분위기였지."
10034050-38 = "[s5] \"잘 안 풀린다고?\"\n[s6] \"연습이? 연주 실력이?\""
10034050-41 = "묘하게 뻣뻣하고 굳어 있는 느낌. 극단적으로 말하자면, '쫓기는' 분위기마저 있었어."
10034050-42 = "본인은 최대한 내색을 하지 않고 웃기만 했으니 잘 안 보였을 거라 생각하겠지만 말이야."
10034050-43 = "역시 느끼고 있었네. 이런 데에선 눈치 빠른 녀석이라니까."
10034050-44 = "……뭐, 뭐야? 그런 게 있었어? 왜 나는 몰랐지……?"
10034050-45 = "거의 티 나지 않았던 건 사실이니까. 아니. 오히려 분위기적으로는 읽기 힘들 만큼 잘 참았지."
10034050-46 = "하지만 그렇다고는 해도……. 역시 조금 납득하기 어려운 상황이군. 그 아이리가 말도 없이 잠적한다는 건."
10034050-47 = "역시 무슨 일이 생긴 게……."
10034050-48 = "……응? ……뭐라고?"
10034050-49 = "짚이는 부분이 없는 건 아니야……? 그게 정말이야, 선생님?"
10034050-53 = "……선생님……? 왜 그쪽으로……."
10034050-54 = "그건 아이리가 놔두고 간 키보드……."
10034050-59 = "……? 그, 그건……?"
10034050-60 = "키보드 덮개 속에……. 종이가……?"
10034050-61 = "……쪽지인가."
10034050-62 = "뭐, 뭐? 쪽지? 왜 그런 게 거기……."
10034050-63 = "[s7] \"너희들 말대로, 아이리는 이런 아이니까.\"\n[s8] \"정말로 말도 없이 자리를 비울 리 없지.\""
10034050-66 = "무슨 내용이야……? 그, 그거 내가 봐도 돼……?"
10034050-72 = "……\"모두에게.\""
10034050-73 = "……\"미안해.\""
10034050-74 = "……???"
10034050-75 = "……?"
10034050-76 = "……미안해……?"
10034050-82 = "\"발목을 잡아서 미안해.\""
10034050-83 = "\"이대로는 안 될 것 같아, 대신할 수 있는 다른 좋은 사람을 알아보고 있어.\""
10034050-85 = "……뭐?"
10034050-90 = "\"꼭 좋은 결과가 있기를 바래. 너희는…….\""
10034050-91 = "\"너희는 나와 다르니까\""
10034050-92 = "……\"그러니 해낼 수 있을 거야\"……?"
10034050-93 = "…………???"
10034050-96 = "뭔……."
10034050-98 = "뭔 소리야 이게……?"
10034050-106 = "……저기, 있잖아."
10034050-107 = "근데 이거 맞아? 진짜 그냥 이대로 있으면 되는 거야, 우리?"
10034050-109 = "……? 맞냐니, 그건 또 무슨 소리야?"
10034050-110 = "선생님이 말했잖아. 아이리가 어디 있는지 짚이는 곳이 있으니, 가서 잘 이야기해 보겠다고."
10034050-111 = "짚이는 게 있다는 건 아이리의 문제점도 알고 있다는 거니까, 그 부분은 선생님한테 맡기는 게 맞지 않아?"
10034050-112 = "괜히 저번처럼 또 너희가 뭔가 한다고 나서다가는……."
10034050-118 = "…………? 왜 날 보는 거지……?"
10034050-119 = "아니. 그냥 예전에 너희들이 했던 짓이 떠올라서."
10034050-120 = "그렇지만 이상하잖아. 아무리 선생님이 아이리를 데리러 갔다고 해도, 근본적으로 뭐 해결된 건 없고."
10034050-121 = "그냥 여기서 두 사람이 올 때까지 손가락 빨며 기다리기만 하는 게 진짜 맞냐, 그 말이지."
10034050-122 = "선생님이 혼자 가겠다고 했잖아. 그럼 그게 맞는 거겠지. 뭔가 이유가 있겠지."
10034050-123 = "……아. 두 사람 올 때를 대비해 테이블에 아이리가 좋아하는 거라도 좀 늘어놓을까?"
10034050-124 = "1년치 민트초코를 한 번에 먹는 파티가 될 분위기네."
10034050-125 = "아잇, 진짜! 그런 이야기가 아니라고! 그런 이야기가!!"
10034050-126 = "애초에 이상하다는 생각은 안 들어? 아이리의 행동, 명백히 평소랑 달랐다고!!"
10034050-127 = "잠적에 대한 이야기만이 아니야. 이 일은 시작부터 좀 그랬어!"
10034050-128 = "아이리가 지금껏 그렇게까지 강하게 뭔가를 하자고 밀어붙인 적이 있던가? 처음 아냐?"
10034050-133 = "……확실히."
10034050-134 = "뭔가 좀 이상하긴 했지. 갑자기 밴드니 악기 연주니……."
10034050-135 = "프레데리카 셈라를 거론하며 우리까지 끌어들인 것 하며."
10034050-136 = "이후로도 뭔가 해야 한다는 강박관념에 시달리는 것 같았고 말이야."
10034050-137 = "왜 그렇게까지 밴드가 하고 싶었던 걸까? 왜 갑자기 악기 연주 같은 걸 하고 싶었을까? 아니……."
10034050-138 = "애초에 '뭐가 문제'였을까……?"
10034050-139 = "음음. 도중에 받은 불안감 자체 보다, 어째서 그런 감정이 됐는가에 초점을 맞추자는 건가."
10034050-140 = "훌륭한 발상이야. 기다리며 생각해 볼 만한 가치가 있는 일인 것 같네."
10034050-144 = "……???"
10034050-145 = "……음??"
10034050-146 = "그렇지만 그렇게 따지면, 이미 답은 나와 있는 거 아닌가?"
10034050-147 = "……? 그건 또 무슨 말이야? 답이 나와 있다니?"
10034050-148 = "언제부터 그렇게 밴드에 몰입하게 됐는지……. 짐작 가는 단서가 아예 없잖아?"
10034050-149 = "왜 없지? 우리가 연습하는 것에는 처음부터 명확한 목표가 있었잖아."
10034050-153 = "\"테스트를 통과한다\"는 목표가."
10034050-154 = "그런 아이리가 연습에 몰입했다면, 그것은 떨어질까 두려워서였겠지. 당연한 거 아닌가?"
10034050-156 = "아니, 그러니까 왜 떨어지면 안 되냐고. 지금 그걸 이야기하고 있잖아."
10034050-157 = "테스트 자체가 우릴 꼬시려는 변명이었다니까? 그 자체가 중요한 게 아니라고!"
10034050-158 = "그렇지. 아무래도 그건 좀 비약이지. 어차피 떨어져 봐야 잃는 건……."
10034050-159 = "프레데리카 셈라밖에……."
10034050-163 = "……?"
10034050-164 = "……?"
10034050-165 = "……?"
10034050-169 = "……!!"
10034050-170 = "……어……!"
10034050-171 = "어어어어-!!! 잠깐만!!"
10034050-172 = "……? 또 무슨 소릴 하려고……."
10034050-173 = "잠깐!! 잠깐 생각을 좀 해보자. 뭔가 지금 흩어져 있던 퍼즐들이 순식간에 맞춰지는 느낌인데……!!"
10034050-174 = "아이리 같은 애가 갑자기 평소보다 적극적으로 '밴드를 하자'라고 주장했지?"
10034050-175 = "당연히 받아들여지지 않을 내용이었던 그 소리를 한 뒤에……. 아이리가 어떻게 했지?"
10034050-176 = "……전단지를 보여주며 테스트로 우리를 설득했지."
10034050-177 = "통과하면 '프레데리카 셈라'를 먹을 수 있다-면서, 마치 그걸로 우릴 꼬시기 위함인 것처럼."
10034050-178 = "……마치 '겸사겸사'인 것처럼."
10034050-179 = "만약, 만약에 진짜 만약에!! 빙빙 돌려서 말했지만 사실……."
10034050-183 = "……사실은 '그 반대'였다면……!?"
10034050-188 = "아니, 아냐. 요시미. 아무리 그래도 그건 아니잖아."
10034050-189 = "뭐가 아니지? 딱 평소의 아이리 화법인데?"
10034050-190 = "에이, 아무리 그래도 말이 되냐고, 그게……."
10034050-191 = "믿기 힘들지만, 때론 그게 현실일 때도 있는 법."
10034050-193 = "진짜 맞는 거 같은데? 맞다니까! 백 프로다, 백 프로!! 이건 백 프로야!!"
10034050-194 = "다른 이유가 없잖아! 아무리 생각해도!!"
10034050-195 = "이러면 당연히 실력이 안 느는 게 신경 쓰이지!! 게다가 자기가 생각해도 화나겠지!!"
10034050-196 = "사실 처음부터, 자기가 제일 셈라를 먹고 싶었던 거니까!!"
10034050-197 = "무조건 붙어야 하니까!! 떨어지면 셈라를 못 먹으니까!!"
10034050-203 = "……진심이야? 정말 그거 하나 때문에 일을 이렇게까지……?"
10034050-204 = "이렇게까지-라고? 그럼 아이리 성격에, 잘도 '아! 나 셈라 먹고 싶은데 너희들 협조해서 밴드좀 해라!!'라고 할까? 할 수 있겠냐?"
10034050-205 = "……절대 못 하지. 나츠도 아니고."
10034050-207 = "그……. 오늘 나 좀 많이 맞는 거 같다……."
10034050-208 = "아무튼 그러니까……. 본인은 처음부터 밴드에 관심이 있다는 듯이 말하며, 나머지는 셈라로 꼬시는 방식을 택했다."
10034050-209 = "하지만 결국, 궁극적인 목표는 본인 스스로 셈라를 죽어도 먹고 싶었던 것이다."
10034050-210 = "그치? 맞지? 내 말 맞지? 너무 아귀가 딱 맞잖아!? 이거 완전 아이리 스타일이라니까!? 하루 이틀 보냐!?"
10034050-211 = "화, 확실히……. 그건 그렇지만……."
10034050-212 = "그럴싸하기는 한데……. 아이리가……. 음……. 그 아이리가……. 그런 식으로 우리한테……."
10034050-213 = "……? 왜?? 뭐, 나쁜 짓한 것도 아니잖아? 그 정도는 말 안 할 수도 있는 거 아냐?"
10034050-214 = "애초에 통과하면 우리도 다 같이 먹을 수 있다는 건 거짓말도 아니었고, 그러니 아이리 성격 상 마음 편하게 권할 수 있겠고……."
10034050-215 = "스스로에게 할 변명으로서도 나쁘지 않았다는 거지. 성사만 되면, 완벽했을 전략."
10034050-216 = "……그런데 만약."
10034050-217 = "만약 그게, 다른 것도 아닌 '본인의 실력' 문제로 좌절된다면……."
10034050-218 = "그래. 당연히 멘탈 나가지! 이건 완전히 멘탈 나갈 수밖에 없지!! 나라도 나가겠다!!"
10034050-219 = "너희라면 괜찮겠냐, 그런 상황에서? 어쨌거나 일을 벌인 것도 본인인데?"
10034050-220 = "봐라. 그러면 자기 때문에 셈라를 못 먹게 되는 게 싫어서, 다른 멤버를 구하겠다던 뻘소리도……."
10034050-221 = "……진짜냐……."
10034050-222 = "……음. Q.E.D네, 이건."
10034050-226 = "……하아……."
10034050-227 = "아이리, 아이리……."
10034050-228 = "아이리이이~!! 이 바보 같은 녀석아!! 그냥 처음부터……!! 아으~!!!"
10034050-229 = "그게 안 되는 아이라는 건 너도 네 입으로 말했잖아."
10034050-230 = "그건 그렇지만……!! 아으으으~~!!!!"
10034050-231 = "결국 핵심 포인트는 셈라인가. 우리가 어떻게든 셈라를 구해서 가져다주면 해결되겠군."
10034050-232 = "그게 지금 가질 수 있는 최고의 해피엔딩……. 음. 의외로 록하구만."
10034050-233 = "아니, 셈라를 구한다는 건 그렇게 쉽게 할 수 있는 일이 아닌 거 같은데. 테스트 통과도 확신은 없고……."
10034050-234 = "솔직히 말해, 아이리가 아닌 다른 사람과 합주해서 테스트하는 것 자체도 내키진 않고."
10034050-235 = "물론이지. 아니, 그 이전의 문제야."
10034050-236 = "테스트가 당장 내일도 아니고, 1주일이나 더 남았다고, 그전까지 아이리를 저 꼴로 그냥 보고 있어라……?"
10034050-237 = "아아~. 안되지, 절대 안 되지. 눈에 흙이 들어가도 그 꼴은 못 보겠는데!"
10034050-238 = "당장 구해야겠어. 할 수만 있다면 당장 내일이라도 구해서, 본인 입에 셈라를 밀어 넣어주고야 말겠어!"
10034050-239 = "말에는 공감하지만 방법이 없다니까. 셈라는 길거리에서 파는 보통 물건이 아니라고."
10034050-240 = "애초에 사육제 운영위원회 정도는 되는 곳이니까 구할 수 있을 만큼 귀했던 거잖아. 우리가 그걸 어떻게 구해?"
10034050-241 = "그, 그건……."
10034050-248 = "……?"
10034050-249 = "……왜 못 구하지? 가서 구하면 되잖아?"
10034050-250 = "……!? 뭐!?"
10034050-251 = "구할 데가 있다고!? 그걸……!?"
10034050-252 = "……?"
10034050-253 = "왜 되묻는 거지……? 방금 네 입으로 말했잖아."
10034050-254 = "……\"사육제 운영위원회에서 구해 놓았다\"고 말이야."
10034050-255 = "……?"
10034050-256 = "아니, 하……. 무슨 소릴 하나 했더니……."
10034050-257 = "말이 되는 소릴 해라. 가서 달라고 한다고 줄 거였으면 애초에 그게 상품이었겠냐."
10034050-258 = "아니. 나츠 말뜻이 그걸 가서 구걸하자는 이야기는 아닌 것 같은데……."
10034050-262 = "……설마 무대포로 가져오자는 뜻이야? 아니지? 그런 말도 안 되는 소리는 아니겠지?"
10034050-263 = "애초에 거기, 교내 중심부라고. 이 행사는 티파티 주관의 행사라고."
10034050-264 = "운영위원회 학생들이 밤새도록 교대하며 지키고 있을 텐데……."
10034050-265 = "눈 피해서 들어가려면 담도 넘어야 하고, 중간에 걸릴 게 뻔하니 한판 뜨기도 해야 하고……."
10034050-266 = "무리잖아. 무리인 게 당연하잖아."
10034050-267 = "내 입으로 이렇게 말하는 것도 우습지만, 우리처럼 온실 속 화초로만 자란 애들이 어떻게 그런 짓을 해?"
10034050-268 = "할 줄 아는 사람이 있어서 가르쳐 주기라도 하면 모를까……."
10034050-269 = "……정말이지 계속해서 이상한 소리를 하는군, 요시미."
10034050-270 = "네 눈에는 보이지 않는 건가? 아니면 너무 당연해져서 잊어버렸나? '담도 넘고 싸움도 할 줄 아는 존재'가?"
10034050-271 = "……엉?"
10034050-276 = "여기 있잖아. 우리 같은 '온실 속 화초'가 아닌, 은퇴한 뒷세계의 괴물이자 잠든 마수……."
10034050-281 = "……'전설'이."
10034050-286 = "……!?!? 잠깐. 나츠, 너!! 또 그딴 소릴……!!"
10034050-291 = "미안하지만, 나는 지금 매우 진지해. 늘 진지하지만, 오늘은……."
10034050-292 = "그래. 진지함을 넘어서 '중대'하지."
10034050-293 = "사실 스스로도 알고 있지 않나? 이 수밖에 없다는 걸. 정말로 다른 방법이 없다는 걸."
10034050-294 = "그, 그건……!"
10034050-295 = "오히려 너의 과거는 오직 지금 이 순간을 위해 존재했던 게 아닐까? 그런 운명이지 않나?"
10034050-296 = "오히려 내심 지금, 잠시나마 '마침 내가 그 힘이 있다'라고 생각하지 않았나? 쿄야마 카즈사?"
10034050-297 = "아니, 그러니까 그……."
10034050-298 = "그……! 크윽……!"
10034050-299 = "…………."
10034050-305 = "……하아……."
10034050-306 = "……일단 먼저 말해 둘 게."
10034050-307 = "나라고 성공한다는 보장은 없어. 정의실현부가 연락받고 출발할 때까지 끌면 끝이야."
10034050-308 = "……그리고 성공한다 해도……. 그 뒤에 어떻게 될지는 당연히 알고 있겠지?"
10034050-309 = "티파티 주관 행사의 커맨드 센터를 밤중에 습격한 죄……? 당연하지."
10034050-314 = "……<방과후 디저트부>는 오늘까지다. 내일부터 이런 이름의 동아리는, 제명돼서 없을 테니까."
10034050-315 = "방도 없고 지원금도 없다. 사실상 길거리에 나 앉는 거지."
10034050-316 = "뭐야, 의외로 잘 알고 있네. 그걸 알면서도……."
10034050-318 = "……그래서?"
10034050-320 = "그래서……. 뭐?"
10034050-321 = "……못하겠다고?"
10034050-322 = "쿄야마 카즈사. 너 스스로는 어떻지? 정말로 그것 때문에 못 할 거 같아?"
10034050-323 = "옆을 먼저 물어볼까? 요시미는 어떻지?"
10034050-324 = "……?"
10034050-325 = "나 뭐?"
10034050-326 = "뭔 상관이야? 동아리 없으면 못 만나냐? 이런 것도 못 챙겨줄 거면, 그런 동아리 필요 없는데?"
10034050-327 = "단톡 방이나 파서 개인적으로 모이면 되지."
10034050-328 = "집이랑 학교에서 욕이야 좀 먹겠다지만……. 뭐, 죽는 것도 아니잖아?"
10034050-329 = "나머지는 다 같이 봉사활동 좀 채우든 정학 좀 당하든 다 받아 주면 되는 거 아니냐고."
10034050-330 = "애초에 여긴……."
10034050-335 = "……요시미. 너……."
10034050-336 = "……자. 들었지? 셋이 똑같은 마음인데, 괜히 확인하고 맞추느라 여기서 시간 더 끌지 말자."
10034050-337 = "특히 카즈사, 사실 네가 제일 하고 싶다는 건 바보가 아닌 이상 우리도 알고 있어."
10034050-338 = "……나츠."
10034050-339 = "……시간이 없다. <쿄야마 카즈사>. ……트리니티에 잠든 마수여."
10034050-340 = "너도나도 이런 날이 올 줄은 몰랐겠지만……."
10034050-346 = "……다시 한번, <방과후 디저트단>으로 돌아갈 때다."
10034050-352 = "오늘 밤……. 마수가, 사냥에 참여한다."
10034050-357 = "아이리를 위해. ……아니."
10034050-358 = "……모두를 위해."
10034050-364 = "……카스팔루그가 되어줘."
