[translation]
2005002-1 = "돌이 말했어!"
2005002-2 = "샬레 사무실"
2005002-3 = "(다음 날.)"
2005002-7 = "(오기로 했던 시간보다 30분이 더 지났는데…….)"
2005002-8 = "(리츠는 아직도 오지 않았다.)"
2005002-9 = "[ns]\"연락해도 받질 않네…….\""
2005002-10 = "(그렇게 걱정되는 마음에 사무실을 서성이던 중, 무심코 창밖을 본 그때.)"
2005002-14 = "[ns]\"……리츠?\""
2005002-15 = "(창밖으로 리츠가 보였다.)"
2005002-16 = "(앞뜰에 놓인 바위를 망치와 끌로 두드리고 있는 리츠가.)"
2005002-17 = "[ns]\"……뭐 하고 있는 거지?\""
2005002-20 = "샬레 앞뜰"
2005002-21 = "(그렇게 1층으로 내려온 순간 보인 것은.)"
2005002-22 = "(자기 몸보다도 훨씬 더 큰 조경석을 깎고 있는 리츠였다.)"
2005002-23 = "[ns]\"저기, 리츠……?\""
2005002-25 = "어! 선생님이다!"
2005002-26 = "안녕하세요!"
2005002-27 = "맞다! 나 당번이었지!"
2005002-28 = "[ns1]\"안녕, 리츠.\"\n[ns2]\"그런데 조경석을…… 조각하고 있는 거야?\""
2005002-31 = "응! 이 바위가 나한테 말을 걸었거든!"
2005002-32 = "[s]\"돌이 말을 걸었다고……?\""
2005002-33 = "응! 모든 돌의 안에는 각자의 형상이 잠겨 있거든."
2005002-34 = "이 조경석은, 자신이 품고 있는 아름다움을 내게 이야기해 줬어."
2005002-35 = "그래서……."
2005002-36 = "부쉈어!"
2005002-37 = "[s]\"뭐요?!\""
2005002-38 = "겉면을 부수고 깎아내야 안에 담긴 형상을 밖으로 꺼낼 수 있으니까."
2005002-39 = "거칠고 울퉁불퉁한 표면 때문에, 겉으로 드러날 수 없었던 아름다운 형상을……."
2005002-40 = "[ns3]\"그런 얘기였구나…….\"\n[ns4]\"그러면 그런 말을 먼저 해줘……!\""
2005002-43 = "[ns]\"그런데…… 이거 교칙상 괜찮은 거야?\""
2005002-44 = "응? 당연히 안 괜찮……."
2005002-45 = "……."
2005002-46 = "근데 그래서 말인데 선생님!"
2005002-47 = "[s]\"얼버무렸어!\""
2005002-53 = "나 목말 태워주면 안 돼?"
2005002-54 = "[s]\"이미 올라타셨는데요?\""
2005002-55 = "높다!"
2005002-56 = "헤헤, 내가 키가 작아서 돌의 윗부분에는 손이 닿지 않았거든!"
2005002-57 = "이제는 제대로 조각할 수 있겠다! 고마워 선생님!"
2005002-60 = "(그렇게 리츠는 목말을 탄 채로 돌을 깎았고…….)"
2005002-61 = "(……그 밑으로는 쉼 없이 돌가루가 떨어졌다.)"
2005002-65 = "음, 이제 조금만 더 다듬으면 되겠다!"
2005002-66 = "마지막으로 이쪽 측면을…… 응?"
2005002-67 = "헉 선생님, 괜찮아? 얼굴이 돌가루투성이인데?!"
2005002-68 = "[s]\"프픕 픕 프브븝.\""
2005002-69 = "어, 어떡하지?"
2005002-70 = "아! 뒤로 돌아선 채로 목말 태워주면 되겠다!"
2005002-71 = "그러면 적어도 얼굴에는 돌가루가 안 묻을 테니까!"
2005002-72 = "[s]\"아니에요! 괜찮습니다!!\""
2005002-73 = "엥 그래? 좋은 방법일 줄 알았는데."
2005002-74 = "그럼 이대로 계속하겠습니다!"
2005002-77 = "(이후, 조각은 순조롭게 마무리되었다.)"
2005002-79 = "좋아! 조각 끝!"
2005002-80 = "[s]\"고생했어, 리츠.\""
2005002-81 = "고맙습니다, 선생님, 헤헤."
2005002-82 = "[s5]\"그나저나 이 조각상은…….\"\n[s6]\"뭐라고 하면 좋으려나…….\""
2005002-85 = "감상을 말하려고?"
2005002-86 = "그거라면 말하지 않아도 돼!"
2005002-87 = "[s]\"응?\""
2005002-88 = "처음 본 작품에 대한 감상을 그 자리에서 말하는 것."
2005002-89 = "그거 굉장히 난감한 일이잖아?"
2005002-90 = "어떤 맥락에서 작품을 해석해야 할지도 모르겠고, 당장 어떤 용어를 쓰는 게 적절한지도 모르겠고."
2005002-91 = "거기다 작품을 만든 사람이 이렇게 옆에 있기까지 하면, 솔직해지기도 어렵고."
2005002-92 = "그러니까, 앞으로 이 조각을 보면서 차곡차곡 쌓인 생각이 어느 날 입 밖으로 나오면……."
2005002-93 = "그때 감상을 말해 줘, 선생님!"
2005002-94 = "[s]\"배려해 줘서 고마워 리츠.\""
2005002-95 = "그래서 말인데 이 조각, 사무실 안으로 들어서 옮겨 줄까?"
2005002-96 = "[s]\"구미가 당기는 제안이긴 한데…….\""
2005002-100 = "[ns7]\"그래도 이런 작품은, 더 많은 사람들이 볼 수 있도록…….\"\n[ns8]\"이 앞뜰에 둘 때, 가장 아름다울 거라 생각해.\""
2005002-103 = "아……."
2005002-104 = "……고마워, 선생님."
2005002-105 = "오늘, 뭔가 굉장히 뿌듯한 하루로 기억될 것 같아!"
2005002-106 = "[s9]\"속단하긴 일러, 리츠.\"\n[s10]\"아직 당번 일이 산더미처럼 남았거든.\""
2005002-109 = "……아."
2005002-110 = "[s]\"우리 함께 가볼까! 업무의 세계로!\""
2005002-111 = "흐엥……!"
2005002-113 = "(그렇게, 당번 리츠와 함께 저녁까지 남은 일들을 해치웠다.)"
