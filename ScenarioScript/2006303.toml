[translation]
2006303-1 = "소녀의 욕심"
2006303-2 = "휴우, 고마워 선생님."
2006303-3 = "아직 커다란 쇼핑몰은 잘 모르는 게 많아. 사야 하는 물건도 많고,"
2006303-4 = "그리고, 에스컬레이터도 아직 조금 무서워서……."
2006303-5 = "하지만, 선생님 덕분에 극복했어. 도움이 됐어."
2006303-6 = "[s1] \"도움이 된 것 같아서 다행이야.\"\n[s2] \"그러고 보니, 와이퍼를 여러 개 샀네?\""
2006303-9 = "응. 전차에 들어가는 와이퍼 종류가 많거든."
2006303-10 = "그리고, 관측창마다 와이퍼가 하나 이상 들어가다 보니 여러 개가 필요한데……."
2006303-11 = "……아, 하나 빼먹은 게 있었네. 아까 다른 가게에 있다고 했던 거, 지금 보러 가자."
2006303-16 = "길 잃어버리지 않게 옆에 꼭 붙어 있어야 해. 알겠지?"
2006303-17 = "[s] \"미아가 되지 않게 노력할게!\""
2006303-18 = "좋아."
2006303-20 = "차량용품 상점"
2006303-23 = "좋아, 차장 큐폴라용 와이퍼 세 개, 여기 있었네."
2006303-27 = "이걸로 목표는 달성. R2B하자."
2006303-28 = "음……?"
2006303-32 = "이, 이건……! 어째서 차량용품 코너에 모모프렌즈가?!"
2006303-33 = "[s] \"콜라보한 차량용품인 것 같아.\""
2006303-34 = "세, 세상에 이런 코너가! 이런 파렴치한 차량용품 가게가!!"
2006303-35 = "타락했어! 여기는 타락한 곳이야!!"
2006303-36 = "[s] \"하지만 귀엽지?\""
2006303-37 = "당연하지, 너무 귀여우니까 위험하다고 하는 거야!"
2006303-38 = "보면 판단력이 둔해지고…… 끌어안고 싶어지고, 부비부비 하고 싶은 충동이 든단 말이야."
2006303-39 = "……그런데, 차량용품하고 모모프렌즈가 무슨 관련이 있는 거지?"
2006303-43 = "아, 앗…… 설마……!"
2006303-44 = "이 폭신하고 귀여운 인형을 전차 포신에 넣어서 닦는 거야……?"
2006303-45 = "[s] \"그럴듯한 추측이지만 전혀 아닙니다!\""
2006303-50 = "그렇구나, 차량 실내에 구비해두는 귀여운 용품들이었다니."
2006303-54 = "이 동그란 건 손이 시리지 않게 하는 부드러운 핸들커버."
2006303-58 = "그리고 길쭉한 핑키파카 인형은, 안전벨트에 끼우는 쿠션이구나."
2006303-62 = "모두 폭신폭신 둥글둥글, 귀여워."
2006303-66 = "으음……."
2006303-67 = "[s3] \"갖고 싶은 게 있니?\"\n[s4] \"선생님이 사줄까?\""
2006303-70 = "갖고 싶은 건…… 많지만, 사실 전부 가지고 싶지만……."
2006303-71 = "이거, 전차 안에 둬야 하는 거잖아. 차량용품…… 이니까."
2006303-72 = "소중하고 귀여운데, 전차가 망가지면 같이 망가지는 게 싫어."
2006303-73 = "무언가를 잃었을 때의 감각…… 텅 비고, 허무한 건, 싫어."
2006303-74 = "……미안 선생님. 그 정도의 일이 아닐 텐데, 어쩐지 그렇게 생각이 들어버렸어."
2006303-75 = "[s5] \"충분히 이해돼!\"\n[s6] \"그렇다면, 이건 어떨까?\""
2006303-81 = "……!"
2006303-82 = "이거…… 라면……."
2006303-83 = "응, 좋아. 이거면 좋아."
2006303-84 = "……후훗……."
2006303-87 = "<라벤더 스컬맨 차량용 방향제>, 여기 있습니다. 여기 영수증입니다."
2006303-88 = "기본적으로 향이 강하니 송풍구 장착 시에 위치 조정 해 주시면 됩니다."
2006303-92 = "고마워, 선생님."
2006303-93 = "방향제라면 차 안에 잠시 두는 소모품이고, 향이 소진되면 방에 간직할 수 있으니까."
2006303-94 = "이거라면 안심이야."
2006303-95 = "[s] \"아즈사가 기뻐하니 선생님도 기쁘단다!\""
2006303-96 = "이러면, 운전 중에도 스컬맨과 함께 있을 수 있어."
2006303-97 = "심지어 선생님이 선물해줬고."
2006303-98 = "소중하게 다룰게. 고마워."
2006303-102 = "이만 돌아가자, 다들 기다릴 거야."
2006303-104 = "(다음날, 아즈사가 픽업해주기로 했기에 주차장으로 찾아갔다.)"
2006303-109 = "[ns7] \"전차는 있는데…….\"\n[ns8] \"아즈사? 어디 있니?\""
2006303-112 = "여기야 선생님, 전차 안으로 들어와."
2006303-118 = "[ns9] (전차 안으로 들어가자…….)\n[ns10] (눈과 코가 찌르듯이 따끔거렸다.)"
2006303-121 = "선생님, 괜찮아?"
2006303-122 = "미안, 선생님. 방독면이 없었어."
2006303-123 = "선생님도 눈 밑에 치약 발라줄게. 그러면 눈이 덜 따끔거릴 거야."
2006303-124 = "[ns] \"아즈사?! 이 매캐한 냄새는 뭐야?\""
2006303-125 = "어제, 해산하고 바로 스컬맨 방향제를 달았어."
2006303-126 = "그런데, 하나만 있으니 조금 외로워 보여서……."
2006303-127 = "다시 가게로 돌아가서, 나머지 친구들도 다 사서 설치했거든."
2006303-128 = "한 번에 전부 달았더니 CS탄 같은 냄새가 되어버렸어."
2006303-129 = "역시, 욕심부리면 안 됐었나 봐."
2006303-130 = "[s] \"친구들도 모아 주다니, 아즈사는 상냥하네!\""
2006303-134 = "상냥…… 해?"
2006303-136 = "(이후, 방향제의 교체 향 부분을 빼서 지퍼백에 밀봉해주었다.)"
2006303-137 = "(사이좋게 늘어선 방향제 인형과 적당한 향기에 아즈사의 기분이 좋아 보였다.)"
