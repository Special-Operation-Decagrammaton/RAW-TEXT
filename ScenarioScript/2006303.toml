2006303-10 = "3;아즈사 레이싱;99;그리고, 관측창마다 와이퍼가 하나 이상 들어가다 보니 여러 개가 필요한데……."
2006303-11 = "3;아즈사 레이싱;02;……아, 하나 빼먹은 게 있었네. 아까 다른 가게에 있다고 했던 거, 지금 보러 가자.\n#3;em;[!]"
