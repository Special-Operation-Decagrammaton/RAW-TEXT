[translation]
901010400320-6 = ""
901010400320-7 = "สวัสดีค่ะ ฉันมาจาก <FOX EATS> ค่ะ!"
901010400320-8 = "เอ๋ ที่เป็นบริษัทส่งอาหารน่ะเหรอ?"
901010400320-9 = "วันนี้ไม่มีใครสั่งอาหารไว้นะ... มาผิดหรือเปล่า?"
901010400320-10 = "อ้อ วันนี้ <FOX EATS> เพิ่งเริ่มให้บริการจัดส่งในท่าเรือคาเนะซากิค่ะ"
901010400320-11 = "ฉันก็เลยว่าจะแนะนำร้านอาหารใหม่ๆ ให้ลูกค้าของเรา..."
901010400320-12 = "ฉันขอหยิบใบปลิวเมนูของทางร้านไปสัก 2-3 แผ่นได้มั้ยคะ?"
901010400320-13 = "ได้อยู่แล้ว"
901010400320-14 = "ใบปลิวมีเยอะแยะ หยิบไปได้ตามสบายเลย"
901010400320-15 = "ขอบคุณค่ะ!"
