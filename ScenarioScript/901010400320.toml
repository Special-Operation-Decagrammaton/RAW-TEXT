[translation]
901010400320-7 = "안녕하세요, <FOX EATS> 입니다!"
901010400320-8 = "어라, 배달 대행 업체인가?"
901010400320-9 = "오늘은 배달 주문이 없었는데…… 뭔가 착각한 거 아냐?"
901010400320-10 = "아, <FOX EATS>는 오늘 부터 카네사키 항만의 배달 서비스를 시작했거든요."
901010400320-11 = "그래서 새로운 음식점을 고객 여러분께 추천할까 하는데……"
901010400320-12 = "혹시 여기 있는 메뉴 전단지를 조금 가져가도 괜찮을까요?"
901010400320-13 = "그야 물론이지."
901010400320-14 = "전단지야 잔뜩 쌓여있으니 원하는 만큼 가져가."
901010400320-15 = "감사합니다!"
