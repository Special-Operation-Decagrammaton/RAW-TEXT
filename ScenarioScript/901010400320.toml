901010400320-8 = "嗯？是外送平台嗎？"
901010400320-9 = "今天沒有外送訂單啊……是不是搞錯了？"
901010400320-10 = "啊，因為「FOX EATS」從今天開始將在鐘崎港提供外送服務……"
901010400320-11 = "所以我想向各位顧客推薦新的餐廳……"
901010400320-12 = "請問可以帶走一些這裡的傳單嗎？"
901010400320-13 = "當然可以。"
901010400320-14 = "傳單堆了一大堆，你想拿多少就拿多少。"
901010400320-15 = "謝謝您！"
