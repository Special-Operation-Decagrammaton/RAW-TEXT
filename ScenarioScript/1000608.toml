[translation]
1000608-1 = "선생의 오해"
1000608-2 = "키보토스 주택가"
1000608-3 = "주택가의 좁은 골목 사이."
1000608-5 = "……누군가가 파 놓은 깊은 구덩이에 이오리가 빠져 있다."
1000608-6 = "[s] \"……….\""
1000608-7 = "………."
1000608-8 = "[s] \"……어째서 그 안에 있는 거야?\""
1000608-9 = "보면 모르겠어? 함정에 빠진 거잖아!"
1000608-10 = "게헨나 자치구 내에서 말썽을 부린 헬멧단 녀석들을 추적하던 중에, 갑자기 막다른 길로 유인하기에 무슨 생각인가 했더니……"
1000608-11 = "바닥에 함정을 파두었더라고! 비열한 녀석들 같으니라고!"
1000608-12 = "……너무 뻔히 보이는 함정이라서 속는 게 더 이상해 보인다고? #n그, 그야 그렇긴 하지만……!"
1000608-13 = "어쩔 수 없잖아! #n목표를 고정하면 그 이외의 것은 눈에 들어오지 않는걸."
1000608-14 = "나는 게헨나 선도부의 냉혹한 집행부원. #n눈에 들어온 목표는 놓치지 않아!"
1000608-16 = "……그보다 언제까지 계속 쳐다보고만 있을 거야? #n빨리 꺼내달라고!"
1000608-17 = "[s] 핸드폰을 들어 이오리의 사진을 찍는다."
1000608-19 = "뭐, 뭐하는 거야! 자, 잠깐!"
1000608-21 = "찌, 찍지 마! 찍지 말라고!"
1000608-22 = "어째서 사람이 곤경에 빠진 모습을 사진으로 남기는 거야, 이 악마! 변태!"
1000608-23 = "[s1] \"곤경에 빠진 이오리의 모습이 너무 귀여워서.\"\n[s2] \"평소에는 볼 수 없는 귀중한 광경이라 그만.\""
1000608-24 = "사람의 곤경을 뭐로 생각하는 거야? 그래도 안 돼!"
1000608-25 = "사람의 곤경을 뭐로 생각하는 거야? 그래도 안 돼!"
1000608-27 = "으으…… 으으윽……!"
1000608-28 = "으으…… 역시 자력으로 빠져나가는 건 무리야."
1000608-29 = "이곳에서 나가기만 해봐! 가만두지 않을 테니까!"
1000608-31 = "이후, 한식경 넘게 이오리가 고생하는 것을 지켜보다가 끌어올려 주었다."
1000608-34 = "……그리고 함정에서 빠져나온 이오리에게 정강이를 걷어차였다."
