[translation]
13260-1 = "제26화;최후의 전투 2"
13260-4 = "[ns] \"…………!!!\""
13260-5 = "하아…… 하아……."
13260-6 = "너, 너무 강해……."
13260-7 = "이게 호시노 선배의 진짜 힘……?"
13260-9 = "아직, 아직이에요……!!"
13260-11 = "아니, 여기까지야."
13260-16 = "아, 다, 다리에 힘이 풀려서……."
13260-20 = "노노미 선배! 괜찮아?"
13260-21 = "저, 저도 모, 못 움직이겠어요……."
13260-22 = "으, 으으…… 나, 나도 사실은…… 아까부터 다리가……."
13260-27 = "하아…… 하아……."
13260-28 = "시로코 쨩. 더 할 수 있겠어?"
13260-32 = "……. 덤벼. 승부야."
13260-33 = "그치만 그만두는 편이 좋아……. 4:1로도 무리였잖아? 혼자서 어쩌려고?"
13260-34 = "나는 나보다 약한 녀석의 말을 듣지 않아. 그러니까 덤벼. 호시노."
13260-35 = "……."
13260-36 = "응. 저번에 한 번 싸워봤으니까. 지지 않아."
13260-37 = "……. 그런가."
