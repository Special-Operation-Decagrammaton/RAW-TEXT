[translation]
90101030-1 = "Episode 3;The Crab and the Drum Barrel"
90101030-2 = "General Student Council Executive Office"
90101030-3 = ""
90101030-4 = "...Crab, you say?"
90101030-5 = ""
90101030-7 = ""
90101030-8 = ""
90101030-9 = "Yes. Crabs. Known for their hard shells, wide-set eyes, and clacking claws?"
90101030-10 = "Have you ever seen a live crab, Yukino?"
90101030-11 = "I have."
90101030-12 = "When training in the summer, we'd pass through the mudflats. I used to see crabs scuttling along in groups."
90101030-13 = "Mudflats? Sounds intriguing."
90101030-14 = "I've been so busy with the General Student Council... I can't even remember the last time I went to the beach."
90101030-15 = "That sounds rough."
90101030-16 = "But why did you suddenly bring up crabs? I thought we were discussing missing persons cases."
90101030-17 = ""
90101030-19 = ""
90101030-20 = "Well, Yukino...they're related. These crustaceans are the chief suspects behind these disappearances."
90101030-21 = "I don't understand..."
90101030-23 = "An increasing number of people have gone missing near Kanesaki Port."
90101030-24 = "We can't tell whether these are just simple fall accidents, people intentionally going into hiding, or...something more."
90101030-25 = "Multiple people have posted online, claiming that they've seen the infamous \"Drum Barrel Crabs\" at the port."
90101030-26 = ""
90101030-27 = "Yukino."
90101030-28 = "Can the FOX Squad investigate this? I want everything you can find on the \"Drum Barrel Crabs.\""
90101030-30 = "[ns] \"...'Drum Barrel Crabs'?\""
90101030-31 = "Yes. It started with a gruesome urban legend. Imagine an oil drum filled with hundreds of scuttling crabs."
90101030-32 = "The crabs inside the barrel are said to be so ferocious and famished that they can strip the meat off a bone...and then break THAT down, too."
90101030-33 = "...Most rumors affiliated with the drum barrel crabs tend to be simple, as well."
90101030-34 = "Most notably, people say that disgruntled fishermen at Kanesaki Port are known to fill a drum barrel with crabs when they harbor a grudge."
90101030-35 = "Then they take someone to a secluded spot and throw them into the barrel filled with the chittering crabs..."
90101030-36 = "And the victim vanishes without a trace."
90101030-37 = "[s1] \"What a creepy urban legend...\"\n[s2] \"Do these crabs really exist?\""
90101030-40 = "Sensei, are you serious?"
90101030-41 = "An ordinary crab can't even scratch a person, let alone hurt them."
90101030-42 = "Crabs aren't hunters, they're scavengers. They use their claws to shred dead fish and pick seaweed."
90101030-43 = "Also, crab shells are thinner and more brittle than you might think!"
90101030-44 = "Their shells can only get so thick, because they have to molt. They're literally not built to last!"
90101030-45 = "It would be gross, but you could crack a crab just by knocking it. If the person in the drum barrel struggled, the crabs would squish first, like a bunch of bugs."
90101030-46 = "Their claws are relatively hard, but human bones are tougher."
90101030-47 = "An ordinary crab can only grow up to about 25 cm. If you want a crab with claws powerful enough to crush bones..."
90101030-48 = "They'd have to be at least 5 meters long, I'd say?"
90101030-49 = "No, that's still dicey. It would have to be at least 20 meters wide."
90101030-50 = "[s] \"While that is a relief to hear...\""
90101030-51 = ""
90101030-52 = ""
90101030-53 = ""
90101030-54 = "[ns] \"How do you know so much about crabs?\""
90101030-55 = "I met someone on a maritime salvage mission. We had lots of time to talk."
90101030-56 = "For me, it's from experience. They are a delicious ingredient, after all!"
90101030-57 = "I was working undercover at a sushi restaurant. The chef was eager to share."
90101030-58 = "Even if we're not dealing with a giant crab that's attacking people, it's evident that someone is using these crab rumors to turn a profit."
90101030-59 = "It's also clear that people went missing in Kanesaki Port. The public's found out, thinks these two incidents are related, and believes that this crab story is true."
90101030-60 = "So? Why would someone spread such a sloppy urban legend like this? If anyone thinks for a few seconds, they'll see that it's impossible."
90101030-61 = "Are they trying to pin their crimes on a crab or something?"
90101030-62 = "No one wants to deal with a monster crab that attacks people. If someone were to exploit that fear..."
90101030-63 = ""
90101030-65 = ""
90101030-66 = "What if someone's gaming the system? They're trying to tank the crab market by making them sound scary and unappetizing?"
90101030-67 = "We'll kick off this investigation by focusing on the merchants profiting from the price drop."
90101030-68 = ""
90101030-70 = "Well, I'm not seeing any recent fluctuations in crab prices..."
90101030-71 = "Maybe it's because the rumor hasn't spread yet."
90101030-72 = "Ugh... This is weak."
90101030-73 = "[s] \"...It's not enough for a conclusion, that's for sure.\""
90101030-74 = "Yes. There is only so much you can deduce from the armchair."
90101030-75 = "In these times, rather than making wild speculations..."
90101030-76 = "We should carefully collect information. Is that what you meant?"
90101030-77 = ""
90101030-79 = ""
90101030-80 = "...Yes."
90101030-81 = "Our destination: D.U., Shiratori City, 4th Ave., Kanesaki Port."
90101030-82 = "Our suspects: everyone in the crabbing industry."
90101030-83 = "First an overpass, and now we're investigating a port..."
90101030-84 = "At least there should be plenty of shade. I'm sick of worrying about heatstroke."
90101030-85 = ""
90101030-87 = ""
90101030-88 = ""
90101030-89 = ""
90101030-90 = "Ready yourselves, FOX Squad. Our investigation has begun."
90101030-92 = "Next Episode;People of the Port 1"
