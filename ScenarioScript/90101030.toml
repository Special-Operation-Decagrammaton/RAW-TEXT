[translation]
90101030-1 = "ตอนที่ 3;ปูกับถังเหล็ก"
90101030-2 = "สำนักงานประธานองค์การนักเรียน"
90101030-3 = ""
90101030-4 = "ปู... งั้นเหรอคะ?"
90101030-5 = ""
90101030-7 = ""
90101030-8 = ""
90101030-9 = "ใช่ค่ะ ปูที่ก้ามส่งเสียงดังแกร็กๆ นั่นแหละค่ะ"
90101030-10 = "ยูกิโนะเคยเห็นปูตัวเป็นๆ มาก่อนมั้ยคะ?"
90101030-11 = "ค่ะ เคยค่ะ"
90101030-12 = "ตอนฝึกซ้อมภาคฤดูร้อน เวลาผ่านแถวหาดโคลนริมทะเล ก็มักจะเห็นปูเดินกันเป็นฝูงบ่อยๆ เลยค่ะ"
90101030-13 = "หาดโคลน... งั้นเหรอคะ? ฉันก็อยากลองไปสักครั้งเหมือนกันนะคะ"
90101030-14 = "ตั้งแต่เข้ามาทำงานที่องค์การนักเรียน ฉันก็ยุ่งมาก... จนจำไม่ได้แล้วค่ะ ว่าครั้งสุดท้ายที่ไปทะเลช่วงหน้าร้อนคือเมื่อไร"
90101030-15 = "คงเหนื่อยน่าดูเลยนะคะ"
90101030-16 = "ว่าแต่ ทำไมจู่ๆ ถึงยกเรื่องปูมาพูดระหว่างคุยเรื่องคดีคนหายล่ะคะ?"
90101030-17 = ""
90101030-19 = ""
90101030-20 = "ก็เพราะว่า... ผู้ต้องสงสัยว่าเป็นคนร้ายของคดีคนหายครั้งนี้คือ 'ปู' ค่ะ"
90101030-21 = "หมายความว่ายังไง..."
90101030-23 = "ช่วงหลังมานี้ มีชาวเมืองหายตัวไปโดยไม่ทิ้งร่องรอยใดๆ บริเวณใกล้ท่าเรือคาเนะซากิมากขึ้นเรื่อยๆ ค่ะ"
90101030-24 = "ตอนนี้เรายังไม่รู้ว่าเป็นแค่อุบัติเหตุพลัดตกทะเลหายไป หรือเจ้าตัวจงใจซ่อนร่องรอยของตัวเองกันแน่..."
90101030-25 = "แต่จากข่าวลือบนโซเชียลมีเดีย มีคนจำนวนไม่น้อยที่อ้างว่าเห็น 'ปูถังเหล็ก' ในจุดที่ผู้สูญหายเหล่านั้นหายตัวไปค่ะ"
90101030-26 = ""
90101030-27 = "ยูกิโนะ"
90101030-28 = "จากนี้ไป ฉันขอมอบหมายให้กองทหาร FOX ไปสืบสวนเรื่องปูถังเหล็กนี้มาได้มั้ยคะ?"
90101030-30 = "[ns] \"ปูถังเหล็ก...?\""
90101030-31 = "ใช่ค่ะ มันคือฝูงปูจำนวนมหาศาลที่ถูกขังอยู่ในถังเหล็กขนาดใหญ่ พอให้คนเข้าไปได้ค่ะ"
90101030-32 = "ว่ากันว่าปูในถังพวกนั้นทั้งดุร้ายและหิวโหยมาก แค่โยนปลาหรือชิ้นเนื้อลงไป ไม่กี่ชั่วโมงก็ถูกกินจนหมด ไม่เหลือแม้แต่ร่องรอยเลยค่ะ"
90101030-33 = "ส่วนข่าวลือที่เกี่ยวข้องกับปูถังเหล็ก มันก็ไม่ได้ซับซ้อนอะไรค่ะ..."
90101030-34 = "ว่ากันว่า ถ้าคนที่ทำงานเกี่ยวกับปูในท่าเรือคาเนะซากิมีเรื่องแค้นกับใคร พวกเขาก็จะเตรียมถังเหล็กที่ใส่ปูเอาไว้เต็มถัง"
90101030-35 = "จากนั้นก็หลอกพาเหยื่อคนนั้นไปยังที่เปลี่ยวๆ ก่อนจะโยนเหยื่อลงในถังเหล็กที่เต็มไปด้วยปูดุร้าย..."
90101030-36 = "หลังจากนั้น ก็จะไม่มีวันรู้ชะตากรรมของเหยื่อคนนั้นอีกเลยค่ะ"
90101030-37 = "[s1] \"เป็นเรื่องเล่าชวนขนลุกเลยนะ...\"\n[s2] \"ระ... หรือว่าปูปีศาจแบบนั้นจะมีอยู่จริงๆ?\""
90101030-40 = "คิดอะไรจริงจังขนาดนั้นน่ะ คุณครู?"
90101030-41 = "แค่แรงของปูธรรมดา อย่าว่าแต่ทำร้ายคนเลย แม้แต่จะทำให้เป็นแผลก็ยังยากเลยนะ"
90101030-42 = "ที่ปูต้องกินซากปลา สาหร่าย หรือของพวกนั้นเป็นอาหาร มันก็มีเหตุผลของมันอยู่นะ"
90101030-43 = "อีกอย่าง กระดองของปูก็บางและแตกง่ายกว่าที่คิดด้วยค่ะ"
90101030-44 = "สัตว์จำพวกเปลือกแข็งส่วนใหญ่ก็เป็นอย่างนี้ค่ะ ปูก็ต้องลอกคราบเป็นระยะ ทำให้กระดองของมันหนาได้แค่ระดับหนึ่งเท่านั้น"
90101030-45 = "แค่คนทั่วไปออกแรงกดก็แตกแล้ว ถ้าคนที่อยู่ในถังเหยียบหรือสู้กลับ ปูก็น่าจะตายก่อนมากกว่านะคะ"
90101030-46 = "ถึงก้ามปูจะแข็งก็จริง แต่กระดูกของคนก็แข็งแรงกว่านั้นอีกนะ"
90101030-47 = "ปูทั่วไปมีขนาดแค่ไม่กี่สิบเซนเท่านั้น ถ้าจะมีก้ามที่แข็งแรงถึงขั้นบดกระดูกคนได้ละก็..."
90101030-48 = "อย่างน้อยก็คงต้องเป็นปูที่ตัวใหญ่เกิน 5 เมตรเลยหรือเปล่า?"
90101030-49 = "ไม่สิ 5 เมตรก็ยังเล็กไป อย่างน้อยต้องตัวใหญ่ 20 เมตรเลยละ"
90101030-50 = "[s] \"ได้ยินแบบนั้นก็โล่งใจขึ้นมาหน่อยนะ...\""
90101030-51 = ""
90101030-52 = ""
90101030-53 = ""
90101030-54 = "[ns] \"ว่าแต่ทำไมทุกคนถึงรู้เรื่องปูกันละเอียดขนาดนั้นล่ะ?\""
90101030-55 = "ฉันได้ยินมาจากรุ่นน้องที่เคยถูกส่งไปทำปฏิบัติการกู้ภัยทางทะเลน่ะ"
90101030-56 = "ส่วนฉัน พอต้องเตรียมวัตถุดิบสำหรับทำอาหารบ่อยๆ ก็เลย..."
90101030-57 = "ตอนปลอมตัวเข้าไปทำงานที่ร้านปลาดิบเพื่อทำปฏิบัติการของ SRT เจ้าของร้านเป็นคนสอนฉันน่ะ"
90101030-58 = "ต่อให้สิ่งที่พวกเรากำลังรับมืออยู่ไม่ใช่ปูดุร้ายที่ทำร้ายคน แต่ก็เห็นได้ชัดว่ามีใครบางคนซ่อนตัวอยู่#nเบื้องหลังข่าวลือเกี่ยวกับปูและกำลังหาผลประโยชน์จากมันค่ะ"
90101030-59 = "นั่นก็เพราะการหายตัวไปของผู้คนแถวท่าเรือคาเนะซากิเป็นเรื่องจริง และชาวเมืองบางส่วนก็เชื่อว่า#nข่าวลือนี้เป็นเรื่องจริง ก็เลยพากันหวาดกลัวค่ะ"
90101030-60 = "แต่ข่าวลือนี้น่ะ แค่ลองหาข้อมูลนิดเดียวก็รู้ว่าเป็นเรื่องโกหกแล้ว การปล่อยข่าวลือแบบนี้ออกไปจะ#nมีประโยชน์อะไรล่ะ?"
90101030-61 = "หรือคิดจะโยนความผิดให้ปู เพื่อสร้างข้อแก้ตัวให้คนร้าย?"
90101030-62 = "แต่ถึงยังไง ถ้ามีปูปีศาจที่ทำร้ายคนอยู่จริง มันก็น่าขนลุกเหมือนกันนะ ถ้าเอาเรื่องนี้มาใช้ในทางที่ผิดละก็..."
90101030-63 = ""
90101030-65 = ""
90101030-66 = "อื้อ ใช่เลย หรือว่าตั้งใจทำให้คนมองปูในแง่ร้าย เพื่อที่จะได้กดราคาปูน่ะ?"
90101030-67 = "ถ้าเราลองสืบจากกลุ่มพ่อค้าที่อาจหาผลประโยชน์จากราคาปูที่ตกลงมาถูกๆ ก็น่าจะ..."
90101030-68 = ""
90101030-70 = "อืม แต่เท่าที่ลองค้นดู ตอนนี้ทั้งราคาปูและปริมาณที่ออกสู่ตลาดก็ไม่ได้เปลี่ยนแปลงมากเท่าไรเลยนะ"
90101030-71 = "หรืออาจเป็นเพราะข่าวลือยังไม่แพร่กระจายมากก็ได้"
90101030-72 = "เฮ้อ... เรื่องนี้ซับซ้อนจัง"
90101030-73 = "[s] \"ข้อมูลแค่นี้ยังฟันธงไม่ได้หรอก...\""
90101030-74 = "ใช่ค่ะ เอาแต่นั่งคิดอยู่กับที่แล้วใช้แต่การคาดเดา มันไม่ได้ทำให้การสืบคดีมีประสิทธิภาพหรอกค่ะ"
90101030-75 = "เวลาแบบนี้ แทนที่จะรีบด่วนสรุป..."
90101030-76 = "เราควรเก็บข้อมูลให้รอบด้านก่อน ใช่มั้ยล่ะ?"
90101030-77 = ""
90101030-79 = ""
90101030-80 = "ใช่..."
90101030-81 = "จุดหมายคือท่าเรือคาเนะซากิ บนถนนสาย 4 เขตชิราโทริ ใน D.U."
90101030-82 = "ผู้ที่ต้องสอบถามคือทุกคนที่เกี่ยวข้องกับการทำประมงปู"
90101030-83 = "คราวที่แล้วไปสืบที่ทางยกระดับ ส่วนคราวนี้ให้ไปสืบที่ท่าเรือสินะ~"
90101030-84 = "อย่างน้อยที่ท่าเรือก็น่าจะมีร่มเงาเยอะ คงไม่ต้องกลัวเป็นลมแดดแล้วละ"
90101030-85 = ""
90101030-87 = ""
90101030-88 = ""
90101030-89 = ""
90101030-90 = "เอาละ ถ้างั้นกองทหาร FOX จะเริ่มปฏิบัติการลงพื้นที่สอบถาม ณ บัดนี้"
90101030-92 = "ตอนต่อไป;คนในท่าเรือ 1"
