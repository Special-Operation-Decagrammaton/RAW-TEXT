[translation]
90101030-1 = "第3話;螃蟹與鐵桶"
90101030-2 = "聯邦學生會長辦公室"
90101030-3 = ""
90101030-4 = "……螃蟹，是嗎？"
90101030-5 = ""
90101030-7 = ""
90101030-8 = ""
90101030-9 = "是的，就是有著鉗子並且會發出咔嚓咔嚓聲響的那個螃蟹。"
90101030-10 = "雪乃同學，你有實際看過活生生的螃蟹嗎？"
90101030-11 = "是的，我有看過。"
90101030-12 = "夏季訓練經過潮間帶附近時，經常能看見螃蟹成群結隊爬行的景象。"
90101030-13 = "潮間帶嗎……我也想去一次看看呢。"
90101030-14 = "自從進入聯邦學生會之後就忙得不可開交……#n連最後一次去夏天的海邊是什麼時候都想不起來了。"
90101030-15 = "真是辛苦您了。"
90101030-16 = "不過您明明正在說失蹤事件，為什麼會突然提起螃蟹……？"
90101030-17 = ""
90101030-19 = ""
90101030-20 = "那是因為……這次失蹤事件的嫌疑犯被指向了螃蟹。"
90101030-21 = "那是什麼意思……"
90101030-23 = "最近在鐘崎港附近，不留任何痕跡就失蹤的市民數量正在增加。"
90101030-24 = "究竟是單純的失足事故，還是有人刻意隱藏蹤跡，目前還不得而知……"
90101030-25 = "但是根據SNS上的傳聞……#n在這些人失蹤的地點，目擊了「鐵桶蟹」的人似乎還不少呢。"
90101030-26 = ""
90101030-27 = "雪乃同學。"
90101030-28 = "能否請FOX小隊從現在起，針對這個鐵桶蟹進行調查呢？"
90101030-30 = "[ns] 「……『鐵桶蟹』？」"
90101030-31 = "是的，就是在一個大到足以讓人進去的鐵桶裡塞滿了大量的螃蟹。"
90101030-32 = "據說裡頭裝的那些螃蟹生性極其兇暴又長期處於飢餓狀態……#n只要將魚或肉塊丟進去，數小時內就會被吃得一乾二淨，不留一點痕跡。"
90101030-33 = "……與鐵桶蟹有關的傳聞，內容也大致單純。"
90101030-34 = "於鐘崎港從事螃蟹相關工作的人一旦結下仇怨，就會準備裝滿螃蟹的鐵桶。"
90101030-35 = "然後把對方帶到人煙稀少的地方，再將被害者丟進裝滿兇暴螃蟹的鐵桶裡……"
90101030-36 = "如此一來，被害者的下落就會消失得無影無蹤。"
90101030-37 = "[s1] 「真是令人毛骨悚然的怪談呢……」\n[s2] 「真，真的會有那種怪物螃蟹存在嗎？」"
90101030-40 = "你在認真思考什麼啊，老師。"
90101030-41 = "以普通螃蟹的力氣別說要傷人了，就連要弄出個擦傷都很困難。"
90101030-42 = "螃蟹會依靠死魚或海藻類維生，成為食腐動物不是沒有原因的。"
90101030-43 = "而且螃蟹的外殼比想像中還要薄弱，也很容易碎裂。"
90101030-44 = "因為必須週期性地蛻殼，所以外殼的厚度也有一定的極限……#n大部分的甲殼類生物都是這樣。"
90101030-45 = "考慮到普通人只要稍微用力就能把外殼壓碎……#n如果鐵桶裡的人拚命掙扎，先死掉的恐怕會是螃蟹吧？"
90101030-46 = "雖然螃蟹的鉗子確實還算堅硬，但人類的骨頭可是比那結實得多呢。"
90101030-47 = "普通螃蟹的大小不過才幾十cm而已，如果要擁有能壓碎骨頭的強力鉗子……"
90101030-48 = "體型大概得有個5m才行吧？"
90101030-49 = "不對，5m還不夠，至少得有20m才行。"
90101030-50 = "[s] 「聽你們這麼說確實安心了不少，不過……」"
90101030-51 = ""
90101030-52 = ""
90101030-53 = ""
90101030-54 = "[ns] 「為什麼你們會對螃蟹那麼瞭解？」"
90101030-55 = "我是從被派去執行海難作戰的後輩那裡聽說的。"
90101030-56 = "我是那個……處理食材的時候偶然就……"
90101030-57 = "執行SRT的任務潛入海鮮餐廳偽裝成店員時，店長告訴我的。"
90101030-58 = "就算目標不是會傷人的兇暴螃蟹，肯定也有人躲在與螃蟹相關的傳聞背後從中獲利。"
90101030-59 = "鐘崎港一帶有人失蹤是不爭的事實，而且部分信以為真的市民也為此感到不安。"
90101030-60 = "可是刻意散播這種稍微調查就漏洞百出的怪談，究竟能得到什麼好處？"
90101030-61 = "難道是打算把罪名嫁禍給螃蟹，以此做為自己的不在場證明嗎？"
90101030-62 = "不過，如果真的存在會攻擊人的怪物螃蟹，確實會令人不寒而慄。#n萬一被拿來惡用的話……"
90101030-63 = ""
90101030-65 = ""
90101030-66 = "對耶，我想到了。#n會不會是想藉由抹黑螃蟹的形象，好讓螃蟹的價格下跌啊？"
90101030-67 = "如果優先調查能利用下跌的螃蟹價格賺取差價的商人──"
90101030-68 = ""
90101030-70 = "唔嗯……我事先調查了一下，目前螃蟹的市價和流通量好像沒有什麼大幅度的變化。"
90101030-71 = "是因為傳聞還沒廣泛流傳的緣故嗎？"
90101030-72 = "唔嗯……真複雜呢。"
90101030-73 = "[s] 「……看來光憑這些還無法下定論呢。」"
90101030-74 = "是的，光是坐在椅子上推理也是有極限的。"
90101030-75 = "這種時候與其貿然猜測──"
90101030-76 = "不如先慎重地收集情報，對吧？"
90101030-77 = ""
90101030-79 = ""
90101030-80 = "……沒錯。"
90101030-81 = "目的地是位於D.U.白鳥區4號街的鐘崎港。"
90101030-82 = "調查對象是與螃蟹產業相關的所有人員。"
90101030-83 = "繼高速公路之後，這次是調查港口的任務啊～"
90101030-84 = "不過港口應該有不少陰涼處，至少不用擔心會中暑呢。"
90101030-85 = ""
90101030-87 = ""
90101030-88 = ""
90101030-89 = ""
90101030-90 = "那麼FOX小隊，從即刻起開始展開探查。"
90101030-92 = "下一話;港口的人們（１）"
