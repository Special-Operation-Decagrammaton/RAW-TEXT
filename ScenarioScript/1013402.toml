[translation]
1013402-1 = "용사 수행"
1013402-2 = "뽜밤뽜밤~!"
1013402-3 = "아리스는 새로운 장비를 손에 넣었습니다!"
1013402-7 = "이로써 [ruby=빛의 검: 슈퍼노바]용사의 무기[/ruby]와, [ruby=아비 에슈흐]용사의 갑옷[/ruby]이 한데 모였습니다!"
1013402-8 = "전설의 무구를 모두 모은 아리스는 진정한 용사로 거듭난 것입니다!"
1013402-9 = "[s1] \"오오, 축하해!\"\n[s2] \"이제 무적이네!\""
1013402-13 = "아니요……. 아리스, 잊고 있었습니다."
1013402-14 = "장비는, 그저 장비하는 것만으로 의미가 없다는 사실을요!"
1013402-15 = "장비의 성능을 제대로 이끌어내기 위해서는 장비 숙련도를 올려야만 합니다!"
1013402-16 = "[s3] \"아비 에슈흐는 확실히 고기동 병기였지.\"\n[s4] \"게다가 아리스 사양으로 비행 기능 같은 게 추가됐고.\""
1013402-19 = "맞습니다! 지금 아리스의 세상은, 횡스크롤에서 3D로 바뀐 수준……."
1013402-20 = "이른바, 아리스 64입니다!"
1013402-21 = "위도 아래도 모르는 이런 상태로는 싸울 수 없습니다!"
1013402-22 = "즉, 이 시련을 극복하기 위한 용사 수행이 필요합니다!"
1013402-23 = "갑옷의 조작 방식은 현자로부터 모두 전수받았습니다."
1013402-24 = "남은 것은, 마스터할 때까지 반복할 뿐!"
1013402-25 = "하지만, 이 훈련은 굉장히 어렵습니다……. 한쪽으로 쏠린 조이스틱으로 플랫포머 게임을 하는 것 같습니다!"
1013402-26 = "그래서, 여기서 선생님의 차례입니다!"
1013402-27 = "[s5] \"알았어! 서포트는 맡겨줘!\"\n[s6] \"내가 뭘 해주면 될까?\""
1013402-30 = "선생님은 곁에서 응원해 주세요!"
1013402-34 = "[ns7] \"……?\"\n[ns8] \"……그것뿐?\""
1013402-37 = "네!"
1013402-38 = "선생님은 마스코트니까, 옆에 있으면 기운이 납니다!"
1013402-39 = "선생님이 파티에 있으면, 아무리 힘든 훈련이라도 사기 맥스를 유지할 수 있습니다!"
1013402-40 = "……? 왜 그러십니까, 선생님?"
1013402-41 = "왠지 슬픈 아기 강아지 같은 얼굴이 됐습니다."
1013402-42 = "네? 아무것도 아니라고요?"
1013402-43 = "……?"
1013402-44 = "어쨌거나, 용사 수행 시작입니다!"
1013402-46 = "(그렇게 아리스의 용사 수행이 시작되었다……!)"
1013402-49 = "여기서 이렇게 하면……."
1013402-53 = "아차! 반대 방향이었습니다! 맞은편 부스터로 상쇄를……."
1013402-57 = "앗! 이건 측면 부스터였습니다! 끄앙!"
1013402-58 = "몸이 빙글빙글 돌기 시작했습니다!"
1013402-60 = "(……도중에 여러 해프닝이 있었지만, 다행히 큰 사고 없이 훈련은 계속되었다.)"
1013402-63 = "……하아, 하아."
1013402-64 = "여기서 조금만 더 오른쪽으로 돌면……."
1013402-68 = "(……훈련 시작으로부터 상당한 시간이 흘렀다.)"
1013402-69 = "(하지만 아리스는 아직 훈련을 멈출 생각이 없어 보인다.)"
1013402-74 = "……끄앙!"
1013402-79 = "분명 조금 전까지는 잘했던 구간인데……."
1013402-80 = "어째선지 자꾸 실패합니다!"
1013402-81 = "[s9] \"조금만 쉬었다 하자.\"\n[s10] \"분명 지쳐서 그런 거야.\""
1013402-84 = "아, 아니요! 괜찮습니다!"
1013402-85 = "아리스, 아직 쌩쌩합니다! 게임이라면 밤새 한 적도 있습니다!"
1013402-86 = "아, 그리고! 아리스, 비슷한 게임도 많이 해봤습니다!"
1013402-91 = "보십시오! 이렇게……!"
1013402-92 = "앗!"
1013402-97 = "[ns11] \"괜찮아?!\"\n[ns12] 아리스를 향해 달려간다."
1013402-101 = "……아, 선생님."
1013402-102 = "괜찮습니다. 넘어져서 조금 삐었을 뿐입니다."
1013402-103 = "……아얏."
1013402-107 = "역시 선생님 말을 들을 걸 그랬습니다."
1013402-108 = "피로도 관리는 육성계 시뮬의 기본 중의 기본입니다!"
1013402-109 = "무시하고 계속 수행하면, 스테이터스 하락 이벤트가 발생하고 맙니다!"
1013402-110 = "아리스 같은 고인물도, 가끔 이런 실수를 저지르고 맙니다……."
1013402-111 = "…………."
1013402-114 = "[ns] \"……일단, 오늘은 돌아갈까.\""
1013402-117 = "선생님……?"
1013402-118 = "갑자기 왜 바닥에 무릎을……?"
1013402-119 = "[s13] \"업어줄게.\"\n[s14] \"삔 다리로는 걸을 수 없으니까.\""
1013402-122 = "네? 그치만 이 장비로는 날아서 돌아가도……."
1013402-123 = "[s15] \"자! 괜찮으니까!\"\n[s16] \"흔히 오는 기회가 아니라고?!\""
1013402-126 = "저, 그러면……."
1013402-130 = "에헤헤."
1013402-131 = "매일 선생님이 업어줬으면 좋겠습니다."
1013402-132 = "(좀 전까지 찬 바람을 맞은 탓인지, 차갑게 식은 아리스의 체온이 등 너머로 전해졌다.)"
1013402-134 = "(……아리스의 '갑옷'은 상상한 것보다 훨씬 무거웠다.)"
1013402-141 = "(……돌아오는 도중에 허리가 나갈 뻔했다.)"
