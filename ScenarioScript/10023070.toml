[translation]
10023070-1 = "제7화;제법 위험한 게임"
10023070-4 = "우우우……"
10023070-5 = "앞이 하나도 안 보여……"
10023070-10 = "아야! 누가 내 발을 밟았어!"
10023070-12 = "언니, 쉿! 조용히!"
10023070-18 = "!? 조심하세요. 뭔가 미끌거리는 것이 있습니다."
10023070-19 = "으아앙! 그건 아리스의 머리카락입니다!"
10023070-20 = "[s] \"이 계단…… 끝나지 않을 것 같은 기분이 들어……\""
10023070-22 = "꽤 깊이 내려온 것 같은데…… 저희들의 걸음이 조심스러운 것도 있겠지만요……"
10023070-31 = "아우! 이번엔 머리가 뭔가에……!"
10023070-32 = "어? 그거 혹시…… 앞이 막혔다는 거 아냐?"
10023070-34 = "잠시만 기다려 주십시오."
10023070-35 = "어쩌면 여기에 문이 있을지도……"
10023070-48 = "다음 경매품은 뭐야, 다음은!"
10023070-49 = "이런 경매품도 좋지만, 좀 더 큰 걸 내놓으라고! 돈은 준비되어 있으니까!"
10023070-50 = "……낙찰받지 못한다 해도, 내 눈으로는 보고 싶군."
10023070-51 = "그렇습니다!"
10023070-52 = "소문만 무성하던 그……"
10023070-54 = "<시계왕의 왕관>을!"
10023070-56 = "어, 어어……?"
10023070-57 = "경매는 내일 열리는 거 아니었나요? 이 지하 공간과, 지금의 경매는 대체……?"
10023070-59 = "자, 자. 기다리십시오. 여러분. 아직 우리에게는 처리해야 할 경매품들이 많습니다."
10023070-60 = "밤은 길고, 물건은 충분합니다. <시계왕의 왕관>은, 그 대미를 장식할 것입니다!"
10023070-62 = "그거참, 보여주는 것만이라면 지금도 할 수 있잖아!"
10023070-63 = "너무 비싸게 구는 것 아닌가, 메이타로 씨!"
10023070-64 = "하지만 그 자애의 괴도가 나타나지 않았나. 경매가 진행될 수 있기는 한 건가?"
10023070-65 = "그렇습니다! 가장 불안한 것은 메이타로 씨 본인이시겠지만, 저희도 마찬가지입니다!"
10023070-66 = "하하하하! 그걸 위해 준비해 둔 것이 있습니다. C&C와 샬레를 이 현장에 끌어들인 것이죠!"
10023070-67 = "그들이 자애의 괴도와 싸우며 시간을 버는 사이에, 우리는 경매를 끝내 버릴 수 있습니다."
10023070-68 = "자애의 괴도를 물리쳐 주면 우리야 좋은 것이고, 싸우다가 공멸해 버려도 상관없습니다."
10023070-69 = "만에 하나 자애의 괴도가 샬레와 C&C를 물리치고 여기까지 도달한다 한들, 정상적인 상태는 아닐 겁니다! 그 정도야 제 경비대로 얼마든지 상대할 수 있겠죠!"
10023070-74 = "듣고 보니…… 확실히 안심이 가는군. 좋아. 역시 메이타로 씨야."
10023070-75 = "자, 다음 경매로 넘어갑시다."
10023070-76 = "경매를 빨리 회전시켜야 <시계왕의 왕관> 역시 두 눈으로 볼 수 있지 않겠습니까!"
10023070-77 = "감사합니다."
10023070-78 = "이번 경매품은…… <골든 카나리아>입니다!"
10023070-79 = "운석에서 추출된 옐로우 다이아몬드를 연마한 이 보석은!"
10023070-80 = "블랙 마켓에서 모두에게 항쟁의 원인이 되다가, 마침내 이 자리에 설 수 있게 된 것으로–"
10023070-85 = "메이타로 씨……?"
10023070-86 = "과연, 어딘가로 사라졌다고 생각했더니 이런 곳에 있었군요."
10023070-87 = "그리고 거래되는 경매품들이, 어딘가 범상치 않은 것들처럼 보입니다."
10023070-89 = "RPG에서 경매장은, 귀한 아티팩트들이 거래되거나 음모가 꾸며지는 장소인데……"
10023070-93 = "알았습니다! 경매에 참여하려면 크레딧이 필요합니다. 그러려면 특수 퀘스트를 해결하거나 레어 몬스터를 잡아야 합니다!"
10023070-94 = "혹시 저 아래에 있는 분들이 전부 레어 몬스터입니까?"
10023070-95 = "[s] \"어떤 의미로는 맞을 수도 있지만, 일단은 아니니까! 응!\""
10023070-100 = "뭔가, 조금 전부터 다른 의미로 소란스러운 것 같은 느낌이……"
10023070-108 = "어엇?! 당신들은…… C&C?"
10023070-109 = "당신들이 왜 여기에 있는 겁니까? 분명히 자애의 괴도를 상대하고 있어야 할 텐데……?"
10023070-111 = "C, C&C라고? 이게 어떻게 된 거지, 메이타로 씨?!"
10023070-112 = "우리를 속인 건가? 함정인가?"
10023070-113 = "<시계왕의 왕관>…… C&C가 찾고 있던 장물이, 여기에 있었군요."
10023070-114 = "!!!"
10023070-115 = "그뿐만이 아니군요. <아들을 들어 올리는 크로노스>, <이삭을 줍는 이난나>, <베누스의 석상>…… 열거하자면 끝이 없겠습니다."
10023070-116 = "[s] \"이 예술품들이 어떻다는 거야. 토키?\""
10023070-117 = "모두, 범죄 조직 간의 불법 거래 물품들입니다."
10023070-118 = "[s1] \"자애의 괴도가 노리던 물건들이,\"\n[s2] \"전부 정상적인 예술품들이 아니었다……?\""
10023070-121 = "저는 자애의 괴도를 쫓는 것과 동시에, 또 하나의 임무를 가지고 있습니다."
10023070-122 = "<시계왕의 왕관>을 비롯한, 장물들의 행방을 찾는 것이었죠."
10023070-123 = "처음에는 자애의 괴도를 잡으면 해결될 일이라고 생각했습니다만, 설마 저택 지하에서 이 장물들이 거래되고 있었을 줄은."
10023070-124 = "C&C가 예술품들을 찾고 있었다는 말은 듣지 못했습니다만!"
10023070-125 = "묻지 않았으니까요."
10023070-129 = "으으으음……!"
10023070-131 = "경비대! 일단은 C&C의 신변을…… 정중하게 구속해 주십시오!"
