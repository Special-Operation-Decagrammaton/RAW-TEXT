[translation]
1004203-1 = "한밤중의 학원"
1004203-2 = "모 학원 본관의 옥상"
1004203-3 = "좋은 아침. 선생님."
1004203-4 = "[s1] \"좋은 아침.\"\n[s2] \"좋은 아침. 밤이지만…….\""
1004203-5 = "응. 인사는 중요하니까."
1004203-6 = "응. 인사는 중요하니까."
1004203-7 = "[s] \"그런데 여기는…….\""
1004203-8 = "응. 근처 학교의 옥상이잖아. 비상 계단으로 올라왔고. 그치?"
1004203-9 = "[s] \"아니, 그건 그렇지만…….\""
1004203-10 = "여기 이쪽 문이 열려 있거든. 이 문을 통해 건물 안으로 들어갈 수 있어."
1004203-11 = "자, 가보자."
1004203-15 = "[ns3] \"아니, 잠깐만. 기, 기다려, 아츠코!\"\n[ns4] \"몰래 들어가면……?!\""
1004203-16 = "우와, 신기해. 선생님, 빨리 와 봐."
1004203-17 = "우와, 신기해. 선생님, 빨리 와 봐."
1004203-18 = "[ns] 일단 따라간다."
1004203-23 = "신기해. 이렇게 생겼구나."
1004203-24 = "아, 저기가 교실이지?"
1004203-28 = "[ns5] \"기, 기다려!\"\n[ns6] 뒤쫓는다."
1004203-31 = "……."
1004203-32 = "이런 느낌이구나……."
1004203-33 = "[s] \"아츠코. 몰래 남의 학교에 들어오면 안 돼.\""
1004203-34 = "응? 왜?"
1004203-35 = "딱히 문제를 일으키려는 건 아닌걸."
1004203-36 = "……. 응, 무슨 소리인지 알아. 들키면 여러 가지로 곤란해질 거고……."
1004203-37 = "조금만 있다가 가자. 응?"
1004203-38 = "[s7] \"하아…… 어쩔 수 없나.\"\n[s8] \"조금만 있다가 가는 거야?\""
1004203-39 = "네-!"
1004203-40 = "네-!"
1004203-47 = "(아츠코가 앞의 책상에 앉았다.)"
1004203-48 = "선생님. 질문."
1004203-49 = "[s] \"어…… 질문?\""
1004203-50 = "수업 중에 궁금한 게 있습니다."
1004203-51 = "[s9] (아……. 학교 놀이인가.)\n[s10] \"네. 아츠코 학생. 무엇인가요?\""
1004203-52 = "아이는 어떻게 생기나요?"
1004203-53 = "아이는 어떻게 생기나요?"
1004203-54 = "[s] \"…….\""
1004203-55 = "농담이야. 선생님. 곤란해하지 않아도 돼."
1004203-59 = "그럼 다른데도 가볼까?"
1004203-61 = "여기는 강당인가 보네."
1004203-62 = "이 많은 자리에 학생들이 다 들어차는 걸까?"
1004203-63 = "분명 떠들썩하겠지?"
1004203-65 = "여기는 샤워실이구나."
1004203-66 = "다 같이 씻는 건 즐겁지. 나도 좋아해."
1004203-67 = "아리우스에 있을 때도 다 함께 씻는 시간이 제일 좋았으니까."
1004203-68 = "응, 그럼 또 다른데로 가볼까?"
1004203-70 = "여기는 동아리실인가보네."
1004203-71 = "수석연구부……? 돌을 수집하는 거지? 이런 동아리도 있나 보네."
1004203-72 = "응…… 취미에 따라 다양한 동아리가 있는 거겠지."
1004203-73 = "[s] \"아츠코는 좋아하는 취미가 없어?\""
1004203-74 = "취미……?"
1004203-75 = "음. 나는……."
1004203-79 = "앗, 들켰나 봐-!"
1004203-80 = "[s] \"도망치자!\""
1004203-84 = "(아츠코를 데리고 황급히 학원 밖으로 빠져나갔다.)"
1004203-86 = "……후후. 큰일 날 뻔했네."
1004203-87 = "그치만…… 스릴있고 재미있었어. 그치?"
1004203-88 = "[s] \"하아…….\""
1004203-89 = "후후. 응. 억지에 어울려줘서 고마웠어. 선생님."
1004203-90 = "그럼, 오늘은 여기까지. 다음에 또 봐."
