[translation]
1015003-1 = "#title;길 잃은 범고래"
1015003-2 = "#na;(코토네의 연락을 받고 그녀가 기다리고 있다는 서점의 앞으로 향했다.)"
1015003-3 = "#na;(그곳에 도착해 보니 코토네는 눈을 잔뜩 찌푸린 채……)"
1015003-4 = "4;코토네;S2_04\n2;노인;00\n#4;h\n#2;h\n#4;a\n#2;a"
1015003-5 = "4;코토네;S2_04\n2;노인;00\n#4;h\n#2;h\n#2;em;[스팀]\n#2;hophop\n#wait;1000"
1015003-6 = "1;???;00\n#1;hide"
1015003-7 = "#na;(……시민에게 잔소리를 듣고 있었다.)"
1015003-8 = "2;노인;00;요새 젊은 것들이 말이야! 예의없게 사람을 툭툭 치지를 않나, 반말을 하지 않나!\n#2;em;[빠직]"
1015003-9 = "2;노인;00;게다가 싫은 소리를 좀 했다고 표정이 그게 뭐야? 미간을 잔뜩 찌푸리고선!"
1015003-10 = "4;코토네;S2_06;아…… 모르는 사람이었구나. 미안, 친구인 줄 알았어.\n#4;em;[땀]"
1015003-11 = "4;코토네;S2_02;그리고 표정은 일부러 그러는 게 아니라, 앞이 잘 안 보여서……\n#4;stiff"
1015003-12 = "2;노인;00;누가 네 친구야?! 게다가 말대답이나 따박따박하고는—\n#2;hophop"
1015003-13 = "4;코토네;S2_02\n2;노인;00\n#4;h\n#2;h"
1015003-14 = "[ns1] \"저, 실례합니다.\"\n[ns2] \"혹시 저희 학생이 무슨 실례라도……\""
1015003-17 = "4;코토네;S2_00\n2;노인;00\n#2;m3\n#4;d\n#4;h\n#2;h\n#wait;1000"
1015003-18 = "2;노인;00;당신이 이 학생의 보호자인가?"
1015003-19 = "2;노인;00;그렇다면 똑바로 관리하라고!\n#2;jump"
1015003-20 = "2;노인;00;이 학생이 갑자기 내 어깨를 붙잡더니, 사나운 표정으로 노려보며 시비를 걸어왔다고!\n#2;em;[스팀]\n#2;hophop"
1015003-21 = "[ns] \"뭔가 오해가 있었던 모양입니다만……\""
1015003-23 = "#na;(화난 시민을 간신히 달래 돌려보낸 뒤에, 코토네로부터 상황 설명을 들을 수 있었다.)"
1015003-24 = "3;코토네;S2_00\n#3;a"
1015003-26 = "[ns3] \"그러니까 실수로 안경이 깨져버렸는데……\"\n[ns4] \"앞이 안 보여서 눈을 찌푸렸더니, 시비가 걸렸다고?\""
1015003-29 = "3;코토네;S2_04;응. 조금이라도 선명하게 보려면 눈을 찌푸리는 수밖에 없으니까.\n#3;em;[한숨]"
1015003-30 = "3;코토네;S2_02;눈을 가늘게 뜨고 주변을 살펴보니, 뭔가 시비를 거는 것처럼 보였나 봐."
1015003-31 = "[s] \"큰일이었네……\""
1015003-32 = "#st;[0,0];instant;1;"
1015003-35 = "[ns] \"그나저나 안경은 어쩌다 깨진 거야?\""
1015003-36 = "3;코토네;S2_01;그게, 평소에 좋아하던 작가의 신간이 나와서 항구의 서점에 들렸는데……"
1015003-37 = "3;코토네;S2_02;책에 정신이 팔려서 유리문이 닫힌 걸 알아차리지 못하고 그대로 부딪히고 말았어.\n#3;stiff"
1015003-38 = "3;코토네;S2_04;다행히 다치지는 않았지만, 안경이 박살이 나버려서……\n#3;em;[속상함]"
1015003-39 = "[s] \"예비 안경은 없어?\""
1015003-40 = "3;코토네;S2_01;응. 하필이면 이게 마지막 안경이라……"
1015003-41 = "3;코토네;S2_06;새 안경을 슬슬 맞추어야겠다고 생각하던 타이밍에 이런 일이 생기고 말았네."
1015003-42 = "#st;[0,0];instant;1;"
1015003-44 = "3;코토네;S2_01\n#3;em;[...]\n#wait;2500"
1015003-45 = "3;코토네;S2_02;저기, 선생님. 괜찮으면 새 안경을 맞추러 갈 때까지 동행해주지 않을래?"
1015003-46 = "3;코토네;S2_04;안경이 없으면 나는 아무 곳에도 갈 수 없는데다가…… 또 시비가 걸릴지 모르니까."
1015003-47 = "[s5] \"물론이지. 도와줄게.\"\n[s6] \"가장 가까운 안경점은 어디야?\""
1015003-50 = "3;코토네;S2_00;가장 가까운 안경점은 여기서 지하철로 세 정거장 정도 떨어진 라미니 타운에 있어."
1015003-51 = "3;코토네;S2_03;평소에 인터넷으로 안경을 주문하던 가게가 있으니 그곳으로 가자."
1015003-52 = "[s] \"그래. 그럼 내가 안내할게.\""
1015003-53 = "#st;[0,0];instant;1;"
1015003-56 = "[ns7] \"그런데, 코토네……\"\n[ns8] \"설마 그 차림으로 갈 거야?\""
1015003-59 = "3;코토네;S2_02;응. 무슨 문제라도 있어?\n#3;em;[?]"
