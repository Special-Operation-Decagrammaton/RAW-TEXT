[translation]
1015003-1 = "길 잃은 범고래"
1015003-2 = "(코토네의 연락을 받고 그녀가 기다리고 있다는 서점의 앞으로 향했다.)"
1015003-3 = "(그곳에 도착해 보니 코토네는 눈을 잔뜩 찌푸린 채……)"
1015003-7 = "(……시민에게 잔소리를 듣고 있었다.)"
1015003-8 = "요새 젊은 것들이 말이야! 예의없게 사람을 툭툭 치지를 않나, 반말을 하지 않나!"
1015003-9 = "게다가 싫은 소리를 좀 했다고 표정이 그게 뭐야? 미간을 잔뜩 찌푸리고선!"
1015003-10 = "아…… 모르는 사람이었구나. 미안, 친구인 줄 알았어."
1015003-11 = "그리고 표정은 일부러 그러는 게 아니라, 앞이 잘 안 보여서……"
1015003-12 = "누가 네 친구야?! 게다가 말대답이나 따박따박하고는—"
1015003-14 = "[ns1] \"저, 실례합니다.\"\n[ns2] \"혹시 저희 학생이 무슨 실례라도……\""
1015003-18 = "당신이 이 학생의 보호자인가?"
1015003-19 = "그렇다면 똑바로 관리하라고!"
1015003-20 = "이 학생이 갑자기 내 어깨를 붙잡더니, 사나운 표정으로 노려보며 시비를 걸어왔다고!"
1015003-21 = "[ns] \"뭔가 오해가 있었던 모양입니다만……\""
1015003-23 = "(화난 시민을 간신히 달래 돌려보낸 뒤에, 코토네로부터 상황 설명을 들을 수 있었다.)"
1015003-26 = "[ns3] \"그러니까 실수로 안경이 깨져버렸는데……\"\n[ns4] \"앞이 안 보여서 눈을 찌푸렸더니, 시비가 걸렸다고?\""
1015003-29 = "응. 조금이라도 선명하게 보려면 눈을 찌푸리는 수밖에 없으니까."
1015003-30 = "눈을 가늘게 뜨고 주변을 살펴보니, 뭔가 시비를 거는 것처럼 보였나 봐."
1015003-31 = "[s] \"큰일이었네……\""
1015003-35 = "[ns] \"그나저나 안경은 어쩌다 깨진 거야?\""
1015003-36 = "그게, 평소에 좋아하던 작가의 신간이 나와서 항구의 서점에 들렸는데……"
1015003-37 = "책에 정신이 팔려서 유리문이 닫힌 걸 알아차리지 못하고 그대로 부딪히고 말았어."
1015003-38 = "다행히 다치지는 않았지만, 안경이 박살이 나버려서……"
1015003-39 = "[s] \"예비 안경은 없어?\""
1015003-40 = "응. 하필이면 이게 마지막 안경이라……"
1015003-41 = "새 안경을 슬슬 맞추어야겠다고 생각하던 타이밍에 이런 일이 생기고 말았네."
1015003-45 = "저기, 선생님. 괜찮으면 새 안경을 맞추러 갈 때까지 동행해주지 않을래?"
1015003-46 = "안경이 없으면 나는 아무 곳에도 갈 수 없는데다가…… 또 시비가 걸릴지 모르니까."
1015003-47 = "[s5] \"물론이지. 도와줄게.\"\n[s6] \"가장 가까운 안경점은 어디야?\""
1015003-50 = "가장 가까운 안경점은 여기서 지하철로 세 정거장 정도 떨어진 라미니 타운에 있어."
1015003-51 = "평소에 인터넷으로 안경을 주문하던 가게가 있으니 그곳으로 가자."
1015003-52 = "[s] \"그래. 그럼 내가 안내할게.\""
1015003-56 = "[ns7] \"그런데, 코토네……\"\n[ns8] \"설마 그 차림으로 갈 거야?\""
1015003-59 = "응. 무슨 문제라도 있어?"
1015003-64 = "저것 봐, 샬레의 선생님이 이상한 차림의 학생과 동행하고 있어."
1015003-65 = "우와…… 말로만 들었지만, 정말 학생을 수영복만 입혀서 데리고 다니네."
1015003-66 = "저것도 뭔가 샬레 활동의 일환이려나?"
1015003-67 = "저게 선생님의 취향이라면 정말 악취미네."
1015003-68 = "내가 듣기로는 수영복은 얌전한 편이라고 들었어. 바니걸이나 애니메이션의 코스프레 차림으로 동행하는 학생도 있다고 들었는데."
1015003-69 = "무섭다, 무서워……"
1015003-70 = "[ns] \"저기…… 코토네 양.\""
1015003-72 = "응? 왜 그래?"
1015003-73 = "[s] \"혹시 다른 옷으로 갈아입을 순 없었던 거야?\""
1015003-74 = "다른 옷이라니. 웻슈트나 드라이슈트 같은 잠수복을 말하는 거야?"
1015003-75 = "잠수복이라면 몇 벌 더 있지만, 육상에서 돌아다닐 때는 불편해서 입지 않는데."
1015003-76 = "[s] \"잠수복 말고 사복은 없어?\""
1015003-77 = "사복? 이게 사복이잖아?"
1015003-78 = "오디세이아 학원에서도 늘 이렇게 입고 다녔지만, 이상하게 보는 사람은 거의 없었는 걸?"
1015003-79 = "이 볼레로만 벗으면 바로 수영도 할 수 있으니 합리적이기도 하고."
1015003-80 = "[s9] \"하지만 이곳은 지하철이잖니……\"\n[s10] \"주변 사람들 옷에 비하면 너무……\""
1015003-83 = "주변 사람들 옷?"
1015003-84 = "으음, 눈이 나빠서 잘 안 보이는데……"
1015003-85 = "[s11] \"……아니, 신경 쓰지 마.\"\n[s12] \"빨리 안경점으로 가자.\""
1015003-90 = "(이후, 사람들의 따가운 시선을 느끼며 안경점에 도착해서……)"
1015003-94 = "[ns] \"실례합니다. 안경을 하나 급히 맞추고 싶은데요!\""
1015003-95 = "……네?"
1015003-96 = "저기, 저희 가게는 평범한 안경만 취급하고 있습니다만……"
1015003-97 = "[ns] \"평범한 안경으로 충분해요!\""
1015003-99 = "(다행히 코토네의 새 안경을 맞출 수 있게 되었다.)"
1015003-102 = "아, 됐다."
1015003-103 = "드디어 잘 보여."
1015003-104 = "[s13] \"다행이다……\"\n[s14] \"이제 혼자서 돌아갈 수 있겠어?\""
1015003-111 = "으음……"
1015003-116 = "[ns15] \"왜 갑자기 가까이 붙는 거야?!\"\n[ns16] \"아직도 눈에 불편한 점이라도 있어?\""
1015003-119 = "……아니."
1015003-120 = "눈은 이제 괜찮은데…… 시력이 돌아오니 뭔가 갑자기 부끄러워져서."
1015003-121 = "아까는 몰랐었는데, 지금 보니 선생님이 말했던 것처럼 이 수영복 차림은 조금 튀는구나 싶어서."
1015003-122 = "이대로 혼자 들어가긴 부끄러우니까, 선생님에게 붙어 있을래."
1015003-123 = "[s17] \"그럼 최소한 조금만 떨어질 순 없을까?\"\n[s18] \"그 차림으로 붙어있으니 더 오해가 심해질 것 같아.\""
1015003-129 = "안 돼."
1015003-130 = "오디세이아까지 돌아갈 때까지…… 선생님에게서 떨어지지 않을 테니까."
1015003-132 = "(이후, 아까보다 더 따가운 시선을 받으며 오디세이아 학원으로 돌아왔다.)"
