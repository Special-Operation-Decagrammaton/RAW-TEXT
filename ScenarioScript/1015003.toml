1015003-68 = "#na;시민 B 나레이션;내가 듣기로는 수영복은 얌전한 편이라고 들었어. 바니걸이나 애니메이션의 코스프레 차림으로 동행하는 학생도 있다고 들었는데.\n#fontsize;50"
