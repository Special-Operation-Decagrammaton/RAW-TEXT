[translation]
1600305-1 = "섬광만능주의"
1600305-2 = "여깁니다, 선생님. 스즈미입니다."
1600305-3 = "괜찮습니다. 저도 막 왔던 참입니다."
1600305-4 = "절 불러내서 괜찮냐고요? 무슨 말씀이신지……?"
1600305-5 = "아, 자경단 일 때문이라면 마음 쓰지 않으셔도 됩니다."
1600305-6 = "저라고 그게 딱히 좋아서 하는 게 아니기 때문에……"
1600305-7 = "네? 누가 시켜서 억지로 하는 것이냐고요? 아뇨. 그렇지는 않습니다. 제 자의가 맞습니다."
1600305-8 = "다만…… 딱히 즐거워서 그 일을 하는 것은 아니다. 그런 이야기였습니다."
1600305-9 = "굳이 표현하자면, '언젠가 이런 일을 안 해도 되는 곳이 됐으면 좋겠다'입니다만……"
1600305-10 = "……네? 상냥하다고요? 제가요?"
1600305-11 = "그럴 리가요. 보는 사람들마다 무섭다고 도망치거나 경계하는 걸요."
1600305-12 = "이런 일을 하게 되면 어쩔 수 없는 일이라고 개인적으로는 받아들이고 있습니다."
1600305-13 = "……그래도 감사합니다. 그렇게 말씀해 주셔서."
1600305-14 = "가시죠, 선생님. 제가 앞장…… 아니."
1600305-17 = "……옆에서 같이 걷겠습니다."
1600305-18 = "[s] (스즈미를 따라 걷기 시작한다.)"
1600305-22 = "……여기는 제가 꽤 맘에 들어 하는 카페입니다. 잠시 쉬었다 가시겠습니까?"
1600305-23 = "그렇다 해도 늘 먹는 건 한결같이 카페라떼뿐입니다만, 여기 카페라떼는 그래도 꽤……"
1600305-24 = "……와장창! 깽그랭!"
1600305-25 = "꺄아악-! 이게 무슨 짓이에요!!"
1600305-26 = "……!?"
1600305-27 = "으하하! 보면 모르냐, 이번에도 강도 짓을 일삼는 불량 학생이시다!"
1600305-28 = "이번에야말로 사전 조사를 철저히 해 왔지! 오늘은 자경단의 움직임도 없는 날이라고!"
1600305-29 = "잔말 말고 얼른 카운터 열고, 안에 있는 현금 다 꺼내! 지금 당장!!"
1600305-30 = "……하아."
1600305-31 = "정말 질리지도 않는군요. 이 동네의 불량배들은…… 그 열정으로 공부를 했으면……"
1600305-32 = "(하지만 오늘의 나는 자경단이 아니라, 선생님과……)"
1600305-35 = "……"
1600305-36 = "그, 그만둬요! 그건 이번주 매상이 모두 모인 금고라고요!"
1600305-37 = "이거이거 고마워서 어쩌나! 언니들이 자알~ 쓸 테니까. 너무 서운해하지 말라고!"
1600305-38 = "괜한 짓 했다간 병원비까지 나와서 더 마이너스 통장 될 테니까 말이야! 하하하하!"
1600305-39 = "……"
1600305-40 = "……그……"
1600305-41 = "선생님…… 그……"
1600305-42 = "……아, 아니. 아무 것도 아닙니다. 죄송합니다……"
1600305-43 = "[s1] \"괜찮으니까 다녀와.\"\n[s2] \"정말 그냥 갈 거야?\""
1600305-44 = "……!"
1600305-45 = "……!"
1600305-46 = "……음 알겠습니다."
1600305-47 = "정말 감사합니다, 선생님. 조금만 기다려주십시오. 최대한 빨리 끝내겠습니다."
1600305-48 = "……찰칵!"
1600305-49 = "응? 방금 무슨 소리 나지 않았어?"
1600305-50 = "그러게. 무슨 소리지? 약간 데자뷰 같은 게……"
1600305-51 = "전방 섬광탄!!"
1600305-53 = "파앙!! 삐이이이이이-!!!"
1600305-58 = "(……이후로는 몇 번이나 봤던 광경이었다. 불량배들이 섬광탄에 기절하고, 제압당하고.)"
1600305-59 = "(그리고 기둥에 밧줄로 묶인 채 오스틴 비버의 베이비를 듣게 되었다.)"
1600305-61 = "……다녀왔습니다, 선생님. 죄송합니다. 생각보다 늦어버렸네요."
1600305-62 = "이래서야 동행하며 걷기로 한 오늘의 약속 일정이……"
1600305-63 = "네? 괜찮다고요? 충분히 즐거우시다고요?"
1600305-64 = "그보다…… 왜 하필 매번 섬광탄이냐고요?"
1600305-65 = "그, 그야……"
1600305-66 = "그래야 아무도 다치지 않으니까요."
1600305-67 = "섬광탄이 가장 안전하게 상황을 중단시키고, 상대를 제압하는 도구이기 때문입니다."
1600305-68 = "물론 그들은 불량배들이지만…… 그렇다고 제가 그들을 다치게 하는 건 바라지 않거든요."
1600305-69 = "어디까지나 제압이면 충분합니다. 저는 자경단이니까요."
1600305-70 = "[s] \"역시 스즈미는 상냥하구나.\""
1600305-71 = "……! 왜, 왜 그게 그렇게 이어지는 거죠……!"
1600305-72 = "아, 아무튼 계속해서 가시죠! 이래서야 원래대로의 일정을 완료할 수 없습니다!"
1600305-73 = "이쪽으로……!"
1600305-76 = "(하지만 이후 들른 곳들도 각자의 문제가 있었고, 그 때마다 스즈미는 섬광탄을 던졌다.)"
1600305-77 = "(결국 그날 하루 동행하며 스즈미가 던진 섬광탄의 수만 두 자리 수에 달했다.)"
1600305-79 = "……"
1600305-80 = "……면목 없습니다. 선생님……"
1600305-81 = "결국 하루 종일 동행하면서 한 일이, 평소의 자경단 일과 아무런 차이가 없었습니다."
1600305-82 = "전부 상황을 참지 못한 제 불찰입니다. 죄송합니다……"
1600305-83 = "네……? 재밌으셨다고요? 이게…… 말씀이십니까?"
1600305-84 = "나중에 시간 나면 또……? 그게 정말이십니까……?"
1600305-85 = "……"
1600305-86 = "물론입니다. 저는 언제나 환영입니다. 선생님."
1600305-87 = "이런 저와의 동행이라도 괜찮으시다면, 저도 항상 기쁘게 선생님과 걷겠습니다."
1600305-88 = "오늘 정말 감사했습니다."
1600305-91 = "……그리고 즐거웠습니다."
1600305-93 = "(그렇게 말한 스즈미는 몸을 돌려 천천히 반대쪽 길로 돌아갔다.)"
1600305-94 = "(그리고 지금까지와는 달리, 꽤 자연스럽고 여유로운 발걸음이었다.)"
