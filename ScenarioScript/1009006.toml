[translation]
1009006-1 = "단 한 사람만을 위한 축제."
1009006-4 = "와아! 선생님!"
1009006-5 = "[s1] \"아, 안녕. 우미카.\"\n[s2] \"뭔가 평소보다 더…… 활기차, 보이네?\""
1009006-8 = "그런가요? 전 잘 모르겠는데요?"
1009006-9 = "다소 격한 환영인사였다고요? 으음…… 선생님의 기분 탓이 아니었을까요? 에헤헤."
1009006-10 = "오늘 이렇게 특별히 선생님을 모신 이유는……."
1009006-11 = "[s] \"이유는……!\""
1009006-12 = "아직은, 비밀이랍니다!"
1009006-13 = "[s] \"비밀이구나…….\""
1009006-14 = "그, 그렇게 실망하실 필요는 아직 없지 않을까요?!"
1009006-15 = "있잖아요, 선생님?"
1009006-16 = "지금부터 말이에요……. 저는 뒷문으로 조용히 나갈 거랍니다?"
1009006-17 = "그리고 그러고 나면, 열을 세신 다음."
1009006-18 = "천천히, 뒷문으로 저를 따라와 주세요. 아셨죠?"
1009006-19 = "그러면 먼저…… 실례하겠습니다!"
1009006-24 = "(우미카는 조신한 몸놀림으로 뒷문을 향해 나갔다…….)"
1009006-28 = "(속으로 열을 센 다음…….)"
1009006-32 = "[ns] (뒷문으로 나간다.)"
1009006-38 = "[wa:830]― [log=우미카]축제에 어서 오세요, [wa:1400]선생님![wa:120] [/log]"
1009006-41 = "[wa:250]― [log=우미카]에헤헤. [wa:1390]어때요?[/log]"
1009006-42 = "[wa:1520]― [log=우미카]지금까지 계속 준비하고 있던 건…… [wa:2900]전부 [wa:1400]이 순간을 위해서였어요![/log]"
1009006-45 = "[wa:530]― [log=우미카]누구에게도 알리지 않았고, [wa:1720]누구도 초대하지 않았답니다.[/log]"
1009006-48 = "[wa:600]― [log=우미카]이 축제는…… [wa:2430]선생님을 위한 것이니까요![/log]"
1009006-51 = "[wa:370]― [log=우미카]다른 누구도 없는, [wa:2260]저와 선생님만의 축제……[/log]"
1009006-52 = "[wa:3080]― [log=우미카]조금 부끄럽기도 하지만…… [wa:2840]마음에 드셨으면 [wa:1710]좋겠어요![/log]"
1009006-56 = "예전에, 말씀하셨죠. 샬레의 일 때문에 좀처럼 테마파크에도, 축제에도 일정을 맞춰 즐기기가 힘드시다고……."
1009006-57 = "[s] \"그래서…… 이런 축제를, 준비한 거야?\""
1009006-58 = "네. 일 때문에 축제 일정을 맞추기 힘드시다면, 비교적 작은…… 한 사람만을 위한 축제라면, 부담 없이 참여하실 수 있지 않을까 해서요."
1009006-59 = "시간적인 의미로든, 업무적인 의미로든요."
1009006-60 = "[s] \"그때의 '좋은 생각'이란 게, 이거였구나.\""
1009006-61 = "에헤헤."
1009006-62 = "그보다, 선생님! 모처럼 이렇게 축제에 오셨으니까, 제가 전부 안내해 드릴게요!"
1009006-63 = "우선은요, 우선은요! 여기 '선생님 부채'부터 봐주세요!"
1009006-64 = "[s] \"으, 응……! 확실히 적혀 있네. '[USERNAME]' 이라고…….\""
1009006-65 = "그리구요, 그리구요! '선생님 꼬치구이'도 있어요! 드셔 보세요!"
1009006-66 = "[s] \"……보통의 꼬치구이와, 뭐가 다른 거야……?\""
1009006-67 = "훗훗훗. 그건 말이죠……. 지금까지 백야당에서 선생님이 주문하신 메뉴에 기반하여……."
1009006-68 = "선생님이 가장 좋아하실 것 같은 소스를 엄선해! 발라서 구웠답니다!"
1009006-69 = "다음은 '선생님 오코노미야키'를 구워 드릴게요! 오코노미야키는 원래 자기가 좋아하는 재료를 넣고 구운 것……."
1009006-70 = "따라서 선생님께서 좋아하시는 걸 넣고 구우면, 그게 '선생님 오코노미야키'가 된다는 뜻이죠!"
1009006-71 = "[s] \"거기까지 알 수 있는 것인가, 백야당!\""
1009006-72 = "에헤헤. 백야당의 서비스를 가볍게 보시면 곤란하다구요?!"
1009006-73 = "거기에 '선생님 솜사탕', '선생님 요요 낚시', '선생님 사격', 그리고 또……!"
1009006-89 = "[ns] \"슬슬 무지하게 부끄러워지기 시작했습니다만!\""
1009006-91 = "괜찮아요! 저희 둘 뿐인걸요! 아, 사진도 찍으실래요?"
1009006-96 = "그리고 마지막에는 정말 특별한 코스도 준비되어 있으니까요!"
1009006-101 = "그래서 최종적으로, '선생님 축제', 어떠셨나요?"
1009006-102 = "[s] \"여러 가지로, 엄청나게 기억에 남을 것 같아…….\""
1009006-103 = "그렇죠? 그렇죠?"
1009006-107 = "그, 주객전도일지도, 모르지만……."
1009006-108 = "저도 이번 '선생님 축제'가, 아주 오랫동안 기억에 남을 것 같아요……."
1009006-109 = "[s3] \"……응. 그래. 그렇다면 다행이네.\"\n[s4] \"고마워. 우미카. 잊지 못할 추억이 될 것 같아.\""
1009006-115 = "정말…… 요?"
1009006-116 = "……."
1009006-117 = "아, 아직이에요! 저의 '선생님 축제'는! 거의 마지막을 맞이하긴 했지만! 완전히 끝난 것은 아니니까요!"
1009006-118 = "[s] \"아직도 뭔가 남았어?!\""
1009006-119 = "네! 저쪽을 봐주세요!"
1009006-127 = "[ns] \"불꽃까지……?\""
1009006-128 = "그럼요! 축제의 마지막은 역시 불꽃이니까요!"
1009006-134 = "저…… 선생님?"
1009006-135 = "[ns] \"응?\""
1009006-137 = "잠시 옆에 앉아도, 괜찮을까요……?"
1009006-142 = "감사합니다. 에헤헤……."
1009006-146 = "(우미카가 조용히 옆으로 다가와 앉았다.)"
1009006-147 = "(우리는 그렇게 서로의 체온을 느끼며, 쏘아 올린 불꽃을 아래로부터 올려다보았다…….)"
