[translation]
2300805-1 = "몸이 내린 벌"
2300805-2 = "(걱정이 되어 병문안을 위해 마리의 방으로 향했다.)"
2300805-6 = "……? 누구세요……?"
2300805-7 = "[s1] \"병문안 왔어.\"\n[s2] \"혹시 쉬는데 방해했을까?\""
2300805-10 = "……!?"
2300805-11 = "서, 선생님……!? 선생님이 어째서 여길……."
2300805-12 = "자, 잠시만요! 조금만 기다려 주세요……."
2300805-20 = "어, 어서 오세요……. 선생님."
2300805-21 = "죄송해요. 아직 방 정리가 그다지……."
2300805-22 = "상관없으시다고요?"
2300805-23 = "그, 그렇지만……."
2300805-24 = "……네? 침대에 누워서 쉬고 있으라고요? 그, 그렇지만 선생님이 오셨는데 어떻게……."
2300805-25 = "[s3] \"안 그러면 병문안의 의미가 없지.\"\n[s4] \"아픈 사람이 우선이잖아?\""
2300805-26 = "그런……."
2300805-27 = "그런……."
2300805-28 = "아, 알겠어요. 기껏 여기까지 와 주셨는데, 곤란하게 해드릴 순 없겠지요."
2300805-29 = "그럼 말씀하신 대로……."
2300805-34 = "(마리는 다시 침대로 돌아가 이불을 덮고 누웠다.)"
2300805-35 = "왠지 걱정 끼쳐드린 것 같아 죄송하네요. 정말 별 일 아닌데……."
2300805-36 = "[s] \"몸은 좀 괜찮아?\""
2300805-37 = "아하하……. 역시 걱정 끼쳐드리고 있었군요. 죄송해요."
2300805-38 = "네. 조금 쉬었더니 많이 괜찮아 졌어요. 내일이면 다시 평소처럼 쌩쌩해질 것 같아요."
2300805-39 = "다른 분들을 격려해 드려야 할 시스터가 오히려 문안을 받고 있다니, 기분이 조금 이상하네요."
2300805-40 = "아하하……."
2300805-41 = "……."
2300805-46 = "[ns5] \"……마리?\"\n[ns6] \"뭔가 할 말이라도 있어?\""
2300805-49 = "그게……. 으음……."
2300805-50 = "……실은……."
2300805-51 = "최근에는 일들이 조금 피곤하다고 느껴져서……. 하루 정도 쉬고 싶다고 생각했었거든요."
2300805-52 = "어쩌면 지금의 몸 상태가……. 그런 바람 때문일지도 모르겠다는 생각이 들었어요."
2300805-53 = "다른 시스터 분들도 다들 하는 일인데 어리광이 좀 심했었나봐요."
2300805-54 = "시스터에게 어울리지 않는 생각을 하고 있었기 때문에, 제 몸이 내린 벌이 아닐까 하는 생각……?"
2300805-55 = "……네?"
2300805-56 = "벌이 아니라……. 도와준 걸 수도 있다고요? 제 몸이?"
2300805-57 = "으음. 무슨 말씀이신지 잘……. 어째서 이게 도움이 되는 걸까요……?"
2300805-58 = "[s7] \"오래오래 건강한 게 좋으니까.\"\n[s8] \"시스터로서 오래오래 활동하기 위해서라도.\""
2300805-64 = "……?"
2300805-65 = "……아……."
2300805-66 = "후후. 과연……. 그렇군요. 그렇게 생각할 수도 있겠네요."
2300805-72 = "감사합니다. 선생님. 덕분에 뭔가 개운해진 느낌이에요."
2300805-73 = "몸뿐만이 아니라……. 마음까지도 말이에요."
2300805-74 = "내심 쉬면서도 계속 혼자 생각하며 고민하던 부분이었거든요. 그런데 이렇게 쉽게 해결해주시다니……."
2300805-75 = "선생님께선 정말 제 마음을 편하게 해주시는군요. 누군가를 돕고 싶은 사람으로서 저도 배우고 싶어요."
2300805-76 = "기회가 된다면……. 그리고 선생님께서도 괜찮으시다면 언제 한번……."
2300805-77 = "……음?"
2300805-78 = "아. 당연히 오늘의 이야기는 아니었어요."
2300805-79 = "말씀하신 대로 오늘은 쉬는 것만 생각해야겠지요."
2300805-80 = "내일을 위해서도, 앞으로를 위해서도……. 다만……."
2300805-81 = "언젠가……라는 정도로만 생각하고 있을 게요."
2300805-83 = "(이후 얼마간 마리의 말동무를 해주며 쉬는 것을 지켜보았다.)"
2300805-84 = "(마리가 다시 잠든 것을 확인한 후 샬레로 돌아왔다.)"
