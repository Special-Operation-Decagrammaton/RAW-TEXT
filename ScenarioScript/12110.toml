[translation]
12110-1 = "제11화;이길 수 없는 싸움"
12110-2 = "(사각사각)"
12110-3 = "부장님…… 이거 언제까지 써야 하는 걸까요?"
12110-4 = "이제 겨우 200장째잖아. 너 스스로 1000장을 채운다고 하지 않았나?"
12110-5 = "그건 반성문을 그만큼 많이 쓴다는 관용구로……."
12110-6 = "시끄러워."
12110-7 = "아, 아하하……. 네. 열심히 쓰겠습니다……."
12110-8 = "(사각사각)"
12110-9 = "그런데……"
12110-12 = "그 아비도스의 호시노라는 분, 아는 분인가요?"
12110-13 = "……아니. 실제로 본 건 처음이야."
12110-14 = "그런가요……. 어쩐지 부장님이 잘 아는 사람인 것처럼 말씀하셔서……."
12110-15 = "……."
12110-16 = "……타카나시 호시노."
12110-17 = "<천재> 라는 평을 받았던 초 엘리트다. 2년 전 정보부의 분석으로는 게헨나의 잠재 위협 중 하나였어."
12110-18 = "네? 전혀 그렇게 안보였는데요?!"
12110-21 = "어쩐지 느긋한 느낌이었는데……."
12110-23 = "외모로 사람을 평가하지 마라. 아코."
12110-24 = "……하지만 2년 전과는 전혀 다른 모습이 되어버리긴 했지."
12110-25 = "원래는 공격적인 전술을 주로 펼치는 호전적인 성격에…… 꽤 거칠고 날카로운 인상이었는데."
12110-26 = "……. 뭐, 어쨌든."
12110-27 = "그때 그대로 싸웠다면 선도부원의 상당수가 전투불능이 되었을 거다. 아코. 네 성급한 행동으로 말야."
12110-28 = "그 <샬레>도 있으니 피해는 더 심했을 수도 있고."
12110-29 = "……. 그, 그러나 전력 분석은 확실히 했는데……. 그런 정보는……."
12110-30 = "……어느 순간 활동 소식이 끊겼거든."
12110-31 = "워낙 작은 학교니 정보부도 더이상 위협으로 간주하지 않은 거겠지."
12110-32 = "자세한 이야기라면 정보부의 옛 자료라도 뒤져봐라. 아코."
12110-36 = "하지만 아직도 아비도스를 떠나지 않고 남아있었던 건가……. 타카나시 호시노."
12110-37 = "어째서지……?"
12110-39 = "우리 아비도스의 채권자……."
12110-40 = "……. 카이저 코퍼레이션의……."
12110-42 = "아아. 정식으로 소개할까. 카이저 코퍼레이션, 카이저 론, 카이저 컨스트럭션의 대임원이다."
12110-43 = "지금은 이 카이저 PMC의 대표이사를 맡고 있지."
12110-44 = "다른 말 할 것 없어. 당신이 우리 아비도스 학교를 속이고, 착취한 당사자라는 거군."
12110-45 = "……호오?"
12110-46 = "그래! 헬멧단과 흥신소를 사주해서 우리를 계속 괴롭혀 온 범인이잖아! 맞지?"
12110-47 = "흐음?"
12110-48 = "네 녀석 때문에 우리 아비도스가……. 아비도스가……!!"
12110-49 = "이런이런…… 억지도 이런 억지가 없군."
12110-50 = "멋대로 남의 사유지에 불법 침입해 와서 선량한 우리 PMC 직원들을 공격하고, 시설을 파괴해놓고 한다는 말이, 나 때문이다-?"
12110-51 = "……큭, 큭큭. 정말 걸작이군."
12110-53 = "분명하게 하지. 이곳은 우리 카이저 PMC의 합법적인 사업장이다. 너희는 지금 기업의 사유지를 불법 침입한 것이고."
12110-54 = "……!!"
12110-55 = "……!!"
12110-56 = "아아, 그래. 아비도스 자치구의 땅. 아아, 그걸 사들이긴 했지."
12110-57 = "하지만 그래서? 모든 것은 합법적인 거래였다. 거래 장부도, 기록도 모두 다 가지고 있지."
12110-58 = "마치 우리가 불법이라도 저지르고 있는 양 구는 것이 매우 불쾌하군."
12110-59 = "우리가 여기서 뭘 하고 있는지 궁금한가? 너희의 땅을 사들인 이유가 궁금한가?"
12110-60 = "알려주지. 우리는 아비도스 어딘가에 묻혀있다는 보물을 찾고 있다."
12110-61 = "……!"
12110-62 = "……그런 아무렇게나 내뱉는 거짓말을!!"
12110-63 = "그래. 그렇다면 이 PMC 병력들이 설명되지 않아."
12110-64 = "이 병력은 우리 자치구를 무력으로 점거하기 위한 것 아니야?"
12110-67 = "……."
12110-68 = "수백대의 전차, 수백 명의 정예 병사들. 수백톤의 화약과 탄약들."
12110-69 = "고작 5명이 남아있는 학교 따위를 위해 이런 것을 준비했다고? 농담도 지나치군."
12110-70 = "이건 보물찾기를 방해하는 녀석들을 막기위한 방어책일 뿐이다. 너희들 따위를 위해서가 아니라."
12110-71 = "너희를 상대하는 데는…… 그래, 이런 걸로도 충분하니까."
12110-73 = "……나다. ……그래. ……진행해라."
12110-74 = "뭐, 뭐야? 갑자기 전화를……? 진행……? 무슨 소릴 하는 거야?"
12110-75 = "안타깝군. 너희 학교의 신용이 추락해버렸다는 얘기다."
12110-78 = "(삐리리리-)"
12110-79 = "가, 갑자기 전화……?"
12110-81 = "카이저 론입니다. 현 시간부로 아비도스의 신용 평가를 최하로 적용하겠습니다."
12110-82 = "!!?"
12110-83 = "이자의 변동금리를 3000% 상향하여, 다음달부터 적용되는 금액은 9130만엔입니다."
12110-84 = "다음달 상환 기일까지 부탁드립니다."
12110-85 = "네?! 자, 잠깐만요…… 무, 무슨…… 갑자기……? 다음 달까지……."
12110-87 = "9천만엔?! 무, 무슨 소리야?!"
12110-88 = "……큭큭큭."
12110-89 = "그런 것이다. 이제 알겠나? 너희들 목에 채워진 줄이 누구 손에 있는지를?"
12110-90 = "……!"
12110-91 = "아, 자, 잠깐……! 무슨……."
12110-92 = "……."
12110-93 = "가혹하다고 생각하나? 하지만 이걸로 끝이 아니다."
12110-94 = "그래, 대출 원금 9억의 증거금을 받아둬야겠군. 일주일 안에 우리 카이저 론에 3억을 예탁해라."
12110-95 = "너희가 이 이율로도 빚을 갚을 수 있다는 것을 증명해야 할 것이다. 크크큭. 가능하다면 말이야."
12110-96 = "……."
12110-97 = "……."
12110-98 = "그, 그런 돈……. 생길 리가……. 지금도 간신히 이자만 내고 있는데…… 그런……."
12110-100 = "그렇다면 학원을 포기하고 떠나면 되겠군."
12110-101 = "!!"
12110-102 = "자퇴라도 하고 전학이라도 가라. 그러면 되는 것 아닌가? 애초에 너희 개인의 빚이 아니다."
12110-103 = "학교가 책임질 금액. 너희가 책임져야 할 일이 아니지 않느냐."
12110-104 = "그, 그런……!! 우리가 그런 짓을 할 수 있을 리가 없잖아요!"
12110-105 = "우리들의 학교라고!! 버리고 떠날 리가 없잖아!"
12110-106 = "아비도스는 우리들의 마을이야."
12110-108 = "억지도 가지가지군. 어쩌자는 거지? 말장난을 하겠다는 건가?"
12110-109 = "……모두들. 돌아가자."
12110-110 = "호시노 선배……!!?"
12110-111 = "……여기서는 더이상 싸워선 안돼. 더 놀아날 뿐이야."
12110-112 = "그래. 부학생회장. 너는 현명한 것 같군."
12110-113 = "……아아, 그래. 기억났다. 그 학생회장은 그러지 못했었던가? 크큭. 크큭."
12110-114 = "……."
12110-115 = "그럼 다음달의 상환도 잘 부탁드립니다. 고객님들."
12110-116 = "크하하하하하……!!"
12110-117 = "개운해졌다. 자아, 손님들을 입구까지 모셔드려라."
12110-122 = "……."
12110-124 = "다음화;비밀들"
