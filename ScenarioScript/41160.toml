[translation]
41160-1 = "제16화;리베이트"
41160-5 = "당신은……"
41160-6 = "발키리 경찰학교의 '미친개' 잖아?"
41160-8 = "……오가타 칸나. 최소한 공안국장이라고 불러주었으면 좋겠는데."
41160-9 = "싫어하는 별명은 아니지만, 우리가 그리 친근하게 별명으로 서로를 부를 사이는 아니라고 생각하는데 말이야."
41160-10 = "칸나 국장. 여기는 무슨 일이시죠?"
41160-11 = "그게 범죄를 저지른 불량 학생들이 발키리의 간부 앞에서 할 질문인가?"
41160-12 = "당연히 시민이 사용해야 할 공원을 불법으로 점거하고 지역 사회에 불안감을 조성하는 불량 학생들을 단속하기 위해 찾아왔지."
41160-13 = "잠깐, 이 공원을 써도 좋다고 허락한 건 방위실장이었거든?"
41160-14 = "발키리의 공안국장이나 되는 사람이 상관이 한 말을 멋대로 어겨도 괜찮은 거야?"
41160-15 = "뭔가 오해를 한 것 같은데."
41160-16 = "실장님께서 너희가 이 공원에 머물러도 좋다고 직접 말씀하신 적은 없다."
41160-17 = "그저 너희의 처벌을 보류하겠다는 관대한 처분만을 내리셨을 뿐이지."
41160-23 = "……그렇네요. 원칙적으로 공원의 관리는 방위실이 아닌 문화실의 소관."
41160-24 = "방위실장이 보장해 준 것은 퇴학 처분의 보류뿐, 공원에서의 노숙 자체는 허가받지 못했으니까요."
41160-25 = "그게 뭐야. 어차피 돌아갈 집도 없는 사람에게 노숙을 하지 말라니……"
41160-26 = "완전히 눈 가리고 아웅이잖아!"
41160-27 = "그, 그런데 어째서 공안국이 직접 저희를 상대하러 오신 건가요……?"
41160-28 = "치안과 관련된 일은 보통 경비국이 처리하는 것으로 알고 있는데요……."
41160-33 = "키보토스에 중대한 위협을 초래할 정도의 테러가 예상되지 않는 한, 노숙자의 퇴거는 보통 경비국이 처리하는 일이 맞긴 하지."
41160-34 = "……보통의 상황이었다면 말이야."
41160-36 = "그래서, 뭐! 우리가 나가지 않으면 강제로라도 끌어내겠다는 거야?"
41160-37 = "그러게. 지난번에 너희들이 떼를 지어 몰려들었다가 속수무책으로 당한 걸 벌써 잊어버린 거야? 쿠히히."
41160-38 = "말을 가려서 하지, 카제쿠라 군. 우리에게도 듣는 귀와 보는 눈 정도는 있으니까."
41160-39 = "듣자 하니 지난주에 내린 폭우로 인해 RABBIT 소대의 장비가 대부분 침수되었다면서?"
41160-40 = "윽……."
41160-41 = "중고품을 팔아 새 장비를 구했다고는 하지만, 공원 전체를 커버하기에는 턱없이 적은 물량이지."
41160-42 = "그에 비해 우리 공안국은 스폰서의 협력을 받아 강력한 화기를 충분히 확보했거든."
41160-43 = "아무리 귀관들이 뛰어난 전투 능력을 지닌 엘리트들이라 하더라도 수적, 질적 열세를 모두 극복할 수는 없어."
41160-50 = "자, 그럼 결정하도록."
41160-51 = "이만 얌전히 이 공원을 떠날지, 아니면 그 조악한 무기를 들고 헛된 싸움을 계속할지."
41160-53 = "뭐? 진짜로 지금 해보자는 거냐?"
41160-54 = "무기는 부족할지 몰라도 너희들에게 먹여줄 폭탄은 충분하거든?!"
41160-55 = "그, 그렇지만 지금의 우리가 공안국을 이길 수 있을까……? 심지어 탄약도 부족한데……."
41160-56 = "어떻게 하지, 미야코 쨩……."
41160-62 = "저희는……."
41160-63 = "[s] \"잠깐, 모두 기다려 줘.\""
41160-67 = "……샬레의 선생님? 어째서 이곳에……?"
41160-68 = "아, 그러고 보니 전에 실장님께서 말씀하셨지요. RABBIT 소대의 처우는 샬레의 선생님께 맡기겠다고."
41160-69 = "선생님의 말씀이라 하더라도 결정을 번복할 수는 없습니다."
41160-70 = "코우사기 타운의 재개발은 이미 높으신 분들의 결정으로 확정된 사항이니까요."
41160-71 = "[s1] \"하지만 갑자기 공원을 나가라고 해도 곤란해.\"\n[s2] \"학생들에게 생각을 정리할 시간을 줘.\""
41160-72 = "생각을 정리할 시간은 충분히 드렸다고 생각합니다만."
41160-73 = "생각을 정리할 시간은 충분히 드렸다고 생각합니다만."
41160-77 = "……알겠습니다."
41160-78 = "선생님께는 전에 진 빚이 있으니, 오늘은 이만 물러가지요."
41160-79 = "다만 저희도 언제까지 사정을 봐 드릴 수는 없습니다."
41160-80 = "이번 달 말까지 RABBIT 소대의 퇴거가 정상적으로 진행되지 않는다면 저희도 무력을 사용하는 수밖에 없습니다."
41160-81 = "……저에게도 '지켜야 할 것'이 있으니까요."
41160-85 = "부대 철수! 코우사기 공원의 철거는 다음에 진행한다!"
41160-95 = "지난번에도 샬레의 도움으로 간신히 이긴 주제에 잘난 척하기는!"
41160-96 = "하지만 지난번에 비해 공안국의 무장이 강화된 건 사실인 것 같네요."
41160-97 = "모에. 조금 전의 칸나 국장과 공안국 학생들이 들고 있던 화기가 <카이저 인더스트리>의 물건이 맞나요?"
41160-99 = "응, 틀림없어. 그때 우리가 구매하려고 했던 <카이저 인더스트리>의 무기들이야."
41160-100 = "그런데 발키리의 자린고비들이 그 비싼 무기들을 어떻게 구입한 거지? 이해가 안 가네."
41160-101 = "그러고 보니 아까 국장이 스폰서라는 말을 한 것 같은데……."
41160-102 = "[s] \"……리베이트를 받은 게 아닐까.\""
41160-103 = "……리베이트요?"
41160-104 = "리베이트라면, 판매를 장려하기 위해 물건을 구입한 뒤에 차액을 돌려받는 제도잖아?"
41160-105 = "<카이저 인더스트리>가 무슨 이득이 있다고 발키리 경찰학교에 돈을 돌려주는데?"
41160-107 = "(RABBIT 소대에게 생각하는 바를 말해준다.)"
41160-110 = "……그렇군요."
41160-111 = "코우사기 타운의 개발을 담당하고 있는 <카이저 컨스트럭션>은 <카이저 인더스트리>와 같은 계열사이니, 자금의 이동이 비교적 자유롭겠지요."
41160-112 = "<카이저 컨스트럭션>이 코우사기 타운의 노숙자들이 사라져서 얻게 되는 이득을, <카이저 인더스트리>가 공안국에게 무기의 형태로 대신 제공한다면……."
41160-114 = "공안국은 노숙자들을 대신 쫓아내 주는 대가로 무기와 탄약을 잔뜩 얻게 되는 셈이네."
41160-115 = "……그거, 불법 아냐?"
41160-116 = "당연히 불법입니다."
41160-117 = "시민에게 봉사해야 할 경찰학교의 학생들이 사사로운 이득을 취하기 위해 기업을 위해 일하고 있는 셈이니까요."
41160-118 = "경찰이 기업과 결탁하여 시민을 공격하다니……"
41160-119 = "도대체 세상이 어떻게 되어가고 있는 거야?"
41160-120 = "우리가 그런 말을 할 처지는 아니지만……."
41160-121 = "[s] \"물론 아직은 심증에 불과해.\""
41160-122 = "그렇네요."
41160-123 = "공안국이 새로운 무기를 구입하게 된 정황을 외부에서 확인할 수는 없으니까요."
41160-125 = "게다가 발키리 경찰학교의 거래 기록은 로컬 서버에 따로 저장해두기 때문에 해킹을 시도하는 것도 불가능하고."
41160-126 = "쳇, 결정적인 증거가 있으면 녀석들의 계획을 꺾을 수 있었을 텐데……."
41160-127 = "이 일을 무마할 다른 방법은 없는 걸까?"
41160-133 = "발키리 경찰학교의 본관에 직접 잠입하면 거래기록을 확보할 수 있을지도……"
41160-138 = "지금 무슨 소리를 하는지 알고나 있는 거야?"
41160-139 = "발키리 경찰학교의 본관은 최소 수백 명 이상의 무장 병력이 상주하고 있는 요새나 다름없다고!"
41160-140 = "제대로 된 지원을 받아도 어려울 텐데……"
41160-141 = "우리 힘으로는 절대로 불가능할 거야……"
41160-142 = "이런 일은 그냥 얌전히 신고나 하고 기다리는 게 정답이야."
41160-143 = "[s] \"경찰학교의 문제를 어디에 신고하려고?\""
41160-144 = "……그러게? 경찰학교에서 발생한 문제는 누가 해결해야 하지?"
41160-145 = "발키리 경찰학교에서 문제가 터졌을 때 이를 감찰하고 조사할 수 있는 차상위의 치안 기관이라면……"
41160-151 = "SRT…… 밖에 없겠지요."
41160-153 = "그렇네. 우리였잖아?"
41160-154 = "우리가 하지 않으면 아무도 이 문제를 해결할 수 없어."
41160-155 = "하지만…… 우리에게 그럴 자격이 있을까?"
41160-156 = "지금의 우리에게는 학교도 없는데……"
41160-157 = "[s] \"……너희들이 그렇게 믿는다면.\""
41160-159 = "……선생님?"
41160-165 = "[ns3] \"다녀와. 여차하면 뒷일은 내가 책임질 테니까.\"\n[ns4] \"가능한 다치지 않게 조심해.\""
41160-170 = "……정말 대책없는 어른이네요."
41160-171 = "선생님, 책임이라는 말의 의미는 알고 있는 거야?"
41160-172 = "순 바보 아냐……?"
41160-173 = "바보 같아…… 후후."
41160-178 = "하지만 덕분에, 확실히 깨달았습니다."
41160-179 = "저희는 SRT. 키보토스에서 가장 빠르게 투입되는 특수부대."
41160-184 = "질서를 거스르는 범죄자는 신속하게 제압하고……"
41160-185 = "가능한 모든 화력을 투사하여 응징한 뒤……"
41160-186 = "……모두가 알아차리기 전에 은밀하게 퇴출한다."
41160-188 = "발키리 경찰학교의 정예가 일개 기업과 결탁하여 불법 행위를 저지르고 있다면, 정상적인 절차를 통해 진상을 밝혀내는 건 어렵겠지요."
41160-189 = "이번 임무는 SRT 특수학원이 그동안 처리해 온 임무의 목적과도 부합합니다."
41160-193 = "여러분, 모두 진입 작전에 필요한 장비를 챙겨주세요."
41160-194 = "지금부터 저희는……"
41160-196 = "발키리 공안국의 불법 리베이트 증거를 확보하기 위한, <클로버 작전>을 개시합니다!"
41160-198 = "다음화;클로버 작전 1"
