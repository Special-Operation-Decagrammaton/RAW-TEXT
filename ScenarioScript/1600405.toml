[translation]
1600405-1 = "끝나지 않는 밤"
1600405-2 = "오오! 선생님! 여기에요, 여기!"
1600405-3 = "헤헤. 나와줬군요! 덕분에 피나는 아주 기분이 좋습니다!"
1600405-4 = "……흐음~."
1600405-5 = "혹시 바쁜데 억지로 나오고 그런 건 아닐까요? 표도 말도 없이 끊어버린 터라 왠지 걱정이……"
1600405-6 = "[s1] \"마침 쉬는 날이었어.\"\n[s2] \"하하. 농땡이 치는 맛을 모르시네.\""
1600405-7 = "그렇구나, 다행입니다! 내심 되게 걱정했었거든요!"
1600405-8 = "엣…… 괘, 괜찮은 겁니까, 선생님!?"
1600405-9 = "아, 아무튼! 아무튼이에요!"
1600405-10 = "그럼 이렇게 불러낸 이상, 이 피나가 선생님께 확실한 재미를 책임져드려야 겠군요!"
1600405-11 = "허나 걱정할 필욘 없어요! 어차피 오늘 준비한 영화는 하나가 아니기 때문입니다!"
1600405-12 = "준비된 영화의 탄환은 총 21편! 이 중에 하나쯤은 당신이 좋아하는 취향이 있겠지!-라고요!"
1600405-13 = "후훗. 놀라는 얼굴이시군요. 어째서 티켓은 두 장뿐이랬는데 영화는 21편이냐?"
1600405-14 = "그건 바로 이 티켓이 그냥 티켓이 아닌……"
1600405-16 = "<릴레이 상영회> 티켓이기 때문입니다-!! 빠바암-!!"
1600405-17 = "[s] \"릴레이 상영회?\""
1600405-18 = "후후. 놀라실 줄 알았죠. 이건 말 그대로 영화를 릴레이로 상영하는 이벤트."
1600405-19 = "영화를 좋아하는 매니아 층을 위해, 비슷한 장르의 영화들을 묶어서 상영해주는 형식입니다!"
1600405-20 = "당연히 저희가 볼 영화 릴레이는 임협/느와르 영화 릴레이!!"
1600405-21 = "자, 자! 시간이 없습니다! 우선 첫 번째 영화부터! 렛츠-고-!!"
1600405-23 = "(곧바로 피나의 손에 붙잡힌 채 극장 안으로 끌려들어 갔다.)"
1600405-24 = "(의외로 영화 내용은 썩 나쁘지 않은 임협 영화였다. 크게 폭력적인 부분은 편집돼 있었다.)"
1600405-25 = "(아쉽다고 하면 아쉬울 수 있는 부분이었지만, 그 덕분에 학생들도 다같이 즐길 수 있었다.)"
1600405-27 = "하…… 정말……"
1600405-28 = "정말 대단한 영화였어요…… 두목…… 아니 선생님…… 아니, 두목……"
1600405-29 = "아, 아니. 선생님이 맞지. 참. 선생님…… 죄송……"
1600405-30 = "선생님은 어떠셨나요? 재미 있으셨습니까?"
1600405-31 = "[s] \"후…… 지금은 두목이라 부르도록……\""
1600405-32 = "……!!"
1600405-33 = "저, 정말……이십니까……! 두목……!"
1600405-34 = "조, 좋습니다! 명하신 대로 그리 하겠습니다, 두목! 곧장 다음 영화로 가시죠!"
1600405-35 = "두 번째 영화는 <의리 없는 냥냥펀치>입니다!!"
1600405-37 = "(이후 이어진 영화들도 하나같이 훌륭한 내용들의 영화들뿐이었다.)"
1600405-38 = "(모두 특유의 하드보일드함을 때론 서정적으로, 때론 격정적으로 잘 그려내고 있었다.)"
1600405-39 = "(……)"
1600405-40 = "(하지만……)"
1600405-42 = "크……! 이번에도 정말 훌륭했습니다, 선생ㄴ…… 두목!!"
1600405-43 = "그럼 곧장 또 다음의 영화로……!"
1600405-45 = "(아무리 훌륭한 영화들이라곤 해도, 같은 장르의 영화를 21편이나 튼다는 것은.)"
1600405-46 = "(그리고 잠조차 들지 못하게, 옆에서 계속 대화를 걸며 영화 내용과 동화돼 간다는 것은.)"
1600405-48 = "캬……! 이거지요, 이거……! 그럼 다음 영화는……!"
1600405-50 = "(……보통의 인간에게는……)"
1600405-52 = "…정말이지…!"
1600405-54 = "(……때로는, 일종의 고문과도 같은 일……)"
1600405-56 = "최."
1600405-58 = "고."
1600405-60 = "임다……!"
1600405-62 = "(그렇게 마지막 21번째 영화를 보던 중. 언제인지 모르는 순간, 의식이 완전히 날아가버렸다.)"
1600405-63 = "(……정신을 차리고 보니, 이미 영화관 밖 강변의 잔디밭에 옮겨져 있었다.)"
1600405-65 = "……"
1600405-66 = "……서, 선생님……? 정신이 드세요……?"
1600405-67 = "[s3] \"여긴 어디……? 나는 누구……?\"\n[s4] \"……무사히 돌아왔나, 나의 세계에……\""
1600405-68 = "으, 으으……!"
1600405-69 = "으, 으으……!"
1600405-70 = "저, 정신 차려요, 선생님! 자신을 잃으면 안 돼요! 제가 잘못했어요!"
1600405-71 = "으, 으으…… 미안해요…… 이렇게 될 걸 미리 예상했어야 했는데……"
1600405-72 = "저는 며칠 밤낮이고 임협 영화를 보던 게 습관이었다 보니…… 선생님 생각을 못했네요."
1600405-73 = "다 피나의 불찰입니다…… 정말 미안해요……"
1600405-74 = "앞으로는 같이 영화보자고 안 할 게요……"
1600405-75 = "으흑…… 흑흑……"
1600405-76 = "[s5] \"괜찮아. 신경 쓰지 마.\"\n[s6] \"난 아직 '두목'을 철회하지 않았다만……\""
1600405-77 = "……?"
1600405-78 = "……?"
1600405-79 = "에? 그, 그게 무슨……"
1600405-80 = "……네? 신경 쓸 필요 없다고요?"
1600405-81 = "의식을 잃은 게 아니라…… 잠시 잤던 것뿐이라고요?"
1600405-82 = "……이상하다…… 그럴 리가 없는데…… 아무리 봐도 기절한 것 같았는데요?"
1600405-83 = "……에?"
1600405-84 = "아, 아뇨! 토를 달다니요!? 그럴 리가요! 두목께 어떻게 그런 짓을 하겠습니까!"
1600405-85 = "마, 맞습니다! 그 말씀 대롭니다! 잠시 주무셨던 것뿐입니다! 제가 잘 못 봤었습니다!"
1600405-86 = "단지 저는……!"
1600405-87 = "……"
1600405-88 = "……풉."
1600405-89 = "푸하하하하하!! 아~~!"
1600405-90 = "아하하하!! 눈물 납니다, 정말! 아하하하하하!"
1600405-91 = "아하하…… 하아…… 하…… 아 정말이지……!"
1600405-92 = "……"
1600405-93 = "……감사합니다, 선생님. 선생님은 정말 하나부터 열까지 피나를 감싸 주시는군요."
1600405-94 = "매번 이렇게 휘말리면서도…… 이걸 대체 어떻게 감사해야 할지……"
1600405-95 = "선생님께는 저와는 또 다른 임협이 느껴져요. 뭐랄까 굉장히 따듯하고 부드러운……"
1600405-96 = "선생님만의, 피나를 믿고 맡겨드릴 수 있을 만큼 포근한……"
1600405-97 = "그런 인의입니다. ……네. 정말로요."
1600405-98 = "……헤헤."
1600405-100 = "(이후 피나와 함께 그 날 보았던 영화들에 대해 한참이나 더 대화를 나누었다.)"
1600405-101 = "(……그리고 다음부터는 릴레이가 아닌 일반 상영관을 잡아서 보도록 하자고도 약속했다.)"
