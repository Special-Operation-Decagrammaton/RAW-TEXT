[translation]
1600405-1 = "終わらない夜"
1600405-2 = "センセイ！こっちデス、こっち！"
1600405-3 = "エヘへ、来てくれてありがとうございマス！おかげでフィーナはとても気分がいいデス！"
1600405-4 = "……センセイはテンションがそんなに高くないデスね？"
1600405-5 = "もしかして、忙しいのに無理してマセンか？チケットも勝手に買ったので、今になって心配になりマシタ……。"
1600405-6 = "[s1] \"ううん、お休みだったから。すごく楽しみだった。\"\n[s2] \"サボりって楽しいよね。\""
1600405-7 = "そうデスか、良かったデス！心配してしまいマシタ！"
1600405-8 = "エッ……だ、大丈夫デスか！？"
1600405-9 = "大丈夫なら良いのデスが……とにかく！"
1600405-10 = "せっかくセンセイに来てもらったからには、楽しんでもらわないとデス！"
1600405-11 = "映画は人を選ぶと言いマス、ですがご心配なく！今日用意した映画は一つだけじゃありマセン！"
1600405-12 = "今日の映画は21本ありマス！一つぐらいは気に入るものがあるはずデス！"
1600405-13 = "ふふっ、センセイの言いたいことは分かりマス。チケットは2枚なのに、なぜ映画が21本なのか……？"
1600405-14 = "それはこのチケットが、ただのチケットではなく……。"
1600405-15 = ""
1600405-16 = "「リレー上映会」のチケットだからデス！！Hoooo！！"
1600405-17 = "[s] \"リレー上映会？\""
1600405-18 = "これは文字通り、リレーのように映画を連続で上映するものデス。"
1600405-19 = "映画好きなマニアのために、似たようなジャンルの映画をまとめて上映してくれるデス！"
1600405-20 = "モチロン、ワタシたちが見るのは任侠映画リレー！！"
1600405-21 = "さあ、時間がありマセン！まずは一つ目から、here we go！！"
1600405-23 = "（フィーナに手を掴まれて、劇場の中に連れていかれた）"
1600405-24 = "（映画の内容は悪くなかった。任侠映画だったが、派手な暴力シーンは編集でカットされているようだ）"
1600405-25 = "（ちょっと残念ではあったけれど、学生も楽しんで見られるように配慮しているのだろう）"
1600405-27 = "スバラシイ……。"
1600405-28 = "本当にスバラシイ映画デシタね……お頭……いえセンセイ……いえ、お頭……。"
1600405-29 = "スミマセン混乱しました、センセイ……。"
1600405-30 = "いかがデシタか？面白かったデスか？"
1600405-31 = "[s] \"……お頭と呼びな。\""
1600405-32 = "……！！"
1600405-33 = "よ、良いのデスか……！お頭……！"
1600405-34 = "仰せの通りに！お頭！すぐに次の映画に行きマショウ！"
1600405-35 = "次の映画は「仁義なきニャンニャンパンチ」デス！！"
1600405-37 = "（その後の映画も、どれも素晴らしい映画だった）"
1600405-38 = "（任侠映画らしい渋いかっこよさやハードボイルドな雰囲気が、時には叙情的に、時にはドラマチックに描かれていた）"
1600405-39 = "（……）"
1600405-40 = "（けれども……）"
1600405-42 = "ヒュー……ッ！今回も本当に素晴らしかったデスね、センセ……お頭！！"
1600405-43 = "それでは次の映画デス……！"
1600405-45 = "（いくら素晴らしい映画とはいえ、同じジャンルの映画を21作も見るということ）"
1600405-46 = "（そして隣からずっと話しかけられて眠ることもできないまま、途中からは同じような展開を見続けることは……）"
1600405-48 = "フゥー……！これデス、これ……！では次……！"
1600405-50 = "（……それは、普通の人間にとっては……）"
1600405-52 = "Amazing、他に言葉もありマセン……。"
1600405-54 = "（拷問に近い……）"
1600405-56 = "最ッッッッッッ"
1600405-57 = ""
1600405-58 = "高………！"
1600405-59 = ""
1600405-60 = "デス！！！！"
1600405-62 = "（最後の21作目の映画を見ていた頃には、完全に意識が飛んでいたらしい）"
1600405-63 = "（……気が付いた時は、映画館の外の川沿いだった）"
1600405-65 = "……ンセイ？"
1600405-66 = "センセイ……？気が付きマシタか……？"
1600405-67 = "[s3] \"ここはどこ……私は誰……？\"\n[s4] \"無事、戻ってこれたか。私たちの居場所に……。\""
1600405-68 = "ア、アア……！"
1600405-69 = "ア、アア……！"
1600405-70 = "し、しっかりしてクダサイ、センセイ！自分を見失っては駄目デス！ワタシが悪かったデス！"
1600405-71 = "スミマセン……まさかこうなるとは……。"
1600405-72 = "ワタシ、何日も何日も昼夜を問わず、任侠映画を見るのが習慣だったんデス……センセイも大丈夫だと、勝手に考えてマシタ。"
1600405-73 = "フィーナのせいデス……本当にゴメンナサイ……。"
1600405-74 = "これからは、映画に誘ったりしマセンから……。"
1600405-75 = "グスッ……グスン……。"
1600405-76 = "[s5] \"大丈夫、気にしないで。\"\n[s6] \"……ご苦労だった。\""
1600405-77 = "……？"
1600405-78 = "……？"
1600405-79 = "そ、それはどういうことデス……？"
1600405-80 = "そう言われマシても、ワタシ……。"
1600405-81 = "意識を失ったのではなく……ちょっと寝ていただけ？"
1600405-82 = "……イエ、そんなはずは……どう見ても気を失って……。"
1600405-83 = "……「私はお頭だぞ」？"
1600405-84 = "ハ、ハイ！それは承知シテ、あ、イエ！口答えをするつもりは……！そんなわけないデス！まさかお頭にそんなことは！"
1600405-85 = "失礼しマシタ！お頭はお眠りになっただけデスね！ワタシの勘違いデシタ！"
1600405-86 = "ただワタシは……！"
1600405-87 = "……。"
1600405-88 = "……フフッ。"
1600405-89 = "アハハハハハハッ！！"
1600405-90 = "アー、笑いすぎて涙が出そうデス！アハハハハッ！"
1600405-91 = "アー、ハー……ふう、センセイは本当に……。"
1600405-92 = "……。"
1600405-93 = "……ありがとうございマス、センセイ。センセイは、いつもフィーナを守ってくれて、フィーナのために色んなことをしてくれマス。"
1600405-94 = "今日のことも、それ以外も……どうやってお返しすれば良いのか……。"
1600405-95 = "センセイにも、任侠を感じマス。ワタシとはまた別の、暖かくて柔らかいような……。"
1600405-96 = "まるで、フィーナを包み込んでくれるような……。"
1600405-97 = "そういう仁義デス……ハイ、心からそう思いマス。"
1600405-98 = "……エヘへ。"
1600405-100 = "（その後フィーナと一緒に、その日見た映画についてしばらくお喋りをした）"
1600405-101 = "（そして次はリレー上映ではなく、普通の映画館の映画を見に行く約束をした）"
