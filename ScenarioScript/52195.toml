[translation]
52195-9 = "벌써 한나절을 넘게 걸어왔는데……"
52195-10 = "눈과 돌 이외에는 아무것도 안 보이잖아! 정말로 이쪽 방향이 맞아?!"
52195-11 = "……맞아."
52195-12 = "그때보다 조금 더 눈이 더 쌓이긴 했지만, 이 벚나무 그루터기와 사원으로 이어지는 돌담길…… 분명히 기억하고 있어."
52195-13 = "이곳이 바로 황혼의 사원이야."
52195-14 = "이곳이 황혼의 사원이라고?"
52195-15 = "하지만 선배, 이 흔적은 사람의 발길이 닿은 장소라기에는……"
52195-16 = "……수백 년 전부터 이미 사람의 흔적이 끊긴 곳처럼 느껴지는걸."
52195-17 = "하하, 하하하하……!"
52195-18 = "되도 않는 수작을 부리다니, 무슨 생각을 하고 계셨던 걸까요. 나구사 쨩~?"
52195-19 = "쿠즈노하가 있는 곳으로 간다면서, 수백 년 넘게 발길이 끊긴 폐허에 저를 데려오시다니."
52195-20 = "먼 길을 걸어와 당황해하는 제 표정을 보며 즐거워하실 생각이었나요?"
52195-21 = "그도 아니라면, 이런 외진 곳까지 빠져나오면 승산이 있을 거라고 생각하신 건가요?"
52195-22 = "유감~ 이네요!"
52195-23 = "당신이 여기까지 오면서 무슨 계획을 세웠는지는 모르겠지만, 다 무의미한 일이 될 테니까요."
52195-24 = "어차피 이 폐허에서 당신들 모두 잠들게 될 테니까."
52195-25 = "드디어 본색을 드러냈구나, 야부키 슈로……!"
52195-26 = "누가 네 뜻대로 당해줄 줄 알고!"
52195-30 = "아니, 거짓말은 하지 않았어."
52195-35 = "나는 분명히 이곳에서 스스로를 쿠즈노하라 일컫는 소녀를 만났었고, 그녀로부터 선생님께 보내는 편지를 전달받았어."
52195-36 = "전에 이 장소를 빠져나올 때만 하더라도 이 벚나무 그루터기에는 꽃이 흐드러지게 피어 있었고, 돌담길은 깨끗이 닦여 있었지."
52195-37 = "그게 무슨—"
52195-38 = "그녀의 말을 빌리자면, 황혼은 속세의 모든 흐름이 의미를 잃는 장소."
52195-39 = "봄의 벚꽃과 가을의 석산이 공존하고, 과거의 일이 현재에 재현되더라도 이상하게 여길 필요가 없지."
52195-41 = "해가 저물어, 눈앞에 있는 자가 누구인지 알지 못할 정도로 황혼이 내려앉았을 때."
52195-43 = "저물어가는 석양을 마주하고, 어스름 너머로 통성명하네."
52195-45 = "……거기에 있는 자, 누구인가."
52195-51 = "……나는, 백화요란 분쟁조정위원회의 초대 부장. 쿠즈노하."
52195-54 = "어라? 분명 방금 전까지 이 앞에는 아무것도 없었는데……"
52195-55 = "벚나무에…… 꽃이 피었사와요."
52195-63 = "사원의 문간이 소란스럽더니 오랜만에 손님이 찾아왔구나."
52195-64 = "오랜 세월을 넘어 찾아온 불청객이 아니라면 좋으련만…… 나를 찾는 이, 누구인가."
52195-65 = "……백화요란 분쟁조정위원회의 부장 대리, 고료 나구사."
52195-66 = "당신이 부탁한대로 샬레의 선생님을 데리고 돌아왔어."
52195-73 = "후후, 다시 만나게 되어 기쁘구나. 나의 후배야."
52195-75 = "다음화;원래의 모습"
