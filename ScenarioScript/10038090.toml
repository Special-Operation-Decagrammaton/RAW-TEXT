[translation]
10038090-1 = "제9화;모든 번거로운 것들을 위하여"
10038090-16 = "혀, 현룡문?! 그리고 문주님!?"
10038090-17 = "여기까지는 어쩐 일로……?"
10038090-19 = "음. 야쿠시 사야의 석방을 위해 왔다."
10038090-21 = "사, 사야 전 연단방 부장 말씀이십니까?!"
10038090-22 = "그것은, 조금……!"
10038090-24 = "호오. 무슨 문제라도 있는 것이냐?"
10038090-29 = "……."
10038090-30 = "그, 연단방으로부터의, 강력한 요청이 있었습니다. 야쿠시 사야의 신변을, 가능한 한 오래 구속해 두라고……."
10038090-31 = "죄목은…… 그동안 연단방을 제대로 운영하지 못한 죄라고 하였습니다……."
10038090-33 = "그렇다면 너희들은 연단방의 요구가, 문주의 명령보다 위에 자리할 수 있다고 판단하는 것이냐?"
10038090-34 = "훗. 문주님의 명령에 따르지 않으면, 그에 걸맞는 처분이 내려질 수 있다는 것을 상기하길 바란다."
10038090-35 = "음. 미나. 너무 나무라지 말아 주었으면 한다. 집행부장인 그대가 이야기하면 말의 무게가 조금 달라지니 말이다."
10038090-39 = "시, 실례했습니다. 문주님!"
10038090-45 = "……헤아림을 베풀어 주셨으면 합니다. 문주님."
10038090-47 = "듣겠다. 사정을 이야기하도록 해라."
10038090-49 = "그…… 산해경에 돌고 있는, 병에 대한 것입니다."
10038090-50 = "어린이 병이라고도 부르는 그 증상 말이지요……."
10038090-52 = "어린이 병을 유행시킨 것은…… 문주님께서도 익히 짐작하실 수 있을, 그 사람입니다……."
10038090-57 = "저희 역시 연단방이 문주님의 명보다 위에 있을 수 없음을 알고 있습니다만……."
10038090-58 = "연단방으로부터의 말을 따르지 않으면, 어린이 병에 대한 치료약과 예방약을 얻을 수 없게 되어서요……."
10038090-60 = "……."
10038090-61 = "알겠다. 그렇다면 이제부터, 현룡문의 이름으로 야쿠시 사야의 석방을 집행하겠다."
10038090-66 = "네? 그 말씀은……?!"
10038090-67 = "이후 일어나는 사태에 대한 모든 부담을……!"
10038090-69 = "그러하다. 모든 부담을 현룡문에게, 나아가 그 문주인 류우게 키사키에게 돌리도록 하라."
10038090-73 = "문주라는 자리가 본디, 이런저런 귀찮은 것들을 짊어지기 위해 존재하는 것이 아니더냐."
