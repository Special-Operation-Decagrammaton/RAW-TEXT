[translation]
1601102-1 = "계속 성장했어"
1601102-7 = "(하스미의 안내대로 트리니티의 어느 빈 교실을 찾아갔다.)"
1601102-8 = "(늦은 시간대인지라 다른 학생들의 모습은 전혀 보이지 않았다.)"
1601102-12 = "아, 오셨군요. 선생님. 이쪽입니다."
1601102-13 = "잠시만요. 우선 이 체육복을 좀……. 마저 입고……."
1601102-18 = "[ns1] \"……하스미?\"\n[ns2] \"응? 무슨 소리야, 이건……?\""
1601102-21 = "그…… 금방 끝내겠습니다. 이제 거의 다 된 것 같으니……!"
1601102-31 = "[ns3] \"하, 하스미……!?\"\n[ns4] \"무…… 무슨……!?\""
1601102-35 = "다소 오랜만에 입는 옷이지만…… 어떻게든 노력하면……!"
1601102-41 = "[wa:500]― 으음……. [wa:1400]윽……. [wa:2550]읏……. [wa:2050]흐읏……!"
1601102-44 = "[wa:1850]― 예상은 했지만,"
1601102-46 = "― 역시 [wa:250]무리인 것 같군요."
1601102-49 = "― 선생님, [wa:1200]죄송합니다……."
1601102-52 = "― 보시다시피"
1601102-54 = "― 이런 상황이 [wa:520]되어 버려서……."
1601102-57 = "[wa:1450]― 그러잖아도 [wa:650]바쁘실 텐데,"
1601102-60 = "― 공연히 곤란하게[wa:750] 만들어드린 것 같아"
1601102-62 = "― 죄송합니다."
1601102-65 = "[wa:1350]― 작년만 해도 [wa:350]곧잘 입던 옷이었는데"
1601102-67 = "[wa:500]― 어째서, [wa:1250]1년 사이에 이런……."
1601102-70 = "[ns5] \"작년만 해도……라고?\"\n[ns6] \"1년 사이 대체 무슨 일이…….\""
1601102-71 = "[wa:950]― 아, [wa:750]아뇨. [wa:1150]그렇게 큰 차이는……."
1601102-72 = "[wa:950]― 아, [wa:750]아뇨. [wa:1150]그렇게 큰 차이는……."
1601102-75 = "― 그게…… [wa:1700]그렇게"
1601102-77 = "― 체중은[wa:400] 변하지 않았을……[wa:2100]텐데"
1601102-80 = "― ……아, [wa:1300]아마도……."
1601102-84 = "이상하네요……. 해가 지났으니 성장했다곤 하지만, 이 정도일 줄은……."
1601102-85 = "그 사이 옷이 좀 줄어든 걸까요? 으음……."
1601102-89 = "[ns7] \"그……건 아닐 거라고 생각해. 아마도.\"\n[ns8] \"성장……. 성장이란 뭘까…….\""
1601102-92 = "뭐, 뭔가 어쩌다 보니 제가 변명을 하는 것 같은 분위기가 돼버렸는데……."
1601102-93 = "아무튼 중요한 건 이게 아니니, 부탁드렸던 검토 작업부터 바로 시작하도록 하겠습니다."
1601102-94 = "의도치 않게……. 이런 단정하지 못한 모습으로 진행하게 된 점……. 죄송합니다."
1601102-95 = "[s9] \"그 상태로 괜찮은 거구나. 하스미가 좋다면야……\"\n[s10] \"어……. 나, 난 괜찮아. 신경 쓰지 마."
1601102-98 = "후후후……."
1601102-105 = "그래서 이게 그 실행위원회 업무 안내서입니다만."
1601102-109 = "……선생님?"
1601102-113 = "[ns11] \"으, 으응……. 보고 있어…….\"\n[ns12] (눈 둘 곳이 없다…….)"
1601102-116 = "……죄송합니다. 역시 이 복장 때문에……."
1601102-117 = "모범을 보여야 할 정의실현부 부부장이나 돼서 옷도 혼자 제대로 못 입는 모습이라니……. 면목 없습니다."
1601102-118 = "역시 새로 맞춰야 할까요? 인제 와서 새로 맞추기엔 좀 늦은 감도 있긴 합니다만……."
1601102-119 = "[s13] \"확실히 시간이 좀 촉박하긴 하겠네.\"\n[s14] \"활동에 불편함만 없다면야, 그럴 필요까지는……?\""
1601102-122 = "으음, 역시 그렇겠지요……."
1601102-123 = "……아, 또 시간을 끌고 말았군요."
1601102-124 = "다시 서류 검토에 집중하도록 하지요."
1601102-128 = "여기서부터입니다만……."
1601102-132 = "[ns] (……집중 안 돼…….)"
1601102-134 = "(이후 하스미와 함께 황륜대제 실행위원회의 안내 서류를 검토하였다. 검토가 끝난 후에는 하스미를 방까지 데려다주었다.)"
1601102-135 = "(헤어지는 순간까지도 저지의 지퍼 상태는 쭉 그대로였다.)"
