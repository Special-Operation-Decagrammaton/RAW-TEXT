[translation]
10011045-2 = "네! 그 실력! 확실하게 증명해 보이셨군요! 인정하겠습니다!"
10011045-3 = "어?! 진짜?! 이걸로 끝?! 생각보다 엄청 깔끔하게 인정하는 거 아냐?!"
10011045-4 = "무슨 소리야? 이건 원래부터가 '그런 공연' 인걸?"
10011045-5 = "아, 그, 그, 그렇지!"
10011045-9 = "근데 아까 전, 가슴이 뜨거워지는 그 배틀!"
10011045-10 = "피나! 감동했습니다! 이게 말로만 듣던 닌-자로군요!"
10011045-11 = "으음, 그러게……"
10011045-12 = "백야앵제 때는 미처 눈치채지 못했지만, 이 정도의 눈요깃거리라면…… 돈이 될지도……"
10011045-13 = "[s] \"과연 어떤 소재라도 놓치지 않는 백야당의 오너…….\""
10011045-17 = "뭐, 나, 나쁜 건 아니잖아요!"
10011045-18 = "그리고 인법연구부라고 했지?"
10011045-19 = "닌자 동아리라니, 솔직히 처음엔 무슨 소리인가 했지만."
10011045-20 = "다시 봤어. 의외로 이번 공연에서 다크호스가 될 수 있는 거 아니야?"
10011045-21 = "아, 으, 응."
10011045-22 = "뭐어, 여러 가지로 선생님에겐 자안-뜩 불만을 터트리고 싶은 참이지만."
10011045-23 = "합격입니다! 여러분을 다음 코스로 안내할게요!"
10011045-24 = "조, 좋아!"
10011045-28 = "그럼…… 다시 바로 추격이야!"
