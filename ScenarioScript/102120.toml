[translation]
102120-1 = "제12화;제3 성소 공략 - 버려진 유원지"
102120-9 = "우리도 시작한다. 준비해."
102120-14 = "네! 모두들 보스 앞에서 만나는 겁니다!"
102120-18 = "으, 으응. 조심해, 아리스 쨩……."
102120-19 = "그런데 저 둘이서만 정말 괜찮을까……?"
102120-20 = "……네. 문제없을 겁니다."
102120-22 = "그, 그럼……"
102120-23 = "아, 아방가르드군…… 출동!"
102120-31 = "저건 뭐야?!"
102120-32 = "나왔습니다! 저번에 동료가 된 아방가르드군입니다!!"
102120-38 = "오오-! 드디어 여기서 아방가르드군 Ver.3의 등장인가요?"
102120-39 = "참고로 Ver.1은 리오 회장의 오리지널, Ver.2가 저번에 베리타스가 개조한 것이고, 이건 무려 유즈 전용기체인 Ver.3입니다!"
102120-40 = "아방가르드군 Ver.3의 특징이라면! 프레임 단위로 입력이 가능한 유즈의 동체 시력에 맞게 특수 제작된 컨트롤러로 조종할 수 있다는 것이에요!"
102120-41 = "그렇습니다! UZQueen 전용기체인 것입니다!"
102120-42 = "음……."
102120-43 = "으으…… 부담이……."
102120-52 = "코토리! 설명은 그만하고 이쪽에 데이터 결과 좀 해석해 줘!"
102120-56 = "앗, 또 다른 누군가가 저의 설명을 필요로 하는군요! 그럼 저는 이만! 무운을 빕니다, UZQueen!"
102120-61 = "……그럼 시작하지."
102120-62 = "네, 네……!"
102120-67 = "제3 성소 공략……."
102120-76 = "시작하겠습니다……!!"
