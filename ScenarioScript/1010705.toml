[translation]
1010705-1 = "서기의 취미생활"
1010705-2 = "(언제나와 다름없이 업무 중이던 그때…….)"
1010705-8 = "안녕하세요, 선생님~! 잘 지내셨나요!"
1010705-9 = "앗, 업무 중에 제가 방해한 건 아니죠……?"
1010705-10 = "[s] \"괜찮아. 마침 쉬려고 했었어.\""
1010705-11 = "그거 다행이네요! 저도 이번 주는 쉬어가기로 했거든요!"
1010705-12 = "네? 무슨 일 있느냐고요?"
1010705-13 = "아뇨~ 정기 휴간일 뿐이랍니다!"
1010705-14 = "[s] \"정기 휴간?\""
1010705-15 = "하핫! 네, 그렇습니다~!"
1010705-16 = "<주간 만마전>은 주간지라서, 평소에는 여유가 별로 없거든요! 그래서 일부러라도 한 주 휴간하지 않으면 쉴 수가 없어요!"
1010705-17 = "롱 런을 위해서는 릴렉스가 필수! 라는 느낌이죠~."
1010705-18 = "<주간 만마전> 편집이 즐거운 만큼, 꾸준히 이어 나갈 수 있도록 하는 것도 중요하지 않겠어요?"
1010705-19 = "그래서 두 달에 한 주씩은 무조건 쉬고 있답니다~!"
1010705-20 = "뭐어, 쉰다고 해도 이런저런 다른 업무 때문에 여유 시간은 오늘 하루 정도지만요!"
1010705-24 = "어, 어라, 그렇게 부럽다는 눈으로 바라보셔도……."
1010705-25 = "네? 요새 일이 너무 많아서 휴일에도 쉬지 못하셨다고요?"
1010705-26 = "으음, 그런가요…… 그렇다면……."
1010705-27 = "오늘은, 선생님도 함께 쉬는 걸로 하죠!"
1010705-28 = "[s] \"그, 그치만 업무가……!\""
1010705-29 = "말씀드렸듯이, 롱 런을 위해서는 릴렉스가 필수!"
1010705-30 = "찔끔찔끔찔끔 쉬는 것보다 하루 푹 쉬고 내일부터 힘껏 달리는 게 낫다고 보는데요오~?"
1010705-31 = "[s] \"확실히…… 일리 있을지도……?\""
1010705-32 = "그쵸? 그쵸?"
1010705-33 = "잘 생각하셨습니다아~!"
1010705-34 = "자, 그럼 책상에서 일어나서 우선 기지개를 켜고~"
1010705-35 = "다음은 여유롭게 낮잠을 자거나, 책이나 게임을 즐겨 보세요!"
1010705-36 = "혹은, 평소에 하지 못했던 운동이나 취미 활동을 즐기는 것도 좋겠네요~!"
1010705-37 = "……네? 휴일이 너무 오랜만이라 뭘 해야 할지 모르겠다고요?"
1010705-38 = "[s] \"치아키는 평소 쉬는 날에 뭘 해?\""
1010705-39 = "저 말씀이신가요?"
1010705-40 = "으음…… 그냥 평범하게 취미생활 정도인데요?"
1010705-41 = "[s1] \"그럼, 오늘은 치아키한테 맡길게.\"\n[s2] \"치아키의 취미생활을 알려 줘.\""
1010705-44 = "아, 그러면 되겠네요!"
1010705-45 = "선생님과 함께라니, 이번 주는 완전 재밌겠는데요!"
1010705-46 = "어쩌면 다음 주 <주간 만마전>기삿거리가 될지도!"
1010705-47 = "자, 그럼 출발할까요!"
1010705-48 = "[s] \"어디로 가는 거야?\""
1010705-49 = "물론 취미생활을 즐기러 가는 거죠!"
1010705-50 = "그게 무엇이냐고 물으신다면~."
1010705-51 = "가면 알게 되실 거예요!"
1010705-54 = "역사연구부 동아리실"
1010705-57 = "얏호~ 역사연구부 여러분, 잘 지내셨나요~!"
1010705-58 = "앗! 치아키 쨩이잖아!"
1010705-59 = "오랜만이야! 그동안 잘 지냈어?"
1010705-60 = "네, 그렇답니다~ 오랜만에 얼굴 보니 좋은데요!"
1010705-62 = "[ns] (치아키의 취미가…… 역사 연구?)"
1010705-63 = "부활동은 잘 되고 계신가요~?"
1010705-64 = "그럭저럭이랄까? 아, 맞아! 얼마 전에 치아키 쨩이 구해다 준 고서 있잖아?"
1010705-65 = "그거, 완전 가짜던데?"
1010705-66 = "으앗~! 그랬나요! 헌책방에서 보물을 발견했다 싶었는데!"
1010705-67 = "하하핫! 뭐, 그러다가 진짜를 발견하는 거겠지!"
1010705-68 = "자, 자, 그러지 말고 안으로 들어와서 앉아! 차라도 좀 내 줄게!"
1010705-69 = "아핫! 감사합니다~ 선생님 몫도 부탁드려도 될까요?"
1010705-70 = "물론이지~ 자, 선생님도 이쪽으로!"
1010705-77 = "[ns] \"치아키는 만마전 소속이면서 역사연구부 소속이기도 한 거야?\""
1010705-78 = "으음, 정확히는 객원 멤버랄까요?"
1010705-79 = "항상 함께하지는 못하지만, 그래도 올 때마다 즐겁단 말이지."
1010705-80 = "그렇답니다! 일단 전 만마전 소속이니까요~"
1010705-81 = "아쉬운 대로 발을 담그는 정도랄까요?"
1010705-82 = "[s] \"그렇구나. 역사가 취미인 줄은-\""
1010705-83 = "앗, 벌써 시간이 이렇게!"
1010705-84 = "그럼 이만 가볼게요! 오늘은 즐거웠어요~!"
1010705-85 = "응응! 다음에 또 놀러 와!"
1010705-86 = "물론이지요~!"
1010705-89 = "[ns3] \"더 여유롭게 취미를 즐겨도 괜찮지 않아?\"\n[ns4] \"모처럼의 휴일인데 말야.\""
1010705-92 = "으음, 그러고 싶은 마음은 있지만요……."
1010705-93 = "후후, 하지만 제 취미는 역사가 아니니까!"
1010705-94 = "[s] \"아니라고……?\""
1010705-95 = "자아, 부지런히 가볼까요~!"
1010705-98 = "캐치볼 동호회 연습 현장"
1010705-99 = "앗! 치아키 쨩이다!"
1010705-103 = "안녕하세요~ 오늘도 완전 열심히 시네요!"
1010705-104 = "오랜만이야! 그동안 치아키 쨩이 없어서 심심했었다구!"
1010705-105 = "오늘은 조금이라도 플레이할 수 있지?"
1010705-106 = "물론입니다~!"
1010705-107 = "[s] \"치아키, 사실은 운동이 취미?\""
1010705-108 = "아하핫, 뭐어, 여기도 객원 멤버랍니다! 정식 회원 정도로 실력이 있지도 않으니까~"
1010705-109 = "공은 잘 못 던져도, 치아키가 있으면 동호회 분위기가 살아난다니까!"
1010705-110 = "자주자주 와 줬으면 좋겠는데 말야!"
1010705-111 = "아핫! 노력해보겠습니당~!"
1010705-112 = "자아, 그럼! 플레이볼!"
1010705-115 = "보드게임연구부 부실"
1010705-116 = "끄응…… 여기서는 이 카드가……."
1010705-117 = "흐흐흐, 역시 치아키 쨩, 실력은 별로지만 리액션이 일품이란 말이지."
1010705-118 = "너무해요~ 일생일대의 고민 중인데!"
1010705-121 = "맛집 탐방 동호회 정기 모임"
1010705-127 = "화력연구부 실험장"
1010705-135 = "이야~ 이걸로 한 바퀴 돌았네요!"
1010705-136 = "역시, 휴일은 이렇게 보내야 제대로 보낸 것 같다니까요!"
1010705-137 = "앗, 안색을 보니 조금 지치신 것 같은데…… 너무 제 페이스로 돌아다녀 버렸나요?"
1010705-138 = "[s] \"아냐, 괜찮아. 그보다…….\""
1010705-140 = "[ns] \"결국 치아키의 취미활동은 뭐였던 거야……?\""
1010705-141 = "그치만 하루 종일 보여드렸는걸요?"
1010705-142 = "……네? 너무 다양한 동아리에서 다양한 활동을 하는 바람에, 그중에 어떤 게 제 진짜 취미인지 알 수 없게 되어버렸다…… 고요?"
1010705-146 = "아핫! 그렇게 생각하실 수도 있겠네요~!"
1010705-147 = "그야, 제 취미는 친구들과 만나는 것 자체니까요!"
1010705-148 = "다양한 곳에서 다양하게 활동하는 친구들과 만나서 수다도 떨고, 운동도 하고, 게임도 하고~!"
1010705-149 = "그걸 위해 다양한 동아리의 객원 멤버로 참여하는 거니까요~"
1010705-150 = "[s5] \"그러고 보니 치아키…….\"\n[s6] \"어떤 활동이든 본격적인 느낌은 아니었지…….\""
1010705-153 = "으앗! 너무해요~ 사실이긴 하지만요."
1010705-154 = "그럼, 이제 선생님의 소감을 듣고 싶은데요~? 오늘은 선생님의 휴일이기도 했으니까!"
1010705-155 = "어떠셨나요, 선생님? 제 휴일을 함께한 소감은!"
1010705-156 = "[s] \"응, 무척 신선했어.\""
1010705-157 = "다행이네요~! 여러 친구들을 만나는 거, 역시 즐겁죠?"
1010705-158 = "자, 그럼 여기서 헤어져야겠네요!"
1010705-159 = "저는 이제 만마전 사무실로 돌아가서, 다음 주 <주간 만마전> 편집을 시작하려고요!"
1010705-160 = "[s7] \"지, 지금부터 일하러 간다고?\"\n[s8] \"쉬지는 않는 거야?\""
1010705-163 = "휴식이요? 지금까지 휴식했는걸요?"
1010705-164 = "친구들이랑 만나서 수다도 떨고, 운동도 하고! 이게 휴식이 아니면 뭐겠어요~!"
1010705-165 = "[s] \"대, 대단한걸…….\""
1010705-166 = "네? 평범하다고 생각하는데요?"
1010705-167 = "그럼! 오늘은 여기서 인사드리겠습니다~!"
