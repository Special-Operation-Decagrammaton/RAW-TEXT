[translation]
22140-1 = "제14화;요새도시 에리두"
22140-2 = "소란을 피웠다고는 해도 생각보다 빨리 나타났네요."
22140-3 = "우리가 이곳으로 올 걸 처음부터 알고 있었던 건가?"
22140-5 = "예, 리오 님께선 이미 전부 알고 계십니다."
22140-6 = "C&C의 움직임도, 판단도."
22140-7 = "그리고 물론 선생님이 노리는 바도 전부."
22140-8 = "그러므로 말씀드리겠습니다. 이 이상의 저항은 무의미합니다. 얌전히 투항 바랍니다."
22140-9 = "호오…… 과연."
22140-10 = "으음~ 그건 말이야~ 곤란하다고 할까~"
22140-20 = "……?!"
22140-21 = "와, 깜짝 놀랐어."
22140-22 = "어머, 이 정도는 가볍게 피하시는군요?"
22140-23 = "아, 아카네……?"
22140-24 = "……무로카사 아카네 선배."
22140-25 = "데이터에 따르면…… 전투에 돌입하면 폭발물을 이용한 광역제압을 우선시하는……"
22140-26 = "C&C의 요주인물."
22140-27 = "후후, 초면인 후배에게 듣기엔 조금 낯부끄러운 평가네요."
22140-28 = "어디까지나 가벼운 인사였답니다?"
22140-29 = "……."
22140-30 = "처음 뵈어요. 후배님. 이름이 토키……라고 했던가요?"
22140-31 = "지난번에는 부장님이 신세를 졌다고 들었어요."
22140-32 = "거기에 더해…… 이번엔 얌전히 투항하라는 정중한 권고까지."
22140-33 = "후후, 당신이 리오 회장의 보디가드라는 건 알고 있지만…… 그거참."
22140-35 = "……C&C를 뭐라고 생각하고 있는 건가요?"
22140-36 = "……!"
22140-40 = "받은 게 있으면 돌려준다. 오늘은 그러기 위해 찾아온 거니까요."
22140-45 = "……물론 여기서 얌전히 투항하겠다면 받아줄 수 있지만요?"
22140-47 = "……그럴 수 없습니다."
22140-48 = "저는 리오 님으로부터 명령을 받았습니다."
22140-49 = "<지시를 위반하고 독단적으로 움직이는 C&C를 제압하라.> 라고……"
22140-50 = "고로 이 자리에서 비켜드릴 수 없습니다."
22140-52 = "흐응~ 성실하네~ 토키 쨩."
22140-53 = "예상했던 반응이다."
22140-54 = "C&C는 명색이 비밀 에이전트라고 불리는 조직……."
22140-55 = "처음엔 당연히 잠입을 통한 작전행동으로 이쪽을 교란할 것을 염두하고 대비하고 있었습니다만."
22140-56 = "설마 이렇게 정면으로 당당히 나타나실 줄이야."
22140-57 = "……허를 찔렸습니다. 이조차도 이쪽의 대처를 예상하고 꾸민 작전이겠지요."
22140-59 = "……그랬나?"
22140-60 = "아하하~ 아닌데. 그런 거~"
22140-62 = "어머나, 그러게요. 그건 생각지도 못했네요."
22140-63 = "그런 식으로 얼버무리셔도 소용없습니다."
22140-64 = "오히려 이렇게 행동하셨기에 이미 선배님들의 속셈이라면 간파했습니다."
22140-65 = "필시 선배 세 분께서 저를 여기 묶어 두는 동안, 네루 선배와 선생님이 목표를 탈취하기 위해 움직인다."
22140-66 = "그러한 플랜이겠지요."
22140-67 = "확실히…… 리오 님의 <무장>을 지닌 저와의 정면 승부를 피하고,"
22140-68 = "제 발이 묶여 있는 사이 밀레니엄의 최강 전력이라 할 수 있는 네루 선배가 움직인다면."
22140-69 = "거기에 충분히 승산이 있다고 판단하는 것도……"
22140-70 = "아닌데?"
22140-78 = "아하핫! 늦었잖아~! 부장!"
22140-79 = "네루…… 선배가 여기에……? 어째서……?"
22140-80 = "어째서냐니, 얌마."
22140-81 = "리벤지 매치를 위해서인 게 당연하잖아?"
22140-82 = "리벤지……?"
22140-83 = "내가 그리로 향했다면, 넌 어차피 여긴 신경도 안 쓰고 그쪽으로 날 막으러 왔을 거 아냐?"
22140-84 = "귀찮은 건 질색이야."
22140-85 = "꼬맹이를 구하러 가는 건……"
22140-86 = "네 녀석을 쓰러트리고 난 '다음'이라도 늦지 않아."
22140-87 = "어이, 후배. 지난번에는 잘도 이쪽의 팔을 비틀어줬겠다."
22140-88 = "선배가 열받으면 어떻게 되는지 보여주마."
22140-95 = "……!!"
22140-96 = "대응, 시작하겠습니다."
22140-102 = "하! 좋아! 어디, 해보자고!"
22140-106 = "이것으로……!"
22140-107 = "통로를 메운 드론은 전부, 쓰러트렸어……!"
22140-108 = "[ns] \"자, 다들! 마음 단단히 먹어! 드디어 지상이야……!\""
22140-114 = "아자아아앗! 밖으로 나왔어!"
22140-115 = "여기서 이제 어디로 가면 되는 거야?!"
22140-117 = "아리스가 있을 곳으로 생각되는 곳은 에리두의 중심부……."
22140-118 = "바로 이곳, 중앙에 있는 타워야."
22140-119 = "현재 위치상으로 판단해보자면, 왼쪽으로 뻗어 있는 대로를 통해 쭉 북쪽으로 나아가면 도착할 수 있습니다!"
22140-120 = "[ns] \"응, 오케이! 서포트 고마워! 그럼……!\""
22140-131 = "비켜! 비켜! 비켜!!"
22140-139 = "길이라면 이쪽에서 가이드할 테니까."
22140-140 = "자! 모두! 전력으로 전속전진!"
22140-142 = "다음화;함정"
