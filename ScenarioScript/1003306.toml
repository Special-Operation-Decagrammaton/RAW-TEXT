[translation]
1003306-1 = "절대로 변치 않는 믿음"
1003306-2 = "(와카모와 약속을 하고 난 뒤 어떻게든 일을 일찍 끝내고 찾아가려고 했지만.)"
1003306-3 = "(계속해서 밀려든 업무를 간신히 마칠 수 있었던 건, 약속 시각으로부터 6시간이나 지난 뒤였다.)"
1003306-7 = "(약속 시각보다 6시간이나 늦어버렸다.)"
1003306-8 = "(너무 늦은 나머지. 혹시 그사이 와카모가 무슨 일을 저지르진 않았을까. 걱정을 끌어안은 채 단숨에 약속 장소까지 내달렸다.)"
1003306-14 = "[ns] (앗! 와카모……!)"
1003306-16 = "……초면인 제 앞에서 그렇게 벌러덩 드러누워 무방비하게 배를 내밀다니."
1003306-17 = "낯선 이에게 경계심을 품지 않았을 때, 어떤 말로를 걷게 될지. 직접 그 몸에 가르쳐 드리지요."
1003306-18 = "[s] \"아니, 저, 저기?! 와카모 씨?!\""
1003306-26 = "에잇! 에잇! 어떠신가요? 여기? 여기인가요? 여기를 긁어주는 쪽이 더 좋다 이건가요?"
1003306-30 = "후훗. 하지만 안타깝군요."
1003306-31 = "제가 다음에 긁어 드릴 곳은 그곳이 아니라. 목 뒤쪽이랍니다."
1003306-32 = "어디 제 공격 앞에, 천박하게 고롱고롱 소리를 내며 울부짖어보도록 하시지요!"
1003306-33 = "[s] \"와카모 씨……? 지금 무엇을 하시는 건지……?\""
1003306-34 = "……엣."
1003306-38 = "서……, 선생님……?!"
1003306-39 = "아, 그건 그러니까……! 고, 고양이 씨와 잠깐 가벼운 장난을 치고 있었달까……!"
1003306-40 = "저 와카모, 결코 수상하거나 이상한 짓은……!"
1003306-41 = "[s] \"그렇구나……. 그보다 조금은 의외네.\""
1003306-42 = "네? 의외?"
1003306-43 = "아……. 제가 그렇게나 동물을 귀여워할 줄은 몰랐다……?"
1003306-44 = "글쎄요. 후후훗. 오히려 저는 이런 동물이라면 얼마든지 귀여워할 수 있답니다?"
1003306-45 = "……사람과는 다르게 그 입으로 말을 꺼낼 일도 없고, 네에- 그렇기에 비로소 혀로 타인을 벨 일도 없는……."
1003306-46 = "얼마든지 귀여워하더라도 우쭐해 하지도 않고, 감히 배신을 하지도, 할 생각조차 못 하면서-"
1003306-47 = "그저 할 줄 아는 거라곤 순수하게 자기가 받은 신뢰에 있는 그대로 답하는 것밖에 못 하는 가련한 것이 어찌 이리도 안타까운지."
1003306-48 = "이런 안타깝기 그지없는 아이들을."
1003306-49 = "네에, 귀여워하지 않을 도리가 없지요. 후후훗."
1003306-50 = "[s1] \"그, 그렇구나…….\"\n[s2] \"그, 그런 점에서……, 미안! 약속까지 했는데! 너무 늦어버려서!\""
1003306-51 = "네……?"
1003306-52 = "네……?"
1003306-53 = "선생님께선 갑자기 무슨 이야기를 하시는지……. 저 와카모, 잘 이해가……."
1003306-54 = "[s3] \"일을 끝내고 바로 온다고 했는데. 이렇게나 늦어버렸잖아.\"\n[s4] \"이래서야 와카모를 배신한 거나 다름없으니까.\""
1003306-55 = "선생님이, 저를 배신……?"
1003306-56 = "선생님이, 저를 배신……?"
1003306-57 = "아, 설마 방금 제가 한 말 때문에……? 그런 오해를……?"
1003306-58 = "아, 아니요! 그런 말씀 마셔요! 그거라면 단언컨대 망설이지 않고 말할 수 있답니다!"
1003306-59 = "저 와카모, 이제껏 단 한 번도 당신께서 저를 배신한다는 생각 따위……. 입 밖에 내어본 적도, 생각의 편린조차도 떠올려본 적도 없답니다!"
1003306-67 = "[ns] \"와, 와카모……?!\""
1003306-70 = "아아……. 절, 절 그렇게 오해하셨단 말인가요? 너무, 너무 슬픕니다."
1003306-71 = "슬픔에 가슴이 옥죄어, 미어질 정도로- 저 와카모는 결단코 당신께서 절 내치실 거라는 불경한 생각 따윈 해본 적도 없는데. 어찌하여……."
1003306-72 = "원래 약속했던 시간보다 겨우 6시간 정도 늦었다는 게……. 그게, 뭐, 어찌 되었단 말인가요?"
1003306-73 = "당신과 약속을 잡은 날이면, 이미 저는 만나기 전부터 당신을 만날 생각만으로도 가슴이 이렇게 뜨거워지는데……!"
1003306-74 = "[s] \"자, 잠깐. 와카모. 이것 좀 놓고…….\""
1003306-75 = "아아……. 좀 더 가까이, 제 뺨을 쓰다듬어 주시겠나요? 아니면, 제가 당신의 뺨을 쓰다듬어도 될까요?"
1003306-76 = "후후후……♡ 네에, 바로 이런 시간이 기다리고 있다는 걸 아는 이상, 그 사이의 기다림 따위. 결코 괴롭지도 안타깝지도 않답니다."
1003306-77 = "그런 제가 당신께 배신감을 느꼈으리라는 오해를 하신다니, 안 돼요. 그건 곤란합니다."
1003306-78 = "절대로 그런 가슴 아픈 일 따윈 절대로 없으리라고, 제 가슴 속에 담긴 진심을 당신께 어찌 전해야 좋을지……."
1003306-79 = "[s] \"알았으니까. 응. 진정해.\""
1003306-80 = "아아……. 알아주시는, 건가요? 정말, 이시지요?"
1003306-81 = "네, 그러시다면 다행입니다♡"
1003306-82 = "[s5] \"흠흠, 그래도 무작정 기다리기만 하면 어떡해.\"\n[s6] \"만약에 정말로 약속이 파투 났으면 어쩌려고 그래.\""
1003306-83 = "……네? 약속이 파투 난다?"
1003306-84 = "……네? 약속이 파투 난다?"
1003306-85 = "어째서 그런 걱정을 하시나요? 당신이 저와 약속하셨다면, 그럴 일은 절대로 일어나지 않는걸요?"
1003306-86 = "설사 이곳에서 당신을 기다리며 6시간이 아니라……."
1003306-87 = "다른 치들과 달리 배신하지도, 거짓말을 하지도 않고, 오롯이 제 믿음에 보답해주며 어떤 상황이라도 손을 잡아주는 당신이라면……"
1003306-88 = "6일, 6주, 여섯 달이 지나더라도 오늘, 지금처럼 당신은 반드시 저를 만나러 와줄 터인데."
1003306-89 = "저 와카모가 어찌하여 그런 걱정을 하겠나요? 우후훗. 이상하신 분."
1003306-90 = "[s] \"…….\""
1003306-91 = "네, 그렇게 정해져 있는 거랍니다."
1003306-92 = "아아. 그렇다고는 해도, 저 와카모. 조금은 슬퍼졌답니다."
1003306-93 = "제가 감히 당신께 그런 생각을 품었을 것이라 오해하시다니, 으음. 그럴 일은 결코 없을 것이라고 저 와카모가 어떻게 해야 증명할 수 있을는지."
1003306-94 = "[s] \"아니, 굳이 증명까지 필요하지는…….\""
1003306-95 = "아……!"
1003306-96 = "후후……. 좋은 생각이 났답니다."
1003306-97 = "오늘 밤 단둘이, 휘영청 떠오른 달 아래에서 몇 번이고, 몇백, 몇천 번이고. 저 와카모의 마음 변치 않노라고……."
1003306-98 = "밤을 지새워가며 속삭여 드리는 건 어떠할까요?"
1003306-99 = "저, 상상한 것만으로도 이 깊은 곳, 넘쳐흐르는 기쁨으로 아아. 어찌해야 좋을지……."
1003306-100 = "[s] \"그, 그건 참아주라! 대신 다른 부탁이라면 들어줄 테니까!\""
1003306-101 = "그걸 대신하여 다른 부탁을……?"
1003306-102 = "어머나아♡ 그럼, 그건 어떠한 것이라도 괜찮다는 말씀이실까요?"
1003306-103 = "또 기쁘기 그지없는 말씀을 하시다니……. 으음, 하지만 그렇군요."
1003306-104 = "먹음직스러워 보인다고 하여 무작정 달려들어, 또다시 선생님을 기겁하게 만들어서야, 당신을 따르는 몸으로써 언어도단."
1003306-110 = "당신께서 주신 그 귀중한 기회, 후일을 도모하며 조금은 아껴두도록 하지요."
1003306-111 = "[s] \"그때는 살살 부탁드립니다…….\""
1003306-112 = "우후후훗, 슬며시 겁먹은 체하는 요란마저 너무나도 귀여우신 분."
1003306-113 = "네에, 그럼 그것은 또 그때의 즐거움으로 남겨두도록 하지요. 후훗♡"
1003306-115 = "(그 뒤로 많이 늦게 되었지만, 무사히 와카모의 쇼핑에 어울려줄 수 있었다.)"
