[translation]
51130-1 = "제13화;키류 키쿄, 그리고 계승전 2"
51130-8 = "하아…… 하아……."
51130-9 = "[s] \"유카리! 괜찮아?!\""
51130-10 = "소, 소녀는…… 괜찮, 사와요……"
51130-11 = "너, 너무한 거 아닌가요?!"
51130-12 = "이 정도로 할 필요가……."
51130-17 = "이것이 백화요란의 계승전이니까."
51130-18 = "이제 알았지? 이게 현실이야."
51130-19 = "설사 내가 보증인으로서 <계승전>을 시작한다 해도 넌 나구사 선배를 이길 수 없어."
51130-20 = "머릿속이 꽃밭이기만 한 네 의견은, 처음부터 현실성이고 뭐고 아무것도 없었다는 거야."
51130-22 = "저어, 는……."
51130-23 = "……저는, 그저…… 그때로……"
51130-24 = "다 함께 백화요란으로서 활동했던 그때로 돌아가고 싶어서……"
51130-26 = "돌아간다고?"
51130-27 = "웃기지 마."
51130-28 = "넌 나구사 선배를 쓰러트려서 부장이 되겠다. 따위의 말을 하고 있지만."
51130-29 = "봐봐. 넌 나조차도 이기지 못해. 해낼 수 없는 걸 가지고 떠들 뿐이야."
51130-30 = "그 어설픈 마음가짐은 대체 뭐야? 그저 어린아이가 떼를 쓰는 것만 같은 그 말은 대체 무어냐고?"
51130-31 = "정말로 나구사 선배를 쓰러트리고, 과거로 되돌아가고 싶은 게 맞아?"
51130-36 = "아니, 그럴 리가 없지. 당연해."
51130-37 = "애당초 네가 이곳 백화요란에 들어온 건 카데노코지 가문의 아가씨가 즐기는 놀이 같은 거였잖아?"
51130-41 = "[ns1] \"키쿄. 그렇지 않아.\"\n[ns2] \"유카리는 정말로 노력했어. 어제만 해도…….\""
51130-44 = "샬레의 선생. 한 가지 물어볼게."
51130-45 = "거기 있는 아가씨가 당신에게 전부 고백하고 도움을 요청한 게 맞아?"
51130-46 = "자신은 카데노코지 가문의 사람이며, 따로 해야 할 일이 있지만."
51130-47 = "오로지 자신의 욕망을 위해 그 <의무>를 내팽개치고 백화요란 활동에 얽매이고 있습니다."
51130-48 = "그런 본심을 한 번이라도 말해준 적이 있어?"
51130-54 = "그럴 리가 없지. 당연해."
51130-55 = "그 아이에게 이건 전부 놀이니까."
51130-56 = "넌 백화요란이 아니더라도 돌아갈 수 있는 곳이 있어."
51130-57 = "애당초 우리랑 다르다고."
51130-58 = "그런 네가 가능하지도 않은 <계승전>을 운운하다니. 솔직히 말해서."
51130-62 = "………구역질이 나."
51130-63 = "아가씨의 놀이는 슬슬 이쯤 해주지 않을래? 이제는 꿈에서 깰 때도 됐잖아?"
51130-64 = "………"
51130-66 = "이제는 인정하도록 해."
51130-67 = "백화요란 놀이는 여기서 끝이야."
51130-68 = "……키쿄 선배는, 처음부터, 절…… 그렇게……."
51130-69 = "맞아. 중학생 때부터 귀찮게 하던 네가, 정말 얼마나 성가셨는지."
51130-70 = "스스로만 모르고 있었구나."
51130-76 = "처음부터……"
51130-80 = "……처음부터 제가, 나구사 선배를 이길 수 없다는 건………"
51130-81 = "<계승전>을 치른다 해도, 이길 수 있는 가능성이 없다는 것쯤은……"
51130-82 = "처음부터 알고 있었사와요."
51130-83 = "…………"
51130-84 = "[s] \"유카리…….\""
51130-88 = "소녀는, 단지…… 돌아가고 싶었을 뿐이어요……."
51130-91 = "음양부의 부장께서 부디 제 <백화요란 계승전>의 증인이 되어주시와요!"
51130-93 = "계승전만 치를 수 있다면……"
51130-94 = "나구사 선배를 쓰러트리고…… 부장의 자리에 오르면……."
51130-98 = "그때로…… 그때의 날로……."
51130-100 = "모두와 함께 있던 그때로 돌아갈 수 있다고…… 믿고서……"
51130-101 = "그런데…… 렌게 선배도, 키쿄 선배도…… 다들……"
51130-102 = "백화요란은 이미 끝났다고…… 돌아갈 수 없다고만 말하고……."
51130-103 = "저는! 그저 함께 있던 때로 돌아가고 싶었을 뿐인데……!"
51130-104 = "………읏!"
51130-109 = "폐를 끼쳐서…… 정말로………"
51130-110 = "정말로 죄송하였어요. 선생님."
51130-115 = "[ns] \"잠깐! 유카리……!\""
51130-117 = "쓸데없이 얽매여 있다니 그딴 무의미한 짓을, 왜 하는 건데."
51130-118 = "나구사 선배가 백화요란의 <자격>을 반납하러 온 순간, 이미 모든 건 결정되었던 거야."
51130-119 = "이미 그때부터 부원들 사이에선 소문이…… 풍문이 돌기 시작했어."
51130-120 = "이것으로 백화요란은 끝이라고. 전부 끝나버린 거라고."
51130-121 = "그렇다면 그 전에 움직여야만 하는 거잖아."
51130-122 = "누구보다 나구사 선배를 동경했을 저 아이를 위해서……"
51130-123 = "아직 돌아갈 곳이 있는 저 아이를 위하고자 한다면."
51130-124 = "이게…… 이것만이 정답이야."
51130-125 = "무너져버리고 부서져버리면서 형태가 변한 건, 다시 원래대로 되돌아갈 수 없을 테니까."
51130-126 = "이런 곳에 남겨지는 건, 나 같이 남고자 결정한 사람만으로도 충분……하니까."
51130-128 = "[ns] \"아니, 그 말은 틀렸어.\""
51130-132 = "……뭐?"
51130-133 = "[s] \"그런 건 타인이 정할 문제가 아니야.\""
51130-135 = "[ns] \"유카리는 백화요란을 무척 좋아하는구나.\""
51130-136 = "네!"
51130-137 = "그도 그럴게."
51130-138 = "백화요란은……… 오롯이 제가 동경하던 것이었으니까."
51130-140 = "[ns] \"여기에 남고 싶은가 아닌가는 유카리 본인이 정할 문제야.\""
51130-141 = "외부인일 뿐인 당신이 무얼 안다고……"
51130-146 = "제가, 이런 말을 하는 건 조금 주제넘은 걸지도 모르지만."
51130-147 = "……마츠리부의 부장까지?"
51130-148 = "자기가 있을 곳…… 있고 싶은 곳을 정하는 건……."
51130-153 = "남이 아니라 자기 자신이어야 한다고 생각해요."
51130-159 = "그러니 남을 위해서란 이유로, 그걸 강요해서는……"
51130-160 = "네. 안 되는 일이라고 생각하니까요."
51130-166 = "[ns] \"유카리는 처음부터 계승전에서 이기는 게 불가능하다는 걸 알고 있었어.\""
51130-168 = "[ns] \"계승전은, 단지 너희들과 만나기 위한 계기였을 뿐인 게 아닐까?\""
51130-169 = "………이제 와서 그런 말을 해 봤자."
51130-170 = "변하는 건…… 아무것도……."
51130-171 = "나는…… 올바르다고 생각한 이야기를 했을……."
51130-172 = "[s] \"게다가, 키쿄. 놀이라니. 유카리를 그렇게 생각해 본 적 없었잖아?\""
51130-176 = "[ns3] \"남을 위해 속내와 다른 말을 해봤자,\"\n[ns4] \"서로에게 상처만을 줄 뿐이니까.\""
51130-179 = "……!!"
51130-180 = "이, 이럴 게 아니라. 저…… 일단은!"
51130-181 = "카데노코지…. 아니, 유카리 양을 찾아보도록 하죠!"
51130-182 = "[s] \"응, 가자. 시즈코.\""
51130-200 = "………다들…… 나보고 어쩌라는 거야."
51130-205 = "……………"
51130-206 = "우리에게 필요했던 건, 나구사 선배……"
51130-207 = "당신, 뿐이었는데……."
51130-211 = "…………"
51130-224 = "………렌게, 나야."
51130-227 = "하루 종일 백화요란에게 당하기만 하고!"
51130-228 = "축제를 즐기기 전에 이게 뭔 꼴이람!"
51130-233 = "그, 리더, 이만 포기하자."
51130-234 = "네, 맞습니다. 리더. 그냥 다 잊고 오늘 밤에 있는 축제를 즐기는 게……."
51130-235 = "맞아맞아! 이제 축제 시작도 얼마 안 남았고!"
51130-237 = "으음, 역시 그게 좋을까? 그렇지?"
51130-238 = "괜히 오르지 못할 나무를 쳐다보기만 하는 건 미련한 짓이라고 옛날의 대단한 누군가가 그 비슷한 말을 했던 거 같기도 하고."
51130-243 = "(그런 말을 누가 했었나?)"
51130-245 = "으음 하지만!"
51130-246 = "우리가 또 누구야! 우는 애도 웃게 만든다는 망량즈인데!"
51130-251 = "(그 말대로라면 그냥 얕보일 뿐인 게…….)"
51130-253 = "이렇게 쉽게 포기해도 될까?!"
51130-254 = "여기에선 리더로서 집요하게 포기하지 않는 모습을 보여줘야 모범이 되는 게……!"
51130-255 = "아무도 리더한테 그런 기대는……"
51130-259 = "뭐야?!"
51130-263 = "딱콩 반대~~!"
51130-264 = "으윽! 하여간 갚아주지 않으면 억울해서 잠 못 자!"
51130-269 = "……그러신가요? 그건 곤란하네요. 실로 곤란한 일이에요."
51130-270 = "모처럼 모두가 즐거워야 할 축제 속에서 그런 슬픈 마음을 품은 채. 축제를 마음껏 즐기지 못한다니."
51130-271 = "네, 그래선 아니 될 일이죠."
51130-276 = "……누, 누구야?"
51130-282 = "그러면 도와드릴까요? 고양이 손이라도 필요하시지 않으신가요?"
51130-283 = "우후후……. 전 고양이는 아니지만."
51130-288 = "――――고양이 손, 빌려드릴까요?"
51130-290 = "다음화;결심하는 소녀"
