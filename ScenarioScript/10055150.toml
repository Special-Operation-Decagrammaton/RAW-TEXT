10055150-70 = "Heh, so that's how you want to play it."
10055150-71 = "This old-timer's gonna sit this one out, so I don't ruin the fun."
10055150-72 = "So..."
10055150-73 = "How about you take care of it, Ayane?"
10055150-74 = "M-Me?! Why me all of a sudden?!"
10055150-75 = "You're holding back against the Pandemonium Society? How insulting."
10055150-76 = "Oh, you don't know Ayane. She's a first-year, but she's a triple elite with student-body-presidential experience."
