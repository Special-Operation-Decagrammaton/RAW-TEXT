[translation]
10055150-1 = "砂浜をたどってやってきた貧乏キャラバン"
10055150-2 = ""
10055150-3 = "タイガーシャーク丸！お前はヤドカリ界にて最強！"
10055150-4 = "ひいては、甲殻類最強となるのだ！"
10055150-5 = "うへ～おじさん、暑くて幻聴が聞こえちゃってるみたいだ～"
10055150-6 = ""
10055150-8 = ""
10055150-9 = ""
10055150-10 = ""
10055150-11 = "これは聞き捨てならないよねぇ、ノノミちゃん？"
10055150-12 = ""
10055150-13 = "砂浜をたどって#nやってきた#n貧乏キャラバン"
10055150-16 = ""
10055150-18 = "ええ！ヤドカリが甲殻類最強の座を狙うなんて！"
10055150-19 = "百年、いや千年は早いです！"
10055150-21 = "お前たちは……！？"
10055150-22 = "……！"
10055150-23 = "…………？"
10055150-24 = "誰だ？"
10055150-25 = "忘れちゃったんですか？アビドス生徒会ですよ。"
10055150-26 = "えーっと、名前はなんだったっけ……？"
10055150-27 = "対策委員会よ。全校生徒5人で構成されている生徒会ね。"
10055150-28 = "なるほど、どこかの弱小生徒会ということか。この私が覚えていないのも当然だな。"
10055150-29 = "本人たちを前にそんなこと言わないでくださいよ……。"
10055150-30 = "言うねぇ～最近の女子高生って怖いな～"
10055150-31 = "同じ女子高生でしょ！？歳も同じだし！"
10055150-32 = "あはは……噂が本当なら、年上の可能性もあるかも……。"
10055150-33 = "弱小生徒会……？"
10055150-34 = "やばい！シロコ先輩が……！"
10055150-35 = ""
10055150-37 = ""
10055150-38 = "それ、撤回して。"
10055150-39 = "ん？お前は誰だ。"
10055150-40 = "[ruby=すなおおかみ]砂狼シ[/ruby]ロコ。弱小生徒会って言ったこと、今すぐ撤回して。"
10055150-41 = "ほう、威勢がいいな。だが、私はあくまで事実を言っているだけだ。"
10055150-42 = "キヴォトス三大学園のゲヘナに対し、全校生徒がたった5人のアビドス。#n比較するまでもないだろう。"
10055150-43 = "弱くない。勝負すれば分かる。"
10055150-44 = "勝負？"
10055150-45 = "ん、ルールは簡単。勝った方が強者、負けた方が弱者。"
10055150-46 = "ふっ、力の論理というわけか。品位には欠けるが、分かりやすくていい。"
10055150-47 = "えっ、戦うんですか！？"
10055150-48 = "ケンカは……ダメだよ。"
10055150-49 = "シロコちゃん。この感じ……皆さん勘違いしちゃってるみたいですよ？"
10055150-50 = "あ、ごめん。"
10055150-51 = "私が言いたかったのは……。"
10055150-52 = ""
10055150-54 = ""
10055150-55 = "万魔殿に、「クラブファイト」を申し込む。"
10055150-56 = ""
10055150-58 = ""
10055150-59 = "クラブ……ファイト？"
10055150-60 = "なんだかよく分からんがいいだろう！#nキシシッ、売られた喧嘩は買うのがマコト様流だ！"
10055150-61 = "やれ、イロハ！奴らを一掃しろ！"
10055150-62 = "え？今の流れで私ですか？"
10055150-63 = "何を言っている。内容も分からないのに、私がやるわけがないだろう。"
10055150-64 = "私もそうですよ！"
10055150-65 = "クラブファイトというからには戦いなのだろう？#nちょうどお前にも「赤ヤドカリ」というパートナーができたことだし、好都合ではないか。"
10055150-66 = "あっちはザリガニですよ！？相手になるわけないでしょう！？"
10055150-67 = "そんなものは気合いでどうにでもなる！"
10055150-68 = "ああっ、もう！負けても文句言わないでくださいよ！？"
10055150-70 = "うへ～そう来るか～"
10055150-71 = "ここで出たら、おじさん空気読めない人になっちゃうな～"
10055150-72 = "それじゃここは……。"
10055150-73 = "アヤネちゃんにお願いしようかな？"
10055150-74 = "わ、私ですか！？"
10055150-75 = "不快だな。我々万魔殿に出し惜しみをして勝てるとでも？"
10055150-76 = "何言ってんの～#nアヤネちゃんは1年生にして生徒会長の経験がある、超超超エリートだよ～？"
10055150-77 = "ん、怒ったら一番怖い。"
10055150-78 = "ホシノ先輩！？シロコ先輩まで！？"
10055150-79 = "なるほど、秘密兵器というやつか。"
10055150-80 = "キシシッ！一方こちらは捨て駒。勝てたら僥倖、負けても損はない！"
10055150-81 = "誰が捨て駒ですか！"
10055150-82 = "それじゃあ両カニ、位置について～☆"
10055150-83 = ""
10055150-85 = ""
10055150-86 = "クラブ～、ファイッ！！"
