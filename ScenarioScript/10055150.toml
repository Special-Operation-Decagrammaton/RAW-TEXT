10055150-38 = "Take it back."
10055150-39 = "Hm? And you are...?"
10055150-40 = "Sunaookami Shiroko. Take back everything you said about our school and our student council. Now."
10055150-41 = "Ho, I do admire that nerve of yours, but I was only stating the facts."
10055150-42 = "Gehenna is one of the three largest academies in Kivotos. Yours is falling apart and has FIVE students left. There's no comparison at all."
10055150-43 = "That doesn't make us weak. We can take you on any day."
10055150-44 = "Can you, now?"
10055150-45 = "Yes. The strong will win. The weak will lose."
10055150-46 = "Hmph. A trial of strength. Rather inelegant, but if you understand no other way..."
10055150-47 = "Whoa, are they gonna fight?"
10055150-48 = "No, no fighting! We should all get along!"
10055150-49 = "You're making a very scary face, Shiroko. You don't want to give people the wrong impression, do you? ☆"
10055150-50 = "Oh, wait, sorry."
10055150-51 = "What I MEANT was..."
10055150-52 = ""
10055150-54 = ""
10055150-55 = "I challenge the Pandemonium Society to a Crab Fight!"
10055150-56 = ""
10055150-58 = ""
10055150-59 = "A...crab fight?"
10055150-60 = "I've never heard of such a thing, but very well! A challenge is a challenge!"
10055150-61 = "Go, Iroha! Wipe them out!"
