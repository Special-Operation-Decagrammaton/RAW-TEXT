10055150-63 = "Did I not JUST say, \"I've never heard of such a thing\"? Would you have me walk into battle blind?"
10055150-64 = "I'VE never heard of it either!"
10055150-65 = "Well, I assume it has something to do with crabs, yes? And you just so happen to have a \"Red Hermit Crab\" of your own now!"
10055150-66 = "They have a CRAYFISH! It's not even in the same weight class!"
10055150-67 = "What it lacks in weight, it can make up in SPIRIT!"
