10055150-27 = "The Foreclosure Task Force. Both their student council and their entire student body."
10055150-28 = "Ah, the pitiful council of some no-name academy. No wonder I'd forgotten them."
10055150-29 = "Yes, why don't you yell that right in front of them?"
10055150-30 = "So mean! High school girls these days have no manners!"
