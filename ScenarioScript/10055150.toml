[translation]
10055150-1 = "คาราวานคนจนที่ตามมาถึงชายหาด"
10055150-2 = ""
10055150-3 = "ไทเกอร์ชาร์กมารุ! แกคือปูที่แข็งแกร่งที่สุดในหมู่ปูเสฉวน!"
10055150-4 = "ไม่สิ แกต้องก้าวไปเป็นสัตว์เปลือกแข็งที่แข็งแกร่งที่สุดต่างหาก!"
10055150-5 = "แหะๆ~ ลุงร้อนจนหูแว่วไปแล้วหรือเปล่านะ?"
10055150-6 = ""
10055150-8 = ""
10055150-9 = ""
10055150-10 = ""
10055150-11 = "ได้ยินแบบนี้แล้วคงปล่อยผ่านไม่ได้ง่ายๆ หรอกเนอะ~ ว่ามั้ยล่ะ โนโนมิจัง"
10055150-12 = ""
10055150-13 = "คาราวานคนจน#nที่ตามมาถึงชายหาด"
10055150-16 = ""
10055150-18 = "ใช่ค่ะ รุ่นพี่โฮชิโนะ! เป็นแค่ปูเสฉวนแท้ๆ ยังกล้าจะหวังจะเป็นสุดยอดสัตว์เปลือกแข็งอีกงั้นเหรอคะ"
10055150-19 = "ยังเร็วไปอีกร้อยปี ไม่สิ พันปีเลยค่ะ♧"
10055150-21 = "พวกเธอคือ...?!"
10055150-22 = "...!"
10055150-23 = "...?"
10055150-24 = "ใครกัน...?"
10055150-25 = "ลืมไปแล้วเหรอคะ? สภานักเรียนอะบิดอสไงล่ะคะ"
10055150-26 = "ใช้ชื่อแปลกๆ อยู่เหมือนกันนะคะ ชื่ออะไรนะ..."
10055150-27 = "คณะกรรมการแผนงานไง เป็นสภานักเรียนที่มีนักเรียนทั้งห้าคนของโรงเรียนเป็นสมาชิกน่ะ"
10055150-28 = "สรุปก็คือเป็นสภานักเรียนกระจอกๆ ของโรงเรียนเล็กๆ สินะ? ไม่แปลกเลยที่เราจะจำไม่ได้"
10055150-29 = "โธ่ อย่าพูดแบบนั้นต่อหน้าพวกเขาสิคะ"
10055150-30 = "โอ้โฮ เจ็บแสบสุดๆ เลย~ เด็กม.ปลายสมัยนี้น่ากลัวจริงๆ เลยนะ~"
10055150-31 = "เดี๋ยวสิ! ฝ่ายนั้นก็เป็นประธานสภานักเรียนเหมือนกันนะ?! อายุไม่ได้ต่างจากรุ่นพี่โฮชิโนะเลยด้วย"
10055150-32 = "อะฮะฮ่า... ถ้าตามข่าวลือที่ได้ยินมามีโอกาสที่จะอายุมากกว่าด้วยซ้ำค่ะ..."
10055150-33 = "สภานักเรียนกระจอกๆ...?"
10055150-34 = "อ๊ะ! แย่แล้ว! รุ่นพี่ชิโรโกะ...!"
10055150-35 = ""
10055150-37 = ""
10055150-38 = "ถอนคำพูดซะ"
10055150-39 = "หืม? เธอเป็นใคร?"
10055150-40 = "สึนาโอกามิ ชิโรโกะ ถอนคำพูดที่ว่าสภานักเรียนกระจอกๆ เดี๋ยวนี้"
10055150-41 = "โฮ่ กล้าหาญดีนี่ ใจสู้น่ะก็ดีอยู่หรอกนะ แต่ท่านมาโคโตะผู้นี้ก็แค่พูดความจริงเท่านั้นเอง"
10055150-42 = "เทียบกับเกเฮนน่าที่เป็นหนึ่งในสามโรงเรียนใหญ่ของคิโวทอส อะบิดอสก็แค่โรงเรียนตกต่ำที่มีนักเรียน#nทั้งโรงเรียนแค่ห้าคน ตามจริงแล้วไม่น่าจะเอามาเทียบกันได้ด้วยซ้ำไม่ใช่หรือไง?"
10055150-43 = "ไม่ได้กระจอกนะ มาลองแข่งกันเดี๋ยวก็รู้"
10055150-44 = "แข่งงั้นเหรอ?"
10055150-45 = "อื้อ เรื่องง่ายๆ ฝ่ายชนะคือผู้แข็งแกร่ง ฝ่ายแพ้คือผู้อ่อนแอ"
10055150-46 = "ฮึ ใช้พลังเป็นตัวตัดสินสินะ ถึงจะไม่สง่างาม แต่ก็เข้าใจได้ง่ายดี"
10055150-47 = "เอ๋?! จะมีเรื่องกันงั้นเหรอคะ?!"
10055150-48 = "ทุกคนอย่าทะเลาะกันเลยนะ... ต้องรักกันเข้าไว้สิ..."
10055150-49 = "นี่ ชิโรโกะจัง~ ทำหน้าเครียดขนาดนั้น ทุกคนก็เข้าใจผิดกันหมดสิคะ☆"
10055150-50 = "อ่า โทษที"
10055150-51 = "ที่ฉันจะพูดก็คือ..."
10055150-52 = ""
10055150-54 = ""
10055150-55 = "ฉันขอท้าแพนเดโมเนียม โซไซตี้แข่ง <แคร็บ ไฟต์> กัน"
10055150-56 = ""
10055150-58 = ""
10055150-59 = "แคร็บ... ไฟต์...?"
10055150-60 = "เราไม่รู้หรอกว่ามันคืออะไร หึหึ! แต่ย่อมได้! เราไม่ปฏิเสธคำท้าอยู่แล้ว!"
10055150-61 = "ลุยเลย อิโรฮะ! จัดการพวกนั้นให้สิ้นซาก!"
10055150-62 = "คะ? คุยกันเองมาตั้งนาน ทำไมถึงกลายเป็นฉันล่ะคะ?"
10055150-63 = "จะให้เราไปลงแข่งทั้งที่ยังไม่รู้ว่ามันคืออะไรงั้นเหรอ?"
10055150-64 = "แล้วให้ฉันไปลงแข่งทั้งที่ยังไม่รู้ว่ามันคืออะไรได้งั้นเหรอคะ?!"
10055150-65 = "ถึงจะไม่รู้ว่าแคร็บไฟต์คืออะไร แต่ก็หมายถึงให้ปูสู้กันไม่ใช่หรือไง! เธอเองก็เพิ่งได้ <ปูเสฉวนสีแดง> มาด้วยนี่!"
10055150-66 = "เดี๋ยวสิ ของฝั่งโน้นเป็นกุ้งเครย์ฟิชนะคะ?! แค่ขนาดตัวก็สู้ไม่ได้แล้วค่ะ?!"
10055150-67 = "เรื่องนั้นก็ใช้พลังใจแก้ไขซะสิ!"
10055150-68 = "อ่า จริงๆ เลย! ถ้าแพ้ขึ้นมาก็อย่ามาโวยวายใส่ฉันทีหลังแล้วกันนะคะ!"
10055150-70 = "แหะๆ~ จะเอาแบบนั้นสินะ~"
10055150-71 = "ถ้าเอาจริงเกินไป ลุงก็จะกลายเป็นคนไม่รู้กาลเทศะไปสิน้า~"
10055150-72 = "ถ้าอย่างนั้น ตอนนี้..."
10055150-73 = "ลองให้อายาเนะจังจัดการดูดีมั้ย?"
10055150-74 = "คะ... คะ?! ฉันเหรอคะ?! ทำไมจู่ๆ ถึงเป็นฉันล่ะคะ?!"
10055150-75 = "สู้กับแพนเดโมเนียม โซไซตี้อย่างเราแล้ว ยังคิดจะออมมืออีกงั้นเหรอ? น่าหงุดหงิดจริงๆ"
10055150-76 = "ไม่รู้อะไรซะแล้ว~ ถึงอายาเนะจังจะอยู่แค่ปี 1 แต่ก็เป็นที่สุดของที่สุดของสุดยอดหัวกะทิที่เคยเป็น#nประธานสภานักเรียนเลยนะ?"
10055150-77 = "อื้อ เวลาโกรธน่ะ น่ากลัวที่สุดเลยด้วย"
10055150-78 = "รุ่นพี่โฮชิโนะ?! รุ่นพี่ชิโรโกะก็เอากับเขาด้วยเหรอคะ?!"
10055150-79 = "อย่างนี้นี่เอง! อาวุธลับสินะ!"
10055150-80 = "คิกคิกคิก! ส่วนฝั่งเราก็แค่ตัวเบี้ย ถ้าชนะก็ได้กำไรเต็มๆ! ถึงแพ้ก็ไม่เสียอะไรอยู่แล้ว!"
10055150-81 = "ตัวเบี้ยที่พูดถึงกำลังฟังอยู่ตรงนี้นะคะ?"
10055150-82 = "ถ้าอย่างนั้น ปูทั้งสองฝ่าย... ประจำที่ค่ะ☆"
10055150-83 = ""
10055150-85 = ""
10055150-86 = "แคร็บ...ไฟต์!!"
