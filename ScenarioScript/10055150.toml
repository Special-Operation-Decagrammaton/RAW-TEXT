[translation]
10055150-1 = "모래사장을 따라온 가난뱅이 캐러밴"
10055150-3 = "타이거샤크마루! 너는 소라게 중에 최강!"
10055150-4 = "아니, 더 나아가, 갑각류 중에서 최강이 되는 것이다!"
10055150-5 = "으헤~ 아저씨가 더위에 헛것을 들은 걸까나?"
10055150-11 = "쉽게 듣고 지나칠 수 없겠는걸~ 그치, 노노미 쨩?"
10055150-13 = "모래사장을 따라온#n가난뱅이 캐러밴"
10055150-18 = "맞아요, 호시노 선배! 고작 소라게 주제에 갑각류 최강을 넘보다뇨!"
10055150-19 = "백년, 아니, 천년은 일러요♧"
10055150-21 = "너희는……?!"
10055150-22 = "……!"
10055150-23 = "…………?"
10055150-24 = "누구냐?"
10055150-25 = "그새 잊어버리신 건가요? 아비도스 학생회잖아요."
10055150-26 = "꽤 특이한 이름을 썼는데, 뭐였더라……."
10055150-27 = "대책위원회야. 전교생 다섯 명이 모두 가입한 학생회네."
10055150-28 = "어차피 군소 학원의 약소 학생회라는 건가? 이 몸이 기억하지 못한 것도 당연하군."
10055150-29 = "아, 좀, 면전에서 그런 말 좀 하지 마요."
10055150-30 = "이야, 신랄하네~ 요즘 여고생은 무섭다니까~"
10055150-31 = "아니, 저쪽도 학생회장이잖아?! 호시노 선배랑 나이 차이 안 난다고!"
10055150-32 = "아하하…… 소문에 따르면, 오히려 연상일 가능성도 있긴 한데요……."
10055150-33 = "약소 학생회……?"
10055150-34 = "앗! 큰일 났다! 시로코 선배가……!"
10055150-38 = "그 말, 취소해."
10055150-39 = "응? 너는 누구지?"
10055150-40 = "스나오오카미 시로코. 약소 학생회라 말한 거, 당장 취소해."
10055150-41 = "호오, 당돌하군. 패기는 좋다만, 이 몸은 어디까지나 사실을 말했을 뿐."
10055150-42 = "키보토스 삼대 학원이라 불리는 게헨나에 비해, 아비도스는 고작 전교생 다섯 명의 영락한 학원. 본래라면 비교의 대상조차 아닐 텐데?"
10055150-43 = "약하지 않아. 승부해 보면 알아."
10055150-44 = "승부?"
10055150-45 = "응, 간단해. 이기는 쪽이 강자. 지는 쪽이 약자."
10055150-46 = "훗. 힘의 논리인가. 품위는 없지만, 알기는 쉬워 좋군."
10055150-47 = "엣?! 싸우는 건가요?!"
10055150-48 = "다들 싸우면 안 돼……. 사이좋게 지내야 해……."
10055150-49 = "저기, 시로코 쨩~ 너무 무서운 얼굴을 하니까 다들 착각하잖아요☆"
10055150-50 = "아, 미안."
10055150-51 = "내가 말하려 했던 거는……."
10055150-55 = "만마전에 <크랩 파이트>를 신청하겠어."
10055150-59 = "크랩…… 파이트……?"
10055150-60 = "뭔지는 모르겠다만, 후후! 좋다! 걸어오는 승부는 마다하지 않는다!"
10055150-61 = "가라, 이로하! 녀석들을 일소해라!"
10055150-62 = "네? 지금 흐름에서 왜 저예요?"
10055150-63 = "뭔지도 모르는 싸움에 이 몸이 나서란 말이냐?"
10055150-64 = "뭔지도 모르는 싸움에 저는 나서도 되고요?!"
10055150-65 = "크랩 파이트, 뭔지는 몰라도, 요지는 게 싸움이라는 거 아니냐! 마침 너에게도 <빨간 소라게>가 생긴 참이잖나!"
10055150-66 = "아니, 보니까 저기는 가재인데요?! 체급부터 상대가 안 되잖아요?!"
10055150-67 = "그런 건 기합으로 해결해라!"
10055150-68 = "아아, 진짜! 져도 나중에 딴소리하지 마요!"
10055150-70 = "으헤~ 그렇게 나오시겠다~"
10055150-71 = "너무 진지하게 했다가는, 아저씨, 분위기 못 읽는 사람이 되어 버리겠는걸~?"
10055150-72 = "그러면, 여기서는……."
10055150-73 = "아야네 쨩한테 부탁해 볼까?"
10055150-74 = "ㄴ, 네?! 저요?! 갑자기요, 왜요?!"
10055150-75 = "우리 만마전을 상대로 전력을 아끼는 건가? 불쾌하군."
10055150-76 = "뭘 모르시는 말씀~ 아야네 쨩은 무려 1학년이지만, 학생회장 경험이 있는 초초초엘리트라고?"
10055150-77 = "응, 화내면 제일 무서워."
10055150-78 = "호시노 선배?! 시로코 선배까지?!"
10055150-79 = "과연! 비밀 병기라는 녀석인가!"
10055150-80 = "키시싯! 반면, 이쪽은 버림패이니, 이기면 대박! 져도 손해는 없군!"
10055150-81 = "그 버림패가 듣고 있거든요?"
10055150-82 = "그러면, 양게, 모두 자리에☆"
10055150-86 = "크랩 파이트-!!"
