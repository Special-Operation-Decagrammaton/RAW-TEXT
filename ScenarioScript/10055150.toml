[translation]
10055150-1 = "沿著沙灘而來的窮酸商隊"
10055150-2 = ""
10055150-3 = "虎鯊丸！你是寄居蟹之中最強的！"
10055150-4 = "不，你要進一步成為甲殼類之中最強的存在！"
10055150-5 = "唔嘿～大叔是熱到出現幻聽了嗎？"
10055150-6 = ""
10055150-8 = ""
10055150-9 = ""
10055150-10 = ""
10055150-11 = "這可不能當沒聽見呢～對吧，野乃美醬？"
10055150-12 = ""
10055150-13 = "沿著沙灘而來的#n窮酸商隊"
10055150-16 = ""
10055150-18 = "沒錯，星野前輩！區區一隻寄居蟹，竟敢覬覦甲殼類最強的寶座！"
10055150-19 = "還早了一百年──不，是早了一千年呢♧"
10055150-21 = "你們是……！？"
10055150-22 = "……！"
10055150-23 = "…………？"
10055150-24 = "誰啊？"
10055150-25 = "你這麼快就忘了嗎？是阿拜多斯學生會啊。"
10055150-26 = "而且用的名字還挺特別的，叫什麼來著……"
10055150-27 = "是對策委員會。全校五名學生都是成員的學生會。"
10055150-28 = "說白了就是小學園的弱小學生會吧？難怪本大人記不得。"
10055150-29 = "啊，拜託，別當著人家的面說那種話啦。"
10055150-30 = "哎呀，真毒辣呢～現在的女高中生真可怕～"
10055150-31 = "等一下，對方不也是學生會長嗎！？#n年紀跟星野前輩明明差不多啊！"
10055150-32 = "啊哈哈……照傳聞來看，說不定反而比較年長呢……"
10055150-33 = "弱小學生會……？"
10055150-34 = "啊！糟了！白子前輩他……！"
10055150-35 = ""
10055150-37 = ""
10055150-38 = "那句話，收回去。"
10055150-39 = "嗯？你是誰？"
10055150-40 = "砂狼白子。說我們是弱小學生會的那句話，現在馬上收回。"
10055150-41 = "哦？膽子還真大啊。#n雖然有魄力是件好事，不過本大人只是陳述事實而已。"
10055150-42 = "相較於被譽為奇普托斯三大學園之一的格黑娜，#n阿拜多斯不過是全校只有五名學生的沒落學園，本來就無從比較吧？"
10055150-43 = "我們不弱。比一場就知道了。"
10055150-44 = "比一場？"
10055150-45 = "嗯，很簡單。贏的一方是強者，輸的一方是弱者。"
10055150-46 = "哼。力量的邏輯嗎？#n雖然沒什麼格調，但簡單易懂這點倒是不錯。"
10055150-47 = "咦！？要打架嗎！？"
10055150-48 = "大家不可以打架……要好好相處……"
10055150-49 = "那個，白子醬～你的表情太可怕了，大家都誤會了啦☆"
10055150-50 = "啊，抱歉。"
10055150-51 = "我想說的是……"
10055150-52 = ""
10055150-54 = ""
10055150-55 = "我要向萬魔殿提出[ruby=Crab Fight]「蟹鬥」[/ruby]的挑戰。"
10055150-56 = ""
10055150-58 = ""
10055150-59 = "蟹……鬥……？"
10055150-60 = "雖然不知道那是什麼，不過沒問題！#n嘰嘻嘻！本大人從不會拒絕有人上門挑戰！"
10055150-61 = "上吧，伊呂波！把那些傢伙一掃而空！"
10055150-62 = "咦？照這個流程怎麼會是我？"
10055150-63 = "你要本大人去參加連內容是什麼都不知道的對決嗎？"
10055150-64 = "那我就可以去參加連內容是什麼都不知道的對決嗎！？"
10055150-65 = "雖然不知道蟹鬥是什麼，重點就是螃蟹打架吧！#n正好你手上也有「紅寄居蟹」不是嗎！"
10055150-66 = "等等，對面是螯蝦耶！？光是量級就差很多吧！？"
10055150-67 = "那種事就靠氣勢解決！"
10055150-68 = "啊啊，真是的！萬一輸了可別事後囉哩八唆哦！"
10055150-70 = "唔嘿～你們打算這樣啊～"
10055150-71 = "要是太認真的話，大叔就要變成不會看氣氛的人了吧～？"
10055150-72 = "那麼，這裡就……"
10055150-73 = "拜託綾音醬出場吧？"
10055150-74 = "我，我嗎！？怎麼這麼突然，為什麼是我！？"
10055150-75 = "跟我們萬魔殿對戰還保留實力嗎？真令人不快。"
10055150-76 = "這你就有所不知了～#n綾音醬可是才1年級就有擔任學生會長經驗的超超超菁英哦？"
10055150-77 = "嗯，生氣的時候最可怕了。"
10055150-78 = "星野前輩！？連白子前輩也這麼說！？"
10055150-79 = "原來如此！就是所謂的祕密武器吧！"
10055150-80 = "嘰嘻嘻！反觀我們這邊只是棄子而已。#n贏了當賺到！輸了也沒損失！"
10055150-81 = "那顆棄子都聽到了哦？"
10055150-82 = "那麼，兩隻螃蟹各就各位☆"
10055150-83 = ""
10055150-85 = ""
10055150-86 = "Crab～Fight！！"
