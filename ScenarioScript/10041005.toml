[translation]
10041005-1 = "프롤로그;밀레니엄 엑스포"
10041005-6 = "저기 보세요, 선생님. 거의 다 도착했습니다."
10041005-7 = "이곳도 참으로 오랜만에 와 보는 기분이네요. 전에는 지금과 달리 회담 차 왔었는데 말이죠."
10041005-12 = "과학과 기술의 학교……."
10041005-13 = "……<밀레니엄 사이언스 스쿨>에."
10041005-17 = "오늘은 괜히 저 때문에 고생해 주셔서 감사합니다."
10041005-18 = "이런 식으로 신세를 지는 것은 솔직히 그리 바라는 모습이 아니었지만……."
10041005-27 = "달리 방도가 없네요. 이렇게라도 하지 않았다면 분명, 나기사는 제 외출을 허락하지 않았겠죠."
10041005-28 = "네. 선생님이 오시기 전까지만 해도……. 그렇게나 온도감이 높았으니까요."
10041005-29 = "그렇기에 선생님. 선생님께선 어떻게 생각하실지 모르겠으나 저에게 이것은 '시험'입니다."
10041005-30 = "어쩌면 단지 다른 두 사람에게만이 아니라, 저 스스로에게도 내리는 시험."
10041005-36 = "<유리조노 세이아>가 스스로, 온전히 서 있을 수 있다는 확인이자……."
10041005-38 = "……'증명'의 시련이에요."
