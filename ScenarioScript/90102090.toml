[translation]
90102090-1 = "제9화;히아신스 학원행 급행열차"
90102090-2 = "(그 날 저녁. 약속한 시간에 의뢰인과 승강장에서 다시 모이게 되었다.)"
90102090-3 = "(늦은 시간이라 그런지 승강장 내에는 아무도 없었고, 역사는 간간이 들리는 풀벌레 소리를 제외하면 숨이 멎을 듯이 고요했다.)"
90102090-11 = "오, 오셨군요……!"
90102090-12 = "늦은 시간의 승강장에 홀로 앉아 있으려니 어쩐지 무서워져서…… 조금 더 기다려도 오시지 않으면 돌아갈까 고민하던 참이었어요."
90102090-13 = "그런데, 그 장비는……?"
90102090-17 = "미안, 미안. 이것저것 준비하다 보니 생각보다 오래 걸려서."
90102090-18 = "집속 수류탄이랑 철로용 테르밋 용제…… 그리고 예비 드론도 준비했지!"
90102090-19 = "시간이 없어서 지금은 이것밖에 가져오지 못했지만…… 뭐, 이 정도 양이면 오늘 밤에는 충분할 거야."
90102090-20 = "저기, 실종된 학생을 찾으려던 게 아니셨나요?"
90102090-21 = "뭔가 지금 준비한 장비들은 불량 학생 상대가 아니라…… 여차하면 열차를 폭파하시려는 것처럼 보이는데요."
90102090-22 = "뭐, 아니라고는 할 수 없지."
90102090-23 = "필요하다면 열차를 폭파해서라도 정지시킬 필요가 있으니까."
90102090-24 = "사실 처음에는 미리 선로에 지뢰를 설치해 둘까 생각도 했지만, 그건 역시 다른 승객들에게 폐를 끼칠지도 모르니까……"
90102090-25 = "높으신 분들이 뒤를 봐주고 있다고 해도, 불필요한 지출은 삼가는 게 좋겠지."
90102090-26 = "(미야코 양의 선배들, 생각보다 위험한 사람들이었을지도……)"
90102090-27 = "그래서 오늘은 어떤 것 같으신가요?"
90102090-28 = "네, 네? 어떤 점이요?"
90102090-29 = "오늘 승강장의 분위기가, 그 때 수상한 열차를 목격했을 때와 비슷한 느낌인가요?"
90102090-30 = "……네. 그 때도 분명 이런 느낌이었어요."
90102090-31 = "제가 탈 열차가 오기까지는 꽤 시간이 남았기에, 의자에 앉아서 옛날 생각을 하고 있었어요."
90102090-36 = "마침 가방 속에 전에 쓰던 정기권이 들어 있어서, 손 때 묻은 표를 쥐고 옛 추억을 떠올렸죠."
90102090-38 = "사방이 고요하니, 지금의 풍경이 점차 흐릿해지고 기억이 더욱 또렷해지더라고요."
90102090-39 = "오래전 지나쳤던 일상의 풍경들도, 바로 어제 일처럼 생생하게 떠올랐거든요."
90102090-43 = "멀리서 아련히 들려오는 건널목 차단기가 내려가는 소리."
90102090-47 = "짝을 지어 즐겁게 오늘 하루를 반추하며 수다를 떠는 학생들의 목소리."
90102090-49 = "그리고 철길을 따라 흐드러지게 피어난 꽃무릇과, 계절마다 바뀌는 일상의 그리운 풍경들……"
90102090-54 = "<지금 4번 승강장으로 열차가 들어오고 있습니다.>"
90102090-55 = "어……?"
90102090-56 = "이, 이상하다…… 아직 열차가 들어올 때는 아닌데……"
90102090-57 = "<이번 열차는 사립 히아신스, 사립 히아신스 학원으로 가는 급행 열차입니다.>"
90102090-58 = "<선로 가까이 계시면 위험하오니, 안전하게 물러서 주시기 바랍니다.>"
90102090-59 = "FOX 4, 역사 내 폐쇄회로 [ruby=CCTV]텔레비전[/ruby]의 녹화 상태는?"
90102090-60 = "Signal Lost. 먹통이야. 조금도 반응이 없어."
90102090-61 = "역시 이전의 실종 사건이 발생했을 때와 같은 상태인 모양이네."
90102090-62 = "그렇다는 말은……"
90102090-63 = "저기 다가오고 있는 저 열차가 이번 타겟— 오브젝트 알파다."
90102090-64 = "총원 전투 준비. 볼트 체크, 안전장치 해제."
90102090-65 = "확인. 목표, 현위치로 부터 약 300m."
90102090-66 = "도, 도대체 지금부터 무슨 일을……"
90102090-67 = "걱정 마. 단순한 안전 점검 절차일 뿐이니까."
90102090-71 = "<출입문이 열립니다. 승객 여러분께서는 안전히 승차해 주시기 바랍니다.>"
90102090-76 = "역시 들은 대로 열차 안에는 아무도 없는 것처럼 보이네."
90102090-77 = "……정보가 없는 차량에 진입하는 것은 내키지 않지만, 지금은 어쩔 수 없군."
90102090-78 = "FOX 소대. 전원, 승차한다."
90102090-83 = "선생님. 선생님께서는 저희가 작전을 진행하는 동안 이곳에 남아 의뢰인과 함께 대기해 주셨으면 합니다."
90102090-84 = "[s1] \"어, 어째서……?\"\n[s2] \"나도 함께 가면 안 돼?\""
90102090-87 = "이번 작전은 그 어느 때보다 위험합니다."
90102090-88 = "열차의 내부가 어떻게 되어 있는지, 무엇이 저희를 기다리고 있는지. 파악한 정보가 아무것도 없습니다."
90102090-89 = "익숙한 장소에서 괴물을 상대했던 기존 작전과는 달리, 이번 작전은 사실상 괴물의 입 속으로 직접 걸어 들어가는 것과 마찬가지니까요."
90102090-90 = "[s3] \"그렇다면 더더욱 너희만 보낼 순 없어.\"\n[s4] \"게다가 열차 외부에서 원격으로 지시를 내릴 수 있다는 보장도 없잖아?\""
90102090-93 = "하지만, 선생님께 무슨 일이 생긴다면……"
90102090-94 = "[s] \"유키노는 나를 믿지?\""
90102090-95 = "그야 물론입니다만, 갑자기 어째서 그런 질문을?"
90102090-96 = "[s5] \"나도 유키노가 언제나 나를 지켜줄 거라고 믿어.\"\n[s6] \"그렇기에 유키노의 곁에서 떨어지고 싶지 않아.\""
90102090-102 = "………하아."
90102090-103 = "그럼 제 뒤에서 절대로 떨어지지 마십시오."
90102090-104 = "총원, 진입한다."
90102090-105 = "저, 저기…… 정말로 괜찮으신가요?"
90102090-106 = "뭐가 말이야?"
90102090-107 = "이 열차에 탔던 사람들은 모두 돌아오지 못했는데…… 그런 위험을 무릅쓰셔도 정말 괜찮으신가요?"
90102090-108 = "저는 제 친구의 일이라지만, 여러분에게는 누군지 모를 그저 의뢰인의 상대일 뿐인데……"
90102090-113 = "누군지 모를 낯선 상대가 아니야."
90102090-114 = "사라진 학생들 또한 누군가에게는 소중한 친구이자 가족일테고……"
90102090-115 = "무엇보다 우리에게도 소중한 후배의 친구 잖아?"
90102090-116 = "약속할게. 반드시 네 친구를 데리고 돌아온다고."
90102090-122 = "혹시 모르니까, 이 표는 잠깐 빌려갈게!"
90102090-126 = "저, 혹시…… 미야코 양을 볼 때마다 생각했었는데, 설마 여러분은—"
90102090-127 = "쉬잇."
90102090-128 = "그 이상은 기밀사항이야."
90102090-135 = "<출입문이 닫힙니다. 탑승하지 못한 분은 다음 열차를 이용해 주시기 바랍니다.>"
90102090-140 = "다음화;불릿 트레인"
