[translation]
1000603-1 = "교정에서의 휴식"
1000603-2 = "게헨나 학원의 교정"
1000603-3 = "게헨나 학원의 교정에 누워서 낮잠을 청하려던 찰나에 이오리와 마주쳤다."
1000603-4 = "………."
1000603-5 = "여기 누워서 무얼 하고 있는 거야, 선생님……"
1000603-6 = "[s] \"쉬고 있었어.\""
1000603-7 = "휴식이라면 휴게실이나 샬레의 집무실에서 쉬어도 되잖아."
1000603-8 = "이런 딱딱하고 울퉁불퉁한 돌바닥에 눕는 건 불편하기만 할 텐데."
1000603-9 = "[s] \"의외로 딱딱한 돌바닥이 허리를 자극해서 기분이 좋아.\""
1000603-10 = "불편한 게 기분 좋다니……"
1000603-11 = "선생님…… 전부터 생각했는데, 혹시 아픈 걸 좋아하는 거야?"
1000603-12 = "전에 구두에 밟혔을 때도 그렇고, 일부러 아픈 일을 자처하는 것 같은데……"
1000603-13 = "어쩐지 기분 나빠……."
1000603-14 = "[s] \"이오리도 한 번 누워보는 게 어때?\""
1000603-15 = "싫어. 분명히 정신이 이상한 사람처럼 보일거야."
1000603-16 = "한 번 누워보면 생각이 달라질 거라고?"
1000603-17 = "해보지도 않고 판단하는 건 나쁜 거라고?"
1000603-18 = "으음, 확실히 그 말은 맞지만……"
1000603-19 = "그래도 대낮부터 교정에 누워서 낮잠을 잔다니, 이상해."
1000603-20 = "그래도 그렇게 권하면 한 번은……"
1000603-27 = "[s] \"어때? 시원한 돌바닥이 기분좋지?\""
1000603-28 = "……딱딱하고 불편해……."
1000603-29 = "역시 선생님은 아픈 것을 좋아하는 변태였구나……."
1000603-30 = "기분 나빠……."
1000603-32 = "이오리로부터의 오해가 깊어졌다……."
