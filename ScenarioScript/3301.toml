[translation]
3301-1 = "멀리 휘두르며 1"
3301-3 = "<——플레이 볼!>"
3301-5 = "자, 모두들 주목!"
3301-6 = "이번 경기는 연습 경기니까, 다들 긴장할 필요는 없어."
3301-7 = "상대편 선수도 엔지니어부에서 만들어 준 로봇일 뿐이니까…… 야유를 당하거나 데드볼을 맞을까 걱정하지 않아도 괜찮아."
3301-12 = "……하지만 엔지니어부가 만든 로봇이라면 더 위험한 거 아니에요?"
3301-13 = "지난번에 그 엔지니어부의 신입 부원이 가져다준 피칭 머신은 프로 선수 이상의 강속구를 쉬지 않고 던져 댔는데……"
3301-14 = "심지어 그 로봇, 공을 던지기 전에 도발까지 했다니까요!"
3301-15 = "으음, 그때는 확실히 나도 마음의 상처를 입긴 했지만……"
3301-16 = "그 이후에 세미나의 임원들이 확실히 문제점을 고쳤다고 하니 이번에는 걱정하지 않아도 괜찮을 거야."
3301-17 = "모두 야구를 즐기는 마음으로, 즐겁게 경기에 임하도록 하자."
3301-27 = "<쓰리 스트라이크…… 아웃!>"
3301-30 = "으아…… 또 헛스윙을 해버렸어."
3301-36 = "공이 너무 빨라~"
3301-45 = "<이어지는 다음 타석은…… 밀레니엄 야구부의 4번 타자, 노마사 레이.>"
3301-46 = "저 녀석은…… 이번에 야구부에 새로 입부한 신입생이잖아?"
3301-47 = "듣기로는 입부 테스트에서 무려 8푼의 타율을 기록하며 에이스의 자리를 차지했다고 하는데……"
3301-48 = "어떻게 공을 100개 중에 8개나 칠 수 있지? 대단하네……"
3301-49 = "에이, 선배들도 참. 그렇게 칭찬해 주시니 부끄럽네요. 헤헤……"
3301-50 = "레이 쨩, 앞에 봐. 앞에!"
3301-54 = "<와인드업—>"
3301-55 = "온다……!"
3301-67 = "쳤다—!"
3301-68 = "그 빠른 타구를 받아냈다고?"
3301-69 = "공이 엄청나게 높게 떴어!"
3301-70 = "설마, 이번 시즌 첫 홈런이 여기서……"
3301-74 = "<……플라이 아웃!>"
3301-76 = "하아………"
3301-77 = "<공수 교대. 수비진 위치로!>"
3301-80 = "……경기 끝. 모두 수고 많았어!"
3301-82 = "수고하셨습니다!"
3301-83 = "레이 쨩도 수고 많았어! 오늘은 정말 멋진 활약이었어."
3301-84 = "아닙니다. 선배님도 수고 많으셨습니다!"
3301-85 = "그나저나 진짜 아쉽다. 오늘이야말로 진짜 홈런을 볼 수 있을 줄 알았는데……"
3301-86 = "그러게. 아까 쭉 뻗은 타구를 쳤을 때는 분명 홈런이라고 생각했었어."
3301-87 = "말씀은 감사합니다만……"
3301-88 = "사실 공이 배트에 맞았을 때부터 홈런은 아닐 거라는 느낌이 들었었어요."
3301-89 = "타격감만으로도 홈런의 여부를 알 수 있는 거야?"
3301-90 = "아, 아뇨. 저도 홈런을 쳐 본 적은 없기 때문에 구체적으로는 알 수 없지만……"
3301-91 = "……홈런 특유의 '반짝!'하는 느낌이 없었다고나 할까요."
3301-92 = "으음, 잘 모르겠지만……"
3301-93 = "뭐, 아직 경기는 잔뜩 남아있으니까요."
3301-94 = "그보다, 앞으로 홈런을 치려면 무얼 더 신경 써야 좋을까요?"
3301-99 = "홈런을 잘 치는 요령이라면 역시…… 공의 발사각도가 아닐까?"
3301-100 = "날아가는 공은 수직 방향으로는 등가속운동을, 수평 방향으로는 등속직선운동을 하니까. 각도가 45도 방향일 때 최대 비거리 값을 가지거든."
3301-101 = "아니, 그건 중력의 영향만을 고려하는 진공 탄도 방정식이잖아."
3301-102 = "물체에 작용하는 외부력을 정확히 계산하려면 항력과 양력 모멘트도 함께 고려해야지."
3301-107 = "배트의 재질도 중요하지. 반발력이 크고 무게가 가벼울수록 더 빠른 스윙을 할 수 있으니까!"
3301-108 = "이번에 신소재개발클럽에서 개발한 신소재로 배트를 만들었더니 타격감이 좋아졌다는 연구 결과가—"
3301-109 = "안타는 못 치더라도 황금장방형으로 공을 던질 수 있다면—"
3301-116 = "역시 홈런을 치기 위해서는……"
3301-117 = "좀 더 강도 높은 근육 트레이닝이 필요한 게 아닐까요?"
3301-121 = "그, 근육 트레이닝……?"
3301-122 = "하지만 근육 트레이닝은…… 힘들잖아."
3301-127 = "애초에 밀레니엄 야구부는 트레이닝보다는 장비와 기록을 중시하는 이론파 동아리이고……"
3301-128 = "그…… 홈런을 치지 않아도 안타만으로도 충분히 점수는 낼 수 있잖아?"
3301-129 = "물론 경기의 승패만 두고 보면 홈런보다는 안타의 숫자가 더 중요할지도 모르지만……"
3301-134 = "그래도 역시, 저는 홈런이 치고 싶어요!"
3301-138 = "미안, 레이 쨩. 우리 야구부에는 그런 방면의 노하우가 부족하거든."
3301-139 = "부장인 나조차도 근육 트레이닝과는 거리가 먼 스타일이라. 장타를 치는 방법에 대해서는 이론적으로밖에 도와줄 수가 없어."
3301-140 = "역시 그런가요……"
3301-141 = "하지만 대신 전문가를 소개시켜 줄 수는 있지."
3301-142 = "혹시 트레이닝부라고 들어본 적 있어?"
3301-143 = "트레이닝부요……?"
3301-145 = "밀레니엄 피트니스 클럽"
3301-148 = "늦네요, 회원님……"
3301-149 = "이러다가는 근손실이 나고 말아요……?"
3301-154 = "……역시 어제 진행한 트레이닝에 질려 포기하신 모양이군요."
3301-155 = "부원도 늘어날 기미가 보이질 않고, 요즈음은 찾아오시는 회원님도 거의 없고……"
3301-156 = "아무래도 직접 외부에 나가서 부원 모집을 해야—"
3301-163 = "실례합니다. 혹시 여기가 트레이닝부인가요?"
3301-164 = "그렇습니다만……"
3301-165 = "아, 저는 밀레니엄 야구부의 노마사 레이라고 합니다."
3301-166 = "다름이 아니라 피지컬 트레이닝과 관련된 문제로 부장에게 상담을 받았는데……"
3301-167 = "피지컬 트레이닝……?"
3301-168 = "이곳에 오면 타율에 도움이 되는 근육을 기를 수 있다고 해서요."
3301-169 = "……근육!"
3301-170 = "아무래도 혼자 하는 운동으로는 한계가 있어서…… 과학적인 피지컬 트레이닝 코스를 갖추고 있다는 트레이닝부의 도움을 받고 싶어서요."
3301-171 = "다음 인터하이 시즌 전까지 체험 입부를 하고 싶은데…… 혹시 괜찮을까요?"
3301-175 = "아, 역시 이렇게 갑자기 찾아와도 곤란하시겠지요."
3301-176 = "다음 주에 다시 찾아올 테니, 그때 답변을 주셔도 괜찮—"
3301-178 = "당장 시작하죠!"
3301-179 = "네, 네……?"
3301-181 = "운동의 효과는 마음먹기에 따라 천지 차이로 달라지는 법!"
3301-182 = "근육을 키우고 싶어졌다면 조금도 지체할 틈이 없습니다!"
3301-183 = "지금 이 순간에도 당신의 근육 조직은 조금씩 줄어들고 있으니까요!"
3301-188 = "자, 바로 스쿼트! 10세트— 시작하겠습니다!"
3301-189 = "자, 잠깐만요, 선배! 아직 옷도 안 갈아입었다고요?!"
3301-197 = "(……그리하여 레이는 스미레와 함께 기나긴 특별 트레이닝을 시작하게 되었다.)"
