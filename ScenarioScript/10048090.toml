[translation]
10048090-1 = "제9화;이런 엔딩은 싫어"
10048090-2 = "와일드헌트 공터"
10048090-3 = "(미요가 특수교역부가 받았던 의뢰에 대해 아키라에게 전부 설명하는 동안…….)"
10048090-4 = "(해는 어느새 완전히 서쪽으로 넘어갔다.)"
10048090-5 = "그러니까 여러분은 와일드헌트 수장고에 있는 그림이 위작이라 생각하셨던 것이군요."
10048090-6 = "의뢰인으로부터 받은 것을 진품이라 생각했었고……."
10048090-7 = "……그런데 실상은 그 반대였던 것이군요."
10048090-8 = "예. 여러분의 것이 위작이었습니다."
10048090-9 = "저기, 그, 그런데, 뭔가 이상하지 않아요?"
10048090-10 = "저희의 의뢰인은, 대체 왜 이런 의뢰를 넣은 걸까요."
10048090-11 = "진품을 빼내서 자신에게 가져오라는 의뢰였다면 차라리 이해는 됐을 거예요. 물론 제 선에서 거절했겠지만."
10048090-12 = "그런데 의뢰인은 진품을 위작으로 바꿔치기한 뒤, 진품은 파기하라고 했어요."
10048090-13 = "……그것도 거액의 의뢰비까지 약속하면서요."
10048090-14 = "의뢰비는 의뢰비대로 쓰고, 진품은 손에 넣지도 못하고."
10048090-15 = "그 사람은 왜 이런 의뢰를 한 걸까요……?"
10048090-16 = "그야말로 아무런 이득도 되지 않는 일인데……."
10048090-18 = "세상에는 때때로 금전적 이득을 넘어서는 신념이나 가치, 혹은 욕망이 있답니다."
10048090-19 = "아마 그 의뢰인에게도 그러한 것이 있었던 것이겠지요."
10048090-20 = "……일단 저희가 이해할 수 있는 부류의 신념이나 욕망은 아니겠네요."
10048090-21 = "그런 것을 가지는 데에 꼭 타인의 동의가 필요한 것은 아니니까요."
10048090-22 = "저는 어느 정도 예측이 되긴 합니다만."
10048090-23 = "……?!"
10048090-24 = "여러분의 의뢰인은 위작을 전시회에 걸고, 수많은 사람들의 앞에 선보이고 싶어 했습니다."
10048090-25 = "그리고 그로부터 무언가를 확인하고 싶어 했을 겁니다."
10048090-26 = "위작을 진품으로 착각한 사람들을 보며 수준을 조롱하고 싶어 했거나……"
10048090-27 = "혹은 자신의 위작 제작 능력을 시험해 보고 싶어 했거나……."
10048090-28 = "악취미잖아……!"
10048090-29 = "혹시 저한테도 하는 말인가요?"
10048090-30 = "아니, 그, 그건……!"
10048090-31 = "어쨌든, 여러분의 원래 목적은 위작을 진품으로 바꿔놓는 것이었죠."
10048090-32 = "그 와중에 저를 이용해 위작을 빼내는 것까지 의도하셨고요."
10048090-34 = "……기, 기분 나쁘셨다면 죄송해요……."
10048090-35 = "아닙니다. 제가 평범한 사람이었다면 여러분이 저를 이용할 생각을 하지도 않았겠지요."
10048090-36 = "어디까지나 제가 도둑이니까 마음 편하게 그런 발상을 떠올린 것일 테고요."
10048090-37 = "그, 그게……."
10048090-38 = "불편해 마세요."
10048090-39 = "저도 제가 규정을 위반했다는 인식 정도는 있으니까요."
10048090-40 = "……그것을 알면서도, 그런 일을 계속하시는 건가요?"
10048090-41 = "예술품을 훔치는 것……."
10048090-42 = "그래요, 이것은 분명 규정에 어긋나는 일이지요."
10048090-43 = "하나 규정이라는 것이 반드시 옳은 것일까요?"
10048090-44 = "저는 그렇게 생각하지 않습니다."
10048090-45 = "규정이란 정체되기 쉬운 것이고, 따라서 시대에 뒤처지기 쉬운 체계이니……."
10048090-46 = "당장 여러분도 와일드헌트의 모든 교칙을 합당하다고 여기지는 않을 것 아닙니까?"
10048090-47 = "……확실히 우리 학원 교칙이 좀 글러 먹긴 했지."
10048090-48 = "쉿."
10048090-50 = "그렇기에 저의 행위는 규정 위반일지언정, 저는 그것이 그르다고는 생각하지 않습니다."
10048090-51 = "……오히려 규정이 저를 따라오지 못할 뿐이죠."
10048090-52 = "……."
10048090-53 = "저는 예술이 모두의 것이 되어야 한다고 생각합니다."
10048090-54 = "그렇기에 예술이 어느 개인의 소유가 되는 것에 반대합니다."
10048090-55 = "그래서 저는 예술품을 훔칩니다."
10048090-56 = "요컨대, 이것은 단순한 도둑질이 아닌 하나의 해방이지요."
10048090-57 = "그, 그렇다면 저도 한 가지 물어봐도 될까요?"
10048090-58 = "얼마든지요."
10048090-59 = "……그렇게 지금까지 해방한 예술품들, 지금 어디에 있죠?"
10048090-60 = "……유감스럽게도 아직 대부분의 사람은 예술품의 진정한 가치를 알아볼 수 없답니다."
10048090-61 = "예술품의 미학적 가치를 온전히 알아볼 수 있는 사람은 극소수지요."
10048090-62 = "하지만 저는 믿습니다."
10048090-63 = "세상 사람들의 미학적 안목이 충분히 무르익을 순간이 언젠가 오리란 것을."
10048090-64 = "……그날이 올 때까지, 저는 제가 훔친 예술품들을 안전하게 보관해 둘 겁니다."
10048090-69 = "사람을 믿지 않으시는군요."
10048090-70 = "그럼요."
10048090-71 = "하지만 그것은 피차 같지 않나요?"
10048090-72 = "선생님의 보증이 아니었다면, 여러분도 제 말을 믿지 않으셨을 거잖아요?"
10048090-73 = "그건……."
10048090-74 = "……근데 저 말은 결국 훔친 건 자기가 갖겠다는 얘기 아니야?"
10048090-75 = "쉿."
10048090-76 = "자, 그럼 이것으로 정리는 됐군요."
10048090-77 = "그렇다면 결론은 간단하네요."
10048090-78 = "……간단하다고요?"
10048090-79 = "저의 목적은 진품의 확보."
10048090-80 = "여러분의 목적은 의뢰비를 받아내는 것."
10048090-81 = "이 두 목적을 동시에 이룰 방법이 있습니다."
10048090-82 = "……말씀해 보시죠."
10048090-83 = "저의 도주 경로상에, 마치 제가 흘린 것처럼 위작을 놔두어 사감대가 수거하게 만드는 겁니다."
10048090-84 = "그러면 그림은 다시 전시회장에 걸릴 것이고, 일을 크게 벌이기 싫은 사감대는 진품 감정을 의도적으로 회피할 겁니다."
10048090-85 = "……그럼 진품은요?"
10048090-86 = "당연히 제가 가져가지요."
10048090-87 = "……."
10048090-88 = "염려하는 표정 짓지 마세요."
10048090-89 = "어차피 그것이 위작이라는 것을 알아볼 수 있는 사람은 없을 겁니다."
10048090-90 = "심지어 예술학도인 여러분들도 구별하지 못하셨잖아요?"
10048090-91 = "……!"
10048090-93 = "……할 말이 없네."
10048090-94 = "시간이 많이 늦었군요."
10048090-95 = "그럼 저는 이만."
10048090-96 = "……잠깐만요."
10048090-97 = "아뇨, 이미 시간은 충분히 소모했습니다."
10048090-98 = "그리고 선생님은, 다음에 뵙겠습……."
10048090-99 = "부탁을 하는 게 아니에요."
10048090-100 = "예?"
10048090-101 = "지금이에요."
10048090-102 = "'나무'."
10048090-104 = "나무?"
10048090-108 = "나무!"
10048090-119 = "[ns] \"나무가 쓰러졌다?!\""
10048090-120 = "(저 아이…….)"
10048090-121 = "(맨주먹으로 거목의 밑동을 부숴서 쓰러뜨리다니…….)"
10048090-122 = "(퇴로 차단과 무력시위를 동시에…….)"
10048090-123 = "하하, 이거 한 방 먹었네요."
10048090-124 = "응! 나는 우스바 리츠!"
10048090-125 = "거기서 이름을 밝혀 버리면 어떡해……!"
10048090-126 = "처음 뵙겠습니다! 괴도 쨩!"
10048090-127 = "괴도……쨩……?"
10048090-128 = "……후후, 예, 반가워요. 리츠 쨩."
10048090-129 = "그래서 지금 이것은, 협박인가요?"
10048090-131 = "제 이야기를 한 번만 들어달라고 요구하는 겁니다."
10048090-132 = "……지금의 이 상황은, 제가 써 내려간 판이에요."
10048090-133 = "제가 써 내려간 플롯이고, 제가 써 내려간 작전이고, 또……."
10048090-134 = "……제가 쓴 작품입니다."
10048090-135 = "물론 저는 밀수가 싫어요."
10048090-136 = "밀수의 계획을 세우는 것도 당연히 싫고……."
10048090-137 = "……하지만 소재가 마음에 들지 않는다 해서, 제가 쓴 작품의 엔딩을 이런 식으로 낼 수는 없어요."
10048090-138 = "찜찜함만 남긴 채, 무엇 하나 제대로 해결되지 않는 이런 마무리……."
10048090-139 = "결국 모두가 속아 넘어가고, 저희는 석연치 않은 의뢰비만 손에 넣게 되는 이런 흐리멍덩한 결말……!"
10048090-140 = "이런 건, 작가로서 용납할 수 없어요!"
10048090-145 = "그렇다면요?"
10048090-146 = "그 말은, 대안이 있다는 말씀이겠죠?"
10048090-147 = "예."
10048090-148 = "저는 결론을 정해놓지 않은 복선을 던지지 않아요."
10048090-149 = "그러니까 마지막으로 저의 제안을 들어주세요."
10048090-150 = "괴도님과 저희가 모두 납득할 수 있는……."
10048090-152 = "……내기를, 제안할게요."
