[translation]
13190-1 = "제19화;채권단 총회"
13190-3 = "프레지던트! 열차포의 은닉 장소, 거의 특정 완료되었습니다."
13190-4 = "오오, 정말인가? 어디 보게나……."
13190-8 = "여기서 약 480km 떨어진 사막횡단철도 노선이 지나가는 폐쇄지구입니다!"
13190-9 = "……아아. 과연."
13190-10 = "이런 식일 줄은 생각지도 못했는데……. 머리를 썼군."
13190-11 = "필요한 것들을 챙겨라. 특히 네프티스의 영애가 필요하다."
13190-13 = "알겠다."
13190-18 = "장소는 조금 더 정확도를 높여보도록. 그리고 거기까지 갈 이동 편도 준비하고."
13190-20 = "알겠습니다!"
13190-28 = "오오, 네프티스 그룹의 영애님이시군. 어서 오시게."
13190-29 = "……. 카이저 프레지던트……?"
13190-43 = "집사님……. 네프티스가 카이저와 손을 잡은 거였어요……?"
13190-44 = "하하하, 확실히 이해가 빠르군. 기업의 후계자라서 그런가."
13190-45 = "그래, 그 말이 맞다네."
13190-46 = "어떻게 그런……!"
13190-47 = "모든 것은 아비도스를 위해서였습니다!!"
13190-48 = "열차포를 손에 넣는다면, 그 <강력한 힘>만 있다면 아비도스를 부흥하는 것도 불가능이 아니……!!"
13190-49 = "그럴 리가 없잖아요!"
13190-54 = "보세요, 이 상황을 보세요, 집사님!"
13190-62 = "이런 걸 원하신 거예요……? 이런 대혼란을……?"
13190-63 = "그건……."
13190-64 = "호시노 선배의 말이 맞았어요. 우리가 목적을 이루기 위해 <이런 방식>에 익숙해지기 시작하면…… 우리는 우리 자신을 잃어버리게 되는 거예요……."
13190-66 = "아니, 그거야말로 아비도스답다고 생각하는데."
13190-67 = "……네?!"
13190-68 = "그 트리니티의 아가씨들조차도 과거엔 적들의 손톱을 뽑았다고 하더군. <그런 방식>이라는 건 과거엔 꽤 흔하게 있었을 거야."
13190-69 = "한때 가장 강력하고 가장 위대한 자치구였던 아비도스가 <그런 방식>을 쓰는 것에 저항감이 있었을 거라 생각하진 않아."
13190-70 = "그건……."
13190-74 = "프레지던트! 침입자입니다!"
13190-75 = "샬레인가?"
13190-76 = "아, 아뇨. 침입자는 1인입니다! 타카나시 호시노가 건물 내부로 진입했습니다!"
13190-78 = "호시노 선배……!!?"
13190-83 = "현재 시각 AM. 11 : 3X"
13190-85 = "호오, 지금 시간이……"
13190-86 = "이런이런. 12시까지는 30분이나 남았잖나. 제너럴은 대체 뭘 한 거지?"
13190-87 = "그런데 어째서 선배 혼자서……?"
13190-88 = "대책위원회와 샬레의 선생은 호시노와는 따로 움직이고 있어."
13190-89 = "아마 둘 다 원만한 협의를 이루지 못한 것 같군."
13190-90 = "……. 어째서. 선배……. 모두들……."
13190-94 = "두 번째 저지선 돌파……! 히, 힘들 것 같습니다."
13190-95 = "하아. 이것 참. 이래서야 우리들의 패배처럼 보이잖나."
13190-96 = "어, 어떡할까요?"
13190-97 = "열차포의 위치는?"
13190-99 = "……거의 끝나갑니다! 곧 정확한 좌표를 확정해 낼 수 있습니다!"
13190-101 = "교통편 준비는?"
13190-102 = "옥상의 헬리포트에 약 20분 뒤 헬기가 도착 예정입니다!"
13190-103 = "……좋아, 그럼 그때까지는 상대해 줘야겠군."
13190-109 = "좌표 확정! 지금 보고드리겠습니다."
13190-110 = "<아비도스 사막 폐쇄 지구 섹터 35-9>……? 여긴가, 열차포가 은닉된 장소가."
13190-114 = "현재 시각 AM. 11 : 4X"
13190-116 = "하아…… 하아……."
13190-117 = "호시노 선배……!!"
13190-118 = "(섹터 35-9……?)"
13190-119 = "늦어서 미안해. 노노미 쨩…… 괜찮아?"
13190-120 = "네…. 저는……."
13190-133 = "……. 카이저 코퍼레이션."
13190-136 = "직접 보는 건 처음이군, 타카나시 호시노. 내가 바로 카이저의 총수를 맡고 있는 몸일세."
13190-137 = "네 소식은 카이저 이사를 통해 건너 듣기는 했었지. 그 검은 양복이 노리던 인재였다고?"
13190-138 = "……이 상황은 뭐야? 채권단 총회는 아직 유효한 거야?"
13190-139 = "아아. <사모펀드>의 대표는 좀 전에 나로 바뀌었다네. 총회의 개최 권한도, 폐회 권한도 모두 내가 가지고 있지."
13190-140 = "……아아, 그래. 지금 시간이 12시가 넘지 않았으니…… 자네는 적법한 공증을 할 자격이 있다네."
13190-141 = "……."
13190-142 = "서론이 길었군. 그럼 채권단 총회의 개시를 선언하지."
13190-143 = "지금부터 아비도스 DLB 채권의 채권단 총회 개시를 선언한다."
13190-150 = "이 총회에서 공증할 것이 있나, 타카나시 호시노?"
13190-158 = "여기서 <아비도스 학생회>의 정통성을 부정하면 노노미를 풀어주기로 했었어."
13190-159 = "하지만……."
13190-165 = "그건 지금도 유효한 거야?"
13190-166 = "아니, 당연히 그렇지 않다네. 자네가 그런 공증을 해버리면 열차포의 소유권이 네프티스에게 넘어가게 될 테니까."
13190-167 = "그건 곤란하지 않겠나."
13190-168 = "……."
13190-169 = "자네가 노노미를 무사히 돌려받고 싶다면, 여기서 계약을 <종결>한다는 공증을 해주게나."
13190-170 = "그래야 <사모펀드>의 대표인 내가 열차포를 소유할 수 있지."
13190-171 = "……."
13190-173 = "아뇨!! 선배! 네프티스도, 카이저도 열차포를 가져서는 안 돼요!!"
13190-174 = "유메 선배를 부정하지 마세요, 계약을 승계해야 해요, 선배……!!"
13190-179 = "오호, 이런이런. 그렇다고 하는군. 어떻게 하겠나?"
13190-181 = "아뇨, 안 됩니다!"
13190-182 = "카이저 같은 놈들이 그 힘을 가질 바엔 저희 네프티스가 소유하는 것이 맞아요!"
13190-183 = "자아, 현명한 선택을 해 주십시오! 제발! 아비도스의 미래를 위해서!"
13190-185 = "집사님……!!"
13190-186 = "잊지마십시오, 영애님의 인질의 가치는 어디까지나 하이랜더 학원으로의 강제 전학이었어요!"
13190-187 = "따라서, 그것은 저희가 있는 이상 언제든지 가능합니다……!! 그러니……."
13190-192 = "그럼 저는 아비도스를 자퇴하겠어요!!"
13190-199 = "그럼 된 거죠? 저는 더 이상 인질로서의 가치가 사라졌어요!!"
13190-200 = "그러니까, 선배!! 저를 지키기 위해서 애쓰지 않아도 돼요! 저는 이미……!"
13190-201 = "…… 걱정하지 마. 노노미 쨩. 자퇴 같은 건 하지 않아도 돼."
13190-202 = "네……?"
13190-203 = "나는 열차포를 이대로 넘길 생각 따윈 전혀 없으니까."
13190-204 = "호시노 선배? 서, 설마……?"
13190-208 = "……계약의 주체인 <아비도스 학생회>의 부학생회장으로서 공증합니다."
13190-209 = "사실 쿠치나시 유메와 타카나시 호시노의 학생회는 어떠한 정통성도 없는 비인가 조직이었다는 것을 자백합니다."
13190-210 = "……!!"
13190-215 = "……!!"
13190-216 = "따라서 학생회장 자격이 없는 쿠치나시 유메가 작성한 계약서는 원천무효라는 사실을 여기서 공증합니……."
13190-220 = "잠깐 기다려요-!!!"
13190-225 = "현재 시각 AM. 11 : 5X"
13190-229 = "[ns] \"그래, 그 발언은 무효야!\""
13190-231 = "모, 모두들……!"
13190-233 = "네! 그 공증은 무효입니다. 호시노 선배에게는 <아비도스 학생회>의 대표 자격이 없으니까요!"
13190-234 = "으, 으엥……?!"
13190-235 = "왜냐면 제가 바로 <아비도스 학생회>의 학생회장이니까요!"
13190-236 = "으, 으헤……? 하, 학생회장……? 아야네 쨩이……?!"
13190-238 = "[ns1] \"맞아. 아야네가 새로운 학생회장으로 당선됐어.\"\n[ns2] \"내가 그 증인이야.\""
13190-241 = "[ns] \"아야네는 정당한 투표로 선출된 정식 학생회장님이야.\""
13190-242 = "서, 선생님……? 모두들? 대, 대체……."
13190-243 = "응. 우리가 아야네를 학생회장에 투표했어."
13190-244 = "그렇게 됐어, 호시노 선배. 그러니 독불장군 짓은 여기서 끝이야."
13190-248 = "……."
13190-249 = "그리고 선배는 부학생회장에서 서기로 강등됐어요!!"
13190-250 = "별 볼 일 없는 서기 주제에 학생회장의 허락도 없이 독단적으로 사고를 치다니……. 용서할 수 없습니다!"
13190-252 = "(자기 직책을 별 볼 일 없다고 했어……?!)"
13190-254 = "호시노 선배는 유메 회장을 부정할 수 없습니다! 왜냐면 저희가 바로 유메 회장이 진짜라는 증거니까요!"
13190-255 = "저희는 유메 회장의 학생회 직속 후배이며, 대책위원회가 바로 <아비도스 학생회>의 존재 증거입니다!!"
13190-256 = "……."
13190-258 = "아야네 쨩……."
13190-260 = "그러니 유메 선배의 매매계약서는 정당한 학생회인 대책위원회가 이어갈 겁니다! 이 사실을 여기서 공증합니다!"
13190-266 = "[ns] \"그리고 퇴부는 내 허락 없이는 통과되지 않아. 노노미.\""
13190-268 = "[ns] \"예전에도 그랬다는 걸 잘 알고 있으면서.\""
13190-269 = "선생님……."
13190-273 = "현재 시각 AM. 12 : 0X"
13190-275 = "과연……. 이렇게 나왔나."
13190-276 = "이런 식으로 샬레를 상대하는 것은 애초에 불가능했던 걸지도 모르겠군."
13190-277 = "뭐, 상관없어. 처음부터 시간 때우기였으니까."
13190-281 = "[ruby=・]장[/ruby][ruby=・]난[/ruby]은 끝이다. 총회는 여기서 폐회하도록 하지."
13190-289 = "[ns] \"뭐라고!\""
13190-294 = "나는 이 총회에서 그 어떤 것도 공증하지 않았고, 어떤 발언도 공증으로 인정한 적 없다네."
13190-295 = "무, 무슨……?!"
13190-296 = "……!!"
13190-298 = "즉, 너희들의 노력은 처음부터 무의미했다는 거지."
13190-303 = "이 매매계약서는 체결된 지 2년이 지나버렸기 때문에 효력을 잃어버렸군. 폐기한다."
13190-310 = "즉, 열차포는 처음부터 카이저의 것이었다. 단 한 번도 그 소유권이 바뀐 적이 없어."
13190-311 = "[ruby=・]지[/ruby][ruby=・]금[/ruby][ruby=・]부[/ruby][ruby=・]터[/ruby] [ruby=・]그[/ruby][ruby=・]런[/ruby] [ruby=・]것[/ruby][ruby=・]으[/ruby][ruby=・]로[/ruby] [ruby=・]해[/ruby][ruby=・]두[/ruby][ruby=・]겠[/ruby][ruby=・]네[/ruby]."
13190-312 = "무, 무슨 그런 억지를!!"
13190-317 = "(소곤소곤) ……헬기가 곧 도착합니다."
13190-321 = "여기에 있는 녀석들은 모두 처리해라. 사모펀드, 네프티스, 아비도스 전원 다."
13190-328 = "그리고 우리는 지금부터 열차포의 은닉처로 이동한다. 아, 그리고 네프티스의 영애는 필요하니 데려간다."
13190-338 = "기다려!!"
13190-345 = "호시노 선배!! 노노미!"
13190-348 = "자, 잠깐만! 시로코 선배, 뒤쪽에서도 적들이 몰려오고 있어!"
13190-350 = "선생님, 노노미 선배가 이대로라면 끌려가 버려요! 호시노 선배가 구하려고 하고 있지만……"
13190-351 = "두 사람 다 구해야 해요! 지휘를 부탁드립니다!"
