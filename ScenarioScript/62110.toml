[translation]
62110-1 = "11화;제자들"
62110-3 = "처, 천사다!"
62110-4 = "<계시록의 천사>야! 그것도 둘……!"
62110-5 = "나팔 소리, 몇 번째였지?"
62110-6 = "기다려 봐…… 아마 다섯 번째와 여섯 번째였던 것 같은데?"
62110-7 = "그러면, 남은 건……?"
62110-8 = "……."
62110-9 = "자, 잠깐! 저 천사들, 이쪽으로 오는데?!?!"
62110-13 = "으아아아아아아악?!"
62110-19 = "!!!"
62110-20 = "처, 천사가 우리 애들을 공격하는데요……?"
62110-21 = "정말로…… 정말로, 그랬던 거였을까요?"
62110-22 = "우이 씨와 시미코 씨가, 이야기했던 것처럼……?"
62110-25 = "나팔 소리를 들은 집단과 그렇지 못한 집단 사이에…… 어떤 공통되는 구분선이 있었던 것 같긴 하네요……."
62110-26 = "그건, 선생님의 수업입니다."
62110-28 = "제가 보기에, 나팔 소리를 들었던 학생들…… 즉, 계시록대로라면 '세계 멸망의 징조'를 포착했던 사람들은."
62110-29 = "'새로운 사고방식'에 저항감이 적었던 학생들이었을 거예요."
62110-31 = "그 아이들도 늦든 빠르든, 여기 이분처럼……."
62110-32 = "기존의 아리우스를 바꾸고 싶지 않아 하는 학생들에게, 언제든 '적'으로 몰릴 수 있다는 뜻이겠죠."
62110-34 = "정말로 그런 것이든 뭐든, 이대로 두고 볼 수는 없잖아……!"
62110-35 = "그래. 이 아이들도 모두 우리 학교 학생들이니까."
62110-40 = "괘, 괜찮을까요……? 예전에도 엄청나게, 버거웠는데……."
62110-41 = "네……. 지금은 구호기사단 분들도, 안 계시는데……."
62110-42 = "……하지만 천사의 숫자 역시 절반이다. 해 보자."
