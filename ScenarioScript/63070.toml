[translation]
63070-1 = "제7화;시도하기"
63070-2 = "……낯선, 천장이군요."
63070-3 = "아뇨. 정말로요."
63070-7 = "안녕하세요, 스바루 씨! 오후 검진 왔습니다."
63070-11 = "죄송해요. 오전에는 아무래도 수업이 있다 보니……."
63070-12 = "수업, 이군요. 네……."
63070-13 = "그게, 정상이겠죠."
63070-14 = "……."
63070-18 = "구호기사단 병실은, 어떠세요?"
63070-19 = "……좋네요. 이렇게 좋은 시설은, 본 적도 없었을 정도로요."
63070-20 = "덕분에 다들 빠르게 낫고 있는 모양이고요."
63070-21 = "슬슬 좀이 쑤시는데~"
63070-22 = "그냥 우리 퇴원하면 안 되나……."
63070-23 = "안 돼요, 여러분! 적어도 단장님께서 완전 퇴원 허가를 내리시기 전까지는 참아 주셔야 해요!"
63070-24 = "다 나았다고 생각할 때가, 오히려 위험한 법이랍니다?"
63070-25 = "네. 저렇게 말이죠."
63070-26 = "……."
63070-30 = "저, 스바루 씨?"
63070-31 = "네?"
63070-32 = "저희가……. 밉거나 하지, 않으신가요?"
63070-33 = "갑자기 무슨 말씀이시죠? 저희를 치료해 준 분들을……."
63070-34 = "……."
63070-35 = "그런 이야기, 말씀이시군요."
63070-36 = "네……."
63070-38 = "(……그날.)"
63070-39 = "(천사의 나팔소리가 멈추었던 날.)"
63070-40 = "(게헨나의 응급의학부와 트리니티의 구호기사단.)"
63070-41 = "(그리고 다른 많은 학생이…… 아리우스 분교를 찾았다.)"
63070-64 = "(우리는 공교롭게도 트리니티의 구호기사단 본관으로 후송되었고…….)"
63070-65 = "(지금까지 이곳에서 쭉, 치료를 받으며 회복을 기다리는 중이다.)"
63070-67 = "……트리니티와 게헨나의 도움을 받았다는 사실에, 아직 혼란스러워하는 학생들도 있습니다."
63070-68 = "물론 저희가 함부로 이야기할 수 있는 입장이, 더 이상 아니기는 하지만……."
63070-69 = "조금만 더, 생각과 마음을 정리할 시간을 더 주셨으면 합니다. 죄송합니다."
63070-73 = "아, 아뇨! 오히려 저희가……."
63070-74 = "네."
63070-75 = "그런 문제와는 별개로."
63070-76 = "저희를 돌보아 주신 부분에 대해서는, 다시 한번 감사드립니다."
63070-80 = "처, 천만에요!"
63070-82 = "서로 괜찮냐고 물어야 하는 상황인 듯합니다만, 괜찮으십니까?"
63070-83 = " 저는, 괜찮습니다. 하지만 미네 씨는……."
63070-84 = "저에 대한 것은 걱정하지 마십시오. 부족한 몸입니다만, 이래 봬도 구호기사단의 단장을 맡고 있는 몸입니다."
63070-85 = "……그날, 미네 씨에게 무슨 일이 있었던 건가요?"
63070-86 = "네?"
63070-87 = "아, 그날 말이군요."
63070-88 = "……."
63070-89 = "저는 단지, 사람들을 지켰을 뿐입니다. 그것이 전부입니다."
63070-90 = "그리고 이렇게 당신들과 다시 마주 볼 수 있게 되어서, 진심으로 기쁘군요."
63070-91 = "……오히려 제가 거꾸로 여쭙고 싶은 부분입니다만, 스바루 씨야말로 아리우스의 일원으로서……."
63070-92 = " 네. 솔직하게 말씀드리자면, 마음속에 아무 감정이 일어나지 않는다고 하면, 거짓말이겠지요."
63070-93 = "……."
63070-94 = "하지만…… 일단은 이 감정을 품고, 어떻게든 살아 보려 합니다."
63070-95 = "이 감정이 오히려 커질 수도 있고, 서서히 가라앉거나 모두 불태운 끝에 재만 남을 수도 있겠지만……."
63070-96 = "……그렇다고 안 살 수는 없는 일이니까요."
63070-97 = "그렇군요. 그 굳센 마음가짐, 저에게도 많은 공부가 됩니다."
63070-98 = "네. 공부……."
63070-103 = "그렇다면 이제부터는, 모의고사 공부 시간입니다!!!"
63070-104 = "네?! 갑자기요?!?!?!"
63070-105 = "정신 차리십시오, 여러분! 이제 모의고사가 정말로 얼마 남지 않았습니다!"
63070-106 = "심신이 안정되었다면 이번에야말로 시험 준비에 몰두하는 것! 그것이 올바른 학생의 자세가 아니겠습니까!"
63070-107 = "저희 구호기사단 역시, 구호 활동에 전념해야 하는 몸이지만……."
63070-108 = "그럼에도 구호와 공부를 병행하는 것으로, 구호기사단이라는 동아리의 가치를 입증해야 할 의무 역시 가지고 있습니다!"
63070-109 = "그렇지 않습니까, 여러분!"
63070-110 = "네, 단장님!"
63070-111 = "후훗. 좋군요."
63070-112 = "그러면, 스바루 씨. 그리고 다른 모든 분."
63070-113 = "시험, 힘내시길 바랍니다."
63070-117 = "이야기 잘하다가 왜 결론이……."
63070-118 = "공부인가아……."
63070-119 = "역시 하기 싫은데에……."
63070-120 = "……사실 저도 그렇긴 해요……."
63070-121 = "저는 그래도 해 보고 싶어요!"
63070-122 = "기운이 넘치는군요……. 이번은 제가 배워야 할지도요……."
63070-128 = "어라? 저건……?"
63070-137 = "네……. 여기까지. 아리우스식 [ruby=CQB]근접전투사격술[/ruby]의 기초는 대충 이 정도입니다."
63070-138 = " 물론 근접전투 상황에 들어가지 않는 것이 최선이겠지만, 현장에서는 모든 가능성이 일어날 수 있으니까요."
63070-139 = "와아아……."
63070-140 = "멋있어……!"
63070-144 = "어, 어어? 이렇게까지, 박수를 받을 줄은……."
63070-145 = "……아리우스에서는, 잘 못하면 알게 될 때까지 '몸으로' 학습받았는데……."
63070-146 = "저, 저기! 그…… 근접? 전투사격술? 말인데요……. 우리에게도 가르쳐 줄 수 있나요?"
63070-147 = "네? 하, 하지만 여러분은 굳이……."
63070-148 = "혹시 모르잖아요! 말씀해 주신 대로요!"
63070-150 = "저는 아가씨라고 해도, 근접 총기 호신술은 필수인 시대가 되었다고 생각해요!"
63070-152 = "맞아요! 아가씨라도…… 아뇨. 아가씨일수록 더더욱!"
63070-153 = "자기 몸은 자기가 지키고, 무례한 분들에게는 예의를 전수해 드려야죠!"
63070-154 = "네! 바로 그것이에요!"
63070-158 = "괜찮은 걸까요, 트리니티……."
63070-159 = "어쩌면 우리는, 말도 안 되는 것을 깨워 버린 걸지도……."
63070-160 = "이렇게 된 이상, CQB 연구부 동아리를 만들자고 건의해 볼까요?"
63070-161 = "좋은 생각이네요! 그러면 부장과 부부장은……."
63070-162 = "당연히 가장 전문가이신 분들이 하셔야죠!"
63070-166 = "맞아요! 부탁드릴게요!"
63070-171 = "저, 저희가요?! 그렇지만 그런 대단한 일, 감히……."
63070-172 = "으, 으아아……."
63070-173 = "괜찮아요! 뭔가 익숙하지 않거나 어려운 일이 있으시다면, 언제든지 도와드릴게요!"
63070-174 = "여러분! 모두 다시 한번 박수 주세요!"
63070-178 = "……자, 잘 부탁드립니다아……."
63070-179 = "이게 또 이렇게 되네……."
63070-181 = "저…… 선배?"
63070-182 = "네? 무슨 일인가요?"
63070-183 = "……."
63070-184 = "우리도, 할 수 있을까요?"
63070-185 = "……지금까지와는 조금 다른 방향이겠지만……"
63070-190 = "우리의 새 둥지를, 만들 수 있을까요?"
63070-191 = "……."
63070-192 = "해 봐야죠."
63070-194 = "저는, 뭘 하고 싶었던 걸까요."
63070-195 = "\"너의 아리우스를 지키려고 했지.\""
63070-197 = "이럴 줄 알았다면, 차라리 아무것도 하지 않았을 텐데……."
63070-198 = "\"그렇지 않아.\""
63070-199 = "\"시도한 것만으로도, 자격이 있어.\""
63070-201 = "\"노력해도 뭔가가 바뀌지 않을 수 있고.\""
63070-202 = "\"실패하거나, 오히려 일이 더 안 될 수도 있지.\""
63070-203 = "\"하지만, 생각해 봐.\""
63070-204 = "\"정말 밑바닥이라면, 올라갈 일밖에 없는 거잖아?\""
63070-206 = "결과가, 어떻게 되든 간에요."
63070-208 = "다음화;티 타임"
