[translation]
1300503-1 = "사무실 청소"
1300503-2 = "흥신소 68 사무실"
1300503-11 = "응……? 선생이잖아?"
1300503-12 = "생각보다 일찍 도착했네."
1300503-13 = "이렇게 일찍 도착할 줄 알았으면 사무실 청소는 더 늦은 오후에 할 걸 그랬나……."
1300503-14 = "[s] \"다른 멤버들은?\""
1300503-15 = "다른 사원들은 아직 출근하지 않았어. #n어제는 새벽 늦게까지 의뢰가 있었거든."
1300503-16 = "……나? 나는 괜찮아. #n아침잠이 없는 편이라서."
1300503-17 = "그래서 이렇게 홀로 일찍 출근하는 날에는 가끔씩 사무소 정리를 하곤 해."
1300503-18 = "다 같이 함께 청소하는 편이 훨씬 더 빠르지 않느냐고?"
1300503-19 = "그야 물론 그렇지만……."
1300503-20 = "굳이 청소를 하자고 이야기를 꺼내면 생색을 내는 것 같고…… #n무엇보다 귀찮잖아."
1300503-21 = "아루나 하루카도 어지러진 물건 정도는 가끔 치워주는 것 같고, 청소할 것도 많지 않은 걸."
1300503-22 = "귀찮은 일은 남에게 손 벌리지 않고 혼자서 처리하는 게 편해."
1300503-23 = "[s] \"청소, 도와줄게.\""
1300503-24 = "……선생, 내 말 안 듣고 있었지?"
1300503-25 = "이건 흥신소의 일이니까 선생과는 관계가 없어."
1300503-26 = "아니면 내게 계속 빚을 지워서 난처하게 만들 셈이야?"
1300503-27 = "하고 싶어서 하는 일이니 마음에 담아두지 말라고?"
1300503-28 = "하지만……."
1300503-29 = "아니, 이런 걸로 말싸움을 하는 것도 우스운가."
1300503-30 = "타인과 얽히는 일에는 발을 들이지 않지만, 다른 사람 쪽에서 먼저 얽혀오는 건 피하지 않는 주의니까."
1300503-31 = "마치 이 흥신소의 일처럼 말이지, 후후."
1300503-34 = "자, 그럼 무거운 짐을 옮기는 건 선생에게 맡길게."
1300503-36 = "이후, 카요코와 사무실을 깨끗이 청소했다."
