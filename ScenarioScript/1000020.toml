[translation]
1000020-1 = "엄청나게 귀중하고 중요한 것"
1000020-2 = "(그렇게 아루의 연락을 받아 도착한 곳은, 한눈에 보기에도 제법 비싸 보이는 고급 레스토랑이었다.)"
1000020-4 = "[ns] \"저기……. 아루 정말 괜찮겠어? 여기 엄청 비싼 곳 같은데.\""
1000020-5 = "후후후, 뭐야. 선생님."
1000020-6 = "여기서 그렇게 겁을 집어먹어서야 우리 흥신소의 차기 경영 고문이라고 할 수 있겠어?"
1000020-7 = "좀 더 여유를 가지고, 흥신소의 격에 맞게 태도를 갖추는 게 좋다고?"
1000020-8 = "[s] \"아니, 경영 고문이라면 이런 걸 신경 쓰지 않을까.\""
1000020-9 = "아, 그, 그, 그래? 그, 그렇구나~"
1000020-10 = "선생님은 경영 고문으로서 늘 흥신소의 건전한 재정을 염두에 두고, 우리를 신경 써주고 있었던……."
1000020-11 = "……게 아니라!"
1000020-12 = "크, 크흠! 그거라면 진짜 괜찮으니까!"
1000020-13 = "[s] \"괜찮아?\""
1000020-14 = "응, 오늘만큼은 전혀 걱정할 필요 없어!"
1000020-15 = "그렇지 않아도 마침, 바로 어제 꽤나 큰 건수의 의뢰를 성공시키고 보수도 잔뜩 받은 참이거든~♪"
1000020-16 = "[s] \"앗, 과연.\""
1000020-17 = "흠흠, 이것도 전부 선생님 덕분이야."
1000020-18 = "언제, 어디에서나, 그 어떤 상황에서도 시의적절하게 내려주는 충고와 조언……."
1000020-19 = "어른의 시야를 통해, 어떻게 조직을 이끌어 나가면 좋을지. 선생님에겐 늘 감탄하며 배우고 있다고?"
1000020-20 = "응! 역시 우리 흥신소의 미래 경영 고문다워!"
1000020-21 = "[s1] \"이거 참, 아루가 그렇게까지 말해주니 부끄럽네~\"\n[s2] \"……그 정도로 엄청난 일, 했었던가?\""
1000020-22 = "자아, 자잘한 이야기는 이쯤 해두고."
1000020-23 = "자아, 자잘한 이야기는 이쯤 해두고."
1000020-24 = "오늘은 내가 한턱낼 테니, 사양 말고 마음껏 즐겨도 돼!"
1000020-25 = "[s] \"뭐, 아루가 그렇게까지 말한다면야…….\""
1000020-27 = "(그리하여 아루와 조금은 사치스럽지만, 즐거운 식사를 함께하게 되었다.)"
1000020-35 = "……해서 우리 흥신소가 현장에 들이닥치자마자 의뢰인이 말했던 블랙마켓의 항쟁 조직과 맞닥뜨렸어."
1000020-36 = "[s] \"과, 과연! 그래서?!\""
1000020-37 = "후후후…… 내가 누구야? 선생님. 나 리쿠하치마 아루야말로 흥신소의 진정한 리더이자, 키보토스의 진정한 무법자……."
1000020-38 = "나는 마주친 상대를 향해 이렇게 말했어."
1000020-39 = "<당신네에게 딱히 악감정은 없어. 단지 우리와 마주친 게 운이 없었을 뿐.>"
1000020-40 = "<무법자와 만난 걸, 지옥에 가서 후회하도록……!> 이라고 말이지!"
1000020-41 = "[s] \"그야말로 하드보일드……!\""
1000020-42 = "그치?! 선생님도 그렇게 생각하지~?!"
