1000020-111 = "으으, 그래도 보이질 않는다니……."
1000020-112 = "아! 호, 혹시 우리의 시야가 좁은 탓에…… 어쩌면 중요한 것을 못 보고 지나치고 있는 걸지도 몰라……!"
