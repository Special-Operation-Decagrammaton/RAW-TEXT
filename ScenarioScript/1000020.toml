1000020-44 = "후후, 후후후후! 후후후……!"
1000020-45 = "아, 즐겁게 이야기를 나누다 보니, 벌써 이런 시간이네……."
1000020-46 = "그럼 대충 식사도 마친 것 같고…… 슬슬 나갈까? 선생님?"
1000020-47 = "그, ……아직 못다 한 이야기 중에 좀 더 선생님에게 들려주고 싶은 이야기가 있긴 한데……."
1000020-48 = "[s] \"응 그거라면 좀 더 듣고 싶은걸.\""
1000020-49 = "그, 그래?"
