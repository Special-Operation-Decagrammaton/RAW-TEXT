1000020-95 = "아…… 그게, 생김새라면 이렇게, 붉은색 계열로 고급스러운 느낌이 드는 물건인데……."
1000020-96 = "어떤 물건이냐고 묻는다면 그게 또 무척이나……. 중요한 물건이라고나 할까."
