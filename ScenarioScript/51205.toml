[translation]
51205-5 = "방송 장비의 세팅도 대충 완료되었고……"
51205-9 = "여기서 본격적으로 필요한 준비라면……."
51205-14 = "어라? 전화가…… 상대는, 음양부?"
51205-18 = "으음……? 바로 끊겼네."
51205-19 = "특별히 볼일이 있었던 건 아닌, 건가……?"
51205-23 = "피나! 우미카. 일단 이곳 무대 정리는 둘에게 맡길게! 나는 방송용 기재를 확인하러 가볼 테니까!"
51205-25 = "네! 부장! 맡겨 주시면 멋지게 해내겠습니-다!"
51205-26 = "사장님의 기대에 부응하는 완벽한 무대를 준비하겠어요!"
51205-28 = "그러니까 사장님이 아니라-!"
51205-29 = "으아 음~~ 하여간!"
51205-33 = "그럼 다녀올게!"
51205-38 = "그럼 우미카! 자정이 되기 전에 필살 정리를 시작하는 겁니다!"
51205-39 = "네! 피나!"
51205-45 = "이곳에서 드디어 시작되는 거네요."
51205-46 = "20년 전, 저희 카데노코지에서 미처 이루지 못했던 일을 다시금……."
51205-47 = "아아, 감격스러워라. 그래요. 이것이 저희 카데노코지가 나아가야 할 올바른 방향이에요!"
51205-48 = "그러고 보면 20년 전."
51205-52 = "당시 폐지되었던 그날의 축제에서도 저희 카데노코지가 춤을 출 예정이었다고 하셨지요."
51205-53 = "하지만 끝내 그것을 추지 못한 채로, 축제가 흐지부지되고야 말았다고 들었사와요."
51205-54 = "그때에는 왜, 그렇게 된 것이어요?"
51205-55 = "아, 그것이……. 외부에는 밝히기가 다소 부끄럽다고 할지. 섣불리 말하기가 어렵다고 할지……."
51205-56 = "소녀가 이 자리에 선 만큼, 그 정도는 들을 자격이 있다고 생각하여요."
51205-57 = "……으음, 그렇네요."
51205-58 = "이렇게 장성한 아가씨께서 나와주시기도 하셨고, 지나간 옛일이니 이제는 괜찮을까요?"
51205-60 = "20년 전 그날, 아가씨의 말씀대로 그때에서도 저희 카데노코지는 축제의 제의를 담당하기로 되어 있었답니다."
51205-61 = "하지만 바로 당일. 행사가 진행되는 바로 그 순간."
51205-64 = "정작 행사를 담당하기로 했던 무녀님께서는 끝내 자리에 나타나지 않았답니다."
51205-67 = "제의를 담당하기로 했던 것에 대한 중압감 때문인지."
51205-68 = "……아니면 그 전부터 계속해서 집안사람들과 빚어오던 갈등 때문인지."
51205-69 = "아니, 이미 오래전에 지나가 버린 옛일. 그 사정과 이유는 이제는 알 수가 없겠지요."
51205-70 = "그래도 확실한 건, 그날을 기점으로…… 당대의 무녀님은 자취를 감추고 사라져 버렸다는 거예요."
51205-72 = "그렇다는 건……"
51205-73 = "네, 그것은 참으로……."
51205-75 = "참으로 가문에게 실례가 되는 행동. 불명예 그 자체였답니다."
51205-79 = "……불명예……?"
51205-80 = "아아, 그래도 이젠 괜찮지요."
51205-81 = "그 불명예를 20년이 지난 오늘에서야 유카리 아가씨께서 전부 날려주실 테니까. 그렇지요?"
51205-82 = "……그뿐, 인가요?"
51205-83 = "네?"
51205-84 = "제가 무대에 서는 이유는, 그저……."
51205-89 = "아쵸옷! 무대의 정리가 끝났습니다!"
51205-90 = "네! 이대로 올라주시면 되어요!"
51205-92 = "아, 벌써 이렇게……"
51205-93 = "유카리 아가씨! 부탁드리겠습니다! 이대로 카데노코지의 명예를 다시!"
51205-94 = "20년 전의 불명예를 설욕할 수 있도록 부디……! 멋진 <춤>을 보여주시길!"
51205-101 = "(처음부터 소녀가…… 저 유카리가 집안으로 돌아와 주었으면 했던 이야기는.)"
51205-102 = "(카데노코지의 무녀로서 저를 필요로 했던 건, 단지…….)"
51205-103 = "(그저 그날, 20년 전에 일어난 치욕을, 불명예를 설욕하기 위해……?)"
51205-104 = "(그것만을 위해서라면 대체, 어찌하여………)"
51205-105 = "……어찌하여 소녀는……."
51205-107 = "이곳에 있는 건가요?"
51205-111 = "그 마음, 이해가 되어요."
51205-117 = "필요하다고 말할 때는 언제고, 결국 그들이 필요로 했던 건 20년간이나 묵혀온 카데노코지의 불명예. 그 억울함을 씻어내 줄 누군가일 뿐."
51205-118 = "아무도, 아무도 당신에 대해서, 당신이 어떤 마음을 가지고 있는지. 어쩐 일로 괴로워하는지. 그 누구도 관심이 없는 거네요."
51205-120 = "아아, 비참하여라. 괴로워라. 억울하여라."
51205-126 = "그렇다면 당신의 그 마음."
51205-128 = "[log=???][ff4444]<그 「감정」 그대로 돌려주고 싶다고 생각하지 않나요?>[-][/log]"
51205-132 = "나는────"
51205-135 = "풍문이 들려온다───"
51205-137 = "다음화;그럼에도 당신에게"
