[translation]
90100040-1 = "Episode 4;A New Base"
90100040-2 = "Schale Basement Hallway"
90100040-4 = ""
90100040-5 = "Um, we didn't mind walking with you to Schale after the meal, but..."
90100040-6 = "...Where are we, exactly?"
90100040-7 = ""
90100040-9 = ""
90100040-10 = ""
90100040-11 = "This is my second time inside Schale...but I've never seen this area before."
90100040-12 = "Yeah. We were a little busy storming the building last time..."
90100040-13 = "[s1] \"Sorry, it's a bit dark here.\"\n[s2] \"It's an underground area we rarely use. Follow me, please.\""
90100040-16 = "I'm accustomed to working in the dark."
90100040-17 = "That said, that was a lot of stairs. Just how deep is Schale's basement?"
90100040-18 = "[s] \"I'm not sure. I never checked...\""
90100040-19 = ""
90100040-21 = "[ns] \"Since it can store a tank, it's at least three floors deep, I guess?\""
90100040-22 = "You manage this building and don't even know its capacity?"
90100040-23 = "Maybe I should have studied the layout more thoroughly during our last infiltration..."
90100040-24 = "Or I suppose Sensei is just too busy to look into those things?"
90100040-25 = "...You know, I've read about this place. I think it was online."
90100040-26 = "Deep in Schale's basement, Sensei locks up bad students and delivers lewd and unusual punishments..."
90100040-27 = "...Understood. If we need to interrogate a hostage, this place would be perfect. It has solid security and would be impossible to escape."
90100040-28 = "D-Don't you think that rumor is a bit much? And \"lewd punishments,\" of all things..."
90100040-29 = "There may be some truth to it."
90100040-30 = "I heard a suspicious account from a Gehenna student once."
90100040-31 = "She said there are ropes, handcuffs, and mysterious nurse outfits in Sensei's personal storage..."
90100040-32 = "Ugh..."
90100040-33 = "...And if that rumor is true, then there's a bigger issue that we must address."
90100040-34 = ""
90100040-36 = ""
90100040-37 = "A \"bigger issue\"? What would that be?"
90100040-38 = "...There is a risk of Sensei learning about FOX 3's...special padding."
90100040-39 = "Of course, it seems that [USERNAME] Sensei hasn't noticed yet, but I suggest we make a quick retreat to maintain FOX 3's honor..."
90100040-40 = "Wh-What are you talking about?! What does Sensei being a pervert have to do with my undergarments?!"
90100040-41 = "Huh, so you're not denying it. You're wearing something special under there."
90100040-42 = "...FOX 3, FOX 4. Stand down. We've received an incredible amount of help from [USERNAME] Sensei."
90100040-43 = "No matter what they demand of us deep inside the eerie basement, we will not refuse and retreat while we owe them a debt."
90100040-44 = "...Compared to that, Kurumi's inserts are of little importance."
90100040-45 = "Excuse me?! Yukino!!"
90100040-46 = ""
90100040-48 = ""
90100040-49 = "[ns3] \"Um, is there a problem?\"\n[ns4] \"It was getting loud back here...\""
90100040-52 = ""
90100040-53 = "Haha... It's nothing."
90100040-54 = "We were all just so...excited to be out and about again."
90100040-55 = "[s] \"If that's the case...\""
90100040-56 = ""
90100040-59 = "[ns] \"We've arrived!\""
90100040-62 = ""
90100040-63 = "This place is..."
90100040-64 = ""
90100040-65 = "[ns5] \"It's FOX Squad's new headquarters!\"\n[ns6] \"I'm sorry it's a little messy. I was in a rush...\""
90100040-68 = "I-It's a sprawling underground facility. I never could have imagined all this was just sitting here in Schale's basement."
90100040-69 = "It even has blast-proof walls and a secure intranet..."
90100040-70 = "With this facility, we could pull off missions on par with ones we completed at SRT Academy."
90100040-71 = "Sensei, just where are we?"
90100040-72 = "[s7] \"It's a decommissioned server room.\"\n[s8] \"The General Student Council President told me...\""
90100040-73 = ""
90100040-74 = ""
90100040-76 = ""
90100040-77 = "[ns9] \"Most students on Student Rep duty don't know about it...\"\n[ns10] \"So feel free to regroup and relax here.\""
90100040-81 = "...I see. The General Student Council President was very considerate."
90100040-82 = "Setting up a secure base in Schale's basement, all so we can track the anomalies across Kivotos..."
90100040-83 = "I agree that it's best for us to stay inside the Schale building. Down here, we can receive your support without being noticed by the other students, but..."
90100040-84 = "I feel uneasy about us operating at your place of work. We are liable to get in your way as we work on our mission."
90100040-85 = ""
90100040-87 = ""
90100040-88 = ""
90100040-89 = "[ns] \"It's not just 'your' mission.\""
90100040-90 = "...What do you mean?"
90100040-91 = "[s11] \"SRT is a special group that resolves 'problems in Kivotos,' right?\"\n[s12] \"So this mission is for EVERYONE in Kivotos.\""
90100040-94 = ""
90100040-96 = ""
90100040-97 = "...I've had a thought for a while, Sensei."
90100040-98 = "Don't other students often call you \"suspicious?\""
90100040-99 = "[s] \"A few may have?\""
90100040-100 = "Normally, a wild fox is smart enough to know a trap when it sees one. Like when a chunk of delicious-looking meat is offered up freely, for example."
90100040-101 = "Because anyone smart knows that if prey appears ready for the taking, it's very likely to be bait."
90100040-102 = "But the moment when the fox realizes it's not bait for a trap, but instead a gift, a feast..."
90100040-103 = "...They might learn to trust the hand that offered it."
90100040-104 = "[s] \"So, do you find me 'suspicious'?\""
90100040-105 = "...No."
90100040-106 = "On behalf of the FOX Squad, I once more must thank you for your generous support."
90100040-107 = "You're too much, Yukino. You don't have to be so formal all the time."
90100040-108 = "It's important to express your honest gratitude! Right?"
90100040-109 = "Heehee. Sure. I'm just fired-up about going on a mission again!"
90100040-110 = ""
90100040-112 = ""
90100040-113 = "Right. Then let's start planning and gathering evidence according to the General Student Council's orders..."
90100040-114 = "[s] \"Are you going to give the mission a name?\""
90100040-115 = "...Ah, I overlooked that. We've been simplifying things so much lately."
90100040-116 = "Since we're celebrating the return of the FOX Squad and congratulating ourselves, how about...\"Mission Kon-Kon\"?"
90100040-117 = "Oh, that's terrible. What are we, kids?"
90100040-118 = "Yeah. That sounds pretty weak. Let's keep it simple."
90100040-119 = ""
90100040-121 = ""
90100040-122 = "While I love the spirit, Yukino... How about we keep it direct this time, just to ease ourselves in?"
90100040-123 = "For example, perhaps something like \"Mission Lore Pursuit\" since we're hunting the elusive \"Lore\"..."
90100040-124 = "No objections!"
90100040-125 = ""
90100040-127 = ""
90100040-128 = ""
90100040-129 = "..."
90100040-130 = "[s] \"...We can use your name next time.\""
90100040-131 = "...Understood."
90100040-132 = ""
90100040-134 = ""
90100040-135 = "And so, FOX Squad. Let Mission Lore Pursuit begin!"
90100040-137 = "Next Episode;Whereabouts of the Ace"
