90100040-90 = "พูดแบบนั้นหมายความว่า...?"
90100040-91 = "[s11] \"SRT เป็นองค์กรพิเศษที่แก้ 'ปัญหาในคิโวทอส' ไม่ใช่เหรอ?\"\n[s12] \"งั้นปฏิบัติการนี้ก็คือปฏิบัติการเพื่อทุกคนในคิโวทอสสิ\""
