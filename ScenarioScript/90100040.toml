90100040-100 = "ปกติแล้วถ้าในธรรมชาติมีเนื้อก้อนโตที่ดูน่ากินวางไว้ในที่ที่มองเห็นได้ชัด สัตว์ป่าอย่างสุนัขจิ้งจอกก็คงมองว่ามันน่าสงสัยค่ะ"
90100040-101 = "เพราะเหยื่อที่โผล่มาตรงหน้าในจังหวะเหมาะเจาะทั้งที่แทบไม่ต้องออกแรงอะไรเลย ส่วนใหญ่มักมีโอกาสสูงที่จะเป็นเหยื่อล่อบนกับดักอีกทียังไงล่ะคะ"
90100040-102 = "แต่ถ้าได้รู้ว่าเหยื่อชิ้นนั้น แท้จริงแล้วเป็นงานเลี้ยงสุดหรูที่จัดเตรียมไว้เพื่อเราเพียงคนเดียว และไม่ได้มีอันตรายเลยแม้แต่น้อยละก็..."
90100040-103 = "เรื่องนี้ก็ไม่น่าจบลงแค่การถูกมองว่าเป็น 'ผู้ใหญ่แปลกๆ' เท่านั้นหรอกค่ะ..."
