90100040-65 = "[ns5] \"[ruby=HQ]กองบัญชาการปฏิบัติการ[/ruby]ของกองทหาร FOX!\"\n[ns6] \"ที่ที่ครูจะให้เป็นกองบัญชาการปฏิบัติการของพวกเราไง!\""
90100040-68 = "ปะ... เป็นห้องใต้ดินขนาดใหญ่เลยนะคะ ไม่อยากเชื่อเลยว่ามีที่แบบนี้อยู่ในชั้นใต้ดินของชาเล่ต์ด้วย..."
90100040-69 = "ที่นี่ถูกออกแบบให้ทนต่อแรงระเบิด แถมยังมีอุปกรณ์เครือข่ายที่แยกออกจากระบบภายนอกด้วย..."
90100040-70 = "ถ้ามีสิ่งอำนวยความสะดวกขนาดนี้ เราน่าจะทำปฏิบัติการได้ในระดับเดียวกับสมัยที่ยังอยู่สถาบันพิเศษ SRT เลยนะ?"
90100040-71 = "คุณครู สถานที่ปฏิบัติการแห่งนี้มัน..."
90100040-72 = "[s7] \"เป็นห้องเซิร์ฟเวอร์ที่ตอนนี้ไม่ได้ใช้แล้วน่ะ\"\n[s8] \"ถ้าประธานองค์การนักเรียนไม่บอก ครูก็ไม่รู้เหมือนกันว่ามี...\""
90100040-73 = ""
90100040-74 = ""
90100040-76 = ""
90100040-77 = "[ns9] \"นักเรียนที่มาเข้าเวรส่วนใหญ่ก็น่าจะไม่รู้ว่ามีห้องนี้...\"\n[ns10] \"ทุกคนจัดเตรียมอุปกรณ์และพักผ่อนที่นี่ได้ตามสบายเลยนะ\""
90100040-81 = "งั้นเหรอคะ... ประธานองค์การนักเรียนเอาใจใส่กันถึงขนาดนี้เลยสินะคะ"
90100040-82 = "ตั้งฐานปฏิบัติการชั่วคราวในชั้นใต้ดินของชาเล่ต์ที่นักเรียนทั่วไปเข้าถึงไม่ได้ และออกปฏิบัติหน้าที่ใน#nลักษณะหน่วยเฉพาะกิจ เพื่อติดตามปรากฏการณ์ผิดปกติที่กำลังแพร่กระจายไปทั่วคิโวทอส..."
90100040-83 = "ถ้าต้องการรับการสนับสนุนจากคุณครูโดยไม่ให้คนอื่นสังเกตเห็น การมาพักอยู่ในอาคารชาเล่ต์ก็นับว่า#nเป็นทางเลือกที่ดีที่สุดจริงๆ อย่างที่คุณครูว่า..."
90100040-84 = "แต่พอคิดว่าการทำปฏิบัติการของพวกฉันจะมารบกวนพื้นที่ที่คุณครูใช้ทั้งทำงานและใช้ชีวิตประจำวัน ฉันก็ไม่ค่อยสบายใจเลยค่ะ"
