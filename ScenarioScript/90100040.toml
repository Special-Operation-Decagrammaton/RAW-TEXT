[translation]
90100040-1 = "ตอนที่ 4;ฐานใหม่"
90100040-2 = "ทางเดินใต้ดิน ชาเล่ต์"
90100040-4 = ""
90100040-5 = "เอ่อ ที่จริงฉันก็ไม่รังเกียจที่จะตามคุณครูมาถึงชาเล่ต์หลังกินมื้อเย็นเสร็จหรอกนะ..."
90100040-6 = "แต่ว่าที่นี่มันที่ไหนเหรอ...?"
90100040-7 = ""
90100040-9 = ""
90100040-10 = ""
90100040-11 = "นี่เป็นครั้งที่สองแล้วที่เข้ามาในอาคารชาเล่ต์... แต่พื้นที่ตรงนี้ไม่เคยเข้ามาก่อนเลย"
90100040-12 = "นั่นสินะ ก็ก่อนหน้านี้เราใช้เส้นทางที่สั้นที่สุดเพื่อเข้าควบคุมเป้าหมายตามคำสั่งของ#nหัวหน้าสำนักป้องกันนี่เนอะ..."
90100040-13 = "[s1] \"ขอโทษนะ ตรงนี้ค่อนข้างมืดใช่มั้ย?\"\n[s2] \"นี่เป็นพื้นที่ใต้ดินที่ไม่ค่อยได้ใช้งานน่ะ... ช่วยทนอีกเดี๋ยวนะ\""
90100040-16 = "ที่จริงพวกฉันก็คุ้นเคยกับที่มืดๆ จากประสบการณ์ในการปฏิบัติการ..."
90100040-17 = "แต่เราน่าจะเดินลงบันไดมาเยอะมากแล้ว นี่ห้องใต้ดินของชาเล่ต์มันอยู่ลึกแค่ไหนกันเหรอคะ?"
90100040-18 = "[s] \"นั่นสินะ ครูก็ไม่เคยตรวจสอบมาก่อนด้วย...\""
90100040-19 = ""
90100040-21 = "[ns] \"ในเมื่อจอดรถถังได้ งั้นก็น่าจะลงไปเกิน 3 ชั้นอยู่นะ?\""
90100040-22 = "อยู่ลึกขนาดที่แม้แต่คุณครูที่ดูแลชาเล่ต์ยังนึกไม่ออกอีกเหรอ... โครงสร้างของอาคารชาเล่ต์เป็นยังไงกันนะ?"
90100040-23 = "ถ้ารู้ว่าจะเกิดเหตุการณ์แบบนี้ ตอนมาบุกรุกครั้งล่าสุด ถ้าเราตรวจสอบโครงสร้างให้ละเอียดถี่ถ้วนกว่านี้ ก็น่าจะดีน่ะสิ"
90100040-24 = "ที่คุณครูลงมาตรวจสอบไม่ได้เพราะแค่งานยุ่งหรือเปล่า..."
90100040-25 = "จะว่าไป เหมือนฉันจะเคยได้ยินข่าวลือแบบนั้นระหว่างสืบข้อมูลในโซเชียลเลย..."
90100040-26 = "ว่ากันว่าในส่วนลึกของชั้นใต้ดินของชาเล่ต์มีห้องลับที่แม้แต่นักเรียนเวรยังเข้าไปไม่ได้ และคุณครูก็จะขังนักเรียนที่ขัดขืนตัวเองไว้ที่นั่น ก่อนจะลงโทษด้วยวิธีที่คิดไม่ซื่อ..."
90100040-27 = "อย่างนี้สินะ... ถ้าจะสอบสวนเชลย ห้องใต้ดินของชาเล่ต์ที่ควบคุมได้ง่ายและหลบหนีได้ยาก ก็คงเป็นสถานที่ที่เหมาะที่สุด"
90100040-28 = "ตะ... แต่ว่าข่าวลือนั่นดูจะเกินจริงไปหน่อยหรือเปล่า? แล้วที่บอกว่าลงโทษด้วยวิธีที่คิดไม่ซื่อ..."
90100040-29 = "ไม่หรอก บางทีข่าวลือนั่นอาจจะเป็นเรื่องจริงก็ได้"
90100040-30 = "ก่อนหน้านี้ตอนที่ไปเดินสืบข่าวในเมือง ฉันเคยได้ยินคำให้การที่น่าสงสัยจากนักเรียนเกเฮนน่าคนหนึ่ง"
90100040-31 = "ได้ยินมาว่าในล็อกเกอร์ส่วนตัวของคุณครูมีพวกปลอกคอกับกุญแจมือที่ไม่รู้ว่าเอาไว้ใช้ทำอะไร แล้วก็มีชุดพยาบาลอยู่ด้วย..."
90100040-32 = "อึก..."
90100040-33 = "ถ้าข่าวลือนั่นเป็นเรื่องจริงละก็ ตอนนี้เรามีปัญหาใหญ่กว่าที่เราต้องเอามาคิดให้หนักเลยละ..."
90100040-34 = ""
90100040-36 = ""
90100040-37 = "ปัญหาที่ใหญ่กว่า? มันคืออะไรเหรอ?"
90100040-38 = "มีความเสี่ยงที่คุณครูจะจับได้ว่า FOX 3 ใส่ชุดชั้นในกระชับสัดส่วนอยู่น่ะสิ..."
90100040-39 = "แน่นอนว่าตอนนี้คุณครู [USERNAME] น่าจะยังไม่ทันสังเกตเห็น#nแต่เพื่อรักษาเกียรติของ FOX 3 ฉันว่าตอนนี้เราควรถอยกลับทันที..."
90100040-40 = "พะ... พูดเรื่องอะไรน่ะ! การที่คุณครูคิดไม่ซื่อมันเกี่ยวอะไรกับชุดชั้นในของฉันด้วย!"
90100040-41 = "โอ้ว แปลว่าไม่ได้ปฏิเสธว่าใส่ชุดชั้นในกระชับสัดส่วนอยู่สินะ"
90100040-42 = "FOX 3, FOX 4... ที่ผ่านมาเราได้รับความช่วยเหลือมากมายจากคุณครู [USERNAME] นะ"
90100040-43 = "ถึงคุณครูจะเรียกร้องอะไรจากเราในส่วนลึกของห้องใต้ดิน การปฏิเสธและวิ่งหนีก็ไม่ใช่สิ่งที่ถูกต้อง#nสำหรับฝ่ายที่เป็นหนี้บุญคุณอยู่หรอก"
90100040-44 = "ส่วนเรื่องชุดชั้นในกระชับสัดส่วนของคุรุมิน่ะ... เทียบกันแล้วก็ไม่ใช่เรื่องสำคัญหรอก"
90100040-45 = "นี่! ยูกิโนะ!!"
90100040-46 = ""
90100040-48 = ""
90100040-49 = "[ns3] \"เจอปัญหาอะไรกันเหรอ?\"\n[ns4] \"ได้ยินเสียงดังจากข้างหลังมาสักพักแล้ว มีเรื่องอะไรกันเหรอ?\""
90100040-52 = ""
90100040-53 = "แหะๆ... ไม่มีอะไรทั้งนั้นค่ะ"
90100040-54 = "พวกเราไม่ได้ออกมาข้างนอกกันนานแล้ว สงสัยจะตื่นเต้นกันนิดหน่อยน่ะค่ะ"
90100040-55 = "[s] \"ถ้าอย่างนั้นก็โล่งอกไปทีนะ\""
