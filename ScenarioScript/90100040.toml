90100040-105 = "เปล่าค่ะ..."
90100040-106 = "ในนามของกองทหาร FOX ฉันขอขอบคุณอีกครั้งสำหรับการสนับสนุนอย่างเต็มที่จากคุณครูค่ะ"
90100040-107 = "ยูกิโนะน่ะเคร่งขรึมเกินไปแล้วนะ ไม่เห็นต้องพูดเป็นทางการขนาดนั้นเลย"
90100040-108 = "แต่ถึงยังไง การแสดงความขอบคุณต่อบุญคุณที่ได้รับก็เป็นเรื่องสำคัญนะคะ"
90100040-109 = "ฮุฮุ แค่คิดว่าจะได้กลับมาทำปฏิบัติการอีกครั้งหลังจากไม่ได้ทำมานาน ก็รู้สึกคันไม้คันมือขึ้นมาเลยนะ"
90100040-110 = ""
90100040-112 = ""
90100040-113 = "ถ้างั้นจากนี้ไปเราจะออกปฏิบัติการและรวบรวมข้อมูลตามคำสั่งขององค์การนักเรียน..."
90100040-114 = "[s] \"ไม่ตั้งชื่อปฏิบัติการกันก่อนเหรอ?\""
90100040-115 = "อ่า... ช่วงหลังมานี้เราปฏิบัติการกันแบบไม่เป็นทางการ ก็เลยลืมเรื่องนี้ไปเลยค่ะ"
90100040-116 = "ถ้างั้น เพื่อฉลองการกลับมาปฏิบัติการของกองทหาร FOX เราจะใช้ชื่อ <ปฏิบัติการค่งค่ง>..."
90100040-117 = "ไม่อะ ไม่เอา ชื่อนั้นมันดูเด็กน้อยเกินไป"
90100040-118 = "ใช่ ฉันไม่รู้ความหมายด้วยซ้ำ ตั้งชื่อง่ายๆ ให้เหมือนปกติไม่ได้เหรอ?"
