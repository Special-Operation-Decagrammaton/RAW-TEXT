[translation]
90100040-1 = "第4話;新的據點"
90100040-2 = "夏萊地下走廊"
90100040-4 = ""
90100040-5 = "那個，吃完飯跟著老師來夏萊是沒問題啦……"
90100040-6 = "……不過這裡到底是什麼地方啊？"
90100040-7 = ""
90100040-9 = ""
90100040-10 = ""
90100040-11 = "雖然已經是第二次來到夏萊大樓……這一區我還是第一次來呢。"
90100040-12 = "就是說啊。上次畢竟是在防衛室長的指示之下，為了確保目標而以最短路線移動……"
90100040-13 = "[s1] 「抱歉，有點暗對吧？」\n[s2] 「這裡是平常不太會用到的地下區域……再忍耐一下哦。」"
90100040-16 = "基於作戰的經驗，我對陰暗的地方還算習慣……"
90100040-17 = "不過好像已經沿著樓梯走了很長一段距離……夏萊的地下室究竟有多深呢？"
90100040-18 = "[s] 「這點我也沒有確認過，所以不太清楚……」"
90100040-19 = ""
90100040-21 = "[ns] 「但是既然連戰車都能收納，至少也不會少於地下3層吧？」"
90100040-22 = "連管理夏萊的老師都掌握不了的深度……夏萊這棟大樓究竟是什麼樣的構造啊？"
90100040-23 = "早知道上次潛入的時候，就把這裡的構造調查得更清楚了。"
90100040-24 = "會不會只是老師太忙，所以才沒時間確認啊……"
90100040-25 = "……話說之前我在調查社群網站的時候，曾經看到過這樣的傳聞。"
90100040-26 = "據說夏萊地下室的深處，存在著一個連值日生都無法接近的隱密空間。#n老師會在那裡把違逆自己的學生關起來，並給予色色的懲罰……"
90100040-27 = "……原來如此。#n要審問俘虜的話，便於監視又難以逃脫的夏萊地下室，確實是最理想的環境呢。"
90100040-28 = "再，再怎麼說那也太誇張了吧？#n而且還說是什麼色色的懲罰……"
90100040-29 = "不，那個傳聞搞不好是真的哦。"
90100040-30 = "之前我在市中心訪查的時候，從某個格黑娜的學生那裡聽到了可疑的證詞。"
90100040-31 = "據說老師的私人置物櫃裡，放著用途不明的項圈、手銬，還有護士服之類的東西……"
90100040-32 = "唔唔……"
90100040-33 = "……而且如果那個傳聞是真的，現階段還有個更大的問題必須列入考量。"
90100040-34 = ""
90100040-36 = ""
90100040-37 = "更大的問題？什麼問題？"
90100040-38 = "……FOX3穿著的塑身內衣，有被老師發現的風險。"
90100040-39 = "雖然[USERNAME]老師目前似乎還沒察覺……#n不過為了FOX3的名譽著想，最好還是馬上撤退比較──"
90100040-40 = "什，什麼跟什麼啊！#n老師色不色跟我的內衣有什麼關係！"
90100040-41 = "哦～看來你並不否認自己穿了塑身內衣呢。"
90100040-42 = "……FOX3、FOX4。#n我們這段期間受了[USERNAME]老師許多照顧。"
90100040-43 = "就算老師在地下室深處提出了某些要求，身為有所虧欠之人也不該拒絕或逃跑。"
90100040-44 = "……相較之下，胡桃的塑身內衣只不過是無關緊要的問題罷了。"
90100040-45 = "喂！雪乃！！"
90100040-46 = ""
90100040-48 = ""
90100040-49 = "[ns3] 「那個，有什麼問題嗎？」\n[ns4] 「後面好像從剛才開始就一直鬧哄哄的……」"
90100040-52 = ""
90100040-53 = "哈哈……沒什麼。"
90100040-54 = "可能是大家很久沒到外面來了，才會有點興奮吧。"
90100040-55 = "[s] 「那就好……」"
90100040-56 = ""
90100040-59 = "[ns] 「到了。就是這裡。」"
90100040-62 = ""
90100040-63 = "這裡是……"
90100040-64 = ""
90100040-65 = "[ns5] 「是FOX小隊的[ruby=HQ]作戰本部[/ruby]！」\n[ns6] 「因為是緊急清理了閒置的空間，可能稍微有點凌亂就是了……」"
90100040-68 = "真，真是個規模驚人的地下設施呢。#n沒想到夏萊的地下居然有這種地方……"
90100040-69 = "除了防爆設計以外，還有獨立於外部網路的網路設備……"
90100040-70 = "如果有這種規模的設施，感覺就連過去在SRT特殊學園時期的作戰也能進行了呢？"
90100040-71 = "老師，這座作戰設施到底是……"
90100040-72 = "[s7] 「這是目前沒在使用的老舊伺服器室。」\n[s8] 「我在聽聯邦學生會長說之前，也根本不知道有這種地方……」"
90100040-73 = ""
90100040-74 = ""
90100040-76 = ""
90100040-77 = "[ns9] 「大部分的值班學生應該也都不知道這裡的存在──」\n[ns10] 「所以大家就安心地在這裡進行整備和休息吧。」"
90100040-81 = "……這樣啊。聯邦學生會長居然連這種地方都替我們設想到了。"
90100040-82 = "在一般學生無法接近的夏萊地下室設置臨時據點，#n以派遣的形式追蹤蔓延於奇普托斯的異常現象……"
90100040-83 = "正如您所說，要在避開其他學生耳目的前提下接受老師的後援，#n直接待在夏萊大樓內部確實是最好的選擇……"
90100040-84 = "不過一想到要因為我們的作戰影響老師工作和起居的空間，就覺得有點過意不去呢。"
90100040-85 = ""
90100040-87 = ""
90100040-88 = ""
90100040-89 = "[ns] 「這可不是『你們』自己的作戰哦。」"
90100040-90 = "……怎麼說呢？"
90100040-91 = "[s11] 「SRT是解決『奇普托斯的問題』的特殊組織對吧？」\n[s12] 「所以這次的作戰，是為了奇普托斯所有人的作戰。」"
90100040-94 = ""
90100040-96 = ""
90100040-97 = "……我從以前就偶爾會這麼想。"
90100040-98 = "您是不是經常被其他學生評價為「很可疑」呢？"
90100040-99 = "[s] 「好像還挺常的……？」"
90100040-100 = "如果在野外的顯眼處擺著看起來很美味的肉，連狐狸這種野生動物也會覺得可疑的。"
90100040-101 = "沒費多少工夫卻適時出現在眼前的獵物，通常很可能是陷阱上的誘餌。"
90100040-102 = "不過要是大家都知道那個獵物其實完全無害，還是專為自己準備的豪華大餐的話……"
90100040-103 = "……事情或許就不是被評價為「奇怪的大人」這麼簡單了。"
90100040-104 = "[s] 「咦？我剛才有說錯什麼嗎？」"
90100040-105 = "……沒有。"
90100040-106 = "謹代表FOX小隊，再次為您不遺餘力的支援致上謝意。"
90100040-107 = "雪乃就是太正經了。#n明明沒必要那麼一板一眼的說。"
90100040-108 = "不過，對受到的恩惠表達感謝是很重要的哦。"
90100040-109 = "呵呵，一想到要久違地重啟作戰，指尖就開始癢起來了呢。"
90100040-110 = ""
90100040-112 = ""
90100040-113 = "那麼接下來就以聯邦學生會下達的指示為基礎，進行作戰及情報蒐集──"
90100040-114 = "[s] 「不用先決定作戰名稱嗎？」"
90100040-115 = "……啊，最近都採用簡略的流程，所以漏掉了呢。"
90100040-116 = "那麼機會難得，就以紀念FOX小隊重新活動的意義，取名為「哐哐作戰」……"
90100040-117 = "不不不，那個名字也太幼稚了吧。"
90100040-118 = "對啊，而且也搞不懂是什麼意思。#n不能像平常那樣簡單一點嗎？"
90100040-119 = ""
90100040-121 = ""
90100040-122 = "雪乃的心情我能夠理解……不過這次還是用淺顯易懂的名字比較好吧？"
90100040-123 = "比如既然是追蹤「怪談」的作戰，就叫「怪談追蹤作戰」之類的……"
90100040-124 = "沒有異議！"
90100040-125 = ""
90100040-127 = ""
90100040-128 = ""
90100040-129 = "…………"
90100040-130 = "[s] 「……那個作戰名稱，就留到下次再用吧？」"
90100040-131 = "……我明白了。"
90100040-132 = ""
90100040-134 = ""
90100040-135 = "那麼──「怪談追蹤作戰」正式開始。"
90100040-137 = "下一話;王牌的去向"
