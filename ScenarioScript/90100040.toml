[translation]
90100040-1 = "제4화;새로운 거점"
90100040-2 = "샬레 지하 복도"
90100040-5 = "저기, 식사가 끝나고 선생님을 따라 샬레로 온 건 상관없었는데 말이야……"
90100040-6 = "……도대체 여기는 어디야?"
90100040-11 = "샬레 건물에 방문한 건 벌써 두 번째지만…… 이 구역은 처음 와보는걸."
90100040-12 = "그러게. 전에는 방위실장의 지시로 목표를 확보하기 위해 최단 루트로 이동했으니까……"
90100040-13 = "[s1] \"미안, 조금 어둡지?\"\n[s2] \"평소에는 잘 쓰이지 않는 지하 구역이라…… 조금만 더 참아줘.\""
90100040-16 = "작전 경험 상 어두운 장소는 익숙합니다만……"
90100040-17 = "이미 계단으로도 꽤 내려온 것 같은데, 샬레의 지하실은 얼마나 깊은 것이지요?"
90100040-18 = "[s] \"글쎄, 확인해 보지 않아서 잘 모르겠는데……\""
90100040-21 = "[ns] \"전차도 격납할 수 있을 정도니, 최소한 지하 3층은 넘지 않을까?\""
90100040-22 = "샬레를 관리하는 선생님조차 파악하지 못한 깊이라니…… 샬레의 건물은 대체 어떤 구조로 이루어진 거지?"
90100040-23 = "이럴 줄 알았다면 지난 번 잠입 때 좀 더 확실하게 구조를 조사할 걸 그랬나."
90100040-24 = "그냥 선생님께서 바빠서 확인하실 시간이 없었던 게 아닐까……"
90100040-25 = "……그러고 보니 전에 SNS를 조사하다가 그런 소문을 들은 적이 있어."
90100040-26 = "샬레 지하실 깊은 곳에는 당번 학생들조차 접근할 수 없는 비밀스러운 공간이 존재하고, 그곳에서 선생님이 자신을 거스른 학생들을 가두어 둔 채 엉큼한 벌을 준다는 소문이……"
90100040-27 = "……과연. 포로를 심문한다면 감시가 용이하고 탈출이 어려운 샬레의 지하실이야말로 최적의 환경이겠군."
90100040-28 = "아, 아무리 그래도 그건 너무 과장된 소문 아닐까? 게다가 엉큼한 벌이라니……"
90100040-29 = "아니, 어쩌면 그 소문은 사실일지도 몰라."
90100040-30 = "전에 도심에서 탐문을 할 때 어느 게헨나의 학생으로부터 수상한 증언을 들었거든."
90100040-31 = "선생님의 개인 캐비닛 안에는 용도를 알 수 없는 목줄이나 수갑, 간호사 의상 같은 게 들어 있다고……"
90100040-32 = "으으……"
90100040-33 = "……게다가 그 소문이 사실이라면 현 시점에서 고려해야하는 더 큰 문제가 있어."
90100040-37 = "더 큰 문제? 그게 뭔데?"
90100040-38 = "……FOX 3가 입고 있는 체형 보정용 속옷이 선생님에게 들킬 위험이 있다."
90100040-39 = "물론 아직 [USERNAME] 선생님은 눈치채지 못한 모양이지만, FOX 3의 명예를 위해서라도 지금 바로 후퇴하는 게—"
90100040-40 = "그, 그게 무슨 소리야! 선생님이 엉큼한 것과 내 속옷이 무슨 상관이 있는데!"
90100040-41 = "호오, 보정용 속옷을 입었다는 사실 자체는 부인하지 않는 건가."
90100040-42 = "……FOX 3, FOX 4. 그동안 우리는 [USERNAME] 선생님께 많은 도움을 받아왔다."
90100040-43 = "선생님께서 지하실 깊은 곳에서 우리에게 어떤 요구를 하신다 하더라도 이를 거부하고 도망치는 건 빚을 진 사람으로서의 도리가 아니야."
90100040-44 = "……그에 비하면 쿠루미의 보정용 속옷 같은 건 아무래도 상관없는 문제지."
90100040-45 = "야! 유키노!!"
90100040-49 = "[ns3] \"저기, 무슨 문제라도 있어?\"\n[ns4] \"아까 전부터 뒤쪽이 계속 소란스러운데……\""
90100040-53 = "하하…… 아무것도 아니에요."
90100040-54 = "다들 오랜만에 밖에 나와서 그런지 조금 들뜬 모양이네요."
90100040-55 = "[s] \"그렇다면 다행이지만……\""
90100040-59 = "[ns] \"도착했다. 바로 여기야.\""
90100040-63 = "이곳은……"
90100040-65 = "[ns5] \"FOX 소대의 [ruby=HQ]작전 본부[/ruby] 시설이야!\"\n[ns6] \"안 쓰는 공간을 급하게 치우느라 조금 지저분하긴 하지만……\""
90100040-68 = "어, 엄청난 규모의 지하 시설이네요. 샬레의 지하에 이런 장소가 있었을 줄이야……"
90100040-69 = "방폭설계도 되어 있고, 외부망으로부터 독립된 네트워크 장비도 있으니……"
90100040-70 = "이만한 시설이 있다면 과거 SRT 특수학원에 있던 시절에 준하는 작전도 가능하겠는데?"
90100040-71 = "선생님, 이 작전 시설은 도대체……"
90100040-72 = "[s7] \"현재는 쓰이지 않는 오래된 서버룸이야.\"\n[s8] \"나도 총학생회장에게 듣기 전까지는 이런 장소가 있는 줄도 몰랐지만……\""
90100040-77 = "[ns9] \"아마 대부분의 당번 학생들도 이곳의 존재는 모를테니까—\"\n[ns10] \"다들 안심하고 이곳에서 정비와 휴식을 갖도록 해.\""
90100040-81 = "……그렇습니까. 총학생회장께서 여기까지 신경을 써 주셨군요."
90100040-82 = "일반 학생들이 접근할 수 없는 샬레 지하실에 임시 거점을 마련하고, 파견 형태로 키보토스에 만연한 이상 현상을 추적한다, 라……"
90100040-83 = "말씀 주신 것처럼 다른 학생들의 눈을 피해서 선생님의 후견을 받기 위해서는 샬레 건물 내부에 직접 머무르는 것이 제일이긴 합니다만……"
90100040-84 = "선생님께서 업무와 생활을 영위하시는 공간에, 저희의 작전 때문에 폐를 끼친다고 생각하니 조금 내키지가 않는군요."
90100040-89 = "[ns] \"'너희'만의 작전이 아닌걸.\""
90100040-90 = "……그 말씀은?"
90100040-91 = "[s11] \"SRT는 '키보토스의 문제'를 해결하는 특수 조직이잖아?\"\n[s12] \"그러니 이번 작전은 키보토스의 모두를 위한 작전이야.\""
90100040-97 = "……전부터 간혹 생각했던 것입니다만, 선생님."
90100040-98 = "다른 학생들로부터 '수상하다'는 평을 종종 듣지는 않으시는지요?"
90100040-99 = "[s] \"꽤 있었던 것 같기도 하고……?\""
90100040-100 = "보통 야생에서 눈에 잘 띄는 곳에 먹음직스러워 보이는 고깃덩어리가 놓여 있다면, 여우와 같은 야생동물들은 이를 수상히 여길 겁니다."
90100040-101 = "큰 노력을 들이지 않았는데도 시의적절하게 눈앞에 나타나는 먹잇감은, 보통 덫에 올려진 미끼일 가능성이 높으니까요."
90100040-102 = "하지만 그 먹잇감이 실은 조금도 해롭지 않은, 나만을 위해 준비된 호화로운 만찬이라는 걸 모두가 알게 된다면……"
90100040-103 = "……단순히 '이상한 어른'이라는 평가로는 끝나지 않을지도 모릅니다."
90100040-104 = "[s] \"어라? 나 방금 뭔가 잘못 말했나?\""
90100040-105 = "……아닙니다."
90100040-106 = "FOX 소대를 대표하여 아낌없는 지원에 다시 한 번 감사의 인사를 드립니다."
90100040-107 = "유키노는 너무 딱딱하다니까. 그렇게 딱딱하게 말할 필요는 없는데."
90100040-108 = "그래도 받은 은혜에 감사를 표하는 건 중요하니까요."
90100040-109 = "후후, 오랜만에 작전을 재개할 생각을 하니 벌써부터 손끝이 근질거리는걸."
90100040-113 = "그럼 지금부터 총학생회에서 내려온 지시를 바탕으로 작전 및 정보 수집을—"
90100040-114 = "[s] \"작전명은 정하지 않아도 괜찮아?\""
90100040-115 = "……아, 최근에는 약식으로 진행 하다 보니 놓치고 있었군요."
90100040-116 = "그럼 모처럼이니, FOX 소대의 재활동을 기념하는 의미로 <캥캥 작전>으로……"
90100040-117 = "아니, 아니. 그 이름은 너무 유치하잖아."
90100040-118 = "맞아. 의미도 모르겠고. 평소처럼 간단하게 가면 안 되는 거야?"
90100040-122 = "유키노의 기분은 이해하지만…… 이번만큼은 알기 쉬운 편이 좋지 않을까?"
90100040-123 = "예를 들자면 '로어'를 추적하는 작전이니, <로어 추적 작전>이라던가……"
90100040-124 = "이견 없음!"
90100040-129 = "………"
90100040-130 = "[s] \"……그 작전명은 다음에 쓰도록 할까?\""
90100040-131 = "……알겠습니다."
90100040-135 = "그럼, <로어 추적 작전>. 지금부터 시작하겠습니다."
90100040-137 = "다음화;에이스의 행방"
