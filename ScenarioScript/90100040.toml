90100040-123 = "อย่างเช่น ในเมื่อนี่เป็นปฏิบัติการที่เราต้องออกไปแกะรอย 'ตำนาน' งั้นก็ให้ชื่อ <ปฏิบัติการแกะรอยตำนาน>..."
