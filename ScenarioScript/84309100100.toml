[translation]
84309100100-5 = "어서 와. 빠르게 응답해 줘서 고마워."
84309100100-6 = "아니에요. 그나저나 이번에는 꽤나 다급한 호출이었네요. 무슨 일이 있나요?"
84309100100-7 = "있어. 그것도 실제로 상당히 다급한 일이야. 상황을 계산하기도 전에 두 사람을 우선 불렀을 정도로."
84309100100-8 = "헤에, 네가 계산보다 먼저 사람을 찾는 경우는 그리 많지 않았는데. 어지간히 급했나 봐?"
84309100100-9 = "뭐, 이미 일이 터져서 난장판이라도 나 있는 상황인 거야?"
84309100100-10 = "그런 뜻은 아닐지도……."
84309100100-11 = "맞아. 이미 상황은 발생했고, 이건 '예방'이 아니라 '수습' 작전이야."
84309100100-12 = "……!?"
84309100100-13 = "뭐……? 그게 무슨 소리야, 무슨 일인데?"
84309100100-15 = "침착해. 상황이 벌어졌긴 하지만, 아직 누군가 다치는 일까지는 일어나지 않았으니."
84309100100-16 = "그저 내부의 경비 시스템들이 오작동을 일으켜 공격 상태로 돼 있을 뿐이야. 시스템의 감시를 피해 작동을 중단시킨다면 문제가 없겠지."
84309100100-17 = "마침 지금은…… 시연장에 그 누구도 존재하지 않고."
84309100100-18 = "과연, 폐장 이후라 안에는 사람이 없지만…… 그래도 그대로 두면 내일 개장 시 누군가 다치게 된다는 거군요."
84309100100-19 = "음…… 그런 거라면 공식적으로 세미나에 알리면 되는 일 아니야? 딱히 우리가 해결해야 할 일로는 안 들리는데?"
84309100100-20 = "아뇨, 네루. 그렇지는 않겠지요."
84309100100-21 = "물론 누군가 세미나에 공식적으로 건의를 한다면, 세미나에서는 C&C에 건의를 할 테니……."
84309100100-22 = "아……. 어차피 내 일이네."
84309100100-23 = "……쯧."
84309100100-25 = "어차피 우리 선에서 해결하는 게 가능한 일이라면, 이런 늦은 시간에 세미나의 부원들을 깨울 필요가 없다고 판단했어."
84309100100-26 = "그건 그것대로 진행과 관리를 해야 할, 세미나 부원들의 컨디션에도 좋지 않을 테니."
84309100100-28 = "……결국 후배들 잘 자는데 괜히 깨우고 싶지 않다-는 거 아니야?"
84309100100-29 = "상냥한 이야기였군요. 도울 의욕이 샘솟는걸요."
84309100100-34 = "……그……."
84309100100-35 = "그렇게까지 말하진 않았어……."
84309100100-37 = "또, 또 그런다. 그냥 그렇다고 솔직하게 말하면 무슨 일 나냐, 너는?"
84309100100-38 = "그러려니 하죠, 네루. 이러고 있을 시간에 가서 경비 시스템을 돌려놓는 게 훨씬 낫겠어요."
84309100100-39 = "넌 왜 또 당연하다는 듯이 동행하려는 거야……"
84309100100-40 = "……?? 혹시 싫으신가요?"
84309100100-44 = "……하!"
84309100100-45 = "좋지. 매일 한 판씩 재미있는 게임이라도 하는 기분인걸."
84309100100-46 = "다행이네요, 짐짝 느낌은 아니기를 바랬어서."
84309100100-47 = "짐짝은 맞는데? 없는 거보다는 낫다는 것 정도일뿐."
84309100100-48 = "후후, 좀 더 노력하죠."
84309100100-50 = "……배전반을 조작할 수 있는 해킹툴을 준비해 줄 테니, 가서 설치해 주면 돼."
84309100100-51 = "그리고 최대한 설비들을 파괴하지 않고 진행해 주었으면 해. 세미나의 부원들……."
84309100100-55 = "……유우카나 노아도, 아침부터 피곤하게 만들고 싶지는 않으니."
84309100100-56 = "코유키는?"
84309100100-57 = "……코유키는 어차피……."
84309100100-58 = "아니, 됐다. 그냥 해 본 말이야."
