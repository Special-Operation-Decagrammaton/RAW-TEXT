[translation]
102200-1 = "제20화;최후의 방어 작전 - 샬레"
102200-8 = "여섯 번째 성소를 제외한 모든 성소의 <수호자> 공략 준비, 완료했습니다……!"
102200-9 = "응, 그리고 모든 자치구 방어 작전도 순조롭게 완료~"
102200-11 = "……좋습니다. 그럼 모든 준비는 완료되었군요……"
102200-15 = "……?! 뭐죠?"
102200-16 = "어디 보자……."
102200-20 = "……으헤엑?!"
102200-21 = "왜 그래요, 모모카 쨩……?!"
102200-28 = "습격이야!! 샬레 주변에 적들이 나타났어! 언제 이렇게……!!"
102200-57 = "아아. 정문 쪽의 방어는 우리가 맡도록 하지."
102200-58 = "후문 쪽은 여유가 있는 쪽이 좀 맡아주겠어?"
102200-60 = "큭큭큭큭…… 마침 심심했는데 잘됐네."
102200-61 = "샬레 후문 쪽의 방어는 우리가 맡는다!"
102200-62 = "무서운 언니들의 힘을 보여주겠어! 크크크크큭!"
102200-63 = "자아, 가보자고!"
102200-64 = "불량배를 얕보지 말라고!!"
102200-66 = "헬멧단, 모두 집합!!"
102200-75 = "뭐, 그렇게 됐으니 여기는 헬멧단 간부 코마카제 라브가 출동한다!!"
102200-76 = "샬레를 지키는 거다! 모두 돌격!!"
102200-81 = "후후후후후후…….♡"
102200-87 = "어쩜, 이럴 수가. 가엾게도……. 당신께서 곤란한 상황에 처했으면, 이 와카모, 절대로 가만히 있어서는 안 되겠죠."
102200-88 = "그러니까 안심하시고 이 와카모에게 전부 다 맡겨주시길."
102200-92 = "후후후후…… 자아, 그럼 시작해볼까요?"
