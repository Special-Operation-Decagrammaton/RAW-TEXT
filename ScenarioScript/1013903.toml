1013903-81 = "คุณครูคะ ฉันจะบุกไปที่จุด[ruby=Beef]บราโว่[/ruby] ส่วนคุณครู ช่วยจัดการจุด[ruby=Pork]ปาป้า[/ruby]พร้อมกันเลยนะคะ!"
1013903-82 = "เป้าหมายคือมันหมูที่อยู่ในแพ็กขนาด 200 กรัม..."
1013903-83 = "คุณครู ห้ามขยับไปไหนจนกว่าพนักงานจะติดสติกเกอร์ลดราคา 50% นะคะ!"
