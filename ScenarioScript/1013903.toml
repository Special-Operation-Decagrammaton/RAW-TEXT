1013903-133 = "ไม่เป็นไรค่ะ ฉันได้เนื้อวัวลด 70% มา ก็เลยยังมีเงินเหลือเฟือค่ะ!"
1013903-134 = "[s11] \"ลด 70% เลยเหรอ?\"\n[s12] \"ลดเยอะขนาดนั้น หยิบมาทันได้ยังไงน่ะ?\""
