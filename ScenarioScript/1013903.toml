1013903-15 = "แต่คุณครูก็อย่าประมาทนะคะ เพราะที่นี่แทบจะไม่ต่างกับสนามรบเลยค่ะ"
1013903-16 = "[s3] \"สนามรบงั้นเหรอ...\"\n[s4] \"มีการเตือนการก่อการร้ายที่นี่เหรอ?\""
1013903-19 = "เปล่าค่ะ มันไม่เกี่ยวกับการก่อการร้ายหรอก..."
