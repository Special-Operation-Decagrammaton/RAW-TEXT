1013903-161 = "ถึงจะเป็นการชมเกินเหตุ แต่ยังไงก็ขอบคุณนะคะ"
1013903-162 = "ช่วงลดราคาใกล้จะหมดแล้วค่ะ"
1013903-163 = "วัตถุดิบอย่างอื่นที่ต้องซื้อก็เหลือแค่หัวหอมกับผงแกงกะหรี่ค่ะ"
