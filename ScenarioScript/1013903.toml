1013903-54 = "นักเรียนคนนั้น... แทรกตัวเข้าไปในฝูงชนแล้วเลือกแคร์รอตหัวใหญ่ๆ อวบๆ ไปแล้ว!"
1013903-55 = "ปกติแล้วพวกแคร์รอตที่ยังมีดินโคลนติดอยู่ ถ้าไม่ดูให้ละเอียดก็แทบจะหาหัวที่ทรงสวยๆ ไม่ได้เลย เด็กคนนั้นทำไมถึงสายตาไวขนาดนั้นนะ...?!"
