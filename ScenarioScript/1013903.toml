1013903-12 = ""
1013903-13 = "ค่ะ ที่นี่ก็คือ[ruby=ซูเปอร์มาร์เก็ต]จุดพิกัดไมค์[/ruby] ที่เป็นจุดเป้าหมายของปฏิบัติการเสบียงพิเศษของกองทหาร FOX ค่ะ"
