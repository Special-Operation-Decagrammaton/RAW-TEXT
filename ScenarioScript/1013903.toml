1013903-182 = "(หลังจากนั้นคุณครูกับนิโกะก็แวะไปซื้อผงแกงกะหรี่ที่ซูเปอร์มาร์เก็ตอีกแห่งแล้วก็กลับมาที่#nชาเล่ต์ด้วยกัน)"
