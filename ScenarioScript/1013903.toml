1013903-24 = ""
1013903-27 = "(ซูเปอร์มาร์เก็ตขนาดใหญ่ที่คุณครูเดินตามนิโกะเข้าไป มีเสียงดังกว่าซูเปอร์มาร์เก็ตทั่วไปมาก)"
