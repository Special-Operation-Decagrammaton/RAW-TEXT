1013903-144 = "ไม่ได้ค่ะ อาหารถือเป็นส่วนหนึ่งของการทำงาน ฉันขอความช่วยเหลือจากคุณครูไม่ได้หรอกค่ะ"
1013903-145 = "อาหารเป็นสิ่งจำเป็นที่ทำให้เราเคลื่อนไหวและออกไปต่อสู้ได้ก็จริง แต่ก็ใช่ว่าเราจะมีวัตถุดิบดีๆ กินอย่างสะดวกสบายเสมอไปนี่คะ"
1013903-146 = "นักเรียนจาก SRT ก็เลยต้องเรียนรู้เทคนิคการเอาชีวิตรอดเพื่อให้หาวัตถุดิบได้อย่างมี#nประสิทธิภาพ แม้จะอยู่ในป่าลึกไร้ผู้คน หรือในดงศัตรูที่มีการคุ้มกันหนาแน่นก็ตามค่ะ"
1013903-147 = "เพราะถ้าเราอดอาหาร ไม่ว่าจะทำปฏิบัติการอะไรก็ไม่ราบรื่นหรอกค่ะ"
1013903-148 = "ตั้งแต่ได้รับการปล่อยตัวชั่วคราวจากสำนักควบคุม จริงอยู่ที่เราได้งบประมาณพิเศษ#nที่ทางองค์การนักเรียนจัดสรรให้ แต่แค่จะเอาไปทำปฏิบัติการยังไม่พอเลย..."
1013903-149 = "พอฉันพยายามจัดหาอาหารที่ดีขึ้นให้สมาชิกในกองบ่อยเข้า ฉันก็ติดนิสัยออกมาจ่ายตลาด#nในช่วงลดราคาแบบนี้ไปแล้วค่ะ"
1013903-150 = "ในสายตาของคุณครู... ฉันทำตัวอัตคัดไปหน่อยหรือเปล่าคะ?"
1013903-151 = "[ns15] \"ไม่เลยสักนิด!\"\n[ns16] \"เสียสละเวลามาจ่ายตลาดให้เพื่อนๆ นี่น่าชื่นชมด้วยซ้ำ!\""
1013903-155 = "[ns] \"ฉายา 'คุณแม่ประจำกอง' ของนิโกะเนี่ย ไม่ได้ได้มาเล่นๆ เลยนะ\""
1013903-156 = "ฮุฮุ... 'คุณแม่ประจำกอง' งั้นเหรอคะ"
1013903-157 = "ฉันได้ยินคำนี้จากสมาชิกในกองบ่อยๆ แต่พอได้ยินจากคุณครูก็เขินนิดหน่อยนะคะ..."
1013903-158 = "แล้วฉันก็ยังบกพร่องเกินกว่าจะเรียกตัวเองว่าคุณแม่ด้วย"
1013903-159 = "[s] \"ครูว่านิโกะจะเป็นแม่ที่ดีได้เลยนะ\""
