[translation]
1013903-1 = "仁子的採購"
1013903-2 = "（那天傍晚，為了協助仁子的作戰而前往了約定的地點）"
1013903-3 = "（聽說是SRT的特殊作戰，本來以為會是個危險的地方而繃緊了神經……）"
1013903-4 = ""
1013903-8 = "（……抵達的地方卻與想像中截然不同，是個人來人往的大型超市）"
1013903-9 = "[ns1] 「那個，仁子……」\n[ns2] 「……這裡到底是哪裡？」"
1013903-12 = ""
1013903-13 = "是的。這裡就是FOX小隊進行特殊補給作戰的目標地點──[ruby=超市]Mike Point[/ruby]。"
1013903-14 = "雖然乍看之下只是和平街道上的日常風景……"
1013903-15 = "不過請老師不要放鬆警戒──因為這裡已經與戰場無異了。"
1013903-16 = "[s3] 「戰場的意思是……」\n[s4] 「難道有人發出了恐怖攻擊的預告嗎？」"
1013903-19 = "不是的。這跟恐怖攻擊完全無關，只是……"
1013903-20 = "與其由我來說明，直接讓您親眼看看比較快吧。"
1013903-21 = "那麼老師，這邊請。"
1013903-22 = ""
1013903-24 = ""
1013903-27 = "（跟在仁子身後走進的大型超市內部，比印象中平時的超市還要喧鬧許多）"
1013903-28 = "（過了一會……）"
1013903-31 = "現在時間下午6點，從現在開始──"
1013903-32 = "打烊前的限時特賣正式開始！"
1013903-33 = "哇啊啊啊啊啊！"
1013903-34 = ""
1013903-36 = ""
1013903-37 = ""
1013903-38 = "[ns] 「唔，這陣騷動是……」"
1013903-39 = "老師，現在可不是慌張的時候。"
1013903-40 = "我們要馬上前往Delta3──蔬菜區，先確保胡蘿蔔！"
1013903-41 = "[s] 「知，知道了！」"
1013903-42 = ""
1013903-43 = ""
1013903-44 = "接下來所有蔬菜全都99元！？"
1013903-45 = "唔，人太多了，根本沒辦法悠哉地挑蔬菜……"
1013903-46 = "這個好嗎？還是這個？"
1013903-47 = "總之先從拿得到的開始──"
1013903-48 = ""
1013903-50 = ""
1013903-51 = ""
1013903-52 = ""
1013903-53 = "剛才那個動作是怎麼回事？"
1013903-54 = "那個學生……自然地融入人潮，挑走了顆粒飽滿又結實的胡蘿蔔！"
1013903-55 = "帶土的胡蘿蔔不仔細看根本難以分辨形狀，他怎麼能有那種反應速度……！？"
1013903-56 = ""
1013903-58 = ""
1013903-59 = ""
1013903-60 = "帶土的胡蘿蔔比清洗過的更新鮮，這是眾所周知的事實。#n但也正因如此，光憑顏色很難判斷胡蘿蔔的新鮮度。"
1013903-61 = "這種時候只要確認胡蘿蔔莖的芯，就能輕鬆分辨出新鮮度了。"
1013903-62 = "[s5] 「好，好厲害……」\n[s6] 「我光是要穿過那片人潮都很困難了……」"
1013903-65 = "您過獎了。#n比起平時的作戰環境，這根本不算什麼複雜的狀況。"
1013903-66 = "那麼接下來是Delta5──馬鈴薯區。"
1013903-67 = "購物籃的護衛就拜託老師了！"
1013903-68 = "[ns] 「交給我吧！」"
1013903-69 = ""
1013903-71 = ""
1013903-72 = "我盯著看的那顆超大馬鈴薯，一瞬間就消失了……？"
1013903-73 = "那個學生……有兩把刷子！"
1013903-74 = "動作快！再發呆下去，所剩無幾的優質食材就要全被搶光了！"
1013903-76 = ""
1013903-77 = "呼……這樣一來，料理所需的蔬菜應該都齊全了。"
1013903-78 = "那麼下一個是Charlie1──肉品區，可是……"
1013903-79 = "[s] 「這次我也負責拿購物籃就好嗎？」"
1013903-80 = "不。肉品區從6點10分開始，會每隔10分鐘輪流舉行豬肉和牛肉的特賣。#n如果買完一樣再去另一個貨架就太遲了。"
1013903-81 = "老師，我會去攻略[ruby=牛肉]Bravo[/ruby]Point，請老師同時處理[ruby=豬肉]Papa[/ruby]Point吧！"
1013903-82 = "目標是盒裝的200g豬板油……"
1013903-83 = "老師，在店員貼上半價特賣標籤之前，絕對不可以先行動哦！"
1013903-84 = "[s] 「知，知道了……！」"
1013903-86 = "（然而在少了仁子的情況下獨自應對特賣區的人潮，情況比預想中還要嚴苛）"
1013903-88 = ""
1013903-89 = ""
1013903-90 = ""
1013903-91 = "讓開讓開！那塊梅花肉是我先盯上的！"
1013903-92 = "豬肋排打七折？這可忍不了！"
1013903-93 = ""
1013903-95 = ""
1013903-96 = ""
1013903-97 = "不好意思，先讓我過一下。"
1013903-98 = ""
1013903-100 = ""
1013903-101 = "那我也先過了……"
1013903-102 = ""
1013903-104 = ""
1013903-106 = "[ns] 「唔……」"
1013903-107 = "（被人潮擠得連靠近貨架都很難……）"
1013903-108 = ""
1013903-111 = "接下來，肉品區的折扣也要開始囉！"
1013903-112 = "[ns] （就是現在……！）"
1013903-117 = "[ns7] 「咦？七折折扣標籤……？」\n[ns8] 「我剛才看到的明明是半價折扣標籤啊！」"
1013903-121 = ""
1013903-122 = "呵呵……年輕人，第一次來這家超市嗎？"
1013903-123 = "這家超市的七折標籤跟五折標籤長得很像，不仔細留意很容易看錯的！"
1013903-124 = "你在看哪裡啊？那邊是冷凍肉區！"
1013903-126 = "（在老練主婦們的氣勢壓制下，動不動就拿錯東西……）"
1013903-127 = ""
1013903-128 = "FOX2，已歸隊。"
1013903-129 = "老師，確保目標了嗎？"
1013903-130 = "[s9] 「抱歉，被其他客人的氣勢壓制了……」\n[s10] 「只搶到七折的商品。」"
1013903-133 = "沒關係。我這邊用三折的價格買到了牛肉，所以資金還很充裕！"
1013903-134 = "[s11] 「三折？」\n[s12] 「那種商品你是怎麼弄到手的？」"
1013903-137 = "呵呵，該說是運用了談判的技巧嗎。"
1013903-138 = "藉由對話在有利的位置上持續主導談判，也是特殊部隊應該具備的素養之一。"
1013903-139 = "[ns] 「再次見識到SRT的力量了……」"
1013903-141 = "[ns13] 「不過有必要這麼徹底的節省資金嗎？」\n[ns14] 「如果資金不足，我也可以支援你們的。」"
1013903-144 = "不，吃飯也是任務的延伸，怎麼能勞煩老師出手呢。"
1013903-145 = "吃飯是維持身體活動的必要行為，但沒有人能保證總是能獲得充裕的食材供應。"
1013903-146 = "正因如此，SRT才會教導各式各樣的生存技術，#n好讓我們在人跡罕至的深山或戒備森嚴的敵陣中，也能有效率地獲取食材。"
1013903-147 = "畢竟要是沒辦法填飽肚子，任何作戰都無法順利地執行下去。"
1013903-148 = "雖然從矯正局獲得假釋之後，聯邦學生會另外提撥了特殊預算給我們，#n但是要拿來用於作戰也總是不夠充足……"
1013903-149 = "在為了讓隊員們盡可能吃得更好而努力的過程中……#n不知不覺就養成了趁特賣時段採購的習慣。"
1013903-150 = "在老師眼裡……這樣果然有點落魄吧？"
1013903-151 = "[ns15] 「完全不會！」\n[ns16] 「為了隊員們的伙食特地四處奔波，很了不起呢。」"
1013903-155 = "[ns] 「仁子之所以被稱為『小隊的媽媽』，果然是有理由的呢。」"
1013903-156 = "呵呵……「小隊的媽媽」啊。"
1013903-157 = "雖然隊員們經常這麼稱呼我，從老師口中聽到還是有點難為情呢……"
1013903-158 = "而且要自稱媽媽，我在各方面都還遠遠不足呢。"
1013903-159 = "[s] 「在我看來，仁子絕對能成為一位很好的媽媽。」"
1013903-160 = "啊哈哈……"
1013903-161 = "您過獎了……不過還是謝謝您。"
1013903-162 = "特賣時段也差不多要結束了呢。"
1013903-163 = "剩下的食材……大概就只剩下洋蔥和咖哩粉了。"
1013903-164 = "[s] 「香料區看起來很空，我馬上去拿來。」"
1013903-165 = "啊，老師。請稍等一下。"
1013903-166 = "[s] 「難道買咖哩粉的時候也有必須記住的規則嗎？」"
1013903-167 = "不。不是那樣……這是只有我知道的秘密。"
1013903-168 = ""
1013903-170 = ""
1013903-171 = ""
1013903-172 = "像咖哩這種工業製品，別家超市更便宜哦。"
1013903-173 = ""
1013903-175 = ""
1013903-176 = ""
1013903-177 = "所以我先去把購物籃裡的東西結完帳，然後在超市外面會合吧！"
1013903-178 = ""
1013903-180 = ""
1013903-182 = "（之後和仁子一起去別家超市買咖哩粉，並回到了夏萊）"
1013903-183 = "（仁子做的咖哩嚐起來十分高級，讓人難以相信是用打烊特賣的食材做出來的……）"
