[translation]
1013903-1 = "Niko's Grocery Shopping"
1013903-2 = "In the evening, I headed over to meet with Niko and help with her operation."
1013903-3 = "I had been nervously anticipating what an SRT special mission would look like...and if it'd be dangerous."
1013903-4 = ""
1013903-8 = "But I got to the location Niko sent me and found myself in front of a crowded grocery store."
1013903-9 = "[ns1] \"Um, Niko...\"\n[ns2] \"...Where are we?\""
1013903-12 = ""
1013903-13 = "Yes. This is the target location for the FOX Squad's special supply mission. Point Mike."
1013903-14 = "This may appear to be a normal crowd on a peaceful street..."
1013903-15 = "But don't let your guard down, Sensei. It's actually a warzone."
1013903-16 = "[s3] \"A warzone...?\"\n[s4] \"Did someone threaten a terrorist attack?\""
1013903-19 = "No, nothing that serious."
1013903-20 = "I think it would be easier to just show you."
1013903-21 = "Here, Sensei. Follow me."
1013903-22 = ""
1013903-24 = ""
1013903-27 = "I followed Niko inside the grocery store to find complete and utter chaos."
1013903-28 = "A while later..."
1013903-31 = "It is now 6 PM. Therefore..."
1013903-32 = "We'll now begin our closing sale!"
1013903-33 = "RAAAAAAH!"
1013903-34 = ""
1013903-36 = ""
1013903-37 = ""
1013903-38 = "[ns] \"Gah! The crowd...!\""
1013903-39 = "We can't panic here, Sensei."
1013903-40 = "Let's make our way to Delta 3, the vegetable section, and secure carrots first!"
1013903-41 = "[s] \"Y-Yes, ma'am!\""
1013903-42 = ""
1013903-43 = ""
1013903-44 = "All vegetables are on sale for 99 yen starting now?"
1013903-45 = "Ugh, I can't hesitate! There are too many people!"
1013903-46 = "Which one would be better? This one, or this one?"
1013903-47 = "I'll just start with whatever I can grab—"
1013903-48 = ""
1013903-50 = ""
1013903-51 = ""
1013903-52 = ""
1013903-53 = "Did anyone see that just now?!"
1013903-54 = "That student! She slipped right through the crowd and picked out a plump, juicy carrot!"
1013903-55 = "The carrots are covered in dirt! How did she pick such a perfect one, and so quickly?"
1013903-56 = ""
1013903-58 = ""
1013903-59 = ""
1013903-60 = "You'll generally find that dirtier carrots are fresher than the cleaned ones, as those tend to be treated with preservatives. But that also means you can't judge on color alone."
1013903-61 = "Instead, just check the core of the carrot stalk! That'll tell you how fresh it is."
1013903-62 = "[s5] \"Y-You're amazing, Niko...\"\n[s6] \"Just navigating the crowd took all my energy.\""
1013903-65 = "You give me too much credit. This is nothing compared to our usual missions."
1013903-66 = "Next up is Delta 5—the potato section."
1013903-67 = "Please guard the shopping basket with everything you have, Sensei!"
1013903-68 = "[ns] \"I won't let you down, Niko!\""
1013903-69 = ""
1013903-71 = ""
1013903-72 = "Augh! I was eyeing that potato! How'd she grab it so fast?!"
1013903-73 = "That's no ordinary student!"
1013903-74 = "We need to act fast, or she'll get all the good stuff before we can!"
1013903-76 = ""
1013903-77 = "Phew! That should cover the vegetables."
1013903-78 = "Next up is Sector Charlie 1—the meat section..."
1013903-79 = "[s] \"Am I on basket duty again?\""
1013903-80 = "No. The meat section alternates sales on pork and beef every 10 minutes starting at 6:10, so if we try to buy one at a time, we won't make both of them."
1013903-81 = "Sensei, I'll handle the beef at Point Bravo, so please take care of the pork at Point Papa while I do that!"
1013903-82 = "Your objective is a 200-gram pack of pork belly..."
1013903-83 = "Sensei, under no circumstances should you make a move before the clerk puts the half-price sticker on it!"
1013903-84 = "[s] \"U-Understood...!\""
1013903-86 = "It was easier said than done without Niko there. The crowd around Point Papa was ruthless."
1013903-88 = ""
1013903-89 = ""
1013903-90 = ""
1013903-91 = "Move, move, move! I've had my eye on that pork shoulder this whole time!"
1013903-92 = "Pork ribs are 30% off? Now that's a deal I simply can't resist!"
1013903-93 = ""
1013903-95 = ""
1013903-96 = ""
1013903-97 = "Excuse me. I'll be passing through here first."
1013903-98 = ""
1013903-100 = ""
1013903-101 = "Then I'll also squeeze through..."
1013903-102 = ""
1013903-104 = ""
1013903-106 = "[ns] \"Ugh...\""
1013903-107 = "I was swept to-and-fro by the crowd, but never got any closer to the display."
1013903-108 = ""
1013903-111 = "Next up, we're kicking off a sale at the meat section!"
1013903-112 = "[ns] \"(Now...!)\""
1013903-117 = "[ns7] \"Huh? This one's only 30% off...?\"\n[ns8] \"I swore it was a half-price sticker!\""
1013903-121 = ""
1013903-122 = "Hehe... First time at this supermarket, whippersnapper?"
1013903-123 = "The 30% off stickers at this supermarket look a lot like the 50% off stickers, so it's easy for beginners to mix them up!"
1013903-124 = "What are you looking at? That's the frozen meat section!"
1013903-126 = "Overwhelmed by the energy of the seasoned shopping veterans, I ended up grabbing the wrong items."
1013903-127 = ""
1013903-128 = "FOX 2 has returned."
1013903-129 = "Sensei. Have you secured the objective?"
1013903-130 = "[s9] \"Sorry, I got completely overwhelmed...\"\n[s10] \"I was only able to find one that was 30% off.\""
1013903-133 = "That's no worries! I managed to get beef at 70%, so we even out!"
1013903-134 = "[s11] \"A 70% discount?!\"\n[s12] \"How did you even manage that?\""
1013903-137 = "Fufu, some would call it \"the art of negotiation.\""
1013903-138 = "After all, conducting successful negotiations is a required skill in the special forces."
1013903-139 = "[ns] \"I'm once again blown away by SRT's skills...\""
1013903-141 = "[ns13] \"But have times been tough recently?\"\n[ns14] \"Do you need more money for food? I can help you out.\""
1013903-144 = "No, meals are a part of our responsibility on missions. I can't accept your help."
1013903-145 = "While making sure we're properly fueled is obviously important, there's no guarantee that we'll always have access to good ingredients."
1013903-146 = "That's why we learn a variety of survival skills, like securing stable food sources no matter where we are. Whether we're in the mountains or behind enemy lines, we have to be able to keep ourselves fed."
1013903-147 = "After all, no operation can proceed smoothly if we're skipping meals."
1013903-148 = "Ever since being paroled from the Corrections Bureau, we've been receiving a budget from the General Student Council, but it's not enough for missions."
1013903-149 = "I want to make sure my squad members get all the nutrition they need, so I've gotten pretty used to coupon clipping."
1013903-150 = "I suppose it may all look a bit pitiable from your perspective, doesn't it, Sensei?"
1013903-151 = "[ns15] \"No, no! I wasn't thinking that at all!\"\n[ns16] \"I'm actually impressed at your dedication to your squad.\""
1013903-155 = "[ns] \"Now I understand why they call you the 'squad mom.'\""
1013903-156 = "Heehee. \"Squad mom,\" you say?"
1013903-157 = "I hear that all the time from them, but it's a little embarrassing when it's coming from you."
1013903-158 = "I don't think I quite qualify for that role."
1013903-159 = "[s] \"You would make a great mother, Niko.\""
1013903-160 = "Ahaha..."
1013903-161 = "That's too kind of you, but thank you."
1013903-162 = "It looks like the sale is almost over now."
1013903-163 = "I need to go back and get some onions, and we'll need curry powder too."
1013903-164 = "[s] \"The spice section looks quiet, so I'll go get that.\""
1013903-165 = "Ah, Sensei. Just a second."
1013903-166 = "[s] \"Are there special tricks to buying curry too?\""
1013903-167 = "No, nothing like that... This is a secret, okay?"
1013903-168 = ""
1013903-170 = ""
1013903-171 = ""
1013903-172 = "Industrial products like curry are cheaper at another supermarket."
1013903-173 = ""
1013903-175 = ""
1013903-176 = ""
1013903-177 = "Then, let's get our items and check out!"
1013903-178 = ""
1013903-180 = ""
1013903-182 = "Niko and I stopped by the last supermarket to get curry powder, then we returned to Schale."
1013903-183 = "The curry Niko made was so delicious, you would never believe the ingredients all came from a supermarket's closing sale."
