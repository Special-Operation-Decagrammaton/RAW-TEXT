1013903-122 = "ฮุฮุ... เพิ่งเคยมาซูเปอร์มาร์เก็ตนี้เป็นครั้งแรกเหรอ?"
1013903-123 = "สติกเกอร์ลด 30% กับ 50% ของซูเปอร์มาร์เก็ตนี้น่ะคล้ายกันมาก ถ้าไม่สังเกตให้ดีก็แยกไม่ค่อย#nออกหรอกนะ!"
1013903-124 = "มัวแต่ไปดูอะไรอยู่น่ะ? ตรงนั้นคือโซนเนื้อแช่แข็งต่างหาก!"
