1013903-8 = "(แต่สถานที่ที่มาถึงก็ต่างจากที่คาดเดาไว้โดยสิ้นเชิง เพราะเป็นซูเปอร์มาร์เก็ตขนาดใหญ่ที่มีผู้คน#nพลุกพล่าน...)"
