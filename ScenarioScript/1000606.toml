[translation]
1000606-1 = "상냥한 치료"
1000606-2 = "게헨나 학원의 양호실"
1000606-4 = "……."
1000606-5 = "[s] \"이오리, 괜찮아?\""
1000606-6 = "까, 깜짝이야. 누군가 했더니 선생님이잖아."
1000606-7 = "상처는 심하지 않냐고? #n응, 괜찮아."
1000606-8 = "선도부 활동을 하다보면 이 정도의 부상은 흔한 일이니까. 신경 쓰지 마."
1000606-9 = "소독? 이제 와서 무슨 소리를 하는 거야. #n치료는 이미 선생님이 오기 전에 마쳤다고."
1000606-10 = "……으음."
1000606-11 = "하지만 등 뒤에는 손이 닿지 않아서…… 제대로 붕대를 감지 못했어."
1000606-12 = "혹시 괜찮으면 선생님이 대신 붕대를 감아주지 않을래?"
1000606-13 = "이 제복은 옷 뒤 여밈이 불편해서…… 잠깐 눈 좀 감아봐."
1000606-16 = "……이상한 생각 하지 마."
1000606-22 = "됐어. #n눈 떠도 돼."
1000606-25 = "[wa:500]― 뭐야, [wa:500]그 표정은…… [wa:1500]이상한 생각 하는 건 아니지?"
1000606-28 = "[wa:500]― 언제까지 지켜 보고만 있을 거야? [wa:1000]빨리 해 줘.[wa:200]"
1000606-31 = "― 우읏…… [wa:1300]윽, [wa:1200]하읏……!"
1000606-33 = "― 아팠냐고? [wa:3000]게, [wa:500]게헨나 선도부의 선도부원이 [wa:1200]겨우 이런 걸로 아파할 리가 없잖아!"
1000606-36 = "― 다만…… [wa:1000]조금 [wa:1000]간지러웠을 뿐이야."
1000606-39 = "― 뭐하고 있어. [wa:1500]붕대가 흐트러지잖아."
1000606-42 = "[wa:500]― 선생님이라면…… [wa:2000]손이 닿는 것 정도는 [wa:1200]신경 쓰지 않으니까."
1000606-44 = "― 제대로, [wa:1300]끝까지 해 줘."
1000606-47 = "이후, 붕대를 감아주고 옷을 바로잡아주었다."
1000606-49 = "오늘은…… 치료를 도와줘서 고마웠어."
1000606-50 = "평소에는 이상한 어른이라고 생각했는데…… 진지할 때는 또 진지하구나."
1000606-51 = "다음에 다쳐도 치료해줄 테니 걱정 말라고?"
1000606-52 = "바보, 치료가 받고 싶어서 일부러 다칠 리가 없잖아!"
1000606-57 = "하지만…… 다음에도…… 잘 부탁할게."
1000606-59 = "이오리는 개운해진 표정으로 양호실을 빠져나갔다."
