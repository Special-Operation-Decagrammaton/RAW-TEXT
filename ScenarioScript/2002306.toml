[translation]
2002306-1 = "그 국장의 꿈"
2002306-2 = "샬레 집무실"
2002306-3 = "(여느 때처럼 평범한 오후의 한 때……)"
2002306-9 = "[ns] \"칸나……? 갑자기 무슨 일이야?\""
2002306-10 = "저, 선생님. 바쁘신 중에 방해해서 죄송합니다만……"
2002306-11 = "잠깐 도움을 요청해도 괜찮겠습니까?"
2002306-12 = "[s1] \"응. 물론이야. 괜찮아.\"\n[s2] \"칸나가 전화로 도움을 청하다니 드문 일이네.\""
2002306-15 = "네. 제 힘으로는 도저히 처리할 수 없는 문제와 맞닥뜨려서……"
2002306-16 = "으으…… 으아앙……"
2002306-20 = "[ns] \"뭔가 아이 울음소리 같은 게 들리는데……\""
2002306-21 = "네. 제가 맞닥뜨린 문제가 바로 그것입니다만……"
2002306-24 = "임무를 마치고 학교로 돌아오는 길에 미아와 마주쳐 버렸습니다……"
2002306-25 = "으아아아앙—!"
2002306-28 = "[ns3] \"그러니까 미아의 집을 찾아주려 했는데……\"\n[ns4] \"칸나의 얼굴을 보자마자 울음을 멈추지 않는다고?\""
2002306-31 = "네, 그렇습니다……"
2002306-32 = "공안국의 업무 특성상 어린아이를 대할 일은 거의 없는지라……"
2002306-33 = "위협할 생각은 없었지만 본의 아니게 겁을 준 것 같습니다."
2002306-34 = "흐으윽…… 흑흑……"
2002306-35 = "정보를 캐내기 위해 몇 가지 질문을 던졌지만, 무슨 말을 해도 울음을 멈추지 않아서. 교섭이 쉽게 진행되질 않습니다."
2002306-36 = "생활안전국에 인계하려 했지만, 점심시간이라 그런지 연락이 좀처럼 되질 않아서……"
2002306-37 = "무언가 아이의 울음을 그치게 할 좋은 방법이 없을까요……?"
2002306-38 = "[s] \"가볍게 웃어보는 건 어때?\""
2002306-39 = "웃음, 말씀이십니까……"
2002306-40 = "……노력해 보겠습니다."
2002306-44 = "잠시. 이쪽을 봐주겠나?"
2002306-45 = "(싱긋)"
2002306-46 = "으아아아앙—!"
2002306-50 = "……실패했습니다."
2002306-51 = "[ns] \"곤란하네……\""
2002306-53 = "[ns] \"우선은 도와주러 갈 테니 주소를 알려줄래?\""
2002306-54 = "네? 선생님께서 직접 나오신다고요?"
2002306-55 = "그러실 필요는 없습니다. 시민을 보호하고 안내하는 것 또한 발키리 경찰학교의 업무."
2002306-56 = "발키리 경찰학교의 업무 때문에 바쁘신 샬레의 선생님께 손을 벌릴 수는—"
2002306-57 = "으아아아아앙—!"
2002306-61 = "……D.U. 북구 시바타운의 5거리 입구 앞에서 기다리고 있겠습니다. 부탁드립니다."
2002306-63 = "(이후, 칸나가 말한 장소에 도착하여 놀란 아이를 진정시키고 집 주소와 연락처를 물었다.)"
2002306-64 = "(그 후, 근처를 지나가던 생활안전국 학생에게 부탁하여 미아를 무사히 가족에게 데려다주었다……)"
2002306-67 = "……후우. 오늘은 신세를 졌습니다."
2002306-68 = "선생님께서 도와주시지 않았더라면 아이는 물론이고 저까지 패닉에 빠져 꼴사나운 모습을 보일 뻔했군요."
2002306-69 = "명색이 발키리 경찰학교의 국장이라는 사람이, 미아 하나 혼자 돌보지 못하고 선생님의 도움을 받게 되다니……"
2002306-70 = "역시 선배들의 조언대로 생활안전국에 가지 않길 잘한 것 같습니다."
2002306-71 = "저같이 붙임성 없는 미친개가 생활안전국에 있어봤자 시민들의 불안감을 부추길 뿐이니까요."
2002306-72 = "……역시 공안국에 오길 잘했습니다."
2002306-73 = "[s] \"칸나는 생활안전국에서도 잘했을 것 같은데.\""
2002306-74 = "……진심이십니까?"
2002306-75 = "어린 아이하나도 제대로 달래지 못하는 경찰이 시민의 민원을 제대로 응대할 수 있을 리가 없잖습니까."
2002306-76 = "경찰학교 내에서는 자주 간과되는 사실이지만, 미소로 사람을 응대하고 타인을 안심시키는 것도 타고 나야 할 수 있는 재능입니다."
2002306-77 = "그리고 제게는…… 그런 재능 따윈 없습니다."
2002306-78 = "[ns] \"하지만 칸나는 우는 아이를 계속 달래려고 노력했잖아?\""
2002306-80 = "[ns5] \"뭐든 처음에는 익숙하지 않은 법이니까.\"\n[ns6] \"노력한다면 재능의 차이는 금세 극복할 수 있어.\""
2002306-86 = "……글쎄요."
2002306-87 = "그렇게 말씀하셔도, 지금에 와서 가지 않은 길을 상상하는 건 큰 의미가 없습니다."
2002306-88 = "'미친개'가 아닌 오가타 칸나의 삶이라……"
2002306-89 = "흥미롭기는 하지만, 저에게는 역시 미친개의 옷이 가장 잘 어울리는 것 같습니다."
2002306-90 = "여하튼 다시 한번 도와주신 것에 대해 감사의 인사를 드립니다."
2002306-91 = "다음에는 다른 곳에서, 다른 모습으로, 다시 뵐 수 있기를."
