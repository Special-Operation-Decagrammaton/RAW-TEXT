[translation]
10002030-1 = "제3화;모래성 만들기와 모래찜질 1"
10002030-4 = "자아…… 모래성 만들기…… 다들 잘 하고 있으려나."
10002030-6 = "아, 선생님. 다들 잘 하고 있나요?"
10002030-7 = "잠깐 자리를 비우고 왔는데……."
10002030-8 = "[s1] 말없이 해변 반대편을 응시한다.\n[s2] \"저쪽에……\""
10002030-9 = "……응?"
10002030-10 = "……응?"
10002030-15 = "(두웅-!!)"
10002030-18 = "후에에에에에에~~!?!?!?"
10002030-20 = "뭐, 뭔가요, 아즈사 쨩?! 이건!? 이 사이즈는!? 왜 이렇게까지 한 건가요!? 아니 그전에 어떻게!?"
10002030-21 = "모래성을 만들라고 했잖아. 포트리스, 즉 어떤 공격에도 무너지지 않는 성벽을 만들었지."
10002030-22 = "맞는 말이지만 전혀 맞지 않는 이야기인 거 같은데요!? 그런 말이 아니었는데요!?"
10002030-23 = "그렇잖아도 이 해변은 엄폐물도 참호도 없는 개활지라 맘이 불편했는데 잘 됐어."
10002030-24 = "이 정도면 적의 공세도 막을 수 있을 테니 안심이야."
10002030-25 = "동의합니다. 반대로 이쪽에서는 저격하며 공세를 가하기 딱 좋군요. 저격수에겐 최고의 위치예요."
10002030-26 = "마시로 씨!? 마시로 씨도 같이 거든 건가요!? 두 분이서 같이 만드신 건가요!?"
10002030-31 = "……."
10002030-32 = "……훗."
10002030-33 = "……????"
10002030-34 = "왜 뿌듯해 하시는 거죠!?!?"
10002030-35 = "조금만 더 사진에 어울리는 귀엽고 작은 거로 할 수는 없을까요……?"
10002030-36 = "아니. 적습에 대비하려면 이 정도가 최소 사양이다. 이 이하는 방호의 의미가 없어."
10002030-37 = "소재가 모래라는 것을 지적하고 싶지만, 높으니까 아무래도 상관없지 않을까, 그런 심정입니다."
10002030-40 = "(어찌되었든 다함께 사진은 찍긴 찍었다.)"
10002030-42 = "하, 하우우…… 생각지도 않은 데에서 생각지도 않은 두 사람의 이상한 의기투합이……"
10002030-43 = "그, 그치만 여기는 해변이라고요…… 평범하게 놀러 온 곳이라고요!"
10002030-44 = "적습이라느니 방호라느니…… 그런 건 전혀 필요가 없……"
10002030-48 = "(콰아아아아앙-!!)"
10002030-49 = "……에?"
10002030-51 = "(투타타탕! 타타타타탕! 타탕-!!)"
10002030-52 = "적 발견! 적 발견!! 3시 방향, 해안 반대편! 불량배 다수 출현!!"
10002030-53 = "이것 봐. 적습이잖아."
10002030-54 = "……으, 으응?"
10002030-62 = "크아아아!! 잘도 우리를 공격했겠다?!"
10002030-63 = "아까의 복수를 해주겠어! 동료들을 잔뜩 데리고 왔다고!"
10002030-69 = "기다리던 바다. 지금 바로 대응하겠어."
10002030-70 = "저격수, 뒤를 부탁해."
10002030-71 = "제 실력을 보여줄 때로군요! 맡겨만 주시죠."
10002030-74 = "후에에에에에에에에에에-!?!?"
