[translation]
10008025-1 = "제2화;혼란은 언제나 느닷없이"
10008025-3 = "뭐, 뭐야?! 폭발 소리가 들렸는데 무슨 일이야?!"
10008025-4 = "알바 쨩~ 잘 왔어. 이 녀석들이……."
10008025-8 = "핫핫핫!"
10008025-10 = "뭐, 뭐야……! 저 녀석들은?!"
10008025-11 = "……아무래도 행사장에서 준비한 공연은 아닌가 보네."
10008025-12 = "그런 건 예정에 없거든?! 새해 맞이 이벤트에서 히어로 쇼라니 영문도 모르겠고!"
10008025-14 = "저 녀석들, 카이텐져잖아요!"
10008025-15 = "그 나타났다 하면 주변을 초토화한다던 그 특촬물 매니아 악당?"
10008025-16 = "크윽! 여긴 어쩐 일이지?!"
10008025-18 = "저거, 혹시 알바 쨩의 동료들 아니야? 수영복 복면단의 새로운 코스튬이라거나……?"
10008025-19 = "아니야! 저런 수상한 녀석들하고 동료인 적 없었다구?!"
10008025-20 = "그리고 그건 잊어버려! 흑역사니까!"
10008025-21 = "[s] \"카이텐져라고……!\""
10008025-22 = "앗?! 선생님, 혹시 저 녀석들에 대해 알고 있어?"
10008025-23 = "[s1] \"아니, 처음 본다고 할까…….\"\n[s2] \"B, BD가……! 기술 노트가……! 윽, 머리가!\""
10008025-26 = "으음! 그건 그렇고 제법이구나! 악의 무리들!"
10008025-27 = "레드! 아무래도 저 녀석들, 허투루 볼 수 없는 상대인 것 같아!"
10008025-28 = "푸하핫! 그럼 이제 어쩔 거야?"
10008025-29 = "괜찮다!"
10008025-30 = "어차피 우리의 목적은 여기서 싸우는 게 아니라, 달리 있으니까!"
10008025-31 = "에잇!"
10008025-44 = "새, 새전함이 사라졌어?!"
10008025-45 = "……어?"
10008025-46 = "뭐?!"
10008025-48 = "레드, 새전함의 철거. 완료했습니다. 아르바이트의 성과급에 반영 부탁드립니다."
10008025-49 = "오우! 받은 만큼 일 처리는 완벽하군! 그린!"
10008025-50 = "첫 번째 목표는 완수한 거네!"
10008025-51 = "핫핫핫! 그래! 이 돈은 우리 카이텐져가 공명정대하게 사용하도록 하지!"
10008025-52 = "새전함! 잘 받아 가마!"
10008025-54 = "뭐?!! 뭐라고?!"
10008025-55 = "그럼 아디오스!"
10008025-60 = "[ns3] \"새전함을…….\"\n[ns4] \"……도둑맞았다?\""
10008025-63 = "으, 으아아아아아?! 기다려?!"
10008025-64 = "뭐, 뭐야?! 이거 설마 내 책임은 아니지!? 이대로 아르바이트비 못 받게 된다거나 그러는 건 아니지?!"
10008025-65 = "푸푸풉. 푸핫, 아하하……!"
10008025-66 = "아하하하하! 새전함이 똑! 하고 눈앞에서! 아하하하! 아! 배, 배 아파!"
10008025-67 = "무슨 이런 일이……."
10008025-69 = "어, 어떡하죠. 아루 님?!"
10008025-70 = "어떡하긴!! 당장 뒤쫓아야지! 그 녀석들을!!"
10008025-71 = "맞아! 새전함을 되찾아야지!!"
10008025-72 = "……."
10008025-73 = "글쎄. 아비도스에겐 미안한 일이지만, 이건 우리랑은 관계없는 일이야."
10008025-74 = "뭐?!"
10008025-75 = "도둑맞은 건 어차피 소원을 빌 때 썼던 돈. 새전함을 되찾는다고 해도 결과적으로 우리에게 이득이 되는 건 없어."
10008025-76 = "게다가 저 녀석들, 지명수배되어 있는 골치 아픈 악당들이야. 그런 리스크를 굳이 아무 이해관계도 없는 우리가 질 필요는 없지."
10008025-77 = "……그래! 어차피 너희들에게 기댈 생각 따윈 없었거든? 처음부터 스스로 어떻게든 하려고 했었어!"
10008025-78 = "스스로가 하지 않으면 안 되는 거야! 학교의 부흥도, 알바비의 회수도!"
10008025-79 = "난 뒤쫓을 거니까, 맘대로 해!"
10008025-80 = "[s] \"세리카……! 잠깐……!\""
10008025-81 = "말리지 마! 선생님! 한시가 급한 지금……!"
10008025-86 = "……우리도 뒤쫓는다."
10008025-87 = "응?!"
10008025-88 = "뭐, 뭐?!"
10008025-89 = "……그래. 카요코 과장의 말이 맞아. 새전함에 돈을 낸 시점에서 우리의 볼일은 끝났으니까."
10008025-90 = "새전함이 도난당하건 말건 아무런 이득도 없는 위험을 굳이 감수하면서까지 뒤쫓을 이유는 없겠지."
10008025-91 = "……후후후. 하지만 우리 흥신소 68이 언제 이익이나 손해 득실을 따지면서 행동해 왔었던가?"
10008025-92 = "하아……."
10008025-93 = "그러니까 이건 그저 어디까지나 기분의 문제."
10008025-94 = "즉……."
10008025-96 = "새해 첫날부터 우리가 넣은 돈이 도둑맞았다는, 불쾌한 사실을 용서할 수 없을 뿐이라고! 그것뿐이야!!"
10008025-102 = "헤에……."
10008025-103 = "아, 아루 님……!!"
10008025-104 = "……하아. 그렇게 말할 줄 알았어."
10008025-105 = "저 큰 새전함을 들고 도망쳤다면 퇴각 루트는 정해져 있어. 지금부터 서두른다면 15분 안에 따라잡을 수 있을 거야."
10008025-106 = "게다가 선생님도 있으니까 그 시간은 더 줄일 수도 있을 거고."
10008025-107 = "흐응, 과연~"
10008025-108 = "카요코 쨩. 아루 쨩이 처음부터 그렇게 말할 줄 알고, 미리 조사해놨던 거네?"
10008025-109 = "……뭐. 뻔한 패턴이니까."
10008025-111 = "……치, 치잇. 뭐……"
10008025-112 = "고맙다는 말은 새전함을 되찾고 난 다음에 할 거니까!"
10008025-113 = "[s] \"좋아! 그럼 다 같이 추격이야!\""
10008025-115 = "여, 역시 아루 님!! 이것이 바로 무법자의 마음가짐이군요! 또 배웠습니다!!"
10008025-116 = "흐응. 뭐 아루 쨩은 충동적인 부분이 있으니까."
10008025-117 = "후후……. 충동이 아니라 무법자의 습성이라고 해주겠어?"
10008025-120 = "(사업안망하게해주세요! 사업안망하게해주세요 사업안망하게해주세요 사업안망하게해주세요----!!!)"
10008025-125 = "그 염원이 이루어지기도 전에 저 새전함에 [ruby=不淨]부정[/ruby]이 묻는다면……."
10008025-126 = "빌었던 소원들이 그대로 뒤집혀서 이루어지게 되겠지요!"
10008025-129 = "(되찾지 못하면 서, 설마…… 아니, 아무리 그래도……)"
10008025-130 = "(바, 반드시 그 전에 되찾아야 해!!)"
