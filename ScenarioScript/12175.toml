[translation]
12175-2 = "적들의 공격이 시작되었습니다!"
12175-3 = "막아야 한다!! PMC의 병력을 집중해라!!"
12175-4 = "북쪽과 동쪽에서 협공을 해! 북쪽! 북쪽의 대(對) 데카그라마톤 방어대대를 보내라!!"
12175-5 = "네!"
12175-6 = "……!! 북쪽에 소수의 병력이 확인되었습니다!"
12175-7 = "뭣?! 아비도스의 지원군인가?!"
12175-8 = "아, 아닙니다……! 숫자는 3명…… 그러나…… 저것은……!"
12175-10 = "……."
12175-11 = "카이저 PMC의 증원군, 조우. 대대 규모입니다. 부장님."
12175-12 = "알겠어. 준비해."
12175-13 = "하아…… 어쩌다 여기까지 와서……."
12175-14 = "(……저는 왜 끌려온 거죠?)"
12175-15 = "업무를 남겨두고 온 거니까 빠르게 끝내고 복귀한다."
12175-16 = "반성문 대신 부장님이 관대하게 허락해주신 봉사활동이니까, 다들 불평은 적당히 하시고요."
12175-17 = "여기서 적을 막는다. 단 한명도 선생에게 접근시키지 않겠어."
12175-20 = "간다."
12175-23 = "다음화;그럼에도 놓지 않은 1"
