[translation]
10051040-1 = "제4화;닌자와 도둑"
10051040-2 = "패션쇼 연회장 내부"
10051040-4 = "흐흥~."
10051040-5 = "으흥흥~."
10051040-6 = "(긴장했는데…… 생각보다 할 일이 없네…….)"
10051040-7 = "(사람들도 다들 젠틀해서 별문제도 없고…….)"
10051040-8 = "(이즈나랑 츠쿠요랑 무전으로 떠들기나 할까?)"
10051040-9 = "(잡담의 테마는, 흐음…… 지루한 잠입의 상황 속에서 닌자가 지켜야 할 도는 무엇인가?)"
10051040-10 = "(잠입 상황에서는 주먹밥을 먹어야 하는가, 병량환을 먹어야 하는가…….)"
10051040-11 = "(뭐 이런 내용으로……?)"
10051040-12 = "[s] \"아 미치루, 여기 있었구나.\""
10051040-13 = "우냐악! 까, 깜짝이야!"
10051040-14 = "선생님? 선생 공도 여기 온 거야?"
10051040-15 = "잠깐, 혹시 그때처럼 갈아입는 걸 훔쳐보러 온 건가……!"
10051040-16 = "[s] \"아냐!\""
10051040-17 = "그러면 설마…… 모델로 데뷔하기 위한 첫 무대를 이곳으로 택한 건가!"
10051040-18 = "역시! 선생 공도 보기보다 만만치 않은걸!"
10051040-19 = "[s] \"아니, 나는 그냥 초청장을 받아서 온 것뿐이라고!\""
10051040-20 = "아, 초청받은 거였어? 이런, 시시한 이유였군."
10051040-21 = "사실은 말이지, 내심 무대 위에 서서 워킹하게 될 선생님의 모습을 기대했다구."
10051040-22 = "[s] \"아니, 나는 별로 보고 싶지 않은데…….\""
10051040-23 = "음? 패션모델의 삶은 별로 당기지 않는 거야?"
10051040-24 = "그렇다면 역시 선생 공은 패션모델보다는 닌자가 더 마음에 끌리는 것인가!"
10051040-25 = "[s] \"얘기가 그렇게 되는 거야?!\""
10051040-26 = "냐하하! 어쨌든 말이야 선생 공, 이런 자리에서 또 만나게 되니 반갑네."
10051040-27 = "안 그래도 소생, 심심해서 힘들던 참이었으니 말이야!"
10051040-28 = "지나가던 행인을 아무나 앰부쉬 해버리고 싶을 정도로 말이야!"
10051040-29 = "[s] \"닌자가 그래도 되는 거야?!\""
10051040-30 = "물론, 인사 전엔 1회의 앰부쉬가 허락되긴 하지만……."
10051040-31 = "……당연히 여기선 하면 안 되지."
10051040-32 = "그래서 심심하게 여기서 왔다 갔다 하고 있었다, 뭐 이런 이야기야."
10051040-33 = "격식 있는 자리라 그런가, 정말로 아무런 일도 벌어지지 않더라고."
10051040-34 = "[s] \"그런데 보통 그런 말을 하면 꼭 뭔가 일이 터지던데…….\""
10051040-35 = "에이 선생 공, 그런 징크스를 믿는 거야?"
10051040-36 = "이런 곳에서 일이 터져 봐야 뭐 별거 아니겠……."
10051040-38 = "삐비비빅!"
10051040-41 = "에엣."
10051040-42 = "아이에에에에엑?!"
10051040-43 = "이, 이건 비상 무전 신호인데……?!"
10051040-44 = "언더커버 팀, 들립니까?"
10051040-45 = "어, 언더커버01, 여기!"
10051040-46 = "잘 들으세요, 조금 전에 샤인캣 디자이너님의 의상들이 도난당했어요."
10051040-47 = "이대로 가면 저희 패션쇼는…… 그대로 망합니다!!"
10051040-48 = "오늘 온 관객들은 모두 샤인캣 디자이너님의 작품을 보러 온 거니까요!"
10051040-49 = "히, 히익?!"
10051040-50 = "현장 상황을 종합해 봤을 때 범인은 아마 멀리 못 갔을 겁니다. 아직 행사장 안에 있을 확률이 높아요!"
10051040-51 = "그, 그러면 어떻게……."
10051040-52 = "어떻게 하긴요! 도둑 잡아야죠! 저희가 왜 여러분을 고용했다고 생각하십니까!"
10051040-53 = "그, 그건 그렇긴 한데……!"
10051040-54 = "무슨 수를 써서라도 잡아 와요! 알겠어요?"
10051040-55 = "자, 잠깐만! 그러면 인상착의라도……!"
10051040-57 = "무슨 소리를 하는 거예요? 도둑의 인상착의를 알았으면 저희가 잡았겠죠!"
10051040-58 = "그것도 그러네?!"
10051040-59 = "그, 그러면 알겠습니다!!"
10051040-63 = "후우우우……."
10051040-64 = "어쩌지…… 선생 공의 말이 맞아 버렸어……."
10051040-65 = "어……? 선생 공도 도와주겠다고?"
10051040-66 = "후우우……."
10051040-67 = "후…… 후후……."
10051040-68 = "그, 그렇다면 어쩔 수 없지! 여기선 닌자의 진면목을 보여줄 수밖에!!"
10051040-69 = "언더커버02, 언더커버03! 응답 바란다!"
10051040-70 = "언더커버02 여기 있습니다! 닌닌!"
10051040-71 = "언더커버03 여기……예요!"
10051040-72 = "자, 조금 전 무전은 다들 들었지? 우리는 지금부터 의상을 훔쳐 간 범인을 잡는다!"
10051040-73 = "물론 어떻게 생겼는지는 아무도 몰라! 하지만 어떻게 해서라도 잡아내고 만다!"
10051040-74 = "알지? 닌자란, 자고로 어떤 궁지에 몰리더라도……!"
10051040-75 = "어떠한 역경에 부딪치더라도!"
10051040-76 = "저……절대 포기하지 않는 법……이니까요!"
10051040-80 = "좋아! 가자!!"
10051040-82 = "패션쇼 행사장 뒤뜰의 숲"
10051040-86 = "좋아, 빠져나왔다."
10051040-87 = "역시 배달부로 위장하니 아무도 의심을 안 하는군."
10051040-88 = "그나저나 샤인캣 님…… 아니 평소에는 늘 아슬아슬하게 행사장에 도착하시더니 오늘은 갑자기 왜 일찍 오신 거야? 까딱하면 마주칠 뻔했잖아."
10051040-89 = "뭐…… 그래도 작품은 제대로 구출해서 나왔으니 다행이지만."
10051040-90 = "거기다 이렇게 수풀이 우거진 곳에서는 나를 찾아내기도 어려울 거고……"
10051040-91 = "자 어쨌든…… 마침내 샤인캣 님의 작품을 확보했다……!"
10051040-93 = "아아, 샤인캣. 내 삶의 빛, 내 생의 불꽃……!"
10051040-94 = "가장 위대한 디자이너가 패션쇼에 선보일 용도로 만든, 세상에서 단 한 벌뿐인 옷……!"
10051040-95 = "하지만 모든 옷은 결국 누군가에게 입혀질 수밖에 없고, 슬프게도 그렇게 훼손되고 마는 법……."
10051040-96 = "더 많은 사람들에게 영감을 줄 수도 있었던 작품이, 일개 소모품으로 전락하는 비극이 거기에 있는 것이다……!"
10051040-98 = "그러니 우리 '다다이스틱 헬멧단'이 나설 수밖에……!"
10051040-99 = "진정으로 위대한 옷은, 영원히 착용되지 않음으로서 불멸의 가치를 얻는 법이니까."
10051040-100 = "그러니 이 작품은 엠버밍 처리를 한 뒤에, 영원히 우리 조직의 사무실에 걸어 두어야겠어."
10051040-101 = "후후후, 우후후, 후후후……."
10051040-107 = "뭐야, 언제부터 여기에 나무가 있었지?"
10051040-108 = "저…… 저는 나무가 아닌데요오오……."
10051040-109 = "그렇지? 하긴 어떤 나무가 갑자기 나타나서 앞길을 가로막고 그러겠어."
10051040-110 = "자, 그럼 난 이만 가본다?"
10051040-111 = "가, 가면 안 돼요……!"
10051040-112 = "왜?"
10051040-113 = "옷, 훔치셨잖아요……."
10051040-114 = "훔치다니!"
10051040-116 = "이 옷의 진정한 가치를 끌어내어 줄 수 있는 곳으로 옮겨 놓을 뿐이다!"
10051040-117 = "이 작품의 위대함이 훼손되지 않을 곳으로!"
10051040-118 = "이것 봐, 이런 엄청난 옷이, 누군가에게 입혀지고 그로 인해 낡고 해져 버린다면…… 그건 너무나 슬픈 일 아니겠어?"
10051040-119 = "이…… 이유야 어떻든 절도잖아요……"
10051040-120 = "쯧, 이래서 예술의 가치를 모르는 문외한들이란……."
10051040-121 = "예술이 무엇인지도 모르면서 사람을 함부로 도둑으로 몰고 있…… 아니 잠깐만."
10051040-122 = "……나 왜 너랑 대화하고 있냐?!"
10051040-127 = "여, 여긴 언더커버03! 도둑 발견! 뒤뜰 조각상 옆이에요!!"
10051040-128 = "젠장! 경비원이었나!! 비켜!!"
10051040-129 = "시…… 싫을래요!"
10051040-130 = "저는 닌자니까!!"
10051040-131 = "닌자가 뭔데?!"
10051040-142 = "패션쇼 행사장 내부"
10051040-144 = "무전 들었지?! 츠쿠요가 도둑을 발견했어! 뒤뜰이야!"
10051040-145 = "출동입니다! 부장님!"
10051040-147 = "패션쇼 행사장 뒤뜰의 숲"
10051040-148 = "허억, 허억…… 이 녀석, 뭐가 이렇게 힘이 좋아?"
10051040-159 = "니, 닌자는 절대로 포기하지 않으니까요!"
10051040-160 = "그러니까 대체 닌자가 뭔데?! 이거 놔!!"
10051040-161 = "모, 못 놔요!!"
10051040-163 = "[ns] \"아니, 이제 놔 줘도 돼, 츠쿠요.\""
10051040-164 = "왜냐면!"
10051040-165 = "우리도 함께 싸울 거니까요, 닌닌!"
10051040-169 = "지금부터는 우리도 가세한다!!"
10051040-170 = "부장님……! 이즈나 쨩……!"
10051040-171 = "이 비겁한 놈들! 여럿이서 한 명을 공격하다니!"
10051040-172 = "남의 옷 훔쳐 간 건 안 비겁하고?"
10051040-173 = "시, 시끄러워! 훔친 게 아니라 이 작품이 제대로 대접받을 수 있는 곳으로……."
10051040-174 = "에잇, 됐다! 어차피 이런 상황이 올 것쯤은 이미 다 예상하던바!"
10051040-176 = "다다이스틱 헬멧단! 집합!!"
10051040-185 = "자, 동지들이여! 이 작품이 이곳을 빠져나갈 때까지……"
10051040-186 = "나를 지켜라!"
