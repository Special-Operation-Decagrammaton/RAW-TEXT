[translation]
1013905-1 = "Niko's Consultation"
1013905-2 = "That day, I'd had terrible luck from the moment I'd woken up."
1013905-4 = "Schale Night Duty Room"
1013905-6 = "[ns] \"Mmm... Ugh...\""
1013905-7 = "Giddy up, ride, ride!"
1013905-8 = "Vroom, vroom! Let's go!"
1013905-9 = "Heehee. That meal was sooo good!"
1013905-10 = "[ns] \"Why is it so noisy today, of all days...\""
1013905-11 = "No brakes, just vibes! I think we hit sub three minutes today! On a public road too."
1013905-12 = "The Vroom Vroom Race Association was pretty sick too. Today's match is gonna be awesome."
1013905-13 = "Captain, let's ride through the night!"
1013905-14 = "I told you to call me \"President!\""
1013905-15 = "[ns] \"I can't sleep...\""
1013905-18 = "Thanks to the racket made by the Biker Gang Members racing around Schale all night, I couldn't get a wink of sleep..."
1013905-20 = ""
1013905-21 = "[ns] \"Excuse me, you dropped your handkerchief.\""
1013905-22 = ""
1013905-23 = "[ns1] \"Maybe they didn't hear...?\"\n[ns2] Run after them to return the handkerchief."
1013905-29 = ""
1013905-30 = "Officer, it's this person!"
1013905-31 = "I've had the weird feeling that someone's been watching me lately..."
1013905-32 = "And I'm 100% certain! They're the stalker!"
1013905-33 = ""
1013905-34 = "[ns] \"No, wait, I just wanted to return this—\""
1013905-35 = "\"Return\" something? Hey, do you ever consider how the victim of your stalking would feel?"
1013905-36 = ""
1013905-38 = ""
1013905-39 = "Come to think of it, you look familiar... Have I seen you on a wanted poster or something?"
1013905-40 = "You. Come with me to the station for now. We'll listen to your excuses there."
1013905-41 = "[s] \"This is a huge misunderstanding!\""
1013905-43 = "I lost quite a bit of time to that \"misunderstanding.\""
1013905-44 = ""
1013905-45 = "...So she assumed I had spoken ill of her just based on the rumors."
1013905-46 = "I thought we were friends...but to just go and believe the rumors without even asking me?"
1013905-47 = "Our relationship is over now. It's all over!"
1013905-48 = "[s] \"Okay, let's calm down and think this through again.\""
1013905-49 = ""
1013905-50 = ""
1013905-52 = "[ns3] \"Maybe there's more to her side of the story.\"\n[ns4] \"You should try to talk to her—\""
1013905-55 = "Sensei, are you taking her side right now?!"
1013905-56 = "How else can I put it? There was NO other way to see this!"
1013905-57 = "[s] \"No, that's not what I meant...\""
1013905-58 = "...Ugh. Of course you think I'm being unreasonable too."
1013905-59 = "You wouldn't even look at me while I was talking to you!"
1013905-60 = "I have to go."
1013905-61 = ""
1013905-63 = ""
1013905-64 = "[ns] \"H-Hold on...!\""
1013905-67 = "Maybe the exhaustion was getting to me, but I messed up during a student's consultation too."
1013905-68 = "The day had already been filled with one failure after another. I felt like I couldn't even think straight anymore."
1013905-69 = "All the problems I encountered had either been my fault or circumstances outside of my control, but I didn't feel like I could vent to anyone about it."
1013905-75 = "Later that day..."
1013905-78 = ""
1013905-79 = "Hello, Sensei. I've come to help you out with the rest of your work day."
1013905-80 = "I managed to get some good tea leaves during a recent mission, so I brought them to share—"
1013905-81 = "Oh, Sensei. Are you feeling all right?"
1013905-82 = "You look really tired."
1013905-83 = "[s5] \"It's nothing.\"\n[s6] \"I'm fine, so let's get started with work.\""
1013905-86 = "You say that, but you look really tired."
1013905-87 = "Did something happen today?"
1013905-88 = "[ns] \"It's okay. Besides...\""
1013905-90 = "[ns] \"It has nothing to do with you, Niko.\""
1013905-91 = ""
1013905-92 = "[ns] \"Sorry, I didn't mean it like that.\""
1013905-93 = ""
1013905-94 = ""
1013905-95 = "I didn't take it that way! And since I'm an uninvolved third party, who better to tell?"
1013905-96 = "Okay, Sensei. We're putting off the second half of your work day. Follow me!"
1013905-100 = "Niko grabbed me by the hand and pulled me down the hallway to the Night Shift Room."
1013905-102 = ""
1013905-103 = "All right, Sensei. Please lie down on the bed."
1013905-104 = "[s7] \"I appreciate your concern, Niko, but...\"\n[s8] \"It's still early, so I don't think I'll be able to fall asleep.\""
1013905-107 = "I'm not saying you should go to sleep."
1013905-108 = "Lie down on the bed, close your eyes, and tell me what happened today."
1013905-109 = "Just say whatever comes to mind, even if it seems like an unimportant detail."
1013905-110 = "You can be as specific or as vague as you want."
1013905-111 = "Just relax and unburden yourself a little."
1013905-112 = "[s] \"I can't do that to one of my students...\""
1013905-113 = "Then I'll trap you in that bed until you answer!"
1013905-114 = "We learn PLENTY of different restraint techniques at SRT. Would you like a live demonstration?"
1013905-115 = "[s9] \"A-All right!\"\n[s10] \"Just for a little bit, then...\""
1013905-119 = "I laid down, and following Niko's instructions, I went through what had happened that day."
1013905-120 = "She let me talk and talk, encouraging me with small nods and comments to show she was listening."
1013905-122 = ""
1013905-123 = "...I understand now."
1013905-124 = "We all have days like that."
1013905-125 = "All of the little events themselves are pretty trivial, but it's death by a thousand cuts."
1013905-126 = "It seems silly to vent about them, but it's more of a strain when you bottle it all up inside."
1013905-127 = "[s11] \"Exactly. I'll get over it soon enough.\"\n[s12] \"I didn't mean to worry you over something like this.\""
1013905-130 = "Please don't say that."
1013905-131 = "As I already mentioned, the more trivial the matter, the easier it is for it to be overlooked and fester."
1013905-132 = "No matter how silly it seems, it's good to get it off your chest."
1013905-133 = "How do you feel now that you've said it all out loud?"
1013905-134 = "[s13] \"Yeah. I do feel a little better.\"\n[s14] \"Thank you, Niko.\""
1013905-137 = "Don't worry about it."
1013905-138 = "I think it can be even harder for adults to be honest about their feelings."
1013905-139 = "So, as you always tell us, it's okay to rely on people a little more. Even us students."
1013905-140 = "[s] \"I think I do my best to be honest with my students.\""
1013905-141 = "I'm not saying that you're lying."
1013905-142 = "But lying-by-omission is a thing, you know."
1013905-143 = "So my request is that you speak your mind freely, without cherry picking what you decide to share with others."
1013905-144 = "[s] \"...I'll try.\""
1013905-145 = "...So high-maintenance."
1013905-146 = ""
1013905-148 = ""
1013905-149 = ""
1013905-150 = "I guess that's why there are quick-witted students like me around to help troublesome old adults like you."
1013905-152 = "I stayed in the bed for a little longer, chatting with Niko, and then returned to the office feeling much more at ease."
