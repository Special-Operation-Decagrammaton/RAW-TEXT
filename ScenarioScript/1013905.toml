[translation]
1013905-1 = "仁子的諮詢"
1013905-2 = "（那天從凌晨開始，運氣就糟糕透頂……）"
1013905-4 = "夏萊值班室"
1013905-6 = "[ns] 「唔嗯……唔唔……」"
1013905-7 = "呀哈──！衝啊衝啊！"
1013905-8 = "轟隆隆隆，衝啊──！"
1013905-9 = "哈哈……今天的飯也很好吃啊。"
1013905-10 = "[ns] 「今天怎麼這麼吵啊……」"
1013905-11 = "居然可以不踩煞車3分鐘就跑完那條公路……你們挺有兩下子的嘛？"
1013905-12 = "你們轟隆轟隆飆速聯盟也不賴啊。#n今天這場勝負，感覺會相當精彩啊。"
1013905-13 = "老大，今晚就讓我們一路飆到底吧！"
1013905-14 = "叫我總長啦！"
1013905-15 = "[ns] 「睡不著……」"
1013905-18 = "（因為整晚在夏萊周邊製造噪音的飆車族，所以沒能好好入睡……）"
1013905-20 = ""
1013905-21 = "[ns] 「那個，您的手帕掉了哦。」"
1013905-22 = ""
1013905-23 = "[ns1] 「是沒聽見嗎……？」\n[ns2] 為了歸還手帕追上前去"
1013905-29 = ""
1013905-30 = "警察先生，就是這個人！"
1013905-31 = "我最近一直覺得有人跟在我後面……"
1013905-32 = "肯定就是這個人在跟蹤我沒錯！"
1013905-33 = ""
1013905-34 = "[ns] 「不是，我只是來把東西還給──」"
1013905-35 = "……東西？喂，你都不顧收東西的人的感受嗎？"
1013905-36 = ""
1013905-38 = ""
1013905-39 = "話說回來，總覺得你有點眼熟……是在通緝海報上看過嗎？"
1013905-40 = "總之先跟我回警局一趟。#n要辯解的話，到局裡再聽你說。"
1013905-41 = "[s] 「這，這是誤會啊！」"
1013905-43 = "（受了莫名其妙的誤會，被耽擱了好一陣子……）"
1013905-44 = ""
1013905-45 = "……所以他肯定是光憑那個傳聞，就認定是我在說他的壞話。"
1013905-46 = "虧我還當他是朋友……居然連問都不問就對那個傳聞信以為真。"
1013905-47 = "我們的關係已經結束了……全都結束了！"
1013905-48 = "[s] 「先冷靜下來，重新想想看吧。」"
1013905-49 = ""
1013905-50 = ""
1013905-52 = "[ns3] 「說不定那位朋友也有什麼難以啟齒的苦衷啊？」\n[ns4] 「再慢慢地談一次──」"
1013905-55 = "老師，您現在是在幫他說話嗎！？"
1013905-56 = "我都說過好幾次了，這其中根本沒有半點誤會的餘地！"
1013905-57 = "[s] 「不，我不是那個意思……」"
1013905-58 = "……果然，老師您也認為我在無理取鬧吧。"
1013905-59 = "難怪今天諮詢的整段時間，您都不肯跟我對上眼。"
1013905-60 = "打擾了。"
1013905-61 = ""
1013905-63 = ""
1013905-64 = "[ns] 「等，等一下……！」"
1013905-67 = "（……或許是過於疲憊，在和學生的諮詢中也犯了致命的錯誤）"
1013905-68 = "（一整天反覆的失敗與事故，將疲憊堆積到了無法思考的地步……）"
1013905-69 = "（由於大部分都是自己的疏失，或者無能為力的原因所造成的問題，#n　所以也沒辦法向任何人訴苦，一天就這麼過去了）"
1013905-75 = "（當天傍晚）"
1013905-78 = ""
1013905-79 = "您好，老師。#n我是來協助您今天傍晚的工作的。"
1013905-80 = "我前陣子在作戰中獲得了不錯的茶葉，想說跟您一起分享就帶了過來──"
1013905-81 = "哎呀，老師。#n您是哪裡不舒服嗎？"
1013905-82 = "臉上看起來滿是疲憊呢。"
1013905-83 = "[s5] 「沒什麼。」\n[s6] 「我沒事。那就開始傍晚的工作吧？」"
1013905-86 = "可是看您一副疲憊不堪的樣子……"
1013905-87 = "難道今天發生了什麼事嗎？"
1013905-88 = "[ns] 「我真的沒事。而且……」"
1013905-90 = "[ns] 「這件事跟仁子無關。」"
1013905-91 = ""
1013905-92 = "[ns] 「抱歉，我不是那個意思──」"
1013905-93 = ""
1013905-94 = ""
1013905-95 = "不。如果是跟我無關的事，那您就更應該告訴我！"
1013905-96 = "來，老師。#n先不要管工作了，請您先跟我來！"
1013905-100 = "（就這樣被仁子抓著手，硬是帶到了值班室）"
1013905-102 = ""
1013905-103 = "來，老師。#n請您躺到床上。"
1013905-104 = "[s7] 「仁子，謝謝你的關心……」\n[s8] 「但時間還早，我大概睡不著。」"
1013905-107 = "我沒有要請您提早休息的意思。"
1013905-108 = "請您躺到床上閉上眼睛，慢慢地把今天發生的事告訴我。"
1013905-109 = "哪怕是再微不足道的小事都沒關係。#n請把您腦海中殘留的所有事件，全都告訴我。"
1013905-110 = "如果不想說的話，含糊帶過也沒關係……"
1013905-111 = "請您放鬆下來，把悶在心裡的一切全都向我傾訴吧。"
1013905-112 = "[s] 「可是我不能把負擔加諸到學生身上……」"
1013905-113 = "在您說出口之前，我是絕對不會讓您從床上起來的哦。"
1013905-114 = "SRT的拘束方式有多麼五花八門……您應該不想親身體驗吧？"
1013905-115 = "[s9] 「我，我知道了……！」\n[s10] 「那就稍微……」"
1013905-119 = "（之後依照仁子的指示，慢慢地回想了這一天發生的事）"
1013905-120 = "（仁子在傾訴的過程中沒有多說什麼，只是輕輕地搭著話並給予共鳴）"
1013905-122 = ""
1013905-123 = "……原來發生了那樣的事啊。"
1013905-124 = "偶爾就會碰到這樣的日子呢。"
1013905-125 = "明明分開來看都是無關緊要的小事……#n可是一次全都湧上來的話，有時反而比一件大事更讓人難以承受。"
1013905-126 = "也正因為是無關緊要的小事所以說不出口，只能憋在心裡。"
1013905-127 = "[s11] 「對啊。並不是什麼大不了的事。」\n[s12] 「白白讓你擔心了，抱歉。」"
1013905-130 = "請別那麼說。"
1013905-131 = "就像我剛才說過的，越是微不足道的小事，越容易因為不當一回事而逐漸惡化。"
1013905-132 = "那種時候哪怕只是小事，只要坦率地說出來並分享情緒，心裡就會輕鬆許多哦。"
1013905-133 = "怎麼樣，現在是不是稍微輕鬆一點了呢？"
1013905-134 = "[s13] 「嗯。感覺暢快多了。」\n[s14] 「謝謝你，仁子。」"
1013905-137 = "不客氣。"
1013905-138 = "更何況老師是大人，所以更加無法對他人坦率呢。"
1013905-139 = "偶爾……哪怕對方是學生，也請您稍微多依靠別人一點吧。"
1013905-140 = "[s] 「我覺得我對學生一向都是真誠以對的。」"
1013905-141 = "我不是說您撒了謊。"
1013905-142 = "光是對真相加以取捨，就足以充分構成欺騙了……"
1013905-143 = "從今以後，請您毫無保留地把一切都說出來，好嗎？"
1013905-144 = "[s] 「……我會努力看看。」"
1013905-145 = "……真是麻煩的大人呢。"
1013905-146 = ""
1013905-148 = ""
1013905-149 = ""
1013905-150 = "不過也是因為有這種麻煩的大人，才需要我們這種機伶的孩子嘛。"
1013905-152 = "（之後和仁子在床上閒聊了一些無關緊要的話，帶著輕鬆許多的心情回到了辦公室）"
