[translation]
1013905-1 = "การให้คำปรึกษาของนิโกะ"
1013905-2 = "(วันนั้นเป็นวันที่คุณครูดวงตกอย่างแรงตั้งแต่ลืมตาตื่น...)"
1013905-4 = "ห้องอยู่เวร ชาเล่ต์"
1013905-6 = "[ns] \"ฮืม... ฮืม...\""
1013905-7 = "ฮะฮ่า ซิ่งเลย ซิ่งไป!"
1013905-8 = "วรูม วรูม บิดให้หมดไมล์เลย!"
1013905-9 = "ฮือ... ข้าววันนี้ก็อร่อยจัง"
1013905-10 = "[ns] \"ทำไมวันนี้ถึงเสียงดังแบบนี้นะ...\""
1013905-11 = "ซิ่งบนทางหลวงเส้นนั้นได้ใน 3 นาทีแบบไม่แตะเบรกเลยเหรอเนี่ย... พวกเธอนี่ไม่ใช่ย่อยเลยนะ?"
1013905-12 = "สหพันธ์วรูม วรูมของเธอก็เก่งไม่แพ้กันเลยนะ การแข่งขันวันนี้ต้องเดือดมากแน่ๆ"
1013905-13 = "ลูกพี่ คืนนี้มาซิ่งให้สุดขอบถนนกันเลยค่ะ!"
1013905-14 = "ลูกพี่อะไรกันล่ะ บอกให้เรียกว่าหัวหน้าไง!"
1013905-15 = "[ns] \"นอนไม่หลับเลย...\""
1013905-18 = "(คุณครูนอนไม่หลับเกือบทั้งคืนเพราะเสียงดังจากแก๊งนักซิ่งที่มาแข่งรถใกล้ๆ ชาเล่ต์...)"
1013905-20 = ""
1013905-21 = "[ns] \"เอ่อ ทำผ้าเช็ดหน้าหล่นแล้ว\""
1013905-22 = ""
1013905-23 = "[ns1] \"ไม่ได้ยินที่เรียกหรือเปล่านะ...?\"\n[ns2] วิ่งตามไปเพื่อเอาผ้าเช็ดหน้าไปให้"
1013905-29 = ""
1013905-30 = "คุณตำรวจคะ คนนั้นละค่ะ!"
1013905-31 = "ก็ว่าอยู่ว่าช่วงนี้รู้สึกเหมือนมีคนคอยเดินตาม..."
1013905-32 = "ต้องเป็นคนนี้ไม่ผิดแน่ค่ะ คนนี้สะกดรอยตามฉันอยู่ค่ะ!"
1013905-33 = ""
1013905-34 = "[ns] \"เปล่านะ แค่เอาของที่ตกพื้นมาให้เท่านั้นเอง\""
1013905-35 = "ของที่ตกพื้น...? นี่ ไม่คิดถึงความรู้สึกของคนที่จะได้รับของชิ้นนั้นบ้างเหรอ?"
1013905-36 = ""
1013905-38 = ""
1013905-39 = "จะว่าไป หน้าคุ้นๆ นะเนี่ย หรือว่าเคยเห็นมาจากใบประกาศจับ...?"
1013905-40 = "งั้นก็ไปด้วยกันเลย ถ้าจะแก้ตัวอะไร ก็ไปแก้ตัวที่สถานีตำรวจ"
1013905-41 = "[s] \"ขะ... เข้าใจผิดแล้ว!\""
1013905-43 = "(คุณครูถูกเข้าใจผิดจนต้องเสียเวลายกใหญ่...)"
1013905-44 = ""
1013905-45 = "เธอคงไปได้ยินข่าวลือนั้นมา แล้วคิดว่าฉันพูดใส่ร้ายป้ายสีน่ะค่ะ..."
1013905-46 = "คิดว่าเราเป็นเพื่อนกันเสียอีก... คิดไม่ถึงเลยว่าจะเชื่อข่าวลือโดยไม่ถามฉันก่อนสักคำ"
1013905-47 = "ความสัมพันธ์ของเราจบลงแล้วค่ะ ไม่เหลือความเป็นเพื่อนกันแล้ว!"
1013905-48 = "[s] \"ใจเย็นๆ ก่อน แล้วลองมาคิดเรื่องนี้กันใหม่เถอะนะ\""
1013905-49 = ""
1013905-50 = ""
1013905-52 = "[ns3] \"เพื่อนคนนั้นก็อาจมีเหตุผลบางอย่างที่บอกไม่ได้ก็ได้นะ?\"\n[ns4] \"ครูว่าถ้าเราค่อยๆ เปิดใจคุยกันอีกครั้ง...\""
1013905-55 = "คุณครู นี่คุณครูกำลังเข้าข้างเด็กคนนั้นอยู่เหรอคะ?!"
1013905-56 = "ฉันก็บอกไปตั้งหลายครั้งแล้วนี่คะ ยัยคนนั้นตั้งใจเชื่อข่าวลือนั้นแบบไม่กลั่นกรองเลยค่ะ!"
1013905-57 = "[s] \"ไม่นะ ครูไม่ได้หมายความอย่างนั้น...\""
1013905-58 = "คุณครูก็เป็นอีกคนที่คิดว่าฉันไม่มีเหตุผลสินะคะ..."
1013905-59 = "ไม่แปลกใจเลยที่คุณครูไม่สบตาฉันเลยตลอดการให้คำปรึกษา"
1013905-60 = "งั้นก็ขอโทษที่มารบกวนนะคะ"
1013905-61 = ""
1013905-63 = ""
1013905-64 = "[ns] \"ระ... รอก่อนสิ...!\""
1013905-67 = "(อาจเป็นเพราะความเหนื่อยล้า คุณครูจึงทำพลาดระหว่างการให้คำปรึกษานักเรียน...)"
1013905-68 = "(ความผิดพลาดและปัญหาที่เจอมาตลอดทั้งวันทำให้คุณครูเหนื่อยล้าจนแทบคิดอะไรไม่ออก...)"
1013905-69 = "(แต่ส่วนใหญ่ก็เป็นความผิดพลาดของตัวเอง หรือไม่ก็เป็นปัญหาที่ควบคุมไม่ได้ คุณครูจึงได้แต่ปล่อยให้เวลาผ่านไปโดยที่ไประบายให้ใครฟังไม่ได้)"
1013905-75 = "(บ่ายวันนั้น...)"
1013905-78 = ""
1013905-79 = "สวัสดีค่ะ คุณครู ฉันมาช่วยงานช่วงบ่ายของวันนี้ค่ะ"
1013905-80 = "วันก่อนฉันได้ใบชาดีๆ มาระหว่างออกไปทำปฏิบัติการน่ะค่ะ ก็เลยว่าจะมาชงดื่มด้วยกัน..."
1013905-81 = "ตายจริง คุณครูคะ ไม่สบายตรงไหนหรือเปล่าคะ?"
1013905-82 = "สีหน้าคุณครูดูอิดโรยมากเลยค่ะ"
1013905-83 = "[s5] \"ไม่มีอะไรหรอก\"\n[s6] \"ครูไม่เป็นไร งั้นเรามาเริ่มงานกันเลยมั้ย?\""
1013905-86 = "ปากบอกว่าไม่เป็นไร แต่ดูสีหน้าเหนื่อยล้านี่สิ"
1013905-87 = "เกิดอะไรขึ้นกับคุณครูเมื่อเช้านี้หรือเปล่าคะ?"
1013905-88 = "[ns] \"ไม่เป็นไรหรอก ถึงยังไงมันก็...\""
1013905-90 = "[ns] \"ไม่เกี่ยวกับนิโกะอยู่แล้วละ\""
1013905-91 = ""
1013905-92 = "[ns] \"ขอโทษนะ ครูไม่ได้จะหมายความแบบนั้น\""
1013905-93 = ""
1013905-94 = ""
1013905-95 = "ไม่ค่ะ ยิ่งเป็นเรื่องที่ไม่เกี่ยวกับฉัน คุณครูยิ่งต้องบอกฉันเลยค่ะ!"
1013905-96 = "เอาละ คุณครู เก็บงานช่วงบ่ายไว้ทำทีหลัง แล้วตามฉันมาก่อนค่ะ!"
1013905-100 = "(นิโกะคว้ามือคุณครูแล้วบังคับให้เข้าไปในห้องอยู่เวร)"
1013905-102 = ""
1013905-103 = "เอาละค่ะ คุณครู นอนลงไปบนเตียงเลยค่ะ"
1013905-104 = "[s7] \"นิโกะ ขอบใจที่เป็นห่วงนะ แต่ว่า...\"\n[s8] \"ยังกลางวันอยู่เลย ครูไม่น่าจะนอนหลับหรอก\""
1013905-107 = "ฉันไม่ได้ขอให้คุณครูนอนหลับสักหน่อยค่ะ"
1013905-108 = "ลงไปนอนบนเตียง หลับตาลง แล้วค่อยๆ เล่าให้ฉันฟังนะคะว่าวันนี้เกิดเรื่องอะไรบ้าง"
1013905-109 = "เล่าทุกเหตุการณ์ที่ยังอยู่ในความทรงจำของคุณครูให้ฉันฟัง ไม่ว่าจะเป็นเรื่องเล็กน้อยแค่ไหน#nก็ตามค่ะ"
1013905-110 = "ถ้ามีเรื่องไหนที่ไม่อยากบอกตรงๆ ก็บอกกันอ้อมๆ ก็ได้"
1013905-111 = "แค่ช่วยผ่อนคลายและเล่าทุกอย่างที่อยู่ในใจให้ฉันฟังก็พอค่ะ"
1013905-112 = "[s] \"แต่ครูไม่ควรสร้างภาระให้นักเรียนสิ...\""
1013905-113 = "ฉันจะไม่ยอมให้คุณครูลงจากเตียง จนกว่าจะยอมเอ่ยปากเล่ามาค่ะ"
1013905-114 = "คุณครูคงไม่อยากลองสัมผัสด้วยตัวเองใช่มั้ยคะ ว่าเทคนิคการมัดเชือกของ SRT น่ะ หลากหลายและแพรวพราวขนาดไหน?"
1013905-115 = "[s9] \"กะ... ก็ได้...!\"\n[s10] \"งั้นแค่นิดเดียวนะ...\""
1013905-119 = "(หลังจากนั้น คุณครูก็ค่อยๆ ทบทวนเหตุการณ์ต่างๆ ในวันนี้ตามที่นิโกะสั่ง)"
1013905-120 = "(ขณะที่กำลังเล่าให้ฟัง นิโกะก็ไม่ได้พูดอะไรมาก แค่ตอบรับเบาๆ เพื่อแสดงความเห็นอกเห็นใจ#nเท่านั้น)"
1013905-122 = ""
1013905-123 = "เกิดเรื่องแบบนั้นขึ้นสินะคะ..."
1013905-124 = "บางทีเราก็มีวันแบบนี้ค่ะ"
1013905-125 = "ถ้ามองทีละเรื่อง ก็อาจดูเหมือนเรื่องเล็กน้อยที่ไม่สำคัญอะไร แต่พอเรื่องเหล่านั้นกองทับถมกัน ก็จะเป็นเรื่องที่รับมือยากกว่าปัญหาใหญ่ๆ เสียอีก"
1013905-126 = "แล้วพอเป็นเรื่องเล็กที่ไร้สาระ เราก็จะยิ่งพูดออกมาไม่ได้ จนต้องเก็บเอาไว้ในใจคนเดียว"
1013905-127 = "[s11] \"ใช่แล้ว มันไม่ได้เป็นเรื่องใหญ่อะไรหรอก\"\n[s12] \"ครูขอโทษที่ทำให้เป็นห่วงนะ\""
1013905-130 = "อย่าพูดแบบนั้นสิคะ"
1013905-131 = "ก็อย่างที่ฉันเพิ่งบอกไปละค่ะ ยิ่งเป็นเรื่องเล็กๆ น้อยๆ เราก็ยิ่งปล่อยปละละเลย จนมันอักเสบเรื้อรังอยู่ข้างในค่ะ"
1013905-132 = "ในเวลาแบบนี้น่ะ ต่อให้เป็นเรื่องเล็กน้อย แต่ถ้าเราเปิดใจและแบ่งปันความรู้สึกอย่างตรงไปตรงมา เราก็จะสบายใจขึ้นมากเลยนะคะ"
1013905-133 = "ว่ายังไงล่ะคะ รู้สึกสบายใจขึ้นมาบ้างมั้ยคะ?"
1013905-134 = "[s13] \"อื้อ ครูโล่งใจขึ้นหน่อยแล้วละ\"\n[s14] \"ขอบใจนะ นิโกะ\""
1013905-137 = "ไม่เป็นไรเลยค่ะ"
1013905-138 = "พอคุณครูเป็นผู้ใหญ่ ก็เลยยิ่งซื่อสัตย์กับความรู้สึกของตัวเองต่อหน้าคนอื่นไม่ได้"
1013905-139 = "แต่ถึงแม้อีกฝ่ายจะเป็นแค่เด็กนักเรียน แต่ฉันก็อยากให้คุณครูลองพึ่งพาคนอื่นให้มากกว่านี้#nอีกสักหน่อยนะคะ"
1013905-140 = "[s] \"ครูก็คิดว่าตัวเองก็ปฏิบัติต่อนักเรียนด้วยความจริงใจอยู่ตลอดนะ\""
1013905-141 = "ฉันไม่ได้หมายความว่าคุณครูโกหกค่ะ"
1013905-142 = "แต่การเลือกพูดเฉพาะความจริงบางส่วนก็สามารถหลอกฝ่ายตรงข้ามได้แล้ว..."
1013905-143 = "เพราะงั้นจากนี้ไป ไม่ว่าจะเรื่องอะไรก็ต้องเล่าให้ฉันฟังอย่างสบายใจ ห้ามปิดบังกันอีกนะคะ?"
1013905-144 = "[s] \"ครูจะพยายามดูนะ...\""
1013905-145 = "ดื้อจัง ผู้ใหญ่คนนี้..."
1013905-146 = ""
1013905-148 = ""
1013905-149 = ""
1013905-150 = "แต่ก็นะ ก็ในเมื่อดื้อแบบนี้ ถึงได้มีเด็กหัวไวที่ใส่ใจความรู้สึกแบบพวกฉันอยู่ยังไงล่ะคะ"
1013905-152 = "(หลังจากนั้นคุณครูก็คุยเรื่องสัพเพเหระกับนิโกะบนเตียงอยู่พักใหญ่ ก่อนจะกลับมาที่ห้องทำงาน#nด้วยความรู้สึกที่โล่งใจขึ้นเป็นกอง)"
