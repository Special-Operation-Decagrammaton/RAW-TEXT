[translation]
3401-1 = "산해경의 조금 특별한 아침 1"
3401-3 = "하나, 둘, 셋, 넷……."
3401-15 = "후우. 제아무리 백호 공원이라고 해도, 이 시간에는 확실히 아무도 없구나."
3401-16 = "으음. 아침 체조를 한다는 사실을 함부로 보이고 싶지 않으니 어쩔 수 없는 것이겠지만……."
3401-25 = "후후. 몸을 움직이니 의식도 깨어나고, 조금이지만 몸의 상태도 좋아지는 것 같구나."
3401-26 = "호위나 동행이 없다는 것도, 이때만큼은 자유로운 느낌이기도 하고."
3401-27 = "그래도…… 역시, 가끔은 아침 늦게까지 늦잠을 자 보고 싶은 것도 사실이기는 하지……."
3401-28 = "……."
3401-29 = "감상은 이만 되었으니, 돌아가도록 할까."
3401-36 = "방금 그것은……."
3401-37 = "혹시나 하는 마음에, 숨어서 몇 번이고 다시 확인했지만……!"
3401-41 = "설마, 문주님의 쿵후 연습?!"
3401-45 = "이 우루시바라 카구야, 믿을 수 없는 것을 보았습니다……."
3401-46 = "소문도, 풍설도 돌지 않았기에 분명 저의 착각이 아닐까 하였지만……!"
3401-47 = "세상에 자기를 알아주는 귀인이 있다면, 하늘 끝에 있어도 이웃과 같으리니……."
3401-51 = "문주님께서, 마침내 우리의 충심을 이해하시고 몸소 경극을 시작해 주셨군요!"
3401-54 = "사실 현룡문 녀석들은 언제나 마음에 들지 않죠."
3401-55 = "시끄럽고, 무례하고, 자기들이 모든 법도라는 것 마냥 안하무인이고……."
3401-59 = "……물론, 그것이 필요할 때가 있다는 것을, 인정하지 않는 것은 아니긴 합니다만."
3401-60 = "그렇지만 문주님은 조금 예외입니다. 기본적으로 대화가 통하고, 때로는 자비도 보여 주시는 분이니 말입니다."
3401-61 = "그런 문주님께서, 아무도 모르게 쿵후를 연습하고 계셨다니……!"
3401-62 = "역시 아침 수련을 거르지 않길 잘했습니다. 거기에 오늘은 어째서인지 눈이 빨리 뜨여, 평소보다 이른 시간에 나온 것도 행운이었군요!"
3401-63 = "그렇다면 이 기회에, 문주님과 더불어……!"
3401-67 = "역시 기다릴 수 없는 일입니다. 여러 사람에게 이 사실을 알려야…… 그렇네요. 처음은 역시, 회장님께 알려드려야겠죠! 거기에서부터 시작입니다!"
3401-73 = "……사실, 모종의 불미스러운 일로, 우리 경극부는 상당 기간 동안 자숙해야 하는 입장이 되기는 했죠."
3401-74 = "문주님의 결정에 의문을 품는 것은 아닙니다."
3401-75 = "다만 한 가지 두려웠던 것은, 우리 경극부가 완전히 문주님의 신뢰를 잃어, 두 번 다시 충심을 증명할 기회를 얻지 못하게 되는 것이었으니……!"
3401-76 = "그러나 문주님께서 몸소, 이렇게 경극을 연습하는 것으로, 마음속으로는 결코 우리들을 저버리지 않으리라는 것을 보이셨으니!"
3401-77 = "이 어찌 경사라 하지 않을 수 있겠습니까!"
3401-78 = "이제 경극부에 대한 예산 편성도 보다 자유로워져서, 더 크고 화려하고 멋진 경극 공연도 가능하게 되겠죠! 네!"
3401-79 = "마침 경극부 전체의 분위기가 조금 침체되어 있던 참이기도 하니, 이 길조(吉兆)를 경극부 전체에 널리 퍼트려야 하겠습니다!"
3401-86 = "그래서, 키사키가 아침 일찍 쿵후 연습을 하고 있었다고?"
3401-87 = "그렇습니다, 회장님! 저 말고도 쿵후의 멋짐을 알아주는 사람이 있다니, 그리고 그것이 문주님이라니……."
3401-88 = "한 명의 수련자로서, 이건 정말 기쁜 일이 아닐 수가 없네요!"
3401-89 = "어…… 그러니까 그건……."
3401-90 = "……."
3401-91 = "그래. 그렇겠네."
3401-92 = "뭔가 마음에 걸리는 일이라도 있으십니까, 회장님?"
3401-93 = "아니, 그런 건 아니고. 그냥."
3401-94 = "(……그렇지만 이상하네. 내가 아는 키사키는 그런 걸 할 녀석이 아닌데…….)"
3401-95 = "그래서…… 어쩔 생각이야, 레이죠?"
3401-96 = "네? 그야, 그러니까……. 이 소식을, 저와 같은 수련자 동지들에게 널리 알려야겠죠."
3401-97 = "산해경 뿐만이 아니라 키보토스 전체를 통틀어 보아도, 무술과 무예를 수련하는 학생의 수는 지극히 적어."
3401-98 = "한 명의 동호인이라도 늘어난다면, 그것이야말로 모두 모여 축하할 일이 될 테니까요!"
3401-99 = "그러면, 회장님! 오늘은 조금 실례하겠습니다!"
3401-104 = "신을 내는 건 좋은데 말이야……."
3401-108 = "뭐, 레이죠가 저렇게 기운 넘치는 건 드문 일이니까!"
3401-109 = "그나저나, 키사키가…… 으음…… 역시 느낌이 묘하긴 한데."
3401-110 = "그래도 뭐, 정말로 키사키가 몰래 쿵후를 연습하고 있는 거라면……."
3401-111 = "나중에 몰래, 간식이라도 만들어서 전해주도록 할까!"
3401-114 = "그게 정말인가요, 부장님?"
3401-115 = "그렇다마다요! 제 이 두 눈으로 똑똑히 보았습니다!"
3401-119 = "물론 들키지 않도록 조금 멀리에서 관찰하였기에, 사람에 따라서는 정확하지 않은 목격담이라고 일컬을 수도 있겠지만……."
3401-120 = "다른 누구도 아닌, 저의 눈은 명확하게 진실을 꿰뚫어 볼 수 있었습니다!"
3401-121 = "그 몸짓, 원을 그리는 팔, 하늘을 향해 쭉쭉 뻗는 동작! 모든 것이, 그야말로……!"
3401-122 = "우리 경극부의 '경극 무용', 그 자체였으니까요!"
3401-123 = "경극 무용…… 그것은 경극 연습을 위해, 경극의 동작들을 응용하여 마침내 만들어낸."
3401-124 = "저희 경극부 특유의 무용!"
3401-125 = "그런데, 조금 이상하지 않나요. 부장님? 어떻게 문주님께서, 저희 경극부의 비전(祕傳)이라고도 할 수 있는 경극 무용을 알고 계신 것이었을까요?"
3401-126 = "아뇨. 조금도 이상하지 않습니다. 잘 생각해 보세요. 왜냐하면……."
3401-130 = "문주님께서는, 모든 것을 알고 계실 것이기 때문입니다!"
3401-135 = "확실히, 듣고 보니 그건 그럴 것 같아요!"
3401-136 = "하지만, 아무리 매끈하고 맑은 옥이라고 해도, 하나의 티끌이 묻을 수 있는 법……."
3401-137 = "문주님의 그 경극 무용은, 분명히 경극 무용의 동작이었으나…… 군데군데 미흡하고 완제(完濟)되지 못한 동작들이 이따금 드러나곤 했습니다."
3401-138 = "하여! 여기에서는 우리 경극부가, 비로소 본격적으로 나설 때라고 할 수 있을 것입니다!"
3401-139 = "그렇네요! 부장님께서 그렇게 말씀하시니, 정말로 그래야 할 것 같다는 생각이 드네요!"
3401-142 = "들었어, 들었어? 우리 문주님께서, 세상에……."
3401-143 = "아, 그거? 맞아. 나도 들었어! 아, 이거 잘못 들키면 현룡문 부원들에게 혼나려나……."
3401-144 = "그렇지만 뭔가 대단하지 않아? 그 문주님께서 아침 일찍 그런 연습을 하고 계시다니……."
3401-145 = "이해되는 부분도 있긴 해. 여러 가지로, 그 뭐냐, 입장이라든가 곤란해질 수도 있잖아?"
3401-151 = "어라, 무술연구부 부원들 아니십니까? 무슨 일이신가요?"
3401-152 = "아, 마침 이곳에 계셨군요. 만나 뵐 수 있게 되어서 다행이에요."
3401-153 = "누구보다 잘 알고 계시겠지만, 문주님의 '그 일' 때문에 말인데요……."
3401-154 = "이제부터 한시적이라도 좋으니, 저희 무술연구부와 '협업'을 하시는 건 어떨까 해서요!"
3401-155 = "……."
3401-156 = "사실, 무술연구부 여러분께는 예전부터 개인적으로 많은 신세를 지고 있었죠."
3401-157 = "좋습니다. 충분히 그럴 만한 사안이고, 오히려 제 쪽에서 부탁드리고 싶을 정도입니다."
3401-158 = "수양과 단련을 위하여, 많은 가르침을 청하겠습니다."
3401-159 = "네! 수양과 단련을 위하여!"
3401-160 = "그리고 말인데요. 또 한 가지 말씀드려 보고 싶은 것이 있는데……."
3401-161 = "역시 이참에, 저희 무술연구부의 초빙 부원이 되어 주시는 것은 어떨지 해서요!"
3401-163 = "아…… 역시 그건 조금 무리일 것 같네요. 죄송합니다. 지금은 상회 일만으로도 상당히 바쁜 처지여서요."
3401-164 = "역시 그런가요……."
3401-167 = "모두 모이셨습니까?"
3401-171 = "네, 부장님!"
3401-173 = "이곳이 바로, 아침 일찍부터 문주님께서 경극 무용을 연습하신다는 백호 공원……."
3401-174 = "사실 저희 경극부에게 있어서는, 진작부터 야외 경극 공연장으로 자주 쓰이는 곳이다 보니, 익숙해질 대로 익숙해진 곳이기는 합니다만."
3401-175 = "그러나 같은 장소라 하여도, 그 장소에 누가 서 있고, 어떤 목적으로 사용하는지에 따라 그 의미는 변하기 마련입니다!"
3401-176 = "높은 곳을 오르려면, 마땅히 스스로 낮은 곳부터 올라야 한다고 하였지요."
3401-177 = "바로 이곳에서 우리는 문주님께……."
3401-178 = "우리의 고아(高雅)한 경극 무용을 선보여 드려, 마땅히 그 높으신 뜻을 기릴 것입니다!"
3401-183 = "말씀을 따르겠습니다, 부장님!"
