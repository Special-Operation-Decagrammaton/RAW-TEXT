[translation]
10042010-1 = "제1화;기적……?"
10042010-2 = "카페 주방"
10042010-3 = "어……?"
10042010-4 = "지금 뭔가, 나쁘지 않게 보이는 게 만들어진 것 같은데……?"
10042010-5 = "아니야, 주리! 정신 차려! 나 자신에게 속으면 안 돼!"
10042010-9 = "혹시 모르니까, 확인을 해 보자. 아주 조금만 먹어 보면……."
10042010-10 = "아, 주리 양? 팬케이크 다 만들었구나? 이거 가져 갈게. 지금 조금 급하거든!"
10042010-16 = "어, 어어?! 점장님? 잠깐만요–!"
10042010-22 = "이제서야 나왔네! 어디……."
10042010-23 = "(아, 안 돼! 아직 확인이……!)"
10042010-24 = "음! 역시 이 카페의 팬케이크는 우릴 실망시키지 않는다니까."
10042010-25 = "으으…… 역시 나도 한 입만."
10042010-26 = "야, 그게 한 입이냐? 절반이지!"
10042010-27 = "네가 너무 맛있게 먹은 게 잘못한 거지!"
10042010-28 = "어……?"
10042010-29 = "(맛있, 다고……? 내가 만든 게……?)"
10042010-30 = "(이거, 꿈은…… 아니지? 아니야, 꿈일 가능성이 있어. 그것도 매우 충분히.)"
10042010-34 = "아파!"
10042010-35 = "(그러면 이게…… 현실인 거야? 정말로?!)"
10042010-36 = "응? 왜 그래, 주리 양? 아하, 자기가 만든 게 얼마나 맛있을지 보러 왔구나?"
10042010-37 = "이해해, 이해해. 자기 요리가 서빙되는 모습을 보는 건, 정말로 설레는 일이지."
10042010-38 = "하지만 지금 주문이 좀 많이 밀려 있으니까, 미안하지만 조금만 더 주방에서 힘내 주면 안 될까?"
10042010-39 = "어어……?"
10042010-40 = "네, 네! 점장님! 저, 진짜로 열심히 할게요!"
10042010-42 = "와아…… 주문이 이렇게나 밀려 있었네……."
10042010-43 = "아니야, 아니야! 감탄하거나 놀랄 시간에 팬케이크를 굽는 거야!"
10042010-48 = "다 됐어요! 다음 주문받을게요!"
10042010-57 = "여기 완성됐습니다! 가져가 주세요!"
10042010-61 = "고마워, 주리 양! 이대로만 부탁해!"
10042010-68 = "다음, 다음!"
10042010-77 = "계속하겠습니다!"
10042010-82 = "가만…… 조금 전에 뭔가, 이상한 거 지나가지 않았나?"
10042010-83 = "착각이었으려나. 지금 좀 바쁘기는 하지, 응!"
10042010-84 = "이렇게 기쁘게 바쁠 수 있다니, 행복하기까지 해!"
10042010-87 = "꺄아아아아아아악?!"
10042010-88 = "어?"
10042010-89 = "비명…… 소리?"
10042010-92 = "뭐, 뭐뭐뭐뭐, 뭐야, 이건?! 이 이상한 건!?"
10042010-93 = "보라색에, 녹색에…… 그것도 모자라서 꿈틀거리기까지 해!"
10042010-97 = "윽! 지금 옷에 뭐 튀었어! 끈적거려!"
10042010-98 = "일단 여기서 나가자!"
10042010-104 = "저거 뭐야! 히이이이익? 이쪽으로 온다!!!"
10042010-110 = "아아아악! 살려줘! 난 맛없어! 없을 거야! 저리 가!"
10042010-111 = "아냐, 아냐! 여기 아니야! 저쪽! 아니면 쟤한테!"
10042010-112 = "그러고도 네가 친구냐!"
10042010-117 = "아, 안 돼! 손님을 덮치면 안 돼!"
10042010-123 = "아앗!!??"
10042010-124 = "소, 손님?!?!?!"
10042010-132 = "주, 주리 양?! 주리 양은 괜찮아!? 다친 데는 없고? 저게 갑자기 주방에서 나타나서 말이지!"
10042010-133 = "나는 혹시 주리 양이 먼저 당한 게 아닐까 생각했는데……."
10042010-134 = "네? 네. 저는 괜찮아요. 그것보다 우선 저걸……!"
10042010-141 = "도망쳤어!"
10042010-142 = "어, 어어어어, 어떡하죠? 저게 밖으로 나가 버리면, 카페의 평판이라든가……."
10042010-143 = "우리 카페의 평판을 걱정해 주는 건 고맙지만, 그냥 저런 게 돌아다니면 애초에 안 되는 거 아닐까……?"
10042010-147 = "전화? 이럴 때에 누가……?"
10042010-151 = "이 번호는…… 서, 선생님?!"
10042010-156 = "여보세요? 선생님……?"
10042010-157 = "[s] \"안녕, 주리! 일이 바쁜가 보네. 아르바이트 잘 돼 가?\""
10042010-158 = "아르바이트, 요? 그게, 그러니까……."
10042010-159 = "[s1] \"목소리가 왜 그래? 무슨 일 있었어?\"\n[s2] \"주리가 아르바이트를 한다고 듣고, 저녁쯤 찾아가려고 했는데.\""
10042010-162 = "그, 그게 말이죠……!"
10042010-169 = "으아아악-!! 괴물 팬케이크가-!!"
10042010-170 = "히이익-!? 저쪽으로 달아났어!!"
10042010-174 = "……!? 주리!? 지금 그 소리는……!?"
10042010-175 = "서, 선배!? 선배 지금 선생님과 함께 계신 거예요??"
10042010-176 = "어, 응. 그래. 마침 선생님께서 연락해 주셔서……."
10042010-177 = "[s3] \"상황은 알았어. 모르겠어도 알았어.\"\n[s4] \"일단 우리가 최대한 빨리 갈게.\""
10042010-180 = "하, 하지만 그러면 선배의 휴일이……!"
10042010-186 = "괜찮아, 주리. 이미 했던 말 같지만."
10042010-187 = "나는, 정말로 괜찮아."
10042010-188 = "그렇게 생각해 줘서 고마워. 진심이야. 그러니까……."
10042010-189 = "이 문제부터 어떻게든 빨리 해결해 보자."
10042010-190 = "네, 네에……."
10042010-194 = "[ns] (가만, 사태가 이렇게 되었으니까 말이지…….)"
10042010-196 = "게헨나 선도부실"
10042010-199 = "뭐야, 전화?"
10042010-203 = "응? 이 번호는……?"
10042010-207 = "여보세요, 선생님?"
10042010-208 = "[s] \"이오리, 지금 혹시 시간 괜찮아?\""
10042010-209 = "……? 시간? 갑자기 왜?"
10042010-210 = "[s5] \"지금 좀 와줄 수 있을까?\"\n[s6] \"그……. 와서 직접 보는 게 나을 것 같은데.\""
10042010-213 = "뭐, 뭐야. 갑자기? 또 이상한 일에 휘말린 거야?"
10042010-214 = "[s7] \"역시 이오리야. 척하면 척이네!\"\n[s8] \"그렇다고도 할 수 있지. 아무튼 부탁해.\""
10042010-217 = "뭐……. 알겠지만……."
10042010-222 = "……선생님이신가요?"
10042010-223 = "그렇긴 한데……. 뭔가 도움이 필요해진 모양이야."
10042010-224 = "뭔가 큰일이라도……."
10042010-225 = "그럴 리가 있겠어? 그 선생님이라고. 보나 마나 쓸데없는 일이겠지."
10042010-226 = "애초에 여긴 게헨나잖아. 정체불명의 괴물 같은 거라도 나오지 않는 이상, '큰일'이랄 게 뭐가 있겠어."
10042010-227 = "그렇네요. 가 보면 알겠죠."
10042010-232 = "그러면, 출발이다!!"
