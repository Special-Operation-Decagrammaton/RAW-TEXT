[translation]
1004403-1 = "코코넛 채취 도전"
1004403-4 = "아, 선생님!"
1004403-5 = "이쪽! 이쪽! 기다리고 있었어요!"
1004403-9 = "저기 저 반대편에 보이는 나무들 있죠?"
1004403-10 = "전부 코코넛 야자수예요."
1004403-11 = "잔~뜩 따 가서 다 같이 즐겁게 먹자구요☆"
1004403-12 = "[s1] \"그런데 나무들이 엄청 크네.\"\n[s2] \"사다리를 가져올 걸 그랬나.\""
1004403-13 = "그게 말이죠……."
1004403-14 = "그게 말이죠……."
1004403-15 = "사다리는 이미 보수작업 쪽에서 쓰고 있어서, 지금 바로 쓸 수는 없거든요."
1004403-16 = "물론 끝나고 나서 해도 되지만~. 뭔가, 뭐랄까……."
1004403-17 = "빨리 따서 작업 끝난 타이밍에 다 같이 마시면 좋지 않을까……같은? 그런 느낌?"
1004403-18 = "[s3] \"과연, 그런 타이밍인거군.\"\n[s4] \"응응. 알 거 같아!\""
1004403-21 = "응응! 그런 거죠!!"
1004403-22 = "그러니까 여기선 저희 둘만으로 이 난관을 헤쳐나가야 한다는 말씀!"
1004403-23 = "무슨 방법이 있을까요……."
1004403-28 = "……아! 그러고 보니 이런 방법도 있겠군요?"
1004403-32 = "……영차. 이걸 들고……."
1004403-36 = "[ns5] \"어……. 노노미 씨?\"\n[ns6] \"갑자기 미니건은 왜 드는 거야?\""
1004403-37 = "선생님은 뒤쪽으로 와 계세요~."
1004403-38 = "선생님은 뒤쪽으로 와 계세요~."
1004403-39 = "올라갈 수 없다면……!"
1004403-41 = "내려오게 하면 되는 거죠!"
1004403-45 = "청소 시간이에요~☆"
1004403-58 = "……쨔, 쨔안~!!☆"
1004403-62 = "[ns7] \"쨔안……이 아니지 않아?\"\n[ns8] \"다른 방법을 찾아보자…….\""
1004403-65 = "으음. 역시 좀 요란스러우려나요. 코코넛까지 다 부서졌네요……."
1004403-66 = "섬의 환경을 망가뜨린 것 같은……."
1004403-67 = "어떻게 하면 좋을까요? 으음. 다른 방법을……."
1004403-70 = "[ns9] \"평범하게 목마를 타는 게 어떨까.\"\n[ns10] \"짧은 종이라면 목마로도…….\""
1004403-73 = "어……. 목마요?"
1004403-74 = "제가 선생님을 태워 드리면 되는 걸까요?"
1004403-75 = "……네?"
1004403-76 = "……아. 제가 타는 거예요? 선생님 위에?"
1004403-80 = "그, 그런……. 그런 방법도 있겠네요……? 따, 딱히 생각해 본 적이 없어서……."
1004403-81 = "아, 아뇨! 아뇨. 싫다는 건 당연히 아니고요!"
1004403-82 = "……으음……. 좋아요. 그럼 부탁드릴게요, 선생님."
1004403-88 = "……조금 무거워도 말하지 말아 주세요☆ 아셨죠?"
1004403-91 = "(노노미를 목마에 태우고 비교적 짧은 야자수로 다가갔다.)"
1004403-95 = "서, 선생님? 조금만 천천히……."
1004403-96 = "죄, 죄송해요. 목마를 타 보는 건 처음이라……. 뭔가 여러모로 긴장되네요."
1004403-101 = "으음~. 팔이…… 닿을 거 같……기도!"
1004403-102 = "조금만 더, 조금만 더……!"
1004403-108 = "……핫!?"
1004403-114 = "아야야야……."
1004403-115 = "괘, 괜찮으세요, 선생님?"
1004403-116 = "죄송해요. 중심을 잃어버렸네요."
1004403-117 = "아무래도 이런 건 역시 처음이라……."
1004403-121 = "……? 선생님……?"
1004403-122 = "……어라?"
1004403-126 = "서, 선생님……!?"
1004403-130 = "괘, 괜찮으세요, 선생님!? 죄송해요. 떨어지면서 선생님 위로……!!"
1004403-131 = "그게, 그러니까……. 어……. 이게……."
1004403-132 = "[s11] \"노노미야말로 괜찮아?\"\n[s12] \"괜찮아. 여러 의미로.\""
1004403-133 = "네, 네……. 저야 선생님 덕분에……."
1004403-134 = "그런가요……? 아하하……."
1004403-135 = "으음. 역시 이대로는 무리일까요……. 나중에 사다리를 가져와서 다시 시도해 봐야겠어요."
1004403-136 = "기껏 선생님께서 여기까지 와 주셨는데, 빈손으로 돌아가겠네요. 죄송해요."
1004403-137 = "……네?"
1004403-138 = "빈손은 아닌 거 같다고요? 그치만 저희, 아무것도 얻어가는 게……."
1004403-139 = "[s13] \"휴양지에선 뭐든지 보상이야.\"\n[s14] \"과정 또한 노는 것의 일부니까.\""
1004403-144 = "……후훗."
1004403-145 = "응응! 그 말이 맞아요! 역시 선생님!"
1004403-149 = "그럼 우선은 돌아가고……. 다음번에 다시 와서 같이 따도록 해요!"
1004403-150 = "다음에는……. 그때는……."
1004403-151 = "……음……."
1004403-152 = "[s] \"……노노미?\""
1004403-153 = "……으으응. 아무 것도 아니에요."
1004403-154 = "……그저……."
1004403-156 = "……그때에도, 왠지 사다리 들고 오는 걸 까먹을 거 같은 느낌이 들어서요."
