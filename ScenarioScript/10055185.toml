[translation]
10055185-2 = "嘰嘻嘻！看到了吧！這就是所謂的弱者逆襲！"
10055185-3 = "不對，弱的本來就是你們那邊！"
10055185-4 = "拜託二選一好嗎。"
10055185-5 = "哈……我剛才究竟做了什麼……？"
10055185-6 = "啊，是平常的渚醬。"
10055185-7 = "看來你恢復了啊。#n不，也可能這邊才是在演戲……？"
10055185-8 = "啊嗚嗚……我可以先回去了嗎……？"
10055185-9 = "嘻嘻！就連那可憎的茶會也擋不住我們！"
10055185-10 = "可以說在這奇普托斯已經沒有萬魔殿──不，沒有本大人的對手了！嘰嘻嘻！"
10055185-11 = "哇，超級得意忘形。"
10055185-12 = "就只是螃蟹打架贏了而已，到底能嗨到什麼程度啊……"
10055185-13 = "這樣星星就有四顆了！"
10055185-14 = "哦，記得真清楚。不愧是伊吹。"
10055185-15 = "……咦？不過從趨勢來看，三一不就是最後的對手了嗎？"
10055185-16 = "有什麼問題嗎？"
10055185-17 = "可是要在「天下一蟹．武術大會」奪冠，需要五顆星星耶？"
10055185-18 = "……虧你還記得那種荒唐的設定。"
10055185-19 = "不過在三一之後，還有其他學園會出現嗎……？"
10055185-20 = ""
10055185-21 = ""
10055185-22 = "…………"
