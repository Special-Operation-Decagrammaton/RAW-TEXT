[translation]
10055185-2 = "키시시싯! 보아라! 이게 바로 언더독의 반란이라는 거다!"
10055185-3 = "아니, 애당초 그쪽이 언더였지만!"
10055185-4 = "둘 중 하나만 하라고요."
10055185-5 = "핫…… 방금까지 저는 도대체 무엇을……?"
10055185-6 = "앗, 평소의 나기 쨩이다."
10055185-7 = "돌아왔군요. 아니, 오히려 이쪽이 연기일 가능성도……?"
10055185-8 = "아우우…… 저는 혹시 돌아가 봐도 될까요……?"
10055185-9 = "키키킷! 그 가증스러운 티파티조차 우리를 막지 못했다!"
10055185-10 = "이 키보토스에 만마전의, 이 몸의 적수는 없다고 해도 무방하겠군! 키히힛!"
10055185-11 = "우와, 엄청 기고만장."
10055185-12 = "도대체 게 싸움을 이긴 정도로 얼마나 흥이 오른 건지……."
10055185-13 = "이제 별은 4개야!"
10055185-14 = "오, 잘 기억하고 있네요. 역시나 이부키."
10055185-15 = "……어라? 그치만, 지금 흐름대로면, 트리니티가 마지막 상대가 아닌가요?"
10055185-16 = "그런데요?"
10055185-17 = "하지만 <천하게일무술대회> 우승에는 별 다섯 개가 필요한걸요?"
10055185-18 = "……그 얼토당토않은 설정, 잘도 기억하고 있네요."
10055185-19 = "그치만, 있나요? 트리니티 다음으로, 나타날 만한 학원이……?"
10055185-22 = "…………."
