[translation]
10055185-2 = "キシシッ！見たか！これが窮鼠猫を噛むというやつだ！"
10055185-3 = "いや、ネズミはそちらの方か！キシシッ！"
10055185-4 = "どっちでもいいでしょ……。"
10055185-5 = "ハッ……？私は今まで何を……？"
10055185-6 = "あっ、いつものナギちゃんだ。"
10055185-7 = "よかった。戻ったようだね。"
10055185-8 = "あうう……私はもう帰ってもいいでしょうか？"
10055185-9 = "キキキッ！あの忌まわしきティーパーティーでさえ、我々を止められはしなかった！"
10055185-10 = "このキヴォトスに……万魔殿の、いや私の敵は最早いない！"
10055185-11 = "うわあ、すごい天狗になってる。"
10055185-12 = "カニ同士の戦いでここまで調子に乗れるのもすごいですね……。"
10055185-13 = "これで星は4つだね！"
10055185-14 = "おお。イブキ、よく覚えてましたね。"
10055185-15 = "……あれ？でもこの流れなら、トリニティが最後の相手になるはずだよね？"
10055185-16 = "まあ、そうですね。それがなにか？"
10055185-17 = "思い出してよ。#n「[ruby=てんかいっかい]天下一蟹[/ruby]・武術大会」の優勝には、星が5つ必要だったでしょ？"
10055185-18 = "……そんな設定、よく覚えてますね。"
10055185-19 = "あと1校……トリニティより強い学園なんてありましたっけ？"
10055185-22 = "…………。"
