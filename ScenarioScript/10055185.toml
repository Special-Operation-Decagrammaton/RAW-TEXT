[translation]
10055185-2 = "คิกคิกคิก! ดูซะ! นี่แหละที่เรียกว่าการพลิกเกมของมวยรอง!"
10055185-3 = "ไม่สิ พวกเธอต่างหากที่เป็นรองมาตั้งแต่แรก!"
10055185-4 = "เลือกสักอย่างเถอะค่ะ"
10055185-5 = "หืม... เมื่อกี้นี้ฉันทำอะไรลงไป...?"
10055185-6 = "อ๊ะ นางิจังกลับมาเป็นปกติแล้ว"
10055185-7 = "กลับมาแล้วสินะคะ ไม่สิ หรือว่าสภาพในตอนนี้ต่างหากคือการแสดง...?"
10055185-8 = "ฮือ... ฉันขอตัวกลับเลยได้มั้ยคะ...?"
10055185-9 = "คิกคิกคิก! แม้แต่สภาน้ำชาที่น่ารังเกียจนั่นก็ยังหยุดพวกเราไม่ได้!"
10055185-10 = "คงพูดได้เต็มปากแล้วว่าในคิโวทอสแห่งนี้ไม่มีใครเป็นคู่ต่อสู้ของแพนเดโมเนียม โซไซตี้#nของท่านมาโคโตะผู้นี้ได้! คิกคิกคิก!"
10055185-11 = "ว้าว หยิ่งผยองสุดๆ เลย"
10055185-12 = "แค่ชนะการประลองปู จะฮึกเหิมอะไรขนาดนั้นนะ..."
10055185-13 = "ตอนนี้มีดาว 4 ดวงแล้วนะ!"
10055185-14 = "โอ้ จำได้แม่นมากเลยค่ะ สมกับเป็นอิบูกิจริงๆ"
10055185-15 = "เอ๋...? แต่ถ้าดูจากลำดับที่ผ่านมา ทรีนิตี้ก็น่าจะเป็นคู่ต่อสู้สุดท้ายแล้วไม่ใช่เหรอคะ?"
10055185-16 = "แล้วมีอะไรเหรอคะ?"
10055185-17 = "แต่ถ้าจะชนะ <ศึกชิงเจ้ายุทธภพปู> ต้องมีดาวห้าดวงนะคะ?"
10055185-18 = "จำกติกาไร้สาระนั่นได้แม่นเชียวนะคะ..."
10055185-19 = "แต่มีด้วยเหรอคะ? โรงเรียนที่จะปรากฏตัวหลังทรีนิตี้น่ะ...?"
10055185-20 = ""
10055185-21 = ""
10055185-22 = "........."
