[translation]
41190-1 = "제19화;어른의 시간"
41190-2 = "발키리 경찰학교 본관 옥상"
41190-4 = "여기는 RABBIT 1. 현재 시각은 0100시. 지금 막[ruby=목표 상 재 집결지] ORP에[/ruby] 도착했습니다."
41190-5 = "캠프 RABBIT. 항공 지원은 아직인가요?"
41190-6 = "랑데부 포인트가 바뀌면서 헬리콥터 지원 요청이 늦어졌어!"
41190-7 = "그래도 금방 도착하니까…… 앞으로 5분만 기다려 줘!"
41190-8 = "알겠습니다."
41190-9 = "RABBIT 2, 옥상으로 올라오는 통로를 봉쇄하고 바리케이드의 설치를 부탁드립니다."
41190-14 = "바리케이드는 진입하고 나서 바로 설치했어. 혹시 몰라서 계단 근처에 대인 지뢰도 몇 개 뿌려뒀는데—"
41190-18 = "……벌써 도착한 모양이네."
41190-19 = "버, 벌써 옥상 문을 두들기고 있어!"
41190-20 = "이 상태로 5분을 버틸 수 있을까……?"
41190-25 = "굳게 잠긴 옥상의 출입문, 문을 두드리는 사람들, 오지 않는 헬리콥터……."
41190-26 = "마치 지난주에 본 좀비 영화 같네. 쿠흐흐."
41190-27 = "……그 영화, 결말이 어떻게 돼?"
41190-28 = "마지막에 헬리콥터에 매달린 좀비 때문에 추락해서 다 죽었을걸?"
41190-29 = "퇴출 작전 앞두고 불길한 소리 하지 마!"
41190-30 = "그, 그래도 다행히 현실에 좀비는 없으니까……"
41190-32 = "……이번에도 귀관들이었나."
41190-33 = "지, 진짜로 좀비가 나왔다!!"
41190-39 = "최소한 공안국장이라고 불러주었으면 좋겠는데."
41190-40 = "당신은…… 칸나 국장!"
41190-41 = "옥상으로 올라오는 문은 모두 잠가두었을 텐데, 어떻게 들어 온 거지?"
41190-42 = "건물 외벽의 우수관을 타고 올라왔지."
41190-43 = "말도 안 돼. 여기는 지상 10층이 넘어가는 고층 빌딩이라고!"
41190-44 = "강하 훈련 경험도 없는 학생이 하네스도 없이 맨몸으로 벽을 타고 올라왔다고?"
41190-45 = "범죄자를 잡을 수 있다면 무슨 일이라도 해내는 것이 공안국의 모토야."
41190-46 = "설마 키보토스의 치안을 책임지는 경찰학교의 본관에 침입해 놓고선 얌전히 빠져나갈 수 있을 거라 생각했나?"
41190-50 = "귀관들은 이미 포위되었어. 불필요한 저항은 그만두는 게 좋을 거야."
41190-52 = "……."
41190-53 = "그보다 지난번에 그렇게 호되게 당해 놓고서도 말썽을 반복하다니, 지긋지긋하지도 않나?"
41190-54 = "키보토스는 더 이상 귀관들의 활약을 필요로 하지 않아. 이런 장난은 오히려 주변에 폐만 끼칠 뿐이다."
41190-55 = "이번에야말로 총학생회에 귀관들의 일탈을 고발하여 학적을 말소하도록—"
41190-56 = "용서받을 수 없는 범죄를 저지른 건 당신도 마찬가지입니다, 칸나 국장."
41190-62 = "이번 작전을 통해 공안국의 거래 장부를 확보했습니다."
41190-63 = "국장께서는 코우사기 타운에서 노숙자들을 몰아내 주는 대가로 카이저 그룹으로부터 불법 리베이트를 받으셨더군요."
41190-64 = "귀관들이 그걸 어떻게……."
41190-65 = "그야 뻔하지. 낡은 제식 장비만 들고 다니던 경찰학교 학생들이 갑자기 신무기를 들고 나타나면 뭔가 구려 보이는 게 당연하잖아?"
41190-66 = "키보토스의 치안을 책임지는 발키리 경찰학교의 학생들은 총학생회가 정한 규칙에 따라 공정하게 공무를 처리해야 합니다."
41190-67 = "그런데 타의 모범이 되셔야 할 공안국의 국장이 사적인 욕망 때문에 금품을 수수하고 기업과 결탁하시다니……"
41190-69 = "이는 발키리 경찰학교의 이념을 거스르는 중범죄입니다!"
41190-75 = "……어째서……"
41190-76 = "……어째서 귀관들은 그렇게 자기 멋대로 하고 싶은 말만 하는 거지?"
41190-77 = "모든 시민에게 공평하게 돌아가는 공정한 공무라……"
41190-78 = "그래. 귀관의 말이 맞아. 발키리의 경찰은 모든 시민에게 공정해야지."
41190-79 = "하지만 이 세상은 귀관들이 생각하는 것처럼 공정하지 않아."
41190-80 = "귀관들이 온갖 면책 특권에 발을 담그고 정의를 논할 때, 우리는 더러운 현장에서 타협을 해가며 공무를 처리했어. 그게 사회고, 현실이라고!"
41190-81 = "나라고…… 나라고 해서 이런 더러운 일에 손을 담그고 싶은 줄 알아?"
41190-82 = "정의를 위해서라면 가끔은 손에 흙을 묻혀야 할 때도 있는 법이야!"
41190-83 = "너희들은…… 너희 같은 애송이들은 절대로—!"
41190-87 = "[ns] \"그건 핑계에 불과해, 칸나.\""
41190-88 = "이 목소리는……?"
41190-89 = "…… [USERNAME] 선생님, 당신이셨군요."
41190-90 = "[s1] \"신념을 지키는 건 쉽지 않은 일이지.\"\n[s2] \"하지만 포기하면 아무것도 변하지 않아.\""
41190-91 = "하지만…… 제 신념에 따라 행동했다가는 모든 것을 잃게 될 텐데……"
41190-92 = "하지만…… 제 신념에 따라 행동했다가는 모든 것을 잃게 될 텐데……"
41190-93 = "일개 국장인 제가 무얼 할 수 있단 말입니까!"
41190-94 = "[s] \"그건 RABBIT 소대도 마찬가지였어.\""
41190-98 = "……."
41190-99 = "[s] \"분명 쉽지 않은 일이겠지만……\""
41190-101 = "[ns] \"그래도 결정은 자신이 내릴 수 있으니까.\""
41190-107 = "선생님도 가끔은 좋은 소리를 하네."
41190-108 = "암, 자신의 미래는 자신이 결정해야 하는 법이지."
41190-109 = "우리도 공원에서 노숙을 하기로 결정했을 때는 불안하고 무섭긴 했지만……"
41190-110 = "그래도 우리가 선택한 SRT고, 우리가 결정한 미래니까!"
41190-111 = "……그렇게 말씀해 주셔서 감사합니다, 선생님."
41190-119 = "칸나 국장. 당신의 정의는 저와 다를지언정 틀리지는 않았습니다."
41190-120 = "하지만 그 핑계 때문에 책임을 타인에게 돌려버린다면, 당신의 정의도 끝내 빛을 잃게 되겠지요."
41190-121 = "그것이 [ruby=SRT]저희[/ruby]와 [ruby=발키리]당신[/ruby]의 차이입니다."
41190-122 = "나는……."
41190-126 = "미야코, 포인트 상공에 헬리콥터가 도착했어!"
41190-127 = "벌써 시간이 이렇게 되었군요."
41190-128 = "전원 하네스 결속 준비. 역순으로 퇴출합니다!"
41190-134 = "하네스 결속 준비 끝! 끌어 올려!"
41190-135 = "낙오되지 않게 꽉 잡으라고!"
41190-140 = "……먼저 실례하겠습니다, 칸나 국장님."
41190-141 = "다음번에는 좋은 일로 뵈었으면 좋겠습니다."
41190-147 = "미리 시말서를 준비해야겠군."
41190-149 = "코우사기 공원"
41190-153 = "현재 시각 0145시. RABBIT 1, 캠프 RABBIT에 지금 막 복귀했습니다."
41190-154 = "낙오된 소대원이나 부상자는 없으며, 회수 대상 <클로버>도 무사히 확보했습니다."
41190-160 = "……이것으로 금일 클로버 작전을 종료합니다. 다들 수고하셨습니다."
41190-161 = "[s] \"다들 수고 많았어!\""
41190-166 = "하아…… 지쳤다. 지금 당장이라도 쓰러질 것 같아……."
41190-167 = "나도…… 너무 졸려서……"
41190-168 = "그냥 바닥에서 잘 수 있을 것 같아……."
41190-173 = "미유. 아무리 졸려도 장비는 제대로 벗고 자야지……"
41190-174 = "그리고 작전 보고서도 쓰고, 세수랑 양치도 하고……."
41190-175 = "……안 되겠다. 나도 피로가 잔뜩 쌓여서…… 더는 못 견디겠어……."
41190-176 = "나도 긴장이 풀려서 그런가…… 졸음이 엄청 쏟아져……."
41190-177 = "통신 기기 전원…… 끄고 자야 하는데……."
41190-184 = "후후. 다들 무리한 작전 때문에 지친 모양이네요."
41190-191 = "……작전을 시작하기에 앞서 말씀드렸던 것처럼 <클로버>는 선생님께 맡기겠습니다."
41190-192 = "사건의 배후는 끝내 찾지 못했지만, 공안국의 국장을 포섭할 정도였으니 이 일을 기획한 사람은 저희가 상상도 하지 못할 정도의 거물이겠지요."
41190-193 = "어른의 세계를 알지 못하는 어린아이들인 저희가 할 수 있는 일은 여기까지입니다."
41190-194 = "그럼, 선생님. 뒤를 부탁드리겠습니다."
41190-195 = "[s] \"나머지 일은 맡겨줘.\""
41190-197 = "(이후, 잠이 든 학생들을 텐트로 옮겨 주고 샬레로 돌아왔다.)"
41190-201 = "(……미야코에게 받은 증거물은 어른의 방법으로 처리했다.)"
41190-203 = "다음화;굴속의 여우"
