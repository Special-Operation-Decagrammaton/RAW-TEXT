[translation]
2004102-1 = "합리적인 생활"
2004102-2 = "(리오가 이야기해 준 방법대로, 약속 장소에 도착했다.)"
2004102-3 = "(안전과 보안을 위해서라지만…… 그 과정은 제법 번거로웠다.)"
2004102-7 = "왔어, 선생? 많이 기다렸을까?"
2004102-8 = "방금 도착했다고? 그래. 예측대로네. 가장 합리적인 방법으로 선생의 동선을 산정해 두었으니까, 당연하겠지."
2004102-9 = "[s] \"일단, 한 가지 묻고 싶은 게 있는데…….\""
2004102-10 = "응? 평소 식사를 어떻게 하고 있냐고?"
2004102-11 = "그거야 당연히, 저녁 세일 도시락과 냉동식품이지. 이건 매우 합리적인 선택이야."
2004102-12 = "우선, 저녁 세일 도시락은 50%까지도 할인하는 경우가 많고, 맛도 나쁘지 않아."
2004102-13 = "특히 돈까스 도시락과 가라아게 덮밥이 일품이지."
2004102-14 = "……오늘은 예정에 없던 휴무였지만."
2004102-15 = "그 대신 경쟁이 치열하기는 한데, 그 정도는 당연히 붙을 수 있는 페널티라고 생각해."
2004102-16 = "냉동식품의 경우, 유통기한도 길고 한 번에 많이 보관할 수도 있어."
2004102-17 = "그야말로, 합리적이지."
2004102-18 = "[s1] \"그러다 몸 버려…….\"\n[s2] \"차라리 좀 건강한 걸로 배달시켜 먹어…….\""
2004102-21 = "배달은 안 돼. 비합리적이야. 무엇보다, 추적당할 위험이 있어."
2004102-22 = "만에 하나 배달원이 내 얼굴을 기억하게 된다면…… 그건, 그것 나름대로 위험하고."
2004102-23 = "거기에 배달 리뷰를 쓰면, 할인을 해 주거나 덤을 얹어 주는데."
2004102-24 = "그런 서비스를 제공하는데도, 하지 않는 것은 그야말로 비합리의 극치이지."
2004102-25 = "그렇지만 리뷰를 썼다가는 추적당할 가능성이 다시 생겨날 것이고……."
2004102-26 = "우리는 이런 현상을 딜레마라고 부르기로 사회적 합의를 했어."
2004102-27 = "그리고 이제부터는, 가능한 한 딜레마 상황을 피하려고 해."
2004102-28 = "그야말로, 합리적이지."
2004102-29 = "[s] \"그렇게 살다가 나중에 병원비가 더 나온다……?\""
2004102-30 = "으, 응? 도시락이나 냉동식품은 튀김 같은 게 많아서……."
2004102-31 = "지방 함유량은 너무 높고, 탄수화물 위주인 데다, 섬유질이나 비타민도 부족하다고……?"
2004102-32 = "……그래. 그럴 가능성이 있다는 건 부정하지 않아. 그래도 비타민은 영양제로 먹으면 되고……."
2004102-33 = "섬유질은……."
2004102-34 = "아직은 몸이 버텨 주니까, 괜찮지 않을까?"
2004102-35 = "[s] \"안 괜찮습니다.\""
2004102-36 = "시, 식물 섬유가 영향을 주는 범위는, 그렇게까지 크지 않다고 생각해. 영양제로 필수 영양소를 보충하고 있기도 하고……."
2004102-37 = "무엇보다 나, 요리 못 하는걸……."
2004102-38 = "응? 내 발명품으로, 요리하는 아방가르드 군 같은 거 만들면 안 되냐고? 레시피는 인터넷에도 많으니까?"
2004102-39 = "그게, 해 본 적이 없어서……."
2004102-40 = "[s] \"없어서?\""
2004102-44 = "……무서워……."
2004102-48 = "[ns3] \"갈!!!\"\n[ns4] \"안 되겠다. 나랑 같이 저 앞에 마트 가자.\""
2004102-51 = "아냐. 거기는 세일을 안 해. 이건 비합리적인 선택이야."
2004102-52 = "[s] \"내가 사 줄 테니까, 가자!\""
2004102-53 = "아, 알았어……."
2004102-55 = "(리오의 손을 잡고 마트로 향했다.)"
2004102-58 = "그, 그건 뭐야. 선생? 뭔가 흰색 야채가, 프랙털 구조로 성립되어 있는데……? 하우스도르프 차원은…… 2.7 정도인가……."
2004102-59 = "콜리플라워라는 야채라고? 뭐, 뭔가 먹기 무서워……. 응? 잘 삶으면, 감자 맛이 난다고……?"
2004102-64 = "감자, 당근, 그리고 양파……. 그리고 토마토네. 응. 이 정도는 나도 알 것 같아. 거기에……."
2004102-65 = "고, 고기를 그렇게 많이 사도 되는 걸까……?"
2004102-67 = "(그렇게, 아무것도 모르는 리오에게 하나하나 쇼핑을 가르쳐 주었다.)"
2004102-68 = "(사실 잘 모르는 것은 이쪽도 마찬가지라, 인터넷의 도움을 많이 받기는 했지만…….)"
2004102-70 = "……."
2004102-71 = "확실히, 단백질과 야채 위주의 구성이네. 탄수화물 함량이 이전에 비해 확연히 적어진 것 같기도 하고."
2004102-72 = "그런데, 이제부터 어쩔 생각이야. 선생?"
2004102-73 = "[s] \"오늘은 내가 샬레에서 요리를 해 줄게.\""
2004102-74 = "어, 어? 선생, 요리도 할 줄 알아?"
2004102-75 = "하나도 못 한다고? 그러면 어떻게……? 인터넷 레시피를 보면서 그대로 따라 하면, 먹을만한 게 나올 거다……?"
2004102-76 = "……예감 같은 것에 너무 의지하는 것은 비합리적이겠지만……."
2004102-77 = "뭔가, 불안하다는 느낌이 들어."
2004102-78 = "[s] \"정곡을 찔려서 아프구만요…….\""
2004102-80 = "(이래저래 여러 과정을 거쳐, 샬레로 돌아왔다.)"
2004102-84 = "[ns] \"조금 쉬고 있어. 어떻게든 해 볼게.\""
2004102-85 = "으, 응."
2004102-94 = "이건……?"
2004102-95 = "스튜는 어떤 의미에서 누구나 할 수 있는 요리라고?"
2004102-96 = "……."
2004102-97 = "고마워, 선생. 잘 먹을게."
2004102-102 = "(우리는 당분간 말없이, 그릇의 스튜를 비워 갔다.)"
2004102-104 = "뭔가."
2004102-105 = "[ns] \"뭐, 뭔가……?\""
2004102-106 = "맛없지는 않지만."
2004102-107 = "맛있지만도 않은…… 그런 맛이네."
2004102-108 = "[s] \"역시 그런가…….\""
2004102-109 = "……."
2004102-110 = "그래도."
2004102-117 = "어째서인지, 가슴이 따듯해지는 맛이야."
