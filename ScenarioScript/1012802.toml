[translation]
1012802-1 = "잔해와 상상력"
1012802-2 = "(다음 날, 외근을 마치고 샬레로 돌아가던 중이었다.)"
1012802-9 = "[ns] \"응?!\""
1012802-11 = "[ns] \"무슨 일이지?!\""
1012802-13 = "호오…… 피날레를 이런 식으로 구성한 건가……."
1012802-14 = "제법 심오하군요. 언어로 표현될 수 없는 그 너머를 행위로 재현하는 것일까요……."
1012802-15 = "아니 근데 대체 왜 저런 짓을 하는 거래요?"
1012802-16 = "저게 바로 행위 예술이라는 거지, 행위 예술."
1012802-18 = "[ns] \"행위 예술……?\""
1012802-20 = "(그렇게 다가가 본 현장에는…….)"
1012802-21 = "(부서진 TV와 모니터, 라디오와 카메라들이 나뒹굴고 있었다.)"
1012802-22 = "(그리고 그 잔해의 중심에는…….)"
1012802-24 = "오, 이게 누구야! 선생님 아니십니까!"
1012802-25 = "[s] \"후유, 이건 대체……?\""
1012802-26 = "아, 이 잔해들 말씀이죠?"
1012802-27 = "쉽게 설명하자면……."
1012802-28 = "정지된 오브제, 혹은 춤, 혹은 노래, 혹은 연설……."
1012802-29 = "그러한 개별적인 행위들의 단독적인 정립만으로는 규정될 수 없는……"
1012802-30 = "어떤 비의를 체현하기 위한 예술적 몸부림이라고나 할까요……."
1012802-31 = "[s] \"……쉽게 설명한 거 맞지?\""
1012802-32 = "조금 더 축약하자면, 미디어아트 행위 예술 공연이었습니다."
1012802-33 = "[s] \"처음부터 그렇게 말해 줘……!\""
1012802-37 = "[ns] \"아, 그럼 어제 외출한다고 했던 게…….\""
1012802-38 = "예. 이 공연을 사유로 외출 허가를 받았습니다."
1012802-39 = "……물론 이것 말고도 사소한 '부업'도 할 예정이긴 하지만요."
1012802-40 = "보시다시피, 제가 추구하는 예술은 상당히 돈이 많이 드는 분야거든요."
1012802-41 = "전자기기도 많이 필요하고, 그것들을 개조할 장비들도 필요하고……."
1012802-42 = "[s] \"그래서 특수교역부 활동을 하는 거였구나.\""
1012802-43 = "그렇다고 볼 수 있죠. 꼭 그것 때문만은 아니지만……."
1012802-44 = "아무튼 아쉽네요. 하필 공연이 딱 끝난 타이밍에 오시다니."
1012802-45 = "이번 공연, 나름 심혈을 기울여 기획한 작업이었거든요."
1012802-46 = "예? 어떤 공연이었냐고요?"
1012802-47 = "후후, 그걸 말씀드리면 재미없지요."
1012802-48 = "말로는 전달하기 힘든 무언가를 표현하기 위한 공연이었는데……."
1012802-49 = "그것을 말로 설명해 버린다면 김이 새지 않겠어요?"
1012802-50 = "[s] \"그런가……?\""
1012802-51 = "반대로, 오히려 상상을 해보시는 건 어때요?"
1012802-52 = "지금 이곳 바닥에 흩어져 있는 잔해들 하나하나의 위치, 형상, 공연이 끝난 후 관람객들의 반응, 분위기……."
1012802-53 = "이 단서들만 조합해서, 제가 했던 공연을 상상해 보는 거예요."
1012802-54 = "어쩌면, 거기서 새로운 예술의 지평이 도출될 수도 있지 않을까요?"
1012802-55 = "[s] \"쉽지 않구나, 예술이란…….\""
1012802-56 = "뭐 그렇다 해도 역시 제일 좋은 건……."
1012802-57 = "맨 앞줄에서 직접 관람하시는 거죠, 후후."
1012802-58 = "아니면 저와 함께 무대 위에서 퍼포먼스를 하시는 것도……."
1012802-59 = "[s] \"다음에는 꼭 관람하러 올게!\""
1012802-60 = "하하! 단호하시군요!"
1012802-61 = "뭐, 괜찮습니다. 중요한 것은……."
1012802-62 = "다음에 또 만날 수 있다, 그것이니까요."
1012802-63 = "자! 그러면 오늘은 여기서 이만 인사드리겠습니다!"
1012802-64 = "저는 남은 잔해들을 치우고 갈 테니, 선생님은 먼저 들어가세요!"
1012802-65 = "……예? 선생님도 같이 치우시겠다고요?"
1012802-66 = "굳이 그렇게 도와주실 것까진……."
1012802-67 = "[s1] \"잔해를 하나하나 치우면서 한 번 상상을 해보려고.\"\n[s2] \"이 공연을 통해, 작가가 무엇을 말하고 싶었는지.\""
1012802-70 = "선생님……."
1012802-71 = "[s] \"그, 그러니까 따, 딱히 도와주려는 건 아니니까!\""
1012802-72 = "푸핫!"
1012802-73 = "……예, 그럼 같이 치워 봐요."
1012802-74 = "고마워요, 선생님."
1012802-76 = "(그 뒤, 후유와 함께 공연 현장의 잔해를 치웠다.)"
