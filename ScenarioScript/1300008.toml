[translation]
1300008-1 = "좋은 아침입니다 주인님."
1300008-2 = "샬레 하우스"
1300008-4 = "후훗. 아직도 잠들어 계시네요."
1300008-5 = "좋은 꿈을 꾸고 계신 것 같아 죄송하지만……"
1300008-6 = "이제, 눈을 뜨실 시간입니다."
1300008-13 = "일어나셨군요."
1300008-14 = "좋은 아침입니다. 주인님."
1300008-15 = "평소보다 이른 시간이라고요? 맞아요. 제가 일찍 깨워드렸답니다."
1300008-16 = "그 이유는…… 나중에 말씀드릴게요."
1300008-17 = "후훗. 불쾌하셨다면 벌을 주셔도 좋아요."
1300008-18 = "아니! 벌을 강력히 희망합니다!"
1300008-19 = "주인님의 건전한 생활과 규칙적인 식사를 위해서라면 이 아카네, 지옥에 떨어져도 환하게 웃을 자신이 있답니다."
1300008-20 = "어서 벌을!"
1300008-21 = "……."
1300008-22 = "…… 어머. 괜찮으시다고요?"
1300008-23 = "자상하시기도 해라. 후훗."
1300008-25 = "앗. 다시 누우시다니, 안 돼요~ 어서 일어나세요."
1300008-26 = "포기하시고…… 어머? 어머? 어머? 왜 절…… 아앗!?"
1300008-27 = "엇?"
1300008-30 = "아, 아이참."
1300008-31 = "치, 침대로 메이드를 강제로 끌어들이시다니……"
1300008-32 = "넷…… 같이 자자고요?!"
1300008-33 = "아아. 세상에. 이런 망측한…… 아무리 주인님이라 해도 이건……"
1300008-35 = "응?"
1300008-36 = "……"
1300008-37 = "마. 맙소사."
1300008-38 = "지…… 진짜로 잠든 건가요?!"
1300008-39 = "이럴수가! 믿을 수 없어! 일어나요! 안 돼요!"
1300008-40 = "…… 후우"
1300008-41 = "사실…… 조금 이른 시간에 주인님을 깨우러 온 이유는……"
1300008-42 = "조금이라도 빨리 주인님을 만나서 얘기하고 싶었기 때문이랍니다."
1300008-43 = "……"
1300008-44 = "흐음…… 이대로 있는 것도…… 나쁘지 않네요."
1300008-45 = "후훗. 따뜻하네요."
1300008-46 = "이대로 함께 아침의 행복을 누리는 것도 좋겠지만……"
1300008-48 = "제가 준비한 것은, 따로 있으니까요."
1300008-49 = "아마…… 곧 보실 수 있을 거예요."
