[translation]
10037080-1 = "제8화;인형의 말에 귀를 기울이다."
10037080-3 = "갑작스레 새로운 극의 첫 공연이라니……. 신기하구만."
10037080-4 = "뭐, 저번 공연도 괜찮았으니까, 이번에도 괜찮은 게 나오겠지!"
10037080-5 = "그래. 나도 기대되는구나. 카구야가 이렇게까지 큰 의욕을 보이는 것도 오랜만이었으니 말이다."
10037080-6 = "음! 이 선율에도 조금이지만 익숙해진 것 같군!"
10037080-7 = "갑옷을 입은 배우들이 일렬로 달려 나오고, 나란히 늘어서고……."
10037080-11 = "이번에도 주역은 검은 갑옷을 입고 있구나! 조금씩 디테일이 보이기 시작했어!"
10037080-12 = "후후. 그러한가. 그것은 참으로 좋은 일이구나."
10037080-22 = "산다는 것은 커다란 꿈과 같더니."
10037080-25 = "어찌 아둥바둥 삶을 살아가려 하랴."
10037080-26 = "되는대로 기둥 아래 누워 있다가."
10037080-27 = "홀연히 깨어나 뜰 앞을 보도다."
10037080-29 = "꽃 사이 새 한 마리 울고 있으니."
10037080-31 = "물어나 보자, 지금이 어느 때이냐."
10037080-32 = "봄바람에 흐르는 듯 꾀꼬리 소리."
10037080-34 = "크게 노래하며 달을 기다린다!"
10037080-39 = "서장은 언제나 세상 풍경 이야기로 시작하네……."
10037080-40 = "경극이라는 게 정해진 형식대로 가는 거잖아. 이것도 일종의 구령 같은 거지."
10037080-41 = "그래도 이번엔 카구야 부장이 새로 쓴 모양이지?"
10037080-42 = "며칠만에 후다닥 작업했다니 말이야. 대단하구만."
10037080-47 = "가벼운 안개가 호수 위에 피어오르고."
10037080-48 = "햇살이 나부끼니 올해도 풍년이로다."
10037080-49 = "더 바랄 것이 없으니 세상은 평안하고."
10037080-50 = "용과 봉황이 상서로운 기운을 입안에 품었도다."
10037080-52 = "보아라, 사람들아. 검은 군주가 뜰을 거닐고 있다."
10037080-53 = "영민하고 날카롭지만, 시야가 좁고 용렬한 자."
10037080-54 = "다스리고 군림하지만, 눈을 낮추지 못하는 자."
10037080-58 = "자신의 부족을 알 만큼은 지혜롭지만."
10037080-59 = "그것을 극복할 만큼은 용감하지 못한 자가!"
10037080-64 = "어…… 어?! 자, 잠깐. 지금, 분명……?"
10037080-65 = "목소리가 너무 커! 우리, 잘못 들은 거 아니지?"
10037080-66 = "그, 그냥 옛 고사나 비유 같은 것일 수도 있잖아? 조금 더 들어 보자……."
10037080-67 = "아무리 그래도…… 너무 오해 사기 쉽게 해 놨네……. 검은 군주라니……."
10037080-69 = "나, 검은 군주가 입을 빌어 말하겠다."
10037080-70 = "숨겨진 다툼은 마당을 덮었고, 감추어진 원망이 서까래에 닿았다."
10037080-71 = "이에 닫힌 문을 열고, 바깥의 바람을 부르겠노라."
10037080-72 = "그것이 나의 길이니, 모두 이를 듣고 행하도록 하라."
10037080-77 = "(……!? 닫힌 문을 열고, 바깥의 바람을 부르겠다……?)"
10037080-78 = "(느낌이 좋지 않은 것이다……. 다른 학생들은 어떤 것이냐. 특히 현룡문 부원들은……?)"
10037080-85 = "(현룡문 부원들은 다른 산해경 학생들에 비해서 특히 경극을 읽을 줄 아는 학생들인데……?!)"
10037080-86 = "(카구야…… 무슨 생각인 것이냐?!)"
10037080-88 = "굽어 살피고, 돌이켜 생각하소서."
10037080-89 = "뜻을 거스르는 자에게 화가 닥치고."
10037080-90 = "하늘의 힘이 지극히 이처럼 신령하니."
10037080-91 = "인간의 잔재주가 무슨 소용이 있겠습니까."
10037080-93 = "평안함 속에서 위태로움을 생각하고."
10037080-94 = "위태로움 속에서 다시 평안함을 생각한다."
10037080-95 = "천지의 조화가 이와 같이 예측할 수 없으니."
10037080-96 = "바람의 힘으로 눌린 것을 펴고, 편 것을 다시 누르리라."
10037080-98 = "보아라. 사람들아. 인간의 지혜가 이토록 짧다."
10037080-99 = "지혜를 뽐내는 자마다 어리석어질 것이고."
10037080-100 = "분수에 넘치는 복과 까닭 없는 횡재를 조심하라."
10037080-101 = "눈을 보다 높은 곳에 두지 않으면, 그 술수에 빠져들고 말 것이니."
10037080-103 = "경극부 쟤네들 왜 저래?!"
10037080-104 = "뭔가 문주님께 불만이라도 있는 건가? 그런 거였다면 차라리 붉은겨울 방문단이 없을 때 이러는 게……."
10037080-105 = "자, 잠깐. 혹시 그 붉은겨울 방문단 때문에 저러는 거 아냐?!"
10037080-106 = "어……. 그러고 보면 확실히, 애초에 방문단을 받지 않았더라면……?"
10037080-108 = "보아라, 사람들아. 검은 군주가 바람을 불러들였다."
10037080-109 = "닫힌 문이 열리고, 온갖 먼지가 그 안을 횡행하니."
10037080-110 = "물은 바람을 이기지 못하고, 땅이 황충에 갈라지고 말았구나."
10037080-115 = "오만한 자가 스스로를 돌아볼 줄 모르니, 눈물이 비 대신 땅을 적신다!"
10037080-120 = "(……!)"
10037080-121 = "(카구야가, 나를……? 그것도 현룡문 모두의 앞에서……?!)"
10037080-127 = "(윽……. 아직 상태가 온전하지 않구나. 그렇지만…….)"
10037080-133 = "나, 검은 군주가 입을 빌어 다시 말하겠다."
10037080-134 = "산은 높음을 꺼리지 않고, 바다는 깊음을 꺼리지 않는 법."
10037080-135 = "남겨진 땅이 바람을 반길 것이요, 하늘이 구름을 품을 것이다."
10037080-136 = "내가 천하를 저버릴지언정, 천하가 나를 버리게 하지는 않을 것이다!"
10037080-137 = "다시 통촉드리오니, 마음을 가라앉히고 몸을 돌보소서."
10037080-138 = "일어나기 전에 올 것을 알고, 시작되면 마무리를 궁리하니."
10037080-139 = "충언을 받아들이는 것이 존속의 법입니다."
10037080-140 = "작은 이익을 탐하여 무리를 잃으니, 이 어찌 통곡하지 않을 수 있겠습니까!"
10037080-145 = "저 검은 군주라는 자, 강단이 있구나. 추진력도 있고. 아무렴, 지도자란 그래야지!"
10037080-146 = "그에 반해 저 신하들은 무엇이냐! 다 뜻이 있어서 하는 일인 것을!"
10037080-147 = "물론 우리 같은 위대한 지도자의 정책을, 한낱 참새 같은 신하들이 이해할 수는 없겠지만 말이야. 그렇지 않은가, 키사키 문주?"
10037080-153 = "어? 뭔가 안색이 좋지 않아 보이는데, 괜찮은 건가? 문주?"
10037080-157 = "아……. 괜찮다. 문제없느니라. 체리노 서기장."
10037080-158 = "(그렇게 이번의 교류회가 마음에 들지 않았는가, 카구야.)"
10037080-159 = "(아니……. 그렇다기보다는 경극의 형식으로 상소를 고하고자 하는 것인가……?)"
10037080-161 = "검은 군주가 바람을 불렀으니."
10037080-162 = "하늘에서 폭우가 내리고, 강물이 넘치도다."
10037080-163 = "산과 들이 잠기고, 큰 파도가 바다를 덮었다."
10037080-165 = "번개와 용오름이 땅을 뒤엎으니, 울음과 원망이 메아리를 울리는구나!"
10037080-170 = "지금 우리가 뭐 잘못 듣고 있는 거 아니지?!"
10037080-171 = "……그렇지만, 문주님이 먼저 붉은겨울 방문단을 초대하신 것은 사실이긴 하지……."
10037080-172 = "그 방문단이 뭔가 큰 사고를 쳤다거나 한 건 아니잖아?!"
10037080-173 = "아니…… 나는 조금 알 것 같아. 큰 제방도 작은 구멍 때문에 무너지기 마련이잖아."
10037080-174 = "……즉, 붉은겨울 방문단을 시작으로, 문주님께서 점점 외부 세력을 받아들이기 시작하실 거라는 것?"
10037080-175 = "그렇게 되지 않기를 바라지만……."
10037080-176 = "저번 만년삼 사건 때도 그랬고, 문주님께서 정말 산해경의 전통을 지키려 하고 계시는지는……. 아주 조금, 의문이 들 때가 있긴 해……."
10037080-177 = "마, 말조심해!"
10037080-178 = "그러니까 작은 목소리로 말하고 있잖아……!"
10037080-183 = "고통이 강같이 흐르고, 원망이 하늘에 닿았습니다."
10037080-184 = "좋은 약은 입에 쓰나 병에는 이롭고."
10037080-185 = "충언은 귀에 거슬리나 행실에는 이롭습니다."
10037080-186 = "지금이라도 마음을 돌이켜 바른길을 걷는다면."
10037080-187 = "앞으로도 뒤로도 치우치지 않으며 되돌이킬 수 있을 것입니다."
10037080-189 = "내가 틀리지 않았으니, 뜻을 굽히지 않겠다!"
10037080-191 = "통촉하여 주시옵소서!"
10037080-192 = "봉황의 뜻을 참새가 어찌 헤아리겠는가!"
10037080-193 = "참새의 생명도 봉황의 생명도, 모두가 같은 생입니다!"
10037080-198 = "(으아아……. 으아아아아……!)"
10037080-199 = "(카구야는 무슨 생각을 하고 있는 것이냐……! 아니, 그보다…….)"
10037080-205 = "(현룡문 부원들의 불안한 기운이, 오히려 더 큰 문제인 것이다……!)"
10037080-206 = "(차라리 직설적으로, 격문 같은 형식으로 이런 메시지를 전달하려 했다면 효과가 적었을 것을……!)"
10037080-207 = "(공연이라는 형식으로 은근하게, 그렇지만 공공연히……!)"
10037080-208 = "(차라리 문주를 이 자리에서 피신시켜야 하는 것이다!)"
10037080-214 = "……불꽃 모양이 그려진 깃발을 들고, 배우들이 무대를 뛰어다니는군요."
10037080-215 = "저건 그러니까…… 세상이 불타고 있다는 걸 의미하는 거라고 했지요?"
10037080-216 = "이번에는 흐르는 물 모양의 깃발을……."
10037080-217 = "그렇다는 건 홍수를 뜻하는 겁니까?"
10037080-218 = "번개에 메뚜기 떼에…… 이번에는 모든 재난이 한데 모여 일어나고 있다는 모양이네요."
10037080-224 = "(혹시나 해서 쭉 주의하고 있었습니다만.)"
10037080-228 = "(……이건, 쿠데타군요.)"
10037080-230 = "보아라, 사람들아. 마침내 검은 군주가 스스로 넘어지고 말았으니."
10037080-231 = "군주란 모름지기 천하를 올바르게 다스려야 하는 것을."
10037080-232 = "제 욕심과 부족함에 천기를 거스르고 말았으니."
10037080-233 = "모두가 슬피 울며 이를 갈아도, 무엇이 남겨지겠는가."
10037080-235 = "결국 천기를 언급했어……!"
10037080-236 = "……적어도 카구야 부장이 무슨 말을 하고 싶은지는 알겠어……."
10037080-237 = "하지만…… 우리 문주님이잖아……?"
10037080-238 = "그것도 그렇긴 한데……. 정말로 생각하기 싫은 일이지만……."
10037080-243 = "문주님께서 혹시, 산해경의 전통을, 정말은 지킬 마음이 없으신 거였다면……?"
10037080-244 = "나, 난 생각하지 않겠어, 그런 거!"
10037080-246 = "저기 보이는 곳이 우리 집이나."
10037080-247 = "소나무 잣나무만 우거졌다네."
10037080-248 = "산토끼 개구멍을 들락거리고."
10037080-249 = "무심한 꿩 들보 위를 날아가네."
10037080-250 = "곡식을 훑어 찧어 밥을 짓고."
10037080-251 = "아욱을 뜯어 국을 끓이네."
10037080-252 = "국과 밥은 금방 다 되었건만."
10037080-253 = "누가 있어서 함께 밥을 먹으랴."
10037080-255 = "아아…… 너무 가슴 아픈 가사야……."
10037080-256 = "모든 게 쇠락해서, 함께 밥을 먹을 사람조차 이제는 없다니……."
10037080-260 = "……저게, 산해경의 미래라면?"
10037080-261 = "……그럴 리가, 없어……! 없을 거라고……!"
10037080-262 = "봐. 너도 목소리에 자신이 없잖아."
10037080-268 = "그러니 들어라, 사람들아. 항상 겸손하고 돌아보며, 정진을 잊지 말라."
10037080-269 = "전해지는 것들에는 까닭이 있기 마련이거늘."
10037080-273 = "어제를 돌아봄이 내일로 이어짐을 알지 못하고."
10037080-274 = "천명에 눈을 돌리고 깨닫지 못한 척을 하였으니, 필연 외에는 받을 것이 없었다."
10037080-275 = "이와 같은 일이 일어나지 않도록–"
10037080-279 = "–산해경과 그 전통의 이름으로, 현 현룡문의 문주, 류우게 키사키를 논핵(論劾)한다!"
10037080-288 = "……!"
