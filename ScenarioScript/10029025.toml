[translation]
10029025-2 = "……과연, 그런 이야기였구나."
10029025-3 = "미사카 씨 다운 이야기랄까. 정말이지 묘한 데에서 순진하달까……."
10029025-4 = "하지만 보다시피……. 이렇게 아직, 아무 일도 없었는걸?"
10029025-5 = "난 미사카 씨와 달라서, 다짜고짜 싸움을 걸거나 하지는 않거든."
10029025-9 = "[ns1] \"……미사카? 이 친구가 '쇼쿠호'?\"\n[ns2] \"이야기랑 달리 얌전한 것 같은데.\""
10029025-12 = "아, 어. 으응. 맞아. 맞긴 한데……."
10029025-13 = "아니. 잠깐. 잠깐! 이렇게 되면 나만 이상한 사람이 되는 것 같잖아!!"
10029025-14 = "뭐야, 쇼쿠호!? 이상하잖아! 너, 그런 녀석 아니었잖아!? 왜 얌전한 건데!?"
10029025-16 = "어머나. 이제는 자기 생각과 다르니 언성을 올리고 있네? 물론 미사카 씨가 그런 타입이기는 하지만?"
10029025-17 = "그렇다고 사람을 다짜고짜 문제아로 몰아가다니……. 모함이 조금 지나친 게 아닐까?"
10029025-18 = "게다가 이런 곳에 와서, 신변도 모르는 사람에게 다짜고짜 능력까지 다 말해줘 버리고……."
10029025-19 = "하아. 조금 충격이랄까? 어느 정도 예상은 했지만, 그래도 이렇게까지 단순한 사람일 거라고는 생각지 않았는데……."
10029025-20 = "뭐라고……?"
10029025-21 = "……응? 어라. 또 이러네."
10029025-22 = "……으음……. 전력이……."
10029025-23 = "[s3] \"무슨 문제라도 있어?\"\n[s4] \"어딘가 불편해 보이는데…….\""
10029025-26 = "아아. 뭐, 조금……. 별 건 아냐."
10029025-27 = "단지 여기 온 뒤로 조금……. 집중이 안 된다 해야 하나. 전격을 내려 하면 살짝 어지러워서 잘 안된다고 해야 하나……."
10029025-28 = "하려고 작정하면 못 할 거야 없는데, 평소보다는 조금 불편하네. 그냥 그런 정도."
10029025-29 = "……잠깐."
10029025-30 = "아하. 그렇다는 건……. 쇼쿠호, 혹시 너도……!"
10029025-31 = "그러니까 왜 그런 이야기를 자꾸 다른 사람들에게 계속 알려주는 걸까?"
10029025-32 = "거기다가 나까지 걸고넘어지면서? 사람이 기껏 태연한 척 숨기고 있었는데……?"
10029025-33 = "척 봐도 이곳에서의 우리는 이방인이잖아. 조금은 경계심이라는 걸 가지는 게 어떨까? 미사카 씨는?"
10029025-34 = "[s5] \"두 사람은 친구야?\"\n[s6] \"사이가 좋은가 보네.\""
10029025-38 = "전혀 아니거든!! / 전혀 아니거든?"
10029025-39 = "[s] \"……죄송합니다.\""
10029025-41 = "……하아."
10029025-42 = "그래서? 이렇게 다들 옹기종기 모여 나에게 온 이유도, 그 '상식'이라는 걸 건네주려고?"
10029025-43 = "그쪽은……. '선생님'……이라고 했던가?"
10029025-44 = "[s7] 엔지니어부에게 받은 총을 건네준다.\n[s8] \"맞아. 이걸 전해주러 왔어.\""
10029025-47 = "흐응……."
10029025-52 = "……가볍네."
10029025-53 = "이런 걸 직접 들고 다니는 건 타입이 아니지만……. 뭐, 여기서는 없는 쪽이 더 눈길을 끄는 것 같았고."
10029025-54 = "일단은 감사를 해둬야겠지만……. 유감스럽게도 그렇게 붙임력 좋은 성격은 아니거든."
10029025-55 = "대신이라고 말하긴 뭐하지만, 나중에 도움이 필요할 때 협력해서 갚는 쪽으로 생각해도 되겠지?"
10029025-56 = "……뭐야. 평소답지 않게 털털하네. 너 치고는 꽤 솔직한 분위기잖아."
10029025-57 = "누구 덕분에 그런 상황이 됐는데……?"
10029025-58 = "이쯤 되면 알고서 일부러 이러는 게 아닌가 싶어지는데, 미사카 씨는?"
10029025-59 = "……??? 이게 내 잘못이라고?"
10029025-61 = "어느 쪽이 됐건 지금은 협력하는 게 효율적이니까. 사적인 관계는 따로 해결하는 편이 좋겠어."
10029025-62 = "마지막으로 남은 한 명도……."
10029025-66 = "……어라."
10029025-71 = "[ns9] \"……에이미?\"\n[ns10] \"뭔가 연락이라도 왔어?\""
10029025-74 = "부장으로부터의 연락. '설비'에 대한 조사가 끝났대. 일단 지금 돌아오라고 하네."
10029025-75 = "아. 그리고 세 번째 사람에 대해서는 걱정하지 않아도 된다고도 했어."
10029025-76 = "……이미 부장이 연락해서, 같이 만난 상태래."
