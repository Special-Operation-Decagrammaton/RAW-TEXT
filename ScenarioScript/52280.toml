[translation]
52280-1 = "제28화;함께 꽃이 피길 기다리며"
52280-2 = "병원 내 입원 병동"
52280-5 = "네, 들어오셔요~"
52280-9 = "어머나, [USERNAME] 선생님?"
52280-10 = "기별도 없이 갑작스럽게……"
52280-11 = "[s1] \"니야가 입원을 했다고 해서, 병문안을 왔어.\"\n[s2] \"몸은 좀 괜찮아?\""
52280-14 = "냐하하…… 아무래도 괜한 소식으로 걱정을 끼쳐드린 것 같아 죄송스럽네요."
52280-15 = "보시다시피 저는 완벽하게 건강하답니다. 지난 사건 때 다친 상처도 거의 다 나았고요."
52280-16 = "다만…… 가벼운 찰과상이라 하더라도 백물어에게 입은 것이니, 혹시라도 모를 후유증이 있을지도 모른다며 카호가 하도 성화를 부려서요."
52280-17 = "치료와 더불어 여러가지 검사를 받기 위해 입원을 했을 뿐, 큰 부상을 입은 것은 아니니 안심하셔도 괜찮답니다."
52280-18 = "[s] \"그렇다면 다행이지만.\""
52280-19 = "이야…… 솔직히 말씀드리자면, 저 홀로 이렇게 입원해 있으려니 조금 면목이 없긴 하네요."
52280-20 = "정작 현장에서 치열하게 싸운 백화요란과 다른 동아리의 부원 여러분은 벌써 일상으로 돌아가신 모양인데 저만 이렇게 병상에 누워 있으니."
52280-21 = "하지만 모처럼 명분도 생겼으니, 이번에야말로 게으름을 부려도 아무도 뭐라 하지 못하겠지요. 후후……"
52280-22 = "[s] \"그런 것 치고는 침대 옆 탁자에 서류가 가득 쌓여 있는데……\""
52280-26 = "……윽. 이건 그러니까……"
52280-27 = "물론 저도 하염없이 게으름을 부리고 싶었지만…… 풍문 중에는 시일이 지나면 걷잡을 수 없이 커져 나중에는 대처할 수 없는 성질의 이야기가 제법 많으니까요."
52280-28 = "더욱이 이런 큰 사건이 끝난 직후에는 말을 얹기 좋아하는 호사가들이 몰려드는 법이라."
52280-29 = "급한대로 우선도가 높은 서류부터 살펴보고 있었답니다."
52280-30 = "절대~로 일하는 게 좋아서 이러고 있는 게 아니라고요?"
52280-31 = "[s3] \"알겠어, 알겠어.\"\n[s4] \"평소의 니야 다운 것 같아 다행이네.\""
52280-34 = "우선 검토한 내용 중 가장 중요한 안건을 몇 가지 정리해 말씀드리자면……"
52280-35 = "……와라쿠 축제가 무사히 성료되었답니다!"
52280-39 = "[ns] \"그게…… 중요한 안건이야?\""
52280-40 = "물론이고 말고요. 치세 냥의 귀여운 공연을 직관할 수 있는 기회는 흔치 않다고요?"
52280-41 = "더욱이 이번 공연에서 발표한 치세의 신곡이 SNS에서 소소하게 화제가 된 모양이라."
52280-42 = "카호는 이 기회에 치세 냥을 정식으로 아이돌 데뷔시키는 게 좋을지, 진지하게 상담을 해 오더군요."
52280-43 = "물론 치세가 바빠지면 그만큼 치세를 곁에 두고 지켜볼 시간도 줄어들 테니. 고민이 크다나, 뭐라나~"
52280-44 = "[s] \"그러고 보니 축제에 대해 묻고 싶은 게 있었는데……\""
52280-45 = "네, 부디."
52280-46 = "[s5] \"와라쿠 축제가 시작되자마자 히토츠메의 힘이 약화되었잖아?\"\n[s6] \"역시 백귀야행의 축제는 백물어를 몰아내는 제의를 겸하고 있었나?\""
52280-52 = "에이, 설마요~"
52280-53 = "아자미 양을 동요시키기 위해 허풍을 떨긴 했지만, 축제는 축제일 뿐이랍니다."
52280-54 = "먼 옛 축제의 기원이 하늘을 맞이하는 제사, 마츠리에 있다고는 하지만…… 지금에 와서는 이를 기억하는 사람도, 행하는 사람도 없으니까요."
52280-55 = "……다만, 오랫동안 준비한 축제가 중단된다면 슬퍼하는 사람이 많지 않겠어요?"
52280-56 = "슬퍼하는 아이에게는 사탕을 주고, 떼를 쓰는 아이에게는 주의를 준다."
52280-57 = "이는 음양의 원리까지 따질 필요도 없는 단순한 삶의 이치랍니다~"
52280-58 = "[s7] \"……그 자신만만한 선언이 허풍이었다니.\"\n[s8] \"화조풍월부가 그 말을 믿고 바로 물러가서 다행이었네.\""
52280-64 = "화조풍월부라 하니 떠올랐는데, 에비스 분교의 하부 아자미 양 말이지요."
52280-65 = "저 역시 에비스 분교의 현황은 서신을 통해서만 존재를 인지하고 있었기에, 이번 기회에 사람을 따로 보내 진상을 조사해 보았습니다만."
52280-66 = "조사 결과, 에비스 분교의 자치위원회는 수십 년 전부터 운영되지 않았다고 합니다."
52280-67 = "게다가 아자미 양의 이름을 기억하는 주민도 없었고, 그동안 제가 보냈던 공문을 수신한 사람도 없다고 하니……"
52280-68 = "[s] \"그 말인즉……\""
52280-69 = " ……네."
52280-73 = "이제는 에비스 자치구의 행정 업무도 저희가 처리하게 되었습니다."
52280-77 = "[ns] \"그쪽이 문제인 거야?!\""
52280-78 = "당연하지요! 그동안 손대지 않고도 돌아가고 있던 행정 업무 하나가 공석이 되었다는데……"
52280-79 = "아무래도 화조풍월부는 그동안 자치위원회의 이름을 은밀히 빌려 신분을 감추는 데 사용했던 모양입니다."
52280-80 = "신분을 숨기고 학생들을 속여 사익을 편취하려 한 점은 괘씸하지만, 자치구의 행정 업무만큼은 문제없이 처리해 주었는데……"
52280-81 = "늘어난 서류 업무가…… 멀어지는 안한자적의 삶이…… 으으……"
52280-82 = "[s] \"그 후로 화조풍월부의 흔적은 찾지 못한 거야?\""
52280-83 = "네. 지난번과 마찬가지로 사건이 끝나자마자 증발이라도 한 것처럼 화조풍월부의 흔적은 완전히 사라져 버리고 말았답니다."
52280-84 = "코쿠리코 부장도, 아자미 양도…… 저희와 함께 있던 슈로 양도."
52280-85 = "그때, 자신이 무슨 짓을 했는지 깨달았을 때 슈로 양이 지었던 표정은 사진으로 찍어 기록으로 남기고 싶었을 정도였는데, 아쉽게 되었네요."
52280-86 = "[s] \"성격이 나쁘다니까……\""
52280-87 = "냐하하…… 다만 슈로 양의 소설 계정은 여전히 남아 있으니, 변화가 생긴다면 새로운 연재가 올라오지 않을까요?"
52280-88 = "슈로 양의 글. 시간 때우며 읽기에는 나쁘지 않아서 개인적으로는 신작을 기대하고 있었거든요."
52280-89 = "……물론 전개만큼은 지리멸렬했지만."
52280-90 = "[s] \"그때와는 달리 평가가 박하지 않아?\""
52280-91 = "어쩔 수 없지요. 이야기꾼이란 본래 사소한 일로도 의지가 꺾여버리는 나약한 사람들이니까요."
52280-92 = "잘 어르고 달래 주어야 다음번에는 더 희망찬 이야기를 써오지 않겠어요?"
52280-93 = "[s] \"그러게. 다음의 이야기는 부디 평화롭기를.\""
52280-97 = "[ns] \"그나저나 아야메는 그 후로 어떻게……\""
52280-98 = "아, 아야메 부장이라면."
52280-102 = "저보다는 그녀의 친구들에게 듣는 편이 더 좋지 않을까요?"
52280-104 = "백귀야행 축제 거리"
52280-106 = "(백귀야행의 거리는 언제나처럼 사람들로 가득 차 있었다.)"
52280-107 = "(축제를 즐기려는 사람들과 축제를 준비하는 사람들……)"
52280-108 = "(마치, 이 거리에서 축제가 끊겼던 순간은 단 한 번도 없었다는 것처럼.)"
52280-115 = "앗, 주군!"
52280-119 = "선생 공, 무사했구나!"
52280-120 = "축제가 끝난 뒤로 연락이 되지 않으셔서…… 걱정했었어요!"
52280-121 = "[s9] \"미안, 그 뒤로 여기저기 불려 다니느라……\"\n[s10] \"이것저것 정리를 하느라 안부 전하는 게 늦었어. 미안해.\""
52280-124 = "괜찮아요. 주군께서 무사하셨다면, 이즈나는 그것만으로도 안심이니까요!"
52280-125 = "그보다 선생 공은 어디로 가던 중이었어? 음양부 부실은 저쪽 방향인데……"
52280-126 = "[s11] \"백화요란의 동아리 부실에 가던 중이었어.\"\n[s12] \"아야메와 나구사의 상태를 보려고.\""
52280-129 = "아야메라면…… 그 백화요란의 부장 말씀이시죠?"
52280-130 = "이번 사건이 끝나고 백화요란에 정식으로 복귀하셨다고 들었는데……"
52280-135 = "공식적으로 음양부와 백화요란에서는 그때 모습을 드러냈던 아야메 부장이 화조풍월부가 만들어 낸 가짜라고 말했단 말이지."
52280-136 = "나 역시 아야메 부장이 이런 일을 벌였을 거라곤 믿겨지지 않지만……"
52280-137 = "그때 마주했던 아야메 부장의 모습은, 가짜라기엔 뭔가 이상하리만큼 진심이 느껴져서……"
52280-138 = "선생 공, 혹시 뭔가 알고 있는 게 있어?"
52280-139 = "[s] \"그건……\""
52280-141 = "지, 진짜일 리가 없어요!"
52280-142 = "……이즈나?"
52280-143 = "이즈나도 나쁜 어른에게 속아 축제를 방해할 뻔한 적이 있었지만…… 그 때의 이즈나에게는 닌자에 대한 진심을 터놓을 수 있는 동료들이 없었으니까요."
52280-144 = "아닌 건 아닌 거라고, 말해줄 수 있는 친구가 곁에 있다면…… 나쁜 길로 빠지지 않게 말려주었을 테니까요."
52280-145 = "아야메 공은 나구사 공의 오랜 친구였다고 들었습니다."
52280-146 = "나구사 공이 곁에 있는 한…… 아야메 공이 그런 나쁜 일을 저지를 리가 없습니다!"
52280-147 = "마, 맞아요! 게다가 아야메 부장은 정의롭고 모두에게 친절한 사람이라고 들었는걸요."
52280-148 = "분명 잘못된 소문이었을 거예요."
52280-150 = "그런가…… 역시 소문은 소문이려나~"
52280-151 = "[s] \"그래. 소문을 맹신하는 것도 위험하니까.\""
52280-155 = "[ns13] \"그나저나 인법연구부에게도 이상한 변화가 있었던 모양인데……\"\n[ns14] \"지금은 원래대로 돌아온 거야?\""
52280-158 = "아, 맞다. 맞다. 선생 공, 들어 봐!"
52280-159 = "괴물들이 와라쿠 축제의 무대를 습격해 왔을 때, 갑자기 엄청난 힘이 솟아올랐어!"
52280-160 = "뭔가 금지된 요도의 저주를 받은 것처럼…… 엄청난 힘이었다구!"
52280-161 = "마, 맞아요! 정말 현실에서 인법을 사용하는 것처럼, 엄청나게 빠르게 내달릴 수도 있었거든요!"
52280-162 = "시험해 보지는 않았지만, 젖은 창호지 위를 내달릴 수도 있지 않았을까?"
52280-163 = "젖은 창호지 위를 달리는 장면이라면……"
52280-164 = "<방랑하는 고독한 77인의 닌자>의 클라이막스 씬을 말씀하시는 것이군요! 이즈나도 현실에서 꼭 해보고 싶은 장면입니다!"
52280-168 = "[ns] \"혹시 미치루는…… 그 힘을 잃게 되어서 아쉬워?\""
52280-169 = "아니? 딱히?"
52280-170 = "으음…… 아닌가? 다시 생각해 보니 그 힘이 있었더라면 미치룻치 채널에서 새로운 연출을 할 수 있었을지도 모르지만……"
52280-171 = "그런 영문 모를 힘이 있다고 해서 사람들에게 닌자의 매력을 더 잘 알릴 수 있을 것 같지는 않으니까."
52280-172 = "닌자의 가치는 강력한 힘이 아닌 유대에서 나오는 법."
52280-173 = "유일무이한 전설의 힘을 지닌 닌자가 되느니, 많은 벗을 지닌 평범한 닌자가 되겠다고……"
52280-177 = "<방랑하는 고독한 77인의 닌자>에서도 그렇게 말했거든!"
52280-178 = "이즈나도 그렇게 생각합니다!"
52280-179 = "저, 저도 그렇게 생각해요……!"
52280-181 = "[ns] \"……나도 그렇게 생각해.\""
52280-183 = "[ns15] \"그럼 다음번에 그 영화, 샬레에서 다 같이 볼까?\"\n[ns16] \"이번에 시청각실에 끝내주는 서라운드 스피커를 들여놨거든.\""
52280-186 = "오오…… 당장이라도 좋아!"
52280-187 = "하, 하지만 부장. 지금은 와라쿠 축제의 기재를 정리하러 가던 중이었잖아요……?"
52280-188 = "아차차…… 그랬었지. 그럼 다음에!"
52280-189 = "네! 다음에 함께 찾아뵙겠습니다, 주군!"
52280-190 = "조, 조심히 가세요…… 선생님!"
52280-194 = "백화요란 부실 앞 훈련장"
52280-198 = "잠깐, 렌게. 네가 지금 들고 있는 건 수국 묘목이잖니."
52280-199 = "지금 네가 땅을 파고 있는 곳은 동백 묘목의 바로 옆 화단이야. 겨울꽃 사이에 여름꽃을 심으면 꽃이 피었을 때 어떻게 보이겠어?"
52280-200 = "그 정도는 나도 알고 있거든? 오히려 이렇게 계절 꽃을 섞어 심어야 어느 때도 꽃을 감상할 수 있지."
52280-201 = "……그보다 계속 그렇게 위에서 잔소리만 할 거면 좀 내려와서 거들지 그래?"
52280-202 = "안 돼. 한 사람은 위에서 조감을 해야지. 숲 안에서는 나무가 보이지 않는 법이니까."
52280-203 = "말은 그렇게 해도 손에 흙이 묻는 게 싫어서 그러는 거 아니야?"
52280-207 = "……아니야."
52280-208 = "그럼 나랑 교체해! 이건 불공평하다고—"
52280-215 = "어머나, 선생님 오셨군요!"
52280-216 = "……어서 와, 선생님."
52280-218 = "[ns17] \"모두들, 안녕!\"\n[ns18] \"내가 일 때문에 바쁜 중에 방문한 걸까……?\""
52280-221 = "아니, 백화요란의 일 때문에 바쁜 건 아니었어. 단지……"
52280-222 = "선배님들과 함께 꽃을 심는 중이었답니다!"
52280-223 = "[s] \"꽃……?\""
52280-224 = "응. 와라쿠 축제가 끝나고 이어질 다음 축제는 곳곳에 가꿔진 화원을 감상하는 꽃 축제라고 들었거든."
52280-225 = "그래서 축제의 준비에 쓰고 남은 꽃씨를 잔뜩 받아서……"
52280-226 = "훈련장 앞 화단에 뿌려 함께 가꾸자고 제안 드렸답니다!"
52280-227 = "계절마다 아름답게 피어나는 꽃을 보고 있노라면 분명 매일매일 훈련장에 오는 것이 기대될 것이어요!"
52280-228 = "정작 훈련에 몰두할 때는 주변 풍경은 잘 눈에 들어오지 않지만 말이야."
52280-232 = "유카리, 그 위에 있는 포대를 이쪽으로 넘겨줄래?"
52280-233 = "무거우니까 다치지 않도록 조심해."
52280-234 = "네에~"
52280-238 = "[ns] \"이제 팔은 괜찮은 거야?\""
52280-239 = "응. 모두 원래대로 돌아왔어. 오른팔도…… 아야메도."
52280-240 = "그날, 설원에서 두고 왔던 모든 것이 제 자리로 돌아왔어."
52280-241 = "다만 아야메는 그날 이후로 계속 잠에서 깨어나지 않고 있어."
52280-242 = "몸에 큰 이상은 없어 보이지만…… 아주 깊은 잠에 든 것처럼 눈을 감은 채 움직이지 않아."
52280-243 = "[s] \"황혼에 끌려갔던 후유증이려나?\""
52280-244 = "확신할 수는 없지만, 의사의 말로는 정신적인 이유가 더 큰 것처럼 보인다고 해."
52280-245 = "몸이 깨어나기를 거부하고 있다고 하던데."
52280-246 = "쳇, 깨어나면 잔뜩 잔소리를 해 주려고 했는데…… 그날 이후로 잠만 쿨쿨 자고 있으니."
52280-247 = "억지로 깨워보려고도 했지만, 나구사 선배가 그대로 두라고 해서."
52280-248 = "계속 잠을 자며 생각하기를 선택한 것은 아야메의 의지니까."
52280-249 = "꿈 속에서 아야메가 마음속으로 무슨 생각을 하고 있는지 우리는 이해하지 못해."
52280-250 = "……하지만 그 옆에서 깨어나기를 기다리는 것만큼은 할 수 있지."
52280-255 = "선배, 이 씨앗은 어떤 꽃의 씨앗인가요?"
52280-256 = "이건… 버찌 씨앗이네."
52280-257 = "심으면 벚나무가 자랄 테니, 다른 관목과는 조금 거리를 두고 심는 게 좋겠어."
52280-258 = "어머나, 그럼 새로운 벚꽃을 볼 수 있는 걸까요? 기대되네요~"
52280-259 = "하지만 괜찮겠어? 벚나무가 꽃을 피우려면 수년이 걸릴 텐데."
52280-260 = "지금 심어도 우리가 학원에 다니는 동안은 꽃을 피우는 광경을 보지 못할걸."
52280-264 = "……괜찮아."
52280-265 = "우리가 보지 못하더라도 먼 미래의 누군가가 꽃이 피는 모습을 지켜볼 테니까."
52280-268 = "과거의 선배들이 그랬던 것처럼."
52280-277 = "언젠가 이곳에도 백 가지 꽃이 한 번에 흐드러지게 피어 만발할 날이 찾아오겠지."
52280-278 = "그때까지 너를 기다리고 있을게."
52280-283 = "언젠가 깨어날 친구를 기다리며."
