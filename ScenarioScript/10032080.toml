[translation]
10032080-1 = "에필로그;일하다 보면 그런 날도 있는 거지"
10032080-4 = "주문하신 어묵이랑 튀김 나왔습니다~."
10032080-5 = "[s1] \"아, 네. 감사합니다.\"\n[s2] 인사하며 그릇을 받는다."
10032080-8 = "어째 비싼 옷들을 입고 있으면서 다 같이 먼지투성이야? 오는 길에 공사장에서 뭐라도 쏟았나?"
10032080-9 = "운도 없구만! 대신 넉넉하게 담았으니 기분 풀라고! 하하하!!"
10032080-10 = "[s3] \"감사합니다, 주인장님.\"\n[s4] \"하하……. 비슷한 일이 있긴 했네요.\""
10032080-15 = "……그래도 어떻게 모두 같이 앉았네."
10032080-16 = "포장마차에서 붙어 있는 여섯 자리를 찾기는 쉽지 않은 일인데."
10032080-17 = "자, 자리가 부족하면 제가 서 있으면 되니까요! 아, 아니면 제가 자리가 돼도 되고……."
10032080-23 = "괜찮아, 괜찮아! 하루카 쨩은 그대로 앉아 있어!"
10032080-24 = "그나저나 결국 아무것도 건지지 못했네? 정말 이대로 괜찮은 거야, 아루 쨩?"
10032080-25 = "아루 쨩이 아니라 사장님!"
10032080-26 = "뭔가 처음에 더욱 하드보일드하게 된다느니 이런저런 포부를 들었던 것 같은데 말이지."
10032080-27 = "아란치노도 결국 못 데려왔고, 오페라 하우스는 폭삭 내려앉았고."
10032080-28 = "벼, 별수 없잖아……! 그런 대폭발이 일어났는데!!"
10032080-29 = "우리도 그 소동 속에서 겨우 빠져나온 거라고! 그대로 있었다간 다 같이 발키리에……."
10032080-33 = "속보입니다. 오페라 하우스 대극장에서 대규모 폭발이 발생하여, 건물이 무너지고 안에 있던 관람객들이 놀라는 사건이 발생하였습니다."
10032080-34 = "출동한 발키리 학생들의 말에 따르면, 오페라 하우스 내부에 있던 관객과 관계자 대부분이 범죄 조직의 관련자이고……."
10032080-40 = "……현재 범죄조직 간 항쟁으로 수사의 방향을 잡고 전원 구속 수사를 위해 연행한 상태라고 합니다."
10032080-41 = "……발키리에 연행됐겠지. 거기서 잡혀간 갱단 연합 간부들 전원과 함께."
10032080-42 = "아란치노……. 아니, 갱단 연합 자체가 이번 일로 끝났다고 봐야 할 거야."
10032080-43 = "당연히 보수를 줄 사람도 다 같이 잡혀간 거니, 의뢰비 잔금은 물 건너갔다고 봐야지."
10032080-44 = "죄송합니다. 제가 바보같이 폭탄을 거기에다가 버려 놓아서……."
10032080-45 = "아냐, 하루카. 그건 오히려 잘한 걸 수도 있어."
10032080-46 = "그 녀석들, 집요하게 쫓아왔으니 그날 하루 빠져나갔다고 계속해서 귀찮게 굴었을 거고……."
10032080-47 = "……나호 가흔 한한이다."
10032080-51 = "자히……."
10032080-56 = "……나도 같은 판단이다."
10032080-57 = "결과적으로 이 일로부터 깔끔하게 빠져나온 지금이 가장 이상적인 상황이라고 볼 수 있지."
10032080-58 = "[s5] \"잘 먹네. 보기 좋아.\"\n[s6] \"얼마든지 더 시켜. 내가 사는 거니까.\""
10032080-61 = "……!? 그, 그런……."
10032080-62 = "……아니지. 여기서는 거절보다 감사의 인사를 보내는 게 맞겠군."
10032080-63 = "고맙다, 선생. 언젠가는 꼭 이 은혜를 갚도록 노력하겠어."
10032080-69 = "아주 모르는 사람이 보면 같은 팀인 줄 알겠어?"
10032080-70 = "뭐, 마지막엔 그랬으니까. 애초에 충돌했던 것도 그저 서로 받은 일들이 달랐던 것뿐이고."
10032080-71 = "사소한거 하나하나 신경 쓰기 시작하면 애초에 이런 일 못 해."
10032080-72 = "……그렇게 말하고 싶었던 거지, 사장?"
10032080-73 = "으응!? 나……?!"
10032080-74 = "무, 물론이지! 우리를 뭐라고 생각하는 거야? 일에 개인적인 감정을 넣지는 않는다고."
10032080-75 = "신경 쓰지 않아도 좋아. 어떤 일이건 어떤 관계건, 의뢰를 처리하고 돈만 받으면 그만인 하드보일드."
10032080-76 = "그게 우리 흥신소 68의 모토니까 말이야."
10032080-77 = "정작 의뢰도 망했고 돈도 못 받았지만 말이야~."
10032080-78 = "사, 사소한 건 신경 쓸 거 없다고 했잖아! 일하다 보면 이런 날도 있는 거지!"
10032080-79 = "그래. 이런 날도 있는 거야, 일하다 보면. 한두 번 하고 말 일도 아니잖아, 안 그래?"
10032080-81 = "……!"
10032080-82 = "과연……. 일하다 보면 이런 날도 있는 것……."
10032080-83 = "좋은 이야기군. 나도 계약서에 속아 일만 하고 보수는 못 받은 적이 많았는데……."
10032080-84 = "그런 날도 있는 것이라……. 기억해 두겠다."
10032080-85 = "그건 넘어가면 안 되는 거잖아. 대체 무슨 일을 당하고 다니는 거야……."
10032080-86 = "……아."
10032080-87 = "그러고 보니 선생님."
10032080-88 = "그……. BD는……."
10032080-89 = "오페라 공연은커녕 오페라 하우스까지 싹 날아갔는데, 당연히 무리인 거 아냐?"
10032080-93 = "……아."
10032080-94 = "……아."
10032080-95 = "……헉!!"
10032080-96 = "……아."
10032080-100 = "[ns] \"……하하.\""
10032080-104 = "[ns] \"뭐…….\""
10032080-110 = "[ns] \"……이런 날도 있는 거지, 일하다 보면.\""
10032080-111 = "0068 오페라로부터 사랑을 담아서!"
