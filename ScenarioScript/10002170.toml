[translation]
10002170-1 = "후일담;소녀들이 찾아오기 전에 벌어진 일"
10002170-2 = "자, 여기 요리 나왔다!"
10002170-4 = "와~아!"
10002170-5 = "하하하! 우리 가게가 자랑하는 베스트 메뉴 치즈 명란젓 야키소바다."
10002170-6 = "어디 한번 맛보고 감상 들려 달라고. 아가씨."
10002170-7 = "응! 그럼 어디~"
10002170-10 = "우물우물……."
10002170-11 = "응응! 맛있어!"
10002170-12 = "오오, 아가씨. 시원스럽게도 먹는 구만!"
10002170-13 = "그건 그렇고 놀랐다고. 처음 이 근처에 널부러저 있는 아가씨를 발견했을 땐, 열사병으로 큰일이라도 난 줄 알았더니."
10002170-14 = "순전히 공복 때문이었다니 말이야. 대체 얼마나 배가 고팠던 거야?"
10002170-15 = "여름 바다에 가면 엄청 맛있는 음식들이 잔뜩 있다고 해서……"
10002170-16 = "힘을 내서 아자앗~ 하고 와보자고 생각해서 왔는데~"
10002170-17 = "너무 더워서 도착하자마자 쓰러져버렸어……."
10002170-18 = "그래도 덕분에 살았어! 고마워! 아저씨!"
10002170-19 = "아니, 나야말로 고맙지."
10002170-20 = "아직 장사 개시 전에 내 실력이 녹슬지 않았나. 확인해볼 수 있는 기회였으니까."
10002170-21 = "아가씨의 반응을 보니, 올해 여름 장사도 걱정 없겠는걸! 파핫핫!"
10002170-22 = "음, 근데 아저씨의 음식. 분명 맛있긴 하지만……."
10002170-23 = "하지만?"
10002170-24 = "우음~ 조금 심심하달까. 이것만으로는 너무 무난하달까."
10002170-25 = "색다름이 부족해!"
10002170-26 = "나, 이번 여름엔 여름만의 미식 여행을 떠나온 거니까. 새로운 도전을 해보고 싶다고 생각했거든!"
10002170-27 = "흠, 새로운 도전이란 말이지."
10002170-28 = "응, 마침 급양부에서 받아온 특제 소스가 있으니까. 이걸 뿌려 먹으면 더 맛있을지도?!"
10002170-29 = "오호……. 게헨나 학원, 그것도 음식을 만드는 곳에서 만든 소스라니. 기대가 되는걸!"
10002170-30 = "어디, 우리 가게의 요리에 응용할 수 없는지. 한 번 맛이나 볼까?"
10002170-31 = "아저씨도 맛보게? 응, 그럼 자. 여기 있어!"
10002170-34 = "오……. 소스의 색깔부터가 새까만 광택이 도는 게……."
10002170-35 = "킁킁. 이게 무슨 냄새지? 잘 모르겠지만. 혹시 검은깨 종류를 쓴 건가?"
10002170-36 = "그럼 어디, 한 번 맛을……."
10002170-38 = "검은깨? 아니, 주리는 이거 망고로 만든 거라고 했는데?"
10002170-39 = "응? 망ㄱ……"
10002170-41 = "……!"
10002170-46 = "응? 아저씨……?"
10002170-48 = "아앗?! 아저씨, 괜찮아?!"
10002170-49 = "무슨 일이야? 갑자기 쓰러지면 안 돼~!"
10002170-50 = "핫……? 혹시 여름의 무더위 때문에? 날 위해 뜨거운 뙤약볕 아래에서 음식을 만들어주느라 그런 거야?"
10002170-51 = "저기요~ 주문 좀 할게요~"
10002170-52 = "앗, 하필 이럴 때 손님까지 와버리다니!"
10002170-53 = "으음, 이걸 어떡하지……."
10002170-56 = "……응! 결심했어! 아저씨는 내게 맛있는 음식을 만들어줬으니까. 선생님도 뭔가 받은 게 있으면, 그만큼 돌려주는 게 좋다고 했었고……!"
10002170-57 = "좋았어! 이렇게 된 이상 아저씨의 희생을 헛되게 하지 않겠어!"
10002170-58 = "아저씨가 일어날 때까지, 내가 대신 가게를 봐줄게!"
10002170-59 = "저기요? 누구 계시나요~?"
10002170-61 = "응! 잠깐만 기다려~! 주문 받을게!"
