[translation]
2004602-1 = "도망치는 하늘은 지칠 줄 모르고"
2004602-3 = "어머나, 선생님? 아주 빨리 오셨네요."
2004602-4 = "외진 장소라 조금 더 늦을 줄 알았는데 말이죠. 분명 급하게 오신 거겠죠."
2004602-5 = "이야~ 송구스럽네요~"
2004602-6 = "[ns] \"다친 곳은 없어? 추적자는?\""
2004602-7 = "냐하하~ 염려해 주신 덕에 불초 소녀는 무사하답니다~"
2004602-8 = "추적은 일단 따돌렸지만, 여전히 저를 쫓는 사람이 도처에 깔려 있다 할까~"
2004602-9 = "네? 상대의 정체에 대해 짐작 가는 부분이 있는지요?"
2004602-10 = "으음…… 그렇네요."
2004602-11 = "냐하~ 전혀 모르겠네요~"
2004602-12 = "짐작이 없다기보다는 가능성이 너무 많아서 도리어 모르겠다~ 같은 느낌이려나요?"
2004602-13 = "음양부장이라는 자리는 벗보다는 적을 늘리는 자리인지라. 썩어도 준치라, 저도 두손으로 다 셀 수 없을 만큼 정적을 두고 있답니다~"
2004602-14 = "하지만 그 뒤에 누가 있든지, 샬레의 선생님과 함께하고 있다면 강경하게 나오지는 못할 테죠."
2004602-15 = "그래서 말인데요~ 혹시 안전해질 때까지 에스코트 부탁드려도 괜찮을까요~?"
2004602-16 = "[s] \"물론이지!\""
2004602-17 = "냐하핫! 호쾌한 대답! 역시 선생님께 부탁드리길 잘했네요~"
2004602-18 = "그러면, 함께 도망치러 가실까요~? 안 그래도 제가 눈여겨본 장소가 있기에~"
2004602-20 = "(그후 니야와 함께 백귀야행 자치구에서 도망을…….)"
2004602-22 = "중앙 광장 야외무대"
2004602-23 = "아이야~! 너무나 강하구나~!"
2004602-24 = "냥테 마사무네 무적! 무적! 무적! 어찌 이럴 수가~!"
2004602-32 = "냐하~ 역시 보러 오길 잘했네요~"
2004602-33 = "이번 축제의 대미를 장식하는 공연. 상인회에서 꽤 힘을 줬다길래 어느 정도인가 했더니~"
2004602-34 = "과연 자랑할 만하네요~"
2004602-38 = "……어머나, 선생님? 혹시 불만족스러우셨나요?"
2004602-39 = "저의 식견으로는 제법 괜찮은 공연이었는데, 참으로 복잡미묘한 표정을 짓고 계시네요."
2004602-40 = "물~론 사실과 약간 다른 부분도 있지만…… 그런 각색까지 포함하여 가부키의 정취라는 걸로~"
2004602-41 = "아항~ 그게 아니면 혹시 가부키 공연이 처음이셔서 그럴까요~?"
2004602-42 = "초견에는 난해하지만, 맛을 들린다면 이게 또 참 물건이라~"
2004602-43 = "[ns1] \"아니, 그게 아니라…….\"\n[ns2] \"우리 도망치는 중 아니었던가?\""
2004602-46 = "과연. 선생님께서는 그걸 마음에 두고 계셨군요."
2004602-47 = "하지만 이런 말도 있지 않나요, 나무를 숨기려면 숲에 숨겨라~ 라고."
2004602-48 = "하물며 여기는 인산인해를 이루는 백귀야행…… 축제 한복판처럼 숨어들기 좋은 장소는 없답니다~?"
2004602-49 = "이쪽이야! 분명 이쪽으로 가는 걸 봤어!"
2004602-53 = "또 놓치기 전에 쫓아!"
2004602-54 = "앗차차~ 그렇다 해도 너무 오래 한 장소에 머물렀는지도 모르겠네요~"
2004602-55 = "자자~ 선생님, 그러면 다음 장소로~"
2004602-60 = "시대극 전시 거리"
2004602-61 = "자자~ 다음 도전자는 누구신가!"
2004602-62 = "휴우~ 아는 공연인데도 직접 참여하니까 실감이 다르네요~"
2004602-63 = "역시 백귀야행. 멀리서 찾아온 보람이 있어요~"
2004602-65 = "여기서는 참여형 어트랙션을 하고 있네요. 모처럼이니 선생님께서도 멋진 모습을 보여주시는 게~?"
2004602-66 = "[s3] \"아니, 우리는 도망치고 있으니까…….\"\n[s4] \"눈에 띄는 건 조금…….\""
2004602-69 = "어디 보자~ 도전에 성공하면 경품이~ 초희귀 무시퀸 카드……?"
2004602-70 = "아~ 그, 뭔지 모르겠지만, 왠지 잘 팔리는 카드놀이……."
2004602-71 = "……가 아니라, 남녀노소 누구에게나 유행하는 인기 놀이 상품이네요~"
2004602-72 = "으음, 그렇지만, 이런 걸로는 선생님의 마음을 돌릴 수가……."
2004602-73 = "[ns5] \"아니, 저건?! 전 세계에 4장뿐인 전설의 레어 카드?!\"\n[ns6] \"좋아, 해볼까!!!\""
2004602-76 = "냐핫?!"
2004602-77 = "우와…… 순식간에 몰입하셨네요."
2004602-78 = "예상한 형태랑은 조금 다르지만~"
2004602-79 = "어떻게든 즐거우면 좋은 거죠, 냐하하핫~!"
2004602-80 = "저기다! 저기!"
2004602-84 = "자자, 선생님, 이쪽으로."
2004602-86 = "(추적자들을 피해 다니며 니야와 함께 축제 곳곳을 돌아다니면서 즐겼다.)"
2004602-87 = "(어느덧 늦은 저녁 시간이 되어 버렸다.)"
2004602-90 = "햐아~ 좋은 바람~"
2004602-91 = "아시나요? 여기는 계절마다 다른 꽃내음이 난답니다. 봄에는 벚, 여름에는 국화, 그리고 다른 계절은……."
2004602-92 = "직접 말해서는 운치 없네요~ 모쪼록 직접 방문해서 체험해 보심이~"
2004602-93 = "……저도 참, 무심코 가이드 흉내를 냈네요."
2004602-94 = "백귀야행 학생들은 여기만 오면 왠지 말이 많아진단 말이죠."
2004602-95 = "그런 점에서는 혹시 저도 평범한 백귀야행 학생처럼 보이려나~ 하고는~ 냐하하하~"
2004602-96 = "모두 백귀야행을 좋아하기 때문이라……?"
2004602-97 = "후후, 그렇게 볼 수도 있네요. 냐핫! 그것참 명답입니다!"
2004602-98 = "[ns] \"근데 아까 전부터 생각한 건데.\""
2004602-100 = "[ns] \"여기 너무 눈에 잘 띄지 않아?\""
2004602-103 = "찾았다!"
2004602-104 = "이번에야말로 놓치지 않습니다!"
2004602-106 = "[ns9] \"역시, 들켰잖아!\"\n[ns10] \"내가 막을 테니 도망쳐!\""
2004602-109 = "냐하하~ 역시나 선생님~ 이때다 싶을 때는 멋진 말씀을 해주시네요~"
2004602-110 = "하지만 그러지 않으셔도 된답니다~"
2004602-111 = "흠흠, 자~ 음양부 후배 여러분~?"
2004602-112 = "보다시피 저는 백귀야행에 내빈 하신 선생님을 솔선해서 안내하고 있었답니다~"
2004602-113 = "대외 업무 수행 중이라고나 할까~?"
2004602-115 = "분명…… 선생님이 같이 계시긴 하지만……!"
2004602-116 = "틀림없이 평소처럼 놀러 다니신 거라 생각했는데……."
2004602-118 = "훌쩍훌쩍~ 부원들이 이렇게 신뢰해 주지 않다니~"
2004602-119 = "음양부장인 제가 업무를 미루고 땡땡이를 칠 리가 없는데~"
2004602-120 = "그렇죠, 선생님?"
2004602-121 = "[ns] \"니야.\""
2004602-123 = "[ns] \"후배들 고생시키지 말고 빨리 가…….\""
2004602-124 = "냐하하하~ 역시 그래야겠죠?"
2004602-125 = "그러면 오늘 하루 어울려 주셔서 무척 감사합니다. 저는 상당히 즐거웠답니다~ 다음에 또 뵈어요~"
2004602-127 = "(니야는 넉살스레 인사하고 떠나갔다.)"
2004602-128 = "(양옆에서 음양부원들이 절대 놓치지 않겠다는 듯이 양팔을 붙잡은 모습이 인상적이었다…….)"
