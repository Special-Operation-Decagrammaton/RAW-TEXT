[translation]
1013703-1 = "그 형사의 시간관념"
1013703-2 = "(찾는 물건이 있어, 블랙마켓에 왔다.)"
1013703-3 = "(허탕 치고 돌아가는데, 골목에서 소란스러운 소리가 들려왔다.)"
1013703-11 = "이리 콤!! 이리 오라고!!!!!"
1013703-12 = "너 같으면 오겠냐!!!"
1013703-13 = "그럼 됐다, 넌 꼭 끝까지 도망쳐라. 잡히면 죽을 거니까!"
1013703-14 = "히이익!!!"
1013703-21 = "이 언니가 오늘 무지 바쁘거든?! 시간을 잘 지켜야 하는 날이라서 시간이 없어!!"
1013703-22 = "그러니까!! 좀!!! 얌전히 잡혀가 주라!! 응?!"
1013703-23 = "자! 수갑 여기! 구멍 두 개! 손은 두 개! 사용법은 알지?"
1013703-24 = "미쳤다고 순순히 잡혀주겠냐?!"
1013703-25 = "머리가 어떻게 된 거 아냐? 에잇!!!"
1013703-31 = "헉……! 끄흑……!"
1013703-32 = "하핫! 테플론 코팅탄이다! 아프지?"
1013703-33 = "가방으로 막는다고 막히겠냐!"
1013703-34 = "발키리 지급 방탄복으로는 막지도 못-"
1013703-41 = "????????????"
1013703-42 = "한 탄창을 다 퍼부었는데, 멀쩡하다고?!"
1013703-43 = "학생이 책가방을 쏘면 어떡하냐!! 이 경우도 없는 자식아!!"
1013703-44 = "내 소중한 <발키리 학생의 도덕과 예절> 교과서, 어쩔 거야!!"
1013703-45 = "완전 걸레짝이 됐잖여, 임마!!!"
1013703-57 = "으악! 커헉!! 지가 가방 들어서 일부러 막았으면서!!! 끄악!!!"
1013703-62 = "와, 선량한 모범생을 그렇게 모함해? 너는! 아주! 못! 됐구나!"
1013703-63 = "소중한 책이라면서 테이프질 해놓고, 펼칠 수도 없으면서! 으악!!"
1013703-68 = "도덕책은 너무 소중해서 읽는 것도 아까워서 그랬다, 어쩔래!!"
1013703-69 = "그러면 책으로 때리질 말든가!! 악!! 으악!!!"
1013703-71 = "너 경찰 맞아?! 뭔 경찰이 이래!! 씨이!!!"
1013703-72 = "꼬와? 홈페이지 들어가면 입학 서류 있으니까, 자필로 써서 팩스로 보내라. 추천인에 내 이름 꼭 쓰고."
1013703-73 = "야, 너 지금 여기서 맞을래, 얌전히 수갑 차고 같이 가서 거기서 맞을래?"
1013703-74 = "뭔 소리야?!"
1013703-75 = "고를 게 두 가지나 있잖아 임마! 빨리 골라!!"
1013703-77 = "[ns]\"저, 저기……. 일단 말로…….\""
1013703-78 = "샤, 샬레의 선생님?!"
1013703-79 = "살려주세요!!!!"
1013703-80 = "얌마!! 선생님한테 이르기냐?! 반칙이잖아!!"
1013703-81 = "안녕하심까, 선생님!! 저희 그냥 놀고 있던 검다! 그치?!"
1013703-83 = "[ns]\"친구끼리 사이좋게 지내야…… 지……?\""
1013703-84 = "이거 혼나는 전개임까?!"
1013703-85 = "헉, 맞다! 선생님, 지금 몇 시임까?"
1013703-86 = "얘가 머리로 제 핸드폰을 부숴버려서 말임다! 물어내 임마!"
1013703-87 = "핸드폰으로 나 때려놓고 그렇게 말한다고?!"
1013703-89 = "[ns]\"5시 59분인데…….\""
1013703-90 = "……!"
1013703-91 = "?"
1013703-92 = "17시 59분……. 아…… 퇴근 시간이잖아……."
1013703-93 = "야, 수갑 줄 테니까 내일 아침 9시까지 잘 차고서 발키리로 와라. 도망치면 죽어 진짜."
1013703-94 = "언니랑 약속한 거다? 내일 보자!"
1013703-95 = "선생님, 제가 시간을 잘 지켜야 해서 말임다, 먼저 실례하겠슴다!"
1013703-96 = "그럼, 이만!"
1013703-98 = "[ns]\"으, 응……?\""
1013703-103 = "……뭐……?"
1013703-104 = "지금…… 체포 중에 정시 퇴근한…… 거야……?"
1013703-105 = "발키리 괜찮아……?"
1013703-106 = "[s]\"나도 잘 모르겠는데…….\""
1013703-108 = "다음날, 오전 8시 59분"
1013703-109 = "(어제의 이상한 일을 잊을 때쯤, 어디선가 소란스러운 소리가 들려왔다.)"
1013703-114 = "히이익!! 여긴 도시 반대편이잖아!! 대체 어떻게 알고 쫓아온 거야?!"
1013703-115 = "빵 조각 따라서 왔다, 짜샤!! 내가 거기서 딱 기다리랬지!!!"
1013703-116 = "혹시 몰라서 밤새 미행했더니 역시나 도망치고 있었네!"
1013703-117 = "퇴근했다면서! 퇴근했다면서!!!"
1013703-118 = "짜샤, 따라다니는 건 취미라서 일 아니니까 괜찮아!"
1013703-119 = "9시까지 8초 전! 출근 전에는 절대 잡히지 마라!!"
1013703-120 = "으아앙!!! 살려주세요!!! 다시는 도망 안 칠게요!!!!"
1013703-127 = "(이후, 코노카는 9시가 되자 용의자를 단숨에 체포했다.)"
1013703-128 = "(나와 눈이 마주치자, 시간을 확인하고 의기양양하게 웃어 보였다.)"
