[translation]
1013703-1 = "那位刑警的時間觀念"
1013703-2 = "（因為有想找的東西，於是來到了黑市）"
1013703-3 = "（就在無功而返的時候，從巷子裡傳來吵鬧的聲音）"
1013703-11 = "不要跑！！給我過來！！！！！"
1013703-12 = "誰會過去啊！！！"
1013703-13 = "那算了，你就繼續逃吧。被我抓到你就死定了！"
1013703-14 = "咿──！！！"
1013703-21 = "話說我今天超級忙的，必須嚴格遵守時間耶！！"
1013703-22 = "所以拜託你！！！乖乖被抓！！好嗎！？"
1013703-23 = "來！手銬在這！兩個孔！兩隻手！知道怎麼用吧！？"
1013703-24 = "哪個瘋子會抓自己啊！？"
1013703-25 = "你腦子壞掉了吧！？哼！！"
1013703-31 = "呃……！唔……！"
1013703-32 = "哈哈！這可是特氟龍塗層彈！很痛吧？"
1013703-33 = "書包怎麼可能擋得住嘛！"
1013703-34 = "就連女武神的防彈背心都擋不──"
1013703-41 = "蛤？？？？"
1013703-42 = "都打光整整一個彈匣了耶，這都能沒事！？"
1013703-43 = "啊啊──你怎麼可以對我的書包開槍，你這沒常識的傢伙！！"
1013703-44 = "我珍貴的《女武神學生的道德與禮儀》怎麼辦啊！？"
1013703-45 = "完全變成廢紙了，你這混蛋！！！"
1013703-57 = "不是，是你自己拿書包擋的吧！！！"
1013703-62 = "哇，你竟然這樣誣陷善良的模範生！？你真是太過分了！！"
1013703-63 = "不是說是珍貴的書嗎？怎麼捆滿了膠帶，連翻都翻不開啊！！"
1013703-68 = "就是太珍貴了才捨不得翻開啊！！"
1013703-69 = "那就別用書打人啊！！啊！！唔啊！！！"
1013703-71 = "你真的是警察！？ 哪個警察會這樣啊！！"
1013703-72 = "有意見嗎？官網有入學資料，寫好再傳真過來。#n推薦人記得寫我的名字。"
1013703-73 = "所以你想現在在這裡挨打，還是乖乖戴上手銬跟我走再挨打？"
1013703-74 = "都一樣吧！？"
1013703-75 = "我不是給你兩個選項了，快給我選！！"
1013703-77 = "[ns]「那，那個……總之先好好說吧……」"
1013703-78 = "夏萊的老師……！？"
1013703-79 = "救命啊！！！！"
1013703-80 = "喂！！跟老師告狀是犯規吧！？"
1013703-81 = "哈，哈囉～老師！！我們只是在玩啦！對吧！？"
1013703-83 = "[ns]「朋友之間要好好……相處……？」"
1013703-84 = "這是我要被罵的節奏嗎！？"
1013703-85 = "啊，對了！老師，現在幾點？"
1013703-86 = "這傢伙用頭把我的手機砸壞了！記得賠錢啊！"
1013703-87 = "是你用手機打我的耶！？"
1013703-89 = "[ns]「現在……5點59分。」"
1013703-90 = "……！"
1013703-91 = "咦？"
1013703-92 = "5點59分……啊，已經是下班時間了啊……"
1013703-93 = "喂，給你手銬，明天早上9點之前把手銬戴好來女武神。#n敢跑的話我會讓你死得很難看。"
1013703-94 = "我們約好了哦？明天見啦！"
1013703-95 = "老師，因為我今天得嚴格守時，所以先失陪了！"
1013703-96 = "那先這樣！"
1013703-98 = "[ns]「咦……？」"
1013703-103 = "……咦？"
1013703-104 = "剛才……他是在逮捕中準時下班了嗎……？"
1013703-105 = "女武神真的沒問題嗎……？"
1013703-106 = "[s]「我也不太清楚……」"
1013703-108 = "隔天．上午8點59分"
1013703-109 = "（正當快要忘記昨天的怪事時，從某處傳來了吵鬧的聲音）"
1013703-114 = "咿──！！這裡是城市的另一頭耶！！到底怎麼知道我在這裡的！？"
1013703-115 = "當然是跟著線索追來的啊！混蛋！我不是說敢跑的話我會讓你死得很難看嗎！？"
1013703-116 = "以防萬一跟蹤了一整晚，果然是想逃跑啊！"
1013703-117 = "不是下班了嗎！？你不是說要下班了嗎！！！"
1013703-118 = "混蛋！跟蹤是興趣，跟工作沒關係！"
1013703-119 = "距離9點還有8秒！你就不要被我抓到！"
1013703-120 = "啊──！！！救命啊──！！！我再也不會逃跑了──！！！！"
1013703-127 = "（9點一到，木乃香就一口氣逮捕了犯人）"
1013703-128 = "（和我四目相對時，確認了時間並得意地笑了）"
