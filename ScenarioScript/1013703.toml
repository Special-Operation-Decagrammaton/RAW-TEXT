[translation]
1013703-1 = "那位刑警的時間觀念"
1013703-2 = "（為了尋找某樣東西而來到了黑市）"
1013703-3 = "（就在即將空手而歸時，從巷子裡傳來吵鬧的聲音）"
1013703-6 = ""
1013703-7 = ""
1013703-8 = ""
1013703-9 = ""
1013703-10 = ""
1013703-11 = "不要跑！！給我過來！！！！！"
1013703-12 = "誰會過去啊！！！"
1013703-13 = "很好，那你最好給我跑遠一點。#n因為被我抓到你就死定了！"
1013703-14 = "噫噫──！！！"
1013703-15 = ""
1013703-17 = ""
1013703-21 = "話說姐姐我今天忙到不行，還必須嚴格遵守時間耶！！"
1013703-22 = "所以算我求你了！！！乖乖被抓行不行！？"
1013703-23 = "來！手銬在這裡！兩個孔！兩隻手！#n知道怎麼用吧！？"
1013703-24 = "哪個瘋子會自己抓自己啊！？"
1013703-25 = "你這傢伙是腦袋有問題吧？看招！！！"
1013703-26 = ""
1013703-30 = ""
1013703-31 = "呃……！唔……！"
1013703-32 = "哈哈！這可是特氟龍塗層彈哦！是不是很痛？"
1013703-33 = "以為拿書包擋就有用嗎？"
1013703-34 = "就連女武神的防彈背心都擋不──"
1013703-35 = ""
1013703-37 = ""
1013703-41 = "？？？？？？"
1013703-42 = "都打光整整一個彈匣了，居然還沒事！？"
1013703-43 = "哪有人會朝學生的書包開槍的啊！！你這個沒常識的傢伙！！"
1013703-44 = "我那本珍貴的《女武神學生的道德與禮儀》，你要怎麼賠我！？"
1013703-45 = "完全變成廢紙了，你這混蛋！！！"
1013703-46 = ""
1013703-48 = ""
1013703-57 = "等一下，明明是你自己拿書包擋子彈的吧！！！"
1013703-58 = ""
1013703-62 = "哇，竟然這樣誣陷善良的模範生！？#n你這傢伙簡直壞透了耶！！"
1013703-63 = "你嘴巴上說是珍貴的書，結果根本捆滿了膠帶，連翻都翻不開嘛！！"
1013703-64 = ""
1013703-68 = "就是太珍貴了才捨不得翻開啊！！"
1013703-69 = "那就別用書打人啊！！啊！！唔啊！！！"
1013703-71 = "你真的是警察嗎！？哪有警察會這樣的啊！！"
1013703-72 = "有意見嗎？官網上有入學申請書，寫好之後再傳真過來。推薦人記得寫我的名字。"
1013703-73 = "話說，你是想馬上在這裡挨打，還是乖乖戴上手銬跟我走再挨打？"
1013703-74 = "根本沒兩樣吧！？"
1013703-75 = "我已經好心給你兩個選項了耶，臭小子！快給我選！！"
1013703-76 = ""
1013703-77 = "[ns]「那，那個……總之先好好說吧……」"
1013703-78 = "夏萊的老師……！？"
1013703-79 = "救命啊！！！！"
1013703-80 = "喂！！跟老師告狀是犯規的吧！？"
1013703-81 = "你好呀，老師！！#n我們剛才只是在玩而已啦！對吧！？"
1013703-82 = ""
1013703-83 = "[ns]「朋友之間……要好好相處哦？」"
1013703-84 = "這是我要挨罵的節奏嗎！？"
1013703-85 = "啊，對了！老師，請問現在幾點了？"
1013703-86 = "這傢伙用頭把我的手機砸壞了！之後記得賠我啊！"
1013703-87 = "是你用手機打我的耶！？"
1013703-88 = ""
1013703-89 = "[ns]「現在……5點59分。」"
1013703-90 = "……！"
1013703-91 = "咦？"
1013703-92 = "5點59分……啊，已經是下班時間了啊……"
1013703-93 = "喂，這副手銬給你。明天早上9點之前乖乖戴好來女武神報到。#n要是敢逃跑的話，你就真的死定了。"
1013703-94 = "我們約好了哦？明天見啦！"
1013703-95 = "老師，因為我今天必須嚴格守時才行，所以恐怕得告辭了！"
1013703-96 = "那就先這樣啦！"
1013703-97 = ""
1013703-98 = "[ns]「咦……？」"
1013703-99 = ""
1013703-101 = ""
1013703-102 = ""
1013703-103 = "……什麼？"
1013703-104 = "他剛才……是在逮捕過程中準時下班了嗎……？"
1013703-105 = "女武神真的沒問題嗎……？"
1013703-106 = "[s]「我也不太清楚……」"
1013703-108 = "隔天．上午8點59分"
1013703-109 = "（就在快要忘記昨天的怪事時，從某處傳來了吵鬧的聲音）"
1013703-110 = ""
1013703-112 = ""
1013703-113 = ""
1013703-114 = "噫──！！這裡是城市的另一頭耶！！你到底是怎麼知道我在這裡的啊！？"
1013703-115 = "當然是循著線索追來的啊！混蛋！#n我不是說要是你敢逃跑的話就死定了嗎！？"
1013703-116 = "為了以防萬一跟蹤了一整晚，結果你果然打算逃跑啊！"
1013703-117 = "你不是下班了嗎！說好的下班呢！！！"
1013703-118 = "混蛋！跟蹤是我的興趣，跟工作有什麼關係！"
1013703-119 = "距離9點還有8秒！在我上班之前可別被我逮到啊！"
1013703-120 = "哇啊！！！救命啊──！！！我再也不會逃跑了啦──！！！！"
1013703-121 = ""
1013703-123 = ""
1013703-124 = ""
1013703-125 = ""
1013703-127 = "（於是等9點一到，木乃香就立刻逮捕了犯人）"
1013703-128 = "（隨後在與我四目相對時再次確認時間，並露出了得意的笑容）"
