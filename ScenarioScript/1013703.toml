[translation]
1013703-1 = "การรักษาเวลาของตำรวจ"
1013703-2 = "(คุณครูมาหาสินค้าบางอย่างที่ตลาดมืด)"
1013703-3 = "(ในขณะที่กำลังเดินกลับแบบมือเปล่า ก็ได้ยินเสียงวุ่นวายดังออกมาจากในซอยแห่งหนึ่ง)"
1013703-11 = "มานี่เลย!! บอกให้มานี่ไง!!!!!"
1013703-12 = "ใครจะบ้าเข้าไปหากันล่ะ!!!"
1013703-13 = "ก็ได้ งั้นแน่จริงก็ลองหนีดูสิ ถ้าฉันจับได้ละก็ ไม่ได้ผุดไม่ได้เกิดแน่!"
1013703-14 = "เฮือกก!!!"
1013703-21 = "วันนี้พี่สาวคนนี้ไม่ได้มีเวลาเหลือเฟือหรอกนะ! แล้วฉันก็ต้องรักษาเวลาด้วย!!"
1013703-22 = "เพราะงั้น!! ก็!!! ยอมให้ฉันจับตัวไวๆ เข้าเถอะ!! นะ?!"
1013703-23 = "เอ้า! กุญแจมืออยู่นี่แล้ว! มีสองห่วง! มือมีสองข้าง! รู้วิธีใส่ใช่มั้ย?"
1013703-24 = "คิดว่าฉันจะเพี้ยนจนยอมให้ตัวเองถูกจับหรือไง?!"
1013703-25 = "สมองเบลอไปหมดแล้วหรือเปล่า? นี่แหนะ!!!"
1013703-31 = "เฮือก...! อึกก...!"
1013703-32 = "ฮ่าฮ่า! เจอกระสุนเคลือบเทฟลอนหน่อยเป็นไง! เจ็บใช่มั้ยล่ะ?"
1013703-33 = "คิดว่าเอากระเป๋ามาบังแล้วจะกันกระสุนได้งั้นเหรอ!"
1013703-34 = "ขนาดเสื้อเกราะกันกระสุนของวัลคิรี่ยังกันไม่ได้..."
1013703-41 = "????????????"
1013703-42 = "ฉันยิงไปหมดแม็กแล้ว แต่ยังไม่เป็นอะไรเลยเหรอ?!"
1013703-43 = "เป็นนักเรียนแท้ๆ แต่มายิงกระเป๋านักเรียนงั้นเรอะ!! มีสมองคิดบ้างหรือเปล่า!!"
1013703-44 = "ให้เกียรติหนังสือ <จริยธรรมของนักเรียนวัลคิรี่> เล่มสำคัญของฉันบ้างสิ!!"
1013703-45 = "โดนยิงจนยับเยินหมดแล้วเนี่ย ยัยหมวกกันน็อก!!!"
1013703-57 = "อ๊าก! เฮือก!! ก็เธอเอากระเป๋าตัวเองมากันกระสุนเองไม่ใช่เหรอ!!! อ๊าก!!!"
1013703-62 = "โอ้โห ใส่ร้ายนักเรียนดีเด่นขนาดนี้เลยเหรอ? เธอนี่นะ! เป็นเด็ก! นิสัยไม่ดี! จริงๆ เลย!"
1013703-63 = "ปากบอกว่าเป็นหนังสือเล่มสำคัญ แต่ก็ยังไม่แกะซีลเปิดอ่านเลยไม่ใช่เหรอ! อ๊าก!!"
1013703-68 = "ก็หนังสือจริยธรรมมันมีค่ามากจนไม่อยากแกะให้เป็นรอยนี่นา หรือว่ามีปัญหาอะไร!!"
1013703-69 = "งั้นก็อย่าเอาหนังสือมาฟาดกันสิ!! โอ๊ย!! โอ๊ยย!!!"
1013703-71 = "นี่เธอเป็นตำรวจจริงๆ หรือเปล่า?! ตำรวจที่ไหนเขาทำแบบนี้กัน!! ชิ!!!"
1013703-72 = "เดี๋ยวเหอะ เข้าไปโหลดใบสมัครเข้าเรียนจากเว็บไซต์ซะ แล้วก็เขียนใบสมัครแล้วส่งแฟกซ์มา ตรงชื่อผู้แนะนำก็ใส่ชื่อฉัน"
1013703-73 = "นี่ เธออยากโดนฟาดจนน่วมตรงนี้ หรืออยากใส่กุญแจมือไปกับฉันดีๆ แล้วค่อยโดนฟาดทีหลัง?"
1013703-74 = "พูดบ้าอะไรน่ะ?!"
1013703-75 = "นี่ฉันใจดีให้ถึงสองตัวเลือกเลยนะ! รีบๆ เลือกมาได้แล้ว!!"
1013703-77 = "[ns] \"เอ่อ... ครูว่า... เจรจาด้วยคำพูดกันก่อน...\""
1013703-78 = "คะ... คุณครูจากชาเล่ต์?!"
1013703-79 = "ช่วยด้วยค่ะ!!!!"
1013703-80 = "เดี๋ยวเหอะ!! จะฟ้องคุณครูงั้นเรอะ?! แบบนี้มันขี้โกงนะ!!"
1013703-81 = "สวัสดีค่ะ คุณครู!! พวกฉันแค่เล่นสนุกกันอยู่ค่ะ! ใช่มั้ย?!"
1013703-83 = "[ns] \"เป็นเพื่อนกันก็อย่าแกล้งกัน... สิ...\""
1013703-84 = "นี่จะมาดุฉันเหรอคะ?!"
1013703-85 = "เฮือก จริงสิ! คุณครู ตอนนี้กี่โมงแล้วเหรอคะ?"
1013703-86 = "ยัยนี่เอาหัวมาโขกโทรศัพท์ฉันจนพังเลย! ชดใช้มาเลยนะ!"
1013703-87 = "เอาโทรศัพท์มาฟาดฉันแล้วยังจะพูดแบบนั้นอีกเหรอ?!"
1013703-89 = "[ns] \"ตอนนี้ห้าโมงห้าสิบเก้านาที...\""
1013703-90 = "...!"
1013703-91 = "?"
1013703-92 = "ห้าโมงห้าสิบเก้านาที... อ่า... จะถึงเวลาเลิกงานแล้วนี่นา..."
1013703-93 = "นี่ ฉันจะให้กุญแจมือไว้ พรุ่งนี้ก็ใส่กุญแจมือมามอบตัวที่วัลคิรี่ก่อนเก้าโมงเช้าล่ะ ถ้าหนีละก็ คราวนี้ไม่รอดจริงๆ แน่"
1013703-94 = "ถือว่าสัญญากับพี่สาวคนนี้แล้วนะ? งั้นเจอกันพรุ่งนี้ล่ะ!"
1013703-95 = "คุณครู พอดีวันนี้ฉันต้องรักษาเวลาน่ะ ขอตัวกลับก่อนนะคะ!"
1013703-96 = "บ๊ายบาย!"
1013703-98 = "[ns] \"หะ... หา...?\""
1013703-103 = "อะไรน่ะ...?"
1013703-104 = "เลิกงานตรงเวลาเป๊ะๆ... ระหว่างจับกุม... งั้นเหรอ?"
1013703-105 = "วัลคิรี่ยังโอเคอยู่มั้ยเนี่ย?"
1013703-106 = "[s] \"ครูก็ไม่รู้เหมือนกัน...\""
1013703-108 = "วันต่อมา เวลาแปดโมงห้าสิบเก้านาที"
1013703-109 = "(คุณครูเกือบจะลืมเรื่องแปลกๆ ที่เกิดขึ้นเมื่อวานไปแล้ว แต่ก็ได้ยินเสียงเอะอะโวยวายดังมาจากที่ไหน#nสักแห่ง)"
1013703-114 = "เฮือกก!! ตรงนี้มันคนละฝั่งของเมืองเลยนะ!! ทำไมถึงสืบเสาะจนตามมาได้ล่ะ?!"
1013703-115 = "ฉันก็ตามเศษขนมปังมาน่ะสิ ยัยบื้อ!! ฉันบอกให้รออยู่ตรงนั้นไม่ใช่หรือไง!!!"
1013703-116 = "ฉันแอบระแวงอยู่ ก็เลยตามพวกเธอมาทั้งคืน แล้วก็เจอว่ากำลังหนีอยู่จริงด้วย! "
1013703-117 = "ไหนว่าเลิกงานแล้วไงล่ะ! แล้วทำไมยังมาทำงานอยู่อีก!!!"
1013703-118 = "ยัยคนนี้นี่ การติดตามคนร้ายคืองานอดิเรกของฉันต่างหากล่ะ มันไม่ใช่การทำงานสักหน่อย! "
1013703-119 = "อีกแปดวินาทีจะเก้าโมงเช้า! ไว้ฉันเข้างานแล้วจะมาจับเธอแน่!!"
1013703-120 = "แงงง!!! ช่วยด้วยค่ะ!!! ฉันจะไม่หนีอีกแล้วค่ะ!!!!"
1013703-127 = "(เมื่อถึงเวลาเก้าโมงเช้า โคโนกะก็ไปจับตัวผู้ต้องสงสัยอย่างทันควัน)"
1013703-128 = "(โคโนกะหันมาสบสายตากับคุณครู จากนั้นก็ดูนาฬิกาและยิ้มให้อย่างมีชัย)"
