[translation]
1013703-1 = "The Detective's Sense of Time"
1013703-2 = "I went to the Black Market to look for something."
1013703-3 = "I was heading home empty-handed after a disappointing search, when I heard a commotion coming from an alley."
1013703-11 = "YOU! Get back here!! Come here!!"
1013703-12 = "Why the hell would I do that?!"
1013703-13 = "If that's how you want to play it, you better hope you get away! You're dead meat if I catch you!"
1013703-14 = "EEEK!!"
1013703-21 = "Look, I'm an important person with important things to do! If I waste too much time here, I won't be able to get to my obligations!"
1013703-22 = "Which is why!! I am BEGGING you!! To just put these on!! Yeah?!"
1013703-23 = "Here! Handcuff! Two holes! Two hands! You know the drill, right?"
1013703-24 = "YOU must be insane if you think I'll cuff myself!"
1013703-25 = "Do you have scrambled eggs for brains?! HI-YAH!!"
1013703-31 = "Ugh...! *huff*"
1013703-32 = "Haha! They're teflon-coated bullets! Hurts, right?"
1013703-33 = "What kind of idiot tries to block bullets with a BAG?"
1013703-34 = "Not even Valkyrie's standard bulletproof vest can box with these babies!"
1013703-41 = "EHHH?!?!?!"
1013703-42 = "We just dumped a full magazine into her!"
1013703-43 = "The outright disrespect to shoot a student's bookbag!!"
1013703-44 = "My precious \"Valkyrie Student's Ethics and Etiquette\" book!! It's in tatters!"
1013703-45 = "WHAT'RE YOU GONNA DO ABOUT THIS?!"
1013703-57 = "Oww! Augh! You're the one who blocked with your bag!! ACKKK!"
1013703-62 = "Are you tryna frame an innocent, model student?! Huh?! YOU! ARE! EVIL!"
1013703-63 = "GAH! Stop hitting me! If that stupid book was so precious to you, why was it covered in duct tape?!"
1013703-68 = "BECAUSE IT WAS SO PRECIOUS!! Do something to atone for this!!"
1013703-69 = "Then! Stop!! HITTING ME WITH IT!! Ouch!! OWWW!!"
1013703-71 = "Are you sure you're from Valkyrie?! You're acting like a crazy person, not an officer!! EEEKKK!!"
1013703-72 = "Does that make you mad? Then you can find the admission documents on the website, fill them out by hand, and send them in via fax. And make sure to mention that I recommended you."
1013703-73 = "Back to business. Do you want to get beaten up here and go back with me, or do you want to willingly put on the handcuffs, go with me, and get beat up over at the station?"
1013703-74 = "What...are you saying...?!"
1013703-75 = "You have two options! Hurry and pick!"
1013703-77 = "[ns] \"U-Um... Can we talk this out...?\""
1013703-78 = "S-Schale's Sensei?!"
1013703-79 = "Save me!"
1013703-80 = "Hey!! Don't try to tell on me to Sensei! That's dirty!!"
1013703-81 = "Hey there, Sensei! We were just kids playing around. Right? RIGHT?!"
1013703-83 = "[ns] \"You should all just get...along...?\""
1013703-84 = "*gasp* Are you scolding me?!"
1013703-85 = "Oh, right! Sensei! What time is it right now?"
1013703-86 = "Hey, you! Pay for my phone! You broke it with your head!"
1013703-87 = "...Only because you were beating me with it!!"
1013703-89 = "[ns] \"It's 5:59...\""
1013703-90 = "...!"
1013703-91 = "?"
1013703-92 = "17:59... Ah... It's time to clock out."
1013703-93 = "Here, I'll give you these handcuffs, so put them on and come to Valkyrie at 9 AM sharp tomorrow. If you run away, you're deader than dead meat."
1013703-94 = "It's a promise, okay? I'll see you tomorrow!"
1013703-95 = "If you'd excuse me, Sensei, I HAVE to be on time!"
1013703-96 = "Bye then!"
1013703-98 = "[ns] \"H-Huh...?\""
1013703-103 = "...What?"
1013703-104 = "Did she...leave in the middle of an arrest...just because it was time for her to clock out...?"
1013703-105 = "Is Valkyrie okay...?"
1013703-106 = "[s] \"I have no clue either...\""
1013703-108 = "Next day, 8:59 AM"
1013703-109 = "I'd nearly put the strange incident from the day before out of my mind, when I heard a huge commotion."
1013703-114 = "Eeeek?! This is literally on the opposite side of the city!! How did you know where I was?!"
1013703-115 = "I followed the bread crumbs, you prick! I gave you very specific instructions!!"
1013703-116 = "I tailed you all night, just in case. And you weren't going to turn yourself in at all!"
1013703-117 = "But you said you clocked out! YOU SAID YOU CLOCKED OUT!!"
1013703-118 = "Stalking people is just my hobby, so it's different! "
1013703-119 = "You got 8 seconds before 9 o'clock! Don't get caught before I clock in!"
1013703-120 = "WAAAAAAHHH!! Save me!! I'll never do anything bad again!!!"
1013703-127 = "Konoka quickly arrested the suspect the moment the clock hit 9."
1013703-128 = "When our eyes met, she checked the time and smiled triumphantly."
