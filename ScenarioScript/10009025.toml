[translation]
10009025-2 = "휴우, 이번에도 무사히 붙잡았네!"
10009025-3 = "감사합니다. 선생님! 큰 도움이 되었습니다."
10009025-4 = "[s] \"아니아니, 이번엔 아예 교정국에서 탈출했다니?!\""
10009025-5 = "아, 그게 이번에 저희가 도착한 교정국 시설이 꽤 노후화가 진행되어 있었다고 합니다."
10009025-6 = "그래서 그 빈틈을 뚫고 탈출했다는 거 있지? 정말 무섭다니까."
10009025-7 = "역시…… 재액의 여우, 얕볼 수가 없는 거네요!"
10009025-8 = "[s] \"아니, 그 이전의 문제라고나 할까…….\""
10009025-9 = "아하하~ 예상치 못한 액시던트니까. 어쩔 수 없지."
10009025-10 = "그래도 다른 최신식 교정국 시설로 이감하기로 했으니까! 이젠 안심해도 돼!"
10009025-11 = "네! 이번에야말로 책임지고! 문제아를 확실하게 이송하도록 하겠습니다!"
10009025-12 = "[s] \"으음……. 두, 두 사람 다 고생해.\""
10009025-18 = "그럼 선생님, 순찰 업무를 이어서 하도록 하지요."
10009025-19 = "[s] \"이런 상황에서도 세나는 냉정하구나…….\""
10009025-21 = "(그렇게 약간의 불안을 남긴 채, 다시금 순찰을 시작했다.)"
