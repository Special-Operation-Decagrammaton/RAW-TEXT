[translation]
90100010-1 = "ตอนที่ 1;บิดไปบิดมา"
90100010-6 = ""
90100010-7 = "นี่ ได้ยินข่าวลือนั่นหรือยัง?"
90100010-8 = "ข่าวลืออะไรเหรอ?"
90100010-9 = "ก็ที่ทางเดินที่อยู่ทางใต้ของสถานีชิโระอุนางิไง"
90100010-10 = "อ๋อ หมายถึงทางเดินริมแม่น้ำที่ร้อนอบอ้าว ที่ราดยางมะตอยและไม่มีต้นไม้ริมทางเลยสักต้นใช่มั้ย?"
90100010-12 = "ใช่ อาจเป็นเพราะแบบนั้น ช่วงนี้เลยแทบไม่มีคนสัญจรผ่านทางนั้นเลย..."
90100010-13 = "ได้ยินมาว่าหมู่นี้น่ะ ตอนเที่ยงๆ จะมีคนมายืนกายบริหารอยู่คนเดียวตรงกลางทางเดินนั้นทุกวันเลยละ"
90100010-14 = "แล้วมันเป็นปัญหายังไงเหรอ? อาจเป็นคนที่อยากมาออกกำลังกายในเวลานั้นเฉยๆ ก็ได้นี่?"
90100010-15 = "ฟังให้จบก่อนสิ เรื่องแปลกมันไม่ใช่ตรงนั้นหรอก"
90100010-16 = ""
90100010-17 = "จากคำบอกเล่าของคนที่เห็นเหตุการณ์ คนคนนั้นไม่ได้ใส่ชุดออกกำลังกายทั่วไป แต่ใส่ชุดสีขาวรัดรูปทั้งตัวคล้ายชุดดำน้ำ ถ้ามองจากไกลๆ จะดูเหมือน 'หุ่นไล่กาสีขาว' น่ะสิ"
90100010-18 = "ถ้าแบบนั้นก็แปลกเลยแฮะ... หรือว่าใส่ชุดแบบนั้นเพราะหวังให้ช่วยลดน้ำหนัก?"
90100010-19 = "อีกอย่างนะ คนคนนั้นระวังตัวแจขนาดที่ว่า พอมีใครพยายามเข้าไปทัก เจ้าตัวก็จะหายลับไปราวกับภาพลวงตา จนแทบไม่มีใครได้เห็นหน้าจริงๆ ของเขาเลยละ"
90100010-20 = "น่าสงสัยจังเลยนะ..."
90100010-21 = ""
90100010-22 = "แต่เมื่อกี้บอกว่า 'แทบไม่มีใคร' เห็นหน้าจริงๆ งั้นเหรอ? ถ้าเป็นอย่างที่ว่า ก็แสดงว่ามีคนที่เคยเห็นหน้า#nของหุ่นไล่กาสีขาวคนนั้นแล้วน่ะสิ?"
90100010-23 = "อื้อ เหมือนว่านักเรียนชมรมกรีฑาคนหนึ่งที่ไปซ้อมวิ่งอยู่แถวนั้นได้เห็นใบหน้าของหุ่นไล่กาสีขาวที่ว่า"
90100010-24 = "ไม่รู้ว่าเพราะอีกฝ่ายหนีไปไวจนหงุดหงิด หรือเพราะไฟแห่งการแข่งขันลุกโชนขึ้นมา นักเรียนคนนั้นก็เลยวิ่งตามไปสุดชีวิตเลย แต่พอไล่ทันจนได้เห็นหน้ากันจริงๆ..."
90100010-25 = ""
90100010-28 = "นักเรียนคนนั้นกลับพูดอะไรไม่ออกเสียอย่างนั้น..."
90100010-29 = "ทะ... ทำไมเหรอ เกิดอะไรขึ้นหรือเปล่า?!"
90100010-30 = "หลังจากเห็นหน้าของหุ่นไล่กาสีขาวในระยะใกล้ นักเรียนชมรมกรีฑาคนนั้นก็เหงื่อแตกพลั่กราวกับ#nได้เห็นภาพสุดสยอง แล้วก็หมดสติล้มพับไปเลย"
90100010-31 = "หลังจากนั้นก็เอาแต่ตัวสั่นไม่หยุด ราวกับอยู่ในฝันร้ายที่ไม่มีวันตื่นเลยละ"
90100010-32 = "แล้วก็ทำตัว... บิดไปบิดมา"
90100010-33 = "บิดไปบิดมา...?"
90100010-34 = "อื้อ [ruby=คุเนะคุเนะ]บิดไปบิดมา[/ruby]"
90100010-35 = ""
90100010-39 = "ตอนต่อไป;ช่วงเวลาของยอดคนกับจิ้งจอก"
