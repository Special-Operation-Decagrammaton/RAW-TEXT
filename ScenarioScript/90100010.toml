[translation]
90100010-1 = "1화;꾸물꾸물꾸물"
90100010-7 = "저기, 그 소문 들었어?"
90100010-8 = "무슨 소문?"
90100010-9 = "시로우나기 역 남쪽에 산책로가 하나 있잖아."
90100010-10 = "아, 가로수 하나 없이 아스팔트만 깔려 있어 무지막지하게 더운 천변가의 그 산책로 말이지?"
90100010-12 = "맞아. 그래서인지 요즘은 오가는 사람도 거의 없는데……"
90100010-13 = "요새 정오 즈음에 그 산책로 한 가운데에서 혼자 체조를 하는 사람이 있다나 봐."
90100010-14 = "그게 뭐 어때서? 그냥 그 시간대에 운동을 하고 싶어하는 사람일 수도 있잖아."
90100010-15 = "계속 들어봐. 이상한 점은 그게 아니니까."
90100010-17 = "목격담에 의하면 그 사람은 평범한 트레이닝 복이 아니라, 잠수복 같은 하얀 전신 의상을 입고 있어서 멀리서 보면 마치 '하얀 허수아비'처럼 보인대."
90100010-18 = "그건 확실히 이상하긴 하지만…… 체중 감량의 효과라도 보려는 걸까?"
90100010-19 = "그리고 어찌나 경계심이 심한지. 누군가 말을 걸기 위해 다가가려고 하면, 어느새 신기루처럼 멀리 도망쳐서 그 사람의 얼굴을 직접 확인한 사람은 거의 없나 봐."
90100010-20 = "……그건 조금 수상하네."
90100010-22 = "그나저나 '거의 없다'니. 네 말 대로라면, 그 하얀 허수아비의 얼굴을 직접 확인한 사람이 있었다는 뜻이야?"
90100010-23 = "응. 근처에서 러닝 연습을 하던 어느 육상부 학생이 그 하얀 허수아비의 얼굴을 본 모양이야."
90100010-24 = "재빠르게 도망치는 모습에 약이 올랐는지, 승부심이 달아올랐는지 그 학생은 열심히 뒤를 쫓아갔고. 마침내 얼굴을 직접 마주하고 나서는……"
90100010-28 = "……아무 말도 할 수 없게 되었어."
90100010-29 = "무, 무슨 일이 있었던 거야?!"
90100010-30 = "그 허수아비의 얼굴을 가까이서 마주한 육상부 학생은 무언가 무서운 광경을 목격한 사람처럼 식은 땀을 연신 흘리더니, 곧 정신을 잃고 쓰러졌대."
90100010-31 = "그리고 긴 악몽을 꾸는 것처럼, 그 후로 계속해서 쉴 새 없이 몸을 흔들어 댄다는 거야."
90100010-32 = "—꾸물꾸물하고."
90100010-33 = "꾸물꾸물……?"
90100010-34 = "응, [ruby=쿠네쿠네]꾸물꾸물[/ruby]."
90100010-39 = "다음화;초인과 여우의 시간"
