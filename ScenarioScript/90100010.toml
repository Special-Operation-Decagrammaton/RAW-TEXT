[translation]
90100010-1 = "Episode 1;Squirm-Squirm-Squirm"
90100010-6 = ""
90100010-7 = "Hey, have you heard the rumor?"
90100010-8 = "What rumor?"
90100010-9 = "You know how there's a bridge south of Shiro Unagi Station?"
90100010-10 = "You mean the one with no shade that goes over the river? It's grueling."
90100010-12 = "Yeah. It's torture. That's why no one walks it."
90100010-13 = "But get this. They say that some weirdo goes there every day at noon, right to the center of the bridge. And they exercise!"
90100010-14 = "So what? Maybe they're working out during their lunch break."
90100010-15 = "Listen. I'm not finished. It gets stranger."
90100010-16 = ""
90100010-17 = "They say this person's out there every day in a white jumpsuit. It's not a track suit, not a gym uniform—it's practically scuba wear. It happens so often that locals call them the \"white scarecrow.\""
90100010-18 = "Hmm... Maybe they're trying to lose water weight? Like for a boxing match?"
90100010-19 = "All I know is that they're super jumpy. Whenever someone tries to approach them, they practically vanish into thin air. Almost no one's actually seen their face."
90100010-20 = "...That's pretty weird."
90100010-21 = ""
90100010-22 = "Wait. What do you mean by \"almost no one\"? You're saying someone's actually made eye contact with this \"scarecrow\"?"
90100010-23 = "Yeah. A girl from the track team saw their face."
90100010-24 = "I think seeing the white scarecrow flee made her get competitive or something, so she chased them down, and even caught up! But, when she saw the scarecrow's face..."
90100010-25 = ""
90100010-28 = "...She couldn't speak."
90100010-29 = "Wh-What do you mean?"
90100010-30 = "As soon as the runner gazed into the scarecrow's eyes, she broke into a cold, terrified sweat. Then she fainted!"
90100010-31 = "She's been shaking non-stop since then. It's a living nightmare."
90100010-32 = "And get this. She's been...squirming."
90100010-33 = "Squirming...?"
90100010-34 = "You heard me. Squirming."
90100010-35 = ""
90100010-39 = "Next Episode;Between a Superhuman and a Fox"
