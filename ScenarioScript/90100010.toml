[translation]
90100010-1 = "第1話;扭啊扭啊扭"
90100010-6 = ""
90100010-7 = "我說，你聽過那個傳聞了嗎？"
90100010-8 = "什麼傳聞？"
90100010-9 = "在白鰻車站的南邊不是有一條散步道嗎？"
90100010-10 = "啊啊～是那條連一棵行道樹都沒有，只鋪著柏油又熱得要命的河邊散步道對吧？"
90100010-12 = "沒錯。可能就是因為那樣，最近幾乎沒有人會經過那裡……"
90100010-13 = "不過我聽說最近一到正午左右，就會有人獨自在那條散步道的中央做體操。"
90100010-14 = "那有什麼奇怪的嗎？#n搞不好只是個想在那個時段運動的人而已。"
90100010-15 = "你先聽我說完嘛。#n奇怪的地方不在那裡。"
90100010-16 = ""
90100010-17 = "根據目擊者的說法，那個人並不是穿著運動服，而是類似潛水衣的白色全包緊身衣。#n遠遠看起來就像「白色的稻草人」一樣。"
90100010-18 = "確實是有點奇怪……不過，也可能是為了達到減重效果之類的？"
90100010-19 = "不僅如此，他的警戒心還非常重哦。#n一旦有人想上前搭話，他就會在不知不覺間[ruby=蜃景]像陽炎一[/ruby]樣逃得遠遠的，#n所以好像幾乎沒有人親眼確認過那個人的長相。"
90100010-20 = "……那就有點可疑了呢。"
90100010-21 = ""
90100010-22 = "不過你剛才說「幾乎沒有」……？#n意思是有人親眼確認過那個白色稻草人的長相囉？"
90100010-23 = "嗯。好像有一個在附近練跑的田徑部學生，看到了那個白色稻草人的臉。"
90100010-24 = "不知道是被對方迅速逃走的樣子激怒，#n還是求勝心被點燃的關係……那個學生拚命追了上去。#n結果在終於和他面對面之後……"
90100010-25 = ""
90100010-28 = "……就再也說不出任何話了。"
90100010-29 = "發，發生什麼事了嗎！？"
90100010-30 = "那個近距離直視稻草人臉孔的田徑部學生，#n就像看見了某種極其恐怖的景象一樣冷汗直流，接著就失去意識倒下了。"
90100010-31 = "而且在那之後，就像做著一場漫長的惡夢一樣不停晃動著身體。"
90100010-32 = "──扭來扭去的。"
90100010-33 = "扭來扭去……？"
90100010-34 = "嗯，[ruby=Kunekune]扭來扭去[/ruby]。"
90100010-35 = ""
90100010-39 = "下一話;超人與狐狸的時光"
