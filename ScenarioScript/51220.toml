[translation]
51220-1 = "제22화;화염에 휩싸인 거리"
51220-5 = "[ns] \"하아……… 하아. 무대까지는 앞으로…….\""
51220-12 = "선생님, 조심해……!"
51220-30 = "[ns] \"점점 더 숫자가 많아지는 느낌인데……!\""
51220-31 = "큭! 이대로면 환량백물어는 돌파할 수 없어……."
51220-32 = "(여기선 역시 나만으로는 역부족이야…… 무대가 코앞인데……! 이래서야 나는 아무것도……!)"
51220-41 = "아슬아슬하게 늦지 않을 수 있었네요. 선생님. 괜찮으신가요~?"
51220-42 = "우리 왔어~ 선생님~"
51220-43 = "[s] \"니야랑…… 치세?! 두 사람이 어떻게 여기에……!\""
51220-44 = "니야 부장이- 선생님을 도와주자고 말해서 왔어."
51220-45 = "[s] \"니야가?\""
51220-46 = "네, 현재 벌어진 일련의 사태와 관련해. 수습하기 위해서-라고 할지."
51220-47 = "마츠리운영관리부와 연락이 되지 않아, 해당 사항을 확인하고자 거리로 나왔습니다."
51220-48 = "특히나 방금 전 있었던 방송의 인터셉트도 확인한 참입니다."
51220-49 = "그녀가 바로 편지를 보낸 장본인…… 화조풍월부의 부원인 건가요?"
51220-50 = "[s] \"응.\""
51220-51 = "……역시나."
51220-52 = "이번 일에서 벌어진 저의 판단 미스 때문에, 백귀야행의 거리는 이렇게나……."
51220-53 = "처음부터 너무 경솔하게 판단했던 거군요. 이미 되돌리기엔 늦었지만 그래도──"
51220-54 = "[s] \"나도 잘못이 있어. 지금부터라도 같이 헤쳐나가자.\""
51220-55 = "……네, 이미 지나가 버린 과거를 탓해봤자 변하는 건 없는 상황."
51220-56 = "실수의 정산은 좀 더 나중에 치르기로 하고 여기서는 앞을 봐야겠죠. 나구사 양."
51220-58 = "아, 응."
51220-59 = "상황이 대충 어떻게 돌아가는지는 정보를 취합해 파악했습니다."
51220-60 = "현재 축제 광장을 빼앗은 자의 이름은 야부키 슈로. 화조풍월부의 부원. 백화요란의 유카리 양이 인질로 잡혀 있는 상황─이지요?"
51220-61 = "………응."
51220-62 = "그녀를 구하기 위해선 현장까지 가야 하지만."
51220-68 = "앞뒤, 양옆까지 전부 괴물로 가득하네~"
51220-69 = "어쩌지. 니야 부장."
51220-70 = "이 숫자…… 역시 저희만으로는 부족하려나요."
51220-71 = "최대한 음양부의 원군이 도착할 때까지 버틴다고 해도 과연 어떨지──"
51220-77 = "……………!!!"
51220-81 = "[ns] \"아니, 아직 돌파구는 있어!\""
51220-85 = "네?"
51220-86 = "선생님, 무슨 말……."
51220-91 = "비기! 폭렬수리검! 에잇!"
51220-100 = "흐흥- 인법연구부……!"
51220-101 = "여기에……!"
51220-102 = "등장! 이에요! 닌닌!"
51220-104 = "[ns] \"이즈나! 미치루! 츠쿠요……!\""
51220-105 = "너희들은…… 인법연구부?"
51220-106 = "다들 안녕~"
51220-108 = "우왓! 음양부 부장에, 치세 님까지……!"
51220-109 = "거기다 그쪽은 선생 공이 찾던 나구사잖아!"
51220-110 = "하지만 어떻게 여러분이 여기에……?"
51220-111 = "응? 우리가 여기 있는 이유? 그게 말이지-"
51220-113 = "선생님의 요청을 받았거든요! 저희 인법연구부가 도와주었으면 한다고!"
51220-114 = "네! 주군의 도움이 되기 위해서라면 이즈나는 물론 츠쿠요 공과 부장도 모두! 불 속이든 물 속이든 숲속이든! 전부 달릴 준비가 되어있습니다! 닌닌!"
51220-115 = "넷! 이즈나 쨩의 말대로예요!"
51220-117 = "아니아니아니, 아무리 그래도…… 불 속은 쪼오오끔 무섭지 않을까?!"
51220-118 = "괜찮아요! 부장님이라면 할 수 있어요!"
51220-119 = "누가 뭐라 해도 부장님이니까요……!"
51220-120 = "으으…… 그렇게까지 말한다면 어쩔 수 없지……!"
51220-121 = "물론 인법연구부 부장으로서 각오는 되어있으니까-! 해보자구!"
51220-122 = "네! 그렇게 나오셔야 부장님이죠!"
51220-123 = "으으으음! 그럼 잔뜩 힘내볼까아아!"
51220-124 = "좋았어! 우리에게 전부 맡겨줘! 선생 공!"
51220-125 = "[s] \"다들……! 고마워!\""
51220-127 = "과연……"
51220-128 = "인법연구부 여러분. 변함없이 멋진 모습에 감탄했답니다."
51220-129 = "……그럼 어디 가볼까요? 길은 저희가 열겠습니다."
51220-130 = "맡겨만 줘~ 선생님에게 약속한 대로, 연습했던 거 잔뜩 보여줄게~"
51220-132 = "그럼!"
51220-133 = "인법연구부! 돌격!"
51220-143 = "……응!"
