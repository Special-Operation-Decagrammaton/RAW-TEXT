[translation]
211170-1 = "第17話;過去の遺産"
211170-2 = "（演説が終わっても、考えはまとまらなかった）"
211170-3 = "（まずは状況の把握から始めよう）"
211170-7 = "[ns1] \"ひとまず……ヒナを探そう。\"\n[ns2] 風紀委員会室へ向かう。"
211170-14 = "あ……。"
211170-15 = "先生……。"
211170-16 = "……さっきの件だろ？"
211170-17 = "[s3] \"うん。\"\n[s4] \"……2人とも、大丈夫？\""
211170-22 = "……いや。"
211170-23 = "私たちも……混乱しています。"
211170-24 = "うちの委員長、あんなこと言う人じゃないのに。"
211170-25 = "戦争とか征服とか……何かの冗談だと思いたいんだけど……。"
211170-26 = "事情が……私たちの知らない、何かがあるはずです。"
211170-27 = "とにかく、先生が来てくれて良かったよ。"
211170-28 = "一緒に聞こう。"
211170-40 = "あ、先生。いらっしゃい。"
211170-41 = "今日はとびきり素敵な日だから。#nこの喜びを分かち合いたかったの。"
211170-42 = "ふふ。広場でのこと、見ててくれた？"
211170-43 = "[s] \"……本気なの？\""
211170-47 = "私、冗談を言うタイプじゃないと思うけど。"
211170-48 = "……。"
211170-49 = "先生、何かあった？怖い顔してる……。"
211170-50 = "[s] （どこから話せばいいんだろう……）"
211170-51 = "これって、ゲヘナ全体を巻き込んだサプライズなのか？"
211170-52 = "マコト議長と組んで、みんなをびっくりさせようとしてる……とか。"
211170-53 = "どういう意味？"
211170-54 = "だって、あり得ないだろ！？#n戦争？キヴォトスの征服？何だよそれ！！"
211170-55 = "本当に、冗談なら今すぐ言ってよ！それなら「面白かった」で済ませてあげるから！！"
211170-61 = "イオリ、まだ理解していないのですか？"
211170-62 = "はぁ！？"
211170-63 = "風紀委員会の真なる使命！#n目覚めたゲヘナの意志を！"
211170-64 = "ゲヘナの持つ「鉄血の意志」は、塀の外へと向けられるべきです。#nキヴォトス全域に、ゲヘナの名による真の秩序を確立する――それが私たちの存在理由。"
211170-65 = "アコ行政官、本気で言ってるんですか！？"
211170-66 = "あーもう！歯がゆいですね。どうしてまだ分からないんですか？"
211170-67 = "あの愚かで自分勝手なマコト議長でさえ気づいたんですよ！？"
211170-73 = "……二人は、何が問題だと思ってるの？"
211170-78 = "何が、って……全部おかしいでしょ……。"
211170-79 = "風紀委員会って、そうじゃないだろ……？#n私たちがやってきたことは何だったんだ……？"
211170-80 = "言ってたじゃん……私たちは線を引く存在だって……。"
211170-82 = "そうね。その通りよ。"
211170-87 = "私は約束した。ゲヘナが線を越えないようにするって。"
211170-88 = "だから、線を引き直すの。"
211170-89 = "すべてがゲヘナになるなら、「線を越える」なんてことは起こらない。"
211170-91 = "そ、そんな……。"
211170-92 = "委員長……！"
211170-98 = "[ns] \"ヒナ……アコ……どうして……？\""
211170-99 = "先生……。"
211170-100 = "先生も、まだ分かってなさそうな顔だね。"
211170-101 = "急だったかも。私も今日、ようやく気づいたんだ。"
211170-102 = "……いや、[ruby=・]思[/ruby][ruby=・]い[/ruby][ruby=・]出[/ruby][ruby=・]し[/ruby][ruby=・]た[/ruby]と言うべきかな。"
211170-103 = "ゲヘナを束ねて、キヴォトスを征服するという心を。"
211170-104 = "私たちの中で眠っていた、偉大な渇望を。"
211170-105 = "ふふ……私も同じです。"
211170-106 = "夢から覚めたような気分で……どうして忘れていたのか分からないくらいです。"
211170-107 = "それにあの万魔殿のタヌキでさえ、心は同じだと確認できました。"
211170-108 = "旗の下に団結したゲヘナは、誰にも止められません。"
211170-109 = "これ以上は……もう冗談では済みません。"
211170-113 = "分からない人ですね。冗談ではないと言っているじゃないですか。"
211170-114 = "それが大問題なんです！！"
211170-118 = "あー！もう！！"
211170-119 = "大事な使命を前にして、どうして分からない[ruby=・]ふ[/ruby][ruby=・]り[/ruby]をするんですか？"
211170-120 = "ゲヘナが何をすべきか。あなたたちも分かっているはずです。#nだって、当たり前のことなのですから。"
211170-122 = "ふざけるな！！"
211170-123 = "私たちが銃を持ったのは、誰かを踏みにじるためじゃない！"
211170-124 = "普通に過ごしたい生徒を、身勝手に暴れる連中から守るためだ……！！#nだから……！どれだけ面倒で、どれだけ大変だって、私たちが引き受けてきた！#nそうだろ！？"
211170-125 = "私の知る委員長は、力を持つ者が力を乱用することを最も警戒していました。#n今の委員長と行政官は、どこかおかしい――変わりすぎです。"
211170-131 = "変わった……そうね。そうかもしれない。"
211170-137 = "今ね、これまでに無いほど頭が冴えて爽快なの。#n私を押し潰していた酷い疲労感の原因が、やっと分かった気がする。"
211170-138 = "――「本当の役割」から目を背けて、小さな塀の中の秩序を守っていたから。"
211170-139 = "相手を見失った「力」。優柔不断さが、ゲヘナを。私自身を蝕んできたのよ。"
211170-141 = "委員長……そんな……。"
211170-143 = "心配しないで。キヴォトス中にゲヘナの旗が立てば、争いは全部消えてなくなる。#nそうして、真の秩序が訪れるの。"
211170-145 = "……委員長……！"
211170-146 = "[s] \"少し、頭を冷やそう。\""
211170-153 = "[ns] \"イオリとチナツを借りるね。\""
211170-154 = "分かった。"
211170-155 = "お二人のことをお願いします。まだ混乱しているみたいですから。"
211170-164 = "……。"
211170-165 = "……。"
211170-166 = "分かりません……どうして……？#n一体、何が起きてるんでしょう……？"
211170-167 = "先生……私たちはどうすれば……？"
211170-168 = "[s5] \"状況を調べてみるよ。\"\n[s6] \"2人は少し休んでて。\""
211170-171 = "うん……。"
211170-172 = "これが夢ならよかったのに……。こんな悪夢、嫌です……。"
211170-173 = "[s] \"……。\""
211170-175 = "（万魔殿の様子も見に行くことにした）"
211170-183 = "どういうつもりですか！！"
211170-186 = "[ns] \"こっちもか……。\""
211170-189 = "ふざけるにしたって限度があります！"
211170-190 = "放送で！全校生徒に届くんですよ！？バカじゃないですか！？"
211170-191 = "バカとは何だバカとは！！"
211170-192 = "アレがバカじゃないなら何なんですか！"
211170-193 = "いつもみたいな自慢話で終わらせておけばよかったんですよ！#n何が歴史に残る名演説ですか！"
211170-194 = "いや、歴史には残るでしょうね！ゲヘナ史上前代未聞の暴言として！！"
211170-199 = "い、イロハちゃん……ちょっと落ち着いて……。"
211170-200 = "イロハ先輩、マコト先輩……ケンカ……？"
211170-206 = "……チアキ、イブキを連れて外に出てろ。"
211170-211 = "はいっ！"
211170-217 = "ちょっと外で待ってよっか。#nあれは話し合い。ケンカじゃないからね。"
211170-218 = "ケンカだめ、ケンカ、きらい……。"
211170-222 = "この私の決断を、お前は暴言だと捉えるのか？"
211170-223 = "そうですよ！正気じゃないとしか思えません！#nキヴォトス全体を敵に回して、私たちに何の得があるんですか！？"
211170-224 = "バカなことを言っているのはお前だ！！"
211170-225 = "は？"
211170-226 = "ゲヘナがどれほど卑しい平和に甘えてきたか、まだ分からんのか！#n他学園の顔色を伺い、塀の中でチマチマ争っていた日々こそ、ゲヘナの汚点なのだ！"
211170-227 = "それが普通なんですよ！#n多少いがみ合ったって線は越えない。それが常識じゃないですか！"
211170-232 = "腐りきった旧秩序を打ち砕き、鉄血のゲヘナが支配する新世界を築く！#nそれが我々の進むべき真の道だとなぜ分からん！！"
211170-236 = "いや……。"
211170-237 = "……先輩、いったいどうしちゃったんですか？#nいつもですけど……今日は一段と変です。"
211170-238 = "キシシッ……イロハ、お前の狭い視野ではそう見えるのも無理はない。"
211170-239 = "この羽沼マコト様は、今日ついに「完成」したのだ。#nふいに湧き上がった強烈な意志によってな！"
211170-240 = "何ですかそれ……。"
211170-241 = "お前も見ただろう？#nあの[ruby=そらさき]空崎[/ruby]ヒナでさえ、私の大義に応え、服従を示した姿を！"
211170-242 = "だから大問題なんですよ！普段なら鼻で笑われて終わりなのに！"
211170-243 = "何をしたんですか……？#nサツキ先輩の催眠術が成功したとでも？"
211170-250 = "……！！"
211170-251 = "まさか……？"
211170-253 = "それ以外に説明つかないじゃないですか……！！"
211170-254 = "ふん。ヒナの奴も、正しい使命に目覚めただけだ。"
211170-255 = "見ているがいい。一つにまとまったゲヘナの前では、お前の疑念も消え去るだろう。"
211170-256 = "……本気なんですね。"
211170-257 = "私はいつだって本気だったさ。お前も知っているだろう？"
211170-258 = "はい、知ってますよ……痛いほど。"
211170-265 = "……。"
211170-266 = "……。"
211170-267 = "ちっ。イロハのやつ、どうしてあそこまで過敏に反応する？"
211170-268 = "今こそゲヘナが一つにまとまる瞬間だというのに。"
211170-269 = "……。"
211170-272 = "[ns] その場を後にする。"
211170-277 = "（万魔殿も似たような状況だと確認できた）"
211170-278 = "（信じたくないが、マコトもヒナも本気らしい……）"
211170-281 = "……。"
211170-286 = "[ns] \"イロハ。\""
211170-290 = "先生。"
211170-294 = "もしかして……さっきの話、聞いてました？"
211170-297 = "そうですか……。"
211170-298 = "まったく……理解できませんよ。"
211170-299 = "先生も知ってますよね？#nマコト先輩は抜けてるところもあるし、頼りない部分だってあります。#n……でも、あんな人じゃなかった。"
211170-300 = "[s] \"そうだね。\""
211170-301 = "はぁ……イブキにはどう説明したものやら……。"
211170-305 = "……あれが現実になるなんて……ないですよね？"
211170-306 = "[s] \"とにかく、他の状況も確認してみるよ。\""
211170-307 = "……お願いします。#n今の私には、他に頼れる人も思い浮かびませんので。"
211170-310 = "（変わっていない人たちの側にいる方が落ち着くと思い、イロハにはイオリとチナツと一緒にいるよう勧めた）"
211170-311 = "[ns7] \"……。\"\n[ns8] （他の部の様子も見に行こう）"
211170-325 = "先生。どうぞ、お入りください。"
211170-326 = "バタバタしていまして、お茶もお出しできず申し訳ありません。"
211170-327 = "[s9] \"ううん、気にしないで。\"\n[s10] \"忙しそうだけど、何かあったの？\""
211170-330 = "ええ、差し迫った活動に向けて準備をしておかないといけませんので。"
211170-331 = "はい？#nああ、これはキヴォトス征服に向けた医療物資です。"
211170-332 = "私たちにできることといえば、戦場での応急処置に、#n死た……いえ、患者の搬送くらいですので。"
211170-333 = "[s] \"……本気、なんだよね？\""
211170-334 = "もちろん。"
211170-335 = "政治には興味がないので詳しくありませんが、#n万魔殿と風紀委員会が手を取り合うのはとても良いことだと思います。"
211170-336 = "これでようやく、ゲヘナが一致団結したのです。#nキヴォトスへの宣戦布告も近いでしょう。"
211170-337 = "偉大なる征服戦争の狼煙が上がります。#n先生には、どうか私たちを応援していただければと。"
211170-338 = "[s] \"……また来るね。\""
211170-339 = "はい。お帰り、お気をつけて。"
211170-345 = "……あ。"
211170-350 = "いつも、感謝しております。"
211170-351 = "[s] \"……お互い様だよ。\""
211170-354 = "[ns] \"……。\""
211170-358 = "ふぅ、やっと炒め終わった……。"
211170-359 = "でも、こんなことしてていいのかな……？"
211170-360 = "……。"
211170-361 = "うーん……私にできることをやればいいよね。"
211170-362 = "[s] \"こんにちは。\""
211170-366 = "先生！"
211170-367 = "こんにちは！えへへっ。"
211170-368 = "あっ、いらっしゃいませ！"
211170-369 = "[s11] \"お邪魔するね。\"\n[s12] \"……変わった様子はない？\""
211170-374 = "いえ、特に変わったことは……。"
211170-375 = "給食の準備に追われてて……いつも通りですね。"
211170-376 = "[s] \"さっきの放送、聞いた？\""
211170-377 = "放送……マコト議長のですか？"
211170-378 = "物騒なことを言ってたやつですよね？#n正直、それでちょっと気が重くなっちゃって……。"
211170-379 = "びっくりしましたね。ヒナ風紀委員長まで一緒になって……。"
211170-380 = "先生はどう思います？あれ、やっぱり冗談ですよね？#n2人で示し合わせたドッキリとか……。"
211170-381 = "……いや、一緒になって悪ふざけするほど仲良かったでしたっけ？"
211170-382 = "[s] \"……よかった。2人はいつも通りだね。\""
211170-383 = "はい？"
211170-384 = "何のことでしょう……？"
211170-387 = "（しばらくして……）"
211170-391 = "……。"
211170-392 = "……。"
211170-393 = "あの放送の後、おかしくなってる人がいる、と……？"
211170-394 = "じゃあ放送も……本気ってことなんですか？"
211170-395 = "キヴォトスに攻め込むだなんて……正気ですか……？"
211170-396 = "[s13] \"今は状況を確認してるところなんだ。\"\n[s14] \"分かったことがあれば報告するね。\""
211170-399 = "は、はい！よろしくお願いします！"
211170-400 = "ドッキリじゃないなんて……。"
211170-401 = "……。"
211170-402 = "とにかく、私たちは今できることをやっておきます。"
211170-403 = "私たちが手を止めたら、みんながお腹を空かせちゃいますから。"
211170-404 = "[s] \"ありがとう。よろしくね。\""
211170-405 = "先生……お気をつけて。"
211170-406 = "私たちにできることがあれば、いつでも呼んでください！"
211170-409 = "（給食部の2人は、いつもと変わらなかった）"
211170-410 = "（変わった人と変わらない人……違いは何だろう？）"
211170-415 = "さっきのアレ、先生も聞いた？"
211170-416 = "何が何だか、ぜんぜん分かんない！"
211170-417 = "万魔殿が変なこと言うのはいつものことだけど、まさか風紀委員会まで乗るなんてね。"
211170-418 = "ドッキリでした～！みんな引っかかった～！"
211170-419 = "……みたいなネタばらし、まだかな？#nそろそろあってもいい頃だと思うんだけど……。"
211170-420 = "[s] \"それが……。\""
211170-424 = "……え？あれ、全部本気なの？"
211170-425 = "それは笑えないね……。"
211170-426 = "一瞬で人が変わったみたい。"
211170-430 = "あ。"
211170-431 = "どうしたの？何か気になる？"
211170-432 = "さっきマコト議長が演説する前にさ。"
211170-433 = "なんか早口の呪文みたいなの流れなかった？"
211170-434 = "あ！あったね。放送事故かと思ってた！"
211170-435 = "もしかして、あれが原因とか……？#nどこかで聞いたような気もするんだよね。"
211170-436 = "ほんと、分かんないことだらけ。先生はどう？"
211170-437 = "[s15] \"私はもう少し状況を探ってみるよ。\"\n[s16] \"2人は変わってないみたいで本当に助かった。\""
211170-440 = "うーん……なんで一部の人だけ変わったんだろ。"
211170-441 = "先生、力になれることがあったら何でも言ってね。かなりヤバそうだし。"
211170-442 = "……気をつけて。"
211170-448 = "変わってしまった人と、そうでない人の違い……。"
211170-450 = "とりあえず私たちは大丈夫だから……私たちに共通すること？#n……そんなのある？"
211170-451 = "委員長じゃない……とか？"
211170-452 = "髪の色……長さ……？身長？……性格？"
211170-453 = "全部バラバラ！共通点なんてないと思うんだけど。"
211170-455 = "逆に、マコト先輩とヒナ先輩もです。#n変わってしまった2人に、何の共通点が……。"
211170-460 = "……。"
211170-462 = "3年生……？"
211170-466 = "セナ部長も3年生ですよね……。"
211170-467 = "アコちゃんもだ。"
211170-469 = "サツキ先輩もそうです。"
211170-470 = "[s] \"3年生だけがおかしくなってる……？\""
211170-472 = "結果としてはそうだけど……なんで？"
211170-473 = "3年生だけがおかしくなる理由なんて……。"
211170-478 = "失礼するわよ。"
211170-489 = "サツキ先輩……！"
211170-490 = "[s] \"サツキ……？\""
211170-491 = "……。"
211170-492 = "私に、心当たりがあるわ。"
211170-499 = "サツキ議員、どういう意味ですか……？"
211170-500 = "待て。サツキ議員も「変わった側」じゃないのか？"
211170-501 = "教えてくれ！どうしてキヴォトスを支配しようとしているんだ！？"
211170-506 = "なんでそんなことしなきゃいけないの……？#nそんなの……全部嫌。"
211170-509 = "……え？"
211170-510 = "ん？"
211170-511 = "はい？"
211170-516 = "[ns] \"サツキは……変わってないの？\""
211170-517 = "マコトちゃんとかヒナちゃんみたいに、ってこと？"
211170-518 = "私は影響を受けてないみたいね。その理由も、だいたいは見当がついてるわ。"
211170-519 = "それは……。"
211170-520 = "この事態の原因は――"
211170-524 = "NKウルトラ計画よ。"
211170-531 = "[ns17] \"今この状況が全て……。\"\n[ns18] \"NKウルトラ計画って……。\"\n[ns19] \"サツキがいつも言ってた、あれ？\""
211170-535 = "そうよ。"
211170-536 = "サツキ先輩が作った催眠術ですよね？効果もよく分からなかったのでは？"
211170-537 = "臨床実験に成功したのはマコトちゃんしかいないものね。"
211170-542 = "ちょ、ちょっと待って！"
211170-543 = "じゃあサツキ議員が洗脳したってこと！？"
211170-544 = "まさか。それならこんなことにはならないわよ。"
211170-545 = "これは、[ruby=・]私[/ruby][ruby=・]の[/ruby]NKウルトラ計画じゃない。"
211170-546 = "その前の計画。"
211170-547 = "前……？"
211170-548 = "私とマコトちゃんが消そうとした、[ruby=・]本[/ruby][ruby=・]来[/ruby][ruby=・]の[/ruby]計画――"
211170-553 = "雷帝が研究していた真のNKウルトラ計画よ。"
211170-555 = "炎と影編;To be Continued in Chapter 2"
