211170-517 = "เปลี่ยนไปแบบมาโคโตะจังหรือฮินะจังน่ะเหรอ?"
211170-518 = "อื้ม ฉันน่าจะไม่ได้รับผลกระทบจาก 'สิ่งนั้น' แล้วก็เดาเหตุผลได้ด้วย"
