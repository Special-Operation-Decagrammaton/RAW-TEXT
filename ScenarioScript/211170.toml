[translation]
211170-1 = "第17話;過去的遺產"
211170-2 = "（演說雖然結束了，腦袋卻仍一片茫然）"
211170-3 = "（還是先掌握發生了什麼事比較好）"
211170-4 = ""
211170-7 = "[ns1] 「總之……先去找陽奈吧。」\n[ns2] 前往風紀委員會室"
211170-13 = ""
211170-14 = "啊……老師。"
211170-15 = "老師……"
211170-16 = "……你是來問剛才那件事的吧？"
211170-17 = "[s3] 「沒錯。」\n[s4] 「……你們兩個還好嗎？」"
211170-18 = ""
211170-19 = ""
211170-21 = ""
211170-22 = "……不好。"
211170-23 = "我也……真的很混亂。"
211170-24 = "總覺得……我們委員長不是會說那種話的人啊。"
211170-25 = "跟真琴議長握手也就算了，什麼征服奇普托斯和戰爭之類的……#n我還以為是什麼愚人節玩笑呢。"
211170-26 = "該不會是認真的吧？對吧？#n應該是有什麼我們不知道的隱情吧？"
211170-27 = "你來得正好，老師。"
211170-28 = "我們也正想問。一起進去吧。"
211170-29 = ""
211170-36 = ""
211170-39 = ""
211170-40 = "啊，老師。歡迎。"
211170-41 = "今天正好是很棒的日子，我也想跟你分享這份喜悅。"
211170-42 = "呵呵。剛才在廣場上發生的事，你都看到了嗎？"
211170-43 = "[s] 「陽奈，你剛才說的話……是認真的嗎？」"
211170-44 = ""
211170-46 = ""
211170-47 = "啊……嗯。當然是認真的。#n我平常應該不是愛說謊的人吧。"
211170-48 = "……"
211170-49 = "老師，你的表情好像也比平常僵硬……發生什麼事了嗎？"
211170-50 = "[s] （該從哪裡說起呢……）"
211170-51 = "委員長，這該不會是針對整個格黑娜的大型整人玩笑吧？"
211170-52 = "跟真琴議長串通好，想讓我們所有人嚇一跳……"
211170-53 = "你在說什麼，伊織？"
211170-54 = "不是啦～！！照常理來說根本說不通吧！？#n征服奇普托斯？跟外界開戰？這些到底是在說什麼？？"
211170-55 = "真的，如果是玩笑就現在說出來吧！#n我就當作還算有趣！！"
211170-56 = ""
211170-58 = ""
211170-60 = ""
211170-61 = "伊織，你該不會到現在都還不明白吧？"
211170-62 = "明白什麼！？"
211170-63 = "明白我們風紀委員會真正的使命！#n還有覺醒的格黑娜意志！"
211170-64 = "我們所擁有的鐵血意志，應當指向圍牆之外！#n以格黑娜之名對全奇普托斯執行真正的秩序，就是我們存在的理由與使命！"
211170-65 = "亞子首席行政官，您是認真的嗎！？"
211170-66 = "真是的，從剛才開始就讓人很著急。#n伊織、千夏，為什麼你們還不明白呢？"
211170-67 = "就連那個愚蠢又自私的真琴議長都領悟到的真相，為什麼你們卻……！"
211170-68 = ""
211170-70 = ""
211170-72 = ""
211170-73 = "你們兩個覺得哪裡有問題？"
211170-74 = ""
211170-77 = ""
211170-78 = "那還用說，很奇怪啊……要對奇普托斯發動戰爭是什麼意思啊……"
211170-79 = "那我們至今所做的事又算什麼……？#n我們風紀委員會不是那樣的吧……？"
211170-80 = "你說過……說過我們是劃出界線的存在啊……"
211170-82 = "嗯，你說得對。"
211170-83 = ""
211170-85 = ""
211170-87 = "我答應過，不會讓格黑娜越過界線。"
211170-88 = "所以，從今以後我們劃下的界線就是格黑娜。"
211170-89 = "只要我們踏足的所有土地都成為格黑娜，就再也不會發生越界這種事了。"
211170-91 = "怎，怎麼會……"
211170-92 = "委員長……！"
211170-93 = ""
211170-95 = ""
211170-97 = ""
211170-98 = "[ns] 「陽奈……亞子……為什麼會變成這樣？」"
211170-99 = "老師……"
211170-100 = "看你的表情，老師好像也還不太明白呢。"
211170-101 = "可能是因為太突然了吧。我也是今天才領悟到的。"
211170-102 = "不，或許該說是喚醒了……？"
211170-103 = "要凝聚格黑娜的力量，征服奇普托斯的那份心意。"
211170-104 = "那份沉睡在我們心中的神聖而偉大的渴望。"
211170-105 = "呵呵……是的。我也一樣。"
211170-106 = "就像突然從沉睡中醒來一樣。#n真不知道為什麼到現在都沒想起這麼重要的使命。"
211170-107 = "而且至今總是妨礙我們的萬魔殿老狐狸議長，也已經確認跟我們有相同的想法了。"
211170-108 = "團結在同一面旗幟下的格黑娜，誰都無法阻止。呵呵。"
211170-109 = "……您再這樣下去，我就無法再當成玩笑了。"
211170-110 = ""
211170-112 = ""
211170-113 = "千夏，你覺得我現在是在開玩笑嗎？"
211170-114 = "如果是認真的，那就是更大的問題了！！"
211170-115 = ""
211170-117 = ""
211170-118 = "啊～！真是的！！"
211170-119 = "你們從剛才開始是怎麼了！？#n在這重要的使命面前，為什麼總是表現得好像無法理解一樣？"
211170-120 = "兩位也知道吧？#n格黑娜究竟該做什麼……這不是理所當然的嗎？"
211170-122 = "征服奇普托斯？那就是我們的使命？#n別開玩笑了！！"
211170-123 = "我們拿起槍並不是為了踐踏別人吧！"
211170-124 = "是為了不讓想平凡度日的學生因為那些任意妄為的傢伙受害……！！#n所以，所以才一肩扛下那些麻煩又辛苦的工作不是嗎！！"
211170-125 = "我所認識的委員長，最警惕的就是有力量的人濫用力量。#n現在的委員長和首席行政官有些不對勁。變得太多了。"
211170-126 = ""
211170-128 = ""
211170-130 = ""
211170-131 = "變了……是啊。你說得或許沒錯。"
211170-132 = ""
211170-135 = ""
211170-137 = "因為我現在比任何時候都更加清醒舒暢。#n我好像終於知道每天壓垮我的那股可怕疲勞感是從哪裡來的了。"
211170-138 = "那是因為我們背對應當前往的真正戰場，只守護著這小小圍牆內的秩序。"
211170-139 = "找不到正當使用力量之處的優柔寡斷，讓我自己和格黑娜都病了。"
211170-141 = "委員長……拜託……"
211170-143 = "別擔心。等奇普托斯的所有地區都插上格黑娜的旗幟，所有紛爭都會消失。#n因為到那時，真正的秩序才會開始。"
211170-145 = "委員長……！！"
211170-146 = "[s] 「暫時先冷靜一下吧。」"
211170-147 = ""
211170-149 = ""
211170-150 = ""
211170-152 = ""
211170-153 = "[ns] 「我帶他們兩個出去一下。」"
211170-154 = "麻煩你了，老師。"
211170-155 = "請好好照顧他們兩人，老師。他們好像還很混亂。"
211170-156 = ""
211170-163 = ""
211170-164 = "……"
211170-165 = "……"
211170-166 = "我不明白……為什麼、怎麼會……到底發生什麼事了……？"
211170-167 = "老師……我們……該怎麼辦……？"
211170-168 = "[s5] 「我先去調查一下狀況。」\n[s6] 「你們兩個先休息一下。」"
211170-171 = "嗯……"
211170-172 = "……要是這是一場很快就會醒來的夢就好了。#n這種惡夢……真是糟透了。"
211170-173 = "[s] 「……」"
211170-175 = "（決定去看看萬魔殿的狀況如何）"
211170-176 = ""
211170-183 = "你到底在想什麼啊！！"
211170-186 = "[ns] 「看來這裡也是啊……」"
211170-189 = "就算是企劃表演也該有個限度，那種荒唐的話說得過去嗎！？"
211170-190 = "而且還是對整個學園廣播！！讓全校學生都聽得到！！"
211170-191 = "吵死了，伊呂波！什麼叫荒唐的話！"
211170-192 = "不然那算是什麼正經話嗎？#n什麼？征服奇普托斯？格黑娜的正當領域？"
211170-193 = "應該像平常那樣以自我吹噓收場就好了！#n什麼名留青史的名演說！"
211170-194 = "不，確實會名留青史呢！#n作為格黑娜史上空前絕後的暴言！！"
211170-195 = ""
211170-197 = ""
211170-199 = "伊，伊呂波醬……稍微冷靜一點……"
211170-200 = "伊呂波前輩、真琴前輩……你們在吵架嗎……？"
211170-202 = ""
211170-205 = ""
211170-206 = "……千秋，帶伊吹出去。"
211170-207 = ""
211170-210 = ""
211170-211 = "是！"
211170-212 = ""
211170-217 = "伊吹，我們先出去讓他們兩個談談吧～他們不是在吵架哦～！"
211170-218 = "不可以吵架。我不喜歡吵架……"
211170-221 = ""
211170-222 = "本大人做出的神聖決斷，在你伊呂波耳裡聽起來不過是暴言嗎？"
211170-223 = "沒錯！別說神聖了，聽起來根本就是瘋言瘋語！#n與整個奇普托斯為敵，我們到底能得到什麼？預算？權力？根本就是自爆吧！"
211170-224 = "說蠢話的人是你，伊呂波！！"
211170-225 = "什麼？"
211170-226 = "你還不明白我們格黑娜至今安於多麼低俗的和平嗎？#n看其他學園的臉色，在這狹小的圍牆裡半斤八兩地較勁的日子，才是格黑娜的恥辱！"
211170-227 = "因為那才是正常的啊！#n就算互相吵吵鬧鬧也不越過界線，這才是常識吧？"
211170-228 = ""
211170-230 = ""
211170-232 = "摧毀腐敗的既有秩序，建立由鐵血格黑娜支配的新世界！#n為什麼不明白這才是我們應當前進的真正道路！！"
211170-233 = ""
211170-235 = ""
211170-236 = "不是……"
211170-237 = "……前輩，你到底是怎麼了？#n今天怎麼特別奇怪？"
211170-238 = "嘰嘻嘻……伊呂波，以你那淺薄的視野看來，或許會覺得奇怪吧。"
211170-239 = "我羽沼真琴大人今天終於「完成」了。#n藉由突然湧現的強烈意志！"
211170-240 = "那是什麼……"
211170-241 = "你應該也看到了吧？#n就連那個眼中釘風紀委員長空崎陽奈，都回應並服從了我的大義！"
211170-242 = "那，那才是最大的問題啊！#n照理說他根本就不會理會前輩的胡言亂語才對！"
211170-243 = "你到底做了什麼？#n難道是皐月前輩的催眠成功了嗎？"
