211170-166 = "ฉันไม่เข้าใจเลยค่ะ... ทำไม เพราะอะไร... เกิดอะไรขึ้นกันคะ...?"
211170-167 = "คุณครู... พวกเรา... ต้องทำยังไงดี...?"
211170-168 = "[s5] \"ก่อนอื่น ครูจะไปสืบสถานการณ์ดู\"\n[s6] \"ทั้งสองคนพักผ่อนสักหน่อยนะ\""
211170-171 = "อื้ม..."
211170-172 = "ถ้านี่เป็นแค่ความฝันที่อีกไม่นานก็จะตื่นขึ้นมาก็คงดีสิคะ... ฝันร้ายแบบนี้... ฉันไม่ชอบเลย"
211170-173 = "[s] \"...\""
211170-175 = "(คุณครูตัดสินใจไปดูว่าสถานการณ์ที่แพนเดโมเนียม โซไซตี้เป็นยังไงบ้าง)"
211170-176 = ""
211170-183 = "ตกลงคิดอะไรอยู่กันแน่คะ!!"
211170-186 = "[ns] \"ที่นี่ก็ด้วยสินะ...\""
211170-189 = "ถึงจะวางแผนจัดโชว์ก็ต้องมีขอบเขตบ้างสิคะ คำพูดเหลวไหลแบบนั้นมันฟังขึ้นที่ไหนกัน?!"
211170-190 = "แถมยังกระจายเสียงไปทั่วทั้งโรงเรียนอีก!! ให้นักเรียนทุกคนได้ยินกันหมดด้วย!!"
211170-191 = "หนวกหูน่า อิโรฮะ! ที่ว่าเหลวไหลน่ะหมายถึงอะไรกัน!"
211170-192 = "แล้วคำพูดแบบนั้นมันฟังขึ้นตรงไหนคะ? ว่ายังไงนะ? พิชิตคิโวทอส? เขตอำนาจอันชอบธรรมของเกเฮนน่า?"
211170-193 = "มันควรจะจบแค่การโอ้อวดตัวเองตามปกติสิคะ! คำปราศรัยเลื่องชื่อที่จะถูกจารึกในประวัติศาสตร์อะไรกัน!"
211170-194 = "ไม่สิ คงได้จารึกในประวัติศาสตร์จริงๆ นั่นละค่ะ! ในฐานะวาจาเหลวไหล#nชนิดที่ไม่เคยมีมาก่อน และจะไม่มีอีกแล้วในเกเฮนน่า!!"
211170-195 = ""
211170-197 = ""
211170-199 = "อะ... อิโรฮะจัง... ใจเย็นๆ ลงหน่อยนะ..."
211170-200 = "รุ่นพี่อิโรฮะ รุ่นพี่มาโคโตะ... กำลังทะเลาะกันอยู่เหรอ...?"
211170-202 = ""
211170-205 = ""
211170-206 = "จิอากิ พาอิบูกิออกไปข้างนอกก่อน..."
211170-207 = ""
211170-210 = ""
211170-211 = "ค่ะ...!"
211170-212 = ""
211170-217 = "อิบูกิ ออกไปข้างนอกกันเถอะ จะได้ให้สองคนนั้นคุยกัน~ ไม่ได้ทะเลาะกันหรอกนะ~!"
211170-218 = "ห้ามทะเลาะกันนะ อิบูกิไม่ชอบให้ทะเลาะกัน..."
211170-221 = ""
211170-222 = "การตัดสินใจอันศักดิ์สิทธิ์ของเรา สำหรับเธอแล้วเป็นเพียงวาจาเหลวไหลเท่านั้นเหรอ อิโรฮะ?"
211170-223 = "ใช่ค่ะ! ศักดิ์สิทธิ์อะไรกัน มีแต่คำพูดเสียสติชัดๆ! การตั้งตนเป็นศัตรูกับคิโวทอสจะทำให้พวกเราได้#nอะไรกันคะ? งบประมาณ? อำนาจ? นี่มันเป็นการทำลายตัวเองชัดๆ!"
211170-224 = "คนที่พูดจาโง่เขลาคือเธอต่างหาก อิโรฮะ!!"
211170-225 = "หา?"
