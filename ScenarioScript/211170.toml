[translation]
211170-1 = "제17화;과거의 유산"
211170-2 = "(연설은 끝났지만, 아직도 정신이 멍했다.)"
211170-3 = "(무슨 일이 벌어진 건지 상황파악부터 하는 쪽이 좋을 것 같다.)"
211170-7 = "[ns1] \"일단…… 히나를 찾아가 보자.\"\n[ns2] 선도부실로 향한다."
211170-14 = "아…… 선생님."
211170-15 = "선생님……."
211170-16 = "……아까 그 사건에 대해 물으러 온 거지?"
211170-17 = "[s3] \"맞아.\"\n[s4] \"……두 사람, 괜찮아?\""
211170-22 = "……아니……."
211170-23 = "저도…… 정말 혼란스러워요."
211170-24 = "뭔가…… 우리 부장이 그런 말을 할 사람이 아니잖아."
211170-25 = "마코토 의장이랑 악수한 건 그렇다고 쳐도, 키보토스 정복이니, 전쟁이니…… 무슨 만우절 장난인가? 싶었다고."
211170-26 = "설마, 진심은 아니시겠죠? 그렇죠? 뭔가 저희가 모르는, 그런 사정이 있는 거겠죠?"
211170-27 = "아무튼 마침 잘 왔어, 선생님."
211170-28 = "우리도 물어보고 싶었거든. 같이 들어가자."
211170-40 = "아, 선생님. 어서 와."
211170-41 = "안 그래도 멋진 날이니, 이 기쁨을 함께 나누고 싶었거든."
211170-42 = "후후. 아까 광장에서 있었던 일은 잘 봤어?"
211170-43 = "[s] \"히나, 아까 했던 말은…… 진심이야?\""
211170-47 = "아…… 으응. 물론 진심이지. 나, 평소에 거짓말을 즐겨한 적은 없는 것 같은데."
211170-48 = "……."
211170-49 = "선생님, 표정도 평소보다 굳어 있는 것 같고…… 무슨 일 있어?"
211170-50 = "[s] (……어디부터 말해야 할까…….)"
211170-51 = "부장, 이거 혹시 스케일 큰 농담이야? 게헨나 전체를 대상으로 한?"
211170-52 = "마코토 의장이랑 짜고, 우리 모두를 깜짝 놀라게 해주려고……."
211170-53 = "그게 무슨 말이야? 이오리."
211170-54 = "아니-!! 상식적으로 말이 안 되잖아?! 키보토스 정복? 외부와의 전쟁? 이게 다 무슨 소린데??"
211170-55 = "진짜, 장난이면 지금이라도 말해줘! 대충 재밌었다고 칠 테니까!!"
211170-61 = "이오리, 설마 아직도 이해하지 못하고 있는 건가요?"
211170-62 = "뭘?!"
211170-63 = "우리 선도부의 진정한 사명을! 그리고 깨어난 게헨나의 의지를!"
211170-64 = "우리가 가진 철혈의 의지는 울타리 밖을 향해야 하는 겁니다! 키보토스 전체에 게헨나의 이름으로 된 진정한 질서를 집행하는 것이 우리가 존재하는 이유이자 사명!"
211170-65 = "아코 선임행정관, 진심으로 말씀하시는 건가요?!"
211170-66 = "아니, 아까부터 정말 답답하네요.#n이오리, 치나츠. 왜 당신들은 아직 모르고 있는 거죠?"
211170-67 = "저 어리석고 이기적인 마코토 의장마저 깨달은 진실인데 왜 당신들은……!"
211170-73 = "둘은 뭐가 문제라고 생각해?"
211170-78 = "그야, 이상하잖아…… 키보토스를 대상으로 전쟁을 일으킨다니, 그게 뭐야……."
211170-79 = "지금까지 우리가 해왔던 일은 뭔데……? 우리 선도부는 그런 게 아니잖아……?"
211170-80 = "선을…… 선을 긋는 존재라고 말했었잖아…… 우리는……"
211170-82 = "응, 그 말이 맞아."
211170-87 = "나는 약속했지. 게헨나가 선을 넘지 않게 하겠다고."
211170-88 = "그러니, 이제 우리가 긋는 선이 곧 게헨나가 되는 거야."
211170-89 = "우리가 딛는 모든 땅이 게헨나가 된다면, 더 이상 선을 넘는 일 따위는 발생하지 않을 테니까."
211170-91 = "그, 그런……"
211170-92 = "부장……!"
211170-98 = "[ns] \"히나…… 아코…… 어째서 이렇게 된 거야?\""
211170-99 = "선생님……."
211170-100 = "선생님도 아직 잘 모르는 얼굴이구나."
211170-101 = "하긴, 갑작스러울 수도 있어. 나도 오늘에야 깨달았거든."
211170-102 = "아니, 되살렸다고 해야 할까……?"
211170-103 = "게헨나의 힘을 하나로 모아 키보토스를 정복해야 한다는 마음을."
211170-104 = "우리 안에 잠들고 있던, 그 거룩하고 위대한 열망을."
211170-105 = "후후…… 네. 저도 마찬가지예요."
211170-106 = "불현듯 잠에서 깨어난 느낌이에요. 어떻게 지금까지 이 중요한 사명을 생각해내지 못하고 있었는지 모르겠다니까요."
211170-107 = "그리고 지금까지 항상 우리에게 훼방을 놓았던 저 만마전의 너구리 같은 의장도 우리와 같은 마음임을 확인했으니까요."
211170-108 = "하나의 기치 아래 단결한 게헨나는 그 누구도 막을 수 없을 거예요. 후훗."
211170-109 = "……계속 이러시면, 더 이상 장난으로는 들을 수 없습니다."
211170-113 = "치나츠, 지금 제가 장난으로 하는 이야기 같나요?"
211170-114 = "진지하다면, 그건 더욱 큰 문제입니다!!"
211170-118 = "아-! 정말!!"
211170-119 = "아까부터 왜 그러시는 건가요?! 이 중요한 사명을 앞에 두고, 어째서 자꾸 이해하지 못한 것처럼 구는 거예요?"
211170-120 = "두 분도 아시잖아요? 당연한 거잖아요? 게헨나가 무엇을 해야 하는지!"
211170-122 = "키보토스를 정복해? 그게 우리가 해야 할 사명이라고? 웃기지 마!!"
211170-123 = "우리가 총을 든 건 다른 사람을 짓밟기 위해서가 아니었잖아!"
211170-124 = "제멋대로 구는 녀석들 때문에 평범하게 지내고 싶은 학생들이 피해를 입지 않게 하려고……!!#n그래서, 그래서 귀찮고 힘든 일을 도맡아 해왔던 거 아니냐고!!"
211170-125 = "제가 알던 부장님은, 힘이 있는 사람이 그 힘을 함부로 휘두르는 것을 가장 경계하던 분입니다.#n지금의 부장님과 선임행정관은 어딘가 이상해요. 너무나 달라졌다고요."
211170-131 = "달라졌다고…… 그래. 그 말이 맞을지도 모르겠네."
211170-137 = "나는 지금 그 어느 때보다도 정신이 맑고 상쾌하거든.#n매일매일 나를 짓누르던 그 지독한 피로감이 어디에서 왔는지 이제야 알 것 같아."
211170-138 = "그건 우리가 나아가야 할 진정한 전장을 외면하고, 고작 이 작은 울타리 안에서의 질서만 지키고 있었기 때문이야."
211170-139 = "정당하게 힘을 써야 할 곳을 찾지 못했던 우유부단함이, 나 자신과 게헨나를 병들게 했던 거지."
211170-141 = "부장님…… 제발……."
211170-143 = "걱정 마. 키보토스의 모든 지역에 게헨나의 깃발이 꽂히게 되면, 모든 분쟁이 사라지게 될 거야.#n그때야말로 진정한 질서가 시작될 테니까."
211170-145 = "……부장……!!"
211170-146 = "[s] \"잠시, 머리를 식히자.\""
211170-153 = "[ns] \"이 둘과 함께 나갔다 올게.\""
211170-154 = "그렇게 해줘, 선생."
211170-155 = "두 사람을 잘 챙겨주세요, 선생님. 아직 혼란스러워하는 것 같으니."
211170-164 = "……."
211170-165 = "……."
211170-166 = "모르겠어요…… 왜, 어째서…… 무슨 일이 벌어진 거죠……?"
211170-167 = "선생님…… 우리…… 어떻게 해야 해……?"
211170-168 = "[s5] \"일단, 내가 상황을 알아볼게.\"\n[s6] \"두 사람은 조금 쉬고 있어.\""
211170-171 = "으응……."
211170-172 = "……곧 깨어날 꿈이라면 좋겠어요. 이런 악몽은…… 싫어요."
211170-173 = "[s] \"…….\""
211170-175 = "(만마전의 상황은 어떨지, 보러 가기로 했다.)"
211170-183 = "대체 무슨 생각이냐고요!!"
211170-186 = "[ns] \"……여기도…….\""
211170-189 = "쇼를 기획하더라도 정도가 있지, 그런 어처구니없는 소리가 말이 돼요?!"
211170-190 = "그것도 학원 전체에 방송으로!! 전교생이 모두 들을 수 있도록!!"
211170-191 = "시끄럽다, 이로하! 무엇이 어처구니없는 소리란 말이냐!"
211170-192 = "그럼, 그게 어처구니가 있는 소리인가요? 뭐? 키보토스 정복? 게헨나의 정당한 권역?"
211170-193 = "평소처럼 자기자랑으로 끝냈어야죠! 역사에 남을 명연설은 무슨!"
211170-194 = "아니, 역사에 남긴 하겠네요!#n게헨나에서 전무후무한 망언이라고!!"
211170-199 = "이, 이로하 쨩…… 조금 진정하고……."
211170-200 = "이로하 선배, 마코토 선배…… 싸우는 거야……?"
211170-206 = "……치아키, 이부키를 데리고 나가있도록 해라."
211170-211 = "……넵!"
211170-217 = "이부키, 둘이 이야기할 수 있도록 나가 있자~ 싸우는 거 아니니까~!"
211170-218 = "싸우면 안 돼. 싸우는 거 싫어……."
211170-222 = "이 몸이 내린 성스러운 결단이, 이로하 네 귀에는 고작 망언으로 들린다는 거냐?"
211170-223 = "그래요! 성스럽긴커녕 정신 나간 소리로밖에 안 들린다고요! 키보토스 전체를 적으로 돌려서 우리가 얻는 게 도대체 뭔데요? 예산? 권력? 그냥 자폭이잖아요!"
211170-224 = "바보 같은 소리를 하는 건 너다, 이로하!!"
211170-225 = "하?"
211170-226 = "우리 게헨나가 그동안 얼마나 천박한 평화에 안주해 왔는지 아직도 모르겠나? 타 학원들의 눈치를 봐가며, 이 좁은 울타리 안에서 도토리 키재기나 하던 나날들이야말로 게헨나의 수치인 것이다!"
211170-227 = "그게 정상이니까요! 서로 투닥거릴지언정 선을 넘지 않는 게 상식이잖아요?"
211170-232 = "썩어빠진 기존의 질서를 부수고, 철혈의 게헨나가 지배하는 새로운 세계를 세우는 것! 이것이 우리가 나아가야 할 진정한 길인 것을 왜 모르나!!"
211170-236 = "아니……"
211170-237 = "……선배, 대체 왜 이러는 거예요? 오늘 왜 이렇게 특히 더 이상한 거죠?"
211170-238 = "키시싯…… 이로하, 너의 그 얄팍한 시야로는 이상해 보일 수 있겠지."
211170-239 = "이 하누마 마코토 님께서는, 오늘 드디어 '완성'된 것이다.#n불현듯 떠오른 강렬한 의지에 의해서 말이다!"
211170-240 = "그게 무슨……"
211170-241 = "심지어 저 눈엣가시 같은 선도부장, 소라사키 히나조차 나의 대의에 응답하고 복종하는 모습을 보았을 텐데?"
211170-242 = "그게, 그게 제일 문제라고요! 원래라면 선배의 헛소리에 콧방귀도 뀌지 않았어야 할 사람인데!"
211170-243 = "대체 무슨 짓을 한 거예요? 혹시 사츠키 선배의 최면이라도 성공한 거예요?"
211170-250 = "……!!"
211170-251 = "……설마……?"
211170-253 = "그러지 않고서야 이런 일이 일어날 수 없는데……!!"
211170-254 = "흥, 히나 그 녀석도 제대로 된 사명감에 눈을 뜬 거지."
211170-255 = "보아라, 이로하. 일치단결한 게헨나의 힘 앞에서, 너의 그 의구심도 곧 사라지게 될 테니."
211170-256 = "……진심이군요…… 마코토 선배……."
211170-257 = "나는 언제나 진심이었다. 이로하. 알고 있을 텐데."
211170-258 = "네. 알죠. ……잘 알죠."
211170-265 = "……."
211170-266 = "……."
211170-267 = "쯧. 이로하 녀석, 어째서 저렇게까지 과민반응을 보이는 거지?"
211170-268 = "이제야말로 게헨나의 힘이 하나로 모여, 거룩한 정복을 시작하고자 하는 순간이거늘."
211170-269 = "……."
211170-272 = "[ns] (발걸음을 돌린다.)"
211170-277 = "(만마전의 상황도 비슷한 것을 확인했다.)"
211170-278 = "(……믿고 싶지 않지만, 마코토와 히나 모두 진심인 것 같다…….)"
211170-281 = "……."
211170-286 = "[ns] \"이로하.\""
211170-290 = "선생님."
211170-294 = "……계셨군요. 혹시 아까 이야기도 들으셨나요……?"
211170-297 = "그렇군요……."
211170-298 = "……왜 갑자기 이렇게 된 거죠? 무슨 일이 일어난 건지 모르겠어요……."
211170-299 = "아시잖아요, 선생님도. 마코토 선배가 평소에는 비록 얼빠져보이고 못 미더운 부분들도 분명 있지만, 그래도 저런 사람은 아니었다는 거."
211170-300 = "[s] \"잘 알고 있어.\""
211170-301 = "……하아…… 이부키에게는 또 뭐라고 말해야 할지……."
211170-305 = "……정말 그런 일들이 실제로 일어나진 않겠죠?"
211170-306 = "[s] \"일단 상황을 좀 파악해 볼게.\""
211170-307 = "……부탁드립니다. 지금 저한테는 선생님밖에 의지할 사람이 떠오르지 않네요……."
211170-310 = "(달라지지 않은 사람들과 있으면 안심할 것 같아서, 이로하에게 이오리, 치나츠와 함께 있기를 권했다.)"
211170-311 = "[ns7] \"…….\"\n[ns8] (다른 동아리도 가보자.)"
211170-325 = "어서 오십시오, 선생님."
211170-326 = "지금 바쁘게 움직이고 있던 터라, 마실 것이나 간식을 내어드리지 못해 죄송합니다."
211170-327 = "[s9] \"아냐, 괜찮아. 세나.\"\n[s10] \"다들 아주 바빠 보이네. 무슨 일 있어?\""
211170-330 = "아, 네. 아무래도 저희도 준비를 해야 하니까요."
211170-331 = "무슨 준비냐고요?"
211170-332 = "키보토스 정복을 위한 구호 물자입니다. 아무래도 저희가 할 수 있는 것은 전장에서의 응급조치 및 시체, 아니…… 환자 운송과 대응 정도니까요."
211170-333 = "[s] \"……진심…… 인 거지?\""
211170-334 = "당연히…… 진심입니다만?"
211170-335 = "저는 정치에는 관심도 없고 잘 모르지만, 만마전과 선도부가 드디어 하나된 모습을 보여준 것은 상당히 기껍게 생각합니다."
