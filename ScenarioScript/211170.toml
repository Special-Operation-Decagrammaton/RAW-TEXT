211170-467 = "อาโกะก็เหมือนกัน"
211170-469 = "รุ่นพี่ซัตสึกิก็ด้วยค่ะ"
211170-470 = "[s] \"มีแต่นักเรียนชั้นปีที่ 3 ที่แปลกไปงั้นเหรอ...?\""
211170-472 = "ถ้าดูจากผลลัพธ์ ตอนนี้ก็ดูเหมือนจะเป็นแบบนั้น... แต่เพราะอะไรล่ะ?"
