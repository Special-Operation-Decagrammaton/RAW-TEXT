211170-499 = "คะ? หมายความว่ายังไงคะ สมาชิกซัตสึกิ...?"
211170-500 = "เดี๋ยวนะ สมาชิกซัตสึกิเองก็แปลกไปด้วยหรือเปล่า?"
211170-501 = "บอกมาเลยนะ! เหตุผลที่... เกเฮนน่าต้องพิชิตคิโวทอสอะไรนั่นน่ะ...!"
211170-502 = ""
211170-505 = ""
211170-506 = "จะทำเรื่องแบบนั้นไปทำไมกันล่ะ? ทั้งสงคราม ทั้งการพิชิต ฉันไม่ชอบทั้งนั้นแหละ"
