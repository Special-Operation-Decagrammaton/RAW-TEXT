211170-29 = ""
211170-36 = ""
211170-39 = ""
211170-40 = "Oh, Sensei. Welcome."
211170-41 = "Today is a glorious day, and I'm grateful to share this joy with you."
211170-42 = "Fufu. Did you see me in the plaza earlier?"
211170-43 = "[s] \"...Did you mean what you said?\""
211170-44 = ""
211170-46 = ""
211170-47 = "Ah... Of course I did. I am not exactly the joking type."
211170-48 = "..."
211170-49 = "Sensei, you seem more tense than usual... Is something the matter?"
211170-50 = "[s] \"(...Where should I start...?)\""
211170-51 = "Head Prefect, is this some prank you're pulling? On ALL of Gehenna?"
211170-52 = "Did you and Makoto plan this all out as some surprise, or...?"
211170-53 = "Whatever do you mean, Iori?"
