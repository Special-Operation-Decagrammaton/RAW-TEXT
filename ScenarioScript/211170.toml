211170-55 = "Just tell me it's a joke! I'll even laugh for you and let it go!"
211170-56 = ""
211170-58 = ""
211170-60 = ""
211170-61 = "Sweet Iori, do you still not understand?"
211170-62 = "\"Understand\" what?!"
211170-63 = "The Prefect Team's true mission! The awakened purpose of Gehenna!"
211170-64 = "Our iron-blooded will must be directed beyond our borders! We shall expand our living space and enforce true order across all of Kivotos. What else would we be doing?"
211170-65 = "Senior Administrator Ako, are you serious?!"
211170-66 = "Ugh, this is so frustrating. Iori, Chinatsu. Why don't you understand?"
211170-67 = "If even that megalomaniac Chairman realized this truth, why are you two so slow...?!"
211170-68 = ""
211170-70 = ""
211170-72 = ""
211170-73 = "What problem do you two have?"
211170-74 = ""
211170-77 = ""
211170-78 = "It's weird... How could you actually want to start a war with Kivotos?"
211170-79 = "We never talked about this. This isn't what the Prefect Team is about..."
211170-80 = "You... You said we are the ones who draw the line..."
211170-82 = "I hear you. You're right."
211170-83 = ""
211170-85 = ""
211170-87 = "I made a vow to stop Gehenna from crossing the line."
211170-88 = "But now, the line we draw becomes Gehenna itself."
211170-89 = "If every centimeter of ground we tread upon becomes Gehenna, then no one will be crossing the line."
211170-91 = "Th-That's..."
211170-92 = "Head Prefect...!"
211170-93 = ""
211170-95 = ""
211170-97 = ""
211170-98 = "[ns] \"Hina... Ako... Why have you changed?\""
211170-99 = "Sensei..."
211170-100 = "It seems you have not come to see the truth yet."
211170-101 = "Well, I sympathize with your confusion. I only realized it myself today."
211170-102 = "No, I suppose I should say I was \"reminded\" of it...? I'd always known."
211170-103 = "...The resolve to unite Gehenna's power and conquer Kivotos."
211170-104 = "...The great and glorious aspiration that was lying dormant within us."
211170-105 = "Fufu... Yes. Same with me."
211170-106 = "It feels like I've suddenly awakened. I honestly can't fathom how I failed to see our mission for so long."
211170-107 = "It's so evident that even that dummkopf chairman sees it."
211170-108 = "Gehenna united under a single banner will be unstoppable. Fufu."
211170-109 = "...If you keep this up, I can no longer dismiss it as a joke, you know?"
211170-110 = ""
211170-112 = ""
211170-113 = "Chinatsu, do you think I am kidding right now?"
211170-114 = "If you are actually serious, then we have a bigger problem!"
211170-115 = ""
211170-117 = ""
211170-118 = "Ugh! REALLY?!"
211170-119 = "Has something gotten into you?! Why are you acting like you don't understand? We're supposed to be coordinated and aligned."
211170-120 = "Isn't it only natural?! Isn't it obvious? You know what Gehenna must do!"
211170-122 = "Conquer Kivotos?!"
211170-123 = "We didn't pick up our guns so we could stomp on others like a bunch of dictators!"
211170-124 = "\"To protect the students who want a proper and peaceful education\"...! That's what we're working for, isn't it?!"
211170-125 = "The Hina I knew was deeply wary of those recklessly wielding power. Something is OFF about you two. You're not yourselves."
211170-126 = ""
211170-128 = ""
211170-130 = ""
211170-131 = "We're not doppelgängers, Chinatsu. But, yes. We may have changed."
211170-132 = ""
211170-135 = ""
211170-137 = "My mind is clearer and more refreshed than ever. Now that I'm free of it, I finally understand the ponderous fatigue that previously weighed me down."
211170-138 = "I suffered angst because I ignored our destined battlefield, instead focusing on maintaining menial order within these claustrophobic walls. "
211170-139 = "My wavering indecisiveness sickened both myself and Gehenna at large."
211170-141 = "Head Prefect... Please..."
211170-143 = "Don't worry. Once the Gehennan flag flies in every corner of Kivotos, all conflict will vanish. Then the true order will begin."
211170-145 = "...Head Prefect...!!!"
211170-146 = "[s] \"Let's take a breather.\""
211170-147 = ""
211170-149 = ""
211170-150 = ""
211170-152 = ""
211170-153 = "[ns] \"I'll take these two with me.\""
211170-154 = "Please do, Sensei."
211170-155 = "Do take good care of them, Sensei. They still appear to be confused."
211170-156 = ""
211170-163 = ""
211170-164 = "..."
211170-165 = "..."
211170-166 = "I don't understand... Why, how... What is happening...?"
211170-167 = "Sensei... What...should we do...?"
211170-168 = "[s5] \"Let me check things out.\"\n[s6] \"The two of you should take a break.\""
211170-171 = "Mmm..."
211170-172 = "...This is like a horrific dream. I hate...when I can't wake from a nightmare."
211170-173 = "[s] \"...\""
211170-175 = "I decided to visit the Pandemonium Society."
211170-176 = ""
211170-183 = "What are you thinking?!"
211170-186 = "[ns] \"...It's the same here...\""
211170-189 = "Enough stunts. You've gone too far. How could you spit such drivel?!"
211170-190 = "And over the academy's broadcast system! Every student must have heard your hegemonic nonsense!"
211170-191 = "Shut up, Iroha! What are you calling \"nonsense\"?!"
211170-192 = "So you think that makes sense? We should conquer Kivotos? It's Gehenna's rightful territory?"
211170-193 = "You should've just bragged about yourself like you always do, you megalomaniac! So much for \"making history\"!"
211170-194 = "Oh, you had a moment, all right! This will go down as the most outrageous, bloody blunder in the history of Gehenna!"
211170-195 = ""
211170-197 = ""
211170-199 = "I-Iroha... Calm down..."
211170-200 = "Iroha, Makoto... Are you fighting...?"
211170-202 = ""
211170-205 = ""
211170-206 = "...Chiaki. Take Ibuki outside with you."
211170-207 = ""
211170-210 = ""
211170-211 = "...Right away!"
211170-212 = ""
211170-217 = "Ibuki, let's step out so the two of them can talk. They're not fighting! It's...a play!"
211170-218 = "Not fighting. Fighting is bad..."
211170-221 = ""
211170-222 = "Now, then. Iroha, did my sacred decision sound like nothing more than raving nonsense to your ears?"
211170-223 = "That's right! Forget sacred—you sounded insane! What do we gain by making all of Kivotos our enemy? Budget? Power? No, we get a suicide mission!"
211170-224 = "No, no, no! You're utterly foolish, Iroha!!!"
211170-225 = "Is that so?"
211170-226 = "Do you still not realize how Gehenna has rested on a shoddy foundation of shallow peace? It is a disgrace that Gehenna has wasted months fretting about offending other academies and bickering amongst ourselves!"
211170-227 = "That's normal diplomacy! Even if we don't always get along, we know not to cross the line."
211170-228 = ""
211170-230 = ""
211170-232 = "Shatter this rotten, existing order and establish a new world ruled by the iron-blooded Gehenna! This is realpolitik. Can't you see that?"
211170-233 = ""
211170-235 = ""
211170-236 = "No..."
211170-237 = "...Makoto, why are you doing this? What's gotten into you today?"
211170-238 = "Kihehe... Iroha, it might appear strange to those myopic eyes of yours."
211170-239 = "Today, I, Hanuma Makoto, have become \"complete\"—and driven by a sudden, intense surge of will!"
211170-240 = "What are you...?"
211170-241 = "Didn't you see how even that dreadful Head Prefect Sorasaki Hina succumbed to me? She submitted to my grand cause."
211170-242 = "That! That's the problem! She normally would've scoffed at your nonsense!"
211170-243 = "Just what did you do to her? Satsuki, did you finally actually hypnotize someone?"
211170-244 = ""
211170-246 = ""
211170-248 = ""
211170-249 = ""
211170-250 = "...!!!"
211170-251 = "...There's no way..."
211170-253 = "I don't see a better explanation...!"
211170-254 = "Hmph. What you saw was Hina finally opening her eyes to her duties."
211170-255 = "Just you wait, Iroha. Your doubts shall soon vanish before the united power of Gehenna."
211170-256 = "...So you're serious... Makoto..."
211170-257 = "I am always serious, Iroha. You know me very well."
211170-258 = "Yes. I do. ...I do."
