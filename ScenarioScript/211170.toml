211170-530 = ""
211170-531 = "[ns17] \"สถานการณ์ตอนนี้...\"\n[ns18] \"เป็นเพราะโปรเจกต์อัลตร้า NK เหรอ?\"\n[ns19] \"โปรเจกต์ที่ซัตสึกิชอบพูดถึงน่ะเหรอ?\""
211170-535 = "ใช่แล้ว ครู"
211170-536 = "พูดอะไรคะ! นั่นก็แค่วิชาสะกดจิตที่รุ่นพี่ซัตสึกิคิดขึ้นมาไม่ใช่เหรอคะ? แถมยังไม่รู้ด้วยซ้ำว่าจะได้ผลจริงหรือเปล่าด้วย!"
211170-537 = "จะพูดแบบนั้นก็ไม่ผิดหรอก เพราะจนถึงตอนนี้ คนที่ทดลองใช้แล้วได้ผลก็มีแค่มาโคโตะจังเท่านั้น"
211170-538 = ""
211170-540 = ""
211170-542 = "เดี๋ยวสิ เดี๋ยวก่อนนะ!"
211170-543 = "ถ้างั้นก็หมายความว่า สมาชิกซัตสึกิเป็นคนล้างสมองรุ่นพี่คนอื่นๆ เหรอ?"
211170-544 = "ไม่ใช่... ถ้าเป็นอย่างนั้น สถานการณ์อย่างตอนนี้ไม่มีทางเกิดขึ้นเด็ดขาดหรอก"
211170-545 = "นี่มันไม่ใช่โปรเจกต์อัลตร้า NK 'ของฉัน' "
211170-546 = "แต่เป็นของที่เคยมีมาก่อนหน้านั้นน่ะ"
211170-547 = "เคยมีมาก่อนหน้านั้น หมายความว่า...?"
211170-548 = "สิ่งที่ฉันกับมาโคโตะจังพยายามกลบฝังชื่อนั้น เพื่อกำจัดมันให้หายไปจากโลก"
211170-549 = ""
211170-551 = ""
211170-553 = "มันคือ <โปรเจกต์อัลตร้า NK ที่แท้จริง> ที่ผู้เหี้ยมโหดเคยวิจัยยังไงล่ะ"
211170-555 = "องก์ <เปลวเพลิงและเงามืด>;ติดตามต่อในบทที่ 2"
