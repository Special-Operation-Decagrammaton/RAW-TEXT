[translation]
211170-1 = "ตอนที่ 17;มรดกจากอดีต"
211170-2 = "(การปราศรัยจบลงแล้ว แต่คุณครูยังรู้สึกมึนหัวอยู่)"
211170-3 = "(ดูเหมือนว่าควรต้องเริ่มจากการทำความเข้าใจก่อนว่าเกิดอะไรขึ้น)"
211170-4 = ""
211170-7 = "[ns1] \"ต้องเริ่มจาก... ไปหาฮินะก่อน\"\n[ns2] มุ่งไปที่ห้องคณะกรรมการวินัย"
211170-13 = ""
211170-14 = "อ่า... คุณครู"
211170-15 = "คุณครู..."
211170-16 = "จะมาถามเรื่องเมื่อกี้ใช่มั้ย...?"
211170-17 = "[s3] \"ใช่ ทั้งสองคนไม่เป็นไรนะ?\"\n[s4] \"ทั้งสองคน... ไม่เป็นไรนะ?\""
211170-18 = ""
211170-19 = ""
211170-21 = ""
211170-22 = "ไม่เลย..."
211170-23 = "ฉันก็... สับสนมากเลยค่ะ"
211170-24 = "มันแปลกๆ นะ... ประธานของเราไม่ใช่คนที่จะพูดอะไรแบบนั้นนี่นา"
211170-25 = "ต่อให้เรื่องจับมือกับประธานมาโคโตะยังพอเข้าใจได้ แต่การพิชิตคิโวทอส การทำสงคราม... ฉันนึกว่าเป็นมุกวันเมษาหน้าโง่อะไรทำนองนั้นเสียอีก"
211170-26 = "คงไม่ได้พูดจริงใช่มั้ยคะ? ใช่หรือเปล่าคะ? ต้องมีเหตุผลบางอย่างที่พวกเราไม่รู้อยู่แน่ๆ ใช่มั้ยคะ?"
211170-27 = "เอาเป็นว่า คุณครูมาถูกจังหวะพอดีเลย"
211170-28 = "พวกเราก็อยากถามอยู่เหมือนกัน เข้าไปด้วยกันเถอะ"
211170-29 = ""
211170-36 = ""
211170-39 = ""
211170-40 = "อ้อ คุณครู เชิญเลย"
211170-41 = "วันนี้เป็นวันที่ยอดเยี่ยมพอดี ฉันกำลังอยากแบ่งปันความน่ายินดีนี้กับคุณครูอยู่เลย"
211170-42 = "ฮุฮุ เห็นเรื่องที่เกิดขึ้นในจัตุรัสเมื่อกี้หรือเปล่า?"
211170-43 = "[s] \"ฮินะ ที่พูดมาเมื่อกี้... พูดจริงเหรอ?\""
211170-44 = ""
211170-46 = ""
211170-47 = "อ่า... อื้ม ก็จริงน่ะสิ ปกติฉันก็ไม่ใช่คนที่ชอบพูดโกหกอยู่แล้ว"
211170-48 = "..."
211170-49 = "คุณครู สีหน้าดูเคร่งเครียดกว่าปกตินะ... มีอะไรหรือเปล่า?"
211170-50 = "[s] (ควรเริ่มพูดจากตรงไหนดีนะ...)"
211170-51 = "ประธาน นี่เป็นการเล่นมุกครั้งใหญ่หรือเปล่า? มุกที่เล่นกับคนทั้งเกเฮนน่าน่ะ?"
211170-52 = "วางแผนกับประธานมาโคโตะ เพื่อทำให้พวกเราทุกคนตกใจใช่มั้ย..."
211170-53 = "พูดอะไรของเธอ อิโอริ?"
211170-54 = "ไม่เอาน่า!! คิดตามหลักเหตุผลแล้วมันเป็นไปไม่ได้ไม่ใช่เหรอ?! พิชิตคิโวทอส? ทำสงครามกับภายนอก? ทั้งหมดนี่มันเรื่องบ้าอะไรกัน??"
211170-55 = "จริงๆ เลย ถ้านี่เป็นเรื่องล้อเล่น ก็บอกมาตอนนี้เลยเถอะ! ฉันจะถือว่าสนุกก็แล้วกัน!!"
211170-56 = ""
211170-58 = ""
211170-60 = ""
211170-61 = "อิโอริ นี่ยังไม่เข้าใจอีกเหรอคะ?"
211170-62 = "อะไรล่ะ?!"
211170-63 = "ภารกิจที่แท้จริงของคณะกรรมการวินัยของเรา! และเจตจำนงของเกเฮนน่าที่ตื่นขึ้นแล้ว!"
211170-64 = "เจตจำนงแห่งเหล็กและเลือดของพวกเราที่ต้องมุ่งออกไปนอกรั้ว! การบังคับใช้ระเบียบที่แท้จริง#nในนามของเกเฮนน่าให้ครอบคลุมทั่วทั้งคิโวทอส นี่คือเหตุผลที่เราดำรงอยู่และเป็นภารกิจของเรา!"
211170-65 = "เจ้าหน้าที่อาวุโสอาโกะ พูดจริงเหรอคะ?!"
211170-66 = "ไม่สิ ตั้งแต่เมื่อกี้นี้แล้ว ชวนให้น่าหงุดหงิดจริงๆ เลยนะคะ อิโอริ ชินัตสึ ทำไมพวกคุณถึงยังไม่เข้าใจอีกคะ?"
211170-67 = "ขนาดประธานมาโคโตะที่โง่เขลาเห็นแก่ตัวคนนั้นยังตระหนักถึงความจริงนี้ได้ แล้วทำไมพวกคุณถึงยัง...!"
211170-68 = ""
211170-70 = ""
211170-72 = ""
211170-73 = "พวกเธอทั้งสองคน คิดว่ามีอะไรเป็นปัญหางั้นเหรอ?"
211170-74 = ""
211170-77 = ""
211170-78 = "ก็มันแปลกนี่นา... จะก่อสงครามกับคิโวทอสเนี่ยนะ นี่มันเรื่องอะไรกัน..."
211170-79 = "แล้วสิ่งที่พวกเราทำมาจนถึงตอนนี้คืออะไรล่ะ...? คณะกรรมการวินัยของเราไม่ใช่องค์กรแบบนั้น#nไม่ใช่เหรอ...?"
211170-80 = "เคยบอกว่า... พวกเราเป็นผู้ขีดเส้นขอบเขตไม่ใช่เหรอ..."
211170-82 = "อื้ม พูดถูกแล้ว"
211170-83 = ""
211170-85 = ""
211170-87 = "ฉันเคยสัญญาไว้ ว่าจะไม่ให้เกเฮนน่าก้าวล้ำเส้น"
211170-88 = "เพราะงั้น ต่อจากนี้ เส้นที่พวกเราขีดขึ้นก็คือเขตแดนของเกเฮนน่า"
211170-89 = "เพราะถ้าทุกพื้นที่ที่พวกเราเหยียบย่างกลายเป็นเกเฮนน่า ก็จะไม่มีเรื่องก้าวล้ำเส้นเกิดขึ้นอีกต่อไป"
211170-91 = "บะ... แบบนั้นมัน..."
211170-92 = "ประธาน...!"
211170-93 = ""
211170-95 = ""
211170-97 = ""
211170-98 = "[ns] \"ฮินะ... อาโกะ... ทำไมถึงเป็นอย่างนี้ไปได้\""
211170-99 = "คุณครู..."
211170-100 = "คุณครูเองก็ยังทำหน้าเหมือนไม่ค่อยเข้าใจสินะ"
211170-101 = "ก็นะ มันอาจกะทันหันไปหน่อย เพราะฉันเองก็เพิ่งตระหนักได้วันนี้เหมือนกัน"
211170-102 = "ไม่สิ ต้องบอกว่าเพิ่งปลุกมันให้ฟื้นคืนกลับมามากกว่า...?"
211170-103 = "ความปรารถนาที่จะรวมพลังของเกเฮนน่าให้เป็นหนึ่งและพิชิตคิโวทอส"
211170-104 = "ปณิธานอันศักดิ์สิทธิ์และยิ่งใหญ่ ที่หลับใหลอยู่ภายในพวกเรา"
211170-105 = "ฮุฮุ... ค่ะ ฉันเองก็เหมือนกันค่ะ"
211170-106 = "รู้สึกราวกับจู่ๆ ก็ตื่นขึ้นจากการหลับใหลเลยค่ะ ไม่เข้าใจเหมือนกันว่าทำไมจนถึงตอนนี้ถึงไม่เคย#nนึกถึงภารกิจสำคัญนี้มาก่อน"
211170-107 = "แถมยังได้ยืนยันแล้วด้วยว่า ประธานจอมเจ้าเล่ห์ราวกับแรคคูนแห่งแพนเดโมเนียม โซไซตี้#nที่คอยขัดขวางพวกเรามาตลอด ก็มีความคิดเช่นเดียวกับพวกเราค่ะ"
211170-108 = "เกเฮนน่าที่รวมเป็นหนึ่งภายใต้ธงผืนเดียวกัน จะไม่มีใครหยุดยั้งได้ค่ะ ฮุฮุ"
211170-109 = "ถ้ายังพูดแบบนี้ต่อไป ฉันคงไม่อาจมองว่าเป็นเรื่องล้อเล่นได้อีกแล้วค่ะ..."
211170-110 = ""
211170-112 = ""
211170-113 = "ชินัตสึ เรื่องที่ฉันพูดอยู่ตอนนี้ ฟังดูเหมือนเรื่องล้อเล่นงั้นเหรอคะ?"
211170-114 = "ถ้าพูดจริงละก็ นั่นยิ่งเป็นปัญหาใหญ่กว่าเดิมเลยนะคะ!!"
211170-115 = ""
211170-117 = ""
211170-118 = "เฮ้อ! จริงๆ เลย!!"
211170-119 = "ตั้งแต่เมื่อกี้แล้วนะ เป็นอะไรไปกันคะ?! ทั้งที่มีภารกิจสำคัญอยู่ตรงหน้า แต่ทำไมถึงเอาแต่ทำเหมือน#nไม่เข้าใจกันอยู่ได้ล่ะคะ?"
211170-120 = "ทั้งสองคนก็รู้อยู่แล้วไม่ใช่เหรอคะ? เห็นได้ชัดอยู่แล้วไม่ใช่เหรอว่าเกเฮนน่าต้องทำอะไร!"
211170-122 = "พิชิตคิโวทอสเนี่ยนะ? นั่นคือภารกิจที่เราต้องทำงั้นเหรอ? อย่ามาพูดอะไรน่าขำแบบนั้นนะ!!"
211170-123 = "พวกเราไม่ได้จับปืนเพื่อเหยียบย่ำคนอื่นสักหน่อย!"
211170-124 = "ก็เพื่อไม่ให้นักเรียนที่อยากใช้ชีวิตธรรมดาๆ ต้องเดือดร้อนเพราะพวกที่ทำอะไรตามอำเภอใจ...!!#nเพราะแบบนั้นไง เพราะแบบนั้นเราถึงได้รับงานยุ่งยากและหนักหนาทั้งหมดมาทำเองไม่ใช่เหรอ!!"
211170-125 = "ท่านประธานที่ฉันรู้จัก เป็นคนที่ระวังที่สุดเพื่อไม่ให้ผู้มีอำนาจใช้อำนาจนั้นตามอำเภอใจค่ะ#nแต่ท่านประธานกับเจ้าหน้าที่อาวุโสในตอนนี้ดูผิดปกติไปค่ะ เปลี่ยนไปมากเกินไปแล้ว"
211170-126 = ""
211170-128 = ""
211170-130 = ""
211170-131 = "เปลี่ยนไปงั้นเหรอ... ก็จริง บางทีอาจเป็นอย่างที่พูดก็ได้"
211170-132 = ""
211170-135 = ""
211170-137 = "ตอนนี้ฉันมีสติแจ่มชัดและรู้สึกปลอดโปร่งยิ่งกว่าครั้งไหนๆ ในที่สุดฉันก็เหมือนจะเข้าใจแล้วว่า#nความเหนื่อยล้าแสนสาหัสที่กดทับฉันอยู่ทุกวันนั้นมาจากไหน"
211170-138 = "นั่นเป็นเพราะพวกเราหันหน้าหนีจากสนามรบที่แท้จริงที่ควรมุ่งไป แล้วเอาแต่รักษาระเบียบอยู่#nภายในรั้วเล็กๆ แห่งนี้เท่านั้น"
211170-139 = "ความไม่เด็ดขาดที่ทำให้เราไม่อาจพบสถานที่ที่ควรใช้กำลังอย่างชอบธรรมได้นั่นเอง ที่คอยกัดกินทั้งตัวฉันและเกเฮนน่า"
211170-141 = "ท่านประธาน... ขอร้องละค่ะ..."
211170-143 = "ไม่ต้องห่วง เมื่อธงของเกเฮนน่าปักอยู่ในทุกพื้นที่ของคิโวทอส ความขัดแย้งทั้งหมดก็จะหายไป#nเมื่อนั้นต่างหาก ระเบียบที่แท้จริงจึงจะเริ่มต้นขึ้น"
211170-145 = "ประธาน...!!"
