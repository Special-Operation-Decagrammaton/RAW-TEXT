[translation]
34100-1 = "제10화;아리우스 자치구로 2"
34100-2 = "……. 여기서부터 지하도를 통해 카타콤의 입구로 진입할 거야."
34100-3 = "하지만…… 아까 병력의 움직임을 봤을 때, <그녀>도 우리가 이 통로를 이용할 거라는 걸 이미 알고 있는 것 같네."
34100-4 = "……그래. 아마 대비를 해 두었겠지."
34100-5 = "우리에게 남은 게 이 입구뿐이라는 건 조금만 계산해봐도 알 수 있는 당연한 사실이야."
34100-6 = "뭐, 이쪽에선 누구나 알고 있을 정보. 새삼스러운 것도 없겠지."
34100-7 = "그, 그럼 어떻게 하죠?"
34100-8 = "우회로는 없어. 그리고 다른 카타콤의 입구를 찾아낼 시간도 없고."
34100-14 = "강행 돌파한다."
34100-15 = "……역시 그렇겠지. 어차피 그쪽이나 우리나 피차 생각하는 건 같을 거고. 변수가 있다면 <샬레>의 선생님뿐이겠지."
34100-16 = "헤헤…… 그, 그렇군요. 역시. 잘 부탁드립니다……."
34100-17 = "[s] \"으, 으응. 나야말로……?\""
34100-21 = "아마 훈련이 잘된 엘리트 병사가 기다리고 있을 거야."
34100-22 = "우리가 앞장서겠어. 선생은 안전이 확보되면 뒤따라오도록 해."
34100-23 = "힘겨운 싸움이 되겠지만, 여기를 돌파해야 아리우스 자치구로 갈 수 있어."
34100-24 = "그럼 시작한다."
