[translation]
2005505-1 = "게임 대회"
2005505-2 = "게임개발부 부실"
2005505-3 = "<버추얼 보스>가 게임 대회의 우승 상품으로 나왔다니……."
2005505-4 = "……확실히, 그 인기를 생각하면 우승 상품으로 걸릴 만한 물건이긴 하네요."
2005505-5 = "잠깐, 그럼 선생님이 생각하신 방법이라는 게……."
2005505-6 = "그 대회에서 우승해서, <버추얼 보스>를 받아내는 건가요……?!"
2005505-10 = "쉬, 쉽지만은 않은 방법이네요……."
2005505-11 = "[s]\"두려운가?\""
2005505-12 = "아뇨. 시켜만 주세요, 선생님! 게임이라면, 저……!"
2005505-13 = "……가 아니라! 어떤 게임의 대회인가요?"
2005505-14 = "<시뮬리온 퀘스트>라고요? 그 게임이라면, 얼마 전에 선생님과 했던 VR 게임……!"
2005505-15 = "……확실히, 그 게임이라면 승산이 있겠어요."
2005505-16 = "하지만, 아직 1인 플레이로 순위권에 오를 자신은 없는데……."
2005505-17 = "[s]\"그래서 이미 2인 합동전 부문으로 신청해 놨지.\""
2005505-21 = "예?! 선생님도 함께 나가시려고요?"
2005505-22 = "동료를 홀로 전장에 내보낼 수는 없으니까, 라고요……?"
2005505-23 = "무, 물론 <시뮬리온 퀘스트>라면…… 저 혼자서는 예선 통과도 어려울 테니……."
2005505-24 = "……고맙습니다, 선생님. 함께, 우승을 노려봐요……!"
2005505-25 = "[s1] \"그런데 말이야, 유즈.\"\n[s2] \"시뮬리온 퀘스트의 대회에는 참가 조건이 또 있는 모양이야.\""
2005505-28 = "조건, 이요……?"
2005505-30 = "(그로부터 얼마 후, 게임 대회 본선 날.)"
2005505-32 = "게임 대회장 입구"
2005505-34 = "무리예요!"
2005505-35 = "선생님을 믿었는데…… 믿었었는데……!"
2005505-36 = "[s]\"진정해, 유즈.\""
2005505-40 = "[ns3]\"다들 게임 내의 의상으로 입고 있잖아?\"\n[ns4]\"평범한 코스프레 회장이라고 생각하면 괜찮을 거야.\""
2005505-43 = "하, 하지만 그렇게 말씀하셔도…… 평범하게 입은 사람도 있는 것 같고……"
2005505-44 = "서, 선생님도 평범하게 정장을 입고 오셨잖아요!"
2005505-45 = "[s5]\"게임 내에 등장하는 시민 NPC의 복장이야.\"\n[s6]\"정장은 어른의 갑옷이니까.\""
2005505-48 = "그, 그럴 줄 알았으면 저도 평범하게 제복을 입고 왔을 텐데……"
2005505-49 = "무, 물론 이 복장이 VR 게임을 진행하기에는 가장 제격이라는 건 부정하지 않겠지만……"
2005505-50 = "[s]\"아, 시작된 모양이야. 들어가자, 유즈!\""
2005505-51 = "흐에에에엥……!!!"
2005505-53 = "(이후, 경기를 진행하는 내내 유즈는 내 등 뒤에 딱 달라붙어 있었다.)"
2005505-55 = "게임 대회장 내부"
2005505-56 = "자! 한껏 열기를 더해가는 지금!"
2005505-57 = "그럼 마지막으로 결승전의 상대 팀을 무대 위로 모시겠습니다!"
2005505-58 = "상대 팀은…… 최단기간 최상위 랭킹 진입의 전설을 써 내려간 듀오!"
2005505-59 = "<UZQueen & Throne>! 큰 박수로 맞이해주시죠!"
2005505-64 = "UZQueen……? 방금 분명 UZQueen이라고 했지?!"
2005505-65 = "역시 출전했군요! 차려입고 온 복장부터 고수의 풍모가 느껴져요!"
2005505-66 = "그런데…… 저건 대체 무슨 자세지?"
2005505-72 = "설마, 기묘한 목말 자세로 수많은 적을 처치하는 2인조 플레이어가 있다더니 바로 UZQueen이었나!"
2005505-73 = "UZQueen의 플레이를 직관할 기회…… 한순간도 놓치지 않겠어!"
2005505-74 = "흐에엥……! 선생님, 역시 사람들 앞에서 목말 포지션은 아닌 것 같아요……!"
2005505-75 = "부, 부끄러워서 평소보다 집중하기가 어려워서……"
2005505-76 = "게, 게임에 집중할 수가 없어요……"
2005505-77 = "[s]\"유즈.\""
2005505-78 = "네, 넷?!"
2005505-79 = "[s]\"지금 이 순간만큼은, <시뮬리온 퀘스트>의 세계가 현실이라고 생각해.\""
2005505-80 = "하, 하지만……"
2005505-81 = "게임 내의 세계가 현실이라면 저희는 지금 목숨을 건 위태로운 상황에서 칼을 겨누고 있는 셈인데…… 그렇게 생각하는 게 오히려 더 불안하지 않을까요?"
2005505-82 = "아무리 게임의 몰입이 중요하다고는 하지만……"
2005505-86 = "결국 우승을 차지하기 위해서는 UZQueen을 이겨야만 하는 건가……"
2005505-87 = "설마 저 기묘한 포지션의 고수가 UZQueen이었다니…… 이를 어쩌지?"
2005505-88 = "UZQueen이 상대라는 건 둘째 치고, 저 기묘한 목말 자세에 대한 공략법은 어느 커뮤니티에도 올라와 있지 않다고!"
2005505-89 = "걱정 마. 혹시라도 이럴 때를 대비해서 내가 필승법을 찾아왔으니까."
2005505-90 = "UZQueen이 아닌 왕좌 쪽…… 파트너는 평범한 플레이어니까, 그쪽을 먼저 쓰러트리면 우리에게도 승산이 있어!"
2005505-91 = "좋았어……!"
2005505-93 = "서, 선생님! 조심하세요!"
2005505-94 = "[ns]\"어라, 상대는 내 쪽……?\""
2005505-97 = "(이 게임이 현실이라면…… )"
2005505-98 = "(이 복장도, 이 주변의 시선도 전혀 부끄럽지 않아……)"
2005505-99 = "(오히려 지금 더 걱정해야 하는 건……)"
2005505-100 = "……선생님이 위험해!!"
2005505-105 = "어, 어떻게 된 거야……?"
2005505-106 = "순식간에 우리 두 사람 모두 약점을 꿰뚫렸다고……?"
2005505-110 = "맙소사! 순식간에 결판이 났습니다. <UZQueen & Throne>의 승리입니다!"
2005505-111 = "바, 방금 봤어? 왕좌가 공격당하기 직전에 UZQueen이 날렵하게 두 사람의 약점을 급습하는 모습을……!"
2005505-112 = "너, 너무 빨라서 안 보였어…… 저게 현실에서 가능한 기술이었다고?"
2005505-114 = "서, 선생님. 괜찮으세요……?"
2005505-115 = "[s]\"나는 괜찮아…….\""
2005505-119 = "[ns]\"그보다 방금 그 공격은 어떻게 한 거야?\""
2005505-120 = "저, 저도 잘 모르겠어요……"
2005505-121 = "이곳이 현실이고, 선생님이 위험하다고 생각하니 저도 모르게 손이 빨라져서……"
2005505-122 = "저도 모르는 사이에 상대의 약점을 찌르고 있었어요……"
2005505-123 = "[s]\"대단한 집중력이구나…….\""
2005505-124 = "그, 그래도 다행이네요. 이제 이것으로 <버추얼 보스>를 받을 수 있게 되었으니-"
2005505-131 = "UZQueen, 방금 그 기술 다시 한번 보여줄 수 있나요?"
2005505-132 = "……나, 나도 부탁해! 그런 기술을 직접 상대하는 건 처음이었어!"
2005505-133 = "괜찮다면 나를 직접 때려도 괜찮으니까-"
2005505-134 = "나, 나도 부탁해! 나도 다시 한번 맞아보고 싶어!"
2005505-135 = "저, 저도 때려주세요!"
2005505-136 = "저도 때려주세요, UZQueen!"
2005505-137 = "(어, 어쩐지 이상한 부탁이 되어가는 느낌이……)"
2005505-138 = "부탁이에요, UZQueen!"
2005505-139 = "UZQueen에게 맞을 수 있다면 돈을 내도 좋으니까……!"
2005505-140 = "그, 그건 곤란한데요……"
2005505-141 = "선생님, 도와주세요……!"
2005505-142 = "UZQueen! UZQueen!"
2005505-147 = "서, 선생님~!"
2005505-149 = "(이후, 인파에 둘러싸여 곤란해하는 유즈를 데리고 간신히 회장을 빠져나왔다…)"
