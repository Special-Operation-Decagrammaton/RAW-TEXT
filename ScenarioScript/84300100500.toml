[translation]
84300100500-7 = "이 쪽지는……."
84300100500-8 = "……<거래 부품 리스트>? 이런 게 대체 왜……."
84300100500-12 = "게다가 이 품목들……. 그다지 당당하게 말할 수 있는 물건들은 아니군요."
84300100500-13 = "암거래일까요……? 역시 말씀을 드려야겠어요."
84300100500-14 = "하지만 어디로 가는지를 모르면 말씀드리기도 애매하겠죠."
84300100500-15 = "저분들이 간 곳의 위치까지만 확인해 보도록 할까요. 당장 사라진 방향까지는 확인했으니."
84300100500-19 = "……아니죠, 지금의 저는 어디까지나 밀레니엄 엑스포의 참관인으로서 온 몸. 조금 마음에 걸리더라도 무시하도록 하죠."
84300100500-20 = "애초에 이곳은 트리니티도 아니고, 가이드분들께 상황을 알리는 것으로도 충분할 테니까요."
84300100500-21 = "괜한 움직임으로 문제에 끼어드는 건 나기사와 합의한 것과 다른……."
84300100500-22 = "……나기사와의 합의……라."
84300100500-23 = "나기사……"
84300100500-25 = "세이아 씨의 경우에는 예전과 달리 미리 예상하고 대비할 수도 없게 됐지요."
84300100500-26 = "솔직히 말씀드리자면, 지금의 세이아 씨는……."
84300100500-27 = "……제 입장에서 '보호 대상'입니다."
84300100500-30 = "하아……."
84300100500-31 = "하필 이런 때에, 하필이면 그 말이 떠오르다니."
84300100500-32 = "……곤란하네요."
84300100500-33 = "어쩔 수 없네요. 저도 꽤 감정적인 사람인가 봅니다."
84300100500-34 = "……장소까지만, 확인해 보도록 하죠."
