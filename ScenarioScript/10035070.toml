[translation]
10035070-1 = "제7화;메카 악어, 어디서 왔습니까?"
10035070-2 = "우왁! 저 녀석 불도 뿜잖아!"
10035070-3 = "단순한 악어가 아닌데?!"
10035070-4 = "금속질의 외피, 각종 무기 탑재, 빠른 동작 속도. 평범한 녀석이 아니다."
10035070-5 = "그럼, 이상의 판단 결과, <메탈 웨폰 스피드 크로커다일>로 임시 명명한다."
10035070-6 = "길어! 그냥 메카 악어라고 하면 되잖아?"
10035070-7 = "우리의 행동 목표는 시민들이 안전하게 대피할 때까지 메탈 웨……"
10035070-8 = "메카 악어의 눈길을 끄는 것."
10035070-9 = "무리해서 접근하거나 공격 범위에 들어가지 마라!"
10035070-11 = "국장님! 장갑이 두꺼워서 총알도 잘 통하지 않는데요!"
10035070-12 = "총알은 그냥 안 맞은 걸지도 몰라."
10035070-13 = "네?! 그럴 리가……!"
10035070-15 = "칫! 엎드리도록!"
10035070-22 = "앗! 쓰러뜨린 것 같은데요! 수류탄이 효과가 있었나 봐요!"
10035070-23 = "아냐, 그냥 잠깐 정신을 잃은 것뿐이야."
10035070-25 = "안내 말씀드립니다! 지금부터 실외 시설을 폐쇄하오니, 실외 시설에 계신 이용객 여러분께서는 실내 시설로 이동해 주시기 바랍니다!"
10035070-26 = "다시 한번 말씀드립니다! 지금부터—"
10035070-28 = "시, 실내는 안전한 거 맞지? 여기까지 따라오진 않겠지?"
10035070-29 = "밀지 말고 들어가!"
10035070-30 = "괜찮을 거야! 악어가 들어오기에는 문이 작으니까!"
10035070-33 = "마, 맙소사! 저게 뭐야! 진짜 악어잖아!"
10035070-34 = "사장님, 저건 진짜 악어가 아니라 메카 악어입니다."
10035070-35 = "누가 그걸 몰라!"
10035070-36 = "어디서 저런 물건이 튀어나온 거야! 게다가 왜 우리 파크에 있는 거냔 말이다!"
10035070-37 = "아까 수색 때는 아무것도 안 나왔잖아!"
10035070-41 = "윽! 이 망할 악어 자식!"
10035070-43 = "아까 말씀드렸던 괴물이 바로 저 녀석입니다!"
10035070-44 = "이제 우리 말을 믿겠지?"
10035070-48 = "미, 미, 미……."
10035070-50 = "미?"
10035070-52 = "미, 미안합니다!"
10035070-53 = "조금 전에는 아무리 생각해도 믿을 수가 없어서!"
10035070-54 = "상식적으로 생각해 보면 워터파크에 악어가 나오리라고는 생각할 수 없잖아요?!"
10035070-55 = "그것도 메카 악어가!"
10035070-56 = "지금은 잘잘못을 따질 때가 아닙니다. 저렇게 괴물이 설치도록 놔둘 수는 없으니까요."
10035070-57 = "우리가 앞장설 테니 엄호를 부탁해도 되겠습니까?"
10035070-58 = "아, 알겠습니다!"
10035070-59 = "여, 역시 발키리 경찰학교! 믿음직스럽네요!"
10035070-61 = "(아까는 실컷 무시해 놓고…….)"
