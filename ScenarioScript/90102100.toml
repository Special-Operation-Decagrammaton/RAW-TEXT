[translation]
90102100-1 = "제10화;불릿 트레인"
90102100-4 = "문 양옆에 돌입 대형."
90102100-5 = "진입 후 양쪽으로 갈라져서 사각을 잡을 것."
90102100-6 = "진입한다. 하나, 둘, 셋……!"
90102100-11 = "좌측 클리어."
90102100-12 = "우측 클리어."
90102100-13 = "후방 이상 없음. #n7호차 확보."
90102100-14 = "계속해서 다음 칸으로 이동한다."
90102100-19 = "……이상하네."
90102100-20 = "……그러게."
90102100-22 = "[ns] \"뭔가 신경 쓰이는 점이라도 있어?\""
90102100-23 = "아, 그게 기분 탓인지는 모르겠지만……"
90102100-24 = "선생님. 들어오기 전에 보았던 이 열차, 대략 객차 8칸으로 구성된 8량 열차이지 않았어?"
90102100-25 = "[s] \"응. 그리 길어 보이지는 않았는데.\""
90102100-26 = "그런데 벌써 8번째 칸인데…… 여전히 운전실에 도달할 기미가 보이지 않아."
90102100-27 = "게다가 밖을 봐. 어두컴컴해서 어딜 지나고 있는지도 알 수가 없으니……"
90102100-28 = "뭔가 쳇바퀴처럼 원형으로 연결된 객차를 하염없이 빙글빙글 돌고 있는 기분이야."
90102100-29 = "[s1] \"확실히 그렇네…….\"\n[s2] \"설마 열차 내부에서 길을 잃을 줄이야……\""
90102100-35 = "전원 정지. 현 위치 고정."
90102100-36 = "잠깐 브리핑 후 작전을 재개하겠다."
90102100-39 = "……이대로는 끝이 없을 것 같군요."
90102100-40 = "현 상황에서 다음 차량으로 진입하는 건 무의미한 일이라고 판단됩니다만…… 선생님께서는 어떻게 생각하시는지요."
90102100-41 = "[s3] \"내 생각도 같아.\"\n[s4] \"뭔가 다른 출구를 찾아야 할 것 같은데……\""
90102100-44 = "하지만 이번에 발생한 로어는 과거로 돌아가고 싶다는 학생들의 소망 때문에 생긴 거잖아?"
90102100-45 = "열차 내에서 길을 잃었다는 말은 없었는데, 어째서 이런 형태의 로어가 태어난 거지?"
90102100-46 = "시간을 실제로 과거로 되돌릴 수는 없으니, 대상을 과거의 풍경 속에 무한히 가두려는 게 아닐까?"
90102100-47 = "어쩌면 지난 번 <드럼통 게> 처럼 열차에 대한 다른 소문이나 인식이 섞여 들어갔을지도 모르겠어."
90102100-48 = "다들 최근에 들은 열차와 관련된 괴담이나 소문 같은 거 있어?"
90102100-49 = "아, 얼마 전에 리모델링 공사를 시작한 신고쿠 역 말이야. 전에 그 역에서 이상한 소문을 들었는데……"
90102100-50 = "누가 출구 표지판에 장난을 쳤는지, 복잡한 내부 구조 때문에 착각한 사람이 생긴 건지는 모르겠지만…… 4번 출구를 찾아 나가려고 하면 역 내부를 하염없이 돌게 된대."
90102100-51 = "지금 우리 상황과 비슷하긴 한데…… 여긴 역이 아니라 열차잖아?"
90102100-52 = "맞아. 게다가 출구를 헷갈리는 건 다른 역에서도 왕왕 있는 일이라고."
90102100-53 = "다른 도시 괴담이라면 또 뭐가 있을까?"
90102100-54 = "으음…… 이것도 얼마 전에 들은 이야기인데."
90102100-55 = "통학 시간대 열차는 언제나 사람이 꽉꽉 들어차 있잖아? 그런데 가끔 딱 한 칸만 이상하게 비어 있는 경우가 있대."
90102100-56 = "그럴 때는 절대로 그 칸에 타서는 안 된다고 해."
90102100-57 = "어째서?"
90102100-58 = "글쎄. 이유는 듣지 못했는데…… 괴담이라는 게 대체로 그렇잖아? 게다가 모두가 의도적으로 피하는 공간에 굳이 들어가 봤자 좋을 게 없지."
90102100-60 = "나는 처음 듣는 괴담인데…… 게다가 이 열차는 탈 때부터 다른 칸에도 사람이 없는 걸 확인했으니, 아마 그 소문과는 관련이 없을 거야."
90102100-61 = "그 밖에 다른 소문이라면……"
90102100-62 = "으음…… 안 되겠어. #n무얼 생각해도 하이랜더 학생들에게 얻어터졌다는 경험담이, 어지간한 괴담보다 더 강렬하게 기억에 남는 것 같아."
90102100-63 = "나도 마찬가지야."
90102100-64 = "그러고 보니 이 열차에는 승무원이 없는 건가? 승무원이 있다면 심문이라도 할 수 있을 텐데."
90102100-65 = "[s] \"그 때의 SRT식 심문법 말이지……\""
90102100-70 = "[ns] \"일단 지금은 문제가 없으니, 나오지 않는 게 아닐까?\""
90102100-71 = "문제가 없으면 오지 않는다……"
90102100-72 = "네. 좋은 생각인 것 같습니다. 역시 선생님이시군요."
90102100-73 = "[s] \"방금 내가 뭔가 말했어?\""
90102100-74 = "말씀대로입니다."
90102100-75 = "아무리 가도 승무원이 보이지 않는다면, 승무원을 이쪽으로 불러내면 되는 것이지요."
90102100-76 = "상대를 유리한 지형으로 유인해 내는 것은 특수 전술의 기본이니까요."
90102100-80 = "전원, 방어 태세로. 후방 출입문 고정 후, 엄폐물 설치해."
90102100-81 = "FOX 3, 전방 경계 유지. FOX 2와 FOX 4는 후미에 붙어. 간격 유지하고."
90102100-82 = "확인."
90102100-83 = "사선 겹치지 않게 서서 전방 주시해. 바로 신호를 보내겠다."
90102100-84 = "……비상정지스위치, ON."
90102100-90 = "<승객 여러분께 안내 말씀 드립니다. 현재 객실 내 비상정지 스위치의 작동을 확인하였습니다.>"
90102100-91 = "<승객 여러분께서는 이동을 멈추고, 가까운 좌석이나 손잡이를 잡아 안전에 유의해 주시기 바랍니다.>"
90102100-92 = "<현재 본 열차의 승무원이 상황 확인을 위해, 비상정지 스위치가 작동한 차량으로 이동 중에 있습니다.>"
90102100-93 = "<비상 상황이 아닌데도 임의로 비상정지 장치를 작동시킨 경우, 철도안전법에 따라 '회 뜨기, 도려내기, 다지기' 등의 조치를 받을 수 있습니다.>"
90102100-94 = "<승객 여러분의 안전한 이용을 위해, 승무원의 조사에 적극 협조 부탁드립니다.>"
90102100-95 = "……회 뜨기? 저게 무슨 소리야?"
90102100-96 = "도시 괴담의 디테일에 너무 진지하게 따지고 들지 마. 중요한 건 반응이 있었다는 거니까."
90102100-97 = "……온다."
90102100-104 = "뭐지? 하이랜더 학생은 아닌데."
90102100-105 = "……짐승? 아니, 뭔가 살아있는 생명체라기엔 비정상적으로 거대하고 움직임이 이상해."
90102100-109 = "관절이 움직일 때마다 톱니가 맞물리는 소리가 나고, 기름 냄새가 나는 것이……"
90102100-110 = "마치 유원지에서나 마주할 법한 애니매트로닉스 같아."
90102100-117 = "………후우."
90102100-118 = "FOX 1, 괜찮아?"
90102100-119 = "괜찮아. 잠깐 구역질 나는 기억을 떠올린 것 뿐이니까."
90102100-121 = "[ns] \"유키노, 괜찮겠어?\""
90102100-122 = "저는 괜찮습니다."
90102100-123 = "아까도 말씀드렸지만…… 선생님, 제 뒤에서 절대로 떨어지시면 안 됩니다."
90102100-128 = "전원. 상대가 킬 존에 들어설 때까지 절대로 먼저 움직이지 마."
90102100-134 = "……셋, 둘, 하나."
90102100-138 = "사격 개시."
