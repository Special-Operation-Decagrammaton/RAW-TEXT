90102100-19 = "1;오토기;01;……이상하네."
90102100-20 = "5;쿠루미;00;……그러게."
90102100-21 = "1;오토기;01\n5;쿠루미;00\n#1;h\n#5;h"
90102100-22 = "[ns] \"뭔가 신경 쓰이는 점이라도 있어?\""
90102100-23 = "1;오토기;02;아, 그게 기분 탓인지는 모르겠지만……\n#1;m3\n#5;dr\n#1;em;[반응]"
90102100-24 = "1;오토기;05;선생님. 들어오기 전에 보았던 이 열차, 대략 객차 8칸으로 구성된 8량 열차이지 않았어?"
90102100-25 = "[s] \"응. 그리 길어 보이지는 않았는데.\""
90102100-26 = "1;오토기;05;그런데 벌써 8번째 칸인데…… 여전히 운전실에 도달할 기미가 보이지 않아."
90102100-27 = "1;오토기;08;게다가 밖을 봐. 어두컴컴해서 어딜 지나고 있는지도 알 수가 없으니……\n#1;em;[땀]"
90102100-28 = "1;오토기;10;뭔가 쳇바퀴처럼 원형으로 연결된 객차를 하염없이 빙글빙글 돌고 있는 기분이야."
90102100-29 = "[s1] \"확실히 그렇네…….\"\n[s2] \"설마 열차 내부에서 길을 잃을 줄이야……\""
90102100-32 = "#st;[0,0];instant;1;\n#all;hide"
90102100-34 = "3;유키노;01\n#3;em;[...]\n#wait;2500"
90102100-35 = "3;유키노;99;전원 정지. 현 위치 고정."
90102100-36 = "3;유키노;02;잠깐 브리핑 후 작전을 재개하겠다."
90102100-37 = "3;유키노;01"
90102100-39 = "3;유키노;01;……이대로는 끝이 없을 것 같군요."
90102100-40 = "3;유키노;02;현 상황에서 다음 차량으로 진입하는 건 무의미한 일이라고 판단됩니다만…… 선생님께서는 어떻게 생각하시는지요."
90102100-41 = "[s3] \"내 생각도 같아.\"\n[s4] \"뭔가 다른 출구를 찾아야 할 것 같은데……\""
90102100-44 = "3;쿠루미;02;하지만 이번에 발생한 로어는 과거로 돌아가고 싶다는 학생들의 소망 때문에 생긴 거잖아?\n#3;em;[?]"
90102100-45 = "3;쿠루미;06;열차 내에서 길을 잃었다는 말은 없었는데, 어째서 이런 형태의 로어가 태어난 거지?"
90102100-46 = "3;니코;02;시간을 실제로 과거로 되돌릴 수는 없으니, 대상을 과거의 풍경 속에 무한히 가두려는 게 아닐까?\n#3;em;[반응]"
90102100-47 = "3;니코;05;어쩌면 지난 번 <드럼통 게> 처럼 열차에 대한 다른 소문이나 인식이 섞여 들어갔을지도 모르겠어."
90102100-48 = "3;니코;02;다들 최근에 들은 열차와 관련된 괴담이나 소문 같은 거 있어?"
90102100-49 = "3;오토기;02;아, 얼마 전에 리모델링 공사를 시작한 신고쿠 역 말이야. 전에 그 역에서 이상한 소문을 들었는데……"
90102100-50 = "3;오토기;01;누가 출구 표지판에 장난을 쳤는지, 복잡한 내부 구조 때문에 착각한 사람이 생긴 건지는 모르겠지만…… 4번 출구를 찾아 나가려고 하면 역 내부를 하염없이 돌게 된대."
90102100-51 = "1;니코;12;지금 우리 상황과 비슷하긴 한데…… 여긴 역이 아니라 열차잖아?\n#1;em;[땀]\n#1;a"
90102100-52 = "5;쿠루미;02;맞아. 게다가 출구를 헷갈리는 건 다른 역에서도 왕왕 있는 일이라고.\n#5;a"
90102100-53 = "5;쿠루미;99;다른 도시 괴담이라면 또 뭐가 있을까?"
90102100-54 = "3;오토기;09;으음…… 이것도 얼마 전에 들은 이야기인데.\n#5;dr\n#1;dl\n#3;stiff"
90102100-55 = "3;오토기;02;통학 시간대 열차는 언제나 사람이 꽉꽉 들어차 있잖아? 그런데 가끔 딱 한 칸만 이상하게 비어 있는 경우가 있대."
90102100-56 = "3;오토기;01;그럴 때는 절대로 그 칸에 타서는 안 된다고 해."
90102100-57 = "5;쿠루미;02;어째서?\n#5;al\n#3;m1\n#5;em;[?]"
90102100-58 = "3;오토기;08;글쎄. 이유는 듣지 못했는데…… 괴담이라는 게 대체로 그렇잖아? 게다가 모두가 의도적으로 피하는 공간에 굳이 들어가 봤자 좋을 게 없지.\n#3;em;[한숨]"
90102100-60 = "3;니코;02;나는 처음 듣는 괴담인데…… 게다가 이 열차는 탈 때부터 다른 칸에도 사람이 없는 걸 확인했으니, 아마 그 소문과는 관련이 없을 거야."
90102100-61 = "1;오토기;99;그 밖에 다른 소문이라면……\n#1;a"
90102100-62 = "1;오토기;06;으음…… 안 되겠어. #n무얼 생각해도 하이랜더 학생들에게 얻어터졌다는 경험담이, 어지간한 괴담보다 더 강렬하게 기억에 남는 것 같아.\n#1;em;[속상함]"
90102100-63 = "5;쿠루미;12;나도 마찬가지야.\n#5;a"
90102100-64 = "3;니코;12;그러고 보니 이 열차에는 승무원이 없는 건가? 승무원이 있다면 심문이라도 할 수 있을 텐데."
90102100-65 = "[s] \"그 때의 SRT식 심문법 말이지……\""
90102100-66 = "1;오토기;06\n5;쿠루미;12\n3;니코;12\n#1;h\n#3;h\n#5;h"
90102100-67 = "#st;[0,0];instant;1;"
90102100-70 = "[ns] \"일단 지금은 문제가 없으니, 나오지 않는 게 아닐까?\""
90102100-71 = "3;유키노;99;문제가 없으면 오지 않는다……\n#1;hide\n#5;hide\n#3;em;[...]"
90102100-72 = "3;유키노;01;네. 좋은 생각인 것 같습니다. 역시 선생님이시군요."
90102100-73 = "[s] \"방금 내가 뭔가 말했어?\""
90102100-74 = "3;유키노;02;말씀대로입니다."
90102100-75 = "3;유키노;05;아무리 가도 승무원이 보이지 않는다면, 승무원을 이쪽으로 불러내면 되는 것이지요."
90102100-76 = "3;유키노;01;상대를 유리한 지형으로 유인해 내는 것은 특수 전술의 기본이니까요."
90102100-77 = "#st;[0,0];instant;1;"
90102100-79 = "3;유키노;01\n#3;greeting\n#wait;1500"
90102100-80 = "3;유키노;05;전원, 방어 태세로. 후방 출입문 고정 후, 엄폐물 설치해.\n#3;closeup"
90102100-81 = "3;유키노;05;FOX 3, 전방 경계 유지. FOX 2와 FOX 4는 후미에 붙어. 간격 유지하고.\n#3;closeup"
90102100-82 = "3;유키노;05\n#na;쿠루미;확인.\n#3;closeup"
90102100-83 = "3;유키노;02;사선 겹치지 않게 서서 전방 주시해. 바로 신호를 보내겠다.\n#3;closeup"
90102100-84 = "3;유키노;02;……비상정지스위치, ON.\n#3;closeup"
90102100-85 = "#st;[0,0];instant;1;\n#all;hide"
90102100-90 = "#na;안내 음성;<승객 여러분께 안내 말씀 드립니다. 현재 객실 내 비상정지 스위치의 작동을 확인하였습니다.>"
90102100-91 = "#na;안내 음성;<승객 여러분께서는 이동을 멈추고, 가까운 좌석이나 손잡이를 잡아 안전에 유의해 주시기 바랍니다.>"
90102100-92 = "#na;안내 음성;<현재 본 열차의 승무원이 상황 확인을 위해, 비상정지 스위치가 작동한 차량으로 이동 중에 있습니다.>"
90102100-93 = "#na;안내 음성;<비상 상황이 아닌데도 임의로 비상정지 장치를 작동시킨 경우, 철도안전법에 따라 '회 뜨기, 도려내기, 다지기' 등의 조치를 받을 수 있습니다.>"
90102100-94 = "#na;안내 음성;<승객 여러분의 안전한 이용을 위해, 승무원의 조사에 적극 협조 부탁드립니다.>"
90102100-95 = "3;쿠루미;06;……회 뜨기? 저게 무슨 소리야?\n#3;a\n#3;em;[땀]"
90102100-96 = "3;오토기;02;도시 괴담의 디테일에 너무 진지하게 따지고 들지 마. 중요한 건 반응이 있었다는 거니까."
90102100-97 = "3;유키노;08;……온다."
