90102100-104 = "#na;오토기;뭐지? 하이랜더 학생은 아닌데."
90102100-105 = "#na;쿠루미;……짐승? 아니, 뭔가 살아있는 생명체라기엔 비정상적으로 거대하고 움직임이 이상해."
90102100-109 = "#na;니코;관절이 움직일 때마다 톱니가 맞물리는 소리가 나고, 기름 냄새가 나는 것이……"
