[translation]
2002605-1 = "둘 사이의 비계"
2002605-2 = "붉은겨울 학원, 용역부 인력 사무소 앞"
2002605-8 = "어라? 이 어른은…… 샬레의 선생님이잖아?"
2002605-9 = "이곳 인력 사무소에는 무슨 일이야?"
2002605-10 = "아, 혹시 용역 현장을 견학하러 온 거야? 오늘의 작업이라면 갑작스러운 한파 때문에 취소되었는데……"
2002605-11 = "[ns] \"아, 그 이야기는 미노리로부터 들었어.\""
2002605-13 = "[ns1] \"여기 온 이유는 다름이 아니라……\"\n[ns2] \"모처럼이니 쉬는 학생들에게 간식이라도 가져다줄까 싶어서.\""
2002605-19 = "우와, 이거 엔젤 24의 센트럴 지점에서만 판매하는 한정 초콜릿이잖아?"
2002605-20 = "진한 커스터드푸딩도 있어! 사무국에서 보급해 주는 푸딩과는 농도가 다른 걸……"
2002605-21 = "잘 먹을게, 선생님!"
2002605-22 = "[ns] \"양은 충분하니까 모두 사이좋게 나눠 먹어.\""
2002605-24 = "[ns] \"그나저나 미노리는 어디에 있어?\""
2002605-25 = "미노리 부장? 그러고 보니 갑작스럽게 일이 취소되면 미노리 부장은……"
2002605-26 = "……언제나 현장에 다시 갔었지. 현장에 두고 온 자재나 공구의 상태가 신경 쓰인다면서."
2002605-27 = "미노리 부장도 참 성실하다니까~"
2002605-28 = "그래도 오늘처럼 추운 날에도 현장에 갔을까? 건물 밖에만 나와 있어도 손이 아릴 것 같은 추위인데……"
2002605-29 = "응, 동감이야. 오늘 같은 날에는 아무리 미노리 부장이라 하더라도 현장에 가지는 않았겠지. 대신 도서관에 가지 않았으려나."
2002605-30 = "[s] \"나는 먼저 돌아갈게.\""
2002605-31 = "응? 벌써 돌아가게?"
2002605-32 = "오늘은 간식 가져다줘서 고마워, 선생님. 다음에는 현장에서 보자~"
2002605-33 = "붉은겨울 학원은 넓으니까, 괜히 길 없는 장소로 돌아가지 말고—"
2002605-37 = "[ns] 인력 사무소를 떠나 현장으로 향한다."
2002605-41 = "[ns3] \"미노리, 거기 있어?\"\n[ns4] \"미노링~♪\""
2002605-46 = "누가 내 이름을 그런 식으로 부르는 거야……?"
2002605-51 = "……응? [USERNAME] 선생? 어째서 이곳에……?"
2002605-52 = "분명히 모모톡으로 오늘 작업은 취소되었다고 말했을 텐데…… 날짜를 착각한 거야?"
2002605-53 = "[s5] \"부원들에게 미노리가 이곳에 있을지도 모른다는 이야기를 들어서.\"\n[s6] \"격려차 간식을 조금 가지고 왔어.\""
2002605-56 = "간식이라니, 계약대로 일을 한 것뿐인데…… 이렇게 격려를 받으니 뭔가 쑥스럽네."
2002605-57 = "그러고 보면 붉은겨울 사무국도 발주사도 이렇게 따로 간식을 보낸 적은 없었는데……"
2002605-58 = "역시 우리 노동자들을 챙겨주는 건 선생밖에 없다니까."
2002605-59 = "[s] \"미노리는 현장에서 무얼 하고 있었어?\""
2002605-60 = "나? 나는 현장 곳곳을 산책하면서 가볍게 안전 점검을 하고 있었어."
2002605-61 = "갑작스럽게 작업이 취소되었는지라, 정리되지 않은 공구나 방수포 따위가 곳곳에 남아있거든. 강풍에 날아가지 않도록 치워 둬야지."
2002605-62 = "그리고 모처럼 생긴 여유를 만끽하기도 하고……"
2002605-63 = "참, 그러고 보니 선생에게 보여주고 싶은 풍경이 있어."
2002605-67 = "잠깐 이리로, 따라와 줄래?"
2002605-72 = "[wa:200]― [log=미노리]후후, [wa:1500]오늘은 [wa:200]날이 추워서 그런지 [wa:1000]멀리까지 [wa:400]잘 보이네.[/log]"
2002605-74 = "[wa:1000]― [log=미노리]자, [wa:900]선생도 [wa:500]거기 있지 말고 [wa:1100]이 위에 올라와서 봐 봐.[/log]"
2002605-77 = "[ns] \"여기…… 두 사람이 같이 올라가도 괜찮으려나?\""
2002605-78 = "[wa:600]― [log=미노리]걱정하지 않아도 [wa:400]괜찮아.[/log]"
2002605-80 = "[wa:500]― [log=미노리]코끼리가 [wa:200]올라가도 [wa:400]괜찮을 만큼 [wa:1400]튼튼하게 [wa:400]지었으니까.[/log]"
2002605-83 = "[wa:1400]― [log=미노리]그러고 보니 [wa:500]이 비계,[/log]"
2002605-85 = "[wa:1000]― [log=미노리]어쩐지 우리 [wa:1000]용역부를 [wa:600]닮은 것 같네.[/log]"
2002605-88 = "[wa:400]― [log=미노리]건설에 [wa:300]빠트릴 수 없는 [wa:300]중요한 [wa:300]자재지만,[/log]"
2002605-91 = "[wa:500]― [log=미노리]작업이 [wa:300]끝나면[/log]"
2002605-92 = "[wa:1500]― [log=미노리]처음부터 존재하지 않았던 것처럼 [wa:2200]사라져야 하니……[/log]"
2002605-95 = "[wa:1500]― [log=미노리]그래서일까.[/log]"
2002605-98 = "[wa:300]― [log=미노리]현장의 [wa:200]그 어느 풍경보다[/log]"
2002605-99 = "[wa:1700]― [log=미노리]발판 위에서 [wa:300]내려다보는 이 경치를 [wa:2200]나는 제일 좋아해.[/log]"
2002605-102 = "[wa:500]― [log=미노리]건물의 [wa:400]가장자리에서 [wa:1000]한 걸음 더 나아가,[/log]"
2002605-103 = "[wa:2800]― [log=미노리]누군가가 [wa:400]이 외벽 밖에서 [wa:1900]분주히 땀을 흘렸다는 [wa:3000]흔적의 시선.[/log]"
2002605-106 = "[wa:1300]― [log=미노리]……완성된 건물에서는 [wa:1100]느낄 수 없는 [wa:1000]이 시선을,[/log]"
2002605-108 = "[wa:1200]― [log=미노리]나는 [wa:1500]선생과 공유하고 싶었어.[/log]"
2002605-111 = "후후…… 그래서 어땠어, 선생? 비계 위에서 내려다보는 현장의 풍경은?"
2002605-112 = "[s7] \"예쁘긴 했지만 조금……\"\n[s8] \"높이가 무서워서 집중하기 어려웠어……\""
2002605-115 = "그렇게 높은 위치는 아니었던 것 같은데……"
2002605-116 = "……그러고 보니 그런 이야기를 들은 적이 있지. 인간은 높은 고층 빌딩보다 오히려 현실적인 거리를 체감할 수 있는 11m의 높이에서 가장 큰 공포를 느낀다고……"
2002605-117 = "그럼 아예 공포를 느낄 수 없도록 높은 위치에서 풍경을 바라보면 되는 게 아닐까?"
2002605-118 = "그럼 이번에는 옥상으로 올라가자, 선생!"
2002605-119 = "옥상이라면 선생이 공포를 느끼지 않고 현장의 풍경을 느긋하게 즐길 수 있을 테니까!"
2002605-121 = "(이후 더 높은 비계 위로 끌고 가려는 미노리를 말리느라 한동안 애를 먹었다.)"
