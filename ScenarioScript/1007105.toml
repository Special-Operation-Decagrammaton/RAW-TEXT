[translation]
1007105-1 = "SRT, 탐험합니다."
1007105-4 = "아, 선생님. 오셨군요."
1007105-5 = "[s1] \"생각보다 빨리 왔네, 미야코.\"\n[s2] \"기다리고 있었던 거야?\""
1007105-8 = "아, 그게……"
1007105-9 = "그 불가사의한 섬에 직접 가 볼 수 있다고 하니 기대가 되어서, 예정 시간보다 조금 더 일찍 서두르고 말았네요."
1007105-10 = "SRT의 소대장 되는 사람으로서, 예정된 집결 시각도 맞추지 못하다니…… 불찰이군요."
1007105-11 = "[s3] \"무슨 기분인지 이해할 것 같아.\"\n[s4] \"소풍날은 평소보다 일찍 학교에 가고 싶어지잖아.\""
1007105-16 = "후훗…… 그렇네요."
1007105-17 = "그보다 정말 주민 여러분께 들은 대로 썰물 때가 되니 바닷물이 거짓말처럼 모두 빠져버렸네요."
1007105-18 = "이렇게 거대한 해안을 하루에 두 차례나 마르게 했다가, 또 바다로 덮어버린다니……"
1007105-19 = "강이나 바다가 움직이는 모습을 보고 있노라면, 저희 SRT가 다루는 특수부대의 힘도 거대한 자연 앞에서는 무력하게 느껴지네요."
1007105-23 = "……감상이 조금 길었네요."
1007105-27 = "바닷길이 열려 있는 시간은 길지 않으니 그럼 서둘러 이동해 볼까요?"
1007105-28 = "선생님, 길 위에 진흙이 쌓여 미끈거리니 넘어지지 않게 주의하세요."
1007105-32 = "(미야코와 함께 물이 빠진 갯바닥 위를 걸어 섬으로 향했다.)"
1007105-34 = "와아…… 정말 소문처럼 아름다운 섬이네요."
1007105-35 = "사람의 손을 거의 타지 않아서 그런지, 풀도 나무도 울창하게 피어 있네요."
1007105-36 = "이런 외진 섬에 이렇게나 아름다운 절경이 숨어있었을 줄이야……"
1007105-37 = "아니, 오히려 알려진 관광지가 아니었기에 이 섬은 자연 그대로의 풍경을 고스란히 간직할 수 있었겠지요."
1007105-41 = "선생님, 괜찮으시다면 저기 해안 절벽 위에 함께 가보지 않으시겠어요?"
1007105-42 = "저 위에는 어떤 꽃이 피어 있을지 직접 확인해 보고 싶어요."
1007105-43 = "[s] \"좋아, 다녀오자.\""
1007105-44 = "후후…… 모처럼의 나들이라 그런지 기분이 고양되네요."
1007105-49 = "(하지만 잠시 후. 꽃을 구경하고 다시 해변으로 돌아오니……)"
1007105-56 = "어, 어라……?"
1007105-57 = "[s] \"바닷길이 잠겨버리고 말았네……\""
1007105-58 = "꽃을 구경하느라 시간 가는 줄 몰라서…… 밀물 때가 다가온다는 사실을 잊고 있었네요."
1007105-59 = "이래서야 육지로 걸어서 돌아갈 수는 없겠어요."
1007105-60 = "죄송합니다, 선생님. 제가 너무 어리광을 부리는 바람에……"
1007105-61 = "[s5] \"괜찮아, 신경 쓰지 마.\"\n[s6] \"미야코의 잘못이 아닌 걸.\""
1007105-64 = "하지만 금방 마을로 돌아갈 거라 생각해서 여분의 배터리도 챙겨오지 않았는데……"
1007105-65 = "다음 썰물 때까지 기다리려면 10시간은 걸릴 텐데. 이를 어쩌죠?"
1007105-66 = "[s] \"어차피 오늘은 특별한 일정도 없었으니……\""
1007105-68 = "[ns] \"모처럼의 휴식이라 생각하고 느긋하게 기다리자.\""
1007105-70 = "………네!"
1007105-73 = "(약 한 시간 뒤……)"
1007105-76 = "(……선생님께서는 느긋하게 기다리자고 하셨지만, 무작정 물 때를 기다리고 있으려니 역시 조금은 초조하네.)"
1007105-77 = "(섬의 풍경도 이만하면 충분히 둘러보았고……)"
1007105-78 = "(무언가 더 재미있는 화제라도 꺼내지 않으면……)"
1007105-83 = "……어라? 방금 풀숲에서 기척이……"
1007105-87 = "이 섬에 야생 동물이라도 있는 걸까요?"
1007105-95 = "이건……"
1007105-96 = "[ns] \"……토끼네.\""
1007105-97 = "토끼……네요."
1007105-105 = "그것도 한 마리가 아니라 여러 마리…… 아니, 족히 수십 마리는 되는 것 같네요."
1007105-109 = "후훗, 귀여워라. 사람을 무서워하는 것처럼 보이지는 않네요."
1007105-110 = "하지만 어째서 이런 외딴섬에 토끼 무리가……?"
1007105-111 = "[s] \"육지에서 헤엄을 쳐서 온 게 아닐까?\""
1007105-112 = "아뇨, 토끼는 물을 무서워하거든요. 바다를 헤엄쳐서 건너온 건 아닐 거예요."
1007105-113 = "하지만 원래부터 토끼가 살았다고 하기에는 너무 작은 섬이고, 누군가 일부러 풀어 놓을 만한 이유도 없고……"
1007105-117 = "굳이 이유를 하나 떠올려 보자면……"
1007105-118 = "……길을 잃은 게 아닐까요."
1007105-119 = "[s] \"길을 잃었다고?\""
1007105-120 = "네. 저희가 온 것처럼 바닷길이 열렸을 때 우연히 길을 잃은 토끼가 섬을 방문했다가 빠져나가지 못하고 이곳에 눌러살게 된 걸 거예요."
1007105-121 = "[s] \"하지만 그렇다고 하기에는 수가 너무 많은데.\""
1007105-122 = "그건 분명……"
1007105-123 = "……처음에 섬을 방문한 토끼는 한 마리가 아닌, 짝을 이룬 한 쌍의 토끼였을 거예요."
1007105-124 = "이 섬에는 천적도 없고, 먹을 것도 풍족하니. 이곳에 터를 잡고 새끼를 낳아 계속해서 그 수를 불려 온 것이겠지요."
1007105-125 = "처음에 도착했을 때는 아무도 살지 않는 외로운 섬이었겠지만…… 그 한 쌍의 토끼가 열심히 노력해 준 덕분에 지금은 많은 수의 토끼가 살아가는 낙원이 되었네요."
1007105-131 = "낯선 곳에서도 낙원을 완성한 그 한 쌍의 토끼처럼……"
1007105-132 = "저도 짝이 있다면 아무리 낯선 곳이라도 두렵지 않을 것 같네요."
1007105-134 = "(이후, 바닷길이 열릴 때까지 미야코와 함께 토끼를 돌보며 즐거운 시간을 보냈다.)"
