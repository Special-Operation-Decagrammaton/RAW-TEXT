[translation]
2003903-1 = "내가 나비인지. 나비가 나인지."
2003903-2 = "샬레 오피스"
2003903-4 = "……하여, 다들 엄청나게 소란이었지 뭔가."
2003903-5 = "현룡문의 문주가 섣불리 외부에 협력의 손길을 보내서는 안 된다느니, 그래서는 머잖아 영이 서지 않게 될 것이라느니……."
2003903-6 = "나는 단지 땡땡이를 치고 싶은 것일 뿐인데 말이다."
2003903-7 = "[s] \"그런 거였어?!\""
2003903-8 = "후후. 농담이다."
2003903-9 = "[s] \"역시 그렇지……?\""
2003903-10 = "허나 농담은 대개 그 안에 일말의 진실을 품고 있는 법이지."
2003903-11 = "[s] \"어느 쪽이야?!\""
2003903-12 = "후후. 그것을 짐작해 보는 것도, 나름의 여흥이지 않겠는가."
2003903-13 = "그러면 본 작업으로 들어가도록 하지."
2003903-14 = "나로서도 현룡문 이외의 업무를 다루는 것은 처음이니, 기대가 되는구나."
2003903-15 = "그 전에, 잠시……."
2003903-21 = "[ns] \"이건 뭐야?\""
2003903-22 = "음. 심신의 안정과 치유에 도움이 되는 약향(藥香)이라는 것 같다."
2003903-23 = "샬레의 당번 근무를 나간다는 말에, 연단방에서 비밀리에 준비해 준 것이지."
2003903-24 = "자, 그러면 시작하도록 하자. 시간이란 아껴 쓸수록 좋은 것이 아니겠는가."
2003903-26 = "(그렇게, 키사키와 함께 하는 샬레 업무가 시작되었다…….)"
2003903-28 = "흐음……. 구도심지의 버려진 건물에, 챌린지 영상이나 개인 방송 등이 유행하기 시작하여."
2003903-29 = "결과적으로는 해당 지역에 살고 있던 시민들이, 소음 및 치안의 문제로 불안감을 표하고 있으므로."
2003903-30 = "이에 연방수사부 샬레의 의견서 등을 비롯한 추가 협조를 요청한다……?"
2003903-31 = "[s] \"키사키라면 어떻게 할 거야?\""
2003903-32 = "명확한 것이다. 결국 문제의 큰 원인 중 하나는 버려진 건물 그 자체라고 할 수 있을 것이니."
2003903-34 = "현룡문의 힘을 빌려, 그 건물을 기반채로 무너뜨려 없던 것으로 한다면–"
2003903-35 = "[s] \"그건 좀 과격한 것 같은데?!\""
2003903-37 = "……그러한가? 산해경에서는 이 정도가 보통이거늘."
2003903-38 = "여기에서는 조금 더 주위 상황을 고려해야 한다고?"
2003903-39 = "흐음…… 허나 그 정도로 강력한 추진력이 없으면, 그런 문제는 근본적으로 해결되지 않을 터인데."
2003903-41 = "최신 총기와 탄약이 보급되지 않는 것에 불만을 품은 학생들이, 학원 규모의 단체 시위를 일으키고 있다……?"
2003903-42 = "두말할 필요도 없는 것이겠구나. 키보토스에서 총기류의 원활한 공급과 정비는, 의식주만큼의 중요성을 가진 것."
2003903-43 = "[s] (그런…… 거였어?!)"
2003903-44 = "학생들에게는 응당 시위를 일으킬 권리가 있고, 문제를 일으킨 자들에게는 지탄을 감내해야 할 의무가 있다."
2003903-45 = "멀리 조사해 볼 것까지도 없다. 자금의 흐름을 보아하니, 공급 업체 측에서 고의로 장부를 누락한 것이겠지."
2003903-46 = "당장 현룡문의 방식으로 관련자들에게 따끔한 물리력의 심판을–"
2003903-47 = "[s] \"물리력을 자의적으로 사용하면 안 돼–!\""
2003903-48 = "……그러한가? 산해경에서는 하고자 한다면 당일 집행도 가능한 일인데……."
2003903-49 = "후우. 물론 법률만으로 모든 것이 원활하게 돌아간다면 그것만큼 좋은 일은 없겠으나."
2003903-50 = "선생도 알고 있지 않은가. 세상에는 때때로 경계선을 걷는 자들이 있으니 말이다."
2003903-52 = "두루 살펴 공연한 무고인지 명백한 범죄인지 가늠한 다음, 범죄임이 확실하다면 조속히 사형을 언도할 것이다!"
2003903-53 = "[s] \"사형은 안 돼–!\""
2003903-54 = "아, 여기에서의 사형은 어디까지나 비유적인 의미로……."
2003903-55 = "[s] \"그래도 안 돼–!\""
2003903-56 = "그러한가……."
2003903-58 = "음. 이것으로 오늘의 업무는 종료된 듯하구나. 선생."
2003903-59 = "평소보다 절반 정도밖에는 걸리지 않았다? 후후. 내가 도움이 되었다면 다행이로구나."
2003903-60 = "흠? 빠르고 정확한 판단에는 놀랄 수밖에 없었지만, 해결 방법과 결론이 조금 극단적이었다……?"
2003903-61 = "……슬픈 일이로구나. 세상은 아직 산해경의 방식을 이해하기에 너무 그릇이 작은 모양이야."
2003903-62 = "그러면, 선생. 이제부터는 무엇을 할 생각인가?"
2003903-63 = "음? 업무가 예상보다 지나치게 빨리 종료된 탓에, 생각해 둔 것이 없다……?"
2003903-68 = "(기분 좋은 향기가 솔솔 피어나고 있었다.)"
2003903-69 = "(아무래도 키사키가 가지고 온 향로의 향기인 듯했다…….)"
2003903-70 = "무슨 일이라도 있었는가, 선생? 매우 피곤해 보이는구나."
2003903-71 = "아하. 사실은 일이 밀려 3일째 제대로 잠을 자지 못했다?"
2003903-72 = "그래서는 안 되지. 샬레의 선생이라는 중책을 맡은 자가, 제 몸을 돌보지 못해서 되겠느냐. 우선은…… 그렇구나. 장소를 바꾸도록 할까."
2003903-74 = "자, 여기 눕도록 해라. 무릎을 빌려 주마."
2003903-80 = "그래, 그래……. 지금은 이 향에 모든 것을 맡기고, 눈을 감는 것이 좋다."
2003903-81 = "숨을 들이쉬고, 내쉬고……. 옳지, 옳지……."
2003903-89 = "(꿈속에 있는 것인지, 아직 현실인 것인지 어느 순간 구분이 가지 않기 시작했다.)"
2003903-90 = "(그런 중에도 작은 손길 같은 것이, 여기저기를 쓰다듬는 것처럼 느껴졌다…….)"
2003903-92 = "……꿈이라도 꾸고 있는 것인가, 선생? 표정이 편안하구나."
2003903-93 = "하기야, 꿈을 꾼다는 것 자체가 그다지 깊이 잠들지 못했다는 증거라는 말도 있다만."
2003903-94 = "(이마라든가…….)"
2003903-96 = "전해지는 고사 중에는 이런 것이 있다."
2003903-97 = "한 사람이 꿈에 나비가 되어 세상을 날아다녔다고 하지. 나비는 흡족했고, 모든 것이 좋았다고 한다."
2003903-98 = "(뺨이라든가…….)"
2003903-100 = "나비는 너무 흡족했던 나머지, 자신이 사람이었는지 무엇이었는지도 알지 못했다고 한다."
2003903-101 = "그러나 꿈에서 갑작스레 깨고 보니, 나비는 온데간데없고, 곧 자신이 사람이었다고 하더구나."
2003903-102 = "(그리고 목 안쪽이라든가…….)"
2003903-104 = "하여, 문득 생각했다. 나비가 나인 것인가, 아니면 내가 나비인 것인가."
2003903-105 = "아니면 애초부터 그런 것은 구분할 수 없고, 중요하지조차 않은 것인가, 하고……."
2003903-116 = "(눈을 떴을 때는, 키사키도 향로도 보이지 않았다.)"
2003903-117 = "(키사키가 정말 여기에 왔다 간 것인지, 의심마저 들 정도였다…….)"
