[translation]
10004010-1 = "제1화;슌 교관의 우울"
10004010-2 = "산해경 훈육지원부 매화원"
10004010-6 = "하아, 오늘 현장학습은 정말 힘들었어요……."
10004010-7 = "아이들은 평상시에는 정말 천사 같지만, 제멋대로 움직이기 시작하면 무슨 말을 해도 듣질 않으니……."
10004010-8 = "매화원의 원생들을 보고 있노라면, 가끔은 저도 교관의 직책을 내려놓고 어린아이처럼 투정을 부리며 일에서 도망치고 싶어지네요……."
10004010-9 = "아니, 이런 일로 도망쳐서는 안 돼요."
10004010-10 = "어린 원생들을 훈육하여 훌륭한 한 명의 원생으로 길러내는 것은 산해경 교관의 책무! 겨우 이 정도의 일 때문에 투정을 부릴 수는 없죠!"
10004010-11 = "게다가 계속 얼굴을 찌푸리고 있으면 피부미용에도 나쁘니까요."
10004010-12 = "그럼…… 오늘은 힘든 일도 많았으니, 저를 위해 준비해 두었던 특별 선물을 꺼내 볼까요?"
10004010-13 = "<바겐다즈>의 럼 레이즌 맛 아이스크림!"
10004010-14 = "산해경 학원에서는 좀처럼 구하기 힘든 맛이라 아껴두고 있었지만, 오늘만큼은 이 아이스크림을 먹으면서 느긋하게 오후를 보내야겠어요."
10004010-15 = "그럼 잘 먹겠습니다~."
10004010-18 = "어라? 냉장고에 넣어놨던 아이스크림이…… 어디로 간 걸까요?"
10004010-20 = "언니, 뭐 찾아?"
10004010-21 = "아, 코코나 쨩."
10004010-22 = "다름이 아니라 냉동실에 넣어두었던 아이스크림이 사라져서요. 혹시 못 봤나요?"
10004010-23 = "그 럼 레이즌 맛 아이스크림? 내가 먹었는데?"
10004010-24 = "네에에에? 어째서 말도 없이 먹어버린 건가요!"
10004010-25 = "구하기 어려운 물건이라, 정말 중요한 날에 먹으려고 아껴두고 있었던 건데……."
10004010-26 = "하지만 저번 주에 언니가 다이어트를 한다고 앞으로 유제품은 먹지 않겠다고 선언했잖아?"
10004010-27 = "그래서 당연히 이 아이스크림도 안 먹을 줄 알고……."
10004010-28 = "아아아……."
10004010-29 = "미, 미안……. 뭣하면 내가 전에 사 온 콘포타주 맛 <모리모리군>이라도 먹을래?"
10004010-30 = "……아뇨, 괜찮아요. 미리 말해두지 않았던 제 책임도 있으니까요."
10004010-31 = "참, 언니. 그나저나 오후에 있는 해바라기반 원생들의 간식 준비, 언니가 대신 맡아줄 수 없을까?"
10004010-32 = "네? 하지만 그 일은 코코나 쨩이 맡기로 했었잖아요?"
10004010-33 = "그렇지만~ 오늘 오후 간식으로는 당근 케이크가 나온다잖아. 나는 당근 싫어하는 걸."
10004010-34 = "코코나 쨩, 전에도 말했지만 음식을 가려 먹으면 훌륭한 어른이 될 수 없다고—"
10004010-35 = "으으, 또 잔소리…… 그런 건 말하지 않아도 알고 있다니까!"
10004010-36 = "여하튼 오늘 일은 나중에 꼭 벌충할게. 그럼 부탁할게!"
10004010-40 = "자, 잠시만요. 코코나 쨩!"
10004010-42 = "……하아."
10004010-43 = "정말 왜 다들 이렇게 어린아이처럼 구는 건지……"
10004010-44 = "원생들도, 코코나도, 다들 저들이 하고 싶은 대로만 행동하고……."
10004010-46 = "저도 할 수만 있으면 어린아이가 되고 싶었다고요!"
10004010-47 = "……아니지, 이럴 때일수록 더 평정을 되찾아야 해요."
10004010-48 = "스트레스는 미용과 안티에이징의 적! 사소한 일에 일희일비했다가는 금세 피부가 상하고 말 거예요."
10004010-49 = "으음, 안 그래도 요새 피로 때문인지 피부가 거칠고 푸석푸석하니…… 새로운 피부관리법을 한 번 찾아봐야겠네요."
10004010-50 = "그러고보니 전에 연단방의 사야 양이 불로불사의 영약을 연구한다고 했었었죠?"
10004010-51 = "불로불사까지는 아니더라도 사야 양이라면 안티에이징에 좋은 약을 많이 알고 있을지도 모르겠네요."
10004010-52 = "우선은…… 오후 간식 준비 전에 잠깐 연단방에 들러볼까요."
10004010-54 = "연단방 내 사야 연구실"
10004010-55 = "후-후-후- 오늘은 나가서 어떤 실험을 해볼까? 벌써부터 외출이 기다려지는 것이다!"
10004010-57 = "실례합니다."
10004010-58 = "어라, 매화원의 슌 교관이잖아? 나님의 연구실에 어서 오는 것이다!"
10004010-59 = "어머나, 사야 양. 오늘은 예쁜 사복을 입고 계시네요."
10004010-60 = "어디 외출이라도 나가실 예정이신가요?"
10004010-61 = "응, 오늘 오후에 [USERNAME] 선생과 시내에서 만나기로 했거든."
10004010-62 = "샬레에 둘 상비약을 구입하는 데 내 도움이 필요하다고 해서 말이야."
10004010-63 = "네에?! [USERNAME] 선생님과요?"
10004010-64 = "응. 무슨 문제라도 있는 것이냐?"
10004010-65 = "아, 아뇨…… 문제가 있는 건 아니지만……."
10004010-66 = "(전에 제가 외출을 권했을 때는 바쁘다고 거절하셨으면서, 사야 양과는 약속을 해주시다니…….)"
10004010-67 = "(물론 샬레의 공무 때문이라는 것은 알고 있지만…… 어쩐지 조금 서운하네요.)"
10004010-68 = "그나저나 나님의 연구실에는 갑자기 무슨 일인 것이냐? 매화원의 일로 찾아온 것은 아닐테고……."
10004010-69 = "설마 현룡문과 현무상회의 중재를 부탁하러 온 건 아니겠지? 나님이 아무리 천재라지만 그런 일은 사양인 것이다!"
10004010-70 = "하하, 그럴 리가요. 현룡문과 상회의 항쟁은 키보토스 내에서도 살벌한 것으로 유명하니까요."
10004010-71 = "저도 그 사이에 먼저 끼어들 만큼 아둔하지는 않답니다."
10004010-72 = "오늘 제가 찾아온 이유는 그런 게 아니라…… 혹시 약을 하나 받을 수 없을까 해서……."
10004010-73 = "약? 어디가 안 좋은 것이냐?"
10004010-74 = "아뇨, 몸은 건강해요."
10004010-75 = "다만 최근에 피로 때문인지, 스트레스 때문인지 피부가 거칠어져서……"
10004010-76 = "혹시 피부 미용에 좋은 약이 따로 없을까요……?"
10004010-77 = "후-후-후-. 그런 거라면 잘 온 것이다. 마침 새로운 비약을 시험해보고 있던 중이었거든!"
10004010-78 = "이름하여……"
10004010-80 = "<회춘의 비약>!"
10004010-82 = "회춘의 비약이요?"
10004010-87 = "응, 이 약으로 말할 것 같으면 아무리 나이든 사람이라도 한 모금만 마시면 갓난아기와 같은 부드러운 피부를 갖게 되는, 내 비장의 발명품이지!"
10004010-88 = "물론 아직 시험 단계라 '약간의 부작용'이 있을지도 모르지만…… 성능만큼은 확실한 것이다!"
10004010-89 = "어때. 한번 마셔볼래?"
10004010-90 = "네, 부디 마시게 해주세요!"
10004010-91 = "좋아."
10004010-94 = "그럼 마시고 나서 어떤 변화가 있는지 내게 자세히 알려줘."
10004010-100 = "(정말 이 약을 마시면 어린아이와 같은 피부를 가질 수 있는 걸까요?)"
10004010-101 = "(확실히 어릴 때는 피부 문제로 고민했던 적은 없었지요. 요즘처럼 피로하지도 않았고요.)"
10004010-102 = "(……역시 어릴 때가 좋았어요. 시간이 지나면 지날수록 나쁜 일만 많아지고…….)"
10004010-103 = "(역시 나이 드는 건 싫어…….)"
10004010-114 = "어때? 피부에 무슨 변화라도 느껴져?"
10004010-115 = "피부는 잘 모르겠고, 온몸이 뜨겁고 욱신거리는 게……."
10004010-116 = "어라? 이상한 것이다. 비약에 넣은 약재 중에 몸을 덥히는 성분은 없었는데—"
10004010-117 = "우, 우앗?!"
10004010-118 = "왜, 왜 그러시나요. 사야 양?"
10004010-119 = "그, 그게…… 그러니까……."
10004010-120 = "어라? 사야 양, 갑자기 키가 커지신 건가요? 어쩐지 시선이 낮아진 기분이……."
10004010-121 = "나님이 커진 게 아니라, 네가 줄어든 것이다! 거울을 봐!"
10004010-122 = "거울이요?"
10004010-132 = "에에에?! 제, 제 몸이 왜 이렇게 변한 거죠?"
10004010-133 = "나, 나님도 모르는 것이다! 이건 전혀 예상치 못했던 형태의 부작용이라고!"
10004010-134 = "피부가 부드러워지는 대신 온몸이 고무처럼 늘어나거나 고양이 수염이 자라나는 부작용은 예상했지만, 몸이 작아지는 부작용은 예상치 못했는데……."
10004010-135 = "사야 양. 제게 그런 약을 먹이려고 했던 건가요……."
10004010-136 = "거, 걱정하지 않아도 좋은 것이다! 나님은 천재니까 해독제도 금방 만들 수 있어!"
10004010-137 = "자, 잠시만 기다리는 것이다… 연단방의 창고에 가서 금방 해독 약재를 가지고 올테니!"
10004010-142 = "후우…… 재난이네요. 입버릇처럼 어린아이가 되고 싶다고 말하긴 했었지만, 정말로 어린아이가 되어 버릴 줄이야……."
10004010-143 = "그나저나 부작용이라고는 하지만 피부는 정말 매끈매끈해졌네요. 거기에 더해 어린아이 특유의 보드라운 살냄새도 나는 것 같고......."
10004010-150 = "게다가 격렬하게 움직여도 어깨에 무리도 안 가고, 몸도 훨씬 가벼워졌어요!"
10004010-151 = "어린아이의 몸도 의외로 나쁘지 않을지도……."
10004010-154 = "[ns] \"안녕.\""
10004010-155 = "[USERNAME] 선생님? 여, 여기에는 어쩐 일로……."
10004010-156 = "그, 그러니까 이 모습은……."
10004010-157 = "[s] \"매화원에서 왔니?\""
10004010-158 = "네?"
10004010-159 = "그, 그게 그러니까……."
10004010-162 = "(어라? 선생님은 지금의 저를 알아보지 못하시는 것 같네요.)"
10004010-163 = "(그도 그렇겠지요. 갑작스럽게 코코나보다 어린아이가 되어버렸으니, 같은 사람이라고 생각하는 게 더 이상해요.)"
10004010-164 = "(……사야 양의 비약에 대해 이야기했다가는 귀찮아질 것 같으니, 여기서는 거짓말을 하도록 할까요.)"
10004010-167 = "네, 네! 저, 저는 매화원에 새로 들어온 9살…… 슈, 슈에링이라고 해요!"
10004010-168 = "슌 언니와 함께 산해경 나들이를 나왔다가 잠깐 길을 잃어서……."
10004010-169 = "[s1] \"나는 이곳에서 사야와 만나기로 했는데…….\"\n[s2] \"혹시 사야는 못 봤어?\""
10004010-170 = "어…… 사야 언니는 못 봤는데요. 어디 잠깐 외출한 게 아닐까요?"
10004010-171 = "어…… 사야 언니는 못 봤는데요. 어디 잠깐 외출한 게 아닐까요?"
10004010-172 = "[s3] \"그럼 그 사이에 슌을 찾아볼까.\"\n[s4] \"사야가 돌아오기 전에 내가 매화원에 데려다줄게.\""
10004010-173 = "네? 그, 그러시지 않아도 괜찮은데……."
10004010-174 = "네? 그, 그러시지 않아도 괜찮은데……."
10004010-177 = "(으으…… 어쩐지 사야 양과 선생님의 외출을 방해한 것 같아 양심이 찔리네요.)"
10004010-178 = "(게다가 본의는 아니라지만 선생님께 거짓말까지 하고 말았으니…….)"
10004010-179 = "(아니, 따지고 보면 제가 이런 상황에 처하게 된 데에는 사야 양의 책임도 있잖아요?)"
10004010-180 = "(애초에 약의 부작용이 나타나지 않았더라면 선생님께 거짓말을 할 이유도 없었을테니…… 이건 정당방위예요!)"
10004010-183 = "그럼 잠깐이라면…… 부탁드릴게요, 선생님."
10004010-184 = "[s] \"그나저나 슌은 어디에 갔으려나?\""
10004010-185 = "글쎄요. 이 근처라면…… 현무상회에 가지 않았을까요?"
10004010-186 = "전에 현무상회에서 슌 언니가 좋아하는 탕후루 가게의 신작이 나온다고 했었거든요."
10004010-187 = "무, 물론 슌 언니가 원생을 내버려두고 식도락을 즐기러 다니는 무책임한 교관이라는 뜻은 아녜요!"
10004010-188 = "[s] \"……어째서 슈에링이 슌의 변명을 대신 해주는 거야?\""
10004010-189 = "그건 그러니까…… 슌 언니라면 그렇게 말하지 않았을까 해서요. 하하……."
10004010-190 = "자, 자. 사소한 일은 생략하고, 어서 가요. 선생님!"
