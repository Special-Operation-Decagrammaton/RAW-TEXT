[translation]
10032040-1 = "제4화;거기까진 예상 못 했는데"
10032040-21 = "모두 비켜라. 앞에서 걸리적거리다 무슨 일 생겨도 책임져 주지 않는다."
10032040-22 = "생각보다 훨씬 더 괜찮은 곳이로군. 마음에 들어."
10032040-23 = "자리는 어디지? 교양인으로서, 공연을 지연시키는 민폐를 끼치고 싶지는 않아서 말이야."
10032040-24 = "……정말로 괜찮으시겠습니까, 보스."
10032040-25 = "보스를 노리는 자들의 첩보는 지금 이 시간에도 계속해서 흘러 들어오고 있습니다만."
10032040-26 = "아마 이 오페라 하우스에도 꽤 있을 테지요. 이런 상황에서 굳이 공연 관람을 강행하시다니……."
10032040-27 = "……그만."
10032040-28 = "…………."
10032040-29 = "이해를 못 하는구나. 그런 일이 두려워 일정을 취소하거나 바꾸는 것이야말로 저쪽이 바라는 것."
10032040-30 = "일정은 그대로 진행한다. 우린 그걸 피하는 게 아니라, 막아내는 거지."
10032040-31 = "이미 만일을 위한 '대비책'도 세워 놓았으니……."
10032040-32 = "……'대비책'이요?"
10032040-33 = "후후. 그런 게 있다. 너는 알 것 없어. 네가 할 수 있는 경계에만 충실하면 돼."
10032040-34 = "이해했으면 어서 길이나 안내해라. 서 있기 힘들구나."
10032040-35 = "……알겠습니다, 보스. 그럼, 이쪽으로……."
10032040-44 = "……저 정도로 사람들을 줄줄 끌고 다녀서야, 오히려 눈에 띄는 거 아냐?"
10032040-45 = "저 정도의 거물이면 어차피 숨어 지낸다는 게 불가능하니까. 차라리 저 방식이 현명하겠지."
10032040-46 = "하지만 그러네. 우리 입장에선 좋을 게 없는 것도 사실이야. 저 상태에서의 납치……. 쉽지는 않겠어."
10032040-47 = "왜 다른 녀석들이 오페라 하우스째로 날려버리려 했는지도 조금 알 것 같고."
10032040-48 = "지, 지금이라도 제가 다 날려버릴까요……? 갱단 보스와 그 떨거지들을 노려서 어떻게든…!"
10032040-49 = "[s1] \"지, 진정해. 하루카! 우선 진정하고……!\"\n[s2] \"그랬다간 여태 한 일들의 의미가……!\""
10032040-55 = "서두를 거 없어. 경호가 있을 거라는 건 예상했던 일이고, 기회야 만들면 돼."
10032040-56 = "오히려 신경이 쓰이는 건……. '대비책'이라는 말과 주변의 분위기 쪽인데."
10032040-57 = "확실히……. 대비책이라, 이쪽이 모르는 뭔가가 더 있다는 거네."
10032040-61 = "……음? 잠시만. 그 전에……."
10032040-62 = "주변의 분위기? 그건 무슨 이야기야?"
10032040-63 = "……주변을 한 번 둘러봐, 사장."
10032040-70 = "어라? 묘하게 동요하고 있는 느낌이……."
10032040-71 = "그야 갑자기 거물급 갱단 인사가 나타났으니 긴장하는 것도 당연한 게……."
10032040-72 = "……틀려. 그런 느낌이 아니야."
10032040-73 = "시선을 피하는 척하지만 계속해서 보스의 동선을 주시하고 있어. 동시에 보스의 눈치만 보는 게 아니라, 주변의 눈치까지 살피고 있어."
10032040-74 = "어쩌면……. 어쩌면 이건……."
10032040-75 = "[s3] \"아까도 말했던 '경쟁자'들……?\"\n[s4] \"아직 더 남아 있다든가?\""
10032040-78 = "……? 응?"
10032040-79 = "……어라?"
10032040-80 = "자, 잠깐만. 그건 조금 이상하지 않아?"
10032040-81 = "우린 이미 리스트에서 신원이 불분명한 사람들을 모두 잡아냈잖아? 남은 건 모두 신원이 등록된 사람들뿐이라고!"
10032040-82 = "게다가……. 지금 우물쭈물 거리며 눈치 보는 사람들이 다 보스를 노리는 사람이라고?"
10032040-83 = "그 말이 사실이라면……."
10032040-87 = "……여기 있는 사람들 전부……. 보스를 노리고 있다는 이야기가 되는데……?"
10032040-94 = "……뭐……."
10032040-95 = "……그러네."
10032040-96 = "유감스럽게도……. 실제로 그런 것 같네."
10032040-100 = "……뭐……."
10032040-101 = "뭐, 뭐라고오~~!?!?"
10032040-102 = "하하하하하!! 대박이네!"
10032040-103 = "아루 쨩, 상관없는 사람들 지키려고 여태까지 수상한 녀석들을 전부 잡아냈는데 사실 여기 있는 사람 전부 수상한 사람들이었던 거야!?"
10032040-104 = "초 대박! 완전 재밌어~!!"
10032040-105 = "우, 웃지 마!! 지금 이게 웃을 일이야!?"
10032040-106 = "그렇지만 굉장하잖아!? 일이 이렇게 될 거라고 아루 쨩 예상했어? 난 못했는데?"
10032040-107 = "선생님은 어때? 선생님은 예상했어? 지금 이 전개?"
10032040-108 = "[s5] \"아뇨. 아무리 그래도 그건 무리죠.\"\n[s6] \"확실히 굉장하네, 여러모로.\""
10032040-111 = "이렇게 말도 안 되는 일이 어디 있어!? 그러면 신원 조회는!? 초대장은!? 대체 무슨 의미야!? 이야기가 다르잖아!!"
10032040-116 = "뭐, 사실 초대 리스트 따위야 조작하려고 마음먹으면 얼마든지 조작할 수 있는 거니까. 리스트를 그대로 믿는 것도 순진한 일이고……."
10032040-117 = "아루 쨩~. 생각해 보면 우리도 누군가 그 리스트를 조작해 줘서 들어온 사람들이잖아~?"
10032040-118 = "그러니까 어떻게 그리 태연한 거냐고!!"
10032040-119 = "하으으……. 속 쓰려……."
10032040-120 = "이제 어떻게 하지? 침착해, 침착하자. 아루. 생각해. 생각해야 해."
10032040-121 = "일단 지금 당장 뭔가 일이 터지진 않을 거야. 아직까진 서로가 눈치만 살피고 있는 분위기고……."
10032040-122 = "겨, 경호원들도 대동하고 있으니까! 맞아. 지금 바로 뭐가 터지진 않겠지."
10032040-123 = "어떻게 하지? 먼저 칠까? 다 끝날 때까지 기다렸다가 마지막을 노려야 하나? 그럴 여유가 있을까? 결국 스타트를 끊는 건……."
10032040-124 = "으아아아악-!! 각오해라, 돈 아란치노!!"
10032040-128 = "[ns7] \"……아. 시작됐다.\"\n[ns8] \"바로 뭐가 터지고 있는데요.\""
10032040-131 = "어째서!!!!!!!"
10032040-132 = "대체 어째서냐고!!! 경호원도 떡하니 버티고 있는데!!!!"
10032040-138 = "뭐~. 고작 몇 명의 경호원으로 이 오페라 하우스 인원 전체를 상대할 순 없으니까~."
10032040-139 = "이제 어떻게 하지, 사장? 우리도 쫓아가? 아니면 일단 상황을 지켜볼까?"
10032040-144 = "으, 으음. 그래. 일단 침착하자. 침착하고……. 우선 상황을……."
10032040-145 = "거기 너, 방해하지 마! 이 떨거지들아!!"
10032040-146 = "으, 으응……? 떨거지들……?"
10032040-147 = "……나?"
10032040-148 = "……아."
10032040-149 = "사장. 거기에 그렇게 반응하면……."
10032040-151 = "이 자식분들 어딜 감히 아루님께 떨거지라고오오오오오-!!"
10032040-152 = "용서 못 해!! 저리 다 꺼져!! 저건 아루님의 것이란 말이다아아아-!!!"
10032040-178 = "……하아."
10032040-179 = "푸하하하하하!!! 역시 하루카 쨩!! 기대를 저버리지 않는다니까!!"
10032040-182 = "……아……."
10032040-183 = "아…… 아으…… 아……."
10032040-184 = "[s9] \"……아루?\"\n[s10] \"이제 어떻게 할 거야?\""
10032040-187 = "……헉!"
10032040-188 = "어, 어떻게 하긴 뭘 어떻게 해!? 이미 이렇게 돼 버린 거……. 이제는 수단과 방법을 가릴 때가 아니잖아!!"
10032040-189 = "쫓아간다!! 모두 보스를 잡아!!"
