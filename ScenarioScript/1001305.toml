[translation]
1001305-1 = "어른의 데이트"
1001305-3 = "(어른의 카드 이용 실적이 우수하다며, 최고급 파인다이닝 2인 초대권이 도착했다.)"
1001305-4 = "(그건 그렇고 츠루기의 상태가 좋아보이지 않으니 찾아가보도록 하자.)"
1001305-6 = "(츠루기가 혼자 공원에 앉아 있다.)"
1001305-7 = "(멍-) ……."
1001305-8 = "[s1] 인사한다.\n[s2] 손을 흔든다."
1001305-9 = "서, 선생님?!"
1001305-10 = "서, 선생님?!"
1001305-11 = "여, 여긴 어떻게……. 아, 아니, 그것보단……."
1001305-12 = "[s3] \"무슨 일 있는 거야?\"\n[s4] \"고민 같은 거라도 있어?\""
1001305-13 = "고, 고민……말입니까……."
1001305-14 = "고, 고민……말입니까……."
1001305-15 = "어, 없다고 할 수는 없겠지만……."
1001305-16 = "[s] \"들려줄래?\""
1001305-17 = "……."
1001305-19 = "제 32회 정의실현 임무 - 불량배 소탕"
1001305-20 = "캬하하하하하하하핫-!!"
1001305-21 = "퇴로는 막혔다! 네놈들은 도망칠 방법이 없다고?"
1001305-22 = "여기서 얌전히 사라져라!!"
1001305-23 = "(콰아앙-! 콰콰콰콰콰아아앙-!!)"
1001305-25 = "상반기 트리니티 자치구 무장 순회"
1001305-26 = "끼헤헤헤헤헤헤헤헤헤헤헤--!!"
1001305-27 = "이래서야 구축당하는 벌레들과 다를 게 없는 꼴이구만?"
1001305-28 = "(콰아아앙!! 퍼엉! 퍼엉!!)"
1001305-30 = "긴급 피난 업무 - 장학사 보호"
1001305-31 = "쿠헤에에에에에에에-!!!"
1001305-32 = "부족해, 아직 부족해애애!!"
1001305-33 = "더, 더, 더 저항해라!!"
1001305-34 = "(콰아아앙!! 콰앙! 콰아아앙!!)"
1001305-36 = "……인 것입니다."
1001305-37 = "[s5] \"……열심히 하고 있구나, 츠루기는.\"\n[s6] \"……그러니까, 일이 너무 많다는 얘기일까?\""
1001305-38 = "……그, 그게 아니라."
1001305-39 = "……그, 그게 아니라."
1001305-40 = "제, 제, 제……"
1001305-41 = "[s] \"제?\""
1001305-42 = "제 청춘은 이래도 괜찮은 걸까…… 하는……."
1001305-43 = "[s7] \"청춘……?!\"\n[s8] \"무서운 단어가 나와버렸다!\""
1001305-44 = "소설책이나 잡지 같은데서 보이는 화려하고 달콤한 핑크빛 청춘 라이프는 어디에도 없고……."
1001305-45 = "소설책이나 잡지 같은데서 보이는 화려하고 달콤한 핑크빛 청춘 라이프는 어디에도 없고……."
1001305-46 = "……저같은 경우는 핑크색은커녕 새빨간 선홍색인 느낌이라……."
1001305-47 = "[s9] \"츠루기는 꿈이 있는 소녀구나.\"\n[s10] \"확실히 선홍색이긴 하지.\""
1001305-48 = "하, 하, 하다못해 조, 조, 좋아하는 사람이랑 데, 데, 데……데이……, ……같은 거라도 있었으면……."
1001305-49 = "하, 하, 하다못해 조, 조, 좋아하는 사람이랑 데, 데, 데……데이……, ……같은 거라도 있었으면……."
1001305-50 = "……아, 죄, 죄송합니다. 제가 또 이상한 소리를……."
1001305-51 = "[s11] 모처럼 구한 다이닝 초대권으로,\n[s12] 츠루기의 핑크빛 꿈을 이뤄주자."
1001305-56 = "(스윽)"
1001305-57 = "네? 이, 이건?!"
1001305-58 = "[s] \"나랑 특훈(데이트)하는 거다! 츠루기!\""
1001305-59 = "?!?!!"
1001305-61 = "어서오십시오. 기다리고 있었습니다. [USERNAME] 님."
1001305-62 = "선택받은 소수를 위한 프리미엄 다이닝 <디럭스 팰리스 키보토스>에 오신걸 환영합니다."
1001305-63 = "……?!"
1001305-64 = "550미터에 이르는 초고층 야경과 함께 최고급 요리를 맛보며 편안한 시간을 보내십시오."
1001305-65 = "자리를 안내하겠습니다. 이쪽으로."
1001305-67 = "[s13] \"고마워요, 마스터.\"\n[s14] \"가자, 츠루기 쨩.\""
1001305-68 = "네? 아, 아으…… 저, 저는……."
1001305-69 = "네? 아, 아으…… 저, 저는……."
1001305-73 = "― (도망칠까? [wa:1200]지금이라도 [wa:1500]창문으로 뛰어내릴까?)"
1001305-75 = "― (죽을까? [wa:1000]죽겠지? [wa:1000]죽고 싶어…… [wa:1000]죽일까? [wa:1000]아니, [wa:1000]그건 아니고…….)"
1001305-78 = "[ns15] (연습이지만, 제대로 해야하니까.)\n[ns16] (잔뜩 분위기를 잡는다.)"
1001305-81 = "― 무, 무, 무, 무 [wa:1500]무슨 말을, [wa:1000]하…… [wa:1000]하려[wa:1000]고……."
1001305-83 = "― 이, [wa:500]이런 곳은…… [wa:1500]나랑 [wa:1000]어울리지 않는데……"
1001305-86 = "[ns] \"츠루기. 할말이 있어.\""
1001305-87 = "― 아, [wa:1200]우우……. [wa:2000]아직 [wa:1000]나는 [wa:1500]준비가……"
1001305-90 = "― (갸아아아아아--! [wa:2000]어째서 이런 곳에 [wa:1500]와버린 거냐아-!!)"
1001305-93 = "[ns] \"할말이라는 건- 함께 힘내자, 라는 거야.\""
1001305-94 = "아……."
1001305-95 = "……."
1001305-96 = "……네."
1001305-97 = "(그 이후 신나게 츠루기에게 어른의 데이트를 체험시켜줬다.)"
