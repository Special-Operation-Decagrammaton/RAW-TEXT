[translation]
1300902-1 = "오늘도 열심히 꾸벅꾸벅 수행"
1300902-2 = "(츠바키와 약속한 장소로 나오자 한쪽에 많은 인파가 몰려 있는 것이 보였다.)"
1300902-3 = "[ns] \"무슨 일이지?\""
1300902-6 = "(가까이 다가가자 그 인파의 중심에는 선 채로 졸고 있는 츠바키가 있었다.)"
1300902-7 = "음냐음냐……. 쿠울……"
1300902-8 = "(인파를 이루고 있는 사람은 어찌된 이유인지 츠바키를 보고는 웅성거리기 시작했다.)"
1300902-9 = "야야, 저거 봐. 저 사람 혹시……."
1300902-10 = "백귀야행의 잠자는 공주다!"
1300902-11 = "잠자는 공주라면……."
1300902-12 = "그 자는데 있어서는 그 누구도 따라올 수 없다던 잠자기의 프로 말이지?!"
1300902-13 = "[s1] \"잠자는 공주……?\"\n[s2] \"잠자기의 프로……?\""
1300902-14 = "그러고 보면 나 저번에 본 적 있어."
1300902-15 = "그러고 보면 나 저번에 본 적 있어."
1300902-16 = "잠자는 공주가 쿠-울 자는 채로 직소 퍼즐을 맞추는 모습을!"
1300902-17 = "[s] \"직소……퍼즐?\""
1300902-18 = "어허, 겨우 그 정도로 놀라는 거야?"
1300902-19 = "나는 잠자는 공주가 꾸벅꾸벅 졸면서 트럼프 카드로 탑을 쌓는 것도 봤다고!"
1300902-20 = "[s] \"트럼프……?\""
1300902-21 = "칫칫, 에피소드들이 약하군! 내가 봤던 잠자는 공주는 말이지……!"
1300902-23 = "(그 뒤로도 행인들은 열기를 띤 목소리로 떠드는 걸 멈추지 않았다.)"
1300902-24 = "(아무래도 알게 모르게 츠바키는 백귀야행에서도 유명인사로 통하는 듯했다.)"
1300902-27 = "[ns] \"으음, 일단 말을 걸어야…….\""
1300902-28 = "드디어 찾았다! 백귀야행의 수행부 녀석!!"
1300902-31 = "여기, 여기 있습니다요. 누님!"
1300902-32 = "거리에서 졸고 있는 학생이 있다길래, 설마 하긴 했는데……."
1300902-33 = "역시 네놈이었구나. 수행부의 부장……!"
1300902-35 = "쿠울……."
1300902-36 = "설마 우리를 모른다고 하지는 않겠지!"
1300902-37 = "흠냐……"
1300902-38 = "흐므……."
1300902-39 = "무시하기냐……?!"
1300902-40 = "들을 생각도 없는 모양인데요. 누님!"
1300902-41 = "크읏, 됐어!"
1300902-42 = "저번에는 밤거리를 어슬렁거리면서, 이 그릇된 사회를 향해 불만을 표출하기 위한 우리들의 자유예술 행위를 잘도 방해했겠다!"
1300902-43 = "까놓고 말해서 담벼락 낙서였지만 말입죠. 누님!"
1300902-44 = "시, 시끄러!"
1300902-45 = "녀석이 졸고 있는 지금이 기회다! 쳐라!"
1300902-46 = "이얏-호!!"
1300902-48 = "잠자는 공주에게 총알 세례가……!"
1300902-49 = "위, 위험해!"
1300902-50 = "[s] \"츠바키……?!\""
1300902-52 = "쿠울."
1300902-54 = "큭! 총알 세례 속에서도 흔들림 없는 숙면이라니! 이 정도는 여유롭다는 거냐!"
1300902-55 = "누님, 손대중으로는 부족합니다! 더 큰 놈으로!"
1300902-56 = "에잇! 받아라! 수류탄 투척!"
1300902-58 = "[ns] \"위험해……! 츠바키!\""
1300902-63 = "핫-하! 어떠냐! 해치웠나?!"
1300902-64 = "앗……. 누님, 여기서 그런 말을 했다간……!"
1300902-68 = "이, 이 녀석……! 졸면서 우리의 공격을 전부 피했다고?!"
1300902-69 = "드, 듣던 것보다 더 괴물인데요. 어쩌죠, 누님?!"
1300902-71 = "괴, 굉장해!"
1300902-72 = "이것이 백귀야행의 잠자는 공주가 가진 저력!"
1300902-73 = "공주의 의기양양한 저 표정을 봐!"
1300902-74 = "후아암……. 쿠울……."
1300902-75 = "당당히 자신의 승리를 선언하는 잠꼬대라니!"
1300902-76 = "(뭔가 굉장한 광경을 보아버린 모양이다.)"
1300902-78 = "쳇, 이렇게 된 거……!"
1300902-79 = "[s] \"거기, 너희들 잠깐만.\""
1300902-80 = "저, 저 사람은 샬레의 선생님?!"
1300902-81 = "우왓?! 샬레랑 엮이면 피곤해진다구요. 누님!"
1300902-82 = "에, 에이잇! 자, 작전상 후퇴다!"
1300902-85 = "(말을 걸기가 무섭게 두 사람 다 도망가버렸다.)"
1300902-86 = "(하는 수 없지.)"
1300902-88 = "[ns] \"츠바키, 괜찮아?\""
1300902-89 = "응? 누군지는 모르겠다만. 그렇게 부른다고 잠자는 공주가 바로 눈을 뜰 리가……."
1300902-90 = "후아암? 이 목소리는……."
1300902-91 = "아핫. 선생님이다."
1300902-92 = "그 난리를 쳐도 절대로 일어나지 않던 잠자는 공주가!"
1300902-93 = "부르자마자 바로 일어났어?!"
1300902-94 = "[s] \"문자를 받고 왔는데, 이게 어떻게 된 거야?\""
1300902-95 = "우음? 선생님을 기다리면서, 그냥 자고 있었을 뿐인데……?"
1300902-96 = "그렇지 않아도, 오늘, 햇살이 따끈따끈……."
1300902-97 = "방금까지……. 뭔가 엄청 신나는 꿈을 꾼 기분이야……."
1300902-98 = "[s] \"……그래?\""
1300902-99 = "이렇게 바람까지 솔솔 부는 게, 잠자기…아니, 수행하기 딱 좋은 날씨야."
1300902-100 = "선생님도……. 그렇게 생각하지……? 후아암."
1300902-101 = "[s] \"그, 그런가?\""
1300902-102 = "그러엄, 선생님. 약속한 대로 내가 수행 시범을 보여줄게."
1300902-103 = "적당히 자리를 옮겨서……."
1300902-104 = "[s3] \"아니, 괜찮아.\"\n[s4] \"이미 봤거든. 굉장했어.\""
1300902-105 = "이미 봤다구……?"
1300902-106 = "이미 봤다구……?"
1300902-107 = "으음……. 그럼 어쩌지. 선생님을 부른 건……. 수행을 보여주려고 한 거였는데."
1300902-108 = "이러면 곤란해……."
1300902-109 = "[s] \"그럼 기왕 만난 거, 점심이나 같이 먹자.\""
1300902-110 = "점심……? (갸웃)"
1300902-111 = "후후. 자고 일어나자마자 선생님과 만나, 점심이라니."
1300902-112 = "꼭 행복한 꿈을 꾸는 것 같네."
1300902-113 = "응, 좋아. 선생님. 그러니까……."
1300902-115 = "……쿠울."
1300902-116 = "[s] \"아니, 츠바키. 다시 자면 안 돼! 츠바키?!\""
1300902-119 = "(그 뒤로 츠바키와 함께 점심을 먹기 위해 자리를 옮겼다.)"
1300902-120 = "(점심을 먹는 도중에도 츠바키의 수행은 계속되었다.)"
