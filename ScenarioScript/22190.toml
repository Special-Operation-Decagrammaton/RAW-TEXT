[translation]
22190-1 = "제19화;치트 플레이어"
22190-10 = "……!!"
22190-15 = "[ns] \"C&C 전원이 공격을 퍼부어도…… 상처 하나 없이…….\""
22190-16 = "특수금속을 사용한 내구력의 증대…… 아니, 단순히 버틴다. 수준의 이야기가 아니야."
22190-17 = "능동적으로 모든 공격을 방어하고 무력화시키고 있어."
22190-23 = "투사체는 전부 격추하고, 사각에서 일어나는 공격은 전부 회피 기동으로 피해낸다."
22190-24 = "잠깐만, 이상해. 이 데이터량은…… 말도 안 돼……."
22190-25 = "요새도시 에리두 전역의 전력과 네트워크 연산 기능이 전부 저 정체불명의 <기체>에 집중되고 있어……!"
22190-26 = "이 정도의 데이터량과 연산 기능으로 강화된 성능이라면…… 사실상 이미 그 수준은…… 가까운 미래를 예지하고 확정 짓는 것조차 가능할 정도……"
22190-27 = "[s] \"미래를 예지하는 능력, 이라고……?\""
22190-28 = "뭐, 뭐야! 그런 최종보스나 가지고 있을 법한 사기 능력은?!"
22190-29 = "그런 건 단순한 치트잖아요!"
22190-30 = "아, 아으……."
22190-32 = "이래서야 이미 전략과 전술을 논할 단계의 레벨이 아니야……."
22190-33 = "유일한 변수. 선생의 지휘 능력을 빼앗는 것으로 종지부를 찍겠어."
22190-34 = "예스, 맴."
22190-35 = "선생님! 도망쳐! 회장이 노리는 대로 흘러가면 끝장이야!"
22190-36 = "[s] \"큭……! 하지만!\""
22190-41 = "[ns] (어쩌지?! 어떻게 하면 이 상황을 타개할 수 있지……?!)"
22190-48 = "선생님…… 상대는 육…… 상, 전용의……."
22190-52 = "[ns] \"!!\""
22190-54 = "[ns] \"……네루! 장소를 바꾸자!\""
22190-55 = "뭐?!"
22190-56 = "[s] \"목표는…… 옥상이야!\""
22190-57 = "……!!"
22190-58 = "하……! 알았다고! 선생!"
22190-66 = "그럼 선생을 붙잡고 뛸 테니까. 혀 깨물지 않게 이 악물라고!"
22190-68 = "[ns] \"우왓?!\""
22190-77 = "여기서 도망을 치다니……! 토키! 쫓아!"
22190-110 = "목표물을 추격한 끝에 현장에 도착, 옥상에 올랐습니다."
22190-111 = "도망치기 위해 고른 곳이, 하필이면 건물의 옥상이라니."
22190-112 = "……좁은 곳이라면 토키를 상대할 수 있다."
22190-113 = "샬레의 선생, 당신은 그렇게 판단한 모양이지?"
22190-114 = "[s] \"아니, 겨우 그런 걸 노린 게 아니야.\""
22190-116 = "[ns] \"네루!\""
22190-119 = "……머리 위!"
22190-120 = "하!"
22190-123 = "소용, 없습니다! 바로 회피기동을……!"
22190-130 = "물론 그 잘난 장난감이라면 열불 터지게 이리저리 잽싸게 튀겠지만 말이야."
22190-131 = "그건 어디까지나 땅 위에 있을 때의 이야기잖아?"
22190-133 = "하지만 반대로 하늘에 있을 때라면 어때?!"
22190-134 = "……?!"
22190-147 = "……건물 밖으로 튕겨 나갔……?"
22190-149 = "어이어이, 설마 하늘을 나는 것까지 가능하다고 하진 않겠지? 앙?"
22190-151 = "어디, 그 거구로 추락하는 도중에도 도망칠 수 있는지 보자고!! 짜샤!"
22190-154 = "하아하아……! 어디야?! 어디로 갔지?!"
22190-155 = "네루 선배랑 선생님이 향한 방향은 분명 이곳……."
22190-156 = "……!! 저, 저기! 모모이! 위에……!"
22190-166 = "으랴아앗!"
22190-170 = "피탄 대미지 경미……!"
22190-171 = "추락 도중에 발생하는 중력 가속도에 대한 연산 보정 개시."
22190-172 = "에리두의 백업이 있는 이상…… 추락하고 있을지라도 움직임에 문제는 없습니다."
22190-173 = "대응 사격을 개시합니다."
22190-178 = "앗뜨뜨뜨!! 뭐냐고! 진짜?!"
22190-179 = "무거운 쇳덩이를 입고도 미끄러지면서 도망친다니……?!"
22190-180 = "아니아니아니!! 진짜! 사기 치고 있네! 이 자식!!"
22190-181 = "네루 선배."
22190-182 = "여기서 마무리를 짓겠습니다."
22190-186 = "발ㅍ………!"
22190-187 = "멍청하게 당해주고만 있을까 보냐……!"
22190-194 = "(방금……!)"
22190-195 = "뒤가 텅 비어있……!"
22190-196 = "연전에 이은 대미지……… 제로."
22190-197 = "대응, 재개합니다."
22190-198 = "………?!?!"
22190-217 = "[ns] \"하아…… 하아……! 네루!\""
22190-219 = "……선생, 그 망할 놈의 후배 녀석은?"
22190-220 = "[s] \"토키는 아직…… 그보다, 네루?! 괜찮아?! 너 상처가……!\""
22190-221 = "……아아."
22190-222 = "이 정도는 아무것도……."
22190-227 = "[ns] \"네루?!\""
22190-229 = "네루 선배!"
22190-239 = "마, 말도 안 돼……. 쇳덩어리를 입고 빌딩에서 떨어졌는데……."
22190-240 = "상처 하나 없는……. 모습……이라니……."
22190-244 = "애당초 <무장>은 앞으로 찾아올 키보토스의 위협을 대비해 만든 물건."
22190-245 = "요새도시의 기능과 능력을 전부 집결한 그 성능은── 요컨대 요새도시 그 자체라 해도 과언이 아니야."
22190-246 = "나아가…… 이번 경우처럼 너희 C&C가 나를 배신했을 때를 대비하여 준비한 대응책이기도 했지."
22190-247 = "네루, 너는 분명 우수하지만……"
22190-248 = "너와, 네가 이끄는 C&C 멤버들은 내게 있어 불안 요소이기도 했어."
22190-249 = "그렇기에 대비를 해둔 거야."
22190-250 = "[s] \"이것이 <무장>이 가진…… 진가.\""
22190-251 = "토키, 샬레의 선생을 회수해."
22190-252 = "……예스. 맴."
22190-256 = "이건, 기체에 대미지가……?"
22190-257 = "빈틈……! 모모이! 이때야! 우타하에게 받았던 그걸……!"
22190-258 = "아……! 알았어!"
22190-262 = "이야아압!!"
22190-266 = "목표물의 도주를 확인. 쫓을까요?"
22190-267 = "아니…… 그럴 필요까진 없겠지."
22190-268 = "우리의 목적은 남은 시간까지 이곳을 방어하는 것뿐이니까."
22190-269 = "……알겠습니다."
22190-270 = "하지만 또다시 재정비를 하고, 마음을 다잡고 돌아올 거야."
22190-271 = "저들은 그런 자들이니까."
22190-272 = "그럼 그때야말로……."
22190-274 = "───전부 끝을 내면 돼."
22190-276 = "다음화;게이머로서, 친구로서"
