[translation]
10039160-1 = "후일담;스쿨 푸드 파이터"
10039160-3 = "(한창인 사육제 이곳저곳을 뛰어다니며 이런저런 일들을 해결하고 있을 무렵……)"
10039160-13 = "……대략 그런 사정이에요……"
10039160-14 = "[s1] \"요약하자면……\"\n[s2] \"노점 거리에 손님이 별로 없다는 거구나.\""
10039160-17 = "네에…… 사실 맛은 자신 있거든요."
10039160-18 = "돌아가면서 시식해도 다들 맛은 괜찮다고 하고……"
10039160-19 = "그럼 음식 외에 뭔가 다른 문제가 있는 것 같은데, 저희로서는 잘 모르겠어서 선생님께 도움을……"
10039160-20 = "[s3] \"나도 이 분야는 잘 모르지만……\"\n[s4] \"어떻게든 손님을 한번 모아볼게……!!\""
10039160-25 = "저, 정말 감사해요, 선생님!"
10039160-26 = "저희도 계속 방법을 찾아볼게요……!"
10039160-29 = "(어떻게 해야 할지 잘 모르겠어서, 일단 노점 거리 근처에서 열심히 기웃거렸다……)"
10039160-32 = "[ns5] \"야끼소바 있어요. 닭꼬치 있어요. 라멘도 있어요.\"\n[ns6] \"맛있어요~\""
10039160-37 = "(이건 아닌 것 같다는 생각이 드는 찰나, 지나가는 학생들이 보였다.)"
10039160-42 = "여기 배경 괜찮지 않아?"
10039160-43 = "오, 한 장 찍자! 너부터 먼저!"
10039160-44 = "귀여운 옷 입고 오길 잘했네!"
10039160-45 = "[s] \"……\""
10039160-50 = "[ns7] \"사진 찍어드려요~ 사육제에서 추억을 만들어보세요~\"\n[ns8] \"명물 노점 거리를 배경으로 우정 사진을 남겨보세요~\""
10039160-55 = "앗, 저거 봐. 어떻게 할래?"
10039160-56 = "헤에, 괜찮지 않아?"
10039160-62 = "헤헷, 그럼 저희 한 장 부탁드릴게요! 감사합니다~!"
10039160-63 = "[ns] \"자, 치이즈~ 노점 거리에도 많은 관심 부탁해요!\""
10039160-78 = "(그렇게 사진을 찍어주며 노점 거리 홍보 활동을 하려던 찰나.)"
10039160-84 = "(사진기 뒤편으로 뭔가 익숙한 실루엣이 보였다.)"
10039160-88 = "[ns] \"……하루나?!\""
10039160-91 = "(혹시…… 미식연구회라면 노점 거리의 문제를 해결해 줄 수 있을까?)"
10039160-92 = "(그간 수많은 미식과 음식점을 경험했던 미식연구회라면……!)"
10039160-93 = "(이 문제에 대한 해결 방법을 제시할 수 있지 않을까?)"
10039160-99 = "(서둘러 하루나의 뒤를 쫓았다.)"
10039160-108 = "[ns] \"헉…… 헉……\""
10039160-112 = "어머, 선생님. 이곳에서 뵐 줄이야."
10039160-115 = "앗, 선생님이다!"
10039160-116 = "이곳에서 뵙게 될 줄이야. 반가워요☆"
10039160-117 = "오, 선생님도 맛있는 거 먹으러 왔구나."
10039160-118 = "[s] \"모두 사육제를 구경하러 온 거야?\""
10039160-120 = "후후…… 트리니티의 사육제는, 말하자면 스트리트 푸드의 각축전."
10039160-121 = "수많은 노점과 푸드트럭들이 저마다의 시그니처 메뉴를 겨루는, 진검승부의 장이라 할 수 있습니다."
10039160-122 = "그런 곳에 저희 미식연구회가 빠져서는 안 되겠지요."
10039160-127 = "혹시 무슨 문제라도 있으신가요?"
10039160-128 = "[s] \"그, 혹시……\""
10039160-133 = "(미식연구회에게 자초지종을 설명하고 도움을 구했다.)"
10039160-136 = "과연……"
10039160-137 = "그런 문제라면 잘 찾아주셨군요."
10039160-138 = "저희 미식연구회만큼 그런 경험이 풍부한 동아리도 얼마 없을 테니까요."
10039160-141 = "맞아! 잘 찾아왔다구!"
10039160-142 = "특히나 노점 거리라면 내 전문 분야지!"
10039160-143 = "저희가 도움이 될 수 있겠는걸요☆"
10039160-144 = "응! 헤헤, 내 취향인 음식이 있으면 좋겠다."
10039160-145 = "[s] \"아, 짚고 넘어가야 할 부분이……\""
10039160-151 = "[ns] \"혹시, 여기서도 마음에 안 드는 음식점은 폭파할 거야……?\""
10039160-152 = "흠, 그건 생각해 보지 않았는데요……"
10039160-156 = "요식업에 종사하는 이들이라면 평가 기준에 미치지 못할 때 응당 대가를 치러야겠지만, 아마추어인 학생들이 만든 음식에 평가 기준을 그렇게까지 냉혹하게 적용할 필요는 없을 것 같습니다."
10039160-157 = "맞아! 우리는 그냥 맛있는 걸 먹고 싶을 뿐이라고!"
10039160-158 = "[s9] \"다행이다……\"\n[s10] \"게헨나 학생이 트리니티 교내에서 그런 일을 하면 꽤 큰 문제가 될 수 있으니까……\""
10039160-161 = "저희의 '심판'에는 시간과 장소의 구분이 없습니다만……"
10039160-166 = "걱정하시는 상황이 발생하지 않도록 최대한 노력해 보지요."
10039160-167 = "[s] \"정말 고마워!\""
10039160-170 = "……"
10039160-180 = "……"
10039160-182 = "서, 선생님…… 이분들은?"
10039160-183 = "[s] \"내가 아는 한 최고의 전문가들이야.\""
10039160-185 = "[ns] \"……아마도.\""
10039160-190 = "모두 게헨나의 학생들이신데…… 괜찮겠죠……"
10039160-194 = "잠깐. 저 사람들…… 그 테러리스트들 아냐?"
10039160-195 = "응? 뭐라고?"
10039160-202 = "……어? 그러고 보니……?"
10039160-203 = "서, 설마 그…… 미식연구회?!"
10039160-204 = "우리 학교에 침투해서 아쿠아리움의 자랑이었던 골드 마구로를 탈취했다던 그……!"
10039160-205 = "D.U 지구에서 수많은 음식점을 폭파시켰다는 테러리스트 집단……!!"
10039160-207 = "어머, 우리 소문이 평범한 학생들에게까지 퍼졌나 보네요."
10039160-208 = "후후, 이미 알고 계시다니 이야기는 빠르겠어요☆"
10039160-209 = "자, 얼른 여기서 만든 음식을 줘!"
10039160-211 = "서, 선생님?!"
10039160-212 = "[s11] \"나를 믿어줘.\"\n[s12] \"오늘은 테러가 아니라, 컨설팅의 달인이 되어줄 테니까.\""
10039160-215 = "그쪽 사정은 잘 들었습니다."
10039160-216 = "이곳까지 오는 동안 주변 상권을 둘러보고 파악해 보니, 몇 가지 문제점이 보이더군요."
10039160-217 = "저희의 가정이 맞다면, 몇 가지 확인을 거친 후 어떤 솔루션을 드릴지 결정할 수 있을 듯합니다."
10039160-222 = "……어? 꽤 전문적인 느낌……"
10039160-223 = "일단 대전제를 위해 이곳에서 판매하는 음식의 수준 체크가 필요합니다."
10039160-224 = "들어보니 퀄리티에는 꽤 자신이 있으시다고요?"
10039160-225 = "그, 그래…… 요! 이 정도면 맛은 나쁘지 않다고 생각해…… 요……"
10039160-227 = "그렇다면, 저희가 맛을 보고 객관적인 판단을 내려보도록 하겠습니다."
10039160-228 = "그 부분에 있어서 미식연구회는 키보토스 제일의 전문성을 가진 집단이라고 할 수 있으니까요."
10039160-229 = "응응! 맞아! 맛에 대한 평가는 엄격하다구!"
10039160-230 = "아니, 너는 빼야지……"
10039160-232 = "맛에 문제가 있다면 그에 걸맞는 솔루션을 드릴 것이고, 그게 아니라면 저희가 파악한 문제점에 대한 해결책을 드리도록 하지요."
10039160-234 = "아, 알겠어…… 요. 잠깐만 기다려주세요!"
10039160-239 = "기대되네요~ 모두 좋아하는 음식들이라서."
10039160-240 = "적당히 먹어야 돼…… 시식한다고 거덜 내면 할 말 없어지니깐."
10039160-244 = "자……! 이, 일단 여기 야키소바부터……"
10039160-249 = "음. 그럼……"
10039160-258 = "[ns] \"왜 내가 긴장될까……\""
10039160-264 = "좋아요. 이 정도면 합격이군요."
10039160-269 = "이, 이얏호! 통과했다!"
10039160-270 = "……잠깐. 내가 왜 기뻐하고 있지?"
10039160-272 = "미식이라고 할 수는 없지만, 학생이 운영하는 노점 음식으로는 꽤 괜찮은 수준입니다. 과연 선생님 말씀대로 맛에는 문제가 없군요."
10039160-274 = "그, 그렇다면……"
10039160-275 = "뭐, 뭐가 문제인 거죠……?"
10039160-277 = "후후, 저희가 생각한 해결책을 제안드리겠습니다."
10039160-278 = "해결책이라면……!"
10039160-282 = "준코 씨, 설명을 부탁해도 될까요?"
10039160-284 = "좋았어!"
10039160-288 = "자, 내가 볼 때는 홍보에 문제가 있다고 생각해."
10039160-289 = "음식 맛은 좋지만 손님이 적다……"
10039160-290 = "이런 현상은 보통 이런 곳이 존재한다는 사실을 고객들이 '알지 못할 때' 발생하거든."
10039160-292 = "호오…… 과, 과연……"
10039160-293 = "요즘 맛집이라는 곳들은 홍보도 열심히 한다고?"
10039160-294 = "그, 그렇다면 어떻게 홍보를 할 수 있을까요?"
10039160-295 = "가게에 따라 다르지만, 이런 학교 축제 노점에는 SNS를 활용하는 방법이 가장 간단하고 성과도 좋지!"
10039160-296 = "학생들은 보통 SNS로 정보를 얻으니까."
10039160-300 = "자, 여기 봐. <트리니티 사육제>를 검색했을 때 노출되는 게 중요해. 이렇게 노점에 대한 정보를 올리면서 각종 태그를 덧붙여! 그래야 많이 검색되니까!"
10039160-305 = "SNS……! 메모, 메모……"
10039160-307 = "이렇게 찾아온 학생들이 자체적으로 SNS에 리뷰를 쓰게끔 유도해 보는 것도 좋겠네요~"
10039160-308 = "어, 어떻게요?"
10039160-309 = "리뷰 작성 시, 서비스로 음료수를 준다거나 하는 방법이 있죠."
10039160-310 = "오……! 그, 그럼 저 같아도 할 것 같아요."
10039160-311 = "[s] \"역시 경험의 차이인가…… 미식에 관련된 일에는 일반 학생들과 시야가 다르네.\""
10039160-316 = "그럼 솔루션대로 해보자고!"
10039160-317 = "오옷! 관건은 홍보라 이거지! 좋았어!"
10039160-322 = "후후, 그럼 이대로 경과를 볼까요."
10039160-329 = "오, 여기가 그 노점 거리야? 뭐가 엄청 많네!"
10039160-330 = "저쪽의 야키소바가 그렇게 맛있다던데? 매운맛 도전해 볼까?"
10039160-331 = "저희 야키소바 2인분 주세요!"
10039160-336 = "어서 오세요~! 얼른 맛있게 해서 드리겠습니다!"
10039160-338 = "목도 조금 마른데…… 음료수도 먹자!"
10039160-343 = "아, 음료수는 SNS에 리뷰를 작성해 주시면 무료로 드리고 있어요!"
10039160-348 = "엣, 정말요? 어떻게 할까?"
10039160-349 = "정말 무료예요? 리뷰 쓸게요! 헤헷."
10039160-351 = "네에, 감사합니다~! 여기, 시원한 음료수 두 잔 나왔습니다!"
10039160-355 = "여기! 구운 옥수수 하나 주세요!"
10039160-359 = "넵! 여기 있습니다! 감사합니다~!"
10039160-368 = "여기 닭꼬치 여덟 개! 소금 반, 간장 반으로!"
10039160-370 = "네, 넵! 주문이 밀려서, 잠시만 기다려주세요!"
10039160-375 = "[ns] \"사람이…… 엄청나게 많아졌어!\""
10039160-376 = "한창 출출할 시간대를 노려서 SNS에 다발적으로 게시글을 올리길 잘했네요."
10039160-377 = "좋아, 좋아! 아주 잘 작동하는데? 사육제 태그로 검색해 봤더니 노점 거리 언급량이 계속 늘어나고 있어."
10039160-378 = "리뷰도 대부분 호평이네요. 미식의 경지에 다다르지 않았어도, 학생 수준에서 이 정도면 준수한 퀄리티니까요."
10039160-380 = "힝, 초콜릿 우메보시 타코야키도 만들었으면 더 좋았을 텐데."
10039160-381 = "아쉽긴 하지만 다른 먹을 것들도 많으니까!"
10039160-382 = "[s] \"대단한데, 미식연구회!\""
10039160-384 = "후후, 그간 쌓여온 미식에 대한 경험은 결코 거짓말을 하지 않아요."
10039160-385 = "만드는 건 어렵지만, 컨설팅 정도라면 못 할 것도 없지!"
10039160-386 = "이대로 가다가는 준비한 재료가 부족할지도 모르겠네요☆"
10039160-387 = "이쯤에서 저희도 식사를 해볼까요?"
10039160-388 = "응! 좋아! 슬슬 배가 고파오던 참이었거든!"
10039160-389 = "[s] \"좋아, 내가 사줄게! 마음껏 먹어!\""
10039160-393 = "어머…… 정말요?"
10039160-397 = "[ns] (지갑을 확인한다……)"
10039160-398 = "후후…… 걱정마세요, 선생님. 오늘은 적.당.히. 할 테니까요?"
10039160-399 = "[s] \"으, 으응……\""
10039160-401 = "(컨설팅이 끝난 후, 노점 거리는 대성황을 이루었다.)"
10039160-405 = "(특히, '미식연구회가 폭파시키지 않은 점포'라는 소문이 주효했던 것 같다……)"
