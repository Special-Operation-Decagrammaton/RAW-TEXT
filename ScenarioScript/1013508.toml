[translation]
1013508-1 = "사람이 사는 곳?"
1013508-3 = "아, 오셨군요."
1013508-4 = "정말이지, 이게 사람 사는 곳인지 뭔지……."
1013508-5 = "[s] \"도와줄게.\""
1013508-6 = "네?"
1013508-7 = "네, 뭐……. 감사합니다. 혼자보다는 역시 둘이 낫겠죠."
1013508-12 = "하아……. 모모이는 어지럽혔으면 어지럽혔지 뭘 치울 리가 없고"
1013508-13 = "미도리는 한번 시작하면 잘 치우고, 생활력도 가장 좋지만, 평소에는 일러스트레이터라 그런지."
1013508-14 = "나서서 뭔가를 많이 어지르지는 않지만, 청소하는 횟수 자체가 좀 적고요 ……."
1013508-15 = "유즈는…… 그래도 이제 무작정 숨고 보는 빈도는 줄어들었지만, 게임 아니면 코딩만 하고 있고……. 아리스는……."
1013508-19 = "아리스가, 걱정입니다……."
1013508-20 = "그나마 네 명 중에서는 두 번째로 생활 관념이라는 게 있기는 한데, 결국 사람은 주위와 닮아가는 존재고, 주위에 있는 사람들이라는 게……."
1013508-21 = "아뇨, 뭐. 그 셋이 나쁘다는 건 아닙니다. 오히려 착하다고 할 수 있죠. 그렇지만……."
1013508-30 = "에휴. 그나마 좀 나아졌네요."
1013508-31 = "내기할 수 있습니다. 이거 3일 가면 오래 간 거겠죠."
1013508-32 = "[s] \"3일인가……. 그렇구나…….\""
1013508-33 = "네."
1013508-34 = "……."
1013508-35 = "……?"
1013508-36 = "잠깐만요, 선생님."
1013508-37 = "[s] \"왜, 왜 그러니. 케이 쨩.\""
1013508-38 = "지금 뭔가 시선을 피하신 것 같은데요?"
1013508-39 = "[s] \"그거야말로 오해라고 할 수 있겠군요. 케이 씨.\""
1013508-40 = "'케이 씨……?'"
1013508-41 = "……."
1013508-42 = "선생님."
1013508-43 = "제 눈 보시죠."
1013508-44 = "[s] \"시, 싫어! 나는 굴복하지 않을 거야!\""
1013508-45 = "제 얼굴 똑바로 보라고요!"
1013508-46 = "[s] \"크윽……!\""
1013508-47 = "자, 이제 가슴에 손을 얹고 대답해요."
1013508-48 = "평소에, 잘 치우고 사세요?"
1013508-49 = "[s] \"……!\""
1013508-54 = "거기 서요! 지금 행동으로 다 짐작됐으니까 서라고요!!!"
1013508-58 = "……."
1013508-59 = "[s] \"…….\""
1013508-60 = "선생님."
1013508-61 = "[s] \"으, 응?\""
1013508-62 = "이게 사람 사는 곳입니까, 돼지우리입니까."
1013508-63 = "사람 사는 곳이라고 대답하시면 양심이 없는 거고, 돼지우리라고 대답하시면 사람이 아닌 겁니다."
1013508-64 = "10초 드립니다. 변명 시작."
1013508-65 = "[s1] \"들어 봐, 케이 쨩! 내가 다 설명할 수 있어!\"\n[s2] \"원래 청소나 집안일이라는 건, 해도 해도 끝이 없는 법이야!\""
1013508-68 = "그래서요."
1013508-69 = "[s] \"오늘 해냈다 싶으면, 다음날 똑같이 그만큼 쌓여 있지!\""
1013508-70 = "계속 말해 봐요."
1013508-71 = "[s3] \"그러니까 하고 싶은 마음이 들 때 한 번에 해치우는 게!\"\n[s4] \"후련한 느낌도 들고, 합리적이지 않을까!\""
1013508-77 = "뭔 어딘가의 시꺼먼 주관적 합리주의자 같은 소리를 하고 앉아 있습니까, 이 양반아!!!"
1013508-78 = "죽어요! 그냥 죽으라고요!!! 여차하면 제가 같이 죽어 줄 테니까 이 따위로 살 거면 죽으라고!!!!!"
1013508-84 = "정말이지, 내가 왜……."
1013508-90 = "그래도 리오 방보다는 조금 낫긴 한데, 그게 자랑은 아니고……."
1013508-94 = "이러다가 먼지로 기관지나 폐가 상하면 어쩌려고……. 폐는 손상되면 회복도 안 되는데……."
1013508-101 = "후우……."
1013508-102 = "그러면, 선생님?"
1013508-103 = "[s] \"넵.\""
1013508-104 = "한 마디?"
1013508-105 = "[s5] \"잘못했습니다. 감사합니다.\"\n[s6] \"죄송합니다. 망극합니다.\""
1013508-108 = "……알면 됐어요."
1013508-109 = "다음에 또 어지르면……!"
1013508-113 = "……."
1013508-114 = "어차피 어지르겠죠……."
1013508-115 = "혼자서 고생하지 말고, 저나 불러요."
1013508-116 = "[s7] \"……?!?!\"\n[s8] \"도와, 주는 거야……?\""
1013508-119 = "뭐요. 왜요. 뭐요."
1013508-120 = "혼자보단, 그나마 둘이 낫잖아요."
1013508-124 = "[ns] \"역시, 역시……!\""
1013508-125 = "역시……?"
1013508-126 = "아뇨, 잠깐. 그거 금지랬죠. 그 흐뭇하면서도 능글능글한 웃음."
1013508-127 = "사람 말을 좀 들어요! 이상한 소리 하기만 해 봐요!!!"
1013508-128 = "[ns9] \"케이 쨩은 귀엽구나!\"\n[ns10] \"케이 쨩은 귀엽구나!!\"\n[ns11] \"케이 쨩은 귀엽구나!!!\""
1013508-132 = "으그아아아아아아아악!!!!!"
