[translation]
1902-1 = "선도부 비정기 회계감사"
1902-2 = "선도부 대회의실"
1902-3 = "……이상이 다음달에 있을 선도부 전술 훈련의 계획안입니다."
1902-4 = "우리 만마전이 제시했던 훈련 계획을 고사하고 대신 짜온 게, 이거다?"
1902-5 = "……이쪽이 합리적이라고 판단했습니다."
1902-6 = "해당 훈련에서 사용하고자 하는 예산의 결산서는 이미 제출이 완료된 것으로 알고 있으며, 만마전의 확인 후, 결재를 요청하고자 합니다."
1902-7 = "흐음, 과연, 그렇군. 선임행정관의 말대로 그 예산결산서도 이미 확인하긴 했지."
1902-8 = "그럼……."
1902-9 = "허나 거절한다."
1902-10 = "네……? 예산결산서에서 반려될 사유는 없을 터인데요."
1902-11 = "그건 확실히 그럴지도 모르지."
1902-12 = "그런데 왜……."
1902-13 = "그래도 기각한다."
1902-14 = "……만약 결산서의 내용이 부족했다면 다시 재작성해서라도."
1902-15 = "아니, 아니야. 어떤 식으로 예산안을 새로 짜오던 간에, 불허. 각하다."
1902-16 = "……이유는요?"
1902-17 = "예전부터 선도부의 각종 활동에 들어가는 예산을 보다 정확히 파악할 필요가 있다고 생각했지."
1902-18 = "그도 그럴게, 어디서 어떻게 착복하고 있을지 모르잖아?"
1902-19 = "(당신이 말하는 건가요. 지금? 누구보다 게헨나의 예산을 낭비하고 있는 당사자가?!)"
1902-20 = "크, 크흠. 어머나. 그 말씀은 그럼……."
1902-21 = "뭐, 그러니 우리 쪽에서 이번 기회에 선도부에 회계감사를 파견할까 해서 말이야."
1902-22 = "잠깐, 그런 걸 멋대로……!"
1902-23 = "멋대로가 아니야. 최근엔 선도부에서도 제법 불협화음이 난다고 알고 있는데?"
1902-24 = "예를 들자면 선도부장도 아닌, 어딘가의 행정관이 독단적으로 병력을 운용하고 있다……라던가."
1902-25 = "……!"
1902-26 = "키시시싯! 표정이 보기 좋은데!"
1902-27 = "(매번 중요한 건 죄다 놓치면서, 이럴 때만 얄밉게 저런 소리라니. 큭……!)"
1902-28 = "명심하라고. 아마우 아코. 만마전은 모든 걸 알고 있다는걸!"
1902-29 = "중요한 순간에만 번뜩이는 너구리 자식이……!"
1902-30 = "(뭔가 오해가 있었던 거 같은데요. 좀 더 서류를 검토 해보시길 바랍니다.)"
1902-31 = "앗, 바뀌었다."
1902-32 = "흐, 흥……! 좋아."
1902-34 = "자! 어디 목을 씻고 기대하고 있으라고, 이번에 제대로 털어줄 테니 말이야."
1902-39 = "……하?"
1902-43 = "이로하. 일이다."
1902-44 = "네, 부르셨나요. 마코토 선배."
1902-45 = "지금부터 선도부의 회계감사를 명한다! 가서 확실하게 녀석들의 뱃속 밑바닥까지 싸그리 싹싹 파헤치는 거다!"
1902-46 = "예산을 쥐락펴락하며 선도부 녀석들의 콧대를 납작하게 만들어주라고! 우리 만마전의 무서움을 만천하에 떨쳐라! 이로하!"
1902-47 = "……귀찮아."
1902-48 = "어, 어? 이, 이로하……?"
1902-49 = "하아, 네. 알겠습니다. 일이란 말이죠. 그것도 회계감사."
1902-50 = "음! 그래! 선도부 따윈 해치워버려!"
1902-51 = "해치우는 게 아니라 회계감사지만요."
1902-52 = "키시시싯……. 선도부 녀석들, 이번 기회에 그야말로 뼛속까지 탈탈 털어서, 다시는 우리 만마전에게 기어오르지 못하도록 엿을 먹여……."
1902-53 = "예에, 그런가요."
1902-54 = "저기……. 일단 말은 끝까지 듣고 답하라고……."
1902-56 = "……하는 이유로, 선도부를 회계감사하러 왔어!"
1902-57 = "하아……. 귀찮아."
1902-58 = "마코토 선배가 맡긴 일이니까. 열심히 할게!"
1902-61 = "자, 잠깐! 너무 갑작스럽잖아!"
1902-62 = "훈련이 코앞이잖아요? 당장 준비를 시작해도 빠듯한 마당에 회계감사라니……."
1902-63 = "아코 쨩. 이게 어떻게 된 거야?! 하필 업무 때문에 부장도 자리를 비운 이런 때에!"
1902-66 = "……큿."
1902-67 = "반발하셔도 어쩔 수 없습니다. 이는 만마전 상부에서 내려온 지시이니까요."
1902-68 = "……뭐, 좋아요. 어차피 빈틈은 없습니다. 그렇게 허술하게 관리하고 있지도 않아요."
1902-69 = "오히려 이번 기회에 만마전의 불합리한 요구를 클리어할 수 있다면, 저희 선도부는 거리낄 게 없다는 뜻이 되니까요."
1902-70 = "자, 어디 한 번 마음대로 해보시라구요!"
1902-71 = "아코 쨩. 의욕이 넘치는 건 좋지만……."
1902-72 = "선임행정관이 저렇게 확신에 찼을 때가 제일 불안하단 말이죠."
1902-75 = "그럼 시작하겠습니다."
1902-76 = "가장 먼저 살펴볼 곳은……."
1902-77 = "……선도부 본부 건물이로군요."
1902-79 = "게헨나 선도부 본부 복도"
1902-80 = "복도는 왜? 여기서 뭐 볼 게 있다고."
1902-81 = "아……. 흠."
1902-82 = "뭐, 뭐야? 뭣 때문에 그래?"
1902-86 = "만마전에서 배부하고 있는 정기 신문이 게시되어있지 않군요."
1902-87 = "이 부분에서 감점입니다."
1902-88 = "네?!"
1902-89 = "뭐야, 그게?!"
1902-90 = "……하아."
1902-92 = "게헨나의 교칙에 따르면, 주기적으로 교내의 소식을 전달하기 위해, 만마전에서 배포하는 정기 신문은 반드시 어떤 건물이라도 게시판에 게시 되어있어야 합니다."
1902-93 = "그런 교칙이 있었다고?!"
1902-94 = "저저번달에 마코토 선배가 발의한 교칙이니까요. 아직 현장에는 미처 전달이 이루어지지 않았을 수도 있지만."
1902-95 = "……교칙은 교칙이기 때문에."
1902-96 = "포, 폭거다!"
1902-97 = "전술훈련의 예산을, 이쪽으로 변경하도록 하지요."
1902-98 = "사유는 '게시판 정비' 정도로 해둘까요."
1902-99 = "크, 크읏……."
1902-101 = "그럼 다음입니다."
1902-103 = "게헨나 선도부 본부 2F 탕비실"
1902-104 = "이곳은 평소에도 선도부원들이 사용하는 탕비실이에요. 이곳까지 조사하는 건가요?"
1902-105 = "네, 교칙에서 정해 놓은 탕비 물품을 제대로 구비해두었는가. 혹시 유통기한이 지난 물품을 아직도 방치하고 있지 않은가."
1902-106 = "이런 부분들을 조사하게 되겠습니다만. 숫자를 속이는 것으로, 분식회계가 이루어질 수도 있기 때문에."
1902-107 = "그거라면 정말로 문제가 없으니까요!"
1902-108 = "으음~ 이로하 선배~"
1902-109 = "이부키? 무슨 일인가요?"
1902-110 = "여기, 코코아는 없어?"
1902-113 = "과연……. 없네요. 이것도 마이너스로군요. 손님에게 대접하기 위한 품목이 다양하질 못하다니. 이것도 예산 용도를 변경하겠습니다."
1902-115 = "하아?! 대, 대체 누가 코코아를 마신다고?!"
1902-117 = "언제 어떤 손님이 방문할지 모르는 이상. 각종 취향에 대응하기 위해 물품을 구비해두는 건 상식……."
1902-118 = "'그러니 그 부분을 집중적으로 걸고 넘어져라-'라는 것이 마코토 선배의 말씀입니다."
1902-119 = "뭐야, 뭔가 흘려 들을 수 없는 말이 나온 거 같은데?!"
1902-120 = "뭐, 기분 탓일 겁니다. ……내가 왜 이런 일을. 하아……."
1902-121 = "그럼 다음으로……."
1902-124 = "……."
1902-126 = "(그 뒤로도 이로하는 무자비하게 선도부의 예산을 삭감, 또는 용도를 변경해 나갔다.)"
1902-128 = "이것도, 저것도, 요것도, 그것도……."
1902-129 = "삭감, 변경, 삭감, 제거, 삭제, 삭감, 또 삭감입니다."
1902-130 = "!!!"
1902-131 = "……(절레절레)"
1902-132 = "마, 말도 안 돼! 하, 항의하겠어! 클레임이다!"
1902-133 = "그렇게 말씀하셔도 곤란합니다. 저는 일개 공무원이기에."
1902-134 = "선도부에 악의가 있는 것은 아닙니다만. 네, 어디까지나 중간관리자로서……."
1902-140 = "(그렇게 약 3시간의 회계감사가 이어진 끝에.)"
1902-142 = "여기까지 해서……. 기존 전술훈련 예산결산서의 약 95%의 예산을 새로 배정했습니다."
1902-143 = "이, 이건 아무리 봐도 억지잖아! 훈련에 쓸 예산이 형체도 안 남았잖아!"
1902-144 = "이렇게 되면 다음 훈련의 진행은 역시……."
1902-145 = "그리고 이것만이 끝이 아니라, 또……."
1902-149 = "흥~ 흐흥~"
1902-150 = "앗. 거기, 조심하세요……!"
1902-156 = "이부키……?!"
1902-157 = "아, 아얏! 히, 히잉……."
1902-158 = "괜찮나요. 이부키! 어디 다친 데는 없어요?!"
1902-159 = "그, 방금 엄청 크게 넘어진 거 같은데, 괜찮아?"
1902-160 = "히, 히끅. 이, 이부키는 괘, 괜찮아……. 으. 응……. 훌쩍."
1902-164 = "……이번 전술훈련은 물론, 다음 분기에 있을 전술훈련의 예산집행도 전부 취소하도록 하지요."
1902-166 = "뭐?! 갑자기, 왜?!"
1902-167 = "이유가 뭐죠?"
1902-168 = "……이부키를 울렸으니까."
1902-169 = "이젠 핑계조차 대지 않는 거냐!"
1902-170 = "이부키는 중요하니까요."
1902-171 = "우으……. 앗, 그거, 마코토 선배가 맨날 했던 말이다!"
1902-172 = "하지만, 여긴 사무실이라고! 어디든 물건이 있는 거야 당연하다고!"
1902-173 = "저희가 온다는 걸 알았으면 미리 치워 둬야 했습니다. 아마, 이부키가 다친 걸 알면……."
1902-174 = "'배려가 부족하여 이쪽의 감사원이 다쳤다.' 라고 마코토 선배는 길길이 날뛰면서 말할 테죠. 그래서 미리 말해두는 겁니다."
1902-175 = "……나중에 말이 나와서, 다시 이곳을 찾아오는 건 귀찮으니까."
1902-176 = "회, 횡포다!"
1902-177 = "이렇게 되었으므로, 올해 선도부의 예산안을 아예 제로부터 다시 짜야 하니 관련된 서류의 제출을 부탁드립니다."
1902-180 = "키키키. 바로 그거다! 이로하, 잘 해주었다! 회계감사가 제대로 이루어진 모양이군!"
1902-181 = "……마코토 씨."
1902-182 = "이제 잘 알겠지? 만마전이 본격적으로 나서면 이렇게 되는 거야. 아코 선임행정관."
1902-183 = "큭……."
1902-184 = "더 이상 무의미한 반항은 그만두라고. 아마우 아코. 슬슬 자신들의 위치가 무엇인지 알 때도 됐잖아?"
1902-185 = "선도부 따위, 우리 만마전의 하수인일 뿐이라는 것을 말이다!"
1902-186 = "내가 곧 최고! 이 지고지순하고도 당연한 진리를 가슴 깊이 받아들인 채 감복해라!"
1902-187 = "너희는 개처럼 내 앞에서 배를 내밀고 엎드리면 되는 것이다!"
1902-188 = "……그러니까 그냥 회계감사라니까요."
1902-189 = "어쨌거나 이것으로 예산안은 다시 재배정하는 것으로 결론을 내리고. 지금부터는 그 처리를 위해, 행정적인 절차를…… 이미 안 듣고 있는 건가요."
1902-191 = "……같은 일이, 오늘 있었던 참입니다만은……."
1902-192 = "(힐끔)"
1902-193 = "아아, 내가 자리를 비운 사이에 그런 일이 있었단 말이지……."
1902-194 = "……하아, 그 너구리놈들……. 어지간해선 다시 보고 싶지 않았지만. 어쩔 수 없지."
1902-195 = "부, 부장……?"
1902-196 = "부장, 님?"
1902-199 = "잠시, 다녀오겠어."
1902-203 = "(그 후, 어째서인지 갑자기 만마전 본부의 귀퉁이가 폭발과 함께 무너져 내리고, 그 뒤를 이어 총소리가 들려왔다는 전설이 전해져 오지만,)"
1902-204 = "(그건 또 다른 이야기…….)"
1902-205 = "선도부 비정기 회계감사"
