[translation]
90001045-3 = "게부라의 움직임이 느려졌어. 토키!"
90001045-4 = "네, 리오 님. 가겠습니다!"
90001045-12 = "이번에는 효과가 있어! 그렇다고 할까…… 갑자기 얼음을 깨고 들어갔는데?"
90001045-13 = "……후퇴했군요. 놓친 것은 아쉽게 되었네요."
90001045-18 = "그렇지만 저희 역시 정비가 필요한 것은 사실입니다."
90001045-19 = "게부라, 시그널 로스트. 엄청난 속도네. 그것도 있지만."
90001045-22 = "……."
90001045-28 = "……."
90001045-29 = "안녕, 리오 회장. 여러 가지 의미로 효율적인 등장이네. 최적의 타이밍이었어."
90001045-33 = "그런데, 부장은 괜찮아?"
90001045-34 = "……거기에서 왜 저에게 묻는지 의도를 모르겠지만, 전 완전 괜찮거든요? 샘난다거나 좋은 장면을 뺏겨서 부럽다거나 절대 그런 감정 안 느끼거든요?"
90001045-35 = "무엇보다 저는 완전히 관대하니까 말이죠? 알고 있죠, 에이미?"
90001045-36 = "응. 부장이 뭔가 토라졌다는 건 잘 알았어."
90001045-37 = "그러니까 숨 쉬듯이 저에 대한 음해를 반복하는 건 그만둬 주세요!"
90001045-42 = "아무튼, 여기에서는 표면적이고 의례적인 인사부터 시작하도록 하죠."
90001045-43 = "반가워요, 리오. 잘 지냈어요?"
90001045-46 = "나는……."
90001045-47 = "제가 분명 표면적이고 의례적인 인사부터 시작하자고 했던 것 같은데요……?"
90001045-52 = "[ns] \"이럴 때는 같이 인사해 주자, 리오.\""
90001045-53 = "아, 알았어. 그러면……."
90001045-54 = "모두, 잘 있었어? 그…… 반갑네. 응."
90001045-55 = "네. 저도 진심으로 그렇습니다. 리오 님."
90001045-56 = "아침에는 잘 일어나고 계십니까? 예전처럼 밤을 새다가 오후 늦게서야 눈을 뜨시는 것은 아니시고요?"
90001045-57 = "!?!?"
90001045-58 = "다른 웬만한 생활은 여전히 가사 보조 기기들의 도움을 받으실 수 있겠습니다만, 라이프 사이클만은 그러기 힘드니까요."
90001045-59 = "그, 그게……."
90001045-60 = "……노력하고 있어."
90001045-62 = "(어째, 회장과 토키가 어떤 모습으로 같이 살았는지 보이는 것 같네…….)"
90001045-68 = "자, 자! 이제 슬슬 본론 같은 것으로 들어가도록 할까요?"
90001045-69 = "가령 지금까지 왜 밀레니엄으로 돌아오지 않고, 어딜 그렇게 숨어 다니고 있었느냐는 이야기부터 말이죠."
90001045-70 = "그건……."
90001045-71 = "무엇보다 어느 세미나의 회계께서, 당신에게 여러 가지로 할 이야기가 많다는 것 같기도 하고요?"
90001045-72 = "?!"
90001045-73 = "거기에 이렇게 결정적인 순간을 노려 모습을 드러내다니, 그것도 뭔가 마음에 걸리네요."
90001045-74 = "혹시 제대로 된 활약 같은 게 없으면 돌아올 명분이 없다든가."
90001045-75 = "돌아가기 위해서는 그에 걸맞는 실적이 필요하다든가 하는, 당신 같은 생각 하고 있는 거 아니죠?"
90001045-79 = "……나는, 이름 없는 신들의 힘이 남긴 흔적들을 추적하고 있었어."
90001045-80 = "이름 없는 신들의, 힘이요?"
90001045-81 = "그래. 그날…… 키보토스에 현현했던 그 힘은 사건이 끝난 이후로도 사라지지 않고 계속해서 흔적을 남기고 있었거든."
90001045-82 = "그 과정에서 너희들과 이렇게 만나게 될 줄은, 나도 예상하지 못했지만."
90001045-83 = "(이름 없는 신들의 힘이 남긴 흔적을 추적하는 과정에서, 결과적으로 데카그라마톤의 예언자와 마주치게 되었다……?)"
90001045-87 = "나는 여전히…… 키보토스에 일어날 이상 현상을, 방지하고 대비하고 싶어. 초현상특무부를 만든 것처럼……."
90001045-88 = "나는, 말로 하는 건 잘 못 해. 아마도 그런 것 같아. 그러니까, 내가 할 수 있는 일에 충실하고 싶었어."
90001045-89 = "어쩌면 그게, 내가 할 수 있는…… 반성 같은 것이기도 할 테니까."
90001045-91 = "……"
90001045-92 = "좋아요. 다 알겠는데, 한 가지만요."
90001045-93 = "초현상특무부의 일, 처음에는 모두 저에게 떠넘기고 사라지지 않았나요? 거절하기 힘든 조건까지 붙여서."
90001045-94 = "너라면, 날 싫어하더라도 알아는 줄 거라고 생각했으니까."
90001045-95 = "……관점에 따라서는 그거 협박이라고 볼 수도 있는 일이거든요?"
90001045-96 = "[s3] \"자, 자. 우리 너무 그러지 말고요…….\"\n[s4] \"리오가 없었으면 우리 모두 큰일 날 뻔했잖아?\""
90001045-99 = "……네. 물론 저도 알고 있답니다."
90001045-100 = "물론 우리 모두는, 굳이 이번 일이 아니더라도 당신에게 어떤 의미에서 큰 빚을 하나 진 셈이기도 하고."
90001045-101 = "그러니까 그냥 명분이니 뭐니 이것저것 따지지 말고 당장 밀레니엄으로 돌아오라고 말하고 싶은 참이지만……."
90001045-102 = "응? 지금 잘 안 들렸어. 뭔가 말했어?"
90001045-103 = "아무것도 아니에요!"
90001045-104 = "그렇지만 지금 이 상황은, 어떻게 보면 회장의 뜻대로 초현상특무부와 함께 움직이게 된 셈이네."
90001045-105 = "그렇습니다. 거기에 저라는 우수한 에이전트이자 완벽한 메이드 역시 함께인 상황이죠."
90001045-106 = "……토키의 이런 반응은 제쳐 두고, 진정한 초현상특무부의 창시자로서 감회가 어때. 회장?"
90001045-110 = "……잘 모르겠네. 아직은."
90001045-111 = "그런 식으로 말할 줄 알았어요……."
90001045-112 = "그렇지만 지금 일어나고 있는 일이 심상치 않다는 것은 확실해. 그것이 키보토스에 어떤 영향을 끼칠지 역시도."
90001045-113 = "총체적으로, 당신이 무언가 알고 있다는 것은 확실히 알았어요."
90001045-114 = "그리고 우리들 역시 여기까지 오면서, 이런저런 일들을 알게 된 것도 있죠."
90001045-115 = "그러니 제안하죠. 서로 알고 있는 정보를 교환하는 게 어때요?"
90001045-116 = "그 의견에는 찬성이야. 그리고 정보 교환은…… 일단 게부라의 뒤를 쫓으면서 동시에 진행하는 게 합리적이라고 생각하는데."
90001045-117 = "그 의견은 타당하군요. 에이미. 게부라가 사라진 방향, 기억하고 있나요?"
90001045-118 = "응. 그런 거라면 문제없어. 기억하고 있으니까."
90001045-119 = "그렇다면 다시 신속하게 출발하도록 하죠. 가실까요. 선생님."
90001045-121 = "다음화;변수"
