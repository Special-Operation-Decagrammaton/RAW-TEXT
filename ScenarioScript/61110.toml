[translation]
61110-1 = "11화;현장학습 1"
61110-5 = "[ns1] \"오늘도 즐거운~\"\n[ns2] \"수업 시작~\""
61110-8 = "우와, 즐거운 수업이래. 자기도 안 믿는 거짓말 하는 거 봐 ……."
61110-9 = "저, 저도 열심히, 좀 더 공부해 왔어요오……."
61110-10 = "[s] \"아이고, 기특하다! 우리 히요리\""
61110-11 = "네? 헤, 헤헤……. 더 쓰다듬어 주세요……."
61110-12 = "왜냐하면 내일도 이렇게 될 거라는 보장은 없으니까요……!"
61110-13 = "마치 오늘 동쪽에서 해가 떴다고 해서, 내일도 동쪽에서 해가 뜰 거라고 100% 확실하게 말하지 못하는 것처럼요!"
61110-14 = "[s3] \"좋았어! 바로 그게 회의적 경험론이란다!\"\n[s4] \"의무론적 윤리까지도 이어지는 이론이지!\""
61110-17 = "아, 그 내용……! 선생님께서 주신 책에 나왔던 것 같아요……!"
61110-23 = "그러면 지금부터, 쪽지 시험을 볼게?"
61110-28 = "그게…… 뭐죠?"
61110-29 = "가만있어 봐. 쪽지…… 시험? 그러니까 이것도 시험인 건가?"
61110-35 = "그렇다. 아주 단순화되고 간단해진 시험이지."
61110-36 = "그러면 지금부터 문제를 불러 줄 테니까, 정답을 써 봐?"
61110-39 = "어, 어어……? 이거 분명 배웠던 건데……."
61110-40 = "으으, 왜 기억날 듯 말 듯한 거지……."
61110-43 = "아, 맞아! 모르면 물어보라고 했지? 야, 이거 정답 뭐냐?"
61110-44 = "그거? 그러니까……"
61110-46 = "거기, 컨닝 금지."
61110-48 = "컨…… 닝? 그건 또 뭔가요?"
61110-50 = "주위 사람의 정답을 보고 베껴 쓰거나, 답을 물어보고 가르쳐주는 행위야."
61110-52 = "하지만 모르면 물어보라고 했잖아요!"
61110-54 = "그건 공부할 때고……."
61110-56 = "공부와 시험은 다른 거였나요?! 충격적인데……."
61110-58 = "……우리 학교 애들이지만, 정말로 걱정된다……."
61110-65 = "[ns] \"뭔가.\""
61110-67 = "[ns] \"날씨가 좋구나…….\""
61110-68 = "무슨 소리세요. 하늘은 완전히 구름뿐인데."
61110-73 = "[ns5] \"감각과 의견은 주관적이니까…….\"\n[ns6] \"내가 좋다고 느끼면, 그런 게 아닐까…….\""
61110-76 = "그렇습니까……."
61110-77 = "그런데, 그래서요?"
61110-78 = "[s] \"날씨가 좋으면 뭔가 아깝잖아?\""
61110-79 = "맥락을 모르겠는데요……."
61110-83 = "[ns] \"오늘은 현장학습이다!\""
61110-84 = "그건 또 뭔데요?!"
61110-88 = "이래도…… 되나요……?"
61110-89 = "네? 교실에서는 배울 수 없는 것이 있다?"
61110-90 = "그리고 수업 시간에 하는 건, 모두 수업의 연장이다……?"
61110-91 = "되게 편리한 변명처럼 들리네요……."
61110-92 = "[s] \"사실 맞아.\""
61110-93 = "뭔가 치사하네요……."
61110-94 = "[s] \"그것이, 어른의 특권이지.\""
61110-95 = "선배? 안 앉으셔도 돼요? 계속 서 있기만 하시는데……."
61110-96 = "선생님도요. 다리 아프지 않아요?"
61110-97 = "괜찮습니다. 저는 끄떡없어요."
61110-102 = "……묘한, 기분이네요."
61110-103 = "'바깥'을, 다시 이런 식으로 나오게 되다니……."
61110-104 = "……."
61110-105 = "그런데 어째서인지, 그때와는 많이…… 다른 느낌이에요."
61110-109 = "윽……!"
61110-110 = "괜찮아요? 무슨 일이죠?"
61110-111 = "괘, 괜찮아요. 문제없어요. 조금, 그때 기억이 떠올라서요. 헤. 헤헤……."
61110-112 = "……."
61110-113 = "[s] \"그때 기억?\""
61110-114 = "……!"
61110-115 = "아무것도 아닙니다. 선생님. 그냥 일종의……"
61110-116 = "……."
61110-117 = "어젯밤, 마이아가 악몽을 꿨다고 하더라고요."
61110-118 = "[s] \"하지만…….\""
61110-119 = "괜찮습니다. 선생님."
61110-123 = "[ns] \"정말로?\""
61110-124 = "네."
61110-125 = "이 아이들의 상담은, 원래 제가 하고 있었던 일이었으니까요."
61110-126 = "네, 네에……. 마, 맞아요……."
61110-131 = "그런데 선생님. 우리 어디부터 가나요?"
61110-132 = "뭐가 뭔지 하나도 모르겠어요……. 일단 너무 눈이 부신 것 같기도 하고요……."
61110-134 = "……."
61110-135 = "뭐, 그런 부분은 선생님이 알아서 해 주시지 않을까요?"
61110-136 = "'현장학습'을 나가자고 한 것도, 선생님이었고요."
61110-137 = "[s] \"그럼, 그럼. 선생님만 믿으라고!\""
61110-138 = "저 건물은, 유리로만 지어진 건가요? 엄청 반짝거리네요……."
61110-139 = "우리 학교에서는, 저렇게 지었다면…… 진작에 깨지거나 더러워졌을 텐데……."
61110-140 = "……'스쿼드' 분들은, 이런 걸 거의 매일같이 봤겠죠……."
61110-141 = "같이 왔으면 좋았을 텐데."
61110-142 = "어쩔 수 없죠. 누군가는 아리우스를 지켜야 했을 테니까요."
61110-143 = "그런데, 지금의 스쿼드 분들에게 그런 걸 맡겨도 되는 걸까요, 선배……?"
61110-144 = "……."
61110-145 = "그것도, 선생님이 어떻게든 책임 져 주시겠죠."
61110-146 = "안 그런가요, 선생님?"
61110-147 = "[s] \"그럼, 그럼. 선생님만 믿으라고!\""
61110-148 = "……."
61110-149 = "하아……."
61110-151 = "(스쿼드는 아리우스를 지키고 있겠다고 하며, 일종의 집 지키기라는 명분으로 남았지만.)"
61110-152 = "(스쿼드가 현장 학습에 참여하지 못한 이유는, 사실 따로 있었다…….)"
61110-154 = "……이러니저러니 해도, 우리는 수배자 신세니까."
61110-155 = "그래. 운신의 폭이 제한되어 있다. 함부로 신상을 노출시키는 것은, 조심하고 싶어."
61110-156 = "……선생님과 현장학습, 해 보고 싶었는데……."
61110-157 = "헤, 헤헤……. 그래도, 어쩔 수 없겠죠……. 괜찮아요, 선생님. 나름대로 익숙하니까요……."
61110-162 = "오히려 자유롭게 움직일 수 있는 것이 우리 쪽이라니, 역설적이기도 하네요."
61110-163 = "그런데 말이죠. 언제까지 계속 숨어 다니면서 살아갈 생각인가요, '스쿼드'?"
61110-164 = "당신……!"
61110-165 = "……."
61110-166 = "그만둬라. 미사키."
61110-167 = "……칫."
61110-171 = "스쿼드 아이들에 대해 생각하고 계신가요?"
61110-172 = "[s] \"?!?!\""
61110-173 = "어떻게 알았느냐는 표정이시군요."
61110-174 = "티가 나거든요. 선생님은. 특히 그럴 때는요."
61110-175 = "……."
61110-176 = "한 가지 묻고 싶은 게 있는데요."
61110-177 = "스쿼드 아이들은 선생님에게 아리우스인가요, 아닌가요?"
61110-178 = "아뇨, 아뇨. 별 뜻은 없어요. 그냥 갑자기 궁금해져서요."
61110-179 = "[s] \"그, 그게…….\""
61110-183 = "어라, 사이가 좋아 보이는 선생님들이구만. 학생들 인솔하고 가르치느라 고생이 많네그려."
61110-184 = "네……?"
61110-185 = "!?!?!!!!!"
61110-186 = "그, 그게 무슨 말씀이신가요?!"
61110-187 = "이 반응은……? 아하, 그렇구만. 자네는 교육실습생인가? 선생님이 하시는 걸 보고, 잘 배워 두게나."
61110-188 = "서, 선생님!? 점점 오해가 커져 가고 있는데요?! 뭐라고 말 좀 해 보세요!"
61110-189 = "무슨 의미신가요, 그 사람 좋게 웃는 얼굴! 아, 아아아아, 아닙니다! 저희는 그런 게……!"
61110-190 = "허허, 나는 다 알 수 있다네. 이거이거, 눈치 없는 방해꾼은 사라져야 하겠구만."
61110-191 = "진짜! 아니라고요!!!"
61110-197 = "……."
61110-198 = "……."
61110-199 = "끝내준다아아아아아아!!!"
61110-200 = "이상하다……. 왜 건물이 다 멀쩡하지……."
61110-201 = "원래 건물은, 반쯤 무너져 있고 박살이 나 있는걸, 마지막까지 아끼고 고쳐 가며 쓰다가."
61110-202 = "결국 무너져 버리면, 그동안 고마웠다고 제사를 지내 주는 거 아니었나……?"
61110-203 = "[s] \"자, 이제부터 다 함께, 길 건너편으로 갈 거야~\""
61110-204 = "길 건너기? 이렇게 하면 되나……?"
61110-209 = "우왓?! 왜 붙잡으세요, 선생님?!"
61110-210 = "[s] \"빨간 불일 때 길을 건너면 안 된단다!\""
61110-211 = "그래요……?"
61110-212 = "여기선 그래야 하는 거구나 ……."
61110-213 = "하지만 우리, 그 정도로는 크게 안 다칠걸요? 우리들, 제법 튼튼해서요."
61110-214 = "네? 자동차와 운전자의 입장도 폭넓게 생각해 주자고요? 알 것 같기도 하고, 모를 것 같기도 하고……."
61110-219 = "수, 수영장……?"
61110-220 = "여긴 대체 뭐지……?"
61110-221 = "수영이라는 운동을 하기 위해, 오직 그 목적으로만 지어진 체육 시설이래."
61110-223 = "깨끗한 물이 이렇게 많아! 말도 안 돼!"
61110-230 = "어? 왜 또 그러세요, 선생님?"
61110-231 = "[s] \"수영장 물을 함부로 마시면 안 된단다…….\""
61110-236 = "하, 하지만 물이 이렇게 많은데요?!"
61110-237 = "배탈도 안 날 것 같고, 뭔가 신선한 냄새도 나고……."
61110-238 = "네? 이건 염소라는 소독약 냄새라고요?"
61110-242 = "물을 소독도 해요?!?!"
61110-248 = "높다아아아아아아–!!!"
61110-249 = "하늘 봐! 완전 파래!"
61110-250 = "강이란 건 저런 거구나……. 우와……."
61110-251 = "저게 다리라는 거지? 어떻게 지은 걸까……."
61110-252 = "[s7] \"자, 자. 신난 것도 좋지만, 주위에 폐가 되니까.\"\n[s8] \"우리, 너무 큰 소리로 떠들지 않기로 해요~?\""
61110-255 = "네~에!"
61110-259 = "왜 그러세요, 선생님? 갑자기 울려고 하시고."
61110-260 = "네? 말을 잘 들어줘서 너무 고맙다고요?"
61110-261 = "그리고 보니 신기하네요……. 예전에는 어른의 말 같은 거, 듣기도 싫었는데……."
61110-262 = "그거야 그땐 다들 때리고 협박하는 것밖에 하지 않았으니까……."
61110-264 = "이거 뭔지 알아! 햄버거야!"
61110-265 = "응, 먹어 본 적 있어. 선배가 가끔 사다 줬으니까."
61110-272 = "맛은 분명 똑같은데, 뭔가 느낌이 다르네……. 어째서일까……."
61110-273 = "먹고 있는 장소가 달라져서?"
61110-274 = "그건 그럴 수도 있겠다."
61110-279 = "[ns9] \"다들 잠깐! 스톱!\"\n[ns10] \"디스펜서에 입을 대고 음료수를 마시려 하면 안 돼!\""
61110-282 = "그, 그렇지만 자유롭게 가져가도 된다고 했잖아요……."
61110-283 = "다른 사람들도 디스펜서를 써야 하니까요?"
61110-284 = "……."
61110-285 = "생각해 보니까, 그건 그렇네요……."
61110-287 = "네? 줄을 잘 서 줘서 고맙다고요?"
61110-288 = "너무 당연한 걸 칭찬해 주셔도 조금 부끄럽거든요, 선생님?"
61110-289 = "맞아요. 배급받을 때 줄을 안 서거나 새치기를 하면, 정신을 잃을 때까지 처벌을 받았으니까요!"
61110-292 = "서, 선생님……? 여긴, 뭔가요……?"
61110-293 = "뭔가 엄청 시끄럽고, 번쩍번쩍하고……. 으아아……."
61110-294 = "네? 게임 센터라는 곳이라고요? 게임이란 건 또 뭐죠?"
61110-295 = "……."
61110-296 = "거, 거짓말하지 마세요, 선생님! 그런 게 세상에 있을 리 없잖아요! 즐거움만을 위한 전자 매체라니……!"
61110-297 = "그런데…… 그렇게 말하기에는 여기 있는 건 전부 그런 거 같은데……?"
61110-298 = "그, 그것도 그런데……! 잠깐만요. 이거 한 번 하는 데 돈이 들잖아요?! 세상에……!"
61110-299 = "그렇게 귀한 돈을, 이렇게 즐거움만을 위해 쓰는 게 옳은 것일까요……?"
61110-300 = "[s] \"걱정하지 마! 선생님이 다 내줄게!\""
61110-301 = "진짜요?!"
61110-309 = "저도 잘 이해가 안 가는데, 이게 왜 현장학습이죠……?"
61110-310 = "네? 함수라는 수학의 개념을, 몸으로 배우는 과정이라고요? 그게 뭔 소리십니까."
61110-311 = "……네? 네? 함수란 건 인풋이 들어가고 아웃풋이 나오는, 일종의 규칙과 대응이니까."
61110-312 = "내가 입력하는 것이 어떤 결과로 이어지는지 직관적으로 학습할 수 있는 게임 센터야말로……."
61110-313 = "함수 개념을 몸으로 익히는 데 적합한 장소, 라고요?"
61110-314 = "……."
61110-315 = "제가 들어 본 이야기 중에서, 가장 창의적이고 참신한…… 헛소리였던 것 같네요……."
61110-316 = "예? 세상에는 더 황당한 헛소리가 많다고요? 들으면 바로 뒷목을 잡고 쓰러질 만한 것도……?"
61110-317 = "……."
61110-318 = "그런 거라면 그냥, 경험 부족한 채로 남아 있겠습니다……."
61110-322 = "으아아아! 지금 뭐야! 말도 안 돼!"
61110-326 = "한 판만, 한 판만 더–!!!"
61110-328 = "[ns] \"으어어……. 힘들다…….\""
61110-330 = "고생 많으셨습니다. 선생님."
61110-331 = "일단은요."
61110-332 = "그래서 이 공원에서는 어떤 학습을 할 수 있나요?"
61110-333 = "쉬어야 할 때는 쉬는 게 좋다는 교훈, 이라고 하셨나요……. 네, 뭐. 틀린 말은 아니긴 하네요……."
61110-334 = "……아리우스의 '훈련' 중에도, 어떻게든 쉬는 시간은 확보하려고 했으니까요. 전투 휴식이죠."
61110-340 = "[ns] \"다들 기운도 좋구나…….\""
61110-341 = "선생님도 원하신다면 얼마든지 끼어드실 수 있는데요."
61110-342 = "여러모로 무리라고요? 네……. 그건 그럴 것 같네요."
