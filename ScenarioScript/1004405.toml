1004405-101 = "― 이걸 위해서,"
1004405-103 = "― 저를 이곳에 데리고 와 [wa:1000]주셨던 거네요?"
1004405-106 = "[wa:750]― 그러고 보니"
1004405-108 = "― 팸플릿에도 [wa:1050]적혀 있었던 거 같아요."
1004405-111 = "― '밤이 되면 [wa:1100]플랑크톤이 빛나서 [wa:1850]별처럼 반짝인다'고……."
1004405-113 = "[wa:50]― 정말 [wa:1650]예쁘네요."
