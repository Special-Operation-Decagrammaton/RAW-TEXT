[translation]
1004405-1 = "모래 위의 별들"
1004405-2 = "(잠이 잘 오지 않아 잠시 바람을 쐬러 나왔다.)"
1004405-5 = "(모두가 자는 밤이라 그런지, 풀벌레 소리만 들릴 뿐 전체적으로 고요했다.)"
1004405-9 = "[ns1] \"누군가 깨어 있나……?\"\n[ns2] 소리가 난 쪽으로 따라간다."
1004405-15 = "설마 했는데 역시 선생님이셨군요."
1004405-16 = "[s3] \"아, 역시.\"\n[s4] \"이 목소리는……!\""
1004405-22 = "후후후. 깜짝 놀래켜 드리려고 숨어 있었죠♡"
1004405-23 = "이런 밤중까지 무슨 일로 나오셨나요?"
1004405-24 = "뭔가 따로 하실 일이라도……?"
1004405-25 = "[s5] \"노노미를 따라왔지.\"\n[s6] \"나도 그냥 바람 쐬러 나왔어.\""
1004405-26 = "으음……. 그렇군요."
1004405-27 = "으음……. 그렇군요."
1004405-28 = "후훗. 저도 실은 좀처럼 잠이 잘 안 오더라고요."
1004405-32 = "……그러면 이왕 이렇게 된 거, 같이 좀 걸으실까요?"
1004405-37 = "음……."
1004405-38 = "……으음……."
1004405-39 = "[s7] \"……노노미?\"\n[s8] \"왜 그래?\""
1004405-44 = "아, 아뇨. 별건 아니고요."
1004405-45 = "그냥……. 잠이 안 오는 이유? 에 대해서 생각해 보고 있었어요."
1004405-46 = "뭐랄까……. 그냥 그런 느낌이네요."
1004405-47 = "왜인지는 잘 모르겠지만……. 뭔가 아까운 느낌……?"
1004405-48 = "이대로 자고 일어나면 내일이잖아요? 그럼 또 하루가 그렇게 없어지는 느낌이라서……."
1004405-49 = "정말 여기 온 뒤로는 매시간이 너무나 즐거운데, 그래서 그런지 반대로 아쉬움이 커지는 거 같아요."
1004405-50 = "제가 말하고도 무슨 뜻인지 잘 모르겠네요. 하하……."
1004405-51 = "……응?"
1004405-52 = "선생님? 갑자기 어딜 가시는 거예요?"
1004405-53 = "보여주실 게 있다고요?"
1004405-54 = "그치만 그쪽으로 가면 해변인데……?"
1004405-55 = "밤도 너무 늦었는데, 너무 멀리까지 나가는 건 아닐까요~? 후후후."
1004405-56 = "……네?"
1004405-57 = "선생님은 보호자니까 괜찮다고요?"
1004405-61 = "……확실히 그러네요."
1004405-67 = "좋아요. 노노미, 보호자님을 따라가겠습니다!"
1004405-72 = "……도착이네요! 해변가!"
1004405-76 = "으응~. 시원해……. 확실히 리조트 쪽보다 바닷바람이 시원하게 불어요."
1004405-77 = "무인도라 그런지 불빛 하나 없고……. 별들도 더 밝게 보이네요."
1004405-81 = "……선생님?"
1004405-82 = "[s] \"……노노미.\""
1004405-84 = "[ns9] \"반대편을 봐.\"\n[ns10] \"여긴 다른 데에도 별이 있어.\""
1004405-88 = "…………?"
1004405-93 = "…………!!!"
1004405-96 = "[wa:900]― 봐요, 선생님! [wa:1750]빛나요!"
