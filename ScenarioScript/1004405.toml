1004405-121 = "[wa:1350]― 농담이에요."
1004405-123 = "― 오늘 밤은 기분좋게 [wa:650]잘 수 있을 것 같아요."
1004405-126 = "[wa:700]― 감사합니다, [wa:1250]선생님."
1004405-128 = "― 정말로, [wa:1000]꿈만 같은 하루였어요."
