[translation]
13220-1 = "제22화;폭주 기관차"
13220-5 = "아아. 좋지 않은 소식이야. 곧 카이저 PMC 녀석들의 기차에 따라잡힐 거야."
13220-6 = "네……?!"
13220-7 = "응. 따돌리려고 하고 있지만 무리-였-어-"
13220-8 = "[s] \"그럼 이제 어떻게 해야 하지?\""
13220-9 = "……별수 없지. 우리가 저 녀석들을 막을 테니까, 너희는 그때 기차에서 내려서 목적지로 이동해."
13220-10 = "우오- 봉인된 비기- 열차 드리프트-"
13220-12 = "네? 그, 그치만……."
13220-14 = "<폐쇄 지구 섹터 35-9>는 여기서 걸어서 약 1시간 거리에 있어. 못 갈 정도는 아니야. 그리고 우리 걱정은 하지 말라고."
13220-15 = "응- 우리는 적당히 시간을 끌다가- 항복할 거-야-"
13220-17 = "……네, 알겠습니다."
13220-18 = "도움에 감사드려요, CCC 여러분들……."
13220-20 = "퍄햐햐하핫-! 뭔가 정의의 편 같은데? 우리 그런 사람들 아닌데?"
13220-21 = "아니야- 히어로- 맞음-"
13220-23 = "……그럼 정리하면 기차가 멈추는 즉시 밖으로 나간다는 거지?"
13220-24 = "응. 선생님은 내가 지킬게. 나한테 꽉 붙어줘."
13220-25 = "[s] \"알았어. 그럼 신세를 질게. 시로코.\""
13220-31 = "자아, 곧 충돌할 거야! 준비해!!"
13220-32 = "준비이이-"
13220-38 = "콰-앙-"
