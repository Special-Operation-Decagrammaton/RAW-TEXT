[translation]
10008125-3 = "아하하하! 펑! 하고 터져버렸구만!"
10008125-4 = "음! 역시 아직은 기체의 조정이 부족했나!"
10008125-5 = "레드! 성능과 출력을 좀 더 조정해야겠어!"
10008125-10 = "……저기 말이야. 매번 생각하는 거지만, 나만 혼자 엄청 열심히 일하는 거 같지 않아? 응? 내 착각이야?"
10008125-11 = "레드, 슬슬 연장 계약한 근무시간도 다 끝나갑니다마는, 여기서 연장하시겠습니까?"
10008125-12 = "어이쿠! 그럴 돈은 이미 Mk.1에 다 쏟아부었단 말이지!"
10008125-13 = "어쩔 수 없지. 여기서 모두 작전상 후퇴다!"
10008125-14 = "하지만 여기서 물러난다고 끝이라고 생각하지 마라! 앞으로도 우리들의 투쟁은 끝나지 않는다!"
10008125-16 = "무한히 회전하는 레일은 이윽고 정의의 미래로 이어진다!"
10008125-17 = "무한초밥전대 카이텐져 퇴-장!"
10008125-23 = "아, 아니……. 그게 그러니까……. 결국엔……."
10008125-24 = "우리들의 새전은 몽땅 날아가 버린 거냐고!!"
10008125-25 = "아, 아루 님! 저, 전 괜찮으니까요! 돈은 다, 다시 벌면 되니까요!"
10008125-26 = "하아……."
10008125-28 = "아하하핫!! 결국 이렇게 끝나버리는 거네!!"
10008125-29 = "……이제 돌아가도 되는 거지?"
10008125-30 = "[s] \"……응.\""
10008125-32 = "(그렇게 연말과 새해 첫날을 장식한 대소동은 막을 내렸다)"
