[translation]
61100-1 = "제10화;상처와 흔적"
61100-2 = "오늘 일을 비롯해서 상담하고 싶은 것이 있는데, 괜찮을까?"
61100-3 = "[s1] \"응. 물론이지. 뭐 좀 마시면서 이야기할래?\"\n[s2] \"페트병 밀크티나 보리차 정도밖에 없지만.\""
61100-6 = "으, 응……."
61100-8 = "(잠시동안 우리는 나란히 앉아, 페트병의 음료를 마셨다.)"
61100-9 = "(사오리는 어딘가 긴장하고 있는 것처럼 보였다…….)"
61100-11 = "[ns] \"그러고 보니 오늘 수업, 대단했어.\""
61100-12 = "그, 그래?"
61100-13 = "선생이라도 첫 수업에서 그렇게 잘할 수는 없을 거라고?"
61100-14 = "그렇게, 너무 띄워 줘도 곤란하지만……."
61100-15 = "진심, 이라고? 선생의 안목은 역시 틀리지 않았던 것 같았다?"
61100-16 = "으, 으음……."
61100-17 = "교관 같은 것은 이전에도 해 봤으니까, 그럴 수 있었던 것이 아닐까 한다……."
61100-18 = "그리고, 새삼스럽지만, 나부터가 공부를 많이 해 둬야 한다고 생각했지."
61100-19 = "음? 원래 누군가를 가르치면서, 자기가 더 많이 배우는 법이다?"
61100-20 = "가르치는 과정에서, 자기 안에 있는 지식들이 정리되곤 하니까?"
61100-21 = "후후. 그렇군. 확실히 나도 느꼈다. 안개처럼 뒤섞여 있던 것들이, 말끔하게 형태를 이루는 느낌이더군."
61100-22 = "거기에 또 하나가 있다고?"
61100-23 = "[s] \"응. 나도 너희들로부터 많이 배우곤 하니까.\""
61100-24 = "그건…… 잘 모르겠는데?"
61100-25 = "미숙한 자를 가르치는 것이, 교사라는 직업 아닌가?"
61100-26 = "[s] \"나도 결국은 그저 미숙한 인간일 뿐이거든.\""
61100-30 = "[ns3] \"그렇기 때문에 나이를 먹으면서 놓쳐 왔던 것들을…….\"\n[ns4] \"아직 그걸 갖고 있는 너희들에게서, 배우는 거야.\""
61100-33 = "그렇…… 군?"
61100-34 = "그렇다면 그건 지금의 나는 알 수 없는 것이겠지."
61100-35 = "그 역시 때가 되면 알게 될 거라고?"
61100-36 = "후후. 지금 여기, 아리우스에 온 선생은 어딘가, 약간이지만……"
61100-37 = "'꼰대'처럼 느껴지는군."
61100-38 = "[s] \"쿠헉! 쿨럭! 으으윽……!\""
61100-39 = "왜, 왜 그러나, 선생?! 갑자기 상태가 나빠지기라도 한 건가?"
61100-40 = "어, 어어? 지금의 반응은 피할 수 없는 사실에 직격당했을 때 나오는, 자연스러운 정신적 비명이라고……?"
61100-41 = "미, 미안하다. 나는 그 단어를 사용해 보는 것이 처음이어서……."
61100-42 = "그것도 어딘가를 급히 지나가다 흘려들은 것이라……."
61100-43 = "[s5] \"그러나 틀린 말은 아니지……. 그래…….\"\n[s6] \"키보토스에서 선생이 꼰대가 아니면…… 누가 꼰대겠어…….\""
61100-46 = "저, 정말로 미안하다! 아무리 선생이 괜찮다고 해도, 내가……!"
61100-47 = "내가……."
61100-48 = "……."
61100-50 = "(다시 사오리의 목소리가 잦아들었다.)"
61100-51 = "(음료수를 목으로 넘기는 소리가, 몇 번 울렸다.)"
61100-52 = "선생."
61100-53 = "다른 의미에서, 미안하다."
61100-54 = "……후후. 뜻을 알기 힘든 사과만 반복하게 되는군."
61100-55 = "이래서야 마치 크루즈에서처럼, 계속 사과만 하다가 이야기가 끝이 나지 않겠어."
61100-56 = "후우……."
61100-57 = "선생. 지금부터 나는…… 선생에게, 엄청나게 실례되는 부탁을 하게 될지도 모른다."
61100-58 = "그렇지만 다른 뜻은 없다. 오히려……."
61100-59 = "……이제서야 내가 저지른 일과, 드디어 마주 볼 결심이 섰기 때문이다."
61100-60 = "여기에 와서야 비로소, 내가……."
61100-61 = "선생에게 제대로 된 '사죄'를, 지금까지 한 번도 하지 않았다는 사실을 깨닫기도 했고."
61100-62 = "[s7] \"정말로 신경 쓰지 않아도 되는데…….\"\n[s8] \"그때도 그러려던 것 같아서, 일부러 그렇게 말하기도 했고…….\""
61100-65 = "그때……?"
61100-67 = "뭔가, 이곳에 오니까."
61100-68 = "여러 가지 의미로…… 옛 생각이 나서, 말이지."
61100-69 = "……."
61100-70 = "그, 선생?"
61100-71 = "……."
61100-72 = "나는 역시, 아직 선생에게 제대로 된 사과를–"
61100-73 = "[log]\"맞아! 트리니티로 편입한 아이들 말인데!\"[/log]"
61100-77 = "그랬던가……. 확실히 선생이 부자연스럽게 말을 끊은 느낌이기는 했다."
61100-78 = "그렇지만……."
61100-79 = "선생. 면목 없지만, 지금은 약간만…… 내 고집에 어울려 줬으면 한다."
61100-80 = "이것은 분명히 내가 딛고 나아가야 할, 나의 '과거'라고 생각한다. 왠지 모르게 그런 생각이 들고 있다."
61100-81 = "여기, 아리우스에서 그 일과 마주 보지 않으면 어째서인지…… 아리우스 아이들을 볼 낯도."
61100-82 = "내가 이 이상 나아갈 자신도, 없어질 것 같아."
61100-83 = "[s] \"알았어. 그렇게 할게.\""
61100-84 = "으음."
61100-85 = "그렇다면."
61100-89 = "선생의 배를, 보여줄 수 있을까?"
61100-90 = "[s9] \"?!?!?!?!\"\n[s10] \"사오리 씨!!??!!??\""
61100-93 = "아, 아니! 분명 그 비슷한 반응이 나올 것 같기는 했지만!"
61100-94 = "그래서 앞서 많은 이야기를…… 어떻게든, 해 두려고 한 것이기도 하지만……."
61100-95 = "……."
61100-96 = "내가."
61100-97 = "선생에게 입힌 [ruby=상처]흔적[/ruby]을, 내 눈으로…… 확인하게 해 줬으면, 한다."
61100-98 = "[ns] \"……!\""
61100-100 = "(사오리의 말뜻을, 그제서야 알아차렸다.)"
61100-101 = "(사오리가 부탁한 대로, 배의 흔적을 보여주었다…….)"
61100-103 = "아……."
61100-104 = "이것이……."
61100-105 = "……."
61100-108 = "(사오리의 손끝이, 흉터를 조심스럽게 어루만졌다.)"
61100-109 = "(그 손은 만져지는 쪽에서도 알아차릴 수 있을 만큼, 엄청나게 떨고 있었다.)"
61100-111 = "미안…… 하다……."
61100-112 = "미안……."
61100-113 = "죄송……."
61100-114 = "죄송, 합니다……."
61100-115 = "죄송합니다. 죄송합니다. 죄송합니다."
61100-116 = "정말로, 정말로, 어떻게 해야……."
61100-117 = "선생님……."
61100-118 = "선생, 님……."
61100-119 = "나 같은 건……."
61100-120 = "내가, 감히……."
61100-121 = "윽……."
61100-122 = "흐윽……. 읏……."
61100-123 = "으으, 으아아아, 아아아아아아……!"
61100-125 = "(엎드리듯 무너진 사오리의 어깨에.)"
61100-126 = "(살며시, 손을 얹었다.)"
61100-128 = "[ns] \"괜찮아.\""
61100-129 = "선, 생……?"
61100-130 = "[s11] \"괜찮아. 다 나았어.\"\n[s12] \"이제 아프지도, 어떻지도 않아.\""
61100-133 = "하지만, 하지만……!"
61100-134 = "흉터는, 남았잖아……!"
61100-135 = "이제 알고 있어. 알고 있다고!"
61100-136 = "모든 행위는 결과를 남겨! 상처는 절대 원래대로 돌아가지 않아!"
61100-137 = "어떤 식으로든 흔적을 남기고, 그 사건이 일어난 시점부터 영원히, 미래까지 계속해서 영향을 끼친단 말이야……!"
61100-138 = "차라리……"
61100-139 = "차라, 리……."
61100-140 = "[s13] \"아무것도 하지 않는 게 좋았다는 말은, 하지 않았으면 해.\"\n[s14] \"그런 슬픈 말을 내 학생이 하는걸, 나는 바라지 않아.\""
61100-143 = "선생……?"
61100-144 = "[s15] \"네 말이 맞아. 사오리.\"\n[s16] \"어떤 상처는 아마도, 좀처럼 낫지 않겠지.\""
61100-147 = "읏……!"
61100-148 = "[s17] \"하지만 사람은, 흔적이 남더라도.\"\n[s18] \"그것과 함께 살아갈 수 있을 만큼은…… 강한 생물이야.\""
61100-151 = "그것과, 함께……?"
61100-152 = "……."
61100-153 = "그게, 사람이 살아가는 방법이라는, 건가……?"
61100-154 = "하지만……."
61100-155 = "나는, 잘 모르겠어……."
61100-156 = "정말로, 정말로…… 아무것도, 모르겠어……."
61100-157 = "내가 만든 것과 마주치면, 조금은 나아갈 수 있을 줄 알았어……."
61100-158 = "내 눈으로 그걸 바라볼 용기를 가지면, 나 스스로를…… 용서할 수 있게 될 줄 알았어……."
61100-159 = "하지만, 그건……."
61100-160 = "내 멋대로의, 오만이었던 것 같아……."
61100-161 = "[s] \"있잖아, 사오리.\""
61100-162 = "……응?"
61100-163 = "[s19] \"만일 사오리가 그때로 돌아가서\"\n[s20] \"그때의 사오리와 만날 수 있다면, 뭐라고 할 거야?\""
61100-173 = "……."
61100-174 = "후후."
61100-175 = "신기한 일이군."
61100-176 = "나도 수십 번은, 그 비슷한 생각을 했던 것 같은데."
61100-177 = "……."
61100-178 = "단 하루도, 후회하지 않은 날이 없었지."
61100-179 = "어떤 미숙하고 멍청한 애송이가, 말도 안 되는 범죄를 저질렀던 거야."
61100-180 = "자기가 저지른 일이 어떤 영향을 끼칠지, 그것으로 얼마나 많은 사람들의 오늘이 파괴될지."
61100-181 = "할 수 있다면, 그 애송이와 정말로 이야기하고 싶어."
61100-182 = "이야기하기 전에, 뺨 한 대 정도 제대로 때려 붙여 준 다음에."
61100-183 = "네가 지금 무슨 짓을 하려는 건지 알고 있냐고."
61100-184 = "제대로 정신 차리지 않으면, 너는…… 정말로 되돌이킬 수 없는 길을 가게 될 거라고."
61100-185 = "……."
61100-186 = "하지만, 그럴 수 없어."
61100-187 = "그 멍청한 애송이는 사라졌고, 남아 있는 건 지금 여기의 나야."
61100-188 = "그러니까 적어도, 그 사실을 짊어지고 계속 살아갈 수밖에 없는 거지."
61100-189 = "그게 전부야."
61100-190 = "……."
61100-191 = "그래. 그게 전부야."
61100-192 = "[s] \"그걸로 괜찮아, 사오리.\""
61100-193 = "선생……?"
61100-194 = "[ns] \"응. 그걸로 괜찮아.\""
61100-196 = "[ns] \"세상 모두가 너에게 죄가 있다고 한다면.\""
61100-197 = "음? 그건 역시 나에게 죄가 있다는 뜻인가?"
61100-198 = "[s21] \"아니야!\"\n[s22] \"내가 말하고 싶은 건 말이지!\""
61100-201 = "같은 상황에서, 더 나은 선택을 할 수 있게 되었고……."
61100-202 = "행동하기 전에, 한 번 더 생각할 마음이 생겨났다면, 선생은 그걸로 만족한다……?"
61100-203 = "그것만 약속해 줄 수 있다면, 선생은 언제나……."
61100-204 = "몇 번이라도……."
61100-205 = "으, 읏……."
61100-209 = "(사오리는 천천히 무너져, 어린아이처럼 울기 시작했다.)"
61100-210 = "(그 울음이 가라앉을 때까지, 등을 쓰다듬으며 위로해 주었다…….)"
61100-212 = "그러고 보니, 아리우스 아이들에게서 조금 달라진 점을 발견했다."
61100-213 = "[s] \"달라진 점?\""
61100-214 = "음."
61100-215 = "이것도 첫 수업 이후로 조금 거리가 가까워져서,"
61100-216 = "쉬는 시간에 이런저런 이야기를 나눌 수 있게 된 덕분이지만."
61100-217 = "이전에 비해, 생활이 상당히 나아진 것 같았다."
61100-218 = "'워터 타임'도 '티 타임'이 되었다고 하고, 적어도 먹는 건 잘 먹고 있는 것 같고."
61100-219 = "건물이나 시설은 보다시피 이런 정도이지만……"
61100-220 = "뭔가, 외부로부터 자금이나 물자가 들어와 순환하기 시작하고는 있는 것 같다."
61100-221 = "그 자금의 출처나 흐름까지는…… 아직 잘 모르겠지만."
61100-222 = "어쨌든, 아리우스에 뭔가 변화가 생긴 것은 확실하다."
61100-223 = "……생각해 보면, 당연한 것이겠지."
61100-224 = "그 모습 그대로 그 자리에 남아 있는 것이, 무엇이 있을까."
61100-225 = "[s] \"불안해?\""
61100-226 = "잘 모르겠다. 그렇지만……."
61100-227 = "아이들의 생활이 나아진 걸 보니, 조금은 안심이 되더군."
61100-228 = "……"
61100-229 = "선생."
61100-230 = "우리에게도, 희망이 있을까."
61100-231 = "[s23] \"이제부터 만들어 가면 돼.\"\n[s24] \"벽돌을 쌓을 때는 아득해 보이지만.\"\n[s25] \"그 구조물은 어느새 완성되어 있는 법이니까.\""
61100-235 = "……그런가."
61100-236 = "나는, 선생과 만나서 다행인 것 같다."
61100-237 = "선생이 있어 줘서…… 정말로 행운이었어."
61100-238 = "만일 선생이 없었다면 나는……."
61100-239 = "우리는 아마도……."
61100-243 = "선생. 만에 하나, 라는 측면에서 묻는 것이지만."
61100-244 = "……."
61100-245 = "오늘, 같이 자도 될까?"
61100-246 = "[s] \"?!?!!!\""
61100-247 = "후후. 그렇게 놀라지 말아 줬으면 한다. 농담이었으니까."
61100-248 = "[s] \"농담을 안 하던 사람이 하면, 파괴력이 두 배란다…….\""
61100-249 = "그런가. 앞으로 참고하도록 하지."
61100-250 = "[s] \"혹시 나 지금 자폭한 거?\""
61100-251 = "후후. 어떨까."
61100-252 = "그러면…… 으음. 편한 자리는 아니겠지만……"
61100-253 = "나는 이만 가 보도록 하지."
61100-254 = "[s] \"사오리도 잘 자.\""
61100-258 = "(사오리가 문을 닫고 나온 뒤, 문에 기대어 중얼거렸다.)"
61100-259 = "농담이라고는, 이야기했지만."
61100-260 = "절반은, 진심이기도 했는데 말이지."
61100-261 = "후후."
61100-262 = "푹 쉬길 바란다. 선생."
61100-267 = "서, 선배? 주무시나요……?"
61100-271 = "어라, 마이아? 무슨 일인가요? 어서 와요."
61100-272 = "아, 아뇨! 그, 괜찮으신가…… 해서요……."
61100-273 = "오호? 설마 오늘 스쿼드와 선생님에게 져 버려서, 자존심에 상처를 받아 속만 끓이고 있을 거라고 생각했나요?"
61100-274 = "아, 아아아아아 아니에요, 선배! 제가 그런 생각을 할 리가…… 전 그런 게 아니라!"
61100-275 = "괜찮아요. 그렇게 생각해도 어쩔 수 없죠."
61100-276 = "아니라니까요!"
61100-277 = "아하하하. 미안해요. 왠지 이런 말을 해 보고 싶어져서요. 그리고 저는 괜찮답니다."
61100-278 = "저, 정말요……?"
61100-279 = "네. 정말요. 이런 말을 지금 꺼내기에는 어떨지 모르겠지만."
61100-281 = "……아리우스의 증오는, 고작 그 정도로 사그라지지 않을 테니까요."
61100-282 = "……!!!"
61100-283 = "그러고 보니, 수업 어땠나요?"
61100-284 = "네? 수업, 이요? 그게……."
61100-285 = "선배, 는요……?"
61100-286 = "이런, 질문에 질문으로 대답하면 서로 곤란해진답니다. 예전에 이야기했잖아요."
61100-287 = "죄, 죄송합니다. 선배!"
61100-288 = "하지만 너무, 뭐라고 해야 할까……."
61100-289 = "처음 겪는 일이기도 하고, 경황이 없기도 하고, 뭐가 뭔지 아직 잘 모르겠기도 하고."
61100-290 = "그래도……"
61100-291 = "신기, 했어요."
61100-299 = "바깥세상은, 그런 식으로 만들어져 있구나."
61100-302 = "우리는…… 확실히, 다른 세계였구나."
61100-308 = "아니, 아니네요."
61100-309 = "지금도…… 다른 세계지요."
61100-310 = "……그렇죠."
61100-311 = "그래도 예전보다는, 이것저것……."
61100-312 = "적어도 먹는 건 잘 챙길 수 있게 됐으니까, 우리도 조금씩 나아지고 있는 것이 아닐까요?"
61100-313 = "맞아요! 저도 그게 제일 좋아요!"
61100-314 = "그, 그런데…… 사실 조금 궁금했던 건데……"
61100-315 = "간식이라든가 식사라든가, 모두 돈이 필요한 거잖아요?"
61100-316 = "하지만 어떻게……"
61100-317 = "……."
61100-319 = "정말 알고 싶나요, 마이아?"
61100-320 = "네? 네에……."
61100-321 = "알고 난 다음에는, 어떤 것들을 절대 예전과 같이 바라볼 수 없게 될지도 모르는데…… 그래도 괜찮나요?"
61100-322 = "그렇게 무서운 일이었어요?!"
61100-323 = "아뇨, 아뇨. 농담이에요. 미안해요."
61100-324 = "선배애~"
61100-325 = "하지만…… 지금껏 몰랐던 것들을 알게 되면."
61100-326 = "사안에 대한 시야가 바뀌는 것은, 어쩔 수 없는 일이죠."
61100-327 = "……네. 선생님이 오늘 했던, 공부처럼 말이에요."
61100-328 = "선배……?"
61100-329 = "변화에는 돈이 필요합니다. 그건 어쩔 수 없는 일이에요."
61100-330 = "사람은 모두 자기 생활이 나아지기를 바라고, 재화는 슬프게도 대개 한정적이죠."
61100-336 = "그래서 경쟁이 생기고, 다툼이 일어나고……."
61100-342 = "누군가는 버려진 채, 그 자리에 있었다는 사실조차 지워져, 잊히곤 하죠."
61100-343 = "……마치, 우리들처럼요."
61100-344 = "알고 있나요? 키보토스에는 아리우스만 할 수 있는……"
61100-345 = "아리우스만의 독보적인 경쟁력을 내세울 수 있는, '업무 분야'가 있다는 것을요."
61100-346 = "독점 시장이란 좋은 거예요. 부르는 게 값이거든요."
61100-347 = "네? 업무 분야요? 독점 시장? 아리우스만의 독보적인 경쟁력……?"
61100-351 = "서, 선배?!?!?!"
61100-354 = "좋아, 좋아. 돌아왔군. 잘 '처리'했겠지?"
61100-358 = "응? 이건 또 뭐야?"
61100-359 = "사, 살려주십시오! 살려만 주시면 뭐든지 하겠습니다! 목숨만은 제발……!"
61100-360 = "으, 으음……?!"
61100-361 = "……."
61100-362 = "어떻게 된 건가, 스바루 군. 나는 분명 확실하게 '처리'하라고 했던 것 같은데?"
61100-363 = "이 편이 더 나을걸요? 이제 이 사람은, 당신이 하는 말이라면 뭐든지 들을 테니까요."
61100-364 = "아니면 여기에서 두 탄창 정도만 더 머리에 꽂아 주면, 확실하게 '처리'되기는 할 텐데요."
61100-365 = "으아아아아악?! 제발, 제발 그것만은……!"
61100-366 = "……확실히, 그런 몰골이기는 하군. 그렇지만 이 자를 '처리'하지 않아서 내게 돌아오는 이득이 뭐지?"
61100-367 = "적어도 이제부터 이 사람의 모든 것은, 당신에게 귀속될 거라는 결과가 기다리고 있겠지요?"
61100-368 = "그렇습니다! 뭐든 다 드릴 테니 살려만 주십시오!!!"
61100-369 = "흐음……. 그런데 만일 이 자가, 만에 하나 다른 마음을 품으면?"
61100-370 = "그때는 대충, '아리우스를 부를 것이다.' 정도로 이야기해 두면 됩니다."
61100-371 = "히이이이익!!!"
61100-372 = "확실하군. 허나…… 만에 하나 자네가 더 높은 보수에 나를 팔아넘기겠다고 한다면? 용병이라는 건 그렇게 행동하는 경우가 많지 않나?"
61100-373 = "그런 건 하루 벌어 하루 사는 친구들이나 하는 거고요. 오히려 이 바닥에서 오래 있고 싶으면, 신용을 잘 지켜야 합니다."
61100-374 = "……어차피 규칙 밖에서 사는 몸이다 보니, '예측 가능한 자원'이 되어야 하는 게 용병이거든요."
61100-375 = "……."
61100-376 = "좋아. 자네의 말을 믿도록 하지. 수고 많았네."
61100-377 = "후후후후……. 이것으로 이 지역의 상권은, 완벽하게 우리 것이 되겠군……."
61100-378 = "(……아리우스 자체는 잘 알려져 있지 않고, 알고 있는 사람들은 그곳이 추악한 곳이라고 이야기하지만.)"
61100-379 = "(………'바깥'이 사실은 아리우스보다 몇 배나 추하다는 걸, 사람들은 알고 있을까.)"
61100-381 = "호, 혹시……."
61100-382 = "사람…… 죽였나요?"
61100-383 = "아직은요."
61100-384 = "다, 다행이에요. 정말로……!"
61100-385 = "그런데…… 그런데도 부르는 게 값이라는 일을……?"
61100-386 = "뭐, 거의 그 근처까지 만들어서 데려가면 되거든요. 그래서 오히려 일이 잘 풀리는 경우도 있고요."
61100-387 = "흔히 이런 말을 하죠. '사람은 변하지 않는다'고요."
61100-388 = "하지만, 항상 그런 것은 또 아니더라고요."
61100-389 = "죽음을 실감하면…… 사람은 변해요. 그렇게 될 수밖에 없죠. 그 변화의 방향성이 어느 쪽일지는, 저 역시도 알 수 없는 것이지만요."
61100-390 = "그런 의미에서 우리들 역시 이미 변해 있는 것일지도요? 죽음에 가장 가까이 있는 것은."
61100-392 = "우리들, 아리우스니까요."
61100-394 = "여기에서부터는 제 개인적인 생각이지만, 돈은 돈이에요."
61100-395 = "거기에는 깨끗한 것도 더러운 것도 없어요. 그런 걸 따질 수 있다면, 미안하지만, 아직은 여유가 있는 것이라고 생각합니다."
61100-396 = "……저라고 해도, 그런 일을 하다 보면 마음이 깨어지는 것을 느껴요."
61100-397 = "원래 사람은 사람 모양의 무언가를 공격하는 것만으로, 정신적인 충격을 받게 되니까요. 아마도 인간이란 그런 식으로 진화해 온 것이겠죠."
61100-398 = "네? 그럴 때는 어떻게 하냐고요?"
61100-399 = "……."
61100-401 = "여러분을 생각하곤 한답니다."
61100-402 = "여러분이 있으니까, 저 역시 살아갈 수 있는 것이라고요."
61100-404 = "……미안해요. 자주 챙겨주지 못해서."
61100-405 = "아, 아아아아, 아니에요! 오히려 저희가……. 선배야말로……."
61100-406 = "그래도 맛있게 먹고 잘 즐겨 줘서 고마워요. 그런 걸 볼 때마다 저도 힘이 나거든요."
61100-407 = "모든 사람이 공평하게 행복할 수 있다는 건…… 꿈같은 이야기겠죠."
61100-408 = "다른 누구도 아닌, 아리우스의 우리는 그 사실을 누구보다 잘 알고 있고요."
61100-409 = "그리고 세상 어딘가에는, 그런 아이들을 위한 자리도 있어야 하지 않을까 해요."
61100-410 = "여기는 그런 곳이고, 저는 그런 곳을 만들어 나가고 싶어요."
61100-411 = "버려진 아이들. 잊힌 아이들. 어디에서도 쓸모를 찾지 못한 아이들……."
61100-412 = "일단은, 여기로 오면 돼요. 뭐, 그렇다고 해서 다 몰려오면 조금 곤란하긴 하겠지만요. 여긴 좀 좁은 곳이기도 하고."
61100-413 = "……그야말로, 작은 새 둥지 같은 곳이니까요."
61100-414 = "그래도 지금은, 이 둥지를 지키고 싶어요."
61100-415 = "여기에 살고 있는 아기 새들이, 조금이나마."
61100-416 = "살아 있어서 다행이었다고 느낄 수 있는 곳을 만들고 싶어요."
61100-417 = "선배……."
61100-418 = "'마담'이 있었던 때, 기억해요?"
61100-419 = "윽."
61100-420 = "하하하! 네, 그거 정말 끔찍했죠! 잠깐 생각하는 것만으로 진저리가 쳐진다니까요!"
61100-421 = "……마담이 하지 못했던 것이 있어요."
61100-422 = "마담이 하려고 하지 않았던 것도 있고요."
61100-423 = "그것만이라도 제가 이룰 수 있다면, 그건 그 나름대로 나쁘지 않은 일이 아닐까 합니다."
61100-424 = "지금은…… 그 정도로, 괜찮은 것 같아요."
61100-425 = "……."
61100-426 = "선배."
61100-427 = "네?"
61100-428 = "하모니카 불어 주세요!"
61100-429 = "또, 또요? 이런 시간인데요?! 그리고 얼마 전에 불어 줬잖아요……."
61100-430 = "또 듣고 싶어요. 다들 좋아할 거예요!"
61100-431 = "정말, 다들 왜 그러는지 가끔은 모르겠다니까요……."
61100-432 = "크, 크흠…… 그러면……."
61100-433 = "헤헤……."
61100-451 = "이 하모니카 소리는…… 스바루, 인가."
61100-452 = "……."
61100-453 = "그 녀석도 정말, 변하지 않았군."
61100-454 = "음……?"
61100-458 = "뭐, 뭐냐? 누구냐!"
61100-463 = "으윽?!?!"
61100-467 = "(갑자기, 어둡고 숨 막히는 안개 속에 들어갔던 것 같은 느낌이…….)"
61100-468 = "(그리고 무엇보다…….)"
61100-470 = "그건, 나팔 소리……?"
61100-472 = "다음화;현장학습 1"
