[translation]
1009005-1 = "축제를 방해하는 아이들은 혼나야 해요!"
1009005-2 = "(우미카의 연락을 받고 백야당에 도착했다…….)"
1009005-7 = "[ns] \"실례합니다~\""
1009005-8 = "응? 누가 온 건가?"
1009005-9 = "상관없어! 오늘은 우리가…… 손님이니까!"
1009005-14 = "신난다!"
1009005-17 = "이야아아아앗호! 달려라! 좋구나!"
1009005-21 = "[ns] \"무, 무슨 일이야?!\""
1009005-22 = "어어?! 선생님?! 왜 지금 여기에……!"
1009005-23 = "무, 물론 제가 말씀을 드린 건 맞는데요……! 선생님이 와 주셨으면 했던 것도 맞고, 다 맞는데……!"
1009005-29 = "아아, 정말! 망량즈! 저 진짜 화낼 거니까요!?"
1009005-33 = "무슨 소리야, 백야당! 우린 지금 손님으로 와 있거든?"
1009005-34 = "분명 선불로 요금도 지불했잖아!"
1009005-35 = "그건 맞긴 한데요……. 으으으, 손님께는 최선을 다해 접객을 해야겠지만."
1009005-36 = "정작 그 손님이 이렇게 날뛰시면……!"
1009005-37 = "이대로는 가게가…… 백야당의 이름이……!"
1009005-38 = "[s1] \"음…… 분명 백야당은 서비스를 제공하는 곳이지만.\"\n[s2] \"손님 역시 그에 맞는 존중을 보여 줘야 하지 않을까?\""
1009005-44 = "그러니…… 존중을 보여 주지 않는 손님에게, 어느 정도의 '안내'를 하는 것도 접객의 일환일 수 있다고요……?"
1009005-45 = "무엇보다 그렇지 않으면 가게를 조용히 이용하고 싶은 다른 손님들에게도 민폐니까……?"
1009005-49 = "그렇…… 네요. 그렇군요. 그렇다면……!"
1009005-50 = "망량즈! 지금부터 백야당이라는 장소와, 그 전통과…… 무엇보다, 이 곳을 찾아 주실 또 다른 손님들을 위해서라도!"
1009005-54 = "저희 백야당의 진심이 담긴 '안내'와 '접객'을! 보여드리도록 하겠습니다!"
1009005-56 = "어? 뭐, 뭘 하려는 거야……?"
1009005-57 = "느낌이 안 좋은데……?"
1009005-62 = "손님들, 착석!"
1009005-68 = "어, 어어? 네에……?"
1009005-69 = "우앗?! 강제로 의자에 앉혀졌어……?"
1009005-84 = "찻잔, 녹차, 우롱차, 앞접시, 티슈, 냅킨! 모두 준비했습니다! 더 필요하신 것 없으실까요?!"
1009005-89 = "엄청나게 빨라! 그런데 조금도 흐트러지지 않았다고……?"
1009005-90 = "흐, 흥! 물수건이 없잖아!"
1009005-96 = "그럴 줄 알고 이렇게 준비하고 있었습니다!"
1009005-97 = "너무 많지 않아?!"
1009005-98 = "어, 그, 저기. 두 개면 충분한데……?"
1009005-99 = "직접 요청하셨으니 전부 필요한 곳에 사용해 주실 것이라고 믿습니다, 손님!"
1009005-100 = "덧붙여서, 백야당 밖으로 가져가시면 무단 반출에 해당하니까 말이에요?"
1009005-101 = "더 필요하신 것 없으실까요?"
1009005-105 = "으…… 어, 없어."
1009005-107 = "그렇다면 주문받겠습니다! 저희 백야당의 메뉴는–"
1009005-111 = "(우미카는 백야당의 모든 메뉴를, 상세한 설명을 덧붙여 가며 속사포처럼 쏟아냈다.)"
1009005-112 = "(망량즈, 아니, 손님들이 그것을 제대로 이해하고 있는지는 조금 다른 문제인 것처럼 보였다…….)"
1009005-114 = "으, 으으. 뭐가 뭔지 하나도 모르겠어. 어지러워……."
1009005-115 = "뭐가 뭔지는 알 수 있어야 주문을 할 거 아냐……."
1009005-116 = "아하, 아직 전부 이해하지 못하신 거군요? 그러면 처음부터 다시 한번 메뉴 설명을–"
1009005-120 = "아, 아냐! 안 그래도 돼! 우리가 어떻게든 주문을 해 볼 테니까……."
1009005-121 = "그렇다기보단, 저기, 잘못했어. 잘못했어요……. 안 그럴게……."
1009005-127 = "[ns] \"요 말썽쟁이 손님들. 조금 반성했나요?\""
1009005-128 = "네에……."
1009005-129 = "하지만, 여기에서 축제가 열린다는 마음에, 신이 나서 어쩌다 보니……."
1009005-134 = "[ns] \"응? 백야당에서 축제?\""
1009005-135 = "그, 3일 전부터 축제 자재들이 이곳으로 들어오기 시작했고 말이지?"
1009005-136 = "거기에 상인회와 기자재 담당자, 노점 출자 계약자와 이벤트 기획자……."
1009005-137 = "그 모든 사람들이 한 번씩 여기에 들렀다 나가기도 했고……."
1009005-138 = "당신들 무슨 스토커인가요?!"
1009005-139 = "아니, 우린 망량즈잖아. 백귀야행에서 열리는 축제에 대해서는 보통 거의 알고 있다고……."
1009005-140 = "하지만 지금부터 당분간은 축제가 없는 기간이란 말이야? 그런데 백야당에서 뭔가 축제를 준비하고 있다고 하니까……."
1009005-141 = "그, 그게! 당신들이 뭔가 잘못 알고 있는 거겠죠! 망량즈!"
1009005-142 = "아니야~ 그럴 리가 없다구~! 우린 뭐, 주위로부터 말썽꾸러기라는 평가를 받기는 하지만!"
1009005-143 = "그래! 백귀야행의 축제라면 진심이라고 자부할 수 있는! 망량즈란 말이야!"
1009005-147 = "으, 으으으으으으……!"
1009005-150 = "……."
1009005-152 = "제가 아니라면 아닌 줄 아세요!"
1009005-154 = "어, 어……? 우리, 뭔가 건드렸나……?"
1009005-155 = "표정이 심상치 않은데……?!"
1009005-156 = "……우리, 그만 갈까?"
1009005-157 = "그, 그럴까?! 메뉴도 맛있었고! 이만하면 충분히 놀았고!"
1009005-164 = "……."
1009005-168 = "죄송, 해요. 선생님. 이런 모습을 보여 드리게 될 줄은……."
1009005-169 = "[s3] \"그렇지만 어떤 의미에서는 망량즈도.\"\n[s4] \"축제를 즐기고 싶어 하는 학생들인데…….\""
1009005-172 = "그렇게 지나치게 나무랄 필요는 없었던 것 같다고요……?"
1009005-173 = "그건, 분명 그렇기는, 한데요……."
1009005-178 = "그, 그래도 이건 안 돼요!"
1009005-179 = "이 축제 준비만큼은…… 누구의 방해도 받을 수 없으니까요!"
1009005-180 = "[ns5] \"그런데, 당분간은 축제가 없는 기간이라던데……?\"\n[ns6] \"정말 또 다른 축제가 열리려는 중인 거야?\""
1009005-183 = "……!"
1009005-184 = "그, 글쎄요? 그건, 그러니까……!"
1009005-188 = "역시 아무것도 아니랍니다!"
1009005-189 = "[ns] \"하지만 망량즈는…….\""
1009005-190 = "아무것도 아니라니까요! 그보다 선생님! 뭔가 드시고 싶은 거 있으세요?!"
1009005-191 = "오늘은 특별히! 제가 대신 사 드릴게요! 뭐든지 말씀만 하세요!"
1009005-192 = "[ns] \"그러니까 축제…….\""
1009005-193 = "추, 축제 이야기는 이제 됐으니까요?!"
1009005-194 = "[s] \"우미카가 축제에 대해 그렇게 말하는 거, 처음 들어!\""
1009005-195 = "제가 봐도 저 자신이 어딘가 이상하다는 건 인정하겠는데요~!"
1009005-199 = "(그 뒤로 조심스럽게 우미카에게 '축제'에 대한 이야기를 꺼내 보았지만.)"
1009005-200 = "(그때마다 당황하며 필사적으로 얼버무리는 우미카의 모습만을 볼 수 있을 뿐이었다…….)"
