[translation]
10017060-1 = "제6화;작은(?) 아씨들"
10017060-2 = "키보토스 시내"
10017060-5 = "아직 멀었나요, 하나에 쨩?"
10017060-9 = "조금만…… 더 가면 돼요. 이제 거의 다 왔어요!"
10017060-10 = "하필이면 저희가 자선 활동을 하던 곳과 반대 위치여서……"
10017060-11 = "우우, 다른 날도 아닌 성야에 이런 일이 일어날 줄이야……"
10017060-12 = "아하하…… 성야가 아니더라도 구호기사단은 항상 모든 일에 준비되어 있어야 하지만요……"
10017060-13 = "제발 아무도 다치지 않았으면 좋을 텐데요……"
10017060-15 = "콰아아아아아아앙!!!"
10017060-19 = "꺄아악?!"
10017060-20 = "히이이이익!?"
10017060-21 = "이 폭음은 설마……?"
10017060-22 = "서두르는 게…… 좋겠죠, 선배?"
10017060-23 = "달리죠! 더 빨리!"
10017060-25 = "카페 <화이트&메이슨> 입구"
10017060-28 = "헉, 허억, 허억……!"
10017060-29 = "……죄송합니다, 츠루기 선배. 전…… 이 이상은 무리예요……"
10017060-34 = "키에에에……"
10017060-35 = "큭……! 과연 츠루기 부장. 트리니티의 전략병기라 불릴 만하군요."
10017060-36 = "크에에에에……"
10017060-37 = "그만…… 돌아가……"
10017060-38 = "그럴 수는 없습니다!"
10017060-39 = "왜…… 이러는 거지……?"
10017060-40 = "그럴 수가! 그만한 잘못을 저질러 놓고도 깨닫지 못한다는 건가요?!"
10017060-41 = "비극입니다. 실로 비극입니다! 설마 정의실현부가 이 정도로 추락했을 줄이야!"
10017060-42 = "지금의 정의실현부에게 필요한 것은, 좀 더 강도 높고 진심이 담긴 '구호'일지도 모르겠군요!"
10017060-43 = "키에에에에엑?!"
10017060-48 = "단장님!"
10017060-49 = "단장님……! 괜찮으세요?"
10017060-51 = "하나에, 세리나. 와 주었군요."
10017060-52 = "전 괜찮습니다. 아직 버틸 수 있으니까요."
10017060-53 = "쓴소리를 할 용기를 가진 자가, 비로소 친구를 자처할 수 있는 법입니다."
10017060-54 = "우리는 서 있어야 합니다! 우리의 진심이 저들에게 닿을 때까지!"
10017060-55 = "[s1] \"아, 츠루기 쨩이다.\"\n[s2] \"안녕, 츠루기 쨩.\""
10017060-58 = "서, 서서서서서서, 선생, 님?!"
10017060-61 = "(다, 다다다다다른 사람도 아니고, 선생님 앞에서 이런 모습을……?!)"
10017060-64 = "크켁, 키에에에에에에엑?!"
10017060-69 = "앗, 정의실현부 부장님이 갓 태어난 개미핥기처럼 안쓰러운 모습으로 쓰러졌어요!"
10017060-70 = "뭘 어떻게 하신 거예요, 선생님?"
10017060-71 = "[s3] \"아무것도 안 했습니다만?!\"\n[s4] \"거기서 날 의심하는 거야?!\""
10017060-75 = "이게 대체 무슨 소란이죠?!"
10017060-79 = "츠, 츠루기?! 정신 차려요! 무슨 일이 있었던 거죠? 왜 갓 태어난 개미핥기처럼……?"
10017060-80 = "드디어 나오셨군요. 하스미 부부장님."
10017060-81 = "구호기사단 여러분……? 그렇군요. 그렇게 된 것인가요."
10017060-82 = "크리스마스에 일어난, 구호기사단의 정의실현부 습격……"
10017060-83 = "이 일이, 자칫하면 정치적 문제로 비화될 수 있는 사안이라는 것 정도는 인지하고 계시겠죠?"
10017060-84 = "그러한 일까지 감수하면서, 정의실현부를 습격한 이유가 뭔가요. 구호기사단?"
10017060-85 = "답변 여하에 따라서는 정의실현부도 심각하게 대응할 수밖에 없을 것입니다……!"
10017060-87 = "네?! 그, 그런……"
10017060-88 = "저희는…… 어디까지나……"
10017060-90 = "친구 된 자의 도리로서 정의실현부를 일깨우러 왔을 뿐입니다!"
10017060-91 = "무슨 영문인지 알 수가 없는데요?!"
10017060-92 = "하스미 부부장님께서도 모르겠다고 말씀하시는 겁니까?!"
10017060-93 = "슬픕니다. 저는 진심으로 슬픕니다!"
10017060-94 = "우리가 바라는 것은 당신들의 회복!"
10017060-95 = "정의실현부의 숭고한 정의가, 다시 한번 이 땅 위에 일깨워지는 것!"
10017060-96 = "어떻게 해도 스스로 눈을 뜨지 못한다면, 손을 내밀어서라도 빛을 보이는 것이 친구의 도리!"
10017060-97 = "……네? 대체 무슨……"
10017060-98 = "선의를 베푼 이들의 물건을 빼앗아 자신들의 배를 불리다니, 그 행위의 어디에 정의가 깃들 수 있단 말입니까!"
10017060-99 = "우리가 뭘 빼앗았다는 말씀이시죠? 앞뒤 사정을 이야기해 주셨으면 좋겠습니다만?!"
10017060-100 = "그리고, <화이트&메이슨>을 빌리는 데 얼마나 고생했는지 아세요? 물론 모르시겠죠!"
10017060-101 = "트리니티에서 이 정도 규모의 카페를! 다른 동아리들의 견제와 음모와 암투를 뚫고!"
10017060-102 = "츠루기를 협상 현장에 간판으로 내세우면서까지! 간신히 계약을 따냈는데!"
10017060-103 = "츠루기 부장을 내세운 건 좀 치사한 것 같은데요?!"
10017060-104 = "그만큼 수단과 방법을 가릴 수 없었다는 뜻이에요!"
10017060-105 = "가려 주세요!"
10017060-106 = "아무튼! 그만큼 고생했고 큰일이었다는 거에요!"
10017060-107 = "그런데 단장님이 다 망쳤어요! 알아들어요? 다 망쳐버렸다구요!"
10017060-108 = "그래도 안 되는 건 안 되는 겁니다! 지금이라도 정의실현부의 본성을 되찾아 주세요!"
10017060-109 = "꽉 막혀서는……! 단장님은 예전부터 그랬었죠. 1학년 때만 하더라도, 그 파운드케이크에……!"
10017060-110 = "와, 와, 와! 무슨 말씀을 하시는 겁니까! 그러는 부부장님이야말로 신입생 때 그 푸딩을……!"
10017060-111 = "……그 이상 그 이야기를 꺼내신다면 저는 구호기사단을 공식적인 적대자로 선포해 버릴 겁니다……!"
10017060-112 = "머, 먼저 파운드케이크 이야기를 꺼낸 건 부부장님이었거든요?!"
10017060-113 = "[s5] \"어…… 여보세요?\"\n[s6] \"무슨 이야기를 하고 있었는지 모르겠지만, 나도 조금 끼워 줄 수 없을까?\""
10017060-117 = "선생님?! 마침 잘 됐어요. 들어주세요! 미네 단장님이 갑자기……!"
10017060-118 = "이런 모습을 보여 드려서 송구스럽습니다만, 선생님. 하스미 부부장님이……!"
10017060-119 = "선생님께는 제가 먼저 말 걸었어요!"
10017060-120 = "선생님과 오늘 먼저 만났던 건 제 쪽이었답니다!"
10017060-134 = "말로는 안 되겠군요, 정말이지."
10017060-135 = "오늘 처음으로 의견이 일치한 것 같군요……"
10017060-137 = "단장님…… 저희는, 어떻게 해야……"
10017060-138 = "……"
10017060-139 = "세리나, 하나에."
10017060-140 = "무엇이 이 자리에 가장 걸맞은 '구호' 인지, 제가 하나하나 이야기해 드릴 수는 없습니다."
10017060-141 = "스스로 생각하고, 판단하십시오."
10017060-142 = "저를 도와 정의실현부의 어두워진 눈을 뜨게 해도 좋고."
10017060-143 = "치료와 돌봄이 필요한…… 정의실현부의 소녀들을 도와주어도 좋습니다."
10017060-144 = "언제 어디서나 구호의 마음을 가지는 것. 그것이 우리의 기조이고, 첫 발걸음이니까요."
10017060-157 = "어, 어떡하죠. 선배? 어떻게 하면 좋아요?!"
10017060-158 = "우선, 단장님을 돕죠. 그리고 주위의 다친 분들 모두를 치료해 드리는 거예요."
10017060-159 = "그래도 괜찮은 걸까요?"
10017060-160 = "저는 단장님을 믿어요. 하나에 쨩. 그렇지만 다친 정의실현부 분들도 내버려 둘 수 없어요."
10017060-161 = "꼭 둘 중에 하나를 선택할 필요는 없잖아요? 둘 다 해 버리면 되는 거예요!"
10017060-163 = "……구호가 필요한 곳에 구호를?"
10017060-164 = "네. 구호가 필요한 곳에 구호를. 그것이 우리 구호기사단이니까요."
10017060-165 = "하지만 이렇게 많은 분들이 다쳤는데……"
10017060-166 = "모든 게 끝나더라도, 원래대로 구호기사단과 정의실현부가 돌아갈 수 있을까요……?"
10017060-167 = "낫지 않는 상처는 없어요. 하나에 쨩. 그렇지요?"
10017060-168 = "네……?"
10017060-169 = "왜냐하면, 우리가 낫게 만들 거니까요."
10017060-170 = "아……!"
10017060-171 = "대신 그만큼의 각오는 해야겠지만요."
10017060-172 = "그, 그렇네요! 잊고 있었어요, 선배!"
10017060-173 = "에헤헤. 많이…… 바빠지겠네요. 정신없어질 거고요."
10017060-174 = "이왕 받아들여야 한다면, 저는 웃을 거예요!"
10017060-176 = "그래요. 그거에요!"
10017060-177 = "다시 가겠습니다, 정의실현부!"
10017060-178 = "흐리어진 시야를 명징하게 밝히시기를! 정의의 이름 아래 부끄럽지 않은 삶을 살아가기를!"
