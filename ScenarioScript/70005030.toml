[translation]
70005030-1 = "어느 2월 19일의 기록 (2)"
70005030-2 = "그래서 무슨 일이야, 모두들?"
70005030-3 = "일단…… 아무것도 묻지 말고 D.U.로 가자고 해서, 오기는 했는데."
70005030-4 = " 그, 그게 말이죠, 부장님……."
70005030-5 = "저희가, 산해경의 현무상회 쪽에서 연락을 받아서……."
70005030-6 = "산해경? 현무상회?"
70005030-7 = "그렇다는 건…… 학원 간 교류 안건이라는 뜻이야, 아코?"
70005030-8 = "하지만 업무 범위상, 타 학교와의 외교는, 원칙적으로 우리 선도부가 할 일이 아닐 텐데?"
70005030-9 = "그, 그그그, 그러니까. 부장님! 제가 조금 말을 잘못 꺼냈는데 말이죠……!"
70005030-10 = "제…… 가 현무상회 분들 중 한 명과, 개인…… 적으로 조금 알고 지냈어서!"
70005030-11 = "이번에 D.U.에서 같이 놀지 않겠느냐고 해서요!"
70005030-12 = "아코에게…… 현무상회의 친구가 있었다고?"
70005030-13 = "……."
70005030-14 = "미안해, 아코. 그동안 너무 과로만 시켰던 것 같네."
70005030-15 = "이렇게…… 허세를 부리면서까지, 기분 전환을 하고 싶었구나……."
70005030-16 = "그게 대체 무슨 말씀이세요?!"
70005030-17 = "난 알 것 같은데, 아코 쨩……."
70005030-18 = " 하아……."
70005030-19 = "두 분은 조용히 해요!"
70005030-20 = "그, 그리고 부장님도 믿어 주세요……! 어…… 그러니까 이건……."
70005030-21 = "……."
70005030-22 = "아무튼, 이게 기본적으로 사적인 자리인 것은 맞아야 하니까요!!!"
70005030-26 = "(사적인 자리여야 한다……?)"
70005030-28 = "오! 드디어 도착했네! 다들 어서 와!"
70005030-29 = "그러면…… '오랜만이네', '아코'?"
70005030-30 = "네, 네에! 루미 씨! 그렇, 지요…?"
70005030-33 = "……!"
70005030-34 = "(정말, 이었던 건가……? 아코에게, 산해경의 친구가 진짜로……?)"
70005030-35 = "(어라? 그런데 이 사람들은… 현무상회의 회장과 그 매니저, 그리고 산해경의 학생회인 현룡문의 집행부장…….)"
70005030-36 = "안녕하세요, 아코 씨. 회장님께…… 말씀은 많이 들었습니다."
70005030-37 = "으, 음. 게헨나의 선도부원들…… 아, 아니. 네 명 모두, 반갑다. 코노에 미나다. 그리고 이쪽은……."
70005030-42 = "음. 류우게 키사키다. 지금은 그것으로 좋겠지. 이곳은 어디까지나 사적인 자리일 테니까."
70005030-43 = "그 전에…… 잠시 실례하도록 하지. 이것을 피워 두면 더욱 좋지 않을까 해서 말이다."
70005030-48 = "어라? 신기한 향이네……."
70005030-49 = "그렇네요. 그런데 왠지 기분이…… 편해지는 느낌이……?"
70005030-50 = "……."
70005030-51 = "(확실해. 분명 산해경의 학생회장, 검은 군주라고도 불리는 현룡문의 문주…… 류우게 키사키……!)"
70005030-52 = "아코."
70005030-53 = "네, 네네네네. 부장님?!"
70005030-54 = "정확한 설명을, 요구해도 될까?"
70005030-55 = "마마마마, 말씀드렸듯이, 저는 친구인 루미 씨와……!"
70005030-57 = "자, 자자. 그만, 그만. 이왕 이렇게 다 모였으니까, 더 숨기고 어쩌고 할 필요 없겠지?"
70005030-58 = "내가 하나하나 설명해 줄게. 괜찮지, 키사키?"
70005030-59 = "그래. 그대라면 믿을 수 있지. 더욱이 이런 자리라면 말이다."
70005030-60 = "그보다도…… 반갑구나. 소라사키 히나 양. 키사키라고 편히 불러 주었으면 한다."
70005030-61 = "으, 응. 나도…… 히나라고, 불러 줘."
70005030-63 = "……."
70005030-64 = "그렇게 된 것이다."
70005030-65 = "뭐어, 결국은 택배 배송이 엇갈렸다는, 흔히 일어나곤 하는 배송상의 오류가, 이 자리에서 동시에 일어난 것뿐이지."
70005030-66 = "그리고 우리 쪽의 미나도, 선도부 쪽의 모두도, 서로 최선을 다했으나 운명의 장난이라는 것에 당한 것 정도일 테고."
70005030-67 = "그런 의미에서, 이제 그만 생일을 축하하도록 할까. 여기, 그대에게 돌아가야 했을 케이크다."
70005030-73 = "후후. 이것이야말로 그대를 생각하는 모두의 마음이 담긴, 귀중한 선물인 셈이군?"
70005030-78 = "그렇구나……. 고마워, 모두들. 그리고 키사키도. 이건 일종의 케이크 교환식이라고 봐도 되는 것일까?"
70005030-79 = "받아 줘. 키사키 주위의 모두가, 정성을 담아 주문한 케이크라고 해야 하겠네."
70005030-88 = "그건 그렇고, 신기하네. 우리 둘의 생일이 같은 날이었다니."
70005030-89 = "분명 그렇게 생각할 수 있지만, 전체적으로 보자면 그렇게 이상한 일도 아니지 않겠는가."
70005030-90 = "키보토스에 생일이 겹치는 학생들이 어디 우리들뿐이겠느냐."
70005030-91 = "확실히…… 그렇지. 키보토스의 학생 수를 생각한다면 더더욱."
70005030-92 = "그래도 오늘은 한층 더 특별한 기억이 될 것 같네. 고마워, 아코. 이오리. 치나츠."
70005030-93 = "별말씀을요. 저는 부장님의 생일만 축하드릴 수 있다면……."
70005030-94 = "음. 여러 가지 일이 있었지만, 저희들의 케이크를 이렇게 무사히 전해드릴 수 있어서, 진심으로 다행이라고 생각합니다, 문주님!"
70005030-95 = "부수적인 일은 거의 제가 다 했지만 말입니다……."
70005030-96 = "자, 자. 살다 보면 그런 일도 있는 거니까 말이지."
70005030-97 = "여기, 내가 특별히 만든 복숭아 떡이야. 이번에는 안에 과육을 살린 복숭아 잼을 넣어 보았다구?"
70005030-98 = "고맙구나, 모두들. 이 떡은 케이크들을 먹은 후 나누어 먹도록 하자."
70005030-99 = "그때까지 뱃속에 그럴 여유가 남는다면, 말이다만."
70005030-101 = "그건 별로 걱정할 필요 없지 않을까? 원래 케이크나 후식을 먹는 배는 따로 있다고 하잖아?"
70005030-102 = "후후. 그것은 확실히 그러하겠구나. 실례하였다. 나는 그렇게까지 과식을 할 수 있는 몸은 아니다 보니 말이다."
70005030-104 = "그러면 생일 축하드립니다 부장님, 문주님!"
70005030-105 = "저 역시 생일 축하드립니다. 문주님, 부장님."
70005030-107 = "응. 만나서 반가워. 산해경의 모두들."
70005030-108 = "그래. 이것으로 산해경과 게헨나 사이의…… 아니, 아니로구나. 지금은 실언이었다."
70005030-109 = "그렇지만, 학교와 학교 사이의 교류까지는 아니더라도, 여기에서 알게 된 모두의 사이만이라도 좋으니……."
70005030-110 = "보다 넓은 교류를 이어 나가며, 세상을 바라보는 관점을 늘려 갔으면 하는구나."
70005030-111 = "그런데…… 왜 이런 곳…… 그러니까, 노래방이라는 장소를 굳이 빌린 거지? 그것도 현무상회의 이름으로?"
70005030-112 = "간단한 일입니다. 현무상회는 언제나 일정 수준 이상의 외부 여유 자금을 가지고 있고……."
70005030-113 = "그리고 생일이라면 역시 노래방이지! 안 그래?"
70005030-115 = "아, 그런가. 그렇게 말하니까 왠지 알 것 같네."
70005030-116 = "그, 그랬던 건가……?"
70005030-117 = "그러면 누구부터 시작할래? 특별히 없으면 내가 먼저 부를 테니까!"
70005030-128 = "그러면 다음은…… 제가!"
70005030-139 = "으음! 시상…… 음감이 떠올랐다! 흥이 오르는군!"
70005030-152 = "이 분위기 어쩔 건가요!"
70005030-153 = "아뇨, 그게 그러니까…… 저에게 말씀하셔도……."
70005030-155 = "히, 히노미야 치나츠! 전환을 위해…… 가겠습니다!"
70005030-177 = "(초대받은 대로, 노래방의 문을 열었다!)"
70005030-179 = "[ns] \"모두, 안녕!\""
70005030-181 = "서, 선생님……?!"
70005030-183 = "선생……!?"
70005030-187 = "[ns] \"생일 축하해, 히나! 키사키!\""
70005030-189 = "흐, 흥! 딱히 선생님을 구태여 이 자리에 부르고 싶지는 않았지만, 혹시나 해서요?"
70005030-190 = "만에 하나 서운하실까 봐서 그랬던 거니까 말이죠? 그러니까 선생님은 어서 저에게 감사하도록 하세요!"
70005030-191 = "아코가 선생님께 연락한 거였어……?"
70005030-192 = "음? 그랬던 건가, 아코 행정관? 나는 그냥 선생님도 있으면 좋을 거라고 생각해서……."
70005030-193 = "그, 그게, 그러니까……!"
70005030-194 = "……그렇구나. 두 명이 각자 선생님에게 이 자리를 알린 것인가."
70005030-195 = "감사를 표하지. 미나, 아코. 그리고 어려운 걸음을 해 준 선생에게도."
70005030-196 = "[s1] \"무슨 말이야! 당연한 일이지!\"\n[s2] \"미나도 아코도, 알려 줘서 고마워!\""
70005030-199 = "음. 당연한 일이다. 훗."
70005030-200 = "……정말, 이번만이니까요?"
70005030-201 = "[ns3] \"그러면, 어른의 난입으로 가라앉은 분위기를!\"\n[ns4] \"책임지고 띄워 보실까!\""
70005030-204 = "네? 트, 특별히 선생님께서 오셨다고 분위기가 가라앉았다거나 하는 것은, 아니었는데요……?"
70005030-205 = "자, 자. 여기서는 그런 걸로 하자. 레이죠."
70005030-206 = "알겠습니다……."
70005030-210 = "[ns] \"히나도 키사키도, 트리플 송으로 가는 거야!\""
70005030-211 = "어, 어어……? 하지만 나, 노래 같은 거 잘 모르는데……?"
70005030-212 = "그것은 나 역시 마찬가지다만……."
70005030-216 = "호오? 분위기를 띄울 때에는, 오히려 잘 못 불러도 괜찮다는 것인가? 오히려 적당히 엉망이 되는 편이 더욱 즐겁다고?"
70005030-217 = "그래. 알 것 같구나. 이따금 모두에게 웃음을 주는 것도 필요한 법이지."
70005030-218 = "아, 알았어. 그러면……."
70005030-231 = "[ns] \"가즈아아아아아아아!!!\""
70005030-237 = "(그렇게, 어느 2월 19일의 생일 파티는, 잊기 힘든 즐거움과 추억을 남긴 채 무사히 이어졌다.)"
70005030-238 = "(……유일하게 간과했던 것이 있었다면, 고등학생의 체력이란…….)"
70005030-239 = "(어른이 쉽사리 감당할 만한 것이, 아니었다는 사실 정도였다…….)"
70005030-240 = "어느 2월 19일의 기록"
