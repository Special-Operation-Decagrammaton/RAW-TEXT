[translation]
1013306-1 = "예상 못 한 변수"
1013306-2 = "(잠시 후, 리오에게서 연락이 왔다.)"
1013306-5 = "아. 선생. 혹시 시간 괜찮아?"
1013306-6 = "방금 슈트의 개조가 완료됐어."
1013306-7 = "그런데…… 나 혼자서는 테스트 할 수가 없네."
1013306-8 = "가사도우미 아방가르드 군도 이 테스트는 도와줄 수 없고……."
1013306-9 = "혹시 선생이 도와줄 수 있을까?"
1013306-10 = "[s] \"응! 바로 갈게!\""
1013306-11 = "고마워."
1013306-12 = "그럼…… 내 방으로 와줘."
1013306-20 = "어서 와."
1013306-21 = "말했던 대로 슈트의 개조가 끝났어."
1013306-22 = "……응? 달라진 곳이 없어 보인다고?"
1013306-23 = "겉으로는 그렇게 보일 거야."
1013306-24 = "새로운 파츠는 사용하지 않고, 기존에 있던 기능을 응용했거든."
1013306-25 = "이번에 개조한 것은, 발열 기능에 관한 부분이야."
1013306-26 = "이 슈트에는 체내의 전기신호를 증폭하는 장치가 설치되어 있어. #n그래서 그걸 응용하면 몸 전체에 열을 전달할 수 있지."
1013306-27 = "코드 몇 줄만 손보면 되는 일이라 생각보다 빨리 개조가 됐네."
1013306-28 = "하지만…… 검증은 확실히 해야 해."
1013306-29 = "그러니까 도와줘, 선생."
1013306-30 = "[s] \"뭘 어떻게 도와주면 될까?\""
1013306-31 = "지금부터 슈트의 온도를 올릴 테니, 선생이 열화상 카메라로 열이 골고루 퍼졌는지 체크해 줘."
1013306-32 = "[s] \"간단하네~.\""
1013306-33 = "그 다음엔…… 혹시라도 열이 새어 나가는 곳이 있는지 확인을 부탁해."
1013306-34 = "손으로 슈트의 표면을 짚어가면서 말이야."
1013306-35 = "[s] \"간단하지 않네—!!\""
1013306-36 = "내 손이 닿는 곳은 내가 할 테니까, 선생은 등 쪽을 부탁해."
1013306-37 = "가사도우미 아방가르드 군에게 부탁하고 싶어도, 그 아이는 촉각으로 온도를 감지하는 기능이 없어."
1013306-38 = "좀 더 확실히 슈트의 상태를 확인하고 싶어서 그런 거니까, 협조해 줘."
1013306-39 = "[s] \"드, 등 만이라면……!\""
1013306-40 = "응. 그럼 부탁할게."
1013306-42 = "(이후 열화상 카메라로 온도를 재고, 리오의 등에 손을 짚어 가며 열을 체크했다.)"
1013306-47 = "으, 으으음……."
1013306-48 = "[ns] \"미, 미안! 불편했어?!\""
1013306-49 = "아니. 그런 게 아니라, 생각보다 간지러워서."
1013306-50 = "그리고 예상보다 열이 더 오르는 느낌인데……."
1013306-51 = "아무튼 계속해서 잘 부탁해."
1013306-52 = "[s] \"그, 그래……!\""
1013306-53 = "(이후 열심히 슈트와 리오의 체온을 체크했다.)"
1013306-59 = "후우…… 수고했어. 이걸로 테스트는 종료."
1013306-60 = "덕분에 발열 기능이 완벽하게 작동하는 걸 확인했어."
1013306-61 = "……그런데, 예상 못 한 변수가 하나 있었네."
1013306-62 = "[s] \"응? 어떤 변수?\""
1013306-63 = "너무…… 더워……."
1013306-64 = "선생이 온다고 방의 온도를 따뜻하게 맞춰 놨더니 이런 일이……."
1013306-65 = "아무래도 열을 배출해야 할 것 같아."
1013306-68 = "잠깐 실례할게."
1013306-71 = "[wa:500]― [log=리오 결전]후우…… [wa:1530]이제 좀 살 것 같아.[/log]"
1013306-74 = "[wa:1610]― [log=리오 결전]실내 온도를 고려하지 않았거든.[/log]"
1013306-77 = "― [log=리오 결전]나도 정말…… [wa:1890]눈앞의 결과에,[/log]"
1013306-79 = "― [log=리오 결전]정신이 팔렸던 모양이야……. [/log]"
1013306-82 = "[wa:930]― [log=리오 결전]……조금, [wa:1520]쉬게 해줬으면 해.[/log]"
1013306-84 = "― [log=리오 결전]더위에, [wa:1880]사고가 제대로…….[/log]"
1013306-87 = "[wa:1510]― [log=리오 결전]……선생? [wa:2400]왜 그런 얼굴로……. [/log]"
1013306-90 = "[wa:2200]― [log=리오 결전]……아!![/log]"
1013306-92 = "― [log=리오 결전](나, [wa:280]나는…… [wa:1330]무엇을……!?)[/log]"
1013306-95 = "[wa:490]― [log=리오 결전]이, [wa:620]이건 [wa:520]고의가 아니야……! [wa:1320]미안해……![wa:80] [/log]"
1013306-97 = "― [log=리오 결전]나,[wa:810] 나는 이제, [wa:1060]괜찮으니까……! [/log]"
1013306-101 = "여, 열 배출은 이제 됐어!"
1013306-102 = "나머지는 슈트의 쿨링 시스템으로 해결할 수 있으니까……!"
1013306-103 = "그러니까 괜찮아! 정말로!"
1013306-111 = "[ns] \"여전히 머리가 뜨거운데?\""
1013306-112 = "……!!"
1013306-117 = "[ns] \"리, 리오……?!\""
1013306-119 = "(이후 리오의 옆에서 부채질로 열심히 체온을 낮춰 주었다.)"
1013306-120 = "(다행히 별다른 일 없이 금방 회복되었다.)"
1013306-123 = "정말…… 변수가 많았네. 이번 실험……."
