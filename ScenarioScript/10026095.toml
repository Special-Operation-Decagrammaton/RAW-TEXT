[translation]
10026095-2 = "……후우. 어떻게 정리는 된 거 같네요."
10026095-3 = "지금까지 중 가장 많은 수였던 거 같아요. 실제로도 꽤 격렬했고……."
10026095-4 = "으으……. 이젠 진짜 끝이겠지……? 더 없는 거 맞지……?"
10026095-5 = "그래도 무사히 지켜냈네요! ……이 상자!"
10026095-6 = "뭐, 나올 만한 것들은 이미 다 나와버린 것 같으니, 오히려 이젠 안전하다고 해야 할까요."
10026095-7 = "히나타 씨. 괜찮으시다면 이쪽으로……."
10026095-8 = "아, 네. 네! 여기요……!"
10026095-12 = "……그럼……. 열어보겠습니다……. 다들 함께……. 보시죠……."
10026095-14 = "……네."
10026095-15 = "후훗."
10026095-16 = "…………."
10026095-25 = "……??"
10026095-26 = "……어라?"
10026095-27 = "어……."
10026095-28 = "……아무것도 없……는데요? 상자 안이……. 텅 비어 있어요……."
10026095-29 = "[s] \"……비어 있다고?\""
10026095-30 = "왜……. 빈 상자를 묻어둔 거죠……? 그것도 이렇게나 깊은 구덩이까지 파서……."
10026095-35 = "……원래는 빈 상자가 아니었을 테니까요."
10026095-37 = "……네?"
10026095-38 = "네. 맞아요……."
10026095-39 = "여기 보세요. 상자 구석에 약간의 부스러기가 남아 있죠. 당시 쓰이던 종이가 썩은 흔적."
10026095-40 = "아마도 이 안에 들어있던 건 종이로 된 물건……."
10026095-41 = "별달리 방부 처리는 돼 있지 않았었나 보네요. 세월을 버티지 못하고 썩어서 사라진 거죠."
10026095-42 = "상자도 딱히 밀폐 처리가 돼 있던 것도 아니니, 벌레가 먹었던 걸 수도 있고요."
10026095-43 = "그, 그렇군요……. 확실히……."
10026095-44 = "그럼 이 안에 있던 게 뭔지는 알 수 없는 건가요? 더 이상……?"
10026095-45 = "꼭 그렇지만은……. 않아요."
10026095-46 = "과거의 시간이 저희들에게 무언가를 가르쳐줄 때는……. 꼭 한 가지의 방법만으로 알려주진 않으니까요."
10026095-47 = "상자 안의 내용을 알 수 있는 방법은, 그것을 직접 펼쳐보는 방법도 있을 테지만……."
10026095-48 = "반대로 그 주변과 지금까지의 것들……. 다른 모든 단서들을 종합해 보는 방법도 있겠지요."
10026095-49 = "……네."
10026095-50 = "훈련을 위해 모인 성도회 학생들이, 자신들만의 비밀을 만들기 위해 몰래 만든 아지트와……."
10026095-51 = "성당 본청에 들키고 싶지 않은 개인 물품들을 숨겨 둔, 폭포 뒤의 캐비닛들처럼 말이에요."
10026095-53 = "……?"
10026095-54 = "……네?"
10026095-56 = "이제 거의 확실해졌어요. 처음으로 둘러보았던 네 곳의 포인트들. 숨겨두었던 폭포 뒤의 비밀장소."
10026095-58 = "그리고 결정적으로 방금 찾아낸 이 상자……."
10026095-59 = "당시 이곳에서 훈련을 하던 성도회 학생들이……. 개인적으로 만들어 숨겨 둔……."
10026095-60 = "……<메모리얼 캡슐>, 이라는 거네요.."
10026095-61 = "[s] \"……메모리얼 캡슐?\""
10026095-62 = "음……."
10026095-63 = "……선생님. 그리고 여러분."
10026095-64 = "혹시……. 괜찮으시다면 말이죠……. 그……."
10026095-65 = "한 가지……. 부탁드리고 싶은 게 있는데……. 괜찮을까요……?"
