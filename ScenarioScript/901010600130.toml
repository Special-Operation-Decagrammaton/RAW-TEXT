[translation]
901010600130-7 = ""
901010600130-8 = "เอ่อ ขอโทษนะคะ"
901010600130-9 = "วันนี้ก็ทำงานหนักมากเลยนะคะ พักสักครู่แล้วดื่มเครื่องดื่มชูกำลังเย็นๆ สักหน่อยมั้ยคะ?"
901010600130-10 = ""
901010600130-12 = ""
901010600130-13 = "เอ๋ เด็กส่งของจากครั้งที่แล้วไม่ใช่เหรอ?"
901010600130-14 = "วันนี้ก็รบกวนเธออีกแล้ว ขอบใจมากนะ!"
901010600130-15 = "ฮุฮุ ถ้าจะตอบแทนละก็ ฝากกด 'ถูกใจ' ให้บัญชี <FOX EATS> ก็พอแล้วค่ะ!"
901010600130-16 = "ว่าแต่ เมื่อกี้ฉันไปคุยกับคุณลุงทางโน้นมา ก็เลยได้ยินมาน่ะค่ะ"
901010600130-17 = "ได้ยินว่าลูกเรือใหม่ที่ชื่อมิยะหรืออะไรสักอย่างหายตัวไปเหรอคะ?"
901010600130-18 = "อ๊ะ ตาแก่คนนั้นเอาเรื่องนั้นมาพูดอีกแล้วสินะ..."
901010600130-19 = "อย่าไปใส่ใจเลย เหตุการณ์แบบนี้เกิดขึ้นบ่อยๆ เวลาทำงานบนเรือน่ะ"
901010600130-20 = "เกิดบ่อยเลยเหรอคะ? งานบนเรือลำบากขนาดนั้นเลยเหรอคะ?"
901010600130-21 = "อืม ก็มีหลายคนที่หนีไปเพราะงานบนเรือหนักจริง..."
901010600130-22 = "แต่อย่างน้อยมิยากุจิก็ไม่ใช่คนไร้ความอดทนอย่างที่ตาแก่คนนั้นพูดหรอก#nถึงจะขี้บ่นก็จริง แต่ไม่ว่าจะได้รับมอบหมายงานอะไร เขาก็ตั้งใจทำงานตลอดนะ"
901010600130-23 = "ถึงจะไม่รู้ว่าไปประสบอุบัติเหตุที่ไหนหรือเปล่า แต่ฉันว่าหมอนั่น... หนีไปเพราะหนี้แน่นอน"
901010600130-24 = ""
901010600130-26 = ""
901010600130-27 = "หนี้เหรอคะ?"
901010600130-28 = "อื้อ ในหมู่ชาวประมง ก็มีคนที่มาทำงานบนเรือเพราะมีหนี้ก้อนโตอยู่"
901010600130-29 = "ถึงงานบนเรือจะหนัก แต่ก็หาเงินก้อนใหญ่ได้ในเวลาไม่นาน ถ้าต้องทำงานใช้หนี้ ก็ไม่มีงานอะไรดีกว่านี้แล้ว..."
901010600130-30 = "แต่มิยากุจิติดการพนัน หนี้ของเขาเลยไม่ลดลง แต่กลับยิ่งเพิ่มขึ้นเรื่อยๆ เลยน่ะสิ"
901010600130-31 = "ได้ยินว่าสุดท้ายก็ไปกู้เงินนอกระบบของ \"การ์ปัชโช่ แฟมิลี่\"..."
901010600130-33 = "การ์ปัชโช่ แฟมิลี่เหรอคะ?"
901010600130-34 = "อื้อ พวกที่ใส่ชุดสีดำคอยตรวจอยู่ตรงประตูหน้าท่าเรือนั่นไง ตอนเข้ามาก็เห็นใช่มั้ย?"
901010600130-35 = ""
901010600130-39 = "พวกนั้นเป็นแก๊งที่มีชื่อเสียงในทางที่ไม่ดีแถวนี้น่ะ แต่ปกติก็รับหน้าที่ดูแลความปลอดภัยของท่าเรือ#nคาเนะซากิ"
901010600130-40 = "แต่บางครั้งการ์ปัชโช่ แฟมิลี่ก็ปล่อยเงินกู้ให้คนที่ไม่มีเครดิต แล้วเงินกู้นอกระบบของพวกนั้นก็คิด#nดอกเบี้ยสูงจนน่าเหลือเชื่อ"
901010600130-41 = "แล้วเจ้ามิยากุจิจะจ่ายดอกเบี้ยไหวได้ยังไง? เขาเลยแอบหนีไปก่อนที่หนี้จะเพิ่มขึ้นอีกน่ะสิ"
901010600130-42 = "อย่างนี้นี่เอง... น่ากลัวจริงๆ นะคะ"
901010600130-43 = "ใช่ เพราะงั้นต่อให้จะไม่มีเงินขนาดไหน แต่ก็อย่าไปยุ่งกับการพนันเด็ดขาดเชียวล่ะ"
901010600130-44 = "เงินกู้นอกระบบด้วย!"
901010600130-45 = "ค่ะ ฉันจะจำเอาไว้ให้ดีค่ะ"
