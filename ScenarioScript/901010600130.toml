[translation]
901010600130-7 = ""
901010600130-8 = "Um, excuse me."
901010600130-9 = "Looks like you're working hard today, too. Why not take a break and enjoy a complimentary ice-cold energy drink?"
901010600130-10 = ""
901010600130-12 = ""
901010600130-13 = "Wait, aren't you the delivery student from a couple days ago?"
901010600130-14 = "My she-ro! Thank you very much, little lady!"
901010600130-15 = "Fufu, you can thank me by smashing that like button on the FOX EATS app!"
901010600130-16 = "By the way, your colleague over there was telling me..."
901010600130-17 = "It was about some guy, \"Miya\"...something. He was a new crewmember who went missing?"
901010600130-18 = "The old man's rambling on again..."
901010600130-19 = "Don't worry about the kid. This happens all the time down here."
901010600130-20 = "Often? Is fishing work that rough?"
901010600130-21 = "Yeah, sure, plenty of kids quit. It's hard work out here. Lonely, too."
901010600130-22 = "But Miyaguchi wasn't as lazy as the old man says. Yeah, he complained a lot, but he got the job done. And he did his work well."
901010600130-23 = "I suppose he might have had an accident, but I reckon he ran off because of his debt."
901010600130-24 = ""
901010600130-26 = ""
901010600130-27 = "Debt?"
901010600130-28 = "Oh yeah. Lots of fishers hop on the boat to pay off their debt...or escape it."
901010600130-29 = "Sure, the work is rough, and sometimes dangerous, but you can make a lot in a short period, provided the wind's blowing right."
901010600130-30 = "And I also heard Miyaguchi was a gambler. A fool. He tried his luck and fell further in the hole."
901010600130-31 = "And it looks like he even got a loan from the Carpaccio Family..."
901010600130-33 = "The Carpaccio Family?"
901010600130-34 = "Yeah. You've met 'em...the ones in black minding the gate. No one gets in or out without talking to them."
901010600130-35 = ""
901010600130-39 = "This is their territory, and they happen to run security at Kanesaki Port."
901010600130-40 = "They offer loans to people with bad credit. As you'd expect, the Carpaccio Family charges absurdly high interest."
901010600130-41 = "There's no way Miyaguchi could pay it off. I'm sure he ran away before his debt grew too big for him."
901010600130-42 = "I see... That's so scary."
901010600130-43 = "You better believe it. So listen, kid—stay away from the gambling tables!"
901010600130-44 = "And the same goes for private loans!"
901010600130-45 = "I will absolutely keep that in mind."
