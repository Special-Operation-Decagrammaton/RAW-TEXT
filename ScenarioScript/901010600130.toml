[translation]
901010600130-7 = ""
901010600130-8 = "那個……不好意思。"
901010600130-9 = "今天也辛苦了。#n要不要稍微休息一下，來一罐冰涼的能量飲料呢？"
901010600130-10 = ""
901010600130-12 = ""
901010600130-13 = "咦？這不是上次的外送員同學嗎？"
901010600130-14 = "今天也謝謝你啦！我就心懷感激地收下了！"
901010600130-15 = "呵呵。回禮就麻煩您幫忙在「FOX EATS」的帳號按個「讚」吧！"
901010600130-16 = "話說回來，我剛才和那邊的那位老先生聊天時聽說……"
901010600130-17 = "有個叫宮……什麼的新船員消失了是嗎？"
901010600130-18 = "啊，老爺子又在說那件事了嗎……"
901010600130-19 = "不用太在意。跑船跑久了，這種情況還蠻常見的。"
901010600130-20 = "很常見嗎？船上的工作有那麼辛苦嗎？"
901010600130-21 = "嗯，因為工作太辛苦而落跑的傢伙確實也不少……"
901010600130-22 = "但至少宮口並沒有像老爺子說得那麼沒有毅力。#n儘管他嘴上愛抱怨，交代的工作還是會老老實實地完成。"
901010600130-23 = "雖然也有可能是在哪裡遭遇了意外，但我認為那傢伙……肯定是因為債務才逃跑的。"
901010600130-24 = ""
901010600130-26 = ""
901010600130-27 = "債務嗎？"
901010600130-28 = "嗯。漁夫當中，偶爾也會有幾個是因為欠了大筆債務才來跑船的。"
901010600130-29 = "工作雖然辛苦，卻能在短期內賺到很多錢。#n以還債來說沒有比這更好的工作了……"
901010600130-30 = "但是宮口沉迷賭博，不但債務沒有減少反而似乎一天一天地在增加。"
901010600130-31 = "最後好像連「卡爾帕喬家族」的高利貸都碰上了……"
901010600130-33 = "卡爾帕喬家族嗎？"
901010600130-34 = "嗯，就是在港口正門盤查的那些黑衣人。#n你進來的時候有看到吧？"
901010600130-35 = ""
901010600130-39 = "他們是在這附近惡名昭彰的組織，平常負責鐘崎港的警備業務。"
901010600130-40 = "偶爾似乎也會借錢給信用不良的人……但是聽說卡爾帕喬家族的貸款利息高得離譜。"
901010600130-41 = "所以宮口怎麼可能還得起那些利息？#n肯定是趁債務變得更多之前偷偷逃跑了吧。"
901010600130-42 = "原來還有這樣的內情……真是可怕的故事呢。"
901010600130-43 = "是啊。所以同學你就算缺錢，也絕對別碰賭博之類的東西。"
901010600130-44 = "高利貸就更不用說了！"
901010600130-45 = "好的，我會銘記在心。"
