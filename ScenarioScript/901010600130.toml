[translation]
901010600130-8 = "저기, 실례합니다."
901010600130-9 = "오늘도 수고가 많으시네요. 잠깐 쉬면서 시원한 에너지 드링크라도 한 잔, 어떠신가요?"
901010600130-13 = "어라, 지난번의 배달부 학생이잖아?"
901010600130-14 = "오늘도 신세 지는군. 잘 마실게!"
901010600130-15 = "후후. 답례는 <FOX EATS> 계정에 '좋아요'를 눌러 주시는 걸로 대신 부탁드립니다!"
901010600130-16 = "그런데 아까 저 쪽의 어르신과 이야기하다가 들었는데……"
901010600130-17 = "미야, 뭔가 하는 신입 선원이 사라졌다면서요?"
901010600130-18 = "아, 또 영감님이 그 이야기를 했나……"
901010600130-19 = "신경 쓰지 마. 뱃일을 하다보면 흔히 발생하는 일이니까."
901010600130-20 = "흔하다니, 뱃일이 그렇게 많이 고된가요?"
901010600130-21 = "음, 뱃일이 힘들어서 도망치는 녀석도 꽤 있긴 하지만……"
901010600130-22 = "최소한 미야구치는 영감님이 말씀하시는 것만큼 근성 없는 녀석은 아니었어.#n입으로는 불평이 많긴 했지만, 그래도 시킨 일은 늘 성실하게 해냈거든."
901010600130-23 = "어디서 사고를 당했을지도 모르지만, 내 생각엔 그 녀석…… 빚 때문에 도망친 게 분명해."
901010600130-27 = "빚이요?"
901010600130-28 = "응. 어부 중에는 가끔 커다란 빚 때문에 배를 타는 녀석들도 몇 있거든."
901010600130-29 = "뱃일은 고된 만큼 단기간에 큰돈을 벌 수 있어서, 빚을 갚는 데는 이만한 직업도 없지만—"
901010600130-30 = "미야구치는 도박에 빠져 있어서, 날이 갈수록 빚이 줄기는커녕 오히려 늘어났던 모양이야."
901010600130-31 = "결국에는 \"카르파초 패밀리\"의 사채에도 손을 댄 것 같고……"
901010600130-33 = "카르파초 패밀리요?"
901010600130-34 = "응. 항구의 정문에서 검문을 하고 있는 검은 옷차림의 녀석들. 들어오면서 봤지?"
901010600130-39 = "이 근처에서는 악명이 자자한 패거리인데, 평소에는 카네사키 항의 경비 업무를 담당하고 있거든."
901010600130-40 = "그런데 가끔 신용이 없는 사람들에게 돈을 빌려주기도 하는 모양인데, 카르파초 패밀리의 사채는 이자가 말도 안 되게 높은 모양이야."
901010600130-41 = "그러니 미야구치가 이자를 갚을 수나 있었겠어? 빚이 더 늘어나기 전에 몰래 도망친 거지."
901010600130-42 = "그런 사정이 있었군요…… 무서운 일이네요."
901010600130-43 = "그래. 그러니까 학생은 돈이 모자라더라도 도박 같은 일에는 손도 대지 마."
901010600130-44 = "사채는 물론이고!"
901010600130-45 = "네, 명심할게요."
