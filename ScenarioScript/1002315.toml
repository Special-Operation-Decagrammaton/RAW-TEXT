[translation]
1002315-1 = "노을 지는 해변"
1002315-2 = "저녁 무렵의 해변가"
1002315-4 = "이제 그만 포기하시지!"
1002315-5 = "순순히 투항하면 더 험한 꼴은 안 보게 해줄 테니까!"
1002315-9 = "으, 으읏! 웃기지 마라!"
1002315-10 = "퓨전 요리 전문 바다의 집이라고 해서 주문했더니, 와사비를 넣은 빙수가 나왔다고!!"
1002315-11 = "백번 양보해서 여기까진 괜찮다고 쳐! 하지만 야끼소바에 소스 대신 딸기잼을 넣은 건 너무하잖아?!"
1002315-12 = "말이나 되냐고! 저런 가게는 용서 못 해!"
1002315-14 = "시, 실험적 시도 없이는 발전도 없는 법인데……"
1002315-15 = "[s] \"지나치게 실험적인 느낌이 조금……\""
1002315-16 = "뭘 공감하고 있는 거야? 어쨌든 선도부가 할 일은 하나니까!"
1002315-17 = "빨리 지휘해 줘, 선생님! 얼른 마무리 짓자!"
1002315-18 = "[s] \"어쩔 수 없지!\""
1002315-21 = "크으윽! 이렇게 쓰러질 것 같으냐!"
1002315-28 = "으윽! 이건…… 아프다!"
1002315-33 = "이, 이대로 당하고만 있을 것 같냐!"
1002315-38 = "[ns] \"수류탄……!\""
1002315-39 = "흥! 어림없지!!"
1002315-46 = "[ns1] \"해변으로 쳐냈다……!\"\n[ns2] \"나이스, 이오리!\""
1002315-53 = "[ns] \"아……\""
1002315-56 = "(쏟아지는 바닷물에 홀라당 젖고 말았다……)"
1002315-59 = "휴, 그럭저럭 마무리가 된 것 같네……"
1002315-60 = "선생님, 지휘 좋았……"
1002315-61 = "아니, 왜 그렇게 흠뻑 젖은 거야?! 그사이에 수영이라도 했어?"
1002315-62 = "[s3] \"아까 물속에서 터진 수류탄 때문에……\"\n[s4] \"바닷물을 잔뜩 뒤집어썼어……\""
1002315-65 = "아……"
1002315-66 = "그, 그랬지. 내가 해변가로 쳐서 날리는 바람에……"
1002315-67 = "괜찮아? 다친 곳은 없어?"
1002315-68 = "[s] \"으응…… 축축한 거 말고는 멀쩡해.\""
1002315-69 = "그나마 다행이네……"
1002315-70 = "그나저나 어쩐다. 여름이라도 저녁에는 또 은근히 쌀쌀하단 말이지."
1002315-71 = "그렇게 젖은 상태라면 자칫 잘못하다가 감기에 걸릴지도……"
1002315-72 = "선생님, 혹시 갈아입을 옷은?"
1002315-73 = "[s] \"호텔에……\""
1002315-78 = "그래, 일단 이거라도……"
1002315-83 = "[ns] \"이건……\""
1002315-85 = "[ns] \"이오리가 쓰던 담요?\""
1002315-86 = "어, 어쩔 수 없잖아. 지금 바로 갈아입을 옷도 없고."
1002315-87 = "선생님이 감기에 걸리면 안 되니까……."
1002315-88 = "호텔로 돌아갈 때까지만이라도 덮고 있어."
1002315-89 = "[s] \"따뜻하다……\""
1002315-90 = "그거, 꽤나 아끼는 거니까 조심해서 다뤄!"
1002315-91 = "[s] \"이것도 선도부 비품이야?\""
1002315-92 = "비품이라기보다는, 선도부에 입부했을 때 첫 합숙 훈련에서 받은 기념품이야."
1002315-93 = "재질도 보들보들하고, 따뜻한 느낌이라 맘에 들었지."
1002315-94 = "열받는 일이 있을 때도 그 담요를 덮고 만지작거리다 보면 좀 풀린달까……"
1002315-95 = "[s] \"말하자면 이오리의 애착 담요네.\""
1002315-96 = "그, 그렇게까지는……"
1002315-97 = "[s] \"그런 소중한 담요를 빌려줘서 고마워.\""
1002315-98 = "……"
1002315-99 = "뭐, 여기저기 많이 써서 조금 낡긴 했지만……"
1002315-100 = "[s] \"보통 어디에 쓰는데?\""
1002315-101 = "평소에는 무릎담요로도 쓰고…… 깔고 앉거나 눕기도 하고……"
1002315-102 = "부실에서 쪽잠을 잘 때 이불 대용으로도……"
1002315-105 = "[ns] \"그러고 보니, 이오리의 체취가 느껴지는 것 같아……\""
1002315-106 = "뭐, 뭐라고? 냄새 안 나거든?! 자주 빨거든??"
1002315-107 = "갑자기 이상한 소리 하지 마!!"
1002315-108 = "[ns5] \"(담요의 냄새를 맡아본다)\"\n[ns6] \"(코를 박고 숨을 크게 들이쉰다)\""
1002315-111 = "무, 무슨 짓이야!!!"
1002315-112 = "[s] \"이오리의 냄새!!!!\""
1002315-113 = "당장 내놔!!!!!"
1002315-115 = "(담요를 뺏기는 바람에 결국 가벼운 감기에 걸리고 말았다……)"
