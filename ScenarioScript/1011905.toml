[translation]
1011905-1 = "동트기 전의 어둠"
1011905-2 = "(늦은 저녁. 숙소로 돌아가지 않고 배회하는 불량 학생들을 단속하기 위해, 나구사와 함께 백귀야행의 거리를 순찰하기로 했다.)"
1011905-3 = "(순찰 구역이 넓지 않아 일찍 끝날 거라 생각했지만……)"
1011905-4 = "(……금세 예상 밖의 난관에 봉착했다.)"
1011905-6 = "저기, 이런 늦은 시간에 어째서 공원 근처를 배회하고 있는 거야?"
1011905-7 = "……알 필요 없잖아."
1011905-8 = "물론 자치구 내에서 어딜 가든 학생의 자유이긴 하지만……"
1011905-9 = "이 근처는 인적이 드물어 사고에 휘말리기 쉬우니 가까운 패밀리 레스토랑이나 카페에서 쉬는 건 어떨까?"
1011905-10 = "싫어. 그랬다가는 언니와 마주칠지도 모르잖아."
1011905-11 = "……언니?"
1011905-13 = "[ns] \"혹시 집에서 언니와 무슨 문제가 있었니?\""
1011905-14 = "……아니거든."
1011905-16 = "언니랑 싸우고 홧김에 나오는 바람에 갈 곳을 정하지 못한 게 아니거든!"
1011905-17 = "[s] \"……괜찮다면 언니의 어떤 점이 불만인지 말해 줄래?\""
1011905-19 = "(가출 학생의 상담을 들어주기도 하고……)"
1011905-25 = "……저기."
1011905-26 = "으, 으응? 무, 무슨 일이신가요?"
1011905-27 = "여기서 무얼 하고 있는 거지?"
1011905-28 = "보시다시피 고, 공사를 진행하고 있었답니다."
1011905-29 = "여기에 파묻힌 하수도…… 아니, 상수도를 교체해야 해서……!"
1011905-30 = "내가 알기로는 이 근처에서 진행 중인 수도 공사는 없었던 것으로 아는데."
1011905-31 = "그것도 이런 늦은 밤에……"
1011905-35 = "잠깐 그쪽에 있는 짐을 확인해 봐도 괜찮을까?"
1011905-36 = "으읏……"
1011905-42 = "젠장, 들켰다! 모두 도망쳐!"
1011905-43 = "이 시간에 백화요란이 나타나다니, 이게 도대체 어떻게 된 일이야?"
1011905-44 = "쳇, 축제가 시작되기 전에 폭탄을 파묻어 훼방을 놓으려던 계획이……"
1011905-50 = "……놓치지 않아."
1011905-64 = "(말썽을 부리려는 망량즈를 저지하기도 하고……)"
1011905-66 = "[ns] \"저…… 어르신. 그래서 댁이 어디신가요?\""
1011905-67 = "내 집~? 하늘 아래 내가 발 뻗고 누울 수 있는 곳이 다~ 내 집이지~"
1011905-68 = "이 세상이 다~ 내 집인데 눈치 볼 필요가 있겠나~?"
1011905-69 = "[s1] \"죄송하지만, 여기 누워 계시면 통행에 방해가 되거든요.\"\n[s2] \"일단 가까운 발키리 경찰서까지 안내해 드려도 괜찮을까요?\""
1011905-72 = "뭐어~?! 그 참새 녀석들에게 나를 넘기겠다고?!!"
1011905-73 = "누가 맘대로 끌려갈 줄 알고! 자, 덤벼!"
1011905-74 = "……선생님, 내가 '처리'할까?"
1011905-75 = "[s] \"아, 안 돼……!\""
1011905-77 = "(……만취한 주민을 인계하기도 하면서 생각 외로 오랜 시간이 걸리고 말았다.)"
1011905-79 = "[ns] \"하, 지쳤다…….\""
1011905-80 = "수고 많았어, 선생님."
1011905-81 = "오늘은 평소보다 심야에 말썽을 부리는 사람들이 많았던 느낌이네."
1011905-82 = "시간도 자정을 넘어 새벽이 되어버렸고…… 조금만 더 기다리면 해가 뜨는 걸 지켜볼 수 있을지도 모르겠어."
1011905-83 = "[s] \"그럼 서둘러서 본관으로 돌아갈까?\""
1011905-84 = "잠깐만 기다려줘, 선생님."
1011905-85 = "이 시간에는 달도 저물어서 빛이 들지 않아 하루 중 제일 어두운 때거든."
1011905-86 = "이렇게 어두운 때에 산길을 내려가다가는 발목을 접질릴지도 몰라. 어스름이 깔릴 때까지 잠깐만 쉬었다 가자."
1011905-87 = "……그리고 나도, 오늘은 지쳐서 조금 쉬고 싶던 참이었고."
1011905-89 = "(나구사의 제안에 따라 근처의 찻집 툇마루에서 동이 트기를 기다리기로 했다.)"
1011905-91 = "……조용하네."
1011905-92 = "이 찻집도 하루 종일 손님이 끊이지 않는 시끄러운 장소인데, 이 어중간한 시간만큼은 숨이 멎은 것처럼 아무 소리도 들려 오질 않아."
1011905-96 = "사실 이곳에 온 건 처음이 아니야."
1011905-97 = "그동안 심야 순찰을 하다가 새벽의 어둠이 깔리면 이곳에 와서 동이 틀 때까지 시간을 죽였거든."
1011905-98 = "[s] \"이 장소를 좋아하나 봐?\""
1011905-99 = " ……아니. 사실 그렇게 좋아하진 않아."
1011905-100 = "오히려 무서워서 이곳에 숨어 있다는 표현이 더 맞을 거야."
1011905-101 = "나는 어둠을 무서워하거든."
1011905-104 = "[wa:2040]― [log=나구사ND]동이 트기 직전의 이 순간이……[/log]"
1011905-105 = "[wa:2760]― [log=나구사ND]어둠이 [wa:1960]가장 깊은 때이지.[/log]"
1011905-108 = "― [log=나구사ND]나는…… [wa:2180]이 칠흑 같은 어둠이 두려웠어. [/log]"
1011905-111 = "[wa:1630]― [log=나구사ND]어둠을 밝힐 만큼 [wa:1830]반짝이지도 않고,[/log]"
1011905-112 = "[wa:3540]― [log=나구사ND]밤이 지나가는 걸 [wa:2030]견디는 것조차도……[/log]"
1011905-115 = "― [log=나구사ND]나에게는 [wa:2170]힘든 일이었으니까.[/log]"
1011905-118 = "― [log=나구사ND]다른 이를 연기하며―[/log]"
1011905-119 = "[wa:2640]― [log=나구사ND]그림자에 섞인 채 [wa:710]평정을 가장하며 [wa:2700]숨어있을 수밖에, 없었던 거야.[/log]"
1011905-122 = "― [log=나구사ND]하지만, [wa:1860]더 이상은 [wa:430]아냐.[/log]"
1011905-125 = "[wa:1300]― [log=나구사ND]밤은 언젠가 끝날 테고―[/log]"
1011905-126 = "[wa:2620]― [log=나구사ND]내 그림자가 [wa:2850]땅에 드리울 것을, 알고 있으니까.[/log]"
1011905-129 = "― [log=나구사ND]그러니―[/log]"
1011905-132 = "[wa:1520]― [log=나구사ND]황혼 앞에서 [wa:1840]이름을 고한다.[wa:40] [/log]"
1011905-135 = "― [log=나구사ND]……나는 [wa:1850]백화요란 분쟁조정위원회의[wa:2140] 부장,[/log]"
1011905-136 = "[wa:2010]― [log=나구사ND]고료 [wa:460]나구사![/log]"
1011905-139 = "아, 동이 터오기 시작하네."
1011905-140 = "……정말 혼란스러운 밤이었어. 그렇지?"
1011905-141 = "[s] \"그러게. 정말 정신없는 밤이었네.\""
1011905-142 = "온갖 해괴한 꼴을 한 [ruby=망량들]망량즈[/ruby]가 날뛰는 밤이라……"
1011905-143 = "하지만 어쩌면, 어젯밤이야말로 우리 백귀야행 학원의 이름에 가장 어울리는 날이었을지도 모르겠어."
