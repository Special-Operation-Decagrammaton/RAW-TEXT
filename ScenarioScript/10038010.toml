[translation]
10038010-1 = "제1화;상서롭지 않은 이변"
10038010-5 = "노점 계약서 검토 끝났어? 공연 기자재는?"
10038010-6 = "한 번에 하나씩 하자. 하나씩……. 안 그래도 지금 머리가 터질 것 같다고."
10038010-7 = "어쩌겠어. 월영제는 코 앞이고, 일손은 모자라고……."
10038010-8 = "요리만 할 때가 차라리 편했던 것 같아……."
10038010-9 = "뭐. 매년 하는 일이었잖아. 너무 불평하지 말자고."
10038010-10 = "작년에도 느꼈지만, 축제 준비라는 게 손이 정말 많이 간단 말이지."
10038010-11 = "어디에서 들은 이야기이긴 한데, 일 년 내내 축제만 준비하는 학원도 있대. 백귀…… 야행이었나?"
10038010-15 = "진짜냐. 거기 학생들은 대체 어떻게 사는 건지 궁금하네."
10038010-20 = "다들 준비 잘하고 있어? 일이 좀 많긴 하지?"
10038010-25 = "회, 회장님?! 아뇨, 이 정도는 아무것도 아니죠! 네!"
10038010-26 = "그렇죠! 월영제는 이러니저러니 해도 현무상회의 최대 대목 중 하나니까요!"
10038010-28 = "그래, 그래. 한 번에 바짝 일하고, 일정 끝나면 다 같이 쉬자고. 조금만 더 같이 고생하는 거야. 알았지?"
10038010-37 = "월영제는 분명 현무상회의 매상을 한 번에 끌어올릴 수 있는 기간이기는 합니다만……."
10038010-38 = "그걸 빌미로, 축제 현장의 치안 관리까지 우리 현무상회에게 반쯤 떠넘긴다는 것은, 어떤 종류의 심술마저 느껴진단 말이죠……."
10038010-39 = "뭐, 그 대신 현룡문 애들의 잔소리도 줄어드는 편이잖아? 세상만사, 일장일단이 있기 마련이지."
10038010-40 = "그 여파가 보통 고스란히 저에게 돌아온다는 부분만 뺀다면요……."
10038010-41 = "응. 늘 믿고 있다고, 레이죠."
10038010-42 = "아무래도 좋으니, 현룡문 집행부 쪽에서 트집이나 잡지 않았으면 좋겠네요. 안 그래도 그때 붉은겨울 교류회 이후로……."
10038010-43 = "자, 자. 그 이야기는 지금은…… 아니, 당분간 접어 두자고."
10038010-44 = "경극 공연장에서 정확히 무슨 일이 일어난 걸까요? 회장님은 알고 계십니까?"
10038010-48 = "현룡문 쪽에서는 사소한 사고가 있었다고 이야기할 뿐, 어떤 정보도 이야기하지 않으려 하고."
10038010-49 = "공연을 담당했던 경극부는, 드물게도 전원 근신중이라고만 하니……."
10038010-50 = "……나 역시, 그날 있었던 일이 궁금하지 않다고 하면 거짓말이겠지만……."
10038010-54 = "음……. 역시 이 화제는 여기까지! 지금은 축제 준비가 급하니까 말이지!"
10038010-58 = "……."
10038010-59 = "네. 알겠습니다. 회장님."
10038010-60 = "(어차피 현룡문에서 무언가를 필사적으로 숨기려고 하면, 그걸 알아내는 것은 거의 불가능한 일이기도 하고…….)"
10038010-66 = "우와아아아앗?!"
10038010-71 = "무슨 일이야? 끓는 기름이라도 튀었어?"
10038010-80 = "……세상에."
10038010-81 = "이건…… 도대체 무슨 일이죠? 이런 일은 저로서도 처음입니다만……."
10038010-86 = "너, 너…… 도대체……!"
10038010-91 = "나, 나도 몰라! 정신을 차려 보니 갑자기 몸이 이렇게 돼서……!"
10038010-92 = "하지만 분명 조금 전까지는 괜찮았잖아?! 혹시 뭐 이상한 거라도 먹은 거 아냐?"
10038010-93 = "아니라고! 오늘 하루 종일 축제 현장 점검만 하느라 볶음밥 정도로 간단히 해결했단 말야!"
10038010-97 = "어라……? 그러고 보니, 너……?"
10038010-103 = "나, 나까지?!"
10038010-104 = "이게 어떻게 된 거야!?"
10038010-108 = "어, 어떻게 하죠. 회장님?!"
10038010-109 = "일단 현룡문에 연락해! 연단방에도!"
10038010-110 = "현룡문에…… 말입니까?!"
10038010-111 = "그래. 지금은 그래야 할 상황이야. 그리고–"
10038010-120 = "어……?"
10038010-121 = "어어……?!"
10038010-122 = "이게 대체 무슨 일이야?!?!"
10038010-124 = "뭐…… 라고?!"
10038010-125 = "다시 보고해 보아라. 그것이 사실인가?"
10038010-127 = "네, 넷! 현재 현무상회를 중심으로……."
10038010-131 = "원인을 알 수 없는, '어려지는 현상'이 나타나고 있습니다!"
10038010-132 = "현무상회 회장 아케시로 루미에 대한 격리 조치 및 조사 결과는 다음과 같습니다!"
10038010-136 = "음…… 격리실이라고는 하지만, 취조받고 있는 느낌이네, 이거. 기분이 뭔가 묘한걸."
10038010-137 = "그 점은 양해 부탁드립니다. 루미 회장."
10038010-138 = "회장이 지금 겪고 있는…… '어려지는 현상'에 대해서, 뭔가 더 짐작 가는 부분은 없습니까?"
10038010-139 = "짐작 가는 부분이라고 해도 말이지, 나 참."
10038010-140 = "특별히 이상한 걸 먹거나 마신 기억 같은 것도 없고, 어디 다른 곳을 다녀오지도 않았고."
10038010-141 = "최근에는 수상한 식재료를 취급하지도 않았다고?"
10038010-142 = "아무래도 월영제 직전이고, 축제에서 장사를 하려면 검증된 음식만 내놓아야 하니까."
10038010-143 = "그렇다면 특별히 아무 일도 하지 않았는데, 갑자기 현무상회 부원들이 어린이로 변해 버렸다는 말입니까?"
10038010-144 = "뭐, 그런 거지. 처음에는 부원들이 어린이가 됐고, 나도 이어서……."
10038010-148 = "에에잇! 장사를 위해서라면 무슨 말이든 늘어놓는 현무상회 녀석들의 말을 곧이곧대로 믿을 수 있겠는가!"
10038010-149 = "분명 다 이야기하지 않은 것이나 숨기고 있는 무언가가 있을 것이야!"
10038010-154 = "그만. 정말로 이 일이 현무상회의 소행이라면, 그 회장인 루미 본인은 어떻게 해서든 안전할 수 있는 방법을 강구해 두었을 테지."
10038010-155 = "본인이 가장 큰 손해를 입는 계략이라니, 고육지책에도 정도가 있지 않겠느냐."
10038010-159 = "그, 그것은……! 분명…… 그렇군요. 알겠습니다. 문주님."
10038010-161 = "듣겠다. 보고를 계속하도록 하거라."
10038010-166 = "네! 이 어려지는 현상은 일종의 파급 효과, 혹은 전염 효과가 있는 것으로 보이며."
10038010-167 = "이에 현장에서 조사를 수행 중인 부원들 사이에서는, '어린이 병'이라고 불리고 있다고 합니다!"
10038010-168 = "이 어린이 병은 현재, 현무상회를 중심으로, 서서히 산해경 전반으로 퍼져 나가고 있는 듯합니다!"
10038010-169 = "알겠다. 그 전염…… 파급의 기작은 알아내었느냐?"
10038010-170 = "거, 거기까지는 아직……! 그러나 최초의 근원지에 가까이 있었던 학생들이 기점이 된 것만은 명백해 보입니다!"
10038010-171 = "또한, '어려지는 것' 이외의 증상은 아직 관찰되지 않았으며, 예외적으로 훈육지원부 매화원의 원생들에게는 효과가 나타나지 않았다고 합니다! 이상입니다!"
10038010-172 = "그래. 수고했다. 그렇다면……."
10038010-177 = "우선, 현장의 현룡문 부원들에게 신속히 방호 장구를 지급하라."
10038010-178 = "그와 동시에 가능한 한 빠르게 역학조사를 실시하도록 하라."
10038010-179 = "그리고 역학조사가 어느 정도 완료될 때까지, 현무상회로의 출입을 제한한다."
10038010-181 = "이것이 현룡문의 문주인 류우게 키사키의 뜻이다."
10038010-186 = "네! 명을 받들겠습니다!"
10038010-191 = "미나. 이번만큼은 그대에게도 힘을 빌려야 할 것으로 보이는구나."
10038010-192 = "가서 현장의 일에 보탬이 되어 줄 수 있겠느냐?"
10038010-193 = "!!!"
10038010-194 = "걱정 마십시오, 문주님! 결코 문주님을 실망시켜 드리지 않겠습니다!"
10038010-199 = "후우……."
10038010-200 = "[s] \"미나까지 현장을 돕게 할 필요가 있었어?\""
10038010-201 = "음. 실리적인 측면만을 보자면, 현룡문의 무력을 상징하는 미나를, 구태여 현장에 파견할 필요는 없었겠지."
10038010-202 = "그러나 미나를 현장에 보내는 것으로…… 현룡문 부원들과 산해경의 학생들에게, 어떤 의도를 전달할 필요는 있다고 보았다."
10038010-203 = "무슨 의도냐고? 그렇게 거창한 것은 아니다."
10038010-204 = "그저, 산해경에 어떤 일이 일어나더라도 현룡문의 문주는 산해경을 저버리지 않겠다는 함의이지."
10038010-205 = "[s1] \"키사키가 그런 뜻을 전달해야 한다는 현실이…….\"\n[s2] \"어딘가, 조금 마음에 걸리네.\""
10038010-208 = "……그렇게 생각해 주는 것인가."
10038010-209 = "후후. 선생에게는 진심으로 감사를 표해야겠구나. 그래. 예전이었다면…… 구태여 이런 요식 행위를 벌일 필요도 없었겠지."
10038010-210 = "허나 지금은 아무래도, 그런 행위가 필요한 때인 것으로 보이니 말이다."
10038010-211 = "[s] \"나도 현장에서 뭔가 돕도록 할까?\""
10038010-212 = "선생이? 흐음……. 아니, 그것은 그렇게까지 추천할 수가 없겠구나."
10038010-213 = "어째서냐고?"
10038010-217 = "아마도 이것은 나의 추측이겠지만, 지금 현장에서는…… 선생마저도 그렇게까지 환영받지 못할 상황이 일어나고 있을 듯하니 말이다."
10038010-220 = "요즘 뭔가 어수선하네."
10038010-221 = "현무상회 거리에는 출입 제한이 생겼고……."
10038010-222 = "상회 거리에 가려면 현룡문에서 발행한 통행증이 필요하다지? 거기에 들어간다고 해도, 대부분의 가게는 문을 닫았을 거고."
10038010-223 = "나 거기 마파두부 좋아하는데, 아쉽네……."
10038010-224 = "그런데, 우리는 괜찮을까?"
10038010-225 = "뭐가?"
10038010-226 = "그…… 증상, 말이야."
10038010-227 = "……."
10038010-228 = "일단 현룡문에서는, 어린이가 되는 것 말고는 큰 이상이 없다고 안심하라고는 하지만……."
10038010-229 = "그래도 역시, 그렇게 되면 여러모로 제한이 걸릴 것 아냐?"
10038010-230 = "그건 그렇겠지……."
10038010-232 = "처음 증상이 나타났던 곳이, 현무상회 거리였다며?"
10038010-233 = "역시, 외부 학생들이 문제인 것 아닐까……? 그, 얼마 전에도 뭔가 시끄러웠었고."
10038010-236 = "현무상회에는 외부 학생들이 많이 드나드니까. 거기에서 무슨 일이 생겼던 것일 수도 있겠지……."
10038010-237 = "이번 월영제, 괜찮으려나. 또 외부 학생들을 받아들였다가, 더 큰 일이 나는 거 아냐?"
10038010-240 = "듣자 하니, 육화각에는 지금 샬레의 선생님도 와 있다며? 그분도 결국은…… 외부인이고 말이지?"
10038010-241 = "그래도 일이 이렇게까지 되었는데, 문주님께서도 뭔가 대책을 세우지 않을까? 안 그래도 미나 집행부장이 직접 현장에 나와 있다고 하니까."
10038010-242 = "그건 그나마 안심이 되는데……."
10038010-243 = "그리고 꼭 현무상회가 문제의 원인이라고 확신할 수는 없잖아? 아직은 여러 가지로 조사중인 모양이니까."
10038010-247 = "그렇지만 결국 둘 중 하나 아니겠어? 현무상회가 아니라면, 역시 그곳이……!"
10038010-256 = "자, 잠깐만! 억울한 것이다! 연단방은 이번 사태와는 무관한 것이다!"
10038010-257 = "일단은 참고인 조사니까, 동행을 부탁합니다. 야쿠시 사야 부장."
10038010-258 = "사야 부장을 비롯한 연단방이 용의선상에 오른 상황이니, 저희로서도 어쩔 수 없는 부분이 있습니다. 양해 부탁합니다."
10038010-259 = "……산해경 학생들 사이에서도, 현무상회가 원인이 아니라면, 분명 연단방이 무언가를 저질렀을 거라는 의견이 대다수이기도 하고요……."
10038010-264 = "그러니까 아니라는 것이다! 연단방은, 연단방은……!"
10038010-270 = "(호, 혹시! 예전 슌 교관에게 주었던 <회춘의 비약>에 대한 정보가 유출된 것인가……?!)"
10038010-273 = "저…… 만에 하나를 위해 물어보는 것이다만…… 연단방에서 만든, 피부가 부드러워지는 약 때문에 그러는 것이냐……?"
10038010-274 = "연단방에서 그런 것도 만들었습니까? 처음 듣는 소식이네요."
10038010-275 = "그와는 별개로, 약의 내용에 대해서는 흥미가 생기네요. 나중에 샘플이라도 좀……."
10038010-279 = "그러면 참고인 조사도 면제해 주는 것이냐?"
10038010-280 = "그건 그거고, 이건 이거죠."
10038010-281 = "그럴 거라고 생각하기는 했다만!"
10038010-282 = "으으으으…… 무언가 병리학적, 약학적으로 수상한 일이 생기면, 연단방을 의심하게 되는 것도 어쩔 수 없겠지만."
10038010-283 = "분명 객관적으로는 그렇지만! 그렇기는 하지만!"
10038010-284 = "그래도 역시 억울한 것이다! 나님은 이번에는 아무것도 하지 않았단 말이다!"
10038010-286 = "'이번에는'……?"
10038010-291 = "……말이 헛나온 것이다!"
10038010-292 = "뭐, 지금은 그냥 참고인 조사니까요."
10038010-293 = "그렇지만 그게 조금 더 진행되면, 결국 용의자 조사가 되는 것이 아니냐?"
10038010-294 = "음……. 그럴 가능성을 완전히 부정할 수는 없을 것 같네요."
10038010-295 = "현룡문이 그렇게 말한다면, 결국에는 그렇게 되는 것 아니냐–!"
10038010-300 = "중간보고를 올리겠습니다. 문주님."
10038010-301 = "현 연단방 부장 사야는 순순히 심문에 응하고 있습니다만, 특별히 단서가 될 만한 증언은 아직까지는 없었습니다."
10038010-302 = "아직까지는, 이라 하였느냐? 그것이 큰 의미 없는 수식어였으면 하는구나."
10038010-303 = "……저기, 그것이. 문주님. 이것은 심문에 참여했던 저의 느낌일 뿐입니다만……."
10038010-308 = "사야 부장이 무언가를 이야기하지 않고 있는 것 같기는 합니다."
10038010-309 = "금번 산해경의 이 '어려지는 현상'에 대해, 완전히 모른다는 느낌의 말을 하고 있지도 않고요."
10038010-310 = "완전히 부정하는 말은 꺼내지 않았다? 그건 미묘한 일이로구나. 사야는 그렇게 보여도 거짓말에 능숙하지는 않은 성격이니……."
10038010-314 = "음? 왜 그러는가, 선생. 무언가 짐작이 가는 점이라도 있는가?"
10038010-315 = "[s] \"아, 아니! 아무것도 아니야! 응!\""
10038010-316 = "흐음……? 뭐, 좋다. 선생의 말을 믿도록 하지."
10038010-317 = "선생이 구태여 나에게까지 무언가를 숨기고 있다면, 거기에는 그만한 이유가 있을 터이고 말이다?"
10038010-318 = "알겠다. 이어서 듣도록 하마."
10038010-319 = "네! 그리고…… 산해경의 학생들 사이에서, 또 다른 불온한 소문이 퍼지고 있다는 보고입니다!"
10038010-320 = "시국이 이러하니, 좋은 소문이 횡행하리라고는 생각되지 않기는 한다만."
10038010-321 = "구태여 이 자리에서까지 그런 보고를 올리는 것에는, 그만한 이유가 있을 테지?"
10038010-325 = "그, 그렇습니다! 그 소문의 내용이라는 것이, 그게……."
10038010-336 = "저기, 그 소문 들었어?"
10038010-337 = "요새 도는 소문이 한두 개가 아닐 텐데……. 어떤 거?"
10038010-338 = "그…… 연단방 부장이 돌아왔다는 거."
10038010-339 = "응? 연단방 부장은 야쿠시 사야잖아. 어디 갔다 오기라도 했대?"
10038010-340 = "말고. 사야 이전에 있었던 학생……."
10038010-341 = "그런 학생이 있었나……?"
10038010-342 = "나도 지나가다 전해 들은 게 전부지만. 오욕의…… 미후였던가? 일곱 죄수 중 한 명이라던데."
10038010-346 = "어? 우리 학교에 일곱 죄수가 있었어?"
10038010-347 = "그랬다고 하더라. 원래 그 학생이 연단방 부장이었는데, 퇴학당했다고."
10038010-348 = "나 처음 들어. 그래서 이름이 뭔데?"
10038010-349 = "신타니 카이라고 하더라."
10038010-350 = "……진짜 처음 듣는다……."
10038010-351 = "3학년들 중에서는 아는 선배들이 가끔 있대."
10038010-355 = "그 말이 사실인가?"
10038010-356 = "……그렇습니다. 소문의…… 무거움에 비해 동요는 그렇게까지 크지 않습니다만, 이런 소문이 퍼지고 있다는 사실 자체가……."
10038010-357 = "……."
10038010-358 = "퇴학당한 학생이, 아무 절차 없이 모교로 돌아오는 것은 어려운 일이다."
10038010-359 = "하물며 그것이 그 신타니 카이여서야…… 더더욱 그렇겠지."
10038010-360 = "그러나 그 이름을 기억하고 있는 학생들 사이에서는, 이는 결코 간과할 수 없는 문제일 것이다. 이것이 헛소문이라면, 잠재워 둘 필요가 있겠구나."
10038010-364 = "알겠습니다, 문주님!"
10038010-368 = "후우……."
10038010-369 = "[s] \"조금 전부터 모르겠는 게 하나 있는데.\""
10038010-370 = "음? 무슨 일인가, 선생."
10038010-371 = "아, 그렇군. 신타니 카이에 대해서, 말인가……."
10038010-372 = "……."
10038010-373 = "이 시점에서 카이에 대한 것을 이야기하기 어렵다고 한다면, 그대는 어떻게 하겠는가?"
10038010-374 = "내가 구태여 선생에게까지 무언가를 숨기려 한다면, 그만한 이유가 있을 것으로 믿겠다고?"
10038010-378 = "후후. 이거 한 방 먹었구나. 그래. 선생에게는 그렇게 이야기할 자격이 있지."
10038010-382 = "……내게 조금만 시간을 주었으면 한다. 선생. 조금만."
10038010-383 = "선생의 문제는 아니다. 이것은 어디까지나 나 자신의 문제이고……."
10038010-384 = "……나아가, 산해경의 과거에 관한 문제이기도 한 것이니."
