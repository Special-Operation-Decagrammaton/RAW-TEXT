[translation]
10055195-2 = "키키킷……."
10055195-3 = "키시시시싯!!! 마침내, 붉은겨울마저 쓰러졌다!!"
10055195-4 = "이로써 게헨나를 넘어서는 학원이 없다는 사실이 증명된 거다!"
10055195-5 = "하찮은 키보토스의 인간들이여! 지배해주마! 이 마코토 님의 지혜와 힘 앞에 무릎을 꿇어라!"
10055195-6 = "지배해주마-!"
10055195-7 = "아, 이부키가 배우니까 이상한 소리 하지 말아주세요."
10055195-8 = "<여왕의 소원권>이여! 이 몸의 소원을 이뤄다오!"
10055195-9 = "소원은 뭘로 빌 거야?"
10055195-10 = "당연한 것을 묻는군! 그야 세계 정복으로 정해져 있지 않느냐!"
10055195-11 = "그럴 줄 알았어요."
10055195-12 = "그러면 나의 소원을……!"
10055195-16 = "……."
10055195-17 = "마코토 선배?"
10055195-18 = "……아니, 역시."
10055195-22 = "내 소원은……."
10055195-27 = "아, 일어났다."
10055195-28 = "거 봐요. 몸 튼튼한 거 빼면 시체라니까요."
10055195-32 = "응……?"
10055195-33 = "어떻게 된 거지……?"
10055195-34 = "기억 안 나? 마코토 쨩, 갈매기를 잡겠다면서 배 위에 올라갔다가 거꾸로 떨어졌잖아."
10055195-38 = "타이거샤크마루는?! 어떤 소원도 들어주는 <여왕의 소원권>은?!"
10055195-42 = "네……?"
10055195-43 = "그게, 뭔……. 잠꼬대 정도는 말이 되게 하면 안 될까요?"
10055195-44 = "잠꼬대니까 말이 안 되는 거 아냐?"
10055195-45 = "……그건 그렇네요."
10055195-46 = "그게 전부 꿈이었다고?! 말도 안 돼!!"
10055195-50 = "나 다시 돌아갈래!!!!"
10055195-54 = "응?"
10055195-55 = "와아~ 귀여운 소라게 씨다!"
10055195-58 = "호시노 선배~!"
10055195-61 = "우왓?!"
10055195-62 = "아, 진짜! 정말로 자고 있던 거야?"
10055195-63 = "어, 그러니까~ 이게……."
10055195-64 = "창고 정리! 부탁했잖아!"
10055195-65 = "참참~ 그랬지~ 그랬는데~"
10055195-66 = "그랬는데! 잠들어 버렸고! 변명은?"
10055195-67 = "없습니다……."
10055195-68 = "하여튼…… 얼른 일어나! 도와줄 테니까! 둘이서 하면 빨리 끝날 거야."
10055195-69 = "으헤~ 역시 세리카 쨩~ 귀여운 후배는 두고 볼 일이라니까~"
10055195-70 = "시, 시끄러워! 자꾸 놀리면 화낸다?!"
10055195-74 = "……선배?"
10055195-75 = "아까부터 반응이 좀 굼뜬데, 괜찮아? 혹시 이상한 꿈이라도……?"
10055195-76 = "으, 응?"
10055195-77 = "아냐아냐, 그냥 평범한 개꿈이었어."
10055195-78 = "아니, 그보다는 게꿈……?"
10055195-79 = "……뭐, 그치만."
10055195-80 = "귀여운 바다 생물을 잔뜩 봐서, 조금 이득 본 기분일지도~"
