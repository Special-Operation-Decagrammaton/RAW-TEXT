[translation]
10055195-2 = "คิกคิกคิก..."
10055195-3 = "คิกคิกคิก!!! ในที่สุด แม้แต่เรดวินเทอร์ก็ยังถูกโค่นลงจนได้!!"
10055195-4 = "เท่านี้ก็พิสูจน์แล้วว่าไม่มีโรงเรียนไหนที่จะเหนือกว่าเกเฮนน่า!"
10055195-5 = "พวกผู้คนแสนต่ำต้อยแห่งคิโวทอสเอ๋ย! เราจะปกครองพวกเจ้าเอง!#nจงคุกเข่าต่อหน้าสติปัญญาเฉียบแหลมและพลังของท่านมาโคโตะผู้นี้ซะ! "
10055195-6 = "เราจะปกครองเอง!"
10055195-7 = "อย่าพูดอะไรแปลกๆ สิคะ เดี๋ยวอิบูกิจะจำไปพูดนะคะ"
10055195-8 = "<ตั๋วขอพรของราชินี> เอ๋ย! จงทำให้ความปรารถนาของเราเป็นจริง!"
10055195-9 = "จะขอพรว่าอะไรเหรอ?"
10055195-10 = "จะถามเรื่องที่รู้อยู่แล้วไปทำไม! ก็ต้องเรื่องพิชิตโลกอยู่แล้วไม่ใช่หรือไง!"
10055195-11 = "คิดไว้ไม่มีผิดเลยค่ะ"
10055195-12 = "ถ้าอย่างนั้น ความปรารถนาของเรา...!"
10055195-13 = ""
10055195-15 = ""
10055195-16 = "......"
10055195-17 = "รุ่นพี่มาโคโตะ?"
10055195-18 = "ไม่สิ คิดดูอีกที"
10055195-19 = ""
10055195-21 = ""
10055195-22 = "ความปรารถนาของเรา..."
10055195-27 = "อ๊ะ ตื่นแล้ว"
10055195-28 = "เห็นมั้ยคะ ก็บอกแล้วไงคะว่านอกจากร่างกายแข็งแรง ที่เหลือก็ไม่มีอะไรอื่นดีแล้วเลยค่ะ"
10055195-29 = ""
10055195-31 = ""
10055195-32 = "หืม...?"
10055195-33 = "เกิดอะไรขึ้น...?"
10055195-34 = "จำไม่ได้เหรอ? มาโคโตะจังบอกว่าจะจับนกนางนวล แล้วปีนขึ้นไปบนเรือก่อนจะตกลงมาหัวทิ่มน่ะ"
10055195-35 = ""
10055195-37 = ""
10055195-38 = "แล้วไทเกอร์ชาร์กมารุล่ะ?! แล้ว <ตั๋วขอพรของราชินี> ที่ทำให้ทุกความปรารถนาเป็นจริงล่ะ?!"
10055195-39 = ""
10055195-41 = ""
10055195-42 = "คะ...?"
10055195-43 = "พูดอะไรกันคะ... จะละเมออะไรก็ช่วยพูดให้ฟังรู้เรื่องหน่อยได้มั้ยคะ?"
10055195-44 = "ก็เพราะละเมอไม่ใช่เหรอถึงฟังไม่รู้เรื่องน่ะ?"
10055195-45 = "ก็จริงค่ะ..."
10055195-46 = "เรื่องทั้งหมดนั่นเป็นความฝันเหรอ?! เป็นไปไม่ได้!!"
10055195-47 = ""
10055195-49 = ""
10055195-50 = "เราจะกลับไปที่นั่นอีก!!!!"
10055195-51 = ""
10055195-53 = ""
10055195-54 = "หืม?"
10055195-55 = "ว้าว~ คุณปูเสฉวนน่ารักๆ!"
10055195-58 = "รุ่นพี่โฮชิโนะ~!"
10055195-60 = ""
10055195-61 = "ว้ากก?!"
10055195-62 = "โธ่ จริงๆ เลย! หลับอยู่จริงๆ เหรอเนี่ย?"
10055195-63 = "เอ่อ คือว่า~ เรื่องนี้มัน..."
10055195-64 = "ฉันขอให้ช่วยจัดคลังไม่ใช่รึไง!"
10055195-65 = "จริงด้วย~ ใช่แล้ว~ มันก็ใช่อยู่หรอก~"
10055195-66 = "ใช่แล้ว! แต่ว่าดันหลับไปแบบนี้มีข้อแก้ตัวอะไรมั้ย?"
10055195-67 = "ไม่มีเลย..."
10055195-68 = "เฮ้อ... รีบๆ ลุกขึ้นเลย! เดี๋ยวฉันช่วยเอง ทำสองคนจะได้เสร็จเร็วขึ้น"
10055195-69 = "แหะๆ~ สมกับเป็นเซริกะจังที่สุดเลย~ มีรุ่นน้องน่ารักๆ นี่ดีจริงๆ นะ~"
10055195-70 = "งะ... เงียบไปเลย! ถ้ายังล้อเล่นอีกฉันจะโกรธแล้วนะ?!"
10055195-71 = ""
10055195-73 = ""
10055195-74 = "รุ่นพี่...?"
10055195-75 = "ตั้งแต่เมื่อกี้ดูตอบสนองช้าๆ นะ ไม่เป็นไรใช่มั้ย? หรือว่าฝันอะไรแปลกๆ งั้นเหรอ?"
10055195-76 = "อะ... อืม?"
10055195-77 = "เปล่าหรอกๆ ก็แค่ฝันอะไรไปเรื่อยเปื่อยน่ะ"
10055195-78 = "ไม่สิ ต้องเรียกว่าฝันอะไรเกี่ยวกับปูๆ มากกว่ามั้ง..."
10055195-79 = "อืม แต่ก็นะ..."
10055195-80 = "ได้เห็นสัตว์ทะเลน่ารักตั้งเยอะเลย รู้สึกเหมือนได้กำไรนิดหน่อยแฮะ~"
