[translation]
10055195-2 = "嘻嘻……"
10055195-3 = "嘰嘻嘻嘻！！！終於連赤冬也倒下了！！"
10055195-4 = "這下就證明沒有任何學園能超越格黑娜了！"
10055195-5 = "微不足道的奇普托斯人們啊！本大人要支配你們！#n跪倒在我真琴大人的智慧與力量之下吧！"
10055195-6 = "要支配你們～！"
10055195-7 = "啊，伊吹會學起來的，請不要說奇怪的話。"
10055195-8 = "「女王的許願券」啊！實現本大人的願望吧！"
10055195-9 = "你要許什麼願？"
10055195-10 = "問這什麼理所當然的問題！當然是征服世界啊！"
10055195-11 = "我就知道。"
10055195-12 = "那麼，我的願望是……！"
10055195-13 = ""
10055195-15 = ""
10055195-16 = "……"
10055195-17 = "真琴前輩？"
10055195-18 = "不，果然還是……"
10055195-19 = ""
10055195-21 = ""
10055195-22 = "我的願望是……"
10055195-27 = "啊，醒了。"
10055195-28 = "我就說吧。真琴前輩就只有身體強壯值得說嘴而已。"
10055195-29 = ""
10055195-31 = ""
10055195-32 = "嗯……？"
10055195-33 = "這是怎麼回事……？"
10055195-34 = "你不記得了嗎？#n真琴醬剛才說要抓海鷗而爬到船上，結果頭下腳上地摔了下來。"
10055195-35 = ""
10055195-37 = ""
10055195-38 = "虎鯊丸呢！？能實現任何願望的「女王的許願券」呢！？"
10055195-39 = ""
10055195-41 = ""
10055195-42 = "什麼……？"
10055195-43 = "那是什麼……說夢話也說得合理一點好嗎？"
10055195-44 = "就是因為是夢話才不合理吧？"
10055195-45 = "……好像也是。"
10055195-46 = "那些全都是夢！？怎麼可能！！"
10055195-47 = ""
10055195-49 = ""
10055195-50 = "快點讓我回去！！！！"
10055195-51 = ""
10055195-53 = ""
10055195-54 = "嗯？"
10055195-55 = "哇～是可愛的寄居蟹先生！"
10055195-58 = "星野前輩～！"
10055195-60 = ""
10055195-61 = "嗚哇！？"
10055195-62 = "真是的！你真的睡著了啊？"
10055195-63 = "啊，那個～這是……"
10055195-64 = "整理倉庫！我不是拜託過你了嗎！"
10055195-65 = "對對～是這樣沒錯啦～可是～"
10055195-66 = "可是什麼！你都睡著了還有什麼藉口？"
10055195-67 = "沒有……"
10055195-68 = "真是的……快點起來！我來幫你！#n兩個人一起做很快就能結束了。"
10055195-69 = "唔嘿～不愧是茜香醬～可愛的後輩果然值得擁有呢～"
10055195-70 = "少，少囉嗦！再一直捉弄我的話，我真的要生氣了哦！？"
