[translation]
10055195-2 = "キキキッ……。"
10055195-3 = "キシシシッ！ついにレッドウィンターまで倒れた！！"
10055195-4 = "これでゲヘナに勝てる学園はないと証明されたのだ！"
10055195-5 = "キヴォトスに住まう有象無象の民よ！このマコト様の英知と力に、ひざまずけ！"
10055195-6 = "私が貴様らを支配してやる！"
10055195-7 = "はあ……イブキが真似するから変なこと言わないでください。"
10055195-8 = "「クイーンのなんでも券」よ！私の願いを叶えたまえ！"
10055195-9 = "それで？結局お願いは何にするの？"
10055195-10 = "愚問だな。世界征服に決まっているだろう！"
10055195-11 = "だと思いました……。"
10055195-12 = "では私の願いを……！"
10055195-16 = "……。"
10055195-17 = "マコト先輩？"
10055195-18 = "いや、やはり……。"
10055195-22 = "私の、願いは……。"
10055195-27 = "あ、起きたわ。"
10055195-28 = "言ったでしょう？体が丈夫なことだけが、マコト先輩のとりえなんですから。"
10055195-32 = "ん……？"
10055195-33 = "どういうことだ、これは……？"
10055195-34 = "覚えてない？マコトちゃん、カモメを捕まえるって言って船の上に登ろうとして、#nそこから真っ逆さまに落ちたのよ。"
10055195-38 = "タイガーシャーク丸はどうした！？#nどんな願いも叶える「クイーンのなんでも券」は！？"
10055195-42 = "はい……？"
10055195-43 = "あの……寝言くらいまともなこと言ってくれませんか？"
10055195-44 = "寝言だからまともじゃないんじゃないの？"
10055195-45 = "……それもそうですね。"
10055195-46 = "あれが全部夢だと！？そんな馬鹿な！"
10055195-50 = "認めん！私は認めんぞおおお！！！"
10055195-54 = "あれ？"
10055195-55 = "わあ～かわいいヤドカリさんだ！"
10055195-58 = "ホシノ先輩！"
10055195-61 = "わっ！？"
10055195-62 = "もう！本当に寝てたの！？"
10055195-63 = "あー……えーっとぉ～"
10055195-64 = "倉庫の整理！お願いしたでしょ！？"
10055195-65 = "そうそう、そうなんだけどさ～"
10055195-66 = "そうなんだけど寝てたんでしょ！言い訳は？"
10055195-67 = "ありません……。"
10055195-68 = "まったく……手伝ってあげるから、早く起きて！二人でやればすぐ終わるでしょ。"
10055195-69 = "うへ～さすがセリカちゃん～持つべきは可愛い後輩だね～"
10055195-70 = "う、うるさいっ！あんまからかうと怒るわよ！？"
10055195-74 = "……ホシノ先輩？"
10055195-75 = "起きてからなんか変だけど、大丈夫？もしかして悪い夢でも……。"
10055195-76 = "ん……？"
10055195-77 = "いや～？ただの意味のない夢だよ～"
10055195-78 = "いや……カニのある夢か。"
10055195-79 = "まあでも……。"
10055195-80 = "かわいい海の生き物たくさん見れたし、得しちゃったかな～"
