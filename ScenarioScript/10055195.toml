10055195-74 = "……前輩？"
10055195-75 = "你從剛才反應就有點遲鈍，沒事吧？#n該不會做了什麼奇怪的夢……？"
10055195-76 = "嗯，嗯？"
10055195-77 = "沒有沒有，只是做了一個有點瞎的夢而已。"
10055195-78 = "不，還是應該說蟹夢比較對……？"
10055195-79 = "不過……"
10055195-80 = "看到了好多可愛的海洋生物，感覺好像賺到了呢～"
