[translation]
2006106-1 = "해묵은 빚"
2006106-2 = "(카스미가 알려준 약속 장소로 찾아갔다.)"
2006106-7 = "(카스미가 누군가와 험악한 분위기로 대화하고 있다.)"
2006106-8 = "(……본 적 없는 교복을 입은 학생이다.)"
2006106-10 = "키누가와 카스미. 벗어난 줄 알았나?"
2006106-14 = "내가 그쪽 눈치를 왜 봐?"
2006106-15 = "봐야 할 걸?"
2006106-17 = "[ns] \"카스미.\""
2006106-21 = "응?"
2006106-22 = "어라, 선생님이 왜 여기…… 아, 내가 불렀지, 참."
2006106-24 = "……선생님?"
2006106-29 = "오늘은 운이 좋았군, 키누가와 카스미."
2006106-30 = "오늘? 나는 항상 재수 좋아."
2006106-32 = "하지만 명심해라. 보덴사츠는 주시한다."
2006106-33 = "그 밑바닥에서? 그래, 평생 올려다봐."
2006106-44 = "아아! 선생님! 이거 미안해서 어쩌나!"
2006106-45 = "내가 불러냈지만, 오늘은 역시 안 되겠어! 먼저 돌아가줄래?"
2006106-46 = "[s] \"괜찮아?\""
2006106-47 = "나? 나야 당연히 멀쩡하지."
2006106-51 = "아무튼, 빨리 들어가. 정말로 미안!"
2006106-53 = "(결국, 카스미의 강한 권유에 곧바로 돌아오게 되었다.)"
