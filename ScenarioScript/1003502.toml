[translation]
1003502-1 = "고서관의 주인"
1003502-2 = "트리니티 거리"
1003502-3 = "(시간을 내서 고서관 앞으로 찾아갔다.)"
1003502-4 = "(여전히 문은 굳게 닫혀 있었고, 건물 주변으론 급조된 바리케이드가 쳐져 있었다.)"
1003502-7 = "[ns1] 우이를 불러본다.\n[ns2] 조심스럽게 노크한다."
1003502-10 = "(……대답이 없다.)"
1003502-11 = "[s3] 좀 더 큰 목소리로 불러본다.\n[s4] 좀 더 세게 노크한다."
1003502-12 = "안에 아무도 없어요! 없으니까 돌아가세요!"
1003502-13 = "안에 아무도 없어요! 없으니까 돌아가세요!"
1003502-14 = "[s5] \"없는데 어떻게 대답이 돌아오는 거야?\"\n[s6] \"나야, 우이.\""
1003502-15 = "아, 진짜……. 없다면 없는 줄 알면 되지 왜 이렇게 말이 길어요!"
1003502-16 = "아, 진짜……. 없다면 없는 줄 알면 되지 왜 이렇게 말이 길어요!"
1003502-17 = "안에 아무도 없다니까……!"
1003502-18 = "……음?"
1003502-19 = "잠깐. 이 목소리는……."
1003502-25 = "……헉!?"
1003502-26 = "서, 선생님! 역시 선생님이셨군요!"
1003502-27 = "죄, 죄송합니다. 그런 줄도 모르고……. 또 바깥사람인 줄 알고……."
1003502-28 = "[s7] \"어……. 일단 맞긴 한데…….\"\n[s8] \"괜찮아. 신경 쓰지 마.\""
1003502-29 = "우, 우선 이쪽으로……."
1003502-30 = "우, 우선 이쪽으로……."
1003502-31 = "네? 안으로 들어가도 괜찮은 거냐고요? 그, 그야 물론이죠! 선생님이시니까!"
1003502-32 = "……아. 잠깐."
1003502-33 = "[s9] \"……우이?\"\n[s10] \"왜 그래? 무슨 일 있어?\""
1003502-34 = "아, 그. 그……. 그러니까 그……. 그게……."
1003502-35 = "아, 그. 그……. 그러니까 그……. 그게……."
1003502-36 = "자, 잠시만요! 진짜 잠시만 기다려 주세요!"
1003502-46 = "……휴우."
1003502-47 = "다, 다 됐어요……. 이제 괜찮아요……."
1003502-48 = "왜, 왜 그렇게 보시는 거예요!? 아, 아니에요! 청소 때문에 그런 게 아니니까……!"
1003502-49 = "아, 아니 아예 완전히 안 그렇다는 건 아니지만 아무튼……!"
1003502-50 = "……드, 들어오세요!"
1003502-54 = "[ns] 우이를 따라 들어간다."
1003502-57 = "고서관 내부"
1003502-58 = "(우이를 따라 들어간 고서관은 이름처럼 오래된 분위기가 물씬 풍겼다.)"
1003502-59 = "(중간중간 급히 치워 두거나 가려 둔 옷가지와 잡동사니가 보였다.)"
1003502-60 = "어, 어서 오세요……. 선생님……."
1003502-61 = "……아, 아아! 안 돼요! 그 쪽은! 아직 덜 치웠으니까 거긴 안 돼요!"
1003502-62 = "죄송합니다……. 이렇게 될 줄 알았으면 미리 좀 치워 놓거나, 애들한테 부탁 좀 하는 건데……."
1003502-63 = "여긴 워낙 사람들이 찾아올 일이 없는 곳이다 보니……."
1003502-64 = "보통은 책을 빌릴 때에도 여기가 아니라 중앙도서관을 통하니까요. 어지간한 고서가 아니고선……."
1003502-65 = "그, 그러고 보니 선생님께서는 일부러 여기까지 무슨 일이신가요?"
1003502-66 = "혹시 대도서관엔 등록되지 않은……. 특별하게 필요하신 아이라도 있으신 건가요?"
1003502-67 = "네? 그런 건 아니라고요? 그럼……."
1003502-68 = "……그, 그냥 한번 와보신 거라고요? 아까 전 메시지 때문에……?"
1003502-69 = "……아. 그거……. 시, 신경 쓰실 거 없는데……."
1003502-70 = "이미 지난 일이기도 하고……. 딱히 무슨 일이 있었던 건 아니니까요."
1003502-71 = "그냥……. 그……."
1003502-72 = "대여됐던 애들이……. 그러니까 책이 돌아왔을 때, 좀 상태들이……."
1003502-73 = "중간 중간 페이지를 체크한답시고 막 접어두질 않나, 편 채로 너무 세게 눌러서 중간 이음새가 벌어져 있질 않나……."
1003502-74 = "……하아……."
1003502-75 = "이래서 어지간하면 바깥 사람들이랑은 엮이기 싫었는데, 그래도 대여에 관해서는 어쩔 수 없었어서……."
1003502-76 = "…….아무튼 죄송합니다. 앞으로는 자제할게요……."
1003502-77 = "……네? 괜찮으시다고요?"
1003502-78 = "오히려 좀 더 자주 이야기해서 풀어도 좋다고요? 그, 그치만 그건 민폐인데요……."
1003502-79 = "……네?"
1003502-80 = "선생님에게는 업무의 일환이니 전혀 문제가 되지 않는다……고요?"
1003502-81 = "자, 잘은 모르지만……. 일단은 알겠습니다. 감사합니다, 선생님."
1003502-82 = "……어……. 음……."
1003502-83 = "잠깐만요. 그럼 뭔가……. 제 쪽에서도……."
1003502-88 = "……찾았다."
1003502-93 = "……선생님, 여기……."
1003502-94 = "[s11] \"……이건?\"\n[s12] \"열쇠……?\""
1003502-95 = "……아. 네. 여기 정문 열쇠……예요."
1003502-96 = "……아. 네. 여기 정문 열쇠……예요."
1003502-97 = "저 자고 있거나……. 아무튼 아무 때나, 선생님 원하실 때 오실 수 있도록……."
1003502-98 = "네? 도서부 부원들의 열쇠냐고요? 아, 아뇨. 여분 같은 건 만들어 두지 않았는데요……."
1003502-99 = "……저요? 아뇨. 열쇠는 여분이 없어요. 그거 하나가 전부입니다……."
1003502-100 = "어, 어차피 저야 여기서 안 나가니까요! 막상 저한테는 쓸 일도 없는 열쇠인걸요! 아하하……."
1003502-101 = "그, 그냥 오늘처럼 또 선생님께 실수하고 싶지 않으니……."
1003502-102 = "문 열고 알아서 들어오실 수 있으면……. 바깥 사람들과 구분할 수도 있을 거고……."
1003502-103 = "……어……."
1003502-108 = "왜 다시 돌려주시는 거죠……."
1003502-109 = "……아."
1003502-110 = "역시 필요 없으신 건가요? 이런 곳의 열쇠는……. 죄송합니다. 제가 또 자의식 과잉을……."
1003502-111 = "……그런 게 아니라고요? 그러면……."
1003502-112 = "[s13] \"역시 열쇠는 주인이 가지고 있어야지.\"\n[s14] \"난 오기 전에 모모톡으로 연락하면 되니까.\""
1003502-113 = "선생님……."
1003502-114 = "선생님……."
1003502-115 = "알겠습니다. 대신 앞으로는 선생님께서 오신다 할 때 미리 준비라도 잘해 놓을게요."
1003502-116 = "……으헤헤."
1003502-117 = "뭔가, 생각지도 않게 오늘은 수확이 많네요."
1003502-118 = "……그럼 선생님……."
1003502-119 = "이왕 고서관까지 오신 김에……. 제가 괜찮은 아이 몇 권 소개시켜 드려도 괜찮을까요?"
1003502-120 = "이래봬도 선생님께서 흥미를 가지실 만한, 재미있는 책들이 꽤 많답니다."
1003502-122 = "(이후 우이와 함께 고서관의 고서들을 읽으며 시간을 보내다 돌아왔다.)"
