[translation]
83305100200-5 = "부장님! 전화 받았습니다!"
83305100200-6 = "아코. 잠시 부탁하고 싶은 게 있어서 전화했어."
83305100200-7 = "부탁……이라고 하심은……"
83305100200-8 = "오늘 있을 피아노 공연, 내가 가진 최선을 다하고 싶어."
83305100200-9 = "만전을 다해 임하고 싶어. 그래서 말인데."
83305100200-10 = "네, 오늘 부장님의 오전 업무는 오프로 처리해 놓겠습니다."
83305100200-11 = "아코……"
83305100200-12 = "히나 부장님이 하고자 하는 일을 전력으로 서포트하는 것."
83305100200-13 = "그것이 저 아마우 아코가 반드시 해내야 하는 일이니까요. 그러니 걱정 마세요."
83305100200-14 = "……고마워. 아코."
83305100200-15 = "게다가 선생님뿐만이 아니라 저 또한…… 네, 기다리고 있을 테니까요."
83305100200-16 = "응, 그럼 잠시 후에."
