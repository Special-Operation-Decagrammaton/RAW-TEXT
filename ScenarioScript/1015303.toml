[translation]
1015303-1 = "평범한 요정 여왕?"
1015303-4 = "쇼핑, 무사히 끝났네요!"
1015303-5 = "필요한 것도 전부 사고, 게임 센터에서 인형도 뽑았고요!"
1015303-6 = "선생님과 함께 있으면 운이 좋아요!"
1015303-7 = "[s] \"나올 때까지 한 거지만, 좋았어!\""
1015303-8 = "어쨌건 나왔으면 된 거예요! 헤헤-!"
1015303-9 = "아, 여기서 차선을 하나 빼야……."
1015303-10 = "깜빡이 켜고- 숄더 체크를 하고-"
1015303-13 = "으앗?!"
1015303-14 = "어이!! 정신 안 차려?!"
1015303-17 = "어이! 내가 차선 들어오는데 꺼져!"
1015303-18 = "사고 날 뻔했잖아!! 아야야, 긴장해서 그런지 병원 가야겠는데?"
1015303-20 = "[ns] \"우리가 먼저 들어오지 않았어?!\""
1015303-21 = "맞아요 선생님, 그리고 저기는 실선이라 차선 못 바꾸는데도요……."
1015303-22 = "하아……."
1015303-23 = "으음- 죄송해요오-! 잘 보고 다니겠습니다-!"
1015303-24 = "[s] \"히후미가 잘못한 게 아닌데도?!\""
1015303-25 = "아하하…… 잘못하면 보복 운전을 당할 수 있어서요. 선생님도 타고 계시고요."
1015303-26 = "무엇보다, 정체 구간이어서 괜히 시비가 걸리면 교통 흐름도 방해되니까……."
1015303-27 = "뭐야 이 똥차는! 느려터졌으면 끝차선이나 계속 달리라고!"
1015303-28 = "아하하…… 실례했습니다아……."
1015303-29 = "정속으로 달리지 마! 도로 흐름 방해하지 말라고!"
1015303-30 = "네에-"
1015303-31 = "[s] \"역시 히후미, 침착하게 운전하네……!\""
1015303-32 = "운전은 안전이 최우선이니까요."
1015303-33 = "운전하다 보면 다들 신경이 날카로워질 수 있으니 그 정도는……."
1015303-35 = "체에- 재미없네. 좀 시비 붙어야 재미있는데 말이지."
1015303-36 = "뭐, 크루즈 컨트롤도 없는 저런 고물딱지 도발해봤자-"
1015303-37 = "야, 야!! 앞에 봐!! 앞에!!"
1015303-38 = "어, 어어?!!"
1015303-39 = "으악!!"
1015303-44 = "야!! 멈춘 차를 받으면 어떡해!!"
1015303-45 = "운전을 저렇게 하면 당연히……."
1015303-46 = "야! 이거 우리 명의 차잖아! 발키리한테 압수당하면 어쩌려고!"
1015303-47 = "튀어!! 번호판 접어놨으니까 안 걸리겠지!"
1015303-53 = "[ns] \"도망쳤어!!\""
1015303-54 = "뺑소니예요!"
1015303-55 = "선생님, 제가 쫓아가도 될까요?"
1015303-56 = "[s] \"히후미가 괜찮다면 그렇게 하자!\""
1015303-57 = "네……!"
1015303-58 = "선생님, 벨트 잘 맸는지 다시 확인해주세요."
1015303-59 = "그리고, 잠시만요……."
1015303-62 = "[ns] \"괜찮아? 놓치는 거 아니야?\""
1015303-63 = "네, 괜찮아요. 아직 제 신호는 빨간불이기도 하고……."
1015303-67 = "……런치 컨트롤을 켜느라 잠시 걸렸어요."
1015303-68 = "출발합니다!"
1015303-73 = "꽉 잡으세요 선생님. 이 앞, 헤어핀 코너라서요."
1015303-80 = "[ns] \"엄청 빨라!!\""
1015303-81 = "빨리 끝낼게요!"
1015303-82 = "조금만 더 참아주세요!"
1015303-84 = "뭐야, 저 똥차!! 엄청 빠르잖아!!"
1015303-85 = "아까까지 쩔쩔매던 녀석이 뭔 운전을 저렇게 잘해?"
1015303-86 = "뭔 배기음이 저래?! 전차가 왜 팝콘 소리가 나는 건데?!"
1015303-87 = "공도인데도 뒤 따이고 있잖아! 다른 길로 새버리자!"
1015303-91 = "저기! 저쪽에서 숲길로 빠지자! 숲에서 따돌리면 될 거야!"
1015303-92 = "랠리 세팅이니까, 우리가 유리해!"
1015303-93 = "으아아아!!"
1015303-98 = "……숲 쪽으로 들어갔네요."
1015303-99 = "저 숲은 비포장도로에, 길도 복잡하고…… 도망치면 따돌릴 수 있을 거라고 생각하셨겠지만……"
1015303-100 = "……오히려 불리하실 텐데요."
1015303-101 = "선생님, 손잡이 꽉 잡아주세요. 최대한 안전하고 빠르게 정리해볼게요!"
1015303-105 = "[ns] \"지금 무슨 버튼을 누른 거야? 경고음이…….\""
1015303-106 = "아, 별건 아니고요."
1015303-107 = "레브매칭을 껐어요."
1015303-108 = "자, 숲으로 들어갈게요."
1015303-119 = "저, 저기…… 두 분 이제 그만 고개 들어주세요……."
1015303-120 = "죄송합니다, 누님……!"
1015303-121 = "이런 실력자를 공도에서 뵙게 될 줄은 몰랐습니다!!"
1015303-122 = "숲에서 내보내주세요!! 다음부터는 절대로 시비 안 걸고 다니겠습니다!!"
1015303-123 = "바로 경찰 불러주시면 경찰차 타고 가도록 하겠습니다, 으아앙-!"
1015303-124 = "저는 그냥 신고만 할 생각이었는데요-! 아우우……."
1015303-125 = "[s] \"아냐 히후미, 우웁…… 잘…… 했어……!\""
1015303-126 = "죄송해요!! 운전이 너무 거칠었죠, 히이잉-"
1015303-127 = "앞으로는 다시는 이 동네에서 핸들 안 잡겠습니다!!"
1015303-128 = "아니…… 그냥 걸어 다니겠습니다!!"
1015303-129 = "그게 아니에요-!! 얌전히만 운전해주세요-!!"
1015303-131 = "(이후, 난폭운전자들은 출동한 발키리가 오자마자 달려가서 안겼다.)"
1015303-132 = "(하지만 차에 타는 걸 무서워해서, 경찰차로 호송하는 데 시간이 조금 걸렸다.)"
1015303-135 = "(내가 히후미의 전차에 다시 타는 것도 많은 용기를 필요로 했다.)"
