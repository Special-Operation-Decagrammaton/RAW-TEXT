[translation]
1015303-1 = "[ruby=ティターニア]妖精女王[/ruby]"
1015303-4 = "お買い物、無事に終わってよかったです！"
1015303-5 = "必要なものも全部買えて、ゲームセンターでぬいぐるみも取れました！"
1015303-6 = "先生が一緒だと運がいいですね！"
1015303-7 = "[s] \"取れるまで大変だったけどね！\""
1015303-8 = "えへへっ、取れたからいいんです！"
1015303-9 = "……あ、車線変更しないと。"
1015303-10 = "ウィンカーをつけて、ミラーで確認してから――"
1015303-13 = "わあっ！？"
1015303-14 = "あっぶねぇなぁ！どこに目ぇつけてんだ！！"
1015303-17 = "うちらが先だったろ？さっさと退け！"
1015303-18 = "いてて……驚いて首をやっちまったな。#nこりゃあ入院確定だし、医療費請求すんぞ？"
1015303-20 = "[ns] \"割り込んできたのって向こうだよね？\""
1015303-21 = "はい。それに、あちらは車線変更禁止なのに……。"
1015303-22 = "はぁ……。"
1015303-23 = "あのー！ごめんなさい、気をつけますねー！"
1015303-24 = "[s] \"ヒフミのせいじゃないのに謝るの？\""
1015303-25 = "あはは……逆恨みされる可能性もあるので。#n先生も乗っていることですし。"
1015303-26 = "なにより、この辺りは渋滞しやすいですから。#n喧嘩を始めたり、事故を起こしたりしたら迷惑になっちゃいます。"
1015303-27 = "んだよ、おい！おせぇんだったら左車線行けよ！"
1015303-28 = "あはは……ごめんなさーい……。"
1015303-29 = "ちんたら走ってんじゃねぇ！邪魔なんだよ！"
1015303-30 = "はーい。"
1015303-31 = "[s] \"さすがヒフミ、冷静な運転だね……！\""
1015303-32 = "安全第一で走っているだけですよ。"
1015303-33 = "運転しているとカッとなってしまうこともあるのは分かりますし……。"
1015303-35 = "チッ、つまんねぇな。なんか反応薄くねぇか？"
1015303-36 = "まあ、こんなウスノロなんか煽っても――"
1015303-37 = "あっ、おい！前見ろ、前！"
1015303-38 = "え？"
1015303-39 = "ぎゃあっ！！"
1015303-44 = "ばっかお前！止まってる車にぶつけてどーすんだよ！！"
1015303-45 = "あんな運転してるから……。"
1015303-46 = "つーか、この車うちのだって忘れてんだろ？#nヴァルキューレにパクられたらどうすんだよ！"
1015303-47 = "ずらかるぞ！！ナンバー曲げてるからバレねぇはずだ！"
1015303-53 = "[ns] \"逃げた！！\""
1015303-54 = "当て逃げです！！"
1015303-55 = "先生、追いますか！？"
1015303-56 = "[s] \"ヒフミさえよければ！\""
1015303-57 = "はい……！"
1015303-58 = "先生は今のうちにシートベルトを締め直しておいてください。"
1015303-59 = "その間に私は準備を……。"
1015303-62 = "[ns] \"大丈夫？逃げられちゃわない？\""
1015303-63 = "先生、赤信号ですよ。#nそれに、これくらいなら大丈夫です。"
1015303-67 = "……ローンチコントロールをつけて、っと。"
1015303-68 = "――いきます！"
1015303-73 = "つかまってください！急カーブです。"
1015303-80 = "[ns] \"うおおお……横Gが……！！\""
1015303-81 = "手早く終わらせますので！"
1015303-82 = "もう少しの辛抱です！"
1015303-84 = "おいおいおいおい！戦車がかっとんでくるぞ！！"
1015303-85 = "ちんたら運転してたのは何だったんだ！？"
1015303-86 = "あれ排気音おかしくないか！？#nポップコーンみたいな音してるぞ！？"
1015303-87 = "このままじゃ追いつかれる！"
1015303-91 = "森だ！林道に突っ込め！"
1015303-92 = "ラリーセッティングだし、イケるはずだ！！"
1015303-93 = "うおおおおお！！"
1015303-98 = "……森に入りましたか。"
1015303-99 = "あっちは舗装されてないですし、地形が複雑……#n逃げ込めば振り切れると思ったのでしょうけど――"
1015303-100 = "これで、追いつけます。"
1015303-101 = "先生、しっかりつかまっていてください。#nできるだけ安全に、手早く済ませますね！"
1015303-105 = "[ns] \"いま何のボタン押したの？警告音が……。\""
1015303-106 = "問題ありません。"
1015303-107 = "レブマッチシステムを切っただけです。"
1015303-108 = "さあ、森に入ります。"
1015303-119 = "あ、あの……そろそろ頭を上げてください……。"
1015303-120 = "さーせんっした、姐さん！！"
1015303-121 = "まさか公道にこんな実力者がいるなんて！"
1015303-122 = "もう二度と煽り運転はしません！！"
1015303-123 = "大人しくヴァルキューレの厄介になりますので！"
1015303-124 = "え、あ、あれぇ……？#n私は通報するだけのつもりだったのに……。"
1015303-125 = "[s] \"ヒっ、フミ……うぅっ、よくやった、よ……おえっ……！\""
1015303-126 = "すみません！！運転が荒すぎましたよね……！！"
1015303-127 = "もう二度とこの街でハンドルを握りませんので！！"
1015303-128 = "いや……もう一生歩いて生活しますので！！"
1015303-129 = "えぇっ！？#nふ、普通に大人しく運転してください――！！"
1015303-131 = "（その後、煽り運転手たちはヴァルキューレが到着するなり抱きついていた）"
1015303-132 = "（しかし車を怖がってパトカーに乗るのを嫌がったので、護送に少し時間がかかった）"
1015303-135 = "（それはそれとして、ヒフミの戦車に乗る時は勇気が必要かもしれない……と思った）"
