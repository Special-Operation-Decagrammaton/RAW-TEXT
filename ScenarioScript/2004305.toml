[translation]
2004305-1 = "행복의 증거"
2004305-2 = "(이즈미가 말해준 장소로 걸음을 옮겼다…….)"
2004305-12 = "(옥상에 도착하자…….)"
2004305-21 = "(이즈미가 쪼르르 달려와 안겼다!)"
2004305-24 = "어서 와, 선생님!"
2004305-25 = "[s] \"나 왔어, 이즈미!\""
2004305-26 = "어때? 뭔가 신기한 공원이지?"
2004305-27 = "맞아! 건물 위에 지어진 옥상 공원이야! 지난달에 새로 개장했대!"
2004305-28 = "보통 공원이라고 하면, 나무나 풀 같은 게 많은 녹색 정원 같은 것을 떠올리겠지만……."
2004305-29 = "여기는 말이지! 보는 대로 조금 달라!"
2004305-30 = "어쩌다 보니까, 강변에 세로로 긴 건물이 세워지게 됐는데."
2004305-31 = "거기 4층 옥상에, 인공 공원을 만들자고 했대!"
2004305-32 = "봐! 강이 엄청 넓어! 저편까지 보여!"
2004305-36 = "……에칫!"
2004305-37 = "에헤헤. 그래도 강에서 부는 겨울바람은 조금 차갑네."
2004305-41 = "응? 응! 난 괜찮아, 선생님. 아무것도 아니야."
2004305-42 = "그래도 여기, 뭔가 여러 가지로 기분이 신선해지지 않아?"
2004305-43 = "[s] \"그러게. 이즈미가 좋아할 것 같은 공원이네.\""
2004305-44 = "응! 도시 풍경이란 건, 어떻게 보면 매일 보는 거지만……."
2004305-45 = "이렇게 장소가 조금 바뀌고, 거기에서 바라보는 경치가 변하는 것만으로……."
2004305-46 = "완전히 새로운 느낌을 받을 수 있으니까!"
2004305-47 = "아, 참! 이럴 때가 아니야. 선생님을 여기로 부른 이유!"
2004305-51 = "쨘! 여기, 선생님을 위해서 식사를 준비했어!"
2004305-52 = "[s] \"응? 오세치 같은 게…… 아니네?\""
2004305-53 = "맞아! 새해에는 역시 오세치 요리겠지만, 그것만이라면 조금 지루한 감도 있으니까……."
2004305-54 = "키보토스 여기저기에서 먹는, 다양한 새해 음식을 가져와 봤어!"
2004305-55 = "여기 살짝 단 맛이 나는 우유죽에, 바나나잎으로 감싼 찹쌀떡, 돼지 다리 오븐 구이……."
2004305-56 = "그리고 후식으로, 말려서 으깬 과일과 향신료, 견과류 같은 것으로 속을 채운 민스 파이까지!"
2004305-57 = "우유죽은 말이지. 우유를 약불로 데우다가, 갈아서 불린 쌀을 넣고, 마저 끓여서 만든 거래."
2004305-58 = "마지막에 설탕과 계피를 살짝 넣으면, 더욱 맛이 좋아진다더라구!"
2004305-59 = "그리고 바나나 잎으로 감싼 찹쌀떡은, 쌀에는 액운과 잡기를 없애는 힘이 있다고 해서……."
2004305-60 = "바나나 잎으로 감싼 사각형의 찹쌀떡 안에 돼지고기와 녹두를 같이 넣어 먹으면 좋다더라!"
2004305-61 = "그리고 돼지 다리 오븐 구이는, 사실 새해뿐만 아니라 언제 어느 때든 자주 먹는 음식이지만……."
2004305-62 = "새해에는 평소보다 조금 더, 특별히 정성을 들여서 만든다고 해!"
2004305-63 = "마지막으로 민스 파이는 말이야! 사실 크리스마스 때에 더 많이 먹는 후식이지만."
2004305-64 = "크리스마스부터 다음 해 1월 6일까지 하나씩 파이를 먹으면, 행운이 찾아온다는 모양이야!"
2004305-65 = "[s] \"이즈미는 안 먹어?\""
2004305-69 = "나? 난 괜찮아. 그리고 선생님이 먹어 줬으면 해."
2004305-75 = "왜냐하면…… 에헤헤. 이건 내가 선생님을 위해서 준비한 거니까!"
2004305-78 = "[wa:460]― [log=이즈미 새해]있잖아, 선생님.[/log]"
2004305-81 = "― [log=이즈미 새해]새해 음식에는,[/log]"
2004305-83 = "― [log=이즈미 새해]오세치 말고도 [wa:1300]여러 가지가 있대. [/log]"
2004305-86 = "― [log=이즈미 새해]그래서 [wa:930]많[wa:830]이 준비해 봤어![wa:80] [/log]"
2004305-89 = "[wa:600]― [log=이즈미 새해]나? [wa:1280]나는……[/log]"
2004305-92 = "― [log=이즈미 새해]선생님이 먹는 것만 봐도, [wa:1415]행복하다구?[wa:160] [/log]"
2004305-95 = "[wa:410]― [log=이즈미 새해]그리고, [wa:900]선생님이랑 이렇게[/log]"
2004305-98 = "― [log=이즈미 새해]단둘이 있다는 것만으로도 [wa:395]더 행복하고![wa:1015] [/log]"
2004305-101 = "[wa:525]― [log=이즈미 새해]앗! [wa:755]그러니까……[/log]"
2004305-104 = "― [log=이즈미 새해]조금, [wa:865]부끄러운 말 해버렸다……  [/log]"
2004305-107 = "[wa:600]― [log=이즈미 새해]그, [wa:360]그래도! [wa:620]행복하니까![/log]"
2004305-109 = "― [log=이즈미 새해]괜찮아! [wa:1010]문제없어![/log]"
2004305-112 = "어땠어, 선생님?"
2004305-113 = "[s1] \"응. 정말 맛있고 신선했어.\"\n[s2] \"이 풍경도, 이즈미가 준비해 준 음식도\""
2004305-116 = "잘 됐다! 에헤헤. 그 말이 듣고 싶었어."
2004305-117 = "그런데 웬일로 보통의 음식을 준비해 줬냐고?"
2004305-121 = "……."
2004305-122 = "있잖아, 선생님. 나에게 있어서…… 인생이란 건, 새로운 것을 찾아가는 과정인 것 같아."
2004305-123 = "그래서 더 새로운 시도를 하고, 뭔가 느껴 보지 못했던 맛을 찾고 싶은 것일지도 몰라."
2004305-124 = "하지만 그건, 나만의 특이한 입맛이라는 것도, 이제는 알고 있어."
2004305-125 = "그러니까 선생님에게는…… 조금 일반적일지도 모르지만, 그러면서도 역시 조금은 특별한 음식을 주고 싶었어."
2004305-126 = "아까도 말했던 거지만 말이지. 나는 선생님이 맛있게 먹고 있는 걸 바라보는 것만으로, 이미 행복하니까!"
2004305-130 = "(이즈미의 해맑은 미소에는…….)"
2004305-131 = "(바라보는 쪽까지 힘이 나는, 끝없는 활력이 담겨 있는 것 같았다……)"
2004305-132 = "[ns] \"이즈미.\""
2004305-136 = "응? 왜 그래, 선생님?"
2004305-140 = "[ns] \"이즈미랑 이렇게 있는 거, 뭔가 좋네.\""
2004305-144 = "어……?"
2004305-145 = "응! 나도!"
