[translation]
1005903-1 = "봉사 활동"
1005903-3 = "결국 와버렸구나……."
1005903-4 = "[s] \"무슨 일이야, 미카?\""
1005903-8 = "으응……. 딱히 별일 있는 게 아니었는데……."
1005903-9 = "그러니까…… 보시다시피 봉사활동 중이야."
1005903-10 = "[s] \"봉사활동?\""
1005903-11 = "응. 봉사활동 300시간을 다 채워야 해. 그게 나한테 내려진 처분이라서……."
1005903-12 = "그래서 휴일에 쉬지도 못하고 이렇게 운동장의 잡초 뽑기를 하는 중이야."
1005903-13 = "[s] \"혼자 하고 있는 거야?\""
1005903-14 = "그렇다니까!"
1005903-15 = "이렇게 넓은 운동장의 잡초를 오늘까지 다 뽑으라니……. 정말이지 너무하지 않아? 말이 봉사활동이지 강제 노역 같은 느낌이라구!"
1005903-16 = "날은 덥지, 사람은 아무도 없지, 일은 지루하고 힘들지…… 조금만 잘못해도 옷이 더러워지고……"
1005903-17 = "햇빛은 따갑지, 허리는 아프지, 손은 거칠어지지……. 선크림은커녕 핸드크림도 없는데……."
1005903-18 = "[s] \"힘들겠네.\""
1005903-19 = "으, 으응……? 히, 힘들다기보단……."
1005903-20 = "[s] \"내가 도와줄게.\""
1005903-24 = "아, 아냐! 그러지 않아도 돼, 선생님! 그냥 익숙하지 않은 일이라……."
1005903-25 = "[s] \"일단 복장부터가 잘못됐어. 체육복으로 갈아입고 와. 미카.\""
1005903-26 = "으, 으응? 체, 체육복……?"
1005903-27 = "[s] \"그리고 수건과 마실 물과 모종삽도 가져와.\""
1005903-28 = "그, 그치만…… 체육복은 선생님이 사 준 거라 뜯지 않으려고……."
1005903-29 = "[s] \"제대로 사용해 주지 않으면 곤란해.\""
1005903-33 = "……으응. 그건 정론이니까……"
1005903-34 = "알았어."
1005903-39 = "(잠시 뒤)"
1005903-45 = "갈아입고 왔어. 선생님이 말한 것도 다 가져왔고……."
1005903-46 = "체육복 차림은 귀엽지 않아서 보여주고 싶지 않았지만……."
1005903-47 = "으응…… 그러니까 저기……. 어떠려나……"
1005903-51 = "[ns] \"자, 그럼 시작해 볼까.\""
1005903-53 = "……응."
1005903-58 = "(오후가 되어서야 잡초 뽑기는 마무리될 수 있었다.)"
1005903-61 = "힘들어…… 허리 아파…… 여기저기 흙투성이……."
1005903-62 = "[s] \"그래도 이 정도면 어느 정도 마무리된 거 같네.\""
1005903-63 = "응. ……그러네."
1005903-64 = "나 혼자만의 봉사활동인데 선생님이 도와줘 버렸네? 이거 문제가 생길지도 몰라? 뭐 나는 상관없지만☆"
1005903-65 = "헤헤……."
1005903-66 = "저기, 선생님……."
1005903-67 = "[s] \"벌써 시간이 이렇게 되었네. 그럼 난 돌아가 볼게. 미카.\""
1005903-68 = "어? 으, 으응……."
1005903-73 = "(미카와 작별하고 샬레로 돌아왔다.)"
