[translation]
1002520-1 = "변하는 것, 변하지 않는 것."
1002520-2 = "바쁘실 텐데 번거롭게 해 드린 것 아닌가요?"
1002520-3 = "[s] \"아니야! 완전 한가해!\""
1002520-4 = "그렇다면 다행이지만요……"
1002520-5 = "왠지 선생님이라면 바쁘셔도 그렇게 말할 것 같다는 인식이 있거든요."
1002520-6 = "[s] \"어른이 거짓말 같은 걸 할 때는 이유가 있는 법이란다……\""
1002520-7 = "저한테 그렇게 타이르듯이 말씀하셔도 말이죠……"
1002520-8 = "그렇다고 해도 이렇게 한가한 날은 간만이네요."
1002520-9 = "날씨도 좋고, 바람도 기분 좋고."
1002520-10 = "아무 일 없이 그냥 시간을 보내도 된다는 건 멋진 일인 것 같아요."
1002520-11 = "[s] \"나도 슌이랑 시간을 보낼 수 있어서 좋은데.\""
1002520-12 = "저, 정말! 갑자기 그런 말씀을 하셔도 말이죠!"
1002520-13 = "선생님은 가끔 스스로가 무슨 말씀을 하시는지 자각하실 필요가 있다고 생각해요!"
1002520-14 = "[s] \"네에. 슌 교관님.\""
1002520-15 = "우으, 또 놀리고 계시고……"
1002520-16 = "[s] \"그러고 보니, 지금 슌이 하는 머리핀은……?\""
1002520-17 = "아, 이거요?"
1002520-18 = "사실 제가 가장 좋아하는 머리핀은 지금 하고 있는 머리핀이에요."
1002520-19 = "한 쌍으로 구성된 리본이 달려서 귀엽기도 하고요."
1002520-20 = "네, 맞아요. 양 갈래 머리, 좋아해요."
1002520-21 = "달리거나 점프하면 양옆에서 찰랑거리는 것도 마음에 들고요."
1002520-22 = "사실은…… 원래의 모습일 때 하는 머리핀도,"
1002520-23 = "지금의 머리핀과 비슷한 것으로 골라 따로 마련한 것이거든요."
1002520-24 = "[s1] \"그렇게 마음에 드는 머리핀이면……\"\n[s2] \"원래의 모습일 때도 그냥 사용하면 되지 않을까?\""
1002520-25 = "음…… 그렇게 하기에는 뭔가…… 크기도 맞지 않고요."
1002520-26 = "음…… 그렇게 하기에는 뭔가…… 크기도 맞지 않고요."
1002520-27 = "양 갈래에 리본은 조금 부끄럽기도 하고……"
1002520-28 = "어릴 때의 기억은, 어릴 때의 기억으로 남겨 두는 편이 좋지 않을까요?"
1002520-29 = "[s] \"하지만 나이와 상관없이 좋아하는 건 변치 않는 것이잖아?\""
1002520-30 = "네……?"
1002520-31 = "……"
1002520-32 = "그렇다면 선생님은, 변하지 않는 것이 있다고 믿으시나요?"
1002520-33 = "[s3] \"당연히 있겠지.\"\n[s4] \"변하는 것이 있다면, 변하지 않는 것도 있어야 공평하지 않을까.\""
1002520-34 = "아하하. 뭐예요, 그게."
1002520-35 = "아하하. 뭐예요, 그게."
1002520-36 = "그렇지만, 그렇네요…… 변하지 않는 것, 좋아하는 것……"
1002520-37 = "에헤헤. 뭔가 기분이 좋아졌어요."
1002520-38 = "조금 부끄럽기도 하고, 간질거리기도 하고……"
1002520-39 = "[s] \"괜찮아? 알레르기약 줄까?\""
1002520-40 = "……"
1002520-41 = "지금은 감점이에요, 선생님!"
1002520-42 = "[s] \"슌에게 혼나 버렸어……\""
1002520-43 = "정말, 시무룩해지셔도 소용없어요! 안 봐 드릴 거라구요!"
1002520-50 = "꺄악? 뭐 하시는 거예요?!"
1002520-51 = "네? 토라졌으니까 '높게높게'? 그, 그건 좋지만요!"
1002520-52 = "[s] \"높게높게~ 높게높게~\""
1002520-53 = "아핫, 간지러워요! 저, 적당히 내려 주세요! 기분은 좋지만……"
1002520-55 = "조금 마음이 풀렸냐구요?"
1002520-56 = "으음…… 알겠어요. 그렇다고 해 드릴게요."
1002520-57 = "사실 애초에 토라진 적도 없었지만요……"
1002520-58 = "그 대신……"
1002520-59 = "[s] \"그 대신?\""
1002520-60 = "나중에 말이에요."
1002520-65 = "제가 어른이 된 다음에, 양 갈래 머리를 하고 나타나도 놀리시면 안 돼요?"
1002520-66 = "아셨죠?"
