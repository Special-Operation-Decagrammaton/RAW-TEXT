[translation]
70009010-1 = "그러나 사감대는 달린다 1"
70009010-3 = "새들은 지저귀고, 꽃들은 피어나고."
70009010-7 = "정말 멋진 날이야."
70009010-10 = "야외 카페에서 에스프레소라도 한잔하면 더할 나위 없겠지."
70009010-15 = "나는 캄캄한 검문소에 날이 다 가도록 박혀 있겠지만."
70009010-22 = "……우수에 잠기는 시간조차 내게는 사치구나."
70009010-23 = "네, 엽니다~ 현 시간부로 검문소 개방하겠습니다."
70009010-30 = "외출증, 제출해 주세요."
70009010-31 = "여기 있어."
70009010-33 = "신고한 짐은…… 없네요. 잠깐 신체검사 있겠습니다."
70009010-34 = "이거 매번 해야 해? 어차피 우리 교복에는 숨길 데도 없잖아."
70009010-35 = "이쪽도 일이니까요."
70009010-43 = "자, 잠깐! 그런 데까지 수색하는 거야?"
70009010-44 = "최근 밀수가 극성이라서요. 신체검사에 더 엄중히 하라는 상부 지침입니다."
70009010-49 = "아니, 진짜, 간지러워! 그, 그만!"
70009010-50 = "……뭐, 딱히 숨긴 물건은 없어 보이네요. 통과해 주세요."
70009010-51 = "처음부터 그렇다 했잖아!"
70009010-55 = "사감대는 이래서 싫다니까……!"
70009010-56 = "성실히 일한 대가는 부조리한 비난인가……."
70009010-57 = "하아…… 푸념만 하고 있다고 일이 사라지는 것도 아니니까……."
70009010-58 = "다음, 들어오세요."
70009010-62 = "여기, 외출증이랑 가방."
70009010-63 = "네, 받았습니다. 내용물 확인하겠습니다."
70009010-70 = "음. 이건…… 명란맛 감자칩이군요."
70009010-72 = "응, 맞는데?"
70009010-76 = "압수입니다."
70009010-77 = "왜?!"
70009010-78 = "학원 식품 안전 기준에 미달하여 불량 식품으로 등록되었습니다."
70009010-82 = "무슨 기준이라고?"
70009010-83 = "포장지의 질소 비율이 너무 낮아서 운반 중 손상될 우려가 있다…… 라고 하네요."
70009010-84 = "분명, 식품이기도 하고, 안전……이기도 하지만! 먹는 거랑 아무 관계없지 않아?!"
70009010-85 = "제가 만든 규정도 아니니 저한테 따지셔도요."
70009010-89 = "또, 다음은, 인형이네요. 분명 이름이 있었는데."
70009010-90 = "흐음…… 아, 여기 찾았다. 아, 그래, 페로로. 모모프렌즈의 페로로 인형. 네, 이것도 압수 대상이네요."
70009010-91 = "슬슬 물어보기도 지치는데…… 왜?"
70009010-92 = "사유는, 최근 에피소드에서 공식의 캐릭터 해석이 맞지 않아 외교적 항의……? 이게 뭔 소리래……?"
70009010-93 = "……아무튼, 모모프렌즈 관련 굿즈는 한시적 반입 금지입니다."
70009010-94 = "아무튼이라고 말했지?!"
70009010-99 = "이건…… 음, 그리고 이건."
70009010-100 = "파인애플인가요?"
70009010-101 = "응, 파인애플인데? 왜?"
70009010-102 = "……아뇨, 가방에서 파인애플이 나와서 조금 당황했을 뿐입니다. 이것도 압수합니다."
70009010-103 = "왜?! 그냥 과일인데?!"
70009010-104 = "파인애플 피자의 발생 가능성을 원천 차단하기 위해서 파인애플 반입을 전면 금지 중입니다."
70009010-105 = "그런 걸 누가 정했는데……?"
70009010-106 = "저요. 안 좋아하거든요. 파인애플 피자."
70009010-108 = "완전 사심이잖아!"
70009010-109 = "심각한 범죄 가능성이 우려되는 물품에 한해, 검문관 재량으로 압수 가능하다는 조항이 있어 규정 범위 내입니다."
70009010-110 = "파인애플 피자는 범죄가 아니래도……."
70009010-114 = "마지막으로……? 이건 진짜 뭐죠?"
70009010-115 = "아, 그건 게헨나 학생회장의 자서전…… 이랬나? 제본은 엄청 화려한데, 떨이로도 안 팔려서 구석에 쌓여 있는 게 웃기더라고. 그래서 샀어."
70009010-116 = "따로 등록된 적 없는 도서네요. 일단 압수하겠습니다."
70009010-117 = "뭐?! 그게 얼마나 쓸데없이 무거웠는데! 가져오느라 고생했단 말이야!"
70009010-118 = "정식 조사 후에 문제없는 도서임이 입증되면 고지가 올라갈 겁니다. 그 후 서류 절차를 거쳐 찾아가시면 됩니다."
70009010-119 = "일단, 문제 품목은 이게 전부네요. 이제 통과하셔도 좋습니다."
70009010-124 = "아니, 다 털어갔잖아! 전부 다른 학교에서는 흔한 건데, 네가 무슨 기준으로 압수하는 건데?!"
70009010-125 = "기준은 규정집에 모두 나와 있습니다."
70009010-127 = "이 학원에 그걸 읽는 사람이 너희 사감대 말고 어딨다고!"
70009010-132 = "하아, 그게 문제라고요……."
70009010-133 = "압류품은 창고에 넣어두고…… 자, 다음. 들어오세요."
70009010-137 = "영차~ 아이고, 무거워라~"
70009010-138 = "짐이 많군요. 열어서 내용물 검사하겠습니다."
70009010-139 = "물론이죠! 신고한 내역 그대로일 겁니다!"
70009010-145 = "어디 보자…… 레드 플라워 붓 6본조 50세트, 크루거SB 4-8호 50묶음, 3호 캔버스 100장, 4호 100장, 도막 박리제 1통에……"
70009010-146 = "응? 캔버스 아래에 공간이……."
70009010-147 = "아차! 그거는……!"
70009010-154 = "……이건, 뭐죠?"
70009010-155 = "보시다시피…… 밀레니엄제 네이팜탄이요."
70009010-156 = "SMG에, 고폭 수류탄에……. 전부 신고된 적 없는 무기뿐이네요."
70009010-157 = "아~ 그게~ 개인 소지품이거든요. 무거워서 한 번에 옮긴다는 게, 완전히 깜빡했네요."
70009010-161 = "근데 이런 것까지 신고해야 하나요?"
70009010-165 = "……분명, 이런 물품 하나하나 신고하라는 건 말이 안 되네요. 그래서야 입는 옷까지 하나하나 검사하는 격이고."
70009010-166 = "이상 없습니다. 통과해 주세요."
70009010-167 = "감사합니다~ 수고하세요~"
70009010-172 = "다들 저분처럼 모범적이면 이 일도 좀 편해질 텐데…… 하아. 다음, 들어오세요."
70009010-176 = "자! 여기 외출증이랑, 반입품! 빨리 보내줘! 지금 영감이 떠오른 참이야!"
70009010-177 = "네, 네. 잠시만요. ……?"
70009010-182 = "그나저나, 이 반입품은…… 대체 뭡니까?"
70009010-183 = "트리니티에서 가져온 조각상이야! 갈아서 물감으로 만들면 굉장히 곱고 부드러운 흰색이 나올 거야!"
70009010-184 = "……혹시나 해서 묻는데, 소유주의 허락은 받았습니까?"
70009010-185 = "응? 무슨 말이야? 누가 봐도 유물이잖아."
70009010-186 = "그렇죠. 유물이죠."
70009010-187 = "그러면 만든 사람도 진작에 없어졌겠지."
70009010-188 = "……일단, 이 물건은 압수하겠습니다. 이 외에도 물어볼 내용이 여럿 있으니까, 잠시 여기서 대기를……."
70009010-189 = "뭐, 대기?! 영감은 기다려주지 않는다고!!"
70009010-193 = "……헉!! 알았다!! 내 아이디어를 빼앗으려는 거지?!"
70009010-194 = "그럴 리 없잖아요. 오히려 제재 대상입니다."
70009010-195 = "제재……? 예술을 통제하려는 수작이구나!!"
70009010-196 = "아니, 그러니까…… 이건 범죄……."
70009010-198 = "나는 권력과 타협하지 않는다!! 예술은 세상을 향한 끊임없는 투쟁에서 비롯한다!!"
70009010-203 = "앗! 경비! 불법 침입자입니다!"
70009010-207 = "도주자?! 어느 쪽이야?!"
70009010-208 = "당장 추적한다!"
70009010-210 = "뭐야? 소란스러운데?"
70009010-211 = "쟤는 가지고 들어가도 된다고? 그러면 내 것도 돌려줘!"
70009010-212 = "이 틈에 나도 슬쩍 들어가야지……!"
70009010-214 = "뭐, 뭐야?! 이 녀석들, 물러나지 못해?!"
70009010-215 = "여기는 검문소! 비상사태입니다! 갑자기 학생들이 단체로 이상행동을 보이기 시작했습니다! 증원 요청합니다!"
70009010-217 = "지금이 기회다! 학생의 자유를 탄압하는 사감대를 몰아내라!"
70009010-218 = "비바 와일드헌트! 우리는 노예가 되지 않는다!"
70009010-229 = "아……."
70009010-236 = "비둘기다."
