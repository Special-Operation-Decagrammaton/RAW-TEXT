[translation]
83304200300-6 = "아, 부장님. 수고하셨습니다."
83304200300-7 = "응, 아코야말로 수고했어. 일단 파티에 앞서 대테러 훈련 내용을 확인해 두려고 왔는데……."
83304200300-8 = "<싸움 절대 반대>…… <모든 게헨나의 평화를 위해서>……"
83304200300-13 = "<다 함께 싸움을 그만둡시다.> by 하누마 마코토……?"
83304200300-14 = "이건…… 또 뭐야?"
83304200300-15 = "……언제나 그랬던 것처럼 또 수상한 일을 꾸미는 모양이에요."
83304200300-16 = "이곳만이 아니라, 게헨나 학원 곳곳에 비슷한 전단지가 뿌려진 모양이더라구요. 정말 뭘 꾸미는 건지 원."
83304200300-17 = "그쪽이 뭘 꾸미든 우리가 할 일은 변하지 않지만 말이야."
83304200300-18 = "어쨌거나 아코, 훈련 준비를 시작하자."
83304200300-19 = "다른 부원들의 위치는 어디 있는지 알고 있어?"
83304200300-20 = "아, 그거라면 일단 이오리가 교실에서 대기 중일 거예요. 가실까요?"
83304200300-21 = "그래."
