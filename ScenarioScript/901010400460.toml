[translation]
901010400460-6 = "งั้นมาสรุปสิ่งที่เราอนุมานได้จนถึงตอนนี้กันเถอะ"
901010400460-7 = "<ผลกระทบที่ตำนานเมืองมีต่อราคาปูและการทำประมง มีน้อยกว่าที่คาดไว้>"
901010400460-8 = "<เนื้อหาของเรื่องเล่าลึกลับนี้มุ่งเน้นไปที่การกระตุ้นความหวาดกลัวทางจิตใจ มากกว่าความถูกต้อง#nของข้อเท็จจริง>"
901010400460-9 = "<เรื่องเล่าลึกลับนี้แพร่กระจายผ่านการบอกต่อของชาวเมืองทั่วไป ไม่ใช่ผู้ที่ประกอบอาชีพประมงใน#nท่าเรือคาเนะซากิ>"
901010400460-11 = "ดูเหมือนเราจะได้ข้อมูลมาพอสมควรแล้ว... แต่แค่นี้คงยังตัดสินไม่ได้ว่าคดีคนหายครั้งนี้เกี่ยวข้องกับ 'ตำนาน' หรือเปล่า"
901010400460-12 = "แล้วเรื่องมิยากุจิ... เรื่องชาวประมงที่หายตัวไป ยังไม่ได้ข้อมูลอีกเหรอ?"
901010400460-14 = "อื้อ ถ้าคนแปลกหน้าเที่ยวเดินถามข้อมูลของผู้สูญหายไปทั่ว คนอื่นอาจมองว่าน่าสงสัยน่ะ"
901010400460-15 = "แต่ตอนนี้ผู้คนที่นั่นเริ่มคุ้นหน้าฉันแล้ว ครั้งหน้าถ้าไปสืบสวน ฉันจะลองถามเรื่องชาวประมงคนนั้น#nอย่างจริงจังดูนะ"
901010400460-17 = "พรุ่งนี้เป็นวันหยุดประจำของท่าเรือ เพราะงั้นเราค่อยกลับไปสืบสวนต่อวันมะรืนแล้วกัน"
901010400460-18 = "หวังว่าระหว่างนี้ข่าวลือจะไม่แพร่กระจายหนักกว่าเดิม จนทำให้เกิดสิ่งลึกลับหรือสัตว์ประหลาดตัวใหม่#nขึ้นมานะ"
901010400460-19 = "จะว่าไปแล้ว ทะเลก็ดูจะเป็นฉากที่ใช้บ่อยในเรื่องเล่าลึกลับเกี่ยวกับสัตว์ประหลาดนะ"
901010400460-20 = "ก็อย่างก่อนหน้านี้ไง ที่บอกว่ามีสัตว์ประหลาดหน้าตาเหมือนมาสคอตรูปนกออกมา"
901010400460-21 = "อ๋อ หมายถึงนกหน้าตาอัปลักษณ์ที่ชื่อเปปเปอโรนีหรืออะไรนั่นน่ะเหรอ?"
901010400460-22 = "ที่บอกว่าแรงปรารถนาของแฟนๆ ที่อยากได้ตุ๊กตาผ้าลิมิเต็ดที่หายไป ก่อตัวเป็นรูปร่างขึ้นมา#nจนกลายเป็นสัตว์ประหลาดไปเลย..."
901010400460-23 = "ถึงจะเป็นเรื่องเล่าลึกลับสุดเหลวไหลก็เถอะ แต่มันก็น่าเหลือเชื่อจนฉันอดหัวเราะไม่ได้เลย"
901010400460-24 = "นั่นสิ ถ้าเป็นสัตว์ประหลาดหน้าตาแบบนั้น ฉันว่ามันไม่เห็นจะน่ากลัวเลยสักนิด"
901010400460-25 = ""
901010400460-27 = ""
901010400460-28 = ""
901010400460-29 = "หืม...? ทำไมจู่ๆ คุณครูถึงทำหน้าแบบนั้นล่ะ?"
901010400460-30 = "[s1] \"คือว่า มันมีอยู่จริงน่ะสิ...\" \n[s2] \"เพโรโร่ซิลล่าเคยปรากฏตัวออกมาจริงๆ\""
901010400460-31 = ""
901010400460-32 = ""
901010400460-34 = ""
901010400460-35 = "ว่าไงนะ?!"
901010400460-38 = "สรุปก็คือ ตามที่คุณครูเล่ามา..."
901010400460-39 = "ตุ๊กตาผ้าลิมิเต็ดที่ชื่อ 'เพโรโร่ซิลล่า' ตัวนั้นฟื้นขึ้นมาเพราะแรงปรารถนาของแฟนๆ..."
901010400460-40 = "ก็เลยมุ่งหน้าไปยัง D.U. ก่อนจะถูกปราบด้วยปฏิบัติการร่วมระหว่างชาเล่ต์กับวัลคิรี่งั้นเหรอ?"
901010400460-41 = "คุณครูล้อเล่นอยู่ใช่มั้ย...?"
901010400460-42 = "[s] \"มะ... ไม่ได้ล้อเล่นนะ!\""
901010400460-43 = ""
901010400460-46 = "[ns3] \"ชาเล่ต์คลี่คลายเรื่องนี้ได้ก่อนที่ชาวเมืองจะสังเกตเห็นน่ะ...\"\n[ns4] \"นอกจากนักเรียนบางคนในวัลคิรี่ ก็แทบไม่มีใครรู้เรื่องนี้เลย\""
901010400460-49 = "จะว่าไปแล้ว ในบันทึกของสำนักความมั่นคงที่เราได้มาก่อนหน้านี้ ก็มีระบุไว้ว่าวันนั้นมีการระดมกำลัง#nเจ้าหน้าที่รักษาความปลอดภัยชุดใหญ่เหมือนกัน"
901010400460-50 = "ถึงรายละเอียดของเหตุที่แจ้งกับขอบเขตความเสียหายจะถูกลบออกจากบันทึก จนตรวจสอบต่อไม่ได้ก็เถอะ..."
901010400460-51 = "ทั้งที่เกิดเหตุการณ์ใหญ่ขนาดนั้น แต่ทำไม SRT อย่างพวกเราถึงไม่รู้เรื่องเลยล่ะ?"
901010400460-52 = "ก็ตอนนั้นพวกเราถูกตามจับจากคดีบุกจู่โจมองค์การนักเรียนอยู่นี่นา"
901010400460-53 = "อ่า"
901010400460-55 = "แต่ถ้าสัตว์ประหลาดตัวใหญ่ขนาดนั้นโผล่ออกมาแถวชายฝั่ง D.U. จริง นอกจากพวกเราแล้ว#nก็น่าจะมีใครเห็นบ้างสิ..."
901010400460-56 = "แปลกเหมือนกันนะคะ ตลอดมานี้ไม่มีทั้งสกู๊ปข่าวหรือคำบอกเล่าของผู้พบเห็นถูกโพสต์ลงบน#nโซเชียลมีเดียเลยค่ะ"
901010400460-57 = "[s5] \"องค์การนักเรียนควบคุมข้อมูลไว้เพื่อไม่ให้เกิดความโกลาหลน่ะ\"\n[s6] \"นักเรียนส่วนใหญ่ก็เลยคิดว่ามันเป็นแค่ตำนานเมืองน่ะ\""
901010400460-61 = "ก็จริงนะ เจ้านกที่ชื่อเปโรช่า... หรืออะไรนั่น ถึงจะดูน่าเกลียด แต่ก็ไม่ได้น่ากลัวเท่าไร"
901010400460-62 = "ไม่แปลกหรอกถ้าทุกคนจะมองว่าเป็นข่าวลือที่ไม่เป็นความจริง"
901010400460-63 = "สิ่งที่ถือกำเนิดจากตำนานเมือง กลับกลายมาเป็นตำนานเมืองเสียเองงั้นเหรอ มันฟังดูย้อนแย้งยังไงชอบกลแฮะ..."
901010400460-64 = "ว่าแต่ตัวละครที่ดูตลกแบบนี้ แค่มันกลายเป็นกระแส ก็กลายร่างเป็นสิ่งลึกลับทรงพลัง อย่างสัตว์ประหลาดยักษ์ได้เลยเหรอ?"
901010400460-65 = "ถ้าแค่ดังแล้วกลายเป็นสัตว์ประหลาดได้ก็แย่น่ะสิ แบบนี้สักวันเราอาจต้องไปสู้กับเจ้าซูโปยักษ์ก็ได้นะ"
901010400460-66 = ""
901010400460-68 = ""
901010400460-70 = "..."
901010400460-71 = "FOX 2 พรุ่งนี้ช่วงบ่าย ฉันขอแยกตัวไปไหนสักพักได้มั้ย?"
901010400460-72 = "ได้สิ พรุ่งนี้ไม่ได้มีตารางอะไรเป็นพิเศษอยู่แล้ว... ว่าแต่จู่ๆ จะไปไหนเหรอ?"
901010400460-73 = "มีเรื่องหนึ่งที่ฉันอยากไปสืบด้วยตัวเองน่ะ"
901010400460-74 = ""
