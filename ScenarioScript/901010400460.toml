[translation]
901010400460-6 = "那麼，來整理一下到目前為止分析的結果吧。"
901010400460-7 = "「怪談對螃蟹價格或漁業造成的影響，比想像中還要輕微。」"
901010400460-8 = "「怪談的內容比起客觀事實，更著重於引發心理上的恐懼。」"
901010400460-9 = "「怪談並非由鐘崎港漁業從事者散播，而是由一般市民口耳相傳才散播出去的。」"
901010400460-11 = "雖然獲得了相當多的情報……#n但是光憑這些，依舊難以判斷這次的失蹤事件是否與怪談有關呢。"
901010400460-12 = "宮口──關於那個失蹤的漁夫，還沒掌握到相關情報嗎？"
901010400460-14 = "嗯。我擔心外人到處打聽失蹤者的情報，會讓人覺得很可疑。"
901010400460-15 = "不過現在彼此多少有些認識了，下次調查時我會深入詢問看看那位漁夫的事。"
901010400460-17 = "總之明天是港口的例行公休日，後天再重新展開調查吧。"
901010400460-18 = "只希望在這段期間傳聞不會迅速蔓延，結果出現新的怪異就好了。"
901010400460-19 = "這麼說來，有怪獸登場的怪談經常將大海設定為舞台呢。"
901010400460-20 = "你們也聽過吧？之前有個長著吉祥物模樣的怪獸出現的傳聞。"
901010400460-21 = "啊，是那個叫做佩帕羅尼……還是什麼的那隻醜鳥吧？"
901010400460-22 = "有人說那是粉絲想要絕版限定布偶的執念化為實體，以怪獸的形式出現……"
901010400460-23 = "就算是怪談，那也已經牽強到讓人笑出來的程度了呢。"
901010400460-24 = "就是說啊。如果是那種醜怪獸，感覺一點都不可怕呢。"
901010400460-25 = ""
901010400460-27 = ""
901010400460-28 = ""
901010400460-29 = "……嗯？老師，你怎麼突然露出那種表情？"
901010400460-30 = "[s1] 「那個，該怎麼說呢……」\n[s2] 「……實際上，『佩洛洛吉拉』曾經真的出現過。」"
901010400460-31 = ""
901010400460-32 = ""
901010400460-34 = ""
901010400460-35 = "你說什麼！？"
901010400460-38 = "也就是說，根據老師的說法……"
901010400460-39 = "那個名叫「佩洛洛吉拉」的限定版布偶，因為粉絲們的執念而甦醒……"
901010400460-40 = "並且朝著D.U.逼近，最後被夏萊和女武神的協同作戰擊退了，是這樣嗎？"
901010400460-41 = "……你現在是在開玩笑吧？"
901010400460-42 = "[s] 「我，我沒有在開玩笑！」"
901010400460-43 = ""
901010400460-46 = "[ns3] 「這是在被市民注意到之前就由夏萊解決的事件……」\n[ns4] 「除了女武神的一部分學生之外，應該幾乎沒有人知道。」"
901010400460-49 = "這麼說來，之前獲取的女武神警備局的記錄裡……#n好像也寫著那天出動了大規模的警備兵力呢。"
901010400460-50 = "雖然通報內容和損害規模的記錄都被抹消了，無法進一步確認……"
901010400460-51 = "但是發生了那麼驚人的事件，為什麼我們SRT卻毫不知情呢？"
901010400460-52 = "我們那時候不是因為聯邦學生會的襲擊事件正遭到通緝嗎？"
901010400460-53 = "啊……"
901010400460-55 = "不過那麼大的怪獸出現在D.U.近海，除了我們之外應該也會有目擊者才對……"
901010400460-56 = "這段期間，沒有相關報導或是目擊情報被上傳到SNS也很神奇呢。"
901010400460-57 = "[s5] 「為了避免引發混亂，聯邦學生會進行了資訊管制。」\n[s6] 「所以許多學生似乎都把它當成都市傳說。」"
901010400460-61 = "確實，這隻叫佩羅夏……還是什麼的鳥，雖然長得噁心但是給人的印象並不可怕呢。"
901010400460-62 = "大家會把它當成都市傳說也是情有可原的。"
901010400460-63 = "一個從都市傳說誕生的存在竟然變成了都市傳說本身，總覺得有點諷刺。"
901010400460-64 = "不過只要成為話題……#n連這種看起來這麼滑稽的角色，也能夠以巨大怪獸那樣強大的怪異化為實體嗎？"
901010400460-65 = "如果只是因為有名就會變成怪獸的話，那可就傷腦筋了。#n這樣下去，說不定以後還得跟巨大的咻啵君戰鬥呢。"
901010400460-66 = ""
901010400460-68 = ""
901010400460-70 = "……"
901010400460-71 = "FOX2，明天下午我暫時離開一下沒問題吧？"
901010400460-72 = "嗯。沒有特別的行程所以應該沒關係……怎麼突然這麼問？"
901010400460-73 = "有件事我想私下調查一下。"
