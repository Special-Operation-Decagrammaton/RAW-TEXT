[translation]
901010400460-6 = "Well then, let's summarize what we've deduced so far."
901010400460-7 = "\"The urban legend has a more negligible impact on crab prices and fishing operations than we expected.\""
901010400460-8 = "\"The urban legend focuses on evoking psychological horror over factual accuracy.\""
901010400460-9 = "\"The urban legend was spread through everyday people, not those involved with Kanesaki Port's fishing industry.\""
901010400460-11 = "It's good info, but it's not enough. I still don't see how the missing people are connected to Lore, or if this is even a Lore case."
901010400460-12 = "Let's go back to Miyaguchi. Did we dig up any more info on him?"
901010400460-14 = "No. That felt like a bridge too far. People would be suspicious of a stranger asking about a missing person."
901010400460-15 = "However, I'm not exactly a stranger anymore. I'll ask the fishermen on my next run."
901010400460-17 = "The port is closed tomorrow. Let's continue the investigation the day after."
901010400460-18 = "I'm just hoping that the rumor doesn't spread...or ANOTHER anomaly pops up before then."
901010400460-19 = "It seems like the sea breeds a lot of these urban legend monsters."
901010400460-20 = "You know, like the story of that chicken monster thingy from a while back."
901010400460-21 = "Oh, that ugly bird. What's its name? \"Pepperoni\"?"
901010400460-22 = "They said that the fans' mad desire for a lost limited-edition plushie conjured a monster..."
901010400460-23 = "Wow. That's a good one..."
901010400460-24 = "I know, right? Like I'd be afraid of some goofy monster like that."
