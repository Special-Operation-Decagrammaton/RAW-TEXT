901010400460-35 = "What?!"
901010400460-38 = "Let's get this straight, Sensei."
901010400460-39 = "This limited-edition plush named \"Perorodzilla\" came to life because of fans' obsessive desires..."
901010400460-40 = "...Then it approached the D.U., and was defeated in a joint operation with Schale and Valkyrie?"
901010400460-41 = "...Are you actually joking?"
901010400460-42 = "[s] \"I-I'm not!\""
901010400460-43 = ""
901010400460-46 = "[ns3] \"Schale resolved it before anyone noticed...\"\n[ns4] \"So only a few Valkyrie students know.\""
901010400460-49 = "You know, the Valkyrie Security Bureau records we procured mentioned a large deployment."
901010400460-50 = "We couldn't check the details and damage because so much was redacted..."
901010400460-51 = "Why wasn't SRT notified?"
901010400460-52 = "Because we attacked the General Student Council, remember?"
901010400460-53 = "Ah. Right."
901010400460-55 = "If it was so large, then someone must have seen it. D.U. is densely populated..."
901010400460-56 = "It's interesting how I've never seen any news articles or posts about it."
901010400460-57 = "[s5] \"The General Student Council suppressed the info.\"\n[s6] \"That's why most students think it's an urban legend.\""
901010400460-61 = "This perotsha...or whatever this bird is called, might be a bit disturbing, but it's not really scary."
901010400460-62 = "That's probably why everyone thinks it's fake."
901010400460-63 = "To think that an entity created from an urban legend became an urban legend itself... How ironic."
901010400460-64 = "By the way, can any ridiculous-looking character manifest into a giant monster if it gets popular enough?"
901010400460-65 = "What if everything trendy became a monster? Are we going to have to fight a giant Shuppo later?"
