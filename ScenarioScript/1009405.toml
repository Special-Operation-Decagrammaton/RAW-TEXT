[translation]
1009405-1 = "메이드의 휴식!"
1009405-2 = "[ns] \"어? 게임개발부 부실이 아니네?\""
1009405-3 = "그게, 처음에는 우리 부실에서 쉬려고 했는데……."
1009405-4 = "선생님이 찾아온다는 소식에 말이지. 동아리 여기저기에서 협찬을 엄청나게 해 줬지 뭐야."
1009405-5 = "다이어트부, 생활건강부, 트레이닝부…… 심지어 엔지니어부까지."
1009405-6 = "이름만 들어도 뭔가 불안해진다고? 에이, 걱정이 과해, 선생님. 속고만 살았어?"
1009405-7 = "물론 트레이닝부와 엔지니어부는…… 뭐…… 선생님도 익히 알고 있는 동아리겠지만! 다른 곳은 또 다를 거라고?"
1009405-8 = "가령 다이어트부의 경우는, 식이나 운동 없이, 과학적 방법론으로 체형을 만들자는 건전한 동아리이고."
1009405-9 = "생활건강부는 보다 많은 합법적 인체실험을 통해 건강을 개선해 나가자는 동아리이니까!"
1009405-10 = "[s] \"설명을 들으니 한층 더 불안해졌는데?!\""
1009405-11 = "괜찮아, 괜찮아. 다 괜찮을 거야! 선생님에게 나쁜 짓을 하려는 학생은 밀레니엄에는 없을 테니까!"
1009405-12 = "어? 악의가 없을 거란 건 잘 알고 있다고? 그러면 더더욱 아무래도 괜찮은 거 아냐?"
1009405-13 = "믿고 맡기자고. 몸도 마음도 푹 쉬고, 내일을 준비하는 거야!"
1009405-14 = "사용 후기도 확실히 전달해 주겠다고 약속했으니, 우리는 해 볼 수밖에 없다고!"
1009405-15 = "그래서…… 처음으로 시험해 볼 품목은 바로……."
1009405-16 = "이 초고주파 마사지기야!"
1009405-17 = "설명하도록 하지! 초고주파 마사지기란! 근육 이완 효과를 극대화하기 위해서."
1009405-18 = "일반 주파수의 대역폭을 한참이나 뛰어넘은 형태로 개량, 개조한 마사지기인 것이다!"
1009405-19 = "……라고 매뉴얼에는 적혀 있네."
1009405-20 = "사용법은 간단해. 마사지를 하고 싶은 곳에 기구를 부착하고."
1009405-21 = "그대로 스위치를 켜면 된다고 하네?"
1009405-23 = "(불안함을 애써 멀리하며, 마사지기를 작동시켰다…….)"
1009405-29 = "[ns] \"으어어어어어?!\""
1009405-30 = "지, 진동이 너무 엄청나! 머릿속까지 떨리는 느낌이야!"
1009405-31 = "으아아…… 현기증이……. 현기증이……!"
1009405-32 = "그런데 진동이 지나치게 강해서, 오히려 손가락 하나 까딱할 힘이 없어……!"
1009405-33 = "으아앙~ 도와줘, 선생님! 전원을 꺼야 하는데 몸이 움직이지 않아~!"
1009405-35 = "(간신히, 어떻게든 마사지기를 멈추었다…….)"
1009405-40 = "헉, 헉……. 큰일날 뻔했네……."
1009405-41 = "그, 그래도 이번엔 다를 거야. 다음은 특수 EMS 슈트!"
1009405-42 = "[s] \"그건 또 뭔데?\""
1009405-43 = "이것은…… 운동은 하기 싫지만, 운동 효과는 보고 싶은 사람들을 위한 슈트래!"
1009405-44 = "[s1] \"아니, 운동을 하지 않고도 운동을 할 수 있다니!\"\n[s2] \"획기적이다. 당장 하자.\""
1009405-47 = "훗. 훗. 훗…… 그렇게 나올 줄 알고 있었소."
1009405-48 = "애초에 나도 운동은 하기 싫고 말이지……."
1009405-49 = "전기근육자극요법이란 것을 사용하면, 적당한 빈도와 강도로 근육을 자극해서."
1009405-50 = "근섬유를 강화하고 근지구력을 올릴 수 있대!"
1009405-52 = "(모모이와 함께 매뉴얼을 읽어 가며, EMS 슈트라는 것을 입어 보았다.)"
1009405-59 = "우와아아아아앗?!?!"
1009405-60 = "자, 자극이 과해! 충격의 빈도가 너무 빨라!"
1009405-61 = "근육이 아파! 어딘가 감전되고 있는 것 같은 느낌마저 들어!"
1009405-62 = "선생님! 살려줘, 선생님!"
1009405-65 = "(간신히, 어떻게든 EMS 슈트의 전원을 끊었다.)"
1009405-68 = "[ns] \"이거, 정말로 괜찮은 거야……?\""
1009405-69 = "이번에는 진짜 다를 거야! 뭐니 뭐니 해도 트레이닝부와 엔지니어부가 함께 힘을 합쳐 만든 것이니까!"
1009405-70 = "어? 그 말을 들으니 두 배로 불안해졌다고? 에이, 속고만 살았어? 때로는 사람을 믿는 자세가 필요한 법이라구!"
1009405-71 = "무엇보다 이번에는 단순한 폼롤러일 뿐이니까 말이지!"
1009405-72 = "최근의 연구 결과에 따르면, 평소 취하는 부자연스러운 자세가 만성 피로를 유발하는 원인 중 하나일 수 있다고 해."
1009405-73 = "그래서 척추기립근을 강화시키기 위해, 인공지능 폼롤러를 개발했다고 하더라고."
1009405-74 = "사용자의 상태를 폼롤러가 스스로 체크하여, 최적의 폼롤링을 제공한다는 발상인 거지."
1009405-75 = "그러면 어디 한번 해 볼까? 폼롤러를 엉덩이 아래에 두고 몸을 앞뒤로……."
1009405-80 = "으아아앙?!"
1009405-81 = "롤링이 너무 빨라! 스스로 움직이고 있어! 선생님–!"
1009405-82 = "[s3] \"나도 도와주고 싶은데–!\"\n[s4] \"으아아–! 말려들어 간다–!\""
1009405-86 = "(그렇게 온갖 휴식 보조 기구(?)를 체험하고.)"
1009405-87 = "(우리는, 사이좋게 앓아눕고 말았다…….)"
