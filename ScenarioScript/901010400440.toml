[translation]
901010400440-6 = "Now, regarding how the locals reacted to the \"crabs in a drum barrel\" rumor..."
901010400440-7 = "Almost no one at the port had never even seen a \"barrel of crabs.\" They were confused by the premise of the story."
901010400440-8 = "Most species of live crab would die when sealed in an airtight container like a drum barrel, so they're often shipped in wooden crates filled with sawdust."
901010400440-9 = "Additionally, drum barrels are far more expensive than wooden crates. They're rarely used to carry living things."
901010400440-10 = "Unless someone's intentionally trying to waste money, there's no reason to ship crab in a drum barrel."
901010400440-12 = "But the crabs in the rumors were all packed inside the drum barrel, right?"
901010400440-13 = "...Like bugs crawling over each other, cramped and crowded in a trap."
901010400440-14 = ""
901010400440-16 = ""
901010400440-17 = "Stop saying things like that! It's creeping me out!"
901010400440-18 = ""
901010400440-20 = ""
901010400440-22 = "...No. Maybe that's the goal."
901010400440-23 = "If a specific image is repeatedly emphasized, then there must be a reason. The image is meant to send a message."
901010400440-24 = "The reason the urban legend fixates on crabs in a drum barrel is likely because..."
901010400440-25 = ""
901010400440-27 = ""
901010400440-28 = ""
901010400440-31 = ""
901010400440-32 = "#Q;유키노;The reason the urban legend fixates on crabs in a drum barrel is likely because...\n[as1] \"It's a realistic storage method.\"\n[as2] \"They want to sell more drum barrels.\"\n[as3] \"They want to induce fear.\""
901010400440-33 = ""
901010400440-35 = ""
901010400440-36 = "...Hm? We JUST said drum barrels will kill the crabs. It's not practical."
901010400440-37 = "The rumors would've mentioned a wooden box if they wanted to emphasize keeping the crabs alive."
901010400440-38 = "Think again, Sensei."
901010400440-39 = ""
901010400440-41 = ""
901010400440-42 = ""
901010400440-43 = ""
901010400440-46 = ""
901010400440-48 = ""
901010400440-49 = "I don't think this urban legend made drum barrels look particularly desirable."
901010400440-50 = "And why would you promote something like industrial drum barrels to the general public?"
901010400440-51 = "...I don't think that's right."
901010400440-52 = ""
901010400440-54 = ""
901010400440-55 = ""
901010400440-56 = ""
901010400440-59 = ""
901010400440-61 = ""
901010400440-62 = "...Fear."
901010400440-63 = "You're right. There's something unsettling and claustrophobic about the idea. Countless creatures teeming unseen at the bottom of the barrel..."
901010400440-64 = "People are instinctually repulsed by densely clustered creatures."
901010400440-65 = "Numerous venomous creatures in nature share similar patterns..."
901010400440-66 = "Ah, I get it! Like those creepy crawly creatures hidden inside the kitchen cupboard. You know, co—"
901010400440-67 = "Enough. We get it. No more details."
901010400440-68 = "So, this means that someone's deliberately inciting fear? Hysteria, even?"
901010400440-69 = "Why would they do that? There's no profit to be made."
901010400440-70 = "You take this world too lightly, FOX 3."
901010400440-71 = "Go online for a few hours and you'll see that there are plenty of people who share gruesome photos for no reason."
901010400440-72 = "Sure, but this isn't just some twisted prank. People have actually gone missing."
901010400440-73 = "Like that young fisherman from the crab boat."
901010400440-74 = "What if this is a Lore anomaly, like the kunekune?"
901010400440-75 = "An anomaly inspired by a killer crab? Just thinking about it sounds like a nightmare..."
901010400440-77 = "We shouldn't jump to conclusions. The missing persons cases and the urban legend may be completely unrelated."
