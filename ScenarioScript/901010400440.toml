[translation]
901010400440-6 = "我整理了在港口工作的人們，聽到「鐵桶蟹」傳聞後的反應……"
901010400440-7 = "大部分的港口從業人員不僅沒看過「裝著螃蟹的鐵桶」，還表現出無法理解的樣子。"
901010400440-8 = "如果將活蟹裝進鐵桶那種密閉容器很容易導致缺氧而死，#n所以通常都會裝進放滿木屑的木箱裡進行運送。"
901010400440-9 = "而且鐵桶相較於木箱成本更高，據說幾乎不會用來運輸活體生物。"
901010400440-10 = "除非是刻意想浪費錢，否則應該沒有理由特地把螃蟹裝進鐵桶裡吧。"
901010400440-12 = "可是傳聞中的螃蟹，不是在鐵桶裡被裝得滿滿的嗎？"
901010400440-13 = "……就像小小的採集桶裡，密密麻麻地爬滿了蟲子一樣。"
901010400440-14 = ""
901010400440-16 = ""
901010400440-17 = "不要用那種比喻啦！#n害我腦海裡一直浮現令人起雞皮疙瘩的畫面！"
901010400440-18 = ""
901010400440-20 = ""
901010400440-22 = "……不，說不定那才是真正的目的。"
901010400440-23 = "如果毫無理由地反覆強調某個特定的形象……#n那麼，必定是想透過那個形象傳達某種訊息吧。"
901010400440-24 = "怪談中的螃蟹之所以會被裝在鐵桶裡登場，原因大概是……"
901010400440-25 = ""
901010400440-27 = ""
901010400440-28 = ""
901010400440-31 = ""
901010400440-32 = "#Q;유키노;怪談中的螃蟹之所以會被裝在鐵桶裡登場，原因大概是……\n[as1] 因為那是符合現實的保存方法。\n[as2] 因為想宣傳鐵桶。\n[as3] 因為想要引發恐懼。"
901010400440-33 = ""
901010400440-35 = ""
901010400440-36 = "……嗯？剛才不是說螃蟹裝進鐵桶裡很容易死掉，所以幾乎不會用於運送嗎？"
901010400440-37 = "如果是想強調螃蟹的保存性，應該會提到木箱才對吧。"
901010400440-38 = "老師，再仔細想想看吧。"
901010400440-39 = ""
901010400440-41 = ""
901010400440-42 = ""
901010400440-43 = ""
901010400440-46 = ""
901010400440-48 = ""
901010400440-49 = "在這則怪談裡，鐵桶看起來並不是個正面的元素。"
901010400440-50 = "而且向大眾宣傳鐵桶又有什麼好處？"
901010400440-51 = "……我覺得應該不是那樣。"
901010400440-52 = ""
901010400440-54 = ""
901010400440-55 = ""
901010400440-56 = ""
901010400440-59 = ""
901010400440-61 = ""
901010400440-62 = "……恐懼啊。"
901010400440-63 = "像鐵桶那樣細長的容器裡，滿滿地裝著某種東西不斷蠕動的模樣……#n確實很容易引發心理上的恐懼。"
901010400440-64 = "特定群體密集地聚在一處的畫面，只要是人類都會本能性地想避開呢。"
901010400440-65 = "許多自然界中帶有毒性的生物也具有類似的特徵……"
901010400440-66 = "啊，我知道了。就像躲在廚房櫥櫃裡的蟑──"
901010400440-67 = "到此為止，別再提更具體的例子了。"
901010400440-68 = "所以意思是有人故意在引發厭惡感或恐懼囉？"
901010400440-69 = "做這種事又不能賺錢，到底為什麼要這麼做啊……"
901010400440-70 = "你把這個世界看得太單純了呢，FOX3。"
901010400440-71 = "只要稍微看一下網路就會知道，有多少傢伙毫無理由地用噁心的照片在釣魚了……"
901010400440-72 = "要是像FOX4說的，只是單純的惡作劇倒還好……不過這次確實有人失蹤了不是嗎？"
901010400440-73 = "捕蟹船的那個新人漁夫也是。"
901010400440-74 = "會不會像上次的「扭來扭去」一樣，是從怪談中誕生的怪異襲擊了居民呢？"
901010400440-75 = "以襲擊居民的螃蟹為原型而誕生的怪異啊……光是想像就覺得很棘手呢。"
901010400440-77 = "別急著貿然猜測。#n失蹤事件和都市傳說有可能是各自獨立的案件。"
