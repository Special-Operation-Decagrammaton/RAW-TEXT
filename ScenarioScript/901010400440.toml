[translation]
901010400440-6 = "항구에서 일하는 사람들이 <드럼통 속의 게> 이야기를 듣고 보인 반응을 정리하자면……"
901010400440-7 = "대부분의 항만 사람들은 '게가 담긴 드럼통'을 본 적도 없을 뿐더러, 이해할 수 없다는 반응을 보였어."
901010400440-8 = "살아있는 활게는 드럼통처럼 밀폐된 용기에 담으면 쉽게 폐사하기 때문에, 보통은 톱밥이 가득 든 나무상자에 담아서 운송한다고 하거든."
901010400440-9 = "게다가 드럼통은 나무 상자에 비해 가격이 비싸서 생물에는 거의 쓰이지 않는다고 해."
901010400440-10 = "일부러 돈 낭비를 하려는 속셈이 아니라면, 게를 일부러 드럼통에 담을 리는 없겠지."
901010400440-12 = "하지만 소문 속의 게는 하나 같이 드럼통 안에 가득 담겨 있었다고 하잖아?"
901010400440-13 = "……마치 작은 채집통에 벌레가 바글거리는 것처럼 말이지."
901010400440-17 = "그런 비유 좀 하지 마! 자꾸 소름끼치는 이미지가 떠오르잖아!"
901010400440-22 = "……아니. 어쩌면 그게 목적일지도 몰라."
901010400440-23 = "이유없이 특정한 이미지를 반복해서 강조한다면, 그 이미지를 통해 주고자 하는 메시지가 있었겠지."
901010400440-24 = "괴담에서 게가 드럼통 안에 담긴 채로 등장한 이유는 아마도—"
901010400440-32 = "괴담에서 게가 드럼통 안에 담긴 채로 등장한 이유는 아마도—\n[as1] 현실적인 보관 방법이기 때문이다.\n[as2] 드럼통을 홍보하고 싶었기 때문이다.\n[as3] 공포를 유발하기 위함이다"
901010400440-36 = "……응? 방금 게는 드럼통에 담으면 폐사하기 쉬워서 운송에 거의 쓰지 않는다고 했잖아."
901010400440-37 = "게의 보존성을 강조하고 싶었으면 나무 상자를 언급했겠지."
901010400440-38 = "다시 생각해 봐, 선생님."
901010400440-49 = "이 괴담에서 드럼통이 긍정적인 소재로 쓰인 것 같지는 않은데."
901010400440-50 = "게다가 불특정 다수에게 드럼통을 홍보해서 어디에 쓰려고?"
901010400440-51 = "……내 생각에 그건 아닌 것 같아."
901010400440-62 = "……공포라."
901010400440-63 = "확실히 드럼통처럼 기다란 용기에 무언가가 가득 담겨 바글거리는 모습은 심리적인 공포를 유발하기 쉽지요."
901010400440-64 = "특정 집합체가 조밀한 곳에 몰려 있는 이미지는 인간이라면 본능적으로 회피하고 싶어지니까요."
901010400440-65 = "자연계에서 독을 지닌 많은 생물들이 비슷한 패턴을 갖고 있기도 하거니와……"
901010400440-66 = "아, 그런 느낌이지? 부엌 찬장 속에 숨어있는 바—"
901010400440-67 = "거기까지. 더 이상 구체적인 사례를 언급하지 마."
901010400440-68 = "그럼 누군가가 고의로 혐오나 공포를 유발하고 있다는 말이야?"
901010400440-69 = "돈이 되는 일도 아닌데 왜 그런 일을……"
901010400440-70 = "세상을 너무 가볍게 여기고 있구나, FOX 3."
901010400440-71 = "인터넷을 조금만 살펴봐도, 이유 없이 징그러운 사진으로 낚시를 하는 녀석이 얼마나 많은지 알게 될 거야……"
901010400440-72 = "FOX 4의 말처럼 단순한 장난이라면 좋겠지만, 이번에는 실제로 자취를 감춘 사람들이 있었잖아?"
901010400440-73 = "게잡이 어선의 그 신참 어부도 그렇고."
901010400440-74 = "그럼 지난번의 '쿠네쿠네' 처럼 로어에서 발생한 괴이가 사람을 습격한 걸까?"
901010400440-75 = "사람을 습격하는 게를 모티브로 만들어진 괴이라니, 생각만 해도 상대하기 빡세보이네……"
901010400440-77 = "섣부른 억측은 금물이야. 실종 사건과 도시 전설이 별개의 사건일지도 모르니까."
