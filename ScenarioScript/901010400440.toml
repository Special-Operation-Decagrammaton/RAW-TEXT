[translation]
901010400440-6 = "และถ้าให้สรุปปฏิกิริยาของคนที่ทำงานในท่าเรือหลังจากได้ยินเรื่อง <ปูในถังเหล็ก> ละก็..."
901010400440-7 = "คนส่วนใหญ่ในท่าเรือ นอกจากจะไม่เคยเห็น 'ถังเหล็กที่บรรจุปู' แล้ว ยังบอกว่าไม่เข้าใจด้วยว่า ทำแบบนั้นไปเพื่ออะไร"
901010400440-8 = "เพราะถ้าเอาปูเป็นๆ ใส่ภาชนะปิดทึบอย่างถังเหล็ก ปูก็จะตายได้ง่าย ปกติก็เลยขนส่งกันในลังไม้ที่รองพื้นด้วยขี้เลื่อยไว้เต็มลังกันน่ะ"
901010400440-9 = "แล้วถังเหล็กก็มีราคาสูงกว่าลังไม้ ก็เลยแทบจะไม่เอามาใช้ขนส่งสิ่งมีชีวิต"
901010400440-10 = "ถ้าไม่ได้ตั้งใจจะสิ้นเปลืองเงินโดยใช่เหตุ ก็คงไม่มีใครเอาปูใส่ถังเหล็กหรอก"
901010400440-12 = "แต่ข่าวลือบอกว่าปูทั้งหมดถูกใส่ไว้เต็มถังเหล็กเลยไม่ใช่เหรอ?"
901010400440-13 = "นึกถึงแมลงที่คลานยั้วเยี้ยอยู่เต็มกล่องจับแมลงใบเล็กๆ เลย..."
901010400440-14 = ""
901010400440-16 = ""
901010400440-17 = "อย่าเปรียบเทียบแบบนั้นสิ! ยิ่งนึกภาพในหัว ยิ่งน่าขนลุกนะ!"
901010400440-18 = ""
901010400440-20 = ""
901010400440-22 = "ไม่หรอก... ฉันว่าบางทีนั่นอาจเป็นจุดประสงค์ก็ได้"
901010400440-23 = "ถ้าภาพใดก็ตามถูกเน้นย้ำซ้ำๆ โดยไม่มีเหตุผล ก็ย่อมเป็นเพราะต้องการสื่อสารข้อความบางอย่าง#nผ่านภาพนั้น"
901010400440-24 = "เหตุผลที่ตำนานเมืองเล่าว่าปูถูกใส่อยู่ในถังเหล็ก น่าจะเป็นเพราะ..."
901010400440-25 = ""
901010400440-27 = ""
901010400440-28 = ""
901010400440-31 = ""
901010400440-32 = "#Q;유키노;เหตุผลที่ตำนานเมืองเล่าว่าปูถูกใส่อยู่ในถังเหล็ก น่าจะเป็นเพราะ...\n[as1] เป็นวิธีเก็บรักษาที่สมจริง\n[as2] ต้องการโปรโมตถังเหล็ก\n[as3] เพื่อสร้างความหวาดกลัว"
901010400440-33 = ""
901010400440-35 = ""
901010400440-36 = "หืม...? เมื่อกี้ก็เพิ่งบอกเองไม่ใช่เหรอว่าถ้าเอาปูใส่ถังเหล็ก มันจะตายง่าย เลยแทบไม่ใช้ขนส่งกันน่ะ"
901010400440-37 = "ถ้าอยากเน้นเรื่องการเก็บรักษาปู ก็ต้องพูดถึงลังไม้มากกว่าถังเหล็กสิ"
901010400440-38 = "ลองคิดดูใหม่นะ คุณครู"
901010400440-39 = ""
901010400440-41 = ""
901010400440-42 = ""
901010400440-43 = ""
901010400440-46 = ""
901010400440-48 = ""
901010400440-49 = "ในตำนานเมืองเรื่องนี้ ถังเหล็กก็ไม่ได้ถูกพูดถึงในแง่บวกเลยนี่"
901010400440-50 = "อีกอย่าง จะโปรโมตถังเหล็กกับคนทั่วไปไปเพื่ออะไรกัน?"
901010400440-51 = "ฉันว่ามันไม่น่าจะใช่แบบนั้นนะ..."
901010400440-52 = ""
901010400440-54 = ""
901010400440-55 = ""
901010400440-56 = ""
901010400440-59 = ""
901010400440-61 = ""
901010400440-62 = "ความหวาดกลัวสินะ..."
901010400440-63 = "ก็จริงอย่างที่ว่า ภาพของบางอย่างที่อัดแน่นยั้วเยี้ยอยู่เต็มภาชนะทรงยาวแบบถังเหล็ก น่าจะกระตุ้นความหวาดกลัวทางจิตใจได้ง่ายเลยค่ะ"
901010400440-64 = "โดยสัญชาตญาณแล้ว มนุษย์อยากหลีกเลี่ยงภาพของสิ่งมีชีวิตจำนวนมากที่เบียดเสียดกันหนาแน่นค่ะ"
901010400440-65 = "สิ่งมีชีวิตที่มีพิษหลายชนิดในธรรมชาติ ก็มีรูปแบบที่คล้ายคลึงกันด้วย..."
901010400440-66 = "อ้อ แบบนั้นสินะ? อย่างเช่นเจ้าตัวที่ซ่อนอยู่ในตู้กับข้าวในครัว..."
901010400440-67 = "พอแค่นั้นเลย อย่ายกตัวอย่างให้เห็นภาพไปมากกว่านี้ดีกว่า"
901010400440-68 = "งั้นก็หมายความว่า มีใครบางคนจงใจกระตุ้นความรู้สึกขยะแขยงหรือความหวาดกลัวงั้นเหรอ?"
901010400440-69 = "ทั้งที่ไม่ได้ทำเงินแท้ๆ ทำไมถึงต้องทำเรื่องแบบนั้นด้วย..."
901010400440-70 = "เธอประเมินความเลวร้ายของโลกต่ำเกินไปแล้วนะ FOX 3"
901010400440-71 = "แค่ลองดูในอินเทอร์เน็ตนิดเดียวก็รู้แล้ว ว่ามีคนตั้งเยอะที่ชอบใช้รูปชวนขยะแขยงมาหลอกคนเล่นๆ โดยไม่มีเหตุผล... "
901010400440-72 = "ถ้าเป็นแค่เรื่องล้อเล่นอย่างที่ FOX 4 ว่าก็คงดีหรอก แต่ครั้งนี้มีคนหายตัวไปจริงๆ เลยไม่ใช่เหรอ?"
901010400440-73 = "ลูกเรือประมงจับปูคนใหม่คนนั้นก็ด้วย"
901010400440-74 = "หรือนี่จะเป็นเหตุการณ์ที่สิ่งลึกลับจากตำนานเป็นฝ่ายทำร้ายผู้คน เหมือนกับ 'คุเนะคุเนะ' ครั้งก่อน?"
901010400440-75 = "สิ่งลึกลับที่มีต้นแบบมาจากปูที่ทำร้ายผู้คนงั้นเหรอ แค่คิดก็รู้สึกว่าน่าจะรับมือยากแล้ว..."
901010400440-77 = "อย่าเพิ่งด่วนสรุปเลย คดีคนหายกับตำนานเมืองอาจเป็นคนละเรื่องกันก็ได้"
