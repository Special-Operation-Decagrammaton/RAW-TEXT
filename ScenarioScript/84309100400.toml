[translation]
84309100400-5 = "다 정리했고, 이걸로 이제 문제없을 거야."
84309100400-6 = "확인했어. 전반적으로 문제들이 모두 해결되었으니, 당분간 경비 시스템 자체는 오작동의 문제가 없을 거야."
84309100400-7 = "해킹……이라고 하셨죠. 혹시 제어권도 우리가 확보한 걸까요?"
84309100400-8 = "그 말이 사실이라면, 이제는 매번 잠입할 필요 없이 이곳에서 해킹한 경비 시스템을 조작하는 것만으로도 많은 것이 해결될 텐데요."
84309100400-9 = "맞는 말이지만 유감스럽게도 그런 기능은 넣지 않았어. 이번 오작동에 대한 A/S만 진행했다고 생각하면 돼."
84309100400-11 = "……????"
84309100400-12 = "어? 당연히 해킹 툴을 심어서 여기서 조작하는 거 아니었어?"
84309100400-13 = "뭐냐? 왜 이럴 땐 또 안 하는 건데? 원래 그게 네 전공이잖아!"
84309100400-17 = "그, 그야…… 그건 감시와 통제니까. 그게 좋지 않다는 건 나도 확실하게 배웠으니까 당연하지."
84309100400-21 = "어, 그 그렇긴 한데. ……아니, 그……."
84309100400-22 = "어……. 그러니까 그거랑 이건……."
84309100400-27 = "후…… 아니다. 그래, 네 말이 맞다."
84309100400-28 = "뭐, 저희 입장에서도 일이 너무 싱거워질 수 있으니까요. 어떤 의미로는 다행이라고도 할 수 있겠네요."
84309100400-29 = "완전히 즐기는 자 모드잖아, 너."
84309100400-30 = "문제라도 있을까요?"
84309100400-31 = "아니."
84309100400-33 = "……고생했어, 두 사람 모두."
84309100400-34 = "뭔가 파악되면 다시 알려줄게."
