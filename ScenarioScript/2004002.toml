[translation]
2004002-1 = "사츠키는 알고 있다."
2004002-2 = "(사츠키의 연락을 받고 얼마 지나지 않아……)"
2004002-6 = "후후, 여기가 선생의 사무실…… 마코토 쨩이 말한 것처럼 생각보다 간소하구나."
2004002-7 = "아, 혹시 바빴던 건 아니지?"
2004002-8 = "[s] \"바쁜 거야 항상 바쁘지. 그런데 무슨 일……\""
2004002-9 = "뭐, 그렇다 하더라도 상관없어."
2004002-10 = "내가 가져온 건 아무리 바쁜 일이라도 미뤄야 할 정도로 중요한 안건이니까."
2004002-11 = "[s1] \"처음부터 내 말을 들을 생각이 없었구나……\"\n[s2] \"대체 무슨 일이길래 그래?\""
2004002-14 = "흠, 선생이라면 짐작하고 있을 줄 알았는데."
2004002-15 = "연기는 그만해도 돼. 전문가들의 대화잖아?"
2004002-16 = "어쨌든, 지금 진행 중인 만마전의 계획……"
2004002-17 = "마코토 쨩의 [키보토스 언론 장악] 1단계가 본격적인 궤도에 오르게 되었으니."
2004002-22 = "만마전의 협력자인 선생도 적극적으로 협조하라는 이야기야."
2004002-26 = "[ns3] \"아니, 그런 일에 협력한다고 한 적은 없는데.\"\n[ns4] \"애초에 처음 듣는 일이거든?!\""
2004002-29 = "그럴 리가. 만마전 정보부의 자료는 정확했을 텐데?"
2004002-30 = "게헨나 광장에서 모두가 지켜보는 가운데 마코토 쨩의 구두를 핥으며 천 년간 무조건적인 협력을 약조한 게 아니었어?"
2004002-31 = "[s] \"아니야!! 대체 어디서 나온 거야, 그런 헛소문!!\""
2004002-32 = "흥, 입수한 정보에 오류가 있는 건가. 귀찮아서 검증 과정을 생략했더니 이런 문제가 생기네."
2004002-33 = "[s] \"생략해서는 안 될 걸 너무 과감하게 빼버린 거 아냐?\""
2004002-37 = "어쨌든 내 소개부터 제대로 해야겠네."
2004002-38 = "나, 쿄고쿠 사츠키는 게헨나 학생회 정보부의 후인이야."
2004002-39 = "내가 이끄는 만마전 정보부는, 역사의 뒤안길로 사라진 전 게헨나 학생회 정보부의 노하우를 이어받은 기술적 계승자라고 할 수 있고."
2004002-40 = "딱히 정식으로 인계받은 건 아니지만, 그냥 내가 그렇게 생각하고 있지."
2004002-41 = "[s] \"그냥 맘대로 정한 거구나……\""
2004002-42 = "자아, 소개는 이쯤이면 됐고. 본론으로 들어가지."
2004002-43 = "자발적으로 협력하지 않는다면……"
2004002-44 = "우리 정보부가 파악한 핵심 정보를 활용해 당신을 협박할 수밖에."
2004002-51 = "[ns] \"핵심 정보……?\""
2004002-52 = "선생, 당신의 '약점'말이야."
2004002-53 = "후후, 어때? 들을 각오는 됐어?"
2004002-54 = "[s] \"……\""
2004002-56 = "[ns] (약점이 너무 많아서, 뭐가 나올지 짐작도 안 간다……)"
2004002-57 = "그 첫 번째."
2004002-58 = "선생, 당신은……"
2004002-62 = "전라로 키보토스의 들판을 질주하는 취미가 있다지?"
2004002-63 = "[s] \"일단 사실이긴 한데!! 취미까지는 아니거든?!\""
2004002-64 = "자신의 약점을 그렇게 선선히 인정하는 거야……?"
2004002-65 = "이 정도쯤은 수치의 영역으로 판단하지도 않는다는 건가. 역시 선생이네."
2004002-66 = "[s] \"부끄러운 일이긴 했지만……!\""
2004002-67 = "흥, 하지만 아직 끝나지 않았어."
2004002-68 = "아직 남아있는 선생의 약점은 수십 개도 넘는다고?"
2004002-69 = "[s] \"그렇게 많아? 어떻게 살아온 거야, 나……\""
2004002-70 = "듣다가 너무 무서우면 그만해도 돼. 대신 만마전에게 천 년의 협력을 약속해 줘야겠지만."
2004002-71 = "자아, 선생의 두 번째 약점……"
2004002-72 = "[ns] (꿀꺽……)"
2004002-73 = "선생은……"
2004002-77 = "결식 학생을 위한 모금에 매달 참여하고 있다던데? 후후."
2004002-78 = "[s] \"……\""
2004002-80 = "[ns5] \"내 입으로 말하긴 그렇지만……\"\n[ns6] \"그건 약점이라기보다는 미담의 영역 아닐까?\""
2004002-83 = "아니, 아니. 그렇지 않아."
2004002-84 = "우리가 살아가는 키보토스는 그야말로 야생. 적자생존의 세계니까."
2004002-85 = "그런 냉혹한 세계에서 섣부른 동정심을 발휘하는 건 스스로 약점을 드러내는 거나 마찬가지잖아?"
2004002-86 = "[s] \"나는 선생이니까, 학생을 위한 일을 하고 있을 뿐이야.\""
2004002-87 = "후후, 이것마저 아무렇지 않게 넘기는 거야?"
2004002-88 = "역시 선생이네. 본인이 인정해버리면 더 이상 해당 정보를 악의적으로 활용할 수 없는 맹점을 공략하다니."
2004002-89 = "[s] \"아니, 애초에 약점이 아니라니까 그거……\""
2004002-90 = "흐응, 하지만 이번 정보는 정말 치명적일걸?"
2004002-91 = "선생의 약점, 그 세 번째……"
2004002-95 = "선생은 인스턴트 라면을 끓일 때, 봉지 밑바닥에 남은 부스러기까지 탈탈 털어 넣는다……!"
2004002-96 = "[s] \"……\""
2004002-98 = "[ns] \"그게 보통 아니야……?\""
2004002-99 = "후후, 같은 행동일지라도 누가 하느냐에 따라 그 의미가 달라지는 법이지."
2004002-100 = "언제나 고고하고 완벽한 샬레의 선생이, 평범한 사람들이나 하는 행실을 한다고?"
2004002-101 = "과연 이 사실을 학생들이 알게 되면 어떨까? 크게 실망해서 등을 돌리지 않을까?"
2004002-102 = "하지만 우리 만마전은 달라. 선생의 그런 결점까지도 포용할 수 있는……"
2004002-103 = "[s] \"아니, 괜찮아……\""
2004002-106 = "아직 상황 파악이 덜 된 모양이네."
2004002-107 = "선생, 나는 지금 협박하고 있는 거야."
2004002-112 = "이 거대한 약점…… 선생의 비밀을 만천하에 폭로할 수도 있다고?"
2004002-113 = "[s] \"그래도 상관없을 것 같은데……\""
2004002-118 = "이것마저도 개의치 않는 건가…… 후후……"
2004002-119 = "어떻게 그렇게 의연할 수 있는지는 모르겠지만, 별수 없네."
2004002-120 = "약점을 잡아 협박한다는 계획은 폐기."
2004002-121 = "하지만 아직 포기한 건 아니야."
2004002-122 = "선생의 협력을 얻어내기 위해서라면 이보다 더한 방법도 얼마든지 써줄 테니까."
2004002-123 = "자아, 그럼 나는 이만 물러나도록 하지."
2004002-124 = "[s] \"으응…… 잘 가……\""
2004002-127 = "후후, 다음번엔 오늘처럼 상냥하지는 않을 테니 기대해."
2004002-132 = "[ns] \"……뭔가 나를 크게 오해하고 있는 것 같은데……\""
