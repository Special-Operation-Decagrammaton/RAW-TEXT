[translation]
1600708-1 = "미묘한 거짓말은 실수에 가깝다"
1600708-2 = "붉은겨울 연방학원 정문 앞"
1600708-3 = "좋은 아침입니다, 선생님."
1600708-4 = "전에 말씀드린 것처럼 오늘은 체리노 회장님의 위대한 행적을 기록하기 위해, 다큐멘터리 영화를 찍을 예정이랍니다."
1600708-5 = "체리노 회장님이 평소에 머무르시는 사무국의 집무실부터……"
1600708-6 = "휴식 중에 즐겨 찾으시는 디저트 가게까지……."
1600708-7 = "체리노 회장님의 동선을 따라 붉은겨울 학원 곳곳을 견학하며, 회장님의 취향과 일상을 빠짐없이 기록하도록 하죠!"
1600708-8 = "[s] \"그런 일이라면 내가 없어도 되는 거 아냐?\""
1600708-9 = "아뇨. 이 영화는 장차 키보토스 전역의 영화관에서도 상영될 예정인, 붉은겨울 사무국의 역작이니까요!"
1600708-10 = "그러니 붉은겨울 학원과 무관한 외부인의 시선 또한 고려하지 않을 수 없겠지요."
1600708-11 = "관객의 이해를 도울 수 있도록, 선생님께서 영화의 중간마다 어떤 생각이 들었는지 솔직한 외부인의 시선으로 말씀해 주시면 좋겠습니다."
1600708-12 = "[s] \"그런 일이라면 어렵지 않지만…….\""
1600708-13 = "네. 오늘은 선생님을 회장님이라 생각하고 정성껏 모실테니, 선생님께서는 그저 편안히 하루를 즐겨주세요."
1600708-14 = "그럼 지금부터…… 녹화를 시작하겠습니다!"
1600708-16 = "붉은겨울 사무국"
1600708-17 = "이곳은 붉은겨울 사무국의 임원들이 업무를 처리하는 사무국이랍니다."
1600708-18 = "체리노 회장님의 하루 일과도 이곳에서 시작되지요."
1600708-19 = "체리노 회장님은 아침에 등교하시면 잼을 잔뜩 넣은 홍차를 한 잔 주문하시는데……"
1600708-20 = "[s1] \"잼을 넣은 홍차라고?\"\n[s2] \"맛이 잘 상상이 가질 않는데.\""
1600708-21 = "후후. 듣기에는 이상해 보여도 잼의 단맛은 홍차의 향과 정말 잘 어울린답니다."
1600708-22 = "후후. 듣기에는 이상해 보여도 잼의 단맛은 홍차의 향과 정말 잘 어울린답니다."
1600708-23 = "선생님께서도 한 잔 드셔보시겠어요?"
1600708-24 = "[s] \"그럼 부탁할게.\""
1600708-25 = "네, 그럼 지금 바로 차를 내오겠습니다. 자리에 앉아서 기다려주세요."
1600708-31 = "(토모에가 내온 홍차를 마시며 즐겁게 이야기를 나누었다.)"
1600708-33 = "붉은겨울 자치구 내 디저트 가게"
1600708-34 = "이곳은 체리노 회장님이 제일 좋아하는 푸딩을 판매하는 디저트 가게입니다."
1600708-35 = "과거 이곳의 푸딩을 맛보신 회장님이 크게 만족하여 훈장을 내려주신 덕분에, 이곳의 디저트에는 권위를 상징하는 수염 장식을 붙일 수 있게 되었답니다."
1600708-36 = "이곳의 디저트는 푸딩도 맛있지만, 연어알과 달콤한 크림을 듬뿍 넣은 <수염 블린>도 인기가 많아요."
1600708-37 = "[s] \"연어알과 달콤한 크림이 잘 어울릴까……?\""
1600708-38 = "후후, 그럼 이번에도 직접 드셔보시겠어요?"
1600708-39 = "잠시만 기다려주세요. 제가 곧 수염 블린을 가져오겠습니다."
1600708-45 = "(토모에가 가져온 수염 블린을 나누어 먹으며 즐겁게 이야기를 나누었다.)"
1600708-46 = "(이후, 토모에를 따라 붉은겨울 학원 곳곳을 견학하며 여러가지 이야기를 들었다……)"
1600708-50 = "붉은겨울 연방학원 정문 앞"
1600708-51 = "어머나, 벌써 시간이 이렇게 되었네요."
1600708-52 = "그저 행적을 뒤쫓기만 했는데 하루가 모두 지나가 버리다니…… 체리노 회장님께서는 정말 하루를 바쁘게 보내시는군요."
1600708-53 = "[s] \"먹고 즐기는 게 대부분이었지만.\""
1600708-54 = "후후, 그래도 즐거운 하루였네요."
1600708-55 = "좋은 영화가 나올 것 같아 벌써부터 기대가 되네요."
1600708-56 = "[s3] \"아까 전부터 묻고 싶었는데…….\"\n[s4] \"촬영용 카메라는 어디에 있어?\""
1600708-57 = "……."
1600708-58 = "어머나, 그러고 보니 카메라를 깜박했네요."
1600708-59 = "……."
1600708-60 = "어머나, 그러고 보니 카메라를 깜박했네요."
1600708-61 = "선생님과 나누는 대화가 너무 즐거워서 무심코 '실수'를 저지르고 말았네요."
1600708-62 = "[ns] \"실수라기에는 너무 노골적인데…….\""
1600708-64 = "[ns] \"영화 촬영을 핑계로 거짓말을 한 건 아니야?\""
1600708-65 = "……."
1600708-72 = "체리노 회장님을 향한 제 마음은 여전히 변함이 없습니다만…… 제가 좋아하는 어느 영화에는 이런 말이 나온답니다."
1600708-73 = "\"미묘한 거짓말은 실수에 가깝다.\""
1600708-74 = "그러니까 선생님을 모시기 위해 제가 한 이 미묘한 거짓말은…… 어찌보면 작은 실수라고도 할 수 있겠지요."
1600708-75 = "선생님과 함께 보낸 오늘 하루는, 체리노 회장님과 보내는 일상과는 다른 의미로 너무나도 즐거워서……"
1600708-76 = "앞으로도 종종 '실수'를 저지를 것만 같네요."
1600708-78 = "(이후, 토모에의 '실수'에 어울려주며 하루를 보람차게 마감했다.)"
