[translation]
221080-1 = "第8話;第三の選択肢"
221080-3 = "……艦長。まだ決断できないんですか？"
221080-4 = "数ヶ月悩んでるのに、1週間考えて答えが出るなら苦労しないよ……。"
221080-5 = "サミーの処遇に関する噂は今も広がっています。"
221080-6 = "それどころか、サミーのせいで先生が怪我をして……。"
221080-7 = "「サミーが不運を呼んでるんじゃないか」という不安の声が大きくなっています。"
221080-8 = "サミーを下ろせば、不運は全部消える、と？"
221080-9 = "……そういう意味じゃないのは分かっていますよね！？"
221080-10 = "にゃん！？"
221080-11 = "……ごめんね、サミー。"
221080-12 = "あなたに怒ったわけじゃないの。"
221080-13 = "にゃぅん……。"
221080-14 = "ですが、シャーレの先生が我が校で負傷したという事実は変わりません。"
221080-15 = "分かってる。"
221080-16 = "もしもこの件でシャーレが責任を問うてきたら――どう対応するおつもりですか？"
221080-18 = "[ns1] \"それは心配しなくていいよ。\"\n[ns2] \"私が勝手に怪我しただけだから。\""
221080-21 = "[USERNAME]先生？#nそれに、連邦生徒会長まで……。"
221080-22 = "腰を痛めたと聞きましたが、もう動いて大丈夫なんですか？"
221080-23 = "……ひとまず、お掛けください。すぐお茶を用意します。"
221080-24 = "お構いなく。喉は渇いていませんので。"
221080-25 = "それより、前回お願いした案件について……すぐにでも話を始めたいのですが。"
221080-26 = "例の話をできないような禁忌や儀礼は……ありませんよね？"
221080-27 = "もちろんです。では、早速本題へ。"
221080-33 = "ごろんごろん……。"
221080-34 = "ふふ、その子は相変わらず暢気ですね。"
221080-38 = "期日まではまだ時間がありますが……処遇の検討は順調ですか？"
221080-39 = "申し訳ありませんが、まだ……。"
221080-40 = "やはり……生徒の反発と、恨まれることが怖いのですか？"
221080-41 = "それとも、オデュッセイアの慣習と海の禁忌を破ることが怖いのでしょうか。"
221080-42 = "……両方、です。"
221080-43 = "[ns] \"この数日、サミーの行動を見て回ったよ。\""
221080-45 = "[ns3] \"たしかに、サミーの周りで不運は起きてた。\"\n[ns4] \"でも、それを全部サミーのせいにするのは違うと思う。\""
221080-48 = "そうですね。#nサミーはただの猫なのですから。"
221080-49 = "にゃん。"
221080-50 = "[s5] \"艦長が宣言するのはどう？\"\n[s6] \"サミーの状態と学園の運勢は関係ないって。\""
221080-53 = "それは……。"
221080-54 = "はぁ……。"
221080-55 = "正直に言えば……私も理解はしているんです。"
221080-56 = "オデュッセイアに数多くある禁忌が、現代では意味を失った慣習に過ぎないと。"
221080-57 = "ウサギやネズミのように、かつては危険だった存在も、#n今では航行に何の影響も与えません。"
221080-58 = "物資が不足しがちな海の上で、形骸化した禁忌を守るために資源を浪費するのは……#n陸の人からすれば滑稽に映るでしょう。"
221080-59 = "ですが……知らぬふりをするには、この海はあまりにも気まぐれなんです。"
221080-61 = "明日の約束がない、変わり続ける天候。"
221080-62 = "水面下に潜む、無数の暗礁と脅威。"
221080-63 = "そして――人の理屈では飲み込めない、理不尽な出来事。"
221080-64 = "そんな環境に置かれ続ければ、人は苦しみ……逃げたくなる。"
221080-67 = "だから時に、分かりやすく明快な「答え」を望んでしまうんです。"
221080-68 = "オデュッセイアの選んだ答えが――禁忌だと？"
221080-69 = "はい。それなら納得しやすいですから。"
221080-71 = "風が悪くて航海が遅れ、貴重な食糧が無駄になるとしても――"
221080-72 = "突然の嵐で、必死に修理したマストが折れてしまったとしても――"
221080-73 = "巨大な波にさらわれ、大切な仲間が大怪我を負ったとしても――"
221080-75 = "誰かが禁忌を破ったから起きた。#nそういう因果だと考えたら、どうでしょう。"
221080-76 = "すべての責任を、年老いて病んだ猫1匹に背負わせられるのなら……。"
221080-77 = "誰も傷つかずに、この理不尽な海を航海できるのかもしれません。"
221080-78 = "……にゃおん。"
221080-79 = "ごろんごろん……。"
221080-80 = "ですが……それは本当に最善の決断なのでしょうか。"
221080-81 = "…………。"
221080-82 = "[ns7] \"理不尽に向き合うのは、大人だってつらいよ。\"\n[ns8] \"カーペットの下に隠したくなる時もある。\""
221080-85 = "カーペット、ですか……面白い例えですね。"
221080-86 = "オデュッセイアにも、似た話はあります。"
221080-87 = "面倒で複雑なものは甲板の下へ押し込んでしまえば、外からは見えなくなると。"
221080-88 = "[ns] \"でも、問題は確かに残ってる。\""
221080-90 = "[ns9] \"解決しないまま、そこに居座り続ける。\"\n[ns10] \"カーペットをめくって掃除するまで。\""
221080-96 = "にゃん！"
221080-100 = "この玉をサミーに作ってあげたのは1年生の時でした。"
221080-101 = "いま見ると……結びが拙い部分があるし、逆向きに巻いた結びもあります。"
221080-102 = "でもサミーは、これを気に入ってくれた。"
221080-106 = "艦長は理性的な判断を下すべき立場だということは――誰より分かっています。"
221080-107 = "ですが……艦長である前に、私も当事者です。"
221080-108 = "サミーは、長い時間を共にした親友。#n離れ離れになる寂しさを理屈だけで納得できるほど、大人ではありません。"
221080-112 = "向き合うか、目を背けるか。#n方法がそれしか無いとは限りませんよ。"
221080-113 = "納得できる相手に判断を任せるのも、1つの手でしょう。"
221080-114 = "というと……？"
221080-115 = "例えば――連邦生徒会長の権威を借りるのはいかがですか？"
221080-116 = "連邦生徒会は、オデュッセイアに常駐する猫に衛生上の問題があると判断します。"
221080-117 = "従って衛生管理のため、連邦生徒会長が猫を回収し、適切に対処します。"
221080-118 = "……いかがでしょう？"
221080-119 = "たしかに……それであれば大半の生徒は納得します。"
221080-120 = "決定に伴う責任も、恨みも――オデュッセイアには残りませんから。"
221080-122 = "[ns] \"連邦生徒会に反感を持つ生徒が出たらどうする？\""
221080-123 = "構いません。#nそもそも連邦生徒会は、嫌われるために作られた組織ですから。"
221080-124 = "海の禁忌がどれだけ破りがたく、理解しがたいものだとしても……。"
221080-125 = "学園の外にある「強大な権威」ほど、理不尽で不可解なものはありません。"
221080-126 = "そこまで言われてしまえば……私に異論をはさむ余地はありませんね……。"
221080-127 = "感情は横において、合理的な判断を下すべきだとするなら――"
221080-132 = "サミーを……よろしくお願いします。"
221080-134 = "次回;役割分担"
