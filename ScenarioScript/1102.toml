[translation]
1102-1 = "미식연구회의 기묘한 하루 2"
1102-2 = "(선도부 유치장에 갇혀 있는 미식연구회 일당들)"
1102-3 = "뭐어어? 트뤼플? 나도 먹고싶었는데에에에!"
1102-4 = "안타깝게도 뺏겨버렸습니다……."
1102-5 = "뭐야, 그게!! 너희는 냄새라도 맡았잖아!! 엄청 귀한 거라며!!"
1102-6 = "그렇습니다. 그 농후하고 독특한 향기…… 평생 잊을 수 없겠죠."
1102-7 = "먹고 싶었는데…… 트뤼플."
1102-8 = "(쾅쾅쾅쾅-!!) 야 이 놈들아!! 니들만 맛있는 거 먹기냐!! #n우리도 나눠줘! 으애애애애-!!"
1102-10 = "시끄럽다!! 유치장 안에서는 정숙하라고!!"
1102-11 = "압수한 물품은 일단 범죄에 연루된 게 아닌지 확인한 뒤 돌려드릴 겁니다. #n한 달정도 걸릴 거예요."
1102-13 = "한달이면 곤란한데……!!"
1102-14 = "향기라도 맡을래요, 이즈미 씨?"
1102-15 = "속옷을 건네면서 그런 대사 하지 마……."
1102-16 = "이게 뭔데? 네 팬티 같은 건 흥미 없다고, 아카리."
1102-17 = "모르시는 말씀. 이 속옷으로 말할 거라면…… 무려 그 트뤼플을 감쌌던 것입니다."
1102-19 = "검은 다이아몬드라고 불리는 그 버섯의 향기가 그대로 여기 남아있다고요☆"
1102-23 = "줘! 맡을래!"
1102-25 = "(습-하-습-하-습-하-습-하-습-하-)"
1102-26 = "이게 바로 트뤼플의 향기…… 잊어버리기 전에 뇌에 각인해 둬야해."
1102-28 = "(습-하-습-하-)"
1102-29 = "여긴 제정신인 녀석은 없는 거냐……."
1102-30 = "과연. 맛을 위해서 공부하는 모습이 아름답습니다. 이즈미 씨."
1102-31 = "아니…… 누가 봐도 기분나쁜 변태의 모습이거든……."
1102-32 = "[s] \"안녕, 모두들.\""
1102-33 = "우왓?! 깜짝이야! 선생님?! #n언제부터 있었던 거야?!"
1102-34 = "어머, 선생님은 여기 왜 계신 거예요?"
1102-35 = "분명 또 이상한 짓을 하다가 잡혀온 거겠죠. 정말이지 질리지도 않는 분입니다."
1102-36 = "[s1] \"아냐! 누명을 쓰고 갇혀 있는거라구! 난 억울해!\"\n[s2] \"말하자면 길어…….\""
1102-37 = "다른 사람도 아닌 선생님이 그런 말씀 하니까 엄청 신뢰가 안가는데요☆"
1102-38 = "듣지 않아도 대충 뭔지 알 거 같은데……. 내가 입 밖으로 내진 않겠지만."
1102-41 = "선생님!! 이게 바로 트뤼플의 향기래. 같이 냄새라도 맡자."
1102-42 = "[s3] \"오케이!\"\n[s4] \"그런 제안은 기각.\""
1102-43 = "(습-하-습-하-습-하-습-하-)"
1102-44 = "뭐? 진짜? 이거 엄청 비싼 거랬어. #n샐러리맨 월급으로는 냄새도 못 맡는 거랬는데?"
1102-45 = "[s5] \"그럼 오케이!\""
1102-46 = "(습-하-습-하-습-하-습-하-)"
1102-47 = "(철커덕-)"
1102-48 = "하아. ……선생님. 실례했어. 정말 오해일 줄은 몰랐어."
1102-49 = "누가 학교 수영장에서 알몸으로 수영하고 있다는 신고만으로 선생님을 구금한 건…… #n확실히 내가 좀 성급했던 거 같긴 한데……."
1102-50 = "그러니까 평소에 행실을 잘……"
1102-51 = "[s] \"습-하-습-하-습-하-습-하-……?!\""
1102-52 = "……?!!"
1102-54 = "어때, 선생님? 정말이지 속옷에서 좋은 향기가 나고 있지?"
1102-55 = "……."
1102-56 = "……."
1102-58 = "……."
1102-59 = "[s] \"아, 아냐, 이건 오해다! 네가 생각하는 그런게 아니라…….\""
1102-60 = "변명은 지옥에서 듣지."
1102-61 = "(와장창-!)"
1102-62 = "미식연구회의 기묘한 하루"
