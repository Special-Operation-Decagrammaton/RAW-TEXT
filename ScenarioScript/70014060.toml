70014060-54 = "3;아픈 노인 참새정;00;허허허……. 걱정하지 말게나. 이젠 아주 끄떡없다네."
70014060-55 = "3;아픈 노인 참새정;00;무엇보다 카이가 이렇게 나를 잘 도와주고 있으니 말이야.\n#3;em;[음표]"
70014060-56 = "3;아픈 노인 참새정;00\n1;카이;99;……뭐, 당장은 크게 할 수 있는 일이 없을 뿐이다.\n#1;a\n#3;m5"
70014060-57 = "1;카이;01;무엇보다, 나는 이 집의 소유권을 이전받으려 했던 몸이다만?\n#1;em;[?]"
70014060-58 = "3;아픈 노인 참새정;00;어이쿠, 아직도 그 이야기를 하고 있느냐? 걱정하지 말거라. 그렇게 필요하다면 지금 당장 가져도 좋아.\n#3;em;[재잘]"
70014060-59 = "3;아픈 노인 참새정;00;무얼, 지금까지 어떻게든 살아남아 왔던 몸이다. 이제 와서 어딘가로 간다고 한들, 내 몸 하나 건사하지 못할 것 같으냐."
