[translation]
70014060-1 = "เส้นทางอันสับสนของหมอยา 6"
70014060-2 = "เรียน... งั้นเหรอ?"
70014060-3 = "[ns] \"อื้อ ไคหัวดีนี่นา\""
70014060-4 = ""
70014060-7 = "[ns1] \"เรียนรู้ว่าผู้คนใช้ชีวิตโดยยึดเหนี่ยวอะไรไว้\"\n[ns2] \"เรียนรู้ว่าผู้คนใช้สิ่งใดเป็นรากฐานในการดำเนินชีวิต\""
70014060-10 = "[ns3] \"ทั้งตำราเรียน บทความวิจัย แล้วก็หนังสือต่างๆ\"\n[ns4] \"สิ่งที่มนุษยชาติสั่งสมมาจนก้าวมาถึงจุดนี้\"\n[ns5] \"ยังหลงเหลืออยู่บนโลกนี้มากมายมหาศาลเลย\""
70014060-14 = "จะให้ฉันศึกษาวิถีของ 'คนอื่น' แบบทั่วไปงั้นเหรอ? มาทำเอาป่านนี้เนี่ยนะ?"
70014060-15 = "[s] \"ใช่\""
70014060-16 = "..."
70014060-17 = ""
70014060-19 = ""
70014060-20 = "ฉันรู้ว่ามันคืออะไร อย่างน้อยก็ในเชิงเหตุผล แต่นั่นไม่ใช่วิธีที่ฉันจะทำได้อย่างเป็นธรรมชาติหรอก"
70014060-21 = "ในแง่หนึ่ง ฉันอาจต้องพยายามหายใจต่อไปอย่างสุดกำลัง โดยใช้สมองคอยรับรู้กระบวนการหายใจนั้น#nทีละขั้น..."
70014060-22 = "ต่อให้กระบวนการหายใจนั้น สำหรับคนอื่นแล้วมันจะเป็นกระบวนการแสนธรรมชาติที่ติดตัวมาตั้งแต่เกิด#nก็ตาม..."
70014060-23 = "ครูกำลังบอกให้ฉันใช้สมองท่องจำวิธีนั้น แล้วก็หายใจตามนั้นงั้นเหรอ?"
70014060-24 = "[s] \"ใช่ ตามนั้นเลย\""
70014060-25 = "แล้วถ้าฉันปฏิเสธล่ะ?"
70014060-26 = "ฉันมีเหตุผลอยู่หรอกนะ สำหรับฉันแล้ว กระบวนการนั้นคงไม่ใช่อะไรอื่นนอกจากความเจ็บปวด"
70014060-27 = "ไม่ว่าจะเป็นใคร ทุกคนก็ย่อมมีสิทธิ์ปฏิเสธความเจ็บปวด ใช่มั้ยล่ะ?"
70014060-28 = "[s6] \"ใช่... เพราะงั้นครูถึงบังคับไคไม่ได้\"\n[s7] \"ใช่ แต่ครูก็อยากให้ไคลองทำแบบนั้นดูสักครั้งนะ\""
70014060-31 = "ทำไมกันล่ะ...?"
70014060-32 = "[s] \"เราใช้วิธีซ้ำๆ แล้วหวังผลลัพธ์ที่ต่างออกไปไม่ได้หรอก จริงมั้ย?\""
70014060-33 = "โฮ่"
70014060-34 = "หึหึหึ... คราวนี้ฉันโดนเข้าเต็มๆ เลยสินะ"
70014060-35 = "เอาละ จะขอพูดให้ชัดๆ ไว้อย่างหนึ่งก็แล้วกันนะ ครู"
70014060-36 = "ฉันยังไม่ได้กลับตัว และต่อจากนี้ก็คงไม่เปลี่ยนไป"
70014060-37 = "[s] \"อืม... ครูคิดไว้อยู่แล้วละว่าไม่ใช่เรื่องง่าย\""
70014060-38 = ""
70014060-41 = "[ns] \"แต่ถึงอย่างนั้น ครูก็อยากให้ลองฝึกแบบนั้นดูสักครั้งนะ\""
70014060-42 = "..."
70014060-43 = "งั้นเหรอ"
70014060-50 = "อืม... จะไปแล้วเหรอ?"
70014060-51 = "[s8] \"ใช่ ขอบคุณที่ดูแลเป็นอย่างดีนะคุณยาย\"\n[s9] \"ดูแลรักษาสุขภาพด้วยนะ\""
70014060-54 = "ฮุฮุฮุ... ไม่ต้องห่วงหรอก ตอนนี้ฉันแข็งแรงดีแล้วละ"
70014060-55 = "ที่สำคัญ ไคก็คอยช่วยฉันอย่างดีอยู่แบบนี้ด้วยน่ะ"
70014060-56 = "ก็นะ... แค่ตอนนี้ฉันยังไม่มีอะไรอื่นให้ทำก็เท่านั้นเอง"
70014060-57 = "ที่สำคัญ ฉันเป็นคนที่คิดจะรับโอนกรรมสิทธิ์บ้านหลังนี้อยู่แล้วด้วยนี่?"
70014060-58 = "โธ่ ยังจะพูดเรื่องนั้นอยู่อีกเหรอ? อย่ากังวลไปเลย ถ้าต้องการขนาดนั้น จะเอาไปเดี๋ยวนี้เลยก็ได้"
70014060-59 = "ไม่ต้องห่วงหรอก ฉันก็หาทางเอาตัวรอดมาจนถึงตอนนี้ได้ มาถึงป่านนี้ ต่อให้ต้องไปอยู่ที่ไหน คิดเหรอว่าฉันจะดูแลตัวเองไม่ได้น่ะ"
70014060-60 = ""
70014060-62 = ""
70014060-63 = "ฉันหมดความสนใจแล้วละ... "
70014060-64 = "อื้อ อย่างนั้นสินะ"
70014060-66 = "(คุณครูเดินจากไคกับหญิงชราไป แล้วออกมาจากตลาดมืด)"
70014060-67 = "(พลางครุ่นคิดถึงคำพูดของไค)"
70014060-68 = "(และนึกถึงนักเรียนอีกคนที่น่าเป็นห่วง...)"
70014060-69 = "(แล้วคุณครูก็มุ่งหน้าไปยังชาเล่ต์ด้วยความรู้สึกหนักอึ้งอย่างบอกไม่ถูก)"
70014060-73 = "ถูกปากมั้ย?"
70014060-74 = "ฮุฮุ... ทำอาหารเป็นด้วยสินะ"
70014060-75 = "ก็แค่อาหารสำหรับคนป่วยน่ะ ปกติคนมักเลี่ยงอาหารแบบนี้ เพราะทั้งจืดชืดและก็ไม่มัน"
70014060-76 = "เท่านี้ก็เพียงพอแล้วละ กลับดีเสียอีกที่กินแล้วสบายท้อง"
70014060-77 = "แต่ว่า... ทำไมจู่ๆ ถึงได้มาทำเรื่องแบบนี้ให้ด้วยล่ะ?"
70014060-78 = "ก็... ไม่ใช่เรื่องใหญ่อะไรหรอก แค่..."
70014060-79 = ""
70014060-81 = ""
70014060-82 = "..."
70014060-83 = "คิดว่าจะลองฝึกหายใจเหมือนคนอื่นดู ถือเสียว่าเป็นการเปลี่ยนบรรยากาศน่ะ"
70014060-84 = "แล้วที่นี่ก็เหมือนจะมี <คู่ฝึก> ที่เหมาะอยู่ด้วยนี่นะ"
70014060-86 = "เส้นทางอันสับสนของหมอยา"
