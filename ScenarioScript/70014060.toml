70014060-17 = "#st;[0,0];instant;1;"
70014060-18 = "#clearST"
70014060-19 = "3;카이;99\n#3;em;[한숨]\n#wait;1000"
70014060-20 = "3;카이;05;그게 무엇인지, 적어도 머리로는 알고 있다. 그러나 그 방식은 나에게 자연스러운 방법은 아니다."
70014060-21 = "3;카이;02;………어떤 의미로 나는, 숨을 쉬는 방법을, 머리로 한 단계 한 단계 그 과정을 의식하며, 필사적으로 이어 나가야 하는 것인지도 모른다."
70014060-22 = "3;카이;99;………그 숨을 쉬는 과정이, 다른 사람들에게는 태어나면서부터 주어진, 아주 자연스러운 과정일 터인데도."
70014060-23 = "3;카이;05;선생은 나에게, 그 방법을 머리로 외워 호흡을 하라고 말하는 것인가?"
70014060-24 = "[s] \"맞아. 그 말대로야.\""
70014060-25 = "3;카이;00;내가 그것을 거부한다면?\n#3;em;[음표]"
70014060-26 = "3;카이;03;나에게는 이유가 있다. 그 과정은 나에게 있어 고통 이상도 이하도 아닐 것이니까."
70014060-27 = "3;카이;00;그게 누구이든, 모든 사람에게는 고통을 거부할 권리가 있을 텐데?"
70014060-28 = "[s6] \"……그래. 그래서 나는 카이에게 강요할 수 없어.\"\n[s7] \"하지만 나는, 카이가 한번 그렇게 해 봤으면 좋겠어.\""
