[translation]
70014060-1 = "The Apothecary Wanderings 6"
70014060-2 = "Studying?"
70014060-3 = "[ns] \"Yes. You're smart, Kai.\""
70014060-4 = ""
70014060-7 = "[ns1] \"What people rely on to get through life...\"\n[ns2] \"What we base our lives on, things like that...\""
70014060-10 = "[ns3] \"There are textbooks, as well as academic papers about it all.\"\n[ns4] \"...All that humanity has accumulated to this point.\"\n[ns5] \"There is still so much left to the world.\""
70014060-14 = "Are you telling me to study \"other people's\" typical methods? Now?"
70014060-15 = "[s] \"Correct.\""
70014060-16 = "..."
70014060-17 = ""
70014060-19 = ""
70014060-20 = "I know what they are, at least in theory. But that traditional approach doesn't come naturally to me."
70014060-21 = "...In a sense, it's similar to remembering to keep breathing, consciously going through the process step by step in my mind, as if my life depended on it."
70014060-22 = "...Even though the act of breathing comes naturally to others from the moment they are born."
70014060-23 = "Are you telling me to memorize the old methods and breathe accordingly, Sensei?"
70014060-24 = "[s] \"Yes. Exactly.\""
70014060-25 = "And what if I refuse?"
70014060-26 = "I have reason to. After all, for me, that process would be agony in its purest form."
70014060-27 = "Everyone has the right to refuse to suffer, or am I wrong?"
70014060-28 = "[s6] \"...Yes. That's why I can't force you, Kai.\"\n[s7] \"But I would like it if you gave it a try.\""
70014060-31 = "Why's that...?"
70014060-32 = "[s] \"You can't expect different results with the same methodology, right?\""
70014060-33 = "Ah."
70014060-34 = "Keh heh heh... You've got me there."
70014060-35 = "Let's get one thing straight, Sensei."
70014060-36 = "I haven't been reformed, and I never will be."
70014060-37 = "[s] \"Well... I figured it wouldn't be easy.\""
70014060-38 = ""
70014060-41 = "[ns] \"Still, I'd like you to try being a student at least once.\""
70014060-42 = "..."
70014060-43 = "I see."
70014060-50 = "Oh, are you leaving already?"
70014060-51 = "[s8] \"Yes. Thank you for everything, ma'am.\"\n[s9] \"Please take care of yourself.\""
70014060-54 = "Hahaha... Don't worry. I'm completely fine now."
70014060-55 = "Kai's always a big help, too."
70014060-56 = "...Well, there isn't much for me to do right now."
70014060-57 = "After all, I was trying to take your house, wasn't I?"
70014060-58 = "Oh my, are you still going on about that? Don't worry. If you really need it that badly, you can have it right now."
70014060-59 = "This old body of mine has managed to survive until now. Do you really think I won't be able to take care of myself wherever I go?"
70014060-60 = ""
70014060-62 = ""
70014060-63 = "...I've lost interest. "
70014060-64 = "Oh. I see."
70014060-66 = "I left Kai, the old woman, and the Black Market behind."
70014060-67 = "I mulled over Kai's words."
70014060-68 = "All the while, I thought of another student I was worried about..."
70014060-69 = "With steps that felt strangely heavy, I headed toward Schale."
70014060-73 = "Does it taste all right?"
70014060-74 = "Haha... So you know how to cook, too."
70014060-75 = "It's essentially hospital food. It's bland and low in fat, so people tend to dislike it."
70014060-76 = "It's more than enough. Actually, it's nice because it's so easy on my stomach."
70014060-77 = "But... Why did you do something like this all of a sudden?"
70014060-78 = "Well, it's no big deal. It's only..."
70014060-79 = ""
70014060-81 = ""
70014060-82 = "..."
70014060-83 = "It's merely for a change of pace. I thought I'd try practicing breathing like everyone else."
70014060-84 = "It looks like I've found a good \"test subject\" right here, after all."
70014060-86 = "The Apothecary Wanderings"
