[translation]
70014060-1 = "약사의 방황길 6"
70014060-2 = "공부, 라고?"
70014060-3 = "[ns] \"응. 카이는 머리가 좋으니까.\""
70014060-7 = "[ns1] \"사람들이 무엇을 의지하고 살아가는지.\"\n[ns2] \"어떤 것을 바탕으로 살아가는지, 그런 것들을.\""
70014060-10 = "[ns3] \"교과서도 있고, 논문이나 책도 많고.\"\n[ns4] \"인류가 이 자리에 올 때까지 쌓아 온 것들이.\"\n[ns5] \"세상에는 엄청나게 많이 남아 있으니까.\""
70014060-14 = "일반적인 '타인'의 방식을, 공부해 보라는 것인가? 이제 와서?"
70014060-15 = "[s] \"맞아.\""
70014060-16 = "……."
70014060-20 = "그게 무엇인지, 적어도 머리로는 알고 있다. 그러나 그 방식은 나에게 자연스러운 방법은 아니다."
70014060-21 = "………어떤 의미로 나는, 숨을 쉬는 방법을, 머리로 한 단계 한 단계 그 과정을 의식하며, 필사적으로 이어 나가야 하는 것인지도 모른다."
70014060-22 = "………그 숨을 쉬는 과정이, 다른 사람들에게는 태어나면서부터 주어진, 아주 자연스러운 과정일 터인데도."
70014060-23 = "선생은 나에게, 그 방법을 머리로 외워 호흡을 하라고 말하는 것인가?"
70014060-24 = "[s] \"맞아. 그 말대로야.\""
70014060-25 = "내가 그것을 거부한다면?"
70014060-26 = "나에게는 이유가 있다. 그 과정은 나에게 있어 고통 이상도 이하도 아닐 것이니까."
70014060-27 = "그게 누구이든, 모든 사람에게는 고통을 거부할 권리가 있을 텐데?"
70014060-28 = "[s6] \"……그래. 그래서 나는 카이에게 강요할 수 없어.\"\n[s7] \"하지만 나는, 카이가 한번 그렇게 해 봤으면 좋겠어.\""
70014060-31 = "그건, 어째서……?"
70014060-32 = "[s] \"같은 방식을 반복하면서 다른 결과를 바라면, 안 되잖아?\""
70014060-33 = "호오."
70014060-34 = "쿡쿡쿡……. 이거, 완전히 한방 먹었군."
70014060-35 = "한가지 확실하게 해 두도록 하지. 선생."
70014060-36 = "나는 교정되지 않았으며, 앞으로도 그럴 것이다."
70014060-37 = "[s] \"뭐…… 쉬운 일은 아니라고 생각하고 있었어.\""
70014060-41 = "[ns] \"그래도 그런 연습을, 한번 해 봤으면 해.\""
70014060-42 = "……."
70014060-43 = "그런가."
70014060-50 = "그래, 가려는가?"
70014060-51 = "[s8] \"네. 신세 많이 졌습니다, 어르신.\"\n[s9] \"부디 몸조심하시고요.\""
70014060-54 = "허허허……. 걱정하지 말게나. 이젠 아주 끄떡없다네."
70014060-55 = "무엇보다 카이가 이렇게 나를 잘 도와주고 있으니 말이야."
70014060-56 = "……뭐, 당장은 크게 할 수 있는 일이 없을 뿐이다."
70014060-57 = "무엇보다, 나는 이 집의 소유권을 이전받으려 했던 몸이다만?"
70014060-58 = "어이쿠, 아직도 그 이야기를 하고 있느냐? 걱정하지 말거라. 그렇게 필요하다면 지금 당장 가져도 좋아."
70014060-59 = "무얼, 지금까지 어떻게든 살아남아 왔던 몸이다. 이제 와서 어딘가로 간다고 한들, 내 몸 하나 건사하지 못할 것 같으냐."
70014060-63 = "………흥미가 없어졌다."
70014060-64 = "그래. 그렇구나."
70014060-66 = "(카이와 노인을 뒤로 하고, 블랙마켓을 나섰다.)"
70014060-67 = "(카이의 말을 곱씹어 보며.)"
70014060-68 = "(그리고, 걱정되는 다른 한 명의 학생을 생각하며…….)"
70014060-69 = "(어쩐지 무겁게 느껴지는 발걸음으로, 샬레로 향했다.)"
70014060-73 = "입에 맞는가?"
70014060-74 = "허허……. 요리도 할 수 있었구나."
70014060-75 = "환자식 정도다. 보통은 싱겁고 기름기가 없어 기피되는 식단이지."
70014060-76 = "충분하다, 충분해. 오히려 속이 편해서 좋구나."
70014060-77 = "그런데…… 왜 갑자기 이런 일까지 하게 된 게냐?"
70014060-78 = "뭐, 대단한 일은 아니다. 그저."
70014060-82 = "……."
70014060-83 = "기분 전환 삼아, 남들처럼 숨을 쉬는 연습을 해 볼까, 해서."
70014060-84 = "마침 여기에, 좋은 <연습 상대>도 있는 듯하니 말이야."
70014060-86 = "약사의 방황길"
