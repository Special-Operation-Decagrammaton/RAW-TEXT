[translation]
70014060-1 = "藥師的徬徨（６）"
70014060-2 = "你說……學習？"
70014060-3 = "[ns] 「嗯。因為誡的頭腦很好。」"
70014060-4 = ""
70014060-7 = "[ns1] 「人們是依靠著什麼活下去。」\n[ns2] 「是以什麼為基礎活下去之類的事。」"
70014060-10 = "[ns3] 「有教科書，也有很多論文和書籍。」\n[ns4] 「人類走到今天這一步所累積下來的東西。」\n[ns5] 「在這個世上留下了非常非常多。」"
70014060-14 = "你要我學習一般「他人」的方式嗎？事到如今？"
70014060-15 = "[s] 「沒錯。」"
70014060-16 = "……"
70014060-17 = ""
70014060-19 = ""
70014060-20 = "至少在理性層面，我能夠理解那是什麼。#n然而那種方式，對我來說並不自然。"
70014060-21 = "……某種意義上，我或許必須在腦中一步一步意識著呼吸的方法，拚命地持續下去。"
70014060-22 = "……明明那呼吸的過程，對其他人而言是與生俱來、極其自然的過程。"
70014060-23 = "老師是要我用腦袋背下那個方法來呼吸嗎？"
70014060-24 = "[s] 「沒錯。就是這樣。」"
70014060-25 = "要是我拒絕呢？"
70014060-26 = "我有我的理由。因為那個過程對我來說只是痛苦而已。"
70014060-27 = "無論是誰，應該都有拒絕痛苦的權利吧？"
70014060-28 = "[s6] 「……是啊。所以我無法強迫誡。」\n[s7] 「但是，我希望誡能試著那麼做一次。」"
70014060-31 = "那是，為什麼……？"
70014060-32 = "[s] 「重複同樣的方式卻期盼不同的結果──這樣是不對的吧？」"
70014060-33 = "哦……"
70014060-34 = "咯咯咯……這下真是被你將了一軍呢。"
70014060-35 = "不過老師，有件事我得先跟你說清楚。"
70014060-36 = "我並沒有被矯正，往後也同樣如此。"
70014060-37 = "[s] 「嗯……我本來就覺得這不是件容易的事。」"
70014060-38 = ""
70014060-41 = "[ns] 「即便如此，我還是希望你能試著做一次那樣的練習。」"
70014060-42 = "……"
70014060-43 = "這樣啊。"
70014060-50 = "怎麼，你要離開了嗎？"
70014060-51 = "[s8] 「是的。這段時間承蒙照顧了。」\n[s9] 「還請務必保重身體。」"
70014060-54 = "呵呵呵……別擔心。現在我的身體硬朗得很。"
70014060-55 = "況且還有誡這麼用心地照顧著我啊。"
70014060-56 = "……只是暫時沒什麼事可做罷了。"
70014060-57 = "而且我可是打算把這房子的所有權奪過來的人哦？"
70014060-58 = "哎呀，還在說那件事嗎？別擔心。#n要是那麼需要，現在馬上拿去也行。"
70014060-59 = "沒什麼大不了的。我可是用這副身子活到了今天。#n事到如今就算要去其他地方，還怕顧不了自己這把老骨頭嗎？"
70014060-60 = ""
70014060-62 = ""
70014060-63 = "……已經沒興致了。"
70014060-64 = "這樣啊。"
70014060-66 = "（告別誡和老人，離開了黑市）"
70014060-67 = "（一邊反覆咀嚼著誡說的話）"
70014060-68 = "（一邊想著另一位令人掛心的學生……）"
70014060-69 = "（拖著莫名沉重的腳步，朝夏萊走去）"
70014060-73 = "合你的口味嗎？"
70014060-74 = "哎呀……原來你還會做菜啊。"
70014060-75 = "也就病人餐的程度而已。#n一般都會因為清淡又缺乏油脂而不受待見。"
70014060-76 = "這樣已經很夠了。對腸胃友善反而更好。"
70014060-77 = "不過……你為什麼突然連這種事都想做？"
70014060-78 = "沒什麼大不了的。只是……"
70014060-79 = ""
70014060-81 = ""
70014060-82 = "……"
70014060-83 = "想說換個心情，試著練習像別人一樣呼吸。"
70014060-84 = "正好這裡似乎也有個不錯的「練習對象」呢。"
70014060-86 = "藥師的彷徨"
