70014060-7 = "[ns1] \"사람들이 무엇을 의지하고 살아가는지.\"\n[ns2] \"어떤 것을 바탕으로 살아가는지, 그런 것들을.\""
70014060-8 = "#wait;1000"
70014060-9 = "#wait;1000"
70014060-10 = "[ns3] \"교과서도 있고, 논문이나 책도 많고.\"\n[ns4] \"인류가 이 자리에 올 때까지 쌓아 온 것들이.\"\n[ns5] \"세상에는 엄청나게 많이 남아 있으니까.\""
