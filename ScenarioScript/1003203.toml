[translation]
1003203-1 = "새해에는 새해다운 일을!"
1003203-3 = "(무츠키와 만나기로 약속한 새해맞이 행사장은 수많은 인파로 가득했다.)"
1003203-8 = "앗, 선생님! 여기야. 여기."
1003203-9 = "용케 늦지 않게 나왔네~ 또 꼼짝없이 일 때문에 늦지 않을까~ 하고."
1003203-10 = "훌쩍훌쩍. 걱정하고 있었는데~"
1003203-11 = "[s] \"무츠키와 약속했으니까. 늦을 순 없지.\""
1003203-12 = "아하핫,"
1003203-13 = "그래~? 흐응~"
1003203-14 = "그건 그렇고 새해라 그런지, 사람이 무지 많네~"
1003203-15 = "후아암~ 이거 벌써 조금 질려버렸을지도~?"
1003203-16 = "[s] \"오자마자 바로?!\""
1003203-17 = "쿠흐흣, 농담이야~ 그럼 바로 안쪽으로 가볼까?"
1003203-18 = "응? 아아~ 여기에 온 이유가 뭐냐고?"
1003203-19 = "그야 모모톡으로 말한 것처럼 소원을 빌려고 온 거야. 이 행사장은 특히 귀여운 에마가 유명한 모양이라~"
1003203-20 = "모처럼의 새해니까. 조금은 새해다운 이벤트를 즐겨볼까~? 싶어서?"
1003203-24 = "자아, 이러고 있지 말고. 얼른 가자. 선생님!"
1003203-30 = "(그 뒤로 무츠키에게 이끌려 우리는 함께 행사장의 내부로 향했다.)"
1003203-34 = "으음……."
1003203-38 = "으으음~~"
1003203-39 = "으으으~ 답~답~해~!"
1003203-40 = "……아, 차라리, 여길 폭탄으로 다 날려버리면 속이 시원해지려나?"
1003203-41 = "[s] \"그건 참자! 무츠키!\""
1003203-42 = "아하~ 선생님도 참. 이런 건 농담인 게 당연하잖아~"
1003203-43 = "아무리 나라고 해도 때와 장소는 가린단 말이야~"
1003203-47 = "아니……. 오히려, 지금이야말로 가장 필요한 상황일지도?"
1003203-48 = "[s] \"조, 조금만 더 가면 되니까!\""
1003203-49 = "(그런 식으로 어떻게든 무츠키를 달래주고 있을 때였다.)"
1003203-50 = "실례합니다~"
1003203-51 = "아……."
1003203-52 = "[s] \"무츠키, 위험해!\""
1003203-60 = "아, 선생님."
1003203-61 = "[s] \"괜찮아? 넘어져서 다치진 않았고?\""
1003203-62 = "나, 난 괜찮은데. 그게……. 으음……."
1003203-63 = "계속 그렇게 손을 꼬-옥 잡고 있으면……."
1003203-64 = "쿠흐흣, 혹시 선생님. 이걸 핑계로, 나랑 찐-하게 가까이 붙고 싶은 걸까~?"
1003203-69 = "아하하~ 그렇게 당황할 건 없는데~"
1003203-70 = "응, 하지만~ 선생님 덕분에 짜증은 조금 풀렸으려나."
1003203-71 = "물론 아까 날 밀치고 간 사람에게, 폭탄을 선물해주면 더 개운해질 것 같지만?"
1003203-72 = "[s] \"그, 그건 참아주세요.\""
1003203-73 = "쿠흐흣,"
1003203-74 = "앗! 다음이 우리 차례야. 선생님!"
1003203-79 = "여기 에마에 소원을 써서 저기에 걸면 된대."
1003203-80 = "그럼 자~ 각자 소원을 적어볼까?"
1003203-81 = "[s1] (소원이라면, ……올해만큼은 평화롭기를.)\n[s2] (소원이라면, 역시 올해는 즐거운 이벤트가 가득하기를.)"
1003203-82 = "응? 선생님. 소원 다 썼어?"
1003203-83 = "후후……."
1003203-87 = "그럼 뭘 썼는지, 보여줘!"
1003203-88 = "[s3] \"자, 잠깐. 무츠키?!\""
1003203-89 = "오늘 이렇게 선생님을 데리고 온 이유는! 선생님이 무슨 소원을 비는지. 그걸 알아내기 위한 거였다구~?"
1003203-90 = "내 손에서 벗어날 순 없어~!"
1003203-91 = "이얍. 야압~! 아하하!"
1003203-96 = "어디어디~ 선생님의 소원이 뭔지 볼까아~?"
1003203-100 = "응……? 올해만큼은, 평화롭기를?"
1003203-101 = "……재미없어~"
1003203-102 = "아아~ 선생님이라면 좀 더 세속적이고, 음험하고~"
1003203-103 = "욕망에 충실한 소원을 쓰지 않을까~ 하고 좀 기대했었는데. 이래서야~ 실망이야. 선생님."
1003203-104 = "[s4] \"그쪽이 더 실망스러운 게 아니라……?\""
1003203-105 = "그을~쎄?"
1003203-106 = "응? 선생님. 소원 다 썼어?"
1003203-107 = "후후……."
1003203-111 = "그럼 뭘 썼는지, 보여줘!"
1003203-112 = "[s5] \"자, 잠깐. 무츠키?!\""
1003203-113 = "오늘 이렇게 선생님을 데리고 온 이유는! 선생님이 무슨 소원을 비는지. 그걸 알아내기 위한 거였다구~?"
1003203-114 = "내 손에서 벗어날 순 없어~!"
1003203-115 = "이얍. 야압~! 아하하!"
1003203-120 = "어디어디~ 선생님의 소원이 뭔지 볼까아~?"
1003203-124 = "응……? 올해는 즐거운 이벤트가 가득하기를, 이라니."
1003203-125 = "뭐야~ 선생님. 흐응~~ 그런 소원을 가지고 있었구나~"
1003203-126 = "즐거운 이벤트라~ 어떤 이벤트를 말하는 거려나~"
1003203-127 = "으음~ 나 같이 귀여운 아이랑 이렇게, 저렇게-"
1003203-128 = "잔뜩 꺄아~ 후후! 하게 되는, 그런 걸 기대하는 거야?"
1003203-129 = "[s6] \"……네?\""
1003203-130 = "으응~ 그런 게 소원이라면, 확, 내가 이루어줄까~?"
1003203-131 = "……뭐. 농담이지만☆"
1003203-132 = "아하하핫! 혹시 기대했어? 응~? 선생님, 잔뜩 기대했으려나~? 뭐어, 아쉽게도 유감이지만~!"
1003203-133 = "[s] \"잠깐, 그럼 반대로 무츠키의 소원은 뭐야?\""
1003203-134 = "응……? 내 소원?"
1003203-135 = "으응~ 난 딱히 그런 게 없달까~ 봐, 에마에도 아무것도 안 적었다구?"
1003203-136 = "쿠후흣. 오늘 여기 온 건, 그냥 선생님이 어떤 소원을 빌려나~ 궁금해서 장난삼아 와봤던 거뿐이고~"
1003203-137 = "[s] \"그럼 무츠키의 소원, 대신 써줄게.\""
1003203-138 = "어?"
1003203-139 = "아니, 그럴 필요 없는데? 내 소원 같은 건, 아무래도 좋잖아?"
1003203-140 = "아하핫, 애당초 난 딱히 소원 같은 게 있지도 않고."
1003203-144 = "[ns] \"자, 그럼 여기에 쓴다?\""
1003203-145 = "응? 저기, 선생님……? 그렇게 진지하게 반응해도 곤란하달까."
1003203-152 = "[ns7] \"이런 소원은 어때?\"\n[ns8] \"소중한 사람들과 오래오래 함께하게 해주세요! 같은……!\""
1003203-153 = "아……. 선생님……."
1003203-154 = "아……. 선생님……."
1003203-155 = "그렇게나 진지한 얼굴로, 날 위해……."
1003203-156 = "그런……. 그런……."
1003203-157 = "[s] \"……그런?\""
1003203-161 = "푸, 흡. 크후훗, 아하하핫!"
1003203-162 = "그런 부끄러운 이야기를. 나도 모르게 빵 터졌잖아! 아하하핫!"
1003203-163 = "우와아~ 선생님. 아무렇지도 않은 얼굴로… 그런 부끄러운 말을 잘도 하는구나! 쿠흐흐흣! 엄청 웃겨!"
1003203-164 = "[s] \"방금, 그렇게 부끄러운 소리였어……?\""
1003203-165 = "아하하핫! 진짜! 배, 배 아파! 푸흐흣!!"
1003203-166 = "응! 선생님은, 정말 천연에 고단수네!"
1003203-167 = "이번엔……. 한 방 먹었으려나?"
1003203-168 = "아! 재밌다!"
1003203-169 = "이번엔 선생님의 역공에, 뭐, 내가 져버린 셈이지만! 다음번엔 이런 식으로 넘어가지 않을 거니까!"
1003203-170 = "다음엔 선생님을 잔뜩 당황시켜서! 내가 이겨줄게!"
1003203-171 = "그러니 나중에 보자. 선생님!"
1003203-176 = "[ns9] \"이기고 지는 기준을 모르겠어…….\"\n[ns10] \"그보다……. 그렇게 이상한 소리였어?\""
1003203-180 = "(그렇게 즐거운 듯, 저 멀리 사라지는 무츠키를 얌전히 배웅했다.)"
