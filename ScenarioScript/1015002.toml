[translation]
1015002-1 = "#title;호기심 많은 범고래"
1015002-3 = "#na;(샬레의 업무 차, 오디세이아 학원을 방문한 어느 날.)"
1015002-4 = "#na;(일정 사이에 잠깐 남는 시간이 생겨, 부둣가의 볕이 잘 드는 벤치에 앉아 해바라기를 하기로 했다.)"
1015002-5 = "#na;(단조로운 파도소리와 따듯한 볕이 기분 좋게 내리쬔 탓에 졸음이 몰려오기 시작했다……)"
1015002-6 = "#st;[0,0];instant;1;"
1015002-11 = "#na;(시간이 얼마나 지났을까……)"
1015002-12 = "#st;[0,0];instant;1;"
1015002-15 = "#na;???;흐음……"
1015002-16 = "#st;[0,0];instant;1;"
1015002-18 = "3;코토네;S2_00\n#3;h\n#3;closeup\n#wait;2000"
1015002-19 = "[ns] \"우, 우왓……?!\""
1015002-20 = "3;코토네;S2_02;아아, 선생님이었구나.\n#3;em;[반응]\n#3;closeup"
1015002-21 = "3;코토네;S2_01;내가 즐겨 앉던 벤치에 다른 사람이 앉아 있기에, 누군가 했었네.\n#3;closeup"
1015002-22 = "[s1] \"코, 코토네?\"\n[s2] \"방금 바로 앞에서…… 뭐하던 중이었어?\""
1015002-25 = "3;코토네;S2_01;응? 뭐하는 중이긴. 벤치에 앉아 있는 게 누구인지 얼굴을 살펴보던 중이었는데.\n#3;closeup"
1015002-26 = "3;코토네;S2_02;그렇게 가까이서 얼굴을 살필 필요가 있었냐고?\n#3;em;[?]\n#3;closeup"
1015002-27 = "3;코토네;S2_99;하지만 나는 눈이 나빠서 이 정도로 가까이서 관찰하지 않으면 얼굴이 잘 보이지 않는 걸.\n#3;closeup\n#3;em;[한숨]"
1015002-28 = "3;코토네;S2_02;안경을 이 근처에 두었던가……\n#3;closeup"
1015002-29 = "#st;[0,0];instant;1;"
1015002-31 = "3;코토네;S2_01\n#3;stiff\n#3;closeup\n#wait;2000"
1015002-32 = "3;코토네;99\n#3;greeting\n#3;closeup\n#wait;1000"
1015002-33 = "3;코토네;02;……됐다.\n#3;closeup"
1015002-34 = "#st;[0,0];instant;1;"
1015002-36 = "3;코토네;02\n#3;closeup\n#3;d\n#wait;1000"
1015002-37 = "3;코토네;01\n#3;greeting\n#3;a\n#wait;1000"
1015002-38 = "[ns] \"눈을 떴더니 바로 앞에 얼굴이 있어서 깜짝 놀랐어.\""
1015002-39 = "3;코토네;02;그게 그렇게 놀랄만한 일인가?\n#3;em;[?]"
1015002-40 = "3;코토네;99;그러고 보니 다른 학생들도 안경을 쓰고 있지 않을 때 얼굴을 가까이 들이밀면 당황해하던데……"
1015002-41 = "3;코토네;04;사람들은 이 정도의 거리감에서 부담을 느끼는 걸까."
1015002-42 = "3;코토네;00;곤란하네. 언제나 안경을 쓰고 다닐 수도 없고.\n#3;em;[한숨]"
1015002-43 = "[s] \"왜? 안경을 쓸 수 없는 이유라도 있어?\""
1015002-44 = "3;코토네;01;하지만 다이빙부의 특성상 갑자기 잠수를 해야할 때가 많아서."
1015002-45 = "3;코토네;02;안경을 쓰고 다니면 여러모로 귀찮은 경우가 많거든."
1015002-46 = "[s3] \"그러고보니 잠수할 때는 안경을 쓰지 못할텐데……\"\n[s4] \"그 시력이면 물 속에서 너무 위험하지 않아?\""
1015002-49 = "3;코토네;03;괜찮아. 물 속에서는 시력 이외의 다른 감각도 사용할 수 있으니까.\n#3;em;[음표]"
1015002-50 = "[s] \"다른 감각이라면……?\""
1015002-51 = "3;코토네;02;예를 들면, 피부로 느껴지는 해수의 흐름이나 수온도 주변의 환경을 판단하는 중요한 수단이 되지만……"
1015002-52 = "3;코토네;03;물 속에서 가장 위협을 감지하기 쉬운 수단은 소리야."
1015002-53 = "3;코토네;03;물은 공기에 비해 밀도가 높기 때문에 소리가 더 멀리 퍼져나가거든."
1015002-54 = "3;코토네;02;그렇기 때문에 물 속에서 귀를 기울이면 주변에서 일어나는 일들을 쉽게 알아차릴 수 있어."
1015002-55 = "3;코토네;03;물론 익숙해지려면 어느 정도 훈련이 필요하겠지만."
1015002-56 = "[s5] \"물 속에서 귀를 기울일 생각은 한 적 없었는데……\"\n[s6] \"물 속에서는 어떤 소리가 들릴지 흥미가 생기네.\""
1015002-59 = "3;코토네;99;음……\n#3;em;[…]"
1015002-60 = "3;코토네;02;선생님. 내가 물 속에서 녹음한 소리가 있는데 한 번 들어볼래?\n#3;greeting"
1015002-61 = "3;코토네;00;선생님도 이런 소리에 익숙해진다면, 물 속에서의 위협을 회피하는 데 도움이 될지도 몰라."
1015002-62 = "[s] \"좋아. 바로 들려줘!\""
1015002-63 = "3;코토네;03;응. 첫 번째 소리를 들려줄게."
1015002-67 = "3;코토네;00\n#3;a"
1015002-68 = "3;코토네;00;무슨 소리처럼 들려?"
1015002-69 = "[s7] \"둔탁한 엔진 소리……?\"\n[s8] \"뭔가 거대한 기계 장치의 소리 같은데……\""
1015002-72 = "3;코토네;03;맞아. 이건 물 속에서 들은 배의 엔진 소리야.\n#3;em;[음표]"
1015002-73 = "3;코토네;02;이런 엔진 소리가 가까이서 들린다면 수면 위에 배가 지나가고 있을 가능성이 높으니까, 부상할 때는 주의하는 게 좋지."
1015002-74 = "3;코토네;00;다음은 두 번째 소리야.\n#3;greeting"
1015002-77 = "3;코토네;00\n#3;a"
1015002-78 = "[ns9] \"뭔가 코끼리 울음 소리 같기도 하고……\"\n[ns10] \"이거, 혹시 고래의 울음 소리야?\""
1015002-79 = "3;코토네;03;비슷하긴 하지만, 이건 고래의 울음 소리야."
1015002-80 = "3;코토네;03;맞아. 이건 혹등고래의 울음 소리야."
1015002-81 = "3;코토네;99;고래의 울음 소리는 뭔가 슬픈 느낌도 들고, 바닷속에 들으면 오싹한 기분도 들지만…… \n#3;em;[…]"
1015002-82 = "3;코토네;03;대부분의 고래는 무해한 생물이기 때문에 이 소리를 듣더라도 그렇게 걱정할 필요는 없어."
1015002-83 = "3;코토네;02;사실 고래를 포함한 대부분의 바다 생물들은 사람이 먼저 건드리지 않는 한, 공격하는 경우는 거의 없어."
1015002-84 = "3;코토네;05;……다들 미지의 해양 생물을 막연히 두려워하지만, 바닷속에서 가장 위험한 생물은 어쩌면 인간일지도 모르지."
1015002-85 = "3;코토네;99;마지막으로 세번째 소리는……"
1015002-86 = "#st;[0,0];instant;1;"
1015002-88 = "3;코토네;11\n#3;h\n#3;stiff\n#wait;2000"
1015002-89 = "3;코토네;12;미안, 방금 그건 다른 소리였어.\n#3;em;[///]"
1015002-90 = "3;코토네;16;……오늘 오전 다이빙을 마친 뒤 아무것도 먹지 못했더니……\n#fontsize;50"
1015002-91 = "[s] \"배고픔도 성장기의 학생에게는 중대한 위협이긴 하지.\""
1015002-92 = "#st;[0,0];instant;1;"
1015002-95 = "[ns11] \"우선은 식사부터 하고 올까?\"\n[ns12] \"뭔가 먹고 싶은 거라도 있어?\""
1015002-98 = "3;코토네;11\n#3;em;[...]\n#wait;2500"
1015002-99 = "3;코토네;12;……포케.\n#3;stiff"
1015002-100 = "3;코토네;11;날 생선이 잔뜩 들어간 포케가 좋아."
1015002-101 = "[s] \"좋아. 그럼 바로 가볼까?\""
1015002-103 = "#na;(이후, 항만에 위치한 포케 가게에서 참치회가 듬뿍 들어간 포케를 먹으며 코토네와 즐거운 시간을 보냈다.)"
