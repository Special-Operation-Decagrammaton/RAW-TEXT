[translation]
1008002-1 = "멘탈 아웃"
1008002-2 = "(상점가로 나가 보니, 고급스러운 카페 한쪽에 앉아 있던 쇼쿠호의 모습이 보였다.)"
1008002-6 = "……어라, 선생님?"
1008002-7 = "별일이네, 이런 데에서 다 마주치고."
1008002-8 = "연이어 좋은 일들이라……. 오늘은 꽤 운이 좋을지도?"
1008002-9 = "[s1] \"운……?\"\n[s2] \"연이어 좋은 일들?\""
1008002-12 = "뭐-. 그렇지? 마침 날도 좋고……."
1008002-13 = "마침 괜찮은 유기농 카페도 찾았고,"
1008002-14 = "마침 부르려던 사람도 알아서 찾아왔고."
1008002-15 = "이 정도면 꽤 운이 좋다고 봐야 하지 않겠어? 선생님에게는 어떨지 모르겠지만 말이야."
1008002-16 = "……마찬가지로 좋다고? 흐응-."
1008002-20 = "확인하기가 쉽지 않은 상황이라 그런지 뭔가 시큰둥해지네. 뭐, 선생님은 꽤 신뢰할 수 있어 보이니 그런 걸로 해 둘게."
1008002-21 = "……응? '확인한다'는 게 무슨 의미냐고? 문자 그대로지?"
1008002-22 = "지금은 좀 문제가 있지만, 원래라면 만나는 사람마다 모두 한 번씩 체크하고 들어가니까."
1008002-23 = "무슨 생각을 하는지, 어떤 사상을 가지고 있는지."
1008002-24 = "최소한 '확실한 사람'인지 어떤지. 머릿속을 한 번 쭉 훑어본 뒤에 어떻게 대할지를 정하는 타입이거든."
1008002-25 = "여기서는……. 유감스럽게도 잘 안 되고 있지만 말이지. 정말이지 큰일이라니까."
1008002-26 = "……물론 정말로 작정하고 집중하면, 못 할 것까지는 없겠지만……."
1008002-30 = "……흐응?"
1008002-31 = "그건 무슨 얼굴일까? 선생님, 혹시 경계하고 있다든가?"
1008002-32 = "[s3] \"아니. 조금 불편하겠다고 생각하고 있었어.\"\n[s4] \"하던 대로 안 되는 곳은 역시 어색하겠지.\""
1008002-35 = "……어라라-."
1008002-36 = "역시 경계하고 있지는 않나 보네. 뭐, 그런 예측력은 있었지만."
1008002-37 = "응? ……믿어줘서 고맙다고?"
1008002-38 = "좋아서 하는 신뢰는 아니니까 그렇게까지 말해 줄 필요는 없는데. 상황이 상황이라 그런 것뿐이고?"
1008002-39 = "그저 처해진 상황 안에서 나름대로 최선의 선택을 하고 있을 뿐이고."
1008002-40 = "……너무 딱딱한 이야기일까?"
1008002-41 = "[s5] \"아니. 그걸로도 충분해.\"\n[s6] \"이미 많이 양보하고 있다고 생각해.\""
1008002-44 = "……재미없을 정도로 사람이 좋은 편이네, 선생님은."
1008002-49 = "오히려 이쯤 되니 다른 의미로 확인하고 싶어지는데……. 역시 한 번은 읽어보는 것도 나쁘지 않으려나?"
1008002-50 = "……응?"
1008002-51 = "환영이라고? 오히려 암시 하나를 걸어줄 수 있냐고?"
1008002-52 = "그건 무슨 이야기일까? 방금은 살짝 당황했을지도."
1008002-53 = "조금 의문력이 오르는 느낌인데……. 일단 들어나 볼까."
1008002-54 = "응? '업무 마감이 얼마 남지 않았는데 자꾸 일이 싫어서 도망친다'고……?"
1008002-55 = "……그래서?"
1008002-56 = "'일이 좋아지는 암시를 걸어 두면 남은 업무를 처리할 때 행복할 수 있지 않을까……?'"
1008002-62 = "……선생님."
1008002-63 = "아까 전 말은 취소해야 할지도 모르겠는걸. 좋은 사람이라고 생각했더니, 그냥 바보였을까나."
1008002-64 = "아니면 일부러 그러는 걸까나……. 어느 쪽인지는 모르겠지만."
1008002-65 = "그래도 어른이면 어른답게, 그 정도의 일은 스스로 하라고."
1008002-66 = "정말이지. 내 능력을 그런 식으로 써 달라고 요구한 건 선생님이 처음이라고."
1008002-67 = "…………."
1008002-68 = "안 되는 건 안 되는 거야☆ 된다고 해도 그런 용도로는 쓰고 싶지도 않고."
1008002-69 = "음……. 뭐, 그래도……."
1008002-70 = "이왕 이런 상황의 나를 도와준 빚은 갚아야 하니……."
1008002-71 = "[s7] \"앗, 설마…….\"\n[s8] \"이번만큼은……?\""
1008002-74 = "……."
1008002-75 = "설마-. 그럴 리가 없잖아?"
1008002-76 = "자. 여기 잠 깨는 데에 좋은 유기농 주스가 있으니, 이거라도 마시라고."
1008002-77 = "그럼……."
1008002-83 = "잔업 힘내, 선생님."
