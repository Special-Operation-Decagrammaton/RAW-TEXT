10053020-190 = "คิดว่าแม้แต่ผู้ติดตามแชนแนลของฉันก็ไม่น่าจะมีใครรู้เรื่องราวเบื้องหลังแบบนี้เสียอีก..."
10053020-191 = "...!"
10053020-192 = "อย่างนี้สินะ เธอเองก็เป็นผู้เชี่ยวชาญที่มีทฤษฎีเป็นของตัวเองเหมือนกันนี่เอง..."
10053020-193 = "ดีเลย งั้นฉันจะยอมรับการแข่งขันครั้งนี้!"
