10053020-197 = "ฉันคิดว่าวิทยาศาสตร์ดั้งเดิมก็ยังมีหวังอยู่นะ ก็ความเป็นไปได้ของชีวิตไม่มีที่สิ้นสุดนี่นา"
10053020-198 = "นี่ต้องเป็นการสำรวจที่น่าสนใจมากเลยละ เพราะเราจะได้รู้กันว่าการตีความของใครจะใกล้เคียง#nความจริงมากกว่ากัน!"
