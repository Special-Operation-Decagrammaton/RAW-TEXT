10053020-195 = "ส่วนรูปลักษณ์ที่ไม่เป็นธรรมชาตินั่นน่ะ เกิดจากการเลียนแบบสิ่งมีชีวิตพื้นเมืองอย่างไม่ลงตัวในสภาพ#nแวดล้อมที่มีแรงโน้มถ่วงแตกต่างกัน แล้วความคล่องตัวอันเป็นเอกลักษณ์กับลักษณะที่หลบหลีกได้ยาก ก็ตอบโจทย์หน้าที่หลักในการสำรวจของโดรนด้วย"
