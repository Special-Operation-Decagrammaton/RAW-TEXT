[translation]
10053020-1 = "第2話;那種設定的少女"
10053020-2 = "為什麼老師在這裡！？"
10053020-3 = "[s1] 「玲奈才是為什麼！？」\n[s2] 「你為什麼會在這裡！？」"
10053020-6 = "什麼為什麼，當然是申請外出，獲得許可後出來的啊。"
10053020-7 = "……啊，我大概知道學校裡在傳些什麼傳聞了。"
10053020-8 = "但狂獵並沒有把學生關起來什麼的哦？"
10053020-9 = "雖然外出手續是有點麻煩……"
10053020-10 = "咦？老師，難道你認識「Guruming」？"
10053020-11 = "[s3] 「嗯，非常熟。」\n[s4] 「是有前世因緣的後輩。」"
10053020-14 = "呃，那是什麼關係啊？"
10053020-15 = "嚇啊──！不要接這個話題！情況只會變得更麻煩！"
10053020-16 = "比起這個，老師為什麼在這裡！？"
10053020-17 = "不是說好我們三個人去找槌之子的嗎？"
10053020-18 = "啊，抱歉～忘了說老師也會來。"
10053020-19 = "但不管怎樣人多比較有趣嘛？"
10053020-20 = "不要用那種現充邏輯強迫人妥協好嗎……"
10053020-21 = "老師跟「Guruming」……玲奈好像都認識了，那就不介紹了。"
10053020-22 = "那就，嗯～"
10053020-30 = "……"
10053020-35 = "[ns5] 「為什麼伸出手指……？」\n[ns6] 把手指對上。"
10053020-36 = "……心電感應失敗了嗎。"
10053020-37 = "看來和老師的頻率不太合。"
10053020-41 = "……！"
10053020-42 = "果然！老師和我有著同樣的氣場。"
10053020-47 = "很高興見到你，還有歡迎你。"
10053020-48 = "我的名字是羽咋翼，是這個探險隊的隊長，也經營著「某超自然研究所」。"
10053020-49 = "稱呼我的時候，希望可以稱呼我為翼所長。"
10053020-50 = "[ns7] 「所長……？」\n[ns8] 「呃，玲奈……？」"
10053020-55 = "我知道你在想什麼……但是他並沒有想像中那麼奇怪。"
10053020-56 = "他只是在說網路直播的事，「某超自然研究所」是他經營的頻道名稱。"
10053020-57 = "也就是「那種設定」。"
10053020-58 = "說什麼設定，聽著真難過，玲奈君。"
10053020-59 = "我們研究所是根據科學方法討論並調查超自然現象，奇普托斯獨一無二的團體。"
10053020-60 = "不是團體吧，就你一個人。"
10053020-61 = "那，那是因為……有一些複雜的大人的原因……"
10053020-62 = "總之，老師！希望你不要誤會！"
10053020-63 = "超自然現象並不是偽科學！"
10053020-64 = "唉……又開始了……"
10053020-68 = "超自然現象不僅在奇普托斯真實存在，甚至在我們周圍相當頻繁地發生著。"
10053020-69 = "就在最近，千年那邊也發生了一件大事。老師應該知道吧？"
10053020-70 = "[s]「……！」"
10053020-75 = "呼姆……看你的表情，老師似乎有想到什麼呢。"
10053020-76 = "畢竟鬧得那麼大，不知道才奇怪吧。"
10053020-77 = "對，就是「千年東阿爾卑斯UFO目擊事件」！"
10053020-78 = "[ns9] 「……蛤？」\n[ns10] 「東阿爾卑斯，什麼……？」"
10053020-83 = "根據目擊證詞，黎明時分，白色圓盤形物體被光所包圍，像是無視加速度一樣地自由飛行。"
10053020-84 = "從這裡開始是我的主張，這是非常典型的亞當斯基型UFO目擊案例。"
10053020-85 = "有人因為那種典型性而主張是心理確認偏誤、模仿效應，但我反對這種主張。"
10053020-86 = "UFO是真實存在的！！"
10053020-91 = "所以才會總是出現一致的目擊證詞。"
10053020-92 = "如果可以的話我真想親自去現場嘗試通訊，但可惜的是現在由於某種原因很難自由往來千年內部……"
10053020-93 = "[s11] 「UFO……？通訊……？」\n[s12] 「玲奈……？」"
10053020-96 = "要說他奇怪……是很奇怪啦！但又有點說不通！"
10053020-97 = "怎麼說呢，他和前輩們不一樣有現實的一面，說話也還算能溝通……"
10053020-98 = "不對，我為什麼要幫他說話啊！"
10053020-102 = "雖然看起來是那副德性，但所長在這個業界真的是名人哦。"
10053020-103 = "每天都不間斷地上傳廢墟探險直播。"
10053020-104 = "哪有那種業界，而且也沒那麼有名。"
10053020-105 = "總是在荒廢的建築物裡轉來轉去什麼事都沒發生就結束的直播，觀看數和訂閱者都不多。"
10053020-107 = "[ns13] 「每天在廢墟探險……？」\n[ns14] 「這樣有時間兼顧學業嗎……？」"
10053020-112 = "當，當然有！千年的學生怠慢學業是不可能的事……"
10053020-113 = "……？你是千年的嗎？"
10053020-114 = "咦，我沒說過嗎？"
10053020-115 = "嗯，有點意外……我以為千年的人不會相信這種東西。"
10053020-116 = "這種東西是指？"
10053020-117 = "就是槌之子啊……雪人啊……"
10053020-118 = "還有……魔法之類的。"
10053020-119 = "呼姆，那正是作為千年的學生不能坐視不管的發言呢。"
10053020-120 = "目前被證明的任何理論都不是一開始就被證明的，#n所有命題都是經過科學方法論被解釋、驗證，才成為普遍真理的。"
10053020-121 = "……咦？"
10053020-125 = "也就是說，因為沒有被證明就否定其可能性，等同於否定人類所建立的自然哲學的根基。"
10053020-126 = "況且，即使在被稱為現代科學最前沿的千年，也有像「廢墟」這樣的未知領域。"
10053020-127 = "超自然現象是我們科學家應該解決的課題，而不是應該避諱的東西。"
10053020-128 = "雖然這在保守派的科學家之間被貶低為邪教……"
10053020-133 = "喔，哦哦……果然千年的學生就是不一樣呢。"
10053020-134 = "同樣的話，如果換成是我的前輩們來說就會像是在胡說八道。"
10053020-135 = "別這麼說，在這種探究精神上我們是同伴不是嗎？"
10053020-136 = "畢竟玲奈君也是來找未被證明的槌之子的。"
10053020-137 = "……啊，不是耶。"
10053020-138 = "嗯？"
10053020-142 = "怕你誤會所以我直接說清楚──"
10053020-143 = "我才不相信什麼槌之子！！"
10053020-149 = "[ns15] 「哦哦，是那種設定？」\n[ns16] 「完全理解了。」"
10053020-153 = "等等！你們那是什麼反應啊！？"
10053020-154 = "那倒是我們想問的。"
10053020-155 = "如果不相信槌之子，為什麼參加這次探險？"
10053020-156 = "那當然是因為……"
10053020-161 = "唉……老師應該已經知道了。我的室友們有點特別，該說是神秘學狂熱者吧。"
10053020-162 = "如果他們在SNS上發現什麼槌之子目擊情報之類的，一定會吵個不停。"
10053020-163 = "所以！我要先下手為強！"
10053020-164 = "反正這次的目擊談也不過是看到了長得像蛇或蜥蜴之類的才傳開的吧。"
10053020-165 = "我要找到那個源頭證明那只是謠言，這樣室友們不就會看清現實了嗎？"
10053020-166 = "……雖然我覺得他們不是因為這樣就會清醒的人。"
10053020-167 = "[s17] 「哦哦，是那種設定？」\n[s18] 「完全理解了。」"
10053020-170 = "就說了不是……！"
10053020-175 = "等等。再怎麼說，以那種不純的動機參加是很難允許的。"
10053020-176 = "我們的目的最終還是要查明傳說中的神秘生物槌之子的存在。"
10053020-177 = "對啊對啊！"
10053020-178 = "而且，是為了證明它的真身是外星人的偵察無人機！"
10053020-179 = "……咦？我們是那麼可疑的聚會嗎？"
10053020-181 = "才不是！不要突然加入奇怪的私心！"
10053020-182 = "目的是找到槌之子不是嗎！"
10053020-183 = "……原來如此，對業餘的人來說可能有點難理解吧。"
10053020-184 = "但這不是我編的故事，是學界也在積極研究的課題。"
10053020-185 = "甚至在赤冬的著名學術期刊《新金字塔未來》的最新期也刊載了相關文章。"
10053020-186 = "那是邪教雜誌！"
10053020-187 = "超級邪教雜誌！就是因為被千年所有印刷廠拒絕出版，#n才搬到只要給錢就印的赤冬去的亂七八糟的陰謀論雜誌！"
10053020-188 = "你錯了，那件事的幕後有以主流科學為名控制千年學界的「研討會」──"
10053020-189 = "……嗯？你怎麼這麼清楚？"
10053020-190 = "就連在定期訂閱者中知道內幕的人也很少……"
10053020-191 = "……！"
10053020-192 = "……原來如此，你也是用自身理論來武裝的專家啊。"
10053020-193 = "好，這次的勝負，我接受！"
10053020-194 = "我的主張不變，槌之子是外星人的偵查無人機。"
10053020-195 = "那種不自然的外形是因為在不同重力環境下半吊子地模仿了本土生物。#n特有的機動性和神出鬼沒的面貌正是忠於探測無人機本身功能的表現。"
10053020-196 = "等一下，如果不是蛇就麻煩了……"
10053020-197 = "我認為古典派仍然有可能性，因為生命的可能性是無限的。"
10053020-198 = "到底誰的解釋更接近正確答案，這次的探險會相當有趣呢！"
10053020-203 = "不是，我是說……"
10053020-204 = "唉，算了。反正找槌之子謠言源頭的目的是一樣的。"
10053020-205 = "難道說，奇普托斯的正常人只有我嗎……？"
10053020-206 = "[ns19] 「哦哦，是那種設定？」\n[ns20] 「完全理解了。」"
10053020-211 = "嚇啊──！！所以說！！不要再說了！！"
