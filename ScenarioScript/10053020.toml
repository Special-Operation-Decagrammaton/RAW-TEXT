[translation]
10053020-1 = "제2화;그런 설정의 소녀"
10053020-2 = "뭐, 뭐야?! 선생님이 왜 여기 있어?!"
10053020-3 = "[s1] \"아니, 레나야말로 어째서?!\"\n[s2] \"어떻게 여기에?!\""
10053020-6 = "뭐? 어떻게라니, 그야 당연히 외출 신청해서 허가받고 나왔지."
10053020-7 = "……아, 대충 우리 학교에 대해 어떤 소문이 퍼져 있는지는 아는데."
10053020-8 = "딱히 와일드헌트라고 학생들을 가둬두거나 하지는 않거든?"
10053020-9 = "물론, 절차가 좀 까다롭기는 하지만……."
10053020-10 = "어라? 선생님, 혹시 <구루밍>하고 아는 사이임까?"
10053020-11 = "[s3] \"응, 무척 잘 알아.\"\n[s4] \"전생의 인연의 후배야.\""
10053020-14 = "……? 그게 뭔 관계래?"
10053020-15 = "샤아아악! 아니야! 선생님도, 선배 그거 받아주지 말라고! 진짜 악화된다니까?!"
10053020-16 = "그보다 선생님은 왜 여기 있는 거야?!"
10053020-17 = "분명히 우리 셋이서 츠치노코를 찾으러 가는 거 아니었어?"
10053020-18 = "아, 죄송~ 선생님도 오신다고 말하는 걸 깜빡해서."
10053020-19 = "그래도 뭐든지 사람 많은 편이 재밌잖아?"
10053020-20 = "그런 인싸 논리 강압하지 말라고……."
10053020-21 = "선생님이 <구루밍>…… 레나하고는 아는 사이 같으니까 소개는 생략하겠슴다."
10053020-22 = "그러면, 어~"
10053020-30 = "……."
10053020-35 = "[ns5] \"……? 왜 손가락을 내밀고……?\"\n[ns6] 손가락을 맞댄다."
10053020-36 = "……텔레파시는 실패인가."
10053020-37 = "아무래도 선생님과는 주파수가 잘 맞지 않는 모양이네."
10053020-41 = "……!"
10053020-42 = "역시나! 선생님은 나와 같은 오라를 지니고 있구나."
10053020-47 = "만나서 반가워. 그리고 환영하지."
10053020-48 = "내 이름은 하네모토 츠바사. 이 탐사대의 리더이자, <모 초자연 연구소>를 운영하고 있지."
10053020-49 = "나를 부를 때는, 가급적 츠바사 소장이라 불러줬으면 좋겠네."
10053020-50 = "[ns7] \"연구소장……?\"\n[ns8] \"레나야……?\""
10053020-55 = "아, 무슨 생각하는지는 알겠는데…… 생각보다 이상한 애는 아니야."
10053020-56 = "그냥 인터넷 방송 이야기야. <모 초자연 연구소>는 본인이 운영하는 채널 이름이고."
10053020-57 = "그러니까, '그런 설정'인 거지."
10053020-58 = "설정이라니. 듣기 섭섭하네, 레나 군."
10053020-59 = "우리 연구소는 과학적 방법론에 의거해 초자연 현상을 조사하는 키보토스 유일무이한 단체라고."
10053020-60 = "일단, 단체가 아니잖아. 너 혼자면서."
10053020-61 = "거, 거기에는…… 조금 복잡한 어른의 사정이 있어서……."
10053020-62 = "여하튼, 선생님! 오해하지 않아 줬으면 해!"
10053020-63 = "초자연현상은 비과학이 아니야!"
10053020-64 = "아~ 또 시작이네……."
10053020-68 = "초자연 현상은 이 키보토스에 실재할 뿐만 아니라, 심지어 우리 주변에서 꽤 빈번하게 발생하고 있어."
10053020-69 = "당장 최근에도, 밀레니엄 쪽에서 엄청난 사건이 하나 있었지. 혹시 알고 있을까?"
10053020-70 = "[s] \"……!\""
10053020-75 = "호오…… 그 표정을 보아하니, 선생님은 짐작 가는 부분이 있나 보네."
10053020-76 = "하긴 그렇게나 시끄러웠는데, 모르는 편이 더 이상하겠지."
10053020-77 = "그래, 바로 <밀레니엄 히가시알프스 UFO 목격 사건> 말이야!"
10053020-78 = "[ns9] \"……엥?\"\n[ns10] \"히가시알프스, 뭐요……?\""
10053020-83 = "목격담에 따르면, 새벽 무렵, 백색 원반형 물체가 빛에 감싸인 채로 가속도를 무시하는 듯이 자유 비행하고 있었다고 해."
10053020-84 = "여기서부터는 내 주장이지만, 이건 아주 전형적인 아담스키형 UFO의 목격 사례야."
10053020-85 = "혹자는 그 전형성 때문에 심리적 확증 편향, 모방 효과라고 주장하지만, 나는 주장에 반대해."
10053020-86 = "UFO는 실존한다!!"
10053020-91 = "그렇기 때문에, 항상 일관된 목격담이 나오는 것이라고."
10053020-92 = "마음 같아서는 직접 현장을 방문해 교신 시도를 해보고 싶었지만, 아쉽게도 지금은 모종의 사유로 밀레니엄 내부를 자유롭게 왕래하기 어려워서……."
10053020-93 = "[s11] \"UFO, 교신……?\"\n[s12] \"레나야……?\""
10053020-96 = "이상한 애는…… 맞긴 한데! 미묘하게 달라!"
10053020-97 = "우리 선배들이랑 달리 현실적인 부분이 있달까, 은근히 말이 통한다고 할까……."
10053020-98 = "아니, 내가 왜 쟤 변명을 대신하고 있는지 모르겠는데!"
10053020-102 = "저렇게 보여도, 소장은 이쪽 업계에서 진짜 유명인임다."
10053020-103 = "하루도 빠짐없이 폐가 탐험 방송을 올리고 있지 말임다."
10053020-104 = "아니, 그런 업계 없거든. 심지어 별로 유명하지도 않고."
10053020-105 = "항상 아무 일도 없이 버려진 건물에서 돌아다니다가 끝나는 방송이라, 조회수도, 구독자도 안 나오잖아."
10053020-107 = "[ns13] \"매일, 폐가 탐험을……?\"\n[ns14] \"학업과 병행할 시간이 되려나……?\""
10053020-112 = "무, 물론이지! 밀레니엄 학생이 수학을 게을리한다는 건, 있을 수 없는 일이고……."
10053020-113 = "……? 너 밀레니엄이었어?"
10053020-114 = "어라, 말한 적 없던가?"
10053020-115 = "응, 좀 의외네……. 밀레니엄 애들은, 이런 거 안 믿을 줄 알았는데."
10053020-116 = "이런 거라니?"
10053020-117 = "아니, 그, 있잖아. 츠치노코라든지, 예티라든지……."
10053020-118 = "……마법 같은 거."
10053020-119 = "호오. 그거야말로 밀레니엄 학생으로서 좌시할 수 없는 발언인걸."
10053020-120 = "현재 증명된 어떤 이론도 처음부터 증명되어 있지는 않았어. 모든 명제는 과학적 방법론을 거쳐 해석되고, 검증되어 보편적인 진리로 자리잡은 거야."
10053020-121 = "으, 응?"
10053020-125 = "즉, 증명되지 않았다고, 그 가능성마저 부정하는 것은 인류가 쌓아 올린 자연철학의 근간을 부정하는 것과 마찬가지야."
10053020-126 = "하물며, 현대 과학의 최첨단이라 불리는 밀레니엄에조차 <폐허>처럼 미지의 영역이 남아 있어."
10053020-127 = "초자연 현상은 우리 과학도가 풀어나갈 숙제이지, 터부시해야 할 금기 같은 게 아니야."
10053020-128 = "비록, 보수적인 과학도들 사이에서는 사이비 같은 식으로 폄하되기도 하지만……."
10053020-133 = "오, 오오……. 역시 밀레니엄 학생은 다르구나."
10053020-134 = "똑같은 말도, 우리 선배들이 하면 그냥 헛소리 같은데."
10053020-135 = "그런 탐구심에 있어서 우린 동료잖아?"
10053020-136 = "레나도 결국 증명되지 않은 츠치노코를 찾으러 온 것이고."
10053020-137 = "……아. 그건 아니야."
10053020-138 = "응?"
10053020-142 = "혹시나 착각할까 봐 딱 잘라 말하는데."
10053020-143 = "나는 츠치노코 같은 거 안 믿으니까!!"
10053020-149 = "[ns15] \"아아, 그런 설정?\"\n[ns16] \"완벽하게 이해했어.\""
10053020-153 = "잠깐! 뭐야, 그 반응은?!"
10053020-154 = "그건 도리어 우리가 묻고 싶은데."
10053020-155 = "츠치노코를 믿지 않는다면, 어째서 이번 탐사에 참여한 거지?"
10053020-156 = "그야 당연히……."
10053020-161 = "하아…… 선생님은 이미 알고 있겠지만. 내 룸메들은, 좀 유별난 편이거든. 오컬트광이라고 해야 하나."
10053020-162 = "그런데 만약 SNS에서 츠치노코 목격담이 어쩌니 하는 걸 발견하면, 그거 갖고 얼마나 의기양양하게 굴겠어."
10053020-163 = "그러니까! 내가 먼저 선수 치는 거야!"
10053020-164 = "어차피 이번 목격담도, 기껏해야 좀 닮은 뱀이나 도마뱀 같은 걸 보고 퍼진 걸 테고."
10053020-165 = "그 발원지를 발견해서 헛소문이란 게 어떻게 시작하는지 증명하면, 룸메들도 현실을 좀 보지 않겠어?"
10053020-166 = "……고작 그 정도로 정신 차릴 사람들일까 싶긴 하지만."
10053020-167 = "[s17] \"아아, 그런 설정?\"\n[s18] \"완벽하게 이해했어.\""
10053020-170 = "아니라니깐……!"
10053020-175 = "잠깐. 아무리 그래도 그런 불순한 동기로 참가하는 건 허락하기 어려운데."
10053020-176 = "우리의 목적은 어디까지나 전설 속의 크립티드, 츠치노코의 존재를 규명하는 것."
10053020-177 = "응, 응!"
10053020-178 = "그리고, 그 정체가 외계인의 정찰 드론이라는 사실을 증명하기 위함이니까!"
10053020-179 = "……엥? 우리 그렇게 수상한 모임이었나?"
10053020-181 = "아니야! 갑자기 이상한 사심 끼워 넣지 말라고!"
10053020-182 = "츠치노코를 찾는 게 목적이었잖아!"
10053020-183 = "아, 아아…… 과연. 아마추어에게 조금 어려웠으려나."
10053020-184 = "하지만 이건 내가 지어낸 이야기가 아니라, 학계에서도 활발히 연구되고 있는 주제야."
10053020-185 = "붉은겨울의 저명한 학술지, <네오피라미드퓨처>의 최신호에도 관련 기사가 실렸을 정도니까."
10053020-186 = "그거 사이비 잡지!"
10053020-187 = "엄청 사이비 잡지! 오죽하면 밀레니엄 모든 인쇄소에서 출판 거부당해서, 돈만 내면 인쇄해 준다는 붉은겨울로 옮겨갔을 정도로 엉망진창인 음모론 잡지잖아!"
10053020-188 = "틀려. 해당 사건의 배후에는 주류 과학이라는 명목으로 밀레니엄 학계를 컨트롤하고 있는 <세미나>가……."
10053020-189 = "……응? 그보다 상당히 해박하지 않아?"
10053020-190 = "정기 구독자 중에서도 그런 뒷사정까지 아는 사람은 드물다고 생각하는데……."
10053020-191 = "……!"
10053020-192 = "……과연, 그쪽도 그쪽 나름의 이론으로 무장한 전문가라는 건가."
10053020-193 = "좋아, 이번 승부, 받아들이겠어!"
10053020-194 = "내 주장은 변함없어. 츠치노코는 외계인의 위장 드론이야."
10053020-195 = "그 부자연스러운 외형은 토착 생물을 다른 중력 환경에서 어중간하게 본떴기 때문이지. 특유의 기동성과 신출귀몰한 면모는 그야말로 탐사 드론 본연의 기능에 충실한 것이고."
10053020-196 = "아니, 진짜 뱀이 아니면 곤란한데……."
10053020-197 = "고전파에도 여전히 가능성 있다고 생각해. 생명의 가능성은 무궁무진하니까."
10053020-198 = "과연 누구의 해석이 정답에 근접할지, 이번 탐사는 제법 흥미롭겠네!"
10053020-203 = "아니, 나는 그러니까……."
10053020-204 = "에휴, 됐다. 어차피 츠치노코 소문의 발원지를 찾는 목적은 같으니까."
10053020-205 = "어쩌면, 키보토스에 정상인은 나밖에 없는 거 아닐까……?"
10053020-206 = "[ns19] \"아아, 그런 설정?\"\n[ns20] \"완벽하게 이해했어.\""
10053020-211 = "샤아아아악!! 그러니까!! 그거!! 그만하라고!!"
