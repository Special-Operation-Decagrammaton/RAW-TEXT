[translation]
10053020-1 = "第2話;那種設定的少女"
10053020-2 = "老師為什麼會在這裡！？"
10053020-3 = "[s1] 「這應該是我要問玲奈的吧！？」\n[s2] 「你為什麼會在這裡！？」"
10053020-6 = "什麼為什麼，當然是申請到外出許可才出來的啊。"
10053020-7 = "……啊啊，我大概知道外面有什麼關於我們學院的傳聞啦。"
10053020-8 = "不過狂獵並沒有把學生關起來之類的哦？"
10053020-9 = "當然外出手續確實有點麻煩就是了……"
10053020-10 = "咦？難道老師跟「Gurumin」認識嗎？"
10053020-11 = "[s3] 「嗯，我們非常熟。」\n[s4] 「他是我從前世就結下因緣的後輩。」"
10053020-14 = "……那是什麼關係啊？"
10053020-15 = "嚇啊──！不要跟前輩們一樣老是喜歡瞎起鬨啦！#n情況會變得更麻煩的耶！？"
10053020-16 = "而且老師到底為什麼會在這裡！？"
10053020-17 = "不是說好我們三個人一起去找槌之子的嗎？"
10053020-18 = "啊，抱歉抱歉～我忘了跟你們說老師也會來。"
10053020-19 = "不過你們想想，人多一點總是比較有趣嘛？"
10053020-20 = "別把那種陽角邏輯強加在別人身上好嗎……"
10053020-21 = "既然老師跟「Gurumin」……跟玲奈好像認識，我就不多介紹了。"
10053020-22 = "那麼～"
10053020-30 = "……"
10053020-35 = "[ns5] 「為什麼要伸出手指……？」\n[ns6] 將指尖碰在一起"
10053020-36 = "……心電感應失敗了嗎。"
10053020-37 = "看來我和老師的頻率對不太上呢。"
10053020-41 = "……！"
10053020-42 = "果然沒錯！老師和我有著相同的氣場！"
10053020-47 = "很高興見到你，還有歡迎你。"
10053020-48 = "我的名字是羽咋翼。#n是這隻探險隊的隊長，同時也經營著「某超自然研究所」。"
10053020-49 = "叫我的時候，希望你能盡量用「翼所長」這個稱呼。"
10053020-50 = "[ns7] 「所長……？」\n[ns8] 「玲奈，這是……？」"
10053020-55 = "我知道你在想什麼……不過他也沒有想像中那麼奇怪。"
10053020-56 = "剛才是在說網路上的事。#n「某超自然研究所」是他經營的頻道名稱。"
10053020-57 = "簡單來說，就是「那種設定」啦。"
10053020-58 = "稱之為設定真讓人難過呢，玲奈君。"
10053020-59 = "我們研究所可是以科學方法論調查超自然現象的、奇普托斯獨一無二的團體啊。"
10053020-60 = "只有你一個人應該不能算是團體吧。"
10053020-61 = "那，那是……因為一些複雜的大人的原因……"
10053020-62 = "總之，老師！希望你不要誤會！"
10053020-63 = "超自然現象並不是偽科學！"
10053020-64 = "唉～他又開始了……"
10053020-68 = "超自然現象不僅確實存在於奇普托斯，甚至還在我們周圍發生得相當頻繁哦。"
10053020-69 = "比如最近，在千年那邊就發生了一件大事。#n老師應該也知道吧？"
10053020-70 = "[s]「……！」"
10053020-75 = "哼嗯……從表情來看，老師似乎有點頭緒呢。"
10053020-76 = "畢竟事情鬧得那麼大，不知道反而才奇怪吧。"
10053020-77 = "沒錯，就是「千年東阿爾卑斯UFO目擊事件」！"
10053020-78 = "[ns9] 「……咦？」\n[ns10] 「東阿爾卑斯……什麼事件？」"
10053020-83 = "根據目擊者的證詞──#n在黎明時分有個被光芒包圍的白色圓盤形物體，正以無視加速度般的方式自由飛行。"
10053020-84 = "從這裡開始是我的見解──我認為這是非常典型的「亞當斯基型UFO」目擊案例。"
10053020-85 = "有人因為其典型性而主張那是認知偏誤或模仿效應，但我個人反對這種觀點。"
10053020-86 = "UFO是真實存在的！！"
10053020-91 = "就是因為這樣，目擊證詞才會總是帶有高度的一致性！"
10053020-92 = "本來我也很想親自去現場嘗試通訊……#n可惜現在由於某些原因，有點難自由往來千年內部……"
10053020-93 = "[s11] 「跟UFO通訊……？」\n[s12] 「玲奈……？」"
10053020-96 = "要說他奇怪的話……確實是有點奇怪沒錯！不過又有點微妙的不同！"
10053020-97 = "跟前輩們比起來相對務實，也還算能夠溝通……"
10053020-98 = "等一下，我為什麼要幫他辯解啊！"
10053020-102 = "雖然外表可能看不出來，不過所長在這個業界真的是名人哦。"
10053020-103 = "他可是每天都在進行廢墟探險的直播呢。"
10053020-104 = "根本就沒有那種業界，他也沒那麼有名好不好……"
10053020-105 = "直播總是在荒廢的建築物裡轉來轉去，最後什麼事都沒發生……#n觀看數和訂閱者也沒什麼成長。"
10053020-107 = "[ns13] 「每天都在廢墟探險……？」\n[ns14] 「這樣有時間兼顧學業嗎……？」"
10053020-112 = "當，當然有！#n千年的學生是不可能不重視數學的……"
10053020-113 = "……？#n原來你是千年的學生嗎？"
10053020-114 = "咦，我沒說過嗎？"
10053020-115 = "嗯，讓人有點意外……#n我還以為千年的人不會相信這種東西呢。"
10053020-116 = "這種東西是指……？"
10053020-117 = "呃，就是槌之子啊……[ruby=Yeti]雪人[/ruby]啊……"
10053020-118 = "……或者魔法之類的。"
10053020-119 = "呼呣，那正是作為千年的學生不能坐視不管的發言呢。"
10053020-120 = "目前已知的任何理論，都不是一開始就獲得證明的。#n所有命題都是經過科學方法論被解釋、驗證之後，才得以成為普遍的真理。"
10053020-121 = "唔，唔嗯……？"
10053020-125 = "換言之，如果因為沒有被證明便否定其可能性的話，#n就相當於否定了人類至今為止所建立的自然哲學的根基。"
10053020-126 = "況且，即使是身處現代科學前沿的千年，也存在像「廢墟」這樣的未知領域。"
10053020-127 = "超自然現象是我們科學家該去解開的課題，而不是應該避諱的東西。"
10053020-128 = "雖然這在保守派的科學家之間，有時會被貶低成偽科學就是了……"
10053020-133 = "哦，哦哦……果然千年的學生就是不一樣呢。"
10053020-134 = "同樣的話如果是從我的前輩們口中說出來，就會給人一種像是在胡說八道的感覺。"
10053020-135 = "從探究精神這點來說，我們不也是同伴嗎？"
10053020-136 = "畢竟玲奈君也是來尋找尚未被證明的槌之子的。"
10053020-137 = "……啊，其實不是耶。"
10053020-138 = "嗯？"
10053020-142 = "為了避免你誤會，我就直接說清楚了──"
10053020-143 = "我才不相信什麼槌之子！！"
10053020-149 = "[ns15] 「哦哦，是那種設定？」\n[ns16] 「我完全理解了。」"
10053020-153 = "等等！你們那是什麼反應啊！？"
10053020-154 = "我們反而才想問你呢。"
10053020-155 = "如果不相信槌之子的話，為什麼還要參加這次的探險？"
10053020-156 = "那當然是因為……"
10053020-161 = "唉……老師應該已經知道了吧。#n我的室友們有點特別……或者應該說是神秘學的狂熱份子吧。"
10053020-162 = "如果在SNS上發現槌之子目擊情報之類的東西，他們一定會吵個沒完。"
10053020-163 = "所以我要先下手為強！"
10053020-164 = "反正這次的目擊情報，八成只是看到類似蛇或蜥蜴的東西才傳開的。"
10053020-165 = "只要我能從源頭證明那只是謠言，室友們應該就能看清現實了吧？"
10053020-166 = "……雖然我也有點懷疑，這樣到底能不能讓他們清醒過來就是了。"
10053020-167 = "[s17] 「哦哦，是那種設定？」\n[s18] 「我完全理解了。」"
10053020-170 = "就說了不是……！"
10053020-175 = "等等。不管怎麼說，我還是無法接受你以那種不純的動機參加。"
10053020-176 = "畢竟我們的目的，始終是要查明傳說中的神祕生物槌之子的存在。"
10053020-177 = "嗯，嗯！"
10053020-178 = "並且，也是為了證明它的真面目是外星人的偵察無人機！"
10053020-179 = "……咦？我們是那麼可疑的團體嗎？"
10053020-181 = "才不是！不要突然加入奇怪的私心啦！"
10053020-182 = "我們的目的明明只有找到槌之子而已！"
10053020-183 = "啊，啊啊……我明白了。#n或許對外行人來說可能有點難以理解吧。"
10053020-184 = "不過這並不是我隨便編出來的故事，而是學界也在積極研究的課題。"
10053020-185 = "甚至在赤冬著名的學術期刊《新金字塔未來》的最新期之中也刊載了相關的文章。"
10053020-186 = "那是偽科學雜誌！超級偽科學雜誌！"
10053020-187 = "就是因為被千年的所有印刷廠拒絕出版，才會搬到只要給錢什麼都印的赤冬去！#n根本是本亂七八糟的陰謀論雜誌！"
10053020-188 = "你錯了。那起事件的背後，其實是以主流科學為名控制千年學界的「研討會」在──"
10053020-189 = "……嗯？話說你了解得還真清楚呢？"
10053020-190 = "就算是訂閱者，知道那些內幕的人應該也很少才對……"
10053020-191 = "……！"
10053020-192 = "……原來如此。看來你也是用自己的理論武裝過的專家啊。"
10053020-193 = "好，這場勝負我接受了！"
10053020-194 = "我的主張沒有改變──槌之子就是外星人的偵查無人機。"
10053020-195 = "那種不自然的外型，是在不同的重力條件下胡亂模仿本土生物所造成的。#n其特有的機動性與神出鬼沒的特質，正是探測無人機功能的展現。"
10053020-196 = "等等，如果牠不是蛇會讓我很困擾的耶……"
10053020-197 = "我認為古典派仍然存在可能性。畢竟生命的可能性是無限的。"
10053020-198 = "究竟誰的解釋更接近正確答案……這次的探險似乎會相當有趣呢！"
10053020-203 = "不是，就說了我才……"
10053020-204 = "唉，算了。反正目的都是要找出槌之子謠言的源頭。"
10053020-205 = "話說奇普托斯的正常人，該不會只剩下我自己了吧……？"
10053020-206 = "[ns19] 「哦哦，是那種設定？」\n[ns20] 「我完全理解了。」"
10053020-211 = "嚇啊──！！就跟你說不要再鬧了！！"
