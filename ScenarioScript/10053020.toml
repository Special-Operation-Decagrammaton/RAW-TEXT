[translation]
10053020-1 = "ตอนที่ 2;เด็กสาวที่เป็นแบบนั้น"
10053020-2 = "อะ... อะไรกัน?! ทำไมคุณครูถึงมาอยู่ตรงนี้ด้วยล่ะ?!"
10053020-3 = "[s1] \"เรนะต่างหากล่ะ ทำไมถึงมาอยู่ตรงนี้?!\"\n[s2] \"ครูควรถามเรนะมากกว่านะ?!\""
10053020-6 = "ว่าไงนะ? ที่ฉันมาที่นี่ได้ ก็เพราะขออนุญาตออกนอกโรงเรียนจนได้ออกมาน่ะสิ"
10053020-7 = "อ่า... ฉันก็พอรู้อยู่หรอกนะว่ามีข่าวลืออะไรเกี่ยวกับโรงเรียนของฉันบ้าง"
10053020-8 = "แต่ถึงจะชื่อว่าไวลด์ฮันต์ แต่ก็ไม่ได้ล่านักเรียนและขังไว้แต่ในโรงเรียนหรอกนะ?"
10053020-9 = "ถึงการขอออกมาข้างนอกมันจะยุ่งยากมากก็เถอะ..."
10053020-10 = "เอ๋? คุณครูรู้จักกับ <คุรุมิง> ด้วยเหรอคะ?"
10053020-11 = "[s3] \"อื้อ รู้จักดีตั้งแต่ชาติปางก่อนเลยละ\"\n[s4] \"เป็นรุ่นน้องครูจากชาติที่แล้วน่ะ\""
10053020-14 = "เป็นความสัมพันธ์แบบไหนกันเนี่ย...?"
10053020-15 = "ว้ากกก! เปล่านะ! คุณครูนี่ก็นะ อย่าไปฟังคุณครูเลย พูดอะไรเพ้อเจ้อทั้งนั้น!"
10053020-16 = "ว่าแต่คุณครูนั่นละ ทำไมถึงมาอยู่ที่นี่ได้ล่ะ?!"
10053020-17 = "พวกเราไม่ได้จะมาตามหาสึจิโนโกะกันแค่สามคนหรอกเหรอ?"
10053020-18 = "อ๊ะ ขอโทษนะ~ พอดีฉันลืมบอกไปว่าคุณครูจะมาด้วย"
10053020-19 = "แต่ยิ่งมีคนเยอะก็ยิ่งน่าสนุกไม่ใช่เหรอ?"
10053020-20 = "อย่าเอาตรรกะของพวกชอบเข้าสังคมมายัดเยียดสิ..."
10053020-21 = "ดูเหมือนว่าคุณครูจะรู้จัก <คุรุมิง>... หรือก็คือเรนะแล้ว งั้นฉันจะข้ามการแนะนำตัวไปเลยนะ"
10053020-22 = "ถ้างั้นก็ อ่า~"
10053020-30 = "..."
10053020-35 = "[ns5] \"ยื่นนิ้วให้ทำไมเหรอ...?\"\n[ns6] ยื่นนิ้วไปแตะบ้าง"
10053020-36 = "ส่งโทรจิตล้มเหลว..."
10053020-37 = "ความถี่ของฉันน่าจะไม่ตรงกับของคุณครูน่ะ"
10053020-41 = "...!"
10053020-42 = "ว่าแล้วเชียว! คุณครูมีออร่าคล้ายกับของฉันเลยสินะ"
10053020-47 = "ดีใจที่ได้เจอนะ แล้วก็ ยินดีต้อนรับ"
10053020-48 = "ฉันชื่อว่าฮาเนโมโตะ สึบาสะ เป็นหัวหน้าของทีมสำรวจนี้ #nแล้วก็ดูแล <ศูนย์วิจัยเรื่องเหนือธรรมชาติแห่งหนึ่ง> อยู่ด้วย"
10053020-49 = "ตอนเรียกฉัน ถ้าเป็นไปได้ก็ช่วยเรียกว่าหัวหน้าสึบาสะนะ"
10053020-50 = "[ns7] \"หัวหน้าศูนย์วิจัยอะไรนะ...?\"\n[ns8] \"นี่ เรนะ...?\""
10053020-55 = "อ่า ฉันพอเดาได้ว่าคุณครูคิดอะไร... แต่สึบาสะไม่ใช่เด็กแปลกๆ อย่างที่คิดหรอก"
10053020-56 = "มันก็แค่เรื่องในอินเทอร์เน็ตน่ะ <ศูนย์วิจัยเรื่องเหนือธรรมชาติแห่งหนึ่ง> ที่ว่าก็เป็นชื่อแชนแนลที่ทำอยู่"
10053020-57 = "เพราะงั้นก็มองว่ามันเป็น 'คาแรกเตอร์ที่สร้างขึ้น' แล้วกัน"
10053020-58 = "คาแรกเตอร์ที่สร้างขึ้นงั้นเหรอ ฟังแล้วก็น่าน้อยใจนะ เรนะ"
10053020-59 = "ศูนย์วิจัยของฉันเป็นองค์กรเดียวในคิโวทอสที่สำรวจปรากฏการณ์เหนือธรรมชาติโดยยึดตาม#nกระบวนการทางวิทยาศาสตร์เชียวนะ"
10053020-60 = "องค์กรอะไรกันล่ะ ก็มีเธอทำอยู่คนเดียวไม่ใช่เหรอ"
10053020-61 = "ระ... เรื่องนั้นน่ะ... มันมีเหตุผลของผู้ใหญ่ที่ค่อนข้างซับซ้อน..."
10053020-62 = "เอาเถอะ คุณครู! อย่าเข้าใจกันผิดล่ะ!"
10053020-63 = "ปรากฏการณ์เหนือธรรมชาติไม่ใช่เรื่องที่ขัดกับวิทยาศาสตร์หรอกนะ!"
10053020-64 = "อ่า~ เริ่มอีกแล้วสินะ..."
10053020-68 = "ปรากฏการณ์เหนือธรรมชาติน่ะไม่ได้มีอยู่แค่ในคิโวทอสเท่านั้น แต่ยังเกิดขึ้นบ่อยครั้งรอบตัวเรา"
10053020-69 = "เมื่อไม่นานมานี้ก็มีเหตุการณ์ครั้งใหญ่ในมิลเลเนียมด้วย พอจะรู้หรือเปล่าล่ะ?"
10053020-70 = "[s] \"...!\""
10053020-75 = "โอ้... ดูจากสีหน้าแล้ว คุณครูก็พอจะคาดเดาได้สินะ"
10053020-76 = "แต่ก็นะ เรื่องเป็นกระแสถึงขนาดนั้น ถ้าบอกว่าไม่รู้เลยก็คงจะแปลก"
10053020-77 = "ใช่แล้วละ ฉันหมายถึง <เหตุการณ์พบเห็น UFO บนเทือกเขาฮิงาชิในมิลเลเนียม>!"
10053020-78 = "[ns9] \"หา...?\"\n[ns10] \"UFO บนเทือกเขาฮิงาชิ...?\""
10053020-83 = "จากคำบอกเล่าของผู้พบเห็น ในรุ่งสางของวันหนึ่ง มีวัตถุทรงจานสีขาวเปล่งแสงเจิดจ้าบินไปบินมา#nอย่างอิสระ ราวกับกำลังฉีกทุกกฎการเร่งความเร็วทางฟิสิกส์เลยละ"
10053020-84 = "ฉันว่านี่คือเคสการพบเห็น UFO ทรงอดัมสกีที่คลาสสิกสุดๆ ไปเลย"
10053020-85 = "ถึงคนบางกลุ่มจะบอกว่านั่นเป็นการคิดไปเองหรืออุปาทานหมู่ แต่ฉันไม่เห็นด้วยหรอก"
10053020-86 = "UFO น่ะมีอยู่จริง!!"
10053020-91 = "ก็เลยมีเรื่องเล่าจากการพบเห็นที่สอดคล้องกันเสมอเลยยังไงล่ะ"
10053020-92 = "ถ้าเป็นไปได้ฉันก็อยากไปที่นั่นและลองสื่อสารด้วยตัวเองเลย แต่ก็น่าเสียดายที่ตอนนี้การเดินทางใน#nมิลเลเนียมอย่างอิสระเป็นไปได้ยากด้วยเหตุผลบางอย่าง..."
10053020-93 = "[s11] \"จะสื่อสารกับ UFO เหรอ...?\"\n[s12] \"นี่ เรนะ...?\""
10053020-96 = "จะว่าเป็นเด็กแปลกๆ... ก็จริงอยู่! แต่ก็ไม่เหมือนเด็กแปลกๆ คนอื่นหรอกนะ!"
10053020-97 = "ถ้าเทียบกับพวกรุ่นพี่ของฉัน สึบาสะถือว่าเป็นคนที่มีความสมเหตุสมผล แล้วก็คุยภาษาเดียวกันกับฉันด้วย..."
10053020-98 = "เดี๋ยวนะ ทำไมฉันถึงมาพูดแก้ตัวแทนให้อยู่ล่ะเนี่ย!"
10053020-102 = "เห็นอย่างนั้น หัวหน้าก็เป็นคนดังในวงการนี้เลยนะคะ"
10053020-103 = "หัวหน้าอัปโหลดวิดีโอสำรวจบ้านร้างลงแชนแนลตัวเองทุกวันเลยค่ะ"
10053020-104 = "เดี๋ยวก่อน วงการนั้นน่ะมีที่ไหนกัน แล้วก็ไม่เห็นจะเป็นคนโด่งดังขนาดนั้นด้วย"
10053020-105 = "วิดีโอที่ลงก็มีแต่เดินวนไปวนมาในอาคารร้างแล้วก็ไม่มีอะไรเกิดขึ้นสักที ยอดวิวก็เลยไม่ขึ้น แล้วยังไม่มีคนกดติดตามด้วยไม่ใช่เหรอ?"
10053020-107 = "[ns13] \"สำรวจบ้านร้างทุกวันเลยเหรอ แล้วเรื่องเรียนล่ะ...?\"\n[ns14] \"แล้วแบ่งเวลาไปเรียนหนังสือบ้างหรือเปล่า...?\""
10053020-112 = "ฉะ... ฉันไม่ทิ้งการเรียนหรอก! ไม่มีทางที่นักเรียนมิลเลเนียมจะละเลยการเรียนหนังสืออยู่แล้ว..."
10053020-113 = "เธอเป็นเด็กมิลเลเนียมหรอกเหรอ...?"
10053020-114 = "เอ๋ ฉันไม่เคยบอกเหรอ?"
10053020-115 = "อืม... คิดไม่ถึงเลยนะ... นึกว่าเด็กมิลเลเนียมจะไม่เชื่อเรื่องอะไรแบบนี้ซะอีก"
10053020-116 = "เรื่องแบบนี้?"
10053020-117 = "ก็... เรื่องอย่าง... สึจิโนโกะ หรือเยติ..."
10053020-118 = "หรือพวกเรื่องเวทมนตร์..."
10053020-119 = "โอ้ ในฐานะนักเรียนมิลเลเนียมแล้ว เรื่องที่ยกมาเป็นสิ่งที่มองข้ามไม่ได้เลยละ"
10053020-120 = "ทฤษฎีต่างๆ มากมายในปัจจุบันน่ะ ไม่มีเรื่องไหนที่พิสูจน์ได้มาตั้งแต่แรกหรอก ทุกข้อเสนอล้วนถูก#nตีความและพิสูจน์ยืนยันผ่านกระบวนการทางวิทยาศาสตร์ จนได้รับการยอมรับให้เป็นความจริงอันเป็น#nสากล"
10053020-121 = "หะ... หืม?"
10053020-125 = "พะ... พูดได้อีกอย่างว่า การปฏิเสธความเป็นไปได้บางอย่างเพียงเพราะเรื่องนั้นยังไม่ถูกพิสูจน์ ก็ไม่ต่างอะไรกับการปฏิเสธรากฐานของปรัชญาธรรมชาติที่มนุษยชาติสร้างขึ้นมาหรอก"
10053020-126 = "ยิ่งกว่านั้นนะ แม้แต่ในมิลเลเนียมที่ได้ชื่อว่าเป็นแถวหน้าสุดของวิทยาศาสตร์สมัยใหม่ ก็ยังมีดินแดนปริศนาอย่าง <พื้นที่รกร้าง> ด้วยไม่ใช่เหรอ?"
10053020-127 = "ปรากฏการณ์เหนือธรรมชาติคือโจทย์ที่พวกเราในฐานะผู้ศึกษาวิทยาศาสตร์ต้องคลี่คลาย ไม่ใช่สิ่งต้องห้ามที่ควรหลีกเลี่ยงสักหน่อย"
10053020-128 = "ถึงจะถูกพวกนักวิทยาศาสตร์หัวโบราณมองข้ามและด้อยค่าว่าเป็นเรื่องลวงโลกก็ตามเถอะ..."
10053020-133 = "โอ้... โอ้ว... นี่สินะนักเรียนมิลเลเนียม"
10053020-134 = "ต่อให้พูดคำเดียวกัน แต่ถ้าออกมาจากปากของรุ่นพี่ของฉัน มันจะฟังดูไร้สาระทันทีเลยละ"
10053020-135 = "ในเมื่อมาเป็นทีมสำรวจเดียวกัน งั้นเราก็ถือว่าเป็นเพื่อนร่วมงานกันไม่ใช่เหรอ?"
10053020-136 = "เรนะเองก็มาตามหาสึจิโนโกะที่ยังไม่ได้รับการพิสูจน์เหมือนกัน"
10053020-137 = "อ่า... ไม่ใช่อย่างนั้นหรอก"
10053020-138 = "หืม?"
10053020-142 = "ฉันขอพูดให้เคลียร์ตรงนี้เลยนะ จะได้ไม่มีการเข้าใจผิด"
10053020-143 = "ฉันไม่เชื่อเรื่องสึจิโนโกะหรอกนะ!!"
10053020-149 = "[ns15] \"อ้อ กำหนดคาแรกเตอร์ให้เป็นแบบนี้สินะ?\"\n[ns16] \"เข้าใจแจ่มแจ้งแล้ว\""
10053020-153 = "เดี๋ยวก่อน! ท่าทีแบบนั้นมันอะไรกัน?!"
10053020-154 = "พวกฉันต่างหากที่ควรถามมากกว่า"
10053020-155 = "ถ้าไม่เชื่อเรื่องสึจิโนโกะ แล้วจะมาสำรวจกับพวกเราทำไมล่ะ?"
10053020-156 = "มันก็แน่นอนอยู่แล้ว..."
10053020-161 = "เฮ้อ... ก็อย่างที่คุณครูอาจจะรู้อยู่แล้ว ก็รูมเมทของฉันเป็นพวกคนแปลกๆ น่ะสิ ต้องเรียกว่าพวกคลั่งเรื่องลึกลับเลยมั้ยนะ"
10053020-162 = "ถ้าคนพวกนั้นไปเจอเรื่องการพบเห็นสึจิโนโกะหรืออะไรทำนองนั้นในโซเชียลละก็ คงได้เอาไปพูดใหญ่โตแน่"
10053020-163 = "เพราะงั้น! ฉันเลยต้องชิงลงมือก่อนนี่ไง!"
10053020-164 = "ยังไงข่าวการพบเห็นครั้งนี้ก็เป็นข่าวลือที่บอกว่าเจองูหรือสัตว์เลื้อยคลานที่รูปร่างคล้ายกัน"
10053020-165 = "ถ้าเราหาต้นตอและพิสูจน์ได้ว่าข่าวลือนั้นเกิดขึ้นได้ยังไง รูมเมทของฉันก็จะได้เห็นความจริงบ้าง ใช่มั้ยล่ะ?"
10053020-166 = "ต่อให้ไม่น่าจะคิดได้ด้วยคำพูดแค่นั้นจากฉันก็เถอะ..."
10053020-167 = "[s17] \"อ้อ กำหนดคาแรกเตอร์ให้เป็นแบบนี้สินะ?\"\n[s18] \"เข้าใจแจ่มแจ้งแล้ว\""
10053020-170 = "ก็บอกแล้วนี่นาว่าไม่ใช่...!"
10053020-175 = "เดี๋ยวก่อน แต่ยังไงการให้คนที่มีอุดมการณ์ต่างกันมาร่วมทีมก็เป็นเรื่องยากนะ"
10053020-176 = "เป้าหมายของพวกเราก็คือการยืนยันการมีอยู่จริงของสึจิโนโกะ สัตว์ลึกลับในตำนาน"
10053020-177 = "อื้อ อื้อ!"
10053020-178 = "และก็เพื่อพิสูจน์ความจริงที่ว่า แท้จริงแล้วมันก็คือโดรนสอดแนมของมนุษย์ต่างดาว!"
10053020-179 = "หืม...? นี่เราเป็นกลุ่มที่น่าสงสัยขนาดนั้นเลยเหรอ?"
10053020-181 = "เปล่าสักหน่อย! อย่ามาเนียนเอาเรื่องแปลกๆ ที่ตัวเองสนใจมาเพิ่มไปด้วยสิ!"
10053020-182 = "เป้าหมายคือการตามหาสึจิโนโกะต่างหาก!"
10053020-183 = "อะ... อ่า... เรื่องนี้คงยากไปหน่อยสำหรับมือสมัครเล่นสินะ"
10053020-184 = "แต่นี่ไม่ใช่เรื่องที่ฉันมโนขึ้นมาเองนะ มันเป็นหัวข้อที่มีการศึกษาอย่างจริงจังในแวดวงวิชาการเลยด้วย"
10053020-185 = "ขนาดวารสารวิชาการที่มีชื่อเสียงของเรดวินเทอร์อย่าง <นีโอพีระมิดฟิวเจอร์> ฉบับล่าสุดยังตีพิมพ์#nข่าวนี้เลย"
