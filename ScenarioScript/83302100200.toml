[translation]
83302100200-6 = "아, 부장님. 기다리고 있었습니다."
83302100200-7 = "치나츠? 어쩐 일이야?"
83302100200-8 = "그게…… 다름이 아니라, 학생 식당에서 소란이 발생했다는 신고가 들어왔거든요."
83302100200-9 = "학생 식당에서……"
83302100200-10 = "그렇지 않아도 후우카라면 만마전이 떠넘긴 일로도 벅찬 상태일 텐데, 고생이 많네."
83302100200-11 = "그래서…… 날뛰는 상대는? 헬멧단? 아니면 다른 문제아들인가?"
83302100200-12 = "저…… 바로 그 지점에서 조금 이상한 점이 있는데요……"
83302100200-13 = "이상한 점이라니?"
83302100200-14 = "평소처럼 게헨나의 문제아들이 소란을 일으키고 있는 게 아니라."
83302100200-15 = "그 주범이 정체불명의 괴물이라는 이야기가……"
83302100200-16 = "……정체불명의 괴물? 혹시 장난 전화 같은 거 아냐?"
83302100200-17 = "신고한 당사자가 주리 씨였던 만큼, 그럴 일은 없을 거라 생각합니다만……"
83302100200-23 = "……이해는 되지 않지만. 알았어. 출동하자."
