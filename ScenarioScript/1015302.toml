[translation]
1015302-1 = "#title;평범한 경기복?"
1015302-3 = "#na;(약속 장소는 제대로 찾아온 것 같은데…….)"
1015302-4 = "#na;(사람들이 많아서, 히후미를 찾지 못하고 있었다.)"
1015302-5 = "#na;???;선생님-!!"
1015302-8 = "3;히후미 레이싱;03;여기에요, 여기-!\n#3;a\n#3;em;[반짝]"
1015302-9 = "3;히후미 레이싱;15;다행이다…… 몇 번 불렀었는데요, 잘 못 들으신 것 같아서요."
1015302-10 = "3;히후미 레이싱;11;아하하…… 이렇게 붐빌 줄 알았다면 다른 곳에서 뵙는 게 나았을까요-\n#3;em;[땀]\n#3;stiff"
1015302-11 = "[s] \"히후미?! 그 옷은 뭐야?!\""
1015302-12 = "3;히후미 레이싱;02;네?! 뭔가 이상한가요?!"
1015302-13 = "3;히후미 레이싱;03;대회 운영진에서 받은 유니폼이에요!\n#3;em;[음표]\n#3;greeting"
1015302-14 = "[s1] \"엄청 예쁜데!\"\n[s2] \"그런데 레이싱 슈트가 원래 이런…… 가?\""
1015302-17 = "3;히후미 레이싱;02;글쎄요? 평범하지 않나요……?\n#3;em;[?]"
1015302-18 = "1;트리니티 모브 관람객 A;00\n5;트리니티 모브 관람객 B;00\n#1;h\n#5;h\n#3;hide"
1015302-20 = "5;트리니티 모브 관람객 B;02\n1;트리니티 모브 관람객 A;02\n#3;hide\n#1;h\n#5;h\n#5;em;[!]\n#1;em;[!]\n#wait;1500"
1015302-21 = "1;트리니티 모브 관람객 A;08;저 사람 봐!"
1015302-22 = "5;트리니티 모브 관람객 B;03;레이싱 모델인가? 대담한데!\n#5;em;[재잘]"
1015302-23 = "1;트리니티 모브 관람객 A;00;이렇게 큰 대회라서 모델도 있나 봐."
1015302-24 = "3;히후미 레이싱;09\n#1;hide\n#5;hide"
1015302-26 = "3;히후미 레이싱;02;……선생님? 뭘 보고 계신가요?\n#3;em;[?]"
1015302-27 = "[s] \"……어, 그러니까…….\""
1015302-28 = "3;히후미 레이싱;13;네! 레이스에 딱 맞는 의상이죠?\n#3;em;[음표]"
1015302-29 = "3;히후미 레이싱;12;평범한 선수복이니까 선수에게 보내준 것 같아요."
1015302-30 = "3;히후미 레이싱;08;자, 보세요 선생님! 일단 재질부터, 질기고 몸에 착 달라붙잖아요?\n#3;em;[반짝]"
1015302-31 = "3;히후미 레이싱;09;이런 재질이면 전차에 타도 좀처럼 안 찢어질 거예요!\n#3;greeting"
1015302-32 = "3;히후미 레이싱;03;장갑이 세트인 이유도, 손을 보호하기 위해서일 거예요!"
1015302-33 = "[s] \"그러면 신발에 굽이 있는 이유는……?\""
1015302-34 = "3;히후미 레이싱;09;맞다, 그것도 중요하죠!\n#3;em;[반응]"
1015302-35 = "3;히후미 레이싱;13;전차 차장석에 올라갈 때 시야를 확보하기 위한 것 같아요!"
1015302-36 = "3;히후미 레이싱;12;잠망경식 큐폴라가 없어서, 시야를 넓게 보려면 최대한 키가 커야 좋거든요!\n#3;jump"
1015302-37 = "3;히후미 레이싱;09;코너를 돌거나 상대를 볼 때 시야는 중요하니까요."
1015302-38 = "3;히후미 레이싱;14;그리고, 크루세이더 쨩에는 측풍 감지기가 없으니, 몸을 내밀어서 바람 방향을 느낄 수도 있어서 도움이 돼요."
1015302-39 = "[s] \"……허리 부분이 망사인 이유는……?\""
1015302-40 = "3;히후미 레이싱;08;주행하다 보면 전차가 더워지니까, 빠른 체온 배출을 돕는 거라고 생각해요!"
1015302-41 = "3;히후미 레이싱;11;크루세이더 쨩, 에어컨이 고장 나는 고질병이 있거든요.\n#3;em;[속상함]"
1015302-42 = "3;히후미 레이싱;02;대회 주최 측에서 그런 점도 배려해준 것 아닐까요?"
1015302-43 = "3;히후미 레이싱;03;이런 선수복을 지급해주다니, 섬세한 배려네요!\n#3;em;[반짝]\n#3;closeup"
1015302-44 = "3;히후미 레이싱;03\n#na;트리니티 모브 관람객 A;우와…… 저 사람 대담한 것 봐…….\n#3;closeup"
1015302-45 = "3;히후미 레이싱;03\n#na;트리니티 모브 관람객 B;게헨나 쪽 모델인가, 정말 칼 갈았네…….\n#3;closeup"
1015302-46 = "3;히후미 레이싱;02;……맞다, 어쩌다 보니 옷 얘기만 했네요. 선생님께 드릴 페로로님 굿즈가 있었죠!\n#3;jump\n#3;closeup"
1015302-47 = "3;히후미 레이싱;12;저쪽에 뒀어요, 같이 가지러 가요!\n#3;em;[음표]\n#3;closeup"
1015302-49 = "#na;(이후, 히후미와 함께 경기장을 돌아다녔다.)"
1015302-50 = "#na;(주변의 시선을 끄는 것을 히후미는 전혀 알아채지 못했다.)"
