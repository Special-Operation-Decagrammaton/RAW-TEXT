[translation]
1015302-1 = "よくあるユニフォーム？"
1015302-3 = "（待ち合わせ場所は間違ってないはずだけど……）"
1015302-4 = "（周りが混雑していて、ヒフミを見つけられずにいた）"
1015302-5 = "先生ー！！"
1015302-8 = "こっちです、こっちー！"
1015302-9 = "よかった……何度か声をかけていたのですが、なかなか気づいてもらえなくて。"
1015302-10 = "あはは……こんなに混んでるなら、他の場所にすればよかったですね。"
1015302-11 = "[s] \"ヒフミ！？その服どうしたの！？\""
1015302-12 = "えっ！？なにか変でしょうか！？"
1015302-13 = "大会の運営さんからもらったユニフォームです！"
1015302-14 = "[s1] \"すごくかわいいよ！\"\n[s2] \"でも、レーシングスーツとはちょっと違くない……？\""
1015302-17 = "どうなんでしょう？こんな感じだと思いますが……。"
1015302-18 = ""
1015302-20 = ""
1015302-21 = "見て、あの子！"
1015302-22 = "モデルさんかな？大胆だね。"
1015302-23 = "そりゃこんなおっきな大会だもん。モデルさんも来るでしょ。"
1015302-24 = ""
1015302-26 = "……先生？何を見てるんですか？"
1015302-27 = "[s] \"……思ったんだけどさ。\""
1015302-28 = "はい！レースにぴったりの衣装ですよね！"
1015302-29 = "支給されたのも、これがスタンダードだからでしょうし。"
1015302-30 = "ほら、先生、見てください！#nすごく身体にフィットしますし、丈夫な素材が使われているんです。"
1015302-31 = "これなら戦車に乗っていてもそうそう破れないと思います！"
1015302-32 = "手袋がセットなのは、手を守るためでしょうね。"
1015302-33 = "[s] \"じゃあ、靴にヒールがついてるのは……？\""
1015302-34 = "これも良いですよね！"
1015302-35 = "戦車の車長ハッチから顔を出すとき、視野を確保するためだと思います。"
1015302-36 = "ペリスコープが無い場合、遠くまで見るには身長が高いほうが有利ですから！"
1015302-37 = "コーナリングにせよ、相手を視認するにせよ、視野は勝敗を分ける要素ですし。"
1015302-38 = "それと、クルセイダーちゃんにはクロスウィンドセンサーがないので、#n体を乗り出して風向きを感じるのにも役立ちます。"
1015302-39 = "[s] \"……ウエストが網になってるのは？\""
1015302-40 = "走行していると戦車の中が暑くなりますし、服の通気性を上げるためだと思います！"
1015302-41 = "クルセイダーちゃんはクーラーが壊れやすいので……。"
1015302-42 = "運営さんが配慮してくれたのではないでしょうか？"
1015302-43 = "こんなユニフォームを支給してくれるなんて、良い運営さんですよね。"
1015302-44 = "す、すごいね……あの子……。"
1015302-45 = "ゲヘナのモデルかな？気合ばっちりだね……。"
1015302-46 = "……って、服の話ばっかりになってしまいましたね。#nお伝えした通り、先生にプレゼントしたいペロロ様グッズがありまして！"
1015302-47 = "あっちに置いてあるので、一緒に取りに行きましょう！"
1015302-49 = "（道中、ヒフミと一緒に競技場の中でいろいろ寄り道した）"
1015302-50 = "（周りの注目を集めていることに、ヒフミは全く気づいていなかった）"
