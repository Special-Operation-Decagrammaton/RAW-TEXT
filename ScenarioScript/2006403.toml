[translation]
2006403-1 = "비밀이 많은 소녀"
2006403-2 = "(오늘은 대중의 예술 활동 증진을 위한 자료 수집을 위해 와일드헌트 예술학원을 찾았다.)"
2006403-3 = "(학원 곳곳의 예술 관련 조형들을 기록하고 있던 그때…….)"
2006403-6 = "[ns] (……갑자기 어딘가에서 장미 향기가 난다.)"
2006403-9 = "안녕하세요, 선생님."
2006403-10 = "이런 곳에서 뵙다니. 마치 즉흥 연기인 에튀드 같네요. #n잠깐 한 막에 어울려 주시겠나요?"
2006403-11 = "[ns1] \"역시 우라라가 주변에 있었구나.\"\n[ns2] \"어딘가에서 장미 향기가 났어.\""
2006403-16 = "아…… 그렇군요."
2006403-17 = "그런 향수는 쓰지 않는데……. 아마도 제가 돌보는 장미 화원 때문일 거예요."
2006403-18 = "여가를 주로 그곳에서 보내거든요."
2006403-19 = "[s3] \"우라라의 장미 화원? 보고 싶어!\"\n[s4] \"마침 와일드헌트 학원의 예술을 조사하고 있었거든.\""
2006403-22 = "선생님이…… 저의 화원에……?"
2006403-23 = "그건 혹시…… 명령…… 일까요?"
2006403-24 = "하, 하지만…… 아무리 그렇다 해도……."
2006403-25 = "선생님이라 해도……."
2006403-26 = "[s5] \"앗……! 무리한 부탁이었다면 미안!\"\n[s6] \"억지로 볼 생각은 없었으니까!\""
2006403-31 = "정말…… 죄송해요."
2006403-32 = "지금까지 외부인의 출입을 허가한 적이 없는…… 정말 개인적인 장소라……."
2006403-33 = "저에게는 마나미 님의 개인 박물관 같은…… 느낌이려나요?"
2006403-34 = "[s7] (본인 외에는 아무도 들어가 본 적이 없다는 금단의 장소…….)\n[s8] \"이해했어. 무리한 요구는 안 할게.\""
2006403-37 = "배려해 주셔서 감사합니다."
2006403-38 = "후후…… 제가 선생님을 조금 오해했던 것 같네요."
2006403-39 = "소문으로 들은 선생님은 배역에 비해 정말 여러 가지 설정을 가진 느낌의 분이셔서……."
2006403-40 = "[s9] (우라라는 나를 경계하고 있었구나…….)\n[s10] (어떤 소문인지는 물어보기 겁나니 잠자코 있자…….)"
2006403-43 = "아무튼 선생님께 나쁜 의도가 없었다는 건 이해했어요."
2006403-44 = "……."
2006403-45 = "……그렇게 생각하니 스스로가 부끄러워지네요."
2006403-46 = "호의적인 말씀이었는데……. 멋대로 다른 상상을 해버렸으니."
2006403-47 = "저…… 그렇다면……."
2006403-48 = "사죄의 의미로 학원의 공용 정원을 안내해 드리겠습니다."
2006403-49 = "학원의 예술을 조사하고 계신다면, 저의 개인 정원보다는 오히려 그쪽이 도움 될 거예요."
2006403-50 = "어떠실까요? 괜찮으신가요?"
2006403-51 = "[s] \"응! 괜찮아!\""
2006403-52 = "네. 그럼 바로 안내해 드릴게요."
2006403-58 = "자. 이쪽이에요."
2006403-59 = "소박한 공간이지만, 자연을 벗 삼아 휴식하기에는 정말 좋은 장소죠."
2006403-60 = "저도 가끔 개인 정원이 아닌, 이곳에서 시간을 보내기도 한답니다."
2006403-63 = "조용히 눈을 감고 자연의 소리를 듣고 있으면, 쌓였던 스트레스도 눈꽃처럼 금방 사라져요."
2006403-64 = "[s] \"우라라도 일 때문에 스트레스를 받는 모양이구나…….\""
2006403-67 = "아……. 그건……."
2006403-70 = "……네. 저도 사람이니까요."
2006403-73 = "아무래도 중간관리 업무를 많이 하다 보니……."
2006403-74 = "제가 이런 이야기 했다는 건…… 다른 분들에겐 비밀로 해주세요……."
2006403-75 = "으으…… 점점 비밀로 해달라는 것이 늘어나는 기분이 드네요."
2006403-76 = "[s] \"우라라는 비밀이 많은 소녀네~\""
2006403-77 = "그렇게 말씀하시는 선생님도 비밀이 많지 않은가요?"
2006403-78 = "차마 다른 사람에게는 이야기하지 못하는, 감추고 싶은 비밀이."
2006403-79 = "실제로 돌고 있는 소문을 생각하면……."
2006403-82 = "……."
2006403-85 = "……죄, 죄송해요. 차마 낯 뜨거워서 이야기를 못 하겠어요."
2006403-88 = "[ns] \"무슨 소문을 들었는진 모르겠지만 죄송합니다!\""
2006403-91 = "아, 아니에요. 멋대로 상상해 버린 제 잘못이죠."
2006403-92 = "[s11] \"아무튼 너무 부끄러워하지 마.\"\n[s12] \"우라라가 말했던 비밀은 상당히 소박한 편이니까.\""
2006403-97 = "……."
2006403-98 = "……그럴까요?"
2006403-99 = "선생님은 저를 신용하시는 건가요?"
2006403-100 = "제가 장미 화원을 보여드리지 않는 이유가, 사실 영화에서 봤던 돌연변이 식물을 키우고 있기 때문이거나……."
2006403-101 = "비밀결사 조직의 아지트가 숨어 있기 때문이라거나……."
2006403-102 = "화원의 어딘가에 다른 세계로 연결되는 입구가 있다거나……."
2006403-103 = "……그럴지도 모르는데요?"
2006403-104 = "[s] \"하하하! 우라라가 농담할 때가 있네!\""
2006403-105 = "후후……. 역시 제 농담은 금방 티가 나는 모양이네요. 배우로서 실력이 부족해요."
2006403-106 = "말주변을 좀 더 키워야 하는데……."
2006403-107 = "아무튼, 절 믿어준다고 하셔서 감사해요."
2006403-108 = "앞으로도 누구보다 믿음직한 평의회 임원이 될게요."
2006403-109 = "예술의 다양성을 인정받는 세상에서, #n누구나 공평하게 예술을 즐길 수 있는 날이 오도록……."
2006403-111 = "(이후 우라라 덕분에 순조롭게 업무를 마칠 수 있었다.)"
2006403-114 = "(그런데 이상하게도 그날은 묘한 꿈을 꾸었다.)"
2006403-115 = "(화원에서 돌연변이 식물을 수호하는 비밀결사 조직에 쫓기다 이세계로 빠지는 꿈이었다…….)"
