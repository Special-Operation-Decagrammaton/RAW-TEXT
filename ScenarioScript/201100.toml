201100-41 = ""
201100-42 = ""
201100-43 = "[ns1] \"ถอยไปซะ ออร์เวลล์\"\n[ns2] \"ถ้าแตะต้องนักเรียนของฉันละก็ ฉันไม่มีวันยกโทษให้แน่\""
201100-46 = "ทำเรื่องที่เสียมารยาทเข้าซะแล้ว กระผมไม่ได้คิดจะทำอันตรายใดเลย"
201100-47 = "ในฐานะที่เป็นทั้งผู้สังเกตการณ์ ผู้ค้นคว้า และ[ruby=เกมาเทรีย]นักวิจัย[/ruby] เมื่อได้เห็น 'สิ่งผิดแปลก' จึงเกิดความสนใจขึ้นมาก็เท่านั้นเอง"
201100-48 = "พักเรื่องการตีความเกี่ยวกับเธอเอาไว้ก่อน หากจะให้ตอบคำถามก่อนละก็..."
201100-49 = "ภาพจำลองไม่ใช่สิ่งที่ปกปิดความจริง แต่ภาพจำลองคือสิ่งที่เป็นจริงต่างหาก"
201100-50 = "หมายความว่ายังไงคะ? คุณกำลังบอกว่าประธานองค์การนักเรียนในตอนนี้คือตัวจริงเหรอคะ?"
201100-51 = "จริงหรือเท็จนั้นไม่สำคัญ มีเพียงความเป็นจริงเท่านั้นที่ดำรงอยู่"
201100-52 = "หลักฐานก็คือ... หลักฐานหรือเหตุผลที่จะปฏิเสธประธานองค์การนักเรียนคนปัจจุบันนั้น ไม่หลงเหลืออยู่ในโลกอีกแล้ว"
201100-53 = "อะไรกัน..."
