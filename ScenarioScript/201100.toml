201100-74 = "[ns6] \"อย่าให้ต้องถามซ้ำ\"\n[ns7] \"ตอนนี้ประธานองค์การนักเรียนอยู่ที่ไหน\""
201100-77 = "เข้าใจแล้ว..."
201100-78 = "กระผมไม่ค่อยชอบตัดสินสัญลักษณ์โดยเอาความสะดวกเข้าว่า แต่หากนั่นคือสิ่งที่คุณต้องการ ก็คงช่วยไม่ได้"
201100-79 = "มาลองตั้งสมมติฐานกัน"
201100-80 = "เมื่อผู้คนทั้งโลกเห็นพ้องต้องกันว่า <หงส์ขาว> คือความจริง วิธีที่ดีที่สุดในการพิสูจน์การมีอยู่ของ <หงส์ดำ> คืออะไรเล่า?"
201100-81 = "นำหงส์ดำมาให้เห็นด้วยตาเหรอคะ...?"
201100-82 = "ถูกต้อง วิธีที่ดีที่สุดในการปฏิเสธความเป็นจริง คือการแสดงตัวอย่างที่โต้แย้งขัดกับความเป็นจริง"
201100-83 = "ถ้าไม่อาจพา [ruby=ประธานองค์การนักเรียน]<หงส์ดำ>[/ruby] มาได้ในทันที... อย่างน้อยก็ต้องแสดงขนนกสีดำให้เห็นเพื่อโน้มน้าวจิตใจ"
201100-84 = "โลกใบนี้แปรเปลี่ยนไปอย่างกะทันหันเพียงชั่วข้ามคืน จึงยังมีข้อขัดแย้งที่เสมือนขนนกสีดำที่#nกระจัดกระจายอยู่ทั่วโลกอย่างไรเล่า"
201100-85 = "หากปล่อยทิ้งไว้ ข้อขัดแย้งเหล่านั้นจะถูกกัดกร่อนและเลือนหายไปในกระแสข้อมูล แต่หากบันทึกและเก็บไว้ ก็จะสามารถใช้เป็นแนวทางในการค้นหาแนวความคิดหลักได้"
201100-86 = "[s] \"แล้วจะหาข้อขัดแย้งพวกนั้นได้ยังไง...?\""
201100-87 = "เรื่องนั้นง่ายมาก เพียงแค่นำคทาศักดิ์สิทธิ์แห่งการสังเกตความจริงไปจุ่มลงท่ามกลางมหาสมุทรแห่ง#nข้อมูล ความจริงก็จะปรากฏออกมาเองโดยธรรมชาติ"
201100-88 = "มหาสมุทรแห่งข้อมูล... หมายถึงอินเทอร์เน็ตเหรอคะ"
201100-89 = "ถูกต้องแล้ว โดยเฉพาะอย่างยิ่งโซเชียลมีเดีย ก็ถือได้ว่าเป็น 'อโกรา' แห่งยุคปัจจุบัน ที่ซึ่งความปรารถนาและข่าวลือสารพัดในโลกหลั่งไหลมารวมกัน"
201100-90 = "ชุมชนเสมือนจริงที่บันทึกชีวิตประจำวันของเหล่าพลเมือง เหตุการณ์ที่เฝ้าสังเกต และความรู้สึกของ#nแต่ละบุคคลด้วยมุมมองบุคคลที่หนึ่งแห่งนี้ นับว่าไม่มีสิ่งใดขาดตกบกพร่องสำหรับการเป็นตัวแทนของ#nสังคมยุคปัจจุบัน"
201100-91 = "การที่ความลี้ลับที่คุณครูครอบครองอยู่ในรูปแบบของอุปกรณ์สื่อเช่นนี้ นั่นย่อมไม่ใช่เรื่องบังเอิญอย่างแน่นอน"
201100-92 = "จงตรวจสอบ รวบรวม และบันทึก"
201100-93 = "คทาศักดิ์สิทธิ์แห่งชาเคตจะเป็นผู้แยกแยะให้เองว่าขนนกนั้นเป็นสีขาวหรือสีดำ"
201100-94 = "และเมื่อบันทึกเหล่านั้นสั่งสมจนประกอบเป็น 'หงส์ดำ' ได้ในที่สุด... ชาวเมืองคนอื่นๆ ในคิโวทอส ก็จะรับรู้ถึง <ความผิดแปลก> เช่นกัน"
