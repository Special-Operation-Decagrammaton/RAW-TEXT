[translation]
201100-1 = "第10話;[ruby=Persona]假面[/ruby]舞會"
201100-2 = "飲料吧・「三合會」"
201100-3 = ""
201100-5 = "[ns] 「你說……歐威爾？」"
201100-6 = "您不必過於在意我的名字。#n重要的是「符號」。"
201100-7 = "為了避免您因為我的外貌而產生誤解，請容我補充一句。#n這個「電幕」並非單方面傳遞資訊的裝置。"
201100-8 = "它反而是透過觀察對方的樣貌蒐集資訊，從而實現交流的媒介。"
201100-9 = "就這層意義而言，這次我想向老師提出疑問。"
201100-10 = "您懷中的那份神祕……似乎和上次見面時有些不同了呢。"
201100-11 = "彷彿蘊藏著某種先前未曾擁有的嶄新可能──"
201100-12 = "[s] 「你知道關於『沙克德之杖』的事嗎？」"
201100-13 = "沙克德之杖……？您剛才說沙克德之杖……！？"
201100-14 = "哦哦……難以置信。#n我所聽到的名字，當真是那根「枝椏」沒錯嗎？"
201100-15 = "我知道老師身上擁有諸多不可解的力量……#n但那根枝椏，正是我所聽聞過最令人印象深刻的「象徵」呢！"
201100-16 = "本應握在聯邦學生會長手中的那根枝椏，如今就在這座聖櫃之中。#n那麼這無疑是……"
201100-17 = ""
201100-19 = ""
201100-20 = "……原來如此。是被「複製」的聖物嗎。"
201100-21 = "不過在這個影像取代現實的世界裡，那份複製正可謂更具真實價值的聖物呢。"
201100-22 = "……就如同「現今的聯邦學生會長」一般。"
201100-23 = ""
201100-25 = ""
201100-26 = ""
201100-27 = ""
201100-28 = "老師所展現的文本，總是超乎期待地跨越了既有窠臼呢。"
201100-29 = "你知道聯邦學生會長的下落嗎？"
201100-30 = "……嗯？那是什麼意思？"
201100-31 = "你剛才不是說了嗎。如今的聯邦學生會長，就如同取代了現實一般的複製品。"
201100-32 = "如果現在的聯邦學生會長是複製品，那麼真正的會長究竟在哪裡？"
201100-33 = "……哦？"
201100-34 = "隸屬於世界的存在，竟然否定世界的擬象。#n真是令人無法理解的現象呢。"
201100-35 = "你究竟是誰？為何能以現實的視點觀測非現實呢？"
201100-36 = "是從某人手中繼承了權能嗎？#n對象是老師嗎？還是聯邦學生會長？"
201100-37 = "若非如此就意味著你的某處已然損壞，以致於無法進行正常思考──"
201100-38 = "……！"
201100-39 = ""
201100-41 = ""
201100-42 = ""
201100-43 = "[ns1] 「退下，歐威爾。」\n[ns2] 「要是敢對我的學生出手，我絕不寬恕。」"
201100-46 = "哎呀，失禮了。我並無加害之意。"
201100-47 = "只是身為觀察者、探究者，以[ruby=蓋瑪特利亞]及研究者的[/ruby]本性使然，#n以至於每當發現「變異種」便會產生興趣罷了。"
201100-48 = "如果擱置對他的解讀，先就您的問題予以答覆的話……"
201100-49 = "擬象並非隱藏真實的存在。擬象本身反而才是真實的。"
201100-50 = "那是什麼意思？你是說現在的聯邦學生會長是本尊嗎？"
201100-51 = "是真是假並不重要。存在的就只有現實而已。"
201100-52 = "作為證據……能夠否定現今聯邦學生會長的根據或理由，已不存在於這個世界之中。"
201100-53 = "怎麼會……"
201100-54 = ""
201100-56 = ""
201100-57 = ""
201100-58 = "[ns] 「別轉移話題。」"
201100-59 = ""
201100-61 = ""
201100-62 = "[ns3] 「拯救學生，不需要什麼大義名分或華麗的辭藻。」\n[ns4] 「要是你敢再用『胡言亂語』試圖迷惑我……」\n[ns5] 「這場對話就到此為止。」"
201100-66 = "[ns] 「聯邦學生會長現在人在哪裡。」"
201100-67 = "您想知道的並非聯邦學生會長的所在地……而是在尋找能打破這個擬象的方法呢。"
201100-68 = "然而，老師您早已握有能夠打破擬象的手段了。"
201100-69 = "那座聖櫃中所封存的神祕，正是能使人觀察真實的「沙克迪亞的枝椏」。"
201100-70 = "若藉由那根枝椏觀察「IDEA」，擬象自然會如光中殘影般消散。"
201100-71 = ""
201100-74 = "[ns6] 「不要讓我重複相同的問題。」\n[ns7] 「聯邦學生會長現在人在哪裡。」"
201100-77 = "……我明白了。"
201100-78 = "雖然以便宜行事的方式裁定符號非我所願，既然您期望如此也無可奈何。"
201100-79 = "讓我們來做個假設吧。"
201100-80 = "當世上所有人都將「天鵝皆為白色」這個命題視為真理時，#n證明「黑天鵝」存在的最佳方法是什麼呢？"
201100-81 = "……直接展示黑天鵝給所有人看嗎？"
201100-82 = "正是如此。推翻既有認知最有效的方法，便是展示與現實形成對比的反例。"
201100-83 = "即使無法立刻將[ruby=聯邦學生會長]「黑天鵝」[/ruby]帶到眾人面前……#n至少也得展示出黑色羽毛才能產生說服力。"
201100-84 = "這個世界在昨夜驟然變貌，因此如黑色羽毛般的矛盾仍遍布於世界各地。"
201100-85 = "倘若對其置之不理，這些矛盾將在資訊的洪流中遭受侵蝕，最終消弭於無形。#n然而若能將其加以記錄並保存，便能作為尋找「IDEA」的指標。"
201100-86 = "[s] 「……要怎麼找出那些矛盾？」"
201100-87 = "很簡單。只要將能觀察真實的聖域浸入資訊之海，它自然會顯露其形。"
201100-88 = "資訊之海……你指的是網際網路嗎？"
201100-89 = "正是。尤其是SNS和社群媒體，可謂匯聚了世間各種欲望與傳聞的現代[ruby=Agora]廣場[/ruby]。"
201100-90 = "這個由人們以第一人稱記錄生活日常、所見所聞以及個人感想的虛擬社群……#n正是足以代表現代社會的縮影。"
201100-91 = "老師持有的神祕恰好具備這類媒體裝置的形態，我想這絕非偶然。"
201100-92 = "請去調查、蒐集並且記錄吧。"
201100-93 = "羽毛是白是黑，並非由您的主觀判斷，而是由沙克迪亞的聖域代為裁定。"
201100-94 = "當那些記錄逐漸堆積，最終形成一隻「黑天鵝」時……#n奇普托斯的其他市民們也將會察覺到「異變」才對。"
201100-95 = ""
201100-98 = "[ns] 「彩奈，這個方法會不會有什麼問題？」"
201100-100 = ""
201100-101 = "唔嗯……雖然有點可疑，不過在希迪姆的箱子安裝社群媒體程式本身應該沒有問題。"
201100-102 = "畢竟用來與學生溝通的MomoTalk，也能算是一種SNS。"
201100-103 = "不過要在網路上蒐集並整理不特定的資訊，#n就算是超級AI彩奈醬，恐怕也得花上一點時間呢……"
201100-104 = "嗚嗚……總覺得有種暑假快結束前，突然被指派了觀察牽牛花作業的感覺……"
201100-105 = "這點倒是不用擔心。"
201100-106 = "由於希迪姆的箱子的性能相較之前增強了不少，#n只要由我代理原本由前輩負責的部分業務，在時程方面應該不會有太大的問題。"
201100-107 = "其實為了減輕前輩的負擔，#n我從以前就一直想代替前輩處理學生管理、每日業務報告之類的工作了……"
201100-108 = "咦咦，星奈醬！你現在竟然連前輩的位置都盯上了嗎！？"
201100-109 = "就算星奈醬是優秀的AI操作員，老師專屬祕書的位置也不能讓給你哦！"
201100-110 = "……"
201100-111 = "但，但是！我可是包容心與能力一樣出眾的前輩。"
201100-112 = "如果只是輪流分擔的程度……分一些工作給你也不是不行啦。"
201100-113 = "謝謝你，前輩。"
201100-114 = "那麼導入嶄新的社群媒體功能，從機能層面來看可以視為沒有問題了。"
201100-115 = "請您做出決定吧，老師。"
201100-117 = ""
201100-118 = "[ns] 「好。我接受你的建議。」"
201100-119 = "真是明智的決定。"
201100-120 = ""
201100-122 = ""
201100-123 = ""
201100-124 = ""
201100-125 = ""
201100-126 = "能與老師一同踏上探究這個世界的神祕的旅程，我感到十分欣──"
201100-127 = ""
201100-129 = ""
201100-130 = "[ns8] 「我依然沒有要和你們這些傢伙合作的打算。」\n[ns9] 「我只是為了拯救學生，做我力所能及的事罷了。」"
201100-133 = ""
201100-135 = ""
201100-136 = ""
201100-137 = ""
201100-138 = "呵呵，這一點我當然理解。"
201100-139 = "畢竟稱職的大人，本來就不會將私人感情擺在公務之上。"
201100-140 = ""
201100-142 = ""
201100-143 = ""
201100-144 = ""
201100-145 = "……沒錯！"
201100-146 = "老師您這次能做出「理性的」判斷，我為此感到慶幸。"
201100-147 = "啊，為了不受偏見影響地蒐集隨機資訊，#n比起使用既有的名字，改用匿名的身分應該會更加合適。"
201100-148 = "作為您願意採納我建言的回禮……#n我會將我所持有的社群權限分享給您，還請您善加運用。"
201100-150 = "那麼，就請您好好享受媒體吧。"
