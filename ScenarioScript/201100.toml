201100-56 = ""
201100-57 = ""
201100-58 = "[ns] \"อย่าเบี่ยงประเด็นสิ\""
201100-59 = ""
201100-61 = ""
201100-62 = "[ns3] \"การช่วยนักเรียนไม่จำเป็นต้องมีเหตุผลสูงส่งอะไรทั้งนั้น\"\n[ns4] \"ถ้าพยายามทำให้สับสนด้วยเรื่อง <ไร้สาระ> อีกละก็...\"\n[ns5] \"การพูดคุยของเราคงจบลงตรงนี้\""
201100-66 = "[ns] \"ตอนนี้ประธานองค์การนักเรียนอยู่ที่ไหน\""
201100-67 = "เจ้าคงไม่ได้ถามหาที่อยู่ของประธานองค์การนักเรียน... แต่คงกำลังตามหาวิธีทำลายแบบจำลองนี้#nอยู่สินะ"
201100-68 = "คุณครูมีวิธีที่จะทำลายแบบจำลองได้อยู่แล้วนี่"
201100-69 = "ความลึกลับที่บรรจุอยู่ภายในหีบแห่งพันธสัญญานั่น คทาแห่งชาเคตที่ทำให้มองเห็นความเป็นจริงได้"
201100-70 = "หากใช้คทานั้นเฝ้าสังเกตความเป็นจริง แบบจำลองก็ย่อมมลายหายไป ราวกับเงาที่อยู่เบื้องหน้าแสงสว่าง"
