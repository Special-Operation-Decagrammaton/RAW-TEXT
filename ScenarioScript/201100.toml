[translation]
201100-1 = "Episode 10;Masquerade"
201100-2 = "Triad Drink Bar"
201100-3 = ""
201100-5 = "[ns] \"Orwell...?\""
201100-6 = "Names are only names. But Signs... Yes, Signs are all that matter."
201100-7 = "I wish for no misunderstandings. This telescreen is not a telescreen in the way you would know it."
201100-8 = "It does the opposite, in fact. It observes—gathers information and responds in kind."
201100-9 = "That said, I wish to ask you a question, Sensei."
201100-10 = "Your own Mystic... It too has changed. Ever so slightly, but I see it. I have observed."
201100-11 = "I see that new possibilities have been woven into its threads, ones previously unattainable."
201100-12 = "[s] \"Is there anything you know about the Staff of Shaqed?\""
201100-13 = "The STAFF of Shaqed...? The Staff of SHAQED...?!"
201100-14 = "My goodness. Doth my own ears betray me? Do you truly speak of the branch?"
201100-15 = "I see, I see. Yes, you who possesses inexplicable power... You also possess the Staff! A most impressive symbol! The most impressive, I must say."
201100-16 = "If that branch, which should be in the hands of the General Student Council President, is in this chest, this must be..."
201100-17 = ""
201100-19 = ""
201100-20 = "...I see. It is but a replication."
201100-21 = "But image replaces reality. And so, a replica becomes real."
201100-22 = "...Just like the current General Student Council President."
201100-23 = ""
201100-25 = ""
201100-26 = ""
201100-27 = ""
201100-28 = "The Texts you present me always transcend cliches in ways beyond my expectations."
201100-29 = "Do you know where the General Student Council President is?"
201100-30 = "...Hm? What do you mean?"
201100-31 = "You just said it. That the current President is a replica that replaces reality."
201100-32 = "If the current General Student Council President is a replica, then where is the real one?"
201100-33 = "...Hm."
201100-34 = "For an existence that belongs to the world to deny the world's Simulation. Phenomena! Inexplicable, all of them!"
201100-35 = "Who are you? Who are you, whose gaze holds so steady in the face of unreality?"
201100-36 = "Who gave you the authority? Sensei? Or the General Student Council President?"
201100-37 = "Ah. Perhaps those shattered pieces of you are so broken, you cannot properly reason—"
201100-38 = "...!"
201100-39 = ""
201100-41 = ""
201100-42 = ""
201100-43 = "[ns1] \"Step back, Orwell.\"\n[ns2] \"I will not forgive you if you harm my student in any way.\""
201100-46 = "Excuse me. I meant it not."
201100-47 = "It is simply in my nature as an observer, explorer, and a researcher to experience intrigue before a variant."
201100-48 = "Setting the interpretation aside, if I were to answer your question first..."
201100-49 = "The simulacrum is never that which conceals the truth. The simulacrum is the truth."
201100-50 = "What are you talking about? Are you trying to say that the current General Student Council President is the real one?"
201100-51 = "I tell no truth. I speak no lies. There is only reality."
201100-52 = "As its proof... There is no evidence nor reason in this world that can deny the current General Student Council President."
201100-53 = "That's..."
201100-54 = ""
201100-56 = ""
201100-57 = ""
201100-58 = "[ns] \"Don't change the topic.\""
201100-59 = ""
201100-61 = ""
201100-62 = "[ns3] \"You don't need grand causes or fancy rhetoric to save a student.\"\n[ns4] \"Stop blathering with your esoteric nonsense.\"\n[ns5] \"Or we're walking away, right now.\""
201100-66 = "[ns] \"Where is the General Student Council President?\""
201100-67 = "For you to be asking me of the General Student Council President's whereabouts... You are looking for a way to break this simulation."
201100-68 = "But you already possess the means to do so, Sensei."
201100-69 = "The mystic in that ark is the Branch of Shaqedia, which enables one to observe the truth."
201100-70 = "Use that branch to observe the Idea, and the simulacrum will vanish, like shadow before light."
201100-71 = ""
201100-74 = "[ns6] \"Don't make me repeat my question.\"\n[ns7] \"Where is the General Student Council President right now?\""
201100-77 = "...I understand."
201100-78 = "Although I am not a fan of reducing Signs to matters of expediency, I suppose I have no choice if that is what you desire."
201100-79 = "Hypothetically speaking."
201100-80 = "If everyone in this world believes \"swans are white,\" then how would one most efficiently prove the existence of a \"black swan?\""
201100-81 = "...Show them a black swan."
201100-82 = "Yes. The best method to deny reality is to present a counterexample to contradict it."
201100-83 = "But if you can't show them your black swan... Can you not at least present to them a black feather?"
201100-84 = "This world found its story rewritten, brutishly and suddenly, just last night. Contradictions are still scattered within the subtext."
201100-85 = "If left unattended, these contradictions would erode under the flow of information and fade away. However, if they are recorded and transfixed, then they will instead become guideposts that point to the Idea."
201100-86 = "[s] \"...And how do I find those contradictions?\""
201100-87 = "How does one ever find contradictions? They are everywhere, you need only look. Submerge yourself in the sanctuary of truth, which stands its lonely guard deep within the sea of information."
201100-88 = "\"Sea of information\"... You mean the internet."
201100-89 = "Yes! The modern Agora—social media! Where desires and rumors swirl together into their delightful vortex."
201100-90 = "An online community of citizens' daily lives, events, and personal impressions. It is truly a fitting representation of modern society, is it not?"
201100-91 = "Even the Mystic you carry takes the form of such a media device, Sensei."
201100-92 = "Investigate, collect, and record them."
201100-93 = "For it is not your belief, but the sanctuary of Shaqedia will determine whether the feather is black or white."
201100-94 = "The records will take the shape of the black swan, and other Kivotos citizens will see as you see."
201100-95 = ""
201100-98 = "[ns] \"Arona. Are there any concerns with this method?\""
201100-100 = ""
201100-101 = "...Not from what I can tell. It's definitely suspicious, but a single social media app shouldn't be able to affect the Shittim Chest."
201100-102 = "Technically, MomoTalk is the same sort of thing."
201100-103 = "But it'll take Super AI Arona a little bit of time to collect and process all that data from the internet."
201100-104 = "Ugh. It's like getting homework to observe a morning glory right before the end of summer vacation."
201100-105 = "Correction: it will be easy."
201100-106 = "The Shittim Chest has upgraded significantly. I will take over your \"Sensei tasks,\" and you will have ample processing power to complete the task."
201100-107 = "This is a good opportunity. I have been wanting to help with student management and daily reports, in order to lighten your workload."
201100-108 = "Ah, Plana! Are you trying to take my job from me?!"
201100-109 = "I don't care how great of an AI you are! I'll never hand the title of \"Sensei's Exclusive Secretary\" to you!"
201100-110 = "..."
201100-111 = "B-But!! Um! I'm just as understandable as I am super capable."
201100-112 = "So I suppose... We can take turns okay?"
201100-113 = "Thank you, Arona."
201100-114 = "That said, we can conclude that the new social media feature will not cause any functional issues."
201100-115 = "Please make your choice, Sensei."
201100-117 = ""
201100-118 = "[ns] \"Okay. I'll do it.\""
201100-119 = "An excellent choice."
201100-120 = ""
201100-122 = ""
201100-123 = ""
201100-124 = ""
201100-125 = ""
201100-126 = "I am quite thrilled to embark upon this journey of exploring the world's Mystics with none other than Sensei of Schale."
201100-127 = ""
201100-129 = ""
201100-130 = "[ns8] \"I still have no intentions of joining you.\"\n[ns9] \"I'm just doing what I can to save a student.\""
201100-133 = ""
201100-135 = ""
201100-136 = ""
201100-137 = ""
201100-138 = "Haha! That is a given."
201100-139 = "And mark of a true adult. You do not allow personal feelings to weasel their way into professional affairs."
201100-140 = ""
201100-142 = ""
201100-143 = ""
201100-144 = ""
201100-145 = "...But of course!"
201100-146 = "I am relieved that you have made a \"rational\" decision this time, Sensei."
201100-147 = "Ah. I do recommend you remain anonymous online. The celebrity of your name will make it difficult for you to discern the unbiased from fruitless opinion."
201100-148 = "Finally, as a token of appreciation, I will share access with my local instance with you. I do hope you find it useful."
201100-150 = "Well then, please enjoy."
