[translation]
201100-1 = "ตอนที่ 10;งานเต้นรำสวมหน้ากาก"
201100-2 = "บาร์นั่งดื่ม <ไทรแอต>"
201100-3 = ""
201100-5 = "[ns] \"ออร์เวลล์... เหรอ?\""
201100-6 = "ไม่ต้องใส่ใจชื่อของกระผมก็ได้  สิ่งสำคัญคือ <สัญลักษณ์> ต่างหาก"
201100-7 = "เผื่อว่าคุณจะเข้าใจผิดเพราะรูปลักษณ์ของกระผม ขอเสริมว่า 'เทเลสกรีน' เครื่องนี้ไม่ใช่สิ่งที่ปล่อย#nข้อมูลออกมาเพียงฝ่ายเดียวหรอก"
201100-8 = "กลับกัน มันคือวัตถุที่ช่วยให้เกิดการปฏิสัมพันธ์โดยการสังเกตและรวบรวมข้อมูลของอีกฝ่ายได้"
201100-9 = "ในแง่นั้น ครั้งนี้กระผมจึงอยากจะเป็นฝ่ายตั้งคำถามกับคุณครูบ้าง"
201100-10 = "ความลี้ลับในอ้อมกอดของคุณครู... ดูเหมือนจะต่างไปจากคราวก่อนเล็กน้อย"
201100-11 = "ราวกับมีความเป็นไปได้ใหม่ที่ก่อนหน้านี้ไม่มีบรรจุอยู่ในนั้น..."
201100-12 = "[s] \"รู้จัก <คทาแห่งชาเคด> รึเปล่า?\""
201100-13 = "คทาแห่งชาเคด...? เจ้าพูดว่าคทาแห่งชาเคดงั้นหรือ...?!"
201100-14 = "โอ้ เป็นไปได้อย่างไรกัน ชื่อที่ได้ยินเมื่อครู่นี้หมายถึงกิ่งไม้ในตำนานนั้นจริงหรือ?"
201100-15 = "กระผมรู้อยู่แล้วว่าคุณครูครอบครองพลังลี้ลับอยู่หลายประการ... แต่คทานั่นเป็น <สัญลักษณ์> ที่น่าประทับใจที่สุดที่เคยได้ยินมาเลยทีเดียว!"
201100-16 = "หากคทาที่เดิมควรจะอยู่ในมือของประธานองค์การนักเรียน กลับมาอยู่ในหีบแห่งพันธสัญญานี้ นั่นก็หมายความว่า..."
201100-17 = ""
201100-19 = ""
201100-20 = "อย่างนี้นี่เอง... เป็นวัตถุศักดิ์สิทธิ์ที่ <จำลอง> ขึ้นมาสินะ"
201100-21 = "ทว่า ในโลกที่ภาพเข้ามาแทนที่ความจริงเช่นนี้ สิ่งจำลองนั้นต่างหากล่ะ ที่นับว่าเป็นวัตถุศักดิ์สิทธิ์ที่มีคุณค่าอันสมจริงยิ่งกว่า"
201100-22 = "เช่นเดียวกับ 'ประธานองค์การนักเรียนในตอนนี้'..."
201100-23 = ""
201100-25 = ""
201100-26 = ""
201100-27 = ""
201100-28 = "ตัวบทที่คุณครูนำเสนอนั้นเหนือกว่าคำพูดซ้ำซากจำเจและเกินความคาดหมายเสมอมา"
201100-29 = "คุณรู้เบาะแสของประธานองค์การนักเรียนเหรอคะ?"
201100-30 = "หืม...? หมายความว่าอย่างไรหรือ?"
201100-31 = "เมื่อก่อนหน้านี้คุณพูดเองนี่คะ ว่าประธานองค์การนักเรียนในตอนนี้เปรียบเสมือนสิ่งจำลองที่เข้ามา#nแทนที่ความเป็นจริง"
201100-32 = "ถ้าประธานในปัจจุบันเป็นของจำลอง แล้วตัวจริงอยู่ที่ไหนคะ?"
201100-33 = "โฮ่..."
201100-34 = "ผู้ที่เป็นส่วนหนึ่งของโลกกลับปฏิเสธการจำลองของโลก ช่างเป็นปรากฏการณ์ที่เข้าใจได้ยากจริงๆ"
201100-35 = "เจ้าเป็นใครกัน? เหตุใดจึงมองสิ่งที่ไม่เป็นจริงด้วยสายตาแห่งความเป็นจริงกันเล่า?"
201100-36 = "เจ้าได้รับการถ่ายโอนอำนาจมาจากใครหรือ? คุณครู? หรือประธานองค์การนักเรียน?"
201100-37 = "หรือหากไม่ใช่ทั้งสองอย่าง... ก็คงเป็นอะไรที่เสียหายจนถึงขั้นที่ไม่สามารถคิดอย่างมีเหตุผลได้#nอีกต่อไป..."
201100-38 = "......!"
