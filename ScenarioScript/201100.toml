201100-100 = ""
201100-101 = "ค่ะ... ถึงจะฟังดูน่าสงสัยอยู่บ้าง แต่แค่ติดตั้งโปรแกรมโซเชียลมีเดียเพิ่มลงในกล่องแห่งซิสดิม ก็ไม่น่ามีปัญหาอะไรค่ะ"
201100-102 = "เพราะ MOMOTALK ที่ใช้สื่อสารกับเหล่านักเรียนก็เป็นโซเชียลมีเดียชนิดหนึ่งเหมือนกันค่ะ"
201100-103 = "แต่การรวบรวมและคัดกรองข้อมูลที่ไม่เฉพาะเจาะจงจากอินเทอร์เน็ต ต่อให้เป็นซูเปอร์ AI อย่างหนู#nก็คงต้องใช้เวลาหน่อยนะคะ"
201100-104 = "ฮือ... รู้สึกเหมือนได้การบ้านให้สังเกตดอกมอร์นิ่งกลอรี่ก่อนปิดเทอมฤดูร้อนจะจบลงเลย..."
201100-105 = "เรื่องนั้นไม่ต้องกังวลไปหรอกค่ะ"
201100-106 = "เนื่องจากฟังก์ชันของกล่องแห่งซิสดิมได้รับการยกระดับขึ้นมากกว่าเมื่อก่อนแล้ว หากฉันรับช่วงต่องานที่รุ่นพี่เคยรับผิดชอบอยู่ก็น่าจะไม่มีปัญหาใหญ่ในเรื่องปรับตารางงานค่ะ"
201100-107 = "ที่จริง ฉันอยากช่วยแบ่งงานต่างๆ เช่น การดูแลนักเรียน หรือการจัดทำรายงานประจำวันแทน เพื่อแบ่งเบาภาระงานของรุ่นพี่ค่ะ..."
201100-108 = "อ๊ะ พลาน่าจัง! ตอนนี้ถึงกับหมายตาตำแหน่งของรุ่นพี่แล้วเหรอคะ?"
201100-109 = "ถึงพลาน่าจังจะเป็น AI โอเปอเรเตอร์ที่ยอดเยี่ยมแค่ไหน แต่ตำแหน่งเลขาส่วนตัวของคุณครู ฉันไม่มีทางยกให้หรอกนะคะ"
201100-110 = "......"
201100-111 = "ตะ... แต่ว่าฉันก็เป็นรุ่นพี่ที่ใจกว้างพอๆ กับความสามารถที่มีเลยค่ะ"
201100-112 = "ถ้าเป็นการผลัดเวรรับผิดชอบ... ก็อาจแบ่งงานกันทำได้ค่ะ"
201100-113 = "ขอบคุณค่ะ รุ่นพี่"
