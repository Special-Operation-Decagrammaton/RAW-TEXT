[translation]
10052180-1 = "진노의 날"
10052180-2 = "[log][FF6666]새 하늘과 새 땅을 보니[/log]"
10052180-4 = "[log][FF6666]처음 하늘과 처음 땅이 없어졌고[/log]"
10052180-6 = "[log][FF6666]바다도 다시 있지 않을 것이다.[/log]"
10052180-13 = "어, 어어?! 뭐야, 이건??!!"
10052180-14 = "꺄아아아아악?! 우, 우리 지금…… 하늘로 들려 올라가고 있어!!!"
10052180-15 = "강철대륙의 에너지가…… 다시 제단으로 모이기 시작했어……!"
10052180-18 = "이 땅을 건너거든 황폐한 산 위에 제단을 쌓으라."
10052180-19 = "그 숯불이 네 입에 닿을 것이니, 너는 정결해지리라."
10052180-20 = "[ruby=CAST IN THE NAME OF GOD]신의 이름으로 이를 행하니,[/ruby] [ruby=YE NOT GUILTY]여기에 죄는 없도다 [/ruby]."
10052180-25 = "여기는……?"
10052180-26 = "……여기가 '제단'이구나. 말 그대로 탑의 꼭대기 그 자체……."
10052180-27 = "선생님은 아까, 이런 곳에 있었던 거네……."
10052180-28 = "[s] \"응. 그랬지…….\""
10052180-30 = "하, 하하하하, 하지만, 왜 우리를 이런 곳까지 끌어올린…… 걸까요?"
10052180-31 = "어쩌면 알 것도 같습니다. 자기에게 가장 익숙한 장소로…… '초대'한 셈이겠네요."
10052180-32 = "이런 표현이 맞을지는 모르겠습니다만, 엄청난 자의식 과잉입니다."
10052180-33 = "토, 토키 씨?! 그게, 맞는 말이기는 한데, 조금 더 때와 상황을……."
10052180-38 = "[ns] \"히마리! 수송선을 이곳으로 부를 수 있겠어?!\""
10052180-39 = "네? 네……. 그건 가능해요. 애초에 이 근처에 착륙시켜 두기도 했고요."
10052180-40 = "그런데 어째서……?"
10052180-41 = "[ns1] \"일단 수송선으로 돌아가! 그리고…….\"\n[ns2] \"우리가 모은 예언자들의 코어를 분석해서……!\"\n[ns3] \"원격으로 데이터 지원을 부탁해!\""
10052180-46 = "[ns] (그리고, 여차하면……!)"
10052180-47 = "그렇지만 갑자기, 어째서요……?"
10052180-48 = "(설마, 여차하면……?!)"
10052180-49 = "(그렇지만, 그러면 선생님은……?)"
10052180-50 = "……."
10052180-51 = "………."
10052180-52 = "…………."
10052180-53 = "……알겠습니다. 선생님."
10052180-54 = "유즈! 모모이! 미도리! 이리 오세요!"
10052180-55 = "어? 응? 우, 우리?!"
10052180-56 = "히마리 선배!? 저희는 어째서……?"
10052180-60 = "꺄아악?!"
10052180-64 = "……."
10052180-65 = "[ns] \"괜찮니?\""
10052180-66 = "……누가 누구에게 할 말인가요, 그거."
10052180-67 = "네. 뭐, 솔직히 죽을 것 같네요. 대충 팔다리에 500kg짜리 무게추를 달아 놓고 움직이는 기분이라고 할까요."
10052180-68 = "우리가 이러고 있는 중에도, 저 자식은 다시 두 번째 몸에 에너지를 집중하겠답시고, 그 잘난 에너지 기둥 안으로 숨어 버렸고요."
10052180-69 = "뭔가요, 저 자식. 정말이지. 세상 모든 게 자기를 위해 움직여 주지 않으면, 직성이 안 풀리는 무뢰한인가요, 뭔가요?"
10052180-70 = "케, 케이……? 정말 괜찮습니까……?"
10052180-71 = "괜찮아요. 안 괜찮지만 아무튼 괜찮다구요."
10052180-72 = "저 자식한테 뭐라도 한 방 날려 주지 않으면……!"
10052180-75 = "……."
10052180-79 = "………."
10052180-83 = "…………."
10052180-89 = "죽어도! 분이 안 풀릴 것 같으니까!!!"
