[translation]
1004102-1 = "육체의 감옥"
1004102-4 = "……."
1004102-5 = "[s] \"…….\""
1004102-6 = "……왜 이렇게 된 거지? 딱히 선생님을 만날 생각은 없었는데."
1004102-7 = "[s] \"어…… 그치만…….\""
1004102-8 = "왜 보자고 한 거야?"
1004102-9 = "나에게 뭘 원하는 거지?"
1004102-10 = "[s] \"따, 딱히……. 원하는 건…….\""
1004102-11 = "그럼 돌아간다."
1004102-12 = "[s] \"자, 잠깐만?!\""
1004102-13 = "……뭐지?"
1004102-14 = "[s1] \"미사키는 어쩐지……. 위태롭다고 해야 할까…….\"\n[s2] \"무슨 생각을 하는지 잘 모르겠다고 해야 할까…….\""
1004102-15 = "……그래서?"
1004102-16 = "……그래서?"
1004102-17 = "[s3] \"그러니까 뭔가 대화라던가, 미사키와 이야기를 해보고 싶어서…….\"\n[s4] \"조금 더 친해지고 싶달까…….\""
1004102-18 = "……."
1004102-19 = "……."
1004102-20 = "……하아."
1004102-26 = "말해두겠지만, 나는 다른 아이들의 안전을 책임지고 있는 입장이야."
1004102-27 = "우리는 숨바꼭질 중이고, 우리를 찾으려는 술래들이 눈에 불을 켜고 우리를 쫓아다니고 있으니까."
1004102-28 = "그래서 선생님, 당신이 나와 연락하고 있는 것은 원칙적으로 있어서는 안 되는 일이야."
1004102-29 = "하지만……."
1004102-30 = "뭐, 상관없겠지. 어차피 우리들의 목숨줄은 당신이 쥐고 있는 거니까."
1004102-31 = "그래, 내가 뭘 하면 되지? 어차피 오늘은 한가하니까. 어울려주겠어."
1004102-32 = "[s] \"음, 그러면 그냥 대화……?\""
1004102-33 = "……."
1004102-34 = "[s] \"아니면 내가 도와줄 거라도 있어?\""
1004102-35 = "딱히."
1004102-36 = "……. 아니, 도와줄 것이라. 그래. 하나 있긴 해."
1004102-37 = "[s] \"오! 다행이야! 뭐든지 말만 해줘!\""
1004102-38 = "그러면……."
1004102-41 = "……음. 오차 수정 완료."
1004102-42 = "[s] \"끝났어?\""
1004102-43 = "응. 우리가 가진 GPS 장비는 낡은 거라, 이렇게 높은 곳에서만 오차 수정이 가능하거든."
1004102-44 = "하지만 이 정도로 높은 건물에는 내가 쉽게 들어갈 수 없으니까. 오차가 벌어지는 걸 방치해두고 있었는데."
1004102-45 = "이걸로 길을 잃을 일은 한동안 없겠지. 덕분에 신세를 졌어."
1004102-46 = "[s] \"아니. 미사키의 도움이 될 수 있어서 안심했어.\""
1004102-47 = "……안심했다고? 왜?"
1004102-48 = "[s] \"그야…… 미사키는 무슨 생각을 하는지 잘 모르겠어서.\""
1004102-49 = "……그런가."
1004102-50 = "그래. 확실히 그런 인상이라고들 하더군. 누가 뭐라고 생각하든 관심없지만."
1004102-51 = "끝났으니 돌아가자."
1004102-52 = "[s] \"내, 내려가서 뭐라도 먹을까? 배고프지 않아?\""
1004102-53 = "아니. 관심 없어."
1004102-54 = "볼일이 끝났으면 내려가자."
1004102-58 = "[ns] \"……으, 으응.\""
1004102-63 = "……."
1004102-64 = "[s] \"…….\""
1004102-65 = "……."
1004102-66 = "……. 미안. 불편하지? 나랑 있으면 계속 이렇게 불편하기만 할 거야. 선생님."
1004102-67 = "나는 관심이 가는 것도, 흥미가 가는 것도 아무것도 없으니까."
1004102-68 = "아까 배고프지 않냐고 물었었지?"
1004102-69 = "……. 나는 그런 것에 관심이 없어."
1004102-70 = "배고프다고 해도, 죽지 않을 상태만 유지하면 되는 거지. 거기에 큰 의미는 없어."
1004102-71 = "[s] \"그치만 굶으면 건강을 해치잖아?\""
1004102-72 = "……. 그렇겠지. 그저 그뿐이야. 육체 따윈 어차피 흙이 될 뿐인 무의미한 그릇이니까."
1004102-73 = "[s] \"그렇구나…….\""
1004102-74 = "그래. 그런 거지."
1004102-75 = "[s] \"그럼 미사키가 중요하게 여기는 건 없는 거야?\""
1004102-76 = "……. 글쎄."
1004102-77 = "그런 게 있긴 할까?"
1004102-78 = "모든 것이 헛될 뿐……"
1004102-86 = "읏?!"
1004102-92 = "[ns] \"엘리베이터가 멈췄어?\""
1004102-93 = "……?!"
1004102-94 = "어, 어째서……?! 하필이면 지금……?!"
1004102-95 = "아, 아. 소방 방재 시스템의 오류로 건물의 전원이 내려갔습니다. 복구까지 1시간 정도 걸릴 예정입니다."
1004102-96 = "하, 한 시간……?! 자, 잠깐만!!"
1004102-97 = "기, 기다려! 지금……!"
1004102-98 = "[s] \"어쩔 수 없네.\""
1004102-99 = "어쩔 수 없는 게 아니잖아……. 한 시간이라니……."
1004102-100 = "[s] \"응? 어차피 오늘 한가하다고 하지 않았어?\""
1004102-101 = "그렇게 마, 말하긴 했지만……!"
1004102-102 = "지, 지금은……."
1004102-103 = "[s] \"마음을 내려놓고 기다리자. 곧 열어주겠지.\""
1004102-104 = "자, 잠깐만……. 그게……."
1004102-105 = "[s] \"응? 왜 그래? 아까부터 계속 안절부절…….\""
1004102-106 = "마, 말을…… 시키지……."
1004102-107 = "[s] \"……미사키? 그러고보니 안색이 창백한데?\""
1004102-108 = "……."
1004102-109 = "[s5] \"왜 그래? 무슨 일 있어?\"\n[s6] \"불편한 데라도 있어?\"\n[s7] \"어디 아픈 거야? 무슨 말이라도 해야 알지.\""
1004102-110 = "마, 말 시키지……."
1004102-111 = "마, 말 시키지……."
1004102-112 = "마, 말 시키지……."
1004102-113 = "나, 나는……."
1004102-114 = "[s8] \"지금? 응? 미사키 쨩, 지금 뭐?\"\n[s9] \"지금? 응? 미사키 쨩, 지금 뭐? 뭐가? 뭔데? 뭐야?\"\n[s10] \"지금? 응? 미사키 쨩, 지금 뭐? 말을 해 줘야 알지. 응? 응?\""
1004102-115 = "폐소 공포증이 있다고!"
1004102-116 = "폐소 공포증이 있다고!"
1004102-117 = "폐소 공포증이 있다고!"
1004102-118 = "[s] \"…….\""
1004102-119 = "……아. 더, 더 이상은……. 아, 안 돼……."
1004102-125 = "[ns] \"어?! 문이 열렸다-!\""
1004102-127 = "(치익) 어라, 엘리베이터에 갇혀 있는 분이 계셨군요. 이제 복구가 되었습니다! 불편을 끼쳐서 죄송합니다-!"
1004102-128 = "[s] \"어…… 음. 네. 감사합니다.\""
1004102-130 = "……."
1004102-131 = "[s11] 엎드려서 빈다.\n[s12] 바닥에 머리를 박는다."
1004102-132 = "선생님……."
1004102-133 = "선생님……."
1004102-134 = "[s] \"……저기. 미사키! 진짜 미안해. 그런 줄도 모르고 난…….\""
1004102-135 = "……아니. 됐어."
1004102-136 = "설마 지하 카타콤을 드나들었던 아리우스 출신이 폐소 공포증이 있을 거라곤…… 보통 생각하지 못할 테니까……."
1004102-137 = "……그냥 좁고 캄캄한 곳에 있는 게 생리적으로 힘들 뿐이야."
1004102-138 = "그래……. 말하자면 육체의 문제. 딱히 선생님 탓은…… 아니야."
1004102-139 = "[s] \"……으, 으응.\""
1004102-141 = "(미사키는 쓸쓸한 모습을 한 채 돌아갔다.)"
