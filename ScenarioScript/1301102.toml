[translation]
1301102-1 = "게이머의 일상"
1301102-2 = "밀레니엄 게임개발부"
1301102-4 = "[ns1] \"불러서 오긴 왔습니다만.\"\n[ns2] \"무얼 하려고 그래?\""
1301102-5 = "아. 어서 와, 선생님!"
1301102-6 = "아. 어서 와, 선생님!"
1301102-7 = "엣-헴! 오늘 하려는 건 딴 게 아니라."
1301102-8 = "공부야."
1301102-9 = "[s] \"공부?\""
1301102-10 = "맞아. 보다 재미있는 게임을 만들기 위한 공부."
1301102-11 = "좋은 게임을 만들기 위해 가장 필요한 건"
1301102-12 = "뭐니 뭐니 해도 다양한 게임을 플레이해보는 거라고 생각해."
1301102-13 = "[s3] \"정론인 걸.\"\n[s4] \"그냥 게임이 하고 싶은 거 아냐?\""
1301102-14 = "그치? 선생님도 그렇게 생각하지?!"
1301102-15 = "우웃! 무-우스-은 소리야!"
1301102-16 = "귀여운! 제자의 향상심을 칭찬해주지는 못할망정!"
1301102-17 = "칫칫. 우리 게임개발부가 레트로 게임 전문이긴 하지만."
1301102-18 = "아니……. 오히려 그렇기에 더욱 더!"
1301102-19 = "다양한 장르의 게임을 섭렵해 나가면서, 창작의 저변을 넓힐 필요가 있다는 말씀!"
1301102-20 = "그래서 준비한 게임이 바로 이거야!"
1301102-23 = "[s] \"다크니스 스피릿4……?\""
1301102-24 = "응! 스피릿-라이크계 게임의 명작! 다크니스 시리즈의 최신작이야."
1301102-25 = "이 게임의 매력은, 게임이 무지막지하게 어렵기로도 유명하지만!"
1301102-26 = "무엇보다 다크니스 시리즈는 시나리오적으로도 굉장히 독특한 작품이거든."
1301102-27 = "시나리오를 전면에 내세우지 않고, 어디까지나 여기저기 메모나 흔적 따위로 조사하게 만들어서……."
1301102-28 = "유저로 하여금 세계관의 내러티브를 따라가며 파고들게 만드는 것이……."
1301102-29 = "[s5] \"으, 으응. 그렇구나…….\"\n[s6] \"유저가 흥미를 가지도록 유도한다는 거지?\""
1301102-30 = "뭐, 뭐야. 그 식겁했단 표정은!"
1301102-31 = "말로 하는 것보다, 직접 해보는 게 빠르니까."
1301102-33 = "자, 곁에서 지켜보고 있으라구. 선생님!"
1301102-34 = "오! 잘 알고 있잖아! 선생님!"
1301102-35 = "응응! 그런 점에서 분명 참고할 수 있을 거야."
1301102-37 = "내가 플레이하는 걸, 곁에서 잘 지켜보고 있어. 선생님!"
1301102-40 = "앗, 첫 번째 적!"
1301102-41 = "어, 엄청 강해보여……."
1301102-42 = "하지만 바로 직전에 우물에서 포션병을 가득 채운 내게 무서운 적이란 없다!"
1301102-43 = "받아라앗!"
1301102-45 = "(쿵! 털썩!)"
1301102-47 = "「YOU DIED」"
1301102-48 = "아아아아앗?! 하, 한 방에 죽어버렸다고?!"
1301102-49 = "우, 웃기지 마! 다, 다시 해! 원 모어 찬스!"
1301102-51 = "후후후…… 이번엔 다를 거야!"
1301102-52 = "타이밍에 맞춰서 회피! 야호! 어떠냐!"
1301102-53 = "아앗! 잠깐?! 스, 스태미너가 부족해?!"
1301102-55 = "(쿵! 털썩!)"
1301102-57 = "「YOU DIED」"
1301102-58 = "뭐야! 이게!"
1301102-59 = "우으읏! 내가, 포기할까 보냐아앗!!"
1301102-61 = "「YOU DIED」"
1301102-62 = "우, 우우……"
1301102-63 = "[s] \"저기, 모모이?\""
1301102-64 = "선생님. 지금의 난…… 물벼룩이야……."
1301102-65 = "게임 첫 보스도 못 깨는…… 물벼룩……."
1301102-66 = "통산 34번째 게임 오버라니……."
1301102-67 = "앞으로 나갈 수가 없다니! 대체 게임 구조가 어떻게 되어 먹은 거야?!"
1301102-68 = "저 녀석, 분명 밸런싱 실패야! 너무 쎄잖아!"
1301102-69 = "[s] \"으음, 조금, 도와줄까?\""
1301102-70 = "……선생님이 도와줘?"
1301102-71 = "[s] \"도움이 안 될지도 모르지만, 혹시 모르니까.\""
1301102-72 = "윽……. 내가 못 깨는 걸 남에게 부탁한다……."
1301102-73 = "그건 게이머로서의 자존심이……!"
1301102-74 = "하지만, 이 뒤의 시나리오를 보려면 일단은 넘어가야……!"
1301102-76 = "후우……. 하, 하는 수 없지. 여기, 여기만이야 선생님!"
1301102-77 = "공부를 위해서! 여기만 대신 깨주기야?"
1301102-78 = "[s] \"응, 그러지. 뭐.\""
1301102-82 = "(휘이익, 쿵!)"
1301102-83 = "와……!"
1301102-84 = "와와와!!! 진짜로 쓰러트리다니! 굉장해! 선생님!"
1301102-85 = "[s7] \"뭐, 이쯤이야. 간단하지.\"\n[s8] \"자, 그럼 다시 모모이가……\""
1301102-86 = "앗! 선생님, 저기 봐. 구석에! 보물상자가 있어!"
1301102-87 = "앗! 선생님, 저기 봐. 구석에! 보물상자가 있어!"
1301102-88 = "[s] \"어? 진짜네.\""
1301102-89 = "앗! 새로운 적이다! 이번엔 비겁하게 화살을 쏘잖아?!"
1301102-90 = "[s] \"어엇?!\""
1301102-91 = "선생님! 해치워버려!"
1301102-93 = "응, 거기야, 선생님! 그 샛길에 숨겨진 통로가 있나 봐."
1301102-95 = "(와작와작우물우물) 아, 포테이토칩 명란맛 맛있다. 선생님도 먹을래?"
1301102-97 = "어? 선생님! 조심해! 새로운 보스야! 분명 전기 내성이 있을 거야!"
1301102-100 = "(시간이 흘러, 어느덧 TV에서는 웅장한 스탭롤이 흐르고 있었다.)"
1301102-101 = "[ns] \"다, 다 깼다…….\""
1301102-102 = "완전! 흥미진진한 시나리오였어! 굉장해! 선생님!"
1301102-103 = "[s] \"결국, 마지막까지 모모이를 대신해서…….\""
1301102-104 = "후아! 재밌었다!"
1301102-105 = "게임이란 건, 혼자 해도 재밌지만 역시 같이 해도 재미있네!"
1301102-106 = "자, 그럼."
1301102-107 = "[s] \"그럼?\""
1301102-110 = "곧바로 2회차, 시작이야. 선생님!"
1301102-111 = "참고로 이 게임은 2회차부터가 진짜래!"
1301102-112 = "[s] \"…….\""
1301102-115 = "(그렇게 모모이를 대신해서, 다크니스 스피릿4의 마지막까지 플레이를 했다.)"
