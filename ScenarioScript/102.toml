[translation]
102-1 = "물건 회수 특별의뢰"
102-2 = "총학생회 상황실"
102-3 = "학생들 사이에서 <슬럼피아> 라고 불리는 그 폐허 단지는 원래 모모 그룹에서 <유토피아>라는 이름으로 건설한 테마 파크였어."
102-4 = "물론 경영 부진으로 반년도 안 되어 폐업해버렸지만. (와작)"
102-5 = "문제는…… 최근 요상한 괴담들이 떠돌기 시작해서 말이야."
102-6 = "전기도 끊긴 시설의 기구들이 밤이면 혼자서 움직인다거나, 가까이 다가간 학생들을 삼켜 버렸다거나……."
102-7 = "멋대로 돌아가는 놀이 기구야 아무래도 상관없지만, 학생들이 사라지는 건 큰 문제니까."
102-8 = "선생이 가서 무슨 일이 일어나고 있는지 조사해줬으면 좋겠어."
102-9 = "뭐든 좋으니 혹시 단서를 발견하거든 바로 총학생회에 가져다줘."
