[translation]
51090-1 = "제9화;후와 렌게"
51090-2 = "……유카리, 네가 여긴 어쩐 일이야……?"
51090-3 = "저 유카리! 지금까지 렌게 선배를 찾아 문화계 동아리 이곳저곳을 돌아다니고 있었사와요!"
51090-4 = "그런데 설마 수행부 여러분과 함께 계셨을 줄이야."
51090-6 = "렌게 쨩이라면 바로 요전에 수행부의 활동을 경험해보고 싶다고 요청해 주셔서요."
51090-7 = "후아암. 그래서 지금…… 체험…. 입부 중이야…… 쿠울……"
51090-8 = "내가 찍은 수행부 홍보 영상이 도움이 된 게 분명해! 그치?!"
51090-9 = "그런데 두 분은 아는 사이셨군요. 그러고 보니 그 복장, 같은 물빛 하오리를 입고 계신 걸 보니……."
51090-10 = "와! 그렇네! 똑같아! 렌게 선배도 백화요란이었어?!"
51090-12 = "아, 그, 그건 그런데……."
51090-13 = "따, 딱히 숨기려고 한 건 아니지만……."
51090-14 = "과연, 청춘을 보내기 위한 활동이로군요?"
51090-15 = "……으으읏?!"
51090-16 = "자, 잠깐! 유, 유카리. 네가 그걸 어떻게."
51090-17 = "아까, 선배에게 볼일이 있어 자택까지 찾아갔었답니다!"
51090-18 = "그런데 집에는 안 계시고 문 앞에 <청춘을 찾기 위해 자리를 비운다>는 쪽지만 있다는 걸 발견했사와요!"
51090-23 = "그 직후, 렌게 선배가 체험 입부 했을지 모를 동아리를 이곳저곳 돌아다녔답니다!"
51090-24 = "[s] \"동아리 활동은, 확실히 청춘 활동이라 할 수 있으니까.\""
51090-25 = "청춘을 향한 렌게 선배의 올곧은 마음……!"
51090-26 = "네! 저 유카리도! 감동해서! 곧장 렌게 선배를 만나, 이야기를 나누고자……"
51090-27 = "아니아니! 살짝 낯간지러우니까 그렇게 청춘청춘 말하지 말아주라!"
51090-28 = "그 쪽지라면 나도 모르게 열 받아서 에라 모르겠다. 하고 쓴 거라고 할까……."
51090-29 = "학창생활이라는 건 아무것도 안 하는 사이에 금방 지나갈 수 있으니, 주의하라는 풍문을 들었다고 할까."
51090-30 = "[s] (풍문………?)"
51090-31 = "으으음! 그래. 뭘 부끄러워하고 있는 거람!"
51090-36 = "유카리, 네 말이 맞아. 난 청춘을 보내기 위해 수행부에 들어왔어."
51090-37 = "그간…. 땀내로 얼룩진 <동아리 활동>을 하느라 미처 제대로 즐기지 못했던 청춘을……. 나의 잃어버린 청춘을 되찾기 위해서 말이야!"
51090-38 = "……그러니까 유카리, 네가 무슨 생각으로 날 찾아왔는지는 모르지만. 난 이미 결정했어. 이곳 수행부에서 나의 남은 청춘을 보내기로. 그러니 얌전히 돌아……."
51090-40 = "앗, 수행부에서 하는 청춘 활동은 무엇인지, 저도 궁금한 것이어요!"
51090-41 = "너, 내 말 듣고 있는 거 맞지?!"
51090-42 = "하지만 렌게 선배의 활동이니, 무척이나 관심이 생기는걸요!"
51090-43 = "그, 그러니까…… 내가 하는 청춘 활동은 그게…… 나는……"
51090-44 = "나는……!"
51090-50 = "난 이곳 수행부에서 <잠을 푹 자는데 통달한 요조숙녀 배틀리스트>가 되기 위한 수행을 하고 있다고!"
51090-57 = "후엥?"
51090-58 = "후아암……."
51090-59 = "렌게 쨩…… 그런 목표를 가지고 있었던 거군요?!"
51090-60 = "[s] \"그건 요조숙녀야……? 배틀리스트야……?\""
51090-65 = "어느 쪽이든 상관없잖아!"
51090-66 = "뭐든 간에 처, 청춘이니까!"
51090-68 = "그런…… 그런……."
51090-69 = "물론 유카리, 네가 보기엔 이상하게 보일 수도……."
51090-70 = "깜짝 놀랄 정도로 굉장하여요! 목표를 향해 일직선으로 달리기를 주저하지 않는 그 모습!"
51090-71 = "역시나 제가 존경하는 렌게 선배답사와요!"
51090-72 = "어, 응……?"
51090-77 = "혹시 이걸 키쿄 선배는 이미 알고 계신가요?"
51090-78 = "키쿄 선배라면 분명 전력을 다해 응원……."
51090-80 = "해주겠냐! 그 녀석이야말로 이걸 알면 <훗> 하고 웃을걸? 의미심장하게! 제일로 알려주고 싶지 않은 녀석이라고!"
51090-81 = "그, 그보다 유카리! 다시 내 질문이야. 찾았다며. 날 찾은 이유가 뭐야?"
51090-82 = "네?"
51090-83 = "네? 라니…… 애당초……"
51090-84 = "우리가 하는 <동아리 활동>은 현재 휴업 상태잖아."
51090-85 = "그렇지 않아도 너라면 지금쯤 분명 축제 준비로 한창 바쁠……."
51090-87 = "와아- 와앗!"
51090-88 = "[s] \"………?\""
51090-89 = "흠흠, 렌게 선배를 찾은 일이라면 당연히 이유가 있답니다!"
51090-90 = "무엇을 숨기랴! 저 소녀 유카리! 렌게 선배의 도움을 받고 싶었기에 찾아뵈었사와요!"
51090-91 = "저…… 지금부터 <백화요란 계승전>을 진행할 생각이어요!"
51090-96 = "………………하아? 계승전?"
51090-97 = "잠깐 그게 무슨 소리야?"
51090-99 = "(우리는 렌게에게 음양부에서 있었던 일, 그리고 유카리가 선언한 이야기에 대해 전했다.)"
51090-101 = "키쿄 선배의 말이 맞았사와요!"
51090-102 = "나구사 선배는 정말로 대설원에 계셨던 것이어요!"
51090-104 = "…………."
51090-106 = "그러니 작금의 문제를 해결하기 위해, 다시 저희 백화요란이 원래대로 돌아가기 위해!"
51090-107 = "제가 <계승전>으로 나구사 선배를 쓰러트리고……"
51090-108 = "부장의 자리를 이어받겠사와요!"
51090-113 = "…………."
51090-114 = "렌게 선배! 같이 돌아가도록 하여요!"
51090-115 = "키쿄 선배가 있을 백화요란으로……! 부디 계승전의 보증인을……."
51090-116 = "유카리…… 너…… 아직도……"
51090-117 = "아직도 그런……"
51090-118 = "네!"
51090-123 = "아직도 그런 헛소리를 하는 거야?"
51090-128 = "……네?"
51090-129 = "유카리 너도 알다시피 백화요란은 이미 해산령이 내려졌어."
51090-130 = "키쿄가 직접 나서서 참모의 권한으로 결단을 내린 거야."
51090-131 = "네? 백화요란이……? 해산령을? 저, 그게 무슨……."
51090-132 = "[s] \"미모리, 여기엔 살짝 복잡한 사정이 있다고 할지…….\""
51090-134 = "그, 그럴 리가 없사와요!"
51090-135 = "렌게 선배! 해산령은 전부 착오라고……!"
51090-137 = "착오 같은 게 아니야."
51090-142 = "아야메 부장이 자취를 감추었을 땐…… 그럴 수 있다고 생각했어."
51090-143 = "부장은 대단한 사람이고…. 너도 그렇겠지만. 다들…… 부장은 언제 훌쩍 사라져도 이상하지 않은 사람이라고 생각하고 있었으니까."
51090-144 = "……!"
51090-145 = "하지만 그 자리를 이어받았어야 할 나구사 선배마저……. 남겨진 우리들은 돌아보지도 않고 부장을 찾겠다고 사라졌을 때."
51090-146 = "백화요란은 이미 끝났어. 전부 끝나버린 거야."
51090-148 = "그렇지…. 않사와요!"
51090-149 = "마, 맞아! 백화요란이 끝나지 않았다는 건…… 누구보다 렌게 선배가 방금 보여주시지 않았나요?!"
51090-150 = "망량즈……. 렌게 선배는 여전히 그 아이들을 막아섰을 정도로……! 백화요란으로서 책임감을!"
51090-152 = "아니, 착각하지 마."
51090-158 = "그건 내 청춘을 방해하려는 장애물을 치운 것일 뿐이니까. 나 자신을 위해 했던 일이야."
51090-160 = "렌게 쨩……."
51090-161 = "……."
51090-163 = "그치만…… 그치만…… 백화요란이 없으면 백귀야행의 평화는……."
51090-164 = "하, 그거야말로 웃기기 짝이 없는 착각이지."
51090-165 = "[s] \"착각이라니, 무슨 의미야……?\""
51090-166 = "샬레의 선생. 이라고 했었지."
51090-167 = "선생은 기억하고 있어? 예전에 하늘이 새빨개졌을 때를."
51090-168 = "……!"
51090-173 = "그때 백귀야행은 난리가 났었어."
51090-174 = "모두가 거리에서 나타난 괴물들을 보고는 사태를 해결해 줄 사람을, 백화요란을 애타게 찾았었지."
51090-175 = "하지만 부장도, 부부장도 사라진 우리들은…… 오합지졸처럼 우왕좌왕하기만 했었고……."
51090-176 = "나도, 키쿄도…… 유카리, 너까지도 어떻게든 사태를 해결하기 위해 노력하면서 뛰어다녔지만 그건 그냥 소수의 발버둥이었을 뿐이야."
51090-177 = "그 결과…… 어떤 일이 벌어졌는지 알아?"
51090-178 = "[s] \"……어떤 일이 벌어졌는데?\""
51090-179 = "아무 일도…… 전혀 아무런 일도 벌어지지 않았어."
51090-185 = "유카리, 너도 당사자니까. 이미 알고 있을 거야. 백화요란 따위가 없어도 문제를 해결하고 극복할 수 있다. 백귀야행에 별다른 문제는 일어나지 않는다."
51090-186 = "그래. 역설적으로 백화요란이 없었기에 증명되어 버린 사실이지."
51090-188 = "부장이 없어도, 나구사 부부장이 돌아오지 않아도…… 백화요란 따위가 없어도 손해 보는 사람은 없어. 아무도 필요로 하지 않아."
51090-190 = "그럼 이딴 동아리 활동……."
51090-191 = "기다리는 사람만이 괴로울 뿐인 동아리 같은 건 없어져도 상관없잖아."
51090-192 = "하지만…… 하지만."
51090-193 = "렌게, 렌게 선배도! 나구사 선배를 좋아하셨잖아요! 백화요란 활동을 좋아하셨잖아요!"
51090-195 = "렌게는…… 뛰어난 아이야. ……나 같이 어중간한 녀석보다 훨씬."
51090-196 = "그런 렌게가, 나는 자랑스러워. 유카리도 그렇게 생각하지?"
51090-197 = "네!"
51090-198 = "유카리, 그 말은 나구사 선배보다 렌게가 더 위라는 말이야."
51090-199 = "……네?!"
51090-200 = "아니, 진짜. 그만하라고. 다들. 듣는 사람이 무진장 부끄럽거든?!"
51090-201 = "진짜 잘난 사람에게 그런 말 들어봤자 낯간지럽기만 하다고."
51090-208 = "………후후."
51090-210 = "다 같이 순찰을 돌 때라면, 누구보다 먼저 앞서는 렌게 선배를……! 나구사 선배는 자랑스러워했었는데!"
51090-211 = "……!!"
51090-212 = "그딴 거 알 게 뭐야! 애당초 우리들은 버림받은 거야."
51090-213 = "과거는 과거일 뿐이야. 어차피 나구사 선배는 이젠 돌아오지 않은 걸 넘어서서……!"
51090-214 = "이미 그 사람은 ……을 반납하려고까지 했다고 그런데도 너는……!"
51090-215 = "[s] (……………반납?)"
51090-216 = "그치만……."
51090-217 = "오래 기다리긴 했지만. 그래도 나구사 선배를 만나. 이번 기회에 다시 모이기만 한다면……"
51090-218 = "그러기 위해 제가 <계승전>에서 승리하기만 한다면……! 그렇게만 하면 다시 그때로……!"
51090-219 = "……그때로 돌아갈 수 있을, 거라고………"
51090-221 = "……유카리. 넌 예전부터 그랬지. 옳다고 생각하는 게 있다면 멈추지 않고."
51090-223 = "언제나 자신감 있는 태도로……. 마음만 먹으면 뭐든지 할 수 있다고 생각하는……"
51090-224 = "절대로 자신을 굽히지 않는, 그런 녀석이었어."
51090-227 = "말뿐만이 아니라, 행동으로 보여주기 전까진 납득 안 하는 타입이니까."
51090-231 = "여기선 힘으로 이해하게 만들어 줄게."
51090-235 = "유카리. 간다!"
