[translation]
10057010-1 = "제1화;183호 특별반"
10057010-6 = "[ns1] \"추, 추워…….\"\n[ns2] \"이 방향이 맞니?\""
10057010-9 = "네. 방향은 정확합니다."
10057010-10 = "유일한 문제는, 도착까지 한참 남았다는 것입니다."
10057010-11 = "제가 떼를 쓰는 바람에 여기까지 오셔서……"
10057010-12 = "정말 죄송합니다, 선생님."
10057010-13 = "[s3] \"괘, 괜찮…… 괜찮아…….\"\n[s4] \"라나가 잘못한 게 아니…… 란다.\""
10057010-16 = "신호탄을 쏘겠습니다……."
10057010-23 = "이걸, 본…… 다면, 와줄 겁니다."
10057010-24 = "본다면…… 요……."
10057010-28 = "바람이……."
10057010-29 = "추운데, 졸음이……."
10057010-34 = "[ns5] \"자, 자자, 잠들면 안…… 돼…….\"\n[ns6] \"선생님이 몸으로 바람 막아줄 테니까…….\""
10057010-40 = "(졸리, 다…….)"
10057010-53 = "저기, 좀 일어나 줄래?"
10057010-54 = "흐읍, 아, 아냐. 안 잤거든?"
10057010-55 = "에휴, 난로만 틀면 바로 잠드시는구만?"
10057010-56 = "잔 거 아냐! 그 뭐더라, 그렇지! 명상하고 있던 거야!"
10057010-60 = "알 수 없는 곳"
10057010-63 = "라나는 어디 갔어?"
10057010-64 = "방금 일어나서 세수하러 갔어~"
10057010-65 = "심부름 다녀온다면서 한참 돌아오지 않더니……. 왜 이 사람하고 같이 있던 거지?"
10057010-66 = "이 사람 말야~ 뭔가 기…… 기……."
10057010-67 = "'기시감'?"
10057010-68 = "그래! 그거! 뭔가 기시감 엄청 들지 않아?"
10057010-69 = "그러게, 어디서 본 것 같긴 한데……. 누굴까……."
10057010-74 = "[ns] \"샬레의 선생입니다만…….\""
10057010-76 = "우, 우와아악!!!"
10057010-77 = "이, 일어나셨군요?!"
10057010-78 = "으아, 깜짝이야……! 정신이 들어요? 괜찮아요?"
10057010-79 = "[s] \"응, 몸도 다 녹았고 괜찮단다.\""
10057010-80 = "신호탄을 보고 나갔더니, 설산 중턱에 라나와 같이 쓰러져 있으셨어요. 정말 놀랐어요."
10057010-81 = "다행히, 라나도 무사하고요."
10057010-85 = "응? 그보다, 선생님……?"
10057010-89 = "그 샬레의 선생님?! 진짜로?!"
10057010-90 = "[s7] \"마, 맞긴 한데…….\"\n[s8] \"딱히 대단한 사람은 아닌데…….\""
10057010-93 = "와, 대박……!"
10057010-94 = "잡지에서 봤던 얼굴하고 비슷하다 싶었는데…… 설마……."
10057010-95 = "아, 맞다! 선생님, 선생님! '그 기사', 진짜에요?!"
10057010-96 = "[s] \"무슨 기사…….? 나에 대한 거야……?\""
10057010-97 = "'붉은 곰' 특집기사였는데요, 저희도 딱히 믿지는 않아요."
10057010-98 = "맞아 맞아! 붉은 곰은 말 그대로 불쏘시개로 쓰니까! 누가봐도 이상한 이야기라서 아무도 안 믿어요!"
10057010-99 = "그렇지만, 붉은 곰은 완전한 거짓말은 안 하는데……?"
10057010-104 = "[ns9] (기왕 붉은겨울에 온 김에,)\n[ns10] (꼭, 반드시 야쿠모를 보고 가야겠다.)"
10057010-109 = "아, 아하하하……!"
10057010-112 = "아, 아하. 충분히 이해했습니다. 나름 억울하신 사정이 있으셨군요."
10057010-113 = "앗, 죄송해요. 아직 자기소개를 안 했네요."
10057010-117 = "저는 183호 특별반의 반장이자 기계공학 주임인 안나입니다. 잘 부탁드려요."
10057010-118 = "붉은겨울 과학 아카데미의 수석 활동회원이자, 연방 명예 발명가이자, 1급 수염과학훈장 서훈에, 그리고-"
10057010-119 = "길어! 언제까지 하려고?!"
10057010-120 = "네에네에-! 저는 에리나!"
10057010-121 = "마찬가지로 183호 특별반이고, 일단은 부반장! 화학 주임입니다~! 이상, 끝!"
10057010-122 = "직함이 짧아서 좋겠네."
10057010-123 = "연구를 좀 열심히 했으면 자기소개가 길었겠는데 말이지?"
10057010-124 = "부러울 줄 아냐? 소개할 게 많으면 어제부터 자기소개하든지?"
10057010-125 = "[s11] \"183호 특별반?\"\n[s12] \"227호 특별반하고 비슷한 거니?\""
10057010-130 = "227호?"
10057010-131 = "뭐예요 그게?"
10057010-135 = "에츄!!!"
10057010-136 = "이불 안 덮고 자니까 그렇지."
10057010-137 = "으으…… 누가 우리 이야기를 하나?"
10057010-140 = "227호가 뭔지는 모르지만…… 저희 183호는 붉은겨울 유수의 연구조직이랍니다!"
10057010-141 = "붉은겨울의 최고 과학자들이 모여서 온갖 핵심 기술들을 개발하고 있어요."
10057010-142 = "나사못의 나사산부터, 먹고 마시는 모든 것, 전자와 전기까지, 다 우리가 만든답니다!"
10057010-143 = "에헴!"
10057010-145 = "[s] (두 사람, 죽이 되게 잘 맞는구나…….)"
10057010-148 = "야야, 샬레의 선생님이라면, '그거', 보여드리자!"
10057010-149 = "어, 어? '그거'?! 지금?"
10057010-150 = "자, 잠깐…… 만난 지 얼마 안 됐는데, 좀 이른 것 같은데……."
10057010-151 = "이런 건 조금 더…… 서로 간에 신뢰가 쌓여야……."
10057010-152 = "무슨 소리야! 오히려 보여드려야지! 우리 편은 많을수록 좋잖아!"
10057010-153 = "아, 안 돼! 지금 보여드리기엔 부끄러워!"
10057010-154 = "쫄? 보여준다고 닳는 것도 아니잖아! 선생님, 일단 따라오세요!"
10057010-159 = "선생님! 제 손 잡고, 눈 감고 따라오세요!"
10057010-160 = "[s] \"어?? 아, 알았어……?\""
10057010-164 = "아, 아직!!! 잠깐마안-!!"
10057010-170 = "선생님~ 아직이에요~!"
10057010-171 = "아직은 부끄럽다니까아!"
10057010-172 = "됐으니까 빨리 걷어 올리기나 해!"
10057010-173 = "으아~!! 진짜!! 난 몰라!!!"
10057010-177 = "선생님, 이제 눈 떠봐요!"
10057010-178 = "놀라서 넘어지시면 안 돼요?"
10057010-179 = "[ns13] (여차하면 바로 감을 기세로 천천히 눈을 뜬다)\n[ns14] (마지못해 눈을 뜬다)"
10057010-184 = "[ns] \"?\""
10057010-186 = "짜잔!! 어때요? 대단하죠! 놀랐죠!"
10057010-187 = "이 상태로 보여주면 김샐 거라니까! 진짜아!"
10057010-188 = "아니라니까! 그쵸 선생님! 이게 뭔지 느낌이 팍 오죠?"
10057010-189 = "[s15] \"으음…… 멋진 트랙터…… 구나?\"\n[s16] \"어…… 훌륭한 장갑차…… 구나?'"
10057010-194 = "실례예요!!!"
10057010-195 = "어딜 봐도 전차잖아요!"
10057010-196 = "이래서 초보자들은!"
10057010-197 = "[s] \"전차……?\""
10057010-198 = "네, 저희가 만들고 있는 전차예요."
10057010-199 = "지금 보시는 건 차체예요. 여기에 포탑만 올리면 되는데……."
10057010-200 = "이 정도면 충분해! 선생님이라면 진가를 아실 거야!"
10057010-201 = "[s] \"다, 다시 보니 아주 멋있구나!\""
10057010-205 = "그쵸!!"
10057010-206 = "포탑은 경사지게 만들 거예요. 탄이 미끄러져서 방어력이 올라가거든요."
10057010-207 = "? 그러면 실내가 좁아터지니까 반구형 포탑으로 하자고 했잖아!"
10057010-208 = "응? 뭐라구?"
10057010-209 = "'뭐라구?'는 무슨!"
10057010-216 = "선생님."
10057010-217 = "[s17] \"라나, 몸은 좀 괜찮니?\"\n[s18] \"라나, 이게 무슨 일이니?\""
10057010-220 = "저게 첫 번째 ‘의견 교환’입니다."
10057010-221 = "이제, ‘설득’까지 두 번 남았습니다."
