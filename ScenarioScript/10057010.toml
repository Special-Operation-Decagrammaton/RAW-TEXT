[translation]
10057010-1 = "第1話;183号特別クラス"
10057010-6 = "[ns1] \"寒っ……。\"\n[ns2] \"本当に、こっちで合ってるの？\""
10057010-9 = "はい。方向は合っています。"
10057010-10 = "問題は距離ですね。まだ時間がかかります。"
10057010-11 = "私が無理を言ったせいで――"
10057010-12 = "本当にすみません、先生。"
10057010-13 = "[s3] \"だ、大丈夫だよ……。\"\n[s4] \"ラナが悪いわけじゃないし……。\""
10057010-16 = "信号弾を撃ちます……。"
10057010-23 = "これで……助けに、来てくれるはずです。"
10057010-24 = "見ていたら……ですけど……。"
10057010-28 = "風が、強く……。"
10057010-29 = "だんだん、眠く……。"
10057010-34 = "[ns5] \"寝ちゃダメだよ……絶対……。\"\n[ns6] \"私が風避けになるから……。\""
10057010-40 = "（ねむ、い……）"
10057010-53 = "ねえ、起きてちょうだい。"
10057010-54 = "ふわぁ！？ね、寝てないけどぉ！"
10057010-55 = "はぁ……ストーブつけると、すぐ寝るよね。"
10057010-56 = "寝てたんじゃないよ！えーっと、なんだっけ……。#nそ、そう！[ruby=・]め[/ruby][ruby=・]い[/ruby][ruby=・]そ[/ruby][ruby=・]う[/ruby]してただけ！"
10057010-60 = "知らない所"
10057010-63 = "ラナは？"
10057010-64 = "さっき起きて、顔洗いにいったよ～"
10057010-65 = "買い物に行ってしばらく帰ってこないと思ったら……。#nなんで知らない人と一緒に戻ってきたんだろ？"
10057010-66 = "この人ってさ～、なんか、で……でじゃ……。"
10057010-67 = "「[ruby=デジャヴ]既視感[/ruby]」？"
10057010-68 = "それそれ！なんか既視感すごくない？"
10057010-69 = "たしかにどこかで見たことあるような……誰だったかしら……。"
10057010-74 = "[ns] \"シャーレの先生です……。\""
10057010-76 = "う、うわあああっ！！！"
10057010-77 = "お、起きていたんですか！？"
10057010-78 = "ビックリしたぁ～！もう平気なんですか？"
10057010-79 = "[s] \"うん、体も温まったから大丈夫。\""
10057010-80 = "信号弾を見て駆けつけたら、#n雪山でラナと一緒に倒れていたので本当に驚きました。"
10057010-81 = "ラナも無事でよかったです。"
10057010-85 = "というか、先生って……。"
10057010-89 = "あの、シャーレの先生！？ほんとに！？"
10057010-90 = "[s7] \"そ、そうだよ……。\"\n[s8] \"そんなに驚くようなことかな……。\""
10057010-93 = "ひゃ～、やば～"
10057010-94 = "雑誌で見たことある人に似ていると思いましたけど……まさか……。"
10057010-95 = "あ、そだ！せんせーせんせー！「あの記事」ほんとなんですかぁ！？"
10057010-96 = "[s] \"ど、どの記事……！？\""
10057010-97 = "「レッドベア」の特集記事のことです。#nもちろん、私たちは信じていませんが。"
10057010-98 = "そうそう！「レッドベア」なんて胡散臭い記事ばっかだし！"
10057010-99 = "まぁ、ガチの嘘はないって聞いたけど……。"
10057010-104 = "[ns9] （……）\n[ns10] （後でヤクモに話を聞かないと）"
10057010-109 = "あ、あはははは……。"
10057010-112 = "な、なるほど……。#n先生にもご事情があったんですね。"
10057010-113 = "あっ、すみません。#n自己紹介がまだでしたね。"
10057010-117 = "私は183号特別クラスの学級委員長で機械工学の主任、アンナと申します。#n以後お見知りおきを。"
10057010-118 = "レッドウィンター科学アカデミーの主席活動委員で連邦名誉発明家、#n第一級髭勲章を受賞、そして――"
10057010-119 = "長っ！いつまでやんの！？"
10057010-120 = "はいはーい！私はエリナ！"
10057010-121 = "同じく183号特別クラスの……副学級委員長兼、化学主任で～す！#n以上終わり！"
10057010-122 = "肩書が短く済んで良かったじゃない。"
10057010-123 = "研究を頑張ったらもっと長い自己紹介ができるのにねぇ？"
10057010-124 = "はぁ～？#n羨ましくないし！そんなに自己紹介が好きなら、ずっとしてればいいじゃん！"
10057010-125 = "[s11] \"183号特別クラス？\"\n[s12] \"227号特別クラスと何か関係があるの？\""
10057010-130 = "227号？"
10057010-131 = "なにそれ？"
10057010-135 = "くしゅっ！"
10057010-136 = "もう、布団掛けないで寝るからだよ。"
10057010-137 = "うぅ……誰かが私の噂でもしてるのかな？"
10057010-140 = "227号のことは分かりませんが……#n私たち183号はレッドウィンター有数の研究組織です。"
10057010-141 = "レッドウィンターきっての科学者が集まって、あらゆるコア技術を開発――"
10057010-142 = "ネジや飲食物をはじめ……電子機器、電気製品など様々なものを作っています。"
10057010-143 = "えっへん！"
10057010-145 = "[s] （息ぴったりだな……）"
10057010-148 = "ねえ、先生に「アレ」見せよーよ！"
10057010-149 = "え、「アレ」！？今！？"
10057010-150 = "ほ、ほら……会ったばっかりだし、ちょっと早すぎるんじゃ……。"
10057010-151 = "こういうのは……信頼関係を築いてからの方が……。"
10057010-152 = "何言ってんの、むしろ今見せないと！味方に引き込むのは早い方がいいって！"
10057010-153 = "だ、ダメ！やっぱりちょっと恥ずかしいわ！！"
10057010-154 = "ほら、覚悟決めて！見せたからって減るもんじゃないんだから！"
10057010-159 = "先生！私の手を握って、目をつぶったままついてきてください！"
10057010-160 = "[s] \"え？わ、わかった……？\""
10057010-164 = "だ、ダメだって！！ちょっと待ってちょうだい！！"
10057010-170 = "先生～、まだですよ～！"
10057010-171 = "ねぇ、やっぱりやめようってば！"
10057010-172 = "もう、いつまで言ってんの！早く準備して！"
10057010-173 = "もう、知らないんだから！！"
10057010-177 = "先生、もういいですよ！"
10057010-178 = "ビックリして腰を抜かさないでくださいね？"
10057010-179 = "[ns13] （恐る恐る目を開ける）\n[ns14] （やむを得ず目を開ける）"
10057010-184 = "[ns] \"これは？\""
10057010-186 = "ジャジャーン！！どうです？すごいでしょ！"
10057010-187 = "この状態で見せてもガッカリさせるだけなのに……！もう！"
10057010-188 = "そんなことないって！ねぇ先生！これが何なのか、分かりますよね？"
10057010-189 = "[s15] \"うーん……かっこいい、トラクター……かな？\"\n[s16] \"あ……すごい、装甲車……かな？\""
10057010-194 = "失礼な！！！"
10057010-195 = "どこからどう見ても戦車じゃないですか！"
10057010-196 = "これだから素人は！"
10057010-197 = "[s] \"戦車……？\""
10057010-198 = "ええ、私たちが製作中の戦車です。"
10057010-199 = "これは車体で、あとは砲塔を設置するだけなんですが……。"
10057010-200 = "これでも十分でしょ！先生なら分かってくれるはず！"
10057010-201 = "[s] \"あ、改めて見ると……すごくかっこいいね！\""
10057010-205 = "でしょう！？"
10057010-206 = "砲塔の装甲は傾斜させようと思っているんです。#nそうすると弾が滑るので、防御力が上がるんです。"
10057010-207 = "え～？それだと車内が狭くなるから半球形にしようって話し合ったじゃん！"
10057010-208 = "え？そうだっけ？"
10057010-209 = "すっとぼけんな～！"
10057010-216 = "先生。"
10057010-217 = "[s17] \"ラナ！体調は大丈夫？\"\n[s18] \"一体これは……？\""
10057010-220 = "あれが「意見交換」です。"
10057010-221 = "「説得」まで、あと2回やります。"
