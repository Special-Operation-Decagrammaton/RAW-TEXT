[translation]
10045105-2 = "으으윽……! 내가…… 이렇게……."
10045105-7 = "후우……."
10045105-8 = "이걸로 방해꾼은 사라졌군요."
10045105-9 = "그런 의미에서 여러분. 승부를 하죠."
10045105-10 = "선생님의 앞에서 누가 최강인지 가리는 거예요."
10045105-11 = "기, 기다려 주세요! 난입은 상정하지 않았는데……!"
10045105-12 = "저 와카모, 모두가 죄인이라 부르기에 이런 행사에 참여하는 건 불가능한 몸."
10045105-13 = "때문에 이렇게 잠시만이라도 선생님과의 축제를 즐기고 싶은데, 정녕 불가능한 것인가요?"
10045105-14 = "그, 그건……."
10045105-15 = "오오, 재액의 여우가 참가한다고?!"
10045105-16 = "보고 싶어! 무조건……!!"
10045105-17 = "해줘라! 해줘라!"
10045105-18 = "으으으, 관객들 반응까지 이런데……."
10045105-19 = "……어쩌면 축제를 더 달아오르게 할 수 있을지도."
10045105-20 = "알겠습니다! #n여러분의 성원에 힘입어…… 이벤트 매치를 진행하겠습니다!!"
10045105-21 = "와아아아아……!!"
10045105-23 = "[ns] \"그렇다면…… 부표 게임을 하자.\""
10045105-25 = "[ns1] \"여기서는 그걸로 최강자를 결정하고 있어.\"\n[ns2] \"와카모도 그 룰을 따르는 거야.\""
10045105-29 = "아아, 물론이죠."
10045105-30 = "이 와카모, 흔쾌히 따르겠습니다."
10045105-31 = "그것이 당신께 인정받는 방법이라면야."
10045105-32 = "[s] \"좋아. 그걸로 와카모가 만족한다면.\""
10045105-33 = "우후훗, 그럼 어느 분이 저와 겨루실 건지? 이 와카모, 누구와 겨루더라도 승리할 자신이 있습니다만."
10045105-34 = "그런 거라면……."
10045105-39 = "나구사 선배가……."
10045105-40 = "……재액의 여우, 와카모와?"
