[translation]
10016035-2 = "(경기를 관람하기 위해 관중석에 앉아 있었을 때……)"
10016035-7 = "아, 선생님. 여기에 계셨군요."
10016035-8 = "후후, 어제는 밤늦게까지 수고 많으셨습니다. 잠은 조금 주무셨나요?"
10016035-9 = "[s1] \"응, 학생들이 배려해 준 덕분에 잠깐 쉬었어.\"\n[s2] \"노아도 쉬었어?\""
10016035-10 = "네, 저도 개회식이 시작하기 전에 잠깐 눈을 붙였답니다."
10016035-11 = "네, 저도 개회식이 시작하기 전에 잠깐 눈을 붙였답니다."
10016035-12 = "눈을 붙이고 있는 사이에 뭔가 몇 가지 큰 소동이 지나간 것 같긴 하지만……"
10016035-13 = "그래도 다들 활기차고 즐거워 보여서 다행이네요."
10016035-14 = "[s] \"열심히 준비한 보람이 있었네.\""
10016035-15 = "그러게요. 그럼 이어지는 다음 경기는……"
10016035-16 = "어머나, <물건 빌려오기> 경주였군요."
10016035-17 = "휴식도 충분히 취한 것 같으니, 슬슬 나갈 준비를 해야겠네요."
10016035-18 = "[s] \"물건 빌려오기 경주에는 노아가 선수로 나가는 거야?\""
10016035-19 = "아뇨, 저는 선수가 아니라 심판으로 참여할 예정이랍니다."
10016035-20 = "본래는 게임개발부의 하나오카 양이 나갈 예정이었지만, 유우카 쨩의 강력한 요청이 있어서 유우카 쨩이 대신 나가게 되었어요."
10016035-21 = "후후, <물건 빌려오기>라…… 이 <물건 빌려오기> 경주는 매 황륜대제마다 숱한 화제를 낳는 인기 경기랍니다."
10016035-22 = "쪽지의 내용은 실행위원들도 알 수 없도록 추첨을 통해 정해지지만, 게임의 재미를 위해 '좋아하는 사람'이 적힌 쪽지를 하나 넣는 게 <황륜대제>의 불문율이거든요."
10016035-23 = "……과연 이번 경기에서는 유우카 쨩이 어떤 쪽지를 뽑을까 기대되네요."
10016035-24 = "그럼, 선생님. 앞으로도 계속 즐겁게 경기를 관람해주세요."
10016035-26 = "여러분, 오래 기다리셨습니다!"
10016035-27 = "지금부터 매회 선수들의 취향을 두고 화제를 몰고 다녔던 그 경기, <물건 빌려오기> 경주의 중계를 시작하겠습니다!"
10016035-28 = "경기의 인기를 방증이라도 하듯, 관중석의 분위기도 아까보다 훨씬 더 뜨겁게 달아올랐는데요!"
10016035-29 = "경기의 룰은 간단합니다! 트랙 가운데 있는 상자에서 특정한 키워드가 적힌 쪽지를 뽑고, 그 키워드에 부합하는 사람이나 물건과 함께 결승선을 통과하면 됩니다!"
10016035-30 = "단, 쪽지의 내용은 심판에게 보여줄 때까지는 발설해서는 안 된다고 하네요!"
10016035-31 = "앗. 말씀드리는 순간, 물건 빌려오기 경주에 참가하는 선수들이 트랙에 입장하고 있습니다!"
10016035-40 = "(물건 빌려오기의 출전권을 유즈가 양보해 줘서 다행이야.)"
10016035-41 = "(유즈, 낯선 사람에게 말 거는 데에는 익숙하지 않으니까……)"
10016035-42 = "(……밀레니엄 학원의 종합 우승을 위해서라도 이번 경기에선 질 수 없어!)"
10016035-46 = "(심판을 맡은 저 학생…… 분명 전에 보았던 세미나의 그 임원이지?)"
10016035-47 = "(학생회의 임원이 한 경기에 선수와 심판으로 함께 나오다니, 역시 수상해. 밀레니엄……)"
10016035-48 = "(무슨 흉계를 꾸미고 있는지는 모르겠지만, 피지컬로 밀어붙여 우승하면 그만이지!)"
10016035-52 = "(지난 대운동회의 결과 분석을 통해 쪽지에서 나올 수 있는 경우의 수는 모두 파악했습니다.)"
10016035-53 = "(이번 경기에서도 우승을 차지해서, 게헨나의 종합 우승을 확정 짓는 거예요!)"
10016035-57 = "자, 그럼 모두 준비하시고……"
10016035-58 = "출발!"
10016035-59 = "선수들, 신호탄이 터지는 것과 동시에 뽑기 상자를 향해 일제히 달려가고 있습니다!"
10016035-60 = "빠른 속도로 가장 먼저 상자에 도착한 선수는……"
10016035-61 = "SRT 특수학원의 소라이 사키 선수입니다!"
10016035-62 = "SRT 특수학원은 현재 폐교된 상태입니다만, 샬레의 도움을 받아 대운동회에 한해 임시로 SRT 학원의 이름을 사용하는 것이 허락되었는데요."
10016035-63 = "과연 사키 선수는 이번 경기를 통해 SRT 학원의 첫 승리를 거머쥘 수 있을까요?"
10016035-65 = "어디 보자, 가져와야 할 물건이……"
10016035-66 = "……4.2 인치 백린 연막탄? 이런 걸 경기장 어디에서 구해 오라는 거야?!"
10016035-67 = "땡~ 실격입니다!"
10016035-68 = "시, 실격?!"
10016035-69 = "경기 시작 전에 말씀드렸지만, 쪽지에 적힌 내용은 비밀로 한 채 결승선을 통과하는 게 <물건 빌려오기>의 규칙이랍니다."
10016035-70 = "쪽지에 적힌 내용을 다른 학생들이 알게 된다면 재미가 없으니까—"
10016035-71 = "아니, 다른 학생의 도움을 받을 수도 있으니까요."
10016035-72 = "아쉽지만 소라이 사키 양은 실격. 등외입니다!"
10016035-77 = "뭐 하는 거야, 바보 사키!"
10016035-78 = "역시 우리 네 사람만으로는 무리였나……"
10016035-79 = "수고하셨습니다, 사키."
10016035-80 = "아직 남은 경기는 많으니, 다음 경기에서 1등을 노리지요."
10016035-81 = "읏……"
10016035-82 = "하, 하지만 어차피 실격되지 않았어도 1등은 어려웠을 게 분명하잖아?"
10016035-83 = "경기장 내에 대구경의 백린 연막탄을 갖고 있는 사람이 있을 리도 없고—"
10016035-84 = "나, 하나 갖고 있는데?"
10016035-85 = "……넌 그걸 왜 갖고 있는데?"
10016035-89 = "사키 선수의 실격으로 승부는 다시 원점으로!"
10016035-90 = "이어서 상자에 접근한 밀레니엄 학원의 하야세 유우카 선수가 제비를 뽑습니다!"
10016035-94 = "하아, 하아…… 어디 보자. 가져와야 하는 물건은……"
10016035-95 = "어, 그러니까…… 이 사람도 아니고,"
10016035-96 = "이 사람도 아닌데……"
10016035-100 = "앗, 찾았다!"
10016035-107 = "선생님, 잠시 저랑 같이 가 주셔야겠어요!"
10016035-108 = "[s] \"나, 나 말이야?\""
10016035-109 = "네! 머뭇거릴 시간이 없어요! 어서요!"
10016035-114 = "유우카 선수, 쪽지의 내용을 확인하자마자 샬레의 선생님을 데리고 맹렬히 질주합니다!"
10016035-115 = "순위는 현재 1위! 하지만 과연 쪽지의 내용이 무엇이었기에 샬레의 선생님을 찾은 걸까요?"
10016035-116 = "……그리고 그대로 결승선을 통과! 잠정 1위입니다!"
10016035-117 = "하지만 맞는 물건을 빌려왔는지, 아직 심판의 확인이 남아 있습니다!"
10016035-121 = "흐음, 그렇군요……"
10016035-122 = "유우카 쨩은 그동안 [USERNAME] 선생님을 이렇게 생각하고 있었나 보네요. 후훗."
10016035-123 = "뭐, 뭐야? 어차피 내용은 주관적인 거잖아? 뜸 들이지 말고 빨리 결정하라고!"
10016035-124 = "네, 이상 없습니다. 하야세 유우카 선수, 1위입니다."
10016035-125 = "해냈다!"
10016035-129 = "……분명 '물건 빌려오기' 경주의 조건 중에는 '좋아하는 사람'이 있었지?"
10016035-130 = "매번 좋아하는 사람과 함께 결승선을 통과하고 커플이 되는 선수가 꼭 한 명씩은 있었죠."
10016035-131 = "다른 선수들이 뽑은 쪽지는 좋아하는 사람은 아닌 것 같고……"
10016035-132 = "분명 쪽지를 보자마자 선생님 방향으로 향했으니, 유우카 씨가 설마……"
10016035-133 = "자, 잠깐! 다들 무슨 오해를 하고 있는 거야?!"
10016035-134 = "내가 뽑은 쪽지에는 '좋아하는 사람'이 아니라 어른스러운—"
10016035-135 = "앗, 안 돼요. 유우카 쨩. 쪽지의 내용을 말하는 것은 룰 위반입니다."
10016035-136 = "물건을 가져온 선수가 어떤 쪽지를 읽었는지 추측하는 것까지가 <물건 빌려오기 경주>의 관전 포인트니까요."
10016035-137 = "결승선을 통과한 뒤에는 말해도 되는 거 아니었어?"
10016035-138 = "그리고 같은 밀레니엄 학생끼리 이렇게 깐깐하게 굴지 않아도 되잖아?"
10016035-139 = "안 됩니다. <황륜대제>는 모두에게 공평한 룰을 적용해야 하는 스포츠 대회니까요."
10016035-140 = "결과적으로 유우카 쨩의 부끄러운 마음이 드러난다고 해도 이를 예외로 해 드릴 수는 없어요."
10016035-141 = "그러니까 좋아하는 사람이 아니라고 몇 번을 말해도—"
10016035-142 = "[s] \"좋아하는 사람을 데려가는 게 아니었구나……\""
10016035-143 = "네, 네에?!"
10016035-144 = "아, 아뇨! 그러니까 선생님을 좋아하지 않는다는 뜻은 아니지만……"
10016035-145 = "아…… 그, 그게 아니라!"
10016035-146 = "……방금 한 말 들었어?"
10016035-147 = "경기의 핑계를 대지 않고, 솔직하게 대놓고 자신의 마음을 고백할 줄이야……"
10016035-148 = "……밀레니엄의 학생들은 생각보다 대담하네요."
10016035-149 = "그러니까 오해라니까!"
10016035-151 = "(이후, 부끄러워하며 횡설수설하는 유우카를 달래주느라 한동안 애를 먹었다.)"
