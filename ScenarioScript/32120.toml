[translation]
32120-1 = "제12화;다시 원점으로"
32120-2 = "(그렇게 해서, 다시 현재…….)"
32120-4 = "우울해!!"
32120-5 = "우울하고, 슬프고, 고통스러워!"
32120-7 = "아, 아우……. 그, 그러니까…… 지금 모인 건…… 그 퇴학을 막기 위해서니까……."
32120-8 = "조금만 다 같이 머리를 맞대고 방법을 찾지 않으면……."
32120-9 = "안 그러면 일주일 뒤에 저희는 사이좋게 전원 퇴학이……."
32120-10 = "머리를 맞댄다- 라는 표현 좀 답답하지 않나요? 애매하게 얼버무리는 부분이 있달까, 약간 비겁하달까……"
32120-11 = "여기서는 확실하게, 배를 맞댄다, 같은 표현이 좀 더……."
32120-16 = "하지 마! 음담패설은 사형이야! 금지야! 배를 왜 맞대는데? 어떻게 해야 그런 자세가 나오는데?"
32120-17 = "어머나? 역시 직접 실행해보지 않으면 상상하기가 힘든 걸까요? 코하루 쨩……?"
32120-21 = "……어? 어어?"
32120-24 = "하, 하지 마! 다가오지 마! 아, 알고 싶지 않으니까!"
32120-25 = "에잇♡"
32120-29 = "으, 으아아아! 하지 마! 살려줘, 도와줘, 선생님, 선배님! 잘못했어요……! 잘못했으니까……!"
32120-30 = "반말해서 죄송해요! 으아아아아- 이제 그만 용서해주세요……!"
32120-31 = "흠. 백병전에서 적을 제압하는 기술이었군. 공부가 되었어."
32120-32 = "하지만 나라면 거기서 관절부터 꺾겠어. 무의미한 손동작이 너무 많아."
32120-34 = "……."
32120-35 = "선생님……. 부디……."
32120-36 = "[s] \"……응. 노력해볼게. 히후미.\""
32120-37 = "감사합니다……."
32120-38 = "이대로 가다간…… 저희는 모조리 퇴학이니까요…… 아우우……."
32120-40 = "(그 후, 나기사를 만나려고 해보았지만 나기사가 어디 있는지도 알아낼 수 없었다.)"
32120-41 = "(마찬가지로 미카 또한 행방이 묘연한 상태였다…….)"
32120-43 = "별관 보충수업부 합숙소"
32120-44 = "다시 여기에 돌아왔네요."
32120-45 = "그렇군. 이제 안녕이라고 생각했는데, 이렇게 되어버리다니. 인생은 또한 예측하기가 힘든 것 같네."
32120-46 = "감상에 젖어 있을 때가 아니잖아! 이제 어떡할거야?!"
32120-47 = "티파티의 높으신 분이 우리를 퇴학시키려고 마음먹었다면, 이걸 막을 방법 같은 건 없잖아! 뭘 해도 소용없잖아!"
32120-48 = "마지막 평가 시험은 앞으로 일주일 뒤……. 이게 우리들의 마지막 기회……."
32120-49 = "이런 식으로 어떤 형태로든 방해하겠다면…… 확실히 저희가 손쓸 수 있는 방법은 많지 않을 것 같네요……."
32120-50 = "아우……."
32120-51 = "뭔데?! 뭔데 이렇게 된 거야?! 어째서 보충수업부를 퇴학시키려는 건데?!"
32120-52 = "<트리니티의 배신자>라니, 영문을 모르겠어! 왜 우리가 그런 의심을 받아야 하는 거야! 나는 하나도 모르겠다고!"
32120-53 = "이대로 퇴학당해버리면…… 정의실현부에는……. 두 번 다시……."
32120-54 = "코하루 쨩……."
32120-55 = "……."
32120-59 = "[ns] \"내 탓이야. 내가 괜히 나기사를 자극하는 바람에…….\""
32120-60 = "……아니에요. 선생님은 저희를 위해 대신 화를 내주신 거잖아요. 오히려 감사를 드려도 모자랄 지경이에요."
32120-61 = "그 자리에 제가 있었다면 그 암고양이에게 더 심한 짓을 했을지도 몰라요."
32120-62 = "……."
32120-63 = "앞으로 남은 일주일……. 이 안에 성적도 지금보다 더 올려야 하고……."
32120-64 = "네. 또한 나기사 씨가 이상한 짓을 하지 않을까 감시도 게을리하지 않으면 안 되겠네요……."
32120-68 = "흑……. 으흑……. 무리야. 지금보다 더 노력해야 한다니……."
32120-69 = "지금도 엄청 노력했는데…… 나는 더 이상은 무리라고……. 나는 바보라서 더 이상은 무리란 말야……. 으흐흑……."
32120-70 = "코하루……."
32120-71 = "코하루 쨩……."
32120-73 = "……일단 지금은 쉬도록 하죠."
32120-74 = "방법은…… 방법은 있을 거예요……. 아니, 있어야 해요. 제가 선생님과 함께 노력할 테니까……."
32120-75 = "히후미 쨩……. 히후미 쨩도 좀 쉬어야 해요. 지금까지 계속 무리해 온 건 히후미 쨩도 마찬가지니까요."
32120-76 = "아, 아우…… 그건 제, 제가 해야 할 일이니까……."
32120-77 = "……저도 방법을 같이 고민해볼게요. 코하루 쨩의 공부도, 히후미 쨩의 일도 제가 좀 더 도울테니까……."
32120-78 = "지금은…… 오늘은…… 히후미 쨩 말대로 일단 쉬도록 해요……."
32120-79 = "아, 아우……. 네. 그래요. 오늘은 이만 쉬는 걸로……."
32120-83 = "수고하셨습니다. 모두들."
32120-86 = "마지막 평가 시험, 앞으로 6일."
32120-90 = "……."
32120-95 = "……."
32120-98 = "다음화;그럼에도 불구하고"
