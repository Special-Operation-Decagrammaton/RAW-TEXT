[translation]
2005706-1 = "最棒的打掃方法"
2005706-3 = "所以我判定只剩下這個方法，於是就設置了塊狀炸藥……"
2005706-4 = "[s] 「我只問一件事……那個是什麼時候裝的……？」"
2005706-5 = "當然是在投入作戰的同時提前裝好的。"
2005706-6 = "[s1]（從一開始就滿腦子想著要爆破啊！）\n[s2]（這種話還是別說出口比較好吧……）"
2005706-9 = "雖然「打掃」本身進行得很順利……"
2005706-10 = "不過……還是因為善後處理的費用過高而收到了抗議。"
2005706-11 = "儘管部長說那種事不用在意，但是總不能一直這樣下去。"
2005706-12 = "就我個人而言……也不希望自己的形象，變成遇到問題都想「那樣」解決的人。"
2005706-13 = "同時，我也不想被定型為單純的「打掃狂」。"
2005706-14 = "[s] （至少他還是有點自覺的啊……）"
2005706-15 = "老師，我該怎麼辦呢。"
2005706-16 = "如果可以的話，我也想盡可能用和平且溫和的方式處理所有事情。"
2005706-23 = ""
2005706-24 = ""
2005706-26 = "唉呦喂……現在該怎麼辦？#n我們明明只是剛好路過這附近而已……"
2005706-28 = "就是說啊……所以我才說不該在黑市附近遊蕩的……"
2005706-29 = "沒想到會突然變成集體人質……"
2005706-31 = "吵死了！誰准你們說話了！"
2005706-32 = "要是不安分一點的話，我就用這個新開發的子彈……"
2005706-33 = "「癢癢步槍彈」讓你們的腋下和腳底癢到死為止！"
2005706-34 = ""
2005706-36 = ""
2005706-37 = "噫噫……！拜託千萬不要……！"
2005706-38 = "那個……老師……？"
2005706-39 = "[s] 「怎麼會變成這樣……」"
2005706-40 = "對不起……我應該把老師保護得更好的……"
2005706-41 = "[s] 「要是剛才處理不當的話，可能會牽連到更多市民……」"
2005706-44 = ""
2005706-45 = "投降吧！你們已經被包圍了！繼續扣押人質只會加重懲處而已！"
2005706-48 = "怎麼辦，老大？"
2005706-49 = "都已經走到這一步了，怎麼可能投降！#n我們只能做到底，沒有別條路了！"
2005706-50 = "事情就是這樣，女武神的麻雀們！#n要是敢不答應我們的要求，我們就不能保證人質的安全！"
2005706-51 = ""
2005706-53 = ""
2005706-55 = "老師……"
2005706-56 = "[s3] 「朱音……」\n[s4] 「這肯定是C&C應該出面的問題！」"
2005706-59 = "是的。"
2005706-60 = "……"
2005706-61 = "現在正是嘗試新方法的時候，對吧。"
2005706-63 = ""
2005706-65 = ""
2005706-66 = "那個……"
2005706-67 = "你是誰？"
2005706-68 = "各位從剛才開始，好像幾乎沒有和女武神的人進行溝通。"
2005706-69 = "如果雙方都願意各退一步好好談談，也許能找到共識不是嗎？"
2005706-70 = "你在說什麼啊？"
2005706-71 = "那些傢伙經常說的一句話不就是……「不和恐怖份子談判」嗎？"
2005706-72 = "那我們也一樣不會和麻雀談判！#n誰知道他們什麼時候會背叛我們！"
2005706-74 = "局外人滾一邊去！"
2005706-75 = "哎呀……"
2005706-76 = "[s] （沒那麼容易嗎……）"
2005706-79 = "女武神的學生中有幾位和我認識，要不要我試著聯絡看看呢？"
2005706-80 = "也許能讓事情圓滿結束哦？"
2005706-81 = "你嘴上這麼說，其實是打算暗中出賣我們吧。"
2005706-82 = "我一眼就看出來了。你的表情就是這麼說的。"
2005706-83 = "表情是嗎……好吧，我知道了。"
2005706-84 = "[s] （竟敢對我們朱音的表情有意見……！？）"
2005706-87 = ""
2005706-88 = "那麼……請求他們從寬處理怎麼樣呢？#n只要說明原因的話──"
2005706-89 = "要，要是在這裡退縮的話，我們組織的面子該往哪裡擺啊！"
2005706-90 = "什麼都不懂的平民少在那邊指指點點的！"
2005706-91 = ""
2005706-93 = ""
2005706-94 = "[ns] （如果朱音「認真」起來，面子什麼的就不重要了……）"
2005706-97 = "女武神的各位肯定也希望能圓滿解決事態。畢竟一直以來都是這樣的。"
2005706-98 = "如果能嘗試進行「交易」──"
2005706-99 = "到底交什麼易啊！"
2005706-100 = "那些傢伙就該完全屈服於我們才對！"
2005706-101 = "黑市是我們的地盤！裡面沒有任何一個歡迎女武神的蠢貨！"
2005706-102 = "還是說，你就是那些蠢貨中的其中一個？"
2005706-103 = "哈哈，啊哈哈……"
2005706-104 = "[s] （還真是敬酒不吃吃罰酒呢……）"
2005706-111 = "已經晚上了呢，老師。"
2005706-112 = "[s]「是啊。」"
2005706-113 = "我明天還要上學，今天的作業也還沒做完……"
2005706-114 = "[s] 「嗯，學習是學生的本分。」"
2005706-115 = "老師也要為明天的工作做準備對吧……"
2005706-116 = "該怎麼辦呢……？"
2005706-117 = "[s] 「朱音。」"
2005706-118 = "是的，老師。"
2005706-119 = "[s] 「上吧。」"
2005706-120 = "咦？"
2005706-121 = ""
2005706-123 = ""
2005706-124 = "……"
2005706-125 = "真的可以嗎？"
2005706-126 = "[s5] 「如果嘗試過其他方法還是行不通的話……」\n[s6] 「有時候必須得用稍微強硬一點的『方式』才行。」"
2005706-129 = "我知道了。"
2005706-130 = "「主人」。"
2005706-131 = ""
2005706-133 = ""
2005706-136 = ""
2005706-137 = ""
2005706-139 = ""
2005706-140 = ""
2005706-142 = ""
2005706-143 = ""
2005706-144 = ""
2005706-150 = "哇啊啊啊啊！？！？！？"
2005706-151 = "這，這是什麼情況！發生什麼事了！？"
2005706-152 = ""
2005706-157 = "快，快逃啊！那傢伙發瘋了！！！"
2005706-158 = ""
2005706-161 = "別丟下我啊！噫噫────！！！"
2005706-162 = ""
2005706-168 = "女，女武神！救命啊！投降，投降！我們無條件投降！"
2005706-169 = "所以拜託你們從那傢伙手裡保護我們！！！"
2005706-172 = ""
2005706-173 = ""
2005706-175 = "呼……"
2005706-176 = "果然炸彈才是最棒的打掃方法呢。"
