[translation]
2005706-1 = "สุดยอดวิธีทำความสะอาด"
2005706-3 = "ระเบิดก้อนที่ติดตั้งเอาไว้ มาจากการพิจารณาแล้วว่านี่เป็นวิธีเดียวเท่านั้นที่มีในตอนนี้..."
2005706-4 = "[s] \"ขอถามอะไรหน่อยสิ... ไปติดตั้งไว้ตั้งแต่ตอนไหนน่ะ...\""
2005706-5 = "ก็ติดตั้งไว้ตอนเริ่มลงมือปฏิบัติการน่ะสิคะ"
2005706-6 = "[s1] (คิดจะก่อเหตุระเบิดตั้งแต่เริ่มเลยสินะ!) \n[s2] (ถ้าพูดไปว่าคิดมาจากบ้านแล้ว ก็คงไม่ดีสินะ...)"
2005706-9 = "แน่นอนว่าผลลัพธ์คือ 'การทำความสะอาด' ที่ดำเนินไปอย่างราบรื่น"
2005706-10 = "แต่ว่า... ก็มีข้อร้องเรียนว่าค่าใช้จ่ายในการเก็บกวาดงานมันสูงเกินไปค่ะ"
2005706-11 = "ถึงหัวหน้าจะบอกว่าไม่ต้องใส่ใจเรื่องแบบนั้น แต่ฉันก็ปล่อยวางเรื่องนั้นไปตลอดไม่ได้ค่ะ"
2005706-12 = "แล้วเวลางานติดขัดขึ้นมา... ฉันก็ไม่อยากให้ภาพลักษณ์ของฉัน"
2005706-13 = "เป็น 'คนคลั่งระเบิด' ที่คิดถึงแต่ 'วิธีนั้น' ก่อนเป็นอันดับแรกค่ะ"
2005706-14 = "[s] (ยังไงก็ยังมีความตระหนักรู้อยู่ระดับหนึ่งสินะ...)"
2005706-15 = "ฉันควรทำยังไงดีคะ คุณครู"
2005706-16 = "ถ้าเป็นไปได้ ฉันก็อยากจัดการทุกอย่างอย่างสันติและราบรื่นที่สุดเท่าที่จะเป็นไปได้"
2005706-26 = "ตายจริง... ทำไมเป็นอย่างนี้ไปได้ล่ะ? เราแค่ผ่านมาแถวนี้เฉยๆ เอง..."
2005706-28 = "นั่นน่ะสิ... ก็เพราะอย่างนี้ไง ถึงไม่ควรเข้ามาเฉียดตลาดมืด..."
2005706-29 = "คิดไม่ถึงเลยว่าจู่ๆ จะตกเป็นตัวประกันแบบนี้..."
2005706-31 = "หุบปาก! ใครบอกให้พูด ฮะ!"
2005706-32 = "ถ้ายังพูดกวนใจอยู่อย่างนี้ละก็ เดี๋ยวได้เจอ 'กระสุนจั๊กจี้' ตัวนำร่อง..."
2005706-33 = "ที่โดนแล้วจะจั๊กจี้สีข้างกับฝ่าเท้าไปตลอดชีวิตเลย!"
2005706-37 = "สิ่งศักดิ์สิทธิ์... สิ่งศักดิ์สิทธิ์... ช่วยลูกด้วย...!"
2005706-38 = "เอ่อ... คุณครู...?"
2005706-39 = "[s] \"ทำไมถึงมาเจอเรื่องแบบนี้ได้ล่ะ...\""
2005706-40 = "ขอโทษด้วยค่ะ... ฉันควรจะคุ้มกันคุณครูไปในเส้นทางที่ดีกว่านี้แท้ๆ..."
2005706-41 = "[s] \"ถ้าเกิดอะไรขึ้นมา ชาวเมืองจะเดือดร้อนกันนะ...\""
2005706-45 = "ยอมจำนนซะ! พวกแกถูกล้อมไว้หมดแล้ว! ยิ่งจับตัวประกันไว้นานเท่าไร บทลงโทษก็จะยิ่งรุนแรงเท่านั้น!"
2005706-48 = "ทำยังไงดีล่ะครับ บอส?"
2005706-49 = "มาถึงขั้นนี้แล้วจะยอมแพ้งั้นเรอะ เหลวไหลสิ้นดี! เราจะไปให้สุด! ไม่มีวิธีอื่นแล้ว!"
2005706-50 = "ได้ยินมั้ยล่ะ พวกนกกระจอกวัลคิรี่! ถ้าไม่ทำตามข้อเรียกร้องของเราละก็ เราไม่รับประกันความปลอดภัยของตัวประกันหรอกนะ!"
2005706-55 = "คุณครู..."
2005706-56 = "[s3] \"ก็ได้ อาคาเนะ...\"\n[s4] \"ถึงเวลาที่ C&C ต้องออกหน้าแล้วละ!\""
2005706-59 = "ค่ะ"
2005706-60 = "..."
2005706-61 = "ถ้างั้นฉันจะใช้วิธีที่แตกต่างออกไปนะคะ"
2005706-66 = "อะแฮ่ม..."
2005706-67 = "เธอเป็นใครน่ะ?"
2005706-68 = "ดูเหมือนพวกคุณจะไม่พยายามที่จะเจรจากับตำรวจวัลคิรี่ที่อยู่ข้างนอกเลยนะคะ"
2005706-69 = "ถ้าเราลดความต้องการลงบ้างแล้วหันมาประนีประนอมกัน ฉันว่าน่าจะหาทางออกร่วมกันได้นะคะ?"
2005706-70 = "ว่าไงนะ?"
2005706-71 = "ก็อย่างที่พวกนั้นชอบพูดว่า... 'พวกเราไม่เจรจากับผู้ก่อการร้าย'"
2005706-72 = "รู้ไว้ซะว่าพวกฉันก็เหมือนกัน! ฉันจะไม่เจรจากับพวกนกกระจอกเด็ดขาด! พวกนั้นน่ะเผลอๆ จะมาแทงข้างหลังเอาด้วย!"
2005706-74 = "คนนอกน่ะออกไปเลย! "
2005706-75 = "แหะๆๆ..."
2005706-76 = "[s] (ไม่ง่ายเลยนะเนี่ย...)"
2005706-79 = "ฉันพอรู้จักนักเรียนวัลคิรี่อยู่บ้างค่ะ ให้ฉัน... ลองติดต่อให้มั้ยคะ?"
2005706-80 = "บางทีเรื่องนี้อาจจะจบลงด้วยดี โดยไม่มีฝ่ายไหนได้รับความเสียหายก็ได้นะคะ?"
2005706-81 = "ทำมาพูดจาสวยหรู แต่ลับหลังคงวางแผนส่งพวกฉันไปยื่นหมูยื่นแมวอยู่สินะ"
2005706-82 = "ฉันน่ะ มองคนออกตั้งแต่แวบแรกที่เห็นเลยละ แล้วหน้าตาของเธอก็ฟ้องอยู่ทนโท่ด้วย"
2005706-83 = "หน้าตา... งั้นเหรอคะ... ค่ะ อย่างนั้นสินะคะ"
2005706-84 = "[s] (หน้าตาของอาคาเนะมันเป็นปัญหายังไง...?!)"
2005706-88 = "ถะ... ถ้างั้นละก็ ฉันว่าการพูดความจริงอย่างตรงไปตรงมาและขอความเห็นใจจากทางนั้นก็น่าจะดีกว่า#nหรือเปล่าคะ?"
2005706-89 = "จะ... จะแนะนำอะไรก็ไว้หน้ากันบ้างสิ ถ้าให้ถอยเอาตอนนี้ ชื่อเสียงองค์กรฉันก็เสียหายยับเยินกันพอดี!"
2005706-90 = "เธอน่ะแค่คนนอกที่ไม่รู้อะไรเลย อย่ามาแส่ดีกว่า!"
2005706-94 = "[ns] (ถ้าอาคาเนะ 'จริงจัง' ขึ้นมา น่าจะไม่ 'ไว้หน้า' เลยนะ...)"
2005706-97 = "ฉันว่าตำรวจวัลคิรี่ก็อยากแก้ไขสถานการณ์ด้วยสันติวิธีเหมือนกันค่ะ ที่ผ่านมาวัลคิรี่ก็ทำแบบนี้#nมาตลอดเลยนี่คะ"
2005706-98 = "ถ้าลองหา 'ข้อเสนอ' อะไรมาแลกละก็..."
2005706-99 = "ข้อเสนองั้นเรอะ หมายความว่ายังไง! "
2005706-100 = "พวกนั้นต่างหากที่ต้องยอมก้มหัวให้พวกฉันอย่างเต็มใจ!"
2005706-101 = "ตลาดมืดเป็นอาณาเขตของฉัน ไม่มีคนโง่ที่ไหนในตลาดมืดที่จะต้อนรับนกกระจอกวัลคิรี่พวกนั้นหรอก!"
2005706-102 = "มาแนะนำอย่างนี้ หรือว่าเธอจะเป็นคนโง่ที่สุดในบรรดาคนโง่ทั้งหมด?"
2005706-103 = "แหะๆ แหะๆๆ..."
2005706-104 = "[s] (นักเลงพวกนี้นี่ ชักจะทนดูไม่ได้แล้วนะ...)"
2005706-111 = "เริ่มมืดแล้วสินะคะ คุณครู"
2005706-112 = "[s] \"นั่นสินะ\""
2005706-113 = "พรุ่งนี้ฉันต้องไปโรงเรียน แล้วการบ้านของวันนี้ฉันก็ยังไม่ได้ทำเลยด้วย..."
2005706-114 = "[s] \"อื้อ นักเรียนต้องไปโรงเรียนและทำการบ้านอยู่แล้ว\""
2005706-115 = "คุณครูเองก็ต้องเตรียมตัวให้พร้อมสำหรับการทำงานเหมือนกันค่ะ"
2005706-116 = "เราจะทำยังไงดีล่ะคะ...?"
2005706-117 = "[s] \"อาคาเนะ\""
2005706-118 = "ค่ะ คุณครู"
2005706-119 = "[s] \"จัดการเลย\""
2005706-120 = "คะ?"
2005706-124 = "..."
2005706-125 = "คุณครูไม่ว่าอะไรเหรอคะ?"
2005706-126 = "[s5] \"ถ้าลองทุกอย่างแล้วแต่ยังไม่ได้ผล ก็ต้องทำแบบนี้ละ\"\n[s6] \"บางครั้งเราก็ต้อง... เลือกใช้ 'วิธีที่เด็ดขาด' แบบนี้ละ\""
2005706-129 = "เข้าใจแล้วค่ะ"
2005706-130 = "'นายท่าน'"
2005706-150 = "ว้ากกกกก?!?!?!"
2005706-151 = "อะ... อะไรน่ะ! นี่มันอะไรกัน!!!"
2005706-157 = "นะ... หนีเร็ว! นักเรียนคนนั้นบ้าไปแล้ว!!!"
2005706-161 = "อย่าทิ้งฉันไว้คนเดียวสิ! เฮือกกกกก!!!"
2005706-168 = "วะ... วัลคิรี่! ช่วยด้วยครับ! ยอมแล้ว ผมยอมจำนนแล้ว! มาจับผมไปเลยครับ!"
2005706-169 = "ได้โปรดละ ช่วยปกป้องเราจากนักเรียนคนนั้นด้วยเถอะครับ!!!"
2005706-175 = "ฮู่ว"
2005706-176 = "ระเบิดเป็นวิธีทำความสะอาดที่ดีที่สุดตามคาดเลยนะคะ"
