[translation]
2005706-1 = "The Best Cleaning Method"
2005706-3 = "...So after much deliberation, the only logical conclusion was to use the block-shaped bombs that were installed—"
2005706-4 = "[s] \"Hold! I have a question! When did you even install those?\""
2005706-5 = "Naturally, as soon as we deployed on this mission."
2005706-6 = "[s1] \"(So she was always going to blow everything up!)\" \n[s2] \"(...I probably shouldn't say that aloud.)\""
2005706-9 = "We finished the cleaning without any issues."
2005706-10 = "However, we've received complaints about exorbitant repair costs on our missions."
2005706-11 = "The president brushed it off, but we can't sweep financial matters under the proverbial rug forever."
2005706-12 = "And, on a more personal level, I do tend to revert to more familiar methods when I come up against...stubborn stains."
2005706-13 = "I wish to avoid being known as a certain type of cleaner."
2005706-14 = "[s] \"(So she IS self-aware...)\""
2005706-15 = "How should I approach this, Sensei?"
2005706-16 = "I do wish to conduct myself as gently and peacefully as possible."
2005706-26 = "Oh man, oh man. What do we do? We were totally innocent..."
2005706-28 = "We should've known better than even coming close to the Black Market..."
2005706-29 = "I didn't think we would become HOSTAGES, though..."
2005706-31 = "Shut up! Who said you guys could talk? "
2005706-32 = "If you keep annoying me like this, I'm going to take these things here..."
2005706-33 = "...these Tickle Rifle Rounds, and fire them at your weak spots until you die!!"
2005706-37 = "Please... No...! That's cruel and unusual punishment!"
2005706-38 = "Um... Sensei...?"
2005706-39 = "[s] \"I really, really wonder how we got here...\""
2005706-40 = "It's my fault for not protecting you properly... I apologize."
2005706-41 = "[s] \"No, no. Keeping civilians safe should always be your priority.\""
2005706-45 = "Give it up! You're surrounded! The worse off those hostages are, the worse your sentences will be!"
2005706-48 = "What should we do, Boss?"
2005706-49 = "We can't turn back now! We're gonna see this through to the end!"
2005706-50 = "Did you hear that, Valkyrie cops?! If YOU don't give up and fulfill our demands, you'll never see these hostages again!"
2005706-55 = "Sensei..."
2005706-56 = "[s3] \"Yeah, Akane...\"\n[s4] \"This looks like a job for C&C!\""
2005706-59 = "Yes."
2005706-60 = "..."
2005706-61 = "But in a way that's different from how I would usually approach it, correct?"
2005706-66 = "Um..."
2005706-67 = "What do you want?"
2005706-68 = "I couldn't help but notice how you've been engaged in an exchange of words with the good people of Valkyrie."
2005706-69 = "Perhaps you can gain ground in this negotiation with a little bit of compromise."
2005706-70 = "What did you say?"
2005706-71 = "Don't you know those bozos' favorite saying? \"We don't negotiate with terrorists!\""
2005706-72 = "Well, guess what?! We don't negotiate with cops neither! They'll just turn around and stab us in the back the first chance they get."
2005706-74 = "Stay back! "
2005706-75 = "Ahaha..."
2005706-76 = "[s] \"(I guess it was never going to be that easy.)\""
2005706-79 = "You know, I do have a contact in Valkyrie. Perhaps I could reach out to them?"
2005706-80 = "I believe we'll be able to come to an agreement that's favorable to all parties."
2005706-81 = "Sure, easy for you to say, but I know you'll sell us down the river the first chance you get."
2005706-82 = "I can tell just by looking at you. It's written all over your face!"
2005706-83 = "My face... Yes, I see..."
2005706-84 = "[s] \"(What about her face?!)\""
2005706-88 = "Well... It'd be best in the long run for you to turn yourself in and hope for leniency, no?"
2005706-89 = "A-And how would that look to the organization? Everyone will judge us!"
2005706-90 = "Ugh! Why am I even talking about this with some random civilian?"
2005706-94 = "[ns] \"(If you upset Akane, your reputation will be the least of your worries...)\""
2005706-97 = "All Valkyrie wants is for this to end smoothly. That's how they operate."
2005706-98 = "If you're willing to make a trade..."
2005706-99 = "A TRADE?! "
2005706-100 = "Hell no! Either they meet our demands, or no deal!"
2005706-101 = "After all, y'all are in our territory now! No one in the Black Market is bending over for some Valkyrie brass!"
2005706-102 = "Are you actually just an idiot? An idiot among idiots?"
2005706-103 = "Haha, ahaha..."
2005706-104 = "[s] \"(Why these little...!)\""
2005706-111 = "It's growing dark, Sensei."
2005706-112 = "[s] \"Yes, it is.\""
2005706-113 = "It's a school night, and I haven't finished my homework yet..."
2005706-114 = "[s] \"And nothing is more important for a student than studying.\""
2005706-115 = "I'm sure you have plenty to do for work as well..."
2005706-116 = "What should I do...?"
2005706-117 = "[s] \"Akane.\""
2005706-118 = "Yes, Sensei."
2005706-119 = "[s] \"Teach them a lesson.\""
2005706-120 = "Huh?"
2005706-124 = "..."
2005706-125 = "Are you sure?"
2005706-126 = "[s5] \"If you've exhausted all of your options...\"\n[s6] \"In life, there are times you need to force your way through.\""
2005706-129 = "Understood."
2005706-130 = "Master."
2005706-150 = "EEEK?!"
2005706-151 = "Wh-What's going on?! What is all this?!"
2005706-157 = "R-Run! That girl's losing it!"
2005706-161 = "Don't leave me behind! GAAAHHH!"
2005706-168 = "V-Valkyrie! Hey! Save us! We surrender! We give up! Unconditionally!"
2005706-169 = "So please protect us from that girl there!"
2005706-175 = "Phew."
2005706-176 = "Bombs truly are the best cleaning method."
