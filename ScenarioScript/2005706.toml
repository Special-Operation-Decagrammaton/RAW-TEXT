[translation]
2005706-1 = "최고의 청소법"
2005706-3 = "……그래서, 이제는 이 방법밖에 없다고 판단해서 설치해 둔 블록형 폭약을……."
2005706-4 = "[s] \"하나만 묻겠는데…… 그거 설치는 언제 했어……\""
2005706-5 = "당연히, 작전 투입과 동시에 미리 설치해 뒀죠."
2005706-6 = "[s1] (시작부터 이미 터트릴 생각 가득이었구나!)\n[s2] (같은 나쁜 말을 하면 안 되겠지…….)"
2005706-9 = "물론 그 결과 '청소' 자체는 수월하게 진행되었습니다만."
2005706-10 = "아무래도…… 후속 처리 청구 비용이 너무 과다하게 들어간다고 항의가 와서 말이죠."
2005706-11 = "부장님은 그런 거 신경 안 써도 된다고 하시지만, 언제까지나 그렇게 넘어갈 수도 없는 일이고."
2005706-12 = "저도 제 이미지가…… 조금 진행이 막힌다 싶으면, 일단 '그' 생각부터 하고 본다는."
2005706-13 = "단순 '청소광'으로 굳어지는 것은 피하고 싶어서요."
2005706-14 = "[s] (일단 최소한의 자각은 있었던 거구나…….)"
2005706-15 = "정말, 어쩌면 좋을까요. 선생님."
2005706-16 = "저도 가능하면 평화적이면서도 완만하게 모든 일을 처리하고 싶은데요."
2005706-26 = "아이구, 아이구…… 어떡하죠? 우린 그저 이 근처를 지나가고 있었을 뿐인데……."
2005706-28 = "그러게 말이에요…… 이래서 블랙마켓 주변으로 다니는 게 아니었는데……."
2005706-29 = "이렇게 갑자기 단체 인질이 되어 버리다니……."
2005706-31 = "시끄러워! 누가 떠들래!"
2005706-32 = "자꾸 그렇게 신경 쓰이게 하면, 지금 시범 장착 중인……."
2005706-33 = "'간질간질 소총탄'으로, 평생 옆구리와 발바닥을 간질거리게 만들어 줄 테니까!"
2005706-37 = "아이구, 아이구……. 그것만은 제발……!"
2005706-38 = "저…… 선생님……?"
2005706-39 = "[s] \"정말로 어쩌다 이렇게 된 걸까…….\""
2005706-40 = "죄송해요……. 제가 조금 더 잘 호위해 드려야 했는데……."
2005706-41 = "[s] \"잘못했으면 더 많은 시민이 휘말렸을 테니까…….\""
2005706-45 = "항복해라! 너희는 이미 포위되었다! 인질을 억류할수록 처벌이 가중될 뿐이다!"
2005706-48 = "어떻게 할까요, 보스?"
2005706-49 = "여기까지 와서 항복이라니, 말이 되나! 우리는 끝까지 간다. 그것 말고는 방법이 없어!"
2005706-50 = "그렇다고 하신다, 발키리 참새 녀석들아! 우리 요구를 들어주지 않으면, 인질의 안전은 보장 못 해!"
2005706-55 = "선생님……."
2005706-56 = "[s3] \"그래, 아카네…….\"\n[s4] \"이건 분명, C&C가 나서야 할 문제야!\""
2005706-59 = "네."
2005706-60 = "……."
2005706-61 = "지금까지의 저와는, 조금 다른 방식으로, 말이죠?"
2005706-66 = "저……."
2005706-67 = "넌 뭐야?"
2005706-68 = "조금 전부터 계속, 바깥의 발키리 분들과 의견 교환을 거의 안 하시는 것 같은데요."
2005706-69 = "서로가 바라는 것을 조금 내려놓고 이야기하면, 합의점을 찾을 수 있지 않을까요?"
2005706-70 = "뭐라고?"
2005706-71 = "저 녀석들이 자주 하는 말이 있지……. '테러리스트와는 협상하지 않는다.'"
2005706-72 = "우리도 마찬가지야! 참새 녀석들과는 협상하지 않아! 언제 무슨 뒤통수를 어떻게 쳐 올 줄 알고!"
2005706-74 = "들어가 있어!"
2005706-75 = "아하하……."
2005706-76 = "[s] (호락호락하지 않네…….)"
2005706-79 = "발키리 학생 중에 저와 면식이 있는 분이 좀 계시는데요. 한번…… 연락이라도 해 볼까요?"
2005706-80 = "어쩌면 서로 크게 손해 보지 않고, 원만히 끝날 수도 있지 않을까요?"
2005706-81 = "그렇게 말하면서 뒤로는 몰래 우리를 팔아넘길 생각이겠군."
2005706-82 = "나는 안다. 한눈에 척 보면 느낌이 온다고. 네 관상이 바로 그렇게 말하고 있으니까."
2005706-83 = "관상, 인가요……. 네. 그렇군요."
2005706-84 = "[s] (우리 아카네가 관상이 어쩌고 어째……?!)"
2005706-88 = "그, 그런 일이라면 지금이라도 솔직하게 이야기하고, 정상 참작을 구하는 것이 좋지 않을까요?"
2005706-89 = "여, 여기에서 물러나는 모습을 보이면, 우리 조직 체면이 말이 아니게 된다고!"
2005706-90 = "아무것도 모르는 민간인 주제에!"
2005706-94 = "[ns] (아카네가 '진심'이 되면, 체면이 중요한 게 아닐 텐데…….)"
2005706-97 = "발키리 분들도 분명 원만하게 사태를 해결하고 싶어 할 거예요. 지금까지 늘 그래왔으니까요."
2005706-98 = "분명 '거래' 같은 것이라도 시도해 본다면……!"
2005706-99 = "거래라니, 무슨 말인가!"
2005706-100 = "저 녀석들이 우리에게 완전히, 100%로 굽히고 들어와야 하는 것이다!"
2005706-101 = "블랙마켓은 우리 구역이고, 발키리 참새 녀석들을 환영하는 멍청이는 블랙마켓에는 한 명도 없어!"
2005706-102 = "아니면, 그건가? 네가 바로 그 멍청이 중 가장 큰 멍청이인 건가?"
2005706-103 = "하하, 아하하……."
2005706-104 = "[s] (보자 보자 하니, 이 녀석들 봐라……?)"
2005706-111 = "벌써 밤이 되어 가네요, 선생님."
2005706-112 = "[s] \"그러게.\""
2005706-113 = "저, 내일 등교도 해야 하고, 오늘 숙제도 못 끝냈는데……."
2005706-114 = "[s] \"맞아. 공부와 등교만큼 학생에게 중요한 건 없지.\""
2005706-115 = "선생님도 출근 준비라든가 하셔야 할 거고요."
2005706-116 = "어떡하죠……?"
2005706-117 = "[s] \"아카네.\""
2005706-118 = "네. 선생님."
2005706-119 = "[s] \"가라.\""
2005706-120 = "네?"
2005706-124 = "……."
2005706-125 = "괜찮으시겠어요?"
2005706-126 = "[s5] \"다른 모든 것을 시도해 봤는데도 안 된다면.\"\n[s6] \"때로는…… '조금 강한' 수준으로 나가야 할 때도 있는 법이다.\""
2005706-129 = "알겠습니다."
2005706-130 = "'주인님'."
2005706-150 = "으아아아아악?!?!?!"
2005706-151 = "뭐, 뭐야! 이건 대체 다 뭐냐고!!!"
2005706-157 = "도, 도망쳐! 저 학생, 미쳤어!!!"
2005706-161 = "날 두고 가지 마! 히이이이이익–!!!"
2005706-168 = "바, 발키리! 살려 줘요! 항복, 항복합니다! 무조건 투항합니다!"
2005706-169 = "그러니까 제발 저 학생으로부터 우리를 지켜 줘요!!!"
2005706-175 = "후우."
2005706-176 = "역시, 폭탄이야말로 최고의 청소법이죠."
