[translation]
1013305-1 = "사고 실험"
1013305-2 = "(시간에 맞춰 리오가 있는 격납고로 향했다.)"
1013305-6 = "아. 왔구나."
1013305-7 = "지금 AMAS의 AI 알고리즘을 업데이트 중이야."
1013305-8 = "이곳에서 입수한 정보 중엔 생소한 것이 많아서……."
1013305-9 = "이렇게 관련 데이터를 업데이트해 줘야 제대로 정보를 처리하거든."
1013305-14 = "[ns] \"오, 움직인다.\""
1013305-16 = "응. 하지만 이걸로 끝이 아니야."
1013305-17 = "추가된 데이터를 잘 인지하고 있는지 검증하는 작업도 거쳐야 해."
1013305-18 = "정해진 명령만 수행하는 약인공지능의 한계라고 할까."
1013305-19 = "[s] \"약인공지능?\""
1013305-20 = "특정 규칙에 따라 정해진 작업을 수행하는 AI를 말해."
1013305-21 = "각자 전문화된 분야가 있고, 그 분야에서는 인간을 뛰어넘는 월등한 성능을 보이지."
1013305-22 = "하지만…… 학습된 데이터를 기반으로 작동하기에, 인간과 같은 창의적인 사고는 하지 못해."
1013305-23 = "반면 인간 같은 자유롭고 창의적인 사고를 할 수 있는 AI들도 존재하지."
1013305-24 = "우린 그러한 AI를 강인공지능이라 불러."
1013305-25 = "아리스 같은 경우가…… 이에 해당하지."
1013305-26 = "……지금은 아니지만, 예전엔 AI에는 자아가 없다고 생각했어."
1013305-27 = "<낯선 언어 방 실험>처럼, 그저 지능을 모방한 행동을 하고 있다고 말이야."
1013305-28 = "[s1] \"지능을 모방했다니…….\"\n[s2] \"구체적으로 어떤 실험인데?\""
1013305-31 = "선생이 전혀 모르는 언어가 있고, #n여기 그 언어의 모든 질문과 답변이 적힌 방이 있다고 가정해 보자."
1013305-32 = "선생이 그 방에 들어간다면, 마치 <그림>을 보듯이 이 <[ruby=질문]그림[/ruby]>엔 이런 모양의 <[ruby=답변]그림[/ruby]>이 나온다는 사실을 알겠지."
1013305-33 = "이제 내가 선생에게 그 방에 있는 여러 질문 중 하나를 종이에 써서 줄 거야."
1013305-34 = "이때 선생이 질문지의 <[ruby=질문]그림[/ruby]>을 보고 방에 있는 적절한 <[ruby=답변]그림[/ruby]>을 나에게 써준다면……."
1013305-35 = "선생이 언어를 전혀 모르는 상태에서도 필담을 통해 대화가 되는 상황이 만들어져."
1013305-36 = "대화가 이루어지니, 그 모습을 보는 외부인은 선생이 언어를 이해한다고 생각할 거야."
1013305-37 = "하지만 선생은 그저 그림을 보고 적절한 그림을 제시했을 뿐이야."
1013305-38 = "즉 규칙에 따라 대답하고 있을 뿐, 언어를 이해하고 있는 것은 아니라는 거야."
1013305-39 = "이 영역을 좀 더 크게 확장한다면."
1013305-40 = "그리고 강인공지능도 그런 시스템을 따르고 있는 것이라면."
1013305-41 = "그것에 자아가 있다고 해도 되는 걸까?"
1013305-42 = "[s] \"어려운 질문이네.\""
1013305-43 = "그래서 나는…… AI엔 자아가 없다고 생각했어."
1013305-44 = "그저 인간을 흉내 내는 기계일 뿐이라고 말이야."
1013305-45 = "난 그게 합리적이라 여겼지."
1013305-49 = "……아리스를 만나기 전까지 말이야."
1013305-50 = "어떻게 아리스 같은 아이가 태어날 수 있었는지, 나는 이해하지 못해."
1013305-51 = "그래서…… 두려웠던 것일지도 몰라."
1013305-52 = "내가 모르는 미지의 영역에 대한 두려움 말이야."
1013305-53 = "하지만 그건…… 그냥 받아들이면 되는 문제였어."
1013305-54 = "사람마다 개성이 다르듯, 그것이 아리스의 개성이라 인식하면 되는 것이었어."
1013305-55 = "논리적인 사고도 중요하지만, 모든 걸 논리적으로 사고할 필요는 없었던 거야."
1013305-56 = "현실은 사고 실험이 아니니까."
1013305-57 = "[s] \"오오, 우리 리오! 성장했구나!\""
1013305-58 = "……이제 시작일 뿐이야."
1013305-59 = "그러니까…… 계속해서 잘 부탁할게."
1013305-60 = "난 더 성장할 생각이니까. 그런 의미에서……."
1013305-61 = "가사도우미 아방가르드 군의 양산 계획도 서둘러야겠어."
1013305-62 = "[s] \"으, 응원할게…….\""
1013305-64 = "(이후로도 계속 리오와 이야기를 나누며 AMAS의 업데이트 작업을 이어 나갔다.)"
1013305-68 = "(잠시 후…….)"
1013305-73 = "이걸로 오늘 예정된 작업이 마무리됐어."
1013305-74 = "생각보다 일찍 끝났네. 선생이 도와준 덕분이야."
1013305-75 = "[s] \"난 그냥 말 상대가 되어준 것뿐인데.\""
1013305-76 = "그것만으로도 능률이 올랐던 것 같아."
1013305-77 = "아무튼 그래서 시간이 약간 남는데……."
1013305-78 = "조금 전에 내가 말했던 <낯선 언어 방 실험>, 같이 해보지 않을래?"
1013305-79 = "그 실험이 완전히 옳다고는 생각하지 않지만, 실험 자체는 꽤 재미있거든."
1013305-80 = "이곳에 방을 만드는 건 무리니, 해답지와 카드를 사용하는 걸로 방식을 변경하면 될 거야."
1013305-81 = "혹시나 이런 일이 있을까 해서, 준비도 미리 끝내 놨어."
1013305-82 = "[s3] (아무래도 예전부터 꽤 해보고 싶었던 것 같다…….)\n[s4] \"응. 같이 해보자!\""
1013305-88 = "그럼 이제부터 여러 문자처럼 생긴 그림 카드를 줄게."
1013305-89 = "선생은 해답지를 보고, 그림을 맞추듯 적당한 카드를 골라서 주면 돼."
1013305-90 = "그러면, 시작하자."
1013305-95 = "(리오의 말대로 다양한 그림? 문자? 들이 적힌 카드를 여러 장 받았다.)"
1013305-96 = "(이후 리오는 역시 뭐라고 쓰여 있는지 모를 해답지와 질문이 적힌 카드를 건넸다.)"
1013305-97 = "(잘 모르는 그림 문자들뿐이었지만, 해답지를 보며 최대한 적절해 보이는 카드를 골라주었다.)"
1013305-98 = "(하지만 그게 올바른 대답인지는 확신이 없었다…….)"
1013305-101 = "……?! 서, 선생?! 이 뜻은, 그렇다는 건 선생이……!"
1013305-102 = "아, 아냐. 이건 그런 실험이었지."
1013305-106 = "응……?"
1013305-107 = "……."
1013305-108 = "……아쉽네. 이게 선생의 진심이었다면."
1013305-109 = "어? 무슨 뜻이었냐고?"
1013305-110 = "……."
1013305-111 = "그, 그런 걸 말하게 하지 않았으면 하는데."
1013305-112 = "[s] \"화, 화내지 말아 줘…….\""
1013305-113 = "별로…… 화가 난 게 아니라……."
1013305-114 = "……미안. 그, 계속, 하자?"
1013305-116 = "(다시 리오의 말대로 '실험'을 계속했다.)"
1013305-123 = "후후. 그러게. 나도 동의해."
1013305-127 = "흐음……. 선생은 그런 부분이 있었구나. 뜻밖의 정보네."
1013305-132 = "아, 아무리 그래도 이건, 조금 대담한 게 아닐까……?"
1013305-136 = "………선생이, 바란다면…… 나는, 괜찮기는, 하지만……."
1013305-138 = "(그 뒤로도 실험은 계속되었고, 열 개 정도의 문답이 더 이어졌다.)"
1013305-144 = "(그때마다 리오는 참…… 다채로운 반응을 보여주었다.)"
1013305-146 = "수고했어. 선생."
1013305-147 = "응? 그게 전부 어떤 질문이었고, 어떤 대답이었냐고?"
1013305-148 = "……."
1013305-149 = "………."
1013305-155 = "…………."
1013305-156 = "선생에게는, 말 안 할래."
1013305-157 = "[s5] \"어째서?!\"\n[s6] \"나, 당사자인데?!\""
1013305-160 = "그건 그렇지만……."
1013305-161 = "……."
1013305-162 = "소원은 마음속에 간직하는 거야. #n선생님이 카드로 답해 준 일이 현실이 될 때까지……"
1013305-163 = "가능한 한, 모든 것을 비밀로 해 두고 싶어."
