[translation]
10046200-3 = "아……."
10046200-4 = "아……."
10046200-5 = "…………."
10046200-6 = "…………."
10046200-7 = "그, 안녕하십니까?"
10046200-8 = "너 같으면 안녕하게 생겼냐?!"
10046200-9 = "하하…… 뭐, 그렇죠?"
10046200-10 = "그, 게헨나의 선도부이시죠? 여기는 어쩐 일로……?"
10046200-11 = "아, 혹시 놀러 오신 거라면……."
10046200-12 = "아니거든!"
10046200-13 = "아, 그렇습니까……."
10046200-14 = "……."
10046200-15 = "아오, 답답해! 뭘 그렇게 안절부절못하는 거야!"
10046200-16 = "아니, 그, 저희가 그리 좋은 첫인상은 아니었잖습니까……."
10046200-17 = "대부분 제 잘못이었지만요, 하하……."
10046200-18 = "뭐야, 제대로 알고 있잖아. 그러면 미안합니다, 하고 끝내면 될 거 아니야! 언제까지 쭈뼛거리고 있을 건데?"
10046200-19 = "이제부터 같이 일할 거니까, 계속 그런 상태면 내가 곤란하다고!"
10046200-20 = "네, 그렇네요…… 같이 일하려면……."
10046200-24 = "네? 방금 뭐라고요?"
10046200-25 = "아차."
10046200-26 = "그…… 우리 애들이 여기서 말썽부리고 있는 거 같잖아. 온천개발부라든지, 미식연구회라든지……."
10046200-27 = "아, 네, 뭐…… 그렇죠?"
10046200-28 = "그래서, 도와줄까 하고."
10046200-29 = "네?!"
10046200-30 = "아! 물론, 너네만 괜찮다면…… 말이야!"
10046200-31 = "원래는 선도부에서 대처하고 있어야 하는 건들인데."
10046200-32 = "……미안, 우리 쪽 관리 부실이야"
10046200-36 = "하하…… 이것 참……."
10046200-37 = "게헨나에는 솔직한 분들이 많네요."
10046200-38 = "아, 좋은 의미로 말임다!"
10046200-39 = "그래? 나는 차라리 너네 학교가 부럽던데. 문제아도 적고, 교복도 귀엽…… 아니, 아무것도 아니야!"
10046200-40 = "……하핫!"
10046200-41 = "뭐, 뭐야. 갑자기 왜 웃고 그래?"
10046200-42 = "아뇨, 의외로 사람 사는 곳은 다 비슷하구나 해서요."
10046200-43 = "그게 대체 뭐가 웃긴다는 건지……."
10046200-44 = "하여튼, 불만은 없는 거지?"
10046200-45 = "그럼, 기합 넣고 가자고!"
