201060-190 = "พุดดิ้งช็อกโกแลตลิมิเต็ดประจำฤดูกาลของบริษัทโมริโคโอริ จะไม่ได้วางขายในเขตปกครองตนเอง#nเรดวินเทอร์งั้นเหรอ"
201060-191 = "ก็บอกแล้วไงว่าต่อให้มาสอบถามกำหนดการวางจำหน่ายสินค้าของบริษัทกับทางองค์การนักเรียน เราก็ตอบให้ไม่ได้หรอกนะ..."
201060-192 = "แถมแผนกอื่นในองค์การนักเรียนก็มีอยู่ตั้งเยอะ ทำไมถึงได้ติดต่อมาที่ฝ่ายการคมนาคมกันล่ะ? น่ารำคาญจริง..."
