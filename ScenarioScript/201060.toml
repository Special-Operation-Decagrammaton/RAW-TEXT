201060-243 = "I-I have no clue what she's talking about! I've never been to a dessert pop-up store or anything like that!"
201060-244 = "Even if it's for a once-in-a-lifetime dessert that you love, you can't leave the office during work hours. As members of the General Student Council, we need to set an example for other students."
