201060-151 = "ถ้าอย่างนั้น ตอนนี้ทางแพนเดโมเนียม โซไซตี้พอจะสนับสนุนด้านกำลังคนและอุปกรณ์ กับให้ความร่วมมือควบคุมตัวนักเรียนเกเรจากเกเฮนน่าได้รึเปล่าคะ?"
201060-152 = "ทำไมถึงมาถามพวกเราล่ะ?"
201060-153 = "การกวดขันนักเรียนที่เกเรเป็นหน้าที่ของคณะกรรมการวินัย ไม่ว่าสถานที่นั้นจะอยู่ภายในหรือภายนอก#nเขตปกครองตนเองเกเฮนน่า หากเป็นเรื่องการจัดการนักเรียนแล้วละก็ ไม่ใช่ความรับผิดชอบที่#nแพนเดโมเนียม โซไซตี้จะต้องไปจัดการเอง!"
201060-154 = "ใช่แล้ว พูดอีกอย่างก็คือ การที่พวกนักเรียนเกเรในเกเฮนน่าไม่หมดไปเสียที ทั้งหมดมันก็... เป็นเพราะหัวหน้ากรรมการวินัยฮินะนั่นแหละ!"
