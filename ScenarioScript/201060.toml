201060-228 = "L'Oiseau Bleu's caramel pudding...!"
201060-229 = "A-Ahem... At your request, I'll let this slide, General Student Council President!"
201060-230 = "But just this once!"
201060-231 = "Thank you for your understanding, Ms. Cherino."
