201060-199 = "เอาเป็นว่า...! ฉันคงช่วยเรื่องกำหนดการวางขายพุดดิ้งไม่ได้หรอก เพราะงั้นลองไปถามที่อื่นดูแล้วกันนะ"
201060-200 = "อึก... คิดเหรอว่าท่านเชริโน่จะหลงกลอุบายตื้นๆ แบบนี้!"
201060-201 = "การส่งพุดดิ้งลิมิเต็ดไปขายที่โรงเรียนอื่น แต่ไม่ส่งมาที่เรดวินเทอร์แบบนี้ ย่อมเป็นการเลือกปฏิบัติอย่างชัดเจน และถือเป็นการท้าทายอำนาจของเรา!"
201060-202 = "จนกว่าปัญหานี้จะได้รับการแก้ไข สำนักเลขาธิการเรดวินเทอร์ของเรา จะใช้ทุกวิถีทางประท้วงองค์การนักเรียนให้จงได้!"
