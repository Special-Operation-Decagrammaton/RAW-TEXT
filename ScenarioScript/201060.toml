201060-222 = "แต่ถึงอย่างนั้น จะให้เราตัดใจจากพุดดิ้งลิมิเต็ดที่รอมานานแบบนี้...!"
201060-223 = "ไม่รู้ว่าจะพอช่วยปลอบใจความเสียดายของท่านประธานเชริโน่ได้บ้างหรือเปล่านะคะ แต่พอดีในห้องครัวขององค์การนักเรียนมีพุดดิ้งคาราเมลรุ่นลิมิเต็ดของ 'ลูวาโซ บลู' อยู่น่ะค่ะ"
