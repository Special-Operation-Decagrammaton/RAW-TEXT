[translation]
201060-1 = "第6話;超人的回歸"
201060-2 = "（……向這名自稱聯邦學生會長的學生，說明了這段期間發生的事）"
201060-5 = "聯邦學生會接待室"
201060-6 = "……原來如此。"
201060-7 = "在我離開崗位的這段期間，居然發生了那麼多事……真是無地自容。"
201060-8 = ""
201060-10 = ""
201060-11 = "不過老師您提及的部分事項，似乎與我的記憶有所出入。"
201060-12 = "首先是據說由我交給老師的「希迪姆的箱子」。"
201060-13 = "在我眼中，那個「希迪姆的箱子」看起來只是一台普通的平板。"
201060-14 = "即便我的記憶有誤，將能夠控制奇普托斯基礎設施的聖所之塔控制權，#n賦予一台容易被奪走的平板，這樣的想法也未免過於危險了。"
201060-15 = "萬一「希迪姆的箱子」被圖謀不軌的人奪走，很可能會引發無法挽回的事態。"
201060-16 = "老師您也這麼認為吧？"
201060-19 = ""
201060-23 = "[ns] 「話是這麼說沒錯……」"
201060-24 = "同樣地，琳稱為另一件歐帕茲的「沙克德之杖」，在我看來也只是一支普通的手錶。"
201060-25 = "更重要的是，攸關奇普托斯安危的問題，#n居然必須仰賴連原理都無從得知的歐帕茲來解決……"
201060-26 = "如果要說這些都是我所擬定的計畫，令人費解的決定實在太多了。"
201060-27 = "看來似乎需要進行些許「調整」了。"
201060-28 = "[s] （難道……他打算關閉夏萊嗎……？）"
201060-29 = ""
201060-33 = "我只是依照「聯邦學生會長」留下的文件執行公務而已。"
201060-34 = ""
201060-36 = ""
201060-37 = ""
201060-38 = ""
201060-39 = "總不至於連這份記載著夏萊的存在，以及與老師赴任有關的文件也沒有記憶吧？"
201060-40 = "……"
201060-41 = ""
201060-43 = ""
201060-44 = "其他部分姑且不論，至少這份文件上的簽名確實是我的筆跡沒錯。"
201060-45 = "此外，夏萊在我離開期間活躍於奇普托斯各地的事蹟，#n我也已經透過書面報告充分了解……"
201060-46 = "我並不打算否定夏萊的存在價值。#n畢竟夏萊從未濫用權限，還為了學生們的自治與安全盡心盡力。"
201060-47 = "非但如此，我反而想代表聯邦學生會，向夏萊致上由衷的感謝。"
201060-48 = "[s1] 「太好了……」\n[s2] 「我還擔心會突然失業呢……」"
201060-51 = "怎麼會呢。#n我可沒有死板到會單憑「沒有記憶」的理由就把拯救奇普托斯的恩人拒於門外。"
201060-52 = ""
201060-54 = ""
201060-55 = "只不過……"
201060-56 = "彼此之間的記憶出入，確實有必要進一步協調與詳談。"
201060-57 = ""
201060-59 = ""
201060-61 = ""
201060-62 = "如果你是「真正的」聯邦學生會長……"
201060-63 = "為什麼會突然毫無預警地拋下公務消失不見呢？"
201060-64 = "這段期間你人在哪裡，又做了些什麼？"
201060-65 = "很遺憾，這個問題連我也無法給出明確的答案。"
201060-66 = "在記錄上的我……也就是聯邦學生會長消失之前，#n最後一次執行公務那天的記憶，我倒是清楚地記得。"
201060-67 = "那天我一如往常地檢閱了新呈上的公文並簽了名，接著離開了辦公桌。"
201060-68 = "但是那之後的記憶……就像腦海中籠罩了一層濃霧，什麼都想不起來。"
201060-69 = "我也一度懷疑自己是否在不知不覺中陷入了沉睡。#n然而當我回過神來時，早已過了漫長的歲月……奇普托斯的狀況也與先前截然不同。"
201060-70 = "然後，我就遇見了不記得我的你。"
201060-71 = "就算你說出那種令人難以置信的話……"
201060-72 = "是的。就算我這麼說，想必也很難讓人接受吧。"
201060-73 = "……畢竟就連現在的我，也無法理解自己。"
201060-74 = "然而這種不可解的事物，正是這個世界的核心。"
201060-75 = "與奇普托斯發生的無數問題和事故相比，喪失記憶甚至稱不上什麼特別的事件。"
201060-76 = "況且即使無法理解，也不能就此永遠停留在原地。"
201060-77 = "因為我還肩負著必須履行聯邦學生會長職責的任務。"
201060-78 = "………"
201060-79 = "琳。今後只要有時間就繼續和我談談吧。"
201060-80 = "在你找到能夠接受的聯邦學生會長之前，我都會全力協助你。"
201060-81 = "縱使在你的記憶裡永遠是個冒牌貨……我也絕對不會逃避自己被賦予的職責。"
201060-82 = ""
201060-84 = ""
201060-86 = ""
201060-87 = "為什麼……你會說出和那個人一樣的話……"
201060-88 = "那麼，為了處理堆積的業務，我今天就先告辭了。"
201060-89 = "夏萊的老師如果有需要，也請隨時自由地來往聯邦學生會。"
201060-90 = ""
201060-92 = ""
201060-98 = "聯邦學生會調停室・第2遠端會議室"
201060-101 = ""
201060-102 = "……久疏問候了。#n突然與您聯絡還同時提出請求，實在非常抱歉……"
201060-103 = "渚大人，上個月茶會提出的「三一產茶葉流通管制條例」能否請您撤回呢？"
201060-104 = ""
201060-106 = ""
201060-107 = "聽說聯邦學生會長時隔許久親自召集了會議，我還以為是發生了什麼事呢。"
201060-108 = "我們的答覆與先前向調停室長說明的相同，該條例無法撤回。"
201060-110 = "唔……那個，所以說……"
201060-111 = "這項條例是為了簡化流通網，#n進而向本校學生穩定提供嗜好品所採取的最低限度的措施。"
201060-112 = "同時也有維護本校引以為傲的茶葉，防止其價值受到貶低的目的。#n因此還請聯邦學生會務必多加體諒。"
201060-113 = "而且據我所知，聯邦學生會應該不會介入各學園自治區提出的條例才對……"
201060-114 = "莫非是現在的政策有所改變嗎？"
201060-115 = "不，並非如此。#n各自治區當然有權利依需求提出條例，聯邦學生會也尊重這一點。"
201060-116 = "然而，在奇普托斯茶葉市場中佔有龐大規模的三一產茶葉一旦中斷流通，#n茶葉整體的價格也將隨之暴漲……"
201060-117 = "聽說像赤冬那樣必須仰賴外部市場供應茶葉的學園，#n他們的學生似乎正因為無法享用熱茶而感到困擾呢。"
201060-118 = "……我認為我們沒有義務為其他學園的問題操心。"
201060-119 = "啊，這麼說來，上次「茶會」送來的紅茶真是相當出色呢。"
201060-120 = "相較以往似乎增添了一股清爽而柔和的香味……#n莫非您嘗試了新的配方嗎？"
201060-121 = ""
201060-123 = ""
201060-124 = "……您的味覺很敏銳呢。#n上次送給您的紅茶，是加入了些許用於「Lady Grey」的柑橘精油重新調配而成的。"
201060-125 = "很高興符合您的口味。#n不過，怎麼突然提起這個話題……？"
201060-126 = "品嚐著清爽柔和的Lady Grey時，我不禁思考……#n如果能搭配一份甜味濃郁的甜點一定會非常不錯。"
201060-127 = "舉例來說──像是鋪滿了赤冬產越橘的巧克力派之類的？"
201060-128 = "……"
201060-129 = "一向慣於享用美味水果的赤冬學生們，若能品嚐到與水果相得益彰的三一產紅茶……#n想必會對三一綜合學園留下更好的印象吧……"
201060-130 = "渚大人意下如何呢？"
201060-131 = "……優質的紅茶就該配上相稱的甜點才合乎格調。"
201060-132 = "我明白了。您所提出的流通管制條例撤回案，我們會進行審慎評估的。"
201060-133 = "非常感謝您的諒解。"
201060-134 = "別這麼說。難得能和懂得品茶的人交流，我也感到十分愉快呢。"
201060-135 = "下次您光臨「茶會」時，我會以新調配的紅茶款待您的。"
201060-136 = "好的，我會由衷地期待下一次的會面。"
201060-139 = "近期D.U.不良學生的脫序行為變得日益激烈……"
201060-140 = "根據防衛室的內部調查……#n這幾個月發生在D.U.的事件，有50%是由格黑娜出身的學生所引起。"
201060-141 = "防衛次長已為此向格黑娜發送了要求協助調查的公文，卻遲遲沒有收到任何回覆……"
201060-142 = "請問身為萬魔殿議長的真琴大人，對於這個問題是否有所了解呢……？"
201060-143 = ""
201060-145 = ""
201060-147 = "嘻嘻……真是個沒必要回答的愚蠢問題啊。"
201060-148 = "那當然是……"
201060-149 = "不知道！"
201060-150 = "……"
201060-151 = "那麼，您是否有意由萬魔殿方面支援人力與裝備，協助取締格黑娜的不良學生呢？"
201060-152 = "那種事為什麼要問我？"
201060-153 = "無論在格黑娜自治區內還是區外，取締不良學生都是風紀委員會的工作。#n凡是關於學生風紀的問題，我們萬魔殿一律不負責！"
201060-154 = "沒錯。換句話說……#n格黑娜不良學生的問題遲遲無法解決，全都是陽奈風紀委員長的錯！"
201060-155 = "請，請等一下。#n就算您這麼認為，也不能把格黑娜的行政協調業務交給風紀委員會──"
201060-157 = "……原來如此。我全都明白了。"
201060-158 = ""
201060-160 = ""
201060-161 = ""
201060-163 = ""
201060-164 = "這一切都是陽奈委員長的無能所引起的對吧？"
201060-165 = "聯，聯邦學生會長！？"
201060-166 = "唔，唔嗯……？#n可，可以這麼說吧。"
201060-167 = "居然讓帶領著無能的委員長治理校園、日理萬機的真琴議長大人勞神費心……#n我對自己的疏失感到萬分慚愧。"
201060-168 = "用不著道歉。我真琴大人可沒有嚴苛到連懂得反省過錯的人都加以斥責！"
201060-169 = "所幸聯邦學生會長似乎和某人不同，是個可以溝通的人。"
201060-170 = "除此之外，有沒有其他想向我們萬魔殿求助的問題呢？"
201060-171 = "不，我沒有其他想請教的問題了。#n畢竟真琴議長大人光是替風紀委員長善後，想必就已經十分忙碌了吧。"
201060-172 = "真是深得我心！"
201060-173 = "沒錯。今後只要有麻煩事，就全都交給風紀委員會吧。#n格黑娜的一切責任，都由風紀委員會承擔！"
201060-174 = "我會銘記在心的。"
201060-175 = "那麼今天就先告辭了。祝您有個美好的一天。"
201060-176 = ""
201060-178 = ""
201060-179 = ""
201060-180 = ""
201060-181 = "防衛次長。請立刻聯絡格黑娜風紀委員會請求合作，並共享防衛室掌握的嫌犯資料。"
201060-182 = "如果風紀委員會要求補給物資與彈藥，也請按照需求給予支援。#n費用請向調停室的格黑娜負責部門請款。"
201060-183 = "是，是的……！"
201060-184 = "……啊，請幫我各寄一箱疲勞恢復劑和胃藥給空崎委員長。#n我想他一定會需要的。"
201060-187 = ""
201060-188 = ""
201060-189 = "那到底是什麼意思！"
201060-190 = "森冰公司的季節限定巧克力布丁，竟然不在赤冬自治區發售！"
201060-191 = "不是，就算向聯邦學生會詢問企業產品的販售計畫，我們也無法回答啊……"
201060-192 = "而且聯邦學生會明明有這麼多部門，為什麼偏偏找上交通室啊？#n真麻煩……"
201060-193 = "嗯？聯邦學生會負責處理甜點相關業務的不就是你嗎？"
201060-194 = "上次卡魯比的限定甜點快閃店開張的時候，#n你明明是平日卻在那裡排隊，咱還以為你是負責相關業務的人呢……"
201060-195 = ""
201060-197 = ""
201060-198 = "那，那個……你是不是認錯人了？"
201060-199 = "總之……！關於布丁的販售計畫我無法處理，請你洽詢其他窗口吧。"
201060-200 = "唔唔唔……你以為那種詭辯能夠騙過咱嗎！？"
201060-201 = "其他學園都有發售的限定布丁，卻唯獨不供貨給赤冬……#n這分明就是差別待遇，更是對咱權威的挑戰！"
201060-202 = "在問題解決之前，赤冬事務局將竭盡一切手段，向聯邦學生會嚴正抗議！"
201060-203 = "（這下可傷腦筋了……）"
201060-204 = ""
201060-206 = ""
201060-208 = "方便讓我提供一些意見嗎？"
201060-209 = "你是……？"
201060-210 = "久疏問候了。身兼赤冬學園學生會長、環境美化部長、書記長、體育部代表、#n整潔部長、風紀委員長、供餐部長，並榮獲赤冬第一美食家稱號的潔莉諾大人。#n我是聯邦學生會長。"
201060-211 = "潔莉諾大人的鬍子，今日也依舊閃耀著出色的光澤呢。#n如果不會冒犯的話，我甚至想請教您是否有什麼特別的保養祕訣。"
201060-212 = ""
201060-214 = ""
201060-215 = "耶嘿。竟然能夠看出咱細心呵護的鬍子的價值所在，聯邦學生會長還真有眼光呢！"
201060-216 = "不過很遺憾，鬍子的保養祕訣可沒辦法告訴你。#n畢竟咱可是沒有在鬍子的保養上花費任何功夫呢！"
201060-217 = "不加以保養也能長出如此出色的鬍子，真是令人羨慕呢。#n我似乎也能明白，赤冬的眾多學生為何會以潔莉諾會長的鬍子為傲了。"
201060-218 = "話說回來，我聽說這次森冰公司推出的限定巧克力布丁相當黏稠，#n吃完之後嘴巴周圍很容易會弄髒……"
201060-219 = "如果僅僅因為一個布丁，就讓潔莉諾會長那閃耀的鬍子沾上巧克力的污漬……#n眾多赤冬的學生們想必會感到很遺憾吧？"
201060-221 = "那，那倒也是……"
201060-222 = "可是就算如此，也不能放棄期待已久的限定布丁啊……！"
201060-223 = "雖然不清楚這樣是否能夠稍微撫慰潔莉諾會長的遺憾……#n正巧聯邦學生會的休息室裡，還有一份「L'Oiseau．Bleu」的限定焦糖布丁。"
201060-224 = "我會將這份布丁贈送給您，這次的事情能否請您息怒呢？"
201060-225 = ""
201060-227 = ""
201060-228 = "「L'Oiseau．Bleu」的限定焦糖布丁……！"
201060-229 = "唔，唔呣……既然聯邦學生會長都這麼說了，咱就看在會長的面子上網開一面吧。"
201060-230 = "但是之後咱可不會像這次一樣好說話了哦……！"
201060-231 = "感謝您的諒解，潔莉諾大人。"
201060-232 = ""
201060-237 = ""
201060-239 = "桃香……"
201060-240 = ""
201060-242 = ""
201060-243 = "我，我什麼都不知道！我才沒去過什麼限定甜點快閃店呢！"
201060-244 = "就算再怎麼喜歡限定的甜點，也不能在上班時間擅離職守。#n我們可是必須成為他人表率的聯邦學生會幹部啊。"
201060-245 = ""
201060-247 = ""
201060-248 = "（小聲）……作為交換，我下週預計要跟奇普托斯糕點業者的代表們開會，#n到時候我會幫你問問能不能分到一些試吃用的樣品的。"
201060-249 = ""
201060-251 = ""
201060-252 = "真的嗎！？"
201060-256 = "好厲害……聯邦學生會長一回來，那些擱置已久的問題馬上就迎刃而解了。"
201060-257 = "就連那些心高氣傲的學園代表們，在會長面前也像溫馴的綿羊一樣乖乖配合……#n真是驚人的領袖魅力啊。"
201060-258 = "雖然稍微晚了一點，但是聯邦學生會長能夠回來真是太好了。"
201060-259 = "就是說啊。果然在奇普托斯是沒有人能取代聯邦學生會長的呢。"
201060-262 = ""
201060-263 = "……"
201060-264 = "……不能再這樣下去了。"
201060-265 = ""
201060-267 = ""
201060-269 = "下一話;配對"
