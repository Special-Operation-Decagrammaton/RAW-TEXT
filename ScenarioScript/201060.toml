[translation]
201060-1 = "제6화;초인의 귀환"
201060-2 = "(……스스로를 총학생회장이라고 소개한 학생에게, 그동안 있었던 일에 대해 설명해 주었다.)"
201060-5 = "총학생회 리셉션룸"
201060-6 = "……그렇군요."
201060-7 = "제가 자리를 비우고 있던 사이 그렇게 많은 일들이…… 면목 없습니다."
201060-11 = "하지만 선생님께서 말씀하신 몇 가지 사실은 제 기억과 상이합니다."
201060-12 = "우선 제가 선생님께 드렸다는 그 <싯딤의 상자>."
201060-13 = "제 눈에 그 <싯딤의 상자>는 평범한 태블릿으로 밖에 보이지 않습니다."
201060-14 = "설령 제 기억이 잘못된 것이라 하더라도, 키보토스의 모든 인프라를 제어할 수 있는 생텀 타워의 제어권을 탈취가 용이한 태블릿 하나에 부여하는 건 너무 위험한 발상입니다."
201060-15 = "그 <싯딤의 상자>가 나쁜 의도를 지닌 자들의 손에 탈취된다면 돌이킬 수 없는 사태가 발생할 수도 있으니까요."
201060-16 = "선생님께서도 그리 생각하지 않으시나요?"
201060-23 = "[ns] \"그건 그렇지만……\""
201060-24 = "마찬가지로, 린이 또 다른 오파츠라 말한 이 <샤케드의 막대> 또한 제 눈에는 평범한 시계로 밖에 보이지 않습니다."
201060-25 = "무엇보다 키보토스의 안위가 달린 문제를, 원리도 알 수 없는 오파츠에 의존하여 해결하려 하다니……"
201060-26 = "제가 세운 계획이라기엔 이해할 수 없는 결정뿐이로군요."
201060-27 = "아무래도 약간의 '조정'이 필요할 듯 싶습니다만."
201060-28 = "[s] (설마, 샬레를 폐쇄하려는 건가……?)"
201060-33 = "저는 '총학생회장'이 남긴 문서에 따라 일을 수행했을 뿐입니다."
201060-39 = "설마 샬레의 존재와 선생님의 부임에 관한 내용이 담긴 이 문서도 모른다고 하시지는 않겠지요."
201060-40 = "………"
201060-44 = "다른 점은 몰라도, 이 문서에 적힌 사인의 필체만큼은 제 것이 맞군요."
201060-45 = "게다가 부재 중에 샬레가 키보토스 각지에서 활약한 내용에 대해서는 이미 서면을 통해 충분히 전해 들었고……"
201060-46 = "권한을 남용하지 않고 학생들의 자치와 안전을 위해 힘써 준 샬레의 존재 의의를 부정할 생각은 없답니다."
201060-47 = "아니, 오히려 총학생회를 대표하여 깊은 감사를 드리고 싶습니다."
201060-48 = "[s1] \"다행이다……\"\n[s2] \"갑자기 일자리를 잃게 될 까봐 걱정했어……\""
201060-51 = "설마요. 키보토스를 구한 은인을 기억에 없다는 이유 만으로 내칠 정도로 융통성이 없는 사람은 아니랍니다."
201060-55 = "다만……"
201060-56 = "서로 간에 어긋나 있는 기억을 조율하고, 이야기를 더 나누어야 할 필요는 있겠지요."
201060-62 = "만약 당신이 '진짜' 총학생회장이라면……"
201060-63 = "어째서 갑자기 예고도 없이 공무를 내버린 채 사라져 버렸던 건가요?"
201060-64 = "그리고 그동안 어디서, 무엇을 하며 지냈었던 건가요?"
201060-65 = "유감이지만 그 질문에 대해서는 저도 확실하게 답변을 드릴 수가 없습니다."
201060-66 = "기록상 제가…… 그러니까 총학생회장이 사라지기 전, 마지막 공무를 수행했던 날의 기억만큼은 또렷이 남아있습니다."
201060-67 = "그날도 평소처럼 새로 올라온 공문서를 검토하고, 서명을 하고, 책상을 떠났었지요."
201060-68 = "하지만 그 이후로의 기억은…… 머리속에 짙은 안개가 낀 것처럼 아무것도 떠올릴 수가 없었습니다."
201060-69 = "혹 저도 모르는 사이에 깊은 잠이 든 게 아닐까 생각도 해 보았지만, 정신을 차렸을 때는 오랜 시간이 흐른 뒤였고…… 키보토스의 상황은 크게 바뀌어 있었습니다."
201060-70 = "그리고 저를 기억하지 못하는 당신을 만나게 되었지요."
201060-71 = "그런 이해할 수 없는 말을 하셔도……"
201060-72 = "네. 이렇게 말씀드려도 이해하기 어려우시겠지요."
201060-73 = "……지금의 저조차도 스스로를 이해할 수 없으니까요."
201060-74 = "하지만 이러한 불가해야 말로 이 세계의 핵심."
201060-75 = "키보토스에서 벌어지는 수많은 문제와 사고들에 비하면, 기억의 상실은 특별한 사건조차 되지 못합니다."
201060-76 = "하지만 이해할 수 없다고 하여 그 자리에 언제까지나 머물러 있을 수는 없습니다."
201060-77 = "제게는 총학생회장의 책무를 다해야 할 책임이 있으니까요."
201060-78 = "………"
201060-79 = "린. 앞으로 시간이 되는 대로 저와 계속 이야기를 나누시지요."
201060-80 = "당신이 납득하는 총학생회장을 찾을 때까지 전력으로 협력하겠습니다."
201060-81 = "설령 그 결과, 제가 영원히 당신에게 가짜로 기억된다 할지라도…… 제게 주어진 책무를 회피하지는 않겠습니다."
201060-87 = "어째서 당신은…… 그 사람과 같은 말을……"
201060-88 = "그럼 밀린 업무를 처리하기 위해 오늘은 먼저 실례하겠습니다."
201060-89 = "샬레의 선생님께서도 용건이 있으시다면 언제든 자유롭게 총학생회를 방문해주시길 바라겠습니다."
201060-98 = "총학생회 조정실, 제 2 원격 회의장"
201060-102 = "……오랜만에 안부를 전하는 것과 동시에 갑작스럽게 요청을 드리게 되어 대단히 송구합니다만……"
201060-103 = "지난 달 티파티에서 발의된 <트리니티 산 찻잎 유통 규제 조례>를 철회해 주실 수는 없으실까요, 나기사 님?"
201060-107 = "오랜만에 총학생회장이 직접 회의를 소집했다 하여 무슨 일인가 했습니다만."
201060-108 = "저희의 답변은 지난 번 조정실장께 드린 것과 동일합니다. 해당 조례는 철회할 수 없습니다."
201060-110 = "하으으…… 그게 그러니까……"
201060-111 = "이 조례는 유통망을 간소화하여 본교 학생들에게 안정적으로 기호품을 제공하기 위한 최소한의 조치인 바."
201060-112 = "이에 더해 본교가 자랑하는 찻잎의 가치를 보존하고 평가가 절하되는 일을 막기 위한 목적이 있사오니, 총학생회에서는 부디 너른 양해 부탁드리겠습니다."
201060-113 = "게다가 각 학원의 자치구에서 발의하는 조례에는 총학생회가 개입하지 않는 것으로 알고 있습니다만……"
201060-114 = "이제 와서 정책이 바뀌기라도 한 걸까요?"
201060-115 = "아니요, 그렇지 않습니다. 당연히 각 자치구는 필요에 따라 조례를 발의할 권한이 있으며, 총학생회는 이를 존중합니다."
201060-116 = "다만 키보토스의 찻잎 시장에서 큰 규모를 차지하던 트리니티 산 찻잎의 유통이 끊기자, 전반적으로 찻잎 가격이 폭등하여……"
201060-117 = "붉은겨울 학원처럼 찻잎의 공급을 외부에 의존하던 학원의 학생들이 따듯한 차를 즐기지 못해 곤란해 하고 있는 모양입니다."
201060-118 = "……다른 학원의 문제를 저희가 신경 써야 할 의무는 없다고 생각됩니다만."
201060-119 = "아, 그러고 보니 지난 번 <티파티>에서 보내주신 홍차는 정말 괜찮더군요."
201060-120 = "그 전에 마셨던 것에 비해 산뜻하고 부드러운 단맛이 가미된 것처럼 느껴지던데…… 혹시 새로운 블렌드를 시도하셨나요?"
201060-124 = "……미각이 예민하시군요. 네, 전에 보내 드린 홍차는 레이디 그레이에 쓰이는 시트러스 오일을 조금 더해 새롭게 블렌딩 했답니다."
201060-125 = "입에 맞으셨다니 다행입니다만, 어째서 갑자기 그 이야기를……?"
201060-126 = "산뜻하고 부드러운 레이디 그레이를 마시고 있노라니, 어쩐지 달콤한 맛이 강한 디저트를 곁들이면 좋을 것 같다는 생각이 들더군요."
201060-127 = "예를 들자면— 붉은겨울 산 링곤베리가 잔뜩 올라간 초콜릿 파이라던가?"
201060-128 = "……"
201060-129 = "평소에도 맛 좋은 과실을 소비하던 붉은겨울의 학생들이, 그 과일과 잘 어우러지는 트리니티 산 홍차를 맛보게 된다면. 트리니티 종합학원에 더 좋은 인상을 갖게 될 텐데……"
201060-130 = "나기사 님은 어떻게 생각하시는지요?"
201060-131 = "……좋은 차에는 그에 걸맞는 디저트를 내놓아야 격이 맞겠지요."
201060-132 = "알겠습니다. 말씀하신 유통 규제 조례 철회안에 대해서는 긍정적으로 검토하도록 하지요."
201060-133 = "양해해 주셔서 대단히 감사합니다."
201060-134 = "아뇨. 오히려 오랜만에 차의 맛을 아는 분과 대화를 나누어서 저 또한 즐거웠답니다."
201060-135 = "다음 번에 <티파티>에 찾아오시거든 새로운 블렌드를 대접해드리지요."
201060-136 = "부디, 다음 회합을 기대하고 있겠습니다."
201060-139 = "최근 D.U.에서 벌어지고 있는 불량 학생들의 일탈이 날로 과격해지고 있는 가운데……"
201060-140 = "방위실의 자체 조사에 따르면 최근 몇 달 사이 D.U.에서 일어난 사건 사고의 50%는 게헨나 출신 학생들에 의해 벌어졌다고 하는군요."
201060-141 = "이와 관련하여 방위차장이 게헨나에 수사와 관련된 협조 공문을 발송하였지만, 아무런 대답을 듣지 못했다고 하는데……"
201060-142 = "혹시 만마전의 의장이신 마코토 님께서는 이 문제에 대해 아시는 바가 있으신지요……?"
201060-147 = "킥킥…… 답하는 것이 의미 없을 정도의 우문이로군."
201060-148 = "그야 당연히……"
201060-149 = "모른다!"
201060-150 = "………"
201060-151 = "그럼 혹시 지금이라도 만마전 차원에서 인력과 장비를 지원하여 게헨나 출신 불량학생들의 단속에 협조해 주실 생각은 있으신지요?"
201060-152 = "그걸 어째서 우리에게 묻는 것이지?"
201060-153 = "불량 학생의 단속은 선도부의 업무. 그 장소가 게헨나 자치구 안이든, 밖이든 학생을 단속하는 일이라면 우리 만마전이 해결해야 할 책무는 없다!"
201060-154 = "그래. 다시 말해 게헨나에 불량 학생이 사라지지 않는 건 모두…… 히나 선도부장의 탓이다!"
201060-155 = "자, 잠시만요. 아무리 그렇게 생각하신다 하더라도, 게헨나의 행정 협력과 관련된 업무를 학생회가 아닌 선도부에 맡길 수는……"
201060-157 = "……그렇군요. 전부 이해했습니다."
201060-164 = "이 모든 것은 히나 부장의 무능에서 비롯된 것이군요!"
201060-165 = "초, 총학생회장?!"
201060-166 = "으, 으응……? 그, 그런 셈이지."
201060-167 = "이런 불찰이. 그런 무능한 부장을 데리고 교정을 이끌어 나가느라 격무에 시달리고 계신 마코토 의장님께 심려를 끼쳐 드리다니…… 면목 없습니다."
201060-168 = "사과는 필요없다. 나 마코토 님은 잘못을 반성하고 있는 사람까지 질책할 정도로 가혹하지 않으니까!"
201060-169 = "그나저나 총학생회장은 누구와 다르게 말이 통하는 사람이라 다행이군."
201060-170 = "뭔가 그 밖에 우리 만마전에 도움을 청하고 싶은 다른 문제는 또 없나?"
201060-171 = "아뇨. 더 여쭈고 싶은 문제는 없습니다. 마코토 의장님은 선도부장의 뒷수습을 하시는 것 만으로도 충분히 바쁘실테니까요."
201060-172 = "아주 마음에 드는 군!"
201060-173 = "그래. 그렇게 앞으로도 귀찮은 일이 생기거든 모두 선도부에게 맡기도록. 게헨나의 모든 책임은 선도부에게 있으니까!"
201060-174 = "명심하겠습니다."
201060-175 = "그럼 오늘은 실례했습니다. 좋은 하루 되시길."
201060-181 = "방위차장. 지금 바로 게헨나 선도부에 연락해 공조를 요청하고 방위실에서 확보한 용의자 데이터의 공유를 부탁드립니다."
201060-182 = "그리고 선도부에서 보급 물자와 탄약을 요청하거든, 필요한만큼 지원해주시길. 대금은 조정실 게헨나 담당 부서에 청구 부탁드립니다."
201060-183 = "네, 네……!"
201060-184 = "……아, 그리고 소라사키 부장에게는 별도로 피로회복제와 소화제를 한 박스씩 보내 드리길. 분명 필요로 하실 겁니다."
201060-189 = "그게 도대체 무슨 소리인가!"
201060-190 = "모리코오리 사의 시즌 한정 초콜릿 푸딩이 붉은겨울 자치구에서는 출시되지 않는다니!"
201060-191 = "아니, 그러니까 기업의 제품 발매 일정을 총학생회에 문의해봤자 답해줄 수 없다니까……"
201060-192 = "게다가 왜 총학생회의 하고 많은 부서 중에 교통실에 연락을 한 거야?#n귀찮게시리……"
201060-193 = "응? 총학생회의 디저트 관련 업무를 처리하는 사람은 그대가 아니었던가?"
201060-194 = "지난 번에 가루비의 한정 디저트 팝업 스토어가 열렸을 때, 평일임에도 불구하고 줄을 서고 있기에 관련된 부서에서 일하는 줄 알았다만……"
201060-198 = "그, 그건 그러니까…… 잘못 본 거 아냐?"
201060-199 = "여하튼……! 푸딩의 발매 일정에 대해서는 조치해 줄 수 없으니 다른 문의처를 알아봐 줘."
201060-200 = "으읏…… 그런 궤변으로 이 체리노님이 넘어가 줄 거라고 생각했느냐!"
201060-201 = "다른 학원에는 출시하는 한정 푸딩을 붉은겨울에만 납품하지 않는 것은 명백한 차별이자, 이 몸의 권위에 대한 도전인 바!"
201060-202 = "문제가 해결될 때까지 우리 붉은겨울 사무국은 가능한 모든 방법을 동원하여 총학생회에 엄중히 항의할 것이다!"
201060-203 = "(이것 참 곤란하네……)"
201060-208 = "잠시 의견을 드려도 괜찮을까요?"
201060-209 = "그 쪽은……?"
201060-210 = "오랜만에 인사드립니다, 붉은겨울 학원의 학생회장이자, 미화부장이자, 서기장이자, 체육부장이자, 청소부장이자, 선도부장이자, 급식부장이자, 붉은겨울 제일의 미식가 칭호를 획득하신 체리노 님. 총학생회장입니다."
201060-211 = "오늘도 체리노 님의 수염은 정말 훌륭한 빛으로 반짝이고 있군요. 무례가 되지 않는다면 특별한 관리 비법이 있는지 여쭈어 보고 싶을 정도입니다."
201060-215 = "에헴, 이 몸이 애지중지 가꿔온 수염의 가치를 알아보다니, 총학생회의 회장은 보는 눈이 있군!"
201060-216 = "하지만 유감스럽게도 수염의 관리 비법은 알려줄 수 없겠어. 이 몸은 수염 관리에 별도의 공을 들이지 않고 있거든!"
201060-217 = "관리 없이도 그렇게 멋진 수염이 자라난다니, 그것 참 부러운 일이군요. 붉은겨울의 많은 학생들이 체리노 회장님의 수염을 자랑스러워 하는 이유도 알 것 같습니다."
201060-218 = "그나저나 이번에 모리코오리 사에서 출시한 한정 초콜릿 푸딩은 끈적임이 심해, 먹고 나면 입 주변이 쉽게 더러워진다는 평이 있던데요……"
201060-219 = "고작 푸딩 때문에 체리노 회장님의 빛나는 수염이 초코 얼룩으로 더럽혀진다면, 많은 붉은겨울의 학생들이 안타까워 하지 않을까요?"
201060-221 = "그, 그건 그렇겠지……"
201060-222 = "하지만 그렇다고 오랫동안 고대해 온 한정 푸딩을 포기할 수는……!"
201060-223 = "체리노 회장님의 아쉬움에 자그마한 위로가 될지는 모르겠습니다만, 마침 총학생회 탕비실에 르와조 블뢰의 한정 카라멜 푸딩이 남아 있어서요."
201060-224 = "이 푸딩을 선물해 드릴 테니 이번 만큼은 노여움을 푸시는 게 어떨까요?"
201060-228 = "르와조 블뢰의 한정 카라멜 푸딩……!"
201060-229 = "흠, 흠…… 총학생회장이 그렇게 말한다면 총학생회장의 입장을 고려하여 이번은 너그러이 넘어가도록 하지."
201060-230 = "하지만 다음 번에는 이번처럼 쉽게 넘어가지 않을테니까……!"
201060-231 = "양해해 주셔서 감사합니다, 체리노 님."
201060-239 = "모모카……"
201060-243 = "나, 나는 모르는 일이야! 한정 디저트 팝업 스토어 같은 곳은 간 적 없다고!"
201060-244 = "아무리 좋아하는 한정 디저트가 나왔다 하더라도 업무 시간 중에 자리를 비워서는 안 됩니다. 저희는 타의 모범이 되어야 할 총학생회의 임원이니까요."
201060-248 = "(소근) ……대신 다음 주에 키보토스 제과 업체의 대표들과 미팅이 예정되어 있는데, 그 때 시식용 시제품을 조금 나누어 받을 수는 없을지 여쭈어 볼게요."
201060-252 = "정말?!"
201060-256 = "대단해…… 총학생회장님이 돌아오시자마자 그동안 계류되어 있던 온갖 문제들이 단번에 해결되기 시작했어."
201060-257 = "자존심 높은 각 학원의 대표들도 회장 앞에서는 순한 양처럼 협조하는 걸 보니…… 정말 어마어마한 카리스마야."
201060-258 = "조금 늦긴 했지만 이제라도 총학생회장이 돌아와서 다행이야."
201060-259 = "맞아. 역시 총학생회장을 대체할 수 있는 학생은 키보토스에 더는 없을 거야."
201060-263 = "………."
201060-264 = "……역시 이대로는 안 되겠어."
201060-269 = "다음화;페어링"
