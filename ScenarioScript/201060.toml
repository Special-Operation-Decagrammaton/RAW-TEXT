[translation]
201060-1 = "ตอนที่ 6;การกลับมาของยอดคน"
201060-2 = "(...คุณครูอธิบายเรื่องราวทั้งหมดที่ผ่านมาให้นักเรียนที่แนะนำตัวว่าเป็นประธานองค์การนักเรียนฟัง)"
201060-5 = "ห้องรับรอง องค์การนักเรียน"
201060-6 = "อย่างนี้เองสินะคะ..."
201060-7 = "ระหว่างที่ฉันไม่อยู่เกิดเรื่องมากมายถึงขนาดนี้... ฉันไม่รู้จะสู้หน้าทุกคนยังไงเลยค่ะ"
201060-8 = ""
201060-10 = ""
201060-11 = "แต่ว่าข้อมูลบางส่วนที่คุณครูพูดมานั้นแตกต่างจากสิ่งที่ฉันจำได้ค่ะ"
201060-12 = "ก่อนอื่น เรื่อง <กล่องแห่งซิสดิม> ที่บอกว่าฉันมอบให้คุณครู"
201060-13 = "ในสายตาของฉัน <กล่องแห่งซิสดิม> นั่นดูเป็นเพียงแท็บเล็ตธรรมดาๆ ค่ะ"
201060-14 = "ต่อให้ความทรงจำของฉันผิดพลาด การมอบสิทธิ์ควบคุมแซงทัมทาวเวอร์ที่สามารถควบคุมโครงสร้าง#nพื้นฐานทั้งหมดภายในคิโวทอสให้กับแท็บเล็ตที่ถูกแฮ็กได้ง่ายนั้น เป็นความคิดที่อันตรายเกินไปค่ะ"
201060-15 = "เพราะถ้า <กล่องแห่งซิสดิม> ถูกคนที่มีเจตนาร้ายช่วงชิงไป ก็อาจนำไปสู่สถานการณ์ที่ไม่อาจแก้ไข#nได้ค่ะ"
201060-16 = "คุณครูเองก็คิดแบบนั้นรึเปล่าคะ?"
201060-19 = ""
201060-23 = "[ns] \"เรื่องนั้น...\""
201060-24 = "เช่นเดียวกัน <คทาแห่งชาเคด> ที่รินบอกว่าเป็นวัตถุหลงยุคอีกหนึ่งชิ้น สำหรับฉันมันก็ดูเป็นแค่เพียงนาฬิกาธรรมดาๆ เท่านั้นค่ะ"
201060-25 = "ยิ่งกว่านั้น การพยายามแก้ปัญหาที่มีความปลอดภัยของคิโวทอสเป็นเดิมพัน โดยพึ่งพาวัตถุหลงยุคที่ไม่รู้แม้กระทั่งหลักการทำงานแบบนี้..."
201060-26 = "จะบอกว่าเป็นแผนการที่ฉันวางไว้ ก็มีแต่การตัดสินใจที่ไม่เข้าใจเต็มไปหมดเลยนะคะ"
201060-27 = "ดูเหมือนว่าอาจต้องมีการ 'ปรับเปลี่ยน' สักเล็กน้อยค่ะ"
201060-28 = "[s] (อย่าบอกนะว่าคิดจะยุบชาเล่ต์น่ะ...?)"
201060-29 = ""
201060-33 = "ฉันแค่ปฏิบัติงานตามเอกสารที่ 'ประธานองค์การนักเรียน' ทิ้งไว้เท่านั้น"
201060-34 = ""
201060-36 = ""
201060-37 = ""
201060-38 = ""
201060-39 = "คงจะไม่บอกว่าไม่รู้เรื่อง แม้กระทั่งเอกสารที่มีเนื้อหาการจัดตั้งชาเล่ต์และดำรงตำแหน่งของคุณครู#nฉบับนี้หรอกนะคะ"
201060-40 = "......"
201060-41 = ""
201060-43 = ""
201060-44 = "ไม่ว่าเรื่องอื่นจะเป็นอย่างไร แต่ลายเซ็นบนเอกสารฉบับนี้ก็เป็นของฉันจริงค่ะ"
201060-45 = "แถมเรื่องผลงานของชาเล่ต์ในพื้นที่ต่างๆ ในคิโวทอสที่เกิดขึ้นระหว่างที่ฉันไม่อยู่ ฉันก็ได้อ่านจากเอกสารอย่างละเอียดแล้ว..."
201060-46 = "ฉันไม่คิดที่จะปฏิเสธคุณค่าของการมีอยู่ของชาเล่ต์ที่ทุ่มเทเพื่อความปลอดภัยของเหล่านักเรียน#nโดยไม่ใช้อำนาจไปในทางที่ผิดหรอกค่ะ"
201060-47 = "ไม่สิ ตรงกันข้าม ฉันขอแสดงความขอบคุณจากใจจริงในนามขององค์การนักเรียนค่ะ"
201060-48 = "[s1] \"โล่งอกไปที...\"\n[s2] \"นึกว่าจะต้องตกงานกะทันหันซะแล้ว...\""
201060-51 = "ไม่มีทางหรอกค่ะ ฉันไม่ใช่คนใจแคบที่ขนาดจะขับไล่ผู้มีพระคุณที่ช่วยเหลือคิโวทอส แค่เพียงเพราะฉันไม่มีความทรงจำในเรื่องนั้นหรอกนะคะ"
201060-52 = ""
201060-54 = ""
201060-55 = "แต่ว่า..."
201060-56 = "คงจะต้องปรับจูนความทรงจำที่ไม่ตรงกันของพวกเรา และพูดคุยกันให้เข้าใจมากกว่านี้ค่ะ"
201060-57 = ""
201060-59 = ""
201060-61 = ""
201060-62 = "ถ้าคุณคือประธานนักเรียน 'ตัวจริง' ละก็..."
201060-63 = "ทำไมจู่ๆ ถึงได้หายตัวไป และทิ้งภาระหน้าที่ไปดื้อๆ กันคะ?"
201060-64 = "แล้วตลอดเวลาที่ผ่านมา คุณไปทำอะไรอยู่ที่ไหนกันแน่?"
201060-65 = "น่าเสียดายที่แม้แต่ตัวฉันก็คงตอบคำถามนั้นอย่างชัดเจนไม่ได้"
201060-66 = "จากบันทึกต่างๆ อย่างน้อยความทรงจำในวันที่ฉัน... หมายถึงประธานองค์การนักเรียนปฏิบัติหน้าที่#nอย่างเป็นทางการครั้งสุดท้ายก่อนที่จะหายตัวไปก็ยังคงแจ่มชัดอยู่ค่ะ"
201060-67 = "วันนั้นฉันตรวจสอบเอกสารทางการที่ส่งเข้ามา เซ็นเอกสาร และลุกออกไปจากห้องตามปกติ"
201060-68 = "แต่ความทรงจำหลังจากนั้น... ฉันนึกอะไรไม่ออกเลย ราวกับมีเมฆหมอกหนาปกคลุมอยู่ในหัวเลยค่ะ"
201060-69 = "ฉันเคยคิดว่าอาจจะเผลอหลับสนิทโดยไม่รู้ตัว แต่พอได้สติขึ้นมาก็พบว่าเวลาผ่านไปนานแล้ว... และสถานการณ์ภายในคิโวทอสก็เปลี่ยนแปลงไปมากค่ะ"
201060-70 = "จากนั้นฉันก็พบกับคุณที่... จำฉันไม่ได้ค่ะ"
201060-71 = "ถึงจะพูดเรื่องที่เข้าใจได้ยากแบบนั้นมาก็เถอะ..."
201060-72 = "ค่ะ ต่อให้ฉันอธิบายไปแบบนี้ มันก็ยังคงเป็นเรื่องที่เข้าใจได้ยากอยู่ดีสินะคะ"
201060-73 = "แม้แต่ตัวฉันในตอนนี้ยังไม่เข้าใจตัวเองเลยค่ะ..."
201060-74 = "แต่ความไม่อาจเข้าใจได้เช่นนี้นี่แหละค่ะ คือแก่นแท้ของโลกใบนี้"
201060-75 = "เมื่อเทียบกับปัญหาและอุบัติเหตุมากมายที่เกิดขึ้นในคิโวทอส การสูญเสียความทรงจำไม่ถึงกับนับว่าเป็นเหตุการณ์พิเศษด้วยซ้ำ"
201060-76 = "แต่การที่เราจดจำหรือเข้าใจบางอย่างไม่ได้นั้น ไม่ได้หมายความว่าเราจะหยุดอยู่กับที่ตลอดไปได้ค่ะ"
201060-77 = "เพราะตัวฉันมีหน้าที่ต้องรับผิดชอบในฐานะของประธานองค์การนักเรียนยังไงล่ะคะ"
201060-78 = "......"
201060-79 = "ริน ต่อจากนี้ถ้ามีเวลาว่างก็มาพูดคุยกับฉันนะคะ"
201060-80 = "ฉันจะให้ความร่วมมืออย่างเต็มที่ จนกว่าคุณจะพบกับประธานองค์การนักเรียนที่คุณยอมรับได้ค่ะ"
201060-81 = "ต่อให้ผลที่ตามมาอาจทำให้คุณจดจำฉันในฐานะตัวปลอมไปตลอดกาล... แต่ฉันก็ไม่อาจละเลยหน้าที่ที่ได้รับมอบหมายได้ค่ะ"
201060-82 = ""
201060-84 = ""
201060-86 = ""
201060-87 = "ทำไมคุณถึง... พูดเหมือนกับเธอคนนั้น..."
201060-88 = "ถ้าอย่างนั้น วันนี้ฉันคงต้องขอตัวไปสะสางงานที่ค้างอยู่ให้เสร็จก่อนนะคะ"
201060-89 = "หากคุณครูแห่งชาเล่ต์มีธุระ ก็แวะมาที่องค์การนักเรียนได้ตามสบายทุกเมื่อเลยนะคะ"
201060-90 = ""
201060-92 = ""
201060-98 = "ห้องประชุมทางไกลที่ 2 ฝ่ายกำกับดูแล"
201060-101 = ""
201060-102 = "ต้องขอโทษด้วยนะคะ ที่เพิ่งมาส่งข่าวคราวหลังจากไม่ได้ติดต่อกันเสียนาน แล้วยังมาขอร้องอย่างกะทันหันแบบนี้..."
201060-103 = "คุณนางิสะ กรุณาถอนร่าง <ข้อบังคับการจำหน่ายใบชาจากทรีนิตี้> ที่ยื่นเข้าประชุมสภาน้ำชาเสนอ เมื่อเดือนที่แล้วได้มั้ยคะ?"
201060-104 = ""
201060-106 = ""
201060-107 = "ฉันก็สงสัยอยู่ว่ามีเรื่องอะไร ประธานองค์การนักเรียนถึงได้เรียกประชุมด้วยตัวเองหลังไม่ได้พบหน้ากัน#nเสียนาน"
201060-108 = "แต่คำตอบของเรายังคงเหมือนเดิมตามที่ได้แจ้งทางฝ่ายกำกับดูแลไปเมื่อครั้งก่อนค่ะ เราคงไม่สามารถถอนข้อบังคับนั้นได้"
201060-110 = "คะ... คือว่าเรื่องนั้น..."
201060-111 = "ข้อบังคับนี้ถือเป็นมาตรการขั้นต่ำ เพื่อลดขั้นตอนเครือข่ายการกระจายสินค้า และจัดหาสินค้าตามความชอบให้แก่เหล่านักเรียนของโรงเรียนได้อย่างสม่ำเสมอค่ะ"
201060-112 = "นอกจากนี้ ยังมีวัตถุประสงค์เพื่อรักษาคุณค่าของใบชาอันเป็นความภาคภูมิใจของโรงเรียนเรา และป้องกันไม่ให้ถูกลดทอนคุณค่าลง จึงขอความกรุณาจากทางองค์การนักเรียนเข้าใจด้วยนะคะ"
201060-113 = "นอกจากนี้ ฉันทราบดีว่าทางองค์การนักเรียนจะไม่แทรกแซงข้อบังคับที่เสนอในเขตปกครองตนเอง#nของแต่ละโรงเรียน..."
201060-114 = "ตอนนี้นโยบายนั้นถูกปรับเปลี่ยนไปแล้วเหรอคะ?"
201060-115 = "เปล่าค่ะ ไม่ใช่อย่างนั้นเลย แน่นอนว่าแต่ละเขตปกครองตนเองมีสิทธิ์เสนอข้อบังคับตามที่เห็นสมควร และทางองค์การนักเรียนก็เคารพสิทธิ์นั้น"
201060-116 = "แต่พอการกระจายสินค้าของใบชาจากทรีนิตี้ที่ครองสัดส่วนใหญ่ในตลาดใบชาของคิโวทอสถูกตัดขาด#nลง ราคาใบชาโดยรวมก็พุ่งสูงขึ้นอย่างมาก..."
201060-117 = "ดูเหมือนว่านักเรียนจากโรงเรียนที่ต้องพึ่งพาแหล่งใบชาจากภายนอก เช่น สถาบันเรดวินเทอร์ กำลังเดือดร้อนอย่างหนักเพราะไม่สามารถดื่มชาอุ่นๆ ได้ค่ะ"
201060-118 = "...แต่ฉันคิดว่าเราไม่ได้มีหน้าที่ต้องใส่ใจกับปัญหาที่เกิดขึ้นภายในสถาบันอื่นนะคะ"
201060-119 = "อ๊ะ จริงด้วยค่ะ ชาแดงที่ทาง <สภาน้ำชา> ส่งมาให้ครั้งก่อนรสชาติดีมากเลยค่ะ"
201060-120 = "รู้สึกเหมือนว่าเมื่อเทียบกับที่เคยดื่มก่อนหน้านี้ จะมีความหวานนุ่มและสดชื่นเพิ่มเข้ามาน่ะค่ะ... หรือว่าเป็นวิธีเบลนด์แบบใหม่เหรอคะ?"
201060-121 = ""
201060-123 = ""
201060-124 = "คุณมีประสาทรับรสที่ละเอียดอ่อนมากเลยนะคะ... ใช่ค่ะ ชาแดงที่ส่งไปครั้งก่อนเป็นสูตรที่ทำขึ้นใหม่ โดยเพิ่มน้ำมันซิตรัสที่ใช้กับเลดี้เกรย์ลงไปนิดหน่อย แล้วเบลนด์ขึ้นใหม่ค่ะ"
201060-125 = "ดีใจที่ถูกปากนะคะ ว่าแต่ทำไมจู่ๆ ถึงพูดเรื่องนั้นขึ้นมาคะ...?"
201060-126 = "พอได้นั่งดื่มชาเลดี้เกรย์ที่หอมสดชื่นแบบนี้ ฉันคิดว่ามันน่าจะเข้ากันได้ดีกับของว่างที่มีรสหวานจัดค่ะ"
201060-127 = "ตัวอย่างเช่น... พายช็อกโกแลตที่โปะด้วยลิงกอนเบอร์รีจากเรดวินเทอร์แบบจัดเต็ม?"
201060-128 = "......"
201060-129 = "ถ้านักเรียนของสถาบันเรดวินเทอร์ที่ปกติก็มักจะทานผลไม้อร่อยๆ กันอยู่แล้ว ได้มาลิ้มลองชาแดง#nจากทรีนิตี้ที่เข้ากันได้ดีกับผลไม้เหล่านั้นละก็... คงช่วยส่งเสริมความประทับใจที่มีต่อโรงเรียนทรีนิตี้ให้#nเพิ่มขึ้นนะคะ "
201060-130 = "คุณนางิสะคิดว่ายังไงบ้างคะ?"
201060-131 = "ชาชั้นดีก็ควรเสิร์ฟคู่กับของหวานที่เหมาะสมค่ะ..."
201060-132 = "เข้าใจแล้วค่ะ ฉันจะพิจารณาข้อเสนอเรื่องถอนข้อบังคับควบคุมการจัดจำหน่ายที่คุณบอกก็แล้วกันค่ะ"
201060-133 = "ขอบคุณที่เข้าใจนะคะ"
201060-134 = "ไม่หรอกค่ะ ฉันเองก็เพลิดเพลินที่ได้พูดคุยกับคนที่มีความรู้เรื่องรสชาติของชาหลังจากไม่ได้ทำเช่นนี้#nมานานแล้วค่ะ"
201060-135 = "หากมาที่ <สภาน้ำชา> คราวหน้า ฉันจะเสิร์ฟชาสูตรใหม่ให้ค่ะ"
201060-136 = "ค่ะ ฉันจะตั้งตารอการพบกันครั้งต่อไปเลยค่ะ"
201060-139 = "ท่ามกลางพฤติกรรมออกนอกกรอบของเหล่านักเรียนเกเรใน D.U. ที่นับวันจะยิ่งทวีความรุนแรงมากขึ้น#nในช่วงนี้..."
201060-140 = "จากการตรวจสอบภายในของฝ่ายป้องกันภัย 50 เปอร์เซ็นต์ของเหตุการณ์และอุบัติเหตุที่เกิดขึ้นในเขต D.U. ในช่วงไม่กี่เดือนที่ผ่านมา เป็นฝีมือของนักเรียนจากสถาบันเกเฮนน่าค่ะ"
