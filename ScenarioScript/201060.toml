201060-210 = "ไม่ได้ทักทายกันนานเลยนะคะ ท่านเชริโน่ ผู้ที่เป็นทั้งประธานนักเรียนของสหภาพเรดวินเทอร์ หัวหน้าฝ่ายตกแต่ง เลขาธิการ หัวหน้าฝ่ายกีฬา หัวหน้าฝ่ายทำความสะอาด ประธานกรรมการ หัวหน้าฝ่ายจัดเลี้ยง และนักชิมอันดับหนึ่งแห่งเรดวินเทอร์  ฉันคือประธานองค์การนักเรียนค่ะ"
201060-211 = "วันนี้หนวดของท่านเชริโน่ก็ยังเปล่งประกายงดงามจริงๆ เลยค่ะ ถ้าไม่เป็นการเสียมารยาท ฉันขออนุญาตถามถึงเคล็ดลับการดูแลพิเศษได้รึเปล่าคะ"
201060-212 = ""
201060-214 = ""
201060-215 = "อะแฮ่ม มองเห็นคุณค่าของหนวดที่เราทะนุถนอมดูแลอย่างดีเช่นนี้ ประธานองค์การนักเรียนนี่สายตา#nเฉียบแหลมจริงๆ!"
201060-216 = "แต่น่าเสียดาย เราคงบอกเคล็ดลับการดูแลหนวดให้ไม่ได้หรอก เพราะว่าเราไม่ได้ดูแลมันเป็นพิเศษ#nเลยยังไงล่ะ!"
201060-217 = "การที่มีหนวดที่ยอดเยี่ยมขนาดนั้นขึ้นมาได้โดยไม่ต้องดูแลเลยนี่น่าอิจฉาจริงๆ ค่ะ ฉันพอจะเข้าใจ#nเหตุผลที่นักเรียนจำนวนมากของเรดวินเทอร์ต่างภาคภูมิใจในหนวดของท่านประธานเชริโน่แล้วละค่ะ"
