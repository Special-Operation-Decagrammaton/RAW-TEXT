212090-81 = "3;사츠키;01;만마전의 정보부장으로서, 지난 과거에 져버리기라도 하면 꼴이 말이 아닐 테니까."
212090-82 = "3;사츠키;02;잠시 숨이라도 돌려야겠네. 선생, 뭐라도 마실래? 커피랑 이거저거 있어.\n#3;m2"
