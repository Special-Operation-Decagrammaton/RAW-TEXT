212090-32 = "3;사츠키;00;아, 선생. 알려준 대로 잘 찾아왔네?"
212090-33 = "[s] \"응. 그런데 이렇게 복잡한 방법으로 들어오는 방이 있구나……\""
212090-34 = "3;사츠키;99;후후, 지금 우리는 기밀을 유지해야 하는 상황이니까."
212090-35 = "3;사츠키;00;미행은 확인했겠지? 뒤에 따라붙는 사람은 없었어?\n#3;em;[?]"
212090-36 = "[s] \"몇 번이고 확인했어.\""
212090-37 = "3;사츠키;03;좋아, 다른 사람도 아니고 선생이니 틀림없겠지."
212090-38 = "3;사츠키;01;여기가 뭐 하는 곳이냐고?"
212090-39 = "3;사츠키;99;후후, 만마전 정보부의 시크릿 챔버에 온 것을 환영해.\n#3;m2"
212090-40 = "3;사츠키;03;나의 마인드 컨트롤 연구가 중점적으로 이루어지는 매우 매우 프라이빗한 공간이랄까.\n#3;em;[음표]"
212090-41 = "3;사츠키;00;아마 부외자로서는 처음일 거야. 영광으로 삼아도 좋아."
212090-42 = "3;사츠키;01;서론이 길어졌지만, 아무튼 오늘은 선생에게 실험 대상이 되어 달라고 부른 거야."
212090-43 = "[s] \"네? 제가요?\""
212090-44 = "3;사츠키;00;응! 뇌제의 NK 울트라 프로젝트를 상대하기 위한 연구에는, 선생이 적극적으로 협조하기로 하지 않았어?\n#3;m3"
212090-45 = "[s] \"그, 그건 그렇지만……!!\""
212090-46 = "3;사츠키;03;어머, 이 비밀스러운 곳에 다른 학생들을 부를 수는 없다구? 만마전 정보부의 특급 기밀 장소니까 말이야.\n#3;em;[반짝]"
212090-47 = "3;사츠키;99;선생은 앞으로 천 년의 동료, 그 이상이 될 사람이니까 여기 불러도 안심이지."
212090-48 = "3;사츠키;01;게다가, 내가 세운 가설은 아무래도 다른 학생들에게 실험해 보기엔 위험 요소가 많은지라."
212090-49 = "[s] \"그런 거라면…….\""
212090-50 = "3;사츠키;03;선생처럼 어떤 유혹이나 고문에도 굴하지 않는 불굴의 정신을 가진 사람이라면 행여나 부작용이 있어도 괜찮을 테니까~\n#3;em;[재잘]"
212090-51 = "#st;[0,0];instant;1;"
212090-54 = "3;사츠키;01;흐응~ 그 긴장한 것 같은 표정은 뭘까? 그렇게 꾸며내지 않아도 괜찮다구?"
212090-55 = "3;사츠키;00;아무튼, 아직 수식을 보완해야 해서. 잠깐만 기다리도록 해.\n#3;em;[반응]"
212090-58 = "#na;(조용히 앉아서 이곳저곳을 구경했다.)"
212090-62 = "3;사츠키;15;……뇌파를 특정 상태로 강제 고정시킨 거라면…….\n#3;em;…\n#3;a"
212090-63 = "3;사츠키;17;……바이너럴 비트를 사용해서? 일단 합성해 보면……."
