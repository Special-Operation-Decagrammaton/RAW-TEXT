[translation]
212090-1 = "第9話;皐月"
212090-3 = "[ns] 「把這裡像這樣……」"
212090-4 = ""
212090-9 = "[ns] 「哦，開了。」"
212090-10 = ""
212090-15 = "（一走進去，眼前出現了一個擺滿各種電子設備的空間）"
212090-16 = ""
212090-18 = ""
212090-19 = ""
212090-20 = "提取載波之後……"
212090-21 = ""
212090-23 = ""
212090-24 = ""
212090-25 = ""
212090-26 = "（皐月似乎正專注於某件事，完全沒發現我來了）"
212090-28 = "[ns] 「我來了，皐月。」"
212090-29 = ""
212090-31 = ""
212090-32 = "啊，老師。#n照我說的順利找到這裡了呢？"
212090-33 = "[s] 「嗯。不過原來還有要用這麼複雜的方法才能進入的房間啊……」"
212090-34 = "呵呵，因為我們現在必須保守機密嘛。"
212090-35 = "你有確認過有沒有被跟蹤吧？#n後面沒有人跟著吧？"
212090-36 = "[s] 「確認過好幾次了。」"
212090-37 = "很好。既然是老師，應該不會有錯吧。"
212090-38 = "你問這裡是用來做什麼的？"
212090-39 = "呵呵，歡迎來到萬魔殿情報部的秘密房間。"
212090-40 = "算是我專門進行精神控制研究的、非常非常私人的空間吧。"
212090-41 = "你大概是第一個進來的外人吧。#n可以引以為榮哦。"
212090-42 = "開場白說得有點長了。#n今天找老師來，是想請你當實驗對象。"
212090-43 = "[s] 「咦？我嗎？」"
212090-44 = "嗯！你不是說過要積極協助對抗雷帝NK-ULTRA計畫的研究嗎？"
212090-45 = "[s] 「是，是沒錯啦……！！」"
212090-46 = "哎呀，總不能把其他學生叫來這麼隱密的地方吧？#n畢竟這裡是萬魔殿情報部的特級機密場所。"
212090-47 = "老師是今後將成為千年級別的夥伴，甚至超越夥伴的人，所以叫你來這裡也很放心。"
212090-48 = "而且我建立的假說要拿其他學生來實驗，似乎有太多危險因素了。"
212090-49 = "[s] 「如果是這樣的話……」"
212090-50 = "如果是像老師這樣，面對任何誘惑或拷問都不屈不撓的人──#n就算萬一有副作用也沒關係吧～"
212090-51 = ""
212090-54 = "哼嗯～那副好像很緊張的表情是怎麼回事？#n不用那樣裝模作樣也沒關係哦？"
212090-55 = "算式還需要再做點補強，麻煩你稍等一下。"
212090-58 = "（安靜地坐著，四處參觀）"
212090-62 = "如果是把腦波強制固定在特定狀態的話……"
212090-63 = "……使用雙耳節拍？#n總之先合成看看……"
212090-64 = ""
212090-66 = ""
212090-67 = ""
212090-68 = "（皐月極為專注地持續計算著某些東西）"
212090-75 = "（不知道過了多久……）"
212090-78 = ""
212090-79 = "唔嗯～真不容易呢～"
212090-80 = "不過還是得做到才行。"
212090-81 = "身為萬魔殿的情報部長，要是輸給了過去可就太難看了。"
212090-82 = "先稍微喘口氣吧。#n老師，要喝點什麼嗎？有咖啡跟其他飲料。"
212090-83 = ""
212090-87 = "哼嗯～我知道了。#n就讓我來展現一下手藝吧。"
212090-88 = ""
212090-90 = ""
212090-94 = "（和皐月一起喝著溫暖的咖啡，稍微休息了一下）"
212090-97 = "[ns] 「話說皐月……」"
212090-98 = "嗯？"
212090-99 = "關於以前的格黑娜學生會情報部……？"
212090-100 = "啊，這麼說來，我好像提過那件事。"
212090-101 = "之前在自我介紹時說過，我是以前消失的格黑娜學生會情報部的繼承者。#n原來你還記得啊？呵呵。"
212090-102 = "嗯，沒錯。#n以前的學生會情報部是雷帝的直屬機關。"
212090-103 = "包括現在出問題的NK-ULTRA計畫在內，是個掌握各種敏感又危險情報的團體。"
212090-104 = "我原本並不隸屬於情報部……倒不如說，隸屬於情報部的是……"
212090-105 = "問我為什麼要自稱是情報部的繼承者？"
212090-106 = ""
212090-108 = ""
212090-109 = "呵呵，這其中有各種緣由……"
212090-110 = "簡單來說，是為了蒐集雷帝留下的危險情報，將其銷毀或妥善管理。"
212090-111 = "之所以特地由我接手……是因為原本在情報部的人大多都跟著雷帝一起消失了。#n留下的人也得去做其他更緊急的事。"
212090-112 = "由於總得有人來做，所以就由我接手了。"
212090-113 = "而且在真琴醬看來，他似乎也確信我不會濫用那些情報。"
212090-114 = "[s] 「原來如此……」"
212090-115 = "前格黑娜學生會已經完全消失，情報部也一樣。"
212090-116 = "之後新設的萬魔殿情報部裡，知道這段過去的人非常少。#n也沒有必要特地知道。"
212090-117 = "這段期間，我在暗中找出了各種雷帝留下的情報或計畫，並將其銷毀……"
212090-118 = ""
212090-120 = ""
212090-121 = "……"
212090-122 = "真琴醬應該沒想到會發生這種事吧。"
212090-123 = "[s] 「……」"
212090-124 = "雖然完全不知道雷帝的NK-ULTRA究竟是怎麼復活的……"
212090-125 = "如果不是意外，那就表示有人取得了相關情報並付諸行動吧。"
212090-126 = "我認為應該不是格黑娜內部的人。"
212090-127 = "因為校內的資料都是尚未完成的東西，而且在驅逐雷帝時就全部銷毀了。#n是真琴醬和我親自處理的。"
212090-128 = "[s] 「這樣的話……是外部的人……？」"
212090-129 = "那個可能性應該很高。"
212090-130 = "在奇普托斯的某處，有崇拜雷帝的殘黨勢力。"
212090-131 = "我們這邊也還沒掌握到組織的所在地。#n他們行動非常隱密，而且是以單線組織的形式活動。"
212090-132 = "大概是驅逐雷帝時消失的前學生會幹部們所經營的組織吧……"
212090-133 = ""
212090-135 = ""
212090-136 = ""
212090-137 = "啊……！如果用這個方法的話，說不定……？"
212090-138 = ""
212090-144 = "（似乎想到了什麼的皐月，再次坐回桌前繼續作業）"
212090-145 = ""
212090-148 = "（雖然最後沒能進行事先說好的實驗，但似乎有了某些收穫）"
212090-150 = "下一話;反抗軍成立"
