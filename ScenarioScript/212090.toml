212090-99 = "\"Gehenna's old Intelligence Committee\"...?"
212090-100 = "Ah, I mentioned that, didn't I?"
212090-101 = "So you remembered when I introduced myself as the heir to the disbanded Gehenna Student Council Intelligence Committee."
212090-102 = "As you might suspect, the old Intelligence Committee directly served the Tyrant Emperor."
212090-103 = "They accessed all sorts of sensitive and dangerous information, including this troublesome NK Ultra Project."
212090-104 = "I wasn't part of the original Intelligence Committee... In fact, the notable student who served in the Intelligence Committee was—"
212090-105 = "No, you asked why I introduced myself as the heir, the inheritor..."
212090-106 = ""
212090-108 = ""
212090-109 = "Fufu, that's a long and winding story..."
212090-110 = "To keep it short, someone needed to collect the Tyrant Emperor's dangerous research and either obliterate it or keep it secure."
212090-111 = "As for why I took on that responsibility... Most of the Intelligence Committee left with the Tyrant Emperor. The others had their hands full."
212090-112 = "Someone had to do it, so I stepped in."
212090-113 = "I suppose Makoto was confident that I wouldn't misuse the information."
212090-114 = "[s] \"That makes sense...\""
212090-115 = "And so, the old Gehenna Student Council was completely purged. As was the former Intelligence Committee."
212090-116 = "Few members of the new Pandemonium Society Intelligence Committee know this history. They don't need to."
212090-117 = "Since then, we've been ardently devoted to destroying the Tyrant Emperor's information and projects..."
212090-118 = ""
212090-120 = ""
212090-121 = "..."
212090-122 = "I suppose Makoto never anticipated us being in this sort of quagmire."
212090-123 = "[s] \"...\""
212090-124 = "I don't know how the Tyrant Emperor's NK Ultra Project came back to life..."
212090-125 = "But if this wasn't an accident, it must mean that someone got their hands on the relevant information and executed it."
212090-126 = "And I don't think it was someone from Gehenna."
212090-127 = "Even the research we found on campus was incomplete, and we destroyed everything we found. Makoto and I did the work ourselves."
212090-128 = "[s] \"That means... An outsider made the broadcast...?\""
212090-129 = "That's highly likely."
