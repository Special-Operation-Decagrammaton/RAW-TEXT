[translation]
212090-1 = "제9화;사츠키"
212090-3 = "[ns] \"여길 이렇게…….\""
212090-9 = "[ns] \"오, 열렸다.\""
212090-15 = "(안에 들어서자, 각종 전자 장비가 가득한 공간이 나왔다.)"
212090-20 = "……캐리어 웨이브를 추출해서……."
212090-26 = "(사츠키는 무언가에 집중한 듯, 내가 온 줄 전혀 모르고 있었다.)"
212090-28 = "[ns] \"나 왔어, 사츠키.\""
212090-32 = "아, 선생. 알려준 대로 잘 찾아왔네?"
212090-33 = "[s] \"응. 그런데 이렇게 복잡한 방법으로 들어오는 방이 있구나……\""
212090-34 = "후후, 지금 우리는 기밀을 유지해야 하는 상황이니까."
212090-35 = "미행은 확인했겠지? 뒤에 따라붙는 사람은 없었어?"
212090-36 = "[s] \"몇 번이고 확인했어.\""
212090-37 = "좋아, 다른 사람도 아니고 선생이니 틀림없겠지."
212090-38 = "여기가 뭐 하는 곳이냐고?"
212090-39 = "후후, 만마전 정보부의 시크릿 챔버에 온 것을 환영해."
212090-40 = "나의 마인드 컨트롤 연구가 중점적으로 이루어지는 매우 매우 프라이빗한 공간이랄까."
212090-41 = "아마 부외자로서는 처음일 거야. 영광으로 삼아도 좋아."
212090-42 = "서론이 길어졌지만, 아무튼 오늘은 선생에게 실험 대상이 되어 달라고 부른 거야."
212090-43 = "[s] \"네? 제가요?\""
212090-44 = "응! 뇌제의 NK 울트라 프로젝트를 상대하기 위한 연구에는, 선생이 적극적으로 협조하기로 하지 않았어?"
212090-45 = "[s] \"그, 그건 그렇지만……!!\""
212090-46 = "어머, 이 비밀스러운 곳에 다른 학생들을 부를 수는 없다구? 만마전 정보부의 특급 기밀 장소니까 말이야."
212090-47 = "선생은 앞으로 천 년의 동료, 그 이상이 될 사람이니까 여기 불러도 안심이지."
212090-48 = "게다가, 내가 세운 가설은 아무래도 다른 학생들에게 실험해 보기엔 위험 요소가 많은지라."
212090-49 = "[s] \"그런 거라면…….\""
212090-50 = "선생처럼 어떤 유혹이나 고문에도 굴하지 않는 불굴의 정신을 가진 사람이라면 행여나 부작용이 있어도 괜찮을 테니까~"
212090-54 = "흐응~ 그 긴장한 것 같은 표정은 뭘까? 그렇게 꾸며내지 않아도 괜찮다구?"
212090-55 = "아무튼, 아직 수식을 보완해야 해서. 잠깐만 기다리도록 해."
212090-58 = "(조용히 앉아서 이곳저곳을 구경했다.)"
212090-62 = "……뇌파를 특정 상태로 강제 고정시킨 거라면……."
212090-63 = "……바이너럴 비트를 사용해서? 일단 합성해 보면……."
212090-68 = "(사츠키는 엄청나게 집중하며 뭔가를 계속해서 계산했다.)"
212090-75 = "(시간이 얼마나 지났을까…….)"
212090-79 = "으음~ 쉽지 않네~"
212090-80 = "하지만 해내야겠지."
212090-81 = "만마전의 정보부장으로서, 지난 과거에 져버리기라도 하면 꼴이 말이 아닐 테니까."
212090-82 = "잠시 숨이라도 돌려야겠네. 선생, 뭐라도 마실래? 커피랑 이거저거 있어."
212090-87 = "흐응~ 알겠어. 실력을 발휘해 보도록 할까."
212090-94 = "(사츠키와 함께 따뜻한 커피를 마시며 잠시 휴식을 취했다.)"
212090-97 = "[ns] \"그런데 사츠키……\""
212090-98 = "응?"
212090-99 = "옛 게헨나 학생회 정보부에 대해서……?"
212090-100 = "아, 그러고 보니 그런 이야기를 한 적 있었지."
212090-101 = "나를 소개할 때 예전에 사라진 게헨나 학생회 정보부의 후인이라고 말했었는데, 기억하고 있었구나? 후훗."
212090-102 = "응, 맞아. 예전 학생회 정보부는 뇌제의 직속 기관이었지."
212090-103 = "지금 문제가 되고 있는 NK 울트라 프로젝트를 포함해, 갖가지 민감하고 위험한 정보들을 손에 쥐고 있던 집단이야."
212090-104 = "나는 원래 정보부 소속은 아니었지…… 오히려 정보부 소속이었던 건……."
212090-105 = "그런데 왜 정보부의 후인을 자처하냐고?"
212090-109 = "후후, 거기에는 이런저런 사연이 있지만……"
212090-110 = "짧게 말하자면, 뇌제가 남긴 위험한 정보들을 수집해서 폐기하거나 안전하게 관리하기 위해서야."
212090-111 = "그걸 굳이 내가 맡은 이유는…… 기존에 정보부에 있던 사람들은 대부분 뇌제와 함께 사라졌고, 남아있던 사람들은 더 시급한 다른 일을 해야 했거든."
212090-112 = "뭐, 누군가는 해야 하니까 내가 맡게 된 거지."
212090-113 = "그리고 마코토 쨩이 봤을 때, 나라면 그 정보들을 악용하지 않을 거라는 확신이 있었던 것도 같고."
212090-114 = "[s] \"확실히…….\""
212090-115 = "어쨌든 전 게헨나 학생회는 완전히 사라졌고, 정보부 또한 마찬가지."
212090-116 = "그 후 신설된 만마전 정보부에서 이런 과거를 알고 있는 사람은 아주 적어. 굳이 알 필요도 없고."
212090-117 = "그동안 알게 모르게 여러 가지, 뇌제가 남긴 정보나 프로젝트를 찾아서 폐기했었는데……."
212090-121 = "……."
212090-122 = "마코토 쨩은, 이런 일이 발생할 거라고는 생각 못 했겠지."
212090-123 = "[s] \"…….\""
212090-124 = "대체 어떻게 뇌제의 NK 울트라가 부활한 건지는 전혀 모르겠지만……"
212090-125 = "사고가 아니라면, 누군가 관련 정보를 획득해서 저질렀다는 이야기겠지."
212090-126 = "……게헨나 내부의 인물은 아닐 거라고 생각해."
212090-127 = "왜냐면 교내에 있던 자료는 미완성이었고, 그나마 뇌제 축출 당시에 모두 폐기했으니까. 마코토 쨩과 내가 직접."
212090-128 = "[s] \"그렇다면…… 외부의 인물……?\""
212090-129 = "아마 그럴 확률이 높아."
212090-130 = "……키보토스 어딘가에 뇌제를 숭배하는 잔당 세력이 있거든."
212090-131 = "조직의 소재지는 우리 쪽에서도 파악하지 못했어.#n워낙 비밀리에 움직이고, 점조직으로 활동하거든."
212090-132 = "아마 뇌제 축출 당시에 사라진 전 학생회 간부진이 운영하는 조직이겠지……."
212090-137 = "아……! 혹시 이 방법이라면……?"
212090-144 = "(뭔가 떠오른 듯한 사츠키는 다시 책상에 앉아 작업을 이어 나갔다.)"
212090-148 = "(결국 예고했던 실험은 하지 못했지만, 뭔가 소득이 있었던 것 같았다.)"
212090-150 = "다음화;저항군 결성"
