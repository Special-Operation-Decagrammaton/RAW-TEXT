212090-99 = "1;사츠키;00;옛 게헨나 학생회 정보부에 대해서……?"
212090-100 = "1;사츠키;99;아, 그러고 보니 그런 이야기를 한 적 있었지."
212090-101 = "1;사츠키;03;나를 소개할 때 예전에 사라진 게헨나 학생회 정보부의 후인이라고 말했었는데, 기억하고 있었구나? 후훗.\n#1;em;[음표]\n#1;m3"
212090-102 = "1;사츠키;01;응, 맞아. 예전 학생회 정보부는 뇌제의 직속 기관이었지."
212090-103 = "1;사츠키;99;지금 문제가 되고 있는 NK 울트라 프로젝트를 포함해, 갖가지 민감하고 위험한 정보들을 손에 쥐고 있던 집단이야."
212090-104 = "1;사츠키;17;나는 원래 정보부 소속은 아니었지…… 오히려 정보부 소속이었던 건…….\n#1;em;…"
212090-105 = "1;사츠키;15;그런데 왜 정보부의 후인을 자처하냐고?"
212090-106 = "#st;[0,0];instant;1;"
212090-108 = "1;사츠키;99\n#1;em;[한숨]\n#1;h\n#wait;1200"
212090-109 = "1;사츠키;01;후후, 거기에는 이런저런 사연이 있지만……"
212090-110 = "1;사츠키;00;짧게 말하자면, 뇌제가 남긴 위험한 정보들을 수집해서 폐기하거나 안전하게 관리하기 위해서야."
212090-111 = "1;사츠키;01;그걸 굳이 내가 맡은 이유는…… 기존에 정보부에 있던 사람들은 대부분 뇌제와 함께 사라졌고, 남아있던 사람들은 더 시급한 다른 일을 해야 했거든."
212090-112 = "1;사츠키;03;뭐, 누군가는 해야 하니까 내가 맡게 된 거지.\n#1;em;[반짝]"
212090-113 = "1;사츠키;02;그리고 마코토 쨩이 봤을 때, 나라면 그 정보들을 악용하지 않을 거라는 확신이 있었던 것도 같고."
212090-114 = "[s] \"확실히…….\""
212090-115 = "1;사츠키;01;어쨌든 전 게헨나 학생회는 완전히 사라졌고, 정보부 또한 마찬가지.\n#1;m4"
212090-116 = "1;사츠키;00;그 후 신설된 만마전 정보부에서 이런 과거를 알고 있는 사람은 아주 적어. 굳이 알 필요도 없고."
212090-117 = "1;사츠키;99;그동안 알게 모르게 여러 가지, 뇌제가 남긴 정보나 프로젝트를 찾아서 폐기했었는데……."
212090-118 = "#st;[0,0];instant;1;"
212090-120 = "1;사츠키;99\n#1;em;…\n#1;h\n#wait;2500"
212090-121 = "1;사츠키;18;……."
212090-122 = "1;사츠키;17;마코토 쨩은, 이런 일이 발생할 거라고는 생각 못 했겠지.\n#1;m3"
212090-123 = "[s] \"…….\""
212090-124 = "1;사츠키;15;대체 어떻게 뇌제의 NK 울트라가 부활한 건지는 전혀 모르겠지만……"
212090-125 = "1;사츠키;18;사고가 아니라면, 누군가 관련 정보를 획득해서 저질렀다는 이야기겠지."
212090-126 = "1;사츠키;15;……게헨나 내부의 인물은 아닐 거라고 생각해.\n#1;em;[반응]"
212090-127 = "1;사츠키;17;왜냐면 교내에 있던 자료는 미완성이었고, 그나마 뇌제 축출 당시에 모두 폐기했으니까. 마코토 쨩과 내가 직접."
212090-128 = "[s] \"그렇다면…… 외부의 인물……?\""
212090-129 = "1;사츠키;18;아마 그럴 확률이 높아.\n#1;em;[한숨]"
212090-130 = "1;사츠키;15;……키보토스 어딘가에 뇌제를 숭배하는 잔당 세력이 있거든."
212090-131 = "1;사츠키;17;조직의 소재지는 우리 쪽에서도 파악하지 못했어.#n워낙 비밀리에 움직이고, 점조직으로 활동하거든."
212090-132 = "1;사츠키;18;아마 뇌제 축출 당시에 사라진 전 학생회 간부진이 운영하는 조직이겠지……."
