[translation]
212090-1 = "ตอนที่ 9;ซัตสึกิ"
212090-3 = "[ns] \"ตรงนี้ต้องทำแบบนี้...\""
212090-4 = ""
212090-9 = "[ns] \"โอ้ เปิดแล้ว\""
212090-10 = ""
212090-15 = "(เมื่อเข้าไปข้างใน คุณครูก็พบพื้นที่ที่เต็มไปด้วยอุปกรณ์อิเล็กทรอนิกส์สารพัด)"
212090-16 = ""
212090-18 = ""
212090-19 = ""
212090-20 = "สกัดคลื่นพาหะออกมา..."
212090-21 = ""
212090-23 = ""
212090-24 = ""
212090-25 = ""
212090-26 = "(ซัตสึกิดูเหมือนกำลังจดจ่ออยู่กับอะไรบางอย่าง จนไม่รู้ว่าคุณครูมาถึงแล้ว)"
212090-28 = "[ns] \"ครูมาแล้ว ซัตสึกิ\""
212090-29 = ""
212090-31 = ""
212090-32 = "อ๊ะ ครู มาถูกทางตามที่ฉันบอกสินะ?"
212090-33 = "[s] \"อื้ม แต่ไม่คิดเลยว่าจะมีห้องที่ต้องเข้าด้วยวิธีซับซ้อนขนาดนี้...\""
212090-34 = "ฮุฮุ ก็ตอนนี้เราอยู่ในสถานการณ์ที่ต้องรักษาความลับนี่นา"
212090-35 = "เช็กเรื่องคนสะกดรอยตามแล้วใช่มั้ย? ไม่มีใครตามมาเนอะ?"
212090-36 = "[s] \"อื้ม ตรวจสอบซ้ำหลายครั้งแล้ว\""
212090-37 = "ดีเลย ถ้าเป็นครูก็คงไม่พลาดหรอก"
212090-38 = "ถามว่าที่นี่เอาไว้ทำอะไรงั้นเหรอ?"
212090-39 = "ฮุฮุ ยินดีต้อนรับสู่ห้องลับของฝ่ายข่าวกรองแพนเดโมเนียม โซไซตี้"
212090-40 = "จะเรียกว่าเป็นพื้นที่ส่วนตัวสุดๆ ที่ใช้วิจัยการควบคุมจิตใจของฉันเป็นหลักก็ได้"
212090-41 = "ครูน่าจะเป็นคนนอกคนแรกที่ได้เข้ามาเลยนะ ถือว่าเป็นเกียรติได้เลย"
212090-42 = "เกริ่นกันพอแล้ว เอาเป็นว่าวันนี้ฉันเรียกครูมา เพราะอยากให้ช่วยเป็นตัวทดลองน่ะ"
212090-43 = "[s] \"หืม? ครูเหรอ?\""
212090-44 = "อื้ม! งานวิจัยเพื่อต่อกรกับโปรเจกต์อัลตร้า NK ของผู้เหี้ยมโหด ครูตกลงว่าจะร่วมมืออย่างเต็มที่เลย#nไม่ใช่เหรอ?"
212090-45 = "[s] \"ระ... เรื่องนั้นก็จริงอยู่หรอก แต่ว่า...!!\""
212090-46 = "อุ๊ยตาย จะให้ฉันเรียกนักเรียนคนอื่นมายังสถานที่ลับแบบนี้ไม่ได้นี่นา? นี่เป็นสถานที่ลับสุดยอดของ#nฝ่ายข่าวกรองแพนเดโมเนียม โซไซตี้เชียวนะ"
212090-47 = "ครูคือคนที่จะเป็นสหายของฉันไปอีกพันปี หรืออาจจะมากกว่านั้นก็ได้ ฉันเลยวางใจให้มาที่นี่ได้"
212090-48 = "แถมสมมติฐานที่ฉันตั้งไว้ ดูจะมีความเสี่ยงมากเกินกว่าจะทดลองกับนักเรียนคนอื่นด้วย"
212090-49 = "[s] \"ถ้าเป็นเพราะแบบนั้นละก็...\""
212090-50 = "ถ้าเป็นคนที่มีจิตใจไม่ย่อท้อต่อสิ่งยั่วยุหรือการทรมานทุกรูปแบบอย่างครู ต่อให้เกิดผลข้างเคียงขึ้นมาบ้างก็คงไม่เป็นไรหรอก~"
212090-51 = ""
212090-54 = "หืมม~ สีหน้าที่ดูประหม่านั่นมันอะไรกัน? ไม่ต้องแกล้งทำขนาดนั้นก็ได้นะ?"
212090-55 = "เอาเป็นว่า ฉันยังต้องปรับสูตรคำนวณอีก รอเดี๋ยวหนึ่งนะ"
212090-58 = "(คุณครูนั่งเงียบๆ พลางมองไปรอบๆ)"
212090-62 = "ถ้าบังคับตรึงคลื่นสมองไว้ในสภาวะเฉพาะ..."
212090-63 = "ใช้ไบนอรัลบีตดีมั้ยนะ...? เอาเป็นว่าลองรวมดูก่อน..."
212090-64 = ""
212090-66 = ""
212090-67 = ""
212090-68 = "(ซัตสึกิจดจ่ออย่างมากและคำนวณอะไรบางอย่างต่อไปเรื่อยๆ)"
212090-75 = "(เวลาผ่านไปนานแค่ไหนแล้วนะ...)"
212090-78 = ""
212090-79 = "อืม~ ไม่ง่ายเลยแฮะ~"
212090-80 = "แต่ยังไงก็ต้องทำให้สำเร็จ"
212090-81 = "ในฐานะหัวหน้าฝ่ายข่าวกรองของแพนเดโมเนียม โซไซตี้ ถ้าแพ้ให้กับอดีตละก็ สภาพคงจะดูไม่จืดแน่"
212090-82 = "ขอพักหายใจสักหน่อยดีกว่า ครู อยากดื่มอะไรมั้ย? ที่นี่มีทั้งกาแฟแล้วก็อย่างอื่นด้วยนะ"
212090-83 = ""
212090-87 = "อื้ม~ เข้าใจแล้ว งั้นขอแสดงฝีมือหน่อยละกัน"
212090-88 = ""
212090-90 = ""
212090-94 = "(คุณครูดื่มกาแฟร้อนกับซัตสึกิและพักผ่อนสักครู่)"
212090-97 = "[ns] \"ว่าแต่ ซัตสึกิ...\""
212090-98 = "หืม?"
212090-99 = "เรื่องฝ่ายข่าวกรองของสภานักเรียนเกเฮนน่าในอดีตเหรอ...?"
212090-100 = "อ้อ เคยพูดถึงเรื่องนั้นไปสินะ"
212090-101 = "ตอนแนะนำตัว ฉันเคยบอกว่าเป็นทายาทของฝ่ายข่าวกรองสภานักเรียนเกเฮนน่าที่หายสาบสูญไป#nในอดีต จำได้ด้วยสินะ? ฮุฮุ"
212090-102 = "อื้อ ใช่แล้วละ ฝ่ายข่าวกรองของสภานักเรียนในอดีตเป็นหน่วยงานที่ขึ้นตรงต่อผู้เหี้ยมโหด"
212090-103 = "เป็นกลุ่มที่ถือครองข้อมูลละเอียดอ่อนและอันตรายสารพัด รวมถึงโปรเจกต์อัลตร้า NK ที่กำลังเป็นปัญหาอยู่ตอนนี้ด้วย"
212090-104 = "เดิมทีฉันไม่ได้สังกัดฝ่ายข่าวกรองหรอก... คนที่เคยสังกัดฝ่ายข่าวกรองน่ะ..."
212090-105 = "แล้วทำไมฉันถึงเรียกตัวเองว่าเป็นทายาทของฝ่ายข่าวกรองงั้นเหรอ?"
212090-106 = ""
212090-108 = ""
212090-109 = "ฮุฮุ เรื่องนั้นมีเบื้องหลังหลายอย่างอยู่..."
212090-110 = "พูดสั้นๆ ก็คือ เพื่อรวบรวมข้อมูลอันตรายที่ผู้เหี้ยมโหดทิ้งไว้ แล้วทำลายหรือเก็บรักษาอย่างปลอดภัย"
212090-111 = "เหตุผลที่ต้องเป็นฉันที่รับหน้าที่นี้ก็คือ... คนที่เคยอยู่ฝ่ายข่าวกรองส่วนใหญ่หายไปพร้อมผู้เหี้ยมโหด ส่วนคนที่เหลืออยู่ก็มีเรื่องอื่นที่เร่งด่วนกว่าต้องทำ"
212090-112 = "ก็นะ ในเมื่อต้องมีใครสักคนทำ ฉันเลยรับหน้าที่เอง"
212090-113 = "แล้วดูเหมือนมาโคโตะจังก็มั่นใจว่าถ้าเป็นฉัน คงไม่เอาข้อมูลพวกนั้นไปใช้ในทางที่ผิด"
212090-114 = "[s] \"นั่นสินะ...\""
212090-115 = "เอาเป็นว่า สภานักเรียนเกเฮนน่าเดิมหายไปอย่างสมบูรณ์ ฝ่ายข่าวกรองของสภานักเรียนก็เช่นกัน"
212090-116 = "ในฝ่ายข่าวกรองของแพนเดโมเนียม โซไซตี้ที่ก่อตั้งขึ้นใหม่หลังจากนั้น มีคนรู้เรื่องในอดีตพวกนี้น้อยมาก แล้วก็ไม่จำเป็นต้องรู้ด้วย"
212090-117 = "ที่ผ่านมา ฉันก็คอยตามหาและทำลายข้อมูลหรือโปรเจกต์สารพัดที่ผู้เหี้ยมโหดทิ้งไว้ ทั้งโดยที่คนอื่นรู้ตัวและไม่รู้ตัว..."
212090-118 = ""
212090-120 = ""
212090-121 = "..."
212090-122 = "มาโคโตะจังคงคิดไม่ถึงว่าจะเกิดเรื่องแบบนี้ขึ้นน่ะ"
212090-123 = "[s] \"...\""
212090-124 = "ไม่รู้เลยว่าโปรเจกต์อัลตร้า NK ของผู้เหี้ยมโหดฟื้นคืนมาได้ยังไง..."
212090-125 = "แต่ถ้าไม่ใช่อุบัติเหตุ ก็แปลว่ามีใครบางคนได้ข้อมูลที่เกี่ยวข้องไป แล้วลงมือก่อเรื่องสินะ"
212090-126 = "ฉันคิดว่าไม่น่าจะใช่คนในเกเฮนน่าหรอก..."
212090-127 = "เพราะข้อมูลที่อยู่ภายในโรงเรียนยังไม่สมบูรณ์ และตอนขับไล่ผู้เหี้ยมโหด พวกเราก็ทำลายทั้งหมดไปแล้ว มาโคโตะจังกับฉันเป็นคนลงมือเอง"
212090-128 = "[s] \"ถ้างั้น... ก็เป็นคนนอกเหรอ...?\""
212090-129 = "มีความเป็นไปได้สูงว่าจะเป็นแบบนั้น"
212090-130 = "นั่นก็เพราะที่ไหนสักแห่งในคิโวทอส ยังมีกลุ่มอำนาจที่บูชาผู้เหี้ยมโหดหลงเหลืออยู่น่ะ..."
212090-131 = "แม้แต่พวกเราก็ยังระบุตำแหน่งขององค์กรนั้นไม่ได้ พวกนั้นเคลื่อนไหวกันอย่างลับๆ และทำงานเป็นเครือข่ายแบบเซลล์"
212090-132 = "คงเป็นองค์กรที่บริหารโดยอดีตคณะผู้บริหารสภานักเรียน ที่หายตัวไปตอนขับไล่ผู้เหี้ยมโหด..."
212090-133 = ""
212090-135 = ""
212090-136 = ""
212090-137 = "อ๊ะ...! ถ้าใช้วิธีนี้ละก็...?"
212090-138 = ""
212090-144 = "(ซัตสึกิเหมือนจะนึกอะไรขึ้นมาได้ จึงกลับไปนั่งที่โต๊ะและทำงานต่อ)"
212090-145 = ""
212090-148 = "(สุดท้ายการทดลองที่บอกไว้ก็ไม่ได้เกิดขึ้น แต่ดูเหมือนว่าจะได้เบาะแสบางอย่างมาแทน)"
212090-150 = "ตอนต่อไป;ก่อตั้งกองกำลังต่อต้าน"
