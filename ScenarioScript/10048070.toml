[translation]
10048070-1 = "제7화;괴도와 밀수의 시간"
10048070-2 = "어느 카페"
10048070-3 = "슬슬 해가 지는군요."
10048070-4 = "이제 이 밤만 지나면, 베로니카 특별전이 열리겠죠."
10048070-5 = "전시회장의 풍경이 상상이 됩니까?"
10048070-6 = "글쎄요……."
10048070-7 = "관람객들은 컨베이어 벨트에 오른 듯 생각 없이 작품들 앞을 휙휙 지나칠 겁니다."
10048070-8 = "그러면서도 유명한 그림 앞에선 개미 떼처럼 몰려들어서 마치 뭔가를 느끼기라도 한 것처럼 고개를 끄덕이겠죠."
10048070-9 = "뭔가를 느꼈을 수도 있지 않나요?"
10048070-10 = "아뇨, 대중은 조금도 알지 못합니다. 진품이 품은 아우라를, 위작이 지닌 조악함을."
10048070-11 = "그들은 그림을 보는 것이 아닙니다."
10048070-12 = "그 그림의 유명세와 거래가만을 보고, 그림의 가치를 멋대로 재단하지요."
10048070-13 = "그들은 그저, 그림을 둘러싼 정보를 보는 것일 뿐입니다."
10048070-14 = "……그럼에도 저는 궁금합니다. 모든 사람이 온전히 예술의 가치를 알아볼 수 있는 그런 날……."
10048070-15 = "언젠가 우리에게도 그런 날이 오기는 할까요?"
10048070-16 = "저는 그날이 올 것으로 생각하지는 않습니다만……."
10048070-17 = "당신은, 어떻게 생각하십니까?"
10048070-22 = "그건 잘 모르겠고, 일단 저희 카페가 곧 마감이라 그런데 일어나 주실 수 있으신가요?"
10048070-23 = "앗, 헛, 앗, 죄송합니다."
10048070-24 = "그, 그럼 이만."
10048070-29 = "와일드헌트 수장고"
10048070-30 = "후우, 이제 내일이면 특별전 시작이구나."
10048070-31 = "수장고에서 경비 서는 게 한두 번이 아니었지만, 이번은 유독 신경이 많이 쓰였어, 그렇지?"
10048070-32 = "……."
10048070-33 = "그냥 멍하니 경비 서고 있는 것도 쉽지 않은데, 이번에는 자애의 괴도까지 끼어들어 버렸으니……."
10048070-34 = "뭐, 오늘까지도 안 나타났으면 오지 않는 거겠지."
10048070-35 = "아무리 괴도라고 해도, 우리가 이렇게 철통같이 지키고 있는데 이런 곳을 털 수 있을 리가……."
10048070-36 = "그런데 말입니다."
10048070-37 = "응?"
10048070-38 = "우리는, 무엇을 누구로부터 지키고 있는 것일까요?"
10048070-39 = "어…… 당연히 도둑으로부터 수장고를 지키고 있는 거지? 정확히 말하자면 작품들을……."
10048070-40 = "관람자들로부터 작품을 지키고 있는 것이 아니고요?"
10048070-41 = "그게 무슨 소리야? 내일부터 전시회인데. 보고 싶은 사람들은 누구나 와서 자유롭게 작품들을 볼 수 있다고."
10048070-42 = "하지만 어떤 작품이 전시회에서 공개될지 정하는 건 베로니카 재단이잖아요."
10048070-43 = "사람들은 재단 측이 골라 놓은 작품들만 볼 수 있을 뿐, 자유롭게 작품을 골라서 감상할 수 없어요."
10048070-44 = "누구나 자유롭게 예술을 누릴 수 있다는 것은, 착각에 불과한 것이죠."
10048070-45 = "……저기, 이번 전시회에는 이 수장고에 있는 모든 예술품이 다 전시될 예정인데?"
10048070-46 = "예. 하지만, 이 수장고에 있는 것은 베로니카 재단이 보유한 예술품의 10%밖에 되지 않기도 하죠."
10048070-47 = "나머지 90%는 여전히 재단 창고 안에 갇혀 있고요."
10048070-48 = "그 누구도 그 아름다움을 누릴 수 없는 상태로……."
10048070-49 = "그것이 올바른 일일까요?"
10048070-50 = "뭐…… 그 예술품의 소유주가 재단이니 어쩔 수 없는 것 아닐까."
10048070-51 = "무엇을 드러낼 지 무엇을 감출지, 그건 예술품을 가진 사람 마음이지 뭐."
10048070-52 = "글쎄요, 만약 온 세상의 강과 호수를 사 버린 사람이 어느 날 식수의 공급을 금한다면, 그것을 받아들일 수 있으신가요?"
10048070-53 = "아니, 그건 이야기가 다르지."
10048070-55 = "아뇨, 다르지 않습니다."
10048070-56 = "예술은, 아름다움은, 모든 사람에게 공유되어야만 해요."
10048070-64 = "어?! 뭐야?! 전등들이……!"
10048070-69 = "퍼버버벙!"
10048070-70 = "여, 연막까지……?!"
10048070-71 = "서, 설마 자애의 괴도가……?!"
10048070-72 = "일단 갈라지죠. 저는 후문 쪽을 맡겠습니다!"
10048070-73 = "으, 응! 그렇다면 난 정문으로 갈게!"
10048070-79 = "그래요, 자애의 괴도……."
10048070-84 = "……제가, 왔습니다."
10048070-86 = "와일드헌트 공터"
10048070-87 = "자애의 괴도 출현! 1, 2, 3분대는 A 구역으로 집결!"
10048070-88 = "훈련한 대로만 움직여! 여기는 우리의 홈그라운드다! 우리가 더 유리해!"
10048070-92 = "예! 지금 바로 A구역으로 집결……."
10048070-99 = "어?!"
10048070-100 = "무슨 일이야?!"
10048070-101 = "대원들이 갑자기 구덩이에 빠졌습니다!"
10048070-102 = "구덩이……? 구덩이가 왜 거기 있어?!"
10048070-103 = "예! 아마도 누군가가 함정을……."
10048070-104 = "함정이라니?! 우리는 함정 설치한 적 없잖아?!"
10048070-110 = "연막?!"
10048070-111 = "어디서 자꾸 연막이 터지는 거야?!"
10048070-112 = "으아아아 이게 뭐야……!"
10048070-113 = "난 이런 상황은 상정하지 않았다고……!"
10048070-117 = "으우우우…… 미안해요 사감대 여러분…… 미안해요 히로미 쨩……."
10048070-118 = "그래도 절대 다치지 않을 종류의 함정만 설치했으니까……."
10048070-119 = "어때, 미요 쨩? 함정들 잘 작동해?"
10048070-120 = "으, 으응. 함정 설치하느라 수고 많았어요, 리츠 쨩."
10048070-121 = "나는? 나한테는 칭찬 안 해줘?"
10048070-122 = "너는 나랑 같이 조금만 더 수고하시죠. 3번, 5번, 액션."
10048070-123 = "옙. 3번과 5번 수동 함정, 작동."
10048070-127 = "또 연막탄이야!!"
10048070-128 = "나 여기 구덩이에 빠졌어! 꺼내 줘!"
10048070-129 = "어디인데?! 하나도 안 보여!"
10048070-131 = "함정에 안 걸린 한 명이 그쪽으로 갔어. 주의해."
10048070-132 = "확인. 후유가 있는 곳 북동쪽 사면, 침투에 취약하니 이동 시 조심하고요."
10048070-133 = "확인. 아, 수장고 서문 쪽으로 병력 산개 확인."
10048070-134 = "12번, 액션."
10048070-135 = "12번 함정, 작동."
10048070-139 = "이쪽은 클리어. 네 쪽으로 합류할게."
10048070-140 = "확인."
10048070-144 = "후우우……."
10048070-145 = "으우우……."
10048070-148 = "나 왔다."
10048070-149 = "잠깐만, 너 괜찮냐? 안색이 안 좋은데."
10048070-150 = "좋을 수가 없잖아요…… 이유야 어찌 되었든 범죄자를 돕고 사감대를 공격 중인데……."
10048070-151 = "그런 고뇌가 들 때는 이 사실을 생각해, 미요."
10048070-152 = "뭘……?"
10048070-153 = "사감대 때문에 실패했던 우리의 수많은 사업들을……!"
10048070-154 = "그냥 밀수를 안 했으면 그럴 일도 없었잖아요?!"
10048070-155 = "하하, 그래도 좋게 좋게 생각해, 미요."
10048070-156 = "이번 일만 성공하면, 우리는 위작을 진품으로 바로잡는 것은 물론이고 자애의 괴도라는 범죄자를 물 먹이는 것까지도 가능해."
10048070-157 = "네가 쓴 이 이야기가, 해피 엔딩으로 귀결될 수 있다고."
10048070-158 = "해피…… 엔딩……."
10048070-162 = "예, 어찌 되었든 여기까지 연재된 이야기를 무를 수는 없죠."
10048070-163 = "끝까지 가보자고요, 결말까지."
10048070-164 = "그래서 후유, 이제 함정이 몇 개 남았죠?"
10048070-165 = "전부 사용했어."
10048070-166 = "좋아, 이것으로 우리가 할 수 있는 일은 다 했어요."
10048070-167 = "남은 것은 자애의 괴도가 도둑질에 성공했기를 바라는 것뿐……."
10048070-168 = "그런데 솔직히 이렇게까지 도와줬는데 실패하면 괴도 딱지 떼어야 하는 것 아닐까?"
10048070-169 = "……그것도 그러네요."
10048070-170 = "자, 그럼 후유, <누가 자줏빛과 푸른빛을 귀여워하랴>의 진품, 가져왔죠?"
10048070-171 = "물론. 내 가방 안에 잘 들어 있어."
10048070-172 = "좋아, 그럼 이제 퇴각하죠."
10048070-173 = "슬슬 해도 떨어져 가니까……."
10048070-175 = "해 질 녘은 이야기를 나누기에 좋은 시간이지요."
10048070-179 = "……!"
10048070-180 = "해가 진 뒤에는, 거짓된 표정은 감춰지고 오직 진실한 목소리만이 떠오르니까요."
10048070-186 = "안녕하십니까, 이름 모를 조력자분들."
10048070-187 = "처음 뵙겠습니다. <자애의 괴도>입니다."
10048070-188 = "우리 잠시…… '이야기'를 나눠 볼까요?"
