[translation]
33220-1 = "제22화;낙원의 이름 3"
33220-3 = "리더……."
33220-4 = "사오리 씨……."
33220-5 = "더 이상 성도회의 현현도 동작하지 않아. ETO가 둘이 된 시점에서, 이 계율은 힘을 잃고 사라져 가고 있어……."
33220-6 = "남은 성도회도, 암브로시우스도 전부……."
33220-7 = "남은 패가 없어. 이건…… 우리의 패배야."
33220-12 = "사오리……. 포기해."
33220-13 = "웃기지 마!!"
33220-14 = "어째서 너만, 어째서 너만……!!"
33220-15 = "우리는 함께 고통받았을 텐데, 함께 절망했을 텐데!! 이 회색의 세계에서!"
33220-16 = "모든 것이 헛되고 또 헛된 이 세계에서, 너만 의미를 가지겠다는 것이냐!"
33220-17 = "너만 그렇게 파란 곳에 남겠다는 거냐!"
33220-18 = "그럴 수 없다!! 그 모든 의미를 부정해주겠다! 네가 트리니티에서 배운 것, 경험한 것, 깨달은 것! 모두, 모두!!"
33220-19 = "모두 헛될 뿐이라는 것을!"
33220-20 = "아니, 헛되지 않아요. 그렇죠?"
33220-21 = "마, 맞아!! 결국 우리는 시험도 모두 합격했고……!!"
33220-25 = "괜찮아. 헛될 지라도, 나는 또 노력을 멈추지 않을 거야."
33220-29 = "사오리. ……나는 이제 지지 않아."
