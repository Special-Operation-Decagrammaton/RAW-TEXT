[translation]
32185-2 = "아아…… 이건 체크메이트네……."
32185-3 = "어째서 이게 이렇게 된 거지?"
32185-4 = "세이아 쨩이 습격당할 때도 가만히 있었던 시스터후드가 하필 지금 움직이다니…… 농담도 지나치잖아."
32185-5 = "뭐지? 내가 뭘 놓친 거지?"
32185-6 = "하나코 쨩? 너를 얕봤었기 때문에?"
32185-7 = "……."
32185-8 = "아니, 우라와 하나코는 엉뚱하지만 무해한 존재였어. 변수로 계산하지 않는 게 당연했어."
32185-9 = "아즈사 쨩? 네가 배신을 해버려서……?"
32185-10 = "……."
32185-11 = "아니, 저 아이는 꼭두각시에 불과해. 아즈사의 배신 여부는 내 결과에 아무런 상관이 없었어."
32185-12 = "히후미 쨩? 평범한 아이일 뿐이고, 코하루 쨩? 바보잖아. 변수로 고려할 필요도 없잖아."
32185-13 = "그런데 어째서 난 보충수업부 같은 거에 패배해버린 거야?"
32185-14 = "왜지? 어디서부터 잘못된 거지?"
32185-15 = "[s] \"…….\""
32185-16 = "……아아. 그렇구나. 가장 큰 변수가 있었어. <샬레>의 선생님……."
32185-17 = "내 패인은…… 선생님을 데려온 것이었구나."
32185-18 = "나기 쨩이 배신자가 있다고 폭주하길래 대비책으로 적당히 불러온 <샬레>가…… 거기서부터였나."
32185-19 = "정말. 얕잡아봐선 안 되었는데."
32185-20 = "여기까진가 보네……."
32185-21 = "미카 씨. 세이아 쨩은……."
32185-22 = "……. 세이아 쨩을 죽일 생각은 없었어. 내가 악당으로 보이겠지만, 그정도로 나쁜 사람은 아냐."
32185-23 = "그건 사고였어. 세이아 쨩, 애초에 몸이 약했고…… 또……."
32185-24 = "아뇨, 세이아 쨩은 죽지 않았어요."
32185-25 = "……?!"
32185-26 = "그렇게 된 것처럼 위장한 것뿐이에요."
32185-27 = "습격의 범인을 찾지 못했기에 안전을 위해서……. 비밀리에 트리니티를 빠져나가 몸을 숨기고 있는 중이에요."
32185-28 = "세이아 쨩이……? 죽지 않았다고……?"
32185-29 = "네. 상처가 낫지 않아서 아직 깨어나지 못하고 있지만…… 구호기사단장이 지금도 곁을 지켜주고 있어요."
32185-30 = "미네 단장이……?"
32185-31 = "네. 그리고 그때 세이아 쨩의 목숨을 구해준 사람이…… 아마도……."
32185-32 = "……."
32185-33 = "……아뇨. 이건 당사자에게 직접 물어보는 게 맞겠죠."
32185-34 = "……그렇구나. 살아있었구나……."
32185-35 = "……다행이야. 응. 세이아 쨩……."
32185-41 = "항복- 내가 졌어."
32185-42 = "보충수업부- 그리고 선생님. 너희들의 승리라고 해둘게."
32185-43 = "이제 잡아먹든 말든 마음대로 해."
32185-44 = "……."
32185-45 = "아즈사 쨩. 이 행동의 결과는 이해하고 있겠지?"
32185-46 = "물론이야."
32185-47 = "트리니티가 널 보호해줄 거라고 생각해?"
32185-48 = "넌 계속 쫓기게 될 거야. 어딜 가든."
32185-49 = "잠도 못자고. 아마도 어디서든 안심하지 못하겠지."
32185-50 = "네가 사오리에게서 벗어날 수 있을 거 같아? 아리우스 출신이라면, 알고 있잖아. et omnia vanitas를……."
32185-51 = "알고 있어. 그래도 나는 끝까지 발버둥 칠거야. 할 수 있는 데까지."
32185-55 = "……. 그렇구나. 응."
32185-61 = "[ns] \"미카…….\""
32185-62 = "아니, 말하지 마. 선생님."
32185-63 = "샬레를 끌어들인 게 내 최대의 실수였어."
32185-64 = "응, 그치만……"
32185-66 = "[ns] \"필요하다면 미카의 편이 되어줄게.\""
32185-69 = "……그 말을 들었을 땐 진짜 기뻤어. 응. 그건 진심이야."
32185-70 = "그때 내가 조금만 더 다른 선택지를 택했다면……."
32185-71 = "……응, 역시 아무것도 아냐."
32185-72 = "안녕. 선생님."
32185-79 = "다음화;제3차 평가 시험"
