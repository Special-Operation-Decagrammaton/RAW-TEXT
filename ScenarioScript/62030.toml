62030-217 = "(그리고, 선생님께서는……?)"
62030-220 = "\"……그 사람이, 믿는 것.\""
62030-221 = "\"어떤 것은 그런 식으로 작동하지 않으니까.\""
62030-222 = "\"사람을 행동하게 만드는 건, 감정과 믿음이거든.\""
62030-226 = "\"그게 어떤 위대한 무언가에 대한 믿음이든.\""
62030-227 = "\"……자기 자신 안의 무언가에 대한 믿음이든 간에.\""
62030-228 = "(그렇지만, 선생님.)"
62030-229 = "(저는 이 순간, 무엇을 믿어야 할까요.)"
62030-230 = "(가르쳐 주세요. 선생님.)"
62030-231 = "([ruby= 트리니티]우리들[/ruby]이 만들어 온 이 모든 슬픔과 비극에, 우리는…… 무엇을 할 수 있다는 걸까요……?)"
62030-236 = "[log]네가 믿는 것을 하렴.[/log]"
62030-240 = "(……? 선생님께서는 이런 말씀을 하신 적이 없었을 텐데요……?)"
62030-243 = "네가 믿어 온 것."
62030-244 = "그리고 너를 지탱해 오고 살아오게 했던 것."
62030-246 = "(아뇨, 그렇군요. 이것은…….)"
62030-247 = "(네. 선생님이라면 분명, 이렇게 말씀하셨겠지요.)"
62030-250 = "우리는 분명 과거를 바꿀 수 없겠지만."
62030-251 = "그럼에도 불구하고, 지금을 살아갈 수 없는 것은 아닐 것이니."
62030-254 = "네가 지금까지 걸어온 길이, 틀리지 않았다면"
62030-255 = "그 길을 계속 지키는 것으로, 너를 증명하거라."
62030-256 = "(제가, 걸어온 길.)"
62030-257 = "(그것은…….)"
62030-262 = "[log]너에게[/log]"
62030-264 = "[log]도움을 청하는 자들의 목소리를 저버린다면.[/log]"
62030-266 = "[log]너를, 누구라고 정의할 것이냐.[/log]"
62030-270 = "……!!!"
62030-271 = "(……그렇군요. [ruby=선생님]당신[/ruby]께서는, 그렇게……!)"
62030-275 = "……."
62030-276 = "답하겠습니다."
62030-277 = "이것은 당신들의 물음에 대한, 온전한 답은 아닐 겁니다."
62030-278 = "단지, 당신들이 저에게 진정으로 묻고자 했던, '그럼에도 불구하고 어째서 살아갈 수 있느냐'는 물음에 대한 답입니다."
62030-280 = "세상은 이미 슬픔으로 넘치고 있으니, 그것은 피할 수 없는 현실입니다."
62030-281 = "현재는 과거라는 기반 위에 기초를 올린 건축물이니, 그것은 당신들의 말처럼 명백한 사실입니다."
62030-284 = "그러나, 저의 보잘것없고 무의미한 몸짓으로."
62030-285 = "그것을, 단 한 숟갈만이라도 덜어낼 수 있다면."
62030-286 = "저는, 그 이상 아무것도 바랄 것이 없습니다."
62030-292 = "지켜야 할 것이 있다."
62030-293 = "대가 따위 돌아오지 않아도 괜찮다."
62030-294 = "언제부터 감히 그런 것을 생각하고 있었던가."
62030-295 = "옳다고 믿는 것을 행하는 것이야말로, 긍지일 것이니."
62030-299 = "신념과 긍지를, 가슴에."
62030-302 = "돌아보면 어디에든 구원을 바라는 목소리가 있었다."
62030-303 = "원통한 것은 그 모든 목소리들을 향해 달려갈 수 없었다는 것."
62030-304 = "어째서 사람의 몸은, 언제나 하나뿐인 것일까."
62030-306 = "그렇다면 해야 할 일은, 최소한"
62030-307 = "그 목소리들에 조금이라도 더 귀를 기울이는 것"
62030-309 = "적어도 주위의, 손이 닿는 사람들에게만이라도 이 미약한 손을."
62030-310 = "그리고, 그 작고 보잘것없는 선택들이 모이고 쌓여."
62030-311 = "조금이라도 좋으니, 우리 모두가,"
62030-316 = "언젠가는 더 넓은 곳으로 나아갈 수 있기를."
62030-319 = "구호가 필요한 곳에, 구호를."
62030-326 = "모두! 제 뒤로 몸을 피하십시오!"
62030-331 = "단장님?!"
62030-332 = "단장님!?"
62030-337 = "구호기사단이, 이제부터 여러분을 지키겠습니다!"
