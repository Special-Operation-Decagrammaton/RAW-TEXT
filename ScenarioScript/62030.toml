62030-26 = "미네 씨?!"
62030-27 = "큭……?!"
62030-41 = "(뭐…… 죠?)"
62030-42 = "(바닥이 없는 검은 늪으로, 빠져들어 가는 느낌이……!)"
62030-47 = "——!!!"
62030-54 = "그것은 해석의 차이였다."
62030-55 = "보기에 따라서는 단순했고"
62030-56 = "보기에 따라서는 사소했다."
62030-59 = "그러나 그들은 자신들에게 진리의 해석권이 있다고 믿었다."
62030-60 = "인간은 그 무엇보다 자신의 옳음을 신 앞에 증명받기 원하니"
62030-61 = "옳을 권리를 내세웠다는 것은, 다른 모든 것이 틀려야 한다는 것을 의미했다."
62030-64 = "이 공의회의 결과를 여기에 선포하노니."
62030-71 = "아리우스에게 이제로부터 영원토록 파문을 선고하노라."
62030-72 = "거룩하신 부모와, 거룩하신 자녀와, 거룩하신 영혼의 이름으로."
62030-79 = "[log]그것이[/log]"
62030-81 = "[log][ruby=아리우스]우리[/ruby]의 기나긴 핍박의 역사였다.[/log]"
62030-84 = "(이것, 은…… 아리우스의…….)"
62030-91 = "길은 존재하지 않았으니, 우리의 곱은 손으로 그것을 열어야 했다."
62030-92 = "빛은 우리에게서 자취를 감췄고, 우리는 썩은 쥐처럼 울부짖으며 하수를 뒤집어써야 했다."
62030-93 = "가장 높은 하늘로부터 가장 낮은 땅에 이르기까지."
62030-94 = "[ruby=트리니티]그들[/ruby]은 우리를 존재하지 않았던 것으로 만들고자 했다."
62030-97 = "그리하여 살아남는 것이 유일한 저항이요, 숭고가 되었으니."
62030-98 = "밖을 향하지 못한 증오는, 마침내 우리 자신에게 되돌려져야 했다."
62030-104 = "많은 자들이 사라졌다."
62030-105 = "사라질 필요가 없는 자들이 사라졌다."
62030-106 = "서로를 미워할 필요가 없는 자들이 서로를 미워했다."
62030-111 = "[log]그렇기에.[/log]"
62030-113 = "[log]헛되고 헛되니, 모든 것이 헛되도다.[/log]"
62030-116 = "……!"
62030-119 = "[ruby=트리니티]추방한 자들[/ruby]은 말했다. 너희는 그러해야 했기에 추방당했다고."
62030-120 = "[ruby=트리니티]추방한 자들[/ruby]은 말했다. 너희는 너희들의 결과로 말미암았다고."
62030-121 = "[ruby=트리니티]추방한 자들[/ruby]은 말했다. 너희는 고통받아야 했기에 고통받았다고."
62030-123 = "그러나, 말하노니."
62030-124 = "'처음부터 그러해야 하는 것'은, 어디에도 없는 것이다."
62030-127 = "그들은 마땅히 대답해야 할 것이니, 그들이 만든 과거가 아니었다면, [ruby=아리우스]우리[/ruby]는 어디에 서 있었을 것인가."
62030-128 = "그들은 마땅히 대답해야 할 것이니, 그들이 만든 역사가 아니었다면, [ruby=아리우스]우리[/ruby]는 어떤 내일을 꿈꿀 수 있었는가."
62030-129 = "그들은 마땅히 대답해야 할 것이니, 그들이 만든 증오가 아니었다면, [ruby=아리우스]우리[/ruby]는 어떤 사랑을 베풀 수 있었는가."
62030-134 = "잘못했어요…… 용서해 주세요…… 잘못했어요……."
62030-135 = "죄송해요…… 죄송해요…… 다시는 안 그럴게요……."
62030-136 = "……!"
62030-141 = "희망을 품는 아이가 죄가 되는 세계가 있다."
62030-142 = "행복해지고 싶다고 기도하는 아이가 죄가 되는 세계가 있다."
62030-143 = "다시는 반항하지 않을게요…… 희망을 품지 않을게요……"
62030-144 = "다시는 행복해지고 싶다고 기도하지 않을게요…… 그러지 않을게요……."
62030-146 = "그 세계에서는 자비조차도 본래의 뜻을 잃고 퇴색하기 마련이다."
62030-147 = "제발…… 자비를……."
62030-148 = "자비를……."
62030-151 = "답할지어다."
62030-152 = "아이들을 사라지게 한 진리에, 어떠한 거룩함이 깃들 수 있는가."
62030-153 = "음식을 훔치며 얼어붙은 손발을 녹여야 하는 아이의 울음 앞에, 어떠한 옳음이 가치를 주장할 수 있는가."
62030-154 = "생은 무의미한 고통뿐이라고 이야기하는 아이의 앞에서, 어떠한 정의가 형평을 이야기할 수 있는가."
62030-155 = "그것, 은……."
62030-156 = "답할지어다!"
62030-157 = "그대에게는 그렇게 해야 할 의무가 있으니!"
62030-158 = "이는 모든 현재가 과거라는 기반 위에 그 기초를 두고 있음이다!"
62030-160 = "해석의 차이였다. 단순했고 사소했으며 의미조차 없었다."
62030-161 = "그러나 그것이 모든 이들의 울분과 분노와 증오를 이끌었으니."
62030-162 = "이 땅의 아이들은 그 누구보다 죽음에 가까이 맞닿아 있었다."
62030-163 = "그럼에도 불구하고 그대는, 어떤 의미를 가지고 감히 살아갈 수 있는가."
62030-164 = "답할지어다."
62030-169 = "가지고, 있지…… 않습니다."
62030-170 = "거기에 대한 답을…… 저는, 가지고 있지 않습니다."
62030-171 = "그것은 애초부터 답이 존재해서는 안 되는…… 그런, 물음입니다."
62030-172 = "흑……."
62030-173 = "흑……. 으흑……."
62030-183 = "[log]하늘의 별과 달조차도[/log]"
