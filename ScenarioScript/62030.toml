[translation]
62030-1 = "제3화;구호가 필요한 곳"
62030-2 = "꺄악!"
62030-3 = "으아앙?!"
62030-4 = "아츠코! 물러나!"
62030-8 = "크윽?!"
62030-10 = "미, 미사키 씨?!"
62030-17 = "윽……?!"
