[translation]
84312100600-5 = "……혹시 이건가요?"
84312100600-10 = "……?"
84312100600-12 = "……아아아앗-!! 내 컨트롤러!!"
84312100600-14 = "그러니까 언니 컨트롤러가 아니래도……"
84312100600-16 = "어, 어디에 있었어요……? 이상하다. 그 근방은 아까 전 저희도 찾아봤었는데……"
84312100600-17 = "음……? 그런가요? 꽤 잘 보이는 곳에 떨어져 있었는데……"
84312100600-24 = "작동한다, 오 작동해!"
84312100600-25 = "게다가 뭔가 고장 났던 부분들도 다 고쳐져 있어!"
84312100600-26 = "그게 무슨 소리야, 언니. 고장 났던 부분이 고쳐져 있다니, 그런 말도 안 되는……"
84312100600-31 = "……어라. 정말이잖아. 무슨 일이지?"
84312100600-32 = "이제 이걸로 다시 다 같이 협동 게임을 할 수 있어!! 더는 지체할 수 없다고, 바로 시작하자!!"
84312100600-33 = "언니, 그 전에 감사 인사를……"
84312100600-35 = "아뇨. 감사를 받을 정도의 일은 아니었던 게……"
84312100600-41 = "……아리스 씨?"
84312100600-42 = "도적님도 모르시는 겁니까? 어떻게 저희의 컨트롤러가 저기 있었는지?"
84312100600-46 = "그렇다면 이것은…… 전개상 분명 현자의 소행이겠군요."
84312100600-51 = "현자의 소행……?"
84312100600-55 = "(……리오.)"
84312100600-56 = "……후후. 그럴지도 모르겠네요."
84312100600-57 = "자, 도적님. 파티에 가입하는 겁니다!"
84312100600-58 = "……? 네? 저요?"
84312100600-59 = "네! 저희와 함께 게임을 하는 것입니다!"
84312100600-61 = "도적님이 구해준 이 컨트롤러로, 함께!!"
84312100600-66 = "후후. 좋습니다. 타락 마법에도 면역이 있는 이 왕도적이 함께해 드리죠."
84312100600-67 = "……잠깐만이에요."
84312100600-68 = "……네!!"
