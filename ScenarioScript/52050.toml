[translation]
52050-1 = "제5화;기억 저편의 그리움"
52050-10 = "지금으로부터 열 달 전, 아야메가 내게 백련을 넘기고 쿠즈노하 님을 찾아 북쪽의 땅으로 떠났을 때."
52050-11 = "나는 당황해서 아무런 행동도 취할 수가 없었어."
52050-12 = "나는 아야메를 대신할 수 없다고. 아야메를 대신하여 백화요란의 부장 대리 역할을 맡는 건 있을 수 없는 일이라고…… 그렇게 생각했었어."
52050-15 = "그리고 그 생각은 곧 확신으로 바뀌었고, 정신을 차리고 보니 나는 어느새 대설원으로 발을 옮기고 있었지."
52050-26 = "시간이 얼마나 흘렀을까. 밤낮이 몇 번이나 바뀌었을까."
52050-27 = "인적 하나 없는 드넓은 대설원에서 사람 하나를 찾는 건 쉬운 일이 아니었고, 결국 나는 탈진하기 직전에 이르러서야 <황혼의 사원>이 존재했다는 빈터에 도달할 수 있었지."
52050-39 = "그리고 아야메는, 그곳에서 누군가를 기다리듯 외롭게 서 있었어."
52050-40 = "백화요란의 부원이라면…… 모두 아야메의 얼굴을, 그 목소리를 기억하고 있잖아?"
52050-41 = "흐린 날에도 햇살처럼 반짝이던 그 미소를, 지친 몸을 따스하게 감싸주던 그 살가운 목소리를."
52050-42 = "백련을 쥔 손끝이 얼어붙는 듯한 대설원의 추위 속에서, 따스한 봄날의 하늘 같은 물빛의 하오리를 보았을 때. 나는 내심 바라고 있었어."
52050-45 = "바보같이 모든 것을 내버려두고 응석을 부리러 온 나를, 평소처럼 돌아봐 주기를 바랐어."
52050-46 = "어쩔 수 없다는 듯 미소 지으며 손을 내밀어 주기를 바랐어."
52050-47 = "그리고 다시 우리들의 부장으로 돌아와 주기를 바랐어."
52050-49 = "하지만, 내가 아야메에게 들었던 말은……"
52050-55 = "여기는 뭣 하러 찾아온 거야?"
52050-61 = "그동안 단 한 번도 들은 적 없었던 차가운 목소리."
52050-62 = "상대를 위압하며 괄시하는 듯한 싸늘한 그 눈빛."
52050-72 = "그건…… 내가 기억하고 있는 아야메의 모습이 아니었어."
52050-75 = "어째서 왔냐니…… 아야메, 나는 너를 데리러……"
52050-76 = "말했잖아. 나는 쿠즈노하 님을 만나러 왔다고. 쿠즈노하 님을 만나기 전까지는 돌아가지 않겠다고."
52050-77 = "하지만 네가 없어서 모두가 불안해하고 있어."
52050-78 = "모두가 믿고 따르는 백화요란의 부장이 사라진 탓에, 모두가 혼란스러워하고 있어."
52050-79 = "……이만 돌아가자, 아야메."
52050-85 = "너도 알고 있잖아, 아야메."
52050-86 = "쿠즈노하 님은 먼 옛날의 기록에나 나오는 풍문과 같은 존재인걸—"
52050-87 = "풍문? 쿠즈노하 님이 한낱 풍문이라고……?"
52050-92 = "……그래. 그럴지도 모르지. 사원은 먼 옛날에 풍화되어 눈 아래 파묻히고, 이렇게 애타게 불렀는데도 흔적조차 보여주지 않는 걸 보면 말이야."
52050-93 = "하지만 그래도 나는, 쿠즈노하 님을 만나야만 해."
52050-94 = "나구사. 너는 모를 거야. 내가 어째서 쿠즈노하 님을 만나고자 하는지."
52050-96 = "아니야, 나도…… 이해할 수 있어."
52050-97 = "아야메는 책임감이 강한 사람이니까. 이 모든 혼란 속에서 모두를 지킬 수 있도록, 쿠즈노하 님께 기책을 받으려는 거지?"
52050-101 = "하하……"
52050-102 = "하하하하……!"
52050-106 = "정말 나구사, 너는 나를 모르는구나."
52050-110 = "너는 단 한 번도 나를 이해한 적이 없었구나."
52050-114 = "아야메, 어째서 그런 말을—"
52050-119 = "본래 사람의 마음이란, 서로 이해할 수 없는 불가해의 존재인 법."
52050-120 = "상대를 이해한다는 것은 단순한 오만이며, 한낱 유리처럼 깨지기 쉬운 것에 불과하거늘."
52050-121 = "그대는 무능하며, 또 오만하구나."
52050-125 = "당신은……?"
52050-132 = "나는 그저 풍류를 사랑하고 이야기 듣기를 좋아하는 과객일 뿐."
52050-133 = "인적 드문 설산에서 누군가가 길을 찾고 있기에 마중을 나온 것뿐이니라."
52050-137 = "당신은 쿠즈노하가 어디에 있는지 알아?"
52050-138 = "아니, 나 역시 피안의 경계에 닿지 못해 풍류로 슬픔을 달래는 원혼 같은 존재일 뿐."
52050-143 = "하지만 가는 길이 다르더라도 그대의 목적지까지 동행해 줄 수는 있지."
52050-147 = "그럼…… 당신이 내 길을 안내해 줘."
52050-155 = "안 돼. 아야메를…… 내 친구를 데려가지 마!"
52050-159 = "……친구?"
52050-166 = "나구사."
52050-171 = "나는 너를 단 한 번도 친구라고 생각한 적이 없었어."
52050-174 = "세상에…… 아야메 선배가 그런 잔혹한 말씀을 하셨단 말씀이신가요?"
52050-175 = "설마. 아야메 부장이라면 아무리 화가 나더라도 그런 말을 하진 않았을 텐데."
52050-176 = "……내가 아는 아야메 부장답진 않네."
52050-181 = "응. 나도 그렇게 생각해. 평소의 아야메라면 절대로 하지 않았을 말이니까."
52050-182 = "나도 그날 본 아야메의 모습이 설원에서 꾼 지독한 악몽이 아니었을까, 부정하려 했지만……"
52050-183 = "그녀의 옷자락과 함께 삼켜졌던 내 팔이. 팔의 상처가 그날의 기억을 계속 떠올리게 해."
52050-184 = "그래서, 아야메 부장은 그 후로 계속 보지 못했던 거야?"
52050-185 = "응. 피로와 긴장이 겹친 탓이었을까. 그 직후에 바로 의식을 잃어버렸거든."
52050-186 = "인적 없는 대설원에서 의식을 잃다니, 그대로 동사하더라도 이상하지 않을 상황이었지만……"
52050-187 = "다행히 다른 이의 도움을 받아 목숨은 구할 수 있었어."
52050-189 = "인적이 드문 설원에서 마침 지나가는 이가 있었다니, 다행스럽게도 [ruby=기적]천운[/ruby]이 따르신 모양이어요."
52050-193 = "……천운이라."
52050-194 = "그래, 천운이라는 게 있었다면 좋았을 텐데."
52050-199 = "……으음."
52050-203 = "……정신을 차렸는가?"
52050-210 = "정신이 온전히 들었거든 문간에 난 길을 따라 산 아래에 있는 마을로 돌아가게. 이곳에서는 기력을 보존할 수는 있어도 회복할 수는 없거든."
52050-211 = "네가…… 나를 구해준 거야?"
52050-212 = "후후, 초면에 옛 선배를 너라고 부르다니, 고얀 녀석이구나."
52050-213 = "하지만 경황도 없을 터이니 다소의 무례는 눈감아 주도록 하지. 그래, 자네의 이름은 기억하고 있는가?"
52050-214 = "나는…… 백화요란 분쟁조정위원회의 부장 대리…… 고료 나구사."
52050-220 = "겨울에 벚꽃이 흐드러지게 피어 있다니, 이곳은 대체……"
52050-224 = "이상하구나, 이곳에 오면서도 벚꽃 내음을 맡지 못했다니."
52050-225 = "이 <황혼의 사원>은 현실과 시간이 달리 흘러가기에, 석산과 벚꽃이 함께 피더라도 이상하게 여길 필요가 없지."
52050-229 = "이곳이 황혼의 사원이라고……?"
52050-230 = "그럼 당신이 대 예언자, 쿠즈노하라도 된다는 말이야?"
52050-232 = "흐음……."
52050-233 = "그래. 자네의 말처럼 만일 내가 진짜 쿠즈노하라면, 어찌할 생각이지?"
52050-234 = "백화요란의 후계로서, 내게 묻고자 하는 계책이라도 있는 것인가?"
52050-241 = "아니, 당신은 쿠즈노하가 아니야."
52050-242 = "호오."
52050-243 = "당신이 진짜 쿠즈노하라면…… 당신을 애타게 찾던 아야메의 부름을 모른 체하고, 보잘것없는 나를 구해주었을 리가 없어."
52050-244 = "그렇게 매정하고 야박한 사람이 백화요란의 초대 부장이었던 쿠즈노하일 리가 없어."
52050-245 = "자네의 생각이 그렇다면 굳이 부정할 마음은 없네."
52050-246 = "하지만…… 마침 좋은 기회로군. 목숨을 구해준 값이라고 할까. 작은 심부름 하나만 부탁하지."
52050-254 = "이 두루마리는……"
52050-255 = "나를 찾는 이에게 전하는 서신일세."
52050-256 = "받는 사람은 <샬레>의 선생. 그리고 그 내용은—"
52050-260 = "누군가를 구원하는 방법에 관한 것."
52050-265 = "………내가 겪은 이야기는 여기까지야."
52050-266 = "방금 말한 것처럼 나는 아야메를 구하지 못했을 뿐만 아니라, 그녀에게 거부당하고 그 여파로 남은 한 손마저 제대로 쓸 수 없는 상태가 되었어."
52050-267 = "이 사실을 숨겨왔던 이유는 전에 말했던 것처럼…… 진실이 드러나 모두가 내게 실망하고 떠나갈까 봐 두려웠기 때문이었어."
52050-268 = "……하지만 이제는 도망치지 않을 거야."
52050-269 = "솔직하게 생각하고 느낀 대로, 부디 나를 책망하고 미워해주었으면 좋겠어."
52050-275 = "그런…… 그런 일로……"
52050-276 = "그런 일로 나구사 선배를 책망할 리가 없잖사와요!"
52050-280 = "유, 유카리……?"
52050-281 = "그 혼란스러운 와중에 아야메 선배를 찾으러 대설원까지 간 건 나구사 선배뿐인데……"
52050-282 = "백화요란의 그 누가 선배를 책망할 수 있단 말씀이신가요?"
52050-283 = "……지난번 일로 조금은 성장한 줄 알았는데, 선배는 여전히 바보구나."
52050-284 = "언제나 상냥하고 명랑했던 아야메 부장이 갑자기 무언가에 홀린 것처럼 태도를 바꾸고, 그 타이밍에 화조풍월부가 나타나 부장을 습격했다면……"
52050-285 = "백화요란을 음해하려는 화조풍월부의 계책일 게 분명하잖아?"
52050-286 = "맞사와요. 아야메 선배가 그런 말을 했다면, 분명 그 나쁜 여자에게 속았을 게 분명해요!"
52050-287 = "맞아. 여기서 뭘 자책하고 있는 거야?"
52050-288 = "당장 대설원으로 가 아야메 부장을 구하고, 겸사겸사 나구사 선배의 진짜 팔인지 뭔지도 되찾아 오자고!"
52050-289 = "엑~설런투한 의견이셔요. 소녀는 찬성이랍니다!"
52050-291 = "하, 하지만……"
52050-292 = "여전히 대설원은 위험한 장소이고, 나 때문에 백화요란 모두가 자리를 비우고 멀리 떠날 수는……"
52050-297 = "실례합니다, 백화요란 여러분 계신가요?"
52050-305 = "아, 마침 모두 여기에 계셨군요."
52050-306 = "너는 음양부의…… 갑자기 무슨 일이지?"
52050-307 = "네. 다름이 아니라, 여러분께 부탁드리고 싶은 일이 있으시다고."
52050-312 = "음양부 부장께서 백화요란 여러분을 찾으십니다."
52050-313 = "니야 님이……?"
52050-315 = "다음화;축제 준비"
