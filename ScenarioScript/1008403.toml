[translation]
1008403-1 = "자연의 소리 1"
1008403-4 = "(돌아오는 주말, 다시 한번 근처의 산에 가볍게 등산을 갔다가……)"
1008403-7 = "(……또다시 코타마와 마주쳤다.)"
1008403-8 = "[s] \"코타마……\""
1008403-12 = "아."
1008403-13 = "그게 그러니까…… 오해입니다."
1008403-14 = "[s] \"……또 사람들의 목소리를 녹음하러 온 거야?\""
1008403-15 = "그렇지 않습니다! 오늘만큼은 그런 목적으로 산에 온 게 아닙니다……!"
1008403-16 = "[s] \"하지만 손에 또 녹음기가 들려 있는 걸……\""
1008403-17 = "이건 그러니까……"
1008403-18 = "사람들의 목소리가 아닌, 자연의 소리를 녹음하기 위해 가져온 것입니다."
1008403-19 = "[s] \"……자연의 소리?\""
1008403-20 = "네. 산에서는 새 울음소리나 물 흐르는 소리, 바람 소리처럼 심신을 안정시키는 데 도움이 되는 자연의 소리를 다양하게 들을 수 있으니까요."
1008403-21 = "제가 즐겨 듣는 ASMR 음원에도 이런 환경음이 제법 수록되어 있답니다."
1008403-22 = "하지만 이런 환경음들은 보통 직접 녹음하기가 어렵기 때문에, 웹 상에 공유되는 무료 에셋을 가져다 쓰는 경우가 많아서……"
1008403-23 = "새로운 자극을 얻기 위해 직접 환경음을 녹음하러 산을 찾아왔습니다."
1008403-24 = "[s1] \"그건 좋은 생각이네.\"\n[s2] \"코타마 답지 않게 건전한 발상인걸……\""
1008403-26 = "무, 무슨 말씀을 하시는지 잘 모르겠습니다만……"
1008403-27 = "[s] \"그래서 오늘은 어떤 소리를 녹음하러 온 거야?\""
1008403-28 = "요즈음 같은 겨울 산에서 들을 수 있는 소리라면, 겨울 산새 소리나 눈 밟는 소리도 나쁘지 않지만……"
1008403-29 = "역시 추운 겨울의 정취를 살리기 위해서라면 모닥불이 타오르는 소리를 빼놓을 수 없지요."
1008403-30 = "따듯한 담요를 두른 채 모닥불이 타오르는 소리를 듣고 있노라면, 벽난로 앞에 앉아 있는 느낌이 들어 잠도 솔솔 잘 오니까요."
1008403-31 = "오늘은 이곳에서 작은 모닥불을 피운 다음, 그 소리를 녹음하려 합니다."
1008403-32 = "[s] \"이곳에서 불을 피워도 괜찮은 거야?\""
1008403-33 = "네, 근처의 시설에 미리 문의하고 왔습니다. 야영장과 이어진 이 주변에서는 불을 피워도 괜찮다고 하는군요."
1008403-34 = "그리고 혹시 모를 사태를 대비해 소화 장비도 함께 챙겨 왔습니다."
1008403-35 = "[s] \"준비성이 철저하네.\""
1008403-36 = "……괜한 소란으로 음원에 잡음이 섞여 들어가는 건 원치 않으니까요."
1008403-40 = "그럼 마른 가지를 모아 본격적으로 불을 피워 볼까요?"
1008403-43 = "불이 붙기 쉬운 마른 잎과 가지를 모아 삼각뿔 모양으로 세운 다음……"
1008403-47 = "고정된 나무판 위에 가는 막대를 수직으로 세우고……"
1008403-48 = "양손으로 빠르게 비비면……"
1008403-53 = "[ns] \"잠깐, 잠깐.\""
1008403-57 = "무슨 문제인가요, 선생님."
1008403-58 = "녹음이 시작되고 난 뒤에는 대답할 수 없으니 문제가 있다면 빨리 말씀해 주십시오."
1008403-59 = "[s3] \"딱히 문제가 있는 건 아니지만……\"\n[s4] \"불을 피운다면 성냥이나 라이터를 쓰는 편이 낫지 않아?\""
1008403-62 = "물론 불을 피우기 위해서라면 그편이 가장 효율적이겠지만……"
1008403-63 = "작은 불씨가 점차 큰불로 번져가는 과정을 오롯이 녹음하기 위해서는 마찰식 점화법이 가장 제격이니까요."
1008403-64 = "게다가 ASMR의 마니아층 중에는 나무 같은 거친 소재가 긁히는 스크래칭 소리를 선호하는 사람도 많으니, 이 과정을 생략한다면 아쉬워할 사람들이 많을 겁니다."
1008403-65 = "[s] \"코타마가 그렇게 생각한다면 반대할 생각은 없지만……\""
1008403-69 = "그럼, 다시 한번 집중해서 불씨를 만들도록 하겠습니다."
1008403-71 = "(약 30분 뒤……)"
1008403-78 = "그읏…… 그으읏……"
1008403-82 = "어째서 불씨는커녕, 연기조차 나지 않는 건가요……"
1008403-83 = "슬슬 팔에 감각이 사라지기 시작해서……"
1008403-84 = "[s] \"코타마, 목소리가 새어 나오고 있어.\""
1008403-88 = "……앗."
1008403-89 = "실수군요. 이 부분의 음성은 나중에 잘라내고 편집해야……"
1008403-90 = "[s] \"이제 슬슬 포기하고 성냥으로 불을 붙이면 안 될까?\""
1008403-95 = "안 됩니다!"
1008403-96 = "그런 인위적인 방법으로 불을 붙인다면 자연 그대로의 소리를 녹음할 수 없게 되니까요!"
1008403-97 = "게다가 지금 여기서 포기한다면…… 여태까지의 노력이 물거품이 되어 버리고 말 겁니다."
1008403-98 = "조금만…… 조금만 더 힘을 주면……!"
1008403-100 = "(……하지만 코타마는 이후로도 한 시간이 넘도록 불을 피우지 못했다.)"
1008403-104 = "……."
1008403-105 = "………."
1008403-106 = "[s5] \"슬슬 공기가 차가워지고 있는데……\"\n[s6] \"불, 붙여줄까?\""
1008403-113 = "네, 부탁드립니다……"
1008403-119 = "……따듯하군요."
1008403-120 = "[s] \"따듯하네……\""
1008403-121 = "문명의 이기를 사용하면 이렇게 쉽게 얻을 수 있는 온기조차도 야생에서는 쉽게 만들어 낼 수 없다니……"
1008403-122 = "역시 현실의 자연은 혹독하군요……"
1008403-124 = "(이후, 코타마와 함께 자연의 혹독함을 곱씹으며 불을 쬐었다.)"
