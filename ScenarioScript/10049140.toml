[translation]
10049140-1 = "후일담;악의 간부, 탄생."
10049140-2 = "[log]3일 전[/log]"
10049140-4 = "여기에는, 이 아이."
10049140-5 = "이 아이는…… 여기."
10049140-6 = "응……! 복원한 책 정리 끝."
10049140-7 = "밤의 도서관은 아무도 없어서 역시 좋구나."
10049140-8 = "누가 오기 전에 다시 고서관으로 돌아가야지."
10049140-9 = "마법소녀…… 악의 간부……."
10049140-10 = "마법소녀는, 세계의 평화를 지킨다."
10049140-11 = "히"
10049140-12 = "…… 에에엑……."
10049140-16 = "악의 간부는, 악역……."
10049140-17 = "(히유, 깜짝이야…… 시미코였구나.)"
10049140-18 = "(이 시간까지 정리할 게 남아있었나? 기증 대상 아이들 수납은 진작 갔었을 텐데?)"
10049140-19 = "악역인 악의 간부는…… 마법소녀를 처단한다……."
10049140-20 = "?!"
10049140-21 = "(뭐, 뭐야…… 처단? 악의 간부?)"
10049140-22 = "(시미코가 왜 저러는거지? 어디 아픈가?)"
10049140-23 = "(이런 거는 피하는 게 상책이지만, 시미코가 이러는 건 아무래도 걱정이…….)"
10049140-24 = "(눈치 못 챈 것 같으니 지켜봐야겠다…….)"
10049140-28 = "(수레 한가득 만화책하고 소설을 담네?)"
10049140-29 = "(시미코는 어지간한 장서는 다 읽어보지만 왜 하필 지금……?)"
10049140-30 = "(대충 200권은 되어 보이는데?)"
10049140-34 = "…… 중얼……."
10049140-35 = "중얼…… 중얼중얼……."
10049140-36 = "(눈이 무서워……!)"
10049140-37 = "(한 권에 1분도 안 들이고 있잖아?!)"
10049140-38 = "(속독을 하는 건 대충 알았지만 이 정도일 줄은 몰랐는데,)"
10049140-39 = "(고른 아이들도 죄다 마법소녀 관련 책, 요새 빠져든 건가……?)"
10049140-41 = "……중얼…… '이 도시 째로 송두리째…… 날려버려 주마…….'"
10049140-42 = "……오케이."
10049140-46 = "(뭐가 오케이인데?!)"
10049140-47 = "(그리고, 마법소녀 만화만 있는 게 아니네?)"
10049140-48 = "(<현대 범죄 심리>, <대중 선동술>, <의류 제조 2급 실기>?)"
10049140-49 = "(대체 뭔 기준으로 아이들을 고른 거지?!)"
10049140-53 = "(결국 다 읽었네, 보는 것만으로도 정신이 없었어…….)"
10049140-54 = "(이번엔…… 시청각실?)"
10049140-55 = "(이번에는 마법소녀 애니메이션을 한가득 들고 왔네.)"
10049140-56 = "(책이라면 속독이 되겠지만, 저걸 언제 다 볼 생각인 거야……?)"
10049140-61 = "(아. 시작됐다.)"
10049140-62 = "(뭐어…… 알아서 하겠지.)"
10049140-63 = "(시미코가 이런 거에 갑자기 관심 가지는 날도 있구나.)"
10049140-64 = "(슬슬 고서관에 돌아가야…….)"
10049140-68 = "?"
10049140-69 = "(……배속?)"
10049140-74 = "히엑……."
10049140-75 = "(뭐, 뭐야……? 속도를 계속 올리는 거야?)"
10049140-82 = "(30배속?!)"
10049140-83 = "(대체 누가 애니메이션을 이렇게 보는데?!)"
10049140-84 = "(한 화가 고작 50초 만에 끝나버리잖아?)"
10049140-85 = "(뭐라고 하는지도 모르겠는데??)"
10049140-86 = "(우, 우욱. 화면이 엄청나게 깜빡거려서 머리가 아파…….)"
10049140-87 = "(일단은 돌아가고 내일 괜찮아 보일 때 물어보자…….)"
10049140-92 = "……."
10049140-93 = "……."
10049140-95 = "……."
10049140-96 = "결국…… 무서워서 한숨도 못 잤네……."
10049140-97 = "시미코가 걱정되는데, 지금쯤 돌아갔으려나."
10049140-98 = "아직 있나 확인이라도 해 봐야겠다."
10049140-100 = "……."
10049140-101 = "(아직도 있었다고?!)"
10049140-102 = "(8시간이나 봤다니, 그러니까…….)"
10049140-103 = "(밤새 580화나 봤다고?!)"
10049140-104 = "(어떡하지, 어떡하지…… 대체 무슨 바람이 불었길래 이러는 거야?)"
10049140-105 = "'훗, 이 정도겠군.'"
10049140-106 = "(무슨 말투야 저게?!)"
10049140-107 = "'이제, 암흑의 장막을 손에 얻어야겠구나.'"
10049140-108 = "(암…… 뭐?)"
10049140-112 = "(아, 안 되겠다. 이런 건 딱 질색이지마안……!)"
10049140-113 = "(시미코를 말려야 해, 대체 뭔 일인지는 나중에 묻더라도…….)"
10049140-114 = "(정 위험하면, 머리라도 쏴서 기절시켜야지……!)"
10049140-117 = "(이번엔 또 뭐지……?)"
10049140-118 = "(저건…… 장서 보호용 암막 커튼에, 바닥 보수용 검은 장판?)"
10049140-119 = "(도서관 수리용 자재잖아? 대체 뭘 하려고……?)"
10049140-120 = "(설마…… 밤 새서 보수 작업을 하고 있었던 거야……?)"
10049140-121 = "(하기사, 밤새 애니메이션만 봤을 리도 없고…….)"
10049140-122 = "(난 또, 괜히 놀라선…… 그럼 나도 쉬러…….)"
10049140-126 = "(……가위로 저걸 왜 잘라?)"
10049140-127 = "엥?"
10049140-128 = "(왜 멀쩡한 커튼하고 장판을 자르고 꿰매는 거야……?)"
10049140-132 = "???"
10049140-137 = "(저, 저건……!)"
10049140-140 = "(아니, 뭔데 저게?!)"
10049140-141 = "(시, 시미코가 이럴 리가 없어…….)"
10049140-142 = "(고, 고장 났을 때는 껐다가 켜야지,)"
10049140-143 = "(머리에 한방을…….)"
10049140-147 = "히엑,"
10049140-148 = "누구냐!!"
10049140-150 = "히에에에엑!!!"
10049140-156 = "……."
10049140-157 = "음, 좀 더 높은 톤이 어울리려나요."
10049140-158 = "악의 간부라면 역시 좀 더……!"
10049140-159 = "흠, 흐흠! 아, 아아!"
10049140-160 = "누구냐!!!"
