[translation]
22080-1 = "제8화;무너진 일상"
22080-20 = "…………"
22080-21 = "[s] \"모모이…….\""
22080-34 = "(모모이가 쓰러졌다.)"
22080-35 = "(아리스가 난데없이 폭주했던 그 날.)"
22080-36 = "(모모이는 그 소동에 휘말려 의식을 잃은 것이다.)"
22080-37 = "(다급한 상황 속에서 쓰러진 모모이를 서둘러 샬레의 의무실로 데려왔지만…….)"
22080-38 = "(그로부터 꼬박 이틀이 지날 때까지,)"
22080-39 = "(모모이는 아직도 의식을 잃은 채 자리에서 깨어나지 못했다.)"
22080-47 = "(아리스가 폭주하기 시작하면서 동시에 갑작스레 작동을 시작한 정체불명의 기계 로봇들……… 그렇게 순식간에 벌어진 아수라장………)"
22080-51 = "(다행히 뒤늦게 나타난 네루를 비롯한 C&C 멤버들 덕분에 사태는 진정시킬 수 있었지만…….)"
22080-55 = "[ns] (그때의 그건……. 아리스가 보여주었던 모습은 대체…….)"
22080-56 = "(상황을 수습했다고 해서 모든 것이 끝났다는 것은 아니다. 그러한 일이 벌어진 만큼이나 많은 것들이 의문으로 남았다.)"
22080-60 = "(하레는 말했다.)"
22080-61 = "(아리스가 보여준 행동은 명백히 그 기이한 로봇들과 <접촉>한 뒤에 벌어진 이상행동이었다고.)"
22080-66 = "(미도리 또한 이야기했다.)"
22080-67 = "(아리스의 분위기가 바뀌고, 로봇이 움직이는 바로 그때.)"
22080-73 = "(모모이가 일전에 가지고 있던 <게임기>가 갑자기 작동하기 시작했다고.)"
22080-74 = "[ns] \"모모이의 게임기라면…… 분명 폐허에서…….\""
22080-79 = "……"
22080-80 = "(삐빅-)"
22080-81 = "［Divi:Sion System에 오신 걸 환영합니다. 도움이 필요한 항목을 입력하세요.］"
22080-84 = "[56cd7b]<당신은 AL-1S 입니까?>"
22080-87 = "[ns] \"폐허…… 컴퓨터…… 그리고…… Divi:Sion System……\""
22080-88 = "(아리스가 폭주한 이유는 뭘까? 로봇의 정체는 무엇이고, 아리스는 왜 갑자기 그런 행동을 한 것일까.)"
22080-89 = "(또한 그때 아리스가 폭주했을 당시 작동했던 모모이의 게임기는?)"
22080-90 = "(폐허에서 발견했던 <Key>라는 폴더와 관계가 있는 걸까?)"
22080-91 = "[ns] \"바로 모모이의 게임기를 확인해보긴 했지만…….\""
22080-95 = "(이번엔 아예 전원조차 들어오지 않았다. 마치 원래부터 작동한 적이 없다는 듯이.)"
22080-96 = "(혹은 그 내용물 자체가 아예 텅 비어 버렸다는 듯이.)"
22080-100 = "(그렇게 아무런 답도 나오지 않는 생각이 꼬리에 꼬리를 물고 반복되고 있을 때였다.)"
