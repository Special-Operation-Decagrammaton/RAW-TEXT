22080-204 = "당신이 말로만 듣던 샬레의 선생?"
22080-205 = "……당신과의 기념비적인 첫 만남이 이렇게 된 건 지극히 유감이지만."
22080-206 = "소개할게. 내 이름은 츠카츠키 리오."
