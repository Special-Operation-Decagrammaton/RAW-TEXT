22080-170 = "아리스는 이곳, 기억에 없습니다. 하지만, 마치 '세이브 데이터'를 가지고 있는 것처럼."
22080-171 = "몸이 반응하고 있습니다."
22080-174 = "어떠한 튜토리얼이나 설명이 없음에도, 마치 익숙한 장르의 게임을 하는 것처럼."
22080-176 = "……아리스의 몸이, 반응했습니다. 움직였습니다."
22080-177 = "그때, 아리스가 무슨 짓을 했는지…… 어째서인지 아무것도 기억이 나질 않지만……."
