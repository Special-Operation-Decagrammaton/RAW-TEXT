[translation]
10018075-10 = "사장 나오라 그래! 아니, 회장인가? 아무튼 나와!"
10018075-11 = "나오지 않으면, 더 난동 부릴 거예요★"
10018075-12 = "와! 저거 맛있겠다! 먹어 봐도 돼? 되는 거지?"
10018075-19 = "……이거, 좀 나가 보셔야 할 것 같은데요."
10018075-20 = "특히 저들 중 한 명이, 식자재 창고를 통째로 털어 버릴 기세입니다."
10018075-21 = "무흐으으으으음! 손해가 이미 막심하군! 이 이상의 손해를 막기 위해서라도……!"
10018075-23 = "좋다! 경영자로서의 결단이다! 내 몸소 친히 나서 주겠다!"
10018075-27 = "이야기를 시작하기에 앞서, 성대한 환영, 감사합니다."
10018075-28 = "뭇후후후. 별말씀을."
10018075-29 = "그 성대한 환영의 이유를 물어도 될까요?"
10018075-30 = "이 몸은 냐오모토 푸드의 회장. 말하자면 총책임자다."
10018075-31 = "아무 예약이나 사전 양해도 없이, 다짜고짜 회담을 갖자고 하면."
10018075-32 = "그에 상응하는 경비 시스템이 먼저 작동하기 마련이겠지."
10018075-33 = "그렇다면 적절한 절차를 지켰다면, 만남이 성사될 수 있었을 것이라는 말씀인가요?"
10018075-34 = "뭇후후후. 그것은 또한 때에 따라서."
10018075-35 = "다만 시간이 조금 걸렸을 것이다. 한 달이나 두 달 정도 후에……"
10018075-36 = "그렇다면 환영 인사를 돌파한 것이 정답이었다는 말이군요."
10018075-37 = "말씀 감사합니다."
10018075-38 = "서론은 그만두고, 바로 본 이야기를 하죠."
10018075-39 = "환영하는 바다. 효율과 혁신. 경영의 기본이지."
10018075-40 = "그러면 품질과 맛을 속이고, 박리다매로 음식을 파는 비 미식적 행위를 그만두시죠?"
10018075-41 = "이해가 가지 않는군. 왜 그것이 문제가 되는 것인지?"
10018075-42 = "어머나. 당연하지 않은 문제를 당연하다고 여기고 계실 줄은."
10018075-43 = "너무 경영에만 치중한 나머지, 기본적인 판단력을 상실하신 것이 아닌지?"
10018075-44 = "대중들 대부분은 맛 같은 사소한 차이에 신경을 쓰지 않는다."
10018075-45 = "싼 가격으로 더 많이, 널리 먹을 수 있으면 그걸로 만족하지."
10018075-50 = "자네의 말을 따르자면, 일정 수준 이하의 식재료와 음식은 전부 폐기처분해야 한다는 건가?"
10018075-51 = "왜 그런 비효율적인 행위를 해야 하지?"
10018075-58 = "지극히 상식적인 대답을 돌려드리죠."
10018075-59 = "사람을 속이는 행위이기 때문입니다."
10018075-62 = "지나치게 깨끗한 물에서는 물고기도 살지 못하는 법이다."
10018075-63 = "최소한 물을 깨끗이 하려는 노력은 해야 하지 않을까요?"
10018075-64 = "그런 사소한 일에 꼬투리를 잡고 늘어지는 너희가 이상한 것이라고 생각한 적은 없나?"
10018075-65 = "전혀요. 오히려 이상한 것은 냐오푸드의 대응이 아닐까 합니다만?"
10018075-66 = "그 발언은 마음에 들지 않는군."
10018075-67 = "저 역시 예상 밖의 안일한 대답에, 실망감만을 느꼈다고 말씀드릴 수밖에 없겠군요."
10018075-74 = "……!"
10018075-75 = "……!"
10018075-76 = "그렇다면 좋다. 대결을 제안하지."
10018075-78 = "대결이라 하심은?"
10018075-80 = "간단한 것이다. 요리 대결이지."
10018075-81 = "요리의 품질에 대한 문제이니, 그 요리로 실력을 겨루자는 것이야."
10018075-82 = "누구도 이의를 제기할 수 없도록, 공정하게…… 말이지."
10018075-88 = "잠깐만. 이거 좀 수상한데? 함정이 있는 것 같지 않아?"
10018075-89 = "응? 무슨 이야기야?"
10018075-90 = "괜찮을까요, 하루나?"
10018075-92 = "설령 함정이 있다 해도 정면으로 파고드는 것이 우리 미식연구회."
10018075-96 = "그 제안, 받아들이도록 하죠."
10018075-97 = "마침 새해로군. 그렇지 않나?"
10018075-98 = "새해이지요. 이 시기에만 먹을 수 있는 음식들에도, 물론 흥미가 있습니다."
10018075-99 = "대결 종목은…… 바로 그 '오세치'로 하지."
10018075-100 = "오세치 말인가요?"
10018075-101 = "수작업으로 요리하기에는 손이 많이 가고, 맛내기도 의외로 까다롭죠."
10018075-102 = "그러하다. 서로의 요리 실력을 겨루기에는, 시기를 생각하더라도, 최적이 아닐까 하지만?"
10018075-103 = "방법은?"
10018075-104 = "동일한 품질과 양의 식재료로 오세치를 만들어, 상인회 회원들에게 시식시키는 것이다!"
10018075-105 = "그래서 어느 쪽이 더 맛있다는 평가를 많이 받을 수 있는지 겨루자는 거군요."
10018075-106 = "그 말 그대로다. 냐오푸드가 이기면 얌전히 참새정 건에서 손을 떼도록. 뭇후후후."
10018075-107 = "저희가 이긴다면, 더 이상 참새정에 손을 대지 않는 것으로 하죠."
10018075-108 = "그 조건, 수락하지."
10018075-109 = "저희도 납득하도록 하죠."
10018075-110 = "혹시나 하는 이야기입니다만, 회장씩이나 되시는 분이 말을 바꾸지는 않겠죠?"
10018075-111 = "뭇후후후. 냐오푸드의 매출을 걸고, 그럴 일은 없을 것이라고 장담하지."
10018075-116 = "제가 이런 말씀드리는 것도 뭣하지만, 좀 번거로워지지 않았습니까?"
10018075-117 = "멍청한 것! 이것도 다 홍보 기회다."
10018075-118 = "홍보…… 말입니까?"
10018075-119 = "그러하다. 나름대로 조사를 하여 알아보았지. 미식연구회의 악명은 학생들 사이에서는 유명하더군?"
10018075-120 = "(……그 정보를 이제서야 알았다는 게 오히려 신기할 지경이지만……)"
10018075-121 = "그렇게 까다롭고 악명 높은 미식연구회의 고집을, 우리 냐오푸드가 꺾었다는 사실이 상인회를 통해 알려진다면?"
10018075-123 = "키보토스의 학생들 사이에서 냐오푸드의 위상은 절대적인 것이 되겠지!"
10018075-124 = "잘 알아 두어라! 학생을 대상으로 한 장사는 절대로 망하지 않는다!"
10018075-125 = "뭐…… 그런 혜안이 있으시다면야……"
10018075-126 = "그보다 저희, 추가 근무 수당은 주시는 겁니까?"
10018075-127 = "우선 성과를 보여라! 그리고 대가를 요구해라!"
10018075-128 = "……그럴 줄 알았습죠."
