[translation]
33250-1 = "제25화;에필로그"
33250-2 = "크아아아아아-!! 감히 이 마코토 님을 속였겠다--!!"
33250-3 = "이로하! 어디 있냐! 이로하! 당장 그것을 준비해라! 이대로 당하고 있을 수……."
33250-4 = "뭘 준비하라는 건지 모르겠지만, 일단 좀 더 누워계셔야 할 것 같은데요."
33250-5 = "일단 그 아프로 머리부터 어떻게 하셔야겠는데요. 그리고 상황은 이미 예전에 다 끝났거든요."
33250-6 = "응? 내 머리가 어때서……."
33250-7 = "다, 당했다?! 어, 언제 이렇게……!!"
33250-8 = "그야, 불에 잔뜩 그을렸으니……. 하아."
33250-10 = "나기사 님…… 몸은 좀 어떠신가요?"
33250-11 = "……네. 헤일로가 부서질 만큼 아팠지만, 다행히 아직은 살아있네요."
33250-12 = "무사하셔서 다행입니다……. 무리하지 않으시는 게 좋을 것 같아서……."
33250-13 = "고마워요. 그런데 찾아온 이유는…… 무슨 급한 일이 있나요?"
33250-14 = "아, 다름이 아니라…… 미카 씨에게서 편지가 와서……."
33250-15 = "……. 뭐라고 적혀 있나요?"
33250-16 = "어…… 그러니까……."
33250-18 = "이야, 나기 쨩? 미사일 발사 후에 계속 정신을 잃고 있었다며?"
33250-19 = "엄청 많은 일들이 있었는데 속 편하게 쿨쿨 자고 있었다니. 응, 역시 호스트로써 조금 부끄러운 모습이 아닐까?"
33250-20 = "나기 쨩이 어깨에 힘을 좀 풀었으면 했지만, 설마 이 정도로 여유를 부릴 거라곤 생각하지 못했거든. 응, 잠자는 공주라도 되고 싶은 거야?"
33250-21 = "뭐, 모처럼 깨어났다고 하니까 내 부탁 좀 들어줄래? 빨리 호스트에 복귀해서 처리해줬으면 해."
33250-22 = "먼저, 여기 유폐실의 TV, 정규방송밖에 없잖아? 케이블 넣어줘. 응? 24시간 되는 걸로!"
33250-23 = "아, 그리고 핸드로션도 다 떨어졌지 뭐야. 내가 쓰는 브랜드가 있는데 꼭 그거 아니면 안되거든? 파는 곳도 한정되어 있으니까, 알려줄 테니 사와야 해?"
33250-24 = "아, 그리고 헤어드라이어 바람이 요즘 좀 약해져서 말야. 조금 더 비싼 걸로 바꿔주면 안 되려나?"
33250-25 = "기왕이면 나기 쨩이 쓰는 거랑 똑같은 걸로! 응! 그거 엄청 비싼 브랜드인 거 다 알고 있으니까!"
33250-26 = "아, 그리고 그리고……!"
33250-28 = "……."
33250-29 = "어, 어떻게 할까요? 역시 유폐실이 아니라……."
33250-30 = "……앞으로 미카 씨에겐 식사로 롤케이크만 제공하세요."
33250-31 = "네, 네?!"
33250-72 = "여러분."
33250-73 = "다, 단장님……?"
33250-74 = "단장님!!!"
33250-75 = "말없이 사라져서 미안했습니다."
33250-76 = "으아아앙-!! 단장니이이이이임~~!!"
33250-82 = "네. 제가 돌아왔어요. 기다리게 해서 죄송합니다."
33250-85 = "미카 씨……."
33250-86 = "나기 쨩……? 왜 아직도 풀 죽은 얼굴이야? 결국 모든 건 다 잘 마무리되었잖아."
33250-87 = "그건……."
33250-93 = "그건, 우리에게는 아직 해결하지 못한 숙제가 남겨져 있기 때문이겠죠."
33250-94 = "세, 세이아 씨……?"
33250-95 = "세, 세이아 쨩……?!! 어, 어떻게?!"
33250-97 = "……네. 오랜만이에요. 나기사. 미카."
33250-98 = "……이걸로 다시 한번 티파티의 모두가 모이게 되었네요."
33250-99 = "네. 우리는……."
33250-100 = "우리는 이제 서로 이야기하지 않으면 안 돼요."
33250-101 = "하지 못했던 말들과, 할 수 없었던 말들."
33250-102 = "그리고 하고 싶었던 말들을. 서로에게."
33250-103 = "오해와 불신을 헤쳐 나가며 타인이라는 증명 불가능한 문제를 향해 나아가는 것."
33250-104 = "저와 우리 모두는 그 숙제를 짊어진 채 이 어둠 속을 헤쳐나가지 않으면 안 되는 거겠죠."
33250-108 = "……."
33250-109 = "……여전히 어려운 말만 하고 있네. 세이아 쨩. 그러니까 친구가 없는 거잖아? 그거 조금은 자각하고 있어?"
33250-110 = "……."
33250-111 = "미카 씨는 여전히 그 텅 빈 머리에 교양과 품격을 더 집어넣어야 할지도 모르겠군요."
33250-112 = "……. 저기…… 여러분……."
33250-114 = "[ns] \"어…… 그러니까…….\""
33250-116 = "[ns] \"너희가 새로운 보충수업부인 거지……?\""
33250-117 = "……."
33250-118 = "……."
33250-119 = "……."
33250-120 = "……."
33250-121 = "[ns] \"아니, 어째서?!?\""
33250-123 = "아, 아우…… 그, 그게 그러니까……."
33250-124 = "페로로 님 콘서트 투어에 참가했다가…… 시, 시험을 깜빡해서……."
33250-125 = "다음 시험 범위는 배운 적이 없었어."
33250-126 = "어…… 그게…… 3학년 시험을 쳤다가……."
33250-127 = "어머나♡ 그러게요. 모두가 모였는데 저만 빠지면 안 될 것 같아서……."
33250-128 = "아, 아우우…… 죄, 죄송해요, 선생님……. 모처럼의 노력이 물거품이……."
33250-129 = "그, 그치만 이번에는 퇴학도 없고, 시험 범위도 정상인 거라……."
33250-130 = "[ns] 쓰러진다."
33250-132 = "서, 선생님?!"
33250-133 = "선생님!"
33250-134 = "뭐, 뭐야?! 그런 반응을 할 것까진 없잖아!!"
33250-135 = "어머나…… 이건……. 차려진 밥상…… 이라고 하던가요?"
33250-136 = "뭐야! 무슨 의미야?! 마치 좋은 기회네요! 같은 얼굴 하지 말라고! 야한 거 금지!!"
33250-137 = "사형----!!!"
33250-144 = "아즈사……."
33250-145 = "넌 배우는 걸 멈추지 않겠지. 앞으로도 계속. 언제나 친구들과 함께."
33250-146 = "앞으로도 쭈욱 배우겠지. 노력하겠지."
33250-147 = "넌 강하니까."
33250-148 = "모든 것이 헛되더라도, 이 세계가 어둡더라도."
33250-149 = "음습한 지하에서도…… 그래."
33250-150 = "……아즈사."
33250-151 = "네가 말했던 그 꽃의 이야기…… 이제 무슨 뜻인지 알 것 같아."
33250-152 = "이제 두 번 다시 만나지 말자."
33250-153 = "그리고 마침내 행복하기를."
33250-166 = "그렇습니까."
33250-167 = "도망쳤군요. 그 로열블러드가."
33250-168 = "놓칠 수 없죠. 가서 잡아 오십시오. 다치지 않게 잘 포장해서."
33250-169 = "아츠코를 제외한 나머지는 전부 죽여도 좋습니다."
33250-170 = "아아, 네. 이쪽 관용어대로, 헤일로를 파괴해도 좋습니다."
