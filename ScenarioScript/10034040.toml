[translation]
10034040-1 = "제4화;이전과는 다른 나"
10034040-2 = "(……며칠 후.)"
10034040-3 = "(평소보다 일감이 적어, 모처럼의 느긋한 업무시간을 즐기고 있었다.)"
10034040-9 = "아, 선생님? 갑자기 전화해서 미안. 지금 좀 바쁠까?"
10034040-10 = "아니, 뭐. 일 생긴 건 아니고. 그냥 보고? 같은 느낌으로 한 거야. 애들 대표로."
10034040-11 = "구해준 연습실 공간도 시설도 엄청 좋아서! 덕분에 잘 시작하게 됐다! 이 말 하려고."
10034040-12 = "이제부터 연습 시작하려고 하는데……. 그래도 그 전에 고맙다는 말은 해야 하잖아?"
10034040-13 = "……응? ……뭐라고?"
10034040-14 = "지금 이쪽으로 오겠다고? 왜, 왜 굳이……?"
10034040-15 = "[s1] \"갑자기 요시미가 보고 싶어져서.\"\n[s2] \"요시미의 연주, 보고 싶으니까.\""
10034040-18 = "……!? 아, 아잇 진짜! 또 무슨 소릴 하는 거야, 이 인간은!!"
10034040-19 = "됐어, 쓸데없는 소리 말고 본인 일이나 열심히 하셔!! 여긴 알아서 할 테니까!!"
10034040-20 = "나 끊는다. 알았지? 오면 안 돼. 절대로 오지 마!! 지금부터 연습할 거니까!!"
10034040-25 = "[ns3] \"어림도 없지. 바로 출발!\"\n[ns4] 곧바로 나갈 준비를 한다."
10034040-31 = "(샬레에서 나와, 대신 임대해준 근처 연습실을 찾아갔다.)"
10034040-32 = "(연습실은 지하인 데다 방음이 잘 돼 있었기에 소리가 크게 들리진 않았지만, 아주 작게 연습 중의 잡음이 들려왔다.)"
10034040-33 = "[ns5] \"한참 열심히 하고 있나 보네.\"\n[ns6] 연습실 아래로 내려간다."
10034040-41 = "빨리!! 더 빨리!!"
10034040-45 = "이, 이것은 나의 한계를 이미……. 이런 건 록하지 않……."
10034040-46 = "더 빨리!!!!"
10034040-47 = "으어어-!!"
10034040-52 = "더 빨리!!!!"
10034040-53 = "으오오오오오오-! 로오오옥!!!"
10034040-59 = "그래, 그 속도로!! 그대로!! 그대로!!"
10034040-60 = "흐어어……."
10034040-66 = "더 빨리!!!!"
10034040-67 = "로오오오오옥-!!!"
10034040-74 = "요, 요시미 쨩. 나츠 쨩도 힘내고 있으니까……."
10034040-75 = "아니, 저건 어쩔 수 없지. 애초에 지금 나츠가 지나치게 느리게 치는 거잖아."
10034040-76 = "자기가 드럼 치고 싶다고 먼저 떼써서 골랐으면 노래에는 맞춰야지."
10034040-77 = "아무리 '목표는 셈라니까 대충 테스트만 통과하면 그만'이라고는 해도 말이지."
10034040-78 = "으, 으응……. 그렇지……."
10034040-82 = "……맞아……. 다들 그랬었지……."
10034040-83 = "……? 아이리? 왜 그래?"
10034040-84 = "으, 으응!? 아니!? 아무것도……!?"
10034040-88 = "……음……?"
10034040-89 = "……어라? ……선생님?"
10034040-94 = "선생님……!? 설마 저희 연습 보러 오신 건가요!?"
10034040-95 = "[s7] \"벌써 꽤 그럴싸한 모양새를 갖췄잖아.\"\n[s8] \"옷도 장비도 멋지네. 진짜 밴드 같아.\""
10034040-98 = "아, 아하하……. 그런가요? 감사해요! 뭔가 괜히 기분이 좋아지는 걸요!"
10034040-99 = "그, 그……. 선생님……? 이건 혹시 해서 묻는 건데……."
10034040-100 = "어, 언제부터 있었던 거야……? 혹시 아까 내 노래……도 들었다거나……?"
10034040-101 = "……아. 그건 아니고? ……방금 왔다고? 하하. 일단은 뭔가 안심이네."
10034040-102 = "아니, 뭐. 그냥 좀……. 너무 많이 틀렸어서……."
10034040-103 = "엄청 잘 불렀어요! 목소리 너무 좋은 거 있죠!!"
10034040-104 = "……아이리……."
10034040-109 = "……응? 뭐야, 무슨 소리야."
10034040-110 = "……어라. 선생님……?"
10034040-111 = "……아."
10034040-116 = "뭐, 뭐야! 선생님이 여길 왜 온 건데!?"
10034040-117 = "뭐 볼 게 있다고 온 거야!? 우리 이제 막 시작해서 개판이라고, 아직! 보여줄 단계가 아니라고!!"
10034040-118 = "괜히 와서 부끄럽게 만들면 연습 못하니까 오지 말라고 했잖아!! 아까 대놓고 말했잖아!!!"
10034040-119 = "[s9] \"요시미는 선생님이 오는 게 부끄러워……?\"\n[s10] \"흑흑……. 난 널 그렇게 키우지 않았…….\""
10034040-122 = "이상한 소리 할 거면 오지 말라고~!!!!"
10034040-123 = "연습 중에는 얼씬도 하지 마!! 알았지!? 진짜 진지하게 하는 말이야! 우리가 됐다고 할 때까지 절대 안 돼!!"
10034040-124 = "도와주러 왔다고……? 아, 됐으니까 나가! 됐다고 진짜~!!"
10034040-125 = "나가! 아무튼 나가!!"
10034040-126 = "빨리 나가!!"
10034040-127 = "나가-!!!!"
10034040-135 = "(성난 요시미의 손에 등 떠밀려, 곧장 연습실 밖으로 쫓겨났다.)"
10034040-136 = "(어쨌든 연습실 상태도 장비도 큰 문제가 없음을 확인했기에, 가벼운 마음으로 돌아갔다.)"
10034040-138 = "(저녁이 되어 업무가 끝난 후. 다시 연습실 주변으로 돌아왔다.)"
10034040-142 = "[ns11] \"……? 이 시간에 연습 소리……?\"\n[ns12] 연습실 안으로 들어간다."
10034040-149 = "[ns13] \"아이리……?\"\n[ns14] \"계속 혼자 연습 중이었던 거야?\""
10034040-152 = "……? 어, 선생님……?"
10034040-156 = "여긴 어쩐 일이세요? 시간도 이렇게 늦었는데……."
10034040-157 = "……저요? 헤헤……. 저는 음……. 그냥……."
10034040-158 = "보시다시피 그냥 키보드 연습을 좀 하고 있었어요. 열심히 해야죠! 헤헤……."
10034040-159 = "[s15] \"입문서나 이론서도 엄청 많이 있네.\"\n[s16] \"굉장히 본격적이구나.\""
10034040-162 = "그, 그런 가요? 아하하……. 아무래도 처음이다 보니, 어떻게 해야 좋을지 몰라서요."
10034040-163 = "모처럼의 기회니까……. 이 기회를 잘 잡아 봐야죠! 네!!"
10034040-164 = "……네?"
10034040-165 = "……그렇게 연습이 재미있냐……고요?"
10034040-166 = "으, 으음? 그, 글쎄요? 갑자기 생각지도 못한 질문이……."
10034040-167 = "으음……. 생각해 본 적 없는 이야기네요. 재미라. 재미……. 재미……."
10034040-168 = "……아직 잘은 모르겠어요. 으음. 재미……있나?"
10034040-169 = "일단 입문서 보고 똑같이 따라 하는 걸 무작정 반복하고 있었거든요."
10034040-170 = "기세 좋게 시작한 것까진 괜찮았는데, 막상 진도는 제가 제일 느리더라고요. 아하하……."
10034040-171 = "다들 왁자지껄하게 하는데도 어쩌면 그렇게들 잘 하는지……."
10034040-172 = "아무튼 그래서……."
10034040-174 = "그건 좀 부족하지 않아?"
10034040-179 = "[ns] \"……아이리?\""
10034040-180 = "아, 아아! 네! 그, 그래서 우선은……. 재미보다는 기초가 먼저니까요! 지금은!"
10034040-181 = "이런 건 잘하기 위해 무엇보다 기초가 중요하다고 했으니까요! 타건 하는 방식이라던가! 그런 것들!!"
10034040-182 = "기본기부터 계속 연습해 놓으면, 따라잡는 것도 어떻게든 되겠죠! 하하!!"
10034040-183 = "재, 재미는……. 음……."
10034040-184 = "그건 나중에 잘하게 되면……. 어떻게든 되지 않을까요, 아무래도……?"
10034040-185 = "응! 잘하게 되면! 그땐 분명 재미도 있을지 모르니까요! 지금은 우선 연습!! 연습이죠!!"
10034040-186 = "…………."
10034040-187 = "으음. 잠시만요. 뭔가……. 이게 아닌가……."
10034040-188 = "뭔가 선생님께서 듣고 싶으셨던 대답과는 느낌이 다른 거 같은데……."
10034040-189 = "[s17] \"지금은 그 대답으로도 충분해.\"\n[s18] \"억지로 대답을 짜낼 필요는 없어.\""
10034040-192 = "……으음? 그, 그렇군요."
10034040-196 = "……그럼……."
10034040-197 = "그럼, 이왕 이런 자리니까, 사실 선생님께만 말씀드리고 싶은 이야기가 하나 있어요."
10034040-198 = "아니, 어쩌면 이미 선생님께서는 눈치채고 계셨을 거라고도 생각하지만요."
10034040-199 = "분명 친구들에겐 테스트와 셈라에 대한 이야기로 같이 하자고 하긴 했지만……."
10034040-200 = "사실 저에게는 셈라가 그렇게까지 중요하지는 않아요."
10034040-201 = "선생님. 저는……."
10034040-202 = "……'악기를 연주할 줄 아는' 제가 되려고 해요."
10034040-203 = "조금 더 구체적으로는……. 제가 '잘하는 것'을 만들고 있는 중이에요. 그게 목표에요."
10034040-204 = "친구들은 셈라를 먹을 정도로만 연습하면 그만이라 했지만……. 저는 아니에요."
10034040-205 = "아시다시피 저는 우유부단하고 강단도 없고, 잘 나설 줄도 모르고……. 그런 애잖아요?"
10034040-206 = "하지만 이런 저라도, 역시 장점 하나 정도는 가지고 있어야 하지 않겠어요?"
10034040-207 = "솔직히 악기 연주 자체가 즐거운지 어떤지는 잘 몰라요. 하지만 지금 이대로의 저로는 안 된다는 건 알고 있어요."
10034040-208 = "[s19] \"……지금 이대로는 안 된다?\"\n[s20] \"과연. 그런 이야기였구나.\""
10034040-211 = "왜 그런 말들도 있잖아요? 음악을 통해 나 자신을 바꾼다! 아무것도 없었던 나에게 새로운 개성과 매력을 주는 거야!"
10034040-212 = "이번 테스트는……. 저에게 그런 의미에요. 친구들과 함께 하자고 했던 건, 혼자 하기가 무서워서 그랬던 것뿐."
10034040-216 = "어떻게 보면 나쁜 아이일지도 모르겠네요. 저……. 자신을 위해, 친구들을 이용했으니까."
10034040-217 = "아니, 나쁘달까……. '이기적인' 아이려나요……."
10034040-218 = "……네?"
10034040-219 = "그렇지는 않다고요? 이용한 게 아니라고요……? 그렇지만……."
10034040-220 = "[s21] \"이용했다는 건 그런 뜻이 아니야.\"\n[s22] \"다들 좋아서 하는 거니까.\""
10034040-223 = "그, 그런가요……? 으음. 선생님께서 그렇게 말씀해 주시니 어딘가 마음이 좀 편해지긴 하는데……."
10034040-224 = "아무튼 그런 거니까요. 저는 바뀌고 싶고, 이 키보드가 절 바꿔줄 거라고 생각해요."
10034040-225 = "키보드를 잘 치게 되면……. 저도 꽤 괜찮은 아이가 될 거라고, 말이에요."
10034040-226 = "선생님. 이왕 여기까지 와서 이런 말도 들어주셨으니 드리는 말씀이지만……."
10034040-227 = "……아. 다른 사람에겐 못했지만, 선생님에게만 드린 말씀이에요. 비밀로 지켜주세요."
10034040-228 = "아무튼……. 지켜봐 주세요. 저, 열심히 할 게요."
10034040-229 = "꼭 잘하게 돼서……."
10034040-230 = "……이전의 저와는 다른, 멋진 아이가 돼 보일 게요!!"
10034040-231 = "…………?"
10034040-232 = "선생님……?"
10034040-233 = "……왜 그러세요? 뭔가 하실 말씀이라도……."
10034040-237 = "[ns23] \"오늘은 괜찮아. 다음에 이야기해 줄게.\"\n[ns24] \"응원할게. 그래도 너무 무리하진 말고.\""
10034040-240 = "……음?"
10034040-241 = "……아. 체력 관리 쪽의 말씀이시죠? 헤헤. 걱정 마세요! 저도 그 정도는 아니까요!"
10034040-242 = "저 진짜 열심히 할게요! 선생님!!"
10034040-243 = "……진짜로요!!"
10034040-245 = "(……며칠 후.)"
10034040-251 = "선생님……? 선생님 지금 자리에 있어……?"
10034040-252 = "[s25] \"오~ 먼저 연락을 다 하네? 자신감이 붙었어?\"\n[s26] \"어라. 연습 기간엔 오지 말라는 거 아니었어?\""
10034040-255 = "장난치지 말고! 지금 그럴 때가 아니란 말이야!!"
10034040-256 = "이상하게 듣지 말고 잘 들어, 선생님."
10034040-257 = "혹시……. 혹시 말이야."
10034040-258 = "……아이리 그리로 간 적 있어? 최근에?"
10034040-263 = "[ns27] \"……아이리는 왜?\"\n[ns28] \"……무슨 일 있어?\""
10034040-266 = "그……. 그게 말이지……. 음……."
10034040-267 = "……아이리가……."
10034040-269 = "……그저께부터 연락이 안 돼."
