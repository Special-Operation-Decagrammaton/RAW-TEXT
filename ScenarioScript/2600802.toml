[translation]
2600802-1 = "보셨죠? 저, 성공했어요!"
2600802-2 = "(시즈코와 한 약속을 지키려 바다의 집으로 나왔다.)"
2600802-3 = "아, 선생님!"
2600802-4 = "아이참, 시즈코, 선생님을 얼마나 기다렸다구요~!"
2600802-5 = "[s] \"시즈코는 늘 활기가 넘치는구나.\""
2600802-6 = "당연하죠!"
2600802-7 = "백야당 오너이자 아이돌로서, 매사에 밝은 모습은 필수라구요."
2600802-8 = "[s] \"그런데 오늘 부른 이유가 뭐야?\""
2600802-9 = "와, 정말. 무드도 분위기도 없네요."
2600802-10 = "모처럼의 바다잖아요? 여름이기도 하고요?"
2600802-11 = "바다의 집이 이제 막 물살을 탔단 말이에요!"
2600802-12 = "조금은 기세를 맞춰 주셔도 좋잖아요!"
2600802-13 = "[s1] \"잘 모르겠지만 그렇구나!\"\n[s2] \"하나도 모르겠지만 그런 걸로 하자!\""
2600802-16 = "우…… 됐어요."
2600802-17 = "일단 마저 얘기할게요."
2600802-18 = "이어지는 제 이야기를 들으시면,"
2600802-19 = "선생님도 저에게서 눈을 뗄 수 없게 될 걸요?!"
2600802-24 = "보세요. 이게 백야당 프랜차이즈점,"
2600802-25 = "바다의 집이에요!"
2600802-27 = "무엇을 숨기랴!"
2600802-28 = "이 바다의 각 리조트와,"
2600802-29 = "업무 제휴를 통해 프랜차이즈화를 거의 실현했고!"
2600802-31 = "해당 리조트들의 서비스와 상품을!"
2600802-32 = "이곳, 바다의 집에서도 똑같이 판매하며!"
2600802-33 = "각 지점을 본점처럼 직영 관리하면서도!"
2600802-35 = "지점별 특징에 따른 특화 상품과,"
2600802-36 = "어디서든 찾아볼 수 있는 공통 상품의 조화를 이뤄!"
2600802-37 = "지금까지 경험해 본 적 없었던 수익 창출을 이뤄냈다고요!"
2600802-39 = "백야당의 매출은, 여기에서부터는 영업 비밀이지만,"
2600802-40 = "이전과 비교할 수도 없을 만큼 수직상승!"
2600802-41 = "이를 발판으로 하여, 이 바다와 군도뿐만 아니라,"
2600802-42 = "전 키보토스에 백야당의 이름을 널리 알리는 거죠!"
2600802-43 = "글로벌 세일즈 마케팅이라고 할까요!"
2600802-44 = "[s3] \"음…… 신나서 혼자 설명하고 있는 기분이 들기도 하지만.\"\n[s4] \"시즈코는 역시 대단하구나.\""
2600802-47 = "웃, 뭐, 뭔가요. 그 솔직 담백한 감상 및 대답은."
2600802-48 = "선생님은 꼭 마음을 놓고 있을 때 기습해 오신단 말이죠……!"
2600802-49 = "네? 사실 이미 몇 군데 지점을 방문해 보셨다고요?"
2600802-50 = "그래서, 어떠셨나요?"
2600802-51 = "새롭게 태어난 여름 백야당의 서비스는!"
2600802-52 = "[s] \"좋았지만, 이전에 있었던 백야당의 서비스가 없어진 건 아까울지도.\""
2600802-53 = "옛?! 평소 백야당의 서비스라 하심은……?"
2600802-54 = "아, 덜렁이 서비스라든가 공연 연계 이벤트라든가……?"
2600802-55 = "그, 그런 건! 아무래도 그렇게 효율적이지 않다고 해야 하나……"
2600802-56 = "우선순위가 뒤로 밀렸다고 해야 할까,"
2600802-57 = "미처 고려를 하지 못했다고 해야 할까."
2600802-58 = "그런 세세한 부분까지 신경쓰기에는……"
2600802-59 = "현실적으로 공수가…… 자원이……"
2600802-60 = "그래서 어쩔 수 없었던, 아픈 결정이었다고나 할까요. 에헷."
2600802-61 = "[s] \"시즈코, 요즘 제대로 쉬고 있어?\""
2600802-62 = "그, 그 말씀은……?!"
2600802-63 = "저, 뭔가 지금, 이상한 부분이라도 있나요?"
2600802-64 = "[s5] \"지금까지는 손님을 즐겁게 하는 시즈코가, 즐거워 보이고 귀여웠으니까.\"\n[s6] \"하지만 어쩔 수 없겠네. 프랜차이즈의 규모가 이렇게나 늘어났다면.\""
2600802-67 = "네, 네에……?"
2600802-68 = " 어…… 이건…… 그러니까……"
2600802-69 = "(시즈코의 얼굴이 전에 본 적 없이 붉어졌다.)"
2600802-70 = "자, 잠깐 볼일이 생각났거든요!"
2600802-71 = "저희 사업부에서 인텔리하고 고저스하고 스마트한 회의가 기다리고 있어서!"
2600802-72 = "그, 그럼 내일 뵈어요!"
2600802-77 = "(시즈코가 어딘가로 달려가 버렸다.)"
2600802-78 = "(시즈코의 태도가 매우 신경 쓰였지만, 일단은 숙소로 돌아왔다……)"
