[translation]
10003055-2 = "후후후. 역시 선생님이 계신 이상. 무리였나요."
10003055-5 = "그럼 여러분! 작전상 후퇴입니다!"
10003055-7 = "치나츠, 쫓을까?!"
10003055-8 = "아뇨……. 여기서 일이 커졌다간 괜히 부장님이 눈치를 챌 수도 있으니까요."
10003055-9 = "[s1] \"그래도 큰 소동으로 이어지지 않아서 다행이야…….\"\n[s2] \"……미식연구회의 옥수수, 맛있을까?\""
10003055-10 = "미식연구회 녀석들을 반성실에 처박지 못하는 건 아쉽지만, 으으음. 어쩔 수 없네."
10003055-11 = "……선생님도 참. 하아……."
10003055-12 = "제가 돌아왔습니다. 여러분! 응……?"
10003055-13 = "다들, 왜 그렇게 지친 표정인가요?"
10003055-15 = "과연, 미식연구회까지……. 그런 일이 있었단 말이죠……. 옥수수? 영문을 모르겠지만, 어쨌든."
10003055-16 = "……이제 남은 일정은 부장님이 참가하시는 구보 훈련뿐입니다."
10003055-17 = "모두들, 조금만 더 힘내도록 하죠! 부장님의 안온한 휴가를 위해서!"
10003055-18 = "그래그래……. 알았다구."
10003055-19 = "네, 그럼 돌아가도록 하죠."
10003055-23 = "(이후 히나와 해변가 산책을 위한 구보 훈련이 시작되었지만, 당연하게도 하루 종일 뛰어다니느라 지친 덕분에 제대로 훈련이 이루어지진 못했다.)"
10003055-24 = "(그렇게 하루가 저물었다.)"
