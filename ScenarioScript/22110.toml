[translation]
22110-1 = "제11화;그딴 건 아무래도 좋아!"
22110-2 = "……그래, 결국 회장이 아리스를 데려갔다고."
22110-3 = "저기…… 이거 진짜 위험한 상황 아냐……?"
22110-4 = "네, 확실히 비상사태입니다."
22110-6 = "리오 회장이, 부장님만 호출했던 것도 그럼……."
22110-7 = "처음부터 부장이 그리 나오리라고 전부 예상했던 것이겠지."
22110-8 = "너무해! 아리스 쨩을 멋대로 데려가고, 리더도 괴롭히고!"
22110-10 = "…………하."
22110-11 = "……부장님?"
22110-12 = "[s] \"네루……? 왜 그래, 혹시 아직 어딘가 아프기라도…….\""
22110-13 = "눈앞에서 그 꼬맹이를 데려가는데, 그저 지켜보는 것밖에 못했어."
22110-15 = "그거라면……."
22110-16 = "부장, 신경 쓸 거 없다. 어차피 정정당당하게 정면에서 싸운 것도 아니고, 회장의 지시로 인한 기습이었으니까."
22110-17 = "맞아! 그런 건 무효라고! 무효!"
22110-19 = "니들은 임무 도중에 기습으로 실패하게 되더라도 그렇게 변명할 생각이냐?"
22110-23 = "그건……."
22110-25 = "명색이 C&C의 부장인 나를 가볍게 제압하고 아리스를 데려간 그 녀석."
22110-26 = "녀석은 자신을 콜사인 제로포라고 소개했어."
22110-27 = "이름이 토키라고 했던가? 아카네, 아는 놈이야?"
22110-28 = "아는가, 모르는가-를 묻는다면……."
22110-29 = "존재 자체라면 알고 있었어요."
22110-30 = "콜사인 제로포. 저희와 같은 C&C 소속이면서 리오 회장의 전속으로 배치된 멤버."
22110-31 = "즉 리오 회장의 보디가드라고 해둘까요?"
22110-32 = "하지만 실물을 본 것도, 이름을 들은 것도 이번이 처음………"
22110-33 = "설마…… 그런 아이까지 대동해서 회장이 이렇게나 직접적으로 손을 써올 줄은 몰랐지만……."
22110-34 = "게다가 기습이라고는 해도 부장님을 제압할 정도의 실력이라니……."
22110-35 = "……그 녀석, 영 이상한 물건을 쓰고 있었어."
22110-36 = "[s] \"확실히…… 리오가 준 <무장>이라고 했던가?\""
22110-37 = "이봐, 선생."
22110-38 = "그 꼬맹이 녀석은…… 왜 얌전히 리오를 따라간 거야?"
22110-39 = "……헤일로를 부순다는 그 말 같지도 않은 소리까지 들어 놓고?"
22110-40 = "그 꼬맹이는 정말로 그 말을 이해하고 납득해서 따라간 거야?"
22110-41 = "게임이나 조금 할 줄 아는 그 꼬맹이를 두고 리오는 왜 그딴 소리를 지껄인 건데?"
22110-42 = "나만 이해가 안 되는 거야? 대체 이게 무슨 꼬라지인 거야?"
22110-43 = "네루 선배……."
22110-44 = "[s] \"일단…… 상황을 정리해보자.\""
22110-46 = "(모모이가 정신을 잃고 자리에서 일어나지 못하는 사이, 아리스가 리오에게 납치되었다.)"
22110-47 = "(리오는 자신의 목적을 아리스의 헤일로를 파괴하는 것이라고 밝혔다.)"
22110-49 = "요컨대 아리스, 너라는 존재는──"
22110-50 = "처음부터 이 세계를 멸망시키기 위해 태어난 <마왕>이란 거야."
22110-52 = "아…… 알아듣기 어려웠으려나? 간단히 말하자면, 그래."
22110-53 = "네 헤일로를 파괴하면 된다는 소리야."
22110-55 = "선생님, 아리스 쨩은…… 회장의 말대로, 정말로……."
22110-56 = "……마왕, 인 건가요?"
22110-57 = "[s] \"미도리, 그건…….\""
22110-61 = "난………"
22110-62 = "나는……"
22110-63 = "잘…… 모르겠어……"
22110-64 = "아리스 쨩의 말을…… 좀 더 듣고, 서로 이야기를 나누고 싶어……."
22110-65 = "아리스 쨩은, 그런 게 아니라고……. 마왕 같은 게 아니라고……… 회장을 설득하고 싶어……."
22110-66 = "나는……."
22110-67 = "우리들은………"
22110-72 = "선생님, 이제 우린 어떻게 해야 해?"
22110-76 = "[ns] \"………….\""
22110-78 = "모모이……………"
22110-81 = "강림!"
22110-82 = "언니?!"
22110-83 = "[s] \"모모이……! 몸은 괜찮아?! 상처는?!\""
22110-84 = "상처라면 괜찮아! 다 나았으니까! 잠도 실컷 잤고! 체력도 회복 완료!"
22110-85 = "지금의 난 방금 막 우물에서 포션을 채우고 레벨업에서 필요한 경험치를 다 털어낸 끝에 다음 스테이지 공략을 시작한 전사……!"
22110-86 = "무서울 것 따윈 전혀 없는, 초강화형 여고생 상태!"
22110-87 = "언니……"
22110-88 = "언니…… 아리스 쨩이…… 아리스 쨩이!"
22110-94 = "우와앗?! 뭐야뭐야?!"
22110-95 = "미도리가 어째서인지 악플 세례를 받고 난 다음 날 보여주는 일일 한정 응석쟁이 모드가 되었는데?!"
22110-99 = "……모모이, 아리스 쨩이……"
22110-102 = "이 바보들아!!"
22110-104 = "어, 언니?"
22110-105 = "모모이……?"
22110-107 = "으으음~~ 솔직히 어려운 건 잘 모르겠어……."
22110-108 = "이야기를 듣고 나니 가슴이 이렇게 꾸욱…… 한 게 콕 집어서 말로 표현하기는 어렵지만……."
22110-109 = "그래도 확실한 건 딱 하나 있어!"
22110-110 = "……확실한 거?"
22110-111 = "우리가 아직 이걸 납득하지 못했다는 거야!!"
22110-112 = "아리스가 마왕이건 뭐건, 그딴 건 아무래도 좋아!"
22110-113 = "난 그냥 아리스를 이대로 떠나보내기 싫어!"
22110-114 = "아리스가 남기고 간 그런 말은…… 작별 인사도 뭣도 아니잖아!"
22110-115 = "제대로 된 엔딩도 아니야! 최악이라고!"
22110-116 = "그러니 아리스를 되찾고 싶어! 되찾으러 갈 거야! 모두들, 안 그래?!"
22110-117 = "언니……."
22110-118 = "모모이……."
22110-122 = "……응. 그렇지."
22110-128 = "어이, 꼬맹이."
22110-129 = "왓?! 뭐, 뭐야……? 네루 선배?"
22110-130 = "너 말이야."
22110-132 = "제법 멋진 말을 할 줄 알잖아!"
22110-133 = "으, 응……?"
22110-134 = "네 말이 맞아. 복잡하게 생각할 거 없이. 얻어맞았으면 갚아주면 돼."
22110-135 = "빼앗긴 게 있다면 가서 되찾아오면 그만이야."
22110-136 = "너희들은 어때. 아카네, 아스나, 카린."
22110-138 = "후후…… 말할 필요가 있나요?"
22110-139 = "그것이 부장의 결정이라면."
22110-140 = "응!"
22110-142 = "그러니 선생님!"
22110-143 = "우리에게 힘을 빌려줘!"
22110-147 = "[ns] \"모모이……. 다들…….\""
22110-149 = "[ns] \"알았어. 함께 아리스를 데려올 방법을 생각해보자.\""
22110-151 = "다음화;작전회의"
