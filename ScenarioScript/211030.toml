[translation]
211030-1 = "ตอนที่ 3;ทำให้เกเฮนน่ายิ่งใหญ่!"
211030-5 = ""
211030-6 = "อึก อุตส่าห์กำลังจัดการจราจรอยู่แท้ๆ...!"
211030-7 = "ใครมันมายิงปืนไร้แรงสะท้อนถอยหลัง AT4 ใส่ตรงนี้กันเนี่ย?!"
211030-10 = ""
211030-11 = "อ๊ะ โทษที! ฉันว่าจะซ้อมร็อกเก็ตจัมพ์ แต่ดันลอยไปทางนั้นเสียได้!"
211030-12 = "อึก ทำไมต้องมาซ้อมอะไรแบบนั้นในโรงเรียนด้วยล่ะ!"
211030-13 = "หืม? ก็ถ้าไม่ทำในโรงเรียน แล้วจะให้ไปทำที่ไหนกันล่ะ?"
211030-14 = "ก็ต้องไปทำในที่ที่ไม่มีคนสิ! ดูนี่! ลานจอดรถเป็นรูเลยนะ! เสาไฟก็พังด้วย!"
211030-15 = "วะฮะฮ่า! นั่นสินะ!"
211030-16 = "ก็เพราะเป็นกันแบบนี้ เกเฮนน่าถึงได้ถูกคนอื่นหาว่าวุ่นวายและโกลาหลอยู่ตลอดไงล่ะ"
211030-17 = ""
211030-19 = ""
211030-20 = "แล้วจะให้ทำไงได้ล่ะ? เกเฮนน่าก็เป็นแบบนี้อยู่แล้ว"
211030-21 = "อึก...!"
211030-22 = "เอาเป็นว่า พยายามเข้านะ~ ส่วนฉันขอตัวก่อนที่คณะกรรมการวินัยจะมาก็แล้วกัน!"
211030-23 = ""
211030-25 = ""
211030-26 = ""
211030-29 = ""
211030-30 = "เฮ้อ ฉันไม่อยู่แค่เดี๋ยวเดียว เกิดเรื่องอะไรขึ้นอีกล่ะเนี่ย?"
211030-31 = "หัวหน้า เป็นอะไรหรือเปล่าคะ?"
211030-32 = "มีคนยิงปืนไร้แรงสะท้อนถอยหลังแล้วหนีไปน่ะ เฮ้อ..."
211030-33 = "ยังดีที่ดูเหมือนยิงไปแค่นัดเดียวนะคะ"
211030-34 = "อย่าเพิ่งหมดกำลังใจนะ หัวหน้า! ยะฮ่า"
211030-35 = "ถึงเราจะประกาศอย่างฮึกเหิมว่าจะเริ่มจากการจัดระเบียบการจราจรกับงานอาสาในโรงเรียน แต่ก็นะ เราเพิ่งทำเป็นครั้งแรก จะยากก็ไม่แปลกหรอก"
211030-36 = "อื้อ..."
211030-37 = "ล้มเหลวก็ไม่เป็นไรหรอก เรื่องแบบนั้นเกิดขึ้นได้อยู่แล้ว"
211030-38 = "แต่สิ่งที่เกิดขึ้นหลังจากนั้นต่างหากที่เป็นปัญหา"
211030-39 = ""
211030-41 = ""
211030-42 = "รู้มั้ยว่าคำที่ฉันเกลียดที่สุดคืออะไร?"
211030-43 = "คำว่า 'เกเฮนน่าก็เป็นแบบนี้อยู่แล้ว' ไงล่ะ!!"
211030-44 = "ที่บอกว่าก็เป็นแบบนี้อยู่แล้ว หมายความว่ายังไง? แล้วมันต่างอะไรกับการบอกว่าจากนี้จะไม่ทำอะไร#nเลยล่ะ?"
211030-45 = "อีกอย่าง เกเฮนน่าเมื่อก่อนไม่ได้เป็นแบบนี้สักหน่อย! ทำไมถึงกลายเป็นแบบนี้ไปได้!!"
211030-46 = "นั่นก็จริง เกเฮนน่าแต่ก่อนไม่ได้เป็นแบบนี้หรอก"
211030-47 = ""
211030-49 = ""
211030-50 = "ใครน่ะ...?"
211030-51 = ""
211030-53 = ""
211030-55 = ""
211030-56 = "พวกเธอใช่มั้ย? ชมรมที่ชื่อคณะกรรมการฟื้นฟูเกเฮนน่าน่ะ"
211030-57 = "อ่า... ใช่แล้ว"
211030-58 = "รุ่นพี่เป็นใครเหรอ?"
211030-59 = "ฉันเหรอ? ก็แค่สมาชิกแพนเดโมเนียม โซไซตี้ที่เดินผ่านมาน่ะ"
211030-60 = "ฉันแค่แวะพูดอะไรนิดหน่อยตอนเดินผ่านก็เท่านั้น ไม่ได้คิดจะร่วมวงสนทนาด้วยอยู่แล้ว งั้นขอตัวนะ..."
211030-61 = "ดะ... เดี๋ยวก่อน! รุ่นพี่!"
211030-62 = "เมื่อกี้ที่บอกว่าเกเฮนน่าแต่ก่อนไม่ได้เป็นแบบนี้ แปลว่ารุ่นพี่รู้เรื่อง 'สมัยก่อน' เหรอ?"
211030-63 = "สมัยที่ทุกอย่างดำเนินไปอย่างมีระเบียบ และทั้งโรงเรียนอยู่ภายใต้การควบคุมอย่างเรียบร้อยน่ะ"
211030-64 = "อื้อ รู้สิ รู้ดีเลยละ"
211030-65 = "ปะ... เป็นยังไงเหรอ? เกเฮนน่าตอนนั้นต้องเป็นสถานที่ที่ยอดเยี่ยมกว่าตอนนี้มากแน่ๆ ใช่มั้ย?"
211030-66 = "คงไม่ได้วุ่นวาย ไร้ระเบียบ แล้วมีระเบิดตูมตามไปทั่วแบบตอนนี้หรอกเนอะ?"
211030-67 = "..."
211030-68 = "จะว่าไปแล้ว พวกเธอคงไม่รู้จักเกเฮนน่าสมัยก่อนสินะ"
211030-69 = "ใช่! ไม่มีใครยอมเล่าเรื่องตอนนั้นให้ฟังเลย!"
211030-70 = ""
211030-72 = ""
211030-73 = "อืม... ฉันพอเดาเหตุผลได้อยู่นะ"
