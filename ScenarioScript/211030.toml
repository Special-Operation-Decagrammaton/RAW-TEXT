211030-91 = "..."
211030-92 = "ส่วนรายละเอียด ฉันเองก็ไม่ได้อยากเล่า แถมยังเล่าไม่ได้ด้วย "
211030-93 = "ฉันรู้ว่าพวกเธอกำลังทำอะไรบางอย่างเพื่อเกเฮนน่า และสิ่งที่ทำก็คงมีความหมายของมันอยู่เหมือนกัน"
211030-94 = "แต่ฉันไม่อยากให้พวกเธอมองอดีตว่าสวยงามเกินจริงนัก"
211030-95 = ""
211030-97 = ""
211030-98 = "เอาเถอะ ยังไงฉันก็จะคอยเอาใจช่วยนะ เห็นพวกเธอพยายามกันเต็มที่แบบนี้แล้วก็น่าชื่นใจดี"
