211030-105 = "แน่นอนอยู่แล้ว! รุ่นพี่คนนั้นไม่รู้อะไรเอาเสียเลย!"
211030-106 = "เกเฮนน่าในอดีตต้องเป็นสถานที่ที่มีระเบียบและยอดเยี่ยมกว่าตอนนี้มากแน่ๆ! จริงมั้ย โชโกะ?"
211030-107 = "ค่ะ แน่นอนค่ะ..."
211030-108 = "ใช่! อย่าเสียกำลังใจ! สิ่งที่พวกเราทำต้องมีคุณค่าแน่นอน!!"
211030-109 = "นี่แหละหัวหน้าของเรา! ยะฮ่า!"
211030-110 = "หึ! ฉันจะทำให้รุ่นพี่คนนั้นต้องมองพวกเราใหม่ให้ได้"
211030-111 = "พวกเราจะพยายามให้มากกว่านี้ แล้วทำให้เกเฮนน่ายิ่งใหญ่อีกครั้ง!"
211030-112 = "อื้มๆ มาทำให้เกเฮนน่าเป็นแบบนั้นกันให้ได้เถอะ"
