[translation]
211030-1 = "제3화;게헨나를 위대하게!"
211030-6 = "윽, 기껏 교통정리 중이었는데……!"
211030-7 = "여기에 AT4 무반동총을 쏜 건 누구야?!"
211030-11 = "아, 미안! 로켓 점프 연습하려다가 그만 거기로 날아갔네!"
211030-12 = "으으, 왜 교내에서 그런 걸 연습하냔 말이야!"
211030-13 = "응? 교내에서 안 하면 어디서 해?"
211030-14 = "어디 인적 없는 곳에서 해야지! 이거 봐! 주차장에 구멍이 났잖아! 가로등도 부서지고!"
211030-15 = "와하하! 그러게 말이야!"
211030-16 = "이러니까 게헨나는 맨날 어지럽고 혼란스럽다는 소리나 듣는 거잖아!"
211030-20 = "뭐 어쩌겠어? 게헨나는 원래 그런데."
211030-21 = "큭……!"
211030-22 = "아무튼 수고~ 난 선도부가 오기 전에 이만!"
211030-30 = "아, 자리 비운 사이에 또 무슨 일이람."
211030-31 = "회장, 괜찮습니까."
211030-32 = "누가 무반동총을 쏘고 튀었거든. 하아……."
211030-33 = "그나마 한 발만 쏜 것 같아 다행이군요."
211030-34 = "기운 내, 회장! 야핫."
211030-35 = "야심차게 교통 정리나 교내 봉사부터 시작하겠다고 했지만, 뭐 처음이니까. 어려운 건 당연하지."
211030-36 = "응……."
211030-37 = "……실패한 건 괜찮아. 당연히 그럴 수 있지."
211030-38 = "하지만, 그 뒤가 문제였어."
211030-42 = "내가 제일 싫어하는 말이 뭔지 알아?"
211030-43 = "'게헨나는 원래 그래'라는 말이야!!"
211030-44 = "뭐가 원래 그렇다는 거야? 그건 앞으로도 아무것도 하지 않겠다는 말이랑 뭐가 달라?"
211030-45 = "그리고, 게헨나는 이렇지 않았다고! 왜 이렇게 된 건데!!"
211030-46 = "그건 맞아. 게헨나가 원래 이렇진 않았지."
211030-50 = "누구……?"
211030-56 = "너희, 그거지? 게헨나재흥위원회라는 동아리."
211030-57 = "어…… 맞는데."
211030-58 = "선배는 누구?"
211030-59 = "나? 그냥 지나가던 만마전 부원이야."
211030-60 = "그냥 지나가는 길에 한 마디 한 것뿐이야. 이야기에 끼려는 생각은 없었으니, 그럼……"
211030-61 = "자, 잠깐! 선배!"
211030-62 = "게헨나가 원래 이러진 않았다며? 선배는 '옛날'에 대해 알고 있어?"
211030-63 = "모든 질서가 유지되고, 학원 전체가 정갈하게 통제에 따랐던 옛날 말이야."
211030-64 = "그래. 알지. 잘 알지."
211030-65 = "어, 어땠어? 그때의 게헨나는, 분명 지금보다 훨씬 멋진 곳이었겠지?"
211030-66 = "지금처럼 혼란스럽고, 무질서하고, 아무 곳에서나 폭탄이 터지는 곳은 아니었겠지?"
211030-67 = "……."
211030-68 = "그러고 보니 너희는 예전의 게헨나를 잘 모르겠구나."
211030-69 = "맞아! 누구도 그때의 이야기를 잘 해주지 않거든!"
211030-73 = "음…… 나는 그 이유를 알 것 같은데."
211030-77 = "어떤 거? 무슨 의미야?"
211030-78 = "그때가 마냥 좋았던 시절은 아니었거든."
211030-79 = "너희는 잘 모르니까, 미지의 상태를 동경하는 것 같은데……"
211030-83 = "솔직히 말하면, 나는 그때로 돌아가고 싶지는 않아."
211030-84 = "어째서?!"
211030-89 = "그럼 선배는 지금이 더 좋다는 거야?"
211030-90 = "내가 볼 때는."
211030-91 = "……."
211030-92 = "자세한 건 나도 굳이 말하고 싶지는 않고, 할 수도 없고."
211030-93 = "너희가 게헨나를 위해 뭔가 하고 있다는 건 알아. 그리고 그것도 나름 의미가 있겠지."
211030-94 = "다만, 너무 옛날에 대한 환상을 갖지 않았으면 좋겠어."
211030-98 = "뭐, 아무튼 응원하고 있을게. 열심히 하는 모습 보기 좋아."
211030-103 = "……."
211030-104 = "……."
211030-105 = "뭘 모르는 선배였어! 아무렴!"
211030-106 = "옛날의 게헨나는 분명 지금보다 훨씬 더 질서가 있고 멋진 곳이었을 거라고! 그렇지, 쇼코?"
211030-107 = "……네. 물론입니다."
211030-108 = "그래! 기죽지 말자! 우리가 하는 일들은 모두 가치가 있을 테니까!!"
211030-109 = "역시, 이래야 우리 회장이지! 야핫!"
211030-110 = "흥! 저 선배, 나중에 다시 보게 해줄 거야."
211030-111 = "우리가 더 열심히 해서, 게헨나를 다시 위대하게 만들 거라고!"
211030-112 = "그래, 그래. 꼭 그렇게 만들자고."
211030-113 = "……그러기 위해서는 뭔가……."
211030-117 = "나, 느꼈어. 지금처럼 맨땅에 굴러가며 변화를 만드는 건 한계가 있어."
211030-121 = "뭘까? 지금 우리에게 부족한 거! 뭐가 필요하지?"
211030-125 = "안 그래도 몇 가지 계획을 세워뒀습니다."
211030-126 = "크, 역시 우리 브레인! 쇼코 쨩!"
211030-127 = "우와! 뭔데, 뭔데?"
211030-128 = "그전에."
211030-132 = "아무리 좋은 주장이라 한들, 들어주지 않으면 의미가 없습니다."
211030-133 = "그건 맞지……."
211030-134 = "그러니 주장을 관철하기 위해서는……"
211030-138 = "적절한 권위가 필요하겠지요."
211030-139 = "권!"
211030-140 = "위!"
211030-144 = "후후…… 네."
211030-145 = "그리고, 키보토스에는 있습니다. 그 권위의 상징이."
211030-147 = "다음화;게헨나를 위대하게……!"
