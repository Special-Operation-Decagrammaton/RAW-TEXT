[translation]
211030-1 = "第3話;ゲヘナを偉大に！"
211030-6 = "もー！"
211030-7 = "AT4無反動砲ぶっ放したの誰！？"
211030-11 = "ごめ～ん！#nロケットジャンプの練習してたら飛んでっちゃった！"
211030-12 = "なんで校内でそんな練習するの！"
211030-13 = "ここじゃなきゃどこでやるの？"
211030-14 = "人のいないとことか！#n見てよこれ！駐車場に大穴あいてるし、街灯は折れてるし！"
211030-15 = "おー！ほんとだー！"
211030-16 = "こんなだから「ゲヘナはいつも散らかっててカオスだ」って言われるんだよ！"
211030-20 = "え、今さら？ゲヘナって元からこうでしょ？"
211030-21 = "なぁっ……！"
211030-22 = "ま、風紀委員会が来る前に逃げるね！お疲れ～"
211030-30 = "おー、ちょっと目を離した隙にコレかぁ。"
211030-31 = "マユミ委員長、大丈夫ですか。"
211030-32 = "どうにかね。#n交通整理してたんだけど、無反動砲ぶっ放して逃げた生徒がいてさ……はぁ。"
211030-33 = "1発で済んだのは幸いでしたね。"
211030-34 = "どんまいどんまい。"
211030-35 = "まあ最初だし、こんなもんっしょ。#n交通整理とか校内ボランティアとか。コツコツやってこうよ。"
211030-36 = "うん……。"
211030-37 = "……失敗したのはいいの。やってればこういうこともある。"
211030-38 = "でも、あの一言だけは許せないんだ。"
211030-42 = "私がいっちばん嫌いな言葉。"
211030-43 = "「ゲヘナは元からこう」ってやつ！！"
211030-44 = "何が「元から」なの？#nそれって何も変える気ありませんってことじゃん！"
211030-45 = "それに、ゲヘナは最初からこんなんじゃなかったんだよ？#nいつからこうなっちゃったのさ！"
211030-46 = "それはそう。ゲヘナは元々こんなじゃなかった。"
211030-50 = "誰……？"
211030-56 = "君たち、あれでしょ？ゲヘナ再興委員会。"
211030-57 = "そうだけど……。"
211030-58 = "センパイは？"
211030-59 = "通りすがりの万魔殿さ。"
211030-60 = "気になったから、一言だけね。話に混ざる気はないから、それじゃ……。"
211030-61 = "待って！"
211030-62 = "先輩は昔を知ってるの？"
211030-63 = "秩序が保たれて、学園全体が統制に従ってた頃の話。"
211030-64 = "知ってるさ。よく知ってる。"
211030-65 = "その頃のゲヘナはカッコよかったんでしょ？"
211030-66 = "今みたいなカオスじゃなくて……。"
211030-67 = "……。"
211030-68 = "そうか。君たちは昔を知らないんだな。"
211030-69 = "誰もちゃんと話してくれないんだもん！"
211030-73 = "……皆が口をつぐむなりの理由があるんだよ。"
211030-77 = "どういうこと？"
211030-78 = "手放しには褒められないってことさ。"
211030-79 = "君たちは憧れてるみたいだけど……。"
211030-83 = "私は……あの頃に戻りたいとは思わない。"
211030-84 = "どうして！？"
211030-89 = "じゃあセンパイは、今の方がいいってこと？"
211030-90 = "ああ。"
211030-91 = "……。"
211030-92 = "詳しいことを話す気はないし、話せることでもない。"
211030-93 = "君たちがゲヘナのために何かしようとしてるのは分かるよ。#nそれにはきっと意味がある。"
211030-94 = "ただ、幻想を抱きすぎない方がいいってだけさ。"
211030-98 = "ま、応援してるよ。頑張ってる姿を見るのは悪くないからな。"
211030-103 = "……。"
211030-104 = "……。"
211030-105 = "あの先輩は何も分かってないんだよ！きっとそう！"
211030-106 = "昔のゲヘナはちゃんと秩序があって、カッコいい学園だったに決まってる！#nでしょ？"
211030-107 = "……はい。もちろんです。"
211030-108 = "よし！落ち込んでる場合じゃない！#n私たちのやることには意味があるんだから！！"
211030-109 = "やはっ、それでこそ委員長だよね！"
211030-110 = "さっきの先輩にも思い知らせてやるんだから。"
211030-111 = "私たちが頑張って、ゲヘナの偉大さを取り戻す！"
211030-112 = "もち！"
211030-113 = "そのためには、何か――"
211030-117 = "今みたいに地道に走り回ってるだけじゃ限界があるよね。"
211030-121 = "私たちに足りないものって何だと思う？"
211030-125 = "ちょうど、いくつか計画を立ててあります。"
211030-126 = "さっすがうちのブレイン！ショウコちゃん！"
211030-127 = "聞きたい聞きたい！"
211030-128 = "その前に。"
211030-132 = "どれだけ立派な主張でも、聞いてもらえなければ意味がありません。"
211030-133 = "それは、まあ……そうだよね。"
211030-134 = "主張を通すために必要なもの。"
211030-138 = "それは「権威」です。"
211030-139 = "権！"
211030-140 = "威！"
211030-144 = "ええ。"
211030-145 = "そして――お誂え向きな象徴がありまして。"
211030-147 = "次回;ゲヘナを偉大に……！"
