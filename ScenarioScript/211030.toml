211030-76 = ""
211030-77 = "เหตุผลเหรอ? หมายความว่ายังไง?"
211030-78 = "ก็ตอนนั้นไม่ใช่ยุคที่ดีไปเสียทั้งหมดน่ะสิ"
211030-79 = "พวกเธอไม่รู้ เลยดูจะเพ้อฝันกับสิ่งที่ไม่เคยเห็น..."
211030-80 = ""
211030-82 = ""
