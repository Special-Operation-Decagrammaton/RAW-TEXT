[translation]
211030-1 = "第3話;讓格黑娜偉大！"
211030-5 = ""
211030-6 = "真是的，人家明明在認真指揮交通……！"
211030-7 = "到底是誰在這裡發射AT4無後座力砲的！？"
211030-10 = ""
211030-11 = "啊，抱歉！本來想練習火箭跳躍，結果不小心飛到那裡去了！"
211030-12 = "嗚嗚，為什麼要在校內練習那種東西啦！"
211030-13 = "嗯？不在校內練習的話要去哪裡練？"
211030-14 = "去沒人的地方練啊！你看這個！#n停車場被炸出一個洞，而且路燈也壞了！"
211030-15 = "哇哈哈！真的耶！"
211030-16 = "就是因為這樣，格黑娜才會老是被說又亂又沒秩序啊！"
211030-17 = ""
211030-19 = ""
211030-20 = "是又怎樣？格黑娜本來就是這樣啊。"
211030-21 = "唔……！"
211030-22 = "總之辛苦啦～我要趁風紀委員會來之前開溜了！"
211030-23 = ""
211030-25 = ""
211030-26 = ""
211030-29 = ""
211030-30 = "啊，才離開一下就又出事了。"
211030-31 = "委員長，你沒事吧。"
211030-32 = "有人發射了無後座力砲之後就跑了。唉……"
211030-33 = "還好似乎只發射了一發。"
211030-34 = "打起精神來，委員長！呀哈。"
211030-35 = "雖然雄心勃勃地說要從指揮交通和校內服務開始做起，不過畢竟是第一次嘛。#n會覺得困難也是理所當然的。"
211030-36 = "嗯……"
211030-37 = "……失敗了也沒關係。總是會有這種時候的。"
211030-38 = "可是後面那句話實在很有問題。"
211030-39 = ""
211030-41 = ""
211030-42 = "你知道我最討厭的話是什麼嗎？"
211030-43 = "就是「格黑娜本來就是這樣」！！"
211030-44 = "什麼叫本來就是這樣？那跟「今後也打算擺爛」有什麼差別？"
211030-45 = "而且格黑娜以前明明不是這樣的！到底為什麼會變成現在這副德性！！"
211030-46 = "這倒是沒錯。格黑娜原本並不是這樣的。"
211030-47 = ""
211030-49 = ""
211030-50 = "是誰……？"
211030-51 = ""
211030-53 = ""
211030-55 = ""
211030-56 = "你們，就是那個吧？叫格黑娜再興委員會的社團。"
211030-57 = "呃……是沒錯。"
211030-58 = "前輩是誰？"
211030-59 = "我？只是個路過的萬魔殿成員。"
211030-60 = "只是在路過的時候順口說了一句話而已，沒有打算加入你們的話題。#n那麼我先走了……"
211030-61 = "等，等一下！前輩！"
211030-62 = "格黑娜原本不是這樣的對吧？前輩知道「以前」的事嗎？"
211030-63 = "就是一切秩序都維持得好好的、整個學園都井然有序服從管制的那個時候。"
211030-64 = "是啊。我知道得很清楚。"
211030-65 = "怎，怎麼樣？那時候的格黑娜，一定是比現在帥氣得多的地方吧？"
211030-66 = "不是像現在這樣混亂、沒有秩序、隨處都有炸彈爆炸的地方吧？"
211030-67 = "……"
211030-68 = "這麼說來，你們應該不太清楚以前的格黑娜吧。"
211030-69 = "沒錯！都沒有人好好跟我們說那時候的事！"
211030-70 = ""
211030-72 = ""
211030-73 = "唔嗯……我想我大概知道原因。"
211030-74 = ""
211030-76 = ""
211030-77 = "什麼原因？什麼意思？"
211030-78 = "因為那時候並不是一段單純美好的時光。"
211030-79 = "你們可能是因為不了解，才會對未知的事物心生嚮往……"
211030-80 = ""
211030-82 = ""
211030-83 = "不過老實說，我並不想回到那個時候。"
211030-84 = "為什麼！？"
211030-85 = ""
211030-87 = ""
211030-88 = ""
211030-89 = "所以前輩覺得現在比較好嗎？"
211030-90 = "在我看來是這樣。"
211030-91 = "……"
211030-92 = "詳細情況我不太想說，而且也沒辦法說。"
211030-93 = "我知道你們正在為格黑娜做些什麼。那應該也有它的意義吧。"
211030-94 = "只是，希望你們不要對以前抱有太多幻想。"
211030-95 = ""
211030-97 = ""
211030-98 = "總之，我會替你們加油的。看你們努力的樣子挺不錯的。"
211030-99 = ""
211030-101 = ""
211030-102 = ""
211030-103 = "……"
211030-104 = "……"
211030-105 = "那個前輩什麼都不懂！肯定是這樣沒錯！"
211030-106 = "以前的格黑娜一定比現在更有秩序、更帥氣！對吧，翔子？"
211030-107 = "……嗯，那是當然的。"
211030-108 = "好！不可以洩氣！我們的行為一定是有價值的！！"
211030-109 = "這才是我們的委員長嘛！呀哈！"
211030-110 = "哼！總有一天，我要讓那個前輩對我們刮目相看。"
211030-111 = "我們要更加努力，讓格黑娜再次偉大！"
211030-112 = "就是說啊。一定要做到哦。"
211030-113 = "為了達成目的需要些什麼……"
211030-114 = ""
211030-116 = ""
211030-117 = "我感覺到了。#n像現在這樣從零開始到處奔走來創造改變，是有極限的。"
211030-118 = ""
211030-120 = ""
211030-121 = "是什麼呢？我們現在缺少的東西！需要什麼呢？"
211030-122 = ""
211030-124 = ""
211030-125 = "正好我已經擬定了幾個計畫。"
211030-126 = "哇，不愧是我們的智囊！翔子醬！"
211030-127 = "哇！是什麼是什麼？"
211030-128 = "在那之前。"
211030-129 = ""
211030-131 = ""
211030-132 = "無論是多麼優秀的主張，要是沒有人聽的話就沒有意義了。"
211030-133 = "這倒是沒錯……"
211030-134 = "所以為了貫徹主張……"
211030-135 = ""
211030-137 = ""
211030-138 = "需要適當的權威。"
211030-139 = "權！"
211030-140 = "威！"
211030-141 = ""
211030-143 = ""
211030-144 = "呵呵……是的。"
211030-145 = "而且在奇普托斯──就有那股權威的象徵。"
211030-147 = "下一話;讓格黑娜偉大……！"
