[translation]
11334030-1 = "컨디션;집단 최면 1"
11334030-4 = "도착-. 다들 먼저 도착해 있……?"
11334030-5 = "……!? 뭐, 뭐야. 이 상황은!? 왜 다 바닥에 쓰러져 있는 거야!?"
11334030-6 = "무, 무리……. 더는……. 무리……."
11334030-7 = "완전한 방전 상태. 지금의 나를 표현할 수 있는 가장 적절한 표현……."
11334030-8 = "으, 으으……."
11334030-9 = "나머지 두 녀석이야 원래 그렇다 쳐도 아이리까지!? 뭐야, 진짜 무슨 일이야!?"
11334030-10 = "……아무렇지도 않게 실례되는 말을 막 던지네."
11334030-11 = "아하하……."
11334030-12 = "남에게 핀잔 줄 여유가 있다면, 무언가를 베풀 자비 또한 있어야 할 터……."
11334030-13 = "소녀여, 그대는 그런 자비를 겸비하고 있는가. 혹은 그저 남의 불행을 조롱할 뿐인 악인인가……."
11334030-17 = "……하아."
11334030-18 = "뭐, 이 정도일 거라고는 생각하지 않긴 했지만……. 다들 슬슬 한계일 거라곤 생각했었고."
11334030-22 = "……일단 먹고들 재개할까?"
11334030-23 = "……!!"
11334030-24 = "카즈사 쨩……!"
11334030-25 = "오~!! 뭐야, 뭐야! 의외로 꽤 센스가 있잖아!! 다시 봤다고!!"
11334030-27 = "이럴 때만 극찬이네."
11334030-28 = "……잠깐만. 어라……."
11334030-29 = "이거 어쩌면 꽤나……."
11334030-30 = "……? 음? 카즈사 쨩?"
11334030-31 = "아, 아니. 뭐 대단한 건 아니고……."
11334030-32 = "…………."
11334030-34 = "꽤 사기 증진에 좋은 방법이 될지도……."
