[translation]
13140-1 = "제14화;너희, 그리고 우리"
13140-9 = "……."
13140-10 = "으, 으으……."
13140-21 = "크윽…… 으으……."
13140-27 = "시, 시로코 선배!"
13140-28 = "틀렸어…… 시로코 선배라도 전혀 상대가 되지 않잖아. 이, 이 정도나 차이가 났던가……."
13140-29 = "예전보다 더 강해진 것 같아, 호시노 선배……."
13140-34 = "……. 역시 시로코 쨩, 강해. 이대로라면 곧 나를 추월할지도 모르겠는걸?"
13140-39 = "하아…. 하아……."
13140-40 = "자아. 그럼 시로코 쨩? 만족했어?"
13140-41 = "호시노 선배……."
13140-42 = "이 세계 전부가 나의 적이었던 시절…… 그런 나를 구원해 준 건 노노미 쨩이었어."
13140-43 = "노노미 쨩을 만나지 못했더라면 나는 아마도 삐뚤어진 범죄자가 되었을 거고, 시로코 쨩도 만나지 못했을 거야."
13140-44 = "……."
13140-45 = "노노미 쨩과 시로코 쨩을 만날 수 있었기에 대책위원회가 만들어질 수 있었어. 그래서 나도 구원받았다고 생각해."
13140-46 = "그러니까 노노미 쨩이 대책위원회와 함께했던 시간들을…… 그 모든 걸 없던 걸로 만들 수 없어."
13140-47 = "노노미 쨩이 자신을 가해자라고, 원래 여기 있어선 안 되는 사람이라고 말하게 둬선 안 돼."
13140-48 = "……."
13140-49 = "그러니까 가서 노노미 쨩을 무사히 데려와야지. 그리고 노노미 쨩이 돌아올 곳이 있어야 하니까, 너희는 여기 남아있어야 해."
13140-50 = "……."
13140-56 = "방법이 있을 거야…… 선생님을 기다리자……."
13140-57 = "분명……."
13140-58 = "……맞아. 확실히 선생님과 함께라면 앞으로의 문제를 해결할 수 있을 거라고 생각해."
13140-59 = "……하지만 아무리 선생님이라고 해도 이미 벌어진 일을 되돌릴 수는 없어. 죽은 사람을 되살리지 못하는 것과 마찬가지로."
13140-60 = "……?"
13140-61 = "유메 선배가 바라왔던 아비도스의 꿈을 정면으로 부정하는 <열차포>의 존재, 지금 벌어지고 있는<사모 펀드>의 전쟁……."
13140-62 = "이건 전부 과거의 <아비도스 학생회>의 잘못으로부터 비롯된 거야."
13140-63 = "만약 유메 선배가 이 열차포에 대해 알게 되었다면…… 선배는 당장 이걸 부수러 가자고 도와달라고 말했을 거야. 그 사람은 그런 사람이니까……."
13140-64 = "하지만 나는 그때 선배 곁에 없었어."
13140-65 = "유메 선배가 혼자서 이 계약서를 쓸 때 선배가 무슨 생각을 했는지 나는 알지 못해……."
13140-66 = "선배는 어쩌면…… 열차포가 아비도스 사막에 계속 감춰져 있기를 바랐던 것일지도 몰라."
13140-67 = "그러니까…… 나는 2년 전에 하지 못했던 일을 하러 가야만 해."
13140-68 = "저 열차포는 아비도스 학생회의 어둠이야. 대책위원회가 그것을 떠안을 필요는 없어."
13140-69 = "노노미 쨩이 거기에 죄책감을 가져선 안 돼. 시로코 쨩이 그 책임을 질 필요는 없어."
13140-70 = "이건 내 일이니까."
13140-75 = "가지마. 선배."
13140-76 = "나는…… 유메가 어떤 사람인지 알지 못해."
13140-77 = "나는 대책위원회 말곤 아무런 기억도 추억도 없어. ……그래서 그 사람에게 무슨 일이 있었는지 몰라."
13140-78 = "선배가 느끼는 기분도…… 아비도스 학생회 때의 선배도…… 나는 잘 알지 못해. 미안……."
13140-79 = "나에겐…… 대책위원회가 세상의 전부야. 그걸 없던 걸로 하지 마. 호시노 선배."
13140-84 = "어째서 대책위원회를 <너희>라고 부르는 거야……?"
13140-85 = "시로코 쨩……."
13140-86 = "대책위원회는 <우리>잖아. 어째서……"
13140-91 = "……. 미안해. 시로코 쨩. 나는 가지 않으면 안 돼."
13140-93 = "웃기지 마요---------!!!"
13140-104 = "……그러니까, 결국 우리를 두고 가겠다는 거네요?"
13140-113 = "그래서야 예전과 다를 게 없잖아요……!!"
13140-116 = "아야네 쨩……? 물구름호가 언제 이렇게 많아진 거야……?"
13140-119 = "또 [ruby=・]그[/ruby][ruby=・]때[/ruby]와 똑같은 행동을 저지르겠다는 거잖아요. 호시노 선배에겐 학습 능력이라곤 전혀 없는 건가요? 무모하고 대책이 없잖아요, 민폐잖아요!"
13140-120 = "간신히, 겨우 간신히 선생님 덕분에 여기까지 왔는데!! 같은 실수를 반복할 셈이잖아요!!"
13140-123 = "여기서 아야네 쨩의 명물 밥상 뒤집기가……?"
13140-124 = "음. 그렇지. 할 땐 하는 아이였지, 아야네 쨩은."
13140-128 = "……그러네. 세리카 쨩과 아야네 쨩의 듀오 무대인가. 이건 전심전력으로 응하지 않으면 선배 실격이겠지?"
13140-132 = "……네. 구제 불능 바보 아저씨의 만행은 힘으로라도 저지하겠어요."
13140-138 = "각오해, 선배!!"
13140-140 = "다음화;부학생회장의 명령"
