[translation]
84300200600-11 = "자, 이야기 한 대로 물건을 가져왔어. 대금은 확실한 거지?"
84300200600-15 = "아니, 이미 계약서까지 쓴 마당에, 그걸 의심하시면 어떻게 합니까?"
84300200600-16 = "이번 일만 잘되면, 계약서에 명시된 대로 수익의 25%를 정확-히 계산해서 드린다고 말씀드렸잖아요. 예?"
84300200600-17 = "여러분의 손에 얼마가 떨어지느냐…… 그 모든 것은 즉,"
84300200600-18 = "여러분이 '얼마나 일 처리를 잘 해주시느냐'에 달려 있다! 그러니 그 부분은 계속해서 잘 부탁드리겠습니다!"
84300200600-20 = "그렇지. 그런 계약이긴 했지."
84300200600-21 = "……그렇지만 밀레니엄 엑스포를 망쳐서 수익을 얻는다니, 보통은 하기 힘든 발상인데 말이야."
84300200600-26 = "(……!?)"
84300200600-27 = "(뭐라고요……? 엑스포를 망쳐……?)"
84300200600-29 = "뭐, 그렇지. 보통은 '잘해서' 수익을 만드니까."
84300200600-30 = "아~! 이것 참, 여러분! 그렇게 성실한 생각만 하니 돈을 못 버는 겁니다. 아시겠어요?"
84300200600-31 = "원래 돈방석에 올라앉는 건, 남들이 하지 못한 생각을 한 사람들인 거예요."
84300200600-32 = "다시 말해 최초가, 최고가 된다! ……아시겠어요?"
84300200600-33 = "자, 자! 그럼 저는 이만! 여러분들 말고도 다녀야 할 영업이 많아서요."
84300200600-34 = "이슈 생기면 언제든 연락 주시고요! 또 뵙겠습니다~!"
84300200600-41 = "(밀레니엄 엑스포를 망쳐서…… 수익을……?)"
84300200600-42 = "그런 말도 안 되는……."
84300200600-43 = "(……!! 앗, 실수로 말을……!)"
84300200600-45 = "응? 뭐야? 방금 무슨 말소리 들리지 않았어?"
84300200600-46 = "그럴 리가……. 진짜 그런 거라면 큰일인데. 들키지 않게 하라고 했잖아."
84300200600-47 = "특히 C&C한테 걸리면 끝장이라고……! 대금 다 날아간다는 계약인 거 잊었어!?"
84300200600-48 = "이, 일단 빨리 여길 뜨자. 뭔가 불안해, 시선이 느껴지는 것 같기도 하고……"
84300200600-49 = "먼저 간다! 너희도 모두 따라와……!"
84300200600-53 = "야, 야! 같이 가!!"
84300200600-59 = "(……후우.)"
84300200600-60 = "(하마터면 들킬 뻔…….)"
84300200600-65 = "아…… 쯧. 놓쳐버렸네. 거의 다 잡았다고 생각했는데."
84300200600-66 = "(……?)"
84300200600-67 = "(저분은…….)"
84300200600-74 = "어이."
84300200600-75 = "(……?)"
84300200600-76 = "어이, 거기. 너. 대답 안 해?"
84300200600-80 = "너 말이야, 너. 그 안에 너. 덕분에 계획이 망했는데, 계속 무시할 거야?"
84300200600-81 = "(……!)"
84300200600-82 = "나오라고. 딱히 싸우고 싶어 하는 분위기도 아니니, 때리진 않을 테니까."
