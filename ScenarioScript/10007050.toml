[translation]
10007050-1 = "제5화;용역부에게 일감을!"
10007050-4 = "저희 <227호 온천장>에는 훌륭한 온천 시설뿐만 아니라, 손님 여러분의 산책을 보조하기 위한 훌륭한 정원도 갖추어져 있답니다!"
10007050-5 = "물론 연중 내내 눈이 내리는 붉은겨울 학원의 특성상 꽃과 나무가 우거진 초록빛 정원을 꾸미는 건 어렵지만……."
10007050-6 = "대신 저희 <227호 온천장>에는 구교사 폐허의 돌과 모래를 모아 만든 고산수식 정원이 있답니다."
10007050-7 = "[s] \"고산수식 정원?\""
10007050-8 = "네, 고산수식 정원은 바위와 모래, 이끼만을 모아 만든 전통 정원이에요."
10007050-9 = "모든 정원의 양식은 결국 흙으로 돌아간다는 선종의 가르침처럼 화려함에 의지하지 않고 기본을 충실하게 지켜 만든, 절제미가 돋보이는 정원이죠.."
10007050-10 = "이 정원을 보고 있노라면, 세상사는 아무래도 상관없게 느껴질 정도의 차분한 마음이……."
10007050-14 = "규탄한다! 규탄한다!"
10007050-15 = "……차, 차분한 마음이……."
10007050-16 = "물러가라! 물러가라!"
10007050-17 = "으읏, 이번에는 또 누구인가요?! 모처럼 선생님과 좋은 이야기를 하고 있었는데!"
10007050-18 = "모두가 느긋하게 휴식을 즐기고 있는 휴양지에서 이런 소란을 피우다니. 손님이라도 따끔히 한 마디 해야겠어요!"
10007050-23 = "227호 온천장 입구"
10007050-25 = "노동자들의 권리를 탄압하는 <227호 온천장>은 물러가라!"
10007050-26 = "물러가라! 물러가라!"
10007050-27 = "<227호 온천장>은 용역부가 입은 피해를 보상해라!"
10007050-28 = "보상해라! 보상해라!"
10007050-30 = "그러니까 그건 오해라니까……."
10007050-34 = "이, 이게 다 무슨 소란인가요? 용역부가 어째서 이곳에?!"
10007050-35 = "그게…… 뭔가 오해가 있는 것 같아."
10007050-37 = "흥, 드디어 나타났군."
10007050-38 = "이 악덕 부르주아 지배인, 노도카!"
10007050-39 = "악덕 부르주아 지배인이라니, 그게 무슨 폭언인가요?"
10007050-40 = "온천 영업이 바쁜 탓에 진짜 사치다운 사치는 아직 부려보지도 못했는데!"
10007050-44 = "……흠, 흠."
10007050-48 = "저희 <227호 온천장>에는 무슨 일이신가요, 용역부 여러분?"
10007050-49 = "저, 저 표정 좀 봐!"
10007050-50 = "동지들! 저 자본으로 물든 사악한 유산계급의 미소를 보라!"
10007050-51 = "춥고 거친 곳에서 고락을 함께 할 때는 몰랐었는데……"
10007050-52 = "부를 거머쥐고 나니 드디어 본색을 드러냈구나, 이 변절자!"
10007050-53 = "잠깐! 저희가 언제 고락을 함께 했었나요?! 그리고 멋대로 이상한 호칭을 붙이지 마세요!"
10007050-57 = "……진정하시고 어째서 시위를 하고 계시는지부터 알려주세요, 미노리 씨. 다른 손님들이 곤란해하시잖아요."
10007050-58 = "흥, 이 온천장의 문제를 아직도 깨닫지 못한 건가."
10007050-59 = "네, 부디 가르쳐 주셨으면 하네요."
10007050-60 = "우리가 갖고 있는 불만은……"
10007050-62 = "이 온천장 그 자체다!"
10007050-64 = "네에? 그게 무슨 억지인가요?!"
10007050-65 = "저희가 온천장을 운영하면서 용역부에게 무슨 피해를 주기라도 했나요?"
10007050-66 = "시치미 떼지 마! 우리는 모두 지켜보고 있었다!"
10007050-67 = "사악한 게헨나의 온천개발부 부원들이 이곳에 온천장을 짓고 가는 모습을……!"
10007050-68 = "……그게 무슨 문제라도 되나요?"
10007050-69 = "당연히 문제가 된다!"
10007050-70 = "온천개발부 녀석들은 우리 붉은겨울 학원의, 붉은겨울 학원 소속이 아닌……"
10007050-72 = "외부 용역이잖아!"
10007050-73 = "[s] \"……외부 용역?\""
10007050-74 = "그동안 우리 용역부는 붉은겨울 학원에서 대규모 토목공사가 벌어질 때마다 궂은일을 가리지 않고 앞장서서 성실히 노동해왔었다."
10007050-75 = "거칠고 고된 노동환경이었지만…… 붉은겨울 학원의 모든 건물들은 우리 손으로 지어진다는 자부심 하나로 버틸 수 있었다."
10007050-76 = "그런데 새로 생긴 온천장이, 붉은겨울 제일의 관광명소가 우리 용역부가 아닌 외부 용역에 의해 건설되었다니……!"
10007050-77 = "이는 용역부원들의 자존심에 크나큰 상처를 입혔다!"
10007050-78 = "상처 입었어! 자존심 상해!"
10007050-79 = "우리 용역부는 <227호 온천장>의 이러한 횡포에 대해 엄중히 항의하는 바이다!"
10007050-80 = "항의한다, 항의한다!"
10007050-82 = "자, 잠깐만요. 그게 그러니까 이 온천장은 저희가 원해서 세운 게 아니라, 온천부원들이 멋대로 만든……."
10007050-83 = "잠깐, 선생님도 보고 계시지만 마시고 같이 한 마디 거들어주세요!"
10007050-84 = "[s1] \"맞아! 노도카도 온천개발부의 피해자라고!\"\n[s2] \"노도카도 사실 이런 온천장은 바라지 않았을 거야.\""
10007050-85 = "……특별반 학생들 또한 온천개발부의 피해자라고?"
10007050-86 = "흠. 그런 생각은 하지 못했었는데."
10007050-87 = "마, 맞아요! 저희도 따지자면 온천개발부의 개발로 구교사를 잃은 피해자라고요!"
10007050-88 = "……확실히, 거주지에 원치도 않은 불법 구조물이 세워진다면 곤란하겠지."
10007050-89 = "자, 노도카 동지. 그럼 지금부터 우리와 함께 이 사악한 온천장을 철거하는 게다!"
10007050-90 = "마, 맞아요. 저희도 처음부터 이런 온천장을 건설할 생각은 없었다고요!"
10007050-91 = "호오, 그럼 용역부와의 상의 없이 건설된 이 '불법 구조물'은 철거해버려도 괜찮은 건가?"
10007050-92 = "네에?!"
10007050-93 = "모처럼 얻은 일확천금의 기회를 제 발로 걷어찰 리가 없잖아요!"
10007050-94 = "역시 사악한 본색은 숨기지 못하는군, 이 꼬맹이 부르주아 녀석!"
10007050-95 = "우으, 정말 보자보자 하니까…… 사람을 무어로 보시는 건가요?"
10007050-96 = "더 이상의 폭언은 참을 수 없어요! <용역부>는 강제로 퇴거시키겠습니다!"
10007050-97 = "흥, 그렇게 나올 줄 알고 있었지. 아무리 갑자기 벼락부자가 되었다지만 특별반의 정학생들 따윈 조금도 두렵지 않다!"
10007050-98 = "동지들! 우리 용역부의 자존심과 노동권, 그리고……"
10007050-99 = "어, 또 이것저것 중요한 것들을 위하여……"
10007050-100 = "투쟁이다!"
