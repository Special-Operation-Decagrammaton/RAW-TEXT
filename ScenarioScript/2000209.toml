[translation]
2000209-1 = "네즈스케의 행방불명"
2000209-2 = "사야의 연구실"
2000209-3 = "선생, 큰일이야, 큰일! 네즈스케가…… 네즈스케가……"
2000209-4 = "네즈스케가 사라진 것이다!"
2000209-5 = "혹시나 어디 숨어있나 해서 연구실을 모두 뒤져보았지만 아무데도 없는 것이다!"
2000209-7 = "네즈스케가 말없이 사라진 건 이번이 처음인데… 이를 어쩌지? 으아아앙—"
2000209-8 = "[s] 사야를 진정시킨다."
2000209-10 = "흑, 흐윽. 하지만…… 네즈스케에게 무슨 일이라도 생기면 어떻게 하지……"
2000209-11 = "네즈스케가 갈만한 곳? #n네즈스케는 언제나 나와 단짝처럼 함께 다닌 것이다. 혼자서 어딜 가는 건 본 적이 없어……."
2000209-12 = "[s] \"다른 연단방 부원들에게 물어보자.\""
2000209-13 = "알았어…… 훌쩍."
2000209-15 = "산해경 교실"
2000209-16 = "네즈스케가 사라졌다고요? 그거 큰일이네요."
2000209-17 = "혹시 오늘 네즈스케 본 적 있어?"
2000209-18 = "아뇨, 저도 선배의 연구실 이외의 장소에서 네즈스케를 본 일은 없어요."
2000209-19 = "그보다 드문 일이네요. 네즈스케가 혼자서 사라지다니……"
2000209-20 = "어떡하지, 훌쩍……"
2000209-21 = "이런 말을 하기는 좀 그렇다만…… 혹시 네즈스케는 가출을 한 게 아닐까요?"
2000209-22 = "……가출?"
2000209-23 = "네, 매일같이 선배가 실험을 핑계로 네즈스케를 괴롭혔으니까요."
2000209-24 = "오히려 그동안 도망치지 않았던 게 더 용하다고 할까."
2000209-25 = "괴롭히다니! 나님은 실험을 도와 달라고 했을 뿐이지 네즈스케를 괴롭힌 적은 없는 것이다!"
2000209-26 = "하지만 네즈스케는 실험에 참가하는 걸 싫어했잖아요? #n툭하면 이상한 꼴이 되기 일쑤니, 네즈스케의 심정도 이해가 가요."
2000209-27 = "우으……"
2000209-28 = "[s] \"다른 부원에게도 물어보도록 하자\""
2000209-29 = "알겠어……"
2000209-31 = "이런, 네즈스케 씨가 사라졌나요?"
2000209-32 = "응. 혹시 오늘 네즈스케 못 본 것이냐?"
2000209-33 = "글쎄요…… 오늘 네즈스케 씨를 본 기억은 없네요."
2000209-34 = "정말, 어디로 간 것이냐…… 훌쩍."
2000209-35 = "저, 외람된 말이지만, 네즈스케 씨는 가출을 한 게 아닐까요."
2000209-36 = "다들…… 왜 그렇게 생각하는 거냐?"
2000209-37 = "그야 네즈스케 씨는 언제나 사야 선배에게 괴롭힘을 당하고 있었으니까요."
2000209-38 = "괴롭히려던 게 아니었는데. 우으으……"
2000209-39 = "[s] \"학원을 돌며 네즈스케를 찾아보자.\""
2000209-40 = "응……"
2000209-42 = "산해경 학원"
2000209-47 = "네즈스케— 정말 어딜 간 거야……"
2000209-48 = "[s] \"저 쪽도 찾아보자.\""
2000209-49 = "……아냐, 틀렸어. #n네즈스케는 부원들의 말대로 가출을 한 게 분명한 것이다."
2000209-50 = "그동안 나님이 너무 괴롭힌 탓이다. 흑흑…… #n네즈스케는 내게 실망해서 다시는 돌아오지 않을 것이다."
2000209-51 = "[s] 포기하지 말라고 말해준다."
2000209-52 = "선생도 그동안 내 실험 때문에 괴로웠던 거지? #n그런데…… 어째서 내게 이렇게 잘 해주는 거야?"
2000209-53 = "[s1] \"나는 사야와 함께 해서 즐거웠어.\"\n[s2] \"선생님이니까 괜찮아.\""
2000209-55 = "선생……"
2000209-57 = "선생……"
2000209-60 = "찍, 찍찍……"
2000209-61 = "아앗, 네즈스케 이 녀석……! #n어디에 갔었던 거야, 으아아아앙!"
2000209-62 = "찍찍……"
2000209-63 = "흑, 흑흑…… 그동안 나님이 너무 심하게 굴어서 가출했던 것이냐? #n정말 미안해……"
2000209-64 = "찍찍, 찌익."
2000209-65 = "뭐? 상회에서 커다란 해바라기 씨앗을 나눠준다고 해서 다녀왔다고? #n그래도 말도 없이 가버리면 어쩌자는 것이냐! 하루 종일 찾았잖아!"
2000209-66 = "흑…… 그래도 미안한 것이다. 앞으로는 심한 장난은 치지 않을 테니까…… #n다시는 말도 없이 사라지면 안 돼?"
2000209-67 = "찍……"
2000209-70 = "응응, 약속하는 것이다! 앞으로는 진지한 실험에만 너를 사용할 것을!"
2000209-71 = "찌익!"
2000209-72 = "이 녀석, 네즈스케! 발버둥 치지 마! #n앞으로는 절대로 놓치지 않을 테니까!"
2000209-74 = "찍, 찍찍!"
2000209-76 = "이후, 사야는 네즈스케와 사이좋게 연구실로 돌아갔다."
