[translation]
10029060-1 = "제6화;수리"
10029060-2 = "밀레니엄 폐허 하층부"
10029060-4 = "거의 다 왔어. 좌표상 이제 이 앞으로 나가면……."
10029060-5 = "그 '설비'라는 게 있는 방이 나온다-라는 건가. 생각보다는 금방 왔네."
10029060-6 = "부장이 준 루트가 있었으니까. 정보가 없었다면, 길 찾기만으로도 기약조차 없었을 거야."
10029060-7 = "시설 전체의 규모는 웬만한 산업단지 하나에 준하는 규모인 것 같으니까."
10029060-8 = "이렇게 거대한 물건이 아무도 모르는 채로 방치돼 있었다고요?"
10029060-9 = "대단해……!! 역시 이세계!!"
10029060-10 = "아니, 비슷한 느낌은 우리 쪽에도 없다고는 못하겠는데……."
10029060-11 = "……네? 그게 무슨……."
10029060-13 = "……쇼쿠호."
10029060-14 = "아무 말도 안 했어."
10029060-15 = "도착했으면 얼른 앞장서지 그래? <레벨 5의 레일건> 씨?"
10029060-16 = "그, 그건 그만하라고 했잖아!!"
10029060-17 = "그러는 너도 별명이라면 얼마든지……!"
10029060-18 = "……하아."
10029060-19 = "아니다. 내가 대체 지금 뭐 하고 있는 건지……."
10029060-20 = "자, 자. 이해했으면 됐지? 이쪽은 앞장서서 싸우는 전투형이 아니라서."
10029060-22 = "미사카 씨가 앞장 서주는 게 든든하고 모두에게 좋을 거 같은데? 기대력에 부응해 주는 차원에서도."
10029060-23 = "그건 또 무슨……."
10029060-29 = "……진짜냐."
10029060-30 = "동의해. 지금까지의 상황을 보건대, 지금 구성원들 중에선 미코토와 내가 가장 최전열에 적합한 인선이야."
10029060-32 = "들었지? 협조하겠다고 한 건 미사카 씨 스스로 한 말이기도 하잖아?"
10029060-33 = "아니, 딱히 뒤에 있겠다고 말한 적은 없고……."
10029060-34 = "……알았어, 알았다고."
10029060-35 = "그럼 문을 열고 나랑 그쪽이 안으로 제일 먼저 들어가면 되는 거지? 혹시 모를 상황을 대비해서."
10029060-36 = "……'그쪽'이 아니라 에이미."
10029060-37 = "……응?"
10029060-38 = "그쪽이라는 표현은 부른 대상을 혼동할 여지가 있어. 그리고 이름 부르기를 먼저 요구한 건 미코토 쪽이니, 앞으로는 에이미라고 불러."
10029060-42 = "뭐, 뭐……. 나도 같은 소릴 했으니 뭐라 할 처지는 못 되겠네."
10029060-43 = "좋아. 그럼 에이미."
10029060-44 = "……들어간다."
10029060-45 = "……응."
10029060-49 = "……여긴가?"
10029060-50 = "……여긴가요? 확실히 넓고 중요한 공간처럼 생기긴 했는데……."
10029060-51 = "그렇지만 뭔가 딱히 있는 것 같지는……."
10029060-52 = "……아! 저건가요? 뭔가 척 봐도 중요해 보이는 거대한 기계 장치가!"
10029060-54 = "과연. 확인했어. 아무래도 저게 그 '설비'라는 것 같네."
10029060-55 = "생각보다 훨씬 더 큰 물건이네. 뜯어보는 맛이 있겠는걸."
10029060-56 = "……?"
10029060-57 = "잠깐만. 뜯어보다니? 고쳐야 되는 거 아니었어?"
10029060-59 = "……!? 그, 그건."
10029060-60 = "제, 제대로 고치려면 우선 뜯어보는 게 전제돼야 하니까요! 당연한 이야기지요!"
10029060-61 = "맞아. 그런 의미의 이야기였어. 절대로 다른 뜻은 없어."
10029060-62 = "아아. 물론이지. 당연한 소릴."
10029060-67 = "절대로 재밌을 거 같다고 생각했다거나 그런 건 아니니까 말이야."
10029060-68 = "[s1] \"……그, 그래.\"\n[s2] \"이보세요!\""
10029060-75 = "……? 무슨 소리지?"
10029060-76 = "설비가……! 설비가 움직이기 시작했어요!!"
10029060-77 = "그렇게나 떠들었으니 당연하다면 당연한 걸까……."
10029060-78 = "그렇다면 이것은……."
10029060-79 = "다시 한번……."
10029060-80 = "……나설 차례!?"
10029060-81 = "왜 좋아하는 거야!?"
10029060-82 = "미사카 씨의 차력쇼를 한 번 더 볼 수 있는 기회라서?"
10029060-83 = "차력쇼!? 지금 분명 차력쇼라고 했지!?"
10029060-85 = "……잠깐."
10029060-86 = "아니. 이상해. 지금까지와는 달라. 이건 단순히 드론만 몰려오는 패턴이 아니야."
10029060-90 = "처음으로 확인되는 패턴. 이건……."
10029060-94 = "[ns3] \"설마 히마리가 말했던 '전이'……?\"\n[ns4] \"주변에서 알 수 없는 빛이……!?\""
10029060-101 = "……! '설비'가 뭔가의 움직임을……."
10029060-103 = "자, 잠깐만요!? 저대로 둬도 괜찮은 건가요?! 우릴 이상한 데로 날려버린다거나……!"
10029060-104 = "아마도 그런 것 같아. 실제로 그런 기능도 있다고 했었고."
10029060-105 = "자신에게 위협이 되는 존재는, 애초에 멀리 전송시켜 버리는 게 제일 효율적이지."
10029060-106 = "몰려드는 드론 또한 그것을 무사히 실행하기 위한 시간 벌이일 거야."
10029060-112 = "……방탄 베리어까지 켜져 있고. 직접 다가가서 부수지 않는 한 어렵겠어."
10029060-113 = "그러니까 그런 상황인데 왜 그리 태평하게 말하냐고!!"
10029060-114 = "선생님!!"
10029060-115 = "[s5] \"알았어!\"\n[s6] \"우선 설비의 움직임을 막자!!\""
10029060-118 = "바로 돌입할게. 지휘 부탁해."
10029060-130 = "…………."
10029060-131 = "……그……."
10029060-132 = "있잖아. 우리……."
10029060-133 = "고치러 온 거……. 맞지……?"
