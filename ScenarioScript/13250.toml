[translation]
13250-1 = "제25화;최후의 전투 1"
13250-6 = "크학…… 크흑……!!"
13250-9 = "쿨럭, 쿨럭…… 큭……!"
13250-10 = "아직…… 쿨럭, 쿨럭……."
13250-11 = "……."
13250-12 = "어째서……. 어째서…… 부족한 거지……."
13250-15 = "아직도…… 부족한 건가……. 아비도스를 부정하기에는……."
13250-16 = "그렇게나 떠돌았는데도……. 나는……."
13250-19 = " ……뭘 하고 싶었던 거야, 너는?"
13250-20 = "하아…… 하아……."
13250-21 = "내가 목표였다고? ……아니, 그러기엔 네 행동은 이해되지 않는 게 너무 많아."
13250-22 = "……."
13250-23 = "……. 안대 쨩. 수첩 이야기, 진짜야?"
13250-24 = "수첩……? 하하……. 학생회장의 수첩……?"
13250-27 = "설마 진짜로 있을 거라 생각했어? 호시노. 아비도스 사막 한가운데서 잃어버린 수첩이……?"
13250-33 = "그런 걸 찾으려고 애쓰는 건 너 같은 멍청이뿐이겠지……."
13250-45 = "……나는."
13250-46 = "최강이 되지 않으면 안 돼……."
13250-47 = "그 저주받은 땅을 떠나…… 떠돌며 각오한…… 이렇게……"
13250-52 = "최강?"
13250-53 = "……뭐, 됐어."
13250-57 = "그럼 이제 열차포를 파괴하러……."
13250-59 = "그건 안되지!!!"
13250-63 = "어라……."
13250-68 = "어서 와, 호시노 선배."
13250-70 = "여기서 그 대사야……? 다들 어지간히 화가 많이 났나 보구나……."
13250-71 = "하아…… 이 아저씨를 쫓아 여기까지 온 거야? 역시 무서운 후배들이야. 이 아저씨는 조금 떨릴지도……?"
13250-72 = "[s] \"너를 막으러 왔어. 호시노.\""
13250-73 = "거기다가 선생까지 있으니……. 꽤 어렵겠는걸. 각오를 단단히 했구나, 아야네 쨩."
13250-78 = "그치만 어째서야? 이 열차포를 그냥 두면 아비도스가 혼란에 휩싸이게 된다구."
13250-79 = "하지만 호시노 선배는 그걸 부수고 자퇴할 생각이잖아요!"
13250-80 = "그래야 피해가 후배들에게 가지 않으니까……."
13250-81 = "무슨 참견이야? 누가 그런 걸 원했대?"
13250-83 = "맞아요! 왜 멋대로 혼자 결정하는 거예요? 이래서야 저번과 다를 게 없잖아요!"
13250-84 = "응. 나이도 우리보다 많으면서."
13250-86 = "이, 이럴 때 그런 딴죽을 거는 거야, 시로코 쨩……?"
13250-87 = "문답 무용!"
13250-88 = "지금 즉각 포획하겠습니다!!"
13250-90 = "자, 잠깐만? 아야네 쨩……?"
13250-95 = "아야네 쨩…… 아야네 쨩……."
13250-96 = "으, 으응……?"
13250-97 = "……?"
13250-103 = "후배……라던가 아야네 쨩이라던가…… 그게 아니잖아요……."
13250-104 = "으, 으응……? 아야네 쨩……?"
13250-105 = "저를 부를 때는……."
13250-110 = "아야네 회장님이라고 부르라고!!!!!!!!"
