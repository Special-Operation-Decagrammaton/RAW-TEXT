[translation]
10016050-1 = "제5화;순찰 활동"
10016050-5 = "츠쿠요 공, 츠쿠요 공. 저기 좀 보세요!"
10016050-6 = "입으면 홀로그램으로 몸을 투명하게 만들어 주는 밀레니엄 특제 기념 티셔츠래요!"
10016050-7 = "후후…… 저 티셔츠를 입으면 인술을 쓰지 않고도 은밀히 적진에 잠입할 수 있겠네요."
10016050-8 = "시착도 가능하다고 하니, 같이 한번 입어봐요!"
10016050-9 = "하, 하지만 저같이 커다란 애가 입을 수 있는 사이즈가 있을까요……?"
10016050-10 = "억지로 입다가 옷이 찢어지기라도 하면…… 분명 볼품없는 꼴이 되어버릴 거예요……."
10016050-11 = "그렇지 않아요! 입간판에도 다양한 사이즈가 준비되어 있다고 쓰여 있는걸요?"
10016050-12 = "자, 자, 새로운 인법을 연구할 좋은 기회니 함께 보러 가요!"
10016050-19 = "와아! 밀레니엄에서 개최한 운동회라서 그런지 신기한 기계로 만든 먹거리가 잔뜩 있네!"
10016050-20 = "치세 선배. 카에데는 저기에 있는 자동 타코야끼 기계로 만든 타코야끼가 먹고 싶어!"
10016050-21 = "으음…… 좋은 시상이 떠오를 것 같기도."
10016050-22 = "저기, 치세 선배— 내 말 듣고 있어?"
10016050-23 = "……음, 떠올랐다."
10016050-25 = "데#n굴#n데#n구#n르"
10016050-27 = "소#n리#n내#n며#n구#n르#n네"
10016050-29 = "라#n무#n네#n구#n슬"
10016050-32 = "저기서 팔고 있는 건 라무네가 아니라 타코야끼라니까!"
10016050-33 = "선배, 빨리 타코야끼 먹으러 가자~"
10016050-38 = "와, 밀레니엄 학원에도 응원단이 있었군요!"
10016050-39 = "특수 소재로 만들어진 응원복과 홀로그램 드론까지…… 기합이 잔뜩 들어가 있네요!"
10016050-40 = "아…… 그게, 정확히 말하자면 공식적인 응원단은 아니지만—"
10016050-43 = "후후, 그 말대로야. 우리가 바로 밀레니엄의 응원을 책임지는 응원 전문가— 마이스터들이지!"
10016050-44 = "그쪽은 옷의 문양을 보아하니 트리니티 출신의 학생인가?"
10016050-45 = "네, 맞아요! 구호기사단의 선배들을 따라 경기에서 다친 선수들을 치료하기 위해 대운동회에 참가했답니다!"
10016050-46 = "환자를 돌볼 때는 몸의 건강도 중요하지만, 마음의 건강도 중요한 법……"
10016050-47 = "선배들이 약과 붕대로 몸이 아픈 환자들을 치료한다면, 저는 응원으로 마음이 아픈 환자 여러분들을 치료하려고요!"
10016050-48 = "흐음. 목소리에서 응원을 향한 진심이 느껴지는군……"
10016050-49 = "그 기세라면 우리 밀레니엄 응원단의 좋은 라이벌이 되겠어!"
10016050-53 = "오옷, 학교 간 응원전인가요?"
10016050-54 = "응원단의 기량과 기세를 겨루는 응원전은 '관중석에서 벌어지는 번외 경기'라고 부를 만큼 대운동회의 주요한 볼거리 중 하나죠!"
10016050-55 = "하지만 저는 곧 있을 장애물 이어달리기에 참가해야 해서…… 이 응원전에 참가할 수 없다는 게 아쉽기만 하네요."
10016050-57 = "그, 그럼 장애물 이어달리기 대회에는 코토리 대신 내가 나가는 게 좋지 않을까?"
10016050-58 = "둘 다 못 하는 건 마찬가지지만, 나는 달리기에 조금 더 자신이 있는데……"
10016050-59 = "그런 태도는 좋지 못해, 히비키."
10016050-60 = "<황륜대제>는 육체의 한계와 가능성에 도전하는 스포츠의 제전……"
10016050-61 = "그렇기 때문에 오히려 평소에 못 하던 일에 도전해야만 그 가치를 인식할 수 있는 거야!"
10016050-62 = "멋진 말씀이네요, 밀레니엄의 응원단장님!"
10016050-63 = "그 기세에 밀리지 않도록 저도 열심히 응원하겠어요!"
10016050-64 = "그 도전, 받아주지!"
10016050-68 = "빨리 대운동회가 끝났으면 좋겠어……"
10016050-72 = "[ns] \"다들 즐겁게 대운동회를 즐기고 있는 모양이네……\""
10016050-74 = "저…… 나, 나츠씨. 그 파르페는……"
10016050-77 = "응? 이 파르페에 관심이 있는 건가?"
10016050-78 = "이 파르페의 가치를 한눈에 알아보다니…… 역시 정의실현부의 부원다운 노련한 눈썰미군."
10016050-79 = "이 파르페는 노점상 구역에 있는 <르와조 블뢰>의 팝업 스토어에서 구입한 것."
10016050-80 = "르와조 블뢰의 파르페는 평소에도 구하기 어렵지만, 이곳 팝업 스토어에서 파는 파르페는 더욱 희귀한 것이지."
10016050-81 = "그, 그런가요. 하지만 그게 문제가 아니라—"
10016050-82 = "주문 즉시 크림을 휘핑하고 과일을 잘라 완성하는 본점의 파르페와 달리 이곳의 파르페 재료는 미리 만들어 냉장 상태로 가져온 것이거든."
10016050-83 = "하지만 그 부족한 퀄리티를 보충하기 위해 아이스크림을 3단으로 쌓았기 때문에 비주얼만큼은 원조를 압도하고 있지."
10016050-84 = "이 언밸런스한 파르페야말로 <황륜대제>에서만 맛볼 수 있는 청춘의 디저트—"
10016050-85 = "잠시만요. 저는 그 파르페에 관심이 있는 게 아니라……"
10016050-86 = "도로에서 걸어 다니면서 파르페를 드시면 안 된다고 말씀드리려 했어요."
10016050-87 = "……응? 어째서 길을 걸으면서 파르페를 먹으면 안 되는 거지?"
10016050-88 = "그야 교칙에서 금지하고 있으니까요. 게다가 걸으면서 음식을 먹으면 점잖아 보이지 않기도 하고……"
10016050-89 = "분명 보행 중 취식은 트리니티의 교칙에서 금하는 부정한 행동……"
10016050-91 = "하지만 황륜대제에서도 그 정의가 통용된다고 할 수 있을까!"
10016050-92 = "저, 정의요?"
10016050-93 = "음식은 식기로 먹는 것이 예의지만, 정통 카레를 먹을 때는 손으로 식사를 하는 게 예의라는 이야기도 있잖아?"
10016050-94 = "그렇다면 휴대하기 쉽도록 일회용 용기에 담아 준 파르페를 올바르게 즐기는 방법은 무엇일까."
10016050-96 = "어쩌면 황륜대제에서만큼은 걸어 다니며 파르페를 먹는 게 정의일지도……!"
10016050-98 = "드, 듣고 보니까 그런 것 같기도……"
10016050-99 = "……이상한 말로 부원들을 현혹하지 말아 주세요, 나츠 씨."
10016050-100 = "보행 중 취식이 금지되는 것은 황륜대제의 회장이라도 예외가 아닙니다."
10016050-101 = "에에, 예외는 없었던 건가……"
10016050-102 = "게다가 그렇게 맛있어 보이는……"
10016050-103 = "아니, 큰 파르페를 먹으며 움직이면 자칫 다른 사람의 옷을 더럽힐 수도 있습니다."
10016050-104 = "그러니 파르페는 지정된 휴게 장소에 앉아 다 드신 후에 이동해주세요."
10016050-105 = "하지만 곤란한데. 이 파르페는 몰래 혼자 먹으러 온 것이라, 한자리에 앉아 있으면 다른 부원들에게 들킬지도 몰라."
10016050-106 = "그렇게 된다면 분명 다들 자기 몫도 사달라며 한동안 나를 괴롭히겠지……."
10016050-107 = "……하는 수 없지. 이 파르페는 부부장이 대신 처리해 줘."
10016050-108 = "네? 갑자기 제게?"
10016050-109 = "모처럼 구한 파르페를 먹지 못하는 건 아쉽지만, 이 디저트의 가치를 아는 사람이 대신 먹어준다면 납득할 수 있어."
10016050-110 = "그럼 나는 다른 부원들을 찾으러 먼저 이만!"
10016050-114 = "갑자기 이런 커다란 파르페를 떠안게 되어버리다니, 곤란하네요……."
10016050-115 = "안 그래도 가까스로 유혹을 참고 있었는데, 이렇게 칼로리가 높아 보이는 음식을 먹는다면 결심이 무너지고 말 거예요."
10016050-116 = "……"
10016050-117 = "하지만 음식을 버리는 것도 예의가 아니니—"
10016050-118 = "[s] \"하나 정도는 먹어도 괜찮지 않을까?\""
10016050-119 = "……서, 서, 선생님? 언제부터 여기에?!"
10016050-120 = "[s] \"아까 전부터 있었어.\""
10016050-121 = "그, 그러셨군요."
10016050-122 = "안 그래도 마침 이 파르페를 부원에게 넘기려던 참이었습니다."
10016050-123 = "네, 네? 나츠 씨가 하스미 님께 드렸으니 직접 드시는 게……"
10016050-124 = "아뇨, 저는 아까 충분한 양의 점심을 먹었으니까요. 더 이상의 칼로리 보충은 불필요합니다."
10016050-125 = "안 그래도 무더운 날씨에 풍기를 단속하느라 고생이 많았을 테니, 잠시 시원한 것을 먹으며 땀을 식히도록 하세요."
10016050-126 = "가, 감사합니다……."
10016050-130 = "하아……."
10016050-131 = "[s1] \"꽤 지친 것처럼 보이네.\"\n[s2] \"하스미도 조금 쉬는 게 어때?\""
10016050-132 = "아뇨. 저는 괜찮습니다. 식사도 충분히 했고, 경기에 참가한 것도 아니니 체력도 온전히 보존하고 있고요."
10016050-133 = "아뇨. 저는 괜찮습니다. 식사도 충분히 했고, 경기에 참가한 것도 아니니 체력도 온전히 보존하고 있고요."
10016050-134 = "게다가 순찰을 소홀히 하면 조금 전처럼 축제의 분위기에 취한 학생들이 일탈을 저지를지도 모릅니다."
10016050-135 = "그에 비해 밀레니엄과 게헨나의 실행위원들은……"
10016050-136 = "축제를 즐기는 데 빠져 자신의 책무를 잊은 것처럼 보이더군요."
10016050-137 = "[s3] \"그래도 모처럼의 축제인데…….\"\n[s4] \"잠깐 정도는 즐겨도 괜찮지 않을까?\""
10016050-138 = "아뇨, 사람에게는 저마다의 역할이 따로 있습니다. 축제를 즐기는 것 또한 다른 누군가의 역할일 뿐이지요."
10016050-139 = "아뇨, 사람에게는 저마다의 역할이 따로 있습니다. 축제를 즐기는 것 또한 다른 누군가의 역할일 뿐이지요."
10016050-140 = "아까도 말씀드렸지만, 대운동회의 운영 역시 복잡한 학원 업무의 연장일 뿐입니다."
10016050-141 = "저는 언제나처럼 정의실현부의 부부장으로서 제 책무를 다하면 되는 것입니다."
10016050-148 = "어, [USERNAME] 선생님이잖아?"
10016050-149 = "안녕하세요, 선생님. 현장에서 이렇게 딱 마주치게 되다니, 우연이네요!"
10016050-150 = "[s5] \"안녕. 키리노, 후부키.\"\n[s6] \"순찰하던 중이었어?\""
10016050-151 = "네. 저희 발키리 경찰학교는 대운동회에 직접 참가하지는 않지만, 학생들이 안전하게 축제를 즐길 수 있도록 회장 안팎에서 치안 및 경비 업무를 수행하고 있습니다."
10016050-152 = "네. 저희 발키리 경찰학교는 대운동회에 직접 참가하지는 않지만, 학생들이 안전하게 축제를 즐길 수 있도록 회장 안팎에서 치안 및 경비 업무를 수행하고 있습니다."
10016050-153 = "다만 황륜대제가 열리고 있는 이곳, 애슬레틱 스타디움의 규모가 너무 커서…… 한 바퀴를 도는 데도 꽤 오랜 시간이 걸리네요."
10016050-154 = "귀찮은 경기에 직접 참가하지 않아도 된다고 해서 좋아했는데, 설마 그늘 하나 없는 경기장 주변을 몇 번이고 계속 돌게 될 줄이야……"
10016050-155 = "이럴 줄 알았으면 아프다는 핑계를 대고 기숙사에서 쉴 걸 그랬어……."
10016050-156 = "안 돼요, 후부키. 거짓말로 직무를 회피했다간 나중에 중징계를 받을 수도 있다고요?"
10016050-157 = "대신 이번 순찰이 끝나면 로봇이 직접 만들어 튀긴다는 밀레니엄 특제 도넛을 사드릴 테니, 마지막까지 함께 힘내죠!"
10016050-158 = "로봇이 만드는 도넛은 뭔가 맛도 다르려나……"
10016050-159 = "그러고 보니 그 옆에 계신 분은…… 트리니티 정의실현부의 부부장님이시군요!"
10016050-160 = "[s] \"두 사람은 이미 구면이야?\""
10016050-161 = "네, 오전에 경기를 방해하려는 불량 학생이 있어서 진압에 애를 먹고 있었는데……"
10016050-162 = "그때 저격으로 본관을 도와주셔서 불량 학생들을 무사히 체포할 수 있었습니다. 다시 한번 감사드립니다!"
10016050-163 = "아닙니다. 저야말로 발키리 경찰학교의 학생 여러분께는 큰 도움을 받고 있는걸요."
10016050-164 = "불량 학생들이 나타날 때마다 실행위원회에 신속히 보고를 해 주셔서 사건이 커지기 전에 문제를 해결할 수 있었습니다."
10016050-165 = "……과연, 범죄 사건이 일어나면 그 누구보다 빨리 현장에 나타난다는 생활안전국 학생들의 이야기는 거짓이 아니었군요."
10016050-166 = "하, 하하…… 그렇게 칭찬해 주시니 어쩐지 부끄럽네요……."
10016050-167 = "그나저나 뭔가 순찰 중에 특별한 문제는 없으셨나요?"
10016050-168 = "네. 수상해 보이는 학생이나 물건은 없었던 것 같은데……"
10016050-169 = "아, 그러고 보니 아까 진행 스태프가 아닌데도 솔선수범해서 경기에 필요한 비품을 옮겨주던 학생들과 마주쳤습니다."
10016050-170 = "포환이 가득 담긴 상자나 철골 같은 무거운 비품을 옮기면서도 도움은 필요 없다며 친절히 사양했지요."
10016050-171 = "경기가 끝나자마자 실행위원보다 먼저 나타나 비품을 옮길 정도로 의욕적인 학생들이었지."
10016050-172 = "……뭔가 수상하군요."
