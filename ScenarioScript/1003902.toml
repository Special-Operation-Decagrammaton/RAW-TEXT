[translation]
1003902-1 = "RABBIT 4, 은신합니다."
1003902-4 = "중앙구 인근 대형 상점가 앞"
1003902-5 = "(미유와의 약속 당일…….)"
1003902-9 = "(상점가 앞에 가보니 미유가 행인들에게 계속해서 치이고 있었다…….)"
1003902-14 = "……어라? 이런, 실례했군."
1003902-15 = "괘, 괜찮습니다. 제 탓이에요……."
1003902-21 = "……미, 미안."
1003902-22 = "이상하네. 거기 있는 줄 몰랐어."
1003902-23 = "괘, 괜찮아요…… 계속 가시던 길 가세요……."
1003902-27 = "아…… 선생님……."
1003902-28 = "어, 어서 오세요. 기다리고 있었어요."
1003902-29 = "[s1] \"……괜찮아?\"\n[s2] \"뭔가 행인들에게 엄청나게 치이고 있던데.\""
1003902-30 = "괘, 괜찮아요. 사람이 많은 장소에 가면 자주 있는 일이니까요……."
1003902-31 = "괘, 괜찮아요. 사람이 많은 장소에 가면 자주 있는 일이니까요……."
1003902-32 = "저는 어릴 적부터 워낙 존재감이 희박해서……"
1003902-33 = "지나가는 사람들이 제 존재를 알아차리지 못하고 달려와 부딪치는 경우가 많았어요……."
1003902-34 = "그 덕분에 잠복 같은 건 특기라…… SRT의 저격 테스트에서도 만점을 받을 수 있었지만……."
1003902-35 = "교관님이 제가 훈련장에 남아 있다는 사실조차 잊어버리고 돌아가시는 바람에…… 훈련장에 밤새 남겨진 때도 있었어요……."
1003902-36 = "날은 어두워지고, 비까지 내리기 시작하는데……"
1003902-37 = "아무도 제게 복귀하라는 명령을 내리지 않아서……."
1003902-38 = "……역시 제가 SRT 학원에서도 기억할 가치조차 없는 무능한 학생이라 그랬던 거겠죠."
1003902-39 = "그렇게 하나둘씩 잊히다가 끝내는 길가의 조약돌처럼 아무도 인지하지 못하는 하찮은 존재가 되어서……."
1003902-40 = "끝내는 비참하게 버려지고 잊혀질 거야……."
1003902-41 = "[s3] \"괜찮아. 잃어버려도 열심히 찾을게.\"\n[s4] \"게다가 내가 미유의 존재를 잊어버릴 일은 없으니까.\""
1003902-42 = "그, 그러게요. 선생님께서는 언제나 제가 있는 장소를 발견하고 먼저 다가와 주시니까요."
1003902-43 = "그, 그러게요. 선생님께서는 언제나 제가 있는 장소를 발견하고 먼저 다가와 주시니까요."
1003902-44 = "선생님과 있을 때는 조금 안심이 돼요……."
1003902-45 = "게다가 오늘은 선생님과 함께 있으니, 점원이 저를 몰라보지도 않을 테고……"
1003902-46 = "[s] \"아무리 존재감이 희박해도 그런 일은 없지 않을까?\""
1003902-47 = "아하하…… 오늘은 부디 그랬으면 좋겠네요……"
1003902-48 = "그, 그럼 캠핑용품을 받으러 가게로 갈까요……?"
1003902-50 = "(하지만 그 이후, 미유의 걱정은 현실로 드러나……)"
1003902-52 = "무엇을 도와드릴까요? 혼자서 오셨다면 이곳의 '솔로 캠핑 용품'을 추천……"
1003902-53 = "저…… 저랑 선생님, 같이 두 사람인데요……."
1003902-54 = "어, 어라? 어느 틈에 다른 손님이……?!"
1003902-62 = "(그 이후로도, 지나가며 행인들에게 끊임없이 부딪히고…….)"
1003902-63 = "미, 미안! 정말로 거기에 사람이 있는 줄 몰랐어!"
1003902-64 = "……괘, 괜찮아요. 존재감이 없는 제 탓이니까……."
1003902-66 = "(……끝내는 기계 장치에도 존재를 부정당하기에 이르렀다.)"
1003902-70 = "<발판 앞에 서면 문이 자동으로 열립니다. 발판 앞에 똑바로 서 주세요.>"
1003902-71 = "……"
1003902-72 = "이제는 자동문조차도 존재를 무시하고 있어……."
1003902-75 = "[ns] \"……고생이 많네.\""
1003902-76 = "……보셨죠? 저는 언제나 이래요……."
1003902-77 = "누구도 인지하지 못하고, 누구도 필요로 하지 않는……"
1003902-78 = "……존재감 제로의 쓸모없는 존재예요."
1003902-79 = "[s] \"그것도 일종의 재능이 아닐까?\""
1003902-80 = "……네? 존재감이 거의 없는 게 재능이라고요?"
1003902-81 = "저격 임무를 할 때를 제외하고는 존재감이 적어서 득이 된 경험은 거의 없는데요……."
1003902-82 = "이런 재능 같은 건 애초에……."
1003902-86 = "어라? 고양이 씨네요……."
1003902-87 = "귀여워라…… 털도 부드러워 보이네요……."
1003902-88 = "[s] \"잠깐, 그 고양이는…….\""
1003902-89 = "……네? 이 근처에서 흉포하기로 유명한 고양이라고요……?"
1003902-90 = "하지만 괜찮아 보이는걸요."
1003902-91 = "착하지. 이리 온……."
1003902-95 = "후후. 귀여워라……."
1003902-96 = "[s5] \"그 고양이를 쓰다듬는 데 성공하다니…….\"\n[s6] \"……부러워! 나도 쓰다듬어 주고 싶어!\""
1003902-97 = "……그러고 보면 저는 들짐승이 먼저 도망가거나 경계하는 모습을 한 번도 본 적이 없는 것 같아요."
1003902-98 = "……그러고 보면 저는 들짐승이 먼저 도망가거나 경계하는 모습을 한 번도 본 적이 없는 것 같아요."
1003902-99 = "이것도 다 제 존재감이 적은 덕분일까요……."
1003902-100 = "그게 사실이라면 선생님의 말씀처럼 이것도 재능일지도 모르겠네요."
1003902-101 = "이 재능이 없었더라면, 이 귀여운 고양이를 쓰다듬을 기회도 없었을 테니까요."
1003902-103 = "(이후, 미유와 함께 길고양이와 놀아주며 즐거운 시간을 보냈다.)"
