[translation]
1014103-1 = "An Unexpected Gift"
1014103-2 = "Schale Office"
1014103-3 = ""
1014103-4 = "H-Hello, Sensei."
1014103-5 = "I-Igusa Haruka, reporting for duty..."
1014103-6 = "[s1] \"Welcome, Haruka.\"\n[s2] \"I'm making coffee. Do you want some?\""
1014103-9 = "S-Sensei's precious hand-brewed coffee...?!"
1014103-10 = "Ah, th-that reminds me, I brought something too! "
1014103-11 = "Er... It's an offering for you, Sensei..."
1014103-12 = "[s] \"An offering?!\""
1014103-13 = "Yes, p-please take it!"
1014103-14 = ""
1014103-16 = ""
1014103-19 = "Haruka handed over an average-sized cardboard box."
1014103-21 = "Um... You seemed to like it before, Sensei..."
1014103-22 = "So I packed it in a box...and brought it..."
1014103-23 = "[s] \"Something...I liked...?\""
1014103-24 = ""
1014103-25 = "I didn't have a single idea what she could be referring to, but I went ahead and opened the box she gave me."
1014103-26 = ""
1014103-27 = "I was surprised to see..."
1014103-28 = ""
1014103-30 = ""
1014103-31 = "[ns] \"...A dress?\""
1014103-32 = ""
1014103-33 = "It was the dress Haruka had been wearing last time, folded neatly inside."
1014103-34 = "Yes, um, when we met at the exposition center entrance..."
1014103-35 = "You said the dress was pretty!"
1014103-36 = "Th-That's why I brought it! "
1014103-37 = "A-And I'm sure that you'd look really good in it, Sensei!"
1014103-38 = "[s] \"I would?!\""
1014103-39 = "Yes! P-Please feel free to wear it whenever you want!"
1014103-40 = "[s] \"You want me to WEAR it?!\""
1014103-41 = "And don't worry!"
1014103-42 = "I made sure that none of my scent or dirtiness was left on it! I dry cleaned it, then washed it, then dry cleaned it again, and then I ironed it!"
1014103-43 = "W-Wait... Am I being rude right now?!"
1014103-44 = "I can't believe I gifted you something I've already worn! I should've gotten you a new one!"
1014103-45 = "Actually, I did try to get you one! But I searched every market and department store in Kivotos, and I couldn't find the same exact one anywhere!"
1014103-46 = "Even the store that I bought it from didn't have it in stock anymore... "
1014103-47 = "So I thought I could just bring you mine... Which was stupid! Stupid!"
1014103-48 = "I-I'm sorry! If you don't want my gross rags, then I'll do whatever it takes to get you a new one! I'll raid the entire Black Market!"
1014103-49 = "[s3] \"No, no, no!\"\n[s4] \"I never said the DRESS was pretty to begin with!\""
1014103-52 = "Eh...?"
1014103-53 = "I-Is that so...?"
1014103-54 = "I'm pretty sure that's what I heard..."
1014103-55 = "A-Am I going crazy?! Maybe I was hallucinating...?!"
1014103-56 = "[s] \"No, you just have the subject wrong.\""
1014103-57 = ""
1014103-60 = "[ns] \"YOU were pretty wearing the dress, Haruka.\""
1014103-61 = "..."
1014103-62 = "Eeeeeeeh?!"
1014103-63 = "Th-Th-That's..."
1014103-64 = "I'm...pretty..."
1014103-65 = ""
1014103-67 = ""
1014103-68 = ""
1014103-70 = ""
1014103-71 = "I heard a long time ago that if I do this, I can wake up from a dream..."
1014103-72 = ""
1014103-74 = ""
1014103-75 = "[ns] \"S-Stop!!\""
1014103-76 = ""
1014103-78 = "It took some time, but I finally managed to calm Haruka down."
1014103-79 = "After I did, I returned the box to her."
1014103-81 = ""
1014103-82 = "[ns] \"If you don't believe me, see for yourself.\""
1014103-83 = "Eh? R-Right now...?"
1014103-84 = "Th-This is making me really nervous..."
1014103-85 = "But if that's what you want... Okay. I'll be right back."
1014103-86 = ""
1014103-88 = ""
1014103-93 = "A little bit later..."
1014103-94 = ""
1014103-100 = ""
1014103-101 = "Um... I changed into the dress..."
1014103-102 = "Huh?! Is this a full-length mirror...? When did it get here...?!"
1014103-103 = "[s] \"More importantly, look. What do you think?\""
1014103-104 = "E-Even if you ask me that..."
1014103-105 = "Um..."
1014103-106 = "Ughhhhh...!"
1014103-107 = "Uwaaaah...!"
