[translation]
1014103-1 = "예상 밖의 선물"
1014103-2 = "샬레 사무실"
1014103-4 = "아, 안녕하십니까, 선생님."
1014103-5 = "이, 이구사 하루카, 당번으로 출근했습니다……."
1014103-6 = "[s1] \"어서 와, 하루카.\"\n[s2] \"마침 커피 내리고 있었는데, 마실래?\""
1014103-9 = "서, 선생님이 직접 내리신 커피라니, 그 귀한 걸……!"
1014103-10 = "아, 그, 그러고 보니 저도 가져왔습니다!"
1014103-11 = "그…… 선생님께 드릴 상납품을……."
1014103-12 = "[s] \"상납?!\""
1014103-13 = "예, 부, 부디 이걸 받아주세요!"
1014103-19 = "(하루카가 건넨 것은 크지도 작지도 않은 종이 상자였다.)"
1014103-21 = "그…… 저번에 선생님께서 그걸 마음에 들어 하시던 것 같아서……."
1014103-22 = "포장을 해서…… 가져왔습니다……."
1014103-23 = "[s] \"내가…… 마음에 들어 하던 거……?\""
1014103-25 = "(도저히 감이 잡히지 않아, 일단 하루카가 준 상자를 열었다.)"
1014103-27 = "(그리고 그 안에 들어있던 건…….)"
1014103-31 = "[ns] \"……드레스?\""
1014103-33 = "(……하루카가 입던 드레스가, 말끔하게 접혀 들어가 있었다.)"
1014103-34 = "예, 그, 저번에 박람회장 입구에서 뵈었을 때……."
1014103-35 = "그, 그 드레스를 예쁘다고 말씀을 해 주셔서……."
1014103-36 = "그, 그래서 가져왔습니다!"
1014103-37 = "부, 분명 선생님한테도 잘 어울릴 테니까요……!"
1014103-38 = "[s] \"저한테요?!\""
1014103-39 = "예! 그리고 어, 얼마든지 편하게 입어 보셔도 돼요!"
1014103-40 = "[s] \"입어요?!\""
1014103-41 = "그리고 다른 건 걱정하지 않으셔도 돼요!"
1014103-42 = "제 체취가 배어 있을까 봐 드라이클리닝부터 다림질까지 전부 다 새로 했으니까요……!"
1014103-43 = "아, 아닌가……? 혹시 이거, 예의가 아닌 건가요?"
1014103-44 = "이런 경우에는 입던 옷이 아니라 새 옷을 사서 드리는 게 예의에 맞는 일인 건가요……!"
1014103-45 = "그렇지만 이것과 똑같은 드레스는 백화점과 시장을 뒤져도 찾을 수가 없어서……."
1014103-46 = "심지어 이걸 판매한 매장에도 같은 제품은 없고……."
1014103-47 = "그래서 제가 갖고 있던 것을 그대로 가져온 건데……."
1014103-48 = "죄, 죄송합니다! 마음에 들지 않으시면, 제가 블랙마켓을 통째로 털어서라도 새 드레스를……!"
1014103-49 = "[s3] \"아니 아니 아니!\"\n[s4] \"애초에 난 드레스를 예쁘다고 한 적이 없어!\""
1014103-52 = "예……?"
1014103-53 = "그, 그러신가요……?"
1014103-54 = "하지만, 그런 느낌으로 이야기하셨던 것 같은……."
1014103-55 = "서, 설마…… 저의 환청……?!"
1014103-56 = "[s] \"아냐, 예쁘다고 말하긴 했어.\""
1014103-60 = "[ns] \"드레스 말고, 드레스를 입은 하루카가.\""
1014103-61 = "……."
1014103-62 = "예에에에?!"
1014103-63 = "그, 그, 그런……"
1014103-64 = "제가…… 예쁘……."
1014103-71 = "예전에 들었어요, 이러면 꿈에서 깨어날 수 있다고……"
1014103-75 = "[ns] \"스, 스톱!!\""
1014103-78 = "(일단 하루카를 진정시킨 뒤…….)"
1014103-79 = "(하루카에게 상자를 돌려주며 말했다.)"
1014103-82 = "[ns] \"못 믿겠으면 한 번 직접 확인해 봐.\""
1014103-83 = "에? 지, 지금이요……?"
1014103-84 = "새삼 엄청 긴장되는데요……."
1014103-85 = "서, 선생님의 명령이라면…… 다녀오겠습니다."
1014103-93 = "(잠시 뒤.)"
1014103-101 = "그…… 입고 나왔습니다만……."
1014103-102 = "어?! 이건 전신거울……? 이런 건 언제……!"
1014103-103 = "[s] \"어때?\""
1014103-104 = "어, 어떻냐고 물어보셔도……."
1014103-105 = "그……."
1014103-106 = "으으우우우우……!"
1014103-107 = "흐아아아아……!"
1014103-112 = "(하루카는 얼굴이 빨개진 채로 사무실을 뛰쳐나가 버렸다…….)"
