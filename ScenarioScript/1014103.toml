[translation]
1014103-1 = "意料之外的禮物"
1014103-2 = "夏萊辦公室"
1014103-3 = ""
1014103-4 = "啊，您好，老師。"
1014103-5 = "伊，伊草遙香。來值勤報到了……"
1014103-6 = "[s1] 「歡迎你，遙香。」\n[s2] 「我剛好在煮咖啡，你要喝嗎？」"
1014103-9 = "老，老師親手煮的咖啡！？那麼珍貴的東西……！"
1014103-10 = "啊，這，這麼說來我也帶了東西過來！ "
1014103-11 = "那個……這是要獻給老師的貢品……"
1014103-12 = "[s] 「貢品！？」"
1014103-13 = "是的。請，請務必收下！"
1014103-14 = ""
1014103-16 = ""
1014103-19 = "（遙香遞來的是一個不大不小的紙盒）"
1014103-21 = "那個……之前老師好像挺中意的……"
1014103-22 = "所以我就包裝好……帶過來了……"
1014103-23 = "[s] 「我之前……中意的東西……？」"
1014103-24 = ""
1014103-25 = "（實在摸不著頭緒，總之先打開了遙香給的紙盒）"
1014103-26 = ""
1014103-27 = "（而裡面裝著的是……）"
1014103-28 = ""
1014103-30 = ""
1014103-31 = "[ns] 「……禮服？」"
1014103-32 = ""
1014103-33 = "（……遙香穿過的那件禮服，被整整齊齊地摺好放在裡面）"
1014103-34 = "是的。那個，上次在博覽會場入口見到您時……"
1014103-35 = "您，您說那件禮服很漂亮……"
1014103-36 = "所，所以我就帶來了！ "
1014103-37 = "這，這一定也很適合老師的……！"
1014103-38 = "[s] 「適合我！？」"
1014103-39 = "是的！而且，您，您可以盡情放心地試穿！"
1014103-40 = "[s] 「試穿！？」"
1014103-41 = "還有，其他方面您也都不用擔心！"
1014103-42 = "我怕上面會沾染我的體味，從乾洗到熨燙全都重新處理過了……！"
1014103-43 = "咦，不對嗎……？難道這樣不合禮節嗎？"
1014103-44 = "這種情況下，不是拿穿過的衣服，而是買一件全新的才合乎禮節嗎……！？"
1014103-45 = "可是跟這件一模一樣的禮服，就算翻遍百貨公司和市場也找不到……"
1014103-46 = "甚至連販售這件衣服的店家都沒有相同的商品…… "
1014103-47 = "所以我才把自己穿過的直接帶來了……"
1014103-48 = "對，對不起！如果您不喜歡，我就算把整個黑市翻過來也會弄件新的給您……！"
1014103-49 = "[s3] 「不不不！」\n[s4] 「我一開始就沒說過禮服很漂亮啊！？」"
1014103-52 = "咦……？"
1014103-53 = "是，是這樣嗎……？"
1014103-54 = "可是，您聽起來好像是那麼說的……"
1014103-55 = "難，難道說……是我的幻聽……！？"
1014103-56 = "[s] 「不，我確實說了很漂亮。」"
1014103-57 = ""
1014103-60 = "[ns] 「但不是禮服，是穿著禮服的遙香。」"
1014103-61 = "……"
1014103-62 = "咦咦咦咦！？"
1014103-63 = "怎，怎，怎麼可能……"
1014103-64 = "我很……漂亮……"
1014103-65 = ""
1014103-67 = ""
1014103-68 = ""
1014103-70 = ""
1014103-71 = "我以前聽說過，這樣做就能從夢中醒來……"
1014103-72 = ""
1014103-74 = ""
1014103-75 = "[ns] 「冷，冷靜點！！」"
1014103-76 = ""
1014103-78 = "（總之先讓遙香冷靜下來之後……）"
1014103-79 = "（我把紙盒還給遙香並說道……）"
1014103-81 = ""
1014103-82 = "[ns] 「不信的話，就自己親眼確認看看吧。」"
1014103-83 = "咦？現，現在嗎……？"
1014103-84 = "事到如今要再穿一次的話，還挺緊張的……"
1014103-85 = "不，不過如果是老師的命令……我立刻去換上。"
1014103-86 = ""
1014103-88 = ""
1014103-93 = "（過了一會……）"
1014103-94 = ""
1014103-100 = ""
1014103-101 = "那個……我換好了……"
1014103-102 = "咦！？這是全身鏡……？這種東西是什麼時候……！"
1014103-103 = "[s] 「怎麼樣？」"
1014103-104 = "您，您問我怎麼樣……"
1014103-105 = "那個……"
1014103-106 = "嗚嗚嗚嗚嗚……！"
1014103-107 = "呼啊啊啊啊……！"
1014103-108 = ""
1014103-110 = ""
1014103-112 = "（遙香就這樣紅著臉衝出了辦公室……） "
