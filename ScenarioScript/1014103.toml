[translation]
1014103-1 = "ของขวัญที่คาดไม่ถึง"
1014103-2 = "สำนักงานชาเล่ต์"
1014103-3 = ""
1014103-4 = "สะ... สวัสดีค่ะ คุณครู"
1014103-5 = "อะ... อิคุสะ ฮารุกะ มาเข้าเวรแล้วค่ะ..."
1014103-6 = "[s1] \"เข้ามาสิ ฮารุกะ เอากาแฟมั้ย?\"\n[s2] \"ครูกำลังดริปกาแฟอยู่เลย เอาสักแก้วมั้ย?\""
1014103-9 = "กะ... กาแฟที่คุณครูดริปให้เลยเหรอคะ เป็นของล้ำค่าเลย...!"
1014103-10 = "อ๊ะ จะ... จะว่าไป ฉันก็เตรียมมาด้วยเหมือนกันค่ะ! "
1014103-11 = "เอ่อ... ของบรรณาการที่จะให้คุณครู..."
1014103-12 = "[s] \"ของบรรณาการ?!\""
1014103-13 = "ใช่ค่ะ ดะ... ได้โปรดรับไว้ด้วยนะคะ!"
1014103-14 = ""
1014103-16 = ""
1014103-19 = "(ฮารุกะยื่นกล่องกระดาษขนาดไม่เล็กไปไม่ใหญ่ไปให้คุณครู)"
1014103-21 = "เอ่อ... ฉันคิดว่าคุณครูน่าจะถูกใจจากครั้งที่แล้ว..."
1014103-22 = "ก็เลยห่อเป็นของขวัญ... มาให้ค่ะ..."
1014103-23 = "[s] \"สิ่งที่ครูน่าจะ... ถูกใจงั้นเหรอ...?\""
1014103-24 = ""
1014103-25 = "(คุณครูคิดไม่ออกว่าคืออะไร จึงเปิดกล่องที่ได้รับจากฮารุกะดู)"
1014103-26 = ""
1014103-27 = "(และข้างในกล่องนั้นก็คือ...)"
1014103-28 = ""
1014103-30 = ""
1014103-31 = "[ns] \"ชุดเดรส...?\""
1014103-32 = ""
1014103-33 = "(ชุดเดรสที่ฮารุกะเคยใส่ถูกพับไว้อย่างเรียบร้อย)"
1014103-34 = "ค่ะ กะ... ก็ตอนเจอกันที่หน้าทางเข้าหอแสดงนิทรรศการเมื่อคราวก่อน..."
1014103-35 = "คะ... คุณครูบอกว่าชุดเดรสนี้สวย..."
1014103-36 = "ฉะ... ฉันเลยเอามาให้ค่ะ! "
1014103-37 = "มะ... มันต้องเหมาะกับคุณครูแน่นอนค่ะ!"
1014103-38 = "[s] \"กับครูเนี่ยนะ?!\""
1014103-39 = "ค่ะ! ยะ... หยิบมาใส่ได้บ่อยเท่าที่ต้องการเลยค่ะ!"
1014103-40 = "[s] \"ให้ครูใส่เนี่ยนะ?!\""
1014103-41 = "แล้วก็ไม่ต้องกังวลเรื่องอื่นนะคะ!"
1014103-42 = "ฉันกลัวว่าจะมีกลิ่นตัวของตัวเองติดอยู่ ก็เลยเอาไปส่งซักแห้งแล้วก็รีดมาใหม่ทั้งหมดแล้วค่ะ...!"
1014103-43 = "ระ... หรือว่าไม่ควรนะ...? แบบนี้มันเป็นการเสียมารยาทหรือเปล่าคะ?"
1014103-44 = "ในกรณีแบบนี้ ฉันไม่ควรเอาเสื้อผ้าที่เคยใส่แล้วมาให้ แต่ควรซื้อชุดใหม่ให้มากกว่า ถึงจะถูกหลักมารยาทใช่มั้ยคะ...?"
1014103-45 = "แต่ต่อให้หาทั่วทั้งห้างและในตลาดแล้ว ก็ไม่เจอชุดที่เหมือนกันเป๊ะๆ กับชุดนี้..."
1014103-46 = "แม้แต่ร้านที่ขายชุดนี้เองก็ยังไม่มีของเลยด้วยซ้ำ... "
1014103-47 = "ฉันเลยเอาชุดของตัวเองมามอบให้..."
1014103-48 = "ขะ... ขอโทษด้วยค่ะ! ถ้าคุณครูไม่ชอบ ฉันจะไปหาชุดใหม่ให้ค่ะ ต่อให้จะต้องไปถล่มตลาดมืดก็เถอะ...!"
1014103-49 = "[s3] \"ไม่ๆๆ!\"\n[s4] \"ครูไม่เคยบอกว่าชุดเดรสสวยสักหน่อย!\""
1014103-52 = "คะ...?"
1014103-53 = "งะ... งั้นเหรอคะ...?"
1014103-54 = "แต่ตอนนั้นเหมือนคุณครูจะสื่อแบบนั้นเลย..."
1014103-55 = "ยะ... อย่าบอกนะคะ... ว่าฉันหูฝาดไปเอง...?!"
1014103-56 = "[s] \"ไม่หรอก ที่จริงครูก็บอกว่าสวยจริงๆ\""
1014103-57 = ""
1014103-60 = "[ns] \"แต่ที่บอกว่าสวยน่ะไม่ใช่ชุด แต่เป็นฮารุกะต่างหาก\""
1014103-61 = "..."
1014103-62 = "คะ?!"
1014103-63 = "ตะ... ตะ... ตายจริง...!"
1014103-64 = "ฉัน... สวย..."
1014103-65 = ""
1014103-67 = ""
1014103-68 = ""
1014103-70 = ""
1014103-71 = "ฉันเคยได้ยินมาว่าถ้าทำแบบนี้ เราจะตื่นจากความฝันได้..."
1014103-72 = ""
1014103-74 = ""
1014103-75 = "[ns] \"สต็อป!!\""
1014103-76 = ""
1014103-78 = "(หลังจากทำให้ฮารุกะสงบลงได้...)"
1014103-79 = "(คุณครูก็คืนกล่องกระดาษให้ฮารุกะ แล้วพูดว่า)"
1014103-81 = ""
1014103-82 = "[ns] \"ถ้าไม่เชื่อ ก็ลองใส่แล้วดูด้วยตาของตัวเองสิ\""
1014103-83 = "คะ? ตะ... ตอนนี้น่ะเหรอคะ...?"
1014103-84 = "แต่ตอนนี้ฉันประหม่ามากเลย..."
1014103-85 = "ตะ... แต่ถ้าเป็นคำสั่งของคุณครูละก็... งั้นเดี๋ยวฉันมานะคะ"
1014103-86 = ""
1014103-88 = ""
1014103-93 = "(ครู่ต่อมา)"
1014103-94 = ""
1014103-100 = ""
1014103-101 = "เอ่อ... ไปใส่มาแล้วค่ะ..."
1014103-102 = "เอ๋?! นี่มันกระจกแบบเต็มตัว...? ไปเอาของแบบนี้มาตอนไหน...!"
1014103-103 = "[s] \"เป็นยังไงบ้าง?\""
1014103-104 = "ถะ... ถึงจะถามกันแบบนี้..."
1014103-105 = "เอ่อ..."
1014103-106 = "อึกกก...!"
1014103-107 = "ฮือออ...!"
1014103-108 = ""
1014103-110 = ""
1014103-112 = "(แล้วฮารุกะก็วิ่งออกจากห้องทำงานไปด้วยใบหน้าแดงก่ำ...) "
