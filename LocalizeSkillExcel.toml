3500805200-DescriptionJp = "最も近い味方1人に対して呪い状態を付与。\n呪い状態は攻撃力の[c][007eff]100%[-][/c]分のダメージ、攻撃力の[c][007eff]40%[-][/c]分の持続ダメージを付与、[c][007eff]10秒[-][/c]後に爆発し円形範囲内の味方に対して、攻撃力の[c][007eff]3250%[-][/c]分のダメージ\n呪い状態が付与された対象のHPが[c][007eff]100%[-][/c]だった場合、あるいは100%まで回復した場合にも、呪い状態は直ちに解除。\nさらに呪い状態の対象の被回復率を[c][007eff]3000[-][/c]増加（[c][007eff]10秒[-][/c]間）"
2670571865-NameJp = "獅子の救済"
2670571865-DescriptionJp = "円形範囲内の味方に対して、攻撃力の[c][007eff]90%[-][/c]分のダメージ"
401275505-NameJp = "砂漠の苦痛"
401275505-DescriptionJp = "[c][007eff]10秒[-][/c]毎に、すべての味方に対して攻撃力の[c][007eff]30%[-][/c]分のダメージ\nATGの値がMAXの場合、すべての味方に対して、不死身状態を付与（[c][007eff]10秒[-][/c]間）\nさらにHPの[c][007eff]1000%[-][/c]分のダメージを付与、\n被回復率を[c][007eff]2000[-][/c]増加（[c][007eff]10秒[-][/c]間）"
4248746328-NameJp = "苦行を経た悟り"
4248746328-DescriptionJp = "ヒエロニムスの防御貫通値を[c][007eff]750[-][/c]増加、爆発特効を[c][007eff]200%[-][/c]加算\nヒエロニムスの全ての攻撃が味方の遮蔽を無視"
3856097957-NameJp = "聖なる光（聖遺物）"
3856097957-DescriptionJp = "緑色の聖遺物のHPが[c][007eff]100%[-][/c]まで回復した時に発動し、以下の効果を付与\n- ヒエロニムスの被ダメージ量が[c][007eff]55%[-][/c]増加（最大で5回分まで効果が重複）\nその後、緑色の聖遺物の被回復率を[c][007eff]80%[-][/c]減少（[c][007eff]20秒[-][/c]間）\nウルガータの呪い状態が解除された場合、緑色の聖遺物のHPをすべて回復"
360347704-NameJp = "聖なる光（聖遺物）"
360347704-DescriptionJp = "赤色の聖遺物が召喚された後、ヒエロニムスの被ダメージが累積。[c][007eff]900万[-][/c]累積時、赤色の聖遺物を有効化\n赤色の聖遺物のHPを[c][007eff]100%[-][/c]回復時、スキルを発動して以下の効果を付与（最大5回）\n- 味方ストライカー生徒のコスト回復力を[c][007eff]2500[-][/c]増加（[c][007eff]5秒[-][/c]間）\n- ヒエロニムスがATGスキルを使用中の場合、グロッキー状態になる（[c][007eff]5秒[-][/c]間）\nその後、赤色の聖遺物を無効化\n（赤色の聖遺物はEXスキルでのみターゲットになる）"
